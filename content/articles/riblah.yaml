# Overview article (ADR 0007). Mainstream facts only; dates follow the Babylonian Chronicles (609, 605 BC) and give 587 or 586 BC for the fall of Jerusalem.
id: riblah
place: ab2bde8
title:
  en: "Riblah"
  ru: "Ривла"
  uk: "Рівла"
  es: "Ribla"
  pt: "Ribla"
  de: "Ribla"
  fr: "Ribla"
body:
  en:
    - "Riblah lay on the east bank of the Orontes, at the village of Rableh in western Syria near the Lebanese border, about 33 km south-south-west of Homs. It stood at a bend of the river, at the northern end of the valley between Lebanon and Anti-Lebanon, where a broad and fertile plain opens. Edward Robinson, who camped there in 1852, wrote that no one questioned its identity with biblical Riblah. Numbers names a Riblah on the eastern border of the promised land; whether that is the same place is disputed."
    - "The plain around Riblah had long been a crossroads and a battlefield. Tell Nebi Mend, ancient Kadesh, where Ramesses II fought the Hittites in the thirteenth century BC, is within sight about 12 km to the north. Water, grain and forage were at hand, and roads led from here north to the Euphrates and south to Palestine and Egypt, which made the place a natural camp for great armies."
    - 'In 609 BC Pharaoh Necho marched north to help the last Assyrian king against Babylon, as the Babylonian Chronicle also records; on the way he killed Josiah at Megiddo. Josiah''s son Jehoahaz reigned only three months before Necho "put him in bands at Riblah in the land of Hamath"; Necho set Eliakim on the throne as Jehoiakim and took Jehoahaz to Egypt, where he died. In 605 BC Nebuchadnezzar routed the Egyptians at Carchemish and took the whole region of Hamath. During the siege of Jerusalem he himself stayed at Riblah, and when the city fell in 587 or 586 BC Zedekiah was brought to him here: his sons were killed before his eyes, he was blinded and taken to Babylon. Nebuzaradan later brought the chief priest Seraiah and other leaders of Judah to Riblah, where the king had them put to death.'
    - "After this Riblah disappears from history. In the fourth century AD Eusebius knew Rebla only as the place in the land of Hamath where Pharaoh led Jehoahaz away, and Jerome took Riblah for Antioch. Robinson noted that Riblah does not appear in the lists of early church sees. The plain passed to the Seleucid kings and then to Roman Syria, whose chief city nearby was Emesa, the modern Homs."
  ru:
    - "Ривла лежала на восточном берегу Оронта, у селения Рабле на западе Сирии, близ границы с Ливаном, примерно в 33 км к юго-юго-западу от Хомса. Она стояла у изгиба реки, у северного конца долины между Ливаном и Антиливаном, где открывается широкая и плодородная равнина. Эдвард Робинсон, ставший здесь лагерем в 1852 г., писал, что её тождество с библейской Ривлой никто не оспаривает. Книга Чисел называет Риблу на восточной границе обетованной земли; то же ли это место — спорно."
    - "Равнина вокруг Ривлы издавна была перекрёстком дорог и полем битв. Примерно в 12 км к северу, в пределах видимости, стоит Телль-Неби-Менд — древний Кадеш, у которого Рамсес II сражался с хеттами в XIII веке до н. э. Вода, хлеб и корм для скота были под рукой, а дороги вели отсюда на север к Евфрату и на юг в Палестину и Египет, и потому место было естественным лагерем для больших армий."
    - "В 609 г. до н. э. фараон Нехао пошёл на север помогать последнему ассирийскому царю против Вавилона, о чём сообщает и Вавилонская хроника; по пути он умертвил Иосию в Мегиддоне. Сын Иосии Иоахаз царствовал лишь три месяца, а затем «задержал его фараон Нехао в Ривле, в земле Емафской»; Нехао воцарил Елиакима под именем Иоакима, а Иоахаза отвёл в Египет, где тот и умер. В 605 г. до н. э. Навуходоносор разбил египтян при Кархемисе и взял всю область Емафа. Во время осады Иерусалима он сам находился в Ривле, и когда город пал в 587 или 586 г. до н. э., к нему сюда привели Седекию: сыновей его закололи у него на глазах, а его ослепили и отвели в Вавилон. Позже Навузардан привёл в Ривлу первосвященника Сераию и других вождей Иудеи, и царь умертвил их."
    - "После этого Ривла исчезает из истории. В IV веке н. э. Евсевий знал Ривлу лишь как место в земле Емафской, откуда фараон увёл Иоахаза, а Иероним принимал Ривлу за Антиохию. Робинсон заметил, что Ривлы нет в списках ранних церковных кафедр. Равнина перешла к царям Селевкидам, а затем к римской Сирии, чьим главным городом поблизости была Эмеса — нынешний Хомс."
  uk:
    - "Рівла лежала на східному березі Оронту, біля села Рабле на заході Сирії поблизу ліванського кордону, приблизно за 33 км на південь-південний захід від Хомса. Вона стояла на вигині річки, на північному краї долини між Ліваном та Антиліваном, де відкривається широка й родюча рівнина. Едвард Робінсон, що таборував там 1852 року, писав, що ніхто не ставить під сумнів її тотожність із біблійною Рівлою. Книга Чисел називає Рівлу на східному кордоні обітованої землі; чи це те саме місце, спірно."
    - "Рівнина навколо Рівли давно була перехрестям і полем битв. Телль-Неби-Менд, давній Кадеш, де Рамсес II бився з хеттами в XIII ст. до н. е., лежить на видноколі приблизно за 12 км на північ. Вода, зерно й фураж були під рукою, а дороги вели звідси на північ до Євфрату й на південь до Палестини та Єгипту, що робило це місце природним табором для великих армій."
    - "У 609 р. до н. е. фараон Нехао рушив на північ допомогти останньому ассирійському цареві проти Вавилона, як фіксує й Вавилонська хроніка; дорогою він убив Йосію в Мегіддо. Син Йосії Йоахаз царював лише три місяці, перш ніж Нехао «задержав його в неволї в Ривлї, в країнї Ематській»; Нехао посадив на престол Еліакіма як Йоакима, а Йоахаза забрав до Єгипту, де той помер. У 605 р. до н. е. Навуходоносор розбив єгиптян під Каркемишем і взяв увесь край Хамата. Під час облоги Єрусалима він сам перебував у Рівлі, і коли місто впало в 587 або 586 р. до н. е., Седекію привели до нього сюди: його синів убили на його очах, а його самого осліпили й відвели до Вавилона. Навузардан пізніше привів до Рівли головного священика Сераїю й інших вождів Юди, де цар наказав їх стратити."
    - "Після цього Рівла зникає з історії. У IV ст. н. е. Євсевій знав Ревлу лише як місце в краї Хамата, куди фараон відвів Йоахаза, а Єронім вважав Рівлу за Антіохію. Робінсон зауважив, що Рівла не фігурує в списках ранніх церковних кафедр. Рівнина перейшла до Селевкідів, а потім до римської Сирії, головним містом якої поблизу була Емеса, сучасний Хомс."
  es:
    - "Ribla estaba en la orilla oriental del Orontes, en la aldea de Rableh, en el oeste de Siria, cerca de la frontera libanesa, a unos 33 km al sur-suroeste de Homs. Se alzaba en un recodo del río, en el extremo norte del valle entre el Líbano y el Antilíbano, donde se abre una llanura ancha y fértil. Edward Robinson, que acampó allí en 1852, escribió que nadie ponía en duda su identidad con la Ribla bíblica. Números nombra una Ribla en la frontera oriental de la tierra prometida; si es el mismo lugar se discute."
    - "La llanura en torno a Ribla fue durante mucho tiempo encrucijada y campo de batalla. Tell Nebi Mend, la antigua Cades, donde Ramsés II combatió a los hititas en el siglo XIII a. C., está a la vista, a unos 12 km al norte. Había agua, grano y forraje a mano, y desde aquí los caminos llevaban al norte hasta el Éufrates y al sur hasta Palestina y Egipto, lo que hacía del lugar un campamento natural para grandes ejércitos."
    - "En 609 a. C. el faraón Necao marchó al norte para ayudar al último rey asirio contra Babilonia, como registra también la Crónica babilónica; de camino mató a Josías en Meguido. Joacaz, hijo de Josías, reinó solo tres meses; luego, según el texto, «echólo preso Faraón Nechâo en Ribla en la provincia de Hamath»; Necao puso en el trono a Eliaquim como Joacim y se llevó a Joacaz a Egipto, donde murió. En 605 a. C. Nabucodonosor derrotó a los egipcios en Carquemis y tomó toda la región de Hamat. Durante el asedio de Jerusalén él mismo permaneció en Ribla, y cuando la ciudad cayó en 587 o 586 a. C., Sedequías le fue traído aquí: sus hijos fueron muertos ante sus ojos, él fue cegado y llevado a Babilonia. Nabuzaradán trajo más tarde a Ribla al sumo sacerdote Seraías y a otros jefes de Judá, donde el rey los hizo ejecutar."
    - "Después de esto Ribla desaparece de la historia. En el siglo IV d. C. Eusebio conocía Rebla solo como el lugar en la tierra de Hamat adonde el faraón llevó preso a Joacaz, y Jerónimo tomó Ribla por Antioquía. Robinson notó que Ribla no figura en las listas de sedes de la Iglesia primitiva. La llanura pasó a los reyes seléucidas y luego a la Siria romana, cuya ciudad principal cercana era Emesa, la actual Homs."
  pt:
    - "Ribla ficava na margem leste do Orontes, na aldeia de Rableh, no oeste da Síria, perto da fronteira libanesa, a cerca de 33 km a su-sudoeste de Homs. Ficava numa curva do rio, na ponta norte do vale entre o Líbano e o Anti-Líbano, onde se abre uma ampla e fértil planície. Edward Robinson, que acampou ali em 1852, escreveu que ninguém punha em dúvida sua identidade com a Ribla bíblica. Números nomeia uma Ribla na fronteira oriental da terra prometida; se é o mesmo lugar, é disputado."
    - "A planície em torno de Ribla fora havia muito tempo uma encruzilhada e um campo de batalha. Tell Nebi Mend, a antiga Cades, onde Ramessés II lutou contra os hititas no século XIII a.C., fica à vista, a cerca de 12 km ao norte. Água, grãos e forragem estavam à mão, e estradas levavam daqui ao norte, ao Eufrates, e ao sul, à Palestina e ao Egito, o que fazia do lugar um acampamento natural para grandes exércitos."
    - "Em 609 a.C. o faraó Neco marchou para o norte para ajudar o último rei assírio contra a Babilônia, como também registra a Crônica Babilônica; no caminho matou Josias em Megido. O filho de Josias, Jeoacaz, reinou apenas três meses antes que Neco “o colocou em correntes em Ribla, na terra de Hamate”; Neco pôs Eliaquim no trono como Jeoaquim e levou Jeoacaz ao Egito, onde morreu. Em 605 a.C. Nabucodonosor derrotou os egípcios em Carquemis e tomou toda a região de Hamate. Durante o cerco de Jerusalém ele próprio ficou em Ribla, e quando a cidade caiu, em 587 ou 586 a.C., Zedequias lhe foi trazido aqui: seus filhos foram mortos diante de seus olhos, ele foi cegado e levado à Babilônia. Nebuzaradã trouxe mais tarde a Ribla o sumo sacerdote Seraías e outros chefes de Judá, onde o rei os mandou matar."
    - "Depois disso Ribla desaparece da história. No século IV d.C., Eusébio conhecia Rebla apenas como o lugar na terra de Hamate onde o Faraó levou Jeoacaz, e Jerônimo tomou Ribla por Antioquia. Robinson notou que Ribla não aparece nas listas das antigas sedes episcopais. A planície passou aos reis selêucidas e depois à Síria romana, cuja principal cidade nas proximidades era Emesa, a atual Homs."
  de:
    - "Ribla lag am Ostufer des Orontes, beim Dorf Rableh in Westsyrien nahe der libanesischen Grenze, etwa 33 km südsüdwestlich von Homs. Es stand an einer Flussbiegung, am Nordende des Tals zwischen Libanon und Antilibanon, wo sich eine breite, fruchtbare Ebene öffnet. Edward Robinson, der 1852 dort lagerte, schrieb, niemand bezweifle seine Gleichheit mit dem biblischen Ribla. Die Numeri nennen ein Ribla an der Ostgrenze des verheißenen Landes; ob das derselbe Ort ist, ist umstritten."
    - "Die Ebene um Ribla war lange ein Kreuzungspunkt und Schlachtfeld. Tell Nebi Mend, das antike Kadesch, wo Ramses II. im 13. Jahrhundert v. Chr. gegen die Hethiter kämpfte, liegt etwa 12 km nördlich in Sichtweite. Wasser, Getreide und Futter waren zur Hand, und von hier führten Straßen nach Norden zum Euphrat und nach Süden nach Palästina und Ägypten, was den Ort zu einem natürlichen Lager für große Heere machte."
    - "Im Jahr 609 v. Chr. zog Pharao Necho nach Norden, um dem letzten assyrischen König gegen Babylon zu helfen, wie auch die Babylonische Chronik verzeichnet; unterwegs tötete er Josia bei Megiddo. Josias Sohn Joahas regierte nur drei Monate, bevor Necho „ihn ins Gefängnis zu Ribla im Lande Hamath“ legte; Necho setzte Eljakim als Jojakim auf den Thron und brachte Joahas nach Ägypten, wo er starb. Im Jahr 605 v. Chr. schlug Nebukadnezar die Ägypter bei Karkemisch und nahm das ganze Gebiet von Hamat. Während der Belagerung Jerusalems hielt er selbst sich in Ribla auf, und als die Stadt 587 oder 586 v. Chr. fiel, wurde Zedekia hier vor ihn gebracht: Seine Söhne wurden vor seinen Augen getötet, er wurde geblendet und nach Babylon gebracht. Nebusaradan brachte später den Oberpriester Seraja und andere Führer Judas nach Ribla, wo der König sie hinrichten ließ."
    - "Danach verschwindet Ribla aus der Geschichte. Im 4. Jahrhundert n. Chr. kannte Eusebius Rebla nur als den Ort im Land Hamat, wohin Pharao Joahas führte, und Hieronymus hielt Ribla für Antiochia. Robinson bemerkte, dass Ribla in den Listen früher Bischofssitze nicht vorkommt. Die Ebene fiel an die Seleukidenkönige und dann an das römische Syrien, dessen Hauptstadt in der Nähe Emesa war, das heutige Homs."
  fr:
    - "Ribla se trouvait sur la rive orientale de l’Oronte, au village de Rableh, dans l’ouest de la Syrie près de la frontière libanaise, à environ 33 km au sud-sud-ouest de Homs. Elle s’élevait à un coude du fleuve, à l’extrémité nord de la vallée entre le Liban et l’Anti-Liban, où s’ouvre une large et fertile plaine. Edward Robinson, qui y campa en 1852, écrivit que nul ne contestait son identité avec la Ribla biblique. Les Nombres nomment une Ribla sur la frontière orientale de la terre promise ; est-ce le même lieu, c’est disputé."
    - "La plaine autour de Ribla fut longtemps un carrefour et un champ de bataille. Tell Nebi Mend, l’antique Qadesh, où Ramsès II combattit les Hittites au XIIIe siècle av. J.-C., est en vue à environ 12 km au nord. Eau, grain et fourrage étaient à portée, et des routes menaient d’ici au nord vers l’Euphrate et au sud vers la Palestine et l’Égypte, ce qui faisait du lieu un camp naturel pour de grandes armées."
    - "En 609 av. J.-C., le pharaon Néco marcha vers le nord pour aider le dernier roi assyrien contre Babylone, comme le consigne aussi la Chronique babylonienne ; en chemin il tua Josias à Meguiddo. Le fils de Josias, Joachaz, ne régna que trois mois : Pharaon Néco « l’enchaîna à Ribla, dans le pays de Hamath » ; Néco établit Éliakim roi sous le nom de Jojakim et emmena Joachaz en Égypte, où il mourut. En 605 av. J.-C., Nebucadnetsar écrasa les Égyptiens à Carkemisch et prit toute la région de Hamath. Pendant le siège de Jérusalem, il resta lui-même à Ribla, et quand la ville tomba en 587 ou 586 av. J.-C., Sédécias lui fut amené ici : ses fils furent tués sous ses yeux, il fut aveuglé et emmené à Babylone. Nebuzaradan amena plus tard à Ribla le grand prêtre Seraja et d’autres chefs de Juda, que le roi fit mettre à mort."
    - "Après cela, Ribla disparaît de l’histoire. Au IVe siècle apr. J.-C., Eusèbe ne connaissait Rebla que comme le lieu du pays de Hamath où Pharaon emmena Joachaz, et Jérôme prit Ribla pour Antioche. Robinson nota que Ribla ne figure pas dans les listes des sièges ecclésiastiques anciens. La plaine passa aux rois séleucides puis à la Syrie romaine, dont la principale ville voisine était Émèse, l’actuelle Homs."
