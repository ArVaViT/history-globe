# Overview article (ADR 0007). Mainstream facts only; the identification of Mizpah is named as disputed, the Iron Age periods follow the Tell en-Nasbeh reports.
id: mizpah
place: a736f6c
title:
  en: "Mizpah"
  ru: "Массифа"
body:
  en:
    - 'Mizpah of Benjamin, whose name means "watchtower", is usually identified with Tell en-Nasbeh, a low hill beside the ancient road running north from Jerusalem, about 12 km from the city. The main alternative is Nebi Samwil, the high hill north-west of Jerusalem where a later tradition placed the tomb of Samuel. Tell en-Nasbeh was excavated in 1926–1935 by William F. Badè. A small village stood there about 3500–3300 BC; after a long gap settlement resumed in the Iron Age, and by the ninth century BC it was a town with a massive wall and gate on the border between Judah and Israel.'
    - 'In Judges all Israel gathered "unto the LORD in Mizpeh" before making war on Benjamin. Samuel called the people here to fast and pray; when the Philistines attacked, they were routed, and Samuel set up the stone Eben-ezer between Mizpeh and Shen. Mizpah was one of the towns of his yearly circuit, and here Saul was chosen king by lot. When Baasha of Israel fortified Ramah, Asa of Judah carried off its stones and built Geba and Mizpah with them; the great wall of Tell en-Nasbeh is often linked with this work.'
    - "After Nebuchadnezzar destroyed Jerusalem in 587 or 586 BC, Mizpah became the seat of Gedaliah, whom the king of Babylon made governor, and Jeremiah came to live with him there. Ishmael son of Nethaniah, of the royal house, killed Gedaliah at Mizpah together with the Jews and Chaldeans who were with him. The excavations fit this picture: the town was not destroyed with Jerusalem and flourished in the sixth century BC. A seal found there names its owner as Jaazaniah, servant of the king; some identify him with the Jaazaniah who came to Gedaliah, but this is uncertain. In Nehemiah's day the men of Mizpah and its rulers helped to rebuild the walls of Jerusalem."
    - "About 165 BC Judas Maccabeus gathered his men at Mizpah, opposite Jerusalem, to fast and pray before the battle at Emmaus. Pottery and coins show that Tell en-Nasbeh was still lived on in Hellenistic times; later tombs and the floor of a Byzantine church point to a smaller settlement. By the fourth century the site of the biblical town seems to have been forgotten: Eusebius places the Mizpah where Samuel judged the people near Kiriath-jearim."
  ru:
    - "Массифа Вениаминова, чьё имя означает «сторожевая башня», обычно отождествляется с Телль-эн-Насбе — невысоким холмом у древней дороги, ведущей из Иерусалима на север, примерно в 12 км от города. Главная альтернатива — Неби-Самуил, высокий холм к северо-западу от Иерусалима, где позднее предание поместило гробницу Самуила. Телль-эн-Насбе раскапывал в 1926–1935 гг. Уильям Бейд. Около 3500–3300 гг. до н. э. здесь стояла небольшая деревня; после долгого перерыва жизнь возобновилась в железном веке, и к IX веку до н. э. это был город с мощной стеной и воротами на границе Иудеи и Израиля."
    - "В Книге Судей все сыны Израилевы собрались «пред Господа в Массифу», прежде чем пойти войной на Вениамина. Самуил созвал сюда народ для поста и молитвы; когда напали филистимляне, они были разбиты, и Самуил поставил камень Авен-Езер между Массифою и Сеном. Массифа была одним из городов, которые он обходил из года в год, и здесь Саул был избран царём по жребию. Когда Вааса, царь Израильский, стал укреплять Раму, Аса, царь Иудейский, вывез её камни и выстроил из них Гиву Вениаминову и Массифу; с этой стройкой часто связывают большую стену Телль-эн-Насбе."
    - "После того как Навуходоносор разрушил Иерусалим в 587 или 586 г. до н. э., Массифа стала резиденцией Годолии, которого царь Вавилонский поставил начальником, и Иеремия пришёл жить к нему туда. Исмаил, сын Нафании, из царского рода, убил Годолию в Массифе вместе с Иудеями и Халдеями, бывшими с ним. Раскопки согласуются с этой картиной: город не был разрушен вместе с Иерусалимом и процветал в VI веке до н. э. Найденная здесь печать называет своего владельца Иезанию слугой царя; некоторые видят в нём Иезанию, приходившего к Годолии, но это не точно. Во дни Неемии жители Массифы и её начальники помогали восстанавливать стены Иерусалима."
    - "Около 165 г. до н. э. Иуда Маккавей собрал своих людей в Массифе, напротив Иерусалима, для поста и молитвы перед битвой при Эммаусе. Керамика и монеты показывают, что на Телль-эн-Насбе жили и в эллинистическое время; более поздние гробницы и пол византийской церкви говорят о меньшем поселении. К IV веку место библейского города, по-видимому, было забыто: Евсевий помещает Массифу, где Самуил судил народ, близ Кириаф-Иарима."
