# Overview article (ADR 0007). Mainstream facts only; the identification of Mizpah is named as disputed, the Iron Age periods follow the Tell en-Nasbeh reports.
id: mizpah
place: a736f6c
title:
  en: "Mizpah"
  ru: "Массифа"
  uk: "Міцпа"
  es: "Mizpa"
  pt: "Mispá"
  de: "Mizpa"
  fr: "Mitspa"
  it: "Mizpa"
  pl: "Mispa"
  nl: "Mizpa"
  cs: "Micpa"
body:
  en:
    - 'Mizpah of Benjamin, whose name means "watchtower", is usually identified with Tell en-Nasbeh, a low hill beside the ancient road running north from Jerusalem, about 12 km from the city. The main alternative is Nebi Samwil, the high hill north-west of Jerusalem where a later tradition placed the tomb of Samuel. Tell en-Nasbeh was excavated in 1926–1935 by William F. Badè. A small village stood there about 3500–3300 BC; after a long gap settlement resumed in the Iron Age, and by the ninth century BC it was a town with a massive wall and gate on the border between Judah and Israel.'
    - 'In Judges all Israel gathered "unto the LORD in Mizpeh" before making war on Benjamin. Samuel called the people here to fast and pray; when the Philistines attacked, they were routed, and Samuel set up the stone Eben-ezer between Mizpeh and Shen. Mizpah was one of the towns of his yearly circuit, and here Saul was chosen king by lot. When Baasha of Israel fortified Ramah, Asa of Judah carried off its stones and built Geba and Mizpah with them; the great wall of Tell en-Nasbeh is often linked with this work.'
    - "After Nebuchadnezzar destroyed Jerusalem in 587 or 586 BC, Mizpah became the seat of Gedaliah, whom the king of Babylon made governor, and Jeremiah came to live with him there. Ishmael son of Nethaniah, of the royal house, killed Gedaliah at Mizpah together with the Jews and Chaldeans who were with him. The excavations fit this picture: the town was not destroyed with Jerusalem and flourished in the sixth century BC. A seal found there names its owner as Jaazaniah, servant of the king; some identify him with the Jaazaniah who came to Gedaliah, but this is uncertain. In Nehemiah's day the men of Mizpah and its rulers helped to rebuild the walls of Jerusalem."
    - "About 165 BC Judas Maccabeus gathered his men at Mizpah, opposite Jerusalem, to fast and pray before the battle at Emmaus. Pottery and coins show that Tell en-Nasbeh was still lived on in Hellenistic times; later tombs and the floor of a Byzantine church point to a smaller settlement. By the fourth century the site of the biblical town seems to have been forgotten: Eusebius places the Mizpah where Samuel judged the people near Kiriath-jearim."
  ru:
    - "Массифа Вениаминова, чьё имя означает «сторожевая башня», обычно отождествляется с Телль-эн-Насбе — невысоким холмом у древней дороги, ведущей из Иерусалима на север, примерно в 12 км от города. Главная альтернатива — Неби-Самуил, высокий холм к северо-западу от Иерусалима, где позднее предание поместило гробницу Самуила. Телль-эн-Насбе раскапывал в 1926–1935 гг. Уильям Бейд. Около 3500–3300 гг. до н. э. здесь стояла небольшая деревня; после долгого перерыва жизнь возобновилась в железном веке, и к IX веку до н. э. это был город с мощной стеной и воротами на границе Иудеи и Израиля."
    - "В Книге Судей все сыны Израилевы собрались «пред Господа в Массифу», прежде чем пойти войной на Вениамина. Самуил созвал сюда народ для поста и молитвы; когда напали филистимляне, они были разбиты, и Самуил поставил камень Авен-Езер между Массифою и Сеном. Массифа была одним из городов, которые он обходил из года в год, и здесь Саул был избран царём по жребию. Когда Вааса, царь Израильский, стал укреплять Раму, Аса, царь Иудейский, вывез её камни и выстроил из них Гиву Вениаминову и Массифу; с этой стройкой часто связывают большую стену Телль-эн-Насбе."
    - "После того как Навуходоносор разрушил Иерусалим в 587 или 586 г. до н. э., Массифа стала резиденцией Годолии, которого царь Вавилонский поставил начальником, и Иеремия пришёл жить к нему туда. Исмаил, сын Нафании, из царского рода, убил Годолию в Массифе вместе с Иудеями и Халдеями, бывшими с ним. Раскопки согласуются с этой картиной: город не был разрушен вместе с Иерусалимом и процветал в VI веке до н. э. Найденная здесь печать называет своего владельца Иезанию слугой царя; некоторые видят в нём Иезанию, приходившего к Годолии, но это не точно. Во дни Неемии жители Массифы и её начальники помогали восстанавливать стены Иерусалима."
    - "Около 165 г. до н. э. Иуда Маккавей собрал своих людей в Массифе, напротив Иерусалима, для поста и молитвы перед битвой при Эммаусе. Керамика и монеты показывают, что на Телль-эн-Насбе жили и в эллинистическое время; более поздние гробницы и пол византийской церкви говорят о меньшем поселении. К IV веку место библейского города, по-видимому, было забыто: Евсевий помещает Массифу, где Самуил судил народ, близ Кириаф-Иарима."
  uk:
    - "Міцпу Веніяміна, чия назва означає «сторожова вежа», зазвичай ототожнюють із Телль-ен-Насбехом, низьким пагорбом біля давньої дороги, що йде на північ від Єрусалима, приблизно за 12 км від міста. Головна альтернатива — Неби-Самуїл, високий пагорб на північний захід від Єрусалима, де пізніша традиція розмістила гробницю Самуїла. Телль-ен-Насбех розкопував 1926–1935 рр. Вільям Ф. Баде. Невелике село стояло там близько 3500–3300 рр. до н. е.; після тривалої перерви заселення поновилося в залізну добу, і до IX ст. до н. е. це було місто з масивним муром і брамою на межі Юди та Ізраїлю."
    - "У Книзі Суддів увесь Ізраїль зібрався «перед Господом у Массифі» перед війною з Веніяміном. Самуїл покликав сюди народ на піст і молитву; коли філістимляни напали, їх розбили, і Самуїл поставив камінь Авен-Езер між Міцпою і Сеном. Міцпа була одним з міст його щорічного обходу, і тут Саула було обрано царем жеребом. Коли Вааса Ізраїльський укріпив Раму, Аса Юдейський вивіз її каміння й збудував ним Гебу і Міцпу; великий мур Телль-ен-Насбеха часто пов’язують із цією роботою."
    - "Після того як Навуходоносор зруйнував Єрусалим 587 або 586 р. до н. е., Міцпа стала осідком Гедалії, якого цар Вавилону зробив правителем, і Єремія прийшов жити з ним там. Ізмаїл, син Нетанії, з царського роду, убив Гедалію в Міцпі разом з юдеями й халдеями, що були з ним. Розкопки пасують цій картині: місто не було зруйноване разом з Єрусалимом і процвітало в VI ст. до н. е. Печатка, знайдена там, називає власника Язанією, слугою царя; дехто ототожнює його з Язанією, що прийшов до Гедалії, але це непевно. За Неемії мужі Міцпи та її правителі допомагали відбудовувати мури Єрусалима."
    - "Близько 165 р. до н. е. Юда Макавей зібрав своїх людей у Міцпі, навпроти Єрусалима, на піст і молитву перед битвою при Еммаусі. Кераміка й монети показують, що Телль-ен-Насбех ще був населений в елліністичні часи; пізніші гробниці та підлога візантійської церкви вказують на менше поселення. До IV ст. місце біблійного міста, схоже, було забуте: Євсевій розміщує Міцпу, де Самуїл судив народ, поблизу Кіріят-Єарима."
  es:
    - "Mizpa de Benjamín, cuyo nombre significa «atalaya», se identifica habitualmente con Tell en-Nasbeh, una colina baja junto al antiguo camino que va al norte desde Jerusalén, a unos 12 km de la ciudad. La principal alternativa es Nebi Samwil, la alta colina al noroeste de Jerusalén donde una tradición posterior situó la tumba de Samuel. Tell en-Nasbeh fue excavado en 1926–1935 por William F. Badè. Una pequeña aldea se alzó allí hacia 3500–3300 a. C.; tras un largo hiato, el poblamiento se reanudó en la Edad del Hierro, y en el siglo IX a. C. era una ciudad con una muralla y una puerta macizas en la frontera entre Judá e Israel."
    - "En Jueces todo Israel se reunió «á Jehová en Mizpa» antes de hacer la guerra a Benjamín. Samuel convocó aquí al pueblo para ayunar y orar; cuando los filisteos atacaron, fueron derrotados, y Samuel erigió la piedra Eben-ezer entre Mizpa y Sen. Mizpa era una de las ciudades de su circuito anual, y aquí fue elegido Saúl rey por suertes. Cuando Baasa de Israel fortificó Ramá, Asa de Judá se llevó sus piedras y con ellas construyó Geba y Mizpa; la gran muralla de Tell en-Nasbeh se vincula a menudo con esta obra."
    - "Después de que Nabucodonosor destruyera Jerusalén en 587 o 586 a. C., Mizpa se convirtió en la sede de Gedalías, a quien el rey de Babilonia hizo gobernador, y Jeremías fue a vivir con él allí. Ismael, hijo de Netanías, de la casa real, mató a Gedalías en Mizpa junto con los judíos y caldeos que estaban con él. Las excavaciones concuerdan con este cuadro: la ciudad no fue destruida con Jerusalén y prosperó en el siglo VI a. C. Un sello hallado allí nombra a su dueño como Jaazanías, siervo del rey; algunos lo identifican con el Jaazanías que acudió a Gedalías, pero es incierto. En tiempos de Nehemías los hombres de Mizpa y sus gobernantes ayudaron a reconstruir los muros de Jerusalén."
    - "Hacia 165 a. C. Judas Macabeo reunió a sus hombres en Mizpa, frente a Jerusalén, para ayunar y orar antes de la batalla de Emaús. La cerámica y las monedas muestran que Tell en-Nasbeh seguía habitado en época helenística; tumbas posteriores y el suelo de una iglesia bizantina apuntan a un asentamiento menor. En el siglo IV el emplazamiento de la ciudad bíblica parece haberse olvidado: Eusebio sitúa la Mizpa donde Samuel juzgó al pueblo cerca de Quiriat-jearim."
  pt:
    - "Mispá de Benjamim, cujo nome significa “torre de vigia”, é geralmente identificada com Tell en-Nasbeh, uma colina baixa junto à antiga estrada que corre para o norte a partir de Jerusalém, a cerca de 12 km da cidade. A principal alternativa é Nebi Samwil, a colina alta a noroeste de Jerusalém onde uma tradição posterior pôs o túmulo de Samuel. Tell en-Nasbeh foi escavada em 1926–1935 por William F. Badè. Uma pequena aldeia existiu ali por volta de 3500–3300 a.C.; depois de uma longa lacuna, o povoamento recomeçou na Idade do Ferro, e no século IX a.C. era uma cidade com uma maciça muralha e portão na fronteira entre Judá e Israel."
    - "Em Juízes, todo o Israel se reuniu “perante o SENHOR em Mispá” antes de fazer guerra a Benjamim. Samuel convocou aqui o povo para jejuar e orar; quando os filisteus atacaram, foram derrotados, e Samuel erigiu a pedra Ebenézer entre Mispá e Sem. Mispá era uma das cidades de seu circuito anual, e aqui Saul foi escolhido rei por sorteio. Quando Baasa de Israel fortificou Ramá, Asa de Judá levou suas pedras e com elas construiu Geba e Mispá; a grande muralha de Tell en-Nasbeh é muitas vezes ligada a essa obra."
    - "Depois que Nabucodonosor destruiu Jerusalém em 587 ou 586 a.C., Mispá tornou-se a sede de Gedalias, a quem o rei da Babilônia fez governador, e Jeremias veio morar com ele ali. Ismael, filho de Netanias, da casa real, matou Gedalias em Mispá junto com os judeus e caldeus que estavam com ele. As escavações combinam com esse quadro: a cidade não foi destruída com Jerusalém e floresceu no século VI a.C. Um selo achado ali nomeia seu dono como Jazanias, servo do rei; alguns o identificam com o Jazanias que veio a Gedalias, mas isso é incerto. No tempo de Neemias, os homens de Mispá e seus governantes ajudaram a reconstruir os muros de Jerusalém."
    - "Por volta de 165 a.C., Judas Macabeu reuniu seus homens em Mispá, defronte de Jerusalém, para jejuar e orar antes da batalha de Emaús. Cerâmica e moedas mostram que Tell en-Nasbeh ainda era habitada em tempos helenísticos; túmulos posteriores e o piso de uma igreja bizantina apontam um povoado menor. No século IV o sítio da cidade bíblica parece ter sido esquecido: Eusébio situa a Mispá onde Samuel julgou o povo perto de Quiriate-Jearim."
  de:
    - "Mizpa in Benjamin, dessen Name „Warte“ bedeutet, wird meist mit Tell en-Nasbeh gleichgesetzt, einem niedrigen Hügel an der alten Straße, die von Jerusalem nach Norden führt, etwa 12 km von der Stadt. Die wichtigste Alternative ist Nebi Samwil, der hohe Hügel nordwestlich von Jerusalem, wo eine spätere Überlieferung das Grab Samuels ansetzte. Tell en-Nasbeh wurde 1926–1935 von William F. Badè ausgegraben. Ein kleines Dorf stand dort um 3500–3300 v. Chr.; nach einer langen Lücke setzte die Besiedlung in der Eisenzeit wieder ein, und im 9. Jahrhundert v. Chr. war es eine Stadt mit einer massiven Mauer und einem Tor an der Grenze zwischen Juda und Israel."
    - "Im Buch der Richter versammelte sich ganz Israel „zu dem HERRN gen Mizpa“, ehe es gegen Benjamin Krieg führte. Samuel rief das Volk hier zu Fasten und Gebet; als die Philister angriffen, wurden sie in die Flucht geschlagen, und Samuel stellte den Stein Eben-Ezer zwischen Mizpa und Schen auf. Mizpa war eine der Stationen seines jährlichen Rundgangs, und hier wurde Saul durch das Los zum König gewählt. Als Baesa von Israel Rama befestigte, trug Asa von Juda dessen Steine ab und baute damit Geba und Mizpa; die große Mauer von Tell en-Nasbeh wird oft mit diesem Werk verbunden."
    - "Nachdem Nebukadnezar Jerusalem 587 oder 586 v. Chr. zerstört hatte, wurde Mizpa Sitz Gedaljas, den der König von Babel zum Statthalter machte, und Jeremia kam, um bei ihm zu leben. Ismael, der Sohn Netanjas, aus dem Königshaus, erschlug Gedalja in Mizpa zusammen mit den Juden und Chaldäern, die bei ihm waren. Die Ausgrabungen passen zu diesem Bild: Die Stadt wurde nicht mit Jerusalem zerstört und blühte im 6. Jahrhundert v. Chr. Ein dort gefundenes Siegel nennt seinen Besitzer als Jaasanja, Diener des Königs; manche setzen ihn mit dem Jaasanja gleich, der zu Gedalja kam, doch das ist unsicher. Zu Nehemias Zeit halfen die Männer von Mizpa und ihre Herrscher beim Wiederaufbau der Mauern Jerusalems."
    - "Um 165 v. Chr. versammelte Judas Makkabäus seine Männer in Mizpa, gegenüber von Jerusalem, zu Fasten und Gebet vor der Schlacht bei Emmaus. Keramik und Münzen zeigen, dass Tell en-Nasbeh in hellenistischer Zeit noch bewohnt war; spätere Gräber und der Boden einer byzantinischen Kirche deuten auf eine kleinere Siedlung. Im 4. Jahrhundert scheint der Ort der biblischen Stadt vergessen gewesen zu sein: Eusebius setzt das Mizpa, wo Samuel das Volk richtete, nahe Kirjat-Jearim an."
  fr:
    - "Mitspa de Benjamin, dont le nom signifie « tour de guet », est d’ordinaire identifiée à Tell en-Nasbeh, colline basse à côté de l’ancienne route qui monte vers le nord depuis Jérusalem, à environ 12 km de la ville. La principale autre hypothèse est Nébi Samouil, la haute colline au nord-ouest de Jérusalem où une tradition plus tardive plaça le tombeau de Samuel. Tell en-Nasbeh fut fouillé en 1926–1935 par William F. Badè. Un petit village s’y dressait vers 3500–3300 av. J.-C. ; après une longue interruption, l’occupation reprit à l’âge du Fer, et au IXe siècle av. J.-C. c’était une ville dotée d’un mur massif et d’une porte, à la frontière entre Juda et Israël."
    - "Dans les Juges, tout Israël se rassembla « devant l’Éternel, à Mitspa » avant de faire la guerre à Benjamin. Samuel y convoqua le peuple pour jeûner et prier ; quand les Philistins attaquèrent, ils furent mis en déroute, et Samuel dressa la pierre Ében-Ézer entre Mitspa et Schen. Mitspa était l’une des villes de sa tournée annuelle, et c’est là que Saül fut choisi roi par le sort. Quand Baescha d’Israël fortifia Rama, Asa de Juda en emporta les pierres et en bâtit Guéba et Mitspa ; le grand mur de Tell en-Nasbeh est souvent rattaché à ce travail."
    - "Après que Nebucadnetsar eut détruit Jérusalem en 587 ou 586 av. J.-C., Mitspa devint le siège de Guedalia, que le roi de Babylone fit gouverneur, et Jérémie vint y vivre avec lui. Ismaël, fils de Nethania, de la maison royale, tua Guedalia à Mitspa avec les Juifs et les Chaldéens qui étaient avec lui. Les fouilles s’accordent avec ce tableau : la ville ne fut pas détruite avec Jérusalem et prospéra au VIe siècle av. J.-C. Un sceau trouvé là nomme son propriétaire Jaazania, serviteur du roi ; certains l’identifient au Jaazania venu auprès de Guedalia, mais cela est incertain. Du temps de Néhémie, les hommes de Mitspa et ses chefs aidèrent à rebâtir les murailles de Jérusalem."
    - "Vers 165 av. J.-C., Judas Maccabée rassembla ses hommes à Mitspa, en face de Jérusalem, pour jeûner et prier avant la bataille d’Emmaüs. La céramique et les monnaies montrent que Tell en-Nasbeh était encore habité à l’époque hellénistique ; des tombes plus tardives et le sol d’une église byzantine indiquent un établissement plus petit. Au IVe siècle, l’emplacement de la ville biblique semble oublié : Eusèbe place la Mitspa où Samuel jugea le peuple près de Kirjath-Jearim."
  it:
    - "Mizpa di Beniamino, il cui nome significa «torre di guardia», è di solito identificata con Tell en-Nasbeh, una bassa collina accanto all’antica strada che corre a nord da Gerusalemme, a circa 12 km dalla città. La principale alternativa è Nebi Samwil, l’alta collina a nord-ovest di Gerusalemme dove una tradizione posteriore collocò la tomba di Samuele. Tell en-Nasbeh fu scavata nel 1926–1935 da William F. Badè. Un piccolo villaggio vi sorgeva verso il 3500–3300 a.C.; dopo una lunga interruzione l’insediamento riprese nell’età del Ferro, e nel IX secolo a.C. era una città con una massiccia muraglia e una porta sul confine tra Giuda e Israele."
    - "In Giudici tutto Israele si radunò «dinanzi all’Eterno, a Mitspa» prima di far guerra a Beniamino. Samuele chiamò qui il popolo a digiunare e pregare; quando i Filistei attaccarono, furono messi in rotta, e Samuele eresse la pietra Eben-Ezer tra Mizpa e Sen. Mizpa era una delle tappe del suo giro annuale, e qui Saul fu scelto re a sorte. Quando Baasa d’Israele fortificò Rama, Asa di Giuda ne portò via le pietre e con esse costruì Gheba e Mizpa; la grande muraglia di Tell en-Nasbeh è spesso collegata a questa opera."
    - "Dopo che Nabucodonosor distrusse Gerusalemme nel 587 o 586 a.C., Mizpa divenne la sede di Godolia, che il re di Babilonia fece governatore, e Geremia venne a vivere con lui là. Ismaele figlio di Netania, di casa reale, uccise Godolia a Mizpa insieme ai Giudei e ai Caldei che erano con lui. Gli scavi si accordano con questo quadro: la città non fu distrutta con Gerusalemme e prosperò nel VI secolo a.C. Un sigillo trovato là nomina il suo possessore come Iaazania, servo del re; alcuni lo identificano con l’Iaazania che venne da Godolia, ma ciò è incerto. Ai giorni di Neemia gli uomini di Mizpa e i suoi capi aiutarono a ricostruire le mura di Gerusalemme."
    - "Verso il 165 a.C. Giuda Maccabeo radunò i suoi uomini a Mizpa, di fronte a Gerusalemme, per digiunare e pregare prima della battaglia di Emmaus. Ceramica e monete mostrano che Tell en-Nasbeh era ancora abitata in età ellenistica; tombe più tarde e il pavimento di una chiesa bizantina indicano un insediamento più piccolo. Nel IV secolo il sito della città biblica sembra dimenticato: Eusebio colloca la Mizpa dove Samuele giudicò il popolo presso Kiriat-Iearim."
  pl:
    - "Mispa Beniamina, której nazwa znaczy „strażnica”, utożsamia się zwykle z Tell en-Nasbeh, niskim wzgórzem przy starożytnej drodze biegnącej na północ od Jerozolimy, około 12 km od miasta. Główną alternatywą jest Nebi Samwil, wysokie wzgórze na północny zachód od Jerozolimy, gdzie późniejsza tradycja umieściła grób Samuela. Tell en-Nasbeh wykopywał w latach 1926–1935 William F. Badè. Mała wieś stała tam około 3500–3300 r. p.n.e.; po długiej przerwie osadnictwo wznowiono w epoce żelaza, a w IX w. p.n.e. było to miasto z masywnym murem i bramą na granicy między Judą a Izraelem."
    - "W Księdze Sędziów cały Izrael zgromadził się „do Pana do Masfy” przed wojną z Beniaminem. Samuel wezwał tu lud do postu i modlitwy; gdy Filistyni zaatakowali, zostali rozgromieni, a Samuel postawił kamień Ebenezer między Mispą a Szen. Mispa była jednym z miast jego corocznego objazdu i tu Saul został wybrany królem losem. Gdy Baasza Izraelski ufortyfikował Ramę, Asa Judzki zabrał jej kamienie i zbudował z nich Gebę i Mispę; wielki mur Tell en-Nasbeh często wiąże się z tym dziełem."
    - "Po zburzeniu Jerozolimy przez Nabuchodonozora w 587 lub 586 r. p.n.e. Mispa stała się siedzibą Gedaliasza, którego król Babilonu ustanowił namiestnikiem, i Jeremiasz przybył tam, by z nim zamieszkać. Izmael, syn Netaniasza, z rodu królewskiego, zabił Gedaliasza w Mispie razem z Żydami i Chaldejczykami, którzy z nim byli. Wykopaliska pasują do tego obrazu: miasto nie zostało zniszczone razem z Jerozolimą i kwitło w VI w. p.n.e. Znaleziona tam pieczęć wymienia jej właściciela jako Jaazanjasza, sługę króla; niektórzy utożsamiają go z Jaazanjaszem, który przyszedł do Gedaliasza, ale to niepewne. W dniach Nehemiasza mężowie Mispy i jej władcy pomagali odbudować mury Jerozolimy."
    - "Około 165 r. p.n.e. Juda Machabeusz zgromadził swoich ludzi w Mispie, naprzeciw Jerozolimy, na post i modlitwę przed bitwą pod Emaus. Ceramika i monety pokazują, że Tell en-Nasbeh wciąż było zamieszkane w czasach hellenistycznych; późniejsze groby i posadzka bizantyjskiego kościoła wskazują na mniejszą osadę. Do IV w. położenie biblijnego miasta zdaje się być zapomniane: Euzebiusz umieszcza Mispę, gdzie Samuel sądził lud, koło Kiriat-Jearim."
  nl:
    - "Mizpa van Benjamin, wier naam “uitkijktoren” betekent, wordt gewoonlijk geïdentificeerd met Tell en-Nasbeh, een lage heuvel naast de oude weg die vanuit Jeruzalem naar het noorden loopt, zo'n 12 km van de stad. Het belangrijkste alternatief is Nebi Samwil, de hoge heuvel ten noordwesten van Jeruzalem waar een latere overlevering het graf van Samuël plaatste. Tell en-Nasbeh werd in 1926–1935 opgegraven door William F. Badè. Omstreeks 3500–3300 v.Chr. stond er een klein dorp; na een lange onderbreking hervatte de bewoning in de ijzertijd, en in de negende eeuw v.Chr. was het een stad met een massieve muur en poort op de grens tussen Juda en Israël."
    - "In Richteren verzamelde heel Israël zich “tot den HEERE te Mizpa” voordat het oorlog voerde tegen Benjamin. Samuël riep het volk hier op te vasten en te bidden; toen de Filistijnen aanvielen, werden zij verslagen, en Samuël richtte de steen Eben-Haëzer op tussen Mizpa en Sen. Mizpa was een van de steden van zijn jaarlijkse ronde, en hier werd Saul door het lot tot koning gekozen. Toen Baësa van Israël Rama versterkte, nam Asa van Juda de stenen ervan mee en bouwde er Geba en Mizpa mee; de grote muur van Tell en-Nasbeh wordt vaak met dit werk in verband gebracht."
    - "Nadat Nebukadnessar Jeruzalem in 587 of 586 v.Chr. had verwoest, werd Mizpa de zetel van Gedalja, die de koning van Babylon tot gouverneur maakte, en Jeremia kwam bij hem wonen. Ismaël, zoon van Netanja, van het koninklijk huis, doodde Gedalja te Mizpa samen met de joden en Chaldeeën die bij hem waren. De opgravingen passen bij dit beeld: de stad werd niet met Jeruzalem verwoest en bloeide in de zesde eeuw v.Chr. Een daar gevonden zegel noemt als eigenaar Jaäzanja, dienaar van de koning; sommigen identificeren hem met de Jaäzanja die bij Gedalja kwam, maar dat is onzeker. In Nehemia's tijd hielpen de mannen van Mizpa en zijn bestuurders de muren van Jeruzalem herbouwen."
    - "Omstreeks 165 v.Chr. verzamelde Judas Makkabeüs zijn mannen te Mizpa, tegenover Jeruzalem, om te vasten en te bidden vóór de slag bij Emmaüs. Aardewerk en munten tonen dat Tell en-Nasbeh in de hellenistische tijd nog bewoond was; latere graven en de vloer van een Byzantijnse kerk wijzen op een kleinere nederzetting. In de vierde eeuw lijkt de ligging van de bijbelse stad vergeten: Eusebius plaatst het Mizpa waar Samuël het volk richtte bij Kirjat-Jearim."
  cs:
    - "Micpa Benjamínova, jejíž jméno znamená „strážní věž“, se obvykle ztotožňuje s Tell en-Nasbeh, nízkým pahorkem u staré cesty vedoucí na sever od Jeruzaléma, asi 12 km od města. Hlavní alternativou je Nebi Samwil, vysoký pahorek severozápadně od Jeruzaléma, kam pozdější tradice umístila Samuelův hrob. Tell en-Nasbeh vykopával v letech 1926–1935 William F. Badè. Asi v letech 3500–3300 př. n. l. tu stála malá vesnice; po dlouhé přestávce se osídlení obnovilo v době železné a v 9. století př. n. l. to bylo město s mohutnou hradbou a branou na hranici mezi Judou a Izraelem."
    - "V Soudcích se všechen Izrael shromáždil „k Hospodinu do Masfa“, než vedl válku proti Benjamínovi. Samuel zde svolal lid k půstu a modlitbě; když Pelištejci zaútočili, byli rozprášeni a Samuel postavil kámen Eben-ezer mezi Micpou a Šenem. Micpa byla jedním z měst jeho každoroční pochůzky a zde byl Saul vybrán králem losem. Když Baeša Izraelský opevňoval Rámu, Asa Judský odvezl její kamení a postavil z něj Gebu a Micpu; velká hradba Tell en-Nasbeh se s touto prací často spojuje."
    - "Poté co Nebukadnesar zničil Jeruzalém roku 587 nebo 586 př. n. l., se Micpa stala sídlem Gedaljáše, kterého babylonský král učinil správcem, a Jeremjáš tam k němu přišel bydlet. Jišmael, syn Netanjášův, z královského rodu, zabil Gedaljáše v Micpě spolu s Židy a Chaldejci, kteří byli s ním. Vykopávky se s tímto obrazem shodují: město nebylo zničeno spolu s Jeruzalémem a v 6. století př. n. l. vzkvétalo. Pečeť tam nalezená jmenuje majitele jako Jaazanjáše, služebníka královského; někteří jej ztotožňují s Jaazanjášem, který přišel ke Gedaljášovi, ale je to nejisté. Za Nehemjáše pomáhali muži z Micpy a jejich vládci obnovovat jeruzalémské hradby."
    - "Asi roku 165 př. n. l. shromáždil Juda Makabejský své muže v Micpě naproti Jeruzalému k půstu a modlitbě před bitvou u Emauz. Keramika a mince ukazují, že Tell en-Nasbeh byl ještě obydlen v helénistické době; pozdější hroby a podlaha byzantského kostela naznačují menší osídlení. Ve 4. století se zdá, že poloha biblického města byla zapomenuta: Eusebius klade Micpu, kde Samuel soudil lid, poblíž Kirjat-jearímu."
