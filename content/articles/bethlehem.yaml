# Overview article (ADR 0007). Mainstream facts only; disputed datings are named as such.
id: bethlehem
place: a112427
title:
  en: "Bethlehem"
  ru: "Вифлеем"
  uk: "Вифлеєм"
  es: "Belén"
  pt: "Belém"
  de: "Bethlehem"
  fr: "Bethléem"
  it: "Betlemme"
