body:
  en:
    - "Bethlehem lies on a ridge in the hills of Judah, about 9 km south of Jerusalem, where the farmland of the hills gives way to the desert to the east. A town called Bit-Lahmi in one of the Amarna letters of the fourteenth century BC may be Bethlehem, but the reading is uncertain. Genesis also knows the place as Ephrath, on the road where Rachel died and was buried."
    - "In the Bible Bethlehem is the town of Boaz and Ruth and of their descendant Jesse, and there Samuel anointed Jesse's youngest son, David. Rehoboam fortified it, and Micah foretold a ruler in Israel coming out of Bethlehem Ephratah. A seal impression of the eighth or seventh century BC found in Jerusalem in 2012 bears the town's name, apparently from a shipment sent to the king. Men of Bethlehem were among those who returned from Babylon."
    - "Matthew and Luke tell that Jesus was born in Bethlehem in the days of Herod the Great, whose death is usually dated to 4 BC, and Matthew tells of Herod's killing of the town's young children. In the second century Justin Martyr and later Origen speak of a cave near Bethlehem shown as the place of the birth. Jerome writes that a grove of Adonis once overshadowed the spot and that Adonis was mourned in the very cave of the birth."
    - "When Constantine's mother Helena visited the Holy Land in about 326, a basilica was founded over the cave: the first Church of the Nativity. In 386 Jerome settled in Bethlehem with Paula, who founded monasteries there; in the town he completed his Latin translation of the Bible in about 405, and he died there in 420."
  ru:
    - "Вифлеем стоит на гребне в горах Иудеи, примерно в 9 км к югу от Иерусалима, там, где пашни нагорья сменяются пустыней на востоке. Город Бит-Лахми в одном из Амарнских писем XIV века до н. э., возможно, и есть Вифлеем, но это прочтение спорно. Книга Бытия знает это место и под именем Ефрафа: на дороге к нему умерла и была погребена Рахиль."
    - "В Библии Вифлеем — город Вооза и Руфи и их потомка Иессея; здесь Самуил помазал младшего сына Иессея, Давида. Ровоам укрепил город, а Михей предсказал, что из Вифлеема-Ефрафы произойдёт Владыка в Израиле. Оттиск печати VIII или VII века до н. э., найденный в Иерусалиме в 2012 г., несёт имя города: по-видимому, он скреплял поставку царю. Среди вернувшихся из Вавилона были и уроженцы Вифлеема."
    - "Матфей и Лука рассказывают, что Иисус родился в Вифлееме во дни Ирода Великого, смерть которого обычно относят к 4 г. до н. э., а Матфей — о том, как Ирод избил младенцев города. Во II веке Иустин Мученик, а позже Ориген говорят о пещере близ Вифлеема, которую показывали как место Рождества. Иероним пишет, что некогда это место осеняла роща Адониса и в самой пещере Рождества оплакивали Адониса."
    - "Когда мать Константина Елена около 326 г. посетила Святую землю, над пещерой была заложена базилика — первый храм Рождества Христова. В 386 г. в Вифлееме поселился Иероним вместе с Павлой, основавшей здесь монастыри; в этом городе он около 405 г. завершил латинский перевод Библии и здесь же умер в 420 г."
  uk:
    - "Вифлеєм лежить на гірській гряді в юдейських горах, приблизно за 9 км на південь від Єрусалима, там, де орна земля гір поступається на сході пустелі. Місто під назвою Бит-Лахмі в одному з амарнських листів XIV ст. до н. е. може бути Вифлеємом, але прочитання непевне. Книга Буття знає це місце й як Ефрату, на дорозі, де померла й була похована Рахіль."
    - "У Біблії Вифлеєм — місто Вооза й Рут та їхнього нащадка Єссея, і саме тут Самуїл помазав наймолодшого сина Єссеєва, Давида. Ровоам його укріпив, а Міха провіщав правителя в Ізраїлі, що вийде з Вифлеєму Ефрати. Відбиток печатки VIII або VII ст. до н. е., знайдений у Єрусалимі в 2012 р., має назву міста, очевидно, з вантажу, надісланого цареві. Вифлеємців згадано серед тих, хто повернувся з Вавилона."
    - "Матвій і Лука розповідають, що Ісус народився у Вифлеємі за днів Ірода Великого, смерть якого зазвичай датують 4 р. до н. е., а Матвій розповідає про те, як Ірод убив малих дітей міста. У II ст. Юстин Мученик, а пізніше Оріген згадують печеру біля Вифлеєму, яку показували як місце народження. Ієронім пише, що колись гай Адоніса затіняв це місце і що Адоніса оплакували в самій печері народження."
    - "Коли мати Константина Олена відвідала Святу Землю близько 326 р., над печерою заклали базиліку: першу церкву Різдва. У 386 р. Ієронім оселився у Вифлеємі з Павлою, яка заснувала там монастирі; в цьому місті він закінчив свій латинський переклад Біблії близько 405 р. і тут помер у 420 р."
  es:
    - "Belén se encuentra en una loma de las colinas de Judá, a unos 9 km al sur de Jerusalén, donde las tierras de labor de la sierra dan paso al desierto por el este. Una ciudad llamada Bit-Lahmi en una de las cartas de Amarna del siglo XIV a. C. podría ser Belén, pero la lectura es incierta. El Génesis conoce también el lugar como Efrata, en el camino donde murió y fue sepultada Raquel."
    - "En la Biblia, Belén es la ciudad de Booz y Rut y de su descendiente Isaí, y allí ungió Samuel a David, el hijo menor de Isaí. Roboam la fortificó, y Miqueas anunció que de Belén Efrata saldría un gobernante en Israel. Una impronta de sello de los siglos VIII o VII a. C. hallada en Jerusalén en 2012 lleva el nombre de la ciudad, al parecer de un envío dirigido al rey. Hombres de Belén figuran entre los que regresaron de Babilonia."
    - "Mateo y Lucas cuentan que Jesús nació en Belén en los días de Herodes el Grande, cuya muerte suele fecharse en el 4 a. C., y Mateo relata la matanza de los niños pequeños de la ciudad por orden de Herodes. En el siglo II, Justino Mártir y más tarde Orígenes hablan de una cueva cercana a Belén que se mostraba como el lugar del nacimiento. Jerónimo escribe que un bosque sagrado de Adonis cubría antaño aquel sitio y que se lloraba a Adonis en la misma cueva del nacimiento."
    - "Cuando Elena, madre de Constantino, visitó Tierra Santa hacia el 326, se fundó una basílica sobre la cueva: la primera iglesia de la Natividad. En el 386 Jerónimo se estableció en Belén con Paula, que fundó allí monasterios; en la ciudad concluyó hacia el 405 su traducción latina de la Biblia, y allí murió en el 420."
  pt:
    - "Belém fica numa crista das montanhas de Judá, cerca de 9 km ao sul de Jerusalém, onde as terras de cultivo das montanhas cedem lugar ao deserto, a leste. Uma cidade chamada Bit-Lahmi, numa das cartas de Amarna do século XIV a.C., pode ser Belém, mas a leitura é incerta. O Gênesis conhece também o lugar como Efrata, na estrada onde Raquel morreu e foi sepultada."
    - "Na Bíblia, Belém é a cidade de Boaz e Rute e de seu descendente Jessé, e ali Samuel ungiu o filho mais novo de Jessé, Davi. Roboão a fortificou, e Miqueias anunciou um governante em Israel que sairia de Belém Efrata. Uma impressão de selo do século VIII ou VII a.C., encontrada em Jerusalém em 2012, traz o nome da cidade, aparentemente de uma remessa enviada ao rei. Homens de Belém estavam entre os que voltaram da Babilônia."
    - "Mateus e Lucas contam que Jesus nasceu em Belém nos dias de Herodes, o Grande, cuja morte costuma ser datada de 4 a.C., e Mateus conta que Herodes mandou matar as crianças pequenas da cidade. No século II, Justino Mártir e, mais tarde, Orígenes falam de uma gruta perto de Belém mostrada como o lugar do nascimento. Jerônimo escreve que um bosque de Adônis cobria outrora o local com sua sombra e que Adônis era pranteado na própria gruta do nascimento."
    - "Quando Helena, mãe de Constantino, visitou a Terra Santa por volta de 326, uma basílica foi fundada sobre a gruta: a primeira Igreja da Natividade. Em 386, Jerônimo fixou-se em Belém com Paula, que ali fundou mosteiros; na cidade, concluiu por volta de 405 a sua tradução latina da Bíblia, e morreu ali em 420."
  de:
    - "Bethlehem liegt auf einem Höhenrücken im Bergland von Juda, etwa 9 km südlich von Jerusalem, dort, wo das Ackerland des Berglandes nach Osten in die Wüste übergeht. Ein Ort namens Bit-Lahmi in einem der Amarnabriefe aus dem 14. Jahrhundert v. Chr. könnte Bethlehem sein, doch die Lesung ist unsicher. Die Genesis kennt den Ort auch als Efrata, an dem Weg, auf dem Rahel starb und begraben wurde."
    - "In der Bibel ist Bethlehem die Stadt von Boas und Rut und ihres Nachkommen Isai, und dort salbte Samuel Isais jüngsten Sohn David. Rehabeam befestigte es, und Micha kündigte einen Herrscher in Israel an, der aus Bethlehem Efrata kommen sollte. Ein Siegelabdruck aus dem 8. oder 7. Jahrhundert v. Chr., der 2012 in Jerusalem gefunden wurde, trägt den Namen der Stadt, offenbar von einer an den König gesandten Lieferung. Männer von Bethlehem gehörten zu den Heimkehrern aus Babylon."
    - "Matthäus und Lukas berichten, dass Jesus in den Tagen Herodes’ des Großen, dessen Tod gewöhnlich auf 4 v. Chr. datiert wird, in Bethlehem geboren wurde, und Matthäus erzählt von Herodes’ Ermordung der kleinen Kinder der Stadt. Im 2. Jahrhundert sprechen Justin der Märtyrer und später Origenes von einer Höhle bei Bethlehem, die als Geburtsort gezeigt wurde. Hieronymus schreibt, ein Hain des Adonis habe die Stätte einst überschattet, und Adonis sei in der Geburtshöhle selbst beweint worden."
    - "Als Helena, die Mutter Konstantins, um 326 das Heilige Land besuchte, wurde über der Höhle eine Basilika gegründet: die erste Geburtskirche. Im Jahr 386 ließ sich Hieronymus mit Paula, die dort Klöster gründete, in Bethlehem nieder; in der Stadt vollendete er um 405 seine lateinische Übersetzung der Bibel, und er starb dort 420."
  fr:
    - "Bethléem se trouve sur une crête dans les monts de Juda, à environ 9 km au sud de Jérusalem, là où les terres cultivées de la montagne cèdent la place au désert à l’est. Une ville nommée Bit-Lahmi dans l’une des lettres d’Amarna du XIVe siècle av. J.-C. pourrait être Bethléem, mais la lecture est incertaine. La Genèse connaît aussi le lieu sous le nom d’Éphrata, sur la route où Rachel mourut et fut enterrée."
    - "Dans la Bible, Bethléem est la ville de Boaz et de Ruth et de leur descendant Isaï ; c’est là que Samuel oignit le plus jeune fils d’Isaï, David. Roboam la fortifia, et Michée annonça un dominateur en Israël sortant de Bethléem Éphrata. Une empreinte de sceau du VIIIe ou du VIIe siècle av. J.-C. découverte à Jérusalem en 2012 porte le nom de la ville, apparemment d’un envoi destiné au roi. Des hommes de Bethléem figuraient parmi ceux qui revinrent de Babylone."
    - "Matthieu et Luc racontent que Jésus naquit à Bethléem du temps d’Hérode le Grand, dont la mort est généralement datée de 4 av. J.-C., et Matthieu rapporte le massacre des jeunes enfants de la ville par Hérode. Au IIe siècle, Justin Martyr, puis Origène, parlent d’une grotte proche de Bethléem présentée comme le lieu de la naissance. Jérôme écrit qu’un bois sacré d’Adonis ombrageait jadis l’endroit et qu’Adonis était pleuré dans la grotte même de la naissance."
    - "Lorsque Hélène, mère de Constantin, visita la Terre sainte vers 326, une basilique fut fondée au-dessus de la grotte : la première église de la Nativité. En 386, Jérôme s’établit à Bethléem avec Paula, qui y fonda des monastères ; c’est dans la ville qu’il acheva vers 405 sa traduction latine de la Bible, et il y mourut en 420."
  it:
    - "Betlemme sorge su un crinale delle colline di Giuda, a circa 9 km a sud di Gerusalemme, dove i campi delle colline cedono il posto al deserto a oriente. Una città chiamata Bit-Lahmi in una delle lettere di Amarna del XIV secolo a.C. può essere Betlemme, ma la lettura è incerta. Anche la Genesi conosce il luogo come Efrat, sulla strada dove Rachele morì e fu sepolta."
    - "Nella Bibbia Betlemme è la città di Booz e Rut e del loro discendente Iesse, e là Samuele unse il figlio più giovane di Iesse, Davide. Roboamo la fortificò, e Michea predisse un dominatore in Israele che sarebbe uscito da Betlemme di Efrata. Un’impronta di sigillo dell’VIII o VII secolo a.C. trovata a Gerusalemme nel 2012 reca il nome della città, apparentemente da una spedizione inviata al re. Uomini di Betlemme furono tra quelli che tornarono da Babilonia."
    - "Matteo e Luca raccontano che Gesù nacque a Betlemme ai giorni di Erode il Grande, la cui morte si data di solito al 4 a.C., e Matteo narra l’uccisione dei bambini della città da parte di Erode. Nel II secolo Giustino Martire e più tardi Origene parlano di una grotta vicino a Betlemme mostrata come luogo della nascita. Girolamo scrive che un bosco di Adone ombreggiava un tempo il luogo e che Adone era pianto proprio nella grotta della nascita."
    - "Quando Elena, madre di Costantino, visitò la Terra Santa intorno al 326, sulla grotta fu fondata una basilica: la prima chiesa della Natività. Nel 386 Girolamo si stabilì a Betlemme con Paola, che vi fondò dei monasteri; in città completò la sua traduzione latina della Bibbia intorno al 405, e vi morì nel 420."
  pl:
    - "Betlejem leży na grzbiecie wzgórz Judy, około 9 km na południe od Jerozolimy, tam gdzie górskie pola uprawne ustępują na wschodzie pustyni. Miasto zwane Bit-Lachmi w jednym z listów z Amarna z XIV w. p.n.e. może być Betlejem, lecz odczyt jest niepewny. Księga Rodzaju zna to miejsce także jako Efrata, przy drodze, na której umarła i została pochowana Rachela."
    - "W Biblii Betlejem jest miastem Booza i Rut oraz ich potomka Jessego, i tam Samuel namaścił najmłodszego syna Jessego, Dawida. Roboam je umocnił, a Mika zapowiedział władcę w Izraelu, który wyjdzie z Betlejem Efrata. Odcisk pieczęci z VIII lub VII w. p.n.e., znaleziony w Jerozolimie w 2012 r., nosi nazwę tego miasta, najwyraźniej z przesyłki wysłanej do króla. Mieszkańcy Betlejem byli wśród tych, którzy wrócili z Babilonu."
    - "Mateusz i Łukasz opowiadają, że Jezus urodził się w Betlejem za dni Heroda Wielkiego, którego śmierć zwykle datuje się na 4 r. p.n.e.; Mateusz opisuje też zabicie przez Heroda małych dzieci z tego miasta. W II w. Justyn Męczennik, a później Orygenes mówią o grocie koło Betlejem, pokazywanej jako miejsce narodzin. Hieronim pisze, że gaj Adonisa niegdyś ocieniał to miejsce i że opłakiwano Adonisa w samej grocie narodzin."
    - "Gdy matka Konstantyna, Helena, odwiedziła Ziemię Świętą około 326 r., nad grotą założono bazylikę: pierwszy kościół Narodzenia. W 386 r. Hieronim osiadł w Betlejem wraz z Paulą, która założyła tam klasztory; w tym mieście ukończył swój łaciński przekład Biblii około 405 r. i tam zmarł w 420 r."
  nl:
    - "Bethlehem ligt op een bergrug in het bergland van Juda, ongeveer 9 km ten zuiden van Jeruzalem, waar het akkerland van de heuvels overgaat in de woestijn in het oosten. Een stad die in een van de Amarnabrieven uit de veertiende eeuw v.Chr. Bit-Lahmi heet, is mogelijk Bethlehem, maar de lezing is onzeker. Genesis kent de plaats ook als Efrata, aan de weg waar Rachel stierf en begraven werd."
    - "In de Bijbel is Bethlehem de stad van Boaz en Ruth en van hun nakomeling Isaï, en daar zalfde Samuël Isaï's jongste zoon David. Rehabeam versterkte de stad, en Micha voorzei een heerser in Israël die uit Bethlehem Efrata zou voortkomen. Een zegelafdruk uit de achtste of zevende eeuw v.Chr., in 2012 in Jeruzalem gevonden, draagt de naam van de stad, kennelijk afkomstig van een zending naar de koning. Mannen van Bethlehem behoorden tot hen die uit Babylon terugkeerden."
    - "Mattheüs en Lukas vertellen dat Jezus werd geboren in Bethlehem in de dagen van Herodes de Grote, wiens dood gewoonlijk op 4 v.Chr. wordt gedateerd, en Mattheüs vertelt hoe Herodes de jonge kinderen van de stad liet doden. In de 2e eeuw spreken Justinus Martelaar en later Origenes over een grot bij Bethlehem die als geboorteplaats werd aangewezen. Hieronymus schrijft dat een bos van Adonis de plek ooit overschaduwde en dat Adonis in de geboortegrot zelf werd beweend."
    - "Toen Helena, de moeder van Constantijn, omstreeks 326 het Heilige Land bezocht, werd boven de grot een basiliek gesticht: de eerste Geboortekerk. In 386 vestigde Hieronymus zich in Bethlehem met Paula, die er kloosters stichtte; in de stad voltooide hij omstreeks 405 zijn Latijnse vertaling van de Bijbel, en hij stierf er in 420."
  cs:
    - "Betlém leží na hřebeni v judských horách, asi 9 km jižně od Jeruzaléma, kde úrodná půda hor ustupuje na východě poušti. Město zvané Bít-Lahmi v jednom z amarnských dopisů ze 14. století př. n. l. může být Betlém, ale čtení je nejisté. Genesis zná toto místo také jako Efratu, na cestě, kde zemřela a byla pohřbena Ráchel."
    - "V Bibli je Betlém městem Bóaze a Rut i jejich potomka Jišaje a tam Samuel pomazal Jišajova nejmladšího syna Davida. Rechabeám jej opevnil a Micheáš předpověděl vládce v Izraeli pocházejícího z Betléma Efraty. Pečetní otisk z 8. nebo 7. století př. n. l. nalezený roku 2012 v Jeruzalémě nese jméno města, zřejmě ze zásilky poslané králi. Betlémští patřili mezi ty, kdo se vrátili z Babylóna."
    - "Matouš a Lukáš vyprávějí, že se Ježíš narodil v Betlémě za dnů Heroda Velikého, jehož smrt se obvykle klade do roku 4 př. n. l., a Matouš vypráví o Herodově vraždění malých dětí města. Ve 2. století mluví Justin Mučedník a později Órigenés o jeskyni poblíž Betléma, ukazované jako místo narození. Jeroným píše, že místo kdysi zastiňoval Adónidův háj a že Adónis byl oplakáván právě v jeskyni narození."
    - "Když Konstantinova matka Helena kolem roku 326 navštívila Svatou zemi, byla nad jeskyní založena bazilika: první chrám Narození. Roku 386 se Jeroným usadil v Betlémě s Paulou, která tam založila kláštery; ve městě dokončil kolem roku 405 svůj latinský překlad Bible a roku 420 tam zemřel."
  sv:
    - "Betlehem ligger på en ås i Judas bergsland, omkring 9 km söder om Jerusalem, där böndernas åkrar i bergen övergår i öknen österut. En stad som kallas Bit-Lahmi i ett av Amarnabreven från 1300-talet f.Kr. kan vara Betlehem, men läsningen är osäker. Första Mosebok känner också platsen som Efrata, vid vägen där Rakel dog och blev begravd."
    - "I Bibeln är Betlehem staden för Boas och Rut och deras ättling Isai, och där smorde Samuel Isais yngste son David. Rehabeam befäste staden, och Mika förutsade en härskare i Israel som skulle komma ur Betlehem Efrata. Ett sigillavtryck från 700- eller 600-talet f.Kr. som hittades i Jerusalem 2012 bär stadens namn, tydligen från en sändning till kungen. Män från Betlehem fanns bland dem som återvände från Babylon."
    - "Matteus och Lukas berättar att Jesus föddes i Betlehem på Herodes den stores tid, vars död vanligen dateras till 4 f.Kr., och Matteus berättar hur Herodes lät döda stadens små barn. På 100-talet talar Justinus martyren och senare Origenes om en grotta nära Betlehem som visades som födelseplatsen. Hieronymus skriver att en Adonislund en gång skuggade platsen och att Adonis sörjdes i själva födelsegrottan."
    - "När Konstantins mor Helena besökte det heliga landet omkring 326 grundades en basilika över grottan: den första Födelsekyrkan. År 386 bosatte sig Hieronymus i Betlehem med Paula, som grundade kloster där; i staden fullbordade han omkring 405 sin latinska översättning av Bibeln, och han dog där 420."
  nb:
    - "Betlehem ligger på en rygg i Judas åser, omtrent 9 km sør for Jerusalem, der åkerlandet i fjellene går over i ørkenen mot øst. En by som kalles Bit-Lahmi i et av Amarna-brevene fra 1300-tallet f.Kr., kan være Betlehem, men lesningen er usikker. 1. Mosebok kjenner også stedet som Efrat, ved veien der Rakel døde og ble begravet."
    - "I Bibelen er Betlehem byen til Boas og Rut og deres etterkommer Isai, og der salvet Samuel Isais yngste sønn, David. Rehabeam befestet den, og Mika forutsa en hersker i Israel som skulle komme ut av Betlehem Efrata. Et segltrykk fra 700- eller 600-tallet f.Kr., funnet i Jerusalem i 2012, bærer byens navn, tilsynelatende fra en forsendelse sendt til kongen. Menn fra Betlehem var blant dem som vendte tilbake fra Babylon."
    - "Matteus og Lukas forteller at Jesus ble født i Betlehem i dagene til Herodes den store, hvis død vanligvis dateres til 4 f.Kr., og Matteus forteller om Herodes' drap på byens små barn. På 100-tallet taler Justin Martyren og senere Origenes om en hule nær Betlehem som ble vist som fødestedet. Hieronymus skriver at en Adonis-lund en gang skygget over stedet og at Adonis ble sørget over i selve fødselshulen."
    - "Da Konstantins mor Helena besøkte Det hellige land omkring 326, ble en basilika grunnlagt over hulen: den første Fødselskirken. I 386 slo Hieronymus seg ned i Betlehem sammen med Paula, som grunnla klostre der; i byen fullførte han omkring 405 sin latinske oversettelse av Bibelen, og han døde der i 420."
