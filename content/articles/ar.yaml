body:
  en:
    - "Ar, or Ar of Moab, was a chief town of Moab in the age of the Exodus, and in some verses the name seems to stand for the land of Moab itself, or for its northern part. Its site is unknown. The old identification goes back to Jerome, who equated Ar with Areopolis (Eusebius had already called the city of Moab Areopolis), the Roman city on the plateau south of the Arnon now called Rabba, apparently by the sound of the name. Several scholars now favour Khirbet el-Balu'a, a large Iron Age ruin near the Arnon gorge north of Rabba, where the Balu'a Stele with its Egyptian-style relief was found in 1930; Misna and Rabba itself, Khirbet el-Medeineh and Kerak have also been proposed. Some think Ar was never a town but a district."
    - "The Book of the Wars of the LORD, quoted in Numbers, names “the stream of the brooks that goeth down to the dwelling of Ar, and lieth upon the border of Moab”, and the taunt-song on Heshbon says that the fire from Sihon's city “consumed Ar of Moab, and the lords of the high places of Arnon”. When Israel came up from the wilderness, Moses was told, “Distress not the Moabites, neither contend with them in battle... because I have given Ar unto the children of Lot for a possession”; the Emim, a people tall as the Anakim, had lived there before. Israel passed “through Ar, the coast of Moab”, and the Moabites “which dwell in Ar” sold them food and water. Isaiah's oracle on Moab opens: “in the night Ar of Moab is laid waste, and brought to silence; because in the night Kir of Moab is laid waste”."
    - "Moab passed to the Nabataeans and in AD 106 to the Roman province of Arabia; Areopolis was a city with a bishop in Byzantine times. Rabba today is a village in Jordan's Karak governorate with the ruins of a Roman temple, and Balu'a is a field of ruins above the Wadi Mujib; the stele is in the Jordan Museum in Amman."
  ru:
    - "Ар, или Ар-Моав, был главным городом Моава в век исхода, а в некоторых стихах имя, похоже, означает саму землю Моава или её северную часть. Где он стоял, неизвестно. Старое отождествление идёт от Иеронима, который приравнял Ар к Ареополю (Евсевий уже называл Ареополем город Моав), римскому городу на плато к югу от Арнона, нынешней Раббе, — видимо, по созвучию имён. Ряд учёных сегодня предпочитает Хирбет-эль-Балуа, большому городищу железного века у ущелья Арнона к северу от Раббы, где в 1930 году нашли стелу из Балуа с рельефом в египетском стиле; предлагали также Мисну и саму Раббу, Хирбет-эль-Медейну и Эль-Карак. Иные считают, что Ар был не городом, а областью."
    - "Книга браней Господних, которую цитирует книга Чисел, называет «верховье потоков, которое склоняется к Шебет-Ару и прилегает к пределам Моава», а насмешливая песнь о Есевоне говорит, что огонь из города Сигона «пожрал Ар-Моав и владеющих высотами Арнона». Когда Израиль поднялся из пустыни, Моисею было сказано: «не вступай во вражду с Моавом и не начинай с ними войны... потому что Ар отдал Я во владение сынам Лотовым»; прежде там жили Эмимы, народ ростом с сынов Енаковых. Израиль проходил «мимо пределов Моава, мимо Ара», и Моавитяне, «живущие в Аре», продавали ему хлеб и воду. Пророчество Исаии о Моаве открывается словами: «ночью будет разорен Ар-Моав и уничтожен; так! ночью будет разорен Кир-Моав»."
    - "Моав перешёл к Набатеям, а в 106 г. н. э. — в римскую провинцию Аравия; в византийское время Ареополь был городом с епископом. Рабба сегодня — село в иорданской провинции Эль-Карак с развалинами римского храма, а Балуа — поле развалин над Вади-Муджибом; стела хранится в Иорданском музее в Аммане."
  uk:
    - "Ар, або Ар Моавський, був одним із головних міст Моаба за доби Виходу, і в деяких віршах назва, здається, означає саму землю Моаба або її північну частину. Місце невідоме. Давнє ототожнення сягає Єроніма, який прирівнював Ар до Ареополя (Євсевій уже називав Ареополем місто Моав), римського міста на плато на південь від Арнону, нині Рабба, очевидно, за співзвучністю назви. Деякі вчені нині віддають перевагу Хірбет-ель-Балуа, великій руїні залізної доби біля ущелини Арнону на північ від Рабби, де 1930 року знайшли стелу з Балуа з рельєфом у єгипетському стилі; пропонували також Місну, саму Раббу, Хірбет-ель-Медейне та Керак. Дехто вважає, що Ар ніколи не був містом, а округом."
    - "Книга воєн Господніх, процитована в Числах, називає «злив потоків, що сягає до головного міста Ар, і тече по границї Моаба», а насмішкувата пісня про Гесбон каже, що вогонь з міста Сігона пожер Ар Моавський і володарів висот Арнону. Коли Ізраїль виходив із пустелі, Мойсею було сказано: «Не турбуй Моаба і не починай з ними війни... бо віддав я Ар синам Лотовим у державу»; еміми, народ високий, як енакіми, жили там раніше. Ізраїль перейшов «через гряницї Моаба, мимо Ара», а моавитяни, «що живуть в Арі», продавали йому їжу й воду. Ісаїне пророцтво про Моав починається: «Так! ніччю збурений буде Ар-Моаб і спустошений; так! вночі збурений буде Кир-Моаб і спустошений!»"
    - "Моав перейшов до набатеїв, а у 106 р. н. е. — до римської провінції Аравія; Ареополь був містом з єпископом за візантійських часів. Рабба нині — село в мухафазі Карак Йорданії з руїнами римського храму, а Балуа — поле руїн над вадієм Муджиб; стела зберігається в Йорданському музеї в Аммані."
  es:
    - "Ar, o Ar de Moab, fue una ciudad principal de Moab en la época del Éxodo, y en algunos versículos el nombre parece representar la propia tierra de Moab, o su parte septentrional. Se ignora su emplazamiento. La antigua identificación se remonta a Jerónimo, que equiparó Ar con Areópolis (Eusebio ya había llamado Areópolis a la ciudad de Moab), la ciudad romana de la meseta al sur del Arnón que hoy se llama Rabba, al parecer por el sonido del nombre. Varios estudiosos prefieren ahora Khirbet el-Balu'a, una gran ruina de la edad del Hierro cerca de la garganta del Arnón, al norte de Rabba, donde en 1930 se halló la estela de Balu'a con su relieve de estilo egipcio; también se han propuesto Misna y la propia Rabba, Khirbet el-Medeineh y Kerak. Algunos piensan que Ar nunca fue una ciudad sino un distrito."
    - "El libro de las batallas de Jehová, citado en Números, nombra «la corriente de los arroyos que va á parar en Ar, y descansa en el término de Moab», y el canto burlesco sobre Hesbón dice que el fuego de la ciudad de Sehón «consumió á Ar de Moab, á los señores de los altos de Arnón». Cuando Israel subió del desierto, se dijo a Moisés: «No molestes á Moab, ni te empeñes con ellos en guerra, ... porque yo he dado á Ar por heredad á los hijos de Lot»; los emitas, un pueblo alto como los anaceos, habían vivido allí antes. Israel pasó por «el término de Moab, á Ar», y los moabitas «que habitaban en Ar» les vendieron comida y agua. El oráculo de Isaías sobre Moab comienza: «de noche fué destruída Ar-moab, fué puesta en silencio. Cierto, de noche fué destruída Kir-moab»."
    - "Moab pasó a los nabateos y en 106 d. C. a la provincia romana de Arabia; Areópolis fue una ciudad con obispo en época bizantina. Hoy Rabba es una aldea de la gobernación de Karak, en Jordania, con las ruinas de un templo romano, y Balu'a es un campo de ruinas sobre el uadi Mujib; la estela se halla en el Museo de Jordania, en Amán."
  pt:
    - "Ar, ou Ar de Moabe, era uma das principais cidades de Moabe na época do Êxodo, e em alguns versículos o nome parece designar a própria terra de Moabe, ou a sua parte setentrional. Seu sítio é desconhecido. A identificação antiga remonta a Jerônimo, que equiparou Ar a Areópolis (Eusébio já chamara Areópolis a cidade de Moabe), a cidade romana no planalto ao sul do Arnom, hoje chamada Rabba, aparentemente pelo som do nome. Vários estudiosos preferem hoje Khirbet el-Balu'a, uma grande ruína da Idade do Ferro perto do desfiladeiro do Arnom, ao norte de Rabba, onde a Estela de Balu'a, com seu relevo de estilo egípcio, foi achada em 1930; Misna e a própria Rabba, Khirbet el-Medeineh e Kerak também foram propostas. Alguns pensam que Ar nunca foi uma cidade, mas um distrito."
    - "O Livro das Guerras do SENHOR, citado em Números, nomeia “a encosta dos vales que se inclina para a habitação de Ar, e se apoia na fronteira de Moabe”, e a canção de escárnio sobre Hesbom diz que o fogo da cidade de Seom “devorou Ar de Moabe, os senhores dos lugares altos do Arnom”. Quando Israel subiu do deserto, foi dito a Moisés: “Não incomode Moabe, nem entre em conflito com eles em batalha... porque eu dei Ar aos filhos de Ló por possessão”; os emins, um povo alto como os anaquins, haviam habitado ali antes. Israel passou “por Ar, a fronteira de Moabe”, e os moabitas, “que habitam em Ar”, venderam-lhes comida e água. O oráculo de Isaías sobre Moabe começa: “Porque em uma noite, Ar de Moabe é devastada, e reduzida a nada. Porque em uma noite Quir de Moabe é devastada”."
    - "Moabe passou aos nabateus e em 106 d.C. à província romana da Arábia; Areópolis foi sede de bispo na época bizantina. Rabba é hoje uma aldeia da província de Karak, na Jordânia, com as ruínas de um templo romano, e Balu'a é um campo de ruínas acima do uádi Mujib; a estela está no Museu da Jordânia, em Amã."
  de:
    - "Ar, oder Ar in Moab, war zur Zeit des Auszugs eine Hauptstadt Moabs, und in manchen Versen scheint der Name für das Land Moab selbst oder seinen nördlichen Teil zu stehen. Seine Lage ist unbekannt. Die alte Gleichsetzung geht auf Hieronymus zurück, der Ar mit Areopolis gleichsetzte (Eusebius hatte schon die Stadt Moab Areopolis genannt), der römischen Stadt auf dem Plateau südlich des Arnon, heute Rabba genannt, offenbar nach dem Klang des Namens. Mehrere Gelehrte bevorzugen heute Chirbet el-Balu'a, eine große Ruine der Eisenzeit nahe der Arnonschlucht nördlich von Rabba, wo 1930 die Balu'a-Stele mit ihrem Relief in ägyptischem Stil gefunden wurde; auch Misna und Rabba selbst, Chirbet el-Medeine und Kerak wurden vorgeschlagen. Manche meinen, Ar sei nie eine Stadt gewesen, sondern ein Bezirk."
    - "Das Buch von den Kriegen des HERRN, im Vierten Buch Mose zitiert, nennt „die Quelle der Bäche, welche reicht hinan bis zur Stadt Ar und lenkt sich und ist die Grenze Moabs“, und das Spottlied auf Heschbon sagt, das Feuer aus der Stadt Sihons „hat gefressen Ar der Moabiter und die Bürger der Höhen am Arnon“. Als Israel aus der Wüste heraufzog, wurde Mose gesagt: „Du sollst den Moabitern nicht Schaden tun noch sie bekriegen“, „denn ich habe Ar den Kindern Lot zu besitzen gegeben“; die Emiter, ein Volk groß wie die Enakiter, hatten dort zuvor gewohnt. Israel sollte „durch das Gebiet der Moabiter ziehen bei Ar“, und die Moabiter, „die zu Ar wohnen“, verkauften ihnen Speise und Wasser. Jesajas Last über Moab beginnt: „Des Nachts kommt Verstörung über Ar in Moab; sie ist dahin. Des Nachts kommt Verstörung über Kir in Moab“."
    - "Moab ging an die Nabatäer und 106 n. Chr. an die römische Provinz Arabien; Areopolis war in byzantinischer Zeit eine Bischofsstadt. Rabba ist heute ein Dorf im Gouvernement Karak in Jordanien mit den Ruinen eines römischen Tempels, und Balu'a ist ein Trümmerfeld über dem Wadi Mudschib; die Stele befindet sich im Jordan-Museum in Amman."
  fr:
    - "Ar, ou Ar-Moab, était une ville principale de Moab à l’époque de l’Exode, et dans certains versets le nom paraît désigner le pays de Moab lui-même, ou sa partie nord. Son site est inconnu. L’ancienne identification remonte à Jérôme, qui assimilait Ar à Aréopolis (Eusèbe appelait déjà Aréopolis la ville de Moab), la ville romaine du plateau au sud de l’Arnon appelée aujourd’hui Rabba, apparemment d’après la sonorité du nom. Plusieurs savants préfèrent maintenant Khirbet el-Balu’a, grande ruine de l’âge du Fer près des gorges de l’Arnon au nord de Rabba, où la stèle de Balu’a, avec son relief de style égyptien, fut trouvée en 1930 ; Misna, Rabba elle-même, Khirbet el-Medeineh et Kerak ont aussi été proposées. Certains pensent qu’Ar ne fut jamais une ville mais un district."
    - "Le livre des guerres de l’Éternel, cité dans les Nombres, nomme « le cours des torrents, qui s’étend du côté d’Ar et touche à la frontière de Moab », et le chant moqueur sur Hesbon dit que le feu sorti de la ville de Sihon « a dévoré Ar-Moab, les habitants des hauteurs de l’Arnon ». Quand Israël monta du désert, il fut dit à Moïse : « N’attaque pas Moab, et ne t’engage pas dans un combat avec lui… c’est aux enfants de Lot que j’ai donné Ar en propriété » ; les Émim, peuple grand comme les Anakim, y avaient habité auparavant. Israël passa « la frontière de Moab, à Ar », et les Moabites « qui demeurent à Ar » lui vendirent vivres et eau. L’oracle d’Ésaïe sur Moab s’ouvre ainsi : « La nuit même où elle est ravagée, Ar-Moab est détruite ! La nuit même où elle est ravagée, Kir-Moab est détruite ! »"
    - "Moab passa aux Nabatéens, puis en 106 apr. J.-C. à la province romaine d’Arabie ; Aréopolis était une ville épiscopale à l’époque byzantine. Rabba est aujourd’hui un village du gouvernorat de Karak, en Jordanie, avec les ruines d’un temple romain, et Balu’a est un champ de ruines au-dessus du Wadi Mujib ; la stèle est au Musée de Jordanie, à Amman."
  it:
    - "Ar, o Ar di Moab, era una delle principali città di Moab all’epoca dell’Esodo, e in alcuni versetti il nome sembra indicare il paese stesso di Moab, o la sua parte settentrionale. Il suo sito è ignoto. La vecchia identificazione risale a Girolamo, che equiparò Ar a Areopoli (Eusebio aveva già chiamato Areopoli la città di Moab), la città romana sull’altopiano a sud dell’Arnon oggi chiamata Rabba, a quanto pare per il suono del nome. Diversi studiosi preferiscono oggi Khirbet el-Balu‘a, una grande rovina dell’età del Ferro presso la gola dell’Arnon a nord di Rabba, dove nel 1930 fu trovata la stele di Balu‘a con il suo rilievo di stile egizio; sono stati proposti anche Misna e la stessa Rabba, Khirbet el-Medeineh e Kerak. Alcuni pensano che Ar non sia mai stata una città ma un distretto."
    - "Il Libro delle guerre del Signore, citato nei Numeri, nomina «i declivi delle valli che si estendono verso le dimore di Ar, e s’appoggiano alla frontiera di Moab», e il canto di scherno su Chesbon dice che il fuoco dalla città di Sicon «ha divorato Ar di Moab, i padroni delle alture dell’Arnon». Quando Israele salì dal deserto, a Mosè fu detto: «Non attaccare Moab e non gli muover guerra, [...] giacché ho dato Ar ai figliuoli di Lot, come loro proprietà»; gli Emim, un popolo alto come gli Anakim, vi avevano abitato prima. Israele passò «i confini di Moab, ad Ar», e i Moabiti «che abitano in Ar» gli vendettero cibo e acqua. L’oracolo di Isaia su Moab si apre: «Sì, nella notte in cui è devastata, Ar-Moab perisce! Sì, nella notte in cui è devastata, Kir-Moab perisce!»"
    - "Moab passò ai Nabatei e nel 106 d.C. alla provincia romana d’Arabia; Areopoli era una città con un vescovo in epoca bizantina. Rabba è oggi un villaggio del governatorato giordano di Karak con le rovine di un tempio romano, e Balu‘a è un campo di rovine sopra lo Wadi Mujib; la stele si trova nel Museo della Giordania ad Amman."
  pl:
    - "Ar, czyli Ar Moabskie, było głównym miastem Moabu w epoce wyjścia z Egiptu, a w niektórych wersetach nazwa zdaje się oznaczać sam kraj Moabu lub jego część północną. Jego położenie jest nieznane. Dawne utożsamienie sięga Hieronima, który zrównał Ar z Areopolis (Euzebiusz nazywał już Areopolis miasto Moab), rzymskim miastem na wyżynie na południe od Arnonu, dziś zwanym Rabba, najwyraźniej na podstawie brzmienia nazwy. Kilku uczonych woli obecnie Chirbet el-Balu'a, wielką ruinę z epoki żelaza koło wąwozu Arnonu na północ od Rabby, gdzie w 1930 roku znaleziono Stelę z Balu'a z reliefem w stylu egipskim; proponowano też Misnę i samą Rabbę, Chirbet el-Medeineh i Kerak. Niektórzy sądzą, że Ar nigdy nie było miastem, lecz okręgiem."
    - "Księga Wojen Pana, cytowana w Księdze Liczb, wymienia „ściekanie tych potoków, które się nachyliło (toczy) ku położeniu Har, to się ściąga ku granicy Moabskiej”, a pieśń szydercza o Cheszbonie mówi, że ogień z miasta Sychona „popalił Ar Moabskie, i obywatele wysokich miejsc Arnon”. Gdy Izrael wychodził z pustyni, Mojżeszowi powiedziano: „Nie nacieraj na Moabczyki, ani podnoś wojny przeciwko nim; boć nie dam ziemi ich w osiadłość, gdyżem synom Lotowym dał Ar w dziedzictwo”; Emici, lud wysoki jak Anakici, mieszkali tam wcześniej. Izrael przeszedł „granicę Moabską Ar”, a Moabczycy, „którzy mieszkają w Ar”, sprzedawali mu żywność i wodę. Wyrocznia Izajasza o Moabie zaczyna się: „Ponieważ w nocy zburzone i spustoszone będzie Ar Moabskie, ponieważ w nocy zburzone i spustoszone będzie Kir Moabskie”."
    - "Moab przeszedł do Nabatejczyków, a w 106 r. n.e. do rzymskiej prowincji Arabia; Areopolis było w czasach bizantyjskich miastem biskupim. Rabba jest dziś wsią w muhafazie Karak w Jordanii z ruinami rzymskiej świątyni, a Balu'a polem ruin nad Wadi Mujib; stela znajduje się w Muzeum Jordanii w Ammanie."
  nl:
    - "Ar, of Ar van Moab, was ten tijde van de uittocht een hoofdstad van Moab, en in sommige verzen lijkt de naam te staan voor het land Moab zelf, of voor het noordelijke deel ervan. De ligging is onbekend. De oude identificatie gaat terug op Hieronymus, die Ar gelijkstelde met Areopolis (Eusebius had de stad Moab al Areopolis genoemd), de Romeinse stad op het plateau ten zuiden van de Arnon die nu Rabba heet, blijkbaar op grond van de klank van de naam. Verscheidene geleerden verkiezen nu Khirbet el-Balu’a, een grote ijzertijdruïne bij de Arnonkloof ten noorden van Rabba, waar in 1930 de Balu’a-stèle met haar reliëf in Egyptische stijl werd gevonden; Misna en Rabba zelf, Khirbet el-Medeineh en Kerak zijn ook voorgesteld. Sommigen menen dat Ar nooit een stad was maar een district."
    - "Het Boek van de Oorlogen van de HEER, aangehaald in Numeri, noemt “den afloop der beken, die zich naar de gelegenheid van Ar wendt, en leent aan de landpale van Moab”, en het spotlied op Chesbon zegt dat het vuur uit Sihons stad “heeft verteerd Ar der Moabieten, en de heren der hoogten van de Arnon”. Toen Israël uit de woestijn optrok, werd tot Mozes gezegd: “Beangstig Moab niet, en meng u niet met hen in den strijd... dewijl Ik aan Lots kinderen Ar ter erfenis gegeven heb”; de Emim, een volk groot als de Enakieten, hadden er eerder gewoond. Israël zou “doortrekken aan Ar, de landpale van Moab”, en de Moabieten “die in Ar wonen” verkochten hun voedsel en water. Jesaja’s godsspraak over Moab opent: “Zekerlijk, in den nacht is Ar-Moabs verwoest, zij is uitgeroeid; zekerlijk, in den nacht is Kir-Moabs verwoest, zij is uitgeroeid!”"
    - "Moab ging over op de Nabateeërs en in 106 n.Chr. op de Romeinse provincie Arabië; Areopolis was in Byzantijnse tijd een stad met een bisschop. Rabba is tegenwoordig een dorp in het gouvernement Karak van Jordanië met de ruïnes van een Romeinse tempel, en Balu’a is een ruïnenveld boven de Wadi Mujib; de stèle bevindt zich in het Jordan Museum in Amman."
  cs:
    - "Ar, neboli Ar Moábský, byl jedním z hlavních měst Moábu v době exodu a v některých verších jméno zřejmě označuje samu zemi Moáb nebo její severní část. Jeho poloha není známa. Staré ztotožnění sahá k Jeronýmovi, který Ar ztotožnil s Areopolí (Eusebius už Areopolí nazýval město Moáb), římským městem na planině jižně od Arnonu, dnes zvaným Rabba, zřejmě podle znění jména. Několik badatelů nyní dává přednost Chirbet el-Balu'a, velké zřícenině z doby železné poblíž soutěsky Arnonu severně od Rabby, kde byla roku 1930 nalezena stéla z Balu'a s reliéfem v egyptském slohu; navrženy byly též Misna a sama Rabba, Chirbet el-Medeineh a Kerak. Někteří soudí, že Ar nebylo nikdy městem, nýbrž okrskem."
    - "Kniha bojů Hospodinových, citovaná v Numeri, jmenuje „tok těch potoků, kterýž se nachyluje ku položení Ar, ten jde vedlé pomezí Moábského“ a posměšná píseň o Chešbónu praví, že oheň z města Sichonova „spálil Ar Moábských a obyvatele výsosti Arnon“. Když Izrael vycházel z pouště, bylo Mojžíšovi řečeno: „Neškoď Moábským, ani jich popouzej k boji, nebo nedám tobě v zemi jejich dědictví, poněvadž synům Lot dal jsem Ar v dědictví“; Emimové, lid vysokého vzrůstu jako Anakovci, tam dříve bydleli. Izrael měl přejít „pomezí Moábské k městu Ar“ a Moábští, „kteříž bydlí v Ar“, mu prodávali jídlo a vodu. Izajášovo proroctví o Moábu začíná: „Když v noci Ar Moábské popléněno a zkaženo bude, když i Kir Moábské v noci popléněno a zkaženo bude“."
    - "Moáb přešel na Nabatejce a roku 106 n. l. do římské provincie Arábie; Areopolis byla v byzantské době městem s biskupem. Rabba je dnes vesnice v jordánském guvernorátu Karak se zříceninami římského chrámu a Balu'a je pole zřícenin nad vádí Mujib; stéla je v Jordánském muzeu v Ammánu."
