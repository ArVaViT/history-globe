body:
  en:
    - "Nain is the village of Nein in Lower Galilee, at the northern foot of the hill of Moreh, about 9 km south-east of Nazareth, looking across the valley to Mount Tabor. Endor lies about 4 km to the east, and Shunem on the far side of the same hill. The old name has survived, and the identification is generally accepted."
    - "Small salvage excavations in the modern village have found building remains of the Late Bronze Age, pottery of the Roman period and, from the Byzantine period, a pool paved with white mosaic and several winepresses. Surveys of the neighbouring site by the spring of En ha-Moreh recorded rock-cut tombs and pottery from the Early Bronze Age to the Iron Age."
    - 'Nain is named only in the Gospel of Luke. Jesus came there with his disciples and much people, and near the gate of the city met a funeral: the dead man was "the only son of his mother, and she was a widow". He had compassion on her, touched the bier and said, "Young man, I say unto thee, Arise." The dead man sat up and began to speak, and the people glorified God, saying "That a great prophet is risen up among us". The scene is often compared with Elisha''s raising of the son of a woman of Shunem, on the other side of the hill.'
    - "In the early fourth century Eusebius placed Nain south of Mount Tabor near Endor; his Greek text gives the distance as twelve miles, Jerome's Latin version as two. Jerome writes that when Paula climbed Tabor in the 380s, the town of Nain, where the widow's son was raised, was pointed out to her close by. The Byzantine finds show that the village was still lived in during the fifth and sixth centuries."
  ru:
    - "Наин — это селение Нейн в Нижней Галилее, у северного подножия холма Море, примерно в 9 км к юго-востоку от Назарета, напротив горы Фавор по ту сторону долины. Аэндор лежит примерно в 4 км к востоку, а Сонам — по другую сторону того же холма. Древнее имя сохранилось, и отождествление общепринято."
    - "Небольшие спасательные раскопки в нынешнем селении открыли остатки построек позднего бронзового века, керамику римского времени, а от византийской эпохи — бассейн, вымощенный белой мозаикой, и несколько винодавилен. Обследования соседнего городища у источника Эн-ха-Море выявили высеченные в скале гробницы и керамику от раннего бронзового века до железного."
    - "Наин назван только в Евангелии от Луки. Иисус пришёл туда с учениками и множеством народа и у городских ворот встретил похоронное шествие: выносили умершего, «единственного сына у матери, а она была вдова». Он сжалился над нею, прикоснулся к одру и сказал: «юноша! тебе говорю, встань!» Умерший поднялся, сел и стал говорить, и народ славил Бога, говоря: «великий пророк восстал между нами». Эту сцену часто сравнивают с тем, как Елисей воскресил сына женщины из Сонама, лежащего по другую сторону холма."
    - "В начале IV века Евсевий помещал Наин к югу от горы Фавор, близ Аэндора; в его греческом тексте расстояние — двенадцать миль, в латинском переводе Иеронима — две. Иероним пишет, что когда Павла в 380-х гг. поднималась на Фавор, ей показали неподалёку город Наин, где был воскрешён сын вдовы. Византийские находки показывают, что в V и VI веках селение было ещё обитаемо."
  uk:
    - "Наїн — це село Нейн у Нижній Галілеї, біля північного підніжжя пагорба Море, приблизно за 9 км на південний схід від Назарета, навпроти гори Фавор по той бік долини. Ендор лежить приблизно за 4 км на схід, а Сунем — по той бік того самого пагорба. Давня назва збереглася, і ототожнення загальноприйняте."
    - "Невеликі рятівні розкопки в сучасному селі виявили рештки будівель пізньої бронзової доби, кераміку римської доби та, з візантійського часу, басейн, викладений білою мозаїкою, і кілька давилень для винограду. Обстеження сусіднього поселення біля джерела Ен-ха-Море зафіксувало висічені в скелі гробниці та кераміку від ранньої бронзової до залізної доби."
    - "Наїн згадано лише в Євангелії від Луки. Ісус прийшов туди зі Своїми учнями та численним натовпом і біля міської брами зустрів похоронну процесію: виносили мертвого, «сина єдиного в матері своєї, вона ж була вдова». Господь змилосердився над нею, торкнувся мар і сказав: «Молодче, тобі глаголю: встань». Померлий сів і почав говорити, а люди прославляли Бога, кажучи: «Що пророк великий устав між нами». Цю сцену часто порівнюють із воскресінням Єлисеєм сина жінки з Сунема по той бік пагорба."
    - "На початку IV століття Євсевій розмістив Наїн на південь від гори Фавор, поблизу Ендора; у його грецькому тексті відстань становить дванадцять миль, а в латинському перекладі Єроніма — дві. Єронім пише, що коли Паула в 380-х роках піднімалася на Фавор, їй показали неподалік місто Наїн, де воскресили сина вдови. Візантійські знахідки свідчать, що село було заселене й у V–VI століттях."
  es:
    - "Naín es la aldea de Nein, en la Baja Galilea, al pie norte del collado de Moré, a unos 9 km al sureste de Nazaret, frente al monte Tabor al otro lado del valle. Endor queda a unos 4 km al este, y Sunem al otro lado del mismo collado. El antiguo nombre se ha conservado, y la identificación es generalmente aceptada."
    - "Pequeñas excavaciones de salvamento en la aldea moderna han hallado restos de edificios del Bronce Final, cerámica del período romano y, del período bizantino, una piscina pavimentada con mosaico blanco y varios lagares. Las prospecciones del yacimiento vecino, junto a la fuente de En ha-Moré, registraron tumbas excavadas en la roca y cerámica desde el Bronce Antiguo hasta la Edad del Hierro."
    - "Naín se nombra solo en el Evangelio de Lucas. Jesús llegó allí con sus discípulos y mucha gente, y cerca de la puerta de la ciudad se encontró con un entierro: el muerto era «unigénito de su madre, la cual también era viuda». Se compadeció de ella, tocó el féretro y dijo: «Mancebo, á ti digo, levántate». El muerto se incorporó y comenzó a hablar, y la gente glorificaba a Dios, diciendo: «Que un gran profeta se ha levantado entre nosotros». La escena suele compararse con la resurrección que hizo Eliseo del hijo de una mujer de Sunem, al otro lado del collado."
    - "A principios del siglo IV, Eusebio situó Naín al sur del monte Tabor, cerca de Endor; su texto griego da la distancia de doce millas, y la versión latina de Jerónimo, dos. Jerónimo escribe que cuando Paula subió al Tabor en la década de 380, le mostraron allí cerca la ciudad de Naín, donde fue resucitado el hijo de la viuda. Los hallazgos bizantinos muestran que la aldea seguía habitada en los siglos V y VI."
  pt:
    - "Naim é a aldeia de Nein, na Baixa Galileia, ao pé norte da colina de Moré, a cerca de 9 km a sudeste de Nazaré, de frente para o Monte Tabor do outro lado do vale. Endor fica a cerca de 4 km a leste, e Suném do outro lado da mesma colina. O nome antigo sobreviveu, e a identificação é geralmente aceita."
    - "Pequenas escavações de salvamento na aldeia moderna encontraram restos de edificações do Bronze Final, cerâmica do período romano e, do período bizantino, um tanque revestido de mosaico branco e vários lagares. Prospecções no sítio vizinho, junto à fonte de En ha-Moré, registraram tumbas escavadas na rocha e cerâmica do Bronze Antigo à Idade do Ferro."
    - "Naim é citada apenas no Evangelho de Lucas. Jesus chegou ali com seus discípulos e uma grande multidão e, perto da porta da cidade, encontrou um funeral: o morto era “o filho unigênito de sua mãe, e ela era viúva”. Ele teve compaixão dela, tocou no caixão e disse: “Jovem, eu lhe digo, levante-se!” O morto sentou-se e começou a falar, e o povo glorificou a Deus, dizendo: “Um grande profeta se levantou entre nós!” A cena costuma ser comparada à ressurreição, por Eliseu, do filho de uma mulher de Suném, do outro lado da colina."
    - "No início do século IV, Eusébio situou Naim ao sul do Monte Tabor, perto de Endor; seu texto grego dá a distância como doze milhas, e a versão latina de Jerônimo, como duas. Jerônimo escreve que, quando Paula subiu o Tabor, na década de 380, mostraram-lhe ali perto a cidade de Naim, onde o filho da viúva foi ressuscitado. Os achados bizantinos mostram que a aldeia ainda era habitada nos séculos V e VI."
  de:
    - "Nain ist das Dorf Nein in Untergaliläa, am Nordfuß des Hügels More, etwa 9 km südöstlich von Nazareth, mit Blick über das Tal auf den Berg Tabor. Endor liegt etwa 4 km östlich, Schunem auf der anderen Seite desselben Hügels. Der alte Name hat sich erhalten, und die Gleichsetzung wird allgemein anerkannt."
    - "Kleine Rettungsgrabungen im heutigen Dorf haben Baureste aus der Spätbronzezeit, Keramik der römischen Zeit und aus byzantinischer Zeit ein mit weißem Mosaik gepflastertes Becken und mehrere Weinpressen ans Licht gebracht. Begehungen der benachbarten Stätte bei der Quelle En ha-More verzeichneten Felsgräber und Keramik von der Frühbronzezeit bis zur Eisenzeit."
    - "Nain wird nur im Lukasevangelium genannt. Jesus kam mit seinen Jüngern und viel Volk dorthin und begegnete nahe dem Stadttor einem Leichenzug: Der Tote war „ein einziger Sohn … seiner Mutter, und sie war eine Witwe“. Er hatte Mitleid mit ihr, rührte den Sarg an und sprach: „Jüngling, ich sage dir, stehe auf!“ Der Tote richtete sich auf und begann zu reden, und das Volk pries Gott und sprach: „Es ist ein großer Prophet unter uns aufgestanden“. Die Szene wird oft mit der Totenerweckung des Sohnes der Frau von Schunem durch Elisa verglichen, auf der anderen Seite des Hügels."
    - "Im frühen 4. Jahrhundert verortete Eusebius Nain südlich des Berges Tabor bei Endor; sein griechischer Text gibt die Entfernung mit zwölf Meilen an, die lateinische Fassung des Hieronymus mit zwei. Hieronymus schreibt, als Paula in den 380er Jahren den Tabor bestieg, habe man ihr in der Nähe die Stadt Nain gezeigt, wo der Sohn der Witwe auferweckt wurde. Die byzantinischen Funde zeigen, dass das Dorf auch im 5. und 6. Jahrhundert bewohnt war."
  fr:
    - "Naïn est le village de Nein, en Basse Galilée, au pied nord de la colline de Moré, à environ 9 km au sud-est de Nazareth, face au mont Thabor de l’autre côté de la vallée. Endor se trouve à environ 4 km à l’est, et Sunem de l’autre côté de la même colline. L’ancien nom s’est conservé, et l’identification est généralement admise."
    - "De petites fouilles de sauvetage dans le village moderne ont mis au jour des restes de bâtiments de l’âge du Bronze récent, de la céramique de l’époque romaine et, de l’époque byzantine, un bassin pavé de mosaïque blanche et plusieurs pressoirs. Des prospections du site voisin, près de la source d’En ha-Moré, ont relevé des tombes taillées dans le roc et de la céramique allant du Bronze ancien à l’âge du Fer."
    - "Naïn n’est nommée que dans l’Évangile de Luc. Jésus y vint avec ses disciples et une grande foule, et près de la porte de la ville il rencontra un cortège funèbre : le mort était « fils unique de sa mère, qui était veuve ». Ému de compassion pour elle, il toucha le cercueil et dit : « Jeune homme, je te le dis, lève-toi ! » Le mort s’assit et se mit à parler, et la foule glorifiait Dieu, disant : « Un grand prophète a paru parmi nous ». On rapproche souvent la scène de la résurrection par Élisée du fils d’une femme de Sunem, de l’autre côté de la colline."
    - "Au début du IVe siècle, Eusèbe plaça Naïn au sud du mont Thabor, près d’Endor ; son texte grec donne la distance de douze milles, la version latine de Jérôme, de deux. Jérôme écrit que, lorsque Paula gravit le Thabor dans les années 380, on lui montra tout près la ville de Naïn, où le fils de la veuve fut ressuscité. Les trouvailles byzantines montrent que le village était encore habité aux Ve et VIe siècles."
  it:
    - "Nain è il villaggio di Nein, nella Bassa Galilea, ai piedi settentrionali del colle di Morè, circa 9 km a sud-est di Nazaret, di fronte al Monte Tabor oltre la valle. Endor si trova circa 4 km a est, e Sunem sul versante opposto dello stesso colle. L’antico nome è sopravvissuto e l’identificazione è generalmente accettata."
    - "Piccoli scavi di salvataggio nel villaggio moderno hanno riportato resti di edifici del Bronzo Tardo, ceramica di epoca romana e, dal periodo bizantino, una vasca rivestita di mosaico bianco e diversi frantoi per il vino. Le ricognizioni nel sito vicino, presso la sorgente di En ha-Moreh, hanno registrato tombe scavate nella roccia e ceramica dal Bronzo Antico all’età del Ferro."
    - "Nain è nominata solo nel Vangelo di Luca. Gesù vi giunse con i suoi discepoli e una grande folla e, presso la porta della città, incontrò un funerale: il morto era «figliuolo unico di sua madre; e questa era vedova». Ebbe pietà di lei, toccò la bara e disse: «Giovinetto, io tel dico, lèvati!» Il morto si levò a sedere e cominciò a parlare, e la gente glorificò Dio dicendo: «Un gran profeta è sorto fra noi». La scena è spesso accostata alla risurrezione del figlio della donna di Sunem da parte di Eliseo, sull’altro lato del colle."
    - "All’inizio del IV secolo Eusebio collocò Nain a sud del Monte Tabor, vicino a Endor; il suo testo greco indica la distanza in dodici miglia, la versione latina di Girolamo in due. Girolamo scrive che quando Paola salì sul Tabor, negli anni 380, le fu mostrata lì vicino la cittadina di Nain, dove fu risuscitato il figlio della vedova. I reperti bizantini mostrano che il villaggio era ancora abitato nel V e nel VI secolo."
  pl:
    - "Nain to wieś Nein w Dolnej Galilei, u północnego podnóża wzgórza More, około 9 km na południowy wschód od Nazaretu, z widokiem przez dolinę na górę Tabor. Endor leży około 4 km na wschód, a Szunem po drugiej stronie tego samego wzgórza. Dawna nazwa przetrwała, a utożsamienie jest powszechnie przyjmowane."
    - "Niewielkie wykopaliska ratunkowe w dzisiejszej wsi odsłoniły pozostałości zabudowy z późnej epoki brązu, ceramikę z okresu rzymskiego oraz, z okresu bizantyńskiego, basen wyłożony białą mozaiką i kilka tłoczni wina. Badania powierzchniowe sąsiedniego stanowiska przy źródle En ha-More odnotowały grobowce wykute w skale i ceramikę od wczesnej epoki brązu po epokę żelaza."
    - "Nain jest wymienione tylko w Ewangelii według Łukasza. Jezus przyszedł tam ze swoimi uczniami i licznym tłumem, a przy bramie miasta spotkał kondukt pogrzebowy: zmarły był „synem jedynym matki swojej, a ta była wdową”. Użalił się nad nią, dotknął mar i rzekł: „Młodzieńcze! tobie mówię, wstań”. Zmarły usiadł i zaczął mówić, a lud wielbił Boga, mówiąc: „Prorok wielki powstał między nami”. Scenę często porównuje się ze wskrzeszeniem przez Elizeusza syna niewiasty z Szunem, po drugiej stronie wzgórza."
    - "Na początku IV wieku Euzebiusz umieścił Nain na południe od góry Tabor, w pobliżu Endor; jego tekst grecki podaje odległość dwunastu mil, a łaciński przekład Hieronima dwóch. Hieronim pisze, że gdy Paula wspinała się na Tabor w latach osiemdziesiątych IV wieku, wskazano jej w pobliżu miasto Nain, w którym wskrzeszono syna wdowy. Znaleziska z okresu bizantyńskiego świadczą, że wieś była nadal zamieszkana w V i VI wieku."
  cs:
    - "Nain je vesnice Nein v Dolní Galileji, na severním úpatí pahorku Móre, asi 9 km jihovýchodně od Nazareta, s výhledem přes údolí na horu Tábor. Endór leží asi 4 km východně a Šúnem na druhé straně téhož pahorku. Staré jméno se dochovalo a ztotožnění je obecně přijímáno."
    - "Malé záchranné výzkumy v dnešní vesnici odkryly stavební zbytky z pozdní doby bronzové, keramiku z doby římské a z doby byzantské bazén vydlážděný bílou mozaikou a několik lisů na víno. Průzkumy sousední lokality u pramene En ha-Móre zaznamenaly skalní hrobky a keramiku od rané doby bronzové po dobu železnou."
    - "Nain je jmenován jen v Lukášově evangeliu. Ježíš tam přišel se svými učedníky a s mnohým zástupem a u městské brány potkal pohřební průvod: mrtvý byl „syn jediný matky své, a ta vdova byla“. Slitoval se nad ní, dotkl se márů a řekl: „Mládenče, toběť pravím, vstaň.“ Mrtvý se posadil a začal mluvit a lid velebil Boha, řkouce: „Že prorok veliký povstal mezi námi“. Výjev se často srovnává s tím, jak Elíša vzkřísil syna šúnemské ženy na druhé straně téhož pahorku."
    - "Na počátku 4. století Eusebius umístil Nain jižně od hory Tábor poblíž Endóru; jeho řecký text uvádí vzdálenost dvanáct mil, Jeronýmův latinský překlad dvě. Jeroným píše, že když Paula v 80. letech 4. století vystoupila na Tábor, ukázali jí nedaleko město Nain, kde byl vzkříšen syn vdovy. Byzantské nálezy ukazují, že vesnice byla obydlena i v 5. a 6. století."
  nl:
    - "Nain is het dorp Nein in Neder-Galilea, aan de noordvoet van de heuvel More, ongeveer 9 km ten zuidoosten van Nazareth, met uitzicht over de vallei op de berg Tabor. Endor ligt zo’n 4 km naar het oosten en Sunem aan de overkant van dezelfde heuvel. De oude naam is bewaard gebleven en de identificatie wordt algemeen aanvaard."
    - "Kleine noodopgravingen in het moderne dorp hebben bouwresten uit de late bronstijd, aardewerk uit de Romeinse tijd en uit de Byzantijnse tijd een bassin met wit mozaïek en enkele wijnpersen aan het licht gebracht. Onderzoek van de nabijgelegen vindplaats bij de bron En ha-More bracht uit de rotsen gehouwen graven en aardewerk uit de vroege bronstijd tot de ijzertijd in kaart."
    - "Nain wordt alleen in het evangelie van Lukas genoemd. Jezus kwam er met zijn discipelen en een grote menigte en ontmoette bij de stadspoort een begrafenisstoet: een dode werd uitgedragen, “die een eniggeboren zoon zijner moeder was, en zij was weduwe”. Hij had medelijden met haar, raakte de baar aan en zei: “Jongeling, Ik zeg u, sta op!” De dode ging rechtop zitten en begon te spreken, en het volk verheerlijkte God en zei: “Een groot Profeet is onder ons opgestaan”. Het tafereel wordt vaak vergeleken met de opwekking van de zoon van een vrouw uit Sunem door Elisa, aan de andere kant van de heuvel."
    - "In het begin van de 4e eeuw plaatste Eusebius Nain ten zuiden van de berg Tabor, bij Endor; in zijn Griekse tekst is de afstand twaalf mijl, in de Latijnse versie van Hieronymus twee. Hieronymus schrijft dat Paula, toen ze in de jaren 380 de Tabor besteeg, vlakbij de stad Nain werd aangewezen, waar de zoon van de weduwe was opgewekt. De Byzantijnse vondsten tonen dat het dorp in de vijfde en 6e eeuw nog werd bewoond."
  sv:
    - "Nain är byn Nein i Nedre Galileen, vid kullen Mores norra fot, omkring 9 km sydost om Nasaret, med utsikt över dalen mot Tabor. Endor ligger cirka 4 km österut, och Shunem på andra sidan av samma kulle. Det gamla namnet har bevarats, och identifikationen är allmänt godtagen."
    - "Mindre räddningsgrävningar i den moderna byn har påträffat byggnadsrester från sen bronsålder, keramik från romersk tid och, från bysantinsk tid, en bassäng belagd med vit mosaik samt flera vinpressar. Undersökningar av den närliggande platsen vid källan En ha-Moreh registrerade klippgravar och keramik från tidig bronsålder till järnålder."
    - "Nain nämns bara i Lukasevangeliet. Jesus kom dit med sina lärjungar och mycket folk, och nära stadsporten mötte han en likfärd: den döde var ”sin moders ende son, och hon var änka”. Han ömkade sig över henne, rörde vid båren och sade: ”Unge man, jag säger dig: Stå upp.” Den döde satte sig upp och började tala, och folket prisade Gud och sade att en ”stor profet har uppstått ibland oss”. Scenen jämförs ofta med Elishas uppväckande av sonen till en kvinna i Shunem, på andra sidan kullen."
    - "I början av 300-talet placerade Eusebios Nain söder om Tabor nära Endor; hans grekiska text anger avståndet som tolv romerska mil, Hieronymus latinska version som två. Hieronymus skriver att när Paula besteg Tabor på 380-talet visades staden Nain, där änkans son uppväcktes, för henne ganska nära. De bysantinska fynden visar att byn fortfarande var bebodd på 400- och 500-talen."
  nb:
    - "Nain er landsbyen Nein i Nedre Galilea, ved nordfoten av More-høyden, omtrent 9 km sørøst for Nasaret, med utsikt over dalen mot Tabor. En-Dor ligger omtrent 4 km mot øst, og Sjunem på andre siden av den samme høyden. Det gamle navnet har overlevd, og identifikasjonen er alminnelig godtatt."
    - "Små redningsutgravninger i den moderne landsbyen har funnet bygningsrester fra senbronsealderen, keramikk fra romertiden og fra bysantinsk tid et basseng belagt med hvit mosaikk og flere vinpresser. Undersøkelser av det nærliggende stedet ved kilden En ha-Moreh registrerte bergskårne graver og keramikk fra tidlig bronsealder til jernalder."
    - "Nain er bare nevnt i Lukasevangeliet. Jesus kom dit med sine disipler og mye folk, og nær byens port møtte han en begravelse: den døde var «sin mors eneste sønn, og hun var enke». Han ynkedes over henne, rørte ved båren og sa: «Du unge mann! jeg sier dig: Stå op!» Den døde reiste seg opp og begynte å tale, og folket priste Gud og sa: «En stor profet er opreist blandt oss». Scenen sammenlignes ofte med Elisjas oppvekkelse av sønnen til en kvinne i Sjunem, på den andre siden av høyden."
    - "Tidlig på 300-tallet plasserte Eusebius Nain sør for Tabor nær En-Dor; hans greske tekst oppgir avstanden som tolv romerske mil, Hieronymus' latinske versjon som to. Hieronymus skriver at da Paula besteg Tabor på 380-tallet, ble byen Nain, der enkens sønn ble reist opp, pekt ut for henne like ved. De bysantinske funnene viser at landsbyen fortsatt var bebodd på 400- og 500-tallet."
  tl:
    - "Ang Nain ay ang nayon ng Nein sa Mababang Galilea, sa hilagang paanan ng burol ng Moreh, mga 9 km sa timog-silangan ng Nazaret, na tanaw sa kabila ng libis ang Bundok Tabor. Ang Endor ay mga 4 km sa silangan, at ang Sunem sa kabilang panig ng iisang burol. Nanatili ang lumang pangalan, at karaniwang tinatanggap ang pagkilala."
    - "Ang maliliit na paghuhukay ng pagsagip sa makabagong nayon ay nakatagpo ng mga labi ng gusali mula sa Huling Panahong Tanso, mga palayok mula sa panahong Romano at, mula sa panahong Bisantino, isang tangke ng tubig na may sahig na puting mosaiko at ilang pisaan ng alak. Itinala ng mga pagsisiyasat sa karatig na lugar sa tabi ng bukal ng En ha-Moreh ang mga libingang tinabas sa bato at mga palayok mula sa Maagang Panahong Tanso hanggang sa Panahong Bakal."
    - "Sa Ebanghelyo lamang ni Lucas pinangalanan ang Nain. Dumating doon si Jesus kasama ang kaniyang mga alagad at ang lubhang maraming tao, at malapit sa pintuan ng bayan ay sinalubong ang isang libing: ang patay ay “bugtong na anak na lalake ng kaniyang ina, at siya'y bao”. Kinahabagan niya ito, hinipo ang kabaong at sinabi, “Binata, sinasabi ko sa iyo, Magbangon ka.” Naupo ang patay at nagpasimulang magsalita, at niluwalhati ng mga tao ang Dios, na sinasabi, “Lumitaw sa gitna natin ang isang dakilang propeta”. Madalas ihambing ang eksena sa pagbuhay ni Eliseo sa anak ng isang babae ng Sunem, sa kabilang panig ng burol."
    - "Sa unang bahagi ng ika-4 na siglo, inilagay ni Eusebio ang Nain sa timog ng Bundok Tabor malapit sa Endor; ibinibigay ng kaniyang tekstong Griyego ang layo bilang labindalawang milya, ng bersiyong Latin ni Jerome bilang dalawa. Isinulat ni Jerome na nang akyatin ni Paula ang Tabor noong dekada 380, itinuro sa kaniya sa malapit ang bayan ng Nain, kung saan binuhay ang anak ng biyuda. Ipinakikita ng mga natagpuang Bisantino na tinitirhan pa rin ang nayon noong ika-5 at ika-6 na siglo."
  da:
    - "Nain er landsbyen Nein i Nedre Galilæa, ved foden af More-højen mod nord, omkring 9 km sydøst for Nazaret, med udsigt over dalen til Tabor. Endor ligger omkring 4 km mod øst og Sjunem på den anden side af den samme høj. Det gamle navn har overlevet, og identifikationen er almindeligt accepteret."
    - "Små redningsudgravninger i den moderne landsby har fundet bygningsrester fra sen bronzealder, keramik fra romertiden og fra byzantinsk tid et bassin belagt med hvidt mosaikgulv og flere vinpresser. Undersøgelser af det nærliggende sted ved kilden En ha-More har registreret klippehuggede grave og keramik fra tidlig bronzealder til jernalder."
    - "Nain nævnes kun i Lukasevangeliet. Jesus kom dertil med sine disciple og en stor skare og mødte nær byens port et ligfølge: den døde var »sin Moders enbaarne Søn, og hun var Enke«. Han ynkedes over hende, rørte ved båren og sagde: »Du unge Mand, jeg siger dig, staa op!« Den døde satte sig op og begyndte at tale, og folk priste Gud og sagde: »Der er en stor Profet oprejst iblandt os«. Scenen sammenlignes ofte med Elisas opvækkelse af sønnen til en kvinde i Sjunem på den anden side af højen."
    - "I begyndelsen af 300-tallet placerede Eusebios Nain syd for Tabor nær Endor; hans græske tekst angiver afstanden som tolv romerske mil, Hieronymus' latinske version som to. Hieronymus skriver, at da Paula besteg Tabor i 380'erne, blev byen Nain, hvor enkens søn blev opvakt, vist hende tæt ved. De byzantinske fund viser, at landsbyen stadig var beboet i 400- og 500-tallet."
  sr:
    - "Наин је село Нејн у Доњој Галилеји, у северном подножју брда Море, око 9 км југоисточно од Назарета, с погледом преко долине на Тавор. Ендор лежи око 4 км источно, а Сунам са друге стране истог брда. Старо име се сачувало, а идентификација је опште прихваћена."
    - "Мања спасилачка ископавања у савременом селу открила су остатке зграда из касног бронзаног доба, керамику из римског периода и, из византијског периода, базен поплочан белим мозаиком и неколико преса за вино. Прегледи суседног налазишта код извора Ен ха-Море забележили су у стени уклесане гробнице и керамику од раног бронзаног до гвозденог доба."
    - "Наин се помиње само у Јеванђељу по Луки. Исус је ту дошао са својим ученицима и мноштвом народа, и крај градске капије срео погреб: мртвац је био „јединац син матере његове, и она беше удовица“. Сажалио се на њу, дотакао се сандука и рекао: „Момче! Теби говорим, устани.“ Мртвац је сео и почео да говори, а народ је хвалио Бога говорећи: „Велики пророк изиђе међу нама.“ Призор се често пореди с Јелисијевим подизањем сина жене из Сунама, са друге стране брда."
    - "Почетком 4. века Јевсевије је сместио Наин јужно од Тавора код Ендора; у његовом грчком тексту удаљеност је дванаест миља, у Јеронимовом латинском преводу две. Јероним пише да су Паули, кад се 380-их попела на Тавор, близу показали град Наин, где је васкрсао син удовице. Византијски налази показују да је село и у 5. и 6. веку било насељено."
  hu:
    - "Nain a mai Nein falu Alsó-Galileában, a Móré-domb északi lábánál, Názárettől mintegy 9 km-re délkeletre, a völgyön át a Tábor-hegyre tekintve. Endór körülbelül 4 km-re keletre fekszik, Súnem pedig ugyanannak a dombnak a túlsó oldalán. A régi név fennmaradt, és az azonosítást általánosan elfogadják."
    - "A mai faluban végzett kisebb mentőásatásokon késő bronzkori építmények maradványait, római kori kerámiát, a bizánci korból pedig fehér mozaikkal kirakott medencét és több présházat találtak. A szomszédos lelőhely felmérései az En ha-Moreh forrásánál sziklába vájt sírokat és a korai bronzkortól a vaskorig terjedő kerámiát rögzítettek."
    - "Nain csak Lukács evangéliumában szerepel. Jézus tanítványaival és sok néppel odament, és a város kapujánál temetési menettel találkozott: a halott „egyetlen egy fiát az anyjának, és az özvegy asszony vala”. Megszánta az asszonyt, megérintette a koporsót, és ezt mondta: „Ifjú, néked mondom, kelj föl!” A halott felült és beszélni kezdett, a nép pedig dicsőítette Istent, mondván: „Nagy próféta támadt mi köztünk”. A jelenetet gyakran összehasonlítják azzal, ahogyan Elizeus feltámasztotta a súnemi asszony fiát, a domb másik oldalán."
    - "A 4. század elején Euszebiosz Naint a Tábor-hegytől délre, Endór közelében helyezte el; görög szövege tizenkét mérföldet ad meg távolságként, Jeromos latin változata kettőt. Jeromos azt írja, hogy amikor Paula a 380-as években felmászott a Táborra, megmutatták neki a közelben Nain városát, ahol az özvegy fiát feltámasztották. A bizánci leletek azt mutatják, hogy a falu az 5. és 6. században is lakott volt."
  fi:
    - "Nain on Neinin kylä Ala-Galileassa, Moren kukkulan pohjoisjuurella, noin 9 km Nasaretista kaakkoon, katsoen laakson yli Taborvuorelle. Endor on noin 4 km itään ja Sunem saman kukkulan toisella puolella. Vanha nimi on säilynyt, ja tunnistus on yleisesti hyväksytty."
    - "Nykyisen kylän pienet pelastuskaivaukset ovat paljastaneet myöhäispronssikauden rakennusten jäännöksiä, roomalaisajan keramiikkaa ja bysanttilaiselta ajalta valkoisella mosaiikilla päällystetyn altaan sekä useita viinikuurnia. Viereisen, En ha-Moren lähteen luona sijaitsevan paikan kartoituksissa löydettiin kallioon hakattuja hautoja ja keramiikkaa varhaispronssikaudelta rautakaudelle."
    - "Nain mainitaan vain Luukkaan evankeliumissa. Jeesus tuli sinne opetuslastensa ja suuren kansanjoukon kanssa ja kohtasi kaupungin portin luona hautajaissaaton: kannettiin ulos kuollutta, ”äitinsä ainokaista poikaa. Ja äiti oli leski”. Hän armahti naista, kosketti paareja ja sanoi: ”Nuorukainen, minä sanon sinulle: nouse.” Kuollut nousi istualleen ja rupesi puhumaan, ja kansa ylisti Jumalaa sanoen: ”Suuri profeetta on noussut meidän keskellemme”. Kohtausta verrataan usein Elisan tekemään sunemilaisen vaimon pojan herättämiseen kukkulan toisella puolella."
    - "300-luvun alussa Eusebios sijoitti Nainin Taborvuoren eteläpuolelle Endorin lähelle; hänen kreikankielisessä tekstissään etäisyys on kaksitoista mailia, Hieronymuksen latinankielisessä käännöksessä kaksi. Hieronymus kertoo, että kun Paula nousi Taborille 380-luvulla, hänelle näytettiin läheltä Nainin kaupunki, jossa lesken poika herätettiin. Bysanttilaisajan löydöt osoittavat, että kylässä asuttiin yhä 400- ja 500-luvulla."
  vi:
    - "Na-in là làng Nein ở Hạ Ga-li-lê, dưới chân phía bắc của gò Mô-rê, cách Na-xa-rét khoảng 9 km về phía đông nam, nhìn qua thung lũng về phía núi Tha-bô. Ên-đô-rơ nằm cách khoảng 4 km về phía đông, và Su-nem ở phía bên kia của chính ngọn đồi này. Tên cũ còn lưu lại, và sự đồng nhất này được chấp nhận rộng rãi."
    - "Những cuộc khai quật cứu hộ quy mô nhỏ trong ngôi làng hiện đại đã tìm thấy di tích công trình thuộc Thời đại Đồ Đồng Muộn, đồ gốm thời La Mã và, từ thời Byzantine, một bể nước lát khảm trắng cùng vài bàn ép nho. Các cuộc khảo sát địa điểm lân cận bên suối En ha-Moreh ghi nhận những ngôi mộ đục trong đá và đồ gốm từ Thời đại Đồ Đồng Sớm đến Thời đại Đồ Sắt."
    - "Na-in chỉ được nêu tên trong Phúc Âm Lu-ca. Chúa Giê-su đến đó cùng các môn đồ và đoàn dân đông, và gần cửa thành gặp một đám tang: người chết là “con trai một của mẹ góa kia”. Ngài động lòng thương xót bà, rờ quan tài và phán: “Hỡi người trẻ kia, ta biểu ngươi chờ dậy.” Người chết ngồi dậy và khởi sự nói, và dân chúng ngợi khen Đức Chúa Trời: “Có đấng tiên tri lớn đã dấy lên giữa chúng tôi”. Cảnh này thường được so sánh với việc Ê-li-sê làm sống lại con trai một người đàn bà ở Su-nem, ở phía bên kia ngọn đồi."
    - "Đầu thế kỷ 4, Eusebius đặt Na-in ở phía nam núi Tha-bô, gần Ên-đô-rơ; bản Hy Lạp của ông ghi khoảng cách là mười hai dặm, còn bản Latin của Jerome ghi là hai. Jerome viết rằng khi Paula leo núi Tha-bô vào thập niên 380, người ta chỉ cho bà thấy gần đó thị trấn Na-in, nơi con trai người đàn bà góa được làm cho sống lại. Các phát hiện thời Byzantine cho thấy làng vẫn có người ở trong thế kỷ 5 và 6."
  ro:
    - "Nain este satul Nein din Galileea de Jos, la poalele nordice ale dealului Moreh, la circa 9 km sud-est de Nazaret, cu vedere peste vale spre Muntele Tabor. Endor se află la circa 4 km spre est, iar Șunem de partea cealaltă a aceluiași deal. Numele vechi s-a păstrat, iar identificarea este în general acceptată."
    - "Mici săpături de salvare în satul modern au găsit rămășițe de clădiri din Epoca bronzului târzie, ceramică din perioada romană și, din perioada bizantină, un bazin pavat cu mozaic alb și mai multe teascuri de vin. Cercetările de suprafață din situl vecin de lângă izvorul En ha-Moreh au consemnat morminte săpate în stâncă și ceramică din Epoca bronzului timpurie până în Epoca fierului."
    - "Nain este pomenit doar în Evanghelia după Luca. Isus a ajuns acolo cu ucenicii și cu mult norod și, aproape de poarta cetății, a întâlnit un cortegiu funerar: mortul era „fiu unul născut al maicei sale, și aceea erà văduvă”. I s-a făcut milă de ea, s-a atins de pat și a zis: „tânărule, ție grăesc: scoală-te!” Mortul a șezut drept și a început să vorbească, iar oamenii îl slăveau pe Dumnezeu, spunând că „proroc mare s’a sculat întru noi”. Scena este adesea comparată cu învierea de către Elisei a fiului femeii din Șunem, de cealaltă parte a dealului."
    - "La începutul secolului al IV-lea, Eusebiu a așezat Nainul la sud de Muntele Tabor, lângă Endor; textul său grecesc dă distanța de douăsprezece mile, iar versiunea latină a lui Ieronim, de două mile. Ieronim scrie că, atunci când Paula a urcat pe Tabor în anii 380, i s-a arătat în apropiere cetatea Nain, unde a fost înviat fiul văduvei. Descoperirile bizantine arată că satul era încă locuit în secolele al V-lea și al VI-lea."
  bg:
    - "Наин е селото Нейн в Долна Галилея, в северното подножие на хълма Море, на около 9 км югоизточно от Назарет, с изглед през долината към Тавор. Ендор се намира на около 4 км на изток, а Сунам — от другата страна на същия хълм. Старото име се е запазило и отъждествяването е общоприето."
    - "Малки спасителни разкопки в съвременното село са открили останки от сгради от късната бронзова епоха, керамика от римския период, а от византийския период — басейн, покрит с бяла мозайка, и няколко лина за грозде. Проучванията на съседния обект при извора Ен ха-Море са регистрирали изсечени в скалата гробници и керамика от ранната бронзова до желязната епоха."
    - "Наин се споменава само в Евангелието от Лука. Исус дошъл там с учениците си и много народ и близо до градската порта срещнал погребение: мъртвият бил „син единороден на майка си; и тя бе вдовица“. Той се смилил над нея, докоснал носилото и казал: „Момче, тебе казвам: Стани.“ Мъртвият седнал и започнал да говори, а народът славел Бога и казвал: „Пророк велик се подигна между нас“. Сцената често се сравнява с възкресяването от Елисей на сина на една жена от Сунам, от другата страна на хълма."
    - "В началото на IV в. Евсевий поставя Наин на юг от Тавор близо до Ендор; гръцкият му текст дава разстояние от дванадесет мили, а латинският превод на Йероним — две. Йероним пише, че когато Паула се изкачила на Тавор през 380-те години, ѝ показали наблизо град Наин, където бил възкресен синът на вдовицата. Византийските находки показват, че селото е било обитавано и през V и VI в."
