body:
  en:
    - "Ellasar is the kingdom of Arioch, one of the four eastern kings who with “Chedorlaomer king of Elam”, “Amraphel king of Shinar” and “Tidal king of nations” marched against the five cities of the plain, defeated them in the vale of Siddim and carried off Lot, until Abram pursued them to Dan and beyond Damascus and brought him back. The name occurs only in the two verses of that chapter, and the story gives it no place beyond its company with Shinar (Babylonia) and Elam."
    - "Where it lay is disputed, and the answer has moved with Assyriology. From the nineteenth century Ellasar was commonly read as Larsa, the great city of southern Babylonia (Senkereh), and Arioch was matched with its kings; later the name Arriyuk, borne by a vassal of Zimri-Lim in the Mari letters of the eighteenth century BC, and a town Ilanzura in northern Mesopotamia led some to seek Ellasar there, and Alashiya (Cyprus) and an Anatolian setting have also been proposed. The ancient versions went other ways: the Targum of Pseudo-Jonathan renders Ellasar as Telassar (Onkelos keeps Ellasar), and Symmachus and the Vulgate as Pontus. None of the four kings has been securely found in cuneiform records, the chronology of the chapter is itself debated, and Ellasar remains a name with several candidates and no proof."
  ru:
    - "Елласар — царство Ариоха, одного из четырёх восточных царей, которые вместе с «Кедорлаомером, царем Еламским», «Амрафелом, царем Сеннаарским» и «Фидалом, царем Гоимским» пошли на пять городов долины, разбили их в долине Сиддим и увели Лота, пока Аврам не погнался за ними до Дана и дальше Дамаска и не вернул его. Имя встречается только в двух стихах этой главы, и рассказ не даёт ему места, кроме соседства с Сеннааром (Вавилонией) и Еламом."
    - "Где он лежал, спорно, и ответ менялся вместе с ассириологией. С XIX века Елласар обычно читали как Ларсу, великий город южной Вавилонии (Сенкере), а Ариоха сопоставляли с её царями; позже имя Арриюк, которое носил вассал Зимри-Лима в письмах из Мари XVIII века до н. э., и город Иланцура в северной Месопотамии побудили некоторых искать Елласар там; предлагали также Алашию (Кипр) и Анатолию. Древние переводы шли своими путями: Таргум Псевдо-Ионафана передаёт Елласар как Фалассар (у Онкелоса остаётся Елласар), а Симмах и Вульгата — как Понт. Ни один из четырёх царей надёжно не найден в клинописных источниках, хронология самой главы спорна, и Елласар остаётся именем с несколькими кандидатами и без доказательства."
  uk:
    - "Елласар — це царство Аріоха, одного з чотирьох східних царів, які за часів «Амрафела царя Синеярського, і Арійоха, царя Еллазарського, Кедорлайомера, царя Еламського, і Тидала, царя Гоїмського» виступили проти п'яти міст рівнини, розбили їх у долині Сіддім і взяли в полон Лота, доки Аврам не погнався за ними до Дана і за Дамаск і не привів його назад. Назва трапляється лише у двох віршах того розділу, і оповідь не дає їй місця, крім сусідства з Сеннааром (Вавилонія) та Еламом."
    - "Де він лежав, є спірним, і відповідь змінювалася разом з ассиріологією. З XIX ст. Елласар зазвичай читали як Ларсу, велике місто південної Вавилонії (Сенкере), а Аріоха зіставляли з її царями; пізніше ім'я Арріюк, яке носив васал Зімрі-Ліма в листах з Марі XVIII ст. до н. е., і місто Іланцура в північній Месопотамії спонукали деяких шукати Елласар там, а також пропонували Алашію (Кіпр) і анатолійське розташування. Давні переклади пішли іншими шляхами: Таргум Псевдо-Йонатана передає Елласар як Телассар (в Онкелоса лишається Елласар), а Симмах і Вульгата — як Понт. Жоден із чотирьох царів не знайдений надійно в клинописних записах, хронологія розділу сама є спірною, і Елласар лишається назвою з кількома кандидатами й без доказу."
  es:
    - "Elasar es el reino de Arioc, uno de los cuatro reyes orientales que, con «Chêdorlaomer, rey de Elam», «Amraphel, rey de Shinar» y «Tidal, rey de naciones», marcharon contra las cinco ciudades de la llanura, las derrotaron en el valle de Sidim y se llevaron a Lot, hasta que Abram los persiguió hasta Dan y más allá de Damasco y lo trajo de vuelta. El nombre aparece solo en los dos versículos de ese capítulo, y el relato no le da más lugar que su compañía con Sinar (Babilonia) y Elam."
    - "Dónde estaba es objeto de debate, y la respuesta ha ido cambiando con la asiriología. Desde el siglo XIX se leyó comúnmente Elasar como Larsa, la gran ciudad del sur de Babilonia (Senkereh), y Arioc se hizo coincidir con sus reyes; más tarde, el nombre Arriyuk, que llevaba un vasallo de Zimri-Lim en las cartas de Mari del siglo XVIII a. C., y una ciudad Ilanzura en el norte de Mesopotamia, llevaron a algunos a buscar allí Elasar, y también se han propuesto Alashiya (Chipre) y un escenario anatolio. Las versiones antiguas siguieron otros caminos: el Targum Pseudo-Jonatán traduce Elasar como Telasar (Onkelos conserva Elasar), y Símaco y la Vulgata como Ponto. Ninguno de los cuatro reyes ha sido hallado con seguridad en los registros cuneiformes, la cronología del capítulo es en sí misma objeto de debate, y Elasar sigue siendo un nombre con varios candidatos y ninguna prueba."
  pt:
    - "Elasar é o reino de Arioque, um dos quatro reis orientais que, com “Quedorlaomer, rei de Elão”, “Anrafel, rei de Sinar” e “Tidal, rei de Goim”, marcharam contra as cinco cidades da planície, as derrotaram no vale de Sidim e levaram Ló, até que Abrão os perseguiu até Dã e além de Damasco e o trouxe de volta. O nome ocorre apenas nos dois versículos desse capítulo, e a narrativa não lhe dá lugar algum além da companhia de Sinar (Babilônia) e Elão."
    - "Onde ficava é disputado, e a resposta se moveu com a assiriologia. Desde o século XIX, Elasar foi comumente lida como Larsa, a grande cidade do sul da Babilônia (Senkereh), e Arioque foi associado a seus reis; mais tarde o nome Arriyuk, portado por um vassalo de Zinri-Lim nas cartas de Mari do século XVIII a.C., e uma cidade Ilanzura no norte da Mesopotâmia levaram alguns a buscar Elasar ali, e Alásia (Chipre) e um cenário anatólio também foram propostos. As versões antigas seguiram outros caminhos: o Targum Pseudo-Jonatã traduz Elasar por Telassar (Onkelos mantém Elasar), e Símaco e a Vulgata por Ponto. Nenhum dos quatro reis foi achado com segurança nos registros cuneiformes, a cronologia do capítulo é ela própria debatida, e Elasar continua sendo um nome com vários candidatos e nenhuma prova."
  de:
    - "Ellasar ist das Königreich Ariochs, eines der vier östlichen Könige, die mit „Kedor-Laomor, dem König von Elam“, „Amraphel, dem König von Sinear“ und „Thideal, dem König der Heiden“ gegen die fünf Städte der Ebene zogen, sie im Tal Siddim besiegten und Lot wegführten, bis Abram sie bis nach Dan und jenseits von Damaskus verfolgte und ihn zurückbrachte. Der Name kommt nur in den beiden Versen dieses Kapitels vor, und die Erzählung gibt ihm keinen Ort außer seiner Gesellschaft mit Schinar (Babylonien) und Elam."
    - "Wo es lag, ist umstritten, und die Antwort hat sich mit der Assyriologie verschoben. Seit dem 19. Jahrhundert wurde Ellasar gewöhnlich als Larsa gelesen, die große Stadt Südbabyloniens (Senkereh), und Arioch wurde mit deren Königen verglichen; später führten der Name Arriyuk, den ein Vasall des Zimri-Lim in den Briefen von Mari des 18. Jahrhunderts v. Chr. trug, und eine Stadt Ilanzura in Nordmesopotamien manche dazu, Ellasar dort zu suchen, und auch Alaschija (Zypern) und ein anatolischer Zusammenhang wurden vorgeschlagen. Die antiken Übersetzungen gingen andere Wege: Das Targum Pseudo-Jonathan gibt Ellasar als Telassar wieder (Onkelos behält Ellasar), und Symmachus und die Vulgata als Pontus. Keiner der vier Könige ist in Keilschriftquellen sicher gefunden, die Chronologie des Kapitels ist selbst umstritten, und Ellasar bleibt ein Name mit mehreren Kandidaten und ohne Beweis."
  fr:
    - "Ellasar est le royaume d’Arjoc, l’un des quatre rois orientaux qui, avec « Kedorlaomer, roi d’Élam », « Amraphel, roi de Schinear » et « Tideal, roi de Gojim », marchèrent contre les cinq villes de la plaine, les vainquirent dans la vallée de Siddim et emmenèrent Lot, jusqu’à ce qu’Abram les poursuive jusqu’à Dan et au-delà de Damas et le ramène. Le nom n’apparaît que dans les deux versets de ce chapitre, et le récit ne lui donne d’autre place que sa compagnie avec Schinear (la Babylonie) et Élam."
    - "Où elle se trouvait est débattu, et la réponse a évolué avec l’assyriologie. Depuis le XIXe siècle, Ellasar fut couramment lue comme Larsa, la grande ville du sud de la Babylonie (Senkereh), et Arjoc rapproché de ses rois ; plus tard, le nom Arriyuk, porté par un vassal de Zimri-Lim dans les lettres de Mari du XVIIIe siècle av. J.-C., et une ville Ilanzura dans le nord de la Mésopotamie ont conduit certains à l’y chercher, et Alashiya (Chypre) et un cadre anatolien ont aussi été proposés. Les versions anciennes ont pris d’autres voies : le targoum du Pseudo-Jonathan rend Ellasar par Télassar (Onkelos garde Ellasar), et Symmaque et la Vulgate par Pont. Aucun des quatre rois n’a été retrouvé avec certitude dans les sources cunéiformes, la chronologie du chapitre est elle-même débattue, et Ellasar reste un nom à plusieurs candidats et sans preuve."
  it:
    - "Ellasar è il regno di Arioc, uno dei quattro re orientali che con «Kedorlaomer re di Elam», «Amrafel re di Scinear» e «Tideal re dei Goim» marciarono contro le cinque città della pianura, le sconfissero nella valle di Siddim e portarono via Lot, finché Abramo li inseguì fino a Dan e oltre Damasco e lo riportò indietro. Il nome ricorre solo nei due versetti di quel capitolo, e il racconto non gli dà alcun luogo oltre alla sua compagnia con Sennaar (Babilonia) ed Elam."
    - "Dove si trovasse è controverso, e la risposta è mutata con l’assiriologia. Dall’Ottocento Ellasar fu comunemente letta come Larsa, la grande città della Babilonia meridionale (Senkereh), e Arioc fu accostato ai suoi re; più tardi il nome Arriyuk, portato da un vassallo di Zimri-Lim nelle lettere di Mari del XVIII secolo a.C., e una città Ilanzura nella Mesopotamia settentrionale indussero alcuni a cercare là Ellasar, e sono state proposte anche Alashiya (Cipro) e un’ambientazione anatolica. Le versioni antiche andarono altrove: il Targum Pseudo-Gionata rende Ellasar con Telassar (Onkelos conserva Ellasar), e Simmaco e la Vulgata con Ponto. Nessuno dei quattro re è stato trovato con sicurezza nei documenti cuneiformi, la cronologia del capitolo è essa stessa dibattuta, ed Ellasar resta un nome con vari candidati e nessuna prova."
  pl:
    - "Ellasar to królestwo Ariocha, jednego z czterech wschodnich królów, wymienionych „za dni Amrafela, króla Senaarskiego, Aryjocha, króla Ellasarskiego, Chodorlahomera, króla Elamskiego i Tydala, króla Goimskiego”, którzy wyruszyli przeciw pięciu miastom równiny, pokonali je w dolinie Syddim i uprowadzili Lota, aż Abram ścigał ich do Dan i poza Damaszek i przyprowadził go z powrotem. Nazwa występuje tylko w dwóch wersetach tego rozdziału, a opowieść nie przypisuje jej żadnego miejsca poza towarzystwem z Szinear (Babilonią) i Elamem."
    - "Gdzie leżał, jest sporne, a odpowiedź zmieniała się wraz z asyriologią. Od XIX w. Ellasar zwykle odczytywano jako Larsę, wielkie miasto południowej Babilonii (Senkere), a Ariocha zestawiano z jej królami; później nazwa Arrijuk, noszona przez wasala Zimri-Lima w listach z Mari z XVIII w. p.n.e., i miasto Ilanzura w północnej Mezopotamii skłoniły niektórych do szukania Ellasar tam, a proponowano także Alaszijję (Cypr) i miejsce w Anatolii. Starożytne przekłady poszły innymi drogami: Targum Pseudo-Jonatana oddaje Ellasar jako Telassar (Onkelos zachowuje Ellasar), a Symmach i Wulgata jako Pont. Żaden z czterech królów nie został pewnie odnaleziony w źródłach klinowych, chronologia rozdziału jest sama dyskutowana, a Ellasar pozostaje nazwą z kilkoma kandydatami i bez dowodu."
  nl:
    - "Ellasar is het koninkrijk van Arioch, een van de vier oostelijke koningen die met “Kedor-Laomer, den koning van Elam”, “Amrafel, den koning van Sinear” en “Tideal, den koning der volken” optrokken tegen de vijf steden van de vlakte, hen versloegen in het dal Siddim en Lot wegvoerden, totdat Abram hen tot Dan en voorbij Damascus achtervolgde en hem terugbracht. De naam komt alleen voor in de twee verzen van dat hoofdstuk, en het verhaal geeft haar geen plaats buiten haar gezelschap met Sinear (Babylonië) en Elam."
    - "Waar het lag, is omstreden, en het antwoord is met de Assyriologie meegegaan. Vanaf de negentiende eeuw werd Ellasar gewoonlijk gelezen als Larsa, de grote stad van zuidelijk Babylonië (Senkereh), en Arioch werd met haar koningen gelijkgesteld; later deden de naam Arriyuk, gedragen door een vazal van Zimri-Lim in de brieven van Mari uit de achttiende eeuw v.Chr., en een stad Ilanzura in Noord-Mesopotamië sommigen daar Ellasar zoeken, en ook Alashiya (Cyprus) en een Anatolische ligging zijn voorgesteld. De oude versies gingen andere wegen: de Targum Pseudo-Jonatan geeft Ellasar weer als Telassar (Onkelos behoudt Ellasar), en Symmachus en de Vulgaat als Pontus. Geen van de vier koningen is met zekerheid in spijkerschriftbronnen gevonden, de chronologie van het hoofdstuk is zelf omstreden, en Ellasar blijft een naam met meerdere kandidaten en zonder bewijs."
  cs:
    - "Elasar je království Arjóka, jednoho ze čtyř východních králů, kteří s Kedorlaomerem, „králem Elamitským“, Amrafelem, „králem Sinearským“, a Tidalem, „králem Goimským“ táhli proti pěti městům roviny, porazili je v údolí Siddim a odvlekli Lota, dokud je Abram nepronásledoval až k Danu a za Damašek a nepřivedl ho zpět. Jméno se vyskytuje jen ve dvou verších té kapitoly a příběh mu nedává žádné místo kromě společnosti Šineáru (Babylonie) a Élamu."
    - "Kde ležel, je sporné a odpověď se pohybovala s asyriologií. Od 19. století byl Elasar běžně čten jako Larsa, velké město jižní Babylonie (Senkereh), a Arjók byl ztotožňován s jeho králi; později jméno Arriyuk, které nosil vazal Zimrí-Lima v dopisech z Mari z 18. století př. n. l., a město Ilanzura v severní Mezopotámii vedly některé k hledání Elasaru tam a navrhována byla také Alašija (Kypr) a anatolské prostředí. Staré překlady šly jinými cestami: Targum Pseudo-Jonatan překládá Elasar jako Telassar (Onkelos ponechává Elasar) a Symmachos a Vulgáta jako Pontus. Žádný ze čtyř králů nebyl bezpečně nalezen v klínopisných záznamech, chronologie kapitoly je sama sporná a Elasar zůstává jménem s několika kandidáty a bez důkazu."
  sv:
    - "Ellasar är Arjoks kungarike, en av de fyra östliga kungarna som tillsammans med ”Kedorlaomer, konungen i Elam”, ”Amrafel, konungen i Sinear” och ”Tideal, konungen över Goim” tågade mot de fem städerna på slätten, besegrade dem i Siddimsdalen och bortförde Lot, tills Abram förföljde dem till Dan och bortom Damaskus och förde honom tillbaka. Namnet förekommer bara i två verser i det kapitlet, och berättelsen ger det ingen plats utöver dess sällskap med Shinar (Babylonien) och Elam."
    - "Var det låg är omtvistat, och svaret har rört sig med assyriologin. Från 1800-talet lästes Ellasar vanligen som Larsa, den stora staden i södra Babylonien (Senkereh), och Arjok jämfördes med dess kungar; senare ledde namnet Arriyuk, som bars av en vasall till Zimri-Lim i Mari-breven från 1700-talet f.Kr., och en stad Ilanzura i norra Mesopotamien några att söka Ellasar där, och Alashiya (Cypern) och en anatolisk miljö har också föreslagits. De antika översättningarna gick andra vägar: Targum Pseudo-Jonatan återger Ellasar som Telassar (Onkelos behåller Ellasar), och Symmachos och Vulgata som Pontos. Ingen av de fyra kungarna har säkert hittats i kilskriftskällor, kapitlets kronologi är själv omdebatterad, och Ellasar förblir ett namn med flera kandidater och inget bevis."
  nb:
    - "Ellasar er riket til Arjok, en av de fire østlige kongene som sammen med «Kedorlaomer konge i Elam», «Amrafel ... konge i Sinear» og «Tideal konge over Gojim» drog mot de fem byene på sletten, beseiret dem i Siddim-dalen og førte Lot bort, til Abram forfulgte dem til Dan og forbi Damaskus og brakte ham tilbake. Navnet forekommer bare i de to versene i dette kapitlet, og fortellingen gir det ikke noe sted utover følget med Sinear (Babylonia) og Elam."
    - "Hvor det lå, er omdiskutert, og svaret har flyttet seg med assyriologien. Fra 1800-tallet ble Ellasar vanligvis lest som Larsa, den store byen i Sør-Babylonia (Senkereh), og Arjok ble sammenstilt med dens konger; senere fikk navnet Arriyuk, båret av en vasall av Simri-Lim i Mari-brevene fra 1700-tallet f.Kr., og en by Ilanzura i Nord-Mesopotamia noen til å søke Ellasar der, og Alashiya (Kypros) og en anatolisk ramme er også foreslått. De gamle oversettelsene gikk andre veier: Targum Pseudo-Jonatan gjengir Ellasar som Telassar (Onkelos beholder Ellasar), og Symmakhos og Vulgata som Pontos. Ingen av de fire kongene er sikkert funnet i kileskriftkilder, kapitlets kronologi er selv omdiskutert, og Ellasar forblir et navn med flere kandidater og uten bevis."
  tl:
    - "Ang Elasar ay ang kaharian ni Arioch, isa sa apat na haring silangan na kasama ni “Chedorlaomer hari sa Elam”, “Amraphel, hari sa Sinar” at “Tidal na hari ng mga Goiim” ay nagmartsa laban sa limang lungsod ng kapatagan, tinalo sila sa libis ng Siddim at dinala si Lot, hanggang hinabol sila ni Abram sa Dan at sa kabila ng Damasco at ibinalik siya. Lumilitaw lamang ang pangalan sa dalawang talata ng kabanatang iyon, at wala itong ibinibigay na pook ang kuwento maliban sa kasama nitong Shinar (Babilonia) at Elam."
    - "Pinagtatalunan kung saan ito, at lumipat ang sagot kasabay ng Asiriolohiya. Mula ika-19 na siglo, karaniwang binasa ang Elasar bilang Larsa, ang dakilang lungsod ng timog Babilonia (Senkereh), at itinugma si Arioch sa mga hari nito; nang maglaon, ang pangalang Arriyuk, dala ng isang basalyo ni Zimri-Lim sa mga liham ng Mari noong ika-18 siglo BK, at isang bayang Ilanzura sa hilagang Mesopotamia ang nag-akay sa ilang maghanap doon, at iminungkahi rin ang Alashiya (Chipre) at Anatolia. Iba ang tinahak ng mga sinaunang bersiyon: isinalin ng Targum ni Pseudo-Jonathan ang Elasar na Thelasar (iniingatan ng Onkelos ang Elasar), at ng Symmachus at ng Vulgate na Ponto. Walang hari sa apat ang tiyak na natagpuan sa mga talaang cuneiform, pinagtatalunan din ang kronolohiya ng kabanata, at nananatiling pangalang may ilang kandidato at walang patunay ang Elasar."
  da:
    - "Ellasar er kongeriget tilhørende Arjok, en af de fire østlige konger, som sammen med »Kedorlaomer, Kongen af Elam«, »Amrafel, Kongen af Sinear« og »Thideal, Kongen over Gojim« drog imod de fem slettebyer, slog dem i Siddims Dal og førte Lot bort, indtil Abram forfulgte dem til Dan og hinsides Damaskus og bragte ham tilbage. Navnet forekommer kun i de to vers i det kapitel, og fortællingen giver det ikke noget sted ud over dets nævnelse sammen med Sinear (Babylonien) og Elam."
    - "Hvor det lå, er omstridt, og svaret har bevæget sig med assyriologien. Fra 1800-tallet læstes Ellasar almindeligvis som Larsa, den store by i det sydlige Babylonien (Senkereh), og Arjok blev sidestillet med dens konger; senere fik navnet Arriyuk, båret af en vasal under Zimri-Lim i Mari-brevene fra 1700-tallet f.Kr., og en by Ilanzura i det nordlige Mesopotamien nogle til at søge Ellasar dér, og Alashiya (Cypern) og en anatolisk ramme er også blevet foreslået. De gamle oversættelser gik andre veje: Targum Pseudo-Jonatan gengiver Ellasar som Telassar (Onkelos bevarer Ellasar), og Symmachos og Vulgata som Pontus. Ingen af de fire konger er sikkert fundet i kileskriftoptegnelser, kapitlets kronologi er selv omdiskuteret, og Ellasar forbliver et navn med flere kandidater og uden bevis."
  sr:
    - "Еласар је краљевство Ариохово, једног од четири источна цара; остала тројица су „Ходологомор цар еламски“, „Амарфал цар сенарски“ и „Таргал цар гојимски“, и они су кренули против пет градова у равници, победили их у долини Сидим и однели Лота, док их Аврам није гонио до Дана и иза Дамаска и вратио га. Име се јавља само у два стиха тог поглавља, а прича му не даје место осим његовог друштва са Сенаром (Вавилонијом) и Еламом."
    - "Где је лежао, спорно је, а одговор се мењао са асириологијом. Од 19. века Еласар се обично читао као Ларса, велики град јужне Вавилоније (Сенкере), а Ариох је упоређиван с њеним краљевима; касније су име Ариук, које је носио вазал Зимри-Лима у писмима из Мари из 18. века п. н. е., и град Иланзура у северној Месопотамији навели неке да тамо траже Еласар, а предлагани су и Алашија (Кипар) и анадолски оквир. Старе верзије су ишле другим путевима: Таргум Псеудо-Јонатан преводи Еласар као Теласар (Онкелос задржава Еласар), а Симах и Вулгата као Понт. Ниједан од четири краља није поуздано нађен у клинастим записима, хронологија поглавља је и сама спорна, и Еласар остаје име са неколико кандидата и без доказа."
  hu:
    - "Ellászár Arjók királysága, annak a négy keleti királynak az egyike, akik – „Khédorlaomerrel, Élám királyával, és Thidállal, Gójim királyával, Amráfellel, Sineár királyával, és Ariókhkal, Elászár királyával: négy király öt ellen” – a síkság öt városa ellen vonultak, a Siddim-völgyben legyőzték őket, és elhurcolták Lótot, amíg Ábrám Dánig és Damaszkuszon túlra nem üldözte őket, és vissza nem hozta. A név csak e fejezet két versében fordul elő, és a történet Sineárral (Babilónia) és Élámmal való társaságán kívül nem ad neki helyet."
    - "Hogy hol feküdt, vitatott, és a válasz az asszíriológiával együtt mozdult. A 19. századtól Ellászárt gyakran Larszaként olvasták, Dél-Babilónia nagy városaként (Senkereh), és Arjókot királyaival párosították; később az Arriyuk név, amelyet Zimri-Lim egyik vazallusa viselt a Kr. e. 18. századi marii levelekben, és az észak-mezopotámiai Ilanzura város néhányakat arra vitt, hogy ott keressék Ellászárt, Alasiját (Ciprust) és anatóliai környezetet is javasoltak. Az ókori fordítások másfelé mentek: a Pszeudo-Jonatán targum Ellászárt Telassárként adja (Onkelosz megtartja az Ellászárt), Szümmakhosz és a Vulgata Pontusként. A négy király egyikét sem találták meg biztosan az ékírásos feljegyzésekben, a fejezet kronológiája maga is vitatott, és Ellászár több jelöltes, bizonyíték nélküli név marad."
  fi:
    - "Ellasar on Arjokin valtakunta; hän oli yksi neljästä itäisestä kuninkaasta (”Amrafel oli Sinearin kuninkaana, Arjok Ellasarin kuninkaana, Kedorlaomer Eelamin kuninkaana ja Tidal Goojimin kuninkaana”), jotka marssivat tasangon viittä kaupunkia vastaan, voittivat ne Siddimin laaksossa ja veivät Lootin, kunnes Abram ajoi heitä takaa Daniin ja Damaskoksen taakse ja toi hänet takaisin. Nimi esiintyy vain kahdessa tuon luvun jakeessa, eikä kertomus anna sille paikkaa lukuun ottamatta sen seuraa Sinearin (Babylonia) ja Elamin kanssa."
    - "Missä se sijaitsi, on kiistanalaista, ja vastaus on liikkunut assyriologian mukana. 1800-luvulta lähtien Ellasar luettiin yleisesti Larsaksi, Etelä-Babylonian suureksi kaupungiksi (Senkereh), ja Arjok rinnastettiin sen kuninkaisiin; myöhemmin nimi Arriyuk, jota Zimri-Limin vasalli kantoi Marin kirjeissä 1700-luvulta eaa., ja Pohjois-Mesopotamiassa sijainnut kaupunki Ilanzura saivat jotkut etsimään Ellasaria sieltä, ja myös Alashiyaa (Kyprosta) ja anatolialaista ympäristöä on ehdotettu. Muinaiset käännökset kulkivat toisia teitä: Targum Pseudo-Jonathan kääntää Ellasarin Telassariksi (Onkelos säilyttää Ellasarin), ja Symmakhos ja Vulgata Pontokseksi. Yhtäkään neljästä kuninkaasta ei ole varmasti löydetty nuolenpääkirjoituksista, luvun kronologiakin on kiistanalainen, ja Ellasar on yhä nimi, jolla on useita ehdokkaita eikä todistetta."
  vi:
    - "Ê-la-sa là vương quốc của A-ri-ốc, một trong bốn vua phương đông cùng với “Kết-rô-Lao-me, vua Ê-lam”, “Am-ra-phên, vua Si-nê-a” và “Ti-đanh, vua Gô-im” tiến quân chống năm thành trong đồng bằng, đánh bại họ trong trũng Si-điêm và bắt Lót đi, cho đến khi Áp-ram đuổi theo họ đến Đan và vượt qua Đa-mách rồi đem ông về. Tên chỉ xuất hiện trong hai câu của chương đó, và câu chuyện không cho nó vị trí nào ngoài việc nó đi cùng Si-nê-a (Ba-by-lôn) và Ê-lam."
    - "Nó nằm ở đâu còn tranh cãi, và câu trả lời đã thay đổi theo ngành Assyria học. Từ thế kỷ 19, Ê-la-sa thường được đọc là Larsa, thành lớn của nam Ba-by-lôn (Senkereh), và A-ri-ốc được ghép với các vua của nó; về sau tên Arriyuk, do một chư hầu của Zimri-Lim mang trong các thư Mari thế kỷ 18 TCN, và một thị trấn Ilanzura ở bắc Mê-sô-bô-ta-mi đã khiến một số người tìm Ê-la-sa ở đó, và Alashiya (Chíp-rơ) cùng một bối cảnh Anatolia cũng đã được đề nghị. Các bản dịch cổ đi những hướng khác: Targum Pseudo-Jonathan dịch Ellasar là Telassar (Onkelos giữ Ellasar), còn Symmachus và bản Vulgate dịch là Pontus. Chưa tìm thấy chắc chắn vị vua nào trong bốn vua trong các ghi chép chữ hình nêm, niên đại của chương này cũng còn tranh luận, và Ê-la-sa vẫn là một cái tên với nhiều ứng viên và không có bằng chứng."
  ro:
    - "Elasar este regatul lui Arioc, unul dintre cei patru regi din răsărit care, împreună cu „Hodologomor, împăratul Elamului”, „Amarfal, împăratul Senaarului” și „Targal, împăratul neamurilor”, au mărșăluit împotriva celor cinci cetăți din câmpie, le-au învins în valea Sidim și l-au luat pe Lot, până când Avram i-a urmărit până la Dan și dincolo de Damasc și l-a adus înapoi. Numele apare numai în cele două versete ale acelui capitol, iar istorisirea nu-i dă niciun loc în afara tovărășiei cu Șinear (Babilonia) și Elam."
    - "Unde se afla este disputat, iar răspunsul s-a mișcat odată cu asiriologia. Din secolul al XIX-lea, Elasar a fost citit de obicei ca Larsa, marea cetate din sudul Babiloniei (Senkereh), iar Arioc a fost asemuit cu regii ei; mai târziu, numele Arriyuk, purtat de un vasal al lui Zimri-Lim în scrisorile de la Mari din secolul al XVIII-lea î.Hr., și o cetate Ilanzura din nordul Mesopotamiei i-au făcut pe unii să caute Elasarul acolo, iar au fost propuse și Alashiya (Ciprul) și un cadru anatolian. Versiunile antice au mers pe alte căi: Targumul Pseudo-Ionatan redă Elasar ca Telasar (Onkelos păstrează Elasar), iar Symmachus și Vulgata ca Pont. Niciunul dintre cei patru regi nu a fost găsit sigur în înregistrările cuneiforme, cronologia capitolului este ea însăși disputată, iar Elasar rămâne un nume cu mai mulți candidați și fără dovadă."
  bg:
    - "Еласар е царството на Ариох, един от четиримата източни царе, които заедно с Кедорлаомер, „царя Еламскаго“, Амрафел, „царя Сенаарскаго“, и Тидал, „царя Гоимскаго“, тръгнали срещу петте града на равнината, разбили ги в долината Сидим и отвели Лот, докато Аврам не ги преследвал до Дан и отвъд Дамаск и не го върнал. Името се среща само в двата стиха на тази глава и разказът не му дава място освен съседството му със Сенаар (Вавилония) и Елам."
    - "Къде е лежал, е спорно, и отговорът се е менял заедно с асириологията. От XIX в. Еласар обикновено се чете като Ларса, големия град на Южна Вавилония (Сенкере), а Ариох бил съпоставян с нейните царе; по-късно името Арийук, носено от васал на Зимри-Лим в писмата от Мари от XVIII в. пр.н.е., и един град Иланцура в Северна Месопотамия накарали някои да търсят Еласар там, а са предлагани и Алашия (Кипър) и Анатолия. Древните преводи тръгнали по други пътища: Таргумът на Псевдо-Йонатан предава Еласар като Таласар (Онкелос запазва Еласар), а Симах и Вулгата — като Понт. Никой от четиримата царе не е сигурно открит в клинописните източници, хронологията на главата сама по себе си е спорна, и Еласар остава име с няколко кандидата и без доказателство."
