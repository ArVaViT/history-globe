# Overview article (ADR 0007). Mainstream facts only; the candidates (Larsa, Ilanzura, Alashiya, Pontus, Telassar) are given fairly and none is chosen; the chronology of Genesis 14 is called debated.
id: ellasar
place: a6f4a6d
title:
  en: "Ellasar"
  ru: "Елласар"
body:
  en:
    - "Ellasar is the kingdom of Arioch, one of the four eastern kings who with “Chedorlaomer king of Elam”, “Amraphel king of Shinar” and “Tidal king of nations” marched against the five cities of the plain, defeated them in the vale of Siddim and carried off Lot, until Abram pursued them to Dan and beyond Damascus and brought him back. The name occurs only in the two verses of that chapter, and the story gives it no place beyond its company with Shinar (Babylonia) and Elam."
    - "Where it lay is disputed, and the answer has moved with Assyriology. From the nineteenth century Ellasar was commonly read as Larsa, the great city of southern Babylonia (Senkereh), and Arioch was matched with its kings; later the name Arriyuk, borne by a son of Zimri-Lim in the Mari letters of the eighteenth century BC, and a town Ilanzura in northern Mesopotamia led some to seek Ellasar there, and Alashiya (Cyprus) and an Anatolian setting have also been proposed. The ancient versions went other ways: the Targum of Onkelos renders Ellasar as Telassar, and Symmachus and the Vulgate as Pontus. None of the four kings has been securely found in cuneiform records, the chronology of the chapter is itself debated, and Ellasar remains a name with several candidates and no proof."
  ru:
    - "Елласар — царство Ариоха, одного из четырёх восточных царей, которые вместе с «Кедорлаомером, царем Еламским», «Амрафелом, царем Сеннаарским» и «Фидалом, царем Гоимским» пошли на пять городов долины, разбили их в долине Сиддим и увели Лота, пока Аврам не погнался за ними до Дана и дальше Дамаска и не вернул его. Имя встречается только в двух стихах этой главы, и рассказ не даёт ему места, кроме соседства с Сеннааром (Вавилонией) и Еламом."
    - "Где он лежал, спорно, и ответ менялся вместе с ассириологией. С XIX века Елласар обычно читали как Ларсу, великий город южной Вавилонии (Сенкере), а Ариоха сопоставляли с её царями; позже имя Арриюк, которое носил сын Зимри-Лима в письмах из Мари XVIII века до н. э., и город Иланцура в северной Месопотамии побудили некоторых искать Елласар там; предлагали также Алашию (Кипр) и Анатолию. Древние переводы шли своими путями: Таргум Онкелоса передаёт Елласар как Фалассар, а Симмах и Вульгата — как Понт. Ни один из четырёх царей надёжно не найден в клинописных источниках, хронология самой главы спорна, и Елласар остаётся именем с несколькими кандидатами и без доказательства."
scripture:
  - Gen.14.1
  - Gen.14.9
