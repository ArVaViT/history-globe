body:
  en:
    - "Ellasar is the kingdom of Arioch, one of the four eastern kings who with “Chedorlaomer king of Elam”, “Amraphel king of Shinar” and “Tidal king of nations” marched against the five cities of the plain, defeated them in the vale of Siddim and carried off Lot, until Abram pursued them to Dan and beyond Damascus and brought him back. The name occurs only in the two verses of that chapter, and the story gives it no place beyond its company with Shinar (Babylonia) and Elam."
    - "Where it lay is disputed, and the answer has moved with Assyriology. From the nineteenth century Ellasar was commonly read as Larsa, the great city of southern Babylonia (Senkereh), and Arioch was matched with its kings; later the name Arriyuk, borne by a son of Zimri-Lim in the Mari letters of the eighteenth century BC, and a town Ilanzura in northern Mesopotamia led some to seek Ellasar there, and Alashiya (Cyprus) and an Anatolian setting have also been proposed. The ancient versions went other ways: the Targum of Onkelos renders Ellasar as Telassar, and Symmachus and the Vulgate as Pontus. None of the four kings has been securely found in cuneiform records, the chronology of the chapter is itself debated, and Ellasar remains a name with several candidates and no proof."
  ru:
    - "Елласар — царство Ариоха, одного из четырёх восточных царей, которые вместе с «Кедорлаомером, царем Еламским», «Амрафелом, царем Сеннаарским» и «Фидалом, царем Гоимским» пошли на пять городов долины, разбили их в долине Сиддим и увели Лота, пока Аврам не погнался за ними до Дана и дальше Дамаска и не вернул его. Имя встречается только в двух стихах этой главы, и рассказ не даёт ему места, кроме соседства с Сеннааром (Вавилонией) и Еламом."
    - "Где он лежал, спорно, и ответ менялся вместе с ассириологией. С XIX века Елласар обычно читали как Ларсу, великий город южной Вавилонии (Сенкере), а Ариоха сопоставляли с её царями; позже имя Арриюк, которое носил сын Зимри-Лима в письмах из Мари XVIII века до н. э., и город Иланцура в северной Месопотамии побудили некоторых искать Елласар там; предлагали также Алашию (Кипр) и Анатолию. Древние переводы шли своими путями: Таргум Онкелоса передаёт Елласар как Фалассар, а Симмах и Вульгата — как Понт. Ни один из четырёх царей надёжно не найден в клинописных источниках, хронология самой главы спорна, и Елласар остаётся именем с несколькими кандидатами и без доказательства."
  uk:
    - "Елласар — це царство Аріоха, одного з чотирьох східних царів, які за часів «Амрафела царя Синеярського, і Арійоха, царя Еллазарського, Кедорлайомера, царя Еламського, і Тидала, царя Гоїмського» виступили проти п'яти міст рівнини, розбили їх у долині Сіддім і взяли в полон Лота, доки Аврам не погнався за ними до Дана і за Дамаск і не привів його назад. Назва трапляється лише у двох віршах того розділу, і оповідь не дає їй місця, крім сусідства з Сеннааром (Вавилонія) та Еламом."
    - "Де він лежав, є спірним, і відповідь змінювалася разом з ассиріологією. З XIX ст. Елласар зазвичай читали як Ларсу, велике місто південної Вавилонії (Сенкере), а Аріоха зіставляли з її царями; пізніше ім'я Арріюк, яке носив син Зімрі-Ліма в листах з Марі XVIII ст. до н. е., і місто Іланцура в північній Месопотамії спонукали деяких шукати Елласар там, а також пропонували Алашію (Кіпр) і анатолійське розташування. Давні переклади пішли іншими шляхами: Таргум Онкелоса передає Елласар як Телассар, а Симмах і Вульгата — як Понт. Жоден із чотирьох царів не знайдений надійно в клинописних записах, хронологія розділу сама є спірною, і Елласар лишається назвою з кількома кандидатами й без доказу."
  es:
    - "Elasar es el reino de Arioc, uno de los cuatro reyes orientales que, con «Chêdorlaomer, rey de Elam», «Amraphel, rey de Shinar» y «Tidal, rey de naciones», marcharon contra las cinco ciudades de la llanura, las derrotaron en el valle de Sidim y se llevaron a Lot, hasta que Abram los persiguió hasta Dan y más allá de Damasco y lo trajo de vuelta. El nombre aparece solo en los dos versículos de ese capítulo, y el relato no le da más lugar que su compañía con Sinar (Babilonia) y Elam."
    - "Dónde estaba es objeto de debate, y la respuesta ha ido cambiando con la asiriología. Desde el siglo XIX se leyó comúnmente Elasar como Larsa, la gran ciudad del sur de Babilonia (Senkereh), y Arioc se hizo coincidir con sus reyes; más tarde, el nombre Arriyuk, que llevaba un hijo de Zimri-Lim en las cartas de Mari del siglo XVIII a. C., y una ciudad Ilanzura en el norte de Mesopotamia, llevaron a algunos a buscar allí Elasar, y también se han propuesto Alashiya (Chipre) y un escenario anatolio. Las versiones antiguas siguieron otros caminos: el Targum de Onkelos traduce Elasar como Telasar, y Símaco y la Vulgata como Ponto. Ninguno de los cuatro reyes ha sido hallado con seguridad en los registros cuneiformes, la cronología del capítulo es en sí misma objeto de debate, y Elasar sigue siendo un nombre con varios candidatos y ninguna prueba."
  pt:
    - "Elasar é o reino de Arioque, um dos quatro reis orientais que, com “Quedorlaomer, rei de Elão”, “Anrafel, rei de Sinar” e “Tidal, rei de Goim”, marcharam contra as cinco cidades da planície, as derrotaram no vale de Sidim e levaram Ló, até que Abrão os perseguiu até Dã e além de Damasco e o trouxe de volta. O nome ocorre apenas nos dois versículos desse capítulo, e a narrativa não lhe dá lugar algum além da companhia de Sinar (Babilônia) e Elão."
    - "Onde ficava é disputado, e a resposta se moveu com a assiriologia. Desde o século XIX, Elasar foi comumente lida como Larsa, a grande cidade do sul da Babilônia (Senkereh), e Arioque foi associado a seus reis; mais tarde o nome Arriyuk, portado por um filho de Zinri-Lim nas cartas de Mari do século XVIII a.C., e uma cidade Ilanzura no norte da Mesopotâmia levaram alguns a buscar Elasar ali, e Alásia (Chipre) e um cenário anatólio também foram propostos. As versões antigas seguiram outros caminhos: o Targum de Onkelos traduz Elasar por Telassar, e Símaco e a Vulgata por Ponto. Nenhum dos quatro reis foi achado com segurança nos registros cuneiformes, a cronologia do capítulo é ela própria debatida, e Elasar continua sendo um nome com vários candidatos e nenhuma prova."
  de:
    - "Ellasar ist das Königreich Ariochs, eines der vier östlichen Könige, die mit „Kedor-Laomor, dem König von Elam“, „Amraphel, dem König von Sinear“ und „Thideal, dem König der Heiden“ gegen die fünf Städte der Ebene zogen, sie im Tal Siddim besiegten und Lot wegführten, bis Abram sie bis nach Dan und jenseits von Damaskus verfolgte und ihn zurückbrachte. Der Name kommt nur in den beiden Versen dieses Kapitels vor, und die Erzählung gibt ihm keinen Ort außer seiner Gesellschaft mit Schinar (Babylonien) und Elam."
    - "Wo es lag, ist umstritten, und die Antwort hat sich mit der Assyriologie verschoben. Seit dem 19. Jahrhundert wurde Ellasar gewöhnlich als Larsa gelesen, die große Stadt Südbabyloniens (Senkereh), und Arioch wurde mit deren Königen verglichen; später führten der Name Arriyuk, den ein Sohn des Zimri-Lim in den Briefen von Mari des 18. Jahrhunderts v. Chr. trug, und eine Stadt Ilanzura in Nordmesopotamien manche dazu, Ellasar dort zu suchen, und auch Alaschija (Zypern) und ein anatolischer Zusammenhang wurden vorgeschlagen. Die antiken Übersetzungen gingen andere Wege: Das Targum Onkelos gibt Ellasar als Telassar wieder, und Symmachus und die Vulgata als Pontus. Keiner der vier Könige ist in Keilschriftquellen sicher gefunden, die Chronologie des Kapitels ist selbst umstritten, und Ellasar bleibt ein Name mit mehreren Kandidaten und ohne Beweis."
  fr:
    - "Ellasar est le royaume d’Arjoc, l’un des quatre rois orientaux qui, avec « Kedorlaomer, roi d’Élam », « Amraphel, roi de Schinear » et « Tideal, roi de Gojim », marchèrent contre les cinq villes de la plaine, les vainquirent dans la vallée de Siddim et emmenèrent Lot, jusqu’à ce qu’Abram les poursuive jusqu’à Dan et au-delà de Damas et le ramène. Le nom n’apparaît que dans les deux versets de ce chapitre, et le récit ne lui donne d’autre place que sa compagnie avec Schinear (la Babylonie) et Élam."
    - "Où elle se trouvait est débattu, et la réponse a évolué avec l’assyriologie. Depuis le XIXe siècle, Ellasar fut couramment lue comme Larsa, la grande ville du sud de la Babylonie (Senkereh), et Arjoc rapproché de ses rois ; plus tard, le nom Arriyuk, porté par un fils de Zimri-Lim dans les lettres de Mari du XVIIIe siècle av. J.-C., et une ville Ilanzura dans le nord de la Mésopotamie ont conduit certains à l’y chercher, et Alashiya (Chypre) et un cadre anatolien ont aussi été proposés. Les versions anciennes ont pris d’autres voies : le targoum d’Onkelos rend Ellasar par Télassar, et Symmaque et la Vulgate par Pont. Aucun des quatre rois n’a été retrouvé avec certitude dans les sources cunéiformes, la chronologie du chapitre est elle-même débattue, et Ellasar reste un nom à plusieurs candidats et sans preuve."
