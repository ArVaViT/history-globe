# Overview article (ADR 0007). Mainstream facts only; the candidates (Larsa, Ilanzura, Alashiya, Pontus, Telassar) are given fairly and none is chosen; the chronology of Genesis 14 is called debated.
id: ellasar
place: a6f4a6d
title:
  en: "Ellasar"
  ru: "Елласар"
  uk: "Елласар"
  es: "Elasar"
