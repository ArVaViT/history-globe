body:
  en:
    - "Bene-berak was a town of the coastal plain east of Joppa, listed among the towns of Dan: “And Jehud, and Bene-berak, and Gath-rimmon”. Its name survived in Ibn Ibraq, the old name of the Arab village of al-Khayriyya east of Jaffa, where Late Roman and Byzantine pottery has been found. The town appears outside the Bible in Sennacherib's account of his campaign of 701 BC: Bit-Daganna, Joppa, Banayabarqa and Azuru, towns of Sidqa king of Ashkelon that had not submitted to him quickly enough, he besieged, conquered and plundered."
    - "In the second century AD Bene Berak was the seat of Rabbi Akiva's academy; the Talmud advises “follow Rabbi Akiva to Bene Berak”, and the Passover Haggadah tells of five rabbis, Akiva among them, who reclined there all night recounting the exodus. Al-Khayriyya was emptied in April 1948; its lands are now part of Ariel Sharon Park in the Tel Aviv area. The modern city of Bnei Brak, founded in 1924 by Hasidic settlers from Poland, took the biblical name and lies about 4 km from the ancient site."
  ru:
    - "Бене-Верак — город прибрежной равнины к востоку от Иоппии, указанный среди городов Дана: «Игуд, Бене-Верак и Гаф-Риммон». Его имя сохранилось в названии Ибн-Ибрак — старом имени арабской деревни аль-Хайрийя к востоку от Яффы, где найдена позднеримская и византийская керамика. Вне Библии город появляется в рассказе Синаххериба о походе 701 г. до н. э.: Бит-Даганну, Иоппию, Банайабарку и Азуру, города Цидки, царя Ашкелона, не поспешившие ему покориться, он осадил, взял и разграбил."
    - "Во II в. н. э. в Бене-Вераке находилась школа рабби Акивы; Талмуд советует: «следуй за рабби Акивой в Бене-Верак», а пасхальная Агада рассказывает о пяти раввинах, среди них Акиве, которые возлежали там всю ночь, повествуя об исходе. Аль-Хайрийя опустела в апреле 1948 г.; её земли теперь входят в парк Ариэля Шарона в агломерации Тель-Авива. Современный город Бней-Брак, основанный в 1924 г. хасидскими переселенцами из Польши, взял библейское имя и лежит примерно в 4 км от древнего места."
  uk:
    - "Бене-Берак був містом прибережної рівнини на схід від Яффи, згаданим серед міст Дана: «Ігуд, Бене-Барак і Гат-Риммон». Його назва збереглася в Ібн-Ібраку, давній назві арабського села аль-Хайрійя на схід від Яффи, де знайшли пізньоримську та візантійську кераміку. Поза Біблією місто з'являється в розповіді Сінаххеріба про похід 701 р. до н. е.: Бит-Даганну, Яффу, Банайбарку та Азуру, міста Сідки, царя Ашкелона, які не підкорилися йому досить швидко, він облягав, завоював і пограбував."
    - "У II ст. н. е. Бене-Берак був осідком академії рабина Аківи; Талмуд радить: «іди за рабі Аківою до Бене-Берака», а пасхальна Агада розповідає про п'ятьох рабинів, серед них Аківу, які там усю ніч розповідали про вихід. Аль-Хайрійя спорожніла в квітні 1948 р.; її землі тепер входять до парку Аріеля Шарона в районі Тель-Авіва. Сучасне місто Бней-Брак, засноване 1924 р. хасидськими поселенцями з Польщі, прийняло біблійну назву й лежить приблизно за 4 км від давнього місця."
  es:
    - "Bene-berac era una ciudad de la llanura costera al este de Jope, enumerada entre las ciudades de Dan: «Y Jehud, y Bene-berác, y Gath-rimmón». Su nombre sobrevivió en Ibn Ibraq, el antiguo nombre de la aldea árabe de al-Khayriyya, al este de Jaffa, donde se ha hallado cerámica del Romano tardío y bizantina. La ciudad aparece fuera de la Biblia en el relato de Senaquerib sobre su campaña de 701 a. C.: Bit-Daganna, Jope, Banayabarqa y Azuru, ciudades de Sidqa, rey de Ascalón, que no se le habían sometido con bastante rapidez, las sitió, conquistó y saqueó."
    - "En el siglo II d. C. Bene Berac fue sede de la academia de rabí Akiva; el Talmud aconseja «sigue a rabí Akiva a Bene Berac», y la Hagadá de Pascua cuenta de cinco rabinos, entre ellos Akiva, que se reclinaron allí toda la noche relatando el éxodo. Al-Khayriyya fue vaciada en abril de 1948; sus tierras forman hoy parte del Parque Ariel Sharon, en el área de Tel Aviv. La ciudad moderna de Bnei Brak, fundada en 1924 por colonos jasídicos de Polonia, tomó el nombre bíblico y se halla a unos 4 km del emplazamiento antiguo."
  pt:
    - "Bene-Beraque era uma cidade da planície costeira a leste de Jope, listada entre as cidades de Dã: “Jeúde, Bene-Beraque, Gate-Rimom”. Seu nome sobreviveu em Ibn Ibraq, o antigo nome da aldeia árabe de al-Khayriyya, a leste de Jafa, onde foi encontrada cerâmica do final do período romano e do bizantino. A cidade aparece fora da Bíblia no relato de Senaqueribe sobre sua campanha de 701 a.C.: Bit-Daganna, Jope, Banayabarqa e Azuru, cidades de Sidqa, rei de Ascalom, que não se haviam submetido a ele com rapidez suficiente, ele as sitiou, conquistou e saqueou."
    - "No século II d.C., Bene Berak foi sede da academia do rabino Akiva; o Talmude aconselha “siga o rabino Akiva até Bene Berak”, e a Hagadá de Pessach conta de cinco rabinos, entre eles Akiva, que ali ficaram reclinados a noite toda narrando o êxodo. Al-Khayriyya foi esvaziada em abril de 1948; suas terras fazem hoje parte do Parque Ariel Sharon, na área de Tel Aviv. A cidade moderna de Bnei Brak, fundada em 1924 por colonos hassídicos da Polônia, tomou o nome bíblico e fica a cerca de 4 km do sítio antigo."
  de:
    - "Bne-Berak war eine Stadt der Küstenebene östlich von Joppe, aufgeführt unter den Städten Dans: „Jehud, Bne-Barak, Gath-Rimmon“. Ihr Name lebte in Ibn Ibraq fort, dem alten Namen des arabischen Dorfes al-Chairiyya östlich von Jaffa, wo spätrömische und byzantinische Keramik gefunden wurde. Die Stadt erscheint außerhalb der Bibel in Sanheribs Bericht über seinen Feldzug von 701 v. Chr.: Bit-Daganna, Joppe, Banajabarqa und Asuru, Städte des Sidqa, Königs von Aschkelon, die sich ihm nicht schnell genug unterworfen hatten, belagerte, eroberte und plünderte er."
    - "Im zweiten Jahrhundert n. Chr. war Bne Berak der Sitz der Akademie Rabbi Akibas; der Talmud rät: „Folge Rabbi Akiba nach Bne Berak“, und die Pessach-Haggada erzählt von fünf Rabbinen, darunter Akiba, die dort die ganze Nacht lagen und vom Auszug erzählten. Al-Chairiyya wurde im April 1948 geleert; sein Land gehört heute zum Ariel-Sharon-Park im Raum Tel Aviv. Die moderne Stadt Bnei Brak, 1924 von chassidischen Siedlern aus Polen gegründet, übernahm den biblischen Namen und liegt etwa 4 km von der antiken Stätte entfernt."
  fr:
    - "Bené-Berak était une ville de la plaine côtière à l’est de Joppé, comptée parmi les villes de Dan : « Jehud, Bené-Berak, Gath-Rimmon ». Son nom a survécu dans Ibn Ibraq, ancien nom du village arabe d’al-Khayriyya, à l’est de Jaffa, où l’on a trouvé de la céramique de l’époque romaine tardive et byzantine. La ville apparaît hors de la Bible dans le récit de la campagne de Sanchérib en 701 av. J.-C. : Bit-Daganna, Joppé, Banayabarqa et Azuru, villes de Sidqa, roi d’Askalon, qui ne s’étaient pas soumises assez vite, il les assiégea, les conquit et les pilla."
    - "Au IIe siècle de notre ère, Bené-Berak fut le siège de l’académie de rabbi Akiva ; le Talmud conseille : « suis rabbi Akiva à Bené-Berak », et la Haggadah de Pâque évoque cinq rabbins, dont Akiva, qui s’y tinrent couchés toute la nuit à raconter la sortie d’Égypte. Al-Khayriyya fut vidé de ses habitants en avril 1948 ; ses terres font aujourd’hui partie du parc Ariel Sharon, dans la région de Tel-Aviv. La ville moderne de Bnei Brak, fondée en 1924 par des colons hassidiques venus de Pologne, a repris le nom biblique et se trouve à environ 4 km de l’ancien site."
  it:
    - "Bene-Berak era una città della pianura costiera a est di Giaffa, elencata tra le città di Dan: «Iehud, Bene-Berak, Gath-Rimmon». Il suo nome sopravvisse in Ibn Ibraq, l’antico nome del villaggio arabo di al-Khayriyya a est di Giaffa, dove è stata trovata ceramica tardoromana e bizantina. La città compare fuori dalla Bibbia nel racconto di Sennacherib sulla sua campagna del 701 a.C.: Bit-Daganna, Giaffa, Banayabarqa e Azuru, città di Sidqa re di Ascalona che non si erano sottomesse abbastanza in fretta, egli le assediò, conquistò e saccheggiò."
    - "Nel II secolo d.C. Bene Berak fu la sede dell’accademia di rabbi Akiva; il Talmud consiglia: «segui rabbi Akiva a Bene Berak», e l’Haggadah di Pesach racconta di cinque rabbini, tra cui Akiva, che vi stettero distesi a tavola tutta la notte raccontando l’esodo. Al-Khayriyya fu svuotata nell’aprile 1948; le sue terre fanno ora parte dell’Ariel Sharon Park nell’area di Tel Aviv. La città moderna di Bnei Brak, fondata nel 1924 da coloni chassidici provenienti dalla Polonia, ne ha ripreso il nome biblico e si trova a circa 4 km dall’antico sito."
  nl:
    - "Bene-Berak was een stad in de kustvlakte ten oosten van Joppe, vermeld onder de steden van Dan: “En Jehud, en Bene-Berak, en Gath-Rimmon”. De naam leefde voort in Ibn Ibraq, de oude naam van het Arabische dorp al-Khayriyya ten oosten van Jaffa, waar laat-Romeins en Byzantijns aardewerk is gevonden. De stad komt buiten de Bijbel voor in Sanheribs verslag van zijn veldtocht van 701 v.Chr.: Bit-Daganna, Joppe, Banayabarqa en Azuru, steden van Sidqa, koning van Askelon, die zich niet snel genoeg aan hem hadden onderworpen, belegerde, veroverde en plunderde hij."
    - "In de tweede eeuw n.Chr. was Bene Berak de zetel van de academie van rabbi Akiva; de Talmoed raadt aan “volg rabbi Akiva naar Bene Berak”, en de pesach-haggada vertelt van vijf rabbi's, onder wie Akiva, die daar de hele nacht lagen en de uittocht navertelden. Al-Khayriyya werd in april 1948 ontruimd; zijn land maakt nu deel uit van het Ariel Sharon Park in de omgeving van Tel Aviv. De moderne stad Bnei Brak, in 1924 gesticht door chassidische kolonisten uit Polen, nam de bijbelse naam over en ligt ongeveer 4 km van de antieke plaats."
  pl:
    - "Bene-Berak było miastem nadmorskiej równiny na wschód od Jafy, wymienionym wśród miast Dana: „I Jehut, i Bane Barak, i Getremmon”. Jego nazwa przetrwała w Ibn Ibrak, dawnej nazwie arabskiej wsi al-Chajrijja na wschód od Jafy, gdzie znaleziono ceramikę z późnego okresu rzymskiego i bizantyjskiego. Poza Biblią miasto pojawia się w relacji Sennacheryba z wyprawy w 701 p.n.e.: Bit-Daganna, Jafę, Banaj-Barkę i Azuru, miasta Sidki, króla Aszkelonu, które nie poddały mu się dość szybko, oblegał, zdobył i złupił."
    - "W II w. n.e. Bene-Berak było siedzibą szkoły rabbiego Akiwy; Talmud radzi: „idź za rabbim Akiwą do Bene-Berak”, a Haggada paschalna opowiada o pięciu rabinach, wśród nich Akiwie, którzy przez całą noc zasiadali tam do stołu, opowiadając o wyjściu z Egiptu. Al-Chajrijja została opróżniona w kwietniu 1948 roku; jej ziemie wchodzą dziś w skład Parku Ariela Szarona w rejonie Tel Awiwu. Współczesne miasto Bnei Brak, założone w 1924 roku przez chasydzkich osadników z Polski, przejęło biblijną nazwę i leży około 4 km od starożytnego stanowiska."
  cs:
    - "Bené-berak bylo město pobřežní roviny východně od Joppe, uvedené mezi městy Danovými: „Jehud, Beneberak a Getremmon“. Jeho jméno se zachovalo v Ibn Ibraq, starém názvu arabské vesnice al-Chajrijja východně od Jaffy, kde byla nalezena keramika z pozdní římské a byzantské doby. Město se mimo Bibli objevuje ve Senacheribově líčení tažení roku 701 př. n. l.: Bít-Daganna, Joppe, Banaj-barqa a Azuru, města Sidky, krále Aškelonu, která se mu nepodrobila dost rychle, oblehl, dobyl a vyplenil."
    - "Ve druhém století n. l. bylo Bené Berak sídlem akademie rabiho Akivy; Talmud radí „jdi za rabi Akivou do Bené Beraku“ a pesachová haggáda vypráví o pěti rabínech, mezi nimi Akivovi, kteří tam celou noc ležíce vyprávěli o exodu. Al-Chajrijja byla vylidněna v dubnu 1948; její pozemky jsou dnes součástí Parku Ariela Šarona v oblasti Tel Avivu. Dnešní město Bnej Brak, založené roku 1924 chasidskými osadníky z Polska, převzalo biblické jméno a leží asi 4 km od starověkého místa."
  sv:
    - "Bene-Berak var en stad på kustslätten öster om Joppe, upptagen bland Dans städer: ”Jehud, Bene-Berak, Gat-Rimmon”. Dess namn levde kvar i Ibn Ibraq, det gamla namnet på den arabiska byn al-Khayriyya öster om Jaffa, där sen romersk och bysantinsk keramik har hittats. Staden förekommer utanför Bibeln i Sanheribs redogörelse för hans fälttåg år 701 f.Kr.: Bit-Daganna, Joppe, Banayabarqa och Azuru, städer som tillhörde Sidqa, kung av Ashkelon, och som inte hade underkastat sig honom tillräckligt snabbt, belägrade, erövrade och plundrade han."
    - "På 100-talet e.Kr. var Bene Berak säte för Rabbi Akivas akademi; Talmud råder: ”följ Rabbi Akiva till Bene Berak”, och Påskhaggadan berättar om fem rabbiner, Akiva bland dem, som låg där hela natten och berättade om uttåget. Al-Khayriyya tömdes i april 1948; dess marker är nu en del av Ariel Sharon-parken i Tel Avivområdet. Den moderna staden Bnei Brak, grundad 1924 av chassidiska nybyggare från Polen, tog det bibliska namnet och ligger omkring 4 km från den antika platsen."
