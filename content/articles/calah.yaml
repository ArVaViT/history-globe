body:
  en:
    - "Calah, the Assyrian Kalhu, is the mound of Nimrud on the east bank of the Tigris, about 30 km south of Mosul and some 10 km above the point where the Great Zab flows in. Ashurnasirpal II records that Shalmaneser I, king of Assyria in the thirteenth century BC, had built the city and that it had fallen into ruin. Ashurnasirpal II (883–859 BC) rebuilt it as his capital, with temples, a wall and the great North-West Palace; at its dedication, his Banquet Stele says, he fed 69,574 guests for ten days, among them envoys from Tyre and Sidon."
    - "Genesis names Calah among the cities built in Assyria, alongside Nineveh, Rehoboth and Resen; it is the only place where the Bible mentions it. The city also touches the history of Israel and Judah. Here stood the Black Obelisk of Shalmaneser III, found by Layard in 1846: one of its reliefs shows the tribute of Jehu of Israel, whom the caption calls son of Omri, in 841 BC; the man bowing before the Assyrian king is either Jehu himself or his envoy. Tiglath-pileser III, who carried off the people of Galilee and to whom Ahaz of Judah sent silver and gold, also built a palace here."
    - "Calah remained the main royal city until Sargon II moved the court to his new capital Dur-Sharrukin about 706 BC. It was sacked when the Medes and Babylonians destroyed Assyria at the end of the seventh century BC. In 401 BC Xenophon's Greeks passed a great deserted city on the Tigris which he called Larissa, usually identified with Nimrud. Layard dug here from 1845, and British expeditions under Max Mallowan and David Oates from 1949 uncovered palaces, archives of letters and a great hoard of carved ivories."
  ru:
    - "Калах, по-ассирийски Кальху, — это холм Нимруд на восточном берегу Тигра, примерно в 30 км к югу от Мосула и в 10 км выше впадения в Тигр Большого Заба. Ашшурнацирапал II пишет, что город построил Салманасар I, царь Ассирии в XIII веке до н. э., и что он лежал в развалинах. Ашшурнацирапал II (883–859 гг. до н. э.) отстроил его как свою столицу — с храмами, стеной и большим Северо-Западным дворцом; на его освящении, по словам «Пиршественной стелы», царь десять дней кормил 69 574 гостя, среди них послов Тира и Сидона."
    - "Книга Бытия называет Калах среди городов, построенных в Ассирии, вместе с Ниневией, Реховоф-иром и Ресеном; больше Библия о нём не упоминает. Но город связан и с историей Израиля и Иудеи. Здесь стоял Чёрный обелиск Салманасара III, найденный Лэйярдом в 1846 г.: на одном из его рельефов изображена дань Ииуя, царя Израильского, которого надпись называет сыном Амврия, в 841 г. до н. э.; кланяющийся ассирийскому царю человек — сам Ииуй или его посланец. Феглаффелласар, переселивший в Ассирию жителей Галилеи, которому Ахаз, царь Иудейский, послал серебро и золото, тоже построил здесь дворец."
    - "Калах оставался главным царским городом, пока Саргон II около 706 г. до н. э. не перенёс двор в свою новую столицу Дур-Шаррукин. Город был разграблен, когда мидяне и вавилоняне сокрушили Ассирию в конце VII века до н. э. В 401 г. до н. э. греки Ксенофонта прошли мимо большого покинутого города на Тигре, который он назвал Ларисой; его обычно отождествляют с Нимрудом. Лэйярд копал здесь с 1845 г., а британские экспедиции Макса Мэллоуэна и Дэвида Оутса с 1949 г. открыли дворцы, архивы писем и большое собрание резной слоновой кости."
  uk:
    - "Калах, ассирійський Кальху, — це пагорб Німруд на східному березі Тигру, приблизно за 30 км на південь від Мосула й за якихось 10 км вище місця, де впадає Великий Заб. Ашшурнасірапал II повідомляє, що Салманассар I, цар Ассирії XIII ст. до н. е., збудував це місто, а воно впало в руїну. Ашшурнасірапал II (883–859 рр. до н. е.) відбудував його як свою столицю, з храмами, муром і великим Північно-Західним палацом; на його освячення, каже його «Бенкетна стела», він десять днів годував 69 574 гостей, серед них послів із Тіру та Сідона."
    - "Книга Буття називає Калах серед міст, збудованих в Ассирії, поряд із Ніневією, Реховотом і Ресеном; це єдине місце, де Біблія його згадує. Місто торкається й історії Ізраїлю та Юди. Тут стояв Чорний обеліск Салманассара III, знайдений Лейардом у 1846 р.: на одному з його рельєфів показано данину Єгу Ізраїльського, якого напис називає сином Омрі, у 841 р. до н. е.; чоловік, що вклоняється перед ассирійським царем, — або сам Єгу, або його посол. Тіглатпаласар III, який вивів у полон людей Галілеї й до якого Ахаз Юдейський посилав срібло й золото, теж збудував тут палац."
    - "Калах лишався головним царським містом, доки Саргон II близько 706 р. до н. е. не переніс двір до своєї нової столиці Дур-Шаррукіну. Його було розграбовано, коли мідяни й вавилоняни знищили Ассирію наприкінці VII ст. до н. е. У 401 р. до н. е. греки Ксенофонта минули велике покинуте місто на Тигрі, яке він назвав Ларісою, — його зазвичай ототожнюють із Німрудом. Лейард копав тут від 1845 р., а британські експедиції під керівництвом Макса Меловена та Девіда Оутса від 1949 р. відкрили палаци, архіви листів і велике зібрання різьблених виробів зі слонової кістки."
  es:
    - "Cala, la Kalhu asiria, es el montículo de Nimrud en la orilla oriental del Tigris, a unos 30 km al sur de Mosul y a unos 10 km por encima del punto donde desemboca el Gran Zab. Asurnasirpal II registra que Salmanasar I, rey de Asiria en el siglo XIII a. C., había construido la ciudad y que esta había caído en ruinas. Asurnasirpal II (883–859 a. C.) la reconstruyó como su capital, con templos, una muralla y el gran Palacio del Noroeste; en su inauguración, según dice su Estela del Banquete, alimentó durante diez días a 69 574 invitados, entre ellos enviados de Tiro y Sidón."
    - "El Génesis nombra Cala entre las ciudades edificadas en Asiria, junto a Nínive, Rehobot y Resen; es el único pasaje bíblico que la menciona. La ciudad toca también la historia de Israel y de Judá. Aquí se alzaba el Obelisco Negro de Salmanasar III, hallado por Layard en 1846: uno de sus relieves muestra el tributo de Jehú de Israel, a quien la leyenda llama hijo de Omri, en el 841 a. C.; el hombre que se inclina ante el rey asirio es o bien el propio Jehú o bien su enviado. Tiglat-pileser III, que deportó al pueblo de Galilea y a quien Acaz de Judá envió plata y oro, construyó también aquí un palacio."
    - "Cala siguió siendo la principal ciudad real hasta que Sargón II trasladó la corte a su nueva capital, Dur-Sharrukin, hacia el 706 a. C. Fue saqueada cuando los medos y los babilonios destruyeron Asiria a finales del siglo VII a. C. En el 401 a. C. los griegos de Jenofonte pasaron junto al Tigris por una gran ciudad desierta a la que él llamó Larisa, que suele identificarse con Nimrud. Layard excavó aquí desde 1845, y las expediciones británicas dirigidas por Max Mallowan y David Oates desde 1949 sacaron a la luz palacios, archivos de cartas y un gran tesoro de marfiles tallados."
  pt:
    - "Calá, a Kalhu assíria, é o monte de Nimrud, na margem leste do Tigre, cerca de 30 km ao sul de Mossul e uns 10 km acima do ponto em que desemboca o Grande Zab. Assurnasirpal II registra que Salmaneser I, rei da Assíria no século XIII a.C., havia construído a cidade e que ela caíra em ruínas. Assurnasirpal II (883–859 a.C.) a reconstruiu como sua capital, com templos, uma muralha e o grande Palácio Noroeste; na inauguração, diz a sua Estela do Banquete, alimentou 69.574 convidados por dez dias, entre eles enviados de Tiro e Sidom."
    - "O Gênesis nomeia Calá entre as cidades construídas na Assíria, ao lado de Nínive, Reobote e Resen; é o único lugar em que a Bíblia a menciona. A cidade toca também a história de Israel e de Judá. Aqui ficava o Obelisco Negro de Salmaneser III, achado por Layard em 1846: um de seus relevos mostra o tributo de Jeú de Israel, a quem a legenda chama filho de Onri, em 841 a.C.; o homem que se curva diante do rei assírio é o próprio Jeú ou seu enviado. Tiglate-Pileser III, que deportou o povo da Galileia e a quem Acaz de Judá enviou prata e ouro, construiu aqui também um palácio."
    - "Calá continuou sendo a principal cidade real até que Sargão II transferiu a corte para a sua nova capital, Dur-Sharrukin, por volta de 706 a.C. Foi saqueada quando medos e babilônios destruíram a Assíria, no fim do século VII a.C. Em 401 a.C., os gregos de Xenofonte passaram por uma grande cidade deserta às margens do Tigre, que ele chamou Larissa, geralmente identificada com Nimrud. Layard escavou aqui a partir de 1845, e expedições britânicas sob Max Mallowan e David Oates, a partir de 1949, trouxeram à luz palácios, arquivos de cartas e um grande tesouro de marfins entalhados."
  de:
    - "Kalach, das assyrische Kalhu, ist der Hügel von Nimrud am Ostufer des Tigris, etwa 30 km südlich von Mossul und rund 10 km oberhalb der Stelle, an der der Große Zab einmündet. Assurnasirpal II. berichtet, Salmanassar I., König von Assyrien im 13. Jahrhundert v. Chr., habe die Stadt erbaut und sie sei in Verfall geraten. Assurnasirpal II. (883–859 v. Chr.) baute sie als seine Hauptstadt wieder auf, mit Tempeln, einer Mauer und dem großen Nordwestpalast; bei ihrer Einweihung, sagt seine Bankettstele, bewirtete er zehn Tage lang 69 574 Gäste, darunter Gesandte aus Tyrus und Sidon."
    - "Die Genesis nennt Kalach unter den in Assyrien erbauten Städten neben Ninive, Rehobot und Resen; es ist die einzige Stelle, an der die Bibel es erwähnt. Die Stadt berührt auch die Geschichte Israels und Judas. Hier stand der Schwarze Obelisk Salmanassars III., 1846 von Layard gefunden: Eines seiner Reliefs zeigt den Tribut Jehus von Israel, den die Beischrift Sohn Omris nennt, im Jahr 841 v. Chr.; der Mann, der sich vor dem assyrischen König verneigt, ist entweder Jehu selbst oder sein Gesandter. Tiglat-Pileser III., der die Bewohner Galiläas wegführte und dem Ahas von Juda Silber und Gold sandte, baute hier ebenfalls einen Palast."
    - "Kalach blieb die wichtigste Residenzstadt, bis Sargon II. den Hof um 706 v. Chr. in seine neue Hauptstadt Dur-Scharrukin verlegte. Es wurde geplündert, als Meder und Babylonier Ende des 7. Jahrhunderts v. Chr. Assyrien zerstörten. Im Jahr 401 v. Chr. kamen Xenophons Griechen an einer großen verlassenen Stadt am Tigris vorbei, die er Larissa nannte und die gewöhnlich mit Nimrud gleichgesetzt wird. Layard grub hier ab 1845, und britische Expeditionen unter Max Mallowan und David Oates legten ab 1949 Paläste, Briefarchive und einen großen Schatz geschnitzter Elfenbeine frei."
  fr:
    - "Calach, la Kalhu assyrienne, est le tertre de Nimrud sur la rive orientale du Tigre, à environ 30 km au sud de Mossoul et à quelque 10 km en amont de l’endroit où se jette le Grand Zab. Assurnasirpal II rapporte que Salmanasar Ier, roi d’Assyrie au XIIIe siècle av. J.-C., avait bâti la ville et qu’elle était tombée en ruine. Assurnasirpal II (883–859 av. J.-C.) la rebâtit comme capitale, avec des temples, un rempart et le grand palais nord-ouest ; lors de son inauguration, dit sa stèle du banquet, il nourrit 69 574 convives pendant dix jours, parmi lesquels des envoyés de Tyr et de Sidon."
    - "La Genèse nomme Calach parmi les villes bâties en Assyrie, avec Ninive, Rehoboth et Résen ; c’est le seul endroit où la Bible la mentionne. La ville touche pourtant aussi l’histoire d’Israël et de Juda. Ici se dressait l’obélisque noir de Salmanasar III, découvert par Layard en 1846 : l’un de ses reliefs montre le tribut de Jéhu d’Israël, que la légende appelle fils d’Omri, en 841 av. J.-C. ; l’homme qui s’incline devant le roi assyrien est soit Jéhu lui-même, soit son envoyé. Tiglath-Piléser III, qui déporta les gens de Galilée et à qui Achaz de Juda envoya de l’argent et de l’or, y bâtit aussi un palais."
    - "Calach resta la principale ville royale jusqu’à ce que Sargon II transporte la cour dans sa nouvelle capitale Dur-Sharrukin vers 706 av. J.-C. Elle fut mise à sac quand les Mèdes et les Babyloniens détruisirent l’Assyrie à la fin du VIIe siècle av. J.-C. En 401 av. J.-C., les Grecs de Xénophon passèrent devant une grande ville déserte sur le Tigre qu’il appela Larissa, généralement identifiée à Nimrud. Layard y fouilla à partir de 1845, et les expéditions britanniques de Max Mallowan puis de David Oates, à partir de 1949, mirent au jour des palais, des archives de lettres et un vaste trésor d’ivoires sculptés."
