# Overview article (ADR 0007). Mainstream facts only; the cities of the plain are left unlocated, with the main proposals named.
id: jordan-valley
place: aa54aa4
title:
  en: "Plain of Jordan"
  ru: "Окрестность Иорданская"
  uk: "Йорданська рівнина"
  es: "Llanura del Jordán"
  pt: "Planície do Jordão"
  de: "Gegend am Jordan"
  fr: "Plaine du Jourdain"
  pl: "Równina Jordanu"
  it: "Pianura del Giordano"
  nl: "Vlakte van de Jordaan"
