# Overview article (ADR 0007). Mainstream facts only; the cities of the plain are left unlocated, with the main proposals named.
id: jordan-valley
place: aa54aa4
title:
  en: "Plain of Jordan"
  ru: "Окрестность Иорданская"
body:
  en:
    - "The “plain of Jordan”, in Hebrew the kikkar or “round” of the Jordan, is the broad floor of the Jordan trench where the river nears the Dead Sea: the valley bottom from about Succoth and Zarethan in the north to Jericho and the sea in the south, lying from some 200 m below sea level in the north to more than 400 m at the Dead Sea. It is part of the great rift that runs from Syria to Africa; the winters are mild, the summers fierce, and life depends on springs and the streams that come down from the hills, so that the oasis of Jericho, “the city of palm trees”, is green while the plain around it is bare marl. Josephus praised the plain of Jericho for its palms, balsam and the spring that Elisha healed."
    - "Genesis makes it the land Lot chose. From the hills near Bethel he “beheld all the plain of Jordan, that it was well watered every where, before the LORD destroyed Sodom and Gomorrah, even as the garden of the LORD, like the land of Egypt”; he “dwelled in the cities of the plain, and pitched his tent toward Sodom”. When the angels led him out they warned him, “neither stay thou in all the plain; escape to the mountain”, and the Lord “overthrew those cities, and all the plain”; Abraham, looking down from Hebron, saw “the smoke of the country went up as the smoke of a furnace”. Where the cities stood is debated: the Early Bronze Age towns of Bab edh-Dhra and Numeira on the south-eastern shore of the Dead Sea are most often named, Tall el-Hammam north-east of the river's mouth has been proposed, and others think the sites lie under the shallow southern basin or cannot be found."
    - "The plain appears twice more. Solomon's bronze for the Temple was cast in the plain of Jordan, “in the clay ground between Succoth and Zarthan”, where the alluvial earth suited the moulds; and after Absalom's death Ahimaaz “ran by the way of the plain” to Mahanaim and outran the Cushite to bring David the news. Today the valley is divided between Jordan on the east bank and Israel and the West Bank on the west, with Jericho, date plantations, the Allenby bridge and the baptism sites on the river."
  ru:
    - "«Окрестность Иорданская», по-еврейски «киккар», «круг» Иордана, — широкое дно Иорданской впадины там, где река подходит к Мёртвому морю: низина примерно от Сокхофа и Цартана на севере до Иерихона и моря на юге, лежащая от 200 м ниже уровня моря на севере до более чем 400 м у Мёртвого моря. Это часть великого разлома, идущего от Сирии до Африки; зимы здесь мягкие, лето жестокое, а жизнь зависит от источников и ручьёв, сбегающих с гор, так что оазис Иерихона — «город Палм» — зеленеет среди голых мергелей равнины. Иосиф Флавий хвалил равнину Иерихона за пальмы, бальзам и источник, исцелённый Елисеем."
    - "Книга Бытия делает её землёй, которую избрал Лот. С гор у Вефиля он «увидел всю окрестность Иорданскую, что она, прежде нежели истребил Господь Содом и Гоморру, вся до Сигора орошалась водою, как сад Господень, как земля Египетская», и «стал жить в городах окрестности и раскинул шатры до Содома». Выводя его, ангелы предупредили: «нигде не останавливайся в окрестности сей; спасайся на гору», и Господь ниспроверг «города сии, и всю окрестность сию»; Авраам, глядя вниз от Хеврона, увидел: «дым поднимается с земли, как дым из печи». Где стояли эти города, спорят: чаще всего называют города раннего бронзового века Баб-эд-Дра и Нумейру на юго-восточном берегу Мёртвого моря, предлагали и Талль-эль-Хаммам к северо-востоку от устья реки, а иные думают, что они лежат под мелкой южной котловиной или вовсе не могут быть найдены."
    - "Равнина появляется ещё дважды. Медь для Храма Соломон отливал «в глинистой земле, в окрестности Иордана, между Сокхофом и Цартаном», где наносная почва годилась для форм; а после смерти Авессалома Ахимаас побежал в Маханаим равниной — по Синодальному переводу «по прямой дороге» — и опередил Хусия с вестью для Давида. Сегодня долина поделена между Иорданией на восточном берегу и Израилем и Западным берегом на западном: здесь Иерихон, финиковые плантации, мост Алленби и места крещения на реке."
