body:
  en:
    - "The “plain of Jordan”, in Hebrew the kikkar or “round” of the Jordan, is the broad floor of the Jordan trench where the river nears the Dead Sea: the valley bottom from about Succoth and Zarethan in the north to Jericho and the sea in the south, lying from some 200 m below sea level in the north to more than 400 m at the Dead Sea. It is part of the great rift that runs from Syria to Africa; the winters are mild, the summers fierce, and life depends on springs and the streams that come down from the hills, so that the oasis of Jericho, “the city of palm trees”, is green while the plain around it is bare marl. Josephus praised the plain of Jericho for its palms, balsam and the spring that Elisha healed."
    - "Genesis makes it the land Lot chose. From the hills near Bethel he “beheld all the plain of Jordan, that it was well watered every where, before the LORD destroyed Sodom and Gomorrah, even as the garden of the LORD, like the land of Egypt”; he “dwelled in the cities of the plain, and pitched his tent toward Sodom”. When the angels led him out they warned him, “neither stay thou in all the plain; escape to the mountain”, and the Lord “overthrew those cities, and all the plain”; Abraham, looking down from Hebron, saw “the smoke of the country went up as the smoke of a furnace”. Where the cities stood is debated: the Early Bronze Age towns of Bab edh-Dhra and Numeira on the south-eastern shore of the Dead Sea are most often named, Tall el-Hammam north-east of the river's mouth has been proposed, and others think the sites lie under the shallow southern basin or cannot be found."
    - "The plain appears twice more. Solomon's bronze for the Temple was cast in the plain of Jordan, “in the clay ground between Succoth and Zarthan”, where the alluvial earth suited the moulds; and after Absalom's death Ahimaaz “ran by the way of the plain” to Mahanaim and outran the Cushite to bring David the news. Today the valley is divided between Jordan on the east bank and Israel and the West Bank on the west, with Jericho, date plantations, the Allenby bridge and the baptism sites on the river."
  ru:
    - "«Окрестность Иорданская», по-еврейски «киккар», «круг» Иордана, — широкое дно Иорданской впадины там, где река подходит к Мёртвому морю: низина примерно от Сокхофа и Цартана на севере до Иерихона и моря на юге, лежащая от 200 м ниже уровня моря на севере до более чем 400 м у Мёртвого моря. Это часть великого разлома, идущего от Сирии до Африки; зимы здесь мягкие, лето жестокое, а жизнь зависит от источников и ручьёв, сбегающих с гор, так что оазис Иерихона — «город Палм» — зеленеет среди голых мергелей равнины. Иосиф Флавий хвалил равнину Иерихона за пальмы, бальзам и источник, исцелённый Елисеем."
    - "Книга Бытия делает её землёй, которую избрал Лот. С гор у Вефиля он «увидел всю окрестность Иорданскую, что она, прежде нежели истребил Господь Содом и Гоморру, вся до Сигора орошалась водою, как сад Господень, как земля Египетская», и «стал жить в городах окрестности и раскинул шатры до Содома». Выводя его, ангелы предупредили: «нигде не останавливайся в окрестности сей; спасайся на гору», и Господь ниспроверг «города сии, и всю окрестность сию»; Авраам, глядя вниз от Хеврона, увидел: «дым поднимается с земли, как дым из печи». Где стояли эти города, спорят: чаще всего называют города раннего бронзового века Баб-эд-Дра и Нумейру на юго-восточном берегу Мёртвого моря, предлагали и Талль-эль-Хаммам к северо-востоку от устья реки, а иные думают, что они лежат под мелкой южной котловиной или вовсе не могут быть найдены."
    - "Равнина появляется ещё дважды. Медь для Храма Соломон отливал «в глинистой земле, в окрестности Иордана, между Сокхофом и Цартаном», где наносная почва годилась для форм; а после смерти Авессалома Ахимаас побежал в Маханаим равниной — по Синодальному переводу «по прямой дороге» — и опередил Хусия с вестью для Давида. Сегодня долина поделена между Иорданией на восточном берегу и Израилем и Западным берегом на западном: здесь Иерихон, финиковые плантации, мост Алленби и места крещения на реке."
  uk:
    - "«Йорданська рівнина», по-давньоєврейськи кіккар, або «коло» Йордану, — широке дно Йорданського рову, де річка наближається до Мертвого моря: дно долини приблизно від Сокхота й Цартана на півночі до Єрихона й моря на півдні, що лежить приблизно від 200 м нижче рівня моря на півночі до понад 400 м біля Мертвого моря. Це частина великого рифту, що йде від Сирії до Африки; зими м’які, літа люті, і життя залежить від джерел і потоків, що спадають із пагорбів, тож оаза Єрихона, «міста пальмового», зелена, тоді як рівнина довкола гола мергелева. Йосиф Флавій вихваляв рівнину Єрихона за її пальми, бальзам і джерело, яке зцілив Єлисей."
    - "Книга Буття робить її краєм, який обрав Лот. З пагорбів біля Бет-Ела він «побачив усю околицю Йорданську, що перше нїж зруйнував Господь Содому й Гоморру, вся до Сигора наповнена була водою, як сад Господень і як земля Египецька»; він «осївся в городах околишнїх, і двинув з наметом своїм до Содому». Коли ангели вивели його, вони застерегли його: «не зупиняйся нїде в усїй околицї сїй. У гори втїкай», і Господь «перевертав городи сї і всю околицю»; Авраам, дивлячись із Хеврона, побачив, як «здіймається дим од землї, як дим із печі». Де стояли міста, обговорюють: найчастіше називають міста раннього бронзового віку Баб-ед-Дра і Нумейру на південно-східному березі Мертвого моря, пропонували Телль-ель-Хаммам на північний схід від гирла річки, а інші думають, що місця лежать під мілким південним басейном або їх неможливо знайти."
    - "Рівнина з’являється ще двічі. Бронзу Соломона для храму було відлито на Йорданській рівнині, «у формах із глинковатої землї, між Сукхотом і Сартаном», де наносна земля пасувала формам; а по смерті Авесалома Ахімаас «побіг ... дорогою направцї» до Маханаїма й випередив кушита, щоб принести Давидові звістку. Сьогодні долина поділена між Йорданією на східному березі та Ізраїлем і Західним берегом на західному, з Єрихоном, фініковими плантаціями, мостом Алленбі та місцями хрещення на річці."
  es:
    - "La «llanura del Jordán», en hebreo el kikkar o «círculo» del Jordán, es el ancho suelo de la fosa del Jordán donde el río se acerca al mar Muerto: el fondo del valle desde aproximadamente Sucot y Saretán, al norte, hasta Jericó y el mar, al sur, que va desde unos 200 m bajo el nivel del mar en el norte hasta más de 400 m en el mar Muerto. Forma parte del gran rift que va de Siria a África; los inviernos son suaves, los veranos feroces, y la vida depende de los manantiales y de los arroyos que bajan de las colinas, de modo que el oasis de Jericó, «ciudad de las palmas», es verde mientras la llanura de alrededor es de marga desnuda. Josefo elogió la llanura de Jericó por sus palmeras, su bálsamo y el manantial que sanó Eliseo."
    - "Lot la escogió, según el Génesis. Desde las colinas junto a Betel, «vió toda la llanura del Jordán, que toda ella era de riego, antes que destruyese Jehová á Sodoma y á Gomorra, como el huerto de Jehová, como la tierra de Egipto»; «asentó en las ciudades de la llanura, y fué poniendo sus tiendas hasta Sodoma». Al sacarlo los ángeles, le advirtieron: «ni pares en toda esta llanura; escapa al monte», y el Señor «destruyó las ciudades, y toda aquella llanura»; Abraham, desde Hebrón, vio que «el humo subía de la tierra como el humo de un horno». Dónde estuvieron las ciudades se debate: los pueblos de la Edad del Bronce Antiguo de Bab edh-Dhra y Numeira, en la orilla sudoriental del mar Muerto, son los más nombrados; se propone Tall el-Hammam, al nordeste de la desembocadura del río; y otros piensan que yacen bajo la cuenca meridional poco profunda o no pueden hallarse."
    - "La llanura aparece dos veces más. El bronce de Salomón para el Templo fue fundido en la llanura del Jordán, «en tierra arcillosa, entre Succoth y Sarthán», donde la tierra aluvial convenía a los moldes; y tras la muerte de Absalón, Ahimaas corrió «por el camino de la llanura» hasta Mahanaim y adelantó al cusita para llevar la noticia a David. Hoy el valle está dividido entre Jordania, en la orilla este, e Israel y Cisjordania, en la oeste, con Jericó, plantaciones de dátiles, el puente Allenby y los lugares de bautismo en el río."
  pt:
    - "A “planície do Jordão”, em hebraico o kikkar ou “redondo” do Jordão, é o amplo chão da fossa do Jordão onde o rio se aproxima do mar Morto: o fundo do vale desde cerca de Sucote e Zaretã, ao norte, até Jericó e o mar, ao sul, situado de uns 200 m abaixo do nível do mar no norte a mais de 400 m no mar Morto. Faz parte da grande fenda que vai da Síria à África; os invernos são amenos, os verões ferozes, e a vida depende de fontes e dos riachos que descem das colinas, de modo que o oásis de Jericó, “a cidade das palmeiras”, é verde enquanto a planície ao redor é marga nua. Josefo louvou a planície de Jericó por suas palmeiras, seu bálsamo e a fonte que Eliseu curou."
    - "Gênesis faz dela a terra que Ló escolheu. Das colinas perto de Betel ele “viu toda a planície do Jordão, que era bem regada em toda parte, antes de o SENHOR destruir Sodoma e Gomorra, como o jardim do SENHOR, como a terra do Egito”; “Ló habitou nas cidades da planície, e armou sua tenda até Sodoma”. Quando os anjos o tiraram de lá, advertiram-no: “não fique em nenhum lugar da planície. Fuja para as montanhas”, e o Senhor “destruiu aquelas cidades, toda a planície”; Abraão, olhando de Hebrom, viu que “a fumaça da terra subia como a fumaça de uma fornalha”. Onde ficavam as cidades é debatido: as cidades do Bronze Antigo de Bab edh-Dhra e Numeira, na margem sudeste do mar Morto, são as mais nomeadas, Tall el-Hammam, a nordeste da foz do rio, foi proposta, e outros pensam que os sítios jazem sob a bacia rasa do sul ou não podem ser achados."
    - "A planície aparece mais duas vezes. O bronze de Salomão para o Templo foi fundido na planície do Jordão, “na terra argilosa entre Sucote e Zaretã”, onde a terra aluvial convinha aos moldes; e depois da morte de Absalão, Aimaás “correu pelo caminho da Planície” até Maanaim e ultrapassou o cuxita para levar a notícia a Davi. Hoje o vale está dividido entre a Jordânia, na margem leste, e Israel e a Cisjordânia, na oeste, com Jericó, plantações de tamareiras, a ponte Allenby e os sítios de batismo no rio."
  de:
    - "Die „Gegend am Jordan“, hebräisch der kikkar, das „Rund“ des Jordan, ist die breite Sohle des Jordangrabens, wo sich der Fluss dem Toten Meer nähert: der Talboden etwa von Sukkot und Zaretan im Norden bis Jericho und zum Meer im Süden, der von rund 200 m unter dem Meeresspiegel im Norden bis über 400 m am Toten Meer liegt. Er gehört zu dem großen Graben, der von Syrien bis nach Afrika reicht; die Winter sind mild, die Sommer glühend, und das Leben hängt von Quellen und den Bächen ab, die von den Bergen herabkommen, sodass die Oase Jericho, „die Palmenstadt“, grün ist, während die Ebene ringsum kahler Mergel ist. Josephus pries die Ebene von Jericho wegen ihrer Palmen, ihres Balsams und der Quelle, die Elisa heilte."
    - "Die Genesis macht sie zu Lots Wahl. Von den Bergen bei Bethel „besah“ er „die ganze Gegend am Jordan. Denn ehe der HERR Sodom und Gomorra verderbte, war sie wasserreich, bis man gen Zoar kommt, als ein Garten des HERRN, gleichwie Ägyptenland“; er wohnte „in den Städten der Jordangegend und setzte seine Hütte gen Sodom“. Als die Engel ihn hinausführten, warnten sie: „auch stehe nicht in dieser ganzen Gegend. Auf den Berg rette dich“, und der Herr „kehrte die Städte um und die ganze Gegend“; Abraham sah von Hebron hinab, wie „da ging Rauch auf vom Lande wie ein Rauch vom Ofen“. Wo die Städte standen, ist umstritten: Meist genannt werden die frühbronzezeitlichen Bab edh-Dhra und Numeira am Südostufer des Toten Meeres, vorgeschlagen ist Tall el-Hammam nordöstlich der Flussmündung, andere meinen, die Stätten lägen unter dem flachen Südbecken oder seien nicht zu finden."
    - "Die Ebene erscheint noch zweimal. Salomos Bronze für den Tempel wurde „in der Gegend am Jordan“ gegossen, „in dicker Erde, zwischen Sukkoth und Zarthan“, wo die Schwemmerde zu den Gussformen passte; und nach Absaloms Tod „lief“ Ahimaaz „geradewegs und kam Chusi vor“ und brachte David in Mahanajim die Nachricht. Heute ist das Tal zwischen Jordanien am Ostufer und Israel und dem Westjordanland im Westen geteilt, mit Jericho, Dattelplantagen, der Allenby-Brücke und den Taufstätten am Fluss."
  fr:
    - "La « plaine du Jourdain », en hébreu le kikkar ou « cercle » du Jourdain, est le large fond de la fosse du Jourdain là où le fleuve approche de la mer Morte : le fond de la vallée depuis Succoth et Tsarthan environ au nord jusqu’à Jéricho et la mer au sud, à quelque 200 m sous le niveau de la mer au nord et à plus de 400 m à la mer Morte. Elle fait partie du grand rift qui va de la Syrie à l’Afrique ; les hivers sont doux, les étés féroces, et la vie dépend des sources et des cours d’eau qui descendent des collines, de sorte que l’oasis de Jéricho, « la ville des palmiers », est verte tandis que la plaine alentour n’est que marne nue. Josèphe louait la plaine de Jéricho pour ses palmiers, son baume et la source qu’Élisée assainit."
    - "La Genèse en fait le pays que choisit Lot. Depuis les collines près de Béthel, il « vit toute la plaine du Jourdain, qui était entièrement arrosée », avant la destruction de Sodome et de Gomorrhe, « comme un jardin de l’Éternel, comme le pays d’Égypte » ; il « habita dans les villes de la plaine, et dressa ses tentes jusqu’à Sodome ». On l’avertit : « ne t’arrête pas dans toute la plaine ; sauve-toi vers la montagne », et l’Éternel « détruisit ces villes, toute la plaine » ; d’Hébron, Abraham vit la fumée du pays monter « comme la fumée d’une fournaise ». L’emplacement des villes est débattu : on cite le plus souvent Bab edh-Dhra et Numeira, villes du Bronze ancien sur la rive sud-est de la mer Morte ; Tall el-Hammam, au nord-est de l’embouchure du fleuve, a été proposé ; d’autres pensent que les sites gisent sous le bassin sud peu profond ou sont introuvables."
    - "La plaine apparaît encore deux fois. Le bronze de Salomon pour le Temple fut fondu « dans la plaine du Jourdain dans un sol argileux, entre Succoth et Tsarthan », où la terre alluviale convenait aux moules ; et après la mort d’Absalom, Achimaats « courut par le chemin de la plaine » jusqu’à Mahanaïm et « devança Cuschi » pour apporter la nouvelle à David. Aujourd’hui, la vallée est partagée entre la Jordanie sur la rive est et Israël et la Cisjordanie sur la rive ouest, avec Jéricho, des palmeraies de dattiers, le pont Allenby et les sites de baptême sur le fleuve."
  pl:
    - "„Równina Jordanu”, po hebrajsku kikkar, czyli „okrąg” Jordanu, to szerokie dno rowu Jordanu, gdzie rzeka zbliża się do Morza Martwego: dno doliny mniej więcej od Sukkot i Sartan na północy po Jerycho i morze na południu, leżące od około 200 m poniżej poziomu morza na północy do ponad 400 m poniżej poziomu morza przy Morzu Martwym. Jest częścią wielkiego rowu, który biegnie od Syrii do Afryki; zimy są łagodne, lata srogie, a życie zależy od źródeł i strumieni spływających ze wzgórz, tak że oaza Jerycha, „miasta osadzonego palmami”, jest zielona, podczas gdy otaczająca równina jest naga, z marglu. Józef Flawiusz chwalił równinę Jerycha za palmy, balsam i źródło, które Elizeusz uzdrowił."
    - "Księga Rodzaju czyni ją ziemią, którą wybrał Lot. Ze wzgórz koło Betel „obaczył wszystkę równinę nad Jordanem, iż wszystka wilgotna była przedtem, niż zatracił Pan Sodomę i Gomorrę”, jak ogród Pański, i „jako ziemia Egipska”; „mieszkał w miejscach onej równiny, i rozbił namiot aż do Sodomy”. Gdy aniołowie go wyprowadzali, ostrzegli go: „ani stawaj na tej wszystkiej równinie; uchodź na górę”, a Pan „wywrócił miasta one, i wszystkę onę równinę”; Abraham, patrząc z Hebronu w dół, zobaczył, jak „wychodził dym z onej ziemi, jako dym z pieca”. Gdzie stały miasta, jest sporne: najczęściej wymienia się miasta z wczesnej epoki brązu Bab edh-Dhra i Numeira na południowo-wschodnim brzegu Morza Martwego, proponowano Tall el-Hammam na północny wschód od ujścia rzeki, a inni sądzą, że stanowiska leżą pod płytką południową kotliną albo że nie da się ich znaleźć."
    - "Równina pojawia się jeszcze dwa razy. Spiż Salomona do Świątyni odlano na równinie Jordanu, „w iłowatej ziemi, między Sochotem i między Sartanem”, gdzie aluwialna ziemia nadawała się do form; a po śmierci Absaloma Achimaas pobiegł drogą przez równinę do Mahanaim i wyprzedził Kuszytę, by przynieść Dawidowi wieść. Dziś dolina jest podzielona między Jordanię na wschodnim brzegu a Izrael i Zachodni Brzeg na zachodnim, z Jerychem, plantacjami daktyli, mostem Allenby'ego i miejscami chrztu nad rzeką."
  it:
    - "La «pianura del Giordano», in ebraico il kikkar o «cerchio» del Giordano, è l’ampio fondo della fossa del Giordano dove il fiume si avvicina al Mar Morto: il fondovalle da circa Succot e Sartan a nord fino a Gerico e al mare a sud, che giace da circa 200 m sotto il livello del mare a nord a più di 400 m al Mar Morto. Fa parte della grande spaccatura che corre dalla Siria all’Africa; gli inverni sono miti, le estati feroci, e la vita dipende dalle sorgenti e dai torrenti che scendono dai colli, così che l’oasi di Gerico, la «città delle palme», è verde mentre la pianura attorno è nuda marna. Giuseppe Flavio lodava la pianura di Gerico per le palme, il balsamo e la sorgente che Eliseo guarì."
    - "La Genesi ne fa la terra di Lot. Dai colli presso Betel egli «vide l’intera pianura del Giordano», «tutta quanta irrigata fino a Tsoar, come il giardino dell’Eterno, come il paese d’Egitto», prima della distruzione di Sodoma e Gomorra; «Lot abitò nelle città della pianura e andò piantando le sue tende fino a Sodoma». Gli angeli, fattolo uscire, lo ammonirono: «non ti fermare in alcun luogo della pianura; sàlvati al monte», e il Signore «distrusse quelle città e tutta la pianura»; Abramo, da Ebron, vide «un fumo che si levava dalla terra, come il fumo d’una fornace». Dove sorgessero le città è discusso: si nominano più spesso le città del Bronzo Antico di Bab edh-Dhra e Numeira sulla riva sud-orientale del Mar Morto; è stata proposta Tall el-Hammam a nord-est della foce del fiume; altri pensano che i siti giacciano sotto il basso bacino meridionale o siano introvabili."
    - "La pianura compare ancora due volte. Il bronzo di Salomone per il Tempio fu fuso nella pianura del Giordano, «in un suolo argilloso, fra Succoth e Tsarthan», dove la terra alluvionale si prestava agli stampi; e dopo la morte di Assalonne Achimaas «prese la corsa per la via della pianura» fino a Maanaim e superò il Cusita per portare a Davide la notizia. Oggi la valle è divisa fra la Giordania sulla riva orientale e Israele e la Cisgiordania su quella occidentale, con Gerico, piantagioni di datteri, il ponte Allenby e i luoghi del battesimo sul fiume."
  nl:
    - "De “vlakte van de Jordaan”, in het Hebreeuws de kikkar of “ronde” van de Jordaan, is de brede bodem van de Jordaangraben waar de rivier de Dode Zee nadert: de dalbodem van ongeveer Sukkot en Zaretan in het noorden tot Jericho en de zee in het zuiden, op zo’n 200 m onder zeeniveau in het noorden tot meer dan 400 m bij de Dode Zee. Hij maakt deel uit van de grote breuk die van Syrië naar Afrika loopt; de winters zijn mild, de zomers fel, en het leven hangt af van bronnen en de beken die uit de heuvels komen, zodat de oase van Jericho, “de palmstad”, groen is terwijl de vlakte eromheen kale mergel is. Josephus prees de vlakte van Jericho om haar palmen, balsem en de bron die Elisa genas."
    - "Genesis maakt haar tot het land dat Lot koos. Vanaf de heuvels bij Bethel “zag” hij “de ganse vlakte der Jordaan, dat zij die geheel bevochtigde; eer de HEERE Sodom en Gomorra verdorven had, was zij als de hof des HEEREN, als Egypteland”; Lot “woonde in de steden der vlakte, en sloeg tenten tot aan Sodom toe”. Bij het uitleiden waarschuwden de engelen hem: “sta niet op deze ganse vlakte; behoud u naar het gebergte heen”, en de HEER “keerde deze steden om, en die ganse vlakte”; Abraham zag, vanaf Hebron neerkijkend: “er ging een rook van het land op, gelijk de rook eens ovens”. Waar de steden stonden, is omstreden: meestal Bab edh-Dhra en Numeira uit de Vroege Bronstijd aan de zuidoostoever van de Dode Zee, ook Tall el-Hammam ten noordoosten van de riviermonding is voorgesteld, en anderen menen dat ze onder het ondiepe zuidelijke bekken liggen of onvindbaar zijn."
    - "De vlakte komt nog tweemaal voor. Salomo’s brons voor de tempel werd gegoten in de vlakte van de Jordaan, “in dichte aarde, tussen Sukkoth en tussen Zarthan”, waar de aangeslibde aarde geschikt was voor de mallen; en na Absaloms dood “liep” Achimaäs “den weg van het effen veld” naar Machanaïm en liep de Cusjiet voorbij om David het bericht te brengen. Nu is het dal verdeeld tussen Jordanië op de oostoever en Israël en de Westoever aan de westkant, met Jericho, dadelplantages, de Allenbybrug en de doopplaatsen aan de rivier."
  cs:
    - "„Rovina Jordánská“, hebrejsky kikkar neboli „kruh“ Jordánu, je široké dno jordánského příkopu, kde se řeka blíží k Mrtvému moři: dno údolí zhruba od Sukotu a Caretanu na severu k Jerichu a moři na jihu, ležící od asi 200 m pod hladinou moře na severu do více než 400 m u Mrtvého moře. Je součástí velkého riftu vedoucího ze Sýrie do Afriky; zimy jsou mírné, léta kruté a život závisí na pramenech a potocích sbíhajících z hor, takže oáza Jericha, „města palmovím osazeného“, je zelená, zatímco rovina kolem je holá slínová půda. Josephus chválil jerišskou rovinu pro její palmy, balzám a pramen, který Elíša uzdravil."
    - "Genesis z ní činí zemi, kterou si zvolil Lot. Z pahorků u Bét-elu „spatřil všecku rovinu vůkol Jordánu, kteráž před tím, než Hospodin zkazil Sodomu a Gomoru, všecka až k Ségor svlažována byla, jako zahrada Hospodinova, a jako země Egyptská“; „přebýval v městech té roviny, podav stanů až k Sodomě“. Když jej andělé vedli ven, varovali ho: „ani se zastavuj na vší této rovině; ujdi na horu“, a Hospodin „podvrátil ta města i všecku tu rovinu“; Abraham, hledící dolů z Hebronu, viděl, jak „vystupoval dým z země té, jako dým z vápenice“. Kde města stála, je sporné: nejčastěji se jmenují města rané doby bronzové Bab edh-Dhra a Numejra na jihovýchodním břehu Mrtvého moře, navržen byl Tall el-Hammám severovýchodně od ústí řeky a jiní soudí, že místa leží pod mělkou jižní pánví nebo je nelze nalézt."
    - "Rovina se objevuje ještě dvakrát. Šalomounův bronz pro chrám byl odlit v Jordánské rovině, „v jilovaté zemi, mezi Sochot a Sartan“, kde naplavená půda vyhovovala formám; a po Abšalomově smrti Achimaas běžel po cestě přes rovinu do Machanajim a předběhl Kúšovce, aby přinesl Davidovi zprávu. Dnes je údolí rozděleno mezi Jordánsko na východním břehu a Izrael a Západní břeh na západním, s Jerichem, datlovými plantážemi, Allenbyho mostem a místy křtu na řece."
  sv:
    - "”Jordanslätten”, på hebreiska Jordans kikkar, ”rund”, är den vida botten av Jordangraven där floden närmar sig Döda havet: dalbottnen från ungefär Suckot och Saretan i norr till Jeriko och havet i söder, belägen från omkring 200 m under havsytan i norr till mer än 400 m vid Döda havet. Den är en del av den stora gravsänka som löper från Syrien till Afrika; vintrarna är milda, somrarna hårda, och livet beror av källor och de bäckar som rinner ned från höjderna, så att oasen Jeriko, ”Palmstaden”, är grön medan slätten omkring är kal märgel. Josefus prisade Jerikoslätten för dess palmer, balsam och den källa som Elisha helade."
    - "Första Moseboken gör den till det land som Lot valde. Från höjderna vid Betel såg han ”att hela Jordanslätten överallt var vattenrik. Innan HERREN fördärvade Sodom och Gomorra, var den nämligen såsom HERRENS lustgård, såsom Egyptens land”; han ”bodde i städerna på Slätten och drog med sina tält ända inemot Sodom”. När änglarna förde ut honom varnade de: ”dröj ingenstädes på Slätten. Fly undan till bergen”, och Herren ”omstörtade dessa städer med hela Slätten”; Abraham, som såg ned från Hebron, fick se ”en rök stiga upp från landet, lik röken från en smältugn”. Var städerna låg är omstritt: tidigbronsålderns städer Bab edh-Dhra och Numeira på Döda havets sydöstra strand nämns oftast, Tall el-Hammam nordost om flodens mynning har föreslagits, och andra menar att platserna ligger under det grunda södra bäckenet eller inte går att finna."
    - "Slätten förekommer ytterligare två gånger. Salomos brons till templet göts på Jordanslätten, ”i lerformar, mellan Suckot och Saretan”, där den alluviala jorden passade för formarna; och efter Absaloms död skyndade Achimaas till Mahanajim, ”tog vägen över Jordanslätten och hann om etiopiern” för att bära David budet. I dag är dalen delad mellan Jordanien på östra stranden och Israel och Västbanken på den västra, med Jeriko, dadelplantager, Allenbybron och dopplatserna vid floden."
  nb:
    - "«Jordan-sletten», på hebraisk kikkar, «det runde» ved Jordan, er den brede bunnen av Jordangraven der elven nærmer seg Dødehavet: dalbunnen fra omtrent Sukkot og Saretan i nord til Jeriko og havet i sør, fra rundt 200 m under havet i nord til mer enn 400 m ved Dødehavet. Den er en del av den store riftdalen som går fra Syria til Afrika; vintrene er milde, somrene brennende, og livet avhenger av kilder og av bekkene som kommer ned fra høydene, slik at oasen Jeriko, «Palmestaden», er grønn mens sletten omkring er bar mergel. Josefus priste Jerikosletten for palmene, balsamen og kilden som Elisja helbredet."
    - "Første Mosebok gjør den til landet Lot valgte. Fra høydene ved Betel så han at «hele Jordan-sletten … overalt var rik på vann, som Herrens have, som Egyptens land - det var før Herren hadde ødelagt Sodoma og Gomorra»; han «bodde i byene på sletten og drog med sine telt like bort til Sodoma». Da englene førte ham ut, advarte de ham: «stans ikke på hele sletten, fly op i fjellene», og Herren «ødela disse byer og hele sletten»; Abraham, som så ned fra Hebron, så at «røken steg op fra landet som røken fra en smelteovn». Hvor byene lå, er omdiskutert: byene Bab edh-Dhra og Numeira fra tidlig bronsealder på Dødehavets sørøstlige strand nevnes oftest, Tall el-Hammam nordøst for elvemunningen er blitt foreslått, og andre mener at stedene ligger under det grunne sørlige bassenget eller ikke kan finnes."
    - "Sletten dukker opp to ganger til. Salomos bronse til tempelet ble støpt på Jordan-sletten, «i lerjorden mellem Sukkot og Sartan», der avleiringsjorden egnet seg til formene; og etter Absaloms død «sprang» Ahimaas «efter veien gjennem Jordansletten» til Mahanajim og kom forbi kusjitten for å bringe David budskapet. I dag er dalen delt mellom Jordan på østbredden og Israel og Vestbredden på vestsiden, med Jeriko, daddelplantasjer, Allenby-broen og dåpsstedene ved elven."
  tl:
    - "Ang “kapatagan ng Jordan”, na sa Hebreo ay ang kikkar o “bilog” ng Jordan, ay ang malawak na sahig ng bangin ng Jordan malapit sa Dagat na Patay: ang ilalim ng libis mula sa mga Succoth at Sarethan sa hilaga hanggang sa Jerico at sa dagat sa timog, mula mga 200 m sa ibaba ng lebel ng dagat sa hilaga hanggang higit sa 400 m sa Dagat na Patay. Bahagi ito ng malaking lamat ng lupa mula Siria hanggang Aprika; banayad ang taglamig, matindi ang tag-araw, at ang buhay ay nakasalalay sa mga bukal at mga batis na bumababa mula sa mga burol, kaya't luntian ang oasis ng Jerico, “bayan ng mga puno ng palma”, samantalang hubad na marl ang kapatagan sa palibot nito. Pinuri ni Josefo ang kapatagan ng Jerico dahil sa mga palma, balsamo at sa bukal na pinagaling ni Eliseo."
    - "Pinili ito ni Lot. Mula sa mga burol ng Beth-el, “natanaw niya ang buong kapatagan ng Jordan, na pawang patubigan na magaling sa magkabikabila … bago giniba ng Panginoon ang Sodoma at Gomorra, ay gaya ng halamanan ng Panginoon, gaya ng lupain ng Egipto”; “tumahan sa mga bayan ng kapatagan, at inilipat ang kaniyang tolda hanggang sa Sodoma”. Binalaan siya ng anghel: “huwag kang … huminto man sa buong kapatagan; tumakas ka hanggang sa bundok”; “ginunaw niya ang mga bayang yaon, at ang buong Kapatagan”; nakita ni Abraham mula sa Hebron na “ang usok ng lupain ay napaiilanglang na parang usok ng isang hurno”. Pinagtatalunan ang lugar nila: kadalasan ang Bab edh-Dhra at Numeira (Maagang Panahon ng Tanso) sa timog-silangang baybayin ng Dagat na Patay; iminungkahi ang Tall el-Hammam sa hilagang-silangan ng bunganga ng ilog; ang iba'y nasa ilalim ng mababaw na timog na palanggana o di matagpuan."
    - "Dalawang ulit pang lumilitaw ang kapatagan. Ang tanso ni Salomon para sa Templo ay binubo sa kapatagan ng Jordan, “sa malagkit na lupa na nasa pagitan ng Succoth at ng Sarthan”, kung saan angkop sa mga hulmahan ang lupang buhangin; at pagkamatay ni Absalom, si Ahimaas ay “tumakbo sa daan ng kapatagan” patungong Mahanaim at inunahan ang Cusita upang dalhin kay David ang balita. Sa ngayon, ang libis ay hati sa pagitan ng Jordan sa silangang pampang at Israel at West Bank sa kanluran, kasama ang Jerico, mga taniman ng datiles, ang tulay ng Allenby at ang mga pook ng bautismo sa ilog."
  da:
    - "»Jordanens Slette«, på hebraisk Jordans kikkar eller »rundingen«, er den brede bund af Jordangraven, hvor floden nærmer sig Det Døde Hav: dalbunden fra omkring Sukkot og Saretan i nord til Jeriko og havet i syd, der ligger fra omkring 200 m under havets overflade i nord til mere end 400 m ved Det Døde Hav. Den er en del af den store forkastningsdal, der løber fra Syrien til Afrika; vintrene er milde, somrene brændende, og livet afhænger af kilder og de bække, der kommer ned fra højderne, så oasen Jeriko, »Palmestaden«, er grøn, mens sletten omkring den er bar mergel. Josephus priste Jerikos slette for dens palmer, balsam og den kilde, som Elisa helbredte."
    - "Første Mosebog gør den til det land, Lot valgte. Han stod på højderne ved Betel og »saa den ganske Slette ved Jordanen, thi den var vandrig overalt; førend Herren fordærvede Sodoma og Gomorra, var den som Herrens Have, som Ægyptens Land«; han »boede i Stæderne paa Sletten og opslog Telte indtil Sodoma«. Da englene førte ham ud, advarede de ham: »stands ikke paa hele Sletten, frels dig paa Bjerget«, og Herren »omstyrtede disse Stæder og den ganske Egn«; Abraham, der så ned fra Hebron, så, at »en Røg steg op af Landet som en Røg af en Ovn«. Hvor byerne lå, er omdiskuteret: Byerne fra tidlig bronzealder, Bab edh-Dhra og Numeira ved Det Døde Havs sydøstlige bred, nævnes oftest, Tall el-Hammam nordøst for flodens munding er blevet foreslået, og andre mener, at stederne ligger under det lavvandede sydlige bassin eller ikke kan findes."
    - "Sletten optræder to gange mere. Salomons bronze til templet blev støbt på Jordanens slette, »i den faste Jord, imellem Sukot og Zarthan«, hvor den aflejrede jord egnede sig til formene; og efter Absaloms død »løb Ahimaaz ad Vejen over Sletten« til Mahanajim og løb forbi Kusiten for at bringe David nyheden. I dag er dalen delt mellem Jordan på den østlige bred og Israel og Vestbredden på den vestlige, med Jeriko, daddelplantager, Allenby-broen og dåbsstederne ved floden."
