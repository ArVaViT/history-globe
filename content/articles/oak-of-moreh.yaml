# Overview article (ADR 0007). Mainstream facts only; the link with the other sacred trees of Shechem is named as a possibility.
id: oak-of-moreh
place: a38ad9f
title:
  en: "Moreh"
  ru: "Дубрава Море"
body:
  en:
    - "Moreh was a great tree, or a grove, at Shechem, the first place in Canaan where Abram stopped: “And Abram passed through the land unto the place of Sichem, unto the plain of Moreh. And the Canaanite was then in the land.” There the LORD appeared to him and promised the land to his seed, and Abram built his first altar. The Hebrew is elon Moreh, “the oak” or “terebinth of Moreh”; the King James “plain” follows older Jewish translations, the Synodal reads “oak grove”. Moreh means “teacher” and probably marks a tree where oracles were sought. Deuteronomy uses it as a landmark for Mount Gerizim and Mount Ebal, “beside the plains of Moreh”."
    - "Shechem had other sacred trees, and they may all be one: the oak under which Jacob hid the foreign gods, the oak by the sanctuary where Joshua set up a great stone, the oak of the pillar where Abimelech was made king, and the Diviners’ Oak of Judges 9:37. This Moreh is distinct from the hill of Moreh in the Jezreel valley where the Midianites camped against Gideon. The tree itself is long gone; the map places it within a kilometre of Tell Balata, ancient Shechem, on the eastern edge of Nablus between Gerizim and Ebal."
  ru:
    - "Море — большое дерево или роща у Сихема, первое место в Ханаане, где остановился Аврам: «И прошел Аврам по земле сей по длине ее до места Сихема, до дубравы Море. В этой земле тогда жили Хананеи». Там явился ему Господь и обещал землю его потомству, и Аврам построил свой первый жертвенник. По-еврейски сказано «элон Море», «дуб» или «теребинт Море»; Синодальный перевод говорит «дубрава», английская Библия короля Якова, вслед за древними иудейскими переводами, — «равнина». «Море» значит «учитель», и, вероятно, это было дерево, у которого искали прорицаний. Второзаконие указывает по нему место гор Гаризим и Гевал: «близ дубравы Море»."
    - "У Сихема были и другие священные деревья, и, возможно, все они — одно: дуб, под которым Иаков закопал чужих богов, дуб у святилища, под которым Иисус Навин поставил большой камень, дуб близ Сихема, у которого воцарили Авимелеха, и дуб Меонним из 9-й главы Судей. Эта дубрава Море — не холм Море в Изреельской долине, у которого стоял стан Мадианитян против Гедеона. Самого дерева давно нет; на карте оно стоит в пределах километра от Телль-Балаты, древнего Сихема, на восточном краю Наблуса между Гаризимом и Гевалом."
