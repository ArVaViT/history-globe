# Overview article (ADR 0007). Mainstream facts only; the link with the other sacred trees of Shechem is named as a possibility.
id: oak-of-moreh
place: a38ad9f
title:
  en: "Moreh"
  ru: "Дубрава Море"
  uk: "Дубрава Море"
  es: "Moré"
  pt: "Moré"
  de: "Hain More"
  fr: "Moré"
