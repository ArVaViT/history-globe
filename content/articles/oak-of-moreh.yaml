body:
  en:
    - "Moreh was a great tree, or a grove, at Shechem, the first place in Canaan where Abram stopped: “And Abram passed through the land unto the place of Sichem, unto the plain of Moreh. And the Canaanite was then in the land.” There the LORD appeared to him and promised the land to his seed, and Abram built his first altar. The Hebrew is elon Moreh, “the oak” or “terebinth of Moreh”; the King James “plain” follows older Jewish translations, the Synodal reads “oak grove”. Moreh means “teacher” and probably marks a tree where oracles were sought. Deuteronomy uses it as a landmark for Mount Gerizim and Mount Ebal, “beside the plains of Moreh”."
    - "Shechem had other sacred trees, and they may all be one: the oak under which Jacob hid the foreign gods, the oak by the sanctuary where Joshua set up a great stone, the oak of the pillar where Abimelech was made king, and the Diviners’ Oak of Judges 9:37. This Moreh is distinct from the hill of Moreh in the Jezreel valley where the Midianites camped against Gideon. The tree itself is long gone; the map places it within a kilometre of Tell Balata, ancient Shechem, on the eastern edge of Nablus between Gerizim and Ebal."
  ru:
    - "Море — большое дерево или роща у Сихема, первое место в Ханаане, где остановился Аврам: «И прошел Аврам по земле сей по длине ее до места Сихема, до дубравы Море. В этой земле тогда жили Хананеи». Там явился ему Господь и обещал землю его потомству, и Аврам построил свой первый жертвенник. По-еврейски сказано «элон Море», «дуб» или «теребинт Море»; Синодальный перевод говорит «дубрава», английская Библия короля Якова, вслед за древними иудейскими переводами, — «равнина». «Море» значит «учитель», и, вероятно, это было дерево, у которого искали прорицаний. Второзаконие указывает по нему место гор Гаризим и Гевал: «близ дубравы Море»."
    - "У Сихема были и другие священные деревья, и, возможно, все они — одно: дуб, под которым Иаков закопал чужих богов, дуб у святилища, под которым Иисус Навин поставил большой камень, дуб близ Сихема, у которого воцарили Авимелеха, и дуб Меонним из Судей 9:37. Эта дубрава Море — не холм Море в Изреельской долине, у которого стоял стан Мадианитян против Гедеона. Самого дерева давно нет; на карте оно стоит в пределах километра от Телль-Балаты, древнего Сихема, на восточном краю Наблуса между Гаризимом и Гевалом."
  uk:
    - "Море було великим деревом або гаєм у Сихемі, першим місцем у Ханаані, де зупинився Аврам: «І пройшов Аврам землю до врочища Сихема, до дубрави Море́, Канаанеї ж тодї жили в тїй землї». Там Господь явився йому й пообіцяв землю його насінню, і Аврам спорудив свій перший жертовник. Єврейською це елон Море, «дуб» або «теревінт Море»; «рівнина» в Біблії короля Якова йде за давніми єврейськими перекладами, а Синодальний переклад читає «дубрава». Море означає «учитель» і, ймовірно, позначає дерево, де питали оракулів. Повторення Закону використовує її як орієнтир для гори Герізім і гори Евал, «коло дубрави Море»."
    - "У Сихемі були й інші священні дерева, і всі вони, можливо, одне й те саме: дуб, під яким Яків сховав чужих богів, дуб при святилищі, під яким Ісус Навин поставив великий камінь, дуб стовпа, під яким Авімелеха проголосили царем, і Дуб ворожбитів із Книги Суддів 9:37. Це Море відрізняється від пагорба Море в Їзреельській долині, де мадіянітяни таборували проти Гедеона. Саме дерево давно зникло; карта розміщує його не далі ніж за кілометр від Тель-Балати, давнього Сихема, на східній околиці Наблуса між Герізімом і Евалом."
  es:
    - "Moré era un gran árbol, o un bosquecillo, en Siquem, el primer lugar de Canaán donde se detuvo Abram: «Y pasó Abram por aquella tierra hasta el lugar de Sichêm, hasta el valle de Moreh: y el Cananeo estaba entonces en la tierra». Allí se le apareció el Señor y prometió la tierra a su descendencia, y Abram edificó su primer altar. El hebreo es elon Moré, «la encina» o «el terebinto de Moré»; la «llanura» de la versión inglesa King James sigue a las antiguas traducciones judías, y la Biblia sinodal lee «encinar». Moré significa «maestro» y probablemente señala un árbol donde se consultaban oráculos. El Deuteronomio lo usa como punto de referencia para el monte Gerizim y el monte Ebal, «junto á los llanos de Moreh»."
    - "Siquem tenía otros árboles sagrados, y quizá todos sean uno solo: la encina bajo la cual Jacob escondió los dioses extranjeros, la encina junto al santuario donde Josué erigió una gran piedra, la encina del pilar donde Abimelec fue hecho rey, y la Encina de los Adivinos de Jueces 9:37. Este Moré es distinto de la colina de Moré en el valle de Jezreel donde acamparon los madianitas contra Gedeón. El árbol mismo desapareció hace mucho; el mapa lo sitúa a menos de un kilómetro de Tell Balata, la antigua Siquem, en el borde oriental de Nablus, entre el Gerizim y el Ebal."
  pt:
    - "Moré era uma grande árvore, ou um bosque, em Siquém, o primeiro lugar em Canaã em que Abrão parou: “Abrão atravessou a terra até o lugar de Siquém, até o carvalho de Moré. Naquele tempo, os cananeus estavam na terra.” Ali o SENHOR lhe apareceu e prometeu a terra à sua descendência, e Abrão edificou seu primeiro altar. O hebraico é elon Moré, “o carvalho” ou “terebinto de Moré”; a “planície” da King James segue traduções judaicas mais antigas, e a Sinodal lê “bosque de carvalhos”. Moré significa “mestre” e provavelmente assinala uma árvore onde se buscavam oráculos. O Deuteronômio a usa como ponto de referência para o Monte Gerizim e o Monte Ebal, “junto aos carvalhos de Moré”."
    - "Siquém tinha outras árvores sagradas, e todas podem ser a mesma: o carvalho debaixo do qual Jacó escondeu os deuses estrangeiros, o carvalho junto ao santuário onde Josué ergueu uma grande pedra, o carvalho do pilar onde Abimeleque foi feito rei, e o Carvalho dos Adivinhadores de Juízes 9:37. Este Moré é distinto da colina de Moré no vale de Jezreel onde os midianitas acamparam contra Gideão. A própria árvore desapareceu há muito; o mapa a situa a menos de um quilômetro de Tell Balata, a antiga Siquém, na orla leste de Nablus, entre o Gerizim e o Ebal."
  de:
    - "More war ein großer Baum oder Hain bei Sichem, der erste Ort in Kanaan, an dem Abram haltmachte: „zog Abram durch bis an die Stätte Sichem und an den Hain More; es wohnten aber zu der Zeit die Kanaaniter im Lande.“ Dort erschien ihm der HERR, verhieß seinen Nachkommen das Land, und Abram baute seinen ersten Altar. Hebräisch steht elon More, „die Eiche“ oder „Terebinthe More“; das „plain“ der King-James-Bibel folgt älteren jüdischen Übersetzungen, die russische Synodalübersetzung liest „Eichenhain“, Luther „Hain“. More bedeutet „Lehrer“ und bezeichnet wohl einen Baum, an dem Orakel gesucht wurden. Das Deuteronomium nennt ihn als Landmarke für Garizim und Ebal: „bei dem Hain More“."
    - "Sichem hatte noch andere heilige Bäume, und sie mögen alle derselbe sein: die Eiche, unter der Jakob die fremden Götter vergrub, die Eiche beim Heiligtum, wo Josua einen großen Stein aufrichtete, die Eiche des Denkmals, wo Abimelech zum König gemacht wurde, und die Wahrsagereiche von Richter 9,37. Dieses More ist vom Hügel More im Jesreel-Tal zu unterscheiden, wo die Midianiter gegen Gideon lagerten. Der Baum selbst ist längst verschwunden; die Karte setzt ihn innerhalb eines Kilometers von Tell Balata, dem antiken Sichem, am Ostrand von Nablus zwischen Garizim und Ebal."
  fr:
    - "Moré était un grand arbre, ou un bosquet, à Sichem, le premier lieu de Canaan où s’arrêta Abram : « Abram parcourut le pays jusqu’au lieu nommé Sichem, jusqu’aux chênes de Moré. Les Cananéens étaient alors dans le pays. » Là l’Éternel lui apparut et promit le pays à sa postérité, et Abram bâtit son premier autel. L’hébreu est elon Moré, « le chêne » ou « térébinthe de Moré » ; la King James met « plain », « plaine », d’après d’anciennes traductions juives, la Bible synodale russe « bosquet de chênes » ; Louis Segond lit « chênes ». Moré signifie « enseignant » et marque probablement un arbre où l’on consultait des oracles. Le Deutéronome s’en sert comme repère pour le mont Garizim et le mont Ébal, « près des chênes de Moré »."
    - "Sichem avait d’autres arbres sacrés, et ce peut être un seul et même arbre : le térébinthe sous lequel Jacob enfouit les dieux étrangers, le chêne près du sanctuaire où Josué dressa une grande pierre, le chêne du monument où Abimélec fut fait roi, et le chêne des Devins de Juges 9:37. Ce Moré est distinct de la colline de Moré dans la vallée de Jizreel, où les Madianites campèrent contre Gédéon. L’arbre lui-même a disparu depuis longtemps ; la carte le place à moins d’un kilomètre de Tell Balata, l’ancienne Sichem, au bord oriental de Naplouse, entre le Garizim et l’Ébal."
  it:
    - "Morè era un grande albero, o un boschetto, a Sichem, il primo luogo di Canaan in cui Abramo si fermò: «E Abramo traversò il paese fino al luogo di Sichem, fino alla quercia di Moreh. Or in quel tempo i Cananei erano nel paese.» Là il Signore gli apparve e promise il paese alla sua progenie, e Abramo edificò il suo primo altare. L’ebraico è elon Moreh, «la quercia» o «terebinto di Moreh»; la «plain» della King James segue antiche traduzioni giudaiche, la sinodale legge «querceto». Moreh significa «maestro» e indica probabilmente un albero presso cui si cercavano oracoli. Il Deuteronomio lo usa come punto di riferimento per il Monte Garizim e il Monte Ebal, «presso la querce di Moreh»."
    - "Sichem aveva altri alberi sacri, e forse sono tutti uno solo: la quercia sotto cui Giacobbe nascose gli dèi stranieri, la quercia presso il santuario dove Giosuè eresse una grande pietra, la quercia del monumento dove Abimelech fu fatto re, e la Quercia degli Indovini di Giudici 9,37. Questo Morè è distinto dal colle di Morè nella valle di Izreel dove i Madianiti si accamparono contro Gedeone. L’albero stesso è scomparso da tempo; la mappa lo colloca a meno di un chilometro da Tell Balata, l’antica Sichem, al margine orientale di Nablus tra il Garizim e l’Ebal."
  pl:
    - "More było wielkim drzewem albo gajem w Sychem, pierwszym miejscem w Kanaanie, gdzie zatrzymał się Abram: „Tedy przeszedł Abram ziemię onę aż do miejsca Sychem, i aż do równiny Morech; a Chananejczyk na ten czas był w onej ziemi”. Tam ukazał mu się Pan i obiecał ziemię jego potomstwu, a Abram zbudował swój pierwszy ołtarz. Po hebrajsku jest elon More, „dąb” albo „terebint More”; „plain” Biblii Króla Jakuba idzie za dawnymi przekładami żydowskimi, Biblia synodalna czyta „dąbrowa”. More znaczy „nauczyciel” i prawdopodobnie oznacza drzewo, przy którym szukano wyroczni. Księga Powtórzonego Prawa używa go jako punktu orientacyjnego dla góry Garizim i góry Ebal, „przy równinie Morech”."
    - "Sychem miało inne święte drzewa i może wszystkie są jednym: dąb, pod którym Jakub ukrył obce bogi, dąb przy świątyni, pod którym Jozue postawił wielki kamień, dąb ze słupem, gdzie Abimelek został królem, oraz Dąb Wróżbitów z Sdz 9,37. To More jest różne od wzgórza More w dolinie Jizreel, gdzie Madianici obozowali przeciw Gedeonowi. Samo drzewo dawno zniknęło; mapa umieszcza je w odległości kilometra od Tell Balata, dawnego Sychem, na wschodnim skraju Nablusu między Garizim a Ebal."
  cs:
    - "Móre byl velký strom nebo háj v Šekemu, první místo v Kanaánu, kde se Abram zastavil: „I prošel Abram tu zemi až k místu Sichem, to jest až k rovině More. A tehdáž Kananejští byli v zemi.“ Tam se mu Hospodin ukázal a zaslíbil zemi jeho semeni a Abram vystavěl svůj první oltář. Hebrejsky stojí elon Móre, „dub“ nebo „terebint Móre“; anglické „plain“ ve verzi King James následuje starší židovské překlady, synodální Bible má „dubový háj“. Móre znamená „učitel“ a nejspíš označuje strom, kde se hledaly věštby. Deuteronomium jej užívá jako orientační bod pro horu Gerizim a horu Ébal, „blízko rovin More“."
    - "Šekem měl i jiné posvátné stromy a mohou být všechny jedním: dub, pod nímž Jákob ukryl cizí bohy, dub u svatyně, kde Jozue postavil velký kámen, dub sloupu, kde byl Abimelek učiněn králem, a Věštcův dub z Sd 9,37. Toto Móre se liší od pahorku Móre v Jizreelském údolí, kde se proti Gedeonovi utábořili Midjánci. Strom sám dávno zmizel; mapa jej klade do vzdálenosti jednoho kilometru od Tell Balata, starověkého Šekemu, na východním okraji Nábulusu mezi Gerizimem a Ébalem."
  nl:
    - "More was een grote boom, of een bosje, bij Sichem, de eerste plaats in Kanaän waar Abram halt hield: “En Abram is doorgetogen in dat land, tot aan de plaats Sichem, tot aan het eikenbos More; en de Kanaänieten waren toen ter tijd in dat land.” Daar verscheen de HEER aan hem en beloofde het land aan zijn zaad, en Abram bouwde zijn eerste altaar. Het Hebreeuws heeft elon More, “de eik” of “terebint van More”; het “plain” van de King James Version volgt oudere Joodse vertalingen, de Synodale Bijbel leest “eikenbos”. More betekent “leraar” en markeert waarschijnlijk een boom waar orakels werden geraadpleegd. Deuteronomium gebruikt het als oriëntatiepunt voor de berg Gerizim en de berg Ebal, “bij de eikenbossen van More”."
    - "Sichem had andere heilige bomen, en het kan één en dezelfde zijn: de eik waaronder Jakob de vreemde goden verborg, de eik bij het heiligdom waar Jozua een grote steen oprichtte, de eik van de zuil waar Abimelech koning werd gemaakt, en de Eik van de Waarzeggers van Recht. 9:37. Dit More verschilt van de heuvel More in de vallei van Jizreël, waar de Midianieten tegen Gideon kampeerden. De boom zelf is allang verdwenen; de kaart plaatst hem binnen een kilometer van Tell Balata, het oude Sichem, aan de oostrand van Nabloes tussen Gerizim en Ebal."
  sv:
    - "More var ett stort träd, eller en lund, vid Shekem, den första plats i Kanaan där Abram stannade: ”Och Abram drog fram i landet ända till den heliga platsen vid Sikem, till Mores terebint. Och på den tiden bodde kananéerna där i landet.” Där uppenbarade sig HERREN för honom och lovade landet åt hans säd, och Abram byggde sitt första altare. Hebreiskan är elon More, ”Mores ek” eller ”Mores terebint”; King James-översättningens ”plain” följer äldre judiska översättningar, den synodala bibeln har ”ekdunge”. More betyder ”lärare” och markerar förmodligen ett träd där orakel söktes. Femte Mosebok använder det som landmärke för berget Gerisim och berget Eval, ”bredvid Mores terebintlund”."
    - "Shekem hade andra heliga träd, och de kan alla vara ett: eken under vilken Jakob gömde de främmande gudarna, eken vid helgedomen där Josua reste en stor sten, pelareken där Avimelek blev kung och Spåmännens ek i Dom 9:37. Detta More är skilt från kullen More i Jisreeldalen där midjaniterna slog läger mot Gideon. Själva trädet är sedan länge borta; kartan placerar det inom en kilometer från Tell Balata, forntida Shekem, i östra utkanten av Nablus mellan Gerisim och Eval."
  nb:
    - "More var et stort tre, eller en lund, ved Sikem, det første stedet i Kanaan der Abram stanset: «Og Abram drog gjennem landet til Sikem-bygden, til Mores terebintelund; og kana'anittene bodde dengang der i landet.» Der åpenbarte Herren seg for ham og lovte landet til hans ætt, og Abram bygde sitt første alter. Det hebraiske er elon Moreh, «eika» eller «terebinten ved More»; King James-ordet «plain» følger eldre jødiske oversettelser, den synodale bibelen har «eikelund». More betyr «lærer» og markerer trolig et tre der man søkte orakler. 5. Mosebok bruker det som landemerke for Garisim og Ebal, «ved Mores terebintelund»."
    - "Sikem hadde andre hellige trær, og de kan alle være ett: terebinten Jakob gravde ned de fremmede gudene under, eika ved helligdommen der Josva reiste en stor sten, eika ved søylen der Abimelek ble gjort til konge, og Spåmannseika i Dommernes bok 9,37. Dette More er forskjellig fra More-høyden i Jisreel-dalen, der midianittene slo leir mot Gideon. Selve treet er for lengst borte; kartet plasserer det innenfor en kilometer fra Tell Balata, det gamle Sikem, i den østlige kanten av Nablus mellom Garisim og Ebal."
  tl:
    - "Ang Moreh ay isang malaking punongkahoy, o kakahuyan, sa Sichem, ang unang lugar sa Canaan na pinahintuan ni Abram: “At naglakbay sa lupain si Abram hanggang sa dako ng Sichem, hanggang sa punong encina ng More. At noo'y nasa lupaing yaon ang Cananeo.” Doon napakita sa kaniya ang Panginoon at ipinangako ang lupain sa kaniyang binhi, at itinayo ni Abram ang kaniyang unang dambana. Ang Hebreo ay elon Moreh, “ang encina” o “terebinto ng Moreh”; ang “plain” ng King James ay sumusunod sa mas lumang mga salin ng mga Judio, ang Bibliyang Sinodal ay bumabasa ng “kakahuyan ng mga encina”. Ang Moreh ay nangangahulugang “guro” at marahil ay nagmamarka ng punongkahoy kung saan hinihingi ang mga orakulo. Ginagamit ito ng Deuteronomio bilang palatandaan para sa Bundok Gerizim at Bundok Ebal, “kasiping ng mga encina sa More”."
    - "May iba pang sagradong punongkahoy ang Sichem, at maaaring iisa lamang silang lahat: ang encina kung saan itinago ni Jacob ang mga banyagang diyos, ang encina sa tabi ng santuwaryo kung saan nagtayo si Josue ng isang malaking bato, ang encina ng haligi kung saan ginawang hari si Abimelech, at ang Encina ng mga Manghuhula ng Mga Hukom 9:37. Ang Moreh na ito ay naiiba sa burol ng Moreh sa libis ng Jezreel kung saan nagkampo ang mga Midianita laban kay Gedeon. Matagal nang wala ang mismong punongkahoy; inilalagay ito ng mapa sa loob ng isang kilometro mula sa Tell Balata, ang sinaunang Sichem, sa silangang gilid ng Nablus sa pagitan ng Gerizim at Ebal."
  da:
    - "More var et stort træ eller en lund ved Sikem, det første sted i Kana'an, hvor Abram gjorde holdt: »Og Abram drog igennem Landet til det Sted Sikem indtil More Lund; og Kananiten var da i Landet.« Dér åbenbarede Herren sig for ham og lovede landet til hans afkom, og Abram byggede sit første alter. Det hebraiske er elon More, »egen« eller »terebinten ved More«; King James-oversættelsens »plain« følger ældre jødiske oversættelser, den synodale bibel har »egelund«. More betyder »lærer« og markerer sandsynligvis et træ, hvor man søgte orakler. 5. Mosebog bruger det som landemærke for Garizim og Ebal, »ved More Lund«."
    - "Sikem havde andre hellige træer, og de kan alle være ét: egen, under hvilken Jakob skjulte de fremmede guder, egen ved helligdommen, hvor Josva rejste en stor sten, egen ved støtten, hvor Abimelek blev gjort til konge, og Spåmandsegen i Dom 9,37. Dette More er forskelligt fra højen More i Jizre'el-dalen, hvor midjaniterne lejrede sig mod Gideon. Selve træet er for længst væk; kortet placerer det inden for en kilometer fra Tell Balata, det gamle Sikem, i udkanten af Nablus mod øst mellem Garizim og Ebal."
  sr:
    - "Море је било велико дрво, или шумарак, у Сихему, прво место у Хананској земљи где се Аврам зауставио: „И пође Аврам ту земљу до места Сихема и до равнице морешке; а беху тада Хананеји у тој земљи.“ Ту му се јавио Господ и обећао земљу његовом семену, а Аврам је подигао свој први жртвеник. Хебрејски је елон Море, „храст“ или „теребинт Мореов“; „равница“ у Библији краља Џејмса следи старије јеврејске преводе, а Синодална библија чита „храстова шума“. Море значи „учитељ“ и вероватно означава дрво где су тражена пророчанства. Поновљени закон га користи као оријентир за гору Гаризим и гору Гевал, „код равнице морешке“."
    - "Сихем је имао и друга света дрвета, и сва могу бити једно: храст под којим је Јаков закопао туђе богове, храст код светиње где је Исус Навин подигао велики камен, храст стуба где је Авимелех постављен за цара, и Меоненимски дуб из Судија 9,37. Ово Море је различито од брда Море у долини Језраел где су Мадијамци логоровали против Гедеона. Само дрво одавно је нестало; карта га смешта у кругу од километра од Тел Балате, древног Сихема, на источном ободу Наблуса између Гаризима и Гевала."
  hu:
    - "Móré egy nagy fa vagy liget volt Sikemnél, az első hely Kánaánban, ahol Ábrám megállt: „És általméne Ábrám a földön mind Sikhem vidékéig, Móréh tölgyeséig. Akkor Kananeusok valának azon a földön.” Ott megjelent neki az Úr, és megígérte a földet magvának, Ábrám pedig megépítette első oltárát. A héber elon Móré, „Móré tölgye” vagy „terebintfája”; a King James Version „plain” szava régebbi zsidó fordításokat követ, az orosz Szinodális „tölgyes”-t mond. A Móré jelentése „tanító”, és valószínűleg olyan fát jelöl, ahol jóslatot kértek. Az 5Móz a Garizim-hegy és az Ébál-hegy tájékozódási pontjaként használja, „a Móré tölgyei mellett”."
    - "Sikemnek más szent fái is voltak, és lehet, hogy mind egyet jelentenek: a tölgy, amely alá Jákób az idegen isteneket rejtette, a szentély melletti tölgy, ahol Józsué nagy követ állított, az oszlop tölgye, ahol Abimélek királlyá lett, és a Jósok tölgye a Bír 9,37-ben. Ez a Móré különbözik a Jezréel-völgyben álló Móré-dombtól, ahol a midiániták Gedeon ellen táboroztak. Maga a fa rég eltűnt; a térkép a Tell Balatától, az ókori Sikemtől egy kilométeren belül helyezi el, Nablus keleti szélén a Garizim és az Ébál között."
  fi:
    - "Moren tammi oli suuri puu tai lehto Sikemissä, ensimmäinen paikka Kanaanissa, jossa Abram pysähtyi: ”Ja Abram kulki maan läpi aina Sikemin paikkakunnalle, Mooren tammelle asti. Ja siihen aikaan kanaanilaiset asuivat siinä maassa.” Siellä Herra ilmestyi hänelle ja lupasi maan hänen jälkeläisilleen, ja Abram rakensi ensimmäisen alttarinsa. Heprea on elon Moreh, ”Moren tammi” tai ”Moren terebintti”; King Jamesin ”plain” seuraa vanhempia juutalaisia käännöksiä, synodaalikäännös lukee ”tammimetsä”. Moreh merkitsee ”opettajaa” ja merkitsee todennäköisesti puuta, jonka luona haettiin oraakkeleita. 5. Mooseksen kirja käyttää sitä maamerkkinä Garisiminvuorelle ja Ebalvuorelle, ”Mooren tammiston luona”."
    - "Sikemissä oli muitakin pyhiä puita, ja ne voivat kaikki olla yksi ja sama: tammi, jonka alle Jaakob kätki vieraat jumalat, pyhäkön luona oleva tammi, jonka alle Joosua pystytti suuren kiven, muistomerkkitammi, jonka luona Abimelek tehtiin kuninkaaksi, ja Tuomarien kirjan 9:37:n Ennustajientammi. Tämä Moreh on eri kuin Moren kukkula Jisreelin laaksossa, jonka luona midianilaiset leiriytyivät Gideonia vastaan. Itse puu on ammoin kadonnut; kartta sijoittaa sen kilometrin säteelle Tell Balatasta, muinaisesta Sikemistä, Nablusin itäreunalla Garisimin ja Ebalin välissä."
  vi:
    - "Mô-rê là một cây lớn, hay một lùm cây, ở Si-chem, nơi đầu tiên tại Ca-na-an mà Áp-ram dừng chân: “Áp-ram trải qua xứ nầy, đến cây dẻ bộp của Mô-rê, tại Si-chem. Vả, lúc đó, dân Ca-na-an ở tại xứ.” Tại đó Đức Giê-hô-va hiện ra với ông và hứa ban đất cho dòng dõi ông, và Áp-ram lập bàn thờ đầu tiên của mình. Chữ Hê-bơ-rơ là elon Moreh, “cây sồi” hay “cây dẻ bộp của Mô-rê”; bản King James dịch “plain” (đồng bằng) theo các bản dịch Do Thái cổ hơn, còn bản Synodal tiếng Nga đọc là “rừng sồi”. Moreh có nghĩa là “người dạy” và có lẽ đánh dấu một cây nơi người ta cầu sấm truyền. Sách Phục Truyền dùng nó làm mốc cho núi Ga-ri-xim và núi Ê-banh, “gần những cây dẻ bộp của Mô-rê”."
    - "Si-chem có những cây thiêng khác, và có thể tất cả chỉ là một: cây sồi mà Gia-cốp chôn các thần ngoại bang dưới đó, cây sồi bên nơi thánh mà Giô-suê dựng một hòn đá lớn, cây sồi của cột đá nơi A-bi-mê-léc được tôn làm vua, và Cây Sồi Thầy Bói trong Các Quan Xét 9:37. Mô-rê này khác với gò Mô-rê trong thung lũng Gít-rê-ên, nơi người Ma-đi-an đóng trại chống Ghê-đê-ôn. Bản thân cái cây đã mất từ lâu; bản đồ đặt nó trong phạm vi một kilômét quanh Tell Balata, Si-chem cổ, ở rìa đông Nablus giữa Ga-ri-xim và Ê-banh."
  ro:
    - "Moreh era un copac mare, sau un crâng, la Sihem, primul loc din Canaan unde s-a oprit Avram: „a străbătut Avram pământul în lungimea lui până la locul Sihem, la stejarul cel înalt; și Hananeii locuiau atunci pre pământul acela”. Acolo Domnul i s-a arătat și a făgăduit țara seminției lui, iar Avram a ridicat primul său altar. Cuvântul ebraic este elon Moreh, „stejarul” sau „terebintul lui Moreh”; „plain” din King James urmează traduceri evreiești mai vechi, iar traducerea sinodală rusă citește „dumbravă de stejari”. Moreh înseamnă „învățător” și marchează probabil un copac unde se cereau oracole. Deuteronomul îl folosește ca reper pentru Muntele Garizim și Muntele Ebal, „aproape de stejarul cel înalt”."
    - "Sihemul avea și alți copaci sfinți, și e posibil să fie toți unul singur: stejarul sub care Iacov a ascuns zeii străini, stejarul de lângă sanctuar unde Iosua a ridicat o piatră mare, stejarul stâlpului unde Abimelec a fost făcut rege și Stejarul Descântătorilor din Judecători 9:37. Acest Moreh este deosebit de dealul Moreh din Valea Izreel, unde au tăbărât madianiții împotriva lui Ghedeon. Copacul însuși a dispărut de mult; harta îl așază la mai puțin de un kilometru de Tell Balata, vechiul Sihem, la marginea estică a Nablusului, între Garizim și Ebal."
  bg:
    - "Море било голямо дърво или горичка при Сихем — първото място в Ханаан, където Аврам се спрял: „И премина Аврам оназ земя до мястото Сихем, до дъба Море: Ханаанците тогаз живееха в тази земя.“ Там Господ му се явил и обещал земята на потомството му, и Аврам издигнал първия си олтар. На иврит е елон Море, „дъбът“ или „теребинтът на Море“; „равнината“ в Библията на крал Джеймс следва по-стари еврейски преводи, а Синодалният превод има „дъбрава“. Море означава „учител“ и вероятно обозначава дърво, при което търсели прорицания. Второзаконие го използва като ориентир за планините Гаризим и Гевал — „при дъбовете Море“."
    - "Сихем имал и други свещени дървета, които може би са едно и също: теребинтът, под който Яков скрил чуждите богове, теребинтът при светилището, където Иисус Навин поставил голям камък, дъбът на стълба, където Авимелех бил провъзгласен за цар, и Дъбът на гадателите от Съдии 9:37. Това Море е различно от хълма Море в Изреелската долина, където мадиамците се разположили на стан срещу Гедеон. Самото дърво отдавна го няма; картата го поставя на не повече от километър от Тел Балата, древния Сихем, на източния край на Наблус между Гаризим и Гевал."
