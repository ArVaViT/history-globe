body:
  en:
    - "Adramyttium was a Greek city of Aeolis in north-western Asia Minor, at the head of the gulf named after it, between Mount Ida and the island of Lesbos. The ancient city lay at Ören, on the Karataş peninsula near Burhaniye; the settlement later moved inland to the north-east, to the town of Edremit, which keeps the name. Pliny says that it was earlier called Pedasus and that it gave its name to a judicial district, to which a long list of cities of the region came for justice."
    - "When Paul, having appealed to Caesar, was sent from Caesarea to Rome in the charge of the centurion Julius, the voyage began “entering into a ship of Adramyttium”, “meaning to sail by the coasts of Asia”, with Aristarchus, “a Macedonian of Thessalonica”, on board. The ship was probably a coaster making for its home port along the Asian shore: it touched at Sidon, sailed under Cyprus and reached Myra in Lycia, where the centurion found a ship of Alexandria sailing into Italy and put the prisoners on it. The city is named only here in the Bible."
    - "Thucydides records that in 422 BC the Persian satrap Pharnaces gave Atramyttium to the Delians whom Athens had expelled from their island, and that later Arsaces, an officer of Tissaphernes, had their leading men shot down at a dinner. Strabo counts Adramyttium among the considerable cities of the coast, but says that it suffered in the Mithridatic war, when the general Diodorus put its council to death to please the king; he also names its orator Xenocles, who defended the province of Asia before the Roman Senate. The site of the ancient city is at Ören, in Turkey's Balıkesir province."
  ru:
    - "Адрамиттий был греческим городом Эолиды на северо-западе Малой Азии, в глубине залива, названного по нему, между горой Ида и островом Лесбос. Древний город стоял у Ёрена, на полуострове Караташ близ Бурханийе; позже поселение переместилось вглубь суши, к северо-востоку, в город Эдремит, который сохраняет имя. Плиний пишет, что прежде он назывался Педас и давал имя судебному округу, куда за правосудием сходился длинный ряд городов края."
    - "Когда Павла, потребовавшего суда кесаря, отправили из Кесарии в Рим под надзором сотника Юлия, путь начался так: «Мы взошли на Адрамитский корабль и отправились, намереваясь плыть около Асийских мест»; с ними был Аристарх, «Македонянин из Фессалоники». Корабль, вероятно, шёл вдоль берегов Асии в свой родной порт: он пристал к Сидону, прошёл у Кипра и прибыл в Миры Ликийские, где сотник нашёл Александрийский корабль, плывущий в Италию, и пересадил узников на него. В Библии город назван только здесь."
    - "Фукидид сообщает, что в 422 г. до н. э. персидский сатрап Фарнак отдал Атрамиттий делосцам, которых Афины изгнали с их острова, а позже Арсак, военачальник Тиссаферна, велел перестрелять их знатных людей на пиру. Страбон относит Адрамиттий к значительным городам побережья, но говорит, что тот пострадал в Митридатовой войне, когда полководец Диодор в угоду царю казнил его совет; он называет и местного оратора Ксенокла, защищавшего провинцию Азию перед римским сенатом. Место древнего города — у Ёрена в турецкой провинции Балыкесир."
  uk:
    - "Адрамитій був грецьким містом в Еолії на північному заході Малої Азії, на чолі затоки, названої на його честь, між горою Іда та островом Лесбос. Давнє місто лежало в Орені, на півострові Караташ біля Бурханіє; згодом поселення перемістилося вглиб суходолу на північний схід, до міста Едремит, яке зберігає цю назву. Пліній каже, що раніше воно називалося Педас і дало ім'я судовому округу, до якого по правосуддя приходили багато міст області."
    - "Коли Павла, що звернувся до кесаря, відіслали з Кесарії до Риму під охороною сотника Юлія, подорож почалася так: «ввійшовши в корабель Адрамицький, маючи плисти попри місця Азийські», з Аристархом, «Македонцем із Солуня», на борту. Корабель був, імовірно, прибережним судном, що прямувало до свого порту приписки вздовж азійського берега: він зайшов до Сідона, поплив під захистом Кіпру й дістався до Мир у Лікії, де сотник знайшов александрійський корабель, що плив в Італію, і пересадив на нього в'язнів. У Біблії місто згадане лише тут."
    - "Фукідід повідомляє, що 422 р. до н. е. перський сатрап Фарнак віддав Атрамитій делосцям, яких Афіни вигнали з їхнього острова, а пізніше Арсак, чиновник Тіссаферна, наказав розстріляти їхніх вождів під час обіду. Страбон зараховує Адрамитій до значних міст узбережжя, але каже, що воно постраждало під час Мітридатової війни, коли воєначальник Діодор, щоб догодити цареві, стратив його раду; він називає й оратора Ксенокла, який захищав провінцію Азію перед римським сенатом. Місце давнього міста — в Орені, у турецькій провінції Баликесір."
  es:
    - "Adramitio era una ciudad griega de Eólide, en el noroeste de Asia Menor, en el fondo del golfo que lleva su nombre, entre el monte Ida y la isla de Lesbos. La ciudad antigua se encontraba en Ören, en la península de Karataş, cerca de Burhaniye; el poblado se trasladó después tierra adentro, al noreste, a la ciudad de Edremit, que conserva el nombre. Plinio dice que antes se llamaba Pedaso y que dio nombre a un distrito judicial al que acudían a recibir justicia una larga lista de ciudades de la región."
    - "Cuando Pablo, tras apelar al César, fue enviado de Cesarea a Roma al cuidado del centurión Julio, el viaje comenzó «embarcándonos en una nave Adrumentina», «para navegar junto á los lugares de Asia», con Aristarco, «Macedonio de Tesalónica», a bordo. La nave era probablemente un barco costero que se dirigía a su puerto de origen por la costa asiática: tocó Sidón, navegó bajo Chipre y llegó a Mira de Licia, donde el centurión halló una nave de Alejandría que iba a Italia y puso en ella a los presos. La ciudad solo se nombra aquí en la Biblia."
    - "Tucídides refiere que en 422 a. C. el sátrapa persa Farnaces dio Atramitio a los delios a quienes Atenas había expulsado de su isla, y que más tarde Arsaces, oficial de Tisafernes, hizo matar a flechazos a sus hombres principales durante un banquete. Estrabón cuenta Adramitio entre las ciudades considerables de la costa, pero dice que sufrió en la guerra mitridática, cuando el general Diodoro hizo ejecutar a su consejo para complacer al rey; nombra además a su orador Jenocles, que defendió a la provincia de Asia ante el Senado romano. El emplazamiento de la ciudad antigua está en Ören, en la provincia turca de Balıkesir."
  pt:
    - "Adramítio era uma cidade grega da Eólia, no noroeste da Ásia Menor, na cabeceira do golfo que leva seu nome, entre o monte Ida e a ilha de Lesbos. A cidade antiga ficava em Ören, na península de Karataş, perto de Burhaniye; o povoado mudou-se depois para o interior, a nordeste, para a cidade de Edremit, que conserva o nome. Plínio diz que ela se chamava antes Pedaso e que deu nome a um distrito judicial, ao qual uma longa lista de cidades da região recorria para obter justiça."
    - "Quando Paulo, tendo apelado a César, foi enviado de Cesareia a Roma sob a guarda do centurião Júlio, a viagem começou com o embarque “em um navio de Adramítio, que estava prestes a navegar para os lugares na costa da Ásia”, tendo a bordo Aristarco, “um macedônio de Tessalônica”. O navio era provavelmente uma embarcação costeira que rumava ao seu porto de origem ao longo do litoral asiático: tocou em Sidom, navegou sob o abrigo de Chipre e chegou a Mira, na Lícia, onde o centurião encontrou um navio de Alexandria que navegava para a Itália e nele embarcou os prisioneiros. A cidade é mencionada na Bíblia somente aqui."
    - "Tucídides registra que em 422 a.C. o sátrapa persa Farnaces deu Atramítio aos délios, que Atenas havia expulsado de sua ilha, e que mais tarde Arsaces, oficial de Tissafernes, mandou abater os principais deles durante um banquete. Estrabão conta Adramítio entre as cidades consideráveis da costa, mas diz que ela sofreu na guerra mitridática, quando o general Diodoro mandou executar seu conselho para agradar ao rei; menciona também seu orador Xenocles, que defendeu a província da Ásia perante o Senado romano. O sítio da cidade antiga fica em Ören, na província turca de Balıkesir."
  de:
    - "Adramyttion war eine griechische Stadt in Aiolis im Nordwesten Kleinasiens, am Kopf des nach ihr benannten Golfs, zwischen dem Idagebirge und der Insel Lesbos. Die antike Stadt lag bei Ören auf der Halbinsel Karataş nahe Burhaniye; die Siedlung wanderte später landeinwärts nach Nordosten zur Stadt Edremit, die den Namen bewahrt. Plinius sagt, sie habe früher Pedasos geheißen und einem Gerichtsbezirk den Namen gegeben, zu dem eine lange Reihe von Städten der Gegend um Recht kam."
    - "Als Paulus, nachdem er sich auf den Kaiser berufen hatte, in der Obhut des Hauptmanns Julius von Caesarea nach Rom gesandt wurde, begann die Reise damit, dass sie „in ein adramyttisches Schiff traten“, „daß wir an Asien hin schiffen sollten“, und mit ihnen war Aristarch, „aus Mazedonien, von Thessalonich“. Das Schiff war wahrscheinlich ein Küstenfahrer auf dem Weg zu seinem Heimathafen entlang der asiatischen Küste: Es lief Sidon an, fuhr unter Zypern hin und erreichte Myra in Lykien, wo der Hauptmann ein alexandrinisches Schiff nach Italien fand und die Gefangenen darauf umsteigen ließ. Die Stadt wird nur hier in der Bibel genannt."
    - "Thukydides berichtet, dass der persische Satrap Pharnakes 422 v. Chr. Atramyttion den Deliern gab, die Athen von ihrer Insel vertrieben hatte, und dass später Arsakes, ein Offizier des Tissaphernes, ihre führenden Männer bei einem Gastmahl niederschießen ließ. Strabon zählt Adramyttion zu den ansehnlichen Städten der Küste, sagt aber, es habe im Mithridatischen Krieg gelitten, als der Feldherr Diodoros seinen Rat dem König zu Gefallen hinrichten ließ; er nennt auch seinen Redner Xenokles, der die Provinz Asia vor dem römischen Senat verteidigte. Die Stätte der antiken Stadt liegt bei Ören in der türkischen Provinz Balıkesir."
  fr:
    - "Adramytte était une cité grecque d’Éolide, dans le nord-ouest de l’Asie Mineure, au fond du golfe qui porte son nom, entre le mont Ida et l’île de Lesbos. L’antique cité se trouvait à Ören, sur la presqu’île de Karataş près de Burhaniye ; l’agglomération s’est déplacée plus tard dans les terres, au nord-est, vers la ville d’Edremit, qui garde le nom. Pline dit qu’elle s’appelait auparavant Pédasos et qu’elle donna son nom à un ressort judiciaire où une longue liste de villes de la région venaient chercher justice."
    - "Quand Paul, qui en avait appelé à César, fut envoyé de Césarée à Rome sous la garde du centurion Julius, le voyage commença ainsi : « Nous montâmes sur un navire d’Adramytte, qui devait côtoyer l’Asie », avec à bord Aristarque, « Macédonien de Thessalonique ». Le navire était probablement un caboteur regagnant son port d’attache le long de la côte d’Asie : il toucha Sidon, passa sous Chypre et atteignit Myra en Lycie, où le centurion trouva un navire d’Alexandrie qui allait en Italie et y fit monter les prisonniers. La ville n’est nommée qu’ici dans la Bible."
    - "Thucydide rapporte qu’en 422 av. J.-C. le satrape perse Pharnace donna Atramyttion aux Déliens qu’Athènes avait chassés de leur île, et que plus tard Arsakès, officier de Tissapherne, fit massacrer leurs chefs lors d’un dîner. Strabon compte Adramytte parmi les villes notables de la côte, mais dit qu’elle souffrit dans la guerre mithridatique, quand le général Diodore fit mettre à mort son conseil pour plaire au roi ; il nomme aussi son orateur Xénoclès, qui plaida pour la province d’Asie devant le Sénat romain. Le site de la cité antique est à Ören, dans la province turque de Balıkesir."
  it:
    - "Adramitto era una città greca dell’Eolide, nell’Asia Minore nord-occidentale, in fondo al golfo che da essa prende il nome, tra il monte Ida e l’isola di Lesbo. L’antica città sorgeva a Ören, sulla penisola di Karataş presso Burhaniye; l’abitato si spostò poi nell’entroterra a nord-est, nella città di Edremit, che ne conserva il nome. Plinio dice che in precedenza si chiamava Pedaso e che diede il nome a un distretto giudiziario, al quale facevano capo per la giustizia molte città della regione."
    - "Quando Paolo, dopo aver fatto appello a Cesare, fu inviato da Cesarea a Roma sotto la custodia del centurione Giulio, il viaggio cominciò «montati sopra una nave adramittina», «che dovea toccare i porti della costa d’Asia», con a bordo Aristarco, «Macedone di Tessalonica». La nave era probabilmente un costiero diretto al proprio porto d’origine lungo la costa asiatica: toccò Sidone, navigò sotto Cipro e raggiunse Mira di Licia, dove il centurione trovò una nave alessandrina che faceva vela per l’Italia e vi fece salire i prigionieri. La città è nominata solo qui nella Bibbia."
    - "Tucidide riferisce che nel 422 a.C. il satrapo persiano Farnace diede Atramittio ai Delii che Atene aveva scacciato dalla loro isola, e che più tardi Arsace, un ufficiale di Tissaferne, fece trucidare a un banchetto i loro capi. Strabone annovera Adramitto tra le città considerevoli della costa, ma dice che soffrì nella guerra mitridatica, quando il generale Diodoro fece uccidere il suo consiglio per compiacere il re; nomina anche il suo oratore Senocle, che difese la provincia d’Asia davanti al Senato romano. Il sito dell’antica città è a Ören, nella provincia turca di Balıkesir."
  nl:
    - "Adramyttium was een Griekse stad in Aeolis in het noordwesten van Klein-Azië, aan het hoofd van de naar haar genoemde golf, tussen de berg Ida en het eiland Lesbos. De antieke stad lag bij Ören, op het schiereiland Karataş bij Burhaniye; de nederzetting verplaatste zich later landinwaarts naar het noordoosten, naar de stad Edremit, die de naam bewaart. Plinius zegt dat zij eerder Pedasus heette en haar naam gaf aan een rechtsdistrict, waarheen een lange reeks steden uit de streek voor recht kwam."
    - "Toen Paulus, nadat hij zich op de keizer had beroepen, van Caesarea naar Rome werd gestuurd onder bewaking van de hoofdman Julius, begon de reis met “in een Adramyttenisch schip gegaan zijnde, alzo wij de plaatsen langs Azie bevaren zouden”, met Aristarchus, “de Macedonier van Thessalonica”, aan boord. Het schip was waarschijnlijk een kustvaarder die langs de Aziatische kust naar zijn thuishaven voer: het deed Sidon aan, voer onder Cyprus heen en bereikte Myra in Lycië, waar de hoofdman een schip van Alexandrië vond dat naar Italië voer en de gevangenen daarop liet overgaan. De stad wordt in de Bijbel alleen hier genoemd."
    - "Thucydides vermeldt dat de Perzische satraap Pharnaces in 422 v.Chr. Atramyttium gaf aan de Deliërs die Athene van hun eiland had verdreven, en dat Arsaces, een officier van Tissaphernes, hun voornaamste mannen later tijdens een maaltijd liet neerschieten. Strabo rekent Adramyttium tot de aanzienlijke steden van de kust, maar zegt dat zij te lijden had in de Mithridatische oorlog, toen de veldheer Diodorus haar raad ter dood liet brengen om de koning een genoegen te doen; hij noemt ook haar redenaar Xenocles, die de provincie Asia voor de Romeinse senaat verdedigde. De plaats van de antieke stad ligt bij Ören, in de Turkse provincie Balıkesir."
  pl:
    - "Adramyttium było greckim miastem Eolidy w północno-zachodniej Azji Mniejszej, u wierzchołka zatoki noszącej jego imię, między górą Idą a wyspą Lesbos. Starożytne miasto leżało w Ören na półwyspie Karataş koło Burhaniye; osada przeniosła się później w głąb lądu, na północny wschód, do miasta Edremit, które zachowuje tę nazwę. Pliniusz pisze, że dawniej zwano je Pedasos i że dało nazwę okręgowi sądowemu, do którego po sprawiedliwość zjeżdżała się długa lista miast tej okolicy."
    - "Gdy Paweł, który odwołał się do cesarza, został wysłany z Cezarei do Rzymu pod opieką setnika Juliusza, podróż zaczęła się od tego, że „wsiadłszy w okręt Adramiteński”, „mając płynąć podle krain Azyi”, popłynęli wraz z Arystarchem, „Macedończykiem z Tesaloniki”. Był to zapewne statek przybrzeżny, zmierzający wzdłuż wybrzeża azjatyckiego do swego portu macierzystego: zawinął do Sydonu, opłynął Cypr i dotarł do Miry w Licji, gdzie setnik znalazł aleksandryjski statek płynący do Italii i przeniósł na niego więźniów. Miasto to jest wymienione w Biblii tylko tu."
    - "Tukidydes zapisał, że w 422 p.n.e. perski satrapa Farnakes oddał Atramyttion Delijczykom, których Ateny wypędziły z ich wyspy, a później Arsakes, oficer Tissafernesa, kazał zastrzelić ich przywódców podczas uczty. Strabon zalicza Adramyttium do znaczniejszych miast wybrzeża, lecz mówi, że ucierpiało w wojnie mitrydatyjskiej, gdy wódz Diodor kazał z uległości wobec króla stracić jego radę; wymienia też jego mówcę Ksenoklesa, który bronił prowincji Azji przed senatem rzymskim. Położenie starożytnego miasta to Ören, w tureckiej prowincji Balıkesir."
  cs:
    - "Adramyttion bylo řecké město v Aiolidě v severozápadní Malé Asii, na konci zálivu, který podle něj nese jméno, mezi horou Ida a ostrovem Lesbos. Starověké město leželo v Ören na poloostrově Karataş u Burhaniye; sídliště se později přesunulo do vnitrozemí na severovýchod, do města Edremit, které si jméno zachovalo. Plinius říká, že se dříve jmenovalo Pedasos a že dalo jméno soudnímu okrsku, do něhož přicházela k soudu dlouhá řada měst z okolí."
    - "Když byl Pavel, který se odvolal k císaři, poslán z Cesareje do Říma pod dohledem setníka Julia, začala plavba tím, že „všedše na lodí Adramyttenskou“, aby se „plavili podle krajin Azie“, a byl s nimi „Aristarchus Macedonský z Tessaloniky“. Loď byla patrně pobřežní plavidlo mířící podél asijského pobřeží do svého domovského přístavu: zastavila se v Sidonu, plula pod Kyprem a dospěla do Myry v Lykii, kde setník našel alexandrijskou loď plující do Itálie a vězně na ni přesadil. Město je v Bibli jmenováno jen zde."
    - "Thúkydidés zaznamenává, že roku 422 př. n. l. dal perský satrapa Farnakés Atramyttion Délanům, které Athény vyhnaly z jejich ostrova, a že později Arsakés, důstojník Tissafernův, nechal jejich přední muže při hostině postřílet. Strabón počítá Adramyttion mezi významná města pobřeží, ale říká, že utrpělo v mithridatské válce, kdy vojevůdce Diodóros dal popravit jeho radu, aby se zavděčil králi; jmenuje také jeho řečníka Xenokla, který hájil provincii Asii před římským senátem. Místo starověkého města je v Ören v turecké provincii Balıkesir."
  sv:
    - "Adramyttion var en grekisk stad i Aiolis i nordvästra Mindre Asien, vid inre änden av den vik som har fått sitt namn efter den, mellan Idaberget och ön Lesbos. Den antika staden låg vid Ören, på halvön Karataş nära Burhaniye; bosättningen flyttade senare inåt land mot nordost, till staden Edremit, som behåller namnet. Plinius säger att den tidigare kallades Pedasos och att den gav namn åt ett domsområde dit en lång rad städer i trakten kom för att få rätt."
    - "När Paulus, som hade vädjat till kejsaren, sändes från Caesarea till Rom under centurionen Julius vakt, började resan så: ”vi gingo ombord på ett skepp från Adramyttium, som skulle anlöpa provinsen Asiens kuststäder”, med Aristarchos, ”en macedonier från Tessalonika”, ombord. Skeppet var sannolikt en kustfarare på väg till sin hemmahamn längs den asiatiska kusten: det anlöpte Sidon, seglade under Cypern och nådde Myra i Lykien, där centurionen fann ett skepp från Alexandria som skulle till Italien och förde fångarna ombord på det. Staden nämns bara här i Bibeln."
    - "Thukydides berättar att den persiske satrapen Farnakes år 422 f.Kr. gav Atramyttion åt delierna som Aten hade drivit bort från deras ö, och att Arsakes, en av Tissafernes’ officerare, senare lät skjuta ned deras ledande män under en middag. Strabon räknar Adramyttion bland kustens betydande städer, men säger att den led under det mithridatiska kriget, då generalen Diodoros lät avrätta dess råd för att behaga kungen; han nämner också dess talare Xenokles, som försvarade provinsen Asien inför den romerska senaten. Den antika stadens plats ligger vid Ören i Turkiets provins Balıkesir."
  nb:
    - "Adramyttion var en gresk by i Aiolis i nordvestlige Lilleasia, innerst i bukta som er oppkalt etter den, mellom Ida-fjellet og øya Lesbos. Den gamle byen lå ved Ören, på Karataş-halvøya nær Burhaniye; bosetningen flyttet senere innover i landet mot nordøst, til byen Edremit, som har bevart navnet. Plinius sier at den tidligere ble kalt Pedasos og at den ga navn til et rettsdistrikt som en lang rekke byer i regionen kom til for å få rett."
    - "Da Paulus, som hadde appellert til keiseren, ble sendt fra Cæsarea til Roma under høvedsmannen Julius, begynte reisen med at de gikk «ombord på et skib fra Adramyttium» som «skulde seile til stedene langs Asia-landet», med Aristarkos, «en makedonier fra Tessalonika», om bord. Skipet var trolig et kystskip på vei til hjemmehavnen langs asiakysten: det løp inn til Sidon, seilte inn under Kypros og nådde Myra i Lykia, der høvedsmannen fant et skip fra Aleksandria som skulle til Italia og satte fangene om bord på det. Byen nevnes bare her i Bibelen."
    - "Tukydid beretter at den persiske satrapen Farnakes i 422 f.Kr. ga Atramyttion til delierne som Aten hadde drevet bort fra øya deres, og at Arsakes, en offiser under Tissafernes, senere lot deres ledende menn skyte ned under et måltid. Strabon regner Adramyttion blant de betydelige byene på kysten, men sier at den led under Mithridates-krigen, da generalen Diodoros lot rådet henrette for å tekkes kongen; han nevner også dens taler Xenokles, som forsvarte provinsen Asia for det romerske senatet. Stedet for den gamle byen er ved Ören i den tyrkiske provinsen Balıkesir."
  tl:
    - "Ang Adrameto ay isang lungsod na Griyego ng Aeolis sa hilagang-kanlurang Asia Minor, sa dulo ng golpong ipinangalan dito, sa pagitan ng Bundok Ida at ng pulo ng Lesbos. Ang sinaunang lungsod ay nasa Ören, sa tangway ng Karataş malapit sa Burhaniye; lumipat ang pamayanan kalaunan sa loob ng lupain sa hilagang-silangan, sa bayan ng Edremit, na nagpapanatili ng pangalan. Sinasabi ni Plinio na tinawag itong Pedasus noon at ibinigay nito ang pangalan sa isang distritong panghukuman, na pinupuntahan ng mahabang talaan ng mga lungsod ng rehiyon upang humingi ng katarungan."
    - "Nang si Pablo, na umapela kay Cesar, ay ipadala mula sa Cesarea patungong Roma sa pangangalaga ng senturion na si Julio, nagsimula ang paglalayag sa “paglulan namin sa isang daong Adrameto”, “na palayag sa mga dakong nasa baybayin ng Asia”, na kasama si Aristarco, “isang taga Macedonia mula sa Tesalonica”. Ang daong ay marahil isang bangkang pang-baybayin na patungo sa sariling daungan nito sa baybayin ng Asia: dumaong ito sa Sidon, naglayag sa ilalim ng Chipre at umabot sa Mira sa Licia, kung saan nasumpungan ng senturion ang isang daong ng Alejandria na patungong Italia at inilulan doon ang mga bilanggo. Dito lamang pinangalanan ang lungsod sa Biblia."
    - "Itinatala ni Tucidides na noong 422 BK ay ibinigay ng satrapang Persiano na si Farnaces ang Atramyttium sa mga taga-Delos na pinalayas ng Atenas mula sa kanilang pulo, at na kalaunan ay ipinapana ni Arsaces, isang opisyal ni Tissaphernes, ang kanilang mga pinuno sa isang hapunan. Ibinibilang ni Strabo ang Adrameto sa mga mahahalagang lungsod ng baybayin, ngunit sinasabing nagdusa ito sa Digmaang Mitridatiko, nang ipapatay ng heneral na si Diodorus ang konseho nito upang bigyang-lugod ang hari; pinangalanan din niya ang orador nitong si Xenocles, na ipinagtanggol ang lalawigan ng Asia sa harap ng Senadong Romano. Ang lugar ng sinaunang lungsod ay nasa Ören, sa lalawigan ng Balıkesir ng Turkey."
