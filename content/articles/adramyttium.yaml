# Overview article (ADR 0007). Mainstream facts only; the ancient city is placed at Ören, the later town at Edremit; classical dates follow Thucydides.
id: adramyttium
place: a184f3a
title:
  en: "Adramyttium"
  ru: "Адрамиттий"
  uk: "Адрамитій"
  es: "Adramitio"
  pt: "Adramítio"
  de: "Adramyttion"
  fr: "Adramytte"
  it: "Adramitto"
  nl: "Adramyttium"
  pl: "Adramyttium"
