body:
  en:
    - "Elim was the oasis where Israel rested after the crossing of the sea and the bitter water of Marah: “they came to Elim, where were twelve wells of water, and threescore and ten palm trees: and they encamped there by the waters”. The itinerary in Numbers repeats the twelve springs and seventy palms, and adds that from Elim they “encamped by the Red sea” before entering the wilderness of Sin, “which is between Elim and Sinai”, on the fifteenth day of the second month after leaving Egypt. The name means “great trees” or “terebinths”; later readers made the twelve springs the tribes and the seventy palms the elders."
    - "Where it lay depends on the route of the exodus, which is disputed, and the map keeps the candidates. On the usual southern route down the west coast of the Sinai peninsula, most choose Wadi Gharandal, about 90 km south-east of Suez, where springs, tamarisks and palms still make the first real oasis south of the Suez plain; Edward Robinson found it already so regarded in 1838, and the atlases follow it. Others name Uyun Musa, the Springs of Moses just south of Suez, sometimes taken for Marah; Byzantine tradition set Elim at Raithou, the palm oasis of el-Tor far down the coast. Those who take Israel across the north of the peninsula look elsewhere again. Nothing can be dug up to decide it: an oasis leaves no walls."
    - "Wadi Gharandal today is a stop on the Suez–Sharm el-Sheikh road in Egypt's South Sinai governorate, a green strip of palms and reeds between the desert and the Gulf of Suez."
  ru:
    - "Елим — оазис, где Израиль отдохнул после перехода через море и горькой воды Мерры: «И пришли в Елим; там было двенадцать источников воды и семьдесят финиковых дерев, и расположились там станом при водах». Перечень станов в книге Чисел повторяет двенадцать источников и семьдесят пальм и прибавляет, что из Елима они «расположились станом у Чермного моря», прежде чем войти в пустыню Син, «что между Елимом и между Синаем», в пятнадцатый день второго месяца по выходе из Египта. Имя значит «большие деревья» или «теревинфы»; позднейшие читатели видели в двенадцати источниках колена, а в семидесяти пальмах — старейшин."
    - "Где он лежал, зависит от пути исхода, который спорен, и карта хранит кандидатов. На обычном южном пути вдоль западного берега Синайского полуострова чаще всего называют Вади-Гарандаль, примерно в 90 км к юго-востоку от Суэца, где источники, тамариски и пальмы до сих пор образуют первый настоящий оазис к югу от Суэцкой равнины; Эдвард Робинсон в 1838 году застал это мнение уже общепринятым, и большинство атласов следуют ему. Другие называют Уюн-Муса, Источники Моисея сразу к югу от Суэца, которые иногда принимают за Мерру; византийское предание помещало Елим в Раифу, пальмовый оазис Эт-Тура далеко вниз по берегу. Те, кто ведёт Израиль через север полуострова, ищут снова в другом месте. Раскопки тут ничего не решат: оазис не оставляет стен."
    - "Вади-Гарандаль сегодня — остановка на дороге Суэц — Шарм-эш-Шейх в египетской мухафазе Южный Синай, зелёная полоса пальм и тростника между пустыней и Суэцким заливом."
  uk:
    - "Елім був оазисом, де Ізраїль відпочивав після переходу через море і гіркої води Мерри: вони прийшли до Еліма, де було дванадцять джерел води і сімдесят пальм, і отаборилися там біля води. Перелік у Книзі Чисел повторює дванадцять джерел і сімдесят пальм: «знайшли дванайцять криниць і сїмдесять пальмових дерев», і додає, що з Еліма вони «отаборились над Червоним морем», перш ніж вступити в пустелю Сін, «що між Єлимом і Синайом», на п'ятнадцятий день другого місяця по виході з Єгипту. Назва означає «великі дерева» або «теревінти»; пізніші читачі зробили дванадцять джерел племенами, а сімдесят пальм — старійшинами."
    - "Де він лежав, залежить від маршруту виходу, який є спірним, і мапа зберігає кандидатів. На звичайному південному маршруті вниз західним узбережжям Синайського півострова найчастіше називають ваді Гарандаль, приблизно за 90 км на південний схід від Суеца, де джерела, тамариски й пальми й досі творять перший справжній оазис на південь від Суецької рівнини; Едвард Робінсон у 1838 р. застав цю думку вже загальноприйнятою, і більшість атласів дотримується її. Інші називають Уйюн-Муса, Джерела Мойсея просто на південь від Суеца, іноді вважані за Мерру; візантійська традиція ставила Елім у Раіфі, пальмовому оазисі ет-Тур далеко вниз узбережжям. Ті, хто веде Ізраїль через північ півострова, шукають знову деінде. Нічого не можна викопати, щоб це вирішити: оазис не лишає мурів."
    - "Ваді Гарандаль сьогодні — зупинка на шосе Суец — Шарм-еш-Шейх у провінції Південний Синай Єгипту, зелена смуга пальм і очерету між пустелею та Суецькою затокою."
  es:
    - "Elim era el oasis donde descansó Israel tras el cruce del mar y el agua amarga de Mara: «llegaron á Elim, donde había doce fuentes de aguas, y setenta palmas; y asentaron allí junto á las aguas». El itinerario de Números repite las doce fuentes y las setenta palmeras, y añade que desde Elim «asentaron junto al mar Bermejo» antes de entrar en el desierto de Sin, «que está entre Elim y Sinaí», el día quince del segundo mes después de salir de Egipto. El nombre significa «grandes árboles» o «terebintos»; lectores posteriores hicieron de las doce fuentes las tribus y de las setenta palmeras los ancianos."
    - "Dónde estaba depende de la ruta del éxodo, que se debate, y el mapa conserva los candidatos. En la ruta meridional habitual, por la costa occidental de la península del Sinaí, se suele elegir el uadi Gharandal, a unos 90 km al sudeste de Suez, donde fuentes, tarayes y palmeras siguen formando el primer oasis verdadero al sur de la llanura de Suez; Edward Robinson halló en 1838 que ya se lo tenía por Elim, y la mayoría de los atlas siguen esa identificación. Otros nombran Uyun Musa, las Fuentes de Moisés, justo al sur de Suez, a veces tomadas por Mara; la tradición bizantina situó Elim en Raitu, el oasis de palmeras de el-Tor, mucho más abajo en la costa. Quienes hacen cruzar a Israel por el norte de la península buscan en otro lugar. Nada puede desenterrarse para decidirlo: un oasis no deja muros."
    - "El uadi Gharandal es hoy una parada en la carretera Suez–Sharm el-Sheikh, en la gobernación egipcia del Sinaí Meridional, una franja verde de palmeras y cañas entre el desierto y el golfo de Suez."
  pt:
    - "Elim era o oásis onde Israel descansou depois da travessia do mar e da água amarga de Mara: “Eles chegaram a Elim, onde havia doze fontes de água e setenta palmeiras. Eles acamparam ali junto às águas”. O itinerário de Números repete as doze fontes e as setenta palmeiras e acrescenta que, de Elim, “acamparam junto ao Mar Vermelho”, antes de entrar no deserto de Sim, “que fica entre Elim e Sinai”, no décimo quinto dia do segundo mês depois da saída do Egito. O nome significa “grandes árvores” ou “terebintos”; leitores posteriores fizeram das doze fontes as tribos e das setenta palmeiras os anciãos."
    - "Onde ficava depende da rota do êxodo, que é disputada, e o mapa conserva os candidatos. Na rota meridional habitual, descendo pela costa oeste da península do Sinai, a escolha corrente é o uádi Gharandal, a cerca de 90 km a sudeste de Suez, onde fontes, tamargueiras e palmeiras ainda formam o primeiro oásis verdadeiro ao sul da planície de Suez; Edward Robinson encontrou-o já tido por Elim em 1838, e a maioria dos atlas segue essa identificação. Outros apontam Uyun Musa, as Fontes de Moisés logo ao sul de Suez, às vezes tomadas por Mara; a tradição bizantina pôs Elim em Raitu, o oásis de palmeiras de el-Tor, bem adiante na costa. Os que fazem Israel atravessar o norte da península procuram em outro lugar ainda. Nada se pode escavar para decidir: um oásis não deixa muros."
    - "O uádi Gharandal é hoje uma parada na estrada Suez–Sharm el-Sheikh, na província egípcia do Sinai do Sul, uma faixa verde de palmeiras e juncos entre o deserto e o Golfo de Suez."
  de:
    - "Elim war die Oase, in der Israel nach der Durchquerung des Meeres und dem bitteren Wasser von Mara rastete: „Und sie kamen gen Elim, da waren zwölf Wasserbrunnen und siebzig Palmbäume, und sie lagerten sich daselbst ans Wasser.“ Das Verzeichnis im Buch Numeri wiederholt die zwölf Quellen und siebzig Palmen und fügt hinzu: „Von Elim zogen sie aus und lagerten sich an das Schilfmeer“, ehe sie in die Wüste Sin kamen, „die da liegt zwischen Elim und Sinai“, am fünfzehnten Tag des zweiten Monats nach dem Auszug aus Ägypten. Der Name bedeutet „große Bäume“ oder „Terebinthen“; spätere Leser machten die zwölf Quellen zu den Stämmen und die siebzig Palmen zu den Ältesten."
    - "Wo es lag, hängt von der Route des Exodus ab, die umstritten ist, und die Karte hält die Kandidaten fest. Auf der üblichen Südroute an der Westküste der Sinai-Halbinsel entlang ist die gängige Wahl das Wadi Gharandal, etwa 90 km südöstlich von Suez, wo Quellen, Tamarisken und Palmen noch immer die erste wirkliche Oase südlich der Ebene von Suez bilden; Edward Robinson fand diese Gleichsetzung 1838 schon allgemein anerkannt vor, und die meisten Atlanten folgen ihr. Andere nennen Uyun Musa, die Mosesquellen unmittelbar südlich von Suez, manchmal für Mara gehalten; die byzantinische Überlieferung setzte Elim nach Raithou, der Palmenoase el-Tor weit unten an der Küste. Wer Israel durch den Norden der Halbinsel ziehen lässt, sucht wieder anderswo. Nichts lässt sich ausgraben, um es zu entscheiden: Eine Oase hinterlässt keine Mauern."
    - "Das Wadi Gharandal ist heute eine Station an der Straße Suez–Scharm el-Scheich im ägyptischen Gouvernement Südsinai, ein grüner Streifen aus Palmen und Schilf zwischen der Wüste und dem Golf von Suez."
  fr:
    - "Élim était l’oasis où Israël se reposa après la traversée de la mer et les eaux amères de Mara : « Ils arrivèrent à Élim, où il y avait douze sources d’eau et soixante-dix palmiers. Ils campèrent là, près de l’eau ». L’itinéraire des Nombres répète les douze sources et les soixante-dix palmiers, et ajoute que d’Élim ils « campèrent près de la mer Rouge » avant d’entrer dans le désert de Sin, « qui est entre Élim et Sinaï », le quinzième jour du deuxième mois après la sortie d’Égypte. Le nom signifie « grands arbres » ou « térébinthes » ; des lecteurs ultérieurs firent des douze sources les tribus et des soixante-dix palmiers les anciens."
    - "Son emplacement dépend de l’itinéraire de l’exode, qui est débattu, et la carte garde les candidats. Sur l’itinéraire méridional habituel, le long de la côte ouest de la péninsule du Sinaï, le choix courant est le Wadi Gharandal, à environ 90 km au sud-est de Suez, où sources, tamaris et palmiers forment encore la première vraie oasis au sud de la plaine de Suez ; Edward Robinson trouva cette identification déjà admise en 1838, et la plupart des atlas la suivent. D’autres nomment Uyun Musa, les Sources de Moïse juste au sud de Suez, parfois tenues pour Mara ; la tradition byzantine plaçait Élim à Raïthou, l’oasis de palmiers d’el-Tor, loin sur la côte. Ceux qui font traverser à Israël le nord de la péninsule cherchent encore ailleurs. Rien ne peut être exhumé pour trancher : une oasis ne laisse pas de murs."
    - "Le Wadi Gharandal est aujourd’hui une halte de la route Suez–Charm el-Cheikh, dans le gouvernorat du Sud-Sinaï, en Égypte, bande verte de palmiers et de roseaux entre le désert et le golfe de Suez."
  it:
    - "Elim era l’oasi dove Israele si riposò dopo il passaggio del mare e l’acqua amara di Mara: «giunsero ad Elim, dov’erano dodici sorgenti d’acqua e settanta palme; e si accamparono quivi presso le acque». L’itinerario di Numeri ripete le dodici sorgenti e le settanta palme, e aggiunge che da Elim «si accamparono presso il mar Rosso» prima di entrare nel deserto di Sin, «ch’è fra Elim e Sinai», il quindicesimo giorno del secondo mese dopo la partenza dall’Egitto. Il nome significa «grandi alberi» o «terebinti»; lettori posteriori fecero delle dodici sorgenti le tribù e delle settanta palme gli anziani."
    - "Dove si trovasse dipende dal percorso dell’esodo, che è controverso, e la mappa conserva i candidati. Sul consueto percorso meridionale lungo la costa occidentale della penisola del Sinai, la scelta corrente è il Wadi Gharandal, a circa 90 km a sud-est di Suez, dove sorgenti, tamerici e palme formano ancora la prima vera oasi a sud della piana di Suez; Edward Robinson trovò questa identificazione già accolta nel 1838, e la maggior parte degli atlanti la segue. Altri indicano Uyun Musa, le Sorgenti di Mosè poco a sud di Suez, a volte ritenute Mara; la tradizione bizantina pose Elim a Raithou, l’oasi di palme di el-Tor molto più giù lungo la costa. Chi fa attraversare a Israele il nord della penisola cerca altrove ancora. Nulla si può scavare per decidere: un’oasi non lascia muri."
    - "Il Wadi Gharandal è oggi una tappa della strada Suez–Sharm el-Sheikh nel governatorato egiziano del Sinai meridionale, una striscia verde di palme e canne fra il deserto e il Golfo di Suez."
  pl:
    - "Elim było oazą, gdzie Izrael odpoczął po przejściu morza i gorzkiej wodzie Mara: „I przyszli do Elim, gdzie było dwanaście źródeł wód, i siedmdziesiąt palm; i położyli się tam obozem nad wodami”. Wykaz w Księdze Liczb powtarza dwanaście źródeł i siedemdziesiąt palm i dodaje, że z Elim „położyli się obozem nad morzem czerwonem” przed wejściem na pustynię Sin, „która leży między Elim i między Synaj”, piętnastego dnia drugiego miesiąca po wyjściu z Egiptu. Nazwa znaczy „wielkie drzewa” lub „terebinty”; późniejsi czytelnicy uczynili z dwunastu źródeł pokolenia, a z siedemdziesięciu palm starszych."
    - "Gdzie leżało, zależy od trasy wyjścia, która jest sporna, a mapa zachowuje kandydatów. Na zwykłej trasie południowej wzdłuż zachodniego wybrzeża półwyspu Synaj najczęściej wybiera się Wadi Gharandal, około 90 km na południowy wschód od Suezu, gdzie źródła, tamaryszki i palmy wciąż tworzą pierwszą prawdziwą oazę na południe od równiny sueskiej; Edward Robinson zastał tę identyfikację w 1838 r. już powszechnie przyjętą, a większość atlasów się jej trzyma. Inni wskazują Ujun Musa, Źródła Mojżesza na południe od Suezu, czasem brane za Mara; tradycja bizantyjska umieszczała Elim w Rajtu, oazie palmowej el-Tor daleko na wybrzeżu. Ci, którzy prowadzą Izraela przez północ półwyspu, szukają jeszcze gdzie indziej. Nie da się niczego wykopać, by to rozstrzygnąć: oaza nie zostawia murów."
    - "Wadi Gharandal jest dziś przystankiem na drodze Sues–Szarm el-Szejk w egipskiej muhafazie Synaj Południowy, zielonym pasem palm i trzcin między pustynią a Zatoką Sueską."
  nl:
    - "Elim was de oase waar Israël rustte na de doortocht door de zee en het bittere water van Mara: “Toen kwamen zij te Elim, en daar waren twaalf waterfonteinen, en zeventig palmbomen; en zij legerden zich aldaar aan de wateren”. Het reisverhaal in Numeri herhaalt de twaalf bronnen en zeventig palmen en voegt toe: “En zij verreisden van Elim, en legerden zich aan de Schelfzee”, voordat zij de woestijn Sin binnentrokken, “welke is tussen Elim en tussen Sinai”, op de vijftiende dag van de tweede maand na het vertrek uit Egypte. De naam betekent “grote bomen” of “terebinten”; latere lezers maakten van de twaalf bronnen de stammen en van de zeventig palmen de oudsten."
    - "Waar het lag, hangt af van de route van de uittocht, die omstreden is, en de kaart houdt de kandidaten aan. Op de gebruikelijke zuidelijke route langs de westkust van het Sinaïschiereiland is de gangbare keuze de Wadi Gharandal, zo'n 90 km ten zuidoosten van Suez, waar bronnen, tamarisken en palmen nog steeds de eerste echte oase ten zuiden van de vlakte van Suez vormen; Edward Robinson trof die identificatie in 1838 al als algemeen aanvaard aan, en de meeste atlassen volgen haar. Anderen noemen Uyun Musa, de Bronnen van Mozes net ten zuiden van Suez, soms voor Mara gehouden; de Byzantijnse overlevering plaatste Elim bij Raithou, de palmoase el-Tor ver langs de kust. Wie Israël over het noorden van het schiereiland laat trekken, zoekt weer elders. Opgraven kan het niet beslissen: een oase laat geen muren na."
    - "De Wadi Gharandal is nu een halte aan de weg Suez–Sharm el-Sheikh in het Egyptische gouvernement Zuid-Sinaï, een groene strook palmen en riet tussen de woestijn en de Golf van Suez."
  cs:
    - "Élim byla oáza, kde Izrael odpočíval po přechodu moře a hořké vodě v Máře: „I přišli do Elim, kdež bylo dvanácte studnic vod a sedmdesáte palm; i rozbili tu stany při vodách“. Itinerář v Numeri opakuje dvanáct pramenů a sedmdesát palem a dodává, že z Élimu „položili se u moře Rudého“, než vstoupili na poušť Sín, „kteráž jest mezi Elim a Sinai“, patnáctého dne druhého měsíce po odchodu z Egypta. Jméno znamená „velké stromy“ nebo „terebinty“; pozdější čtenáři učinili z dvanácti pramenů kmeny a ze sedmdesáti palem starší."
    - "Kde ležela, závisí na trase exodu, která je sporná, a mapa uchovává kandidáty. Na obvyklé jižní trase dolů západním pobřežím Sinajského poloostrova se nejčastěji volí Wadi Gharandal, asi 90 km jihovýchodně od Suezu, kde prameny, tamaryšky a palmy dosud tvoří první skutečnou oázu jižně od suezské pláně; Edward Robinson zastihl toto ztotožnění roku 1838 už jako obecně přijímané a většina atlasů se ho drží. Jiní jmenují Uyun Musa, Mojžíšovy prameny hned jižně od Suezu, někdy pokládané za Máru; byzantská tradice kladla Élim do Raithu, palmové oázy el-Tor daleko na pobřeží. Ti, kdo vedou Izrael přes sever poloostrova, hledají zase jinde. Nic nelze vykopat, aby se to rozhodlo: oáza po sobě nezanechává zdi."
    - "Wadi Gharandal je dnes zastávkou na silnici Suez–Šarm aš-Šajch v egyptském guvernorátu Jižní Sinaj, zelený pás palem a rákosí mezi pouští a Suezským zálivem."
scripture:
