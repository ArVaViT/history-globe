body:
  en:
    - "Elim was the oasis where Israel rested after the crossing of the sea and the bitter water of Marah: “they came to Elim, where were twelve wells of water, and threescore and ten palm trees: and they encamped there by the waters”. The itinerary in Numbers repeats the twelve springs and seventy palms, and adds that from Elim they “encamped by the Red sea” before entering the wilderness of Sin, “which is between Elim and Sinai”, on the fifteenth day of the second month after leaving Egypt. The name means “great trees” or “terebinths”; later readers made the twelve springs the tribes and the seventy palms the elders."
    - "Where it lay depends on the route of the exodus, which is disputed, and the map keeps the candidates. On the usual southern route down the west coast of the Sinai peninsula, most choose Wadi Gharandal, about 90 km south-east of Suez, where springs, tamarisks and palms still make the first real oasis south of the Suez plain; Edward Robinson found it already so regarded in 1838, and atlases generally follow it. Others name Uyun Musa, the Springs of Moses just south of Suez, sometimes taken for Marah; Byzantine tradition set Elim at Raithou, the palm oasis of el-Tor far down the coast; and Wadi ar-Raynah has also been proposed. Those who take Israel across the north of the peninsula look elsewhere again. Nothing can be dug up to decide it: an oasis leaves no walls."
    - "Wadi Gharandal today is a stop on the Suez–Sharm el-Sheikh road in Egypt's South Sinai governorate, a green strip of palms and reeds between the desert and the Gulf of Suez."
  ru:
    - "Елим — оазис, где Израиль отдохнул после перехода через море и горькой воды Мерры: «И пришли в Елим; там было двенадцать источников воды и семьдесят финиковых дерев, и расположились там станом при водах». Перечень станов в книге Чисел повторяет двенадцать источников и семьдесят пальм и прибавляет, что из Елима они «расположились станом у Чермного моря», прежде чем войти в пустыню Син, «что между Елимом и между Синаем», в пятнадцатый день второго месяца по выходе из Египта. Имя значит «большие деревья» или «теревинфы»; позднейшие читатели видели в двенадцати источниках колена, а в семидесяти пальмах — старейшин."
    - "Где он лежал, зависит от пути исхода, который спорен, и карта хранит кандидатов. На обычном южном пути вдоль западного берега Синайского полуострова чаще всего называют Вади-Гарандаль, примерно в 90 км к юго-востоку от Суэца, где источники, тамариски и пальмы до сих пор образуют первый настоящий оазис к югу от Суэцкой равнины; Эдвард Робинсон в 1838 году застал это мнение уже общепринятым, и большинство атласов следуют ему. Другие называют Уюн-Муса, Источники Моисея сразу к югу от Суэца, которые иногда принимают за Мерру; византийское предание помещало Елим в Раифу, пальмовый оазис Эт-Тура далеко вниз по берегу; предлагали и Вади-ар-Райну. Те, кто ведёт Израиль через север полуострова, ищут снова в другом месте. Раскопки тут ничего не решат: оазис не оставляет стен."
    - "Вади-Гарандаль сегодня — остановка на дороге Суэц — Шарм-эш-Шейх в египетской мухафазе Южный Синай, зелёная полоса пальм и тростника между пустыней и Суэцким заливом."
  uk:
    - "Елім був оазисом, де Ізраїль відпочивав після переходу через море і гіркої води Мерри: вони прийшли до Еліма, де було дванадцять джерел води і сімдесят пальм, і отаборилися там біля води. Перелік у Книзі Чисел повторює дванадцять джерел і сімдесят пальм: «знайшли дванайцять криниць і сїмдесять пальмових дерев», і додає, що з Еліма вони «отаборились над Червоним морем», перш ніж вступити в пустелю Сін, «що між Єлимом і Синайом», на п'ятнадцятий день другого місяця по виході з Єгипту. Назва означає «великі дерева» або «теревінти»; пізніші читачі зробили дванадцять джерел племенами, а сімдесят пальм — старійшинами."
    - "Де він лежав, залежить від маршруту виходу, який є спірним, і мапа зберігає кандидатів. На звичайному південному маршруті вниз західним узбережжям Синайського півострова найчастіше називають ваді Гарандаль, приблизно за 90 км на південний схід від Суеца, де джерела, тамариски й пальми й досі творять перший справжній оазис на південь від Суецької рівнини; Едвард Робінсон у 1838 р. застав цю думку вже загальноприйнятою, і більшість атласів дотримується її. Інші називають Уйюн-Муса, Джерела Мойсея просто на південь від Суеца, іноді вважані за Мерру; візантійська традиція ставила Елім у Раіфі, пальмовому оазисі ет-Тур далеко вниз узбережжям; пропонували також ваді ар-Райна. Ті, хто веде Ізраїль через північ півострова, шукають знову деінде. Нічого не можна викопати, щоб це вирішити: оазис не лишає мурів."
    - "Ваді Гарандаль сьогодні — зупинка на шосе Суец — Шарм-еш-Шейх у провінції Південний Синай Єгипту, зелена смуга пальм і очерету між пустелею та Суецькою затокою."
  es:
    - "Elim era el oasis donde descansó Israel tras el cruce del mar y el agua amarga de Mara: «llegaron á Elim, donde había doce fuentes de aguas, y setenta palmas; y asentaron allí junto á las aguas». El itinerario de Números repite las doce fuentes y las setenta palmeras, y añade que desde Elim «asentaron junto al mar Bermejo» antes de entrar en el desierto de Sin, «que está entre Elim y Sinaí», el día quince del segundo mes después de salir de Egipto. El nombre significa «grandes árboles» o «terebintos»; lectores posteriores hicieron de las doce fuentes las tribus y de las setenta palmeras los ancianos."
    - "Dónde estaba depende de la ruta del éxodo, que se debate, y el mapa conserva los candidatos. En la ruta meridional habitual, por la costa occidental de la península del Sinaí, se suele elegir el uadi Gharandal, a unos 90 km al sudeste de Suez, donde fuentes, tarayes y palmeras siguen formando el primer oasis verdadero al sur de la llanura de Suez; Edward Robinson halló en 1838 que ya se lo tenía por Elim, y la mayoría de los atlas siguen esa identificación. Otros nombran Uyun Musa, las Fuentes de Moisés, justo al sur de Suez, a veces tomadas por Mara; la tradición bizantina situó Elim en Raitu, el oasis de palmeras de el-Tor, mucho más abajo en la costa; y también se ha propuesto el uadi ar-Raynah. Quienes hacen cruzar a Israel por el norte de la península buscan en otro lugar. Nada puede desenterrarse para decidirlo: un oasis no deja muros."
    - "El uadi Gharandal es hoy una parada en la carretera Suez–Sharm el-Sheikh, en la gobernación egipcia del Sinaí Meridional, una franja verde de palmeras y cañas entre el desierto y el golfo de Suez."
  pt:
    - "Elim era o oásis onde Israel descansou depois da travessia do mar e da água amarga de Mara: “Eles chegaram a Elim, onde havia doze fontes de água e setenta palmeiras. Eles acamparam ali junto às águas”. O itinerário de Números repete as doze fontes e as setenta palmeiras e acrescenta que, de Elim, “acamparam junto ao Mar Vermelho”, antes de entrar no deserto de Sim, “que fica entre Elim e Sinai”, no décimo quinto dia do segundo mês depois da saída do Egito. O nome significa “grandes árvores” ou “terebintos”; leitores posteriores fizeram das doze fontes as tribos e das setenta palmeiras os anciãos."
    - "Onde ficava depende da rota do êxodo, que é disputada, e o mapa conserva os candidatos. Na rota meridional habitual, descendo pela costa oeste da península do Sinai, a escolha corrente é o uádi Gharandal, a cerca de 90 km a sudeste de Suez, onde fontes, tamargueiras e palmeiras ainda formam o primeiro oásis verdadeiro ao sul da planície de Suez; Edward Robinson encontrou-o já tido por Elim em 1838, e a maioria dos atlas segue essa identificação. Outros apontam Uyun Musa, as Fontes de Moisés logo ao sul de Suez, às vezes tomadas por Mara; a tradição bizantina pôs Elim em Raitu, o oásis de palmeiras de el-Tor, bem adiante na costa; e o uádi ar-Raynah também foi proposto. Os que fazem Israel atravessar o norte da península procuram em outro lugar ainda. Nada se pode escavar para decidir: um oásis não deixa muros."
    - "O uádi Gharandal é hoje uma parada na estrada Suez–Sharm el-Sheikh, na província egípcia do Sinai do Sul, uma faixa verde de palmeiras e juncos entre o deserto e o Golfo de Suez."
  de:
    - "Elim war die Oase, in der Israel nach der Durchquerung des Meeres und dem bitteren Wasser von Mara rastete: „Und sie kamen gen Elim, da waren zwölf Wasserbrunnen und siebzig Palmbäume, und sie lagerten sich daselbst ans Wasser.“ Das Verzeichnis im Buch Numeri wiederholt die zwölf Quellen und siebzig Palmen und fügt hinzu: „Von Elim zogen sie aus und lagerten sich an das Schilfmeer“, ehe sie in die Wüste Sin kamen, „die da liegt zwischen Elim und Sinai“, am fünfzehnten Tag des zweiten Monats nach dem Auszug aus Ägypten. Der Name bedeutet „große Bäume“ oder „Terebinthen“; spätere Leser machten die zwölf Quellen zu den Stämmen und die siebzig Palmen zu den Ältesten."
    - "Wo es lag, hängt von der Route des Exodus ab, die umstritten ist, und die Karte hält die Kandidaten fest. Auf der üblichen Südroute an der Westküste der Sinai-Halbinsel entlang ist die gängige Wahl das Wadi Gharandal, etwa 90 km südöstlich von Suez, wo Quellen, Tamarisken und Palmen noch immer die erste wirkliche Oase südlich der Ebene von Suez bilden; Edward Robinson fand diese Gleichsetzung 1838 schon allgemein anerkannt vor, und die meisten Atlanten folgen ihr. Andere nennen Uyun Musa, die Mosesquellen unmittelbar südlich von Suez, manchmal für Mara gehalten; die byzantinische Überlieferung setzte Elim nach Raithou, der Palmenoase el-Tor weit unten an der Küste; auch das Wadi ar-Raynah wurde vorgeschlagen. Wer Israel durch den Norden der Halbinsel ziehen lässt, sucht wieder anderswo. Nichts lässt sich ausgraben, um es zu entscheiden: Eine Oase hinterlässt keine Mauern."
    - "Das Wadi Gharandal ist heute eine Station an der Straße Suez–Scharm el-Scheich im ägyptischen Gouvernement Südsinai, ein grüner Streifen aus Palmen und Schilf zwischen der Wüste und dem Golf von Suez."
  fr:
    - "Élim était l’oasis où Israël se reposa après la traversée de la mer et les eaux amères de Mara : « Ils arrivèrent à Élim, où il y avait douze sources d’eau et soixante-dix palmiers. Ils campèrent là, près de l’eau ». L’itinéraire des Nombres répète les douze sources et les soixante-dix palmiers, et ajoute que d’Élim ils « campèrent près de la mer Rouge » avant d’entrer dans le désert de Sin, « qui est entre Élim et Sinaï », le quinzième jour du deuxième mois après la sortie d’Égypte. Le nom signifie « grands arbres » ou « térébinthes » ; des lecteurs ultérieurs firent des douze sources les tribus et des soixante-dix palmiers les anciens."
    - "Son emplacement dépend de l’itinéraire de l’exode, qui est débattu, et la carte garde les candidats. Sur l’itinéraire méridional habituel, le long de la côte ouest de la péninsule du Sinaï, le choix courant est le Wadi Gharandal, à environ 90 km au sud-est de Suez, où sources, tamaris et palmiers forment encore la première vraie oasis au sud de la plaine de Suez ; Edward Robinson trouva cette identification déjà admise en 1838, et la plupart des atlas la suivent. D’autres nomment Uyun Musa, les Sources de Moïse juste au sud de Suez, parfois tenues pour Mara ; la tradition byzantine plaçait Élim à Raïthou, l’oasis de palmiers d’el-Tor, loin sur la côte ; et le Wadi ar-Raynah a aussi été proposé. Ceux qui font traverser à Israël le nord de la péninsule cherchent encore ailleurs. Rien ne peut être exhumé pour trancher : une oasis ne laisse pas de murs."
    - "Le Wadi Gharandal est aujourd’hui une halte de la route Suez–Charm el-Cheikh, dans le gouvernorat du Sud-Sinaï, en Égypte, bande verte de palmiers et de roseaux entre le désert et le golfe de Suez."
  it:
    - "Elim era l’oasi dove Israele si riposò dopo il passaggio del mare e l’acqua amara di Mara: «giunsero ad Elim, dov’erano dodici sorgenti d’acqua e settanta palme; e si accamparono quivi presso le acque». L’itinerario di Numeri ripete le dodici sorgenti e le settanta palme, e aggiunge che da Elim «si accamparono presso il mar Rosso» prima di entrare nel deserto di Sin, «ch’è fra Elim e Sinai», il quindicesimo giorno del secondo mese dopo la partenza dall’Egitto. Il nome significa «grandi alberi» o «terebinti»; lettori posteriori fecero delle dodici sorgenti le tribù e delle settanta palme gli anziani."
    - "Dove si trovasse dipende dal percorso dell’esodo, che è controverso, e la mappa conserva i candidati. Sul consueto percorso meridionale lungo la costa occidentale della penisola del Sinai, la scelta corrente è il Wadi Gharandal, a circa 90 km a sud-est di Suez, dove sorgenti, tamerici e palme formano ancora la prima vera oasi a sud della piana di Suez; Edward Robinson trovò questa identificazione già accolta nel 1838, e la maggior parte degli atlanti la segue. Altri indicano Uyun Musa, le Sorgenti di Mosè poco a sud di Suez, a volte ritenute Mara; la tradizione bizantina pose Elim a Raithou, l’oasi di palme di el-Tor molto più giù lungo la costa; è stato proposto anche il Wadi ar-Raynah. Chi fa attraversare a Israele il nord della penisola cerca altrove ancora. Nulla si può scavare per decidere: un’oasi non lascia muri."
    - "Il Wadi Gharandal è oggi una tappa della strada Suez–Sharm el-Sheikh nel governatorato egiziano del Sinai meridionale, una striscia verde di palme e canne fra il deserto e il Golfo di Suez."
  pl:
    - "Elim było oazą, gdzie Izrael odpoczął po przejściu morza i gorzkiej wodzie Mara: „I przyszli do Elim, gdzie było dwanaście źródeł wód, i siedmdziesiąt palm; i położyli się tam obozem nad wodami”. Wykaz w Księdze Liczb powtarza dwanaście źródeł i siedemdziesiąt palm i dodaje, że z Elim „położyli się obozem nad morzem czerwonem” przed wejściem na pustynię Sin, „która leży między Elim i między Synaj”, piętnastego dnia drugiego miesiąca po wyjściu z Egiptu. Nazwa znaczy „wielkie drzewa” lub „terebinty”; późniejsi czytelnicy uczynili z dwunastu źródeł pokolenia, a z siedemdziesięciu palm starszych."
    - "Gdzie leżało, zależy od trasy wyjścia, która jest sporna, a mapa zachowuje kandydatów. Na zwykłej trasie południowej wzdłuż zachodniego wybrzeża półwyspu Synaj najczęściej wybiera się Wadi Gharandal, około 90 km na południowy wschód od Suezu, gdzie źródła, tamaryszki i palmy wciąż tworzą pierwszą prawdziwą oazę na południe od równiny sueskiej; Edward Robinson zastał tę identyfikację w 1838 r. już powszechnie przyjętą, a większość atlasów się jej trzyma. Inni wskazują Ujun Musa, Źródła Mojżesza na południe od Suezu, czasem brane za Mara; tradycja bizantyjska umieszczała Elim w Rajtu, oazie palmowej el-Tor daleko na wybrzeżu; proponowano też Wadi ar-Rajna. Ci, którzy prowadzą Izraela przez północ półwyspu, szukają jeszcze gdzie indziej. Nie da się niczego wykopać, by to rozstrzygnąć: oaza nie zostawia murów."
    - "Wadi Gharandal jest dziś przystankiem na drodze Sues–Szarm el-Szejk w egipskiej muhafazie Synaj Południowy, zielonym pasem palm i trzcin między pustynią a Zatoką Sueską."
  nl:
    - "Elim was de oase waar Israël rustte na de doortocht door de zee en het bittere water van Mara: “Toen kwamen zij te Elim, en daar waren twaalf waterfonteinen, en zeventig palmbomen; en zij legerden zich aldaar aan de wateren”. Het reisverhaal in Numeri herhaalt de twaalf bronnen en zeventig palmen en voegt toe: “En zij verreisden van Elim, en legerden zich aan de Schelfzee”, voordat zij de woestijn Sin binnentrokken, “welke is tussen Elim en tussen Sinai”, op de vijftiende dag van de tweede maand na het vertrek uit Egypte. De naam betekent “grote bomen” of “terebinten”; latere lezers maakten van de twaalf bronnen de stammen en van de zeventig palmen de oudsten."
    - "Waar het lag, hangt af van de route van de uittocht, die omstreden is, en de kaart houdt de kandidaten aan. Op de gebruikelijke zuidelijke route langs de westkust van het Sinaïschiereiland is de gangbare keuze de Wadi Gharandal, zo'n 90 km ten zuidoosten van Suez, waar bronnen, tamarisken en palmen nog steeds de eerste echte oase ten zuiden van de vlakte van Suez vormen; Edward Robinson trof die identificatie in 1838 al als algemeen aanvaard aan, en de meeste atlassen volgen haar. Anderen noemen Uyun Musa, de Bronnen van Mozes net ten zuiden van Suez, soms voor Mara gehouden; de Byzantijnse overlevering plaatste Elim bij Raithou, de palmoase el-Tor ver langs de kust; en ook de Wadi ar-Raynah is voorgesteld. Wie Israël over het noorden van het schiereiland laat trekken, zoekt weer elders. Opgraven kan het niet beslissen: een oase laat geen muren na."
    - "De Wadi Gharandal is nu een halte aan de weg Suez–Sharm el-Sheikh in het Egyptische gouvernement Zuid-Sinaï, een groene strook palmen en riet tussen de woestijn en de Golf van Suez."
  cs:
    - "Élim byla oáza, kde Izrael odpočíval po přechodu moře a hořké vodě v Máře: „I přišli do Elim, kdež bylo dvanácte studnic vod a sedmdesáte palm; i rozbili tu stany při vodách“. Itinerář v Numeri opakuje dvanáct pramenů a sedmdesát palem a dodává, že z Élimu „položili se u moře Rudého“, než vstoupili na poušť Sín, „kteráž jest mezi Elim a Sinai“, patnáctého dne druhého měsíce po odchodu z Egypta. Jméno znamená „velké stromy“ nebo „terebinty“; pozdější čtenáři učinili z dvanácti pramenů kmeny a ze sedmdesáti palem starší."
    - "Kde ležela, závisí na trase exodu, která je sporná, a mapa uchovává kandidáty. Na obvyklé jižní trase dolů západním pobřežím Sinajského poloostrova se nejčastěji volí Wadi Gharandal, asi 90 km jihovýchodně od Suezu, kde prameny, tamaryšky a palmy dosud tvoří první skutečnou oázu jižně od suezské pláně; Edward Robinson zastihl toto ztotožnění roku 1838 už jako obecně přijímané a většina atlasů se ho drží. Jiní jmenují Uyun Musa, Mojžíšovy prameny hned jižně od Suezu, někdy pokládané za Máru; byzantská tradice kladla Élim do Raithu, palmové oázy el-Tor daleko na pobřeží; navrhována byla také Wadi ar-Raynah. Ti, kdo vedou Izrael přes sever poloostrova, hledají zase jinde. Nic nelze vykopat, aby se to rozhodlo: oáza po sobě nezanechává zdi."
    - "Wadi Gharandal je dnes zastávkou na silnici Suez–Šarm aš-Šajch v egyptském guvernorátu Jižní Sinaj, zelený pás palem a rákosí mezi pouští a Suezským zálivem."
  sv:
    - "Elim var oasen där Israel vilade efter övergången över havet och det bittra vattnet i Mara: ”Sedan kommo de till Elim; där funnos tolv vattenkällor och sjuttio palmträd. Och de lägrade sig där vid vattnet.” Marschrutten i Fjärde Mosebok upprepar de tolv källorna och sjuttio palmerna och tillägger att de från Elim ”lägrade sig vid Röda havet” innan de kom in i Sins öken, ”mellan Elim och Sinai”, på femtonde dagen i andra månaden efter uttåget ur Egypten. Namnet betyder ”stora träd” eller ”terebinter”; senare läsare gjorde de tolv källorna till stammarna och de sjuttio palmerna till de äldste."
    - "Var den låg beror på uttågets väg, som är omtvistad, och kartan behåller kandidaterna. På den vanliga södra vägen ner längs Sinaihalvöns västkust väljer de flesta Wadi Gharandal, omkring 90 km sydost om Suez, där källor, tamarisker och palmer fortfarande utgör den första verkliga oasen söder om Suezslätten; Edward Robinson fann den redan 1838 betraktad så, och atlaserna följer den i allmänhet. Andra nämner Uyun Musa, Moses källor strax söder om Suez, ibland ansedda som Mara; den bysantinska traditionen förlade Elim till Raithou, palmoasen el-Tor långt ner längs kusten; och Wadi ar-Raynah har också föreslagits. De som låter Israel korsa halvöns norra del söker åter någon annanstans. Ingenting kan grävas fram för att avgöra det: en oas lämnar inga murar."
    - "Wadi Gharandal är i dag ett stopp på vägen Suez–Sharm el-Sheikh i Egyptens guvernement Södra Sinai, en grön remsa av palmer och vass mellan öknen och Suezviken."
  nb:
    - "Elim var oasen der Israel hvilte etter overgangen av havet og det bitre vannet i Mara: «Så kom de til Elim; der var tolv vannkilder og sytti palmetrær; og de slo leir der ved vannet.» Reiseruten i 4. Mosebok gjentar de tolv kildene og de sytti palmene, og legger til at de fra Elim «leiret sig ved det Røde Hav» før de kom inn i ørkenen Sin, «som ligger mellem Elim og Sinai», på den femtende dagen i den andre måneden etter at de forlot Egypt. Navnet betyr «store trær» eller «terebinter»; senere lesere gjorde de tolv kildene til stammene og de sytti palmene til de eldste."
    - "Hvor den lå, avhenger av utferdens rute, som er omdiskutert, og kartet beholder kandidatene. På den vanlige sørlige ruten nedover vestkysten av Sinai-halvøya velger de fleste Wadi Gharandal, omtrent 90 km sørøst for Suez, hvor kilder, tamarisker og palmer fremdeles utgjør den første virkelige oasen sør for Suez-sletten; Edward Robinson fant den allerede regnet slik i 1838, og atlasene følger den gjerne. Andre peker på Uyun Musa, Moses' kilder like sør for Suez, noen ganger regnet for Mara; bysantinsk tradisjon satte Elim i Raithou, palmeoasen el-Tor langt nede langs kysten; og Wadi ar-Raynah er også foreslått. De som lar Israel krysse nord på halvøya, ser et annet sted igjen. Ingenting kan graves frem for å avgjøre det: en oase etterlater ingen murer."
    - "Wadi Gharandal er i dag et stopp på veien Suez–Sharm el-Sheikh i Egypts guvernement Sør-Sinai, en grønn stripe av palmer og siv mellom ørkenen og Suezbukta."
  tl:
    - "Ang Elim ay ang oasis kung saan nagpahinga ang Israel pagkatawid sa dagat at pagkatapos ng mapait na tubig ng Mara: “sila'y dumating sa Elim, na doo'y mayroong labingdalawang bukal ng tubig, at pitongpung puno ng palma; at sila'y humantong doon sa tabi ng mga tubig”. Inuulit ng itineraryo sa Mga Bilang ang labindalawang bukal at pitumpung palma, at idinadagdag na mula sa Elim ay “humantong sa tabi ng Dagat na Mapula” bago pumasok sa ilang ng Sin, “na nasa pagitan ng Elim at Sinai”, nang ikalabinlimang araw ng ikalawang buwan pagkaalis sa Egipto. Ang pangalan ay nangangahulugang “malalaking puno” o “terebinto”; ginawa ng mga huling mambabasa ang labindalawang bukal na mga lipi at ang pitumpung palma na mga matanda."
    - "Nakasalalay kung saan ito sa ruta ng exodo, na pinagtatalunan, at iniingatan ng mapa ang mga kandidato. Sa karaniwang timog na ruta pababa sa kanlurang baybayin ng tangway ng Sinai, karamihan ay pumipili sa Wadi Gharandal, mga 90 km sa timog-silangan ng Suez, kung saan ang mga bukal, tamarisko at palma ay bumubuo pa rin ng unang tunay na oasis sa timog ng kapatagan ng Suez; nakita ni Edward Robinson noong 1838 na gayon na ang pagtingin dito, at karaniwang sinusunod ito ng mga atlas. Ang iba ay nagpapangalan sa Uyun Musa, ang Mga Bukal ni Moises sa timog lamang ng Suez, na minsan ay itinuturing na Mara; inilagay ng tradisyong Bizantino ang Elim sa Raithou, ang oasis ng palma ng el-Tor sa malayong baybayin; at iminungkahi rin ang Wadi ar-Raynah. Ang naglalagay sa Israel sa hilaga ng tangway ay naghahanap sa iba. Walang mahuhukay: walang iniiwang pader ang oasis."
    - "Ang Wadi Gharandal ay hintuan ngayon sa daang Suez–Sharm el-Sheikh sa gobernadurya ng Timog Sinai ng Egipto, isang luntiang guhit ng palma at tambo sa pagitan ng disyerto at ng Golpo ng Suez."
  da:
    - "Elim var oasen, hvor Israel hvilede efter overgangen af havet og det bitre vand ved Mara: »de kom til Elim, og der var tolv Vandkilder og halvfjerdsindstyve Palmetræer; og der lejrede de sig ved Vandet«. Rejseberetningen i 4 Mosebog gentager de tolv kilder og halvfjerds palmer og tilføjer, at de fra Elim »lejrede sig ved det røde Hav«, før de kom ind i Sin-ørkenen, »som er imellem Elim og imellem Sinai«, på den femtende dag i den anden måned efter udgangen af Egypten. Navnet betyder »store træer« eller »terebinter«; senere læsere gjorde de tolv kilder til stammerne og de halvfjerds palmer til de ældste."
    - "Hvor den lå, afhænger af udtogets rute, som er omstridt, og kortet beholder kandidaterne. På den sædvanlige sydlige rute ned langs Sinai-halvøens vestkyst vælger de fleste Wadi Gharandal, cirka 90 km sydøst for Suez, hvor kilder, tamarisker og palmer stadig udgør den første egentlige oase syd for Suez-sletten; Edward Robinson fandt den allerede anset sådan i 1838, og atlas følger den generelt. Andre nævner Uyun Musa, Moses' kilder lige syd for Suez, undertiden anset for Mara; byzantinsk tradition satte Elim ved Raithou, palmeoasen el-Tor langt nede ad kysten; og Wadi ar-Raynah er også blevet foreslået. De, der lader Israel krydse halvøens nordlige del, søger igen andre steder. Intet kan graves frem til at afgøre det: En oase efterlader ingen mure."
    - "I dag er Wadi Gharandal et stop på vejen Suez–Sharm el-Sheikh i Egyptens guvernement Sydsinai, en grøn strimmel af palmer og rør mellem ørkenen og Suez-bugten."
  sr:
    - "Елим је била оаза где је Израиљ починуо после преласка мора и горке воде Мере: „дођоше у Елим, где беше дванаест извора и седамдесет палми; и онде стадоше у логор код воде“. Путопис у Књизи Бројева понавља дванаест извора и седамдесет палми и додаје да су „из Елима отишавши стадоше у логор код Црвеног Мора“ пре уласка у пустињу Син, „која је између Елима и Синаја“, петнаестог дана другог месеца пошто су изашли из Египта. Име значи „велика стабла“ или „теребинти“; каснији читаоци учинили су дванаест извора племенима, а седамдесет палми старешинама."
    - "Где је лежао зависи од пута изласка, о коме се спори, а карта чува кандидате. На уобичајеном јужном путу низ западну обалу Синајског полуострва, већина бира Вади Гарандал, око 90 км југоисточно од Суеза, где извори, тамарикси и палме још увек чине прву праву оазу јужно од суецке равнице; Едвард Робинсон је 1838. нашао да се већ тако сматра, а атласи га углавном следе. Други именују Ујун Мусу, Мојсијеве изворе одмах јужно од Суеза, понекад схваћене као Мера; византијско предање је Елим поставило у Раиту, палмову оазу ел Тор далеко низ обалу; предложен је и Вади ер Рајна. Они који Израиља воде преко севера полуострва траже опет другде. Ништа се не може ископати да се одлучи: оаза не оставља зидове."
    - "Вади Гарандал је данас станица на путу Суец–Шарм ел Шеик у египатском гувернорату Јужни Синај, зелена трака палми и трске између пустиње и Суецког залива."
