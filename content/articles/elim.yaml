# Overview article (ADR 0007). Mainstream facts only; the location depends on the route of the exodus, itself disputed, and the map's candidates are given without choosing one.
id: elim
place: a2410c1
title:
  en: "Elim"
  ru: "Елим"
  uk: "Елім"
  es: "Elim"
  pt: "Elim"
  de: "Elim"
  fr: "Élim"
body:
  en:
    - "Elim was the oasis where Israel rested after the crossing of the sea and the bitter water of Marah: “they came to Elim, where were twelve wells of water, and threescore and ten palm trees: and they encamped there by the waters”. The itinerary in Numbers repeats the twelve springs and seventy palms, and adds that from Elim they “encamped by the Red sea” before entering the wilderness of Sin, “which is between Elim and Sinai”, on the fifteenth day of the second month after leaving Egypt. The name means “great trees” or “terebinths”; later readers made the twelve springs the tribes and the seventy palms the elders."
    - "Where it lay depends on the route of the exodus, which is disputed, and the map keeps the candidates. On the usual southern route down the west coast of the Sinai peninsula, Edward Robinson in 1838 chose Wadi Gharandal, about 90 km south-east of Suez, where springs, tamarisks and palms still make the first real oasis south of the Suez plain, and most atlases have followed him. Others name Uyun Musa, the Springs of Moses just south of Suez, sometimes taken for Marah; Byzantine tradition set Elim at Raithou, the palm oasis of el-Tor far down the coast; and Wadi ar-Raynah has also been proposed. Those who take Israel across the north of the peninsula look elsewhere again. Nothing can be dug up to decide it: an oasis leaves no walls."
    - "Wadi Gharandal today is a stop on the Suez–Sharm el-Sheikh road in Egypt's South Sinai governorate, a green strip of palms and reeds between the desert and the Gulf of Suez."
  ru:
    - "Елим — оазис, где Израиль отдохнул после перехода через море и горькой воды Мерры: «И пришли в Елим; там было двенадцать источников воды и семьдесят финиковых дерев, и расположились там станом при водах». Перечень станов в книге Чисел повторяет двенадцать источников и семьдесят пальм и прибавляет, что из Елима они «расположились станом у Чермного моря», прежде чем войти в пустыню Син, «что между Елимом и между Синаем», в пятнадцатый день второго месяца по выходе из Египта. Имя значит «большие деревья» или «теревинфы»; позднейшие читатели видели в двенадцати источниках колена, а в семидесяти пальмах — старейшин."
    - "Где он лежал, зависит от пути исхода, который спорен, и карта хранит кандидатов. На обычном южном пути вдоль западного берега Синайского полуострова Эдвард Робинсон в 1838 году выбрал Вади-Гарандаль, примерно в 90 км к юго-востоку от Суэца, где источники, тамариски и пальмы до сих пор образуют первый настоящий оазис к югу от Суэцкой равнины, и большинство атласов пошли за ним. Другие называют Уюн-Муса, Источники Моисея сразу к югу от Суэца, которые иногда принимают за Мерру; византийское предание помещало Елим в Раифу, пальмовый оазис Эт-Тура далеко вниз по берегу; предлагали и Вади-ар-Райну. Те, кто ведёт Израиль через север полуострова, ищут снова в другом месте. Раскопки тут ничего не решат: оазис не оставляет стен."
    - "Вади-Гарандаль сегодня — остановка на дороге Суэц — Шарм-эш-Шейх в египетской мухафазе Южный Синай, зелёная полоса пальм и тростника между пустыней и Суэцким заливом."
  uk:
    - "Елім був оазисом, де Ізраїль відпочивав після переходу через море і гіркої води Мерри: вони прийшли до Еліма, де було дванадцять джерел води і сімдесят пальм, і отаборилися там біля води. Перелік у Книзі Чисел повторює дванадцять джерел і сімдесят пальм: «знайшли дванайцять криниць і сїмдесять пальмових дерев», і додає, що з Еліма вони «отаборились над Червоним морем», перш ніж вступити в пустелю Сін, «що між Єлимом і Синайом», на п'ятнадцятий день другого місяця по виході з Єгипту. Назва означає «великі дерева» або «теревінти»; пізніші читачі зробили дванадцять джерел племенами, а сімдесят пальм — старійшинами."
    - "Де він лежав, залежить від маршруту виходу, який є спірним, і мапа зберігає кандидатів. На звичайному південному маршруті вниз західним узбережжям Синайського півострова Едвард Робінсон у 1838 р. обрав ваді Гарандаль, приблизно за 90 км на південний схід від Суеца, де джерела, тамариски й пальми й досі творять перший справжній оазис на південь від Суецької рівнини, і більшість атласів пішла за ним. Інші називають Уйюн-Муса, Джерела Мойсея просто на південь від Суеца, іноді вважані за Мерру; візантійська традиція ставила Елім у Раіфі, пальмовому оазисі ет-Тур далеко вниз узбережжям; пропонували також ваді ар-Райна. Ті, хто веде Ізраїль через північ півострова, шукають знову деінде. Нічого не можна викопати, щоб це вирішити: оазис не лишає мурів."
    - "Ваді Гарандаль сьогодні — зупинка на шосе Суец — Шарм-еш-Шейх у провінції Південний Синай Єгипту, зелена смуга пальм і очерету між пустелею та Суецькою затокою."
  es:
    - "Elim era el oasis donde descansó Israel tras el cruce del mar y el agua amarga de Mara: «llegaron á Elim, donde había doce fuentes de aguas, y setenta palmas; y asentaron allí junto á las aguas». El itinerario de Números repite las doce fuentes y las setenta palmeras, y añade que desde Elim «asentaron junto al mar Bermejo» antes de entrar en el desierto de Sin, «que está entre Elim y Sinaí», el día quince del segundo mes después de salir de Egipto. El nombre significa «grandes árboles» o «terebintos»; lectores posteriores hicieron de las doce fuentes las tribus y de las setenta palmeras los ancianos."
    - "Dónde estaba depende de la ruta del éxodo, que se debate, y el mapa conserva los candidatos. En la ruta meridional habitual, por la costa occidental de la península del Sinaí, Edward Robinson eligió en 1838 el uadi Gharandal, a unos 90 km al sudeste de Suez, donde fuentes, tarayes y palmeras siguen formando el primer oasis verdadero al sur de la llanura de Suez, y la mayoría de los atlas lo han seguido. Otros nombran Uyun Musa, las Fuentes de Moisés, justo al sur de Suez, a veces tomadas por Mara; la tradición bizantina situó Elim en Raitu, el oasis de palmeras de el-Tor, mucho más abajo en la costa; y también se ha propuesto el uadi ar-Raynah. Quienes hacen cruzar a Israel por el norte de la península buscan en otro lugar. Nada puede desenterrarse para decidirlo: un oasis no deja muros."
    - "El uadi Gharandal es hoy una parada en la carretera Suez–Sharm el-Sheikh, en la gobernación egipcia del Sinaí Meridional, una franja verde de palmeras y cañas entre el desierto y el golfo de Suez."
  pt:
    - "Elim era o oásis onde Israel descansou depois da travessia do mar e da água amarga de Mara: “Eles chegaram a Elim, onde havia doze fontes de água e setenta palmeiras. Eles acamparam ali junto às águas”. O itinerário de Números repete as doze fontes e as setenta palmeiras e acrescenta que, de Elim, “acamparam junto ao Mar Vermelho”, antes de entrar no deserto de Sim, “que fica entre Elim e Sinai”, no décimo quinto dia do segundo mês depois da saída do Egito. O nome significa “grandes árvores” ou “terebintos”; leitores posteriores fizeram das doze fontes as tribos e das setenta palmeiras os anciãos."
    - "Onde ficava depende da rota do êxodo, que é disputada, e o mapa conserva os candidatos. Na rota meridional habitual, descendo pela costa oeste da península do Sinai, Edward Robinson escolheu em 1838 o uádi Gharandal, a cerca de 90 km a sudeste de Suez, onde fontes, tamargueiras e palmeiras ainda formam o primeiro oásis verdadeiro ao sul da planície de Suez, e a maioria dos atlas o seguiu. Outros apontam Uyun Musa, as Fontes de Moisés logo ao sul de Suez, às vezes tomadas por Mara; a tradição bizantina pôs Elim em Raitu, o oásis de palmeiras de el-Tor, bem adiante na costa; e o uádi ar-Raynah também foi proposto. Os que fazem Israel atravessar o norte da península procuram em outro lugar ainda. Nada se pode escavar para decidir: um oásis não deixa muros."
    - "O uádi Gharandal é hoje uma parada na estrada Suez–Sharm el-Sheikh, na província egípcia do Sinai do Sul, uma faixa verde de palmeiras e juncos entre o deserto e o Golfo de Suez."
  de:
    - "Elim war die Oase, in der Israel nach der Durchquerung des Meeres und dem bitteren Wasser von Mara rastete: „Und sie kamen gen Elim, da waren zwölf Wasserbrunnen und siebzig Palmbäume, und sie lagerten sich daselbst ans Wasser.“ Das Verzeichnis im Buch Numeri wiederholt die zwölf Quellen und siebzig Palmen und fügt hinzu: „Von Elim zogen sie aus und lagerten sich an das Schilfmeer“, ehe sie in die Wüste Sin kamen, „die da liegt zwischen Elim und Sinai“, am fünfzehnten Tag des zweiten Monats nach dem Auszug aus Ägypten. Der Name bedeutet „große Bäume“ oder „Terebinthen“; spätere Leser machten die zwölf Quellen zu den Stämmen und die siebzig Palmen zu den Ältesten."
    - "Wo es lag, hängt von der Route des Exodus ab, die umstritten ist, und die Karte hält die Kandidaten fest. Auf der üblichen Südroute an der Westküste der Sinai-Halbinsel entlang wählte Edward Robinson 1838 das Wadi Gharandal, etwa 90 km südöstlich von Suez, wo Quellen, Tamarisken und Palmen noch immer die erste wirkliche Oase südlich der Ebene von Suez bilden, und die meisten Atlanten sind ihm gefolgt. Andere nennen Uyun Musa, die Mosesquellen unmittelbar südlich von Suez, manchmal für Mara gehalten; die byzantinische Überlieferung setzte Elim nach Raithou, der Palmenoase el-Tor weit unten an der Küste; auch das Wadi ar-Raynah wurde vorgeschlagen. Wer Israel durch den Norden der Halbinsel ziehen lässt, sucht wieder anderswo. Nichts lässt sich ausgraben, um es zu entscheiden: Eine Oase hinterlässt keine Mauern."
    - "Das Wadi Gharandal ist heute eine Station an der Straße Suez–Scharm el-Scheich im ägyptischen Gouvernement Südsinai, ein grüner Streifen aus Palmen und Schilf zwischen der Wüste und dem Golf von Suez."
  fr:
    - "Élim était l’oasis où Israël se reposa après la traversée de la mer et les eaux amères de Mara : « Ils arrivèrent à Élim, où il y avait douze sources d’eau et soixante-dix palmiers. Ils campèrent là, près de l’eau ». L’itinéraire des Nombres répète les douze sources et les soixante-dix palmiers, et ajoute que d’Élim ils « campèrent près de la mer Rouge » avant d’entrer dans le désert de Sin, « qui est entre Élim et Sinaï », le quinzième jour du deuxième mois après la sortie d’Égypte. Le nom signifie « grands arbres » ou « térébinthes » ; des lecteurs ultérieurs firent des douze sources les tribus et des soixante-dix palmiers les anciens."
    - "Son emplacement dépend de l’itinéraire de l’exode, qui est débattu, et la carte garde les candidats. Sur l’itinéraire méridional habituel, le long de la côte ouest de la péninsule du Sinaï, Edward Robinson choisit en 1838 le Wadi Gharandal, à environ 90 km au sud-est de Suez, où sources, tamaris et palmiers forment encore la première vraie oasis au sud de la plaine de Suez, et la plupart des atlas l’ont suivi. D’autres nomment Uyun Musa, les Sources de Moïse juste au sud de Suez, parfois tenues pour Mara ; la tradition byzantine plaçait Élim à Raïthou, l’oasis de palmiers d’el-Tor, loin sur la côte ; et le Wadi ar-Raynah a aussi été proposé. Ceux qui font traverser à Israël le nord de la péninsule cherchent encore ailleurs. Rien ne peut être exhumé pour trancher : une oasis ne laisse pas de murs."
    - "Le Wadi Gharandal est aujourd’hui une halte de la route Suez–Charm el-Cheikh, dans le gouvernorat du Sud-Sinaï, en Égypte, bande verte de palmiers et de roseaux entre le désert et le golfe de Suez."
