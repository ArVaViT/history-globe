# Overview article (ADR 0007). Mainstream facts only; Khirbet Zanu is the usual identification and the site is known from surveys alone; the second Zanoah in the hills is kept apart.
id: zanoah
place: a28f432
title:
  en: "Zanoah"
  ru: "Заноах"
body:
  en:
    - "Zanoah was a town of Judah in the lowland, listed with Eshtaol, Zorah, Jarmuth and Adullam among the towns of the Shephelah. It is identified with Khirbet Zanu, a ruin on a high hill about 4 km south-east of Beth-shemesh above the Zanoah brook, where the Arabic name kept the Hebrew; Eusebius already knew a village Zanoua in the district of Eleutheropolis on the road to Jerusalem. The site has been surveyed but not excavated. The genealogy of Judah in Chronicles makes Jekuthiel “the father of Zanoah”. A second Zanoah, in the hill country near Juttah and Maon, is another place."
    - "The town is named in the books of the return from exile. When Nehemiah rebuilt the wall of Jerusalem in 445 BC, “the valley gate repaired Hanun, and the inhabitants of Zanoah; they built it, and set up the doors thereof, the locks thereof, and the bars thereof, and a thousand cubits on the wall unto the dung gate”, the longest length given anywhere in the list. In the list of the places where the people of Judah settled, Zanoah stands with Adullam, Lachish and Azekah, “from Beer-sheba unto the valley of Hinnom”: the lowland towns were Judah's western edge in the Persian period."
    - "Khirbet Zanu lies today in Israel south of Beit Shemesh, about a kilometre south of the moshav Zanoah, founded in 1950 and named after it."
  ru:
    - "Заноах был городом Иуды на низменности, названным вместе с Ештаолом, Цорой, Иармуфом и Одолламом среди городов Шефелы. Его отождествляют с Хирбет-Зануа — развалинами на высоком холме примерно в 4 км к юго-востоку от Вефсамиса над ручьём Заноах, где арабское имя сохранило еврейское; Евсевий уже знал селение Заноуа в округе Элевтерополя на дороге в Иерусалим. Место обследовали, но раскопок здесь не было. Родословие Иуды в Паралипоменоне знает «Иекуфиила, отца Занаоха». Второй Заноах, в нагорье близ Юты и Маона, — другое место."
    - "Город назван в книгах о возвращении из плена. Когда Неемия в 445 г. до н. э. восстанавливал стену Иерусалима, «Ворота Долины чинил Ханун и жители Заноаха: они построили их, и вставили двери их, замки их и засовы их, и еще чинили они тысячу локтей стены до ворот Навозных» — самая большая длина во всём списке. В списке мест, где поселился народ Иуды, Заноах стоит рядом с Одолламом, Лахисом и Азекой, «от Вирсавии и до долины Енномовой»: города низменности были западным краем Иудеи в персидское время."
    - "Хирбет-Зануа лежит сегодня в Израиле южнее Бейт-Шемеша, примерно в километре к югу от мошава Заноах, основанного в 1950 году и названного по нему."
