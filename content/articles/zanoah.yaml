body:
  en:
    - "Zanoah was a town of Judah in the lowland, listed with Eshtaol, Zorah, Jarmuth and Adullam among the towns of the Shephelah. It is identified with Khirbet Zanu, a ruin on a high hill about 4 km south-east of Beth-shemesh above the Zanoah brook, where the Arabic name kept the Hebrew; Eusebius already knew a village Zanoua in the district of Eleutheropolis on the road to Jerusalem. The site has been surveyed but not excavated. The genealogy of Judah in Chronicles makes Jekuthiel “the father of Zanoah”. A second Zanoah, in the hill country near Juttah and Maon, is another place."
    - "The town is named in the books of the return from exile. When Nehemiah rebuilt the wall of Jerusalem in 445 BC, “the valley gate repaired Hanun, and the inhabitants of Zanoah; they built it, and set up the doors thereof, the locks thereof, and the bars thereof, and a thousand cubits on the wall unto the dung gate”, the longest length given anywhere in the list. In the list of the places where the people of Judah settled, Zanoah stands with Adullam, Lachish and Azekah, “from Beer-sheba unto the valley of Hinnom”: the lowland towns were Judah's western edge in the Persian period."
    - "Khirbet Zanu lies today in Israel south of Beit Shemesh, about a kilometre south of the moshav Zanoah, founded in 1950 and named after it."
  ru:
    - "Заноах был городом Иуды на низменности, названным вместе с Ештаолом, Цорой, Иармуфом и Одолламом среди городов Шефелы. Его отождествляют с Хирбет-Зануа — развалинами на высоком холме примерно в 4 км к юго-востоку от Вефсамиса над ручьём Заноах, где арабское имя сохранило еврейское; Евсевий уже знал селение Заноуа в округе Элевтерополя на дороге в Иерусалим. Место обследовали, но раскопок здесь не было. Родословие Иуды в Паралипоменоне знает «Иекуфиила, отца Занаоха». Второй Заноах, в нагорье близ Юты и Маона, — другое место."
    - "Город назван в книгах о возвращении из плена. Когда Неемия в 445 г. до н. э. восстанавливал стену Иерусалима, «Ворота Долины чинил Ханун и жители Заноаха: они построили их, и вставили двери их, замки их и засовы их, и еще чинили они тысячу локтей стены до ворот Навозных» — самая большая длина во всём списке. В списке мест, где поселился народ Иуды, Заноах стоит рядом с Одолламом, Лахисом и Азекой, «от Вирсавии и до долины Енномовой»: города низменности были западным краем Иудеи в персидское время."
    - "Хирбет-Зануа лежит сегодня в Израиле южнее Бейт-Шемеша, примерно в километре к югу от мошава Заноах, основанного в 1950 году и названного по нему."
  uk:
    - "Заноах був містом Юди в низовині, названим разом з Ештаолом, Цорою, Ярмутом і Одоламом серед міст Шефели. Його ототожнюють із Хірбет-Зану, руїною на високому пагорбі приблизно за 4 км на південний схід від Бет-Шемеша над потоком Заноах, де арабська назва зберегла староєврейську; Євсевій уже знав село Заноа в окрузі Елевтеополя на дорозі до Єрусалима. Місце обстежено, але не розкопано. Родовід Юди в Хроніках робить Єкуфіїла «Занаохового батька». Другий Заноах, у гірській країні поблизу Ютти й Маона, — інше місце."
    - "Місто названо в книгах повернення з вигнання. Коли Неемія відбудовував мур Єрусалима 445 р. до н. е., «Ворота Долинні будував Ханун та осадники Заноаха: вони збудували їх і вставили браму в їх, замки їх і засуви їх, а до того лагодили вони ще тисячу локот муру до Гнояних воріт», найдовшу ділянку, названу будь-де в переліку. У переліку місць, де оселилися люди Юди, Заноах стоїть з Одоламом, Лахішем і Азекою, «від Бирсабії до долини Енномової»: міста низовини були західним краєм Юди в перську добу."
    - "Хірбет-Зану нині лежить в Ізраїлі на південь від Бейт-Шемеша, приблизно за кілометр на південь від мошаву Заноах, заснованого 1950 року й названого на його честь."
  es:
    - "Zanoa era una ciudad de Judá en la llanura, enumerada con Estaol, Zora, Jarmut y Adulam entre las ciudades de la Sefelá. Se identifica con Khirbet Zanu, una ruina sobre una colina alta a unos 4 km al sureste de Bet-semes, sobre el arroyo de Zanoa, donde el nombre árabe conservó el hebreo; Eusebio ya conocía una aldea Zanoua en el distrito de Eleuterópolis, en el camino de Jerusalén. El sitio ha sido prospectado pero no excavado. La genealogía de Judá en Crónicas hace a Jecutiel «padre de Zanoa». Una segunda Zanoa, en la región montañosa cerca de Jutá y Maón, es otro lugar."
    - "La ciudad se nombra en los libros del regreso del exilio. Cuando Nehemías reconstruyó la muralla de Jerusalén en 445 a. C., «La puerta del Valle la restauró Hanún con los moradores de Zanoa: ellos la reedificaron, y levantaron sus puertas, con sus cerraduras y sus cerrojos, y mil codos en el muro hasta la puerta del Muladar», el tramo más largo dado en toda la lista. En la lista de los lugares donde se asentó el pueblo de Judá, Zanoa figura con Adulam, Laquis y Azeca, «desde Beer-seba hasta el valle de Hinnom»: las ciudades de la llanura eran el límite occidental de Judá en el período persa."
    - "Khirbet Zanu se encuentra hoy en Israel, al sur de Beit Shemesh, a un kilómetro al sur del moshav Zanoa, fundado en 1950 y llamado así por ella."
  pt:
    - "Zanoa era uma cidade de Judá na planície, listada com Estaol, Zorá, Jarmute e Adulão entre as cidades da Sefelá. É identificada com Khirbet Zanu, uma ruína numa colina alta a cerca de 4 km a sudeste de Bete-Semes, acima do ribeiro de Zanoa, onde o nome árabe conservou o hebraico; Eusébio já conhecia uma aldeia Zanoua no distrito de Eleuterópolis, na estrada para Jerusalém. O sítio foi prospectado, mas não escavado. A genealogia de Judá em Crônicas faz de Jecutiel “o pai de Zanoa”. Uma segunda Zanoa, na região montanhosa perto de Jutá e Maom, é outro lugar."
    - "A cidade é nomeada nos livros do retorno do exílio. Quando Neemias reconstruiu a muralha de Jerusalém em 445 a.C., “Hanum e os habitantes de Zanoa repararam a Porta do Vale. Eles a edificaram, e assentaram as suas portas, os seus ferrolhos e as suas trancas, e também mil côvados da muralha até a Porta do Esterco”, o maior trecho dado em toda a lista. Na lista dos lugares onde o povo de Judá se estabeleceu, Zanoa aparece com Adulão, Laquis e Azeca, “desde Berseba até o vale de Hinom”: as cidades da planície eram a orla ocidental de Judá no período persa."
    - "Khirbet Zanu fica hoje em Israel, ao sul de Bete-Semes, cerca de um quilômetro ao sul do moshav Zanoa, fundado em 1950 e nomeado em sua honra."
  de:
    - "Sanoach war eine Stadt Judas im Tiefland, aufgeführt mit Eschtaol, Zora, Jarmut und Adullam unter den Städten der Schefela. Es wird mit Khirbet Zanu gleichgesetzt, einer Ruine auf einem hohen Hügel etwa 4 km südöstlich von Bet-Schemesch über dem Sanoach-Bach, wo der arabische Name den hebräischen bewahrte; schon Eusebius kannte ein Dorf Zanoua im Gebiet von Eleutheropolis an der Straße nach Jerusalem. Die Stätte wurde vermessen, aber nicht ausgegraben. Die Genealogie Judas in der Chronik nennt „Jekuthiel, den Vater Sanoahs“. Ein zweites Sanoach im Bergland nahe Juta und Maon ist ein anderer Ort."
    - "Die Stadt wird in den Büchern der Rückkehr aus dem Exil genannt. Als Nehemia 445 v. Chr. die Mauer Jerusalems wiederaufbaute: „Das Taltor bauten Hanun und die Bürger von Sanoah, sie bauten's und setzten ein seine Türen, Schlösser und Riegel, und tausend Ellen an der Mauer bis an das Misttor“, die längste Strecke der ganzen Liste. In der Liste der Orte, wo sich das Volk Juda ansiedelte, steht Sanoach mit Adullam, Lachisch und Aseka, „von Beer-Seba an bis an das Tal Hinnom“: Die Städte des Tieflands waren Judas Westrand in der Perserzeit."
    - "Khirbet Zanu liegt heute in Israel südlich von Bet Schemesch, etwa einen Kilometer südlich des Moschaws Zanoah, 1950 gegründet und nach ihm benannt."
  fr:
    - "Zanoach était une ville de Juda dans la plaine, citée avec Eschthaol, Tsorea, Jarmuth et Adullam parmi les villes de la Shéphéla. On l’identifie à Khirbet Zanu, ruine sur une haute colline à environ 4 km au sud-est de Beth-Schémesch au-dessus du torrent de Zanoach, où le nom arabe a gardé l’hébreu ; Eusèbe connaissait déjà un village Zanoua dans le district d’Éleuthéropolis sur la route de Jérusalem. Le site a été prospecté mais non fouillé. La généalogie de Juda dans les Chroniques fait de Jekuthiel « père de Zanoach ». Un second Zanoach, dans la montagne près de Jutta et de Maon, est un autre lieu."
    - "La ville est nommée dans les livres du retour d’exil. Quand Néhémie rebâtit le mur de Jérusalem en 445 av. J.-C., « Hanun et les habitants de Zanoach réparèrent la porte de la vallée. Ils la bâtirent, et en posèrent les battants, les verrous et les barres. Ils firent de plus mille coudées de mur jusqu’à la porte du fumier », le plus long tronçon donné dans toute la liste. Dans la liste des lieux où s’établit le peuple de Juda, Zanoach figure avec Adullam, Lakis et Azéka, « depuis Beer-Schéba jusqu’à la vallée de Hinnom » : les villes de la plaine étaient la bordure occidentale de Juda à l’époque perse."
    - "Khirbet Zanu se trouve aujourd’hui en Israël, au sud de Beit Shemesh, à environ un kilomètre au sud du moshav de Zanoah, fondé en 1950 et nommé d’après elle."
