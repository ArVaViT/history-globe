body:
  en:
    - "Zanoah was a town of Judah in the lowland, listed with Eshtaol, Zorah, Jarmuth and Adullam among the towns of the Shephelah. It is identified with Khirbet Zanu, a ruin on a high hill about 4 km south-east of Beth-shemesh above the Zanoah brook, where the Arabic name kept the Hebrew; Eusebius already knew a village Zanoua in the district of Eleutheropolis on the road to Jerusalem. The site has been surveyed but not excavated. The genealogy of Judah in Chronicles makes Jekuthiel “the father of Zanoah”. A second Zanoah, in the hill country near Juttah and Maon, is another place."
    - "The town is named in the books of the return from exile. When Nehemiah rebuilt the wall of Jerusalem in 445 BC, “the valley gate repaired Hanun, and the inhabitants of Zanoah; they built it, and set up the doors thereof, the locks thereof, and the bars thereof, and a thousand cubits on the wall unto the dung gate”, the only length given anywhere in the list. In the list of the places where the people of Judah settled, Zanoah stands with Adullam, Lachish and Azekah, “from Beer-sheba unto the valley of Hinnom”."
    - "Khirbet Zanu lies today in Israel south of Beit Shemesh, about a kilometre south of the moshav Zanoah, founded in 1950 and named after it."
  ru:
    - "Заноах был городом Иуды на низменности, названным вместе с Ештаолом, Цорой, Иармуфом и Одолламом среди городов Шефелы. Его отождествляют с Хирбет-Зануа — развалинами на высоком холме примерно в 4 км к юго-востоку от Вефсамиса над ручьём Заноах, где арабское имя сохранило еврейское; Евсевий уже знал селение Заноуа в округе Элевтерополя на дороге в Иерусалим. Место обследовали, но раскопок здесь не было. Родословие Иуды в Паралипоменоне знает «Иекуфиила, отца Занаоха». Второй Заноах, в нагорье близ Юты и Маона, — другое место."
    - "Город назван в книгах о возвращении из плена. Когда Неемия в 445 г. до н. э. восстанавливал стену Иерусалима, «Ворота Долины чинил Ханун и жители Заноаха: они построили их, и вставили двери их, замки их и засовы их, и еще чинили они тысячу локтей стены до ворот Навозных» — единственная длина, указанная во всём списке. В списке мест, где поселился народ Иуды, Заноах стоит рядом с Одолламом, Лахисом и Азекой, «от Вирсавии и до долины Енномовой»."
    - "Хирбет-Зануа лежит сегодня в Израиле южнее Бейт-Шемеша, примерно в километре к югу от мошава Заноах, основанного в 1950 году и названного по нему."
  uk:
    - "Заноах був містом Юди в низовині, названим разом з Ештаолом, Цорою, Ярмутом і Одоламом серед міст Шефели. Його ототожнюють із Хірбет-Зану, руїною на високому пагорбі приблизно за 4 км на південний схід від Бет-Шемеша над потоком Заноах, де арабська назва зберегла староєврейську; Євсевій уже знав село Заноа в окрузі Елевтеополя на дорозі до Єрусалима. Місце обстежено, але не розкопано. Родовід Юди в Хроніках робить Єкуфіїла «Занаохового батька». Другий Заноах, у гірській країні поблизу Ютти й Маона, — інше місце."
    - "Місто названо в книгах повернення з вигнання. Коли Неемія відбудовував мур Єрусалима 445 р. до н. е., «Ворота Долинні будував Ханун та осадники Заноаха: вони збудували їх і вставили браму в їх, замки їх і засуви їх, а до того лагодили вони ще тисячу локот муру до Гнояних воріт», єдину довжину, названу будь-де в переліку. У переліку місць, де оселилися люди Юди, Заноах стоїть з Одоламом, Лахішем і Азекою, «від Бирсабії до долини Енномової»."
    - "Хірбет-Зану нині лежить в Ізраїлі на південь від Бейт-Шемеша, приблизно за кілометр на південь від мошаву Заноах, заснованого 1950 року й названого на його честь."
  es:
    - "Zanoa era una ciudad de Judá en la llanura, enumerada con Estaol, Zora, Jarmut y Adulam entre las ciudades de la Sefelá. Se identifica con Khirbet Zanu, una ruina sobre una colina alta a unos 4 km al sureste de Bet-semes, sobre el arroyo de Zanoa, donde el nombre árabe conservó el hebreo; Eusebio ya conocía una aldea Zanoua en el distrito de Eleuterópolis, en el camino de Jerusalén. El sitio ha sido prospectado pero no excavado. La genealogía de Judá en Crónicas hace a Jecutiel «padre de Zanoa». Una segunda Zanoa, en la región montañosa cerca de Jutá y Maón, es otro lugar."
    - "La ciudad se nombra en los libros del regreso del exilio. Cuando Nehemías reconstruyó la muralla de Jerusalén en 445 a. C., «La puerta del Valle la restauró Hanún con los moradores de Zanoa: ellos la reedificaron, y levantaron sus puertas, con sus cerraduras y sus cerrojos, y mil codos en el muro hasta la puerta del Muladar», la única longitud dada en toda la lista. En la lista de los lugares donde se asentó el pueblo de Judá, Zanoa figura con Adulam, Laquis y Azeca, «desde Beer-seba hasta el valle de Hinnom»."
    - "Khirbet Zanu se encuentra hoy en Israel, al sur de Beit Shemesh, a un kilómetro al sur del moshav Zanoa, fundado en 1950 y llamado así por ella."
  pt:
    - "Zanoa era uma cidade de Judá na planície, listada com Estaol, Zorá, Jarmute e Adulão entre as cidades da Sefelá. É identificada com Khirbet Zanu, uma ruína numa colina alta a cerca de 4 km a sudeste de Bete-Semes, acima do ribeiro de Zanoa, onde o nome árabe conservou o hebraico; Eusébio já conhecia uma aldeia Zanoua no distrito de Eleuterópolis, na estrada para Jerusalém. O sítio foi prospectado, mas não escavado. A genealogia de Judá em Crônicas faz de Jecutiel “o pai de Zanoa”. Uma segunda Zanoa, na região montanhosa perto de Jutá e Maom, é outro lugar."
    - "A cidade é nomeada nos livros do retorno do exílio. Quando Neemias reconstruiu a muralha de Jerusalém em 445 a.C., “Hanum e os habitantes de Zanoa repararam a Porta do Vale. Eles a edificaram, e assentaram as suas portas, os seus ferrolhos e as suas trancas, e também mil côvados da muralha até a Porta do Esterco”, o único comprimento dado em toda a lista. Na lista dos lugares onde o povo de Judá se estabeleceu, Zanoa aparece com Adulão, Laquis e Azeca, “desde Berseba até o vale de Hinom”."
    - "Khirbet Zanu fica hoje em Israel, ao sul de Bete-Semes, cerca de um quilômetro ao sul do moshav Zanoa, fundado em 1950 e nomeado em sua honra."
  de:
    - "Sanoach war eine Stadt Judas im Tiefland, aufgeführt mit Eschtaol, Zora, Jarmut und Adullam unter den Städten der Schefela. Es wird mit Khirbet Zanu gleichgesetzt, einer Ruine auf einem hohen Hügel etwa 4 km südöstlich von Bet-Schemesch über dem Sanoach-Bach, wo der arabische Name den hebräischen bewahrte; schon Eusebius kannte ein Dorf Zanoua im Gebiet von Eleutheropolis an der Straße nach Jerusalem. Die Stätte wurde vermessen, aber nicht ausgegraben. Die Genealogie Judas in der Chronik nennt „Jekuthiel, den Vater Sanoahs“. Ein zweites Sanoach im Bergland nahe Juta und Maon ist ein anderer Ort."
    - "Die Stadt wird in den Büchern der Rückkehr aus dem Exil genannt. Als Nehemia 445 v. Chr. die Mauer Jerusalems wiederaufbaute: „Das Taltor bauten Hanun und die Bürger von Sanoah, sie bauten's und setzten ein seine Türen, Schlösser und Riegel, und tausend Ellen an der Mauer bis an das Misttor“, die einzige Längenangabe der ganzen Liste. In der Liste der Orte, wo sich das Volk Juda ansiedelte, steht Sanoach mit Adullam, Lachisch und Aseka, „von Beer-Seba an bis an das Tal Hinnom“."
    - "Khirbet Zanu liegt heute in Israel südlich von Bet Schemesch, etwa einen Kilometer südlich des Moschaws Zanoah, 1950 gegründet und nach ihm benannt."
  fr:
    - "Zanoach était une ville de Juda dans la plaine, citée avec Eschthaol, Tsorea, Jarmuth et Adullam parmi les villes de la Shéphéla. On l’identifie à Khirbet Zanu, ruine sur une haute colline à environ 4 km au sud-est de Beth-Schémesch au-dessus du torrent de Zanoach, où le nom arabe a gardé l’hébreu ; Eusèbe connaissait déjà un village Zanoua dans le district d’Éleuthéropolis sur la route de Jérusalem. Le site a été prospecté mais non fouillé. La généalogie de Juda dans les Chroniques fait de Jekuthiel « père de Zanoach ». Un second Zanoach, dans la montagne près de Jutta et de Maon, est un autre lieu."
    - "La ville est nommée dans les livres du retour d’exil. Quand Néhémie rebâtit le mur de Jérusalem en 445 av. J.-C., « Hanun et les habitants de Zanoach réparèrent la porte de la vallée. Ils la bâtirent, et en posèrent les battants, les verrous et les barres. Ils firent de plus mille coudées de mur jusqu’à la porte du fumier », la seule longueur donnée dans toute la liste. Dans la liste des lieux où s’établit le peuple de Juda, Zanoach figure avec Adullam, Lakis et Azéka, « depuis Beer-Schéba jusqu’à la vallée de Hinnom »."
    - "Khirbet Zanu se trouve aujourd’hui en Israël, au sud de Beit Shemesh, à environ un kilomètre au sud du moshav de Zanoah, fondé en 1950 et nommé d’après elle."
  pl:
    - "Zanoach było miastem Judy na nizinie, wymienianym z Esztaol, Sorą, Jarmutem i Adullam wśród miast Szefeli. Utożsamia się je z Chirbet Zanu, ruiną na wysokim wzgórzu około 4 km na południowy wschód od Bet-Szemesz nad potokiem Zanoach, gdzie arabska nazwa zachowała hebrajską; Euzebiusz znał już wieś Zanoua w okręgu Eleuteropolis przy drodze do Jerozolimy. Stanowisko zostało przebadane powierzchniowo, ale nie wykopaliskowo. Rodowód Judy w Księgach Kronik wymienia „Jekutyjela, ojca Zanoach”. Drugie Zanoach, w górach koło Jutty i Maon, to inne miejsce."
    - "Miasto jest wymienione w księgach powrotu z wygnania. Gdy Nehemiasz odbudowywał mur Jerozolimy w 445 roku p.n.e., „Bramy nad doliną poprawiał Chanun, i obywatele Zanoe; cić ją budowali, i przyprawili wrota do niej, zamki jej, i zawory jej; i na tysiąc łokci muru aż do bramy gnojowej”, jedyna długość podana gdziekolwiek na liście. Na liście miejsc, gdzie osiedlił się lud Judy, Zanoach stoi z Adullam, Lakisz i Azeką, „A tak mieszkali od Beerseby aż do Giehennom”."
    - "Chirbet Zanu leży dziś w Izraelu na południe od Bet Szemesz, około kilometra na południe od moszawu Zanoach, założonego w 1950 roku i nazwanego od niego."
  it:
    - "Zanoa era una città di Giuda nella pianura, elencata con Estaol, Zorea, Iarmut e Adullam fra le città della Sefela. È identificata con Khirbet Zanu, una rovina su un’alta collina circa 4 km a sud-est di Bet-Semes sopra il torrente di Zanoa, dove il nome arabo ha conservato l’ebraico; Eusebio conosceva già un villaggio Zanoua nel distretto di Eleuteropoli sulla strada per Gerusalemme. Il sito è stato esplorato ma non scavato. La genealogia di Giuda nelle Cronache fa di Iekutiel «padre di Zanoah». Una seconda Zanoa, sulle montagne presso Iutta e Maon, è un altro luogo."
    - "La città è nominata nei libri del ritorno dall’esilio. Quando Neemia ricostruì il muro di Gerusalemme nel 445 a.C., «Hanun e gli abitanti di Zanoah restaurarono la porta della Valle; la costruirono, vi posero le imposte, le serrature e le sbarre. Fecero inoltre mille cubiti di muro fino alla porta del Letame», l’unica lunghezza indicata in tutto l’elenco. Nell’elenco dei luoghi dove si stabilì la gente di Giuda, Zanoa sta con Adullam, Lachis e Azeka, «da Beer-Sceba fino alla valle di Hinnom»."
    - "Khirbet Zanu si trova oggi in Israele a sud di Beit Shemesh, circa un chilometro a sud del moshav Zanoah, fondato nel 1950 e così chiamato da essa."
  nl:
    - "Zanoach was een stad van Juda in de laagvlakte, genoemd met Estaol, Zora, Jarmut en Adullam onder de steden van de Sefela. Het wordt vereenzelvigd met Khirbet Zanu, een ruïne op een hoge heuvel ongeveer 4 km ten zuidoosten van Beth-Semes boven de beek Zanoach, waar de Arabische naam de Hebreeuwse heeft bewaard; Eusebius kende al een dorp Zanoua in het district van Eleutheropolis aan de weg naar Jeruzalem. De plek is onderzocht maar niet opgegraven. De genealogie van Juda in Kronieken maakt Jekuthiël “den vader van Zanoah”. Een tweede Zanoach, in het bergland bij Juta en Maön, is een andere plaats."
    - "De stad wordt genoemd in de boeken van de terugkeer uit de ballingschap. Toen Nehemia in 445 v.Chr. de muur van Jeruzalem herbouwde: “De Dalpoort verbeterden Hanun, en de inwoners van Zanoah; zij bouwden die, en richtten haar deuren op, met haar sloten en haar grendelen; daartoe duizend ellen aan den muur, tot aan de Mistpoort”, de enige lengte die ergens in de lijst wordt gegeven. In de lijst van de plaatsen waar het volk van Juda zich vestigde staat Zanoach met Adullam, Lachis en Azeka, “van Ber-seba af tot aan het dal Hinnom”."
    - "Khirbet Zanu ligt tegenwoordig in Israël ten zuiden van Beit Shemesh, ongeveer een kilometer ten zuiden van de mosjav Zanoah, in 1950 gesticht en naar de stad genoemd."
  cs:
    - "Zanoach bylo město Judy v nížině, uvedené s Eštaolem, Coreou, Jarmutem a Adulamem mezi městy Šefely. Je ztotožňováno s Chirbet Zanú, zříceninou na vysokém pahorku asi 4 km jihovýchodně od Bét-šemeše nad potokem Zanoach, kde arabské jméno zachovalo hebrejské; Eusebius už znal vesnici Zanoua v okrese Eleutheropole na cestě do Jeruzaléma. Lokalita byla prozkoumána povrchovým průzkumem, ale nevykopána. Rodopis Judy v Kronikách činí Jekutiela „otce Zanoe“. Druhé Zanoach, v pohoří poblíž Juty a Maonu, je jiné místo."
    - "Město je jmenováno v knihách o návratu z exilu. Když Nehemjáš roku 445 př. n. l. stavěl hradbu Jeruzaléma, „Bránu při údolí opravil Chanun s obyvateli Zanoe. Oni ji stavěli, a vstavili vrata její s zámky i závorami jejími, a zdi na tisíc loket až do brány hnojné“, jediná délka uvedená kdekoli v seznamu. V seznamu míst, kde se usadil lid Judy, stojí Zanoach s Adulamem, Lachišem a Azekou, „od Bersabé až do Gehinnom“."
    - "Chirbet Zanú leží dnes v Izraeli jižně od Bejt Šemeš, asi kilometr jižně od mošavu Zanoach, založeného roku 1950 a pojmenovaného podle něj."
  sv:
    - "Sanoach var en stad i Juda i låglandet, upptagen tillsammans med Eshtaol, Sora, Jarmut och Adullam bland Shefelas städer. Det identifieras med Khirbet Zanu, en ruin på en hög kulle omkring 4 km sydost om Bet-Shemesh ovanför Sanoachbäcken, där det arabiska namnet bevarade det hebreiska; Eusebios kände redan en by Zanoua i Eleutheropolis distrikt vid vägen till Jerusalem. Platsen har undersökts men inte grävts ut. Judas släktregister i Krönikeboken gör Jekutiel till ”Sanoas fader”. Ett andra Sanoach, i bergsbygden nära Jutta och Maon, är en annan plats."
    - "Staden nämns i böckerna om återkomsten från exilen. När Nehemja byggde upp Jerusalems mur år 445 f.Kr. heter det: ”Dalporten sattes i stånd av Hanun och Sanoas invånare; de byggde upp den och satte in dess dörrar, dess riglar och bommar. De byggde ock ett tusen alnar på muren, ända fram till Dyngporten”, den enda längd som anges någonstans i förteckningen. I förteckningen över platserna där Judas folk bosatte sig står Sanoach tillsammans med Adullam, Lakish och Aseka, ”från Beer-Seba ända till Hinnoms dal”."
    - "Khirbet Zanu ligger i dag i Israel söder om Bet-Shemesh, omkring en kilometer söder om moshavet Zanoah, grundat 1950 och uppkallat efter det."
  nb:
    - "Sanoah var en by i Juda i lavlandet, oppført sammen med Esjtaol, Sora, Jarmut og Adullam blant byene i Sjefela. Den identifiseres med Khirbet Zanu, en ruin på en høy høyde omkring 4 km sørøst for Bet-Sjemesj over Sanoah-bekken, der det arabiske navnet har bevart det hebraiske; Eusebius kjente allerede en landsby Zanoua i distriktet Eleutheropolis ved veien til Jerusalem. Stedet er kartlagt, men ikke utgravd. Judas slektstavle i Krønikebøkene gjør Jekutiel til «far til Sanoah». En annen Sanoah, i fjellandet nær Jutta og Maon, er et annet sted."
    - "Byen er nevnt i bøkene om hjemkomsten fra eksilet. Da Nehemja gjenreiste muren i Jerusalem i 445 f.Kr., heter det: «Dalporten blev satt i stand av Hanun og innbyggerne i Sanoah; de bygget den og satte inn dører, låser og slåer; de bygget også tusen alen av muren, til Møkkporten», den eneste lengden som er oppgitt noe sted i listen. I listen over stedene der Judas folk bosatte seg står Sanoah sammen med Adullam, Lakisj og Aseka, «fra Be'erseba til Hinnoms dal»."
    - "Khirbet Zanu ligger i dag i Israel sør for Bet-Sjemesj, omkring en kilometer sør for moshaven Zanoah, grunnlagt i 1950 og oppkalt etter den."
  tl:
    - "Ang Zanoa ay bayan ng Juda sa mababang lupain, nakatala kasama ng Estaol, Sora, Jarmuth at Adullam sa mga bayan ng Sephela. Kinikilala ito sa Khirbet Zanu, guho sa mataas na burol mga 4 km sa timog-silangan ng Beth-semes sa itaas ng batis ng Zanoa, kung saan pinanatili ng pangalang Arabe ang Hebreo; kilala na ni Eusebio ang nayong Zanoua sa distrito ng Eleutheropolis sa daan patungong Jerusalem. Nasarbey ang pook ngunit hindi nahukay. Sa talaan ng lahi ni Juda sa Mga Cronica, si Icuthiel ay “ama ni Zanoa”. Ang ikalawang Zanoa, sa maburol na lupain malapit sa Juta at Maon, ay ibang lugar."
    - "Pinangalanan ang bayan sa mga aklat ng pagbabalik mula sa pagkatapon. Nang itayong muli ni Nehemias ang pader ng Jerusalem noong 445 BK, “Ang pintuang-bayan ng libis ay hinusay ni Hanun, at ng mga taga Zanoa; kanilang itinayo, at inilagay ang mga pinto niyaon, ang mga trangka niyaon, at ang mga halang niyaon, at isang libong siko sa kuta hanggang sa pintuang-bayan ng tapunan ng dumi”, ang tanging habang ibinigay saanman sa talaan. Sa talaan ng mga lugar na tinirhan ng bayan ng Juda, ang Zanoa ay kasama ng Adullam, Lachis at Azeca, “mula sa Beer-seba hanggang sa libis ni Hinnom”."
    - "Ang Khirbet Zanu ay nasa Israel ngayon sa timog ng Beit Shemesh, mga isang kilometro sa timog ng moshav na Zanoah, itinatag noong 1950 at pinangalanan mula rito."
  da:
    - "Zanoa var en by i Juda i lavlandet, opført sammen med Esjtaol, Zora, Jarmut og Adullam blandt Sjefelas byer. Den identificeres med Khirbet Zanu, en ruin på en høj bakke omkring 4 km sydøst for Bet-Sjemesj oven for Zanoa-bækken, hvor det arabiske navn har bevaret det hebraiske; Eusebius kendte allerede en landsby Zanoua i Eleutheropolis' distrikt på vejen til Jerusalem. Stedet er undersøgt, men ikke udgravet. Judas slægtsregister i Krønikebøgerne gør Jekutiel til »Sanoas Fader«. Et andet Zanoa, i bjerglandet nær Jutta og Maon, er et andet sted."
    - "Byen nævnes i bøgerne om hjemkomsten fra eksilet. Da Nehemias genopbyggede Jerusalems mur i 445 f.Kr.: »Dalporten istandsatte Hanun og Indbyggerne af Sanoa; de byggede den og indsatte dens Døre, med dens Laase og dens Stænger, og tusinde Alen paa Muren indtil Møgporten«, den eneste længde, der er angivet noget sted på listen. I listen over de steder, hvor Judas folk slog sig ned, står Zanoa sammen med Adullam, Lakisj og Azeka, »fra Beersaba indtil Hinnoms Dal«."
    - "Khirbet Zanu ligger i dag i Israel syd for Beit Shemesh, omkring en kilometer syd for moshaven Zanoah, grundlagt i 1950 og opkaldt efter den."
  sr:
    - "Заноја је био град Јуде у низији, наведен с Естаолом, Сарајом, Јармотом и Одоламом међу градовима Сефеле. Поистовећује се с Хирбет Зануом, рушевином на високом брду око 4 км југоисточно од Вет-Семеса изнад потока Заноја, где је арапско име сачувало хебрејско; Јевсевије је већ знао село Зануа у области Елеутеропоља на путу за Јерусалим. Налазиште је истражено површински, али не и ископавано. Родослов Јуде у Летописима чини Јекутила „оца Заноји“. Друга Заноја, у горју близу Јуте и Маона, друго је место."
    - "Град се именује у књигама о повратку из изгнанства. Када је Немија обновио зид Јерусалима 445. п. н. е., „Врата долинска поправља Анун са становницима занојским; они их саградише и метнуше крила и браве и преворнице, и хиљаду лаката зида до гнојних врата“, једина дужина дата у целом списку. У списку места где се населио народ Јуде, Заноја стоји са Одоламом, Лахисом и Азиком, „од Вирсавеје до долине Емона“."
    - "Хирбет Зану данас лежи у Израелу јужно од Бејт Шемеша, око километар јужно од мошава Заноја, основаног 1950. и названог по њој."
