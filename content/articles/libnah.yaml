body:
  en:
    - "Libnah was a town of the Shephelah, the low hills between the Judaean highlands and the coastal plain. Its site is disputed. The point on the map marks Tel Burna (Tell Bornat), a fortified mound between Lachish and Gath that W. F. Albright and Yohanan Aharoni proposed for Libnah; Itzhaq Shai, who has excavated it since 2010, holds the same view. The excavators of Tel Zayit, a few kilometres to the west, have suggested their site instead, and Tell ej-Judeideh (Tel Goded) has also been proposed. No inscription has yet settled the question."
    - "Tel Burna was settled from the Early Bronze Age. In the thirteenth century BC a large Canaanite cult enclosure with a courtyard stood on a terrace below the summit. In the later Iron Age a casemate wall with a gate ringed the summit, and among the finds are jar handles stamped with the royal seal of Judah, the lmlk stamp."
    - 'In the Book of Joshua Israel came from Makkedah to Libnah, took it and smote its king, and went on to Lachish. Libnah is listed among the towns of the lowland of Judah and was given with its suburbs to the children of Aaron. In the ninth century BC, under Jehoram king of Judah, when Edom broke away, "Libnah revolted at the same time". In 701 BC Rab-shakeh, coming back from Jerusalem, found Sennacherib "warring against Libnah", for he had departed from Lachish. Hamutal, "the daughter of Jeremiah of Libnah", was the mother of two of the last kings of Judah, Jehoahaz and Zedekiah.'
    - "Josephus retells the revolt of Libnah under Jehoram. In the early fourth century AD Eusebius knew a village called Lobana in the district of Eleutheropolis (Beth Guvrin), a priestly city of the tribe of Judah taken by Joshua."
  ru:
    - "Ливна — город Шефелы, низких холмов между Иудейскими горами и приморской равниной. Где именно она стояла, спорят. Точка на карте отмечает Тель-Бурну (Телль-Борнат), укреплённый холм между Лахисом и Гефом, который предлагали считать Ливной У. Ф. Олбрайт и Йоханан Аарони; того же мнения держится Ицхак Шай, ведущий здесь раскопки с 2010 г. Руководители раскопок Тель-Зайита, в нескольких километрах к западу, предлагают свой холм, а ещё одна кандидатура — Телль-эль-Джудейда (Тель-Годед). Ни одна надпись пока не решила вопрос."
    - "На Тель-Бурне жили с раннего бронзового века. В XIII веке до н. э. на террасе ниже вершины стояло большое ханаанское святилище с двором. В позднем железном веке вершину окружала казематная стена с воротами; среди находок — ручки кувшинов с царской печатью Иудеи, оттиском lmlk."
    - "В книге Иисуса Навина Израиль пришёл из Македы к Ливне, взял её, поразил её царя и пошёл дальше к Лахису. Ливна названа среди городов низменности Иуды и с предместьями отдана сынам Аарона. В IX веке до н. э., при Иораме, царе Иудейском, когда отложился Едом, «в то же время выступила и Ливна». В 701 г. до н. э. Рабсак, вернувшись из Иерусалима, нашёл Сеннахирима «воюющим против Ливны», ибо тот отошёл от Лахиса. Хамуталь, «дочь Иеремии, из Ливны», была матерью двух из последних царей Иудеи — Иоахаза и Седекии."
    - "Иосиф Флавий пересказывает отпадение Ливны при Иораме. В начале IV века н. э. Евсевий знал селение Лобана в округе Елевферополя (Бейт-Гуврина) — священнический город колена Иудина, взятый Иисусом Навином."
  uk:
    - "Лівна була містом Шефели, низьких пагорбів між Юдейським нагір’ям і прибережною рівниною. Її місце спірне. Точка на мапі позначає Тель-Бурну (Телль-Борнат), укріплений пагорб між Лахішем і Гатом, який запропонували для Лівни В. Ф. Олбрайт і Йоханан Агароні; Іцхак Шай, який розкопує його з 2010 р., тримається того самого погляду. Розкопувачі Тель-Зайта, за кілька кілометрів на захід, запропонували натомість своє місце, а Телль-ед-Джудейде (Тель-Годед) також пропонували. Жоден напис досі не розв’язав питання."
    - "Тель-Бурну заселили ще від ранньої бронзової доби. У XIII ст. до н. е. на терасі під вершиною стояла велика ханаанська культова огорожа з подвір’ям. У пізнішу залізну добу казематний мур з брамою оперізував вершину, а серед знахідок — ручки збанків із царською печаткою Юди, штампом lmlk."
    - "У Книзі Ісуса Навина Ізраїль прийшов від Македи до Лівни, узяв її й побив її царя, а тоді пішов на Лахіш. Лівна числиться серед міст низовини Юди й була віддана з передмістями нащадкам Аарона. У IX ст. до н. е., за Йорама, царя Юди, коли відпав Едом, «Тодї ж відпала й Либна». У 701 р. до н. е. Рабшаке, вертаючись з Єрусалима, знайшов Сінаххеріба, який «облягав Либну», бо той відійшов від Лахіша. Хамуталь, «Хамуталь Ереміївна, з Либни», була матір’ю двох останніх царів Юди, Йоахаза й Седекії."
    - "Йосиф Флавій переказує повстання Лівни за Йорама. На початку IV ст. н. е. Євсевій знав село Лобана в окрузі Елевтерополя (Бейт-Гуврін), священицьке місто племені Юди, взяте Ісусом Навином."
  es:
    - "Libna era una ciudad de la Sefelá, las colinas bajas entre la sierra de Judea y la llanura costera. Su emplazamiento se discute. El punto del mapa señala Tel Burna (Tell Bornat), un montículo fortificado entre Laquis y Gat que W. F. Albright y Yohanan Aharoni propusieron para Libna; Itzhaq Shai, que lo excava desde 2010, sostiene la misma opinión. Los excavadores de Tel Zayit, a pocos kilómetros al oeste, han sugerido más bien su propio sitio, y también se ha propuesto Tell ej-Judeideh (Tel Goded). Ninguna inscripción ha resuelto aún la cuestión."
    - "Tel Burna estuvo poblado desde la Edad del Bronce Antiguo. En el siglo XIII a. C. se alzaba en una terraza bajo la cima un gran recinto de culto cananeo con un patio. En la Edad del Hierro posterior, una muralla de casamatas con una puerta rodeaba la cima, y entre los hallazgos hay asas de jarras selladas con el sello real de Judá, el sello lmlk."
    - "En el libro de Josué, Israel fue de Maceda a Libna, la tomó, hirió a su rey y siguió hacia Laquis. Libna figura entre las ciudades de la llanura de Judá y fue dada con sus ejidos a los hijos de Aarón. En el siglo IX a. C., bajo Joram, rey de Judá, cuando Edom se separó, «Rebelóse además Libna en el mismo tiempo». En 701 a. C. Rabsaces, al volver de Jerusalén, halló a Senaquerib «combatiendo á Libna», pues había partido de Laquis. Hamutal, «hija de Jeremías, de Libna», fue la madre de dos de los últimos reyes de Judá, Joacaz y Sedequías."
    - "Josefo vuelve a contar la rebelión de Libna bajo Joram. A comienzos del siglo IV d. C., Eusebio conoció una aldea llamada Lobana en el distrito de Eleuterópolis (Beit Guvrin), ciudad sacerdotal de la tribu de Judá tomada por Josué."
  pt:
    - "Libna era uma cidade da Sefelá, as colinas baixas entre as terras altas de Judá e a planície costeira. Seu sítio é disputado. O ponto no mapa marca Tel Burna (Tell Bornat), um montículo fortificado entre Laquis e Gate que W. F. Albright e Yohanan Aharoni propuseram para Libna; Itzhaq Shai, que o escava desde 2010, sustenta a mesma opinião. Os escavadores de Tel Zayit, a poucos quilômetros a oeste, sugeriram o seu sítio em vez dele, e Tell ej-Judeideh (Tel Goded) também foi proposto. Nenhuma inscrição resolveu ainda a questão."
    - "Tel Burna foi habitado desde a Idade do Bronze Antigo. No século XIII a.C., um grande recinto de culto cananeu com pátio ocupava um terraço abaixo do cume. No final da Idade do Ferro, uma muralha de casamatas com um portão cercava o cume, e entre os achados há alças de jarro carimbadas com o selo real de Judá, o carimbo lmlk."
    - "No livro de Josué, Israel veio de Maquedá a Libna, tomou-a, feriu seu rei e seguiu para Laquis. Libna consta entre as cidades da planície de Judá e foi dada com seus arredores aos filhos de Arão. No século IX a.C., sob Jeorão, rei de Judá, quando Edom se separou, “Libna se rebelou ao mesmo tempo”. Em 701 a.C. Rabsaqué, voltando de Jerusalém, encontrou Senaqueribe “lutando contra Libna”, pois ele havia partido de Laquis. Hamutal, “filha de Jeremias, de Libna”, foi mãe de dois dos últimos reis de Judá, Jeoacaz e Zedequias."
    - "Josefo reconta a revolta de Libna sob Jeorão. No início do século IV d.C., Eusébio conhecia uma aldeia chamada Lobana no distrito de Eleuterópolis (Bet Guvrin), cidade sacerdotal da tribo de Judá tomada por Josué."
  de:
    - "Libna war eine Stadt der Schefela, des niedrigen Hügellandes zwischen dem judäischen Bergland und der Küstenebene. Seine Lage ist umstritten. Der Punkt auf der Karte markiert Tel Burna (Tell Bornat), einen befestigten Hügel zwischen Lachisch und Gat, den W. F. Albright und Yohanan Aharoni für Libna vorschlugen; Itzhaq Shai, der ihn seit 2010 ausgräbt, vertritt dieselbe Ansicht. Die Ausgräber von Tel Zayit, wenige Kilometer westlich, haben stattdessen ihren Ort vorgeschlagen, und auch Tell ej-Judeideh (Tel Goded) wurde genannt. Noch keine Inschrift hat die Frage entschieden."
    - "Tel Burna war seit der Frühbronzezeit besiedelt. Im 13. Jahrhundert v. Chr. stand auf einer Terrasse unterhalb des Gipfels ein großer kanaanäischer Kultbezirk mit Hof. In der späteren Eisenzeit umgab eine Kasemattenmauer mit Tor den Gipfel, und unter den Funden sind Krughenkel mit dem königlichen Siegel Judas, dem lmlk-Stempel."
    - "Im Buch Josua zog Israel von Makkeda nach Libna, nahm es ein, schlug seinen König und zog weiter nach Lachisch. Libna gehört zu den Städten der Schefela Judas und wurde mit seinen Vorstädten den Kindern Aarons gegeben. Im 9. Jahrhundert v. Chr., unter Joram, dem König von Juda, als Edom abfiel, „fiel zur selben Zeit ab Libna“. Im Jahr 701 v. Chr. fand Rabschake auf dem Rückweg von Jerusalem „den König von Assyrien streiten wider Libna“, denn dieser war von Lachisch abgezogen. Hamutal, „eine Tochter Jeremia's von Libna“, war die Mutter zweier der letzten Könige Judas, Joahas und Zedekias."
    - "Josephus erzählt den Abfall Libnas unter Joram nach. Im frühen 4. Jahrhundert n. Chr. kannte Eusebius ein Dorf namens Lobana im Bezirk von Eleutheropolis (Bet Guvrin), eine Priesterstadt des Stammes Juda, von Josua eingenommen."
  fr:
    - "Libna était une ville de la Shéphéla, les basses collines entre les hautes terres de Juda et la plaine côtière. Son site est discuté. Le point de la carte marque Tel Burna (Tell Bornat), tertre fortifié entre Lakis et Gath que W. F. Albright et Yohanan Aharoni ont proposé pour Libna ; Itzhaq Shai, qui le fouille depuis 2010, partage cette opinion. Les fouilleurs de Tel Zayit, à quelques kilomètres à l’ouest, ont suggéré leur propre site, et Tell ej-Judeideh (Tel Goded) a aussi été proposé. Aucune inscription n’a encore tranché la question."
    - "Tel Burna fut habité dès l’âge du Bronze ancien. Au XIIIe siècle av. J.-C., un grand enclos cultuel cananéen avec une cour se dressait sur une terrasse sous le sommet. À l’âge du Fer récent, un mur à casemates avec une porte ceignait le sommet, et parmi les trouvailles figurent des anses de jarres frappées du sceau royal de Juda, l’estampille lmlk."
    - "Dans le livre de Josué, Israël vint de Makkéda à Libna, la prit, frappa son roi et poursuivit vers Lakis. Libna figure parmi les villes de la plaine de Juda et fut donnée avec ses banlieues aux fils d’Aaron. Au IXe siècle av. J.-C., sous Joram, roi de Juda, quand Édom se détacha, « Libna se révolta aussi dans le même temps ». En 701 av. J.-C., Rabschaké, revenant de Jérusalem, trouva Sanchérib « qui attaquait Libna », car il avait quitté Lakis. Hamutal, « fille de Jérémie, de Libna », fut la mère de deux des derniers rois de Juda, Joachaz et Sédécias."
    - "Flavius Josèphe raconte de nouveau la révolte de Libna sous Joram. Au début du IVe siècle apr. J.-C., Eusèbe connaissait un village appelé Lobana dans le district d’Éleuthéropolis (Beth Guvrin), ville sacerdotale de la tribu de Juda prise par Josué."
  it:
    - "Libna era una città della Sefela, le basse colline tra l’altopiano della Giudea e la pianura costiera. Il suo sito è discusso. Il punto sulla mappa segna Tel Burna (Tell Bornat), un tell fortificato tra Lachis e Gat che W. F. Albright e Yohanan Aharoni proposero per Libna; Itzhaq Shai, che lo scava dal 2010, è della stessa opinione. Gli scavatori di Tel Zayit, a pochi chilometri a ovest, hanno proposto invece il proprio sito, ed è stata avanzata anche Tell ej-Judeideh (Tel Goded). Nessuna iscrizione ha finora risolto la questione."
    - "Tel Burna fu abitato fin dall’età del Bronzo antico. Nel XIII secolo a.C. un grande recinto di culto cananeo con un cortile sorgeva su una terrazza sotto la sommità. Nella tarda età del Ferro un muro a casematte con una porta cingeva la sommità, e tra i reperti vi sono anse di giara con il sigillo reale di Giuda, il bollo lmlk."
    - "Nel libro di Giosuè Israele venne da Makkeda a Libna, la prese, colpì il suo re e proseguì verso Lachis. Libna è elencata tra le città della pianura di Giuda e fu data con i suoi contadi ai figli di Aronne. Nel IX secolo a.C., sotto Ioram re di Giuda, quando Edom si staccò, «In quel medesimo tempo, anche Libna si ribellò». Nel 701 a.C. Rabsache, tornando da Gerusalemme, trovò Sennacherib «che assediava Libna», perché era partito da Lachis. Camutal, «figliuola di Geremia da Libna», fu madre di due degli ultimi re di Giuda, Ioacaz e Sedecia."
    - "Giuseppe Flavio racconta di nuovo la rivolta di Libna sotto Ioram. All’inizio del IV secolo d.C. Eusebio conosceva un villaggio chiamato Lobana nel distretto di Eleuteropoli (Bet Guvrin), città sacerdotale della tribù di Giuda presa da Giosuè."
  pl:
    - "Libna była miastem Szefeli, niskich wzgórz między Wyżyną Judzką a równiną nadmorską. Jej położenie jest sporne. Punkt na mapie oznacza Tel Burna (Tell Bornat), obwarowany kopiec między Lakisz a Gat, który W. F. Albright i Jochanan Aharoni proponowali dla Libny; Itzhaq Shai, który prowadzi tam wykopaliska od 2010 r., podziela ten pogląd. Badacze Tel Zayit, kilka kilometrów na zachód, zaproponowali zamiast tego swoje stanowisko, a proponowano też Tell ej-Judeideh (Tel Goded). Żadna inskrypcja nie rozstrzygnęła jeszcze sprawy."
    - "Tel Burna było zasiedlone od wczesnej epoki brązu. W XIII w. p.n.e. na tarasie poniżej szczytu stało duże kananejskie ogrodzenie kultowe z dziedzińcem. W późniejszej epoce żelaza mur kazamatowy z bramą otaczał szczyt, a wśród znalezisk są uchwyty dzbanów z królewską pieczęcią Judy, stemplem lmlk."
    - "W Księdze Jozuego Izrael przyszedł z Makkedy do Libny, zdobył ją i pobił jej króla, po czym poszedł dalej do Lakisz. Libna jest wymieniona wśród miast nizin Judy i została oddana wraz z przedmieściami synom Aarona. W IX w. p.n.e., za Jorama, króla Judy, gdy Edom się oderwał, „Odstąpiło także i Lobne onegoż czasu”. W 701 r. p.n.e. Rabszake, wracając z Jerozolimy, znalazł Sennacheryba „dobywającego Lebny”, bo ten odszedł od Lakisz. Chamutal, „córka Jeremijaszowa z Lebny”, była matką dwóch z ostatnich królów Judy, Joachaza i Sedekiasza."
    - "Józef Flawiusz opowiada na nowo o buncie Libny za Jorama. Na początku IV w. n.e. Euzebiusz znał wieś zwaną Lobana w okręgu Eleuteropolis (Bet Guvrin), kapłańskie miasto pokolenia Judy zdobyte przez Jozuego."
  nl:
    - "Libna was een stad in de Sefela, de lage heuvels tussen het Judese bergland en de kustvlakte. De ligging is omstreden. Het punt op de kaart markeert Tel Burna (Tell Bornat), een versterkte heuvel tussen Lachis en Gat die W. F. Albright en Yohanan Aharoni voor Libna voorstelden; Itzhaq Shai, die hem sinds 2010 opgraaft, deelt die mening. De opgravers van Tel Zayit, een paar kilometer naar het westen, hebben hun eigen vindplaats voorgesteld, en ook Tell ej-Judeideh (Tel Goded) is voorgesteld. Geen inscriptie heeft de vraag nog beslecht."
    - "Tel Burna was bewoond vanaf de vroege bronstijd. In de dertiende eeuw v.Chr. stond op een terras onder de top een groot Kanaänitisch cultusterrein met een binnenplaats. In de latere ijzertijd omringde een kazemattenmuur met een poort de top, en onder de vondsten zijn kruikhandvatten met het koninklijke zegel van Juda, de lmlk-stempel."
    - "In het boek Jozua trok Israël van Makkeda naar Libna, nam het in en versloeg zijn koning, en ging verder naar Lachis. Libna wordt genoemd onder de steden van het laagland van Juda en werd met zijn voorsteden aan de kinderen van Aäron gegeven. In de negende eeuw v.Chr., onder Joram, koning van Juda, viel Edom af, en “toen viel Libna af in denzelfden tijd”. In 701 v.Chr. vond Rabsake, terugkerend uit Jeruzalem, Sanherib “strijdende tegen Libna”, want hij was uit Lachis vertrokken. Chamutal, “de dochter van Jeremia, van Libna”, was de moeder van twee van de laatste koningen van Juda, Joachaz en Zedekia."
    - "Josephus vertelt de opstand van Libna onder Joram na. In het begin van de vierde eeuw n.Chr. kende Eusebius een dorp Lobana in het district Eleutheropolis (Beit Guvrin), een priesterstad van de stam Juda die door Jozua was ingenomen."
  cs:
    - "Libna bylo město Šefely, nízkých pahorků mezi judskou vysočinou a pobřežní rovinou. Jeho poloha je sporná. Bod na mapě označuje Tel Burna (Tell Bornat), opevněný pahorek mezi Lachišem a Gatem, který pro Libnu navrhli W. F. Albright a Jochanan Aharoni; Itzhaq Shai, který jej vykopává od roku 2010, zastává stejný názor. Archeologové z Tel Zayit, několik kilometrů na západ, navrhli místo toho své naleziště a navrženo bylo i Tell ej-Judeideh (Tel Goded). Žádný nápis dosud otázku nerozhodl."
    - "Tel Burna byl osídlen od starší doby bronzové. Ve 13. století př. n. l. stál na terase pod vrcholem velký kanaánský kultovní okrsek s nádvořím. V pozdější době železné obepínala vrchol kazematová hradba s branou a mezi nálezy jsou ucha džbánů s královskou pečetí Judy, razítkem lmlk."
    - "V Knize Jozue přišel Izrael z Makedy k Libně, dobyl ji, pobil jejího krále a šel dál k Lachiši. Libna je uvedena mezi městy judské nížiny a byla dána s předměstími synům Áronovým. V 9. století př. n. l., za Jehorama, krále Judského, když Edóm odpadl, „Takž odstoupilo i Lebno téhož času“. Roku 701 př. n. l. nalezl Rabšake, vraceje se z Jeruzaléma, Senacheriba, „an dobývá Lebna“, neboť odtáhl od Lachiše. Chamutal, „dcera Jeremiášova z Lebna“, byla matkou dvou z posledních králů Judy, Joachaze a Sidkijáše."
    - "Josephus vypráví vzpouru Libny za Jehorama znovu. Na počátku 4. století n. l. znal Eusebius vesnici zvanou Lobana v okrese Eleutheropole (Bejt Guvrin), kněžské město pokolení Judova dobyté Jozuem."
  sv:
    - "Livna var en stad i Shefela, de låga kullarna mellan Judas bergsland och kustslätten. Dess läge är omstritt. Punkten på kartan markerar Tel Burna (Tell Bornat), en befäst kulle mellan Lakish och Gat som W. F. Albright och Yohanan Aharoni föreslog för Livna; Itzhaq Shai, som har grävt där sedan 2010, delar uppfattningen. Utgrävarna av Tel Zayit, några kilometer västerut, har i stället föreslagit sin plats, och Tell ej-Judeideh (Tel Goded) har också föreslagits. Ingen inskrift har ännu avgjort frågan."
    - "Tel Burna bosattes från tidiga bronsåldern. På 1200-talet f.Kr. stod en stor kanaaneisk kultinhägnad med en gård på en terrass nedanför toppen. Under den senare järnåldern omgavs toppen av en kasemattmur med en port, och bland fynden finns krukhandtag stämplade med Judas kungliga sigill, lmlk-stämpeln."
    - "I Josuas bok kom Israel från Mackeda till Livna, intog den och slog dess konung, och gick vidare till Lakish. Livna räknas bland städerna i Juda lågland och gavs med sina utmarker åt Arons barn. På 800-talet f.Kr., under Joram, kung av Juda, när Edom föll ifrån, ”avföll ock Libna”. År 701 f.Kr. fann Rab-Sake, på väg tillbaka från Jerusalem, Sanherib ”upptagen med att belägra Libna”, ty han hade brutit upp från Lakish. Hamutal, ”Jeremias dotter, från Libna”, var mor till två av Judas sista kungar, Joachas och Sidkia."
    - "Josefus återberättar Livnas uppror under Joram. I början av 300-talet e.Kr. kände Eusebios en by kallad Lobana i Eleutheropolis (Beit Guvrin) distrikt, en prästlig stad i Judas stam som Josua intog."
  nb:
    - "Libna var en by i Sjefela, de lave åsene mellom det judeiske høylandet og kystsletten. Beliggenheten er omstridt. Punktet på kartet markerer Tel Burna (Tell Bornat), en befestet haug mellom Lakisj og Gat som W. F. Albright og Yohanan Aharoni foreslo for Libna; Itzhaq Shai, som har gravd der siden 2010, deler dette syn. Utgraverne av Tel Zayit, noen få kilometer mot vest, har foreslått sitt sted i stedet, og Tell ej-Judeideh (Tel Goded) er også foreslått. Ingen innskrift har ennå avgjort spørsmålet."
    - "Tel Burna var bosatt fra tidlig bronsealder. På 1200-tallet f.Kr. sto en stor kanaanittisk kultinnhegning med en gårdsplass på en terrasse under toppen. I yngre jernalder omgav en kasemattmur med en port toppen, og blant funnene er krukehåndtak stemplet med Judas kongelige segl, lmlk-stempelet."
    - "I Josvas bok kom Israel fra Makkeda til Libna, inntok den og slo dens konge, og drog videre til Lakisj. Libna er oppført blant byene i lavlandet i Juda og ble gitt med sine marker til Arons barn. På 800-tallet f.Kr., under Joram, konge av Juda, da Edom falt fra, «på samme tid falt også Libna fra». I 701 f.Kr. fant Rabsake, da han kom tilbake fra Jerusalem, Sankerib «i ferd med å stride mot Libna», for han hadde brutt opp fra Lakisj. Hamutal, «datter av Jirmeja og var fra Libna», var mor til to av Judas siste konger, Joahas og Sidkia."
    - "Josefus gjenforteller Libnas opprør under Joram. Tidlig på 300-tallet e.Kr. kjente Eusebius en landsby kalt Lobana i distriktet Eleutheropolis (Bet Guvrin), en prestelig by i Judas stamme som Josva tok."
