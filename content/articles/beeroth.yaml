# Overview article (ADR 0007). Mainstream facts only; the location is disputed and the map's candidates are given without choosing one.
id: beeroth
place: a046454
title:
  en: "Beeroth"
  ru: "Беероф"
  uk: "Беерот"
  es: "Beerot"
  pt: "Beerote"
  de: "Beerot"
  fr: "Beéroth"
body:
  en:
    - "Beeroth, “wells”, was one of the four towns of the Hivites who tricked Joshua into a treaty: “Gibeon, and Chephirah, and Beeroth, and Kirjath-jearim”. It fell within Benjamin, listed beside Gibeon and Ramah. Its people were still a distinct group in David's time: Baanah and Rechab, “the sons of Rimmon a Beerothite”, murdered Ish-bosheth in his bed and carried his head to David, who had them killed; the writer adds that Beeroth “was reckoned to Benjamin” and that the Beerothites had fled to Gittaim. Naharai the Beerothite was Joab's armour-bearer. After the exile 743 men of Kiriath-jearim, Chephirah and Beeroth came home."
    - "Where Beeroth stood is disputed, and the map keeps the candidates. Eusebius placed it under Gibeon, seven miles from Jerusalem on the road to Nicopolis (Emmaus), which points west of the city; Jerome, translating him, wrote Neapolis (Shechem) instead, which points north. Edward Robinson in 1838 chose el-Bireh beside Ramallah, 15 km north of Jerusalem, where the Jerusalem-Shechem road passes and where a spring and a Crusader church stand; Ras et-Tahuneh is the ancient mound within it. Others, following Eusebius, prefer Khirbet el-Burj or Biddu on the ridge north-west of Jerusalem near Nebi Samwil, or Nebi Samwil itself, where excavation found remains of the Iron Age. The question is not settled, and the Berea where Bacchides camped in 1 Maccabees may be the same place."
    - "Today el-Bireh is a Palestinian city of some 50,000, twinned with Ramallah, while Khirbet el-Burj is a ruin on the edge of Jerusalem's northern suburbs. Whichever is right, Beeroth was a small Benjaminite town, and apart from the story of Ish-bosheth's murder the Bible has little to say of it."
  ru:
    - "Беероф, «колодцы», был одним из четырёх городов Евеев, хитростью заключивших союз с Иисусом Навином: «Гаваон, Кефира, Беероф и Кириаф-Иарим». Он вошёл в удел Вениамина и назван рядом с Гаваоном и Рамой. Во времена Давида его жители ещё были особой группой: Баана и Рихав, «сыновья Реммона Беерофянина», убили Иевосфея в постели и принесли его голову Давиду, который велел их казнить; писатель добавляет, что «Беероф причислялся к Вениамину» и что Беерофяне убежали в Гиффаим. Нахарай Беерофянин был оруженосцем Иоава. После плена вернулись семьсот сорок три уроженца Кириаф-Иарима, Кефиры и Беерофа."
    - "Где стоял Беероф, спорно, и карта хранит кандидатов. Евсевий помещал его под Гаваоном, в семи милях от Иерусалима по дороге в Никополь (Эммаус), то есть к западу от города; Иероним, переводя его, написал вместо этого Неаполь (Сихем), то есть к северу. Эдвард Робинсон в 1838 году выбрал Эль-Биру рядом с Рамаллой, в 15 км к северу от Иерусалима, где проходит дорога из Иерусалима в Сихем и стоят источник и церковь крестоносцев; древний холм внутри города — Рас-эт-Тахуне. Другие, следуя Евсевию, предпочитают Хирбет-эль-Бурдж или Бидду на гряде к северо-западу от Иерусалима близ Наби-Самвиля или сам Наби-Самвиль, где раскопки нашли остатки железного века. Вопрос не решён; возможно, то же место — Берея, где стоял станом Вакхид в Первой книге Маккавейской."
    - "Сегодня Эль-Бира — палестинский город примерно на 50 тысяч жителей, сросшийся с Рамаллой, а Хирбет-эль-Бурдж — руины на краю северных окраин Иерусалима. Как бы ни решился спор, Беероф был небольшим вениамитским городком, и, кроме рассказа об убийстве Иевосфея, Библии почти нечего о нём сказать."
  uk:
    - "Беерот, «колодязі», було одним із чотирьох міст хіввеїв, які обманом уклали договір з Ісусом Навином: «Габаон, Кафира, Беерот і Кириятярим». Воно припадало на Веніямина, назване поряд з Гаваоном і Рамою. Його мешканці ще були окремою групою за Давида: Баана і Ріхав, «сини Реммона Бееротянина», вбили Ішбошета на його ліжку й віднесли його голову Давидові, який їх стратив; автор додає, що «й Беерот прилїчено до Бенямина» і що «Бееротяне повтїкали в Гиттаїм». Нахарай Бееротянин був зброєносцем Йоава. Після вигнання повернулося 743 мужі з Кіріят-Єаріма, Кефіри та Беерота."
    - "Де стояв Беерот, спірне, і мапа зберігає кандидатів. Євсевій розмістив його під Гаваоном, за сім миль від Єрусалима на дорозі до Нікополя (Еммаусу), що вказує на захід від міста; Єронім, перекладаючи його, написав натомість Неаполь (Сихем), що вказує на північ. Едвард Робінсон у 1838 році обрав ель-Бірех поряд з Рамаллою, за 15 км на північ від Єрусалима, де проходить дорога Єрусалим — Сихем і де є джерело та хрестоносна церква; Рас-ет-Тахуне — давній пагорб у ньому. Інші, слідом за Євсевієм, віддають перевагу Хірбет-ель-Бурджу чи Бідду на хребті на північний захід від Єрусалима біля Неби-Самуїла, або самому Неби-Самуїлу, де розкопки знайшли рештки залізної доби. Питання не вирішене, і Верія, де таборував Бакхід у 1-й книзі Маккавеїв, може бути тим самим місцем."
    - "Нині ель-Бірех — палестинське місто приблизно з 50 000 мешканців, побратим Рамалли, а Хірбет-ель-Бурдж — руїна на краю північних передмість Єрусалима. Котре б не було правильним, Беерот було невеликим веніяминським містом, і крім розповіді про вбивство Ішбошета Біблія мало що про нього каже."
  es:
    - "Beerot, «pozos», fue una de las cuatro ciudades de los heveos que engañaron a Josué para obtener un tratado: «Gabaón, Caphira, Beeroth, y Chiriath-jearim». Caía dentro de Benjamín, enumerada junto a Gabaón y Ramá. Su gente seguía siendo un grupo distinto en tiempos de David: Baana y Recab, «hijos de Rimmón Beerothita», asesinaron a Is-boset en su lecho y llevaron su cabeza a David, que los hizo matar; el escritor añade que Beerot «era contada con Benjamín» y que los beerotitas habían huido a Gitaim. Naharai el beerotita fue el escudero de Joab. Tras el exilio, 743 hombres de Quiriat-jearim, Cafira y Beerot volvieron a casa."
    - "Se discute dónde estuvo Beerot, y el mapa conserva los candidatos. Eusebio la situó bajo Gabaón, a siete millas de Jerusalén en el camino a Nicópolis (Emaús), lo que apunta al oeste de la ciudad; Jerónimo, al traducirlo, escribió en cambio Neápolis (Siquem), lo que apunta al norte. Edward Robinson, en 1838, eligió el-Bireh, junto a Ramala, a 15 km al norte de Jerusalén, por donde pasa el camino de Jerusalén a Siquem y donde se alzan un manantial y una iglesia cruzada; Ras et-Tahuneh es el antiguo montículo dentro de ella. Otros, siguiendo a Eusebio, prefieren Khirbet el-Burj o Biddu, en la cresta al noroeste de Jerusalén cerca de Nebi Samwil, o la propia Nebi Samwil, donde la excavación halló restos de la edad del Hierro. La cuestión no está resuelta, y la Berea donde acampó Báquides en 1 Macabeos puede ser el mismo lugar."
    - "Hoy el-Bireh es una ciudad palestina de unos 50 000 habitantes, hermanada con Ramala, mientras que Khirbet el-Burj es una ruina en el borde de los suburbios septentrionales de Jerusalén. Sea cual sea la correcta, Beerot fue una pequeña ciudad de Benjamín, y aparte de la historia del asesinato de Is-boset la Biblia tiene poco que decir de ella."
  pt:
    - "Beerote, “poços”, era uma das quatro cidades dos heveus que enganaram Josué para obter um tratado: “Gibeom, Cefira, Beerote e Quiriate-Jearim”. Ficava dentro de Benjamim, listada ao lado de Gibeão e Ramá. Seu povo ainda era um grupo distinto no tempo de Davi: Baaná e Recabe, “filhos de Rimom, o beerotita”, mataram Is-Bosete em sua cama e levaram sua cabeça a Davi, que os mandou matar; o escritor acrescenta que “Beerote também é considerada parte de Benjamim” e que “os beerotitas fugiram para Gitaim”. Naarai, o beerotita, era escudeiro de Joabe. Depois do exílio, 743 homens de Quiriate-Jearim, Quefira e Beerote voltaram para casa."
    - "Onde Beerote ficava é discutido, e o mapa guarda os candidatos. Eusébio a pôs sob Gibeão, a sete milhas de Jerusalém, na estrada de Nicópolis (Emaús), o que aponta a oeste da cidade; Jerônimo, traduzindo-o, escreveu Neápolis (Siquém), o que aponta ao norte. Edward Robinson, em 1838, escolheu el-Bireh, junto a Ramallah, 15 km ao norte de Jerusalém, por onde passa a estrada Jerusalém–Siquém e onde há uma fonte e uma igreja cruzada; Ras et-Tahuneh é o antigo montículo dentro dela. Outros, seguindo Eusébio, preferem Khirbet el-Burj ou Biddu, na crista a noroeste de Jerusalém, perto de Nebi Samwil, ou a própria Nebi Samwil, onde a escavação achou restos da Idade do Ferro. A questão não está resolvida, e a Bereia onde Báquides acampou em 1 Macabeus pode ser o mesmo lugar."
    - "Hoje el-Bireh é uma cidade palestina de cerca de 50.000 habitantes, geminada com Ramallah, enquanto Khirbet el-Burj é uma ruína na borda dos subúrbios do norte de Jerusalém. Qualquer que seja a certa, Beerote era uma pequena cidade benjamita e, além da história do assassinato de Is-Bosete, a Bíblia pouco diz dela."
  de:
    - "Beerot, „Brunnen“, war eine der vier Städte der Hiwiter, die Josua zu einem Bündnis überlisteten: „Gibeon, Kaphira, Beeroth und Kirjath-Jearim“. Es lag in Benjamin, neben Gibeon und Rama aufgeführt. Seine Leute waren zu Davids Zeit noch eine eigene Gruppe: Baana und Rechab, „Söhne Rimmons, des Beerothiters“, ermordeten Isch-Boschet in seinem Bett und brachten seinen Kopf zu David, der sie töten ließ; der Verfasser fügt hinzu, „Beeroth ward auch unter Benjamin gerechnet“, und die Beerotiter seien nach Gittajim geflohen. Nahrai der Beerotiter war Joabs Waffenträger. Nach dem Exil kehrten 743 Männer von Kirjat-Jearim, Kefira und Beerot heim."
    - "Wo Beerot stand, ist umstritten, und die Karte hält die Kandidaten fest. Eusebius setzte es unterhalb von Gibeon, sieben Meilen von Jerusalem an der Straße nach Nikopolis (Emmaus), was westlich der Stadt weist; Hieronymus schrieb in seiner Übersetzung stattdessen Neapolis (Sichem), was nach Norden weist. Edward Robinson wählte 1838 el-Bire bei Ramallah, 15 km nördlich von Jerusalem, wo die Straße Jerusalem–Sichem vorbeiführt und eine Quelle und eine Kreuzfahrerkirche stehen; Ras et-Tahune ist der antike Hügel darin. Andere ziehen, Eusebius folgend, Chirbet el-Burdsch oder Biddu auf dem Höhenzug nordwestlich von Jerusalem nahe Nebi Samwil vor oder Nebi Samwil selbst, wo die Grabung Reste der Eisenzeit fand. Die Frage ist nicht entschieden, und das Beröa, wo Bakchides im 1. Makkabäerbuch lagerte, kann derselbe Ort sein."
    - "Heute ist el-Bire eine palästinensische Stadt von etwa 50 000 Einwohnern, mit Ramallah verbunden, während Chirbet el-Burdsch eine Ruine am Rand der nördlichen Vororte Jerusalems ist. Welches auch zutrifft, Beerot war eine kleine benjaminitische Stadt, und außer der Geschichte vom Mord an Isch-Boschet hat die Bibel wenig über sie zu sagen."
  fr:
    - "Beéroth, « puits », était l’une des quatre villes des Héviens qui trompèrent Josué pour obtenir un traité : « Gabaon, Kephira, Beéroth et Kirjath-Jearim ». Elle tombait dans Benjamin, citée à côté de Gabaon et de Rama. Ses habitants formaient encore un groupe distinct au temps de David : Baana et Récab, « fils de Rimmon de Beéroth », assassinèrent Isch-Boscheth dans son lit et portèrent sa tête à David, qui les fit tuer ; l’auteur ajoute que « Beéroth était regardée comme faisant partie de Benjamin » et que les Beérothites s’étaient enfuis à Guitthaïm. Naharaï de Beéroth était l’écuyer de Joab. Après l’exil, 743 hommes de Kirjath-Jearim, de Képhira et de Beéroth revinrent."
    - "L’emplacement de Beéroth est discuté, et la carte garde les candidats. Eusèbe la plaçait sous Gabaon, à sept milles de Jérusalem sur la route de Nicopolis (Emmaüs), ce qui indique l’ouest de la ville ; Jérôme, le traduisant, écrivit Néapolis (Sichem) à la place, ce qui indique le nord. Edward Robinson en 1838 choisit el-Bireh près de Ramallah, à 15 km au nord de Jérusalem, où passe la route de Jérusalem à Sichem et où se trouvent une source et une église croisée ; Ras et-Tahuneh est le tertre antique qu’elle englobe. D’autres, suivant Eusèbe, préfèrent Khirbet el-Burj ou Biddu sur la crête au nord-ouest de Jérusalem près de Nebi Samwil, ou Nebi Samwil même, où la fouille a trouvé des vestiges de l’âge du Fer. La question n’est pas tranchée, et la Bérée où campa Bacchidès dans 1 Maccabées peut être le même lieu."
    - "Aujourd’hui el-Bireh est une ville palestinienne d’environ 50 000 habitants, jumelée à Ramallah, tandis que Khirbet el-Burj est une ruine à la lisière des faubourgs nord de Jérusalem. Quelle que soit la bonne, Beéroth était une petite ville benjaminite, et hors l’histoire du meurtre d’Isch-Boscheth, la Bible en dit peu."
