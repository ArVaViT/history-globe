# Overview article (ADR 0007). Mainstream facts only; the location is disputed and the map's candidates are given without choosing one.
id: beeroth
place: a046454
title:
  en: "Beeroth"
  ru: "Беероф"
  uk: "Беерот"
  es: "Beerot"
