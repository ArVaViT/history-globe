body:
  en:
    - "Beeroth, “wells”, was one of the four towns of the Hivites who tricked Joshua into a treaty: “Gibeon, and Chephirah, and Beeroth, and Kirjath-jearim”. It fell within Benjamin, listed beside Gibeon and Ramah. Its people were still a distinct group in David's time: Baanah and Rechab, “the sons of Rimmon a Beerothite”, murdered Ish-bosheth in his bed and carried his head to David, who had them killed; the writer adds that Beeroth “was reckoned to Benjamin” and that the Beerothites had fled to Gittaim. Naharai the Beerothite was Joab's armour-bearer. After the exile 743 men of Kiriath-jearim, Chephirah and Beeroth came home."
    - "Where Beeroth stood is disputed, and the map keeps the candidates. Eusebius placed it under Gibeon, seven miles from Jerusalem on the road to Nicopolis (Emmaus), which points west of the city; Jerome, translating him, wrote Neapolis (Shechem) instead, which points north. Edward Robinson in 1838 chose el-Bireh beside Ramallah, 15 km north of Jerusalem, where the Jerusalem-Shechem road passes and where a spring and a Crusader church stand; Ras et-Tahuneh is the ancient mound within it. Others, following Eusebius, prefer Khirbet el-Burj or Biddu on the ridge north-west of Jerusalem near Nebi Samwil, or Nebi Samwil itself, where excavation found remains of the Iron Age. The question is not settled, and the Berea where Bacchides camped in 1 Maccabees may be the same place."
    - "Today el-Bireh is a Palestinian city of some 50,000, twinned with Ramallah, while Khirbet el-Burj is a ruin on the edge of Jerusalem's northern suburbs. Whichever is right, Beeroth was a small Benjaminite town, and apart from the story of Ish-bosheth's murder the Bible has little to say of it."
  ru:
    - "Беероф, «колодцы», был одним из четырёх городов Евеев, хитростью заключивших союз с Иисусом Навином: «Гаваон, Кефира, Беероф и Кириаф-Иарим». Он вошёл в удел Вениамина и назван рядом с Гаваоном и Рамой. Во времена Давида его жители ещё были особой группой: Баана и Рихав, «сыновья Реммона Беерофянина», убили Иевосфея в постели и принесли его голову Давиду, который велел их казнить; писатель добавляет, что «Беероф причислялся к Вениамину» и что Беерофяне убежали в Гиффаим. Нахарай Беерофянин был оруженосцем Иоава. После плена вернулись семьсот сорок три уроженца Кириаф-Иарима, Кефиры и Беерофа."
    - "Где стоял Беероф, спорно, и карта хранит кандидатов. Евсевий помещал его под Гаваоном, в семи милях от Иерусалима по дороге в Никополь (Эммаус), то есть к западу от города; Иероним, переводя его, написал вместо этого Неаполь (Сихем), то есть к северу. Эдвард Робинсон в 1838 году выбрал Эль-Биру рядом с Рамаллой, в 15 км к северу от Иерусалима, где проходит дорога из Иерусалима в Сихем и стоят источник и церковь крестоносцев; древний холм внутри города — Рас-эт-Тахуне. Другие, следуя Евсевию, предпочитают Хирбет-эль-Бурдж или Бидду на гряде к северо-западу от Иерусалима близ Наби-Самвиля или сам Наби-Самвиль, где раскопки нашли остатки железного века. Вопрос не решён; возможно, то же место — Берея, где стоял станом Вакхид в Первой книге Маккавейской."
    - "Сегодня Эль-Бира — палестинский город примерно на 50 тысяч жителей, сросшийся с Рамаллой, а Хирбет-эль-Бурдж — руины на краю северных окраин Иерусалима. Как бы ни решился спор, Беероф был небольшим вениамитским городком, и, кроме рассказа об убийстве Иевосфея, Библии почти нечего о нём сказать."
  uk:
    - "Беерот, «колодязі», було одним із чотирьох міст хіввеїв, які обманом уклали договір з Ісусом Навином: «Габаон, Кафира, Беерот і Кириятярим». Воно припадало на Веніямина, назване поряд з Гаваоном і Рамою. Його мешканці ще були окремою групою за Давида: Баана і Ріхав, «сини Реммона Бееротянина», вбили Ішбошета на його ліжку й віднесли його голову Давидові, який їх стратив; автор додає, що «й Беерот прилїчено до Бенямина» і що «Бееротяне повтїкали в Гиттаїм». Нахарай Бееротянин був зброєносцем Йоава. Після вигнання повернулося 743 мужі з Кіріят-Єаріма, Кефіри та Беерота."
    - "Де стояв Беерот, спірне, і мапа зберігає кандидатів. Євсевій розмістив його під Гаваоном, за сім миль від Єрусалима на дорозі до Нікополя (Еммаусу), що вказує на захід від міста; Єронім, перекладаючи його, написав натомість Неаполь (Сихем), що вказує на північ. Едвард Робінсон у 1838 році обрав ель-Бірех поряд з Рамаллою, за 15 км на північ від Єрусалима, де проходить дорога Єрусалим — Сихем і де є джерело та хрестоносна церква; Рас-ет-Тахуне — давній пагорб у ньому. Інші, слідом за Євсевієм, віддають перевагу Хірбет-ель-Бурджу чи Бідду на хребті на північний захід від Єрусалима біля Неби-Самуїла, або самому Неби-Самуїлу, де розкопки знайшли рештки залізної доби. Питання не вирішене, і Верія, де таборував Бакхід у 1-й книзі Маккавеїв, може бути тим самим місцем."
    - "Нині ель-Бірех — палестинське місто приблизно з 50 000 мешканців, побратим Рамалли, а Хірбет-ель-Бурдж — руїна на краю північних передмість Єрусалима. Котре б не було правильним, Беерот було невеликим веніяминським містом, і крім розповіді про вбивство Ішбошета Біблія мало що про нього каже."
  es:
    - "Beerot, «pozos», fue una de las cuatro ciudades de los heveos que engañaron a Josué para obtener un tratado: «Gabaón, Caphira, Beeroth, y Chiriath-jearim». Caía dentro de Benjamín, enumerada junto a Gabaón y Ramá. Su gente seguía siendo un grupo distinto en tiempos de David: Baana y Recab, «hijos de Rimmón Beerothita», asesinaron a Is-boset en su lecho y llevaron su cabeza a David, que los hizo matar; el escritor añade que Beerot «era contada con Benjamín» y que los beerotitas habían huido a Gitaim. Naharai el beerotita fue el escudero de Joab. Tras el exilio, 743 hombres de Quiriat-jearim, Cafira y Beerot volvieron a casa."
    - "Se discute dónde estuvo Beerot, y el mapa conserva los candidatos. Eusebio la situó bajo Gabaón, a siete millas de Jerusalén en el camino a Nicópolis (Emaús), lo que apunta al oeste de la ciudad; Jerónimo, al traducirlo, escribió en cambio Neápolis (Siquem), lo que apunta al norte. Edward Robinson, en 1838, eligió el-Bireh, junto a Ramala, a 15 km al norte de Jerusalén, por donde pasa el camino de Jerusalén a Siquem y donde se alzan un manantial y una iglesia cruzada; Ras et-Tahuneh es el antiguo montículo dentro de ella. Otros, siguiendo a Eusebio, prefieren Khirbet el-Burj o Biddu, en la cresta al noroeste de Jerusalén cerca de Nebi Samwil, o la propia Nebi Samwil, donde la excavación halló restos de la edad del Hierro. La cuestión no está resuelta, y la Berea donde acampó Báquides en 1 Macabeos puede ser el mismo lugar."
    - "Hoy el-Bireh es una ciudad palestina de unos 50 000 habitantes, hermanada con Ramala, mientras que Khirbet el-Burj es una ruina en el borde de los suburbios septentrionales de Jerusalén. Sea cual sea la correcta, Beerot fue una pequeña ciudad de Benjamín, y aparte de la historia del asesinato de Is-boset la Biblia tiene poco que decir de ella."
  pt:
    - "Beerote, “poços”, era uma das quatro cidades dos heveus que enganaram Josué para obter um tratado: “Gibeom, Cefira, Beerote e Quiriate-Jearim”. Ficava dentro de Benjamim, listada ao lado de Gibeão e Ramá. Seu povo ainda era um grupo distinto no tempo de Davi: Baaná e Recabe, “filhos de Rimom, o beerotita”, mataram Is-Bosete em sua cama e levaram sua cabeça a Davi, que os mandou matar; o escritor acrescenta que “Beerote também é considerada parte de Benjamim” e que “os beerotitas fugiram para Gitaim”. Naarai, o beerotita, era escudeiro de Joabe. Depois do exílio, 743 homens de Quiriate-Jearim, Quefira e Beerote voltaram para casa."
    - "Onde Beerote ficava é discutido, e o mapa guarda os candidatos. Eusébio a pôs sob Gibeão, a sete milhas de Jerusalém, na estrada de Nicópolis (Emaús), o que aponta a oeste da cidade; Jerônimo, traduzindo-o, escreveu Neápolis (Siquém), o que aponta ao norte. Edward Robinson, em 1838, escolheu el-Bireh, junto a Ramallah, 15 km ao norte de Jerusalém, por onde passa a estrada Jerusalém–Siquém e onde há uma fonte e uma igreja cruzada; Ras et-Tahuneh é o antigo montículo dentro dela. Outros, seguindo Eusébio, preferem Khirbet el-Burj ou Biddu, na crista a noroeste de Jerusalém, perto de Nebi Samwil, ou a própria Nebi Samwil, onde a escavação achou restos da Idade do Ferro. A questão não está resolvida, e a Bereia onde Báquides acampou em 1 Macabeus pode ser o mesmo lugar."
    - "Hoje el-Bireh é uma cidade palestina de cerca de 50.000 habitantes, geminada com Ramallah, enquanto Khirbet el-Burj é uma ruína na borda dos subúrbios do norte de Jerusalém. Qualquer que seja a certa, Beerote era uma pequena cidade benjamita e, além da história do assassinato de Is-Bosete, a Bíblia pouco diz dela."
  de:
    - "Beerot, „Brunnen“, war eine der vier Städte der Hiwiter, die Josua zu einem Bündnis überlisteten: „Gibeon, Kaphira, Beeroth und Kirjath-Jearim“. Es lag in Benjamin, neben Gibeon und Rama aufgeführt. Seine Leute waren zu Davids Zeit noch eine eigene Gruppe: Baana und Rechab, „Söhne Rimmons, des Beerothiters“, ermordeten Isch-Boschet in seinem Bett und brachten seinen Kopf zu David, der sie töten ließ; der Verfasser fügt hinzu, „Beeroth ward auch unter Benjamin gerechnet“, und die Beerotiter seien nach Gittajim geflohen. Nahrai der Beerotiter war Joabs Waffenträger. Nach dem Exil kehrten 743 Männer von Kirjat-Jearim, Kefira und Beerot heim."
    - "Wo Beerot stand, ist umstritten, und die Karte hält die Kandidaten fest. Eusebius setzte es unterhalb von Gibeon, sieben Meilen von Jerusalem an der Straße nach Nikopolis (Emmaus), was westlich der Stadt weist; Hieronymus schrieb in seiner Übersetzung stattdessen Neapolis (Sichem), was nach Norden weist. Edward Robinson wählte 1838 el-Bire bei Ramallah, 15 km nördlich von Jerusalem, wo die Straße Jerusalem–Sichem vorbeiführt und eine Quelle und eine Kreuzfahrerkirche stehen; Ras et-Tahune ist der antike Hügel darin. Andere ziehen, Eusebius folgend, Chirbet el-Burdsch oder Biddu auf dem Höhenzug nordwestlich von Jerusalem nahe Nebi Samwil vor oder Nebi Samwil selbst, wo die Grabung Reste der Eisenzeit fand. Die Frage ist nicht entschieden, und das Beröa, wo Bakchides im 1. Makkabäerbuch lagerte, kann derselbe Ort sein."
    - "Heute ist el-Bire eine palästinensische Stadt von etwa 50 000 Einwohnern, mit Ramallah verbunden, während Chirbet el-Burdsch eine Ruine am Rand der nördlichen Vororte Jerusalems ist. Welches auch zutrifft, Beerot war eine kleine benjaminitische Stadt, und außer der Geschichte vom Mord an Isch-Boschet hat die Bibel wenig über sie zu sagen."
  fr:
    - "Beéroth, « puits », était l’une des quatre villes des Héviens qui trompèrent Josué pour obtenir un traité : « Gabaon, Kephira, Beéroth et Kirjath-Jearim ». Elle tombait dans Benjamin, citée à côté de Gabaon et de Rama. Ses habitants formaient encore un groupe distinct au temps de David : Baana et Récab, « fils de Rimmon de Beéroth », assassinèrent Isch-Boscheth dans son lit et portèrent sa tête à David, qui les fit tuer ; l’auteur ajoute que « Beéroth était regardée comme faisant partie de Benjamin » et que les Beérothites s’étaient enfuis à Guitthaïm. Naharaï de Beéroth était l’écuyer de Joab. Après l’exil, 743 hommes de Kirjath-Jearim, de Képhira et de Beéroth revinrent."
    - "L’emplacement de Beéroth est discuté, et la carte garde les candidats. Eusèbe la plaçait sous Gabaon, à sept milles de Jérusalem sur la route de Nicopolis (Emmaüs), ce qui indique l’ouest de la ville ; Jérôme, le traduisant, écrivit Néapolis (Sichem) à la place, ce qui indique le nord. Edward Robinson en 1838 choisit el-Bireh près de Ramallah, à 15 km au nord de Jérusalem, où passe la route de Jérusalem à Sichem et où se trouvent une source et une église croisée ; Ras et-Tahuneh est le tertre antique qu’elle englobe. D’autres, suivant Eusèbe, préfèrent Khirbet el-Burj ou Biddu sur la crête au nord-ouest de Jérusalem près de Nebi Samwil, ou Nebi Samwil même, où la fouille a trouvé des vestiges de l’âge du Fer. La question n’est pas tranchée, et la Bérée où campa Bacchidès dans 1 Maccabées peut être le même lieu."
    - "Aujourd’hui el-Bireh est une ville palestinienne d’environ 50 000 habitants, jumelée à Ramallah, tandis que Khirbet el-Burj est une ruine à la lisière des faubourgs nord de Jérusalem. Quelle que soit la bonne, Beéroth était une petite ville benjaminite, et hors l’histoire du meurtre d’Isch-Boscheth, la Bible en dit peu."
  it:
    - "Beeròt, «pozzi», era una delle quattro città degli Evei che ingannarono Giosuè con un trattato: «Gabaon, Kefira, Beeroth e Kiriath-Jearim». Rientrava in Beniamino, elencata accanto a Gabaon e Rama. La sua gente era ancora un gruppo distinto ai tempi di Davide: Baana e Recab, «I figliuoli di Rimmon Beerothita», uccisero Is-Baal nel suo letto e portarono la sua testa a Davide, che li fece uccidere; lo scrittore aggiunge che Beeroth «è considerata come appartenente a Beniamino» e che i Beerotiti si erano rifugiati a Ghittaim. Naarai il Beerotita era lo scudiero di Ioab. Dopo l’esilio 743 uomini di Kiriat-Iearim, Chefira e Beeròt tornarono a casa."
    - "Dove sorgesse Beeròt è discusso, e la carta conserva i candidati. Eusebio la pose sotto Gabaon, a sette miglia da Gerusalemme sulla strada per Nicopoli (Emmaus), il che indica a ovest della città; Girolamo, traducendolo, scrisse invece Neapoli (Sichem), il che indica a nord. Edward Robinson nel 1838 scelse el-Bireh presso Ramallah, a 15 km a nord di Gerusalemme, dove passa la strada Gerusalemme-Sichem e dove sorgono una sorgente e una chiesa crociata; Ras et-Tahuneh è l’antico tell al suo interno. Altri, seguendo Eusebio, preferiscono Khirbet el-Burj o Biddu sulla cresta a nord-ovest di Gerusalemme presso Nebi Samwil, o la stessa Nebi Samwil, dove lo scavo ha trovato resti dell’età del Ferro. La questione non è risolta, e la Berea dove si accampò Bacchide in 1 Maccabei può essere lo stesso luogo."
    - "Oggi el-Bireh è una città palestinese di circa 50.000 abitanti, gemellata con Ramallah, mentre Khirbet el-Burj è una rovina al margine dei sobborghi settentrionali di Gerusalemme. Quale che sia giusta, Beeròt era una piccola città beniaminita, e oltre al racconto dell’uccisione di Is-Baal la Bibbia ne dice poco."
  pl:
    - "Beerot, „studnie”, było jednym z czterech miast Chiwwitów, którzy podstępem wymogli na Jozuem układ: „Gabaon, i Kafira, i Beerot, i Karyjatyjarym”. Leżało w Beniaminie, wymienione obok Gibeonu i Rama. Jego mieszkańcy byli nadal odrębną grupą za Dawida: Baana i Rechab, „synowie Remmona Berotczyka”, zamordowali Isz-Boszeta w jego łożu i zanieśli jego głowę Dawidowi, który kazał ich zabić; autor dodaje, że „Berot policzon był w Benjaminie” i że Beerotczycy uciekli do Gittaim. Nacharaj z Beerot był giermkiem Joaba. Po wygnaniu 743 mężów z Kiriat-Jearim, Kefiry i Beerot wróciło do domu."
    - "Gdzie stało Beerot, jest sporne, a mapa zachowuje kandydatów. Euzebiusz umieścił je pod Gibeonem, siedem mil od Jerozolimy na drodze do Nikopolis (Emaus), co wskazuje na zachód od miasta; Hieronim, tłumacząc go, napisał zamiast tego Neapolis (Sychem), co wskazuje na północ. Edward Robinson w 1838 roku wybrał el-Bireh obok Ramallah, 15 km na północ od Jerozolimy, gdzie przebiega droga Jerozolima–Sychem i gdzie stoją źródło i kościół krzyżowców; Ras et-Tahuneh jest tam dawnym tellem. Inni, idąc za Euzebiuszem, wolą Chirbet el-Burj lub Biddu na grzbiecie na północny zachód od Jerozolimy koło Nebi Samwil albo samo Nebi Samwil, gdzie wykopaliska znalazły pozostałości z epoki żelaza. Kwestia nie jest rozstrzygnięta, a Berea, gdzie obozował Bakchides w 1 Księdze Machabejskiej, może być tym samym miejscem."
    - "Dziś el-Bireh jest palestyńskim miastem liczącym około 50 000 mieszkańców, bliźniaczym miastem Ramallah, a Chirbet el-Burj ruiną na skraju północnych przedmieść Jerozolimy. Które z nich jest właściwe, Beerot było małym miastem beniaminickim i poza historią zabójstwa Isz-Boszeta Biblia niewiele o nim mówi."
  nl:
    - "Beërot, “putten”, was een van de vier steden van de Chivvieten die Jozua misleidden tot een verdrag: “Gibeon, en Chefira, en Beeroth, en Kirjath-Jearim”. Het viel binnen Benjamin, genoemd naast Gibeon en Rama. Zijn bewoners waren in Davids tijd nog een afzonderlijke groep: Baäna en Rekab, “zonen van Rimmon, den Beerothiet”, vermoordden Isboset in zijn bed en brachten zijn hoofd naar David, die hen liet doden; de schrijver voegt toe dat Beërot “aan Benjamin gerekend” werd en dat de Beërothieten naar Gitthaim waren gevlucht. Nacharai de Beërothiet was Joabs wapendrager. Na de ballingschap kwamen 743 mannen van Kirjat-Jearim, Kefira en Beërot thuis."
    - "Waar Beërot stond, is omstreden, en de kaart bewaart de kandidaten. Eusebius plaatste het onder Gibeon, zeven mijl van Jeruzalem aan de weg naar Nicopolis (Emmaüs), wat ten westen van de stad wijst; Hieronymus, hem vertalend, schreef in plaats daarvan Neapolis (Sichem), wat naar het noorden wijst. Edward Robinson koos in 1838 el-Bireh naast Ramallah, 15 km ten noorden van Jeruzalem, waar de weg Jeruzalem-Sichem langs komt en waar een bron en een kruisvaarderskerk staan; Ras et-Tahuneh is de oude heuvel erin. Anderen, Eusebius volgend, verkiezen Khirbet el-Burj of Biddu op de bergrug ten noordwesten van Jeruzalem bij Nebi Samwil, of Nebi Samwil zelf, waar opgraving resten uit de ijzertijd vond. De kwestie is niet beslecht, en het Berea waar Bacchides kampeerde in 1 Makkabeeën kan dezelfde plaats zijn."
    - "Tegenwoordig is el-Bireh een Palestijnse stad van zo’n 50.000 inwoners, verbonden met Ramallah, terwijl Khirbet el-Burj een ruïne is aan de rand van Jeruzalems noordelijke voorsteden. Welke ook de juiste is, Beërot was een kleine Benjaminitische stad, en afgezien van het verhaal van Isbosets moord heeft de Bijbel er weinig over te zeggen."
  cs:
    - "Beerót, „studny“, bylo jedním ze čtyř hivejských měst, která oklamala Jozue k smlouvě: „města pak jejich byla Gabaon a Kafira a Berot a Kariatjeharim“. Připadlo do Benjamína, uvedeno vedle Gibeonu a Rámy: „Gabaon, Ráma a Berot“. Jeho lid byl ještě za Davida zvláštní skupinou: Baana a Rekab, „synové Remmona Berotského“, zavraždili Íš-bošeta na lůžku a donesli jeho hlavu Davidovi, který je dal zabít; pisatel dodává, že Beerót „počítá se v Beniaminovi“ a že „Utekli pak byli Berotští do Gittaim“. Nacharaj Beerótský byl Joábův zbrojnoš. Po vyhnanství se vrátilo domů 743 mužů z Kirjat-jearímu, Kefíry a Beerótu."
    - "Kde Beerót stál, je sporné a mapa uchovává kandidáty. Eusebios jej umístil pod Gibeon, sedm mil od Jeruzaléma na silnici do Nikopole (Emauz), což ukazuje na západ od města; Jeroným, který jej překládal, napsal místo toho Neapolis (Šekem), což ukazuje na sever. Edward Robinson roku 1838 zvolil el-Bireh vedle Rámalláhu, 15 km severně od Jeruzaléma, kudy prochází silnice Jeruzalém–Šekem a kde stojí pramen a křižácký kostel; Ras et-Tahuneh je starověký pahorek v něm. Jiní, následující Eusebia, dávají přednost Chirbet el-Burj nebo Biddu na hřebeni severozápadně od Jeruzaléma poblíž Nebi Samwil, nebo samotnému Nebi Samwil, kde vykopávky našly zbytky z doby železné. Otázka není vyřešena a Beroia, kde se utábořil Bakchidés v První knize Makabejské, může být totéž místo."
    - "Dnes je el-Bireh palestinské město asi o 50 000 obyvatelích, srostlé s Rámalláhem, kdežto Chirbet el-Burj je zřícenina na okraji severních předměstí Jeruzaléma. Ať je pravda kterákoli, Beerót byl malým benjamínským městem a kromě příběhu o vraždě Íš-bošeta o něm Bible mnoho neříká."
  sv:
    - "Beerot, ”brunnar”, var en av de fyra hivitiska städer vars folk lurade Josua till ett fördrag: ”Gibeon, Kefira, Beerot och Kirjat-Jearim”. Den låg inom Benjamin, upptagen bredvid Gibeon och Rama. Dess folk var ännu en särskild grupp på Davids tid: Baana och Rekav, ”beerotiten Rimmons söner”, mördade Ish-Boshet i hans säng och bar hans huvud till David, som lät döda dem; skribenten tillägger att ”också Beerot räknas till Benjamin” och att beerotiterna hade flytt till Gittajim. Beerotiten Nachraj var Joavs vapendragare. Efter exilen kom 743 män från Kirjat-Jearim, Kefira och Beerot hem."
    - "Var Beerot låg är omstritt, och kartan behåller kandidaterna. Eusebios placerade den under Gibeon, sju romerska mil från Jerusalem på vägen till Nikopolis (Emmaus), vilket pekar väster om staden; Hieronymus, som översatte honom, skrev i stället Neapolis (Shekem), vilket pekar norrut. Edward Robinson valde 1838 el-Bireh vid Ramallah, 15 km norr om Jerusalem, där vägen Jerusalem–Shekem passerar och där en källa och en korsfararkyrka står; Ras et-Tahuneh är den antika kullen inom den. Andra, som följer Eusebios, föredrar Khirbet el-Burj eller Biddu på åsen nordväst om Jerusalem nära Nebi Samwil, eller Nebi Samwil självt, där utgrävning fann lämningar från järnåldern. Frågan är inte avgjord, och Beroia där Bakchides lägrade i Första Mackabeerboken kan vara samma plats."
    - "I dag är el-Bireh en palestinsk stad med omkring 50 000 invånare, tvillingstad med Ramallah, medan Khirbet el-Burj är en ruin i utkanten av Jerusalems norra förorter. Vilken som än har rätt var Beerot en liten benjaminitisk stad, och utöver berättelsen om mordet på Ish-Boshet har Bibeln litet att säga om den."
  nb:
    - "Beerot, «brønner», var en av de fire hevittbyene som lurte Josva til en pakt: «det var Gibeon og Hakkefira og Be'erot og Kirjat-Jearim». Den falt innenfor Benjamin, oppført ved siden av Gibeon og Rama. Folket var fortsatt en egen gruppe i Davids tid: Baana og Rekab, «be'erotitten Rimmons sønner», myrdet Isjbosjet i sengen og brakte hodet hans til David, som lot dem drepe; skribenten tilføyer at «Be'erot regnedes også til Benjamin» og at «be'erotittene var flyktet til Gitta'im». «Be'erotitten Naharai» var Joabs våpensvenn. Etter eksilet vendte 743 menn fra Kirjat-Jearim, Kefira og Beerot hjem."
    - "Hvor Beerot lå, er omstridt, og kartet beholder kandidatene. Eusebius plasserte den under Gibeon, sju romerske mil fra Jerusalem på veien til Nikopolis (Emmaus), noe som peker vest for byen; Hieronymus, som oversatte ham, skrev Neapolis (Sikem) i stedet, noe som peker nordover. Edward Robinson valgte i 1838 el-Bireh ved Ramallah, 15 km nord for Jerusalem, der veien Jerusalem–Sikem går og der en kilde og en korsfarerkirke står; Ras et-Tahuneh er den gamle tellen innenfor den. Andre, i tråd med Eusebius, foretrekker Khirbet el-Burj eller Biddu på ryggen nordvest for Jerusalem nær Nebi Samwil, eller Nebi Samwil selv, der utgravning fant levninger fra jernalderen. Spørsmålet er ikke avgjort, og Berøa der Bacchides slo leir i 1. Makkabeerbok kan være det samme stedet."
    - "I dag er el-Bireh en palestinsk by på omkring 50 000, vennskapsby med Ramallah, mens Khirbet el-Burj er en ruin i kanten av Jerusalems nordlige forsteder. Uansett hva som er riktig, var Beerot en liten benjaminittby, og utenom fortellingen om drapet på Isjbosjet har Bibelen lite å si om den."
  tl:
    - "Ang Beeroth, “mga balon”, ay isa sa apat na bayan ng mga Heveo na nanlinlang kay Josue upang makipagtipan: “Gabaon, Caphira, at Beeroth, at Kiriath-jearim”. Nasa loob ito ng Benjamin, nakalista katabi ng Gabaon at Rama. Natatanging pangkat pa rin ang mga tao nito noong panahon ni David: sina Baana at Rechab, “mga anak ni Rimmon na Beerothita”, ay pumatay kay Is-boseth sa kaniyang higaan at nagdala ng ulo niya kay David, na nagpapatay sa kanila; idinadagdag ng manunulat na ang Beeroth ay “ibinilang sa Benjamin” at tumakas ang mga Beerothita sa Githaim. Si Naharai na Beerothita ang tagadala ng sandata ni Joab. Pagkatapos ng pagkabihag, 743 lalaki ng Kiriath-jearim, Caphira at Beeroth ang umuwi."
    - "Pinagtatalunan kung saan nakatayo ang Beeroth, at iniingatan ng mapa ang mga kandidato. Inilagay ito ni Eusebio sa ilalim ng Gabaon, pitong milya mula Jerusalem sa daan patungong Nicopolis (Emaus), kanluran ng lungsod; si Jeronimo, na nagsalin sa kaniya, ay sumulat ng Neapolis (Sichem), hilaga. Pinili ni Edward Robinson noong 1838 ang el-Bireh sa tabi ng Ramallah, 15 km sa hilaga ng Jerusalem, kung saan dumaraan ang daang Jerusalem–Sichem at nakatayo ang bukal at isang simbahang Krusado; ang Ras et-Tahuneh ang sinaunang burol dito. Mas gusto ng iba, na sumusunod kay Eusebio, ang Khirbet el-Burj o Biddu sa tagaytay sa hilagang-kanluran ng Jerusalem malapit sa Nebi Samwil, o ang Nebi Samwil mismo, kung saan nakatuklas ang paghuhukay ng mga labi ng Panahon ng Bakal. Hindi pa tiyak, at ang Berea kung saan nagkampo si Bacchides sa 1 Macabeo ay maaaring iisang lugar."
    - "Ang el-Bireh ay lungsod na Palestino na may mga 50,000 tao ngayon, kapatid-bayan ng Ramallah, habang ang Khirbet el-Burj ay guho sa gilid ng hilagang karatig-bayan ng Jerusalem. Alinman ang tama, ang Beeroth ay maliit na bayang Benjamita, at bukod sa salaysay ng pagpaslang kay Is-boseth, kaunti ang sinasabi ng Biblia tungkol dito."
  da:
    - "Be'erot, »brønde«, var en af de fire hivitiske byer, der narrede Josva til en traktat: »Gibeon og Kefira og Beeroth og Kirjath-Jearim«. Den lå inden for Benjamin, opregnet ved siden af Gibeon og Rama. Dens folk var stadig en særskilt gruppe i Davids tid: Baana og Rekab, »Beerothiteren Rimmons Sønner«, myrdede Isj-Bosjet i hans seng og bragte hans hoved til David, som lod dem dræbe; forfatteren tilføjer, at »Beeroth blev ogsaa regnet iblandt Benjamin«, og at be'erotitterne var flygtet til Gittajim. Naharaj be'erotiten var Joabs våbendrager. Efter eksilet vendte 743 mænd fra Kirjat-Jearim, Kefira og Be'erot hjem."
    - "Hvor Be'erot stod, er omstridt, og kortet beholder kandidaterne. Eusebius placerede det under Gibeon, syv romerske mil fra Jerusalem på vejen til Nikopolis (Emmaus), hvilket peger vest for byen; Hieronymus, der oversatte ham, skrev Neapolis (Sikem) i stedet, hvilket peger mod nord. Edward Robinson valgte i 1838 el-Bireh ved Ramallah, 15 km nord for Jerusalem, hvor vejen mellem Jerusalem og Sikem passerer, og hvor en kilde og en korsfarerkirke står; Ras et-Tahuneh er den gamle tell i den. Andre, efter Eusebius, foretrækker Khirbet el-Burj eller Biddu på højdedraget nordvest for Jerusalem nær Nebi Samwil, eller selve Nebi Samwil, hvor udgravning fandt levn fra jernalderen. Spørgsmålet er ikke afgjort, og den Berøa, hvor Bakkides lejrede sig i 1 Makkabæerbog, kan være det samme sted."
    - "I dag er el-Bireh en palæstinensisk by på omkring 50.000, tvillingeby med Ramallah, mens Khirbet el-Burj er en ruin i udkanten af Jerusalems nordlige forstæder. Hvilket der end er rigtigt, var Be'erot en lille benjaminitisk by, og ud over fortællingen om Isj-Bosjets mord har Bibelen lidt at sige om den."
  sr:
    - "Вирота, „студенци“, био је један од четири града Јевеја који су преварили Исуса да склопи уговор: „Гаваон и Кефира и Вирот и Киријат-Јарим“. Припадао је Венијамину, наведен поред Гаваона и Раме. Његови људи били су још посебна група у Давидово доба: Вана и Рихав, „синови Римона Вироћанина“, убили су Исвостеја у његовој постељи и однели његову главу Давиду, који их је дао погубити; писац додаје: „јер се и Вирот бројаше Венијамину“, и да су Вироћани побегли у Гитајим. Нареј Вироћанин био је Јоавов штитоноша. После изгнанства 743 човека из Киријат-Јарима, Кефире и Вироте вратило се кући."
    - "Где је Вирота стајала, спорно је, а карта чува кандидате. Јевсевије ју је сместио испод Гаваона, седам миља од Јерусалима на путу за Никопољ (Емаус), што упућује западно од града; Јероним, преводећи га, написао је уместо тога Неапољ (Сихем), што упућује на север. Едвард Робинсон је 1838. изабрао ел-Биру поред Рамале, 15 км северно од Јерусалима, где пролази пут Јерусалим–Сихем и где стоје извор и крсташка црква; Рас ет-Тахуне је древна хумка у њој. Други, следећи Јевсевија, дају предност Хирбет ел-Бурџу или Биди на гребену северозападно од Јерусалима близу Неби Самвила, или самом Неби Самвилу, где су ископавања нашла остатке гвозденог доба. Питање није решено, а Верија где се улогорио Вакхид у 1. Макавејској може бити исто место."
    - "Данас је ел-Бира палестински град од неких 50.000 становника, побратимљен с Рамалом, а Хирбет ел-Бурџ је рушевина на ободу северних предграђа Јерусалима. Које год да је тачно, Вирота је био мали венијаминовски град, а осим приче о убиству Исвостеја Библија о њему има мало да каже."
