# Overview article (ADR 0007). Mainstream facts only; the location is disputed and the map's candidates are given without choosing one; Hosea's Beth-aven is treated as the app does, as a name for Bethel.
id: beth-aven
place: a03cb21
title:
  en: "Beth-aven"
  ru: "Беф-Авен"
  uk: "Бет-Авен"
  es: "Bet-avén"
  pt: "Bete-Áven"
  de: "Bet-Awen"
  fr: "Beth-Aven"
  it: "Bet-Aven"
  pl: "Bet-Awen"
  nl: "Beth-Awen"
  cs: "Bét-aven"
  sv: "Bet-Aven"
  nb: "Bet-Aven"
body:
  en:
    - "Beth-aven, “house of wickedness” or “of nothingness”, was a place in the hills of Benjamin east of Bethel, towards the desert that drops to the Jordan. Joshua sent spies from Jericho “to Ai, which is beside Beth-aven, on the east side of Beth-el”; Benjamin's northern border ends “at the wilderness of Beth-aven”; and in Saul's war the Philistines “pitched in Michmash, eastward from Beth-aven”, until Jonathan's exploit turned the day and “the battle passed over unto Beth-aven”. Hosea, more than two centuries later, uses the name for Bethel itself, telling Israel “neither go ye up to Beth-aven” and mocking “the calves of Beth-aven”; the map keeps those verses with Bethel. Whether the Beth-aven of Joshua and Samuel was a real village whose ill-sounding name the prophet borrowed, or whether it was always a nickname for Bethel or for the ruin of Ai, is debated."
    - "Its site is disputed, and the map keeps the candidates. Those who take it for a separate town look for it on the ridge between Bethel and Michmash: Tell Maryam above Wadi Suweinit near Mukhmas, Burqa or Khirbet Nisieh south of Beitin, or El Q'ada; others identify it with Beitin, that is with Bethel, and a few have placed it as far west as Upper Beth-horon. The wilderness of Beth-aven would then be the bare eastern slope between Bethel and the Jordan valley. Nothing has been excavated as Beth-aven."
    - "The ground is today the hill country of the central West Bank around Beitin, Deir Dibwan and Mukhmas, north-east of Ramallah, with the desert of the Wadi Suweinit gorge falling away to the east."
  ru:
    - "Беф-Авен, «дом нечестия» или «дом пустоты», — место в горах Вениамина к востоку от Вефиля, в сторону пустыни, спускающейся к Иордану. Иисус Навин послал из Иерихона соглядатаев «в Гай, что близ Беф-Авена, с восточной стороны Вефиля»; северный предел Вениамина «оканчивается в пустыне Бефавен»; а в войну Саула Филистимляне «расположились станом в Михмасе, с восточной стороны Беф-Авена», пока подвиг Ионафана не переломил день: «битва же простерлась даже до Беф-Авена». Осия более двух веков спустя зовёт этим именем сам Вефиль, веля Израилю «не восходите в Беф-Авен» и насмехаясь: «За тельца Беф-Авена вострепещут жители Самарии»; на карте те стихи оставлены при Вефиле. Был ли Беф-Авен Иисуса Навина и Самуила настоящим селением, чьё дурное имя пророк позаимствовал, или это всегда было прозвище Вефиля или развалин Гая — спорно."
    - "Его место спорно, и карта хранит кандидатов. Те, кто считает его отдельным городком, ищут его на гряде между Вефилем и Михмасом: Телль-Марьям над Вади-Сувейнит близ Мухмаса, Бурка или Хирбет-Нисье к югу от Бейтина, или Эль-Каада; другие отождествляют его с Бейтином, то есть с Вефилем, а немногие помещали его даже в верхний Беф-Орон на западе. Пустыня Беф-Авен тогда — голый восточный склон между Вефилем и долиной Иордана. Ничто не раскопано как Беф-Авен."
    - "Эта земля сегодня — нагорье центральной части Западного берега вокруг Бейтина, Дейр-Дибвана и Мухмаса, к северо-востоку от Рамаллы, с пустыней ущелья Вади-Сувейнит, уходящей на восток."
  uk:
    - "Бет-Авен, «дім беззаконня» або «марноти», було місцем у пагорбах Веніяміна на схід від Бет-Елу, у бік пустелі, що спадає до Йордану. Ісус Навин послав розвідників з Єрихону «у Гай поблизу Бет-Авена, на схід сонця від Бетеля»; північний кордон Веніяміна кінчиться «степом Бет-Авенським»; а в війні Саула филистимляни «отаборились під Михмасом, на всхід від Бет-Авена», аж доки подвиг Йонатана не змінив ходу дня і «побоїще простягалось аж за Бет-Авену». Осія, понад двісті років потому, вживає ім'я для самого Бет-Елу, кажучи Ізраїлю «не йдїть у Бет-Авен» і глузуючи з «телця Бет-Авена»; мапа тримає ці вірші при Бет-Елі. Чи Бет-Авен Ісуса Навина і Самуїла був справжнім селом, чиє недобре звучне ім'я пророк позичив, чи він завжди був прізвиськом Бет-Елу або руїни Гая, дискутується."
    - "Його місце спірне, і мапа зберігає кандидатів. Ті, хто вважає його окремим містом, шукають його на хребті між Бет-Елом і Міхмасом: Телль-Мар'ям над вадієм Суейніт біля Мухмаса, Бурка чи Хірбет-Нісіє на південь від Бейтіна, чи Ель-Каада; інші ототожнюють його з Бейтіном, тобто з Бет-Елом, а деякі розміщували його аж на заході у Верхньому Бет-Хороні. Пустеля Бет-Авену була б тоді голим східним схилом між Бет-Елом і Йорданською долиною. Ніщо не розкопано як Бет-Авен."
    - "Нині ця місцевість — нагір'я центрального Західного берега навколо Бейтіна, Дейр-Дібвана й Мухмаса, на північний схід від Рамалли, із пустелею ущелини вадію Суейніт, що спадає на схід."
  es:
    - "Bet-avén, «casa de maldad» o «de nada», era un lugar de las colinas de Benjamín al este de Betel, hacia el desierto que desciende al Jordán. Josué envió espías desde Jericó «á Hai, que estaba junto á Beth-aven hacia el oriente de Beth-el»; la frontera septentrional de Benjamín termina «al desierto de Beth-aven»; y en la guerra de Saúl los filisteos «asentaron campo en Michmas, al oriente de Beth-aven», hasta que la hazaña de Jonatán cambió el día y «llegó el alcance hasta Beth-aven». Oseas, más de dos siglos después, usa el nombre para la propia Betel, diciendo a Israel «ni subáis á Beth-aven» y burlándose de «las becerras de Beth-aven»; el mapa conserva esos versículos con Betel. Se debate si el Bet-avén de Josué y Samuel fue una aldea real cuyo nombre de mal sonido tomó prestado el profeta, o si fue siempre un apodo de Betel o de la ruina de Hai."
    - "Su sitio se discute, y el mapa conserva los candidatos. Quienes la toman por una ciudad aparte la buscan en la cresta entre Betel y Micmas: Tell Maryam, sobre el uadi Suweinit, cerca de Mukhmas, Burqa o Khirbet Nisieh, al sur de Beitin, o El Q'ada; otros la identifican con Beitin, es decir, con Betel, y unos pocos la han situado tan al oeste como Bet-horón de Arriba. El desierto de Bet-avén sería entonces la ladera oriental desnuda entre Betel y el valle del Jordán. Nada ha sido excavado como Bet-avén."
    - "El terreno es hoy la región montañosa de la Cisjordania central en torno a Beitin, Deir Dibwan y Mukhmas, al nordeste de Ramala, con el desierto de la garganta del uadi Suweinit cayendo hacia el este."
  pt:
    - "Bete-Áven, “casa da maldade” ou “do nada”, era um lugar nas colinas de Benjamim, a leste de Betel, rumo ao deserto que desce ao Jordão. Josué enviou espiões de Jericó “a Ai, que fica perto de Bete-Áven, a leste de Betel”; a fronteira norte de Benjamim termina “no deserto de Bete-Áven”; e na guerra de Saul os filisteus “acamparam em Micmás, a leste de Bete-Áven”, até que o feito de Jônatas virou o dia e “a batalha estendeu-se para além de Bete-Áven”. Oseias, mais de dois séculos depois, usa o nome para a própria Betel, dizendo a Israel “nem subam a Bete-Áven” e zombando dos “bezerros de Bete-Áven”; o mapa guarda esses versículos com Betel. Se a Bete-Áven de Josué e Samuel era uma aldeia real cujo nome mal soante o profeta tomou emprestado, ou se foi sempre um apelido de Betel ou da ruína de Ai, é discutido."
    - "Seu sítio é discutido, e o mapa guarda os candidatos. Os que a tomam por uma cidade à parte a procuram na crista entre Betel e Micmás: Tell Maryam, acima do uádi Suweinit, perto de Mukhmas, Burqa ou Khirbet Nisieh, ao sul de Beitin, ou El Q'ada; outros a identificam com Beitin, isto é, com Betel, e alguns a puseram tão a oeste quanto Bete-Horom de Cima. O deserto de Bete-Áven seria então a encosta oriental nua entre Betel e o vale do Jordão. Nada foi escavado como Bete-Áven."
    - "O terreno é hoje a região montanhosa do centro da Cisjordânia em torno de Beitin, Deir Dibwan e Mukhmas, a nordeste de Ramallah, com o deserto da garganta do uádi Suweinit descendo para o leste."
  de:
    - "Bet-Awen, „Haus des Frevels“ oder „des Nichts“, war ein Ort im Bergland Benjamin östlich von Bethel, zur Wüste hin, die zum Jordan abfällt. Josua sandte Kundschafter von Jericho „gen Ai, das bei Beth-Aven liegt, gegen Morgen vor Beth-El“; Benjamins Nordgrenze endet „nach der Wüste Beth-Aven“; und in Sauls Krieg lagerten die Philister „zu Michmas, gegen Morgen vor Beth-Aven“, bis Jonatans Tat den Tag wendete und „der Streit währte bis gen Beth-Aven“. Hosea, mehr als zwei Jahrhunderte später, gebraucht den Namen für Bethel selbst, wenn er Israel sagt: „kommt nicht hinauf gen Beth-Aven“, und „das Kalb zu Beth-Aven“ verspottet; die Karte hält diese Verse bei Bethel. Ob das Bet-Awen bei Josua und Samuel ein wirkliches Dorf war, dessen schlecht klingenden Namen der Prophet entlehnte, oder immer ein Spitzname für Bethel oder die Ruine von Ai, ist umstritten."
    - "Seine Stätte ist umstritten, und die Karte hält die Kandidaten fest. Wer es für eine eigene Stadt hält, sucht es auf dem Höhenzug zwischen Bethel und Michmas: Tell Maryam über dem Wadi Suweinit bei Muchmas, Burqa oder Chirbet Nisiye südlich von Beitin oder El Q'ada; andere setzen es mit Beitin gleich, also mit Bethel, und einige haben es bis hinüber ins Obere Bet-Horon gesetzt. Die Wüste von Bet-Awen wäre dann der kahle Osthang zwischen Bethel und dem Jordantal. Nichts wurde als Bet-Awen ausgegraben."
    - "Das Gelände ist heute das Bergland des zentralen Westjordanlands um Beitin, Deir Dibwan und Muchmas, nordöstlich von Ramallah, mit der Wüste der Schlucht des Wadi Suweinit, die nach Osten abfällt."
  fr:
    - "Beth-Aven, « maison de méchanceté » ou « de néant », était un lieu des collines de Benjamin à l’est de Béthel, vers le désert descendant au Jourdain. Josué envoya des espions de Jéricho « vers Aï, qui est près de Beth-Aven, à l’orient de Béthel » ; la frontière nord de Benjamin aboutit « au désert de Beth-Aven » ; et dans la guerre de Saül les Philistins vinrent « camper à Micmasch, à l’orient de Beth-Aven », jusqu’à ce que l’exploit de Jonathan retourne la journée, quand « le combat se prolongea jusqu’au-delà de Beth-Aven ». Osée, deux siècles plus tard, emploie le nom pour Béthel même, disant à Israël « ne montez pas à Beth-Aven » et raillant « les veaux de Beth-Aven » ; la carte garde ces versets avec Béthel. On discute si le Beth-Aven de Josué et de Samuel était un vrai village dont le prophète emprunta le nom, ou toujours un surnom de Béthel ou de la ruine d’Aï."
    - "Son site est discuté, et la carte garde les candidats. Ceux qui y voient une ville distincte la cherchent sur la crête entre Béthel et Micmasch : Tell Maryam au-dessus du Wadi Suweinit près de Mukhmas, Burqa ou Khirbet Nisieh au sud de Beitin, ou El Q’ada ; d’autres l’identifient à Beitin, c’est-à-dire à Béthel, et quelques-uns l’ont placée aussi loin à l’ouest qu’à Beth-Horon la haute. Le désert de Beth-Aven serait alors le versant oriental nu entre Béthel et la vallée du Jourdain. Rien n’a été fouillé comme Beth-Aven."
    - "Le terrain est aujourd’hui la montagne du centre de la Cisjordanie autour de Beitin, de Deir Dibwan et de Mukhmas, au nord-est de Ramallah, avec le désert de la gorge du Wadi Suweinit qui tombe à l’est."
  it:
    - "Bet-Aven, «casa dell’iniquità» o «del nulla», era un luogo sulle colline di Beniamino a est di Betel, verso il deserto che scende al Giordano. Giosuè mandò esploratori da Gerico «ad Ai, ch’è vicina a Beth-Aven a oriente di Bethel»; il confine settentrionale di Beniamino termina «al deserto di Beth-Aven»; e nella guerra di Saul i Filistei «si accamparono a Micmas, a oriente di Beth-Aven», finché l’impresa di Gionata cambiò la giornata e «la battaglia s’estese fin oltre Beth-Aven». Osea, più di due secoli dopo, usa il nome per la stessa Betel, dicendo a Israele «e non salite a Beth-aven» e schernendo «le vitelle di Beth-aven»; la carta tiene quei versetti con Betel. Se il Bet-Aven di Giosuè e Samuele fosse un vero villaggio il cui nome sgradevole il profeta prese a prestito, o se fosse sempre un soprannome per Betel o per la rovina di Ai, è discusso."
    - "Il suo sito è discusso, e la carta conserva i candidati. Chi lo ritiene una città distinta lo cerca sulla cresta tra Betel e Micmas: Tell Maryam sopra lo Wadi Suweinit presso Mukhmas, Burqa o Khirbet Nisieh a sud di Beitin, o El Q‘ada; altri lo identificano con Beitin, cioè con Betel, e pochi lo hanno posto fino a Bet-Oron di sopra a ovest. Il deserto di Bet-Aven sarebbe allora il pendio orientale spoglio tra Betel e la valle del Giordano. Nulla è stato scavato come Bet-Aven."
    - "Il terreno è oggi la regione collinosa della Cisgiordania centrale intorno a Beitin, Deir Dibwan e Mukhmas, a nord-est di Ramallah, con il deserto della gola dello Wadi Suweinit che scende a est."
  pl:
    - "Bet-Awen, „dom nieprawości” lub „nicości”, było miejscem we wzgórzach Beniamina na wschód od Betel, ku pustyni opadającej do Jordanu. Jozue wysłał szpiegów z Jerycha „do Haj, które było blisko Betawen na wschód słońca od Betel”; północna granica Beniamina kończy się „przy puszczy Betawen”; a w wojnie Saula Filistyni „położyli się obozem w Machmas, na wschód słońca od Betawen”, aż wyczyn Jonatana odmienił dzień i „bitwa ona zaszła aż do Betawen”. Ozeasz, ponad dwa wieki później, używa tej nazwy dla samego Betel, mówiąc Izraelowi: „ani wstępujcie do Bet Awen” i szydząc z „jałowic Bet Aweńskich”; mapa trzyma te wersety przy Betel. Czy Bet-Awen Jozuego i Samuela było prawdziwą wsią, której źle brzmiącą nazwę prorok zapożyczył, czy zawsze było przezwiskiem Betel albo ruin Aj, jest dyskutowane."
    - "Jego położenie jest sporne, a mapa zachowuje kandydatów. Ci, którzy uważają je za osobne miasto, szukają go na grzbiecie między Betel a Mikmas: Tell Maryam nad Wadi Suweinit koło Mukhmas, Burqa lub Chirbet Nisieh na południe od Beitin, albo El Q'ada; inni utożsamiają je z Beitin, czyli z Betel, a nieliczni umieszczali je tak daleko na zachodzie jak Górny Bet-Choron. Pustynia Bet-Awen byłaby wtedy nagim wschodnim stokiem między Betel a doliną Jordanu. Nic nie wykopano jako Bet-Awen."
    - "Teren to dziś wzgórza centralnego Zachodniego Brzegu wokół Beitin, Deir Dibwan i Mukhmas, na północny wschód od Ramallah, z pustynią wąwozu Wadi Suweinit opadającą na wschód."
  nl:
    - "Beth-Awen, “huis van de boosheid” of “van het niets”, was een plaats in de heuvels van Benjamin ten oosten van Bethel, richting de woestijn die afdaalt naar de Jordaan. Jozua zond verspieders uit Jericho “naar Ai, dat bij Beth-Aven ligt, aan het oosten van Beth-El”; Benjamins noordgrens eindigt “aan de woestijn van Beth-Aven”; en in Sauls oorlog de Filistijnen “legerden zich te Michmas, tegen het oosten van Beth-Aven”, tot Jonatans heldendaad de dag deed keren en “het leger trok over naar Beth-Aven”. Hosea gebruikt meer dan twee eeuwen later de naam voor Bethel zelf, “gaat niet op naar Beth-Aven” en spot met “het kalf van Beth-Aven”; de kaart bewaart die verzen bij Bethel. Of het Beth-Awen van Jozua en Samuël een echt dorp was waarvan de profeet de onheilspellende naam leende, of altijd een bijnaam voor Bethel of voor de ruïne van Ai, is omstreden."
    - "De plaats is omstreden, en de kaart bewaart de kandidaten. Wie het voor een aparte stad houden, zoeken haar op de bergrug tussen Bethel en Michmas: Tell Maryam boven de Wadi Suweinit bij Mukhmas, Burqa of Khirbet Nisieh ten zuiden van Beitin, of El Q’ada; anderen identificeren haar met Beitin, dat wil zeggen met Bethel, en enkelen hebben haar zo ver naar het westen geplaatst als Boven-Beth-Horon. De woestijn van Beth-Awen zou dan de kale oosthelling tussen Bethel en de Jordaanvallei zijn. Niets is als Beth-Awen opgegraven."
    - "Het terrein is nu het bergland van de centrale Westelijke Jordaanoever rond Beitin, Deir Dibwan en Mukhmas, ten noordoosten van Ramallah, met de woestijn van de Wadi Suweinit-kloof die naar het oosten wegvalt."
  cs:
    - "Bét-aven, „dům zlovůle“ nebo „nicoty“, bylo místo v pahorcích Benjamínových východně od Bét-elu, směrem k poušti klesající k Jordánu. Jozue poslal zvědy z Jericha „do Hai, kteréž bylo blízko Betaven, k východní straně Bethel“; severní hranice Benjamínova končí „při poušti Betaven“; a ve Saulově válce Pelištejci „položili se v Michmas na východ Betaven“, dokud Jonatanův čin neobrátil den a „Boj pak protáhl se až do Betaven“. Ozeáš, o více než dvě století později, užívá jméno pro samotný Bét-el, když říká Izraeli „aniž vstupujte do Betaven“, a předpovídá strach „Z příčiny jalovic Betavenských“; mapa ty verše uchovává u Bét-elu. Zda Bét-aven z Jozue a Samuela byl skutečnou vesnicí, jejíž zle znějící jméno si prorok vypůjčil, nebo zda to bylo vždy přízvisko Bét-elu nebo zříceniny Aje, je sporné."
    - "Jeho místo je sporné a mapa uchovává kandidáty. Ti, kdo v něm vidí samostatné město, jej hledají na hřebeni mezi Bét-elem a Michmasem: Tell Maryam nad Wadi Suweinit poblíž Mukhmas, Burqa nebo Chirbet Nisieh jižně od Bejtinu, nebo El Q'ada; jiní je ztotožňují s Bejtinem, tedy s Bét-elem, a několik je umístilo až na západ k Hornímu Bét-choronu. Poušť Bét-avenu by pak byl holý východní svah mezi Bét-elem a Jordánským údolím. Nic nebylo vykopáno jako Bét-aven."
    - "Země je dnes pahorkatina středního Západního břehu kolem Bejtinu, Deir Dibwan a Mukhmas, severovýchodně od Rámalláhu, s pouští soutěsky Wadi Suweinit klesající na východ."
  sv:
    - "Bet-Aven, ”ondskans hus” eller ”intighetens hus”, var en plats i Benjamins berg öster om Betel, mot öknen som stupar ned mot Jordan. Josua sände spejare från Jeriko ”till Ai, som ligger vid Bet-Aven, öster om Betel”; Benjamins norra gräns slutar ”i öknen vid Bet-Aven”; och i Sauls krig lägrade sig filistéerna ”vid Mikmas, öster om Bet-Aven”, tills Jonatans bedrift vände dagen och ”striden fortsattes ända bortom Bet-Aven”. Hosea, mer än två sekel senare, använder namnet för Betel självt, när han säger åt Israel ”dragen ej upp till Bet-Aven” och hånar ”kalvarna i Bet-Aven”; kartan behåller de verserna med Betel. Om Bet-Aven i Josua och Samuelsboken var en verklig by vars illavarslande namn profeten lånade, eller om det alltid var ett öknamn på Betel eller på ruinen Ai, är omdebatterat."
    - "Dess läge är omstritt, och kartan behåller kandidaterna. De som tar det för en särskild stad söker den på åsen mellan Betel och Mikmas: Tell Maryam ovanför Wadi Suweinit nära Mukhmas, Burqa eller Khirbet Nisieh söder om Beitin, eller El Q'ada; andra identifierar den med Beitin, det vill säga med Betel, och några har placerat den så långt väster ut som Övre Bet-Horon. Bet-Avens öken skulle då vara den kala östra sluttningen mellan Betel och Jordandalen. Ingenting har grävts ut som Bet-Aven."
    - "Marken är i dag bergslandet på centrala Västbanken kring Beitin, Deir Dibwan och Mukhmas, nordost om Ramallah, med öknen i Wadi Suweinits klyfta som sluttar bort åt öster."
  nb:
    - "Bet-Aven, «ondskapens hus» eller «intethetens hus», var et sted i Benjamins åser øst for Betel, mot ørkenen som faller ned til Jordan. Josva sendte speidere fra Jeriko «til Ai, som ligger ved Bet-Aven, østenfor Betel»; Benjamins nordgrense ender «frem til ørkenen ved Bet-Aven»; og i Sauls krig «leiret» filisterne seg «ved Mikmas østenfor Bet-Aven», til Jonatans bedrift snudde dagen og «striden drog sig bortover forbi Bet-Aven». Hosea, mer enn to hundre år senere, bruker navnet om selve Betel, og sier til Israel «dra ikke op til Bet-Aven» og spotter «Bet-Avens kalv»; kartet beholder disse versene med Betel. Om Bet-Aven i Josva og Samuel var en virkelig landsby hvis illevarslende navn profeten lånte, eller om det alltid var et kallenavn på Betel eller på ruinen av Ai, er omdiskutert."
    - "Stedet er omstridt, og kartet beholder kandidatene. De som tar det for en egen by, søker det på ryggen mellom Betel og Mikmas: Tell Maryam over Wadi Suweinit nær Mukhmas, Burqa eller Khirbet Nisieh sør for Beitin, eller El Q'ada; andre identifiserer det med Beitin, altså med Betel, og noen få har plassert det så langt vest som Øvre Bet-Horon. Bet-Avens ørken ville da være den nakne østskråningen mellom Betel og Jordandalen. Ingenting er gravd ut som Bet-Aven."
    - "Stedet er i dag fjellandet i det sentrale Vestbredden rundt Beitin, Deir Dibwan og Mukhmas, nordøst for Ramallah, med ørkenen i kløften Wadi Suweinit som faller bort mot øst."
