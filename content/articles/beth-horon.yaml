# Overview article (ADR 0007). Mainstream facts only; written for the pair of towns and the pass, the lower town having its own article; no absolute dates are given for Joshua or Saul; Sanballat's origin is given as a suggestion.
id: beth-horon
place: a75b45e
title:
  en: "Beth-horon"
  ru: "Беф-Орон"
  uk: "Бет-Хорон"
  es: "Bet-horón"
  pt: "Bete-Horom"
  de: "Bet-Horon"
  fr: "Beth-Horon"
  it: "Bet-Oron"
  pl: "Bet-Choron"
  nl: "Beth-Horon"
  cs: "Bét-choron"
body:
  en:
    - "Beth-horon was a pair of towns, Upper and Lower, on the ridge that climbs from the valley of Aijalon to the plateau of Gibeon, 17 to 19 km north-west of Jerusalem; the villages of Beit Ur al-Fauqa and Beit Ur al-Tahta, some 3 km apart and about 200 m different in height, keep the name and the sites. The road between them, “the way that goeth up to Beth-horon” and “the going down to Beth-horon”, was the easiest way from the coast into the hills, and for that reason armies came this way for two thousand years. Joshua counts Beth-horon among the Levitical cities of Ephraim, the border of Ephraim and Benjamin passed by it, and the Chronicler says that Sherah, a daughter of Ephraim, built both towns."
    - "The first battle here is Joshua's. When the five Amorite kings fled from Gibeon, Israel “chased them along the way that goeth up to Beth-horon”, and “in the going down to Beth-horon” the LORD “cast down great stones from heaven upon them unto Azekah”, so that more died by the hail than by the sword; it was the day the sun stood still over Gibeon. In Saul's war a Philistine raiding party “turned the way to Beth-horon”. Solomon fortified Lower Beth-horon with Gezer, and Chronicles adds the upper town, “fenced cities, with walls, gates, and bars”; Shishak's list at Karnak of the towns he took about 925 BC includes Beth-horon. The Israelite soldiers Amaziah sent home raided the cities of Judah “from Samaria even unto Beth-horon”. Sanballat the Horonite, Nehemiah's enemy, may have taken his name from here."
    - "On the ascent of Beth-horon Judas Maccabeus routed the Seleucid commander Seron about 166 BC; Bacchides later fortified the town. In November AD 66 the legate of Syria, Cestius Gallus, retreating from Jerusalem, was caught on the descent of Beth-horon by the Jewish rebels and lost his siege engines, his baggage and thousands of men, the disaster that opened the war with Rome. Eusebius knew two villages called Bethoron about twelve miles from Jerusalem on the road to Nicopolis. Today the two villages are Palestinian, in the West Bank; the Israeli settlement Beit Horon, founded in 1977, lies just east of the upper village, and Route 443 follows the old road."
  ru:
    - "Беф-Орон — пара городов, Верхний и Нижний, на гребне, поднимающемся из долины Аиалонской к плато Гаваона, в 17–19 км к северо-западу от Иерусалима; деревни Бейт-Ур-эль-Фаука и Бейт-Ур-эт-Тахта, в 3 км одна от другой и с разницей высот около 200 м, сохранили имя и места. Дорога между ними, «по дороге к возвышенности Вефорона» и «по скату горы Вефоронской», как говорит книга Иисуса Навина, была самым удобным путём с побережья в горы, и потому войска шли здесь две тысячи лет. Книга Иисуса Навина числит Беф-Орон среди левитских городов Ефрема, граница Ефрема и Вениамина проходила мимо него, а летописец говорит, что оба города построила Шеера, дочь Ефрема."
    - "Первая битва здесь — битва Иисуса Навина. Когда пять царей Аморрейских бежали от Гаваона, Израильтяне преследовали их «по дороге к возвышенности Вефорона», а когда те бежали «по скату горы Вефоронской, Господь бросал на них с небес большие камни града до самого Азека», так что от града погибло больше, чем от меча; в тот день солнце стояло над Гаваоном. В войну Саула филистимский отряд «направился по дороге Вефоронской». Соломон укрепил нижний Беф-Орон вместе с Газером, а Паралипоменон добавляет верхний город: «города укрепленные, со стенами, воротами и запорами»; список Сусакима в Карнаке, около 925 г. до н. э., называет Беф-Орон среди взятых им городов. Воины Израиля, отосланные Амасией, разорили города Иудеи «от Самарии до Вефорона». Санаваллат Хоронит, враг Неемии, возможно, носил имя по этому месту."
    - "На подъёме Вефорона Иуда Маккавей разбил селевкидского военачальника Сирона около 166 г. до н. э.; позже Вакхид укрепил город. В ноябре 66 г. н. э. легат Сирии Цестий Галл, отступая от Иерусалима, был настигнут на спуске Вефорона иудейскими повстанцами и потерял осадные машины, обоз и тысячи людей — беда, с которой началась война с Римом. Евсевий знал два селения Веторон примерно в двенадцати милях от Иерусалима по дороге в Никополь. Сегодня обе деревни палестинские, на Западном берегу; чуть восточнее верхней деревни лежит израильское поселение Бейт-Хорон, основанное в 1977 г., а шоссе 443 идёт по старой дороге."
  uk:
    - "Бет-Хорон було парою міст, Верхнім і Нижнім, на хребті, що піднімається від долини Аялон до плато Гаваона, за 17–19 км на північний захід від Єрусалима; села Бейт-Ур-аль-Фока і Бейт-Ур-ат-Тахта, на відстані близько 3 км одне від одного й з різницею висот приблизно 200 м, зберігають назву й місця. Дорога між ними, «дорога, що йде в гору до Беторона» і «спускались від Беторона», була найлегшим шляхом від узбережжя до пагорбів, і тому війська ходили цим шляхом дві тисячі років. Ісус Навин зараховує Бет-Хорон до левітських міст Єфрема, кордон Єфрема і Веніяміна проходив повз нього, а хронікар каже, що Шеера, дочка Єфрема, збудувала обидва міста."
    - "Перша битва тут — Ісуса Навина. Коли п'ятеро аморійських царів тікали від Гаваона, ізраїльтяни «вганяли за ними по дорозї, що йде в гору до Беторона», і Господь «спустив на них з небес страшенний град мов каміннє аж до Азека», так що більше загинуло від граду, ніж від меча; це був день, коли сонце стало над Гаваоном. У війні Саула филистимський загін «ударивсь на Бет-Орон». Соломон укріпив Нижній Бет-Хорон разом із Гезером, а Хроніки додають верхнє місто, «міста утверджені, з мурами, брамами та засовами»; перелік Сусакіма в Карнаку міст, які він узяв близько 925 р. до н. е., включає Бет-Хорон. Ізраїльські воїни, яких Амассія відіслав додому, грабували міста Юди «від Самариї до Беторона». Санаваллат Хоронітянин, ворог Неемії, можливо, узяв своє ім'я звідси."
    - "На підйомі Бет-Хорона Юда Маккавей розбив селевкідського полководця Серона близько 166 р. до н. е.; Бакхід згодом укріпив місто. У листопаді 66 р. н. е. намісник Сирії Цестій Галл, відступаючи від Єрусалима, був спійманий на спуску Бет-Хорона юдейськими повстанцями й утратив облогові машини, обоз і тисячі людей — катастрофа, що відкрила війну з Римом. Євсевій знав два села на ім'я Беторон за дванадцять миль від Єрусалима на дорозі до Нікополя. Нині обидва села палестинські, на Західному березі; ізраїльське поселення Бейт-Хорон, засноване в 1977 році, лежить трохи на схід від верхнього села, а шосе 443 іде старою дорогою."
  es:
    - "Bet-horón era un par de ciudades, la de Arriba y la de Abajo, en la cresta que sube desde el valle de Ajalón hasta la meseta de Gabaón, a 17-19 km al noroeste de Jerusalén; las aldeas de Beit Ur al-Fauqa y Beit Ur al-Tahta, separadas unos 3 km y con unos 200 m de diferencia de altura, conservan el nombre y los sitios. El camino entre ellas, «el camino que sube á Beth-oron» y «la bajada de Beth-oron», era la vía más fácil de la costa a las colinas, y por eso los ejércitos vinieron por aquí durante dos mil años. Josué cuenta Bet-horón entre las ciudades levíticas de Efraín, la frontera de Efraín y Benjamín pasaba por ella, y el Cronista dice que Seera, una hija de Efraín, construyó ambas ciudades."
    - "La primera batalla aquí es la de Josué. Cuando los cinco reyes amorreos huyeron de Gabaón, Israel «siguiólos por el camino que sube á Beth-oron», y «á la bajada de Beth-oron» Jehová «echó sobre ellos del cielo grandes piedras hasta Azeca», de modo que murieron más por el granizo que por la espada; fue el día en que el sol se detuvo sobre Gabaón. En la guerra de Saúl, una partida filistea de saqueo «marchó hacia Beth-oron». Salomón fortificó Bet-horón de Abajo con Gezer, y las Crónicas añaden la ciudad alta, «ciudades fortificadas, de muros, puertas, y barras»; la lista de Sisac en Karnak de las ciudades que tomó hacia 925 a. C. incluye Bet-horón. Los soldados israelitas que Amasías mandó de vuelta asaltaron las ciudades de Judá «desde Samaria hasta Beth-oron». Sanbalat el horonita, enemigo de Nehemías, pudo tomar su nombre de aquí."
    - "En la subida de Bet-horón Judas Macabeo derrotó al comandante seléucida Seron hacia 166 a. C.; Báquides fortificó más tarde la ciudad. En noviembre de 66 d. C. el legado de Siria, Cestio Galo, en retirada de Jerusalén, fue sorprendido en la bajada de Bet-horón por los rebeldes judíos y perdió sus máquinas de asedio, su equipaje y miles de hombres, el desastre que abrió la guerra con Roma. Eusebio conocía dos aldeas llamadas Bethoron a unas doce millas de Jerusalén en el camino a Nicópolis. Hoy las dos aldeas son palestinas, en Cisjordania; el asentamiento israelí de Beit Horon, fundado en 1977, se halla justo al este de la aldea de arriba, y la carretera 443 sigue el antiguo camino."
  pt:
    - "Bete-Horom eram duas cidades, a de Cima e a de Baixo, na crista que sobe do vale de Aijalom ao planalto de Gibeão, a 17–19 km a noroeste de Jerusalém; as aldeias de Beit Ur al-Fauqa e Beit Ur al-Tahta, a cerca de 3 km uma da outra e com uns 200 m de diferença de altura, conservam o nome e os sítios. O caminho entre elas, “o caminho da subida de Bete-Horom” e “a descida de Bete-Horom”, era o acesso mais fácil da costa às colinas, e por isso exércitos vieram por aqui durante dois mil anos. Josué conta Bete-Horom entre as cidades levíticas de Efraim, a fronteira de Efraim e Benjamim passava por ela, e o Cronista diz que Seerá, filha de Efraim, edificou as duas cidades."
    - "A primeira batalha aqui é a de Josué. Quando os cinco reis amorreus fugiram de Gibeão, Israel “os perseguiu pelo caminho da subida de Bete-Horom”, e “na descida de Bete-Horom” o SENHOR “lançou do céu grandes pedras sobre eles até Azeca”, de modo que morreram mais pelo granizo que pela espada; foi o dia em que o sol parou sobre Gibeão. Na guerra de Saul, uma tropa filisteia de incursão “tomou o caminho de Bete-Horom”. Salomão fortificou Bete-Horom de Baixo com Gezer, e Crônicas acrescenta a de Cima, “cidades fortificadas com muros, portas e trancas”; a lista de Sisaque em Carnaque das cidades que tomou por volta de 925 a.C. inclui Bete-Horom. Os soldados israelitas que Amazias mandou de volta atacaram as cidades de Judá “desde Samaria até Bete-Horom”. Sambalá, o horonita, inimigo de Neemias, pode ter tomado o nome daqui."
    - "Na subida de Bete-Horom, Judas Macabeu derrotou o comandante selêucida Seron por volta de 166 a.C.; Báquides fortificou depois a cidade. Em novembro de 66 d.C., o legado da Síria, Céstio Galo, retirando-se de Jerusalém, foi apanhado na descida de Bete-Horom pelos rebeldes judeus e perdeu suas máquinas de cerco, bagagem e milhares de homens, o desastre que abriu a guerra com Roma. Eusébio conhecia duas aldeias chamadas Bethoron a cerca de doze milhas de Jerusalém, na estrada de Nicópolis. Hoje as duas aldeias são palestinas, na Cisjordânia; o assentamento israelense Beit Horon, fundado em 1977, fica logo a leste da aldeia de cima, e a Rota 443 segue a antiga estrada."
  de:
    - "Bet-Horon waren zwei Städte, Ober- und Unter-, auf dem Höhenzug, der vom Tal von Ajalon zum Plateau von Gibeon ansteigt, 17 bis 19 km nordwestlich von Jerusalem; die Dörfer Beit Ur al-Fauqa und Beit Ur al-Tahta, etwa 3 km voneinander und rund 200 m verschieden hoch, bewahren Namen und Stätten. Die Straße dazwischen, „den Weg hinan zu Beth-Horon“, war der leichteste Weg von der Küste ins Bergland, und deshalb zogen Heere zwei Jahrtausende lang diesen Weg. Josua zählt Bet-Horon zu den Levitenstädten Ephraims, die Grenze von Ephraim und Benjamin lief daran vorbei, und der Chronist sagt, Scheera, eine Tochter Ephraims, habe beide Städte gebaut."
    - "Die erste Schlacht hier ist Josuas. Als die fünf amoritischen Könige von Gibeon flohen, „jagten“ die Israeliten „ihnen nach den Weg hinan zu Beth-Horon“, und als sie „den Weg zu Beth-Horon“ flohen, „ließ der HERR einen großen Hagel vom Himmel auf sie fallen bis gen Aseka“, so dass mehr durch den Hagel starben als durch das Schwert; es war der Tag, an dem die Sonne über Gibeon stillstand. In Sauls Krieg „wandte sich“ ein philistäischer Trupp „auf die Straße Beth-Horons“. Salomo befestigte das Untere Bet-Horon mit Geser, und die Chronik fügt die obere Stadt hinzu, „die feste Städte waren mit Mauern, Türen und Riegeln“; Schischaks Liste in Karnak (um 925 v. Chr.) nennt Bet-Horon. Die Soldaten, die Amazja heimgeschickt hatte, plünderten die Städte Judas „von Samaria an bis gen Beth-Horon“. Saneballat der Horoniter, Nehemias Feind, mag von hier seinen Namen haben."
    - "Auf dem Anstieg von Bet-Horon schlug Judas Makkabäus den seleukidischen Befehlshaber Seron um 166 v. Chr.; Bakchides befestigte die Stadt später. Im November 66 n. Chr. wurde der Legat von Syrien, Cestius Gallus, auf dem Rückzug von Jerusalem am Abstieg von Bet-Horon von den jüdischen Aufständischen gestellt und verlor seine Belagerungsmaschinen, sein Gepäck und Tausende Männer, die Katastrophe, die den Krieg mit Rom eröffnete. Eusebius kannte zwei Dörfer namens Bethoron etwa zwölf Meilen von Jerusalem an der Straße nach Nikopolis. Heute sind beide Dörfer palästinensisch, im Westjordanland; die israelische Siedlung Beit Horon, 1977 gegründet, liegt knapp östlich des oberen Dorfes, und die Route 443 folgt der alten Straße."
  fr:
    - "Beth-Horon était un couple de villes, haute et basse, sur la crête qui monte de la vallée d’Ajalon au plateau de Gabaon, à 17-19 km au nord-ouest de Jérusalem ; les villages de Beit Ur al-Fauqa et de Beit Ur al-Tahta, distants d’environ 3 km et d’environ 200 m de dénivelé, gardent le nom et les sites. La route entre eux, « le chemin qui monte à Beth-Horon » et « la descente de Beth-Horon », était la voie la plus aisée de la côte vers la montagne, et pour cette raison des armées y passèrent pendant deux mille ans. Josué compte Beth-Horon parmi les villes lévitiques d’Éphraïm, la frontière d’Éphraïm et de Benjamin la longeait, et le Chroniste dit que Schééra, fille d’Éphraïm, bâtit les deux villes."
    - "La première bataille ici est celle de Josué. Quand les cinq rois amoréens fuirent Gabaon, Israël « les poursuivit sur le chemin qui monte à Beth-Horon », et « à la descente de Beth-Horon » l’Éternel « fit tomber du ciel sur eux de grosses pierres jusqu’à Azéka », la grêle tuant plus que l’épée ; c’était le jour où le soleil s’arrêta sur Gabaon. Dans la guerre de Saül, un parti de pillards philistins « prit le chemin de Beth-Horon ». Salomon fortifia Beth-Horon la basse avec Guézer, et les Chroniques ajoutent la ville haute, « villes fortes, ayant des murs, des portes et des barres » ; la liste de Schischak à Karnak des villes qu’il prit vers 925 av. J.-C. comprend Beth-Horon. Les soldats israélites qu’Amatsia avait renvoyés pillèrent les villes de Juda « depuis Samarie jusqu’à Beth-Horon ». Sanballat le Horonite, ennemi de Néhémie, tenait peut-être son nom d’ici."
    - "À la montée de Beth-Horon, Judas Maccabée mit en déroute le chef séleucide Seron vers 166 av. J.-C. ; Bacchidès fortifia plus tard la ville. En novembre 66 apr. J.-C., le légat de Syrie, Cestius Gallus, se retirant de Jérusalem, fut pris à la descente de Beth-Horon par les rebelles juifs et perdit ses machines de siège, ses bagages et des milliers d’hommes, le désastre qui ouvrit la guerre avec Rome. Eusèbe connaissait deux villages appelés Bethoron à environ douze milles de Jérusalem sur la route de Nicopolis. Aujourd’hui les deux villages sont palestiniens, en Cisjordanie ; la colonie israélienne de Beit Horon, fondée en 1977, se trouve juste à l’est du village haut, et la route 443 suit l’ancienne voie."
  it:
    - "Bet-Oron erano due città, di sopra e di sotto, sulla cresta che sale dalla valle di Aialon all’altopiano di Gabaon, a 17–19 km a nord-ovest di Gerusalemme; i villaggi di Beit Ur al-Fauqa e Beit Ur al-Tahta, distanti circa 3 km e con una differenza di quota di circa 200 m, ne conservano il nome e i siti. La strada tra loro, «la via che sale a Beth-Horon» e «la scesa di Beth-Horon», era la via più facile dalla costa alle colline, e per questo eserciti vi passarono per duemila anni. Giosuè conta Bet-Oron fra le città levitiche di Efraim, il confine di Efraim e Beniamino vi passava, e il Cronista dice che Seerà, una figlia di Efraim, costruì entrambe le città."
    - "La prima battaglia qui è quella di Giosuè. Quando i cinque re amorei fuggirono da Gabaon, Israele «li inseguì per la via che sale a Beth-Horon», e «alla scesa di Beth-Horon» il Signore «fe’ cader dal cielo su loro delle grosse pietre fino ad Azeka», così che più morirono per la grandine che per la spada; fu il giorno in cui il sole si fermò su Gabaon. Nella guerra di Saul una banda di razziatori filistei «prese la via di Beth-Horon». Salomone fortificò Bet-Oron di sotto con Ghezer, e le Cronache aggiungono la città di sopra, «città forti, munite di mura, di porte e di sbarre»; l’elenco di Sisak a Karnak delle città da lui prese intorno al 925 a.C. include Bet-Oron. I soldati israeliti che Amazia aveva rimandato a casa razziarono le città di Giuda «da Samaria fino a Beth-Horon». Sanballàt l’Oronita, nemico di Neemia, può aver preso il nome da qui."
    - "Sulla salita di Bet-Oron Giuda Maccabeo sbaragliò il comandante seleucide Seron intorno al 166 a.C.; Bacchide fortificò poi la città. Nel novembre del 66 d.C. il legato di Siria, Cestio Gallo, ritirandosi da Gerusalemme, fu raggiunto sulla discesa di Bet-Oron dai ribelli giudei e perse le macchine d’assedio, i bagagli e migliaia di uomini, il disastro che aprì la guerra con Roma. Eusebio conosceva due villaggi chiamati Bethoron a circa dodici miglia da Gerusalemme sulla strada per Nicopoli. Oggi i due villaggi sono palestinesi, in Cisgiordania; l’insediamento israeliano di Beit Horon, fondato nel 1977, sorge poco a est del villaggio superiore, e la strada 443 segue la vecchia via."
  pl:
    - "Bet-Choron to były dwa miasta, Górne i Dolne, na grzbiecie wspinającym się z doliny Ajjalon na płaskowyż Gibeonu, 17 do 19 km na północny zachód od Jerozolimy; wsie Beit Ur al-Fauqa i Beit Ur al-Tahta, oddalone o około 3 km i różniące się wysokością o około 200 m, zachowują nazwę i miejsca. Droga między nimi, podjazd do Bet-Choron i zejście z niego, była najłatwiejszą drogą z wybrzeża w góry i dlatego armie szły tędy przez dwa tysiące lat. Jozue zalicza Bet-Choron do miast lewickich Efraima, mijała je granica Efraima i Beniamina, a Kronikarz mówi, że Szeera, córka Efraima, zbudowała oba miasta."
    - "Pierwsza bitwa tu to bitwa Jozuego. Gdy pięciu królów amorejskich uciekało z Gibeonu, Izrael „gonił je drogą, którą chodzą ku Betoron”, a gdy uciekali „bieżąc z góry do Betoron”, Pan „spuścił na nie kamienie wielkie z nieba aż do Aseka”, tak że więcej zginęło od gradu niż od miecza; był to dzień, gdy słońce stanęło nad Gibeonem. W wojnie Saula filistyński oddział łupieski „obrócił się drogą ku Betoron”. Salomon obwarował Dolny Bet-Choron razem z Gezer, a Kronika dodaje górne miasto, „miasta obronne w murach, z bramami i z zaworami”; wykaz Sziszaka w Karnaku miast zdobytych około 925 r. p.n.e. obejmuje Bet-Choron. Żołnierze izraelscy odesłani do domu przez Amazjasza wtargnęli do miast Judy „od Samaryi aż do Betoronu”. Sanballat Choronita, wróg Nehemiasza, mógł wziąć swe imię stąd."
    - "Na podjeździe do Bet-Choron Juda Machabeusz rozgromił seleucydzkiego dowódcę Serona około 166 r. p.n.e.; Bakchides obwarował później miasto. W listopadzie 66 r. n.e. legat Syrii Cestiusz Gallus, wycofując się z Jerozolimy, został dopadnięty na zejściu do Bet-Choron przez żydowskich powstańców i stracił machiny oblężnicze, bagaże i tysiące ludzi, klęska ta otworzyła wojnę z Rzymem. Euzebiusz znał dwie wsie zwane Bethoron około dwunastu mil od Jerozolimy na drodze do Nikopolis. Dziś obie wsie są palestyńskie, na Zachodnim Brzegu; izraelska osada Beit Horon, założona w 1977 roku, leży tuż na wschód od górnej wsi, a Droga 443 podąża dawnym szlakiem."
  nl:
    - "Beth-Horon was een paar steden, Boven en Neder, op de bergrug die van het dal van Ajalon naar het plateau van Gibeon klimt, 17 tot 19 km ten noordwesten van Jeruzalem; de dorpen Beit Ur al-Fauqa en Beit Ur al-Tahta, zo’n 3 km uit elkaar en ongeveer 200 m in hoogte verschillend, bewaren de naam en de plaatsen. De weg ertussen, “den weg, waar men naar Beth-horon opgaat” en “den afgang van Beth-horon”, was de gemakkelijkste weg van de kust het bergland in, en daarom kwamen er tweeduizend jaar lang legers langs. Jozua rekent Beth-Horon tot de levietensteden van Efraïm, de grens van Efraïm en Benjamin liep erlangs, en de Kroniekschrijver zegt dat Seëra, een dochter van Efraïm, beide steden bouwde."
    - "De eerste slag hier is die van Jozua. Toen de vijf Amorietische koningen van Gibeon vluchtten, “vervolgde” Israël hen “op den weg, waar men naar Beth-horon opgaat”, en “in den afgang van Beth-horon” wierp de HEER “grote stenen op hen van den hemel, tot Azeka toe”, zodat er meer door de hagel stierven dan door het zwaard; het was de dag dat de zon stilstond boven Gibeon. In Sauls oorlog “keerde” een Filistijnse rooftroep zich “naar den weg van Beth-horon”. Salomo versterkte Neder-Beth-Horon met Gezer, en Kronieken voegt de bovenstad toe, “vaste steden met muren, deuren en grendelen”; Sisaks lijst te Karnak van de steden die hij omstreeks 925 v.Chr. innam, bevat Beth-Horon. De Israëlitische soldaten die Amazia naar huis zond, plunderden de steden van Juda “van Samaria af tot Beth-horon toe”. Sanballat de Horoniet, Nehemia’s vijand, heeft zijn naam misschien van hier."
    - "Op de helling van Beth-Horon versloeg Judas Makkabeüs de Seleucidische bevelhebber Seron omstreeks 166 v.Chr.; Bacchides versterkte de stad later. In november 66 n.Chr. werd de legaat van Syrië, Cestius Gallus, terugtrekkend uit Jeruzalem, op de afdaling van Beth-Horon door de Joodse rebellen overvallen en verloor zijn belegeringswerktuigen, zijn bagage en duizenden mannen, de ramp die de oorlog met Rome opende. Eusebius kende twee dorpen genaamd Bethoron, zo’n twaalf mijl van Jeruzalem aan de weg naar Nicopolis. Tegenwoordig zijn de twee dorpen Palestijns, op de Westelijke Jordaanoever; de Israëlische nederzetting Beit Horon, gesticht in 1977, ligt net ten oosten van het bovenste dorp, en Route 443 volgt de oude weg."
  cs:
    - "Bét-choron byla dvojice měst, Horní a Dolní, na hřebeni, který stoupá z Ajalonského údolí na náhorní plošinu Gibeonu, 17 až 19 km severozápadně od Jeruzaléma; vesnice Beit Ur al-Fauqa a Beit Ur al-Tahta, od sebe asi 3 km a s výškovým rozdílem asi 200 m, uchovávají jméno i místa. Cesta mezi nimi, v Jozue „kudy se jde k Betoron“ a „sstupujíce do Betoron“, byla nejsnadnější cestou od pobřeží do pahorků a z toho důvodu tudy táhla vojska dva tisíce let. Jozue počítá Bét-choron mezi levitská města Efrajimova, hranice Efrajimova a Benjamínova jej míjela a kronikář praví, že Šeera, dcera Efrajimova, vystavěla obě města."
    - "První bitvou tu je Jozuova. Když pět amorejských králů prchalo z Gibeonu, Izrael je honil „cestou, kudy se jde k Betoron“ a Hospodin „metal na ně kamení veliké s nebe, až k Azeku“, takže jich více zemřelo od krupobití než od meče; byl to den, kdy se slunce zastavilo nad Gibeonem. Ve Saulově válce se pelištejský houf „obrátil se na cestu Betoron“. Šalomoun opevnil Dolní Bét-choron s Gezerem a Letopisy dodávají horní město, „města ohrazená zdmi, branami i závorami“; Šíšakův seznam v Karnaku měst, která dobyl kolem roku 925 př. n. l., zahrnuje Bét-choron. Izraelští vojáci, které Amacjáš poslal domů, vtrhli do judských měst „od Samaří až do Betoron“. Sanbalat Choronský, Nehemjášův nepřítel, mohl mít jméno odtud."
    - "Na výstupu k Bét-choronu Juda Makabejský kolem roku 166 př. n. l. rozprášil seleukovského velitele Séróna; Bakchidés později město opevnil. V listopadu roku 66 n. l. byl syrský legát Cestius Gallus, ustupující z Jeruzaléma, zastižen na sestupu k Bét-choronu židovskými povstalci a ztratil obléhací stroje, zavazadla a tisíce mužů, katastrofu, která zahájila válku s Římem. Eusebios znal dvě vesnice zvané Bethoron asi dvanáct mil od Jeruzaléma na cestě do Nikopole. Dnes jsou obě vesnice palestinské, na Západním břehu; izraelská osada Bejt Choron, založená roku 1977, leží kousek východně od horní vesnice a silnice 443 sleduje starou cestu."
