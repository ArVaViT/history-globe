body:
  en:
    - "Cush is the Bible's name for the land south of Egypt, beyond the cataracts of the Nile: Nubia, the northern Sudan of today. The Egyptians called it Kash; the Greeks called its people Aithiopes, “burnt faces”, and the Septuagint, the King James Version (“Ethiopia”) and the Synodal Bible (“Ефиопия”) follow them, though this is not the Ethiopia of Addis Ababa. Genesis names Cush first among the sons of Ham and the father of Nimrod, and the river Gihon compasses “the whole land of Ethiopia”, where the Synodal text alone keeps the name Куш. Esther's Ahasuerus reigned “from India even unto Ethiopia”."
    - "The kingdom of Kerma flourished above the Third Cataract from about 2500 BC until the pharaohs of the New Kingdom conquered Nubia. About 728 BC Piye of Napata conquered Egypt itself, and his line ruled it as the Twenty-fifth Dynasty: Piye, Shabaka, Taharqa. The Bible knows Taharqa as “Tirhakah king of Ethiopia”, who came out against Sennacherib in 701 BC; he became king only about 690, and most scholars read the title as the one he bore later, while some place the episode in a second, later campaign. Isaiah walked naked and barefoot three years “for a sign and wonder upon Egypt and upon Ethiopia”, and Judah would be “ashamed of Ethiopia their expectation”: Esarhaddon took Memphis in 671 and Ashurbanipal sacked Thebes in 663, of which Nahum says that “Ethiopia and Egypt were her strength”."
    - "The prophets look to Cush at the end of the world. Isaiah sends word to “the land shadowing with wings, which is beyond the rivers of Ethiopia”, whose ambassadors come “in vessels of bulrushes”, and promises that its gift will be brought to Zion; the psalm sings that “Ethiopia shall soon stretch out her hands unto God”, and Zephaniah that “from beyond the rivers of Ethiopia” the Lord's suppliants will bring his offering. Jeremiah asks, “Can the Ethiopian change his skin, or the leopard his spots?”, and Amos reminds Israel that it is to God as “children of the Ethiopians”. From about 300 BC the kings were buried further south at Meroe, where queens ruled with the title kandake; Philip baptised the treasurer of “Candace queen of the Ethiopians”; Strabo tells of Rome's war with a Candace in 25–22 BC."
    - "Today most of the land of Cush lies in the Republic of the Sudan. The pyramids of Meroe and the temples of Gebel Barkal are on the UNESCO list; the Nubian valley below the Second Cataract lies under Lake Nasser since the Aswan High Dam, its temples moved to higher ground; and the Christian kingdoms of Nubia, from the sixth century to the fifteenth, left painted cathedrals at Faras and Old Dongola."
  ru:
    - "Ефиопия, по-еврейски Куш, — библейское имя земли к югу от Египта, за порогами Нила: Нубии, нынешнего северного Судана. Египтяне звали её Каш; греки звали её жителей «эфиопами», то есть «опалёнными лицом», и Септуагинта, Библия короля Иакова и Синодальный перевод следуют им, хотя это не Эфиопия со столицей в Аддис-Абебе. Книга Бытия называет Хуша первым из сыновей Хама и отцом Нимрода, а река Гихон «обтекает всю землю Куш» — здесь Синодальный текст единственный раз сохраняет это имя. Артаксеркс книги Есфирь царствовал «от Индии и до Ефиопии»."
    - "Царство Керма процветало выше третьего порога примерно с 2500 г. до н. э., пока фараоны Нового царства не покорили Нубию. Около 728 г. до н. э. Пианхи из Напаты покорил сам Египет, и его род правил им как XXV династия: Пианхи, Шабака, Тахарка. Сеннахирим в 701 г. до н. э. услышал «о Тиргаке, царе Ефиопском», вышедшем сразиться с ним: это Тахарка, ставший царём лишь около 690 г.; большинство учёных видят здесь титул, который он носил позже, а некоторые относят эпизод ко второму, более позднему походу. Исаия три года ходил нагой и босой «в указание и предзнаменование о Египте и Ефиопии», и Иудее предстояло устыдиться «из-за Ефиопии, надежды своей»: Асархаддон взял Мемфис в 671 г., а Ашшурбанипал разграбил Фивы в 663 г., о которых Наум говорит: «Ефиопия и Египет с бесчисленным множеством других служили ему подкреплением»."
    - "Пророки смотрят на Куш как на край света. Исаия обращается к земле «по ту сторону рек Ефиопских», чьи послы плывут «в папировых суднах», и обещает, что её дар будет принесён на Сион; псалом поёт: «Ефиопия прострет руки свои к Богу», а Софония — что «из заречных стран Ефиопии» поклонники Господа принесут Ему дары. Иеремия спрашивает: «Может ли Ефиоплянин переменить кожу свою и барс — пятна свои?», а Амос напоминает Израилю, что он для Бога — как «сыны Ефиоплян». Около 300 г. до н. э. царские гробницы переместились южнее, в Мероэ, где царицы правили с титулом кандаке; Филипп крестил хранителя сокровищ «Кандакии, царицы Ефиопской», а Страбон рассказывает о войне римлян с одной из Кандак в 25–22 гг. до н. э."
    - "Сегодня большая часть земли Куш лежит в Республике Судан. Пирамиды Мероэ и храмы Гебель-Баркала внесены в список ЮНЕСКО; нубийская долина ниже второго порога после постройки Асуанской плотины лежит под озером Насер, а её храмы перенесены выше; христианские же царства Нубии, просуществовавшие с VI по XV век, оставили расписные соборы в Фарасе и Старой Донголе."
  uk:
    - "Куш — біблійна назва землі на південь від Єгипту, за порогами Нілу: Нубії, сьогоднішнього північного Судану. Єгиптяни звали її Каш; греки називали її мешканців айтіопами, «обпаленими обличчями», і за ними йдуть Септуагінта, переклад короля Якова («Ethiopia») та Синодальна Біблія («Ефиопия»), хоча це не та Ефіопія, що з Аддис-Абебою. Книга Буття називає Куша першим серед синів Хама й батьком Німрода, а ріка Гіхон «обтекає всю Куш землю», де лише Синодальний текст зберігає назву «Куш». Ахашверош із книги Естер царював «від Индиї до Етиопиї»."
    - "Царство Керма процвітало вище Третього порога приблизно з 2500 р. до н. е., доки фараони Нового царства не завоювали Нубію. Близько 728 р. до н. е. Піє з Напати завоював сам Єгипет, і його рід правив ним як двадцять п'ята династія: Піє, Шабака, Тахарка. Біблія знає Тахарку як «Тиргака, царя Етиопського», який виступив проти Сінаххеріба в 701 р. до н. е.; царем він став лише близько 690 р., і більшість учених читає цей титул як той, що він носив пізніше, тоді як дехто відносить епізод до другого, пізнішого походу. Ісая ходив голий і босий три роки «на ознаку й дивовижу того, що станеться з Египтом і Етиопією», а надія на Етіопію осоромить Юду: «соромити муться зза Етиопії ті, що на неї вповали»: Асархаддон узяв Мемфіс у 671 р., а Ашшурбаніпал розграбував Но в 663 р., про яке Наум каже: «Етіопія й Египет із безлїччю люда підпирають його»."
    - "Пророки дивляться на Куш як на кінець світу. Ісая посилає звістку до «краю, що, мов крильми, сягає по той бік рік Етиопських», чиї посли пливуть «човнами з папиросу», й обіцяє, що його дар буде принесений на Сіон; псалом співає, що «Етиопія скоро простягне руки свої до Бога», а Софонія — що «Із земель Етіопських, що по тім боцї ріки» будуть поклонники Господа, які принесуть Йому дари. Єремія питає: «Хиба Мурин зможе перемінити скіру свою, або пард — пятна свої?», а Амос нагадує Ізраїлеві, що для Бога він такий, «як Етіопії». Приблизно від 300 р. до н. е. царів ховали далі на південь, у Мерое, де правили цариці з титулом кандака; Пилип охрестив скарбника «Кандакиї, царицї Єтіопської»; Страбон розповідає про війну Риму з Кандакою в 25–22 рр. до н. е."
    - "Сьогодні більша частина землі Куш лежить у Республіці Судан. Піраміди Мерое та храми Гебель-Баркала внесено до списку ЮНЕСКО; нубійська долина нижче Другого порога лежить під озером Насер від часу Асуанської греблі, а її храми перенесено на вище місце; християнські королівства Нубії, що тривали з VI до XV ст., залишили розписані собори у Фарасі та Старій Донголі."
  es:
    - "Cus es el nombre bíblico de la tierra al sur de Egipto, más allá de las cataratas del Nilo: Nubia, el norte del Sudán actual. Los egipcios la llamaban Kash; los griegos llamaban a su pueblo Aithiopes, «rostros quemados», y la Septuaginta, la versión King James («Ethiopia») y la Biblia sinodal («Ефиопия») los siguen, aunque esta no es la Etiopía de Adís Abeba. El Génesis nombra a Cus primero entre los hijos de Cam y como padre de Nimrod, y el río Gihón rodea «toda la tierra de Etiopía», donde solo el texto sinodal conserva el nombre Куш. Asuero, el de Ester, reinó «desde la India hasta la Etiopía»."
    - "El reino de Kerma floreció por encima de la tercera catarata desde alrededor del 2500 a. C. hasta que los faraones del Reino Nuevo conquistaron Nubia. Hacia el 728 a. C. Piye de Napata conquistó el propio Egipto, y su linaje lo gobernó como la dinastía XXV: Piye, Shabaka, Taharqa. La Biblia conoce a Taharqa como «Tirhakah rey de Etiopía», que salió contra Senaquerib en el 701 a. C.; llegó a ser rey solo hacia el 690, y la mayoría de los estudiosos leen el título como el que llevó después, mientras que algunos sitúan el episodio en una segunda campaña posterior. Isaías anduvo desnudo y descalzo tres años como «señal y pronóstico sobre Egipto y sobre Etiopía», y Judá se avergonzaría de «Etiopía su esperanza»: Esar-hadón tomó Menfis en el 671 y Asurbanipal saqueó Tebas en el 663, de la cual Nahum dice que «Etiopía era su fortaleza, y Egipto sin límite»."
    - "Los profetas miran a Cus en el confín del mundo. Isaías envía su mensaje a «la tierra que hace sombra con las alas, que está tras los ríos de Etiopía», cuyos embajadores vienen «en navíos de junco», y promete que su presente será llevado a Sion; el salmo canta que «Etiopía apresurará sus manos á Dios», y Sofonías que «de esa parte de los ríos de Etiopía» los suplicantes del Señor traerán su ofrenda. Jeremías pregunta: «¿Mudará el negro su pellejo, y el leopardo sus manchas?», y Amós recuerda a Israel que para Dios es como «hijos de Etiopes». Desde alrededor del 300 a. C. los reyes fueron enterrados más al sur, en Meroe, donde reinaron reinas con el título de kandake; Felipe bautizó al tesorero de «Candace, reina de los Etiopes»; Estrabón cuenta la guerra de Roma con una Candace en 25–22 a. C."
    - "Hoy la mayor parte de la tierra de Cus se halla en la República del Sudán. Las pirámides de Meroe y los templos de Gebel Barkal figuran en la lista de la UNESCO; el valle nubio por debajo de la segunda catarata yace bajo el lago Nasser desde la presa de Asuán, con sus templos trasladados a terreno más alto; y los reinos cristianos de Nubia, que duraron del siglo VI al XV, dejaron catedrales pintadas en Faras y en la Vieja Dongola."
  pt:
    - "Cuxe é o nome bíblico da terra ao sul do Egito, além das cataratas do Nilo: a Núbia, o atual norte do Sudão. Os egípcios a chamavam Kash; os gregos chamavam seu povo Aithiopes, “rostos queimados”, e a Septuaginta, a King James Version (“Ethiopia”) e a Bíblia Sinodal (“Ефиопия”) os seguem, embora esta não seja a Etiópia de Adis Abeba. O Gênesis nomeia Cuxe em primeiro lugar entre os filhos de Cam e como pai de Ninrode, e o rio Giom percorre “toda a terra de Cuxe”, nome que a Bíblia Sinodal também conserva (Куш), enquanto a King James traz “Ethiopia”. O Assuero de Ester reinava “desde a Índia até a Etiópia”."
    - "O reino de Kerma floresceu acima da Terceira Catarata desde cerca de 2500 a.C. até que os faraós do Novo Reino conquistaram a Núbia. Por volta de 728 a.C., Piye de Napata conquistou o próprio Egito, e sua linhagem o governou como XXV Dinastia: Piye, Shabaka, Taharca. A Bíblia conhece Taharca como “Tiraca, rei da Etiópia”, que saiu contra Senaqueribe em 701 a.C.; ele só se tornou rei por volta de 690, e a maioria dos estudiosos lê o título como o que ele portou depois, enquanto alguns situam o episódio numa segunda campanha, posterior. Isaías andou nu e descalço por três anos “como sinal e prodígio acerca do Egito e acerca da Etiópia”, e Judá se envergonharia “por causa da Etiópia, sua esperança”: Esar-Hadom tomou Mênfis em 671 e Assurbanipal saqueou Tebas em 663, da qual Naum diz que “Cuxe e o Egito eram a sua força ilimitada”."
    - "Os profetas olham para Cuxe no fim do mundo. Isaías envia uma mensagem à “terra do roçar de asas, que está além dos rios da Etiópia”, cujos embaixadores vêm “em embarcações de papiro”, e promete que seu presente será trazido a Sião; o salmo canta que “A Etiópia se apressará em estender as suas mãos para Deus”, e Sofonias que “De além dos rios de Cuxe” os adoradores do Senhor trarão a sua oferta. Jeremias pergunta: “Pode o etíope mudar a sua pele, ou o leopardo as suas manchas?”, e Amós lembra a Israel que é para Deus como “os filhos dos etíopes”. A partir de cerca de 300 a.C., os reis foram sepultados mais ao sul, em Meroé, onde rainhas governavam com o título de kandake; Filipe batizou o tesoureiro de “Candace, rainha dos etíopes”; Estrabão conta a guerra de Roma com uma Candace em 25–22 a.C."
    - "Hoje a maior parte da terra de Cuxe fica na República do Sudão. As pirâmides de Meroé e os templos de Gebel Barkal estão na lista da UNESCO; o vale núbio abaixo da Segunda Catarata jaz sob o Lago Nasser desde a Represa de Assuã, seus templos transferidos para terreno mais alto; e os reinos cristãos da Núbia, que duraram do século VI ao XV, deixaram catedrais pintadas em Faras e na Velha Dongola."
  de:
    - "Kusch ist der Name der Bibel für das Land südlich von Ägypten, jenseits der Katarakte des Nils: Nubien, der heutige Nordsudan. Die Ägypter nannten es Kasch; die Griechen nannten seine Bewohner Aithiopes, „verbrannte Gesichter“, und die Septuaginta, die King-James-Bibel („Ethiopia“) und die Synodalbibel („Ефиопия“) folgen ihnen, obwohl dies nicht das Äthiopien von Addis Abeba ist. Die Genesis nennt Kusch als Ersten unter den Söhnen Hams und als Vater Nimrods, und der Fluss Gihon umfließt „das ganze Mohrenland“, wo allein der synodale Text den Namen Куш bewahrt. Ahasveros im Buch Ester herrschte „von Indien bis an Mohrenland“."
    - "Das Königreich Kerma blühte oberhalb des Dritten Katarakts von etwa 2500 v. Chr., bis die Pharaonen des Neuen Reiches Nubien eroberten. Um 728 v. Chr. eroberte Piye von Napata Ägypten selbst, und seine Linie herrschte dort als 25. Dynastie: Piye, Schabaka, Taharqa. Die Bibel kennt Taharqa als „Thirhaka, dem König der Mohren“, der 701 v. Chr. gegen Sanherib auszog; er wurde erst um 690 König, und die meisten Gelehrten verstehen den Titel als den, den er später trug, während einige die Episode in einen zweiten, späteren Feldzug setzen. Jesaja ging nackt und barfuß „zum Zeichen und Wunder dreier Jahre über Ägypten und Mohrenland“, und Juda sollte „mit Schanden bestehen über dem Mohrenland, darauf sie sich verließen“: Asarhaddon nahm 671 Memphis ein und Assurbanipal plünderte 663 Theben, von dem Nahum sagt: „Mohren und Ägypten war ihre unzählige Macht“."
    - "Die Propheten blicken auf Kusch am Ende der Welt. Jesaja richtet sein Wort an das Land, „das unter den Segeln im Schatten fährt, jenseits der Wasser des Mohrenlandes“, dessen Gesandte „in Rohrschiffen auf den Wassern“ fahren, und verheißt, sein Geschenk werde nach Zion gebracht; der Psalm singt: „Mohrenland wird seine Hände ausstrecken zu Gott“, und Zefanja, man werde dem Herrn seine Anbeter „von jenseit des Wassers im Mohrenlande“ als Geschenk bringen. Jeremia fragt: „Kann auch ein Mohr seine Haut wandeln oder ein Parder seine Flecken?“, und Amos erinnert Israel, dass es Gott gelte „gleichwie Mohren“. Ab etwa 300 v. Chr. wurden die Könige weiter südlich in Meroe bestattet, wo Königinnen mit dem Titel Kandake herrschten; Philippus taufte den Schatzmeister „der Königin Kandaze in Mohrenland“; Strabon berichtet von Roms Krieg mit einer Kandake 25–22 v. Chr."
    - "Heute liegt der größte Teil des Landes Kusch in der Republik Sudan. Die Pyramiden von Meroe und die Tempel des Gebel Barkal stehen auf der UNESCO-Liste; das nubische Tal unterhalb des Zweiten Katarakts liegt seit dem Assuan-Hochdamm unter dem Nassersee, seine Tempel wurden auf höheres Gelände versetzt; und die christlichen Königreiche Nubiens, die vom 6. bis ins 15. Jahrhundert bestanden, hinterließen bemalte Kathedralen in Faras und Alt-Dongola."
  fr:
    - "Cusch est le nom biblique du pays au sud de l’Égypte, au-delà des cataractes du Nil : la Nubie, le nord du Soudan actuel. Les Égyptiens l’appelaient Kash ; les Grecs appelaient ses habitants Aithiopes, « visages brûlés », et la Septante, la version du roi Jacques (« Ethiopia ») et la Bible synodale (« Ефиопия ») les suivent, bien que ce ne soit pas l’Éthiopie d’Addis-Abeba. La Genèse nomme Cusch en premier parmi les fils de Cham et père de Nimrod, et le fleuve Guihon « entoure tout le pays de Cusch », où le texte synodal garde le nom Куш, comme la Louis Segond (Cusch). Assuérus d’Esther régnait « depuis l’Inde jusqu’en Éthiopie »."
    - "Le royaume de Kerma prospéra au-dessus de la troisième cataracte dès 2500 av. J.-C. environ, jusqu’à la conquête de la Nubie par les pharaons du Nouvel Empire. Vers 728 av. J.-C., Piyé de Napata conquit l’Égypte, où sa lignée régna comme XXVe dynastie : Piyé, Chabaka, Taharqa. La Bible nomme Taharqa « Tirhaka, roi d’Éthiopie », qui sortit contre Sanchérib en 701 av. J.-C. ; roi seulement vers 690, il reçoit, selon la plupart des spécialistes, le titre qu’il porta plus tard, d’autres plaçant l’épisode dans une seconde campagne. Ésaïe marcha nu et déchaussé trois ans pour « un signe et un présage pour l’Égypte et pour l’Éthiopie », et Juda serait confondu « à cause de l’Éthiopie en qui l’on avait mis sa confiance » : Esar-Haddon prit Memphis en 671 et Assurbanipal saccagea Thèbes en 663, dont Nahum dit que « l’Éthiopie et les Égyptiens innombrables faisaient sa force »."
    - "Les prophètes regardent Cusch comme au bout du monde. Ésaïe envoie un message à la « terre, où retentit le cliquetis des armes, au-delà des fleuves de l’Éthiopie », dont les messagers viennent « dans des navires de jonc », et promet son présent à Sion ; le psaume chante que « l’Éthiopie accourt, les mains tendues vers Dieu », et Sophonie que « d’au-delà des fleuves de l’Éthiopie » les adorateurs du Seigneur lui apporteront des offrandes. Jérémie demande : « Un Éthiopien peut-il changer sa peau, et un léopard ses taches ? », et Amos rappelle à Israël qu’il est pour Dieu comme « les enfants des Éthiopiens ». Vers 300 av. J.-C., les rois furent enterrés plus au sud, à Méroé, où des reines régnaient avec le titre de kandake ; Philippe baptisa le trésorier de « Candace, reine d’Éthiopie » ; Strabon rapporte la guerre de Rome contre une Candace en 25–22 av. J.-C."
    - "Aujourd’hui, la plus grande partie du pays de Cusch se trouve dans la République du Soudan. Les pyramides de Méroé et les temples du Gebel Barkal figurent sur la liste de l’UNESCO ; la vallée nubienne en aval de la deuxième cataracte repose sous le lac Nasser depuis le haut barrage d’Assouan, ses temples ayant été déplacés en hauteur ; et les royaumes chrétiens de Nubie, qui durèrent du VIe au XVe siècle, ont laissé des cathédrales peintes à Faras et à Old Dongola."
  it:
    - "Cus è il nome biblico della terra a sud dell’Egitto, oltre le cateratte del Nilo: la Nubia, l’attuale Sudan settentrionale. Gli Egizi la chiamavano Kash; i Greci chiamavano i suoi abitanti Aithiopes, «volti bruciati», e la Settanta, la King James Version («Ethiopia») e la Bibbia sinodale («Ефиопия») li seguono, benché questa non sia l’Etiopia di Addis Abeba. La Genesi nomina Cus per primo fra i figli di Cam e padre di Nimrod, e il fiume Ghicon circonda «tutto il paese di Cush», dove, fra queste versioni, solo il testo sinodale conserva il nome Куш. Assuero, in Ester, regnò «dall’India sino all’Etiopia»."
    - "Il regno di Kerma fiorì sopra la Terza Cateratta dal 2500 a.C. circa finché i faraoni del Nuovo Regno conquistarono la Nubia. Intorno al 728 a.C. Piye di Napata conquistò l’Egitto stesso, e la sua stirpe vi regnò come Venticinquesima dinastia: Piye, Sabaka, Taharqa. La Bibbia conosce Taharqa come «Tirhaka, re d’Etiopia», che uscì contro Sennacherib nel 701 a.C.; divenne re solo verso il 690, e la maggior parte degli studiosi legge il titolo come quello che portò più tardi, mentre altri lo collocano in una seconda campagna, più tarda. Isaia andò seminudo e scalzo, «segno e presagio, durante tre anni, contro l’Egitto e contro l’Etiopia», e Giuda sarebbe stata confusa «a motivo dell’Etiopia in cui avevan riposta la loro speranza»: Assaraddon prese Menfi nel 671 e Assurbanipal saccheggiò Tebe nel 663, della quale Naum dice che «l’Etiopia e l’Egitto eran la sua forza»."
    - "I profeti guardano a Cus alla fine del mondo. Isaia manda un messaggio al «paese dall’ali strepitanti oltre i fiumi dell’Etiopia», i cui ambasciatori vengono «in navicelle di papiro», e promette che il suo dono sarà portato a Sion; il salmo canta che «l’Etiopia s’affretterà a tender le mani verso Dio», e Sofonia che «di là dai fiumi d’Etiopia i miei supplicanti, i miei figliuoli dispersi, mi porteranno le loro offerte». Geremia chiede: «Un moro può egli mutar la sua pelle o un leopardo le sue macchie?», e Amos ricorda a Israele che è per Dio come i «figliuoli degli Etiopi». Dal 300 a.C. circa i re furono sepolti più a sud, a Meroe, dove regnavano regine con il titolo di candace; Filippo battezzò il tesoriere di «Candace, regina degli Etiopi»; Strabone narra la guerra di Roma contro una Candace nel 25–22 a.C."
    - "Oggi la maggior parte della terra di Cus si trova nella Repubblica del Sudan. Le piramidi di Meroe e i templi di Gebel Barkal sono nella lista dell’UNESCO; la valle nubiana sotto la Seconda Cateratta giace sotto il Lago Nasser dalla costruzione della diga di Assuan, con i suoi templi spostati più in alto; e i regni cristiani di Nubia, durati dal VI al XV secolo, hanno lasciato cattedrali dipinte a Faras e a Vecchia Dongola."
  pl:
    - "Kusz to biblijna nazwa ziemi na południe od Egiptu, za kataraktami Nilu: Nubii, dzisiejszego północnego Sudanu. Egipcjanie nazywali ją Kasz; Grecy nazywali jej mieszkańców Aithiopes, „spalone twarze”, a idą za nimi Septuaginta, Biblia Króla Jakuba („Ethiopia”) i Biblia synodalna („Ефиопия”), choć nie jest to Etiopia z Addis Abeby. Księga Rodzaju wymienia Kusza jako pierwszego wśród synów Chama i ojca Nimroda, a rzeka Gichon okrąża całą ziemię Kusz (Etiopię), gdzie tylko tekst synodalny zachowuje nazwę Куш. Aswerus z Księgi Estery panował od Indii aż po Kusz (Etiopię)."
    - "Królestwo Kerma kwitło powyżej Trzeciej Katarakty od około 2500 r. p.n.e., aż faraonowie Nowego Państwa podbili Nubię. Około 728 r. p.n.e. Piye z Napaty podbił sam Egipt, a jego ród rządził nim jako XXV dynastia: Piye, Szabaka, Taharka. Biblia mówi o „Tyraku, królu Etyjopskim”, który wystąpił przeciw Sennacherybowi w 701 r. p.n.e.; został królem dopiero około 690 r., a większość uczonych odczytuje ten tytuł jako ten, który nosił później, podczas gdy niektórzy umieszczają epizod w drugiej, późniejszej kampanii. Izajasz chodził nago i boso trzy lata jako znak i cud dla Egiptu i Kuszu (Etiopii), a Juda miała się wstydzić Kuszu, w którym pokładała nadzieję: Asarhaddon zdobył Memfis w 671 r., a Aszurbanipal złupił No w 663 r., o którym Nahum mówi, że jego siłą były Kusz i Egipt."
    - "Prorocy spoglądają na Kusz na końcu świata. Izajasz posyła wieść do „ziemi, którą zaćmiają skrzydła”, położonej za rzekami Kuszu, której posłowie przybywają „w łodziach z sitowia”, i obiecuje, że jej dar zostanie przyniesiony na Syjon; psalm śpiewa, że Kusz szybko wyciągnie ręce do Boga, a Sofoniasz, że zza rzek Kuszu błagający Pana przyniosą mu dar. Jeremiasz pyta, czy Etiopczyk może odmienić swoją skórę, a lampart swoje plamy, a Amos przypomina Izraelowi, że dla Boga jest on jak synowie Etiopczyków. Od około 300 r. p.n.e. królów chowano dalej na południu, w Meroe, gdzie rządziły królowe z tytułem kandake; Filip ochrzcił skarbnika Kandake, królowej Etiopczyków; Strabon opowiada o wojnie Rzymu z pewną Kandake w latach 25–22 p.n.e."
    - "Dziś większa część ziemi Kusz leży w Republice Sudanu. Piramidy Meroe i świątynie Gebel Barkal są na liście UNESCO; dolina nubijska poniżej Drugiej Katarakty leży pod Jeziorem Nasera od czasu Wielkiej Tamy w Asuanie, a jej świątynie przeniesiono na wyższy teren; chrześcijańskie królestwa Nubii, które trwały od VI do XV w., zostawiły malowane katedry w Faras i Starej Dongoli."
  nl:
    - "Kus is de bijbelse naam van het land ten zuiden van Egypte, voorbij de stroomversnellingen van de Nijl: Nubië, het huidige noorden van Soedan. De Egyptenaren noemden het Kash; de Grieken noemden de bewoners Aithiopes, “verbrande gezichten”, en de Septuaginta, de King James Version (“Ethiopia”) en de Synodale Bijbel (“Ефиопия”) volgen hen, al is dit niet het Ethiopië van Addis Abeba. Genesis noemt Kus het eerst onder de zonen van Cham en als vader van Nimrod, en de rivier Gihon omloopt “het ganse land Cusch”, waar de King James Version “the whole land of Ethiopia” leest en de Synodale tekst de naam Куш behoudt. Ahasveros in Ester regeerde “van Indie af tot aan Morenland toe”."
    - "Het koninkrijk Kerma bloeide boven de Derde Cataract vanaf zo'n 2500 v.Chr. totdat de farao's van het Nieuwe Rijk Nubië veroverden. Omstreeks 728 v.Chr. veroverde Piye van Napata Egypte zelf, en zijn geslacht regeerde als de Vijfentwintigste Dynastie: Piye, Shabaka, Taharqa. De Bijbel kent Taharqa als “Tirhaka, den koning van Cusch”, die in 701 v.Chr. tegen Sanherib optrok; koning werd hij pas omstreeks 690, en de meeste geleerden lezen de titel als die welke hij later droeg, terwijl sommigen de episode in een tweede, latere veldtocht plaatsen. Jesaja liep drie jaar naakt en barrevoets “tot een teken en wonder over Egypte en over Morenland”, en Juda zou “beschaamd zijn van de Moren, op dewelke zij zagen”: Esarhaddon nam Memfis in 671 in en Assurbanipal plunderde Thebe in 663, waarvan Nahum zegt: “Morenland en Egypte waren haar macht”."
    - "De profeten kijken naar Kus aan het einde van de wereld. Jesaja zendt een boodschap aan “het land, dat schaduwachtig is aan de frontieren, dat aan de zijde der rivieren van Morenland is”, wier gezanten komen “in schepen van biezen”, en belooft dat zijn gave naar Sion komt; de psalm zingt dat “Morenland zal zich haasten zijn handen tot God uit te strekken”, en Zefanja dat “van de zijden der rivieren der Moren” de smekelingen van de HEER zijn offer brengen. Jeremia vraagt: “Zal ook een Moorman zijn huid veranderen? of een luipaard zijn vlekken?”, en Amos zegt Israël dat het voor God is als “de kinderen der Moren”. Vanaf ca. 300 v.Chr. werden de koningen verder zuidelijk bij Meroë begraven, waar koninginnen regeerden met de titel kandake; Filippus doopte de schatmeester van “Candace, de koningin der Moren”; Strabo vertelt van Romes oorlog met een Candace in 25–22 v.Chr."
    - "Tegenwoordig ligt het grootste deel van het land Kus in de Republiek Soedan. De piramiden van Meroë en de tempels van Gebel Barkal staan op de UNESCO-lijst; de Nubische vallei beneden de Tweede Cataract ligt sinds de Hoge Dam van Aswan onder het Nassermeer, haar tempels verplaatst naar hoger gelegen grond; en de christelijke koninkrijken van Nubië, die van de zesde tot de vijftiende eeuw bestonden, lieten beschilderde kathedralen na te Faras en Oud-Dongola."
  cs:
    - "Kúš je biblické jméno země jižně od Egypta, za nilskými kataraktami: Núbie, dnešní severní Súdán. Egypťané ji nazývali Kaš; Řekové nazývali její lid Aithiopes, „spálené tváře“, a Septuaginta, Bible krále Jakuba („Ethiopia“) a synodální Bible („Ефиопия“) je následují, ač to není Etiopie Addis Abeby. Genesis jmenuje Kúše jako prvního mezi syny Chamovými a otce Nimrodova a řeka Gichón „obchází všecku zemi Chus“, kde na rozdíl od anglického textu synodální text zachovává jméno Куш. Achašveroš z knihy Ester kraloval „od Indie až k Mouřenínské zemi“."
    - "Království Kerma vzkvétalo nad třetím kataraktem od roku asi 2500 př. n. l., dokud Núbii nedobyli faraóni Nové říše. Kolem roku 728 př. n. l. dobyl Egypt samotný Piye z Napaty a jeho rod jí vládl jako 25. dynastie: Piye, Šabaka, Taharka. Bible o Taharkovi mluví jako o „Tirhákovi králi Mouřenínském“, který vytáhl proti Senacheribovi roku 701 př. n. l.; králem se stal teprve kolem roku 690 a většina badatelů čte titul jako ten, který nesl později, zatímco někteří kladou epizodu do druhého, pozdějšího tažení. Izajáš chodil nahý a bos tři roky „na znamení a zázrak, třetího roku Egypta a Mouřenínské země“ a Juda se měl zastydět „nad Mouřeníny, útočištěm svým“: Asarhadón dobyl Memfis roku 671 a Aššurbanipal vyplenil Théby roku 663, o nichž Nachum praví, že „Mouřenínská země i Egypt silou jeho byla“."
    - "Proroci hledí ke Kúši na konci světa. Izajáš posílá zprávu „zemi zastěňující se křídly, kteráž jest při řekách země Mouřenínské“, jejíž vyslanci přicházejí „v nástrojích z sítí po vodách“, a slibuje, že její dar bude přinesen na Sijón; žalm zpívá, že „Mouřenínská země rychle vztáhne ruku svou k Bohu“, a Sofonjáš, že ti, kteříž jsou „za řekami Mouřenínské země“, přinesou Pánu svůj dar. Jeremjáš se ptá slovy: „Může-li změniti Mouřenín kůži svou, aneb pardus peřestost svou“ a Amos připomíná Izraeli, že je Bohu jako „synům Mouřenínů“. Od roku asi 300 př. n. l. byli králové pohřbíváni dále na jihu v Meroe, kde vládly královny s titulem kandake; Filip pokřtil pokladníka „královny Mouřenínské Kandáces“; Strabón vypráví o válce Říma s jednou Kandake v letech 25–22 př. n. l."
    - "Dnes leží většina země Kúš v Súdánské republice. Pyramidy v Meroe a chrámy Gebel Barkal jsou na seznamu UNESCO; núbijské údolí pod druhým kataraktem leží od výstavby Asuánské přehrady pod Násirovým jezerem, jeho chrámy byly přeneseny na vyšší místo; a křesťanská království Núbie, která trvala od 6. do 15. století, zanechala malované katedrály ve Farasu a Starém Dongole."
  sv:
    - "Kush är Bibelns namn på landet söder om Egypten, bortom Nilens katarakter: Nubien, dagens norra Sudan. Egyptierna kallade det Kash; grekerna kallade dess folk Aithiopes, ”brända ansikten”, och Septuaginta, King James-bibeln (”Ethiopia”) och den synodala bibeln (”Ефиопия”) följer dem, fast detta inte är Etiopien i Addis Abeba. Första Mosebok nämner Kush först bland Hams söner och som far till Nimrod, och floden Gihon flyter omkring ”hela landet Kus”, där den synodala texten ensam behåller namnet Куш. Ahasveros i Ester regerade ”från Indien ända till Etiopien”."
    - "Kungariket Kerma blomstrade ovanför tredje katarakten från omkring 2500 f.Kr. tills det nya rikets faraoner erövrade Nubien. Omkring 728 f.Kr. erövrade Piye av Napata själva Egypten, och hans ätt styrde det som tjugofemte dynastin: Piye, Shabaka, Taharqa. Bibeln känner Taharqa som ”Tirhaka, konungen i Etiopien”, som drog ut mot Sanherib 701 f.Kr.; han blev kung först omkring 690, och de flesta forskare läser titeln som den han bar senare, medan några förlägger episoden till ett andra, senare fälttåg. Jesaja gick naken och barfota i tre år ”till tecken och förebild angående Egypten och Etiopien”, och Juda skulle ”blygas över Etiopien, som var deras hopp”: Esarhaddon intog Memfis 671 och Assurbanipal plundrade Thebe 663, om vilken Nahum säger: ”Etiopier i mängd och egyptier utan ände, putéer och libyer voro dig till hjälp.”"
    - "Profeterna ser till Kush vid världens ände. Jesaja vänder sig till ”du land där flygfän surra, du land bortom Etiopiens strömmar”, vars sändebud kommer ”i rörskepp hän över vattnet”, och lovar att dess skänker skall bäras fram till Sions berg; psalmen sjunger: ”Etiopien skall skynda hit till Gud, med gåvor i händerna”, och Sefanja att ”ända ifrån länderna bortom Etiopiens strömmar” skall Herrens tillbedjare frambära offer åt honom. Jeremia frågar: ”Kan väl en etiopier förvandla sin hud eller en panter sina fläckar?”, och Amos påminner Israel om att det för Gud är ”lika med etiopiernas barn”. Från omkring 300 f.Kr. begravdes kungarna längre söderut i Meroë, där drottningar styrde med titeln kandake; Filippos döpte skattmästaren hos ”Kandace, drottningen i Etiopien”; Strabon berättar om Roms krig mot en Candace 25–22 f.Kr."
    - "I dag ligger större delen av Kushs land i Republiken Sudan. Meroës pyramider och Gebel Barkals tempel finns på Unescos lista; den nubiska dalen nedanför andra katarakten ligger under Nassersjön sedan Assuandammen byggdes, med dess tempel flyttade till högre mark; och Nubiens kristna kungariken, från 500-talet till 1400-talet, lämnade målade katedraler i Faras och Gamla Dongola."
  nb:
    - "Kusj er Bibelens navn på landet sør for Egypt, bortenfor Nilens katarakter: Nubia, dagens nordlige Sudan. Egypterne kalte det Kash; grekerne kalte folket Aithiopes, «brente ansikter», og Septuaginta, King James-oversettelsen («Ethiopia») og den synodale bibelen («Ефиопия») følger dem, selv om dette ikke er Etiopia med Addis Abeba. 1. Mosebok nevner Kusj først blant Kams sønner og som far til Nimrod, og elven Gihon omgir «hele landet Kus», der den synodale teksten alene av dem beholder navnet Куш. Esters Ahasverus regjerte «fra India like til Etiopia»."
    - "Kongeriket Kerma blomstret ovenfor den tredje katarakt fra omkring 2500 f.Kr. til faraoene i Det nye rike erobret Nubia. Omkring 728 f.Kr. erobret Piye av Napata selve Egypt, og hans slekt styrte det som 25. dynasti: Piye, Shabaka, Taharqa. Bibelen kjenner Taharqa som «Tirhaka, kongen i Etiopia», som drog ut mot Sankerib i 701 f.Kr.; han ble konge først omkring 690, og de fleste forskere leser tittelen som den han bar senere, mens noen plasserer episoden i et annet, senere felttog. Jesaja gikk naken og barfotet i tre år som «et tegn og varsel om Egypten og Etiopia», og Juda ville «ha skam av Etiopia, som de satte sitt håp til»: Asarhaddon tok Memfis i 671 og Assurbanipal plyndret Teben i 663, om hvilken Nahum sier at «Etiopere i mengde og egyptere uten tall, puteere og libyere var dets hjelp»."
    - "Profetene ser mot Kusj ved verdens ende. Jesaja sender bud til «du land med hvinende vinger bortenfor Etiopias strømmer», hvis sendebud kommer «i rørbåter over vannene», og lover at dets gave skal bæres til Sion; salmen synger at «Etiopia skal i hast utrekke sine hender til Gud», og Sefanja at de skal føre Herrens tilbedere som offergave «fra landet bortenfor Etiopias elver». Jeremia spør: «Kan en morian omskifte sin hud, eller en leopard sine flekker?», og Amos minner Israel om at det er for Gud som «etiopernes barn». Fra omkring 300 f.Kr. ble kongene gravlagt lenger sør i Meroë, der dronninger styrte med tittelen kandake; Filip døpte skattmesteren til «Kandake, etiopernes dronning»; Strabon forteller om Romas krig mot en Kandake i 25–22 f.Kr."
    - "I dag ligger det meste av Kusj' land i Republikken Sudan. Pyramidene i Meroë og templene ved Gebel Barkal står på UNESCO-listen; den nubiske dalen nedenfor den andre katarakt ligger under Nassersjøen siden Aswan-demningen, med templene flyttet til høyere grunn; og Nubias kristne kongedømmer, fra 500-tallet til 1400-tallet, etterlot malte katedraler i Faras og Old Dongola."
  tl:
    - "Ang Cush ang pangalang ibinibigay ng Bibliya sa lupain sa timog ng Egipto, sa kabila ng mga talon ng Nilo: ang Nubia, ang hilagang Sudan ngayon. Tinawag ito ng mga Egipcio na Kash; tinawag ng mga Griyego ang mga tao nitong Aithiopes, “sunog na mga mukha”, at sinusunod sila ng Septuaginta, ng King James Version (“Ethiopia”) at ng Bibliyang Sinodal (“Ефиопия”), bagaman hindi ito ang Etiopia ng Addis Ababa. Pinangangalanan ng Genesis ang Cush na una sa mga anak ni Ham at ama ni Nimrod, at ang ilog Gihon ay umiikot sa “buong lupain ng Cush”, kung saan iniingatan ng tekstong Sinodal ang pangalang Куш. Si Assuero ni Esther ay naghari “mula sa India hanggang sa Etiopia”."
    - "Umunlad ang Kerma sa itaas ng Ikatlong Talon mula mga 2500 BK hanggang sakupin ng mga faraon ng Bagong Kaharian ang Nubia. Noong mga 728 BK, sinakop ni Piye ng Napata ang Egipto, at ang angkan niya ang namuno rito bilang Ika-25 Dinastiya: Piye, Shabaka, Taharqa. Si Taharqa sa Bibliya ay “Thiraca na hari sa Ethiopia”, na lumaban kay Sennacherib noong 701 BK; naging hari siya noong mga 690 lamang, at binabasa ito ng karamihan bilang titulong dinala niya nang huli, at inilalagay ng ilan ang pangyayari sa ikalawang kampanya, mas huli. Lumakad si Isaias na hubad at nakapaa nang tatlong taon, “pinakatanda at pinakakamanghaan sa Egipto at sa Etiopia”, at ang Juda ay “mangapapahiya, dahil sa Etiopia na kanilang pagasa”: kinuha ni Esar-hadon ang Memfis (671) at sinamsam ni Ashurbanipal ang Thebes (663), na, sabi ni Nahum, “Etiopia at Egipto ang kaniyang mga naging katibayan”."
    - "Sa mga propeta, nasa dulo ng daigdig ang Cush. Nagpapadala si Isaias ng salita sa “lupain ng pagaspas ng mga pakpak, na nasa dako roon ng mga ilog ng Etiopia”, na ang mga sugo'y dumarating “sa mga sasakyang papiro sa tubig”, at nangangakong dadalhin sa Sion ang kaloob nito; “magmamadali ang Etiopia na igawad ang kaniyang mga kamay sa Dios”, sabi ng salmo; “mula sa dako roon ng mga ilog ng Etiopia” magdadala ng handog ang mga nagsisipamanhik, sabi ni Zefanias. Tanong ni Jeremias, “Makapagbabago baga ang Etiope ng kaniyang balat, o ang leopardo ng kaniyang batik?”; paalala ni Amos sa Israel na sila'y gaya ng “mga anak ng mga taga Etiopia” sa Dios. Mula mga 300 BK inilibing sa Meroe ang mga hari, at mga reynang kandake ang namuno; binautismuhan ni Felipe ang ingat-yaman ng “Candace, reina ng mga Etiope”; ayon kay Strabo, nakipagdigma ang Roma sa isang Candace (25–22 BK)."
    - "Karamihan sa lupain ng Cush ay nasa Republika ng Sudan ngayon. Nasa listahan ng UNESCO ang mga piramide ng Meroe at ang mga templo ng Gebel Barkal; ang libis ng Nubia sa ibaba ng Ikalawang Talon ay nasa ilalim ng Lawa ng Nasser mula sa Aswan High Dam, na ang mga templo ay inilipat sa mas mataas na lupa; at ang mga kahariang Kristiyano ng Nubia, mula ika-6 hanggang ika-15 siglo, ay nag-iwan ng mga katedral na ipininta sa Faras at Old Dongola."
  da:
    - "Kusj er Bibelens navn for landet syd for Egypten, hinsides Nilens katarakter: Nubien, nutidens nordlige Sudan. Egypterne kaldte det Kash; grækerne kaldte dets folk Aithiopes, »solbrændte ansigter«, og Septuaginta, King James-oversættelsen (»Ethiopia«) og den russiske synodalbibel (»Ефиопия«) følger dem, selv om dette ikke er Etiopien omkring Addis Abeba. 1 Mosebog nævner Kusj først blandt Kams sønner og som Nimrods far, og floden Gihon løber om »det ganske Land Kus«, som King James-oversættelsen gengiver »the whole land of Ethiopia«, mens den synodale tekst alene bevarer navnet Куш. Esters Ahasverus herskede »fra Indien og indtil Morland«."
    - "Kerma-riget blomstrede over tredje katarakt fra omkring 2500 f.Kr., indtil faraoerne i Det Nye Rige erobrede Nubien. Omkring 728 f.Kr. erobrede Piye fra Napata selve Egypten, og hans slægt herskede over det som 25. dynasti: Piye, Shabaka, Taharqa. Bibelen kender Taharqa som »Thirhaka, Morlands Konge«, der drog ud imod Sankerib i 701 f.Kr.; han blev først konge omkring 690, og de fleste forskere læser titlen som den, han bar senere, mens nogle placerer episoden i et andet, senere felttog. Esajas gik nøgen og barfodet i tre år »til et Tegn og Forbillede over Ægypten og over Morland«, og Juda ville »beskæmmes over Morland, som de saa op til«: Esarhaddon indtog Memfis i 671 og Assurbanipal plyndrede Theben i 663, om hvilken Nahum siger, at »Morianer i Mængde og Ægypter uden Tal, de af Put og Lybia vare din Hjælp«."
    - "Profeterne ser mod Kusj ved verdens ende. Esajas sender bud til »det Land med de susende Vinger, paa hin Side af Morlands Floder«, hvis sendebud kommer »med Fartøj af Rør«, og lover, at dets gave skal bringes til Zion; salmen synger, at »Morland skal hastelig udstrække sine Hænder til Gud«, og Sefanja, at »Fra hin Side af Morlands Floder« skal Herrens tilbedere bringe hans offergave. Jeremias spørger: »Kan en Morian omskifte sin Hud eller en Parder sine Pletter«? Og Amos minder Israel om, at det for Gud er som »Morianers Børn«. Fra omkring 300 f.Kr. blev kongerne begravet længere sydpå ved Meroë, hvor dronninger herskede med titlen kandake; Filip døbte skatmesteren hos »Kandake, Æthiopernes Dronning«; Strabon fortæller om Roms krig med en Kandake i 25–22 f.Kr."
    - "I dag ligger det meste af Kusj-landet i Republikken Sudan. Meroës pyramider og Gebel Barkals templer står på UNESCO-listen; Nubiadalen neden for anden katarakt ligger under Nassersøen siden Aswan-dæmningen, dens templer er flyttet til højere terræn; og Nubiens kristne kongedømmer efterlod fra 500- til 1400-tallet malede katedraler i Faras og Old Dongola."
