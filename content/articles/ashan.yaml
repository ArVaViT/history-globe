body:
  en:
    - "Ashan, “smoke”, is a town of the south of Judah known only from lists. Joshua counts it among the towns of Judah in the Shephelah with “Libnah, and Ether, and Ashan”, and again among the towns given to Simeon within Judah, “Ain, Remmon, and Ether, and Ashan; four cities and their villages”; Chronicles repeats the Simeonite list and makes Ashan a Levitical town of the priests, where the parallel list in Joshua reads Ain. The Chor-ashan (Bor-ashan, “the well of Ashan”) to which David sent a share of the Amalekite spoil from Ziklag, beside Hormah and Athach, is very probably the same place. That is all the Bible says, and no later writer adds anything certain."
    - "The lists pull in two directions, the lowland near Libnah and the Negeb near Beersheba, so the site is disputed and the map keeps the candidates. Many prefer Khirbet Asan, a small ruin a few kilometres north-west of Beersheba, where the name seems to survive; Aharoni proposed Tell Beit Mirsim, the large mound in the southern Shephelah dug by Albright, and others Tel Goded (Tell ej-Judeideh) further north, or Khirbet Muleh. None of these has yielded an inscription, and nothing has been excavated as Ashan."
    - "Khirbet Asan today lies on the northern outskirts of Beersheba, the city of the Negeb; the other candidates are tells in the farmland of the southern Shephelah and the northern Negeb."
  ru:
    - "Ашан, «дым», — город юга Иудеи, известный только по спискам. Иисус Навин считает его среди городов Иуды на низменности: «Ливна, Ефер и Ашан», и снова среди городов, отданных Симеону внутри удела Иуды: «Аин, Риммон, Ефер и Ашан: четыре города с селами их»; Паралипоменон повторяет симеонитский список и делает Ашан левитским городом священников, где параллельный список у Иисуса Навина читает Аин. Хорашан («колодец Ашана»), куда Давид послал из Секелага долю амаликитской добычи, рядом с Хормой и Атахом, — очень вероятно, то же место. Это всё, что говорит Библия, и никто из позднейших писателей не прибавляет ничего верного."
    - "Списки тянут в две стороны — на низменность у Ливны и в Негев у Вирсавии, — поэтому место спорно, и карта хранит кандидатов. Многие предпочитают Хирбет-Асан, небольшие руины в нескольких километрах к северо-западу от Беэр-Шевы, где, по-видимому, уцелело имя; Ахарони предлагал Телль-Бейт-Мирсим, большой холм в южной Шефеле, раскопанный Олбрайтом, а другие — Тель-Годед (Телль-эдж-Джудейде) севернее или Хирбет-Муле. Ни одно из этих мест не дало надписи, и ничто не раскопано как Ашан."
    - "Хирбет-Асан сегодня лежит на северной окраине Беэр-Шевы, главного города Негева; остальные кандидаты — холмы среди полей южной Шефелы и северного Негева."
  uk:
    - "Ашан, «дим», — місто півдня Юди, відоме лише з переліків. Ісус Навин зараховує його до міст Юди в Шефелі: «Либна, Етер і Ашан», і знову до міст, даних Симеонові в межах Юди: «Анн, Риммон, Етер та Ашан — чотири міста з їх селами»; Хроніки повторюють симеонівський перелік і роблять Ашан левітським містом священників, де паралельний перелік у книзі Ісуса Навина читає Аїн. Хор-Ашан (Бор-Ашан, «колодязь Ашану»), куди Давид послав частку амалекитської здобичі з Ціклагу, поруч із Хормою й Атахом («в Хормі й в Хорашанї, й в Атасї»), дуже ймовірно, те саме місце. Це все, що каже Біблія, і жоден пізніший автор не додає нічого певного."
    - "Переліки тягнуть у два боки — до низини біля Лівни та до Негеву біля Беер-Шеви, тож місце спірне, і мапа зберігає кандидатів. Багато хто віддає перевагу Хірбет-Асану, невеликій руїні за кілька кілометрів на північний захід від Беер-Шеви, де назва, схоже, збереглася; Ахароні пропонував Телль-Бейт-Мірсім, великий пагорб у південній Шефелі, який розкопував Олбрайт, а інші — Тель-Годед (Телль-ед-Джудейде) далі на північ або Хірбет-Муле. Жодне з них не дало напису, і ніщо не розкопано як Ашан."
    - "Хірбет-Асан нині лежить на північних околицях Беер-Шеви, міста Негеву; інші кандидати — телі в ріллі південної Шефели та північного Негеву."
  es:
    - "Asán, «humo», es una ciudad del sur de Judá conocida solo por listas. Josué la cuenta entre las ciudades de Judá en la Sefelá con «Libna, y Ether, y Asán», y de nuevo entre las ciudades dadas a Simeón dentro de Judá, «Aín, Rimmón, Eter, y Asán; cuatro ciudades con sus aldeas»; las Crónicas repiten la lista de Simeón y hacen de Asán una ciudad levítica de los sacerdotes, allí donde la lista paralela de Josué lee Ain. El Chor-asán (Bor-asán, «el pozo de Asán») al que David envió una parte del botín amalecita de Siclag, junto a Horma y Atac, es muy probablemente el mismo lugar. Eso es todo lo que dice la Biblia, y ningún escritor posterior añade nada seguro."
    - "Las listas tiran en dos direcciones, la tierra baja cerca de Libna y el Néguev cerca de Beerseba, de modo que el sitio se discute y el mapa conserva los candidatos. Muchos prefieren Khirbet Asan, una pequeña ruina a pocos kilómetros al noroeste de Beerseba, donde el nombre parece sobrevivir; Aharoni propuso Tell Beit Mirsim, el gran montículo del sur de la Sefelá excavado por Albright, y otros Tel Goded (Tell ej-Judeideh), más al norte, o Khirbet Muleh. Ninguno de estos ha dado una inscripción, y nada ha sido excavado como Asán."
    - "Khirbet Asan se encuentra hoy en las afueras septentrionales de Beerseba, la ciudad del Néguev; los demás candidatos son tells en las tierras de labranza del sur de la Sefelá y del norte del Néguev."
  pt:
    - "Asã, “fumaça”, é uma cidade do sul de Judá conhecida apenas por listas. Josué a conta entre as cidades de Judá na Sefelá com “Libna, Eter, Asã”, e de novo entre as cidades dadas a Simeão dentro de Judá, “Aim, Rimom, Eter e Asã; quatro cidades com as suas aldeias”; Crônicas repete a lista simeonita e faz de Asã uma cidade levítica dos sacerdotes, onde a lista paralela de Josué lê Aim. O Bor-Asã (“o poço de Asã”) a que Davi enviou parte do despojo dos amalequitas de Ziclague, ao lado de Hormá e Atace, é muito provavelmente o mesmo lugar. Isso é tudo o que a Bíblia diz, e nenhum escritor posterior acrescenta algo seguro."
    - "As listas puxam em duas direções, a baixada perto de Libna e o Neguebe perto de Berseba, de modo que o sítio é discutido e o mapa guarda os candidatos. Muitos preferem Khirbet Asan, uma pequena ruína a poucos quilômetros a noroeste de Berseba, onde o nome parece sobreviver; Aharoni propôs Tell Beit Mirsim, o grande montículo da Sefelá meridional escavado por Albright, e outros Tel Goded (Tell ej-Judeideh), mais ao norte, ou Khirbet Muleh. Nenhum rendeu uma inscrição, e nada foi escavado como Asã."
    - "Khirbet Asan fica hoje nos arredores setentrionais de Berseba, a cidade do Neguebe; os outros candidatos são tells nas terras agrícolas da Sefelá meridional e do Neguebe setentrional."
  de:
    - "Aschan, „Rauch“, ist eine Stadt im Süden Judas, nur aus Listen bekannt. Josua zählt sie unter den Städten Judas in der Schefela auf mit „Libna, Ether, Asan“ und noch einmal unter den Simeon innerhalb Judas gegebenen Städten, „Ain, Rimmon, Ehter, Asan. Das sind vier Städte und ihre Dörfer“; die Chronik wiederholt die simeonitische Liste und macht Aschan zu einer levitischen Priesterstadt, wo die Parallelliste bei Josua Ajin liest. Das Chor-Aschan (Bor-Aschan, „Brunnen von Aschan“), dem David einen Teil der amalekitischen Beute aus Ziklag sandte, neben Horma und Atach, ist sehr wahrscheinlich derselbe Ort. Das ist alles, was die Bibel sagt, und kein späterer Autor fügt etwas Sicheres hinzu."
    - "Die Listen ziehen in zwei Richtungen, in die Niederung bei Libna und in den Negev bei Beerscheba, daher ist die Stätte umstritten, und die Karte hält die Kandidaten fest. Viele bevorzugen Chirbet Asan, eine kleine Ruine einige Kilometer nordwestlich von Beerscheba, wo der Name zu überleben scheint; Aharoni schlug Tell Beit Mirsim vor, den großen Hügel in der südlichen Schefela, den Albright ausgrub, andere Tel Goded (Tell ej-Judeide) weiter nördlich oder Chirbet Muleh. Keiner hat eine Inschrift ergeben, und nichts wurde als Aschan ausgegraben."
    - "Chirbet Asan liegt heute am nördlichen Stadtrand von Beerscheba, der Stadt des Negev; die anderen Kandidaten sind Tells im Ackerland der südlichen Schefela und des nördlichen Negev."
  fr:
    - "Aschan, « fumée », est une ville du sud de Juda connue seulement par des listes. Josué la compte parmi les villes de Juda dans la Shéphéla, avec « Libna, Éther, Aschan », et de nouveau parmi les villes données à Siméon à l’intérieur de Juda, « Aïn, Rimmon, Éther, et Aschan, quatre villes, et leurs villages » ; les Chroniques reprennent la liste de Siméon et font d’Aschan une ville lévitique des prêtres, là où la liste parallèle de Josué porte Aïn. Le Cor-Aschan (Bor-Aschan, « le puits d’Aschan ») auquel David envoya une part du butin pris aux Amalécites à Tsiklag, à côté de Horma et d’Athac, est très probablement le même lieu. C’est tout ce que dit la Bible, et aucun écrivain ultérieur n’y ajoute rien de certain."
    - "Les listes tirent dans deux directions, la plaine près de Libna et le Négev près de Beer-Schéba ; le site est donc discuté et la carte garde les candidats. Beaucoup préfèrent Khirbet Asan, petite ruine à quelques kilomètres au nord-ouest de Beer-Schéba, où le nom semble survivre ; Aharoni a proposé Tell Beit Mirsim, grand tertre du sud de la Shéphéla fouillé par Albright, et d’autres Tel Goded (Tell ej-Judeideh) plus au nord, ou Khirbet Muleh. Aucun n’a livré d’inscription, et rien n’a été fouillé comme Aschan."
    - "Khirbet Asan se trouve aujourd’hui à la périphérie nord de Beer-Schéba, la ville du Négev ; les autres candidats sont des tells dans la campagne du sud de la Shéphéla et du nord du Négev."
  it:
    - "Asan, «fumo», è una città del sud di Giuda nota soltanto dagli elenchi. Giosuè la conta fra le città di Giuda nella Sefela con «Libna, Ether, Ashan», e di nuovo fra le città date a Simeone dentro Giuda, «Ain, Rimmon, Ether e Ashan: quattro città e i loro villaggi»; le Cronache ripetono l’elenco simeonita e fanno di Asan una città levitica dei sacerdoti, dove l’elenco parallelo di Giosuè legge Ain. Cor-Asan (Bor-Asan, «il pozzo di Asan»), a cui Davide mandò una parte del bottino amalechita da Siclag, accanto a Corma e Atach, è con ogni probabilità lo stesso luogo. Questo è tutto ciò che la Bibbia dice, e nessuno scrittore posteriore aggiunge nulla di certo."
    - "Gli elenchi tirano in due direzioni, la pianura presso Libna e il Negheb presso Bersabea, così il sito è discusso e la carta conserva i candidati. Molti preferiscono Khirbet Asan, una piccola rovina a pochi chilometri a nord-ovest di Bersabea, dove il nome pare sopravvivere; Aharoni ha proposto Tell Beit Mirsim, il grande tell nella Sefela meridionale scavato da Albright, e altri Tel Goded (Tell ej-Judeideh) più a nord, o Khirbet Muleh. Nessuno ha restituito un’iscrizione, e nulla è stato scavato come Asan."
    - "Khirbet Asan si trova oggi alla periferia settentrionale di Bersabea, la città del Negheb; gli altri candidati sono tell nelle campagne della Sefela meridionale e del Negheb settentrionale."
  pl:
    - "Aszan, „dym”, to miasto południa Judy znane tylko z wykazów. Jozue zalicza je do miast Judy w Szefeli z „Labana, i Eter, i Asan” i znów do miast oddanych Symeonowi wewnątrz Judy: „Ain, Remmon, i Atar, i Asan, miasta cztery, i wsi ich”; Księga Kronik powtarza wykaz symeonicki i czyni Aszan miastem lewickim kapłanów, tam gdzie paralelny wykaz u Jozuego czyta Ain. Chor-Aszan (Bor-Aszan, „studnia Aszan”), do którego Dawid posłał część łupu z Amalekitów z Siklag, obok Hormy i Atak, jest bardzo prawdopodobnie tym samym miejscem. To wszystko, co mówi Biblia, a żaden późniejszy pisarz nie dodaje nic pewnego."
    - "Wykazy ciągną w dwie strony, na nizinę koło Libny i na Negew koło Beer-Szeby, więc miejsce jest sporne, a mapa zachowuje kandydatów. Wielu woli Chirbet Asan, małą ruinę kilka kilometrów na północny zachód od Beer-Szeby, gdzie nazwa zdaje się przetrwać; Aharoni proponował Tell Beit Mirsim, wielki tell w południowej Szefeli kopany przez Albrighta, a inni Tel Goded (Tell ej-Judeideh) dalej na północ albo Chirbet Muleh. Żaden z nich nie dał napisu i nic nie wykopano jako Aszan."
    - "Chirbet Asan leży dziś na północnych obrzeżach Beer-Szeby, miasta Negewu; inni kandydaci to telle w polach południowej Szefeli i północnego Negewu."
  nl:
    - "Asan, “rook”, is een stad in het zuiden van Juda die alleen uit lijsten bekend is. Jozua rekent haar tot de steden van Juda in de Sefela met “Libna, en Ether, en Asan”, en opnieuw tot de steden die binnen Juda aan Simeon werden gegeven, “Ain, Rimmon, en Ether, en Asan; vier steden en haar dorpen”; Kronieken herhaalt de Simeonitische lijst en maakt Asan tot een levietenstad van de priesters, waar de parallelle lijst in Jozua Ain heeft. Het Chor-Asan (Bor-Asan, “de put van Asan”) waarheen David een deel van de Amalekitische buit uit Siklag zond, naast Chorma en Atach, is zeer waarschijnlijk dezelfde plaats. Meer zegt de Bijbel niet, en geen latere schrijver voegt iets zekers toe."
    - "De lijsten trekken twee kanten op, het laagland bij Libna en de Negev bij Berseba, dus de plaats is omstreden en de kaart bewaart de kandidaten. Velen verkiezen Khirbet Asan, een kleine ruïne enkele kilometers ten noordwesten van Berseba, waar de naam lijkt voort te leven; Aharoni stelde Tell Beit Mirsim voor, de grote heuvel in de zuidelijke Sefela die Albright opgroef, en anderen Tel Goded (Tell ej-Judeideh) verder naar het noorden, of Khirbet Muleh. Geen ervan heeft een opschrift opgeleverd, en niets is als Asan opgegraven."
    - "Khirbet Asan ligt nu aan de noordrand van Berseba, de stad van de Negev; de andere kandidaten zijn heuvels in het akkerland van de zuidelijke Sefela en de noordelijke Negev."
  cs:
    - "Ašan, „kouř“, je město na jihu Judska známé jen ze seznamů. Jozue je počítá mezi města Judy v Šefele s „Lebna, Eter a Asan“ a znovu mezi města dána Simeonovi uvnitř Judy, „Ain, Remmon, též Eter a Asan, města čtyři i vsi jejich“; Letopisy opakují simeonský seznam a činí z Ašanu levitské město kněží, kde paralelní seznam v Jozue čte Ain. Chor-ašan (Bor-ašan, „studna Ašanu“), kam David poslal podíl amalekské kořisti ze Siklagu, vedle Chormy a Atachu, je velmi pravděpodobně totéž místo. To je vše, co Bible říká, a žádný pozdější autor nepřidává nic jistého."
    - "Seznamy táhnou dvěma směry, k nížině poblíž Libny a k Negevu poblíž Beer-šeby, takže místo je sporné a mapa uchovává kandidáty. Mnozí dávají přednost Chirbet Asan, malé zřícenině několik kilometrů severozápadně od Beer-šeby, kde se zdá, že jméno přežívá; Aharoni navrhoval Tell Beit Mirsim, velký pahorek v jižní Šefele, kopaný Albrightem, a jiní Tel Goded (Tell ej-Judeideh) dále na sever, nebo Chirbet Muleh. Žádné z nich nevydalo nápis a nic nebylo vykopáno jako Ašan."
    - "Chirbet Asan leží dnes na severním okraji Beer-šeby, města Negevu; ostatní kandidáti jsou tely na polích jižní Šefely a severního Negevu."
  sv:
    - "Ashan, ”rök”, är en stad i södra Juda känd bara från förteckningar. Josua räknar den bland Judas städer i Shefela med ”Libna, Eter, Asan”, och åter bland de städer som gavs åt Simeon inom Juda, ”Ain, Rimmon, Eter och Asan -- fyra städer med deras byar”; Krönikeböckerna upprepar simeoniternas förteckning och gör Ashan till en levitisk stad för prästerna, där den parallella förteckningen i Josua har Ajin. Bor-Ashan (i King James-översättningen Chor-ashan), ”Ashans brunn”, dit David sände en del av amalekiternas byte från Siklag, bredvid Horma och Atak, är mycket sannolikt samma plats. Det är allt Bibeln säger, och ingen senare författare tillför något säkert."
    - "Förteckningarna drar åt två håll, låglandet nära Livna och Negev nära Beer Sheva, så platsen är omstridd och kartan behåller kandidaterna. Många föredrar Khirbet Asan, en liten ruin några kilometer nordväst om Beer Sheva, där namnet tycks leva kvar; Aharoni föreslog Tell Beit Mirsim, den stora kullen i södra Shefela som Albright grävde ut, och andra Tel Goded (Tell ej-Judeideh) längre norrut, eller Khirbet Muleh. Ingen av dessa har givit någon inskrift, och ingenting har grävts ut som Ashan."
    - "Khirbet Asan ligger i dag i norra utkanten av Beer Sheva, Negevs stad; de andra kandidaterna är kullar i jordbruksmarken i södra Shefela och norra Negev."
  nb:
    - "Asjan, «røyk», er en by i sørlige Juda som bare er kjent fra lister. Josva regner den blant Judas byer i Sjefela med «Libna og Eter og Asan», og igjen blant byene gitt til Simeon innenfor Juda, «A'in, Rimmon og Eter og Asan - fire byer med tilhørende landsbyer»; Krønikebøkene gjentar simeonittlisten og gjør Asjan til en levittby for prestene, der den parallelle listen i Josva har Ajin. Kor-Asjan (Bor-Asjan, «Asjans brønn»), dit David sendte en del av amalekittenes bytte fra Siklag, ved siden av Horma og Atak, er sannsynligvis det samme stedet. Det er alt Bibelen sier, og ingen senere forfatter tilføyer noe sikkert."
    - "Listene trekker i to retninger, lavlandet nær Libna og Negev nær Beer-Sjeba, så stedet er omstridt, og kartet beholder kandidatene. Mange foretrekker Khirbet Asan, en liten ruin noen få kilometer nordvest for Beer-Sjeba, der navnet synes å ha overlevd; Aharoni foreslo Tell Beit Mirsim, den store tellen i sørlige Sjefela gravd ut av Albright, og andre Tel Goded (Tell ej-Judeideh) lenger nord, eller Khirbet Muleh. Ingen av disse har gitt en innskrift, og ingenting er gravd ut som Asjan."
    - "Khirbet Asan ligger i dag i de nordlige utkantene av Beer-Sjeba, Negevs by; de andre kandidatene er teller i jordbrukslandet i sørlige Sjefela og nordlige Negev."
  tl:
    - "Ang Asan, “usok”, ay bayan sa timog ng Juda na kilala lamang mula sa mga talaan. Ibinibilang ito ni Josue sa mga bayan ng Juda sa Sephela kasama ng “Libna, at Ether, at Asan”, at muli sa mga bayang ibinigay kay Simeon sa loob ng Juda, “Ain, Rimmon, at Eter, at Asan, apat na bayan pati ng mga nayon niyaon”; inuulit ng Mga Cronica ang talaan ng Simeon at ginagawang bayan ng mga Levita ng mga saserdote ang Asan, kung saan Ain ang basa ng kahilerang talaan sa Josue. Ang Chorasan (Bor-ashan, “balon ng Asan”) na pinadalhan ni David ng bahagi ng samsam ng Amalecita mula sa Siclag, katabi ng Horma at Athach, ay malamang na iisang lugar. Iyon na ang sinasabi ng Biblia, at walang kalaunang manunulat na nagdagdag ng anumang tiyak."
    - "Dalawang direksiyon ang hinihila ng mga talaan, ang mababang lupain malapit sa Libna at ang Negeb malapit sa Beer-seba, kaya pinagtatalunan ang lugar at iniingatan ng mapa ang mga kandidato. Marami ang pumipili sa Khirbet Asan, isang maliit na guho ilang kilometro sa hilagang-kanluran ng Beer-seba, kung saan tila nananatili ang pangalan; iminungkahi ni Aharoni ang Tell Beit Mirsim, ang malaking burol sa timog na Sephela na hinukay ni Albright, at ng iba ang Tel Goded (Tell ej-Judeideh) na mas hilaga, o ang Khirbet Muleh. Walang nagbigay ng inskripsiyon sa mga ito, at walang nahukay bilang Asan."
    - "Ang Khirbet Asan ay nasa hilagang labas ng Beer-seba ngayon, ang lungsod ng Negeb; ang iba pang kandidato ay mga burol sa bukirin ng timog Sephela at hilagang Negeb."
  da:
    - "Asjan, »røg«, er en by i det sydlige Juda, kendt kun fra lister. Josva regner den blandt Judas byer i Sjefela med »Libna og Ether og Asan« og igen blandt de byer, der blev givet til Simeon inden for Juda, »Ajin, Rimmon og Ether og Asan; fire Stæder og deres Landsbyer«; Krønikebøgerne gentager simeonitternes liste og gør Asjan til en levitisk præsteby, hvor den parallelle liste i Josva læser Ajin. Kor-Asjan (Bor-Asjan, »Asjans brønd«), hvortil David sendte en del af amalekitternes bytte fra Siklag, ved siden af Horma og Atak, er meget sandsynligt det samme sted. Det er alt, hvad Bibelen siger, og ingen senere forfatter tilføjer noget sikkert."
    - "Listerne trækker i to retninger, lavlandet nær Libna og Negev nær Beersheba, så stedet er omstridt, og kortet beholder kandidaterne. Mange foretrækker Khirbet Asan, en lille ruin nogle få kilometer nordvest for Beersheba, hvor navnet synes at leve; Aharoni foreslog Tell Beit Mirsim, den store tell i det sydlige Sjefela udgravet af Albright, og andre Tel Goded (Tell ej-Judeideh) længere mod nord eller Khirbet Muleh. Ingen af dem har givet en indskrift, og intet er udgravet som Asjan."
    - "Khirbet Asan ligger i dag i den nordlige udkant af Beersheba, Negevs by; de øvrige kandidater er tells i agerlandet i det sydlige Sjefela og det nordlige Negev."
