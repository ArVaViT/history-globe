# Overview article (ADR 0007). Mainstream facts only; a minor place: the lists disagree about its district, the location is disputed and the map's candidates are given without choosing one.
id: ashan
place: ab5175f
title:
  en: "Ashan"
  ru: "Ашан"
  uk: "Ашан"
  es: "Asán"
  pt: "Asã"
  de: "Aschan"
  fr: "Aschan"
body:
  en:
    - "Ashan, “smoke”, is a town of the south of Judah known only from lists. Joshua counts it among the towns of Judah in the Shephelah with “Libnah, and Ether, and Ashan”, and again among the towns given to Simeon within Judah, “Ain, Remmon, and Ether, and Ashan; four cities and their villages”; Chronicles repeats the Simeonite list and makes Ashan a Levitical town of the priests, where the parallel list in Joshua reads Ain. The Chor-ashan (Bor-ashan, “the well of Ashan”) to which David sent a share of the Amalekite spoil from Ziklag, beside Hormah and Athach, is very probably the same place. That is all the Bible says, and no later writer adds anything certain."
    - "The lists pull in two directions, the lowland near Libnah and the Negeb near Beersheba, so the site is disputed and the map keeps the candidates. Most scholars prefer Khirbet Asan, a small ruin a few kilometres north-west of Beersheba, where the name seems to survive; others have proposed Tell Beit Mirsim, the large mound in the southern Shephelah dug by Albright, Tel Goded (Tell ej-Judeideh) further north, or Khirbet Muleh. None of these has yielded an inscription, and nothing has been excavated as Ashan."
    - "Khirbet Asan today lies on the northern outskirts of Beersheba, the city of the Negeb; the other candidates are tells in the farmland between Beersheba and the Hebron hills."
  ru:
    - "Ашан, «дым», — город юга Иудеи, известный только по спискам. Иисус Навин считает его среди городов Иуды на низменности: «Ливна, Ефер и Ашан», и снова среди городов, отданных Симеону внутри удела Иуды: «Аин, Риммон, Ефер и Ашан: четыре города с селами их»; Паралипоменон повторяет симеонитский список и делает Ашан левитским городом священников, где параллельный список у Иисуса Навина читает Аин. Хорашан («колодец Ашана»), куда Давид послал из Секелага долю амаликитской добычи, рядом с Хормой и Атахом, — очень вероятно, то же место. Это всё, что говорит Библия, и никто из позднейших писателей не прибавляет ничего верного."
    - "Списки тянут в две стороны — на низменность у Ливны и в Негев у Вирсавии, — поэтому место спорно, и карта хранит кандидатов. Большинство учёных предпочитают Хирбет-Асан, небольшие руины в нескольких километрах к северо-западу от Беэр-Шевы, где, по-видимому, уцелело имя; другие предлагали Телль-Бейт-Мирсим, большой холм в южной Шефеле, раскопанный Олбрайтом, Тель-Годед (Телль-эдж-Джудейде) севернее или Хирбет-Муле. Ни одно из этих мест не дало надписи, и ничто не раскопано как Ашан."
    - "Хирбет-Асан сегодня лежит на северной окраине Беэр-Шевы, главного города Негева; остальные кандидаты — холмы среди полей между Беэр-Шевой и Хевронскими горами."
  uk:
    - "Ашан, «дим», — місто півдня Юди, відоме лише з переліків. Ісус Навин зараховує його до міст Юди в Шефелі: «Либна, Етер і Ашан», і знову до міст, даних Симеонові в межах Юди: «Анн, Риммон, Етер та Ашан — чотири міста з їх селами»; Хроніки повторюють симеонівський перелік і роблять Ашан левітським містом священників, де паралельний перелік у книзі Ісуса Навина читає Аїн. Хор-Ашан (Бор-Ашан, «колодязь Ашану»), куди Давид послав частку амалекитської здобичі з Ціклагу, поруч із Хормою й Атахом («в Хормі й в Хорашанї, й в Атасї»), дуже ймовірно, те саме місце. Це все, що каже Біблія, і жоден пізніший автор не додає нічого певного."
    - "Переліки тягнуть у два боки — до низини біля Лівни та до Негеву біля Беер-Шеви, тож місце спірне, і мапа зберігає кандидатів. Більшість учених віддають перевагу Хірбет-Асану, невеликій руїні за кілька кілометрів на північний захід від Беер-Шеви, де назва, схоже, збереглася; інші пропонували Телль-Бейт-Мірсім, великий пагорб у південній Шефелі, який розкопував Олбрайт, Тель-Годед (Телль-ед-Джудейде) далі на північ або Хірбет-Муле. Жодне з них не дало напису, і ніщо не розкопано як Ашан."
    - "Хірбет-Асан нині лежить на північних околицях Беер-Шеви, міста Негеву; інші кандидати — телі в ріллі між Беер-Шевою та хевронськими пагорбами."
  es:
    - "Asán, «humo», es una ciudad del sur de Judá conocida solo por listas. Josué la cuenta entre las ciudades de Judá en la Sefelá con «Libna, y Ether, y Asán», y de nuevo entre las ciudades dadas a Simeón dentro de Judá, «Aín, Rimmón, Eter, y Asán; cuatro ciudades con sus aldeas»; las Crónicas repiten la lista de Simeón y hacen de Asán una ciudad levítica de los sacerdotes, allí donde la lista paralela de Josué lee Ain. El Chor-asán (Bor-asán, «el pozo de Asán») al que David envió una parte del botín amalecita de Siclag, junto a Horma y Atac, es muy probablemente el mismo lugar. Eso es todo lo que dice la Biblia, y ningún escritor posterior añade nada seguro."
    - "Las listas tiran en dos direcciones, la tierra baja cerca de Libna y el Néguev cerca de Beerseba, de modo que el sitio se discute y el mapa conserva los candidatos. La mayoría de los estudiosos prefieren Khirbet Asan, una pequeña ruina a pocos kilómetros al noroeste de Beerseba, donde el nombre parece sobrevivir; otros han propuesto Tell Beit Mirsim, el gran montículo del sur de la Sefelá excavado por Albright, Tel Goded (Tell ej-Judeideh), más al norte, o Khirbet Muleh. Ninguno de estos ha dado una inscripción, y nada ha sido excavado como Asán."
    - "Khirbet Asan se encuentra hoy en las afueras septentrionales de Beerseba, la ciudad del Néguev; los demás candidatos son tells en las tierras de labranza entre Beerseba y las colinas de Hebrón."
  pt:
    - "Asã, “fumaça”, é uma cidade do sul de Judá conhecida apenas por listas. Josué a conta entre as cidades de Judá na Sefelá com “Libna, Eter, Asã”, e de novo entre as cidades dadas a Simeão dentro de Judá, “Aim, Rimom, Eter e Asã; quatro cidades com as suas aldeias”; Crônicas repete a lista simeonita e faz de Asã uma cidade levítica dos sacerdotes, onde a lista paralela de Josué lê Aim. O Bor-Asã (“o poço de Asã”) a que Davi enviou parte do despojo dos amalequitas de Ziclague, ao lado de Hormá e Atace, é muito provavelmente o mesmo lugar. Isso é tudo o que a Bíblia diz, e nenhum escritor posterior acrescenta algo seguro."
    - "As listas puxam em duas direções, a baixada perto de Libna e o Neguebe perto de Berseba, de modo que o sítio é discutido e o mapa guarda os candidatos. A maioria dos estudiosos prefere Khirbet Asan, uma pequena ruína a poucos quilômetros a noroeste de Berseba, onde o nome parece sobreviver; outros propuseram Tell Beit Mirsim, o grande montículo da Sefelá meridional escavado por Albright, Tel Goded (Tell ej-Judeideh), mais ao norte, ou Khirbet Muleh. Nenhum rendeu uma inscrição, e nada foi escavado como Asã."
    - "Khirbet Asan fica hoje nos arredores setentrionais de Berseba, a cidade do Neguebe; os outros candidatos são tells nas terras agrícolas entre Berseba e as colinas de Hebrom."
  de:
    - "Aschan, „Rauch“, ist eine Stadt im Süden Judas, nur aus Listen bekannt. Josua zählt sie unter den Städten Judas in der Schefela auf mit „Libna, Ether, Asan“ und noch einmal unter den Simeon innerhalb Judas gegebenen Städten, „Ain, Rimmon, Ehter, Asan. Das sind vier Städte und ihre Dörfer“; die Chronik wiederholt die simeonitische Liste und macht Aschan zu einer levitischen Priesterstadt, wo die Parallelliste bei Josua Ajin liest. Das Chor-Aschan (Bor-Aschan, „Brunnen von Aschan“), dem David einen Teil der amalekitischen Beute aus Ziklag sandte, neben Horma und Atach, ist sehr wahrscheinlich derselbe Ort. Das ist alles, was die Bibel sagt, und kein späterer Autor fügt etwas Sicheres hinzu."
    - "Die Listen ziehen in zwei Richtungen, in die Niederung bei Libna und in den Negev bei Beerscheba, daher ist die Stätte umstritten, und die Karte hält die Kandidaten fest. Die meisten Gelehrten bevorzugen Chirbet Asan, eine kleine Ruine einige Kilometer nordwestlich von Beerscheba, wo der Name zu überleben scheint; andere schlugen Tell Beit Mirsim vor, den großen Hügel in der südlichen Schefela, den Albright ausgrub, Tel Goded (Tell ej-Judeide) weiter nördlich oder Chirbet Muleh. Keiner hat eine Inschrift ergeben, und nichts wurde als Aschan ausgegraben."
    - "Chirbet Asan liegt heute am nördlichen Stadtrand von Beerscheba, der Stadt des Negev; die anderen Kandidaten sind Tells im Ackerland zwischen Beerscheba und dem Bergland von Hebron."
  fr:
    - "Aschan, « fumée », est une ville du sud de Juda connue seulement par des listes. Josué la compte parmi les villes de Juda dans la Shéphéla, avec « Libna, Éther, Aschan », et de nouveau parmi les villes données à Siméon à l’intérieur de Juda, « Aïn, Rimmon, Éther, et Aschan, quatre villes, et leurs villages » ; les Chroniques reprennent la liste de Siméon et font d’Aschan une ville lévitique des prêtres, là où la liste parallèle de Josué porte Aïn. Le Cor-Aschan (Bor-Aschan, « le puits d’Aschan ») auquel David envoya une part du butin pris aux Amalécites à Tsiklag, à côté de Horma et d’Athac, est très probablement le même lieu. C’est tout ce que dit la Bible, et aucun écrivain ultérieur n’y ajoute rien de certain."
    - "Les listes tirent dans deux directions, la plaine près de Libna et le Négev près de Beer-Schéba ; le site est donc discuté et la carte garde les candidats. La plupart des savants préfèrent Khirbet Asan, petite ruine à quelques kilomètres au nord-ouest de Beer-Schéba, où le nom semble survivre ; d’autres ont proposé Tell Beit Mirsim, grand tertre du sud de la Shéphéla fouillé par Albright, Tel Goded (Tell ej-Judeideh) plus au nord, ou Khirbet Muleh. Aucun n’a livré d’inscription, et rien n’a été fouillé comme Aschan."
    - "Khirbet Asan se trouve aujourd’hui à la périphérie nord de Beer-Schéba, la ville du Négev ; les autres candidats sont des tells dans la campagne entre Beer-Schéba et les collines d’Hébron."
