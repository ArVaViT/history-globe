# Overview article (ADR 0007). Mainstream facts only; a minor place: the lists disagree about its district, the location is disputed and the map's candidates are given without choosing one.
id: ashan
place: ab5175f
title:
  en: "Ashan"
  ru: "Ашан"
body:
  en:
    - "Ashan, “smoke”, is a town of the south of Judah known only from lists. Joshua counts it among the towns of Judah in the Shephelah with “Libnah, and Ether, and Ashan”, and again among the towns given to Simeon within Judah, “Ain, Remmon, and Ether, and Ashan; four cities and their villages”; Chronicles repeats the Simeonite list and makes Ashan a Levitical town of the priests, where the parallel list in Joshua reads Ain. The Chor-ashan (Bor-ashan, “the well of Ashan”) to which David sent a share of the Amalekite spoil from Ziklag, beside Hormah and Athach, is very probably the same place. That is all the Bible says, and no later writer adds anything certain."
    - "The lists pull in two directions, the lowland near Libnah and the Negeb near Beersheba, so the site is disputed and the map keeps the candidates. Most scholars prefer Khirbet Asan, a small ruin a few kilometres north-west of Beersheba, where the name seems to survive; others have proposed Tell Beit Mirsim, the large mound in the southern Shephelah dug by Albright, Tel Goded (Tell ej-Judeideh) further north, or Khirbet Muleh. None of these has yielded an inscription, and nothing has been excavated as Ashan."
    - "Khirbet Asan today lies on the northern outskirts of Beersheba, the city of the Negeb; the other candidates are tells in the farmland between Beersheba and the Hebron hills."
  ru:
    - "Ашан, «дым», — город юга Иудеи, известный только по спискам. Иисус Навин считает его среди городов Иуды на низменности: «Ливна, Ефер и Ашан», и снова среди городов, отданных Симеону внутри удела Иуды: «Аин, Риммон, Ефер и Ашан: четыре города с селами их»; Паралипоменон повторяет симеонитский список и делает Ашан левитским городом священников, где параллельный список у Иисуса Навина читает Аин. Хорашан («колодец Ашана»), куда Давид послал из Секелага долю амаликитской добычи, рядом с Хормой и Атахом, — очень вероятно, то же место. Это всё, что говорит Библия, и никто из позднейших писателей не прибавляет ничего верного."
    - "Списки тянут в две стороны — на низменность у Ливны и в Негев у Вирсавии, — поэтому место спорно, и карта хранит кандидатов. Большинство учёных предпочитают Хирбет-Асан, небольшие руины в нескольких километрах к северо-западу от Беэр-Шевы, где, по-видимому, уцелело имя; другие предлагали Телль-Бейт-Мирсим, большой холм в южной Шефеле, раскопанный Олбрайтом, Тель-Годед (Телль-эдж-Джудейде) севернее или Хирбет-Муле. Ни одно из этих мест не дало надписи, и ничто не раскопано как Ашан."
    - "Хирбет-Асан сегодня лежит на северной окраине Беэр-Шевы, главного города Негева; остальные кандидаты — холмы среди полей между Беэр-Шевой и Хевронскими горами."
