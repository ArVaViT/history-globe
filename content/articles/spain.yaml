body:
  en:
    - "Spain, the Roman Hispania, was the Iberian peninsula at the western end of the Mediterranean, conquered by Rome over two centuries from the Second Punic War and organised under Augustus into three provinces: Tarraconensis, Baetica and Lusitania. By Paul's day its cities, Tarraco, Corduba, Gades and others, were thoroughly Roman, and Seneca and Lucan came from Corduba. In the New Testament Spain appears only in Paul's plan, written to the church at Rome: “Whensoever I take my journey into Spain, I will come to you”, and once the collection for Jerusalem was delivered, “I will come by you into Spain.”"
    - "Paul wanted Rome as a base for a new mission in the west, where, as far as is known, no one had yet preached; Jewish communities in Spain are not securely attested before the later Roman centuries. Whether he ever got there is not known. Acts ends with Paul a prisoner in Rome. About AD 96 the letter of Clement of Rome says that he reached “the limit of the west”, and the Muratorian fragment, probably of the late second century, speaks of his journey to Spain; many scholars take these as real memory, others as inference from Romans. Today Hispania is Spain and Portugal."
  ru:
    - "Испания, римская Хиспания, — Пиренейский полуостров на западном краю Средиземного моря, который Рим завоёвывал два столетия начиная со Второй Пунической войны и который при Августе был разделён на три провинции: Тарраконскую, Бетику и Лузитанию. Ко времени Павла её города — Тарракон, Кордуба, Гадес и другие — были вполне римскими, а Сенека и Лукан родились в Кордубе. В Новом Завете Испания появляется только в замысле Павла, о котором он пишет церкви в Риме: «как только предприму путь в Испанию, приду к вам», а доставив сбор в Иерусалим, «я отправлюсь через ваши места в Испанию»."
    - "Павел хотел сделать Рим опорой для новой миссии на западе, где, насколько известно, ещё никто не проповедовал; иудейские общины в Испании надёжно засвидетельствованы лишь в позднеримские века. Попал ли он туда, неизвестно. Книга Деяний заканчивается тем, что Павел в Риме под стражей. Около 96 года послание Климента Римского говорит, что он дошёл «до предела запада», а Мураториев фрагмент, вероятно конца II века, упоминает его путешествие в Испанию; многие учёные видят в этом подлинную память, другие — вывод из Послания к Римлянам. Сегодня Хиспания — это Испания и Португалия."
  uk:
    - "Іспанія, римська Гіспанія, — це Піренейський півострів на західному краю Середземномор’я, завойований Римом упродовж двох століть, починаючи з Другої Пунічної війни, і впорядкований за Августа в три провінції: Тарраконську, Бетіку й Лузітанію. За часів Павла її міста — Таррако, Кордуба, Гадес та інші — були цілком римськими, а Сенека й Лукан походили з Кордуби. У Новому Заповіті Іспанія з’являється лише в плані Павла, написаному церкві в Римі: «як пійду в Іспанию, прийду до вас», а коли збір для Єрусалима буде доставлено — «пійду через вас в Іспанию»."
    - "Павло хотів мати Рим базою для нової місії на заході, де, наскільки відомо, ще ніхто не проповідував; єврейські громади в Іспанії достовірно засвідчені лише в пізніші римські століття. Чи дістався він туди, невідомо. Книга Дій закінчується Павлом-в’язнем у Римі. Близько 96 року н. е. лист Климента Римського каже, що він дійшов до «межі заходу», а Мураторіїв фрагмент, імовірно кінця II століття, говорить про його подорож до Іспанії; багато вчених вважають це справжньою пам’яттю, інші — висновком з Послання до римлян. Нині Гіспанія — це Іспанія та Португалія."
  es:
    - "España, la Hispania romana, era la península ibérica, en el extremo occidental del Mediterráneo, conquistada por Roma a lo largo de dos siglos a partir de la segunda guerra púnica y organizada bajo Augusto en tres provincias: Tarraconense, Bética y Lusitania. En tiempos de Pablo sus ciudades, Tarraco, Corduba, Gades y otras, eran plenamente romanas, y Séneca y Lucano procedían de Corduba. En el Nuevo Testamento España aparece solo en el plan de Pablo, escrito a la iglesia de Roma: «Cuando partiere para España, iré á vosotros», y una vez entregada la colecta para Jerusalén, «pasaré por vosotros á España»."
    - "Pablo quería Roma como base para una nueva misión en el occidente, donde, hasta donde se sabe, nadie había predicado aún; las comunidades judías en España no están atestiguadas con seguridad antes de los siglos romanos posteriores. No se sabe si llegó a ir. Los Hechos terminan con Pablo prisionero en Roma. Hacia el 96 d. C. la carta de Clemente de Roma dice que llegó al «límite de occidente», y el fragmento muratoriano, probablemente de finales del siglo II, habla de su viaje a España; muchos estudiosos los toman por memoria real, otros por una deducción a partir de Romanos. Hoy Hispania corresponde a España y Portugal."
  pt:
    - "A Espanha, a Hispânia romana, era a península Ibérica, na extremidade ocidental do Mediterrâneo, conquistada por Roma ao longo de dois séculos a partir da Segunda Guerra Púnica e organizada sob Augusto em três províncias: Tarraconense, Bética e Lusitânia. Nos dias de Paulo, suas cidades, Tarraco, Córdoba, Gades e outras, eram plenamente romanas, e Sêneca e Lucano eram de Córdoba. No Novo Testamento, a Espanha aparece apenas no plano de Paulo, escrito à igreja de Roma: “quando eu viajar para a Espanha, irei até vocês”, e, uma vez entregue a coleta para Jerusalém, “seguirei viagem para a Espanha, passando por vocês”."
    - "Paulo queria Roma como base para uma nova missão no Ocidente, onde, até onde se sabe, ninguém ainda havia pregado; comunidades judaicas na Espanha não são atestadas com segurança antes dos séculos romanos posteriores. Não se sabe se ele chegou lá. Atos termina com Paulo preso em Roma. Por volta de 96 d.C., a carta de Clemente de Roma diz que ele chegou ao “limite do Ocidente”, e o fragmento muratoriano, provavelmente do fim do século II, fala de sua viagem à Espanha; muitos estudiosos tomam isso como memória real, outros como inferência de Romanos. Hoje a Hispânia é a Espanha e Portugal."
  de:
    - "Spanien, das römische Hispania, war die Iberische Halbinsel am Westende des Mittelmeers, von Rom im Laufe von zwei Jahrhunderten seit dem Zweiten Punischen Krieg erobert und unter Augustus in drei Provinzen gegliedert: Tarraconensis, Baetica und Lusitania. Zu Paulus' Zeit waren seine Städte, Tarraco, Corduba, Gades und andere, durch und durch römisch, und Seneca und Lukan stammten aus Corduba. Im Neuen Testament erscheint Spanien nur in Paulus' Plan, den er an die Gemeinde in Rom schrieb: „so will ich zu euch kommen, wenn ich reisen werde nach Spanien“, und nachdem die Kollekte für Jerusalem übergeben sei, „will ich durch euch nach Spanien ziehen“."
    - "Paulus wollte Rom als Basis für eine neue Mission im Westen, wo, soweit bekannt, noch niemand gepredigt hatte; jüdische Gemeinden in Spanien sind vor den späteren römischen Jahrhunderten nicht sicher belegt. Ob er je dorthin kam, ist nicht bekannt. Die Apostelgeschichte endet mit Paulus als Gefangenem in Rom. Um 96 n. Chr. sagt der Brief des Clemens von Rom, er sei bis „an die Grenze des Westens“ gelangt, und das Muratorische Fragment, wohl aus dem späten zweiten Jahrhundert, spricht von seiner Reise nach Spanien; viele Forscher halten dies für echte Erinnerung, andere für eine Folgerung aus dem Römerbrief. Das einstige Hispania besteht heute aus Spanien und Portugal."
  fr:
    - "L’Espagne, la Hispanie romaine, était la péninsule ibérique à l’extrémité occidentale de la Méditerranée, conquise par Rome en deux siècles à partir de la deuxième guerre punique et organisée sous Auguste en trois provinces : Tarraconaise, Bétique et Lusitanie. Du temps de Paul, ses villes, Tarraco, Corduba, Gadès et d’autres, étaient entièrement romaines, et Sénèque et Lucain venaient de Corduba. Dans le Nouveau Testament, l’Espagne n’apparaît que dans le projet de Paul, écrit à l’Église de Rome : « quand je me rendrai en Espagne, j’espère vous voir en passant », et, la collecte pour Jérusalem une fois remise, « je partirai pour l’Espagne et passerai chez vous »."
    - "Paul voulait faire de Rome une base pour une nouvelle mission à l’ouest, où, pour autant qu’on sache, personne n’avait encore prêché ; des communautés juives en Espagne ne sont pas attestées avec certitude avant les derniers siècles romains. On ignore s’il y parvint jamais. Les Actes s’achèvent sur Paul prisonnier à Rome. Vers 96 apr. J.-C., la lettre de Clément de Rome dit qu’il atteignit « la limite de l’Occident », et le fragment de Muratori, probablement de la fin du IIe siècle, parle de son voyage en Espagne ; beaucoup y voient un souvenir réel, d’autres une déduction tirée de l’épître aux Romains. Aujourd’hui, la Hispanie correspond à l’Espagne et au Portugal."
  pl:
    - "Hiszpania, rzymska Hispania, to Półwysep Iberyjski na zachodnim krańcu Morza Śródziemnego, podbijany przez Rzym przez dwa stulecia od drugiej wojny punickiej i zorganizowany za Augusta w trzy prowincje: Tarraconensis, Baetica i Lusitania. W czasach Pawła jej miasta, Tarraco, Corduba, Gades i inne, były całkowicie rzymskie, a Seneka i Lukan pochodzili z Kordoby. W Nowym Testamencie Hiszpania pojawia się tylko w planie Pawła, zapisanym w liście do kościoła w Rzymie: „Kiedykolwiek pójdę do Hiszpanii, przyjdę do was”, a po dostarczeniu zbiórki dla Jerozolimy: „pójdę przez was do Hiszpanii”."
    - "Paweł chciał mieć w Rzymie zaplecze dla nowej misji na zachodzie, gdzie, o ile wiadomo, nikt jeszcze nie głosił; nie ma pewnych świadectw o gminach żydowskich w Hiszpanii przed późniejszymi wiekami rzymskimi. Czy tam dotarł, nie wiadomo. Dzieje Apostolskie kończą się na Pawle więźniu w Rzymie. Około 96 roku n.e. list Klemensa Rzymskiego mówi, że dotarł on do „kresu zachodu”, a fragment muratoriański, prawdopodobnie z końca II wieku, wspomina o jego podróży do Hiszpanii; wielu badaczy uważa to za prawdziwą pamięć, inni za wniosek z Listu do Rzymian. Dziś Hispania to Hiszpania i Portugalia."
  it:
    - "La Spagna, la Hispania romana, era la penisola iberica all’estremità occidentale del Mediterraneo, conquistata da Roma nel corso di due secoli a partire dalla seconda guerra punica e organizzata sotto Augusto in tre province: Tarraconense, Betica e Lusitania. Ai tempi di Paolo le sue città, Tarraco, Corduba, Gades e altre, erano pienamente romane, e Seneca e Lucano venivano da Corduba. Nel Nuovo Testamento la Spagna compare solo nel progetto di Paolo, scritto alla chiesa di Roma: «quando andrò in Ispagna, spero, passando, di vedervi», e, una volta consegnata la colletta per Gerusalemme, «andrò in Ispagna passando da voi»."
    - "Paolo voleva fare di Roma una base per una nuova missione in Occidente, dove, per quanto si sa, nessuno aveva ancora predicato; comunità ebraiche in Spagna non sono attestate con sicurezza prima dei secoli tardo-romani. Se vi sia mai arrivato non si sa. Gli Atti terminano con Paolo prigioniero a Roma. Verso il 96 d.C. la lettera di Clemente Romano dice che egli giunse al «limite dell’occidente», e il frammento muratoriano, probabilmente della fine del II secolo, parla del suo viaggio in Spagna; molti studiosi vi vedono un ricordo reale, altri una deduzione dalla lettera ai Romani. Oggi la Hispania corrisponde a Spagna e Portogallo."
  nl:
    - "Spanje, het Romeinse Hispania, was het Iberisch Schiereiland aan het westelijke einde van de Middellandse Zee, in twee eeuwen vanaf de Tweede Punische Oorlog door Rome veroverd en onder Augustus ingedeeld in drie provincies: Tarraconensis, Baetica en Lusitania. In de tijd van Paulus waren de steden, Tarraco, Corduba, Gades en andere, door en door Romeins, en Seneca en Lucanus kwamen uit Corduba. In het Nieuwe Testament komt Spanje alleen voor in het plan van Paulus, geschreven aan de gemeente van Rome: “Zo zal ik, wanneer ik naar Spanje reis, tot u komen”, en zodra de collecte voor Jeruzalem was afgeleverd, “zo zal ik door ulieder stad naar Spanje afkomen.”"
    - "Paulus wilde Rome als uitvalsbasis voor een nieuwe zending in het westen, waar, voor zover bekend, nog niemand had gepredikt; Joodse gemeenschappen in Spanje zijn niet vóór de latere Romeinse eeuwen met zekerheid aangetoond. Of hij er ooit is gekomen, is niet bekend. Handelingen eindigt met Paulus als gevangene in Rome. Omstreeks 96 n.Chr. zegt de brief van Clemens van Rome dat hij “de uiterste grens van het westen” bereikte, en het Fragment van Muratori, waarschijnlijk uit de late tweede eeuw, spreekt van zijn reis naar Spanje; veel geleerden zien hierin echte herinnering, anderen een gevolgtrekking uit Romeinen. Het oude Hispania omvat nu Spanje en Portugal."
  cs:
    - "Španělsko, římská Hispánie, byl Pyrenejský poloostrov na západním konci Středomoří, dobytý Římem během dvou staletí od druhé punské války a za Augusta uspořádaný do tří provincií: Tarraconensis, Baetica a Lusitánie. V Pavlově době byla jeho města, Tarraco, Corduba, Gades a další, důkladně romanizovaná a Seneca a Lucanus pocházeli z Cordoby. V Novém zákoně se Španělsko objevuje jen v Pavlově plánu, napsaném církvi v Římě: „Kdyžkoli půjdu do Hišpanie, přijdu k vám“ a jakmile bude sbírka pro Jeruzalém doručena, „půjduť skrze vás do Hišpanie“."
    - "Pavel chtěl mít Řím za základnu nové misie na západě, kde podle všeho, co je známo, dosud nikdo nekázal; židovské obce ve Španělsku nejsou před pozdějšími římskými staletími spolehlivě doloženy. Zda se tam kdy dostal, není známo. Skutky končí Pavlem jako vězněm v Římě. Kolem roku 96 n. l. list Klementa Římského říká, že dospěl k „hranici západu“, a Muratoriho zlomek, snad z konce 2. století, mluví o jeho cestě do Španělska; mnozí učenci to pokládají za skutečnou paměť, jiní za závěr vyvozený z listu Římanům. Dnes je Hispánie Španělskem a Portugalskem."
  sv:
    - "Spanien, det romerska Hispania, var Iberiska halvön i Medelhavets västra ände, erövrad av Rom under två sekler från andra puniska kriget och under Augustus organiserad i tre provinser: Tarraconensis, Baetica och Lusitania. På Paulus' tid var dess städer, Tarraco, Corduba, Gades och andra, helt romaniserade, och Seneca och Lucanus kom från Corduba. I Nya testamentet förekommer Spanien bara i Paulus' plan, skriven till församlingen i Rom: ”vill jag besöka eder, när jag begiver mig till Spanien”, och när kollekten till Jerusalem var överlämnad, ”ämnar jag därifrån begiva mig till Spanien och taga vägen genom eder stad”."
    - "Paulus ville ha Rom som bas för en ny mission i väster, där såvitt man vet ingen ännu hade predikat; judiska församlingar i Spanien är inte säkert belagda före de senare romerska århundradena. Om han någonsin kom dit är inte känt. Apostlagärningarna slutar med att Paulus är fånge i Rom. Omkring 96 e.Kr. säger Clemens av Roms brev att han nådde ”västerns gräns”, och det muratoriska fragmentet, sannolikt från slutet av 100-talet e.Kr., talar om hans resa till Spanien; många forskare tar detta som verkligt minne, andra som en slutsats ur Romarbrevet. I dag är Hispania Spanien och Portugal."
