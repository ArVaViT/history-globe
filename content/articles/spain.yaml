  - "The Muratorian Fragment"
  - "J. A. Fitzmyer, Romans (Anchor Bible 33, 1993)"
  - "R. Jewett, Romans (Hermeneia, 2007)"
  - "S. J. Keay, Roman Spain (1988)"
