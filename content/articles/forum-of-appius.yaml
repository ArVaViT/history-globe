body:
  en:
    - "The Forum of Appius (Forum Appii) was a small market town and halt on the Via Appia, 43 Roman miles south-east of Rome, where the road entered the Pontine Marshes; it was presumably founded with the road itself, built by the censor Appius Claudius in 312 BC. From here a canal ran beside the road through the marshes towards Tarracina, and travellers often went on by boat, towed by a mule, through the night. Its scanty remains lie at Borgo Faiti, on the land of Latina and Sezze in the province of Latina, Italy."
    - "On the last stage of his journey to Rome, Paul landed at Puteoli and went up the Appian Way; “when the brethren heard of us, they came to meet us as far as Appii forum, and The three taverns: whom when Paul saw, he thanked God, and took courage.” It is the only mention of the place in the Bible."
    - "Ancient writers knew it as a busy and unlovely stop. Cicero dated a letter of 59 BC “from Appius' Forum, at the fourth hour”, adding that he had sent another a little earlier from the Three Taverns. Horace, on his journey to Brundisium, found it “crammed with boatmen and grasping innkeepers”, suffered from its foul water and spent a sleepless night on the canal among gnats and frogs."
  ru:
    - "Аппиева площадь (Forum Appii) — небольшой торговый городок и остановка на Аппиевой дороге, в 43 римских милях к юго-востоку от Рима, там, где дорога входила в Понтийские болота; вероятно, он возник вместе с самой дорогой, построенной цензором Аппием Клавдием в 312 г. до н. э. Отсюда вдоль дороги через болота к Таррацине шёл канал, и путники часто продолжали путь ночью на лодке, которую тянул мул. Скудные остатки городка лежат у Борго-Фаити, на землях Латины и Сецце в провинции Латина, Италия."
    - "На последнем отрезке пути в Рим Павел высадился в Путеолах и пошёл по Аппиевой дороге: «Тамошние братья, услышав о нас, вышли нам навстречу до Аппиевой площади и трех гостиниц. Увидев их, Павел возблагодарил Бога и ободрился». Это единственное упоминание места в Библии."
    - "Древние авторы знали его как людную и неприглядную остановку. Цицерон пометил письмо 59 г. до н. э. словами «с Аппиева форума, в четвёртом часу», добавив, что незадолго до того отправил другое от Трёх Таверн. Гораций по пути в Брундизий нашёл его «набитым лодочниками и прижимистыми трактирщиками», страдал от скверной воды и провёл бессонную ночь на канале среди комаров и лягушек."
  uk:
    - "Аппієва площа (Forum Appii) була невеликим торговим містечком і зупинкою на Аппієвій дорозі, за 43 римські милі на південний схід від Рима, де дорога входила в Понтійські болота; вона, імовірно, виникла разом із самою дорогою, прокладеною цензором Аппієм Клавдієм 312 р. до н. е. Звідси вздовж дороги крізь болота до Тарраціни йшов канал, і мандрівники часто їхали далі човном, який тягнув мул, протягом ночі. Її скупі рештки лежать у Борго-Файті, на землі Латини та Сецце в провінції Латина, Італія."
    - "На останньому етапі шляху до Рима Павло висадився в Путеолах і пішов Аппієвою дорогою; Лука пише: «Звідтіля, почувши брати про нас, повиходили назустріч нам аж до Апиєвого торгу та Трох Гостинниць. Побачивши їх Павел і подякувавши Богу, набрав ся сьмілости». Це єдина згадка про це місце в Біблії."
    - "Давні автори знали його як жваву й непривабливу зупинку. Цицерон датував лист 59 р. до н. е. словами «з Аппієвої площі, четверта година», додаючи, що трохи раніше послав інший із Трьох гостиниць. Горацій, їдучи до Брундізія, знайшов її «переповненою човнярами та загребущими шинкарями», страждав від її бридкої води й провів безсонну ніч на каналі серед комарів і жаб."
  es:
    - "El Foro de Apio (Forum Appii) era una pequeña población de mercado y parada en la Vía Apia, a 43 millas romanas al sureste de Roma, donde el camino entraba en las Marismas Pontinas; presumiblemente se fundó con el propio camino, construido por el censor Apio Claudio en 312 a. C. Desde allí un canal corría junto al camino a través de las marismas hacia Tarracina, y los viajeros solían seguir en barca, remolcada por una mula, durante la noche. Sus escasos restos se hallan en Borgo Faiti, en tierras de Latina y Sezze, en la provincia de Latina, Italia."
    - "En la última etapa de su viaje a Roma, Pablo desembarcó en Puteoli y subió por la Vía Apia; «oyendo de nosotros los hermanos, nos salieron á recibir hasta la plaza de Appio, y Las Tres Tabernas: á los cuales como Pablo vió, dió gracias á Dios, y tomó aliento». Es la única mención del lugar en la Biblia."
    - "Los autores antiguos lo conocían como una parada concurrida y poco amable. Cicerón fechó una carta del año 59 a. C. «desde el Foro de Apio, a la hora cuarta», y añadió que poco antes había enviado otra desde las Tres Tabernas. Horacio, en su viaje a Brindisi, lo halló «lleno de barqueros y de posaderos codiciosos», sufrió por su agua infecta y pasó una noche en vela en el canal entre mosquitos y ranas."
  de:
    - "Das Forum Appii war ein kleiner Marktflecken und Rastplatz an der Via Appia, 43 römische Meilen südöstlich von Rom, wo die Straße in die Pontinischen Sümpfe eintrat; vermutlich wurde es zusammen mit der Straße gegründet, die der Zensor Appius Claudius 312 v. Chr. baute. Von hier lief neben der Straße ein Kanal durch die Sümpfe auf Tarracina zu, und Reisende fuhren oft, von einem Maultier gezogen, nachts mit dem Boot weiter. Seine spärlichen Überreste liegen bei Borgo Faiti, auf dem Gebiet von Latina und Sezze in der Provinz Latina in Italien."
    - "Auf der letzten Etappe seiner Reise nach Rom landete Paulus in Puteoli und zog die Via Appia hinauf: „Und von dort, da die Brüder von uns hörten, gingen sie aus, uns entgegen, bis gen Appifor und Tretabern. Da die Paulus sah, dankte er Gott und gewann eine Zuversicht.“ Es ist die einzige Erwähnung des Ortes in der Bibel."
    - "Antike Schriftsteller kannten es als lebhaften und unerfreulichen Halt. Cicero datierte einen Brief des Jahres 59 v. Chr. „aus dem Forum Appii, zur vierten Stunde“ und fügte hinzu, er habe kurz zuvor einen anderen aus den Drei Tavernen abgesandt. Horaz fand es auf seiner Reise nach Brundisium „vollgestopft mit Schiffern und geldgierigen Wirten“, litt unter dem schlechten Wasser und verbrachte eine schlaflose Nacht am Kanal zwischen Mücken und Fröschen."
  fr:
    - "Le Forum d’Appius (Forum Appii) était un petit bourg de marché et une halte de la via Appia, à 43 milles romains au sud-est de Rome, là où la route entrait dans les marais Pontins ; il fut sans doute fondé avec la route elle-même, construite par le censeur Appius Claudius en 312 av. J.-C. De là, un canal longeait la route à travers les marais en direction de Terracine, et les voyageurs poursuivaient souvent en bateau, tiré par une mule, pendant la nuit. Ses maigres vestiges se trouvent à Borgo Faiti, sur le territoire de Latina et de Sezze, dans la province de Latina, en Italie."
    - "Sur la dernière étape de son voyage vers Rome, Paul débarqua à Pouzzoles et monta par la voie Appienne : « De Rome vinrent à notre rencontre, jusqu’au Forum d’Appius et aux Trois Tavernes, les frères qui avaient entendu parler de nous. Paul, en les voyant, rendit grâces à Dieu, et prit courage. » C’est la seule mention du lieu dans la Bible."
    - "Les auteurs anciens le connaissaient comme une étape animée et peu plaisante. Cicéron data une lettre de 59 av. J.-C. « du Forum d’Appius, à la quatrième heure », ajoutant qu’il en avait envoyé une autre un peu plus tôt des Trois Tavernes. Horace, lors de son voyage à Brindes, le trouva « bourré de bateliers et d’aubergistes rapaces », souffrit de son eau infecte et passa sur le canal une nuit blanche parmi les moustiques et les grenouilles."
  pt:
    - "O Foro de Ápio (Forum Appii) era uma pequena cidade de mercado e parada na Via Ápia, a 43 milhas romanas a sudeste de Roma, onde a estrada entrava nos Pântanos Pontinos; presumivelmente foi fundado com a própria estrada, construída pelo censor Ápio Cláudio em 312 a.C. Dali um canal corria ao lado da estrada pelos pântanos em direção a Tarracina, e os viajantes muitas vezes prosseguiam de barco, puxado por uma mula, durante a noite. Seus escassos restos ficam em Borgo Faiti, em terras de Latina e Sezze, na província de Latina, Itália."
    - "No último trecho de sua viagem a Roma, Paulo desembarcou em Putéoli e subiu pela Via Ápia: “os irmãos, quando ouviram falar de nós, vieram ao nosso encontro até a Praça de Ápio e as Três Vendas. Quando Paulo os viu, deu graças a Deus e sentiu-se encorajado.” É a única menção do lugar na Bíblia."
    - "Os escritores antigos o conheciam como uma parada movimentada e pouco agradável. Cícero datou uma carta de 59 a.C. “do Foro de Ápio, à quarta hora”, acrescentando que havia enviado outra pouco antes das Três Vendas. Horácio, em sua viagem a Brundísio, achou-o “apinhado de barqueiros e estalajadeiros avarentos”, sofreu com sua água estragada e passou uma noite insone no canal, entre mosquitos e rãs."
  it:
    - "Il Foro di Appio (Forum Appii) era una piccola cittadina di mercato e luogo di sosta sulla via Appia, a 43 miglia romane a sud-est di Roma, dove la strada entrava nelle Paludi Pontine; fu presumibilmente fondato con la strada stessa, costruita dal censore Appio Claudio nel 312 a.C. Di qui un canale correva accanto alla strada attraverso le paludi verso Terracina, e i viaggiatori proseguivano spesso in barca, trainata da un mulo, durante la notte. I suoi scarsi resti si trovano a Borgo Faiti, nel territorio di Latina e di Sezze, in provincia di Latina, in Italia."
    - "Nell’ultima tappa del viaggio verso Roma, Paolo sbarcò a Pozzuoli e risalì la via Appia; «i fratelli, avute nostre notizie, di là ci vennero incontro sino al Foro Appio e alle Tre Taverne; e Paolo, quando li ebbe veduti, rese grazie a Dio e prese animo». È l’unica menzione del luogo nella Bibbia."
    - "Gli scrittori antichi lo conoscevano come una sosta affollata e poco gradevole. Cicerone datò una lettera del 59 a.C. «dal Foro di Appio, alla quarta ora», aggiungendo di averne inviata un’altra poco prima dalle Tre Taverne. Orazio, nel suo viaggio a Brindisi, lo trovò «pieno zeppo di barcaioli e di locandieri avidi», soffrì per la sua acqua malsana e trascorse una notte insonne sul canale tra zanzare e rane."
  nl:
    - "Het Appiusforum (Forum Appii) was een klein marktstadje en rustplaats aan de Via Appia, 43 Romeinse mijlen ten zuidoosten van Rome, waar de weg de Pontijnse Moerassen binnenging; het werd vermoedelijk gesticht met de weg zelf, die in 312 v.Chr. door de censor Appius Claudius werd aangelegd. Vanaf hier liep een kanaal naast de weg door de moerassen richting Tarracina, en reizigers gingen vaak 's nachts per boot verder, getrokken door een muildier. De schaarse resten liggen bij Borgo Faiti, op het grondgebied van Latina en Sezze in de provincie Latina in Italië."
    - "Op de laatste etappe van zijn reis naar Rome ging Paulus bij Puteoli aan land en trok de Via Appia op; “de broeders, van onze zaken gehoord hebbende, ons tegemoet tot Appiusmarkt, en de drie tabernen; welke Paulus ziende, dankte hij God en greep moed.” Het is de enige vermelding van de plaats in de Bijbel."
    - "Antieke schrijvers kenden het als een drukke en onaantrekkelijke halte. Cicero dateerde een brief van 59 v.Chr. “van het Appiusforum, om het vierde uur” en voegde eraan toe dat hij kort tevoren een andere vanuit de Drie Tavernen had verzonden. Horatius, op zijn reis naar Brundisium, vond het “vol schippers en hebzuchtige herbergiers”, leed onder het vieze water en bracht een slapeloze nacht door op het kanaal tussen muggen en kikkers."
  pl:
    - "Forum Appiusza (Forum Appii) było małym miasteczkiem targowym i przystankiem na Via Appia, 43 mile rzymskie na południowy wschód od Rzymu, gdzie droga wchodziła na Błota Pontyńskie; założono je prawdopodobnie razem z samą drogą, zbudowaną przez cenzora Appiusza Klaudiusza w 312 p.n.e. Stąd obok drogi biegł przez bagna kanał ku Tarracinie, a podróżni często płynęli dalej łodzią, ciągnioną przez muła, przez całą noc. Jego skromne pozostałości leżą w Borgo Faiti, na ziemi gmin Latina i Sezze w prowincji Latina we Włoszech."
    - "W ostatnim etapie podróży do Rzymu Paweł wylądował w Puteoli i poszedł Via Appia; „gdy usłyszeli bracia o nas, wyszli przeciwko nam aż do rynku Appijuszowego i do Trzech Karczem; których gdy Paweł ujrzał, podziękowawszy Bogu, wziął śmiałość”. Jest to jedyna wzmianka o tym miejscu w Biblii."
    - "Pisarze starożytni znali je jako ruchliwy i nieładny przystanek. Cyceron datował list z 59 p.n.e. „z Forum Appiusza, o czwartej godzinie”, dodając, że nieco wcześniej wysłał inny z Trzech Gospód. Horacy, w podróży do Brundyzjum, znalazł je „zatłoczone przewoźnikami i chciwymi karczmarzami”, cierpiał z powodu cuchnącej wody i spędził bezsenną noc nad kanałem wśród komarów i żab."
  cs:
    - "Appiovo tržiště (Forum Appii) bylo malé tržní městečko a zastávka na Via Appia, 43 římských mil jihovýchodně od Říma, kde silnice vstupovala do Pontinských bažin; vzniklo patrně spolu se silnicí, kterou roku 312 př. n. l. vybudoval cenzor Appius Claudius. Odtud vedl podél silnice bažinami kanál směrem k Tarracině a cestující často pokračovali lodí, tažení mulou, přes noc. Jeho skrovné zbytky leží v Borgo Faiti, na pozemcích Latiny a Sezze v provincii Latina v Itálii."
    - "Na poslední etapě cesty do Říma se Pavel vylodil v Puteolech a šel po Appiově cestě: „Odkudž, když o nás uslyšeli bratří, vyšli proti nám až na rynk Appiův a ke Třem krčmám. Kteréžto uzřev Pavel, poděkoval Bohu a počal býti dobré mysli.“ Je to jediná zmínka o tomto místě v Bibli."
    - "Antičtí spisovatelé je znali jako rušnou a nevábnou zastávku. Cicero datoval dopis z roku 59 př. n. l. „z Appiova tržiště, ve čtvrté hodině“ a dodal, že jiný poslal o něco dříve od Tří hostinců. Horatius na cestě do Brundisia je shledal „přeplněné lodníky a hrabivými hostinskými“, trpěl jeho zkaženou vodou a strávil bezesnou noc na kanále mezi komáry a žábami."
  sv:
    - "Forum Appii var en liten marknadsstad och rastplats vid Via Appia, 43 romerska mil sydost om Rom, där vägen gick in i Pontinska träsken; den grundades förmodligen tillsammans med själva vägen, byggd av censorn Appius Claudius år 312 f.Kr. Härifrån löpte en kanal bredvid vägen genom träsken mot Tarracina, och resenärer fortsatte ofta med båt, dragen av en mula, under natten. Dess fåtaliga lämningar ligger vid Borgo Faiti, på Latinas och Sezzes mark i provinsen Latina i Italien."
    - "På sista etappen av sin resa till Rom landsteg Paulus i Puteoli och gick upp längs Via Appia; ”Så snart bröderna där fingo höra om oss, gingo de oss till mötes ända till Forum Appii och Tres Taberne. När Paulus fick se dem, tackade han Gud och fick nytt mod.” Det är den enda gång platsen nämns i Bibeln."
    - "Antika författare kände den som en livlig och föga tilltalande rastplats. Cicero daterade ett brev från år 59 f.Kr. ”från Appii forum, fjärde timmen” och tillade att han strax före sänt ett annat från Tres Tabernae. Horatius fann den på sin resa till Brundisium ”fullproppad av båtfolk och snåla värdshusvärdar”, led av det dåliga vattnet och tillbringade en sömnlös natt på kanalen bland myggor och grodor."
  nb:
    - "Forum Appii (Appius' torg) var en liten markedsby og rasteplass ved Via Appia, 43 romerske mil sørøst for Roma, der veien gikk inn i de Pontinske sumper; den ble trolig grunnlagt sammen med selve veien, som sensor Appius Claudius bygde i 312 f.Kr. Herfra gikk en kanal langs veien gjennom sumpene mot Tarracina, og reisende fortsatte ofte med båt, trukket av et muldyr, gjennom natten. De sparsomme restene ligger ved Borgo Faiti, på området til Latina og Sezze i provinsen Latina i Italia."
    - "På den siste etappen av reisen til Roma gikk Paulus i land i Puteoli og dro opp langs Via Appia; «da brødrene der fikk høre om oss, gikk de oss i møte derfra til Forum Appii og Tres Tabernæ; da Paulus så dem, takket han Gud og fattet mot.» Det er den eneste omtalen av stedet i Bibelen."
    - "Antikke forfattere kjente det som et travelt og lite tiltalende stoppested. Cicero daterte et brev fra 59 f.Kr. «fra Appii Forum, i fjerde time», og la til at han hadde sendt et annet litt tidligere fra Tres Tabernae. Horats, på reisen til Brundisium, fant det «stappfullt av båtfolk og griske vertshusholdere», led under det motbydelige vannet og tilbrakte en søvnløs natt på kanalen blant mygg og frosker."
  tl:
    - "Ang Pamilihan ng Appio (Forum Appii) ay isang maliit na bayang pamilihan at hintuan sa Daang Appia, 43 milyang Romano sa timog-silangan ng Roma, kung saan pumapasok ang daan sa Mga Latian ng Pontino; marahil ay itinatag ito kasabay ng mismong daan, na ipinatayo ng sensor na si Appio Claudio noong 312 BK. Mula rito ay dumaloy ang isang kanal sa tabi ng daan sa mga latian patungong Tarracina, at madalas na nagpapatuloy ang mga manlalakbay sa bangka, hinihila ng isang mula, buong gabi. Ang kakaunting labi nito ay nasa Borgo Faiti, sa lupain ng Latina at Sezze sa lalawigan ng Latina, Italia."
    - "Sa huling yugto ng kaniyang paglalakbay patungong Roma, dumaong si Pablo sa Puteoli at umakyat sa Daang Appia; “pagkabalita ng mga kapatid, ay sinalubong kami sa Pamilihan ng Appio at sa Tatlong Bahay-Tuluyan; na nang sila'y makita ni Pablo, ay nagpasalamat sa Dios, at lumakas ang loob.” Ito lamang ang pagbanggit sa lugar sa Biblia."
    - "Kilala ito ng mga sinaunang manunulat bilang isang abalang hintuan na hindi kaaya-aya. Binigyang-petsa ni Cicero ang isang liham noong 59 BK “mula sa Pamilihan ni Appio, sa ikaapat na oras”, na idinagdag na nagpadala siya ng isa pa nang bahagya nang mas maaga mula sa Tatlong Bahay-Tuluyan. Natagpuan ito ni Horacio, sa kaniyang paglalakbay sa Brundisium, na “siksik sa mga bangkero at sakim na mga may-ari ng tuluyan”, nagdusa sa maruming tubig nito at nagpalipas ng isang gabing walang tulog sa kanal sa gitna ng mga lamok at mga palaka."
  da:
    - "Forum Appii (Appii Forum) var en lille markedsby og rasteplads på Via Appia, 43 romerske mil sydøst for Rom, hvor vejen kom ind i De Pontinske Sumpe; den blev formodentlig grundlagt sammen med selve vejen, som censoren Appius Claudius anlagde i 312 f.Kr. Herfra løb en kanal ved siden af vejen gennem sumpene mod Terracina, og rejsende fortsatte ofte med båd, trukket af et muldyr, gennem natten. Dens sparsomme rester ligger ved Borgo Faiti på Latinas og Sezzes område i provinsen Latina i Italien."
    - "På sidste etape af rejsen til Rom landede Paulus i Puteoli og drog op ad Via Appia; »Og Brødrene derfra, som havde hørt om os, kom os i Møde til Appius's Forum og Tres-Tabernæ. Og da Paulus saa dem, takkede han Gud og fattede Mod.« Det er det eneste sted i Bibelen, hvor stedet nævnes."
    - "Antikke forfattere kendte det som et travlt og uskønt standsningssted. Cicero dagterede et brev fra 59 f.Kr. »fra Appius' Forum, i den fjerde time« og tilføjede, at han lidt tidligere havde sendt et andet fra Tres Tabernæ. Horats fandt det på sin rejse til Brundisium »propfuldt af bådfolk og grådige værtshusholdere«, led under dets modbydelige vand og tilbragte en søvnløs nat på kanalen blandt myg og frøer."
  sr:
    - "Апијев трг (Форум Апии) био је мало трговиште и одморишни стан на Апијевом путу, 43 римске миље југоисточно од Рима, где је пут улазио у Понтинске мочваре; вероватно је основан са самим путем, који је подигао цензор Апије Клаудије 312. п. н. е. Одавде је поред пута кроз мочваре ишао канал према Таракини, а путници су често настављали бродом, ноћу, вучени мазгом. Његови оскудни остаци леже у Борго Фаитију, на земљишту Латине и Сезе у покрајини Латина, у Италији."
    - "На последњој етапи пута у Рим Павле је сишао у Поцуоли и кренуо Апијевим путем; „чувши браћа за нас изиђоше нам на сусрет све до Апијева пазара и три крчме. И кад их виде Павле, даде хвалу Богу, и ослободи се.“ То је једино помињање места у Библији."
    - "Писци старине знали су га као прометну и непривлачну станицу. Цицерон је једно писмо из 59. п. н. е. датирао „из Апијевог трга, у четврти час“, додајући да је нешто раније послао друго из Три гостионице. Хорације је на путу за Брундизијум нашао да је „крцат лађарима и лакомим крчмарима“, патио од његове покварене воде и провео бесану ноћ на каналу међу комарцима и жабама."
  hu:
    - "Appius Fóruma (Forum Appii) kis piacváros és pihenőhely volt a Via Appia mentén, Rómától 43 római mérföldre délkeletre, ahol az út a Pontini-mocsarakba lépett; feltehetően magával az úttal együtt alapították, amelyet Appius Claudius cenzor építtetett Kr. e. 312-ben. Innen csatorna futott az út mellett a mocsarakon át Tarracina felé, és az utazók gyakran hajón folytatták útjukat, éjszaka, öszvér vontatta. Szegényes maradványai Borgo Faitiben találhatók, Latina és Sezze területén, Latina tartományban, Itáliában."
    - "Pál Rómába vezető útjának utolsó szakaszán Puteoliban szállt partra, és az Appius-úton haladt tovább; „az atyafiak, mikor a mi dolgainkat meghallották, nékünk előnkbe jövének Appii Forumig és Tres Tabernaeig. És mikor Pál meglátta őket, hálákat adván az Istennek, bátorságot vőn.” A Biblia csak itt említi a helyet."
    - "Az ókori írók forgalmas és kevéssé vonzó állomásként ismerték. Cicero egy Kr. e. 59-es levelét „Appius Fórumából, a negyedik órában” keltezte, hozzátéve, hogy kevéssel korábban egy másikat küldött a Három Fogadóból. Horatius a Brundisiumba vezető útján „hajósokkal és kapzsi fogadósokkal zsúfoltnak” találta, szenvedett a posvány vizétől, és álmatlan éjszakát töltött a csatornán szúnyogok és békák között."
  fi:
    - "Appiuksen tori (Forum Appii) oli pieni kauppala ja lepopaikka Via Appialla, 43 roomalaista mailia Roomasta kaakkoon, missä tie saapui Pontiinin soille; se perustettiin oletettavasti itse tien mukana, jonka sensori Appius Claudius rakennutti vuonna 312 eaa. Täältä kanava kulki tien vieressä soiden halki kohti Terracinaa, ja matkamiehet jatkoivat usein veneellä, muulin vetämänä, yön yli. Sen niukat jäänteet sijaitsevat Borgo Faitissa, Latinan ja Sezzen maalla Latinan maakunnassa Italiassa."
    - "Matkansa viimeisellä taipaleella Roomaan Paavali nousi maihin Puteolissa ja nousi Appian tietä; ”kun veljet siellä saivat kuulla meistä, tulivat he meitä vastaan Appii Forumiin ja Tres Tabernaen kohdalle saakka; ja heidät nähdessään Paavali kiitti Jumalaa ja sai rohkeutta”. Se on ainoa paikan maininta Raamatussa."
    - "Antiikin kirjoittajat tunsivat sen vilkkaana ja viehtymättömänä pysähdyspaikkana. Cicero päiväsi vuoden 59 eaa. kirjeen ”Appiuksen torilta, neljäntenä tuntina” ja lisäsi lähettäneensä hieman aiemmin toisen Kolmesta majatalosta. Horatius, matkallaan Brundisiumiin, piti sitä ”täynnä venemiehiä ja ahneita majatalonpitäjiä”, kärsi sen pilaantuneesta vedestä ja vietti unettoman yön kanavalla sääskien ja sammakoiden keskellä."
  vi:
    - "Chợ Áp-bi-út (Forum Appii) là một thị trấn chợ nhỏ và trạm dừng trên đường Via Appia, cách Rô-ma 43 dặm La Mã về phía đông nam, nơi con đường đi vào Đầm lầy Pontine; có lẽ thị trấn được lập cùng với con đường, do viên giám sát Appius Claudius xây năm 312 TCN. Từ đây một con kênh chạy bên đường xuyên qua đầm lầy về phía Tarracina, và du khách thường đi tiếp bằng thuyền, do một con la kéo, suốt đêm. Tàn tích ít ỏi của nơi này nằm ở Borgo Faiti, trên đất của Latina và Sezze thuộc tỉnh Latina, Y-ta-li."
    - "Ở chặng cuối cuộc hành trình đến Rô-ma, Phao-lô lên bờ tại Bu-xô-lơ và đi lên theo đường Appia; “Anh em trong thành nầy nghe nói về chúng ta, bèn ra đến Phô-rum Áp-bi-u và chỗ Ba Quán mà đón rước chúng ta. Phao-lô thấy anh em, thì cảm tạ Đức Chúa Trời và vững chí”. Đây là lần duy nhất nơi này được nhắc đến trong Kinh Thánh."
    - "Các tác giả cổ đại biết đây là một trạm dừng nhộn nhịp và khó ưa. Cicero ghi ngày một bức thư năm 59 TCN “từ Chợ Appius, vào giờ thứ tư”, và thêm rằng ông đã gửi một bức khác ít lâu trước đó từ Ba Quán. Horace, trong chuyến đi đến Brundisium, thấy nơi đây “chật ních những người chèo thuyền và chủ quán trọ tham lam”, khổ sở vì nước hôi, và trải qua một đêm không ngủ trên con kênh giữa muỗi và ếch nhái."
  ro:
    - "Târgul lui Apiu (Forum Appii) era un orășel-piață și un loc de oprire pe Via Appia, la 43 de mile romane spre sud-est de Roma, unde drumul intra în Mlaștinile Pontine; se presupune că a fost întemeiat odată cu drumul, construit de cenzorul Appius Claudius în 312 î.Hr. De aici un canal mergea paralel cu drumul prin mlaștini spre Tarracina, iar călătorii continuau adesea cu barca, trasă de un catâr, peste noapte. Resturile lui sărace se află la Borgo Faiti, pe teritoriul comunelor Latina și Sezze, în provincia Latina, Italia."
    - "Pe ultima etapă a călătoriei sale spre Roma, Pavel a debarcat la Puteoli și a urcat pe Via Appia; „frații auzind cele pentru noi, au ieșit întru întâmpinarea noastră până la forul lui Apie și la Tritaverne; pre cari văzându’i Pavel, și mulțumind lui Dumnezeu, a luat îndrăsneală”. Este singura pomenire a locului în Biblie."
    - "Scriitorii antici îl cunoșteau ca pe o oprire aglomerată și neplăcută. Cicero a datat o scrisoare din 59 î.Hr. „din Forul lui Apiu, în ora a patra”, adăugând că trimisese o alta, puțin mai devreme, de la Trei Taverne. Horațiu, în călătoria sa spre Brundisium, l-a găsit „burduf de luntrași și de hangii lacomi”, a suferit din pricina apei lui stricate și a petrecut o noapte nedormită pe canal, printre țânțari și broaște."
  bg:
    - "Апиев пазар (Forum Appii) беше малко пазарно градче и спирка на Via Appia, на 43 римски мили югоизточно от Рим, където пътят навлизаше в Понтийските блата; вероятно е основано заедно със самия път, построен от цензора Апий Клавдий през 312 г. пр.н.е. Оттук покрай пътя през блатата към Тарацина вървеше канал и пътниците често продължаваха през нощта с лодка, теглена от муле. Оскъдните му останки лежат в Борго Фаити, в землищата на Латина и Седзе, в провинция Латина, Италия."
    - "На последния етап от пътуването си към Рим Павел слезе на брега в Потиоли и тръгна нагоре по Апиевия път: „И от там братята като чуха за нас излезоха до Апиевото Тържище и до Трите Кръчми да ни посрещнат; и Павел като виде тия братя благодари Богу и ободри се.“ Това е единственото споменаване на мястото в Библията."
    - "Древните автори го познаваха като оживена и неприветлива спирка. Цицерон датира едно писмо от 59 г. пр.н.е. „от Апиевия форум, в четвъртия час“, като добавя, че малко по-рано е изпратил друго от Трите гостилници. Хораций, на път за Брундизий, го намери „натъпкан с лодкари и алчни кръчмари“, страдаше от лошата му вода и прекара безсънна нощ на канала сред комари и жаби."
