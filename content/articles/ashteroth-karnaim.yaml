# Overview article (ADR 0007). Mainstream facts only; written about the double name of Genesis 14:5 and about Karnaim, without restating the Ashtaroth article; whether the name means Ashtaroth itself or Karnaim beside it is left open.
id: ashteroth-karnaim
place: afe4be0
title:
  en: "Ashteroth-karnaim"
  ru: "Аштероф-Карнаим"
  uk: "Аштерот-Карнаїм"
  es: "Astarot-carnaim"
  pt: "Astarote-Carnaim"
  de: "Aschtarot-Karnajim"
  fr: "Aschteroth-Karnaïm"
  it: "Astarot-Karnaim"
  nl: "Astarot-Karnaïm"
  pl: "Asztarot-Karnaim"
  cs: "Aštarót-karnajim"
body:
  en:
    - "Ashteroth-karnaim, “Ashtaroth of the two horns”, is the name Genesis gives to a town of Bashan in the basalt plain of the Hauran east of the Sea of Galilee, in today's Daraa governorate of Syria. It is taken either as Ashtaroth itself, the city of Og at Tell Ashtara, or as Karnaim, its neighbour a few kilometres to the north at al-Sheikh Saad, which later took over the role of district capital and inherited the double name. Eusebius knew two villages called Astaroth Karnaim nine miles apart, between Adraa and Abila."
    - "The name occurs once, at the opening of the war of the four kings: “in the fourteenth year came Chedorlaomer, and the kings that were with him, and smote the Rephaims in Ashteroth Karnaim, and the Zuzims in Ham, and the Emims in Shaveh Kiriathaim”. Bashan remained the land of the Rephaim in Israel's memory: “only Og king of Bashan remained of the remnant of giants”. Amos later mocks Israel for boasting of Karnaim, a name the King James Version translates: “Have we not taken to us horns by our own strength?”"
    - "Assyrian texts call the town Qarnini, the seat of a province after the conquests of Tiglath-pileser III. In the Maccabean wars Carnaim was one of the strong cities of Gilead: Judas Maccabeus took it and burned its temple with the enemies who had fled into it, and 2 Maccabees, telling of the same campaign, names a Carnion with a temple of Atargatis, which may be the same place. In Byzantine times Karnea was shown as the town of Job: Eusebius places the house of Job there and the pilgrim Egeria travelled to it, and at Sheikh Saad a stela of Ramesses II has long been shown as the Stone of Job."
  ru:
    - "Аштероф-Карнаим, «Аштероф двурогий», — имя, которое Книга Бытия даёт городу Васана на базальтовой равнине Хаурана к востоку от Галилейского моря, в нынешней провинции Дараа в Сирии. В нём видят либо сам Астароф, город Ога на Телль-Аштаре, либо Карнаим, его соседа в нескольких километрах к северу, у аш-Шейх-Саада, который позже стал главным городом округа и унаследовал двойное имя. Евсевий знал два селения под именем Астароф-Карнаим в девяти милях друг от друга, между Адраей и Абилой."
    - "Имя встречается один раз, в начале войны четырёх царей: «В четырнадцатом году пришел Кедорлаомер и цари, которые с ним, и поразили Рефаимов в Аштероф-Карнаиме, Зузимов в Гаме, Эмимов в Шаве-Кириафаиме». Васан и позже оставался в памяти Израиля землёй Рефаимов: «только Ог, царь Васанский, оставался из Рефаимов». Амос впоследствии высмеивает Израиль, хвалящийся Карнаимом, — именем, которое Синодальный перевод передаёт по смыслу: «не своею ли силою мы приобрели себе могущество?»"
    - "Ассирийские тексты называют город Карнини, центром провинции после завоеваний Тиглатпаласара III. В Маккавейских войнах Карнаим был одним из укреплённых городов Галаада: Иуда Маккавей взял его и сжёг храм вместе с врагами, бежавшими туда, а Вторая книга Маккавейская, рассказывая о том же походе, называет Карнион с храмом Атаргатис — возможно, то же место. В византийское время Карнею показывали как город Иова: Евсевий помещает там дом Иова, туда ходила паломница Эгерия, а в Шейх-Сааде стелу Рамсеса II издавна показывают как «камень Иова»."
  uk:
    - "Аштерот-Карнаїм, «Аштарот двох рогів», — назва, яку Буття дає місту у Башані, на базальтовій рівнині Хавран на схід від Галілейського моря, у нинішній мухафазі Дераа в Сирії. Його розуміють або як сам Аштарот, місто Ога в Телль-Аштарі, або як Карнаїн, його сусіда за кілька кілометрів на північ в аль-Шейх-Саді, який згодом перейняв роль столиці округу й успадкував подвійну назву. Євсевій знав два села під назвою Аштерот-Карнаїм на відстані дев'яти миль одне від одного, між Адраа та Абілою."
    - "Ім'я трапляється один раз, на початку війни чотирьох царів: «І прийшли в чотирнайцятому роцї Кедорлайомер і царі, що були з ним, та й побили Рефаїмів ув Астарот Карнаїмі, а Сусїїв у Гамі, а Еміїв на Кириятаїм-долинї». Башан залишався в пам'яті Ізраїлю краєм рефаїмів: «тільки Ог, царь Базанський, зоставсь з останнїх велетнїв». Пізніше Амос глузує з Ізраїлю, який хвалиться Карнаїном, назвою, яку Біблія короля Якова перекладає, питаючи, чи не здобули ми собі рогів власною силою."
    - "Ассирійські тексти називають місто Карніні, осідок провінції після завоювань Тіглатпаласара III. У війнах Маккавеїв Карнаїм був одним із міцних міст Гілеаду: Юда Маккавей узяв його й спалив його храм разом із ворогами, що сховалися в ньому, а 2 Маккавеїв, розповідаючи про той самий похід, називає Карніон із храмом Атаргатіс, що може бути тим самим місцем. У візантійські часи Карнею показували як місто Йова: Євсевій розміщує там дім Йова, і прочанка Егерія вирушила туди, а в Шейх-Саді стелу Рамсеса II здавна показують як Камінь Йова."
  es:
    - "Astarot-carnaim, «Astarot de los dos cuernos», es el nombre que el Génesis da a una ciudad de Basán, en la llanura basáltica del Haurán, al este del mar de Galilea, en la actual gobernación siria de Daraa. Se la toma bien por la propia Astarot, la ciudad de Og en Tell Ashtara, bien por Carnaim, su vecina unos kilómetros al norte, en al-Sheikh Saad, que más tarde asumió el papel de capital del distrito y heredó el nombre doble. Eusebio conocía dos aldeas llamadas Astarot Carnaim, a nueve millas una de otra, entre Adraa y Abila."
    - "El nombre aparece una vez, al comienzo de la guerra de los cuatro reyes: «en el año décimocuarto vino Chêdorlaomer, y los reyes que estaban de su parte, y derrotaron á los Raphaitas en Ashteroth-carnaim, á los Zuzitas en Ham, y á los Emitas en Shave-Kiriataim». Basán siguió siendo en la memoria de Israel la tierra de los refaítas: «sólo Og rey de Basán había quedado de los gigantes que quedaron». Amós se burla después de Israel porque se jacta de Carnaim, nombre que la versión King James traduce: «¿No nos hemos tomado cuernos con nuestra propia fuerza?»."
    - "Los textos asirios llaman a la ciudad Qarnini, sede de una provincia tras las conquistas de Tiglat-pileser III. En las guerras macabeas Carnaim era una de las ciudades fuertes de Galaad: Judas Macabeo la tomó y quemó su templo con los enemigos que se habían refugiado en él, y 2 Macabeos, al contar la misma campaña, nombra un Carnión con un templo de Atargatis, que puede ser el mismo lugar. En tiempos bizantinos se mostraba Karnea como la ciudad de Job: Eusebio sitúa allí la casa de Job y la peregrina Egeria viajó a ella, y en Sheikh Saad se muestra desde hace mucho una estela de Ramsés II como la Piedra de Job."
  pt:
    - "Astarote-Carnaim, “Astarote dos dois chifres”, é o nome que o Gênesis dá a uma cidade de Basã, na planície basáltica do Haurã, a leste do mar da Galileia, na atual governadoria de Daraa, na Síria. É tomada ou como a própria Astarote, a cidade de Ogue em Tell Ashtara, ou como Carnaim, sua vizinha a poucos quilômetros ao norte, em al-Sheikh Saad, que mais tarde assumiu o papel de capital do distrito e herdou o nome duplo. Eusébio conhecia duas aldeias chamadas Astarote Carnaim, a nove milhas uma da outra, entre Adraa e Abila."
    - "O nome ocorre uma só vez, na abertura da guerra dos quatro reis: “No décimo quarto ano, Quedorlaomer e os reis que estavam com ele vieram e derrotaram os refains em Asterote-Carnaim, os zuzins em Hã, os emins em Savé-Quiriataim”. Basã permaneceu na memória de Israel como a terra dos refains: “somente Ogue, rei de Basã, restou do remanescente dos refains”. Amós zomba mais tarde de Israel por se gabar de Carnaim, nome que a Versão King James traduz, como também a Bíblia em português: “Não tomamos para nós chifres pela nossa própria força?”"
    - "Textos assírios chamam a cidade Qarnini, sede de uma província depois das conquistas de Tiglate-Pileser III. Nas guerras macabaicas, Carnaim foi uma das cidades fortes de Gileade: Judas Macabeu a tomou e queimou seu templo com os inimigos que haviam fugido para dentro dele, e 2 Macabeus, ao narrar a mesma campanha, menciona um Carnion com um templo de Atargatis, que pode ser o mesmo lugar. Em tempos bizantinos, Karnea era mostrada como a cidade de Jó: Eusébio situa ali a casa de Jó e a peregrina Egéria viajou até lá, e em Sheikh Saad uma estela de Ramsés II é há muito mostrada como a Pedra de Jó."
  de:
    - "Aschtarot-Karnajim, „Astarot mit den zwei Hörnern“, ist der Name, den das Erste Buch Mose einer Stadt in Baschan in der Basaltebene des Hauran östlich des Sees Genezareth gibt, im heutigen Gouvernement Daraa in Syrien. Sie wird entweder für Astarot selbst gehalten, die Stadt des Og bei Tell Aschtara, oder für Karnajim, seine Nachbarin einige Kilometer weiter nördlich bei al-Scheich Saad, die später die Rolle der Bezirkshauptstadt übernahm und den Doppelnamen erbte. Eusebius kannte zwei Dörfer namens Astaroth Karnaim in neun Meilen Abstand, zwischen Adraa und Abila."
    - "Der Name kommt einmal vor, zu Beginn des Krieges der vier Könige: „Darum kam Kedor-Laomor und die Könige, die mit ihm waren, im vierzehnten Jahr und schlugen die Riesen zu Astharoth-Karnaim und die Susiter zu Ham und die Emiter in dem Felde Kirjathaim“. Baschan blieb in Israels Erinnerung das Land der Refaiter: „allein der König Og von Basan war noch übrig von den Riesen“. Amos verspottet Israel später dafür, dass es sich Karnajims rühmt, eines Namens, den die King-James-Bibel mit Hörnern übersetzt, in der Frage, ob man sich nicht aus eigener Kraft Hörner genommen habe."
    - "Assyrische Texte nennen die Stadt Qarnini, Sitz einer Provinz nach den Eroberungen Tiglat-Pilesers III. In den Makkabäerkriegen war Karnajim eine der festen Städte Gileads: Judas Makkabäus nahm es ein und verbrannte seinen Tempel samt den Feinden, die sich hineingeflüchtet hatten, und das Zweite Makkabäerbuch nennt bei demselben Feldzug ein Karnion mit einem Tempel der Atargatis, das derselbe Ort sein kann. In byzantinischer Zeit wurde Karnea als Stadt Hiobs gezeigt: Eusebius verlegt das Haus Hiobs dorthin, und die Pilgerin Egeria reiste dorthin, und in Scheich Saad wird eine Stele Ramses' II. seit langem als Stein Hiobs gezeigt."
  fr:
    - "Aschteroth-Karnaïm, « Aschtaroth aux deux cornes », est le nom que la Genèse donne à une ville du Basan, dans la plaine basaltique du Havran, à l’est de la mer de Galilée, dans l’actuel gouvernorat de Deraa, en Syrie. On y voit soit Aschtaroth elle-même, la ville d’Og, à Tell Ashtara, soit Karnaïm, sa voisine à quelques kilomètres au nord, à Cheikh Saad, qui reprit plus tard le rôle de capitale de district et hérita du double nom. Eusèbe connaissait deux villages appelés Astaroth Karnaïm, distants de neuf milles, entre Adraa et Abila."
    - "Le nom se rencontre une fois, à l’ouverture de la guerre des quatre rois : « la quatorzième année, Kedorlaomer et les rois qui étaient avec lui se mirent en marche, et ils battirent les Rephaïm à Aschteroth-Karnaïm, les Zuzim à Ham, les Émim à Schavé-Kirjathaïm ». Le Basan resta dans la mémoire d’Israël le pays des Rephaïm : « Og, roi de Basan, était resté seul de la race des Rephaïm ». Amos raille plus tard Israël, qui se glorifie de Karnaïm, nom que la version du roi Jacques traduit en demandant si Israël n’a pas pris des cornes par sa propre force."
    - "Les textes assyriens appellent la ville Qarnini, siège d’une province après les conquêtes de Tiglath-Piléser III. Dans les guerres des Maccabées, Carnaïm était l’une des places fortes de Galaad : Judas Maccabée la prit et brûla son temple avec les ennemis qui s’y étaient réfugiés, et 2 Maccabées, racontant la même campagne, nomme un Carnion avec un temple d’Atargatis, qui peut être le même lieu. À l’époque byzantine, Karnéa était montrée comme la ville de Job : Eusèbe y place la maison de Job et la pèlerine Égérie s’y rendit, et à Cheikh Saad une stèle de Ramsès II est montrée depuis longtemps comme la Pierre de Job."
  it:
    - "Astarot-Karnaim, «Astarot dalle due corna», è il nome che la Genesi dà a una città del Basan nella pianura basaltica dell’Hauran, a est del mare di Galilea, nell’odierno governatorato siriano di Daraa. Lo si intende o come la stessa Astarot, la città di Og a Tell Ashtara, o come Karnaim, sua vicina a pochi chilometri a nord, ad al-Sheikh Saad, che più tardi assunse il ruolo di capoluogo del distretto ed ereditò il doppio nome. Eusebio conosceva due villaggi detti Astaroth Karnaim a nove miglia l’uno dall’altro, tra Adraa e Abila."
    - "Il nome compare una sola volta, all’inizio della guerra dei quattro re: «nell’anno quattordicesimo, Kedorlaomer e i re ch’erano con lui vennero e sbaragliarono i Refei ad Ashteroth-Karnaim, gli Zuzei a Ham, gli Emei nella pianura di Kiriathaim». Il Basan rimase nella memoria di Israele il paese dei Refaim: «Og, re di Basan, era rimasto solo della stirpe dei Refaim». Amos deride poi Israele che si vanta di Karnaim, nome che la King James Version traduce con la parola corna: in quella versione il versetto chiede se Israele non si sia procurato le corna con la propria forza."
    - "I testi assiri chiamano la città Qarnini, sede di una provincia dopo le conquiste di Tiglat-Pileser III. Nelle guerre maccabaiche Carnaim era una delle città forti di Galaad: Giuda Maccabeo la prese e ne bruciò il tempio con i nemici che vi si erano rifugiati, e il Secondo libro dei Maccabei, raccontando la stessa campagna, nomina un Carnion con un tempio di Atargati, che può essere lo stesso luogo. In epoca bizantina Karnea era indicata come la città di Giobbe: Eusebio vi colloca la casa di Giobbe ed Egeria vi si recò, e a Sheikh Saad una stele di Ramses II è mostrata da tempo come Pietra di Giobbe."
  nl:
    - "Astarot-Karnaïm, ‘Astarot van de twee hoorns’, is de naam die Genesis geeft aan een stad in Basan in de basaltvlakte van de Hauran ten oosten van het Meer van Galilea, in het huidige gouvernement Daraa in Syrië. Zij wordt opgevat als Astarot zelf, de stad van Og bij Tell Ashtara, of als Karnaïm, de buurstad enkele kilometers naar het noorden bij al-Sheikh Saad, die later de rol van districtshoofdstad overnam en de dubbele naam erfde. Eusebius kende twee dorpen die Astaroth Karnaim heetten, negen mijl van elkaar, tussen Adraa en Abila."
    - "De naam komt eenmaal voor, bij het begin van de oorlog van de vier koningen: “Zo kwam Kedor-Laomer in het veertiende jaar, en de koningen, die met hem waren, en sloegen de Refaieten in Asteroth-Karnaim, en de Zuzieten in Ham, en de Emieten in Schave-Kiriathaim”. Basan bleef in Israëls herinnering het land van de Refaïm: “Og, de koning van Bazan, was alleen van de overigen der reuzen overgebleven”. Amos spot later met Israël dat het zich op Karnaïm beroemt, een naam die de King James Version met horns weergeeft: “Have we not taken to us horns by our own strength?”"
    - "Assyrische teksten noemen de stad Qarnini, de zetel van een provincie na de veroveringen van Tiglat-Pileser III. In de Makkabeeënoorlogen was Karnaïm een van de sterke steden van Gilead: Judas Makkabeüs nam haar in en verbrandde haar tempel met de vijanden die erin waren gevlucht, en 2 Makkabeeën noemt bij dezelfde veldtocht een Karnion met een tempel van Atargatis, wellicht dezelfde plaats. In Byzantijnse tijd werd Karnea getoond als de stad van Job: Eusebius plaatst er het huis van Job en de pelgrim Egeria reisde ernaartoe, en te Sheikh Saad wordt een stèle van Ramses II al lang als de Steen van Job getoond."
  pl:
    - "Asztarot-Karnaim, „Asztarot o dwóch rogach”, to nazwa, którą Księga Rodzaju nadaje miastu Baszanu na bazaltowej równinie Hauranu, na wschód od Jeziora Galilejskiego, w dzisiejszej muhafazie Daraa w Syrii. Uważa się je albo za samo Asztarot, miasto Oga w Tell Asztara, albo za Karnaim, jego sąsiada kilka kilometrów na północ, w al-Szajch Saad, który później przejął rolę stolicy okręgu i odziedziczył podwójną nazwę. Euzebiusz znał dwie wsie zwane Astaroth Karnaim, oddalone od siebie o dziewięć mil, między Adraa a Abilą."
    - "Nazwa występuje raz, na początku wojny czterech królów: „roku czternastego wyciągnął Chodorlahomer z królmi, którzy z nim byli, i poraził Rafaimy w Astarot Karnaimie, i Zuzymy w Hamie, i Emimy w Sawie Karyjataim”. Baszan pozostał w pamięci Izraela ziemią Refaitów: „tylko sam Og, król Basański pozostał był z olbrzymów”. Amos drwi później z Izraela, że chełpi się Karnaim, nazwą, którą Biblia Króla Jakuba tłumaczy jako „horns” (rogi); Biblia Gdańska ma tu: „Izaliśmy sobie nie naszą mocą wzięli rogi?”"
    - "Teksty asyryjskie nazywają to miasto Karnini, siedzibą prowincji po podbojach Tiglat-Pilesera III. W wojnach machabejskich Karnaim było jednym z warownych miast Gileadu: Juda Machabeusz zdobył je i spalił jego świątynię wraz z wrogami, którzy w niej się schronili, a Druga Księga Machabejska, opowiadając o tej samej wyprawie, wymienia Karnion ze świątynią Atargatis, które może być tym samym miejscem. W czasach bizantyjskich Karnea była pokazywana jako miasto Hioba: Euzebiusz umieszcza tam dom Hioba, a pielgrzymka Egeria dotarła do niego; w Szajch Saad stelę Ramzesa II od dawna pokazuje się jako Kamień Hioba."
  cs:
    - "Aštarót-karnajim, „Aštarót dvou rohů“, je jméno, které Genesis dává městu v Bášanu v čedičové planině Havranu východně od Galilejského jezera, v dnešním guvernorátu Dar'á v Sýrii. Ztotožňuje se buď s Aštarótem samým, městem Ogovým u Tell Aštara, nebo s Karnajimem, jeho sousedem několik kilometrů na sever u Šajch Sa'd, který později převzal úlohu hlavního města okresu a zdědil dvojí jméno. Eusebius znal dvě vesnice zvané Astaroth Karnaim vzdálené devět mil, mezi Adraou a Abilou."
    - "Jméno se vyskytuje jednou, na počátku války čtyř králů: „léta čtrnáctého přitáhl Chedorlaomer a králové, kteříž byli s ním, a pobili Refaimské v Astarotu Karnaimských, a Zuzimské v Cham, a Eminské na rovinách Kariataimských“. Bášan zůstal v paměti Izraele zemí Refaimů: „Sám toliko Og, král v Bázan, z jiných obrů byl pozůstal.“ Amos později zesměšňuje Izrael, že se chlubí Karnajimem, jménem, které překládá Bible krále Jakuba stejně jako Bible kralická: „Zdaliž jsme svou silou nevzali sobě rohů?“"
    - "Asyrské texty nazývají město Karnini, sídlo provincie po výbojích Tiglatpilesara III. V makabejských válkách byl Karnaim jedním z pevných měst Gileadu: Juda Makabejský je dobyl a spálil jeho chrám spolu s nepřáteli, kteří se do něj uchýlili, a 2. kniha Makabejská, vyprávějící o téže výpravě, jmenuje Karnion s chrámem Atargatidy, což může být totéž místo. V byzantské době byla Karnea ukazována jako město Jobovo: Eusebius tam klade Jobův dům a poutnice Egerie se tam vydala a v Šajch Sa'd se dlouho ukazuje stéla Ramesse II. jako Jobův kámen."
scripture:
  - Gen.14.5
  - Deut.3.11
  - Amos.6.13
