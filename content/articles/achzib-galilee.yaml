body:
  en:
    - "Achzib was a Phoenician harbour town on the coast of Galilee, about 14 km north of Acco, where the Kziv stream meets the sea; the mound, Tel Achziv, kept the name as ez-Zib. Joshua makes it the end of Asher's border: the line turns to Hosah “and the outgoings thereof are at the sea from the coast to Achzib”. Judges admits that Asher never held it: “Neither did Asher drive out the inhabitants of Accho, nor the inhabitants of Zidon, nor of Ahlab, nor of Achzib”. It stayed Phoenician. Sennacherib names Akzibu among the towns of Luli, king of Sidon, that he took in 701 BC, and Josephus knew it as Ecdippa."
    - "Excavations on the mound and in its cemeteries, by I. Ben-Dor in 1941 to 1944, by M. W. Prausnitz from the late 1950s into the 1980s and by Eilat Mazar from 1988 to 2004, found a town fortified in the Middle Bronze Age and rich Phoenician tombs of the Iron Age, with pottery, jewellery and clay figurines; the harbour was in use through the Persian, Hellenistic and Roman periods. Today Achziv is a national park on the coast of Israel north of Nahariya, with the mound, the beaches and the houses of the village of az-Zib that stood there until 1948."
  ru:
    - "Ахзив — финикийский портовый городок на берегу Галилеи, примерно в 14 км к северу от Акко, где поток Кзив впадает в море; холм, Тель-Ахзив, сохранил имя как Эз-Зиб. Книга Иисуса Навина делает его концом предела Асира: предел поворачивает к Хоссе «и оканчивается у моря, в местечке Ахзиве». Книга Судей признаёт, что Асир его так и не взял: «И Асир не изгнал жителей Акко», а с ними и «жителей Сидона и Ахлава, Ахзива». Он остался финикийским. Сеннахирим называет Акзибу среди городов Лули, царя Сидонского, взятых им в 701 г. до н. э., а Иосиф Флавий знал его как Экдиппу."
    - "Раскопки на холме и в его некрополях — И. Бен-Дора в 1941–1944 годах, М. Праусница с конца 1950-х по 1980-е годы и Эйлат Мазар в 1988–2004 годах — открыли город, укреплённый ещё в среднем бронзовом веке, и богатые финикийские гробницы железного века с керамикой, украшениями и глиняными фигурками; гавань служила и в персидское, эллинистическое и римское время. Сегодня Ахзив — национальный парк на побережье Израиля к северу от Нагарии, с холмом, пляжами и домами деревни Эз-Зиб, стоявшей здесь до 1948 года."
  uk:
    - "Ахзів був фінікійським портовим містом на узбережжі Галілеї, приблизно за 14 км на північ від Акко, де потік Кзів впадає в море; пагорб Тель-Ахзів зберіг назву у вигляді ез-Зіб. Ісус Навин робить його кінцем кордону Асіра: межа повертає до Хоси, «а кінець їй над морем у Ахсиві місточку». Книга Суддів визнає, що Асір ніколи ним не володів: «Ассер не повиганяв осадників Акковських і осадників Сидонських і Ахлавських, Ахзивських». Він лишався фінікійським. Сінаххеріб називає Акзібу серед міст Лулі, царя Сідона, які він узяв у 701 р. до н. е., а Йосиф Флавій знав його як Екдіппу."
    - "Розкопки на пагорбі та в його некрополях — І. Бен-Дора в 1941–1944 рр., М. В. Праусніца від кінця 1950-х до 1980-х рр. та Еїлат Мазар у 1988–2004 рр. — виявили місто, укріплене ще в середню бронзову добу, та багаті фінікійські гробниці залізної доби з керамікою, прикрасами й глиняними фігурками; гавань використовували в перську, елліністичну та римську доби. Нині Ахзів — національний парк на узбережжі Ізраїлю на північ від Нагарії, з пагорбом, пляжами та будинками села аз-Зіб, що стояло тут до 1948 року."
  es:
    - "Aczib era una ciudad portuaria fenicia en la costa de Galilea, a unos 14 km al norte de Aco, donde el arroyo Kziv desemboca en el mar; el montículo, Tel Achziv, conservó el nombre como ez-Zib. Josué la hace el final de la frontera de Aser: la línea vuelve a Hosa «y sale á la mar desde el territorio de Achzib». Jueces admite que Aser nunca la poseyó: «Tampoco Aser echó á los que habitaban en Achô, y á los que habitaban en Sidón, y en Ahlab, y en Achzib». Siguió siendo fenicia. Senaquerib nombra Akzibu entre las ciudades de Luli, rey de Sidón, que tomó en 701 a. C., y Josefo la conocía como Ecdipa."
    - "Las excavaciones en el montículo y en sus necrópolis, realizadas por I. Ben-Dor de 1941 a 1944, por M. W. Prausnitz desde finales de la década de 1950 hasta la de 1980 y por Eilat Mazar de 1988 a 2004, hallaron una ciudad fortificada en la Edad del Bronce Medio y ricas tumbas fenicias de la edad del Hierro, con cerámica, joyas y figurillas de arcilla; el puerto estuvo en uso durante los períodos persa, helenístico y romano. Hoy Achziv es un parque nacional en la costa de Israel, al norte de Nahariya, con el montículo, las playas y las casas de la aldea de az-Zib que se alzó allí hasta 1948."
  pt:
    - "Aczibe era uma cidade portuária fenícia na costa da Galileia, cerca de 14 km ao norte de Aco, onde o riacho Kziv encontra o mar; o montículo, Tel Achziv, conservou o nome como ez-Zib. Josué faz dela o fim da fronteira de Aser: a linha vira para Hosa, “Terminava no mar, pela região de Aczibe”. Juízes admite que Aser nunca a possuiu: “Aser não expulsou os habitantes de Aco, nem os habitantes de Sidom, nem de Ahlabe, nem de Aczibe”. Permaneceu fenícia. Senaqueribe nomeia Akzibu entre as cidades de Luli, rei de Sidom, que tomou em 701 a.C., e Josefo a conhecia como Ecdipa."
    - "Escavações no montículo e em suas necrópoles, feitas por I. Ben-Dor de 1941 a 1944, por M. W. Prausnitz do fim da década de 1950 até a de 1980 e por Eilat Mazar de 1988 a 2004, encontraram uma cidade fortificada na Idade do Bronze Médio e ricos túmulos fenícios da Idade do Ferro, com cerâmica, joias e figurinhas de argila; o porto esteve em uso nos períodos persa, helenístico e romano. Hoje Achziv é um parque nacional na costa de Israel, ao norte de Nahariya, com o montículo, as praias e as casas da aldeia de az-Zib que ali existiu até 1948."
  de:
    - "Achsib war eine phönizische Hafenstadt an der Küste Galiläas, etwa 14 km nördlich von Akko, wo der Bach Kziv ins Meer mündet; der Hügel, Tel Achziv, bewahrte den Namen als ez-Zib. Josua macht es zum Endpunkt von Assers Grenze: Die Linie wendet sich nach Hosa „und endet am Meer in der Gegend von Achsib“. Das Buch der Richter räumt ein, dass Asser es nie besaß: „Asser vertrieb die Einwohner zu Akko nicht noch die Einwohner zu Sidon, zu Ahelab, zu Achsib“. Es blieb phönizisch. Sanherib nennt Akzibu unter den Städten Lulis, des Königs von Sidon, die er 701 v. Chr. einnahm, und Josephus kannte es als Ekdippa."
    - "Grabungen auf dem Hügel und in seinen Gräberfeldern, 1941 bis 1944 durch I. Ben-Dor, von den späten 1950er Jahren bis in die 1980er durch M. W. Prausnitz und 1988 bis 2004 durch Eilat Mazar, fanden eine in der Mittelbronzezeit befestigte Stadt und reiche phönizische Gräber der Eisenzeit mit Keramik, Schmuck und Tonfiguren; der Hafen war in persischer, hellenistischer und römischer Zeit in Gebrauch. Heute ist Achziv ein Nationalpark an der Küste Israels nördlich von Nahariya, mit dem Hügel, den Stränden und den Häusern des Dorfes az-Zib, das dort bis 1948 stand."
  fr:
    - "Aczib était une ville portuaire phénicienne de la côte de Galilée, à environ 14 km au nord d’Acco, là où le ruisseau Kziv rejoint la mer ; le tertre, Tel Achziv, a gardé le nom sous la forme ez-Zib. Josué en fait le terme de la frontière d’Aser : la limite tourne vers Hosa « pour aboutir à la mer, par la contrée d’Aczib ». Les Juges avouent qu’Aser ne la posséda jamais : « Aser ne chassa point les habitants d’Acco, ni les habitants de Sidon, ni ceux d’Achlal, d’Aczib… ». Elle resta phénicienne. Sanchérib nomme Akzibu parmi les villes de Luli, roi de Sidon, qu’il prit en 701 av. J.-C., et Josèphe la connaissait sous le nom d’Ecdippa."
    - "Les fouilles du tertre et de ses nécropoles, par I. Ben-Dor de 1941 à 1944, par M. W. Prausnitz de la fin des années 1950 aux années 1980 et par Eilat Mazar de 1988 à 2004, ont révélé une ville fortifiée au Bronze moyen et de riches tombes phéniciennes de l’âge du Fer, avec céramique, bijoux et figurines d’argile ; le port fut en usage aux époques perse, hellénistique et romaine. Aujourd’hui Achziv est un parc national sur la côte d’Israël, au nord de Nahariya, avec le tertre, les plages et les maisons du village d’az-Zib qui s’y dressait jusqu’en 1948."
  it:
    - "Aczib era una città portuale fenicia sulla costa della Galilea, a circa 14 km a nord di Acco, dove il torrente Kziv incontra il mare; il tell, Tel Achziv, ne ha conservato il nome come ez-Zib. Giosuè ne fa il termine del confine di Aser: la linea gira verso Cosa «e facea capo al mare dal lato del territorio di Acrib». I Giudici ammettono che Aser non la tenne mai: «Ascer non cacciò gli abitanti di Acco, né gli abitanti di Sidone, né quelli di Ahlab, di Aczib». Rimase fenicia. Sennacherib nomina Akzibu fra le città di Lulì, re di Sidone, da lui prese nel 701 a.C., e Flavio Giuseppe la conosceva come Ecdippa."
    - "Gli scavi sul tell e nelle sue necropoli, condotti da I. Ben-Dor dal 1941 al 1944, da M. W. Prausnitz dalla fine degli anni Cinquanta fino agli anni Ottanta e da Eilat Mazar dal 1988 al 2004, hanno trovato una città fortificata nell’età del Bronzo Medio e ricche tombe fenicie dell’età del Ferro, con ceramica, gioielli e figurine d’argilla; il porto fu in uso per tutto il periodo persiano, ellenistico e romano. Oggi Achziv è un parco nazionale sulla costa di Israele a nord di Nahariyya, con il tell, le spiagge e le case del villaggio di az-Zib che vi sorse fino al 1948."
  pl:
    - "Akzib było fenickim miastem portowym na wybrzeżu Galilei, około 14 km na północ od Akko, tam gdzie strumień Kziw wpada do morza; tell, Tel Akziw, zachował nazwę jako ez-Zib. Księga Jozuego czyni je końcem granicy Aszera: linia skręca ku Chosie, „a kończy się u morza podle działu Achsyba”. Księga Sędziów przyznaje, że Aszer nigdy go nie posiadł: „Aser też nie wypędził mieszkających w Acho, i mieszkających w Sydonie, i w Ahalab, i w Achsyb”. Pozostało fenickie. Sennacheryb wymienia Akzibu wśród miast Luliego, króla Sydonu, które zdobył w 701 r. p.n.e., a Józef Flawiusz znał je jako Ekdippa."
    - "Wykopaliska na tellu i w jego nekropoliach, prowadzone przez I. Ben-Dora w latach 1941–1944, przez M. W. Prausnitza od końca lat 50. do 80. i przez Eilat Mazar w latach 1988–2004, odsłoniły miasto obwarowane w średniej epoce brązu i bogate fenickie grobowce z epoki żelaza, z ceramiką, biżuterią i glinianymi figurkami; port używano w okresie perskim, hellenistycznym i rzymskim. Dziś Akziw to park narodowy na wybrzeżu Izraela na północ od Nahariji, z tellem, plażami i domami wsi az-Zib, która stała tu do 1948 roku."
  nl:
    - "Achzib was een Fenicische havenstad aan de kust van Galilea, zo’n 14 km ten noorden van Akko, waar de beek Kziv in zee uitmondt; de heuvel, Tel Achziv, bewaarde de naam als ez-Zib. Jozua maakt het tot het eindpunt van Asers grens: de lijn buigt naar Chosa “en haar uitgangen zijn aan de zee, van het landsnoer strekkende naar Achzib”. Richteren erkent dat Aser het nooit in bezit had: “Aser verdreef de inwoners van Acco niet, noch de inwoners van Sidon, noch Achlab, noch Achsib”. Het bleef Fenicisch. Sanherib noemt Akzibu onder de steden van Luli, koning van Sidon, die hij in 701 v.Chr. innam, en Josephus kende het als Ecdippa."
    - "Opgravingen op de heuvel en in de begraafplaatsen, door I. Ben-Dor in 1941 tot 1944, door M. W. Prausnitz vanaf het eind van de jaren vijftig tot in de jaren tachtig en door Eilat Mazar van 1988 tot 2004, brachten een in de middenbronstijd versterkte stad en rijke Fenicische graven uit de ijzertijd aan het licht, met aardewerk, sieraden en kleifiguurtjes; de haven bleef in gebruik door de Perzische, Hellenistische en Romeinse tijd. Tegenwoordig is Achziv een nationaal park aan de kust van Israël ten noorden van Nahariya, met de heuvel, de stranden en de huizen van het dorp az-Zib dat er tot 1948 stond."
  cs:
    - "Achzív byl fénický přístav na pobřeží Galileje, asi 14 km severně od Akka, kde potok Kziv ústí do moře; pahorek Tel Achziv uchoval jméno jako ez-Zib. Jozue z něj činí konec hranice Ašerovy: čára se obrací do Chosy „a skonává se při moři podlé vyměření v Achziba“. Kniha Soudců přiznává, že jej Ašer nikdy nedržel: „Asser také nevyhnal obyvatelů Acho a obyvatelů Sidonu, ani Ahalab, ani Achzib“. Zůstal fénický. Senacherib jmenuje Akzibu mezi městy Luliho, krále Sidónu, která dobyl v roce 701 př. n. l., a Josephus Flavius je znal jako Ekdippu."
    - "Vykopávky na pahorku a v jeho nekropolích, které vedli I. Ben-Dor v letech 1941 až 1944, M. W. Prausnitz od konce 50. let do 80. let a Eilat Mazar v letech 1988 až 2004, odkryly město opevněné ve střední době bronzové a bohaté fénické hrobky doby železné s keramikou, šperky a hliněnými figurkami; přístav byl používán v době perské, helénistické i římské. Dnes je Achziv národním parkem na pobřeží Izraele severně od Nahariji s pahorkem, plážemi a domy vesnice az-Zib, která tam stála do roku 1948."
  sv:
    - "Aksiv var en fenicisk hamnstad vid Galileens kust, omkring 14 km norr om Acko, där bäcken Kziv möter havet; kullen, Tel Achziv, har behållit namnet som ez-Zib. Josua gör den till slutpunkten för Ashers gräns: linjen vänder sig till Hosa och ”gick så ut vid havet där landsträckan vid Aksib begynner”. Domarboken medger att Asher aldrig höll den: ”Aser fördrev icke invånarna i Acko eller invånarna i Sidon, ej heller dem i Alab, Aksib …”. Den förblev fenicisk. Sanherib nämner Akzibu bland de städer som tillhörde Luli, kungen av Sidon, och som han intog år 701 f.Kr., och Josefus kände den som Ekdippa."
    - "Utgrävningar på kullen och i dess gravfält, av I. Ben-Dor 1941–1944, av M. W. Prausnitz från slutet av 1950-talet in på 1980-talet och av Eilat Mazar 1988–2004, fann en stad som var befäst under mellersta bronsåldern och rika feniciska gravar från järnåldern, med keramik, smycken och lerfigurer; hamnen var i bruk under den persiska, hellenistiska och romerska tiden. I dag är Achziv en nationalpark vid Israels kust norr om Nahariya, med kullen, stränderna och husen i byn az-Zib som stod där till 1948."
  nb:
    - "Aksib var en fønikisk havneby på kysten av Galilea, omtrent 14 km nord for Akko, der bekken Kziv møter havet; tellen, Tel Achziv, har bevart navnet som ez-Zib. Josva gjør den til endepunktet for Asjers grense: linjen vender mot Hosa og «endte ute ved havet, ikke langt fra Aksib». Dommerboken innrømmer at Asjer aldri holdt den: «Aser drev ikke bort innbyggerne i Akko og innbyggerne i Sidon og Ahlab og Aksib». Den forble fønikisk. Sankerib nevner Akzibu blant byene til Luli, konge av Sidon, som han tok i 701 f.Kr., og Josefus kjente den som Ekdippa."
    - "Utgravninger på tellen og i gravfeltene, ved I. Ben-Dor i 1941 til 1944, ved M. W. Prausnitz fra slutten av 1950-årene og inn i 1980-årene og ved Eilat Mazar fra 1988 til 2004, fant en by befestet i mellombronsealder og rike fønikiske graver fra jernalderen, med keramikk, smykker og leirfigurer; havnen var i bruk gjennom persisk, hellenistisk og romersk tid. I dag er Achziv en nasjonalpark på kysten av Israel nord for Nahariya, med tellen, strendene og husene i landsbyen az-Zib som sto der til 1948."
scripture:
  - Josh.19.29
  - Judg.1.31
