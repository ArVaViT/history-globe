# Overview article (ADR 0007). Mainstream facts only; this is the Phoenician Achzib on the coast of Asher, not Achzib of Judah; Assyrian dates follow the eponym chronology.
id: achzib-galilee
place: ad0d82f
title:
  en: "Achzib in Galilee"
  ru: "Ахзив в Галилее"
  uk: "Ахзів у Галілеї"
  es: "Aczib en Galilea"
  pt: "Aczibe na Galileia"
  de: "Achsib in Galiläa"
  fr: "Aczib en Galilée"
body:
  en:
    - "Achzib was a Phoenician harbour town on the coast of Galilee, about 14 km north of Acco, where the Kziv stream meets the sea; the mound, Tel Achziv, kept the name as ez-Zib. Joshua makes it the end of Asher's border: the line turns to Hosah “and the outgoings thereof are at the sea from the coast to Achzib”. Judges admits that Asher never held it: “Neither did Asher drive out the inhabitants of Accho, nor the inhabitants of Zidon, nor of Ahlab, nor of Achzib”. It stayed Phoenician. Sennacherib names Akzibu among the towns of Luli, king of Sidon, that he took in 701 BC, and Josephus knew it as Ecdippa."
    - "Excavations on the mound and in its cemeteries, by I. Ben-Dor in 1941 to 1944, by M. W. Prausnitz from the late 1950s into the 1980s and by Eilat Mazar in 1988 to 1990, found a town fortified in the Middle Bronze Age and rich Phoenician tombs of the Iron Age, with pottery, jewellery and clay figurines; the harbour was in use through the Persian, Hellenistic and Roman periods. Today Achziv is a national park on the coast of Israel north of Nahariya, with the mound, the beaches and the houses of the village of az-Zib that stood there until 1948."
  ru:
    - "Ахзив — финикийский портовый городок на берегу Галилеи, примерно в 14 км к северу от Акко, где поток Кзив впадает в море; холм, Тель-Ахзив, сохранил имя как Эз-Зиб. Книга Иисуса Навина делает его концом предела Асира: предел поворачивает к Хоссе «и оканчивается у моря, в местечке Ахзиве». Книга Судей признаёт, что Асир его так и не взял: «И Асир не изгнал жителей Акко», а с ними и «жителей Сидона и Ахлава, Ахзива». Он остался финикийским. Сеннахирим называет Акзибу среди городов Лули, царя Сидонского, взятых им в 701 г. до н. э., а Иосиф Флавий знал его как Экдиппу."
    - "Раскопки на холме и в его некрополях — И. Бен-Дора в 1941–1944 годах, М. Праусница с конца 1950-х по 1980-е годы и Эйлат Мазар в 1988–1990 годах — открыли город, укреплённый ещё в среднем бронзовом веке, и богатые финикийские гробницы железного века с керамикой, украшениями и глиняными фигурками; гавань служила и в персидское, эллинистическое и римское время. Сегодня Ахзив — национальный парк на побережье Израиля к северу от Нагарии, с холмом, пляжами и домами деревни Эз-Зиб, стоявшей здесь до 1948 года."
  uk:
    - "Ахзів був фінікійським портовим містом на узбережжі Галілеї, приблизно за 14 км на північ від Акко, де потік Кзів впадає в море; пагорб Тель-Ахзів зберіг назву у вигляді ез-Зіб. Ісус Навин робить його кінцем кордону Асіра: межа повертає до Хоси, «а кінець їй над морем у Ахсиві місточку». Книга Суддів визнає, що Асір ніколи ним не володів: «Ассер не повиганяв осадників Акковських і осадників Сидонських і Ахлавських, Ахзивських». Він лишався фінікійським. Сінаххеріб називає Акзібу серед міст Лулі, царя Сідона, які він узяв у 701 р. до н. е., а Йосиф Флавій знав його як Екдіппу."
    - "Розкопки на пагорбі та в його некрополях — І. Бен-Дора в 1941–1944 рр., М. В. Праусніца від кінця 1950-х до 1980-х рр. та Еїлат Мазар у 1988–1990 рр. — виявили місто, укріплене ще в середню бронзову добу, та багаті фінікійські гробниці залізної доби з керамікою, прикрасами й глиняними фігурками; гавань використовували в перську, елліністичну та римську доби. Нині Ахзів — національний парк на узбережжі Ізраїлю на північ від Нагарії, з пагорбом, пляжами та будинками села аз-Зіб, що стояло тут до 1948 року."
  es:
    - "Aczib era una ciudad portuaria fenicia en la costa de Galilea, a unos 14 km al norte de Aco, donde el arroyo Kziv desemboca en el mar; el montículo, Tel Achziv, conservó el nombre como ez-Zib. Josué la hace el final de la frontera de Aser: la línea vuelve a Hosa «y sale á la mar desde el territorio de Achzib». Jueces admite que Aser nunca la poseyó: «Tampoco Aser echó á los que habitaban en Achô, y á los que habitaban en Sidón, y en Ahlab, y en Achzib». Siguió siendo fenicia. Senaquerib nombra Akzibu entre las ciudades de Luli, rey de Sidón, que tomó en 701 a. C., y Josefo la conocía como Ecdipa."
    - "Las excavaciones en el montículo y en sus necrópolis, realizadas por I. Ben-Dor de 1941 a 1944, por M. W. Prausnitz desde finales de la década de 1950 hasta la de 1980 y por Eilat Mazar de 1988 a 1990, hallaron una ciudad fortificada en la Edad del Bronce Medio y ricas tumbas fenicias de la edad del Hierro, con cerámica, joyas y figurillas de arcilla; el puerto estuvo en uso durante los períodos persa, helenístico y romano. Hoy Achziv es un parque nacional en la costa de Israel, al norte de Nahariya, con el montículo, las playas y las casas de la aldea de az-Zib que se alzó allí hasta 1948."
  pt:
    - "Aczibe era uma cidade portuária fenícia na costa da Galileia, cerca de 14 km ao norte de Aco, onde o riacho Kziv encontra o mar; o montículo, Tel Achziv, conservou o nome como ez-Zib. Josué faz dela o fim da fronteira de Aser: a linha vira para Hosa, “Terminava no mar, pela região de Aczibe”. Juízes admite que Aser nunca a possuiu: “Aser não expulsou os habitantes de Aco, nem os habitantes de Sidom, nem de Ahlabe, nem de Aczibe”. Permaneceu fenícia. Senaqueribe nomeia Akzibu entre as cidades de Luli, rei de Sidom, que tomou em 701 a.C., e Josefo a conhecia como Ecdipa."
    - "Escavações no montículo e em suas necrópoles, feitas por I. Ben-Dor de 1941 a 1944, por M. W. Prausnitz do fim da década de 1950 até a de 1980 e por Eilat Mazar de 1988 a 1990, encontraram uma cidade fortificada na Idade do Bronze Médio e ricos túmulos fenícios da Idade do Ferro, com cerâmica, joias e figurinhas de argila; o porto esteve em uso nos períodos persa, helenístico e romano. Hoje Achziv é um parque nacional na costa de Israel, ao norte de Nahariya, com o montículo, as praias e as casas da aldeia de az-Zib que ali existiu até 1948."
  de:
    - "Achsib war eine phönizische Hafenstadt an der Küste Galiläas, etwa 14 km nördlich von Akko, wo der Bach Kziv ins Meer mündet; der Hügel, Tel Achziv, bewahrte den Namen als ez-Zib. Josua macht es zum Endpunkt von Assers Grenze: Die Linie wendet sich nach Hosa „und endet am Meer in der Gegend von Achsib“. Das Buch der Richter räumt ein, dass Asser es nie besaß: „Asser vertrieb die Einwohner zu Akko nicht noch die Einwohner zu Sidon, zu Ahelab, zu Achsib“. Es blieb phönizisch. Sanherib nennt Akzibu unter den Städten Lulis, des Königs von Sidon, die er 701 v. Chr. einnahm, und Josephus kannte es als Ekdippa."
    - "Grabungen auf dem Hügel und in seinen Gräberfeldern, 1941 bis 1944 durch I. Ben-Dor, von den späten 1950er Jahren bis in die 1980er durch M. W. Prausnitz und 1988 bis 1990 durch Eilat Mazar, fanden eine in der Mittelbronzezeit befestigte Stadt und reiche phönizische Gräber der Eisenzeit mit Keramik, Schmuck und Tonfiguren; der Hafen war in persischer, hellenistischer und römischer Zeit in Gebrauch. Heute ist Achziv ein Nationalpark an der Küste Israels nördlich von Nahariya, mit dem Hügel, den Stränden und den Häusern des Dorfes az-Zib, das dort bis 1948 stand."
  fr:
    - "Aczib était une ville portuaire phénicienne de la côte de Galilée, à environ 14 km au nord d’Acco, là où le ruisseau Kziv rejoint la mer ; le tertre, Tel Achziv, a gardé le nom sous la forme ez-Zib. Josué en fait le terme de la frontière d’Aser : la limite tourne vers Hosa « pour aboutir à la mer, par la contrée d’Aczib ». Les Juges avouent qu’Aser ne la posséda jamais : « Aser ne chassa point les habitants d’Acco, ni les habitants de Sidon, ni ceux d’Achlal, d’Aczib… ». Elle resta phénicienne. Sanchérib nomme Akzibu parmi les villes de Luli, roi de Sidon, qu’il prit en 701 av. J.-C., et Josèphe la connaissait sous le nom d’Ecdippa."
    - "Les fouilles du tertre et de ses nécropoles, par I. Ben-Dor de 1941 à 1944, par M. W. Prausnitz de la fin des années 1950 aux années 1980 et par Eilat Mazar de 1988 à 1990, ont révélé une ville fortifiée au Bronze moyen et de riches tombes phéniciennes de l’âge du Fer, avec céramique, bijoux et figurines d’argile ; le port fut en usage aux époques perse, hellénistique et romaine. Aujourd’hui Achziv est un parc national sur la côte d’Israël, au nord de Nahariya, avec le tertre, les plages et les maisons du village d’az-Zib qui s’y dressait jusqu’en 1948."
