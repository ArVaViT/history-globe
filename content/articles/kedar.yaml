body:
  en:
    - "Kedar was an Arab tribe, or tribal confederation, of the north Arabian desert east of Israel. Genesis makes Kedar the second son of Ishmael, after Nebaioth. Its people were nomads: the bride of the Song is dark “as the tents of Kedar”, black tents of goat hair; Isaiah speaks of “the villages that Kedar doth inhabit” and of its archers, “the mighty men of the children of Kedar”; Ezekiel lists “Arabia, and all the princes of Kedar” among those who sold Tyre lambs, rams and goats. Assyrian records of the eighth and seventh centuries BC call them Qidri or Qedar: Esarhaddon and Ashurbanipal deal with Hazael, “king of the Arabs”, and his son Yauta, whom historians count as rulers of Qedar; Ashurbanipal's prisms name Ammi-ladi “king of the land Qedar” and recount his desert campaigns against them and the capture of their gods. Their centre lay toward Dumah (Adummatu, al-Jawf)."
    - "Isaiah's oracle on Arabia gives Kedar a year: “all the glory of Kedar shall fail”, and its archers will be few. Jeremiah bids Judah “send unto Kedar” to see whether any nation ever changed its gods, and prophesies “Concerning Kedar, and concerning the kingdoms of Hazor, which Nebuchadrezzar king of Babylon shall smite”: their tents, flocks, curtains and camels taken. The Babylonian Chronicle records Nebuchadnezzar's raid on the Arabs in his sixth year, 599/8 BC. The psalmist laments, “Woe is me, that I sojourn in Mesech, that I dwell in the tents of Kedar!”, and Isaiah's vision of Zion restored gathers to its altar the flocks of Kedar and the rams of Nebaioth: “All the flocks of Kedar shall be gathered together unto thee”."
    - "Under the Persians Kedar reached the border of Egypt. Geshem the Arabian, who mocked Nehemiah's wall, is almost certainly the Gashmu named on a silver bowl from a shrine at Tell el-Maskhuta in the eastern Delta, dedicated in the late fifth century BC by “Qaynu son of Geshem, king of Qedar” to the goddess Han-Ilat. Pliny still lists the Cedrei beside the Nabataeans, who absorbed the old tribes under their kingdom at Petra. The land of Kedar is today the north of Saudi Arabia around Dumat al-Jandal and Jordan's eastern desert, where Bedouin tents are black to this day."
  ru:
    - "Кидар — арабское племя или союз племён северо-аравийской пустыни к востоку и юго-востоку от земли Израиля. Книга Бытия делает Кедара вторым сыном Измаила, после Наваиофа. Библия знает его людей как кочевников: невеста Песни Песней черна, «как шатры Кидарские», чёрные шатры из козьей шерсти; Исаия говорит о селениях, «где обитает Кидар», и о его лучниках, храбрых сынах Кидара; Иезекииль называет Аравию и всех князей Кидарских среди тех, кто продавал Тиру ягнят, баранов и козлов. Ассирийские записи VIII–VII веков до н. э. зовут их Кидри, или Кедар: Асархаддон и Ашшурбанипал имеют дело с Хазаилом, «царём арабов», и его сыном Яутой, которых историки считают правителями Кедара; призмы Ашшурбанипала называют Аммиладу «царём страны Кедар» и рассказывают о его походах против кедарейцев в пустыне и о захвате их богов. Центр племени лежал в сторону Думы (Адумматту, Эль-Джауф) в Вади-Сирхан."
    - "Пророчество Исаии об Аравии даёт Кидару год: «вся слава Кидарова исчезнет», и «луков у храбрых сынов Кидара останется немного». Иеремия велит Иудее послать «в Кидар» и разведать, меняла ли хоть одна страна своих богов, и пророчествует: «О Кидаре и о царствах Асорских, которые поразил Навуходоносор, царь Вавилонский»: их шатры, овец, покровы и верблюдов возьмут. Вавилонская хроника записывает набег Навуходоносора на арабов в его шестой год, 599/598 г. до н. э. Псалмопевец стонет: «Горе мне, что я пребываю у Мосоха, живу у шатров Кидарских», а видение Исаии о восстановленном Сионе собирает к его жертвеннику овец Кидарских и овнов Неваиофских: «Все овцы Кидарские будут собраны к тебе»."
    - "При персах Кидар дотянулся до границы Египта. Гешем Аравитянин, насмехавшийся над стеной Неемии, — почти наверняка тот Гашму, что назван на серебряной чаше из святилища в Телль-эль-Масхуте в восточной Дельте, посвящённой в конце V века до н. э. «Кайну, сыном Гешема, царём Кедара» богине Хан-Илат. Плиний ещё перечисляет кедреев рядом с Набатеями, которые поглотили старые племена под своим царством в Петре. Земля Кидара сегодня — север Саудовской Аравии вокруг Думат-эль-Джандаля и восточная пустыня Иордании, где шатры бедуинов и поныне черны."
  uk:
    - "Кедар було арабським племенем, або племінною конфедерацією, північноаравійської пустелі на схід від Ізраїлю. Книга Буття робить Кедара другим сином Ізмаїла, після Наваїофа. Його люди були кочовиками: наречена Пісні смуглява, як намети Кедару, чорні намети з козячої вовни; Ісая говорить про «оселї, де живе Кедар» і про його лучників, що «не багато луків зостанесь у синів Кедарових»; Єзекіїль перелічує «Арабія й усї князї Кедарські» серед тих, хто продавав Тіру ягнят, баранів і козлів. Ассирійські записи VIII–VII ст. до н. е. називають їх Кідрі або Кедар: Асархаддон і Ашшурбаніпал мають справу з Азаїлом, «царем арабів», і його сином Яутою, яких історики вважають правителями Кедару; призми Ашшурбаніпала називають Аммі-ладі «царем країни Кедар» і розповідають про його пустельні походи проти них і захоплення їхніх богів. Їхній центр лежав у бік Думи (Адумату, ель-Джауф)."
    - "Оракул Ісаї про Аравію дає Кедарові рік: «вся Кидарова слава щезне», і лучників буде мало. Єремія велить Юді «пошлїть у Кедар», щоб побачити, чи колись народ міняв своїх богів, і пророкує: «Про Кедар і про царства Азорські, що (опісля) звоював Навуходонозор, царь Вавилонський»: їхні намети, отари, покриття і верблюди будуть забрані. Вавилонська хроніка записує набіг Навуходоносора на арабів шостого року, 599/8 р. до н. е. Псалмоспівець нарікає: «Горе менї, що проживаю у Мосоха, перебуваю в шатрах Кедарських!», а видіння Ісаї про відновлений Сіон збирає до його жертовника отари Кедару та барани Наваїофа: «Всї вівцї Кидарські будуть зібрані для тебе»."
    - "За персів Кедар сягав кордону Єгипту. Гешем Араб, який глузував з муру Неемії, майже напевно є Гашму, названим на срібній чаші зі святині в Телль-ель-Мескхуті у східній дельті, присвяченій наприкінці V ст. до н. е. «Кайну, син Гешема, цар Кедару» богині Хан-Ілат. Пліній ще перелічує кедреїв поряд з набатеями, які поглинули давні племена в своєму царстві в Петрі. Земля Кедару сьогодні — північ Саудівської Аравії довкола Думат-аль-Джандаль і східна пустеля Йорданії, де бедуїнські намети чорні й досі."
  es:
    - "Cedar era una tribu o confederación árabe del desierto del norte de Arabia, al este de Israel. El Génesis lo hace segundo hijo de Ismael, después de Nebaiot. Eran nómadas: la novia del Cantar es morena «como las cabañas de Cedar», tiendas negras de pelo de cabra; Isaías habla de «las aldeas donde habita Cedar» y de sus arqueros, «los valientes flecheros, hijos de Cedar»; Ezequiel enumera a «Arabia y todos los príncipes de Cedar» entre los que vendían a Tiro corderos, carneros y machos cabríos. Registros asirios de los siglos VIII y VII a. C. los llaman Qidri o Qedar: Esar-hadón y Asurbanipal tratan con Hazael, «rey de los árabes», y su hijo Yauta, tenidos por gobernantes de Qedar; los prismas de Asurbanipal nombran a Ammi-ladi «rey de la tierra de Qedar» y relatan sus campañas en el desierto y la captura de sus dioses. Su centro estaba hacia Duma (Adummatu, al-Jawf)."
    - "El oráculo de Isaías sobre Arabia da a Cedar un plazo de un año: «toda la gloria de Cedar será deshecha», y sus arqueros serán pocos. Jeremías manda a Judá «enviad á Cedar» para ver si alguna nación cambió alguna vez sus dioses, y profetiza: «De Cedar y de los reinos de Hasor, los cuales hirió Nabucodonosor rey de Babilonia»: sus tiendas, rebaños, cortinas y camellos tomados. La Crónica babilónica registra la incursión de Nabucodonosor contra los árabes en su sexto año, 599/8 a. C. El salmista se lamenta: «¡Ay de mí, que peregrino en Mesech, y habito entre las tiendas de Kedar!», y la visión de Isaías de Sión restaurada reúne en su altar los rebaños de Cedar y los carneros de Nebaiot: «Todo el ganado de Cedar será juntado para ti»."
    - "Bajo los persas Cedar llegó a la frontera de Egipto. Gesem el árabe, que se burló del muro de Nehemías, es casi con certeza el Gashmu nombrado en un cuenco de plata de un santuario de Tell el-Maskhuta, en el delta oriental, dedicado a fines del siglo V a. C. por «Qaynu hijo de Geshem, rey de Qedar» a la diosa Han-Ilat. Plinio aún enumera a los Cedrei junto a los nabateos, que absorbieron las antiguas tribus bajo su reino en Petra. La tierra de Cedar es hoy el norte de Arabia Saudí en torno a Dumat al-Jandal y el desierto oriental de Jordania, donde las tiendas beduinas siguen siendo negras."
  pt:
    - "Quedar era uma tribo árabe, ou confederação, do deserto do norte da Arábia, a leste de Israel. Gênesis faz de Quedar o segundo filho de Ismael, depois de Nebaiote. Eram nômades: a noiva do Cântico é morena “como as tendas de Quedar”, tendas negras de pelo de cabra; Isaías fala de “as aldeias habitadas por Quedar” e de seus arqueiros, “os valentes dos filhos de Quedar”; Ezequiel lista “a Arábia e todos os príncipes de Quedar” entre os que vendiam a Tiro cordeiros, carneiros e bodes. Registros assírios dos séculos VIII e VII a.C. os chamam Qidri ou Qedar: Esar-Hadom e Assurbanípal tratam com Hazael, “rei dos árabes”, e seu filho Yauta, tidos por governantes de Qedar; os prismas de Assurbanípal nomeiam Ammi-ladi “rei da terra de Qedar” e narram suas campanhas no deserto contra eles e a captura de seus deuses. Seu centro ficava na direção de Dumá (Adummatu, al-Jawf)."
    - "O oráculo de Isaías sobre a Arábia dá a Quedar um prazo: “toda a glória de Quedar chegará ao fim”, e seus arqueiros serão poucos. Jeremias manda Judá “Enviem a Quedar” para ver se alguma nação mudou seus deuses, e profetiza “A respeito de Quedar e dos reinos de Hazor, que Nabucodonosor, rei da Babilônia, atacou”: suas tendas, rebanhos, cortinas e camelos tomados. A Crônica Babilônica registra a incursão de Nabucodonosor contra os árabes em seu sexto ano, 599/8 a.C. O salmista lamenta: “Ai de mim, que vivo em Meseque, que habito entre as tendas de Quedar!”, e a visão de Isaías de Sião restaurada reúne ao seu altar os rebanhos de Quedar e os carneiros de Nebaiote: “Todos os rebanhos de Quedar se reunirão a você”."
    - "Sob os persas, Quedar chegou à fronteira do Egito. Gesém, o árabe, que zombou da muralha de Neemias, é quase certamente o Gashmu nomeado numa taça de prata de um santuário em Tell el-Maskhuta, no delta oriental, dedicada no fim do século V a.C. por “Qaynu, filho de Gesém, rei de Qedar” à deusa Han-Ilat. Plínio ainda lista os Cedrei ao lado dos nabateus, que absorveram as antigas tribos em seu reino em Petra. A terra de Quedar é hoje o norte da Arábia Saudita em torno de Dumat al-Jandal e o deserto oriental da Jordânia, onde as tendas beduínas ainda são negras."
  de:
    - "Kedar war ein arabischer Stamm oder Stammesbund der nordarabischen Wüste östlich Israels. Das erste Buch Mose macht Kedar zum zweiten Sohn Ismaels nach Nebajot. Es waren Nomaden: Die Braut des Hohelieds ist dunkel „wie die Hütten Kedars“, schwarze Ziegenhaarzelte; Jesaja spricht von „Dörfern, da Kedar wohnt“ und von seinen Schützen, „der übrigen Schützen der Helden zu Kedar“; Hesekiel führt „Arabien und alle Fürsten von Kedar“ unter Tyrus' Händlern mit Lämmern, Widdern und Böcken auf. Assyrische Quellen des 8./7. Jahrhunderts v. Chr. nennen sie Qidri/Qedar: Asarhaddon und Assurbanipal hatten mit Hasaël, „König der Araber“, und seinem Sohn Jauta zu tun, die als Herrscher von Kedar gelten; Assurbanipals Prismen nennen Ammi-ladi „König des Landes Qedar“ und berichten von Wüstenzügen gegen sie und dem Raub ihrer Götter. Ihr Zentrum lag bei Duma (Adummatu, al-Dschauf)."
    - "Jesajas Orakel über Arabien gibt Kedar ein Jahr: „soll alle Herrlichkeit Kedars untergehen“, und seiner Schützen werden wenige sein. Jeremia heißt Juda „nach Kedar“ senden, um zu sehen, ob je ein Volk seine Götter wechselte, und weissagt: „Wider Kedar und die Königreiche Hazors, welche Nebukadnezar, der König zu Babel, schlug“: Ihre Zelte, Herden, Zeltbahnen und Kamele werden genommen. Die Babylonische Chronik verzeichnet Nebukadnezars Raubzug gegen die Araber in seinem sechsten Jahr, 599/8 v. Chr. Der Psalmist klagt: „Wehe mir, daß ich ein Fremdling bin unter Mesech; ich muß wohnen unter den Hütten Kedars“, und Jesajas Vision des wiederhergestellten Zion versammelt die Herden Kedars und die Böcke Nebajots an seinem Altar: „Alle Herden in Kedar sollen zu dir versammelt werden“."
    - "Unter den Persern reichte Kedar bis an die Grenze Ägyptens. Geschem, der Araber, der Nehemias Mauer verspottete, ist fast sicher der Gaschmu, der auf einer Silberschale aus einem Heiligtum in Tell el-Maskhuta im östlichen Delta genannt ist, im späten 5. Jahrhundert v. Chr. von „Qainu, Sohn des Geschem, König von Kedar“ der Göttin Han-Ilat geweiht. Plinius führt die Cedrei noch neben den Nabatäern auf, die die alten Stämme in ihrem Königreich bei Petra aufnahmen. Das Land Kedar ist heute der Norden Saudi-Arabiens um Dumat al-Dschandal und Jordaniens östliche Wüste, wo Beduinenzelte noch heute schwarz sind."
  fr:
    - "Kédar était une tribu arabe, ou une confédération, du désert d’Arabie du nord, à l’est d’Israël. La Genèse en fait le deuxième fils d’Ismaël, après Nebajoth. Nomades : l’épouse du Cantique est noire « comme les tentes de Kédar », tentes noires en poil de chèvre ; Ésaïe parle des « villages occupés par Kédar » et de ses archers, « fils de Kédar » ; Ézéchiel range « l’Arabie et tous les princes de Kédar » parmi ceux qui vendaient à Tyr agneaux, béliers et boucs. Les annales assyriennes des VIIIe–VIIe siècles av. J.-C. les nomment Qidri ou Qedar : Esar-Haddon et Assurbanipal traitent avec Hazaël, « roi des Arabes », et son fils Yauta, comptés parmi les souverains de Qedar ; les prismes d’Assurbanipal nomment Ammi-ladi « roi du pays de Qedar » et racontent ses campagnes contre eux et la prise de leurs dieux. Leur centre se trouvait vers Duma (Adummatu, al-Jawf)."
    - "L’oracle d’Ésaïe sur l’Arabie donne à Kédar une année : « c’en est fait de toute la gloire de Kédar », et ses archers seront peu nombreux. Jérémie invite Juda à « envoyer quelqu’un à Kédar » pour voir si une nation a jamais changé de dieux, et prophétise « Sur Kédar et les royaumes de Hatsor, que battit Nebucadnetsar, roi de Babylone » : leurs tentes, leurs troupeaux, leurs pavillons et leurs chameaux pris. La Chronique babylonienne rapporte le raid de Nebucadnetsar contre les Arabes la sixième année, 599/8 av. J.-C. Le psalmiste se lamente : « Malheureux que je suis de séjourner à Méschec, d’habiter parmi les tentes de Kédar ! », et la vision d’Ésaïe de Sion restaurée rassemble à son autel les troupeaux de Kédar et les béliers de Nebajoth : « Les troupeaux de Kédar se réuniront tous chez toi »."
    - "Sous les Perses, Kédar atteignit la frontière de l’Égypte. Guéschem l’Arabe, qui se moqua du mur de Néhémie, est presque certainement le Gashmu nommé sur une coupe d’argent d’un sanctuaire de Tell el-Maskhuta dans le Delta oriental, dédiée à la fin du Ve siècle av. J.-C. par « Qaynu fils de Guéschem, roi de Qedar » à la déesse Han-Ilat. Pline énumère encore les Cedrei à côté des Nabatéens, qui absorbèrent les anciennes tribus dans leur royaume de Pétra. Le pays de Kédar est aujourd’hui le nord de l’Arabie saoudite autour de Dumat al-Jandal et le désert oriental de la Jordanie, où les tentes bédouines sont noires aujourd’hui encore."
  pl:
    - "Kedar było plemieniem lub związkiem plemion arabskich z północnej pustyni na wschód od Izraela. Księga Rodzaju czyni Kedara drugim synem Izmaela, po Nebajocie. Jego lud to koczownicy: oblubienica w Pieśni jest ciemna „jako namioty Kedarskie”, czarne namioty z koziej sierści; Izajasz mówi o wsiach, „w których mieszka Kedar”, i o ostatku jego łuczników, „pocztu strzelców mężnych synów Kedar”; Ezechiel wśród sprzedających Tyrowi jagnięta, barany i kozły, wymienia: „Arabczycy, i wszyscy książęta Kedarscy”. Asyryjskie zapisy z VIII i VII w. p.n.e. nazywają ich Qidri lub Qedar: Asarhaddon i Aszurbanipal mają do czynienia z Chazaelem, „królem Arabów”, i jego synem Jautą, których historycy zaliczają do władców Qedar; pryzmaty Aszurbanipala wymieniają Ammi-ladiego „króla ziemi Qedar” i jego pustynne wojny z nimi oraz zdobycie ich bogów. Ich ośrodek leżał ku Dumie (Adummatu, al-Dżauf)."
    - "Orędzie Izajasza o Arabii wyznacza Kedarowi rok: „ustanie wszystka sława Kedar”, a jego łuczników będzie niewielu. Jeremiasz każe Judzie „do Kedar poślijcie”, by zobaczyć, czy jakikolwiek naród zmienił kiedyś swoich bogów, i prorokuje: „Przeciwko Kiedar, i przeciwko królestwom Hasor, które wytracić ma Nabuchodonozor, król Babiloński”: ich namioty, trzody, opony i wielbłądy zostaną zabrane. Kronika babilońska zapisuje najazd Nabuchodonozora na Arabów w jego szóstym roku, 599/8 p.n.e. Psalmista skarży się: „Niestetyż mnie, żem tak długo gościem w Mesech, a mieszkam w namiotach Kedarskich”, a wizja Izajasza o odnowionym Syjonie gromadzi przy jego ołtarzu stada Kedaru i barany Nebajotu: „Wszystkie stada z Kedar zgromadzą się do ciebie”."
    - "Pod Persami Kedar sięgało granicy Egiptu. Geszem Arab, który szydził z muru Nehemiasza, to prawie na pewno Gaszmu wymieniony na srebrnej misie ze świątyni w Tell el-Maskhuta we wschodniej Delcie, złożonej pod koniec V w. p.n.e. przez „Kajnu, syna Geszema, króla Qedar” bogini Han-Ilat. Pliniusz nadal wymienia Cedrei obok Nabatejczyków, którzy wchłonęli dawne plemiona w swoje królestwo w Petrze. Ziemia Kedar to dziś północ Arabii Saudyjskiej wokół Dumat al-Dżandal i wschodnia pustynia Jordanii, gdzie beduińskie namioty są czarne do dziś."
  it:
    - "Kedar era una tribù araba, o una confederazione tribale, del deserto arabico settentrionale a est d’Israele. La Genesi fa di Kedar il secondo figlio di Ismaele, dopo Nebaiot. Il suo popolo era nomade: la sposa del Cantico è scura «come le tende di Chedar», tende nere di pelo di capra; Isaia cita «i villaggi occupati da Kedar» e i suoi arcieri, «i valorosi arcieri di Kedar»; Ezechiele elenca «L’Arabia e tutti i principi di Kedar» fra quelli che vendevano a Tiro agnelli, montoni e capri. Gli Assiri (VIII–VII secolo a.C.) li chiamano Qidri o Qedar: Assaraddon e Assurbanipal trattano con Cazaèl, «re degli Arabi», e con suo figlio Yauta, che gli storici ritengono sovrani di Qedar; i prismi di Assurbanipal nominano Ammi-ladi «re del paese di Qedar» e narrano le sue campagne nel deserto contro di loro e la presa dei loro dèi. Il centro era verso Duma (Adummatu, al-Jawf)."
    - "L’oracolo di Isaia sull’Arabia dà a Kedar un anno: «tutta la gloria di Kedar sarà venuta meno», e i suoi arcieri saranno pochi. Geremia ordina a Giuda: «Mandate a Kedar» per vedere se mai una nazione cambiò i suoi dèi, e profetizza: «Riguardo a Kedar e ai regni di Hatsor, che Nebucadnetsar, re di Babilonia, sconfisse»: le loro tende, i greggi, i padiglioni e i cammelli presi. La Cronaca babilonese registra l’incursione di Nabucodonosor contro gli Arabi nel suo sesto anno, 599/8 a.C. Il salmista si lamenta: «Misero me che soggiorno in Mesec, e dimoro fra le tende di Kedar!», e la visione di Isaia di Sion restaurata raduna al suo altare i greggi di Kedar e i montoni di Nebaiot: «Tutti i greggi di Kedar s’aduneranno presso di te»."
    - "Sotto i Persiani Kedar giunse al confine dell’Egitto. Geshem l’Arabo, che si fece beffe delle mura di Neemia, è quasi certamente il Gashmu nominato su una coppa d’argento da un santuario di Tell el-Maskhuta nel Delta orientale, dedicata nel tardo V secolo a.C. da «Qaynu figlio di Geshem, re di Qedar» alla dea Han-Ilat. Plinio elenca ancora i Cedrei accanto ai Nabatei, che assorbirono le antiche tribù nel loro regno a Petra. La terra di Kedar è oggi il nord dell’Arabia Saudita attorno a Dumat al-Jandal e il deserto orientale della Giordania, dove le tende beduine sono nere ancora oggi."
  nl:
    - "Kedar was een Arabische stam, of stammenbond, in de Noord-Arabische woestijn ten oosten van Israël. Genesis maakt Kedar de tweede zoon van Ismaël, na Nebajot. Het waren nomaden: de bruid in het Hooglied is donker “gelijk de tenten van Kedar”, zwarte geitenharen tenten; Jesaja spreekt van “de dorpen, die Kedar bewoont” en van zijn boogschutters, “de helden der Kedarenen”; Ezechiël noemt “Arabie en alle vorsten van Kedar” onder wie Tyrus lammeren, rammen en bokken leverden. Assyrische bronnen uit de 8e en 7e eeuw v.Chr. noemen hen Qidri of Qedar: Esarhaddon en Assurbanipal hebben met Hazaël te maken, “koning van de Arabieren”, en zijn zoon Yauta, door historici als heersers van Qedar gerekend; Assurbanipals prisma’s noemen Ammi-ladi “koning van het land Qedar” en melden zijn woestijnveldtochten en de buit van hun goden. Hun centrum lag bij Duma (Adummatu, al-Jawf)."
    - "Jesaja’s godsspraak over Arabië geeft Kedar een jaar: “zo zal de heerlijkheid van Kedar ten ondergaan”, en zijn boogschutters zullen weinig zijn. Jeremia gebiedt Juda: “zendt naar Kedar”, om te zien of ooit een volk zijn goden verwisselde, en profeteert: “Tegen Kedar, en tegen de koninkrijken van Hazor, die Nebukadrezar, de koning van Babel, sloeg”: hun tenten, kudden, gordijnen en kamelen genomen. De Babylonische Kroniek vermeldt Nebukadnessars strooptocht tegen de Arabieren in zijn zesde jaar, 599/8 v.Chr. De psalmist klaagt: “O, wee mij, dat ik een vreemdeling ben in Mesech, dat ik in de tenten Kedars wone”, en Jesaja’s visioen van het herstelde Sion verzamelt bij zijn altaar de kudden van Kedar en de rammen van Nebajot: “Al de schapen van Kedar zullen tot u verzameld worden”."
    - "Onder de Perzen reikte Kedar tot de grens van Egypte. Gesem de Arabier, die de muur van Nehemia bespotte, is vrijwel zeker de Gashmu die genoemd wordt op een zilveren schaal uit een heiligdom te Tell el-Maskhuta in de oostelijke Delta, aan het eind van de 5e eeuw v.Chr. gewijd door “Qaynu, zoon van Gesem, koning van Qedar” aan de godin Han-Ilat. Plinius noemt de Cedrei nog naast de Nabateeërs, die de oude stammen in hun koninkrijk te Petra opnamen. Het land van Kedar is nu het noorden van Saoedi-Arabië rond Dumat al-Jandal en de oostelijke woestijn van Jordanië, waar bedoeïenententen tot op de dag van vandaag zwart zijn."
  cs:
    - "Kedar byl arabský kmen nebo kmenová konfederace severoarabské pouště východně od Izraele. Genesis činí z Kedara druhého syna Jišmaelova, po Nebajótovi. Jeho lid byli nomádi: nevěsta Písně je tmavá „tak jako stanové Cedarští“, černé stany z kozí srsti; Izajáš mluví o „vsi, v nichž bydlí Cedar“ a o jeho lučištnících, „střelců udatných synů Cedar“; Ezechiel uvádí „Arabští i všecka knížata Cedarská“ mezi těmi, kdo prodávali Týru beránky, skopce a kozly. Asyrské záznamy 8. a 7. stol. př. n. l. je nazývají Qidri nebo Qedar: Asarhadón a Aššurbanipal jednají s Chazaelem, „králem Arabů“, a jeho synem Jautou, které historikové počítají za vládce Qedaru; Aššurbanipalovy hranoly jmenují Ammi-ladiho „král země Qedar“ a vyprávějí o jeho pouštních taženích proti nim a o zajetí jejich bohů. Jejich středisko leželo směrem k Dúmě (Adummatu, al-Džauf)."
    - "Izajášův výrok o Arábii dává Kedaru rok: „přestane všecka sláva Cedar“ a jeho lučištníků bude málo. Jeremjáš vybízí Judu, ať „i do Cedar pošlete“ zjistit, zda nějaký národ kdy změnil své bohy, a prorokuje „Proti Cedar a královstvím Azor, kteráž pohubiti má Nabuchodonozor král Babylonský“: jejich stany, stáda, opony a velbloudi budou vzati. Babylónská kronika zaznamenává Nebukadnesarovu výpravu proti Arabům v jeho šestém roce, 599/8 př. n. l. Žalmista naříká: „Běda mně, že pohostinu býti musím v Mešech, a přebývati v saláších Cedarských“, a Izajášovo vidění obnoveného Sijónu shromažďuje k jeho oltáři stáda Kedaru a skopce Nebajótu: „Všecka stáda Cedarská shromáždí se k tobě“."
    - "Za Peršanů dosahoval Kedar egyptské hranice. Gešem Arab, který se vysmíval Nehemjášově hradbě, je téměř jistě Gašmu jmenovaný na stříbrné misce ze svatyně v Tell el-Maskhuta ve východní deltě, zasvěcené koncem 5. stol. př. n. l. „Qaynu, synem Gešemovým, králem Qedaru“ bohyni Han-Ilat. Plinius ještě uvádí Cedrei vedle Nabatejců, kteří staré kmeny pojali do svého království v Petře. Země Kedar je dnes sever Saúdské Arábie kolem Dúmat al-Džandal a jordánská východní poušť, kde jsou beduínské stany černé dodnes."
  sv:
    - "Kedar var en arabisk stam, eller ett stamförbund, i den nordarabiska öknen öster om Israel. Första Moseboken gör Kedar till Ismaels andre son, efter Nevajot. Folket var nomader: bruden i Höga visan är mörk ”lik Kedars hyddor”, svarta tält av getragg; Jesaja talar om ”byar, där Kedar bor” och om dess bågskyttar, ”Kedars hjältars bågar”; Hesekiel räknar ”Kedars alla furstar” bland dem som sålde lamm, vädurar och bockar till Tyros. Assyriska källor från 700- och 600-talen f.Kr. kallar dem Qidri eller Qedar: Esarhaddon och Assurbanipal har att göra med Hasael, ”arabernas kung”, och hans son Yauta, som historiker räknar som härskare över Qedar; Assurbanipals prismor nämner Ammi-ladi ”kung av landet Qedar” och berättar om hans ökenfälttåg mot dem och om erövringen av deras gudar. Deras centrum låg mot Duma (Adummatu, al-Jawf)."
    - "Jesajas utsaga om Arabien ger Kedar ett år: inom det skall ”all Kedars härlighet vara förgången”, och dess bågskyttar blir få. Jeremia uppmanar Juda: ”sänden bud till Kedar” för att se om något folk någonsin har bytt sina gudar, och profeterar ”Om Kedar och Hasors riken, som blevo slagna av Nebukadressar, konungen i Babel”: deras tält, hjordar, förhängen och kameler skall tas. Den babyloniska krönikan upptecknar Nebukadnessars räd mot araberna i hans sjätte år, 599/8 f.Kr. Psalmisten klagar: ”Ve mig, att jag måste dväljas i Meseks land och bo ibland Kedars hyddor!”, och Jesajas syn av det återupprättade Sion samlar vid dess altare Kedars hjordar och Nevajots vädurar: ”Alla Kedars hjordar skola församlas till dig”."
    - "Under perserna nådde Kedar Egyptens gräns. Araben Geshem, som hånade Nehemjas mur, är nästan säkert den Gashmu som nämns på en silverskål från en helgedom vid Tell el-Maskhuta i östra Deltat, tillägnad sent på 400-talet f.Kr. av ”Qaynu, son till Geshem, kung av Qedar” åt gudinnan Han-Ilat. Plinius upptar ännu cedrei vid sidan av nabatéerna, som införlivade de gamla stammarna i sitt rike vid Petra. Kedars land är i dag norra Saudiarabien kring Dumat al-Jandal och Jordaniens östra öken, där beduinernas tält än i dag är svarta."
  nb:
    - "Kedar var en arabisk stamme, eller et stammeforbund, i den nordarabiske ørkenen øst for Israel. Første Mosebok gjør Kedar til Ismaels andre sønn, etter Nebajot. Folket var nomader: bruden i Høysangen er mørk «som Kedars telter», svarte telt av gjetehår; Jesaja taler om «de teltbyer hvor Kedar bor» og om dets bueskyttere, «Kedars helter»; Esekiel nevner «Arabia og alle Kedars fyrster» blant dem som solgte Tyros lam, værer og bukker. Assyriske opptegnelser fra 700- og 600-tallet f.Kr. kaller dem Qidri eller Qedar: Asarhaddon og Assurbanipal har med Hasael, «konge over araberne», og hans sønn Yauta å gjøre, som historikere regner som herskere over Qedar; Assurbanipals prismer nevner Ammi-ladi «konge av landet Qedar» og forteller om hans ørkenferder mot dem og om erobringen av gudene deres. Sentrum lå mot Duma (Adummatu, al-Jawf)."
    - "Jesajas utsagn mot Arabia gir Kedar ett år: «skal det være forbi med all Kedars herlighet», og bueskytterne blir få. Jeremia ber Juda «send bud til Kedar» for å se om noe folk noensinne har byttet bort sine guder, og profeterer «Om Kedar og om Hasors riker, som Babels konge Nebukadnesar slo»: deres telt, småfe, telttepper og kameler skal tas. Den babylonske krøniken forteller om Nebukadnesars tokt mot araberne i hans sjette år, 599/8 f.Kr. Salmisten klager: «Ve mig, at jeg lever som fremmed iblandt Mesek, at jeg bor ved Kedars telt!», og Jesajas syn om det gjenreiste Sion samler ved altaret flokkene fra Kedar og værene fra Nebajot: «Alle Kedars får skal samles til dig»."
    - "Under perserne nådde Kedar grensen til Egypt. Gesjem araberen, som hånte Nehemjas mur, er nesten sikkert den Gashmu som nevnes på en sølvskål fra en helligdom ved Tell el-Maskhuta i det østlige Deltaet, viet i slutten av 400-tallet f.Kr. av «Qaynu, sønn av Gesjem, konge av Qedar» til gudinnen Han-Ilat. Plinius oppfører fortsatt Cedrei ved siden av nabateerne, som tok opp de gamle stammene i sitt rike i Petra. Kedars land er i dag nord i Saudi-Arabia omkring Dumat al-Jandal og Jordans østlige ørken, der beduinenes telt er svarte den dag i dag."
  tl:
    - "Tribong Arabe ang Kedar, o samahang tribal, sa disyerto ng hilagang Arabia, silangan ng Israel; sa Genesis, ikalawang anak ni Ismael pagkatapos ni Nabaioth. Nomada: maitim ang nobya sa Awit ng mga Awit “gaya ng mga tolda sa Cedar”, itim na tolda ng balahibong kambing; sa Isaias, “mga nayon na tinatahanan ng Cedar” at mga mamamana, “mga makapangyarihang lalake na mga anak ni Cedar”; sa Ezekiel, “Arabia, at lahat na prinsipe sa Cedar” ang nagbenta sa Tiro ng kordero, tupa at kambing. Qidri o Qedar sila sa talaang Asirio (ika-8–7 siglo BK): nakitungo sina Esar-hadon at Ashurbanipal kay Hazael, “hari ng mga Arabe”, at sa anak na si Yauta, na ibinibilang ng mga mananalaysay na mga pinuno ng Qedar; sa prisma ni Ashurbanipal, si Ammi-ladi ay “hari ng lupain ng Qedar” at kinuwento ang kampanya laban sa kanila at pagkuha sa mga diyos nila. Sentro nila ang paligid ng Duma (Adummatu, al-Jawf)."
    - "Binibigyan ng orakulo ni Isaias tungkol sa Arabia ang Kedar ng isang taon: “ang lahat ng kaluwalhatian ng Cedar ay mapapawi”, at kakaunti na ang mga mamamana nito. Inuutusan ni Jeremias ang Juda na “mangagsugo sa Cedar” upang tingnan kung may bansang nagpalit ng mga diyos nito, at nanghuhula: “Tungkol sa Cedar, at sa mga kaharian ng Hasor na sinaktan ni Nabucodonosor na hari sa Babilonia”: kukunin ang kanilang mga tolda, kawan, tabing at kamelyo. Itinatala ng Kronikang Babilonyo ang pagsalakay ni Nabucodonosor sa mga Arabe sa ikaanim na taon niya, 599/8 BK. Dumaraing ang mang-aawit, “Sa aba ko, na nakikipamayan sa Mesech, na tumatahan ako sa mga tolda sa Kedar!”, at ang pangitain ni Isaias tungkol sa naibalik na Sion ay nagtitipon sa dambana nito ng mga kawan ng Kedar at mga tupa ng Nabaioth: “Lahat ng kawan sa Cedar ay mapipisan sa iyo”."
    - "Sa ilalim ng mga Persiano ay umabot ang Kedar sa hangganan ng Egipto. Si Gesem na Arabe, na tumuya sa pader ni Nehemias, ay halos tiyak na ang Gashmu na pinangalanan sa isang pilak na mangkok mula sa isang dambana sa Tell el-Maskhuta sa silangang Delta, na inialay noong huling bahagi ng ika-5 siglo BK ni “Qaynu na anak ni Gesem, hari ng Qedar” sa diyosang si Han-Ilat. Itinatala pa ni Plinio ang mga Cedrei sa tabi ng mga Nabateo, na sumipsip sa mga lumang tribo sa ilalim ng kaharian nila sa Petra. Ang lupain ng Kedar ay ngayon ang hilaga ng Saudi Arabia sa palibot ng Dumat al-Jandal at ang silangang disyerto ng Jordan, kung saan itim pa rin ang mga tolda ng mga Bedouin."
  da:
    - "Kedar var en arabisk stamme eller stammeforbund i den nordarabiske ørken øst for Israel. Første Mosebog gør Kedar til Ismaels næstældste søn efter Nebajot. Dets folk var nomader: bruden i Højsangen er sort »som Kedars Pauluner«, sorte telte af gedehår; Esajas taler om »de Byer, hvor Kedar bor« og om dets bueskytter, »de vældige af Kedars Børn«; Ezekiel opregner »Arabien og alle Kedars Fyrster« blandt dem, der solgte Tyrus lam, vædre og bukke. Assyriske optegnelser fra 700- og 600-tallet f.Kr. kalder dem Qidri eller Qedar: Esarhaddon og Assurbanipal har med Hazael, »kongen af araberne«, og hans søn Yauta at gøre, som historikere regner for herskere over Qedar; Assurbanipals prismer nævner Ammi-ladi, »kongen af landet Qedar«, og beretter om hans ørkenfelttog mod dem og erobringen af deres guder. Deres centrum lå mod Duma (Adummatu, al-Jawf)."
    - "Esajas' udsagn om Arabien giver Kedar et år: »da skal al Kedars Herlighed faa Ende«, og dets bueskytter bliver få. Jeremias byder Juda: »sender Bud til Kedar«, for at se, om noget folk nogensinde har skiftet sine guder, og profeterer »Imod Kedar og Hazors Riger, hvilke Nebukadnezar, Kongen af Babel, slog«: deres telte, hjorde, tæpper og kameler tages. Den babyloniske krønike optegner Nebukadnezars togt mod araberne i hans sjette år, 599/8 f.Kr. Salmisten klager: »Ve mig! thi jeg har været som fremmed iblandt Mesek, jeg har boet ved Kedars Telte«, og Esajas' syn af det genoprettede Zion samler ved dets alter Kedars hjorde og Nebajots vædre: »Alle Kedars Faar skulle samles til dig«."
    - "Under perserne nåede Kedar Egyptens grænse. Gesjem araberen, som hånede Nehemias' mur, er næsten med sikkerhed den Gashmu, der er nævnt på en sølvskål fra en helligdom i Tell el-Maskhuta i det østlige Delta, helliget i det sene 400-tal f.Kr. af »Qaynu, Gesjems søn, konge af Qedar« til gudinden Han-Ilat. Plinius opregner stadig Cedrei ved siden af nabatæerne, som optog de gamle stammer under deres kongedømme ved Petra. Kedars land er i dag det nordlige Saudi-Arabien omkring Dumat al-Jandal og Jordans østlige ørken, hvor beduinernes telte endnu er sorte."
  sr:
    - "Кидар је било арапско племе, или племенски савез, северноарапске пустиње источно од Израиља. Књига Постања чини Кидара другим сином Исмаиловим, после Навајота. Његови људи били су номади: невеста у Песми над песмама тамна је „као шатори кидарски“, црни шатори од козје длаке; Исаија помиње „села где станује Кидар“ и његове стрелце, јунаке; Језекиљ наводи да су „Арапи и сви кнезови кидарски“ с Тиром трговали јагањцима, овновима и јарцима. Асирски записи из VIII и VII века п. н. е. зову их Кидри или Кедар: Есарадон и Асурбанипал баве се Азаилом, „царем Арапа“, и његовим сином Јаутом, које историчари убрајају у владаре Кедара; Асурбанипалове призме именују Ами-ладија „цара земље Кедар“ и приповедају о његовим пустињским походима против њих и о заробљавању њихових богова. Њихово средиште лежало је према Думи (Адумату, ел-Џауф)."
    - "Исаијино пророштво о Арабији одређује Кидару рок од године дана: „нестаће све славе кидарске“, а стрелаца ће бити мало: „И што остане храбрих стрелаца синова кидарских, биће мало“. Јеремија позива Јуду: „пошљите у Кидар“ да види је ли иједан народ променио своје богове, и прориче: „За Кидар и за царства асорска, која разби Навуходоносор цар вавилонски“: њихови шатори, стада, завесе и камиле биће узети. Вавилонска хроника бележи Навуходоносоров напад на Арапе у шестој години, 599/8. п. н. е. Псалмиста јадикује: „Тешко мени кад сам туђин код Месеха, живим код шатора кидарских“, а Исаијина визија обновљеног Сиона сабира на његов жртвеник стада Кидара и овнове Навајота: „Сва стада кидарска скупиће се к теби“."
    - "Под Персијанцима Кидар је допирао до границе Египта. Гисем Арапин, који се ругао Немијином зиду, готово сигурно је Гасмуј наведен на сребрној здели из светилишта у Тел ел-Маскути у источној делти, коју је крајем V века п. н. е. посветио „Кајну, син Гисемов, цар Кедара“ богињи Хан-Илат. Плиније још наводи Кедреје поред Набатејаца, који су стара племена упили у своје краљевство у Петри. Земља Кидара је данас север Саудијске Арабије око Думат ел-Џандала и источна пустиња Јордана, где су бедуински шатори и данас црни."
  hu:
    - "Kédár arab törzs vagy törzsszövetség volt Izráeltől keletre, Észak-Arábia sivatagában. A Teremtés könyve Kédárt Izmael második fiává teszi Nebajót után. Népe nomád volt: az Énekek éneke menyasszonya sötét, „mint Kédár sátrai”, a fekete kecskeszőrsátrak; Ézsaiás szól „a faluk, a melyekben Kédár lakik” és íjászairól: „Kédár vitéz fiainak kézíve számának maradéka megkevesedik”; Ezékiel „Arábia és Kédár fejedelmei” közt említi a Tíruszba bárányt, kost és bakot szállítókat. Kr. e. 8–7. századi asszír feljegyzések Qidrinek vagy Qedarnak nevezik őket: Asszarhaddon és Assurbanipal Házaellel, „az arabok királyával” és fiával, Yautával áll érintkezésben, akiket Qedar uralkodóinak tartanak; Assurbanipal hasábjai Ammi-ladit „Qedar földje királyának” nevezik, és elbeszélik sivatagi hadjáratait ellenük és isteneik elfoglalását. Központjuk Dúma (Adummatu, al-Jawf) felé esett."
    - "Ézsaiás Arábia elleni jövendölése évet szab Kédárnak: „elvész Kédárnak minden dicsősége”, íjászai pedig kevesen lesznek. Jeremiás azt kéri Júdától, hogy „küldjetek Kédárba is”, és lássák meg, cserélt-e valaha nemzet isteneket, és megjövendöli „Kédárnak és Házornak országai felől, a melyeket megvert Nabukodonozor, a babiloni király” sorsát: sátraikat, nyájaikat, kárpitjaikat és tevéiket elviszik. A babiloni krónika feljegyzi Nabukodonozor arabok elleni portyáját hatodik évében, Kr. e. 599/598-ban. A zsoltáros így panaszkodik: „Jaj nékem, hogy Mésekben bujdosom és a Kédár sátrai közt lakom!”, Ézsaiás helyreállított Sionról szóló látomása pedig oltárához gyűjti Kédár nyájait és Nebajót kosait: „Kédár minden juhai hozzád gyűlnek”."
    - "A perzsák alatt Kédár Egyiptom határáig ért. Az arab Gesem, aki Nehémiás falát kigúnyolta, majdnem biztosan azonos Gashmuval, akit egy ezüsttálon említenek, amely a keleti deltában fekvő Tell el-Maskhuta egyik szentélyéből került elő, és amelyet a Kr. e. 5. század végén „Qaynu, Gesem fia, Qedar királya” ajánlott fel Han-Ilat istennőnek. Plinius még felsorolja a kedreusokat a nabateusok mellett, akik a régi törzseket a petrai királyságukba olvasztották. Kédár földje ma Szaúd-Arábia északi része Dumat al-Jandal körül és Jordánia keleti sivataga, ahol a beduin sátrak ma is feketék."
  fi:
    - "Kedar oli arabiheimo tai heimoliitto Pohjois-Arabian autiomaassa Israelin itäpuolella. 1. Moos. mainitsee Kedarin Ismaelin toisena poikana Nebajotin jälkeen. Paimentolaisia: Laulujen laulun morsian on tumma ”kuin Keedarin teltat”, mustat vuohenkarvateltat; Jesaja puhuu: ”kylät, joissa Keedar asuu” ja sen jousimiehet: ”Keedarin urhojen jousiluvun jäännös”; Hesekielin mukaan ”Arabia ja kaikki Keedarin ruhtinaat” kauppasivat Tyrokselle lampaita, oinaita ja vuohia. 700- ja 600-luvun eaa. assyrialaisissa asiakirjoissa he ovat Qidri tai Qedar: Esarhaddon ja Assurbanipal kohtaavat Hasaelin, ”arabien kuninkaan”, ja hänen poikaansa Yautaa, joita pidetään Qedarin hallitsijoina; Assurbanipalin prismoissa Ammi-ladi on ”Qedarin maan kuningas”, kertovat hänen autiomaaretkistään heitä vastaan ja heidän jumaliensa vangitsemisesta. Keskus oli Duman (Adummatu, al-Jawf) suunnalla."
    - "Jesajan Arabiaa koskeva ennustus antaa Kedarille määräajan, vuoden: ”kaikki Keedarin kunnia on kadonnut”, ja sen jousimiehiä on jäljellä vähän. Jeremia kehottaa Juudaa: ”lähettäkää Keedariin” katsomaan, onko mikään kansa koskaan vaihtanut jumaliaan, ja ennustaa: ”Keedaria ja Haasorin valtakuntia vastaan, jotka Nebukadressar, Baabelin kuningas, voitti”; heidän telttansa, laumansa, verhonsa ja kamelinsa viedään. Babylonian kronikka kertoo Nebukadnessarin hyökkäyksestä arabeja vastaan hänen kuudentena vuotenaan, 599/8 eaa. Psalmista valittaa: ”Voi minua, että minun täytyy oleskella muukalaisena Mesekissä, asua Keedarin majojen keskellä!”, ja Jesajan näky ennallistetusta Siionista kokoaa sen alttarille Kedarin lampaat ja Nebajotin oinaat: ”Kaikki Keedarin laumat kokoontuvat sinun tykösi”."
    - "Persian aikana Kedar ulottui Egyptin rajalle. Arabialainen Gesem, joka pilkkasi Nehemian muuria, on lähes varmasti se Gashmu, joka mainitaan hopeamaljakossa Tell el-Maskhutan pyhäköstä Niilin suiston itäosassa; sen omisti 400-luvun lopulla eaa. ”Qaynu, Gesemin poika, Qedarin kuningas” jumalatar Han-Ilatille. Plinius luettelee yhä Cedreit nabatealaisten rinnalla, ja nämä sulauttivat vanhat heimot Petran kuningaskuntaansa. Kedarin maa on nykyään Saudi-Arabian pohjoisosa Dumat al-Jandalin ympärillä sekä Jordanian itäinen autiomaa, missä beduiinien teltat ovat mustia vielä tänäkin päivänä."
  vi:
    - "Kê-đa là một bộ tộc Ả Rập, hay một liên minh bộ tộc, ở sa mạc bắc Ả Rập ở phía đông Y-sơ-ra-ên. Sáng thế ký coi Kê-đa là con trai thứ hai của Ích-ma-ên, sau Nê-ba-giốt. Họ sống du mục: cô dâu trong Nhã ca đen “như các trại Kê-đa”, trại đen bằng lông dê; Ê-sai nói đến “các làng Kê-đa ở” và cung thủ của họ, “những kẻ cầm cung mạnh mẽ, là con cái của Kê-đa”; Ê-xê-chi-ên kể “Người A-rạp và mọi quan trưởng ở Kê-đa” trong số những người bán cho Ty-rơ chiên con, chiên đực và dê đực. Các ghi chép A-si-ri của thế kỷ 8 và 7 TCN gọi họ là Qidri hay Qedar: Ê-sạt-ha-đôn và Ashurbanipal giao thiệp với Hazael, “vua của người Ả Rập”, và con ông là Yauta, được coi là các vua Qedar; các lăng trụ của Ashurbanipal nêu Ammi-ladi “vua xứ Qedar” và thuật các chiến dịch sa mạc của ông chống họ cùng việc bắt thần của họ. Trung tâm của họ gần Đu-ma (Adummatu, al-Jawf)."
    - "Lời sấm của Ê-sai về A-ra-bi định cho Kê-đa một thời hạn: “Trong một năm nữa, kể như năm kẻ ở mướn, cả sự vinh hiển của Kê-đa sẽ hao mòn”, và các cung thủ của họ sẽ sót lại chẳng bao lăm. Giê-rê-mi bảo Giu-đa “Hãy khiến người đến Kê-đa, và xét kỹ” xem có dân nào từng đổi thần mình không, và nói tiên tri: “Về Kê-đa và các nước ở Hát-so mà Nê-bu-cát-nết-sa vua Ba-by-lôn đã đánh”: các trại, bầy vật, màn và lạc đà của họ bị cướp. Biên niên sử Ba-by-lôn ghi việc Nê-bu-cát-nết-sa đột kích người Ả Rập vào năm thứ sáu của ông, 599/8 TCN. Tác giả Thi thiên than: “Khốn nạn cho tôi vì tôi ngụ trong Mê-siếc, Và ở dưới các trại Kê-đa”, và khải tượng của Ê-sai về Si-ôn được phục hồi thì tập hợp về bàn thờ của nó bầy chiên của Kê-đa và chiên đực của Nê-ba-giốt: “Hết thảy bầy súc vật của Kê-đa sẽ nhóm lại nơi ngươi”."
    - "Dưới thời Ba Tư, Kê-đa đến tận biên giới Ai Cập. Ghê-sem người A-rạp, kẻ đã nhạo báng tường thành của Nê-hê-mi, gần như chắc chắn là Gashmu có tên trên một cái bát bạc từ đền thờ ở Tell el-Maskhuta thuộc miền đông châu thổ sông Nin, được dâng vào cuối thế kỷ 5 TCN bởi “Qaynu con của Geshem, vua Qedar” cho nữ thần Han-Ilat. Pliny vẫn kể người Cedrei bên cạnh người Nabataea, những người đã thu nạp các bộ tộc cũ vào vương quốc của mình tại Petra. Xứ Kê-đa ngày nay là miền bắc Ả Rập Xê Út quanh Dumat al-Jandal và sa mạc phía đông Gióc-đa-ni, nơi các trại của người Bedouin vẫn đen cho đến ngày nay."
  ro:
    - "Chedar era un trib arab (sau confederație tribală) din nordul deșertului arab, la est de Israel; Facerea îl numește al doilea fiu al lui Ismael, după Nebaiot. Erau nomazi: mireasa din Cântarea Cântărilor e neagră „ca sălașele lui Chidar”, corturi negre de păr de capră; Isaia pomenește „sălașurile și cei ce lăcuesc în Chidar” și pe arcașii lui, vitejii fiilor lui Chedar; Ezechiel înșiră „Aravia și toți boierii Chidarului” printre cei ce vindeau Tirului miei, berbeci și țapi. Textele asiriene din secolele al VIII-lea și al VII-lea î.Hr. îi numesc Qidri sau Qedar: Esar-Hadon și Asurbanipal tratează cu Hazael, „regele arabilor”, și cu fiul său Yauta, socotiți de istorici conducători ai Qedarului; prismele lui Asurbanipal îl numesc pe Ammi-ladi „regele țării Qedar” și povestesc campaniile sale în deșert împotriva lor și capturarea zeilor lor. Centrul lor se afla spre Duma (Adummatu, al-Jawf)."
    - "Oracolul lui Isaia despre Arabia dă lui Chedar un termen: într-un an toată slava lui Chedar se va stinge, iar arcașii lui vor fi puțini. Ieremia îi cere lui Iuda: „în Chidar trimiteți”, ca să vadă dacă vreun neam și-a schimbat vreodată zeii, și prorocește despre Chedar și despre regatele Hațorului, pe care le va lovi Nebucadnețar, regele Babilonului: corturile, turmele, cortinele și cămilele lor vor fi luate. Cronica babiloniană consemnează expediția lui Nebucadnețar împotriva arabilor în al șaselea an al său, 599/8 î.Hr. Psalmistul se tânguiește că locuiește în Meșec și sălășluiește în corturile lui Chedar, iar viziunea lui Isaia despre Sionul restaurat adună la jertfelnicul lui turmele lui Chedar și berbecii lui Nebaiot: „toate oile Chidarului se vor adunà la tine”."
    - "Sub perși, Chedar ajungea până la hotarul Egiptului. Gheșem arabul, care a batjocorit zidul lui Neemia, este aproape sigur Gashmu, numit pe un vas de argint dintr-un sanctuar de la Tell el-Maskhuta, în estul Deltei, închinat zeiței Han-Ilat, la sfârșitul secolului al V-lea î.Hr., de „Qaynu fiul lui Gheșem, regele Qedarului”. Pliniu îi mai pomenește pe Cedrei alături de nabateeni, care au absorbit vechile triburi în regatul lor de la Petra. Țara Chedar este astăzi nordul Arabiei Saudite din jurul Dumat al-Jandal și deșertul estic al Iordaniei, unde corturile beduinilor sunt negre până în ziua de azi."
  bg:
    - "Кидар е било арабско племе или племенен съюз в северноарабската пустиня на изток от Израил. Битие прави Кидар втори син на Исмаил, след Наваиот. Народът му бил номадски: невестата от Песен на песните е черна „като кидарските шатри“ — черни шатри от козина; Исаия говори за „селата в които живее Кидар“ и за неговите стрелци, „крепките Кидарски синове“; Йезекиил изброява „Аравия и всичките Кидарски началници“ сред онези, които продавали на Тир агнета, овни и ярци. Асирийските надписи от VIII и VII в. пр.н.е. ги наричат Кидри или Кедар: Асардан и Ашурбанипал имат работа с Азаил, „цар на арабите“, и сина му Яута, които историците причисляват към владетелите на Кедар; призмите на Ашурбанипал назовават Ами-лади „цар на земята Кедар“ и разказват за походите му срещу тях в пустинята и за пленяването на боговете им. Центърът им бил към Дума (Адумату, ал-Джауф)."
    - "Пророчеството на Исаия за Аравия дава на Кидар една година: „Ще изчезне всичката слава на Кидар“, а стрелците му ще бъдат малко. Йеремия призовава Юда: „проводете в Кидар“, за да се види дали някой народ някога е сменял боговете си, и пророкува „За Кидар и за Асорските царства които порази Навуходоносор Вавилонският цар“: шатрите, стадата, завесите и камилите им ще бъдат взети. Вавилонската хроника отбелязва набега на Навуходоносор срещу арабите в шестата му година, 599/8 г. пр.н.е. Псалмистът се оплаква: „Уви мене, защото странствувам в Мосох, Живея в Кидарските шатри“, а видението на Исаия за възстановения Сион събира при олтара му стадата на Кидар и овните на Наваиот: „Всичките Кидарски стада ще се съберат при тебе“."
    - "При персите Кидар достига границата на Египет. Гешем арабинът, който се подиграва на стената на Неемия, почти сигурно е Гашму, назован върху сребърна купа от светилище в Тел ел-Масхута в източната делта, посветена в края на V в. пр.н.е. от „Кайну, син на Гешем, цар на Кедар“ на богинята Хан-Илат. Плиний още изброява кедреите редом с набатейците, които погълнали старите племена в своето царство с център Петра. Земята на Кидар днес е северът на Саудитска Арабия около Думат ал-Джандал и източната пустиня на Йордания, където бедуинските шатри и до днес са черни."
