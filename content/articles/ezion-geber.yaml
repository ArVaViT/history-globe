body:
  en:
    - "Ezion-geber was Israel's port on the Red Sea, “beside Eloth, on the shore of the Red sea, in the land of Edom”, at the head of the Gulf of Aqaba. The wanderers camped there on the way from Sinai to Kadesh, and later passed “from Elath, and from Ezion-gaber” on the road round Edom to Moab. Here Solomon “made a navy of ships”, Hiram of Tyre sent “shipmen that had knowledge of the sea”, and the fleet brought gold from Ophir, 420 talents by Kings and 450 by Chronicles. A century later Jehoshaphat “made ships of Tharshish to go to Ophir for gold: but they went not; for the ships were broken at Ezion-geber”; Chronicles makes Ahaziah of Israel his partner in the venture. After that only Elath is named: Azariah built it and restored it to Judah, and in the days of Ahaz Rezin of Syria drove the Jews out, and the Syrians, or by a common reading the Edomites, settled there."
    - "Where the port lay is disputed, and the map shows three candidates. Nelson Glueck, digging Tell el-Kheleifeh on the shore between Aqaba and Eilat in 1938–1940, announced it as Ezion-geber and its mud-brick building as Solomon's copper refinery; the refinery was later given up, by Glueck himself among others, and a restudy of his finds by Gary Pratico dated the fortified settlement to the eighth century BC and after, with nothing certainly of Solomon's time, so the mound may rather be Elath. Beno Rothenberg and Alexander Flinder pointed instead to Jezirat Faraun, Pharaoh's Island, a small isle some 14 km south-west of Eilat off the Sinai coast with a sheltered anchorage and traces of harbour works, though its visible walls are medieval. Others think Ezion-geber and Elath were one place, or that the name moved."
    - "The head of the gulf is shared today by Eilat in Israel, Aqaba in Jordan, Taba in Egypt and the Saudi shore beyond. The copper mines of Timna, 25 km north, worked in the Egyptian period and again, as radiocarbon dates have shown, in the tenth century BC, lie on the road the gold ships would have served; Pharaoh's Island, with its Ayyubid fort, is a tourist site."
  ru:
    - "Ецион-Гавер был портом Израиля на Чермном море, «при Елафе, на берегу Чермного моря, в земле Идумейской», у вершины залива Акаба. Странники стояли там станом на пути от Синая к Кадесу, а позже прошли «от Елафа и Ецион-Гавера» дорогой в обход Едома к Моаву. Здесь Соломон «сделал корабль», Хирам Тирский прислал «корабельщиков, знающих море», и флот привёз золото из Офира — 420 талантов по книге Царств и 450 по Паралипоменон. Столетием позже Иосафат «сделал корабли на море, чтобы ходить в Офир за золотом; но они не дошли, ибо разбились в Ецион-Гавере»; по Паралипоменон, его товарищем в этом деле был Охозия Израильский. После этого упоминается только Елаф: Азария обстроил его и возвратил Иуде, а во дни Ахаза Рецин Сирийский изгнал оттуда Иудеев, и в Елаф вступили Идумеяне."
    - "Где лежал порт, спорно, и на карте показаны три кандидата. Нельсон Глюк, раскапывая в 1938–1940 годах Телль-эль-Хелейфе на берегу между Акабой и Эйлатом, объявил его Ецион-Гавером, а его здание из сырцового кирпича — медеплавильней Соломона; от медеплавильни потом отказались, в том числе и сам Глюк, а пересмотр его находок Гэри Пратико отнёс укреплённое поселение к VIII веку до н. э. и позднее, без чего-либо, уверенно относящегося ко времени Соломона, так что холм скорее может быть Елафом. Бено Ротенберг и Александр Флиндер указали вместо него на Джазират-Фараун, Фараонов остров, островок примерно в 14 км к юго-западу от Эйлата у синайского берега с укрытой стоянкой и следами портовых сооружений, хотя видимые стены там средневековые. Другие думают, что Ецион-Гавер и Елаф были одним местом или что имя переходило."
    - "Вершину залива сегодня делят Эйлат в Израиле, Акаба в Иордании, Таба в Египте и саудовский берег дальше. Медные рудники Тимны в 25 км к северу, работавшие в египетскую эпоху и снова, как показали радиоуглеродные даты, в X веке до н. э., лежат на дороге, которой служили бы корабли с золотом; Фараонов остров с айюбидской крепостью — туристическое место."
  uk:
    - "Еціон-Гевер був портом Ізраїлю на Червоному морі, «коло Елота, на березї Червоного моря в Едом-землї», у вершині Акабської затоки. Мандрівники отаборилися там по дорозі від Синаю до Кадеша і пізніше проходили «від Елата і від Езйон-Гебер» дорогою довкола Едому до Моаву. Тут Соломон збудував кораблі, Хірам Тирський прислав «підданих мореходів, що з морем обізнані були», і флот привіз золото з Офіру — 420 талантів за Книгою Царів і 450 за Хроніками. Століттям пізніше Йосафат побудував кораблі, щоб плисти в Офір по золото, але вони не пішли, бо кораблі розбилися в Еціон-Гевері; Хроніки роблять Охозію Ізраїльського його спільником у цьому підприємстві. Після цього називають лише Елат: Азарія відбудував його й повернув Юді, а за днів Ахаза Рецін Сирійський вигнав юдеїв, і сирійці, або за поширеним прочитанням едоміти, оселилися там."
    - "Де лежав порт, є спірним, і мапа показує трьох кандидатів. Нельсон Глюк, розкопуючи Телль-ель-Хелейфе на березі між Акабою та Ейлатом у 1938–1940 рр., оголосив його Еціон-Гевером, а його цегляну споруду — мідеплавильнею Соломона; плавильню пізніше відкинули, серед інших і сам Глюк, а повторне дослідження його знахідок Гері Пратіко датувало укріплене поселення VIII ст. до н. е. і пізнішим, без нічого певно з часів Соломона, тож горб, можливо, радше Елат. Бено Ротенберг і Александр Фліндер вказали натомість на Джезірат-Фараун, острів Фараона, невеликий острівець приблизно за 14 км на південний захід від Ейлата біля синайського берега, із захищеною якірною стоянкою та слідами гаванних споруд, хоча його видимі мури середньовічні. Інші думають, що Еціон-Гевер і Елат були одним місцем, або що назва переміщувалась."
    - "Вершину затоки сьогодні ділять Ейлат в Ізраїлі, Акаба в Йорданії, Таба в Єгипті та саудівський берег за ними. Мідні копальні Тімни, за 25 км на північ, що працювали в єгипетську добу й знову, як показали радіовуглецеві дати, в X ст. до н. е., лежать на дорозі, яку обслуговували б золоті кораблі; острів Фараона з аюбідським фортом — туристичне місце."
  es:
    - "Ezión-geber era el puerto de Israel en el mar Rojo, «junto á Elath en la ribera del mar Bermejo, en la tierra de Edom», en la cabecera del golfo de Áqaba. Los peregrinos del desierto acamparon allí en el camino del Sinaí a Cades, y más tarde pasaron «de Elath y de Esiongeber» en el camino que rodeaba Edom hacia Moab. Aquí Salomón hizo navíos, Hiram de Tiro envió «marineros y diestros en la mar», y la flota trajo oro de Ofir, 420 talentos según Reyes y 450 según Crónicas. Un siglo después, «Había Josaphat hecho navíos en Tharsis, los cuales habían de ir á Ophir por oro; mas no fueron, porque se rompieron en Ezion-geber»; Crónicas hace de Ocozías de Israel su socio en la empresa. Después solo se nombra Elat: Azarías la edificó y la restituyó a Judá, y en tiempos de Acaz Rezín de Siria expulsó a los judíos, y los sirios, o según una lectura común los edomitas, se establecieron allí."
    - "Dónde estaba el puerto se debate; el mapa muestra tres candidatos. Nelson Glueck, al excavar Tell el-Kheleifeh, en la orilla entre Áqaba y Eilat, en 1938–1940, lo dio a conocer como Ezión-geber y su edificio de adobe como la refinería de cobre de Salomón; la refinería fue abandonada después, por el propio Glueck entre otros, y un nuevo estudio de sus hallazgos por Gary Pratico fechó el asentamiento fortificado en el siglo VIII a. C. y posteriores, sin nada seguro de la época de Salomón, así que el montículo podría ser Elat. Beno Rothenberg y Alexander Flinder señalaron Jezirat Faraun, la isla del Faraón, un islote a unos 14 km al sudoeste de Eilat, frente al Sinaí, con fondeadero abrigado y huellas de obras portuarias, aunque sus muros visibles son medievales. Otros piensan que Ezión-geber y Elat fueron un solo lugar, o que el nombre se trasladó."
    - "La cabecera del golfo la comparten hoy Eilat, en Israel, Áqaba, en Jordania, Taba, en Egipto, y la costa saudí más allá. Las minas de cobre de Timna, a 25 km al norte, explotadas en el periodo egipcio y de nuevo, como han mostrado las dataciones radiocarbónicas, en el siglo X a. C., se hallan en el camino al que habrían servido las naves del oro; la isla del Faraón, con su fuerte ayubí, es un sitio turístico."
  pt:
    - "Eziom-Geber era o porto de Israel no Mar Vermelho, “perto de Elate, na margem do mar Vermelho, na terra de Edom”, na cabeceira do Golfo de Aqaba. Os errantes acamparam ali no caminho do Sinai a Cades, e depois passaram “de Elate e de Eziom-Geber” na estrada que contorna Edom até Moabe. Aqui Salomão “fez uma frota de navios”, Hirão de Tiro enviou “marinheiros que tinham conhecimento do mar”, e a frota trouxe ouro de Ofir, 420 talentos segundo Reis e 450 segundo as Crônicas. Depois, Josafá “construiu navios de Társis para irem a Ofir em busca de ouro, mas eles não foram, pois os navios naufragaram em Eziom-Geber”; as Crônicas fazem de Acazias de Israel seu sócio na empresa. Depois só Elate é nomeada: Azarias a construiu e a restaurou a Judá, e nos dias de Acaz Rezim da Síria expulsou os judeus, e os sírios, ou, numa leitura comum, os edomitas, se fixaram ali."
    - "Onde ficava o porto é disputado, e o mapa mostra três candidatos. Nelson Glueck, escavando Tell el-Kheleifeh, na margem entre Aqaba e Eilat, em 1938–1940, proclamou-o Eziom-Geber e seu edifício de tijolos de barro a refinaria de cobre de Salomão; a refinaria foi depois abandonada, pelo próprio Glueck entre outros, e um reestudo de seus achados por Gary Pratico datou o povoado fortificado do século VIII a.C. em diante, sem nada certamente do tempo de Salomão, de modo que o monte pode ser antes Elate. Beno Rothenberg e Alexander Flinder apontaram, em vez disso, Jezirat Faraun, a Ilha do Faraó, uma pequena ilha a cerca de 14 km a sudoeste de Eilat, na costa do Sinai, com ancoradouro abrigado e vestígios de obras portuárias, embora seus muros visíveis sejam medievais. Outros pensam que Eziom-Geber e Elate eram um só lugar, ou que o nome se deslocou."
    - "A cabeceira do golfo é hoje partilhada por Eilat, em Israel, Aqaba, na Jordânia, Taba, no Egito, e a costa saudita além. As minas de cobre de Timna, 25 km ao norte, exploradas no período egípcio e de novo, como mostraram as datações por radiocarbono, no século X a.C., ficam na estrada que os navios do ouro teriam servido; a Ilha do Faraó, com seu forte aiúbida, é um local turístico."
  de:
    - "Ezjon-Geber war Israels Hafen am Roten Meer, „das bei Eloth liegt am Ufer des Schilfmeers im Lande der Edomiter“, am Kopf des Golfs von Akaba. Die Wanderer lagerten zwischen Sinai und Kadesch und zogen später „auf dem Wege des Gefildes von Elath und Ezeon-Geber“ um Edom nach Moab. Hier baute Salomo seine Flotte (Knechte Hirams, „die gute Schiffsleute und auf dem Meer erfahren waren“), die Gold aus Ofir holte, 420 Talente nach den Königen, 450 nach der Chronik. Ein Jahrhundert später: „Und Josaphat hatte Schiffe lassen machen aufs Meer, die nach Ophir gehen sollten, Gold zu holen. Aber sie gingen nicht; denn sie wurden zerbrochen zu Ezeon-Geber“; laut Chronik mit Ahasja von Israel als Partner. Danach erscheint nur Elat: Asarja baute es und gab es Juda zurück; unter Ahas vertrieb Rezin von Syrien die Juden, und Syrer (nach verbreiteter Lesart Edomiter) siedelten dort."
    - "Wo der Hafen lag, ist umstritten; die Karte zeigt drei Kandidaten. Nelson Glueck, der 1938–1940 Tell el-Kheleifeh am Ufer zwischen Akaba und Eilat ausgrub, erklärte ihn zu Ezjon-Geber und sein Lehmziegelgebäude zu Salomos Kupferraffinerie; die Raffinerie wurde später aufgegeben, auch von Glueck selbst, und Gary Praticos Neuuntersuchung datierte die befestigte Siedlung ins 8. Jahrhundert v. Chr. und später, nichts sicher aus Salomos Zeit, sodass der Hügel eher Elat sein könnte. Beno Rothenberg und Alexander Flinder verwiesen stattdessen auf Dschezirat Faraun, die Pharaoneninsel, ein Eiland etwa 14 km südwestlich von Eilat vor der Sinai-Küste mit geschütztem Ankerplatz und Spuren von Hafenanlagen, wenn auch die sichtbaren Mauern mittelalterlich sind. Andere halten Ezjon-Geber und Elat für einen Ort oder meinen, der Name sei gewandert."
    - "Den Kopf des Golfs teilen sich heute Eilat in Israel, Akaba in Jordanien, Taba in Ägypten und das saudische Ufer dahinter. Die Kupferminen von Timna, 25 km nördlich, in ägyptischer Zeit und wieder, wie Radiokarbondaten gezeigt haben, im 10. Jahrhundert v. Chr. betrieben, liegen an der Straße, der die Goldschiffe gedient hätten; die Pharaoneninsel mit ihrer ayyubidischen Festung ist ein touristischer Ort."
  fr:
    - "Étsjon-Guéber était le port d’Israël sur la mer Rouge, « près d’Éloth, sur les bords de la mer Rouge, dans le pays d’Édom », au fond du golfe d’Aqaba. Les errants y campèrent du Sinaï à Kadès, puis passèrent à distance « d’Élath et d’Étsjon-Guéber » en contournant Édom vers Moab. Salomon y « construisit des navires », Hiram de Tyr envoya « des matelots connaissant la mer », et la flotte rapporta l’or d’Ophir, 420 talents (Rois) ou 450 (Chroniques). Un siècle après, Josaphat « construisit des navires de Tarsis pour aller à Ophir chercher de l’or ; mais il n’y alla point, parce que les navires se brisèrent à Étsjon-Guéber » ; les Chroniques lui donnent Achazia d’Israël pour associé. Ensuite seule Élath est nommée : Azaria la bâtit et la rendit à Juda ; sous Achaz, Retsin de Syrie en chassa les Juifs, et des Syriens, ou selon une lecture usuelle des Édomites, s’y établirent."
    - "Le site du port est débattu ; la carte montre trois candidats. Nelson Glueck, fouillant Tell el-Kheleifeh sur le rivage entre Aqaba et Eilat en 1938–1940, y vit Étsjon-Guéber et, dans son bâtiment de briques crues, la raffinerie de cuivre de Salomon ; l’idée de la raffinerie fut ensuite abandonnée, par Glueck lui-même entre autres, et Gary Pratico, réexaminant ses trouvailles, data l’établissement fortifié du VIIIe siècle av. J.-C. et après, sans rien de sûr du temps de Salomon, si bien que le tertre pourrait être Élath. Beno Rothenberg et Alexander Flinder désignèrent plutôt Jezirat Faraun, l’île de Pharaon, petite île à quelque 14 km au sud-ouest d’Eilat, au large du Sinaï, avec un mouillage abrité et des traces d’aménagements portuaires, mais ses murs visibles sont médiévaux. D’autres pensent qu’Étsjon-Guéber et Élath ne faisaient qu’un, ou que le nom se déplaça."
    - "Le fond du golfe est aujourd’hui partagé entre Eilat en Israël, Aqaba en Jordanie, Taba en Égypte et la côte saoudienne au-delà. Les mines de cuivre de Timna, à 25 km au nord, exploitées à l’époque égyptienne et de nouveau, comme l’ont montré les datations au radiocarbone, au Xe siècle av. J.-C., se trouvent sur la route que les navires de l’or auraient desservie ; l’île de Pharaon, avec son fort ayyoubide, est un site touristique."
  it:
    - "Ezion-Gheber era il porto di Israele sul Mar Rosso, «presso Eloth, sul lido del mar Rosso, nel paese di Edom», in fondo al Golfo di Aqaba. Gli Israeliti vi si accamparono andando dal Sinai a Kades, e più tardi passarono, «evitando la via della pianura, come pure Elath ed Etsion-Gheber», attorno a Edom verso Moab. Qui Salomone «costruì anche una flotta», Chiram di Tiro mandò «marinai, che conoscevano il mare», e la flotta portò oro da Ofir: 420 talenti nei Re, 450 nelle Cronache. Un secolo dopo Giosafat «costruì delle navi di Tarsis per andare a Ofir in cerca d’oro; ma poi non andò, perché le navi naufragarono a Etsion-Gheber»; le Cronache fanno socio dell’impresa Acazia d’Israele. Poi si nomina solo Elat: Azaria la costruì e la riconquistò a Giuda, e sotto Acaz Resin di Siria ne cacciò i Giudei, e vi si stabilirono i Siri o, per lettura comune, gli Edomiti."
    - "Dove sorgesse il porto è controverso, e la mappa mostra tre candidati. Nelson Glueck, scavando Tell el-Kheleifeh sulla riva fra Aqaba ed Eilat nel 1938–1940, lo annunciò come Ezion-Gheber e il suo edificio in mattoni crudi come la raffineria di rame di Salomone; la raffineria fu poi abbandonata, dallo stesso Glueck fra gli altri, e un riesame di Gary Pratico datò l’insediamento fortificato all’VIII secolo a.C. e dopo, senza nulla di sicuro dell’epoca di Salomone, sicché il tell potrebbe essere piuttosto Elat. Beno Rothenberg e Alexander Flinder indicarono invece Jezirat Faraun, l’Isola del Faraone, a circa 14 km a sud-ovest di Eilat al largo del Sinai, con ancoraggio riparato e tracce di opere portuali, benché le mura visibili siano medievali. Altri pensano che Ezion-Gheber ed Elat fossero un solo luogo, o che il nome si sia spostato."
    - "L’estremità del golfo è oggi condivisa da Eilat in Israele, Aqaba in Giordania, Taba in Egitto e dalla riva saudita al di là. Le miniere di rame di Timna, a 25 km a nord, sfruttate in epoca egizia e di nuovo, come hanno mostrato le datazioni al radiocarbonio, nel X secolo a.C., si trovano sulla strada che le navi dell’oro avrebbero servito; l’Isola del Faraone, con il suo forte ayyubide, è un sito turistico."
  pl:
    - "Esjon-Geber był portem Izraela nad Morzem Czerwonym, „podle Elotu, nad brzegiem morza czerwonego, w ziemi Edomskiej”, na krańcu Zatoki Akaba. Wędrowcy obozowali tam w drodze z Synaju do Kadesz, a później mijali „od Elat, i od Asyjongaber” w drodze wokół Edomu do Moabu. Tu „Okrętów też nabudował król Salomon”, Hiram z Tyru przysłał sługi (tekst: „żeglarze świadome morza”), a flota przywoziła złoto z Ofiru, 420 talentów według Księgi Królewskiej i 450 według Kronik. Sto lat później „nasprawiał Jozafat okrętów na morze, aby chodziły do Ofir po złoto. Ale nie doszły; bo się rozbiły one okręty w Asyjon Gaber”; Kroniki czynią Ochozjasza izraelskiego jego wspólnikiem w tym przedsięwzięciu. Potem wymienia się już tylko Elat: Azariasz je zbudował i przywrócił Judzie, a za Achaza Resin syryjski wypędził Żydów i osiedlili się tam Syryjczycy albo, według częstego odczytania, Edomici."
    - "Gdzie leżał port, jest sporne, a mapa pokazuje trzech kandydatów. Nelson Glueck, kopiąc Tell el-Chelejfe na brzegu między Akabą a Ejlatem w latach 1938–1940, ogłosił je Esjon-Geber, a jego budynek z cegły mułowej rafinerią miedzi Salomona; rafinerię później odrzucono, między innymi sam Glueck, a ponowne zbadanie jego znalezisk przez Gary'ego Pratico datowało ufortyfikowaną osadę na VIII w. p.n.e. i później, bez niczego na pewno z czasów Salomona, więc kopiec może raczej być Elatem. Beno Rothenberg i Alexander Flinder wskazali zamiast tego Dżazirat Faraun, Wyspę Faraona, małą wysepkę około 14 km na południowy zachód od Ejlatu przy wybrzeżu Synaju, z osłoniętym kotwicowiskiem i śladami robót portowych, choć jej widoczne mury są średniowieczne. Inni sądzą, że Esjon-Geber i Elat były jednym miejscem albo że nazwa się przeniosła."
    - "Krańcem zatoki dzielą się dziś Ejlat w Izraelu, Akaba w Jordanii, Taba w Egipcie i brzeg saudyjski za nimi. Kopalnie miedzi w Timna, 25 km na północ, eksploatowane w okresie egipskim i znów, jak wykazały daty radiowęglowe, w X w. p.n.e., leżą przy drodze, której służyłyby okręty ze złotem; Wyspa Faraona z fortem ajjubidzkim jest miejscem turystycznym."
  nl:
    - "Ezeon-Geber was Israëls haven aan de Rode Zee, “dat bij Eloth is, aan den oever der Schelfzee, in het land van Edom”, aan het hoofd van de Golf van Akaba. De zwervers kampeerden er tussen Sinaï en Kades, en trokken later langs “van Elath, en van Ezeon-Geber” om Edom heen naar Moab. Hier: “De koning Salomo maakte ook schepen te Ezeon-Geber”; Hiram van Tyrus zond “scheepslieden, kenners van de zee”, en de vloot haalde goud uit Ofir, 420 talenten volgens Koningen, 450 volgens Kronieken. Een eeuw later “Josafat maakte schepen van Tharsis, om naar Ofir te gaan om goud; maar zij gingen niet, want de schepen werden gebroken te Ezeon-Geber”; volgens Kronieken was Achazia van Israël zijn partner. Daarna alleen Elat: Azarja bouwde het en bracht het weer aan Juda, en in de dagen van Achaz verdreef Rezin van Syrië de Joden, en de Syriërs, of naar gangbare lezing de Edomieten, vestigden zich er."
    - "Waar de haven lag, is omstreden, en de kaart toont drie kandidaten. Nelson Glueck, die in 1938–1940 Tell el-Kheleifeh aan de kust tussen Akaba en Eilat opgroef, kondigde het aan als Ezeon-Geber en zijn lemen gebouw als Salomo's kopersmelterij; de smelterij werd later opgegeven, onder anderen door Glueck zelf, en een herstudie van zijn vondsten door Gary Pratico dateerde de versterkte nederzetting in de achtste eeuw v.Chr. en later, met niets zekers uit Salomo's tijd, zodat de heuvel eerder Elat kan zijn. Beno Rothenberg en Alexander Flinder wezen in plaats daarvan naar Jezirat Faraun, Faraoneiland, een klein eiland zo'n 14 km ten zuidwesten van Eilat voor de kust van de Sinaï met een beschutte ankerplaats en sporen van havenwerken, al zijn de zichtbare muren middeleeuws. Anderen menen dat Ezeon-Geber en Elat één plaats waren, of dat de naam verhuisde."
    - "Het hoofd van de golf wordt nu gedeeld door Eilat in Israël, Akaba in Jordanië, Taba in Egypte en de Saoedische kust erachter. De kopermijnen van Timna, 25 km noordelijker, in de Egyptische tijd bewerkt en opnieuw, zoals radiokoolstofdateringen hebben getoond, in de tiende eeuw v.Chr., liggen aan de weg die de goudschepen gediend zouden hebben; Faraoneiland, met zijn Ayyubidisch fort, is een toeristische plaats."
  cs:
    - "Ecjon-geber byl izraelský přístav na Rudém moři, „kteréž jest podlé Elat, na břehu moře Rudého v zemi Idumejské“, na horním konci Akabského zálivu. Poutníci se tam utábořili na cestě ze Sinaje do Kádeše a později prošli „od Elat a od Aziongaber“ po cestě kolem Edómu do Moábu. Zde Šalomoun „nadělal … lodí velikých“, Chíram z Týru poslal „plavce umělé na moři“ a loďstvo přivezlo zlato z Ofíru, 420 talentů podle Králů a 450 podle Letopisů. O století později Jozafat „nadělal lodí mořských, aby jeli do Ofir pro zlato. Ale nejeli, nebo polámaly se lodí v Aziongaber“; Letopisy činí z Achazjáše Izraelského jeho společníka v podniku. Potom se jmenuje už jen Élat: Azarjáš jej vystavěl a vrátil Judovi a za dnů Achazových Resín Syrský vyhnal Židy a usadili se tam Syřané, nebo podle obvyklého čtení Edómci."
    - "Kde přístav ležel, je sporné a mapa ukazuje tři kandidáty. Nelson Glueck, vykopávající Tell el-Kheleifeh na břehu mezi Akabou a Eilatem v letech 1938–1940, jej ohlásil jako Ecjon-geber a jeho cihlovou stavbu jako Šalomounovu měděnou rafinérii; představa rafinérie byla později opuštěna, mimo jiné samým Glueckem, a nové zkoumání jeho nálezů, které provedl Gary Pratico, datovalo opevněné sídliště do 8. století př. n. l. a později, bez čehokoli jistě ze Šalomounovy doby, takže pahorek může být spíše Élat. Beno Rothenberg a Alexander Flinder poukázali místo toho na Jezirat Faraun, Faraonův ostrov, malý ostrůvek asi 14 km jihozápadně od Eilatu u sinajského pobřeží s chráněným kotvištěm a stopami přístavních děl, ač jeho viditelné zdi jsou středověké. Jiní soudí, že Ecjon-geber a Élat byly jedno místo, nebo že se jméno přesunulo."
    - "Horní konec zálivu dnes sdílejí Eilat v Izraeli, Akaba v Jordánsku, Taba v Egyptě a saúdský břeh za nimi. Měděné doly Timna, 25 km na sever, těžené v egyptském období a znovu, jak ukázala radiokarbonová data, v 10. století př. n. l., leží při cestě, kterou by zlaté lodě obsluhovaly; Faraonův ostrov s ajjúbovskou pevností je turistickým místem."
  sv:
    - "Esjon-Geber var Israels hamn vid Sävhavet, ”vid Elot, på stranden av Röda havet, i Edoms land”, i inre delen av Akabaviken. Vandrarna lägrade sig där på vägen från Sinai till Kadesh och drog senare förbi ”Elat och Esjon-Geber” på vägen runt Edom till Moab. Här lät Salomo bygga ”en flotta”, Hiram av Tyros sände ”sjökunnigt skeppsmanskap”, och flottan hämtade guld från Ofir, 420 talenter enligt Kungaboken och 450 enligt Krönikeboken. Ett sekel senare hade Josafat ”låtit bygga Tarsis-skepp, som skulle gå till Ofir för att hämta guld; men de kommo aldrig åstad, ty de ledo skeppsbrott vid Esjon-Geber”; Krönikeboken gör Achasja av Israel till hans medhjälpare i företaget. Därefter nämns bara Elat: Asarja byggde upp det och lade det åter under Juda, och på Achas tid drev Resin av Syrien ut judarna, och syrierna, eller enligt en vanlig läsart edoméerna, bosatte sig där."
    - "Var hamnen låg är omstritt, och kartan visar tre kandidater. Nelson Glueck, som grävde i Tell el-Kheleifeh på stranden mellan Aqaba och Eilat 1938–1940, utropade den till Esjon-Geber och dess lertegelbyggnad till Salomos kopparraffinaderi; raffinaderiet övergavs senare, bland andra av Glueck själv, och Gary Praticos förnyade studie av fynden daterade den befästa bosättningen till 700-talet f.Kr. och senare, utan något säkert från Salomos tid, så kullen kan snarare vara Elat. Beno Rothenberg och Alexander Flinder pekade i stället på Jezirat Faraun, Faraoön, en liten ö omkring 14 km sydväst om Eilat utanför Sinaikusten med skyddad ankarplats och spår av hamnanläggningar, fast dess synliga murar är medeltida. Andra menar att Esjon-Geber och Elat var samma plats, eller att namnet flyttade."
    - "Viken är i dag delad mellan Eilat i Israel, Aqaba i Jordanien, Taba i Egypten och den saudiska stranden längre bort. Koppargruvorna i Timna, 25 km norrut, drevs under den egyptiska tiden och på nytt, vilket kol-14-dateringar har visat, på 900-talet f.Kr.; de ligger vid vägen som guldfartygen skulle ha tjänat. Faraoön med sitt ayyubidiska fort är en turistplats."
  nb:
    - "Esjon-Geber var Israels havn ved Rødehavet, «ved Elot på bredden av det Røde Hav i Edoms land», innerst i Akababukta. Ørkenvandrerne slo leir der på veien fra Sinai til Kadesj, og dro senere forbi «Elat og Esjon-Geber» på veien rundt Edom til Moab. Her heter det at kong Salomo «lot også bygge skiber», at Hiram av Tyros sendte «sjøvant mannskap», og at flåten hentet gull fra Ofir, 420 talenter ifølge Kongebøkene og 450 ifølge Krønikebøkene. Et århundre senere hadde Josafat «ti Tarsis-skib som skulde gå til Ofir efter gull; men de kom ikke avsted, for nogen av skibene forliste ved Esjon-Geber»; Krønikebøkene gjør Akasja av Israel til hans partner i foretaket. Etter det nevnes bare Elat: Asarja bygde det opp og vant det tilbake for Juda, og i Ahas' dager drev Resin av Syria jødene bort, og syrerne, eller etter en vanlig lesning edomittene, bosatte seg der."
    - "Hvor havnen lå, er omstridt, og kartet viser tre kandidater. Nelson Glueck, som gravde ut Tell el-Kheleifeh på kysten mellom Aqaba og Eilat i 1938–1940, la fram stedet som Esjon-Geber og bygningen av leirtegl som Salomos kobberraffineri; raffineriet ble senere oppgitt, blant andre av Glueck selv, og en ny undersøkelse av funnene hans ved Gary Pratico daterte den befestede bosetningen til 700-tallet f.Kr. og senere, uten noe som med sikkerhet stammer fra Salomos tid, slik at haugen heller kan være Elat. Beno Rothenberg og Alexander Flinder pekte i stedet på Jezirat Faraun, Faraos øy, en liten øy omtrent 14 km sørvest for Eilat utenfor Sinai-kysten, med en skjermet ankerplass og spor etter havneanlegg, selv om murene som kan sees, er middelalderske. Andre mener at Esjon-Geber og Elat var ett og samme sted, eller at navnet flyttet seg."
    - "Enden av bukta deles i dag av Eilat i Israel, Aqaba i Jordan, Taba i Egypt og den saudiske kysten bortenfor. Kobbergruvene i Timna, 25 km mot nord, som var i drift i egyptisk tid og igjen, slik radiokarbondateringer har vist, på 900-tallet f.Kr., ligger ved veien som gullskipene ville ha betjent; Faraos øy, med sin ayyubidiske festning, er et turiststed."
  tl:
    - "Ang Esion-geber ang daungan ng Israel, “sa siping ng Elath, sa baybayin ng Dagat na Mapula, sa lupain ng Edom”, sa dulo ng Look ng Aqaba. Nagkampo roon ang mga lagalag mula Sinai patungong Cades; kalaunan, “mula sa Elath at mula sa Esion-geber” patungong Moab. Dito nagpagawa si Salomon ng “mga sasakyang dagat”, at nagsugo si Hiram ng “mga magdadagat na bihasa sa dagat”; nagdala sila ng ginto mula Ophir: 420 talento sa Mga Hari, 450 sa Mga Cronica. Isang siglo pagkaraan, si Josaphat ay “gumawa ng mga sasakyang dagat sa Tharsis, upang pumaroon sa Ophir dahil sa ginto: nguni't hindi sila nagsiparoon; sapagka't ang mga sasakyan ay nangasira sa Ezion-geber”; kasosyo si Ochozias ng Israel (Mga Cronica). Pagkaraan, Elath na lamang: itinayo at isinauli ito ni Azarias sa Juda; sa mga araw ni Achaz, pinalayas ni Rezin ng Siria ang mga Judio, at tumira roon ang taga-Siria o, sa ibang basa, Edomita."
    - "Pinagtatalunan kung saan naroon ang daungan; tatlong kandidato ang nasa mapa. Inihayag ni Nelson Glueck, na naghukay sa Tell el-Kheleifeh sa pagitan ng Aqaba at Eilat noong 1938–1940, na ito ang Esion-geber at ang gusaling laryong putik nito ang pagawaan ng tanso ni Salomon; kalaunan ay isinuko ito, pati ni Glueck mismo, at ang muling pag-aaral ni Gary Pratico sa mga natuklasan niya ay nag-petsa sa nakukutaang pamayanan sa ika-8 siglo BK at pagkatapos, na walang tiyak na mula kay Salomon, kaya maaaring Elath ang burol. Itinuro nina Beno Rothenberg at Alexander Flinder ang Jezirat Faraun, Pulo ni Faraon, maliit na pulo mga 14 km timog-kanluran ng Eilat sa baybayin ng Sinai na may kanlungang angklahan at bakas ng gawaing pandaungan, bagaman medyebal ang nakikitang pader nito. Iniisip ng iba na iisang lugar ang Esion-geber at Elath, o lumipat ang pangalan."
    - "Ang dulo ng look ay pinagsasaluhan ngayon ng Eilat sa Israel, Aqaba sa Jordan, Taba sa Egipto at ng baybayin ng Saudi sa kabila. Ang mga minahan ng tanso sa Timna, 25 km sa hilaga, na ginamit noong panahon ng Egipto at muli, gaya ng ipinakita ng mga petsang radiocarbon, noong ika-10 siglo BK, ay nasa daan na pagsisilbihan sana ng mga barkong nagdadala ng ginto; ang Pulo ni Faraon, na may kuta ng Ayyubid, ay isang pook-panturista."
