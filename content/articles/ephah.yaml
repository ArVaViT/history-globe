body:
  en:
    - "Ephah was an Arabian people, named first among the sons of Midian in Genesis: “the sons of Midian; Ephah, and Epher, and Hanoch, and Abidah, and Eldaah. All these were the children of Keturah.” Isaiah sees the caravans of the desert coming to Zion: “The multitude of camels shall cover thee, the dromedaries of Midian and Ephah; all they from Sheba shall come: they shall bring gold and incense”. Its land cannot be pinpointed; Israel Eph'al suggested the region of Yathrib (Medina) or the Hisma in north-western Arabia, and the map sets it with Midian."
    - "Ephah is the only Midianite tribe known outside the Bible. In the eighth century BC the Assyrian king Tiglath-pileser III lists the Hayappa among the Arab peoples, with Massa, Tema, Sheba and Adbeel, who brought him tribute after his campaign in southern Palestine. Sargon II records that he struck down the Hayappa, with the Tamudu, Ibadidi and Marsimani, “faraway Arabs who live in the desert”, and settled the rest of them in Samaria, the former capital of Israel; the annals place this in his seventh year, 715 BC, though it is often dated 716 BC."
  ru:
    - "Ефа — аравийский народ, который Бытие называет первым среди сыновей Мадиама: «Сыны Мадиана: Ефа, Ефер, Ханох, Авида и Елдага. Все сии сыны Хеттуры». Исаия видит караваны пустыни, идущие к Сиону: «Множество верблюдов покроет тебя — дромадеры из Мадиама и Ефы; все они из Савы придут, принесут золото и ладан». Его землю нельзя указать точно; Исраэль Эфаль предполагал область Ясриба (Медины) или Хисму на северо-западе Аравии, а карта помещает его вместе с Мадиамом."
    - "Ефа — единственное мадиамское племя, известное вне Библии. В VIII в. до н. э. ассирийский царь Тиглатпаласар III называет хаяппа среди арабских народов — вместе с Массой, Фемой, Савой и Адбеелом, — которые принесли ему дань после его похода на юг Палестины. Саргон II пишет, что сразил хаяппа вместе с тамуду, ибадиди и марсимани — «далёкими арабами, живущими в пустыне», — а остальных поселил в Самарии, бывшей столице Израиля; анналы относят это к седьмому году его царствования, 715 г. до н. э., хотя часто это событие датируют 716 г. до н. э."
  uk:
    - "Ефа був арабським народом, названим першим серед синів Мадіама в Бутті: «Сини ж Мадиянові були: Єфа, та Єфер, та Ганох, та Абида, та Єльдага. Всї цї були сини Хеттурині». Ісая бачить, як до Сіону йдуть пустельні каравани: «Безлїч верблюдів покриє тебе — дромедарі з Мадіяму і з Ефи; сила їх прийде з Саби, привезуть золото й ладан». Його землю не можна визначити точно; Ісраель Ефаль припустив область Ясрибу (Медини) або Хісму на північному заході Аравії, а мапа ставить його разом із Мадіамом."
    - "Ефа — єдине мадіамське плем'я, відоме поза Біблією. У VIII ст. до н. е. ассирійський цар Тіглатпаласар III заносить Хаяппу до арабських народів, разом з Массою, Темою, Шевою й Адбеелом, які принесли йому данину після його походу на півдні Палестини. Саргон II записує, що вдарив по Хаяппі разом з Тамуду, Ібадіді й Марсімані, «далекими арабами, які живуть у пустелі», а решту їх оселив у Самарії, колишній столиці Ізраїлю; аннали відносять це до його сьомого року, 715 р. до н. е., хоча його часто датують 716 р. до н. е."
  es:
    - "Efa fue un pueblo árabe, nombrado el primero entre los hijos de Madián en el Génesis: «hijos de Midiam: Epha, y Epher, y Enech, y Abida, y Eldaa. Todos estos fueron hijos de Cetura». Isaías ve venir a Sion las caravanas del desierto: «Multitud de camellos te cubrirá, dromedarios de Madián y de Epha; vendrán todos los de Seba; traerán oro é incienso». Su tierra no puede precisarse; Israel Eph'al sugirió la región de Yatrib (Medina) o el Hisma, en el noroeste de Arabia, y el mapa la sitúa con Madián."
    - "Efa es la única tribu madianita conocida fuera de la Biblia. En el siglo VIII a. C. el rey asirio Tiglat-pileser III enumera a los Hayappa entre los pueblos árabes, con Massa, Tema, Seba y Adbeel, que le llevaron tributo tras su campaña en el sur de Palestina. Sargón II registra que abatió a los Hayappa, con los Tamudu, Ibadidi y Marsimani, «árabes lejanos que viven en el desierto», y asentó al resto de ellos en Samaria, la antigua capital de Israel; los anales lo sitúan en su año séptimo, 715 a. C., aunque a menudo se fecha en 716 a. C."
  pt:
    - "Efá era um povo árabe, nomeado em primeiro lugar entre os filhos de Midiã no Gênesis: “Os filhos de Midiã foram Efa, Efer, Enoque, Abida e Elda. Todos estes foram filhos de Quetura.” Isaías vê as caravanas do deserto chegando a Sião: “Uma multidão de camelos cobrirá você, os dromedários de Midiã e Efa. Todos os de Sabá virão. Eles trarão ouro e incenso”. Sua terra não pode ser precisada; Israel Eph'al sugeriu a região de Yathrib (Medina) ou o Hisma, no noroeste da Arábia, e o mapa a coloca junto com Midiã."
    - "Efá é a única tribo midianita conhecida fora da Bíblia. No século VIII a.C. o rei assírio Tiglate-Pileser III lista os Hayappa entre os povos árabes, com Massá, Temá, Sabá e Adbeel, que lhe trouxeram tributo depois de sua campanha no sul da Palestina. Sargão II registra que derrotou os Hayappa, com os Tamudu, Ibadidi e Marsimani, “árabes distantes que vivem no deserto”, e estabeleceu o restante deles em Samaria, a antiga capital de Israel; os anais situam isso em seu sétimo ano, 715 a.C., embora muitas vezes se date de 716 a.C."
  de:
    - "Efa war ein arabisches Volk, im Ersten Buch Mose als Erstes unter den Söhnen Midians genannt: „Die Kinder Midians waren: Epha, Epher, Henoch, Abida und Eldaa. Diese alle sind Kinder der Ketura.“ Jesaja sieht die Karawanen der Wüste nach Zion kommen: „Denn die Menge der Kamele wird dich bedecken, die jungen Kamele aus Midian und Epha. Sie werden aus Saba alle kommen, Gold und Weihrauch bringen“. Sein Land lässt sich nicht genau festlegen; Israel Eph'al vermutete die Gegend von Jathrib (Medina) oder die Hisma in Nordwestarabien, und die Karte setzt es zu Midian."
    - "Efa ist der einzige midianitische Stamm, der außerhalb der Bibel bekannt ist. Im achten Jahrhundert v. Chr. führt der assyrische König Tiglat-Pileser III. die Hajappa unter den arabischen Völkern auf, mit Massa, Tema, Saba und Adbeel, die ihm nach seinem Feldzug in Südpalästina Tribut brachten. Sargon II. berichtet, er habe die Hajappa, mit den Tamudu, Ibadidi und Marsimani, „weit entfernte Araber, die in der Wüste leben“, geschlagen und den Rest von ihnen in Samaria, der früheren Hauptstadt Israels, angesiedelt; die Annalen setzen dies in sein siebtes Jahr, 715 v. Chr., obwohl es oft auf 716 v. Chr. datiert wird."
  fr:
    - "Épha était un peuple d’Arabie, nommé en premier parmi les fils de Madian dans la Genèse : « Les fils de Madian furent Épha, Épher, Hénoc, Abida et Eldaa. Ce sont là tous les fils de Ketura. » Ésaïe voit les caravanes du désert venir vers Sion : « Tu seras couverte d’une foule de chameaux, de dromadaires de Madian et d’Épha ; ils viendront tous de Séba ; ils porteront de l’or et de l’encens ». Son pays ne peut être précisé ; Israel Eph’al a suggéré la région de Yathrib (Médine) ou le Hisma, dans le nord-ouest de l’Arabie, et la carte le place avec Madian."
    - "Épha est la seule tribu madianite connue hors de la Bible. Au VIIIe siècle av. J.-C., le roi assyrien Tiglath-Piléser III cite les Hayappa parmi les peuples arabes, avec Massa, Théma, Séba et Adbeel, qui lui apportèrent un tribut après sa campagne dans le sud de la Palestine. Sargon II rapporte qu’il abattit les Hayappa, avec les Tamudu, les Ibadidi et les Marsimani, « Arabes lointains qui vivent dans le désert », et établit le reste d’entre eux à Samarie, l’ancienne capitale d’Israël ; les annales placent cela dans sa septième année, 715 av. J.-C., bien qu’on le date souvent de 716 av. J.-C."
  it:
    - "Efa era un popolo arabo, nominato per primo tra i figli di Madian nella Genesi: «E i figliuoli di Madian furono Efa, Efer, Hanoch, Abida ed Eldaa. Tutti questi furono i figliuoli di Ketura». Isaia vede le carovane del deserto venire a Sion: «Stuoli di cammelli ti copriranno, dromedari di Madian e d’Efa; quelli di Sceba verranno tutti, portando oro ed incenso». Il suo territorio non può essere precisato; Israel Eph‘al suggerì la regione di Yathrib (Medina) o lo Hisma nell’Arabia nord-occidentale, e la carta lo pone insieme a Madian."
    - "Efa è l’unica tribù madianita nota fuori dalla Bibbia. Nell’VIII secolo a.C. il re assiro Tiglat-Pileser III elenca gli Hayappa tra i popoli arabi, con Massa, Tema, Saba e Adbeel, che gli portarono tributo dopo la sua campagna nella Palestina meridionale. Sargon II registra di aver sconfitto gli Hayappa, con i Tamudu, gli Ibadidi e i Marsimani, «Arabi lontani che vivono nel deserto», e di aver stanziato il resto di essi in Samaria, l’antica capitale di Israele; gli annali collocano il fatto nel suo settimo anno, il 715 a.C., benché sia spesso datato al 716 a.C."
  nl:
    - "Efa was een Arabisch volk, als eerste genoemd onder de zonen van Midian in Genesis: “de zonen van Midian waren Efa en Efer, en Henoch en Abida, en Eldaa. Deze allen waren zonen van Ketura.” Jesaja ziet de karavanen van de woestijn naar Sion komen: “Een hoop kemelen zal u bedekken, de snelle kemelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen”. Het land is niet precies aan te wijzen; Israel Eph'al suggereerde de streek van Yathrib (Medina) of de Hisma in het noordwesten van Arabië, en de kaart zet het bij Midian."
    - "Efa is de enige Midianitische stam die buiten de Bijbel bekend is. In de achtste eeuw v.Chr. noemt de Assyrische koning Tiglat-Pileser III de Hayappa onder de Arabische volken, met Massa, Tema, Seba en Adbeël, die hem schatting brachten na zijn veldtocht in het zuiden van Palestina. Sargon II vermeldt dat hij de Hayappa versloeg, met de Tamudu, Ibadidi en Marsimani, “verafgelegen Arabieren die in de woestijn wonen”, en de rest van hen in Samaria vestigde, de voormalige hoofdstad van Israël; de annalen plaatsen dit in zijn zevende jaar, 715 v.Chr., al wordt het vaak op 716 v.Chr. gedateerd."
  pl:
    - "Efa było ludem arabskim, wymienionym jako pierwszy wśród synów Madiana w Księdze Rodzaju: „Synowie zaś Midyjanowi byli Hefa, i Hefer, i Henoch, i Abyda, i Eldaa; wszyscy ci byli synowie Ketury”. Izajasz widzi karawany pustyni idące do Syjonu: „Obfitość wielbłądów okryje cię, także dromedarze z Madyjan i z Efy. Wszyscy ci przyjdą z Saby, złoto i kadzidło przyniosą”. Jego ziemi nie można dokładnie wskazać; Israel Eph'al sugerował region Jatrib (Medyna) lub Hisma w północno-zachodniej Arabii, a mapa umieszcza ją razem z Madianem."
    - "Efa jest jedynym znanym poza Biblią plemieniem madianickim. W VIII w. p.n.e. król asyryjski Tiglat-Pileser III wymienia Chajappa wśród ludów arabskich, obok Massa, Tema, Szeba i Adbeel, które złożyły mu daninę po jego wyprawie w południowej Palestynie. Sargon II zapisuje, że rozgromił Chajappa wraz z Tamudu, Ibadidi i Marsimani, „dalekimi Arabami, którzy mieszkają na pustyni”, a resztę osiedlił w Samarii, dawnej stolicy Izraela; annały umieszczają to w jego siódmym roku, 715 p.n.e., choć często datuje się to na 716 p.n.e."
  cs:
    - "Efa byl arabský lid, jmenovaný první mezi syny Midjánovými v Genesis: „Ale synové Madianovi: Efa, a Efer, a Enoch, a Abida, a Helda; všickni ti synové byli Cetury.“ Izajáš vidí karavany pouště přicházet k Sijónu: „Stádo velbloudů přikryje tě, a dromedáři Madianští a Efejští, všickni ti z Sáby přijdou, zlato a kadidlo přinesou“. Jeho zemi nelze přesně určit; Israel Eph'al navrhl oblast Jathribu (Medíny) nebo Hismu v severozápadní Arábii a mapa jej klade společně s Midjánem."
    - "Efa je jediný midjánský kmen známý mimo Bibli. V osmém století př. n. l. uvádí asyrský král Tiglatpilesar III. Hajappu mezi arabskými národy, s Masou, Témou, Šebou a Adbeelem, které mu přinesly dary po jeho tažení do jižní Palestiny. Sargon II. zaznamenává, že Hajappu porazil, spolu s Tamudu, Ibadidi a Marsimani, „vzdálenými Araby, kteří žijí na poušti“, a zbytek z nich usadil v Samaří, dřívějším hlavním městě Izraele; anály to kladou do jeho sedmého roku, 715 př. n. l., ačkoli se často datuje rokem 716 př. n. l."
  sv:
    - "Efa var ett arabiskt folk, nämnt först bland Midjans söner i Första Mosebok: ”Och Midjans söner voro Efa, Efer, Hanok, Abida och Eldaa. Alla dessa voro Keturas söner.” Jesaja ser öknens karavaner komma till Sion: ”Skaror av kameler skola övertäcka dig, kamelfålar från Midjan och Efa; från Saba skola de alla komma, guld och rökelse skola de bära”. Dess land kan inte pekas ut exakt; Israel Eph’al föreslog trakten av Yathrib (Medina) eller Hisma i nordvästra Arabien, och kartan sätter det med Midjan."
    - "Efa är den enda midjanitiska stammen som är känd utanför Bibeln. På 700-talet f.Kr. förtecknar den assyriske kungen Tiglat-Pileser III hayappa bland de arabiska folken, med Massa, Tema, Saba och Adbeel, som förde honom tribut efter hans fälttåg i södra Palestina. Sargon II berättar att han slog ner hayappa, med tamudu, ibadidi och marsimani, ”avlägsna araber som lever i öknen”, och bosatte resten av dem i Samaria, Israels forna huvudstad; annalerna placerar detta i hans sjunde år, 715 f.Kr., fastän det ofta dateras till 716 f.Kr."
  nb:
    - "Efa var et arabisk folk, nevnt først blant Midjans sønner i 1. Mosebok: «Og Midians barn var Efa og Efer og Hanok og Abida og Elda'a; alle disse var Keturas barn.» Jesaja ser ørkenens karavaner komme til Sion: «Et mylder av kameler skal dekke dig, Midians og Efas kamelføll; alle sammen skal de komme fra Sjeba; gull og virak skal de føre til dig». Dets land kan ikke pekes ut; Israel Eph'al foreslo området rundt Yathrib (Medina) eller Hisma i nordvestlige Arabia, og kartet setter det sammen med Midjan."
    - "Efa er den eneste midjanittiske stammen som er kjent utenfor Bibelen. På 700-tallet f.Kr. lister den assyriske kongen Tiglat-Pileser III hayappaene blant de arabiske folkene, sammen med Massa, Tema, Sjeba og Adbeel, som brakte ham tributt etter hans felttog i Sør-Palestina. Sargon II opplyser at han slo ned hayappaene, sammen med tamuduene, ibadidiene og marsimaniene, «fjerne arabere som bor i ørkenen», og bosatte resten av dem i Samaria, Israels tidligere hovedstad; annalene legger dette til hans sjuende år, 715 f.Kr., selv om det ofte dateres til 716 f.Kr."
