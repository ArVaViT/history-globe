# Overview article (ADR 0007). Mainstream facts only; a wilderness station known only from the itinerary of Numbers 33; nothing is known of it, and the article says so.
id: rimmon-perez
place: ac79b33
title:
  en: "Rimmon-perez"
  ru: "Римнон-Фарец"
body:
  en:
    - "Rimmon-perez, in the King James Version “Rimmon-parez”, is a camp of Israel in the wilderness named only in the itinerary of Numbers 33, between Rithmah and Libnah: “And they departed from Rithmah, and pitched at Rimmon-parez. And they departed from Rimmon-parez, and pitched in Libnah.” The name means something like “pomegranate of the breach”. No event, spring or landmark is attached to it."
    - "Its site is unknown. The map marks three guesses without choosing: a point along Naqb al-Biyar in the Sinai mountains west of the Gulf of Aqaba, one along Wadi er-Rummun in the central Negev, whose name recalls Rimmon, and the Rimmon of Simeon in the northern Negev. All depend on how the whole route is drawn, which is itself uncertain."
  ru:
    - "Римнон-Фарец — стан Израиля в пустыне, названный только в перечне 33-й главы книги Чисел, между Рифмой и Ливной: «И отправились из Рифмы и расположились станом в Римнон-Фареце. И отправились из Римнон-Фареца и расположились станом в Ливне». Имя значит что-то вроде «гранат пролома». Ни события, ни источника, ни приметы с ним не связано."
    - "Местоположение неизвестно. Карта отмечает три догадки, не выбирая между ними: точку вдоль Накб-аль-Бияр в горах Синая к западу от залива Акаба, точку вдоль Вади эр-Руммун в центральном Негеве, чьё имя напоминает Риммон, и Риммон Симеонов на севере Негева. Все они зависят от того, как провести весь путь, а он сам неясен."
scripture:
  - Num.33.19-Num.33.20
sources:
  - "G. I. Davies, The Way of the Wilderness: A Geographical Study of the Wilderness Itineraries in the Old Testament (1979)"
  - "B. A. Levine, Numbers 21-36 (Anchor Bible, 2000)"
  - "M. Noth, Numbers: A Commentary (Old Testament Library, 1968)"
