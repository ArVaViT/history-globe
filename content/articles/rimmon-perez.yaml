body:
  en:
    - "Rimmon-perez, in the King James Version “Rimmon-parez”, is a camp of Israel in the wilderness named only in the itinerary of Numbers 33, between Rithmah and Libnah: “And they departed from Rithmah, and pitched at Rimmon-parez. And they departed from Rimmon-parez, and pitched in Libnah.” The name means something like “pomegranate of the breach”. No event, spring or landmark is attached to it."
    - "Its site is unknown. The map marks three guesses without choosing: a point along Naqb al-Biyar in the Sinai mountains west of the Gulf of Aqaba, one along Wadi er-Rummun in the central Negev, whose name recalls Rimmon, and the Rimmon of Simeon in the northern Negev. All depend on how the whole route is drawn, which is itself uncertain."
  ru:
    - "Римнон-Фарец — стан Израиля в пустыне, названный только в перечне 33-й главы книги Чисел, между Рифмой и Ливной: «И отправились из Рифмы и расположились станом в Римнон-Фареце. И отправились из Римнон-Фареца и расположились станом в Ливне». Имя значит что-то вроде «гранат пролома». Ни события, ни источника, ни приметы с ним не связано."
    - "Местоположение неизвестно. Карта отмечает три догадки, не выбирая между ними: точку вдоль Накб-аль-Бияр в горах Синая к западу от залива Акаба, точку вдоль Вади эр-Руммун в центральном Негеве, чьё имя напоминает Риммон, и Риммон Симеонов на севере Негева. Все они зависят от того, как провести весь путь, а он сам неясен."
  uk:
    - "Риммон-Перец, у Біблії короля Якова «Риммон-Парец», — табір Ізраїлю в пустині, згаданий лише в маршруті Чисел 33, між Ріфмою та Лівною: «І рушили з Ритми та й отаборились у Риммон-Перезї. І рушили з Риммон-Переза та й отаборились у Либнї.» Назва означає щось на кшталт «гранат прориву». З нею не пов’язано жодної події, джерела чи орієнтира."
    - "Його розташування невідоме. Карта позначає три здогади, не обираючи: точку вздовж Накб-аль-Бійар у Синайських горах на захід від затоки Акаба, точку вздовж Ваді-ер-Руммун у центральному Негеві, чия назва нагадує Риммон, та Риммон Симеонів у північному Негеві. Усе залежить від того, як накреслено весь маршрут, що й саме непевне."
  es:
    - "Rimón-pérez, en la King James Version «Rimmon-parez», es un campamento de Israel en el desierto nombrado solo en el itinerario de Números 33, entre Ritma y Libna: «Y partidos de Ritma, asentaron en Rimmón-peres. Y partidos de Rimmón-peres, asentaron en Libna». El nombre significa algo como «granada de la brecha». No se le asocia ningún suceso, manantial ni accidente del terreno."
    - "Su emplazamiento se desconoce. El mapa señala tres conjeturas sin elegir: un punto a lo largo del Naqb al-Biyar, en las montañas del Sinaí al oeste del golfo de Aqaba, otro a lo largo del Wadi er-Rummun, en el Néguev central, cuyo nombre recuerda a Rimón, y el Rimón de Simeón en el norte del Néguev. Todas dependen de cómo se trace la ruta entera, que es en sí misma incierta."
  pt:
    - "Rimom-Perez, na King James “Rimmon-parez”, é um acampamento de Israel no deserto citado apenas no itinerário de Números 33, entre Ritma e Libna: “Partiram de Ritmá e acamparam em Rimom-Perez. Partiram de Rimom-Perez e acamparam em Libna.” O nome significa algo como “romã da brecha”. Nenhum acontecimento, fonte ou marco lhe é associado."
    - "Seu local é desconhecido. O mapa marca três hipóteses sem escolher: um ponto ao longo do Naqb al-Biyar, nas montanhas do Sinai a oeste do golfo de Aqaba, outro ao longo do Wadi er-Rummun, no Neguebe central, cujo nome lembra Rimom, e a Rimom de Simeão, no norte do Neguebe. Todas dependem de como se traça toda a rota, o que é em si incerto."
  de:
    - "Rimmon-Perez, in der King-James-Bibel „Rimmon-parez“, ist ein Lager Israels in der Wüste, nur in der Stationenliste von Numeri 33 zwischen Ritma und Libna genannt: „Von Rithma zogen sie aus und lagerten sich in Rimmon-Perez. Von Rimmon-Perez zogen sie aus und lagerten sich in Libna.“ Der Name bedeutet etwa „Granatapfel des Bruchs“. Kein Ereignis, keine Quelle und kein Wahrzeichen sind damit verbunden."
    - "Seine Lage ist unbekannt. Die Karte markiert drei Vermutungen, ohne zu wählen: einen Punkt am Naqb el-Biyar im Sinaigebirge westlich des Golfs von Akaba, einen am Wadi er-Rummun im zentralen Negev, dessen Name an Rimmon erinnert, und das Rimmon Simeons im nördlichen Negev. Alle hängen davon ab, wie die ganze Route gezeichnet wird, was selbst unsicher ist."
  fr:
    - "Rimmon-Pérets, « Rimmon-parez » dans la King James Version, est un campement d’Israël dans le désert, nommé seulement dans l’itinéraire de Nombres 33, entre Rithma et Libna : « Ils partirent de Rithma, et campèrent à Rimmon-Pérets. Ils partirent de Rimmon-Pérets, et campèrent à Libna. » Le nom signifie à peu près « grenade de la brèche ». Aucun événement, source ou repère ne s’y rattache."
    - "Son site est inconnu. La carte marque trois conjectures sans choisir : un point le long du Naqb al-Biyar, dans les montagnes du Sinaï à l’ouest du golfe d’Aqaba, un autre le long du Wadi er-Rummun, dans le Négev central, dont le nom rappelle Rimmon, et le Rimmon de Siméon dans le nord du Négev. Toutes dépendent du tracé de l’ensemble de la route, lui-même incertain."
  it:
    - "Rimmon-Peres, nella King James Version «Rimmon-parez», è un accampamento di Israele nel deserto nominato solo nell’itinerario di Numeri 33, tra Ritma e Libna: «Partirono da Rithma e si accamparono a Rimmon-Perets. Partirono da Rimmon-Perets e si accamparono a Libna.» Il nome significa qualcosa come «melograno della breccia». Nessun evento, sorgente o punto di riferimento vi è collegato."
    - "Il suo sito è ignoto. La mappa segna tre ipotesi senza sceglierne una: un punto lungo il Naqb al-Biyar sui monti del Sinai a ovest del Golfo di Aqaba, uno lungo il Wadi er-Rummun nel Negheb centrale, il cui nome richiama Rimmon, e il Rimmon di Simeone nel Negheb settentrionale. Tutte dipendono da come si traccia l’intero percorso, che è esso stesso incerto."
  pl:
    - "Rimmon-Peres, w Biblii Króla Jakuba „Rimmon-parez”, to obóz Izraela na pustyni, wymieniony tylko w itinerarium z Lb 33, między Retma a Libną: „A ruszywszy się z Retma, położyli się obozem w Remmon Fares. A ruszywszy się z Remmon Fares, położyli się obozem w Lebna”. Nazwa znaczy mniej więcej „granat wyłomu”. Z nią nie wiąże się żadne wydarzenie, źródło ani punkt orientacyjny."
    - "Jego położenie jest nieznane. Mapa zaznacza trzy przypuszczenia, nie rozstrzygając: punkt wzdłuż Nakb al-Bijar w górach Synaju na zachód od Zatoki Akaba, punkt wzdłuż Wadi er-Rummun w środkowym Negewie, którego nazwa przypomina Rimmon, oraz Rimmon Symeona w północnym Negewie. Wszystkie zależą od tego, jak narysuje się całą trasę, co samo jest niepewne."
  cs:
    - "Rimmon-peres, v King James Version „Rimmon-parez“, je tábor Izraele na poušti jmenovaný jen v itineráři Numeri 33, mezi Ritmou a Libnou: „A z Retma hnuvše se, položili se v Remmon Fáres. Potom hnuvše se z Remmon Fáres, položili se v Lebna.“ Jméno znamená něco jako „granátové jablko průlomu“. S ním není spojena žádná událost, pramen ani orientační bod."
    - "Jeho poloha je neznámá. Mapa vyznačuje tři dohady, aniž si vybírá: bod na Nakb al-Bijár v sinajských horách západně od Akabského zálivu, bod na Vádí er-Rummún v centrálním Negevu, jehož jméno připomíná Rimmon, a Rimmon Simeonův v severním Negevu. Všechny závisejí na tom, jak se zakreslí celá trasa, což je samo nejisté."
  nl:
    - "Rimmon-Perez, in de King James Version “Rimmon-parez”, is een kamp van Israël in de woestijn dat alleen in de reisroute van Numeri 33 wordt genoemd, tussen Ritma en Libna: “En zij verreisden van Rithma, en legerden zich in Rimmon-Perez. En zij verreisden van Rimmon-Perez, en legerden zich in Libna.” De naam betekent zoiets als “granaatappel van de breuk”. Er is geen gebeurtenis, bron of oriëntatiepunt aan verbonden."
    - "De ligging is onbekend. De kaart wijst drie gissingen aan zonder te kiezen: een punt langs de Naqb al-Biyar in het Sinaïgebergte ten westen van de Golf van Akaba, een langs de Wadi er-Rummun in de centrale Negev, wier naam aan Rimmon doet denken, en het Rimmon van Simeon in de noordelijke Negev. Alle hangen af van hoe de hele route wordt getekend, wat zelf onzeker is."
  sv:
    - "Rimmon-Peres, i King James-översättningen ”Rimmon-parez”, är ett av Israels läger i öknen, nämnt endast i vandringsförteckningen i 4 Mos 33, mellan Ritma och Livna: ”Och de bröto upp från Ritma och lägrade sig i Rimmon-Peres. Och de bröto upp från Rimmon-Peres och lägrade sig i Libna.” Namnet betyder ungefär ”granatäpplet vid bräschen”. Ingen händelse, källa eller landmärke är knuten till det."
    - "Dess läge är okänt. Kartan markerar tre gissningar utan att välja: en punkt längs Naqb al-Biyar i Sinaibergen väster om Akababukten, en längs Wadi er-Rummun i centrala Negev, vars namn påminner om Rimmon, och Simeons Rimmon i norra Negev. Alla beror på hur hela färdvägen dras, vilket i sig är osäkert."
  nb:
    - "Rimmon-Peres, i King James Version «Rimmon-parez», er en av Israels leirplasser i ørkenen, nevnt bare i ferdaberetningen i 4. Mosebok 33, mellom Ritma og Libna: «Og de drog fra Ritma og leiret sig i Rimmon-Peres. Og de drog fra Rimmon-Peres og leiret sig i Libna.» Navnet betyr noe i retning av «granateplet ved bruddet». Ingen hendelse, kilde eller landemerke er knyttet til det."
    - "Stedet er ukjent. Kartet markerer tre gjetninger uten å velge: et punkt langs Naqb al-Biyar i Sinai-fjellene vest for Aqababukta, ett langs Wadi er-Rummun i det sentrale Negev, hvis navn minner om Rimmon, og Simeons Rimmon i det nordlige Negev. Alle avhenger av hvordan hele ruten tegnes, noe som selv er usikkert."
  tl:
    - "Ang Rimmon-peres, “Rimmon-parez” sa King James Version, ay isang kampo ng Israel sa ilang na pinangalanan lamang sa itineraryo ng Mga Bilang 33, sa pagitan ng Ritma at Libna: “At sila'y naglakbay mula sa Ritma, at humantong sa Rimmon-peres. At sila'y naglakbay mula sa Rimmon-peres, at humantong sa Libna.” Ang pangalan ay nangangahulugang tulad ng “granada ng bitak”. Walang pangyayari, bukal o palatandaang nakakabit dito."
    - "Hindi alam ang lugar nito. Minamarkahan ng mapa ang tatlong hula nang hindi pumipili: isang punto sa tabi ng Naqb al-Biyar sa mga bundok ng Sinai sa kanluran ng Golpo ng Aqaba, isa sa tabi ng Wadi er-Rummun sa gitnang Negev, na ang pangalan ay nagpapaalala sa Rimmon, at ang Rimmon ng Simeon sa hilagang Negev. Nakasalalay ang lahat sa kung paano iguguhit ang buong ruta, na hindi rin tiyak."
  da:
    - "Rimmon-Peres, i King James-oversættelsen »Rimmon-parez«, er en af Israels lejre i ørkenen, nævnt kun i rejseberetningen i 4 Mos 33, mellem Ritma og Libna: »Og de rejste fra Rithma, og de lejrede sig i Rimmon-Perez. Og de rejste fra Rimmon-Perez, og de lejrede sig i Libna.« Navnet betyder noget i retning af »bruddets granatæble«. Ingen begivenhed, kilde eller landemærke er knyttet til det."
    - "Dets sted er ukendt. Kortet markerer tre gæt uden at vælge: et punkt langs Naqb al-Biyar i Sinaibjergene vest for Aqababugten, et langs Wadi er-Rummun i det centrale Negev, hvis navn minder om Rimmon, og Simeons Rimmon i det nordlige Negev. Alle afhænger af, hvordan hele ruten tegnes, hvilket i sig selv er usikkert."
scripture:
  - Num.33.19-Num.33.20
sources:
