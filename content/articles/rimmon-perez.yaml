body:
  en:
    - "Rimmon-perez, in the King James Version “Rimmon-parez”, is a camp of Israel in the wilderness named only in the itinerary of Numbers 33, between Rithmah and Libnah: “And they departed from Rithmah, and pitched at Rimmon-parez. And they departed from Rimmon-parez, and pitched in Libnah.” The name means something like “pomegranate of the breach”. No event, spring or landmark is attached to it."
    - "Its site is unknown. The map marks three guesses without choosing: a point along Naqb al-Biyar in the Sinai mountains west of the Gulf of Aqaba, one along Wadi er-Rummun in the central Negev, whose name recalls Rimmon, and the Rimmon of Simeon in the northern Negev. All depend on how the whole route is drawn, which is itself uncertain."
    - "Early Christian writers add little. In the Onomasticon of Eusebius the Greek text has a gap here, and Jerome's Latin version lists the place simply as a station of the children of Israel. In his letter on the stations of the wilderness, written for Fabiola, Jerome takes Rithmah to be the camp in the wilderness of Paran named in an earlier chapter of Numbers, and counts the eighteen stations from there to Ezion-geber as lying in that wilderness. He calls Rimmon-perez the sixteenth station and renders its name as the division of the pomegranate. He reads the fruit as a figure of the church, which covers the whole crowd of believers under one rind, or of many virtues held together in harmony."
  ru:
    - "Римнон-Фарец — стан Израиля в пустыне, названный только в перечне 33-й главы книги Чисел, между Рифмой и Ливной: «И отправились из Рифмы и расположились станом в Римнон-Фареце. И отправились из Римнон-Фареца и расположились станом в Ливне». Имя значит что-то вроде «гранат пролома». Ни события, ни источника, ни приметы с ним не связано."
    - "Местоположение неизвестно. Карта отмечает три догадки, не выбирая между ними: точку вдоль Накб-аль-Бияр в горах Синая к западу от залива Акаба, точку вдоль Вади эр-Руммун в центральном Негеве, чьё имя напоминает Риммон, и Риммон Симеонов на севере Негева. Все они зависят от того, как провести весь путь, а он сам неясен."
    - "Раннехристианские писатели добавляют немногое. В «Ономастиконе» Евсевия греческий текст здесь имеет пропуск, и латинская версия Иеронима называет это место просто станом сынов Израилевых. В письме о станах пустыни, написанном для Фабиолы, Иероним считает Рифму тем станом в пустыне Фаран, о котором говорит одна из предыдущих глав книги Чисел, и относит к этой пустыне все восемнадцать станов от неё до Ецион-Гавера. Римнон-Фарец он называет шестнадцатым станом и передаёт его имя как «разделение граната». Плод он толкует как образ Церкви, покрывающей одной кожурой всё множество верующих, или многих добродетелей, связанных в согласии."
  uk:
    - "Риммон-Перец, у Біблії короля Якова «Риммон-Парец», — табір Ізраїлю в пустині, згаданий лише в маршруті Чисел 33, між Ріфмою та Лівною: «І рушили з Ритми та й отаборились у Риммон-Перезї. І рушили з Риммон-Переза та й отаборились у Либнї.» Назва означає щось на кшталт «гранат прориву». З нею не пов’язано жодної події, джерела чи орієнтира."
    - "Його розташування невідоме. Карта позначає три здогади, не обираючи: точку вздовж Накб-аль-Бійар у Синайських горах на захід від затоки Акаба, точку вздовж Ваді-ер-Руммун у центральному Негеві, чия назва нагадує Риммон, та Риммон Симеонів у північному Негеві. Усе залежить від того, як накреслено весь маршрут, що й саме непевне."
    - "Ранньохристиянські письменники додають небагато. В Ономастиконі Євсевія грецький текст тут має прогалину, і латинська версія Єроніма називає це місце просто табором синів Ізраїля. У листі про табори пустелі, написаному для Фабіоли, Єронім вважає Ріфму тим табором у пустелі Паран, про який ідеться в одному з попередніх розділів Книги Чисел, і зараховує до цієї пустелі всі вісімнадцять таборів від неї до Еціон-Гевера. Риммон-Перец він називає шістнадцятим табором і передає його назву як «поділ граната». Плід він тлумачить як образ Церкви, що вкриває однією шкіркою весь натовп віруючих, або багатьох чеснот, поєднаних у злагоді."
  es:
    - "Rimón-pérez, en la King James Version «Rimmon-parez», es un campamento de Israel en el desierto nombrado solo en el itinerario de Números 33, entre Ritma y Libna: «Y partidos de Ritma, asentaron en Rimmón-peres. Y partidos de Rimmón-peres, asentaron en Libna». El nombre significa algo como «granada de la brecha». No se le asocia ningún suceso, manantial ni accidente del terreno."
    - "Su emplazamiento se desconoce. El mapa señala tres conjeturas sin elegir: un punto a lo largo del Naqb al-Biyar, en las montañas del Sinaí al oeste del golfo de Aqaba, otro a lo largo del Wadi er-Rummun, en el Néguev central, cuyo nombre recuerda a Rimón, y el Rimón de Simeón en el norte del Néguev. Todas dependen de cómo se trace la ruta entera, que es en sí misma incierta."
    - "Los escritores cristianos antiguos añaden poco. En el Onomasticon de Eusebio el texto griego tiene aquí una laguna, y la versión latina de Jerónimo menciona el lugar solo como una estación de los hijos de Israel. En su carta sobre las estaciones del desierto, escrita para Fabiola, Jerónimo identifica Ritma con el campamento en el desierto de Parán que nombra un capítulo anterior de Números, y sitúa en ese desierto las dieciocho estaciones desde allí hasta Ezión-geber. Llama a Rimón-pérez la decimosexta estación y traduce su nombre como la división de la granada. Lee el fruto como figura de la Iglesia, que cubre con una sola corteza a toda la multitud de los creyentes, o de muchas virtudes unidas en armonía."
  pt:
    - "Rimom-Perez, na King James “Rimmon-parez”, é um acampamento de Israel no deserto citado apenas no itinerário de Números 33, entre Ritma e Libna: “Partiram de Ritmá e acamparam em Rimom-Perez. Partiram de Rimom-Perez e acamparam em Libna.” O nome significa algo como “romã da brecha”. Nenhum acontecimento, fonte ou marco lhe é associado."
    - "Seu local é desconhecido. O mapa marca três hipóteses sem escolher: um ponto ao longo do Naqb al-Biyar, nas montanhas do Sinai a oeste do golfo de Aqaba, outro ao longo do Wadi er-Rummun, no Neguebe central, cujo nome lembra Rimom, e a Rimom de Simeão, no norte do Neguebe. Todas dependem de como se traça toda a rota, o que é em si incerto."
    - "Os escritores cristãos antigos acrescentam pouco. No Onomasticon de Eusébio, o texto grego tem aqui uma lacuna, e a versão latina de Jerônimo menciona o lugar apenas como uma estação dos filhos de Israel. Em sua carta sobre as estações do deserto, escrita para Fabíola, Jerônimo identifica Ritma com o acampamento no deserto de Parã citado num capítulo anterior de Números, e situa nesse deserto as dezoito estações dali até Eziom-Geber. Chama Rimom-Perez de décima sexta estação e traduz seu nome como a divisão da romã. Lê o fruto como figura da Igreja, que cobre com uma só casca toda a multidão dos crentes, ou de muitas virtudes unidas em harmonia."
  de:
    - "Rimmon-Perez, in der King-James-Bibel „Rimmon-parez“, ist ein Lager Israels in der Wüste, nur in der Stationenliste von Numeri 33 zwischen Ritma und Libna genannt: „Von Rithma zogen sie aus und lagerten sich in Rimmon-Perez. Von Rimmon-Perez zogen sie aus und lagerten sich in Libna.“ Der Name bedeutet etwa „Granatapfel des Bruchs“. Kein Ereignis, keine Quelle und kein Wahrzeichen sind damit verbunden."
    - "Seine Lage ist unbekannt. Die Karte markiert drei Vermutungen, ohne zu wählen: einen Punkt am Naqb el-Biyar im Sinaigebirge westlich des Golfs von Akaba, einen am Wadi er-Rummun im zentralen Negev, dessen Name an Rimmon erinnert, und das Rimmon Simeons im nördlichen Negev. Alle hängen davon ab, wie die ganze Route gezeichnet wird, was selbst unsicher ist."
    - "Frühchristliche Schriftsteller fügen wenig hinzu. Im Onomastikon des Eusebius hat der griechische Text hier eine Lücke, und die lateinische Fassung des Hieronymus führt den Ort nur als Lagerstation der Kinder Israel. In seinem für Fabiola geschriebenen Brief über die Stationen der Wüste setzt Hieronymus Ritma mit dem Lager in der Wüste Paran gleich, das ein früheres Kapitel von Numeri nennt, und rechnet die achtzehn Stationen von dort bis Ezjon-Geber zu dieser Wüste. Rimmon-Perez nennt er die sechzehnte Station und gibt den Namen als Teilung des Granatapfels wieder. Die Frucht deutet er als Bild der Kirche, die die ganze Schar der Gläubigen mit einer Schale umhüllt, oder vieler Tugenden, die in Eintracht zusammengehalten werden."
  fr:
    - "Rimmon-Pérets, « Rimmon-parez » dans la King James Version, est un campement d’Israël dans le désert, nommé seulement dans l’itinéraire de Nombres 33, entre Rithma et Libna : « Ils partirent de Rithma, et campèrent à Rimmon-Pérets. Ils partirent de Rimmon-Pérets, et campèrent à Libna. » Le nom signifie à peu près « grenade de la brèche ». Aucun événement, source ou repère ne s’y rattache."
    - "Son site est inconnu. La carte marque trois conjectures sans choisir : un point le long du Naqb al-Biyar, dans les montagnes du Sinaï à l’ouest du golfe d’Aqaba, un autre le long du Wadi er-Rummun, dans le Négev central, dont le nom rappelle Rimmon, et le Rimmon de Siméon dans le nord du Négev. Toutes dépendent du tracé de l’ensemble de la route, lui-même incertain."
    - "Les auteurs chrétiens anciens ajoutent peu. Dans l’Onomasticon d’Eusèbe, le texte grec présente ici une lacune, et la version latine de Jérôme mentionne le lieu seulement comme une station des enfants d’Israël. Dans sa lettre sur les stations du désert, écrite pour Fabiola, Jérôme identifie Rithma au campement du désert de Paran nommé dans un chapitre antérieur des Nombres, et place dans ce désert les dix-huit stations de là jusqu’à Étsjon-Guéber. Il fait de Rimmon-Pérets la seizième station et rend son nom par la division de la grenade. Il lit le fruit comme une figure de l’Église, qui couvre d’une seule écorce toute la foule des croyants, ou de nombreuses vertus tenues ensemble dans l’harmonie."
  it:
    - "Rimmon-Peres, nella King James Version «Rimmon-parez», è un accampamento di Israele nel deserto nominato solo nell’itinerario di Numeri 33, tra Ritma e Libna: «Partirono da Rithma e si accamparono a Rimmon-Perets. Partirono da Rimmon-Perets e si accamparono a Libna.» Il nome significa qualcosa come «melograno della breccia». Nessun evento, sorgente o punto di riferimento vi è collegato."
    - "Il suo sito è ignoto. La mappa segna tre ipotesi senza sceglierne una: un punto lungo il Naqb al-Biyar sui monti del Sinai a ovest del Golfo di Aqaba, uno lungo il Wadi er-Rummun nel Negheb centrale, il cui nome richiama Rimmon, e il Rimmon di Simeone nel Negheb settentrionale. Tutte dipendono da come si traccia l’intero percorso, che è esso stesso incerto."
    - "Gli scrittori cristiani antichi aggiungono poco. Nell’Onomasticon di Eusebio il testo greco ha qui una lacuna, e la versione latina di Girolamo menziona il luogo solo come una stazione dei figli d’Israele. Nella sua lettera sulle stazioni del deserto, scritta per Fabiola, Girolamo identifica Ritma con l’accampamento nel deserto di Paran nominato in un capitolo precedente dei Numeri, e colloca in quel deserto le diciotto stazioni da lì fino a Ezion-Gheber. Chiama Rimmon-Peres la sedicesima stazione e rende il suo nome come la divisione del melograno. Legge il frutto come figura della Chiesa, che copre con una sola scorza tutta la folla dei credenti, o di molte virtù tenute insieme in armonia."
  pl:
    - "Rimmon-Peres, w Biblii Króla Jakuba „Rimmon-parez”, to obóz Izraela na pustyni, wymieniony tylko w itinerarium z Lb 33, między Retma a Libną: „A ruszywszy się z Retma, położyli się obozem w Remmon Fares. A ruszywszy się z Remmon Fares, położyli się obozem w Lebna”. Nazwa znaczy mniej więcej „granat wyłomu”. Z nią nie wiąże się żadne wydarzenie, źródło ani punkt orientacyjny."
    - "Jego położenie jest nieznane. Mapa zaznacza trzy przypuszczenia, nie rozstrzygając: punkt wzdłuż Nakb al-Bijar w górach Synaju na zachód od Zatoki Akaba, punkt wzdłuż Wadi er-Rummun w środkowym Negewie, którego nazwa przypomina Rimmon, oraz Rimmon Symeona w północnym Negewie. Wszystkie zależą od tego, jak narysuje się całą trasę, co samo jest niepewne."
    - "Pisarze wczesnochrześcijańscy dodają niewiele. W Onomastikonie Euzebiusza tekst grecki ma tu lukę, a łacińska wersja Hieronima wymienia to miejsce tylko jako postój synów Izraela. W liście o postojach na pustyni, napisanym dla Fabioli, Hieronim utożsamia Retma z obozem na pustyni Paran, o którym mówi jeden z wcześniejszych rozdziałów Księgi Liczb, i zalicza do tej pustyni osiemnaście postojów stamtąd aż do Esjon-Geber. Rimmon-Peres nazywa szesnastym postojem i oddaje jego nazwę jako podział granatu. Owoc odczytuje jako obraz Kościoła, który jedną skórką okrywa całą rzeszę wierzących, albo wielu cnót złączonych w harmonii."
  cs:
    - "Rimmon-peres, v King James Version „Rimmon-parez“, je tábor Izraele na poušti jmenovaný jen v itineráři Numeri 33, mezi Ritmou a Libnou: „A z Retma hnuvše se, položili se v Remmon Fáres. Potom hnuvše se z Remmon Fáres, položili se v Lebna.“ Jméno znamená něco jako „granátové jablko průlomu“. S ním není spojena žádná událost, pramen ani orientační bod."
    - "Jeho poloha je neznámá. Mapa vyznačuje tři dohady, aniž si vybírá: bod na Nakb al-Bijár v sinajských horách západně od Akabského zálivu, bod na Vádí er-Rummún v centrálním Negevu, jehož jméno připomíná Rimmon, a Rimmon Simeonův v severním Negevu. Všechny závisejí na tom, jak se zakreslí celá trasa, což je samo nejisté."
    - "Raně křesťanští autoři přidávají málo. V Onomastikonu Eusebia má řecký text na tomto místě mezeru a latinská verze Jeronýmova uvádí místo jen jako zastávku synů Izraele. Ve svém listu o zastávkách na poušti, napsaném pro Fabiolu, ztotožňuje Jeroným Ritmu s táborem na poušti Páran, o němž mluví jedna z dřívějších kapitol knihy Numeri, a řadí do této pouště osmnáct zastávek odtud až po Ecjon-geber. Rimmon-peres nazývá šestnáctou zastávkou a jeho jméno překládá jako rozdělení granátového jablka. Plod vykládá jako obraz církve, která jednou slupkou kryje celý zástup věřících, nebo mnoha ctností spojených v souladu."
  nl:
    - "Rimmon-Perez, in de King James Version “Rimmon-parez”, is een kamp van Israël in de woestijn dat alleen in de reisroute van Numeri 33 wordt genoemd, tussen Ritma en Libna: “En zij verreisden van Rithma, en legerden zich in Rimmon-Perez. En zij verreisden van Rimmon-Perez, en legerden zich in Libna.” De naam betekent zoiets als “granaatappel van de breuk”. Er is geen gebeurtenis, bron of oriëntatiepunt aan verbonden."
    - "De ligging is onbekend. De kaart wijst drie gissingen aan zonder te kiezen: een punt langs de Naqb al-Biyar in het Sinaïgebergte ten westen van de Golf van Akaba, een langs de Wadi er-Rummun in de centrale Negev, wier naam aan Rimmon doet denken, en het Rimmon van Simeon in de noordelijke Negev. Alle hangen af van hoe de hele route wordt getekend, wat zelf onzeker is."
    - "Vroegchristelijke schrijvers voegen weinig toe. In het Onomasticon van Eusebius heeft de Griekse tekst hier een leemte, en de Latijnse versie van Hiëronymus noemt de plaats alleen als een legerplaats van de kinderen Israëls. In zijn brief over de legerplaatsen in de woestijn, geschreven voor Fabiola, stelt Hiëronymus Ritma gelijk aan het kamp in de woestijn Paran dat een eerder hoofdstuk van Numeri noemt, en rekent hij de achttien legerplaatsen van daar tot Ezeon-Geber tot die woestijn. Rimmon-Perez noemt hij de zestiende legerplaats, en hij geeft de naam weer als de verdeling van de granaatappel. De vrucht leest hij als beeld van de kerk, die de hele menigte gelovigen met één schil bedekt, of van vele deugden die in harmonie samengehouden worden."
  sv:
    - "Rimmon-Peres, i King James-översättningen ”Rimmon-parez”, är ett av Israels läger i öknen, nämnt endast i vandringsförteckningen i 4 Mos 33, mellan Ritma och Livna: ”Och de bröto upp från Ritma och lägrade sig i Rimmon-Peres. Och de bröto upp från Rimmon-Peres och lägrade sig i Libna.” Namnet betyder ungefär ”granatäpplet vid bräschen”. Ingen händelse, källa eller landmärke är knuten till det."
    - "Dess läge är okänt. Kartan markerar tre gissningar utan att välja: en punkt längs Naqb al-Biyar i Sinaibergen väster om Akababukten, en längs Wadi er-Rummun i centrala Negev, vars namn påminner om Rimmon, och Simeons Rimmon i norra Negev. Alla beror på hur hela färdvägen dras, vilket i sig är osäkert."
    - "Fornkyrkliga författare tillför lite. I Eusebios Onomastikon har den grekiska texten en lucka här, och Hieronymus latinska version nämner platsen bara som ett lägerställe för Israels barn. I sitt brev om lägerplatserna i öknen, skrivet för Fabiola, likställer Hieronymus Ritma med lägret i Paranöknen som ett tidigare kapitel i Fjärde Moseboken nämner, och räknar de arton lägerplatserna därifrån till Esjon-Geber till denna öken. Rimmon-Peres kallar han den sextonde lägerplatsen, och han återger namnet som granatäpplets delning. Frukten tolkar han som en bild av kyrkan, som täcker hela skaran av troende med ett enda skal, eller av många dygder som hålls samman i harmoni."
  nb:
    - "Rimmon-Peres, i King James Version «Rimmon-parez», er en av Israels leirplasser i ørkenen, nevnt bare i ferdaberetningen i 4. Mosebok 33, mellom Ritma og Libna: «Og de drog fra Ritma og leiret sig i Rimmon-Peres. Og de drog fra Rimmon-Peres og leiret sig i Libna.» Navnet betyr noe i retning av «granateplet ved bruddet». Ingen hendelse, kilde eller landemerke er knyttet til det."
    - "Stedet er ukjent. Kartet markerer tre gjetninger uten å velge: et punkt langs Naqb al-Biyar i Sinai-fjellene vest for Aqababukta, ett langs Wadi er-Rummun i det sentrale Negev, hvis navn minner om Rimmon, og Simeons Rimmon i det nordlige Negev. Alle avhenger av hvordan hele ruten tegnes, noe som selv er usikkert."
    - "Oldkirkelige forfattere tilføyer lite. I Eusebios' Onomastikon har den greske teksten et hull her, og Hieronymus' latinske versjon nevner stedet bare som en leirplass for Israels barn. I sitt brev om leirplassene i ørkenen, skrevet for Fabiola, setter Hieronymus Ritma lik leiren i Paran-ørkenen som et tidligere kapittel i Fjerde Mosebok nevner, og regner de atten leirplassene derfra til Esjon-Geber til denne ørkenen. Rimmon-Peres kaller han den sekstende leirplassen, og han gjengir navnet som granateplets deling. Frukten tolker han som et bilde på kirken, som dekker hele mengden av troende med ett skall, eller på mange dyder som holdes sammen i harmoni."
  tl:
    - "Ang Rimmon-peres, “Rimmon-parez” sa King James Version, ay isang kampo ng Israel sa ilang na pinangalanan lamang sa itineraryo ng Mga Bilang 33, sa pagitan ng Ritma at Libna: “At sila'y naglakbay mula sa Ritma, at humantong sa Rimmon-peres. At sila'y naglakbay mula sa Rimmon-peres, at humantong sa Libna.” Ang pangalan ay nangangahulugang tulad ng “granada ng bitak”. Walang pangyayari, bukal o palatandaang nakakabit dito."
    - "Hindi alam ang lugar nito. Minamarkahan ng mapa ang tatlong hula nang hindi pumipili: isang punto sa tabi ng Naqb al-Biyar sa mga bundok ng Sinai sa kanluran ng Golpo ng Aqaba, isa sa tabi ng Wadi er-Rummun sa gitnang Negev, na ang pangalan ay nagpapaalala sa Rimmon, at ang Rimmon ng Simeon sa hilagang Negev. Nakasalalay ang lahat sa kung paano iguguhit ang buong ruta, na hindi rin tiyak."
    - "Kaunti ang idinaragdag ng mga sinaunang manunulat na Kristiyano. Sa Onomasticon ni Eusebio, may puwang dito ang tekstong Griyego, at binabanggit lamang ng Latin na bersiyon ni Jeronimo ang lugar bilang isang hintuan ng mga anak ni Israel. Sa kaniyang liham tungkol sa mga hintuan sa ilang, na isinulat para kay Fabiola, itinuturing ni Jeronimo na ang Ritma ay ang kampo sa ilang ng Paran na binabanggit sa isang naunang kabanata ng Mga Bilang, at ibinibilang niya sa ilang na iyon ang labing-walong hintuan mula roon hanggang Esion-geber. Tinatawag niya ang Rimmon-peres na ikalabing-anim na hintuan at isinasalin ang pangalan nito bilang paghahati ng granada. Binabasa niya ang bunga bilang larawan ng Iglesia, na nagtatakip sa buong karamihan ng mananampalataya sa iisang balat, o ng maraming kabanalan na pinagbubuklod sa pagkakasundo."
  da:
    - "Rimmon-Peres, i King James-oversættelsen »Rimmon-parez«, er en af Israels lejre i ørkenen, nævnt kun i rejseberetningen i 4 Mos 33, mellem Ritma og Libna: »Og de rejste fra Rithma, og de lejrede sig i Rimmon-Perez. Og de rejste fra Rimmon-Perez, og de lejrede sig i Libna.« Navnet betyder noget i retning af »bruddets granatæble«. Ingen begivenhed, kilde eller landemærke er knyttet til det."
    - "Dets sted er ukendt. Kortet markerer tre gæt uden at vælge: et punkt langs Naqb al-Biyar i Sinaibjergene vest for Aqababugten, et langs Wadi er-Rummun i det centrale Negev, hvis navn minder om Rimmon, og Simeons Rimmon i det nordlige Negev. Alle afhænger af, hvordan hele ruten tegnes, hvilket i sig selv er usikkert."
    - "Oldkirkelige forfattere tilføjer kun lidt. I Eusebios' Onomastikon har den græske tekst et hul her, og Hieronymus' latinske version nævner stedet blot som en lejrplads for Israels børn. I sit brev om lejrpladserne i ørkenen, skrevet til Fabiola, sætter Hieronymus Ritma lig med lejren i Paran-ørkenen, som et tidligere kapitel i Fjerde Mosebog nævner, og regner de atten lejrpladser derfra til Esjon-Geber til denne ørken. Rimmon-Peres kalder han den sekstende lejrplads, og han gengiver navnet som granatæblets deling. Frugten tolker han som et billede på kirken, der dækker hele mængden af troende med én skal, eller på mange dyder, der holdes sammen i harmoni."
  sr:
    - "Римон-Перес, у Библији краља Џејмса „Римон-Парез“, јесте израиљски логор у пустињи поменут само у попису из 33. главе Књиге бројева, између Ратама и Ливне: „А из Ратама отишавши стадоше у логор у Ремнон-Фаресу. А из Ремнон-Фареса отишавши стадоше у логор у Лемвону.“ Име значи отприлике „нар пробоја“. Ни догађај, ни извор, ни обележје није везано за њега."
    - "Његово место је непознато. Карта означава три нагађања не бирајући: тачку дуж Накб ел-Бијара у синајским планинама западно од Акапског залива, једну дуж Вади ер-Румана у средњем Негеву, чије име подсећа на Римон, и Римон Симеунов у северном Негеву. Сва зависе од тога како се црта читав пут, што је и само неизвесно."
    - "Ранохришћански писци додају мало. У Јевсевијевом Ономастикону грчки текст овде има празнину, а Јеронимова латинска верзија помиње место само као логор синова Израиљевих. У свом писму о логорима у пустињи, написаном за Фабиолу, Јероним поистовећује Ратам с логором у пустињи Фарану, који помиње једно раније поглавље Књиге бројева, и убраја у ту пустињу осамнаест логора одатле до Есион-Гавера. Римон-Перес назива шеснаестим логором и његово име преводи као подела нара. Плод тумачи као слику Цркве, која једном кором покрива цело мноштво верних, или многих врлина повезаних у слози."
  hu:
    - "Rimmón-Pérec, a King James Version-ben „Rimmon-parez”, Izráel pusztai tábora, amelyet csak a 4Móz 33 útleírása említ Ritma és Libna között: „elindulának Rithmából, és tábort ütének Rimmon-Péreczben. És elindulának Rimmon-Péreczből, és tábort ütének Libnában.” A név nagyjából „a rés gránátalmáját” jelenti. Semmilyen esemény, forrás vagy ismertetőjel nem kapcsolódik hozzá."
    - "Helye ismeretlen. A térkép három találgatást jelöl választás nélkül: egy pontot a Naqb al-Biyar mentén az Akabai-öböltől nyugatra fekvő Sínai-hegységben, egyet a Wadi er-Rummun mentén a Negev közepén, amelynek neve Rimmónra emlékeztet, és a simeoniták Rimmónját az északi Negevben. Mind azon múlik, hogyan húzzák meg az egész útvonalat, ami maga is bizonytalan."
    - "A korai keresztény írók keveset tesznek hozzá. Eusebius Onomasztikonjában a görög szöveg itt hiányos, és Jeromos latin változata a helyet csupán Izráel fiai egyik táborhelyeként említi. A pusztai táborhelyekről szóló, Fabiolának írt levelében Jeromos Ritmát azonosítja a Párán pusztájában lévő táborral, amelyet Mózes negyedik könyvének egy korábbi fejezete említ, és ehhez a pusztához számítja az innen Ecjón-Gébérig tartó tizennyolc táborhelyet. Rimmón-Pérecet a tizenhatodik táborhelynek nevezi, nevét pedig a gránátalma megosztásaként adja vissza. A gyümölcsöt az egyház képének tekinti, amely egyetlen héjjal takarja be a hívők egész sokaságát, vagy a sok, összhangban egybetartott erény képének."
  fi:
    - "Rimmon-Peres, King James -käännöksessä ”Rimmon-parez”, on Israelin erämaaleiri, joka mainitaan vain 4. Mooseksen kirjan 33. luvun reittiluettelossa Ritman ja Libnan välissä: ”Ja he lähtivät Ritmasta ja leiriytyivät Rimmon-Perekseen. Ja he lähtivät Rimmon-Pereksestä ja leiriytyivät Libnaan.” Nimi merkitsee jotakuinkin ”murtuman granaattiomenaa”. Siihen ei liity tapahtumaa, lähdettä eikä maamerkkiä."
    - "Sen sijainti on tuntematon. Kartta merkitsee kolme arvausta valitsematta: pisteen Naqb al-Biyarin varrella Siinain vuorilla Akabanlahden länsipuolella, pisteen Wadi er-Rummunin varrella Keski-Negevissä, jonka nimi muistuttaa Rimmonia, ja Simeonin Rimmonin Pohjois-Negevissä. Kaikki riippuvat siitä, miten koko reitti piirretään, mikä on itsekin epävarmaa."
    - "Varhaiskristilliset kirjoittajat lisäävät vähän. Eusebioksen Onomastikonissa kreikkalaisessa tekstissä on tässä aukko, ja Hieronymuksen latinalainen versio mainitsee paikan vain Israelin lasten leiripaikkana. Fabiolalle kirjoittamassaan kirjeessä erämaan leiripaikoista Hieronymus samastaa Ritman siihen Paranin erämaan leiriin, jonka Neljännen Mooseksen kirjan eräs aiempi luku mainitsee, ja lukee tähän erämaahan kuuluviksi kaikki kahdeksantoista leiripaikkaa sieltä Esjon-Geberiin. Rimmon-Peresiä hän kutsuu kuudenneksitoista leiripaikaksi ja kääntää sen nimen granaattiomenan jakamiseksi. Hedelmän hän tulkitsee kuvaksi kirkosta, joka peittää yhdellä kuorella koko uskovien joukon, tai monista hyveistä, joita pidetään yhdessä sopusoinnussa."
  vi:
    - "Rim-môn Phê-rết, trong bản King James là “Rimmon-parez”, là một nơi đóng trại của Y-sơ-ra-ên trong đồng vắng, chỉ được nêu trong bản hành trình ở Dân Số Ký 33, giữa Rít-ma và Líp-na: “Đi từ Rít-ma và đóng trại tại Ri-môn Phê-rết. Đi từ Ri-môn-Phê-rết và đóng trại tại Líp-na.” Tên có nghĩa đại khái là “quả lựu của chỗ vỡ”. Không có sự kiện, suối hay mốc nào gắn với nó."
    - "Vị trí của nó chưa được biết. Bản đồ đánh dấu ba phỏng đoán mà không chọn: một điểm dọc Naqb al-Biyar trong dãy núi Sinai phía tây vịnh Aqaba, một điểm dọc Wadi er-Rummun ở trung Negev, có tên gợi đến Rim-môn, và Rim-môn của Si-mê-ôn ở bắc Negev. Tất cả đều phụ thuộc vào cách vẽ toàn bộ lộ trình, vốn cũng không chắc chắn."
    - "Các tác giả Cơ Đốc giáo thời đầu không thêm được bao nhiêu. Trong Onomasticon của Eusebius, văn bản Hy Lạp có một chỗ khuyết ở đây, và bản tiếng Latinh của Jerome chỉ ghi nơi này là một chặng đóng trại của con cái Y-sơ-ra-ên. Trong thư về các chặng đóng trại trong đồng vắng, viết cho Fabiola, Jerome đồng nhất Rít-ma với nơi đóng trại trong đồng vắng Pha-ran được nêu ở một chương trước của sách Dân Số Ký, và xếp mười tám chặng từ đó đến Ê-xi-ôn-Ghê-be vào đồng vắng ấy. Ông gọi Rim-môn Phê-rết là chặng thứ mười sáu và dịch tên nó là sự phân chia quả lựu. Ông đọc trái lựu như hình ảnh của Hội Thánh, che phủ cả đoàn tín hữu dưới một lớp vỏ, hoặc của nhiều nhân đức được giữ chung trong hòa hợp."
  ro:
    - "Rimon-Pereț, în versiunea King James „Rimmon-parez”, este o tabără a lui Israel în pustie, numită doar în itinerarul din Numeri 33, între Ritma și Libna: „Și au purces din Ratamà, și au tăbărît în Remmon Fares. Și au purces din Remmon Fares, și au tăbărît în Levonà.” Numele înseamnă aproximativ „rodia spărturii”. Niciun eveniment, izvor sau reper nu este legat de ea."
    - "Locul ei este necunoscut. Harta marchează trei presupuneri fără a alege: un punct de-a lungul Naqb al-Biyar, în munții Sinai la vest de Golful Aqaba, unul de-a lungul Wadi er-Rummun din centrul Neghevului, al cărui nume amintește de Rimon, și Rimonul lui Simeon din nordul Neghevului. Toate depind de felul în care este trasat întregul traseu, care este el însuși nesigur."
    - "Scriitorii creștini timpurii adaugă puțin. În Onomasticonul lui Eusebiu, textul grecesc are aici o lacună, iar versiunea latină a lui Ieronim pomenește locul doar ca un popas al fiilor lui Israel. În scrisoarea sa despre popasurile din pustie, scrisă pentru Fabiola, Ieronim identifică Ritma cu tabăra din pustia Paran numită într-un capitol anterior din Numeri și socotește cele optsprezece popasuri de acolo până la Ețion-Gheber ca aflându-se în această pustie. Numește Rimon-Pereț al șaisprezecelea popas și redă numele prin împărțirea rodiei. Citește fructul ca pe o imagine a Bisericii, care acoperă cu o singură coajă toată mulțimea credincioșilor, sau a multor virtuți ținute laolaltă în armonie."
  bg:
    - "Римон-Перец, в Библията на крал Джеймс „Rimmon-parez“, е стан на Израил в пустинята, назован само в маршрута от Числа 33, между Ритма и Ливна: „И като се дигнаха от Ритма разположиха стан в Римон-фарес. И като се дигнаха от Римон-фарес разположиха стан в Ливна.“ Името означава нещо като „нарът на пролома“. Към него не е свързано никакво събитие, извор или ориентир."
    - "Местоположението му е неизвестно. Картата отбелязва три предположения, без да избира: точка по Накб ал-Бияр в Синайските планини на запад от залива Акаба, една по Уади ер-Румун в централния Негев, чието име напомня Римон, и Римон на Симеон в северния Негев. Всички зависят от това как се чертае целият маршрут, който сам по себе си е несигурен."
    - "Раннохристиянските автори добавят малко. В Ономастикона на Евсевий гръцкият текст тук има празнина, а латинската версия на Йероним споменава мястото само като стан на синовете на Израил. В писмото си за становете в пустинята, написано за Фабиола, Йероним отъждествява Ритма със стана в пустинята Фаран, споменат в една от предишните глави на Числа, и отнася към тази пустиня осемнайсетте стана оттам до Ецион-Гавер. Римон-Перец той нарича шестнайсети стан и предава името му като разделяне на нара. Плода тълкува като образ на Църквата, която покрива с една кора цялото множество вярващи, или на много добродетели, свързани в съгласие."
scripture:
  - Num.33.19-Num.33.20
  - Num.12.16
sources:
