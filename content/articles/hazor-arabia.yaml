# Overview article (ADR 0007). Mainstream facts only; this is the Arabian Hazor of Jeremiah 49, not the Galilean city; its nature as a collective name is given as the usual reading; Nebuchadnezzar's raid is dated by the Babylonian Chronicle.
id: hazor-arabia
place: a3088c2
title:
  en: "Hazor in Arabia"
  ru: "Асор в Аравии"
body:
  en:
    - "This Hazor is not the great city of Galilee but a name in Jeremiah's oracle against the Arabs: “Concerning Kedar, and concerning the kingdoms of Hazor, which Nebuchadrezzar king of Babylon shall smite”. The people meant live in tents with flocks and camels, are “the men of the east”, and “have neither gates nor bars, which dwell alone”. The Hebrew name is related to the word for the unwalled settlements of the desert, and most readers take “the kingdoms of Hazor” not as one town but as the half-settled Arab communities of the north Arabian desert east of Edom and Moab, the oases and encampments that went with the tents of Kedar; others think of a particular place in the same region. The map marks it as a region near Dumat al-Jandal, the ancient Adummatu, a stronghold of the Arabs of Kedar."
    - "The oracle warns, “Flee, get you far off, dwell deep, O ye inhabitants of Hazor, saith the LORD; for Nebuchadrezzar king of Babylon hath taken counsel against you”, and ends, “Hazor shall be a dwelling for dragons, and a desolation for ever: there shall no man abide there”. The Babylonian Chronicle records that in his sixth year, 599/8 BC, Nebuchadnezzar sent his troops out from Syria into the desert, where they plundered the Arabs and their flocks; the raid belongs to the winter after Jehoiakim's revolt, and Jeremiah's words are usually read beside it."
    - "No site bears the name, and nothing has been excavated as Hazor of Arabia. The region is the north of Saudi Arabia today, the oasis of al-Jawf with Dumat al-Jandal, its castle of Marid and its ancient well, and the Jordanian desert east of Karak and Ma'an, where Bedouin still pitch black tents of goat hair."
  ru:
    - "Этот Асор — не великий город Галилеи, а имя в пророчестве Иеремии об арабах: «О Кидаре и о царствах Асорских, которые поразил Навуходоносор, царь Вавилонский». Люди, о которых идёт речь, живут в шатрах с овцами и верблюдами, к ним обращён призыв «опустошайте сыновей востока», и «ни дверей, ни запоров нет у него, живут поодиночке». Еврейское имя родственно слову, означающему неогороженные поселения пустыни, и большинство читателей понимают «царства Асорские» не как один город, а как полуоседлые арабские общины северо-аравийской пустыни к востоку от Едома и Моава, оазисы и стоянки, что шли вместе с шатрами Кидара; другие думают об определённом месте в тех же краях. На карте он отмечен как область близ Думат-эль-Джандаля, древней Адумматту, оплота арабов Кидара."
    - "Пророчество предупреждает: «Бегите, уходите скорее, сокройтесь в пропасти, жители Асора, говорит Господь, ибо Навуходоносор, царь Вавилонский, сделал решение о вас», и кончается словами: «И будет Асор жилищем шакалов, вечною пустынею; человек не будет жить там». Вавилонская хроника записывает, что в шестой год, 599/8 г. до н. э., Навуходоносор выслал войска из Сирии в пустыню, где они ограбили арабов и их стада; набег приходится на зиму после мятежа Иоакима, и слова Иеремии обычно читают рядом с ним."
    - "Ни одно место не носит этого имени, и ничего не раскопано как аравийский Асор. Этот край сегодня — север Саудовской Аравии, оазис Эль-Джауф с Думат-эль-Джандалем, его замком Марид и древним колодцем, и иорданская пустыня к востоку от Карака и Маана, где бедуины до сих пор ставят чёрные шатры из козьей шерсти."
scripture:
  - Jer.49.28-Jer.49.33
sources:
