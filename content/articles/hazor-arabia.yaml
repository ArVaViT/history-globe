# Overview article (ADR 0007). Mainstream facts only; this is the Arabian Hazor of Jeremiah 49, not the Galilean city; its nature as a collective name is given as the usual reading; Nebuchadnezzar's raid is dated by the Babylonian Chronicle.
id: hazor-arabia
place: a3088c2
title:
  en: "Hazor in Arabia"
  ru: "Асор в Аравии"
  uk: "Гацор в Аравії"
  es: "Hazor en Arabia"
  pt: "Hazor na Arábia"
  de: "Hazor in Arabien"
  fr: "Hatsor d’Arabie"
body:
  en:
    - "This Hazor is not the great city of Galilee but a name in Jeremiah's oracle against the Arabs: “Concerning Kedar, and concerning the kingdoms of Hazor, which Nebuchadrezzar king of Babylon shall smite”. The people meant live in tents with flocks and camels, are “the men of the east”, and “have neither gates nor bars, which dwell alone”. The Hebrew name is related to the word for the unwalled settlements of the desert, and most readers take “the kingdoms of Hazor” not as one town but as the half-settled Arab communities of the north Arabian desert east of Edom and Moab, the oases and encampments that went with the tents of Kedar; others think of a particular place in the same region. The map marks it as a region near Dumat al-Jandal, the ancient Adummatu, a stronghold of the Arabs of Kedar."
    - "The oracle warns, “Flee, get you far off, dwell deep, O ye inhabitants of Hazor, saith the LORD; for Nebuchadrezzar king of Babylon hath taken counsel against you”, and ends, “Hazor shall be a dwelling for dragons, and a desolation for ever: there shall no man abide there”. The Babylonian Chronicle records that in his sixth year, 599/8 BC, Nebuchadnezzar sent his troops out from Syria into the desert, where they plundered the Arabs and their flocks; the raid belongs to the winter after Jehoiakim's revolt, and Jeremiah's words are usually read beside it."
    - "No site bears the name, and nothing has been excavated as Hazor of Arabia. The region is the north of Saudi Arabia today, the oasis of al-Jawf with Dumat al-Jandal, its castle of Marid and its ancient well, and the Jordanian desert east of Karak and Ma'an, where Bedouin still pitch black tents of goat hair."
  ru:
    - "Этот Асор — не великий город Галилеи, а имя в пророчестве Иеремии об арабах: «О Кидаре и о царствах Асорских, которые поразил Навуходоносор, царь Вавилонский». Люди, о которых идёт речь, живут в шатрах с овцами и верблюдами, к ним обращён призыв «опустошайте сыновей востока», и «ни дверей, ни запоров нет у него, живут поодиночке». Еврейское имя родственно слову, означающему неогороженные поселения пустыни, и большинство читателей понимают «царства Асорские» не как один город, а как полуоседлые арабские общины северо-аравийской пустыни к востоку от Едома и Моава, оазисы и стоянки, что шли вместе с шатрами Кидара; другие думают об определённом месте в тех же краях. На карте он отмечен как область близ Думат-эль-Джандаля, древней Адумматту, оплота арабов Кидара."
    - "Пророчество предупреждает: «Бегите, уходите скорее, сокройтесь в пропасти, жители Асора, говорит Господь, ибо Навуходоносор, царь Вавилонский, сделал решение о вас», и кончается словами: «И будет Асор жилищем шакалов, вечною пустынею; человек не будет жить там». Вавилонская хроника записывает, что в шестой год, 599/8 г. до н. э., Навуходоносор выслал войска из Сирии в пустыню, где они ограбили арабов и их стада; набег приходится на зиму после мятежа Иоакима, и слова Иеремии обычно читают рядом с ним."
    - "Ни одно место не носит этого имени, и ничего не раскопано как аравийский Асор. Этот край сегодня — север Саудовской Аравии, оазис Эль-Джауф с Думат-эль-Джандалем, его замком Марид и древним колодцем, и иорданская пустыня к востоку от Карака и Маана, где бедуины до сих пор ставят чёрные шатры из козьей шерсти."
  uk:
    - "Цей Гацор — не велике місто Галілеї, а назва в оракулі Єремії проти арабів: «Про Кедар і про царства Азорські, що (опісля) звоював Навуходонозор, царь Вавилонський». Мешканці, про яких ідеться, живуть у наметах з отарами й верблюдами, це «осадники восточні», і в них «нема ... нї дверей, нї засовів, що живуть (кочуючи) особняком». Давньоєврейська назва пов’язана зі словом для необнесених поселень пустелі, і більшість читачів розуміють «царства Азорські» не як одне місто, а як напівосілі арабські общини північноаравійської пустелі на схід від Едому й Моава, оази й стоянки, що йшли разом із наметами Кедару; інші думають про окреме місце в тому ж краї. Карта позначає його як область поблизу Думат-аль-Джандаль, давнього Адумату, твердині арабів Кедару."
    - "Оракул застерігає: «Біжіте, втїкайте хутко, ховайтесь глибоко в печерах, осадники Азорські, говорить Господь: Навуходонозор бо, царь Вавилонський, повзяв постанову й задумав проти вас задум», і закінчується: «Азор же буде леговищем шакалам, вічною пустинею; нїхто там не буде жити». Вавилонська хроніка записує, що шостого року, 599/8 р. до н. е., Навуходоносор послав війська з Сирії в пустелю, де вони пограбували арабів і їхні отари; цей набіг належить до зими після повстання Йоакима, і слова Єремії зазвичай читають поряд з ним."
    - "Жодне місце не носить цієї назви, і нічого не розкопано як Гацор Аравійський. Цей край сьогодні — північ Саудівської Аравії, оаза Ель-Джауф з Думат-аль-Джандаль, її замком Марід і давньою криницею, та йорданська пустеля на схід від Кераку й Маана, де бедуїни досі ставлять чорні намети з козячої вовни."
  es:
    - "Este Hazor no es la gran ciudad de Galilea, sino un nombre del oráculo de Jeremías contra los árabes: «De Cedar y de los reinos de Hasor, los cuales hirió Nabucodonosor rey de Babilonia». El pueblo aludido vive en tiendas con rebaños y camellos, son «los hijos de oriente», y «ni tienen puertas ni cerrojos, que viven solitarios». El nombre hebreo se relaciona con la palabra para los poblados sin muralla del desierto, y la mayoría de los lectores toman «los reinos de Hasor» no por una sola población sino por las comunidades árabes seminómadas del desierto del norte de Arabia, al este de Edom y Moab, los oasis y campamentos que acompañaban a las tiendas de Cedar; otros piensan en un lugar concreto de la misma región. El mapa lo señala como una región cercana a Dumat al-Jandal, la antigua Adummatu, una plaza fuerte de los árabes de Cedar."
    - "El oráculo advierte: «Huid, trasponeos muy lejos, meteos en simas para estar, oh moradores de Hasor, dice Jehová; porque tomó consejo contra vosotros Nabucodonosor rey de Babilonia», y termina: «Y Hasor será morada de chacales, soledad para siempre: ninguno morará allí». La Crónica babilónica registra que en su sexto año, 599/8 a. C., Nabucodonosor envió sus tropas desde Siria al desierto, donde saquearon a los árabes y sus rebaños; la incursión pertenece al invierno posterior a la rebelión de Joacim, y las palabras de Jeremías suelen leerse junto a ella."
    - "Ningún sitio lleva el nombre, y nada se ha excavado como Hazor de Arabia. La región es hoy el norte de Arabia Saudí, el oasis de al-Jawf con Dumat al-Jandal, su castillo de Marid y su antiguo pozo, y el desierto jordano al este de Karak y Ma'an, donde los beduinos siguen plantando tiendas negras de pelo de cabra."
  pt:
    - "Este Hazor não é a grande cidade da Galileia, mas um nome no oráculo de Jeremias contra os árabes: “A respeito de Quedar e dos reinos de Hazor, que Nabucodonosor, rei da Babilônia, atacou”. O povo em questão vive em tendas, com rebanhos e camelos, são “os filhos do oriente” e formam “uma nação que não tem portões nem trancas e vive isolada”. O nome hebraico se relaciona com a palavra para os povoados sem muralha do deserto, e a maioria dos leitores toma “os reinos de Hazor” não como uma cidade, mas como as comunidades semissedentárias árabes do deserto da Arábia setentrional, a leste de Edom e Moabe, os oásis e acampamentos que acompanhavam as tendas de Quedar; outros pensam num lugar particular da mesma região. O mapa a marca como região perto de Dumat al-Jandal, a antiga Adummatu, um reduto dos árabes de Quedar."
    - "O oráculo adverte: “Fujam! Fujam para bem longe! Refugiem-se nas profundezas, habitantes de Hazor”, diz o SENHOR, “pois Nabucodonosor, rei da Babilônia, planejou contra vocês”, e termina: “Hazor se tornará morada de chacais, uma desolação para sempre. Ninguém habitará ali”. A Crônica Babilônica registra que em seu sexto ano, 599/8 a.C., Nabucodonosor enviou suas tropas da Síria ao deserto, onde saquearam os árabes e seus rebanhos; a incursão pertence ao inverno depois da revolta de Jeoaquim, e as palavras de Jeremias costumam ser lidas ao lado dela."
    - "Nenhum sítio traz o nome, e nada foi escavado como Hazor da Arábia. A região é hoje o norte da Arábia Saudita, o oásis de al-Jawf com Dumat al-Jandal, seu castelo de Marid e seu antigo poço, e o deserto jordaniano a leste de Karak e Ma’an, onde beduínos ainda armam tendas negras de pelo de cabra."
  de:
    - "Dieses Hazor ist nicht die große Stadt Galiläas, sondern ein Name in Jeremias Orakel gegen die Araber: „Wider Kedar und die Königreiche Hazors, welche Nebukadnezar, der König zu Babel, schlug.“ Die gemeinten Leute leben in Zelten mit Herden und Kamelen, sind die, „die gegen Morgen wohnen“, und „haben weder Tür noch Riegel und wohnen allein“. Der hebräische Name hängt mit dem Wort für die unummauerten Siedlungen der Wüste zusammen, und die meisten Leser verstehen „die Königreiche Hazors“ nicht als eine Stadt, sondern als die halbsesshaften arabischen Gemeinschaften der nordarabischen Wüste östlich von Edom und Moab, die Oasen und Lagerplätze, die zu den Zelten Kedars gehörten; andere denken an einen bestimmten Ort in derselben Gegend. Die Karte markiert es als Gebiet nahe Dumat al-Dschandal, dem antiken Adummatu, einer Festung der Araber von Kedar."
    - "Das Orakel warnt: „Fliehet, hebet euch eilends davon, verkriechet euch tief, ihr Einwohner in Hazor! spricht der HERR; denn Nebukadnezar, der König zu Babel, hat etwas im Sinn wider euch“, und endet: „daß Hazor soll eine Wohnung der Schakale und eine ewige Wüste werden, daß niemand daselbst wohne“. Die Babylonische Chronik verzeichnet, dass Nebukadnezar in seinem sechsten Jahr, 599/8 v. Chr., seine Truppen aus Syrien in die Wüste schickte, wo sie die Araber und ihre Herden plünderten; der Raubzug gehört in den Winter nach Jojakims Aufstand, und Jeremias Worte werden meist neben ihm gelesen."
    - "Keine Stätte trägt den Namen, und nichts ist als Hazor in Arabien ausgegraben worden. Die Gegend ist heute der Norden Saudi-Arabiens, die Oase al-Dschauf mit Dumat al-Dschandal, seiner Burg Marid und seinem antiken Brunnen, und die jordanische Wüste östlich von Karak und Ma'an, wo Beduinen noch schwarze Zelte aus Ziegenhaar aufschlagen."
  fr:
    - "Ce Hatsor n’est pas la grande ville de Galilée mais un nom dans l’oracle de Jérémie contre les Arabes : « Sur Kédar et les royaumes de Hatsor, que battit Nebucadnetsar, roi de Babylone ». Le peuple visé vit sous la tente avec ses troupeaux et ses chameaux, ce sont « les fils de l’Orient », et « elle n’a ni portes, ni barres, elle habite solitaire ». Le nom hébreu est apparenté au mot désignant les établissements sans murs du désert, et la plupart des lecteurs prennent « les royaumes de Hatsor » non pour une ville mais pour les communautés arabes semi-sédentaires du désert d’Arabie du nord, à l’est d’Édom et de Moab ; d’autres pensent à un lieu précis de la même région. La carte le marque comme une région près de Dumat al-Jandal, l’ancienne Adummatu, place forte des Arabes de Kédar."
    - "L’oracle avertit : « Fuyez, fuyez de toutes vos forces, cherchez à l’écart une demeure, habitants de Hatsor ! dit l’Éternel ; car Nebucadnetsar, roi de Babylone, a pris une résolution contre vous », et s’achève : « Hatsor sera le repaire des chacals, un désert pour toujours ; personne n’y habitera, aucun homme n’y séjournera. » La Chronique babylonienne note que, la sixième année, en 599/8 av. J.-C., Nebucadnetsar envoya ses troupes de Syrie dans le désert, où elles pillèrent les Arabes et leurs troupeaux ; le raid appartient à l’hiver suivant la révolte de Jojakim, et les paroles de Jérémie se lisent d’ordinaire à côté."
    - "Aucun site ne porte le nom, et rien n’a été fouillé comme Hatsor d’Arabie. La région est aujourd’hui le nord de l’Arabie saoudite, l’oasis d’al-Jawf avec Dumat al-Jandal, son château de Marid et son puits antique, et le désert jordanien à l’est de Karak et de Ma’an, où les Bédouins dressent encore des tentes noires en poil de chèvre."
