# Overview article (ADR 0007). Mainstream facts only; this is the Arabian Hazor of Jeremiah 49, not the Galilean city; its nature as a collective name is given as the usual reading; Nebuchadnezzar's raid is dated by the Babylonian Chronicle.
id: hazor-arabia
place: a3088c2
title:
  en: "Hazor in Arabia"
  ru: "Асор в Аравии"
  uk: "Гацор в Аравії"
  es: "Hazor en Arabia"
  pt: "Hazor na Arábia"
  de: "Hazor in Arabien"
  fr: "Hatsor d’Arabie"
  pl: "Chasor w Arabii"
  it: "Asor in Arabia"
  nl: "Hazor in Arabië"
  cs: "Chacor v Arábii"
  sv: "Hasor i Arabien"
  nb: "Hasor i Arabia"
  tl: "Hasor sa Arabia"
  da: "Hazor i Arabien"
body:
  en:
    - "This Hazor is not the great city of Galilee but a name in Jeremiah's oracle against the Arabs: “Concerning Kedar, and concerning the kingdoms of Hazor, which Nebuchadrezzar king of Babylon shall smite”. The people meant live in tents with flocks and camels, are “the men of the east”, and “have neither gates nor bars, which dwell alone”. The Hebrew name is related to the word for the unwalled settlements of the desert, and most readers take “the kingdoms of Hazor” not as one town but as the half-settled Arab communities of the north Arabian desert east of Edom and Moab, the oases and encampments that went with the tents of Kedar; others think of a particular place in the same region. The map marks it as a region near Dumat al-Jandal, the ancient Adummatu, a stronghold of the Arabs of Kedar."
    - "The oracle warns, “Flee, get you far off, dwell deep, O ye inhabitants of Hazor, saith the LORD; for Nebuchadrezzar king of Babylon hath taken counsel against you”, and ends, “Hazor shall be a dwelling for dragons, and a desolation for ever: there shall no man abide there”. The Babylonian Chronicle records that in his sixth year, 599/8 BC, Nebuchadnezzar sent his troops out from Syria into the desert, where they plundered the Arabs and their flocks; the raid falls in the years of Jehoiakim's revolt, and Jeremiah's words are usually read beside it."
    - "No site bears the name, and nothing has been excavated as Hazor of Arabia. The region is the north of Saudi Arabia today, the oasis of al-Jawf with Dumat al-Jandal, its castle of Marid and its ancient well, and the Jordanian desert east of Karak and Ma'an, where Bedouin still pitch black tents of goat hair."
  ru:
    - "Этот Асор — не великий город Галилеи, а имя в пророчестве Иеремии об арабах: «О Кидаре и о царствах Асорских, которые поразил Навуходоносор, царь Вавилонский». Люди, о которых идёт речь, живут в шатрах с овцами и верблюдами, к ним обращён призыв «опустошайте сыновей востока», и «ни дверей, ни запоров нет у него, живут поодиночке». Еврейское имя родственно слову, означающему неогороженные поселения пустыни, и большинство читателей понимают «царства Асорские» не как один город, а как полуоседлые арабские общины северо-аравийской пустыни к востоку от Едома и Моава, оазисы и стоянки, что шли вместе с шатрами Кидара; другие думают об определённом месте в тех же краях. На карте он отмечен как область близ Думат-эль-Джандаля, древней Адумматту, оплота арабов Кидара."
    - "Пророчество предупреждает: «Бегите, уходите скорее, сокройтесь в пропасти, жители Асора, говорит Господь, ибо Навуходоносор, царь Вавилонский, сделал решение о вас», и кончается словами: «И будет Асор жилищем шакалов, вечною пустынею; человек не будет жить там». Вавилонская хроника записывает, что в шестой год, 599/8 г. до н. э., Навуходоносор выслал войска из Сирии в пустыню, где они ограбили арабов и их стада; набег приходится на годы мятежа Иоакима, и слова Иеремии обычно читают рядом с ним."
    - "Ни одно место не носит этого имени, и ничего не раскопано как аравийский Асор. Этот край сегодня — север Саудовской Аравии, оазис Эль-Джауф с Думат-эль-Джандалем, его замком Марид и древним колодцем, и иорданская пустыня к востоку от Карака и Маана, где бедуины до сих пор ставят чёрные шатры из козьей шерсти."
  uk:
    - "Цей Гацор — не велике місто Галілеї, а назва в оракулі Єремії проти арабів: «Про Кедар і про царства Азорські, що (опісля) звоював Навуходонозор, царь Вавилонський». Мешканці, про яких ідеться, живуть у наметах з отарами й верблюдами, це «осадники восточні», і в них «нема ... нї дверей, нї засовів, що живуть (кочуючи) особняком». Давньоєврейська назва пов’язана зі словом для необнесених поселень пустелі, і більшість читачів розуміють «царства Азорські» не як одне місто, а як напівосілі арабські общини північноаравійської пустелі на схід від Едому й Моава, оази й стоянки, що йшли разом із наметами Кедару; інші думають про окреме місце в тому ж краї. Карта позначає його як область поблизу Думат-аль-Джандаль, давнього Адумату, твердині арабів Кедару."
    - "Оракул застерігає: «Біжіте, втїкайте хутко, ховайтесь глибоко в печерах, осадники Азорські, говорить Господь: Навуходонозор бо, царь Вавилонський, повзяв постанову й задумав проти вас задум», і закінчується: «Азор же буде леговищем шакалам, вічною пустинею; нїхто там не буде жити». Вавилонська хроніка записує, що шостого року, 599/8 р. до н. е., Навуходоносор послав війська з Сирії в пустелю, де вони пограбували арабів і їхні отари; цей набіг припадає на роки повстання Йоакима, і слова Єремії зазвичай читають поряд з ним."
    - "Жодне місце не носить цієї назви, і нічого не розкопано як Гацор Аравійський. Цей край сьогодні — північ Саудівської Аравії, оаза Ель-Джауф з Думат-аль-Джандаль, її замком Марід і давньою криницею, та йорданська пустеля на схід від Кераку й Маана, де бедуїни досі ставлять чорні намети з козячої вовни."
  es:
    - "Este Hazor no es la gran ciudad de Galilea, sino un nombre del oráculo de Jeremías contra los árabes: «De Cedar y de los reinos de Hasor, los cuales hirió Nabucodonosor rey de Babilonia». El pueblo aludido vive en tiendas con rebaños y camellos, son «los hijos de oriente», y «ni tienen puertas ni cerrojos, que viven solitarios». El nombre hebreo se relaciona con la palabra para los poblados sin muralla del desierto, y la mayoría de los lectores toman «los reinos de Hasor» no por una sola población sino por las comunidades árabes seminómadas del desierto del norte de Arabia, al este de Edom y Moab, los oasis y campamentos que acompañaban a las tiendas de Cedar; otros piensan en un lugar concreto de la misma región. El mapa lo señala como una región cercana a Dumat al-Jandal, la antigua Adummatu, una plaza fuerte de los árabes de Cedar."
    - "El oráculo advierte: «Huid, trasponeos muy lejos, meteos en simas para estar, oh moradores de Hasor, dice Jehová; porque tomó consejo contra vosotros Nabucodonosor rey de Babilonia», y termina: «Y Hasor será morada de chacales, soledad para siempre: ninguno morará allí». La Crónica babilónica registra que en su sexto año, 599/8 a. C., Nabucodonosor envió sus tropas desde Siria al desierto, donde saquearon a los árabes y sus rebaños; la incursión cae en los años de la rebelión de Joacim, y las palabras de Jeremías suelen leerse junto a ella."
    - "Ningún sitio lleva el nombre, y nada se ha excavado como Hazor de Arabia. La región es hoy el norte de Arabia Saudí, el oasis de al-Jawf con Dumat al-Jandal, su castillo de Marid y su antiguo pozo, y el desierto jordano al este de Karak y Ma'an, donde los beduinos siguen plantando tiendas negras de pelo de cabra."
  pt:
    - "Este Hazor não é a grande cidade da Galileia, mas um nome no oráculo de Jeremias contra os árabes: “A respeito de Quedar e dos reinos de Hazor, que Nabucodonosor, rei da Babilônia, atacou”. O povo em questão vive em tendas, com rebanhos e camelos, são “os filhos do oriente” e formam “uma nação que não tem portões nem trancas e vive isolada”. O nome hebraico se relaciona com a palavra para os povoados sem muralha do deserto, e a maioria dos leitores toma “os reinos de Hazor” não como uma cidade, mas como as comunidades semissedentárias árabes do deserto da Arábia setentrional, a leste de Edom e Moabe, os oásis e acampamentos que acompanhavam as tendas de Quedar; outros pensam num lugar particular da mesma região. O mapa a marca como região perto de Dumat al-Jandal, a antiga Adummatu, um reduto dos árabes de Quedar."
    - "O oráculo adverte: “Fujam! Fujam para bem longe! Refugiem-se nas profundezas, habitantes de Hazor”, diz o SENHOR, “pois Nabucodonosor, rei da Babilônia, planejou contra vocês”, e termina: “Hazor se tornará morada de chacais, uma desolação para sempre. Ninguém habitará ali”. A Crônica Babilônica registra que em seu sexto ano, 599/8 a.C., Nabucodonosor enviou suas tropas da Síria ao deserto, onde saquearam os árabes e seus rebanhos; a incursão cai nos anos da revolta de Jeoaquim, e as palavras de Jeremias costumam ser lidas ao lado dela."
    - "Nenhum sítio traz o nome, e nada foi escavado como Hazor da Arábia. A região é hoje o norte da Arábia Saudita, o oásis de al-Jawf com Dumat al-Jandal, seu castelo de Marid e seu antigo poço, e o deserto jordaniano a leste de Karak e Ma’an, onde beduínos ainda armam tendas negras de pelo de cabra."
  de:
    - "Dieses Hazor ist nicht die große Stadt Galiläas, sondern ein Name in Jeremias Orakel gegen die Araber: „Wider Kedar und die Königreiche Hazors, welche Nebukadnezar, der König zu Babel, schlug.“ Die gemeinten Leute leben in Zelten mit Herden und Kamelen, sind die, „die gegen Morgen wohnen“, und „haben weder Tür noch Riegel und wohnen allein“. Der hebräische Name hängt mit dem Wort für die unummauerten Siedlungen der Wüste zusammen, und die meisten Leser verstehen „die Königreiche Hazors“ nicht als eine Stadt, sondern als die halbsesshaften arabischen Gemeinschaften der nordarabischen Wüste östlich von Edom und Moab, die Oasen und Lagerplätze, die zu den Zelten Kedars gehörten; andere denken an einen bestimmten Ort in derselben Gegend. Die Karte markiert es als Gebiet nahe Dumat al-Dschandal, dem antiken Adummatu, einer Festung der Araber von Kedar."
    - "Das Orakel warnt: „Fliehet, hebet euch eilends davon, verkriechet euch tief, ihr Einwohner in Hazor! spricht der HERR; denn Nebukadnezar, der König zu Babel, hat etwas im Sinn wider euch“, und endet: „daß Hazor soll eine Wohnung der Schakale und eine ewige Wüste werden, daß niemand daselbst wohne“. Die Babylonische Chronik verzeichnet, dass Nebukadnezar in seinem sechsten Jahr, 599/8 v. Chr., seine Truppen aus Syrien in die Wüste schickte, wo sie die Araber und ihre Herden plünderten; der Raubzug fällt in die Jahre von Jojakims Aufstand, und Jeremias Worte werden meist neben ihm gelesen."
    - "Keine Stätte trägt den Namen, und nichts ist als Hazor in Arabien ausgegraben worden. Die Gegend ist heute der Norden Saudi-Arabiens, die Oase al-Dschauf mit Dumat al-Dschandal, seiner Burg Marid und seinem antiken Brunnen, und die jordanische Wüste östlich von Karak und Ma'an, wo Beduinen noch schwarze Zelte aus Ziegenhaar aufschlagen."
  fr:
    - "Ce Hatsor n’est pas la grande ville de Galilée mais un nom dans l’oracle de Jérémie contre les Arabes : « Sur Kédar et les royaumes de Hatsor, que battit Nebucadnetsar, roi de Babylone ». Le peuple visé vit sous la tente avec ses troupeaux et ses chameaux, ce sont « les fils de l’Orient », et « elle n’a ni portes, ni barres, elle habite solitaire ». Le nom hébreu est apparenté au mot désignant les établissements sans murs du désert, et la plupart des lecteurs prennent « les royaumes de Hatsor » non pour une ville mais pour les communautés arabes semi-sédentaires du désert d’Arabie du nord, à l’est d’Édom et de Moab ; d’autres pensent à un lieu précis de la même région. La carte le marque comme une région près de Dumat al-Jandal, l’ancienne Adummatu, place forte des Arabes de Kédar."
    - "L’oracle avertit : « Fuyez, fuyez de toutes vos forces, cherchez à l’écart une demeure, habitants de Hatsor ! dit l’Éternel ; car Nebucadnetsar, roi de Babylone, a pris une résolution contre vous », et s’achève : « Hatsor sera le repaire des chacals, un désert pour toujours ; personne n’y habitera, aucun homme n’y séjournera. » La Chronique babylonienne note que, la sixième année, en 599/8 av. J.-C., Nebucadnetsar envoya ses troupes de Syrie dans le désert, où elles pillèrent les Arabes et leurs troupeaux ; le raid tombe dans les années de la révolte de Jojakim, et les paroles de Jérémie se lisent d’ordinaire à côté."
    - "Aucun site ne porte le nom, et rien n’a été fouillé comme Hatsor d’Arabie. La région est aujourd’hui le nord de l’Arabie saoudite, l’oasis d’al-Jawf avec Dumat al-Jandal, son château de Marid et son puits antique, et le désert jordanien à l’est de Karak et de Ma’an, où les Bédouins dressent encore des tentes noires en poil de chèvre."
  pl:
    - "Ten Chasor nie jest wielkim miastem w Galilei, lecz nazwą w orędziu Jeremiasza przeciw Arabom: „Przeciwko Kiedar, i przeciwko królestwom Hasor, które wytracić ma Nabuchodonozor, król Babiloński”. Ludzie, o których chodzi, mieszkają w namiotach z trzodami i wielbłądami, to „narody wschodnie” i „nie ma ani wrót, ani zawór, samotni mieszkają”. Hebrajska nazwa jest spokrewniona ze słowem oznaczającym niemurowane osiedla pustyni, a większość czytelników bierze królestwa Chasor nie za jedno miasto, lecz za na wpół osiadłe wspólnoty arabskie północnej pustyni arabskiej na wschód od Edomu i Moabu, oazy i obozowiska towarzyszące namiotom Kedaru; inni myślą o konkretnym miejscu w tym samym regionie. Mapa zaznacza go jako region koło Dumat al-Dżandal, starożytnego Adummatu, twierdzy Arabów Kedaru."
    - "Orędzie ostrzega: „Uciekajcie, rozpierzchnijcie się prędko, zstąpcie w głębokości na mieszkanie, obywatele Hasor! mówi Pan; bo zawarł radę przeciwko wam Nabuchodonozor, król Babiloński”, i kończy się słowami: „I stanie się Hasor mieszkaniem smoków, pustynią aż na wieki; nie osadzi się tam nikt”. Kronika babilońska zapisuje, że w szóstym roku, 599/8 p.n.e., Nabuchodonozor wysłał swoje wojska z Syrii na pustynię, gdzie złupiły Arabów i ich trzody; wyprawa przypada na lata buntu Jojakima, a słowa Jeremiasza czyta się zwykle obok niej."
    - "Żadne miejsce nie nosi tej nazwy i nic nie wykopano jako Chasor Arabii. Region to dziś północ Arabii Saudyjskiej, oaza al-Dżauf z Dumat al-Dżandal, jej zamkiem Marid i starożytną studnią, oraz jordańska pustynia na wschód od Karaku i Ma'anu, gdzie Beduini nadal rozbijają czarne namioty z koziej sierści."
  it:
    - "Questa Asor non è la grande città della Galilea ma un nome nell’oracolo di Geremia contro gli Arabi: «Riguardo a Kedar e ai regni di Hatsor, che Nebucadnetsar, re di Babilonia, sconfisse». Il popolo di cui si parla vive in tende con greggi e cammelli, sono «i figliuoli dell’oriente», e hanno «né porte né sbarre», e «dimora solitaria». Il nome ebraico è affine alla parola per gli insediamenti non murati del deserto, e la maggior parte dei lettori intende «i regni di Hatsor» non come una città sola ma come le comunità arabe semisedentarie del deserto arabico settentrionale a est di Edom e di Moab, le oasi e gli accampamenti che andavano con le tende di Kedar; altri pensano a un luogo particolare della stessa regione. La mappa lo segna come regione presso Dumat al-Jandal, l’antica Adummatu, roccaforte degli Arabi di Kedar."
    - "L’oracolo ammonisce: «Fuggite, dileguatevi ben lungi, nascondetevi profondamente, o abitanti di Hatsor, dice l’Eterno; poiché Nebucadnetsar, re di Babilonia, ha formato un disegno contro di voi», e termina: «Hatsor diventerà un ricetto di sciacalli una desolazione in perpetuo; nessuno più abiterà quivi». La Cronaca babilonese registra che nel suo sesto anno, 599/8 a.C., Nabucodonosor mandò le sue truppe dalla Siria nel deserto, dove saccheggiarono gli Arabi e i loro greggi; l’incursione cade negli anni della rivolta di Ioiakim, e le parole di Geremia sono di solito lette accanto ad essa."
    - "Nessun sito porta il nome, e nulla è stato scavato come Asor d’Arabia. La regione è oggi il nord dell’Arabia Saudita, l’oasi di al-Jawf con Dumat al-Jandal, il suo castello di Marid e il suo antico pozzo, e il deserto giordano a est di Karak e Ma’an, dove i beduini piantano ancora tende nere di pelo di capra."
  nl:
    - "Dit Hazor is niet de grote stad van Galilea maar een naam in Jeremia’s godsspraak tegen de Arabieren: “Tegen Kedar, en tegen de koninkrijken van Hazor, die Nebukadrezar, de koning van Babel, sloeg”. De bedoelde mensen wonen in tenten met kudden en kamelen, zijn “de kinderen van het oosten”, een volk “dat geen deuren noch grendel heeft, die alleen wonen”. De Hebreeuwse naam is verwant aan het woord voor de onommuurde nederzettingen van de woestijn, en de meeste lezers vatten “de koninkrijken van Hazor” niet op als één stad maar als de half gevestigde Arabische gemeenschappen van de Noord-Arabische woestijn ten oosten van Edom en Moab, de oases en kampen bij de tenten van Kedar; anderen denken aan een bepaalde plaats in dezelfde streek. De kaart markeert het als een streek bij Dumat al-Jandal, het oude Adummatu, een bolwerk van de Arabieren van Kedar."
    - "De godsspraak waarschuwt: “Vliedt, zwerft fluks henen weg, woont in diepe plaatsen, gij inwoners van Hazor! spreekt de HEERE; want Nebukadrezar, de koning van Babel, heeft een raadslag tegen ulieden beraadslaagd”, en eindigt: “Hazor zal worden tot een drakenwoning, een verwoesting tot in eeuwigheid; niemand zal daar wonen”. De Babylonische Kroniek vermeldt dat Nebukadnessar in zijn zesde jaar, 599/8 v.Chr., zijn troepen vanuit Syrië de woestijn in stuurde, waar zij de Arabieren en hun kudden plunderden; de strooptocht valt in de jaren van Jojakims opstand, en Jeremia’s woorden worden gewoonlijk daarnaast gelezen."
    - "Geen plaats draagt de naam, en niets is opgegraven als Hazor van Arabië. De streek is nu het noorden van Saoedi-Arabië, de oase al-Jawf met Dumat al-Jandal, zijn kasteel Marid en zijn oude bron, en de Jordaanse woestijn ten oosten van Karak en Ma’an, waar bedoeïenen nog zwarte tenten van geitenhaar opslaan."
  cs:
    - "Tento Chacor není velké město v Galileji, nýbrž jméno v Jeremjášově výroku proti Arabům: „Proti Cedar a královstvím Azor, kteráž pohubiti má Nabuchodonozor král Babylonský.“ Míněný lid žije ve stanech se stády a velbloudy, jsou to „národy východní“ a „Nemá ani vrat ani závory, a samotní bydlejí“. Hebrejské jméno souvisí se slovem pro neopevněná sídla pouště a většina čtenářů bere „královstvími Azor“ nikoli za jedno město, nýbrž za polousedlé arabské obce severoarabské pouště východně od Edómu a Moábu, oázy a tábory patřící ke stanům Kedaru; jiní myslí na určité místo téhož kraje. Mapa jej označuje jako oblast poblíž Dúmat al-Džandal, starověké Adummatu, pevnosti Arabů z Kedaru."
    - "Výrok varuje: „Utecte, rozprchněte se rychle, skrejte se hluboce, obyvatelé Azor, dí Hospodin, neboť Nabuchodonozor král Babylonský složil proti vám radu“, a končí: „I bude Azor příbytkem draků, pustinou až na věky; neosadí se tam žádný“. Babylónská kronika zaznamenává, že v šestém roce, 599/8 př. n. l., poslal Nebukadnesar své vojsko ze Sýrie na poušť, kde vyplenilo Araby a jejich stáda; výprava spadá do let Jójakimovy vzpoury a Jeremjášova slova se obvykle čtou vedle ní."
    - "Žádné místo nenese toto jméno a nic nebylo vykopáno jako Chacor v Arábii. Oblast je dnes sever Saúdské Arábie, oáza al-Džauf s Dúmat al-Džandal, jeho pevností Márid a starověkou studnou, a jordánská poušť východně od Karaku a Ma'ánu, kde beduíni dosud staví černé stany z kozí srsti."
  sv:
    - "Detta Hasor är inte den stora staden i Galileen utan ett namn i Jeremias spådom mot araberna: ”Om Kedar och Hasors riken, som blevo slagna av Nebukadressar, konungen i Babel”. Folket som avses bor i tält med hjordar och kameler, är ”Österlandets söner” och bor ”utan både portar och bommar, i sin avskilda boning”. Det hebreiska namnet är besläktat med ordet för öknens ommurade bosättningar, och de flesta läsare tar ”Hasors riken” inte som en enda stad utan som de halvfasta arabiska samhällena i norra arabiska öknen öster om Edom och Moab, oaserna och lägren som hörde till Kedars tält; andra tänker på en särskild plats i samma trakt. Kartan markerar det som en region nära Dumat al-Jandal, forntidens Adummatu, en fästning för Kedars araber."
    - "Spådomen varnar: ”Flyn, ja, flykten med hast, gömmen eder djupt nere, I Hasors inbyggare, säger HERREN, ty Nebukadressar, konungen i Babel, har lagt råd mot eder”, och slutar: ”Hasor skall bliva en boning för schakaler en ödemark till evärdlig tid; ingen skall mer bo där”. Babyloniska krönikan berättar att Nebukadnessar i sitt sjätte år, 599/8 f.Kr., sände ut sina trupper från Syrien i öknen, där de plundrade araberna och deras hjordar; räden infaller under åren av Jojakims uppror, och Jeremias ord läses vanligen vid sidan av den."
    - "Ingen plats bär namnet, och inget har grävts ut som Hasor i Arabien. Regionen är i dag norra Saudiarabien, oasen al-Jawf med Dumat al-Jandal, dess borg Marid och dess antika brunn, och den jordanska öknen öster om Karak och Ma'an, där beduiner ännu reser svarta tält av gethår."
  nb:
    - "Denne Hasor er ikke den store byen i Galilea, men et navn i Jeremias utsagn mot araberne: «Om Kedar og om Hasors riker, som Babels konge Nebukadnesar slo». Folkene som menes, bor i telt med småfe og kameler, er «Østens barn», og «de har hverken port eller bom, de bor for sig selv». Det hebraiske navnet er beslektet med ordet for ørkenens ubefestede bosetninger, og de fleste lesere tar «Hasors riker» ikke som én by, men som de halvt bofaste arabiske samfunnene i den nordarabiske ørkenen øst for Edom og Moab, oasene og leirene som hørte til Kedars telt; andre tenker på et bestemt sted i samme område. Kartet markerer det som en region nær Dumat al-Jandal, det gamle Adummatu, en festning for araberne i Kedar."
    - "Utsagnet advarer: «Fly, flykt alt det I kan, skjul eder dypt nede, I Hasors innbyggere, sier Herren; for Babels konge Nebukadnesar har lagt råd imot eder», og ender: «Og Hasor skal bli til bolig for sjakaler, en ørken til evig tid; ingen mann skal bo der». Den babylonske krønike forteller at Nebukadnesar i sitt sjette år, 599/8 f.Kr., sendte troppene sine ut fra Syria i ørkenen, der de plyndret araberne og deres flokker; raidet faller i årene med Jojakims opprør, og Jeremias ord leses vanligvis ved siden av det."
    - "Ingen lokalitet bærer navnet, og ingenting er gravd ut som Hasor i Arabia. Regionen er i dag nordlige Saudi-Arabia, oasen al-Jawf med Dumat al-Jandal, dens borg Marid og dens eldgamle brønn, og den jordanske ørkenen øst for Karak og Ma'an, der beduiner fortsatt slår opp svarte telt av geitehår."
  tl:
    - "Ang Hasor na ito ay hindi ang dakilang lungsod ng Galilea kundi pangalan sa orakulo ni Jeremias laban sa mga Arabe: “Tungkol sa Cedar, at sa mga kaharian ng Hasor na sinaktan ni Nabucodonosor na hari sa Babilonia”. Nakatira ang tinutukoy sa mga tolda na may kawan at kamelyo, “mga anak ng silanganan”, at “wala kahit pintuangbayan o mga halang man, na tumatahang magisa”. Kaugnay ng salita para sa walang pader na paninirahan ng disyerto ang pangalang Hebreo, at itinuturing ng karamihan na ang “mga kaharian ng Hasor” ay hindi isang bayan kundi mga pamayanang Arabe na kalahating nakatira sa hilagang disyerto ng Arabia sa silangan ng Edom at Moab, ang oasis at kampo na kasama ng tolda ng Kedar; iniisip ng iba ang isang tiyak na lugar roon. Minamarkahan ito ng mapa bilang rehiyon malapit sa Dumat al-Jandal, ang sinaunang Adummatu, kuta ng mga Arabe ng Kedar."
    - "Nagbababala ang orakulo, “Magsitakas kayo, gumala kayo ng malayo, magsitahan kayo sa kalaliman, Oh kayong mga nananahan sa Hasor, sabi ng Panginoon; sapagka't kumuhang payo si Nabucodonosor na hari sa Babilonia laban sa inyo”, at nagtatapos, “ang Hasor ay magiging tahanang dako ng mga chakal, sira magpakailan man: walang taong tatahan doon”. Itinatala ng Salaysay ng Babilonia na sa kaniyang ikaanim na taon, 599/8 BK, ipinadala ni Nebuchadnezzar ang kaniyang mga hukbo mula sa Siria patungo sa disyerto, kung saan sinamsam nila ang mga Arabe at ang kanilang mga kawan; ang pagsalakay ay nahuhulog sa mga taon ng paghihimagsik ni Joacim, at ang mga salita ni Jeremias ay karaniwang binabasa kasama nito."
    - "Walang lugar na may ganitong pangalan, at walang nahukay bilang Hasor ng Arabia. Ang rehiyon ay ang hilaga ng Saudi Arabia ngayon, ang oasis ng al-Jawf kasama ang Dumat al-Jandal, ang kastilyo nitong Marid at ang sinaunang balon nito, at ang disyerto ng Jordan sa silangan ng Karak at Ma'an, kung saan nagtatayo pa rin ang mga Bedouin ng itim na tolda ng balahibo ng kambing."
  da:
    - "Denne Hazor er ikke den store by i Galilæa, men et navn i Jeremias' orakel mod araberne: »Imod Kedar og Hazors Riger, hvilke Nebukadnezar, Kongen af Babel, slog«. Folket, der menes, bor i telte med hjorde og kameler, er »Østens Børn« og »har hverken Porte eller Portstænger, de bo for sig selv«. Det hebraiske navn er beslægtet med ordet for ørkenens ubefæstede bosættelser, og de fleste læsere tager »Hazors Riger« ikke som én by, men som de halvbofaste arabiske samfund i den nordarabiske ørken øst for Edom og Moab, oaserne og lejrene, der hørte til Kedars telte; andre tænker på et bestemt sted i samme egn. Kortet markerer det som en region nær Dumat al-Jandal, det gamle Adummatu, en højborg for Kedars arabere."
    - "Oraklet advarer: »Flyr, vanker vidt om, tager Bolig i det dybe, I Hazors Indbyggere! siger Herren, thi Nebukadnezar, Kongen af Babel, har besluttet et Raad imod eder«, og slutter: »Hazor skal blive til Dragers Bo, en Ødelæggelse evindelig; der skal ingen Mand bo der«. Den babylonske kronike beretter, at Nebukadnezar i sit sjette år, 599/8 f.Kr., sendte sine tropper ud fra Syrien i ørkenen, hvor de plyndrede araberne og deres hjorde; plyndringstoget falder i årene med Jojakims oprør, og Jeremias' ord læses sædvanligvis sammen med det."
    - "Intet sted bærer navnet, og intet er udgravet som Hazor i Arabien. Egnen er i dag det nordlige Saudi-Arabien, oasen al-Jawf med Dumat al-Jandal, dens borg Marid og dens gamle brønd, og den jordanske ørken øst for Karak og Ma'an, hvor beduinerne stadig slår sorte telte af gedehår op."
