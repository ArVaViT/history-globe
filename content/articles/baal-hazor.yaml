body:
  en:
    - "Baal-hazor was the place near the border of Ephraim and Benjamin where Absalom kept his flocks: “it came to pass after two full years, that Absalom had sheepshearers in Baal-hazor, which is beside Ephraim: and Absalom invited all the king's sons.” At the feast of the shearing his servants killed his half-brother Amnon, who had raped his sister Tamar, and Absalom fled to Geshur. The town may be the Hazor named among the places of Benjamin resettled after the exile."
    - "It is identified with Tell Asur (Jebel Asur), a summit some 7 km north-east of Bethel which keeps the name; rising to just over 1,000 m, it is one of the highest points of the West Bank. The International Standard Bible Encyclopedia added that a nearby ruin called Kubbet el-Baul may retain the old name."
  ru:
    - "Ваал-Гацор — место у границы Ефрема и Вениамина, где Авессалом держал свои стада: «Чрез два года было стрижение овец у Авессалома в Ваал-Гацоре, что у Ефрема, и позвал Авессалом всех сыновей царских». На празднике стрижки его слуги убили его единокровного брата Амнона, обесчестившего их сестру Фамарь, и Авессалом бежал в Гессур. Возможно, это тот же Гацор, что назван среди мест Вениамина, заселённых после плена."
    - "Его отождествляют с Телль-Асуром (Джебель-Асур) — вершиной примерно в 7 км к северо-востоку от Вефиля, сохранившей имя; поднимаясь чуть выше 1000 м, это одна из высочайших точек Западного берега. Международная стандартная библейская энциклопедия добавляла, что соседние развалины Куббет-эль-Бауль, возможно, сохраняют древнее имя."
  uk:
    - "Ваал-Хацор — місце біля межі Єфрема й Веніяміна, де Авесалом тримав свої отари: «Як уплило два роки, сталося, що Абессалом справляв овечі пострижини в Баал-Газорі, в Ефраїмі, й запросив до себе Абессалом усїх царських синів». На учті стрижіння його слуги вбили його зведеного брата Амнона, який зґвалтував його сестру Тамар, і Авесалом утік до Гешура. Місто, можливо, є Хацором, названим серед місць Веніяміна, заселених знову після вигнання."
    - "Його ототожнюють з Телль-Асуром (Джебель-Асур), вершиною приблизно за 7 км на північний схід від Бет-Ела, яка зберігає назву; здіймаючись трохи понад 1000 м, вона є однією з найвищих точок Західного берега. International Standard Bible Encyclopedia додала, що сусідня руїна Куббет-ель-Баул може зберігати давню назву."
  es:
    - "Baal-hazor era el lugar cerca de la frontera de Efraín y Benjamín donde Absalón tenía sus rebaños: «aconteció pasados dos años, que Absalom tenía esquiladores en Bala-hasor, que está junto á Ephraim; y convidó Absalom á todos los hijos del rey». En la fiesta de la esquila sus siervos mataron a su medio hermano Amnón, que había violado a su hermana Tamar, y Absalón huyó a Gesur. La ciudad puede ser la Hazor nombrada entre los lugares de Benjamín repoblados tras el exilio."
    - "Se identifica con Tell Asur (Yebel Asur), una cumbre a unos 7 km al nordeste de Betel que conserva el nombre; con poco más de 1000 m, es uno de los puntos más altos de Cisjordania. La International Standard Bible Encyclopedia añadió que una ruina cercana llamada Kubbet el-Baul puede conservar el nombre antiguo."
  pt:
    - "Baal-Hazor era o lugar perto da fronteira de Efraim e Benjamim onde Absalão mantinha seus rebanhos: “Depois de dois anos inteiros, Absalão estava tosquiando ovelhas em Baal-Hazor, que fica perto de Efraim; e Absalão convidou todos os filhos do rei.” Na festa da tosquia seus servos mataram seu meio-irmão Amnom, que havia violado sua irmã Tamar, e Absalão fugiu para Gesur. A cidade pode ser a Hazor nomeada entre os lugares de Benjamim repovoados depois do exílio."
    - "É identificada com Tell Asur (Jebel Asur), um cume cerca de 7 km a nordeste de Betel que conserva o nome; elevando-se a pouco mais de 1.000 m, é um dos pontos mais altos da Cisjordânia. A International Standard Bible Encyclopedia acrescentou que uma ruína próxima chamada Kubbet el-Baul pode conservar o nome antigo."
  de:
    - "Baal-Hazor war der Ort nahe der Grenze von Ephraim und Benjamin, wo Absalom seine Herden hielt: „Über zwei Jahre aber hatte Absalom Schafscherer zu Baal-Hazor, das bei Ephraim liegt; und Absalom lud alle Kinder des Königs“. Beim Fest der Schafschur töteten seine Knechte seinen Halbbruder Amnon, der seine Schwester Tamar vergewaltigt hatte, und Absalom floh nach Geschur. Die Stadt mag das Hazor sein, das unter den Orten Benjamins genannt wird, die nach dem Exil wieder besiedelt wurden."
    - "Es wird mit Tell Asur (Dschebel Asur) gleichgesetzt, einem Gipfel etwa 7 km nordöstlich von Bethel, der den Namen bewahrt; mit gut 1000 m Höhe ist er einer der höchsten Punkte des Westjordanlands. Die International Standard Bible Encyclopedia fügte hinzu, eine nahe Ruine namens Kubbet el-Baul könne den alten Namen bewahren."
  fr:
    - "Baal-Hatsor était le lieu, près de la frontière d’Éphraïm et de Benjamin, où Absalom gardait ses troupeaux : « Deux ans après, comme Absalom avait les tondeurs à Baal-Hatsor, près d’Éphraïm, il invita tous les fils du roi. » Au festin de la tonte, ses serviteurs tuèrent son demi-frère Amnon, qui avait violé sa sœur Tamar, et Absalom s’enfuit à Gueschur. La ville peut être le Hatsor cité parmi les lieux de Benjamin repeuplés après l’exil."
    - "On l’identifie avec Tell Asur (Djebel Asur), sommet à quelque 7 km au nord-est de Béthel qui garde le nom ; s’élevant à un peu plus de 1 000 m, c’est l’un des points les plus hauts de la Cisjordanie. L’International Standard Bible Encyclopedia ajoutait qu’une ruine voisine appelée Kubbet el-Baul pourrait avoir gardé l’ancien nom."
  it:
    - "Baal-Asor era il luogo presso il confine di Efraim e di Beniamino dove Assalonne teneva le sue greggi: «due anni dopo avvenne che, facendo Absalom tosar le sue pecore a Baal-Hatsor presso Efraim, egli invitò tutti i figliuoli del re». Alla festa della tosatura i suoi servi uccisero il fratellastro Amnon, che aveva violentato la sorella Tamar, e Assalonne fuggì a Ghesur. La città può essere l’Asor nominata tra i luoghi di Beniamino rioccupati dopo l’esilio: «a Atsor, a Rama, a Ghittaim»."
    - "È identificata con Tell Asur (Jebel Asur), una vetta a circa 7 km a nord-est di Betel che ne conserva il nome; raggiunge poco più di 1000 m ed è uno dei punti più alti della Cisgiordania. La International Standard Bible Encyclopedia aggiungeva che una vicina rovina detta Kubbet el-Baul può conservare l’antico nome."
  nl:
    - "Baäl-Hazor was de plaats bij de grens van Efraïm en Benjamin waar Absalom zijn kudden hield: “En het geschiedde, na twee volle jaren, dat Absalom, schaaps scheerders had te Baal-Hazor, dat bij Efraim is; zo nodigde Absalom al des konings zonen.” Bij het feest van de schaapscheerders doodden zijn knechten zijn halfbroer Amnon, die zijn zuster Tamar had verkracht, en Absalom vluchtte naar Gesur. De stad kan het Hazor zijn dat wordt genoemd onder de plaatsen van Benjamin die na de ballingschap opnieuw werden bewoond."
    - "Het wordt vereenzelvigd met Tell Asur (Jebel Asur), een top zo'n 7 km ten noordoosten van Bethel die de naam bewaart; met iets meer dan 1000 m is het een van de hoogste punten van de Westelijke Jordaanoever. De International Standard Bible Encyclopedia voegde eraan toe dat een nabije ruïne genaamd Kubbet el-Baul de oude naam kan bewaren."
  pl:
    - "Baal-Chasor było miejscem w pobliżu granicy Efraima i Beniamina, gdzie Absalom miał swoje stada: „I stało się po wyjściu dwóch lat, gdy strzyżono owce Absalomowe w Baalchasor, które jest w Efraim, że wyzwał Absalom wszystkich synów królewskich”. Na uczcie strzyży jego słudzy zabili przyrodniego brata Amnona, który zgwałcił jego siostrę Tamar, a Absalom uciekł do Geszuru. Miasto może być Chasorem wymienionym wśród miejsc Beniamina, w których osiedlono się po wygnaniu."
    - "Utożsamia się je z Tell Asur (Dżabal Asur), szczytem około 7 km na północny wschód od Betel, który zachowuje nazwę; wznosząc się na nieco ponad 1000 m, jest jednym z najwyższych punktów Zachodniego Brzegu. International Standard Bible Encyclopedia dodała, że pobliska ruina zwana Kubbet al-Baul może zachowywać dawną nazwę."
  cs:
    - "Báal-chácor bylo místo poblíž hranice Efrajimu a Benjamína, kde Abšalom choval svá stáda: „I stalo se po celých dvou letech, když střihli ovce Absolonovi v Balazor, jenž jest podlé Efraim, že pozval Absolon všech synů královských.“ Při hostině při stříhání ovcí jeho služebníci zabili jeho nevlastního bratra Amnóna, který zneužil jeho sestru Tamar, a Abšalom uprchl do Gešuru. Město může být Chacor jmenovaný mezi místy Benjamínovými osídlenými po exilu."
    - "Ztotožňuje se s Tell Asúr (Džabal Asúr), vrcholem asi 7 km severovýchodně od Bét-elu, který jméno zachovává; s výškou těsně přes tisíc metrů patří k nejvyšším bodům Západního břehu. International Standard Bible Encyclopedia dodala, že nedaleká zřícenina zvaná Kubbet el-Baul může starobylé jméno uchovávat."
  sv:
    - "Baal-Hasor var platsen nära gränsen mellan Efraim och Benjamin där Absalom hade sina hjordar: ”Två år därefter hade Absalom fårklippning i Baal-Hasor, som ligger vid Efraim. Och Absalom inbjöd då alla konungens söner.” Vid klippningsfesten dödade hans tjänare hans halvbror Amnon, som hade våldtagit hans syster Tamar, och Absalom flydde till Geshur. Staden kan vara det Hasor som nämns bland Benjamins platser som bosattes på nytt efter exilen."
    - "Den identifieras med Tell Asur (Jebel Asur), en höjd omkring 7 km nordost om Betel som har behållit namnet; den reser sig till drygt 1 000 m och är en av Västbankens högsta punkter. International Standard Bible Encyclopedia tillade att en närliggande ruin kallad Kubbet el-Baul kan bevara det gamla namnet."
  nb:
    - "Baal-Hasor var stedet nær grensen mellom Efraim og Benjamin der Absalom hadde flokkene sine: «To år derefter hadde Absalom fåreklipning i Ba'al-Hasor, som ligger ved Efra'im, og Absalom innbød alle kongens sønner.» Ved festen for klippingen drepte tjenerne hans halvbroren Amnon, som hadde voldtatt søsteren hans Tamar, og Absalom flyktet til Gesjur. Byen kan være Hasor, nevnt blant stedene i Benjamin som ble gjenbosatt etter eksilet."
    - "Den identifiseres med Tell Asur (Jebel Asur), en topp omtrent 7 km nordøst for Betel som har bevart navnet; den hever seg til drøyt 1000 m og er et av de høyeste punktene på Vestbredden. International Standard Bible Encyclopedia tilføyde at en nærliggende ruin kalt Kubbet el-Baul kan ha bevart det gamle navnet."
