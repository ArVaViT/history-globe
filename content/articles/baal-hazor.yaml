# Overview article (ADR 0007). Baal-hazor = Tell Asur north-east of Bethel (ISBE and the usual view; the map's point); its link with the Hazor of Neh 11:33 is shown as probable. Height and distance: ISBE 3,318 ft / 4 miles, Wikipedia 1,016 m / 8 km; coordinates give about 7 km.
