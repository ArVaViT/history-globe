body:
  en:
    - "Golgotha is the place outside Jerusalem where Jesus was crucified. The name is Aramaic, gulgulta, “skull”; Matthew explains it as “a place of a skull”, and Luke gives only the Greek, Kranion, which the Latin Bible rendered Calvaria, whence Calvary. Why it was so called is not known: a bare rounded rock, a place of execution, or an old name are all guesses. John says the place “was nigh to the city”, so that many could read the title on the cross, and that “in the place where he was crucified there was a garden; and in the garden a new sepulchre”; Hebrews says Jesus “suffered without the gate”. Roman law and Jewish custom alike put executions and tombs outside the walls."
    - "In AD 325 or 326 Constantine ordered the temple of Venus that Hadrian had built in the heart of Aelia Capitolina to be pulled down, and Eusebius, a contemporary, tells how a rock-cut tomb came to light beneath it and was taken to be the tomb of Christ; the church over it was dedicated in 335, and a rock knoll a few dozen metres south-east of the tomb was venerated as Golgotha. Archaeology has shown that the site was a limestone quarry from the eighth century BC, abandoned and used for gardens and tombs in the first century, and that it lay outside the city wall of the time of Jesus until Agrippa I enclosed it in the 40s AD. Most scholars therefore accept the Church of the Holy Sepulchre as the place; Joan Taylor has argued that the crucifixion stood lower, by the road south of the rock, with the knoll later chosen as the showpiece."
    - "The alternative is Gordon's Calvary, a cliff with two caves like eye sockets north of the Damascus Gate, first suggested by Otto Thenius in 1842 and made famous by General Charles Gordon in 1883, with the Garden Tomb beside it; the tomb, however, is of the Iron Age, cut some seven centuries before Jesus, and the site has little scholarly support, though it remains a quiet place of prayer. The rock of Golgotha is today enclosed in the Church of the Holy Sepulchre, shared by six Christian communities, under a Greek altar reached by stairs beside the entrance; the tomb lies under the restored Edicule in the rotunda."
  ru:
    - "Голгофа — место за стенами Иерусалима, где был распят Иисус. Имя арамейское, гулгулта, «череп»; Матфей объясняет его как «Лобное место», а Лука даёт только греческое Кранион, которое латинская Библия передала как Calvaria, откуда Кальвария. Почему место так называлось, неизвестно: голая округлая скала, место казни или старое имя — всё это догадки. Иоанн говорит, что место «было недалеко от города», так что многие могли прочесть надпись на кресте, и что на том месте, где Он распят, «был сад, и в саду гроб новый»; Послание к Евреям говорит, что Иисус «пострадал вне врат». Римский закон и иудейский обычай одинаково выносили казни и гробницы за стены."
    - "В 325 или 326 году Константин велел снести храм Венеры, который Адриан построил в сердце Элии Капитолины, и Евсевий, современник событий, рассказывает, как под ним открылась высеченная в скале гробница, принятая за гроб Христов; церковь над ней освятили в 335 году, а скальный выступ в нескольких десятках метров к юго-востоку от гроба почитали как Голгофу. Археология показала, что здесь с VIII века до н. э. была каменоломня, заброшенная и занятая садами и гробницами в I веке, и что место лежало вне городской стены времён Иисуса, пока Агриппа I не обнёс его стеной в 40-х годах. Поэтому большинство учёных признаёт местом Храм Гроба Господня; Джоан Тейлор доказывала, что крест стоял ниже, у дороги к югу от скалы, а выступ был выбран позже как зримый знак."
    - "Другое предложение — Голгофа Гордона, обрыв с двумя пещерами, похожими на глазницы, к северу от Дамасских ворот, который впервые предложил Отто Тениус в 1842 году, а прославил генерал Чарльз Гордон в 1883 году, и Садовая гробница рядом; гробница, однако, относится к железному веку и высечена веков за семь до Иисуса, и у этого места мало поддержки среди учёных, хотя оно остаётся тихим местом молитвы. Скала Голгофы ныне заключена в Храме Гроба Господня, который делят шесть христианских общин, под греческим престолом, куда ведёт лестница у входа; гроб лежит под восстановленной Кувуклией в ротонде."
  uk:
    - "Голгофа — місце за межами Єрусалима, де розіп’яли Ісуса. Назва арамейська, ґулґулта, «череп»; Матвій пояснює її як «Черепове місце», а Лука дає лише грецьке Краніон, яке латинська Біблія передала як Calvaria, звідки походить назва «Кальварія». Чому її так названо, невідомо: гола округла скеля, місце страт або давня назва — усе це здогади. Іван каже, що «поблизу города було місце, де розпято Ісуса», тож багато хто міг прочитати напис на хресті, і що «на місцї, де розпято Його, сад, а в саду новий гріб»; послання до євреїв каже, що Ісус «осторонь воріт пострадав». І римське право, і юдейський звичай виносили страти й гробниці за мури."
    - "У 325 або 326 р. н. е. Костянтин наказав розібрати храм Венери, який Адріан збудував у серці Елії Капітоліни, і Євсевій, сучасник подій, розповідає, як під ним виявили вирубану в скелі гробницю, яку визнали гробницею Христа; церкву над нею освятили 335 року, а скельний горб за кілька десятків метрів на південний схід від гробниці шанували як Голгофу. Археологія показала, що місце було вапняковим кар’єром з VIII ст. до н. е., покинутим і використаним під сади й гробниці в I ст., і що воно лежало за міським муром часів Ісуса, доки Агриппа I не охопив його стіною в 40-х роках н. е. Тому більшість дослідників приймає Церкву Гробу Господнього як це місце; Джоан Тейлор доводила, що розп’яття стояло нижче, біля дороги на південь від скелі, а горб пізніше обрали для показу."
    - "Альтернатива — Голгофа Гордона, скеля з двома печерами, подібними до очних западин, на північ від Дамаських воріт, уперше запропонована Отто Тениусом 1842 року й прославлена генералом Чарльзом Гордоном 1883 року, з Садовою гробницею поряд; однак гробниця належить до залізного віку, вирубана приблизно за сім століть до Ісуса, і це місце має мало наукової підтримки, хоч лишається тихим місцем молитви. Скеля Голгофи нині замкнена в Церкві Гробу Господнього, яку ділять шість християнських громад, під грецьким вівтарем, до якого ведуть сходи біля входу; гробниця лежить під відновленою Едикулою в ротонді."
  es:
    - "El Gólgota es el lugar fuera de Jerusalén donde Jesús fue crucificado. El nombre es arameo, gulgulta, «calavera»; Mateo lo explica como «El lugar de la calavera», y Lucas da solo el griego, Kranion, que la Biblia latina tradujo Calvaria, de donde Calvario. Se ignora por qué se llamaba así: una roca desnuda y redondeada, un lugar de ejecución o un nombre antiguo son todas conjeturas. Juan dice que el lugar «era cerca de la ciudad», de modo que muchos podían leer el título de la cruz, y que «En aquel lugar donde había sido crucificado, había un huerto; y en el huerto un sepulcro nuevo»; Hebreos dice que Jesús «padeció fuera de la puerta». Tanto la ley romana como la costumbre judía situaban ejecuciones y tumbas fuera de las murallas."
    - "En el 325 o 326 d. C. Constantino ordenó derribar el templo de Venus que Adriano construyó en el corazón de Aelia Capitolina, y Eusebio, contemporáneo, cuenta que salió a la luz bajo él una tumba excavada en la roca tomada por el sepulcro de Cristo; la iglesia sobre ella fue dedicada en el 335, y un montículo de roca a decenas de metros al sudeste de la tumba fue venerado como Gólgota. La arqueología muestra que el sitio fue cantera de piedra caliza desde el siglo VIII a. C., abandonada y usada para huertos y tumbas en el siglo I, y quedaba fuera de la muralla de la ciudad de Jesús hasta que Agripa I la incluyó en los años 40 d. C. Por eso la mayoría de los estudiosos aceptan la Iglesia del Santo Sepulcro como el lugar; Joan Taylor sostiene que la crucifixión fue más abajo, junto al camino al sur de la roca, y que el montículo se escogió después como pieza de exhibición."
    - "La alternativa es el Calvario de Gordon, un acantilado con dos cuevas como cuencas de ojos al norte de la puerta de Damasco, sugerido por primera vez por Otto Thenius en 1842 y hecho famoso por el general Charles Gordon en 1883, con la Tumba del Jardín a su lado; la tumba, sin embargo, es de la Edad del Hierro, excavada unos siete siglos antes de Jesús, y el sitio cuenta con poco apoyo académico, aunque sigue siendo un tranquilo lugar de oración. La roca del Gólgota está hoy encerrada en la Iglesia del Santo Sepulcro, compartida por seis comunidades cristianas, bajo un altar griego al que se llega por unas escaleras junto a la entrada; la tumba se halla bajo el Edículo restaurado, en la rotonda."
  pt:
    - "Gólgota é o lugar fora de Jerusalém onde Jesus foi crucificado. O nome é aramaico, gulgulta, “caveira”; Mateus o explica como “Lugar da Caveira”, e Lucas dá apenas o grego, Kranion, que a Bíblia latina verteu Calvaria, de onde Calvário. Por que assim se chamava não se sabe: uma rocha nua e arredondada, um lugar de execução ou um nome antigo são todos palpites. João diz que o lugar “era perto da cidade”, de modo que muitos podiam ler o título da cruz, e que “no lugar onde ele foi crucificado havia um jardim. No jardim havia um sepulcro novo”; Hebreus diz que Jesus “sofreu fora da porta”. A lei romana e o costume judaico igualmente punham execuções e túmulos fora das muralhas."
    - "Em 325 ou 326 d.C., Constantino mandou demolir o templo de Vênus que Adriano erguera no coração de Aelia Capitolina, e Eusébio, um contemporâneo, conta como um túmulo escavado na rocha veio à luz debaixo dele e foi tido como o túmulo de Cristo; a igreja sobre ele foi dedicada em 335, e uma colina rochosa a algumas dezenas de metros a sudeste do túmulo foi venerada como o Gólgota. A arqueologia mostrou que o sítio era uma pedreira de calcário desde o século VIII a.C., abandonada e usada para jardins e túmulos no século I, e que ficava fora da muralha da cidade do tempo de Jesus até que Agripa I a incluiu nos anos 40 d.C. A maioria dos estudiosos aceita, por isso, a Igreja do Santo Sepulcro como o lugar; Joan Taylor sustentou que a crucificação se deu mais abaixo, junto à estrada ao sul da rocha, tendo a colina sido escolhida depois como peça de mostruário."
    - "A alternativa é o Calvário de Gordon, um penhasco com duas cavernas como órbitas de olhos ao norte da Porta de Damasco, sugerido primeiro por Otto Thenius em 1842 e tornado famoso pelo general Charles Gordon em 1883, com o Túmulo do Jardim ao lado; o túmulo, porém, é da Idade do Ferro, escavado uns sete séculos antes de Jesus, e o sítio tem pouco apoio entre os estudiosos, embora continue sendo um lugar tranquilo de oração. A rocha do Gólgota está hoje encerrada na Igreja do Santo Sepulcro, partilhada por seis comunidades cristãs, sob um altar grego a que se chega por escadas junto à entrada; o túmulo fica sob a Edícula restaurada, na rotunda."
  de:
    - "Golgatha ist der Ort vor Jerusalem, an dem Jesus gekreuzigt wurde. Der Name ist aramäisch, gulgulta, „Schädel“; Matthäus erklärt ihn als „Schädelstätte“, und Lukas gibt nur das Griechische, Kranion, das die lateinische Bibel Calvaria wiedergab, daher der Kalvarienberg. Warum er so hieß, ist nicht bekannt: ein kahler runder Fels, eine Hinrichtungsstätte oder ein alter Name sind lauter Vermutungen. Johannes sagt, die Stätte „war nahe bei der Stadt“, sodass viele die Überschrift am Kreuz lesen konnten, und dass „an der Stätte, da er gekreuzigt ward, ein Garten“ war, „und im Garten ein neues Grab“; der Hebräerbrief sagt, Jesus habe „gelitten draußen vor dem Tor“. Römisches Recht und jüdische Sitte setzten Hinrichtungen und Gräber gleichermaßen außerhalb der Mauern an."
    - "325 oder 326 n. Chr. ließ Konstantin den Venustempel, den Hadrian im Herzen von Aelia Capitolina gebaut hatte, abreißen, und Eusebius, ein Zeitgenosse, erzählt, darunter sei ein Felsengrab ans Licht gekommen und für das Grab Christi gehalten worden; die Kirche darüber wurde 335 geweiht, und eine Felskuppe einige Dutzend Meter südöstlich des Grabes wurde als Golgatha verehrt. Die Archäologie hat gezeigt, dass die Stätte seit dem 8. Jahrhundert v. Chr. ein Kalksteinbruch war, im 1. Jahrhundert aufgegeben und für Gärten und Gräber genutzt wurde und zur Zeit Jesu außerhalb der Stadtmauer lag, bis Agrippa I. sie in den 40er Jahren n. Chr. einschloss. Die meisten Forscher akzeptieren daher die Grabeskirche als den Ort; Joan Taylor hat vertreten, die Kreuzigung habe tiefer gestanden, an der Straße südlich des Felsens, und die Kuppe sei später als Schauplatz gewählt worden."
    - "Die Alternative ist Gordons Kalvarienberg, eine Felswand mit zwei augenhöhlenartigen Höhlen nördlich des Damaskustors, 1842 von Otto Thenius zuerst vorgeschlagen und 1883 durch General Charles Gordon berühmt gemacht, mit dem Gartengrab daneben; das Grab stammt jedoch aus der Eisenzeit, etwa sieben Jahrhunderte vor Jesus gehauen, und die Stätte findet in der Forschung wenig Unterstützung, bleibt aber ein stiller Ort des Gebets. Der Felsen von Golgatha ist heute in die Grabeskirche eingeschlossen, die sechs christliche Gemeinschaften teilen, unter einem griechischen Altar, zu dem Stufen neben dem Eingang führen; das Grab liegt unter der restaurierten Ädikula in der Rotunde."
  fr:
    - "Golgotha est le lieu, hors de Jérusalem, où Jésus fut crucifié. Le nom est araméen, gulgulta, « crâne » ; Matthieu l’explique par « lieu du crâne », et Luc ne donne que le grec, Kranion, que la Bible latine rendit par Calvaria, d’où Calvaire. On ignore pourquoi on l’appelait ainsi : un roc nu et arrondi, un lieu d’exécution ou un très ancien nom ne sont que des conjectures. Jean dit que le lieu « était près de la ville », si bien que beaucoup pouvaient lire l’inscription de la croix, et qu’« il y avait un jardin dans le lieu où Jésus avait été crucifié, et dans le jardin un sépulcre neuf » ; l’épître aux Hébreux dit que Jésus « a souffert hors de la porte ». Le droit romain comme la coutume juive plaçaient exécutions et tombes hors des murs."
    - "En 325 ou 326 apr. J.-C., Constantin ordonna de démolir le temple de Vénus qu’Hadrien avait bâti au cœur d’Aelia Capitolina, et Eusèbe, un contemporain, raconte comment un tombeau taillé dans le roc apparut dessous et fut pris pour le tombeau du Christ ; l’église qui le couvrait fut dédiée en 335, et un rocher à quelques dizaines de mètres au sud-est du tombeau fut vénéré comme Golgotha. L’archéologie a montré que le site était une carrière de calcaire dès le VIIIe siècle av. J.-C., abandonnée et utilisée pour des jardins et des tombes au Ier siècle, et qu’il était hors du mur de la ville au temps de Jésus, jusqu’à son inclusion par Agrippa Ier dans les années 40 apr. J.-C. La plupart admettent donc le Saint-Sépulcre ; Joan Taylor a soutenu que la crucifixion eut lieu plus bas, près de la route au sud du rocher, le tertre n’étant choisi que plus tard comme vitrine."
    - "L’autre hypothèse est le Calvaire de Gordon, une falaise percée de deux grottes comme des orbites, au nord de la porte de Damas, suggérée d’abord par Otto Thenius en 1842 et rendue célèbre par le général Charles Gordon en 1883, avec le Tombeau du Jardin à côté ; ce tombeau est pourtant de l’âge du Fer, creusé quelque sept siècles avant Jésus, et le site n’a guère de soutien chez les spécialistes, bien qu’il reste un lieu de prière paisible. Le rocher du Golgotha est aujourd’hui enfermé dans l’église du Saint-Sépulcre, partagée entre six communautés chrétiennes, sous un autel grec auquel on accède par des marches à côté de l’entrée ; le tombeau se trouve sous l’édicule restauré, dans la rotonde."
  pl:
    - "Golgota to miejsce poza Jerozolimą, gdzie ukrzyżowano Jezusa. Nazwa jest aramejska, gulgulta, „czaszka”; Mateusz objaśnia ją jako „miejsce trupich głów”, a Łukasz podaje tylko greckie Kranion, które łacińska Biblia oddała jako Calvaria, stąd Kalwaria. Dlaczego tak ją nazwano, nie wiadomo: gołą zaokrągloną skałę, miejsce straceń lub dawną nazwę można tylko zgadywać. Jan mówi, że miejsce „blisko miasta było”, tak że wielu mogło czytać napis na krzyżu, i że „na onem miejscu, gdzie był ukrzyżowany, ogród, a w ogrodzie grób nowy”; List do Hebrajczyków mówi, że Jezus „za bramą ucierpiał”. Prawo rzymskie i zwyczaj żydowski równie umieszczały egzekucje i groby poza murami."
    - "W 325 lub 326 r. n.e. Konstantyn kazał zburzyć świątynię Wenus, którą Hadrian zbudował w sercu Aelia Capitolina, a Euzebiusz, współczesny tym wydarzeniom, opowiada, że pod nią ukazał się wykuty w skale grób uznany za grób Chrystusa; kościół nad nim poświęcono w 335 r., a skalne wzniesienie kilkadziesiąt metrów na południowy wschód od grobu czczono jako Golgotę. Archeologia wykazała, że miejsce było kamieniołomem wapienia od VIII w. p.n.e., porzuconym i użytkowanym na ogrody i groby w I w., i że leżało poza murem miasta z czasów Jezusa, dopóki Agryppa I nie objął go murem w latach 40. n.e. Większość uczonych przyjmuje więc Bazylikę Grobu Pańskiego za to miejsce; Joan Taylor dowodziła, że ukrzyżowanie odbyło się niżej, przy drodze na południe od skały, a wzniesienie wybrano później na pokaz."
    - "Alternatywą jest Kalwaria Gordona, klif z dwiema jaskiniami jak oczodoły na północ od Bramy Damasceńskiej, po raz pierwszy zaproponowany przez Otto Theniusa w 1842 r. i rozsławiony przez generała Charlesa Gordona w 1883 r., z Grobem Ogrodowym obok; grób jednak pochodzi z epoki żelaza, wykuty około siedem wieków przed Jezusem, a to miejsce ma niewielkie poparcie uczonych, choć pozostaje cichym miejscem modlitwy. Skała Golgoty jest dziś zamknięta w Bazylice Grobu Pańskiego, dzielonej przez sześć wspólnot chrześcijańskich, pod greckim ołtarzem, do którego prowadzą schody obok wejścia; grób leży pod odnowioną Edikulą w rotundzie."
  it:
    - "Golgota è il luogo fuori di Gerusalemme dove Gesù fu crocifisso. Il nome è aramaico, gulgulta, «cranio»; Matteo lo spiega come «Luogo del teschio», e Luca dà solo il greco, Kranion, che la Bibbia latina rese Calvaria, da cui Calvario. Perché fosse così chiamato non è noto: una roccia nuda e tondeggiante, un luogo di esecuzione o un nome antico sono tutte congetture. Giovanni dice che il luogo «era vicino alla città», così che molti potevano leggere il titolo sulla croce, e che «nel luogo dov’egli fu crocifisso c’era un orto; e in quell’orto un sepolcro nuovo»; l’Epistola agli Ebrei dice che Gesù «soffrì fuor della porta». Sia la legge romana sia l’uso giudaico ponevano esecuzioni e tombe fuori delle mura."
    - "Nel 325 o 326 d.C. Costantino ordinò di demolire il tempio di Venere che Adriano aveva costruito nel cuore di Aelia Capitolina, ed Eusebio, contemporaneo, racconta come sotto venne alla luce una tomba scavata nella roccia, creduta quella di Cristo; la chiesa sopra di essa fu dedicata nel 335, e un rilievo roccioso poche decine di metri a sud-est della tomba fu venerato come Golgota. L’archeologia mostra che il sito fu una cava di calcare dall’VIII secolo a.C., abbandonata e usata per giardini e tombe nel I secolo, e che si trovava fuori delle mura della città al tempo di Gesù finché Agrippa I la racchiuse negli anni 40 d.C. La maggior parte degli studiosi accetta perciò la Chiesa del Santo Sepolcro come il luogo; Joan Taylor ha sostenuto che la crocifissione avvenisse più in basso, presso la strada a sud della roccia, e che il rilievo fosse scelto poi come scenario."
    - "L’alternativa è il Calvario di Gordon, una rupe con due grotte simili a occhiaie a nord della Porta di Damasco, suggerito per la prima volta da Otto Thenius nel 1842 e reso famoso dal generale Charles Gordon nel 1883, con la Tomba del Giardino accanto; la tomba, tuttavia, è dell’età del Ferro, scavata circa sette secoli prima di Gesù, e il sito ha poco sostegno fra gli studiosi, pur restando un quieto luogo di preghiera. La roccia del Golgota è oggi racchiusa nella Chiesa del Santo Sepolcro, condivisa da sei comunità cristiane, sotto un altare greco raggiungibile con scale accanto all’ingresso; la tomba si trova sotto l’Edicola restaurata nella rotonda."
  nl:
    - "Golgota is de plaats buiten Jeruzalem waar Jezus werd gekruisigd. De naam is Aramees, gulgulta, “schedel”; Mattheüs verklaart haar als “Hoofdschedelplaats”, en Lukas geeft alleen het Grieks, Kranion, dat de Latijnse Bijbel weergaf als Calvaria, vandaar Calvarie. Waarom zij zo heette, is niet bekend: een kale ronde rots, een executieplaats of een oude naam zijn allemaal gissingen. Johannes zegt dat de plaats “nabij de stad” was, zodat velen het opschrift op het kruis konden lezen, en dat “in de plaats, waar Hij gekruist was, een hof, en in den hof een nieuw graf” was; Hebreeën zegt dat Jezus “buiten de poort geleden” heeft. Zowel het Romeinse recht als de Joodse gewoonte plaatsten terechtstellingen en graven buiten de muren."
    - "In 325 of 326 n.Chr. liet Constantijn de tempel van Venus die Hadrianus midden in Aelia Capitolina had gebouwd afbreken, en Eusebius, een tijdgenoot, vertelt hoe daaronder een in de rots uitgehouwen graf aan het licht kwam dat voor het graf van Christus doorging; de kerk erboven werd in 335 ingewijd, en een rotsheuvel enkele tientallen meters ten zuidoosten van het graf werd vereerd als Golgota. De archeologie toont dat de plaats vanaf de 8e eeuw v.Chr. een kalksteengroeve was, verlaten en in de 1e eeuw gebruikt voor tuinen en graven, en buiten de stadsmuur van Jezus’ tijd lag tot Agrippa I haar in de jaren veertig n.Chr. insloot. De meeste geleerden aanvaarden daarom de Heilig-Grafkerk als de plaats; Joan Taylor heeft betoogd dat de kruisiging lager stond, aan de weg ten zuiden van de rots, en dat de heuvel later als blikvanger werd gekozen."
    - "Het alternatief is de Calvarie van Gordon, een klif met twee grotten als oogkassen ten noorden van de Damascuspoort, voor het eerst voorgesteld door Otto Thenius in 1842 en beroemd gemaakt door generaal Charles Gordon in 1883, met ernaast het Hoftomb; het graf is echter uit de IJzertijd, zo’n zeven eeuwen vóór Jezus uitgehouwen, en de plaats vindt weinig steun bij geleerden, al blijft zij een stille plek voor gebed. De rots van Golgota is nu ingesloten in de Heilig-Grafkerk, gedeeld door zes christelijke gemeenschappen, onder een Grieks altaar dat via trappen naast de ingang bereikt wordt; het graf ligt onder de herstelde Edicula in de rotonde."
  cs:
    - "Golgota je místo za hradbami Jeruzaléma, kde byl ukřižován Ježíš. Jméno je aramejské, gulgulta, „lebka“; Matouš je vysvětluje jako místo lebky a Lukáš dává jen řecké Kranion, které latinská Bible vyjádřila jako Calvaria, odtud Kalvárie. Proč se místo tak jmenovalo, není známo: holá zaoblená skála, popraviště nebo staré jméno jsou jen domněnky. Jan praví, že místo „blízko města bylo“, takže mnozí mohli číst nápis na kříži, a že „A byla na tom místě, kdež ukřižován byl, zahrada, a v zahradě hrob nový“; List Židům praví, že Ježíš „vně za branou trpěl“. Římské právo i židovský zvyk kladly popravy a hroby za hradby."
    - "Roku 325 nebo 326 n. l. nařídil Konstantin zbořit chrám Venuše, který Hadrianus postavil v srdci Aelie Capitoliny, a Eusebios, současník, vypráví, jak pod ním vyšla najevo skalní hrobka, pokládaná za hrob Kristův; kostel nad ní byl vysvěcen roku 335 a skalní pahorek několik desítek metrů jihovýchodně od hrobu byl uctíván jako Golgota. Archeologie ukázala, že místo bylo od 8. stol. př. n. l. vápencovým lomem, v 1. století opuštěným a užívaným pro zahrady a hroby, a že ležel mimo hradbu z doby Ježíšovy, dokud jej Agrippa I. ve 40. letech n. l. nezahrnul. Většina učenců proto přijímá Chrám Božího hrobu; Joan Taylor tvrdila, že ukřižování stálo níže, u cesty jižně od skály, a pahorek byl později vybrán jako ukázka."
    - "Alternativou je Gordonova Kalvárie, útes se dvěma jeskyněmi podobnými očním důlkům severně od Damašské brány, poprvé navržený Ottou Theniem roku 1842 a proslavený generálem Charlesem Gordonem roku 1883, se Zahradním hrobem vedle; hrob je však z doby železné, vytesaný asi sedm století před Ježíšem, a místo má malou podporu učenců, ačkoli zůstává tichým místem modlitby. Skála Golgoty je dnes uzavřena v Chrámu Božího hrobu, sdíleném šesti křesťanskými obcemi, pod řeckým oltářem, k němuž vedou schody vedle vchodu; hrob leží pod obnovenou Edikulou v rotundě."
  sv:
    - "Golgota är platsen utanför Jerusalem där Jesus korsfästes. Namnet är arameiskt, gulgulta, ”skalle”; Matteus förklarar det som ”huvudskalleplats”, och Lukas ger bara det grekiska, Kranion, som den latinska bibeln återgav Calvaria, varav Kalvarien. Varför det kallades så är okänt: en kal rundad klippa, en avrättningsplats eller ett gammalt namn är alla gissningar. Johannes säger att platsen ”låg nära staden”, så att många kunde läsa skylten på korset, och att ”invid det ställe där han hade blivit korsfäst var en örtagård, och i örtagården fanns en ny grav”; Hebreerbrevet säger att det var ”utanför stadsporten som Jesus utstod sitt lidande”. Både romersk rätt och judisk sed lade avrättningar och gravar utanför murarna."
    - "År 325 eller 326 lät Konstantin riva Venustemplet som Hadrianus byggt i hjärtat av Aelia Capitolina, och Eusebios, en samtida, berättar hur en klippgrav kom i dagen under det och togs för Kristi grav; kyrkan över den invigdes 335, och en klippkulle några tiotal meter sydost om graven vördades som Golgota. Arkeologin har visat att platsen var ett kalkstensbrott från 700-talet f.Kr., övergivet och använt till trädgårdar och gravar under första århundradet, och att den låg utanför stadsmuren på Jesu tid tills Agrippa I inneslöt den på 40-talet e.Kr. De flesta forskare godtar därför Heliga gravens kyrka som platsen; Joan Taylor har hävdat att korsfästelsen skedde lägre ned, vid vägen söder om klippan, med kullen senare vald som visningsplats."
    - "Alternativet är Gordons Golgota, en klippa med två grottor som ögonhålor norr om Damaskusporten, först föreslagen av Otto Thenius 1842 och gjord berömd av general Charles Gordon 1883, med Trädgårdsgraven intill; graven är dock från järnåldern, uthuggen omkring sju århundraden före Jesus, och platsen har litet vetenskapligt stöd, fast den förblir en stilla bönens plats. Golgotas klippa är i dag innesluten i Heliga gravens kyrka, delad av sex kristna samfund, under ett grekiskt altare som nås med trappor intill ingången; graven ligger under den restaurerade Edikulan i rotundan."
