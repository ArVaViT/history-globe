# Overview article (ADR 0007). Mainstream facts only; the Holy Sepulchre is given as the site most scholars accept, the Garden Tomb and Taylor's lower site as the alternatives; the Constantinian dates follow Eusebius.
id: golgotha
place: a631d35
title:
  en: "Golgotha"
  ru: "Голгофа"
  uk: "Голгофа"
  es: "Gólgota"
  pt: "Gólgota"
  de: "Golgatha"
  fr: "Golgotha"
body:
  en:
    - "Golgotha is the place outside Jerusalem where Jesus was crucified. The name is Aramaic, gulgulta, “skull”; Matthew explains it as “a place of a skull”, and Luke gives only the Greek, Kranion, which the Latin Bible rendered Calvaria, whence Calvary. Why it was so called is not known: a bare rounded rock, a place of execution, or an old name are all guesses. John says the place “was nigh to the city”, by a road where passers-by could read the title on the cross, and that “in the place where he was crucified there was a garden; and in the garden a new sepulchre”; Hebrews says Jesus “suffered without the gate”. Roman law and Jewish custom alike put executions and tombs outside the walls."
    - "In AD 325 or 326 Constantine ordered the temple of Venus that Hadrian had built in the heart of Aelia Capitolina to be pulled down, and Eusebius, who was there, tells how a rock-cut tomb came to light beneath it and was taken to be the tomb of Christ; the church over it was dedicated in 335, and a rock knoll a few dozen metres south-east of the tomb was venerated as Golgotha. Archaeology has shown that the site was a limestone quarry from the eighth century BC, abandoned and used for gardens and tombs in the first century, and that it lay outside the city wall of the time of Jesus until Agrippa I enclosed it in the 40s AD. Most scholars therefore accept the Church of the Holy Sepulchre as the place; Joan Taylor has argued that the crucifixion stood lower, by the road south of the rock, with the knoll later chosen as the showpiece."
    - "The alternative is Gordon's Calvary, a cliff with two caves like eye sockets north of the Damascus Gate, first suggested by Otto Thenius in 1842 and made famous by General Charles Gordon in 1883, with the Garden Tomb beside it; the tomb, however, is of the Iron Age, cut some seven centuries before Jesus, and the site has little scholarly support, though it remains a quiet place of prayer. The rock of Golgotha is today enclosed in the Church of the Holy Sepulchre, shared by six Christian communities, under a Greek altar reached by stairs beside the entrance; the tomb lies under the restored Edicule in the rotunda."
  ru:
    - "Голгофа — место за стенами Иерусалима, где был распят Иисус. Имя арамейское, гулгулта, «череп»; Матфей объясняет его как «Лобное место», а Лука даёт только греческое Кранион, которое латинская Библия передала как Calvaria, откуда Кальвария. Почему место так называлось, неизвестно: голая округлая скала, место казни или старое имя — всё это догадки. Иоанн говорит, что место «было недалеко от города», у дороги, где прохожие могли прочесть надпись на кресте, и что на том месте, где Он распят, «был сад, и в саду гроб новый»; Послание к Евреям говорит, что Иисус «пострадал вне врат». Римский закон и иудейский обычай одинаково выносили казни и гробницы за стены."
    - "В 325 или 326 году Константин велел снести храм Венеры, который Адриан построил в сердце Элии Капитолины, и Евсевий, бывший при этом, рассказывает, как под ним открылась высеченная в скале гробница, принятая за гроб Христов; церковь над ней освятили в 335 году, а скальный выступ в нескольких десятках метров к юго-востоку от гроба почитали как Голгофу. Археология показала, что здесь с VIII века до н. э. была каменоломня, заброшенная и занятая садами и гробницами в I веке, и что место лежало вне городской стены времён Иисуса, пока Агриппа I не обнёс его стеной в 40-х годах. Поэтому большинство учёных признаёт местом Храм Гроба Господня; Джоан Тейлор доказывала, что крест стоял ниже, у дороги к югу от скалы, а выступ был выбран позже как зримый знак."
    - "Другое предложение — Голгофа Гордона, обрыв с двумя пещерами, похожими на глазницы, к северу от Дамасских ворот, который впервые предложил Отто Тениус в 1842 году, а прославил генерал Чарльз Гордон в 1883 году, и Садовая гробница рядом; гробница, однако, относится к железному веку и высечена веков за семь до Иисуса, и у этого места мало поддержки среди учёных, хотя оно остаётся тихим местом молитвы. Скала Голгофы ныне заключена в Храме Гроба Господня, который делят шесть христианских общин, под греческим престолом, куда ведёт лестница у входа; гроб лежит под восстановленной Кувуклией в ротонде."
  uk:
    - "Голгофа — місце за межами Єрусалима, де розіп’яли Ісуса. Назва арамейська, ґулґулта, «череп»; Матвій пояснює її як «Черепове місце», а Лука дає лише грецьке Краніон, яке латинська Біблія передала як Calvaria, звідки походить назва «Кальварія». Чому її так названо, невідомо: гола округла скеля, місце страт або давня назва — усе це здогади. Іван каже, що «поблизу города було місце, де розпято Ісуса», біля дороги, де перехожі могли прочитати напис на хресті, і що «на місцї, де розпято Його, сад, а в саду новий гріб»; послання до євреїв каже, що Ісус «осторонь воріт пострадав». І римське право, і юдейський звичай виносили страти й гробниці за мури."
    - "У 325 або 326 р. н. е. Костянтин наказав розібрати храм Венери, який Адріан збудував у серці Елії Капітоліни, і Євсевій, який там був, розповідає, як під ним виявили вирубану в скелі гробницю, яку визнали гробницею Христа; церкву над нею освятили 335 року, а скельний горб за кілька десятків метрів на південний схід від гробниці шанували як Голгофу. Археологія показала, що місце було вапняковим кар’єром з VIII ст. до н. е., покинутим і використаним під сади й гробниці в I ст., і що воно лежало за міським муром часів Ісуса, доки Агриппа I не охопив його стіною в 40-х роках н. е. Тому більшість дослідників приймає Церкву Гробу Господнього як це місце; Джоан Тейлор доводила, що розп’яття стояло нижче, біля дороги на південь від скелі, а горб пізніше обрали для показу."
    - "Альтернатива — Голгофа Гордона, скеля з двома печерами, подібними до очних западин, на північ від Дамаських воріт, уперше запропонована Отто Тениусом 1842 року й прославлена генералом Чарльзом Гордоном 1883 року, з Садовою гробницею поряд; однак гробниця належить до залізного віку, вирубана приблизно за сім століть до Ісуса, і це місце має мало наукової підтримки, хоч лишається тихим місцем молитви. Скеля Голгофи нині замкнена в Церкві Гробу Господнього, яку ділять шість християнських громад, під грецьким вівтарем, до якого ведуть сходи біля входу; гробниця лежить під відновленою Едикулою в ротонді."
  es:
    - "El Gólgota es el lugar fuera de Jerusalén donde Jesús fue crucificado. El nombre es arameo, gulgulta, «calavera»; Mateo lo explica como «El lugar de la calavera», y Lucas da solo el griego, Kranion, que la Biblia latina tradujo Calvaria, de donde Calvario. Se ignora por qué se llamaba así: una roca desnuda y redondeada, un lugar de ejecución o un nombre antiguo son todas conjeturas. Juan dice que el lugar «era cerca de la ciudad», junto a un camino donde los transeúntes podían leer el título de la cruz, y que «En aquel lugar donde había sido crucificado, había un huerto; y en el huerto un sepulcro nuevo»; Hebreos dice que Jesús «padeció fuera de la puerta». Tanto la ley romana como la costumbre judía situaban ejecuciones y tumbas fuera de las murallas."
    - "En el 325 o 326 d. C. Constantino ordenó derribar el templo de Venus que Adriano construyó en el corazón de Aelia Capitolina, y Eusebio, presente, cuenta que salió a la luz bajo él una tumba excavada en la roca tomada por el sepulcro de Cristo; la iglesia sobre ella fue dedicada en el 335, y un montículo de roca a decenas de metros al sudeste de la tumba fue venerado como Gólgota. La arqueología muestra que el sitio fue cantera de piedra caliza desde el siglo VIII a. C., abandonada y usada para huertos y tumbas en el siglo I, y quedaba fuera de la muralla de la ciudad de Jesús hasta que Agripa I la incluyó en los años 40 d. C. Por eso la mayoría de los estudiosos aceptan la Iglesia del Santo Sepulcro como el lugar; Joan Taylor sostiene que la crucifixión fue más abajo, junto al camino al sur de la roca, y que el montículo se escogió después como pieza de exhibición."
    - "La alternativa es el Calvario de Gordon, un acantilado con dos cuevas como cuencas de ojos al norte de la puerta de Damasco, sugerido por primera vez por Otto Thenius en 1842 y hecho famoso por el general Charles Gordon en 1883, con la Tumba del Jardín a su lado; la tumba, sin embargo, es de la Edad del Hierro, excavada unos siete siglos antes de Jesús, y el sitio cuenta con poco apoyo académico, aunque sigue siendo un tranquilo lugar de oración. La roca del Gólgota está hoy encerrada en la Iglesia del Santo Sepulcro, compartida por seis comunidades cristianas, bajo un altar griego al que se llega por unas escaleras junto a la entrada; la tumba se halla bajo el Edículo restaurado, en la rotonda."
  pt:
    - "Gólgota é o lugar fora de Jerusalém onde Jesus foi crucificado. O nome é aramaico, gulgulta, “caveira”; Mateus o explica como “Lugar da Caveira”, e Lucas dá apenas o grego, Kranion, que a Bíblia latina verteu Calvaria, de onde Calvário. Por que assim se chamava não se sabe: uma rocha nua e arredondada, um lugar de execução ou um nome antigo são todos palpites. João diz que o lugar “era perto da cidade”, junto a uma estrada onde os passantes podiam ler o título da cruz, e que “no lugar onde ele foi crucificado havia um jardim. No jardim havia um sepulcro novo”; Hebreus diz que Jesus “sofreu fora da porta”. A lei romana e o costume judaico igualmente punham execuções e túmulos fora das muralhas."
    - "Em 325 ou 326 d.C., Constantino mandou demolir o templo de Vênus que Adriano erguera no coração de Aelia Capitolina, e Eusébio, que estava lá, conta como um túmulo escavado na rocha veio à luz debaixo dele e foi tido como o túmulo de Cristo; a igreja sobre ele foi dedicada em 335, e uma colina rochosa a algumas dezenas de metros a sudeste do túmulo foi venerada como o Gólgota. A arqueologia mostrou que o sítio era uma pedreira de calcário desde o século VIII a.C., abandonada e usada para jardins e túmulos no século I, e que ficava fora da muralha da cidade do tempo de Jesus até que Agripa I a incluiu nos anos 40 d.C. A maioria dos estudiosos aceita, por isso, a Igreja do Santo Sepulcro como o lugar; Joan Taylor sustentou que a crucificação se deu mais abaixo, junto à estrada ao sul da rocha, tendo a colina sido escolhida depois como peça de mostruário."
    - "A alternativa é o Calvário de Gordon, um penhasco com duas cavernas como órbitas de olhos ao norte da Porta de Damasco, sugerido primeiro por Otto Thenius em 1842 e tornado famoso pelo general Charles Gordon em 1883, com o Túmulo do Jardim ao lado; o túmulo, porém, é da Idade do Ferro, escavado uns sete séculos antes de Jesus, e o sítio tem pouco apoio entre os estudiosos, embora continue sendo um lugar tranquilo de oração. A rocha do Gólgota está hoje encerrada na Igreja do Santo Sepulcro, partilhada por seis comunidades cristãs, sob um altar grego a que se chega por escadas junto à entrada; o túmulo fica sob a Edícula restaurada, na rotunda."
  de:
    - "Golgatha ist der Ort vor Jerusalem, an dem Jesus gekreuzigt wurde. Der Name ist aramäisch, gulgulta, „Schädel“; Matthäus erklärt ihn als „Schädelstätte“, und Lukas gibt nur das Griechische, Kranion, das die lateinische Bibel Calvaria wiedergab, daher der Kalvarienberg. Warum er so hieß, ist nicht bekannt: ein kahler runder Fels, eine Hinrichtungsstätte oder ein alter Name sind lauter Vermutungen. Johannes sagt, die Stätte „war nahe bei der Stadt“, an einer Straße, wo Vorübergehende die Überschrift am Kreuz lesen konnten, und dass „an der Stätte, da er gekreuzigt ward, ein Garten“ war, „und im Garten ein neues Grab“; der Hebräerbrief sagt, Jesus habe „gelitten draußen vor dem Tor“. Römisches Recht und jüdische Sitte setzten Hinrichtungen und Gräber gleichermaßen außerhalb der Mauern an."
    - "325 oder 326 n. Chr. ließ Konstantin den Venustempel, den Hadrian im Herzen von Aelia Capitolina gebaut hatte, abreißen, und Eusebius, der dabei war, erzählt, darunter sei ein Felsengrab ans Licht gekommen und für das Grab Christi gehalten worden; die Kirche darüber wurde 335 geweiht, und eine Felskuppe einige Dutzend Meter südöstlich des Grabes wurde als Golgatha verehrt. Die Archäologie hat gezeigt, dass die Stätte seit dem 8. Jahrhundert v. Chr. ein Kalksteinbruch war, im 1. Jahrhundert aufgegeben und für Gärten und Gräber genutzt wurde und zur Zeit Jesu außerhalb der Stadtmauer lag, bis Agrippa I. sie in den 40er Jahren n. Chr. einschloss. Die meisten Forscher akzeptieren daher die Grabeskirche als den Ort; Joan Taylor hat vertreten, die Kreuzigung habe tiefer gestanden, an der Straße südlich des Felsens, und die Kuppe sei später als Schauplatz gewählt worden."
    - "Die Alternative ist Gordons Kalvarienberg, eine Felswand mit zwei augenhöhlenartigen Höhlen nördlich des Damaskustors, 1842 von Otto Thenius zuerst vorgeschlagen und 1883 durch General Charles Gordon berühmt gemacht, mit dem Gartengrab daneben; das Grab stammt jedoch aus der Eisenzeit, etwa sieben Jahrhunderte vor Jesus gehauen, und die Stätte findet in der Forschung wenig Unterstützung, bleibt aber ein stiller Ort des Gebets. Der Felsen von Golgatha ist heute in die Grabeskirche eingeschlossen, die sechs christliche Gemeinschaften teilen, unter einem griechischen Altar, zu dem Stufen neben dem Eingang führen; das Grab liegt unter der restaurierten Ädikula in der Rotunde."
  fr:
    - "Golgotha est le lieu, hors de Jérusalem, où Jésus fut crucifié. Le nom est araméen, gulgulta, « crâne » ; Matthieu l’explique par « lieu du crâne », et Luc ne donne que le grec, Kranion, que la Bible latine rendit par Calvaria, d’où Calvaire. On ignore pourquoi on l’appelait ainsi : un roc nu et arrondi, un lieu d’exécution ou un très ancien nom ne sont que des conjectures. Jean dit que le lieu « était près de la ville », au bord d’une route où les passants pouvaient lire l’inscription de la croix, et qu’« il y avait un jardin dans le lieu où Jésus avait été crucifié, et dans le jardin un sépulcre neuf » ; l’épître aux Hébreux dit que Jésus « a souffert hors de la porte ». Le droit romain comme la coutume juive plaçaient exécutions et tombes hors des murs."
    - "En 325 ou 326 apr. J.-C., Constantin ordonna de démolir le temple de Vénus qu’Hadrien avait bâti au cœur d’Aelia Capitolina, et Eusèbe, présent, raconte comment un tombeau taillé dans le roc apparut dessous et fut pris pour le tombeau du Christ ; l’église qui le couvrait fut dédiée en 335, et un rocher à quelques dizaines de mètres au sud-est du tombeau fut vénéré comme Golgotha. L’archéologie a montré que le site était une carrière de calcaire dès le VIIIe siècle av. J.-C., abandonnée et utilisée pour des jardins et des tombes au Ier siècle, et qu’il était hors du mur de la ville au temps de Jésus, jusqu’à son inclusion par Agrippa Ier dans les années 40 apr. J.-C. La plupart admettent donc le Saint-Sépulcre ; Joan Taylor a soutenu que la crucifixion eut lieu plus bas, près de la route au sud du rocher, le tertre n’étant choisi que plus tard comme vitrine."
    - "L’autre hypothèse est le Calvaire de Gordon, une falaise percée de deux grottes comme des orbites, au nord de la porte de Damas, suggérée d’abord par Otto Thenius en 1842 et rendue célèbre par le général Charles Gordon en 1883, avec le Tombeau du Jardin à côté ; ce tombeau est pourtant de l’âge du Fer, creusé quelque sept siècles avant Jésus, et le site n’a guère de soutien chez les spécialistes, bien qu’il reste un lieu de prière paisible. Le rocher du Golgotha est aujourd’hui enfermé dans l’église du Saint-Sépulcre, partagée entre six communautés chrétiennes, sous un autel grec auquel on accède par des marches à côté de l’entrée ; le tombeau se trouve sous l’édicule restauré, dans la rotonde."
