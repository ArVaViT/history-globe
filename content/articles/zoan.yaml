body:
  en:
    - "Zoan, called Djanet by the Egyptians and Tanis by the Greeks, lies at San el-Hagar in the north-eastern Nile delta, on the Tanitic branch of the river, which has since silted up. Its great temple of Amun was built largely of older monuments, obelisks, statues and blocks of Ramesses II, brought from Pi-Ramesses, the earlier capital about 20 km to the south. For that reason Tanis was long mistaken for Pi-Ramesses itself."
    - "About 1069 BC Smendes founded the Twenty-first Dynasty, and Tanis was the royal city of the Twenty-first and Twenty-second Dynasties. In the Report of Wenamun the envoy of Amun's temple at Thebes calls on Smendes at Tanis on his way to Byblos. Auguste Mariette and Flinders Petrie dug here in the nineteenth century, and in 1939–1940 Pierre Montet found the royal tombs within the temple enclosure, among them the unplundered burials of Psusennes I, Amenemope and Shoshenq II."
    - 'Numbers notes that Hebron was built seven years before Zoan in Egypt. A psalm recalls the wonders God wrought in Egypt "in the field of Zoan". Isaiah mocks Pharaoh''s counsellors: "the princes of Zoan are fools"; rebuking those who go down to Egypt to seek Pharaoh''s strength, he says: "his princes were at Zoan". Ezekiel foretold that God would set fire in Zoan.'
    - "A copy of the Canopus decree of the priests in honour of Ptolemy III (238 BC) was found at Tanis by Richard Lepsius in 1866. Strabo knew Tanis as a large city, while Josephus calls it a small town, where Titus spent a night on his march from Alexandria to Jerusalem in AD 70. In the 380s, by the usual dating, the pilgrim Egeria came to Tathnis, usually taken to be Tanis, which, she writes, had once been Pharaoh's capital and was the city where Moses was born."
  ru:
    - "Цоан, у египтян Джанет, а у греков Танис, лежит у селения Сан-эль-Хагар на северо-востоке дельты Нила, на Танисском рукаве реки, который с тех пор занесло илом. Его великий храм Амона был построен во многом из более древних памятников — обелисков, статуй и блоков Рамсеса II, привезённых из Пи-Рамсеса, прежней столицы примерно в 20 км к югу. Поэтому Танис долго ошибочно принимали за сам Пи-Рамсес."
    - "Около 1069 г. до н. э. Смендес основал XXI династию, и Танис был царским городом XXI и XXII династий. В «Путешествии Ун-Амона» посланец фиванского храма Амона по пути в Библ заходит в Танис к Смендесу. В XIX веке здесь копали Огюст Мариетт и Флиндерс Питри, а в 1939–1940 гг. Пьер Монте нашёл в ограде храма царские гробницы, среди них неразграбленные погребения Псусеннеса I, Аменемопе и Шешонка II."
    - "Книга Чисел замечает, что Хеврон построен был семью годами прежде Цоана, города Египетского. Псалом вспоминает чудеса, сотворённые Богом в Египте «на поле Цоан». Исаия насмехается над советниками фараона: «обезумели князья Цоанские»; а обличая тех, кто идёт в Египет искать силы фараона, говорит: «князья его уже в Цоане». Иезекииль предрекал, что Бог пошлёт огонь на Цоан."
    - "Копию Канопского декрета жрецов в честь Птолемея III (238 г. до н. э.) нашёл в Танисе Рихард Лепсиус в 1866 г. Страбон знал Танис как большой город, а Иосиф Флавий называет его маленьким городком, где Тит заночевал в 70 г. н. э. по пути из Александрии к Иерусалиму. В 380-х годах, по обычной датировке, паломница Эгерия пришла в Татнис, который обычно считают Танисом; по её словам, некогда это была столица фараона и здесь родился Моисей."
  uk:
    - "Цоан, який єгиптяни називали Джанет, а греки Танісом, лежить у Сан-ель-Хагарі на північному сході дельти Нілу, на танітському рукаві річки, що відтоді замулився. Його великий храм Амона був збудований здебільшого зі старіших пам’яток, обелісків, статуй і блоків Рамсеса II, привезених з Пер-Рамсеса, раніше столиці приблизно за 20 км на південь. Тому Таніс довго помилково вважали самим Пер-Рамсесом."
    - "Близько 1069 р. до н. е. Смендес заснував XXI династію, і Таніс був царським містом XXI і XXII династій. У «Звіті Венамона» посланець храму Амона у Фівах відвідує Смендеса в Танісі на шляху до Бібла. Огюст Марієтт і Фліндерс Петрі копали тут у XIX столітті, а в 1939–1940 роках П’єр Монте знайшов царські гробниці в межах огорожі храму, серед них неограбовані поховання Псусеннеса I, Аменемопета і Шешонка II."
    - "Книга Чисел зазначає, що «Геброн же збудовано за сїм років перед Зоаном в Египтї». Псалом пригадує чудеса, які Бог учинив у Єгипті «на полї Зоан». Ісая глузує з радників фараона: «втеряла розум старшина Зоанська»; докоряючи тим, хто сходить до Єгипту шукати сили фараона, він каже: «Князї твої прийдуть у Зоан-город». Єзекіїль передрік, що Бог «пущу пожаром Зоан»."
    - "Копію Канопського декрету жерців на честь Птолемея III (238 р. до н. е.) знайшов у Танісі Ріхард Лепсіус 1866 року. Страбон знав Таніс як велике місто, тоді як Йосиф Флавій називає його малим містечком, де Тит провів ніч під час походу з Александрії до Єрусалима 70 року н. е. У 380-х роках за звичайним датуванням прочанка Егерія прийшла до Татніса, який зазвичай беруть за Таніс і який, пише вона, колись був столицею фараона і містом, де народився Мойсей."
  es:
    - "Zoán, llamada Djanet por los egipcios y Tanis por los griegos, se encuentra en San el-Hagar, en el noreste del delta del Nilo, en el brazo tanítico del río, que desde entonces se ha cegado. Su gran templo de Amón se construyó en buena parte con monumentos más antiguos, obeliscos, estatuas y bloques de Ramsés II, traídos de Pi-Ramsés, la capital anterior, a unos 20 km al sur. Por eso Tanis se confundió durante mucho tiempo con la propia Pi-Ramsés."
    - "Hacia 1069 a. C. Esmendes fundó la dinastía XXI, y Tanis fue la ciudad real de las dinastías XXI y XXII. En el Relato de Unamón, el enviado del templo de Amón en Tebas visita a Esmendes en Tanis de camino a Biblos. Auguste Mariette y Flinders Petrie excavaron aquí en el siglo XIX, y en 1939–1940 Pierre Montet halló las tumbas reales dentro del recinto del templo, entre ellas los enterramientos sin saquear de Psusennes I, Amenemope y Sheshonq II."
    - "Números anota que Hebrón fue edificada siete años antes que Zoán, en Egipto. Un salmo recuerda las maravillas que Dios hizo en Egipto «en el campo de Zoán». Isaías se burla de los consejeros del faraón: «son necios los príncipes de Zoán»; al reprender a los que descienden a Egipto a buscar la fuerza del faraón, dice: «Cuando estarán sus príncipes en Zoán». Ezequiel anunció que Dios pondría fuego en Zoán."
    - "Una copia del decreto de Canopo de los sacerdotes en honor de Ptolomeo III (238 a. C.) fue hallada en Tanis por Richard Lepsius en 1866. Estrabón conocía Tanis como una gran ciudad, mientras que Josefo la llama una pequeña población, donde Tito pasó una noche en su marcha de Alejandría a Jerusalén en el 70 d. C. En los años 380, según la datación habitual, la peregrina Egeria llegó a Tathnis, que suele tomarse por Tanis, la cual, escribe, había sido una vez la capital del faraón y era la ciudad donde nació Moisés."
  pt:
    - "Zoã, chamada Djanet pelos egípcios e Tânis pelos gregos, fica em San el-Hagar, no nordeste do delta do Nilo, no braço tanítico do rio, que desde então assoreou. Seu grande templo de Amom foi construído em grande parte com monumentos mais antigos, obeliscos, estátuas e blocos de Ramsés II, trazidos de Pi-Ramsés, a capital anterior, uns 20 km ao sul. Por isso Tânis foi por muito tempo tomada pela própria Pi-Ramsés."
    - "Por volta de 1069 a.C., Esmendes fundou a XXI Dinastia, e Tânis foi a cidade real da XXI e da XXII Dinastias. No Relato de Wenamun, o enviado do templo de Amom em Tebas visita Esmendes em Tânis a caminho de Biblos. Auguste Mariette e Flinders Petrie escavaram aqui no século XIX, e em 1939–1940 Pierre Montet encontrou as tumbas reais dentro do recinto do templo, entre elas os sepultamentos não saqueados de Psusenes I, Amenemope e Sheshonq II."
    - "Números nota que Hebrom foi edificada sete anos antes de Zoã, no Egito. Um salmo recorda as maravilhas que Deus fez no Egito “no campo de Zoã”. Isaías zomba dos conselheiros do Faraó: “Os príncipes de Zoã são totalmente tolos”; repreendendo os que descem ao Egito para buscar a força do Faraó, diz: “Pois os seus príncipes estão em Zoã”. Ezequiel predisse que Deus poria fogo em Zoã."
    - "Uma cópia do decreto de Canopo dos sacerdotes em honra de Ptolomeu III (238 a.C.) foi achada em Tânis por Richard Lepsius em 1866. Estrabão conhecia Tânis como uma grande cidade, enquanto Josefo a chama de pequena cidade, onde Tito passou uma noite em sua marcha de Alexandria a Jerusalém em 70 d.C. Na década de 380, pela datação usual, a peregrina Egéria chegou a Tathnis, geralmente tomada por Tânis, que, escreve ela, fora a capital do Faraó e era a cidade onde Moisés nasceu."
  de:
    - "Zoan, bei den Ägyptern Djanet, bei den Griechen Tanis genannt, liegt bei San el-Hagar im nordöstlichen Nildelta am tanitischen Nilarm, der inzwischen verlandet ist. Sein großer Amun-Tempel wurde größtenteils aus älteren Denkmälern gebaut, Obelisken, Statuen und Blöcken Ramses' II., aus Pi-Ramesse, der früheren Hauptstadt etwa 20 km südlich. Deshalb hielt man Tanis lange für Pi-Ramesse selbst."
    - "Um 1069 v. Chr. begründete Smendes die 21. Dynastie, und Tanis war die Residenzstadt der 21. und 22. Dynastie. Im Bericht des Wenamun besucht der Gesandte des Amun-Tempels von Theben Smendes in Tanis auf dem Weg nach Byblos. Auguste Mariette und Flinders Petrie gruben hier im neunzehnten Jahrhundert, und 1939–1940 fand Pierre Montet innerhalb des Tempelbezirks die Königsgräber, darunter die unausgeraubten Bestattungen von Psusennes I., Amenemope und Scheschonq II."
    - "Das Buch Numeri vermerkt, dass Hebron sieben Jahre vor Zoan in Ägypten gebaut wurde. Ein Psalm erinnert an die Wunder, die Gott in Ägypten „im Felde Zoan“ tat. Jesaja verspottet die Berater des Pharao: „Die Fürsten zu Zoan sind Toren“; wer nach Ägypten hinabzieht, um die Stärke des Pharao zu suchen, den tadelt er: „Ihre Fürsten sind wohl zu Zoan gewesen“. Hesekiel sagte voraus, Gott werde in Zoan ein Feuer anzünden."
    - "Eine Abschrift des Dekrets von Kanopus der Priester zu Ehren Ptolemaios' III. (238 v. Chr.) fand Richard Lepsius 1866 in Tanis. Strabon kannte Tanis als große Stadt, während Josephus es eine kleine Stadt nennt, wo Titus auf seinem Marsch von Alexandria nach Jerusalem im Jahr 70 n. Chr. eine Nacht verbrachte. In den 380er Jahren, nach der üblichen Datierung, kam die Pilgerin Egeria nach Tathnis, meist für Tanis gehalten, das, wie sie schreibt, einst die Hauptstadt des Pharao gewesen und die Stadt war, in der Mose geboren wurde."
  fr:
    - "Tsoan, appelée Djanet par les Égyptiens et Tanis par les Grecs, se trouve à San el-Hagar, dans le nord-est du delta du Nil, sur la branche tanitique du fleuve, aujourd’hui ensablée. Son grand temple d’Amon fut bâti en grande partie avec des monuments plus anciens, obélisques, statues et blocs de Ramsès II, apportés de Pi-Ramsès, la capitale antérieure à environ 20 km au sud. Pour cette raison, Tanis fut longtemps prise pour Pi-Ramsès elle-même."
    - "Vers 1069 av. J.-C., Smendès fonda la XXIe dynastie, et Tanis fut la ville royale des XXIe et XXIIe dynasties. Dans le Rapport d’Ounamon, l’envoyé du temple d’Amon à Thèbes rend visite à Smendès à Tanis en route vers Byblos. Auguste Mariette et Flinders Petrie y fouillèrent au XIXe siècle, et en 1939-1940 Pierre Montet trouva dans l’enceinte du temple les tombes royales, dont les sépultures intactes de Psousennès Ier, d’Amenemopé et de Sheshonq II."
    - "Les Nombres notent qu’Hébron fut bâtie sept ans avant Tsoan en Égypte. Un psaume rappelle les prodiges de Dieu en Égypte « dans les campagnes de Tsoan ». Ésaïe se moque des conseillers de Pharaon : « Les princes de Tsoan ne sont que des insensés » ; reprochant à ceux qui descendent en Égypte chercher la force de Pharaon, il dit : « Déjà ses princes sont à Tsoan ». Ézéchiel annonça que Dieu mettrait le feu à Tsoan."
    - "Une copie du décret de Canope des prêtres en l’honneur de Ptolémée III (238 av. J.-C.) fut trouvée à Tanis par Richard Lepsius en 1866. Strabon connaissait Tanis comme une grande ville, tandis que Josèphe l’appelle une petite bourgade, où Titus passa une nuit lors de sa marche d’Alexandrie à Jérusalem en 70 apr. J.-C. Dans les années 380, selon la datation usuelle, la pèlerine Égérie vint à Tathnis, d’ordinaire prise pour Tanis, qui, écrit-elle, avait été la capitale de Pharaon et la ville où Moïse était né."
  pl:
    - "Soan, zwane przez Egipcjan Dżanet, a przez Greków Tanis, leży w San el-Hadżar w północno-wschodniej delcie Nilu, nad tanickim ramieniem rzeki, które od tego czasu uległo zamuleniu. Jego wielką świątynię Amona zbudowano w dużej mierze z dawniejszych pomników, obelisków, posągów i bloków Ramzesa II, sprowadzonych z Per-Ramzesa, wcześniejszej stolicy około 20 km na południe. Z tego powodu Tanis długo mylono z samym Per-Ramzesem."
    - "Około 1069 roku p.n.e. Smendes założył XXI dynastię, a Tanis było miastem królewskim XXI i XXII dynastii. W Opowieści o Wenamonie wysłannik świątyni Amona w Tebach odwiedza Smendesa w Tanis w drodze do Byblos. Auguste Mariette i Flinders Petrie kopali tu w XIX wieku, a w latach 1939–1940 Pierre Montet znalazł grobowce królewskie w obrębie świątyni, wśród nich nietknięte pochówki Psusennesa I, Amenemope i Szoszenka II."
    - "Księga Liczb zaznacza, że Hebron zbudowano siedem lat przed Soan w Egipcie. Psalm przypomina cuda, które Bóg uczynił w Egipcie „na polu Soan”. Izajasz szydzi z doradców Faraona: „zgłupieli książęta Soańscy”; karcąc tych, którzy zstępują do Egiptu szukać mocy Faraona, mówi: „byli w Soan książęta jego”. Ezechiel zapowiedział, że Bóg rozniecie ogień w Soan."
    - "Kopię dekretu z Kanopos kapłanów na cześć Ptolemeusza III (238 rok p.n.e.) znalazł w Tanis Richard Lepsius w 1866 roku. Strabon znał Tanis jako wielkie miasto, podczas gdy Józef Flawiusz nazywa je małym miastem, gdzie Tytus spędził noc w marszu z Aleksandrii do Jerozolimy w 70 roku n.e. W latach osiemdziesiątych IV wieku, według zwykłego datowania, pątniczka Egeria przybyła do Tathnis, uważanego zwykle za Tanis, które, jak pisze, było niegdyś stolicą Faraona i miastem, w którym urodził się Mojżesz."
  it:
    - "Soan, chiamata Djanet dagli Egizi e Tanis dai Greci, sorge a San el-Hagar nel delta nord-orientale del Nilo, sul ramo tanitico del fiume, da allora insabbiato. Il suo grande tempio di Amon fu costruito in gran parte con monumenti più antichi, obelischi, statue e blocchi di Ramses II, portati da Pi-Ramses, la capitale precedente circa 20 km a sud. Per questo Tanis fu a lungo scambiata per la stessa Pi-Ramses."
    - "Verso il 1069 a.C. Smendes fondò la XXI dinastia, e Tanis fu la città reale della XXI e della XXII dinastia. Nel Rapporto di Wenamun l’inviato del tempio di Amon a Tebe fa visita a Smendes a Tanis durante il viaggio verso Biblo. Auguste Mariette e Flinders Petrie scavarono qui nell’Ottocento, e nel 1939–1940 Pierre Montet trovò le tombe reali dentro il recinto del tempio, fra cui le sepolture inviolate di Psusenne I, Amenemope e Sheshonq II."
    - "I Numeri notano che Ebron fu edificata sette anni prima di Soan in Egitto. Un salmo ricorda le meraviglie che Dio compì in Egitto «nelle campagne di Zoan». Isaia schernisce i consiglieri del Faraone: «I principi di Tsoan non son che degli stolti»; rimproverando quelli che scendono in Egitto a cercare la forza del Faraone, dice: «I principi di Giuda son già a Tsoan». Ezechiele predisse che Dio avrebbe dato alle fiamme Soan."
    - "Una copia del decreto di Canopo dei sacerdoti in onore di Tolomeo III (238 a.C.) fu trovata a Tanis da Richard Lepsius nel 1866. Strabone conosceva Tanis come una grande città, mentre Giuseppe Flavio la chiama una piccola città, dove Tito trascorse una notte durante la marcia da Alessandria a Gerusalemme nel 70 d.C. Negli anni 380, secondo la datazione abituale, la pellegrina Egeria giunse a Tathnis, di solito ritenuta Tanis, che, scrive, era stata un tempo la capitale del Faraone e la città dove nacque Mosè."
  nl:
    - "Zoan, door de Egyptenaren Djanet genoemd en door de Grieken Tanis, ligt bij San el-Hagar in de noordoostelijke Nijldelta, aan de Tanitische arm van de rivier, die sindsdien is dichtgeslibd. De grote tempel van Amon werd grotendeels gebouwd van oudere monumenten, obelisken, beelden en blokken van Ramses II, aangevoerd uit Pi-Ramses, de eerdere hoofdstad ongeveer 20 km naar het zuiden. Daarom werd Tanis lang voor Pi-Ramses zelf aangezien."
    - "Omstreeks 1069 v.Chr. stichtte Smendes de Eenentwintigste Dynastie, en Tanis was de koningsstad van de Eenentwintigste en Tweeëntwintigste Dynastie. In het Verslag van Wenamun bezoekt de gezant van de tempel van Amon in Thebe Smendes in Tanis op weg naar Byblos. Auguste Mariette en Flinders Petrie groeven hier in de negentiende eeuw, en in 1939–1940 vond Pierre Montet de koningsgraven binnen de tempelomheining, onder meer de onberoofde graven van Psusennes I, Amenemope en Sjosjenq II."
    - "Numeri vermeldt dat Hebron zeven jaar vóór Zoan in Egypte werd gebouwd. Een psalm herinnert aan de wonderen die God in Egypte deed “in het veld van Zoan”. Jesaja bespot de raadgevers van Farao: “de vorsten van Zoan zijn dwazen”; wie naar Egypte afdaalt om Farao’s sterkte te zoeken, bestraft hij: “Wanneer zijn vorsten zullen geweest zijn tot Zoan”. Ezechiël voorspelde dat God in Zoan een vuur zou leggen."
    - "Een afschrift van het decreet van Canopus van de priesters ter ere van Ptolemaeus III (238 v.Chr.) werd in 1866 door Richard Lepsius in Tanis gevonden. Strabo kende Tanis als een grote stad, terwijl Flavius Josephus het een kleine stad noemt, waar Titus een nacht doorbracht op zijn mars van Alexandrië naar Jeruzalem in 70 n.Chr. In de jaren 380, volgens de gebruikelijke datering, kwam de pelgrim Egeria in Tathnis, gewoonlijk voor Tanis gehouden, dat, schrijft zij, eens de hoofdstad van Farao was geweest en de stad waar Mozes was geboren."
  cs:
    - "Coan, které Egypťané nazývali Džanet a Řekové Tanis, leží v San el-Hadžar v severovýchodní nilské deltě, na tanitském rameni řeky, které se mezitím zaneslo. Jeho velký chrám Amonův byl postaven z velké části ze starších památek, obelisků, soch a bloků Ramesse II., přivezených z Pi-Ramesse, dřívějšího hlavního města asi 20 km na jih. Proto byl Tanis dlouho považován za samotné Pi-Ramesse."
    - "Kolem roku 1069 př. n. l. založil Smendes XXI. dynastii a Tanis bylo královským městem XXI. a XXII. dynastie. Ve Zprávě o Wenamunovi navštěvuje vyslanec chrámu Amonova v Thébách Smendese v Tanisu na cestě do Byblu. Auguste Mariette a Flinders Petrie zde kopali v 19. století a v letech 1939–1940 našel Pierre Montet královské hrobky uvnitř okrsku chrámu, mezi nimi nevyloupené pohřby Psusennesa I., Amenemopeho a Šošenka II."
    - "Numeri poznamenávají, že Hebron byl vystavěn sedm let před Coanem v Egyptě. Žalm připomíná zázraky, které Bůh učinil v Egyptě „na poli Soan“. Izajáš se vysmívá faraonovým radcům: „jsou blázni knížata Soan“; kárá ty, kdo sestupují do Egypta hledat faraonovu sílu, a praví: „knížata jeho byli v Soan“. Ezechiel předpověděl, že Bůh zapálí oheň v Coanu."
    - "Kopii Kanópského dekretu kněží na počest Ptolemaia III. (238 př. n. l.) našel v Tanisu Richard Lepsius roku 1866. Strabón znal Tanis jako velké město, zatímco Josephus je nazývá malým městem, kde Titus strávil noc na pochodu z Alexandrie do Jeruzaléma roku 70 n. l. V 80. letech 4. století, podle obvyklého datování, přišla poutnice Egerie do Tathnis, obvykle pokládaného za Tanis, které, jak píše, bylo kdysi hlavním městem faraonovým a městem, kde se narodil Mojžíš."
  sv:
    - "Soan, av egyptierna kallat Djanet och av grekerna Tanis, ligger vid San el-Hagar i nordöstra Nildeltat, vid den tanitiska grenen av floden, som sedan dess har slammat igen. Dess stora Amontempel byggdes till stor del av äldre monument, obelisker, statyer och block från Ramses II, förda från Pi-Ramses, den tidigare huvudstaden omkring 20 km söderut. Av det skälet förväxlades Tanis länge med själva Pi-Ramses."
    - "Omkring 1069 f.Kr. grundade Smendes tjugoförsta dynastin, och Tanis var kungastad för tjugoförsta och tjugoandra dynastin. I Wenamons rapport besöker Amontemplet i Thebes sändebud Smendes i Tanis på väg till Byblos. Auguste Mariette och Flinders Petrie grävde här på 1800-talet, och 1939–1940 fann Pierre Montet de kungliga gravarna inom tempelområdet, bland dem de oplundrade begravningarna av Psusennes I, Amenemope och Shoshenq II."
    - "I Fjärde Mosebok antecknas att Hebron byggdes sju år före Soan i Egypten. En psalm minns underverken som Gud gjorde i Egypten ”på Soans mark”. Jesaja hånar Faraos rådgivare: ”Soans furstar hava blivit dårar”; när han förebrår dem som drar ner till Egypten för att söka Faraos styrka säger han: ”om ock hans furstar äro i Soan”. Hesekiel förutsade att Gud skulle sätta eld på Soan."
    - "En kopia av Kanopusdekretet från prästerna till Ptolemaios III:s ära (238 f.Kr.) hittades i Tanis av Richard Lepsius 1866. Strabon kände Tanis som en stor stad, medan Josefus kallar den en liten stad, där Titus tillbringade en natt på sitt tåg från Alexandria till Jerusalem år 70 e.Kr. På 380-talet, enligt den vanliga dateringen, kom pilgrimen Egeria till Tathnis, vanligen tagen för Tanis, som, skriver hon, en gång hade varit Faraos huvudstad och var staden där Mose föddes."
  nb:
    - "Soan, som egypterne kalte Djanet og grekerne Tanis, ligger ved San el-Hagar i det nordøstlige Nildeltaet, ved den tanittiske grenen av elven, som siden har gjenslammet. Det store Amon-tempelet der ble bygd i stor grad av eldre monumenter, obelisker, statuer og blokker av Ramses II, brakt fra Pi-Ramses, den tidligere hovedstaden omkring 20 km mot sør. Derfor ble Tanis lenge forvekslet med selve Pi-Ramses."
    - "Omkring 1069 f.Kr. grunnla Smendes det 21. dynastiet, og Tanis var kongebyen for det 21. og 22. dynastiet. I Beretningen om Wenamun besøker sendebudet fra Amons tempel i Teben Smendes i Tanis på vei til Byblos. Auguste Mariette og Flinders Petrie gravde her på 1800-tallet, og i 1939–1940 fant Pierre Montet kongegravene innenfor tempelområdet, blant dem de uplyndrede gravleggingene av Psusennes I, Amenemope og Sjosjenk II."
    - "Fjerde Mosebok bemerker at Hebron ble bygd sju år før Soan i Egypt. En salme minner om undrene Gud gjorde i Egypt «på Soans mark». Jesaja håner faraos rådgivere: «Bare dårer er Soans høvdinger»; og når han refser dem som drar ned til Egypt for å søke faraos vern, sier han: «For deres fyrster er kommet til Soan». Esekiel forutsa at Gud ville sette ild på Soan."
    - "En kopi av Kanopos-dekretet fra prestene til ære for Ptolemaios III (238 f.Kr.) ble funnet i Tanis av Richard Lepsius i 1866. Strabon kjente Tanis som en stor by, mens Josefus kaller den en liten by, der Titus tilbrakte en natt på marsjen fra Aleksandria til Jerusalem i 70 e.Kr. I 380-årene, etter vanlig datering, kom pilegrimen Egeria til Tathnis, vanligvis tatt for å være Tanis, som, skriver hun, en gang hadde vært faraos hovedstad og var byen der Moses ble født."
  tl:
    - "Ang Zoan, na tinawag ng mga Ehipsiyo na Djanet at ng mga Griego na Tanis, ay nasa San el-Hagar sa hilagang-silangang delta ng Nilo, sa sangay ng Tanis ng ilog na tinabunan na ng banlik. Ang dakilang templo ni Amun dito ay itinayo higit sa lahat mula sa mas lumang monumento, obelisko, estatwa at bloke ni Ramses II, na dinala mula sa Pi-Ramses, ang naunang kabisera mga 20 km sa timog. Kaya matagal na napagkamalang Pi-Ramses mismo ang Tanis."
    - "Noong mga 1069 BK, itinatag ni Smendes ang Ika-dalawampu't-isang Dinastiya, at ang Tanis ang maharlikang lunsod ng Ika-21 at Ika-22 Dinastiya. Sa Ulat ni Wenamun, dinadalaw ng sugo ng templo ni Amun sa Thebes si Smendes sa Tanis patungong Byblos. Naghukay rito noong ika-19 na siglo sina Auguste Mariette at Flinders Petrie, at noong 1939–1940 natagpuan ni Pierre Montet ang mga maharlikang libingan sa loob ng bakuran ng templo, kabilang ang hindi nanakawang libing nina Psusennes I, Amenemope at Shoshenq II."
    - "Binabanggit ng Bilang na ang Hebron ay natayo pitong taon bago ang Zoan sa Egipto. Inaalala ng isang awit ang mga kababalaghang ginawa ng Diyos sa Egipto “sa parang ng Zoan”. Tinutuya ni Isaias ang mga tagapayo ni Faraon: “Ang mga pangulo sa Zoan ay lubos na mangmang”; sa pagsaway sa mga bumababa sa Egipto upang hanapin ang lakas ni Faraon, sinabi niya: “ang kaniyang mga pangulo ay nangasa Zoan”. Inihula ni Ezekiel na magsisilab ang Diyos ng apoy sa Zoan."
    - "Isang kopya ng dekreto ng Canopus ng mga saserdote bilang parangal kay Ptolemeo III (238 BK) ay natagpuan sa Tanis ni Richard Lepsius noong 1866. Kilala ni Estrabon ang Tanis bilang malaking lunsod, samantalang tinatawag itong maliit na bayan ni Josefo, kung saan nanatili si Tito nang isang gabi sa kaniyang martsa mula Alejandria patungong Jerusalem noong 70 AD. Noong dekada 380, ayon sa karaniwang pagpetsa, dumating ang peregrinong si Egeria sa Tathnis, karaniwang itinuturing na Tanis, na ayon sa kaniya ay dating kabisera ni Faraon at lunsod kung saan ipinanganak si Moises."
