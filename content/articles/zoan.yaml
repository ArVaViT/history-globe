# Overview article (ADR 0007). Mainstream facts only; Egyptian dates follow I. Shaw (ed.), The Oxford History of Ancient Egypt.
# The card is named «Цоан» (Synodal); the title adds the Greek name Tanis, by which the site is usually known.
id: zoan
place: ac31fee
title:
  en: "Zoan (Tanis)"
  ru: "Цоан (Танис)"
  uk: "Цоан (Таніс)"
  es: "Zoán (Tanis)"
  pt: "Zoã (Tânis)"
  de: "Zoan (Tanis)"
  fr: "Tsoan (Tanis)"
body:
  en:
    - "Zoan, called Djanet by the Egyptians and Tanis by the Greeks, lies at San el-Hagar in the north-eastern Nile delta, on the Tanitic branch of the river, which has since silted up. Its great temple of Amun was built largely of older monuments, obelisks, statues and blocks of Ramesses II, brought from Pi-Ramesses, the earlier capital about 30 km to the south. For that reason Tanis was long mistaken for Pi-Ramesses itself."
    - "About 1069 BC Smendes founded the Twenty-first Dynasty, and Tanis was the royal city of the Twenty-first and Twenty-second Dynasties. In the Report of Wenamun the envoy of Amun's temple at Thebes calls on Smendes at Tanis on his way to Byblos. Auguste Mariette and Flinders Petrie dug here in the nineteenth century, and in 1939–1940 Pierre Montet found the royal tombs within the temple enclosure, among them the unplundered burials of Psusennes I, Amenemope and Shoshenq II."
    - 'Numbers notes that Hebron was built seven years before Zoan in Egypt. A psalm recalls the wonders God wrought in Egypt "in the field of Zoan". Isaiah mocks Pharaoh''s counsellors: "the princes of Zoan are fools"; rebuking those who go down to Egypt to seek Pharaoh''s strength, he says: "his princes were at Zoan". Ezekiel foretold that God would set fire in Zoan.'
    - "A copy of the Canopus decree of the priests in honour of Ptolemy III (238 BC) was found at Tanis by Richard Lepsius in 1866. Strabo knew Tanis as a large city, while Josephus calls it a small town, where Titus spent a night on his march from Alexandria to Jerusalem in AD 70. In the 380s, by the usual dating, the pilgrim Egeria came to Tathnis, usually taken to be Tanis, which, she writes, had once been Pharaoh's capital and was the city where Moses was born."
  ru:
    - "Цоан, у египтян Джанет, а у греков Танис, лежит у селения Сан-эль-Хагар на северо-востоке дельты Нила, на Танисском рукаве реки, который с тех пор занесло илом. Его великий храм Амона был построен во многом из более древних памятников — обелисков, статуй и блоков Рамсеса II, привезённых из Пи-Рамсеса, прежней столицы примерно в 30 км к югу. Поэтому Танис долго ошибочно принимали за сам Пи-Рамсес."
    - "Около 1069 г. до н. э. Смендес основал XXI династию, и Танис был царским городом XXI и XXII династий. В «Путешествии Ун-Амона» посланец фиванского храма Амона по пути в Библ заходит в Танис к Смендесу. В XIX веке здесь копали Огюст Мариетт и Флиндерс Питри, а в 1939–1940 гг. Пьер Монте нашёл в ограде храма царские гробницы, среди них неразграбленные погребения Псусеннеса I, Аменемопе и Шешонка II."
    - "Книга Чисел замечает, что Хеврон построен был семью годами прежде Цоана, города Египетского. Псалом вспоминает чудеса, сотворённые Богом в Египте «на поле Цоан». Исаия насмехается над советниками фараона: «обезумели князья Цоанские»; а обличая тех, кто идёт в Египет искать силы фараона, говорит: «князья его уже в Цоане». Иезекииль предрекал, что Бог пошлёт огонь на Цоан."
    - "Копию Канопского декрета жрецов в честь Птолемея III (238 г. до н. э.) нашёл в Танисе Рихард Лепсиус в 1866 г. Страбон знал Танис как большой город, а Иосиф Флавий называет его маленьким городком, где Тит заночевал в 70 г. н. э. по пути из Александрии к Иерусалиму. В 380-х годах, по обычной датировке, паломница Эгерия пришла в Татнис, который обычно считают Танисом; по её словам, некогда это была столица фараона и здесь родился Моисей."
  uk:
    - "Цоан, який єгиптяни називали Джанет, а греки Танісом, лежить у Сан-ель-Хагарі на північному сході дельти Нілу, на танітському рукаві річки, що відтоді замулився. Його великий храм Амона був збудований здебільшого зі старіших пам’яток, обелісків, статуй і блоків Рамсеса II, привезених з Пер-Рамсеса, раніше столиці приблизно за 30 км на південь. Тому Таніс довго помилково вважали самим Пер-Рамсесом."
    - "Близько 1069 р. до н. е. Смендес заснував XXI династію, і Таніс був царським містом XXI і XXII династій. У «Звіті Венамона» посланець храму Амона у Фівах відвідує Смендеса в Танісі на шляху до Бібла. Огюст Марієтт і Фліндерс Петрі копали тут у XIX столітті, а в 1939–1940 роках П’єр Монте знайшов царські гробниці в межах огорожі храму, серед них неограбовані поховання Псусеннеса I, Аменемопета і Шешонка II."
    - "Книга Чисел зазначає, що «Геброн же збудовано за сїм років перед Зоаном в Египтї». Псалом пригадує чудеса, які Бог учинив у Єгипті «на полї Зоан». Ісая глузує з радників фараона: «втеряла розум старшина Зоанська»; докоряючи тим, хто сходить до Єгипту шукати сили фараона, він каже: «Князї твої прийдуть у Зоан-город». Єзекіїль передрік, що Бог «пущу пожаром Зоан»."
    - "Копію Канопського декрету жерців на честь Птолемея III (238 р. до н. е.) знайшов у Танісі Ріхард Лепсіус 1866 року. Страбон знав Таніс як велике місто, тоді як Йосиф Флавій називає його малим містечком, де Тит провів ніч під час походу з Александрії до Єрусалима 70 року н. е. У 380-х роках за звичайним датуванням прочанка Егерія прийшла до Татніса, який зазвичай беруть за Таніс і який, пише вона, колись був столицею фараона і містом, де народився Мойсей."
  es:
    - "Zoán, llamada Djanet por los egipcios y Tanis por los griegos, se encuentra en San el-Hagar, en el noreste del delta del Nilo, en el brazo tanítico del río, que desde entonces se ha cegado. Su gran templo de Amón se construyó en buena parte con monumentos más antiguos, obeliscos, estatuas y bloques de Ramsés II, traídos de Pi-Ramsés, la capital anterior, a unos 30 km al sur. Por eso Tanis se confundió durante mucho tiempo con la propia Pi-Ramsés."
    - "Hacia 1069 a. C. Esmendes fundó la dinastía XXI, y Tanis fue la ciudad real de las dinastías XXI y XXII. En el Relato de Unamón, el enviado del templo de Amón en Tebas visita a Esmendes en Tanis de camino a Biblos. Auguste Mariette y Flinders Petrie excavaron aquí en el siglo XIX, y en 1939–1940 Pierre Montet halló las tumbas reales dentro del recinto del templo, entre ellas los enterramientos sin saquear de Psusennes I, Amenemope y Sheshonq II."
    - "Números anota que Hebrón fue edificada siete años antes que Zoán, en Egipto. Un salmo recuerda las maravillas que Dios hizo en Egipto «en el campo de Zoán». Isaías se burla de los consejeros del faraón: «son necios los príncipes de Zoán»; al reprender a los que descienden a Egipto a buscar la fuerza del faraón, dice: «Cuando estarán sus príncipes en Zoán». Ezequiel anunció que Dios pondría fuego en Zoán."
    - "Una copia del decreto de Canopo de los sacerdotes en honor de Ptolomeo III (238 a. C.) fue hallada en Tanis por Richard Lepsius en 1866. Estrabón conocía Tanis como una gran ciudad, mientras que Josefo la llama una pequeña población, donde Tito pasó una noche en su marcha de Alejandría a Jerusalén en el 70 d. C. En los años 380, según la datación habitual, la peregrina Egeria llegó a Tathnis, que suele tomarse por Tanis, la cual, escribe, había sido una vez la capital del faraón y era la ciudad donde nació Moisés."
  pt:
    - "Zoã, chamada Djanet pelos egípcios e Tânis pelos gregos, fica em San el-Hagar, no nordeste do delta do Nilo, no braço tanítico do rio, que desde então assoreou. Seu grande templo de Amom foi construído em grande parte com monumentos mais antigos, obeliscos, estátuas e blocos de Ramsés II, trazidos de Pi-Ramsés, a capital anterior, uns 30 km ao sul. Por isso Tânis foi por muito tempo tomada pela própria Pi-Ramsés."
    - "Por volta de 1069 a.C., Esmendes fundou a XXI Dinastia, e Tânis foi a cidade real da XXI e da XXII Dinastias. No Relato de Wenamun, o enviado do templo de Amom em Tebas visita Esmendes em Tânis a caminho de Biblos. Auguste Mariette e Flinders Petrie escavaram aqui no século XIX, e em 1939–1940 Pierre Montet encontrou as tumbas reais dentro do recinto do templo, entre elas os sepultamentos não saqueados de Psusenes I, Amenemope e Sheshonq II."
    - "Números nota que Hebrom foi edificada sete anos antes de Zoã, no Egito. Um salmo recorda as maravilhas que Deus fez no Egito “no campo de Zoã”. Isaías zomba dos conselheiros do Faraó: “Os príncipes de Zoã são totalmente tolos”; repreendendo os que descem ao Egito para buscar a força do Faraó, diz: “Pois os seus príncipes estão em Zoã”. Ezequiel predisse que Deus poria fogo em Zoã."
    - "Uma cópia do decreto de Canopo dos sacerdotes em honra de Ptolomeu III (238 a.C.) foi achada em Tânis por Richard Lepsius em 1866. Estrabão conhecia Tânis como uma grande cidade, enquanto Josefo a chama de pequena cidade, onde Tito passou uma noite em sua marcha de Alexandria a Jerusalém em 70 d.C. Na década de 380, pela datação usual, a peregrina Egéria chegou a Tathnis, geralmente tomada por Tânis, que, escreve ela, fora a capital do Faraó e era a cidade onde Moisés nasceu."
  de:
    - "Zoan, bei den Ägyptern Djanet, bei den Griechen Tanis genannt, liegt bei San el-Hagar im nordöstlichen Nildelta am tanitischen Nilarm, der inzwischen verlandet ist. Sein großer Amun-Tempel wurde größtenteils aus älteren Denkmälern gebaut, Obelisken, Statuen und Blöcken Ramses' II., aus Pi-Ramesse, der früheren Hauptstadt etwa 30 km südlich. Deshalb hielt man Tanis lange für Pi-Ramesse selbst."
    - "Um 1069 v. Chr. begründete Smendes die 21. Dynastie, und Tanis war die Residenzstadt der 21. und 22. Dynastie. Im Bericht des Wenamun besucht der Gesandte des Amun-Tempels von Theben Smendes in Tanis auf dem Weg nach Byblos. Auguste Mariette und Flinders Petrie gruben hier im neunzehnten Jahrhundert, und 1939–1940 fand Pierre Montet innerhalb des Tempelbezirks die Königsgräber, darunter die unausgeraubten Bestattungen von Psusennes I., Amenemope und Scheschonq II."
    - "Das Buch Numeri vermerkt, dass Hebron sieben Jahre vor Zoan in Ägypten gebaut wurde. Ein Psalm erinnert an die Wunder, die Gott in Ägypten „im Felde Zoan“ tat. Jesaja verspottet die Berater des Pharao: „Die Fürsten zu Zoan sind Toren“; wer nach Ägypten hinabzieht, um die Stärke des Pharao zu suchen, den tadelt er: „Ihre Fürsten sind wohl zu Zoan gewesen“. Hesekiel sagte voraus, Gott werde in Zoan ein Feuer anzünden."
    - "Eine Abschrift des Dekrets von Kanopus der Priester zu Ehren Ptolemaios' III. (238 v. Chr.) fand Richard Lepsius 1866 in Tanis. Strabon kannte Tanis als große Stadt, während Josephus es eine kleine Stadt nennt, wo Titus auf seinem Marsch von Alexandria nach Jerusalem im Jahr 70 n. Chr. eine Nacht verbrachte. In den 380er Jahren, nach der üblichen Datierung, kam die Pilgerin Egeria nach Tathnis, meist für Tanis gehalten, das, wie sie schreibt, einst die Hauptstadt des Pharao gewesen und die Stadt war, in der Mose geboren wurde."
  fr:
    - "Tsoan, appelée Djanet par les Égyptiens et Tanis par les Grecs, se trouve à San el-Hagar, dans le nord-est du delta du Nil, sur la branche tanitique du fleuve, aujourd’hui ensablée. Son grand temple d’Amon fut bâti en grande partie avec des monuments plus anciens, obélisques, statues et blocs de Ramsès II, apportés de Pi-Ramsès, la capitale antérieure à environ 30 km au sud. Pour cette raison, Tanis fut longtemps prise pour Pi-Ramsès elle-même."
    - "Vers 1069 av. J.-C., Smendès fonda la XXIe dynastie, et Tanis fut la ville royale des XXIe et XXIIe dynasties. Dans le Rapport d’Ounamon, l’envoyé du temple d’Amon à Thèbes rend visite à Smendès à Tanis en route vers Byblos. Auguste Mariette et Flinders Petrie y fouillèrent au XIXe siècle, et en 1939-1940 Pierre Montet trouva dans l’enceinte du temple les tombes royales, dont les sépultures intactes de Psousennès Ier, d’Amenemopé et de Sheshonq II."
    - "Les Nombres notent qu’Hébron fut bâtie sept ans avant Tsoan en Égypte. Un psaume rappelle les prodiges de Dieu en Égypte « dans les campagnes de Tsoan ». Ésaïe se moque des conseillers de Pharaon : « Les princes de Tsoan ne sont que des insensés » ; reprochant à ceux qui descendent en Égypte chercher la force de Pharaon, il dit : « Déjà ses princes sont à Tsoan ». Ézéchiel annonça que Dieu mettrait le feu à Tsoan."
    - "Une copie du décret de Canope des prêtres en l’honneur de Ptolémée III (238 av. J.-C.) fut trouvée à Tanis par Richard Lepsius en 1866. Strabon connaissait Tanis comme une grande ville, tandis que Josèphe l’appelle une petite bourgade, où Titus passa une nuit lors de sa marche d’Alexandrie à Jérusalem en 70 apr. J.-C. Dans les années 380, selon la datation usuelle, la pèlerine Égérie vint à Tathnis, d’ordinaire prise pour Tanis, qui, écrit-elle, avait été la capitale de Pharaon et la ville où Moïse était né."
