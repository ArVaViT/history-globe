# Overview article (ADR 0007). Mainstream facts only; Egyptian dates follow I. Shaw (ed.), The Oxford History of Ancient Egypt.
# The card is named «Цоан» (Synodal); the title adds the Greek name Tanis, by which the site is usually known.
id: zoan
place: ac31fee
title:
  en: "Zoan (Tanis)"
  ru: "Цоан (Танис)"
  uk: "Цоан (Таніс)"
  es: "Zoán (Tanis)"
  pt: "Zoã (Tânis)"
  de: "Zoan (Tanis)"
  fr: "Tsoan (Tanis)"
  pl: "Soan (Tanis)"
  it: "Soan (Tanis)"
  nl: "Zoan (Tanis)"
  cs: "Coan (Tanis)"
  sv: "Soan (Tanis)"
