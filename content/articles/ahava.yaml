body:
  en:
    - "Ahava is the river, or canal, in Babylonia on whose bank Ezra gathered the company that went up with him to Jerusalem in the seventh year of Artaxerxes: 458 BC if the king is Artaxerxes I, as most hold, or 398 BC under Artaxerxes II. Ezra writes of “the river that runneth to Ahava” and then of “the river of Ahava”, so Ahava was also a place, perhaps a town or a canal head. Nothing else names it. First Esdras calls the river Theras, and Josephus says only that the people gathered beyond the Euphrates. Babylonia was a land of canals, and Ahava was presumably one of them, not far from Babylon itself; the map marks a wide circle around the city and several guesses, among them Hit on the Euphrates (the ancient Is, with its bitumen springs), Opis on the Tigris and Tell Ishnayt, none of them with support in the sources."
    - "“And I gathered them together to the river that runneth to Ahava; and there abode we in tents three days: and I viewed the people, and the priests, and found there none of the sons of Levi.” Ezra sent to Iddo at Casiphia for Levites and temple servants, and 38 Levites and 220 Nethinim came. “Then I proclaimed a fast there, at the river of Ahava, that we might afflict ourselves before our God, to seek of him a right way”, for he was ashamed to ask the king for an escort after telling him that God's hand is on all who seek him."
    - "He weighed out the silver, gold and vessels to twelve priests, and “we departed from the river of Ahava on the twelfth day of the first month, to go unto Jerusalem: and the hand of our God was upon us”. They reached Jerusalem on the first day of the fifth month, four months after setting out from Babylon. The canals of central Iraq, which have shifted their beds many times since, keep no name like Ahava, and the place is simply lost."
  ru:
    - "Агава — река, или канал, в Вавилонии, на берегу которой Ездра собрал спутников, шедших с ним в Иерусалим в седьмой год Артаксеркса: в 458 г. до н. э., если это Артаксеркс I, как считает большинство, или в 398 г. до н. э. при Артаксерксе II. Ездра пишет о реке, «втекающей в Агаву», а затем просто о реке Агаве, так что Агава была и местом — быть может, городком или истоком канала. Больше её никто не называет. Греческая Вторая книга Ездры зовёт реку Фера, а Иосиф Флавий говорит лишь, что народ собрался за Евфратом. Вавилония была страной каналов, и Агава, надо думать, была одним из них, недалеко от самого Вавилона; на карте отмечены широкий круг вокруг города и несколько догадок, среди них Хит на Евфрате (древний Ис с его битумными источниками), Опис на Тигре и Телль-Ишнейт, — ни одна из которых не имеет опоры в источниках."
    - "«Я собрал их у реки, втекающей в Агаву, и мы простояли там три дня, и когда я осмотрел народ и священников, то из сынов Левия никого там не нашел». Ездра послал к Иддо в Касифью за левитами и служителями храма, и пришли 38 левитов и 220 нефинеев. «И провозгласил я там пост у реки Агавы, чтобы смириться нам пред лицем Бога нашего, просить у Него благополучного пути», ибо ему стыдно было просить у царя охраны после того, как он сказал царю, что рука Божия на всех прибегающих к Нему."
    - "Он отвесил серебро, золото и сосуды двенадцати священникам, и «отправились мы от реки Агавы в двенадцатый день первого месяца, чтобы идти в Иерусалим; и рука Бога нашего была над нами». В Иерусалим они пришли в первый день пятого месяца, через четыре месяца после выхода из Вавилона. Каналы центрального Ирака, с тех пор много раз менявшие русла, не хранят имени, похожего на Агаву, и место попросту утрачено."
  uk:
    - "Агава — річка, або канал, у Вавилонії, на березі якої Ездра зібрав гурт, що пішов з ним до Єрусалима сьомого року Артаксеркса: 458 р. до н. е., якщо цар — Артаксеркс I, як вважає більшість, або 398 р. до н. е. за Артаксеркса II. Ездра пише про «ріку, що вливається в Агаву», а потім про «ріку Агави», тож Агава була й місцем, можливо, містом або початком каналу. Ніщо інше її не називає. Перша (грецька) книга Ездри називає річку Терас, а Йосиф Флавій каже лише, що народ зібрався за Євфратом. Вавилонія була краєм каналів, і Агава, ймовірно, була одним із них, неподалік від самого Вавилона; мапа позначає широке коло навколо міста і кілька здогадів, серед них Гіт на Євфраті (давній Іс із бітумними джерелами), Опіс на Тигрі та Телль-Ішнайт, — жоден з яких не має підтримки в джерелах."
    - "«Я зібрав їх коло ріки, що вливається в Агаву, й там простояли ми три днї, а як я переглянув народ та сьвященників, то з синів Левії не знайшов там нїкого.» Ездра послав до Іддо в Касифію по левітів і храмових служителів, і прийшли 38 левітів і 220 нетинеїв. «І оповістив там піст коло ріки Агави, щоб нам впокоритись перед лицем Бога нашого, та просити в його щасливої дороги», бо йому було соромно просити в царя охорони після того, як він сказав йому, що рука Божа над усіма, хто шукає його."
    - "Він відважив срібло, золото й посуд дванадцятьом священникам, і «рушили ми від ріки Агави дванайцятого дня першого місяця, щоб ійти в Ерусалим, а рука Бога нашого була над нами». До Єрусалима вони дійшли першого дня п'ятого місяця, через чотири місяці після виходу з Вавилона. Канали центрального Іраку, які відтоді багато разів змінювали русла, не зберігають жодної назви на кшталт Агави, і місце просто втрачено."
  es:
    - "Ahava es el río, o canal, de Babilonia a cuya orilla Esdras reunió a la compañía que subió con él a Jerusalén en el año séptimo de Artajerjes: 458 a. C. si el rey es Artajerjes I, como sostiene la mayoría, o 398 a. C. bajo Artajerjes II. Esdras escribe sobre el «río que viene á Ahava» y luego sobre «el río de Ahava», de modo que Ahava era también un lugar, quizá una ciudad o la cabecera de un canal. Nada más la nombra. El primer libro de Esdras llama al río Teras, y Josefo dice solo que el pueblo se reunió al otro lado del Éufrates. Babilonia era una tierra de canales, y Ahava era presumiblemente uno de ellos, no lejos de la propia Babilonia; el mapa señala un amplio círculo en torno a la ciudad y varias conjeturas, entre ellas Hit, en el Éufrates (la antigua Is, con sus manantiales de betún), Opis, en el Tigris, y Tell Ishnayt, ninguna con respaldo en las fuentes."
    - "«Y juntélos junto al río que viene á Ahava, y reposamos allí tres días: y habiendo buscado entre el pueblo y entre los sacerdotes, no hallé allí de los hijos de Leví.» Esdras envió a Iddo, en Casifia, en busca de levitas y servidores del templo, y llegaron 38 levitas y 220 netineos. «Y publiqué ayuno allí junto al río de Ahava, para afligirnos delante de nuestro Dios, para solicitar de él camino derecho», pues le daba vergüenza pedir al rey una escolta después de haberle dicho que la mano de Dios es para bien sobre todos los que le buscan."
    - "Pesó la plata, el oro y los utensilios a doce sacerdotes, y «partimos del río de Ahava el doce del mes primero, para ir á Jerusalem: y la mano de nuestro Dios fué sobre nosotros». Llegaron a Jerusalén el primer día del mes quinto, cuatro meses después de partir de Babilonia. Los canales del centro de Irak, que han cambiado de cauce muchas veces desde entonces, no conservan ningún nombre como Ahava, y el lugar está simplemente perdido."
  pt:
    - "Aava é o rio, ou canal, da Babilônia à margem do qual Esdras reuniu o grupo que subiu com ele a Jerusalém no sétimo ano de Artaxerxes: 458 a.C. se o rei é Artaxerxes I, como a maioria sustenta, ou 398 a.C. sob Artaxerxes II. Esdras escreve do “rio que corre para Aava” e depois do “rio Aava”, de modo que Aava era também um lugar, talvez uma cidade ou a cabeceira de um canal. Nada mais a nomeia. Primeiro Esdras chama o rio Teras, e Josefo diz apenas que o povo se reuniu além do Eufrates. A Babilônia era uma terra de canais, e Aava foi presumivelmente um deles, não longe da própria Babilônia; o mapa marca um amplo círculo em torno da cidade e várias conjeturas, entre elas Hit no Eufrates (a antiga Is, com as suas fontes de betume), Ópis no Tigre e Tell Ishnayt, nenhuma com apoio nas fontes."
    - "“Eu os reuni junto ao rio que corre para Aava; e ali acampamos por três dias. Então observei o povo e os sacerdotes, e não encontrei ali nenhum dos filhos de Levi.” Esdras mandou buscar levitas e servos do templo a Ido, em Casifia, e vieram 38 levitas e 220 servos do templo. “Então proclamei um jejum ali junto ao rio Aava, para que pudéssemos nos humilhar perante o nosso Deus, para buscar dele um caminho seguro”, pois teve vergonha de pedir ao rei uma escolta depois de lhe dizer que a mão de Deus está sobre todos os que o buscam."
    - "Pesou a prata, o ouro e os utensílios para doze sacerdotes, e “partimos do rio Aava no décimo segundo dia do primeiro mês, para ir a Jerusalém. A mão do nosso Deus estava sobre nós”. Chegaram a Jerusalém no primeiro dia do quinto mês, quatro meses depois de partirem da Babilônia. Os canais do Iraque central, que mudaram de leito muitas vezes desde então, não guardam nome como Aava, e o lugar está simplesmente perdido."
  de:
    - "Ahawa ist der Fluss oder Kanal in Babylonien, an dessen Ufer Esra die Schar versammelte, die mit ihm im siebten Jahr des Artaxerxes nach Jerusalem hinaufzog: 458 v. Chr., wenn der König Artaxerxes I. ist, wie die meisten annehmen, oder 398 v. Chr. unter Artaxerxes II. Esra schreibt vom „Wasser, das gen Ahava kommt“ und dann vom „Wasser bei Ahava“, so war Ahawa auch ein Ort, vielleicht eine Stadt oder ein Kanalanfang. Nichts sonst nennt es. Das Erste Buch Esdras nennt den Fluss Theras, und Josephus sagt nur, das Volk habe sich jenseits des Euphrat versammelt. Babylonien war ein Land der Kanäle, und Ahawa war vermutlich einer davon, nicht weit von Babylon selbst; die Karte zeichnet einen weiten Kreis um die Stadt und mehrere Vermutungen ein, darunter Hit am Euphrat (das antike Is mit seinen Asphaltquellen), Opis am Tigris und Tell Ishnayt, keine davon mit Rückhalt in den Quellen."
    - "„Und ich versammelte sie ans Wasser, das gen Ahava kommt; und wir bleiben drei Tage daselbst. Und da ich achthatte aufs Volk und die Priester, fand ich keine Leviten daselbst.“ Esra sandte zu Iddo nach Kasifja um Leviten und Tempeldiener, und 38 Leviten und 220 Tempeldiener kamen. „Und ich ließ daselbst am Wasser bei Ahava ein Fasten ausrufen, daß wir uns demütigten vor unserm Gott, zu suchen von ihm einen richtigen Weg“, denn er schämte sich, den König um Geleit zu bitten, nachdem er ihm gesagt hatte, Gottes Hand sei über allen, die ihn suchen."
    - "Er wog zwölf Priestern das Silber, das Gold und die Geräte zu, und „wir brachen auf von dem Wasser Ahava am zwölften Tage des ersten Monats, daß wir gen Jerusalem zögen. Und die Hand unsres Gottes war über uns“. Am ersten Tag des fünften Monats erreichten sie Jerusalem, vier Monate nach dem Aufbruch aus Babylon. Die Kanäle des mittleren Irak, die ihr Bett seither viele Male verlegt haben, bewahren keinen Namen wie Ahawa, und der Ort ist schlicht verloren."
  fr:
    - "Ahava est le fleuve, ou canal, de Babylonie sur la rive duquel Esdras rassembla la troupe qui monta avec lui à Jérusalem la septième année d’Artaxerxès : 458 av. J.-C. si le roi est Artaxerxès Ier, comme la plupart le pensent, ou 398 av. J.-C. sous Artaxerxès II. Esdras parle du « fleuve qui coule vers Ahava », puis du « fleuve d’Ahava » ; Ahava était donc aussi un lieu, peut-être une ville ou une tête de canal. Rien d’autre ne le nomme. 1 Esdras appelle le fleuve Théras, et Josèphe dit seulement que le peuple se rassembla au-delà de l’Euphrate. La Babylonie était un pays de canaux, et Ahava en était sans doute un, non loin de Babylone même ; la carte trace un large cercle autour de la ville et plusieurs hypothèses, parmi lesquelles Hit sur l’Euphrate (l’antique Is aux sources de bitume), Opis sur le Tigre et Tell Ishnayt, aucune appuyée par les sources."
    - "« Je les rassemblai près du fleuve qui coule vers Ahava, et nous campâmes là trois jours. Je dirigeai mon attention sur le peuple et sur les sacrificateurs, et je ne trouvai là aucun des fils de Lévi. » Esdras envoya vers Iddo, à Casiphia, chercher des lévites et des serviteurs du Temple, et 38 lévites et 220 Néthiniens vinrent. « Là, près du fleuve d’Ahava, je publiai un jeûne d’humiliation devant notre Dieu, afin d’implorer de lui un heureux voyage », car il aurait eu honte de demander une escorte au roi après lui avoir dit que la main de Dieu est sur tous ceux qui le cherchent."
    - "Il pesa l’argent, l’or et les objets à douze prêtres, et « nous partîmes du fleuve d’Ahava pour nous rendre à Jérusalem, le douzième jour du premier mois. La main de notre Dieu fut sur nous ». Ils arrivèrent à Jérusalem le premier jour du cinquième mois, quatre mois après leur départ de Babylone. Les canaux du centre de l’Irak, dont le lit a bien des fois changé depuis, ne gardent aucun nom comme Ahava, et le lieu est simplement perdu."
  it:
    - "Aava è il fiume, o canale, in Babilonia sulla cui riva Esdra radunò la comunità che salì con lui a Gerusalemme nel settimo anno di Artaserse: il 458 a.C. se il re è Artaserse I, come i più ritengono, oppure il 398 a.C. sotto Artaserse II. Esdra scrive «il fiume che scorre verso Ahava» e poi «il fiume d’Ahava», così Aava era anche un luogo, forse una città o la testata di un canale. Nient’altro la nomina. Il Primo libro di Esdra chiama il fiume Theras, e Flavio Giuseppe dice soltanto che il popolo si radunò al di là dell’Eufrate. La Babilonia era una terra di canali, e Aava era presumibilmente uno di essi, non lontano da Babilonia stessa; la carta segna un ampio cerchio intorno alla città e diverse ipotesi, tra cui Hit sull’Eufrate (l’antica Is con le sue sorgenti di bitume), Opis sul Tigri e Tell Ishnayt, nessuna con sostegno nelle fonti."
    - "«Io li radunai presso al fiume che scorre verso Ahava, e quivi stemmo accampati tre giorni; e, avendo fatta la rassegna del popolo e dei sacerdoti, non trovai tra loro alcun figliuolo di Levi». Esdra mandò da Iddo a Casifia a cercare leviti e servi del tempio, e vennero 38 leviti e 220 netinei. «E colà, presso il fiume Ahava, io bandii un digiuno per umiliarci nel cospetto del nostro Dio, per chiedergli un buon viaggio», poiché si vergognava di chiedere al re una scorta dopo avergli detto che la mano di Dio assiste tutti quelli che lo cercano."
    - "Pesò l’argento, l’oro e gli arredi e li consegnò a dodici sacerdoti, e «noi ci partimmo dal fiume d’Ahava il dodicesimo giorno del primo mese per andare a Gerusalemme; e la mano di Dio fu su noi». Giunsero a Gerusalemme il primo giorno del quinto mese, quattro mesi dopo la partenza da Babilonia. I canali dell’Iraq centrale, che da allora hanno cambiato molte volte il loro letto, non conservano alcun nome come Aava, e il luogo è semplicemente perduto."
  pl:
    - "Ahawa to rzeka lub kanał w Babilonii, nad którego brzegiem Ezdrasz zgromadził grupę wyruszającą z nim do Jerozolimy w siódmym roku Artakserksesa: w 458 r. p.n.e., jeśli królem jest Artakserkses I, jak sądzi większość, albo w 398 r. p.n.e. za Artakserksesa II. Ezdrasz pisze o „rzece, która wpada do Achawy”, a potem o „rzece Achawy”, więc Ahawa była też miejscem, może miastem lub początkiem kanału. Nic poza tym jej nie nazywa. Apokryficzna Pierwsza Księga Ezdrasza (1 Ezdr) zowie rzekę Theras, a Józef Flawiusz mówi tylko, że lud zebrał się za Eufratem. Babilonia była krajem kanałów, a Ahawa była zapewne jednym z nich, niedaleko samego Babilonu; mapa zaznacza szeroki krąg wokół miasta i kilka domysłów, wśród nich Hit nad Eufratem (dawne Is ze źródłami bitumu), Opis nad Tygrysem i Tell Ishnayt, żaden nie ma poparcia w źródłach."
    - "„A tak zgromadziłem ich do rzeki, która wpada do Achawy, i leżeliśmy tam obozem przez trzy dni: potem przeglądałem lud i kapłanów, a z synów Lewiego nie znalazłem tam żadnego.” Ezdrasz posłał do Iddo w Kasifii po lewitów i sług świątynnych i przyszło 38 lewitów i 220 Netynejczyków. „Tedym tam zapowiedział post u rzeki Achawy, abyśmy się dręczyli przed Bogiem naszym, a szukali od niego drogi prostej”, bo wstydził się prosić króla o eskortę po tym, jak powiedział mu, że ręka Boga jest nad wszystkimi, którzy go szukają."
    - "Odważył srebro, złoto i naczynia dwunastu kapłanom, a „ruszyliśmy się od rzeki Achawy dwunastego dnia, miesiąca pierwszego, abyśmy szli do Jeruzalemu; a ręka Boga naszego była nad nami”. Dotarli do Jerozolimy pierwszego dnia piątego miesiąca, cztery miesiące po wyruszeniu z Babilonu. Kanały środkowego Iraku, które od tamtego czasu wiele razy zmieniły koryta, nie zachowały żadnej nazwy podobnej do Ahawa, a miejsce jest po prostu zagubione."
  nl:
    - "Ahava is de rivier, of het kanaal, in Babylonië aan welks oever Ezra het gezelschap verzamelde dat met hem naar Jeruzalem optrok in het zevende jaar van Artaxerxes: 458 v.Chr. als de koning Artaxerxes I is, zoals de meesten menen, of 398 v.Chr. onder Artaxerxes II. Ezra schrijft over “de rivier, gaande naar Ahava” en daarna over “de rivier Ahava”, dus Ahava was ook een plaats, misschien een stad of het begin van een kanaal. Niets anders noemt haar. Eerste Esdras noemt de rivier Theras, en Josephus zegt slechts dat het volk zich voorbij de Eufraat verzamelde. Babylonië was een land van kanalen, en Ahava was vermoedelijk een daarvan, niet ver van Babylon zelf; de kaart tekent een wijde cirkel rond de stad en verscheidene gissingen, waaronder Hit aan de Eufraat (het oude Is met zijn bitumenbronnen), Opis aan de Tigris en Tell Ishnayt, geen ervan gesteund door de bronnen."
    - "“En ik vergaderde hen aan de rivier, gaande naar Ahava, en wij legerden ons aldaar drie dagen; toen lette ik op het volk en de priesteren, en vond aldaar geen van de kinderen van Levi.” Ezra zond naar Iddo te Kasifia om Levieten en tempeldienaars, en 38 Levieten en 220 Nethinim kwamen. “Toen riep ik aldaar een vasten uit aan de rivier Ahava, opdat wij ons verootmoedigden voor het aangezicht onzes Gods, om van Hem te verzoeken een rechten weg”, want hij schaamde zich de koning een geleide te vragen, nadat hij hem had gezegd dat Gods hand over allen is die Hem zoeken."
    - "Hij woog het zilver, het goud en de vaten uit aan twaalf priesters, en “alzo verreisden wij van de rivier Ahava, op den twaalfden der eerste maand, om te gaan naar Jeruzalem; en de hand onzes Gods was over ons”. Zij bereikten Jeruzalem op de eerste dag van de vijfde maand, vier maanden na het vertrek uit Babylon. De kanalen van Midden-Irak, die sindsdien vele malen van bedding zijn veranderd, bewaren geen naam als Ahava, en de plaats is eenvoudig verloren."
  cs:
    - "Ahava je řeka, nebo kanál, v Babylonii, na jejímž břehu Ezdráš shromáždil družinu, která s ním šla do Jeruzaléma v sedmém roce Artaxerxově: v roce 458 př. n. l., je-li králem Artaxerxes I., jak soudí většina, nebo v roce 398 př. n. l. za Artaxerxa II. Ezdráš píše o „potoku, kterýž vpadá do Ahavy“ a potom o „řece Ahava“, takže Ahava byla také místem, snad městem nebo počátkem kanálu. Nic jiného ji nejmenuje. První Ezdráš nazývá řeku Theras a Josephus Flavius říká jen, že se lid shromáždil za Eufratem. Babylonie byla zemí kanálů a Ahava byla zřejmě jedním z nich, nedaleko samotného Babylóna; mapa vyznačuje široký kruh kolem města a několik dohadů, mezi nimi Hit na Eufratu (starověké Is s jeho asfaltovými prameny), Opis na Tigridu a Tell Ishnayt, z nichž žádný nemá oporu v pramenech."
    - "„Shromáždil jsem je pak u potoku, kterýž vpadá do Ahavy, a leželi jsme tu tři dni. Potom přehlédal jsem lid a kněží, a z synů Léví nenašel jsem tu žádného.“ Ezdráš poslal k Idovi do Kasifje pro levity a chrámové služebníky a přišlo 38 levitů a 220 Netinejských. „Tedy vyhlásil jsem tu půst u řeky Ahava, abychom se ponižovali před Bohem svým, a hledali od něho cesty přímé“, neboť se styděl žádat krále o doprovod, když mu řekl, že ruka Boží je nade všemi, kdo ho hledají."
    - "Odvážil stříbro, zlato a nádoby dvanácti kněžím a „hnuli jsme se od řeky Ahava, dvanáctého dne měsíce prvního, abychom se brali do Jeruzaléma, a ruka Boha našeho byla s námi“. Do Jeruzaléma dorazili prvního dne pátého měsíce, čtyři měsíce po odchodu z Babylóna. Kanály středního Iráku, které od té doby mnohokrát změnily svá koryta, neuchovávají žádné jméno podobné Ahavě a místo je prostě ztraceno."
  sv:
    - "Ahava är floden, eller kanalen, i Babylonien på vars strand Esra samlade den skara som drog upp med honom till Jerusalem i Artaxerxes’ sjunde år: 458 f.Kr. om kungen är Artaxerxes I, som de flesta anser, eller 398 f.Kr. under Artaxerxes II. Esra skriver om ”den ström som flyter till Ahava” och sedan om ”Ahavaströmmen”, så Ahava var också en plats, kanske en stad eller en kanalmynning. Ingenting annat nämner den. Första Esdrasboken kallar floden Theras, och Josefus säger bara att folket samlades på andra sidan Eufrat. Babylonien var ett kanalernas land, och Ahava var förmodligen en av dem, inte långt från själva Babylon; kartan markerar en vid cirkel kring staden och flera gissningar, bland dem Hit vid Eufrat (det antika Is, med sina bitumenkällor), Opis vid Tigris och Tell Ishnayt, ingen av dem med stöd i källorna."
    - "”Och jag församlade dessa till den ström som flyter till Ahava, och vi voro lägrade där i tre dagar. Men när jag närmare gav akt på folket och prästerna, fann jag där ingen av Levi barn.” Esra sände till Iddo i Kasifja efter leviter och tempelträlar, och 38 leviter och 220 tempelträlar kom. ”Och jag lät där, vid Ahavaströmmen, lysa ut en fasta, för att vi skulle ödmjuka oss inför vår Gud, till att av honom utbedja oss en lyckosam resa”, ty han skämdes för att be kungen om eskort sedan han hade sagt honom att Guds hand är över alla som söker honom."
    - "Han vägde upp silvret, guldet och kärlen åt tolv präster, och ”vi bröto upp från Ahavaströmmen på tolfte dagen i första månaden för att draga till Jerusalem; och vår Guds hand var över oss”. De nådde Jerusalem på första dagen i femte månaden, fyra månader efter uppbrottet från Babylon. Kanalerna i centrala Irak, som sedan dess har flyttat sina bäddar många gånger, bär inget namn som Ahava, och platsen är helt enkelt förlorad."
  nb:
    - "Ahava er elven, eller kanalen, i Babylonia der Esra samlet følget som dro med ham opp til Jerusalem i Artaxerxes' sjuende år: 458 f.Kr. hvis kongen er Artaxerxes I, som de fleste mener, eller 398 f.Kr. under Artaxerxes II. Esra skriver om «den elv som løper ut i Ahava» og så om «Ahavaelven», så Ahava var også et sted, kanskje en by eller en kanalmunning. Ingenting annet nevner den. Første Esdrasbok kaller elven Theras, og Josefus sier bare at folket samlet seg hinsides Eufrat. Babylonia var et kanalland, og Ahava var antakelig en av kanalene, ikke langt fra selve Babylon; kartet markerer en bred sirkel rundt byen og flere gjetninger, blant dem Hit ved Eufrat (det gamle Is, med sine bitumenkilder), Opis ved Tigris og Tell Ishnayt, ingen av dem med støtte i kildene."
    - "«Jeg samlet dem ved den elv som løper ut i Ahava; der lå vi i leir tre dager. Men da jeg gav nøiere akt på folket og på prestene, fant jeg ingen av Levis barn der.» Esra sendte bud til Iddo i Kasifja etter levitter og tempeltjenere, og 38 levitter og 220 tempeltjenere kom. «Så lot jeg der, ved Ahavaelven, utrope en faste, forat vi skulde ydmyke oss for vår Guds åsyn og bede ham om en lykkelig reise», for han undså seg for å be kongen om eskorte etter å ha sagt til ham at Gud holder sin hånd over alle dem som søker ham."
    - "Han veide opp sølvet, gullet og karene til tolv prester, og «vi brøt op fra Ahava-elven på den tolvte dag i den første måned for å dra til Jerusalem, og vår Gud holdt sin hånd over oss». De kom til Jerusalem den første dagen i den femte måneden, fire måneder etter at de dro fra Babylon. Kanalene i det sentrale Irak, som har flyttet løpene sine mange ganger siden, har ikke noe navn som Ahava, og stedet er rett og slett tapt."
  tl:
    - "Ang Ahava ay ang ilog, o kanal, sa Babilonia na sa pampang nito pinisan ni Ezra ang pangkat na umahon kasama niya sa Jerusalem noong ikapitong taon ni Artajerjes: 458 BK kung ang hari ay si Artajerjes I, ayon sa karamihan, o 398 BK sa ilalim ni Artajerjes II. Isinulat ni Ezra ang “ilog na umaagos patungo sa Ahava” at pagkatapos ay “ilog ng Ahava”, kaya lugar din ang Ahava, marahil bayan o dulo ng kanal. Walang ibang pumapangalan dito. Theras ang tawag ng Unang Esdras sa ilog, at sinasabi lamang ni Josefo na nagtipon ang bayan sa kabila ng Eufrates. Lupain ng mga kanal ang Babilonia, at ang Ahava ay marahil isa sa mga ito, malapit sa Babilonia mismo; minamarkahan ng mapa ang malawak na bilog sa palibot ng lungsod at ilang hula, gaya ng Hit sa Eufrates (ang sinaunang Is, na may mga bukal ng bitumen), Opis sa Tigris at Tell Ishnayt, na walang suporta sa mga sanggunian."
    - "“At pinisan ko sila sa ilog na umaagos patungo sa Ahava; at doo'y nangagpahinga kaming tatlong araw; at aking minasdan ang bayan at ang mga saserdote, at walang nasumpungan doon sa mga anak ni Levi.” Nagsugo si Ezra kay Iddo sa Casipia para sa mga Levita at mga lingkod ng templo, at dumating ang 38 Levita at 220 Nethineo. “Nang magkagayo'y nagtanyag ako ng ayuno doon, sa ilog ng Ahava, upang tayo'y magpakababa sa harap ng ating Dios, upang humanap sa kaniya ng matuwid na daan”, sapagkat nahiya siyang humingi sa hari ng mga kasama sa daan matapos sabihin dito na ang kamay ng Diyos ay sumasa lahat ng humahanap sa kaniya."
    - "Tinimbang niya ang pilak, ginto at mga sisidlan para sa labindalawang saserdote. “Nang magkagayo'y nagsiyaon tayo mula sa ilog ng Ahava, nang ikalabing dalawang araw ng unang buwan, upang pumaroon sa Jerusalem: at ang kamay ng ating Dios ay sumaatin”. Nakarating sila sa Jerusalem sa unang araw ng ikalimang buwan, apat na buwan matapos umalis sa Babilonia. Ang mga kanal ng gitnang Iraq, na maraming beses nang nagbago ng kanilang mga daluyan mula noon, ay walang pangalang tulad ng Ahava, at ang lugar ay tuluyan nang nawala."
  da:
    - "Ahava er floden, eller kanalen, i Babylonien, på hvis bred Ezra samlede følget, der drog med ham op til Jerusalem i Artaxerxes' syvende år: 458 f.Kr., hvis kongen er Artaxerxes 1., som de fleste mener, eller 398 f.Kr. under Artaxerxes 2. Ezra skriver om »Floden, som løber til Ahava« og siden om »Ahavas Flod«, så Ahava var også et sted, måske en by eller et kanalhoved. Intet andet nævner det. Første Esdrasbog kalder floden Theras, og Josefus siger blot, at folket samledes hinsides Eufrat. Babylonien var et kanalernes land, og Ahava var formentlig en af dem, ikke langt fra selve Babylon; kortet markerer en bred kreds omkring byen og flere gæt, blandt dem Hit ved Eufrat (det gamle Is, med sine bitumenkilder), Opis ved Tigris og Tell Ishnayt, ingen af dem med støtte i kilderne."
    - "»Og jeg samlede dem ved Floden, som løber til Ahava, og der lejrede vi os tre Dage; og der jeg gav Agt paa Folket og paa Præsterne, da fandt jeg ingen af Levis Børn der.« Ezra sendte bud til Iddo i Kasifja efter leviter og tempeltjenere, og 38 leviter og 220 nethinim kom. »Og jeg lod der udraabe en Faste ved den Flod Ahava for at ydmyge os for vor Guds Ansigt for at bede ham om en lykkelig Rejse for os ...«, thi han skammede sig ved at bede kongen om følge, efter at have sagt til ham, at Guds hånd er over alle, som søger ham."
    - "Han tilvejede sølvet, guldet og karrene til tolv præster, og »vi rejste fra Ahavas Flod paa den tolvte Dag i den første Maaned for at drage til Jerusalem, og vor Guds Haand var over os«. De nåede Jerusalem på den første dag i den femte måned, fire måneder efter afrejsen fra Babylon. Det centrale Iraks kanaler, som har flyttet deres løb mange gange siden, bevarer intet navn som Ahava, og stedet er simpelthen gået tabt."
  sr:
    - "Ава је река, или канал, у Вавилонији на чијој је обали Јездра окупио дружину која је с њим отишла у Јерусалим седме године Артаксеркса: 458. п. н. е. ако је цар Артаксеркс I, како већина држи, или 398. п. н. е. под Артаксерксом II. Јездра пише „код реке која тече у Аву“, а затим „на реци Ави“, па је Ава била и место, можда град или почетак канала. Ништа друго је не именује. Прва Ездрина књига назива реку Терас, а Јосиф Флавије каже само да се народ окупио с оне стране Еуфрата. Вавилонија је била земља канала, а Ава је вероватно била један од њих, недалеко од самог Вавилона; карта означава широк круг око града и неколико претпоставки, међу њима Хит на Еуфрату (стари Ис, са изворима битумена), Опис на Тигру и Тел Ишнајт, ниједну са упориштем у изворима."
    - "„И сабра их код реке која тече у Аву, и онде стајасмо у логору три дана; после прегледах народ и свештенике али не нађох онде ни једног од синова Левијевих.“ Јездра је послао к Иду у Касифију по левите и храмске слуге, и дошло је 38 левита и 220 Нетинеја. „Тада огласих онде на реци Ави пост, да бисмо се понизили пред Богом својим и измолили у Њега срећан пут…“, јер га је било стид да тражи од цара пратњу пошто му је рекао да је рука Божја на добро над свима који га траже."
    - "Одмерио је сребро, злато и посуђе дванаесторици свештеника, и „пођосмо од реке Аве дванаестог дана првог месеца да идемо у Јерусалим, и рука Бога нашег беше над нама“. У Јерусалим су стигли првог дана петог месеца, четири месеца пошто су кренули из Вавилона. Канали средњег Ирака, који су од тада много пута променили корито, не чувају име налик Ави, и место је просто изгубљено."
