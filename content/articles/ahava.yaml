# Overview article (ADR 0007). Mainstream facts only; the place is lost and the guesses on the map are named as guesses; the date of Ezra's mission is given as debated (458 or 398 BC).
id: ahava
place: a6c3859
title:
  en: "Ahava"
  ru: "Агава"
body:
  en:
    - "Ahava is the river, or canal, in Babylonia on whose bank Ezra gathered the company that went up with him to Jerusalem in the seventh year of Artaxerxes: 458 BC if the king is Artaxerxes I, as most hold, or 398 BC under Artaxerxes II. Ezra writes of “the river that runneth to Ahava” and then of “the river of Ahava”, so Ahava was also a place, perhaps a town or a canal head. Nothing else names it. First Esdras calls the river Theras, and Josephus says only that the people gathered beyond the Euphrates. Babylonia was a land of canals, and Ahava was presumably one of them, not far from Babylon itself; the map marks a wide circle around the city and three guesses, Hit on the Euphrates, the ancient Is with its bitumen springs, Opis on the Tigris, and Tell Ishnayt, none of them with support in the sources."
    - "“And I gathered them together to the river that runneth to Ahava; and there abode we in tents three days: and I viewed the people, and the priests, and found there none of the sons of Levi.” Ezra sent to Iddo at Casiphia for Levites and temple servants, and 38 Levites and 220 Nethinim came. “Then I proclaimed a fast there, at the river of Ahava, that we might afflict ourselves before our God, to seek of him a right way”, for he was ashamed to ask the king for an escort after telling him that God's hand is on all who seek him."
    - "He weighed out the silver, gold and vessels to twelve priests, and “we departed from the river of Ahava on the twelfth day of the first month, to go unto Jerusalem: and the hand of our God was upon us”. They reached Jerusalem in the fifth month, four months on the road. The canals of central Iraq, which have shifted their beds many times since, keep no name like Ahava, and the place is simply lost."
  ru:
    - "Агава — река, или канал, в Вавилонии, на берегу которой Ездра собрал спутников, шедших с ним в Иерусалим в седьмой год Артаксеркса: в 458 г. до н. э., если это Артаксеркс I, как считает большинство, или в 398 г. до н. э. при Артаксерксе II. Ездра пишет о реке, «втекающей в Агаву», а затем просто о реке Агаве, так что Агава была и местом — быть может, городком или истоком канала. Больше её никто не называет. Греческая Вторая книга Ездры зовёт реку Фера, а Иосиф Флавий говорит лишь, что народ собрался за Евфратом. Вавилония была страной каналов, и Агава, надо думать, была одним из них, недалеко от самого Вавилона; на карте отмечены широкий круг вокруг города и три догадки — Хит на Евфрате, древний Ис с его битумными источниками, Опис на Тигре и Телль-Ишнейт, — ни одна из которых не имеет опоры в источниках."
    - "«Я собрал их у реки, втекающей в Агаву, и мы простояли там три дня, и когда я осмотрел народ и священников, то из сынов Левия никого там не нашел». Ездра послал к Иддо в Касифью за левитами и служителями храма, и пришли 38 левитов и 220 нефинеев. «И провозгласил я там пост у реки Агавы, чтобы смириться нам пред лицем Бога нашего, просить у Него благополучного пути», ибо ему стыдно было просить у царя охраны после того, как он сказал царю, что рука Божия на всех прибегающих к Нему."
    - "Он отвесил серебро, золото и сосуды двенадцати священникам, и «отправились мы от реки Агавы в двенадцатый день первого месяца, чтобы идти в Иерусалим; и рука Бога нашего была над нами». В Иерусалим они пришли в пятом месяце, после четырёх месяцев пути. Каналы центрального Ирака, с тех пор много раз менявшие русла, не хранят имени, похожего на Агаву, и место попросту утрачено."
