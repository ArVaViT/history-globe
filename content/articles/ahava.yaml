# Overview article (ADR 0007). Mainstream facts only; the place is lost and the guesses on the map are named as guesses; the date of Ezra's mission is given as debated (458 or 398 BC).
id: ahava
place: a6c3859
title:
  en: "Ahava"
  ru: "Агава"
  uk: "Агава"
  es: "Ahava"
  pt: "Aava"
  de: "Ahawa"
  fr: "Ahava"
body:
  en:
    - "Ahava is the river, or canal, in Babylonia on whose bank Ezra gathered the company that went up with him to Jerusalem in the seventh year of Artaxerxes: 458 BC if the king is Artaxerxes I, as most hold, or 398 BC under Artaxerxes II. Ezra writes of “the river that runneth to Ahava” and then of “the river of Ahava”, so Ahava was also a place, perhaps a town or a canal head. Nothing else names it. First Esdras calls the river Theras, and Josephus says only that the people gathered beyond the Euphrates. Babylonia was a land of canals, and Ahava was presumably one of them, not far from Babylon itself; the map marks a wide circle around the city and three guesses, Hit on the Euphrates, the ancient Is with its bitumen springs, Opis on the Tigris, and Tell Ishnayt, none of them with support in the sources."
    - "“And I gathered them together to the river that runneth to Ahava; and there abode we in tents three days: and I viewed the people, and the priests, and found there none of the sons of Levi.” Ezra sent to Iddo at Casiphia for Levites and temple servants, and 38 Levites and 220 Nethinim came. “Then I proclaimed a fast there, at the river of Ahava, that we might afflict ourselves before our God, to seek of him a right way”, for he was ashamed to ask the king for an escort after telling him that God's hand is on all who seek him."
    - "He weighed out the silver, gold and vessels to twelve priests, and “we departed from the river of Ahava on the twelfth day of the first month, to go unto Jerusalem: and the hand of our God was upon us”. They reached Jerusalem in the fifth month, four months on the road. The canals of central Iraq, which have shifted their beds many times since, keep no name like Ahava, and the place is simply lost."
  ru:
    - "Агава — река, или канал, в Вавилонии, на берегу которой Ездра собрал спутников, шедших с ним в Иерусалим в седьмой год Артаксеркса: в 458 г. до н. э., если это Артаксеркс I, как считает большинство, или в 398 г. до н. э. при Артаксерксе II. Ездра пишет о реке, «втекающей в Агаву», а затем просто о реке Агаве, так что Агава была и местом — быть может, городком или истоком канала. Больше её никто не называет. Греческая Вторая книга Ездры зовёт реку Фера, а Иосиф Флавий говорит лишь, что народ собрался за Евфратом. Вавилония была страной каналов, и Агава, надо думать, была одним из них, недалеко от самого Вавилона; на карте отмечены широкий круг вокруг города и три догадки — Хит на Евфрате, древний Ис с его битумными источниками, Опис на Тигре и Телль-Ишнейт, — ни одна из которых не имеет опоры в источниках."
    - "«Я собрал их у реки, втекающей в Агаву, и мы простояли там три дня, и когда я осмотрел народ и священников, то из сынов Левия никого там не нашел». Ездра послал к Иддо в Касифью за левитами и служителями храма, и пришли 38 левитов и 220 нефинеев. «И провозгласил я там пост у реки Агавы, чтобы смириться нам пред лицем Бога нашего, просить у Него благополучного пути», ибо ему стыдно было просить у царя охраны после того, как он сказал царю, что рука Божия на всех прибегающих к Нему."
    - "Он отвесил серебро, золото и сосуды двенадцати священникам, и «отправились мы от реки Агавы в двенадцатый день первого месяца, чтобы идти в Иерусалим; и рука Бога нашего была над нами». В Иерусалим они пришли в пятом месяце, после четырёх месяцев пути. Каналы центрального Ирака, с тех пор много раз менявшие русла, не хранят имени, похожего на Агаву, и место попросту утрачено."
  uk:
    - "Агава — річка, або канал, у Вавилонії, на березі якої Ездра зібрав гурт, що пішов з ним до Єрусалима сьомого року Артаксеркса: 458 р. до н. е., якщо цар — Артаксеркс I, як вважає більшість, або 398 р. до н. е. за Артаксеркса II. Ездра пише про «ріку, що вливається в Агаву», а потім про «ріку Агави», тож Агава була й місцем, можливо, містом або початком каналу. Ніщо інше її не називає. Перша (грецька) книга Ездри називає річку Терас, а Йосиф Флавій каже лише, що народ зібрався за Євфратом. Вавилонія була краєм каналів, і Агава, ймовірно, була одним із них, неподалік від самого Вавилона; мапа позначає широке коло навколо міста і три здогади — Гіт на Євфраті, давній Іс із бітумними джерелами, Опіс на Тигрі та Телль-Ішнайт, — жоден з яких не має підтримки в джерелах."
    - "«Я зібрав їх коло ріки, що вливається в Агаву, й там простояли ми три днї, а як я переглянув народ та сьвященників, то з синів Левії не знайшов там нїкого.» Ездра послав до Іддо в Касифію по левітів і храмових служителів, і прийшли 38 левітів і 220 нетинеїв. «І оповістив там піст коло ріки Агави, щоб нам впокоритись перед лицем Бога нашого, та просити в його щасливої дороги», бо йому було соромно просити в царя охорони після того, як він сказав йому, що рука Божа над усіма, хто шукає його."
    - "Він відважив срібло, золото й посуд дванадцятьом священникам, і «рушили ми від ріки Агави дванайцятого дня першого місяця, щоб ійти в Ерусалим, а рука Бога нашого була над нами». До Єрусалима вони дійшли в п'ятому місяці, чотири місяці в дорозі. Канали центрального Іраку, які відтоді багато разів змінювали русла, не зберігають жодної назви на кшталт Агави, і місце просто втрачено."
  es:
    - "Ahava es el río, o canal, de Babilonia a cuya orilla Esdras reunió a la compañía que subió con él a Jerusalén en el año séptimo de Artajerjes: 458 a. C. si el rey es Artajerjes I, como sostiene la mayoría, o 398 a. C. bajo Artajerjes II. Esdras escribe sobre el «río que viene á Ahava» y luego sobre «el río de Ahava», de modo que Ahava era también un lugar, quizá una ciudad o la cabecera de un canal. Nada más la nombra. El primer libro de Esdras llama al río Teras, y Josefo dice solo que el pueblo se reunió al otro lado del Éufrates. Babilonia era una tierra de canales, y Ahava era presumiblemente uno de ellos, no lejos de la propia Babilonia; el mapa señala un amplio círculo en torno a la ciudad y tres conjeturas, Hit, en el Éufrates, la antigua Is con sus manantiales de betún, Opis, en el Tigris, y Tell Ishnayt, ninguna con respaldo en las fuentes."
    - "«Y juntélos junto al río que viene á Ahava, y reposamos allí tres días: y habiendo buscado entre el pueblo y entre los sacerdotes, no hallé allí de los hijos de Leví.» Esdras envió a Iddo, en Casifia, en busca de levitas y servidores del templo, y llegaron 38 levitas y 220 netineos. «Y publiqué ayuno allí junto al río de Ahava, para afligirnos delante de nuestro Dios, para solicitar de él camino derecho», pues le daba vergüenza pedir al rey una escolta después de haberle dicho que la mano de Dios es para bien sobre todos los que le buscan."
    - "Pesó la plata, el oro y los utensilios a doce sacerdotes, y «partimos del río de Ahava el doce del mes primero, para ir á Jerusalem: y la mano de nuestro Dios fué sobre nosotros». Llegaron a Jerusalén en el mes quinto, cuatro meses en el camino. Los canales del centro de Irak, que han cambiado de cauce muchas veces desde entonces, no conservan ningún nombre como Ahava, y el lugar está simplemente perdido."
  pt:
    - "Aava é o rio, ou canal, da Babilônia à margem do qual Esdras reuniu o grupo que subiu com ele a Jerusalém no sétimo ano de Artaxerxes: 458 a.C. se o rei é Artaxerxes I, como a maioria sustenta, ou 398 a.C. sob Artaxerxes II. Esdras escreve do “rio que corre para Aava” e depois do “rio Aava”, de modo que Aava era também um lugar, talvez uma cidade ou a cabeceira de um canal. Nada mais a nomeia. Primeiro Esdras chama o rio Teras, e Josefo diz apenas que o povo se reuniu além do Eufrates. A Babilônia era uma terra de canais, e Aava foi presumivelmente um deles, não longe da própria Babilônia; o mapa marca um amplo círculo em torno da cidade e três conjeturas, Hit no Eufrates, a antiga Is com as suas fontes de betume, Ópis no Tigre e Tell Ishnayt, nenhuma com apoio nas fontes."
    - "“Eu os reuni junto ao rio que corre para Aava; e ali acampamos por três dias. Então observei o povo e os sacerdotes, e não encontrei ali nenhum dos filhos de Levi.” Esdras mandou buscar levitas e servos do templo a Ido, em Casifia, e vieram 38 levitas e 220 servos do templo. “Então proclamei um jejum ali junto ao rio Aava, para que pudéssemos nos humilhar perante o nosso Deus, para buscar dele um caminho seguro”, pois teve vergonha de pedir ao rei uma escolta depois de lhe dizer que a mão de Deus está sobre todos os que o buscam."
    - "Pesou a prata, o ouro e os utensílios para doze sacerdotes, e “partimos do rio Aava no décimo segundo dia do primeiro mês, para ir a Jerusalém. A mão do nosso Deus estava sobre nós”. Chegaram a Jerusalém no quinto mês, quatro meses de caminho. Os canais do Iraque central, que mudaram de leito muitas vezes desde então, não guardam nome como Aava, e o lugar está simplesmente perdido."
  de:
    - "Ahawa ist der Fluss oder Kanal in Babylonien, an dessen Ufer Esra die Schar versammelte, die mit ihm im siebten Jahr des Artaxerxes nach Jerusalem hinaufzog: 458 v. Chr., wenn der König Artaxerxes I. ist, wie die meisten annehmen, oder 398 v. Chr. unter Artaxerxes II. Esra schreibt vom „Wasser, das gen Ahava kommt“ und dann vom „Wasser bei Ahava“, so war Ahawa auch ein Ort, vielleicht eine Stadt oder ein Kanalanfang. Nichts sonst nennt es. Das Erste Buch Esdras nennt den Fluss Theras, und Josephus sagt nur, das Volk habe sich jenseits des Euphrat versammelt. Babylonien war ein Land der Kanäle, und Ahawa war vermutlich einer davon, nicht weit von Babylon selbst; die Karte zeichnet einen weiten Kreis um die Stadt und drei Vermutungen ein, Hit am Euphrat, das antike Is mit seinen Asphaltquellen, Opis am Tigris und Tell Ishnayt, keine davon mit Rückhalt in den Quellen."
    - "„Und ich versammelte sie ans Wasser, das gen Ahava kommt; und wir bleiben drei Tage daselbst. Und da ich achthatte aufs Volk und die Priester, fand ich keine Leviten daselbst.“ Esra sandte zu Iddo nach Kasifja um Leviten und Tempeldiener, und 38 Leviten und 220 Tempeldiener kamen. „Und ich ließ daselbst am Wasser bei Ahava ein Fasten ausrufen, daß wir uns demütigten vor unserm Gott, zu suchen von ihm einen richtigen Weg“, denn er schämte sich, den König um Geleit zu bitten, nachdem er ihm gesagt hatte, Gottes Hand sei über allen, die ihn suchen."
    - "Er wog zwölf Priestern das Silber, das Gold und die Geräte zu, und „wir brachen auf von dem Wasser Ahava am zwölften Tage des ersten Monats, daß wir gen Jerusalem zögen. Und die Hand unsres Gottes war über uns“. Im fünften Monat erreichten sie Jerusalem, vier Monate unterwegs. Die Kanäle des mittleren Irak, die ihr Bett seither viele Male verlegt haben, bewahren keinen Namen wie Ahawa, und der Ort ist schlicht verloren."
  fr:
    - "Ahava est le fleuve, ou canal, de Babylonie sur la rive duquel Esdras rassembla la troupe qui monta avec lui à Jérusalem la septième année d’Artaxerxès : 458 av. J.-C. si le roi est Artaxerxès Ier, comme la plupart le pensent, ou 398 av. J.-C. sous Artaxerxès II. Esdras parle du « fleuve qui coule vers Ahava », puis du « fleuve d’Ahava » ; Ahava était donc aussi un lieu, peut-être une ville ou une tête de canal. Rien d’autre ne le nomme. 1 Esdras appelle le fleuve Théras, et Josèphe dit seulement que le peuple se rassembla au-delà de l’Euphrate. La Babylonie était un pays de canaux, et Ahava en était sans doute un, non loin de Babylone même ; la carte trace un large cercle autour de la ville et trois hypothèses, Hit sur l’Euphrate, l’antique Is aux sources de bitume, Opis sur le Tigre, et Tell Ishnayt, aucune appuyée par les sources."
    - "« Je les rassemblai près du fleuve qui coule vers Ahava, et nous campâmes là trois jours. Je dirigeai mon attention sur le peuple et sur les sacrificateurs, et je ne trouvai là aucun des fils de Lévi. » Esdras envoya vers Iddo, à Casiphia, chercher des lévites et des serviteurs du Temple, et 38 lévites et 220 Néthiniens vinrent. « Là, près du fleuve d’Ahava, je publiai un jeûne d’humiliation devant notre Dieu, afin d’implorer de lui un heureux voyage », car il aurait eu honte de demander une escorte au roi après lui avoir dit que la main de Dieu est sur tous ceux qui le cherchent."
    - "Il pesa l’argent, l’or et les objets à douze prêtres, et « nous partîmes du fleuve d’Ahava pour nous rendre à Jérusalem, le douzième jour du premier mois. La main de notre Dieu fut sur nous ». Ils arrivèrent à Jérusalem au cinquième mois, après quatre mois de route. Les canaux du centre de l’Irak, dont le lit a bien des fois changé depuis, ne gardent aucun nom comme Ahava, et le lieu est simplement perdu."
