body:
  en:
    - "The Syrtis, or Greater Syrtis, is the broad gulf on the coast of Libya between Cyrenaica and Tripolitania, today the Gulf of Sidra. Strabo gives its circuit as about 3,930 stadia and explains why sailors dreaded it: its waters hide shallows, and with the ebb and flow of the tides ships run aground and stick fast, so that few escape; sailors therefore kept well off the coast and feared being driven into the gulf by the winds. The same was true of the Lesser Syrtis to the west, the Gulf of Gabès."
    - "When the north-easter Euroclydon struck Paul's ship south of Crete, the crew hauled in the boat at Clauda, undergirded the hull and, “fearing lest they should fall into the quicksands, strake sail, and so were driven.” The Greek names the Syrtis itself, which the King James Version renders as “the quicksands” and the Russian Synodal Bible as running aground; the wind was carrying the ship south-west, towards the gulf. Instead the storm drove it west for fourteen days, to Melita."
  ru:
    - "Сирт, или Большой Сирт, — широкий залив на побережье Ливии между Киренаикой и Триполитанией, ныне залив Сидра. Страбон даёт его окружность около 3930 стадиев и объясняет, почему мореплаватели его боялись: в его водах скрываются мели, и при приливах и отливах корабли садятся на них и застревают, так что немногие спасаются; поэтому моряки держались подальше от берега и боялись, что ветер загонит их в залив. То же относилось и к Малому Сирту на западе, заливу Габес."
    - "Когда северо-восточный ветер эвроклидон обрушился на корабль Павла к югу от Крита, корабельщики у Клавды подняли лодку, обвязали корпус и, «боясь же, чтобы не сесть на мель, спустили парус и таким образом носились». В греческом тексте назван сам Сирт; английская Библия короля Якова передаёт его как «зыбучие пески», а Синодальный перевод — как мель. Ветер нёс корабль на юго-запад, к заливу. Вместо этого буря четырнадцать дней гнала его на запад, к Мелиту."
  uk:
    - "Сирт, або Велика Сирт, — широка затока на узбережжі Лівії між Киренаїкою та Тріполітанією, нині затока Сидра. Страбон дає її обвід приблизно в 3930 стадіїв і пояснює, чому моряки її боялися: її води ховають мілини, і під час припливу й відпливу кораблі сідають на мілину й застрягають, так що мало хто рятується; тому моряки трималися далеко від берега й боялися, що вітри занесуть їх у затоку. Те саме стосувалося Малої Сирти на заході, затоки Габес."
    - "Коли північно-східний Євроклидон налетів на корабель Павла на південь від Криту, команда підняла на борт шлюпку біля Клавди, підв'язала корпус, і далі Лука пише: «а боячись упасти в сирть (мілке місце), спустили парус, і так нас носило». Грецьке слово називає саму Сирт, яку Біблія короля Якова передає як «пливуни», а російська Синодальна Біблія — як посадку на мілину; вітер ніс корабель на південний захід, до затоки. Натомість буря гнала його на захід чотирнадцять днів, до Мелити."
  es:
    - "La Sirte, o Sirte Mayor, es el amplio golfo de la costa de Libia entre la Cirenaica y la Tripolitania, hoy el golfo de Sidra. Estrabón da su contorno como de unos 3930 estadios y explica por qué lo temían los marineros: sus aguas ocultan bajíos, y con el flujo y reflujo de las mareas las naves encallan y quedan atascadas, de modo que pocas escapan; los marineros se mantenían por eso muy lejos de la costa y temían ser empujados al golfo por los vientos. Lo mismo ocurría con la Sirte Menor, al oeste, el golfo de Gabès."
    - "Cuando el euroclidón, viento del nordeste, golpeó la nave de Pablo al sur de Creta, la tripulación subió el esquife en Clauda, ciñó el casco y, «teniendo temor de que diesen en la Sirte, abajadas las velas, eran así llevados». El griego nombra la propia Sirte, que la versión King James traduce como «arenas movedizas» y la Biblia sinodal rusa como encallar; el viento llevaba la nave hacia el suroeste, hacia el golfo. En cambio, la tormenta la empujó hacia el oeste durante catorce días, hasta Melita."
  pt:
    - "A Sirte, ou Grande Sirte, é o amplo golfo da costa da Líbia entre a Cirenaica e a Tripolitânia, hoje o golfo de Sidra. Estrabão dá seu perímetro como cerca de 3.930 estádios e explica por que os marinheiros o temiam: suas águas escondem baixios, e com o fluxo e o refluxo das marés os navios encalham e ficam presos, de modo que poucos escapam; os marinheiros por isso se mantinham bem afastados da costa e temiam ser levados ao golfo pelos ventos. O mesmo valia para a Pequena Sirte, a oeste, o golfo de Gabès."
    - "Quando o vento nordeste Euroclidão atingiu o navio de Paulo ao sul de Creta, a tripulação içou o bote em Clauda, reforçou o casco com cabos e, “temendo encalhar nos bancos de areia de Sirte, baixaram a âncora flutuante, e assim foram levados”. O grego nomeia a própria Sirte, que a Versão King James traduz por “as areias movediças” e a Bíblia sinodal russa por encalhar; o vento levava o navio para o sudoeste, em direção ao golfo. Em vez disso, a tempestade o impeliu para o oeste durante catorze dias, até Melita."
  de:
    - "Die Syrte oder Große Syrte ist der weite Golf an der Küste Libyens zwischen der Kyrenaika und Tripolitanien, heute der Golf von Syrte. Strabon gibt ihren Umfang mit etwa 3930 Stadien an und erklärt, warum Seeleute sie fürchteten: Ihre Gewässer bergen Untiefen, und mit Ebbe und Flut laufen Schiffe auf Grund und sitzen fest, sodass wenige entkommen; Seeleute hielten sich daher weit von der Küste fern und fürchteten, von den Winden in den Golf getrieben zu werden. Dasselbe galt für die Kleine Syrte im Westen, den Golf von Gabès."
    - "Als der Nordost, den die King-James-Bibel Euroclydon nennt, das Schiff des Paulus südlich von Kreta traf, zog die Besatzung bei Klauda das Boot ein und unterband den Rumpf, „denn wir fürchteten, es möchte in die Syrte fallen, und ließen die Segel herunter und fuhren also“. Das Griechische nennt die Syrte selbst, die die King-James-Bibel mit quicksands wiedergibt und die russische Synodalbibel mit Auflaufen; der Wind trieb das Schiff nach Südwesten, auf den Golf zu. Stattdessen trieb der Sturm es vierzehn Tage lang nach Westen, nach Melite."
  it:
    - "La Sirte, o Sirte Maggiore, è l’ampio golfo sulla costa della Libia tra la Cirenaica e la Tripolitania, oggi golfo della Sirte. Strabone ne dà il perimetro in circa 3930 stadi e spiega perché i marinai la temessero: le sue acque nascondono secche, e con il flusso e il riflusso delle maree le navi si incagliano e restano bloccate, così che pochi scampano; i marinai si tenevano quindi ben lontani dalla costa e temevano di essere spinti nel golfo dai venti. Lo stesso valeva per la Sirte Minore a ovest, il golfo di Gabès."
    - "Quando l’Euraquilone colpì la nave di Paolo a sud di Creta, l’equipaggio tirò su la scialuppa a Clauda, cinse lo scafo di ripari e, «temendo di esser gettati sulla Sirti, calarono le vele, ed eran così portati via». Il greco nomina la Sirte stessa, che la King James Version rende con «le sabbie mobili» e la Bibbia sinodale russa con un incagliarsi; il vento portava la nave verso sud-ovest, verso il golfo. La tempesta invece la spinse verso ovest per quattordici giorni, fino a Melite."
  fr:
    - "La Syrte, ou Grande Syrte, est le large golfe de la côte de Libye entre la Cyrénaïque et la Tripolitaine, aujourd’hui le golfe de Syrte. Strabon donne son pourtour comme d’environ 3 930 stades et explique pourquoi les marins la redoutaient : ses eaux cachent des hauts-fonds, et avec le flux et le reflux des marées les navires s’échouent et restent pris, si bien que peu s’en tirent ; les marins se tenaient donc loin de la côte et craignaient d’être poussés dans le golfe par les vents. Il en allait de même de la Petite Syrte, à l’ouest, le golfe de Gabès."
    - "Quand le vent du nord-est, Euraquilon (Euroclydon dans la version du roi Jacques), frappa le navire de Paul au sud de la Crète, l’équipage hissa la chaloupe à Clauda, ceignit la coque, et « dans la crainte de tomber sur la Syrte, on abaissa les voiles. C’est ainsi qu’on se laissa emporter par le vent. » Le grec nomme la Syrte elle-même, que la version du roi Jacques rend par les sables mouvants et la Bible synodale russe par l’échouement ; le vent portait le navire vers le sud-ouest, en direction du golfe. La tempête le chassa au contraire vers l’ouest pendant quatorze jours, jusqu’à Malte (Mélita)."
  nl:
    - "De Syrtis, of Grote Syrtis, is de brede golf aan de kust van Libië tussen Cyrenaica en Tripolitanië, tegenwoordig de Golf van Sidra. Strabo geeft haar omtrek op als ongeveer 3930 stadiën en legt uit waarom zeelieden haar vreesden: haar water verbergt ondiepten, en met eb en vloed lopen schepen aan de grond en blijven vastzitten, zodat er weinige ontsnappen; zeelieden hielden zich daarom ver van de kust en vreesden door de winden in de golf te worden gedreven. Hetzelfde gold voor de Kleine Syrtis in het westen, de Golf van Gabès."
    - "Toen de noordoostenwind Euroklydon Paulus' schip ten zuiden van Kreta trof, haalde de bemanning de boot binnen bij Klauda, ondergordde de romp en, “alzo zij vreesden, dat zij op de droogte Syrtis vervallen zouden, streken zij het zeil, en dreven alzo henen.” Het Grieks noemt de Syrtis zelf, die de King James Version weergeeft als “the quicksands” en de Russische Synodale Bijbel als aan de grond lopen; de wind voerde het schip naar het zuidwesten, naar de golf. In plaats daarvan dreef de storm het veertien dagen westwaarts, naar Melite."
  cs:
    - "Syrta, neboli Velká Syrta, je široký záliv na pobřeží Libye mezi Kyrenaikou a Tripolitánií, dnes Syrtský záliv. Strabón udává jeho obvod asi 3 930 stadií a vysvětluje, proč se jí námořníci báli: její vody skrývají mělčiny a s přílivem a odlivem lodě najíždějí na dno a uvíznou, takže jen málo jich unikne; námořníci proto drželi daleko od pobřeží a báli se, že je větry zanesou do zálivu. Totéž platilo o Malé Syrtě na západě, Gabeském zálivu."
    - "Když severovýchodní vítr Euroklydon zasáhl Pavlovu loď jižně od Kréty, posádka vytáhla člun u Klaudy, podpásala trup a „bojíce se, aby neuhodili na místo nebezpečné“. Řecký text jmenuje samu Syrtu, kterou Bible krále Jakuba vykládá jako „tekuté písky“ a ruská synodální Bible jako najetí na mělčinu; vítr unášel loď na jihozápad, k zálivu. Bouře ji však hnala čtrnáct dní na západ, k Melitě."
  pl:
    - "Syrta, czyli Wielka Syrta, to szeroka zatoka na wybrzeżu Libii między Cyrenajką a Trypolitanią, dziś Zatoka Wielka Syrta (Zatoka Sidra). Strabon podaje jej obwód na około 3930 stadiów i wyjaśnia, dlaczego żeglarze się jej bali: jej wody kryją mielizny, a przy odpływie i przypływie okręty osiadają na mieliźnie i grzęzną, tak że niewielu ucieka; żeglarze trzymali się więc daleko od wybrzeża i obawiali się, że wiatry zapędzą ich do zatoki. To samo dotyczyło Małej Syrty na zachodzie, Zatoki Gabes."
    - "Gdy północno-wschodni wicher Euroklidon uderzył w okręt Pawła na południe od Krety, załoga wciągnęła szalupę koło Klauda, podpasała kadłub i „bojąc się, żeby nie wpadł na hak, spuściwszy żagle, tak płynęli”. Greckie słowo nazywa samą Syrtę, którą Biblia Króla Jakuba oddaje jako ruchome piaski, a rosyjska Biblia synodalna jako osiadnięcie na mieliźnie; wiatr niósł okręt na południowy zachód, ku zatoce. Burza poniosła go jednak na zachód przez czternaście dni, do Melity."
  sv:
    - "Syrten, eller Stora Syrten, är den vida bukten på Libyens kust mellan Cyrenaika och Tripolitanien, i dag Sidrabukten. Strabon anger dess omkrets till omkring 3 930 stadier och förklarar varför sjömän fruktade den: dess vatten döljer grund, och med tidvattnets ebb och flod går skepp på grund och sitter fast, så att få klarar sig; sjömännen höll sig därför långt från kusten och fruktade att drivas in i bukten av vindarna. Detsamma gällde Lilla Syrten i väster, Gabèsbukten."
    - "När nordostvinden Euroklydon slog till mot Paulus' skepp söder om Kreta, drog besättningen in båten vid Kauda, surrade skrovet, och ”då de fruktade att bliva kastade på Syrtenrevlarna, lade de ut drivankare och läto skeppet så driva”. Grekiskan nämner själva Syrten, vilket King James-översättningen återger som ”the quicksands” och den synodala bibeln som att gå på grund; vinden förde skeppet sydväst, mot bukten. I stället drev stormen det västerut i fjorton dagar, till Melita."
  nb:
    - "Syrtis, eller Store Syrte, er den brede bukten på kysten av Libya mellom Kyrenaika og Tripolitania, i dag Sidrabukta. Strabon oppgir omkretsen til omkring 3930 stadier og forklarer hvorfor sjøfolk fryktet den: vannet skjuler grunner, og med tidevannets flo og fjære går skip på grunn og blir sittende fast, slik at få slipper unna; sjøfolkene holdt seg derfor langt fra kysten og fryktet å bli drevet inn i bukten av vindene. Det samme gjaldt Lille Syrte lenger vest, Gabèsbukta."
    - "Da nordøstvinden Eurakylon rammet Paulus' skip sør for Kreta, halte mannskapet inn båten ved Klauda, slo tau under skroget, og «da de fryktet for å drive ned på Syrten, firte de seilet ned, og drev således». Den greske teksten nevner selve Syrtis, som King James-oversettelsen gjengir som «kvikksanden» og den russiske synodalbibelen som det å gå på grunn; vinden førte skipet mot sørvest, mot bukten. I stedet drev stormen det vestover i fjorten dager, til Malta."
  tl:
    - "Ang Sirte, o Dakilang Sirte, ay ang malawak na golpo sa baybayin ng Libia sa pagitan ng Cirenaica at Tripolitania, ang Golpo ng Sidra ngayon. Ibinibigay ni Estrabon ang sirkumperensiya nito na mga 3,930 estadio at ipinaliliwanag kung bakit ito kinatatakutan ng mga mandaragat: ang tubig nito ay may natatagong mga mababaw, at sa paglaki at pagbaba ng tubig ay sumasadsad at nakukulong ang mga barko, kaya kakaunti ang nakatatakas; kaya lumalayo nang husto ang mga mandaragat sa baybayin at natatakot na maitulak sa golpo ng mga hangin. Ganoon din ang Munting Sirte sa kanluran, ang Golpo ng Gabès."
    - "Nang hampasin ng hanging hilagang-silangan na Euroclydon ang barko ni Pablo sa timog ng Creta, hinila ng mga tripulante ang bangka sa Clauda, tinalian ang katawan ng daong at, “sa takot na baka mapapadpad sa Sirte, ay ibinaba nila ang mga layag, at sa gayo'y napaanod sila.” Pinangangalanan ng Griego ang Sirte mismo, na isinalin ng King James Version na “the quicksands” at ng Synodal na Bibliyang Ruso bilang pagsadsad; dinadala ng hangin ang barko sa timog-kanluran, patungo sa golpo. Sa halip, itinulak ito ng bagyo sa kanluran sa loob ng labing-apat na araw, hanggang sa Melita."
  da:
    - "Syrten, eller Store Syrte, er den brede bugt på Libyens kyst mellem Kyrenaika og Tripolitanien, i dag Sidrabugten. Strabon angiver dens omkreds til omkring 3.930 stadier og forklarer, hvorfor sejlerne frygtede den: dens vande skjuler grunde, og med ebbe og flod løber skibe på grund og sidder fast, så få slipper fri; sejlerne holdt sig derfor langt fra kysten og frygtede at blive drevet ind i bugten af vindene. Det samme gjaldt den Lille Syrte mod vest, Gabèsbugten."
    - "Da nordøstvinden Eurakvilo ramte Paulus' skib syd for Kreta, halede besætningen båden ind ved Klavde, omsurrede skroget, og »da de frygtede for, at de skulde blive kastede ned i Syrten, firede de Sejlene ned og lode sig saaledes drive.« Den græske tekst nævner selve Syrten, som King James-oversættelsen gengiver som »kviksandet« og den russiske Synodalbibel som at løbe på grund; vinden bar skibet mod sydvest, mod bugten. I stedet drev stormen det mod vest i fjorten dage, til Malta."
