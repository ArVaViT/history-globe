# Overview article (ADR 0007). Mainstream facts only; the disputed authorship of Colossians is named as such.
id: colossae
place: a4e5a69
title:
  en: "Colossae"
  ru: "Колоссы"
  uk: "Колоси"
  es: "Colosas"
  pt: "Colossos"
  de: "Kolossae"
  fr: "Colosses"
body:
  en:
    - "Colossae lay in the valley of the Lycus in south-western Phrygia, at the foot of Mount Cadmus near today's Honaz in Turkey, about 15 km up the valley from Laodicea and 20 km from Hierapolis. Its mound has never been fully excavated; survey work there began only in 2021. Herodotus says that Xerxes, marching against Greece in 481 BC, came to Colossae, a great Phrygian city at the place where the Lycus disappears into a chasm and flows underground. In 401 BC the younger Cyrus halted at Colossae for seven days, and Xenophon calls it an inhabited city, prosperous and large."
    - "In the Hellenistic and Roman periods the nearby cities of Laodicea and Hierapolis grew and overshadowed it. Strabo counts Colossae among the small towns around Laodicea and Apameia, though it was known for its wool and for a dye named after the city."
    - "The church at Colossae was founded not by Paul but by Epaphras, a Colossian, from whom the believers had learned the gospel; many of them had not seen Paul's face. The Letter to the Colossians, sent in Paul's name from prison (many scholars hold that a disciple wrote it), speaks of the believers of Laodicea and Hierapolis, sends greetings to Laodicea and asks that it be read there too. It calls Onesimus one of them and sends a message to Archippus, and since the letter to Philemon greets Archippus as well, the house church of Philemon, to whom Paul sent the slave Onesimus back, is usually placed at Colossae."
    - "Tacitus records that an earthquake laid Laodicea in ruins in AD 60, and the fifth-century historian Orosius says that under Nero an earthquake overthrew the three cities of Laodicea, Hierapolis and Colossae. Colossae lived on as a small town; in the Byzantine period its people moved up the slope to Chonae, the modern Honaz."
  ru:
    - "Колоссы лежали в долине Лика на юго-западе Фригии, у подножия горы Кадм близ нынешнего турецкого Хоназа, примерно в 15 км выше по долине от Лаодикии и в 20 км от Иераполя. Их холм так и не был полностью раскопан; разведочные работы начались там лишь в 2021 г. Геродот пишет, что Ксеркс, идя на Грецию в 481 г. до н. э., пришёл в Колоссы, большой фригийский город на том месте, где Лик уходит в расселину и течёт под землёй. В 401 г. до н. э. Кир Младший простоял в Колоссах семь дней, и Ксенофонт называет их населённым городом, богатым и большим."
    - "В эллинистическую и римскую эпохи соседние Лаодикия и Иераполь выросли и затмили их. Страбон относит Колоссы к небольшим городкам вокруг Лаодикии и Апамеи, хотя они славились шерстью и краской, названной по имени города."
    - "Церковь в Колоссах основал не Павел, а Епафрас, сам колоссянин, от которого верующие научились Евангелию; многие из них не видели лица Павла. Послание к Колоссянам, отправленное от имени Павла из уз (многие учёные считают, что его написал ученик), упоминает верующих Лаодикии и Иераполя, передаёт приветствие Лаодикии и просит прочитать его и там. Оно называет Онисима одним из них и передаёт слово Архиппу, а так как послание к Филимону тоже приветствует Архиппа, домашнюю церковь Филимона, к которому Павел отослал раба Онисима, обычно помещают в Колоссах."
    - "Тацит сообщает, что в 60 г. н. э. землетрясение разрушило Лаодикию, а историк V века Орозий пишет, что при Нероне землетрясение повергло три города — Лаодикию, Иераполь и Колоссы. Колоссы продолжали существовать как небольшой город; в византийскую эпоху их жители переселились выше по склону, в Хоны, нынешний Хоназ."
  uk:
    - "Колоси лежали в долині Ліка в південно-західній Фрігії, біля підніжжя гори Кадм поряд із сьогоднішнім Хоназом у Туреччині, приблизно за 15 км угору по долині від Лаодікеї та за 20 км від Ієраполіса. Його горб ніколи не було розкопано повністю; обстеження там почалися лише в 2021 р. Геродот каже, що Ксеркс, виступаючи проти Еллади в 481 р. до н. е., прийшов до Колос, великого фрігійського міста на місці, де Лік зникає в проваллі й тече під землею. У 401 р. до н. е. Кір Молодший зупинився в Колосах на сім днів, і Ксенофонт називає його залюдненим містом, заможним і великим."
    - "В елліністичну й римську добу сусідні міста Лаодікея та Ієраполіс розрослися й затьмарили його. Страбон зараховує Колоси до малих міст навколо Лаодікеї та Апамеї, хоча воно було відоме своєю вовною та барвником, названим на честь міста."
    - "Церкву в Колосах заснував не Павло, а Епафрас, колосянин, від якого віруючі навчилися євангелії; багато з них не бачили Павлового обличчя. Послання до колосян, надіслане від імені Павла з в'язниці (багато вчених вважають, що його написав учень), говорить про віруючих Лаодікеї та Ієраполіса, передає вітання в Лаодікею й просить, щоб його прочитали й там. Воно називає Онисима одним із них і передає настанову Архипові, а що послання до Филимона вітає й Архипа, то домову церкву Филимона, до якого Павло відіслав назад раба Онисима, зазвичай розміщують у Колосах."
    - "Тацит повідомляє, що землетрус зруйнував Лаодікею в 60 р. н. е., а історик V ст. Орозій каже, що за Нерона землетрус повалив три міста — Лаодікею, Ієраполіс і Колоси. Колоси жили далі як мале місто; у візантійський період його мешканці перебралися вгору по схилу до Хон, сучасного Хоназа."
  es:
    - "Colosas se hallaba en el valle del Lico, en el suroeste de Frigia, al pie del monte Cadmo, cerca de la actual Honaz, en Turquía, a unos 15 km valle arriba de Laodicea y a 20 km de Hierápolis. Su montículo nunca ha sido excavado del todo; los trabajos de prospección allí comenzaron solo en 2021. Heródoto dice que Jerjes, al marchar contra Grecia en el 481 a. C., llegó a Colosas, una gran ciudad frigia en el lugar donde el Lico desaparece en una sima y fluye bajo tierra. En el 401 a. C. Ciro el Joven se detuvo en Colosas siete días, y Jenofonte la llama una ciudad habitada, próspera y grande."
    - "En las épocas helenística y romana, las cercanas ciudades de Laodicea y Hierápolis crecieron y la eclipsaron. Estrabón cuenta Colosas entre las pequeñas poblaciones en torno a Laodicea y Apamea, aunque era conocida por su lana y por un tinte que llevaba el nombre de la ciudad."
    - "La iglesia de Colosas no fue fundada por Pablo sino por Epafras, colosense, de quien los creyentes habían aprendido el Evangelio; muchos de ellos no habían visto el rostro de Pablo. La Carta a los Colosenses, enviada en nombre de Pablo desde la cárcel (muchos estudiosos sostienen que la escribió un discípulo), habla de los creyentes de Laodicea y de Hierápolis, envía saludos a Laodicea y pide que se lea también allí. Llama a Onésimo uno de ellos y envía un mensaje a Arquipo, y como la carta a Filemón saluda también a Arquipo, la iglesia doméstica de Filemón, a quien Pablo devolvió al esclavo Onésimo, suele situarse en Colosas."
    - "Tácito registra que un terremoto redujo Laodicea a ruinas en el 60 d. C., y el historiador del siglo V Orosio dice que bajo Nerón un terremoto derribó las tres ciudades de Laodicea, Hierápolis y Colosas. Colosas siguió viviendo como una pequeña población; en el periodo bizantino sus habitantes se trasladaron ladera arriba a Chonas, la moderna Honaz."
  pt:
    - "Colossos ficava no vale do Lico, no sudoeste da Frígia, ao pé do monte Cadmo, perto da atual Honaz, na Turquia, cerca de 15 km vale acima de Laodiceia e 20 km de Hierápolis. Seu monte nunca foi plenamente escavado; os trabalhos de prospecção só começaram ali em 2021. Heródoto diz que Xerxes, marchando contra a Grécia em 481 a.C., chegou a Colossos, grande cidade frígia no lugar onde o Lico desaparece numa fenda e corre sob a terra. Em 401 a.C., Ciro, o Jovem, deteve-se em Colossos por sete dias, e Xenofonte a chama de cidade habitada, próspera e grande."
    - "Nas épocas helenística e romana, as cidades vizinhas de Laodiceia e Hierápolis cresceram e a ofuscaram. Estrabão conta Colossos entre as pequenas cidades em torno de Laodiceia e Apameia, embora fosse conhecida por sua lã e por um corante que tinha o nome da cidade."
    - "A igreja de Colossos foi fundada não por Paulo, mas por Epafras, um colossense, de quem os crentes haviam aprendido o Evangelho; muitos deles não tinham visto o rosto de Paulo. A Carta aos Colossenses, enviada em nome de Paulo da prisão (muitos estudiosos sustentam que um discípulo a escreveu), fala dos crentes de Laodiceia e Hierápolis, envia saudações a Laodiceia e pede que seja lida lá também. Chama Onésimo de um dos seus e envia uma mensagem a Arquipo, e como a carta a Filemom também saúda Arquipo, a igreja doméstica de Filemom, a quem Paulo devolveu o escravo Onésimo, costuma ser situada em Colossos."
    - "Tácito registra que um terremoto arruinou Laodiceia em 60 d.C., e o historiador do século V Orósio diz que, sob Nero, um terremoto derrubou as três cidades de Laodiceia, Hierápolis e Colossos. Colossos sobreviveu como pequena cidade; no período bizantino, seu povo mudou-se encosta acima para Chonae, a moderna Honaz."
  de:
    - "Kolossae lag im Tal des Lykos im Südwesten Phrygiens, am Fuß des Kadmos-Berges beim heutigen Honaz in der Türkei, etwa 15 km talaufwärts von Laodizea und 20 km von Hierapolis. Sein Hügel ist nie vollständig ausgegraben worden; Untersuchungen vor Ort begannen erst 2021. Herodot sagt, Xerxes sei auf seinem Zug gegen Griechenland 481 v. Chr. nach Kolossae gekommen, einer großen phrygischen Stadt an der Stelle, wo der Lykos in einer Kluft verschwindet und unterirdisch fließt. Im Jahr 401 v. Chr. rastete Kyros der Jüngere sieben Tage in Kolossae, und Xenophon nennt es eine bewohnte, wohlhabende und große Stadt."
    - "In hellenistischer und römischer Zeit wuchsen die nahen Städte Laodizea und Hierapolis und stellten es in den Schatten. Strabon zählt Kolossae zu den kleinen Städten um Laodizea und Apameia, doch war es für seine Wolle und für einen nach der Stadt benannten Farbstoff bekannt."
    - "Die Gemeinde in Kolossae wurde nicht von Paulus gegründet, sondern von Epaphras, einem Kolosser, von dem die Gläubigen das Evangelium gelernt hatten; viele von ihnen hatten Paulus nie von Angesicht gesehen. Der Brief an die Kolosser, im Namen des Paulus aus dem Gefängnis gesandt (viele Gelehrte halten einen Schüler für den Verfasser), spricht von den Gläubigen in Laodizea und Hierapolis, sendet Grüße nach Laodizea und bittet, dass er auch dort gelesen werde. Er nennt Onesimus einen der Ihren und richtet eine Botschaft an Archippus, und da der Brief an Philemon auch Archippus grüßt, wird die Hausgemeinde des Philemon, zu dem Paulus den Sklaven Onesimus zurückschickte, gewöhnlich in Kolossae angesetzt."
    - "Tacitus berichtet, dass ein Erdbeben Laodizea im Jahr 60 n. Chr. in Trümmer legte, und der Historiker Orosius aus dem 5. Jahrhundert sagt, unter Nero habe ein Erdbeben die drei Städte Laodizea, Hierapolis und Kolossae zerstört. Kolossae lebte als kleine Stadt weiter; in byzantinischer Zeit zogen seine Bewohner den Hang hinauf nach Chonai, dem heutigen Honaz."
  fr:
    - "Colosses se trouvait dans la vallée du Lycos, dans le sud-ouest de la Phrygie, au pied du mont Cadmos près de l’actuelle Honaz, en Turquie, à environ 15 km en amont de la vallée depuis Laodicée et à 20 km de Hiérapolis. Son tertre n’a jamais été entièrement fouillé ; des prospections n’y ont commencé qu’en 2021. Hérodote dit que Xerxès, marchant contre la Grèce en 481 av. J.-C., parvint à Colosses, grande ville phrygienne à l’endroit où le Lycos disparaît dans un gouffre et coule sous terre. En 401 av. J.-C., Cyrus le Jeune fit halte sept jours à Colosses, et Xénophon l’appelle une ville peuplée, prospère et grande."
    - "Aux époques hellénistique et romaine, les villes voisines de Laodicée et de Hiérapolis grandirent et la reléguèrent dans l’ombre. Strabon compte Colosses parmi les petites villes des environs de Laodicée et d’Apamée, bien qu’elle fût connue pour sa laine et pour une teinture portant le nom de la ville."
    - "L’Église de Colosses fut fondée non par Paul mais par Épaphras, un Colossien, de qui les croyants avaient appris l’Évangile ; beaucoup d’entre eux n’avaient pas vu le visage de Paul. La Lettre aux Colossiens, envoyée au nom de Paul depuis la prison (beaucoup de spécialistes pensent qu’un disciple l’a écrite), parle des croyants de Laodicée et de Hiérapolis, envoie des salutations à Laodicée et demande qu’elle y soit aussi lue. Elle appelle Onésime l’un d’entre eux et transmet un message à Archippe ; et comme la lettre à Philémon salue aussi Archippe, l’Église de la maison de Philémon, à qui Paul renvoya l’esclave Onésime, est généralement située à Colosses."
    - "Tacite note qu’un tremblement de terre ruina Laodicée en 60 apr. J.-C., et l’historien du Ve siècle Orose dit que sous Néron un séisme renversa les trois villes de Laodicée, de Hiérapolis et de Colosses. Colosses survécut comme petite ville ; à l’époque byzantine, ses habitants gagnèrent la pente jusqu’à Chonae, l’actuelle Honaz."
