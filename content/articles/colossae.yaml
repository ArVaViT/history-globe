# Overview article (ADR 0007). Mainstream facts only; the disputed authorship of Colossians is named as such.
id: colossae
place: a4e5a69
title:
  en: "Colossae"
  ru: "Колоссы"
  uk: "Колоси"
  es: "Colosas"
  pt: "Colossos"
  de: "Kolossae"
  fr: "Colosses"
  it: "Colosse"
  pl: "Kolosy"
  nl: "Kolosse"
  cs: "Kolosy"
  sv: "Kolossai"
  nb: "Kolossai"
body:
  en:
    - "Colossae lay in the valley of the Lycus in south-western Phrygia, at the foot of Mount Cadmus near today's Honaz in Turkey, about 15 km up the valley from Laodicea and 20 km from Hierapolis. Its mound was never systematically explored until Pamukkale University began surface surveys in 2021; excavation started only in 2025. Herodotus says that Xerxes, marching against Greece in 481 BC, came to Colossae, a great Phrygian city at the place where the Lycus disappears into a chasm and flows underground. In 401 BC the younger Cyrus halted at Colossae for seven days, and Xenophon calls it an inhabited city, prosperous and large."
    - "In the Hellenistic and Roman periods the nearby cities of Laodicea and Hierapolis grew and overshadowed it. Strabo counts Colossae among the small towns around Laodicea and Apameia, though it was known for its wool and for a dye named after the city."
    - "The church at Colossae seems to have been founded not by Paul but by Epaphras, a Colossian, from whom the believers had learned the gospel; many of them had not seen Paul's face. The Letter to the Colossians, sent in Paul's name from prison (many scholars hold that a disciple wrote it), speaks of the believers of Laodicea and Hierapolis, sends greetings to Laodicea and asks that it be read there too. It calls Onesimus one of them and sends a message to Archippus, and since the letter to Philemon greets Archippus as well, the house church of Philemon, to whom Paul sent the slave Onesimus back, is usually placed at Colossae."
    - "Tacitus records that an earthquake laid Laodicea in ruins in AD 60, and the fifth-century historian Orosius says that under Nero an earthquake overthrew the three cities of Laodicea, Hierapolis and Colossae. Colossae lived on as a small town; in the Byzantine period its people moved up the slope to Chonae, the modern Honaz."
  ru:
    - "Колоссы лежали в долине Лика на юго-западе Фригии, у подножия горы Кадм близ нынешнего турецкого Хоназа, примерно в 15 км выше по долине от Лаодикии и в 20 км от Иераполя. Их холм никогда систематически не исследовался, пока в 2021 г. Памуккальский университет не начал там поверхностные обследования; раскопки начались лишь в 2025 г. Геродот пишет, что Ксеркс, идя на Грецию в 481 г. до н. э., пришёл в Колоссы, большой фригийский город на том месте, где Лик уходит в расселину и течёт под землёй. В 401 г. до н. э. Кир Младший простоял в Колоссах семь дней, и Ксенофонт называет их населённым городом, богатым и большим."
    - "В эллинистическую и римскую эпохи соседние Лаодикия и Иераполь выросли и затмили их. Страбон относит Колоссы к небольшим городкам вокруг Лаодикии и Апамеи, хотя они славились шерстью и краской, названной по имени города."
    - "Церковь в Колоссах, по-видимому, основал не Павел, а Епафрас, сам колоссянин, от которого верующие научились Евангелию; многие из них не видели лица Павла. Послание к Колоссянам, отправленное от имени Павла из уз (многие учёные считают, что его написал ученик), упоминает верующих Лаодикии и Иераполя, передаёт приветствие Лаодикии и просит прочитать его и там. Оно называет Онисима одним из них и передаёт слово Архиппу, а так как послание к Филимону тоже приветствует Архиппа, домашнюю церковь Филимона, к которому Павел отослал раба Онисима, обычно помещают в Колоссах."
    - "Тацит сообщает, что в 60 г. н. э. землетрясение разрушило Лаодикию, а историк V века Орозий пишет, что при Нероне землетрясение повергло три города — Лаодикию, Иераполь и Колоссы. Колоссы продолжали существовать как небольшой город; в византийскую эпоху их жители переселились выше по склону, в Хоны, нынешний Хоназ."
  uk:
    - "Колоси лежали в долині Ліка в південно-західній Фрігії, біля підніжжя гори Кадм поряд із сьогоднішнім Хоназом у Туреччині, приблизно за 15 км угору по долині від Лаодікеї та за 20 км від Ієраполіса. Його горб ніколи систематично не досліджували, аж поки 2021 р. Памуккальський університет не почав там поверхневі обстеження; розкопки почалися лише 2025 р. Геродот каже, що Ксеркс, виступаючи проти Еллади в 481 р. до н. е., прийшов до Колос, великого фрігійського міста на місці, де Лік зникає в проваллі й тече під землею. У 401 р. до н. е. Кір Молодший зупинився в Колосах на сім днів, і Ксенофонт називає його залюдненим містом, заможним і великим."
    - "В елліністичну й римську добу сусідні міста Лаодікея та Ієраполіс розрослися й затьмарили його. Страбон зараховує Колоси до малих міст навколо Лаодікеї та Апамеї, хоча воно було відоме своєю вовною та барвником, названим на честь міста."
    - "Церкву в Колосах, схоже, заснував не Павло, а Епафрас, колосянин, від якого віруючі навчилися євангелії; багато з них не бачили Павлового обличчя. Послання до колосян, надіслане від імені Павла з в'язниці (багато вчених вважають, що його написав учень), говорить про віруючих Лаодікеї та Ієраполіса, передає вітання в Лаодікею й просить, щоб його прочитали й там. Воно називає Онисима одним із них і передає настанову Архипові, а що послання до Филимона вітає й Архипа, то домову церкву Филимона, до якого Павло відіслав назад раба Онисима, зазвичай розміщують у Колосах."
    - "Тацит повідомляє, що землетрус зруйнував Лаодікею в 60 р. н. е., а історик V ст. Орозій каже, що за Нерона землетрус повалив три міста — Лаодікею, Ієраполіс і Колоси. Колоси жили далі як мале місто; у візантійський період його мешканці перебралися вгору по схилу до Хон, сучасного Хоназа."
  es:
    - "Colosas se hallaba en el valle del Lico, en el suroeste de Frigia, al pie del monte Cadmo, cerca de la actual Honaz, en Turquía, a unos 15 km valle arriba de Laodicea y a 20 km de Hierápolis. Su montículo nunca se exploró sistemáticamente hasta que la Universidad de Pamukkale inició prospecciones de superficie en 2021; la excavación comenzó solo en 2025. Heródoto dice que Jerjes, al marchar contra Grecia en el 481 a. C., llegó a Colosas, una gran ciudad frigia en el lugar donde el Lico desaparece en una sima y fluye bajo tierra. En el 401 a. C. Ciro el Joven se detuvo en Colosas siete días, y Jenofonte la llama una ciudad habitada, próspera y grande."
    - "En las épocas helenística y romana, las cercanas ciudades de Laodicea y Hierápolis crecieron y la eclipsaron. Estrabón cuenta Colosas entre las pequeñas poblaciones en torno a Laodicea y Apamea, aunque era conocida por su lana y por un tinte que llevaba el nombre de la ciudad."
    - "La iglesia de Colosas no fue fundada, al parecer, por Pablo sino por Epafras, colosense, de quien los creyentes habían aprendido el Evangelio; muchos de ellos no habían visto el rostro de Pablo. La Carta a los Colosenses, enviada en nombre de Pablo desde la cárcel (muchos estudiosos sostienen que la escribió un discípulo), habla de los creyentes de Laodicea y de Hierápolis, envía saludos a Laodicea y pide que se lea también allí. Llama a Onésimo uno de ellos y envía un mensaje a Arquipo, y como la carta a Filemón saluda también a Arquipo, la iglesia doméstica de Filemón, a quien Pablo devolvió al esclavo Onésimo, suele situarse en Colosas."
    - "Tácito registra que un terremoto redujo Laodicea a ruinas en el 60 d. C., y el historiador del siglo V Orosio dice que bajo Nerón un terremoto derribó las tres ciudades de Laodicea, Hierápolis y Colosas. Colosas siguió viviendo como una pequeña población; en el periodo bizantino sus habitantes se trasladaron ladera arriba a Chonas, la moderna Honaz."
  pt:
    - "Colossos ficava no vale do Lico, no sudoeste da Frígia, ao pé do monte Cadmo, perto da atual Honaz, na Turquia, cerca de 15 km vale acima de Laodiceia e 20 km de Hierápolis. Seu monte nunca foi explorado sistematicamente até que a Universidade de Pamukkale iniciou prospecções de superfície em 2021; a escavação só começou em 2025. Heródoto diz que Xerxes, marchando contra a Grécia em 481 a.C., chegou a Colossos, grande cidade frígia no lugar onde o Lico desaparece numa fenda e corre sob a terra. Em 401 a.C., Ciro, o Jovem, deteve-se em Colossos por sete dias, e Xenofonte a chama de cidade habitada, próspera e grande."
    - "Nas épocas helenística e romana, as cidades vizinhas de Laodiceia e Hierápolis cresceram e a ofuscaram. Estrabão conta Colossos entre as pequenas cidades em torno de Laodiceia e Apameia, embora fosse conhecida por sua lã e por um corante que tinha o nome da cidade."
    - "A igreja de Colossos parece ter sido fundada não por Paulo, mas por Epafras, um colossense, de quem os crentes haviam aprendido o Evangelho; muitos deles não tinham visto o rosto de Paulo. A Carta aos Colossenses, enviada em nome de Paulo da prisão (muitos estudiosos sustentam que um discípulo a escreveu), fala dos crentes de Laodiceia e Hierápolis, envia saudações a Laodiceia e pede que seja lida lá também. Chama Onésimo de um dos seus e envia uma mensagem a Arquipo, e como a carta a Filemom também saúda Arquipo, a igreja doméstica de Filemom, a quem Paulo devolveu o escravo Onésimo, costuma ser situada em Colossos."
    - "Tácito registra que um terremoto arruinou Laodiceia em 60 d.C., e o historiador do século V Orósio diz que, sob Nero, um terremoto derrubou as três cidades de Laodiceia, Hierápolis e Colossos. Colossos sobreviveu como pequena cidade; no período bizantino, seu povo mudou-se encosta acima para Chonae, a moderna Honaz."
  de:
    - "Kolossae lag im Tal des Lykos im Südwesten Phrygiens, am Fuß des Kadmos-Berges beim heutigen Honaz in der Türkei, etwa 15 km talaufwärts von Laodizea und 20 km von Hierapolis. Sein Hügel wurde nie systematisch erforscht, bis die Universität Pamukkale 2021 mit Oberflächenbegehungen begann; Ausgrabungen setzten erst 2025 ein. Herodot sagt, Xerxes sei auf seinem Zug gegen Griechenland 481 v. Chr. nach Kolossae gekommen, einer großen phrygischen Stadt an der Stelle, wo der Lykos in einer Kluft verschwindet und unterirdisch fließt. Im Jahr 401 v. Chr. rastete Kyros der Jüngere sieben Tage in Kolossae, und Xenophon nennt es eine bewohnte, wohlhabende und große Stadt."
    - "In hellenistischer und römischer Zeit wuchsen die nahen Städte Laodizea und Hierapolis und stellten es in den Schatten. Strabon zählt Kolossae zu den kleinen Städten um Laodizea und Apameia, doch war es für seine Wolle und für einen nach der Stadt benannten Farbstoff bekannt."
    - "Die Gemeinde in Kolossae wurde anscheinend nicht von Paulus gegründet, sondern von Epaphras, einem Kolosser, von dem die Gläubigen das Evangelium gelernt hatten; viele von ihnen hatten Paulus nie von Angesicht gesehen. Der Brief an die Kolosser, im Namen des Paulus aus dem Gefängnis gesandt (viele Gelehrte halten einen Schüler für den Verfasser), spricht von den Gläubigen in Laodizea und Hierapolis, sendet Grüße nach Laodizea und bittet, dass er auch dort gelesen werde. Er nennt Onesimus einen der Ihren und richtet eine Botschaft an Archippus, und da der Brief an Philemon auch Archippus grüßt, wird die Hausgemeinde des Philemon, zu dem Paulus den Sklaven Onesimus zurückschickte, gewöhnlich in Kolossae angesetzt."
    - "Tacitus berichtet, dass ein Erdbeben Laodizea im Jahr 60 n. Chr. in Trümmer legte, und der Historiker Orosius aus dem 5. Jahrhundert sagt, unter Nero habe ein Erdbeben die drei Städte Laodizea, Hierapolis und Kolossae zerstört. Kolossae lebte als kleine Stadt weiter; in byzantinischer Zeit zogen seine Bewohner den Hang hinauf nach Chonai, dem heutigen Honaz."
  fr:
    - "Colosses se trouvait dans la vallée du Lycos, dans le sud-ouest de la Phrygie, au pied du mont Cadmos près de l’actuelle Honaz, en Turquie, à environ 15 km en amont de la vallée depuis Laodicée et à 20 km de Hiérapolis. Son tertre n’avait jamais été exploré systématiquement avant que l’université de Pamukkale n’y entreprenne des prospections de surface en 2021 ; les fouilles n’ont commencé qu’en 2025. Hérodote dit que Xerxès, marchant contre la Grèce en 481 av. J.-C., parvint à Colosses, grande ville phrygienne à l’endroit où le Lycos disparaît dans un gouffre et coule sous terre. En 401 av. J.-C., Cyrus le Jeune fit halte sept jours à Colosses, et Xénophon l’appelle une ville peuplée, prospère et grande."
    - "Aux époques hellénistique et romaine, les villes voisines de Laodicée et de Hiérapolis grandirent et la reléguèrent dans l’ombre. Strabon compte Colosses parmi les petites villes des environs de Laodicée et d’Apamée, bien qu’elle fût connue pour sa laine et pour une teinture portant le nom de la ville."
    - "L’Église de Colosses semble avoir été fondée non par Paul mais par Épaphras, un Colossien, de qui les croyants avaient appris l’Évangile ; beaucoup d’entre eux n’avaient pas vu le visage de Paul. La Lettre aux Colossiens, envoyée au nom de Paul depuis la prison (beaucoup de spécialistes pensent qu’un disciple l’a écrite), parle des croyants de Laodicée et de Hiérapolis, envoie des salutations à Laodicée et demande qu’elle y soit aussi lue. Elle appelle Onésime l’un d’entre eux et transmet un message à Archippe ; et comme la lettre à Philémon salue aussi Archippe, l’Église de la maison de Philémon, à qui Paul renvoya l’esclave Onésime, est généralement située à Colosses."
    - "Tacite note qu’un tremblement de terre ruina Laodicée en 60 apr. J.-C., et l’historien du Ve siècle Orose dit que sous Néron un séisme renversa les trois villes de Laodicée, de Hiérapolis et de Colosses. Colosses survécut comme petite ville ; à l’époque byzantine, ses habitants gagnèrent la pente jusqu’à Chonae, l’actuelle Honaz."
  it:
    - "Colosse sorgeva nella valle del Lico, nella Frigia sud-occidentale, ai piedi del Monte Cadmo presso l’odierna Honaz in Turchia, a circa 15 km a monte di Laodicea e a 20 km da Gerapoli. Il suo tell non fu mai esplorato sistematicamente finché l’Università di Pamukkale non vi avviò ricognizioni di superficie nel 2021; gli scavi sono iniziati solo nel 2025. Erodoto dice che Serse, marciando contro la Grecia nel 481 a.C., giunse a Colosse, grande città frigia nel punto in cui il Lico scompare in una voragine e scorre sottoterra. Nel 401 a.C. Ciro il Giovane sostò a Colosse sette giorni, e Senofonte la chiama città abitata, prospera e grande."
    - "In epoca ellenistica e romana le vicine Laodicea e Gerapoli crebbero e la oscurarono. Strabone annovera Colosse fra le piccole città attorno a Laodicea e Apamea, benché fosse nota per la sua lana e per una tintura che prendeva nome dalla città."
    - "La chiesa di Colosse fu fondata, a quanto pare, non da Paolo ma da Epafra, un colossese, da cui i credenti avevano appreso il Vangelo; molti di loro non avevano visto il volto di Paolo. La Lettera ai Colossesi, inviata in nome di Paolo dal carcere (molti studiosi ritengono che l’abbia scritta un discepolo), parla dei credenti di Laodicea e di Gerapoli, manda saluti a Laodicea e chiede che sia letta anche là. Chiama Onesimo uno di loro e manda un messaggio ad Archippo, e poiché la lettera a Filemone saluta anch’essa Archippo, la chiesa domestica di Filemone, cui Paolo rimandò lo schiavo Onesimo, si colloca di solito a Colosse."
    - "Tacito registra che un terremoto ridusse in rovina Laodicea nel 60 d.C., e lo storico del V secolo Orosio dice che sotto Nerone un terremoto abbatté le tre città di Laodicea, Gerapoli e Colosse. Colosse sopravvisse come piccola città; in epoca bizantina i suoi abitanti salirono lungo il pendio fino a Chonae, l’odierna Honaz."
  pl:
    - "Kolosy leżały w dolinie Likosu w południowo-zachodniej Frygii, u stóp góry Kadmos, koło dzisiejszego Honaz w Turcji, około 15 km w górę doliny od Laodycei i 20 km od Hierapolis. Kopca tego miasta nigdy systematycznie nie badano, dopóki Uniwersytet Pamukkale nie rozpoczął tam w 2021 r. badań powierzchniowych; wykopaliska ruszyły dopiero w 2025 r. Herodot mówi, że Kserkses, maszerując na Grecję w 481 r. p.n.e., przybył do Kolosów, wielkiego miasta frygijskiego w miejscu, gdzie Likos znika w rozpadlinie i płynie pod ziemią. W 401 r. p.n.e. Cyrus Młodszy zatrzymał się w Kolosach na siedem dni, a Ksenofont nazywa je miastem zamieszkanym, zamożnym i wielkim."
    - "W okresie hellenistycznym i rzymskim pobliskie miasta Laodycea i Hierapolis rosły i zasłoniły je. Strabon zalicza Kolosy do małych miast wokół Laodycei i Apamei, choć znane były z wełny i z barwnika nazwanego od miasta."
    - "Kościół w Kolosach założył, jak się zdaje, nie Paweł, lecz Epafras, Kolosanin, od którego wierzący nauczyli się ewangelii; wielu z nich nie widziało twarzy Pawła. List do Kolosan, wysłany w imieniu Pawła z więzienia (wielu uczonych sądzi, że napisał go uczeń), mówi o wierzących w Laodycei i Hierapolis, przesyła pozdrowienia do Laodycei i prosi, by został tam również odczytany. Nazywa Onezyma jednym z nich i przesyła wiadomość do Archipa, a ponieważ list do Filemona pozdrawia także Archipa, kościół domowy Filemona, do którego Paweł odesłał niewolnika Onezyma, umieszcza się zwykle w Kolosach."
    - "Tacyt zapisuje, że trzęsienie ziemi obróciło Laodyceę w ruinę w 60 r. n.e., a historyk z V w. Orozjusz mówi, że za Nerona trzęsienie ziemi zniszczyło trzy miasta: Laodyceę, Hierapolis i Kolosy. Kolosy przetrwały jako małe miasteczko; w okresie bizantyjskim jego mieszkańcy przenieśli się wyżej na zboczu do Chonai, dzisiejszego Honaz."
  nl:
    - "Kolosse lag in het dal van de Lycus in het zuidwesten van Frygië, aan de voet van de Kadmosberg bij het huidige Honaz in Turkije, ongeveer 15 km stroomopwaarts van Laodicea en 20 km van Hiërapolis. De heuvel werd nooit systematisch onderzocht tot de Universiteit van Pamukkale er in 2021 met oppervlakteonderzoek begon; pas in 2025 begonnen de opgravingen. Herodotus zegt dat Xerxes, op weg tegen Griekenland in 481 v.Chr., in Kolosse kwam, een grote Frygische stad op de plaats waar de Lycus in een kloof verdwijnt en ondergronds stroomt. In 401 v.Chr. bleef Cyrus de Jongere zeven dagen in Kolosse, en Xenophon noemt het een bewoonde stad, welvarend en groot."
    - "In de hellenistische en Romeinse tijd groeiden de nabijgelegen steden Laodicea en Hiërapolis en wierpen hun schaduw over Kolosse. Strabo rekent Kolosse tot de kleine steden rond Laodicea en Apameia, al stond het bekend om zijn wol en om een verf die naar de stad was genoemd."
    - "De gemeente van Kolosse werd blijkbaar niet door Paulus gesticht maar door Epafras, een Kolossenzer, van wie de gelovigen het evangelie hadden geleerd; velen van hen hadden Paulus' gezicht niet gezien. De Brief aan de Kolossenzen, in Paulus' naam vanuit de gevangenis gezonden (vele geleerden menen dat een leerling hem schreef), spreekt over de gelovigen van Laodicea en Hiërapolis, zendt groeten aan Laodicea en vraagt dat de brief ook daar wordt voorgelezen. Hij noemt Onesimus een van hen en zendt een boodschap aan Archippus, en aangezien de brief aan Filemon ook Archippus groet, wordt de huiskerk van Filemon, aan wie Paulus de slaaf Onesimus terugzond, gewoonlijk in Kolosse geplaatst."
    - "Tacitus meldt dat een aardbeving Laodicea in 60 n.Chr. in puin legde, en de vijfdeeuwse geschiedschrijver Orosius zegt dat onder Nero een aardbeving de drie steden Laodicea, Hiërapolis en Kolosse omver wierp. Kolosse bleef voortbestaan als een kleine stad; in de Byzantijnse tijd trokken de bewoners de helling op naar Chonae, het moderne Honaz."
  cs:
    - "Kolosy ležely v údolí Lyku v jihozápadní Frygii, na úpatí hory Kadmos u dnešního Honazu v Turecku, asi 15 km proti proudu údolí od Laodikeie a 20 km od Hierapole. Jejich pahorek nebyl nikdy soustavně zkoumán, dokud tam Univerzita Pamukkale roku 2021 nezahájila povrchové průzkumy; vykopávky začaly teprve roku 2025. Hérodotos praví, že Xerxes, táhnoucí roku 481 př. n. l. proti Řecku, přišel ke Kolosům, velkému frygickému městu v místě, kde Lykos mizí v propasti a teče pod zemí. Roku 401 př. n. l. se Kýros Mladší zastavil v Kolosech na sedm dní a Xenofón je nazývá obydleným městem, prosperujícím a velkým."
    - "V helénistickém a římském období rostla blízká města Laodikeia a Hierapolis a zastínila je. Strabón počítá Kolosy mezi malá města kolem Laodikeie a Apameie, ač byly známy svou vlnou a barvivem pojmenovaným po městě."
    - "Církev v Kolosech zřejmě nezaložil Pavel, ale Epafras, Kolosan, od něhož věřící slyšeli evangelium; mnozí z nich Pavla nikdy neviděli tváří v tvář. List Kolosanům, poslaný ve jménu Pavlově z vězení (mnozí badatelé míní, že jej napsal žák), mluví o věřících v Laodikeii a Hierapoli, posílá pozdravy do Laodikeie a žádá, aby byl přečten i tam. Nazývá Onésima jedním z nich a posílá vzkaz Archippovi, a protože i list Filemonovi zdraví Archippa, klade se domácí církev Filemonova, k němuž Pavel poslal zpět otroka Onésima, obvykle do Kolos."
    - "Tacitus zaznamenává, že zemětřesení roku 60 n. l. obrátilo Laodikeii v ruiny, a historik 5. století Orosius praví, že za Nerona zemětřesení zničilo tři města Laodikeii, Hierapolis a Kolosy. Kolosy žily dál jako malé městečko; v byzantském období se jeho obyvatelé přesunuli po svahu nahoru do Chonai, dnešního Honazu."
  sv:
    - "Kolossai låg i Lykosdalen i sydvästra Frygien, vid foten av Kadmosberget nära dagens Honaz i Turkiet, omkring 15 km uppför dalen från Laodikeia och 20 km från Hierapolis. Dess kulle utforskades aldrig systematiskt förrän Pamukkale-universitetet började ytinventeringar 2021; utgrävningen började först 2025. Herodotos säger att Xerxes, som tågade mot Grekland 481 f.Kr., kom till Kolossai, en stor frygisk stad där Lykos försvinner i en klyfta och rinner under jorden. År 401 f.Kr. stannade Kyros den yngre i Kolossai i sju dagar, och Xenofon kallar den en bebodd stad, välmående och stor."
    - "Under hellenistisk och romersk tid växte de närbelägna städerna Laodikeia och Hierapolis och kastade den i skuggan. Strabon räknar Kolossai bland småstäderna kring Laodikeia och Apameia, fast den var känd för sin ull och för ett färgämne uppkallat efter staden."
    - "Församlingen i Kolossai tycks ha grundats inte av Paulus utan av Epafras, en kolossaier, av vilken de troende hade lärt sig evangeliet; många av dem hade inte sett Paulus ansikte. Kolosserbrevet, sänt i Paulus namn från fängelse (många forskare anser att en lärjunge skrev det), talar om de troende i Laodikeia och Hierapolis, sänder hälsningar till Laodikeia och ber att det också ska läsas där. Det kallar Onesimos en av dem och sänder ett budskap till Archippos, och eftersom brevet till Filemon också hälsar Archippos förläggs Filemons huskyrka, till vilken Paulus sände slaven Onesimos tillbaka, vanligen till Kolossai."
    - "Tacitus berättar att en jordbävning lade Laodikeia i ruiner år 60 e.Kr., och historieskrivaren Orosius på 400-talet säger att en jordbävning under Nero störtade de tre städerna Laodikeia, Hierapolis och Kolossai. Kolossai levde vidare som en liten stad; under bysantinsk tid flyttade invånarna uppför sluttningen till Chonai, dagens Honaz."
  nb:
    - "Kolossai lå i dalen til Lykos i sørvestlige Frygia, ved foten av Kadmos-fjellet nær dagens Honaz i Tyrkia, omtrent 15 km oppover dalen fra Laodikea og 20 km fra Hierapolis. Haugen ble aldri systematisk undersøkt før Pamukkale University begynte overflateundersøkelser i 2021; utgravning startet først i 2025. Herodot sier at Xerxes, på marsj mot Hellas i 481 f.Kr., kom til Kolossai, en stor frygisk by der Lykos forsvinner i en kløft og renner under jorden. I 401 f.Kr. holdt Kyros den yngre stans i Kolossai i sju dager, og Xenofon kaller den en bebodd by, velstående og stor."
    - "I hellenistisk og romersk tid vokste nabobyene Laodikea og Hierapolis og kastet den i skyggen. Strabon regner Kolossai blant de små byene rundt Laodikea og Apameia, selv om den var kjent for sin ull og for en farge oppkalt etter byen."
    - "Menigheten i Kolossai synes å ha blitt grunnlagt ikke av Paulus, men av Epafras, en kolosser, som de troende hadde lært evangeliet av; mange av dem hadde ikke sett Paulus' ansikt. Kolosserbrevet, sendt i Paulus' navn fra fengsel (mange forskere mener at en disippel skrev det), taler om de troende i Laodikea og Hierapolis, sender hilsen til Laodikea og ber om at det blir lest der også. Det kaller Onesimos en av dem og sender en beskjed til Arkippos, og siden brevet til Filemon også hilser Arkippos, plasseres huskirken til Filemon, som Paulus sendte slaven Onesimos tilbake til, vanligvis i Kolossai."
    - "Tacitus opplyser at et jordskjelv la Laodikea i ruiner i 60 e.Kr., og historikeren Orosius fra 400-tallet sier at et jordskjelv under Nero veltet de tre byene Laodikea, Hierapolis og Kolossai. Kolossai levde videre som en liten by; i bysantinsk tid flyttet folket opp i skråningen til Khonai, dagens Honaz."
