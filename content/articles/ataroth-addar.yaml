body:
  en:
    - "Ataroth-addar is a point on the border between Ephraim and Benjamin, named twice in Joshua and nowhere else. From the side of Ephraim, “the border of their inheritance on the east side was Ataroth-addar, unto Beth-horon the upper”; from the side of Benjamin, the line came down from Bethel “to Ataroth-adar, near the hill that lieth on the south side of the nether Beth-horon”. Ataroth means “crowns” or “enclosures”, a common place name, and the border of Ephraim also has a plain Ataroth, which may or may not be the same place."
    - "Where it lay is not settled, and the two verses seem to pull apart: one sets it at the eastern end of the line near Bethel, the other near Lower Beth-horon to the west. Candidates include Khirbet Atara, by the modern Atarot north of Jerusalem, which keeps the name; Khirbet Raddana near el-Bireh, an Iron Age village excavated in 1969 to 1974; and Tell en-Nasbeh, the likely Mizpah. None is certain, and nothing more is known of the place. The area is today the hills between Jerusalem and Ramallah."
  ru:
    - "Атароф-Адар — точка на границе между Ефремом и Вениамином, дважды названная в книге Иисуса Навина и больше нигде. Со стороны Ефрема «от востока пределом удела их был Атароф-Адар до Беф-Орона верхнего»; со стороны Вениамина предел шёл от Вефиля и «нисходит предел к Атароф-Адару, к горе, которая на южной стороне Беф-Орона нижнего». Атароф значит «венцы» или «ограды», это обычное название места, и на границе Ефрема есть ещё просто Атароф, который может быть тем же местом, а может и не быть."
    - "Где он лежал, не установлено, и два стиха как будто расходятся: один ставит его на восточном конце черты близ Вефиля, другой — у нижнего Беф-Орона на западе. Среди кандидатов — Хирбет-Атара у нынешнего Атарота к северу от Иерусалима, сохранившая имя; Хирбет-Раддана близ Эль-Биры, селение железного века, раскопанное в 1969–1974 годах; и Телль-эн-Насбе, вероятная Массифа. Ни одно не достоверно, и больше о месте ничего не известно. Эта местность сегодня — холмы между Иерусалимом и Рамаллой."
  uk:
    - "Атарот-Аддар — точка на кордоні між Єфремом і Веніяміном, названа двічі в книзі Ісуса Навина і ніде більше. З боку Єфрема: «Від сходу була гряниця їх наслїдньої держави Атарот-Аддар аж до верхового Бет-Орону»; з боку Веніяміна лінія спускалася від Бет-Елу: «спадає гряниця до Атарот-Аддару, до гори, що на полуднє від низового Бет-Орона». Атарот означає «вінці» або «огорожі» — поширена назва місця, і на кордоні Єфрема є ще простий Атарот, який може бути тим самим місцем, а може й ні."
    - "Де він лежав, не встановлено, і два вірші ніби тягнуть у різні боки: один ставить його на східному кінці лінії біля Бет-Елу, інший — біля Нижнього Бет-Хорону на заході. Кандидати: Хірбет-Атара біля сучасного Атароту на північ від Єрусалима, що зберігає назву; Хірбет-Раддана біля ель-Бірех, село залізної доби, розкопане в 1969–1974 рр.; і Телль-ен-Насбе, імовірна Міцпа. Жодне не певне, і про це місце більше нічого не відомо. Ця місцевість нині — пагорби між Єрусалимом і Рамаллою."
  es:
    - "Atarot-adar es un punto de la frontera entre Efraín y Benjamín, nombrado dos veces en Josué y en ningún otro lugar. Desde el lado de Efraín, «fué el término de su herencia á la parte oriental, desde Ataroth-addar hasta Beth-oron la de arriba»; desde el lado de Benjamín, la línea bajaba desde Betel «de Ataroth-addar al monte que está al mediodía de Beth-oron la de abajo». Atarot significa «coronas» o «recintos», un nombre de lugar común, y la frontera de Efraín tiene también un simple Atarot, que puede o no ser el mismo lugar."
    - "No está establecido dónde estuvo, y los dos versículos parecen tirar en direcciones opuestas: uno lo sitúa en el extremo oriental de la línea, cerca de Betel, el otro cerca de Bet-horón de Abajo, al oeste. Los candidatos incluyen Khirbet Atara, junto a la moderna Atarot, al norte de Jerusalén, que conserva el nombre; Khirbet Raddana, cerca de el-Bireh, una aldea de la edad del Hierro excavada de 1969 a 1974; y Tell en-Nasbeh, la probable Mizpa. Ninguno es seguro, y nada más se sabe del lugar. La zona son hoy las colinas entre Jerusalén y Ramala."
  pt:
    - "Atarote-Adar é um ponto na fronteira entre Efraim e Benjamim, nomeado duas vezes em Josué e em nenhum outro lugar. Do lado de Efraim, “A fronteira da sua herança para o leste era Atarote-Adar, até Bete-Horom superior”; do lado de Benjamim, a linha descia de Betel: “A fronteira descia para Atarote-Adar, pelo monte que fica ao sul de Bete-Horom Baixa”. Atarote significa “coroas” ou “recintos”, um nome de lugar comum, e a fronteira de Efraim também tem uma simples Atarote, que pode ou não ser o mesmo lugar."
    - "Onde ficava não está assentado, e os dois versículos parecem puxar em direções opostas: um a põe na extremidade oriental da linha, perto de Betel, o outro perto de Bete-Horom de Baixo, a oeste. Os candidatos incluem Khirbet Atara, junto à moderna Atarot, ao norte de Jerusalém, que conserva o nome; Khirbet Raddana, perto de el-Bireh, uma aldeia da Idade do Ferro escavada de 1969 a 1974; e Tell en-Nasbeh, provável Mispá. Nenhum é certo, e nada mais se sabe do lugar. A área é hoje as colinas entre Jerusalém e Ramallah."
  de:
    - "Atarot-Addar ist ein Punkt an der Grenze zwischen Ephraim und Benjamin, zweimal bei Josua genannt und sonst nirgends. Von der Seite Ephraims „war die Grenze ihres Erbteils aufgangwärts Ataroth-Adar bis zum obern Beth-Horon“; von der Seite Benjamins kam die Linie von Bethel her „hinab gen Ataroth-Adar an den Berg, der gegen Mittag liegt von dem niederen Beth-Horon“. Atarot bedeutet „Kronen“ oder „Gehege“, ein häufiger Ortsname, und die Grenze Ephraims hat auch ein schlichtes Atarot, das derselbe Ort sein kann oder nicht."
    - "Wo es lag, ist nicht entschieden, und die beiden Verse scheinen auseinanderzustreben: Einer setzt es ans Ostende der Linie nahe Bethel, der andere nahe dem Unteren Bet-Horon im Westen. Kandidaten sind Chirbet Atara beim heutigen Atarot nördlich von Jerusalem, das den Namen bewahrt; Chirbet Raddana bei el-Bire, ein von 1969 bis 1974 ausgegrabenes eisenzeitliches Dorf; und Tell en-Nasbe, das wahrscheinliche Mizpa. Keiner ist sicher, und mehr ist über den Ort nicht bekannt. Das Gebiet sind heute die Berge zwischen Jerusalem und Ramallah."
  fr:
    - "Atharoth-Addar est un point de la frontière entre Éphraïm et Benjamin, nommé deux fois dans Josué et nulle part ailleurs. Du côté d’Éphraïm, « La limite de leur héritage était, à l’orient, Atharoth-Addar jusqu’à Beth-Horon la haute » ; du côté de Benjamin, la ligne descendait de Béthel « à Atharoth-Addar par-dessus la montagne qui est au midi de Beth-Horon la basse ». Atharoth signifie « couronnes » ou « enclos », nom de lieu courant, et la frontière d’Éphraïm comporte aussi un simple Atharoth, qui peut ou non être le même lieu."
    - "Son emplacement n’est pas fixé, et les deux versets semblent tirer en sens contraire : l’un le met à l’extrémité orientale de la ligne près de Béthel, l’autre près de Beth-Horon la basse, à l’ouest. Parmi les candidats figurent Khirbet Atara, près de l’actuelle Atarot au nord de Jérusalem, qui garde le nom ; Khirbet Raddana près d’el-Bireh, village de l’âge du Fer fouillé de 1969 à 1974 ; et Tell en-Nasbeh, probable Mitspa. Aucun n’est certain, et l’on ne sait rien de plus du lieu. La région est aujourd’hui celle des collines entre Jérusalem et Ramallah."
  it:
    - "Atarot-Addar è un punto sul confine tra Efraim e Beniamino, nominato due volte in Giosuè e in nessun altro luogo. Dal lato di Efraim, «Il confine della loro eredità era, a oriente, Atharoth-Addar, fino a Beth-Horon disopra»; dal lato di Beniamino, la linea scendeva da Betel «ad Ataroth-Addar, presso il monte che è a mezzogiorno di Beth-Horon disotto». Atarot significa «corone» o «recinti», un nome di luogo comune, e il confine di Efraim ha anche un semplice Atarot, che può essere o non essere lo stesso luogo."
    - "Dove sorgesse non è stabilito, e i due versetti sembrano divergere: uno lo pone all’estremità orientale della linea presso Betel, l’altro presso Bet-Oron di sotto, a ovest. I candidati comprendono Khirbet Atara, presso l’odierna Atarot a nord di Gerusalemme, che conserva il nome; Khirbet Raddana presso el-Bireh, un villaggio dell’età del Ferro scavato nel 1969–1974; e Tell en-Nasbeh, la probabile Mizpa. Nessuno è certo, e nulla più si sa del luogo. La zona è oggi costituita dalle colline tra Gerusalemme e Ramallah."
  pl:
    - "Atarot-Addar to punkt na granicy między Efraimem a Beniaminem, wymieniony dwukrotnie u Jozuego i nigdzie indziej. Od strony Efraima „była granica dziedzictwa ich na wschód słońca od Attarot Adar aż do Bet Horon wyższego”; od strony Beniamina linia schodziła od Betel: „a puszcza się ta granica do Attarot Adar podle góry, która jest od południa Betoron dolnego”. Atarot znaczy „korony” lub „ogrodzenia”, to częsta nazwa miejscowa, a na granicy Efraima jest też zwykłe Atarot, które może być tym samym miejscem lub nie."
    - "Gdzie leżało, nie jest ustalone, a dwa wersety zdają się ciągnąć w przeciwne strony: jeden umieszcza je na wschodnim końcu linii koło Betel, drugi koło Dolnego Bet-Choron na zachodzie. Kandydaci to Chirbet Atara, obok dzisiejszego Atarot na północ od Jerozolimy, które zachowuje nazwę; Chirbet Raddana koło el-Bire, wieś z epoki żelaza wykopywana w latach 1969–1974; i Tell en-Nasbeh, prawdopodobna Mispa. Żaden nie jest pewny i nic więcej o miejscu nie wiadomo. Okolica to dziś wzgórza między Jerozolimą a Ramallah."
  nl:
    - "Atarot-Addar is een punt op de grens tussen Efraïm en Benjamin, tweemaal genoemd in Jozua en nergens anders. Vanaf de kant van Efraïm: “de landpale huns erfdeels was oostwaarts Atroth-Addar tot aan het bovenste Beth-Horon”; vanaf de kant van Benjamin kwam de lijn van Bethel af “naar Atroth-Addar, aan den berg, die aan de zuidzijde van het benedenste Beth-Horon is”. Atarot betekent “kronen” of “omheiningen”, een veelvoorkomende plaatsnaam, en de grens van Efraïm heeft ook een eenvoudig Atarot, dat al dan niet dezelfde plaats is."
    - "Waar het lag, is niet vastgesteld, en de twee verzen lijken uiteen te lopen: het ene plaatst het aan het oostelijke eind van de lijn bij Bethel, het andere bij Neder-Beth-Horon in het westen. Kandidaten zijn Khirbet Atara, bij het moderne Atarot ten noorden van Jeruzalem, dat de naam bewaart; Khirbet Raddana bij el-Bireh, een ijzertijddorp dat in 1969 tot 1974 werd opgegraven; en Tell en-Nasbeh, het waarschijnlijke Mizpa. Geen is zeker, en meer is van de plaats niet bekend. Het gebied is nu het heuvelland tussen Jeruzalem en Ramallah."
  cs:
    - "Atarót-addar je bod na hranici mezi Efrajimem a Benjamínem, jmenovaný dvakrát v Jozue a nikde jinde. Ze strany Efrajimovy „byla meze dědictví jejich na východ, od Atarot Addar až do Betoron vrchního“; ze strany Benjamínovy vedla čára od Bét-elu: „chýlí se ta meze do Atarot Addar vedlé hory, kteráž jest od poledne Betoron dolního“. Atarót znamená „koruny“ nebo „ohrady“, je to běžné místní jméno, a hranice Efrajimova má také prosté Atarót, které může a nemusí být týmž místem."
    - "Kde ležel, není vyřešeno a oba verše se zdají táhnout různými směry: jeden jej klade na východní konec čáry poblíž Bét-elu, druhý poblíž Dolního Bét-choronu na západě. Kandidáti zahrnují Chirbet Atara u moderního Atarotu severně od Jeruzaléma, která jméno uchovává; Chirbet Raddana poblíž el-Bireh, vesnici z doby železné vykopávanou v letech 1969 až 1974; a Tell en-Nasbeh, pravděpodobnou Micpu. Žádný není jistý a o místě se neví nic víc. Oblast je dnes pahorkatina mezi Jeruzalémem a Rámalláhem."
