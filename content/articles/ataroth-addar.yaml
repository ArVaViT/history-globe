# Overview article (ADR 0007). Mainstream facts only; a border point known from two verses; the candidate sites are given without choosing one.
id: ataroth-addar
place: a2bf0f8
title:
  en: "Ataroth-addar"
  ru: "Атароф-Адар"
body:
  en:
    - "Ataroth-addar is a point on the border between Ephraim and Benjamin, named twice in Joshua and nowhere else. From the side of Ephraim, “the border of their inheritance on the east side was Ataroth-addar, unto Beth-horon the upper”; from the side of Benjamin, the line came down from Bethel “to Ataroth-adar, near the hill that lieth on the south side of the nether Beth-horon”. Ataroth means “crowns” or “enclosures”, a common place name, and the border of Ephraim also has a plain Ataroth, which may or may not be the same place."
    - "Where it lay is not settled, and the two verses seem to pull apart: one sets it at the eastern end of the line near Bethel, the other near Lower Beth-horon to the west. Candidates include Khirbet Atara, by the modern Atarot north of Jerusalem, which keeps the name; Khirbet Raddana near el-Bireh, an Iron Age village excavated in 1969 to 1974; and Tell en-Nasbeh, the likely Mizpah. None is certain, and nothing more is known of the place. The area is today the hills between Jerusalem and Ramallah."
  ru:
    - "Атароф-Адар — точка на границе между Ефремом и Вениамином, дважды названная в книге Иисуса Навина и больше нигде. Со стороны Ефрема «от востока пределом удела их был Атароф-Адар до Беф-Орона верхнего»; со стороны Вениамина предел шёл от Вефиля и «нисходит предел к Атароф-Адару, к горе, которая на южной стороне Беф-Орона нижнего». Атароф значит «венцы» или «ограды», это обычное название места, и на границе Ефрема есть ещё просто Атароф, который может быть тем же местом, а может и не быть."
    - "Где он лежал, не установлено, и два стиха как будто расходятся: один ставит его на восточном конце черты близ Вефиля, другой — у нижнего Беф-Орона на западе. Среди кандидатов — Хирбет-Атара у нынешнего Атарота к северу от Иерусалима, сохранившая имя; Хирбет-Раддана близ Эль-Биры, селение железного века, раскопанное в 1969–1974 годах; и Телль-эн-Насбе, вероятная Массифа. Ни одно не достоверно, и больше о месте ничего не известно. Эта местность сегодня — холмы между Иерусалимом и Рамаллой."
scripture:
  - Josh.16.2
  - Josh.16.5
  - Josh.18.13
sources:
