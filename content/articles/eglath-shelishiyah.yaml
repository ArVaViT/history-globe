body:
  en:
    - "Eglath-shelishiyah is a name that may not be a place at all. In Isaiah's oracle on Moab, as the fugitives flee toward Zoar, the Hebrew reads eglat shelishiyah, which can be “a third Eglath” or “a heifer of three years”; the same two words recur in Jeremiah's parallel oracle after Zoar and Horonaim. The Septuagint in Isaiah and the King James Version in both places take them as an image, “an heifer of three years old”, while the Septuagint in Jeremiah keeps them as a name, Aglath-salisia; the Synodal Russian, the Revised Standard Version and many modern translations read a town, “Eglath-shelishiyah”, perhaps “the third Eglath”, so named to distinguish it from others of the name, somewhere in southern Moab."
    - "If it is a town, nothing is known of it beyond its company in the two verses: Zoar, the ascent of Luhith and the road to Horonaim, all in the south of Moab toward the Dead Sea, where Luhith and Horonaim are themselves unlocated. No ruin bears the name, and the map places it near Zoar only on that company. It is one of the least known names in the Bible, and honest maps mark it with a question."
  ru:
    - "Третья Эгла — имя, которое, возможно, вовсе не обозначает места. В пророчестве Исаии о Моаве, где беглецы бегут к Сигору, еврейский текст читает «эглат шелишия», что можно понять как «третья Эгла» или как «трёхлетняя телица»; те же два слова повторяются в параллельном пророчестве Иеремии после Сигора и Оронаима. Септуагинта у Исаии и английская Библия короля Иакова в обоих местах понимают их как образ — трёхлетняя телица, тогда как Септуагинта у Иеремии оставляет имя — Аглаф-Салисия; Синодальный перевод, английская Пересмотренная стандартная версия и многие современные переводы читают город: беглецы бегут «до третьей Эглы», названной так, быть может, в отличие от других Эгл, где-то на юге Моава."
    - "Если это город, о нём неизвестно ничего, кроме соседей по двум стихам: Сигор, подъём на Лухит и дорога на Оронаим, всё на юге Моава у Мёртвого моря, причём Лухит и Оронаим и сами не найдены. Ни одна развалина не носит его имени, и карта помещает его близ Сигора лишь по этому соседству. Это одно из наименее известных имён в Библии, и честные карты ставят рядом с ним вопросительный знак."
  uk:
    - "Третя Егла — назва, яка, можливо, взагалі не є місцем. В оракулі Ісаї про Моав, коли втікачі біжать до Сігору, єврейське еглат шелішія може означати «третя Егла» або «трирічна телиця»; ті самі два слова повторюються в паралельному оракулі Єремії після Сігору та Хоронаїму. Септуагінта в Ісаї та переклад короля Якова в обох місцях беруть їх як образ, «трирічна телиця», тоді як Септуагінта в Єремії зберігає їх як назву, Аглат-Саліса; Синодальний російський переклад, Revised Standard Version і багато сучасних перекладів читають місто, «третя Егла», можливо, так названу, щоб відрізнити її від інших з тією самою назвою, десь на півдні Моаву."
    - "Якщо це місто, про нього нічого не відомо, крім його товариства в двох віршах: Сігор, підйом Лухіт і дорога до Хоронаїму, усе на півдні Моаву в напрямку Мертвого моря, де Лухіт і Хоронаїм самі не локалізовані. Жодні руїни не носять цієї назви, і мапа розташовує її біля Сігору лише з цього товариства. Це одна з найменш відомих назв у Біблії, і чесні мапи позначають її знаком питання."
  es:
    - "Eglat-selisiya es un nombre que quizá no sea un lugar. En el oráculo de Isaías sobre Moab, cuando los fugitivos huyen hacia Zoar, el hebreo dice eglat shelishiyah, que puede ser «una tercera Eglat» o «una novilla de tres años»; las mismas dos palabras reaparecen en el oráculo paralelo de Jeremías, después de Zoar y Horonaim. La Septuaginta en Isaías y la versión King James en ambos lugares las toman como una imagen, «novilla de tres años», mientras que la Septuaginta en Jeremías las conserva como un nombre, Aglath-salisia; la Biblia sinodal rusa, la Versión Estándar Revisada y muchas traducciones modernas leen una ciudad, «Eglat-selisiya», quizá «la tercera Eglat», llamada así para distinguirla de otras del mismo nombre, en algún lugar del sur de Moab."
    - "Si es una ciudad, no se sabe nada de ella más allá de su compañía en los dos versículos: Zoar, la subida de Luhit y el camino de Horonaim, todo en el sur de Moab, hacia el mar Muerto, donde Luhit y Horonaim están ellas mismas sin localizar. Ninguna ruina lleva el nombre, y el mapa la coloca cerca de Zoar solo por esa compañía. Es uno de los nombres menos conocidos de la Biblia, y los mapas honrados lo marcan con una interrogación."
  pt:
    - "Eglate-Selisia é um nome que talvez nem seja um lugar. No oráculo de Isaías sobre Moabe, quando os fugitivos fogem para Zoar, o hebraico lê eglat shelishiyah, que pode ser “uma terceira Eglate” ou “uma novilha de três anos”; as mesmas duas palavras voltam no oráculo paralelo de Jeremias, depois de Zoar e Horonaim. A Septuaginta em Isaías e a King James Version nos dois lugares as tomam como imagem, uma novilha de três anos, enquanto a Septuaginta em Jeremias as mantém como nome, Aglath-salisia; o russo Sinodal, a Revised Standard Version e muitas traduções modernas leem uma cidade, “Eglate-Selisia”, talvez “a terceira Eglate”, assim chamada para distingui-la de outras do mesmo nome, em algum ponto do sul de Moabe."
    - "Se é uma cidade, nada se sabe dela além da companhia em que aparece nos dois versículos: Zoar, a subida de Luíte e o caminho para Horonaim, todos no sul de Moabe, em direção ao Mar Morto, onde Luíte e Horonaim também não foram localizadas. Nenhuma ruína leva o nome, e o mapa a põe perto de Zoar apenas por essa companhia. É um dos nomes menos conhecidos da Bíblia, e mapas honestos o assinalam com uma interrogação."
  de:
    - "Eglat-Schelischija ist ein Name, der vielleicht gar kein Ort ist. In Jesajas Orakel über Moab, als die Flüchtlinge Richtung Zoar fliehen, lautet der hebräische Text eglat schelischija, was „ein drittes Eglat“ oder „eine dreijährige Färse“ heißen kann; dieselben zwei Wörter kehren in Jeremias Parallelorakel nach Zoar und Horonajim wieder. Die Septuaginta bei Jesaja und die King-James-Bibel an beiden Stellen fassen sie als Bild auf, eine dreijährige Färse, während die Septuaginta bei Jeremia sie als Namen beibehält, Aglath-Salisia; die russische Synodalbibel, die Revised Standard Version und viele moderne Übersetzungen lesen eine Stadt, „Eglat-Schelischija“, vielleicht „das dritte Eglat“, so genannt, um sie von anderen gleichen Namens zu unterscheiden, irgendwo im Süden Moabs."
    - "Falls es eine Stadt ist, ist nichts von ihr bekannt außer ihrer Gesellschaft in den beiden Versen: Zoar, der Anstieg nach Luhit und der Weg nach Horonajim, alle im Süden Moabs zum Toten Meer hin, wo Luhit und Horonajim selbst nicht lokalisiert sind. Keine Ruine trägt den Namen, und die Karte setzt ihn nur wegen dieser Gesellschaft in die Nähe von Zoar. Er ist einer der unbekanntesten Namen der Bibel, und ehrliche Karten kennzeichnen ihn mit einem Fragezeichen."
  fr:
    - "Églath-Schelischija est un nom qui n’est peut-être pas du tout un lieu. Dans l’oracle d’Ésaïe sur Moab, tandis que les fugitifs fuient vers Tsoar, l’hébreu porte eglat shelishiyah, qui peut signifier « une troisième Églath » ou « une génisse de trois ans » ; les deux mêmes mots reviennent dans l’oracle parallèle de Jérémie, après Tsoar et Choronaïm. La Septante chez Ésaïe et la version du roi Jacques aux deux endroits y voient une image, « une génisse de trois ans », tandis que la Septante chez Jérémie les garde comme un nom, Aglath-salisia ; la Bible russe synodale, la Revised Standard Version et de nombreuses traductions modernes lisent une ville, « Églath-Schelischija », peut-être « la troisième Églath », ainsi nommée pour la distinguer d’autres du même nom, quelque part dans le sud de Moab."
    - "S’il s’agit d’une ville, on n’en sait rien au-delà de sa compagnie dans les deux versets : Tsoar, la montée de Luchith et le chemin de Choronaïm, tous dans le sud de Moab vers la mer Morte, où Luchith et Choronaïm sont eux-mêmes sans localisation. Aucune ruine ne porte le nom, et la carte la place près de Tsoar sur cette seule compagnie. C’est l’un des noms les moins connus de la Bible, et les cartes honnêtes le marquent d’un point d’interrogation."
  it:
    - "Eglat-Selisia è un nome che forse non è affatto un luogo. Nell’oracolo di Isaia su Moab, mentre i fuggiaschi fuggono verso Soar, l’ebraico legge eglat shelishiyah, che può essere «una terza Eglat» o «una giovenca di tre anni»; le stesse due parole ricorrono nell’oracolo parallelo di Geremia dopo Soar e Coronaim. La Settanta in Isaia e la King James Version in entrambi i luoghi le prendono come un’immagine, una giovenca di tre anni, mentre la Settanta in Geremia le conserva come nome, Aglath-salisia; il russo sinodale, la Revised Standard Version e molte traduzioni moderne vi leggono una città, «Eglath-shelishiyah», forse «la terza Eglat», così chiamata per distinguerla da altre dello stesso nome, da qualche parte nella Moab meridionale."
    - "Se è una città, non se ne sa nulla oltre alla compagnia in cui compare nei due versetti: Soar, la salita di Luchit e la strada di Coronaim, tutti nel sud di Moab verso il Mar Morto, dove Luchit e Coronaim non sono a loro volta localizzate. Nessuna rovina porta il nome, e la mappa la colloca presso Soar solo per questa compagnia. È uno dei nomi meno noti della Bibbia, e le mappe oneste lo segnano con un punto interrogativo."
  pl:
    - "Eglat-Szelisija to nazwa, która może wcale nie być miejscem. W wyroczni Izajasza o Moabie, gdy uciekinierzy uciekają ku Soar, hebrajski tekst ma eglat szelisija, co może znaczyć „trzecia Eglat” albo „trzyletnia jałowica”; te same dwa słowa wracają w paralelnej wyroczni Jeremiasza po Soar i Choronaim. Septuaginta u Izajasza i Biblia Króla Jakuba w obu miejscach rozumieją je jako obraz, „jałowica trzyletnia”, podczas gdy Septuaginta u Jeremiasza zachowuje je jako nazwę, Aglath-salisia; Biblia synodalna, Revised Standard Version i wiele nowoczesnych przekładów odczytuje miasto, „Eglat-Szelisija”, być może „trzecia Eglat”, tak nazwane dla odróżnienia od innych o tej nazwie, gdzieś w południowym Moabie."
    - "Jeśli jest to miasto, nic o nim nie wiadomo poza jego towarzystwem w tych dwóch wersetach: Soar, wzniesieniem Luchit i drogą do Choronaim, wszystkie w południowym Moabie ku Morzu Martwemu, gdzie Luchit i Choronaim same nie są zlokalizowane. Żadna ruina nie nosi tej nazwy, a mapa umieszcza je blisko Soar tylko z racji tego towarzystwa. Jest to jedna z najmniej znanych nazw w Biblii, a uczciwe mapy oznaczają ją znakiem zapytania."
  nl:
    - "Eglat-Selisia is een naam die misschien helemaal geen plaats is. In Jesaja's orakel over Moab, als de vluchtelingen naar Zoar vluchten, staat in het Hebreeuws eglat shelishiyah, wat “een derde Eglat” of “een driejarige vaars” kan zijn; dezelfde twee woorden keren terug in Jeremia's parallelle orakel na Zoar en Choronaïm. De Septuaginta in Jesaja en de King James Version op beide plaatsen vatten ze op als een beeld, “een driejarige vaars”, terwijl de Septuaginta in Jeremia ze als naam bewaart, Aglath-salisia; de Synodale Russische Bijbel, de Revised Standard Version en vele moderne vertalingen lezen een stad, “Eglat-Selisia”, misschien “de derde Eglat”, zo genoemd om haar van andere van die naam te onderscheiden, ergens in zuidelijk Moab."
    - "Als het een stad is, is er niets van bekend buiten haar gezelschap in de twee verzen: Zoar, de opgang van Luchit en de weg naar Choronaïm, allemaal in het zuiden van Moab naar de Dode Zee, waar Luchit en Choronaïm zelf niet gelokaliseerd zijn. Geen ruïne draagt de naam, en de kaart plaatst haar alleen op grond van dat gezelschap bij Zoar. Het is een van de minst bekende namen van de Bijbel, en eerlijke kaarten merken haar met een vraagteken."
  cs:
    - "Eglat-šelišija je jméno, které možná vůbec není místem. V Izajášově věštbě o Moábu, když uprchlíci prchají k Soaru, zní hebrejský text eglat šelišijja, což může být „třetí Eglat“ nebo „tříletá jalovice“; tatáž dvě slova se opakují v Jeremjášově paralelní věštbě po Soaru a Choronajimu. Septuaginta u Izajáše a Bible krále Jakuba na obou místech je berou jako obraz, „jalovice tříletá“, zatímco Septuaginta u Jeremjáše je ponechává jako jméno, Aglath-salisia; synodální ruský text, Revised Standard Version a mnohé moderní překlady čtou město, „Eglat-šelišija“, snad „třetí Eglat“, pojmenované tak na rozlišení od jiných téhož jména, kdesi v jižním Moábu."
    - "Je-li to město, nic se o něm neví kromě jeho společnosti ve dvou verších: Soar, stoupání do Lúchitu a cesta k Choronajimu, vše v jihu Moábu směrem k Mrtvému moři, kde Lúchit i Choronajim jsou samy nelokalizovány. Žádná zřícenina jméno nenese a mapa je klade poblíž Soaru jen na základě této společnosti. Je to jedno z nejméně známých jmen v Bibli a poctivé mapy je označují otazníkem."
  sv:
    - "Eglat-Shelishija är ett namn som kanske inte alls är en plats. I Jesajas utsaga om Moab, när flyktingarna flyr mot Soar, står i den hebreiska texten eglat shelishiyah, vilket kan betyda ”ett tredje Eglat” eller ”en treårig kviga”; samma två ord återkommer i Jeremias parallella utsaga efter Soar och Horonajim. Septuaginta hos Jesaja och King James-bibeln på båda ställena tar dem som en bild, ”an heifer of three years old”, medan Septuaginta hos Jeremia behåller dem som ett namn, Aglath-salisia; den ryska synodala bibeln, Revised Standard Version och många moderna översättningar läser en stad, ”Eglat-Shelishija”, kanske ”det tredje Eglat”, så kallat för att skiljas från andra av samma namn, någonstans i södra Moab."
    - "Om det är en stad är inget känt om den utöver dess sällskap i de två verserna: Soar, uppgången till Luchit och vägen till Horonajim, alla i södra Moab mot Döda havet, där Luchit och Horonajim själva är oidentifierade. Ingen ruin bär namnet, och kartan placerar det nära Soar enbart på grund av detta sällskap. Det är ett av de minst kända namnen i Bibeln, och ärliga kartor märker det med ett frågetecken."
scripture:
