body:
  en:
    - "Timnath-heres, “portion of the sun”, or Timnath-serah, as the Book of Joshua spells it with the second word reversed, was the town in the hill country of Ephraim that Israel gave to Joshua, and where he was buried. It is generally identified with Khirbet Tibnah, a mound on the western edge of the hills about 28 km south-west of Shechem, north-west of Ramallah, which keeps the name. Eusebius knew it as Thamna, where the tomb of Joshua was still shown, and Josephus names Thamna as the seat of one of the districts of Judea."
    - "In 1863 Victor Guérin found on the slope a rock-cut tomb with some two hundred niches for lamps and took it for Joshua's. Jewish tradition has long shown the tombs of Joshua, Caleb and Nun, and Samaritan tradition those of Joshua and Caleb, instead at Kifl Haris near Salfit, about 13 km to the north. Later Jewish tradition explained the name Heres by a likeness of the sun set on the grave to recall the day the sun stood still at Gibeon."
    - "“According to the word of the LORD they gave him the city which he asked, even Timnath-serah in mount Ephraim: and he built the city, and dwelt therein.” After the farewell at Shechem, Joshua died at a hundred and ten, “and they buried him in the border of his inheritance in Timnath-serah, which is in mount Ephraim, on the north side of the hill of Gaash”; the Greek Bible, followed by the Russian Synodal text, adds that the flint knives of the circumcision at Gilgal were laid in the tomb with him. Judges repeats the burial under the name Timnath-heres. The hill of Gaash is otherwise known only from the brooks of Gaash, home of one of David's warriors."
    - "A survey in 2015 and excavations begun in 2022 by Bar-Ilan University found the town at its most important in the Iron Age and the early Roman period, when Thamna was a district town; the finds are still being published. The mound lies in the West Bank between the villages of Deir Nidham and Nabi Salih."
  ru:
    - "Фамнаф-Сараи, по-еврейски Тимнат-Херес, «удел солнца», или Тимнат-Серах, как пишет книга Иисуса Навина, переставив буквы второго слова, — город на горе Ефремовой, который Израиль дал Иисусу Навину и где его похоронили. Его обычно отождествляют с Хирбет-Тибной — холмом на западной кромке нагорья примерно в 28 км к юго-западу от Сихема, северо-западнее Рамаллы, который хранит имя. Евсевий знал его как Фамну, где всё ещё показывали гробницу Иисуса, а Иосиф Флавий называет Фамну средоточием одного из округов Иудеи."
    - "В 1863 году Виктор Герен нашёл на склоне высеченную в скале гробницу примерно с двумя сотнями ниш для светильников и счёл её гробницей Иисуса. Иудейское предание издавна показывает гробницы Иисуса, Халева и Нуна, а самаритянское — Иисуса и Халева, в другом месте — в Кифль-Харисе близ Салфита, примерно в 13 км к северу. Позднее иудейское предание объясняло имя Херес изображением солнца, поставленным на могиле в память о дне, когда солнце остановилось над Гаваоном."
    - "Книга Иисуса Навина говорит: «по повелению Господню дали ему город Фамнаф-Сараи, которого он просил, на горе Ефремовой; и построил он город и жил в нем». После прощания в Сихеме Иисус умер ста десяти лет, «и похоронили его в пределе его удела в Фамнаф-Сараи, что на горе Ефремовой, на север от горы Гааша»; греческая Библия, а за ней и Синодальный перевод, добавляет, что в гроб с ним положили каменные ножи обрезания в Галгале. Книга Судей повторяет рассказ о погребении; в еврейском тексте город там назван Тимнат-Херес. Гора Гааш известна больше лишь по Нахле-Гаашу, «потокам Гааша», откуда родом один из воинов Давида."
    - "Обследование 2015 года и раскопки, начатые в 2022 году Университетом Бар-Илан, показали, что важнее всего город был в железном веке и в раннеримскую эпоху, когда Фамна была окружным городом; находки ещё публикуются. Холм лежит на Западном берегу между деревнями Дейр-Нидам и Наби-Салих."
  uk:
    - "Тімнат-Хереса, «частка сонця», або Тімнат-Сера, як пише Книга Ісуса Навина з переставленими літерами другого слова, було містом у гірській країні Єфрема, яке Ізраїль дав Ісусові Навину і де його поховали. Його зазвичай ототожнюють із Хірбет-Тібною, пагорбом на західному краю гір приблизно за 28 км на південний захід від Сихема, на північний захід від Рамалли, що зберігає назву. Євсевій знав його як Тамну, де ще показували гробницю Ісуса Навина, а Йосиф Флавій називає Тамну центром одного з округів Юдеї."
    - "У 1863 році Віктор Ґерен знайшов на схилі висічену в скелі гробницю з близько двохсот ніш для світильників і прийняв її за гробницю Ісуса Навина. Юдейська традиція здавна показує гробниці Ісуса Навина, Калеба і Навіна, а самарянська — Ісуса Навина і Калеба, натомість у Кіфль-Харісі поблизу Сальфіта, приблизно за 13 км на північ. Пізніша юдейська традиція пояснювала ім’я Хереса зображенням сонця, поставленим на могилі на згадку про день, коли сонце стало над Гаваоном."
    - "«По обітницї Господнїй надїлили вони йому місто, яке собі бажав, се б то Тамнат-Сараа на Ефраїмових горах. І укріпив він місто і осївсь у йому». Після прощання в Сихемі Ісус Навин помер у сто десять років, «і поховано його в займищі наслїдньої держави його в Тамнат-Сараа на Ефраїмовій горі, на північ від Гаас гори»; грецька Біблія, а за нею російський Синодальний текст, додає, що крем’яні ножі обрізання в Гілгалі поклали з ним у гробницю. Книга Суддів повторює поховання під ім’ям Тімнат-Хереса. Пагорб Гааш інакше відомий лише з потоків Гааша, батьківщини одного з воїнів Давида."
    - "Обстеження 2015 року й розкопки, розпочаті 2022 року університетом Бар-Ілан, виявили, що місто було найважливішим у залізну добу та ранню римську, коли Тамна була окружним містом; знахідки ще публікуються. Пагорб лежить на Західному березі між селами Дейр-Нідам і Набі-Салех."
  es:
    - "Timnat-heres, «porción del sol», o Timnat-sera, como la escribe el libro de Josué con la segunda palabra invertida, era la ciudad de la región montañosa de Efraín que Israel dio a Josué y donde fue sepultado. Se identifica generalmente con Khirbet Tibnah, un montículo en el borde occidental de las colinas, a unos 28 km al suroeste de Siquem, al noroeste de Ramallah, que conserva el nombre. Eusebio la conocía como Thamna, donde aún se mostraba la tumba de Josué, y Josefo nombra Thamna como sede de uno de los distritos de Judea."
    - "En 1863 Victor Guérin halló en la ladera una tumba excavada en la roca con unos doscientos nichos para lámparas y la tomó por la de Josué. La tradición judía muestra desde hace mucho las tumbas de Josué, Caleb y Nun, y la samaritana las de Josué y Caleb, en cambio, en Kifl Haris, cerca de Salfit, a unos 13 km al norte. La tradición judía posterior explicó el nombre Heres por la figura de un sol puesta sobre la tumba para recordar el día en que el sol se detuvo en Gabaón."
    - "«Según la palabra de Jehová, le dieron la ciudad que él pidió, Timnath-sera, en el monte de Ephraim; y él reedificó la ciudad, y habitó en ella». Tras la despedida en Siquem, Josué murió a los ciento diez años, «Y enterráronlo en el término de su posesión en Timnath-sera, que está en el monte de Ephraim, al norte del monte de Gaas»; la Biblia griega, a la que sigue el texto sinodal ruso, añade que los cuchillos de pedernal de la circuncisión en Gilgal fueron depositados con él en la tumba. Jueces repite la sepultura con el nombre de Timnat-heres. El monte de Gaas solo se conoce por lo demás por los arroyos de Gaas, patria de uno de los guerreros de David."
    - "Una prospección en 2015 y las excavaciones iniciadas en 2022 por la Universidad de Bar-Ilan hallaron la ciudad en su momento de mayor importancia en la Edad del Hierro y a comienzos de la época romana, cuando Thamna era capital de distrito; los hallazgos aún se están publicando. El montículo se encuentra en Cisjordania, entre las aldeas de Deir Nidham y Nabi Salih."
  pt:
    - "Timnate-Heres, “porção do sol”, ou Timnate-Sera, como o livro de Josué a grafa, com as letras da segunda palavra invertidas, foi a cidade na região montanhosa de Efraim que Israel deu a Josué e onde ele foi sepultado. É geralmente identificada com Khirbet Tibnah, um monte na orla ocidental das colinas, a cerca de 28 km a sudoeste de Siquém, a noroeste de Ramalá, que conserva o nome. Eusébio a conhecia como Thamna, onde ainda se mostrava o túmulo de Josué, e Josefo nomeia Thamna como sede de um dos distritos da Judeia."
    - "Em 1863, Victor Guérin achou na encosta um túmulo escavado na rocha com cerca de duzentos nichos para lâmpadas e o tomou pelo de Josué. A tradição judaica mostra há muito os túmulos de Josué, Calebe e Num, e a samaritana os de Josué e Calebe, em vez disso, em Kifl Haris, perto de Salfit, a uns 13 km ao norte. A tradição judaica posterior explicou o nome Heres por uma imagem do sol posta na sepultura para recordar o dia em que o sol parou em Gibeão."
    - "“Segundo o mandamento do SENHOR, deram-lhe a cidade que ele pediu, Timnate-Sera, na região montanhosa de Efraim; e ele construiu a cidade e habitou nela.” Depois da despedida em Siquém, Josué morreu aos cento e dez anos, e “Eles o sepultaram no território da sua herança em Timnate-Sera, que fica na região montanhosa de Efraim, ao norte do monte Gaás”; a Bíblia grega, seguida pelo texto sinodal russo, acrescenta que as facas de pederneira da circuncisão em Gilgal foram postas com ele no túmulo. Juízes repete o sepultamento sob o nome de Timnate-Heres. O monte Gaás é conhecido de outro modo apenas pelos ribeiros de Gaás, terra de um dos guerreiros de Davi."
    - "Uma prospecção em 2015 e escavações iniciadas em 2022 pela Universidade Bar-Ilan encontraram a cidade em sua maior importância na Idade do Ferro e no início do período romano, quando Thamna era cidade de distrito; os achados ainda estão sendo publicados. O monte fica na Cisjordânia, entre as aldeias de Deir Nidham e Nabi Salih."
  de:
    - "Timnat-Heres, „Anteil der Sonne“, oder Timnat-Serach, wie das Buch Josua es mit vertauschtem zweiten Wort schreibt, war die Stadt im Bergland Ephraim, die Israel Josua gab und in der er begraben wurde. Sie wird meist mit Khirbet Tibnah gleichgesetzt, einem Hügel am Westrand des Berglands etwa 28 km südwestlich von Sichem, nordwestlich von Ramallah, der den Namen bewahrt. Eusebius kannte es als Thamna, wo das Grab Josuas noch gezeigt wurde, und Josephus nennt Thamna als Sitz eines der Bezirke Judäas."
    - "1863 fand Victor Guérin am Hang ein Felsgrab mit etwa zweihundert Lampennischen und hielt es für Josuas. Jüdische Überlieferung zeigt die Gräber Josuas, Kalebs und Nuns, samaritanische die Josuas und Kalebs, seit langem stattdessen in Kifl Haris bei Salfit, etwa 13 km nördlich. Die spätere jüdische Überlieferung erklärte den Namen Heres durch ein auf das Grab gesetztes Abbild der Sonne, das an den Tag erinnern sollte, an dem die Sonne bei Gibeon stillstand."
    - "Sie „gaben ihm nach dem Befehl des HERRN die Stadt, die er forderte, nämlich Thimnath-Serah auf dem Gebirge Ephraim. Da baute er die Stadt und wohnte darin.“ Nach dem Abschied in Sichem starb Josua mit hundertzehn Jahren, „und man begrub ihn in der Grenze seines Erbteils zu Thimnath-Serah, das auf dem Gebirge Ephraim liegt mitternachtwärts vom Berge Gaas“; die griechische Bibel, der der russische Synodaltext folgt, fügt hinzu, dass die Feuersteinmesser der Beschneidung in Gilgal mit ihm ins Grab gelegt wurden. Das Buch der Richter wiederholt die Bestattung unter dem Namen Timnat-Heres. Der Berg Gaasch ist sonst nur aus den Bächen von Gaasch, der Heimat eines von Davids Kriegern, bekannt."
    - "Eine Erkundung 2015 und Grabungen der Bar-Ilan-Universität seit 2022 fanden die Stadt auf ihrem Höhepunkt in der Eisenzeit und der frühen Römerzeit, als Thamna Bezirksstadt war; die Funde werden noch veröffentlicht. Der Hügel liegt im Westjordanland zwischen den Dörfern Deir Nidham und Nabi Salih."
  fr:
    - "Thimnath-Hérès, « portion du soleil », ou Thimnath-Sérach comme l’écrit le livre de Josué avec le second mot inversé, était la ville de la montagne d’Éphraïm qu’Israël donna à Josué, et où il fut enterré. On l’identifie généralement à Khirbet Tibnah, tertre au bord ouest des collines à environ 28 km au sud-ouest de Sichem, au nord-ouest de Ramallah, qui en garde le nom. Eusèbe la connaissait sous le nom de Thamna, où l’on montrait encore le tombeau de Josué, et Josèphe nomme Thamna comme chef-lieu d’un des districts de Judée."
    - "En 1863, Victor Guérin trouva sur la pente une tombe rupestre avec quelque deux cents niches à lampes et la prit pour celle de Josué. La tradition juive montre depuis longtemps les tombes de Josué, de Caleb et de Nun, et la tradition samaritaine celles de Josué et de Caleb, plutôt à Kifl Haris, près de Salfit, à environ 13 km au nord. La tradition juive tardive expliqua le nom Hérès par la ressemblance d’un soleil posé sur la tombe, pour rappeler le jour où le soleil s’arrêta à Gabaon."
    - "« Selon l’ordre de l’Éternel, ils lui donnèrent la ville qu’il demanda, Thimnath-Sérach, dans la montagne d’Éphraïm. Il rebâtit la ville, et y fit sa demeure. » Après les adieux à Sichem, Josué mourut à cent dix ans, et « on l’ensevelit dans le territoire qu’il avait eu en partage, à Thimnath-Sérach, dans la montagne d’Éphraïm, au nord de la montagne de Gaasch » ; la Bible grecque, suivie par le texte synodal russe, ajoute que les couteaux de silex de la circoncision de Guilgal furent déposés avec lui dans la tombe. Les Juges répètent la sépulture sous le nom de Thimnath-Hérès. La montagne de Gaasch n’est connue par ailleurs que par les torrents de Gaasch, patrie de l’un des vaillants de David."
    - "Une prospection en 2015 et des fouilles commencées en 2022 par l’université Bar-Ilan ont montré que la ville atteignit son apogée à l’âge du fer et au début de l’époque romaine, quand Thamna était chef-lieu de district ; les trouvailles sont encore en cours de publication. Le tertre se trouve en Cisjordanie, entre les villages de Deir Nidham et de Nabi Salih."
  pl:
    - "Timnat-Heres, „część słońca”, albo Timnat-Serach, jak zapisuje je Księga Jozuego z odwróconym drugim członem, było miastem w górach Efraima, które Izrael dał Jozuemu i gdzie został pochowany. Utożsamia się je zwykle z Chirbet Tibna, kopcem na zachodnim skraju wzgórz około 28 km na południowy zachód od Sychem, na północny zachód od Ramallah, który zachowuje nazwę. Euzebiusz znał je jako Thamnę, gdzie nadal pokazywano grób Jozuego, a Józef Flawiusz wymienia Thamnę jako siedzibę jednego z okręgów Judei."
    - "W 1863 roku Victor Guérin znalazł na stoku wykuty w skale grobowiec z około dwustu niszami na lampy i uznał go za grób Jozuego. Tradycja żydowska pokazuje od dawna groby Jozuego, Kaleba i Nuna, a samarytańska groby Jozuego i Kaleba, raczej w Kifl Charis koło Salfit, około 13 km na północ. Późniejsza tradycja żydowska tłumaczyła nazwę Heres wyobrażeniem słońca umieszczonym na grobie dla upamiętnienia dnia, gdy słońce stanęło w Gibeonie."
    - "„Według rozkazania Pańskiego dali mu miasto, którego żądał, Tamnat Saraa na górze Efraim, gdzie zbudował miasto, i mieszkał w niem.” Po pożegnaniu w Sychem Jozue umarł w wieku stu dziesięciu lat, „I pogrzebali go na granicy dziedzictwa jego w Tamnat Sare, które jest na górze Efraim, ku północy góry Gaas”; Biblia grecka, za którą idzie rosyjski tekst synodalny, dodaje, że krzemienne noże obrzezania z Gilgal złożono z nim w grobie. Księga Sędziów powtarza pogrzeb pod nazwą Timnat-Heres. Góra Gaasz jest poza tym znana tylko z potoków Gaasz, ojczyzny jednego z wojowników Dawida."
    - "Badanie powierzchniowe w 2015 roku i wykopaliska rozpoczęte w 2022 roku przez Uniwersytet Bar-Ilan wykazały, że miasto było najważniejsze w epoce żelaza i we wczesnym okresie rzymskim, gdy Thamna była miastem okręgowym; znaleziska są nadal publikowane. Kopiec leży na Zachodnim Brzegu między wsiami Dajr Nizam i Nabi Salih."
  it:
    - "Timnat-Cheres, «porzione del sole», o Timnat-Serach, come la scrive il libro di Giosuè con la seconda parola invertita, era la città sulle colline di Efraim che Israele diede a Giosuè, e dove egli fu sepolto. È generalmente identificata con Khirbet Tibnah, un tell sul margine occidentale delle colline, a circa 28 km a sud-ovest di Sichem, a nord-ovest di Ramallah, che ne conserva il nome. Eusebio la conosceva come Thamna, dove si mostrava ancora la tomba di Giosuè, e Giuseppe Flavio nomina Thamna come sede di uno dei distretti della Giudea."
    - "Nel 1863 Victor Guérin trovò sul pendio una tomba scavata nella roccia con circa duecento nicchie per lampade e la ritenne quella di Giosuè. La tradizione ebraica mostra da lungo tempo invece le tombe di Giosuè, Caleb e Nun, e quella samaritana le tombe di Giosuè e Caleb, a Kifl Haris presso Salfit, a circa 13 km a nord. La tradizione ebraica posteriore spiegò il nome Cheres con l’immagine di un sole posta sulla tomba per ricordare il giorno in cui il sole si fermò a Gabaon."
    - "«Secondo l’ordine dell’Eterno, gli diedero la città ch’egli chiese: Timnath-Serah, nella contrada montuosa di Efraim. Egli costruì la città e vi stabilì la sua dimora.» Dopo l’addio a Sichem, Giosuè morì a centodieci anni, e «lo seppellirono nel territorio di sua proprietà a Timnat-Serah, che è nella contrada montuosa di Efraim, al nord della montagna di Gaash»; la Bibbia greca, seguita dal testo sinodale russo, aggiunge che con lui furono deposti nella tomba i coltelli di selce della circoncisione a Gàlgala. Il libro dei Giudici ripete la sepoltura con il nome di Timnat-Cheres. La montagna di Gaas è altrimenti nota solo dai torrenti di Gaas, patria di uno dei prodi di Davide."
    - "Una ricognizione del 2015 e scavi iniziati nel 2022 dall’Università Bar-Ilan hanno mostrato la città al suo apice nell’età del Ferro e nella prima epoca romana, quando Thamna era capoluogo di distretto; i reperti sono ancora in corso di pubblicazione. Il tell si trova in Cisgiordania fra i villaggi di Deir Nidham e Nabi Salih."
  nl:
    - "Timnat-Heres, “aandeel van de zon”, of Timnat-Serach, zoals het boek Jozua het schrijft met het tweede woord omgedraaid, was de stad in het bergland van Efraïm die Israël aan Jozua gaf en waar hij werd begraven. Ze wordt algemeen vereenzelvigd met Khirbet Tibnah, een heuvel aan de westrand van het bergland, ongeveer 28 km ten zuidwesten van Sichem, ten noordwesten van Ramallah, die de naam bewaart. Eusebius kende het als Thamna, waar het graf van Jozua nog werd getoond, en Flavius Josephus noemt Thamna als zetel van een van de districten van Judea."
    - "In 1863 vond Victor Guérin op de helling een in de rots uitgehouwen graf met zo’n tweehonderd nissen voor lampen en hield het voor dat van Jozua. De Joodse overlevering toont de graven van Jozua, Kaleb en Nun, en de Samaritaanse die van Jozua en Kaleb, al lang in plaats daarvan in Kifl Haris bij Salfit, ongeveer 13 km naar het noorden. Latere Joodse overlevering verklaarde de naam Heres uit een afbeelding van de zon op het graf, ter herinnering aan de dag dat de zon bij Gibeon stilstond."
    - "“Naar den mond des HEEREN gaven zij hem die stad, welke hij begeerde, Thimnath-Serah, op het gebergte van Efraim; en hij bouwde die stad, en woonde in dezelve.” Na het afscheid in Sichem stierf Jozua, honderdtien jaar oud, “en zij begroeven hem in de landpale zijns erfdeels, te Timnath-Serah, welke is op een berg van Efraim, aan het noorden van den berg Gaas”; de Griekse Bijbel, gevolgd door de Russische Synodale tekst, voegt eraan toe dat de vuurstenen messen van de besnijdenis bij Gilgal met hem in het graf werden gelegd. Richteren herhaalt de begrafenis onder de naam Timnat-Heres. De Gaäsberg is verder alleen bekend uit de beken van Gaäs, de woonplaats van een van Davids krijgers."
    - "Een onderzoek in 2015 en opgravingen die in 2022 begonnen door de Bar-Ilan-universiteit toonden dat de stad het belangrijkst was in de IJzertijd en de vroeg-Romeinse tijd, toen Thamna een districtsstad was; de vondsten worden nog gepubliceerd. De heuvel ligt op de Westelijke Jordaanoever tussen de dorpen Deir Nidham en Nabi Salih."
  cs:
    - "Timnat-cheres, „podíl slunce“, nebo Timnat-serach, jak ji píše Kniha Jozue s obráceným druhým slovem, bylo město v pohoří Efrajimově, které Izrael dal Jozuovi a kde byl pohřben. Obecně je ztotožňováno s Chirbet Tibna, pahorkem na západním okraji hor asi 28 km jihozápadně od Šekemu, severozápadně od Rámalláhu, který jméno zachovává. Eusebius je znal jako Thamnu, kde se ještě ukazoval hrob Jozuův, a Josephus jmenuje Thamnu jako sídlo jednoho z okresů Judska."
    - "V roce 1863 nalezl Victor Guérin na svahu skalní hrobku s asi dvěma sty výklenků pro lampy a pokládal ji za Jozuovu. Židovská tradice místo toho dlouho ukazuje hrobky Jozuovu, Kálebovu a Nunovu a samařská hrobky Jozuovu a Kálebovu v Kifl Háris u Salfítu, asi 13 km na sever. Pozdější židovská tradice vysvětlovala jméno Cheres podobou slunce vsazenou na hrob jako připomínku dne, kdy se slunce zastavilo u Gibeonu."
    - "„Podlé rozkázaní Hospodinova dali jemu město, kteréhož žádal, Tamnatsára, na hoře Efraim. I vystavěl město, a přebýval v něm.“ Po rozloučení v Šekemu zemřel Jozue ve stu deseti letech a „pochovali ho v krajině dědictví jeho, v Tamnatsáre, kteréž jest na hoře Efraim k straně půlnoční hory Gás“; řecká Bible, jíž následuje ruský synodální text, dodává, že s ním byly do hrobu uloženy křemenné nože obřízky v Gilgalu. Kniha Soudců opakuje pohřeb pod jménem Timnat-cheres. Hora Gaaš je jinak známa jen z potoků Gaaš, domova jednoho z Davidových bojovníků."
    - "Průzkum v roce 2015 a vykopávky zahájené v roce 2022 Univerzitou Bar-Ilan zjistily, že město bylo nejvýznamnější v době železné a v raném římském období, kdy byla Thamna okresním městem; nálezy se stále zveřejňují. Pahorek leží na Západním břehu mezi vesnicemi Dér Nidám a Nabí Sálih."
