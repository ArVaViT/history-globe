# Overview article (ADR 0007). Mainstream facts only; Khirbet Tibnah is the usual identification and the Kifl Haris tradition is given beside it; no absolute date is given for Joshua.
id: timnath-heres
place: a6e6528
title:
  en: "Timnath-heres"
  ru: "Фамнаф-Сараи"
  uk: "Тімнат-Хереса"
  es: "Timnat-heres"
  pt: "Timnate-Heres"
  de: "Timnat-Heres"
  fr: "Thimnath-Hérès"
  pl: "Timnat-Heres"
  it: "Timnat-Cheres"
  nl: "Timnat-Heres"
