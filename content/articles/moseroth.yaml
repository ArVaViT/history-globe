body:
  en:
    - "Moseroth, in Deuteronomy Moserah, was a camp of Israel in the wilderness, known from two notices that do not easily agree. The list of stations in Numbers names it between Hashmonah and Bene-jaakan: “And they departed from Hashmonah, and encamped at Moseroth. And they departed from Moseroth, and pitched in Bene-jaakan.” Deuteronomy gives the two in the other order and adds what Numbers says of Mount Hor: “And the children of Israel took their journey from Beeroth of the children of Jaakan to Mosera: there Aaron died, and there he was buried; and Eleazar his son ministered in the priest's office in his stead.” The name means “bonds” or “chastisements”, and no event is attached to it."
    - "How the two notices fit is an old question. Numbers puts Aaron's death on Mount Hor, seven stations after Moseroth, in the fortieth year; Deuteronomy puts it at Moserah, before Bene-jaakan. Readers have answered that Moserah was the camp at the mountain's foot and the itinerary lists the mountain by its own name; that Israel passed these stations twice, going down to Ezion-geber and coming back; or that Deuteronomy preserves a different tradition of the route and of Aaron's grave. None of this can be tested on the ground, since neither Moseroth nor Bene-jaakan has been found and the site of Mount Hor is itself disputed."
    - "The camp is therefore sought wherever Mount Hor is sought: near Petra on the edge of Edom, if Jebel Harun is the mountain, or on the border of the wilderness of Zin and the Negev highlands, if it is looked for nearer Kadesh. No tradition marked it in antiquity. The map places it within reach of Mount Hor without a point of its own, in what is today the Negev of Israel toward the Arabah and the Jordanian border."
  ru:
    - "Мосероф, во Второзаконии Мозер, был станом Израиля в пустыне, известным по двум известиям, которые нелегко согласовать. Перечень станов в книге Чисел называет его между Хашмоной и Бене-Яаканом: «И отправились из Хашмоны и расположились станом в Мосерофе. И отправились из Мосерофа и расположились станом в Бене-Яакане». Второзаконие даёт эти два стана в обратном порядке и прибавляет то, что книга Чисел говорит о горе Ор: «И сыны Израилевы отправились из Беероф-Бене-Яакана в Мозер; там умер Аарон и погребен там, и стал священником вместо него сын его Елеазар». Имя значит «узы» или «наказания», и никакого события с ним не связано."
    - "Как согласовать эти два известия — старый вопрос. Книга Чисел помещает смерть Аарона на горе Ор, через семь станов после Мосерофа, в сороковой год; Второзаконие — в Мозере, перед Бене-Яаканом. Читатели отвечали, что Мозер был станом у подножия горы, а перечень называет гору её собственным именем; что Израиль проходил эти станы дважды, спускаясь к Ецион-Гаверу и возвращаясь; или что Второзаконие хранит иное предание о пути и о могиле Аарона. Ничего из этого нельзя проверить на местности: ни Мосероф, ни Бене-Яакан не найдены, а место горы Ор само спорно."
    - "Поэтому стан ищут там же, где ищут гору Ор: у Петры на краю Едома, если гора — Джебель-Харун, или на границе пустыни Син и Негевского нагорья, если её ищут ближе к Кадесу. В древности его не отмечало никакое предание. На карте он помещён в пределах досягаемости от горы Ор без собственной точки, в нынешнем Негеве Израиля, в сторону Аравы и иорданской границы."
  uk:
    - "Мосерот, у Повторенні Закону Мосера, був табором Ізраїлю в пустелі, відомим із двох записів, які нелегко узгодити. Перелік стоянок у Книзі Чисел називає його між Хашмоною і Бене-Яаканом: «І рушили з Гашмона та й отаборились у Мозеротї. І рушили з Мозерота та й отаборились у Бене-Яаканї.» Повторення Закону дає їх у зворотному порядку і додає те, що Книга Чисел говорить про гору Гор: «І рушили сини Ізрайлеві від Беерот-Бне-Яакану до Мозери. Там умер Арон і там поховано його, і намість його став сьвященником Єлеазар, син його.» Назва означає «пута» або «покарання», і жодної події з нею не пов’язано."
    - "Як ці два записи поєднуються, є давнім питанням. Книга Чисел ставить смерть Аарона на горі Гор, через сім стоянок після Мосерота, у сороковому році; Повторення Закону — у Мосері, перед Бене-Яаканом. Читачі відповідали, що Мосера була табором біля підніжжя гори, а маршрут називає гору її власним ім’ям; що Ізраїль проходив ці стоянки двічі, спускаючись до Ецйон-Гевера і повертаючись; або що Повторення Закону зберігає іншу традицію про маршрут і могилу Аарона. Ніщо з цього не можна перевірити на місці, бо ні Мосерота, ні Бене-Яакану не знайдено, а місце гори Гор саме спірне."
    - "Табір, отже, шукають там, де шукають гору Гор: поблизу Петри на краю Едому, якщо гора — Джебель-Гарун, або на межі пустелі Сін і нагір’я Негеву, якщо шукати її ближче до Кадеса. Жодна традиція не позначала його в давнину. Мапа розміщує його в межах досяжності гори Гор без власної точки, в сучасному Негеві Ізраїлю в бік Арави й йорданського кордону."
  es:
    - "Moserot, en Deuteronomio Moserá, fue un campamento de Israel en el desierto, conocido por dos noticias que no concuerdan fácilmente. La lista de estaciones de Números la nombra entre Hasmona y Bene-jaacán: «Y partidos de Hasmona, asentaron en Moseroth. Y partidos de Moseroth, asentaron en Bene-jaacán». Deuteronomio da los dos en el otro orden y añade lo que Números dice del monte Hor: «Después partieron los hijos de Israel de Beerot-bene-jacaam á Moserá: allí murió Aarón, y allí fué sepultado; y en lugar suyo tuvo el sacerdocio su hijo Eleazar». El nombre significa «ataduras» o «castigos», y no se le asocia ningún suceso."
    - "Cómo encajan las dos noticias es una vieja cuestión. Números sitúa la muerte de Aarón en el monte Hor, siete estaciones después de Moserot, en el año cuarenta; Deuteronomio la sitúa en Moserá, antes de Bene-jaacán. Los lectores han respondido que Moserá era el campamento al pie de la montaña y que el itinerario enumera la montaña por su propio nombre; que Israel pasó dos veces por estas estaciones, bajando a Ezión-geber y volviendo; o que Deuteronomio conserva una tradición distinta de la ruta y de la tumba de Aarón. Nada de esto puede comprobarse sobre el terreno, pues ni Moserot ni Bene-jaacán han sido hallados y el emplazamiento del monte Hor se discute a su vez."
    - "El campamento se busca, por tanto, dondequiera que se busque el monte Hor: cerca de Petra, en el borde de Edom, si la montaña es el Yebel Harún, o en la frontera del desierto de Zin y las tierras altas del Néguev, si se busca más cerca de Cades. Ninguna tradición lo señaló en la antigüedad. El mapa lo sitúa al alcance del monte Hor sin un punto propio, en lo que hoy es el Néguev de Israel, hacia el Arabá y la frontera jordana."
  pt:
    - "Moserote, em Deuteronômio Moserá, foi um acampamento de Israel no deserto, conhecido por duas notícias que dificilmente concordam. A lista de etapas em Números a nomeia entre Hasmona e Bene-Jaacã: “Partiram de Hasmona e acamparam em Moserote. Partiram de Moserote e acamparam em Bene-Jaacã.” Deuteronômio dá os dois na outra ordem e acrescenta o que Números diz do monte Hor: “Os filhos de Israel viajaram de Beerote-Bene-Jaacã para Moserá. Lá Arão morreu, e lá foi sepultado; e Eleazar, seu filho, ministrou no ofício sacerdotal em seu lugar.” O nome significa “laços” ou “castigos”, e nenhum acontecimento está ligado a ele."
    - "Como as duas notícias se conciliam é uma velha questão. Números põe a morte de Arão no monte Hor, sete etapas depois de Moserote, no quadragésimo ano; Deuteronômio a põe em Moserá, antes de Bene-Jaacã. Os leitores responderam que Moserá era o acampamento ao pé da montanha e o itinerário lista a montanha por seu próprio nome; que Israel passou por essas etapas duas vezes, descendo a Eziom-Geber e voltando; ou que Deuteronômio preserva outra tradição da rota e do túmulo de Arão. Nada disso pode ser testado no terreno, pois nem Moserote nem Bene-Jaacã foram achadas e o sítio do monte Hor é ele próprio disputado."
    - "O acampamento é, portanto, procurado onde quer que se procure o monte Hor: perto de Petra, na orla de Edom, se o Jebel Harun é a montanha, ou na fronteira do deserto de Zim e das terras altas do Neguebe, se é procurado mais perto de Cades. Nenhuma tradição o assinalou na Antiguidade. O mapa o põe ao alcance do monte Hor sem ponto próprio, no que é hoje o Neguebe de Israel rumo à Arabá e à fronteira jordaniana."
  de:
    - "Moserot, im 5. Buch Mose Mosera, war ein Lager Israels in der Wüste, bekannt aus zwei Notizen, die nicht leicht zusammenpassen. Die Stationenliste in 4. Mose nennt es zwischen Haschmona und Bne-Jaakan: „Von Hasmona zogen sie aus und lagerten sich in Moseroth. Von Moseroth zogen sie aus und lagerten sich in Bne-Jaakan.“ Das 5. Buch Mose gibt die beiden in anderer Reihenfolge und fügt hinzu, was 4. Mose vom Berg Hor sagt: „Und die Kinder Israel zogen aus von Beeroth-Bne-Jaakan gen Moser. Daselbst starb Aaron, und ist daselbst begraben; und sein Sohn Eleasar ward für ihn Priester.“ Der Name bedeutet „Fesseln“ oder „Züchtigungen“, und mit ihm ist kein Ereignis verbunden."
    - "Wie die beiden Notizen zusammenpassen, ist eine alte Frage. 4. Mose legt Aarons Tod auf den Berg Hor, sieben Stationen nach Moserot, im vierzigsten Jahr; das 5. Buch Mose legt ihn nach Mosera, vor Bne-Jaakan. Leser haben geantwortet, Mosera sei das Lager am Fuß des Berges gewesen und die Reiseliste nenne den Berg mit eigenem Namen; Israel sei diese Stationen zweimal passiert, hinab nach Ezjon-Geber und zurück; oder das 5. Buch Mose bewahre eine andere Überlieferung des Weges und von Aarons Grab. Nichts davon lässt sich am Boden prüfen, da weder Moserot noch Bne-Jaakan gefunden wurde und die Lage des Berges Hor selbst umstritten ist."
    - "Das Lager wird daher überall gesucht, wo der Berg Hor gesucht wird: nahe Petra am Rand Edoms, wenn Jebel Harun der Berg ist, oder an der Grenze der Wüste Zin und des Negev-Hochlands, wenn man ihn näher bei Kadesch sucht. Keine Überlieferung bezeichnete es in der Antike. Die Karte setzt es in Reichweite des Berges Hor ohne eigenen Punkt, im heutigen Negev Israels zur Araba und zur jordanischen Grenze hin."
  fr:
    - "Moséroth, Moséra dans le Deutéronome, était un campement d’Israël dans le désert, connu par deux notices qui s’accordent mal. La liste des étapes des Nombres la nomme entre Haschmona et Bené-Jaakan : « Ils partirent de Haschmona, et campèrent à Moséroth. Ils partirent de Moséroth, et campèrent à Bené-Jaakan. » Le Deutéronome donne les deux dans l’autre ordre et ajoute ce que les Nombres disent du mont Hor : « Les enfants d’Israël partirent de Beéroth-Bené Jaakan pour Moséra. C’est là que mourut Aaron, et qu’il fut enterré ; Éléazar, son fils, lui succéda dans le sacerdoce. » Le nom signifie « liens » ou « châtiments », et aucun événement ne s’y rattache."
    - "Comment les deux notices s’accordent est une vieille question. Les Nombres placent la mort d’Aaron sur le mont Hor, sept étapes après Moséroth, la quarantième année ; le Deutéronome la place à Moséra, avant Bené-Jaakan. On a répondu que Moséra était le camp au pied de la montagne et que la liste d’itinéraire nomme la montagne par son propre nom ; qu’Israël passa deux fois par ces étapes, en descendant à Étsjon-Guéber et en revenant ; ou que le Deutéronome conserve une autre tradition de l’itinéraire et de la tombe d’Aaron. Rien de cela ne peut être vérifié sur le terrain, car ni Moséroth ni Bené-Jaakan n’ont été trouvées et l’emplacement du mont Hor est lui-même discuté."
    - "Le camp se cherche donc là où l’on cherche le mont Hor : près de Pétra, aux confins d’Édom, si le djebel Haroun est la montagne, ou à la frontière du désert de Tsin et des hautes terres du Négev, si on la cherche plus près de Qadesh. Aucune tradition ne la marqua dans l’Antiquité. La carte la place à portée du mont Hor sans point propre, dans l’actuel Négev d’Israël, vers l’Araba et la frontière jordanienne."
  it:
    - "Moserot, in Deuteronomio Mosera, era un accampamento d’Israele nel deserto, noto da due notizie che non si accordano facilmente. L’elenco delle tappe in Numeri la nomina tra Asmona e Bene-Iaakan: «Partirono da Hashmona e si accamparono a Moseroth. Partirono da Moseroth e si accamparono a Bene-Jaakan». Il Deuteronomio dà le due tappe nell’ordine inverso e aggiunge ciò che Numeri dice del Monte Or: «Or i figliuoli d’Israele partirono da Beeroth-Benè-Jaakan per Mosera. Quivi morì Aaronne, e quivi fu sepolto; ed Eleazar, suo figliuolo, divenne sacerdote al posto di lui». Il nome significa «legami» o «castighi», e nessun evento vi è legato."
    - "Come le due notizie si concilino è una vecchia questione. Numeri pone la morte di Aronne sul Monte Or, sette tappe dopo Moserot, nel quarantesimo anno; il Deuteronomio la pone a Mosera, prima di Bene-Iaakan. Si è risposto che Mosera era l’accampamento ai piedi del monte e l’itinerario elenca il monte con il suo nome; che Israele passò queste tappe due volte, scendendo a Ezion-Gheber e tornando; o che il Deuteronomio conserva una diversa tradizione del percorso e della tomba di Aronne. Nulla di ciò può essere verificato sul terreno, poiché né Moserot né Bene-Iaakan sono state trovate e il sito del Monte Or è esso stesso discusso."
    - "L’accampamento si cerca dunque dove si cerca il Monte Or: presso Petra, al margine di Edom, se il monte è il Jebel Harun, o al confine del deserto di Zin e degli altopiani del Negheb, se lo si cerca più vicino a Kades. Nessuna tradizione lo segnò nell’antichità. La mappa lo pone a portata del Monte Or senza un punto proprio, in quello che oggi è il Negheb d’Israele verso l’Araba e il confine giordano."
  pl:
    - "Moserot, w Księdze Powtórzonego Prawa Mosera, było obozem Izraela na pustyni, znanym z dwóch wzmianek, które trudno uzgodnić. Lista stacji w Księdze Liczb umieszcza je między Chaszmoną a Bene-Jaakan: „A ruszywszy się z Hesman, położyli się obozem w Moserot. A ruszywszy się z Moserot, położyli się obozem w Benejaakan.” Księga Powtórzonego Prawa podaje te dwa w innej kolejności i dodaje to, co Księga Liczb mówi o górze Hor: „Tedy synowie Izraelscy ruszyli się od Beerot synów Jahakonowych ku Mesera, gdzie umarł Aaron, i tamże jest pogrzebiony; a odprawował urząd kapłański Eleazar, syn jego, na miejscu jego.” Nazwa znaczy „więzy” albo „karcenia”, i żadne wydarzenie się z nią nie wiąże."
    - "Jak te dwie wzmianki da się pogodzić, to stare pytanie. Księga Liczb umieszcza śmierć Aarona na górze Hor, siedem stacji po Moserot, w czterdziestym roku; Księga Powtórzonego Prawa w Mosera, przed Bene-Jaakan. Czytelnicy odpowiadali, że Mosera było obozem u stóp góry, a itinerarium wymienia górę pod jej własną nazwą; że Izrael przechodził przez te stacje dwa razy, schodząc do Esjon-Geber i wracając; albo że Księga Powtórzonego Prawa zachowuje inną tradycję trasy i grobu Aarona. Nic z tego nie da się sprawdzić w terenie, bo ani Moserot, ani Bene-Jaakan nie znaleziono, a położenie góry Hor jest samo sporne."
    - "Obozu szuka się więc tam, gdzie szuka się góry Hor: koło Petry na skraju Edomu, jeśli górą jest Dżabal Harun, albo na granicy pustyni Sin i wyżyn Negewu, jeśli szuka się jej bliżej Kadesz. Żadna tradycja nie znaczyła go w starożytności. Mapa umieszcza je w zasięgu góry Hor bez własnego punktu, w dzisiejszym izraelskim Negewie ku Arabie i granicy jordańskiej."
  nl:
    - "Moserot, in Deuteronomium Mosera, was een legerplaats van Israël in de woestijn, bekend uit twee berichten die niet gemakkelijk overeenkomen. De lijst van pleisterplaatsen in Numeri noemt het tussen Chasmona en Bene-Jaäkan: “En zij verreisden van Hasmona, en legerden zich in Moseroth. En zij verreisden van Moseroth, en legerden zich in Bene-Jaakan.” Deuteronomium geeft de twee in de andere volgorde en voegt toe wat Numeri over de berg Hor zegt: “En de kinderen Israëls reisden van Beeroth-Bene-jaakan en Mosera. Aldaar stierf Aaron, en werd aldaar begraven; en zijn zoon Eleazar bediende het priesterambt in zijn plaats.” De naam betekent “banden” of “tuchtigingen”, en er is geen gebeurtenis aan verbonden."
    - "Hoe de twee berichten samengaan, is een oude vraag. Numeri plaatst Aärons dood op de berg Hor, zeven pleisterplaatsen na Moserot, in het veertigste jaar; Deuteronomium plaatst hem bij Mosera, vóór Bene-Jaäkan. Lezers hebben geantwoord dat Mosera het kamp aan de voet van de berg was en de reisbeschrijving de berg bij zijn eigen naam noemt; dat Israël deze pleisterplaatsen tweemaal passeerde, naar Ezeon-Geber toe en terug; of dat Deuteronomium een andere overlevering van de route en van Aärons graf bewaart. Niets hiervan kan ter plaatse worden getoetst, aangezien noch Moserot noch Bene-Jaäkan is gevonden en de ligging van de berg Hor zelf omstreden is."
    - "Het kamp wordt dus gezocht waar de berg Hor wordt gezocht: bij Petra aan de rand van Edom, als de Jebel Harun de berg is, of aan de rand van de woestijn Zin en het Negevhoogland, als men hem dichter bij Kades zoekt. In de oudheid markeerde geen overlevering het. De kaart plaatst het binnen bereik van de berg Hor zonder eigen punt, in wat tegenwoordig de Negev van Israël is, richting de Araba en de Jordaanse grens."
  cs:
    - "Moserót, v Deuteronomiu Moserah, byl tábor Izraele na poušti, znám ze dvou zpráv, které se snadno nesrovnávají. Seznam stanic v Numeri jej klade mezi Chašmonu a Bené-jaakan: „Z Esmona pak hnuvše se, položili se v Moserot. A když se hnuli z Moserot, položili se v Benejakan.“ Deuteronomium uvádí obě v jiném pořadí a dodává, co Numeri praví o hoře Hor: „Synové pak Izraelští hnuli se z Beerot synů Jakan do Moserah. Tam umřel Aron, a tu jest pochován; i konal úřad kněžský na místě jeho Eleazar, syn jeho.“ Jméno znamená „pouta“ nebo „káznění“ a nic se k němu neváže."
    - "Jak obě zprávy zapadají, je stará otázka. Numeri kladou Áronovu smrt na horu Hor, sedm stanic po Moserótu, ve čtyřicátém roce; Deuteronomium ji klade do Moserahu, před Bené-jaakan. Čtenáři odpovídali, že Moserah byl tábor na úpatí hory a itinerář uvádí horu jejím vlastním jménem; že Izrael těmito stanicemi prošel dvakrát, dolů k Ecjon-geberu a zpět; nebo že Deuteronomium zachovává jinou tradici o trase a o Áronově hrobě. Nic z toho nelze ověřit na místě, protože ani Moserót ani Bené-jaakan nebyly nalezeny a poloha hory Hor je sama sporná."
    - "Tábor se proto hledá všude, kde se hledá hora Hor: poblíž Petry na okraji Edómu, je-li horou Jebel Harun, nebo na hranici pouště Sín a negevské vysočiny, hledá-li se blíže Kádeši. Žádná tradice ho ve starověku neoznačovala. Mapa jej klade do dosahu hory Hor bez vlastního bodu, v dnešním izraelském Negevu směrem k Arabě a jordánské hranici."
  sv:
    - "Moserot, i Femte Mosebok Mosera, var ett läger för Israel i öknen, känt från två notiser som inte lätt går ihop. Förteckningen över stationer i Fjärde Mosebok nämner det mellan Hashmona och Bene-Jaakan: ”Och de bröto upp från Hasmona och lägrade sig i Moserot. Och de bröto upp från Moserot och lägrade sig i Bene-Jaakan.” Femte Mosebok ger de två i omvänd ordning och tillägger vad Fjärde Mosebok säger om berget Hor: ”Och Israels barn bröto upp från Beerot-Bene-Jaakan och tågade till Mosera. Där dog Aron och blev där också begraven”; och hans son Eleasar blev präst i hans ställe. Namnet betyder ”band” eller ”tuktan”, och ingen händelse knyts till det."
    - "Hur de två notiserna går ihop är en gammal fråga. Fjärde Mosebok förlägger Arons död till berget Hor, sju stationer efter Moserot, under det fyrtionde året; Femte Mosebok förlägger den till Mosera, före Bene-Jaakan. Läsare har svarat att Mosera var lägret vid bergets fot och att färdvägsförteckningen anger berget med dess eget namn; att Israel passerade dessa stationer två gånger, på väg ned till Esjon-Geber och tillbaka; eller att Femte Mosebok bevarar en annan tradition om färdvägen och om Arons grav. Inget av detta kan prövas på marken, eftersom varken Moserot eller Bene-Jaakan har hittats och platsen för berget Hor själv är omstridd."
    - "Lägret söks därför varhelst berget Hor söks: nära Petra vid Edoms kant, om Jebel Harun är berget, eller vid gränsen mellan Sins öken och Negevs högland, om det söks närmare Kadesh. Ingen tradition markerade det i antiken. Kartan placerar det inom räckhåll från berget Hor utan någon egen punkt, i det som i dag är Israels Negev mot Arava och den jordanska gränsen."
  nb:
    - "Moserot, i Femte Mosebok Mosera, var en leirplass for Israel i ørkenen, kjent fra to notiser som ikke lett stemmer overens. Listen over stasjoner i Fjerde Mosebok nevner den mellom Hasjmona og Bene-Jaakan: «Og de drog fra Hasmona og leiret sig i Moserot. Og de drog fra Moserot og leiret sig i Bene-Ja'akan.» Femte Mosebok gir de to i motsatt rekkefølge og føyer til det Fjerde Mosebok sier om Hor-fjellet: «Så brøt Israels barn op fra Bene-Ja'akans brønner og kom til Mosera; der døde Aron, og der blev han begravet, og hans sønn Eleasar tjente som prest i hans sted.» Navnet betyr «bånd» eller «tukt», og ingen hendelse er knyttet til det."
    - "Hvordan de to notisene passer sammen, er et gammelt spørsmål. Fjerde Mosebok setter Arons død på Hor-fjellet, sju stasjoner etter Moserot, i det førtiende året; Femte Mosebok setter den i Mosera, før Bene-Jaakan. Lesere har svart at Mosera var leiren ved fjellets fot og at reiseruten oppfører fjellet under dets eget navn; at Israel passerte disse stasjonene to ganger, på vei ned til Esjon-Geber og på vei tilbake; eller at Femte Mosebok bevarer en annen tradisjon om ruten og om Arons grav. Ingenting av dette kan prøves på bakken, siden verken Moserot eller Bene-Jaakan er funnet og stedet for Hor-fjellet selv er omstridt."
    - "Leiren søkes derfor der Hor-fjellet søkes: nær Petra i kanten av Edom, hvis Jebel Harun er fjellet, eller ved grensen til Sin-ørkenen og Negev-høylandet, hvis det søkes nærmere Kadesj. Ingen tradisjon markerte den i oldtiden. Kartet plasserer den innen rekkevidde av Hor-fjellet uten et eget punkt, i det som i dag er Israels Negev mot Arava og den jordanske grensen."
  tl:
    - "Ang Moseroth, sa Deuteronomio ay Moserah, ay kampo ng Israel sa ilang, na kilala mula sa dalawang pagbanggit na hindi madaling magkasundo. Pinangangalanan ito ng talaan ng mga himpilan sa Mga Bilang sa pagitan ng Hasmona at Bene-jaacan: “At sila'y naglakbay mula sa Hasmona, at humantong sa Moseroth. At sila'y naglakbay mula sa Moseroth, at humantong sa Bene-jaacan.” Ibinibigay ng Deuteronomio ang dalawa sa kabilang pagkakasunud-sunod at idinaragdag ang sinasabi ng Mga Bilang tungkol sa Bundok Hor: “At ang mga anak ni Israel ay naglakbay mula sa Beerot Bene-ja-acan hanggang sa Mosera: doon namatay si Aaron, at doon siya inilibing; at si Eleazar na kaniyang anak ay nangasiwa sa katungkulang saserdote na kahalili niya.” Ang pangalan ay nangangahulugang “mga tanikala” o “mga pagdidisiplina”, at walang pangyayaring nakakabit dito."
    - "Matagal nang tanong kung paano magkasya ang dalawang pagbanggit. Inilalagay ng Mga Bilang ang kamatayan ni Aaron sa Bundok Hor, pitong himpilan pagkatapos ng Moseroth, sa ika-40 taon; inilalagay ito ng Deuteronomio sa Mosera, bago ang Bene-jaacan. Sinagot ng mga mambabasa na ang Mosera ay kampo sa paanan ng bundok at ang itineraryo ay naglilista ng bundok sa sarili nitong pangalan; na dalawang beses dumaan ang Israel sa mga himpilang ito, pababa sa Esion-geber at pabalik; o na pinapanatili ng Deuteronomio ang ibang tradisyon ng ruta at ng libingan ni Aaron. Walang masusubok nito sa lupa, yamang hindi pa natatagpuan ang Moseroth o Bene-jaacan at pinagtatalunan ang pook ng Bundok Hor mismo."
    - "Kaya't hinahanap ang kampo kung saan hinahanap ang Bundok Hor: malapit sa Petra sa gilid ng Edom, kung ang Jebel Harun ang bundok, o sa hangganan ng ilang ng Zin at kabundukan ng Negeb, kung mas malapit sa Cades ito hinahanap. Walang tradisyong nagmarka rito noong unang panahon. Inilalagay ito ng mapa sa abot ng Bundok Hor nang walang sariling punto, sa Negev ng Israel ngayon patungo sa Araba at hangganan ng Jordan."
  da:
    - "Moserot, i Femte Mosebog Mosera, var en lejr for Israel i ørkenen, kendt fra to notitser, der ikke let stemmer overens. Listen over stationer i Fjerde Mosebog nævner den mellem Hasjmona og Bene-Ja'akan: »Og de rejste fra Hasmona, og de lejrede sig i Moseroth. Og de rejste fra Moseroth, og de lejrede sig i Bne-Jaakan.« Femte Mosebog giver de to i den anden rækkefølge og tilføjer, hvad Fjerde Mosebog siger om Hor-bjerget: »Og Israels Børn rejste fra Beeroth-Bne-Jaakan til Mosera; der døde Aron og blev begravet der, og hans Søn Eleasar gjorde Præstetjeneste i hans Sted.« Navnet betyder »lænker« eller »tugtelser«, og ingen begivenhed er knyttet til det."
    - "Hvordan de to notitser passer sammen, er et gammelt spørgsmål. Fjerde Mosebog sætter Arons død på Hor-bjerget, syv stationer efter Moserot, i det fyrretyvende år; Femte Mosebog sætter den ved Mosera, før Bene-Ja'akan. Læsere har svaret, at Mosera var lejren ved bjergets fod, og at rejselisten opfører bjerget under dets eget navn; at Israel passerede disse stationer to gange, på vej ned til Esjon-Geber og tilbage; eller at Femte Mosebog bevarer en anden tradition om ruten og om Arons grav. Intet af dette kan afprøves på stedet, da hverken Moserot eller Bene-Ja'akan er fundet, og Hor-bjergets sted selv er omstridt."
    - "Lejren søges derfor, hvor end Hor-bjerget søges: nær Petra i udkanten af Edom, hvis Jebel Harun er bjerget, eller på grænsen af Zin-ørkenen og Negev-højlandet, hvis det søges nærmere Kadesj. Ingen tradition markerede den i oldtiden. Kortet placerer den inden for rækkevidde af Hor-bjerget uden et eget punkt, i det, der i dag er Israels Negev mod Araba og den jordanske grænse."
  sr:
    - "Мосирот, у Поновљеном закону Мосера, био је логор Израиља у пустињи, познат из два помена која се тешко слажу. Списак станица у Књизи Бројева именује га између Асмоне и Бене-Јакана: „А из Аселмона отишавши стадоше у логор у Мосироту. А из Мосирота отишавши стадоше у логор у Ванакану.“ Поновљени закон даје та два у другом редоследу и додаје оно што Књига Бројева каже за гору Ор: „А синови Израиљеви пођоше од Вирота, синова Јаканових у Мосеру. Онде умре Арон и онде би погребен; а Елеазар, син његов поста свештеник на његово место.“ Име значи „окови“ или „казне“, и ниједан догађај није везан за њега."
    - "Како се та два помена уклапају, старо је питање. Књига Бројева смешта Аронову смрт на гору Ор, седам станица после Мосирота, у четрдесетој години; Поновљени закон у Мосеру, пре Бене-Јакана. Читаоци су одговорили да је Мосера био логор у подножју горе, а итинерар наводи гору њеним сопственим именом; да је Израиљ пролазио кроз ове станице двапут, силазећи у Есион-Гавер и враћајући се; или да Поновљени закон чува другачије предање о путу и о Ароновом гробу. Ништа од тога не може се проверити на терену, пошто нити Мосирот нити Бене-Јакан нису нађени, а место горе Ор је и само спорно."
    - "Логор се стога тражи где год се тражи гора Ор: близу Петре на ободу Едома, ако је Џебел Харун та гора, или на граници пустиње Син и висоравни Негева, ако се тражи ближе Кадису. Ниједно предање га није у старини обележило. Мапа га смешта на домак горе Ор без сопствене тачке, у данашњем Негеву Израела према Арави и јорданској граници."
