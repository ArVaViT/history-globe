# Overview article (ADR 0007). Mainstream facts only; the camp is unlocated and tied to Mount Hor, whose article is not restated; the two accounts of Aaron's death are set side by side without a verdict.
id: moseroth
place: a88331e
title:
  en: "Moseroth"
  ru: "Мосероф"
  uk: "Мосерот"
  es: "Moserot"
  pt: "Moserote"
  de: "Moserot"
  fr: "Moséroth"
body:
  en:
    - "Moseroth, in Deuteronomy Moserah, was a camp of Israel in the wilderness, known from two notices that do not easily agree. The list of stations in Numbers names it between Hashmonah and Bene-jaakan: “And they departed from Hashmonah, and encamped at Moseroth. And they departed from Moseroth, and pitched in Bene-jaakan.” Deuteronomy gives the two in the other order and adds what Numbers says of Mount Hor: “And the children of Israel took their journey from Beeroth of the children of Jaakan to Mosera: there Aaron died, and there he was buried; and Eleazar his son ministered in the priest's office in his stead.” The name means “bonds” or “chastisements”, and no event is attached to it."
    - "How the two notices fit is an old question. Numbers puts Aaron's death on Mount Hor, seven stations after Moseroth, in the fortieth year; Deuteronomy puts it at Moserah, before Bene-jaakan. Readers have answered that Moserah was the camp at the mountain's foot and the itinerary lists the mountain by its own name; that Israel passed these stations twice, going down to Ezion-geber and coming back; or that Deuteronomy preserves a different tradition of the route and of Aaron's grave. None of this can be tested on the ground, since neither Moseroth nor Bene-jaakan has been found and the site of Mount Hor is itself disputed."
    - "The camp is therefore sought wherever Mount Hor is sought: near Petra on the edge of Edom, if Jebel Harun is the mountain, or on the border of the wilderness of Zin and the Negev highlands, if it is looked for nearer Kadesh. No tradition marked it in antiquity. The map places it within reach of Mount Hor without a point of its own, in what is today the Negev of Israel toward the Arabah and the Jordanian border."
  ru:
    - "Мосероф, во Второзаконии Мозер, был станом Израиля в пустыне, известным по двум известиям, которые нелегко согласовать. Перечень станов в книге Чисел называет его между Хашмоной и Бене-Яаканом: «И отправились из Хашмоны и расположились станом в Мосерофе. И отправились из Мосерофа и расположились станом в Бене-Яакане». Второзаконие даёт эти два стана в обратном порядке и прибавляет то, что книга Чисел говорит о горе Ор: «И сыны Израилевы отправились из Беероф-Бене-Яакана в Мозер; там умер Аарон и погребен там, и стал священником вместо него сын его Елеазар». Имя значит «узы» или «наказания», и никакого события с ним не связано."
    - "Как согласовать эти два известия — старый вопрос. Книга Чисел помещает смерть Аарона на горе Ор, через семь станов после Мосерофа, в сороковой год; Второзаконие — в Мозере, перед Бене-Яаканом. Читатели отвечали, что Мозер был станом у подножия горы, а перечень называет гору её собственным именем; что Израиль проходил эти станы дважды, спускаясь к Ецион-Гаверу и возвращаясь; или что Второзаконие хранит иное предание о пути и о могиле Аарона. Ничего из этого нельзя проверить на местности: ни Мосероф, ни Бене-Яакан не найдены, а место горы Ор само спорно."
    - "Поэтому стан ищут там же, где ищут гору Ор: у Петры на краю Едома, если гора — Джебель-Харун, или на границе пустыни Син и Негевского нагорья, если её ищут ближе к Кадесу. В древности его не отмечало никакое предание. На карте он помещён в пределах досягаемости от горы Ор без собственной точки, в нынешнем Негеве Израиля, в сторону Аравы и иорданской границы."
  uk:
    - "Мосерот, у Повторенні Закону Мосера, був табором Ізраїлю в пустелі, відомим із двох записів, які нелегко узгодити. Перелік стоянок у Книзі Чисел називає його між Хашмоною і Бене-Яаканом: «І рушили з Гашмона та й отаборились у Мозеротї. І рушили з Мозерота та й отаборились у Бене-Яаканї.» Повторення Закону дає їх у зворотному порядку і додає те, що Книга Чисел говорить про гору Гор: «І рушили сини Ізрайлеві від Беерот-Бне-Яакану до Мозери. Там умер Арон і там поховано його, і намість його став сьвященником Єлеазар, син його.» Назва означає «пута» або «покарання», і жодної події з нею не пов’язано."
    - "Як ці два записи поєднуються, є давнім питанням. Книга Чисел ставить смерть Аарона на горі Гор, через сім стоянок після Мосерота, у сороковому році; Повторення Закону — у Мосері, перед Бене-Яаканом. Читачі відповідали, що Мосера була табором біля підніжжя гори, а маршрут називає гору її власним ім’ям; що Ізраїль проходив ці стоянки двічі, спускаючись до Ецйон-Гевера і повертаючись; або що Повторення Закону зберігає іншу традицію про маршрут і могилу Аарона. Ніщо з цього не можна перевірити на місці, бо ні Мосерота, ні Бене-Яакану не знайдено, а місце гори Гор саме спірне."
    - "Табір, отже, шукають там, де шукають гору Гор: поблизу Петри на краю Едому, якщо гора — Джебель-Гарун, або на межі пустелі Сін і нагір’я Негеву, якщо шукати її ближче до Кадеса. Жодна традиція не позначала його в давнину. Мапа розміщує його в межах досяжності гори Гор без власної точки, в сучасному Негеві Ізраїлю в бік Арави й йорданського кордону."
  es:
    - "Moserot, en Deuteronomio Moserá, fue un campamento de Israel en el desierto, conocido por dos noticias que no concuerdan fácilmente. La lista de estaciones de Números la nombra entre Hasmona y Bene-jaacán: «Y partidos de Hasmona, asentaron en Moseroth. Y partidos de Moseroth, asentaron en Bene-jaacán». Deuteronomio da los dos en el otro orden y añade lo que Números dice del monte Hor: «Después partieron los hijos de Israel de Beerot-bene-jacaam á Moserá: allí murió Aarón, y allí fué sepultado; y en lugar suyo tuvo el sacerdocio su hijo Eleazar». El nombre significa «ataduras» o «castigos», y no se le asocia ningún suceso."
    - "Cómo encajan las dos noticias es una vieja cuestión. Números sitúa la muerte de Aarón en el monte Hor, siete estaciones después de Moserot, en el año cuarenta; Deuteronomio la sitúa en Moserá, antes de Bene-jaacán. Los lectores han respondido que Moserá era el campamento al pie de la montaña y que el itinerario enumera la montaña por su propio nombre; que Israel pasó dos veces por estas estaciones, bajando a Ezión-geber y volviendo; o que Deuteronomio conserva una tradición distinta de la ruta y de la tumba de Aarón. Nada de esto puede comprobarse sobre el terreno, pues ni Moserot ni Bene-jaacán han sido hallados y el emplazamiento del monte Hor se discute a su vez."
    - "El campamento se busca, por tanto, dondequiera que se busque el monte Hor: cerca de Petra, en el borde de Edom, si la montaña es el Yebel Harún, o en la frontera del desierto de Zin y las tierras altas del Néguev, si se busca más cerca de Cades. Ninguna tradición lo señaló en la antigüedad. El mapa lo sitúa al alcance del monte Hor sin un punto propio, en lo que hoy es el Néguev de Israel, hacia el Arabá y la frontera jordana."
  pt:
    - "Moserote, em Deuteronômio Moserá, foi um acampamento de Israel no deserto, conhecido por duas notícias que dificilmente concordam. A lista de etapas em Números a nomeia entre Hasmona e Bene-Jaacã: “Partiram de Hasmona e acamparam em Moserote. Partiram de Moserote e acamparam em Bene-Jaacã.” Deuteronômio dá os dois na outra ordem e acrescenta o que Números diz do monte Hor: “Os filhos de Israel viajaram de Beerote-Bene-Jaacã para Moserá. Lá Arão morreu, e lá foi sepultado; e Eleazar, seu filho, ministrou no ofício sacerdotal em seu lugar.” O nome significa “laços” ou “castigos”, e nenhum acontecimento está ligado a ele."
    - "Como as duas notícias se conciliam é uma velha questão. Números põe a morte de Arão no monte Hor, sete etapas depois de Moserote, no quadragésimo ano; Deuteronômio a põe em Moserá, antes de Bene-Jaacã. Os leitores responderam que Moserá era o acampamento ao pé da montanha e o itinerário lista a montanha por seu próprio nome; que Israel passou por essas etapas duas vezes, descendo a Eziom-Geber e voltando; ou que Deuteronômio preserva outra tradição da rota e do túmulo de Arão. Nada disso pode ser testado no terreno, pois nem Moserote nem Bene-Jaacã foram achadas e o sítio do monte Hor é ele próprio disputado."
    - "O acampamento é, portanto, procurado onde quer que se procure o monte Hor: perto de Petra, na orla de Edom, se o Jebel Harun é a montanha, ou na fronteira do deserto de Zim e das terras altas do Neguebe, se é procurado mais perto de Cades. Nenhuma tradição o assinalou na Antiguidade. O mapa o põe ao alcance do monte Hor sem ponto próprio, no que é hoje o Neguebe de Israel rumo à Arabá e à fronteira jordaniana."
  de:
    - "Moserot, im 5. Buch Mose Mosera, war ein Lager Israels in der Wüste, bekannt aus zwei Notizen, die nicht leicht zusammenpassen. Die Stationenliste in 4. Mose nennt es zwischen Haschmona und Bne-Jaakan: „Von Hasmona zogen sie aus und lagerten sich in Moseroth. Von Moseroth zogen sie aus und lagerten sich in Bne-Jaakan.“ Das 5. Buch Mose gibt die beiden in anderer Reihenfolge und fügt hinzu, was 4. Mose vom Berg Hor sagt: „Und die Kinder Israel zogen aus von Beeroth-Bne-Jaakan gen Moser. Daselbst starb Aaron, und ist daselbst begraben; und sein Sohn Eleasar ward für ihn Priester.“ Der Name bedeutet „Fesseln“ oder „Züchtigungen“, und mit ihm ist kein Ereignis verbunden."
    - "Wie die beiden Notizen zusammenpassen, ist eine alte Frage. 4. Mose legt Aarons Tod auf den Berg Hor, sieben Stationen nach Moserot, im vierzigsten Jahr; das 5. Buch Mose legt ihn nach Mosera, vor Bne-Jaakan. Leser haben geantwortet, Mosera sei das Lager am Fuß des Berges gewesen und die Reiseliste nenne den Berg mit eigenem Namen; Israel sei diese Stationen zweimal passiert, hinab nach Ezjon-Geber und zurück; oder das 5. Buch Mose bewahre eine andere Überlieferung des Weges und von Aarons Grab. Nichts davon lässt sich am Boden prüfen, da weder Moserot noch Bne-Jaakan gefunden wurde und die Lage des Berges Hor selbst umstritten ist."
    - "Das Lager wird daher überall gesucht, wo der Berg Hor gesucht wird: nahe Petra am Rand Edoms, wenn Jebel Harun der Berg ist, oder an der Grenze der Wüste Zin und des Negev-Hochlands, wenn man ihn näher bei Kadesch sucht. Keine Überlieferung bezeichnete es in der Antike. Die Karte setzt es in Reichweite des Berges Hor ohne eigenen Punkt, im heutigen Negev Israels zur Araba und zur jordanischen Grenze hin."
  fr:
    - "Moséroth, Moséra dans le Deutéronome, était un campement d’Israël dans le désert, connu par deux notices qui s’accordent mal. La liste des étapes des Nombres la nomme entre Haschmona et Bené-Jaakan : « Ils partirent de Haschmona, et campèrent à Moséroth. Ils partirent de Moséroth, et campèrent à Bené-Jaakan. » Le Deutéronome donne les deux dans l’autre ordre et ajoute ce que les Nombres disent du mont Hor : « Les enfants d’Israël partirent de Beéroth-Bené Jaakan pour Moséra. C’est là que mourut Aaron, et qu’il fut enterré ; Éléazar, son fils, lui succéda dans le sacerdoce. » Le nom signifie « liens » ou « châtiments », et aucun événement ne s’y rattache."
    - "Comment les deux notices s’accordent est une vieille question. Les Nombres placent la mort d’Aaron sur le mont Hor, sept étapes après Moséroth, la quarantième année ; le Deutéronome la place à Moséra, avant Bené-Jaakan. On a répondu que Moséra était le camp au pied de la montagne et que la liste d’itinéraire nomme la montagne par son propre nom ; qu’Israël passa deux fois par ces étapes, en descendant à Étsjon-Guéber et en revenant ; ou que le Deutéronome conserve une autre tradition de l’itinéraire et de la tombe d’Aaron. Rien de cela ne peut être vérifié sur le terrain, car ni Moséroth ni Bené-Jaakan n’ont été trouvées et l’emplacement du mont Hor est lui-même discuté."
    - "Le camp se cherche donc là où l’on cherche le mont Hor : près de Pétra, aux confins d’Édom, si le djebel Haroun est la montagne, ou à la frontière du désert de Tsin et des hautes terres du Négev, si on la cherche plus près de Qadesh. Aucune tradition ne la marqua dans l’Antiquité. La carte la place à portée du mont Hor sans point propre, dans l’actuel Négev d’Israël, vers l’Araba et la frontière jordanienne."
