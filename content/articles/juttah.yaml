body:
  en:
    - "Juttah was a town in the hill country of Judah about 8 km south of Hebron, listed with Maon, Carmel and Ziph in the district of the southern hills. The name lives on in Yatta, a large Palestinian town on a hill at the edge of the Hebron hills where the cultivated land gives way to the wilderness, and the identification is not disputed. Eusebius knew Jettan as a very large village of Jews in the Daroma, the south country, eighteen miles from Eleutheropolis. What is known of its early history comes from the texts."
    - "Joshua names it among the towns of Judah “in the mountains”: “Maon, Carmel, and Ziph, and Juttah”. It was then given, with Hebron, Libnah, Jattir, Eshtemoa, Holon and Debir, to the priests, the sons of Aaron: “And Ain with her suburbs, and Juttah with her suburbs, and Beth-shemesh with her suburbs; nine cities out of those two tribes.” The parallel list in Chronicles leaves Juttah out, and Gibeon too, so that it names eleven towns where it counts thirteen; most scholars take this for a copyist's slip rather than a different tradition. The Bible says nothing more of the place."
    - "Since the eighteenth century some have proposed that Juttah, a priestly town in the hills, is the unnamed “city of Juda” in the hill country to which Mary went to visit Elisabeth, the wife of the priest Zacharias; but Luke gives no name, and the suggestion rests mainly on the likeness of the words Juda and Juttah. Today Yatta, with more than 60,000 inhabitants, is one of the largest towns of the Hebron Governorate in the West Bank, and the hamlets of Masafer Yatta lie to its south between the town and the wilderness."
  ru:
    - "Юта (в книге Иисуса Навина 21:16 — Ютта) была городом в нагорье Иуды примерно в 8 км к югу от Хеврона, названным вместе с Маоном, Кармилом и Зифом в округе южных гор. Имя живёт в Ятте, большом палестинском городе на холме у края Хевронских гор, где возделанная земля сменяется пустыней, и отождествление не оспаривается. Евсевий знал Иеттан как очень большое иудейское селение в Дароме, южной стране, в восемнадцати милях от Елевферополя. Всё, что известно о ранней истории города, известно по текстам."
    - "Книга Иисуса Навина называет Юту среди городов Иуды «на горах»: «Маон, Кармил, Зиф и Юта». Затем её отдали вместе с Хевроном, Ливной, Иаттиром, Ештемо, Холоном и Давиром священникам, сыновьям Аарона: «Аин и предместья его, Ютту и предместья ее, Беф-Шемеш и предместья его: девять городов от двух колен сих». Параллельный список в Паралипоменоне опускает Юту, а также Гаваон, так что там, где насчитано тринадцать городов, названы лишь одиннадцать; большинство учёных видят в этом ошибку переписчика, а не иное предание. Больше Библия об этом месте ничего не говорит."
    - "С XVIII века некоторые предполагали, что Юта, священнический город в горах, и есть безымянный «город Иудин» в нагорной стране, куда Мария пошла навестить Елисавету, жену священника Захарии; но Лука имени не называет, и догадка держится главным образом на сходстве слов Иуда и Юта. Сегодня Ятта, где живёт более 60 тысяч человек, — один из крупнейших городов провинции Хеврон на Западном берегу, а к югу от неё, между городом и пустыней, лежат хутора Масафер-Ятта."
  uk:
    - "Ютта була містом у гірській країні Юди приблизно за 8 км на південь від Хеврона, перерахованим з Маоном, Кармелем і Зіфом в окрузі південних пагорбів. Назва живе в Ятті, великому палестинському місті на пагорбі на краю хевронських пагорбів, де оброблювана земля поступається пустелі, і ототожнення не оспорюється. Євсевій знав Єттан як дуже велике село юдеїв у Даромі, південному краї, за вісімнадцять миль від Елевферополя. Що відомо про ранню історію міста, походить з текстів."
    - "Книга Ісуса Навина називає її серед міст Юди «По горах»: «Маон, Кармил, Сиф і Юта». Потім її дали, разом з Хевроном, Лівною, Яттіром, Ештемоа, Холоном і Девіром, священикам, синам Аарона: «Анн укупі з пасовищами його, Ютту вкупі з пасовищами її, та Бет-Семеш укупі з передмістями, що тягли до його — девять городів від обох названих поколїнь». Паралельний перелік у Хроніках опускає Ютту, а також Гаваон, так що називає одинадцять міст там, де рахує тринадцять; більшість дослідників вважає це помилкою переписувача, а не іншою традицією. Більше Біблія про місце нічого не каже."
    - "З XVIII ст. дехто пропонував, що Ютта, священицьке місто в пагорбах, — це безіменне «город Юдин» у гірській країні, куди Марія пішла відвідати Єлисавету, дружину священика Захарії; але Лука не дає назви, і ця пропозиція спирається головно на схожість слів Юда й Ютта. Сьогодні Ятта, з понад 60 000 мешканців, — одне з найбільших міст Хевронського округу на Західному березі, а хутори Масафер-Ятта лежать на південь від неї між містом і пустелею."
  es:
    - "Jutá era una población de la región montañosa de Judá, a unos 8 km al sur de Hebrón, enumerada con Maón, Carmel y Zif en el distrito de las colinas meridionales. El nombre pervive en Yatta, una gran ciudad palestina sobre una colina en el borde de las colinas de Hebrón donde la tierra cultivada da paso al desierto, y la identificación no se discute. Eusebio conocía Jettan como una aldea muy grande de judíos en el Daroma, el país del sur, a dieciocho millas de Eleuterópolis. Lo que se sabe de su historia temprana procede de los textos."
    - "Josué la nombra entre las ciudades de Judá «en las montañas»: «Maón, Carmel, y Ziph, y Juta». Fue luego dada, con Hebrón, Libna, Jatir, Estemoa, Holón y Debir, a los sacerdotes, hijos de Aarón: «A Ain con sus ejidos, á Jutta con sus ejidos, y á Beth-semes con sus ejidos; nueve villas de estas dos tribus». La lista paralela de Crónicas omite Jutá, y también Gabaón, de modo que nombra once ciudades donde cuenta trece; la mayoría de los estudiosos lo toman por un desliz de copista más que por una tradición distinta. La Biblia no dice nada más del lugar."
    - "Desde el siglo XVIII algunos han propuesto que Jutá, una ciudad sacerdotal de las colinas, es la anónima «ciudad de Judá» de la región montañosa a la que fue María a visitar a Elisabet, la mujer del sacerdote Zacarías; pero Lucas no da nombre, y la sugerencia se apoya sobre todo en el parecido de las palabras Judá y Jutá. Hoy Yatta, con más de 60 000 habitantes, es una de las mayores ciudades de la gobernación de Hebrón, en Cisjordania, y las aldeas de Masafer Yatta se hallan al sur de ella, entre la ciudad y el desierto."
  pt:
    - "Jutá era uma cidade na região montanhosa de Judá, a cerca de 8 km ao sul de Hebrom, listada com Maom, Carmelo e Zife no distrito das colinas do sul. O nome vive em Yatta, uma grande cidade palestina numa colina na orla das colinas de Hebrom onde a terra cultivada cede ao deserto, e a identificação não é contestada. Eusébio conheceu Jettan como uma aldeia muito grande de judeus no Daroma, a região sul, a dezoito milhas de Eleutéropolis. O que se sabe de sua história antiga vem dos textos."
    - "Josué a nomeia entre as cidades de Judá “na região montanhosa”: “Maom, Carmelo, Zife, Jutá”. Foi depois dada, com Hebrom, Libna, Jatir, Estemoa, Holom e Debir, aos sacerdotes, filhos de Arão: “Aim com suas pastagens, Jutá com suas pastagens e Bete-Semes com suas pastagens: nove cidades daquelas duas tribos.” A lista paralela de Crônicas omite Jutá, e também Gibeão, de modo que nomeia onze cidades onde conta treze; a maioria dos estudiosos toma isso por lapso de copista e não por outra tradição. A Bíblia nada mais diz do lugar."
    - "Desde o século XVIII, alguns propuseram que Jutá, cidade sacerdotal nas colinas, é a inominada “cidade de Judá” na região montanhosa para onde Maria foi visitar Isabel, esposa do sacerdote Zacarias; mas Lucas não dá nome, e a sugestão repousa sobretudo na semelhança das palavras Judá e Jutá. Hoje Yatta, com mais de 60.000 habitantes, é uma das maiores cidades da província de Hebrom, na Cisjordânia, e os povoados de Masafer Yatta ficam ao sul dela, entre a cidade e o deserto."
  de:
    - "Juta war eine Stadt im Bergland Judas etwa 8 km südlich von Hebron, mit Maon, Karmel und Sif im Bezirk der Südberge aufgeführt. Der Name lebt in Jatta fort, einer großen palästinensischen Stadt auf einem Hügel am Rand der Hebroner Berge, wo das Kulturland der Wüste weicht, und die Gleichsetzung ist unbestritten. Eusebius kannte Jettan als sehr großes Dorf von Juden in der Daroma, dem Südland, achtzehn Meilen von Eleutheropolis. Was von ihrer frühen Geschichte bekannt ist, stammt aus den Texten."
    - "Josua nennt sie unter den Städten Judas „auf dem Gebirge“: „Maon, Karmel, Siph, Jutta“. Sie wurde dann mit Hebron, Libna, Jattir, Eschtemoa, Holon und Debir den Priestern, den Söhnen Aarons, gegeben: „Ain und seine Vorstädte, Jutta und seine Vorstädte, Beth-Semes und seine Vorstädte, neun Städte von diesen zwei Stämmen“. Die Parallelliste der Chronik lässt Juta aus, und Gibeon auch, sodass sie elf Städte nennt, wo sie dreizehn zählt; die meisten Forscher halten das für einen Schreiberfehler und nicht für eine andere Überlieferung. Die Bibel sagt sonst nichts über den Ort."
    - "Seit dem 18. Jahrhundert haben manche vorgeschlagen, Juta, eine Priesterstadt im Bergland, sei die ungenannte „Stadt Juda's“ im Gebirge, zu der Maria ging, um Elisabeth, die Frau des Priesters Zacharias, zu besuchen; doch Lukas nennt keinen Namen, und der Vorschlag beruht vor allem auf der Ähnlichkeit der Wörter Juda und Juta. Heute ist Jatta mit mehr als 60 000 Einwohnern eine der größten Städte des Gouvernements Hebron im Westjordanland, und die Weiler von Masafer Jatta liegen südlich davon zwischen der Stadt und der Wüste."
  fr:
    - "Jutta était une ville de la montagne de Juda à environ 8 km au sud d’Hébron, inscrite avec Maon, Carmel et Ziph dans le district des collines méridionales. Le nom survit à Yatta, grande ville palestinienne sur une colline au bord des collines d’Hébron, là où les terres cultivées cèdent la place au désert, et l’identification n’est pas contestée. Eusèbe connaissait Iettan comme un très grand village de Juifs dans le Daroma, le pays du sud, à dix-huit milles d’Éleuthéropolis. Ce que l’on sait de son histoire ancienne vient des textes."
    - "Josué la nomme parmi les villes de Juda « dans la montagne » : « Maon, Carmel, Ziph, Juta ». Elle fut ensuite donnée, avec Hébron, Libna, Jatthir, Eschthemoa, Holon et Debir, aux prêtres, fils d’Aaron : « Aïn et sa banlieue, Jutta et sa banlieue, et Beth-Schémesch et sa banlieue, neuf villes de ces deux tribus. » La liste parallèle des Chroniques omet Jutta, et Gabaon aussi, de sorte qu’elle nomme onze villes là où elle en compte treize ; la plupart des spécialistes y voient une erreur de copiste plutôt qu’une autre tradition. La Bible ne dit rien de plus du lieu."
    - "Depuis le XVIIIe siècle, certains ont proposé que Jutta, ville sacerdotale des collines, soit la « ville de Juda » sans nom, dans la montagne, où Marie alla rendre visite à Élisabeth, femme du prêtre Zacharie ; mais Luc ne donne aucun nom, et la suggestion repose surtout sur la ressemblance des mots Juda et Jutta. Aujourd’hui, Yatta, avec plus de 60 000 habitants, est l’une des plus grandes villes du gouvernorat d’Hébron en Cisjordanie, et les hameaux de Masafer Yatta s’étendent au sud entre la ville et le désert."
  pl:
    - "Jutta było miastem w górach Judy około 8 km na południe od Hebronu, wymienionym z Maonem, Karmelem i Zifem w okręgu południowych wzgórz. Nazwa żyje w Jatta, dużym palestyńskim mieście na wzgórzu na skraju wzgórz Hebronu, gdzie ziemia uprawna ustępuje pustyni, a utożsamienie nie jest kwestionowane. Euzebiusz znał Jettan jako bardzo dużą wieś żydowską w Daromie, kraju południa, osiemnaście mil od Eleuteropolis. To, co wiadomo o wczesnych dziejach miasta, pochodzi z tekstów."
    - "Jozue wymienia je wśród miast Judy „na górze”: „Maon, Karmel, i Zyf, i Juta”. Następnie oddano je, wraz z Hebronem, Libną, Jattir, Esztemoa, Cholonem i Debirem, kapłanom, synom Aarona: „I Ain, i przedmieścia jego, i Jeta, i przedmieścia jego; Betsemes i przedmieścia jego; miast dziewięć z tegoż dwojga pokolenia”. Odpowiedni wykaz w Księgach Kronik pomija Juttę, a także Gibeon, tak że wymienia jedenaście miast tam, gdzie liczy trzynaście; większość uczonych bierze to za pomyłkę kopisty, nie za inną tradycję. Biblia nie mówi o miejscu nic więcej."
    - "Od XVIII w. niektórzy proponują, że Jutta, miasto kapłańskie w górach, to bezimienne miasto, do którego Maria „poszła w górną krainę z kwapieniem do miasta Judzkiego”, by odwiedzić Elżbietę, żonę kapłana Zachariasza; lecz Łukasz nie podaje nazwy, a sugestia opiera się głównie na podobieństwie słów Juda i Jutta. Dziś Jatta, z ponad 60 000 mieszkańców, jest jednym z największych miast prowincji Hebron na Zachodnim Brzegu, a przysiółki Masafer Jatta leżą na południe od niego, między miastem a pustynią."
  it:
    - "Iutta era una città sui monti di Giuda circa 8 km a sud di Ebron, elencata con Maon, Carmelo e Zif nel distretto delle colline meridionali. Il nome sopravvive a Yatta, una grande città palestinese su una collina al margine delle colline di Ebron dove la terra coltivata cede al deserto, e l’identificazione non è contestata. Eusebio conosceva Jettan come un grandissimo villaggio di Giudei nel Daroma, il paese del sud, a diciotto miglia da Eleuteropoli. Ciò che si sa della sua storia antica proviene dai testi."
    - "Giosuè la nomina fra le città di Giuda «Nella contrada montuosa»: «Maon, Carmel, Zif, Iuta». Fu poi data, con Ebron, Libna, Iattir, Estemoa, Colon e Debir, ai sacerdoti, figli di Aronne: «Ain e il suo contado, Iutta e il suo contado, e Beth-Scemesh e il suo contado: nove città di queste due tribù». L’elenco parallelo delle Cronache omette Iutta, e anche Gabaon, così che nomina undici città dove ne conta tredici; i più lo ritengono una svista di un copista piuttosto che una tradizione diversa. La Bibbia non dice altro del luogo."
    - "Dal Settecento alcuni hanno proposto che Iutta, città sacerdotale sui monti, sia la «città di Giuda» senza nome nella regione montuosa dove Maria andò a visitare Elisabetta, moglie del sacerdote Zaccaria; ma Luca non dà alcun nome, e il suggerimento poggia soprattutto sulla somiglianza delle parole Juda e Juttah. Oggi Yatta, con più di 60.000 abitanti, è una delle maggiori città del governatorato di Ebron in Cisgiordania, e i casali di Masafer Yatta si trovano a sud di essa fra la città e il deserto."
  nl:
    - "Juta was een stad in het bergland van Juda, ongeveer 8 km ten zuiden van Hebron, vermeld met Maön, Karmel en Zif in het district van de zuidelijke heuvels. De naam leeft voort in Yatta, een grote Palestijnse stad op een heuvel aan de rand van de heuvels van Hebron waar het bebouwde land overgaat in de woestijn, en de identificatie wordt niet betwist. Eusebius kende Jettan als een zeer groot dorp van Joden in de Daroma, het zuiderland, achttien mijl van Eleutheropolis. Wat van haar vroege geschiedenis bekend is, komt uit de teksten."
    - "Jozua noemt haar onder de steden van Juda “Op het gebergte”: “Maon, Karmel, en Zif, en Juta”. Daarna werd zij, met Hebron, Libna, Jattir, Estemoa, Cholon en Debir, aan de priesters gegeven, de zonen van Aäron: “En Ain en haar voorsteden, en Jutta en haar voorsteden, en Beth-Semes en haar voorsteden; negen steden van deze twee stammen.” De parallelle lijst in Kronieken laat Juta weg, en ook Gibeon, zodat zij elf steden noemt waar ze dertien telt; de meeste geleerden houden dit voor een schrijffout van een kopiist eerder dan een andere overlevering. De Bijbel zegt verder niets over de plaats."
    - "Sinds de 18e eeuw hebben sommigen voorgesteld dat Juta, een priesterstad in de heuvels, de ongenoemde “stad van Juda” in het bergland is waarheen Maria ging om Elizabet, de vrouw van de priester Zacharias, te bezoeken; maar Lukas geeft geen naam, en de suggestie berust vooral op de gelijkenis van de woorden Juda en Juta. Nu is Yatta, met meer dan 60.000 inwoners, een van de grootste steden van het gouvernement Hebron op de Westoever, en liggen de gehuchten van Masafer Yatta ten zuiden ervan tussen de stad en de woestijn."
  cs:
    - "Juta bylo město v judské pahorkatině asi 8 km jižně od Hebronu, uvedené s Maonem, Karmelem a Zífem v okrese jižních hor. Jméno žije v Jatta, velkém palestinském městě na pahorku na okraji hebronských hor, kde obdělávaná půda přechází v poušť, a ztotožnění není sporné. Eusebios znal Jettan jako velmi velkou židovskou vesnici v Daromě, jižní zemi, osmnáct mil od Eleutheropole. Co je známo o raných dějinách města, pochází z textů."
    - "Jozue jmenuje Juta mezi městy Judovými „na horách“: „Maon, Karmel a Zif, a Juta“. Pak bylo dáno, s Hebronem, Libnou, Jatirem, Eštemoou, Cholonem a Debírem, kněžím, synům Áronovým: „Také Ain s předměstím jeho, a Juta s podměstím jeho, i Betsemes a předměstí jeho, měst devět z toho dvojího pokolení.“ Paralelní seznam v Letopisech Juta vynechává, a také Gibeon, takže jmenuje jedenáct měst, kde počítá třináct; většina učenců to pokládá za opisovačský přepis, nikoli za jinou tradici. Bible o místě nic dalšího neříká."
    - "Od 18. století někteří navrhovali, že Juta, kněžské město v horách, je nejmenované „město Judovo“ v pahorkatině, kam šla Marie navštívit Alžbětu, ženu kněze Zachariáše; Lukáš však jméno nedává a návrh se opírá hlavně o podobnost slov Juda a Juta. Dnes je Jatta s více než 60 000 obyvateli jedním z největších měst hebronské gubernie na Západním břehu a vesničky Masáfer Jatta leží na jih od ní mezi městem a pouští."
  sv:
    - "Jutta var en stad i Juda bergsbygd omkring 8 km söder om Hebron, upptagen tillsammans med Maon, Karmel och Sif i distriktet i de södra bergen. Namnet lever kvar i Yatta, en stor palestinsk stad på en kulle i utkanten av Hebrons berg där odlingsmarken övergår i öknen, och identifieringen är obestridd. Eusebios kände Jettan som en mycket stor by med judar i Daroma, sydlandet, arton romerska mil från Eleutheropolis. Vad man vet om dess tidiga historia kommer från texterna."
    - "Josua nämner den bland Juda städer ”i Bergsbygden”: ”Maon, Karmel, Sif, Juta”. Den gavs sedan, med Hebron, Livna, Jattir, Eshtemoa, Holon och Devir, åt prästerna, Arons söner: ”Ain med dess utmarker, Jutta med dess utmarker och Bet-Semes med dess utmarker” – ”nio städer ur dessa två stammar”. Krönikeböckernas parallella förteckning utelämnar Jutta, och även Gibeon, så att den nämner elva städer där den räknar tretton; de flesta forskare ser detta som ett skrivarfel snarare än som en annan tradition. Bibeln säger inget mer om platsen."
    - "Sedan 1700-talet har somliga föreslagit att Jutta, en prästerlig stad i bergen, är den onämnda staden, ”en stad i Judeen, uppe i bergsbygden”, dit Maria gick för att besöka Elisabet, prästen Sakarias hustru; men Lukas anger inget namn, och förslaget vilar främst på likheten mellan orden Juda och Jutta. I dag är Yatta, med över 60 000 invånare, en av de största städerna i Hebrons guvernement på Västbanken, och byarna i Masafer Yatta ligger söder om staden, mellan staden och öknen."
