# Overview article (ADR 0007). Mainstream facts only; the identification with Yatta is undisputed; the guess that Juttah is the “city of Juda” of Luke 1 is given as a guess.
id: juttah
place: acc7184
title:
  en: "Juttah"
  ru: "Юта"
body:
  en:
    - "Juttah was a town in the hill country of Judah about 8 km south of Hebron, listed with Maon, Carmel and Ziph in the district of the southern hills. The name lives on in Yatta, a large Palestinian town on a hill at the edge of the Hebron hills where the cultivated land gives way to the wilderness, and the identification is not disputed. Eusebius knew Jettan as a very large village of Jews in the Daroma, the south country, eighteen miles from Eleutheropolis. The old core of the town stands on the ancient mound, which has never been excavated; what is known of its early history comes from the texts and from pottery on the surface."
    - "Joshua names it among the towns of Judah “in the mountains”: “Maon, Carmel, and Ziph, and Juttah”. It was then given, with Hebron, Libnah, Jattir, Eshtemoa, Holon and Debir, to the priests, the sons of Aaron: “And Ain with her suburbs, and Juttah with her suburbs, and Beth-shemesh with her suburbs; nine cities out of those two tribes.” The parallel list in Chronicles leaves Juttah out, and Gibeon too, so that it names eleven towns where it counts thirteen; most scholars take this for a copyist's slip rather than a different tradition. The Bible says nothing more of the place."
    - "Since the eighteenth century some have proposed that Juttah, a priestly town in the hills, is the unnamed “city of Juda” in the hill country to which Mary went to visit Elisabeth, the wife of the priest Zacharias; but Luke gives no name, and the suggestion rests on nothing more than the likeness of the words Juda and Juttah. Today Yatta, with more than 60,000 inhabitants, is one of the largest towns of the Hebron Governorate in the West Bank, and the hamlets of Masafer Yatta lie to its south between the town and the wilderness."
  ru:
    - "Юта (в книге Иисуса Навина 21:16 — Ютта) была городом в нагорье Иуды примерно в 8 км к югу от Хеврона, названным вместе с Маоном, Кармилом и Зифом в округе южных гор. Имя живёт в Ятте, большом палестинском городе на холме у края Хевронских гор, где возделанная земля сменяется пустыней, и отождествление не оспаривается. Евсевий знал Иеттан как очень большое иудейское селение в Дароме, южной стране, в восемнадцати милях от Елевферополя. Старое ядро города стоит на древнем холме, который никогда не раскапывали; всё, что известно о его ранней истории, известно по текстам и по черепкам на поверхности."
    - "Книга Иисуса Навина называет Юту среди городов Иуды «на горах»: «Маон, Кармил, Зиф и Юта». Затем её отдали вместе с Хевроном, Ливной, Иаттиром, Ештемо, Холоном и Давиром священникам, сыновьям Аарона: «Аин и предместья его, Ютту и предместья ее, Беф-Шемеш и предместья его: девять городов от двух колен сих». Параллельный список в Паралипоменоне опускает Юту, а также Гаваон, так что там, где насчитано тринадцать городов, названы лишь одиннадцать; большинство учёных видят в этом ошибку переписчика, а не иное предание. Больше Библия об этом месте ничего не говорит."
    - "С XVIII века некоторые предполагали, что Юта, священнический город в горах, и есть безымянный «город Иудин» в нагорной стране, куда Мария пошла навестить Елисавету, жену священника Захарии; но Лука имени не называет, и догадка держится лишь на сходстве слов Иуда и Юта. Сегодня Ятта, где живёт более 60 тысяч человек, — один из крупнейших городов провинции Хеврон на Западном берегу, а к югу от неё, между городом и пустыней, лежат хутора Масафер-Ятта."
