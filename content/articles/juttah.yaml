# Overview article (ADR 0007). Mainstream facts only; the identification with Yatta is undisputed; the guess that Juttah is the “city of Juda” of Luke 1 is given as a guess.
id: juttah
place: acc7184
title:
  en: "Juttah"
  ru: "Юта"
  uk: "Ютта"
  es: "Jutá"
  pt: "Jutá"
  de: "Juta"
  fr: "Jutta"
body:
  en:
    - "Juttah was a town in the hill country of Judah about 8 km south of Hebron, listed with Maon, Carmel and Ziph in the district of the southern hills. The name lives on in Yatta, a large Palestinian town on a hill at the edge of the Hebron hills where the cultivated land gives way to the wilderness, and the identification is not disputed. Eusebius knew Jettan as a very large village of Jews in the Daroma, the south country, eighteen miles from Eleutheropolis. The old core of the town stands on the ancient mound, which has never been excavated; what is known of its early history comes from the texts and from pottery on the surface."
    - "Joshua names it among the towns of Judah “in the mountains”: “Maon, Carmel, and Ziph, and Juttah”. It was then given, with Hebron, Libnah, Jattir, Eshtemoa, Holon and Debir, to the priests, the sons of Aaron: “And Ain with her suburbs, and Juttah with her suburbs, and Beth-shemesh with her suburbs; nine cities out of those two tribes.” The parallel list in Chronicles leaves Juttah out, and Gibeon too, so that it names eleven towns where it counts thirteen; most scholars take this for a copyist's slip rather than a different tradition. The Bible says nothing more of the place."
    - "Since the eighteenth century some have proposed that Juttah, a priestly town in the hills, is the unnamed “city of Juda” in the hill country to which Mary went to visit Elisabeth, the wife of the priest Zacharias; but Luke gives no name, and the suggestion rests on nothing more than the likeness of the words Juda and Juttah. Today Yatta, with more than 60,000 inhabitants, is one of the largest towns of the Hebron Governorate in the West Bank, and the hamlets of Masafer Yatta lie to its south between the town and the wilderness."
  ru:
    - "Юта (в книге Иисуса Навина 21:16 — Ютта) была городом в нагорье Иуды примерно в 8 км к югу от Хеврона, названным вместе с Маоном, Кармилом и Зифом в округе южных гор. Имя живёт в Ятте, большом палестинском городе на холме у края Хевронских гор, где возделанная земля сменяется пустыней, и отождествление не оспаривается. Евсевий знал Иеттан как очень большое иудейское селение в Дароме, южной стране, в восемнадцати милях от Елевферополя. Старое ядро города стоит на древнем холме, который никогда не раскапывали; всё, что известно о его ранней истории, известно по текстам и по черепкам на поверхности."
    - "Книга Иисуса Навина называет Юту среди городов Иуды «на горах»: «Маон, Кармил, Зиф и Юта». Затем её отдали вместе с Хевроном, Ливной, Иаттиром, Ештемо, Холоном и Давиром священникам, сыновьям Аарона: «Аин и предместья его, Ютту и предместья ее, Беф-Шемеш и предместья его: девять городов от двух колен сих». Параллельный список в Паралипоменоне опускает Юту, а также Гаваон, так что там, где насчитано тринадцать городов, названы лишь одиннадцать; большинство учёных видят в этом ошибку переписчика, а не иное предание. Больше Библия об этом месте ничего не говорит."
    - "С XVIII века некоторые предполагали, что Юта, священнический город в горах, и есть безымянный «город Иудин» в нагорной стране, куда Мария пошла навестить Елисавету, жену священника Захарии; но Лука имени не называет, и догадка держится лишь на сходстве слов Иуда и Юта. Сегодня Ятта, где живёт более 60 тысяч человек, — один из крупнейших городов провинции Хеврон на Западном берегу, а к югу от неё, между городом и пустыней, лежат хутора Масафер-Ятта."
  uk:
    - "Ютта була містом у гірській країні Юди приблизно за 8 км на південь від Хеврона, перерахованим з Маоном, Кармелем і Зіфом в окрузі південних пагорбів. Назва живе в Ятті, великому палестинському місті на пагорбі на краю хевронських пагорбів, де оброблювана земля поступається пустелі, і ототожнення не оспорюється. Євсевій знав Єттан як дуже велике село юдеїв у Даромі, південному краї, за вісімнадцять миль від Елевферополя. Старе ядро міста стоїть на давньому городищі, яке ніколи не розкопували; що відомо про його ранню історію, походить з текстів і з кераміки на поверхні."
    - "Книга Ісуса Навина називає її серед міст Юди «По горах»: «Маон, Кармил, Сиф і Юта». Потім її дали, разом з Хевроном, Лівною, Яттіром, Ештемоа, Холоном і Девіром, священикам, синам Аарона: «Анн укупі з пасовищами його, Ютту вкупі з пасовищами її, та Бет-Семеш укупі з передмістями, що тягли до його — девять городів від обох названих поколїнь». Паралельний перелік у Хроніках опускає Ютту, а також Гаваон, так що називає одинадцять міст там, де рахує тринадцять; більшість дослідників вважає це помилкою переписувача, а не іншою традицією. Більше Біблія про місце нічого не каже."
    - "З XVIII ст. дехто пропонував, що Ютта, священицьке місто в пагорбах, — це безіменне «город Юдин» у гірській країні, куди Марія пішла відвідати Єлисавету, дружину священика Захарії; але Лука не дає назви, і ця пропозиція спирається лише на схожість слів Юда й Ютта. Сьогодні Ятта, з понад 60 000 мешканців, — одне з найбільших міст Хевронського округу на Західному березі, а хутори Масафер-Ятта лежать на південь від неї між містом і пустелею."
  es:
    - "Jutá era una población de la región montañosa de Judá, a unos 8 km al sur de Hebrón, enumerada con Maón, Carmel y Zif en el distrito de las colinas meridionales. El nombre pervive en Yatta, una gran ciudad palestina sobre una colina en el borde de las colinas de Hebrón donde la tierra cultivada da paso al desierto, y la identificación no se discute. Eusebio conocía Jettan como una aldea muy grande de judíos en el Daroma, el país del sur, a dieciocho millas de Eleuterópolis. El casco antiguo de la ciudad se alza sobre el antiguo montículo, que nunca ha sido excavado; lo que se sabe de su historia temprana procede de los textos y de la cerámica de superficie."
    - "Josué la nombra entre las ciudades de Judá «en las montañas»: «Maón, Carmel, y Ziph, y Juta». Fue luego dada, con Hebrón, Libna, Jatir, Estemoa, Holón y Debir, a los sacerdotes, hijos de Aarón: «A Ain con sus ejidos, á Jutta con sus ejidos, y á Beth-semes con sus ejidos; nueve villas de estas dos tribus». La lista paralela de Crónicas omite Jutá, y también Gabaón, de modo que nombra once ciudades donde cuenta trece; la mayoría de los estudiosos lo toman por un desliz de copista más que por una tradición distinta. La Biblia no dice nada más del lugar."
    - "Desde el siglo XVIII algunos han propuesto que Jutá, una ciudad sacerdotal de las colinas, es la anónima «ciudad de Judá» de la región montañosa a la que fue María a visitar a Elisabet, la mujer del sacerdote Zacarías; pero Lucas no da nombre, y la sugerencia no se apoya en más que el parecido de las palabras Judá y Jutá. Hoy Yatta, con más de 60 000 habitantes, es una de las mayores ciudades de la gobernación de Hebrón, en Cisjordania, y las aldeas de Masafer Yatta se hallan al sur de ella, entre la ciudad y el desierto."
  pt:
    - "Jutá era uma cidade na região montanhosa de Judá, a cerca de 8 km ao sul de Hebrom, listada com Maom, Carmelo e Zife no distrito das colinas do sul. O nome vive em Yatta, uma grande cidade palestina numa colina na orla das colinas de Hebrom onde a terra cultivada cede ao deserto, e a identificação não é contestada. Eusébio conheceu Jettan como uma aldeia muito grande de judeus no Daroma, a região sul, a dezoito milhas de Eleutéropolis. O velho núcleo da cidade está sobre o monte antigo, que nunca foi escavado; o que se sabe de sua história antiga vem dos textos e da cerâmica de superfície."
    - "Josué a nomeia entre as cidades de Judá “na região montanhosa”: “Maom, Carmelo, Zife, Jutá”. Foi depois dada, com Hebrom, Libna, Jatir, Estemoa, Holom e Debir, aos sacerdotes, filhos de Arão: “Aim com suas pastagens, Jutá com suas pastagens e Bete-Semes com suas pastagens: nove cidades daquelas duas tribos.” A lista paralela de Crônicas omite Jutá, e também Gibeão, de modo que nomeia onze cidades onde conta treze; a maioria dos estudiosos toma isso por lapso de copista e não por outra tradição. A Bíblia nada mais diz do lugar."
    - "Desde o século XVIII, alguns propuseram que Jutá, cidade sacerdotal nas colinas, é a inominada “cidade de Judá” na região montanhosa para onde Maria foi visitar Isabel, esposa do sacerdote Zacarias; mas Lucas não dá nome, e a sugestão repousa em nada mais que a semelhança das palavras Judá e Jutá. Hoje Yatta, com mais de 60.000 habitantes, é uma das maiores cidades da província de Hebrom, na Cisjordânia, e os povoados de Masafer Yatta ficam ao sul dela, entre a cidade e o deserto."
  de:
    - "Juta war eine Stadt im Bergland Judas etwa 8 km südlich von Hebron, mit Maon, Karmel und Sif im Bezirk der Südberge aufgeführt. Der Name lebt in Jatta fort, einer großen palästinensischen Stadt auf einem Hügel am Rand der Hebroner Berge, wo das Kulturland der Wüste weicht, und die Gleichsetzung ist unbestritten. Eusebius kannte Jettan als sehr großes Dorf von Juden in der Daroma, dem Südland, achtzehn Meilen von Eleutheropolis. Der alte Kern der Stadt steht auf dem antiken Hügel, der nie ausgegraben wurde; was von ihrer frühen Geschichte bekannt ist, stammt aus den Texten und aus Keramik an der Oberfläche."
    - "Josua nennt sie unter den Städten Judas „auf dem Gebirge“: „Maon, Karmel, Siph, Jutta“. Sie wurde dann mit Hebron, Libna, Jattir, Eschtemoa, Holon und Debir den Priestern, den Söhnen Aarons, gegeben: „Ain und seine Vorstädte, Jutta und seine Vorstädte, Beth-Semes und seine Vorstädte, neun Städte von diesen zwei Stämmen“. Die Parallelliste der Chronik lässt Juta aus, und Gibeon auch, sodass sie elf Städte nennt, wo sie dreizehn zählt; die meisten Forscher halten das für einen Schreiberfehler und nicht für eine andere Überlieferung. Die Bibel sagt sonst nichts über den Ort."
    - "Seit dem 18. Jahrhundert haben manche vorgeschlagen, Juta, eine Priesterstadt im Bergland, sei die ungenannte „Stadt Juda's“ im Gebirge, zu der Maria ging, um Elisabeth, die Frau des Priesters Zacharias, zu besuchen; doch Lukas nennt keinen Namen, und der Vorschlag beruht auf nichts als der Ähnlichkeit der Wörter Juda und Juta. Heute ist Jatta mit mehr als 60 000 Einwohnern eine der größten Städte des Gouvernements Hebron im Westjordanland, und die Weiler von Masafer Jatta liegen südlich davon zwischen der Stadt und der Wüste."
  fr:
    - "Jutta était une ville de la montagne de Juda à environ 8 km au sud d’Hébron, inscrite avec Maon, Carmel et Ziph dans le district des collines méridionales. Le nom survit à Yatta, grande ville palestinienne sur une colline au bord des collines d’Hébron, là où les terres cultivées cèdent la place au désert, et l’identification n’est pas contestée. Eusèbe connaissait Iettan comme un très grand village de Juifs dans le Daroma, le pays du sud, à dix-huit milles d’Éleuthéropolis. Le vieux noyau de la ville se dresse sur l’ancien tertre, qui n’a jamais été fouillé ; ce que l’on sait de son histoire ancienne vient des textes et de la poterie de surface."
    - "Josué la nomme parmi les villes de Juda « dans la montagne » : « Maon, Carmel, Ziph, Juta ». Elle fut ensuite donnée, avec Hébron, Libna, Jatthir, Eschthemoa, Holon et Debir, aux prêtres, fils d’Aaron : « Aïn et sa banlieue, Jutta et sa banlieue, et Beth-Schémesch et sa banlieue, neuf villes de ces deux tribus. » La liste parallèle des Chroniques omet Jutta, et Gabaon aussi, de sorte qu’elle nomme onze villes là où elle en compte treize ; la plupart des spécialistes y voient une erreur de copiste plutôt qu’une autre tradition. La Bible ne dit rien de plus du lieu."
    - "Depuis le XVIIIe siècle, certains ont proposé que Jutta, ville sacerdotale des collines, soit la « ville de Juda » sans nom, dans la montagne, où Marie alla rendre visite à Élisabeth, femme du prêtre Zacharie ; mais Luc ne donne aucun nom, et la suggestion ne repose que sur la ressemblance des mots Juda et Jutta. Aujourd’hui, Yatta, avec plus de 60 000 habitants, est l’une des plus grandes villes du gouvernorat d’Hébron en Cisjordanie, et les hameaux de Masafer Yatta s’étendent au sud entre la ville et le désert."
