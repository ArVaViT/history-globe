# Overview article (ADR 0007). Mainstream facts only; the identification with Yatta is undisputed; the guess that Juttah is the “city of Juda” of Luke 1 is given as a guess.
id: juttah
place: acc7184
title:
  en: "Juttah"
  ru: "Юта"
  uk: "Ютта"
  es: "Jutá"
  pt: "Jutá"
  de: "Juta"
