# Overview article (ADR 0007). Mainstream facts only; the wilderness is unlocated and the three candidates on the map are named without choosing; the Synodal Bible writes both Sin and Zin as "Син", which the text notes.
id: sin
place: a0f54e4
title:
  en: "Sin"
  ru: "Син"
  uk: "Сін"
  es: "Desierto de Sin"
  pt: "Sim"
  de: "Sin"
  fr: "Sin"
  pl: "Sin"
  it: "Sin"
  nl: "Sin"
  cs: "Sín"
body:
  en:
    - "The wilderness of Sin is a stretch of desert on Israel's road from Egypt to Sinai, “between Elim and Sinai”. It is not the wilderness of Zin by Kadesh on the border of the land: the Hebrew names differ, though the Synodal Bible writes both as Sin. Its own name may be related to Sinai, and the Bible says nothing more of where it lay."
    - "Where it is placed depends on where Mount Sinai is put. With the traditional Jebel Musa in the south of the peninsula, the candidates are the coastal plain of el-Markha on the Gulf of Suez below the mountains; the wider plain of el-Qaa further south; and Debbet er-Ramleh, the sandy plain inland that runs along the foot of the et-Tih escarpment towards the granite mountains. The map marks all three. Nothing has been found in any of them, and those who seek Sinai elsewhere move the wilderness of Sin with it."
    - "Israel came here from Elim “on the fifteenth day of the second month after their departing out of the land of Egypt”, a month after the exodus, and here the whole congregation murmured: “Would to God we had died by the hand of the LORD in the land of Egypt, when we sat by the flesh pots”. The answer was bread from heaven: “at even the quails came up, and covered the camp: and in the morning the dew lay round about the host”, and the manna that Israel ate forty years was first gathered in the wilderness of Sin, with the rule that none be gathered on the sabbath. From here the people journeyed to Rephidim, where there was no water. The itinerary of Numbers sets the camp in the wilderness of Sin after a camp by the Red Sea and before Dophkah and Alush."
    - "The region today is the South Sinai governorate of Egypt. The coast road from Suez to et-Tur runs the length of el-Markha and el-Qaa past Abu Zenima, while Debbet er-Ramleh lies inland, between the coastal hills and the et-Tih escarpment."
  ru:
    - "Пустыня Син — участок пустыни на пути Израиля из Египта к Синаю, «между Елимом и между Синаем». Это не пустыня Син (Цин) у Кадеса на границе земли: еврейские имена различны, хотя Синодальный перевод пишет обе одинаково. Само имя, возможно, родственно Синаю, а больше о её положении Библия не говорит."
    - "Где её искать, зависит от того, где ставят гору Синай. При традиционном Джебель-Муса на юге полуострова кандидаты таковы: прибрежная равнина Эль-Марка на Суэцком заливе под горами; более широкая равнина Эль-Каа южнее; и Деббет-эр-Рамле — песчаная равнина в глубине полуострова вдоль подножия уступа Эт-Тих, уходящая к гранитным горам. На карте отмечены все три. Ни в одной из них ничего не найдено, а те, кто ищет Синай в другом месте, переносят с ним и пустыню Син."
    - "Израиль пришёл сюда из Елима «в пятнадцатый день второго месяца по выходе их из земли Египетской», через месяц после исхода, и здесь возроптало всё общество: «о, если бы мы умерли от руки Господней в земле Египетской, когда мы сидели у котлов с мясом». Ответом был хлеб с неба: «Вечером налетели перепелы и покрыли стан, а поутру лежала роса около стана», и манну, которую Израиль ел сорок лет, впервые собирали в пустыне Син — с заповедью не собирать её в субботу. Отсюда народ двинулся к Рефидиму, где не было воды. Список станов в книге Чисел ставит стан в пустыне Син после стана у Чермного моря и перед Дофкой и Алушем."
    - "Сегодня это мухафаза Южный Синай в Египте. Прибрежная дорога из Суэца в Эт-Тур тянется вдоль всей Эль-Марки и Эль-Каа мимо Абу-Зенимы, а Деббет-эр-Рамле лежит в глубине полуострова, между прибрежными горами и уступом Эт-Тих."
  uk:
    - "Пустеля Сін — це смуга пустелі на шляху Ізраїлю з Єгипту до Синаю, «між Єлимом і Синайом». Це не пустеля Цін біля Кадеша на межі краю: староєврейські назви різняться, хоч Синодальний переклад пише обидві як Син. Її назва, можливо, споріднена із Синаєм, а про те, де вона лежала, Біблія більше нічого не каже."
    - "Де її розміщують, залежить від того, де шукають гору Синай. Якщо прийняти традиційний Джебель-Муса на півдні півострова, кандидати такі: прибережна рівнина ель-Маркха на Суецькій затоці під горами; ширша рівнина ель-Кеа далі на південь; і Деббет-ер-Рамле, піщана рівнина вглиб суші, що тягнеться вздовж підніжжя уступу ет-Тіх до гранітних гір. Мапа позначає всі три. Ні в одній з них нічого не знайдено, а ті, хто шукає Синай деінде, переносять разом з ним і пустелю Сін."
    - "Ізраїль прийшов сюди з Елима «у пятнайцятий день місяця по виходї з Египецької землї», через місяць після виходу, і тут уся громада нарікала: «Лучче б нам було повмірати од руки Господньої в Египецькій землї, як седимо було круг казана з мясивом». Відповіддю був хліб із небес: «знялись увечорі перепелицї, укрили табір, а враньцї була роса круг табору», і манна, яку Ізраїль їв сорок років, була вперше зібрана в пустелі Сін, із правилом не збирати її в суботу. Звідси народ рушив до Рефідіма, де не було води. Подорожній перелік Числ ставить табір у пустелі Сін після табору над Червоним морем і перед Дофкою та Алушем."
    - "Нині цей край — єгипетська провінція Південний Синай. Прибережна дорога від Суеца до ет-Тура проходить усю довжину ель-Маркхи та ель-Кеа повз Абу-Зеніму, тоді як Деббет-ер-Рамле лежить углиб суші, між прибережними пагорбами та уступом ет-Тіх."
  es:
    - "El desierto de Sin es un tramo de desierto en el camino de Israel desde Egipto hasta el Sinaí, «entre Elim y Sinaí». No es el desierto de Zin, junto a Cades, en la frontera de la tierra: los nombres hebreos difieren, aunque la Biblia sinodal escribe ambos como Sin. Su propio nombre puede estar emparentado con Sinaí, y la Biblia no dice nada más sobre dónde estaba."
    - "Dónde se sitúa depende de dónde se ponga el monte Sinaí. Con el tradicional Jebel Musa, en el sur de la península, los candidatos son la llanura costera de el-Markha, en el golfo de Suez, al pie de las montañas; la llanura más amplia de el-Qaa, más al sur; y Debbet er-Ramleh, la llanura arenosa del interior que recorre el pie del escarpe de et-Tih hacia las montañas de granito. El mapa señala las tres. No se ha encontrado nada en ninguna de ellas, y quienes buscan el Sinaí en otra parte trasladan con él el desierto de Sin."
    - "Israel llegó aquí desde Elim «á los quince días del segundo mes después que salieron de la tierra de Egipto», un mes después del éxodo, y aquí toda la congregación murmuró: «Ojalá hubiéramos muerto por mano de Jehová en la tierra de Egipto, cuando nos sentábamos á las ollas de las carnes». La respuesta fue pan del cielo: «venida la tarde subieron codornices que cubrieron el real; y á la mañana descendió rocío en derredor del real», y el maná que Israel comió cuarenta años se recogió por primera vez en el desierto de Sin, con la norma de que no se recogiera en sábado. De aquí el pueblo partió hacia Refidim, donde no había agua. El itinerario de Números sitúa el campamento en el desierto de Sin después de un campamento junto al Mar Rojo y antes de Dofca y Alús."
    - "La región es hoy la gobernación del Sinaí Meridional, en Egipto. La carretera de la costa, de Suez a et-Tur, recorre toda la longitud de el-Markha y el-Qaa pasando por Abu Zenima, mientras que Debbet er-Ramleh queda tierra adentro, entre las colinas de la costa y el escarpe de et-Tih."
  pt:
    - "O deserto de Sim é um trecho de deserto no caminho de Israel do Egito ao Sinai, “entre Elim e Sinai”. Não é o deserto de Zim, junto a Cades, na fronteira da terra: os nomes hebraicos diferem, embora a Bíblia Sinodal escreva ambos como Sin. Seu próprio nome pode estar relacionado a Sinai, e a Bíblia nada mais diz sobre onde ficava."
    - "Onde se o coloca depende de onde se situa o monte Sinai. Com o tradicional Jebel Musa, no sul da península, os candidatos são a planície costeira de el-Markha, no golfo de Suez, abaixo das montanhas; a planície mais ampla de el-Qaa, mais ao sul; e Debbet er-Ramleh, a planície arenosa do interior que corre ao pé da escarpa de et-Tih em direção às montanhas de granito. O mapa marca as três. Nada foi encontrado em nenhuma delas, e os que procuram o Sinai em outro lugar levam consigo o deserto de Sim."
    - "Israel veio aqui de Elim “no décimo quinto dia do segundo mês após a sua saída da terra do Egito”, um mês depois do êxodo, e aqui toda a congregação murmurou: “Quem dera tivéssemos morrido pela mão do SENHOR na terra do Egito, quando nos sentávamos junto às panelas de carne”. A resposta foi o pão do céu: “À tarde, codornizes subiram e cobriram o acampamento; e pela manhã o orvalho repousava ao redor do acampamento”, e o maná que Israel comeu por quarenta anos foi colhido pela primeira vez no deserto de Sim, com a regra de que não se colhesse no sábado. Daqui o povo partiu para Refidim, onde não havia água. O itinerário de Números situa o acampamento no deserto de Sim depois de um acampamento junto ao Mar Vermelho e antes de Dofca e Alus."
    - "A região hoje é a província do Sinai do Sul, no Egito. A estrada costeira de Suez a et-Tur percorre toda a extensão de el-Markha e el-Qaa, passando por Abu Zenima, enquanto Debbet er-Ramleh fica no interior, entre as colinas costeiras e a escarpa de et-Tih."
  de:
    - "Die Wüste Sin ist ein Wüstenstreifen auf Israels Weg von Ägypten zum Sinai, „zwischen Elim und Sinai“. Sie ist nicht die Wüste Zin bei Kadesch an der Grenze des Landes: Die hebräischen Namen unterscheiden sich, obwohl die Synodalbibel beide Sin schreibt. Ihr Name könnte mit Sinai verwandt sein, und die Bibel sagt nichts weiter darüber, wo sie lag."
    - "Wo man sie ansetzt, hängt davon ab, wo man den Berg Sinai ansetzt. Beim traditionellen Jebel Musa im Süden der Halbinsel kommen in Frage: die Küstenebene el-Markha am Golf von Suez unterhalb der Berge; die weitere Ebene el-Qaa noch südlicher; und Debbet er-Ramleh, die sandige Ebene im Landesinneren, die am Fuß des Steilabbruchs et-Tih entlang zu den Granitbergen verläuft. Die Karte markiert alle drei. In keiner wurde etwas gefunden, und wer den Sinai anderswo sucht, verlegt die Wüste Sin mit ihm."
    - "Israel kam von Elim hierher „am fünfzehnten Tage des zweiten Monats, nachdem sie aus Ägypten gezogen waren“, einen Monat nach dem Auszug, und hier murrte die ganze Gemeinde: „Wollte Gott, wir wären in Ägypten gestorben durch des HERRN Hand, da wir bei den Fleischtöpfen saßen“. Die Antwort war Brot vom Himmel: „am Abend kamen Wachteln herauf und bedeckten das Heer. Und am Morgen lag der Tau um das Heer her“, und das Manna, das Israel vierzig Jahre aß, wurde zuerst in der Wüste Sin gesammelt, mit der Regel, am Sabbat keines zu sammeln. Von hier zog das Volk nach Refidim, wo es kein Wasser gab. Die Stationenliste im Buch Numeri setzt das Lager in der Wüste Sin nach einem Lager am Roten Meer und vor Dofka und Alusch."
    - "Die Region ist heute das Gouvernement Süd-Sinai in Ägypten. Die Küstenstraße von Suez nach et-Tur durchzieht el-Markha und el-Qaa in ganzer Länge an Abu Zenima vorbei, während Debbet er-Ramleh landeinwärts zwischen den Küstenhügeln und dem Steilabbruch et-Tih liegt."
  fr:
    - "Le désert de Sin est une étendue désertique sur la route d’Israël entre l’Égypte et le Sinaï, « entre Élim et Sinaï ». Ce n’est pas le désert de Tsin près de Qadesh, à la frontière du pays : les noms hébreux diffèrent, bien que la Bible synodale écrive les deux Sin. Son nom peut être apparenté à Sinaï, et la Bible ne dit rien de plus sur son emplacement."
    - "Sa localisation dépend de celle du mont Sinaï. Avec le traditionnel Jebel Musa, dans le sud de la péninsule, les candidats sont la plaine côtière d’el-Markha sur le golfe de Suez, sous les montagnes ; la plaine plus large d’el-Qaa, plus au sud ; et Debbet er-Ramleh, plaine sablonneuse intérieure qui longe le pied de l’escarpement d’et-Tih vers les montagnes de granite. La carte marque les trois. Rien n’a été trouvé dans aucune, et ceux qui cherchent le Sinaï ailleurs déplacent avec lui le désert de Sin."
    - "Israël y vint d’Élim « le quinzième jour du second mois après leur sortie du pays d’Égypte », un mois après l’exode, et toute l’assemblée y murmura : « Que ne sommes-nous morts par la main de l’Éternel dans le pays d’Égypte, quand nous étions assis près des pots de viande ». La réponse fut le pain du ciel : « le soir, il survint des cailles qui couvrirent le camp ; et, au matin, il y eut une couche de rosée autour du camp » ; la manne que mangea Israël pendant quarante ans fut d’abord ramassée dans le désert de Sin, avec la règle de n’en pas ramasser le sabbat. De là le peuple gagna Rephidim, où il n’y avait pas d’eau. L’itinéraire des Nombres place le camp du désert de Sin après celui de la mer Rouge et avant Dophka et Alusch."
    - "La région est aujourd’hui le gouvernorat du Sinaï du Sud, en Égypte. La route côtière de Suez à et-Tur longe el-Markha et el-Qaa en passant par Abou Zenima, tandis que Debbet er-Ramleh se trouve à l’intérieur, entre les collines côtières et l’escarpement d’et-Tih."
  pl:
    - "Pustynia Sin to pas pustyni na drodze Izraela z Egiptu na Synaj, „między Elim i między Synaj”. Nie jest to pustynia Syn koło Kadesz na granicy ziemi: hebrajskie nazwy się różnią, choć Biblia synodalna zapisuje obie jako Sin. Jej nazwa może być spokrewniona z Synajem, a Biblia nie mówi więcej o jej położeniu."
    - "To, gdzie ją umieszczać, zależy od tego, gdzie umieszcza się Górę Synaj. Przy tradycyjnym Dżabal Musa na południu półwyspu kandydatami są nadmorska równina el-Markha nad Zatoką Sueską u stóp gór; szersza równina el-Kaa dalej na południe; oraz Debbet er-Ramleh, piaszczysta równina w głębi lądu, biegnąca u stóp skarpy et-Tih ku granitowym górom. Mapa zaznacza wszystkie trzy. Na żadnej nic nie znaleziono, a ci, którzy szukają Synaju gdzie indziej, przenoszą wraz z nim pustynię Sin."
    - "Izrael przyszedł tu z Elim „piętnastego dnia miesiąca wtórego po wyjściu ich z ziemi Egipskiej”, miesiąc po wyjściu z Egiptu, i tu całe zgromadzenie szemrało: „Obyśmy byli pomarli od ręki Pańskiej w ziemi Egipskiej, gdyśmy siadali nad garncy mięsa”. Odpowiedzią był chleb z nieba: „wieczór, że się zleciały przepiórki, a okryły obóz, a rano rosa leżała około obozu”, a manna, którą Izrael jadł czterdzieści lat, została po raz pierwszy zebrana na pustyni Sin, z zasadą, by w sabat jej nie zbierać. Stąd lud ruszył do Refidim, gdzie nie było wody. Wykaz stacji w Księdze Liczb umieszcza obóz na pustyni Sin po obozie nad Morzem Czerwonym, a przed Dofką i Alusz."
    - "Region ten należy dziś do egipskiej prowincji Synaj Południowy. Droga nadbrzeżna z Suezu do et-Tur biegnie wzdłuż całej el-Markhy i el-Kaa, obok Abu Zenimy, podczas gdy Debbet er-Ramleh leży w głębi lądu, między nadmorskimi wzgórzami a skarpą et-Tih."
  it:
    - "Il deserto di Sin è un tratto di deserto sulla strada d’Israele dall’Egitto al Sinai, «fra Elim e Sinai». Non è il deserto di Zin presso Kades, al confine della terra: i nomi ebraici differiscono, benché la Bibbia sinodale scriva entrambi Sin. Il suo nome può essere legato a Sinai, e la Bibbia non dice altro su dove si trovasse."
    - "La sua collocazione dipende da dove si pone il monte Sinai. Con il tradizionale Jebel Musa, nel sud della penisola, i candidati sono la piana costiera di el-Markha sul golfo di Suez, sotto le montagne; la piana più ampia di el-Qaa, più a sud; e Debbet er-Ramleh, la piana sabbiosa interna che corre ai piedi della scarpata dell’et-Tih verso le montagne di granito. La mappa le segna tutte e tre. In nessuna è stato trovato nulla, e chi cerca il Sinai altrove sposta con esso il deserto di Sin."
    - "Israele vi giunse da Elim «il quindicesimo giorno del secondo mese dopo la loro partenza dal paese d’Egitto», un mese dopo l’esodo, e qui tutta la comunità mormorò: «Oh, fossimo pur morti per mano dell’Eterno nel paese d’Egitto, quando sedevamo presso le pignatte della carne». La risposta fu il pane dal cielo: «saliron delle quaglie, che ricopersero il campo; e, la mattina, c’era uno strato di rugiada intorno al campo», e la manna che Israele mangiò per quarant’anni fu raccolta per la prima volta nel deserto di Sin, con la norma che non se ne raccogliesse di sabato. Di qui il popolo partì per Refidim, dove non c’era acqua. L’itinerario dei Numeri pone l’accampamento nel deserto di Sin dopo uno presso il Mar Rosso e prima di Dofka e Alus."
    - "La regione è oggi il governatorato egiziano del Sinai meridionale. La strada costiera da Suez a et-Tur percorre tutta la lunghezza di el-Markha e di el-Qaa passando per Abu Zenima, mentre Debbet er-Ramleh si trova nell’entroterra, tra le colline costiere e la scarpata dell’et-Tih."
  nl:
    - "De woestijn Sin is een woestijnstrook op de weg van Israël van Egypte naar Sinaï, “tussen Elim en tussen Sinai”. Ze is niet de woestijn Zin bij Kades aan de grens van het land: de Hebreeuwse namen verschillen, al schrijft de Synodale Bijbel beide als Sin. Haar naam hangt mogelijk samen met Sinaï, en de Bijbel zegt verder niets over haar ligging."
    - "Waar ze wordt gelokaliseerd, hangt af van waar de berg Sinaï wordt gezocht. Bij de traditionele Jebel Musa in het zuiden van het schiereiland zijn de kandidaten de kustvlakte van el-Markha aan de Golf van Suez onder de bergen; de wijdere vlakte van el-Qaa verder naar het zuiden; en Debbet er-Ramleh, de zandvlakte landinwaarts die langs de voet van de et-Tih-steilrand naar de granietbergen loopt. De kaart markeert alle drie. In geen ervan is iets gevonden, en wie de Sinaï elders zoekt, verplaatst de woestijn Sin mee."
    - "Israël kwam hier vanuit Elim “aan den vijftienden dag der tweede maand, nadat zij uit Egypteland uitgegaan waren”, een maand na de uittocht, en hier mopperde de hele gemeente: “Och, dat wij in Egypteland gestorven waren door de hand des HEEREN, toen wij bij de vleespotten zaten”. Het antwoord was brood uit de hemel: “aan den avond, dat er kwakkelen opkwamen, en het leger bedekten; en aan den morgen lag de dauw rondom het leger”, en het manna dat Israël veertig jaar at, werd het eerst in de woestijn Sin verzameld, met de regel dat men er op de sabbat niets van moest verzamelen. Vandaar trok het volk naar Refidim, waar geen water was. De reisroute in Numeri plaatst het kamp in de woestijn Sin na een kamp bij de Rode Zee en vóór Dofka en Alus."
    - "De streek is tegenwoordig het gouvernement Zuid-Sinaï van Egypte. De kustweg van Suez naar et-Tur loopt over de hele lengte van el-Markha en el-Qaa langs Abu Zenima, terwijl Debbet er-Ramleh landinwaarts ligt, tussen de kustheuvels en de et-Tih-steilrand."
  cs:
    - "Poušť Sín je úsek pouště na izraelské cestě z Egypta k Sinaji, „mezi Elim a Sinai“. Není to poušť Cin u Kádeše na hranici zaslíbené země: hebrejská jména se liší, třebaže synodální překlad píše obojí jako Sin. Její jméno může souviset se Sinají a Bible o tom, kde ležela, neříká nic dalšího."
    - "Kam se klade, závisí na tom, kam se umisťuje hora Sinaj. Při tradiční Džebel Músa na jihu poloostrova jsou kandidáty pobřežní rovina el-Markha na Suezském zálivu pod horami; širší rovina el-Qaa dále na jih; a Debbet er-Ramleh, písčitá vnitrozemská rovina, která se táhne podél úpatí srázu et-Tih směrem k žulovým horám. Mapa vyznačuje všechny tři. V žádné z nich se nic nenašlo a ti, kdo hledají Sinaj jinde, přesouvají s ním i poušť Sín."
    - "Izrael sem přišel z Élimu „v patnáctý den druhého měsíce po vyjití z země Egyptské“, měsíc po exodu, a zde celé shromáždění reptalo: „Ó bychom byli zemřeli od ruky Hospodinovy v zemi Egyptské, když jsme sedávali nad hrnci masa“. Odpovědí byl chléb z nebe: „stalo se u večer, že přiletěly křepelky a přikryly tábor; ráno pak spadla rosa okolo táboru“, a mana, kterou Izrael jedl čtyřicet let, byla poprvé sbírána na poušti Sín s pravidlem, že se v sobotu nemá sbírat. Odtud lid putoval do Refídimu, kde nebyla voda. Itinerář Knihy Numeri klade tábor na poušti Sín po táboru u Rudého moře a před Dofkou a Alúšem."
    - "Dnes je tato oblast egyptským guvernorátem Jižní Sinaj. Pobřežní silnice ze Suezu do et-Túru vede po celé délce el-Markhy a el-Qaa kolem Abú Zenímy, zatímco Debbet er-Ramleh leží ve vnitrozemí mezi pobřežními pahorky a srázem et-Tih."
