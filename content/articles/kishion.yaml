body:
  en:
    - "Kishion was a town in the lot of Issachar, named in the list “And Rabbith, and Kishion, and Abez”, and later given with its pasture lands to the Levites of the family of Gershon: “out of the tribe of Issachar, Kishon with her suburbs, Dabareh with her suburbs”. The King James Version spells it Kishon in the second passage, though it is not the river Kishon. The parallel list in Chronicles has Kedesh in its place, so either the town had two names or one list has suffered in copying. That is all the Bible says, and no ancient source adds anything certain."
    - "Issachar held the eastern part of the Jezreel valley and the hills around Mount Tabor, and Kishion must lie there. The map marks Tell Qisyon (Tel Kishyon) just south of Tabor first, for the echo of the name; Tell Rekhesh by the Tabor stream, Tell el-Ajjul and Tell Abu Qedeis, which some connect with the Kedesh of Chronicles, have also been proposed. None has produced an inscription naming it, and the choice remains open."
  ru:
    - "Кишион — город в уделе Иссахара, названный в перечне «Раввиф, Кишион и Авец», а затем отданный с предместьями левитам из сынов Гирсона: «от колена Иссахарова: Кишион и предместья его, Давраф и предместья его». В параллельном перечне Паралипоменон на его месте стоит Кедес, так что либо у города было два имени, либо один из списков пострадал при переписке. Это всё, что говорит Библия, и никакой древний источник не прибавляет ничего достоверного."
    - "Иссахар владел восточной частью Изреельской долины и холмами вокруг горы Фавор, и Кишион должен лежать там. На карте первым отмечен Телль-Кисьон (Тель-Кишьон) чуть южнее Фавора — из-за созвучия имени; предлагали также Тель-Рехеш у потока Фавор, Телль-эль-Аджуль и Телль-Абу-Кедейс, который некоторые связывают с Кедесом из Паралипоменон. Ни на одном из них не найдено надписи с его именем, и выбор остаётся открытым."
  uk:
    - "Кішіон — місто в уділі Іссахара, назване в переліку «Раввит, Кишіон й Авез», а згодом віддане з його пасовищами левітам з роду Гершома: «А від поколїння Іссахарового: Кисіон укупі з пасовищами його, Даверат з пасовищами його». Біблія короля Якова пише в другому місці Кішон, хоча це не ріка Кішон. Паралельний перелік у Книзі Хронік має на цьому місці Кедес, тож або місто мало дві назви, або в одному з переліків є помилка переписування. Це все, що каже Біблія, і жодне давнє джерело не додає нічого певного."
    - "Іссахар володів східною частиною Їзреельської долини й пагорбами навколо гори Фавор, і Кішіон має лежати там. Мапа першим позначає Тель-Кішйон (Тель-Кісйон) просто на південь від Фавору, за відлуння назви; пропонували також Тель-Рехеш біля потоку Фавор, Тель-ель-Аджжуль і Тель-Абу-Кедеїс, які дехто пов’язує з Кедесом Хронік. Жоден не дав напису, що називає його, і вибір залишається відкритим."
  es:
    - "Cisión era una ciudad de la suerte de Isacar, nombrada en la lista «Y Rabbit, y Chisión, y Ebes», y dada después, con sus ejidos, a los levitas de la familia de Gersón: «Y de la tribu de Issachâr, á Cesión con sus ejidos, á Dabereth con sus ejidos». La versión del rey Jacobo la escribe Kishon en el segundo pasaje, aunque no es el río Cisón. La lista paralela de Crónicas tiene Cedes en su lugar, de modo que o bien la ciudad tenía dos nombres o bien una de las listas ha sufrido en la copia. Eso es todo lo que dice la Biblia, y ninguna fuente antigua añade nada seguro."
    - "Isacar ocupaba la parte oriental del valle de Jezreel y las colinas en torno al monte Tabor, y Cisión debe de estar allí. El mapa marca en primer lugar Tell Qisyon (Tel Kishyon), justo al sur del Tabor, por el eco del nombre; también se han propuesto Tell Rekhesh, junto al arroyo del Tabor, Tell el-Ajjul y Tell Abu Qedeis, que algunos relacionan con la Cedes de Crónicas. Ninguno ha dado una inscripción que lo nombre, y la elección sigue abierta."
  pt:
    - "Quisiom era uma cidade no lote de Issacar, citada na lista “Rabite, Quisião, Ebes”, e depois dada com suas pastagens aos levitas da família de Gérson: “Da tribo de Issacar, Quisiom com suas pastagens, Daberate com suas pastagens”. A King James Version a grafa Kishon na segunda passagem, embora não seja o rio Quisom. A lista paralela das Crônicas traz Quedes em seu lugar, de modo que ou a cidade tinha dois nomes ou uma das listas sofreu na cópia. É tudo o que a Bíblia diz, e nenhuma fonte antiga acrescenta algo certo."
    - "Issacar possuía a parte oriental do vale de Jezreel e as colinas ao redor do monte Tabor, e Quisiom deve ficar ali. O mapa marca em primeiro lugar Tell Qisyon (Tel Kishyon), logo ao sul do Tabor, pelo eco do nome; Tell Rekhesh, junto ao riacho do Tabor, Tell el-Ajjul e Tell Abu Qedeis, que alguns ligam à Quedes das Crônicas, também foram propostos. Nenhum produziu uma inscrição que a nomeie, e a escolha permanece em aberto."
  de:
    - "Kischjon war eine Stadt im Gebiet Issachars, genannt in der Liste „Rabbith, Kisjon, Ebez“, und später mit ihrem Weideland den Leviten aus der Familie Gerschon gegeben: „Von dem Stamme Isaschar … Kisjon und seine Vorstädte, Dabrath und seine Vorstädte“. Die King-James-Version schreibt es an der zweiten Stelle Kishon, obwohl es nicht der Fluss Kischon ist. Die Parallelliste in der Chronik hat an seiner Stelle Kedesch, sodass die Stadt entweder zwei Namen hatte oder eine Liste beim Abschreiben gelitten hat. Mehr sagt die Bibel nicht, und keine antike Quelle fügt etwas Sicheres hinzu."
    - "Issachar besaß den östlichen Teil der Jesreelebene und die Hügel um den Tabor, und Kischjon muss dort liegen. Die Karte zeigt zuerst Tell Qisyon (Tel Kishyon) unmittelbar südlich des Tabor, wegen des Anklangs im Namen; Tell Rekhesh am Taborbach, Tell el-Ajjul und Tell Abu Qedeis, die manche mit dem Kedesch der Chronik verbinden, wurden ebenfalls vorgeschlagen. Keiner hat eine Inschrift mit dem Namen geliefert, und die Wahl bleibt offen."
  fr:
    - "Kischjon était une ville du lot d’Issacar, nommée dans la liste « Rabbith, Kischjon, Abets », puis donnée avec ses pâturages aux lévites de la famille de Guerschon : « de la tribu d’Issacar, Kischjon et sa banlieue, Dabrath et sa banlieue ». La version du roi Jacques écrit Kishon dans le second passage, bien qu’il ne s’agisse pas du fleuve Kison. La liste parallèle des Chroniques a Kédesch à sa place, de sorte que, ou bien la ville avait deux noms, ou bien une liste a souffert dans la copie. C’est tout ce que dit la Bible, et aucune source ancienne n’ajoute rien de certain."
    - "Issacar tenait la partie orientale de la vallée de Jizreel et les collines autour du mont Thabor, et Kischjon doit s’y trouver. La carte marque en premier Tell Qisyon (Tel Kishyon), juste au sud du Thabor, pour l’écho du nom ; Tell Rekhesh, près du torrent du Thabor, Tell el-Ajjul et Tell Abu Qedeis, que certains rattachent au Kédesch des Chroniques, ont aussi été proposés. Aucun n’a livré d’inscription qui le nomme, et le choix reste ouvert."
  it:
    - "Kision era una città nella porzione di Issacar, nominata nell’elenco «Rabbith, Kiscion, Abets», e più tardi data con i suoi pascoli ai leviti della famiglia di Gherson: «della tribù d’Issacar, Kiscion e il suo contado, Dabrath e il suo contado». La King James Version la scrive Kishon nel secondo passo, benché non sia il fiume Kison. L’elenco parallelo delle Cronache ha Kedes al suo posto, così o la città aveva due nomi o un elenco ha sofferto nella copiatura. Questo è tutto ciò che la Bibbia dice, e nessuna fonte antica aggiunge nulla di certo."
    - "Issacar teneva la parte orientale della valle di Izreel e le colline intorno al Monte Tabor, e Kision deve trovarsi là. La mappa segna per prima Tell Qisyon (Tel Kishyon), appena a sud del Tabor, per l’eco del nome; sono state proposte anche Tell Rekhesh presso il torrente Tabor, Tell el-Ajjul e Tell Abu Qedeis, che alcuni collegano con la Kedes delle Cronache. Nessuna ha restituito un’iscrizione che la nomini, e la scelta resta aperta."
  pl:
    - "Kiszjon było miastem w losie Issachara, wymienionym na liście: „I Rabbot, i Cesyjom, i Abes”, a później oddanym wraz z pastwiskami Lewitom z rodu Gerszona: „Z pokolenia Isaschar: Kiesyjon i przedmieścia jego; Daberet i przedmieścia jego”. Biblia Króla Jakuba zapisuje je w drugim miejscu jako Kishon, choć nie jest to rzeka Kiszon. Lista równoległa w Księdze Kronik ma w jego miejscu Kedesz, więc albo miasto miało dwie nazwy, albo jedna z list ucierpiała przy przepisywaniu. Tyle mówi Biblia i żadne starożytne źródło nie dodaje niczego pewnego."
    - "Issachar zajmował wschodnią część doliny Jizreel i wzgórza wokół góry Tabor, i Kiszjon musi tam leżeć. Mapa zaznacza jako pierwszy Tell Qisyon (Tel Kiszjon) tuż na południe od Taboru, ze względu na echo nazwy; proponowano też Tell Rekhesh nad strumieniem Tabor, Tell el-Ajjul i Tell Abu Qedeis, które niektórzy łączą z Kedesz z Księgi Kronik. Żaden nie dostarczył inskrypcji z jego nazwą, a wybór pozostaje otwarty."
  nl:
    - "Kisjon was een stad in het lot van Issachar, genoemd in de lijst “En Rabbith, en Kisjon, en Ebez”, en later met haar weidegronden gegeven aan de Levieten van het geslacht Gerson: “van den stam van Issaschar, Kisjon en haar voorsteden, en Dobrath en haar voorsteden”. De King James Version spelt het in de tweede passage Kishon, al is het niet de rivier de Kison. De parallelle lijst in Kronieken heeft Kedes in haar plaats, dus ofwel had de stad twee namen, ofwel is een lijst bij het overschrijven beschadigd. Dat is alles wat de Bijbel erover zegt, en geen oude bron voegt er iets zekers aan toe."
    - "Issachar bezat het oostelijke deel van de Jizreëlvallei en de heuvels rond de berg Tabor, en Kisjon moet daar liggen. De kaart toont eerst Tell Qisyon (Tel Kishyon) net ten zuiden van de Tabor, vanwege de echo van de naam; Tell Rekhesh bij de Taborbeek, Tell el-Ajjul en Tell Abu Qedeis, die sommigen met het Kedes van Kronieken verbinden, zijn eveneens voorgesteld. Geen ervan heeft een inscriptie opgeleverd die haar noemt, en de keuze blijft open."
  cs:
    - "Kišjón bylo město v losu Isacharově, jmenované v seznamu „Rabbot, Kesion a Abez“ a později dané i s pastvinami levitům z rodu Geršonova: „Z pokolení Izacharova: Kesion a podměstí jeho, a Daberet s předměstím jeho“. Anglická Bible krále Jakuba píše na druhém místě Kishon, ačkoli nejde o řeku Kíšon. Souběžný seznam v Kronikách má na jeho místě Kedeš, takže buď město mělo dvě jména, nebo se jeden seznam při opisování porušil. To je vše, co Bible praví, a žádný starověký pramen nepřidává nic jistého."
    - "Isachar držel východní část Jizreelského údolí a pahorky kolem hory Tábor a Kišjón tam musí ležet. Mapa uvádí jako první Tell Qisyon (Tel Kishyon) hned jižně od Táboru, pro ozvěnu jména; navrženy byly i Tell Rekhesh u potoka Tábor, Tell el-Ajjul a Tell Abu Qedeis, který někteří spojují s Kedešem z Kronik. Žádný nevydal nápis, který by jej jmenoval, a volba zůstává otevřená."
  sv:
    - "Kishjon var en stad i Isaskars lott, nämnd i förteckningen ”Rabbit, Kisjon, Ebes”, och senare given med sina betesmarker åt leviterna av Gershons släkt: ”ur Isaskars stam Kisjon med dess utmarker, Dobrat med dess utmarker”. King James Version stavar den Kishon i den andra passagen, fastän det inte är floden Kishon. Den parallella förteckningen i Krönikeböckerna har Kedesh i dess ställe, så antingen hade staden två namn eller har en av förteckningarna skadats vid avskrivningen. Det är allt Bibeln säger, och ingen antik källa tillägger något säkert."
    - "Isaskar hade den östra delen av Jisreeldalen och höjderna kring berget Tabor, och Kishjon måste ligga där. Kartan markerar först Tell Qisyon (Tel Kishyon) strax söder om Tabor, för namnets eko; Tell Rekhesh vid Taborbäcken, Tell el-Ajjul och Tell Abu Qedeis, som vissa förbinder med Krönikeböckernas Kedesh, har också föreslagits. Ingen har gett någon inskrift som nämner den, och valet förblir öppet."
  nb:
    - "Kisjon var en by i Issakars lodd, nevnt i listen «og Harabbit og Kisjon og Ebes», og senere gitt med sine beitemarker til levittene av Gersjons ætt: «og av Issakars stamme: Kisjon med jorder, Daberat med jorder». King James-oversettelsen skriver den Kishon i den andre passasjen, selv om det ikke er elven Kisjon. Den parallelle listen i Krønikebøkene har Kedesj i stedet, så enten hadde byen to navn, eller så har den ene listen blitt skadd ved avskrivning. Det er alt Bibelen sier, og ingen gammel kilde tilføyer noe sikkert."
    - "Issakar hadde den østlige delen av Jisreel-dalen og åsene omkring Tabor, og Kisjon må ligge der. Kartet markerer først Tell Qisyon (Tel Kishyon) like sør for Tabor, på grunn av navnets gjenklang; Tell Rekhesh ved Tabor-bekken, Tell el-Ajjul og Tell Abu Qedeis, som noen knytter til Kedesj i Krønikebøkene, er også foreslått. Ingen har gitt en innskrift som nevner den, og valget forblir åpent."
  tl:
    - "Ang Chision ay bayan sa bahagi ng Issachar, na nakatala sa talaan na “At Rabbit, at Chision, at Ebes”, at kalaunan ay ibinigay kasama ng mga pastulan nito sa mga Levita ng angkan ni Gerson: “sa lipi ni Issachar, ang Cesion pati ng mga nayon niyaon, ang Dabereth pati ng mga nayon niyaon”. Isinusulat ito ng King James Version na Kishon sa ikalawang talata, bagaman hindi ito ang ilog Cison. Ang kahawig na talaan sa Mga Cronica ay may Cedes sa lugar nito, kaya't alinman ang bayan ay may dalawang pangalan o nasira sa pagkopya ang isang talaan. Iyon lamang ang sinasabi ng Biblia, at walang sinaunang sanggunian na nagdaragdag ng tiyak."
    - "Hawak ng Issachar ang silangang bahagi ng libis ng Jezreel at ang mga burol sa palibot ng Bundok Tabor, at doon dapat nakalagay ang Chision. Unang minamarkahan ng mapa ang Tell Qisyon (Tel Kishyon) sa timog lamang ng Bundok Tabor, dahil sa alingawngaw ng pangalan; iminungkahi rin ang Tell Rekhesh sa tabi ng batis ng Tabor, Tell el-Ajjul at Tell Abu Qedeis, na iniuugnay ng ilan sa Cedes ng Mga Cronica. Walang naglabas ng inskripsiyong nagpapangalan dito, at bukas ang pagpili."
  da:
    - "Kisjion var en by i Issakars lod, nævnt i listen »og Rabbith og Kisjon og Ebez«, og senere givet med sine græsgange til leviterne af Gersjons slægt: »og af Isaskars Stamme: Kisjon og dens Marker, Dabrath og dens Marker«. King James-oversættelsen staver det Kishon på det andet sted, men det er ikke floden Kisjon. Den parallelle liste i Krønikebøgerne har Kedesj i dens sted, så enten havde byen to navne, eller også har den ene liste lidt ved afskrivning. Det er alt, Bibelen siger, og ingen gammel kilde tilføjer noget sikkert."
    - "Issakar rådede over den østlige del af Jizre'el-dalen og højderne omkring Tabor, og Kisjion må ligge dér. Kortet markerer først Tell Qisyon (Tel Kishyon) lige syd for Tabor, for navnets efterklang; Tell Rekhesh ved Tabor-bækken, Tell el-Ajjul og Tell Abu Qedeis, som nogle forbinder med Krønikebøgernes Kedesj, er også blevet foreslået. Ingen har givet en indskrift, der nævner den, og valget forbliver åbent."
  sr:
    - "Кисион је био град у делу Исахара, наведен у списку „и Равит и Кисион и Авес“, а касније дат са својим пашњацима левитима из породице Гирсона: „а од племена Исахаровог: Кисон с подграђем, Даврот с подграђем“. Библија краља Џејмса на другом месту пише Кишон, мада то није река Кисон. Паралелни списак у Дневницима уместо њега има Кедес, па је или град имао два имена или је један списак настрадао при преписивању. То је све што Библија каже, и ниједан древни извор не додаје ништа сигурно."
    - "Исахар је држао источни део Језраелске долине и брда око Тавора, и Кисион мора лежати ту. Мапа прво означава Тел Кисјон (Тел Кишјон) одмах јужно од Тавора, због одјека имена; предлагани су и Тел Рекеш крај потока Тавор, Тел ел-Аџул и Тел Абу Кедис, које неки повезују с Кедесом из Дневника. Ниједно није дало натпис који га именује, и избор остаје отворен."
scripture:
  - Josh.19.17-Josh.19.23
  - Josh.21.28
  - 1Chr.6.72
