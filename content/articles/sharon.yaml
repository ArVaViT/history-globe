body:
  en:
    - "Sharon is the coastal plain of Israel between the Yarkon river at Joppa and Mount Carmel, some 90 km long and up to about 15 km wide, between the Mediterranean and the hills of Samaria. Its red sandy soils and lines of sandstone ridges held back the streams, so that in antiquity much of it was oak forest and winter marsh rather than farmland; Strabo knew a great forest here, and the Crusaders the forest of Arsuf. The name, perhaps “level land”, was given to at least one other plain, in Gilead east of the Jordan, and a king of Lasharon fell to Joshua. The sarcophagus of Eshmunazar, king of Sidon, in the sixth or fifth century BC, records that the Persian king gave him Dor and Joppa, “the mighty lands of Dagon, which are in the plain of Sharon”."
    - "In the Bible Sharon is pasture and beauty. David's herds “that fed in Sharon” had their own overseer, Shitrai the Sharonite. The bride of the Song of Songs says, “I am the rose of Sharon, and the lily of the valleys”, the Synodal Bible's narcissus; which flower is meant, crocus, narcissus or tulip, is unknown. Isaiah measures desolation by it, “Sharon is like a wilderness”, and restoration too: the desert shall be given “the excellency of Carmel and Sharon”, and “Sharon shall be a fold of flocks ... for my people that have sought me”. When Peter healed Aeneas at Lydda, “all that dwelt at Lydda and Saron saw him, and turned to the Lord”."
    - "Herod built Caesarea on its shore, and the Roman road from Antioch to Egypt ran its length. Eusebius knew Saron as the country between Caesarea and Joppa, still so called in his day. In the Ottoman centuries the plain was thinly settled and malarial; from the 1880s Jewish colonies drained its swamps and planted citrus, and the Jaffa orange made Sharon known abroad. Today it is one of the most densely peopled regions of Israel, from the northern suburbs of Tel Aviv through Herzliya and Netanya to Hadera, with a national park on the coast keeping a strip of the old dunes and scrub."
  ru:
    - "Сарон — прибрежная равнина Израиля между рекой Яркон у Иоппии и горой Кармил, около 90 км в длину и до 15 км в ширину, между Средиземным морем и холмами Самарии. Её красные песчаные почвы и гряды песчаника задерживали потоки, так что в древности большая её часть была дубовым лесом и зимним болотом, а не пашней; Страбон знал здесь большой лес, а крестоносцы — лес Арсуфа. Имя, возможно «ровная земля», носила по меньшей мере ещё одна равнина, в Галааде за Иорданом, а царь Шарона пал перед Иисусом Навином. Саркофаг Эшмуназара, царя Сидона, в VI или V веке до н. э. записывает, что персидский царь дал ему Дор и Иоппию, «могучие земли Дагона, что на равнине Сарона»."
    - "В Библии Сарон — пастбище и красота. Над крупным скотом Давида, «пасущимся в Шароне», стоял свой начальник, Шитрай Шаронянин. Невеста Песни песней говорит: «Я нарцисс Саронский, лилия долин!» — в английской Библии роза Сарона; какой цветок имеется в виду, крокус, нарцисс или тюльпан, неизвестно. Исаия мерит им запустение: «Сарон похож стал на пустыню», — и восстановление: пустыне дастся «великолепие Кармила и Сарона», и «будет Сарон пастбищем для овец» для народа, который взыскал Господа. Когда Пётр исцелил Энея в Лидде, «видели его все, живущие в Лидде и в Сароне, которые и обратились к Господу»."
    - "Ирод построил на его берегу Кесарию, а римская дорога из Антиохии в Египет шла по всей его длине. Евсевий знал Сарон как страну между Кесарией и Иоппией, которую так называли и в его дни. В османские века равнина была малолюдной и малярийной; с 1880-х годов еврейские колонии осушали её болота и сажали цитрусовые, и яффский апельсин сделал Сарон известным за границей. Сегодня это одна из самых густонаселённых областей Израиля, от северных пригородов Тель-Авива через Герцлию и Нетанию до Хадеры, а национальный парк на побережье хранит полосу старых дюн и кустарника."
  uk:
    - "Шарон — прибережна рівнина Ізраїлю між річкою Яркон біля Яффи та горою Кармель, завдовжки близько 90 км і завширшки до 15 км, між Середземним морем і пагорбами Самарії. Його червоні піщані ґрунти та ряди пісковикових пасом затримували потоки, тож у давнину значна його частина була не ріллею, а дубовим лісом і зимовим болотом; Страбон знав тут великий ліс, а хрестоносці — ліс Арсуфа. Назву, можливо «рівна земля», носила принаймні ще одна рівнина — у Гілеаді, на схід від Йордану, а цар Шарону (Лашарону) впав перед Ісусом Навином. Саркофаг Ешмуназара, царя Сідона, VI або V ст. до н. е., повідомляє, що перський цар віддав йому Дор і Яффу, «могутні землі Дагона, що лежать на рівнині Шарон»."
    - "У Біблії Шарон — це пасовища й краса. Над Давидовим товаром, «що пасся в Шаронї», стояв свій наглядач, шаронець Шітрай. Наречена Пісні над піснями каже: «Я нарциз, Соронська квітка, я лилїя долиняна!» — у Куліша це нарцис; яка саме квітка мається на увазі, шафран, нарцис чи тюльпан, невідомо. Ісая вимірює Шароном і спустошення — «Сарон став, як пустиня», — і відновлення: пустелі буде дано «роскіш Кармеля й Сарону», а «буде Сарон пасовищем овець ... народу мого, що до мене горнувся». Коли Петро зцілив Енея в Лідді, «бачили його всї, що жили в Лиддї та в Саронї, котрі навернулись до Господа»."
    - "Ірод збудував на його березі Кесарію, і вздовж нього йшла римська дорога з Антіохії до Єгипту. Євсевій знав Сарон як край між Кесарією та Яффою, що так називався ще за його часів. В османські століття рівнина була слабо заселена й малярійна; від 1880-х років єврейські колонії осушили її болота й насадили цитруси, і яффський апельсин прославив Шарон за кордоном. Сьогодні це одна з найгустіше населених областей Ізраїлю — від північних передмість Тель-Авіва через Герцлію й Нетанію до Хадери, а національний парк на узбережжі зберігає смугу давніх дюн і чагарників."
  es:
    - "Sarón es la llanura costera de Israel entre el río Yarkon, en Jope, y el monte Carmelo, de unos 90 km de largo y hasta unos 15 km de ancho, entre el Mediterráneo y las colinas de Samaria. Sus suelos arenosos rojos y sus líneas de crestas de arenisca retenían las corrientes, de modo que en la Antigüedad gran parte era bosque de encinas y marisma invernal más que tierra de labor; Estrabón conocía aquí un gran bosque, y los cruzados el bosque de Arsuf. El nombre, quizá «tierra llana», se dio al menos a otra llanura, en Galaad, al este del Jordán, y un rey de Lasarón cayó ante Josué. El sarcófago de Eshmunazar, rey de Sidón, en el siglo VI o V a. C., registra que el rey persa le dio Dor y Jope, «las poderosas tierras de Dagón, que están en la llanura de Sarón»."
    - "En la Biblia Sarón es pasto y belleza. Los rebaños de David «que pastaban en Sarón» tenían su propio mayoral, Sitrai el saronita. La esposa del Cantar de los Cantares dice: «Yo soy la rosa de Sarón, y el lirio de los valles», el narciso de la Biblia sinodal; qué flor se quiere decir, azafrán, narciso o tulipán, se ignora. Isaías mide con ella la desolación, «hase tornado Sarón como desierto», y también la restauración: al desierto le será dada «la hermosura de Carmel y de Sarón», y «Y será Sarón para habitación de ovejas … á mi pueblo que me buscó». Cuando Pedro sanó a Eneas en Lida, «viéronle todos los que habitaban en Lydda y en Sarona, los cuales se convirtieron al Señor»."
    - "Herodes construyó Cesarea en su costa, y la calzada romana de Antioquía a Egipto recorría su longitud. Eusebio conocía Saron como la región entre Cesarea y Jope, así llamada aún en su tiempo. En los siglos otomanos la llanura estuvo poco poblada y era palúdica; desde la década de 1880 las colonias judías drenaron sus pantanos y plantaron cítricos, y la naranja de Jafa dio a conocer Sarón en el extranjero. Hoy es una de las regiones más densamente pobladas de Israel, desde los suburbios del norte de Tel Aviv, pasando por Herzliya y Netanya, hasta Hadera, con un parque nacional en la costa que conserva una franja de las antiguas dunas y matorrales."
  pt:
    - "Sarom é a planície costeira de Israel entre o rio Yarkon, em Jope, e o Monte Carmelo, com cerca de 90 km de comprimento e até uns 15 km de largura, entre o Mediterrâneo e as colinas de Samaria. Seus solos arenosos vermelhos e fileiras de cristas de arenito retinham os riachos, de modo que na Antiguidade grande parte dela era floresta de carvalhos e pântano de inverno e não terra de lavoura; Estrabão conheceu aqui uma grande floresta, e os cruzados a floresta de Arsuf. O nome, talvez “terra plana”, foi dado a pelo menos outra planície, em Gileade, a leste do Jordão, e um rei de Lassarom caiu diante de Josué. O sarcófago de Eshmunazar, rei de Sidom, no século VI ou V a.C., registra que o rei persa lhe deu Dor e Jope, “as poderosas terras de Dagon, que ficam na planície de Sarom”."
    - "Na Bíblia Sarom é pasto e beleza. Os rebanhos de Davi “que pastavam em Sarom” tinham seu próprio encarregado, Sitrai, o saronita. A noiva do Cântico dos Cânticos diz: “Eu sou a rosa de Sarom, o lírio dos vales”, o narciso da Bíblia Sinodal; que flor se tem em vista, açafrão, narciso ou tulipa, é desconhecido. Isaías mede por ela a desolação, “Sarom é como um deserto”, e também a restauração: ao deserto será dada “a excelência do Carmelo e de Sarom”, e “Sarom será um curral de rebanhos … para o meu povo que me buscou”. Quando Pedro curou Enéias em Lida, “Todos os que viviam em Lida e Sarona o viram e se converteram ao Senhor”."
    - "Herodes construiu Cesareia em sua costa, e a estrada romana de Antioquia ao Egito corria por todo o seu comprimento. Eusébio conhecia Saron como o país entre Cesareia e Jope, ainda assim chamado em seu tempo. Nos séculos otomanos a planície foi pouco povoada e malárica; a partir da década de 1880 colônias judaicas drenaram seus pântanos e plantaram citros, e a laranja de Jafa tornou Sarom conhecida no exterior. Hoje é uma das regiões mais densamente povoadas de Israel, dos subúrbios do norte de Tel Aviv, passando por Herzliya e Netanya, até Hadera, com um parque nacional na costa que guarda uma faixa das antigas dunas e do mato."
  de:
    - "Scharon ist die Küstenebene Israels zwischen dem Jarkon bei Joppe und dem Karmel, etwa 90 km lang und bis zu 15 km breit, zwischen dem Mittelmeer und den Hügeln Samarias. Ihre roten Sandböden und Reihen von Sandsteinrücken hielten die Bäche zurück, sodass sie in der Antike weithin Eichenwald und Wintersumpf statt Ackerland war; Strabon kannte hier einen großen Wald und die Kreuzfahrer den Wald von Arsuf. Der Name, vielleicht „Flachland“, wurde mindestens einer anderen Ebene gegeben, in Gilead östlich des Jordan, und ein König von Lascharon fiel an Josua. Der Sarkophag Eschmunazars, des Königs von Sidon, aus dem 6. oder 5. Jahrhundert v. Chr. verzeichnet, dass der Perserkönig ihm Dor und Joppe gab, „die mächtigen Länder Dagons, die in der Ebene von Scharon liegen“."
    - "In der Bibel ist Scharon Weide und Schönheit. Davids Herden, die „zu Saron“ weideten, hatten ihren eigenen Aufseher, Schitrai den Scharoniter. Die Braut des Hohelieds sagt: „Ich bin eine Blume zu Saron und eine Rose im Tal“ (die Synodalübersetzung hat „Narzisse“); welche Blume gemeint ist, Krokus, Narzisse oder Tulpe, ist unbekannt. Jesaja misst daran die Verwüstung, „Saron ist wie eine Wüste“, und auch die Wiederherstellung: Der Wüste sei „der Schmuck Karmels und Sarons“ gegeben, und „Saron soll eine Weide für die Herde“ sein „meinem Volk, das mich sucht“. Als Petrus Äneas in Lydda heilte, „sahen ihn alle, die zu Lydda und in Saron wohnten; die bekehrten sich zu dem HERRN“."
    - "Herodes baute Caesarea an ihrer Küste, und die römische Straße von Antiochia nach Ägypten verlief ihrer Länge nach. Eusebius kannte Saron als das Land zwischen Caesarea und Joppe, zu seiner Zeit noch so genannt. In den osmanischen Jahrhunderten war die Ebene dünn besiedelt und malariaverseucht; ab den 1880er Jahren legten jüdische Kolonien ihre Sümpfe trocken und pflanzten Zitrusfrüchte, und die Jaffa-Orange machte Scharon im Ausland bekannt. Heute ist sie eine der am dichtesten besiedelten Regionen Israels, von den nördlichen Vororten von Tel Aviv über Herzlija und Netanja bis Chadera, mit einem Nationalpark an der Küste, der einen Streifen der alten Dünen und des Buschlands bewahrt."
  fr:
    - "Le Saron est la plaine côtière d’Israël entre le Yarkon à Joppé et le mont Carmel, longue d’environ 90 km et large d’au plus 15 km, entre la Méditerranée et les collines de Samarie. Ses sols rouges sableux et ses lignes de crêtes de grès retenaient les cours d’eau, si bien qu’à l’Antiquité une grande partie n’était pas des terres cultivées mais une forêt de chênes et des marais d’hiver ; Strabon y connaissait une grande forêt, et les croisés la forêt d’Arsouf. Le nom, peut-être « terre plate », fut donné à au moins une autre plaine, en Galaad à l’est du Jourdain, et un roi de Lascharon tomba devant Josué. Le sarcophage d’Eshmounazar, roi de Sidon, au VIe ou Ve siècle av. J.-C., consigne que le roi perse lui donna Dor et Joppé, « les terres puissantes de Dagon, qui sont dans la plaine de Saron »."
    - "Dans la Bible, le Saron est pâturage et beauté. Les troupeaux de David « qui paissaient en Saron » avaient leur propre surveillant, Schithraï de Saron. La fiancée du Cantique des cantiques dit : « Je suis un narcisse de Saron, un lis des vallées », « rose » dans la King James, « narcisse » dans la Bible synodale russe comme chez Louis Segond ; quelle fleur est visée, crocus, narcisse ou tulipe, on l’ignore. Ésaïe mesure la désolation par lui, « Le Saron est comme un désert », et aussi la restauration : le désert recevra « la magnificence du Carmel et de Saron », et « Le Saron servira de pâturage au menu bétail … pour mon peuple qui m’aura cherché ». Quand Pierre guérit Énée à Lydde, « tous les habitants de Lydde et du Saron le virent, et ils se convertirent au Seigneur »."
    - "Hérode bâtit Césarée sur son rivage, et la route romaine d’Antioche à l’Égypte en parcourait la longueur. Eusèbe connaissait Saron comme le pays entre Césarée et Joppé, ainsi nommé encore à son époque. Aux siècles ottomans, la plaine était peu peuplée et paludéenne ; dès les années 1880, des colonies juives asséchèrent ses marais et plantèrent des agrumes, et l’orange de Jaffa fit connaître le Saron à l’étranger. Aujourd’hui, c’est l’une des régions les plus densément peuplées d’Israël, des banlieues nord de Tel-Aviv par Herzliya et Netanya jusqu’à Hadera, avec un parc national sur la côte qui garde une bande des anciennes dunes et broussailles."
  it:
    - "Il Saròn è la pianura costiera di Israele tra il fiume Yarkon a Giaffa e il Monte Carmelo, lunga circa 90 km e larga fino a circa 15 km, tra il Mediterraneo e le colline della Samaria. I suoi suoli rossi e sabbiosi e le file di dorsali di arenaria trattenevano i corsi d’acqua, così che nell’antichità gran parte di essa era foresta di querce e palude invernale più che terra coltivata; Strabone conosceva qui una grande foresta, e i Crociati la foresta di Arsuf. Il nome, forse «terra piana», fu dato ad almeno un’altra pianura, in Galaad a est del Giordano, e un re di Lassaron cadde davanti a Giosuè. Il sarcofago di Eshmunazar, re di Sidone, nel VI o V secolo a.C., registra che il re persiano gli diede Dor e Giaffa, «le potenti terre di Dagon, che si trovano nella pianura di Saròn»."
    - "Nella Bibbia il Saròn è pascolo e bellezza. Il bestiame di Davide «che pasceva a Sharon» aveva un proprio sovrintendente, Sitrai da Sharon. La sposa del Cantico dei Cantici dice: «Io sono la rosa di Saron, il giglio delle valli», il narciso della Bibbia sinodale; quale fiore sia inteso, croco, narciso o tulipano, è ignoto. Isaia ne misura la desolazione, «Saron è come un deserto», e anche la restaurazione: al deserto sarà data «la magnificenza del Carmel e di Saron», e «Saron sarà un chiuso di greggi … per il mio popolo che m’avrà cercato». Quando Pietro guarì Enea a Lidda, «tutti gli abitanti di Lidda e del pian di Saron lo videro e si convertirono al Signore»."
    - "Erode costruì Cesarea sulla sua riva, e la strada romana da Antiochia all’Egitto ne correva per tutta la lunghezza. Eusebio conosceva Saron come il paese tra Cesarea e Giaffa, ancora così chiamato ai suoi tempi. Nei secoli ottomani la pianura era scarsamente popolata e malarica; dagli anni 1880 le colonie ebraiche prosciugarono le sue paludi e piantarono agrumi, e l’arancia di Giaffa rese il Saròn noto all’estero. Oggi è una delle regioni più densamente popolate di Israele, dai sobborghi settentrionali di Tel Aviv attraverso Herzliya e Netanya fino a Hadera, con un parco nazionale sulla costa che conserva una striscia delle antiche dune e della macchia."
  pl:
    - "Szaron to nadmorska równina Izraela między rzeką Jarkon koło Jafy a górą Karmel, długa na około 90 km i szeroka do około 15 km, między Morzem Śródziemnym a wzgórzami Samarii. Jej czerwone piaszczyste gleby i pasma piaskowcowych grzbietów zatrzymywały strumienie, tak że w starożytności większą jej część stanowił las dębowy i zimowe bagno, nie pole uprawne; Strabon znał tu wielki las, a krzyżowcy las Arsuf. Nazwę, być może „równina”, nadano co najmniej jeszcze jednej równinie, w Gileadzie na wschód od Jordanu, a król Lasaron padł przed Jozuem. Sarkofag Eszmunazara, króla Sydonu, z VI lub V wieku p.n.e., zapisuje, że król perski dał mu Dor i Jafę, „potężne ziemie Dagona, które są na równinie Szaron”."
    - "W Biblii Szaron to pastwisko i piękno. Stada Dawida, „które paszono w Saron”, miały własnego nadzorcę, Szitraja Szaronitę. Oblubienica z Pieśni nad Pieśniami mówi: „Jam jest jako róża Sarońska, a lilija przy dolinach”, narcyz Biblii synodalnej; który kwiat jest tu na myśli, krokus, narcyz czy tulipan, nie wiadomo. Izajasz mierzy nim spustoszenie, „Saron się stał jako pustynia”, a także odnowienie: pustyni będzie dana „ozdoba Karmelu i Saronu”, i „Saron będzie za pastwisko owcom… ludu mojego, którzy mię szukali”. Gdy Piotr uzdrowił Eneasza w Liddzie, „widzieli go wszyscy, którzy mieszkali w Liddzie i w Saronie, którzy się nawrócili do Pana”."
    - "Herod zbudował na jego brzegu Cezareę, a rzymska droga z Antiochii do Egiptu biegła jego długością. Euzebiusz znał Saron jako kraj między Cezareą a Jafą, w jego czasach wciąż tak zwany. W stuleciach osmańskich równina była słabo zaludniona i malaryczna; od lat osiemdziesiątych XIX wieku żydowskie kolonie osuszały jej bagna i sadziły cytrusy, a pomarańcza z Jafy rozsławiła Szaron za granicą. Dziś jest to jeden z najgęściej zaludnionych regionów Izraela, od północnych przedmieść Tel Awiwu przez Herclijję i Netanję po Chaderę, z parkiem narodowym na wybrzeżu zachowującym pas dawnych wydm i zarośli."
  cs:
    - "Šaron je pobřežní rovina Izraele mezi řekou Jarkon u Joppe a Karmelem, dlouhá asi 90 km a široká až asi 15 km, mezi Středozemním mořem a pahorky Samaří. Její červené písčité půdy a řady pískovcových hřebenů zadržovaly potoky, takže ve starověku byla z velké části dubovým lesem a zimním močálem spíše než ornou půdou; Strabón znal zdejší velký les a křižáci les Arsúf. Jméno, snad „rovná země“, dostala nejméně jedna další rovina, v Gileadu východně od Jordánu, a král Šaronu padl před Jozuem. Sarkofág Ešmunazara, krále Sidónu, z 6. nebo 5. století př. n. l. zaznamenává, že mu perský král dal Dór a Joppe, „mocné země Dagonovy, které jsou v šaronské rovině“."
    - "V Bibli je Šaron pastvou a krásou. Davidova stáda, „kteříž se pásli v Sáron“, měla vlastního správce, Šitraje Šaronského. Nevěsta Písně písní praví: „Já jsem růže Sáronská, a lilium při dolinách“, v synodální Bibli narcis; která květina se myslí, krokus, narcis či tulipán, není známo. Izajáš jím měří zpustošení, „Sáron učiněn jako poušť“, i obnovu: poušti bude dána „okrasa Karmelská a Sáronská“ a „Lid pak můj, kteříž by mne hledali, budou míti Sáron za pastviště ovcím“. Když Petr uzdravil Ainéa v Lyddě, „viděli jej všickni, kteříž bydlili v Lyddě a v Sároně, kteříž se obrátili ku Pánu“."
    - "Herodes vystavěl na jeho břehu Cesareu a římská silnice z Antiochie do Egypta vedla po celé jeho délce. Eusebius znal Saron jako krajinu mezi Cesareou a Joppe, tak ještě za jeho dnů zvanou. V osmanských staletích byla rovina řídce osídlena a malarická; od 80. let 19. století židovské kolonie vysušily její močály a vysadily citrusy a jaffský pomeranč učinil Šaron známým v zahraničí. Dnes je jednou z nejhustěji osídlených oblastí Izraele, od severních předměstí Tel Avivu přes Hercliju a Netanju po Chaderu, s národním parkem na pobřeží, který uchovává pás starých dun a křovin."
  nl:
    - "Saron is de kustvlakte van Israël tussen de Jarkon bij Joppe en de Karmel, zo’n 90 km lang en tot ongeveer 15 km breed, tussen de Middellandse Zee en de heuvels van Samaria. Haar rode zandgronden en reeksen zandsteenruggen hielden de beken tegen, zodat ze in de oudheid grotendeels eikenbos en wintermoeras was in plaats van akkerland; Strabo kende hier een groot bos, en de kruisvaarders het bos van Arsuf. De naam, misschien “vlak land”, werd aan minstens één andere vlakte gegeven, in Gilead ten oosten van de Jordaan, en een koning van Lassaron viel voor Jozua. De sarcofaag van Esmunazar, koning van Sidon, uit de 6e of 5e eeuw v.Chr. vermeldt dat de Perzische koning hem Dor en Joppe gaf, “de machtige landen van Dagon, die in de vlakte van Saron liggen”."
    - "In de Bijbel is Saron weide en schoonheid. Davids runderen “die in Saron weidden” hadden hun eigen opzichter, Sitrai de Saroniet. De bruid van het Hooglied zegt: “Ik ben een Roos van Saron, een Lelie der dalen”, bij de Synodale Bijbel een narcis; welke bloem bedoeld is, krokus, narcis of tulp, is onbekend. Jesaja meet er verwoesting mee, “Saron is geworden als een woestijn”, en ook herstel: de woestijn zal worden gegeven “het sieraard van Karmel en Saron”, en “Saron zal tot een schaapskooi worden ... voor Mijn volk, dat Mij gezocht heeft”. Toen Petrus Aeneas te Lydda genas, “zagen hem allen, die te Lydda en Sarona woonden, dewelke zich bekeerden tot den Heere”."
    - "Herodes bouwde Caesarea aan haar kust, en de Romeinse weg van Antiochië naar Egypte liep over haar hele lengte. Eusebius kende Saron als het land tussen Caesarea en Joppe, in zijn dagen nog zo genoemd. In de Ottomaanse eeuwen was de vlakte dun bevolkt en malariaal; vanaf de jaren 1880 droogden Joodse kolonies haar moerassen uit en plantten citrus, en de Jaffa-sinaasappel maakte Saron in het buitenland bekend. Tegenwoordig is het een van de dichtstbevolkte streken van Israël, van de noordelijke voorsteden van Tel Aviv via Herzliya en Netanya tot Hadera, met een nationaal park aan de kust dat een strook van de oude duinen en struikgewas bewaart."
  sv:
    - "Saron är Israels kustslätt mellan Yarkon vid Joppe och Karmel, omkring 90 km lång och upp till cirka 15 km bred, mellan Medelhavet och Samariens berg. Dess röda sandjordar och rader av sandstensåsar höll tillbaka vattendragen, så att mycket av den under antiken var ekskog och vintersump snarare än åkermark; Strabon kände en stor skog här, och korsfararna Arsufskogen. Namnet, kanske ”slätt mark”, gavs åt åtminstone en annan slätt, i Gilead öster om Jordan, och en kung av Lasharon föll för Josua. Sarkofagen av Eshmunazar, kung av Sidon, från 500- eller 400-talet f.Kr., berättar att den persiske kungen gav honom Dor och Joppe, ”Dagons mäktiga länder, som ligger på Sarons slätt”."
    - "I Bibeln är Saron bete och skönhet. Davids hjordar ”som betade i Saron” hade en egen uppsyningsman, saroniten Shitraj. Bruden i Höga visan säger: ”Jag är ett ringa blomster i Saron, en lilja i dalen”, i den synodala bibeln en narciss; vilken blomma som avses, krokus, narciss eller tulpan, är okänt. Jesaja mäter ödeläggelse med det, ”Saron har blivit likt en hedmark”, och återupprättelse också: öknen ska få ”Karmels och Sarons prakt”, och ”Saron skall bliva en betesmark för får … åt mitt folk, när det söker mig”. När Petrus botade Aineas i Lydda, ”alla som bodde i Lydda och i Saron sågo honom; och de omvände sig till Herren”."
    - "Herodes byggde Caesarea på dess strand, och den romerska vägen från Antiochia till Egypten löpte längs den. Eusebios kände Saron som landet mellan Caesarea och Joppe, ännu så kallat på hans tid. Under de osmanska århundradena var slätten glest bebodd och malariadrabbad; från 1880-talet torrlade judiska kolonier dess träsk och planterade citrus, och Jaffaapelsinen gjorde Saron känt utomlands. I dag är det en av Israels tätast befolkade regioner, från Tel Avivs norra förorter genom Herzliya och Netanya till Hadera, med en nationalpark vid kusten som bevarar en remsa av de gamla dynerna och snåren."
  nb:
    - "Sjaron er den israelske kystsletten mellom Yarkon-elven ved Jaffa og Karmel, omtrent 90 km lang og opptil omkring 15 km bred, mellom Middelhavet og Samarias åser. De røde sandjordene og rekkene av sandsteinsåser holdt bekkene tilbake, slik at mye av den i oldtiden var eikeskog og vintermyr snarere enn åkerland; Strabon kjente en stor skog her, og korsfarerne skogen ved Arsuf. Navnet, kanskje «flatt land», ble gitt til minst en annen slette, i Gilead øst for Jordan, og en konge av Lasjaron falt for Josva. Sarkofagen til Esjmunazar, konge av Sidon, fra 500- eller 400-tallet f.Kr., forteller at den persiske kongen ga ham Dor og Jaffa, «Dagons mektige land, som ligger i Sjaron-sletten»."
    - "I Bibelen er Sjaron beitemark og skjønnhet. Davids hjorder «som beitet i Saron» hadde sin egen oppsynsmann, Sjitrai fra Sjaron. Bruden i Høysangen sier: «Jeg er Sarons blomst, dalenes lilje», den synodale bibelens narcissus; hvilken blomst som menes, krokus, narcissus eller tulipan, er ukjent. Jesaja måler ødeleggelse med det, «Saron er som den øde mark», og også gjenopprettelse: ørkenen skal få «Karmels og Sarons prakt», og «Saron skal bli til en beitemark for småfe, [...] til gagn for mitt folk, som søker mig». Da Peter helbredet Æneas i Lydda, ble det sagt at «alle som bodde i Lydda og Saron, så ham, og de omvendte sig til Herren»."
    - "Herodes bygde Cæsarea på kysten, og den romerske veien fra Antiokia til Egypt løp langs hele sletten. Eusebius kjente Saron som landet mellom Cæsarea og Jaffa, fortsatt kalt det på hans tid. I osmanske århundrer var sletten tynt befolket og malariaplaget; fra 1880-årene drenerte jødiske kolonier myrene og plantet sitrus, og Jaffa-appelsinen gjorde Sjaron kjent i utlandet. I dag er det en av Israels tettest befolkede regioner, fra Tel Avivs nordlige forsteder gjennom Herzliya og Netanya til Hadera, med en nasjonalpark på kysten som bevarer en stripe av de gamle dynene og krattet."
  tl:
    - "Ang Saron ay kapatagang baybayin ng Israel sa pagitan ng ilog Yarkon sa Joppa at Bundok Carmelo, mga 90 km ang haba at hanggang 15 km ang lapad, sa pagitan ng Mediteraneo at mga burol ng Samaria. Ang pulang mabuhanging lupa at hanay ng tagaytay na batong-buhangin nito ay humarang sa mga batis, kaya noong unang panahon malaking bahagi nito ay kagubatan ng encina at latian sa taglamig, hindi bukid; may kilalang malaking kagubatan dito si Strabo, at ang kagubatan ng Arsuf sa mga Krusado. Ang pangalan, marahil “patag na lupain”, ay ibinigay sa kahit isa pang kapatagan, sa Gilead sa silangan ng Jordan, at isang hari ng Lasaron ang nahulog kay Josue. Itinatala ng sarkopago ni Eshmunazar, hari ng Sidon, noong ika-6 o ika-5 siglo BK, na ibinigay sa kaniya ng haring Persiyano ang Dor at Joppa, “ang makapangyarihang mga lupain ng Dagon, na nasa kapatagan ng Saron”."
    - "Sa Bibliya, ang Saron ay pastulan at kagandahan. Ang mga kawan ni David na “pinasasabsab sa Saron” ay may sariling tagapamahala, si Sitrai na Saronita. Sinasabi ng nobya ng Awit ng mga Awit, “Ako'y rosa ng Saron, lila ng mga libis”, na narciso sa Bibliyang Sinodal; hindi alam kung aling bulaklak ang tinutukoy, krokus, narciso o tulipan. Sinusukat ni Isaias ang pagkawasak dito, “ang Saron ay gaya ng isang ilang”, at pati ang pagpapanumbalik: ibibigay sa ilang “ang karilagan ng Carmel at ng Saron”, at “ang Saron ay magiging kulungan ng mga kawan ... dahil sa aking bayan na humanap sa akin”. Nang pagalingin ni Pedro si Eneas sa Lidda, “siya'y nakita ng lahat ng mga nangananahan sa Lidda at sa Sarona, at sila'y nangagbalik-loob sa Panginoon”."
    - "Itinayo ni Herodes ang Cesarea sa baybayin nito, at ang daang Romano mula Antioquia hanggang Egipto ay tumakbo sa haba nito. Kilala ni Eusebio ang Saron bilang lupain sa pagitan ng Cesarea at Joppa, na ganoon pa rin ang tawag noong panahon niya. Sa mga siglong Otomano, kaunti ang nakatira sa kapatagan at may malarya; mula dekada 1880, pinatuyo ng mga kolonyang Judio ang mga latian nito at nagtanim ng sitrus, at ginawang kilala sa ibang bansa ng orange ng Jaffa ang Saron. Ngayon ito ay isa sa pinakamataong rehiyon ng Israel, mula sa hilagang suburb ng Tel Aviv sa pamamagitan ng Herzliya at Netanya hanggang Hadera, na may pambansang liwasan sa baybayin na nagtatago ng isang piraso ng lumang buhanginan at sukal."
