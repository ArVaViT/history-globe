body:
  en:
    - "Lycaonia was a high, dry plateau in south-central Anatolia, north of the Taurus. Strabo describes it as cold, bare of trees and short of water, but good for sheep and wild asses. Its people kept their own language long after Greek spread through the region, and from 25 BC most of the country belonged to the Roman province of Galatia. Its towns included Lystra, which Augustus made a Roman colony, and Derbe further east; Iconium on its western edge was often counted as Phrygian."
    - "On their first journey Paul and Barnabas were driven out of Iconium and “fled unto Lystra and Derbe, cities of Lycaonia, and unto the region that lieth round about”. At Lystra Paul healed a man lame from birth, “and when the people saw what Paul had done, they lifted up their voices, saying in the speech of Lycaonia, The gods are come down to us in the likeness of men”; they called Barnabas Zeus and Paul Hermes, and the priest of Zeus brought oxen and garlands to sacrifice, until the apostles tore their clothes and stopped them. Soon after, Jews from Antioch and Iconium stirred up the crowd, Paul was stoned and left for dead, and the next day he went on to Derbe."
    - "The name Lycaonia appears only in these two verses, but Paul came back through Lystra and Derbe, and at Lystra he took Timothy as a companion. Today the region is the plain of Konya in Turkey; the mound of Lystra lies by the village of Hatunsaray south of the city, where a Latin inscription naming the colony was found in 1885."
  ru:
    - "Ликаония — высокое сухое плато на юге Центральной Анатолии, к северу от Тавра. Страбон описывает её как холодную, безлесную и бедную водой, но пригодную для овец и диких ослов. Её жители долго сохраняли свой язык, когда греческий уже распространился по всей округе, и с 25 г. до н. э. большая часть страны входила в римскую провинцию Галатия. Среди её городов — Листра, которую Август сделал римской колонией, и Дервия восточнее; Иконию на её западном краю часто причисляли к Фригии."
    - "В первом путешествии Павла и Варнаву изгнали из Иконии, и они «удалились в Ликаонские города Листру и Дервию и в окрестности их». В Листре Павел исцелил хромого от рождения, и «народ же, увидев, что сделал Павел, возвысил свой голос, говоря по-ликаонски: боги в образе человеческом сошли к нам»; Варнаву назвали Зевсом, а Павла Ермием, и жрец Зевса привёл волов и принёс венки, чтобы совершить жертву, пока апостолы, разодрав одежды, не остановили их. Вскоре Иудеи из Антиохии и Иконии возбудили народ, Павла побили камнями и вытащили за город, почитая умершим, а на другой день он ушёл в Дервию."
    - "Имя Ликаонии встречается только в этих двух стихах, но Павел ещё возвращался через Листру и Дервию, и в Листре взял себе в спутники Тимофея. Сегодня этот край — Конийская равнина в Турции; холм Листры лежит у селения Хатунсарай к югу от города, где в 1885 году нашли латинскую надпись с именем колонии."
  uk:
    - "Лікаонія була високим сухим плато в південно-центральній Анатолії, на північ від Тавру. Страбон описує її як холодну, безлісу й бідну на воду, але добру для овець і диких ослів. Її народ зберігав власну мову довго після того, як грецька мова поширилася краєм, а від 25 р. до н. е. більша частина країни належала римській провінції Галатії. Серед її міст були Лістра, яку Август зробив римською колонією, і Дервія далі на схід; Іконію на її західному краю часто зараховували до Фрігії."
    - "У першій подорожі Павла й Варнаву вигнали з Іконії, і вони «повтїкали в городи Ликаонські, Листру та Дервию, і в околицю». У Лістрі Павло оздоровив чоловіка, кульгавого від народження, «Народ же, видївши, що зробив Павел, підняв голос свій, говорячи по ликаонськи: Боги, уподобившись людям, зійшли до нас»; вони назвали Варнаву Зевсом, а Павла Гермесом, і жрець Зевса приніс волів і вінки для жертви, аж поки апостоли не роздерли одежу й не зупинили їх. Невдовзі юдеї з Антіохії та Іконії підбурили натовп, Павла побили камінням і залишили мертвим, а наступного дня він пішов до Дервії."
    - "Назва Лікаонія з’являється лише в цих двох віршах, але Павло повернувся через Лістру й Дервію, і в Лістрі взяв Тимофія супутником. Сьогодні цей край — рівнина Конья в Туреччині; пагорб Лістри лежить біля села Хатунсарай на південь від міста, де 1885 р. знайдено латинський напис із назвою колонії."
  es:
    - "Licaonia era una meseta alta y seca del centro-sur de Anatolia, al norte del Tauro. Estrabón la describe como fría, sin árboles y escasa de agua, pero buena para las ovejas y los asnos salvajes. Su gente conservó su propia lengua mucho después de que el griego se extendiera por la región, y desde 25 a. C. la mayor parte del país perteneció a la provincia romana de Galacia. Entre sus ciudades estaban Listra, que Augusto convirtió en colonia romana, y Derbe, más al este; Iconio, en su borde occidental, se contaba a menudo como frigia."
    - "En su primer viaje, Pablo y Bernabé fueron expulsados de Iconio y «huyeron á Listra y Derbe, ciudades de Licaonia, y por toda la tierra alrededor». En Listra, Pablo sanó a un hombre cojo de nacimiento, y «Entonces las gentes, visto lo que Pablo había hecho, alzaron la voz, diciendo en lengua licaónica: Dioses semejantes á hombres han descendido á nosotros»; llamaron a Bernabé Zeus y a Pablo Hermes, y el sacerdote de Zeus trajo toros y guirnaldas para sacrificar, hasta que los apóstoles rasgaron sus ropas y lo impidieron. Poco después, judíos de Antioquía y de Iconio agitaron a la multitud, Pablo fue apedreado y dado por muerto, y al día siguiente continuó hacia Derbe."
    - "El nombre de Licaonia aparece solo en estos dos versículos, pero Pablo volvió a pasar por Listra y Derbe, y en Listra tomó a Timoteo como compañero. Hoy la región es la llanura de Konya, en Turquía; el montículo de Listra se halla junto a la aldea de Hatunsaray, al sur de la ciudad, donde en 1885 se encontró una inscripción latina que nombra la colonia."
  pt:
    - "A Licaônia era um planalto alto e seco no centro-sul da Anatólia, ao norte do Tauro. Estrabão a descreve como fria, sem árvores e escassa de água, mas boa para ovelhas e asnos selvagens. Seu povo manteve a própria língua muito depois de o grego se espalhar pela região, e desde 25 a.C. a maior parte do país pertenceu à província romana da Galácia. Suas cidades incluíam Listra, que Augusto fez colônia romana, e Derbe, mais a leste; Icônio, em sua borda ocidental, era muitas vezes contada como frígia."
    - "Em sua primeira viagem, Paulo e Barnabé foram expulsos de Icônio e “fugiram para as cidades da Licaônia, Listra e Derbe, e para a região circunvizinha”. Em Listra, Paulo curou um homem coxo de nascença: “Quando a multidão viu o que Paulo tinha feito, gritou em língua licaônica: ‘Os deuses desceram até nós em semelhança de homens!’”; chamaram Barnabé de Zeus e Paulo de Hermes, e o sacerdote de Zeus trouxe bois e guirlandas para sacrificar, até que os apóstolos rasgaram as roupas e os detiveram. Logo depois, judeus de Antioquia e Icônio incitaram a multidão, Paulo foi apedrejado e deixado por morto, e no dia seguinte seguiu para Derbe."
    - "O nome Licaônia aparece apenas nesses dois versículos, mas Paulo voltou por Listra e Derbe, e em Listra tomou Timóteo como companheiro. Hoje a região é a planície de Konya, na Turquia; o montículo de Listra fica junto à aldeia de Hatunsaray, ao sul da cidade, onde se achou em 1885 uma inscrição latina que nomeia a colônia."
  de:
    - "Lykaonien war ein hohes, trockenes Plateau in Südzentralanatolien, nördlich des Taurus. Strabon beschreibt es als kalt, baumlos und wasserarm, aber gut für Schafe und Wildesel. Seine Bewohner behielten ihre eigene Sprache lange, nachdem sich das Griechische in der Region verbreitet hatte, und ab 25 v. Chr. gehörte der größte Teil des Landes zur römischen Provinz Galatien. Zu seinen Städten zählten Lystra, das Augustus zur römischen Kolonie machte, und weiter östlich Derbe; Ikonion am Westrand wurde oft zu Phrygien gerechnet."
    - "Auf ihrer ersten Reise wurden Paulus und Barnabas aus Ikonion vertrieben und „entflohen in die Städte des Landes Lykaonien, gen Lystra und Derbe, und in die Gegend umher“. In Lystra heilte Paulus einen von Geburt an Lahmen, und es heißt: „Da aber das Volk sah, was Paulus getan hatte, hoben sie ihre Stimme auf und sprachen auf lykaonisch: Die Götter sind den Menschen gleich geworden und zu uns herniedergekommen“; sie nannten Barnabas Zeus und Paulus Hermes, und der Priester des Zeus brachte Ochsen und Kränze, um zu opfern, bis die Apostel ihre Kleider zerrissen und sie hinderten. Bald darauf wiegelten Juden aus Antiochia und Ikonion die Menge auf, Paulus wurde gesteinigt und für tot liegen gelassen, und am nächsten Tag zog er weiter nach Derbe."
    - "Der Name Lykaonien erscheint nur in diesen beiden Versen, doch Paulus kam auf der Rückreise wieder durch Lystra und Derbe, und in Lystra nahm er Timotheus als Gefährten mit. Heute ist die Region die Ebene von Konya in der Türkei; der Hügel von Lystra liegt beim Dorf Hatunsaray südlich der Stadt, wo 1885 eine lateinische Inschrift gefunden wurde, die die Kolonie nennt."
  fr:
    - "La Lycaonie était un haut plateau sec du centre-sud de l’Anatolie, au nord du Taurus. Strabon la décrit comme froide, sans arbres et manquant d’eau, mais bonne pour les moutons et les ânes sauvages. Son peuple garda sa propre langue longtemps après que le grec se fut répandu dans la région, et, à partir de 25 av. J.-C., la plus grande partie du pays appartint à la province romaine de Galatie. Ses villes comprenaient Lystre, qu’Auguste fit colonie romaine, et Derbe plus à l’est ; Icone, à sa lisière occidentale, était souvent comptée comme phrygienne."
    - "Lors de leur premier voyage, Paul et Barnabas, chassés d’Icone, « se réfugièrent dans les villes de la Lycaonie, à Lystre et à Derbe, et dans la contrée d’alentour ». À Lystre, Paul guérit un homme boiteux de naissance, et « à la vue de ce que Paul avait fait, la foule éleva la voix, et dit en langue lycaonienne : Les dieux sous une forme humaine sont descendus vers nous » ; ils appelèrent Barnabas Zeus et Paul Hermès, et le prêtre de Zeus amena des taureaux et des guirlandes pour sacrifier, jusqu’à ce que les apôtres déchirent leurs vêtements et les arrêtent. Peu après, des Juifs d’Antioche et d’Icone excitèrent la foule, Paul fut lapidé et laissé pour mort, et le lendemain il partit pour Derbe."
    - "Le nom de Lycaonie n’apparaît que dans ces deux versets, mais Paul repassa par Lystre et Derbe, et à Lystre il prit Timothée comme compagnon. Aujourd’hui, la région est la plaine de Konya, en Turquie ; le tertre de Lystre se trouve près du village de Hatunsaray, au sud de la ville, où une inscription latine nommant la colonie fut trouvée en 1885."
  it:
    - "La Licaonia era un altopiano alto e arido dell’Anatolia centro-meridionale, a nord del Tauro. Strabone la descrive come fredda, priva di alberi e povera d’acqua, ma buona per le pecore e per gli asini selvatici. Il suo popolo conservò la propria lingua molto dopo che il greco si fu diffuso nella regione, e dal 25 a.C. la maggior parte del paese appartenne alla provincia romana di Galazia. Tra le sue città vi erano Listra, che Augusto fece colonia romana, e Derbe più a est; Icònio, al suo margine occidentale, era spesso considerata frigia."
    - "Nel loro primo viaggio Paolo e Barnaba furono cacciati da Icònio e «se ne fuggirono nelle città di Licaonia, Listra e Derba e nel paese d’intorno». A Listra Paolo guarì un uomo zoppo fin dalla nascita, «E le turbe, avendo veduto ciò che Paolo avea fatto, alzarono la voce, dicendo in lingua licaonica: Gli dèi hanno preso forma umana, e sono discesi fino a noi»; chiamarono Barnaba Zeus e Paolo Ermes, e il sacerdote di Zeus portò tori e ghirlande per sacrificare, finché gli apostoli si stracciarono le vesti e li fermarono. Poco dopo, ebrei di Antiochia e di Icònio sobillarono la folla, Paolo fu lapidato e lasciato per morto, e il giorno seguente proseguì per Derbe."
    - "Il nome Licaonia compare solo in questi due versetti, ma Paolo tornò indietro passando per Listra e Derbe, e a Listra prese Timoteo come compagno. Oggi la regione è la pianura di Konya in Turchia; il tell di Listra si trova presso il villaggio di Hatunsaray a sud della città, dove nel 1885 fu trovata un’iscrizione latina che nomina la colonia."
  pl:
    - "Likaonia była wysokim, suchym płaskowyżem w południowo-środkowej Anatolii, na północ od Taurusu. Strabon opisuje ją jako zimną, bezdrzewną i ubogą w wodę, ale dobrą dla owiec i dzikich osłów. Jej mieszkańcy zachowali własny język długo po tym, jak grecki rozprzestrzenił się w regionie, a od 25 r. p.n.e. większość kraju należała do rzymskiej prowincji Galacji. Do jej miast należały Listra, którą August uczynił rzymską kolonią, i Derbe dalej na wschód; Ikonium na jej zachodnim skraju często zaliczano do Frygii."
    - "W swej pierwszej podróży Paweł i Barnaba zostali wygnani z Ikonium i „uciekli do miast Likaońskich, do Listry i do Derby, i do okolicznej krainy”. W Listrze Paweł uzdrowił człowieka chromego od urodzenia, „A lud widząc, co Paweł uczynił, podnieśli głos swój, mówiąc po likaońsku: Bogowie stawszy się podobni ludziom, zstąpili do nas”; Barnabę nazwali Zeusem, a Pawła Hermesem, a kapłan Zeusa przywiódł woły z wieńcami, by złożyć ofiarę, aż apostołowie rozdarli szaty i powstrzymali ich. Wkrótce potem Żydzi z Antiochii i Ikonium podburzyli tłum, Paweł został ukamienowany i pozostawiony jako umarły, a następnego dnia poszedł dalej do Derby."
    - "Nazwa Likaonia pojawia się tylko w tych dwóch wersetach, ale Paweł wracał przez Listrę i Derbe, a w Listrze wziął Tymoteusza na towarzysza. Dziś region to równina Konyi w Turcji; kopiec Listry leży przy wsi Hatunsaray na południe od miasta, gdzie w 1885 r. znaleziono łacińską inskrypcję z nazwą kolonii."
  nl:
    - "Lykaonië was een hoog, droog plateau in het zuidcentrale Anatolië, ten noorden van de Taurus. Strabo beschrijft het als koud, kaal van bomen en schaars aan water, maar goed voor schapen en wilde ezels. Zijn bewoners behielden hun eigen taal lang nadat het Grieks zich door de streek had verspreid, en vanaf 25 v.Chr. behoorde het grootste deel van het land tot de Romeinse provincie Galatië. Tot zijn steden behoorden Lystra, dat Augustus tot Romeinse kolonie maakte, en Derbe verder oostelijk; Ikonium aan de westrand werd vaak tot Frygië gerekend."
    - "Op hun eerste reis werden Paulus en Barnabas uit Ikonium verdreven: zij zijn “gevlucht naar de steden van Lykaonië, namelijk Lystre en Derbe, en het omliggende land”. In Lystra genas Paulus een man die van de moederschoot af kreupel was, “En de scharen, ziende, hetgeen Paulus gedaan had, verhieven hun stemmen, en zeiden in het Lycaonisch: De goden zijn den mensen gelijk geworden, en tot ons nedergekomen”; zij noemden Barnabas Zeus en Paulus Hermes, en de priester van Zeus bracht ossen en kransen om te offeren, tot de apostelen hun kleren scheurden en hen tegenhielden. Kort daarna hitsten joden uit Antiochië en Ikonium de menigte op, Paulus werd gestenigd en voor dood achtergelaten, en de volgende dag ging hij verder naar Derbe."
    - "De naam Lykaonië komt alleen in deze twee verzen voor, maar Paulus kwam terug via Lystra en Derbe, en in Lystra nam hij Timoteüs als metgezel. Tegenwoordig is de streek de vlakte van Konya in Turkije; de heuvel van Lystra ligt bij het dorp Hatunsaray ten zuiden van de stad, waar in 1885 een Latijnse inscriptie met de naam van de kolonie werd gevonden."
  cs:
    - "Lykaonie byla vysoká, suchá náhorní rovina ve středojižní Anatolii, severně od Tauru. Strabón ji líčí jako studenou, bez stromů a s nedostatkem vody, ale dobrou pro ovce a divoké osly. Její lid si udržel vlastní jazyk dlouho poté, co se řečtina v kraji rozšířila, a od roku 25 př. n. l. patřila většina země k římské provincii Galacii. K jejím městům patřila Lystra, kterou Augustus učinil římskou kolonií, a Derbe dále na východě; Ikonium na jejím západním okraji bylo často počítáno k Frygii."
    - "Na své první cestě byli Pavel a Barnabáš vyhnáni z Ikonia a „utekli do měst Lykaonitských, do Lystry a do Derben, a do toho okolí“. V Lystře Pavel uzdravil muže chromého od narození: „Zástupové pak viděvše, co učinil Pavel, pozdvihli hlasu svého, Lykaonitsky řkouce: Bohové připodobnivše se lidem, sstoupili k nám“; nazvali Barnabáše Diem a Pavla Hermem a kněz Diův přivedl býky a věnce, aby obětoval, dokud apoštolové neroztrhli své roucho a nezastavili je. Brzy poté pobouřili zástup Židé z Antiochie a Ikonia, Pavel byl ukamenován a nechán pro mrtvého a nazítří odešel dál do Derbe."
    - "Jméno Lykaonie se objevuje jen v těchto dvou verších, ale Pavel se vracel přes Lystru a Derbe a v Lystře si vzal za společníka Timotea. Dnes je kraj konyaskou rovinou v Turecku; pahorek Lystry leží u vesnice Hatunsaray jižně od města, kde byl roku 1885 nalezen latinský nápis jmenující kolonii."
  sv:
    - "Lykaonien var en hög, torr platå i södra centrala Anatolien, norr om Taurus. Strabon beskriver den som kall, trädlös och vattenfattig, men god för får och vildåsnor. Dess folk behöll sitt eget språk långt efter att grekiskan spridit sig genom regionen, och från 25 f.Kr. tillhörde större delen av landet den romerska provinsen Galatien. Bland dess städer fanns Lystra, som Augustus gjorde till romersk koloni, och Derbe längre österut; Ikonion vid dess västra kant räknades ofta som frygiskt."
    - "På sin första resa drevs Paulus och Barnabas ut från Ikonion: ”flydde de, så snart de förstodo huru det var, till städerna Lystra och Derbe i Lykaonien och till trakten omkring dem”. Vid Lystra botade Paulus en man som var halt från födseln. ”När folket såg vad Paulus hade gjort, hovo de upp sin röst och ropade på lykaoniskt tungomål: »Gudarna hava stigit ned till oss i människogestalt.»” De kallade Barnabas Zeus och Paulus Hermes, och Zeus' präst kom med oxar och kransar för att offra, tills apostlarna slet sina kläder och hejdade dem. Strax därefter hetsade judar från Antiochia och Ikonion upp folkhopen, Paulus stenades och lämnades för död, och dagen därpå gick han vidare till Derbe."
    - "Namnet Lykaonien förekommer bara i dessa två verser, men Paulus kom tillbaka genom Lystra och Derbe, och i Lystra tog han Timoteus till följeslagare. I dag är regionen Konyaslätten i Turkiet; Lystras kulle ligger vid byn Hatunsaray söder om staden, där en latinsk inskrift som nämner kolonin hittades 1885."
  nb:
    - "Lykaonia var et høyt, tørt platå i det sørlige sentrale Anatolia, nord for Taurus. Strabon beskriver det som kaldt, bart for trær og fattig på vann, men godt for sauer og villesler. Folket beholdt sitt eget språk lenge etter at gresk spredte seg i regionen, og fra 25 f.Kr. hørte det meste av landet til den romerske provinsen Galatia. Byene omfattet Lystra, som Augustus gjorde til romersk koloni, og Derbe lenger øst; Ikonium i vest ble ofte regnet som frygisk."
    - "På sin første reise ble Paulus og Barnabas drevet ut av Ikonium, og da «flydde de til byene i Lykaonia, Lystra og Derbe, og landet deromkring». I Lystra helbredet Paulus en mann som var vanfør fra mors liv av. «Men da folket så det som Paulus hadde gjort, ropte de med høi røst på lykaonisk og sa: Gudene er blitt mennesker lik og er kommet ned til oss.» De kalte Barnabas Zevs og Paulus Hermes, og Zevs' prest kom med okser og kranser for å ofre, til apostlene sønderrev klærne sine og stanset dem. Kort etter hisset jøder fra Antiokia og Ikonium opp mengden, Paulus ble stenet og forlatt for død, og neste dag dro han videre til Derbe."
    - "Navnet Lykaonia forekommer bare i disse to versene, men Paulus kom tilbake gjennom Lystra og Derbe, og i Lystra tok han Timoteus med som følgesvenn. I dag er regionen sletten ved Konya i Tyrkia; haugen Lystra ligger ved landsbyen Hatunsaray sør for byen, der en latinsk innskrift som nevner kolonien ble funnet i 1885."
scripture:
  - Acts.14.6-Acts.14.7
  - Acts.14.8-Acts.14.18
