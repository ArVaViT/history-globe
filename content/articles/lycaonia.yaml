# Overview article (ADR 0007). Mainstream facts only; the place names of Paul's journey follow Acts and the usual identifications.
id: lycaonia
place: a3668b6
title:
  en: "Lycaonia"
  ru: "Ликаония"
body:
  en:
    - "Lycaonia was a high, dry plateau in south-central Anatolia, north of the Taurus. Strabo describes it as cold, bare of trees and short of water, but good for sheep and wild asses. Its people kept their own language long after Greek spread through the region, and from 25 BC most of the country belonged to the Roman province of Galatia. Its towns included Lystra, which Augustus made a Roman colony, and Derbe further east; Iconium on its western edge was often counted as Phrygian."
    - "On their first journey Paul and Barnabas were driven out of Iconium and “fled unto Lystra and Derbe, cities of Lycaonia, and unto the region that lieth round about”. At Lystra Paul healed a man lame from birth, “and when the people saw what Paul had done, they lifted up their voices, saying in the speech of Lycaonia, The gods are come down to us in the likeness of men”; they called Barnabas Zeus and Paul Hermes, and the priest of Zeus brought oxen and garlands to sacrifice, until the apostles tore their clothes and stopped them. Soon after, Jews from Antioch and Iconium stirred up the crowd, Paul was stoned and left for dead, and the next day he went on to Derbe."
    - "The name Lycaonia appears only in these two verses, but Paul came back through Lystra and Derbe, and at Lystra he took Timothy as a companion. Today the region is the plain of Konya in Turkey; the mound of Lystra lies by the village of Hatunsaray south of the city, where a Latin inscription naming the colony was found in 1885."
  ru:
    - "Ликаония — высокое сухое плато на юге Центральной Анатолии, к северу от Тавра. Страбон описывает её как холодную, безлесную и бедную водой, но пригодную для овец и диких ослов. Её жители долго сохраняли свой язык, когда греческий уже распространился по всей округе, и с 25 г. до н. э. большая часть страны входила в римскую провинцию Галатия. Среди её городов — Листра, которую Август сделал римской колонией, и Дервия восточнее; Иконию на её западном краю часто причисляли к Фригии."
    - "В первом путешествии Павла и Варнаву изгнали из Иконии, и они «удалились в Ликаонские города Листру и Дервию и в окрестности их». В Листре Павел исцелил хромого от рождения, и «народ же, увидев, что сделал Павел, возвысил свой голос, говоря по-ликаонски: боги в образе человеческом сошли к нам»; Варнаву назвали Зевсом, а Павла Ермием, и жрец Зевса привёл волов и принёс венки, чтобы совершить жертву, пока апостолы, разодрав одежды, не остановили их. Вскоре Иудеи из Антиохии и Иконии возбудили народ, Павла побили камнями и вытащили за город, почитая умершим, а на другой день он ушёл в Дервию."
    - "Имя Ликаонии встречается только в этих двух стихах, но Павел ещё возвращался через Листру и Дервию, и в Листре взял себе в спутники Тимофея. Сегодня этот край — Конийская равнина в Турции; холм Листры лежит у селения Хатунсарай к югу от города, где в 1885 году нашли латинскую надпись с именем колонии."
