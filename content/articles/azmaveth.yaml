body:
  en:
    - "Azmaveth, also called Beth-azmaveth, was a small village of Benjamin a few kilometres north-east of Jerusalem, in the hills between Anathoth and Geba. It is generally identified with Hizma, a village about 7 km from the Old City on the road from Anathoth (Anata) to Geba (Jaba), whose name keeps the first part of the old one; the second candidate on the map, Ras Zukeir, is a ruin just beside it. The site has never been excavated; surface surveys have found pottery of the late Iron Age, but nothing is told of the village before the exile."
    - "The town appears only in the lists of the return from Babylon. Among those who came back with Zerubbabel were “The children of Azmaveth, forty and two”, or, in Nehemiah's copy of the register, “The men of Beth-azmaveth, forty and two”. When Nehemiah dedicated the wall of Jerusalem, the Levite singers were gathered “from the house of Gilgal, and out of the fields of Geba and Azmaveth: for the singers had builded them villages round about Jerusalem”. As a personal name Azmaveth is older: Azmaveth the Barhumite was one of David's mighty men, and “the sons of Azmaveth”, Jeziel and Pelet, were among the Benjamite archers who joined David at Ziklag. Whether any of these men came from the village cannot be said."
    - "Today Hizma is a Palestinian village of the Jerusalem governorate, east of the Jerusalem neighbourhood of Pisgat Ze'ev, beside the checkpoint on the road into the city."
  ru:
    - "Азмавеф, он же Беф-Азмавеф, — небольшое селение Вениамина в нескольких километрах к северо-востоку от Иерусалима, в холмах между Анафофом и Гевой. Его обычно отождествляют с Хизмой, деревней примерно в 7 км от Старого города на дороге из Анафофа (Аната) в Геву (Джаба), чьё имя хранит первую часть древнего; второй кандидат на карте, Рас-Зукейр, — развалины тут же рядом. Раскопок на месте никогда не было; при обследованиях поверхности найдена керамика позднего железного века, но о селении до плена ничего не сообщается."
    - "Город встречается только в списках вернувшихся из Вавилона. Среди пришедших с Зоровавелем названы «уроженцев Азмавефа сорок два», а в списке Неемии — «Жителей Беф-Азмавефа сорок два». Когда Неемия освящал стену Иерусалима, певцов-левитов собрали «из Беф-Гаггилгала, и с полей Гевы и Азмавета, потому что певцы выстроили себе села в окрестностях Иерусалима». Как личное имя Азмавеф старше: Азмавет Бархюмитянин был одним из храбрых Давида, а «сыновья Азмавефа» Иезиел и Фелет — среди стрелков Вениамина, пришедших к Давиду в Секелаг. Был ли кто-то из этих людей родом из селения, сказать нельзя."
    - "Сегодня Хизма — палестинская деревня Иерусалимской провинции к востоку от иерусалимского района Писгат-Зеэв, у контрольно-пропускного пункта на дороге в город."
  uk:
    - "Азмавет, званий також Бет-Азмавет, був невеликим селом Веніяміна за кілька кілометрів на північний схід від Єрусалима, в пагорбах між Анатотом і Гебою. Його загалом ототожнюють із Хізмою, селом приблизно за 7 км від Старого міста на дорозі від Анатоту (Анати) до Геби (Джаби), чия назва зберігає першу частину давньої; другий кандидат на мапі, Рас-Зукейр, — руїна поряд із нею. Місце ніколи не розкопувалося; поверхневі обстеження виявили кераміку пізньої залізної доби, але про село до вигнання нічого не розповідається."
    - "Місто з'являється лише в переліках повернення з Вавилона. Серед тих, хто повернувся із Зоровавелем, були «що родом з Азмавета, сорок два», або, у Неемієвій копії реєстру, «осадників Бет-Азмавета сорок два». Коли Неемія освячував мур Єрусалима, співаків-левітів зібрали «з Бет-Гаггилгала, і з сіл Геви та Азмавету, бо сьпівцї подубували собі села в околицях Ерусалиму». Як особисте ім'я Азмавет давніший: Азмавет Бархумянин був одним з могутніх Давида, а «Азмаветові сини», Єзіел і Фелет, були серед веніяминських лучників, що приєдналися до Давида в Ціклагу. Чи походив хтось із цих людей із села, сказати не можна."
    - "Нині Хізма — палестинське село мухафази Єрусалим, на схід від єрусалимського району Пісгат-Зеєв, біля блокпосту на дорозі до міста."
  es:
    - "Azmavet, llamada también Bet-azmavet, era una pequeña aldea de Benjamín a pocos kilómetros al nordeste de Jerusalén, en las colinas entre Anatot y Geba. Se identifica por lo común con Hizma, una aldea a unos 7 km de la Ciudad Vieja en el camino de Anatot (Anata) a Geba (Jaba), cuyo nombre conserva la primera parte del antiguo; el segundo candidato del mapa, Ras Zukeir, es una ruina justo a su lado. El sitio nunca ha sido excavado; las prospecciones de superficie han hallado cerámica de la Edad del Hierro tardía, pero nada se cuenta de la aldea antes del exilio."
    - "La ciudad aparece solo en las listas del regreso de Babilonia. Entre los que volvieron con Zorobabel estaban «Los hijos de Asmaveth, cuarenta y dos», o, en la copia de Nehemías del registro, «Los varones de Beth-azmaveth, cuarenta y dos». Cuando Nehemías dedicó la muralla de Jerusalén, los cantores levitas fueron reunidos «de la casa de Gilgal, y de los campos de Geba, y de Azmaveth; porque los cantores se habían edificado aldeas alrededor de Jerusalem». Como nombre personal, Azmavet es más antiguo: Azmavet el barhumita fue uno de los valientes de David, y «hijos de Azmaveth», Jeziel y Pelet, estuvieron entre los arqueros benjaminitas que se unieron a David en Siclag. No puede decirse si alguno de estos hombres procedía de la aldea."
    - "Hoy Hizma es una aldea palestina de la gobernación de Jerusalén, al este del barrio jerosolimitano de Pisgat Ze'ev, junto al puesto de control en el camino hacia la ciudad."
  pt:
    - "Azmavete, também chamada Bete-Azmavete, era uma pequena aldeia de Benjamim a alguns quilômetros a nordeste de Jerusalém, nas colinas entre Anatote e Geba. É geralmente identificada com Hizma, uma aldeia a cerca de 7 km da Cidade Velha, na estrada de Anatote (Anata) a Geba (Jaba), cujo nome conserva a primeira parte do antigo; o segundo candidato do mapa, Ras Zukeir, é uma ruína logo ao lado. O sítio nunca foi escavado; prospecções de superfície acharam cerâmica do fim da Idade do Ferro, mas nada se conta da aldeia antes do exílio."
    - "A cidade aparece apenas nas listas do retorno da Babilônia. Entre os que voltaram com Zorobabel estavam “Os filhos de Azmavete, quarenta e dois” ou, na cópia do registro em Neemias, “Os homens de Bete-Azmavete: quarenta e dois”. Quando Neemias dedicou a muralha de Jerusalém, os cantores levitas foram reunidos “de Bete-Gilgal e dos campos de Geba e de Azmavete, pois os cantores haviam construído aldeias para si ao redor de Jerusalém”. Como nome pessoal, Azmavete é mais antigo: “Azmavete, o barumita” foi um dos valentes de Davi, e “filhos de Azmavete”, Jeziel e Pelete, estavam entre os arqueiros benjamitas que se juntaram a Davi em Ziclague. Se algum desses homens era da aldeia não se pode dizer."
    - "Hoje Hizma é uma aldeia palestina da província de Jerusalém, a leste do bairro jerosolimitano de Pisgat Ze'ev, junto ao posto de controle na estrada para a cidade."
  de:
    - "Asmawet, auch Bet-Asmawet genannt, war ein kleines Dorf Benjamins einige Kilometer nordöstlich von Jerusalem, in den Bergen zwischen Anatot und Geba. Man setzt es gewöhnlich mit Hizma gleich, einem Dorf etwa 7 km von der Altstadt an der Straße von Anatot (Anata) nach Geba (Jaba), dessen Name den ersten Teil des alten bewahrt; der zweite Kandidat auf der Karte, Ras Zuqeir, ist eine Ruine unmittelbar daneben. Die Stätte wurde nie ausgegraben; Oberflächenbegehungen haben Keramik der späten Eisenzeit erbracht, doch vom Dorf vor dem Exil wird nichts erzählt."
    - "Die Stadt erscheint nur in den Listen der Rückkehr aus Babylon. Unter denen, die mit Serubbabel zurückkamen, waren die Kinder Asmawets, zweiundvierzig, und in Nehemias Abschrift des Verzeichnisses „der Männer von Beth-Asmaveth zweiundvierzig“. Als Nehemia die Mauer Jerusalems weihte, wurden die levitischen Sänger gesammelt „von Beth-Gilgal und von den Äckern zu Geba und Asmaveth; denn die Sänger hatten sich Höfe gebaut um Jerusalem her“. Als Personenname ist Asmawet älter: Asmawet der Barhumiter war einer von Davids Helden, und „die Kinder Asmaveths“, Jeziël und Pelet, gehörten zu den benjaminitischen Bogenschützen, die in Ziklag zu David stießen. Ob einer dieser Männer aus dem Dorf stammte, lässt sich nicht sagen."
    - "Heute ist Hizma ein palästinensisches Dorf im Gouvernement Jerusalem, östlich des Jerusalemer Viertels Pisgat Ze'ev, neben dem Kontrollpunkt an der Straße in die Stadt."
  fr:
    - "Azmaveth, aussi appelée Beth-Azmaveth, était un petit village de Benjamin à quelques kilomètres au nord-est de Jérusalem, dans les collines entre Anathoth et Guéba. Elle est généralement identifiée à Hizma, village à environ 7 km de la Vieille Ville sur la route d’Anathoth (Anata) à Guéba (Jaba), dont le nom garde la première partie de l’ancien ; le deuxième candidat de la carte, Ras Zukeir, est une ruine juste à côté. Le site n’a jamais été fouillé ; des prospections de surface y ont trouvé de la poterie de la fin de l’âge du Fer, mais rien n’est raconté du village avant l’exil."
    - "La ville n’apparaît que dans les listes du retour de Babylone. Parmi ceux qui revinrent avec Zorobabel étaient « les fils d’Azmaveth, quarante-deux » ou, dans la copie du registre de Néhémie, « les gens de Beth-Azmaveth, quarante-deux ». Quand Néhémie dédia le mur de Jérusalem, les chantres lévites furent rassemblés « de Beth-Guilgal, et du territoire de Guéba et d’Azmaveth ; car les chantres s’étaient bâti des villages aux alentours de Jérusalem ». Comme nom de personne, Azmaveth est plus ancien : Azmaveth le Barhumite fut l’un des vaillants hommes de David, et Jeziel et Pélet, fils d’Azmaveth, furent parmi les archers benjaminites qui rejoignirent David à Tsiklag. Si l’un de ces hommes venait du village, on ne peut le dire."
    - "Aujourd’hui Hizma est un village palestinien du gouvernorat de Jérusalem, à l’est du quartier jérusalémite de Pisgat Ze’ev, à côté du poste de contrôle sur la route de la ville."
  it:
    - "Azmàvet, detta anche Bet-Azmàvet, era un piccolo villaggio di Beniamino a pochi chilometri a nord-est di Gerusalemme, sulle colline tra Anatòt e Gheba. È generalmente identificata con Hizma, un villaggio a circa 7 km dalla Città Vecchia sulla strada da Anatòt (Anata) a Gheba (Jaba), il cui nome conserva la prima parte dell’antico; il secondo candidato sulla carta, Ras Zukeir, è una rovina subito accanto. Il sito non è mai stato scavato; le ricognizioni di superficie hanno trovato ceramica della tarda età del Ferro, ma nulla si narra del villaggio prima dell’esilio."
    - "La città compare soltanto negli elenchi del ritorno da Babilonia. Fra quanti tornarono con Zorobabele vi erano «Gli uomini di Azmaveth, quarantadue», o, nella copia del registro di Neemia, «Uomini di Beth-Azmaveth, quarantadue». Quando Neemia dedicò le mura di Gerusalemme, i cantori leviti furono radunati «da Beth-Ghilgal e dal territorio di Gheba e d’Azmaveth; poiché i cantori s’erano edificati de’ villaggi ne’ dintorni di Gerusalemme». Come nome di persona Azmàvet è più antico: Azmàvet il Barhumita fu uno dei prodi di Davide, e i «figliuoli di Azmaveth», Ieziel e Pelet, erano fra gli arcieri beniaminiti che si unirono a Davide a Siclag. Se qualcuno di questi uomini venisse dal villaggio non si può dire."
    - "Oggi Hizma è un villaggio palestinese del governatorato di Gerusalemme, a est del quartiere gerosolimitano di Pisgat Ze’ev, accanto al posto di controllo sulla strada verso la città."
  pl:
    - "Azmawet, zwane też Bet-Azmawet, było małą wsią Beniamina kilka kilometrów na północny wschód od Jerozolimy, we wzgórzach między Anatot a Geba. Utożsamia się je zwykle z Hizma, wsią około 7 km od Starego Miasta na drodze z Anatot ('Anata) do Geba (Jaba), której nazwa zachowuje pierwszą część dawnej; drugi kandydat na mapie, Ras Zukeir, to ruina tuż obok niej. Miejsce nigdy nie było wykopywane; badania powierzchniowe wykazały ceramikę z późnej epoki żelaza, ale nic się nie mówi o wsi sprzed wygnania."
    - "Miasto pojawia się tylko w wykazach powrotu z Babilonu. Wśród tych, którzy wrócili z Zorobabelem, było „Synów z Azmawetu czterdzieści i dwa”, a w kopii rejestru u Nehemiasza „Mężów z Bet Azmawetu czterdzieści i dwa”. Gdy Nehemiasz poświęcał mur Jerozolimy, lewiccy śpiewacy zebrali się „z domu Gilgal, i z pól Gieba, i z Azmawet; bo sobie śpiewacy budowali wsi około Jeruzalemu”. Jako imię osobowe Azmawet jest starsze: Azmawet Barhumita był jednym z bohaterów Dawida, a „synowie Azmawetowi”, Jeziel i Pelet, byli wśród beniaminickich łuczników, którzy dołączyli do Dawida w Siklag. Czy któryś z tych mężów pochodził z tej wsi, nie można powiedzieć."
    - "Dziś Hizma jest palestyńską wsią w muhafazie Jerozolima, na wschód od jerozolimskiej dzielnicy Pisgat Ze'ev, obok punktu kontrolnego na drodze do miasta."
  nl:
    - "Azmaveth, ook Beth-Azmaveth genoemd, was een klein dorp van Benjamin enkele kilometers ten noordoosten van Jeruzalem, in de heuvels tussen Anatot en Geba. Het wordt algemeen geïdentificeerd met Hizma, een dorp zo’n 7 km van de Oude Stad aan de weg van Anatot (Anata) naar Geba (Jaba), wiens naam het eerste deel van de oude bewaart; de tweede kandidaat op de kaart, Ras Zukeir, is een ruïne er vlak naast. De plaats is nooit opgegraven; oppervlakteonderzoek heeft aardewerk uit de late IJzertijd opgeleverd, maar van het dorp vóór de ballingschap wordt niets verteld."
    - "De plaats verschijnt alleen in de lijsten van de terugkeer uit Babylon. Onder hen die met Zerubbabel terugkwamen waren “De kinderen van Azmaveth, twee en veertig”, of, in Nehemia’s exemplaar van het register, “De mannen van Beth-Azmaveth, twee en veertig”. Toen Nehemia de muur van Jeruzalem inwijdde, werden de levietische zangers bijeengebracht “uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem”. Als persoonsnaam is Azmaveth ouder: Azmaveth de Barchumiet was een van Davids helden, en “zonen van Azmaveth”, Jeziël en Pelet, behoorden tot de Benjaminitische boogschutters die zich bij David te Siklag voegden. Of een van deze mannen uit het dorp kwam, valt niet te zeggen."
    - "Tegenwoordig is Hizma een Palestijns dorp in het gouvernement Jeruzalem, ten oosten van de Jeruzalemse wijk Pisgat Ze’ev, naast de controlepost aan de weg de stad in."
  cs:
    - "Azmavet, nazývaný též Bét-azmavet, byla malá vesnice Benjamínova několik kilometrů severovýchodně od Jeruzaléma, v pahorcích mezi Anatótem a Gebou. Obecně se ztotožňuje s Hizmou, vesnicí asi 7 km od Starého Města na cestě z Anatótu ('Anata) do Geby (Jaba), jejíž jméno uchovává první část starého; druhý kandidát na mapě, Ras Zukeir, je zřícenina hned vedle ní. Místo nebylo nikdy vykopáno; povrchové průzkumy zde našly keramiku z pozdní doby železné, o vesnici před vyhnanstvím se však nic nevypráví."
    - "Město se objevuje jen v seznamech návratu z Babylóna. Mezi těmi, kdo se vrátili se Zerubábelem, bylo „Synů Azmavetských čtyřidceti dva“, nebo v Nehemjášově opisu soupisu „Mužů Betazmavetských čtyřidceti dva“. Když Nehemjáš vysvětil hradbu Jeruzaléma, byli levitští zpěváci shromážděni „z domu Galgal, a z polí Gaba i Azmavet; nebo vsi stavěli sobě zpěváci okolo Jeruzaléma“. Jako osobní jméno je Azmavet starší: Azmavet Barchumský byl jedním z Davidových udatných a „synové Azmavetovi“, Jeziel a Pelet, byli mezi benjamínskými lučištníky, kteří se připojili k Davidovi v Siklagu. Zda někdo z těchto mužů pocházel z vesnice, nelze říci."
    - "Dnes je Hizma palestinskou vesnicí v jeruzalémském guvernorátu, východně od jeruzalémské čtvrti Pisgat Ze'ev, u kontrolního stanoviště na silnici do města."
  sv:
    - "Asmavet, även kallat Bet-Asmavet, var en liten by i Benjamin några kilometer nordost om Jerusalem, i bergen mellan Anatot och Geba. Den identifieras i allmänhet med Hizma, en by omkring 7 km från Gamla stan på vägen från Anatot (Anata) till Geba (Jaba), vars namn bevarar den första delen av det gamla; den andra kandidaten på kartan, Ras Zukeir, är en ruin alldeles intill. Platsen har aldrig grävts ut; ytundersökningar har funnit keramik från sena järnåldern, men ingenting berättas om byn före exilen."
    - "Byn förekommer bara i förteckningarna över återkomsten från Babylon. Bland dem som kom tillbaka med Serubbabel var ”Asmavets barn: fyrtiotvå”, eller, i Nehemjas avskrift av registret, ”männen från Bet-Asmavet: fyrtiotvå”. När Nehemja invigde Jerusalems mur samlades de levitiska sångarna ”från Bet-Haggilgal och från Gebas och Asmavets utmarker; ty sångarna hade byggt sig byar runt omkring Jerusalem”. Som personnamn är Asmavet äldre: barhumiten Asmavet var en av Davids hjältar, och ”Asmavets söner”, Jesiel och Pelet, hörde till de benjaminitiska bågskyttar som slöt sig till David i Siklag. Om någon av dessa män kom från byn kan inte sägas."
    - "I dag är Hizma en palestinsk by i guvernementet Jerusalem, öster om den jerusalemitiska stadsdelen Pisgat Ze'ev, intill kontrollposten på vägen in i staden."
  nb:
    - "Asmavet, også kalt Bet-Asmavet, var en liten landsby i Benjamin noen få kilometer nordøst for Jerusalem, i åsene mellom Anatot og Geba. Den identifiseres vanligvis med Hizma, en landsby omtrent 7 km fra gamlebyen på veien fra Anatot (Anata) til Geba (Jaba), hvis navn bevarer første del av det gamle; den andre kandidaten på kartet, Ras Zukeir, er en ruin like ved siden av. Stedet er aldri gravd ut; overflateundersøkelser har funnet keramikk fra sen jernalder, men ingenting fortelles om landsbyen før eksilet."
    - "Byen forekommer bare i listene over hjemkomsten fra Babylon. Blant dem som kom tilbake med Serubabel var «Asmavets barn, to og firti», eller, i Nehemjas kopi av registeret, «mennene fra Bet-Asmavet, to og firti». Da Nehemja innviet Jerusalems mur, ble de levittiske sangerne samlet «fra Bet-Haggilgal og fra Gebas og Asmavets jorder; for sangerne hadde bygget sig landsbyer rundt omkring Jerusalem». Som personnavn er Asmavet eldre: «barhumitten Asmavet» var en av Davids helter, og «Jesuel og Pelet, sønner av Asmavet» var blant de benjaminittiske bueskytterne som sluttet seg til David i Siklag. Om noen av disse mennene kom fra landsbyen, kan ikke sies."
    - "I dag er Hizma en palestinsk landsby i Jerusalem-guvernementet, øst for Jerusalem-bydelen Pisgat Ze'ev, ved kontrollposten på veien inn til byen."
  tl:
    - "Ang Azmaveth, tinatawag ding Beth-azmaveth, ay maliit na nayon ng Benjamin ilang kilometro sa hilagang-silangan ng Jerusalem, sa mga burol sa pagitan ng Anathoth at Geba. Karaniwang itinutumbas ito sa Hizma, nayong mga 7 km mula sa Lumang Lungsod sa daan mula Anathoth (Anata) patungong Geba (Jaba), na ang pangalan ay nagpapanatili sa unang bahagi ng luma; ang ikalawang kandidato sa mapa, ang Ras Zukeir, ay guho sa tabi nito. Hindi pa nahuhukay ang lugar; nakatuklas ang mga sarbey sa ibabaw ng palayok ng huling Panahon ng Bakal, ngunit walang isinasalaysay tungkol sa nayon bago ang pagkabihag."
    - "Lumilitaw lamang ang bayan sa mga talaan ng pagbabalik mula sa Babilonia. Kabilang sa mga bumalik kasama ni Zorobabel ang “mga anak ni Azmaveth, apat na pu't dalawa”, o, sa kopya ni Nehemias ng talaan, “Ang mga lalake ng Beth-azmaveth, apat na pu't dalawa”. Nang italaga ni Nehemias ang pader ng Jerusalem, tinipon ang mga mang-aawit na Levita “Mula rin naman sa Beth-gilgal, at mula sa mga parang ng Geba at ng Azmaveth: sapagka't nangagtayo sa ganang kanila ang mga mangaawit ng mga nayon sa palibot ng Jerusalem”. Bilang pangalan ng tao, mas matanda ang Azmaveth: si Azmaveth na Barhumita ay isa sa mga makapangyarihang lalaki ni David, at ang “mga anak ni Azmaveth”, sina Jeziel at Pelet, ay kabilang sa mga mamamanang Benjamita na sumama kay David sa Siclag. Hindi masasabi kung alinman sa kanila ay taga-nayon."
    - "Ang Hizma ay nayong Palestino ng Gobernorado ng Jerusalem ngayon, sa silangan ng kapitbahayang Pisgat Ze'ev ng Jerusalem, sa tabi ng himpilan ng inspeksiyon sa daan papasok sa lungsod."
  da:
    - "Azmavet, også kaldet Bet-Azmavet, var en lille landsby i Benjamin få kilometer nordøst for Jerusalem, i bjergene mellem Anatot og Geba. Den identificeres almindeligvis med Hizma, en landsby omkring 7 km fra den gamle by ved vejen fra Anatot (Anata) til Geba (Jaba), hvis navn bevarer første del af det gamle; den anden kandidat på kortet, Ras Zukeir, er en ruin lige ved siden af. Stedet er aldrig udgravet; overfladeundersøgelser har fundet keramik fra sen jernalder, men intet fortælles om landsbyen før eksilet."
    - "Byen optræder kun i listerne over tilbagevendelsen fra Babylon. Blandt dem, der kom tilbage med Zerubbabel, var »Asmaveths Børn, to og fyrretyve«, eller, i Nehemias' kopi af registeret, »Mændene af Beth-Asmaveth, to og fyrretyve«. Da Nehemias indviede Jerusalems mur, blev de levitiske sangere samlet »fra Gilgals Hus og fra Markerne ved Geba og Asmaveth; thi Sangerne havde bygget sig Landsbyer trindt omkring Jerusalem«. Som personnavn er Azmavet ældre: Azmavet barhumiten var en af Davids helte, og »Asmaveths Sønner«, Jeziel og Pelet, var blandt de benjaminitiske bueskytter, der sluttede sig til David i Siklag. Om nogen af disse mænd kom fra landsbyen, kan ikke siges."
    - "I dag er Hizma en palæstinensisk landsby i Jerusalem-guvernementet, øst for Jerusalems kvarter Pisgat Ze'ev, ved checkpointet på vejen ind til byen."
  sr:
    - "Азмавет, назван и Вет-Азмавет, било је мало село Венијаминово неколико километара североисточно од Јерусалима, у брдима између Анатота и Гаве. Обично се поистовећује са Хизмом, селом око 7 км од Старог града на путу од Анатота (Аната) до Гаве (Џаба), чије име чува први део старог; други кандидат на карти, Рас Зукејр, рушевина је одмах поред њега. Налазиште никада није ископавано; површинска истраживања нашла су керамику касног гвозденог доба, али се ништа не прича о селу пре изгнанства."
    - "Град се јавља само у списковима повратка из Вавилона. Међу онима који су се вратили са Зоровавељем били су „синова азмаветских четрдесет и два“, или, у Немијином препису списка, „људи из Вет-Асмавета четрдесет и два“. Када је Немија посветио зид Јерусалима, певачи левити су окупљени „из Вет-Гилала и из поља гевских и азмаветских, јер певачи беху населили села око Јерусалима“. Као лично име Азмавет је старији: Азмавет Варумљанин био је један од Давидових јунака, а „синови Азмаветови“, Језило и Фелет, били су међу венијаминовским стрелцима који су дошли Давиду у Сиклаг. Да ли је неко од тих људи био из села, не може се рећи."
    - "Данас је Хизма палестинско село јерусалимског гувернората, источно од јерусалимског насеља Писгат Зеев, поред контролног пункта на путу у град."
  hu:
    - "Azmávet, másik nevén Bét-Azmávet, Benjámin kis faluja volt Jeruzsálemtől néhány kilométerre északkeletre, Anatót és Géba közötti dombvidéken. Általában a Hizmával azonosítják, az Óvárostól mintegy 7 km-re fekvő faluval az Anatótból (Anata) Gébába (Jaba) vezető úton, amelynek neve megőrzi a régi név első részét; a térkép második jelöltje, a Ras Zukeir egy közvetlenül mellette lévő rom. A helyet soha nem ásták ki; a felszíni felmérések késő vaskori kerámiát találtak, de a száműzetés előtt a faluról semmit sem tudunk."
    - "A város csak a babiloni hazatérés jegyzékeiben szerepel. A Zerubbábellel visszatérők között: „Azmáveth fiai negyvenkettő”, vagy Nehémiás jegyzékmásolatában: „Beth-Azmáveth férfiai: negyvenkettő”. Amikor Nehémiás felavatta Jeruzsálem falát, a lévita énekeseket összegyűjtötték „mind Beth-Gilgálból, mind Geba és Azmáveth határaiból, mert falukat építének magoknak az énekesek Jeruzsálem körül”. Személynévként Azmávet régebbi: a bárhumi Azmávet Dávid egyik vitéze volt, „Azmávet fiai”, Jeziel és Pelet pedig a benjáminita íjászok között voltak, akik Ciklagban csatlakoztak Dávidhoz. Hogy e férfiak közül bárki a faluból származott-e, nem mondható meg."
    - "Ma Hizma palesztin falu a jeruzsálemi kormányzóságban, Jeruzsálem Pisgat Ze'ev negyedétől keletre, a városba vezető út ellenőrzőpontja mellett."
  fi:
    - "Asmavet, jota kutsutaan myös Bet-Asmavetiksi, oli Benjaminin pieni kylä muutaman kilometrin Jerusalemista koilliseen, kukkuloilla Anatotin ja Geban välillä. Se samaistetaan yleensä Hizmaan, kylään noin 7 km:n päässä vanhasta kaupungista Anatotista (Anata) Gebaan (Jaba) johtavan tien varrella, jonka nimi säilyttää vanhan nimen ensimmäisen osan; kartan toinen ehdokas, Ras Zukeir, on rauniokohde heti sen vieressä. Paikkaa ei ole koskaan kaivettu; maastokartoitukset ovat löytäneet myöhäisrautakauden keramiikkaa, mutta kylästä ei kerrota mitään ennen pakkosiirtolaisuutta."
    - "Kylä esiintyy vain Babylonista paluun luetteloissa. Serubbabelin mukana palanneiden joukossa oli ”asmavetilaisia neljäkymmentä kaksi” tai Nehemian rekisterin jäljennöksessä ”Beet-Asmavetin miehiä neljäkymmentä kaksi”. Kun Nehemia vihki Jerusalemin muurin, leeviläiset veisaajat koottiin ”Beet-Gilgalista ja Geban ja Asmavetin peltomailta, sillä veisaajat olivat rakentaneet itselleen kyliä Jerusalemin ympäristöön”. Henkilönnimenä Asmavet on vanhempi: Asmavet baharumilainen oli yksi Daavidin sankareista, ja ”Asmavetin pojat”, Jesiel ja Pelet, kuuluivat benjaminilaisiin jousimiehiin, jotka liittyivät Daavidiin Siklagissa. Tuliko kukaan näistä miehistä kylästä, ei voida sanoa."
    - "Hizma on nykyisin palestiinalaiskylä Jerusalemin kuvernementissa, Jerusalemin Pisgat Ze'evin kaupunginosan itäpuolella, kaupunkiin johtavan tien tarkastuspisteen vieressä."
  vi:
    - "Ách-ma-vết, còn gọi là Bết-Ách-ma-vết, là một làng nhỏ của Bên-gia-min cách Giê-ru-sa-lem vài km về phía đông bắc, trong vùng đồi giữa A-na-tốt và Ghê-ba. Nó thường được đồng nhất với Hizma, một làng cách Thành Cổ khoảng 7 km trên đường từ A-na-tốt (Anata) đến Ghê-ba (Jaba), tên giữ phần đầu của tên cũ; ứng viên thứ hai trên bản đồ, Ras Zukeir, là một tàn tích ngay bên cạnh. Địa điểm chưa bao giờ được khai quật; các cuộc khảo sát bề mặt tìm thấy đồ gốm cuối thời Đồ Sắt, nhưng không có gì được kể về làng trước cuộc lưu đày."
    - "Thành chỉ xuất hiện trong các danh sách người trở về từ Ba-by-lôn. Trong số những người trở về cùng Xô-rô-ba-bên có “người Ách-ma-vết, bốn mươi hai”, hay, trong bản sao của Nê-hê-mi, “Về những người Bết-A-ma-vết, bốn mươi hai người”. Khi Nê-hê-mi cung hiến tường Giê-ru-sa-lem, những người Lê-vi ca hát được nhóm lại “từ Bết-ghinh-ganh, từ đồng bằng Ghê-ba và Ách-ma-vết; vì những người ca hát đã xây cho mình các làng ở chung quanh thành Giê-ru-sa-lem”. Như một tên người, Ách-ma-vết cổ hơn: Ách-ma-vết người Ba-rum là một trong các dõng sĩ của Đa-vít, và “Giê-xi-ên và Phê-lết, con trai của Ách-ma-vết” nằm trong số các cung thủ Bên-gia-min theo Đa-vít tại Xiếc-lác. Có người nào trong số họ đến từ làng hay không thì không thể nói."
    - "Ngày nay Hizma là một làng Palestine thuộc tỉnh Jerusalem, phía đông khu Pisgat Ze'ev của Giê-ru-sa-lem, bên trạm kiểm soát trên đường vào thành."
  ro:
    - "Azmavet, numit și Bet-Azmavet, era un mic sat al lui Beniamin, la câțiva kilometri nord-est de Ierusalim, în dealurile dintre Anatot și Gheba. Este identificat în general cu Hizma, un sat la aproximativ 7 km de Orașul Vechi, pe drumul de la Anatot (Anata) la Gheba (Jaba), al cărui nume păstrează prima parte a celui vechi; al doilea candidat de pe hartă, Ras Zukeir, este o ruină chiar alături. Locul nu a fost niciodată excavat; sondajele de suprafață au găsit ceramică din epoca fierului târziu, dar nu se știe nimic despre sat înainte de exil."
    - "Satul apare doar în listele întoarcerii din Babilon. Printre cei care s-au întors cu Zorobabel erau fiii lui Azmavet, patruzeci și doi, sau, în copia lui Neemia a registrului, oamenii din Bet-Azmavet, patruzeci și doi. Când Neemia a sfințit zidul Ierusalimului, cântăreții leviți au fost adunați „dela Vetgalgal și din țarinile lui Gava și Azmot, că sălașuri au fost zidit loruși cântăreții în Ierusalim”. Ca nume de persoană, Azmavet este mai vechi: Azmavet barhumitul era unul dintre vitejii lui David, iar fiii lui Azmavet, Ieziel și Pelet, se numărau printre arcașii beniamiți care s-au alăturat lui David la Țiclag. Dacă vreunul dintre acești oameni venea din sat, nu se poate spune."
    - "Astăzi Hizma este un sat palestinian din guvernoratul Ierusalim, la est de cartierul ierusalimitean Pisgat Ze'ev, lângă punctul de control de pe drumul spre oraș."
  bg:
    - "Азмавет, наричан още Бет-Азмавет, бил малко село на Вениамин на няколко километра североизточно от Йерусалим, в хълмовете между Анатот и Гева. Обикновено се отъждествява с Хизма, село на около 7 км от Стария град на пътя от Анатот (Аната) към Гева (Джаба), чието име пази първата част на старото; вторият кандидат на картата, Рас Зукейр, е развалина точно до него. Мястото никога не е разкопавано; повърхностни проучвания са намерили керамика от късната желязна епоха, но нищо не се разказва за селото преди изгнанието."
    - "Градът се появява само в списъците на завръщането от Вавилон. Сред върналите се със Зоровавел били „Азмаветови синове, четиридесет и два“, или, в преписа на списъка у Неемия, „Вет-асмаветови мъже, четиридесет и два“. Когато Неемия посветил стената на Йерусалим, левитските певци били събрани „и от Галгаловия дом, и от селата на Гава и на Азмавет; защото певците си съградиха села около Ерусалим“. Като лично име Азмавет е по-старо: Азмавет Варумецът бил един от силните мъже на Давид, а „синовете на Азмавет“, Йезиел и Фелет, били сред вениаминските стрелци, дошли при Давид в Циклаг. Дали някой от тези мъже е бил от селото, не може да се каже."
    - "Днес Хизма е палестинско село в йерусалимската мухафаза, на изток от йерусалимския квартал Писгат Зеев, до контролния пункт на пътя към града."
