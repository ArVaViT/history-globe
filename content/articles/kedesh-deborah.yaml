body:
  en:
    - "Kedesh, “holy place”, is the name of several towns, and this record holds the Kedesh of the story of Deborah and Barak. Deborah summoned Barak “out of Kedesh-naphtali” and went there with him: “And Barak called Zebulun and Naphtali to Kedesh; and he went up with ten thousand men at his feet: and Deborah went up with him.” Heber the Kenite, parted from his people, “pitched his tent unto the plain of Zaanaim, which is by Kedesh”, and there, after the battle at the Kishon, his wife Jael killed the fleeing Sisera. The sanctuary name, the muster of the tribes and the sacred tree of Zaanannim suggest an old holy place of Galilee."
    - "Where this Kedesh lay is disputed. The great Kedesh of Naphtali is Tel Kedesh in Upper Galilee north of Hazor, the Canaanite royal city of Joshua's list, a city of refuge and a Levitical town, which Tiglath-pileser III took from Pekah in 733 or 732 BC; many take Barak's Kedesh to be the same. But it lies some 50 km from Mount Tabor, where the army was to gather, across rough country, and Heber's tent and Jael's deed belong near the battlefield. Yohanan Aharoni therefore argued for Khirbet Qedish, a ruin that keeps the name on the heights above the south-western shore of the Sea of Galilee, a few hours' march from Tabor, with the oak of Zaanannim sought nearby; others hold to the northern site, and the map shows both."
    - "Tel Kedesh has been excavated: from 1997 teams from the universities of Michigan and Minnesota uncovered a Persian and Hellenistic administrative building with an archive of more than two thousand clay sealings, and a Roman temple of the second and third centuries AD still stands on the lower mound. Khirbet Qedish, above the modern village of Poriya south of Tiberias, is an unexcavated ruin with ancient tombs and pottery, so the question cannot yet be settled from the ground."
  ru:
    - "Кедес, «святое место», — имя нескольких городов, и эта запись относится к Кедесу из истории Деворы и Варака. Девора призвала Варака «из Кедеса Неффалимова» и пошла туда вместе с ним: «Варак созвал Завулонян и Неффалимлян в Кедес, и пошли вслед за ним десять тысяч человек, и Девора пошла с ним». Хевер Кенеянин, отделившийся от своего народа, «раскинул шатер свой у дубравы в Цаанниме близ Кедеса», и там после битвы при Киссоне его жена Иаиль убила бежавшего Сисару. Имя святилища, сбор колен и священное дерево в Цаанниме указывают на древнее святое место Галилеи."
    - "Где лежал этот Кедес, спорно. Великий Кедес Неффалимов — это Тель-Кедеш в Верхней Галилее к северу от Асора, ханаанский царский город из списка Иисуса Навина, город убежища и левитский город, который Феглаффелласар III отнял у Факея в 733 или 732 г. до н. э.; многие считают, что Кедес Варака — он и есть. Но он лежит примерно в 50 км от горы Фавор, где должно было собраться войско, через трудную местность, а шатёр Хевера и дело Иаили должны быть рядом с полем битвы. Поэтому Йоханан Ахарони указывал на Хирбет-Кедиш, развалины, сохранившие имя, на высотах над юго-западным берегом Галилейского моря, в нескольких часах пути от Фавора; дубраву Цаанним ищут поблизости. Другие держатся северного места, и на карте показаны оба."
    - "Тель-Кедеш раскопан: с 1997 года экспедиции Мичиганского и Миннесотского университетов открыли персидское и эллинистическое административное здание с архивом из более чем двух тысяч глиняных оттисков печатей, а на нижнем холме до сих пор стоит римский храм II–III веков н. э. Хирбет-Кедиш над нынешним посёлком Пория к югу от Тверии — нераскопанные развалины с древними гробницами и керамикой, так что решить вопрос по находкам пока нельзя."
  uk:
    - "Кедес, «святе місце», — назва кількох міст, і цей запис присвячений Кедесу з оповіді про Дебору та Варака. Дебора покликала Варака «з Кадеса Нефталимового» і пішла туди з ним: «Скликав тодї Барак Зебулонїїв і Нафталїїв у Кадес; десять тисяч чоловіка йшло за ним слїдом, і Дебора йшла за ним.» Хевер Кенеянин, відокремившись від свого народу, «напяв був свого намета у дуброві під Заанимом, що під Кадесом», і саме там, по битві при Кішоні, його дружина Яїль убила Сісару, що втікав. Назва святилища, збір племен і священне дерево Цананнім указують на давнє святе місце Галілеї."
    - "Де лежав цей Кедес, достеменно не відомо. Великий Кедес Нефталимів — це Тель-Кедес у Верхній Галілеї, на північ від Гацору, ханаанське царське місто з переліку Ісуса Навина, місто-сховище й левітське місто, яке Тіглатпаласар III відібрав у Факея в 733 або 732 р. до н. е.; багато хто вважає, що Кедес Варака — той самий. Але він лежить приблизно за 50 км від гори Фавор, де мало зібратися військо, через нерівну місцевість, а намет Хевера й учинок Яїлі належать до околиць поля битви. Тому Йоханан Агароні обстоював Хірбет-Кедіш — руїну, що зберігає назву, на висотах над південно-західним берегом Галілейського моря, за кілька годин переходу від Фавору, з дубом Цананнім десь поблизу; інші тримаються північного місця, і мапа показує обидва."
    - "Тель-Кедес розкопаний: з 1997 р. команди університетів Мічигану й Міннесоти виявили будівлю адміністративного призначення часів Персії та еллінізму з архівом із понад двох тисяч глиняних печаток, а римський храм II–III ст. н. е. досі стоїть на нижньому пагорбі. Хірбет-Кедіш, над сучасним селом Поря на південь від Тіверіади, — нерозкопана руїна зі стародавніми гробницями й керамікою, тож питання поки що не можна розв’язати на підставі даних із землі."
  es:
    - "Cedes, «lugar santo», es el nombre de varias ciudades, y este registro recoge la Cedes del relato de Débora y Barac. Débora llamó a Barac «de Cedes de Nephtalí» y fue allí con él: «Y juntó Barac á Zabulón y á Nephtalí en Cedes, y subió con diez mil hombres á su mando, y Débora subió con él». Heber el ceneo, apartado de su pueblo, había puesto «su tienda hasta el valle de Zaananim, que está junto á Cedes», y allí, después de la batalla junto al Cisón, su mujer Jael mató a Sísara cuando huía. El nombre de santuario, la reunión de las tribus y el árbol sagrado de Zaananim sugieren un antiguo lugar santo de Galilea."
    - "Se discute dónde estaba esta Cedes. La gran Cedes de Neftalí es Tel Cedes, en la Alta Galilea, al norte de Hazor; era la ciudad real cananea de la lista de Josué, una ciudad de refugio y una ciudad levítica, que Tiglat-pileser III arrebató a Peka en 733 o 732 a. C.; muchos suponen que la Cedes de Barac es la misma. Pero dista unos 50 km del monte Tabor, donde debía reunirse el ejército, a través de un terreno accidentado, y la tienda de Heber y el acto de Jael pertenecen a las cercanías del campo de batalla. Por ello Yohanan Aharoni defendió Khirbet Qedish, una ruina que conserva el nombre en las alturas sobre la orilla suroccidental del Mar de Galilea, a pocas horas de marcha del Tabor, y junto a la cual se busca la encina de Zaananim; otros se atienen al emplazamiento septentrional, y el mapa muestra ambos."
    - "Tel Cedes ha sido excavado: desde 1997 equipos de las universidades de Míchigan y Minnesota sacaron a la luz un edificio administrativo de época persa y helenística con un archivo de más de dos mil sellos de arcilla, y en el montículo bajo aún se alza un templo romano de los siglos II y III d. C. Khirbet Qedish, sobre la actual aldea de Poriya, al sur de Tiberias, es una ruina sin excavar con tumbas antiguas y cerámica, de modo que la cuestión todavía no puede resolverse sobre el terreno."
  pt:
    - "Quedes, “lugar santo”, é o nome de várias cidades, e este registro trata da Quedes da história de Débora e Baraque. Débora mandou chamar Baraque “de Quedes-Naftali” e foi para lá com ele: “Baraque convocou Zebulom e Naftali em Quedes. Dez mil homens o seguiram; e Débora subiu com ele.” Héber, o queneu, separado do seu povo, “havia armado a sua tenda até o carvalho de Zaananim, que fica junto a Quedes”, e ali, depois da batalha junto ao Quisom, sua mulher Jael matou Sísera, que fugia. O nome de santuário, a convocação das tribos e a árvore sagrada de Zaananim sugerem um antigo lugar santo da Galileia."
    - "Onde ficava esta Quedes é disputado. A grande Quedes de Naftali é Tel Quedes, na Alta Galileia, ao norte de Hazor, cidade real cananeia da lista de Josué, cidade de refúgio e cidade levítica, que Tiglate-Pileser III tomou de Peca em 733 ou 732 a.C.; muitos julgam que a Quedes de Baraque é a mesma. Mas ela fica a uns 50 km do monte Tabor, onde o exército devia se reunir, em terreno acidentado, e a tenda de Héber e o feito de Jael pertencem às proximidades do campo de batalha. Por isso Yohanan Aharoni defendeu Khirbet Qedish, ruína que conserva o nome nas alturas acima da margem sudoeste do Mar da Galileia, a poucas horas de marcha do Tabor, com o carvalho de Zaananim procurado nas redondezas; outros se atêm ao sítio do norte, e o mapa mostra ambos."
    - "Tel Quedes foi escavada: desde 1997, equipes das universidades de Michigan e Minnesota descobriram um edifício administrativo persa e helenístico com um arquivo de mais de duas mil selagens de argila, e um templo romano dos séculos II e III d.C. ainda se ergue no montículo inferior. Khirbet Qedish, acima da aldeia moderna de Poriya, ao sul de Tiberíades, é uma ruína não escavada, com túmulos e cerâmica antigos; assim, a questão ainda não pode ser resolvida a partir do terreno."
  de:
    - "Kedesch, „heiliger Ort“, ist der Name mehrerer Städte, und dieser Eintrag behandelt das Kedesch der Geschichte von Debora und Barak. Debora ließ Barak „von Kedes-Naphthali“ rufen und zog mit ihm dorthin: „Da rief Barak Sebulon und Naphthali gen Kedes, und es zogen hinauf ihm nach zehntausend Mann. Debora zog auch mit ihm.“ Heber, der Keniter, von seinem Volk getrennt, „hatte seine Hütte aufgeschlagen bei den Eichen zu Zaanannim neben Kedes“, und dort tötete nach der Schlacht am Kischon seine Frau Jael den fliehenden Sisera. Der Heiligtumsname, die Sammlung der Stämme und der heilige Baum von Zaanannim lassen einen alten heiligen Ort Galiläas vermuten."
    - "Wo dieses Kedesch lag, ist umstritten. Das große Kedesch Naftalis ist Tel Kedesch in Obergaliläa nördlich von Hazor, die kanaanäische Königsstadt der Liste Josuas, eine Freistadt und eine Levitenstadt, die Tiglat-Pileser III. 733 oder 732 v. Chr. Pekach abnahm; viele halten das Kedesch Baraks für dasselbe. Es liegt aber etwa 50 km vom Tabor entfernt, wo das Heer sich sammeln sollte, jenseits unwegsamen Geländes, und Hebers Zelt und Jaels Tat gehören in die Nähe des Schlachtfelds. Yohanan Aharoni trat deshalb für Khirbet Qedish ein, eine Ruine, die den Namen auf den Höhen über dem südwestlichen Ufer des Sees Genezareth bewahrt, einige Marschstunden vom Tabor entfernt, mit der Eiche von Zaanannim in der Nähe; andere halten am nördlichen Ort fest, und die Karte zeigt beide."
    - "Tel Kedesch wurde ausgegraben: Ab 1997 legten Teams der Universitäten Michigan und Minnesota ein persisches und hellenistisches Verwaltungsgebäude mit einem Archiv von mehr als zweitausend Tonsiegeln frei, und ein römischer Tempel des 2. und 3. Jahrhunderts n. Chr. steht noch auf dem Unterhügel. Khirbet Qedish oberhalb des heutigen Dorfes Poriya südlich von Tiberias ist eine nicht ausgegrabene Ruine mit antiken Gräbern und Keramik, sodass sich die Frage vom Boden her noch nicht entscheiden lässt."
  fr:
    - "Kédesch, « lieu saint », est le nom de plusieurs villes, et cette fiche concerne le Kédesch du récit de Débora et de Barak. Débora fit venir Barak « de Kédesch-Nephthali » et s’y rendit avec lui : « Barak convoqua Zabulon et Nephthali à Kédesch ; dix mille hommes marchèrent à sa suite, et Débora partit avec lui. » Héber, le Kénien, séparé des siens, « avait dressé sa tente jusqu’au chêne de Tsaannaïm, près de Kédesch », et c’est là que, après la bataille du Kison, sa femme Jaël tua Sisera en fuite. Le nom de sanctuaire, le rassemblement des tribus et l’arbre sacré de Tsaanannim évoquent un ancien lieu saint de Galilée."
    - "L’emplacement de ce Kédesch est discuté. Le grand Kédesch de Nephthali est Tel Kedesh, en Haute Galilée, au nord de Hatsor, ville royale cananéenne de la liste de Josué, ville de refuge et ville lévitique, que Tiglath-Piléser III prit à Péka en 733 ou 732 av. J.-C. ; beaucoup y voient le Kédesch de Barak. Mais il se trouve à quelque 50 km du mont Thabor, où l’armée devait se rassembler, à travers un pays rude, et la tente d’Héber et l’acte de Jaël appartiennent aux abords du champ de bataille. Yohanan Aharoni a donc plaidé pour Khirbet Qedish, ruine qui garde le nom sur les hauteurs au-dessus de la rive sud-ouest de la mer de Galilée, à quelques heures de marche du Thabor, le chêne de Tsaanannim se cherchant dans les environs ; d’autres s’en tiennent au site du nord, et la carte montre les deux."
    - "Tel Kedesh a été fouillé : à partir de 1997, des équipes des universités du Michigan et du Minnesota y ont mis au jour un bâtiment administratif des périodes perse et hellénistique, avec des archives de plus de deux mille bulles d’argile, et un temple romain des IIe et IIIe siècles apr. J.-C. se dresse encore sur le tertre inférieur. Khirbet Qedish, au-dessus du village moderne de Poriya, au sud de Tibériade, est une ruine non fouillée, avec des tombes et de la céramique anciennes ; la question ne peut donc pas encore être tranchée sur le terrain."
  it:
    - "Kedes, «luogo santo», è il nome di più città, e questa scheda riguarda la Kedes del racconto di Debora e Barak. Debora fece chiamare Barak «da Kades di Neftali» e andò là con lui: «E Barak convocò Zabulon e Neftali a Kades; diecimila uomini si misero al suo séguito, e Debora salì con lui». Cheber il Chenita, separato dal suo popolo, «avea piantate le sue tende fino al querceto di Tsaannaim, ch’è presso a Kades», e là, dopo la battaglia presso il Kison, sua moglie Giaele uccise Sisara in fuga. Il nome di santuario, l’adunata delle tribù e l’albero sacro di Zaananim suggeriscono un antico luogo santo della Galilea."
    - "Dove si trovasse questa Kedes è discusso. La grande Kedes di Neftali è Tel Kedesh, nell’Alta Galilea a nord di Asor, città reale cananea dell’elenco di Giosuè, città di rifugio e città levitica, che Tiglat-Pilèser III tolse a Pekach nel 733 o 732 a.C.; molti ritengono che la Kedes di Barak sia la stessa. Ma essa dista circa 50 km dal monte Tabor, dove l’esercito doveva radunarsi, attraverso un paese aspro, e la tenda di Cheber e l’impresa di Giaele appartengono ai pressi del campo di battaglia. Yohanan Aharoni sostenne perciò Khirbet Qedish, una rovina che conserva il nome sulle alture sopra la riva sud-occidentale del Lago di Tiberiade, a poche ore di marcia dal Tabor, con la quercia di Zaananim da cercarsi nelle vicinanze; altri si attengono al sito settentrionale, e la mappa li mostra entrambi."
    - "Tel Kedesh è stata scavata: dal 1997 squadre delle università del Michigan e del Minnesota hanno portato alla luce un edificio amministrativo persiano ed ellenistico con un archivio di più di duemila sigilli d’argilla, e un tempio romano del II e III secolo d.C. sorge ancora sul tell inferiore. Khirbet Qedish, sopra l’odierno villaggio di Poriya a sud di Tiberiade, è una rovina non scavata con tombe antiche e ceramica, così che la questione non può ancora essere risolta sul terreno."
  pl:
    - "Kedesz, „święte miejsce”, to nazwa kilku miast, a niniejszy zapis dotyczy Kedesz z opowieści o Deborze i Baraku. Debora wezwała Baraka „z Kades Neftalim” i poszła tam razem z nim: „Zebrał tedy Barak Zabulona i Neftalima do Kades, a wywiódł z sobą dziesięć tysięcy mężów, z którym też szła i Debora.” Cheber Kenita, odłączony od swego ludu, „rozbił namiot swój aż do Elon w Sananim, które jest w Kades”, i tam, po bitwie nad Kiszonem, jego żona Jaela zabiła uciekającego Siserę. Nazwa sanktuarium, zgromadzenie plemion i święte drzewo w Saananim wskazują na dawne święte miejsce w Galilei."
    - "Gdzie leżało to Kedesz, jest sporne. Wielkie Kedesz Neftalego to Tel Kedesz w Górnej Galilei, na północ od Chasoru, kananejskie miasto królewskie z listy Jozuego, miasto schronienia i miasto lewickie, które Tiglat-Pileser III zabrał Pekachowi w 733 lub 732 r. p.n.e.; wielu uważa, że Kedesz Baraka to to samo miejsce. Leży ono jednak około 50 km od góry Tabor, gdzie miało się zebrać wojsko, za trudnym terenem, a namiot Chebera i czyn Jaeli należą do okolic pola bitwy. Dlatego Jochanan Aharoni opowiadał się za Khirbet Qedish, ruiną, która zachowuje nazwę, na wzgórzach nad południowo-zachodnim brzegiem Jeziora Galilejskiego, o kilka godzin marszu od Taboru, z dębem Saananim szukanym w pobliżu; inni trzymają się miejsca północnego, a mapa pokazuje oba."
    - "Tel Kedesz został przebadany: od 1997 r. zespoły uniwersytetów Michigan i Minnesoty odsłoniły perski i hellenistyczny budynek administracyjny z archiwum liczącym ponad dwa tysiące glinianych pieczęci, a na dolnym wzgórzu wciąż stoi rzymska świątynia z II i III w. n.e. Khirbet Qedish, nad dzisiejszą wsią Poriya na południe od Tyberiady, to nieprzebadana ruina ze starożytnymi grobowcami i ceramiką, więc pytania nie można jeszcze rozstrzygnąć na podstawie samego terenu."
  nl:
    - "Kedes, “heilige plaats”, is de naam van meerdere steden, en dit lemma betreft het Kedes uit het verhaal van Debora en Barak. Debora ontbood Barak “van Kedes-Nafthali” en ging met hem mee: “Toen riep Barak Zebulon en Nafthali bijeen te Kedes, en hij toog op, op zijn voeten, met tien duizend man; ook toog Debora met hem op.” Heber, de Keniet, die zich van zijn volk had afgezonderd, “had zijn tenten opgeslagen tot aan den eik in Zaanaim, die bij Kedes is”, en daar doodde zijn vrouw Jaël, na de slag bij de Kison, de vluchtende Sisera. De heiligdomsnaam, de oproep van de stammen en de heilige boom van Zaänannim wijzen op een oude heilige plaats in Galilea."
    - "Waar dit Kedes lag, is omstreden. Het grote Kedes van Naftali is Tel Kedesh in Boven-Galilea ten noorden van Hazor, de Kanaänitische koningsstad uit de lijst in het boek Jozua, een vrijstad en een stad van de Levieten, die Tiglat-Pileser III in 733 of 732 v.Chr. op Pekach veroverde; velen houden Baraks Kedes voor dezelfde plaats. Maar het ligt zo'n 50 km van de berg Tabor, waar het leger zich moest verzamelen, over ruw terrein, en Hebers tent en Jaëls daad horen dicht bij het slagveld thuis. Yohanan Aharoni verdedigde daarom Khirbet Qedish, een ruïne die de naam bewaart op de hoogten boven de zuidwestoever van het Meer van Galilea, enkele uren marsen van de Tabor, waar in de buurt de eik van Zaänannim wordt gezocht; anderen houden vast aan de noordelijke plaats, en de kaart toont beide."
    - "Tel Kedesh is opgegraven: vanaf 1997 legden teams van de universiteiten van Michigan en Minnesota een Perzisch en hellenistisch administratief gebouw bloot met een archief van meer dan tweeduizend kleizegels, en een Romeinse tempel uit de tweede en derde eeuw n.Chr. staat nog op de benedenheuvel. Khirbet Qedish, boven het moderne dorp Poriya ten zuiden van Tiberias, is een onopgegraven ruïne met oude graven en aardewerk, zodat de vraag op grond van opgravingen nog niet kan worden beslist."
  cs:
    - "Kedeš, „svaté místo“, je jméno několika měst a tento záznam se týká Kedeše z příběhu o Deboře a Bárakovi. Debora povolala Báraka „z Kádes Neftalímova“ a šla tam s ním: „Svolav pak Barák Zabulonské a Neftalímské do Kádes, vyvedl za sebou deset tisíc mužů; a šla s ním i Debora.“ Cheber Kénijec, oddělený od svého lidu, „rozbil stany své až k Elon v Sananim, jenž jest v Kádes“, a tam po bitvě u Kíšonu zabila jeho žena Jáel prchajícího Siseru. Název svatyně, shromáždění kmenů a posvátný strom u Caananimu naznačují dávné svaté místo v Galileji."
    - "Kde tento Kedeš ležel, je sporné. Velký Kedeš Neftalího je Tel Kedeš v Horní Galileji severně od Chacoru, kanaánské královské město z Jozuova seznamu, útočištné město a město levitů, které Tiglatpilesar III. vzal Pekachovi roku 733 nebo 732 př. n. l.; mnozí pokládají Bárakův Kedeš za totéž místo. Leží však asi 50 km od hory Tábor, kde se mělo vojsko shromáždit, přes drsnou krajinu, a Cheberův stan i Jáelin čin patří do blízkosti bojiště. Jochanan Aharoni proto hájil Khirbet Qedish, zříceninu, která si jméno zachovala na výšinách nad jihozápadním břehem Galilejského jezera, několik hodin pochodu od Táboru, s dubem u Caananimu hledaným poblíž; jiní se drží severního místa a mapa ukazuje obě."
    - "Tel Kedeš byl prozkoumán: od roku 1997 tam týmy z univerzit v Michiganu a Minnesotě odkryly perskou a helénistickou správní budovu s archivem více než dvou tisíc hliněných pečetí a na dolním pahorku dosud stojí římský chrám z 2. a 3. století n. l. Khirbet Qedish nad dnešní vsí Poriya jižně od města Tiberias je neprozkoumaná zřícenina s dávnými hroby a keramikou, takže otázku zatím nelze z terénu rozhodnout."
  sv:
    - "Kedesh, ”helig plats”, är namnet på flera städer, och denna artikel gäller det Kedesh som förekommer i berättelsen om Debora och Barak. Debora lät kalla Barak ”från Kedes i Naftali” och följde med honom dit: ”Då bådade Barak upp Sebulon och Naftali till Kedes, och tio tusen man följde honom ditupp; Debora gick ock ditupp med honom.” Keniten Hever, som hade skilt sig från sitt folk, ”hade sina tältplatser ända till terebinten i Saannim vid Kedes”, och där dödade hans hustru Jael, efter slaget vid Kishon, den flyende Sisera. Helgedomsnamnet, stammarnas samling och det heliga trädet i Saanannim tyder på en gammal helig plats i Galileen."
    - "Var detta Kedesh låg är omstritt. Det stora Kedesh i Naftali är Tel Kedesh i Övre Galileen norr om Hasor, den kanaaneiska kungastad som finns i Josuas förteckning, en tillflyktsstad och en levitstad, som Tiglat-Pileser III tog från Pekach 733 eller 732 f.Kr.; många håller Baraks Kedesh för detsamma. Men det ligger omkring 50 km från berget Tabor, där hären skulle samlas, över svårframkomlig terräng, och Hevers tält och Jaels gärning hör hemma nära slagfältet. Yohanan Aharoni hävdade därför Khirbet Qedish, en ruin som bevarar namnet på höjderna ovanför Galileiska sjöns sydvästra strand, några timmars marsch från Tabor, med Saanannims ek sökt i närheten; andra håller fast vid den norra platsen, och kartan visar båda."
    - "Tel Kedesh har grävts ut: från 1997 grävde lag från universiteten i Michigan och Minnesota fram en administrativ byggnad från persisk och hellenistisk tid med ett arkiv på över två tusen lerförseglingar, och ett romerskt tempel från 100- och 200-talen e.Kr. står ännu på den nedre kullen. Khirbet Qedish, ovanför den moderna byn Poriya söder om Tiberias, är en outgrävd ruin med antika gravar och keramik, så frågan kan ännu inte avgöras på marken."
  nb:
    - "Kedesj, «hellig sted», er navnet på flere byer, og denne oppføringen gjelder Kedesj i fortellingen om Debora og Barak. Debora kalte Barak til seg «fra Kedes i Naftali» og dro dit med ham: «Og Barak stevnet Sebulon og Naftali sammen til Kedes, og ti tusen mann drog op efter ham; og Debora gikk med ham.» Kenitten Heber, som hadde skilt seg fra sitt folk, «flyttet med sine telt like til Sa'ana'im-eken ved Kedes», og der drepte hans hustru Jael, etter slaget ved Kisjon, den flyktende Sisera. Helligdomsnavnet, oppbudet av stammene og det hellige treet i Saanannim tyder på et gammelt hellig sted i Galilea."
    - "Hvor denne Kedesj lå, er omstridt. Den store Kedesj i Naftali er Tel Kedesh i Øvre Galilea nord for Hasor, den kanaanittiske kongebyen i Josvas liste, en tilfluktsby og en levittby, som Tiglat-Pileser III tok fra Pekah i 733 eller 732 f.Kr.; mange mener at Baraks Kedesj er den samme. Men den ligger omkring 50 km fra Tabor, der hæren skulle samles, over ulendt land, og Hebers telt og Jaels gjerning hører hjemme nær slagmarken. Yohanan Aharoni gikk derfor inn for Khirbet Qedish, en ruin som har beholdt navnet, på høydene over den sørvestlige stranden av Galileasjøen, noen timers marsj fra Tabor, med Saanannims eik søkt i nærheten; andre holder seg til det nordlige stedet, og kartet viser begge."
    - "Tel Kedesh er utgravd: fra 1997 avdekket lag fra universitetene i Michigan og Minnesota en administrasjonsbygning fra persertiden og den hellenistiske tiden med et arkiv på mer enn to tusen leirsegl, og et romersk tempel fra 100- og 200-tallet e.Kr. står fortsatt på den nedre haugen. Khirbet Qedish, over den moderne landsbyen Poriya sør for Tiberias, er en uutgravd ruin med gamle graver og keramikk, så spørsmålet kan ennå ikke avgjøres fra bakken."
  tl:
    - "Ang Cedes, “banal na dako”, ay pangalan ng ilang bayan, at ang talaang ito ay para sa Cedes ng kuwento nina Debora at Barac. Ipinatawag ni Debora si Barac “mula sa Cedes-nephtali” at sumama roon sa kaniya: “At tinawag ni Barac ang Zabulon at ang Nephtali na magkasama sa Cedes; at doo'y umahon ang sangpung libong lalake na kasunod niya: at si Debora ay umahong kasama niya.” Si Heber na Cineo ay humiwalay sa kaniyang bayan at “itinayo ang kaniyang tolda hanggang sa encina sa Zaananim, na nasa siping ng Cedes”, at doon, pagkatapos ng labanan sa Cison, pinatay ng asawa niyang si Jael ang tumatakas na si Sisara. Ang pangalan ng santuwaryo, ang pagtitipon ng mga lipi at ang banal na puno ng Saananim ay nagpapahiwatig ng isang lumang banal na dako ng Galilea."
    - "Pinagtatalunan kung saan naroon ang Cedes na ito. Ang dakilang Cedes ng Nephtali ay ang Tel Kedesh sa Mataas na Galilea sa hilaga ng Hasor, ang maharlikang lungsod ng mga Cananeo sa talaan ni Josue, isang lungsod ng kanlungan at bayang Levitico, na kinuha ni Tiglath-pileser III kay Peka noong 733 o 732 BK; marami ang nag-aakalang ito rin ang Cedes ni Barac. Ngunit mga 50 km ito mula sa Bundok Tabor, kung saan magtitipon ang hukbo, sa magaspang na lupain, at ang tolda ni Heber at ang gawa ni Jael ay nasa malapit sa larangan ng digmaan. Kaya ipinagtanggol ni Yohanan Aharoni ang Khirbet Qedish, isang guhong may gayon ding pangalan sa mga taluktok sa itaas ng timog-kanlurang baybayin ng Dagat ng Galilea, ilang oras na lakad mula sa Thabor, na ang encina ng Saananim ay hinahanap sa malapit; ang iba ay nananatili sa hilagang pook, at ipinapakita ng mapa ang dalawa."
    - "Nahukay ang Tel Kedesh: mula 1997 ay natuklasan ng mga pangkat mula sa mga unibersidad ng Michigan at Minnesota ang isang gusaling pampangasiwaan ng panahong Persiano at Helenistiko na may arkibo ng mahigit dalawang libong tatak na luwad, at nakatayo pa sa ibabang burol ang isang templong Romano noong ika-2 at ika-3 siglo AD. Ang Khirbet Qedish, sa itaas ng makabagong nayon ng Poriya sa timog ng Tiberias, ay isang guhong hindi pa nahuhukay na may mga sinaunang libingan at palayok, kaya't hindi pa maisasaayos ang tanong mula sa lupa."
