# Overview article (ADR 0007). Mainstream facts only; this record is the Kedesh of Judges 4, kept apart from the Kedesh of Joshua and Kings; the two candidate sites are given without choosing.
id: kedesh-deborah
place: ad74690
title:
  en: "Kedesh"
  ru: "Кедес"
  uk: "Кедес"
  es: "Cedes"
  pt: "Quedes"
  de: "Kedesch"
  fr: "Kédesch"
  it: "Kedes"
