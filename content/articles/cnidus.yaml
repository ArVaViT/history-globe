body:
  en:
    - "Cnidus was a Dorian Greek city of Caria, at the tip of the long, narrow peninsula that runs west from the coast of south-western Asia Minor between the islands of Cos and Rhodes. It belonged to the Dorian league of six cities whose festival was held on the nearby Triopian headland. The later city was built partly on the mainland and partly on an island joined to it by a causeway, so that it had two harbours. When the Persian general Harpagus advanced about 546 BC, the Cnidians began to dig through the isthmus of their peninsula, but stopped when the Delphic oracle forbade it. Off Cnidus in 394 BC Conon defeated the Spartan fleet. The city was famous for the Aphrodite of Praxiteles, whom people sailed to Cnidus to see, and was the home of the astronomer Eudoxus and of Sostratus, who dedicated the Pharos of Alexandria."
    - "Cnidus was the last harbour of Asia on the way west. Paul, sailing to Rome as a prisoner in a ship of Alexandria taken on at Myra, could not reach it: “when we had sailed slowly many days, and scarce were come over against Cnidus, the wind not suffering us, we sailed under Crete, over against Salmone.” Two centuries earlier Cnidus had been one of the states to which, according to 1 Maccabees, a Roman consul sent copies of a letter in favour of the Jews."
    - "Charles Newton excavated the site in 1857–1858 and took the seated Demeter and the colossal Lion of Knidos, from a tomb a few kilometres from the city, to the British Museum. Iris Love of Long Island University dug there from 1967 to 1977, and Turkish teams of Selçuk University continue the work. Today the ruins lie at Cape Tekir near the village of Yazıköy in the Datça district of Muğla province, Turkey."
  ru:
    - "Книд — дорийский греческий город Карии на оконечности длинного узкого полуострова, который тянется на запад от побережья юго-западной Малой Азии между островами Кос и Родос. Он входил в дорийский союз шести городов, чей праздник справлялся на соседнем Триопийском мысу. Поздний город стоял частью на материке, частью на острове, соединённом с ним насыпью, и потому имел две гавани. Когда ок. 546 г. до н. э. подступил персидский полководец Гарпаг, книдяне начали прокапывать перешеек своего полуострова, но бросили работу, когда Дельфийский оракул это запретил. У Книда в 394 г. до н. э. Конон разбил спартанский флот. Город славился Афродитой Праксителя, ради которой к Книду приплывали, и был родиной астронома Евдокса и Сострата, посвятившего Фаросский маяк."
    - "Книд был последней гаванью Азии на пути на запад. Павел, плывший узником в Рим на Александрийском корабле, взятом в Мирах Ликийских, не смог до него дойти: «медленно плавая многие дни и едва поравнявшись с Книдом, по причине неблагоприятного нам ветра, мы подплыли к Криту при Салмоне». Двумя веками раньше Книд был среди тех государств, которым, по Первой книге Маккавейской, римский консул разослал списки письма в пользу иудеев."
    - "Чарльз Ньютон раскапывал город в 1857–1858 гг. и вывез в Британский музей сидящую Деметру и колоссального Книдского льва с гробницы в нескольких километрах от города. Айрис Лав из Университета Лонг-Айленда копала здесь с 1967 по 1977 г., а сейчас работу продолжают турецкие команды Сельчукского университета. Сегодня руины лежат на мысе Текир у деревни Языкёй в районе Датча провинции Мугла в Турции."
  uk:
    - "Кнід був дорійським грецьким містом у Карії, на кінчику довгого вузького півострова, що тягнеться на захід від узбережжя південно-західної Малої Азії між островами Кос і Родос. Він належав до Дорійського союзу шести міст, свято якого відбувалося на сусідньому Тріопійському мисі. Пізніше місто було збудоване частково на материку, частково на острові, з'єднаному з ним дамбою, тож мало дві гавані. Коли близько 546 р. до н. е. перський полководець Гарпаг рушив уперед, книдці почали прокопувати перешийок свого півострова, але припинили, коли дельфійський оракул це заборонив. Біля Кніда 394 р. до н. е. Конон розбив спартанський флот. Місто славилося Афродітою Праксітеля, заради якої люди припливали до Кніда, і було батьківщиною астронома Евдокса та Сострата, який присвятив александрійський Фарос."
    - "Кнід був останньою гаванню Азії на шляху на захід. Павло, що плив до Риму як в'язень на александрійському кораблі, на який пересів у Мирах, не зміг до нього дістатися: «Многі ж днї помалу пливучи і ледві бувши проти Книда, тим що не допускав нас вітер, приплили ми під Крит проти Салмона». Двома століттями раніше Кнід був однією з держав, до яких, за 1 Маккавеїв, римський консул розіслав копії листа на користь юдеїв."
    - "Чарлз Ньютон розкопував місце в 1857–1858 рр. і вивіз до Британського музею сидячу Деметру та колосального Лева з Кніда, з гробниці за кілька кілометрів від міста. Айріс Лав з Університету Лонг-Айленда копала там з 1967 до 1977 р., а турецькі групи університету Сельчук продовжують роботи. Нині руїни лежать на мисі Текір біля села Язикьой у районі Датча провінції Мугла в Туреччині."
  es:
    - "Gnido fue una ciudad griega doria de Caria, en la punta de la larga y estrecha península que corre hacia el oeste desde la costa del suroeste de Asia Menor entre las islas de Cos y Rodas. Pertenecía a la liga doria de seis ciudades cuya fiesta se celebraba en el cercano promontorio Triopio. La ciudad posterior se construyó en parte en el continente y en parte en una isla unida a él por un malecón, de modo que tenía dos puertos. Cuando el general persa Hárpago avanzó hacia 546 a. C., los gnidios empezaron a abrir un canal en el istmo de su península, pero se detuvieron cuando el oráculo de Delfos lo prohibió. Frente a Gnido derrotó Conón a la flota espartana en 394 a. C. La ciudad era famosa por la Afrodita de Praxíteles, a la que la gente navegaba para ver, y fue patria del astrónomo Eudoxo y de Sóstrato, que dedicó el Faro de Alejandría."
    - "Gnido era el último puerto de Asia en el camino hacia el oeste. Pablo, que navegaba a Roma como preso en una nave de Alejandría tomada en Mira, no pudo alcanzarlo: «navegando muchos días despacio, y habiendo apenas llegado delante de Gnido, no dejándonos el viento, navegamos bajo de Creta, junto á Salmón». Dos siglos antes, Gnido había sido uno de los estados a los que, según 1 Macabeos, un cónsul romano envió copias de una carta en favor de los judíos."
    - "Charles Newton excavó el lugar en 1857–1858 y llevó al Museo Británico la Deméter sentada y el colosal León de Gnido, procedente de una tumba a pocos kilómetros de la ciudad. Iris Love, de la Universidad de Long Island, excavó allí de 1967 a 1977, y equipos turcos de la Universidad de Selçuk continúan la labor. Hoy las ruinas se hallan en el cabo Tekir, cerca de la aldea de Yazıköy, en el distrito de Datça de la provincia turca de Muğla."
  pt:
    - "Cnido era uma cidade grega dórica da Cária, na ponta da longa e estreita península que corre para oeste a partir da costa do sudoeste da Ásia Menor, entre as ilhas de Cós e Rodes. Pertencia à liga dórica de seis cidades cuja festa se realizava no cabo Triópio, ali perto. A cidade posterior foi construída em parte no continente e em parte numa ilha ligada a ele por um dique, de modo que tinha dois portos. Quando o general persa Hárpago avançou, por volta de 546 a.C., os cnídios começaram a cavar o istmo de sua península, mas pararam quando o oráculo de Delfos o proibiu. Ao largo de Cnido, em 394 a.C., Cônon derrotou a frota espartana. A cidade era famosa pela Afrodite de Praxíteles, que as pessoas iam de navio a Cnido para ver, e foi a terra do astrônomo Eudoxo e de Sóstrato, que dedicou o Farol de Alexandria."
    - "Cnido era o último porto da Ásia no caminho para o oeste. Paulo, navegando para Roma como prisioneiro num navio de Alexandria tomado em Mira, não pôde alcançá-lo: “Navegamos lentamente por muitos dias e, depois de chegar com dificuldade diante de Cnido, como o vento não nos permitia avançar, navegamos sob o abrigo de Creta, diante de Salmona.” Dois séculos antes, Cnido fora um dos estados aos quais, segundo 1 Macabeus, um cônsul romano enviou cópias de uma carta em favor dos judeus."
    - "Charles Newton escavou o sítio em 1857–1858 e levou ao Museu Britânico a Deméter sentada e o colossal Leão de Cnido, de um túmulo a poucos quilômetros da cidade. Iris Love, da Universidade de Long Island, escavou ali de 1967 a 1977, e equipes turcas da Universidade de Selçuk continuam o trabalho. Hoje as ruínas ficam no cabo Tekir, perto da aldeia de Yazıköy, no distrito de Datça, província de Muğla, na Turquia."
  de:
    - "Knidos war eine dorische griechische Stadt in Karien, an der Spitze der langen, schmalen Halbinsel, die von der Küste Südwestkleinasiens nach Westen verläuft, zwischen den Inseln Kos und Rhodos. Es gehörte zum dorischen Sechsstädtebund, dessen Fest auf dem nahen Triopion-Vorgebirge gefeiert wurde. Die spätere Stadt war teils auf dem Festland, teils auf einer durch einen Damm verbundenen Insel gebaut, sodass sie zwei Häfen hatte. Als der persische Feldherr Harpagos um 546 v. Chr. vorrückte, begannen die Knidier, die Landenge ihrer Halbinsel zu durchgraben, hörten aber auf, als das delphische Orakel es verbot. Vor Knidos besiegte Konon 394 v. Chr. die spartanische Flotte. Die Stadt war berühmt für die Aphrodite des Praxiteles, die man nach Knidos segelte, um zu sehen, und war die Heimat des Astronomen Eudoxos und des Sostratos, der den Pharos von Alexandria weihte."
    - "Knidos war der letzte Hafen Asiens auf dem Weg nach Westen. Paulus, der als Gefangener auf einem alexandrinischen Schiff, das man in Myra bestiegen hatte, nach Rom fuhr, konnte ihn nicht erreichen: „Da wir aber langsam schifften und in vielen Tagen kaum gegen Knidus kamen (denn der Wind wehrte uns), schifften wir unter Kreta hin bei Salmone“. Zwei Jahrhunderte zuvor war Knidos einer der Staaten gewesen, an die nach dem Ersten Makkabäerbuch ein römischer Konsul Abschriften eines Briefes zugunsten der Juden sandte."
    - "Charles Newton grub die Stätte 1857–1858 aus und brachte die sitzende Demeter und den kolossalen Löwen von Knidos, aus einem Grab einige Kilometer von der Stadt, ins Britische Museum. Iris Love von der Long Island University grub dort von 1967 bis 1977, und türkische Teams der Selçuk-Universität setzen die Arbeit fort. Heute liegen die Ruinen am Kap Tekir bei dem Dorf Yazıköy im Kreis Datça der Provinz Muğla in der Türkei."
  fr:
    - "Cnide était une cité grecque dorienne de Carie, à la pointe de la longue et étroite péninsule qui s’avance vers l’ouest depuis la côte du sud-ouest de l’Asie Mineure, entre les îles de Cos et de Rhodes. Elle appartenait à la ligue dorienne des six cités, dont la fête se tenait sur le cap Triopion voisin. La cité plus tardive s’étendait sur le continent et sur une île qui lui était reliée par une chaussée, de sorte qu’elle avait deux ports. Quand le général perse Harpage avança, vers 546 av. J.-C., les Cnidiens commencèrent à creuser l’isthme de leur péninsule, mais s’arrêtèrent quand l’oracle de Delphes le leur interdit. Au large de Cnide, en 394 av. J.-C., Conon vainquit la flotte spartiate. La cité était célèbre pour l’Aphrodite de Praxitèle, que l’on venait voir par mer, et fut la patrie de l’astronome Eudoxe et de Sostrate, qui dédia le phare d’Alexandrie."
    - "Cnide était le dernier port d’Asie sur la route de l’ouest. Paul, qui naviguait vers Rome comme prisonnier sur un navire d’Alexandrie pris à Myra, ne put y aborder : « Pendant plusieurs jours nous naviguâmes lentement, et ce ne fut pas sans difficulté que nous atteignîmes la hauteur de Cnide, où le vent ne nous permit pas d’aborder. Nous passâmes au-dessous de l’île de Crète, du côté de Salmone. » Deux siècles plus tôt, Cnide avait été l’un des États auxquels, selon 1 Maccabées, un consul romain avait envoyé des copies d’une lettre favorable aux Juifs."
    - "Charles Newton fouilla le site en 1857–1858 et emporta au British Museum la Déméter assise et le Lion de Cnide, colossal, provenant d’un tombeau situé à quelques kilomètres de la cité. Iris Love, de la Long Island University, y fouilla de 1967 à 1977, et des équipes turques de l’université Selçuk poursuivent le travail. Aujourd’hui, les ruines se trouvent au cap Tekir, près du village de Yazıköy, dans le district de Datça, province de Muğla, en Turquie."
  it:
    - "Cnido era una città greca dorica della Caria, all’estremità della lunga e stretta penisola che si spinge a ovest dalla costa dell’Asia Minore sud-occidentale tra le isole di Coo e Rodi. Faceva parte della lega dorica delle sei città, la cui festa si teneva sul vicino promontorio Triopio. La città successiva fu costruita in parte sulla terraferma e in parte su un’isola congiunta ad essa da un molo, così da avere due porti. Quando il generale persiano Arpago avanzò verso il 546 a.C., i Cnidii cominciarono a scavare un canale attraverso l’istmo della loro penisola, ma smisero quando l’oracolo di Delfi lo vietò. Al largo di Cnido nel 394 a.C. Conone sconfisse la flotta spartana. La città era famosa per l’Afrodite di Prassitele, che si andava a vedere navigando fino a Cnido, e fu la patria dell’astronomo Eudosso e di Sostrato, che dedicò il faro di Alessandria."
    - "Cnido era l’ultimo porto dell’Asia sulla via verso occidente. Paolo, diretto a Roma come prigioniero su una nave di Alessandria presa a Mira, non poté raggiungerlo: «E navigando per molti giorni lentamente, e pervenuti a fatica, per l’impedimento del vento, di faccia a Gnido, veleggiammo sotto Creta, di rincontro a Salmone». Due secoli prima Cnido era stata uno degli stati ai quali, secondo il Primo libro dei Maccabei, un console romano inviò copie di una lettera a favore dei Giudei."
    - "Charles Newton scavò il sito nel 1857–1858 e portò al British Museum la Demetra seduta e il colossale Leone di Cnido, proveniente da una tomba a pochi chilometri dalla città. Iris Love della Long Island University vi scavò dal 1967 al 1977, e squadre turche dell’Università Selçuk proseguono il lavoro. Oggi le rovine si trovano a Capo Tekir, presso il villaggio di Yazıköy, nel distretto di Datça, nella provincia turca di Muğla."
  nl:
    - "Knidus was een Dorische Griekse stad in Karië, aan de punt van het lange, smalle schiereiland dat westwaarts loopt vanaf de kust van het zuidwesten van Klein-Azië tussen de eilanden Kos en Rhodos. Het behoorde tot de Dorische bond van zes steden wier feest op de nabije Triopische landtong werd gehouden. De latere stad lag deels op het vasteland en deels op een eiland dat er door een dam mee verbonden was, zodat zij twee havens had. Toen de Perzische veldheer Harpagos omstreeks 546 v.Chr. oprukte, begonnen de Knidiërs de landengte door te graven, maar zij hielden op toen het orakel van Delphi het verbood. Voor Knidus versloeg Konon in 394 v.Chr. de Spartaanse vloot. De stad was beroemd om de Aphrodite van Praxiteles, die men naar Knidus voer om te zien, en was de woonplaats van de sterrenkundige Eudoxus en van Sostratus, die de Pharos van Alexandrië wijdde."
    - "Knidus was de laatste haven van Azië op weg naar het westen. Paulus, die als gevangene naar Rome voer in een schip van Alexandrië dat hij te Myra had overgenomen, kon haar niet bereiken: “En als wij vele dagen langzaam voortvoeren, en nauwelijks tegenover Knidus gekomen waren, overmits het ons de wind niet toeliet, zo voeren wij onder Kreta heen, tegenover Salmone.” Twee eeuwen eerder was Knidus een van de staten aan wie volgens 1 Makkabeeën een Romeinse consul afschriften van een brief ten gunste van de Joden zond."
    - "Charles Newton groef de plaats op in 1857–1858 en nam de zittende Demeter en de kolossale Leeuw van Knidos, uit een graf enkele kilometers van de stad, mee naar het British Museum. Iris Love van Long Island University groef er van 1967 tot 1977, en Turkse teams van de Selçuk-universiteit zetten het werk voort. Tegenwoordig liggen de ruïnes bij Kaap Tekir bij het dorp Yazıköy in het district Datça van de provincie Muğla in Turkije."
  pl:
    - "Knidos było doryckim miastem greckim w Karii, na końcu długiego, wąskiego półwyspu biegnącego na zachód od wybrzeża południowo-zachodniej Azji Mniejszej między wyspami Kos i Rodos. Należało do doryckiego związku sześciu miast, którego święto odbywało się na pobliskim przylądku Triopion. Późniejsze miasto zbudowano częściowo na lądzie, a częściowo na wyspie połączonej z nim groblą, tak że miało dwa porty. Gdy około 546 p.n.e. nadciągnął perski wódz Harpag, Knidyjczycy zaczęli przekopywać przesmyk swego półwyspu, lecz przerwali, gdy wyrocznia delficka im tego zabroniła. Pod Knidos w 394 p.n.e. Konon pokonał flotę spartańską. Miasto słynęło z Afrodyty Praksytelesa, którą ludzie przypływali oglądać do Knidos, i było ojczyzną astronoma Eudoksosa oraz Sostratosa, który poświęcił latarnię Faros w Aleksandrii."
    - "Knidos było ostatnim portem Azji w drodze na zachód. Paweł, płynąc jako więzień do Rzymu na okręcie aleksandryjskim zabranym w Mirze, nie mógł do niego dotrzeć: „A gdyśmy przez wiele dni z wolna płynęli, a zaledwie przeciwko Knidowi przyjechali, przeto że nam wiatr nie dopuszczał, popłynęliśmy pod Kretę podle Salmonu”. Dwa wieki wcześniej Knidos było jednym z państw, do których według Pierwszej Księgi Machabejskiej rzymski konsul wysłał odpisy listu w sprawie Żydów."
    - "Charles Newton prowadził wykopaliska na stanowisku w latach 1857-1858 i zabrał siedzącą Demeter oraz kolosalnego Lwa z Knidos, z grobowca oddalonego o kilka kilometrów od miasta, do British Museum. Iris Love z Long Island University kopała tam od 1967 do 1977 roku, a tureckie zespoły Uniwersytetu Selçuk kontynuują prace. Dziś ruiny leżą na przylądku Tekir koło wsi Yazıköy w powiecie Datça w prowincji Muğla w Turcji."
  cs:
    - "Knidos bylo dórské řecké město v Kárii, na špici dlouhého úzkého poloostrova, který se táhne na západ od pobřeží jihozápadní Malé Asie mezi ostrovy Kós a Rhodos. Patřilo k dórskému spolku šesti měst, jehož slavnost se konala na nedalekém mysu Triopion. Pozdější město bylo vystavěno zčásti na pevnině a zčásti na ostrově spojeném s ní hrází, takže mělo dva přístavy. Když perský vojevůdce Harpagos kolem roku 546 př. n. l. postupoval, začali Knidové prokopávat šíji svého poloostrova, ale přestali, když to delfské orákulum zakázalo. U Knidu porazil roku 394 př. n. l. Konón spartské loďstvo. Město bylo slavné Praxitelovou Afroditou, kvůli níž lidé do Knidu plavili, a bylo domovem astronoma Eudoxa a Sostrata, který zasvětil alexandrijský maják Faros."
    - "Knidos byl posledním přístavem Asie na cestě na západ. Pavel, plující do Říma jako vězeň na alexandrijské lodi, na kterou přesedl v Myře, k němu nemohl dospět: „když jsme za mnoho dní znenáhla se plavili a sotva připlouli proti Gnidum, a vítr nám bránil přiblížiti se k zemi, i podjeli jsme Krétu podle Salmóny“. O dvě století dříve byl Knidos jedním ze států, jimž podle 1. knihy Makabejské poslal římský konzul opisy listu ve prospěch Židů."
    - "Charles Newton místo zkoumal v letech 1857–1858 a odvezl sedící Démétru a kolosálního knidského lva, z hrobky několik kilometrů od města, do Britského muzea. Iris Love z Long Island University tam kopala v letech 1967 až 1977 a turecké týmy Selçukovy univerzity v práci pokračují. Dnes leží zříceniny na mysu Tekir poblíž vesnice Yazıköy v okrese Datça v provincii Muğla v Turecku."
  sv:
    - "Knidos var en dorisk grekisk stad i Karien, på spetsen av den långa, smala halvön som sträcker sig västerut från sydvästra Mindre Asiens kust mellan öarna Kos och Rhodos. Den tillhörde det doriska förbundet av sex städer vars högtid hölls på det närbelägna Triopionudden. Den senare staden byggdes delvis på fastlandet och delvis på en ö som var förenad med det genom en vägbank, så att den hade två hamnar. När den persiske fältherren Harpagos tågade fram omkring 546 f.Kr. började knidierna gräva igenom sin halvös näs men slutade när oraklet i Delfi förbjöd det. Utanför Knidos besegrade Konon den spartanska flottan 394 f.Kr. Staden var berömd för Praxiteles Afrodite, som man seglade till Knidos för att se, och var hemort för astronomen Eudoxos och för Sostratos, som invigde Faros i Alexandria."
    - "Knidos var Asiens sista hamn på vägen västerut. Paulus, som seglade till Rom som fånge på ett skepp från Alexandria som togs ombord i Myra, kunde inte nå den: ”Under en längre tid gick nu seglingen långsamt, och vi kommo med knapp nöd inemot Knidus. Och då vinden icke var oss gynnsam, seglade vi in under Kreta vid Salmone.” Två sekel tidigare hade Knidos varit en av de stater som, enligt Första Mackabeerboken, en romersk konsul sände avskrifter av ett brev till förmån för judarna."
    - "Charles Newton grävde ut platsen 1857–1858 och tog den sittande Demeter och det kolossala Lejonet från Knidos, från en grav några kilometer från staden, till British Museum. Iris Love från Long Island University grävde där 1967–1977, och turkiska team från Selçuk-universitetet fortsätter arbetet. I dag ligger ruinerna vid Kap Tekir nära byn Yazıköy i distriktet Datça i provinsen Muğla i Turkiet."
  nb:
    - "Knidos var en dorisk-gresk by i Karia, ytterst på den lange, smale halvøya som går vestover fra kysten av sørvestlige Lilleasia mellom øyene Kos og Rhodos. Den hørte til den doriske ligaen av seks byer hvis fest ble holdt på det nærliggende Triopion-neset. Den senere byen var bygd dels på fastlandet og dels på en øy forbundet med det ved en voll, slik at den hadde to havner. Da den persiske generalen Harpagos rykket frem omkring 546 f.Kr., begynte knidierne å grave gjennom eidet på sin halvøy, men sluttet da Delfi-orakelet forbød det. Utenfor Knidos beseiret Konon den spartanske flåten i 394 f.Kr. Byen var berømt for Praxiteles' Afrodite, som folk seilte til Knidos for å se, og var hjemstedet til astronomen Eudoksos og til Sostratos, som innvidde Faros i Aleksandria."
    - "Knidos var Asias siste havn på veien vestover. Paulus, som seilte til Roma som fange i et skip fra Aleksandria som ble tatt ombord i Myra, kunne ikke nå den: «I mange dager gikk det nu smått med seilingen, og vi vant med nød og neppe frem imot Knidus; da vinden var imot, holdt vi ned under Kreta ved Salmone». To hundre år tidligere hadde en romersk konsul, ifølge 1. Makkabeerbok, sendt kopier av et brev til fordel for jødene til flere stater, blant dem Knidos."
    - "Charles Newton gravde ut stedet i 1857–1858 og tok den sittende Demeter og den kolossale Knidos-løven, fra en grav noen kilometer fra byen, til British Museum. Iris Love fra Long Island University gravde der fra 1967 til 1977, og tyrkiske team fra Selçuk University fortsetter arbeidet. I dag ligger ruinene ved Kapp Tekir nær landsbyen Yazıköy i Datça-distriktet i Muğla-provinsen i Tyrkia."
  tl:
    - "Ang Gnido ay lungsod Griyegong Dorio ng Caria, sa dulo ng mahaba at makitid na tangway na tumatakbo sa kanluran mula sa baybayin ng timog-kanlurang Asia Menor sa pagitan ng mga pulo ng Coos at Rodas. Kabilang ito sa ligang Dorio ng anim na lungsod na may pistang idinaraos sa kalapit na Triopian headland. Itinayo ang huling lungsod nang bahagya sa kalupaan at bahagya sa pulong nakakabit dito ng daang-dike, kaya may dalawang daungan. Nang sumulong ang heneral na Persianong si Harpagus noong mga 546 BK, sinimulang hukayin ng mga taga-Gnido ang kipot ng tangway nila, ngunit tumigil nang ipagbawal ito ng orakulo ng Delphi. Sa labas ng Gnido noong 394 BK, tinalo ni Conon ang armada ng Sparta. Bantog ito sa Aphrodite ni Praxiteles, na nilalayag ng mga tao sa Gnido upang makita, at tahanan ng astronomong si Eudoxus at ni Sostratus, na naghandog ng Pharos ng Alejandria."
    - "Ang Gnido ang huling daungan ng Asia patungong kanluran. Si Pablo, na naglalayag patungong Roma bilang bilanggo sa barko ng Alejandria na sinakyan sa Mira, ay hindi nakarating dito: “At nang makapaglayag na kaming marahan nang maraming mga araw, at may kahirapan kaming nakarating sa tapat ng Gnido, na hindi kami tinulutan ng hanging makasulong pa, ay nagsilayag kami na nagsipanganlong sa Creta, sa tapat ng Salmon”. Dalawang siglo bago nito, ang Gnido ay isa sa mga estadong pinadalhan, ayon sa 1 Macabeo, ng isang konsul na Romano ng mga kopya ng liham na pabor sa mga Judio."
    - "Hinukay ni Charles Newton ang pook noong 1857–1858 at dinala sa British Museum ang nakaupong Demeter at ang malaking Leon ng Knidos, mula sa isang libingan na ilang kilometro mula sa lungsod. Humukay roon si Iris Love ng Long Island University mula 1967 hanggang 1977, at ipinagpapatuloy ng mga pangkat na Turko ng Selçuk University ang gawain. Ang mga guho ngayon ay nasa Cape Tekir malapit sa nayon ng Yazıköy sa distrito ng Datça ng lalawigan ng Muğla, Turkey."
  da:
    - "Knidos var en doriskgræsk by i Karien, ved spidsen af den lange, smalle halvø, der løber vest fra kysten af det sydvestlige Lilleasien mellem øerne Kos og Rhodos. Den hørte til det doriske forbund af seks byer, hvis fest blev holdt på det nærliggende Triopion-forbjerg. Den senere by var bygget dels på fastlandet og dels på en ø, forbundet med det ved en dæmning, så den havde to havne. Da den persiske general Harpagos rykkede frem omkring 546 f.Kr., begyndte knidierne at grave igennem deres halvøs tange, men holdt inde, da orakelet i Delfi forbød det. Ud for Knidos besejrede Konon i 394 f.Kr. den spartanske flåde. Byen var berømt for Praxiteles' Afrodite, som folk sejlede til Knidos for at se, og var hjemsted for astronomen Eudoxos og for Sostratos, som indviede Pharos-fyret i Alexandria."
    - "Knidos var Asiens sidste havn på vejen mod vest. Paulus, der sejlede til Rom som fange i et skib fra Alexandria, som han var gået om bord på ved Myra, kunne ikke nå den: »da Sejladsen i mange Dage gik langsomt, og vi med Nød og næppe naaede henimod Knidus (thi Vinden føjede os ikke), holdt vi ned under Kreta ved Salmone«. To århundreder tidligere havde Knidos været en af de stater, hvortil en romersk konsul ifølge 1 Makkabæerbog sendte kopier af et brev til fordel for jøderne."
    - "Charles Newton udgravede stedet i 1857–1858 og tog den siddende Demeter og Knidos' kolossale løve, fra en grav få kilometer fra byen, til British Museum. Iris Love fra Long Island University gravede dér fra 1967 til 1977, og tyrkiske hold fra Selçuk University fortsætter arbejdet. I dag ligger ruinerne ved Kap Tekir nær landsbyen Yazıköy i Datça-distriktet i Muğla-provinsen, Tyrkiet."
  sr:
    - "Книд је био дорски грчки град у Карији, на врху дугог, уског полуострва које се протеже на запад од обале југозападне Мале Азије између острва Коса и Родоса. Припадао је дорском савезу шест градова чији се празник одржавао на оближњем Триопијском рту. Каснији град био је делом саграђен на копну а делом на острву повезаном с њим насипом, тако да је имао две луке. Када је око 546. п. н. е. напредовао персијски војсковођа Харпаг, Книђани су почели да копају кроз превлаку свог полуострва, али су стали када им је делфијско пророчиште то забранило. Код Книда је 394. п. н. е. Конон победио спартанску флоту. Град је био чувен по Праксителовој Афродити, коју су људи долазили у Книд да виде, и био је завичај астронома Еудокса и Сострата, који је посветио Александријски фар."
    - "Книд је био последња лука Азије на путу ка западу. Павле, пловећи у Рим као заробљеник на броду из Александрије узетом у Мири, није могао да стигне до њега: „пловивши много дана споро, и једва дошавши према Книду, јер нам ветар не даваше, допловисмо под Крит код Салмоне“. Два века раније Книд је био једна од држава којима је, према 1. књизи о Макавејима, римски конзул послао примерке писма у корист Јевреја."
    - "Чарлс Њутн ископавао је налазиште 1857–1858. и однео Деметру на престолу и колосалног Лава из Книда, из гробнице неколико километара од града, у Британски музеј. Ајрис Лав са Универзитета Лонг Ајланд копала је тамо од 1967. до 1977, а турски тимови Универзитета Селчук настављају рад. Данас рушевине леже на рту Текир код села Јазикеј у округу Датча провинције Мугла у Турској."
