# Overview article (ADR 0007). Mainstream facts only; a wilderness station known from two itineraries whose order disagrees; the identification with Birein rests on the wells and is called a guess.
id: bene-jaakan
place: a0fe2be
title:
  en: "Bene-jaakan"
  ru: "Бене-Яакан"
  uk: "Бене-Яакан"
  es: "Bene-jaacán"
  pt: "Bene-Jaacã"
  de: "Bne-Jaakan"
  fr: "Bené-Jaakan"
  it: "Bene-Iaakan"
  pl: "Bene-Jaakan"
  nl: "Bene-Jaäkan"
  cs: "Bené-jaakan"
body:
  en:
    - "Bene-jaakan, “the sons of Jaakan”, is a station of Israel's wanderings, a camping place named after a clan rather than a town. The list in Numbers has it after Moseroth: “And they departed from Moseroth, and pitched in Bene-jaakan. And they removed from Bene-jaakan, and encamped at Hor-hagidgad”. Deuteronomy calls the place Beeroth of the children of Jaakan, “the wells of the sons of Jaakan”, and gives the march in the opposite direction, from the wells to Moserah, “there Aaron died”; the two itineraries have never been reconciled with certainty. Jaakan, or Akan, was a clan of the Horites of Seir in the genealogies of Genesis and Chronicles, so the wells lay in Edomite country, somewhere on the way between Kadesh and Mount Hor."
    - "That is all that is known. The name survives nowhere, no ancient writer places it, and the stations around it are themselves unlocated. Because the wells are the one fixed feature, el-Birein, a group of wells about 17 km north of Ain Qudeirat, the usual site of Kadesh-barnea in the Negev of Israel, has been proposed; it is a guess on the strength of the water, not an identification."
  ru:
    - "Бене-Яакан, «сыны Яакана», — стан странствий Израиля, стоянка, названная по роду, а не по городу. Список в книге Чисел ставит его после Мосерофа: «И отправились из Мосерофа и расположились станом в Бене-Яакане. И отправились из Бене-Яакана и расположились станом в Хор-Агидгаде». Второзаконие зовёт это место Беероф-Бене-Яакан, «колодцы сынов Яакана», и ведёт переход в обратную сторону, от колодцев в Мозер, где «умер Аарон»; два маршрута так и не согласованы с уверенностью. Яакан, или Акан, был родом Хорреев Сеира в родословиях Бытия и Паралипоменон, так что колодцы лежали в земле Едома, где-то на пути между Кадесом и горой Ор."
    - "Это всё, что известно. Имя нигде не сохранилось, никто из древних писателей места не указывает, и соседние станы сами не найдены. Поскольку единственная твёрдая примета — колодцы, предложили Эль-Бирейн, группу колодцев примерно в 17 км к северу от Айн-Кудейрата, обычного места Кадес-Варни в израильском Негеве; это догадка по воде, а не отождествление."
  uk:
    - "Бене-Яакан, «сини Яакана», — стоянка мандрівки Ізраїлю, місце табору, назване за родом, а не за містом. Перелік у Числах має його після Мосерота: «І рушили з Мозерота та й отаборились у Бене-Яаканї. І рушили з Бене-Яакана та й отаборолись у Гор-Гідгадї». Второзаконня називає місце Беерот синів Яакана, «Беерот-Бне-Яакану», і подає похід у протилежному напрямку, від колодязів до Мосери: «Там умер Арон»; два маршрути ніколи не були погоджені з певністю. Яакан, або Акан, був родом хорреїв у Сеїрі в родоводах Буття і Хронік, тож колодязі лежали в едомському краї, десь на шляху між Кадесом і горою Гор."
    - "Це все, що відомо. Назва ніде не збереглася, жоден давній автор її не розміщує, а станції навколо неї самі не локалізовані. Оскільки колодязі — єдина стала прикмета, запропоновано Ель-Бірейн, групу колодязів приблизно за 17 км на північ від Айн-Кудейрата, звичайного місця Кадеса в Негеві Ізраїлю; це здогад на підставі води, а не ототожнення."
  es:
    - "Bene-jaacán, «los hijos de Jaacán», es una estación de las peregrinaciones de Israel, un lugar de acampada que recibe el nombre de un clan más que de una ciudad. La lista de Números la pone después de Moserot: «Y partidos de Moseroth, asentaron en Bene-jaacán. Y partidos de Bene-jaacán, asentaron en el monte de Gidgad». El Deuteronomio llama al lugar Beerot de los hijos de Jaacán, «los pozos de los hijos de Jaacán», y da la marcha en sentido contrario, desde los pozos a Moserá, «allí murió Aarón»; los dos itinerarios nunca se han conciliado con certeza. Jaacán, o Acán, era un clan de los horeos de Seir en las genealogías del Génesis y de las Crónicas, de modo que los pozos se hallaban en tierra edomita, en algún punto del camino entre Cades y el monte Hor."
    - "Eso es todo lo que se sabe. El nombre no sobrevive en ninguna parte, ningún escritor antiguo lo sitúa, y las estaciones que lo rodean no están a su vez localizadas. Como los pozos son el único rasgo fijo, se ha propuesto el-Birein, un grupo de pozos a unos 17 km al norte de Ain Qudeirat, el sitio habitual de Cades-barnea, en el Néguev de Israel; es una conjetura basada en el agua, no una identificación."
  pt:
    - "Bene-Jaacã, “os filhos de Jaacã”, é uma estação das peregrinações de Israel, um lugar de acampamento com nome de clã, e não de cidade. A lista de Números o põe depois de Moserote: “Partiram de Moserote e acamparam em Bene-Jaacã. Partiram de Bene-Jaacã e acamparam em Hor-Hagidgade”. Deuteronômio chama o lugar Beerote dos filhos de Jaacã, “os poços dos filhos de Jaacã”, e dá a marcha em sentido contrário, dos poços a Moserá, onde “Lá Arão morreu”; os dois itinerários nunca foram conciliados com certeza. Jaacã, ou Acã, era um clã dos horeus de Seir nas genealogias de Gênesis e Crônicas, de modo que os poços ficavam em terra de Edom, em algum ponto do caminho entre Cades e o monte Hor."
    - "Isso é tudo o que se sabe. O nome não sobrevive em lugar algum, nenhum escritor antigo o situa, e as estações em torno dele são elas mesmas desconhecidas. Como os poços são o único traço fixo, propôs-se el-Birein, um grupo de poços cerca de 17 km ao norte de Ain Qudeirat, o sítio habitual de Cades-Barneia no Neguev de Israel; é uma conjetura por causa da água, não uma identificação."
  de:
    - "Bne-Jaakan, „die Söhne Jaakans“, ist eine Station der Wanderung Israels, ein nach einer Sippe benannter Lagerplatz, keine Stadt. Die Liste im Vierten Buch Mose hat es nach Moserot: „Von Moseroth zogen sie aus und lagerten sich in Bne-Jaakan. Von Bne-Jaakan zogen sie aus und lagerten sich in Horgidgad.“ Das Fünfte Buch Mose nennt den Ort Beerot der Söhne Jaakans, „Brunnen der Söhne Jaakans“, und gibt den Zug in umgekehrter Richtung, von den Brunnen nach Moser: „Daselbst starb Aaron“; die beiden Wegverzeichnisse wurden nie sicher in Einklang gebracht. Jaakan oder Akan war eine Sippe der Horiter von Seir in den Geschlechtsregistern der Genesis und der Chronik, die Brunnen lagen also im Land Edom, irgendwo auf dem Weg zwischen Kadesch und dem Berg Hor."
    - "Das ist alles, was bekannt ist. Der Name überlebt nirgends, kein antiker Autor verortet ihn, und die Stationen ringsum sind selbst nicht lokalisiert. Weil die Brunnen das einzige feste Merkmal sind, wurde el-Birein vorgeschlagen, eine Gruppe von Brunnen etwa 17 km nördlich von Ain Qudeirat, der üblichen Stätte von Kadesch-Barnea im israelischen Negev; das ist eine Vermutung aufgrund des Wassers, keine Gleichsetzung."
  fr:
    - "Bené-Jaakan, « les fils de Jaakan », est une étape des pérégrinations d’Israël, un lieu de campement nommé d’après un clan plutôt qu’une ville. La liste des Nombres la place après Moséroth : « Ils partirent de Moséroth, et campèrent à Bené-Jaakan. Ils partirent de Bené-Jaakan, et campèrent à Hor-Guidgad. » Le Deutéronome appelle le lieu « Beéroth-Bené Jaakan », « les puits des fils de Jaakan », et donne la marche en sens inverse, des puits à Moséra, « C’est là que mourut Aaron » ; les deux itinéraires n’ont jamais été conciliés avec certitude. Jaakan, ou Akan, était un clan des Horiens de Séir dans les généalogies de la Genèse et des Chroniques ; les puits se trouvaient donc en pays édomite, quelque part sur le chemin entre Qadesh et le mont Hor."
    - "C’est tout ce que l’on sait. Le nom ne survit nulle part, aucun écrivain ancien ne le situe, et les étapes alentour ne sont elles-mêmes pas localisées. Les puits étant le seul trait fixe, on a proposé el-Birein, groupe de puits à environ 17 km au nord d’Ain Qudeirat, site habituel de Kadès-Barnéa dans le Négev israélien ; c’est une conjecture fondée sur l’eau, non une identification."
  it:
    - "Bene-Iaakan, «i figli di Iaakan», è una tappa del cammino d’Israele, un luogo di sosta che prende nome da un clan piuttosto che da una città. L’elenco dei Numeri lo pone dopo Moserot: «Partirono da Moseroth e si accamparono a Bene-Jaakan. Partirono da Bene-Jaakan e si accamparono a Hor-Ghidgad». Il Deuteronomio chiama il luogo Beeròt dei figli di Iaakan, «i pozzi dei figli di Iaakan», e dà la marcia nella direzione opposta, dai pozzi a Mosera, «Quivi morì Aaronne»; i due itinerari non sono mai stati conciliati con certezza. Iaakan, o Acan, era un clan dei Corriti di Seir nelle genealogie della Genesi e delle Cronache, così i pozzi si trovavano in terra edomita, da qualche parte sulla via tra Kades e il monte Or."
    - "Questo è tutto ciò che si sa. Il nome non sopravvive da nessuna parte, nessuno scrittore antico lo colloca, e le tappe intorno sono esse stesse non localizzate. Poiché i pozzi sono l’unico elemento fisso, è stato proposto el-Birein, un gruppo di pozzi a circa 17 km a nord di Ain Qudeirat, il sito abituale di Kades-Barnea nel Negheb di Israele; è una congettura sulla base dell’acqua, non un’identificazione."
  pl:
    - "Bene-Jaakan, „synowie Jaakana”, to stacja wędrówki Izraela, miejsce obozowania nazwane od rodu, a nie miasta. Wykaz w Księdze Liczb umieszcza je po Moserot: „A ruszywszy się z Moserot, położyli się obozem w Benejaakan. A ruszywszy się z Benejaakan, położyli się obozem w Horgidgad”. Księga Powtórzonego Prawa nazywa to miejsce „Beerot synów Jahakonowych”, czyli „studnie synów Jaakana”, i podaje marsz w przeciwnym kierunku, od studni do Mosery, „gdzie umarł Aaron”; obu itinerariów nigdy z pewnością nie uzgodniono. Jaakan, czyli Akan, był rodem Choryckim z Seir w rodowodach Księgi Rodzaju i Kronik, więc studnie leżały w kraju edomskim, gdzieś w drodze między Kadesz a górą Hor."
    - "To wszystko, co wiadomo. Nazwa nie przetrwała nigdzie, żaden starożytny pisarz nie umieszcza miejsca, a stacje wokół niego same nie są zlokalizowane. Ponieważ studnie są jedynym stałym elementem, proponowano el-Birein, grupę studni około 17 km na północ od Ain Qudeirat, zwykłego miejsca Kadesz-Barnea w Negewie w Izraelu; to domysł na podstawie wody, nie utożsamienie."
  nl:
    - "Bene-Jaäkan, “de zonen van Jaäkan”, is een standplaats van Israëls omzwervingen, een kampeerplaats genoemd naar een geslacht eerder dan een stad. De lijst in Numeri heeft haar na Moserot: “En zij verreisden van Moseroth, en legerden zich in Bene-Jaakan. En zij verreisden van Bene-Jaakan, en legerden zich in Hor-Gidgad.” Deuteronomium noemt de plaats Beërot van de kinderen van Jaäkan, “de putten van de zonen van Jaäkan”, en geeft de tocht in omgekeerde richting, van de putten naar Mosera, “Aldaar stierf Aaron”; de twee reisverslagen zijn nooit met zekerheid met elkaar in overeenstemming gebracht. Jaäkan, of Akan, was een geslacht van de Choriërs van Seïr in de genealogieën van Genesis en Kronieken, dus de putten lagen in Edomitisch gebied, ergens op de weg tussen Kades en de berg Hor."
    - "Dat is alles wat bekend is. De naam leeft nergens voort, geen antieke schrijver plaatst haar, en de standplaatsen eromheen zijn zelf niet gelokaliseerd. Omdat de putten het enige vaste kenmerk zijn, is el-Birein voorgesteld, een groep putten zo’n 17 km ten noorden van Ain Qudeirat, de gebruikelijke plaats van Kades-Barnea in de Negev van Israël; het is een gissing op grond van het water, geen identificatie."
  cs:
    - "Bené-jaakan, „synové Jaakanovi“, je stanice Izraelova putování, tábořiště pojmenované spíše podle rodu než podle města. Seznam v Numeri je klade po Moserótu: „A když se hnuli z Moserot, položili se v Benejakan. A hnuvše se z Benejakan, položili se v Chor Gidgad.“ Deuteronomium nazývá místo Beerót synů Jaakanových, „studny synů Jaakanových“, a uvádí pochod opačným směrem, od studní do Moserah: „Synové pak Izraelští hnuli se z Beerot synů Jakan do Moserah. Tam umřel Aron“; oba itineráře nebyly nikdy s jistotou sladěny. Jaakan, nebo Akan, byl rod Chorejců Seíru v rodokmenech Genesis a Letopisů, takže studny ležely v edómské zemi, někde na cestě mezi Kádešem a horou Hor."
    - "To je vše, co je známo. Jméno nepřežívá nikde, žádný starověký autor je neklade a stanice kolem něj jsou samy nelokalizovány. Protože studny jsou jediným pevným rysem, byl navržen el-Birein, skupina studní asi 17 km severně od Ain Qudeirat, obvyklého místa Kádeš-barney v izraelském Negevu; je to dohad na základě vody, nikoli ztotožnění."
