# Overview article (ADR 0007). Mainstream facts only; a wilderness station known from two itineraries whose order disagrees; the identification with Birein rests on the wells and is called a guess.
id: bene-jaakan
place: a0fe2be
title:
  en: "Bene-jaakan"
  ru: "Бене-Яакан"
body:
  en:
    - "Bene-jaakan, “the sons of Jaakan”, is a station of Israel's wanderings, a camping place named after a clan rather than a town. The list in Numbers has it after Moseroth: “And they departed from Moseroth, and pitched in Bene-jaakan. And they removed from Bene-jaakan, and encamped at Hor-hagidgad”. Deuteronomy calls the place Beeroth of the children of Jaakan, “the wells of the sons of Jaakan”, and gives the march in the opposite direction, from the wells to Moserah, “there Aaron died”; the two itineraries have never been reconciled with certainty. Jaakan, or Akan, was a clan of the Horites of Seir in the genealogies of Genesis and Chronicles, so the wells lay in Edomite country, somewhere on the way between Kadesh and Mount Hor."
    - "That is all that is known. The name survives nowhere, no ancient writer places it, and the stations around it are themselves unlocated. Because the wells are the one fixed feature, el-Birein, a group of wells about 17 km north of Ain Qudeirat, the usual site of Kadesh-barnea in the Negev of Israel, has been proposed; it is a guess on the strength of the water, not an identification."
  ru:
    - "Бене-Яакан, «сыны Яакана», — стан странствий Израиля, стоянка, названная по роду, а не по городу. Список в книге Чисел ставит его после Мосерофа: «И отправились из Мосерофа и расположились станом в Бене-Яакане. И отправились из Бене-Яакана и расположились станом в Хор-Агидгаде». Второзаконие зовёт это место Беероф-Бене-Яакан, «колодцы сынов Яакана», и ведёт переход в обратную сторону, от колодцев в Мозер, где «умер Аарон»; два маршрута так и не согласованы с уверенностью. Яакан, или Акан, был родом Хорреев Сеира в родословиях Бытия и Паралипоменон, так что колодцы лежали в земле Едома, где-то на пути между Кадесом и горой Ор."
    - "Это всё, что известно. Имя нигде не сохранилось, никто из древних писателей места не указывает, и соседние станы сами не найдены. Поскольку единственная твёрдая примета — колодцы, предложили Эль-Бирейн, группу колодцев примерно в 17 км к северу от Айн-Кудейрата, обычного места Кадес-Варни в израильском Негеве; это догадка по воде, а не отождествление."
