# Overview article (ADR 0007). Mainstream facts only; a wilderness station known from two itineraries whose order disagrees; the identification with Birein rests on the wells and is called a guess.
id: bene-jaakan
place: a0fe2be
title:
  en: "Bene-jaakan"
  ru: "Бене-Яакан"
  uk: "Бене-Яакан"
  es: "Bene-jaacán"
  pt: "Bene-Jaacã"
  de: "Bne-Jaakan"
  fr: "Bené-Jaakan"
  it: "Bene-Iaakan"
  pl: "Bene-Jaakan"
  nl: "Bene-Jaäkan"
  cs: "Bené-jaakan"
  sv: "Bene-Jaakan"
  nb: "Bene-Jaakan"
  tl: "Bene-jaacan"
  da: "Bene-Ja'akan"
  sr: "Бене-Јакан"
body:
  en:
    - "Bene-jaakan, “the sons of Jaakan”, is a station of Israel's wanderings, a camping place named after a clan rather than a town. The list in Numbers has it after Moseroth: “And they departed from Moseroth, and pitched in Bene-jaakan. And they removed from Bene-jaakan, and encamped at Hor-hagidgad”. Deuteronomy calls the place Beeroth of the children of Jaakan, “the wells of the sons of Jaakan”, and gives the march in the opposite direction, from the wells to Moserah, “there Aaron died”; the two itineraries have never been reconciled with certainty. Jaakan, or Akan, was a clan of the Horites of Seir in the genealogies of Genesis and Chronicles, so the wells probably lay in or near Edomite country, perhaps on the way between Kadesh and Mount Hor."
    - "That is nearly all that is known. The name survives nowhere; Eusebius only equates the wells with the place where Aaron died, shown in his day on a mountain ten miles from Petra; and the stations around it are themselves unlocated. Because the wells are the one fixed feature, el-Birein, a group of wells about 17 km north of Ain Qudeirat, the usual site of Kadesh-barnea in the Negev of Israel, has been proposed; it is a guess on the strength of the water, not an identification."
  ru:
    - "Бене-Яакан, «сыны Яакана», — стан странствий Израиля, стоянка, названная по роду, а не по городу. Список в книге Чисел ставит его после Мосерофа: «И отправились из Мосерофа и расположились станом в Бене-Яакане. И отправились из Бене-Яакана и расположились станом в Хор-Агидгаде». Второзаконие зовёт это место Беероф-Бене-Яакан, «колодцы сынов Яакана», и ведёт переход в обратную сторону, от колодцев в Мозер, где «умер Аарон»; два маршрута так и не согласованы с уверенностью. Яакан, или Акан, был родом Хорреев Сеира в родословиях Бытия и Паралипоменон, так что колодцы, вероятно, лежали в земле Едома или близ неё, возможно, на пути между Кадесом и горой Ор."
    - "Это почти всё, что известно. Имя нигде не сохранилось; Евсевий лишь отождествляет колодцы с местом, где умер Аарон, которое в его дни показывали на горе в десяти милях от Петры; и соседние станы сами не найдены. Поскольку единственная твёрдая примета — колодцы, предложили Эль-Бирейн, группу колодцев примерно в 17 км к северу от Айн-Кудейрата, обычного места Кадес-Варни в израильском Негеве; это догадка по воде, а не отождествление."
  uk:
    - "Бене-Яакан, «сини Яакана», — стоянка мандрівки Ізраїлю, місце табору, назване за родом, а не за містом. Перелік у Числах має його після Мосерота: «І рушили з Мозерота та й отаборились у Бене-Яаканї. І рушили з Бене-Яакана та й отаборолись у Гор-Гідгадї». Второзаконня називає місце Беерот синів Яакана, «Беерот-Бне-Яакану», і подає похід у протилежному напрямку, від колодязів до Мосери: «Там умер Арон»; два маршрути ніколи не були погоджені з певністю. Яакан, або Акан, був родом хорреїв у Сеїрі в родоводах Буття і Хронік, тож колодязі, імовірно, лежали в едомському краї або поблизу нього, можливо, на шляху між Кадесом і горою Гор."
    - "Це майже все, що відомо. Назва ніде не збереглася; Євсевій лише ототожнює колодязі з місцем, де помер Аарон, яке за його днів показували на горі за десять миль від Петри; а станції навколо неї самі не локалізовані. Оскільки колодязі — єдина стала прикмета, запропоновано Ель-Бірейн, групу колодязів приблизно за 17 км на північ від Айн-Кудейрата, звичайного місця Кадеса в Негеві Ізраїлю; це здогад на підставі води, а не ототожнення."
  es:
    - "Bene-jaacán, «los hijos de Jaacán», es una estación de las peregrinaciones de Israel, un lugar de acampada que recibe el nombre de un clan más que de una ciudad. La lista de Números la pone después de Moserot: «Y partidos de Moseroth, asentaron en Bene-jaacán. Y partidos de Bene-jaacán, asentaron en el monte de Gidgad». El Deuteronomio llama al lugar Beerot de los hijos de Jaacán, «los pozos de los hijos de Jaacán», y da la marcha en sentido contrario, desde los pozos a Moserá, «allí murió Aarón»; los dos itinerarios nunca se han conciliado con certeza. Jaacán, o Acán, era un clan de los horeos de Seir en las genealogías del Génesis y de las Crónicas, de modo que los pozos se hallaban probablemente en tierra edomita o cerca de ella, quizá en el camino entre Cades y el monte Hor."
    - "Eso es casi todo lo que se sabe. El nombre no sobrevive en ninguna parte; Eusebio solo identifica los pozos con el lugar donde murió Aarón, que en su tiempo se mostraba en un monte a diez millas de Petra; y las estaciones que lo rodean no están a su vez localizadas. Como los pozos son el único rasgo fijo, se ha propuesto el-Birein, un grupo de pozos a unos 17 km al norte de Ain Qudeirat, el sitio habitual de Cades-barnea, en el Néguev de Israel; es una conjetura basada en el agua, no una identificación."
  pt:
    - "Bene-Jaacã, “os filhos de Jaacã”, é uma estação das peregrinações de Israel, um lugar de acampamento com nome de clã, e não de cidade. A lista de Números o põe depois de Moserote: “Partiram de Moserote e acamparam em Bene-Jaacã. Partiram de Bene-Jaacã e acamparam em Hor-Hagidgade”. Deuteronômio chama o lugar Beerote dos filhos de Jaacã, “os poços dos filhos de Jaacã”, e dá a marcha em sentido contrário, dos poços a Moserá, onde “Lá Arão morreu”; os dois itinerários nunca foram conciliados com certeza. Jaacã, ou Acã, era um clã dos horeus de Seir nas genealogias de Gênesis e Crônicas, de modo que os poços ficavam provavelmente em terra de Edom ou perto dela, talvez no caminho entre Cades e o monte Hor."
    - "Isso é quase tudo o que se sabe. O nome não sobrevive em lugar algum; Eusébio apenas identifica os poços com o lugar onde Arão morreu, mostrado em seu tempo num monte a dez milhas de Petra; e as estações em torno dele são elas mesmas desconhecidas. Como os poços são o único traço fixo, propôs-se el-Birein, um grupo de poços cerca de 17 km ao norte de Ain Qudeirat, o sítio habitual de Cades-Barneia no Neguev de Israel; é uma conjetura por causa da água, não uma identificação."
  de:
    - "Bne-Jaakan, „die Söhne Jaakans“, ist eine Station der Wanderung Israels, ein nach einer Sippe benannter Lagerplatz, keine Stadt. Die Liste im Vierten Buch Mose hat es nach Moserot: „Von Moseroth zogen sie aus und lagerten sich in Bne-Jaakan. Von Bne-Jaakan zogen sie aus und lagerten sich in Horgidgad.“ Das Fünfte Buch Mose nennt den Ort Beerot der Söhne Jaakans, „Brunnen der Söhne Jaakans“, und gibt den Zug in umgekehrter Richtung, von den Brunnen nach Moser: „Daselbst starb Aaron“; die beiden Wegverzeichnisse wurden nie sicher in Einklang gebracht. Jaakan oder Akan war eine Sippe der Horiter von Seir in den Geschlechtsregistern der Genesis und der Chronik, die Brunnen lagen also wohl im Land Edom oder in seiner Nähe, vielleicht auf dem Weg zwischen Kadesch und dem Berg Hor."
    - "Das ist fast alles, was bekannt ist. Der Name überlebt nirgends; Eusebius setzt die Brunnen nur mit dem Ort gleich, wo Aaron starb, der zu seiner Zeit auf einem Berg zehn Meilen von Petra gezeigt wurde; und die Stationen ringsum sind selbst nicht lokalisiert. Weil die Brunnen das einzige feste Merkmal sind, wurde el-Birein vorgeschlagen, eine Gruppe von Brunnen etwa 17 km nördlich von Ain Qudeirat, der üblichen Stätte von Kadesch-Barnea im israelischen Negev; das ist eine Vermutung aufgrund des Wassers, keine Gleichsetzung."
  fr:
    - "Bené-Jaakan, « les fils de Jaakan », est une étape des pérégrinations d’Israël, un lieu de campement nommé d’après un clan plutôt qu’une ville. La liste des Nombres la place après Moséroth : « Ils partirent de Moséroth, et campèrent à Bené-Jaakan. Ils partirent de Bené-Jaakan, et campèrent à Hor-Guidgad. » Le Deutéronome appelle le lieu « Beéroth-Bené Jaakan », « les puits des fils de Jaakan », et donne la marche en sens inverse, des puits à Moséra, « C’est là que mourut Aaron » ; les deux itinéraires n’ont jamais été conciliés avec certitude. Jaakan, ou Akan, était un clan des Horiens de Séir dans les généalogies de la Genèse et des Chroniques ; les puits se trouvaient donc probablement en pays édomite ou près de lui, peut-être sur le chemin entre Qadesh et le mont Hor."
    - "C’est presque tout ce que l’on sait. Le nom ne survit nulle part ; Eusèbe identifie seulement les puits au lieu où mourut Aaron, montré de son temps sur une montagne à dix milles de Pétra ; et les étapes alentour ne sont elles-mêmes pas localisées. Les puits étant le seul trait fixe, on a proposé el-Birein, groupe de puits à environ 17 km au nord d’Ain Qudeirat, site habituel de Kadès-Barnéa dans le Négev israélien ; c’est une conjecture fondée sur l’eau, non une identification."
  it:
    - "Bene-Iaakan, «i figli di Iaakan», è una tappa del cammino d’Israele, un luogo di sosta che prende nome da un clan piuttosto che da una città. L’elenco dei Numeri lo pone dopo Moserot: «Partirono da Moseroth e si accamparono a Bene-Jaakan. Partirono da Bene-Jaakan e si accamparono a Hor-Ghidgad». Il Deuteronomio chiama il luogo Beeròt dei figli di Iaakan, «i pozzi dei figli di Iaakan», e dà la marcia nella direzione opposta, dai pozzi a Mosera, «Quivi morì Aaronne»; i due itinerari non sono mai stati conciliati con certezza. Iaakan, o Acan, era un clan dei Corriti di Seir nelle genealogie della Genesi e delle Cronache, così i pozzi si trovavano probabilmente in terra edomita o nei suoi pressi, forse sulla via tra Kades e il monte Or."
    - "Questo è quasi tutto ciò che si sa. Il nome non sopravvive da nessuna parte; Eusebio identifica soltanto i pozzi con il luogo dove morì Aronne, mostrato ai suoi tempi su un monte a dieci miglia da Petra; e le tappe intorno sono esse stesse non localizzate. Poiché i pozzi sono l’unico elemento fisso, è stato proposto el-Birein, un gruppo di pozzi a circa 17 km a nord di Ain Qudeirat, il sito abituale di Kades-Barnea nel Negheb di Israele; è una congettura sulla base dell’acqua, non un’identificazione."
  pl:
    - "Bene-Jaakan, „synowie Jaakana”, to stacja wędrówki Izraela, miejsce obozowania nazwane od rodu, a nie miasta. Wykaz w Księdze Liczb umieszcza je po Moserot: „A ruszywszy się z Moserot, położyli się obozem w Benejaakan. A ruszywszy się z Benejaakan, położyli się obozem w Horgidgad”. Księga Powtórzonego Prawa nazywa to miejsce „Beerot synów Jahakonowych”, czyli „studnie synów Jaakana”, i podaje marsz w przeciwnym kierunku, od studni do Mosery, „gdzie umarł Aaron”; obu itinerariów nigdy z pewnością nie uzgodniono. Jaakan, czyli Akan, był rodem Choryckim z Seir w rodowodach Księgi Rodzaju i Kronik, więc studnie leżały zapewne w kraju edomskim lub w jego pobliżu, może w drodze między Kadesz a górą Hor."
    - "To prawie wszystko, co wiadomo. Nazwa nie przetrwała nigdzie; Euzebiusz jedynie utożsamia studnie z miejscem śmierci Aarona, pokazywanym w jego czasach na górze dziesięć mil od Petry; a stacje wokół niego same nie są zlokalizowane. Ponieważ studnie są jedynym stałym elementem, proponowano el-Birein, grupę studni około 17 km na północ od Ain Qudeirat, zwykłego miejsca Kadesz-Barnea w Negewie w Izraelu; to domysł na podstawie wody, nie utożsamienie."
  nl:
    - "Bene-Jaäkan, “de zonen van Jaäkan”, is een standplaats van Israëls omzwervingen, een kampeerplaats genoemd naar een geslacht eerder dan een stad. De lijst in Numeri heeft haar na Moserot: “En zij verreisden van Moseroth, en legerden zich in Bene-Jaakan. En zij verreisden van Bene-Jaakan, en legerden zich in Hor-Gidgad.” Deuteronomium noemt de plaats Beërot van de kinderen van Jaäkan, “de putten van de zonen van Jaäkan”, en geeft de tocht in omgekeerde richting, van de putten naar Mosera, “Aldaar stierf Aaron”; de twee reisverslagen zijn nooit met zekerheid met elkaar in overeenstemming gebracht. Jaäkan, of Akan, was een geslacht van de Choriërs van Seïr in de genealogieën van Genesis en Kronieken, dus de putten lagen waarschijnlijk in of bij Edomitisch gebied, misschien op de weg tussen Kades en de berg Hor."
    - "Dat is bijna alles wat bekend is. De naam leeft nergens voort; Eusebius stelt de putten alleen gelijk met de plaats waar Aäron stierf, in zijn tijd getoond op een berg tien mijl van Petra; en de standplaatsen eromheen zijn zelf niet gelokaliseerd. Omdat de putten het enige vaste kenmerk zijn, is el-Birein voorgesteld, een groep putten zo’n 17 km ten noorden van Ain Qudeirat, de gebruikelijke plaats van Kades-Barnea in de Negev van Israël; het is een gissing op grond van het water, geen identificatie."
  cs:
    - "Bené-jaakan, „synové Jaakanovi“, je stanice Izraelova putování, tábořiště pojmenované spíše podle rodu než podle města. Seznam v Numeri je klade po Moserótu: „A když se hnuli z Moserot, položili se v Benejakan. A hnuvše se z Benejakan, položili se v Chor Gidgad.“ Deuteronomium nazývá místo Beerót synů Jaakanových, „studny synů Jaakanových“, a uvádí pochod opačným směrem, od studní do Moserah: „Synové pak Izraelští hnuli se z Beerot synů Jakan do Moserah. Tam umřel Aron“; oba itineráře nebyly nikdy s jistotou sladěny. Jaakan, nebo Akan, byl rod Chorejců Seíru v rodokmenech Genesis a Letopisů, takže studny ležely nejspíš v edómské zemi nebo poblíž ní, snad na cestě mezi Kádešem a horou Hor."
    - "To je téměř vše, co je známo. Jméno nepřežívá nikde; Eusebius pouze ztotožňuje studny s místem, kde zemřel Áron, ukazovaným v jeho době na hoře deset mil od Petry; a stanice kolem něj jsou samy nelokalizovány. Protože studny jsou jediným pevným rysem, byl navržen el-Birein, skupina studní asi 17 km severně od Ain Qudeirat, obvyklého místa Kádeš-barney v izraelském Negevu; je to dohad na základě vody, nikoli ztotožnění."
  sv:
    - "Bene-Jaakan, ”Jaakans söner”, är en station på Israels vandring, en lägerplats uppkallad efter en klan snarare än en stad. Förteckningen i Fjärde Mosebok har den efter Moserot: ”Och de bröto upp från Moserot och lägrade sig i Bene-Jaakan. Och de bröto upp från Bene-Jaakan och lägrade sig i Hor-Haggidgad”. Femte Mosebok kallar platsen ”Beerot-Bene-Jaakan”, ”Jaakans söners brunnar”, och anger marschen i motsatt riktning, från brunnarna till Mosera, ”Där dog Aron”; de två vandringsförteckningarna har aldrig kunnat förenas med säkerhet. Jaakan, eller Akan, var en klan bland horéerna i Seir i släkttavlorna i Första Mosebok och Krönikeböckerna, så brunnarna låg sannolikt i eller nära edomitiskt land, kanske på vägen mellan Kadesh och berget Hor."
    - "Det är nästan allt som är känt. Namnet lever inte kvar någonstans; Eusebios likställer bara brunnarna med platsen där Aron dog, som på hans tid visades på ett berg tio romerska mil från Petra; och stationerna runt omkring är själva olokaliserade. Eftersom brunnarna är det enda fasta kännetecknet har el-Birein, en grupp brunnar omkring 17 km norr om Ajin Qudeirat, den vanliga platsen för Kadesh-Barnea i Israels Negev, föreslagits; det är en gissning på grundval av vattnet, inte en identifiering."
  nb:
    - "Bene-Jaakan, «Jaakans sønner», er en stasjon på Israels vandring, en leirplass oppkalt etter en slekt snarere enn en by. Listen i 4. Mosebok har den etter Moserot: «Og de drog fra Moserot og leiret sig i Bene-Ja'akan. Og de drog fra Bene-Ja'akan og leiret sig i Hor-Hagidgad». 5. Mosebok kaller stedet «Bene-Ja'akans brønner» og gir marsjen i motsatt retning, fra brønnene til Mosera, «der døde Aron»; de to reiserutene er aldri blitt forlikt med sikkerhet. Jaakan, eller Akan, var en slekt av horittene i Se'ir i slektsregistrene i 1. Mosebok og Krønikebøkene, så brønnene lå trolig i eller nær edomittisk land, kanskje på veien mellom Kadesj og Hor-fjellet."
    - "Det er nesten alt som er kjent. Navnet har ikke overlevd noe sted; Eusebius setter bare brønnene lik stedet der Aron døde, vist på hans tid på et fjell ti romerske mil fra Petra; og stasjonene rundt er selv ikke lokalisert. Fordi brønnene er det eneste faste trekket, er el-Birein, en gruppe brønner omtrent 17 km nord for Ajin Qudeirat, det vanlige stedet for Kadesj-Barnea i Israels Negev, foreslått; det er en gjetning ut fra vannet, ikke en identifisering."
  tl:
    - "Ang Bene-jaacan, “mga anak ni Jaacan”, ay himpilan sa paglalakbay ng Israel, isang kampamento na ipinangalan sa angkan sa halip na bayan. Inilalagay ito ng talaan sa Mga Bilang pagkatapos ng Moseroth: “At sila'y naglakbay mula sa Moseroth, at humantong sa Bene-jaacan. At sila'y naglakbay mula sa Bene-jaacan, at humantong sa Horhagidgad”. Tinatawag ng Deuteronomio ang lugar na Beeroth ng mga anak ni Jaacan, “mga balon ng mga anak ni Jaacan”, at ibinibigay ang martsa sa kabaligtarang direksiyon, mula sa mga balon hanggang sa Mosera, “doon namatay si Aaron”; hindi pa kailanman napagkasundo nang tiyak ang dalawang talaan. Ang Jaacan, o Acan, ay angkan ng mga Horeo ng Seir sa mga talaan ng lahi ng Genesis at Mga Cronica, kaya ang mga balon ay marahil nasa o malapit sa lupain ng Edom, marahil sa daan sa pagitan ng Cades at Bundok Hor."
    - "Iyon na halos ang lahat ng alam. Wala nang pangalang natitira saanman; itinutumbas lamang ni Eusebio ang mga balon sa lugar kung saan namatay si Aaron, na ipinakikita noon sa isang bundok sampung milya mula sa Petra; at ang mga himpilan sa palibot nito ay hindi rin natutukoy. Yamang ang mga balon ang tanging tiyak na katangian, iminungkahi ang el-Birein, grupo ng mga balon mga 17 km sa hilaga ng Ain Qudeirat, ang karaniwang lugar ng Cades-barnea sa Negev ng Israel; hula ito batay sa tubig, hindi pagkakakilanlan."
  da:
    - "Bene-Ja'akan, »Ja'akans sønner«, er en station på Israels vandring, en lejrplads opkaldt efter en klan snarere end en by. Listen i 4 Mosebog har den efter Moserot: »Og de rejste fra Moseroth, og de lejrede sig i Bne-Jaakan. Og de rejste fra Bne-Jaakan, og de lejrede sig i Horhagidgad«. Femte Mosebog kalder stedet Be'erot-Bene-Ja'akan, »Ja'akans sønners brønde«, og giver marchen i modsat retning, fra brøndene til Mosera, »der døde Aron«; de to rejseberetninger er aldrig blevet forenet med sikkerhed. Ja'akan, eller Akan, var en klan af horitterne i Se'ir i slægtsregistrene i Første Mosebog og Krønikebøgerne, så brøndene lå sandsynligvis i eller nær edomitisk land, måske på vejen mellem Kadesj og Hor-bjerget."
    - "Det er næsten alt, hvad der vides. Navnet lever ingen steder; Eusebius ligestiller kun brøndene med stedet, hvor Aron døde, vist i hans dage på et bjerg ti romerske mil fra Petra; og stationerne omkring den er selv ikke lokaliseret. Fordi brøndene er det ene faste træk, er el-Birein, en gruppe brønde omkring 17 km nord for Ain Qudeirat, det sædvanlige sted for Kadesj-Barnea i Israels Negev, blevet foreslået; det er et gæt på grund af vandet, ikke en identifikation."
  sr:
    - "Бене-Јакан, „синови Јаканови“, станица је Израиљевог лутања, логор названи по роду пре него по граду. Списак у Књизи Бројева ставља га после Мосирота: „А из Мосирота отишавши стадоше у логор у Ванакану. А из Ванакана отишавши стадоше у логор на планини Гададу“. Поновљени закон зове то место Вироте синова Јаканових, „студенци синова Јаканових“, и даје марш у супротном смеру, од студенаца до Мосере, „Онде умре Арон“; два путописа никада нису поуздано усаглашена. Јакан, или Акан, био је род Хореја са Сира у родословима Постања и Летописа, па су студенци вероватно лежали у едомској земљи или близу ње, можда на путу између Кадиса и горе Ор."
    - "То је скоро све што се зна. Име нигде није сачувано; Јевсевије само изједначује студенце с местом где је умро Арон, у његово доба показиваном на планини десет миља од Петре; а станице око њега и саме су непознате. Пошто су студенци једина утврђена одлика, предложен је ел-Биреин, група студенаца око 17 км северно од Аин Кудејрата, уобичајеног налазишта Кадис-Варније у Негеву Израела; то је претпоставка на основу воде, а не поистовећивање."
