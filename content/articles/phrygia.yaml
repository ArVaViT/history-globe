# Overview article (ADR 0007). Mainstream facts only; the meaning of “Phrygia” in Acts 16:6 and 18:23 is named as part of the Galatian debate; Phrygian dates follow the Assyrian records and Eusebius' chronicle as usually read.
id: phrygia
place: ab8ae56
title:
  en: "Phrygia"
  ru: "Фригия"
  uk: "Фрігія"
  es: "Frigia"
  pt: "Frígia"
  de: "Phrygien"
  fr: "Phrygie"
body:
  en:
    - "Phrygia is the high plateau of west-central Asia Minor around the upper Sangarius and the headwaters of the Maeander, a cold, open country of sheep and wool. Its people, Herodotus says, had crossed from Macedonia, where they were called Briges. The Phrygian kingdom flourished in the eighth century BC with its capital at Gordion, where the Midas of legend, the Mita of Sargon's records, reigned until the Cimmerians overran the land about 700 BC. Lydia and then Persia ruled it; then it passed between the Seleucids and the kings of Pergamum, and in 133 BC to Rome, within the province of Asia, while its eastern part was later joined to Galatia. Antiochus III settled two thousand Jewish families from Babylonia in Lydia and Phrygia, the beginning of its large Jewish communities, and the cult of the Great Mother at Pessinus, carried to Rome in 204 BC, was Phrygia's gift to the Roman world."
    - "Jews from Phrygia heard the apostles at Pentecost. On his second journey Paul passed “throughout Phrygia and the region of Galatia”, and on the third “went over all the country of Galatia and Phrygia in order, strengthening all the disciples”; whether Luke means Phrygia proper or the Phrygian part of the province of Galatia, with Antioch of Pisidia and Iconium, is part of the long debate over the Galatians. In the Lycus valley of south-western Phrygia stood Colossae, Laodicea and Hierapolis, the churches that Epaphras served, and Paul wrote to the first of them and sent greetings to the others."
    - "Phrygia became one of the most Christian regions of the empire. Papias was bishop of Hierapolis, and the apostle Philip was said to be buried there; about 170 Montanus began in Phrygia the prophetic movement the church called the Phrygian heresy; and tombstones of the third century in the upper Tembris valley bear the open words “Christians for Christians”, the earliest such confessions in stone. The plateau is today the Turkish provinces of Afyonkarahisar, Kütahya and Eskişehir and the west of Ankara province, with Gordion, inscribed by UNESCO in 2023, and the rock monuments of the Phrygian highlands near Midas city; Hierapolis stands above the white terraces of Pamukkale."
  ru:
    - "Фригия — высокое плоскогорье в центре западной Малой Азии вокруг верхнего Сангария и истоков Меандра, холодная открытая страна овец и шерсти. Её народ, по словам Геродота, перешёл из Македонии, где звался бригами. Фригийское царство процветало в VIII веке до н. э. со столицей в Гордионе, где Мидас преданий, Мита ассирийских записей Саргона, правил, пока около 700 г. до н. э. страну не наводнили киммерийцы. Ею владели Лидия, затем Персия; потом она переходила от Селевкидов к царям Пергама, а в 133 г. до н. э. отошла к Риму в составе провинции Асия, восточная же её часть позднее была присоединена к Галатии. Антиох III поселил в Лидии и Фригии две тысячи иудейских семей из Вавилонии — начало её больших иудейских общин, а культ Великой Матери из Пессинунта, перенесённый в Рим в 204 г. до н. э., стал даром Фригии римскому миру."
    - "Иудеи из Фригии слышали апостолов в день Пятидесятницы. Павел во втором путешествии прошёл «через Фригию и Галатийскую страну», а в третьем «проходил по порядку страну Галатийскую и Фригию, утверждая всех учеников»; имеет ли Лука в виду собственно Фригию или фригийскую часть провинции Галатия с Антиохией Писидийской и Иконией — часть давнего спора о галатах. В долине Лика на юго-западе Фригии стояли Колоссы, Лаодикия и Иераполь, церкви, которым служил Епафрас; первой из них Павел написал послание, а другим передал приветы."
    - "Фригия стала одной из самых христианских областей империи. Папий был епископом Иераполя, и там, по преданию, погребён апостол Филипп; около 170 года Монтан начал во Фригии пророческое движение, которое церковь назвала фригийской ересью; а надгробия III века в верхней долине Тембриса несут открытые слова «христиане христианам» — древнейшие такие исповедания в камне. Плоскогорье сегодня — турецкие провинции Афьонкарахисар, Кютахья и Эскишехир и запад провинции Анкара, с Гордионом, внесённым в список ЮНЕСКО в 2023 году, и скальными памятниками Фригийского нагорья у города Мидаса; Иераполь стоит над белыми террасами Памуккале."
  uk:
    - "Фрігія — високе плато в західній частині центральної Малої Азії довкола верхів’їв Сангарія та витоків Меандра, холодний відкритий край овець і вовни. Її народ, за словами Геродота, прийшов із Македонії, де називався бригами. Фрігійське царство розквітло у VIII ст. до н. е. зі столицею в Гордіоні, де царював легендарний Мідас, Міта із записів Саргона, доки близько 700 р. до н. е. країну не заполонили кіммерійці. Нею правили Лідія, а потім Персія; потім вона переходила між Селевкідами й царями Пергама, а 133 р. до н. е. дісталася Риму у складі провінції Азія, тоді як її східну частину пізніше приєднали до Галатії. Антіох III оселив дві тисячі єврейських родин із Вавилонії в Лідії та Фрігії, що поклало початок її численним єврейським громадам, а культ Великої Матері в Пессінунті, перенесений до Риму 204 р. до н. е., став даром Фрігії римському світові."
    - "Юдеї з Фрігії чули апостолів у день П’ятдесятниці. У другій подорожі Павло пройшов «Фригию та Галацьку сторону», а в третій — «проходячи рядом Галацьку сторону та Фригию, і утверджуючи всїх учеників»; чи має Лука на увазі власне Фрігію, чи фрігійську частину провінції Галатії, з Антіохією Пісідійською та Іконією, — частина довгої суперечки про галатів. У долині Ліка на південному заході Фрігії стояли Колоси, Лаодікея та Ієраполіс, церкви, яким служив Епафрас; до першої з них Павло написав листа, а іншим передав вітання."
    - "Фрігія стала одним із найхристиянськіших регіонів імперії. Папій був єпископом Ієраполіса, і там, як казали, був похований апостол Пилип; близько 170 р. Монтан започаткував у Фрігії пророчий рух, який церква назвала фрігійською єрессю; а надгробки III ст. у верхній долині Тембріса несуть відверті слова «Християни для християн» — найдавніші такі сповідання в камені. Плато сьогодні — це турецькі провінції Афьонкарагісар, Кютахья та Ескішехір і захід провінції Анкара, з Гордіоном, внесеним ЮНЕСКО 2023 р., і скельними пам’ятками фрігійського нагір’я поблизу міста Мідаса; Ієраполіс стоїть над білими терасами Памуккале."
  es:
    - "Frigia es la alta meseta del centro-oeste de Asia Menor en torno al alto Sangario y las fuentes del Meandro, un país frío y abierto de ovejas y lana. Su pueblo, dice Heródoto, había cruzado desde Macedonia, donde se llamaban briges. El reino frigio floreció en el siglo VIII a. C. con su capital en Gordion, donde reinó el Midas de la leyenda, el Mita de los registros de Sargón, hasta que los cimerios invadieron el país hacia 700 a. C. Lo gobernaron Lidia y luego Persia; después pasó entre los seléucidas y los reyes de Pérgamo, y en 133 a. C. a Roma, dentro de la provincia de Asia, mientras que su parte oriental se unió más tarde a Galacia. Antíoco III asentó dos mil familias judías de Babilonia en Lidia y Frigia, el comienzo de sus grandes comunidades judías, y el culto de la Gran Madre en Pesinunte, llevado a Roma en 204 a. C., fue el regalo de Frigia al mundo romano."
    - "Judíos de Frigia oyeron a los apóstoles en Pentecostés. En su segundo viaje Pablo atravesó el país, «pasando á Phrygia y la provincia de Galacia», y en el tercero, «andando por orden la provincia de Galacia, y la Phrygia, confirmando á todos los discípulos»; si Lucas se refiere a la Frigia propiamente dicha o a la parte frigia de la provincia de Galacia, con Antioquía de Pisidia e Iconio, forma parte del largo debate sobre los gálatas. En el valle del Lico, en el suroeste de Frigia, estaban Colosas, Laodicea y Hierápolis, las iglesias que atendió Epafras, y Pablo escribió a la primera de ellas y envió saludos a las otras."
    - "Frigia llegó a ser una de las regiones más cristianas del imperio. Papías fue obispo de Hierápolis, y se decía que el apóstol Felipe estaba sepultado allí; hacia 170 Montano inició en Frigia el movimiento profético que la Iglesia llamó la herejía frigia; y lápidas del siglo III en el valle del alto Tembris llevan las palabras abiertas «cristianos para cristianos», las más antiguas confesiones de este tipo en piedra. La meseta corresponde hoy a las provincias turcas de Afyonkarahisar, Kütahya y Eskişehir y al oeste de la provincia de Ankara, con Gordion, inscrita por la UNESCO en 2023, y los monumentos rupestres de las tierras altas frigias cerca de la ciudad de Midas; Hierápolis se alza sobre las terrazas blancas de Pamukkale."
  pt:
    - "A Frígia é o alto planalto do centro-oeste da Ásia Menor, em torno do alto Sangário e das nascentes do Meandro, país frio e aberto de ovelhas e lã. Seu povo, diz Heródoto, passara da Macedônia, onde se chamava briges. O reino frígio floresceu no século VIII a.C. com capital em Gordion, onde reinou o Midas da lenda, o Mita dos registros de Sargão, até que os cimérios invadiram a terra por volta de 700 a.C. A Lídia e depois a Pérsia a dominaram; passou então entre os selêucidas e os reis de Pérgamo e, em 133 a.C., a Roma, na província da Ásia, enquanto sua parte oriental foi depois unida à Galácia. Antíoco III instalou duas mil famílias judias da Babilônia na Lídia e na Frígia, início de suas grandes comunidades judaicas, e o culto da Grande Mãe em Pessino, levado a Roma em 204 a.C., foi a dádiva da Frígia ao mundo romano."
    - "Judeus da Frígia ouviram os apóstolos no Pentecostes. Na segunda viagem, Paulo passou pela “região da Frígia e da Galácia”, e na terceira “percorreu sucessivamente a região da Galácia e da Frígia, fortalecendo todos os discípulos”; se Lucas se refere à Frígia propriamente dita ou à parte frígia da província da Galácia, com Antioquia da Pisídia e Icônio, é parte do longo debate sobre os gálatas. No vale do Lico, no sudoeste da Frígia, ficavam Colossos, Laodiceia e Hierápolis, as igrejas que Epafras serviu, e Paulo escreveu à primeira delas e mandou saudações às outras."
    - "A Frígia tornou-se uma das regiões mais cristãs do império. Papias foi bispo de Hierápolis, e dizia-se que o apóstolo Filipe estava sepultado ali; por volta de 170 Montano iniciou na Frígia o movimento profético que a igreja chamou de heresia frígia; e lápides do século III no alto vale do Tembris trazem a franca declaração “cristãos para cristãos”, as mais antigas confissões desse tipo em pedra. O planalto é hoje as províncias turcas de Afyonkarahisar, Kütahya e Eskişehir e o oeste da província de Ancara, com Gordion, inscrita pela UNESCO em 2023, e os monumentos rupestres das terras altas frígias perto da Cidade de Midas; Hierápolis fica acima dos terraços brancos de Pamukkale."
  de:
    - "Phrygien ist die Hochebene im westlichen Zentralkleinasien um den oberen Sangarios und die Quellflüsse des Mäander, ein kaltes, offenes Schaf- und Wolleland. Sein Volk, sagt Herodot, war aus Mazedonien herübergekommen, wo es Briger hieß. Das phrygische Königreich blühte im 8. Jahrhundert v. Chr. mit der Hauptstadt Gordion, wo der sagenhafte Midas, Sargons Mita, herrschte, bis die Kimmerier um 700 v. Chr. das Land überrannten. Es kam unter Lydien und Persien, wechselte zwischen den Seleukiden und den Königen von Pergamon und fiel 133 v. Chr. an Rom, in die Provinz Asia; sein Ostteil wurde später Galatien angegliedert. Antiochos III. siedelte zweitausend jüdische Familien aus Babylonien in Lydien und Phrygien an, Anfang seiner großen jüdischen Gemeinden; der Kult der Großen Mutter von Pessinus, 204 v. Chr. nach Rom gebracht, war Phrygiens Geschenk an die römische Welt."
    - "Juden aus Phrygien hörten die Apostel zu Pfingsten. Auf seiner zweiten Reise zog Paulus „durch Phrygien und das Land Galatien“, und auf der dritten „durchwandelte“ er „nacheinander das galatische Land und Phrygien und stärkte alle Jünger“; ob Lukas das eigentliche Phrygien meint oder den phrygischen Teil der Provinz Galatien mit Antiochia in Pisidien und Ikonion, gehört zur langen Debatte um die Galater. Im Lykostal im Südwesten Phrygiens lagen Kolossae, Laodizea und Hierapolis, die Gemeinden, denen Epaphras diente; Paulus schrieb an die erste und sandte den anderen Grüße."
    - "Phrygien wurde eine der christlichsten Gegenden des Reiches. Papias war Bischof von Hierapolis, und der Apostel Philippus soll dort begraben sein; um 170 begann Montanus in Phrygien die prophetische Bewegung, die die Kirche die phrygische Häresie nannte; und Grabsteine des 3. Jahrhunderts im oberen Tembristal tragen offen die Worte „Christen für Christen“, die frühesten solchen Bekenntnisse in Stein. Die Hochebene gehört heute zu den türkischen Provinzen Afyonkarahisar, Kütahya und Eskişehir und zum Westen der Provinz Ankara, mit Gordion, 2023 von der UNESCO eingetragen, und den Felsmonumenten des phrygischen Hochlands bei Midas-Stadt; Hierapolis liegt über den weißen Terrassen von Pamukkale."
  fr:
    - "La Phrygie est le haut plateau du centre-ouest de l’Asie Mineure autour du haut Sangarios et des sources du Méandre, pays froid et ouvert de moutons et de laine. Son peuple, dit Hérodote, venait de Macédoine, où on l’appelait Briges. Le royaume phrygien prospéra au VIIIe siècle av. J.-C. avec sa capitale à Gordion, où régna le Midas de la légende, le Mita des annales de Sargon, jusqu’à l’invasion des Cimmériens vers 700 av. J.-C. La Lydie puis la Perse la dominèrent ; elle passa ensuite entre les Séleucides et les rois de Pergame, et en 133 av. J.-C. à Rome, dans la province d’Asie, sa partie orientale étant plus tard jointe à la Galatie. Antiochos III installa deux mille familles juives de Babylonie en Lydie et en Phrygie, début de ses grandes communautés juives, et le culte de la Grande Mère de Pessinonte, porté à Rome en 204 av. J.-C., fut son don au monde romain."
    - "Des Juifs de Phrygie entendirent les apôtres à la Pentecôte. Lors de son deuxième voyage, Paul et ses compagnons « traversèrent la Phrygie et le pays de Galatie », et lors du troisième « parcourut successivement la Galatie et la Phrygie, fortifiant tous les disciples » ; que Luc entende la Phrygie proprement dite ou la partie phrygienne de la province de Galatie, avec Antioche de Pisidie et Icone, relève du long débat sur les Galates. Dans la vallée du Lycos, au sud-ouest de la Phrygie, se trouvaient Colosses, Laodicée et Hiérapolis, les Églises que servit Épaphras ; Paul écrivit à la première et envoya ses salutations aux autres."
    - "La Phrygie devint l’une des régions les plus chrétiennes de l’empire. Papias fut évêque de Hiérapolis, et l’apôtre Philippe y aurait été enterré ; vers 170, Montan fonda en Phrygie le mouvement prophétique que l’Église appela l’hérésie phrygienne ; et des pierres tombales du IIIe siècle dans la haute vallée du Tembris portent ouvertement les mots « Chrétiens pour chrétiens », les plus anciennes confessions de ce genre sur la pierre. Le plateau forme aujourd’hui les provinces turques d’Afyonkarahisar, de Kütahya et d’Eskişehir et l’ouest de la province d’Ankara, avec Gordion, inscrite par l’UNESCO en 2023, et les monuments rupestres des hautes terres phrygiennes près de la ville de Midas ; Hiérapolis se dresse au-dessus des terrasses blanches de Pamukkale."
