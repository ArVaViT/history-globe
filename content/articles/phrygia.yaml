body:
  en:
    - "Phrygia is the high plateau of west-central Asia Minor around the upper Sangarius and the headwaters of the Maeander, a cold, open country of sheep and wool. Its people, Herodotus reports on the word of the Macedonians, had once lived beside them in Europe, where they were called Briges. The Phrygian kingdom flourished in the eighth century BC with its capital at Gordion, where the Midas of legend, the Mita of Sargon's records, reigned until, in Greek tradition, the Cimmerians overran the land about 700 BC. Lydia and then Persia ruled it; then it passed between the Seleucids and the kings of Pergamum, and after the last king of Pergamum left his kingdom to Rome in 133 BC it was given for a time to the king of Pontus before it was joined to the province of Asia, while its eastern part was later joined to Galatia."
    - "Antiochus III settled two thousand Jewish families from Babylonia in Lydia and Phrygia, the beginning of its large Jewish communities, and the cult of the Great Mother at Pessinus, carried to Rome in 204 BC, was Phrygia's gift to the Roman world. Jews from Phrygia heard the apostles at Pentecost. On his second journey Paul passed “throughout Phrygia and the region of Galatia”, and on the third “went over all the country of Galatia and Phrygia in order, strengthening all the disciples”; whether Luke means Phrygia proper or the Phrygian part of the province of Galatia, with Antioch of Pisidia and Iconium, is part of the long debate over the Galatians. In the Lycus valley of south-western Phrygia stood Colossae, Laodicea and Hierapolis, the churches that Epaphras served, and Paul wrote to the first of them and sent greetings to the church in Laodicea."
    - "Phrygia became one of the most Christian regions of the empire. Papias was bishop of Hierapolis, and the apostle Philip was said to be buried there; about 170 Montanus began, on the borders of Phrygia, the prophetic movement the church called the Phrygian heresy; and tombstones of the third and early fourth centuries in the upper Tembris valley bear the open words “Christians for Christians”, among the earliest such confessions in stone. The plateau is today the Turkish provinces of Afyonkarahisar, Kütahya and Eskişehir and the west of Ankara province, with Gordion, inscribed by UNESCO in 2023, and the rock monuments of the Phrygian highlands near Midas city; Hierapolis stands above the white terraces of Pamukkale."
  ru:
    - "Фригия — высокое плоскогорье в центре западной Малой Азии вокруг верхнего Сангария и истоков Меандра, холодная открытая страна овец и шерсти. Её народ, как сообщает Геродот со слов македонян, некогда жил по соседству с ними в Европе, где звался бригами. Фригийское царство процветало в VIII веке до н. э. со столицей в Гордионе, где Мидас преданий, Мита ассирийских записей Саргона, правил, пока, по греческому преданию, около 700 г. до н. э. страну не наводнили киммерийцы. Ею владели Лидия, затем Персия; потом она переходила от Селевкидов к царям Пергама, а после того как последний царь Пергама в 133 г. до н. э. завещал своё царство Риму, она на время была отдана царю Понта, прежде чем её присоединили к провинции Асия, восточная же её часть позднее была присоединена к Галатии."
    - "Антиох III поселил в Лидии и Фригии две тысячи иудейских семей из Вавилонии — начало её больших иудейских общин, а культ Великой Матери из Пессинунта, перенесённый в Рим в 204 г. до н. э., стал даром Фригии римскому миру. Иудеи из Фригии слышали апостолов в день Пятидесятницы. Павел во втором путешествии прошёл «через Фригию и Галатийскую страну», а в третьем «проходил по порядку страну Галатийскую и Фригию, утверждая всех учеников»; имеет ли Лука в виду собственно Фригию или фригийскую часть провинции Галатия с Антиохией Писидийской и Иконией — часть давнего спора о галатах. В долине Лика на юго-западе Фригии стояли Колоссы, Лаодикия и Иераполь, церкви, которым служил Епафрас; первой из них Павел написал послание, а церкви в Лаодикии передал приветы."
    - "Фригия стала одной из самых христианских областей империи. Папий был епископом Иераполя, и там, по преданию, погребён апостол Филипп; около 170 года Монтан начал на границах Фригии пророческое движение, которое церковь назвала фригийской ересью; а надгробия III и начала IV века в верхней долине Тембриса несут открытые слова «христиане христианам» — одни из древнейших таких исповеданий в камне. Плоскогорье сегодня — турецкие провинции Афьонкарахисар, Кютахья и Эскишехир и запад провинции Анкара, с Гордионом, внесённым в список ЮНЕСКО в 2023 году, и скальными памятниками Фригийского нагорья у города Мидаса; Иераполь стоит над белыми террасами Памуккале."
  uk:
    - "Фрігія — високе плато в західній частині центральної Малої Азії довкола верхів’їв Сангарія та витоків Меандра, холодний відкритий край овець і вовни. Її народ, як переказує Геродот зі слів македонян, колись жив поруч із ними в Європі, де називався бригами. Фрігійське царство розквітло у VIII ст. до н. е. зі столицею в Гордіоні, де царював легендарний Мідас, Міта із записів Саргона, доки, за грецьким переказом, близько 700 р. до н. е. країну не заполонили кіммерійці. Нею правили Лідія, а потім Персія; потім вона переходила між Селевкідами й царями Пергама, а після того як останній цар Пергама 133 р. до н. е. заповів своє царство Риму, її на якийсь час віддали понтійському цареві, перш ніж приєднати до провінції Азія, тоді як її східну частину пізніше приєднали до Галатії."
    - "Антіох III оселив дві тисячі єврейських родин із Вавилонії в Лідії та Фрігії, що поклало початок її численним єврейським громадам, а культ Великої Матері в Пессінунті, перенесений до Риму 204 р. до н. е., став даром Фрігії римському світові. Юдеї з Фрігії чули апостолів у день П’ятдесятниці. У другій подорожі Павло пройшов «Фригию та Галацьку сторону», а в третій — «проходячи рядом Галацьку сторону та Фригию, і утверджуючи всїх учеників»; чи має Лука на увазі власне Фрігію, чи фрігійську частину провінції Галатії, з Антіохією Пісідійською та Іконією, — частина довгої суперечки про галатів. У долині Ліка на південному заході Фрігії стояли Колоси, Лаодікея та Ієраполіс, церкви, яким служив Епафрас; до першої з них Павло написав листа, а церкві в Лаодікеї передав вітання."
    - "Фрігія стала одним із найхристиянськіших регіонів імперії. Папій був єпископом Ієраполіса, і там, як казали, був похований апостол Пилип; близько 170 р. Монтан започаткував на межі Фрігії пророчий рух, який церква назвала фрігійською єрессю; а надгробки III і початку IV ст. у верхній долині Тембріса несуть відверті слова «Християни для християн» — одні з найдавніших таких сповідань у камені. Плато сьогодні — це турецькі провінції Афьонкарагісар, Кютахья та Ескішехір і захід провінції Анкара, з Гордіоном, внесеним ЮНЕСКО 2023 р., і скельними пам’ятками фрігійського нагір’я поблизу міста Мідаса; Ієраполіс стоїть над білими терасами Памуккале."
  es:
    - "Frigia es la alta meseta del centro-oeste de Asia Menor en torno al alto Sangario y las fuentes del Meandro, un país frío y abierto de ovejas y lana. Su pueblo, según refiere Heródoto de boca de los macedonios, había vivido antes junto a ellos en Europa, donde se llamaban briges. El reino frigio floreció en el siglo VIII a. C. con su capital en Gordion, donde reinó el Midas de la leyenda, el Mita de los registros de Sargón, hasta que, según la tradición griega, los cimerios invadieron el país hacia 700 a. C. Lo gobernaron Lidia y luego Persia; después pasó entre los seléucidas y los reyes de Pérgamo, y, después de que el último rey de Pérgamo legara su reino a Roma en 133 a. C., fue dada por un tiempo al rey del Ponto antes de unirse a la provincia de Asia, mientras que su parte oriental se unió más tarde a Galacia."
    - "Antíoco III asentó dos mil familias judías de Babilonia en Lidia y Frigia, el comienzo de sus grandes comunidades judías, y el culto de la Gran Madre en Pesinunte, llevado a Roma en 204 a. C., fue el regalo de Frigia al mundo romano. Judíos de Frigia oyeron a los apóstoles en Pentecostés. En su segundo viaje Pablo atravesó el país, «pasando á Phrygia y la provincia de Galacia», y en el tercero, «andando por orden la provincia de Galacia, y la Phrygia, confirmando á todos los discípulos»; si Lucas se refiere a la Frigia propiamente dicha o a la parte frigia de la provincia de Galacia, con Antioquía de Pisidia e Iconio, forma parte del largo debate sobre los gálatas. En el valle del Lico, en el suroeste de Frigia, estaban Colosas, Laodicea y Hierápolis, las iglesias que atendió Epafras, y Pablo escribió a la primera de ellas y envió saludos a la iglesia de Laodicea."
    - "Frigia llegó a ser una de las regiones más cristianas del imperio. Papías fue obispo de Hierápolis, y se decía que el apóstol Felipe estaba sepultado allí; hacia 170 Montano inició, en los confines de Frigia, el movimiento profético que la Iglesia llamó la herejía frigia; y lápidas del siglo III y de comienzos del IV en el valle del alto Tembris llevan las palabras abiertas «cristianos para cristianos», entre las más antiguas confesiones de este tipo en piedra. La meseta corresponde hoy a las provincias turcas de Afyonkarahisar, Kütahya y Eskişehir y al oeste de la provincia de Ankara, con Gordion, inscrita por la UNESCO en 2023, y los monumentos rupestres de las tierras altas frigias cerca de la ciudad de Midas; Hierápolis se alza sobre las terrazas blancas de Pamukkale."
  pt:
    - "A Frígia é o alto planalto do centro-oeste da Ásia Menor, em torno do alto Sangário e das nascentes do Meandro, país frio e aberto de ovelhas e lã. Seu povo, relata Heródoto segundo os macedônios, vivera outrora ao lado deles na Europa, onde se chamava briges. O reino frígio floresceu no século VIII a.C. com capital em Gordion, onde reinou o Midas da lenda, o Mita dos registros de Sargão, até que, segundo a tradição grega, os cimérios invadiram a terra por volta de 700 a.C. A Lídia e depois a Pérsia a dominaram; passou então entre os selêucidas e os reis de Pérgamo e, depois que o último rei de Pérgamo legou seu reino a Roma em 133 a.C., foi dada por um tempo ao rei do Ponto antes de ser unida à província da Ásia, enquanto sua parte oriental foi depois unida à Galácia."
    - "Antíoco III instalou duas mil famílias judias da Babilônia na Lídia e na Frígia, início de suas grandes comunidades judaicas, e o culto da Grande Mãe em Pessino, levado a Roma em 204 a.C., foi a dádiva da Frígia ao mundo romano. Judeus da Frígia ouviram os apóstolos no Pentecostes. Na segunda viagem, Paulo passou pela “região da Frígia e da Galácia”, e na terceira “percorreu sucessivamente a região da Galácia e da Frígia, fortalecendo todos os discípulos”; se Lucas se refere à Frígia propriamente dita ou à parte frígia da província da Galácia, com Antioquia da Pisídia e Icônio, é parte do longo debate sobre os gálatas. No vale do Lico, no sudoeste da Frígia, ficavam Colossos, Laodiceia e Hierápolis, as igrejas que Epafras serviu, e Paulo escreveu à primeira delas e mandou saudações à igreja de Laodiceia."
    - "A Frígia tornou-se uma das regiões mais cristãs do império. Papias foi bispo de Hierápolis, e dizia-se que o apóstolo Filipe estava sepultado ali; por volta de 170 Montano iniciou, nos confins da Frígia, o movimento profético que a igreja chamou de heresia frígia; e lápides do século III e do início do IV no alto vale do Tembris trazem a franca declaração “cristãos para cristãos”, entre as mais antigas confissões desse tipo em pedra. O planalto é hoje as províncias turcas de Afyonkarahisar, Kütahya e Eskişehir e o oeste da província de Ancara, com Gordion, inscrita pela UNESCO em 2023, e os monumentos rupestres das terras altas frígias perto da Cidade de Midas; Hierápolis fica acima dos terraços brancos de Pamukkale."
  de:
    - "Phrygien ist die Hochebene im westlichen Zentralkleinasien um den oberen Sangarios und die Quellflüsse des Mäander, ein kaltes, offenes Schaf- und Wolleland. Sein Volk hatte, wie Herodot nach Aussage der Mazedonier berichtet, einst neben ihnen in Europa gewohnt, wo es Briger hieß. Das phrygische Königreich blühte im 8. Jahrhundert v. Chr. mit der Hauptstadt Gordion, wo der sagenhafte Midas, Sargons Mita, herrschte, bis nach griechischer Überlieferung die Kimmerier um 700 v. Chr. das Land überrannten. Es kam unter Lydien und Persien, wechselte zwischen den Seleukiden und den Königen von Pergamon und wurde, nachdem der letzte König von Pergamon 133 v. Chr. sein Reich Rom vermacht hatte, eine Zeit lang dem König von Pontos gegeben, ehe es der Provinz Asia angeschlossen wurde; sein Ostteil wurde später Galatien angegliedert."
    - "Antiochos III. siedelte zweitausend jüdische Familien aus Babylonien in Lydien und Phrygien an, Anfang seiner großen jüdischen Gemeinden; der Kult der Großen Mutter von Pessinus, 204 v. Chr. nach Rom gebracht, war Phrygiens Geschenk an die römische Welt. Juden aus Phrygien hörten die Apostel zu Pfingsten. Auf seiner zweiten Reise zog Paulus „durch Phrygien und das Land Galatien“, und auf der dritten „durchwandelte“ er „nacheinander das galatische Land und Phrygien und stärkte alle Jünger“; ob Lukas das eigentliche Phrygien meint oder den phrygischen Teil der Provinz Galatien mit Antiochia in Pisidien und Ikonion, gehört zur langen Debatte um die Galater. Im Lykostal im Südwesten Phrygiens lagen Kolossae, Laodizea und Hierapolis, die Gemeinden, denen Epaphras diente; Paulus schrieb an die erste und sandte der Gemeinde in Laodizea Grüße."
    - "Phrygien wurde eine der christlichsten Gegenden des Reiches. Papias war Bischof von Hierapolis, und der Apostel Philippus soll dort begraben sein; um 170 begann Montanus an der Grenze Phrygiens die prophetische Bewegung, die die Kirche die phrygische Häresie nannte; und Grabsteine des 3. und frühen 4. Jahrhunderts im oberen Tembristal tragen offen die Worte „Christen für Christen“, unter den frühesten solchen Bekenntnissen in Stein. Die Hochebene gehört heute zu den türkischen Provinzen Afyonkarahisar, Kütahya und Eskişehir und zum Westen der Provinz Ankara, mit Gordion, 2023 von der UNESCO eingetragen, und den Felsmonumenten des phrygischen Hochlands bei Midas-Stadt; Hierapolis liegt über den weißen Terrassen von Pamukkale."
  fr:
    - "La Phrygie est le haut plateau du centre-ouest de l’Asie Mineure autour du haut Sangarios et des sources du Méandre, pays froid et ouvert de moutons et de laine. Son peuple, rapporte Hérodote d’après les Macédoniens, avait jadis vécu à leurs côtés en Europe, où on l’appelait Briges. Le royaume phrygien prospéra au VIIIe siècle av. J.-C. avec sa capitale à Gordion, où régna le Midas de la légende, le Mita des annales de Sargon, jusqu’à l’invasion, selon la tradition grecque, des Cimmériens vers 700 av. J.-C. La Lydie puis la Perse la dominèrent ; elle passa ensuite entre les Séleucides et les rois de Pergame, et, après que le dernier roi de Pergame eut légué son royaume à Rome en 133 av. J.-C., elle fut donnée un temps au roi du Pont avant d’être rattachée à la province d’Asie, sa partie orientale étant plus tard jointe à la Galatie."
    - "Antiochos III installa deux mille familles juives de Babylonie en Lydie et en Phrygie, début de ses grandes communautés juives, et le culte de la Grande Mère de Pessinonte, porté à Rome en 204 av. J.-C., fut son don au monde romain. Des Juifs de Phrygie entendirent les apôtres à la Pentecôte. Lors de son deuxième voyage, Paul et ses compagnons « traversèrent la Phrygie et le pays de Galatie », et lors du troisième « parcourut successivement la Galatie et la Phrygie, fortifiant tous les disciples » ; que Luc entende la Phrygie proprement dite ou la partie phrygienne de la province de Galatie, avec Antioche de Pisidie et Icone, relève du long débat sur les Galates. Dans la vallée du Lycos, au sud-ouest de la Phrygie, se trouvaient Colosses, Laodicée et Hiérapolis, les Églises que servit Épaphras ; Paul écrivit à la première et envoya ses salutations à l’Église de Laodicée."
    - "La Phrygie devint l’une des régions les plus chrétiennes de l’empire. Papias fut évêque de Hiérapolis, et l’apôtre Philippe y aurait été enterré ; vers 170, Montan fonda, aux confins de la Phrygie, le mouvement prophétique que l’Église appela l’hérésie phrygienne ; et des pierres tombales du IIIe et du début du IVe siècle dans la haute vallée du Tembris portent ouvertement les mots « Chrétiens pour chrétiens », parmi les plus anciennes confessions de ce genre sur la pierre. Le plateau forme aujourd’hui les provinces turques d’Afyonkarahisar, de Kütahya et d’Eskişehir et l’ouest de la province d’Ankara, avec Gordion, inscrite par l’UNESCO en 2023, et les monuments rupestres des hautes terres phrygiennes près de la ville de Midas ; Hiérapolis se dresse au-dessus des terrasses blanches de Pamukkale."
  it:
    - "La Frigia è l’alto altopiano dell’Asia Minore centro-occidentale attorno al Sangario superiore e alle sorgenti del Meandro, un paese freddo e aperto di pecore e di lana. Il suo popolo, riferisce Erodoto sulla parola dei Macedoni, era vissuto un tempo accanto a loro in Europa, dove si chiamava Brigi. Il regno frigio fiorì nell’VIII secolo a.C. con capitale a Gordio, dove il Mida della leggenda, il Mita degli annali di Sargon, regnò finché, secondo la tradizione greca, i Cimmeri invasero il paese verso il 700 a.C. Lo dominarono la Lidia e poi la Persia; passò quindi tra i Seleucidi e i re di Pergamo, e, dopo che l’ultimo re di Pergamo ebbe lasciato il suo regno a Roma nel 133 a.C., fu data per un tempo al re del Ponto prima di essere unita alla provincia d’Asia, mentre la sua parte orientale fu poi unita alla Galazia."
    - "Antioco III insediò duemila famiglie ebree dalla Babilonia in Lidia e in Frigia, l’inizio delle sue grandi comunità ebraiche, e il culto della Grande Madre a Pessinunte, portato a Roma nel 204 a.C., fu il dono della Frigia al mondo romano. Ebrei della Frigia ascoltarono gli apostoli alla Pentecoste. Nel secondo viaggio Paolo e i suoi compagni «traversarono la Frigia e il paese della Galazia», e nel terzo percorse «di luogo in luogo il paese della Galazia e la Frigia, confermando tutti i discepoli»; se Luca intenda la Frigia propriamente detta o la parte frigia della provincia di Galazia, con Antiochia di Pisidia e Icònio, fa parte del lungo dibattito sui Galati. Nella valle del Lico, nella Frigia sud-occidentale, sorgevano Colosse, Laodicea e Gerapoli, le chiese servite da Epafra, e Paolo scrisse alla prima di esse e mandò saluti alla chiesa di Laodicea."
    - "La Frigia divenne una delle regioni più cristiane dell’impero. Papia fu vescovo di Gerapoli, e si diceva che vi fosse sepolto l’apostolo Filippo; verso il 170 Montano avviò, ai confini della Frigia, il movimento profetico che la chiesa chiamò eresia frigia; e lapidi del III e dell’inizio del IV secolo nell’alta valle del Tembri recano l’aperta formula «Cristiani per i Cristiani», tra le più antiche professioni di questo tipo nella pietra. L’altopiano è oggi costituito dalle province turche di Afyonkarahisar, Kütahya ed Eskişehir e dall’ovest della provincia di Ankara, con Gordio, iscritta dall’UNESCO nel 2023, e i monumenti rupestri degli altopiani frigi presso Midas Şehri; Gerapoli sorge sopra le bianche terrazze di Pamukkale."
  pl:
    - "Frygia to wysoki płaskowyż zachodnio-środkowej Azji Mniejszej wokół górnego Sangariosu i źródeł Meandra, zimny, otwarty kraj owiec i wełny. Jej lud, jak podaje Herodot za Macedończykami, mieszkał niegdyś obok nich w Europie, gdzie zwano go Brygami. Królestwo frygijskie rozkwitło w VIII wieku p.n.e. ze stolicą w Gordion, gdzie panował legendarny Midas, Mita z zapisów Sargona, aż według greckiej tradycji Kimmerowie zalali kraj około 700 roku p.n.e. Rządziły nią Lidia, a potem Persja; następnie przechodziła między Seleucydów a królów Pergamonu, a gdy ostatni król Pergamonu zapisał w 133 roku p.n.e. swoje królestwo Rzymowi, oddano ją na pewien czas królowi Pontu, zanim włączono ją do prowincji Azji, podczas gdy jej część wschodnią później włączono do Galacji."
    - "Antioch III osiedlił dwa tysiące żydowskich rodzin z Babilonii w Lidii i Frygii, co dało początek jej wielkim społecznościom żydowskim, a kult Wielkiej Matki w Pesynuncie, przeniesiony do Rzymu w 204 roku p.n.e., był darem Frygii dla świata rzymskiego. Żydzi z Frygii słyszeli apostołów w Pięćdziesiątnicę. W drugiej podróży Paweł przeszedł „Frygiję i Galatską krainę”, a w trzeciej, „obchodząc krainę Galatską i Frygiję, utwierdzając wszystkich uczniów”; czy Łukasz ma na myśli Frygię w ścisłym sensie, czy frygijską część prowincji Galacji, z Antiochią Pizydyjską i Ikonium, należy do długiego sporu o Galatów. W dolinie Likosu w południowo-zachodniej Frygii leżały Kolosy, Laodycea i Hierapolis, kościoły, którym służył Epafras, a Paweł napisał do pierwszego z nich i przesłał pozdrowienia kościołowi w Laodycei."
    - "Frygia stała się jednym z najbardziej chrześcijańskich regionów imperium. Papiasz był biskupem Hierapolis, a apostoł Filip miał być tam pochowany; około 170 roku Montanus zapoczątkował na pograniczu Frygii ruch prorocki, który Kościół nazwał herezją frygijską; a nagrobki z III i początku IV wieku w górnej dolinie Tembris noszą otwarte słowa „Chrześcijanie dla chrześcijan”, jedne z najstarszych takich wyznań w kamieniu. Płaskowyż to dziś tureckie prowincje Afyonkarahisar, Kütahya i Eskişehir oraz zachód prowincji Ankara, z Gordion, wpisanym na listę UNESCO w 2023 roku, i skalnymi zabytkami frygijskiego wyżu koło Miasta Midasa; Hierapolis stoi nad białymi tarasami Pamukkale."
  cs:
    - "Frygie je vysoká planina západostřední Malé Asie kolem horního Sangaria a pramenů Maiandru, chladná, otevřená země ovcí a vlny. Její lid podle Hérodota, jenž se odvolává na Makedonce, kdysi žil vedle nich v Evropě, kde se jmenoval Brygové. Frygické království vzkvétalo v 8. století př. n. l. s hlavním městem Gordion, kde vládl bájný Midas, v Sargonových záznamech Mita, než zemi podle řecké tradice kolem roku 700 př. n. l. zaplavili Kimmerijci. Vládla jí Lýdie a pak Persie; pak přecházela mezi Seleukovci a pergamskými králi a když poslední pergamský král roku 133 př. n. l. odkázal své království Římu, byla nějaký čas dána pontskému králi, než byla připojena k provincii Asii, zatímco její východní část byla později připojena ke Galacii."
    - "Antiochos III. usadil v Lýdii a Frygii dva tisíce židovských rodin z Babylonie, počátek tamních velkých židovských obcí, a kult Velké Matky v Pessinúntu, roku 204 př. n. l. přenesený do Říma, byl darem Frygie římskému světu. Židé z Frygie slyšeli apoštoly o Letnicích. Na druhé cestě Pavel s druhy, „prošedše Frygii i Galatskou krajinu“ a na třetí „procházel pořád Galatskou krajinu a Frygii, potvrzuje všech učedlníků“; zda Lukáš myslí Frygii v pravém smyslu, nebo frygickou část provincie Galacie s Antiochií Pisidskou a Ikoniem, je součástí dlouhé debaty o Galatských. V údolí Lyku v jihozápadní Frygii stály Kolosy, Laodikeia a Hierapolis, církve, jimž sloužil Epafras, a první z nich Pavel napsal a církvi v Laodikeji poslal pozdravy."
    - "Frygie se stala jednou z nejkřesťanštějších oblastí říše. Papiás byl biskupem v Hierapoli a apoštol Filip tam prý byl pohřben; asi roku 170 zahájil Montanos na hranicích Frygie prorocké hnutí, které církev nazvala frygickou herezí; a náhrobky ze 3. a počátku 4. století v horním údolí Tembridu nesou otevřená slova „Křesťané křesťanům“, řadící se k nejstarším takovým vyznáním v kameni. Planina je dnes tureckými provinciemi Afyonkarahisar, Kütahya a Eskişehir a západem provincie Ankara, s Gordionem, zapsaným UNESCO roku 2023, a skalními památkami frygické vysočiny u Midasova města; Hierapolis stojí nad bílými terasami Pamukkale."
  nl:
    - "Frygië is het hoogland van west-centraal Klein-Azië rond de bovenloop van de Sangarios en de bronnen van de Meander, een koud, open land van schapen en wol. Zijn volk, meldt Herodotus op gezag van de Macedoniërs, woonde eens naast hen in Europa, waar het Briges heette. Het koninkrijk bloeide in de 8e eeuw v.Chr. met Gordion als hoofdstad, waar de legendarische Midas, de Mita van Sargons annalen, regeerde tot volgens de Griekse overlevering de Kimmeriërs het land omstreeks 700 v.Chr. overrompelden. Lydië en daarna Perzië beheersten het; toen wisselde het tussen de Seleuciden en Pergamon, en nadat de laatste koning van Pergamon in 133 v.Chr. zijn rijk aan Rome had nagelaten, werd het een tijd aan de koning van Pontus gegeven voordat het bij de provincie Asia werd gevoegd, terwijl het oostelijke deel later bij Galatië ging."
    - "Antiochus III vestigde tweeduizend Joodse gezinnen uit Babylonië in Lydië en Frygië, het begin van de grote Joodse gemeenschappen, en de cultus van de Grote Moeder te Pessinus, in 204 v.Chr. naar Rome gebracht, was Frygiës gave aan Rome. Joden uit Frygië hoorden de apostelen met Pinksteren. Op zijn tweede reis had Paulus “Frygië, en het land van Galatië doorgereisd”, en op de derde “doorreisde” hij “vervolgens het land van Galatië en Frygië, versterkende al de discipelen”; of Lukas Frygië in eigenlijke zin bedoelt of het Frygische deel van de provincie Galatië, met Antiochië in Pisidië en Ikonium, hoort bij het lange debat over de Galaten. In de Lykosvallei van zuidwest-Frygië lagen Kolosse, Laodicea en Hiërapolis, de gemeenten die Epafras diende, en Paulus schreef aan de eerste en groette de gemeente te Laodicea."
    - "Frygië werd een van de meest christelijke streken van het rijk. Papias was bisschop van Hiërapolis, en de apostel Filippus zou er begraven zijn; omstreeks 170 begon Montanus aan de grenzen van Frygië de profetische beweging die de kerk de Frygische ketterij noemde; en grafstenen uit de 3e en vroege 4e eeuw in de bovenloop van de Tembris dragen openlijk de woorden “Christenen voor christenen”, onder de vroegste zulke belijdenissen in steen. Het plateau is nu de Turkse provincies Afyonkarahisar, Kütahya en Eskişehir en het westen van de provincie Ankara, met Gordion, in 2023 door UNESCO ingeschreven, en de rotsmonumenten van het Frygische hoogland bij Midasstad; Hiërapolis ligt boven de witte terrassen van Pamukkale."
  sv:
    - "Frygien är det höga platåland i västra centrala Mindre Asien kring övre Sangarios och Meanders källflöden, ett kallt, öppet land av får och ull. Dess folk hade, berättar Herodotos efter makedonierna, en gång bott bredvid dem i Europa, där de kallades briger. Det frygiska riket blomstrade på 700-talet f.Kr. med huvudstad i Gordion, där sagans Midas, Mita i Sargons uppteckningar, regerade tills, enligt grekisk tradition, kimmerierna översvämmade landet omkring 700 f.Kr. Lydien och sedan Persien härskade över det; därefter växlade det mellan seleukiderna och Pergamons kungar, och sedan Pergamons siste kung testamenterat sitt rike till Rom 133 f.Kr. gavs det en tid åt kungen av Pontos innan det lades till provinsen Asien, medan dess östra del senare lades till Galatien."
    - "Antiochos III bosatte tvåtusen judiska familjer från Babylonien i Lydien och Frygien, början på dess stora judiska samfund, och kulten av Stora modern i Pessinus, förd till Rom 204 f.Kr., var Frygiens gåva till den romerska världen. Judar från Frygien hörde apostlarna vid pingst. På sin andra resa gick Paulus, som det heter, ”genom Frygien och det galatiska landet”, och på den tredje, heter det, att han ”färdades först genom det galatiska landet och därefter genom Frygien och styrkte alla lärjungarna”; huruvida Lukas menar egentliga Frygien eller den frygiska delen av provinsen Galatien, med Antiochia i Pisidien och Ikonion, ingår i den långa debatten om galaterna. I Lykosdalen i sydvästra Frygien låg Kolossai, Laodikeia och Hierapolis, församlingarna som Epafras tjänade, och Paulus skrev till den förstnämnda och sände hälsningar till församlingen i Laodikeia."
    - "Frygien blev en av rikets mest kristna regioner. Papias var biskop av Hierapolis, och aposteln Filippos sades vara begravd där; omkring 170 började Montanus vid Frygiens gränser den profetiska rörelse som kyrkan kallade det frygiska kätteriet; och gravstenar från 200-talet och början av 300-talet i övre Tembrisdalen bär de öppna orden ”kristna för kristna”, bland de tidigaste sådana bekännelserna i sten. Platån är i dag de turkiska provinserna Afyonkarahisar, Kütahya och Eskişehir och västra Ankara, med Gordion, upptaget på Unescos lista 2023, och klippmonumenten i frygiska höglandet nära Midasstaden; Hierapolis ligger ovanför Pamukkales vita terrasser."
  nb:
    - "Frygia er det høye platået i vest-sentrale Lilleasia rundt øvre Sangarios og kildene til Maiandros, et kaldt, åpent land med sau og ull. Folket, forteller Herodot etter makedonernes ord, hadde en gang bodd ved siden av dem i Europa, der de ble kalt brigerne. Det frygiske kongeriket blomstret på 700-tallet f.Kr. med hovedstad i Gordion, der legendenes Midas, Mita i Sargons opptegnelser, regjerte til, ifølge gresk tradisjon, kimmerne overveldet landet omkring 700 f.Kr. Lydia og så Persia styrte det; så gikk det mellom seleukidene og kongene av Pergamon, og etter at Pergamons siste konge testamenterte kongeriket sitt til Roma i 133 f.Kr., ble det en tid gitt til kongen av Pontos før det ble lagt til provinsen Asia, mens den østlige delen senere ble lagt til Galatia."
    - "Antiokhos III bosatte to tusen jødiske familier fra Babylonia i Lydia og Frygia, begynnelsen på dets store jødiske samfunn, og dyrkelsen av Den store moder i Pessinous, ført til Roma i 204 f.Kr., var Frygias gave til den romerske verden. Jøder fra Frygia hørte apostlene på pinsedagen. På sin andre reise dro Paulus «gjennem Frygia og det galatiske land», og på den tredje «vandret [han] gjennem det galatiske land og Frygia fra ende til annen og styrket alle disiplene»; om Lukas mener Frygia i egentlig forstand eller den frygiske delen av provinsen Galatia, med Antiokia i Pisidia og Ikonium, er en del av den lange debatten om galaterne. I Lykos-dalen i sørvestlige Frygia lå Kolossai, Laodikea og Hierapolis, menighetene Epafras tjente, og Paulus skrev til den første av dem og sendte hilsener til menigheten i Laodikea."
    - "Frygia ble en av de mest kristne områdene i riket. Papias var biskop i Hierapolis, og apostelen Filip skal være gravlagt der; omkring 170 begynte Montanus ved grensene til Frygia den profetiske bevegelsen kirken kalte den frygiske vranglære; og gravsteiner fra 200-tallet og tidlig 300-tallet i den øvre Tembris-dalen bærer de åpne ordene «Kristne for kristne», blant de tidligste slike bekjennelser i stein. Platået er i dag de tyrkiske provinsene Afyonkarahisar, Kütahya og Eskişehir og vestlige deler av Ankara-provinsen, med Gordion, innskrevet av UNESCO i 2023, og klippemonumentene i det frygiske høylandet nær Midas-byen; Hierapolis ligger over de hvite terrassene i Pamukkale."
  tl:
    - "Ang Frigia ay mataas na talampas ng kanluran-gitnang Asia Minor sa palibot ng itaas na Sangarius at pinagmulan ng Maeander, malamig at bukás na lupain ng tupa at lana. Ayon kay Herodotus batay sa salita ng mga Macedonio, minsang nanirahan sa tabi nila sa Europa ang mga tao nito, na tinawag na Briges. Umunlad ang Frigia noong ika-8 siglo BK, kabisera ang Gordion, kung saan naghari ang Midas ng alamat, ang Mita ng mga talaan ni Sargon, hanggang sa, ayon sa tradisyong Griyego, lusubin ng mga Cimmerio ang lupain mga 700 BK. Pinamahalaan ito ng Lidia at Persia; napunta ito kalaunan sa pagitan ng mga Seleucida at hari ng Pergamo, at nang iwan ng huling hari ng Pergamo ang kaharian niya sa Roma noong 133 BK, ibinigay ito sandali sa hari ng Ponto bago isinama sa lalawigan ng Asia, habang kalaunan isinama sa Galacia ang silangang bahagi."
    - "Nagpatira si Antioco III ng 2,000 pamilyang Judio mula Babilonia sa Lidia at Frigia, simula ng malalaki nitong pamayanang Judio, at ang pagsamba sa Dakilang Ina sa Pessinus, dinala sa Roma noong 204 BK, ang handog ng Frigia sa daigdig na Romano. Narinig ng mga Judio mula Frigia ang mga apostol noong Pentecostes. Sa ikalawang paglalakbay ni Pablo, “nang kanilang matahak ang lupain ng Frigia at Galacia”; sa ikatlo, “tinahak ang lupain ng Galacia, at Frigia, na sunodsunod, na pinagtitibay ang lahat ng mga alagad”; kung Frigia mismo ang tinutukoy ni Lucas o ang bahaging Frigio ng lalawigan ng Galacia, kasama ang Antioquia ng Pisidia at Iconio, ay bahagi ng mahabang pagtatalo tungkol sa mga taga-Galacia. Sa libis ng Lycus sa timog-kanlurang Frigia ang Colosas, Laodicea at Hierapolis, mga iglesiang pinaglingkuran ni Epafras; sumulat si Pablo sa una at bumati sa iglesia sa Laodicea."
    - "Naging isa ang Frigia sa pinaka-Kristiyanong rehiyon ng imperyo. Si Papias ang obispo ng Hierapolis, at sinasabing doon nakalibing ang apostol na si Felipe; noong mga 170, sinimulan ni Montanus sa mga hangganan ng Frigia ang kilusang propetiko na tinawag ng iglesia na erehiyang Frigio; at ang mga lapida noong ika-3 at unang bahagi ng ika-4 na siglo sa itaas na libis ng Tembris ay may hayag na mga salitang “mga Kristiyano para sa mga Kristiyano”, kabilang sa pinakamaagang gayong pagpapahayag sa bato. Ang talampas ay ngayon ang mga lalawigang Turko ng Afyonkarahisar, Kütahya at Eskişehir at ang kanluran ng lalawigan ng Ankara, kasama ang Gordion, na itinala ng UNESCO noong 2023, at ang mga bantayog na bato ng mataas na lupain ng Frigia malapit sa lungsod ng Midas; ang Hierapolis ay nakatayo sa itaas ng mga puting terasa ng Pamukkale."
