body:
  en:
    - "Peor was a mountain in the land of Moab, east of the Jordan opposite Jericho, in the range that falls from the plateau of Medeba to the Jordan plain: “the top of Peor, that looketh toward Jeshimon”, the wasteland of the valley floor. A town, Beth-peor, lay below it, and the god worshipped there was Baal of Peor. Eusebius knew Bethphogor “near Mount Phogor, opposite Jericho, six miles above Livias”, that is above Beth-haram on the road up to Heshbon, and elsewhere sets Mount Phogor on the road from Livias up to Heshbon, which puts Peor in the hills north of Mount Nebo. Which peak it was no one can say; the map sets it beside Beth-peor, itself not surely located. The Balaam of the story was remembered in these parts: a plaster inscription of about 800 BC found in 1967 at Deir Alla in the Jordan valley tells of Balaam son of Beor, a seer of the gods."
    - "Balak took Balaam to the top of Peor for the third of his oracles, and Balaam blessed Israel once more. Then, while Israel “abode in Shittim” below, “the people began to commit whoredom with the daughters of Moab”, ate their sacrifices and bowed to their gods: “Israel joined himself unto Baal-peor”, and a plague fell until Phinehas killed Zimri and the Midianite woman Cozbi, slain “in the day of the plague for Peor's sake”. Moses later laid the seduction to Balaam's counsel. Deuteronomy sets Moses' last speeches “in the valley over against Beth-peor”, reminds Israel, “Your eyes have seen what the LORD did because of Baal-peor”, and buries him “in a valley in the land of Moab, over against Beth-peor”, where “no man knoweth of his sepulchre unto this day”."
    - "The iniquity of Peor became a byword: “Is the iniquity of Peor too little for us”, Phinehas asks the eastern tribes at their altar; the psalm recalls how Israel “joined themselves also unto Baal-peor, and ate the sacrifices of the dead”, and Hosea sees the first fathers going “to Baal-peor” and separating themselves “unto that shame”. Today the hills of Peor are the Jordanian countryside north-west of Madaba, between Mount Nebo with its Franciscan church and the springs of Ayun Musa, overlooking the Dead Sea and the Jordan valley; nothing on the ground marks the mountain."
  ru:
    - "Фегор — гора в земле Моавитской, к востоку от Иордана против Иерихона, в цепи, спадающей от плато Медевы к Иорданской равнине: «верх Фегора, обращенного к пустыне», к пустоши на дне долины. Под ней лежал город Беф-Фегор, а чтимым там богом был Ваал-Фегор. Евсевий знал Бетфогор близ горы Фогор, против Иерихона, в шести милях выше Ливиады, то есть выше Беф-Гарама, а гору Фогор он же ставит на дороге от Ливиады вверх к Есевону, что помещает Фегор в холмы к северу от горы Нево. Какая это была вершина, никто сказать не может; на карте она стоит рядом с Беф-Фегором, который сам надёжно не локализован. Валаама из этого рассказа в здешних краях помнили: надпись на штукатурке около 800 г. до н. э., найденная в 1967 году в Дейр-Алле в Иорданской долине, говорит о Валааме, сыне Веора, прозорливце богов."
    - "Валак взял Валаама на верх Фегора ради третьего из его пророчеств, и Валаам снова благословил Израиль. Затем, пока внизу «жил Израиль в Ситтиме», «начал народ блудодействовать с дочерями Моава», ел их жертвы и кланялся их богам: «И прилепился Израиль к Ваал-Фегору», и поражение шло, пока Финеес не убил Зимри и мадианитянку Хазву, убитую «в день поражения за Фегора». Позже Моисей возложил это соблазнение на совет Валаама. Второзаконие помещает последние речи Моисея «на долине, напротив Беф-Фегора», напоминает Израилю: «Глаза ваши видели все, что сделал Господь Бог наш с Ваал-Фегором», и погребает его «на долине в земле Моавитской против Беф-Фегора», где «никто не знает места погребения его даже до сего дня»."
    - "Грех Фегора стал присловьем: «Разве мало для нас беззакония Фегорова», — говорит Финеес восточным коленам у их жертвенника; псалом вспоминает: «Они прилепились к Ваалфегору и ели жертвы бездушным», а Осия видит первых отцов, которые «пошли к Ваал-Фегору и предались постыдному». Сегодня холмы Фегора — иорданская сельская местность к северо-западу от Мадабы, между горой Нево с её францисканской церковью и источниками Айн-Муса, над Мёртвым морем и Иорданской долиной; ничто на земле не отмечает гору."
  uk:
    - "Пеор був горою в землі Моавській, на схід від Йордану навпроти Єрихону, в хребті, що спадає від плато Мадаби до Йорданської рівнини: «верх Пеора, що стремить на рівнинї пустинї», — на Єшимон, пустку долинного дна. Під нею лежало місто Бет-Пеор, а бог, якого там шанували, був Ваал-Пеор. Євсевій знав Бетфогор «поблизу гори Фогор, навпроти Єрихону, за шість миль вище Лівіади», тобто вище Бет-Гарама на дорозі вгору до Гесбону, а в іншому місці ставить гору Фогор на дорозі від Лівіади вгору до Гесбону, що розміщує Пеор у горах на північ від гори Нево. Яка це була вершина, ніхто не скаже; на мапі вона стоїть поряд із Бет-Пеором, який сам надійно не локалізований. Валаама з цієї історії пам’ятали в тих краях: напис на штукатурці близько 800 р. до н. е., знайдений 1967 року в Дейр-Аллі в Йорданській долині, розповідає про Валаама, сина Веора, провидця богів."
    - "Балак узяв Валаама на верх Пеора для третього з його пророцтв, і Валаам ще раз благословив Ізраїль. Тоді внизу, де «жив Ізраїль у Ситтимі», «став блудувати люд із дочками Моабовими», їв їхні жертви й вклонявся їхнім богам: «прихиливсь Ізраїль до Бааль-Пеора», і мор лютував, доки Финеес не вбив Зімрі та мадіанітянку Хазву, убиту в день моровиці через Пеор. Мойсей пізніше поклав спокусу на раду Валаама. Повторення Закону ставить останні промови Мойсея «в долинї проти Бет-Пеора», нагадує Ізраїлю: «Очі ваші бачили, що вдїяв Господь з Бааль Пеором», і ховає його «в долинї, в Моаб землї, проти Бет-Пеору», де «і по сей день нїхто не знає гробища його»."
    - "Беззаконня Пеора стало прислів’ям: «Хиба мало нам провини через Пеора», — питає Финеес у східних колін біля їхнього жертовника; псалом нагадує, що «пристали вони до Баал-Пегора, й їли жертви мертвих ідолів», а Осія бачить перших отців, які «обернулись до Вааль-Пеора й віддали себе гидотї». Нині пагорби Пеора — це йорданська місцевість на північний захід від Мадаби, між горою Нево з францисканською церквою та джерелами Айун-Муса, з видом на Мертве море й долину Йордану; на місцевості ніщо не позначає гору."
  es:
    - "Peor era un monte en la tierra de Moab, al este del Jordán frente a Jericó, en la cordillera que baja de la meseta de Medeba a la llanura del Jordán: «la cumbre de Peor, que mira hacia Jesimón», el yermo del fondo del valle. Una ciudad, Bet-peor, estaba bajo él, y allí se adoraba al Baal de Peor. Eusebio conocía Betfogor «junto al monte Fogor, frente a Jericó, a seis millas por encima de Livias», es decir, por encima de Bet-haram, en el camino que sube a Hesbón, y en otro lugar sitúa el monte Fogor en el de Livias a Hesbón, lo que pone a Peor en las colinas al norte del Nebo. Qué cima era, nadie lo sabe; el mapa la sitúa junto a Bet-peor, de ubicación incierta. El Balaam del relato se recordaba por estas tierras: una inscripción en yeso de hacia 800 a. C. hallada en 1967 en Deir Alla, en el valle del Jordán, habla de Balaam hijo de Beor, un vidente de los dioses."
    - "Balac llevó a Balaam a la cumbre de Peor para el tercero de sus oráculos, y Balaam bendijo a Israel una vez más. Luego, mientras Israel «reposó… en Sittim» abajo, «el pueblo empezó á fornicar con las hijas de Moab», comió de sus sacrificios y se inclinó ante sus dioses: «allegóse el pueblo á Baal-peor», y cayó una plaga hasta que Finees mató a Zimri y a la mujer madianita Cozbi, muerta «el día de la mortandad por causa de Peor». Moisés atribuyó después la seducción al consejo de Balaam. El Deuteronomio sitúa los últimos discursos de Moisés «en el valle delante de Beth-peor», recuerda a Israel: «Vuestros ojos vieron lo que hizo Jehová con motivo de Baal-peor», y lo entierra «en el valle, en tierra de Moab, enfrente de Bethpeor», donde «ninguno sabe su sepulcro hasta hoy»."
    - "La maldad de Peor se hizo proverbial: «¿Nos ha sido poco la maldad de Peor», preguntan Finees y los suyos a las tribus orientales junto a su altar; el salmo recuerda cómo «Allegáronse asimismo á Baal-peor, y comieron los sacrificios de los muertos», y Oseas ve a los primeros padres entrando «á Baal-peor» y apartándose «para vergüenza». Hoy las colinas de Peor son el campo jordano al noroeste de Madaba, entre el monte Nebo con su iglesia franciscana y las fuentes de Ayun Musa, con vistas al mar Muerto y al valle del Jordán; nada sobre el terreno marca el monte."
  pt:
    - "Peor era um monte na terra de Moabe, a leste do Jordão, defronte de Jericó, na cadeia que desce do planalto de Medeba à planície do Jordão: “o topo de Peor, que tem vista para o deserto”, o Jesimom, a terra devastada do fundo do vale. Uma cidade, Bete-Peor, ficava abaixo dele, e o deus ali adorado era o Baal de Peor. Eusébio conhecia Betfogor “perto do Monte Fogor, defronte de Jericó, seis milhas acima de Lívias”, isto é, acima de Bete-Harã, na estrada que sobe a Hesbom, e noutro lugar põe o Monte Fogor na estrada de Lívias a Hesbom, o que situa Peor nas colinas ao norte do Monte Nebo. Que pico era, ninguém sabe; o mapa o põe junto a Bete-Peor, ela mesma de local incerto. O Balaão da história era lembrado por ali: uma inscrição em gesso de cerca de 800 a.C., achada em 1967 em Deir Alla, no vale do Jordão, fala de Balaão, filho de Beor, vidente dos deuses."
    - "Balaque levou Balaão ao topo de Peor para o terceiro de seus oráculos, e Balaão abençoou Israel mais uma vez. Então, enquanto Israel “permaneceu em Sitim”, lá embaixo, “o povo começou a se prostituir com as filhas de Moabe”, comeu seus sacrifícios e se prostrou diante de seus deuses: “Israel juntou-se a Baal-Peor”, e uma praga caiu até que Finéias matou Zinri e a midianita Cosbi, morta “no dia da praga no caso de Peor”. Moisés atribuiu depois a sedução ao conselho de Balaão. O Deuteronômio situa os últimos discursos de Moisés “no vale perto de Bete-Peor”, lembra a Israel: “Os seus olhos viram o que o SENHOR fez por causa de Baal-Peor”, e o sepulta “no vale, na terra de Moabe, em frente a Bete-Peor”, onde “ninguém sabe onde fica o seu túmulo até o dia de hoje”."
    - "A iniquidade de Peor tornou-se proverbial: “Acaso a iniquidade de Peor é pouca coisa para nós”, pergunta Finéias às tribos orientais junto ao seu altar; o salmo recorda como os israelitas “se juntaram a Baal-Peor, e comeram os sacrifícios oferecidos aos mortos”, e Oseias vê os primeiros pais irem “a Baal-Peor” e se consagrarem “àquela coisa vergonhosa”. Hoje as colinas de Peor são o campo jordaniano a noroeste de Madaba, entre o Monte Nebo, com sua igreja franciscana, e as fontes de Ayun Musa, com vista para o Mar Morto e o vale do Jordão; nada no terreno assinala o monte."
  de:
    - "Peor war ein Berg im Land Moab, östlich des Jordan gegenüber von Jericho, im Höhenzug, der von der Hochfläche von Medeba zur Jordanebene abfällt: „auf die Höhe des Berges Peor, welcher gegen die Wüste sieht“, nach Jeschimon, der Einöde der Talsohle. Darunter lag die Stadt Bet-Peor, und dort verehrt wurde Baal-Peor. Eusebius kannte Bethphogor „nahe dem Berg Phogor, gegenüber von Jericho, sechs Meilen oberhalb von Livias“, also oberhalb von Bet-Haram, und setzt den Berg Phogor anderswo an die Straße von Livias nach Heschbon, was Peor in die Hügel nördlich des Berges Nebo versetzt. Welcher Gipfel es war, ist unklar; die Karte setzt ihn neben das nicht sicher lokalisierte Bet-Peor. Bileam war in dieser Gegend unvergessen: Eine 1967 in Deir Alla im Jordantal gefundene Putzinschrift von etwa 800 v. Chr. nennt Bileam, den Sohn Beors, einen Seher der Götter."
    - "Balak führte Bileam auf den Gipfel des Peor zu seinem dritten Spruch, und Bileam segnete Israel noch einmal. Dann, als Israel darunter „in Sittim“ wohnte, heißt es: „Und das Volk hob an zu huren mit der Moabiter Töchtern“, und es aß von ihren Opfern und betete ihre Götter an: „Israel hängte sich an den Baal-Peor“, und eine Plage kam, bis Pinhas Simri und die Midianiterin Kosbi erschlug, „die erschlagen ist am Tag der Plage um des Peor willen“. Mose führte die Verführung später auf Bileams Rat zurück. Das Deuteronomium verlegt Moses letzte Reden „im Tal gegenüber Beth-Peor“, erinnert Israel: „Eure Augen haben gesehen, was der HERR getan hat wider den Baal-Peor“, und lässt ihn „im Tal im Lande der Moabiter gegenüber Beth-Peor“ begraben, wo „niemand hat sein Grab erfahren bis auf diesen heutigen Tag“."
    - "Die Schuld des Peor wurde sprichwörtlich: „Ist's uns zu wenig an der Missetat über dem Peor“, fragt Pinhas die östlichen Stämme an ihrem Altar; der Psalm erinnert: „Und sie hingen sich an den Baal-Peor und aßen von den Opfern der toten Götzen“, und Hosea sieht die ersten Väter, die „zu Baal-Peor“ gingen und sich „dem schändlichen Abgott“ gelobten. Heute sind die Hügel des Peor die jordanische Landschaft nordwestlich von Madaba, zwischen dem Berg Nebo mit seiner Franziskanerkirche und den Quellen von Ajun Musa, mit Blick auf das Tote Meer und das Jordantal; nichts am Boden bezeichnet den Berg."
  fr:
    - "Peor était une montagne du pays de Moab, à l’est du Jourdain en face de Jéricho, dans la chaîne qui descend du plateau de Médeba vers la plaine du Jourdain : « le sommet du Peor, en regard du désert », le fond aride de la vallée. Une ville, Beth-Peor, s’étendait au-dessous ; on y adorait Baal-Peor. Eusèbe connaissait Bethphogor « près du mont Phogor, en face de Jéricho, à six milles au-dessus de Livias », c’est-à-dire au-dessus de Beth-Haram sur la route de Hesbon, et situe ailleurs le mont Phogor sur la route de Livias à Hesbon, ce qui met Peor au nord du mont Nebo. Quel sommet, nul ne peut le dire ; la carte le place près de Beth-Peor, elle-même incertaine. Le Balaam du récit resta dans les mémoires de la région : une inscription sur plâtre d’environ 800 av. J.-C., trouvée en 1967 à Deir Alla dans la vallée du Jourdain, parle de Balaam fils de Beor, devin des dieux."
    - "Balak mena Balaam au sommet du Peor pour le troisième de ses oracles, et Balaam bénit Israël une fois de plus. Puis, tandis qu’Israël « demeurait à Sittim » au-dessous, « le peuple commença à se livrer à la débauche avec les filles de Moab », mangea leurs sacrifices et se prosterna devant leurs dieux : « Israël s’attacha à Baal-Peor », et une plaie s’abattit jusqu’à ce que Phinées tue Zimri et la Madianite Cozbi, tuée « le jour de la plaie qui eut lieu à l’occasion de Peor ». Moïse imputa plus tard la séduction au conseil de Balaam. Le Deutéronome place les derniers discours de Moïse « dans la vallée, vis-à-vis de Beth-Peor », rappelle à Israël : « Vos yeux ont vu ce que l’Éternel a fait à l’occasion de Baal-Peor », et l’enterre « dans la vallée, au pays de Moab, vis-à-vis de Beth-Peor », où « personne n’a connu son sépulcre jusqu’à ce jour »."
    - "Le crime de Peor devint proverbial : « Regardons-nous comme peu de chose le crime de Peor », demande Phinées aux tribus de l’est devant leur autel ; le psaume rappelle que les Israélites « s’attachèrent à Baal-Peor, et mangèrent des victimes sacrifiées aux morts », et Osée voit les premiers pères aller « vers Baal-Peor » et se consacrer à « l’infâme idole ». Aujourd’hui, les collines de Peor sont la campagne jordanienne au nord-ouest de Madaba, entre le mont Nebo et son église franciscaine et les sources d’Ayun Musa, dominant la mer Morte et la vallée du Jourdain ; rien sur le terrain ne marque la montagne."
  it:
    - "Peor era un monte nel paese di Moab, a est del Giordano di fronte a Gerico, nella catena che scende dall’altopiano di Màdaba alla piana del Giordano: «in cima al Peor che domina il deserto» (ebraico Iesimon), la landa desolata del fondovalle. Ai suoi piedi sorgeva la città di Bet-Peor, e il dio che vi si adorava era Baal-Peor. Eusebio conosceva Betfogor «presso il monte Fogor, di fronte a Gerico, sei miglia sopra Livias», cioè sopra Bet-Aram sulla strada per Chesbon, e altrove pone il monte Fogor sulla strada da Livias a Chesbon, il che colloca Peor a nord del Monte Nebo. Quale cima fosse nessuno può dirlo; la mappa lo pone accanto a Bet-Peor, a sua volta incerta. Il Balaam del racconto era ricordato qui: un’iscrizione su intonaco dell’800 a.C. circa, trovata nel 1967 a Deir Alla nella valle del Giordano, parla di Balaam figlio di Beor, veggente degli dèi."
    - "Balak condusse Balaam in cima al Peor per il terzo dei suoi oracoli, e Balaam benedisse ancora Israele. Poi, mentre Israele «era stanziato a Sittim» più in basso, «il popolo cominciò a darsi alla impurità con le figliuole di Moab», mangiò i loro sacrifici e si prostrò ai loro dèi: «Israele si unì a Baal-Peor», e una piaga colpì finché Pincas uccise Zimri e la donna madianita Cozbi, uccisa «il giorno della piaga causata dall’affare di Peor». Mosè attribuì poi la seduzione al consiglio di Balaam. Il Deuteronomio colloca gli ultimi discorsi di Mosè «nella valle dirimpetto a Beth-Peor», ricorda a Israele: «Gli occhi vostri videro ciò che l’Eterno fece nel caso di Baal-Peor», e lo seppellisce «nella valle, nel paese di Moab, dirimpetto a Beth-Peor», dove «nessuno fino a questo giorno ha mai saputo dove fosse la sua tomba»."
    - "L’iniquità di Peor divenne proverbiale: «E’ ella poca cosa per noi l’iniquità di Peor», chiede Pincas alle tribù orientali presso il loro altare; il salmo ricorda come gli Israeliti «si congiunsero anche con Baal-Peor e mangiarono dei sacrifizi dei morti», e Osea vede i primi padri che «giunsero a Baal-peor» e «si appartarono per darsi all’ignominia degl’idoli». Oggi le colline di Peor sono la campagna giordana a nord-ovest di Màdaba, tra il Monte Nebo con la sua chiesa francescana e le sorgenti di Ayun Musa, affacciate sul Mar Morto e sulla valle del Giordano; nulla sul terreno segna il monte."
  pl:
    - "Peor było górą w ziemi Moabu, na wschód od Jordanu naprzeciw Jerycha, w paśmie opadającym z płaskowyżu Medeby ku równinie Jordanu: „wierzch góry Fegor, która patrzy ku puszczy”, czyli ku Jeszimon, pustkowiu dna doliny. Pod nią leżało miasto Bet-Peor, a czczonym tam bogiem był Baal-Peor. Euzebiusz znał Bet-Fogor „koło góry Fogor, naprzeciw Jerycha, sześć mil powyżej Liwias”, to jest powyżej Bet-Haram, a gdzie indziej umieszcza górę Fogor na drodze z Liwias do Cheszbonu, co kładzie Peor we wzgórzach na północ od Góry Nebo. Który to szczyt, nie wiadomo; mapa stawia go obok Bet-Peor, również niepewnie ustalonego. Balaama pamiętano w tych stronach: gipsowy napis z około 800 roku p.n.e., znaleziony w 1967 w Dajr Alla w dolinie Jordanu, mówi o Balaamie, synu Beora, widzącym bogów."
    - "Balak zaprowadził Balaama na szczyt Peor na trzecią wyrocznię, a Balaam jeszcze raz pobłogosławił Izraela. Potem, gdy „mieszkał Izrael w Syttim” poniżej, „począł lud cudzołożyć z córkami Moabskiemi”, jadł ich ofiary i kłaniał się ich bogom: „przyłączył się Izrael do służby Baal Fegora”, i spadła plaga, aż Pinchas zabił Zimriego, a madianitka Kozbi została zabita „w dzień kaźni dla bałwana Fegor”. Mojżesz później złożył winę za uwiedzenie na radę Balaama. Księga Powtórzonego Prawa umieszcza ostatnie przemowy Mojżesza „w dolinie przeciw Betfegor”, przypomina Izraelowi: „Oczy wasze widziały, co uczynił Pan dla Baal fegora”, i grzebie go „w dolinie w ziemi Moabskiej, przeciw Betfegorowi”, gdzie „nie dowiedział się nikt o grobie jego aż do dnia tego”."
    - "Występek Peor stał się przysłowiem: „Azaż nam mało na złości Fegorowej”, pyta Pinchas wschodnie pokolenia przy ich ołtarzu; psalm wspomina, że „Sprzęgli się też byli z bałwanem Baalfegorem, a jedli ofiary umarłych”, a Ozeasz widzi pierwszych ojców, którzy „poszli za Baal Fegorem, a oddali się tej obrzydliwości”. Dziś wzgórza Peor to jordańska okolica na północny zachód od Madaby, między Górą Nebo z kościołem franciszkanów a źródłami Ajun Musa, z widokiem na Morze Martwe i dolinę Jordanu; nic w terenie nie znaczy tej góry."
  cs:
    - "Peór byla hora v zemi Moáb, východně od Jordánu naproti Jerichu, v pásmu, které klesá z medebské plošiny k jordánské pláni: „na vrch hory Fegor, kteráž leží naproti poušti“, pustině na dně údolí. Pod ní leželo město Bét-peór a bůh tam uctívaný byl Báal Peórský. Eusebius znal Betfogor „poblíž hory Fogor, naproti Jerichu, šest mil nad Liviadou“, tedy nad Bét-haramem na cestě vzhůru k Chešbónu, a jinde klade horu Fogor na cestu z Liviady vzhůru k Chešbónu, což staví Peór do pahorků severně od hory Nebo. Který vrchol to byl, nikdo neřekne; mapa jej klade vedle Bét-peóru, rovněž nejistě určeného. Bileám z příběhu se v těchto končinách pamatoval: omítkový nápis z asi 800 př. n. l. nalezený roku 1967 v Dér Alle v jordánském údolí vypráví o Bileámovi synu Beórově, věštci bohů."
    - "Balak vzal Bileáma na vrchol Peóru k třetí věštbě a Bileám požehnal Izraeli znovu. Pak, když „pobyl Izrael v Setim“ pod ním, „počal lid smilniti s dcerami Moábskými“, jedl jejich oběti a klaněl se jejich bohům: „I připojil se lid Izraelský k modle Belfegor“ a padla rána, dokud Pinchas nezabil Zimrího a madiánskou ženu Kozbi, zabitou „v den pomsty přišlé z příčiny Fegor“. Mojžíš později svedení připsal Bileámově radě. Deuteronomium klade Mojžíšovy poslední řeči „v údolí naproti Betfegor“, připomíná Izraeli: „Oči vaše viděly, co učinil Hospodin pro Belfegor“, a praví, že jej pochoval „v Gai, v zemi Moábské naproti Betfegor“, a „žádný nezvěděl o jeho hrobu až do tohoto dne“."
    - "Nepravost Peóru se stala pořekadlem: „Ještě-liž se nám malá zdá nepravost modly Fegor“, ptá se Pinchas východních pokolení u jejich oltáře; žalm připomíná, že „Spřáhli ... s modlou Belfegor, a jedli oběti mrch“, a Ozeáš vidí první otce, jak „odešli za Belfegor, a oddali se té ohavnosti“. Dnes jsou pahorky Peóru jordánským venkovem severozápadně od Mádaby, mezi horou Nebo s františkánským kostelem a prameny Ajún Músa, s výhledem na Mrtvé moře a jordánské údolí; nic na zemi horu neoznačuje."
  nl:
    - "Peor was een berg in het land Moab, ten oosten van de Jordaan tegenover Jericho, in het gebergte tussen het plateau van Medeba en de Jordaanvlakte: “de hoogte van Peor, die tegen de woestijn ziet”, Jesimon, de woestenij van de dalbodem. Eronder lag een stad, Beth-Peor, en de god daar was Baäl van Peor. Eusebius kende Bethphogor “bij de berg Fogor, tegenover Jericho, zes mijl boven Livias”, dat is boven Beth-Haram aan de weg omhoog naar Chesbon, en plaatst elders de berg Fogor aan de weg van Livias naar Chesbon, wat Peor in de heuvels ten noorden van de Nebo legt. Welke top het was, kan niemand zeggen; de kaart zet hem naast Beth-Peor, dat zelf niet zeker ligt. Bileam werd in deze streken herinnerd: een pleisteropschrift van omstreeks 800 v.Chr., in 1967 gevonden te Deir Alla in de Jordaanvallei, vertelt van Bileam, zoon van Beor, een ziener van de goden."
    - "Balak nam Bileam mee naar de top van Peor voor zijn derde godsspraak, en Bileam zegende Israël opnieuw. Toen, terwijl Israël beneden “verbleef te Sittim”, “het volk begon te hoereren met de dochteren der Moabieten”, at van hun offers en boog zich voor hun goden; toen Israël “zich koppelde aan Baal-Peor”, viel een plaag totdat Pinechas Zimri doodde en de Midianitische Kozbi, die “verslagen is, ten dage der plaag, om de zaak van Peor”. Mozes legde de verleiding later aan Bileams raad ten laste. Deuteronomium laat Mozes’ laatste toespraken houden “in dit dal tegenover Beth-Peor”, herinnert Israël: “Uw ogen hebben gezien, wat God om Baal-Peor gedaan heeft”, en zegt: “En Hij begroef hem in een dal, in het land van Moab, tegenover Beth-Peor; en niemand heeft zijn graf geweten, tot op dezen dag”."
    - "De ongerechtigheid van Peor werd een spreekwoord: “Is ons de ongerechtigheid van Peor te weinig”, vraagt Pinechas aan de oostelijke stammen bij hun altaar; de psalm zegt: “Ook hebben zij zich gekoppeld aan Baal-Peor, en zij hebben de offeranden der doden gegeten”, en Hosea ziet de eerste vaderen: “zij gingen in tot Baal-Peor, en zonderden zich af tot die schaamte”. Tegenwoordig zijn de heuvels van Peor het Jordaanse platteland ten noordwesten van Madaba, tussen de Nebo met zijn franciscaanse kerk en de bronnen van Ayun Musa, met uitzicht op de Dode Zee en de Jordaanvallei; niets op de grond markeert de berg."
  sv:
    - "Peor var ett berg i Moab, öster om Jordan mitt emot Jeriko, i bergskedjan som faller från Medebas platå mot Jordanslätten: ”toppen av Peor, där man kan se ut över ödemarken”, dalbottnens ödemark. Bet-Peor låg nedanför, och guden som dyrkades där var Baal-Peor. Eusebios kände Bethphogor ”nära berget Phogor, mitt emot Jeriko, sex romerska mil ovanför Livias”, alltså ovanför Bet-Haram på vägen upp till Heshbon, och placerar berget Phogor på vägen från Livias upp till Heshbon, vilket förlägger Peor i bergen norr om Nebo. Vilken topp det var kan ingen säga; kartan sätter det vid Bet-Peor, självt osäkert lokaliserat. Bileam minns man här: en inskription i puts från omkring 800 f.Kr., funnen 1967 vid Deir Alla i Jordandalen, berättar om Bileam, Beors son, gudarnas siare."
    - "Balak förde Bileam till toppen av Peor för den tredje av hans orakel, och Bileam välsignade Israel än en gång. Sedan, ”medan Israel uppehöll sig i Sittim, begynte folket bedriva otukt med Moabs döttrar”, åt deras offermåltider och tillbad deras gudar: ”Israel slöt sig till Baal-Peor”, och en plåga föll tills Pinechas dödade Simri och den midjanitiska kvinnan Kosbi, som ”dödades på den dag då hemsökelsen drabbade eder för Peors skull”. Mose lade senare förförelsen på Bileams råd. Femte Mosebok förlägger Moses sista tal ”i dalen mitt emot Bet-Peor”, påminner Israel: ”I haven med egna ögon sett vad HERREN har gjort i fråga om Baal-Peor”, och begraver honom ”i dalen i Moabs land, mitt emot Bet-Peor”, där ”ännu intill denna dag har ingen fått veta var hans grav är”."
    - "Peors missgärning blev ett bevingat ord: ”Är det icke nog att vi hava begått missgärningen med Peor”, frågar Pinechas de östra stammarna vid deras altare; psalmen minns hur Israel ”slöt sig till Baal-Peor och åto det som var offrat åt döda”, och Hosea ser de första fäderna: ”när de kommo till Baal-Peor, invigde de sig åt skändlighetsguden”. I dag är Peors berg den jordanska landsbygden nordväst om Madaba, mellan Nebo med sin franciskanska kyrka och källorna vid Ayun Musa, med utsikt över Döda havet och Jordandalen; ingenting på marken markerar berget."
  nb:
    - "Peor var et fjell i Moabs land, øst for Jordan overfor Jeriko, i fjellkjeden som faller fra Medeba-platået ned til Jordansletten: «toppen av Peor, hvorfra en skuer ut over ørkenen», Jesjimon, det øde landet på dalbunnen. En by, Bet-Peor, lå under det, og guden som ble tilbedt der, var Baal-Peor. Eusebius kjente Bet-Fogor «nær Fogor-fjellet, rett overfor Jeriko, seks romerske mil ovenfor Livias», det vil si ovenfor Bet-Haram på veien opp til Hesjbon, og plasserer andre steder Fogor-fjellet på veien fra Livias opp til Hesjbon, noe som setter Peor i åsene nord for Nebo. Hvilken topp det var, kan ingen si; kartet setter det ved siden av Bet-Peor, som selv ikke er sikkert lokalisert. Bileam i fortellingen ble husket i disse traktene: en gipsinskripsjon fra omkring 800 f.Kr. funnet i 1967 ved Deir Alla i Jordandalen forteller om Bileam, sønn av Beor, en gudenes seer."
    - "Balak tok Bileam med til toppen av Peor for det tredje av hans orakler, og Bileam velsignet Israel nok en gang. Så, mens Israel «opholdt sig i Sittim» nedenfor, «begynte folket å drive utukt med Moabs døtre», åt av ofrene deres og tilbad guder: «Israel holdt sig til Ba'al-Peor», og en pest rammet til Pinhas drepte Simri og midianittkvinnen Kosbi, drept «dengang sotten kom over eder for Peors skyld». Moses la senere forførelsen på Bileams råd. 5. Mosebok setter Moses' siste taler «i dalen midt imot Bet-Peor», minner Israel om at «I har med egne øine sett hvad Herren gjorde da det hendte det med Ba'al Peor», og begraver ham «i dalen i Moabs land midt imot Bet-Peor», og «ingen kjenner til denne dag hans grav»."
    - "Peors misgjerning ble et ordtak: «Var det ikke nok med den misgjerning vi gjorde da vi holdt oss til Peor», spør Pinhas de østlige stammene ved deres alter; salmen minnes hvordan Israel «bandt sig til Ba'al-Peor og åt av offere til døde», og Hosea ser de første fedrene, «da de kom til Ba'al-Peor, vidde de sig til avgudsdyrkelsen». I dag er Peors åser den jordanske landsbygda nordvest for Madaba, mellom Nebo med sin franziskanerkirke og kildene ved Ayun Musa, med utsikt over Dødehavet og Jordandalen; ingenting på bakken markerer fjellet."
