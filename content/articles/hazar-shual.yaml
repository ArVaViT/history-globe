# Overview article (ADR 0007). Mainstream facts only; the town is unlocated and the candidates are given without choosing; a minor place, said so.
id: hazar-shual
place: a89005a
title:
  en: "Hazar-shual"
  ru: "Хацар-Шуал"
  uk: "Хацар-Шуал"
  es: "Hazar-sual"
  pt: "Hazar-Sual"
  de: "Hazar-Schual"
  fr: "Hatsar-Schual"
  pl: "Chasar-Szual"
  it: "Cazar-Sual"
  nl: "Hazar-Sual"
  cs: "Chacar-šúal"
  sv: "Hasar-Shual"
  nb: "Hasar-Sjual"
body:
  en:
    - "Hazar-shual, “enclosure of the jackal” or “of the fox”, was a village of the Negeb, the dry south of Judah around Beersheba. It is known only from lists. Joshua names it among the towns of Judah “toward the coast of Edom southward”, next to Beersheba, and again among the towns of Simeon, whose inheritance lay “within the inheritance of the children of Judah”; the Chronicler's roll of Simeon repeats that “they dwelt at Beer-sheba, and Moladah, and Hazar-shual”, and after the exile men of Judah settled once more “at Hazar-shual, and at Beer-sheba, and in the villages thereof”. Its name, like the other hazer places of the south, suggests a walled enclosure for flocks that grew into a hamlet."
    - "No site has been fixed. The lists put it beside Beersheba and Moladah, in the Beersheba valley, and surveys have proposed several ruins east of the city, up to about 12 km away: Khirbet el-Watan, Tel Masos and others; the shifting order of the lists and the many small Iron Age sites of the valley leave the choice open. Nothing has been excavated under the name, and the place has no history beyond its four mentions."
    - "The ground is today the eastern outskirts of Beersheba in Israel, farmland and Bedouin villages along the Beersheba stream, with Tel Masos a low mound by the Beersheba stream."
  ru:
    - "Хацар-Шуал, «двор шакала» или «двор лисицы», — селение Негева, сухого юга Иудеи вокруг Вирсавии. Оно известно только по спискам. Иисус Навин называет его среди городов Иуды «в смежности с Идумеею на юге», рядом с Вирсавией, и снова среди городов Симеона, удел которого лежал внутри удела сынов Иудиных; свиток Симеона в Паралипоменоне повторяет: «Они жили в Вирсавии, Моладе, Хацаршуале», а после плена сыновья Иуды снова поселились «в Хацар-Шуале, в Вирсавии и зависящих от нее городах». Имя, как и у других южных мест на «хацар», говорит об огороженном загоне для скота, выросшем в деревушку."
    - "Место не установлено. Списки ставят его рядом с Вирсавией и Моладой, в долине Вирсавии, и обследования предлагали несколько развалин к востоку от города, до 12 км от него: Хирбет-эль-Ватен, Тель-Масос и другие; меняющийся порядок списков и множество мелких поселений железного века в долине оставляют выбор открытым. Под этим именем ничего не раскопано, и у места нет истории сверх четырёх упоминаний."
    - "Сегодня это восточные окраины Беэр-Шевы в Израиле, поля и бедуинские селения вдоль потока Беэр-Шева, а Тель-Масос — невысокий холм у потока Беэр-Шева."
  uk:
    - "Хацар-Шуал, «огорожа шакала» або «лисиці», було селом Негеву, сухого півдня Юди довкола Беер-Шеви. Воно відоме лише з переліків. Книга Ісуса Навина називає його серед міст Юди «проти гряницї Ідумейської в полуденнїй країнї», поряд з Беер-Шевою, і знову серед міст Симеона, чий уділ лежав «серед наслїдньої держави Юдиних синів»; літописців перелік Симеона повторює, що «Вони жили в Бирсабії, Моладї, Хазаршуалї», а після вигнання юдеї поселилися знову «В Хазар-Шуалї, в Бирсабії й залежних від неї містах». Його назва, як і в інших «хацер»-місць півдня, наводить на думку про обнесену огорожу для отар, що виросла в хутір."
    - "Місце не визначено. Переліки ставлять його поруч з Беер-Шевою й Моладою, в долині Беер-Шеви, і обстеження запропонували кілька руїн на схід від міста, до приблизно 12 км: Хірбет-ель-Ватан, Тель-Масос та інші; мінливий порядок переліків і численні малі пам’ятки залізного віку долини лишають вибір відкритим. Під цією назвою нічого не розкопано, і місце не має історії поза чотирма згадками."
    - "Ця місцевість нині — східні околиці Беер-Шеви в Ізраїлі, рілля й бедуїнські села вздовж потоку Беер-Шева, з Тель-Масосом, низьким городищем біля потоку Беер-Шева."
  es:
    - "Hazar-sual, «recinto del chacal» o «de la zorra», era una aldea del Néguev, el sur árido de Judá en torno a Beerseba. Se conoce solo por listas. Josué la nombra entre las ciudades de Judá «hacia el término de Edom al mediodía», junto a Beerseba, y de nuevo entre las de Simeón, cuya heredad estaba «entre la heredad de los hijos de Judá»; la nómina de Simeón del Cronista repite que «habitaron en Beer-seba, y en Molada, y en Hasar-sual», y tras el destierro hombres de Judá se establecieron otra vez «en Hasar-sual, y en Beer-seba, y en sus aldeas». Su nombre, como el de los demás lugares del sur cuyo nombre empieza por hazar, sugiere un recinto amurallado para rebaños que se convirtió en caserío."
    - "No se ha fijado ningún sitio. Las listas la ponen junto a Beerseba y Molada, en el valle de Beerseba, y las prospecciones han propuesto varias ruinas al este de la ciudad, hasta unos 12 km de distancia: Khirbet el-Watan, Tel Masos y otras; el orden cambiante de las listas y los muchos pequeños yacimientos de la Edad del Hierro del valle dejan la elección abierta. Nada se ha excavado bajo ese nombre, y el lugar no tiene más historia que sus cuatro menciones."
    - "El terreno es hoy la periferia oriental de Beerseba, en Israel, tierras de cultivo y aldeas beduinas a lo largo del arroyo de Beerseba, con Tel Masos como un montículo bajo junto al arroyo de Beerseba."
  pt:
    - "Hazar-Sual, “recinto do chacal” ou “da raposa”, era uma aldeia do Neguebe, o sul seco de Judá em torno de Berseba. É conhecida apenas por listas. Josué a nomeia entre as cidades de Judá “em direção à fronteira de Edom, no Sul”, junto a Berseba, e de novo entre as cidades de Simeão, cuja herança ficava “no meio da herança dos filhos de Judá”; o rol de Simeão do cronista repete que “Eles moravam em Berseba, Molada, Hazar-Sual”, e depois do exílio homens de Judá se estabeleceram de novo “em Hazar-Sual, em Berseba e seus povoados”. Seu nome, como o de outros lugares hazer do sul, sugere um recinto murado para rebanhos que se tornou povoado."
    - "Nenhum sítio foi fixado. As listas a põem ao lado de Berseba e Moladá, no vale de Berseba, e prospecções propuseram várias ruínas a leste da cidade, até cerca de 12 km: Khirbet el-Watan, Tel Masos e outras; a ordem variável das listas e os muitos pequenos sítios da Idade do Ferro no vale deixam a escolha em aberto. Nada foi escavado sob o nome, e o lugar não tem história além de suas quatro menções."
    - "O terreno é hoje a periferia oriental de Berseba, em Israel, terras agrícolas e aldeias beduínas ao longo do riacho de Berseba, com Tel Masos um monte baixo junto ao riacho de Berseba."
  de:
    - "Hazar-Schual, „Gehöft des Schakals“ oder „des Fuchses“, war ein Dorf im Negev, dem trockenen Süden Judas um Beerscheba. Es ist nur aus Listen bekannt. Josua nennt es unter den Städten Judas „an der Grenze der Edomiter gegen Mittag“, neben Beerscheba, und noch einmal unter den Städten Simeons, dessen Erbteil „unter dem Erbteil der Kinder Juda“ lag; die Simeon-Liste des Chronisten wiederholt: „Sie wohnten aber zu Beer-Seba, Molada, Hazar-Sual“, und nach dem Exil siedelten Männer Judas wieder in „Hazar-Sual, Beer-Seba und ihren Ortschaften“. Sein Name legt wie der der anderen Hazer-Orte des Südens ein ummauertes Gehöft für Herden nahe, das zu einem Weiler heranwuchs."
    - "Keine Stätte ist festgelegt. Die Listen setzen es neben Beerscheba und Molada, im Beerschebatal, und Surveys haben mehrere Ruinen östlich der Stadt vorgeschlagen, bis etwa 12 km entfernt: Chirbet el-Watan, Tel Masos und andere; die wechselnde Reihenfolge der Listen und die vielen kleinen eisenzeitlichen Stätten des Tals lassen die Wahl offen. Unter dem Namen ist nichts ausgegraben, und der Ort hat außer seinen vier Erwähnungen keine Geschichte."
    - "Das Gelände sind heute die östlichen Außenbezirke von Beerscheba in Israel, Ackerland und Beduinendörfer entlang des Beerschebabachs, mit Tel Masos als niedrigem Hügel am Beerschebabach."
  fr:
    - "Hatsar-Schual, « enclos du chacal » ou « du renard », était un village du Négev, le sud aride de Juda autour de Beer-Schéba. Elle n’est connue que par des listes. Josué la nomme parmi les villes de Juda « vers la frontière d’Édom », au midi, à côté de Beer-Schéba, puis parmi les villes de Siméon, dont l’héritage se trouvait « au milieu de l’héritage des fils de Juda » ; la liste de Siméon du Chroniqueur répète : « Ils habitaient à Beer-Schéba, à Molada, à Hatsar-Schual », et après l’exil des hommes de Juda s’établirent de nouveau « à Hatsar-Schual, à Beer-Schéba, et dans les lieux de son ressort ». Son nom, comme celui des autres lieux en hatsar du sud, suggère un enclos fortifié pour les troupeaux devenu hameau."
    - "Aucun site n’a été fixé. Les listes la placent à côté de Beer-Schéba et de Molada, dans la vallée de Beer-Schéba, et des prospections ont proposé plusieurs ruines à l’est de la ville, jusqu’à environ 12 km : Khirbet el-Watan, Tel Masos et d’autres ; l’ordre changeant des listes et les nombreux petits sites de l’âge du Fer de la vallée laissent le choix ouvert. Rien n’a été fouillé sous ce nom, et le lieu n’a pas d’histoire au-delà de ses quatre mentions."
    - "Le terrain est aujourd’hui la périphérie orientale de Beer-Schéba, en Israël, avec des terres cultivées et des villages bédouins le long du cours d’eau de Beer-Schéba, et Tel Masos, un tertre bas au bord de ce cours d’eau."
  pl:
    - "Chasar-Szual, „zagroda szakala” lub „lisa”, było wsią w Negewie, suchym południu Judy wokół Beer-Szeby. Znane jest tylko z wykazów. Jozue wymienia je wśród miast Judy „podle granicy Edom ku południowi”, obok Beer-Szeby, i ponownie wśród miast Symeona, którego dziedzictwo leżało „w pośród dziedzictwa synów Judowych”; wykaz Symeona u Kronikarza powtarza, że „mieszkali w Beerseba i w Molada, i w Hasersual”, a po wygnaniu mężowie Judy osiedlili się znów „w Hasersual, i w Beersabe i we wsiach jego”. Nazwa, jak inne miejsca z hazer na południu, wskazuje obwarowaną zagrodę dla trzód, która wyrosła na osadę."
    - "Miejsca nie ustalono. Wykazy umieszczają je obok Beer-Szeby i Molady, w dolinie Beer-Szeby, a badania powierzchniowe proponowały kilka ruin na wschód od miasta, do około 12 km: Chirbet el-Watan, Tel Masos i inne; zmienna kolejność wykazów i liczne małe stanowiska z epoki żelaza w dolinie pozostawiają wybór otwarty. Pod tą nazwą nic nie wykopano, a miejsce nie ma dziejów poza czterema wzmiankami."
    - "Teren to dziś wschodnie przedmieścia Beer-Szeby w Izraelu, pola i wsie beduińskie wzdłuż potoku Beer-Szeby, z Tel Masos jako niskim pagórkiem przy tym potoku."
  it:
    - "Cazar-Sual, «recinto dello sciacallo» o «della volpe», era un villaggio del Negheb, il secco sud di Giuda attorno a Bersabea. È noto solo da elenchi. Giosuè lo nomina fra le città di Giuda «verso il confine di Edom, dal lato di mezzogiorno», accanto a Bersabea, e di nuovo fra le città di Simeone, la cui eredità era «in mezzo all’eredità de’ figliuoli di Giuda»; l’elenco di Simeone del Cronista ripete: «Si stabilirono a Beer-Sceba, a Molada, ad Hatsar-Shual», e dopo l’esilio uomini di Giuda si stabilirono di nuovo «in Atsar-Shual, in Beer-Sceba e ne’ luoghi che ne dipendevano». Il suo nome, come quello degli altri luoghi del sud con hazer, suggerisce un recinto murato per il bestiame divenuto una borgata."
    - "Nessun sito è stato fissato. Gli elenchi lo pongono accanto a Bersabea e Molada, nella valle di Bersabea, e le ricognizioni hanno proposto varie rovine a est della città, fino a circa 12 km di distanza: Khirbet el-Watan, Tel Masos e altre; l’ordine variabile degli elenchi e i molti piccoli siti dell’età del Ferro della valle lasciano aperta la scelta. Nulla è stato scavato sotto questo nome, e il luogo non ha storia oltre alle sue quattro menzioni."
    - "Il terreno è oggi la periferia orientale di Bersabea in Israele, campi e villaggi beduini lungo il torrente di Bersabea, con Tel Masos un basso tell presso il torrente di Bersabea."
  nl:
    - "Hazar-Sual, “omheining van de jakhals” of “van de vos”, was een dorp in de Negev, het droge zuiden van Juda rond Berseba. Het is alleen uit lijsten bekend. Jozua noemt het onder de steden van Juda “tot de landpale van Edom, tegen het zuiden”, naast Berseba, en opnieuw onder de steden van Simeon, wiens erfdeel was “in het midden van het erfdeel der kinderen van Juda”; de lijst van Simeon in Kronieken herhaalt dat “zij woonden te Ber-seba, en te Molada, en te Hazar-Sual”, en na de ballingschap vestigden mannen van Juda zich weer “te Hazar-Sual, en in Ber-Seba, en haar onderhorige plaatsen”. De naam wijst, zoals die van andere hazer-plaatsen in het zuiden, op een ommuurde omheining voor kudden die tot een gehucht uitgroeide."
    - "Geen plaats is vastgesteld. De lijsten plaatsen het naast Berseba en Molada, in de vallei van Berseba, en onderzoeken hebben verscheidene ruïnes ten oosten van de stad voorgesteld, tot ongeveer 12 km ver: Khirbet el-Watan, Tel Masos en andere; de wisselende volgorde van de lijsten en de vele kleine IJzertijdplaatsen in de vallei laten de keuze open. Onder die naam is niets opgegraven, en de plaats heeft geen geschiedenis buiten haar vier vermeldingen."
    - "Het gebied is nu de oostelijke buitenwijk van Berseba in Israël, akkerland en bedoeïenendorpen langs de beek van Berseba, met Tel Masos als lage heuvel bij de beek van Berseba."
  cs:
    - "Chacar-šúal, „ohrada šakala“ nebo „lišky“, byla vesnice v Negevu, suchém jihu Judska kolem Beer-šeby. Je známa jen ze seznamů. Jozue ji uvádí mezi městy Judovými „podlé pomezí Edom na poledne“, vedle Beer-šeby, a znovu mezi městy Simeonovými, jejichž dědictví leželo „u prostřed dědictví synů Juda“; kronikářův soupis Simeona opakuje: „Bydlili pak v Bersabé a Molada a v Azarsual“, a po exilu se Judovci usadili znovu „A v Azarsual, v Bersabé i v vesnicích jeho“. Jméno, jako jiná místa s chacar na jihu, naznačuje opevněnou ohradu pro stáda, která vyrostla v osadu."
    - "Žádné místo nebylo určeno. Seznamy ji kladou vedle Beer-šeby a Molady, do údolí Beer-šeby, a průzkumy navrhly několik zřícenin východně od města, až asi 12 km daleko: Chirbet el-Watan, Tel Masos a další; měnící se pořadí seznamů a mnoho malých sídlišť doby železné v údolí nechávají volbu otevřenou. Nic nebylo vykopáno pod tímto jménem a místo nemá historii mimo své čtyři zmínky."
    - "Půda je dnes východním okrajem Beer-šeby v Izraeli, zemědělská půda a beduínské vesnice podél beer-šebského potoka, s Tel Masos jako nízkým pahorkem u beer-šebského potoka."
  sv:
    - "Hasar-Shual, ”schakalens inhägnad” eller ”rävens”, var en by i Negev, Judas torra söder kring Beer Sheva. Den är känd bara från förteckningar. Josua nämner den bland Judas städer ”mot Edoms gräns, i Sydlandet”, bredvid Beer Sheva, och åter bland Simeons städer, vars arvedel låg ”inom Juda barns arvedel”; krönikeskrivarens förteckning över Simeon upprepar att ”de bodde i Beer-Seba, Molada och Hasar-Sual”, och efter exilen bodde Juda män åter i ”Hasar-Sual, så ock i Beer-Seba och underlydande orter”. Dess namn, liksom de andra hazer-platserna i söder, antyder en muromgärdad inhägnad för hjordar som växte till en by."
    - "Ingen plats har fastställts. Förteckningarna placerar den bredvid Beer Sheva och Molada, i Beer Sheva-dalen, och undersökningar har föreslagit flera ruiner öster om staden, upp till omkring 12 km bort: Khirbet el-Watan, Tel Masos och andra; förteckningarnas växlande ordning och dalens många små platser från järnåldern lämnar valet öppet. Ingenting har grävts ut under namnet, och platsen har ingen historia utöver sina fyra omnämnanden."
    - "Marken är i dag Beer Shevas östra utkanter i Israel, åkermark och beduinbyar längs Beer Sheva-bäcken, med Tel Masos som en låg kulle vid bäcken."
  nb:
    - "Hasar-Sjual, «sjakalens innhegning» eller «revens», var en landsby i Negev, det tørre sørlige Juda rundt Beer-Sjeba. Den er bare kjent fra lister. Josva nevner den blant Judas byer «mot Edoms landemerke, i sydlandet», ved siden av Beer-Sjeba, og igjen blant Simeons byer, hvis arvelodd lå «inne i Judas barns arvelodd»; kronikerens liste over Simeon gjentar at «De bodde i Be'erseba og Molada og Hasar-Sual», og etter eksilet bosatte Judas menn seg igjen «i Hasar-Sual, Be'erseba med tilhørende småbyer». Navnet, som de andre hasar-stedene i sør, antyder en inngjerdet innhegning for flokker som vokste til en liten landsby."
    - "Ingen lokalitet er fastlagt. Listene setter den ved siden av Beer-Sjeba og Molada, i Beer-Sjeba-dalen, og undersøkelser har foreslått flere ruiner øst for byen, opptil omtrent 12 km unna: Khirbet el-Watan, Tel Masos og andre; den skiftende rekkefølgen i listene og de mange små jernalderstedene i dalen lar valget stå åpent. Ingenting er gravd ut under navnet, og stedet har ingen historie utover sine fire omtaler."
    - "Grunnen er i dag de østlige utkantene av Beer-Sjeba i Israel, jordbruksland og beduinlandsbyer langs Beer-Sjeba-bekken, med Tel Masos som en lav haug ved bekken."
