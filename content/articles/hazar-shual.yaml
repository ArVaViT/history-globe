# Overview article (ADR 0007). Mainstream facts only; the town is unlocated and the candidates are given without choosing; a minor place, said so.
id: hazar-shual
place: a89005a
title:
  en: "Hazar-shual"
  ru: "Хацар-Шуал"
body:
  en:
    - "Hazar-shual, “enclosure of the jackal” or “of the fox”, was a village of the Negeb, the dry south of Judah around Beersheba. It is known only from lists. Joshua names it among the towns of Judah “toward the coast of Edom southward”, next to Beersheba, and again among the towns of Simeon, whose inheritance lay “within the inheritance of the children of Judah”; the Chronicler's roll of Simeon repeats that “they dwelt at Beer-sheba, and Moladah, and Hazar-shual”, and after the exile men of Judah settled once more “at Hazar-shual, and at Beer-sheba, and in the villages thereof”. Its name, like the other hazer places of the south, suggests a walled enclosure for flocks that grew into a hamlet."
    - "No site has been fixed. The lists put it beside Beersheba and Moladah, in the Beersheba valley, and surveys have proposed several ruins east of the city, up to about 12 km away: Khirbet el-Watan, Tel Masos and others; the shifting order of the lists and the many small Iron Age sites of the valley leave the choice open. Nothing has been excavated under the name, and the place has no history beyond its four mentions."
    - "The ground is today the eastern outskirts of Beersheba in Israel, farmland and Bedouin villages along the Beersheba stream, with Tel Masos a low mound by the Beersheba stream."
  ru:
    - "Хацар-Шуал, «двор шакала» или «двор лисицы», — селение Негева, сухого юга Иудеи вокруг Вирсавии. Оно известно только по спискам. Иисус Навин называет его среди городов Иуды «в смежности с Идумеею на юге», рядом с Вирсавией, и снова среди городов Симеона, удел которого лежал внутри удела сынов Иудиных; свиток Симеона в Паралипоменоне повторяет: «Они жили в Вирсавии, Моладе, Хацаршуале», а после плена сыновья Иуды снова поселились «в Хацар-Шуале, в Вирсавии и зависящих от нее городах». Имя, как и у других южных мест на «хацар», говорит об огороженном загоне для скота, выросшем в деревушку."
    - "Место не установлено. Списки ставят его рядом с Вирсавией и Моладой, в долине Вирсавии, и обследования предлагали несколько развалин к востоку от города, до 12 км от него: Хирбет-эль-Ватен, Тель-Масос и другие; меняющийся порядок списков и множество мелких поселений железного века в долине оставляют выбор открытым. Под этим именем ничего не раскопано, и у места нет истории сверх четырёх упоминаний."
    - "Сегодня это восточные окраины Беэр-Шевы в Израиле, поля и бедуинские селения вдоль потока Беэр-Шева, а Тель-Масос — невысокий холм у потока Беэр-Шева."
