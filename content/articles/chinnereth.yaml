body:
  en:
    - "Chinnereth was a fortified town on the north-western shore of the lake that took its name from it, the sea of Chinnereth, today's Sea of Galilee or Kinneret. The town is Tel Kinrot (Tell el-Oreimeh), a steep mound above the shore between Tabgha and Ginosar, named in the list of Thutmose III at Karnak in the fifteenth century BC. Excavations by Volkmar Fritz from 1982 and by the Kinneret Regional Project since 2003 have uncovered a Middle Bronze fortified city and, above it, a large walled town of the early Iron Age, with houses, storerooms and a massive city wall, that flourished about the eleventh and tenth centuries and was destroyed, and a smaller Israelite town of the ninth and eighth centuries. The lake's later name Gennesaret, and the plain of Gennesar that Josephus praised, carry on the old name of the town."
    - "In the Bible the name serves mostly as a landmark. Moses describes the land east of the Jordan as reaching “from Chinnereth even unto the sea of the plain, even the salt sea”, and the sea of Chinnereth marks the eastern border of the promised land and of Sihon's old kingdom. Jabin's allies gathered from “the plains south of Chinneroth”, and the town itself stands among the fenced cities of Naphtali, “Ziddim, Zer, and Hammath, Rakkath, and Chinnereth”, the last two beside Tiberias and at Tel Kinrot. Its one event is a defeat: when Asa of Judah bought the help of Ben-hadad of Damascus against Baasha, the Aramaean captains “smote Ijon, and Dan, and Abel-beth-maachah, and all Cinneroth, with all the land of Naphtali” (the Synodal text reads Ain for Ijon). By then Chinnereth meant the district round the lake as much as the town."
    - "Today the mound stands in a nature reserve beside the Tabgha churches and Kibbutz Ginosar, with the road from Tiberias to Capernaum at its foot and the lake below."
  ru:
    - "Киннереф — укреплённый город на северо-западном берегу озера, которое получило от него имя: море Киннереф, нынешнее Галилейское море, или Кинерет. Город — это Тель-Кинрот (Телль-эль-Орейме), крутой холм над берегом между Табхой и Гиносаром, названный в списке Тутмоса III в Карнаке в XV веке до н. э. Раскопки Фолькмара Фрица с 1982 года и Кинеретского регионального проекта с 2003 года открыли укреплённый город среднего бронзового века, над ним — большой обнесённый стеной город раннего железного века с домами, кладовыми и мощной городской стеной, процветавший примерно в XI–X веках и разрушенный, и меньший израильский город IX–VIII веков. Позднейшее имя озера, Геннисарет, и равнина Геннисар, которую хвалил Иосиф Флавий, продолжают древнее имя города."
    - "В Библии имя служит большей частью ориентиром. Моисей описывает землю к востоку от Иордана «от Киннерефа до моря равнины, моря Соленого», а море Киннереф отмечает восточную границу обетованной земли и прежнего царства Сигона. Союзники Иавина собрались с равнины «с южной стороны Хиннарофа», а сам город стоит среди укреплённых городов Неффалима: «Циддим, Цер, Хамаф, Раккаф и Хиннереф» — два последних у Тивериады и на Тель-Кинроте. Единственное его событие — поражение: когда Аса Иудейский купил помощь Венадада Дамасского против Ваасы, арамейские военачальники поразили «Аин и Дан и Авел-Беф-Мааху и весь Киннероф, по всей земле Неффалима». К тому времени Киннереф означал и округу озера, не только город."
    - "Сегодня холм стоит в заповеднике рядом с церквами Табхи и кибуцем Гиносар, с дорогой из Тверии в Капернаум у подножия и озером внизу."
  uk:
    - "Кіннерет був укріпленим містом на північно-західному березі озера, що від нього дістало назву, моря Кіннерет, сьогоднішнього Галілейського моря, або Кінерет. Місто — це Телль-Кінрот (Телль-ель-Орейме), крутий горб над берегом між Табхою та Гінносаром, названий у списку Тутмоса III у Карнаку XV ст. до н. е. Розкопки Фолькмара Фріца від 1982 р. та Регіонального проєкту Кіннерет від 2003 р. відкрили укріплене місто середньої бронзи і над ним велике обнесене стіною місто ранньої залізної доби, з будинками, коморами та масивним міським муром, що процвітало приблизно в XI–X ст. і було зруйноване, а також менше ізраїльське місто IX–VIII ст. Пізніша назва озера Генісарет і рівнина Генісар, яку вихваляв Йосиф Флавій, продовжують стару назву міста."
    - "У Біблії ця назва здебільшого править за орієнтир. Мойсей описує землю на схід від Йордану як таку, що сягає «від Кінерета і до моря подільського, до моря Соляного», а море Кіннерет позначає східну межу обітованої землі та колишнього царства Сігона. Союзники Явіна зібралися «у степу на полуднє від Киннарота», а саме місто стоїть серед утверджених міст Нефталима: «Зиддим, Зер, Гаммат, Раккат і Хинерет», останні два — поряд із Тіверіадою і в Телль-Кінроті. Його єдина подія — поразка: коли Аса Юдейський купив допомогу Бен-Гадада Дамаського проти Вааси, арамейські отамани «звоював Анн і Дан і Абел-Бет-Мааху й увесь Киннерот, — всю землю Нефталїєву» (Синодальний текст читає Аїн замість Іййон). На той час Кіннерет означав і область навколо озера, і місто."
    - "Сьогодні горб стоїть у природному заповіднику поряд із церквами Табхи та кібуцом Гінносар, з дорогою від Тіверіади до Капернаума біля підніжжя й озером унизу."
  es:
    - "Cineret era una ciudad fortificada en la orilla noroccidental del lago que tomó de ella su nombre, el mar de Cineret, hoy mar de Galilea o Kineret. La ciudad es Tel Kinrot (Tell el-Oreimeh), un montículo escarpado sobre la orilla entre Tabgha y Ginosar, nombrado en la lista de Tutmosis III en Karnak en el siglo XV a. C. Las excavaciones de Volkmar Fritz desde 1982 y del Proyecto Regional de Kinneret desde 2003 han sacado a la luz una ciudad fortificada del Bronce Medio y, encima de ella, una gran ciudad amurallada de comienzos de la Edad del Hierro, con casas, almacenes y una maciza muralla, que floreció hacia los siglos XI y X y fue destruida, y una ciudad israelita más pequeña de los siglos IX y VIII. El nombre posterior del lago, Genesaret, y la llanura de Genesar que elogió Josefo, continúan el antiguo nombre de la ciudad."
    - "En la Biblia el nombre sirve sobre todo como punto de referencia. Moisés describe la tierra al este del Jordán como la que llega «desde Cinereth hasta la mar del llano, el mar Salado», y el mar de Cineret marca la frontera oriental de la tierra prometida y del antiguo reino de Sehón. Los aliados de Jabín se reunieron desde «el llano al mediodía de Cinneroth», y la ciudad misma figura entre las ciudades fuertes de Neftalí, «Siddim, Ser, y Hamath, Raccath, y Cinneroth», las dos últimas junto a Tiberias y en Tel Kinrot. Su único acontecimiento es una derrota: cuando Asa de Judá compró la ayuda de Ben-adad de Damasco contra Baasa, los capitanes arameos «hirieron á Ahión, y á Dan, y á Abel-beth-maachâ, y á toda Cinneroth, con toda la tierra de Nephtalí» (el texto sinodal lee Ain en lugar de Ahión). Para entonces Cineret designaba tanto el distrito en torno al lago como la ciudad."
    - "Hoy el montículo se halla en una reserva natural junto a las iglesias de Tabgha y el kibutz Ginosar, con el camino de Tiberias a Cafarnaúm a sus pies y el lago debajo."
  pt:
    - "Quinerete era uma cidade fortificada na margem noroeste do lago que dela tomou o nome, o mar de Quinerete, hoje o Mar da Galileia ou Kinneret. A cidade é Tel Kinrot (Tell el-Oreimeh), um monte íngreme acima da margem, entre Tabgha e Ginosar, nomeado na lista de Tutmés III em Carnaque, no século XV a.C. As escavações de Volkmar Fritz a partir de 1982 e do Projeto Regional Kinneret desde 2003 trouxeram à luz uma cidade fortificada do Bronze Médio e, acima dela, uma grande cidade murada do início da Idade do Ferro, com casas, depósitos e um maciço muro urbano, que floresceu por volta dos séculos XI e X e foi destruída, e uma cidade israelita menor dos séculos IX e VIII. O nome posterior do lago, Genesaré, e a planície de Genesar que Josefo louvou conservam o antigo nome da cidade."
    - "Na Bíblia o nome serve sobretudo como ponto de referência. Moisés descreve a terra a leste do Jordão como indo “desde Quinerete até o mar da Arabá, o Mar Salgado”, e o mar de Quinerete marca a fronteira oriental da terra prometida e do antigo reino de Seom. Os aliados de Jabim reuniram-se dos que estavam “na Arabá ao sul de Quinerete”, e a própria cidade está entre as cidades fortificadas de Naftali, “Zidim, Zer, Hamate, Racate, Quinerete”, as duas últimas perto de Tiberíades e em Tel Kinrot. Seu único acontecimento é uma derrota: quando Asa de Judá comprou o auxílio de Ben-Hadade de Damasco contra Baasa, ele enviou seus comandantes e “atacou Ijom, Dã, Abel-Bete-Maaca, e toda Quinerete, com toda a terra de Naftali” (o texto sinodal lê Aim em vez de Ijom). Então Quinerete designava tanto a região em torno do lago quanto a cidade."
    - "Hoje o monte fica numa reserva natural junto às igrejas de Tabgha e ao Kibutz Ginosar, com a estrada de Tiberíades a Cafarnaum ao pé e o lago abaixo."
  de:
    - "Kinneret war eine befestigte Stadt am Nordwestufer des Sees, der nach ihr benannt wurde, des Meeres Kinneret, des heutigen Sees Genezareth oder Kinneret. Die Stadt ist Tel Kinrot (Tell el-Oreimeh), ein steiler Hügel über dem Ufer zwischen Tabgha und Ginosar, in der Liste Thutmosis’ III. in Karnak im 15. Jahrhundert v. Chr. genannt. Ausgrabungen unter Volkmar Fritz ab 1982 und des Kinneret Regional Project seit 2003 haben eine befestigte Stadt der Mittleren Bronzezeit und darüber eine große ummauerte Stadt der frühen Eisenzeit freigelegt, mit Häusern, Vorratsräumen und einer massiven Stadtmauer, die etwa im 11. und 10. Jahrhundert blühte und zerstört wurde, sowie eine kleinere israelitische Stadt des 9. und 8. Jahrhunderts. Der spätere Name des Sees, Genezareth, und die Ebene von Genezar, die Josephus pries, führen den alten Namen der Stadt fort."
    - "In der Bibel dient der Name meist als Orientierungspunkt. Mose beschreibt das Land östlich des Jordan als Gebiet „von Kinnereth an bis an das Meer am Gefilde, das Salzmeer“, und das Meer Kinneret bezeichnet die Ostgrenze des verheißenen Landes und des alten Königreichs Sihons. Die Verbündeten Jabins versammelten sich aus „dem Gefilde gegen Mittag von Kinneroth“, und die Stadt selbst steht unter den festen Städten Naftalis, „Ziddim, Zer, Hammath, Rakkath, Kinnereth“, die beiden letzten bei Tiberias und Tel Kinrot. Ihr einziges Ereignis ist eine Niederlage: Als Asa von Juda gegen Baesa die Hilfe Ben-Hadads von Damaskus erkaufte, schlugen dessen Hauptleute „Ijon und Dan und Abel-Beth-Maacha, das ganze Kinneroth samt dem Lande Naphthali“ (der synodale Text liest Ain statt Ijon). Damals bezeichnete Kinneret ebenso die Gegend rings um den See wie die Stadt."
    - "Heute steht der Hügel in einem Naturschutzgebiet neben den Kirchen von Tabgha und dem Kibbuz Ginosar, mit der Straße von Tiberias nach Kapernaum an seinem Fuß und dem See darunter."
  fr:
    - "Kinnéreth était une ville fortifiée de la rive nord-ouest du lac qui lui doit son nom, la mer de Kinnéreth, l’actuelle Mer de Galilée ou Kinneret. C’est Tel Kinrot (Tell el-Oreimeh), un tertre escarpé au-dessus du rivage entre Tabgha et Ginosar, cité dans la liste de Thoutmosis III à Karnak (XVe siècle av. J.-C.). Les fouilles de Volkmar Fritz dès 1982 et du Kinneret Regional Project depuis 2003 ont révélé une cité fortifiée du Bronze moyen et, au-dessus, une grande ville murée du début de l’âge du Fer, avec maisons, magasins et massif rempart, prospère vers les XIe et Xe siècles puis détruite, et une ville israélite plus petite des IXe et VIIIe siècles. Le nom ultérieur du lac, Génésareth, et la plaine de Génésar louée par Josèphe perpétuent l’ancien nom de la ville."
    - "Dans la Bible, le nom sert surtout de repère. Moïse décrit le pays à l’est du Jourdain comme allant « depuis Kinnéreth jusqu’à la mer de la plaine, la mer Salée », et la mer de Kinnéreth marque la frontière orientale de la terre promise et de l’ancien royaume de Sihon. Les alliés de Jabin se rassemblèrent de « la plaine au midi de Kinnéreth », et la ville figure elle-même parmi les villes fortes de Nephthali, « Tsiddim, Tser, Hammath, Rakkath, Kinnéreth », les deux dernières près de Tibériade et à Tel Kinrot. Son seul événement est une défaite : quand Asa de Juda acheta l’aide de Ben-Hadad de Damas contre Baescha, les chefs araméens frappèrent « Ijjon, Dan, Abel-Beth-Maaca, tout Kinneroth, et tout le pays de Nephthali » (le texte synodal lit Aïn pour Ijjon). À cette date, Kinnéreth désignait autant la région autour du lac que la ville."
    - "Aujourd’hui, le tertre se dresse dans une réserve naturelle à côté des églises de Tabgha et du kibboutz Ginosar, avec la route de Tibériade à Capernaüm à son pied et le lac en contrebas."
  it:
    - "Chinnerèt era una città fortificata sulla riva nord-occidentale del lago che da essa prese il nome, il mare di Chinnerèt, oggi Lago di Tiberiade o Kinneret. La città è Tel Kinrot (Tell el-Oreimeh), un ripido tell sopra la riva fra Tabgha e Ginosar, nominata nell’elenco di Tutmosi III a Karnak nel XV secolo a.C. Gli scavi di Volkmar Fritz dal 1982 e del Kinneret Regional Project dal 2003 hanno portato alla luce una città fortificata del Bronzo Medio e, sopra di essa, una grande città murata della prima età del Ferro, con case, magazzini e una massiccia cinta, fiorita intorno all’XI e al X secolo e poi distrutta, e una città israelita più piccola dei secoli IX e VIII. Il nome più tardo del lago, Gennesaret, e la piana di Gennesar lodata da Giuseppe Flavio perpetuano l’antico nome della città."
    - "Nella Bibbia il nome serve per lo più da punto di riferimento. Mosè descrive il paese a est del Giordano come esteso «da Kinnereth fino il mare della pianura, il mar Salato», e il mare di Chinnerèt segna il confine orientale della terra promessa e dell’antico regno di Sicon. Gli alleati di Iabin si radunarono «nella pianura al sud di Kinnereth», e la città stessa figura fra le città fortificate di Neftali: «Tsiddim, Tser, Hammath, Rakkath, Kinnereth», le ultime due accanto a Tiberiade e a Tel Kinrot. Il suo solo evento è una sconfitta: quando Asa di Giuda comprò l’aiuto di Ben-Adad di Damasco contro Baasa, il re aramaico mandò i suoi capitani ed «espugnò Ijon, Dan, Abel-Beth-Maaca, tutta la contrada di Kinneroth con tutto il paese di Neftali» (il testo sinodale ha Ain al posto di Ijon). A quel tempo Chinnerèt indicava il distretto intorno al lago non meno della città."
    - "Oggi il tell sorge in una riserva naturale accanto alle chiese di Tabgha e al kibbutz Ginosar, con la strada da Tiberiade a Cafarnao ai suoi piedi e il lago sotto."
  pl:
    - "Kinneret było ufortyfikowanym miastem na północno-zachodnim brzegu jeziora, które od niego wzięło nazwę, morza Kinneret, dzisiejszego Jeziora Galilejskiego, czyli Kinneret. Miasto to Tel Kinrot (Tell el-Oreime), stromy kopiec nad brzegiem między Tabgą a Ginosar, wymieniony na liście Totmesa III w Karnaku w XV w. p.n.e. Wykopaliska Volkmara Fritza od 1982 r. i Kinneret Regional Project od 2003 r. odsłoniły ufortyfikowane miasto ze środkowej epoki brązu, a nad nim duże obwarowane miasto z wczesnej epoki żelaza, z domami, magazynami i masywnym murem miejskim, które kwitło około XI i X w. i zostało zniszczone, oraz mniejsze izraelskie miasto z IX i VIII w. Późniejsza nazwa jeziora, Genezaret, i równina Genezar, którą chwalił Józef Flawiusz, przenoszą dawną nazwę miasta."
    - "W Biblii nazwa służy głównie jako punkt orientacyjny. Mojżesz opisuje ziemię na wschód od Jordanu jako sięgającą „od Cyneret aż do morza pustego, które jest morze słone”, a morze Kinneret wyznacza wschodnią granicę ziemi obiecanej i dawnego królestwa Sychona. Sprzymierzeńcy Jabina zebrali się z krain „na południe Cynerot, i w równinach”, a samo miasto znajduje się wśród warownych miast Neftalego: „Assedym Ser, i Emat, Rekat, i Cyneret”, przy czym dwa ostatnie leżą obok Tyberiady i w Tel Kinrot. Jego jedyne wydarzenie to klęska: gdy Asa judzki kupił pomoc Ben-Hadada z Damaszku przeciw Baaszy, Ben-Hadad posłał swych dowódców i „zburzył Hijon i Dan i Abelbetmaachę, i wszystko Cynnerot, i wszystkę ziemię Neftalim” (tekst synodalny ma Ain zamiast Ijjon). Wtedy Kinneret oznaczało już okolicę wokół jeziora tak samo jak miasto."
    - "Dziś kopiec leży w rezerwacie przyrody obok kościołów w Tabgha i kibucu Ginosar, z drogą z Tyberiady do Kafarnaum u podnóża i jeziorem poniżej."
  nl:
    - "Kinneret was een versterkte stad aan de noordwestoever van het meer dat naar haar is genoemd, het meer van Kinneret, het huidige Meer van Galilea of Kinneret. De stad is Tel Kinrot (Tell el-Oreimeh), een steile heuvel boven de oever tussen Tabgha en Ginosar, genoemd in de lijst van Thoetmosis III te Karnak uit de vijftiende eeuw v.Chr. Opgravingen door Volkmar Fritz vanaf 1982 en door het Kinneret Regional Project sinds 2003 hebben een versterkte stad uit de Midden-Bronstijd blootgelegd en daarboven een grote ommuurde stad uit de vroege IJzertijd, met huizen, opslagruimten en een massieve stadsmuur, die omstreeks de elfde en tiende eeuw bloeide en werd verwoest, en een kleinere Israëlitische stad uit de negende en achtste eeuw. De latere naam van het meer, Gennesaret, en de vlakte van Gennesar die Flavius Josephus prees, zetten de oude naam van de stad voort."
    - "In de Bijbel dient de naam meestal als oriëntatiepunt. Mozes laat het land ten oosten van de Jordaan reiken “van Cinnereth af tot aan de zee des vlakken velds, de Zoutzee”, en het meer van Kinneret markeert de oostgrens van het beloofde land en van Sihons oude koninkrijk. Jabins bondgenoten kwamen uit “het vlakke, tegen het zuiden van Cinneroth”, en de stad zelf staat onder de vaste steden van Naftali, “Ziddim, Zer en Hammath, Rakkath en Cinnereth”, de laatste twee naast Tiberias en bij Tel Kinrot. Haar enige gebeurtenis is een nederlaag: toen Asa van Juda Ben-Hadad van Damascus tegen Baësa inhuurde, “zond” deze “de oversten … tegen de steden van Israël; en sloeg Ijon, en Dan, en Abel Beth-Maacha, en het ganse Cinneroth, met het ganse land Nafthali” (de Synodale tekst leest Ain voor Ijon). Toen betekende Kinneret het gebied rond het meer evenzeer als de stad."
    - "Tegenwoordig ligt de heuvel in een natuurreservaat naast de kerken van Tabgha en kibboets Ginosar, met de weg van Tiberias naar Kafarnaüm aan de voet en het meer eronder."
  cs:
    - "Kineret bylo opevněné město na severozápadním břehu jezera, které od něj dostalo jméno, moře Kineret, dnešního Galilejského jezera neboli Kinneretu. Město je Tel Kinrot (Tell el-Oreimeh), příkrý pahorek nad břehem mezi Tabghou a Ginosarem, jmenovaný v seznamu Thutmosise III. v Karnaku v 15. století př. n. l. Vykopávky Volkmara Fritze od roku 1982 a Kinneret Regional Project od roku 2003 odkryly ze střední doby bronzové opevněné město a nad ním velké hrazené město rané doby železné s domy, sklady a mohutnou hradbou, které vzkvétalo kolem 11. a 10. století a bylo zničeno, a menší izraelské město z 9. a 8. století. Pozdější jméno jezera Genezaret a Genezarská rovina, kterou Josephus vychvaloval, nesou dál staré jméno města."
    - "V Bibli slouží jméno většinou jako orientační bod. Mojžíš popisuje zemi východně od Jordánu jako sahající „od Ceneret až k moři pustému, jenž jest moře slané“ a moře Kineret označuje východní hranici zaslíbené země i dávného království Sichonova. Jabínovi spojenci byli králové, kteří bydleli „na rovinách ku polední Ceneret“, a samo město stojí mezi hrazenými městy Neftalí, „Assedim, Ser a Emat, Rechat a Ceneret“, z nichž poslední dvě leží u Tiberiady a na Tel Kinrot. Jeho jedinou událostí je porážka: když Asa judský koupil pomoc Ben-hadada damašského proti Baešovi, Ben-hadad poslal proti izraelským městům velitele svých vojsk a „dobyl Jon a Dan, též Abelbetmaachy, i všeho Ceneretu, a vší země Neftalím“ (synodální text čte Ajin místo Ijónu). Tou dobou znamenal Kineret právě tak okolí jezera jako město."
    - "Dnes stojí pahorek v přírodní rezervaci vedle tabžských kostelů a kibucu Ginosar, s cestou z Tiberiady do Kafarnaum u úpatí a jezerem pod ním."
