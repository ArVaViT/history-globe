# Overview article (ADR 0007). Mainstream facts only; Avigad's wall is the usual identification; whether Nehemiah's wall used it is debated and given as such.
id: broad-wall
place: ab0d85b
title:
  en: "Broad Wall"
  ru: "Стена широкая"
  uk: "Широка стіна"
  es: "Muro Ancho"
  pt: "Muralha Larga"
  de: "Breite Mauer"
  fr: "Muraille large"
  it: "Muro Largo"
  pl: "Szeroki Mur"
  nl: "Brede Muur"
  cs: "Široká hradba"
  sv: "Breda muren"
body:
  en:
    - "The Broad Wall was a stretch of Jerusalem's wall on the north-western side of the city, named twice in Nehemiah. In the roll of the builders, the goldsmiths and the perfumers “fortified Jerusalem unto the broad wall”; at the dedication, the second choir with Nehemiah and half the people went along the wall “from beyond the tower of the furnaces even unto the broad wall”. The Hebrew verb in the first passage can also mean “left”, as the King James margin notes, and some read it that Nehemiah's builders left the western part of the old city outside their line, reaching only as far as this wall."
    - "In 1970–1971 Nahman Avigad, excavating in the Jewish Quarter of the Old City, uncovered a massive city wall about 7 m thick, traced for some 65 m. It was built in the late eighth century BC across the western hill, over the foundations of houses pulled down for it, which recalls Isaiah's words to Hezekiah's Jerusalem: “the houses have ye broken down to fortify the wall”. Most scholars identify it with Nehemiah's Broad Wall, built when the city spread west under Hezekiah. Whether it still stood as a defence in Nehemiah's day is less certain, since the Persian-period city seems to have shrunk back to the eastern ridge. A section lies open below street level in the Jewish Quarter today."
  ru:
    - "Стена широкая — участок стены Иерусалима на северо-западной стороне города, дважды упомянутый у Неемии. В перечне строителей сказано, что серебряники и мастера благовоний «восстановили Иерусалим до стены широкой»; при освящении второй хор с Неемией и половиной народа шёл «по стене от Печной башни и до широкой стены». Еврейский глагол первого места может значить и «оставили», как отмечает английская Библия короля Иакова на полях, и иные понимают, что строители Неемии оставили западную часть старого города вне своей линии и дошли только до этой стены."
    - "В 1970–1971 годах Нахман Авигад, копавший в Еврейском квартале Старого города, открыл мощную городскую стену толщиной около 7 м, прослеженную примерно на 65 м. Её построили в конце VIII века до н. э. поперёк западного холма поверх фундаментов снесённых ради неё домов, что напоминает слова Исаии к Иерусалиму Езекии: «разрушаете домы, чтобы укрепить стену». Большинство учёных отождествляют её со Стеной широкой Неемии, построенной, когда город при Езекии разросся на запад. Служила ли она ещё обороной во дни Неемии, менее ясно: город персидского времени, похоже, снова сжался до восточного хребта. Её участок открыт ниже уровня улицы в Еврейском квартале и сегодня."
  uk:
    - "Широка стіна була ділянкою єрусалимського муру на північно-західному боці міста, двічі названа в Книзі Неемії. У переліку будівничих золотарі та мироварі «поновили Ерусалим аж до муру широкої улицї»; під час посвячення другий хор із Неемією та половиною народу йшов уздовж муру «по мурі від Пічаної башти і до широкого муру». Єврейське дієслово в першому уривку може також означати «залишили», як зазначає маргінальна примітка перекладу короля Якова, і дехто так і читає, що будівничі Неемії залишили західну частину давнього міста поза своєю лінією, сягнувши лише цієї стіни."
    - "У 1970–1971 рр. Нахман Авігад, ведучи розкопки в Єврейському кварталі Старого міста, відкрив масивний міський мур завтовшки близько 7 м, прослідкований на довжину приблизно 65 м. Його збудували наприкінці VIII ст. до н. е. поперек західного пагорба, на підвалинах будинків, зруйнованих задля нього, що нагадує слова Ісаї до Єрусалима часів Єзекії: «валите декотрі доми, щоб ті проломи в мурі затулити». Більшість учених ототожнює його з Широкою стіною Неемії, збудованою, коли місто розрослося на захід за Єзекії. Чи стояв він ще як оборона за часів Неемії, менш певно, бо місто персидського періоду, схоже, стислося назад до східного хребта. Сьогодні ділянка лежить відкритою нижче рівня вулиці в Єврейському кварталі."
  es:
    - "El Muro Ancho era un tramo de la muralla de Jerusalén en el lado noroccidental de la ciudad, mencionado dos veces en Nehemías. En la lista de los constructores, los plateros y los perfumeros «dejaron reparado á Jerusalem hasta el muro ancho»; en la dedicación, el segundo coro, con Nehemías y la mitad del pueblo, iba sobre el muro «desde la torre de los Hornos hasta el muro ancho». El verbo hebreo del primer pasaje puede significar también «dejar», como señala el margen de la versión King James, y algunos lo leen en el sentido de que los constructores de Nehemías dejaron fuera de su línea la parte occidental de la ciudad antigua, llegando solo hasta este muro."
    - "En 1970–1971 Nahman Avigad, al excavar en el Barrio Judío de la Ciudad Vieja, sacó a la luz una muralla maciza de unos 7 m de grosor, seguida a lo largo de unos 65 m. Fue construida a finales del siglo VIII a. C. a través de la colina occidental, sobre los cimientos de casas derribadas para ello, lo que recuerda las palabras de Isaías a la Jerusalén de Ezequías: «derribasteis casas para fortificar el muro». La mayoría de los estudiosos la identifican con el Muro Ancho de Nehemías, construido cuando la ciudad se extendió hacia el oeste bajo Ezequías. Que siguiera en pie como defensa en tiempos de Nehemías es menos seguro, pues la ciudad del periodo persa parece haberse replegado a la loma oriental. Hoy un tramo está abierto bajo el nivel de la calle en el Barrio Judío."
  pt:
    - "A Muralha Larga era um trecho do muro de Jerusalém no lado noroeste da cidade, nomeado duas vezes em Neemias. Na relação dos construtores, os ourives e os perfumistas “fortificaram Jerusalém até a Muralha Larga”; na dedicação, o segundo coro, com Neemias e metade do povo, percorreu o muro “passando pela Torre dos Fornos, até a Muralha Larga”. O verbo hebraico da primeira passagem pode significar também “deixaram”, como anota a margem da King James, e alguns leem que os construtores de Neemias deixaram a parte ocidental da cidade antiga fora de sua linha, chegando apenas até esta muralha."
    - "Em 1970–1971, Nahman Avigad, escavando no Bairro Judeu da Cidade Velha, descobriu um maciço muro urbano de cerca de 7 m de espessura, acompanhado por uns 65 m. Foi construído no fim do século VIII a.C. atravessando a colina ocidental, sobre as fundações de casas demolidas para isso, o que lembra as palavras de Isaías à Jerusalém de Ezequias: “derrubaram as casas para fortificar o muro”. A maioria dos estudiosos o identifica com a Muralha Larga de Neemias, construída quando a cidade se estendeu para oeste sob Ezequias. Se ainda se erguia como defesa no tempo de Neemias é menos certo, pois a cidade do período persa parece ter encolhido de volta à colina oriental. Um trecho está hoje aberto abaixo do nível da rua, no Bairro Judeu."
  de:
    - "Die Breite Mauer war ein Abschnitt der Stadtmauer Jerusalems auf der nordwestlichen Seite der Stadt, zweimal im Buch Nehemia genannt. In der Liste der Erbauer „bauten aus zu Jerusalem bis an die breite Mauer“ die Goldschmiede und die Salbenbereiter; bei der Einweihung ging der zweite Dankchor mit Nehemia und der Hälfte des Volkes auf der Mauer „zum Ofenturm hinan und bis an die breite Mauer“. Das hebräische Verb in der ersten Stelle kann auch „verlassen“ bedeuten, wie der Rand der King-James-Bibel vermerkt, und manche lesen es so, dass Nehemias Bauleute den westlichen Teil der alten Stadt außerhalb ihrer Linie ließen und nur bis zu dieser Mauer reichten."
    - "In den Jahren 1970–1971 legte Nahman Avigad bei Ausgrabungen im Jüdischen Viertel der Altstadt eine massive Stadtmauer von etwa 7 m Dicke frei, die auf etwa 65 m verfolgt wurde. Sie wurde im späten 8. Jahrhundert v. Chr. quer über den Westhügel errichtet, über den Fundamenten von Häusern, die ihretwegen abgerissen worden waren, was an Jesajas Worte an das Jerusalem Hiskias erinnert: „ihr werdet die Häuser abbrechen, die Mauer zu befestigen“. Die meisten Gelehrten setzen sie mit Nehemias Breiter Mauer gleich, die gebaut wurde, als sich die Stadt unter Hiskia nach Westen ausdehnte. Ob sie zu Nehemias Zeit noch als Verteidigungswerk stand, ist weniger sicher, da die Stadt der Perserzeit sich auf den östlichen Höhenzug zurückgezogen zu haben scheint. Ein Abschnitt liegt heute unterhalb des Straßenniveaus im Jüdischen Viertel offen."
  fr:
    - "La Muraille large était un tronçon du rempart de Jérusalem du côté nord-ouest de la ville, nommé deux fois dans Néhémie. Dans la liste des bâtisseurs, les orfèvres et les parfumeurs fortifièrent Jérusalem jusqu’à la muraille large ; lors de la dédicace, le second chœur, avec Néhémie et la moitié du peuple, suivit la muraille, « au-dessus de la tour des fours », jusqu’à « la muraille large ». Le verbe hébreu du premier passage peut aussi signifier « laisser », comme le note la marge de la version du roi Jacques, et certains y lisent que les bâtisseurs de Néhémie laissèrent la partie occidentale de la vieille ville en dehors de leur tracé, n’allant que jusqu’à cette muraille."
    - "En 1970–1971, Nahman Avigad, fouillant le quartier juif de la Vieille Ville, mit au jour un massif rempart d’environ 7 m d’épaisseur, suivi sur quelque 65 m. Il fut bâti à la fin du VIIIe siècle av. J.-C. à travers la colline occidentale, au-dessus des fondations de maisons démolies à cet effet, ce qui rappelle les paroles d’Ésaïe à la Jérusalem d’Ézéchias : les maisons, « vous les abattez, pour fortifier la muraille ». La plupart des spécialistes l’identifient à la Muraille large de Néhémie, bâtie quand la ville s’étendit vers l’ouest sous Ézéchias. Qu’elle ait encore servi de défense à l’époque de Néhémie est moins certain, car la ville de l’époque perse semble s’être repliée sur la crête orientale. Un tronçon est aujourd’hui visible à ciel ouvert sous le niveau de la rue, dans le quartier juif."
  it:
    - "Il Muro Largo era un tratto delle mura di Gerusalemme sul lato nord-occidentale della città, nominato due volte in Neemia. Nell’elenco dei costruttori, gli orefici e i profumieri fortificarono Gerusalemme fino al Muro Largo; alla dedicazione, il secondo coro con Neemia e metà del popolo percorse le mura: «Passando al disopra della torre de’ Forni, esso andò fino alle mura larghe». Il verbo ebraico del primo passo può significare anche «lasciare», come nota il margine della King James, e alcuni lo leggono nel senso che i costruttori di Neemia lasciarono fuori dalla loro linea la parte occidentale della città vecchia, arrivando solo fino a questo muro."
    - "Nel 1970–1971 Nahman Avigad, scavando nel Quartiere Ebraico della Città Vecchia, portò alla luce una massiccia cinta muraria spessa circa 7 m, seguita per circa 65 m. Fu costruita alla fine dell’VIII secolo a.C. attraverso la collina occidentale, sopra le fondamenta di case demolite per farle posto, il che ricorda le parole di Isaia alla Gerusalemme di Ezechia: «demolite le case per fortificare mura». La maggior parte degli studiosi la identifica con il Muro Largo di Neemia, costruito quando la città si estese a ovest sotto Ezechia. Se ai tempi di Neemia servisse ancora da difesa è meno certo, poiché la città dell’epoca persiana sembra essersi ritirata sulla dorsale orientale. Oggi un tratto è visibile sotto il livello stradale nel Quartiere Ebraico."
  pl:
    - "Szeroki Mur był odcinkiem muru Jerozolimy po północno-zachodniej stronie miasta, wymienionym dwukrotnie w Księdze Nehemiasza. W wykazie budowniczych o złotnikach i perfumiarzach powiedziano: „Jeruzalemu zaniechali aż do muru szerokiego”; przy poświęceniu drugi chór z Nehemiaszem i połową ludu szedł po murze „od wieży Tannurym aż do muru szerokiego”. Hebrajski czasownik w pierwszym fragmencie może też znaczyć „zostawili”, jak podaje margines Biblii Króla Jakuba, i niektórzy odczytują to tak, że budowniczowie Nehemiasza pozostawili zachodnią część dawnego miasta poza swoją linią, sięgając tylko do tego muru."
    - "W latach 1970–1971 Nahman Awigad, prowadząc wykopaliska w Dzielnicy Żydowskiej Starego Miasta, odkrył masywny mur miejski o grubości około 7 m, odsłonięty na długości około 65 m. Zbudowano go pod koniec VIII w. p.n.e. w poprzek zachodniego wzgórza, na fundamentach domów rozebranych na ten cel, co przywodzi na myśl słowa Izajasza do Jerozolimy za Ezechiasza: „rozwaliliście domy na oprawę murów”. Większość uczonych utożsamia go z Szerokim Murem Nehemiasza, zbudowanym, gdy miasto rozrosło się na zachód za Ezechiasza. Czy w czasach Nehemiasza nadal stanowił obronę, jest mniej pewne, ponieważ miasto z okresu perskiego wydaje się, że skurczyło się do wschodniego grzbietu. Odcinek leży dziś odkryty poniżej poziomu ulicy w Dzielnicy Żydowskiej."
  nl:
    - "De Brede Muur was een deel van de muur van Jeruzalem aan de noordwestkant van de stad, tweemaal genoemd in Nehemia. In de lijst van de bouwers “lieten” de goudsmeden en de zalfbereiders “Jeruzalem tot aan den breden muur”; bij de inwijding ging het tweede koor met Nehemia en de helft van het volk langs de muur “van boven den Bakoventoren, tot aan den breden muur”. Het Hebreeuwse werkwoord in de eerste passage kan ook “verlaten” betekenen, zoals de kantlijn van de King James Version opmerkt, en sommigen lezen het zo dat Nehemia's bouwers het westelijke deel van de oude stad buiten hun lijn lieten en slechts tot deze muur reikten."
    - "In 1970–1971 legde Nahman Avigad, die in de Joodse wijk van de Oude Stad groef, een massieve stadsmuur bloot van ongeveer 7 m dik, over een lengte van zo'n 65 m gevolgd. Hij werd in de late achtste eeuw v.Chr. over de westelijke heuvel gebouwd, over de fundamenten van huizen die ervoor waren afgebroken, wat doet denken aan Jesaja's woorden tot het Jeruzalem van Chizkia: “gij zult huizen afbreken, om de muren te bevestigen”. De meeste geleerden identificeren hem met Nehemia's Brede Muur, gebouwd toen de stad onder Chizkia naar het westen uitbreidde. Of hij in Nehemia's tijd nog als verdediging overeind stond, is minder zeker, aangezien de stad uit de Perzische tijd lijkt te zijn teruggekrompen tot de oostelijke bergrug. Een deel ligt tegenwoordig open onder straatniveau in de Joodse wijk."
  cs:
    - "Široká hradba byl úsek jeruzalémských hradeb na severozápadní straně města, jmenovaný dvakrát u Nehemjáše. V soupisu stavitelů zlatníci a výrobci vonných mastí „nechali Jeruzaléma až do zdi široké“; při vysvěcení šel druhý průvod s Nehemjášem a polovinou lidu po hradbě „od věže Tannurim až ke zdi široké“. Hebrejské sloveso v první pasáži může znamenat „opevnit“ (tak je překládá Bible krále Jakuba), ale také „nechat“, jak uvádí její okrajová poznámka, a někteří z toho čtou, že Nehemjášovi stavitelé nechali západní část starého města mimo svou linii a došli jen k této hradbě."
    - "V letech 1970–1971 odkryl Nahman Avigad při vykopávkách v Židovské čtvrti Starého města masivní městskou hradbu silnou asi 7 m, sledovanou na délku zhruba 65 m. Byla vystavěna koncem 8. století př. n. l. napříč západním pahorkem, přes základy domů, které byly kvůli ní zbořeny, což připomíná Izajášova slova k Chizkijášovu Jeruzalému: „Domy též Jeruzalémské sečtli jste, i pobořili, abyste utvrdili zed.“ Většina badatelů ji ztotožňuje s Nehemjášovou Širokou hradbou, vystavěnou, když se město za Chizkijáše rozšířilo na západ. Zda ještě za Nehemjášových dnů stála jako obrana, je méně jisté, neboť město v perském období jako by se stáhlo zpět na východní hřeben. Jeden úsek je dnes otevřen pod úrovní ulice v Židovské čtvrti."
  sv:
    - "Breda muren var ett stycke av Jerusalems mur på stadens nordvästra sida, nämnt två gånger hos Nehemja. I förteckningen över byggarna arbetade guldsmederna och salvoberedarna, och ”det nästföljande stycket av Jerusalem lät man vara, ända till Breda muren”; vid invigningen gick den andra lovsångskören med Nehemja och halva folket längs muren, ”upp genom Ugnstornet ända till Breda muren”. Det hebreiska verbet i den första passagen kan betyda både ”lämna” och ”befästa”; King James-bibeln har ”befäste” i texten och ”lämnade” i marginalen, och somliga läser det så att Nehemjas byggare lät den västra delen av den gamla staden ligga utanför sin linje och bara nådde fram till denna mur."
    - "Åren 1970–1971 blottade Nahman Avigad, som grävde i Gamla stadens judiska kvarter, en massiv stadsmur omkring 7 m tjock, som kunde följas över cirka 65 m. Den byggdes i slutet av 700-talet f.Kr. tvärs över västra kullen, över grunderna till hus som revs för ändamålet, vilket påminner om Jesajas ord till Hiskias Jerusalem: ”I bröten ned husen för att befästa muren”. De flesta forskare identifierar den med Nehemjas Breda mur, byggd när staden under Hiskia bredde ut sig västerut. Om den ännu stod som försvar på Nehemjas tid är mindre säkert, eftersom staden under persisk tid tycks ha dragit sig tillbaka till den östra åsen. En sektion ligger i dag öppen under gatuplanet i judiska kvarteret."
