body:
  en:
    - 'Geba, whose name means "hill", was a town of Benjamin about 9 km north-north-east of Jerusalem. It is identified with the village of Jaba, which keeps the name and stands on the south side of the deep Wadi es-Suweinit, facing Michmash across the gorge. Geba, Gibeah and Gibeon all come from the same Hebrew word for "hill", and the biblical text and its translations sometimes confuse them; some scholars hold that several passages about Gibeah of Saul really mean Geba.'
    - "Joshua lists Geba among the cities of Benjamin and among the towns given to the priests, the sons of Aaron. At the start of Saul's war with the Philistines, Jonathan struck the Philistine garrison in Geba (some translations, among them the Russian Synodal, read Gibeah here). The Philistines then camped at Michmash on the other side of the gorge, and in the gorge between the two towns lay the crags that Jonathan and his armourbearer climbed. In Isaiah's picture of an army marching on Jerusalem from the north, the enemy crosses the pass and lodges for the night at Geba."
    - 'When Baasha of Israel fortified Ramah, Asa of Judah carried off its stones and timber and built Geba and Mizpah with them; Josephus calls them two strong cities. Geba came to mark the northern edge of Judah: Josiah defiled the high places of his kingdom "from Geba to Beer-sheba".'
    - "After the exile the men of Ramah and Geba, 621 in all, returned from Babylon. In Nehemiah's day the Benjamites lived from Geba onwards, and among the singers gathered for the dedication of the walls of Jerusalem were men from the fields of Geba. In the fourth century Eusebius's Onomasticon lists Gaba in the lot of Benjamin."
  ru:
    - "Гева, чьё имя означает «холм», — город Вениаминов примерно в 9 км к северо-северо-востоку от Иерусалима. Её отождествляют с деревней Джаба, сохранившей имя: она стоит на южной стороне глубокого вади эс-Сувейнит, напротив Михмаса за ущельем. Гева, Гива и Гаваон происходят от одного еврейского слова «холм», и библейский текст и его переводы порой их смешивают; некоторые учёные считают, что ряд мест о Гиве Сауловой на самом деле говорит о Геве."
    - "Книга Иисуса Навина называет Геву среди городов Вениаминовых и среди городов, отданных священникам, сынам Аарона. В начале войны Саула с филистимлянами Ионафан разбил филистимский охранный отряд в Геве (в некоторых переводах, в том числе в Синодальном, здесь — в Гиве). Тогда филистимляне стали станом в Михмасе по другую сторону ущелья, и в ущелье между двумя городами лежали скалы, на которые взобрались Ионафан и его оруженосец. В картине Исаии, где войско идёт на Иерусалим с севера, враг проходит теснины и ночует в Геве."
    - "Когда Вааса, царь Израильский, укрепил Раму, Аса, царь Иудейский, вывез её камни и дерева и выстроил из них Геву и Массифу; Иосиф Флавий называет их двумя сильными городами. Со временем Гева стала обозначать северный край Иудеи: Иосия осквернил высоты своего царства «от Гевы до Вирсавии»."
    - "После плена уроженцы Рамы и Гевы, шестьсот двадцать один человек, вернулись из Вавилона. Во дни Неемии вениамитяне жили, начиная от Гевы, а среди певцов, собравшихся к освящению стен Иерусалима, были люди с полей Гевы. В IV веке «Ономастикон» Евсевия называет Гаву в уделе Вениамина."
  uk:
    - "Геба, назва якої означає «пагорб», була містом Веніямина приблизно за 9 км на північ-північний схід від Єрусалима. Її ототожнюють із селом Джаба, яке зберігає назву й стоїть на південному боці глибокого Ваді-ес-Сувейніт, навпроти Міхмаса через ущелину. Геба, Гіва й Гаваон походять від одного давньоєврейського слова «пагорб», і біблійний текст та його переклади іноді їх плутають; деякі дослідники вважають, що кілька місць про Гіву Саулову насправді мають на увазі Гебу."
    - "Книга Ісуса Навина заносить Гебу до міст Веніямина й до міст, даних священикам, синам Аарона. На початку війни Саула з філістимлянами Йонатан розбив філістимську залогу в Гебі (деякі переклади, зокрема російський Синодальний, читають тут Гіва). Тоді філістимляни отаборилися в Міхмасі по інший бік ущелини, а в ущелині між двома містами лежали скелі, на які видерся Йонатан із зброєносцем. У картині Ісаї про військо, що йде на Єрусалим з півночі, ворог переходить перевал і ночує в Гебі."
    - "Коли Вааса Ізраїльський укріплював Раму, Аса Юдейський вивіз її каміння й дерево й збудував із них Гебу та Міцпу; Йосиф Флавій називає їх двома міцними містами. Геба стала позначати північну межу Юди: Йосія осквернив висоти свого царства «від Геви до Берсабиї»."
    - "Після вигнання люди з Рами та Геби, усього 621, повернулися з Вавилона. За днів Неемії веніяминці жили починаючи від Геби, а серед співців, зібраних на освячення мурів Єрусалима, були люди з сіл Геби. У IV ст. «Ономастикон» Євсевія заносить Габу до жереба Веніямина."
  es:
    - "Geba, cuyo nombre significa «colina», era una población de Benjamín a unos 9 km al nornordeste de Jerusalén. Se identifica con la aldea de Jaba, que conserva el nombre y se alza en la ladera sur del profundo Wadi es-Suweinit, frente a Micmas al otro lado de la garganta. Geba, Gabaa y Gabaón proceden de la misma palabra hebrea para «colina», y el texto bíblico y sus traducciones a veces las confunden; algunos especialistas sostienen que varios pasajes sobre la Gabaa de Saúl se refieren en realidad a Geba."
    - "Josué enumera Geba entre las ciudades de Benjamín y entre las poblaciones dadas a los sacerdotes, hijos de Aarón. Al comienzo de la guerra de Saúl con los filisteos, Jonatán hirió la guarnición filistea de Geba (algunas traducciones, entre ellas la sinodal rusa, leen aquí Gabaa). Los filisteos acamparon entonces en Micmas, al otro lado de la garganta, y en la garganta entre las dos poblaciones estaban los peñascos que trepó Jonatán con su escudero. En el cuadro de Isaías de un ejército que marcha sobre Jerusalén desde el norte, el enemigo cruza el paso y pasa la noche en Geba."
    - "Cuando Baasa de Israel fortificó Ramá, Asa de Judá se llevó sus piedras y su madera y con ellas edificó Geba y Mizpa; Josefo las llama dos ciudades fuertes. Geba llegó a marcar el límite norte de Judá: Josías profanó los altos de su reino «desde Gabaa [Geba] hasta Beer-seba»."
    - "Tras el destierro, los hombres de Ramá y Geba, 621 en total, regresaron de Babilonia. En tiempos de Nehemías los benjaminitas habitaban desde Geba en adelante, y entre los cantores reunidos para la dedicación de los muros de Jerusalén había hombres de los campos de Geba. En el siglo IV, el Onomasticón de Eusebio enumera Gaba en la suerte de Benjamín."
  pt:
    - "Geba, cujo nome significa “colina”, era uma cidade de Benjamim a cerca de 9 km a nor-nordeste de Jerusalém. É identificada com a aldeia de Jaba, que guarda o nome e fica no lado sul do profundo uádi es-Suweinit, defronte de Micmás, do outro lado do desfiladeiro. Geba, Gibeá e Gibeão vêm todas da mesma palavra hebraica para “colina”, e o texto bíblico e suas traduções às vezes as confundem; alguns estudiosos sustentam que várias passagens sobre Gibeá de Saul se referem na verdade a Geba."
    - "Josué lista Geba entre as cidades de Benjamim e entre as cidades dadas aos sacerdotes, filhos de Arão. No início da guerra de Saul com os filisteus, Jônatas feriu a guarnição filisteia em Geba (algumas traduções, entre elas a Sinodal russa, leem aqui Gibeá). Os filisteus acamparam então em Micmás, do outro lado do desfiladeiro, e no desfiladeiro entre as duas cidades ficavam os penhascos que Jônatas e seu escudeiro escalaram. No quadro de Isaías de um exército que marcha do norte contra Jerusalém, o inimigo atravessa o desfiladeiro e passa a noite em Geba."
    - "Quando Baasa de Israel fortificou Ramá, Asa de Judá levou embora as suas pedras e madeira e com elas edificou Geba e Mispá; Josefo as chama de duas cidades fortes. Geba veio a marcar o limite norte de Judá: Josias profanou os altos do seu reino “desde Geba até Berseba”."
    - "Depois do exílio, os homens de Ramá e Geba, 621 ao todo, voltaram da Babilônia. No tempo de Neemias, os benjamitas habitaram de Geba em diante, e entre os cantores reunidos para a dedicação das muralhas de Jerusalém havia homens dos campos de Geba. No século IV, o Onomástico de Eusébio lista Gaba na porção de Benjamim."
  de:
    - "Geba, dessen Name „Hügel“ bedeutet, war eine Stadt Benjamins etwa 9 km nord-nordöstlich von Jerusalem. Sie wird mit dem Dorf Jaba gleichgesetzt, das den Namen bewahrt und an der Südseite des tiefen Wadi es-Suweinit liegt, Michmas über die Schlucht hinweg gegenüber. Geba, Gibea und Gibeon gehen alle auf dasselbe hebräische Wort für „Hügel“ zurück, und der biblische Text und seine Übersetzungen verwechseln sie bisweilen; manche Gelehrte meinen, mehrere Stellen über Gibea Sauls meinten in Wahrheit Geba."
    - "Josua führt Geba unter den Städten Benjamins und unter den Städten auf, die den Priestern, den Söhnen Aarons, gegeben wurden. Zu Beginn von Sauls Krieg gegen die Philister schlug Jonatan die philistäische Besatzung in Geba (einige Übersetzungen, darunter die russische Synodalübersetzung, lesen hier Gibea). Die Philister lagerten dann bei Michmas auf der anderen Seite der Schlucht, und in der Schlucht zwischen den beiden Städten lagen die Felsen, die Jonatan und sein Waffenträger erkletterten. In Jesajas Bild eines Heeres, das von Norden gegen Jerusalem zieht, überquert der Feind den Pass und bleibt in Geba über Nacht."
    - "Als Baesa von Israel Rama befestigte, trug Asa von Juda dessen Steine und Holz fort und baute damit Geba und Mizpa; Josephus nennt sie zwei starke Städte. Geba bezeichnete schließlich die Nordgrenze Judas: Josia verunreinigte die Höhen seines Königreichs „von Geba an bis gen Beer-Seba“."
    - "Nach dem Exil kehrten die Männer von Rama und Geba, insgesamt 621, aus Babylon zurück. Zu Nehemias Zeit wohnten die Benjaminiter von Geba an, und unter den Sängern, die sich zur Einweihung der Mauern Jerusalems versammelten, waren Männer von den Äckern zu Geba. Im 4. Jahrhundert führt das Onomastikon des Eusebius Gaba im Los Benjamins auf."
  fr:
    - "Guéba, dont le nom signifie « colline », était une ville de Benjamin à environ 9 km au nord-nord-est de Jérusalem. Elle est identifiée au village de Jaba, qui en garde le nom et se dresse sur le versant sud du profond oued es-Suweinit, face à Micmasch de l’autre côté de la gorge. Guéba, Guibea et Gabaon viennent du même mot hébreu signifiant « colline », et le texte biblique comme ses traductions les confondent parfois ; certains spécialistes estiment que plusieurs passages sur Guibea de Saül visent en réalité Guéba."
    - "Josué range Guéba parmi les villes de Benjamin et parmi les villes données aux prêtres, fils d’Aaron. Au début de la guerre de Saül contre les Philistins, Jonathan battit le poste des Philistins à Guéba (certaines traductions, dont la Synodale russe, lisent ici Guibea). Les Philistins campèrent alors à Micmasch, de l’autre côté de la gorge, et dans la gorge entre les deux villes se trouvaient les dents de rocher que Jonathan et son écuyer gravirent. Dans le tableau qu’Ésaïe fait d’une armée marchant sur Jérusalem depuis le nord, l’ennemi passe le défilé et couche à Guéba."
    - "Quand Baescha d’Israël fortifia Rama, Asa de Juda en emporta les pierres et le bois et s’en servit pour bâtir Guéba et Mitspa ; Josèphe les appelle deux villes fortes. Guéba en vint à marquer la limite nord de Juda : Josias souilla les hauts lieux de son royaume « depuis Guéba jusqu’à Beer-Schéba »."
    - "Après l’exil, les gens de Rama et de Guéba, 621 en tout, revinrent de Babylone. Du temps de Néhémie, les Benjamites habitaient à partir de Guéba, et parmi les chantres rassemblés pour la dédicace des murailles de Jérusalem se trouvaient des hommes du territoire de Guéba. Au IVe siècle, l’Onomasticon d’Eusèbe mentionne Gaba dans le lot de Benjamin."
  pl:
    - "Geba, której nazwa znaczy „wzgórze”, było miastem w Beniaminie około 9 km na północ-północny wschód od Jerozolimy. Utożsamia się je ze wsią Jaba, która zachowała nazwę i stoi po południowej stronie głębokiego Wadi es-Suweinit, naprzeciw Mikmas po drugiej stronie wąwozu. Geba, Gibea i Gibeon wywodzą się z tego samego hebrajskiego słowa „wzgórze”, a tekst biblijny i jego przekłady czasem je mylą; niektórzy uczeni uważają, że kilka fragmentów o Gibei Saulowej naprawdę dotyczy Geby."
    - "Jozue wymienia Gebę wśród miast Beniamina i wśród miast oddanych kapłanom, synom Aarona. Na początku wojny Saula z Filistynami Jonatan pobił filistyńską załogę w Gebie (niektóre przekłady, w tym rosyjski synodalny, czytają tu Gibea). Filistyni rozłożyli się wtedy obozem w Mikmas po drugiej stronie wąwozu, a w wąwozie między obu miastami leżały skały, na które wspinali się Jonatan i jego giermek. W obrazie Izajasza, w którym wojsko idzie na Jerozolimę z północy, wróg przechodzi przełęcz i nocuje w Gebie."
    - "Gdy Baasza izraelski obwarował Ramę, Asa judzki zabrał jej kamienie i drewno i zbudował z nich Gebę i Mispę; Józef Flawiusz nazywa je dwoma silnymi miastami. Geba zaczęła wyznaczać północny kraniec Judy: Jozjasz splugawił wyżyny w swoim królestwie „od Gabaa aż do Beerseba”."
    - "Po wygnaniu mężowie z Ramy i Geby, w sumie 621, wrócili z Babilonu. Za Nehemiasza Beniaminici mieszkali od Geby w dalszym ciągu, a wśród śpiewaków zgromadzonych na poświęcenie murów Jerozolimy byli ludzie z pól Geby. W IV w. Onomastykon Euzebiusza wymienia Gabę w losie Beniamina."
  it:
    - "Gheba, il cui nome significa «colle», era una città di Beniamino circa 9 km a nord-nord-est di Gerusalemme. È identificata con il villaggio di Jaba, che ne conserva il nome e sorge sul lato meridionale del profondo Wadi es-Suweinit, di fronte a Micmas al di là della gola. Gheba, Gabaa e Gabaon derivano tutte dalla stessa parola ebraica per «colle», e il testo biblico e le sue traduzioni a volte le confondono; alcuni studiosi ritengono che parecchi passi su Gabaa di Saul intendano in realtà Gheba."
    - "Giosuè elenca Gheba fra le città di Beniamino e fra le città date ai sacerdoti, figli di Aronne. All’inizio della guerra di Saul con i Filistei, Gionata batté la guarnigione filistea di Gheba (alcune traduzioni, fra cui la sinodale russa, leggono qui Gabaa). I Filistei si accamparono allora a Micmas, dall’altra parte della gola, e nella gola fra le due città si trovavano le rupi che Gionata e il suo scudiero scalarono. Nel quadro di Isaia di un esercito che marcia su Gerusalemme da nord, il nemico valica il passo e passa la notte a Gheba."
    - "Quando Baasa d’Israele fortificò Rama, Asa di Giuda ne portò via le pietre e il legname e con essi edificò Gheba e Mizpa; Giuseppe Flavio le chiama due città forti. Gheba giunse a segnare il margine settentrionale di Giuda: Giosia contaminò gli alti luoghi del suo regno «da Gheba a Beer-Sceba»."
    - "Dopo l’esilio gli uomini di Rama e di Gheba, seicentoventuno in tutto, tornarono da Babilonia. Ai tempi di Neemia i Beniaminiti abitavano da Gheba in là, e fra i cantori radunati per la dedicazione delle mura di Gerusalemme vi erano uomini dei campi di Gheba. Nel IV secolo l’Onomasticon di Eusebio elenca Gaba nel lotto di Beniamino."
  nl:
    - "Geba, een naam die “heuvel” betekent, was een stad van Benjamin, ongeveer 9 km noord-noordoostelijk van Jeruzalem. Zij wordt vereenzelvigd met het dorp Jaba, dat de naam bewaart en aan de zuidzijde van de diepe Wadi es-Suweinit ligt, tegenover Michmas aan de overkant van de kloof. Geba, Gibea en Gibeon komen alle van hetzelfde Hebreeuwse woord voor “heuvel”, en de bijbeltekst en zijn vertalingen verwarren ze soms; sommige geleerden menen dat verscheidene passages over Gibea van Saul eigenlijk Geba bedoelen."
    - "Jozua noemt Geba onder de steden van Benjamin en onder de steden die aan de priesters, de zonen van Aäron, werden gegeven. Bij het begin van Sauls oorlog met de Filistijnen sloeg Jonatan de Filistijnse bezetting in Geba (sommige vertalingen, onder meer de Russische Synodale, lezen hier Gibea). De Filistijnen legerden zich toen bij Michmas aan de andere kant van de kloof, en in de kloof tussen de twee steden lagen de rotsen die Jonatan en zijn wapendrager beklommen. In Jesaja’s beeld van een leger dat vanuit het noorden naar Jeruzalem optrekt, steekt de vijand de pas over en overnacht hij te Geba."
    - "Toen Baësa van Israël Rama versterkte, voerde Asa van Juda de stenen en het hout ervan weg en bouwde daarmee Geba en Mizpa; Josephus noemt ze twee sterke steden. Geba kwam de noordgrens van Juda te markeren: Josia verontreinigde de hoogten van zijn rijk “van Geba af tot Ber-seba toe”."
    - "Na de ballingschap keerden de mannen van Rama en Geba, in totaal 621, uit Babylon terug. In de dagen van Nehemia woonden de Benjaminieten vanaf Geba, en onder de zangers die zich verzamelden voor de inwijding van de muren van Jeruzalem waren mannen uit de velden van Geba. In de 4e eeuw noemt het Onomasticon van Eusebius Gaba in het lot van Benjamin."
  cs:
    - "Geba, jejíž jméno znamená „pahorek“, bylo město Benjamínovo asi 9 km severoseverovýchodně od Jeruzaléma. Ztotožňuje se s vesnicí Jaba, která jméno zachovává a stojí na jižní straně hlubokého Wádí es-Suweinit, naproti Michmasu přes soutěsku. Geba, Gibea a Gibeon pocházejí ze stejného hebrejského slova pro „pahorek“ a biblický text i jeho překlady je někdy zaměňují; někteří učenci soudí, že několik míst o Gibeji Saulově ve skutečnosti míní Gebu."
    - "Jozue uvádí Gebu mezi městy Benjamínovými a mezi městy danými kněžím, synům Áronovým. Na začátku Saulovy války s Pelištejci udeřil Jonatan na pelištejskou posádku v Gebě (některé překlady, mezi nimi ruský synodální, čtou zde Gibea). Pelištejci se pak utábořili u Michmasu na druhé straně soutěsky a v soutěsce mezi oběma městy ležely skály, na něž vylezli Jonatan a jeho zbrojnoš. V Izajášově obraze vojska táhnoucího na Jeruzalém ze severu nepřítel překročí průsmyk a přenocuje v Gebě."
    - "Když Baeša Izraelský opevnil Rámu, Asa Judský odnesl její kamení a dříví a postavil z nich Gebu a Micpu; Josephus je nazývá dvěma silnými městy. Geba začala označovat severní okraj Judy: Jošijáš poskvrnil výšiny svého království „od Gabaa až do Bersabé“."
    - "Po exilu se muži z Rámy a Geby, celkem 621, vrátili z Babylóna. Za Nehemjášových dnů bydleli Benjamínovci od Geby dále a mezi zpěváky shromážděnými k vysvěcení hradeb Jeruzaléma byli muži z polí Geby. Ve 4. století uvádí Eusebiův Onomastikon Gabu v losu Benjamínově."
  sv:
    - "Geba, vars namn betyder ”kulle”, var en stad i Benjamin omkring 9 km nordnordost om Jerusalem. Den identifieras med byn Jaba, som bevarar namnet och ligger på södra sidan av det djupa Wadi es-Suweinit, mitt emot Mikmas på andra sidan klyftan. Geba, Giva och Gibeon kommer alla av samma hebreiska ord för ”kulle”, och bibeltexten och dess översättningar blandar ibland ihop dem; vissa forskare menar att flera ställen om Sauls Giva egentligen avser Geba."
    - "Josua räknar upp Geba bland Benjamins städer och bland de städer som gavs åt prästerna, Arons söner. I början av Sauls krig mot filistéerna slog Jonatan den filisteiska garnisonen i Geba (några översättningar, bland dem den ryska synodalbibeln, har Giva här). Filistéerna lägrade sig då i Mikmas på andra sidan klyftan, och i klyftan mellan de två städerna låg klipporna som Jonatan och hans vapendragare klättrade upp för. I Jesajas bild av en här som tågar mot Jerusalem från norr går fienden över passet och tar nattkvarter i Geba."
    - "När Basha av Israel befäste Rama, förde Asa av Juda bort dess stenar och trävirke och byggde med dem upp Geba och Mispa; Josefus kallar dem två starka städer. Geba kom att markera Judas norra gräns: Josia orenade offerhöjderna i sitt rike ”från Geba ända till Beer-Seba”."
    - "Efter exilen återvände Ramas och Gebas män, sammanlagt 621, från Babylon. På Nehemjas tid bodde benjaminiterna från Geba och framåt, och bland sångarna som samlades till invigningen av Jerusalems murar fanns män från Gebas utmarker. På 300-talet förtecknar Eusebios Onomastikon Gaba i Benjamins lott."
  nb:
    - "Geba, hvis navn betyr «høyde», var en by i Benjamin omtrent 9 km nord-nordøst for Jerusalem. Den identifiseres med landsbyen Jaba, som har bevart navnet og ligger på sørsiden av det dype Wadi es-Suweinit, rett overfor Mikmas på den andre siden av juvet. Geba, Gibea og Gibeon kommer alle av det samme hebraiske ordet for «høyde», og den bibelske teksten og oversettelsene forveksler dem av og til; noen forskere mener at flere tekster om Sauls Gibea egentlig mener Geba."
    - "Josva oppfører Geba blant Benjamins byer og blant byene som ble gitt til prestene, Arons sønner. Ved begynnelsen av Sauls krig mot filistrene slo Jonatan den filistiske vaktstyrken i Geba (noen oversettelser, blant dem den russiske synodalbibelen, har Gibea her). Filistrene slo deretter leir ved Mikmas på den andre siden av juvet, og i juvet mellom de to byene lå klippene som Jonatan og hans våpenbærer klatret opp. I Jesajas bilde av en hær som marsjerer mot Jerusalem fra nord, krysser fienden passet og overnatter i Geba."
    - "Da Basja av Israel befestet Rama, førte Asa av Juda bort steinene og tømmeret og bygde Geba og Mispa med dem; Josefus kaller dem to sterke byer. Geba kom til å markere Judas nordgrense: Josjia gjorde de offerhaugene i sitt rike urene «fra Geba til Be'erseba»."
    - "Etter eksilet vendte mennene fra Rama og Geba, 621 til sammen, tilbake fra Babylon. På Nehemjas tid bodde benjaminittene fra Geba og utover, og blant sangerne som ble samlet til innvielsen av Jerusalems murer, var menn fra Gebas marker. På 300-tallet oppfører Eusebius' Onomasticon Gaba i Benjamins lodd."
  tl:
    - "Ang Geba, na ang pangalan ay nangangahulugang “burol”, ay isang bayan ng Benjamin mga 9 km sa hilaga-hilagang-silangan ng Jerusalem. Kinikilala ito bilang ang nayon ng Jaba, na nagpapanatili ng pangalan at nasa timog na bahagi ng malalim na Wadi es-Suweinit, katapat ng Michmas sa kabila ng bangin. Ang Geba, Gibea at Gabaon ay pawang galing sa iisang salitang Hebreo para sa “burol”, at kung minsan ay nalilito ng tekstong biblikal at ng mga salin nito ang mga ito; iginigiit ng ilang iskolar na ang ilang talata tungkol sa Gibea ni Saul ay talagang tumutukoy sa Geba."
    - "Itinatala ni Josue ang Geba sa mga lungsod ng Benjamin at sa mga bayang ibinigay sa mga saserdote, ang mga anak ni Aaron. Sa simula ng digmaan ni Saul sa mga Filisteo, sinalakay ni Jonathan ang bantay ng mga Filisteo sa Geba (ang ilang salin, kabilang ang Synodal na Ruso, ay may Gibea dito). Pagkatapos ay nagkampo ang mga Filisteo sa Michmas sa kabilang panig ng bangin, at sa bangin sa pagitan ng dalawang bayan ay naroon ang mga talampas na inakyat ni Jonathan at ng kaniyang tagadala ng sandata. Sa larawan ni Isaias ng isang hukbong lumalakad laban sa Jerusalem mula sa hilaga, tinatawid ng kaaway ang daanan at nagpapalipas ng gabi sa Geba."
    - "Nang patibayin ni Baasa ng Israel ang Rama, dinala ni Asa ng Juda ang mga bato at kahoy nito at itinayo sa mga ito ang Geba at Mizpa; tinatawag ni Josephus ang mga ito na dalawang matibay na lungsod. Ang Geba ay naging hangganan sa hilagang gilid ng Juda: nilapastangan ni Josias ang mga mataas na dako ng kaniyang kaharian “mula sa Geba hanggang sa Beerseba”."
    - "Pagkatapos ng pagkatapon, ang mga lalaki ng Rama at Geba, 621 sa kabuuan, ay bumalik mula sa Babilonia. Noong kapanahunan ni Nehemias ay tumira ang mga Benjaminita mula sa Geba pasulong, at kabilang sa mga mang-aawit na nagtipon para sa pagtatalaga ng mga pader ng Jerusalem ay mga lalaki mula sa mga bukid ng Geba. Noong ika-4 na siglo ay itinatala ng Onomasticon ni Eusebio ang Gaba sa bahagi ng Benjamin."
  da:
    - "Geba, hvis navn betyder »høj«, var en by i Benjamin omkring 9 km nord-nordøst for Jerusalem. Den identificeres med landsbyen Jaba, som bevarer navnet og ligger på sydsiden af den dybe Wadi es-Suweinit, over for Mikmas på den anden side af kløften. Geba, Gibea og Gibeon kommer alle af det samme hebraiske ord for »høj«, og den bibelske tekst og dens oversættelser forveksler dem undertiden; nogle forskere mener, at flere steder om Sauls Gibea i virkeligheden mener Geba."
    - "Josva opregner Geba blandt Benjamins byer og blandt de byer, der blev givet præsterne, Arons sønner. I begyndelsen af Sauls krig med filisterne slog Jonatan den filistæiske besætning i Geba (nogle oversættelser, blandt dem den russiske synodalbibel, har Gibea her). Filisterne lejrede sig derefter i Mikmas på den anden side af kløften, og i kløften mellem de to byer lå de klipper, som Jonatan og hans våbendrager besteg. I Esajas' billede af en hær, der marcherer mod Jerusalem fra nord, krydser fjenden passet og overnatter i Geba."
    - "Da Basja af Israel befæstede Rama, bar Asa af Juda dens sten og tømmer bort og byggede Geba og Mispa med dem; Josefus kalder dem to stærke byer. Geba kom til at markere Judas nordlige grænse: Josias vanhelligede højene i sit rige »fra Geba indtil Beersaba«."
    - "Efter eksilet vendte mændene fra Rama og Geba, 621 i alt, tilbage fra Babylon. På Nehemias' tid boede benjaminitterne fra Geba og videre, og blandt de sangere, der samledes til indvielsen af Jerusalems mure, var mænd fra markerne ved Geba. I 300-tallet opregner Eusebios' Onomastikon Gaba i Benjamins lod."
