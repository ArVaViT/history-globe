# Overview article (ADR 0007). Mainstream facts only; the Amos date follows the reigns of Uzziah and Jeroboam II as usually dated (eighth century BC).
id: tekoa
place: a2e3aa0
title:
  en: "Tekoa"
  ru: "Фекоя"
  uk: "Текоя"
  es: "Tecoa"
  pt: "Tecoa"
