body:
  en:
    - "Tekoa stood on a hill at Khirbet Tequ', about 8 km south of Bethlehem and 16 km south of Jerusalem, where the farmland of the Judaean hills gives way to the desert that bears its name. The name lives on in the nearby Arab village of Tuqu'. Remains on the hill run from the Iron Age, when Tekoa was a town of Judah, to the Byzantine period."
    - "Joab fetched a wise woman from Tekoa, who with a made-up story of her own sons moved David to bring Absalom home. Ira son of Ikkesh the Tekoite was one of David's mighty men and the captain for the sixth month. Rehoboam fortified Tekoa together with Bethlehem and Etam, and Jehoshaphat's army went out into the wilderness of Tekoa to meet the Moabites and Ammonites."
    - 'The book of Amos opens with "The words of Amos, who was among the herdmen of Tekoa"; he spoke against the northern kingdom of Israel in the days of Uzziah of Judah and Jeroboam son of Joash, in the eighth century BC. Jeremiah called for the trumpet to be blown in Tekoa as disaster came from the north. After the exile the Tekoites repaired two stretches of Jerusalem''s wall, though "their nobles put not their necks to the work of their Lord".'
    - "About 160 BC Jonathan and Simon Maccabeus fled from Bacchides into the wilderness of Tekoa. In the war against Rome Simon bar Giora camped at Tekoa, and Titus sent Josephus there to see whether it was fit for a camp; on the way back Josephus recognised three men he knew among the crucified and had them taken down, but only one survived. In the fourth century Eusebius knew Tekoa as a village where the tomb of Amos was shown, and a church was later built on the site."
  ru:
    - "Фекоя стояла на холме Хирбет-Текуа, примерно в 8 км к югу от Вифлеема и в 16 км к югу от Иерусалима, там, где пашни Иудейских гор сменяются пустыней, носящей её имя. Название сохранилось в соседней арабской деревне Тукуа. Остатки на холме охватывают время от железного века, когда Фекоя была городом Иудеи, до византийской эпохи."
    - "Иоав взял из Фекои умную женщину, которая выдуманной историей о своих сыновьях склонила Давида вернуть Авессалома. Ира, сын Икеша, Фекоитянин, был одним из храбрых Давида и начальником отделения на шестой месяц. Ровоам укрепил Фекою вместе с Вифлеемом и Ефамом, а войско Иосафата выступило к пустыне Фекойской навстречу моавитянам и аммонитянам."
    - "Книга Амоса открывается словами «Слова Амоса, одного из пастухов Фекойских»; он говорил против северного Израильского царства во дни Озии, царя Иудейского, и Иеровоама, сына Иоасова, в VIII веке до н. э. Иеремия призывал трубить трубою в Фекое, потому что от севера появляется беда. После плена Фекойцы чинили два участка стены Иерусалима, хотя «знатнейшие из них не наклонили шеи своей поработать для Господа своего»."
    - "Около 160 г. до н. э. Ионафан и Симон Маккавеи бежали от Вакхида в пустыню Фекойскую. Во время войны с Римом у Фекои стоял лагерем Симон бар Гиора, а Тит послал туда Иосифа Флавия посмотреть, годится ли место для лагеря; на обратном пути Иосиф узнал среди распятых трёх знакомых и добился, чтобы их сняли, но выжил только один. В IV веке Евсевий знал Фекою как селение, где показывали гробницу Амоса, а позже на этом месте построили церковь."
  uk:
    - "Текоя стояла на пагорбі в Хірбет-Текуа, приблизно за 8 км на південь від Вифлеєма і за 16 км на південь від Єрусалима, де рілля юдейських пагорбів поступається пустелі, що носить її ім’я. Назва живе в сусідньому арабському селі Туку. Рештки на пагорбі тягнуться від залізної доби, коли Текоя була містом Юди, до візантійського періоду."
    - "Йоав покликав мудру жінку з Текої, яка вигаданою історією про власних синів схилила Давида повернути Авесалома додому. Іра, син Ікеша, текоянин, був одним із давидових лицарів і начальником на шостий місяць. Ровоам укріпив Текою разом з Вифлеємом та Етамом, а військо Йосафата вийшло в пустелю Текої назустріч моавитянам та аммонітянам."
    - "Книга Амоса починається словами: «Слова Амосові, що був ізміж Текойських скотарів»; він виголошував пророцтва проти північного царства Ізраїль за днів Уззії Юдейського та Єровоама, сина Йоаса, у VIII ст. до н. е. Єремія закликав сурмити в Текої, коли з півночі йшла біда. Після вигнання текоянини лагодили дві ділянки муру Єрусалима, хоча «значнїйші зпоміж їх не нахилили своєї шиї попрацювати задля Господа свого»."
    - "Близько 160 р. до н. е. Йонатан і Симон Макавеї втекли від Бакхіда в пустелю Текої. У війні проти Риму Симон бар-Гіора таборував у Текої, а Тит послав туди Йосифа Флавія подивитися, чи придатна вона для табору; на зворотному шляху Йосиф упізнав серед розіп’ятих трьох знайомих і звелів їх зняти, але вижив лише один. У IV столітті Євсевій знав Текою як село, де показували гробницю Амоса, а згодом на місці збудували церкву."
  es:
    - "Tecoa se alzaba sobre una colina en Khirbet Tequ', a unos 8 km al sur de Belén y 16 km al sur de Jerusalén, donde las tierras de labor de las colinas de Judea dan paso al desierto que lleva su nombre. El nombre pervive en la cercana aldea árabe de Tuqu'. Los restos de la colina van desde la Edad del Hierro, cuando Tecoa era una ciudad de Judá, hasta el período bizantino."
    - "Joab hizo venir de Tecoa a una mujer sabia que, con una historia inventada sobre sus propios hijos, movió a David a traer de vuelta a Absalón. Ira hijo de Iques el tecoíta fue uno de los valientes de David y el jefe del sexto mes. Roboam fortificó Tecoa junto con Belén y Etam, y el ejército de Josafat salió al desierto de Tecoa para hacer frente a los moabitas y amonitas."
    - "El libro de Amós se abre con «Las palabras de Amós, que fué entre los pastores de Tecoa»; habló contra el reino del norte, Israel, en los días de Uzías de Judá y Jeroboam hijo de Joás, en el siglo VIII a. C. Jeremías llamó a tocar la trompeta en Tecoa cuando el desastre venía del norte. Después del exilio los tecoítas repararon dos tramos de la muralla de Jerusalén, aunque «sus grandes no prestaron su cerviz á la obra de su Señor»."
    - "Hacia 160 a. C. Jonatán y Simón Macabeo huyeron de Báquides al desierto de Tecoa. En la guerra contra Roma, Simón bar Giora acampó en Tecoa, y Tito envió allí a Josefo para ver si servía para un campamento; al regresar, Josefo reconoció entre los crucificados a tres hombres que conocía e hizo que los bajaran, pero solo uno sobrevivió. En el siglo IV, Eusebio conocía Tecoa como una aldea donde se mostraba la tumba de Amós, y más tarde se construyó una iglesia en el lugar."
  pt:
    - "Tecoa ficava numa colina em Khirbet Tequ', cerca de 8 km ao sul de Belém e 16 km ao sul de Jerusalém, onde as terras de lavoura das colinas da Judeia dão lugar ao deserto que leva seu nome. O nome sobrevive na vizinha aldeia árabe de Tuqu'. Os vestígios na colina vão da Idade do Ferro, quando Tecoa era uma cidade de Judá, ao período bizantino."
    - "Joabe trouxe de Tecoa uma mulher sábia que, com uma história inventada sobre seus próprios filhos, levou Davi a trazer Absalão de volta. Ira, filho de Iques, o tecoíta, foi um dos valentes de Davi e capitão do sexto mês. Roboão fortificou Tecoa junto com Belém e Etã, e o exército de Josafá saiu para o deserto de Tecoa ao encontro dos moabitas e amonitas."
    - "O livro de Amós começa com “As palavras de Amós, que estava entre os pastores de Tecoa”; ele falou contra o reino do norte, Israel, nos dias de Uzias de Judá e de Jeroboão, filho de Joás, no século VIII a.C. Jeremias pediu que se tocasse a trombeta em Tecoa quando o desastre vinha do norte. Depois do exílio, os tecoítas repararam dois trechos da muralha de Jerusalém, embora “os seus nobres não colocaram os seus pescoços no trabalho do Senhor”."
    - "Por volta de 160 a.C., Jônatas e Simão Macabeu fugiram de Báquides para o deserto de Tecoa. Na guerra contra Roma, Simão bar Giora acampou em Tecoa, e Tito enviou Josefo para ver se o lugar servia para acampamento; na volta, Josefo reconheceu entre os crucificados três homens que conhecia e mandou tirá-los, mas só um sobreviveu. No século IV, Eusébio conhecia Tecoa como uma aldeia onde se mostrava o túmulo de Amós, e mais tarde se construiu uma igreja no local."
  de:
    - "Tekoa lag auf einem Hügel bei Khirbet Tequ', etwa 8 km südlich von Bethlehem und 16 km südlich von Jerusalem, wo das Ackerland des judäischen Berglands in die nach ihm benannte Wüste übergeht. Der Name lebt im nahen arabischen Dorf Tuqu' fort. Die Überreste auf dem Hügel reichen von der Eisenzeit, als Tekoa eine Stadt Judas war, bis in die byzantinische Zeit."
    - "Joab holte eine kluge Frau aus Tekoa, die David mit einer erfundenen Geschichte von ihren eigenen Söhnen bewegte, Absalom heimzuholen. Ira, der Sohn Ikkeschs, der Tekoiter, war einer von Davids Helden und der Hauptmann für den sechsten Monat. Rehabeam befestigte Tekoa zusammen mit Bethlehem und Etam, und Josaphats Heer zog in die Wüste Tekoa hinaus, den Moabitern und Ammonitern zu begegnen."
    - "Das Buch Amos beginnt: „Dies ist's, was Amos, der unter den Hirten zu Thekoa war, gesehen hat über Israel“; er sprach im achten Jahrhundert v. Chr. gegen das Nordreich Israel in den Tagen Usijas von Juda und Jerobeams, des Sohnes des Joas. Jeremia rief dazu auf, in Tekoa die Posaune zu blasen, als das Unheil aus dem Norden kam. Nach dem Exil besserten die Tekoiter zwei Strecken der Mauer Jerusalems aus, doch „ihre Vornehmeren brachten ihren Hals nicht zum Dienst ihrer Herren“."
    - "Um 160 v. Chr. flohen Jonatan und Simon Makkabäus vor Bakchides in die Wüste Tekoa. Im Krieg gegen Rom lagerte Simon bar Giora bei Tekoa, und Titus schickte Josephus dorthin, um zu sehen, ob es für ein Lager taugte; auf dem Rückweg erkannte Josephus unter den Gekreuzigten drei Männer, die er kannte, und ließ sie abnehmen, doch nur einer überlebte. Im vierten Jahrhundert kannte Eusebius Tekoa als Dorf, in dem das Grab des Amos gezeigt wurde, und später wurde an der Stelle eine Kirche gebaut."
  fr:
    - "Tekoa se dressait sur une colline à Khirbet Tequ’, à environ 8 km au sud de Bethléem et 16 km au sud de Jérusalem, là où les terres cultivées des collines de Judée cèdent la place au désert qui porte son nom. Le nom survit dans le village arabe voisin de Tuqu’. Les vestiges de la colline vont de l’âge du fer, quand Tekoa était une ville de Juda, à l’époque byzantine."
    - "Joab fit venir de Tekoa une femme habile qui, par une histoire inventée sur ses propres fils, amena David à ramener Absalom. Ira, fils d’Ikkesch, le Tekoïte, fut l’un des vaillants de David et le chef du sixième mois. Roboam fortifia Tekoa avec Bethléem et Étam, et l’armée de Josaphat sortit dans le désert de Tekoa pour affronter les Moabites et les Ammonites."
    - "Le livre d’Amos s’ouvre sur « Paroles d’Amos, l’un des bergers de Tekoa » ; il parla contre le royaume du nord, Israël, au temps d’Ozias de Juda et de Jéroboam fils de Joas, au VIIIe siècle av. J.-C. Jérémie appela à sonner de la trompette à Tekoa quand le malheur venait du nord. Après l’exil, les Tekoïtes réparèrent deux sections du mur de Jérusalem, bien que « leurs principaux ne se soumirent pas au service de leur seigneur »."
    - "Vers 160 av. J.-C., Jonathan et Simon Maccabée fuirent Bacchidès dans le désert de Tekoa. Dans la guerre contre Rome, Simon bar Giora campa à Tekoa, et Titus y envoya Josèphe voir si le lieu convenait à un camp ; au retour, Josèphe reconnut parmi les crucifiés trois hommes qu’il connaissait et les fit descendre, mais un seul survécut. Au IVe siècle, Eusèbe connaissait Tekoa comme un village où l’on montrait le tombeau d’Amos, et une église fut plus tard bâtie sur le site."
  pl:
    - "Tekoa stała na wzgórzu w Chirbet Tekua, około 8 km na południe od Betlejem i 16 km na południe od Jerozolimy, gdzie ziemie uprawne wzgórz judzkich ustępują pustyni noszącej jej nazwę. Nazwa żyje w pobliskiej arabskiej wsi Tuku. Pozostałości na wzgórzu sięgają od epoki żelaza, gdy Tekoa było miastem w Judzie, po okres bizantyjski."
    - "Joab sprowadził z Tekoa mądrą kobietę, która zmyśloną historią o swoich synach nakłoniła Dawida do sprowadzenia Absaloma do domu. Ira, syn Ikkesza z Tekoa, był jednym z dzielnych mężów Dawida i dowódcą na szósty miesiąc. Roboam umocnił Tekoa razem z Betlejem i Etam, a wojsko Jozafata wyszło na pustynię Tekoa naprzeciw Moabitów i Ammonitów."
    - "Księga Amosa zaczyna się od słów: „Słowa Amosa, który był między pasterzami z Tekua”; przemawiał przeciw północnemu królestwu Izraela za dni Uzzjasza z Judy i Jeroboama, syna Joasza, w VIII wieku p.n.e. Jeremiasz wzywał, by w Tekoa zadęto w trąbę, gdy z północy nadciągała klęska. Po wygnaniu mieszkańcy Tekoa naprawiali dwa odcinki muru Jerozolimy, choć „ci, co byli zacniejsi z nich, nie podłożyli szyi swej pod robotę pana swego”."
    - "Około 160 roku p.n.e. Jonatan i Szymon Machabeusze uciekli przed Bakchidesem na pustynię Tekoa. W wojnie z Rzymem Szymon bar Giora rozbił obóz w Tekoa, a Tytus posłał tam Józefa Flawiusza, by sprawdził, czy nadaje się na obóz; w drodze powrotnej Józef rozpoznał wśród ukrzyżowanych trzech znajomych i kazał ich zdjąć, ale przeżył tylko jeden. W IV wieku Euzebiusz znał Tekoa jako wieś, w której pokazywano grób Amosa, a później na tym miejscu zbudowano kościół."
  it:
    - "Tekoa sorgeva su una collina a Khirbet Tequ’, circa 8 km a sud di Betlemme e 16 km a sud di Gerusalemme, dove le terre coltivate delle colline della Giudea cedono al deserto che ne porta il nome. Il nome sopravvive nel vicino villaggio arabo di Tuqu’. I resti sulla collina vanno dall’età del Ferro, quando Tekoa era una città di Giuda, al periodo bizantino."
    - "Ioab fece venire da Tekoa una donna accorta, che con una storia inventata dei suoi figli indusse Davide a riportare Assalonne a casa. Ira figlio di Ikkes il Tekoita fu uno dei prodi di Davide e il capo per il sesto mese. Roboamo fortificò Tekoa insieme a Betlemme ed Etam, e l’esercito di Giosafat uscì nel deserto di Tekoa per affrontare i Moabiti e gli Ammoniti."
    - "Il libro di Amos si apre con «Parole di Amos, uno dei pastori di Tekoa»; egli parlò contro il regno settentrionale d’Israele ai giorni di Ozia di Giuda e di Geroboamo figlio di Ioas, nell’VIII secolo a.C. Geremia chiamò a suonare la tromba in Tekoa mentre dal nord veniva la calamità. Dopo l’esilio i Tekoiti restaurarono due tratti delle mura di Gerusalemme, benché «i principali fra loro non piegarono i loro colli a lavorare all’opera del loro signore»."
    - "Verso il 160 a.C. Gionata e Simone Maccabeo fuggirono davanti a Bacchide nel deserto di Tekoa. Nella guerra contro Roma Simone bar Giora si accampò a Tekoa, e Tito vi mandò Giuseppe Flavio a vedere se fosse adatta a un accampamento; sulla via del ritorno Giuseppe riconobbe tra i crocifissi tre uomini che conosceva e li fece deporre, ma uno solo sopravvisse. Nel IV secolo Eusebio conosceva Tekoa come un villaggio dove si mostrava la tomba di Amos, e in seguito sul sito fu costruita una chiesa."
  nl:
    - "Tekoa lag op een heuvel bij Khirbet Tequ’, ongeveer 8 km ten zuiden van Bethlehem en 16 km ten zuiden van Jeruzalem, waar het akkerland van de Judese heuvels overgaat in de woestijn die zijn naam draagt. De naam leeft voort in het nabijgelegen Arabische dorp Tuqu’. De resten op de heuvel lopen van de IJzertijd, toen Tekoa een stad van Juda was, tot de Byzantijnse periode."
    - "Joab liet een wijze vrouw uit Tekoa halen, die met een verzonnen verhaal over haar eigen zonen David bewoog Absalom naar huis te halen. Ira, zoon van Ikkes, de Tekoïet, was een van Davids helden en de overste voor de zesde maand. Rehabeam versterkte Tekoa samen met Bethlehem en Etam, en het leger van Josafat trok de woestijn van Tekoa in om de Moabieten en Ammonieten tegemoet te treden."
    - "Het boek Amos opent met “De woorden van Amos, die onder de veeherderen was van Thekoa”; hij sprak tegen het noordelijke koninkrijk Israël in de dagen van Uzzia van Juda en Jerobeam, de zoon van Joas, in de 8e eeuw v.Chr. Jeremia riep dat men in Tekoa de bazuin moest blazen toen het onheil uit het noorden kwam. Na de ballingschap herstelden de Tekoïeten twee stukken van de muur van Jeruzalem, al “hun voortreffelijken brachten hun hals niet tot den dienst huns Heeren”."
    - "Omstreeks 160 v.Chr. vluchtten Jonatan en Simon Makkabeüs voor Bacchides de woestijn van Tekoa in. In de oorlog tegen Rome sloeg Simon bar Giora zijn kamp op bij Tekoa, en Titus zond Josephus erheen om te zien of het geschikt was voor een kamp; op de terugweg herkende Josephus drie mannen die hij kende onder de gekruisigden en liet hen afnemen, maar slechts één overleefde. In de vierde eeuw kende Eusebius Tekoa als een dorp waar het graf van Amos werd getoond, en later werd op de plek een kerk gebouwd."
  cs:
    - "Tekoa stálo na pahorku v Chirbet Tequ', asi 8 km jižně od Betléma a 16 km jižně od Jeruzaléma, kde zemědělská půda judských hor přechází v poušť, která nese jeho jméno. Jméno žije dál v nedaleké arabské vesnici Tuqu'. Pozůstatky na pahorku sahají od doby železné, kdy bylo Tekoa městem Judy, po byzantské období."
    - "Joáb přivedl z Tekoa moudrou ženu, která vymyšleným příběhem o svých synech pohnula Davida, aby přivedl Abšaloma domů. Írá, syn Ikešův, Tekoitský, byl jedním z Davidových hrdinů a velitelem pro šestý měsíc. Rechabeám opevnil Tekoa spolu s Betlémem a Étamem a Jozafatovo vojsko vytáhlo na poušť Tekoa vstříc Moábcům a Amónům."
    - "Kniha Amosova začíná: „Slova Amosova, (kterýž byl mezi pastýři) z Tekoa“; mluvil proti severnímu království Izraele za dnů judského Uzijáše a Jarobeáma, syna Joašova, v 8. stol. př. n. l. Jeremjáš vyzval, aby se v Tekoa troubilo na polnici, když od severu přicházelo neštěstí. Po exilu Tekoitští opravovali dva úseky jeruzalémské hradby, ačkoli „ti, kteříž byli znamenitější z nich, nepodklonili šíje své k dílu pána svého“."
    - "Kolem roku 160 př. n. l. uprchli Jonatan a Šimon Makabejský před Bakchidem na poušť Tekoa. Ve válce proti Římu se Šimon bar Giora utábořil v Tekoa a Titus tam poslal Josepha, aby zjistil, zda se hodí pro tábor; na zpáteční cestě Josephus poznal mezi ukřižovanými tři muže, které znal, a dal je sundat, ale přežil jen jeden. Ve 4. století Eusebius znal Tekoa jako vesnici, kde se ukazoval Amosův hrob, a později tam byl postaven kostel."
  sv:
    - "Tekoa låg på en kulle vid Khirbet Tequ', omkring 8 km söder om Betlehem och 16 km söder om Jerusalem, där jordbruksmarken i Judeens berg övergår i den öken som bär dess namn. Namnet lever kvar i den närbelägna arabiska byn Tuqu'. Lämningarna på kullen löper från järnåldern, då Tekoa var en stad i Juda, till bysantinsk tid."
    - "Joav hämtade en klok kvinna från Tekoa, som med en påhittad historia om sina egna söner fick David att föra Absalom hem. Ira, Ickesh' son, tekoiten, var en av Davids hjältar och befälhavare för sjätte månaden. Rehabeam befäste Tekoa tillsammans med Betlehem och Etam, och Josafats här drog ut i Tekoas öken för att möta moabiterna och ammoniterna."
    - "Amos bok öppnar med ”Detta är vad som talades av Amos, en bland herdarna från Tekoa”; han talade mot nordriket Israel på Ussias av Juda och Jerobeams, Joas' sons, tid, på 700-talet f.Kr. Jeremia manade att basunen skulle blåsas i Tekoa när olyckan kom från norr. Efter exilen satte tekoiterna i stånd två avsnitt av Jerusalems mur, fast ”de förnämsta bland dem ville icke böja sin hals till att tjäna sin Herre”."
    - "Omkring 160 f.Kr. flydde Jonatan och Simon Mackabeus från Bacchides in i Tekoas öken. I kriget mot Rom slog Simon bar Giora läger vid Tekoa, och Titus sände Josefus dit för att se om det dög till läger; på hemvägen kände Josefus igen tre män bland de korsfästa som han kände och lät ta ner dem, men bara en överlevde. På 300-talet kände Eusebios Tekoa som en by där Amos grav visades, och en kyrka byggdes senare på platsen."
  nb:
    - "Tekoa lå på en høyde ved Khirbet Tequ', omkring 8 km sør for Betlehem og 16 km sør for Jerusalem, der jordbrukslandet i Judas åser går over i ørkenen som bærer navnet. Navnet lever videre i den nærliggende arabiske landsbyen Tuqu'. Levningene på høyden går fra jernalderen, da Tekoa var en by i Juda, til bysantinsk tid."
    - "Joab hentet en klok kvinne fra Tekoa, som med en oppdiktet historie om sine egne sønner fikk David til å hente Absalom hjem. Tekoitten Ira, Ikkesjs sønn, var en av Davids helter og anfører for den sjette måneden. Rehabeam befestet Tekoa sammen med Betlehem og Etam, og Josjafats hær drog ut i Tekoa-ørkenen for å møte moabittene og ammonittene."
    - "Amos' bok åpner med «De ord som Amos, en av hyrdene fra Tekoa»; han talte mot nordriket Israel i dagene til Ussia av Juda og Jeroboam, Joasjs sønn, på 700-tallet f.Kr. Jeremia ba om at basunen skulle blåses i Tekoa da ulykken kom fra nord. Etter eksilet satte tekoittene i stand to strekninger av Jerusalems mur, men «de fornemme blandt dem bøide ikke sin nakke under arbeidet for sin Herre»."
    - "Omkring 160 f.Kr. flyktet Jonatan og Simon Makkabeus fra Bakkhides inn i Tekoa-ørkenen. I krigen mot Roma slo Simon bar Giora leir ved Tekoa, og Titus sendte Josefus dit for å se om det egnet seg til en leir; på tilbaketuren kjente Josefus igjen tre menn han kjente blant de korsfestede og fikk dem tatt ned, men bare én overlevde. På 300-tallet kjente Eusebius Tekoa som en landsby der Amos' grav ble vist, og en kirke ble senere bygd på stedet."
  tl:
    - "Ang Tecoa ay nakatayo sa isang burol sa Khirbet Tequ', mga 8 km sa timog ng Bethlehem at 16 km sa timog ng Jerusalem, kung saan ang mga bukid ng mga burol ng Judea ay nagiging disyertong may gayon ding pangalan. Ang pangalan ay nananatili sa kalapit na nayong Arabe ng Tuqu'. Ang mga labi sa burol ay mula sa Panahong Bakal, nang ang Tecoa ay bayan ng Juda, hanggang sa panahong Bizantino."
    - "Kumuha si Joab ng matalinong babae mula sa Tecoa, na sa gawa-gawang kuwento tungkol sa sarili niyang mga anak ay nakahikayat kay David na iuwi si Absalom. Si Ira na anak ni Jecces na Tecoita ay isa sa mga makapangyarihang lalaki ni David at kapitan para sa ika-anim na buwan. Pinatibay ni Roboam ang Tecoa kasama ng Bethlehem at Etam, at ang hukbo ni Josaphat ay lumabas sa ilang ng Tecoa upang salubungin ang mga Moabita at Ammonita."
    - "Nagsisimula ang aklat ni Amos sa “Ang mga salita ni Amos, na nasa gitna ng mga pastor sa Tecoa”; nagsalita siya laban sa hilagang kaharian ng Israel noong kaarawan ni Uzzias ng Juda at ni Jeroboam na anak ni Joas, noong ika-8 siglo BK. Ipinatawag ni Jeremias ang pagpapatunog ng trumpeta sa Tecoa sapagkat dumarating ang sakuna mula sa hilaga. Pagkatapos ng pagkatapon, inayos ng mga Tecoita ang dalawang bahagi ng pader ng Jerusalem, bagaman “hindi inilagay ng kanilang mga mahal na tao ang kanilang mga leeg sa gawain ng kanilang Panginoon”."
    - "Noong mga 160 BK, tumakas sina Jonathan at Simon Macabeo mula kay Bacchides patungo sa ilang ng Tecoa. Sa digmaan laban sa Roma, nagkampo si Simon bar Giora sa Tecoa, at isinugo roon ni Tito si Josefo upang tingnan kung angkop itong kampuhan; pabalik, nakilala ni Josefo ang tatlong kakilala niya sa mga ipinako sa krus at ipinababa sila, ngunit isa lamang ang nabuhay. Noong ika-4 na siglo, kilala ni Eusebio ang Tecoa bilang nayong ipinakikita ang libingan ni Amos, at kalaunan ay may simbahang itinayo sa pook."
  da:
    - "Tekoa lå på en bakke ved Khirbet Tequ', omkring 8 km syd for Betlehem og 16 km syd for Jerusalem, hvor Judæas bjergegns agerland afløses af den ørken, der bærer dets navn. Navnet lever videre i den nærliggende arabiske landsby Tuqu'. Rester på bakken løber fra jernalderen, da Tekoa var en by i Juda, til den byzantinske periode."
    - "Joab hentede en klog kvinde fra Tekoa, som med en opdigtet historie om sine egne sønner fik David til at hente Absalon hjem. Ira, Ikkesjs søn, tekoitten, var en af Davids helte og anfører for den sjette måned. Rehabeam befæstede Tekoa sammen med Betlehem og Etam, og Josafats hær drog ud i Tekoas ørken for at møde moabitterne og ammonitterne."
    - "Amos' bog åbner med »De Ord, som Amos, der var iblandt Hyrderne fra Thekoa«; han talte imod det nordlige kongerige Israel i Uzzijas tid i Juda og Jeroboams, Joas' søns, tid, i 700-tallet f.Kr. Jeremias opfordrede til, at der blæstes i basun i Tekoa, da ulykken kom fra nord. Efter eksilet genopbyggede tekoitterne to stykker af Jerusalems mur, men »de store iblandt dem bøjede ikke deres Hals til Arbejde for deres Herre«."
    - "Omkring 160 f.Kr. flygtede Jonatan og Simon Makkabæus fra Bakkides ud i Tekoas ørken. I krigen mod Rom slog Simon bar Giora lejr ved Tekoa, og Titus sendte Josephus derhen for at se, om stedet egnede sig til en lejr; på tilbagevejen genkendte Josephus tre mænd, han kendte, blandt de korsfæstede og lod dem tage ned, men kun én overlevede. I 300-tallet kendte Eusebius Tekoa som en landsby, hvor Amos' grav blev vist, og en kirke blev senere bygget på stedet."
