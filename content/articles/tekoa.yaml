body:
  en:
    - "Tekoa stood on a hill at Khirbet Tequ', about 8 km south of Bethlehem and 16 km south of Jerusalem, where the farmland of the Judaean hills gives way to the desert that bears its name. The name lives on in the nearby Arab village of Tuqu'. Remains on the hill run from the Iron Age, when Tekoa was a town of Judah, to the Byzantine period."
    - "Joab fetched a wise woman from Tekoa, who with a made-up story of her own sons moved David to bring Absalom home. Ira son of Ikkesh the Tekoite was one of David's mighty men and the captain for the sixth month. Rehoboam fortified Tekoa together with Bethlehem and Etam, and Jehoshaphat's army went out into the wilderness of Tekoa to meet the Moabites and Ammonites."
    - 'The book of Amos opens with "The words of Amos, who was among the herdmen of Tekoa"; he spoke against the northern kingdom of Israel in the days of Uzziah of Judah and Jeroboam son of Joash, in the eighth century BC. Jeremiah called for the trumpet to be blown in Tekoa as disaster came from the north. After the exile the Tekoites repaired two stretches of Jerusalem''s wall, though "their nobles put not their necks to the work of their Lord".'
    - "About 160 BC Jonathan and Simon Maccabeus fled from Bacchides into the wilderness of Tekoa. In the war against Rome Simon bar Giora camped at Tekoa, and Titus sent Josephus there to see whether it was fit for a camp; on the way back Josephus recognised three men he knew among the crucified and had them taken down, but only one survived. In the fourth century Eusebius knew Tekoa as a village where the tomb of Amos was shown, and a church was later built on the site."
  ru:
    - "Фекоя стояла на холме Хирбет-Текуа, примерно в 8 км к югу от Вифлеема и в 16 км к югу от Иерусалима, там, где пашни Иудейских гор сменяются пустыней, носящей её имя. Название сохранилось в соседней арабской деревне Тукуа. Остатки на холме охватывают время от железного века, когда Фекоя была городом Иудеи, до византийской эпохи."
    - "Иоав взял из Фекои умную женщину, которая выдуманной историей о своих сыновьях склонила Давида вернуть Авессалома. Ира, сын Икеша, Фекоитянин, был одним из храбрых Давида и начальником отделения на шестой месяц. Ровоам укрепил Фекою вместе с Вифлеемом и Ефамом, а войско Иосафата выступило к пустыне Фекойской навстречу моавитянам и аммонитянам."
    - "Книга Амоса открывается словами «Слова Амоса, одного из пастухов Фекойских»; он говорил против северного Израильского царства во дни Озии, царя Иудейского, и Иеровоама, сына Иоасова, в VIII веке до н. э. Иеремия призывал трубить трубою в Фекое, потому что от севера появляется беда. После плена Фекойцы чинили два участка стены Иерусалима, хотя «знатнейшие из них не наклонили шеи своей поработать для Господа своего»."
    - "Около 160 г. до н. э. Ионафан и Симон Маккавеи бежали от Вакхида в пустыню Фекойскую. Во время войны с Римом у Фекои стоял лагерем Симон бар Гиора, а Тит послал туда Иосифа Флавия посмотреть, годится ли место для лагеря; на обратном пути Иосиф узнал среди распятых трёх знакомых и добился, чтобы их сняли, но выжил только один. В IV веке Евсевий знал Фекою как селение, где показывали гробницу Амоса, а позже на этом месте построили церковь."
  uk:
    - "Текоя стояла на пагорбі в Хірбет-Текуа, приблизно за 8 км на південь від Вифлеєма і за 16 км на південь від Єрусалима, де рілля юдейських пагорбів поступається пустелі, що носить її ім’я. Назва живе в сусідньому арабському селі Туку. Рештки на пагорбі тягнуться від залізної доби, коли Текоя була містом Юди, до візантійського періоду."
    - "Йоав покликав мудру жінку з Текої, яка вигаданою історією про власних синів схилила Давида повернути Авесалома додому. Іра, син Ікеша, текоянин, був одним із давидових лицарів і начальником на шостий місяць. Ровоам укріпив Текою разом з Вифлеємом та Етамом, а військо Йосафата вийшло в пустелю Текої назустріч моавитянам та аммонітянам."
    - "Книга Амоса починається словами: «Слова Амосові, що був ізміж Текойських скотарів»; він виголошував пророцтва проти північного царства Ізраїль за днів Уззії Юдейського та Єровоама, сина Йоаса, у VIII ст. до н. е. Єремія закликав сурмити в Текої, коли з півночі йшла біда. Після вигнання текоянини лагодили дві ділянки муру Єрусалима, хоча «значнїйші зпоміж їх не нахилили своєї шиї попрацювати задля Господа свого»."
    - "Близько 160 р. до н. е. Йонатан і Симон Макавеї втекли від Бакхіда в пустелю Текої. У війні проти Риму Симон бар-Гіора таборував у Текої, а Тит послав туди Йосифа Флавія подивитися, чи придатна вона для табору; на зворотному шляху Йосиф упізнав серед розіп’ятих трьох знайомих і звелів їх зняти, але вижив лише один. У IV столітті Євсевій знав Текою як село, де показували гробницю Амоса, а згодом на місці збудували церкву."
  es:
    - "Tecoa se alzaba sobre una colina en Khirbet Tequ', a unos 8 km al sur de Belén y 16 km al sur de Jerusalén, donde las tierras de labor de las colinas de Judea dan paso al desierto que lleva su nombre. El nombre pervive en la cercana aldea árabe de Tuqu'. Los restos de la colina van desde la Edad del Hierro, cuando Tecoa era una ciudad de Judá, hasta el período bizantino."
    - "Joab hizo venir de Tecoa a una mujer sabia que, con una historia inventada sobre sus propios hijos, movió a David a traer de vuelta a Absalón. Ira hijo de Iques el tecoíta fue uno de los valientes de David y el jefe del sexto mes. Roboam fortificó Tecoa junto con Belén y Etam, y el ejército de Josafat salió al desierto de Tecoa para hacer frente a los moabitas y amonitas."
    - "El libro de Amós se abre con «Las palabras de Amós, que fué entre los pastores de Tecoa»; habló contra el reino del norte, Israel, en los días de Uzías de Judá y Jeroboam hijo de Joás, en el siglo VIII a. C. Jeremías llamó a tocar la trompeta en Tecoa cuando el desastre venía del norte. Después del exilio los tecoítas repararon dos tramos de la muralla de Jerusalén, aunque «sus grandes no prestaron su cerviz á la obra de su Señor»."
    - "Hacia 160 a. C. Jonatán y Simón Macabeo huyeron de Báquides al desierto de Tecoa. En la guerra contra Roma, Simón bar Giora acampó en Tecoa, y Tito envió allí a Josefo para ver si servía para un campamento; al regresar, Josefo reconoció entre los crucificados a tres hombres que conocía e hizo que los bajaran, pero solo uno sobrevivió. En el siglo IV, Eusebio conocía Tecoa como una aldea donde se mostraba la tumba de Amós, y más tarde se construyó una iglesia en el lugar."
  pt:
    - "Tecoa ficava numa colina em Khirbet Tequ', cerca de 8 km ao sul de Belém e 16 km ao sul de Jerusalém, onde as terras de lavoura das colinas da Judeia dão lugar ao deserto que leva seu nome. O nome sobrevive na vizinha aldeia árabe de Tuqu'. Os vestígios na colina vão da Idade do Ferro, quando Tecoa era uma cidade de Judá, ao período bizantino."
    - "Joabe trouxe de Tecoa uma mulher sábia que, com uma história inventada sobre seus próprios filhos, levou Davi a trazer Absalão de volta. Ira, filho de Iques, o tecoíta, foi um dos valentes de Davi e capitão do sexto mês. Roboão fortificou Tecoa junto com Belém e Etã, e o exército de Josafá saiu para o deserto de Tecoa ao encontro dos moabitas e amonitas."
    - "O livro de Amós começa com “As palavras de Amós, que estava entre os pastores de Tecoa”; ele falou contra o reino do norte, Israel, nos dias de Uzias de Judá e de Jeroboão, filho de Joás, no século VIII a.C. Jeremias pediu que se tocasse a trombeta em Tecoa quando o desastre vinha do norte. Depois do exílio, os tecoítas repararam dois trechos da muralha de Jerusalém, embora “os seus nobres não colocaram os seus pescoços no trabalho do Senhor”."
    - "Por volta de 160 a.C., Jônatas e Simão Macabeu fugiram de Báquides para o deserto de Tecoa. Na guerra contra Roma, Simão bar Giora acampou em Tecoa, e Tito enviou Josefo para ver se o lugar servia para acampamento; na volta, Josefo reconheceu entre os crucificados três homens que conhecia e mandou tirá-los, mas só um sobreviveu. No século IV, Eusébio conhecia Tecoa como uma aldeia onde se mostrava o túmulo de Amós, e mais tarde se construiu uma igreja no local."
  de:
    - "Tekoa lag auf einem Hügel bei Khirbet Tequ', etwa 8 km südlich von Bethlehem und 16 km südlich von Jerusalem, wo das Ackerland des judäischen Berglands in die nach ihm benannte Wüste übergeht. Der Name lebt im nahen arabischen Dorf Tuqu' fort. Die Überreste auf dem Hügel reichen von der Eisenzeit, als Tekoa eine Stadt Judas war, bis in die byzantinische Zeit."
    - "Joab holte eine kluge Frau aus Tekoa, die David mit einer erfundenen Geschichte von ihren eigenen Söhnen bewegte, Absalom heimzuholen. Ira, der Sohn Ikkeschs, der Tekoiter, war einer von Davids Helden und der Hauptmann für den sechsten Monat. Rehabeam befestigte Tekoa zusammen mit Bethlehem und Etam, und Josaphats Heer zog in die Wüste Tekoa hinaus, den Moabitern und Ammonitern zu begegnen."
    - "Das Buch Amos beginnt: „Dies ist's, was Amos, der unter den Hirten zu Thekoa war, gesehen hat über Israel“; er sprach im achten Jahrhundert v. Chr. gegen das Nordreich Israel in den Tagen Usijas von Juda und Jerobeams, des Sohnes des Joas. Jeremia rief dazu auf, in Tekoa die Posaune zu blasen, als das Unheil aus dem Norden kam. Nach dem Exil besserten die Tekoiter zwei Strecken der Mauer Jerusalems aus, doch „ihre Vornehmeren brachten ihren Hals nicht zum Dienst ihrer Herren“."
    - "Um 160 v. Chr. flohen Jonatan und Simon Makkabäus vor Bakchides in die Wüste Tekoa. Im Krieg gegen Rom lagerte Simon bar Giora bei Tekoa, und Titus schickte Josephus dorthin, um zu sehen, ob es für ein Lager taugte; auf dem Rückweg erkannte Josephus unter den Gekreuzigten drei Männer, die er kannte, und ließ sie abnehmen, doch nur einer überlebte. Im vierten Jahrhundert kannte Eusebius Tekoa als Dorf, in dem das Grab des Amos gezeigt wurde, und später wurde an der Stelle eine Kirche gebaut."
  fr:
    - "Tekoa se dressait sur une colline à Khirbet Tequ’, à environ 8 km au sud de Bethléem et 16 km au sud de Jérusalem, là où les terres cultivées des collines de Judée cèdent la place au désert qui porte son nom. Le nom survit dans le village arabe voisin de Tuqu’. Les vestiges de la colline vont de l’âge du fer, quand Tekoa était une ville de Juda, à l’époque byzantine."
    - "Joab fit venir de Tekoa une femme habile qui, par une histoire inventée sur ses propres fils, amena David à ramener Absalom. Ira, fils d’Ikkesch, le Tekoïte, fut l’un des vaillants de David et le chef du sixième mois. Roboam fortifia Tekoa avec Bethléem et Étam, et l’armée de Josaphat sortit dans le désert de Tekoa pour affronter les Moabites et les Ammonites."
    - "Le livre d’Amos s’ouvre sur « Paroles d’Amos, l’un des bergers de Tekoa » ; il parla contre le royaume du nord, Israël, au temps d’Ozias de Juda et de Jéroboam fils de Joas, au VIIIe siècle av. J.-C. Jérémie appela à sonner de la trompette à Tekoa quand le malheur venait du nord. Après l’exil, les Tekoïtes réparèrent deux sections du mur de Jérusalem, bien que « leurs principaux ne se soumirent pas au service de leur seigneur »."
    - "Vers 160 av. J.-C., Jonathan et Simon Maccabée fuirent Bacchidès dans le désert de Tekoa. Dans la guerre contre Rome, Simon bar Giora campa à Tekoa, et Titus y envoya Josèphe voir si le lieu convenait à un camp ; au retour, Josèphe reconnut parmi les crucifiés trois hommes qu’il connaissait et les fit descendre, mais un seul survécut. Au IVe siècle, Eusèbe connaissait Tekoa comme un village où l’on montrait le tombeau d’Amos, et une église fut plus tard bâtie sur le site."
