body:
  en:
    - "Kerioth, “towns”, was a city of Moab, named in the Bible only by the prophets. Amos foretold that God would send a fire upon Moab “and it shall devour the palaces of Kerioth: and Moab shall die with tumult, with shouting, and with the sound of the trumpet”. Jeremiah's oracle on Moab brings judgement “upon Kerioth, and upon Bozrah, and upon all the cities of the land of Moab, far or near”, and later cries, “Kerioth is taken, and the strong holds are surprised”. The Hebrew word can also be read as a common noun, and the Synodal Bible does so in that last place, “the cities will be taken”. The palaces of Amos and the fortresses of Jeremiah mark Kerioth as one of the chief towns of the kingdom."
    - "Outside the Bible, the stele of King Mesha, set up in the ninth century BC and found at Dhiban in 1868, tells how he took Ataroth from the men of Gad, killed its people and resettled it with men of Sharon and Maharith, and how he dragged a captured object, the altar-hearth of its god or the chief of the town (the reading is debated), “before Chemosh in Kerioth”. Kerioth was thus a seat of Chemosh, the god of Moab, and the stele puts it within reach of Ataroth, on the tableland north of the Arnon."
    - "The site is not known. The usual candidate is el-Qereiyat (Qurayyat), a village between Dibon and Ataroth whose name keeps the ancient one; Khirbet Aleiyan to the east has also been proposed. Older scholars identified Kerioth with Ar, the ancient capital of Moab, or with Kir-hareseth (Kerak), taking Jeremiah's pairing of Kerioth and Bozrah to mean the great cities of the land; these views now have few followers, and the map shows all the candidates without choosing. Kerioth-hezron in the Negeb of Judah, from which some derive the name of Judas Iscariot, is a different place. The Moabite Kerioth, if it stood at el-Qereiyat, lies today in the Madaba Governorate of Jordan."
  ru:
    - "Кериоф, «города», был городом Моава, названным в Библии только у пророков. Амос предрёк, что Бог пошлёт огонь на Моава, «и пожрет чертоги Кериофа, и погибнет Моав среди разгрома с шумом, при звуке трубы». Пророчество Иеремии о Моаве несёт суд «на Кериоф, и на Восор, и на все города земли Моавитской, дальние и ближние», а дальше восклицает, что Кериоф взят и крепости завоёваны. Еврейское слово можно читать и как нарицательное, и Синодальный перевод так и делает в этом последнем месте: «Города будут взяты, и крепости завоеваны». Чертоги у Амоса и крепости у Иеремии показывают, что Кериоф был одним из главных городов царства."
    - "Вне Библии стела царя Месы, поставленная в IX веке до н. э. и найденная в Дивоне в 1868 году, рассказывает, как он взял Атароф у сынов Гада, перебил его жителей и заселил его людьми из Шарона и Махарифа, а захваченный предмет — жертвенный очаг его бога или вождя города (чтение спорно) — приволок «пред Хамосом в Кериоф». Кериоф, таким образом, был местом почитания Хамоса, бога Моава, и стела помещает его недалеко от Атарофа, на плоскогорье к северу от Арнона."
    - "Место неизвестно. Обычный кандидат — эль-Курайят, деревня между Дивоном и Атарофом, в имени которой живёт древнее; предлагали и Хирбет-Алейян восточнее. Учёные прошлого отождествляли Кериоф с Аром, древней столицей Моава, или с Кирхарешетом (Кераком), понимая пару Кериоф и Восор у Иеремии как великие города страны; теперь у этих взглядов мало сторонников, и на карте показаны все кандидаты без выбора между ними. Кириаф-Хецрон в Негеве Иудином, от которого некоторые производят прозвище Иуды Искариота, — другое место. Моавитский Кериоф, если он стоял в эль-Курайяте, лежит сегодня в провинции Мадаба в Иордании."
  uk:
    - "Керіот, «міста», був містом Моаву, названим у Біблії лише пророками. Амос провіщав, що Бог пошле вогонь на Моав, «й пожере будівлї Керіоту, й погибне Моаб серед розгрому й трубнього гуку». Пророцтво Єремії про Моав накликає суд «на Керіот і на Восор та й на всї городи Моабські, як далекі, так і близькі», а далі вигукує, що Керіот узято й твердині захоплено. Староєврейське слово можна прочитати й як загальну назву, і Куліш саме так і робить у цьому останньому місці: «Загорне міста, звоює твердинї». Палаци в Амоса й фортеці в Єремії позначають Керіот як одне з головних міст царства."
    - "Поза Біблією стела царя Меші, поставлена в IX ст. до н. е. й знайдена в Дібані 1868 р., розповідає, як він узяв Атарот у мужів Гада, вбив його мешканців і заселив його людьми з Шарону та з Махариту, і як він приволік захоплений предмет, жертовне вогнище його бога або вождя міста (читання спірне), «перед Хемошем у Керіоті». Отже, Керіот був осередком Хемоша, бога Моаву, а стела розміщує його поряд з Атаротом, на плоскогір’ї на північ від Арнону."
    - "Місце невідоме. Звичайний кандидат — ель-Керейят (Курайят), село між Дівоном і Атаротом, чия назва зберігає давню; пропонували й Хірбет-Алейян на сході. Старші вчені ототожнювали Керіот з Аром, давньою столицею Моаву, або з Кір-Харешетом (Керак), розуміючи поєднання Керіоту й Боцри в Єремії як позначення великих міст краю; ці погляди тепер мають мало прихильників, і мапа показує всіх кандидатів, не обираючи. Керіот-Хецрон у Негеві Юди, від якого дехто виводить ім’я Юди Іскаріота, — інше місце. Моавитський Керіот, якщо він стояв у ель-Керейяті, лежить сьогодні в мухафазі Мадаба в Йорданії."
  es:
    - "Queriot, «ciudades», era una ciudad de Moab que la Biblia nombra solo por boca de los profetas. Amós anunció que Dios enviaría fuego sobre Moab, «y consumirá los palacios de Chêrioth: y morirá Moab en alboroto, en estrépito y sonido de trompeta». El oráculo de Jeremías sobre Moab trae el juicio «sobre Chêrioth, y sobre Bosra, y sobre todas las ciudades de tierra de Moab, las de lejos y las de cerca», y más adelante clama: «Tomadas son las ciudades, y tomadas son las fortalezas». La palabra hebrea Queriot puede leerse también como nombre común, y así lo hacen en ese último lugar tanto la Reina-Valera como la Biblia sinodal («las ciudades serán tomadas»). Los palacios de Amós y las fortalezas de Jeremías señalan a Queriot como una de las ciudades principales del reino."
    - "Fuera de la Biblia, la estela del rey Mesa, erigida en el siglo IX a. C. y hallada en Dhiban en 1868, cuenta cómo tomó Atarot a los hombres de Gad, mató a su gente y la repobló con hombres de Sarón y de Maharit, y cómo arrastró un objeto capturado, el hogar-altar de su dios o el jefe de la ciudad (la lectura se discute), «ante Quemós en Queriot». Queriot fue, pues, sede de Quemós, el dios de Moab, y la estela la sitúa al alcance de Atarot, en la meseta al norte del Arnón."
    - "No se conoce el emplazamiento. El candidato habitual es el-Qereiyat (Qurayyat), una aldea entre Dibón y Atarot cuyo nombre conserva el antiguo; también se ha propuesto Khirbet Aleiyan, al este. Estudiosos más antiguos identificaron Queriot con Ar, la antigua capital de Moab, o con Kir-hareset (Kerak), entendiendo que el emparejamiento de Queriot y Bosra en Jeremías designaba las grandes ciudades del país; estas opiniones tienen hoy pocos partidarios, y el mapa muestra todos los candidatos sin elegir. Queriot-hezrón, en el Néguev de Judá, de la que algunos derivan el nombre de Judas Iscariote, es un lugar distinto. La Queriot moabita, si estaba en el-Qereiyat, se encuentra hoy en la gobernación de Madaba, en Jordania."
  pt:
    - "Queriote, “cidades”, era uma cidade de Moabe, citada na Bíblia apenas pelos profetas. Amós anunciou que Deus enviaria fogo sobre Moabe: “e ele devorará os palácios de Queriote; e Moabe morrerá com tumulto, com gritos de guerra e com o som da trombeta”. O oráculo de Jeremias sobre Moabe traz juízo “sobre Queriote, sobre Bozra, e sobre todas as cidades da terra de Moabe, distantes ou próximas”, e mais adiante clama: “Queriote foi tomada, e as fortalezas foram capturadas”. A palavra hebraica também pode ser lida como substantivo comum, e a Bíblia Sinodal assim a entende nesse último passo: “as cidades serão tomadas”. Os palácios de Amós e as fortalezas de Jeremias marcam Queriote como uma das principais cidades do reino."
    - "Fora da Bíblia, a estela do rei Mesa, erguida no século IX a.C. e encontrada em Dhiban em 1868, conta como ele tomou Atarote dos homens de Gade, matou o seu povo e a repovoou com homens de Sarom e de Maharit, e como arrastou um objeto capturado, a lareira-altar do seu deus ou o chefe da cidade (a leitura é debatida), “diante de Camos em Queriote”. Queriote era, portanto, um centro de Camos, o deus de Moabe, e a estela a situa ao alcance de Atarote, no planalto ao norte do Arnom."
    - "O sítio não é conhecido. O candidato habitual é el-Qereiyat (Qurayyat), uma aldeia entre Dibom e Atarote cujo nome conserva o antigo; Khirbet Aleiyan, a leste, também foi proposta. Estudiosos mais antigos identificaram Queriote com Ar, a antiga capital de Moabe, ou com Quir-Haresete (Kerak), entendendo que o par Queriote e Bozra, em Jeremias, designava as grandes cidades do país; essas opiniões hoje têm poucos adeptos, e o mapa mostra todos os candidatos sem escolher. Queriote-Hezrom, no Neguebe de Judá, de onde alguns derivam o nome de Judas Iscariotes, é outro lugar. A Queriote moabita, se ficava em el-Qereiyat, situa-se hoje na província de Madaba, na Jordânia."
  de:
    - "Kerijot, „Städte“, war eine Stadt Moabs, in der Bibel nur bei den Propheten genannt. Amos kündigte an, Gott werde ein Feuer „schicken nach Moab, das soll die Paläste zu Karioth verzehren; und Moab soll sterben im Getümmel und Geschrei und Posaunenhall“. Jeremias Spruch über Moab bringt das Gericht über „Karioth, Bozra und über alle Städte im Lande Moab, sie liegen fern oder nahe“ und ruft später: „Karioth ist gewonnen, und die festen Städte sind eingenommen“. Das hebräische Wort kann auch als Gattungsname gelesen werden, und die Synodalbibel tut das an der letzten Stelle und liest dort „Städte“ statt des Ortsnamens. Die Paläste bei Amos und die Festungen bei Jeremia zeigen Kerijot als eine der Hauptstädte des Königreichs."
    - "Außerhalb der Bibel erzählt die Stele des Königs Mesa, im 9. Jahrhundert v. Chr. errichtet und 1868 in Dhiban gefunden, wie er Atarot den Männern von Gad abnahm, sein Volk tötete und es mit Männern aus Scharon und Maharit neu besiedelte, und wie er einen erbeuteten Gegenstand, den Altarherd seines Gottes oder des Stadtobersten (die Lesung ist umstritten), „vor Kemosch in Kerijot“ schleifte. Kerijot war damit ein Sitz Kemoschs, des Gottes Moabs, und die Stele rückt es in die Nähe von Atarot, auf die Hochebene nördlich des Arnon."
    - "Die Lage ist unbekannt. Der übliche Kandidat ist el-Qereiyat (Qurayyat), ein Dorf zwischen Dibon und Atarot, dessen Name den alten bewahrt; auch Khirbet Aleiyan im Osten wurde vorgeschlagen. Ältere Forscher setzten Kerijot mit Ar, der alten Hauptstadt Moabs, oder mit Kir-Heres (Kerak) gleich und verstanden Jeremias Paarung von Kerijot und Bozra als die großen Städte des Landes; diese Ansichten haben heute wenige Anhänger, und die Karte zeigt alle Kandidaten, ohne zu wählen. Kerijot-Hezron im Negev Judas, von dem manche den Namen des Judas Iskariot herleiten, ist ein anderer Ort. Das moabitische Kerijot liegt, wenn es bei el-Qereiyat stand, heute im Gouvernement Madaba in Jordanien."
  fr:
    - "Kerijoth, « villes », était une ville de Moab, nommée dans la Bible seulement par les prophètes. Amos annonça que Dieu enverrait le feu sur Moab, « et il dévorera les palais de Kerijoth ; et Moab périra au milieu du tumulte, au milieu des cris de guerre et du bruit de la trompette ». L’oracle de Jérémie sur Moab appelle le jugement « sur Kerijoth, sur Botsra, sur toutes les villes du pays de Moab, éloignées et proches », puis s’écrie : « Kerijoth est prise, les forteresses sont emportées. » Le mot hébreu peut aussi se lire comme un nom commun, et la Bible synodale le fait à ce dernier endroit, où elle lit que les villes seront prises. Les palais d’Amos et les forteresses de Jérémie désignent Kerijoth comme l’une des principales villes du royaume."
    - "En dehors de la Bible, la stèle du roi Mescha, dressée au IXe siècle av. J.-C. et trouvée à Dhiban en 1868, raconte comment il prit Atharoth aux hommes de Gad, tua sa population et la repeupla d’hommes de Saron et de Maharith, et comment il traîna un objet capturé, le foyer-autel de son dieu ou le chef de la ville (la lecture est débattue), « devant Kemosch à Kerijoth ». Kerijoth était donc un siège de Kemosch, dieu de Moab, et la stèle la place à portée d’Atharoth, sur le plateau au nord de l’Arnon."
    - "Le site est inconnu. Le candidat habituel est el-Qereiyat (Qurayyat), village situé entre Dibon et Atharoth, dont le nom garde l’ancien ; Khirbet Aleiyan, à l’est, a aussi été proposé. D’anciens savants identifiaient Kerijoth avec Ar, l’ancienne capitale de Moab, ou avec Kir-Haréseth (Kérak), comprenant l’association de Kerijoth et de Botsra chez Jérémie comme désignant les grandes villes du pays ; ces vues ont aujourd’hui peu de partisans, et la carte montre tous les candidats sans choisir. Kerijoth-Hetsron, dans le Négev de Juda, d’où certains tirent le nom de Judas Iscariote, est un lieu différent. Le Kerijoth moabite, s’il se trouvait à el-Qereiyat, se situe aujourd’hui dans le gouvernorat de Madaba, en Jordanie."
  it:
    - "Keriot, «città», era una città di Moab, nominata nella Bibbia soltanto dai profeti. Amos predisse che Dio avrebbe mandato in Moab un fuoco, «che divorerà i palazzi di Keriot; e Moab perirà in mezzo al tumulto, ai gridi di guerra e al suon delle trombe». L’oracolo di Geremia su Moab porta il giudizio «su Kerioth, su Botsra, su tutte le città del paese di Moab, lontane e vicine», e più oltre grida: «Kerioth è presa, le fortezze sono occupate». La parola ebraica può anche essere letta come nome comune, e la Bibbia sinodale fa così in quest’ultimo passo: «le città saranno prese». I palazzi di Amos e le fortezze di Geremia indicano Keriot come una delle città principali del regno."
    - "Fuori della Bibbia, la stele del re Mesa, innalzata nel IX secolo a.C. e trovata a Dhiban nel 1868, racconta come egli prese Atarot agli uomini di Gad, ne uccise gli abitanti e vi insediò uomini di Saròn e di Maharit, e come trascinò un oggetto catturato, il focolare-altare del suo dio o del capo della città (la lettura è discussa), «davanti a Chemosh in Keriot». Keriot fu dunque una sede di Chemosh, il dio di Moab, e la stele la pone a breve distanza da Atarot, sull’altopiano a nord dell’Arnon."
    - "Il sito non è noto. Il candidato abituale è el-Qereiyat (Qurayyat), un villaggio tra Dibon e Atarot il cui nome conserva quello antico; è stata proposta anche Khirbet Aleiyan, a est. Studiosi più antichi identificarono Keriot con Ar, l’antica capitale di Moab, o con Kir-Cheres (Kerak), intendendo l’accoppiamento di Keriot e Bosra in Geremia come le grandi città del paese; queste opinioni hanno oggi pochi seguaci, e la mappa mostra tutti i candidati senza sceglierne uno. Keriot-Chesron, nel Negheb di Giuda, da cui alcuni derivano il nome di Giuda Iscariota, è un luogo diverso. La Keriot moabita, se sorgeva a el-Qereiyat, si trova oggi nel governatorato di Màdaba, in Giordania."
  pl:
    - "Kerijot, „miasta”, było miastem Moabu, wymienianym w Biblii tylko przez proroków. Amos zapowiedział, że Bóg ześle ogień na Moab, „który pożre pałace Karyjot; i umrze Moab w huku, w krzyku i w głosie trąby”. Wyrocznia Jeremiasza o Moabie sprowadza sąd „na Karyjot, i na Bocrę, i na wszystkie miasta ziemi Moabskiej, dalekie i bliskie”, a potem woła: „Karyjot wzięte będzie, i zamki wzięte będą”. Hebrajskie słowo można też czytać jako rzeczownik pospolity, i Biblia synodalna tak właśnie czyni w tym ostatnim miejscu: „miasta zostaną zdobyte”. Pałace u Amosa i twierdze u Jeremiasza wskazują, że Kerijot było jednym z głównych miast królestwa."
    - "Poza Biblią stela króla Meszy, postawiona w IX w. p.n.e. i odnaleziona w Dhiban w 1868 r., opowiada, jak zdobył on Atarot od ludzi z Gada, zabił jego mieszkańców i osiedlił w nim ludzi z Szaronu i Maharitu, i jak wlókł zdobyty przedmiot, ołtarzowe palenisko jego boga albo naczelnika miasta (odczytanie jest sporne), „przed Kemoszem w Kerijot”. Kerijot było więc siedzibą Kemosza, boga Moabu, a stela umieszcza je w pobliżu Atarot, na płaskowyżu na północ od Arnonu."
    - "Miejsce nie jest znane. Zwykłym kandydatem jest el-Qereiyat (Qurayyat), wieś między Dibonem a Atarot, której nazwa zachowuje starożytną; zaproponowano też Khirbet Aleiyan na wschodzie. Dawniejsi uczeni utożsamiali Kerijot z Ar, starożytną stolicą Moabu, albo z Kir-Chareszet (Kerak), uznając, że zestawienie Kerijot i Bosry u Jeremiasza oznacza wielkie miasta kraju; poglądy te mają dziś niewielu zwolenników, a mapa pokazuje wszystkich kandydatów bez wybierania. Kerijjot-Chesron na Negewie Judy, od którego niektórzy wywodzą imię Judasza Iskarioty, to inne miejsce. Moabickie Kerijot, jeśli stało w el-Qereiyat, leży dziś w muhafazie Madaba w Jordanii."
  nl:
    - "Keriot, “steden”, was een stad van Moab, in de Bijbel alleen bij de profeten genoemd. Amos voorspelde dat God een vuur over Moab zou zenden: “Daarom zal Ik een vuur in Moab zenden, dat zal de paleizen van Kerioth verteren; en Moab zal sterven met groot gedruis, met gejuich, met geluid der bazuin”. Jeremia's godsspraak over Moab brengt het oordeel “over Kerioth, en over Bozra; ja, over alle steden van Moabs land, die verre en die nabij zijn”, en roept later uit dat Keriot is ingenomen en de vestingen zijn overrompeld. Het Hebreeuwse woord kan ook als soortnaam worden gelezen, en de Synodale Bijbel doet dat op die laatste plaats: “de steden zullen worden ingenomen”. De paleizen bij Amos en de vestingen bij Jeremia tonen Keriot als een van de hoofdsteden van het koninkrijk."
    - "Buiten de Bijbel vertelt de stèle van koning Mesa, in de negende eeuw v.Chr. opgericht en in 1868 bij Dhiban gevonden, hoe hij Atarot de mannen van Gad ontnam, zijn volk doodde en het opnieuw bevolkte met mannen uit Saron en Maharit, en hoe hij een buitgemaakt voorwerp, de altaarhaard van zijn god of van de overste van de stad (de lezing wordt betwist), “voor Kemos in Keriot” sleepte. Keriot was dus een zetel van Kemos, de god van Moab, en de stèle plaatst het binnen bereik van Atarot, op het hoogland ten noorden van de Arnon."
    - "De plaats is niet bekend. De gebruikelijke kandidaat is el-Qereiyat (Qurayyat), een dorp tussen Dibon en Atarot waarvan de naam de oude bewaart; ook Khirbet Aleiyan in het oosten is voorgesteld. Oudere geleerden identificeerden Keriot met Ar, de oude hoofdstad van Moab, of met Kir-Hareset (Kerak), in de veronderstelling dat Jeremia's koppeling van Keriot en Bozra de grote steden van het land bedoelt; deze opvattingen hebben nu weinig aanhangers, en de kaart toont alle kandidaten zonder te kiezen. Keriot-Chesron in de Negev van Juda, waarvan sommigen de naam van Judas Iskariot afleiden, is een andere plaats. Het Moabitische Keriot ligt, als het bij el-Qereiyat stond, tegenwoordig in het gouvernement Madaba in Jordanië."
  cs:
    - "Keriót, „města“, bylo moábské město, v Bibli jmenované jen proroky. Amos předpověděl, že Bůh sešle na Moáb oheň, „kterýžto zžíře paláce Kariot, i umře s hlukem Moáb, s křikem a s hlasem trouby“. Jeremjášovo proroctví o Moábu přivádí soud „na Kariot, a na Bozru i na všecka města země Moábské, daleká i blízká“ a později volá: „Vzato bude Kariot, i pevnosti pobrány budou“. Hebrejské slovo lze číst i jako obecné jméno a ruská synodální Bible tak činí na tomto posledním místě: „města budou dobyta“. Paláce u Amose a pevnosti u Jeremjáše označují Keriót za jedno z hlavních měst království."
    - "Mimo Bibli vypráví stéla krále Meši, postavená v 9. století př. n. l. a nalezená v Dhibánu roku 1868, jak dobyl Atarót od mužů z Gádu, pobil jeho obyvatele a znovu je osídlil muži ze Šaronu a z Maharitu, a jak odvlekl zajatý předmět, oltářní ohniště jeho boha nebo náčelníka města (čtení je sporné), „před Kemoše v Keriótu“. Keriót byl tedy sídlem Kemoše, boha Moábu, a stéla jej klade na dosah Atarótu, na náhorní rovině severně od Arnonu."
    - "Místo není známo. Obvyklým kandidátem je el-Qereiyat (Qurayyat), vesnice mezi Dibonem a Atarótem, jejíž jméno uchovává starobylé; navržen byl i Khirbet Aleiyan na východě. Starší badatelé ztotožňovali Keriót s Árem, dávným hlavním městem Moábu, nebo s Kír-charesetem (Kerak), v domnění, že Jeremjášova dvojice Keriót a Bosra znamená velká města země; tyto názory mají dnes málo stoupenců a mapa ukazuje všechny kandidáty bez volby. Keriót-checron v judském Negevu, z něhož někteří odvozují jméno Jidáše Iškariotského, je jiné místo. Moábský Keriót, pokud stál v el-Qereiyat, leží dnes v guvernorátu Madaba v Jordánsku."
  sv:
    - "Keriot, ”städer”, var en stad i Moab, nämnd i Bibeln bara av profeterna. Amos förutsade att Gud skulle sända en eld mot Moab, ”och den skall förtära Keriots palatser; och Moab skall omkomma under stridslarm, under härskri vid basuners ljud”. Jeremias utsaga om Moab bringar dom ”över Keriot och Bosra och över alla andra städer i Moabs land, vare sig de ligga fjärran eller nära”, och ropar senare: ”Keriot bliver intaget, bergfästena bliva erövrade”. Det hebreiska ordet kan också läsas som ett vanligt substantiv, och Synodalbibeln gör så på det sista stället: ”städerna skall intas”. Amos palats och Jeremias fästen utpekar Keriot som en av rikets främsta städer."
    - "Utanför Bibeln berättar kung Meshas stele, rest på 800-talet f.Kr. och funnen i Dhiban 1868, hur han tog Atarot från Gads män, dödade dess folk och bosatte det på nytt med män från Saron och Maharit, och hur han släpade ett erövrat föremål, altarhärden för stadens gud eller för stadens hövding (läsningen är omdebatterad), ”inför Kemosh i Keriot”. Keriot var alltså ett säte för Kemosh, Moabs gud, och stelen placerar det inom räckhåll från Atarot, på högplatån norr om Arnon."
    - "Platsen är okänd. Den vanliga kandidaten är el-Qereiyat (Qurayyat), en by mellan Dibon och Atarot vars namn bevarar det gamla; Khirbet Aleiyan i öster har också föreslagits. Äldre forskare identifierade Keriot med Ar, Moabs urgamla huvudstad, eller med Kir-Hareset (Kerak), och tog Jeremias parning av Keriot och Bosra som de stora städerna i landet; dessa åsikter har nu få anhängare, och kartan visar alla kandidater utan att välja. Keriot-Hesron i Negev i Juda, varifrån vissa härleder namnet Judas Iskariot, är en annan plats. Det moabitiska Keriot, om det låg vid el-Qereiyat, ligger i dag i Madabas guvernement i Jordanien."
  nb:
    - "Kerijot, «byer», var en by i Moab, nevnt i Bibelen bare av profetene. Amos forutsa at Gud ville sende ild mot Moab, «og den skal fortære Kerijots palasser, og Moab skal dø under krigsbulder, under hærskrik, under basunens lyd». Jeremias orakel mot Moab bringer dom «over Kerijot og over Bosra og over alle byene i Moabs land, fjernt og nær», og senere roper han at Kerijot er inntatt og festningene overrumplet. Det hebraiske ordet kan også leses som et fellesnavn, og den russiske synodalbibelen gjør det på det siste stedet: «byene skal bli inntatt». Amos' palasser og Jeremias' festninger kjennetegner Kerijot som en av rikets hovedbyer."
    - "Utenfor Bibelen forteller kong Mesas stele, reist på 800-tallet f.Kr. og funnet i Dhiban i 1868, hvordan han tok Atarot fra Gads menn, drepte innbyggerne og bosatte menn fra Sjaron og Maharit der, og hvordan han slepte en erobret gjenstand, alterildstedet til byens gud eller til byens leder (lesningen er omstridt), «for Kemosj i Kerijot». Kerijot var altså et sete for Kemosj, Moabs gud, og stelen plasserer den innen rekkevidde av Atarot, på høylandet nord for Arnon."
    - "Stedet er ukjent. Den vanlige kandidaten er el-Qereiyat (Qurayyat), en landsby mellom Dibon og Atarot hvis navn har bevart det gamle; Khirbet Aleiyan lenger øst er også foreslått. Eldre forskere identifiserte Kerijot med Ar, Moabs gamle hovedstad, eller med Kir-Hareset (Kerak), og forsto Jeremias sammenstilling av Kerijot og Bosra som landets store byer; disse oppfatningene har nå få tilhengere, og kartet viser alle kandidatene uten å velge. Kerijot-Hesron i Negev i Juda, som noen utleder Judas Iskariots navn av, er et annet sted. Det moabittiske Kerijot, hvis det lå ved el-Qereiyat, ligger i dag i Madaba-guvernementet i Jordan."
  tl:
    - "Ang Cherioth, “mga bayan”, ay lungsod ng Moab, na pinangalanan sa Biblia ng mga propeta lamang. Inihula ni Amos na magpapadala ang Diyos ng apoy sa Moab, na “susupukin niyaon ang mga palacio ng Cherioth; at ang Moab ay mamamatay na may kaingay, may hiyawan, at may tunog ng pakakak”. Ang orakulo ni Jeremias tungkol sa Moab ay nagdadala ng hatol: “At sa Cherioth, at sa Bosra, at sa lahat ng bayan ng lupain ng Moab, malayo o malapit”, at kalaunan ay sumisigaw, “Ang Cherioth ay nasakop, at ang mga katibayan ay nasamsam”. Mababasa rin bilang karaniwang pangngalan ang salitang Hebreo, at gayon ang ginagawa ng Synodal Bible sa huling talatang iyon: “masasakop ang mga lungsod”. Ang mga palacio ni Amos at ang mga kuta ni Jeremias ay nagpapakita sa Cherioth bilang isa sa mga pangunahing bayan ng kaharian."
    - "Sa labas ng Biblia, isinasalaysay ng estela ni Haring Mesa, itinayo noong ika-9 na siglo BK at natagpuan sa Dhiban noong 1868, kung paano niya kinuha ang Ataroth mula sa mga tao ng Gad, pinatay ang mga tao nito at muling pinatira ito ng mga tao ng Saron at Maharith, at kung paano niya kinaladkad ang isang nasamsam na bagay, ang altar-apuyan ng diyos nito o ng pinuno ng bayan (pinagtatalunan ang pagbasa), “sa harap ni Chemos sa Cherioth”. Kaya ang Cherioth ay luklukan ni Chemos, ang diyos ng Moab, at inilalagay ito ng estela sa abot ng Ataroth, sa talampas sa hilaga ng Arnon."
    - "Hindi alam ang pook. Ang karaniwang kandidato ay ang el-Qereiyat (Qurayyat), isang nayon sa pagitan ng Dibon at Ataroth na ang pangalan ay nag-iingat ng sinauna; iminungkahi rin ang Khirbet Aleiyan sa silangan. Kinilala ng mga lumang iskolar ang Cherioth sa Ar, ang sinaunang kabisera ng Moab, o sa Cir-hareseth (Kerak), na ipinapalagay na ang pagpapares ni Jeremias sa Cherioth at Bosra ay nangangahulugan ng mga dakilang lungsod ng lupain; kakaunti na ang sumusunod sa mga pananaw na ito, at ipinapakita ng mapa ang lahat ng kandidato nang walang pinipili. Ang Cheriothhesron sa Negeb ng Juda, na pinagmulan daw ng pangalan ni Judas Iscariote ayon sa ilan, ay ibang pook. Ang Cherioth ng Moab, kung nakatayo sa el-Qereiyat, ay nasa Madaba Governorate ng Jordan ngayon."
