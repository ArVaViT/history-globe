# Overview article (ADR 0007). Mainstream facts only; the site is unknown and the app's candidates are given without choosing; the reading of the Mesha Stele's line on Kerioth is named as debated.
id: kerioth
place: a2d84de
title:
  en: "Kerioth"
  ru: "Кериоф"
  uk: "Керіот"
  es: "Queriot"
  pt: "Queriote"
  de: "Kerijot"
  fr: "Kerijoth"
body:
  en:
    - "Kerioth, “towns”, was a city of Moab, named in the Bible only by the prophets. Amos foretold that God would send a fire upon Moab “and it shall devour the palaces of Kerioth: and Moab shall die with tumult, with shouting, and with the sound of the trumpet”. Jeremiah's oracle on Moab brings judgement “upon Kerioth, and upon Bozrah, and upon all the cities of the land of Moab, far or near”, and later cries, “Kerioth is taken, and the strong holds are surprised”. The Hebrew word can also be read as a common noun, and the Synodal Bible does so in that last place, “the cities will be taken”. The palaces of Amos and the fortresses of Jeremiah mark Kerioth as one of the chief towns of the kingdom."
    - "Outside the Bible, the stele of King Mesha, set up in the ninth century BC and found at Dhiban in 1868, tells how he took Ataroth from the men of Gad, killed its people and resettled it with men of Sharon and Maharith, and how he dragged a captured object, the altar-hearth of its god or the chief of the town (the reading is debated), “before Chemosh in Kerioth”. Kerioth was thus a seat of Chemosh, the god of Moab, and the stele puts it within reach of Ataroth, on the tableland north of the Arnon."
    - "The site is not known. The usual candidate is el-Qereiyat (Qurayyat), a village between Dibon and Ataroth whose name keeps the ancient one; Khirbet Aleiyan to the east has also been proposed. Older scholars identified Kerioth with Ar, the ancient capital of Moab, or with Kir-hareseth (Kerak), taking Jeremiah's pairing of Kerioth and Bozrah to mean the great cities of the land; these views now have few followers, and the map shows all the candidates without choosing. Kerioth-hezron in the Negeb of Judah, from which some derive the name of Judas Iscariot, is a different place. The Moabite Kerioth, wherever it stood, lies today in the Madaba Governorate of Jordan."
  ru:
    - "Кериоф, «города», был городом Моава, названным в Библии только у пророков. Амос предрёк, что Бог пошлёт огонь на Моава, «и пожрет чертоги Кериофа, и погибнет Моав среди разгрома с шумом, при звуке трубы». Пророчество Иеремии о Моаве несёт суд «на Кериоф, и на Восор, и на все города земли Моавитской, дальние и ближние», а дальше восклицает, что Кериоф взят и крепости завоёваны. Еврейское слово можно читать и как нарицательное, и Синодальный перевод так и делает в этом последнем месте: «Города будут взяты, и крепости завоеваны». Чертоги у Амоса и крепости у Иеремии показывают, что Кериоф был одним из главных городов царства."
    - "Вне Библии стела царя Месы, поставленная в IX веке до н. э. и найденная в Дивоне в 1868 году, рассказывает, как он взял Атароф у сынов Гада, перебил его жителей и заселил его людьми из Шарона и Махарифа, а захваченный предмет — жертвенный очаг его бога или вождя города (чтение спорно) — приволок «пред Хамосом в Кериоф». Кериоф, таким образом, был местом почитания Хамоса, бога Моава, и стела помещает его недалеко от Атарофа, на плоскогорье к северу от Арнона."
    - "Место неизвестно. Обычный кандидат — эль-Курайят, деревня между Дивоном и Атарофом, в имени которой живёт древнее; предлагали и Хирбет-Алейян восточнее. Учёные прошлого отождествляли Кериоф с Аром, древней столицей Моава, или с Кирхарешетом (Кераком), понимая пару Кериоф и Восор у Иеремии как великие города страны; теперь у этих взглядов мало сторонников, и на карте показаны все кандидаты без выбора между ними. Кириаф-Хецрон в Негеве Иудином, от которого некоторые производят прозвище Иуды Искариота, — другое место. Моавитский Кериоф, где бы он ни стоял, лежит сегодня в провинции Мадаба в Иордании."
  uk:
    - "Керіот, «міста», був містом Моаву, названим у Біблії лише пророками. Амос провіщав, що Бог пошле вогонь на Моав, «й пожере будівлї Керіоту, й погибне Моаб серед розгрому й трубнього гуку». Пророцтво Єремії про Моав накликає суд «на Керіот і на Восор та й на всї городи Моабські, як далекі, так і близькі», а далі вигукує, що Керіот узято й твердині захоплено. Староєврейське слово можна прочитати й як загальну назву, і Куліш саме так і робить у цьому останньому місці: «Загорне міста, звоює твердинї». Палаци в Амоса й фортеці в Єремії позначають Керіот як одне з головних міст царства."
    - "Поза Біблією стела царя Меші, поставлена в IX ст. до н. е. й знайдена в Дібані 1868 р., розповідає, як він узяв Атарот у мужів Гада, вбив його мешканців і заселив його людьми з Шарону та з Махариту, і як він приволік захоплений предмет, жертовне вогнище його бога або вождя міста (читання спірне), «перед Хемошем у Керіоті». Отже, Керіот був осередком Хемоша, бога Моаву, а стела розміщує його поряд з Атаротом, на плоскогір’ї на північ від Арнону."
    - "Місце невідоме. Звичайний кандидат — ель-Керейят (Курайят), село між Дівоном і Атаротом, чия назва зберігає давню; пропонували й Хірбет-Алейян на сході. Старші вчені ототожнювали Керіот з Аром, давньою столицею Моаву, або з Кір-Харешетом (Керак), розуміючи поєднання Керіоту й Боцри в Єремії як позначення великих міст краю; ці погляди тепер мають мало прихильників, і мапа показує всіх кандидатів, не обираючи. Керіот-Хецрон у Негеві Юди, від якого дехто виводить ім’я Юди Іскаріота, — інше місце. Моавитський Керіот, де б він не стояв, лежить сьогодні в мухафазі Мадаба в Йорданії."
  es:
    - "Queriot, «ciudades», era una ciudad de Moab que la Biblia nombra solo por boca de los profetas. Amós anunció que Dios enviaría fuego sobre Moab, «y consumirá los palacios de Chêrioth: y morirá Moab en alboroto, en estrépito y sonido de trompeta». El oráculo de Jeremías sobre Moab trae el juicio «sobre Chêrioth, y sobre Bosra, y sobre todas las ciudades de tierra de Moab, las de lejos y las de cerca», y más adelante clama: «Tomadas son las ciudades, y tomadas son las fortalezas». La palabra hebrea Queriot puede leerse también como nombre común, y así lo hacen en ese último lugar tanto la Reina-Valera como la Biblia sinodal («las ciudades serán tomadas»). Los palacios de Amós y las fortalezas de Jeremías señalan a Queriot como una de las ciudades principales del reino."
    - "Fuera de la Biblia, la estela del rey Mesa, erigida en el siglo IX a. C. y hallada en Dhiban en 1868, cuenta cómo tomó Atarot a los hombres de Gad, mató a su gente y la repobló con hombres de Sarón y de Maharit, y cómo arrastró un objeto capturado, el hogar-altar de su dios o el jefe de la ciudad (la lectura se discute), «ante Quemós en Queriot». Queriot fue, pues, sede de Quemós, el dios de Moab, y la estela la sitúa al alcance de Atarot, en la meseta al norte del Arnón."
    - "No se conoce el emplazamiento. El candidato habitual es el-Qereiyat (Qurayyat), una aldea entre Dibón y Atarot cuyo nombre conserva el antiguo; también se ha propuesto Khirbet Aleiyan, al este. Estudiosos más antiguos identificaron Queriot con Ar, la antigua capital de Moab, o con Kir-hareset (Kerak), entendiendo que el emparejamiento de Queriot y Bosra en Jeremías designaba las grandes ciudades del país; estas opiniones tienen hoy pocos partidarios, y el mapa muestra todos los candidatos sin elegir. Queriot-hezrón, en el Néguev de Judá, de la que algunos derivan el nombre de Judas Iscariote, es un lugar distinto. La Queriot moabita, dondequiera que estuviera, se encuentra hoy en la gobernación de Madaba, en Jordania."
  pt:
    - "Queriote, “cidades”, era uma cidade de Moabe, citada na Bíblia apenas pelos profetas. Amós anunciou que Deus enviaria fogo sobre Moabe: “e ele devorará os palácios de Queriote; e Moabe morrerá com tumulto, com gritos de guerra e com o som da trombeta”. O oráculo de Jeremias sobre Moabe traz juízo “sobre Queriote, sobre Bozra, e sobre todas as cidades da terra de Moabe, distantes ou próximas”, e mais adiante clama: “Queriote foi tomada, e as fortalezas foram capturadas”. A palavra hebraica também pode ser lida como substantivo comum, e a Bíblia Sinodal assim a entende nesse último passo: “as cidades serão tomadas”. Os palácios de Amós e as fortalezas de Jeremias marcam Queriote como uma das principais cidades do reino."
    - "Fora da Bíblia, a estela do rei Mesa, erguida no século IX a.C. e encontrada em Dhiban em 1868, conta como ele tomou Atarote dos homens de Gade, matou o seu povo e a repovoou com homens de Sarom e de Maharit, e como arrastou um objeto capturado, a lareira-altar do seu deus ou o chefe da cidade (a leitura é debatida), “diante de Camos em Queriote”. Queriote era, portanto, um centro de Camos, o deus de Moabe, e a estela a situa ao alcance de Atarote, no planalto ao norte do Arnom."
    - "O sítio não é conhecido. O candidato habitual é el-Qereiyat (Qurayyat), uma aldeia entre Dibom e Atarote cujo nome conserva o antigo; Khirbet Aleiyan, a leste, também foi proposta. Estudiosos mais antigos identificaram Queriote com Ar, a antiga capital de Moabe, ou com Quir-Haresete (Kerak), entendendo que o par Queriote e Bozra, em Jeremias, designava as grandes cidades do país; essas opiniões hoje têm poucos adeptos, e o mapa mostra todos os candidatos sem escolher. Queriote-Hezrom, no Neguebe de Judá, de onde alguns derivam o nome de Judas Iscariotes, é outro lugar. A Queriote moabita, onde quer que ficasse, situa-se hoje na província de Madaba, na Jordânia."
  de:
    - "Kerijot, „Städte“, war eine Stadt Moabs, in der Bibel nur bei den Propheten genannt. Amos kündigte an, Gott werde ein Feuer „schicken nach Moab, das soll die Paläste zu Karioth verzehren; und Moab soll sterben im Getümmel und Geschrei und Posaunenhall“. Jeremias Spruch über Moab bringt das Gericht über „Karioth, Bozra und über alle Städte im Lande Moab, sie liegen fern oder nahe“ und ruft später: „Karioth ist gewonnen, und die festen Städte sind eingenommen“. Das hebräische Wort kann auch als Gattungsname gelesen werden, und die Synodalbibel tut das an der letzten Stelle und liest dort „Städte“ statt des Ortsnamens. Die Paläste bei Amos und die Festungen bei Jeremia zeigen Kerijot als eine der Hauptstädte des Königreichs."
    - "Außerhalb der Bibel erzählt die Stele des Königs Mesa, im 9. Jahrhundert v. Chr. errichtet und 1868 in Dhiban gefunden, wie er Atarot den Männern von Gad abnahm, sein Volk tötete und es mit Männern aus Scharon und Maharit neu besiedelte, und wie er einen erbeuteten Gegenstand, den Altarherd seines Gottes oder des Stadtobersten (die Lesung ist umstritten), „vor Kemosch in Kerijot“ schleifte. Kerijot war damit ein Sitz Kemoschs, des Gottes Moabs, und die Stele rückt es in die Nähe von Atarot, auf die Hochebene nördlich des Arnon."
    - "Die Lage ist unbekannt. Der übliche Kandidat ist el-Qereiyat (Qurayyat), ein Dorf zwischen Dibon und Atarot, dessen Name den alten bewahrt; auch Khirbet Aleiyan im Osten wurde vorgeschlagen. Ältere Forscher setzten Kerijot mit Ar, der alten Hauptstadt Moabs, oder mit Kir-Heres (Kerak) gleich und verstanden Jeremias Paarung von Kerijot und Bozra als die großen Städte des Landes; diese Ansichten haben heute wenige Anhänger, und die Karte zeigt alle Kandidaten, ohne zu wählen. Kerijot-Hezron im Negev Judas, von dem manche den Namen des Judas Iskariot herleiten, ist ein anderer Ort. Das moabitische Kerijot liegt, wo immer es stand, heute im Gouvernement Madaba in Jordanien."
  fr:
    - "Kerijoth, « villes », était une ville de Moab, nommée dans la Bible seulement par les prophètes. Amos annonça que Dieu enverrait le feu sur Moab, « et il dévorera les palais de Kerijoth ; et Moab périra au milieu du tumulte, au milieu des cris de guerre et du bruit de la trompette ». L’oracle de Jérémie sur Moab appelle le jugement « sur Kerijoth, sur Botsra, sur toutes les villes du pays de Moab, éloignées et proches », puis s’écrie : « Kerijoth est prise, les forteresses sont emportées. » Le mot hébreu peut aussi se lire comme un nom commun, et la Bible synodale le fait à ce dernier endroit, où elle lit que les villes seront prises. Les palais d’Amos et les forteresses de Jérémie désignent Kerijoth comme l’une des principales villes du royaume."
    - "En dehors de la Bible, la stèle du roi Mescha, dressée au IXe siècle av. J.-C. et trouvée à Dhiban en 1868, raconte comment il prit Atharoth aux hommes de Gad, tua sa population et la repeupla d’hommes de Saron et de Maharith, et comment il traîna un objet capturé, le foyer-autel de son dieu ou le chef de la ville (la lecture est débattue), « devant Kemosch à Kerijoth ». Kerijoth était donc un siège de Kemosch, dieu de Moab, et la stèle la place à portée d’Atharoth, sur le plateau au nord de l’Arnon."
    - "Le site est inconnu. Le candidat habituel est el-Qereiyat (Qurayyat), village situé entre Dibon et Atharoth, dont le nom garde l’ancien ; Khirbet Aleiyan, à l’est, a aussi été proposé. D’anciens savants identifiaient Kerijoth avec Ar, l’ancienne capitale de Moab, ou avec Kir-Haréseth (Kérak), comprenant l’association de Kerijoth et de Botsra chez Jérémie comme désignant les grandes villes du pays ; ces vues ont aujourd’hui peu de partisans, et la carte montre tous les candidats sans choisir. Kerijoth-Hetsron, dans le Négev de Juda, d’où certains tirent le nom de Judas Iscariote, est un lieu différent. Le Kerijoth moabite, où qu’il se soit trouvé, se situe aujourd’hui dans le gouvernorat de Madaba, en Jordanie."
