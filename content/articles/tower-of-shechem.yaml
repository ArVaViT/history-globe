body:
  en:
    - "The Tower of Shechem, Migdal-Shechem, appears only in the story of Abimelech. Whether it was the walled citadel of Shechem itself, with the temple on it, or a separate stronghold near the city is debated: Abimelech razes Shechem and sows it with salt, and only then “all the men of the tower of Shechem” gather in the hold of the temple of El-berith, which suggests to some a second place, while others take the tower for the acropolis that held out after the lower town fell. Shechem is Tell Balata on the east edge of Nablus."
    - "“And when all the men of the tower of Shechem heard that, they entered into an hold of the house of the god Berith.” Abimelech went up Mount Zalmon with his men, cut a bough, laid it on his shoulder and told them to do as he had done; “and all the people likewise cut down every man his bough, and followed Abimelech, and put them to the hold, and set the hold on fire upon them; so that all the men of the tower of Shechem died also, about a thousand men and women”. So the curse of Jotham was fulfilled, that fire should come out from Abimelech and devour the men of Shechem and the house of Millo; Abimelech himself died at Thebez, when a woman dropped a millstone on his head from another tower."
    - "Excavations at Tell Balata by Ernst Sellin between 1913 and 1927 and by the Drew-McCormick expedition, led first by G. Ernest Wright, in 1956–1973 uncovered on the city's acropolis a fortress temple with walls over five metres thick, built about 1650 BC and standing, with rebuildings, into the twelfth century BC, when the city was destroyed. Wright identified it with the temple of Baal-berith, the lord of the covenant, and Lawrence Stager has argued that the fortress temple itself was the Tower of Shechem of Judges 9. The temple's foundations and the great standing stone in its forecourt can be seen today in the archaeological park of Tell Balata in Nablus."
  ru:
    - "Башня Сихемская, по-еврейски Мигдал-Шехем, встречается только в истории Авимелеха. Была ли это обнесённая стеной цитадель самого Сихема с храмом на ней или отдельное укрепление близ города — спорно: Авимелех разрушает Сихем и засевает его солью, и лишь потом «все бывшие в башне Сихемской» собираются в твердыне капища Ваал-Верифа, что одним указывает на второе место, а другие видят в башне акрополь, который держался после падения нижнего города. Сихем — это Телль-Балата на восточной окраине Наблуса."
    - "«Услышав об этом, все бывшие в башне Сихемской ушли в башню капища Ваал-Верифа». Авимелех поднялся на гору Селмон со своими людьми, нарубил сучьев, положил их на плечи и велел делать то же; «и нарубил каждый из всего народа сучьев, и пошли за Авимелехом, и положили к башне, и сожгли посредством их башню огнем, и умерли все бывшие в башне Сихемской, около тысячи мужчин и женщин». Так сбылось проклятие Иофама — что от Авимелеха выйдет огонь и пожжёт жителей Сихема и дом Милло; сам Авимелех погиб в Тевеце, когда женщина сбросила ему на голову обломок жернова с другой башни."
    - "Раскопки Телль-Балаты, которые вели Эрнст Зеллин в 1913–1927 годах и экспедиция Дрю-Маккормик, которую сначала возглавлял Джордж Эрнест Райт, в 1956–1973 годах, открыли на акрополе города храм-крепость со стенами толщиной более пяти метров, построенный около 1650 г. до н. э. и стоявший, с перестройками, до XII века до н. э., когда город был разрушен. Райт отождествил его с храмом Ваал-Верифа, владыки завета, а Лоуренс Стейджер доказывал, что сам храм-крепость и был Башней Сихемской из 9-й главы Судей. Основания храма и большой стоячий камень перед ним можно видеть сегодня в археологическом парке Телль-Балата в Наблусе."
  uk:
    - "Сихемська вежа, Мігдал-Сихем, з’являється лише в розповіді про Авімелеха. Чи була вона муруваною цитаделлю самого Сихема з храмом на ній, чи окремою фортецею поблизу міста, дискутується: Авімелех руйнує Сихем і засіває його сіллю, і лише тоді «осадники замку Сихемського» збираються в храмовій твердині Ель-Беріта, що деяких наштовхує на думку про друге місце, тоді як інші вважають вежу акрополем, що встояв після падіння нижнього міста. Сихем — це Телль-Балата на східному краю Наблуса."
    - "«Як же почули про се осадники замку Сихемського, кинулись вони в храмову твердиню Баалверита». Авімелех піднявся на гору Селмон зі своїми людьми, зрубав гілку, поклав її на плече і звелів їм чинити так, як він: «Тодї й усї військові, чоловік за чоловіком, нарубали галузя й пійшли за Абимелехом, накидали його кругом вежі та й спалили вежу вогнем, так що всї замчане Сихемські погинули, до тисячи душ чоловіків і жіноцтва». Так здійснилося прокляття Йотама, що вогонь вийде від Авімелеха й пожере мужів Сихема та дім Мілло; сам Авімелех загинув у Тевеці, коли жінка скинула жорно йому на голову з іншої вежі."
    - "Розкопки в Телль-Балаті Ернста Селліна між 1913 і 1927 роками та експедиції Дрю–Мак-Кормік, яку спершу очолював Дж. Ернест Райт, у 1956–1973 роках відкрили на акрополі міста храм-фортецю зі стінами завтовшки понад п’ять метрів, збудований близько 1650 р. до н. е. і з перебудовами проіснував до XII ст. до н. е., коли місто було зруйноване. Райт ототожнив його з храмом Ваал-Беріта, господаря заповіту, а Лоуренс Стейджер доводив, що сам храм-фортеця і був Сихемською вежею з Книги Суддів 9. Фундаменти храму й велике стояче каміння на його переддвір’ї можна побачити нині в археологічному парку Телль-Балата в Наблусі."
  es:
    - "La Torre de Siquem, Migdal-Siquem, aparece solo en la historia de Abimelec. Se discute si era la ciudadela amurallada de la propia Siquem, con el templo en ella, o una fortaleza separada cerca de la ciudad: Abimelec arrasa Siquem y la siembra de sal, y solo entonces «todos los de la torre de Sichêm» se reúnen en la fortaleza del templo de El-berit, lo que sugiere a algunos un segundo lugar, mientras otros toman la torre por la acrópolis que resistió tras caer la ciudad baja. Siquem es Tell Balata, en el borde oriental de Nablus."
    - "«Como oyeron esto todos los que estaban en la torre de Sichêm, entráronse en la fortaleza del templo del dios Berith». Abimelec subió al monte Salmón con sus hombres, cortó una rama, se la puso al hombro y les dijo que hicieran lo mismo que él; «Y así todo el pueblo cortó también cada uno su rama, y siguieron á Abimelech, y pusiéronlas junto á la fortaleza, y prendieron fuego con ellas á la fortaleza: por manera que todos los de la torre de Sichêm murieron, como unos mil hombres y mujeres». Así se cumplió la maldición de Jotam, de que saldría fuego de Abimelec y devoraría a los hombres de Siquem y a la casa de Milo; el propio Abimelec murió en Tebes, cuando una mujer le dejó caer una rueda de molino en la cabeza desde otra torre."
    - "Las excavaciones en Tell Balata de Ernst Sellin entre 1913 y 1927 y de la expedición Drew-McCormick, dirigida primero por G. Ernest Wright, en 1956–1973, sacaron a la luz en la acrópolis de la ciudad un templo fortaleza de muros de más de cinco metros de grosor, construido hacia 1650 a. C. y en pie, con reconstrucciones, hasta el siglo XII a. C., cuando la ciudad fue destruida. Wright lo identificó con el templo de Baal-berit, el señor del pacto, y Lawrence Stager ha sostenido que el propio templo fortaleza era la Torre de Siquem de Jueces 9. Los cimientos del templo y la gran piedra erguida de su antepatio pueden verse hoy en el parque arqueológico de Tell Balata, en Nablus."
  pt:
    - "A Torre de Siquém, Migdal-Siquém, aparece apenas na história de Abimeleque. Se era a cidadela murada da própria Siquém, com o templo, ou uma fortaleza separada perto da cidade, é discutido: Abimeleque arrasa Siquém e a semeia de sal, e só então “todos os líderes da torre de Siquém” se reúnem na fortaleza do templo de El-Berite, o que sugere a alguns um segundo lugar, enquanto outros tomam a torre pela acrópole que resistiu depois da queda da cidade baixa. Siquém é Tell Balata, na orla leste de Nablus."
    - "“Quando todos os líderes da torre de Siquém ouviram isso, entraram na fortaleza do templo de El-Berite.” Abimeleque subiu ao monte Zalmom com seus homens, cortou um galho, pôs no ombro e mandou que fizessem como ele fizera; “Todos os homens, da mesma forma, cortaram cada um o seu galho, seguiram Abimeleque, os colocaram na base da fortaleza, e incendiaram a fortaleza sobre eles, de modo que todas as pessoas da torre de Siquém também morreram, cerca de mil homens e mulheres”. Cumpriu-se assim a maldição de Jotão, de que saísse fogo de Abimeleque e devorasse os homens de Siquém e a casa de Milo; o próprio Abimeleque morreu em Tebez, quando uma mulher lhe jogou uma pedra de moinho na cabeça, de outra torre."
    - "Escavações em Tell Balata por Ernst Sellin entre 1913 e 1927 e pela expedição Drew-McCormick, dirigida primeiro por G. Ernest Wright, em 1956–1973, revelaram na acrópole da cidade um templo-fortaleza de muros com mais de cinco metros de espessura, construído por volta de 1650 a.C. e de pé, com reconstruções, até o século XII a.C., quando a cidade foi destruída. Wright o identificou com o templo de Baal-Berite, o senhor da aliança, e Lawrence Stager defendeu que o próprio templo-fortaleza era a Torre de Siquém de Juízes 9. Os alicerces do templo e a grande pedra em pé de seu pátio podem ser vistos hoje no parque arqueológico de Tell Balata, em Nablus."
  de:
    - "Der Turm von Sichem, Migdal-Sichem, erscheint nur in der Geschichte Abimelechs. Ob er die ummauerte Zitadelle Sichems selbst mit dem Tempel darauf war oder eine eigene Festung nahe der Stadt, ist umstritten: Abimelech zerstört Sichem und sät Salz darauf, und erst dann versammeln sich „alle Männer des Turms zu Sichem“ in der Festung des Tempels des El-Berit, was manchen einen zweiten Ort nahelegt, während andere den Turm für die Akropolis halten, die nach dem Fall der Unterstadt standhielt. Sichem ist Tell Balata am Ostrand von Nablus."
    - "„Da das hörten alle Männer des Turms zu Sichem, gingen sie in die Festung des Hauses des Gottes Berith.“ Abimelech stieg mit seinen Leuten auf den Zalmon, hieb einen Ast ab, legte ihn auf die Schulter und hieß sie tun wie er; „da hieb alles Volk ein jeglicher einen Ast ab und folgten Abimelech nach und legten sie an die Festung und steckten's an mit Feuer, daß auch alle Männer des Turms zu Sichem starben, bei tausend Mann und Weib“. So erfüllte sich der Fluch Jotams, dass Feuer von Abimelech ausgehen und die Männer von Sichem und das Haus Millo verzehren solle; Abimelech selbst starb in Tebez, als eine Frau ihm von einem anderen Turm einen Mühlstein auf den Kopf warf."
    - "Grabungen in Tell Balata durch Ernst Sellin 1913–1927 und durch die Drew-McCormick-Expedition, zuerst unter G. Ernest Wright, 1956–1973 legten auf der Akropolis der Stadt einen Festungstempel mit über fünf Meter dicken Mauern frei, um 1650 v. Chr. erbaut und mit Umbauten bis ins zwölfte Jahrhundert v. Chr. bestehend, als die Stadt zerstört wurde. Wright setzte ihn mit dem Tempel des Baal-Berit, des Herrn des Bundes, gleich, und Lawrence Stager hat vertreten, der Festungstempel selbst sei der Turm von Sichem aus Richter 9 gewesen. Die Fundamente des Tempels und der große Standstein in seinem Vorhof sind heute im archäologischen Park von Tell Balata in Nablus zu sehen."
  fr:
    - "La Tour de Sichem, Migdal-Sichem, n’apparaît que dans l’histoire d’Abimélec. On débat si elle était la citadelle fortifiée de Sichem même, avec le temple, ou une place forte distincte près de la ville : Abimélec rase Sichem et y sème du sel, et c’est seulement alors que « tous les habitants de la tour de Sichem » se rassemblent dans la forteresse du temple d’El-Berith, ce qui fait penser à certains à un second lieu, tandis que d’autres y voient l’acropole qui tint bon après la chute de la ville basse. Sichem est Tell Balata, au bord est de Naplouse."
    - "« À cette nouvelle, tous les habitants de la tour de Sichem se rendirent dans la forteresse de la maison du dieu Berith. » Abimélec monta sur la montagne de Tsalmon avec ses hommes, coupa une branche, la mit sur son épaule et leur dit de faire comme lui : « Et ils coupèrent chacun une branche, et suivirent Abimélec ; ils placèrent les branches contre la forteresse, et l’incendièrent avec ceux qui y étaient. Ainsi périrent tous les gens de la tour de Sichem, au nombre d’environ mille, hommes et femmes. » Ainsi s’accomplit la malédiction de Jotham : que le feu sortît d’Abimélec et dévorât les hommes de Sichem et la maison de Millo ; Abimélec mourut lui-même à Thébets, lorsqu’une femme lui lança une meule sur la tête du haut d’une autre tour."
    - "Les fouilles de Tell Balata par Ernst Sellin entre 1913 et 1927, puis par l’expédition Drew-McCormick, menée d’abord par G. Ernest Wright, en 1956-1973, ont dégagé sur l’acropole de la ville un temple-forteresse aux murs de plus de cinq mètres d’épaisseur, bâti vers 1650 av. J.-C. et subsistant, avec des remaniements, jusqu’au XIIe siècle av. J.-C., quand la ville fut détruite. Wright l’identifia au temple de Baal-Berith, le seigneur de l’alliance, et Lawrence Stager a soutenu que le temple-forteresse lui-même était la Tour de Sichem de Juges 9. Les fondations du temple et la grande pierre dressée de son avant-cour se voient aujourd’hui dans le parc archéologique de Tell Balata, à Naplouse."
  pl:
    - "Wieża Sychem, Migdal-Sychem, pojawia się tylko w opowieści o Abimeleku. Czy była obwarowaną cytadelą samego Sychem ze świątynią na niej, czy osobną twierdzą w pobliżu miasta, jest sporne: Abimelek burzy Sychem i obsiewa je solą, a dopiero potem „wszyscy mężowie wieży Sychem” gromadzą się w twierdzy świątyni El-Berit, co niektórym sugeruje drugie miejsce, podczas gdy inni biorą wieżę za akropol, który trwał po upadku dolnego miasta. Sychem to Tell Balata na wschodnim skraju Nablusu."
    - "„A usłyszawszy wszyscy mężowie, którzy byli na wieży Sychem, przyszli do twierdzy domu boga Beryt.” Abimelek wszedł z ludźmi na Górę Salmon, ściął gałąź, położył ją na ramię i kazał im czynić jak on; „A tak uciąwszy z onego wszystkiego ludu każdy gałąź swoję, szli za Abimelechem, a kładli je około twierdzy i spalili niemi twierdzą ogniem, i poginęło tam wszystkich mężów wieży Sychemskiej około tysiąca mężów i niewiast”. Tak spełniła się klątwa Jotama, że ogień wyjdzie od Abimeleka i pożre mężów Sychem i dom Millo; sam Abimelek zginął w Tebes, gdy kobieta zrzuciła mu kamień młyński na głowę z innej wieży."
    - "Wykopaliska w Tell Balata, prowadzone przez Ernsta Sellina w latach 1913–1927 oraz przez wyprawę Drew-McCormick, kierowaną najpierw przez G. Ernesta Wrighta, w latach 1956–1973, odsłoniły na akropolu miasta świątynię-twierdzę z murami grubymi na ponad pięć metrów, zbudowaną około 1650 roku p.n.e. i stojącą, z przebudowami, aż do XII wieku p.n.e., gdy miasto zniszczono. Wright utożsamił ją ze świątynią Baal-Berit, pana przymierza, a Lawrence Stager dowodził, że sama świątynia-twierdza była Wieżą Sychem z Sdz 9. Fundamenty świątyni i wielki stojący kamień na jej przedpolu można dziś zobaczyć w parku archeologicznym Tell Balata w Nablusie."
  it:
    - "La Torre di Sichem, Migdal-Sichem, compare solo nella storia di Abimelech. Se fosse la cittadella fortificata di Sichem stessa, con il tempio, o una fortezza distinta presso la città è discusso: Abimelech rade al suolo Sichem e vi semina del sale, e solo allora «tutti gli abitanti della torre di Sichem» si radunano nel torrione del tempio di El-Berith, il che suggerisce ad alcuni un secondo luogo, mentre altri prendono la torre per l’acropoli che resistette dopo la caduta della città bassa. Sichem è Tell Balata, al margine orientale di Nablus."
    - "«Tutti gli abitanti della torre di Sichem, all’udir questo, si ritirarono nel torrione del tempio di El-Berith.» Abimelech salì sul monte Salmon con i suoi, tagliò un ramo, se lo mise sulla spalla e disse loro di fare come aveva fatto lui; «tutti tagliaron quindi anch’essi de’ rami, ognuno il suo, e seguitarono Abimelec; posero i rami contro al torrione, e arsero il torrione con quelli che v’eran dentro. Così perì tutta la gente della torre di Sichem, circa mille persone, fra uomini e donne». Così si adempì la maledizione di Iotam, che dal fuoco uscito da Abimelech fossero divorati gli uomini di Sichem e la casa di Millo; Abimelech stesso morì a Tebes, quando una donna gli lasciò cadere una macina sulla testa da un’altra torre."
    - "Gli scavi a Tell Balata di Ernst Sellin fra il 1913 e il 1927 e della spedizione Drew-McCormick, guidata dapprima da G. Ernest Wright, nel 1956–1973 portarono alla luce sull’acropoli della città un tempio-fortezza con mura spesse oltre cinque metri, costruito verso il 1650 a.C. e in piedi, con rifacimenti, fino al XII secolo a.C., quando la città fu distrutta. Wright lo identificò con il tempio di Baal-Berit, il signore dell’alleanza, e Lawrence Stager ha sostenuto che il tempio-fortezza stesso fosse la Torre di Sichem di Giudici 9. Le fondamenta del tempio e la grande pietra eretta nel suo cortile antistante si possono vedere oggi nel parco archeologico di Tell Balata a Nablus."
  nl:
    - "De Toren van Sichem, Migdal-Sichem, komt alleen voor in het verhaal van Abimelech. Of het de ommuurde citadel van Sichem zelf was, met de tempel erop, of een afzonderlijke sterkte bij de stad, wordt betwist: Abimelech verwoest Sichem en bezaait het met zout, en pas daarna verzamelen “alle burgers des torens van Sichem” zich in de sterkte van de tempel van El-Berit, wat sommigen op een tweede plaats doet denken, terwijl anderen de toren nemen voor de burcht die standhield nadat de benedenstad was gevallen. Sichem is Tell Balata aan de oostrand van Nablus."
    - "“Als alle burgers des torens van Sichem dat hoorden, zo gingen zij in de sterkte, in het huis van den god Berith.” Abimelech ging met zijn mannen de berg Salmon op, hieuw een tak af, legde hem op zijn schouder en zei hun te doen zoals hij had gedaan; “zo hieuw ook al het volk een iegelijk zijn tak af, en zij volgden Abimelech na, en leiden ze aan de sterkte, en verbrandden daardoor de sterkte met vuur; dat ook alle lieden des torens van Sichem stierven, omtrent duizend mannen en vrouwen”. Zo werd de vloek van Jotam vervuld, dat er vuur uit Abimelech zou uitgaan en de burgers van Sichem en het huis van Millo zou verteren; Abimelech zelf stierf bij Tebez, toen een vrouw vanaf een andere toren een molensteen op zijn hoofd liet vallen."
    - "Opgravingen op Tell Balata door Ernst Sellin tussen 1913 en 1927 en door de Drew-McCormick-expeditie, eerst onder leiding van G. Ernest Wright, in 1956–1973 legden op de burcht van de stad een burchttempel bloot met muren van meer dan vijf meter dik, omstreeks 1650 v.Chr. gebouwd en, met verbouwingen, bestaand tot in de twaalfde eeuw v.Chr., toen de stad werd verwoest. Wright vereenzelvigde hem met de tempel van Baäl-Berit, de heer van het verbond, en Lawrence Stager heeft betoogd dat de burchttempel zelf de Toren van Sichem van Richteren 9 was. De fundamenten van de tempel en de grote staande steen op het voorplein zijn tegenwoordig te zien in het archeologisch park van Tell Balata in Nablus."
  cs:
    - "Šekemská věž, Migdal-Šekem, se objevuje jen v příběhu o Abimelekovi. Zda to byla opevněná citadela samotného Šekemu s chrámem na ní, nebo samostatná pevnost poblíž města, je sporné: Abimelek Šekem srovná se zemí a poseje jej solí a teprve pak se „všickni muži věže Sichemské“ shromáždí v pevnosti chrámu El-berít, což některým napovídá druhé místo, zatímco jiní pokládají věž za akropoli, která vzdorovala po pádu dolního města. Šekem je Tell Balata na východním okraji Nábulusu."
    - "„Uslyševše pak všickni muži věže Sichemské, vešli do hradu svého, chrámu boha Berit.“ Abimelek vystoupil s muži na horu Calmón, uťal ratolest, položil si ji na rameno a řekl jim, ať učiní, jak učinil on; „i uťal sobě jeden každý ze všeho lidu ratolest, a jdouce za Abimelechem, skladli je u hradu, a zapálili jimi hrad. I zemřeli tam všickni muži věže Sichemské téměř tisíc mužů a žen“. Tak se naplnilo Jotamovo proklení, že vyjde oheň od Abimeleka a pozře muže šekemské a dům Milo; sám Abimelek zemřel v Tebecu, když mu žena shodila žernov na hlavu z jiné věže."
    - "Vykopávky na Tell Balata, které vedli Ernst Sellin v letech 1913–1927 a expedice Drew-McCormick, nejprve pod vedením G. Ernesta Wrighta, v letech 1956–1973, odkryly na akropoli města pevnostní chrám se zdmi přes pět metrů tlustými, postavený kolem roku 1650 př. n. l. a stojící, s přestavbami, do 12. stol. př. n. l., kdy bylo město zničeno. Wright jej ztotožnil s chrámem Baal-beríta, pána smlouvy, a Lawrence Stager tvrdil, že pevnostní chrám sám byl Šekemskou věží ze Soudců 9. Základy chrámu a velký stojící kámen v jeho předním nádvoří lze dnes vidět v archeologickém parku Tell Balata v Nábulusu."
  sv:
    - "Shekems torn, Migdal-Shekem, förekommer bara i berättelsen om Avimelek. Om det var själva Shekems befästa citadell, med templet på, eller en särskild fästning nära staden är omdebatterat: Avimelek jämnar Shekem med marken och sår salt på den, och först därefter samlas ”besättningen i Sikems torn” i templets fasta valv åt El-Berit, vilket för några tyder på en andra plats, medan andra tar tornet för den akropolis som höll stånd sedan nedre staden fallit. Shekem är Tell Balata vid Nablus östra kant."
    - "”När besättningen i Sikems torn hörde detta, begåvo de sig alla till det fasta valvet i El-Berits tempelbyggnad.” Avimelek gick upp på berget Salmon med sitt folk, högg av en gren, lade den på axeln och sade åt dem att göra som han hade gjort; ”Då högg också allt folket av var sin gren och följde efter Abimelek, och de lade grenarna intill det fasta valvet och tände upp eld till att förbränna valvet jämte dem som voro där. Så omkommo ock alla de människor som bodde i Sikems torn, vid pass tusen män och kvinnor”. Så uppfylldes Jotams förbannelse att eld skulle gå ut från Avimelek och förtära Shekems män och Millos hus; Avimelek själv dog i Tebes, när en kvinna släppte en kvarnsten på hans huvud från ett annat torn."
    - "Utgrävningar vid Tell Balata av Ernst Sellin 1913–1927 och av Drew-McCormick-expeditionen, först under G. Ernest Wright, 1956–1973 frilade på stadens akropolis ett fästningstempel med väggar över fem meter tjocka, byggt omkring 1650 f.Kr. och stående, med ombyggnader, in på 1100-talet f.Kr., då staden förstördes. Wright identifierade det med templet åt Baal-Berit, förbundets herre, och Lawrence Stager har hävdat att själva fästningstemplet var Shekems torn i Dom 9. Templets grunder och den stora stående stenen på dess förgård kan i dag ses i arkeologiparken Tell Balata i Nablus."
  nb:
    - "Migdal-Sikem, tårnet i Sikem, forekommer bare i fortellingen om Abimelek. Om det var den ummurte borgen i selve Sikem, med tempelet på, eller en egen festning nær byen, er omdiskutert: Abimelek jevner Sikem med jorden og strør salt på den, og først da samler «alle mennene i Sikems borg» seg i festningen til El-Berit-tempelet, noe som får noen til å tenke på et annet sted, mens andre tar tårnet for akropolis som holdt stand etter at nedre by falt. Sikem er Tell Balata i østkanten av Nablus."
    - "«Da mennene i Sikems borg hørte det, gikk de alle inn i tårnet som hørte til El-Berits tempel.» Abimelek gikk opp på Salmon-fjellet med mennene sine, hugg en gren, la den på skulderen og sa til dem at de skulle gjøre som han: «Da hugg alle folkene også hver sin bør med grener og gikk efter Abimelek; så la de grenene opefter tårnet og satte med dem ild på tårnet. Således omkom alle innbyggerne i Sikems borg, omkring tusen, menn og kvinner.» Slik ble Jotams forbannelse oppfylt, at ild skulle gå ut fra Abimelek og fortære mennene i Sikem og Millos hus; Abimelek døde selv i Tebes, da en kvinne lot en kvernsten falle på hodet hans fra et annet tårn."
    - "Utgravninger ved Tell Balata av Ernst Sellin mellom 1913 og 1927 og av Drew-McCormick-ekspedisjonen, først ledet av G. Ernest Wright, i 1956–1973 avdekket på byens akropolis et festningstempel med murer over fem meter tykke, bygd omkring 1650 f.Kr. og stående, med ombygginger, inn i 1100-tallet f.Kr., da byen ble ødelagt. Wright identifiserte det med tempelet for Baal-Berit, paktens herre, og Lawrence Stager har hevdet at selve festningstempelet var Sikem-tårnet i Dommerne 9. Tempelets fundamenter og den store reiste steinen i forgården kan ses i dag i den arkeologiske parken ved Tell Balata i Nablus."
  tl:
    - "Ang Moog ng Sichem, Migdal-Sichem, ay lumilitaw lamang sa kuwento ni Abimelech. Pinagtatalunan kung ito ang kutang may pader ng Sichem mismo, na may templo, o hiwalay na tanggulan malapit sa lunsod: giniba ni Abimelech ang Sichem at sinabuyan ng asin, at saka lamang nagtipon “lahat ng mga lalake sa moog ng Sichem” sa kuta ng templo ng El-berith, na para sa ilan ay tumutukoy sa ikalawang lugar, samantalang itinuturing ng iba ang moog na acropolis na nanatili nang bumagsak ang ibabang bayan. Ang Sichem ay ang Tell Balata sa silangang gilid ng Nablus."
    - "“At nang mabalitaan yaon ng lahat ng mga lalake sa moog ng Sichem, ay pumasok sila sa kuta ng bahay ng El-berith.” Umakyat si Abimelech sa Bundok Salmon kasama ng kaniyang mga tauhan, pumutol ng sanga, ipinasan ito at inutusan silang gayahin siya; “At ang buong bayan ay pumutol na gayon din ang bawa't lalake ng kanikaniyang sanga, at sumunod kay Abimelech, at ipinaglalagay sa kuta, at sinilaban ang kuta sa pamamagitan niyaon; na ano pa't ang lahat ng mga lalake sa moog ng Sichem ay namatay rin, na may isang libong lalake at babae”. Gayon natupad ang sumpa ni Jotham na lalabas ang apoy mula kay Abimelech at lalamon sa mga taga-Sichem at sa bahay ng Millo; si Abimelech mismo ay namatay sa Thebes, nang maghulog ang isang babae ng gilingang bato sa ulo niya mula sa ibang moog."
    - "Ang mga paghuhukay sa Tell Balata ni Ernst Sellin noong 1913–1927 at ng ekspedisyong Drew-McCormick, na unang pinamunuan ni G. Ernest Wright, noong 1956–1973 ay naglantad sa acropolis ng lunsod ng templong kuta na may pader na higit limang metro ang kapal, itinayo noong mga 1650 BK at nakatayo, na may mga pagtatayong muli, hanggang ika-12 siglo BK, nang wasakin ang lunsod. Kinilala ito ni Wright na templo ng Baal-berith, ang panginoon ng tipan, at iginiit ni Lawrence Stager na ang templong kuta mismo ang Moog ng Sichem sa Mga Hukom 9. Makikita ngayon ang mga pundasyon ng templo at ang dakilang batong nakatayo sa harapang bulwagan nito sa liwasang arkeolohiko ng Tell Balata sa Nablus."
  da:
    - "Sikems Tårn, Migdal-Sikem, optræder kun i historien om Abimelek. Om det var selve Sikems befæstede borg, med templet på sig, eller en særskilt fæstning nær byen, er omdiskuteret: Abimelek jævner Sikem med jorden og tilsår den med salt, og først da samles »alle Mændene i Taarnet i Sikem« i borgen ved El-Berits tempel, hvilket for nogle antyder et andet sted, mens andre tager tårnet for den akropolis, der holdt stand, efter at underbyen faldt. Sikem er Tell Balata ved Nablus' østkant."
    - "»Der alle Mændene i Taarnet i Sikem hørte det, da gik de ind i Beriths Gudshuses Taarn.« Abimelek gik op på Zalmon-bjerget med sine mænd, huggede en gren af, lagde den på sin skulder og bad dem gøre som han; »Da huggede ogsaa alt Folket hver sin Gren af, og de gik efter Abimelek og lagde dem op til Taarnet og satte med dem Ild paa Taarnet, saa at ogsaa alle Mænd paa Taarnet i Sikem døde, ved Tusinde Mænd og Kvinder«. Således blev Jotams forbandelse opfyldt, at ild skulle gå ud fra Abimelek og fortære Sikems mænd og Millos hus; Abimelek selv døde ved Tebes, da en kvinde lod en møllesten falde ned på hans hoved fra et andet tårn."
    - "Udgravninger ved Tell Balata af Ernst Sellin mellem 1913 og 1927 og af Drew-McCormick-ekspeditionen, ledet først af G. Ernest Wright, i 1956–1973 blottede på byens akropolis et fæstningstempel med mure over fem meter tykke, bygget omkring 1650 f.Kr. og stående, med ombygninger, ind i 1100-tallet f.Kr., da byen blev ødelagt. Wright identificerede det med templet for Ba'al-Berit, pagtens herre, og Lawrence Stager har argumenteret for, at selve fæstningstemplet var Sikems Tårn i Dommerbogen 9. Templets fundamenter og den store rejste sten på dets forgård kan i dag ses i den arkæologiske park Tell Balata i Nablus."
  sr:
    - "Кула Сихемска, Мигдал-Сихем, јавља се само у причи о Авимелеху. Да ли је то била утврђена цитадела самог Сихема, са храмом на њој, или посебна тврђава близу града, спорно је: Авимелех сравњује Сихем са земљом и посипа га сољу, а тек тада се они „који беху у кули сихемској“ скупљају у кули храма Ел-Верита, што неке наводи на друго место, док други кулу узимају за акропољ који се држао пошто је доњи град пао. Сихем је Тел Балата на источном ободу Наблуса."
    - "„А кад то чуше који беху у кули сихемској, уђоше у кулу куће бога Верита.“ Авимелех се попео на гору Селмон са својим људима, одсекао грану, метнуо је на раме и рекао им да чине као он; „и сваки из народа одсече себи грану, и пођоше за Авимелехом и пометаше гране око куле, и запалише њима град; и изгибоше сви који беху у кули сихемској, око хиљаду људи и жена“. Тако се испунило Јотамово проклетство да ће огањ изаћи из Авимелеха и прождрети Сихемце и дом Мило; сам Авимелех погинуо је у Тевесу, када му је жена с друге куле бацила жрвањ на главу."
    - "Ископавања на Тел Балати Ернста Зелина између 1913. и 1927. и експедиције Дру-Макормик, коју је најпре водио Џ. Ернест Рајт, 1956–1973. открила су на акропољу града тврђавски храм са зидовима дебелим преко пет метара, подигнут око 1650. п. н. е., који је, уз обнове, стајао до 12. века п. н. е., када је град разорен. Рајт га је поистоветио с храмом Вал-Верита, господара савеза, а Лоренс Стејџер је тврдио да је сам тврђавски храм Кула Сихемска из Књиге о судијама 9. Темељи храма и велики стојећи камен у његовом предворју данас се могу видети у археолошком парку Тел Балата у Наблусу."
  hu:
    - "Sikem tornya, Migdal-Sikem, csak Abimélek történetében szerepel. Hogy maga Sikem fallal körülvett fellegvára volt-e a templommal, vagy a városhoz közeli külön erődítmény, vitatott: Abimélek lerombolja Sikemet és sóval hinti be, és csak azután gyűlnek össze „Sikem tornyának minden férfiai” az El-Berit templomának várában, ami egyesek szerint második helyre utal, míg mások a tornyot az akropolisznak tartják, amely az alsó város elestével is kitartott. Sikem a Tell Balátá Nábulusz keleti szélén."
    - "„Mikor pedig ezt meghallották Sikem tornyának minden férfiai, az El-Berith isten házának várába mentek.” Abimélek felment a Calmón-hegyre embereivel, ágat vágott, vállára vette, és megparancsolta nekik, hogy tegyenek úgy, ahogyan ő tett; „erre az egész népből kiki vágott magának ágakat, és követték Abiméleket, és lerakták a fát a vár körül, és tűzzel rájuk gyujtották a várat, úgy hogy meghaltak a Sikem tornyának minden férfiai, közel ezer férfi és asszony”. Így teljesedett be Jótám átka, hogy tűz jön ki Abimélektől, és megemészti Sikem férfiait és Millo házát; Abimélek maga Tébécnél halt meg, amikor egy asszony malomkövet ejtett a fejére egy másik toronyból."
    - "A Tell Balátánál Ernst Sellin 1913 és 1927 között, valamint a Drew–McCormick-expedíció, amelyet először G. Ernest Wright vezetett, 1956–1973 között a város akropoliszán erődtemplomot tárt fel öt méternél vastagabb falakkal, amelyet Kr. e. 1650 körül építettek, és átépítésekkel a Kr. e. 12. századig állt, amikor a várost elpusztították. Wright azonosította a Baál-Berit, a szövetség ura templomával, és Lawrence Stager amellett érvelt, hogy maga az erődtemplom volt a Bírák 9. fejezetének Sikem tornya. A templom alapjai és az előudvarában lévő nagy álló kő (maccéva) ma látható a nábuluszi Tell Balátá régészeti parkjában."
  fi:
    - "Sikemin torni, Migdal-Sikem, esiintyy vain Abimelekin kertomuksessa. Oliko se Sikemin muurein ympäröity linnake temppeleineen vai erillinen linnoitus kaupungin lähellä, on kiistanalaista: Abimelek hävittää Sikemin ja kylvää sen suolalla, ja vasta sitten ”kaikki Sikemin tornin miehet” kokoontuvat Eel-Beritin temppelin holviin, mikä viittaa joidenkin mielestä toiseen paikkaan, kun taas toiset pitävät tornia akropoliksena, joka piti puolensa alakaupungin kaaduttua. Sikem on Tell Balata Nablusin itäreunalla."
    - "”Kun kaikki Sikemin tornin miehet sen kuulivat, menivät he Eel-Beritin temppelin holviin.” Abimelek nousi miehineen Salmonvuorelle, leikkasi oksan, nosti sen olalleen ja käski heidän tehdä samoin; ”väestäkin löi poikki oksansa kukin; sitten he seurasivat Abimelekia, panivat oksat holvin päälle ja sytyttivät holvin heidän päällään palamaan. Niin saivat surmansa myöskin kaikki Sikemin tornin asukkaat, noin tuhat miestä ja naista”. Näin Jotamin kirous toteutui, että tuli lähtisi Abimelekista ja kuluttaisi Sikemin miehet ja Millon huoneen; Abimelek itse kuoli Tebeksessä, kun nainen pudotti jauhinkiven hänen päähänsä toisesta tornista."
    - "Tell Balatan kaivaukset, Ernst Sellinin 1913–1927 ja Drew-McCormickin retkikunnan, jota johti aluksi G. Ernest Wright, 1956–1973, paljastivat kaupungin akropoliilla linnoitetun temppelin, jonka muurit olivat yli viisi metriä paksut, rakennettu noin 1650 eaa. ja pystyssä uudelleenrakennuksineen 1100-luvulle eaa., jolloin kaupunki tuhoutui. Wright tunnisti sen Baal-Beritin, liiton herran, temppeliksi, ja Lawrence Stager on esittänyt, että linnoitettu temppeli itse oli Tuomarien luvun 9 Sikemin torni. Temppelin perustukset ja sen esipihan suuri pystykivi ovat nähtävissä Tell Balatan arkeologisessa puistossa Nablusissa."
  vi:
    - "Tháp Si-chem, Migdal-Shechem, chỉ xuất hiện trong câu chuyện về A-bi-mê-léc. Nó là thành lũy có tường bao của chính Si-chem, với đền thờ trên đó, hay là một đồn riêng gần thành thì còn tranh luận: A-bi-mê-léc san bằng Si-chem và rắc muối lên, và chỉ sau đó “hết thảy dân sự ở tháp Si-chem” mới rút về trong đồn của miếu thần Ên-Bê-rít, điều khiến một số người nghĩ đến một nơi thứ hai, trong khi người khác coi tháp là vệ thành còn cầm cự sau khi hạ thành thất thủ. Si-chem là Tell Balata ở rìa đông Nablus."
    - "“Nghe tin nầy, hết thảy dân sự ở tháp Si-chem đều rút về trong đồn của miếu thần Bê-rít.” A-bi-mê-léc lên Núi Sanh-môn cùng người của hắn, chặt một nhánh cây, vác trên vai và bảo họ làm như mình; “mỗi người chặt một nhánh cây, rồi đi theo A-bi-mê-léc. Họ dựng sắp nhánh cây đó nơi đồn, châm lửa vào, và thiêu đồn cùng những người ở trong. Như vậy hết thảy những người ở tháp Si-chem, nam và nữ, đều chết, số ước một ngàn”. Như vậy lời rủa của Giô-tham được ứng nghiệm, rằng lửa sẽ ra từ A-bi-mê-léc và thiêu nuốt dân Si-chem và nhà Mi-lô; chính A-bi-mê-léc chết ở Thê-bết, khi một người đàn bà ném thớt cối xuống đầu hắn từ một cái tháp khác."
    - "Các cuộc khai quật tại Tell Balata của Ernst Sellin giữa 1913 và 1927 và của đoàn Drew-McCormick, trước hết do G. Ernest Wright dẫn đầu, trong 1956–1973, đã phát lộ trên vệ thành của thành một đền-pháo đài với tường dày hơn năm mét, xây khoảng năm 1650 TCN và đứng, với những lần xây lại, đến thế kỷ 12 TCN, khi thành bị phá hủy. Wright đồng nhất nó với đền Ba-anh-Bê-rít, chúa của giao ước, và Lawrence Stager lập luận rằng chính đền-pháo đài là Tháp Si-chem trong Các Quan Xét 9. Nền móng của đền và tảng đá đứng lớn trong sân trước của nó có thể thấy ngày nay trong công viên khảo cổ Tell Balata ở Nablus."
  ro:
    - "Turnul Sihemului, Migdal-Sihem, apare numai în povestea lui Abimelec. Dacă era cetățuia zidită a Sihemului însuși, cu templul pe ea, sau o fortăreață separată lângă oraș este disputat: Abimelec rade Sihemul și-l presară cu sare, și abia apoi „toți bărbații turnului Sichem” se strâng în întăritura templului lui El-Berit, ceea ce unora le sugerează un al doilea loc, în timp ce alții socotesc turnul acropola care a rezistat după căderea orașului de jos. Sihem este Tell Balata, la marginea estică a Nablusului."
    - "„Și auzind bărbații turnului Sichemului, au intrat toți în întăritura casei făgăduinții lui Vetil Verit.” Abimelec s-a suit pe Muntele Țalmon cu oamenii lui, a tăiat o ramură, a pus-o pe umăr și le-a spus să facă ce a făcut el; apoi „Și au tăiat și ei fiecare o sarcină, și ridicându-o au mers după Avimeleh, și au pus lemnele preste întăritură, și i-au dat ei foc, și au murit toți bărbații turnului Sichem, ca la o mie de bărbați și de femei.” Așa s-a împlinit blestemul lui Iotam, ca foc să iasă din Abimelec și să mistuie pe bărbații Sihemului și casa lui Milo; Abimelec însuși a murit la Tebeț, când o femeie i-a lăsat o piatră de moară în cap dintr-un alt turn."
    - "Săpăturile de la Tell Balata, făcute de Ernst Sellin între 1913 și 1927 și de expediția Drew-McCormick, condusă la început de G. Ernest Wright, în 1956–1973, au scos la iveală pe acropola orașului un templu-fortăreață cu ziduri groase de peste cinci metri, zidit pe la 1650 î.Hr. și rămas în picioare, cu refaceri, până în secolul al XII-lea î.Hr., când orașul a fost distrus. Wright l-a identificat cu templul lui Baal-Berit, stăpânul legământului, iar Lawrence Stager a susținut că însuși templul-fortăreață a fost Turnul Sihemului din Judecători 9. Temeliile templului și marea piatră ridicată din curtea lui din față pot fi văzute astăzi în parcul arheologic Tell Balata din Nablus."
  bg:
    - "Сихемската кула, Мигдал-Сихем, се появява само в разказа за Авимелех. Дали тя е била укрепената цитадела на самия Сихем с храма върху нея, или отделна твърдина близо до града, е спорно: Авимелех разрушава Сихем и го посява със сол и едва тогава „всичките мъже на Сихемския стълп“ се събират в твърдела на храма на Ел-Верит, което на някои подсказва второ място, докато други приемат кулата за акропола, който устоял след падането на долния град. Сихем е Тел Балата на източния край на Наблус."
    - "„И като чуха това всичките мъже на Сихемския стълп, влязоха в твърдела на дома на бога си Верита.“ Авимелех се изкачил с хората си на планината Селмон, отсякъл клон, сложил го на рамото си и им казал да направят като него; „И отсякоха всичките люде всеки ветвата си, и като отидоха с Авимелеха туриха ги на твърдела, и над тях запалиха твърдела с огън, и умряха купно всичките мъже на Сихемския стълп, до тисяща мъже и жени“. Така се изпълнило проклятието на Йотам, че огън ще излезе от Авимелех и ще изпояде сихемските мъже и дома на Мило; самият Авимелех умрял в Тевец, когато една жена хвърлила воденичен камък на главата му от друга кула."
    - "Разкопките в Тел Балата на Ернст Зелин между 1913 и 1927 г. и на експедицията „Дрю–Маккормик“, водена отначало от Дж. Ърнест Райт, през 1956–1973 г. разкрили на акропола на града храм-крепост със стени, дебели над пет метра, построен около 1650 г. пр.н.е. и стоял, с преустройства, до XII в. пр.н.е., когато градът бил разрушен. Райт го отъждествил с храма на Ваал-Верит, господаря на завета, а Лорънс Стейджър доказвал, че самият храм-крепост е Сихемската кула от Съд. 9. Основите на храма и големият изправен камък в предния му двор могат да се видят днес в археологическия парк Тел Балата в Наблус."
