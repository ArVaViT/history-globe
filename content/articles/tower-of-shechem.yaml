# Overview article (ADR 0007). Mainstream facts only; whether the Tower was Shechem's own citadel or a separate stronghold is given as debated; the fortress temple's dates are those of its excavators.
id: tower-of-shechem
place: a939939
title:
  en: "Tower of Shechem"
  ru: "Башня Сихемская"
  uk: "Вежа Сихемська"
  es: "Torre de Siquem"
  pt: "Torre de Siquém"
  de: "Turm von Sichem"
  fr: "Tour de Sichem"
body:
  en:
    - "The Tower of Shechem, Migdal-Shechem, appears only in the story of Abimelech. Whether it was the walled citadel of Shechem itself, with the temple on it, or a separate stronghold near the city is debated: Abimelech razes Shechem and sows it with salt, and only then “all the men of the tower of Shechem” gather in the hold of the temple of El-berith, which suggests to some a second place, while others take the tower for the acropolis that held out after the lower town fell. Shechem is Tell Balata on the east edge of Nablus."
    - "“And when all the men of the tower of Shechem heard that, they entered into an hold of the house of the god Berith.” Abimelech went up Mount Zalmon with his men, cut a bough, laid it on his shoulder and told them to do as he had done; “and all the people likewise cut down every man his bough, and followed Abimelech, and put them to the hold, and set the hold on fire upon them; so that all the men of the tower of Shechem died also, about a thousand men and women”. So the curse of Jotham was fulfilled, that fire should come out from Abimelech and devour the men of Shechem and the house of Millo; Abimelech himself died at Thebez, when a woman dropped a millstone on his head from another tower."
    - "Excavations at Tell Balata by Ernst Sellin between 1913 and 1927 and by the Drew-McCormick expedition, led first by G. Ernest Wright, in 1956–1973 uncovered on the city's acropolis a fortress temple with walls over five metres thick, built about 1650 BC and standing, with rebuildings, into the twelfth century BC, when the city was destroyed. Wright identified it with the temple of Baal-berith, the lord of the covenant, and Lawrence Stager has argued that the fortress temple itself was the Tower of Shechem of Judges 9. The temple's foundations and the great standing stone in its forecourt can be seen today in the archaeological park of Tell Balata in Nablus."
  ru:
    - "Башня Сихемская, по-еврейски Мигдал-Шехем, встречается только в истории Авимелеха. Была ли это обнесённая стеной цитадель самого Сихема с храмом на ней или отдельное укрепление близ города — спорно: Авимелех разрушает Сихем и засевает его солью, и лишь потом «все бывшие в башне Сихемской» собираются в твердыне капища Ваал-Верифа, что одним указывает на второе место, а другие видят в башне акрополь, который держался после падения нижнего города. Сихем — это Телль-Балата на восточной окраине Наблуса."
    - "«Услышав об этом, все бывшие в башне Сихемской ушли в башню капища Ваал-Верифа». Авимелех поднялся на гору Селмон со своими людьми, нарубил сучьев, положил их на плечи и велел делать то же; «и нарубил каждый из всего народа сучьев, и пошли за Авимелехом, и положили к башне, и сожгли посредством их башню огнем, и умерли все бывшие в башне Сихемской, около тысячи мужчин и женщин». Так сбылось проклятие Иофама — что от Авимелеха выйдет огонь и пожжёт жителей Сихема и дом Милло; сам Авимелех погиб в Тевеце, когда женщина сбросила ему на голову обломок жернова с другой башни."
    - "Раскопки Телль-Балаты, которые вели Эрнст Зеллин в 1913–1927 годах и экспедиция Дрю-Маккормик, которую сначала возглавлял Джордж Эрнест Райт, в 1956–1973 годах, открыли на акрополе города храм-крепость со стенами толщиной более пяти метров, построенный около 1650 г. до н. э. и стоявший, с перестройками, до XII века до н. э., когда город был разрушен. Райт отождествил его с храмом Ваал-Верифа, владыки завета, а Лоуренс Стейджер доказывал, что сам храм-крепость и был Башней Сихемской из 9-й главы Судей. Основания храма и большой стоячий камень перед ним можно видеть сегодня в археологическом парке Телль-Балата в Наблусе."
  uk:
    - "Сихемська вежа, Мігдал-Сихем, з’являється лише в розповіді про Авімелеха. Чи була вона муруваною цитаделлю самого Сихема з храмом на ній, чи окремою фортецею поблизу міста, дискутується: Авімелех руйнує Сихем і засіває його сіллю, і лише тоді «осадники замку Сихемського» збираються в храмовій твердині Ель-Беріта, що деяких наштовхує на думку про друге місце, тоді як інші вважають вежу акрополем, що встояв після падіння нижнього міста. Сихем — це Телль-Балата на східному краю Наблуса."
    - "«Як же почули про се осадники замку Сихемського, кинулись вони в храмову твердиню Баалверита». Авімелех піднявся на гору Селмон зі своїми людьми, зрубав гілку, поклав її на плече і звелів їм чинити так, як він: «Тодї й усї військові, чоловік за чоловіком, нарубали галузя й пійшли за Абимелехом, накидали його кругом вежі та й спалили вежу вогнем, так що всї замчане Сихемські погинули, до тисячи душ чоловіків і жіноцтва». Так здійснилося прокляття Йотама, що вогонь вийде від Авімелеха й пожере мужів Сихема та дім Мілло; сам Авімелех загинув у Тевеці, коли жінка скинула жорно йому на голову з іншої вежі."
    - "Розкопки в Телль-Балаті Ернста Селліна між 1913 і 1927 роками та експедиції Дрю–Мак-Кормік, яку спершу очолював Дж. Ернест Райт, у 1956–1973 роках відкрили на акрополі міста храм-фортецю зі стінами завтовшки понад п’ять метрів, збудований близько 1650 р. до н. е. і з перебудовами проіснував до XII ст. до н. е., коли місто було зруйноване. Райт ототожнив його з храмом Ваал-Беріта, господаря заповіту, а Лоуренс Стейджер доводив, що сам храм-фортеця і був Сихемською вежею з Книги Суддів 9. Фундаменти храму й велике стояче каміння на його переддвір’ї можна побачити нині в археологічному парку Телль-Балата в Наблусі."
  es:
    - "La Torre de Siquem, Migdal-Siquem, aparece solo en la historia de Abimelec. Se discute si era la ciudadela amurallada de la propia Siquem, con el templo en ella, o una fortaleza separada cerca de la ciudad: Abimelec arrasa Siquem y la siembra de sal, y solo entonces «todos los de la torre de Sichêm» se reúnen en la fortaleza del templo de El-berit, lo que sugiere a algunos un segundo lugar, mientras otros toman la torre por la acrópolis que resistió tras caer la ciudad baja. Siquem es Tell Balata, en el borde oriental de Nablus."
    - "«Como oyeron esto todos los que estaban en la torre de Sichêm, entráronse en la fortaleza del templo del dios Berith». Abimelec subió al monte Salmón con sus hombres, cortó una rama, se la puso al hombro y les dijo que hicieran lo mismo que él; «Y así todo el pueblo cortó también cada uno su rama, y siguieron á Abimelech, y pusiéronlas junto á la fortaleza, y prendieron fuego con ellas á la fortaleza: por manera que todos los de la torre de Sichêm murieron, como unos mil hombres y mujeres». Así se cumplió la maldición de Jotam, de que saldría fuego de Abimelec y devoraría a los hombres de Siquem y a la casa de Milo; el propio Abimelec murió en Tebes, cuando una mujer le dejó caer una rueda de molino en la cabeza desde otra torre."
    - "Las excavaciones en Tell Balata de Ernst Sellin entre 1913 y 1927 y de la expedición Drew-McCormick, dirigida primero por G. Ernest Wright, en 1956–1973, sacaron a la luz en la acrópolis de la ciudad un templo fortaleza de muros de más de cinco metros de grosor, construido hacia 1650 a. C. y en pie, con reconstrucciones, hasta el siglo XII a. C., cuando la ciudad fue destruida. Wright lo identificó con el templo de Baal-berit, el señor del pacto, y Lawrence Stager ha sostenido que el propio templo fortaleza era la Torre de Siquem de Jueces 9. Los cimientos del templo y la gran piedra erguida de su antepatio pueden verse hoy en el parque arqueológico de Tell Balata, en Nablus."
  pt:
    - "A Torre de Siquém, Migdal-Siquém, aparece apenas na história de Abimeleque. Se era a cidadela murada da própria Siquém, com o templo, ou uma fortaleza separada perto da cidade, é discutido: Abimeleque arrasa Siquém e a semeia de sal, e só então “todos os líderes da torre de Siquém” se reúnem na fortaleza do templo de El-Berite, o que sugere a alguns um segundo lugar, enquanto outros tomam a torre pela acrópole que resistiu depois da queda da cidade baixa. Siquém é Tell Balata, na orla leste de Nablus."
    - "“Quando todos os líderes da torre de Siquém ouviram isso, entraram na fortaleza do templo de El-Berite.” Abimeleque subiu ao monte Zalmom com seus homens, cortou um galho, pôs no ombro e mandou que fizessem como ele fizera; “Todos os homens, da mesma forma, cortaram cada um o seu galho, seguiram Abimeleque, os colocaram na base da fortaleza, e incendiaram a fortaleza sobre eles, de modo que todas as pessoas da torre de Siquém também morreram, cerca de mil homens e mulheres”. Cumpriu-se assim a maldição de Jotão, de que saísse fogo de Abimeleque e devorasse os homens de Siquém e a casa de Milo; o próprio Abimeleque morreu em Tebez, quando uma mulher lhe jogou uma pedra de moinho na cabeça, de outra torre."
    - "Escavações em Tell Balata por Ernst Sellin entre 1913 e 1927 e pela expedição Drew-McCormick, dirigida primeiro por G. Ernest Wright, em 1956–1973, revelaram na acrópole da cidade um templo-fortaleza de muros com mais de cinco metros de espessura, construído por volta de 1650 a.C. e de pé, com reconstruções, até o século XII a.C., quando a cidade foi destruída. Wright o identificou com o templo de Baal-Berite, o senhor da aliança, e Lawrence Stager defendeu que o próprio templo-fortaleza era a Torre de Siquém de Juízes 9. Os alicerces do templo e a grande pedra em pé de seu pátio podem ser vistos hoje no parque arqueológico de Tell Balata, em Nablus."
  de:
    - "Der Turm von Sichem, Migdal-Sichem, erscheint nur in der Geschichte Abimelechs. Ob er die ummauerte Zitadelle Sichems selbst mit dem Tempel darauf war oder eine eigene Festung nahe der Stadt, ist umstritten: Abimelech zerstört Sichem und sät Salz darauf, und erst dann versammeln sich „alle Männer des Turms zu Sichem“ in der Festung des Tempels des El-Berit, was manchen einen zweiten Ort nahelegt, während andere den Turm für die Akropolis halten, die nach dem Fall der Unterstadt standhielt. Sichem ist Tell Balata am Ostrand von Nablus."
    - "„Da das hörten alle Männer des Turms zu Sichem, gingen sie in die Festung des Hauses des Gottes Berith.“ Abimelech stieg mit seinen Leuten auf den Zalmon, hieb einen Ast ab, legte ihn auf die Schulter und hieß sie tun wie er; „da hieb alles Volk ein jeglicher einen Ast ab und folgten Abimelech nach und legten sie an die Festung und steckten's an mit Feuer, daß auch alle Männer des Turms zu Sichem starben, bei tausend Mann und Weib“. So erfüllte sich der Fluch Jotams, dass Feuer von Abimelech ausgehen und die Männer von Sichem und das Haus Millo verzehren solle; Abimelech selbst starb in Tebez, als eine Frau ihm von einem anderen Turm einen Mühlstein auf den Kopf warf."
    - "Grabungen in Tell Balata durch Ernst Sellin 1913–1927 und durch die Drew-McCormick-Expedition, zuerst unter G. Ernest Wright, 1956–1973 legten auf der Akropolis der Stadt einen Festungstempel mit über fünf Meter dicken Mauern frei, um 1650 v. Chr. erbaut und mit Umbauten bis ins zwölfte Jahrhundert v. Chr. bestehend, als die Stadt zerstört wurde. Wright setzte ihn mit dem Tempel des Baal-Berit, des Herrn des Bundes, gleich, und Lawrence Stager hat vertreten, der Festungstempel selbst sei der Turm von Sichem aus Richter 9 gewesen. Die Fundamente des Tempels und der große Standstein in seinem Vorhof sind heute im archäologischen Park von Tell Balata in Nablus zu sehen."
  fr:
    - "La Tour de Sichem, Migdal-Sichem, n’apparaît que dans l’histoire d’Abimélec. On débat si elle était la citadelle fortifiée de Sichem même, avec le temple, ou une place forte distincte près de la ville : Abimélec rase Sichem et y sème du sel, et c’est seulement alors que « tous les habitants de la tour de Sichem » se rassemblent dans la forteresse du temple d’El-Berith, ce qui fait penser à certains à un second lieu, tandis que d’autres y voient l’acropole qui tint bon après la chute de la ville basse. Sichem est Tell Balata, au bord est de Naplouse."
    - "« À cette nouvelle, tous les habitants de la tour de Sichem se rendirent dans la forteresse de la maison du dieu Berith. » Abimélec monta sur la montagne de Tsalmon avec ses hommes, coupa une branche, la mit sur son épaule et leur dit de faire comme lui : « Et ils coupèrent chacun une branche, et suivirent Abimélec ; ils placèrent les branches contre la forteresse, et l’incendièrent avec ceux qui y étaient. Ainsi périrent tous les gens de la tour de Sichem, au nombre d’environ mille, hommes et femmes. » Ainsi s’accomplit la malédiction de Jotham : que le feu sortît d’Abimélec et dévorât les hommes de Sichem et la maison de Millo ; Abimélec mourut lui-même à Thébets, lorsqu’une femme lui lança une meule sur la tête du haut d’une autre tour."
    - "Les fouilles de Tell Balata par Ernst Sellin entre 1913 et 1927, puis par l’expédition Drew-McCormick, menée d’abord par G. Ernest Wright, en 1956-1973, ont dégagé sur l’acropole de la ville un temple-forteresse aux murs de plus de cinq mètres d’épaisseur, bâti vers 1650 av. J.-C. et subsistant, avec des remaniements, jusqu’au XIIe siècle av. J.-C., quand la ville fut détruite. Wright l’identifia au temple de Baal-Berith, le seigneur de l’alliance, et Lawrence Stager a soutenu que le temple-forteresse lui-même était la Tour de Sichem de Juges 9. Les fondations du temple et la grande pierre dressée de son avant-cour se voient aujourd’hui dans le parc archéologique de Tell Balata, à Naplouse."
