body:
  en:
    - "Dor was a port on the coast of the Carmel ridge, about 20 km south of Haifa, built on a headland between small bays that gave the best natural harbour on a straight shore: Tel Dor (Khirbet el-Burj) beside Kibbutz Nahsholim. A Canaanite town stood here in the Bronze Age, and about 1100 BC it belonged to the Tjeker, one of the Sea Peoples: the Egyptian tale of Wenamun tells how its envoy put in at Dor, a town of the Tjeker, was robbed in the harbour and got no redress from its prince Beder. The city then became Phoenician in culture and stayed so for centuries; its purple-dye works, harbour installations and fine imported pottery have been dug since 1980, first by Ephraim Stern and then by Ilan Sharon and Ayelet Gilboa."
    - "Joshua's list counts “the king of Dor in the coast of Dor” among the defeated, and Jabin's allies came from “the borders of Dor on the west”. The city was assigned to Manasseh within Asher, but Israel could not take it: Manasseh did not drive out “the inhabitants of Dor and her towns”, and “the Canaanites would dwell in that land”. Under Solomon “all the region of Dor” was the district of Ben-abinadab, who married the king's daughter Taphath. Tiglath-pileser III made the coast an Assyrian province in 732 BC, probably with Dor as its seat; under the Persians the king gave Dor and Joppa to Sidon, as the inscription of Eshmunazar boasts, and Dor was a Phoenician city with Greek trade."
    - "Antiochus VII besieged the usurper Trypho in Dor in 138 BC; Pompey freed it from the Hasmoneans in 63 BC; in the days of Claudius young men of Dor set up the emperor's statue in the synagogue, and the governor Petronius ordered the culprits sent to him. A bishop sat here in Byzantine times, the Crusaders built the castle of Merle on the mound, and then the site was deserted. Today the tell, with its excavated harbour quarter, stands beside Nahsholim's beaches, and the Mizgaga museum in an old glass factory holds the finds."
  ru:
    - "Дор — порт на побережье у Кармильской гряды, примерно в 20 км к югу от Хайфы, построенный на мысу между небольшими бухтами, которые давали лучшую естественную гавань на прямом берегу: Тель-Дор (Хирбет-эль-Бурдж) рядом с кибуцем Нахшолим. Ханаанский город стоял здесь в бронзовом веке, а около 1100 г. до н. э. он принадлежал чекерам, одному из народов моря: египетский рассказ об Унамоне говорит, как его посланник пристал в Доре, «городе чекеров», был ограблен в гавани и не добился правды у его князя Бедера. Затем город стал финикийским по культуре и оставался таким веками; его красильни пурпура, портовые сооружения и тонкую привозную керамику раскапывают с 1980 года — сначала Эфраим Штерн, затем Илан Шарон и Айелет Гильбоа."
    - "В списке побеждённых у Иисуса Навина стоит «один царь Дора при Нафаф-Доре», а союзники Иавина пришли из Нафоф-Дора «к западу». Город был отдан Манассии в уделе Асира, но Израиль не смог его взять: Манассия не выгнал «жителей Дора и зависящих от него городов», «и остались Хананеи жить в земле сей». При Соломоне Бен-Авинадав был поставлен «над всем Нафаф-Дором», и его женой была царская дочь Тафафь. Феглаффелласар III сделал побережье ассирийской провинцией в 732 г. до н. э., вероятно, с центром в Доре; при Персах царь отдал Дор и Иоппию Сидону, как хвалится надпись Эшмуназара, и Дор был финикийским городом с греческой торговлей."
    - "Антиох VII осаждал в Доре узурпатора Трифона в 138 г. до н. э.; Помпей освободил его от Хасмонеев в 63 г. до н. э.; во дни Клавдия молодые люди Дора поставили статую императора в синагоге, и наместник Петроний потребовал прислать к нему виновных. В византийское время здесь сидел епископ, крестоносцы построили на холме замок Мерль, а потом место опустело. Сегодня холм с раскопанным портовым кварталом стоит у пляжей Нахшолима, а музей Мизгага в старом стекольном заводе хранит находки."
  uk:
    - "Дор був портом на узбережжі кряжа Кармель, приблизно за 20 км на південь від Хайфи, збудованим на мисі між малими бухтами, що давали найкращу природну гавань на прямому березі: Телль-Дор (Хірбет-ель-Бурдж) поряд із кібуцом Нахшоліме. Ханаанське місто стояло тут у добу бронзи, а близько 1100 р. до н. е. належало текерам, одному з Народів моря: єгипетська оповідь про Венамона розповідає, як його посол зайшов до Дору, міста текерів, був пограбований у гавані й не дістав відшкодування від його князя Бедера. Тоді місто стало фінікійським за культурою й лишалося таким століттями; його пурпурові майстерні, гаванні споруди й тонка імпортна кераміка копаються від 1980 р., спершу Ефраїмом Штерном, а потім Іланом Шароном та Аєлет Гільбоа."
    - "Список Ісуса Навина зараховує «Царь Дорський коло Нафат Дору» до переможених, а союзники Явіна прийшли з «Нафот-Дорі понад морем». Місто було призначене Манасії в межах Асіра, але Ізраїль не зміг його взяти: Манасія не прогнав «осадників Дора з урочищами його», і «вдалось Канаанїям зістатись на житлї в цїй країнї». За Соломона «увесь Нафат-Дор» був округом Бен-Авінадава, який узяв за жінку царівну Тафаф. Тіглатпаласар III зробив узбережжя ассирійською провінцією в 732 р. до н. е., імовірно, з Дором як осередком; за персів цар віддав Дор і Яффу Сідонові, як хвалиться напис Ешмуназара, і Дор був фінікійським містом із грецькою торгівлею."
    - "Антіох VII облягав узурпатора Трифона в Дорі в 138 р. до н. е.; Помпей звільнив його від хасмонеїв у 63 р. до н. е.; за днів Клавдія юнаки Дору поставили статую імператора в синагозі, і намісник Петроній наказав відіслати винуватців до нього. Тут сидів єпископ у візантійську добу, хрестоносці збудували на горбі замок Мерл, а потім місце було покинуте. Сьогодні телль із розкопаним гаванським кварталом стоїть поряд із пляжами Нахшоліме, а музей Мізгага в старій скляній фабриці зберігає знахідки."
  es:
    - "Dor era un puerto en la costa de la cordillera del Carmelo, a unos 20 km al sur de Haifa, edificado en un promontorio entre pequeñas bahías que ofrecían el mejor puerto natural de un litoral recto: Tel Dor (Khirbet el-Burj), junto al kibutz Nahsholim. Aquí hubo una ciudad cananea en la Edad del Bronce, y hacia el 1100 a. C. pertenecía a los tjeker, uno de los Pueblos del Mar: el relato egipcio de Unamón cuenta cómo su enviado arribó a Dor, ciudad de los tjeker, fue robado en el puerto y no obtuvo reparación de su príncipe Beder. La ciudad se hizo luego fenicia de cultura y lo siguió siendo durante siglos; sus talleres de tinte púrpura, sus instalaciones portuarias y su fina cerámica importada se excavan desde 1980, primero por Ephraim Stern y luego por Ilan Sharon y Ayelet Gilboa."
    - "La lista de Josué cuenta entre los derrotados «El rey de Dor, de la provincia de Dor», y los aliados de Jabín vinieron de «las regiones de Dor al occidente». La ciudad fue asignada a Manasés dentro de Aser, pero Israel no pudo tomarla: Manasés no echó a «los de Dor y sus aldeas», y «el Cananeo quiso habitar en esta tierra». Bajo Salomón, «todos los términos de Dor» fueron el distrito de Ben-abinadab, que tenía por mujer a la hija del rey, Tafat. Tiglat-pileser III hizo de la costa una provincia asiria en el 732 a. C., probablemente con Dor como sede; bajo los persas el rey dio Dor y Jope a Sidón, como se jacta la inscripción de Eshmunazar, y Dor fue una ciudad fenicia con comercio griego."
    - "Antíoco VII sitió al usurpador Trifón en Dor en el 138 a. C.; Pompeyo la liberó de los asmoneos en el 63 a. C.; en tiempos de Claudio, jóvenes de Dor erigieron la estatua del emperador en la sinagoga, y el gobernador Petronio ordenó que se le enviara a los culpables. Hubo aquí un obispo en época bizantina, los cruzados construyeron el castillo de Merle sobre el montículo, y luego el sitio quedó abandonado. Hoy el tell, con su barrio portuario excavado, se alza junto a las playas de Nahsholim, y el museo de Mizgaga, en una antigua fábrica de vidrio, conserva los hallazgos."
  pt:
    - "Dor era um porto na costa da cordilheira do Carmelo, cerca de 20 km ao sul de Haifa, construído num promontório entre pequenas baías que ofereciam o melhor porto natural de um litoral retilíneo: Tel Dor (Khirbet el-Burj), junto ao Kibutz Nahsholim. Uma cidade cananeia ficava aqui na Idade do Bronze, e por volta de 1100 a.C. pertencia aos Tjeker, um dos Povos do Mar: o relato egípcio de Wenamon conta como seu enviado aportou em Dor, cidade dos Tjeker, foi roubado no porto e não obteve reparação de seu príncipe Beder. A cidade tornou-se depois fenícia em cultura e assim permaneceu por séculos; suas tinturarias de púrpura, instalações portuárias e cerâmica importada fina são escavadas desde 1980, primeiro por Ephraim Stern e depois por Ilan Sharon e Ayelet Gilboa."
    - "A lista de Josué conta entre os derrotados “o rei de Dor, nos altos de Dor”, e os aliados de Jabim vieram dos que estavam “nas colinas de Dor, a oeste”. A cidade foi atribuída a Manassés dentro de Aser, mas Israel não pôde tomá-la: Manassés não expulsou “os habitantes de Dor e seus povoados”, e “os cananeus persistiram em habitar naquela terra”. Sob Salomão, “todas as alturas de Dor” formavam o distrito de Ben-Abinadabe, que se casou com a filha do rei, Tafate. Tiglate-Pileser III fez da costa uma província assíria em 732 a.C., provavelmente com Dor por sede; sob os persas, o rei deu Dor e Jope a Sidom, como se gaba a inscrição de Eshmunazar, e Dor foi uma cidade fenícia com comércio grego."
    - "Antíoco VII sitiou o usurpador Trifão em Dor em 138 a.C.; Pompeu a libertou dos hasmoneus em 63 a.C.; nos dias de Cláudio, jovens de Dor ergueram a estátua do imperador na sinagoga, e o governador Petrônio ordenou que os culpados lhe fossem enviados. Um bispo teve sede aqui em tempos bizantinos, os cruzados construíram o castelo de Merle sobre o monte, e depois o local foi abandonado. Hoje o tell, com seu bairro portuário escavado, fica junto às praias de Nahsholim, e o museu de Mizgaga, numa antiga fábrica de vidro, guarda os achados."
  de:
    - "Dor war ein Hafen an der Küste des Karmelrückens, etwa 20 km südlich von Haifa, auf einer Landzunge zwischen kleinen Buchten gebaut, die den besten natürlichen Hafen an einer geraden Küste boten: Tel Dor (Khirbet el-Burj) neben dem Kibbuz Nahsholim. Eine kanaanäische Stadt stand hier in der Bronzezeit, und um 1100 v. Chr. gehörte sie den Tjeker, einem der Seevölker: Die ägyptische Erzählung des Wenamun berichtet, wie dessen Gesandter in Dor, einer Stadt der Tjeker, anlegte, im Hafen bestohlen wurde und von ihrem Fürsten Beder keine Genugtuung erhielt. Die Stadt wurde dann in ihrer Kultur phönizisch und blieb es über Jahrhunderte; ihre Purpurfärbereien, Hafenanlagen und feine importierte Keramik werden seit 1980 ausgegraben, zuerst von Ephraim Stern und dann von Ilan Sharon und Ayelet Gilboa."
    - "Josuas Liste zählt „der König zu Naphoth-Dor“ zu den Besiegten, und Jabins Verbündete kamen aus „Naphoth-Dor am Meer“. Die Stadt wurde Manasse innerhalb von Asser zugeteilt, doch Israel konnte sie nicht einnehmen: Manasse vertrieb nicht „die Einwohner zu Dor mit den zugehörigen Orten“, und „die Kanaaniter blieben wohnen im Land“. Unter Salomo war „die ganze Herrschaft zu Dor“ der Bezirk des Sohnes Abinadabs, der Salomos Tochter Taphat zur Frau hatte. Tiglat-Pileser III. machte die Küste 732 v. Chr. zu einer assyrischen Provinz, wahrscheinlich mit Dor als Sitz; unter den Persern gab der König Dor und Joppe an Sidon, wie die Inschrift des Eschmunazar rühmt, und Dor war eine phönizische Stadt mit griechischem Handel."
    - "Antiochos VII. belagerte den Usurpator Tryphon 138 v. Chr. in Dor; Pompeius befreite es 63 v. Chr. von den Hasmonäern; zur Zeit des Klaudius stellten junge Männer aus Dor die Statue des Kaisers in der Synagoge auf, und der Statthalter Petronius ließ die Schuldigen zu sich schicken. In byzantinischer Zeit hatte hier ein Bischof seinen Sitz, die Kreuzfahrer errichteten auf dem Hügel die Burg Merle, und dann wurde der Ort verlassen. Heute steht der Tell mit seinem ausgegrabenen Hafenviertel neben den Stränden von Nahsholim, und das Mizgaga-Museum in einer alten Glasfabrik bewahrt die Funde."
  fr:
    - "Dor était un port sur la côte de la crête du Carmel, à environ 20 km au sud de Haïfa, bâti sur un promontoire entre de petites baies qui offraient le meilleur havre naturel d’un rivage rectiligne : Tel Dor (Khirbet el-Burj), près du kibboutz Nahsholim. Une ville cananéenne s’y trouvait à l’âge du Bronze, et vers 1100 av. J.-C. elle appartenait aux Tjeker, l’un des Peuples de la mer : le récit égyptien d’Ounamon raconte que son envoyé fit escale à Dor, ville des Tjeker, y fut volé dans le port et n’obtint aucune réparation de son prince Beder. La ville devint ensuite phénicienne par sa culture et le resta des siècles ; ses ateliers de teinture pourpre, ses installations portuaires et sa belle céramique importée sont fouillés depuis 1980, d’abord par Ephraim Stern puis par Ilan Sharon et Ayelet Gilboa."
    - "La liste de Josué compte parmi les vaincus « le roi de Dor, sur les hauteurs de Dor », et les alliés de Jabin venaient aussi des « hauteurs de Dor à l’occident ». La ville fut attribuée à Manassé dans le territoire d’Aser, mais Israël ne put la prendre : Manassé ne chassa pas « les habitants de Dor et les villes de son ressort », et « les Cananéens voulurent rester dans ce pays ». Sous Salomon, « toute la contrée de Dor » était le district de Ben-Abinadab, qui épousa Thaphath, fille du roi. Tiglath-Piléser III fit de la côte une province assyrienne en 732 av. J.-C., probablement avec Dor pour siège ; sous les Perses, le roi donna Dor et Joppé à Sidon, comme s’en vante l’inscription d’Eshmounazar, et Dor était une ville phénicienne au commerce grec."
    - "Antiochus VII assiégea l’usurpateur Tryphon à Dor en 138 av. J.-C. ; Pompée la libéra des Hasmonéens en 63 av. J.-C. ; du temps de Claude, de jeunes hommes de Dor dressèrent la statue de l’empereur dans la synagogue, et le gouverneur Pétrone ordonna de lui envoyer les coupables. Un évêque y siégeait à l’époque byzantine, les croisés bâtirent le château de Merle sur le tertre, puis le site fut abandonné. Aujourd’hui, le tell, avec son quartier portuaire fouillé, se dresse à côté des plages de Nahsholim, et le musée Mizgaga, dans une ancienne verrerie, conserve les trouvailles."
  it:
    - "Dor era un porto sulla costa della dorsale del Carmelo, a circa 20 km a sud di Haifa, costruito su un promontorio fra piccole baie che offriva il miglior porto naturale su una riva rettilinea: Tel Dor (Khirbet el-Burj) accanto al kibbutz Nahsholim. Una città cananea sorgeva qui nell’età del Bronzo, e intorno al 1100 a.C. apparteneva ai Tjeker, uno dei Popoli del Mare: il racconto egizio di Unamon narra come il suo inviato approdò a Dor, città dei Tjeker, fu derubato nel porto e non ottenne giustizia dal suo principe Beder. La città divenne poi fenicia per cultura e tale rimase per secoli; le sue tintorie di porpora, le installazioni portuali e la fine ceramica d’importazione sono scavate dal 1980, prima da Ephraim Stern e poi da Ilan Sharon e Ayelet Gilboa."
    - "L’elenco di Giosuè annovera fra gli sconfitti «il re di Dor, sulle alture di Dor», e gli alleati di Iabin vennero «dalle alture di Dor a ponente». La città fu assegnata a Manasse entro Aser, ma Israele non poté prenderla: Manasse non cacciò «quelli di Dor e delle città del suo territorio», perché «i Cananei eran decisi a restare in quel paese». Sotto Salomone «tutta la regione di Dor» era il distretto di Ben-Abinadab, che sposò la figlia del re, Tafat. Tiglat-Pilèser III fece della costa una provincia assira nel 732 a.C., probabilmente con Dor come sede; sotto i Persiani il re diede Dor e Giaffa a Sidone, come si vanta l’iscrizione di Eshmunazar, e Dor era una città fenicia con commerci greci."
    - "Antioco VII assediò l’usurpatore Trifone a Dor nel 138 a.C.; Pompeo la liberò dagli Asmonei nel 63 a.C.; ai giorni di Claudio giovani di Dor collocarono la statua dell’imperatore nella sinagoga, e il governatore Petronio ordinò che i colpevoli gli fossero mandati. Un vescovo vi risiedette in epoca bizantina, i crociati costruirono sul tell il castello di Merle, e poi il sito fu abbandonato. Oggi il tell, con il suo quartiere portuale scavato, sorge accanto alle spiagge di Nahsholim, e il museo Mizgaga, in una vecchia vetreria, ne conserva i reperti."
  pl:
    - "Dor było portem na wybrzeżu grzbietu Karmelu, około 20 km na południe od Hajfy, zbudowanym na cyplu między małymi zatokami, który dawał najlepszy naturalny port na prostym brzegu: Tel Dor (Chirbet el-Burdż) obok kibucu Nachszolim. Kananejskie miasto stało tu w epoce brązu, a około 1100 r. p.n.e. należało do Tjekerów, jednego z Ludów Morza: egipska opowieść o Wenamonie mówi, jak jego poseł zawinął do Dor, miasta Tjekerów, został obrabowany w porcie i nie uzyskał zadośćuczynienia od jego księcia Bedera. Miasto stało się potem fenickie w kulturze i pozostało takie przez stulecia; jego farbiarnie purpury, urządzenia portowe i drobna importowana ceramika są odkopywane od 1980 r., najpierw przez Ephraima Sterna, a potem przez Ilana Sharona i Ayelet Gilboa."
    - "Lista Jozuego wymienia wśród pokonanych: „Król Dor z krainy Dor jeden”, a sprzymierzeńcy Jabina zebrali się także z tych, którzy byli „w krainach Dor, ku zachodowi”. Miasto przydzielono Manassesowi w obrębie Aszera, ale Izrael nie mógł go zdobyć: Manases nie wypędził „obywateli z Dor i z miasteczek jego”, a synowie Manassesa nie mogli „wypędzić z onych miast obywateli; przetoż począł Chananejczyk mieszkać w onej ziemi”. Pod Salomonem „wszystkie granice Dor” były okręgiem Ben-Abinadaba, który poślubił córkę króla, Tafat. Tiglat-Pileser III uczynił wybrzeże asyryjską prowincją w 732 r. p.n.e., prawdopodobnie z Dor jako siedzibą; pod Persami król oddał Dor i Jafę Sydonowi, jak chełpi się napis Eszmunazara, a Dor było miastem fenickim z handlem greckim."
    - "Antioch VII oblegał uzurpatora Tryfona w Dor w 138 r. p.n.e.; Pompejusz uwolnił je od Hasmoneuszy w 63 r. p.n.e.; za Klaudiusza młodzi ludzie z Dor ustawili posąg cesarza w synagodze, a namiestnik Petroniusz kazał przysłać do niego winnych. W czasach bizantyjskich zasiadał tu biskup, krzyżowcy zbudowali na kopcu zamek Merle, po czym miejsce opustoszało. Dziś tell z odkopaną dzielnicą portową stoi obok plaż Nachszolim, a muzeum Mizgaga w dawnej hucie szkła przechowuje znaleziska."
  nl:
    - "Dor was een havenstad aan de kust van de Karmelrug, zo'n 20 km ten zuiden van Haifa, gebouwd op een landtong tussen kleine baaien die de beste natuurlijke haven aan een rechte kust vormden: Tel Dor (Khirbet el-Burj) naast kibboets Nahsholim. Een Kanaänitische stad stond hier in de Bronstijd, en omstreeks 1100 v.Chr. behoorde zij aan de Tjekker, een van de Zeevolken: het Egyptische verhaal van Wenamon vertelt hoe zijn gezant Dor binnenliep, een stad van de Tjekker, in de haven werd beroofd en van haar vorst Beder geen recht kreeg. De stad werd daarna cultureel Fenicisch en bleef dat eeuwenlang; haar purperververijen, haveninstallaties en fijn geïmporteerd aardewerk worden sinds 1980 opgegraven, eerst door Ephraim Stern en daarna door Ilan Sharon en Ayelet Gilboa."
    - "Jozua's lijst telt “De koning van Dor, tot Nafath-Dor” onder de verslagenen, en Jabins bondgenoten kwamen uit “Nafoth-Dor, aan de zee”. De stad werd aan Manasse toegewezen binnen Aser, maar Israël kon haar niet innemen: Manasse verdreef “de inwoners van Dor met haar onderhorige plaatsen” niet, en “de Kanaanieten wilden wonen in hetzelve land”. Onder Salomo was “de ganse landstreek van Dor” het district van Ben-Abinadab, die Salomo's dochter Tafat tot vrouw had. Tiglat-Pileser III maakte de kust in 732 v.Chr. een Assyrische provincie, waarschijnlijk met Dor als zetel; onder de Perzen gaf de koning Dor en Joppe aan Sidon, zoals de inscriptie van Esmoenazar pocht, en Dor was een Fenicische stad met Griekse handel."
    - "Antiochus VII belegerde de usurpator Tryphon in 138 v.Chr. in Dor; Pompeius maakte de stad in 63 v.Chr. vrij van de Hasmoneeën; in de dagen van Claudius plaatsten jongemannen van Dor het standbeeld van de keizer in de synagoge, en gouverneur Petronius beval de daders naar hem te sturen. In Byzantijnse tijd zetelde hier een bisschop, de kruisvaarders bouwden op de heuvel het kasteel Merle, en daarna werd de plaats verlaten. Nu ligt de tell, met haar opgegraven havenkwartier, naast de stranden van Nahsholim, en het Mizgaga-museum in een oude glasfabriek bewaart de vondsten."
  cs:
    - "Dór byl přístav na pobřeží karmelského hřebene, asi 20 km jižně od Haify, vystavěný na výběžku mezi malými zálivy, který poskytoval nejlepší přírodní přístav na přímém pobřeží: Tel Dor (Khirbet el-Burj) vedle kibucu Nahsholim. Kanaánské město tu stálo v době bronzové a kolem roku 1100 př. n. l. patřilo Tjekerům, jednomu z Mořských národů: egyptský příběh o Wenamonovi vypráví, jak jeho vyslanec přirazil k Dóru, městu Tjekerů, byl v přístavu oloupen a u jeho knížete Bedera nedosáhl nápravy. Město pak kulturou zfénicizovalo a zůstalo takové po staletí; jeho barvírny na purpur, přístavní zařízení a jemná dovážená keramika jsou od roku 1980 vykopávány, nejprve Ephraimem Sternem a pak Ilanem Sharonem a Ayelet Gilboa."
    - "Mezi poražené počítá Jozuův seznam i krále Dóru: „Král Dor z krajiny Dor jeden“, a Jabínovi spojenci pocházeli z těch, kdo bydleli „v krajinách Dor na západ“. Město bylo přiděleno Manasesovi v Ašeru, ale Izrael je nemohl dobýt: Manases nevyhnal „obyvatelů Dor a Jibleam“ a „počal Kananejský svobodně bydliti v zemi té“. Za Šalomouna byly „všecky končiny Dor“ okrskem Ben-abinadaba, který se oženil s královou dcerou Tafat. Tiglatpilesar III. učinil z pobřeží roku 732 př. n. l. asyrskou provincii, pravděpodobně s Dórem jako sídlem; za Peršanů dal král Dór a Joppe Sidónu, jak se chlubí nápis Ešmunazarův, a Dór byl fénickým městem s řeckým obchodem."
    - "Antiochos VII. obléhal v Dóru uzurpátora Tryfóna roku 138 př. n. l.; Pompeius jej roku 63 př. n. l. osvobodil od Hasmonejců; za Klaudia postavili mladíci z Dóru císařovu sochu v synagoze a místodržitel Petronius nařídil, aby viníci byli posláni k němu. V byzantské době tu sídlil biskup, křižáci postavili na pahorku hrad Merle a pak bylo místo opuštěno. Dnes stojí tell s vykopanou přístavní čtvrtí vedle pláží Nahsholimu a muzeum Mizgaga ve staré sklárně uchovává nálezy."
  sv:
    - "Dor var en hamnstad på kusten vid Karmelåsen, omkring 20 km söder om Haifa, byggd på en udde mellan små vikar som gav den bästa naturliga hamnen på en rak strand: Tel Dor (Khirbet el-Burj) intill kibbutzen Nahsholim. En kananeisk stad stod här under bronsåldern, och omkring 1100 f.Kr. tillhörde den tjekerna, ett av havsfolken: den egyptiska berättelsen om Wenamun berättar hur hans sändebud lade till i Dor, en stad hos tjekerna, blev bestulen i hamnen och inte fick någon upprättelse av dess furste Beder. Staden blev sedan fenicisk i kultur och förblev så i århundraden; dess purpurfärgerier, hamnanläggningar och fina importerade keramik har grävts ut sedan 1980, först av Ephraim Stern och sedan av Ilan Sharon och Ayelet Gilboa."
    - "Josuas förteckning räknar ”konungen över Dor i Nafat-Dor” bland de besegrade, och Javins förbundna kom från ”Nafot-Dor, västerut”. Staden tilldelades Manasse inom Asher, men Israel kunde inte inta den: Manasse fördrev inte ”invånarna i Dor och underlydande orter”, utan ”kananéerna förmådde hålla sig kvar där i landet”. Under Salomo var ”hela Nafat-Dor” distriktet som lydde under Ben-Avinadav, som fick kungens dotter Tafat till hustru. Tiglat-Pileser III gjorde kusten till en assyrisk provins 732 f.Kr., sannolikt med Dor som säte; under perserna gav kungen Dor och Joppe åt Sidon, som Eshmunazars inskription skryter med, och Dor var en fenicisk stad med grekisk handel."
    - "Antiochos VII belägrade usurpatorn Tryfon i Dor 138 f.Kr.; Pompejus befriade den från hasmonéerna 63 f.Kr.; på Claudius tid reste unga män i Dor kejsarens staty i synagogan, och ståthållaren Petronius befallde att de skyldiga skulle sändas till honom. En biskop satt här under bysantinsk tid, korsfararna byggde borgen Merle på kullen, och därefter övergavs platsen. I dag står tellen, med sitt utgrävda hamnkvarter, intill Nahsholims stränder, och Mizgaga-museet i en gammal glasfabrik rymmer fynden."
  nb:
    - "Dor var en havneby på kysten av Karmel-ryggen, omtrent 20 km sør for Haifa, bygd på et nes mellom små bukter som gav den beste naturlige havnen på en rett kyst: Tel Dor (Khirbet el-Burj) ved siden av Kibbutz Nahsholim. En kanaanittisk by sto her i bronsealderen, og omkring 1100 f.Kr. tilhørte den tjekerne, ett av sjøfolkene: den egyptiske fortellingen om Wenamon forteller hvordan hans sendebud la til i Dor, en tjekerby, ble bestjålet i havnen og ikke fikk oppreisning av fyrsten Beder. Byen ble så fønikisk i kultur og forble det i århundrer; dens purpurfargerier, havneanlegg og fine importerte keramikk har vært gravd ut siden 1980, først av Ephraim Stern og så av Ilan Sharon og Ayelet Gilboa."
    - "Josvas liste regner «kongen i Dor på Dor-høidene» blant de beseirede, og Jabins forbundsfeller kom fra «Dor-høidene ved havet». Byen ble tildelt Manasse innenfor Asjers område, men Israel kunne ikke ta den: Manasse drev ikke bort «innbyggerne i Dor med tilhørende småbyer», og «det lyktes kana'anittene å bli boende der i landet». Under Salomo var «hele Dors høiland» distriktet til Ben-Abinadab, som var gift med kongens datter Tafat. Tiglat-Pileser III gjorde kysten til en assyrisk provins i 732 f.Kr., trolig med Dor som sete; under perserne gav kongen Dor og Jaffa til Sidon, slik Esjmunazars innskrift skryter av, og Dor var en fønikisk by med gresk handel."
    - "Antiokos VII beleiret usurpatoren Tryfon i Dor i 138 f.Kr.; Pompeius løste den fra hasmonéerne i 63 f.Kr.; på Klaudius' tid reiste unge menn i Dor keiserens statue i synagogen, og landshøvdingen Petronius befalte at de skyldige skulle sendes til ham. En biskop satt her i bysantinsk tid, korsfarerne bygde borgen Merle på haugen, og så ble stedet forlatt. I dag står tellen, med sitt utgravde havnekvarter, ved siden av Nahsholims strender, og Mizgaga-museet i en gammel glassfabrikk rommer funnene."
