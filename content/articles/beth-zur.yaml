# Overview article (ADR 0007). Mainstream facts only; Maccabean dates follow the usual chronology; the Philip tradition is reported as Eusebius gives it.
id: beth-zur
place: addba2a
title:
  en: "Beth-zur"
  ru: "Беф-Цур"
  uk: "Бет-Цур"
  es: "Bet-sur"
  pt: "Bete-Zur"
  de: "Bet-Zur"
  fr: "Beth-Tsur"
