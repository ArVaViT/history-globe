# Overview article (ADR 0007). Mainstream facts only; Maccabean dates follow the usual chronology; the Philip tradition is reported as Eusebius gives it.
id: beth-zur
place: addba2a
title:
  en: "Beth-zur"
  ru: "Беф-Цур"
  uk: "Бет-Цур"
  es: "Bet-sur"
  pt: "Bete-Zur"
  de: "Bet-Zur"
  fr: "Beth-Tsur"
body:
  en:
    - "Beth-zur, “house of rock”, was a town of the hill country of Judah on the watershed road between Jerusalem and Hebron, about 7 km north of Hebron and nearly 1,000 m above the sea, one of the highest towns in the land: Khirbet et-Tubeiqa, beside Halhul. Joshua lists it in the hill district with “Halhul, Beth-zur, and Gedor”; in the genealogies of Caleb “Maon was the father of Beth-zur”; Rehoboam fortified it with Bethlehem, Tekoa and Adullam as a bulwark of his kingdom; and after the exile Nehemiah son of Azbuk, “the ruler of the half part of Beth-zur”, repaired a stretch of Jerusalem's wall near the tombs of David. The town guarded the southern approach to Jerusalem, and that was its history."
    - "In the Maccabean wars it was the key to Judea from the south. Judas Maccabeus defeated the regent Lysias at Beth-zur in 164 BC and then fortified it against Idumea; Lysias came back and besieged it, and the starving garrison surrendered; Bacchides garrisoned it, and Simon finally took it and fortified it anew. Excavations by O. R. Sellers and W. F. Albright in 1931 and by Sellers in 1957 found a Middle Bronze wall, an Iron Age town, slight remains of the Persian period, among them a small silver coin stamped Yehud, and a Hellenistic citadel rebuilt three times, with stamped Rhodian jar handles from the garrison's wine. Eusebius adds that at Bethsoro, twenty miles from Jerusalem, a spring at the foot of the hill was shown as the place where Philip baptised the Ethiopian eunuch."
    - "The mound is a low ruin beside the Jerusalem–Hebron road between Halhul and Beit Ummar in the Hebron governorate; the spring Ain ed-Dirweh below it kept the Philip tradition alive among pilgrims."
  ru:
    - "Беф-Цур, «дом скалы», — город иудейского нагорья на дороге по водоразделу между Иерусалимом и Хевроном, примерно в 7 км к северу от Хеврона и почти на 1000 м над морем, один из самых высоких городов страны: Хирбет-эт-Тубейка рядом с Халхулом. Иисус Навин перечисляет его в горном округе: «Халхул, Беф-Цур и Гедор»; по родословию Халева, Маон был отцом Беф-Цура; Ровоам укрепил его вместе с Вифлеемом, Фекоей и Одолламом как оплот своего царства; а после плена Неемия, сын Азбука, «начальник полуокруга Бефцурского», чинил участок иерусалимской стены у гробниц Давидовых. Город сторожил южный подступ к Иерусалиму, и в этом была его история."
    - "В Маккавейских войнах он был ключом к Иудее с юга. Иуда Маккавей разбил правителя Лисия при Беф-Цуре в 164 г. до н. э. и затем укрепил его против Идумеи; Лисий вернулся и осадил город, и голодающий гарнизон сдался; Вакхид поставил там гарнизон, а Симон наконец взял его и укрепил ещё сильнее. Раскопки О. Р. Селлерса и У. Ф. Олбрайта в 1931 году и Селлерса в 1957 году открыли стену среднего бронзового века, город железного века, скромные следы персидского времени, среди них маленькую серебряную монету с надписью «Йехуд», и эллинистическую цитадель, трижды перестроенную, с клеймёными родосскими ручками от винных сосудов гарнизона. Евсевий прибавляет, что в Бефсоро, в двадцати милях от Иерусалима, источник у подножия холма показывали как место, где Филипп крестил эфиопского евнуха."
    - "Холм — невысокие руины у дороги Иерусалим — Хеврон между Халхулом и Бейт-Уммаром в мухафазе Хеврон; источник Айн-эд-Дирве под ним поддерживал предание о Филиппе среди паломников."
  uk:
    - "Бет-Цур, «дім скелі», було містом нагір'я Юди на вододільній дорозі між Єрусалимом і Хевроном, приблизно за 7 км на північ від Хеврону і майже на 1000 м над рівнем моря, одним із найвищих міст краю: Хірбет-ет-Тубейка, біля Халхула. Ісус Навин зараховує його до гірського округу з «Халхул, Бет-Зур і Гедор»; в родоводах Калеба «Маон се батько Бет-Зура»; Ровоам укріпив його разом із Вифлеємом, Текоєю та Одоламом як оплот свого царства; а після вигнання Неемія, син Азбуків, «старшина над половиною повіту Бетзурського», лагодив ділянку мурів Єрусалима біля гробів Давида. Місто стерегло південний підхід до Єрусалима, і така була його історія."
    - "У маккавейських війнах воно було ключем до Юдеї з півдня. Юда Маккавей розбив регента Лисія при Бет-Цурі в 164 р. до н. е., а потім укріпив його проти Ідумеї; Лисій повернувся й облягав його, і голодний гарнізон здався; Бакхід поставив там залогу, а Симон нарешті взяв його й укріпив наново. Розкопки О. Р. Селлерса та В. Ф. Олбрайта у 1931 і Селлерса у 1957 році знайшли мур середньої бронзової доби, місто залізної доби, незначні рештки перського періоду, серед них малу срібну монету з написом Єгуд, і елліністичну цитадель, тричі перебудовану, зі штампованими родоськими ручками глеків від вина гарнізону. Євсевій додає, що в Бетсоро, за двадцять миль від Єрусалима, джерело біля підніжжя пагорба показували як місце, де Пилип охрестив ефіопського скопця."
    - "Пагорб — низька руїна біля дороги Єрусалим — Хеврон між Халхулом і Бейт-Уммаром у мухафазі Хеврон; джерело Айн-ед-Дірве під ним підтримувало серед прочан переказ про Пилипа."
  es:
    - "Bet-sur, «casa de roca», era una ciudad de la región montañosa de Judá en el camino de la divisoria de aguas entre Jerusalén y Hebrón, a unos 7 km al norte de Hebrón y a casi 1000 m sobre el nivel del mar, una de las ciudades más altas de la tierra: Khirbet et-Tubeiqa, junto a Halhul. Josué la enumera en el distrito montañoso con «Halhul, y Bethfur, y Gedor»; en las genealogías de Caleb, «Maón padre de Beth-zur»; Roboam la fortificó con Belén, Tecoa y Adulam como baluarte de su reino; y tras el exilio Nehemías hijo de Azbuc, «príncipe de la mitad de la región de Beth-sur», reparó un tramo de la muralla de Jerusalén cerca de los sepulcros de David. La ciudad guardaba el acceso meridional a Jerusalén, y esa fue su historia."
    - "En las guerras macabeas fue la llave de Judea desde el sur. Judas Macabeo derrotó al regente Lisias en Bet-sur en 164 a. C. y luego la fortificó contra Idumea; Lisias volvió y la sitió, y la guarnición hambrienta se rindió; Báquides la guarneció, y Simón finalmente la tomó y la fortificó de nuevo. Las excavaciones de O. R. Sellers y W. F. Albright en 1931 y de Sellers en 1957 hallaron una muralla de la Edad del Bronce Medio, una ciudad de la edad del Hierro, escasos restos del período persa, entre ellos una pequeña moneda de plata con el sello Yehud, y una ciudadela helenística reconstruida tres veces, con asas de ánforas rodias selladas del vino de la guarnición. Eusebio añade que en Bethsoro, a veinte millas de Jerusalén, se mostraba un manantial al pie de la colina como el lugar donde Felipe bautizó al eunuco etíope."
    - "El montículo es una ruina baja junto a la carretera Jerusalén–Hebrón entre Halhul y Beit Ummar, en la gobernación de Hebrón; el manantial de Ain ed-Dirweh bajo él mantuvo viva la tradición de Felipe entre los peregrinos."
  pt:
    - "Bete-Zur, “casa da rocha”, era uma cidade da região montanhosa de Judá, na estrada da divisória de águas entre Jerusalém e Hebrom, cerca de 7 km ao norte de Hebrom e quase 1.000 m acima do mar, uma das cidades mais altas da terra: Khirbet et-Tubeiqa, junto a Halhul. Josué a lista no distrito montanhoso com “Halul, Bete-Zur, Gedor”; nas genealogias de Calebe, “Maom foi o pai de Bete-Zur”; Roboão a fortificou com Belém, Tecoa e Adulão como baluarte de seu reino; e depois do exílio Neemias, filho de Azbuque, “governante da metade do distrito de Bete-Zur”, reparou um trecho da muralha de Jerusalém perto dos túmulos de Davi. A cidade guardava o acesso sul a Jerusalém, e essa foi a sua história."
    - "Nas guerras macabaicas foi a chave da Judeia pelo sul. Judas Macabeu derrotou o regente Lísias em Bete-Zur em 164 a.C. e a fortificou contra a Iduméia; Lísias voltou e a cercou, e a guarnição faminta se rendeu; Báquides a guarneceu, e Simão por fim a tomou e a fortificou de novo. Escavações de O. R. Sellers e W. F. Albright em 1931 e de Sellers em 1957 acharam uma muralha do Bronze Médio, uma cidade da Idade do Ferro, restos escassos do período persa, entre eles uma pequena moeda de prata com o carimbo Yehud, e uma cidadela helenística reconstruída três vezes, com alças de jarros rodiotas carimbadas do vinho da guarnição. Eusébio acrescenta que em Bethsoro, a vinte milhas de Jerusalém, mostrava-se uma fonte ao pé da colina como o lugar onde Filipe batizou o eunuco etíope."
    - "O montículo é uma ruína baixa junto à estrada Jerusalém–Hebrom, entre Halhul e Beit Ummar, na província de Hebrom; a fonte Ain ed-Dirweh, abaixo, manteve viva entre os peregrinos a tradição de Filipe."
  de:
    - "Bet-Zur, „Haus des Felsens“, war eine Stadt im Bergland Judas an der Wasserscheidenstraße zwischen Jerusalem und Hebron, etwa 7 km nördlich von Hebron und fast 1000 m über dem Meer, eine der höchstgelegenen Städte des Landes: Chirbet et-Tubeiqa, neben Halhul. Josua führt sie im Berglandbezirk auf mit „Halhul, Beth-Zur, Gedor“; in den Geschlechtsregistern Kalebs „war Maon der Vater Beth-Zurs“; Rehabeam befestigte sie mit Bethlehem, Tekoa und Adullam als Bollwerk seines Reiches; und nach dem Exil besserte Nehemia, der Sohn Asbuks, „der Oberste des halben Kreises von Beth-Zur“, ein Stück der Mauer Jerusalems nahe den Gräbern Davids aus. Die Stadt bewachte den südlichen Zugang nach Jerusalem, und das war ihre Geschichte."
    - "In den Makkabäerkriegen war sie der Schlüssel zu Judäa von Süden. Judas Makkabäus besiegte den Reichsverweser Lysias 164 v. Chr. bei Bet-Zur und befestigte es dann gegen Idumäa; Lysias kam zurück und belagerte es, und die ausgehungerte Besatzung ergab sich; Bakchides legte eine Besatzung hinein, und Simon nahm es schließlich und befestigte es neu. Grabungen von O. R. Sellers und W. F. Albright 1931 und von Sellers 1957 fanden eine Mauer der Mittelbronzezeit, eine eisenzeitliche Stadt, geringe Reste der Perserzeit, darunter eine kleine Silbermünze mit dem Stempel Yehud, und eine hellenistische Zitadelle, dreimal wiederaufgebaut, mit gestempelten rhodischen Krughenkeln vom Wein der Besatzung. Eusebius fügt hinzu, in Bethsoro, zwanzig Meilen von Jerusalem, sei eine Quelle am Fuß des Hügels als der Ort gezeigt worden, wo Philippus den äthiopischen Kämmerer taufte."
    - "Der Hügel ist eine niedrige Ruine an der Straße Jerusalem–Hebron zwischen Halhul und Beit Ummar im Gouvernement Hebron; die Quelle Ain ed-Dirwe darunter hielt die Philippus-Überlieferung unter Pilgern lebendig."
  fr:
    - "Beth-Tsur, « maison de rocher », était une ville de la montagne de Juda sur la route de la ligne de partage entre Jérusalem et Hébron, à environ 7 km au nord d’Hébron et à près de 1 000 m d’altitude, l’une des villes les plus hautes du pays : Khirbet et-Tubeiqa, à côté de Halhul. Josué la range dans le district de montagne avec « Halhul, Beth-Tsur, Guedor » ; dans les généalogies de Caleb, « Maon, père de Beth-Tsur » ; Roboam la fortifia avec Bethléem, Tekoa et Adullam comme rempart de son royaume ; et après l’exil Néhémie, fils d’Azbuk, « chef de la moitié du district de Beth-Tsur », répara un tronçon du mur de Jérusalem près des sépulcres de David. La ville gardait l’approche méridionale de Jérusalem, et telle fut son histoire."
    - "Dans les guerres des Maccabées, elle fut la clef de la Judée par le sud. Judas Maccabée vainquit le régent Lysias à Beth-Tsur en 164 av. J.-C. puis la fortifia contre l’Idumée ; Lysias revint l’assiéger, et la garnison affamée se rendit ; Bacchidès y mit une garnison, et Simon finit par la prendre et la fortifia de nouveau. Les fouilles de O. R. Sellers et W. F. Albright en 1931 et de Sellers en 1957 ont trouvé un mur du Bronze moyen, une ville de l’âge du Fer, de minces vestiges de l’époque perse, dont une petite monnaie d’argent estampillée Yehud, et une citadelle hellénistique rebâtie trois fois, avec des anses de jarres rhodiennes estampillées du vin de la garnison. Eusèbe ajoute qu’à Bethsoro, à vingt milles de Jérusalem, on montrait une source au pied de la colline comme le lieu où Philippe baptisa l’eunuque éthiopien."
    - "Le tertre est une ruine basse à côté de la route de Jérusalem à Hébron entre Halhul et Beit Ummar, dans le gouvernorat d’Hébron ; la source Ain ed-Dirweh au-dessous a entretenu la tradition de Philippe chez les pèlerins."
