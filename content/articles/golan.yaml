body:
  en:
    - "Golan was a town in Bashan, east of the Sea of Galilee, in the land of the half tribe of Manasseh. Moses set apart three cities of refuge beyond the Jordan, “Bezer in the wilderness, in the plain country, of the Reubenites; and Ramoth in Gilead, of the Gadites; and Golan in Bashan, of the Manassites”, and Joshua confirmed them; Golan was also given to the Levites of the family of Gershon, with Beesh-terah, that is Ashtaroth. A man who had killed without intent could flee there and be safe from the avenger of blood until his case was heard. That is all the Bible tells of the town; it never appears in a story."
    - "The town gave its name to the district. By the Hellenistic period the region east of the lake was Gaulanitis: Josephus says Alexander Jannaeus took Gaulana, that Gaulanitis belonged to the tetrarchy of Philip, son of Herod, and that Judas the Galilean, founder of the movement he calls the fourth philosophy, was a Gaulanite from Gamala. Eusebius still knew Golan as a large village in Batanaea. On the strength of the name and of Eusebius, Golan is usually placed at Sahm al-Jawlan, a village on the eastern edge of the plateau in southern Syria, about 30 km east of the lake; Gottlieb Schumacher recorded its ancient remains in the 1880s, and no excavation has tested the identification."
    - "The name lives on in the Golan Heights, the basalt plateau between the Sea of Galilee, Mount Hermon and the Yarmuk, held by Israel since 1967 and claimed by Syria. Sahm al-Jawlan itself lies east of the ceasefire line, in the Daraa governorate of Syria."
  ru:
    - "Голан — город в Васане, к востоку от Галилейского моря, в земле полуколена Манассиина. Моисей отделил за Иорданом три города убежища: «Бецер в пустыне, на равнине в колене Рувимовом, и Рамоф в Галааде в колене Гадовом, и Голан в Васане в колене Манассиином», и Иисус Навин подтвердил их; Голан был отдан и левитам из рода Гирсона вместе с Беештерой, то есть Астарофом. Убивший неумышленно мог бежать туда и быть в безопасности от мстителя за кровь, пока не разберут его дело. Это всё, что Библия говорит о городе; ни в одном рассказе он не появляется."
    - "Город дал имя целой области. К эллинистической эпохе край к востоку от озера звался Гавланитидой: Иосиф Флавий говорит, что Александр Яннай взял Гавлану, что Гавланитида входила в тетрархию Филиппа, сына Ирода, и что Иуда Галилеянин, основатель движения, которое он называет четвёртой философией, был гавланитом из Гамалы. Евсевий ещё знал Голан как большое селение в Батанее. По имени и по Евсевию Голан обычно помещают в Сахам-аль-Джаулан, селение на восточном краю плато в южной Сирии, примерно в 30 км к востоку от озера; Готлиб Шумахер описал его древние остатки в 1880-х годах, и ни одни раскопки отождествления не проверяли."
    - "Имя живёт в Голанских высотах — базальтовом плато между Галилейским морем, Ермоном и Ярмуком, которое Израиль удерживает с 1967 года и на которое притязает Сирия. Сам Сахм-эль-Джаулан лежит восточнее линии перемирия, в сирийской провинции Даръа."
  uk:
    - "Голан було містом у Башані, на схід від Галілейського моря, в землі половини коліна Манасії. Мойсей відділив три міста-сховища по той бік Йордану, «Безер у степу, на поділлї, для Рубенїїв, і Рамот у Гілеадї для Гадїїв, і Голян у Базанї для Манассіїв», і Ісус Навин їх підтвердив; Голан також дали левітам роду Гершома разом з Беештерою, тобто Аштаротом. Людина, що вбила ненавмисно, могла втекти туди й була в безпеці від месника за кров, доки не розглянуть її справу. Це все, що Біблія розповідає про місто; воно ніколи не з’являється в жодній оповіді."
    - "Місто дало назву окрузі. За елліністичної доби край на схід від озера був Гавланітидою: Йосиф Флавій каже, що Александр Яннай узяв Гавлану, що Гавланітида належала до чверновладдя Пилипа, сина Ірода, і що Юда Галилеянин, засновник руху, який він називає четвертою філософією, був гавланітом із Гамали. Євсевій ще знав Голан як велике село в Батанеї. На підставі назви й Євсевія Голан зазвичай розміщують у Сахм-ель-Джаулян, селі на східному краї плато в південній Сирії, приблизно за 30 км на схід від озера; Готліб Шумахер зафіксував його давні рештки у 1880-х роках, і жодні розкопки не перевіряли це ототожнення."
    - "Назва живе в Голанських висотах — базальтовому плато між Галілейським морем, горою Гермон і Ярмуком, яким Ізраїль володіє від 1967 року і на яке претендує Сирія. Сам Сахм-ель-Джаулян лежить на схід від лінії припинення вогню, в губернаторстві Дераа в Сирії."
  es:
    - "Golán era una población de Basán, al este del mar de Galilea, en la tierra de la media tribu de Manasés. Moisés apartó tres ciudades de refugio al otro lado del Jordán, «Beser en el desierto, en tierra de la llanura, de los Rubenitas; y á Ramoth en Galaad, de los Gaditas; y á Golán en Basán, de los de Manasés», y Josué las confirmó; Golán fue dada también a los levitas de la familia de Gersón, con Beestera, es decir, Astarot. El que había matado sin intención podía huir allí y estar a salvo del vengador de la sangre hasta que se viera su causa. Eso es todo lo que la Biblia cuenta de la población; nunca aparece en un relato."
    - "La población dio su nombre al distrito. En el período helenístico la región al este del lago era la Gaulanítide: Josefo dice que Alejandro Janeo tomó Gaulana, que la Gaulanítide pertenecía a la tetrarquía de Felipe, hijo de Herodes, y que Judas el Galileo, fundador del movimiento que llama la cuarta filosofía, era un gaulanita de Gamala. Eusebio conocía aún Golán como una gran aldea de la Batanea. Por el nombre y por Eusebio, Golán suele situarse en Sahm al-Jawlan, una aldea en el borde oriental de la meseta, en el sur de Siria, a unos 30 km al este del lago; Gottlieb Schumacher registró sus restos antiguos en la década de 1880, y ninguna excavación ha puesto a prueba la identificación."
    - "El nombre pervive en los Altos del Golán, la meseta de basalto entre el mar de Galilea, el monte Hermón y el Yarmuk, en poder de Israel desde 1967 y reclamada por Siria. La propia Sahm al-Jawlan queda al este de la línea del alto el fuego, en la gobernación de Daraa, en Siria."
  pt:
    - "Golã era uma cidade em Basã, a leste do mar da Galileia, na terra da meia tribo de Manassés. Moisés separou três cidades de refúgio além do Jordão, “Bezer, no deserto, na região do planalto, para os rubenitas; Ramote, em Gileade, para os gaditas; e Golã, em Basã, para os manassitas”, e Josué as confirmou; Golã foi também dada aos levitas da família de Gérson, com Beesterá, isto é, Astarote. Quem tivesse matado sem intenção podia fugir para lá e ficar a salvo do vingador do sangue até que seu caso fosse julgado. Isso é tudo o que a Bíblia conta da cidade; ela nunca aparece numa narrativa."
    - "A cidade deu nome ao distrito. No período helenístico a região a leste do lago era a Gaulanítide: Josefo diz que Alexandre Janeu tomou Gaulana, que a Gaulanítide pertencia à tetrarquia de Filipe, filho de Herodes, e que Judas, o Galileu, fundador do movimento que ele chama de quarta filosofia, era gaulanita de Gamala. Eusébio ainda conhecia Golã como uma grande aldeia na Batanéia. Pela força do nome e de Eusébio, Golã é usualmente situada em Sahm al-Jawlan, uma aldeia na borda oriental do planalto, no sul da Síria, a cerca de 30 km a leste do lago; Gottlieb Schumacher registrou seus restos antigos na década de 1880, e nenhuma escavação testou a identificação."
    - "O nome sobrevive nas colinas de Golã, o planalto basáltico entre o mar da Galileia, o monte Hermom e o Yarmuk, mantido por Israel desde 1967 e reivindicado pela Síria. A própria Sahm al-Jawlan fica a leste da linha de cessar-fogo, na província de Daraa, na Síria."
  de:
    - "Golan war eine Stadt in Baschan, östlich des Sees Genezareth, im Land des halben Stammes Manasse. Mose sonderte jenseits des Jordan drei Zufluchtsstädte aus, „Bezer in der Wüste im ebnen Lande unter den Rubenitern und Ramoth in Gilead unter den Gaditern und Golan in Basan unter den Manassitern“, und Josua bestätigte sie; Golan wurde auch den Leviten aus der Familie Gerschon gegeben, zusammen mit Beeschtera, das ist Astarot. Wer ohne Absicht getötet hatte, konnte dorthin fliehen und war vor dem Bluträcher sicher, bis sein Fall verhandelt wurde. Das ist alles, was die Bibel von der Stadt erzählt; sie kommt in keiner Geschichte vor."
    - "Die Stadt gab dem Bezirk ihren Namen. In hellenistischer Zeit hieß die Gegend östlich des Sees Gaulanitis: Josephus sagt, Alexander Jannäus habe Gaulana eingenommen, Gaulanitis habe zur Tetrarchie des Philippus, des Sohnes des Herodes, gehört, und Judas der Galiläer, Begründer der von ihm so genannten vierten Philosophie, sei ein Gaulanit aus Gamla gewesen. Eusebius kannte Golan noch als großes Dorf in Batanäa. Aufgrund des Namens und des Eusebius wird Golan gewöhnlich in Sahm al-Dschaulan angesetzt, einem Dorf am Ostrand des Plateaus in Südsyrien, etwa 30 km östlich des Sees; Gottlieb Schumacher verzeichnete seine antiken Reste in den 1880er Jahren, und keine Grabung hat die Gleichsetzung geprüft."
    - "Der Name lebt in den Golanhöhen fort, dem Basaltplateau zwischen dem See Genezareth, dem Hermon und dem Jarmuk, seit 1967 von Israel gehalten und von Syrien beansprucht. Sahm al-Dschaulan selbst liegt östlich der Waffenstillstandslinie, im syrischen Gouvernement Daraa."
  fr:
    - "Golan était une ville de Basan, à l’est de la mer de Galilée, dans le pays de la demi-tribu de Manassé. Moïse mit à part trois villes de refuge au-delà du Jourdain : « Betser, dans le désert, dans la plaine, chez les Rubénites ; Ramoth, en Galaad, chez les Gadites, et Golan, en Basan, chez les Manassites », et Josué les confirma ; Golan fut aussi donnée aux Lévites de la famille de Guerschon, avec Beeschthra, c’est-à-dire Aschtaroth. Un homme qui avait tué sans intention pouvait s’y réfugier et être à l’abri du vengeur du sang jusqu’à l’examen de son cas. C’est tout ce que la Bible dit de la ville ; elle n’apparaît jamais dans un récit."
    - "La ville donna son nom au district. À l’époque hellénistique, la région à l’est du lac était la Gaulanitide : Josèphe dit qu’Alexandre Jannée prit Gaulana, que la Gaulanitide appartenait à la tétrarchie de Philippe, fils d’Hérode, et que Judas le Galiléen, fondateur du mouvement qu’il appelle la quatrième philosophie, était un Gaulanite de Gamala. Eusèbe connaissait encore Golan comme un grand village de Batanée. D’après le nom et Eusèbe, Golan est d’ordinaire placée à Sahm al-Jawlan, village au bord oriental du plateau, dans le sud de la Syrie, à environ 30 km à l’est du lac ; Gottlieb Schumacher en releva les vestiges antiques dans les années 1880, et aucune fouille n’a mis l’identification à l’épreuve."
    - "Le nom survit dans les hauteurs du Golan, plateau basaltique entre la mer de Galilée, le mont Hermon et le Yarmouk, tenu par Israël depuis 1967 et revendiqué par la Syrie. Sahm al-Jawlan elle-même se trouve à l’est de la ligne de cessez-le-feu, dans le gouvernorat de Deraa, en Syrie."
