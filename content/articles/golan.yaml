body:
  en:
    - "Golan was a town in Bashan, east of the Sea of Galilee, in the land of the half tribe of Manasseh. Moses set apart three cities of refuge beyond the Jordan, “Bezer in the wilderness, in the plain country, of the Reubenites; and Ramoth in Gilead, of the Gadites; and Golan in Bashan, of the Manassites”, and Joshua confirmed them; Golan was also given to the Levites of the family of Gershon, with Beesh-terah, that is Ashtaroth. A man who had killed without intent could flee there and be safe from the avenger of blood until his case was heard. That is all the Bible tells of the town; it never appears in a story."
    - "The town gave its name to the district. By the Hellenistic period the region east of the lake was Gaulanitis: Josephus says Alexander Jannaeus took Gaulana, that Gaulanitis belonged to the tetrarchy of Philip, son of Herod, and that Judas the Galilean, founder of the movement he calls the fourth philosophy, was a Gaulanite from Gamala. Eusebius still knew Golan as a large village in Batanaea. On the strength of the name and of Eusebius, Golan is usually placed at Sahm al-Jawlan, a village on the eastern edge of the plateau in southern Syria, about 30 km east of the lake; Gottlieb Schumacher recorded its ancient remains in the 1880s, and no excavation has tested the identification."
    - "The name lives on in the Golan Heights, the basalt plateau between the Sea of Galilee, Mount Hermon and the Yarmuk, held by Israel since 1967 and claimed by Syria. Sahm al-Jawlan itself lies east of the ceasefire line, in the Daraa governorate of Syria."
  ru:
    - "Голан — город в Васане, к востоку от Галилейского моря, в земле полуколена Манассиина. Моисей отделил за Иорданом три города убежища: «Бецер в пустыне, на равнине в колене Рувимовом, и Рамоф в Галааде в колене Гадовом, и Голан в Васане в колене Манассиином», и Иисус Навин подтвердил их; Голан был отдан и левитам из рода Гирсона вместе с Беештерой, то есть Астарофом. Убивший неумышленно мог бежать туда и быть в безопасности от мстителя за кровь, пока не разберут его дело. Это всё, что Библия говорит о городе; ни в одном рассказе он не появляется."
    - "Город дал имя целой области. К эллинистической эпохе край к востоку от озера звался Гавланитидой: Иосиф Флавий говорит, что Александр Яннай взял Гавлану, что Гавланитида входила в тетрархию Филиппа, сына Ирода, и что Иуда Галилеянин, основатель движения, которое он называет четвёртой философией, был гавланитом из Гамалы. Евсевий ещё знал Голан как большое селение в Батанее. По имени и по Евсевию Голан обычно помещают в Сахам-аль-Джаулан, селение на восточном краю плато в южной Сирии, примерно в 30 км к востоку от озера; Готлиб Шумахер описал его древние остатки в 1880-х годах, и ни одни раскопки отождествления не проверяли."
    - "Имя живёт в Голанских высотах — базальтовом плато между Галилейским морем, Ермоном и Ярмуком, которое Израиль удерживает с 1967 года и на которое притязает Сирия. Сам Сахм-эль-Джаулан лежит восточнее линии перемирия, в сирийской провинции Даръа."
  uk:
    - "Голан було містом у Башані, на схід від Галілейського моря, в землі половини коліна Манасії. Мойсей відділив три міста-сховища по той бік Йордану, «Безер у степу, на поділлї, для Рубенїїв, і Рамот у Гілеадї для Гадїїв, і Голян у Базанї для Манассіїв», і Ісус Навин їх підтвердив; Голан також дали левітам роду Гершома разом з Беештерою, тобто Аштаротом. Людина, що вбила ненавмисно, могла втекти туди й була в безпеці від месника за кров, доки не розглянуть її справу. Це все, що Біблія розповідає про місто; воно ніколи не з’являється в жодній оповіді."
    - "Місто дало назву окрузі. За елліністичної доби край на схід від озера був Гавланітидою: Йосиф Флавій каже, що Александр Яннай узяв Гавлану, що Гавланітида належала до чверновладдя Пилипа, сина Ірода, і що Юда Галилеянин, засновник руху, який він називає четвертою філософією, був гавланітом із Гамали. Євсевій ще знав Голан як велике село в Батанеї. На підставі назви й Євсевія Голан зазвичай розміщують у Сахм-ель-Джаулян, селі на східному краї плато в південній Сирії, приблизно за 30 км на схід від озера; Готліб Шумахер зафіксував його давні рештки у 1880-х роках, і жодні розкопки не перевіряли це ототожнення."
    - "Назва живе в Голанських висотах — базальтовому плато між Галілейським морем, горою Гермон і Ярмуком, яким Ізраїль володіє від 1967 року і на яке претендує Сирія. Сам Сахм-ель-Джаулян лежить на схід від лінії припинення вогню, в губернаторстві Дераа в Сирії."
  es:
    - "Golán era una población de Basán, al este del mar de Galilea, en la tierra de la media tribu de Manasés. Moisés apartó tres ciudades de refugio al otro lado del Jordán, «Beser en el desierto, en tierra de la llanura, de los Rubenitas; y á Ramoth en Galaad, de los Gaditas; y á Golán en Basán, de los de Manasés», y Josué las confirmó; Golán fue dada también a los levitas de la familia de Gersón, con Beestera, es decir, Astarot. El que había matado sin intención podía huir allí y estar a salvo del vengador de la sangre hasta que se viera su causa. Eso es todo lo que la Biblia cuenta de la población; nunca aparece en un relato."
    - "La población dio su nombre al distrito. En el período helenístico la región al este del lago era la Gaulanítide: Josefo dice que Alejandro Janeo tomó Gaulana, que la Gaulanítide pertenecía a la tetrarquía de Felipe, hijo de Herodes, y que Judas el Galileo, fundador del movimiento que llama la cuarta filosofía, era un gaulanita de Gamala. Eusebio conocía aún Golán como una gran aldea de la Batanea. Por el nombre y por Eusebio, Golán suele situarse en Sahm al-Jawlan, una aldea en el borde oriental de la meseta, en el sur de Siria, a unos 30 km al este del lago; Gottlieb Schumacher registró sus restos antiguos en la década de 1880, y ninguna excavación ha puesto a prueba la identificación."
    - "El nombre pervive en los Altos del Golán, la meseta de basalto entre el mar de Galilea, el monte Hermón y el Yarmuk, en poder de Israel desde 1967 y reclamada por Siria. La propia Sahm al-Jawlan queda al este de la línea del alto el fuego, en la gobernación de Daraa, en Siria."
  pt:
    - "Golã era uma cidade em Basã, a leste do mar da Galileia, na terra da meia tribo de Manassés. Moisés separou três cidades de refúgio além do Jordão, “Bezer, no deserto, na região do planalto, para os rubenitas; Ramote, em Gileade, para os gaditas; e Golã, em Basã, para os manassitas”, e Josué as confirmou; Golã foi também dada aos levitas da família de Gérson, com Beesterá, isto é, Astarote. Quem tivesse matado sem intenção podia fugir para lá e ficar a salvo do vingador do sangue até que seu caso fosse julgado. Isso é tudo o que a Bíblia conta da cidade; ela nunca aparece numa narrativa."
    - "A cidade deu nome ao distrito. No período helenístico a região a leste do lago era a Gaulanítide: Josefo diz que Alexandre Janeu tomou Gaulana, que a Gaulanítide pertencia à tetrarquia de Filipe, filho de Herodes, e que Judas, o Galileu, fundador do movimento que ele chama de quarta filosofia, era gaulanita de Gamala. Eusébio ainda conhecia Golã como uma grande aldeia na Batanéia. Pela força do nome e de Eusébio, Golã é usualmente situada em Sahm al-Jawlan, uma aldeia na borda oriental do planalto, no sul da Síria, a cerca de 30 km a leste do lago; Gottlieb Schumacher registrou seus restos antigos na década de 1880, e nenhuma escavação testou a identificação."
    - "O nome sobrevive nas colinas de Golã, o planalto basáltico entre o mar da Galileia, o monte Hermom e o Yarmuk, mantido por Israel desde 1967 e reivindicado pela Síria. A própria Sahm al-Jawlan fica a leste da linha de cessar-fogo, na província de Daraa, na Síria."
  de:
    - "Golan war eine Stadt in Baschan, östlich des Sees Genezareth, im Land des halben Stammes Manasse. Mose sonderte jenseits des Jordan drei Zufluchtsstädte aus, „Bezer in der Wüste im ebnen Lande unter den Rubenitern und Ramoth in Gilead unter den Gaditern und Golan in Basan unter den Manassitern“, und Josua bestätigte sie; Golan wurde auch den Leviten aus der Familie Gerschon gegeben, zusammen mit Beeschtera, das ist Astarot. Wer ohne Absicht getötet hatte, konnte dorthin fliehen und war vor dem Bluträcher sicher, bis sein Fall verhandelt wurde. Das ist alles, was die Bibel von der Stadt erzählt; sie kommt in keiner Geschichte vor."
    - "Die Stadt gab dem Bezirk ihren Namen. In hellenistischer Zeit hieß die Gegend östlich des Sees Gaulanitis: Josephus sagt, Alexander Jannäus habe Gaulana eingenommen, Gaulanitis habe zur Tetrarchie des Philippus, des Sohnes des Herodes, gehört, und Judas der Galiläer, Begründer der von ihm so genannten vierten Philosophie, sei ein Gaulanit aus Gamla gewesen. Eusebius kannte Golan noch als großes Dorf in Batanäa. Aufgrund des Namens und des Eusebius wird Golan gewöhnlich in Sahm al-Dschaulan angesetzt, einem Dorf am Ostrand des Plateaus in Südsyrien, etwa 30 km östlich des Sees; Gottlieb Schumacher verzeichnete seine antiken Reste in den 1880er Jahren, und keine Grabung hat die Gleichsetzung geprüft."
    - "Der Name lebt in den Golanhöhen fort, dem Basaltplateau zwischen dem See Genezareth, dem Hermon und dem Jarmuk, seit 1967 von Israel gehalten und von Syrien beansprucht. Sahm al-Dschaulan selbst liegt östlich der Waffenstillstandslinie, im syrischen Gouvernement Daraa."
  fr:
    - "Golan était une ville de Basan, à l’est de la mer de Galilée, dans le pays de la demi-tribu de Manassé. Moïse mit à part trois villes de refuge au-delà du Jourdain : « Betser, dans le désert, dans la plaine, chez les Rubénites ; Ramoth, en Galaad, chez les Gadites, et Golan, en Basan, chez les Manassites », et Josué les confirma ; Golan fut aussi donnée aux Lévites de la famille de Guerschon, avec Beeschthra, c’est-à-dire Aschtaroth. Un homme qui avait tué sans intention pouvait s’y réfugier et être à l’abri du vengeur du sang jusqu’à l’examen de son cas. C’est tout ce que la Bible dit de la ville ; elle n’apparaît jamais dans un récit."
    - "La ville donna son nom au district. À l’époque hellénistique, la région à l’est du lac était la Gaulanitide : Josèphe dit qu’Alexandre Jannée prit Gaulana, que la Gaulanitide appartenait à la tétrarchie de Philippe, fils d’Hérode, et que Judas le Galiléen, fondateur du mouvement qu’il appelle la quatrième philosophie, était un Gaulanite de Gamala. Eusèbe connaissait encore Golan comme un grand village de Batanée. D’après le nom et Eusèbe, Golan est d’ordinaire placée à Sahm al-Jawlan, village au bord oriental du plateau, dans le sud de la Syrie, à environ 30 km à l’est du lac ; Gottlieb Schumacher en releva les vestiges antiques dans les années 1880, et aucune fouille n’a mis l’identification à l’épreuve."
    - "Le nom survit dans les hauteurs du Golan, plateau basaltique entre la mer de Galilée, le mont Hermon et le Yarmouk, tenu par Israël depuis 1967 et revendiqué par la Syrie. Sahm al-Jawlan elle-même se trouve à l’est de la ligne de cessez-le-feu, dans le gouvernorat de Deraa, en Syrie."
  pl:
    - "Golan było miastem w Baszanie, na wschód od Jeziora Galilejskiego, w ziemi połowy pokolenia Manassesa. Mojżesz wyznaczył trzy miasta ucieczki za Jordanem: „Beser na puszczy, w równinie w ziemi Rubenitów, i Ramot w Galaad między Gadyty, i Golam w Bazan między Manassytami”, a Jozue je potwierdził; Golan oddano też lewitom z rodu Gerszona, wraz z Beesz-Terą, czyli Asztarot. Człowiek, który zabił bez zamiaru, mógł tam uciec i być bezpieczny przed mścicielem krwi, dopóki jego sprawa nie została rozpatrzona. To wszystko, co Biblia mówi o mieście; nie pojawia się w żadnej opowieści."
    - "Miasto dało nazwę okręgowi. W okresie hellenistycznym region na wschód od jeziora nazywał się Gaulanitis: Józef Flawiusz mówi, że Aleksander Janneusz zdobył Gaulanę, że Gaulanitis należała do tetrarchii Filipa, syna Heroda, i że Juda Galilejczyk, założyciel ruchu, który nazywa czwartą filozofią, był Gaulanitą z Gamali. Euzebiusz znał jeszcze Golan jako dużą wieś w Batanei. Na podstawie nazwy i Euzebiusza Golan umieszcza się zwykle w Sahm al-Dżaulan, wsi na wschodnim skraju płaskowyżu w południowej Syrii, około 30 km na wschód od jeziora; Gottlieb Schumacher zapisał jej starożytne szczątki w latach osiemdziesiątych XIX w., a żadne wykopaliska nie sprawdziły utożsamienia."
    - "Nazwa żyje we Wzgórzach Golan, bazaltowym płaskowyżu między Jeziorem Galilejskim, górą Hermon i Jarmukiem, zajętym przez Izrael od 1967 r. i objętym roszczeniami Syrii. Sahm al-Dżaulan leży na wschód od linii zawieszenia broni, w muhafazie Dara w Syrii."
  it:
    - "Golan era una città di Basan, a est del Lago di Tiberiade, nel territorio della mezza tribù di Manasse. Mosè separò tre città di rifugio al di là del Giordano, «Betser, nel deserto, nella regione piana, per i Rubeniti; Ramoth, in Galaad, per i Gaditi, e Golan, in Basan, per i Manassiti», e Giosuè le confermò; Golan fu data anche ai Leviti della famiglia di Gherson, con Beesterah, cioè Astarot. Chi avesse ucciso senza intenzione poteva rifugiarvisi ed essere al sicuro dal vendicatore del sangue fino all’esame del suo caso. Questo è tutto ciò che la Bibbia dice della città; non compare mai in un racconto."
    - "La città diede il nome al distretto. In età ellenistica la regione a est del lago era la Gaulanitide: Giuseppe Flavio dice che Alessandro Ianneo prese Gaulana, che la Gaulanitide apparteneva alla tetrarchia di Filippo, figlio di Erode, e che Giuda il Galileo, fondatore del movimento che egli chiama la quarta filosofia, era un gaulanita di Gamla. Eusebio conosceva ancora Golan come un grande villaggio della Batanea. In base al nome e a Eusebio, Golan è di solito collocata a Sahm al-Jawlan, un villaggio sul margine orientale dell’altopiano nella Siria meridionale, circa 30 km a est del lago; Gottlieb Schumacher ne registrò gli antichi resti negli anni Ottanta dell’Ottocento, e nessuno scavo ha verificato l’identificazione."
    - "Il nome sopravvive nelle Alture del Golan, l’altopiano basaltico fra il Lago di Tiberiade, il Monte Ermon e lo Yarmuk, in mano a Israele dal 1967 e rivendicato dalla Siria. La stessa Sahm al-Jawlan si trova a est della linea del cessate il fuoco, nel governatorato siriano di Daraa."
  nl:
    - "Golan was een stad in Basan, ten oosten van het Meer van Galilea, in het land van de halve stam Manasse. Mozes zonderde drie vrijsteden af aan gene zijde van de Jordaan, “Bezer in de woestijn, in het effen land, voor de Rubenieten; en Ramoth in Gilead, voor de Gadieten; en Golan in Bazan, voor de Manassieten”, en Jozua bevestigde ze; Golan werd ook gegeven aan de Levieten van het geslacht van Gerson, met Be-Estera, dat is Astarot. Wie onopzettelijk iemand had gedood, kon daarheen vluchten en veilig zijn voor de bloedwreker tot zijn zaak was behandeld. Meer vertelt de Bijbel niet over de stad; zij komt in geen enkel verhaal voor."
    - "De stad gaf haar naam aan de streek. In de hellenistische tijd heette het gebied ten oosten van het meer Gaulanitis: Josephus zegt dat Alexander Jannaeus Gaulana innam, dat Gaulanitis tot de tetrarchie van Filippus, de zoon van Herodes, behoorde, en dat Judas de Galileeër, stichter van de beweging die hij de vierde filosofie noemt, een Gaulaniet uit Gamala was. Eusebius kende Golan nog als een groot dorp in Batanea. Op grond van de naam en van Eusebius wordt Golan gewoonlijk geplaatst te Sahm al-Jawlan, een dorp aan de oostrand van het plateau in zuidelijk Syrië, ongeveer 30 km ten oosten van het meer; Gottlieb Schumacher legde de oude resten ervan in de jaren tachtig van de 19e eeuw vast, en geen opgraving heeft de identificatie getoetst."
    - "De naam leeft voort in de Golanhoogte, het basaltplateau tussen het Meer van Galilea, de Hermon en de Yarmuk, sinds 1967 in handen van Israël en door Syrië opgeëist. Sahm al-Jawlan zelf ligt ten oosten van de wapenstilstandslijn, in het Syrische gouvernement Daraa."
  cs:
    - "Golán bylo město v Bášanu, východně od Galilejského jezera, v zemi půlkmene Manasesova. Mojžíš vyhradil tři útočištná města za Jordánem, „Bozor na poušti, na rovinách v kraji Rubenitských, a Rámot v Galád, v pokolení Gád, a Golan v Bázan, v pokolení Manasse“, a Jozue je potvrdil; Golán byl také dán levitům z rodu Geršonova, s Beeštérou, tedy Aštarótem. Člověk, který zabil bez úmyslu, mohl tam uprchnout a být v bezpečí před mstitelem krve, dokud nebyl jeho případ vyslechnut. To je vše, co Bible o městě říká; v žádném příběhu se neobjevuje."
    - "Město dalo jméno kraji. V helénistickém období byla oblast východně od jezera Gaulanitida: Josephus praví, že Alexandr Jannaios dobyl Gaulanu, že Gaulanitida patřila k tetrarchii Filipa, syna Herodova, a že Juda Galilejský, zakladatel hnutí, které nazývá čtvrtou filozofií, byl Gaulanitský z Gamly. Eusebios znal Golán ještě jako velkou vesnici v Batanaji. Podle jména a Eusebia se Golán obvykle klade do Sahm al-Jawlan, vesnice na východním okraji náhorní plošiny v jižní Sýrii, asi 30 km východně od jezera; Gottlieb Schumacher zaznamenal její starověké zbytky v 80. letech 19. století a žádné vykopávky ztotožnění neověřily."
    - "Jméno žije v Golanských výšinách, čedičové náhorní plošině mezi Galilejským jezerem, Hermonem a Jarmukem, držené Izraelem od roku 1967 a nárokované Sýrií. Samotný Sahm al-Jawlan leží východně od linie příměří, v syrské provincii Daraa."
  sv:
    - "Golan var en stad i Bashan, öster om Galileiska sjön, i halva Manasse stams land. Mose avskilde tre tillflyktsstäder på andra sidan Jordan, ”Beser i öknen på slättlandet för Rubens stam, Ramot i Gilead för Gads stam och Golan i Basan för Manasse stam”, och Josua bekräftade dem; Golan gavs också åt leviterna av Gershons släkt, med Beeshtera, det vill säga Ashtarot. En man som dödat utan uppsåt kunde fly dit och vara trygg från blodshämnaren tills hans sak prövats. Det är allt Bibeln berättar om staden; den förekommer aldrig i någon berättelse."
    - "Staden gav sitt namn åt distriktet. Under hellenistisk tid var trakten öster om sjön Gaulanitis: Josefus säger att Alexander Jannaios intog Gaulana, att Gaulanitis hörde till tetrarkin som styrdes av Filippos, Herodes son, och att Judas från Galileen, grundare av rörelsen han kallar den fjärde filosofin, var gaulanit från Gamala. Eusebios kände fortfarande Golan som en stor by i Batanaea. Utifrån namnet och Eusebios förläggs Golan vanligen till Sahm al-Jawlan, en by på platåns östra kant i södra Syrien, omkring 30 km öster om sjön; Gottlieb Schumacher dokumenterade dess antika lämningar på 1880-talet, och ingen utgrävning har prövat identifieringen."
    - "Namnet lever kvar i Golanhöjderna, basaltplatån mellan Galileiska sjön, Hermon och Jarmuk, som Israel har kontrollerat sedan 1967 och som Syrien gör anspråk på. Sahm al-Jawlan självt ligger öster om vapenstilleståndslinjen, i guvernementet Daraa i Syrien."
  nb:
    - "Golan var en by i Basan, øst for Galileasjøen, i landet til Manasses halve stamme. Moses skilte ut tre tilfluktsbyer hinsides Jordan, «Beser i ørkenen på sletten for rubenittene, og Ramot i Gilead for gadittene, og Golan i Basan for manassittene», og Josva bekreftet dem; Golan ble også gitt til levittene av Gersjons ætt, sammen med Be'estera, det vil si Asjtarot. En mann som hadde drept uten hensikt, kunne flykte dit og være trygg for blodhevneren til hans sak var hørt. Det er alt Bibelen forteller om byen; den forekommer aldri i en fortelling."
    - "Byen ga distriktet navn. I hellenistisk tid var området øst for innsjøen Gaulanitis: Josefus sier at Aleksander Jannaios inntok Gaulana, at Gaulanitis hørte til tetrarkiet til Filip, Herodes' sønn, og at Judas fra Galilea, grunnleggeren av bevegelsen han kaller den fjerde filosofi, var en gaulanitt fra Gamala. Eusebius kjente fortsatt Golan som en stor landsby i Batanea. Ut fra navnet og Eusebius plasseres Golan vanligvis ved Sahm al-Jawlan, en landsby i østkanten av platået i det sørlige Syria, omtrent 30 km øst for innsjøen; Gottlieb Schumacher registrerte dens eldgamle rester på 1880-tallet, og ingen utgravning har prøvd identifikasjonen."
    - "Navnet lever videre i Golanhøydene, basaltplatået mellom Galileasjøen, Hermon og Yarmuk, holdt av Israel siden 1967 og gjort krav på av Syria. Sahm al-Jawlan selv ligger øst for våpenhvilelinjen, i guvernementet Daraa i Syria."
  tl:
    - "Ang Golan ay isang bayan sa Basan, sa silangan ng Dagat ng Galilea, sa lupain ng kalahating lipi ni Manases. Itinalaga ni Moises ang tatlong bayang ampunan sa kabila ng Jordan, “sa Beser, sa ilang, sa kapatagang lupa, na ukol sa mga Rubenita; at sa Ramoth sa Galaad, na ukol sa mga Gadita; at sa Golan sa Basan, na ukol sa mga Manasita”, at pinagtibay ito ni Josue; ibinigay din ang Golan sa mga Levita ng angkan ni Gerson, kasama ng Be-estera, ibig sabihin ay Astarot. Ang taong nakapatay nang walang balak ay makatatakas doon at ligtas sa tagapaghiganti ng dugo hanggang marinig ang kaniyang usapin. Iyon lamang ang sinasabi ng Biblia tungkol sa bayan; hindi ito kailanman lumilitaw sa isang kuwento."
    - "Ang bayan ang nagbigay ng pangalan sa distrito. Pagsapit ng panahong Helenistiko, ang rehiyon sa silangan ng lawa ay ang Gaulanitis: sinasabi ni Josephus na kinuha ni Alejandro Janneo ang Gaulana, na ang Gaulanitis ay kabilang sa tetrarkiya ni Felipe, anak ni Herodes, at na si Judas na Galileo, tagapagtatag ng kilusang tinatawag niyang ikaapat na pilosopiya, ay isang Gaulanita mula sa Gamala. Kilala pa ni Eusebio ang Golan bilang malaking nayon sa Batanaea. Batay sa pangalan at kay Eusebio, karaniwang inilalagay ang Golan sa Sahm al-Jawlan, isang nayon sa silangang gilid ng talampas sa timog Siria, mga 30 km sa silangan ng lawa; itinala ni Gottlieb Schumacher ang mga sinaunang labi nito noong dekada 1880, at walang paghuhukay na sumubok sa pagkakakilanlan."
    - "Nabubuhay ang pangalan sa Golan Heights, ang basaltikong talampas sa pagitan ng Dagat ng Galilea, Bundok Hermon at Yarmuk, na hawak ng Israel mula 1967 at inaangkin ng Siria. Ang Sahm al-Jawlan mismo ay nasa silangan ng linya ng tigil-putukan, sa gobernadurya ng Daraa ng Siria."
  da:
    - "Golan var en by i Basan, øst for Genesaret Sø, i den halve Manasse stammes land. Moses udskilte tre tilflugtsbyer hinsides Jordan, »Bezer i Ørken, paa det jævne Land, hos Rubeniterne og Ramoth i Gilead hos Gaditerne og Golan i Basan hos Manassiterne«, og Josva bekræftede dem; Golan blev også givet til leviterne af Gersjons slægt, sammen med Be'esjtera, det vil sige Asjtarot. En mand, der havde dræbt uden forsæt, kunne flygte dertil og være i sikkerhed for blodhævneren, indtil hans sag var hørt. Det er alt, hvad Bibelen fortæller om byen; den optræder aldrig i en fortælling."
    - "Byen gav distriktet dets navn. I den hellenistiske tid var egnen øst for søen Gaulanitis: Josefus siger, at Alexander Jannæus indtog Gaulana, at Gaulanitis hørte til tetrarkiet under Filip, Herodes' søn, og at Judas Galilæeren, grundlægger af den bevægelse, han kalder den fjerde filosofi, var en gaulanit fra Gamala. Eusebios kendte stadig Golan som en stor landsby i Batanæa. På grundlag af navnet og Eusebios placeres Golan sædvanligvis ved Sahm al-Jawlan, en landsby på plateauets østlige kant i det sydlige Syrien, omkring 30 km øst for søen; Gottlieb Schumacher registrerede dens oldtidsrester i 1880'erne, og ingen udgravning har prøvet identifikationen."
    - "Navnet lever videre i Golanhøjderne, basaltplateauet mellem Genesaret Sø, Hermon og Yarmuk, under israelsk kontrol siden 1967 og gjort krav på af Syrien. Sahm al-Jawlan selv ligger øst for våbenhvilelinjen, i Daraa-guvernementet i Syrien."
  sr:
    - "Голан је био град у Васану, источно од Галилејског мора, у земљи половине Манасијиног племена. Мојсије је издвојио три града уточишта с оне стране Јордана: „Восор у пустињи, на равници у земљи племена Рувимовог, и Рамот у Галаду у племену Гадовом, Голан у васанској у племену Манасијином“, а Исус Навин их је потврдио; Голан је такође дат Левитима из Гирсонове породице, са Вестером, то јест Астаротом. Човек који је убио ненамерно могао је тамо побећи и бити сигуран од осветника крви док се његов случај не размотри. То је све што Библија о граду каже; никад се не јавља у причи."
    - "Град је дао име области. До хеленистичког доба крај источно од језера био је Гауланитида: Јосиф Флавије каже да је Александар Јаној узео Гаулану, да је Гауланитида припадала тетрархији Филипа, сина Иродовог, и да је Јуда Галилејац, оснивач покрета који назива четвртом филозофијом, био Гауланићанин из Гамале. Јевсевије је још знао Голан као велико село у Батанеји. На основу имена и Јевсевија, Голан се обично ставља у Сахм ел-Џаулан, село на источном рубу висоравни у јужној Сирији, око 30 км источно од језера; Готлиб Шумахер забележио је његове древне остатке осамдесетих година 19. века, а ни једно ископавање није проверило поистовећење."
    - "Име живи у Голанској висоравни, базалтној висоравни између Галилејског мора, Хермона и Јармука, коју Израиљ држи од 1967, а Сирија је потражује. Сам Сахм ел-Џаулан лежи источно од линије прекида ватре, у гувернорату Дера у Сирији."
  hu:
    - "Gólán Básán városa volt a Galileai-tengertől keletre, Manassé fél törzsének földjén. Mózes három menedékvárost jelölt ki a Jordánon túl, „Beczert a pusztában, a sík földön a Ruben fiainak, Rámótot Gileádban a Gád fiainak, és Gólánt Básánban a Manassé fiainak”, és Józsué megerősítette őket; Gólánt a Gérsón nemzetségbeli lévitáknak is adták Beesterával, vagyis Astaróttal. Aki akaratlanul ölt, oda menekülhetett, és biztonságban volt a vérbosszúálló elől, míg ügyét meg nem hallgatták. Ennyit mond a Biblia a városról; egyetlen történetben sem szerepel."
    - "A város nevét adta a kerületnek. A hellenisztikus korra a tótól keletre fekvő vidék Gaulanitis volt: Josephus szerint Alexandrosz Jannaiosz elfoglalta Gaulánát, Gaulanitis Fülöp, Heródes fia tetrarchiájához tartozott, és a galileai Júdás, a Josephus által negyedik filozófiának nevezett mozgalom alapítója, gaulanitiszi volt Gamalából. Eusebius még Gólánt nagy falunak ismerte Batanaiában. A név és Eusebius alapján Gólánt rendszerint Sahm al-Dzsaulánra helyezik, a dél-szíriai fennsík keleti szélén fekvő falura, mintegy 30 km-re keletre a tótól; Gottlieb Schumacher az 1880-as években feljegyezte ókori maradványait, és ásatás nem vizsgálta az azonosítást."
    - "A név a Gólán-fennsíkban él tovább, a Galileai-tenger, a Hermon-hegy és a Jarmuk közötti bazaltfennsíkon, amelyet Izrael 1967 óta tart, és Szíria magának követel. Sahm al-Dzsaulán maga a tűzszüneti vonaltól keletre fekszik, Szíria Dara kormányzóságában."
  fi:
    - "Golan oli Basanin kaupunki Galileanjärven itäpuolella Manassen heimon toisen puoliskon maassa. Mooses erotti kolme turvakaupunkia Jordanin takaa: ”ruubenilaisille Beser erämaassa, ylätasangolla; gaadilaisille Raamot Gileadissa ja manasselaisille Goolan Baasanissa”, ja Joosua vahvisti ne; Golan annettiin myös Gersonin suvun leeviläisille Beesteran eli Astarotin kanssa. Mies, joka oli tappanut tahattomasti, saattoi paeta sinne ja olla turvassa veren kostajalta, kunnes hänen asiansa oli käsitelty. Siinä kaikki, mitä Raamattu kaupungista kertoo; se ei koskaan esiinny kertomuksessa."
    - "Kaupunki antoi nimensä alueelle. Hellenistiseen aikaan mennessä järven itäpuolinen seutu oli Gaulanitis: Josephus sanoo, että Aleksandros Jannaios valtasi Gaulanan, että Gaulanitis kuului Herodeksen pojan Filippoksen tetrarkiaan ja että Juudas Galilealainen, jota hän kutsuu neljänneksi filosofiaksi nimittämänsä liikkeen perustajaksi, oli gaulanitilainen Gamalasta. Eusebios tunsi Golanin yhä suurena kylänä Batanaeassa. Nimen ja Eusebioksen perusteella Golan sijoitetaan yleensä Sahm al-Jawlaniin, kylään tasangon itäreunalla Etelä-Syyriassa, noin 30 km järvestä itään; Gottlieb Schumacher kirjasi sen muinaisjäännökset 1880-luvulla, eikä mikään kaivaus ole testannut tunnistusta."
    - "Nimi elää Golanin kukkuloilla, basalttitasangolla Galileanjärven, Hermonvuoren ja Jarmukin välissä, jota Israel on hallinnut vuodesta 1967 ja jota Syyria vaatii. Sahm al-Jawlan itse sijaitsee tulitaukolinjan itäpuolella Syyrian Daraan kuvernementissa."
  vi:
    - "Gô-lan là một thành ở Ba-san, phía đông Biển Ga-li-lê, trong đất của nửa chi phái Ma-na-se. Môi-se dành riêng ba thành ẩn náu bên kia sông Giô-đanh, “Bết-se nơi rừng vắng, trong xứ đồng bằng, để cho người Ru-bên; Ra-mốt nơi Ga-la-át, để cho người Gát, và Gô-lan nơi Ba-san, để cho người Ma-na-se”, và Giô-suê xác nhận; Gô-lan cũng được ban cho người Lê-vi thuộc họ Ghẹt-sôn, cùng với Bết-ê-ra, tức Ách-ta-rốt. Người đã giết người không cố ý có thể chạy đến đó và được an toàn trước người báo thù huyết cho đến khi vụ việc được xét xử. Kinh Thánh chỉ kể bấy nhiêu về thành; thành không bao giờ xuất hiện trong một câu chuyện."
    - "Thành đặt tên cho vùng. Đến thời Hy Lạp hóa, vùng phía đông hồ là Gaulanitis: Josephus nói rằng Alexander Jannaeus chiếm Gaulana, rằng Gaulanitis thuộc lãnh địa tứ phân của Phi-líp, con của Hê-rốt, và rằng Giu-đa người Ga-li-lê, người lập phong trào mà ông gọi là “triết phái thứ tư”, là người Gaulanitis từ Gamala. Eusebius vẫn biết Gô-lan là một làng lớn ở Batanaea. Dựa vào tên và vào Eusebius, Gô-lan thường được đặt ở Sahm al-Jawlan, một làng ở rìa đông của cao nguyên miền nam Sy-ri, cách hồ khoảng 30 km về phía đông; Gottlieb Schumacher ghi lại các tàn tích cổ của làng vào thập niên 1880, và chưa cuộc khai quật nào kiểm nghiệm việc đồng nhất này."
    - "Tên còn sống trong Cao nguyên Gô-lan, cao nguyên đá bazan giữa Biển Ga-li-lê, Núi Hẹt-môn và sông Yarmuk, do Israel nắm giữ từ năm 1967 và Sy-ri đòi chủ quyền. Bản thân Sahm al-Jawlan nằm phía đông đường ngừng bắn, trong tỉnh Daraa của Sy-ri."
  ro:
    - "Golan era un oraș din Basan, la est de Marea Galileii, în țara jumătății de trib a lui Manase. Moise a ales trei cetăți de scăpare dincolo de Iordan: „Vosorul la pustie în pământiul cel șes al lui Ruvim, și Ramotul în Galaad al lui Gad, și Golanul în Vasan al lui Manasì”, iar Iosua le-a confirmat; Golan a fost dat și leviților din familia lui Gherșon, împreună cu Beeștera, adică Astarot. Cel care ucisese fără voie putea fugi acolo și era ferit de răzbunătorul sângelui până la judecarea cazului. Atât spune Biblia despre oraș; el nu apare niciodată într-o povestire."
    - "Orașul a dat numele districtului. În epoca elenistică, regiunea de la est de lac era Gaulanitis: Iosif Flaviu spune că Alexandru Ianeu a luat Gaulana, că Gaulanitis aparținea tetrarhiei lui Filip, fiul lui Irod, și că Iuda Galileanul, întemeietorul mișcării pe care o numește a patra filosofie, era un gaulanit din Gamala. Eusebiu mai cunoștea Golanul ca pe un sat mare din Batanaea. Pe baza numelui și a lui Eusebiu, Golanul este plasat de obicei la Sahm al-Jawlan, un sat de la marginea estică a podișului din sudul Siriei, la circa 30 km spre est de lac; Gottlieb Schumacher i-a înregistrat vestigiile antice în anii 1880, iar nicio săpătură nu a verificat identificarea."
    - "Numele trăiește în Înălțimile Golan, podișul bazaltic dintre Marea Galileii, Muntele Hermon și Yarmuk, stăpânit de Israel din 1967 și revendicat de Siria. Sahm al-Jawlan însuși se află la est de linia armistițiului, în guvernoratul Daraa din Siria."
  bg:
    - "Голан беше град във Васан, на изток от Галилейското езеро, в земята на половината от племето на Манасия. Мойсей отдели три града за прибежище отвъд Йордан — „Восор в пустинята, в полянската земя на Рувимовците, и Рамот в Галаад на Гадовците, и Голан у Васан на Манасиевците“, а Иисус Навин ги потвърди; Голан беше даден и на левитите от рода на Гирсон, заедно с Беещера, тоест Астарот. Човек, убил без умисъл, можеше да избяга там и да бъде в безопасност от отмъстителя на кръвта, докато делото му бъде разгледано. Това е всичко, което Библията казва за града; той никога не се появява в разказ."
    - "Градът даде името си на областта. Към елинистическия период областта на изток от езерото беше Гавланитида: Йосиф Флавий казва, че Александър Яней превзел Гавлана, че Гавланитида принадлежала на тетрархията на Филип, сина на Ирод, и че Юда Галилеец, основател на движението, което той нарича четвъртата философия, бил гавланитец от Гамала. Евсевий още познаваше Голан като голямо село в Батанея. Въз основа на името и на Евсевий Голан обикновено се поставя в Сахм ал-Джаулан, село на източния край на платото в Южна Сирия, на около 30 км източно от езерото; Готлиб Шумахер описа древните му останки през 1880-те години, а никакви разкопки не са проверили отъждествяването."
    - "Името живее в Голанските възвишения — базалтовото плато между Галилейското езеро, Ермон и Ярмук, държано от Израел от 1967 г. и претендирано от Сирия. Самият Сахм ал-Джаулан лежи на изток от линията на примирието, в губернаторство Дараа в Сирия."
