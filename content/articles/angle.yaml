# Overview article (ADR 0007). Mainstream facts only; the Angle is a feature of Jerusalem's wall whose exact place is unknown, and the article says so.
id: angle
place: aac6cda
title:
  en: "Angle"
  ru: "Угол"
body:
  en:
    - "The Angle, in the King James Version “the turning of the wall”, was a bend in the city wall of Jerusalem, where the line of the wall changed direction and a tower was needed. It is a landmark rather than a place. The Chronicler says that Uzziah “built towers in Jerusalem at the corner gate, and at the valley gate, and at the turning of the wall, and fortified them”; the corner gate, usually placed at the north-western angle of the city, is another feature, which Jehoash of Israel had breached a generation before."
    - "Nehemiah's account of the rebuilding in 445 BC gives the Angle a setting. On the eastern side of the city, working southward to northward, Ezer repaired a stretch “over against the going up to the armoury at the turning of the wall”; Baruch the next, “from the turning of the wall unto the door of the house of Eliashib the high priest”; farther on Binnui built “from the house of Azariah unto the turning of the wall, even unto the corner”, and Palal “over against the turning of the wall, and the tower which lieth out from the king's high house, that was by the court of the prison”. The Angle thus lay on the eastern wall of the City of David, near the high priest's house and the old royal palace, somewhere between the Water Gate and the Temple Mount."
    - "No one can point to it today. Kathleen Kenyon's excavations of 1961–1967 showed that Nehemiah's wall ran along the crest of the eastern slope, higher than the earlier wall, and a wall segment found by Eilat Mazar in 2007 above the stepped stone structure has been claimed, and disputed, as Nehemiah's; the bend and the projecting tower of the text have not been identified with certainty. The ground is the City of David archaeological site above the Kidron, in East Jerusalem."
  ru:
    - "Угол, в Синодальном переводе также «поворот», был изгибом городской стены Иерусалима, где линия стены меняла направление и требовалась башня. Это скорее примета, чем место. Летописец говорит: «И построил Озия башни в Иерусалиме над воротами угольными и над воротами долины и на углу, и укрепил их»; ворота угольные, которые обычно помещают у северо-западного угла города, — другая примета, которую поколением раньше проломил Иоас Израильский."
    - "Рассказ Неемии о восстановлении стен в 445 г. до н. э. даёт Углу обстановку. На восточной стороне города, идя с юга на север, Езер чинил участок «напротив входа к оружейне на углу»; следующий — Варух, «от угла до дверей дома Елияшива, великого священника»; дальше Биннуй строил «от дома Азарии до угла и поворота», а Фалал — «напротив угла и башни, выступающей от верхнего дома царского, которая у двора темничного». Таким образом, Угол лежал на восточной стене города Давидова, близ дома первосвященника и старого царского дворца, где-то между Водяными воротами и Храмовой горой."
    - "Указать его сегодня никто не может. Раскопки Кэтлин Кеньон 1961–1967 годов показали, что стена Неемии шла по гребню восточного склона, выше прежней стены, а отрезок стены, найденный Эйлат Мазар в 2007 году над ступенчатым каменным сооружением, объявлен стеной Неемии, что оспаривается; изгиб и выступающая башня из текста не отождествлены уверенно. Это земля археологического парка «Город Давида» над Кедроном, в Восточном Иерусалиме."
scripture:
  - 2Kgs.14.13
  - 2Chr.26.9
  - Neh.3.19-Neh.3.25
sources:
