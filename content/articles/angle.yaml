# Overview article (ADR 0007). Mainstream facts only; the Angle is a feature of Jerusalem's wall whose exact place is unknown, and the article says so.
id: angle
place: aac6cda
title:
  en: "Angle"
  ru: "Угол"
  uk: "Кут"
  es: "Ángulo"
  pt: "Esquina"
  de: "Winkel"
  fr: "Angle"
  it: "L’Angolo"
  pl: "Narożnik"
  nl: "De Hoek"
  cs: "Nárožní výběžek"
  sv: "Vinkeln"
body:
  en:
    - "The Angle, in the King James Version “the turning of the wall”, was a bend in the city wall of Jerusalem, where the line of the wall changed direction and a tower was needed. It is a landmark rather than a place. The Chronicler says that Uzziah “built towers in Jerusalem at the corner gate, and at the valley gate, and at the turning of the wall, and fortified them”; the corner gate, usually placed at the north-western angle of the city, is another feature, which Jehoash of Israel had breached a generation before."
    - "Nehemiah's account of the rebuilding in 445 BC gives the Angle a setting. On the eastern side of the city, working southward to northward, Ezer repaired a stretch “over against the going up to the armoury at the turning of the wall”; Baruch the next, “from the turning of the wall unto the door of the house of Eliashib the high priest”; farther on Binnui built “from the house of Azariah unto the turning of the wall, even unto the corner”, and Palal “over against the turning of the wall, and the tower which lieth out from the king's high house, that was by the court of the prison”. The Angle thus lay on the eastern wall of the City of David, near the high priest's house and the old royal palace, somewhere south of the stretch over against the Water Gate, below the Ophel and the Temple Mount."
    - "No one can point to it today. Kathleen Kenyon's excavations of 1961–1967 showed that Nehemiah's wall ran along the crest of the eastern slope, higher than the earlier wall, and a wall segment found by Eilat Mazar in 2007 above the stepped stone structure has been claimed, and disputed, as Nehemiah's; the bend and the projecting tower of the text have not been identified with certainty. The ground is the City of David archaeological site above the Kidron, in East Jerusalem."
  ru:
    - "Угол, в Синодальном переводе также «поворот», был изгибом городской стены Иерусалима, где линия стены меняла направление и требовалась башня. Это скорее примета, чем место. Летописец говорит: «И построил Озия башни в Иерусалиме над воротами угольными и над воротами долины и на углу, и укрепил их»; ворота угольные, которые обычно помещают у северо-западного угла города, — другая примета, которую поколением раньше проломил Иоас Израильский."
    - "Рассказ Неемии о восстановлении стен в 445 г. до н. э. даёт Углу обстановку. На восточной стороне города, идя с юга на север, Езер чинил участок «напротив входа к оружейне на углу»; следующий — Варух, «от угла до дверей дома Елияшива, великого священника»; дальше Биннуй строил «от дома Азарии до угла и поворота», а Фалал — «напротив угла и башни, выступающей от верхнего дома царского, которая у двора темничного». Таким образом, Угол лежал на восточной стене города Давидова, близ дома первосвященника и старого царского дворца, где-то южнее участка напротив Водяных ворот, ниже Офела и Храмовой горы."
    - "Указать его сегодня никто не может. Раскопки Кэтлин Кеньон 1961–1967 годов показали, что стена Неемии шла по гребню восточного склона, выше прежней стены, а отрезок стены, найденный Эйлат Мазар в 2007 году над ступенчатым каменным сооружением, объявлен стеной Неемии, что оспаривается; изгиб и выступающая башня из текста не отождествлены уверенно. Это земля археологического парка «Город Давида» над Кедроном, в Восточном Иерусалиме."
  uk:
    - "Кут, у Біблії короля Якова «the turning of the wall» («поворот муру»), був вигином міського муру Єрусалима, де лінія муру змінювала напрям і потрібна була башта. Це орієнтир, а не місце. Хронікар каже, що Уззія «збудував башти в Ерусалимі над брамою угловою й над долинною брамою й на углї, та й скріпив їх»; Наріжна брама, яку зазвичай розміщують на північно-західному куті міста, — інша прикмета, і Йоас Ізраїльський пробив у ній проломину поколінням раніше."
    - "Неемієва розповідь про відбудову 445 р. до н. е. дає Куту місце. На східному боці міста, йдучи з півдня на північ, Езер лагодив ділянку «проти ввіходу до зброївнї на розї»; Варух наступну — «від угла до дверей дому Елїяшива, первосьвященника»; далі Біннуй будував «від дому Азаріїного до угла й закруту», а Фалал — «проти угла й башти, що виступає від висшої палати царської коло двора темничного». Отже, Кут лежав на східному мурі Міста Давида, поблизу дому первосвященника і давнього царського палацу, десь на південь від ділянки навпроти Водяних воріт, нижче Офелу і Храмової гори."
    - "Сьогодні ніхто не може на нього вказати. Розкопки Кетлін Кеньйон 1961–1967 рр. показали, що Неемієвий мур ішов по гребеню східного схилу, вище за давніший мур, а ділянку муру, знайдену Еїлат Мазар 2007 року над кам'яною ступінчастою спорудою, оголошували Неемієвою, і це заперечують; вигин і виступну башту тексту з певністю не ототожнено. Це місце — археологічний парк Місто Давида над Кедроном, у Східному Єрусалимі."
  es:
    - "El Ángulo, en la Reina-Valera «la esquina» o «la revuelta», era un recodo de la muralla de Jerusalén, donde la línea de la muralla cambiaba de dirección y se necesitaba una torre. Es un mojón más que un lugar. El Cronista dice de Uzías: «Edificó también Uzzías torres en Jerusalem, junto á la puerta del ángulo, y junto á la puerta del valle, y junto á las esquinas; y fortificólas». La puerta del Ángulo, que suele situarse en el ángulo noroccidental de la ciudad, es otro elemento, que Joás de Israel había abierto en brecha una generación antes."
    - "El relato de Nehemías sobre la reconstrucción en 445 a. C. da al Ángulo un entorno. En el lado oriental de la ciudad, trabajando de sur a norte, Ezer reparó un tramo «frente á la subida de la armería de la esquina»; Baruc el siguiente, «desde la esquina hasta la puerta de la casa de Eliasib gran sacerdote»; más allá Binnui construyó «desde la casa de Azarías hasta la revuelta, y hasta la esquina», y Palal «enfrente de la esquina y la torre alta que sale de la casa del rey, que está en el patio de la cárcel». El Ángulo se hallaba, pues, en la muralla oriental de la Ciudad de David, cerca de la casa del sumo sacerdote y del antiguo palacio real, en algún punto al sur del tramo frente a la Puerta del Agua, por debajo del Ofel y del monte del Templo."
    - "Hoy nadie puede señalarlo. Las excavaciones de Kathleen Kenyon de 1961–1967 mostraron que la muralla de Nehemías corría por la cresta de la ladera oriental, más alta que la muralla anterior, y un tramo de muro hallado por Eilat Mazar en 2007 sobre la estructura de piedra escalonada se ha propuesto, y discutido, como de Nehemías; el recodo y la torre saliente del texto no se han identificado con certeza. El terreno es el sitio arqueológico de la Ciudad de David, sobre el Cedrón, en Jerusalén Oriental."
  pt:
    - "A Esquina, na versão King James “a virada do muro”, era uma curva na muralha de Jerusalém, onde a linha do muro mudava de direção e era preciso uma torre. É um marco, mais que um lugar. O Cronista diz que Uzias “construiu torres em Jerusalém, na porta da esquina, na porta do vale e no ângulo do muro, e as fortificou”; a porta da esquina, geralmente situada no ângulo noroeste da cidade, é outro ponto, que Jeoás de Israel havia derrubado uma geração antes."
    - "O relato de Neemias sobre a reconstrução em 445 a.C. dá à Esquina um lugar. No lado leste da cidade, de sul a norte, Ézer reparou um trecho “em frente à subida para a casa das armas, na esquina da muralha”; Baruque o seguinte, “desde a esquina da muralha até a porta da casa de Eliasibe, o sumo sacerdote”; mais adiante Binui reparou “desde a casa de Azarias até a esquina da muralha, e até o canto”, e Palal “em frente à esquina da muralha, e à torre que se projeta da casa superior do rei, que fica junto ao pátio da guarda”. A Esquina ficava, pois, na muralha leste da Cidade de Davi, perto da casa do sumo sacerdote e do antigo palácio real, em algum ponto ao sul do trecho em frente à Porta das Águas, abaixo do Ofel e do monte do Templo."
    - "Hoje ninguém pode apontá-la. As escavações de Kathleen Kenyon em 1961–1967 mostraram que a muralha de Neemias corria ao longo da crista da encosta oriental, mais alta que a muralha anterior, e um trecho de muro achado por Eilat Mazar em 2007 acima da estrutura de pedra escalonada foi apresentado, e contestado, como de Neemias; a curva e a torre saliente do texto não foram identificadas com certeza. O terreno é o sítio arqueológico da Cidade de Davi acima do Cedrom, em Jerusalém Oriental."
  de:
    - "Der Winkel, in der King-James-Bibel „the turning of the wall“, war eine Biegung der Stadtmauer Jerusalems, wo die Mauerlinie die Richtung wechselte und ein Turm nötig war. Er ist eher eine Landmarke als ein Ort. Der Chronist sagt, Usija „baute Türme zu Jerusalem am Ecktor und am Taltor und am Winkel und befestigte sie“; das Ecktor, gewöhnlich an der nordwestlichen Ecke der Stadt angesetzt, ist ein anderes Merkmal, das Joas von Israel eine Generation zuvor durchbrochen hatte."
    - "Nehemias Bericht vom Wiederaufbau 445 v. Chr. gibt dem Winkel einen Zusammenhang. Auf der Ostseite der Stadt, von Süden nach Norden arbeitend, besserte Eser ein Stück aus „den Winkel hinan gegenüber dem Zeughaus“; Baruch das nächste „vom Winkel bis an die Haustür Eljasibs, des Hohenpriesters“; weiter baute Binnui „vom Hause Asarjas bis an den Winkel und bis an die Ecke“ und Palal „gegenüber dem Winkel und den Oberen Turm, der vom Königshause heraussieht bei dem Kerkerhofe“. Der Winkel lag also an der Ostmauer der Stadt Davids, nahe dem Haus des Hohenpriesters und dem alten Königspalast, irgendwo südlich des Abschnitts gegenüber dem Wassertor, unterhalb des Ofel und des Tempelbergs."
    - "Heute kann ihn niemand zeigen. Kathleen Kenyons Grabungen 1961–1967 zeigten, dass Nehemias Mauer auf dem Kamm des Osthangs verlief, höher als die frühere Mauer, und ein Mauerstück, das Eilat Mazar 2007 oberhalb der Stufensteinstruktur fand, wurde als Nehemias Mauer beansprucht und bestritten; die Biegung und der vorspringende Turm des Textes sind nicht sicher bestimmt. Das Gelände ist die archäologische Stätte der Stadt Davids über dem Kidron in Ostjerusalem."
  fr:
    - "L’Angle, dans la version King James « le tournant de la muraille », était un coude du rempart de Jérusalem, où la ligne du mur changeait de direction et où une tour était nécessaire. C’est un repère plutôt qu’un lieu. Le Chroniste dit qu’Ozias « bâtit des tours à Jérusalem sur la porte de l’angle, sur la porte de la vallée, et sur l’angle, et il les fortifia » ; la porte de l’angle, d’ordinaire placée à l’angle nord-ouest de la ville, est un autre élément, que Joas d’Israël avait forcée une génération plus tôt."
    - "Le récit de Néhémie sur la reconstruction en 445 av. J.-C. donne un cadre à l’Angle. Sur le côté oriental de la ville, en allant du sud au nord, Ézer répara une portion « vis-à-vis de la montée de l’arsenal, à l’angle » ; Baruc la suivante, « depuis l’angle jusqu’à la porte de la maison d’Éliaschib, le souverain sacrificateur » ; plus loin Binnuï répara « depuis la maison d’Azaria jusqu’à l’angle et jusqu’au coin », et Palal travailla « vis-à-vis de l’angle et de la tour supérieure qui fait saillie en avant de la maison du roi près de la cour de la prison ». L’Angle se trouvait donc sur le mur oriental de la Cité de David, près de la maison du grand prêtre et de l’ancien palais royal, quelque part au sud du tronçon situé vis-à-vis de la porte des Eaux, en contrebas de l’Ophel et du mont du Temple."
    - "Nul ne peut aujourd’hui le montrer. Les fouilles de Kathleen Kenyon en 1961-1967 ont montré que le mur de Néhémie courait sur la crête du versant oriental, plus haut que le mur antérieur, et un tronçon de mur trouvé par Eilat Mazar en 2007 au-dessus de la structure de pierre à gradins a été présenté, et contesté, comme étant celui de Néhémie ; le coude et la tour en saillie du texte n’ont pas été identifiés avec certitude. Le terrain est le site archéologique de la Cité de David au-dessus du Cédron, à Jérusalem-Est."
  it:
    - "L’Angolo, in inglese «the turning of the wall» nella King James Version, era una svolta nelle mura di Gerusalemme, dove la linea delle mura cambiava direzione e occorreva una torre. È un punto di riferimento più che un luogo. Il Cronista dice che Ozia «costruì pure delle torri a Gerusalemme sulla porta dell’angolo, sulla porta della valle e sullo svolto, e le fortificò»; la porta dell’angolo, di solito collocata all’angolo nord-occidentale della città, è un’altra cosa, che Ioas d’Israele aveva violato una generazione prima."
    - "Il racconto di Neemia sulla ricostruzione nel 445 a.C. dà all’Angolo una collocazione. Sul lato orientale della città, lavorando da sud verso nord, Ezer restaurò un tratto «dirimpetto alla salita dell’arsenale, all’angolo»; Baruc il successivo, «dall’angolo fino alla porta della casa di Eliascib, il sommo sacerdote»; più oltre Binnui costruì «dalla casa di Azaria fino allo svolto, e fino all’angolo», e Palal «dirimpetto allo svolto e alla torre sporgente dalla casa superiore del re, che da sul cortile della prigione». L’Angolo si trovava dunque sulle mura orientali della Città di Davide, vicino alla casa del sommo sacerdote e all’antico palazzo reale, da qualche parte a sud del tratto dirimpetto alla Porta delle Acque, sotto l’Ofel e il Monte del Tempio."
    - "Oggi nessuno può indicarlo. Gli scavi di Kathleen Kenyon del 1961–1967 hanno mostrato che le mura di Neemia correvano lungo la cresta del pendio orientale, più in alto delle mura precedenti, e un tratto di muro trovato da Eilat Mazar nel 2007 sopra la struttura a gradoni di pietra è stato sostenuto, e contestato, come di Neemia; la svolta e la torre sporgente del testo non sono state identificate con certezza. Il terreno è il sito archeologico della Città di Davide sopra il Cedron, a Gerusalemme Est."
  pl:
    - "Narożnik, w Biblii króla Jakuba „zakręt muru”, w Biblii Gdańskiej zaś zapisywany jako Mikzoa, był załamaniem muru miejskiego Jerozolimy, w którym linia muru zmieniała kierunek i potrzebna była wieża. To raczej punkt orientacyjny niż miejsce. Kronikarz mówi, że Uzzjasz „budował wieże w Jeruzalemie nad bramą narożną, i nad bramą doliny, i nad Mikzoa, i umocnił je”; brama narożna, umieszczana zwykle w północno-zachodnim narożu miasta, to coś innego, co Joasz izraelski wyłamał pokolenie wcześniej."
    - "Relacja Nehemiasza o odbudowie w 445 r. p.n.e. daje Narożnikowi umiejscowienie. Po wschodniej stronie miasta, idąc od południa ku północy, Ezer naprawiał odcinek „przeciw miejscu, kędy chodzą do zbrojowni nazwanej Mikzoa”; Baruch następny, „od Mikzoa aż do drzwi domu Elijasyba, najwyższego kapłana”; dalej Binnuj budował „od domu Azaryjaszowego aż do Mikzoa, i aż do rogu”, a Palal „przeciw Mikzoa, i wieży wysokiej, wywiedzionej z domu królewskiego, która była w sieni więzienia”. Narożnik leżał więc na wschodnim murze Miasta Dawida, blisko domu arcykapłana i dawnego pałacu królewskiego, gdzieś na południe od odcinka naprzeciw Bramy Wodnej, poniżej Ofelu i Wzgórza Świątynnego."
    - "Dziś nikt nie potrafi go wskazać. Wykopaliska Kathleen Kenyon z lat 1961–1967 wykazały, że mur Nehemiasza biegł wzdłuż grzbietu wschodniego zbocza, wyżej niż wcześniejszy mur, a odcinek muru odnaleziony przez Eilat Mazar w 2007 roku nad kamienną strukturą schodkową uznawano za mur Nehemiasza, co jest kwestionowane; załamania i wysuniętej wieży z tekstu nie utożsamiono z pewnością. Teren to stanowisko archeologiczne Miasta Dawida nad Cedronem, we Wschodniej Jerozolimie."
  nl:
    - "De Hoek, in de King James Version “the turning of the wall”, was een bocht in de stadsmuur van Jeruzalem, waar de muur van richting veranderde en een toren nodig was. Het is eerder een oriëntatiepunt dan een plaats. De Kroniekschrijver zegt: “Daartoe bouwde Uzzia torens te Jeruzalem, aan de Hoekpoort en aan de Dalpoort, en aan de hoeken; en hij sterkte ze”; de Hoekpoort, gewoonlijk geplaatst op de noordwestelijke hoek van de stad, is een ander punt, dat Joas van Israël een generatie eerder had doorbroken."
    - "Nehemia’s verslag van de herbouw in 445 v.Chr. geeft de Hoek een plaats. Aan de oostkant van de stad, van zuid naar noord werkend, herstelde Ezer een stuk “tegenover den opgang naar het wapenhuis, aan den hoek”; Baruch het volgende, “van den hoek tot aan de deur van het huis van Eljasib, den hogepriester”; verderop bouwde Binnui “van het huis van Azaria tot aan den hoek en tot aan het punt”, en Palal “tegen den hoek, en den hogen toren over, die van des konings huis uitsteekt, die bij den voorhof der gevangenis is”. De Hoek lag dus aan de oostmuur van de Stad van David, nabij het huis van de hogepriester en het oude koninklijke paleis, ergens ten zuiden van het stuk tegenover de Waterpoort, onder de Ofel en de Tempelberg."
    - "Niemand kan hem tegenwoordig aanwijzen. Kathleen Kenyons opgravingen van 1961–1967 toonden dat Nehemia’s muur over de kam van de oosthelling liep, hoger dan de eerdere muur, en een muurstuk dat Eilat Mazar in 2007 boven de getrapte steenstructuur vond, is als Nehemia’s muur aangemerkt, en betwist; de bocht en de uitstekende toren van de tekst zijn niet met zekerheid geïdentificeerd. Het terrein is de archeologische plaats Stad van David boven de Kidron, in Oost-Jeruzalem."
  cs:
    - "Nárožní výběžek, v Bibli krále Jakuba „the turning of the wall“, byl ohyb jeruzalémské městské hradby, kde čára hradby měnila směr a bylo třeba věže. Je to spíše orientační bod než místo. Kronikář praví, že „vzdělal Uziáš věže v Jeruzalémě u brány úhlové, a u brány údolí, a u Mikzoa, i upevnil je“; úhlová brána, obvykle kladená na severozápadní roh města, je jiný prvek, který Joaš Izraelský prorazil o generaci dříve."
    - "Nehemjášovo vyprávění o obnově v roce 445 př. n. l. dává Nárožnímu výběžku zasazení. Na východní straně města, od jihu k severu, opravoval Ezer úsek „naproti, kudyž se chodí k skladu zbroje Mikzoa“; Baruch další, „od Mikzoa až ke dveřům domu Eliasiba, kněze nejvyššího“; dále Binuj stavěl „od domu Azariášova až do Mikzoa a až k úhlu“ a Palal „proti Mikzoa a věži vysoké, kteráž vyhlédala z domu králova, jenž byla v placu u žaláře“. Nárožní výběžek tak ležel na východní hradbě Města Davidova, poblíž domu velekněze a starého královského paláce, někde jižně od úseku naproti Vodní bráně, pod Ofelem a Chrámovou horou."
    - "Dnes na něj nikdo nemůže ukázat. Vykopávky Kathleen Kenyonové v letech 1961–1967 ukázaly, že Nehemjášova hradba vedla po hřebeni východního svahu, výše než dřívější hradba, a úsek hradby, který Eilat Mazar nalezla v roce 2007 nad stupňovitou kamennou strukturou, byl prohlášen za Nehemjášův, což bylo zpochybněno; ohyb a vyčnívající věž z textu nebyly s jistotou určeny. Místo je archeologický areál Město Davidovo nad Kidronem ve východním Jeruzalémě."
  sv:
    - "Vinkeln, i King James-översättningen ”the turning of the wall”, var en krök på Jerusalems stadsmur, där murens linje ändrade riktning och ett torn behövdes. Det är ett landmärke snarare än en plats. Krönikeförfattaren säger att Ussia ”byggde torn i Jerusalem över Hörnporten och över Dalporten och över Vinkeln och befäste dem”; Hörnporten, som vanligen placeras vid stadens nordvästra hörn, är ett annat inslag, som Joash av Israel hade slagit hål på en generation tidigare."
    - "Nehemjas berättelse om återuppbyggnaden år 445 f.Kr. ger Vinkeln en omgivning. På stadens östra sida, med arbete från söder mot norr, satte Eser i stånd en sträcka ”mitt emot uppgången till tyghuset i Vinkeln”; Baruk nästa, ”från Vinkeln ända fram till ingången till översteprästen Eljasibs hus”; längre fram byggde Binnuj ”från Asarjas hus ända fram till Vinkeln och vidare fram till Hörnet”, och Palal ”från platsen mitt emot Vinkeln och det torn som skjuter ut från det övre konungshuset, vid fängelsegården”. Vinkeln låg alltså på Davids stads östra mur, nära översteprästens hus och den gamla kungliga palatsbyggnaden, någonstans söder om sträckan mitt emot Vattenporten, nedanför Ofel och Tempelberget."
    - "Ingen kan peka ut den i dag. Kathleen Kenyons utgrävningar 1961–1967 visade att Nehemjas mur löpte längs kammen av den östra sluttningen, högre än den tidigare muren, och ett murparti som Eilat Mazar fann 2007 ovanför den trappstegsformade stenstrukturen har hävdats, och bestritts, vara Nehemjas; kröken och det utskjutande tornet i texten har inte identifierats med säkerhet. Marken är det arkeologiska området Davids stad ovanför Kidron i Östra Jerusalem."
scripture:
  - 2Kgs.14.13
  - 2Chr.26.9
  - Neh.3.19-Neh.3.26
