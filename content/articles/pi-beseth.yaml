body:
  en:
    - "Pi-beseth is the Hebrew form of the Egyptian Per-Bastet, “house of Bastet”, the city the Greeks called Bubastis. It stood in the eastern Nile Delta on the Pelusiac branch of the river and was the capital of the eighteenth nome of Lower Egypt. Its ruins are the mound of Tell Basta on the south-eastern edge of the city of Zagazig in the Sharqia governorate of Egypt. The city's goddess Bastet was shown as a cat or a cat-headed woman, and cats were brought there from all over Egypt to be buried."
    - "Ezekiel's oracles against Egypt foretell its conquest “by the hand of Nebuchadrezzar king of Babylon”, and run through the cities of the Delta and the Nile valley one by one: “The young men of Aven and of Pi-beseth shall fall by the sword: and these cities shall go into captivity.” Aven is On, Heliopolis, which lay to the south-west, near modern Cairo; the next verse names Tehaphnehes, a fortress on the eastern border. The Synodal Bible gives the Greek name, Bubastis, in place of Pi-beseth. This is the only mention of the city in the Bible."
    - "Herodotus describes the festival of Bubastis, to which, he was told, 700,000 men and women came by boat and at which more wine was drunk than in all the rest of the year, and the temple of Bastet in a hollow in the middle of the raised city, surrounded by two channels from the Nile. Bubastis was the home of the kings of the Twenty-second Dynasty, beginning with Shoshenq I, usually identified with Shishak, who came up against Jerusalem in the fifth year of Rehoboam; Osorkon II built a festival hall for his jubilee in the temple. Édouard Naville excavated the temple for the Egypt Exploration Fund in 1887–1889, and an Egyptian-German mission has worked at Tell Basta since 2008. Fallen granite blocks of the temple and an open-air museum are at the site today."
  ru:
    - "Бубаст (по-еврейски Пи-Бесет, по-египетски Пер-Бастет, «дом Бастет») — город, который греки называли Бубастисом. Он стоял в восточной Дельте Нила на Пелусийском рукаве реки и был столицей восемнадцатого нома Нижнего Египта. Его развалины — холм Телль-Баста на юго-восточной окраине города Загазиг в мухафазе Шаркия в Египте. Богиню города Бастет изображали кошкой или женщиной с головой кошки, и кошек со всего Египта привозили туда для погребения."
    - "Пророчества Иезекииля о Египте предвещают его завоевание «рукою Навуходоносора, царя Вавилонского» и проходят по городам Дельты и долины Нила один за другим: «Молодые люди Она и Бубаста падут от меча, а прочие пойдут в плен». Он — это Илиополь, лежавший к юго-западу, близ нынешнего Каира; следующий стих называет Тафнис, крепость на восточной границе. Синодальный перевод даёт вместо еврейского Пи-Бесет греческое имя Бубаст. Это единственное упоминание города в Библии."
    - "Геродот описывает праздник в Бубасте, на который, как ему сказали, приплывало 700 000 мужчин и женщин и на котором выпивали больше вина, чем за весь остальной год, и храм Бастет в низине посреди поднятого на насыпях города, окружённый двумя протоками из Нила. Бубаст был родиной царей XXII династии, начиная с Шешонка I, которого обычно отождествляют с Сусакимом, вышедшим против Иерусалима на пятом году царствования Ровоама; Осоркон II построил в храме зал для празднования своего юбилея. Эдуар Навиль раскапывал храм для Фонда исследования Египта в 1887–1889 гг., а с 2008 г. в Телль-Басте работает египетско-германская экспедиция. Сегодня на месте видны упавшие гранитные блоки храма и музей под открытым небом."
  uk:
    - "Бубаст, у єврейській формі Пі-Бесет, — це єгипетське Пер-Бастет, «дім Бастет», міста, яке греки називали Бубастіс. Воно стояло у східній частині дельти Нілу на Пелусійському рукаві річки й було столицею вісімнадцятого нома Нижнього Єгипту. Його руїни — пагорб Телль-Баста на південно-східному краю міста Загазіг у мухафазі Шаркія в Єгипті. Богиню міста Бастет зображали як кішку або жінку з головою кішки, і до міста привозили котів з усього Єгипту для поховання."
    - "Пророцтва Єзекіїля проти Єгипту віщують його підкорення «рукою Навуходонозоровою, царя Вавилонського» і одне за одним проходять міста дельти та долини Нілу: «Молодики в Онї й Пубастї поляжуть од меча, а останок пійде в неволю.» Авен — це Он, Геліополь, який лежав на південний захід, поблизу сучасного Каїра; наступний вірш називає Тафнис, фортецю на східному кордоні. Синодальна Біблія подає грецьку назву, Бубастіс, замість єврейського Пі-Бесет. Це єдина згадка про місто в Біблії."
    - "Геродот описує свято в Бубастісі, на яке, як йому казали, збиралося 700 000 чоловіків і жінок, що припливали на човнах, і на якому випивали більше вина, ніж за всю решту року, а також храм Бастет у заглибині посеред піднятого міста, оточений двома каналами від Нілу. Бубастіс був батьківщиною царів двадцять другої династії, починаючи з Шешонка I, якого зазвичай ототожнюють із Сусакімом, що виступив на Єрусалим на п'ятому році Ровоама; Осоркон II збудував у храмі святкову залу для свого ювілею. Едуар Навіль розкопував храм для Єгипетського дослідницького фонду 1887–1889 рр., а єгипетсько-німецька місія працює в Телль-Басті від 2008 р. Повалені гранітні блоки храму та музей просто неба є на місці й нині."
  es:
    - "Pi-beset es la forma hebrea del egipcio Per-Bastet, «casa de Bastet», la ciudad que los griegos llamaron Bubastis. Se alzaba en el Delta oriental del Nilo, sobre el brazo pelusíaco del río, y era la capital del nomo decimoctavo del Bajo Egipto. Sus ruinas son el montículo de Tell Basta, en el borde suroriental de la ciudad de Zagazig, en la gobernación de Sharqia, en Egipto. La diosa de la ciudad, Bastet, se representaba como una gata o una mujer con cabeza de gata, y allí se traían gatos de todo Egipto para enterrarlos."
    - "Los oráculos de Ezequiel contra Egipto anuncian su conquista «por mano de Nabucodonosor, rey de Babilonia», y recorren una a una las ciudades del Delta y del valle del Nilo: «Los mancebos de Avén y de Pibeseth caerán á cuchillo; y ellas irán en cautiverio». Avén es On, Heliópolis, situada al suroeste, cerca de la actual El Cairo; el versículo siguiente nombra Tafnes, una fortaleza de la frontera oriental. La Biblia sinodal da el nombre griego, Bubastis, en lugar de Pi-beset. Es la única mención de la ciudad en la Biblia."
    - "Heródoto describe la fiesta de Bubastis, a la que, según le dijeron, acudían en barco 700 000 hombres y mujeres y en la que se bebía más vino que en todo el resto del año, y el templo de Bastet en una hondonada en medio de la ciudad elevada, rodeado por dos canales del Nilo. Bubastis fue la patria de los reyes de la dinastía XXII, empezando por Sheshonq I, identificado por lo general con Sisac, que subió contra Jerusalén en el quinto año de Roboam; Osorkón II construyó en el templo una sala festiva para su jubileo. Édouard Naville excavó el templo para el Egypt Exploration Fund en 1887–1889, y una misión egipcio-alemana trabaja en Tell Basta desde 2008. Hoy se hallan en el lugar bloques de granito caídos del templo y un museo al aire libre."
  pt:
    - "Pi-Beset é a forma hebraica do egípcio Per-Bastet, “casa de Bastet”, a cidade que os gregos chamavam Bubástis. Ficava no leste do delta do Nilo, no ramo pelusíaco do rio, e era a capital do décimo oitavo nomo do Baixo Egito. Suas ruínas são o montículo de Tell Basta, na borda sudeste da cidade de Zagazig, na governadoria de Sharqia, no Egito. A deusa da cidade, Bastet, era representada como um gato ou uma mulher com cabeça de gato, e gatos eram levados para lá de todo o Egito para serem sepultados."
    - "Os oráculos de Ezequiel contra o Egito predizem sua conquista “pela mão de Nabucodonosor, rei da Babilônia”, e percorrem uma a uma as cidades do delta e do vale do Nilo: “Os jovens de Áven e de Pibesete cairão pela espada. Eles irão para o cativeiro.” Áven é On, Heliópolis, que ficava a sudoeste, perto do atual Cairo; o versículo seguinte menciona Tafnes, uma fortaleza na fronteira oriental. A Bíblia sinodal dá o nome grego, Bubástis, no lugar de Pi-Beset. Esta é a única menção da cidade na Bíblia."
    - "Heródoto descreve a festa de Bubástis, à qual, segundo lhe disseram, 700.000 homens e mulheres vinham de barco e na qual se bebia mais vinho do que em todo o resto do ano, e o templo de Bastet numa depressão no meio da cidade elevada, cercado por dois canais do Nilo. Bubástis foi o lar dos reis da XXII Dinastia, a começar por Sosenque I, geralmente identificado com Sisaque, que subiu contra Jerusalém no quinto ano de Roboão; Osorcon II construiu um salão de festival para o seu jubileu no templo. Édouard Naville escavou o templo para o Egypt Exploration Fund em 1887–1889, e uma missão egípcio-alemã trabalha em Tell Basta desde 2008. Blocos de granito caídos do templo e um museu a céu aberto estão hoje no local."
  de:
    - "Bubastis, hebräisch Pi-Beset, ist die griechische Form des ägyptischen Per-Bastet, „Haus der Bastet“. Die Stadt lag im östlichen Nildelta am Pelusischen Nilarm und war die Hauptstadt des achtzehnten unterägyptischen Gaus. Ihre Ruinen sind der Hügel Tell Basta am südöstlichen Rand der Stadt Zagazig im Gouvernement Scharkija in Ägypten. Die Göttin der Stadt, Bastet, wurde als Katze oder als katzenköpfige Frau dargestellt, und Katzen wurden aus ganz Ägypten dorthin gebracht, um bestattet zu werden."
    - "Hesekiels Sprüche gegen Ägypten kündigen seine Eroberung „durch Nebukadnezar, den König zu Babel“ an und gehen die Städte des Deltas und des Niltals eine nach der anderen durch: „Die junge Mannschaft zu On und Bubastus sollen durchs Schwert fallen und die Weiber gefangen weggeführt werden.“ Awen ist On, Heliopolis, das im Südwesten nahe dem heutigen Kairo lag; der nächste Vers nennt Tachpanhes, eine Festung an der Ostgrenze. Die Synodalbibel gibt anstelle von Pi-Beset den griechischen Namen Bubastis. Dies ist die einzige Erwähnung der Stadt in der Bibel."
    - "Herodot beschreibt das Fest von Bubastis, zu dem, wie ihm erzählt wurde, 700 000 Männer und Frauen zu Schiff kamen und bei dem mehr Wein getrunken wurde als im ganzen übrigen Jahr, und den Tempel der Bastet in einer Senke inmitten der erhöhten Stadt, von zwei Nilkanälen umgeben. Bubastis war die Heimat der Könige der 22. Dynastie, beginnend mit Scheschonq I., gewöhnlich mit Schischak gleichgesetzt, der im fünften Jahr Rehabeams gegen Jerusalem heraufzog; Osorkon II. baute für sein Jubiläum eine Festhalle im Tempel. Édouard Naville grub den Tempel 1887–1889 für den Egypt Exploration Fund aus, und seit 2008 arbeitet eine ägyptisch-deutsche Mission in Tell Basta. Umgestürzte Granitblöcke des Tempels und ein Freilichtmuseum befinden sich heute an der Stätte."
  fr:
    - "Pi-Beseth est la forme hébraïque de l’égyptien Per-Bastet, « maison de Bastet », la ville que les Grecs appelaient Bubastis. Elle se dressait dans l’est du delta du Nil, sur la branche pélusiaque du fleuve, et était la capitale du dix-huitième nome de Basse-Égypte. Ses ruines sont la butte de Tell Basta, à la lisière sud-est de la ville de Zagazig, dans le gouvernorat de Charqiya, en Égypte. La déesse de la ville, Bastet, était figurée en chat ou en femme à tête de chat, et l’on apportait des chats de toute l’Égypte pour les y enterrer."
    - "Les oracles d’Ézéchiel contre l’Égypte annoncent sa conquête « par la main de Nebucadnetsar, roi de Babylone » et passent en revue une à une les villes du Delta et de la vallée du Nil : « Les jeunes hommes d’On et de Pi-Béseth tomberont par l’épée, et ces villes iront en captivité. » Aven, que Louis Segond rend ici par On, est Héliopolis, qui se trouvait au sud-ouest, près du Caire actuel ; le verset suivant nomme Tachpanès, forteresse de la frontière orientale. La Bible synodale donne le nom grec, Bubastis, à la place de Pi-Beseth. C’est la seule mention de la ville dans la Bible."
    - "Hérodote décrit la fête de Bubastis, à laquelle, lui dit-on, venaient en bateau 700 000 hommes et femmes et où l’on buvait plus de vin que dans tout le reste de l’année, et le temple de Bastet dans une dépression au milieu de la ville surélevée, entouré de deux canaux issus du Nil. Bubastis fut la patrie des rois de la XXIIe dynastie, à commencer par Sheshonq Ier, d’ordinaire identifié à Schischak, qui monta contre Jérusalem la cinquième année de Roboam ; Osorkon II y bâtit pour son jubilé une salle des fêtes dans le temple. Édouard Naville fouilla le temple pour l’Egypt Exploration Fund en 1887–1889, et une mission égypto-allemande travaille à Tell Basta depuis 2008. Des blocs de granit tombés du temple et un musée de plein air se trouvent aujourd’hui sur le site."
  it:
    - "Pi-Beset è la forma ebraica dell’egizio Per-Bastet, «casa di Bastet», la città che i Greci chiamavano Bubasti. Sorgeva nel Delta orientale del Nilo sul ramo pelusiaco del fiume ed era la capitale del diciottesimo nomo del Basso Egitto. Le sue rovine sono il tell di Tell Basta sul margine sud-orientale della città di Zagazig, nel governatorato di Sharqiyya, in Egitto. La dea della città, Bastet, era raffigurata come un gatto o una donna con testa di gatto, e vi si portavano gatti da tutto l’Egitto per seppellirli."
    - "Gli oracoli di Ezechiele contro l’Egitto ne preannunciano la conquista «per mano di Nebucadnetsar, re di Babilonia», e percorrono una per una le città del Delta e della valle del Nilo: «I giovani di Aven e di Pibeseth cadranno per la spada, e queste città andranno in cattività». Aven è On, Eliopoli, che si trovava a sud-ovest, vicino all’odierno Cairo; il versetto seguente nomina Tafni, una fortezza sul confine orientale. La Bibbia sinodale dà il nome greco, Bubasti, al posto di Pi-Beset. È l’unica menzione della città nella Bibbia."
    - "Erodoto descrive la festa di Bubasti, alla quale, gli fu detto, giungevano in barca 700.000 uomini e donne e nella quale si beveva più vino che in tutto il resto dell’anno, e il tempio di Bastet in una conca al centro della città rialzata, circondato da due canali del Nilo. Bubasti fu la sede dei re della XXII dinastia, a cominciare da Sheshonq I, di solito identificato con Sisak, che salì contro Gerusalemme nel quinto anno di Roboamo; Osorkon II costruì nel tempio una sala delle feste per il suo giubileo. Édouard Naville scavò il tempio per conto dell’Egypt Exploration Fund nel 1887–1889, e una missione egizio-tedesca lavora a Tell Basta dal 2008. Blocchi di granito caduti del tempio e un museo all’aperto si trovano oggi nel sito."
  nl:
    - "Pi-Beseth is de Hebreeuwse vorm van het Egyptische Per-Bastet, ‘huis van Bastet’, de stad die de Grieken Bubastis noemden. Zij lag in de oostelijke Nijldelta aan de Pelusische tak van de rivier en was de hoofdstad van de achttiende nomos van Neder-Egypte. Haar ruïnes vormen de heuvel Tell Basta aan de zuidoostrand van de stad Zagazig in het gouvernement Sharqia in Egypte. De godin van de stad, Bastet, werd afgebeeld als een kat of een vrouw met een kattenkop, en katten werden uit heel Egypte daarheen gebracht om te worden begraven."
    - "Ezechiëls godsspraken tegen Egypte voorspellen de verovering ervan “door de hand van Nebukadrezar, den koning van Babel”, en lopen de steden van de Delta en de Nijlvallei een voor een af: “De jongelingen van Aven en Pibeseth zullen door het zwaard vallen, en de dochters zullen gaan in de gevangenis.” Awen is On, Heliopolis, dat ten zuidwesten lag, nabij het moderne Caïro; het volgende vers noemt Tachpanhes, een vesting aan de oostgrens. De Synodale Bijbel geeft de Griekse naam, Bubastis, in plaats van Pi-Beseth. Dit is de enige vermelding van de stad in de Bijbel."
    - "Herodotus beschrijft het feest van Bubastis, waarheen volgens zijn zeggenslieden 700.000 mannen en vrouwen per boot kwamen en waarbij meer wijn werd gedronken dan in de rest van het jaar, en de tempel van Bastet in een laagte midden in de verhoogde stad, omgeven door twee kanalen van de Nijl. Bubastis was de woonplaats van de koningen van de tweeëntwintigste dynastie, te beginnen met Sjosjenq I, gewoonlijk vereenzelvigd met Sisak, die in het vijfde jaar van Rehabeam tegen Jeruzalem optrok; Osorkon II liet in de tempel een feestzaal bouwen voor zijn jubileum. Édouard Naville groef de tempel op voor het Egypt Exploration Fund in 1887–1889, en een Egyptisch-Duitse missie werkt sinds 2008 te Tell Basta. Omgevallen granietblokken van de tempel en een openluchtmuseum bevinden zich nu op de plaats."
  pl:
    - "Pi-Beset to hebrajska forma egipskiego Per-Bastet, „domu Bastet”, miasta, które Grecy nazywali Bubastis. Leżało we wschodniej Delcie Nilu nad pelusyjskim ramieniem rzeki i było stolicą osiemnastego nomu Dolnego Egiptu. Jego ruiny to wzgórze Tell Basta na południowo-wschodnim skraju miasta Zakazik w muhafazie Szarkijja w Egipcie. Bogini miasta, Bastet, przedstawiana była jako kot lub kobieta z głową kota, a koty sprowadzano tam z całego Egiptu, by je pochować."
    - "Wyrocznie Ezechiela przeciw Egiptowi zapowiadają jego podbój „przez rękę Nabuchodonozora, króla Babilońskiego” i przechodzą po kolei przez miasta Delty i doliny Nilu: „Młodzieńcy miasta On i Bubasto od miecza polegną, a panny w pojmanie pójdą”. Miasto On, hebrajskie Awen, to Heliopolis, leżące na południowy zachód, w pobliżu dzisiejszego Kairu; następny werset wymienia Tachpanches, twierdzę na wschodniej granicy. Biblia synodalna podaje zamiast Pi-Beset greckie imię, Bubastis. Jest to jedyna wzmianka o tym mieście w Biblii."
    - "Herodot opisuje święto w Bubastis, na które, jak mu powiedziano, przybywało łodziami 700 000 mężczyzn i kobiet i na którym wypijano więcej wina niż w całym pozostałym roku, oraz świątynię Bastet w zagłębieniu pośrodku wyniesionego miasta, otoczoną dwoma kanałami z Nilu. Bubastis było domem królów XXII dynastii, począwszy od Szeszonka I, zwykle utożsamianego z Sziszakiem, który wystąpił przeciw Jerozolimie w piątym roku Roboama; Osorkon II wzniósł w świątyni salę festiwalową na swój jubileusz. Édouard Naville badał świątynię dla Egypt Exploration Fund w latach 1887-1889, a egipsko-niemiecka misja pracuje w Tell Basta od 2008 roku. Dziś na stanowisku znajdują się leżące granitowe bloki świątyni i muzeum na wolnym powietrzu."
  cs:
    - "Pí-beset je hebrejská podoba egyptského Per-Bastet, „dům Bastet“, města, které Řekové nazývali Bubastis. Leželo ve východní deltě Nilu na pelúsijském rameni řeky a bylo hlavním městem osmnáctého nomu Dolního Egypta. Jeho zbytky tvoří pahorek Tell Basta na jihovýchodním okraji města Zakazík v guvernorátu Šarkíja v Egyptě. Bohyně města Bastet byla zobrazována jako kočka nebo žena s hlavou kočky a kočky sem byly z celého Egypta přiváženy k pohřbu."
    - "Ezechielova proroctví proti Egyptu předpovídají jeho dobytí „skrze ruku Nabuchodonozora krále Babylonského“ a procházejí města Delty a nilského údolí jedno po druhém: mládenci z Avenu a Pí-beseta padnou mečem a tato města půjdou do zajetí. Aven je On, Héliopolis, který ležel na jihozápadě, poblíž dnešní Káhiry; další verš jmenuje Tachpanchés, pevnost na východní hranici. Synodální Bible dává místo Pí-beseta řecké jméno Bubastis. Je to jediná zmínka o městě v Bibli."
    - "Hérodotos popisuje slavnost v Bubastidě, na niž prý přicházelo na lodích 700 000 mužů a žen a při níž se vypilo více vína než za celý zbytek roku, a chrám Bastet v prohlubni uprostřed vyvýšeného města, obklopený dvěma kanály z Nilu. Bubastis byla domovem králů dvacáté druhé dynastie, počínaje Šošenkem I., obvykle ztotožňovaným se Šíšakem, který v pátém roce Rechabeámově vytáhl proti Jeruzalému; Osorkon II. postavil v chrámu slavnostní síň pro svůj jubileus. Édouard Naville chrám zkoumal pro Egypt Exploration Fund v letech 1887–1889 a egyptsko-německá mise zde pracuje od roku 2008. Padlé žulové bloky chrámu a muzeum pod širým nebem jsou dnes na místě."
  sv:
    - "Pi-Beset är den hebreiska formen av egyptiska Per-Bastet, ”Bastets hus”, staden som grekerna kallade Bubastis. Den låg i östra Nildeltat vid den pelusiska grenen av floden och var huvudstad i det artonde nomen i Nedre Egypten. Dess ruiner är kullen Tell Basta i sydöstra utkanten av staden Zagazig i guvernementet Sharqia i Egypten. Stadens gudinna Bastet avbildades som en katt eller en kvinna med kattas huvud, och katter fördes dit från hela Egypten för att begravas."
    - "Hesekiels orakel mot Egypten förutsäger dess erövring ”genom Nebukadressar, konungen i Babel”, och går igenom städerna i deltat och Nildalen en efter en: ”Avens och Pi-Besets unga män skola falla för svärd, och själva skola de vandra bort i fångenskap.” Aven är On, Heliopolis, som låg i sydväst, nära nuvarande Kairo; nästa vers nämner Tehafnehes, en fästning vid östgränsen. Den synodala bibeln anger det grekiska namnet, Bubastis, i stället för Pi-Beset. Detta är den enda omnämningen av staden i Bibeln."
    - "Herodotos beskriver festen i Bubastis, dit, fick han veta, 700 000 män och kvinnor kom med båt och där mer vin dracks än under hela resten av året, samt Bastets tempel i en sänka mitt i den upphöjda staden, omgivet av två kanaler från Nilen. Bubastis var hemort för kungarna av tjugoandra dynastin, med början i Shoshenq I, vanligen identifierad med Shishak, som drog upp mot Jerusalem i Rehabeams femte år; Osorkon II lät bygga en festhall för sitt jubileum i templet. Édouard Naville grävde ut templet för Egypt Exploration Fund 1887–1889, och en egyptisk-tysk mission har arbetat vid Tell Basta sedan 2008. Nedfallna granitblock från templet och ett friluftsmuseum finns på platsen i dag."
  nb:
    - "Pi-Beset er den hebraiske formen av det egyptiske Per-Bastet, «Bastets hus», byen grekerne kalte Bubastis. Den lå i det østlige Nildeltaet ved den pelusiske armen av elven og var hovedstad i den attende nomos i Nedre Egypt. Ruinene er haugen Tell Basta ved sørøstkanten av byen Zagazig i det egyptiske guvernementet Sharqia. Byens gudinne Bastet ble framstilt som en katt eller en kvinne med kattehode, og katter ble brakt dit fra hele Egypt for å gravlegges."
    - "Esekiels orakler mot Egypt forutsier erobringen «ved Nebukadnesar, Babels konge», og går gjennom byene i Deltaet og Nildalen én for én: «Avens og Pibesets unge menn skal falle for sverdet, og de selv skal gå i fangenskap.» Aven er On, Heliopolis, som lå mot sørvest, nær dagens Kairo; det neste verset nevner Tehafnehes, en festning på østgrensen. Den synodale bibelen har det greske navnet, Bubastis, i stedet for Pi-Beset. Dette er den eneste omtalen av byen i Bibelen."
    - "Herodot beskriver festen i Bubastis, som, fikk han vite, 700 000 menn og kvinner kom til med båt og der det ble drukket mer vin enn i hele resten av året, og Bastets tempel i en forsenkning midt i den hevede byen, omgitt av to kanaler fra Nilen. Bubastis var hjemstedet til kongene i 22. dynasti, med Sjosjenk I først, vanligvis identifisert med Sjisjak, som drog opp mot Jerusalem i Rehabeams femte år; Osorkon II bygde en festhall til sitt jubileum i tempelet. Édouard Naville gravde ut tempelet for Egypt Exploration Fund i 1887–1889, og en egyptisk-tysk misjon har arbeidet ved Tell Basta siden 2008. Falne granittblokker fra tempelet og et friluftsmuseum finnes på stedet i dag."
  tl:
    - "Ang Pi-beseth ay ang anyong Hebreo ng Egipcio na Per-Bastet, “bahay ni Bastet”, ang lungsod na tinawag ng mga Griyego na Bubastis. Nakatayo ito sa silangang Delta ng Nilo sa sangang Pelusiaco ng ilog at kabisera ng ika-18 nome ng Mababang Egipto. Ang mga guho nito ay ang burol ng Tell Basta sa timog-silangang gilid ng lungsod ng Zagazig sa gobernorato ng Sharqia ng Egipto. Ang diyosa ng lungsod na si Bastet ay ipinapakitang isang pusa o babaing may ulo ng pusa, at dinadala roon ang mga pusa mula sa buong Egipto upang ilibing."
    - "Inihuhula ng mga orakulo ni Ezekiel laban sa Egipto ang pagsakop dito “sa pamamagitan ni Nabucodonosor na hari sa Babilonia”, at nilalakbay ang mga lungsod ng Delta at ng libis ng Nilo nang isa-isa: “Ang mga binata sa Aven at sa Pi-beseth ay mangabubuwal sa pamamagitan ng tabak; at ang mga ito ay magsisipasok sa pagkabihag.” Ang Aven ay On, Heliopolis, na nasa timog-kanluran, malapit sa makabagong Cairo; ang sumunod na talata ay nagngangalan ng Taphnes, isang kuta sa silangang hangganan. Ibinibigay ng Bibliyang Sinodal ang pangalang Griyego, Bubastis, kapalit ng Pi-beseth. Ito lamang ang pagbanggit sa lungsod sa Bibliya."
    - "Inilalarawan ni Herodotus ang pista ng Bubastis, na ayon sa sinabi sa kaniya ay dinaluhan ng 700,000 lalaki at babae sa pamamagitan ng bangka at kung saan mas maraming alak ang nainom kaysa sa buong natitirang taon, at ang templo ni Bastet sa isang lubak sa gitna ng nakataas na lungsod, na napapalibutan ng dalawang daluyan mula sa Nilo. Ang Bubastis ang tahanan ng mga hari ng Ika-22 Dinastiya, simula kay Shoshenq I, na karaniwang kinikilalang Sisac, na umahon laban sa Jerusalem sa ikalimang taon ni Roboam; nagtayo si Osorkon II ng bulwagan ng pista para sa kaniyang jubileo sa templo. Hinukay ni Édouard Naville ang templo para sa Egypt Exploration Fund noong 1887–1889, at isang misyong Egipcio-Aleman ang gumagawa sa Tell Basta mula 2008. Ang mga nabuwal na bloke ng granito ng templo at isang open-air museum ay nasa lugar ngayon."
  da:
    - "Pi-Beset er den hebraiske form af det egyptiske Per-Bastet, »Bastets hus«, byen, grækerne kaldte Bubastis. Den lå i det østlige Nildelta ved den pelusiske flodarm og var hovedstad i Nedre Egyptens attende nomos. Dens ruiner er højen Tell Basta i den sydøstlige udkant af byen Zagazig i det egyptiske guvernement Sharqia. Byens gudinde Bastet blev vist som en kat eller en kattehovedet kvinde, og katte blev bragt dertil fra hele Egypten for at blive begravet."
    - "Ezekiels udsagn mod Egypten forudsiger dets erobring »ved Nebukadnezars, Kongen af Babels, Haand« og løber byerne i Deltaet og Nildalen igennem én for én: »De unge Karle i Aven og Pibeset skulle falde for Sværdet, og de selv skulle gaa i Fangenskab.« Aven er On, Heliopolis, som lå mod sydvest, nær nutidens Kairo; det næste vers nævner Takpanes, en fæstning ved den østlige grænse. Den synodale bibel giver det græske navn, Bubastis, i stedet for Pi-Beset. Det er det eneste sted i Bibelen, hvor byen nævnes."
    - "Herodot beskriver festen i Bubastis, hvortil der ifølge hans oplysninger kom 700.000 mænd og kvinder i båd, og hvor der blev drukket mere vin end i hele resten af året, og Bastets tempel i en lavning midt i den hævede by, omgivet af to kanaler fra Nilen. Bubastis var hjemsted for kongerne af 22. dynasti, begyndende med Sjosjenk 1., sædvanligvis identificeret med Sjisjak, som drog op mod Jerusalem i Rehabeams femte år; Osorkon 2. byggede en festhal til sit jubilæum i templet. Édouard Naville udgravede templet for Egypt Exploration Fund i 1887–1889, og en egyptisk-tysk mission har arbejdet i Tell Basta siden 2008. Nedfaldne granitblokke fra templet og et frilandsmuseum ligger i dag på stedet."
