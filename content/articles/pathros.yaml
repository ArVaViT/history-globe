body:
  en:
    - "Pathros is Upper Egypt, the long Nile valley south of Memphis up to the First Cataract at Syene (Aswan), with Thebes as its old capital. The name is Egyptian, pa-ta-resi, “the southern land”, and Assyrian kings used it too: after conquering Egypt in 671 BC Esarhaddon called himself king of Musur, Paturisi and Kusi, that is Lower Egypt, Upper Egypt and Nubia. In the table of nations the Pathrusim are among the sons of Mizraim."
    - "The prophets name it with Egypt and Cush. Isaiah promises the Lord will recover his remnant “from Assyria, and from Egypt, and from Pathros, and from Cush”. Jeremiah, carried to Egypt after the murder of Gedaliah, addressed “all the Jews which dwell in the land of Egypt, which dwell at Migdol, and at Tahpanhes, and at Noph, and in the country of Pathros”, and it was “all the people that dwelt in the land of Egypt, in Pathros” who answered that they would go on burning incense to the queen of heaven. Ezekiel foretold that Egypt would be brought back “into the land of Pathros, into the land of their habitation”, a base kingdom, and that Pathros would be made desolate with Zoan and No."
    - "Ezekiel's phrase fits the fact that Egyptian kingship began in the south, at Hierakonpolis and Abydos. Jews in Pathros are known from the Aramaic papyri of Elephantine, the island at Syene, where a Jewish garrison with a temple of its own served the Persian kings in the fifth century BC; the priests of Khnum destroyed the temple in 410, and the community petitioned Jerusalem and Samaria to have it rebuilt. The settlement may go back to the days of Jeremiah's refugees or earlier, since Herodotus says Psammetichus already kept a garrison at Elephantine."
    - "Today Pathros is the Sa'id, the Upper Egypt of the governorates from Beni Suef to Aswan, with Luxor on the site of Thebes; its people are the Sa'idis, and the Nile still ties it together."
  ru:
    - "Пафрос — Верхний Египет, длинная долина Нила к югу от Мемфиса до первого порога у Сиены (Асуана), со старой столицей в Фивах. Имя египетское, па-та-реси, «южная земля», и ассирийские цари тоже им пользовались: завоевав Египет в 671 г. до н. э., Асардан назвал себя царём Мусура, Патуриси и Куси, то есть Нижнего Египта, Верхнего Египта и Нубии. В таблице народов Патрусим стоят среди сынов Мицраима."
    - "Пророки называют его рядом с Египтом и Хусом. Исаия обещает, что Господь возвратит Себе остаток народа, «какой останется у Ассура, и в Египте, и в Патросе, и у Хуса». Иеремии, уведённому в Египет после убийства Годолии, было слово «о всех Иудеях, живущих в земле Египетской, поселившихся в Магдоле и Тафнисе, и в Нофе, и в земле Пафрос», и именно «весь народ, живший в земле Египетской, в Пафросе» отвечал, что будет и дальше кадить богине неба. Иезекииль предрёк, что Египет вернут «в землю Пафрос, в землю происхождения их», царством слабым, и что Пафрос будет опустошён вместе с Цоаном и Но."
    - "Слова Иезекииля отвечают тому, что египетская царская власть началась на юге, в Иераконполе и Абидосе. Иудеи в Пафросе известны по арамейским папирусам с Элефантины, острова у Сиены, где иудейский гарнизон с собственным храмом служил персидским царям в V веке до н. э.; жрецы Хнума разрушили храм в 410 году, и община просила Иерусалим и Самарию помочь его восстановить. Поселение, возможно, восходит ко временам беглецов Иеремии или ещё раньше, ведь Геродот говорит, что уже Псамметих держал гарнизон на Элефантине."
    - "Сегодня Пафрос — это Саид, Верхний Египет провинций от Бени-Суэфа до Асуана, с Луксором на месте Фив; его жители — саиди, и Нил по-прежнему связывает его воедино."
  uk:
    - "Патрос — це Верхній Єгипет, довга долина Нілу на південь від Мемфіса до першого порогу в Сієні (Асуан), зі стародавньою столицею Фіви. Назва єгипетська, па-та-ресі, «південна земля», і нею користувалися також ассирійські царі: після завоювання Єгипту 671 р. до н. е. Асархаддон назвав себе царем Мусуру, Патурісі та Куші, тобто Нижнього Єгипту, Верхнього Єгипту й Нубії. У таблиці народів патрусіми — серед синів Міцраїма."
    - "Пророки називають його разом із Єгиптом і Кушем. Ісая обіцяє, що Господь поверне свій залишок «від Ассура, із Египту, з Патросу, й з Кушу». Єремія, якого після вбивства Гедалії було відведено до Єгипту, звернувся до «всїх Юдеїв, що пробували в Египтї, та поосїдали в Магдолї й у Тафнисї й у Нофі й у країнї Патросї», і саме «ввесь люд, що жив у Египтї, в Патросї» відповів, що й надалі кадитиме цариці небесній. Єзекіїль провіщав, що Єгипет буде повернений до Патроса: «приведу їх назад у землю Патрос, у країну, звідки вони взялись», і буде там «царством невеличким», а Патрос буде спустошений разом із Цоаном та Но."
    - "Вислів Єзекіїля узгоджується з тим, що єгипетське царство почалося на півдні, у Гієраконполі й Абідосі. Євреї в Патросі відомі з арамейських папірусів Елефантини, острова біля Сієни, де юдейський гарнізон із власним храмом служив перським царям у V ст. до н. е.; жерці Хнума зруйнували храм 410 року, і громада звернулася до Єрусалима та Самарії з проханням допомогти його відбудувати. Поселення могло сягати часів утікачів Єремії або й раніше, бо Геродот каже, що Псамметіх уже тримав гарнізон в Елефантині."
    - "Нині Патрос — це Саїд, Верхній Єгипет з губернаторствами від Бані-Свейф до Асуана, з Луксором на місці Фів; його мешканці — саїди, і Ніл досі пов’язує його воєдино."
  es:
    - "Patros es el Alto Egipto, el largo valle del Nilo al sur de Menfis hasta la primera catarata en Sevene (Asuán), con Tebas como antigua capital. El nombre es egipcio, pa-ta-resi, «la tierra del sur», y los reyes asirios lo usaron también: tras conquistar Egipto en 671 a. C., Esar-hadón se llamó rey de Musur, Paturisi y Kusi, es decir, el Bajo Egipto, el Alto Egipto y Nubia. En la tabla de las naciones, los patrusim figuran entre los hijos de Mizraim."
    - "Los profetas lo nombran junto con Egipto y Cus. Isaías promete que el Señor recobrará el remanente de su pueblo de Asiria, de Egipto, de Patros y de Cus. Jeremías, llevado a Egipto tras el asesinato de Gedalías, se dirigió a «todos los Judíos que moraban en la tierra de Egipto, que moraban en Migdol, y en Taphnes, y en Noph, y en tierra de Pathros», y fue «todo el pueblo que habitaba en tierra de Egipto, en Pathros» el que respondió que seguirían quemando incienso a la reina del cielo. Ezequiel anunció que Egipto sería devuelto «á la tierra de Patros, á la tierra de su habitación», un reino bajo, y que Patros sería asolada junto con Zoán y No."
    - "La expresión de Ezequiel concuerda con el hecho de que la realeza egipcia comenzó en el sur, en Hieracómpolis y Abidos. Se conocen judíos en Patros por los papiros arameos de Elefantina, la isla de Sevene, donde una guarnición judía con un templo propio sirvió a los reyes persas en el siglo V a. C.; los sacerdotes de Jnum destruyeron el templo en 410, y la comunidad pidió a Jerusalén y a Samaria que se reconstruyera. El asentamiento puede remontarse a los refugiados de Jeremías o a una época anterior, pues Heródoto dice que Psamético ya mantenía una guarnición en Elefantina."
    - "Hoy Patros es el Saíd, el Alto Egipto de las gobernaciones desde Beni Suef hasta Asuán, con Luxor en el emplazamiento de Tebas; su gente son los saídíes, y el Nilo sigue uniéndola."
  pt:
    - "Patros é o Alto Egito, o longo vale do Nilo ao sul de Mênfis até a Primeira Catarata em Sevene (Assuã), com Tebas como antiga capital. O nome é egípcio, pa-ta-resi, “a terra do sul”, e os reis assírios também o usaram: depois de conquistar o Egito em 671 a.C., Esar-Hadom chamou-se rei de Musur, Paturisi e Kusi, isto é, Baixo Egito, Alto Egito e Núbia. Na Tábua das Nações os patrusim estão entre os filhos de Mizraim."
    - "Os profetas a nomeiam com o Egito e Cuxe. Isaías promete que o Senhor recuperará seu remanescente “da Assíria, do Egito, de Patros, de Cuxe”. Jeremias, levado ao Egito depois do assassinato de Gedalias, falou a “todos os judeus que moravam na terra do Egito, que moravam em Migdol, em Tafnes, em Mênfis e na região de Patros”, e foi “todo o povo que morava na terra do Egito, em Patros” que respondeu que continuaria a queimar incenso à rainha do céu. Ezequiel predisse que o Egito seria trazido de volta “à terra de Patros, à terra do seu nascimento”, onde seria “um reino humilde”, e que Patros seria deixada desolada com Zoã e Nô."
    - "A expressão de Ezequiel combina com o fato de que a realeza egípcia começou no sul, em Hierakômpolis e Abidos. Judeus em Patros são conhecidos pelos papiros aramaicos de Elefantina, a ilha de Sevene, onde uma guarnição judaica com templo próprio serviu aos reis persas no século V a.C.; os sacerdotes de Khnum destruíram o templo em 410, e a comunidade pediu a Jerusalém e a Samaria que o reconstruíssem. O assentamento pode remontar aos refugiados de Jeremias ou ser anterior, pois Heródoto diz que Psamético já mantinha uma guarnição em Elefantina."
    - "Hoje Patros é o Sa'id, o Alto Egito das províncias de Beni Suef a Assuã, com Luxor no lugar de Tebas; seus habitantes são os sa'idis, e o Nilo ainda os une."
  de:
    - "Patros ist Oberägypten, das lange Niltal südlich von Memphis bis zum Ersten Katarakt bei Syene (Assuan), mit Theben als alter Hauptstadt. Der Name ist ägyptisch, pa-ta-resi, „das südliche Land“, und auch assyrische Könige gebrauchten ihn: Nach der Eroberung Ägyptens 671 v. Chr. nannte sich Asarhaddon König von Musur, Paturisi und Kusi, also Unterägypten, Oberägypten und Nubien. In der Völkertafel gehören die Patrositer zu den Söhnen des Mizrajim."
    - "Die Propheten nennen es zusammen mit Ägypten und Kusch. Jesaja verheißt, der Herr werde sein übriges Volk erwerben, „so übriggeblieben von Assur, Ägypten, Pathros“, und aus Kusch. Jeremia, nach der Ermordung Gedaljas nach Ägypten gebracht, sprach „an alle Juden, so in Ägyptenland wohnten, nämlich so zu Migdol, zu Thachpanhes, zu Noph und im Lande Pathros wohnten“, und es war „allem Volk, die in Ägyptenland wohnten und in Pathros“, dass sie antworteten, sie wollten der Himmelskönigin weiter räuchern. Hesekiel kündigte an, Ägypten werde „ins Land Pathros“ gebracht, „welches ihr Vaterland ist“, und sei dort „ein kleines Königreich“, und Patros werde mit Zoan und No verwüstet."
    - "Hesekiels Wendung passt dazu, dass das ägyptische Königtum im Süden begann, in Hierakonpolis und Abydos. Juden in Patros sind aus den aramäischen Papyri von Elephantine bekannt, der Insel bei Syene, wo eine jüdische Garnison mit eigenem Tempel im 5. Jahrhundert v. Chr. den persischen Königen diente; die Priester des Chnum zerstörten den Tempel 410, und die Gemeinde bat Jerusalem und Samaria um Hilfe beim Wiederaufbau. Die Siedlung mag auf die Flüchtlinge Jeremias oder früher zurückgehen, da Herodot sagt, schon Psammetich habe in Elephantine eine Garnison unterhalten."
    - "Heute ist Patros der Saʿid, das Oberägypten der Gouvernements von Beni Suef bis Assuan, mit Luxor an der Stelle Thebens; seine Bewohner sind die Saʿidis, und der Nil hält es noch immer zusammen."
  fr:
    - "Pathros est la Haute-Égypte, la longue vallée du Nil au sud de Memphis jusqu’à la première cataracte à Syène (Assouan), avec Thèbes pour ancienne capitale. Le nom est égyptien, pa-ta-resi, « le pays du sud », et les rois assyriens l’employaient aussi : après la conquête de l’Égypte en 671 av. J.-C., Esar-Haddon se dit roi de Musur, de Paturisi et de Kusi, c’est-à-dire de la Basse-Égypte, de la Haute-Égypte et de la Nubie. Dans le tableau des nations, les Patrusim sont parmi les fils de Mitsraïm."
    - "Les prophètes la nomment avec l’Égypte et Cusch. Ésaïe promet que le Seigneur rachètera le reste de son peuple « dispersé en Assyrie et en Égypte, à Pathros et en Éthiopie ». Jérémie, emmené en Égypte après le meurtre de Guedalia, s’adressa à « tous les Juifs demeurant au pays d’Égypte, demeurant à Migdol, à Tachpanès, à Noph et au pays de Pathros », et c’est « tout le peuple qui demeurait au pays d’Égypte, à Pathros » qui répondit qu’il continuerait à brûler de l’encens à la reine du ciel. Ézéchiel annonça que l’Égypte serait ramenée « dans le pays de Pathros, dans le pays de leur origine », royaume faible, et que Pathros serait dévastée avec Tsoan et No."
    - "L’expression d’Ézéchiel s’accorde avec le fait que la royauté égyptienne naquit dans le sud, à Hiéraconpolis et à Abydos. Des Juifs de Pathros sont connus par les papyrus araméens d’Éléphantine, l’île de Syène, où une garnison juive dotée de son propre temple servit les rois perses au Ve siècle av. J.-C. ; les prêtres de Khnoum détruisirent le temple en 410, et la communauté pétitionna Jérusalem et Samarie pour le faire rebâtir. L’implantation peut remonter aux réfugiés de Jérémie ou plus tôt, car Hérodote dit que Psammétique entretenait déjà une garnison à Éléphantine."
    - "Aujourd’hui, Pathros est le Saïd, la Haute-Égypte des gouvernorats de Beni Suef à Assouan, avec Louxor sur le site de Thèbes ; ses habitants sont les Saïdis, et le Nil la relie encore."
  it:
    - "Patros è l’Alto Egitto, la lunga valle del Nilo a sud di Menfi fino alla Prima Cataratta a Siene (Assuan), con Tebe come antica capitale. Il nome è egizio, pa-ta-resi, «la terra del sud», e fu usato anche dai re assiri: dopo aver conquistato l’Egitto nel 671 a.C. Assaraddon si dichiarò re di Musur, Paturisi e Kusi, cioè Basso Egitto, Alto Egitto e Nubia. Nella tavola delle nazioni i Pathrusim sono tra i figli di Misraim."
    - "I profeti la nominano con l’Egitto e Cus. Isaia promette che il Signore stenderà la mano «per riscattare il residuo del suo popolo rimasto in Assiria e in Egitto, a Pathros e in Etiopia». Geremia, portato in Egitto dopo l’assassinio di Godolia, si rivolse a «tutti i Giudei che dimoravano nel paese di Egitto, che dimoravano a Migdol, a Tahpanes, a Nof e nel paese di Pathros», e fu «tutto il popolo che dimorava nel paese d’Egitto a Pathros» a rispondere che avrebbero continuato a bruciare incenso alla regina del cielo. Ezechiele predisse che gli Egiziani sarebbero stati ricondotti «nel paese di Patros, nel loro paese natìo», «un umile regno», e che Patros sarebbe stata resa deserta insieme a Tanis e a No."
    - "L’espressione di Ezechiele si accorda con il fatto che la regalità egizia ebbe inizio nel sud, a Ieracompoli e ad Abido. Ebrei a Patros sono noti dai papiri aramaici di Elefantina, l’isola di Siene, dove una guarnigione ebraica con un tempio proprio servì i re persiani nel V secolo a.C.; i sacerdoti di Khnum distrussero il tempio nel 410, e la comunità si rivolse a Gerusalemme e alla Samaria per farlo ricostruire. L’insediamento può risalire ai profughi di Geremia o a prima, dato che Erodoto dice che Psammetico teneva già una guarnigione a Elefantina."
    - "Oggi Patros è il Sa’id, l’Alto Egitto dei governatorati da Beni Suef ad Assuan, con Luxor sul sito di Tebe; i suoi abitanti sono i Sa’idi, e il Nilo ancora lo tiene unito."
  pl:
    - "Patros to Górny Egipt, długa dolina Nilu na południe od Memfis aż do Pierwszej Katarakty w Syene (Asuan), ze starą stolicą w No. Nazwa jest egipska, pa-ta-resi, „kraj południowy”, i używali jej także królowie asyryjscy: po podboju Egiptu w 671 roku p.n.e. Asarhaddon nazwał się królem Musur, Paturisi i Kusi, to znaczy Dolnego Egiptu, Górnego Egiptu i Nubii. W tablicy narodów Patrusyci należą do synów Misraima."
    - "Prorocy wymieniają go razem z Egiptem i Kuszem. Izajasz obiecuje, że Pan odzyska swój ostatek „od Assyryjczyków i od Egiptu, i od Patros, i od Chus”. Jeremiasz, uprowadzony do Egiptu po zamordowaniu Gedaliasza, otrzymał słowo „o wszystkich Żydach, którzy mieszkali w ziemi Egipskiej, którzy mieszkali w Migdolu, i w Tachpanches, i w Nof, i w ziemi Patros”, a odpowiedział mu „wszystek lud, który mieszkał w ziemi Egipskiej w Patros”, że nadal będą palić kadzidło królowej niebios. Ezechiel zapowiedział, że Egipt zostanie przywrócony: „i przywiodę ich do ziemi Patros, do ziemi mieszkania ich, i będą tam królestwem podłem”, a Patros zostanie spustoszone wraz z Soan i No."
    - "Wyrażenie Ezechiela pasuje do faktu, że egipskie królestwo zaczęło się na południu, w Hierakonpolis i Abydos. Żydów w Patros znamy z aramejskich papirusów z Elefantyny, wyspy przy Syene, gdzie żydowski garnizon z własną świątynią służył królom perskim w V wieku p.n.e.; kapłani Chnuma zniszczyli świątynię w 410 roku, a wspólnota prosiła Jerozolimę i Samarię o jej odbudowę. Osada może sięgać czasów uchodźców Jeremiasza lub wcześniejszych, skoro Herodot mówi, że Psametyk trzymał już garnizon w Elefantynie."
    - "Dziś Patros to Said, Górny Egipt prowincji od Bani Suwajf do Asuanu, z Luksorem na miejscu No; jego mieszkańcy to Saidzi, a Nil nadal go spaja."
  cs:
    - "Patros je Horní Egypt, dlouhé nilské údolí jižně od Memfidy až k prvnímu kataraktu u Syeny (Asuánu), s Thébami jako starým hlavním městem. Jméno je egyptské, pa-ta-resi, „jižní země“, a užívali je i asyrští králové: po dobytí Egypta roku 671 př. n. l. se Asarhadón nazýval králem Musuru, Paturisi a Kusi, tedy Dolního Egypta, Horního Egypta a Núbie. V tabulce národů jsou Patrusim mezi syny Misraimovými."
    - "Proroci jej jmenují spolu s Egyptem a Kúšem. Izajáš slibuje, že Hospodin shledá ostatky svého lidu, „od Assura, a od Egypta, a od Patros, a od Chus“. Jeremjáš, odvedený do Egypta po zavraždění Gedaljáše, oslovil „všechněm Judským bydlícím v zemi Egyptské, kteříž bydlili v Magdol a v Tachpanches, a v Nof, a v zemi Patros“, a byl to „všecken lid přebývající v zemi Egyptské v Patros“, kdo odpověděl, že budou dál pálit kadidlo královně nebes. Ezechiel předpověděl, že Egypt bude uveden zase „do země Patros, do země přebývání jejich“, jako snížené království, a že Patros bude s Coanem a Nem zpustošen."
    - "Ezechielův výraz odpovídá tomu, že egyptské království vzniklo na jihu, v Hierakonpoli a Abydu. Židé v Patrosu jsou známi z aramejských papyrů z Elefantiny, ostrova u Syeny, kde židovská posádka s vlastním chrámem sloužila perským králům v 5. století př. n. l.; kněží Chnuma chrám roku 410 zničili a obec žádala Jeruzalém a Samaří o jeho obnovu. Osada může sahat do dnů Jeremjášových uprchlíků nebo dál, neboť Hérodotos praví, že Psammetichos držel posádku na Elefantině již dříve."
    - "Dnes je Patros Sa'íd, Horní Egypt guvernorátů od Bani Suvajfu po Asuán, s Luxorem na místě Théb; jeho obyvatelé jsou Sa'ídové a Nil jej stále drží pohromadě."
  nl:
    - "Patros is Opper-Egypte, de lange Nijlvallei ten zuiden van Memfis tot de Eerste Cataract bij Syene (Aswan), met Thebe als oude hoofdstad. De naam is Egyptisch, pa-ta-resi, “het zuidelijke land”, en Assyrische koningen gebruikten hem ook: na de verovering van Egypte in 671 v.Chr. noemde Esarhaddon zich koning van Musur, Paturisi en Kusi, dat wil zeggen Neder-Egypte, Opper-Egypte en Nubië. In de volkerentafel behoren de Patrusim tot de zonen van Mizraïm."
    - "De profeten noemen het met Egypte en Kus. Jesaja belooft dat de HEER zijn overblijfsel zal terugwinnen “van Assyrië, en van Egypte, en van Pathros, en van Morenland”. Jeremia, na de moord op Gedalja naar Egypte meegevoerd, richtte zich tot “al de Joden, die in Egypteland woonden, die te Migdol woonden, en te Tachpanhes, en te Nof, en in het land Pathros”, en het was “al het volk, die in Egypteland, in Pathros, woonde” dat antwoordde dat het wierook bleef branden voor de koningin des hemels. Ezechiël voorspelde dat Egypte zou worden teruggebracht “in het land van Pathros, in het land huns koophandels”, als een nederig koninkrijk, en dat Pathros met Zoan en No verwoest zou worden."
    - "Ezechiëls uitdrukking past bij het feit dat het Egyptische koningschap in het zuiden begon, bij Hierakonpolis en Abydos. Joden in Patros zijn bekend uit de Aramese papyri van Elefantine, het eiland bij Syene, waar een Joodse garnizoen met een eigen tempel in de 5e eeuw v.Chr. de Perzische koningen diende; de priesters van Chnoem verwoestten de tempel in 410, en de gemeenschap vroeg Jeruzalem en Samaria om herbouw. De nederzetting gaat misschien terug op de dagen van Jeremia’s vluchtelingen of eerder, want Herodotus zegt dat Psammetichos al een garnizoen op Elefantine hield."
    - "Tegenwoordig is Patros de Sa’id, het Opper-Egypte van de gouvernementen van Beni Suef tot Aswan, met Luxor op de plaats van Thebe; de bewoners zijn de Sa’idi’s, en de Nijl verbindt het nog steeds."
