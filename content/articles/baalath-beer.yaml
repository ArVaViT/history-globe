# Overview article (ADR 0007). Mainstream facts only; a Simeonite town known from one list in two copies; its equation with Bealoth and south Ramoth is given as probable; the site is given as unproved, with Horvat Uza, where the map shows it with Ramah of the south, as Aharoni's identification, reference works divided between it and Tel Ira, and the other candidates named.
id: baalath-beer
place: a03cc2d
title:
  en: "Baalath-beer"
  ru: "Ваалаф-Беер"
  uk: "Ваалат-Беер"
  es: "Baalat-beer"
  pt: "Baalate-Beer"
  de: "Baalat-Beer"
  fr: "Baalath-Beer"
  it: "Baalat-Beer"
  pl: "Baalat-Beer"
  nl: "Baälat-Beër"
  cs: "Báalat-beer"
body:
  en:
    - "Baalath-beer, “the lady of the well”, marks the southern limit of the towns of Simeon in the Negev: the tribe held its cities “and all the villages that were round about these cities to Baalath-beer, Ramath of the south”. The parallel list in Chronicles shortens the name to “Baal”. Many scholars take it to be the same place as Bealoth in the list of Judah's southern towns and as the “south Ramoth” to which David sent a share of the spoil taken from the Amalekites; if so, it was a town of some note on the southern frontier."
    - "The site is not proved. Ramah of the south is taken to be the Ramat-Negev named in the Arad ostraca, and Yohanan Aharoni put it at Horvat Uza (Khirbet Ghazzeh), a ruined fort about 9 km south-east of Tel Arad; reference works are divided between it and Tel Ira, the older ones mostly following Aharoni, and the map shows Baalath-beer there, together with Ramah of the south. The fort excavated there dates from the seventh century BC, which some think too late for a town of David's day; they prefer Tel Ira, the fortified Iron Age town excavated by Itzhaq Beit-Arieh some 17 km to the west. Tel Malhata and Tel Masos, west along the same valley, and Beer Yeroham farther south have also been named, and no site has yielded an inscription with the name. Beyond the lists the Bible says nothing of it. The region is today the northern Negev of Israel, in and around the Beersheba–Arad valley."
  ru:
    - "Ваалаф-Беер, «владычица колодца», отмечает южный предел городов Симеона в Негеве: колену принадлежали его города «и все села, которые находились вокруг городов сих даже до Ваалаф-Беера, или южной Рамы». Параллельный список в Паралипоменоне сокращает имя: «до Ваала». Многие учёные считают его тем же местом, что Валоф в списке южных городов Иуды и Рамоф южный, куда Давид послал долю добычи, взятой у Амаликитян; если так, это был заметный город на южной границе."
    - "Место не доказано. Южную Раму считают тем же Рамат-Негевом, что назван в арадских остраконах, и Йоханан Аарони поместил его в Хорват-Узе (Хирбет-Газзе), развалинах крепости примерно в 9 км к юго-востоку от Тель-Арада; справочники делятся между ней и Тель-Ирой, более старые в основном идут за Аарони, и карта показывает там Ваалаф-Беер вместе с южной Рамой. Раскопанная там крепость относится к VII веку до н. э., и некоторым это кажется слишком поздним для города времён Давида; они предпочитают Тель-Иру, укреплённый город железного века, раскопанный Ицхаком Бейт-Арье примерно в 17 км к западу. Назывались также Тель-Малхата и Тель-Масос западнее в той же долине и Беэр-Йерохам дальше к югу; ни одно место не дало надписи с этим именем. Кроме списков, Библия о нём ничего не говорит. Эта местность сегодня — северный Негев в Израиле, долина между Беэр-Шевой и Арадом и её окрестности."
  uk:
    - "Ваалат-Беер, «пані колодязя», позначає південну межу міст Симеона в Негеві: плем'я володіло своїми містами та «І всї села навкруги названих городів аж до Баалат-Беера або Рами полуденньої». Паралельний перелік у Хроніках скорочує назву до «Баала». Багато вчених вважають його тим самим місцем, що й Валот у переліку південних міст Юди, і «Рамотом полуденним», до якого Давид послав частку здобичі, взятої в амалекитян: «в Рамотї полуденньому»; якщо так, це було місто певної ваги на південному кордоні."
    - "Місце не доведене. Південну Раму вважають тим самим Рамат-Негевом, що названий в арадських остраконах, і Йоханан Аарони помістив його в Хорват-Узі (Хірбет-Газзе), руїнах фортеці приблизно за 9 км на південний схід від Тель-Арада; довідники поділяються між нею і Тель-Ірою, давніші здебільшого йдуть за Аарони, і карта показує там Ваалат-Беер разом із південною Рамою. Розкопана там фортеця належить до VII століття до н. е., і декому це видається надто пізнім для міста часів Давида; вони віддають перевагу Тель-Ірі, укріпленому місту залізного віку, розкопаному Іцхаком Бейт-Арьє приблизно за 17 км на захід. Називали також Тель-Малхату й Тель-Масос західніше в тій самій долині та Беер-Єрохам далі на півдні; жодне місце не дало напису з цією назвою. Поза переліками Біблія про нього нічого не каже. Нині цей край — північний Негев Ізраїлю, долина між Беер-Шевою та Арадом і її околиці."
  es:
    - "Baalat-beer, «la señora del pozo», marca el límite meridional de las ciudades de Simeón en el Néguev: la tribu poseía sus ciudades y «todas las aldeas que estaban alrededor de estas ciudades hasta Baalath-beer, que es Ramat del mediodía». La lista paralela de las Crónicas abrevia el nombre a «Baal». Muchos estudiosos la toman por el mismo lugar que Bealot en la lista de ciudades meridionales de Judá y que la «Ramoth al mediodía» a la que David envió una parte del botín tomado a los amalecitas; si es así, fue una ciudad de cierta importancia en la frontera meridional."
    - "El sitio no está probado. La Ramá del sur se toma por la Ramat-Negev de los óstraca de Arad, y Yohanan Aharoni la puso en Horvat Uza (Khirbet Ghazzeh), fortaleza en ruinas a unos 9 km al sudeste de Tel Arad; las obras de referencia se dividen entre ella y Tel Ira, las más antiguas suelen seguir a Aharoni, y el mapa muestra allí Baalat-beer con la Ramá del sur. La fortaleza allí excavada es del siglo VII a. C., demasiado tarde según algunos para una ciudad de los días de David; prefieren Tel Ira, ciudad fortificada de la Edad del Hierro excavada por Itzhaq Beit-Arieh unos 17 km al oeste. También se han nombrado Tel Malhata y Tel Masos, al oeste en el mismo valle, y Beer Yeroham, más al sur; ningún sitio ha dado una inscripción con el nombre. Fuera de las listas, la Biblia nada dice de ella. La región es hoy el Néguev septentrional de Israel, en el valle de Beerseba–Arad y alrededores."
  pt:
    - "Baalate-Beer, “a senhora do poço”, marca o limite sul das cidades de Simeão no Neguev: a tribo possuía suas cidades “e todas as aldeias que estavam ao redor destas cidades até Baalate-Beer, Ramá do Sul”. A lista paralela em Crônicas abrevia o nome para “Baal”. Muitos estudiosos a tomam pelo mesmo lugar que Bealote, na lista das cidades meridionais de Judá, e que a “Ramote do Sul” a quem Davi enviou parte do despojo tomado aos amalequitas; se assim for, era uma cidade de certa nota na fronteira sul."
    - "O sítio não está provado. A Ramá do Sul é tomada pela Ramat-Negev nomeada nos óstracos de Arade, e Yohanan Aharoni a pôs em Horvat Uza (Khirbet Ghazzeh), uma fortaleza em ruínas a cerca de 9 km a sudeste de Tel Arad; as obras de referência dividem-se entre ela e Tel Ira, as mais antigas seguindo em geral Aharoni, e o mapa mostra ali Baalate-Beer junto com a Ramá do Sul. A fortaleza ali escavada data do século VII a.C., o que alguns julgam tarde demais para uma cidade dos dias de Davi; preferem Tel Ira, a cidade fortificada da Idade do Ferro escavada por Itzhaq Beit-Arieh a cerca de 17 km a oeste. Também foram nomeados Tel Malhata e Tel Masos, a oeste no mesmo vale, e Beer Yeroham, mais ao sul, e nenhum sítio deu uma inscrição com o nome. Além das listas, a Bíblia nada diz dela. A região é hoje o norte do Neguev israelense, no vale de Berseba–Arade e em seus arredores."
  de:
    - "Baalat-Beer, „Herrin des Brunnens“, bezeichnet die Südgrenze der Städte Simeons im Negev: Der Stamm hatte seine Städte „und alle Dörfer, die um diese Städte liegen, bis gen Baalath-Beer-Ramath gegen Mittag“. Die Parallelliste der Chronik kürzt den Namen zu „Baal“. Viele Gelehrte halten es für denselben Ort wie Bealot in der Liste der südlichen Städte Judas und wie das „Ramoth im Mittagsland“, wohin David einen Teil der Beute von den Amalekitern sandte; dann war es eine Stadt von einiger Bedeutung an der Südgrenze."
    - "Die Stätte ist nicht bewiesen. Rama im Süden gilt als das Ramat-Negev der Ostraka von Arad, und Jochanan Aharoni setzte es in Horvat Uza (Chirbet Ghazzeh) an, einer Festungsruine etwa 9 km südöstlich von Tel Arad; die Nachschlagewerke sind zwischen Horvat Uza und Tel Ira geteilt, die älteren folgen meist Aharoni, und die Karte zeigt Baalat-Beer dort, zusammen mit Rama im Süden. Die dort ausgegrabene Festung stammt aus dem 7. Jahrhundert v. Chr., manchen zu spät für eine Stadt aus Davids Tagen; sie ziehen Tel Ira vor, die befestigte eisenzeitliche Stadt, die Itzhaq Beit-Arie etwa 17 km westlich ausgrub. Genannt wurden auch Tel Malhata und Tel Masos westlich im selben Tal und Beer Jeroham weiter südlich; keine Stätte ergab eine Inschrift mit dem Namen. Über die Listen hinaus schweigt die Bibel. Die Gegend ist heute der nördliche Negev Israels, im Tal von Beerscheba und Arad und Umgebung."
  fr:
    - "Baalath-Beer, « la dame du puits », marque la limite sud des villes de Siméon dans le Négev : la tribu tenait ses villes « et tous les villages aux environs de ces villes, jusqu’à Baalath-Beer, qui est Ramath du midi ». La liste parallèle des Chroniques abrège le nom en « Baal ». Beaucoup de savants la tiennent pour le même lieu que Bealoth dans la liste des villes méridionales de Juda et que la « Ramoth du midi » à laquelle David envoya une part du butin pris aux Amalécites ; si c’est le cas, c’était une ville de quelque renom à la frontière sud."
    - "Le site n’est pas prouvé. On tient Rama du midi pour la Ramat-Negev des ostraca d’Arad, et Yohanan Aharoni l’a placée à Horvat Uza (Khirbet Ghazzeh), un fort en ruine à environ 9 km au sud-est de Tel Arad ; les ouvrages de référence se partagent entre lui et Tel Ira, les plus anciens suivant surtout Aharoni, et la carte y montre Baalath-Beer avec Rama du midi. Le fort fouillé là date du VIIe siècle av. J.-C., trop tard selon certains pour une ville du temps de David ; ils préfèrent Tel Ira, la ville fortifiée de l’âge du Fer fouillée par Itzhaq Beit-Arieh à quelque 17 km à l’ouest. Tel Malhata et Tel Masos, à l’ouest dans la même vallée, et Beer Yeroham, plus au sud, ont aussi été proposés ; aucun site n’a livré d’inscription portant le nom. Hors des listes, la Bible n’en dit rien. La région est aujourd’hui le nord du Négev israélien, dans le bassin de Beer-Schéba–Arad et ses environs."
  it:
    - "Baalat-Beer, «la signora del pozzo», segna il limite meridionale delle città di Simeone nel Negheb: la tribù teneva le sue città «e tutti i villaggi che stavano attorno a queste città, fino a Baalath-Beer, che è la Rama del sud». L’elenco parallelo delle Cronache abbrevia il nome in «Baal». Molti studiosi la ritengono lo stesso luogo di Bealot nell’elenco delle città meridionali di Giuda e della «Ramoth del mezzogiorno» a cui Davide mandò una parte del bottino preso agli Amalechiti; se è così, era una città di qualche rilievo sulla frontiera meridionale."
    - "Il sito non è provato. La Rama del sud è identificata con la Ramat-Negev degli ostraka di Arad, e Yohanan Aharoni la pose a Horbat Uza (Khirbet Ghazzeh), un forte in rovina a circa 9 km a sud-est di Tel Arad; le opere di riferimento si dividono fra esso e Tel Ira, le più antiche seguono per lo più Aharoni, e la carta mostra lì Baalat-Beer con la Rama del sud. Il forte scavato sul posto risale al VII secolo a.C., troppo tardi per alcuni per una città dei giorni di Davide; essi preferiscono Tel Ira, la città fortificata dell’età del Ferro scavata da Itzhaq Beit-Arieh circa 17 km più a ovest. Si sono nominati anche Tel Malhata e Tel Masos, a ovest nella stessa valle, e Beer Yeroham, più a sud; nessun sito ha dato un’iscrizione con il nome. Oltre gli elenchi la Bibbia non ne dice nulla. La regione è oggi il Negheb settentrionale di Israele, nel bacino di Bersabea-Arad e dintorni."
  pl:
    - "Baalat-Beer, „pani studni”, wyznacza południową granicę miast Symeona w Negewie: pokolenie miało swe miasta „i wszystkie wsi, które były około tych miast, aż do Baalatbeer, i Ramat ku stronie południowej”. Paralelny wykaz w Księdze Kronik skraca nazwę do „Baal”. Wielu uczonych uważa je za to samo miejsce co Bealot w wykazie południowych miast Judy i za „południowe Ramot”, do którego Dawid posłał część łupu zabranego Amalekitom; jeśli tak, było to miasto pewnego znaczenia na południowej granicy."
    - "Położenie nie jest dowiedzione. Ramę południową uważa się za Ramat-Negew wymienioną w ostrakonach z Aradu, a Yohanan Aharoni umieścił ją w Horwat Uza (Chirbet Ghazzeh), ruinie twierdzy około 9 km na południowy wschód od Tel Arad; opracowania dzielą się między nią a Tel Ira, starsze idą przeważnie za Aharonim, a mapa pokazuje tam Baalat-Beer razem z Ramą południową. Odkopana tam twierdza pochodzi z VII wieku p.n.e., co niektórym wydaje się zbyt późne dla miasta z czasów Dawida; wolą oni Tel Ira, obwarowane miasto z epoki żelaza, badane przez Icchaka Beit-Arie około 17 km na zachód. Wymieniano też Tel Malhata i Tel Masos, na zachód w tej samej dolinie, oraz Beer Jerocham dalej na południe, a żadne miejsce nie dało napisu z nazwą. Poza wykazami Biblia nic o nim nie mówi. Region to dziś północny Negew Izraela, w basenie Beer-Szeby i Aradu i wokół niego."
  nl:
    - "Baälat-Beër, “de vrouwe van de put”, markeert de zuidgrens van de steden van Simeon in de Negev: de stam bezat zijn steden “en al de dorpen, die rondom deze steden waren, tot Baalath-Beer, dat is Ramath tegen het zuiden”. De parallelle lijst in Kronieken verkort de naam tot “Baal”. Veel geleerden houden haar voor dezelfde plaats als Bealot in de lijst van Juda’s zuidelijke steden en als het “Ramoth tegen het zuiden” waarheen David een deel van de op de Amalekieten veroverde buit zond; zo ja, dan was het een stad van enig belang aan de zuidgrens."
    - "De ligging is niet bewezen. Rama van het zuiden wordt gehouden voor het Ramat-Negev van de ostraca van Arad, en Yohanan Aharoni plaatste het bij Horvat Uza (Khirbet Ghazzeh), een vervallen fort zo’n 9 km ten zuidoosten van Tel Arad; de naslagwerken zijn verdeeld tussen dit fort en Tel Ira, de oudere volgen meestal Aharoni, en de kaart toont Baälat-Beër daar, met Rama van het zuiden. Het daar opgegraven fort is uit de zevende eeuw v.Chr., voor sommigen te laat voor een stad uit Davids dagen; zij verkiezen Tel Ira, de versterkte stad uit de IJzertijd die Itzhaq Beit-Arieh zo’n 17 km westelijker opgroef. Ook Tel Malhata en Tel Masos, westelijker in dezelfde vallei, en Beer Yeroham, verder zuidelijk, zijn genoemd; geen plaats leverde een opschrift met de naam op. Buiten de lijsten zwijgt de Bijbel erover. De streek is nu de noordelijke Negev van Israël, in en rond het bekken Berseba–Arad."
  cs:
    - "Báalat-beer, „paní studny“, označuje jižní hranici měst Simeonových v Negevu: kmen držel svá města „I všecky vsi, kteréž byly vůkolí měst těch, až do Balatber a Rámat poledního“. Paralelní seznam v Letopisech zkracuje jméno na „Baal“. Mnozí badatelé pokládají za totéž místo co Bealót v seznamu jižních měst Judy a co „jižní Rámot“, kam David poslal podíl kořisti vzaté Amalekovcům; pokud ano, bylo to město nemalého významu na jižní hranici."
    - "Místo není prokázáno. Ráma jižní se pokládá za Rámat-Negev, který jmenují aradská ostraka, a Yohanan Aharoni ji kladl do Chorvat Uza (Chirbet Ghazzeh), zříceniny pevnosti asi 9 km jihovýchodně od Tel Aradu; příručky se dělí mezi ni a Tel Ira, starší jdou většinou za Aharonim, a mapa tam ukazuje Báalat-beer spolu s Rámou jižní. Pevnost tam vykopaná pochází ze 7. století př. n. l., což se některým zdá příliš pozdní pro město Davidových dnů; dávají přednost Tel Ira, opevněnému městu doby železné, které asi 17 km na západ vykopal Jicchak Bejt-Arie. Jmenovány byly i Tel Malhata a Tel Masos západně v témže údolí a Beer Jerucham dále na jihu a žádné místo nedalo nápis se jménem. Mimo seznamy o něm Bible nic neříká. Oblast je dnes severním Negevem Izraele, v pánvi Beer-šeba–Arad a jejím okolí."
