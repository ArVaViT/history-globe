# Overview article (ADR 0007). Mainstream facts only; a Simeonite town known from one list in two copies; its equation with Bealoth and south Ramoth is given as probable, and the candidate sites without choosing one.
id: baalath-beer
place: a03cc2d
title:
  en: "Baalath-beer"
  ru: "Ваалаф-Беер"
  uk: "Ваалат-Беер"
  es: "Baalat-beer"
  pt: "Baalate-Beer"
  de: "Baalat-Beer"
  fr: "Baalath-Beer"
