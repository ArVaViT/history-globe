body:
  en:
    - "Baalath-beer, “the lady of the well”, marks the southern limit of the towns of Simeon in the Negev: the tribe held its cities “and all the villages that were round about these cities to Baalath-beer, Ramath of the south”. The parallel list in Chronicles shortens the name to “Baal”. Many scholars take it to be the same place as Bealoth in the list of Judah's southern towns and as the “south Ramoth” to which David sent a share of the spoil taken from the Amalekites; if so, it was a town of some note on the southern frontier."
    - "The site is not proved. Ramah of the south is taken to be the Ramat-Negev of the Arad ostraca; letter 24 orders men from Arad and from Kinah sent there against Edom, so Kinah and Ramat-Negev were different forts. Yohanan Aharoni put Ramat-Negev at Horvat Uza (Khirbet Ghazzeh), a fort about 9 km south-east of Tel Arad (he looked for Kinah at Horvat Tov, Khirbet et-Taiyib), and many reference works follow him; but Itzhaq Beit-Arieh, who excavated it, found nothing there earlier than the seventh century BC, the fort is now taken by many for Kinah, above the Wadi el-Qeini that keeps the name, and André Lemaire, Nadav Na'aman and Anson Rainey place Ramat-Negev at Tel Ira (Khirbet Gharra), a walled town of the kings of Judah on a high hill, some 17 km to the west. The map follows them: Baalath-beer stands at Tel Ira with Ramah of the south, Kinah at Horvat Uza."
    - "Tel Ira's own name is unknown: it has also been claimed for Jagur and Kabzeel, and no level of David's day has been identified there either. Tel Malhata and Tel Masos, west along the same valley, and Beer Yeroham farther south have also been named for Baalath-beer, and no site has yielded an inscription with the name. Beyond the lists the Bible says nothing of it. The region is today the northern Negev of Israel, in and around the Beersheba–Arad valley."
  ru:
    - "Ваалаф-Беер, «владычица колодца», отмечает южный предел городов Симеона в Негеве: колену принадлежали его города «и все села, которые находились вокруг городов сих даже до Ваалаф-Беера, или южной Рамы». Параллельный список в Паралипоменоне сокращает имя: «до Ваала». Многие учёные считают его тем же местом, что Валоф в списке южных городов Иуды и Рамоф южный, куда Давид послал долю добычи, взятой у Амаликитян; если так, это был заметный город на южной границе."
    - "Место не доказано. Южную Раму считают тем же Рамат-Негевом, что назван в арадских остраконах; письмо 24 велит послать туда людей из Арада и из Кины против Эдома, то есть Кина и Рамат-Негев — разные крепости. Йоханан Аарони поместил Рамат-Негев в Хорват-Узе (Хирбет-Газзе), крепости примерно в 9 км к юго-востоку от Тель-Арада (Кину он искал в Хорват-Тове, Хирбет-эт-Тайибе), и многие справочники идут за ним; но Ицхак Бейт-Арье, раскопавший её, не нашёл там ничего старше VII века до н. э., крепость теперь многие считают Киной, над Вади-эль-Кейни, хранящим это имя, а Андре Лемер, Надав Нааман и Энсон Рейни помещают Рамат-Негев в Тель-Ире (Хирбет-Гарра), укреплённом городе царей Иуды на высоком холме, примерно в 17 км к западу. Карта следует за ними: Ваалаф-Беер стоит в Тель-Ире вместе с южной Рамой, Кина — в Хорват-Узе."
    - "Собственное имя Тель-Иры неизвестно: её называли также Иагуром и Кавцеилом, и слоя времён Давида там тоже не выявлено. Для Ваалаф-Беера называли и Тель-Малхату, и Тель-Масос — западнее, в той же долине, — и Беэр-Йерохам дальше к югу; ни одно место не дало надписи с этим именем. Кроме списков, Библия о нём ничего не говорит. Эта местность сегодня — северный Негев в Израиле, долина между Беэр-Шевой и Арадом и её окрестности."
  uk:
    - "Ваалат-Беер, «пані колодязя», позначає південну межу міст Симеона в Негеві: плем'я володіло своїми містами та «І всї села навкруги названих городів аж до Баалат-Беера або Рами полуденньої». Паралельний перелік у Хроніках скорочує назву до «Баала». Багато вчених вважають його тим самим місцем, що й Валот у переліку південних міст Юди, і «Рамотом полуденним», до якого Давид послав частку здобичі, взятої в амалекитян: «в Рамотї полуденньому»; якщо так, це було місто певної ваги на південному кордоні."
    - "Місце не доведене. Південну Раму вважають тим самим Рамат-Негевом, що названий в арадських остраконах; лист 24 наказує послати туди людей з Арада і з Кіни проти Едома, тобто Кіна і Рамат-Негев — різні фортеці. Йоханан Аарони помістив Рамат-Негев у Хорват-Узі (Хірбет-Газзе), фортеці приблизно за 9 км на південний схід від Тель-Арада (Кіну він шукав у Хорват-Тові, Хірбет-ет-Тайїбі), і багато довідників ідуть за ним; але Іцхак Бейт-Арьє, який її розкопав, не знайшов там нічого давнішого за VII століття до н. е., фортецю тепер багато хто вважає Кіною, над Ваді-ель-Кейні, що зберігає цю назву, а Андре Лемер, Надав Нааман і Енсон Рейні поміщають Рамат-Негев у Тель-Ірі (Хірбет-Гарра), укріпленому місті царів Юди на високому пагорбі, приблизно за 17 км на захід. Карта йде за ними: Ваалат-Беер стоїть у Тель-Ірі разом із південною Рамою, Кіна — у Хорват-Узі."
    - "Власна назва Тель-Іри невідома: її називали також Ягуром і Кавцеїлом, і шару часів Давида там теж не виявлено. Для Ваалат-Беера називали й Тель-Малхату, і Тель-Масос — західніше, в тій самій долині, — і Беер-Єрохам далі на півдні; жодне місце не дало напису з цією назвою. Поза переліками Біблія про нього нічого не каже. Нині цей край — північний Негев Ізраїлю, долина між Беер-Шевою та Арадом і її околиці."
  es:
    - "Baalat-beer, «la señora del pozo», marca el límite meridional de las ciudades de Simeón en el Néguev: la tribu poseía sus ciudades y «todas las aldeas que estaban alrededor de estas ciudades hasta Baalath-beer, que es Ramat del mediodía». La lista paralela de las Crónicas abrevia el nombre a «Baal». Muchos estudiosos la toman por el mismo lugar que Bealot en la lista de ciudades meridionales de Judá y que la «Ramoth al mediodía» a la que David envió una parte del botín tomado a los amalecitas; si es así, fue una ciudad de cierta importancia en la frontera meridional."
    - "El sitio no está probado. La Ramá del sur se toma por la Ramat-Negev de los óstraca de Arad; la carta 24 ordena enviar allí hombres de Arad y de Cina contra Edom, así que Cina y Ramat-Negev eran fortalezas distintas. Yohanan Aharoni puso Ramat-Negev en Horvat Uza (Khirbet Ghazzeh), fortaleza a unos 9 km al sudeste de Tel Arad (a Cina la buscó en Horvat Tov, Khirbet et-Taiyib), y muchas obras de referencia lo siguen; pero Itzhaq Beit-Arieh, que la excavó, no halló allí nada anterior al siglo VII a. C., hoy muchos toman la fortaleza por Cina, sobre el Wadi el-Qeini que conserva el nombre, y André Lemaire, Nadav Na'aman y Anson Rainey sitúan Ramat-Negev en Tel Ira (Khirbet Gharra), ciudad amurallada de los reyes de Judá sobre una colina alta, unos 17 km al oeste. El mapa los sigue: Baalat-beer está en Tel Ira con la Ramá del sur, Cina en Horvat Uza."
    - "El nombre propio de Tel Ira se desconoce: también se ha propuesto para Jagur y Cabseel, y tampoco se ha identificado allí un nivel de los días de David. Para Baalat-beer se han nombrado además Tel Malhata y Tel Masos, al oeste en el mismo valle, y Beer Yeroham, más al sur; ningún sitio ha dado una inscripción con el nombre. Fuera de las listas, la Biblia nada dice de ella. La región es hoy el Néguev septentrional de Israel, en el valle de Beerseba–Arad y alrededores."
  pt:
    - "Baalate-Beer, “a senhora do poço”, marca o limite sul das cidades de Simeão no Neguev: a tribo possuía suas cidades “e todas as aldeias que estavam ao redor destas cidades até Baalate-Beer, Ramá do Sul”. A lista paralela em Crônicas abrevia o nome para “Baal”. Muitos estudiosos a tomam pelo mesmo lugar que Bealote, na lista das cidades meridionais de Judá, e que a “Ramote do Sul” a quem Davi enviou parte do despojo tomado aos amalequitas; se assim for, era uma cidade de certa nota na fronteira sul."
    - "O sítio não está provado. A Ramá do Sul é tomada pela Ramat-Negev dos óstracos de Arade; a carta 24 manda enviar para lá homens de Arade e de Quina contra Edom, logo Quina e Ramat-Negev eram fortalezas distintas. Yohanan Aharoni pôs Ramat-Negev em Horvat Uza (Khirbet Ghazzeh), fortaleza a cerca de 9 km a sudeste de Tel Arad (ele procurava Quina em Horvat Tov, Khirbet et-Taiyib), e muitas obras de referência o seguem; mas Itzhaq Beit-Arieh, que a escavou, nada achou ali anterior ao século VII a.C., a fortaleza é hoje tida por muitos como Quina, sobre o Wadi el-Qeini que guarda o nome, e André Lemaire, Nadav Na'aman e Anson Rainey situam Ramat-Negev em Tel Ira (Khirbet Gharra), cidade murada dos reis de Judá sobre uma colina alta, uns 17 km a oeste. O mapa os segue: Baalate-Beer fica em Tel Ira com a Ramá do Sul, Quina em Horvat Uza."
    - "O nome próprio de Tel Ira é desconhecido: também foi proposto para Jagur e Cabzeel, e tampouco se identificou ali um nível dos dias de Davi. Para Baalate-Beer foram nomeados ainda Tel Malhata e Tel Masos, a oeste no mesmo vale, e Beer Yeroham, mais ao sul; nenhum sítio deu uma inscrição com o nome. Além das listas, a Bíblia nada diz dela. A região é hoje o norte do Neguev israelense, no vale de Berseba–Arade e em seus arredores."
  de:
    - "Baalat-Beer, „Herrin des Brunnens“, bezeichnet die Südgrenze der Städte Simeons im Negev: Der Stamm hatte seine Städte „und alle Dörfer, die um diese Städte liegen, bis gen Baalath-Beer-Ramath gegen Mittag“. Die Parallelliste der Chronik kürzt den Namen zu „Baal“. Viele Gelehrte halten es für denselben Ort wie Bealot in der Liste der südlichen Städte Judas und wie das „Ramoth im Mittagsland“, wohin David einen Teil der Beute von den Amalekitern sandte; dann war es eine Stadt von einiger Bedeutung an der Südgrenze."
    - "Die Stätte ist nicht bewiesen. Rama im Süden gilt als das Ramat-Negev der Ostraka von Arad; Brief 24 befiehlt, Männer aus Arad und aus Kina gegen Edom dorthin zu schicken, Kina und Ramat-Negev waren also verschiedene Festungen. Jochanan Aharoni setzte Ramat-Negev in Horvat Uza (Chirbet Ghazzeh) an, einer Festung etwa 9 km südöstlich von Tel Arad (Kina suchte er in Horvat Tov, Chirbet et-Taiyib), und viele Nachschlagewerke folgen ihm; doch Itzhaq Beit-Arie, der sie ausgrub, fand dort nichts vor dem 7. Jahrhundert v. Chr., die Festung gilt heute vielen als Kina, über dem Wadi el-Qeini, das den Namen bewahrt, und André Lemaire, Nadav Na'aman und Anson Rainey setzen Ramat-Negev in Tel Ira (Chirbet Gharra) an, einer befestigten Stadt der Könige Judas auf einem hohen Hügel, etwa 17 km westlich. Die Karte folgt ihnen: Baalat-Beer steht in Tel Ira mit Rama im Süden, Kina in Horvat Uza."
    - "Der eigene Name von Tel Ira ist unbekannt: Es wurde auch für Jagur und Kabzeel vorgeschlagen, und auch dort ist keine Schicht aus Davids Tagen nachgewiesen. Für Baalat-Beer wurden ferner Tel Malhata und Tel Masos westlich im selben Tal und Beer Jeroham weiter südlich genannt; keine Stätte ergab eine Inschrift mit dem Namen. Über die Listen hinaus schweigt die Bibel. Die Gegend ist heute der nördliche Negev Israels, im Tal von Beerscheba und Arad und Umgebung."
  fr:
    - "Baalath-Beer, « la dame du puits », marque la limite sud des villes de Siméon dans le Négev : la tribu tenait ses villes « et tous les villages aux environs de ces villes, jusqu’à Baalath-Beer, qui est Ramath du midi ». La liste parallèle des Chroniques abrège le nom en « Baal ». Beaucoup de savants la tiennent pour le même lieu que Bealoth dans la liste des villes méridionales de Juda et que la « Ramoth du midi » à laquelle David envoya une part du butin pris aux Amalécites ; si c’est le cas, c’était une ville de quelque renom à la frontière sud."
    - "Le site n’est pas prouvé. On tient Rama du midi pour la Ramat-Negev des ostraca d’Arad ; la lettre 24 ordonne d’y envoyer des hommes d’Arad et de Kina contre Édom : Kina et Ramat-Negev étaient donc des forts distincts. Yohanan Aharoni a placé Ramat-Negev à Horvat Uza (Khirbet Ghazzeh), un fort à environ 9 km au sud-est de Tel Arad (il cherchait Kina à Horvat Tov, Khirbet et-Taiyib), et bien des ouvrages de référence le suivent ; mais Itzhaq Beit-Arieh, qui l’a fouillé, n’y a rien trouvé d’antérieur au VIIe siècle av. J.-C., beaucoup tiennent aujourd’hui le fort pour Kina, au-dessus du Wadi el-Qeini qui garde le nom, et André Lemaire, Nadav Na’aman et Anson Rainey placent Ramat-Negev à Tel Ira (Khirbet Gharra), ville fortifiée des rois de Juda sur une haute colline, à quelque 17 km à l’ouest. La carte les suit : Baalath-Beer est à Tel Ira avec Rama du midi, Kina à Horvat Uza."
    - "Le nom propre de Tel Ira est inconnu : on l’a aussi proposé pour Jagur et Kabtséel, et on n’y a pas non plus identifié de niveau du temps de David. Pour Baalath-Beer on a aussi nommé Tel Malhata et Tel Masos, à l’ouest dans la même vallée, et Beer Yeroham, plus au sud ; aucun site n’a livré d’inscription portant le nom. Hors des listes, la Bible n’en dit rien. La région est aujourd’hui le nord du Négev israélien, dans le bassin de Beer-Schéba–Arad et ses environs."
  it:
    - "Baalat-Beer, «la signora del pozzo», segna il limite meridionale delle città di Simeone nel Negheb: la tribù teneva le sue città «e tutti i villaggi che stavano attorno a queste città, fino a Baalath-Beer, che è la Rama del sud». L’elenco parallelo delle Cronache abbrevia il nome in «Baal». Molti studiosi la ritengono lo stesso luogo di Bealot nell’elenco delle città meridionali di Giuda e della «Ramoth del mezzogiorno» a cui Davide mandò una parte del bottino preso agli Amalechiti; se è così, era una città di qualche rilievo sulla frontiera meridionale."
    - "Il sito non è provato. La Rama del sud è identificata con la Ramat-Negev degli ostraka di Arad; la lettera 24 ordina di mandarvi uomini da Arad e da Kina contro Edom, dunque Kina e Ramat-Negev erano forti distinti. Yohanan Aharoni pose Ramat-Negev a Horbat Uza (Khirbet Ghazzeh), un forte a circa 9 km a sud-est di Tel Arad (cercava Kina a Horbat Tov, Khirbet et-Taiyib), e molte opere di riferimento lo seguono; ma Itzhaq Beit-Arieh, che lo scavò, non vi trovò nulla anteriore al VII secolo a.C., il forte è oggi ritenuto da molti Kina, sopra il Wadi el-Qeini che ne conserva il nome, e André Lemaire, Nadav Na’aman e Anson Rainey pongono Ramat-Negev a Tel Ira (Khirbet Gharra), città fortificata dei re di Giuda su un’alta collina, circa 17 km a ovest. La carta li segue: Baalat-Beer sta a Tel Ira con la Rama del sud, Kina a Horbat Uza."
    - "Il nome proprio di Tel Ira è ignoto: è stato proposto anche per Iagur e Cabseel, e neppure lì è stato individuato uno strato dei giorni di Davide. Per Baalat-Beer si sono nominati anche Tel Malhata e Tel Masos, a ovest nella stessa valle, e Beer Yeroham, più a sud; nessun sito ha dato un’iscrizione con il nome. Oltre gli elenchi la Bibbia non ne dice nulla. La regione è oggi il Negheb settentrionale di Israele, nel bacino di Bersabea-Arad e dintorni."
  pl:
    - "Baalat-Beer, „pani studni”, wyznacza południową granicę miast Symeona w Negewie: pokolenie miało swe miasta „i wszystkie wsi, które były około tych miast, aż do Baalatbeer, i Ramat ku stronie południowej”. Paralelny wykaz w Księdze Kronik skraca nazwę do „Baal”. Wielu uczonych uważa je za to samo miejsce co Bealot w wykazie południowych miast Judy i za „południowe Ramot”, do którego Dawid posłał część łupu zabranego Amalekitom; jeśli tak, było to miasto pewnego znaczenia na południowej granicy."
    - "Położenie nie jest dowiedzione. Ramę południową uważa się za Ramat-Negew z ostrakonów z Aradu; list 24 nakazuje posłać tam ludzi z Aradu i z Kiny przeciw Edomowi, Kina i Ramat-Negew były więc różnymi twierdzami. Yohanan Aharoni umieścił Ramat-Negew w Horwat Uza (Chirbet Ghazzeh), twierdzy około 9 km na południowy wschód od Tel Arad (Kiny szukał w Horwat Tow, Chirbet et-Taiyib), i wiele opracowań idzie za nim; ale Icchak Beit-Arie, który ją odkopał, nie znalazł tam nic starszego niż VII wiek p.n.e., twierdzę wielu uważa dziś za Kinę, nad Wadi el-Qeini, które zachowuje tę nazwę, a André Lemaire, Nadav Na'aman i Anson Rainey umieszczają Ramat-Negew w Tel Ira (Chirbet Gharra), obwarowanym mieście królów Judy na wysokim wzgórzu, około 17 km na zachód. Mapa idzie za nimi: Baalat-Beer stoi w Tel Ira razem z Ramą południową, Kina w Horwat Uza."
    - "Własna nazwa Tel Ira jest nieznana: proponowano je także dla Jagur i Kabseel, i tam również nie rozpoznano warstwy z czasów Dawida. Dla Baalat-Beer wymieniano też Tel Malhata i Tel Masos, na zachód w tej samej dolinie, oraz Beer Jerocham dalej na południe; żadne miejsce nie dało napisu z nazwą. Poza wykazami Biblia nic o nim nie mówi. Region to dziś północny Negew Izraela, w basenie Beer-Szeby i Aradu i wokół niego."
  nl:
    - "Baälat-Beër, “de vrouwe van de put”, markeert de zuidgrens van de steden van Simeon in de Negev: de stam bezat zijn steden “en al de dorpen, die rondom deze steden waren, tot Baalath-Beer, dat is Ramath tegen het zuiden”. De parallelle lijst in Kronieken verkort de naam tot “Baal”. Veel geleerden houden haar voor dezelfde plaats als Bealot in de lijst van Juda’s zuidelijke steden en als het “Ramoth tegen het zuiden” waarheen David een deel van de op de Amalekieten veroverde buit zond; zo ja, dan was het een stad van enig belang aan de zuidgrens."
    - "De ligging is niet bewezen. Rama van het zuiden wordt gehouden voor het Ramat-Negev van de ostraca van Arad; brief 24 beveelt mannen uit Arad en uit Kina daarheen te sturen tegen Edom, Kina en Ramat-Negev waren dus verschillende forten. Yohanan Aharoni plaatste Ramat-Negev bij Horvat Uza (Khirbet Ghazzeh), een fort zo’n 9 km ten zuidoosten van Tel Arad (Kina zocht hij bij Horvat Tov, Khirbet et-Taiyib), en veel naslagwerken volgen hem; maar Itzhaq Beit-Arieh, die het opgroef, vond er niets ouder dan de zevende eeuw v.Chr., velen houden het fort nu voor Kina, boven de Wadi el-Qeini die de naam bewaart, en André Lemaire, Nadav Na’aman en Anson Rainey plaatsen Ramat-Negev bij Tel Ira (Khirbet Gharra), een versterkte stad van de koningen van Juda op een hoge heuvel, zo’n 17 km westelijker. De kaart volgt hen: Baälat-Beër staat bij Tel Ira met Rama van het zuiden, Kina bij Horvat Uza."
    - "De eigen naam van Tel Ira is onbekend: het is ook voor Jagur en Kabseël voorgesteld, en ook daar is geen laag uit Davids dagen vastgesteld. Voor Baälat-Beër zijn verder Tel Malhata en Tel Masos, westelijker in dezelfde vallei, en Beer Yeroham, verder zuidelijk, genoemd; geen plaats leverde een opschrift met de naam op. Buiten de lijsten zwijgt de Bijbel erover. De streek is nu de noordelijke Negev van Israël, in en rond het bekken Berseba–Arad."
  cs:
    - "Báalat-beer, „paní studny“, označuje jižní hranici měst Simeonových v Negevu: kmen držel svá města „I všecky vsi, kteréž byly vůkolí měst těch, až do Balatber a Rámat poledního“. Paralelní seznam v Letopisech zkracuje jméno na „Baal“. Mnozí badatelé pokládají za totéž místo co Bealót v seznamu jižních měst Judy a co „jižní Rámot“, kam David poslal podíl kořisti vzaté Amalekovcům; pokud ano, bylo to město nemalého významu na jižní hranici."
    - "Místo není prokázáno. Ráma jižní se pokládá za Rámat-Negev, který jmenují aradská ostraka, a Yohanan Aharoni ji kladl do Chorvat Uza (Chirbet Ghazzeh), zříceniny pevnosti asi 9 km jihovýchodně od Tel Aradu; příručky se dělí mezi ni a Tel Ira, starší jdou většinou za Aharonim, a mapa tam ukazuje Báalat-beer spolu s Rámou jižní. Pevnost tam vykopaná pochází ze 7. století př. n. l., což se některým zdá příliš pozdní pro město Davidových dnů; dávají přednost Tel Ira, opevněnému městu doby železné, které asi 17 km na západ vykopal Jicchak Bejt-Arie. Jmenovány byly i Tel Malhata a Tel Masos západně v témže údolí a Beer Jerucham dále na jihu a žádné místo nedalo nápis se jménem. Mimo seznamy o něm Bible nic neříká. Oblast je dnes severním Negevem Izraele, v pánvi Beer-šeba–Arad a jejím okolí."
  sv:
    - "Baalat-Beer, ”brunnens härskarinna”, markerar södra gränsen för Simeons städer i Negev: stammen höll sina städer, ”därtill alla de byar som lågo runt omkring dessa städer, ända till Baalat-Beer, det sydliga Rama”. Den parallella förteckningen i Krönikeböckerna förkortar namnet till ”Baal”. Många forskare tar det för samma plats som Bealot i förteckningen över Judas södra städer och som ”Ramot i Sydlandet” dit David sände en del av bytet från amalekiterna; i så fall var det en stad av en viss betydelse vid södra gränsen."
    - "Platsen är inte bevisad. Det sydliga Rama antas vara Ramat-Negev som nämns i Arad-ostraka, och Yohanan Aharoni placerade det vid Horvat Uza (Khirbet Ghazzeh), ett ruinerat fort omkring 9 km sydost om Tel Arad; uppslagsverken är delade mellan det och Tel Ira, de äldre följer mest Aharoni, och kartan visar Baalat-Beer där, tillsammans med det sydliga Rama. Fortet som grävts ut där dateras till 600-talet f.Kr., vilket några anser för sent för en stad från Davids tid; de föredrar Tel Ira, den befästa järnåldersstaden som Itzhaq Beit-Arieh grävde ut omkring 17 km västerut. Tel Malhata och Tel Masos, västerut längs samma dal, och Beer Yeroham längre söderut har också nämnts, och ingen plats har givit en inskrift med namnet. Utöver förteckningarna säger Bibeln ingenting om den. Trakten är i dag norra Negev i Israel, i och kring dalen Beer Sheva–Arad."
  nb:
    - "Baalat-Beer, «brønnens frue», markerer sørgrensen for Simeons byer i Negev: stammen hadde byene sine og «alle de landsbyer som lå rundt omkring disse byer inntil Ba'alat-Be'er, Rama i sydlandet». Den parallelle listen i Krønikebøkene forkorter navnet til «Ba'al». Mange forskere regner den for det samme stedet som Bealot i listen over Judas sørlige byer og som «Ramot-Negeb» som David sendte en del av byttet tatt fra amalekittene til; i så fall var det en by av noen betydning på sørgrensen."
    - "Stedet er ikke bevist. Rama i sør regnes for Ramat-Negev som nevnes i Arad-ostrakaene, og Yohanan Aharoni plasserte det ved Horvat Uza (Khirbet Ghazzeh), et ruinert fort omkring 9 km sørøst for Tel Arad; oppslagsverkene er delt mellom det og Tel Ira, de eldre for det meste i tråd med Aharoni, og kartet viser Baalat-Beer der, sammen med Rama i sør. Fortet som er gravd ut der, dateres til 600-tallet f.Kr., noe som noen mener er for sent for en by fra Davids tid; de foretrekker Tel Ira, den befestede jernalderbyen utgravd av Itzhaq Beit-Arieh omtrent 17 km mot vest. Tel Malhata og Tel Masos, vestover langs samme dal, og Beer Yeroham lenger sør er også nevnt, og ingen lokalitet har gitt en innskrift med navnet. Utover listene sier Bibelen ingenting om den. Regionen er i dag nordlige Negev i Israel, i og rundt dalen Beer-Sjeba–Arad."
  tl:
    - "Ang Baalathbeer, “ginang ng balon”, ay nagmamarka ng katimugang hangganan ng mga bayan ni Simeon sa Negev: hawak ng lipi ang mga lungsod nito “At ang lahat ng mga nayon na nasa palibot ng mga bayang ito hanggang sa Baalathbeer, Ramat ng Timugan”. Pinaiikli ng kahilerang talaan sa Mga Cronica ang pangalan sa “Baal”. Itinuturing ng maraming iskolar na iisang lugar ito at ang Bealoth sa talaan ng mga katimugang bayan ng Juda at ang “Ramoth ng Timugan” kung saan nagpadala si David ng bahagi ng samsam mula sa mga Amalecita; kung gayon, bayang may kabantugan ito sa katimugang hangganan."
    - "Hindi tiyak ang lugar. Ang Rama ng timog ay ang Ramat-Negev ng mga ostraca ng Arad, na inilagay ni Yohanan Aharoni sa Horvat Uza (Khirbet Ghazzeh), guhong kuta mga 9 km sa timog-silangan ng Tel Arad; hati ang mga sanggunian sa pagitan nito at ng Tel Ira, ang mas lumang mga sanggunian ay halos sumusunod kay Aharoni, at doon ipinapakita ng mapa ang Baalathbeer, kasama ng Rama ng timog. Ang kutang nahukay doon ay mula sa ika-7 siglo BK, na huli na para sa panahon ni David ayon sa ilan, na mas pinipili ang Tel Ira, ang bayang nakukutaan ng Panahon ng Bakal na hinukay ni Itzhaq Beit-Arieh mga 17 km sa kanluran. Pinangalanan din ang Tel Malhata at Tel Masos sa kanluran, at Beer Yeroham sa timog, at walang may inskripsiyon ng pangalan. Bukod sa mga talaan, wala nang sinasabi ang Biblia. Ang rehiyon ay hilagang Negev ng Israel ngayon, sa palibot ng libis ng Beer-seba–Arad."
