body:
  en:
    - "Baalath-beer, “the lady of the well”, marks the southern limit of the towns of Simeon in the Negev: the tribe held its cities “and all the villages that were round about these cities to Baalath-beer, Ramath of the south”. The parallel list in Chronicles shortens the name to “Baal”. Most scholars take it to be the same place as Bealoth in the list of Judah's southern towns and as the “south Ramoth” to which David sent a share of the spoil taken from the Amalekites; if so, it was a town of some note on the southern frontier."
    - "Its site is unknown. The proposals are mounds of the Beersheba valley and the Negev highlands, among them Tel Malhata, Tel Ira and Tel Masos, and Beer Yeroham to the south; each fits the lists in part, and none has given an inscription with the name. Beyond the lists the Bible says nothing of it. The region is today the northern Negev of Israel, between Beersheba, Arad and Yeroham."
  ru:
    - "Ваалаф-Беер, «владычица колодца», отмечает южный предел городов Симеона в Негеве: колену принадлежали его города «и все села, которые находились вокруг городов сих даже до Ваалаф-Беера, или южной Рамы». Параллельный список в Паралипоменоне сокращает имя: «до Ваала». Большинство учёных считает его тем же местом, что Валоф в списке южных городов Иуды и Рамоф южный, куда Давид послал долю добычи, взятой у Амаликитян; если так, это был заметный город на южной границе."
    - "Место его неизвестно. Предлагают холмы Беэр-Шевской долины и Негевского нагорья, среди них Тель-Малхата, Тель-Ира и Тель-Масос, а также Беэр-Йерохам южнее; каждое отчасти согласуется со списками, но ни одно не дало надписи с этим именем. Кроме списков, Библия о нём ничего не говорит. Эта местность сегодня — северный Негев в Израиле, между Беэр-Шевой, Арадом и Йерохамом."
  uk:
    - "Ваалат-Беер, «пані колодязя», позначає південну межу міст Симеона в Негеві: плем'я володіло своїми містами та «І всї села навкруги названих городів аж до Баалат-Беера або Рами полуденньої». Паралельний перелік у Хроніках скорочує назву до «Баала». Більшість учених вважають його тим самим місцем, що й Валот у переліку південних міст Юди, і «Рамотом полуденним», до якого Давид послав частку здобичі, взятої в амалекитян: «в Рамотї полуденньому»; якщо так, це було місто певної ваги на південному кордоні."
    - "Його місце невідоме. Пропоновані місця — пагорби долини Беер-Шеви та нагір'я Негеву, серед них Тель-Малхата, Тель-Іра й Тель-Масос, а на півдні Беер-Єрохам; кожен частково відповідає переліку, і жоден не дав напису з назвою. Поза переліками Біблія про нього нічого не каже. Нині цей край — північний Негев Ізраїлю, між Беер-Шевою, Арадом і Єрохамом."
  es:
    - "Baalat-beer, «la señora del pozo», marca el límite meridional de las ciudades de Simeón en el Néguev: la tribu poseía sus ciudades y «todas las aldeas que estaban alrededor de estas ciudades hasta Baalath-beer, que es Ramat del mediodía». La lista paralela de las Crónicas abrevia el nombre a «Baal». La mayoría de los estudiosos la toman por el mismo lugar que Bealot en la lista de ciudades meridionales de Judá y que la «Ramoth al mediodía» a la que David envió una parte del botín tomado a los amalecitas; si es así, fue una ciudad de cierta importancia en la frontera meridional."
    - "Su sitio se ignora. Las propuestas son montículos del valle de Beerseba y de las tierras altas del Néguev, entre ellos Tel Malhata, Tel Ira y Tel Masos, y Beer Yeroham, al sur; cada uno encaja en parte con las listas, y ninguno ha dado una inscripción con el nombre. Más allá de las listas, la Biblia no dice nada de ella. La región es hoy el Néguev septentrional de Israel, entre Beerseba, Arad y Yeroham."
  pt:
    - "Baalate-Beer, “a senhora do poço”, marca o limite sul das cidades de Simeão no Neguev: a tribo possuía suas cidades “e todas as aldeias que estavam ao redor destas cidades até Baalate-Beer, Ramá do Sul”. A lista paralela em Crônicas abrevia o nome para “Baal”. A maioria dos estudiosos a toma pelo mesmo lugar que Bealote, na lista das cidades meridionais de Judá, e que a “Ramote do Sul” a quem Davi enviou parte do despojo tomado aos amalequitas; se assim for, era uma cidade de certa nota na fronteira sul."
    - "Seu sítio é desconhecido. As propostas são montículos do vale de Berseba e das terras altas do Neguev, entre eles Tel Malhata, Tel Ira e Tel Masos, e Beer Yeroham, ao sul; cada um combina em parte com as listas, e nenhum deu uma inscrição com o nome. Além das listas, a Bíblia nada diz dela. A região é hoje o norte do Neguev israelense, entre Berseba, Arade e Yeroham."
  de:
    - "Baalat-Beer, „Herrin des Brunnens“, bezeichnet die Südgrenze der Städte Simeons im Negev: Der Stamm hatte seine Städte „und alle Dörfer, die um diese Städte liegen, bis gen Baalath-Beer-Ramath gegen Mittag“. Die Parallelliste der Chronik kürzt den Namen zu „Baal“. Die meisten Gelehrten halten es für denselben Ort wie Bealot in der Liste der südlichen Städte Judas und wie das „Ramoth im Mittagsland“, wohin David einen Teil der Beute von den Amalekitern sandte; dann war es eine Stadt von einiger Bedeutung an der Südgrenze."
    - "Seine Stätte ist unbekannt. Vorgeschlagen werden Hügel des Beerscheba-Tals und des Negev-Hochlands, darunter Tel Malhata, Tel Ira und Tel Masos, und Beer Jeroham im Süden; jeder passt zu den Listen zum Teil, und keiner hat eine Inschrift mit dem Namen ergeben. Über die Listen hinaus sagt die Bibel nichts von ihm. Die Gegend ist heute der nördliche Negev Israels, zwischen Beerscheba, Arad und Jeroham."
  fr:
    - "Baalath-Beer, « la dame du puits », marque la limite sud des villes de Siméon dans le Négev : la tribu tenait ses villes « et tous les villages aux environs de ces villes, jusqu’à Baalath-Beer, qui est Ramath du midi ». La liste parallèle des Chroniques abrège le nom en « Baal ». La plupart des savants la tiennent pour le même lieu que Bealoth dans la liste des villes méridionales de Juda et que la « Ramoth du midi » à laquelle David envoya une part du butin pris aux Amalécites ; si c’est le cas, c’était une ville de quelque renom à la frontière sud."
    - "Son site est inconnu. Les propositions sont des tertres de la vallée de Beer-Schéba et des hauteurs du Négev, dont Tel Malhata, Tel Ira et Tel Masos, et Beer Yeroham au sud ; chacun s’accorde en partie avec les listes, et aucun n’a livré d’inscription portant le nom. Hors des listes, la Bible n’en dit rien. La région est aujourd’hui le nord du Négev israélien, entre Beer-Schéba, Arad et Yeroham."
  it:
    - "Baalat-Beer, «la signora del pozzo», segna il limite meridionale delle città di Simeone nel Negheb: la tribù teneva le sue città «e tutti i villaggi che stavano attorno a queste città, fino a Baalath-Beer, che è la Rama del sud». L’elenco parallelo delle Cronache abbrevia il nome in «Baal». La maggior parte degli studiosi la ritiene lo stesso luogo di Bealot nell’elenco delle città meridionali di Giuda e della «Ramoth del mezzogiorno» a cui Davide mandò una parte del bottino preso agli Amalechiti; se è così, era una città di qualche rilievo sulla frontiera meridionale."
    - "Il suo sito è ignoto. Le proposte sono tell della valle di Bersabea e degli altopiani del Negheb, fra cui Tel Malhata, Tel Ira e Tel Masos, e Beer Yeroham più a sud; ciascuno si accorda in parte con gli elenchi, e nessuno ha dato un’iscrizione con il nome. Oltre gli elenchi la Bibbia non ne dice nulla. La regione è oggi il Negheb settentrionale di Israele, tra Bersabea, Arad e Yeroham."
  pl:
    - "Baalat-Beer, „pani studni”, wyznacza południową granicę miast Symeona w Negewie: pokolenie miało swe miasta „i wszystkie wsi, które były około tych miast, aż do Baalatbeer, i Ramat ku stronie południowej”. Paralelny wykaz w Księdze Kronik skraca nazwę do „Baal”. Większość uczonych uważa je za to samo miejsce co Bealot w wykazie południowych miast Judy i za „południowe Ramot”, do którego Dawid posłał część łupu zabranego Amalekitom; jeśli tak, było to miasto pewnego znaczenia na południowej granicy."
    - "Jego położenie jest nieznane. Propozycje to telle w dolinie Beer-Szeby i na wyżynie Negewu, wśród nich Tel Malhata, Tel Ira i Tel Masos oraz Beer Jerocham na południu; każdy pasuje do wykazów częściowo i żaden nie dał napisu z nazwą. Poza wykazami Biblia nic o nim nie mówi. Region to dziś północny Negew Izraela, między Beer-Szebą, Aradem i Jerochamem."
  nl:
    - "Baälat-Beër, “de vrouwe van de put”, markeert de zuidgrens van de steden van Simeon in de Negev: de stam bezat zijn steden “en al de dorpen, die rondom deze steden waren, tot Baalath-Beer, dat is Ramath tegen het zuiden”. De parallelle lijst in Kronieken verkort de naam tot “Baal”. De meeste geleerden houden haar voor dezelfde plaats als Bealot in de lijst van Juda’s zuidelijke steden en als het “Ramoth tegen het zuiden” waarheen David een deel van de op de Amalekieten veroverde buit zond; zo ja, dan was het een stad van enig belang aan de zuidgrens."
    - "De ligging is onbekend. De voorstellen zijn heuvels in de vallei van Berseba en het hoogland van de Negev, onder andere Tel Malhata, Tel Ira en Tel Masos, en Beer Yeroham in het zuiden; elk past gedeeltelijk bij de lijsten, en geen heeft een opschrift met de naam opgeleverd. Buiten de lijsten zegt de Bijbel er niets over. De streek is nu de noordelijke Negev van Israël, tussen Berseba, Arad en Yeroham."
  cs:
    - "Báalat-beer, „paní studny“, označuje jižní hranici měst Simeonových v Negevu: kmen držel svá města „I všecky vsi, kteréž byly vůkolí měst těch, až do Balatber a Rámat poledního“. Paralelní seznam v Letopisech zkracuje jméno na „Baal“. Většina badatelů pokládá za totéž místo co Bealót v seznamu jižních měst Judy a co „jižní Rámot“, kam David poslal podíl kořisti vzaté Amalekovcům; pokud ano, bylo to město nemalého významu na jižní hranici."
    - "Jeho místo není známo. Návrhy jsou pahorky údolí Beer-šeby a vysočiny Negevu, mezi nimi Tel Malhata, Tel Ira a Tel Masos a Beer Jerucham na jihu; každý zčásti odpovídá seznamům a žádný nedal nápis se jménem. Mimo seznamy o něm Bible nic neříká. Oblast je dnes severním Negevem Izraele, mezi Beer-šebou, Aradem a Jeruchamem."
