# Overview article (ADR 0007). Mainstream facts only; a Simeonite town known from one list in two copies; its equation with Bealoth and south Ramoth is given as probable; the site is given as unproved: Horvat Uza is Aharoni's identification, which the fort's date and Arad ostracon 24 (men from Kinah sent to Ramat-Negev) tell against, Tel Ira is Lemaire's, Na'aman's and Rainey's, and the map shows the town there with Ramah of the south, Kinah at Horvat Uza; the other candidates and Tel Ira's other claimants named.
id: baalath-beer
place: a03cc2d
title:
  en: "Baalath-beer"
  ru: "Ваалаф-Беер"
  uk: "Ваалат-Беер"
  es: "Baalat-beer"
  pt: "Baalate-Beer"
  de: "Baalat-Beer"
  fr: "Baalath-Beer"
  it: "Baalat-Beer"
  pl: "Baalat-Beer"
  nl: "Baälat-Beër"
  cs: "Báalat-beer"
body:
  en:
    - "Baalath-beer, “the lady of the well”, marks the southern limit of the towns of Simeon in the Negev: the tribe held its cities “and all the villages that were round about these cities to Baalath-beer, Ramath of the south”. The parallel list in Chronicles shortens the name to “Baal”. Many scholars take it to be the same place as Bealoth in the list of Judah's southern towns and as the “south Ramoth” to which David sent a share of the spoil taken from the Amalekites; if so, it was a town of some note on the southern frontier."
    - "The site is not proved. Ramah of the south is taken to be the Ramat-Negev of the Arad ostraca; letter 24 orders men from Arad and from Kinah sent there against Edom, so the two were different forts. Yohanan Aharoni put Ramat-Negev at Horvat Uza (Khirbet Ghazzeh), a fort about 9 km south-east of Tel Arad, and many reference works follow him; but Itzhaq Beit-Arieh, who excavated it, found nothing there earlier than the seventh century BC, the fort is now more often taken for Kinah, above the Wadi el-Qeini that keeps the name, and André Lemaire, Nadav Na'aman and Anson Rainey place Ramat-Negev at Tel Ira (Khirbet Gharra), a walled town of the kings of Judah on a high hill, some 17 km to the west. The map follows them: Baalath-beer stands at Tel Ira with Ramah of the south, Kinah at Horvat Uza."
    - "Tel Ira's own name is unknown: it has also been claimed for Jagur and Kabzeel, and it too has no level of David's day. Tel Malhata and Tel Masos, west along the same valley, and Beer Yeroham farther south have also been named for Baalath-beer, and no site has yielded an inscription with the name. Beyond the lists the Bible says nothing of it. The region is today the northern Negev of Israel, in and around the Beersheba–Arad valley."
  ru:
    - "Ваалаф-Беер, «владычица колодца», отмечает южный предел городов Симеона в Негеве: колену принадлежали его города «и все села, которые находились вокруг городов сих даже до Ваалаф-Беера, или южной Рамы». Параллельный список в Паралипоменоне сокращает имя: «до Ваала». Многие учёные считают его тем же местом, что Валоф в списке южных городов Иуды и Рамоф южный, куда Давид послал долю добычи, взятой у Амаликитян; если так, это был заметный город на южной границе."
    - "Место не доказано. Южную Раму считают тем же Рамат-Негевом, что назван в арадских остраконах; письмо 24 велит послать туда людей из Арада и из Кины против Эдома, то есть это были две разные крепости. Йоханан Аарони поместил Рамат-Негев в Хорват-Узе (Хирбет-Газзе), крепости примерно в 9 км к юго-востоку от Тель-Арада, и многие справочники идут за ним; но Ицхак Бейт-Арье, раскопавший её, не нашёл там ничего старше VII века до н. э., крепость теперь чаще считают Киной, над Вади-эль-Кейни, хранящим это имя, а Андре Лемер, Надав Нааман и Энсон Рейни помещают Рамат-Негев в Тель-Ире (Хирбет-Гарра), укреплённом городе царей Иуды на высоком холме, примерно в 17 км к западу. Карта следует за ними: Ваалаф-Беер стоит в Тель-Ире вместе с южной Рамой, Кина — в Хорват-Узе."
    - "Собственное имя Тель-Иры неизвестно: её называли также Иагуром и Кавцеилом, и слоя времён Давида там тоже нет. Для Ваалаф-Беера называли и Тель-Малхату и Тель-Масос западнее в той же долине и Беэр-Йерохам дальше к югу; ни одно место не дало надписи с этим именем. Кроме списков, Библия о нём ничего не говорит. Эта местность сегодня — северный Негев в Израиле, долина между Беэр-Шевой и Арадом и её окрестности."
  uk:
    - "Ваалат-Беер, «пані колодязя», позначає південну межу міст Симеона в Негеві: плем'я володіло своїми містами та «І всї села навкруги названих городів аж до Баалат-Беера або Рами полуденньої». Паралельний перелік у Хроніках скорочує назву до «Баала». Багато вчених вважають його тим самим місцем, що й Валот у переліку південних міст Юди, і «Рамотом полуденним», до якого Давид послав частку здобичі, взятої в амалекитян: «в Рамотї полуденньому»; якщо так, це було місто певної ваги на південному кордоні."
    - "Місце не доведене. Південну Раму вважають тим самим Рамат-Негевом, що названий в арадських остраконах; лист 24 наказує послати туди людей з Арада і з Кіни проти Едома, тобто це були дві різні фортеці. Йоханан Аарони помістив Рамат-Негев у Хорват-Узі (Хірбет-Газзе), фортеці приблизно за 9 км на південний схід від Тель-Арада, і багато довідників ідуть за ним; але Іцхак Бейт-Арьє, який її розкопав, не знайшов там нічого давнішого за VII століття до н. е., фортецю тепер частіше вважають Кіною, над Ваді-ель-Кейні, що зберігає цю назву, а Андре Лемер, Надав Нааман і Енсон Рейні поміщають Рамат-Негев у Тель-Ірі (Хірбет-Гарра), укріпленому місті царів Юди на високому пагорбі, приблизно за 17 км на захід. Карта йде за ними: Ваалат-Беер стоїть у Тель-Ірі разом із південною Рамою, Кіна — у Хорват-Узі."
    - "Власна назва Тель-Іри невідома: її називали також Ягуром і Кавцеїлом, і шару часів Давида там теж немає. Для Ваалат-Беера називали й Тель-Малхату й Тель-Масос західніше в тій самій долині та Беер-Єрохам далі на півдні; жодне місце не дало напису з цією назвою. Поза переліками Біблія про нього нічого не каже. Нині цей край — північний Негев Ізраїлю, долина між Беер-Шевою та Арадом і її околиці."
  es:
    - "Baalat-beer, «la señora del pozo», marca el límite meridional de las ciudades de Simeón en el Néguev: la tribu poseía sus ciudades y «todas las aldeas que estaban alrededor de estas ciudades hasta Baalath-beer, que es Ramat del mediodía». La lista paralela de las Crónicas abrevia el nombre a «Baal». Muchos estudiosos la toman por el mismo lugar que Bealot en la lista de ciudades meridionales de Judá y que la «Ramoth al mediodía» a la que David envió una parte del botín tomado a los amalecitas; si es así, fue una ciudad de cierta importancia en la frontera meridional."
    - "El sitio no está probado. La Ramá del sur se toma por la Ramat-Negev de los óstraca de Arad; la carta 24 ordena enviar allí hombres de Arad y de Cina contra Edom, así que eran dos fortalezas distintas. Yohanan Aharoni puso Ramat-Negev en Horvat Uza (Khirbet Ghazzeh), fortaleza a unos 9 km al sudeste de Tel Arad, y muchas obras de referencia lo siguen; pero Itzhaq Beit-Arieh, que la excavó, no halló allí nada anterior al siglo VII a. C., la fortaleza se toma hoy más a menudo por Cina, sobre el Wadi el-Qeini que conserva el nombre, y André Lemaire, Nadav Na'aman y Anson Rainey sitúan Ramat-Negev en Tel Ira (Khirbet Gharra), ciudad amurallada de los reyes de Judá sobre una colina alta, unos 17 km al oeste. El mapa los sigue: Baalat-beer está en Tel Ira con la Ramá del sur, Cina en Horvat Uza."
    - "El nombre propio de Tel Ira se desconoce: también se ha propuesto para Jagur y Cabseel, y tampoco tiene un nivel de los días de David. Para Baalat-beer se han nombrado además Tel Malhata y Tel Masos, al oeste en el mismo valle, y Beer Yeroham, más al sur; ningún sitio ha dado una inscripción con el nombre. Fuera de las listas, la Biblia nada dice de ella. La región es hoy el Néguev septentrional de Israel, en el valle de Beerseba–Arad y alrededores."
  pt:
    - "Baalate-Beer, “a senhora do poço”, marca o limite sul das cidades de Simeão no Neguev: a tribo possuía suas cidades “e todas as aldeias que estavam ao redor destas cidades até Baalate-Beer, Ramá do Sul”. A lista paralela em Crônicas abrevia o nome para “Baal”. Muitos estudiosos a tomam pelo mesmo lugar que Bealote, na lista das cidades meridionais de Judá, e que a “Ramote do Sul” a quem Davi enviou parte do despojo tomado aos amalequitas; se assim for, era uma cidade de certa nota na fronteira sul."
    - "O sítio não está provado. A Ramá do Sul é tomada pela Ramat-Negev dos óstracos de Arade; a carta 24 manda enviar para lá homens de Arade e de Quina contra Edom, logo eram duas fortalezas distintas. Yohanan Aharoni pôs Ramat-Negev em Horvat Uza (Khirbet Ghazzeh), fortaleza a cerca de 9 km a sudeste de Tel Arad, e muitas obras de referência o seguem; mas Itzhaq Beit-Arieh, que a escavou, nada achou ali anterior ao século VII a.C., a fortaleza é hoje mais tomada por Quina, sobre o Wadi el-Qeini que guarda o nome, e André Lemaire, Nadav Na'aman e Anson Rainey situam Ramat-Negev em Tel Ira (Khirbet Gharra), cidade murada dos reis de Judá sobre uma colina alta, uns 17 km a oeste. O mapa os segue: Baalate-Beer fica em Tel Ira com a Ramá do Sul, Quina em Horvat Uza."
    - "O nome próprio de Tel Ira é desconhecido: também foi proposto para Jagur e Cabzeel, e tampouco tem um nível dos dias de Davi. Para Baalate-Beer foram nomeados ainda Tel Malhata e Tel Masos, a oeste no mesmo vale, e Beer Yeroham, mais ao sul; nenhum sítio deu uma inscrição com o nome. Além das listas, a Bíblia nada diz dela. A região é hoje o norte do Neguev israelense, no vale de Berseba–Arade e em seus arredores."
  de:
    - "Baalat-Beer, „Herrin des Brunnens“, bezeichnet die Südgrenze der Städte Simeons im Negev: Der Stamm hatte seine Städte „und alle Dörfer, die um diese Städte liegen, bis gen Baalath-Beer-Ramath gegen Mittag“. Die Parallelliste der Chronik kürzt den Namen zu „Baal“. Viele Gelehrte halten es für denselben Ort wie Bealot in der Liste der südlichen Städte Judas und wie das „Ramoth im Mittagsland“, wohin David einen Teil der Beute von den Amalekitern sandte; dann war es eine Stadt von einiger Bedeutung an der Südgrenze."
    - "Die Stätte ist nicht bewiesen. Rama im Süden gilt als das Ramat-Negev der Ostraka von Arad; Brief 24 befiehlt, Männer aus Arad und aus Kina gegen Edom dorthin zu schicken, es waren also zwei verschiedene Festungen. Jochanan Aharoni setzte Ramat-Negev in Horvat Uza (Chirbet Ghazzeh) an, einer Festung etwa 9 km südöstlich von Tel Arad, und viele Nachschlagewerke folgen ihm; doch Itzhaq Beit-Arie, der sie ausgrub, fand dort nichts vor dem 7. Jahrhundert v. Chr., die Festung gilt heute eher als Kina, über dem Wadi el-Qeini, das den Namen bewahrt, und André Lemaire, Nadav Na'aman und Anson Rainey setzen Ramat-Negev in Tel Ira (Chirbet Gharra) an, einer befestigten Stadt der Könige Judas auf einem hohen Hügel, etwa 17 km westlich. Die Karte folgt ihnen: Baalat-Beer steht in Tel Ira mit Rama im Süden, Kina in Horvat Uza."
    - "Der eigene Name von Tel Ira ist unbekannt: Es wurde auch für Jagur und Kabzeel vorgeschlagen, und auch dort fehlt eine Schicht aus Davids Tagen. Für Baalat-Beer wurden ferner Tel Malhata und Tel Masos westlich im selben Tal und Beer Jeroham weiter südlich genannt; keine Stätte ergab eine Inschrift mit dem Namen. Über die Listen hinaus schweigt die Bibel. Die Gegend ist heute der nördliche Negev Israels, im Tal von Beerscheba und Arad und Umgebung."
  fr:
    - "Baalath-Beer, « la dame du puits », marque la limite sud des villes de Siméon dans le Négev : la tribu tenait ses villes « et tous les villages aux environs de ces villes, jusqu’à Baalath-Beer, qui est Ramath du midi ». La liste parallèle des Chroniques abrège le nom en « Baal ». Beaucoup de savants la tiennent pour le même lieu que Bealoth dans la liste des villes méridionales de Juda et que la « Ramoth du midi » à laquelle David envoya une part du butin pris aux Amalécites ; si c’est le cas, c’était une ville de quelque renom à la frontière sud."
    - "Le site n’est pas prouvé. On tient Rama du midi pour la Ramat-Negev des ostraca d’Arad ; la lettre 24 ordonne d’y envoyer des hommes d’Arad et de Kina contre Édom : c’étaient donc deux forts distincts. Yohanan Aharoni a placé Ramat-Negev à Horvat Uza (Khirbet Ghazzeh), un fort à environ 9 km au sud-est de Tel Arad, et bien des ouvrages de référence le suivent ; mais Itzhaq Beit-Arieh, qui l’a fouillé, n’y a rien trouvé d’antérieur au VIIe siècle av. J.-C., le fort passe aujourd’hui plutôt pour Kina, au-dessus du Wadi el-Qeini qui garde le nom, et André Lemaire, Nadav Na’aman et Anson Rainey placent Ramat-Negev à Tel Ira (Khirbet Gharra), ville fortifiée des rois de Juda sur une haute colline, à quelque 17 km à l’ouest. La carte les suit : Baalath-Beer est à Tel Ira avec Rama du midi, Kina à Horvat Uza."
    - "Le nom propre de Tel Ira est inconnu : on l’a aussi proposé pour Jagur et Kabtséel, et il n’a pas non plus de niveau du temps de David. Pour Baalath-Beer on a aussi nommé Tel Malhata et Tel Masos, à l’ouest dans la même vallée, et Beer Yeroham, plus au sud ; aucun site n’a livré d’inscription portant le nom. Hors des listes, la Bible n’en dit rien. La région est aujourd’hui le nord du Négev israélien, dans le bassin de Beer-Schéba–Arad et ses environs."
  it:
    - "Baalat-Beer, «la signora del pozzo», segna il limite meridionale delle città di Simeone nel Negheb: la tribù teneva le sue città «e tutti i villaggi che stavano attorno a queste città, fino a Baalath-Beer, che è la Rama del sud». L’elenco parallelo delle Cronache abbrevia il nome in «Baal». Molti studiosi la ritengono lo stesso luogo di Bealot nell’elenco delle città meridionali di Giuda e della «Ramoth del mezzogiorno» a cui Davide mandò una parte del bottino preso agli Amalechiti; se è così, era una città di qualche rilievo sulla frontiera meridionale."
    - "Il sito non è provato. La Rama del sud è identificata con la Ramat-Negev degli ostraka di Arad; la lettera 24 ordina di mandarvi uomini da Arad e da Kina contro Edom, dunque erano due forti distinti. Yohanan Aharoni pose Ramat-Negev a Horbat Uza (Khirbet Ghazzeh), un forte a circa 9 km a sud-est di Tel Arad, e molte opere di riferimento lo seguono; ma Itzhaq Beit-Arieh, che lo scavò, non vi trovò nulla anteriore al VII secolo a.C., il forte è oggi più spesso preso per Kina, sopra il Wadi el-Qeini che ne conserva il nome, e André Lemaire, Nadav Na’aman e Anson Rainey pongono Ramat-Negev a Tel Ira (Khirbet Gharra), città fortificata dei re di Giuda su un’alta collina, circa 17 km a ovest. La carta li segue: Baalat-Beer sta a Tel Ira con la Rama del sud, Kina a Horbat Uza."
    - "Il nome proprio di Tel Ira è ignoto: è stato proposto anche per Iagur e Cabseel, e neppure lì c’è uno strato dei giorni di Davide. Per Baalat-Beer si sono nominati anche Tel Malhata e Tel Masos, a ovest nella stessa valle, e Beer Yeroham, più a sud; nessun sito ha dato un’iscrizione con il nome. Oltre gli elenchi la Bibbia non ne dice nulla. La regione è oggi il Negheb settentrionale di Israele, nel bacino di Bersabea-Arad e dintorni."
  pl:
    - "Baalat-Beer, „pani studni”, wyznacza południową granicę miast Symeona w Negewie: pokolenie miało swe miasta „i wszystkie wsi, które były około tych miast, aż do Baalatbeer, i Ramat ku stronie południowej”. Paralelny wykaz w Księdze Kronik skraca nazwę do „Baal”. Wielu uczonych uważa je za to samo miejsce co Bealot w wykazie południowych miast Judy i za „południowe Ramot”, do którego Dawid posłał część łupu zabranego Amalekitom; jeśli tak, było to miasto pewnego znaczenia na południowej granicy."
    - "Położenie nie jest dowiedzione. Ramę południową uważa się za Ramat-Negew z ostrakonów z Aradu; list 24 nakazuje posłać tam ludzi z Aradu i z Kiny przeciw Edomowi, były to więc dwie różne twierdze. Yohanan Aharoni umieścił Ramat-Negew w Horwat Uza (Chirbet Ghazzeh), twierdzy około 9 km na południowy wschód od Tel Arad, i wiele opracowań idzie za nim; ale Icchak Beit-Arie, który ją odkopał, nie znalazł tam nic starszego niż VII wiek p.n.e., twierdzę uważa się dziś raczej za Kinę, nad Wadi el-Qeini, które zachowuje tę nazwę, a André Lemaire, Nadav Na'aman i Anson Rainey umieszczają Ramat-Negew w Tel Ira (Chirbet Gharra), obwarowanym mieście królów Judy na wysokim wzgórzu, około 17 km na zachód. Mapa idzie za nimi: Baalat-Beer stoi w Tel Ira razem z Ramą południową, Kina w Horwat Uza."
    - "Własna nazwa Tel Ira jest nieznana: proponowano je także dla Jagur i Kabseel, i tam również brak warstwy z czasów Dawida. Dla Baalat-Beer wymieniano też Tel Malhata i Tel Masos, na zachód w tej samej dolinie, oraz Beer Jerocham dalej na południe; żadne miejsce nie dało napisu z nazwą. Poza wykazami Biblia nic o nim nie mówi. Region to dziś północny Negew Izraela, w basenie Beer-Szeby i Aradu i wokół niego."
  nl:
    - "Baälat-Beër, “de vrouwe van de put”, markeert de zuidgrens van de steden van Simeon in de Negev: de stam bezat zijn steden “en al de dorpen, die rondom deze steden waren, tot Baalath-Beer, dat is Ramath tegen het zuiden”. De parallelle lijst in Kronieken verkort de naam tot “Baal”. Veel geleerden houden haar voor dezelfde plaats als Bealot in de lijst van Juda’s zuidelijke steden en als het “Ramoth tegen het zuiden” waarheen David een deel van de op de Amalekieten veroverde buit zond; zo ja, dan was het een stad van enig belang aan de zuidgrens."
    - "De ligging is niet bewezen. Rama van het zuiden wordt gehouden voor het Ramat-Negev van de ostraca van Arad; brief 24 beveelt mannen uit Arad en uit Kina daarheen te sturen tegen Edom, het waren dus twee verschillende forten. Yohanan Aharoni plaatste Ramat-Negev bij Horvat Uza (Khirbet Ghazzeh), een fort zo’n 9 km ten zuidoosten van Tel Arad, en veel naslagwerken volgen hem; maar Itzhaq Beit-Arieh, die het opgroef, vond er niets ouder dan de zevende eeuw v.Chr., het fort wordt nu eerder voor Kina gehouden, boven de Wadi el-Qeini die de naam bewaart, en André Lemaire, Nadav Na’aman en Anson Rainey plaatsen Ramat-Negev bij Tel Ira (Khirbet Gharra), een versterkte stad van de koningen van Juda op een hoge heuvel, zo’n 17 km westelijker. De kaart volgt hen: Baälat-Beër staat bij Tel Ira met Rama van het zuiden, Kina bij Horvat Uza."
    - "De eigen naam van Tel Ira is onbekend: het is ook voor Jagur en Kabseël voorgesteld, en ook daar ontbreekt een laag uit Davids dagen. Voor Baälat-Beër zijn verder Tel Malhata en Tel Masos, westelijker in dezelfde vallei, en Beer Yeroham, verder zuidelijk, genoemd; geen plaats leverde een opschrift met de naam op. Buiten de lijsten zwijgt de Bijbel erover. De streek is nu de noordelijke Negev van Israël, in en rond het bekken Berseba–Arad."
  cs:
    - "Báalat-beer, „paní studny“, označuje jižní hranici měst Simeonových v Negevu: kmen držel svá města „I všecky vsi, kteréž byly vůkolí měst těch, až do Balatber a Rámat poledního“. Paralelní seznam v Letopisech zkracuje jméno na „Baal“. Mnozí badatelé pokládají za totéž místo co Bealót v seznamu jižních měst Judy a co „jižní Rámot“, kam David poslal podíl kořisti vzaté Amalekovcům; pokud ano, bylo to město nemalého významu na jižní hranici."
    - "Místo není prokázáno. Ráma jižní se pokládá za Rámat-Negev, který jmenují aradská ostraka; dopis 24 přikazuje poslat tam muže z Aradu a z Kiny proti Edómu, šlo tedy o dvě různé pevnosti. Yohanan Aharoni kladl Rámat-Negev do Chorvat Uza (Chirbet Ghazzeh), pevnosti asi 9 km jihovýchodně od Tel Aradu, a mnohé příručky jdou za ním; ale Jicchak Bejt-Arie, který ji vykopal, tam nenašel nic staršího než ze 7. století př. n. l., pevnost se dnes spíše pokládá za Kinu, nad vádím el-Qeini, které jméno uchovává, a André Lemaire, Nadav Na'aman a Anson Rainey kladou Rámat-Negev do Tel Ira (Chirbet Gharra), opevněného města judských králů na vysokém pahorku, asi 17 km na západ. Mapa jde za nimi: Báalat-beer stojí v Tel Ira spolu s Rámou jižní, Kina v Chorvat Uza."
    - "Vlastní jméno Tel Ira není známo: navrhovalo se i pro Jagur a Kabceel a ani tam není vrstva z Davidových dnů. Pro Báalat-beer byly jmenovány i Tel Malhata a Tel Masos západně v témže údolí a Beer Jerucham dále na jihu; žádné místo nedalo nápis se jménem. Mimo seznamy o něm Bible nic neříká. Oblast je dnes severním Negevem Izraele, v pánvi Beer-šeba–Arad a jejím okolí."
