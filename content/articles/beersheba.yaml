body:
  en:
    - "Beersheba lies in the northern Negev, on the edge of the desert, where wells along a broad wadi made settled life possible. The town of the Israelite kings stood on a mound now called Tel Sheva, about 4 km east of the modern city; the Roman and Byzantine town grew up on the site of the modern city. Villages of the Copper Age flourished in the area in the fifth and fourth millennia BC. The excavations directed by Yohanan Aharoni from 1969 found that the mound itself was first settled early in the Iron Age, as a small village of pits and houses."
    - 'In Genesis, Abraham and Abimelech made a covenant here, and the place was called Beer-sheba, "because there they sware both of them"; Abraham planted a grove there and called on the name of the Lord. Isaac''s servants dug a well here, and Jacob set out from Beersheba for Haran and later offered sacrifices here on his way to Egypt. "From Dan even to Beer-sheba" became the phrase for the whole land of Israel. Samuel''s sons were judges in Beersheba, and Elijah fled here from Jezebel.'
    - "In Iron Age II, from about the tenth century BC (the exact date is disputed), the mound became a small walled town of Judah, with a gate, storehouses, a ring of houses built into the wall and a large rock-cut water system. Its last Iron Age city was burned in the late eighth century BC, probably in Sennacherib's campaign of 701 BC. The stones of a large horned altar were found built into a later wall; Aharoni linked its dismantling with Hezekiah's reform, while Yadin linked it with Josiah's reform a century later. Amos warned Israel not to go to Beersheba, and Josiah defiled the high places from Geba to Beersheba."
    - "After the exile Jews lived again in Beersheba and its villages, as Nehemiah records. In Eusebius' day Beersheba was a large village twenty miles south of Hebron with a garrison of Roman soldiers, and it was counted the southern end of Judaea. In the Byzantine period it grew into a town with several churches on the desert frontier."
  ru:
    - "Вирсавия лежит на севере Негева, у края пустыни, где колодцы вдоль широкого русла позволяли жить оседло. Город израильских царей стоял на холме, который теперь называют Тель-Шева, примерно в 4 км к востоку от современного города; римский и византийский город вырос на месте нынешнего. Поселения медного века процветали в этой округе в V–IV тысячелетиях до н. э. Раскопки, которые с 1969 г. вёл Иоханан Ахарони, показали, что сам холм впервые заселили в начале железного века: здесь была небольшая деревня с ямами и домами."
    - "По книге Бытия, Авраам и Авимелех заключили здесь союз, и место назвали Вирсавией, «ибо тут оба они клялись»; Авраам насадил при Вирсавии рощу и призвал там имя Господа. Рабы Исаака выкопали здесь колодезь, а Иаков вышел из Вирсавии в Харран и позже, идя в Египет, принёс здесь жертвы. Слова «от Дана до Вирсавии» стали обозначать всю землю Израиля. Сыновья Самуила были судьями в Вирсавии, а Илия бежал сюда от Иезавели."
    - "В железном веке II, примерно с X века до н. э. (точная дата спорна), холм стал небольшим укреплённым городом Иудеи с воротами, хранилищами, кольцом домов, встроенных в стену, и большой высеченной в скале системой водоснабжения. Последний город железного века сгорел в конце VIII века до н. э., вероятно во время похода Сеннахирима в 701 г. до н. э. Камни большого жертвенника с рогами нашли встроенными в более позднюю стену; Ахарони связывал его разборку с реформой Езекии, а Ядин — с реформой Иосии, на век позже. Амос предостерегал Израиль не ходить в Вирсавию, а Иосия осквернил высоты от Гевы до Вирсавии."
    - "После плена иудеи снова жили в Вирсавии и зависящих от неё городах, как сообщает Неемия. Во времена Евсевия Вирсавия была большим селением в двадцати милях к югу от Хеврона, где стоял гарнизон римских солдат, и её считали южным краем Иудеи. В византийское время она выросла в город с несколькими церквами на границе пустыни."
  uk:
    - "Беер-Шева лежить у північному Негеві, на краю пустелі, де колодязі вздовж широкого вадію зробили можливим осіле життя. Місто ізраїльських царів стояло на пагорбі, який нині зветься Тель-Шева, приблизно за 4 км на схід від сучасного міста; римське й візантійське місто виросло на місці сучасного. Села мідної доби процвітали в цій місцевості у V–IV тисячоліттях до н. е. Розкопки під керівництвом Йоханана Агароні з 1969 року виявили, що сам пагорб уперше заселили на початку залізної доби, як невелике село ям і будинків."
    - "У книзі Буття Авраам та Авімелех уклали тут угоду, і місце назвали Беер-Шева, «бо там клялись обидва»; Авраам посадив там тамариск і призвав ім'я Господа. Слуги Ісаака викопали тут колодязь, а Яків вирушив з Беер-Шеви до Харану і пізніше приніс тут жертви по дорозі до Єгипту. «Від Дана аж до Берсабиї» стало висловом для всієї землі Ізраїлю. Сини Самуїла були суддями в Беер-Шеві, і Елія втік сюди від Єзавелі."
    - "У залізну добу II, приблизно від X століття до н. е. (точна дата спірна), пагорб став невеликим мурованим містом Юди, з брамою, коморами, кільцем будинків, вбудованих у мур, і великою вирубаною в скелі системою водопостачання. Його останнє місто залізної доби було спалене наприкінці VIII століття до н. е., імовірно, під час походу Сінаххеріба 701 р. до н. е. Камені великого рогатого жертовника знайшли вмурованими в пізніший мур; Агароні пов'язував його розбирання з реформою Єзекії, а Ядін — з реформою Йосії століттям пізніше. Амос застерігав Ізраїль не ходити до Беер-Шеви, а Йосія осквернив висоти від Геби до Беер-Шеви."
    - "Після вигнання юдеї знову жили в Беер-Шеві та її селах, як записує Неемія. За Євсевія Беер-Шева була великим селом за двадцять миль на південь від Хеврону з гарнізоном римських солдатів і вважалася південним краєм Юдеї. У візантійський період вона виросла в місто з кількома церквами на пустельному кордоні."
  es:
    - "Beerseba se halla en el Néguev septentrional, en el borde del desierto, donde pozos a lo largo de un amplio uadi hicieron posible la vida sedentaria. La ciudad de los reyes israelitas se alzaba sobre un montículo hoy llamado Tel Sheva, a unos 4 km al este de la ciudad moderna; la ciudad romana y bizantina creció en el sitio de la ciudad moderna. En la zona florecieron aldeas del Calcolítico en los milenios V y IV a. C. Las excavaciones dirigidas por Yohanan Aharoni desde 1969 hallaron que el propio montículo fue habitado por primera vez a comienzos de la edad del Hierro, como una pequeña aldea de fosas y casas."
    - "En el Génesis, Abraham y Abimelec hicieron aquí un pacto, y el lugar fue llamado Beer-seba, «porque allí juraron ambos»; Abraham plantó allí un bosque e invocó el nombre de Jehová. Los siervos de Isaac cavaron aquí un pozo, y Jacob partió de Beerseba hacia Harán y más tarde ofreció aquí sacrificios camino de Egipto. «Desde Dan hasta Beer-seba» se convirtió en la expresión para toda la tierra de Israel. Los hijos de Samuel fueron jueces en Beerseba, y Elías huyó aquí de Jezabel."
    - "En la edad del Hierro II, desde aproximadamente el siglo X a. C. (la fecha exacta se discute), el montículo se convirtió en una pequeña ciudad amurallada de Judá, con puerta, almacenes, un anillo de casas construidas en la muralla y un gran sistema hidráulico excavado en la roca. Su última ciudad de la edad del Hierro fue incendiada a finales del siglo VIII a. C., probablemente en la campaña de Senaquerib de 701 a. C. Las piedras de un gran altar con cuernos se hallaron incorporadas a un muro posterior; Aharoni vinculó su desmantelamiento con la reforma de Ezequías, mientras que Yadin lo vinculó con la reforma de Josías un siglo después. Amós advirtió a Israel que no fuera a Beerseba, y Josías profanó los lugares altos desde Geba hasta Beerseba."
    - "Después del exilio los judíos vivieron de nuevo en Beerseba y sus aldeas, como registra Nehemías. En tiempos de Eusebio Beerseba era una aldea grande a veinte millas al sur de Hebrón con una guarnición de soldados romanos, y se contaba como el extremo meridional de Judea. En el período bizantino creció hasta convertirse en una ciudad con varias iglesias en la frontera del desierto."
  pt:
    - "Berseba fica no norte do Neguev, na borda do deserto, onde poços ao longo de um amplo uádi tornaram possível a vida sedentária. A cidade dos reis de Israel ficava num montículo hoje chamado Tel Sheva, cerca de 4 km a leste da cidade moderna; a cidade romana e bizantina cresceu no lugar da cidade moderna. Aldeias da Idade do Cobre floresceram na área no quinto e quarto milênios a.C. As escavações dirigidas por Yohanan Aharoni a partir de 1969 constataram que o montículo foi povoado pela primeira vez no início da Idade do Ferro, como uma pequena aldeia de fossas e casas."
    - "Em Gênesis, Abraão e Abimeleque fizeram aqui uma aliança, e o lugar foi chamado Berseba, “porque ambos fizeram um juramento ali”; Abraão plantou ali uma tamargueira e invocou o nome do SENHOR. Os servos de Isaque cavaram aqui um poço, e Jacó partiu de Berseba para Harã e depois ofereceu sacrifícios aqui a caminho do Egito. “Desde Dã até Berseba” tornou-se a expressão para toda a terra de Israel. Os filhos de Samuel foram juízes em Berseba, e Elias fugiu para cá de Jezabel."
    - "Na Idade do Ferro II, a partir de cerca do século X a.C. (a data exata é discutida), o montículo tornou-se uma pequena cidade murada de Judá, com porta, armazéns, um anel de casas encostadas à muralha e um grande sistema de água escavado na rocha. Sua última cidade da Idade do Ferro foi queimada no fim do século VIII a.C., provavelmente na campanha de Senaqueribe de 701 a.C. As pedras de um grande altar com chifres foram achadas embutidas num muro posterior; Aharoni ligou o seu desmonte à reforma de Ezequias, e Yadin à de Josias, um século depois. Amós advertiu Israel a não ir a Berseba, e Josias profanou os altos de Geba a Berseba."
    - "Depois do exílio, judeus viveram de novo em Berseba e suas aldeias, como registra Neemias. No tempo de Eusébio, Berseba era uma grande aldeia a vinte milhas ao sul de Hebrom, com guarnição de soldados romanos, e era contada como o extremo sul da Judeia. No período bizantino cresceu até ser uma cidade com várias igrejas na fronteira do deserto."
  de:
    - "Beerscheba liegt im nördlichen Negev am Wüstenrand, wo Brunnen an einem breiten Wadi sesshaftes Leben ermöglichten. Die Stadt der israelitischen Könige stand auf einem Hügel, heute Tel Scheba genannt, etwa 4 km östlich der modernen Stadt; die römische und byzantinische Stadt wuchs an der Stelle der modernen auf. Dörfer der Kupferzeit blühten in der Gegend im 5. und 4. Jahrtausend v. Chr. Die von Yohanan Aharoni seit 1969 geleiteten Grabungen fanden, dass der Hügel selbst erst früh in der Eisenzeit besiedelt wurde, als kleines Dorf aus Gruben und Häusern."
    - "In der Genesis schlossen Abraham und Abimelech hier einen Bund, und der Ort hieß Beerscheba, „weil sie beide miteinander da geschworen haben“; Abraham pflanzte dort einen Hain und rief den Namen des Herrn an. Isaaks Knechte gruben hier einen Brunnen, und Jakob zog von Beerscheba nach Haran und opferte später auf dem Weg nach Ägypten hier: „Und da er gen Beer-Seba kam, opferte er dem Gott seines Vaters Isaak.“ „Von Dan bis gen Beer-Seba“ wurde zur Wendung für das ganze Land Israel. Samuels Söhne waren Richter in Beerscheba, und Elia floh vor Isebel hierher."
    - "In der Eisenzeit II, ab etwa dem 10. Jahrhundert v. Chr. (das genaue Datum ist umstritten), wurde der Hügel eine kleine ummauerte Stadt Judas mit Tor, Magazinen, einem Ring von in die Mauer gebauten Häusern und einem großen in den Fels gehauenen Wassersystem. Ihre letzte eisenzeitliche Stadt wurde im späten 8. Jahrhundert v. Chr. verbrannt, wohl auf Sanheribs Feldzug 701 v. Chr. Die Steine eines großen Hörneraltars wurden in eine spätere Mauer eingebaut gefunden; Aharoni verband seinen Abbau mit Hiskias Reform, Yadin mit der Reform Josias ein Jahrhundert später. Amos warnte Israel, nach Beerscheba zu gehen, und Josia verunreinigte die Höhen „von Geba an bis gen Beer-Seba“."
    - "Nach dem Exil wohnten Juden wieder in Beerscheba und seinen Dörfern, wie Nehemia berichtet. Zu Eusebius' Zeit war Beerscheba ein großes Dorf zwanzig Meilen südlich von Hebron mit einer Garnison römischer Soldaten und galt als Südende Judäas. In byzantinischer Zeit wuchs es zu einer Stadt mit mehreren Kirchen an der Wüstengrenze."
  fr:
    - "Beer-Schéba se trouve dans le nord du Négev, au bord du désert, là où des puits le long d’un large oued rendaient possible une vie sédentaire. La ville des rois d’Israël s’élevait sur un tertre appelé aujourd’hui Tel Sheva, à environ 4 km à l’est de la ville moderne ; la ville romaine et byzantine grandit à l’emplacement de la ville moderne. Des villages du Chalcolithique prospérèrent dans la région aux Ve et IVe millénaires av. J.-C. Les fouilles dirigées par Yohanan Aharoni à partir de 1969 ont montré que le tertre lui-même fut d’abord peuplé au début de l’âge du Fer, comme un petit village de fosses et de maisons."
    - "Dans la Genèse, Abraham et Abimélec firent alliance ici, et le lieu fut appelé Beer-Schéba, « car c’est là qu’ils jurèrent l’un et l’autre » ; Abraham y planta un bosquet et invoqua le nom du Seigneur. Les serviteurs d’Isaac y creusèrent un puits, et Jacob partit de Beer-Schéba pour Haran et y offrit plus tard des sacrifices en allant en Égypte. « Depuis Dan jusqu’à Beer-Schéba » devint l’expression désignant tout le pays d’Israël. Les fils de Samuel furent juges à Beer-Schéba, et Élie s’y enfuit devant Jézabel."
    - "À l’âge du Fer II, vers le Xe siècle av. J.-C. (la date exacte est discutée), le tertre devint une petite ville fortifiée de Juda, avec une porte, des magasins, une couronne de maisons adossées au rempart et un grand système hydraulique creusé dans le roc. Sa dernière ville de l’âge du Fer fut brûlée à la fin du VIIIe siècle av. J.-C., probablement lors de la campagne de Sanchérib en 701 av. J.-C. Les pierres d’un grand autel à cornes furent trouvées remployées dans un mur plus tardif ; Aharoni rattacha son démantèlement à la réforme d’Ézéchias, Yadin à celle de Josias un siècle plus tard. Amos avertit Israël de ne pas aller à Beer-Schéba, et Josias souilla les hauts lieux de Guéba à Beer-Schéba."
    - "Après l’exil, des Juifs habitèrent de nouveau Beer-Schéba et ses villages, comme le note Néhémie. Du temps d’Eusèbe, Beer-Schéba était un grand village à vingt milles au sud d’Hébron avec une garnison de soldats romains, et on la comptait pour l’extrémité sud de la Judée. À l’époque byzantine, elle devint une ville avec plusieurs églises à la frontière du désert."
  it:
    - "Bersabea si trova nel Negheb settentrionale, al margine del deserto, dove pozzi lungo un ampio wadi resero possibile la vita sedentaria. La città dei re israeliti sorgeva su un tell oggi chiamato Tel Sheva, a circa 4 km a est della città moderna; la città romana e bizantina crebbe sul sito della città moderna. Villaggi dell’età del Rame fiorirono nella zona nel V e IV millennio a.C. Gli scavi diretti da Yohanan Aharoni dal 1969 hanno trovato che il tell stesso fu abitato per la prima volta all’inizio dell’età del Ferro, come piccolo villaggio di fosse e case."
    - "Nella Genesi, Abramo e Abimelech vi fecero alleanza, e il luogo fu chiamato Beer-Sceba, «perché ambedue vi avean fatto giuramento»; Abramo vi piantò un tamarindo e invocò il nome del Signore. I servi di Isacco vi scavarono un pozzo, e Giacobbe partì da Bersabea per Carran e più tardi vi offrì sacrifici in viaggio verso l’Egitto. «Da Dan fino a Beer-Sceba» divenne l’espressione per l’intero paese d’Israele. I figli di Samuele erano giudici a Bersabea, ed Elia vi fuggì da Gezabele."
    - "Nell’età del Ferro II, dal X secolo a.C. circa (la data esatta è discussa), il tell divenne una piccola città murata di Giuda, con una porta, magazzini, un anello di case costruite nel muro e un grande sistema idrico scavato nella roccia. La sua ultima città dell’età del Ferro fu bruciata alla fine dell’VIII secolo a.C., probabilmente nella campagna di Sennacherib del 701 a.C. Le pietre di un grande altare con corna furono trovate inserite in un muro posteriore; Aharoni ne collegò lo smantellamento alla riforma di Ezechia, mentre Yadin alla riforma di Giosia un secolo dopo. Amos avvertì Israele di non andare a Bersabea, e Giosia contaminò gli alti luoghi «da Gheba a Beer-Sceba»."
    - "Dopo l’esilio i Giudei abitarono di nuovo a Bersabea e nei suoi villaggi, come registra Neemia. Ai giorni di Eusebio Bersabea era un grande villaggio a venti miglia a sud di Ebron con una guarnigione di soldati romani, ed era contata come l’estremità meridionale della Giudea. In epoca bizantina crebbe fino a diventare una città con diverse chiese sulla frontiera del deserto."
  pl:
    - "Beer-Szeba leży w północnym Negewie, na skraju pustyni, gdzie studnie wzdłuż szerokiego wadi umożliwiły osiadłe życie. Miasto królów izraelskich stało na tellu zwanym dziś Tel Szewa, około 4 km na wschód od współczesnego miasta; miasto rzymskie i bizantyjskie wyrosło na miejscu współczesnego. Wsie chalkolityczne kwitły w okolicy w V i IV tysiącleciu p.n.e. Wykopaliska prowadzone przez Yohanana Aharoniego od 1969 roku wykazały, że sam tell został zasiedlony po raz pierwszy na początku epoki żelaza, jako mała wieś jam i domów."
    - "W Księdze Rodzaju Abraham i Abimelek zawarli tu przymierze, a miejsce nazwano Beerseba, „albowiem tam obaj przysięgli”; Abraham zasadził tam gaj i wzywał imienia Pana. Słudzy Izaaka wykopali tu studnię, a Jakub wyruszył z Beer-Szeby do Charanu i później składał tu ofiary w drodze do Egiptu. „Od Dan aż do Beerseba” stało się wyrażeniem na całą ziemię Izraela. Synowie Samuela byli sędziami w Beer-Szebie, a Eliasz uciekł tu przed Izebel."
    - "W epoce żelaza II, od około X wieku p.n.e. (dokładna data jest sporna), tell stał się małym obwarowanym miastem Judy z bramą, magazynami, pierścieniem domów wbudowanych w mur i wielkim wykutym w skale systemem wodnym. Jego ostatnie miasto z epoki żelaza spalono pod koniec VIII wieku p.n.e., prawdopodobnie w kampanii Sennacheryba z 701 r. p.n.e. Kamienie wielkiego rogatego ołtarza znaleziono wbudowane w późniejszy mur; Aharoni wiązał jego rozbiórkę z reformą Ezechiasza, a Yadin z reformą Jozjasza sto lat później. Amos ostrzegał Izraela, by nie szedł do Beer-Szeby, a Jozjasz splugawił wyżyny od Geba do Beer-Szeby."
    - "Po wygnaniu Żydzi znów mieszkali w Beer-Szebie i jej wsiach, jak zapisał Nehemiasz. Za czasów Euzebiusza Beer-Szeba była dużą wsią dwadzieścia mil na południe od Hebronu z garnizonem żołnierzy rzymskich i liczono ją jako południowy kraniec Judei. W okresie bizantyjskim wyrosła na miasto z kilkoma kościołami na pustynnej granicy."
  nl:
    - "Berseba ligt in de noordelijke Negev, aan de rand van de woestijn, waar putten langs een brede wadi een gevestigd bestaan mogelijk maakten. De stad van de Israëlitische koningen stond op een heuvel die nu Tel Seva heet, zo’n 4 km ten oosten van de moderne stad; de Romeinse en Byzantijnse stad groeide op de plaats van de moderne stad. Dorpen uit het kopertijdperk bloeiden in de streek in het vijfde en vierde millennium v.Chr. De opgravingen onder leiding van Yohanan Aharoni vanaf 1969 vonden dat de heuvel zelf pas vroeg in de ijzertijd werd bewoond, als een klein dorp van kuilen en huizen."
    - "In Genesis sloten Abraham en Abimelech hier een verbond, en de plaats werd Ber-seba genoemd, “omdat die beiden daar gezworen hadden”; Abraham plantte er een bos en riep de Naam van de HEER aan. Isaaks knechten groeven hier een put, en Jakob vertrok van Berseba naar Haran en bracht er later offers op weg naar Egypte. “Van Dan tot Ber-seba toe” werd de uitdrukking voor het hele land Israël. Samuëls zonen waren rechters in Berseba, en Elia vluchtte hierheen voor Izebel."
    - "In de ijzertijd II, vanaf ongeveer de tiende eeuw v.Chr. (de precieze datum is omstreden), werd de heuvel een kleine ommuurde stad van Juda, met een poort, voorraadhuizen, een ring van huizen in de muur gebouwd en een groot in de rots uitgehouwen watersysteem. Haar laatste ijzertijdstad werd in de late achtste eeuw v.Chr. verbrand, waarschijnlijk in Sanheribs veldtocht van 701 v.Chr. De stenen van een groot altaar met hoornen werden ingebouwd in een latere muur gevonden; Aharoni verbond de afbraak ervan met Chizkia’s hervorming, Yadin met die van Josia een eeuw later. Amos waarschuwde Israël niet naar Berseba te gaan, en Josia verontreinigde de hoogten van Geba tot Berseba."
    - "Na de ballingschap woonden Joden weer in Berseba en zijn dorpen, zoals Nehemia vermeldt. In Eusebius’ tijd was Berseba een groot dorp, twintig mijl ten zuiden van Hebron, met een garnizoen van Romeinse soldaten, en het gold als het zuidelijke einde van Judea. In de Byzantijnse tijd groeide het uit tot een stad met verscheidene kerken aan de woestijngrens."
  cs:
    - "Beer-šeba leží v severním Negevu, na okraji pouště, kde studny podél širokého vádí umožnily osídlený život. Město izraelských králů stálo na pahorku dnes zvaném Tel Sheva, asi 4 km východně od moderního města; římské a byzantské město vyrostlo na místě moderního města. Vesnice z doby měděné zde vzkvétaly v 5. a 4. tisíciletí př. n. l. Vykopávky vedené Yohananem Aharonim od roku 1969 zjistily, že samotný pahorek byl poprvé osídlen časně v době železné, jako malá vesnice jam a domů."
    - "V Genesis zde Abraham a Abimelek uzavřeli smlouvu a místo bylo nazváno Beer-šeba, „že tu oba dva přisáhli“; Abraham tam zasadil háj a „vzýval tam jméno Hospodina“. Izákovi služebníci zde vykopali studnu a Jákob vyšel z Beer-šeby do Cháranu a později zde obětoval na cestě do Egypta. „Od Dan až do Bersabé“ se stalo rčením pro celou zemi Izraele. Samuelovi synové byli soudci v Beer-šebě a Elijáš sem utekl před Jezábel."
    - "V době železné II, zhruba od 10. století př. n. l. (přesné datum je sporné), se pahorek stal malým opevněným městem Judy s branou, skladišti, prstencem domů zabudovaných do hradby a velkým vodním systémem vytesaným ve skále. Jeho poslední město doby železné bylo spáleno koncem 8. století př. n. l., pravděpodobně při Senacheribově tažení roku 701 př. n. l. Kameny velkého oltáře s rohy byly nalezeny zazděné do pozdější zdi; Aharoni spojil jeho rozebrání s Chizkijášovou reformou, zatímco Yadin je spojil s Jošijášovou reformou o století později. Amos varoval Izrael, aby nechodil do Beer-šeby, a Jošijáš poskvrnil výšiny od Geby do Beer-šeby."
    - "Po vyhnanství v Beer-šebě a jejích vesnicích opět žili Židé, jak zaznamenává Nehemjáš. Za Eusebiových dnů byla Beer-šeba velkou vesnicí dvacet mil jižně od Hebronu s posádkou římských vojáků a počítala se za jižní konec Judska. V byzantském období vyrostla v město s několika kostely na pouštní hranici."
  sv:
    - "Beer Sheva ligger i norra Negev, vid ökens kant, där brunnar längs en bred wadi gjorde bofast liv möjligt. Israelitiska kungars stad låg på en kulle som nu kallas Tel Sheva, omkring 4 km öster om den moderna staden; den romerska och bysantinska staden växte upp på den moderna stadens plats. Byar från kopparåldern blomstrade i trakten under femte och fjärde årtusendet f.Kr. Utgrävningarna under ledning av Yohanan Aharoni från 1969 visade att själva kullen först bosattes tidigt under järnåldern, som en liten by av gropar och hus."
    - "I Första Mosebok slöt Abraham och Avimelek ett förbund här, och platsen kallades Beer Sheva, ”eftersom de båda där gingo eden”; Abraham planterade en lund där och åkallade Herrens namn. Isaks tjänare grävde en brunn här, och Jakob bröt upp från Beer Sheva till Harran och offrade senare här på väg till Egypten. ”Från Dan ända till Beer-Seba” blev uttrycket för hela Israels land. Samuels söner var domare i Beer Sheva, och Elia flydde hit från Isebel."
    - "Under järnålder II, från omkring 900-talet f.Kr. (den exakta tiden är omstridd), blev kullen en liten muromgärdad stad i Juda, med en port, förrådshus, en ring av hus byggda in i muren och ett stort bergshugget vattensystem. Dess sista järnåldersstad brändes i slutet av 700-talet f.Kr., sannolikt under Sanheribs fälttåg år 701 f.Kr. Stenarna från ett stort hornaltare hittades inbyggda i en senare mur; Aharoni knöt dess nedrivning till Hiskias reform, medan Yadin knöt den till Josias reform ett sekel senare. Amos varnade Israel för att gå till Beer Sheva, och Josia orenade offerhöjderna från Geba till Beer Sheva."
    - "Efter exilen bodde judar åter i Beer Sheva och dess byar, som Nehemja berättar. På Eusebios’ tid var Beer Sheva en stor by tjugo romerska mil söder om Hebron med en garnison av romerska soldater, och den räknades som Judeens södra ände. Under bysantinsk tid växte den till en stad med flera kyrkor vid ökengränsen."
  nb:
    - "Beer-Sjeba ligger i nordlige Negev, i kanten av ørkenen, der brønner langs en bred wadi gjorde fast bosetning mulig. Israelittkongenes by lå på en tell som nå kalles Tel Sjeva, omtrent 4 km øst for den moderne byen; den romerske og bysantinske byen vokste opp der den moderne byen ligger. Landsbyer fra kobberalderen blomstret i området i det femte og fjerde årtusen f.Kr. Utgravningene ledet av Yohanan Aharoni fra 1969 fant at selve tellen først ble bosatt tidlig i jernalderen, som en liten landsby av groper og hus."
    - "I 1. Mosebok sluttet Abraham og Abimelek en pakt her, og stedet ble kalt Beer-Sjeba, «for der gjorde de begge sin ed»; Abraham plantet der «en tamarisk» og påkalte Herrens navn. Isaks tjenere gravde en brønn her, og Jakob la ut fra Beer-Sjeba til Harran og ofret senere slaktoffer her på veien til Egypt. «Fra Dan til Be'erseba» ble vendingen for hele Israels land. Samuels sønner «dømte i Be'erseba», og Elia flyktet hit fra Jesabel."
    - "I jernalder II, fra omkring 900-tallet f.Kr. (den nøyaktige dateringen er omstridt), ble tellen en liten befestet by i Juda, med en port, lagerhus, en ring av hus bygd inn i muren og et stort fjellhugget vannsystem. Dens siste jernalderby ble brent sent på 700-tallet f.Kr., trolig i Sankeribs felttog i 701 f.Kr. Steinene fra et stort alter med horn ble funnet innbygd i en senere mur; Aharoni knyttet nedrivingen til Hiskias reform, mens Yadin knyttet den til Josjias reform et århundre senere. Amos advarte Israel mot å «dra over til Be'erseba», og Josjia gjorde høydene urene «fra Geba til Be'erseba»."
    - "Etter eksilet bodde jøder igjen i Beer-Sjeba og landsbyene dens, slik Nehemja forteller. På Eusebius' tid var Beer-Sjeba en stor landsby tjue romerske mil sør for Hebron med en garnison av romerske soldater, og den ble regnet som sørenden av Judea. I bysantinsk tid vokste den til en by med flere kirker på ørkengrensen."
  tl:
    - "Ang Beer-seba ay nasa hilagang Negev, sa gilid ng disyerto, kung saan ang mga balon sa tabi ng malawak na wadi ang nagpahintulot ng pamumuhay na nakatigil. Ang bayan ng mga haring Israelita ay nakatayo sa burol na tinatawag ngayong Tel Sheva, mga 4 km sa silangan ng makabagong lungsod; ang bayang Romano at Bisantino ay lumaki sa lugar ng makabagong lungsod. Umunlad ang mga nayon ng Panahong Kalkolitiko sa lugar noong ikalima at ikaapat na milenyo BK. Natuklasan ng mga paghuhukay sa pamumuno ni Yohanan Aharoni mula 1969 na unang tinirhan ang burol mismo sa simula ng Panahon ng Bakal, bilang maliit na nayon ng mga hukay at bahay."
    - "Sa Genesis, gumawa rito ng tipan sina Abraham at Abimelech, at tinawag ang lugar na Beer-seba, “sapagka't doon sila kapuwa nanumpa”; nagtanim doon si Abraham ng puno at tumawag sa pangalan ng Panginoon. Humukay ng balon dito ang mga lingkod ni Isaac, at umalis si Jacob mula Beer-seba patungong Haran at kalaunan ay naghandog dito ng mga hain sa daan patungong Egipto. Ang “mula sa Dan hanggang sa Beer-seba” ay naging pariralang tumutukoy sa buong lupain ng Israel. Mga hukom ang mga anak ni Samuel sa Beer-seba, at tumakas dito si Elias kay Jezabel."
    - "Sa Panahon ng Bakal II, mula mga ika-10 siglo BK (pinagtatalunan ang eksaktong petsa), ang burol ay naging maliit na bayang may pader ng Juda, na may pintuan, mga bodega, bilog ng mga bahay na nakadugtong sa pader at malaking sistema ng tubig na inukit sa bato. Ang huling lungsod nito sa Panahon ng Bakal ay nasunog noong huling bahagi ng ika-8 siglo BK, marahil sa kampanya ni Sennacherib noong 701 BK. Natagpuan ang mga bato ng malaking altar na may sungay na nakabaon sa isang kalaunang pader; iniugnay ni Aharoni ang pagbuwag nito sa reporma ni Ezechias, samantalang iniugnay ito ni Yadin sa reporma ni Josias isang siglo kalaunan. Binalaan ni Amos ang Israel na huwag magtungo sa Beer-seba, at nilapastangan ni Josias ang mga matataas na dako mula Geba hanggang Beer-seba."
    - "Pagkatapos ng pagkabihag, muling tumira ang mga Judio sa Beer-seba at sa mga nayon nito, gaya ng itinatala ni Nehemias. Noong panahon ni Eusebio, ang Beer-seba ay malaking nayon dalawampung milya sa timog ng Hebron na may garison ng mga sundalong Romano, at ibinibilang itong katimugang dulo ng Judea. Sa panahong Bisantino, lumaki ito bilang bayan na may ilang simbahan sa hangganan ng disyerto."
  da:
    - "Beersheba ligger i det nordlige Negev, ved ørkenens rand, hvor brønde langs en bred wadi gjorde fast bosættelse mulig. Israels kongers by lå på en tell, der nu kaldes Tel Sheva, omkring 4 km øst for den moderne by; den romerske og byzantinske by voksede op på den moderne bys sted. Landsbyer fra kobberalderen blomstrede i området i 5. og 4. årtusinde f.Kr. De udgravninger, Yohanan Aharoni ledede fra 1969, fandt, at selve tellen først blev bosat tidligt i jernalderen, som en lille landsby af gruber og huse."
    - "I Første Mosebog sluttede Abraham og Abimelek en pagt her, og stedet blev kaldt Beer-Sjeva, »thi der svore de begge«; Abraham plantede en lund dér og påkaldte Herrens navn. Isaks tjenere gravede en brønd her, og Jakob brød op fra Beersheba til Karan og ofrede senere her på sin vej til Egypten. »Fra Dan indtil Beersaba« blev udtrykket for hele Israels land. Samuels sønner var dommere i Beersheba, og Elija flygtede hertil fra Jezabel."
    - "I jernalder 2, fra omkring 900-tallet f.Kr. (den nøjagtige datering er omstridt), blev tellen en lille befæstet by i Juda, med en port, forrådsrum, en ring af huse bygget ind i muren og et stort klippehugget vandsystem. Dens sidste jernalderby blev brændt i slutningen af 700-tallet f.Kr., sandsynligvis på Sankeribs felttog i 701 f.Kr. Stenene fra et stort hornalter blev fundet indbygget i en senere mur; Aharoni knyttede dets nedtagning til Hizkijas reform, mens Yadin knyttede den til Josias' reform et århundrede senere. Amos advarede Israel mod at gå til Beersheba, og Josias vanhelligede offerhøjene »fra Geba indtil Beersaba«."
    - "Efter eksilet boede jøder igen i Beersheba og dens landsbyer, som Nehemias beretter. I Eusebios' dage var Beersheba en stor landsby tyve romerske mil syd for Hebron med en garnison af romerske soldater, og den regnedes for Judæas sydlige ende. I den byzantinske periode voksede den til en by med flere kirker ved ørkengrænsen."
  sr:
    - "Вирсавеја лежи у северном Негеву, на ивици пустиње, где су бунари дуж широког вадија омогућавали стални живот. Град израиљских краљева стајао је на хумци која се сада зове Тел Сева, око 4 км источно од савременог града; римски и византијски град никао је на месту савременог града. Села халколита цветала су у том крају у петом и четвртом миленијуму п. н. е. Ископавања која је од 1969. водио Јоханан Ахарони открила су да је сама хумка први пут насељена почетком гвозденог доба, као мало село јама и кућа."
    - "У Постању су Аврам и Авимелех овде склопили савез, а место је названо Вирсавеја, „јер се онде заклеше обојица“; Аврам је тамо посадио луг и призвао име Господње. Исакове слуге су ту ископале студенац, а Јаков је кренуо из Вирсавеје у Харан и касније овде принео жртве на путу у Египат. „Од Дана до Вирсавеје“ постало је израз за целу земљу Израиљеву. Самуилови синови су судили у Вирсавеји, а Илија је овамо побегао од Језавеље."
    - "У гвозденом добу II, од око 10. века п. н. е. (тачан датум је спорен), хумка је постала мали зидани град Јуде, с капијом, складиштима, прстеном кућа уграђених у зид и великим водоводним системом уклесаним у стену. Њен последњи град гвозденог доба спаљен је крајем 8. века п. н. е., вероватно у Сенахиримовом походу 701. п. н. е. Камење великог рогатог жртвеника нађено је уграђено у каснији зид; Ахарони је његово растављање повезао са Језекијином реформом, а Јадин са Јосијином реформом век касније. Амос је упозорио Израиља да не иде у Вирсавеју, а Јосија је оскврнио висине „од Геве до Вирсавеје“."
    - "После изгнанства Јевреји су поново живели у Вирсавеји и њеним селима, како бележи Немија. У Јевсевијево доба Вирсавеја је била велико село двадесет миља јужно од Хеврона са гарнизоном римских војника и рачунала се као јужни крај Јудеје. У византијско доба израсла је у град са неколико цркава на пустињској граници."
  hu:
    - "Beérseba az északi Negevben fekszik, a sivatag szélén, ahol egy széles vádi menti kutak tették lehetővé a letelepedett életet. Az izraelita királyok városa a ma Tel Sevának nevezett halmon állt, a mai várostól mintegy 4 km-re keletre; a római és bizánci város a mai város helyén nőtt fel. A rézkor falvai a Kr. e. 5. és 4. évezredben virágoztak a környéken. Yohanan Aharoni 1969-től vezetett ásatásai kimutatták, hogy maga a halom a vaskor elején települt be először, gödrökből és házakból álló kis faluként."
    - "A Teremtés könyvében Ábrahám és Abimélek itt kötött szövetséget, és a helyet Beérsebának nevezték, „mivelhogy ott esküdtek vala meg mind a ketten”; Ábrahám ligetet ültetett ott, és segítségül hívta az Úr nevét. Izsák szolgái itt ástak kutat, Jákób Beérsebából indult Hárán felé, és később itt mutatott be áldozatokat Egyiptomba menet. „Dántól fogva Bersebáig” lett a kifejezés egész Izráel földjére. Sámuel fiai Beérsebában voltak bírák, Illés pedig ide menekült Jézabel elől."
    - "A vaskor II-ben, mintegy a Kr. e. 10. századtól (a pontos dátum vitatott) a halom Júda kis fallal körülvett városa lett, kapuval, raktárakkal, a falba épített házgyűrűvel és nagy sziklába vájt vízrendszerrel. Utolsó vaskori városa a Kr. e. 8. század végén leégett, valószínűleg Szanhérib Kr. e. 701-es hadjáratában. Egy nagy szarvas oltár kövei egy későbbi falba beépítve kerültek elő; Aharoni lebontását Ezékiás reformjával hozta összefüggésbe, Yadin pedig egy évszázaddal későbbi Jósiás-féle reformmal. Ámós óva intette Izráelt, hogy ne menjen Beérsebába, Jósiás pedig megfertőztette a magaslatokat „Gebától egész Beersebáig”."
    - "A száműzetés után a zsidók ismét laktak Beérsebában és falvaiban, ahogy Nehémiás feljegyzi. Euszébiosz napjaiban Beérseba nagy falu volt Hebrontól húsz mérföldre délre, római katonák helyőrségével, és Júdea déli végének számították. A bizánci korban több templommal rendelkező várossá nőtt a sivatagi határon."
  fi:
    - "Beerseba sijaitsee pohjoisessa Negevissä, aavikon reunalla, missä leveän wadin varrella olevat kaivot tekivät asutun elämän mahdolliseksi. Israelin kuninkaiden kaupunki sijaitsi nykyisin Tel Sevaksi kutsutulla kumpareella, noin 4 km nykyisestä kaupungista itään; roomalainen ja bysanttilainen kaupunki kasvoi nykyisen kaupungin paikalle. Kuparikauden kylät kukoistivat alueella viidennellä ja neljännellä vuosituhannella eaa. Yohanan Aharonin johtamat kaivaukset vuodesta 1969 osoittivat, että kumpu itse asutettiin ensi kerran rautakauden alussa pienenä kuoppien ja talojen kylänä."
    - "1. Mooseksen kirjassa Abraham ja Abimelek tekivät tässä liiton, ja paikkaa kutsuttiin Beersebaksi, ”koska he molemmat vannoivat siinä toisilleen valan”; Abraham istutti sinne lehdon ja huusi avuksi Herran nimeä. Iisakin palvelijat kaivoivat täällä kaivon, ja Jaakob lähti Beersebasta Harraniin ja uhrasi myöhemmin täällä matkallaan Egyptiin. ”Daanista aina Beersebaan saakka” tuli ilmaus koko Israelin maasta. Samuelin pojat olivat tuomareita Beersebassa, ja Elia pakeni tänne Isebelia."
    - "Rautakaudella II, noin 900-luvulta eaa. (tarkka ajoitus on kiistanalainen), kumpu muuttui pieneksi Juudan muurein ympäröidyksi kaupungiksi, jossa oli portti, varastohuoneita, muuriin rakennettu talorengas ja suuri kallioon hakattu vesijärjestelmä. Sen viimeinen rautakauden kaupunki poltettiin 700-luvun lopulla eaa., luultavasti Sanheribin 701 eaa. sotaretkessä. Suuren sarvialttarin kivet löydettiin myöhempään muuriin rakennettuina; Aharoni yhdisti sen purkamisen Hiskian uudistukseen, Yadin Josian uudistukseen vuosisata myöhemmin. Aamos varoitti Israelia menemästä Beersebaan, ja Josia saastutti uhrikukkulat Gebasta Beersebaan."
    - "Pakkosiirtolaisuuden jälkeen juutalaiset asuivat taas Beersebassa ja sen kylissä, kuten Nehemia kertoo. Eusebioksen aikana Beerseba oli suuri kylä kaksikymmentä mailia Hebronista etelään roomalaisen sotilasvaruskunnan kanssa, ja sitä pidettiin Juudean eteläpäänä. Bysanttilaisella kaudella se kasvoi kaupungiksi, jossa oli useita kirkkoja aavikkorajalla."
  vi:
    - "Bê-e-Sê-ba nằm ở bắc Nê-ghép, ở rìa sa mạc, nơi các giếng dọc một wadi rộng khiến đời sống định cư có thể thực hiện. Thành của các vua Y-sơ-ra-ên đứng trên một gò nay gọi là Tel Sheva, cách thành phố hiện đại khoảng 4 km về phía đông; thành La Mã và Byzantine mọc lên trên địa điểm của thành phố hiện đại. Các làng thời Đồ Đồng-Đá hưng thịnh trong vùng vào thiên niên kỷ thứ năm và thứ tư TCN. Các cuộc khai quật do Yohanan Aharoni chỉ đạo từ năm 1969 cho thấy bản thân gò lần đầu có người ở vào đầu thời Đồ Sắt, như một làng nhỏ gồm hố và nhà."
    - "Trong Sáng Thế Ký, Áp-ra-ham và A-bi-mê-léc lập giao ước tại đây, và nơi này được gọi là Bê-e-Sê-ba, “vì tại đó hai người đều đã thề nguyện cùng nhau”; Áp-ra-ham trồng một cây me tại đó và cầu khẩn danh Đức Giê-hô-va. Các đầy tớ của Y-sác đào một cái giếng ở đây, và Gia-cốp lên đường từ Bê-e-Sê-ba đi Cha-ran và về sau dâng tế lễ tại đây trên đường sang Ê-díp-tô. “Từ Đan cho đến Bê-e-sê-ba” trở thành cách nói chỉ toàn xứ Y-sơ-ra-ên. Các con của Sa-mu-ên làm quan xét ở Bê-e-Sê-ba, và Ê-li chạy trốn Giê-sa-bên đến đây."
    - "Vào Đồ Sắt II, từ khoảng thế kỷ 10 TCN (niên đại chính xác còn tranh cãi), gò trở thành một thị trấn nhỏ có tường của Giu-đa, với một cổng, các kho chứa, một vòng nhà xây vào tường và một hệ thống nước đục trong đá lớn. Thành Đồ Sắt cuối cùng của nó bị đốt vào cuối thế kỷ 8 TCN, có lẽ trong chiến dịch của San-chê-ríp năm 701 TCN. Các tảng đá của một bàn thờ lớn có sừng được tìm thấy xây vào một bức tường về sau; Aharoni gắn việc tháo dỡ nó với cuộc cải cách của Ê-xê-chia, còn Yadin gắn với cuộc cải cách của Giô-si-a một thế kỷ sau. A-mốt cảnh báo Y-sơ-ra-ên “đừng đi đến Bê-e-Sê-ba”, và Giô-si-a làm ô uế các nơi cao “từ Ghê-ba cho đến Bê-e-Sê-ba”."
    - "Sau cuộc lưu đày, người Do Thái lại sống ở Bê-e-Sê-ba và các làng của nó, như Nê-hê-mi ghi lại. Vào thời Eusebius, Bê-e-Sê-ba là một làng lớn cách Hếp-rôn hai mươi dặm về phía nam, có đồn lính La Mã, và được kể là cực nam của Giu-đê. Vào thời Byzantine, nó phát triển thành một thị trấn có nhiều nhà thờ trên biên giới sa mạc."
  ro:
    - "Beer-Șeba se află în nordul Neghevului, la marginea deșertului, unde fântânile de-a lungul unui larg wadi au făcut posibilă viața sedentară. Cetatea regilor israeliți se afla pe un tell numit acum Tel Sheva, la aproximativ 4 km est de orașul modern; cetatea romană și bizantină a crescut pe locul orașului modern. Sate din epoca cuprului au înflorit în zonă în mileniile al V-lea și al IV-lea î.Hr. Săpăturile conduse de Yohanan Aharoni din 1969 au arătat că tellul a fost locuit întâia oară la începutul epocii fierului, ca un mic sat de gropi și case."
    - "În Geneza, Avraam și Abimelec au încheiat aici o alianță, iar locul a fost numit Beer-Șeba, „că acolo au jurat amândoi”; Avraam a sădit acolo un crâng și a chemat numele Domnului. Slugile lui Isaac au săpat aici o fântână, iar Iacov a pornit din Beer-Șeba spre Haran și a adus mai târziu jertfe aici, în drum spre Egipt. „Dela Dan până la Virsavee” a devenit expresia pentru întreaga țară a lui Israel. Fiii lui Samuel erau judecători în Beer-Șeba, iar Ilie a fugit aici de Izabela."
    - "În epoca fierului a II-a, din jurul secolului al X-lea î.Hr. (data exactă este disputată), tellul a devenit o mică cetate cu ziduri a lui Iuda, cu o poartă, magazii, un inel de case construite în zid și un mare sistem de apă săpat în stâncă. Ultima ei cetate din epoca fierului a fost arsă la sfârșitul secolului al VIII-lea î.Hr., probabil în campania lui Senaherib din 701 î.Hr. Pietrele unui mare altar cu coarne au fost găsite zidite într-un zid mai târziu; Aharoni a legat demontarea lui de reforma lui Ezechia, iar Yadin de reforma lui Iosia, cu un secol mai târziu. Amos l-a avertizat pe Israel să nu meargă la Beer-Șeba, iar Iosia a spurcat înălțimile de la Gheba până la Beer-Șeba."
    - "După exil, iudeii au locuit din nou în Beer-Șeba și în satele ei, după cum arată Neemia. În vremea lui Eusebiu, Beer-Șeba era un sat mare, la douăzeci de mile sud de Hebron, cu o garnizoană de soldați romani, și era socotită capătul de sud al Iudeii. În perioada bizantină a crescut într-o cetate cu mai multe biserici la frontiera deșertului."
  bg:
    - "Вирсавия лежи в северния Негев, на ръба на пустинята, където кладенци по широк вади правели възможен уседналия живот. Градът на израилските царе стоял на могила, наричана днес Тел Шева, на около 4 км източно от съвременния град; римският и византийският град израснали на мястото на съвременния. Селища от медната епоха процъфтявали в областта през V и IV хилядолетие пр.н.е. Разкопките, ръководени от Йоханан Ахарони от 1969 г., откриха, че самата могила била заселена за първи път в началото на желязната епоха като малко село от ями и къщи."
    - "В Битие Авраам и Авимелех сключили тук договор и мястото било наречено Вирсавия, „защото там се заклеха двамата“; Авраам насадил там дъбрава и призвал името на Господа. Слугите на Исаак изкопали тук кладенец, а Яков тръгнал от Вирсавия за Харан и по-късно принесъл жертви тук на път за Египет. „От Дан до Вирсавее“ станало изразът за цялата земя на Израил. Синовете на Самуил били съдии във Вирсавия, а Илия избягал тук от Йезавел."
    - "През желязната епоха II, от около X в. пр.н.е. (точната дата е спорна), могилата станала малък укрепен град на Юда, с порта, складове, пръстен от къщи, вградени в стената, и голяма скално изсечена водна система. Последният ѝ град от желязната епоха бил изгорен в края на VIII в. пр.н.е., вероятно в похода на Сенахирим от 701 г. пр.н.е. Камъните на голям олтар с рога били намерени вградени в по-късна стена; Ахарони свързвал разглобяването му с реформата на Езекия, а Ядин — с реформата на Йосия век по-късно. Амос предупредил Израил да не ходи във Вирсавия, а Йосия оскверни високите места „от Гева дори до Вирсавее“."
    - "След изгнанието евреи отново живеели във Вирсавия и селата ѝ, както отбелязва Неемия. По времето на Евсевий Вирсавия била голямо село на двадесет мили южно от Хеврон с гарнизон от римски войници и се смятала за южния край на Юдея. През византийския период тя израснала в град с няколко църкви на пустинната граница."
