# Overview article (ADR 0007). Mainstream facts only; disputed datings are named as such. The place is the Iron Age mound (Tel Sheva); the Roman and Byzantine town lay a few kilometres west.
id: beersheba
place: ad2f6c2
title:
  en: "Beersheba"
  ru: "Вирсавия"
  uk: "Беер-Шева"
  es: "Beerseba"
  pt: "Berseba"
  de: "Beerscheba"
  fr: "Beer-Schéba"
body:
  en:
    - "Beersheba lies in the northern Negev, on the edge of the desert, where wells along a broad wadi made settled life possible. The town of the Israelite kings stood on a mound now called Tel Sheva, about 4 km east of the modern city; the Roman and Byzantine town grew up on the site of the modern city. Villages of the Copper Age flourished in the area in the fifth and fourth millennia BC. The excavations directed by Yohanan Aharoni from 1969 found that the mound itself was first settled early in the Iron Age, as a small village of pits and houses."
    - 'In Genesis, Abraham and Abimelech made a covenant here, and the place was called Beer-sheba, "because there they sware both of them"; Abraham planted a grove there and called on the name of the Lord. Isaac''s servants dug a well here, and Jacob set out from Beersheba for Haran and later offered sacrifices here on his way to Egypt. "From Dan to Beer-sheba" became the phrase for the whole land of Israel. Samuel''s sons were judges in Beersheba, and Elijah fled here from Jezebel.'
    - "In Iron Age II, from about the tenth century BC (the exact date is disputed), the mound became a small walled town of Judah, with a gate, storehouses, a ring of houses built into the wall and a large rock-cut water system. Its last Iron Age city was burned in the late eighth century BC, probably in Sennacherib's campaign of 701 BC. The stones of a large horned altar were found built into a later wall; Aharoni linked its dismantling with Hezekiah's reform, while Yadin linked it with Josiah's reform a century later. Amos warned Israel not to go to Beersheba, and Josiah defiled the high places from Geba to Beersheba."
    - "After the exile Jews lived again in Beersheba and its villages, as Nehemiah records. In Eusebius' day Beersheba was a large village twenty miles south of Hebron with a garrison of Roman soldiers, and it was counted the southern end of Judaea. In the Byzantine period it grew into a town with several churches on the desert frontier."
  ru:
    - "Вирсавия лежит на севере Негева, у края пустыни, где колодцы вдоль широкого русла позволяли жить оседло. Город израильских царей стоял на холме, который теперь называют Тель-Шева, примерно в 4 км к востоку от современного города; римский и византийский город вырос на месте нынешнего. Поселения медного века процветали в этой округе в V–IV тысячелетиях до н. э. Раскопки, которые с 1969 г. вёл Иоханан Ахарони, показали, что сам холм впервые заселили в начале железного века: здесь была небольшая деревня с ямами и домами."
    - "По книге Бытия, Авраам и Авимелех заключили здесь союз, и место назвали Вирсавией, «ибо тут оба они клялись»; Авраам насадил при Вирсавии рощу и призвал там имя Господа. Рабы Исаака выкопали здесь колодезь, а Иаков вышел из Вирсавии в Харран и позже, идя в Египет, принёс здесь жертвы. Слова «от Дана до Вирсавии» стали обозначать всю землю Израиля. Сыновья Самуила были судьями в Вирсавии, а Илия бежал сюда от Иезавели."
    - "В железном веке II, примерно с X века до н. э. (точная дата спорна), холм стал небольшим укреплённым городом Иудеи с воротами, хранилищами, кольцом домов, встроенных в стену, и большой высеченной в скале системой водоснабжения. Последний город железного века сгорел в конце VIII века до н. э., вероятно во время похода Сеннахирима в 701 г. до н. э. Камни большого жертвенника с рогами нашли встроенными в более позднюю стену; Ахарони связывал его разборку с реформой Езекии, а Ядин — с реформой Иосии, на век позже. Амос предостерегал Израиль не ходить в Вирсавию, а Иосия осквернил высоты от Гевы до Вирсавии."
    - "После плена иудеи снова жили в Вирсавии и зависящих от неё городах, как сообщает Неемия. Во времена Евсевия Вирсавия была большим селением в двадцати милях к югу от Хеврона, где стоял гарнизон римских солдат, и её считали южным краем Иудеи. В византийское время она выросла в город с несколькими церквами на границе пустыни."
  uk:
    - "Беер-Шева лежить у північному Негеві, на краю пустелі, де колодязі вздовж широкого вадію зробили можливим осіле життя. Місто ізраїльських царів стояло на пагорбі, який нині зветься Тель-Шева, приблизно за 4 км на схід від сучасного міста; римське й візантійське місто виросло на місці сучасного. Села мідної доби процвітали в цій місцевості у V–IV тисячоліттях до н. е. Розкопки під керівництвом Йоханана Агароні з 1969 року виявили, що сам пагорб уперше заселили на початку залізної доби, як невелике село ям і будинків."
    - "У книзі Буття Авраам та Авімелех уклали тут угоду, і місце назвали Беер-Шева, «бо там клялись обидва»; Авраам посадив там тамариск і призвав ім'я Господа. Слуги Ісаака викопали тут колодязь, а Яків вирушив з Беер-Шеви до Харану і пізніше приніс тут жертви по дорозі до Єгипту. «Від Дана аж до Берсабиї» стало висловом для всієї землі Ізраїлю. Сини Самуїла були суддями в Беер-Шеві, і Елія втік сюди від Єзавелі."
    - "У залізну добу II, приблизно від X століття до н. е. (точна дата спірна), пагорб став невеликим мурованим містом Юди, з брамою, коморами, кільцем будинків, вбудованих у мур, і великою вирубаною в скелі системою водопостачання. Його останнє місто залізної доби було спалене наприкінці VIII століття до н. е., імовірно, під час походу Сінаххеріба 701 р. до н. е. Камені великого рогатого жертовника знайшли вмурованими в пізніший мур; Агароні пов'язував його розбирання з реформою Єзекії, а Ядін — з реформою Йосії століттям пізніше. Амос застерігав Ізраїль не ходити до Беер-Шеви, а Йосія осквернив висоти від Геби до Беер-Шеви."
    - "Після вигнання юдеї знову жили в Беер-Шеві та її селах, як записує Неемія. За Євсевія Беер-Шева була великим селом за двадцять миль на південь від Хеврону з гарнізоном римських солдатів і вважалася південним краєм Юдеї. У візантійський період вона виросла в місто з кількома церквами на пустельному кордоні."
  es:
    - "Beerseba se halla en el Néguev septentrional, en el borde del desierto, donde pozos a lo largo de un amplio uadi hicieron posible la vida sedentaria. La ciudad de los reyes israelitas se alzaba sobre un montículo hoy llamado Tel Sheva, a unos 4 km al este de la ciudad moderna; la ciudad romana y bizantina creció en el sitio de la ciudad moderna. En la zona florecieron aldeas del Calcolítico en los milenios V y IV a. C. Las excavaciones dirigidas por Yohanan Aharoni desde 1969 hallaron que el propio montículo fue habitado por primera vez a comienzos de la edad del Hierro, como una pequeña aldea de fosas y casas."
    - "En el Génesis, Abraham y Abimelec hicieron aquí un pacto, y el lugar fue llamado Beer-seba, «porque allí juraron ambos»; Abraham plantó allí un bosque e invocó el nombre de Jehová. Los siervos de Isaac cavaron aquí un pozo, y Jacob partió de Beerseba hacia Harán y más tarde ofreció aquí sacrificios camino de Egipto. «Desde Dan hasta Beer-seba» se convirtió en la expresión para toda la tierra de Israel. Los hijos de Samuel fueron jueces en Beerseba, y Elías huyó aquí de Jezabel."
    - "En la edad del Hierro II, desde aproximadamente el siglo X a. C. (la fecha exacta se discute), el montículo se convirtió en una pequeña ciudad amurallada de Judá, con puerta, almacenes, un anillo de casas construidas en la muralla y un gran sistema hidráulico excavado en la roca. Su última ciudad de la edad del Hierro fue incendiada a finales del siglo VIII a. C., probablemente en la campaña de Senaquerib de 701 a. C. Las piedras de un gran altar con cuernos se hallaron incorporadas a un muro posterior; Aharoni vinculó su desmantelamiento con la reforma de Ezequías, mientras que Yadin lo vinculó con la reforma de Josías un siglo después. Amós advirtió a Israel que no fuera a Beerseba, y Josías profanó los lugares altos desde Geba hasta Beerseba."
    - "Después del exilio los judíos vivieron de nuevo en Beerseba y sus aldeas, como registra Nehemías. En tiempos de Eusebio Beerseba era una aldea grande a veinte millas al sur de Hebrón con una guarnición de soldados romanos, y se contaba como el extremo meridional de Judea. En el período bizantino creció hasta convertirse en una ciudad con varias iglesias en la frontera del desierto."
  pt:
    - "Berseba fica no norte do Neguev, na borda do deserto, onde poços ao longo de um amplo uádi tornaram possível a vida sedentária. A cidade dos reis de Israel ficava num montículo hoje chamado Tel Sheva, cerca de 4 km a leste da cidade moderna; a cidade romana e bizantina cresceu no lugar da cidade moderna. Aldeias da Idade do Cobre floresceram na área no quinto e quarto milênios a.C. As escavações dirigidas por Yohanan Aharoni a partir de 1969 constataram que o montículo foi povoado pela primeira vez no início da Idade do Ferro, como uma pequena aldeia de fossas e casas."
    - "Em Gênesis, Abraão e Abimeleque fizeram aqui uma aliança, e o lugar foi chamado Berseba, “porque ambos fizeram um juramento ali”; Abraão plantou ali uma tamargueira e invocou o nome do SENHOR. Os servos de Isaque cavaram aqui um poço, e Jacó partiu de Berseba para Harã e depois ofereceu sacrifícios aqui a caminho do Egito. “Desde Dã até Berseba” tornou-se a expressão para toda a terra de Israel. Os filhos de Samuel foram juízes em Berseba, e Elias fugiu para cá de Jezabel."
    - "Na Idade do Ferro II, a partir de cerca do século X a.C. (a data exata é discutida), o montículo tornou-se uma pequena cidade murada de Judá, com porta, armazéns, um anel de casas encostadas à muralha e um grande sistema de água escavado na rocha. Sua última cidade da Idade do Ferro foi queimada no fim do século VIII a.C., provavelmente na campanha de Senaqueribe de 701 a.C. As pedras de um grande altar com chifres foram achadas embutidas num muro posterior; Aharoni ligou o seu desmonte à reforma de Ezequias, e Yadin à de Josias, um século depois. Amós advertiu Israel a não ir a Berseba, e Josias profanou os altos de Geba a Berseba."
    - "Depois do exílio, judeus viveram de novo em Berseba e suas aldeias, como registra Neemias. No tempo de Eusébio, Berseba era uma grande aldeia a vinte milhas ao sul de Hebrom, com guarnição de soldados romanos, e era contada como o extremo sul da Judeia. No período bizantino cresceu até ser uma cidade com várias igrejas na fronteira do deserto."
  de:
    - "Beerscheba liegt im nördlichen Negev am Wüstenrand, wo Brunnen an einem breiten Wadi sesshaftes Leben ermöglichten. Die Stadt der israelitischen Könige stand auf einem Hügel, heute Tel Scheba genannt, etwa 4 km östlich der modernen Stadt; die römische und byzantinische Stadt wuchs an der Stelle der modernen auf. Dörfer der Kupferzeit blühten in der Gegend im 5. und 4. Jahrtausend v. Chr. Die von Yohanan Aharoni seit 1969 geleiteten Grabungen fanden, dass der Hügel selbst erst früh in der Eisenzeit besiedelt wurde, als kleines Dorf aus Gruben und Häusern."
    - "In der Genesis schlossen Abraham und Abimelech hier einen Bund, und der Ort hieß Beerscheba, „weil sie beide miteinander da geschworen haben“; Abraham pflanzte dort einen Hain und rief den Namen des Herrn an. Isaaks Knechte gruben hier einen Brunnen, und Jakob zog von Beerscheba nach Haran und opferte später auf dem Weg nach Ägypten hier: „Und da er gen Beer-Seba kam, opferte er dem Gott seines Vaters Isaak.“ „Von Dan bis gen Beer-Seba“ wurde zur Wendung für das ganze Land Israel. Samuels Söhne waren Richter in Beerscheba, und Elia floh vor Isebel hierher."
    - "In der Eisenzeit II, ab etwa dem 10. Jahrhundert v. Chr. (das genaue Datum ist umstritten), wurde der Hügel eine kleine ummauerte Stadt Judas mit Tor, Magazinen, einem Ring von in die Mauer gebauten Häusern und einem großen in den Fels gehauenen Wassersystem. Ihre letzte eisenzeitliche Stadt wurde im späten 8. Jahrhundert v. Chr. verbrannt, wohl auf Sanheribs Feldzug 701 v. Chr. Die Steine eines großen Hörneraltars wurden in eine spätere Mauer eingebaut gefunden; Aharoni verband seinen Abbau mit Hiskias Reform, Yadin mit der Reform Josias ein Jahrhundert später. Amos warnte Israel, nach Beerscheba zu gehen, und Josia verunreinigte die Höhen „von Geba an bis gen Beer-Seba“."
    - "Nach dem Exil wohnten Juden wieder in Beerscheba und seinen Dörfern, wie Nehemia berichtet. Zu Eusebius' Zeit war Beerscheba ein großes Dorf zwanzig Meilen südlich von Hebron mit einer Garnison römischer Soldaten und galt als Südende Judäas. In byzantinischer Zeit wuchs es zu einer Stadt mit mehreren Kirchen an der Wüstengrenze."
  fr:
    - "Beer-Schéba se trouve dans le nord du Négev, au bord du désert, là où des puits le long d’un large oued rendaient possible une vie sédentaire. La ville des rois d’Israël s’élevait sur un tertre appelé aujourd’hui Tel Sheva, à environ 4 km à l’est de la ville moderne ; la ville romaine et byzantine grandit à l’emplacement de la ville moderne. Des villages du Chalcolithique prospérèrent dans la région aux Ve et IVe millénaires av. J.-C. Les fouilles dirigées par Yohanan Aharoni à partir de 1969 ont montré que le tertre lui-même fut d’abord peuplé au début de l’âge du Fer, comme un petit village de fosses et de maisons."
    - "Dans la Genèse, Abraham et Abimélec firent alliance ici, et le lieu fut appelé Beer-Schéba, « car c’est là qu’ils jurèrent l’un et l’autre » ; Abraham y planta un bosquet et invoqua le nom du Seigneur. Les serviteurs d’Isaac y creusèrent un puits, et Jacob partit de Beer-Schéba pour Haran et y offrit plus tard des sacrifices en allant en Égypte. « Depuis Dan jusqu’à Beer-Schéba » devint l’expression désignant tout le pays d’Israël. Les fils de Samuel furent juges à Beer-Schéba, et Élie s’y enfuit devant Jézabel."
    - "À l’âge du Fer II, vers le Xe siècle av. J.-C. (la date exacte est discutée), le tertre devint une petite ville fortifiée de Juda, avec une porte, des magasins, une couronne de maisons adossées au rempart et un grand système hydraulique creusé dans le roc. Sa dernière ville de l’âge du Fer fut brûlée à la fin du VIIIe siècle av. J.-C., probablement lors de la campagne de Sanchérib en 701 av. J.-C. Les pierres d’un grand autel à cornes furent trouvées remployées dans un mur plus tardif ; Aharoni rattacha son démantèlement à la réforme d’Ézéchias, Yadin à celle de Josias un siècle plus tard. Amos avertit Israël de ne pas aller à Beer-Schéba, et Josias souilla les hauts lieux de Guéba à Beer-Schéba."
    - "Après l’exil, des Juifs habitèrent de nouveau Beer-Schéba et ses villages, comme le note Néhémie. Du temps d’Eusèbe, Beer-Schéba était un grand village à vingt milles au sud d’Hébron avec une garnison de soldats romains, et on la comptait pour l’extrémité sud de la Judée. À l’époque byzantine, elle devint une ville avec plusieurs églises à la frontière du désert."
