# Overview article (ADR 0007). Mainstream facts only; the two New Testament accounts are set side by side without harmonising them; the traditional site is given as tradition.
id: akeldama
place: a040ba5
title:
  en: "Akeldama"
  ru: "Акелдама"
  uk: "Акелдама"
  es: "Aceldama"
  pt: "Aceldama"
  de: "Hakeldama"
  fr: "Hakeldama"
body:
  en:
    - "Akeldama, Aramaic for “field of blood”, is the plot of ground in Jerusalem bought with the thirty pieces of silver that Judas took for betraying Jesus. Matthew tells that the chief priests, who would not put the price of blood into the treasury, “bought with them the potter's field, to bury strangers in. Wherefore that field was called, The field of blood, unto this day”. In Acts Peter says that Judas himself “purchased a field with the reward of iniquity”, died there by a fall, and that the field was called “in their proper tongue, Aceldama, that is to say, The field of blood”. The two accounts differ in who bought the field and why it was so named, and readers have set them side by side since antiquity."
    - "From at least the fourth century the name has been fixed to the southern slope of the Hinnom valley, where it meets the Kidron below the hill later called Mount Zion: Eusebius and Jerome knew the field shown to pilgrims there. The slope is cut with rock tombs of the Second Temple period. In the Crusader period a great vaulted charnel house for the burial of pilgrims was built over the tombs, and in the late nineteenth century the Greek Orthodox monastery of St Onuphrius rose beside it. Three burial caves cleared in 1989 held ossuaries and finds of the first century. The place lies today between the quarters of Abu Tor and Silwan, in sight of the walls of the Old City."
  ru:
    - "Акелдама, по-арамейски «земля крови», — участок в Иерусалиме, купленный на тридцать сребреников, которые Иуда взял за предательство Иисуса. Матфей рассказывает, что первосвященники, не пожелав положить цену крови в сокровищницу, «купили на них землю горшечника, для погребения странников; посему и называется земля та „землею крови“ до сего дня». В Деяниях Пётр говорит, что Иуда сам «приобрел землю неправедною мздою», погиб там, упав, и земля та «на отечественном их наречии названа Акелдама, то есть земля крови». Два рассказа расходятся в том, кто купил землю и отчего пошло имя, и читатели с древности ставят их рядом."
    - "По меньшей мере с IV века имя закреплено за южным склоном долины Еннома, где она сходится с Кедроном под холмом, позже названным Сионом: Евсевий и Иероним знали поле, которое показывали там паломникам. Склон изрезан скальными гробницами времён Второго храма. В эпоху крестоносцев над гробницами возвели большую сводчатую усыпальницу для погребения паломников, а в конце XIX века рядом поднялся греческий православный монастырь святого Онуфрия. Три погребальные пещеры, расчищенные в 1989 году, хранили оссуарии и находки I века. Место лежит сегодня между кварталами Абу-Тор и Сильван, в виду стен Старого города."
  uk:
    - "Акелдама, арамейською «поле крові», — ділянка землі в Єрусалимі, куплена за тридцять срібняків, які Юда взяв за зраду Ісуса. Матвій розповідає, що первосвященники, які не хотіли класти ціну крові до скарбниці, «купили за них ганчарське поле, щоб ховати на йому захожих. Через се зветь ся поле се Кріваве Поле по сей день». У Діях Петро каже, що сам Юда «придбав поле за нагороду неправедну», помер там від падіння і що поле прозвали «власною говіркою їх Акельдама, чи то б сказати: поле крови». Дві розповіді розходяться в тому, хто купив поле і чому воно так зветься, і читачі зіставляли їх ще від давнини."
    - "Щонайменше з IV століття назву прикріплено до південного схилу долини Гінном, де вона сходиться з Кедроном під пагорбом, який згодом назвали горою Сіон: Євсевій і Єронім знали поле, яке там показували прочанам. Схил поцяткований скельними гробницями доби Другого храму. За хрестоносців над гробницями збудували велику склепінчасту костницю для поховання прочан, а наприкінці XIX століття поруч постав грецький православний монастир св. Онуфрія. Три поховальні печери, розчищені в 1989 році, містили оссуарії й знахідки І століття. Це місце лежить нині між кварталами Абу-Тор і Сілуан, у полі зору мурів Старого міста."
  es:
    - "Aceldama, arameo para «campo de sangre», es el terreno de Jerusalén comprado con las treinta piezas de plata que Judas recibió por traicionar a Jesús. Mateo cuenta que los príncipes de los sacerdotes, que no querían echar el precio de sangre en el tesoro, «compraron con ellas el campo del alfarero, por sepultura para los extranjeros. Por lo cual fué llamado aquel campo, Campo de sangre, hasta el día de hoy». En los Hechos, Pedro dice que el propio Judas «adquirió un campo del salario de su iniquidad», murió allí por una caída, y que el campo fue llamado «en su propia lengua, Acéldama, que es, Campo de sangre». Los dos relatos difieren en quién compró el campo y por qué recibió ese nombre, y los lectores los han puesto uno junto a otro desde la Antigüedad."
    - "Desde al menos el siglo IV el nombre se ha fijado en la ladera meridional del valle de Hinom, donde confluye con el Cedrón bajo la colina llamada más tarde monte Sion: Eusebio y Jerónimo conocían el campo que allí se mostraba a los peregrinos. La ladera está horadada por tumbas excavadas en la roca de la época del Segundo Templo. En el período de los cruzados se construyó sobre las tumbas un gran osario abovedado para el entierro de peregrinos, y a finales del siglo XIX se levantó junto a él el monasterio greco-ortodoxo de san Onufrio. Tres cuevas funerarias despejadas en 1989 contenían osarios y hallazgos del siglo I. El lugar se encuentra hoy entre los barrios de Abu Tor y Silwan, a la vista de las murallas de la Ciudad Vieja."
  pt:
    - "Aceldama, em aramaico “campo de sangue”, é o terreno em Jerusalém comprado com as trinta moedas de prata que Judas recebeu por trair Jesus. Mateus conta que os principais sacerdotes, que não quiseram pôr o preço do sangue no tesouro, “compraram com elas o campo do oleiro, para sepultar estrangeiros. Por isso, aquele campo tem sido chamado ‘Campo de Sangue’ até o dia de hoje”. Em Atos, Pedro diz que o próprio Judas “adquiriu um campo com o salário da sua maldade”, morreu ali numa queda, e que o campo foi chamado “em sua própria língua ‘Aceldama’, isto é, ‘Campo de Sangue’”. Os dois relatos diferem quanto a quem comprou o campo e por que recebeu esse nome, e os leitores os põem lado a lado desde a Antiguidade."
    - "Pelo menos desde o século IV o nome está fixado na encosta sul do vale de Hinom, onde ele encontra o Cedrom, abaixo da colina chamada mais tarde monte Sião: Eusébio e Jerônimo conheciam o campo mostrado ali aos peregrinos. A encosta é cortada por túmulos escavados na rocha do período do Segundo Templo. No período dos cruzados, uma grande casa mortuária abobadada para o sepultamento de peregrinos foi construída sobre os túmulos, e no fim do século XIX o mosteiro greco-ortodoxo de Santo Onofre surgiu ao lado. Três cavernas funerárias abertas em 1989 continham ossuários e achados do século I. O lugar fica hoje entre os bairros de Abu Tor e Silwan, à vista das muralhas da Cidade Velha."
  de:
    - "Hakeldama, aramäisch „Blutacker“, ist das Grundstück in Jerusalem, das mit den dreißig Silberstücken gekauft wurde, die Judas für den Verrat an Jesus nahm. Matthäus erzählt, die Hohenpriester, die den Blutpreis nicht in den Schatz legen wollten, „kauften den Töpfersacker darum zum Begräbnis der Pilger. Daher ist dieser Acker genannt der Blutacker bis auf den heutigen Tag“. In der Apostelgeschichte sagt Petrus, Judas selbst „hat erworben den Acker um den ungerechten Lohn“, sei dort durch einen Sturz gestorben, und der Acker werde „auf ihrer Sprache: Hakeldama (das ist: ein Blutacker)“ genannt. Die beiden Berichte unterscheiden sich darin, wer den Acker kaufte und warum er so hieß, und die Leser stellen sie seit der Antike nebeneinander."
    - "Seit spätestens dem 4. Jahrhundert ist der Name am Südhang des Hinnomtals festgemacht, wo es auf das Kidrontal trifft, unterhalb des später Berg Zion genannten Hügels: Eusebius und Hieronymus kannten den Acker, der dort Pilgern gezeigt wurde. Der Hang ist durchzogen von Felsgräbern aus der Zeit des Zweiten Tempels. In der Kreuzfahrerzeit wurde über den Gräbern ein großes gewölbtes Beinhaus für die Bestattung von Pilgern gebaut, und im späten 19. Jahrhundert entstand daneben das griechisch-orthodoxe Kloster des heiligen Onuphrios. Drei 1989 geräumte Grabhöhlen enthielten Ossuarien und Funde des ersten Jahrhunderts. Der Ort liegt heute zwischen den Vierteln Abu Tor und Silwan, in Sichtweite der Mauern der Altstadt."
  fr:
    - "Hakeldama, en araméen « champ de sang », est le terrain de Jérusalem acheté avec les trente pièces d’argent que Judas reçut pour avoir trahi Jésus. Matthieu raconte que les principaux sacrificateurs, qui ne voulaient pas mettre le prix du sang dans le trésor, « achetèrent avec cet argent le champ du potier, pour la sépulture des étrangers. C’est pourquoi ce champ a été appelé champ du sang, jusqu’à ce jour ». Dans les Actes, Pierre dit que Judas lui-même « ayant acquis un champ avec le salaire du crime » y mourut d’une chute, et que le champ fut appelé « dans leur langue Hakeldama, c’est-à-dire, champ du sang ». Les deux récits diffèrent sur qui acheta le champ et pourquoi il porta ce nom, et les lecteurs les ont rapprochés dès l’Antiquité."
    - "Depuis le IVe siècle au moins, le nom est fixé au versant sud de la vallée de Hinnom, là où elle rejoint le Cédron au-dessous de la colline appelée plus tard mont Sion : Eusèbe et Jérôme connaissaient le champ montré aux pèlerins en ce lieu. Le versant est creusé de tombes rupestres de l’époque du Second Temple. À l’époque des croisés, un grand charnier voûté destiné à l’inhumation des pèlerins fut bâti sur les tombes, et à la fin du XIXe siècle le monastère grec orthodoxe de Saint-Onuphre s’éleva à côté. Trois grottes funéraires dégagées en 1989 contenaient des ossuaires et des objets du Ier siècle. Le lieu se trouve aujourd’hui entre les quartiers d’Abu Tor et de Silwan, en vue des remparts de la Vieille Ville."
