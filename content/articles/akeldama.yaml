body:
  en:
    - "Akeldama, Aramaic for “field of blood”, is the plot of ground in Jerusalem bought with the thirty pieces of silver that Judas took for betraying Jesus. Matthew tells that the chief priests, who would not put the price of blood into the treasury, “bought with them the potter's field, to bury strangers in. Wherefore that field was called, The field of blood, unto this day”. Acts, in the course of Peter's speech, says that Judas himself “purchased a field with the reward of iniquity”, died there by a fall, and that the field was called “in their proper tongue, Aceldama, that is to say, The field of blood”. The two accounts differ in who bought the field and why it was so named, and readers have set them side by side since antiquity."
    - "From at least the fourth century the name has been fixed to the southern slope of the Hinnom valley, where it meets the Kidron below the hill later called Mount Zion: Eusebius knew the field as still shown by Mount Zion, and Jerome, translating him, placed it on the south side of Mount Zion. The slope is cut with rock tombs of the Second Temple period. In the Crusader period a great vaulted charnel house for the burial of pilgrims was built over the tombs, and in the late nineteenth century the Greek Orthodox monastery of St Onuphrius rose beside it. Three burial caves cleared in 1989 held ossuaries and finds of the first century. The place lies today between the quarters of Abu Tor and Silwan, in sight of the walls of the Old City."
  ru:
    - "Акелдама, по-арамейски «земля крови», — участок в Иерусалиме, купленный на тридцать сребреников, которые Иуда взял за предательство Иисуса. Матфей рассказывает, что первосвященники, не пожелав положить цену крови в сокровищницу, «купили на них землю горшечника, для погребения странников; посему и называется земля та „землею крови“ до сего дня». В Деяниях, в речи Петра, сказано, что Иуда сам «приобрел землю неправедною мздою», погиб там, упав, и земля та «на отечественном их наречии названа Акелдама, то есть земля крови». Два рассказа расходятся в том, кто купил землю и отчего пошло имя, и читатели с древности ставят их рядом."
    - "По меньшей мере с IV века имя закреплено за южным склоном долины Еннома, где она сходится с Кедроном под холмом, позже названным Сионом: Евсевий знал это поле как всё ещё показываемое у Сиона, а Иероним, переводя его, поместил поле на южной стороне Сиона. Склон изрезан скальными гробницами времён Второго храма. В эпоху крестоносцев над гробницами возвели большую сводчатую усыпальницу для погребения паломников, а в конце XIX века рядом поднялся греческий православный монастырь святого Онуфрия. Три погребальные пещеры, расчищенные в 1989 году, хранили оссуарии и находки I века. Место лежит сегодня между кварталами Абу-Тор и Сильван, в виду стен Старого города."
  uk:
    - "Акелдама, арамейською «поле крові», — ділянка землі в Єрусалимі, куплена за тридцять срібняків, які Юда взяв за зраду Ісуса. Матвій розповідає, що первосвященники, які не хотіли класти ціну крові до скарбниці, «купили за них ганчарське поле, щоб ховати на йому захожих. Через се зветь ся поле се Кріваве Поле по сей день». У Діях, у промові Петра, сказано, що сам Юда «придбав поле за нагороду неправедну», помер там від падіння і що поле прозвали «власною говіркою їх Акельдама, чи то б сказати: поле крови». Дві розповіді розходяться в тому, хто купив поле і чому воно так зветься, і читачі зіставляли їх ще від давнини."
    - "Щонайменше з IV століття назву прикріплено до південного схилу долини Гінном, де вона сходиться з Кедроном під пагорбом, який згодом назвали горою Сіон: Євсевій знав поле як таке, що його досі показують біля гори Сіон, а Єронім, перекладаючи його, помістив поле на південному боці гори Сіон. Схил поцяткований скельними гробницями доби Другого храму. За хрестоносців над гробницями збудували велику склепінчасту костницю для поховання прочан, а наприкінці XIX століття поруч постав грецький православний монастир св. Онуфрія. Три поховальні печери, розчищені в 1989 році, містили оссуарії й знахідки I століття. Це місце лежить нині між кварталами Абу-Тор і Сілуан, у полі зору мурів Старого міста."
  es:
    - "Aceldama, arameo para «campo de sangre», es el terreno de Jerusalén comprado con las treinta piezas de plata que Judas recibió por traicionar a Jesús. Mateo cuenta que los príncipes de los sacerdotes, que no querían echar el precio de sangre en el tesoro, «compraron con ellas el campo del alfarero, por sepultura para los extranjeros. Por lo cual fué llamado aquel campo, Campo de sangre, hasta el día de hoy». Los Hechos, en el discurso de Pedro, dicen que el propio Judas «adquirió un campo del salario de su iniquidad», murió allí por una caída, y que el campo fue llamado «en su propia lengua, Acéldama, que es, Campo de sangre». Los dos relatos difieren en quién compró el campo y por qué recibió ese nombre, y los lectores los han puesto uno junto a otro desde la Antigüedad."
    - "Desde al menos el siglo IV el nombre se ha fijado en la ladera meridional del valle de Hinom, donde confluye con el Cedrón bajo la colina llamada más tarde monte Sion: Eusebio conocía el campo como aún mostrado junto al monte Sion, y Jerónimo, al traducirlo, lo situó en el lado sur del monte Sion. La ladera está horadada por tumbas excavadas en la roca de la época del Segundo Templo. En el período de los cruzados se construyó sobre las tumbas un gran osario abovedado para el entierro de peregrinos, y a finales del siglo XIX se levantó junto a él el monasterio greco-ortodoxo de san Onufrio. Tres cuevas funerarias despejadas en 1989 contenían osarios y hallazgos del siglo I. El lugar se encuentra hoy entre los barrios de Abu Tor y Silwan, a la vista de las murallas de la Ciudad Vieja."
  pt:
    - "Aceldama, em aramaico “campo de sangue”, é o terreno em Jerusalém comprado com as trinta moedas de prata que Judas recebeu por trair Jesus. Mateus conta que os principais sacerdotes, que não quiseram pôr o preço do sangue no tesouro, “compraram com elas o campo do oleiro, para sepultar estrangeiros. Por isso, aquele campo tem sido chamado ‘Campo de Sangue’ até o dia de hoje”. Atos, no discurso de Pedro, diz que o próprio Judas “adquiriu um campo com o salário da sua maldade”, morreu ali numa queda, e que o campo foi chamado “em sua própria língua ‘Aceldama’, isto é, ‘Campo de Sangue’”. Os dois relatos diferem quanto a quem comprou o campo e por que recebeu esse nome, e os leitores os põem lado a lado desde a Antiguidade."
    - "Pelo menos desde o século IV o nome está fixado na encosta sul do vale de Hinom, onde ele encontra o Cedrom, abaixo da colina chamada mais tarde monte Sião: Eusébio conhecia o campo como ainda mostrado junto ao monte Sião, e Jerônimo, ao traduzi-lo, situou-o no lado sul do monte Sião. A encosta é cortada por túmulos escavados na rocha do período do Segundo Templo. No período dos cruzados, uma grande casa mortuária abobadada para o sepultamento de peregrinos foi construída sobre os túmulos, e no fim do século XIX o mosteiro greco-ortodoxo de Santo Onofre surgiu ao lado. Três cavernas funerárias abertas em 1989 continham ossuários e achados do século I. O lugar fica hoje entre os bairros de Abu Tor e Silwan, à vista das muralhas da Cidade Velha."
  de:
    - "Hakeldama, aramäisch „Blutacker“, ist das Grundstück in Jerusalem, das mit den dreißig Silberstücken gekauft wurde, die Judas für den Verrat an Jesus nahm. Matthäus erzählt, die Hohenpriester, die den Blutpreis nicht in den Schatz legen wollten, „kauften den Töpfersacker darum zum Begräbnis der Pilger. Daher ist dieser Acker genannt der Blutacker bis auf den heutigen Tag“. Die Apostelgeschichte sagt im Lauf der Rede des Petrus, Judas selbst „hat erworben den Acker um den ungerechten Lohn“, sei dort durch einen Sturz gestorben, und der Acker werde „auf ihrer Sprache: Hakeldama (das ist: ein Blutacker)“ genannt. Die beiden Berichte unterscheiden sich darin, wer den Acker kaufte und warum er so hieß, und die Leser stellen sie seit der Antike nebeneinander."
    - "Seit spätestens dem 4. Jahrhundert ist der Name am Südhang des Hinnomtals festgemacht, wo es auf das Kidrontal trifft, unterhalb des später Berg Zion genannten Hügels: Eusebius kannte den Acker als noch beim Berg Zion gezeigt, und Hieronymus, der ihn übersetzte, setzte ihn an die Südseite des Berges Zion. Der Hang ist durchzogen von Felsgräbern aus der Zeit des Zweiten Tempels. In der Kreuzfahrerzeit wurde über den Gräbern ein großes gewölbtes Beinhaus für die Bestattung von Pilgern gebaut, und im späten 19. Jahrhundert entstand daneben das griechisch-orthodoxe Kloster des heiligen Onuphrios. Drei 1989 geräumte Grabhöhlen enthielten Ossuarien und Funde des ersten Jahrhunderts. Der Ort liegt heute zwischen den Vierteln Abu Tor und Silwan, in Sichtweite der Mauern der Altstadt."
  fr:
    - "Hakeldama, en araméen « champ de sang », est le terrain de Jérusalem acheté avec les trente pièces d’argent que Judas reçut pour avoir trahi Jésus. Matthieu raconte que les principaux sacrificateurs, qui ne voulaient pas mettre le prix du sang dans le trésor, « achetèrent avec cet argent le champ du potier, pour la sépulture des étrangers. C’est pourquoi ce champ a été appelé champ du sang, jusqu’à ce jour ». Les Actes, au cours du discours de Pierre, disent que Judas lui-même « ayant acquis un champ avec le salaire du crime » y mourut d’une chute, et que le champ fut appelé « dans leur langue Hakeldama, c’est-à-dire, champ du sang ». Les deux récits diffèrent sur qui acheta le champ et pourquoi il porta ce nom, et les lecteurs les ont rapprochés dès l’Antiquité."
    - "Depuis le IVe siècle au moins, le nom est fixé au versant sud de la vallée de Hinnom, là où elle rejoint le Cédron au-dessous de la colline appelée plus tard mont Sion : Eusèbe connaissait le champ comme encore montré près du mont Sion, et Jérôme, en le traduisant, le plaça au sud du mont Sion. Le versant est creusé de tombes rupestres de l’époque du Second Temple. À l’époque des croisés, un grand charnier voûté destiné à l’inhumation des pèlerins fut bâti sur les tombes, et à la fin du XIXe siècle le monastère grec orthodoxe de Saint-Onuphre s’éleva à côté. Trois grottes funéraires dégagées en 1989 contenaient des ossuaires et des objets du Ier siècle. Le lieu se trouve aujourd’hui entre les quartiers d’Abu Tor et de Silwan, en vue des remparts de la Vieille Ville."
  it:
    - "Acheldamà, in aramaico «campo di sangue», è il pezzo di terra a Gerusalemme comprato con le trenta monete d’argento che Giuda ricevette per aver tradito Gesù. Matteo racconta che i capi dei sacerdoti, non volendo mettere il prezzo del sangue nel tesoro, «comprarono con quel danaro il campo del vasaio da servir di sepoltura ai forestieri. Perciò quel campo, fino al dì d’oggi, è stato chiamato: Campo di sangue». Gli Atti, nel corso del discorso di Pietro, dicono che Giuda stesso «acquistò un campo col prezzo della sua iniquità», vi morì per una caduta, e che il campo fu chiamato «nel loro proprio linguaggio Acheldama, cioè, Campo di sangue». I due racconti differiscono su chi comprò il campo e sul perché fu così chiamato, e i lettori li hanno posti l’uno accanto all’altro fin dall’antichità."
    - "Da almeno il IV secolo il nome è fissato al pendio meridionale della valle di Hinnom, dove incontra il Cedron sotto la collina poi detta Monte Sion: Eusebio conosceva il campo come ancora mostrato presso il Monte Sion, e Girolamo, traducendolo, lo collocò sul lato meridionale del Monte Sion. Il pendio è inciso da tombe scavate nella roccia dell’epoca del Secondo Tempio. In epoca crociata sulle tombe fu costruito un grande ossario a volta per la sepoltura dei pellegrini, e alla fine dell’Ottocento accanto sorse il monastero greco-ortodosso di Sant’Onofrio. Tre grotte sepolcrali ripulite nel 1989 contenevano ossari e reperti del I secolo. Il luogo si trova oggi fra i quartieri di Abu Tor e Silwan, in vista delle mura della Città Vecchia."
  pl:
    - "Hakeldama, po aramejsku „rola krwi”, to kawałek ziemi w Jerozolimie kupiony za trzydzieści srebrników, które Juda wziął za zdradę Jezusa. Mateusz opowiada, że arcykapłani, nie chcąc złożyć zapłaty krwi do skarbca, „kupili za nie rolę garncarzową na pogrzeb gościom. Dlatego ona rola nazwana jest rolą krwi, aż do dnia dzisiejszego”. Dzieje, w toku mowy Piotra, mówią, że sam Juda „otrzymał rolę z zapłaty niesprawiedliwości”, zginął tam od upadku, a rolę nazwano „własnym ich językiem Akieldama, to jest rola krwi”. Oba opisy różnią się tym, kto kupił pole i dlaczego tak je nazwano, a czytelnicy zestawiają je od starożytności."
    - "Co najmniej od IV wieku nazwa przypisywana jest południowemu zboczu doliny Hinnom, tam gdzie spotyka się z Cedronem poniżej wzgórza zwanego później Syjonem: Euzebiusz znał pole jako wciąż pokazywane przy Syjonie, a Hieronim, tłumacząc go, umieścił je po południowej stronie Syjonu. Zbocze jest pocięte grobami skalnymi z okresu Drugiej Świątyni. W okresie krzyżowców nad grobami zbudowano wielką sklepioną kostnicę do chowania pielgrzymów, a pod koniec XIX wieku obok powstał grecko-prawosławny klasztor św. Onufrego. Trzy jaskinie grobowe oczyszczone w 1989 roku zawierały ossuaria i znaleziska z I wieku. Miejsce leży dziś między dzielnicami Abu Tor i Silwan, w zasięgu wzroku murów Starego Miasta."
  nl:
    - "Akeldama, Aramees voor “akker des bloeds”, is het stuk grond in Jeruzalem dat werd gekocht met de dertig zilverlingen die Judas ontving voor het verraad aan Jezus. Mattheüs vertelt dat de overpriesters, die de bloedprijs niet in de schatkist wilden leggen, “te zamen raad gehouden hebbende, kochten zij daarmede den akker des pottenbakkers, tot een begrafenis voor de vreemdelingen. Daarom is die akker genaamd de akker des bloeds, tot op den huidigen dag”. Handelingen zegt, in de loop van Petrus' rede, dat Judas zelf “heeft verworven een akker, door het loon der ongerechtigheid”, daar stierf door een val, en dat de akker “in hun eigen taal genoemd wordt Akeldama, dat is, een akker des bloeds”. De twee verslagen verschillen over wie de akker kocht en waarom hij zo heette, en lezers leggen ze sinds de oudheid naast elkaar."
    - "Althans sinds de vierde eeuw is de naam vastgehecht aan de zuidhelling van het Hinnomdal, waar het op het Kidrondal aansluit, onder de heuvel die later Sion werd genoemd: Eusebius kende de akker als nog getoond bij de Sion, en Hieronymus, die hem vertaalde, plaatste hem aan de zuidkant van de Sion. De helling is doorboord met rotsgraven uit de tijd van de Tweede Tempel. In de kruisvaarderstijd werd over de graven een groot gewelfd knekelhuis voor de begrafenis van pelgrims gebouwd, en in de late negentiende eeuw verrees ernaast het Grieks-orthodoxe klooster van Sint-Onufrius. Drie grafgrotten die in 1989 werden schoongemaakt, bevatten ossuaria en vondsten uit de eerste eeuw. De plaats ligt nu tussen de wijken Abu Tor en Silwan, in het zicht van de muren van de Oude Stad."
  cs:
    - "Akeldama, aramejsky „pole krve“, je pozemek v Jeruzalémě koupený za třicet stříbrných, která Juda vzal za zradu Ježíše. Matouš vypráví, že velekněží, kteří nechtěli vložit cenu krve do pokladnice, „koupili za ně pole to hrnčířovo, ku pohřebu poutníků. Protož nazváno jest pole to pole krve, až do dnešního dne“. Skutky v průběhu Petrovy řeči praví, že Juda sám „obdržel pole ze mzdy nepravosti“, zemřel tam pádem a že pole bylo nazváno „vlastním jazykem jejich Akeldama, to jest pole krve“. Obě vyprávění se liší v tom, kdo pole koupil a proč dostalo toto jméno, a čtenáři je kladou vedle sebe od starověku."
    - "Nejméně od 4. století je jméno vázáno na jižní svah Hinnomova údolí, kde se stýká s Kidronem pod pahorkem později nazvaným hora Sijón: Eusebios znal pole jako dosud ukazované u hory Sijón a Jeroným, který ho překládal, je umístil na jižní stranu hory Sijón. Svah je prorytý skalními hrobkami z doby druhého chrámu. V době křižácké byla nad hrobkami postavena velká klenutá kostnice k pohřbívání poutníků a koncem 19. století vedle ní vyrostl řecký pravoslavný klášter svatého Onufria. Tři pohřební jeskyně vyklizené v roce 1989 obsahovaly osuária a nálezy z 1. století. Místo leží dnes mezi čtvrtěmi Abu Tor a Silwán, v dohledu hradeb Starého Města."
  sv:
    - "Akeldama, arameiska för ”blodets åker”, är den jordbit i Jerusalem som köptes med de trettio silverpenningar som Judas tog för att förråda Jesus. Matteus berättar att översteprästerna, som inte ville lägga blodspengarna i skattkammaren, köpte med dem ”Krukmakaråkern till begravningsplats för främlingar. Därför kallas den åkern ännu i dag Blodsåkern”. Apostlagärningarna säger i Petrus’ tal att Judas själv köpte en åker: ”med de penningar han hade fått såsom lön för sin ogärning förvärvade han sig en åker”, dog där genom ett fall, och att åkern blev ”på deras tungomål kallad Akeldamak (det betyder Blodsåkern)”. De två berättelserna skiljer sig åt i vem som köpte åkern och varför den fick sitt namn, och läsare har ställt dem sida vid sida sedan antiken."
    - "Sedan åtminstone 300-talet har namnet fästs vid den södra sluttningen av Hinnoms dal, där den möter Kidron nedanför den höjd som senare kallades Sions berg: Eusebios kände åkern som ännu visad vid Sions berg, och Hieronymus, som översatte honom, förlade den på södra sidan av Sions berg. Sluttningen är genomskuren av klippgravar från andra tempelperioden. Under korsfarartiden byggdes ett stort välvt benhus för begravning av pilgrimer över gravarna, och i slutet av 1800-talet reste sig det grekisk-ortodoxa klostret Sankt Onuphrius intill. Tre gravgrottor som rensades 1989 innehöll ossuarier och fynd från första århundradet. Platsen ligger i dag mellan stadsdelarna Abu Tor och Silwan, med utsikt mot Gamla stadens murar."
  nb:
    - "Hakeldama, arameisk for «blodåker», er jordstykket i Jerusalem som ble kjøpt for de tretti sølvpengene Judas tok for å forråde Jesus. Matteus forteller at yppersteprestene, som ikke ville legge blodpengene i tempelkisten, «kjøpte for pengene pottemakerens aker til gravsted for fremmede. Derfor heter denne aker Blodakeren den dag idag». Apostlenes gjerninger sier, i Peters tale, at Judas selv «kjøpte sig nu en aker for lønnen for sin ugjerning», døde der ved et fall, og at åkeren «på deres eget mål fikk navnet Hakeldama, det er blodaker». De to beretningene er ulike med hensyn til hvem som kjøpte åkeren og hvorfor den fikk navnet, og lesere har stilt dem ved siden av hverandre siden oldtiden."
    - "Fra minst 300-tallet har navnet vært festet til sørskråningen av Hinnoms dal, der den møter Kedron under høyden som senere ble kalt Sionfjellet: Eusebius kjente åkeren som fortsatt vist ved Sionfjellet, og Hieronymus, som oversatte ham, plasserte den på sørsiden av Sionfjellet. Skråningen er gjennomskåret av fjellgraver fra annen tempels tid. I korsfarertiden ble et stort hvelvet benhus for begravelse av pilegrimer bygd over gravene, og på slutten av 1800-tallet reiste det gresk-ortodokse klosteret St. Onufrius seg ved siden av. Tre gravhuler som ble tømt i 1989, inneholdt beinhus og funn fra det første århundre. Stedet ligger i dag mellom bydelene Abu Tor og Silwan, med utsikt mot murene i gamlebyen."
  tl:
    - "Ang Aceldama, Aramaiko para sa “bukid ng dugo”, ay ang lupain sa Jerusalem na binili ng tatlumpung putol na pilak na tinanggap ni Judas sa pagkakanulo kay Jesus. Isinasalaysay ni Mateo na ang mga pangulong saserdote, na hindi naglagay ng halaga ng dugo sa kabang-yaman, ay nagsanggunian at “ibinili nila ang mga yaon ng bukid ng magpapalyok, upang paglibingan ng mga taga ibang bayan. Dahil dito'y tinawag ang bukid na yaon, ang bukid ng dugo, hanggang ngayon”. Sinasabi ng Mga Gawa, sa pananalita ni Pedro, na si Judas mismo ay kumuha ng “isang parang sa pamamagitan ng ganti sa kaniyang katampalasanan”, namatay doon sa pagkahulog, at ang parang ay tinawag “sa kanilang wika na Aceldama, sa makatuwid baga'y, Ang parang ng Dugo”. Magkaiba ang dalawang salaysay kung sino ang bumili at bakit gayon ang pangalan; pinagtatabi na sila ng mga mambabasa mula pa noong sinauna."
    - "Mula pa noong ika-4 na siglo man lamang, nakatali ang pangalan sa katimugang dalisdis ng libis ng Hinnom, kung saan ito sumasalubong sa Cedron sa ibaba ng burol na kalaunang tinawag na Bundok Sion: kilala ni Eusebio ang bukid bilang ipinakikita pa sa tabi ng Bundok Sion, at inilagay ito ni Jeronimo, na nagsalin sa kaniya, sa timog na bahagi ng Bundok Sion. May mga libingang inukit sa bato ng panahon ng Ikalawang Templo ang dalisdis. Noong panahon ng mga Krusado, itinayo sa ibabaw ng mga libingan ang malaking osuaryong may bóveda para sa paglilibing ng mga peregrino, at noong huling bahagi ng ika-19 na siglo ay tumaas sa tabi nito ang monasteryong Ortodoksong Griyego ni San Onufrio. Ang tatlong yungib-libingang nilinis noong 1989 ay may mga osuaryo at mga natagpuan ng unang siglo. Nasa pagitan ng Abu Tor at Silwan ngayon, tanaw ang mga pader ng Lumang Lungsod."
  da:
    - "Hakeldama, arameisk for »blodets mark«, er jordstykket i Jerusalem, købt for de tredive sølvpenge, som Judas tog for at forråde Jesus. Mattæus fortæller, at ypperstepræsterne ikke ville lægge blodprisen i skatkammeret, men at »efter at have holdt Raad købte de Pottemagermarken derfor til Gravsted for de fremmede. Derfor blev den Mark kaldt Blodmarken indtil den Dag i Dag«. Apostlenes Gerninger siger i Peters tale, om Judas: »Han erhvervede sig nu en Ager for sin Uretfærdigheds Løn«, at han døde dér ved et fald, og at marken kaldes »paa deres eget Maal Hakeldama, det er Blodager«. De to beretninger afviger i, hvem der købte marken, og hvorfor den fik sit navn, og læserne har holdt dem op mod hinanden siden oldtiden."
    - "Fra mindst 300-tallet har navnet været knyttet til den sydlige skråning af Hinnoms dal, hvor den møder Kedron under den høj, der senere kaldtes Zions Bjerg: Eusebius kendte marken som stadig vist ved Zions Bjerg, og Hieronymus, der oversatte ham, placerede den på Zions Bjergs sydside. Skråningen er gennemskåret af klippegrave fra Andet Tempels tid. I korsfarertiden blev et stort hvælvet benhus til begravelse af pilgrimme bygget over gravene, og i slutningen af 1800-tallet rejste det græsk-ortodokse Sankt Onufrios-kloster sig ved siden af. Tre gravgrotter, ryddet i 1989, rummede ossuarier og fund fra første århundrede. Stedet ligger i dag mellem kvartererne Abu Tor og Silwan, med udsigt til den gamle bys mure."
  sr:
    - "Акелдама, на арамејском „њива крви“, јесте парцела земље у Јерусалиму купљена за тридесет сребрника које је Јуда узео за издају Исуса. Матеј прича да су главари свештенички, који нису хтели да цену крви метну у хазну, „купише за њих лончареву њиву за гробље гостима. Од тога се и прозва она њива крвна њива и до данас“. Дела апостолска, у току Петровог говора, кажу да је Јуда сам стекао њиву „од плате неправедне“, да је ту умро падом и да се њива прозвала „њиховим језиком Акелдама, које значи њива крвна“. Два извештаја се разликују у томе ко је купио њиву и зашто је тако названа, а тумачи их од давнина стављају једно уз друго."
    - "Најмање од 4. века име је везано за јужну падину долине Хином, где се спаја с Кедроном испод брега који ће се касније звати брдо Сион: Јевсевије је знао њиву као још увек показивану код брда Сион, а Јероним, преводећи га, сместио ју је на јужну страну брда Сион. Падина је изрезана стеновитим гробницама из периода Другог храма. У крсташко доба над гробницама је подигнута велика засведена костурница за сахрањивање ходочасника, а крајем 19. века поред ње је никао грчки православни манастир светог Онуфрија. Три погребне пећине очишћене 1989. садржале су осуарије и налазе из првог века. Место данас лежи између четврти Абу Тор и Силван, у видику градских зидина Старог града."
scripture:
