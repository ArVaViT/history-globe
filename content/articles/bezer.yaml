body:
  en:
    - "Bezer was the city of refuge for the tribes east of the Jordan south of Gilead, “Bezer in the wilderness, in the plain country, of the Reubenites”, the plain being the Mishor, the tableland of Moab north of the Arnon around Medeba and Dibon. Moses set it apart with Ramoth in Gilead and Golan in Bashan “that the slayer might flee thither, which should kill his neighbour unawares”; Joshua repeats the appointment, and the lists of Levitical towns give Bezer with its pasture lands to the sons of Merari. Chronicles writes the name Bezer where the Synodal text, following the Greek, has Bosor. That is all the Bible records; the Bosor of the Maccabean campaign in Gilead is probably a different place further north."
    - "The town outlived its Israelite days as a Moabite one. On the stele of Mesha, king of Moab about 840 BC, now in the Louvre, the king says that he built Bezer, which had been in ruins, with fifty men of Dibon. Where it stood is disputed, and the map keeps the candidates. Many prefer Umm el-Amad, a ruin on the plateau about 13 km north-east of Madaba; others Tall Jalul, a large mound 6 km east of Madaba with an Iron Age town, dug by Andrews University since 1992. Neither has yielded the name."
    - "The ground today is the farming plateau of the Madaba governorate in Jordan, wheat fields and Bedouin villages between Madaba and the desert highway."
  ru:
    - "Бецер был городом убежища для колен к востоку от Иордана южнее Галаада — «Бецер в пустыне, на равнине в колене Рувимовом», причём равнина эта — Мишор, плоскогорье Моава к северу от Арнона вокруг Медевы и Дивона. Моисей отделил его вместе с Рамофом в Галааде и Голаном в Васане, «чтоб убегал туда убийца, который убьет ближнего своего без намерения»; Иисус Навин повторяет назначение, а списки левитских городов отдают Бецер с его предместьями сынам Мерари. В Паралипоменоне Синодальный перевод, следуя греческому, пишет Восор. Это всё, что записала Библия; Восор маккавейского похода в Галаад — вероятно, другое место севернее."
    - "Город пережил израильские дни как моавитский. На стеле Меши, царя Моавитского, около 840 г. до н. э., ныне в Лувре, царь говорит, что построил Бецер, лежавший в развалинах, силами пятидесяти человек из Дивона. Где он стоял, спорно, и карта хранит кандидатов. Многие предпочитают Умм-эль-Амад, руины на плато примерно в 13 км к северо-востоку от Мадабы; другие — Телль-Джалул, большой холм в 6 км к востоку от Мадабы с городом железного века, который с 1992 года копает Университет Эндрюса. Ни то, ни другое не дало имени."
    - "Эта земля сегодня — земледельческое плато мухафазы Мадаба в Иордании: пшеничные поля и бедуинские селения между Мадабой и пустынным шоссе."
  uk:
    - "Бецер був містом-захистком для племен на схід від Йордану, на південь від Гілеаду, «Безер у степу, на поділлї, для Рубенїїв», причому рівнина — це Мішор, моавське плоскогір'я на північ від Арнону навколо Мадаби та Дівону. Мойсей відокремив його разом із Рамотом у Гілеаді та Голаном у Башані, «щоб втїкав туди убийця, що ненароком вбив ближнього свого»; Ісус Навин повторює це призначення, а списки левітських міст віддають Бецер із його пасовиськами синам Мерарі. Книга Хронік пише ім'я Бецер там, де Синодальний текст, услід за грецьким, має Восор. Це все, що записала Біблія; Восор макавейської кампанії в Гілеаді — імовірно, інше місце, далі на півночі."
    - "Місто пережило свої ізраїльські дні як моавське. На стелі Меші, царя Моаву близько 840 р. до н. е., яка нині в Луврі, цар каже, що збудував Бецер, який лежав у руїнах, із п'ятдесятьма чоловіками з Дівону. Де саме він стояв, є спірним, і мапа зберігає кандидатів. Багато хто віддає перевагу Умм-ель-Амаду, руїнам на плато приблизно за 13 км на північний схід від Мадаби; інші — Телль-Джалулу, великому горбові за 6 км на схід від Мадаби з містом залізної доби, який від 1992 р. розкопує Ендрюсівський університет. Жодне з них не дало цієї назви."
    - "Сьогодні ця земля — орне плато мухафази Мадаба в Йорданії, пшеничні поля й бедуїнські села між Мадабою та пустельною магістраллю."
  es:
    - "Beser fue la ciudad de refugio de las tribus al este del Jordán, al sur de Galaad, «Beser en el desierto, en tierra de la llanura, de los Rubenitas», siendo la llanura el Mishor, la meseta de Moab al norte del Arnón, en torno a Medeba y Dibón. Moisés la apartó junto con Ramot de Galaad y Golán de Basán «para que huyese allí el homicida que matase á su prójimo por yerro»; Josué repite la designación, y las listas de ciudades levíticas dan Beser con sus ejidos a los hijos de Merari. Crónicas escribe el nombre Beser allí donde el texto sinodal, siguiendo al griego, tiene Bosor. Eso es todo lo que registra la Biblia; el Bosor de la campaña macabea en Galaad es probablemente otro lugar más al norte."
    - "La ciudad sobrevivió a su época israelita como ciudad moabita. En la estela de Mesa, rey de Moab hacia el 840 a. C., hoy en el Louvre, el rey dice que edificó Beser, que estaba en ruinas, con cincuenta hombres de Dibón. Dónde se hallaba es objeto de debate, y el mapa conserva los candidatos. Muchos prefieren Umm el-Amad, una ruina en la meseta a unos 13 km al nordeste de Madaba; otros, Tall Jalul, un gran montículo a 6 km al este de Madaba con una ciudad de la Edad del Hierro, excavado por la Universidad Andrews desde 1992. Ninguno ha proporcionado el nombre."
    - "El terreno es hoy la meseta agrícola de la gobernación de Madaba, en Jordania: campos de trigo y aldeas beduinas entre Madaba y la carretera del desierto."
  pt:
    - "Bezer era a cidade de refúgio das tribos a leste do Jordão, ao sul de Gileade, “Bezer, no deserto, na região do planalto, para os rubenitas”, sendo o planalto o Mishor, o planalto de Moabe ao norte do Arnom, em torno de Medeba e Dibom. Moisés a separou com Ramote, em Gileade, e Golã, em Basã, “para que o homicida pudesse fugir para lá, aquele que matasse o seu próximo sem intenção”; Josué repete a designação, e as listas das cidades levíticas dão Bezer, com as suas pastagens, aos filhos de Merari. As Crônicas escrevem o nome Bezer onde o texto sinodal, seguindo o grego, traz Bosor. Isso é tudo o que a Bíblia registra; a Bosor da campanha macabaica em Gileade é provavelmente outro lugar, mais ao norte."
    - "A cidade sobreviveu aos dias israelitas como cidade moabita. Na estela de Mesa, rei de Moabe por volta de 840 a.C., hoje no Louvre, o rei diz que construiu Bezer, que estava em ruínas, com cinquenta homens de Dibom. Onde ela ficava é disputado, e o mapa conserva os candidatos. Muitos preferem Umm el-Amad, uma ruína no planalto, cerca de 13 km a nordeste de Madaba; outros, Tall Jalul, um grande monte 6 km a leste de Madaba, com uma cidade da Idade do Ferro, escavado pela Universidade Andrews desde 1992. Nenhum dos dois forneceu o nome."
    - "O terreno hoje é o planalto agrícola da província de Madaba, na Jordânia: campos de trigo e aldeias beduínas entre Madaba e a rodovia do deserto."
  de:
    - "Bezer war die Freistadt für die Stämme östlich des Jordan südlich von Gilead, „Bezer in der Wüste im ebnen Lande unter den Rubenitern“; die Ebene ist der Mischor, die Hochebene Moabs nördlich des Arnon um Medeba und Dibon. Mose sonderte sie zusammen mit Ramot in Gilead und Golan in Baschan aus, „daß dahin flöhe, wer seinen Nächsten totschlägt unversehens“; Josua wiederholt die Bestimmung, und die Listen der Levitenstädte geben Bezer mit seinen Weideländern den Söhnen Meraris. Die Chronik schreibt den Namen Bezer, wo der synodale Text nach dem Griechischen Bosor hat. Das ist alles, was die Bibel berichtet; das Bosor des makkabäischen Feldzugs in Gilead ist wahrscheinlich ein anderer Ort weiter nördlich."
    - "Die Stadt überdauerte ihre israelitische Zeit als moabitische. Auf der Stele des Mesa, des Königs von Moab um 840 v. Chr., heute im Louvre, sagt der König, er habe Bezer, das in Trümmern gelegen hatte, mit fünfzig Männern aus Dibon gebaut. Wo es lag, ist umstritten, und die Karte hält die Kandidaten fest. Viele bevorzugen Umm el-Amad, eine Ruine auf der Hochebene etwa 13 km nordöstlich von Madaba; andere Tall Dschalul, einen großen Hügel 6 km östlich von Madaba mit einer eisenzeitlichen Stadt, den die Andrews University seit 1992 ausgräbt. Keiner von beiden hat den Namen geliefert."
    - "Der Boden ist heute die landwirtschaftlich genutzte Hochebene des Gouvernements Madaba in Jordanien, mit Weizenfeldern und Beduinendörfern zwischen Madaba und dem Wüstenhighway."
  fr:
    - "Betser était la ville de refuge des tribus à l’est du Jourdain, au sud de Galaad : « Betser, dans le désert, dans la plaine, chez les Rubénites », la plaine étant le Mishor, le plateau de Moab au nord de l’Arnon, autour de Médeba et de Dibon. Moïse la mit à part avec Ramoth en Galaad et Golan en Basan « afin qu’elles servissent de refuge au meurtrier qui aurait involontairement tué son prochain » ; Josué renouvelle cette désignation, et les listes de villes lévitiques donnent Betser avec ses pâturages aux fils de Merari. Les Chroniques écrivent Betser là où le texte synodal, suivant le grec, a Bosor. C’est tout ce que dit la Bible ; le Bosor de la campagne maccabéenne en Galaad est probablement un autre lieu, plus au nord."
    - "La ville survécut à l’époque israélite comme ville moabite. Sur la stèle de Mescha, roi de Moab vers 840 av. J.-C., aujourd’hui au Louvre, le roi dit avoir bâti Betser, qui était en ruines, avec cinquante hommes de Dibon. Son emplacement est discuté, et la carte conserve les candidats. Beaucoup préfèrent Umm el-Amad, une ruine sur le plateau à environ 13 km au nord-est de Madaba ; d’autres Tall Jalul, grand tertre à 6 km à l’est de Madaba, avec une ville de l’âge du Fer, fouillé par l’Université Andrews depuis 1992. Aucun n’a livré le nom."
    - "Le terrain est aujourd’hui le plateau agricole du gouvernorat de Madaba, en Jordanie, avec des champs de blé et des villages bédouins entre Madaba et la route du désert."
  it:
    - "Beser era la città di rifugio per le tribù a est del Giordano a sud di Galaad, «Betser, nel deserto, nella regione piana, per i Rubeniti», la pianura essendo il Mishor, l’altopiano di Moab a nord dell’Arnon attorno a Màdaba e Dibon. Mosè la separò insieme a Ramot in Galaad e a Golan in Basan: «perché servissero di rifugio all’omicida che avesse ucciso il suo prossimo involontariamente»; Giosuè ripete la designazione, e gli elenchi delle città levitiche assegnano Beser con i suoi pascoli ai figli di Merari. Le Cronache scrivono il nome Beser dove il testo sinodale, seguendo il greco, ha Bosor. È tutto ciò che la Bibbia riferisce; il Bosor della campagna dei Maccabei in Galaad è probabilmente un luogo diverso più a nord."
    - "La città sopravvisse ai suoi giorni israelitici come città moabita. Sulla stele di Mesa, re di Moab intorno all’840 a.C., ora al Louvre, il re dice di aver costruito Beser, che era in rovina, con cinquanta uomini di Dibon. Dove sorgesse è controverso, e la mappa conserva i candidati. Molti preferiscono Umm el-Amad, una rovina sull’altopiano a circa 13 km a nord-est di Madaba; altri Tall Jalul, un grande tell a 6 km a est di Madaba con una città dell’età del Ferro, scavato dalla Andrews University dal 1992. Nessuno dei due ha restituito il nome."
    - "Il terreno è oggi l’altopiano agricolo del governatorato di Madaba, in Giordania: campi di grano e villaggi beduini tra Madaba e la strada del deserto."
  pl:
    - "Beser było miastem ucieczki dla pokoleń na wschód od Jordanu, na południe od Gilead, „Beser na puszczy, w równinie w ziemi Rubenitów”, przy czym równina to Miszor, wyżyna Moabu na północ od Arnonu wokół Medeby i Dibonu. Mojżesz wyznaczył je razem z Ramot w Gilead i Golan w Baszanie, „aby tam uciekał mężobójca, któryby zabił bliźniego swego z nieobaczenia”; Jozue powtarza to wyznaczenie, a wykazy miast lewickich przydzielają Beser z jego pastwiskami synom Merariego. Kroniki zapisują nazwę Beser tam, gdzie tekst synodalny, idąc za greckim, ma Bosor. To wszystko, co zapisuje Biblia; Bosor z wyprawy machabejskiej w Gilead to prawdopodobnie inne miejsce, leżące dalej na północ."
    - "Miasto przetrwało czasy izraelskie jako moabickie. Na steli Mesy, króla Moabu około 840 r. p.n.e., przechowywanej dziś w Luwrze, król mówi, że odbudował Beser, które leżało w ruinie, z pięćdziesięcioma mężami z Dibonu. Gdzie stało, jest sporne, a mapa zachowuje kandydatów. Wielu woli Umm el-Amad, ruinę na płaskowyżu około 13 km na północny wschód od Madaby; inni Tall Dżalul, duży kopiec 6 km na wschód od Madaby z miastem z epoki żelaza, badany przez Andrews University od 1992 r. Żadne z nich nie dostarczyło tej nazwy."
    - "Dziś jest to rolniczy płaskowyż muhafazy Madaba w Jordanii, pola pszenicy i beduińskie wsie między Madabą a pustynną autostradą."
  nl:
    - "Bezer was de vrijstad voor de stammen ten oosten van de Jordaan, ten zuiden van Gilead, “Bezer in de woestijn, in het effen land, voor de Rubenieten”, waarbij het effen land de Misjor is, het plateau van Moab ten noorden van de Arnon rond Medeba en Dibon. Mozes zonderde de stad af met Ramot in Gilead en Golan in Basan, “opdat daarheen vlood de doodslager, die zijn naaste onwetende doodslaat”; Jozua herhaalt de aanwijzing, en de lijsten van levitische steden geven Bezer met zijn weidegronden aan de zonen van Merari. Kronieken schrijft de naam Bezer waar de Synodale tekst, het Grieks volgend, Bosor heeft. Dat is alles wat de Bijbel erover meldt; het Bosor van de Makkabeeënveldtocht in Gilead is waarschijnlijk een andere plaats, verder naar het noorden."
    - "De stad overleefde haar Israëlitische tijd als Moabitische stad. Op de stèle van Mesa, koning van Moab omstreeks 840 v.Chr., die nu in het Louvre staat, zegt de koning dat hij Bezer, dat in puin lag, heeft herbouwd met vijftig man uit Dibon. Waar de stad lag is omstreden, en de kaart houdt de kandidaten aan. Velen geven de voorkeur aan Umm el-Amad, een ruïne op het plateau ongeveer 13 km ten noordoosten van Madaba; anderen aan Tall Jalul, een grote heuvel 6 km ten oosten van Madaba met een stad uit de IJzertijd, sinds 1992 opgegraven door Andrews University. Geen van beide heeft de naam opgeleverd."
    - "De grond is tegenwoordig het landbouwplateau van het gouvernement Madaba in Jordanië, met korenvelden en bedoeïenendorpen tussen Madaba en de woestijnsnelweg."
  cs:
    - "Beser byl útočištným městem pro kmeny východně od Jordánu, jižně od Gileadu, „Bozor na poušti, na rovinách v kraji Rubenitských“, přičemž rovinou je Míšór, moábská náhorní plošina severně od Arnonu kolem Medeby a Dibonu. Mojžíš je vyčlenil spolu s Rámotem v Gileadu a Golánem v Bášanu, „aby utekl do nich vražedlník, kterýž by zabil bližního svého nechtě“; Jozue totéž ustanovení opakuje a seznamy levítských měst dávají Beser s jeho pastvinami synům Merariho. Letopisy píší jméno Beser tam, kde synodální text podle řečtiny má Bosor. To je vše, co Bible zaznamenává; Bosor makabejského tažení v Gileadu je pravděpodobně jiné místo dále na severu."
    - "Město přežilo své izraelské dny jako město moábské. Na stéle Meši, krále Moábu kolem roku 840 př. n. l., nyní v Louvru, král říká, že vystavěl Beser, který ležel v troskách, s padesáti muži z Dibonu. Kde stál, je sporné a mapa zachovává kandidáty. Mnozí dávají přednost Umm el-Amadu, zřícenině na plošině asi 13 km severovýchodně od Mádaby; jiní Tall Džalúlu, velkému pahorku 6 km východně od Mádaby s městem z doby železné, od roku 1992 zkoumanému Andrewsovou univerzitou. Ani jedno místo nevydalo jméno."
    - "Dnes je tam zemědělská plošina madabského guvernorátu v Jordánsku, pšeničná pole a beduínské vesnice mezi Mádabou a pouštní dálnicí."
