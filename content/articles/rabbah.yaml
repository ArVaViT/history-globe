body:
  en:
    - "Rabbah, the chief city of the Ammonites, stood on the hill now called the Citadel in the centre of Amman, the capital of Jordan, above the stream that forms the upper course of the Jabbok. People lived on the hill long before the Iron Age, from the Bronze Age on. In the Iron Age it was the capital of the kingdom of Ammon; an inscription from the Citadel is among the oldest known texts in the Ammonite language. In the 730s BC Sanipu of Ammon is listed among the kings who paid tribute to Tiglath-pileser III of Assyria."
    - 'Deuteronomy says that the iron bedstead of Og, king of Bashan, was kept in Rabbah of the children of Ammon. After the Ammonite king Hanun shamed David''s envoys, Joab besieged Rabbah, and at David''s order Uriah the Hittite was left to die in the fighting before its wall. Joab took "the city of waters" and called David, who captured the city and took the crown of its king. Later Shobi the son of Nahash, of Rabbah, brought supplies to David at Mahanaim. Amos, Jeremiah and Ezekiel foretold judgement on Rabbah, and Ezekiel pictures the king of Babylon at a parting of the ways, choosing between Rabbah and Jerusalem.'
    - "In the third century BC the city was renamed Philadelphia after Ptolemy II Philadelphus of Egypt. In 218 BC the Seleucid king Antiochus III besieged it; Polybius relates that it fell only when a prisoner showed the attackers the underground passage by which the defenders went down for water, and the attackers blocked it. In the 130s BC, Josephus says, a certain Zeno Cotylas was tyrant of Philadelphia. Pliny counts it among the cities of the Decapolis, and at the outbreak of the Jewish revolt in AD 66 Jewish bands fell on Philadelphia and other neighbouring cities."
    - "When the Nabataean kingdom was annexed in AD 106, Philadelphia became part of the Roman province of Arabia. In the second century it was rebuilt with a large theatre, a nymphaeum, colonnaded streets and a great temple on the Citadel, usually called the Temple of Hercules. Early in the fourth century Eusebius wrote that Rabbath, the city of the king of Ammon, was now Philadelphia, a famous city of Arabia. Churches were built there in the Byzantine period, and after the Arab conquest in the seventh century the old name returned as Amman."
  ru:
    - "Равва, главный город Аммонитян, стояла на холме, который ныне называют Цитаделью, в центре Аммана, столицы Иордании, над ручьём, образующим верхнее течение Иавока. Люди жили на холме задолго до железного века, ещё с бронзового века. В железном веке город был столицей Аммонитского царства; надпись из Цитадели — один из древнейших известных текстов на аммонитском языке. В 730-х гг. до н. э. Санипу из Аммона назван среди царей, плативших дань ассирийскому царю Феглаффелласару III."
    - "Второзаконие говорит, что железный одр Ога, царя Васанского, хранился в Равве, у сынов Аммоновых. После того как аммонитский царь Аннон обесчестил послов Давида, Иоав осадил Равву, и по приказу Давида Урию Хеттеянина оставили на смерть в бою у её стены. Иоав, по его словам, «овладел водою города» и позвал Давида, который взял город и венец его царя. Позже Сови, сын Нааса, из Раввы, привёз припасы Давиду в Маханаим. Амос, Иеремия и Иезекииль предрекали Равве суд, а Иезекииль изображает царя Вавилонского на распутье, выбирающим между Раввою и Иерусалимом."
    - "В III веке до н. э. город переименовали в Филадельфию в честь египетского царя Птолемея II Филадельфа. В 218 г. до н. э. его осадил селевкидский царь Антиох III; Полибий рассказывает, что город пал лишь тогда, когда пленник указал осаждавшим подземный ход, по которому защитники спускались за водой, и те завалили его. В 130-х гг. до н. э., по словам Иосифа Флавия, тираном Филадельфии был некий Зенон Котила. Плиний причисляет её к городам Десятиградия, а в начале Иудейского восстания, в 66 г. н. э., иудейские отряды напали на Филадельфию и другие соседние города."
    - "Когда в 106 г. н. э. Набатейское царство было присоединено к Риму, Филадельфия вошла в римскую провинцию Аравия. Во II веке её отстроили заново: большой театр, нимфей, улицы с колоннадами и большой храм на Цитадели, который обычно называют храмом Геракла. В начале IV века Евсевий писал, что Равва, город царя Аммонитского, — это нынешняя Филадельфия, знаменитый город Аравии. В византийское время здесь строились церкви, а после арабского завоевания в VII веке вернулось древнее имя — Амман."
  uk:
    - "Равва, головне місто аммонітян, стояла на пагорбі, нині званому Цитаделлю, в центрі Аммана, столиці Йорданії, над потоком, що утворює верхню течію Яббоку. На пагорбі жили задовго до залізної доби, ще з бронзової. У залізну добу це була столиця царства Аммон; напис із Цитаделі належить до найстаріших відомих текстів аммонітською мовою. У 730-х рр. до н. е. Саніпу Аммонський названий серед царів, що платили данину Тіглатпаласару III Ассирійському."
    - "Повторення Закону каже, що залізне ложе Ога, царя Башану, зберігалося в Равві синів Аммона. Після того як аммонітський цар Аннон зганьбив послів Давида, Йоав облягав Равву, і за наказом Давида Урія Хеттеянин був залишений гинути в бою під її мурами. Йоав узяв «Водяний Город» і покликав Давида, який здобув місто й узяв корону його царя. Пізніше Шові, син Наасу, з Рави, приніс Давидові припаси в Маханаїмі. Амос, Єремія та Єзекіїль провіщали суд над Раввою, а Єзекіїль малює царя Вавилону на роздоріжжі, що вибирає між Раввою та Єрусалимом."
    - "У III ст. до н. е. місто перейменували на Філадельфію на честь Птолемея II Філадельфа Єгипетського. У 218 р. до н. е. селевкідський цар Антіох III облягав його; Полібій розповідає, що воно впало лише тоді, коли полонений показав нападникам підземний хід, яким оборонці спускалися по воду, і нападники його перекрили. У 130-х рр. до н. е., за словами Йосифа Флавія, певний Зенон Котіла був тираном Філадельфії. Пліній зараховує її до міст Десятимістя, а на початку юдейського повстання 66 р. н. е. юдейські загони напали на Філадельфію та інші сусідні міста."
    - "Коли 106 р. н. е. Набатейське царство було анексоване, Філадельфія увійшла до складу римської провінції Аравія. У II ст. її відбудували з великим театром, німфеєм, колонадними вулицями та великим храмом на Цитаделі, який зазвичай називають храмом Геракла. На початку IV ст. Євсевій писав, що Раббата, місто царя Аммону, тепер є Філадельфією, славетним містом Аравії. У візантійський період там було споруджено церкви, а після арабського завоювання в VII ст. стара назва повернулася у формі Амман."
  es:
    - "Rabá, la ciudad principal de los amonitas, se alzaba en la colina hoy llamada la Ciudadela, en el centro de Amán, la capital de Jordania, sobre el arroyo que forma el curso alto del Jaboc. Hubo gente en la colina mucho antes de la Edad del Hierro, desde la Edad del Bronce. En la Edad del Hierro fue la capital del reino de Amón; una inscripción de la Ciudadela está entre los textos más antiguos conocidos en lengua amonita. En la década de 730 a. C. Sanipu de Amón figura entre los reyes que pagaron tributo a Tiglat-pileser III de Asiria."
    - "El Deuteronomio dice que la cama de hierro de Og, rey de Basán, se guardaba en Rabá de los hijos de Amón. Después de que el rey amonita Hanún afrentara a los enviados de David, Joab sitió Rabá, y por orden de David Urías el hitita fue dejado morir en el combate ante su muro. Joab tomó «la ciudad de las aguas» y llamó a David, que capturó la ciudad y tomó la corona de su rey. Más tarde Sobi hijo de Nahas, de Rabá, llevó provisiones a David en Mahanaim. Amós, Jeremías y Ezequiel anunciaron juicio sobre Rabá, y Ezequiel imagina al rey de Babilonia en una encrucijada, eligiendo entre Rabá y Jerusalén."
    - "En el siglo III a. C. la ciudad fue rebautizada Filadelfia por Tolomeo II Filadelfo de Egipto. En 218 a. C. el rey seléucida Antíoco III la sitió; Polibio relata que cayó solo cuando un prisionero mostró a los atacantes el pasaje subterráneo por el que los defensores bajaban a por agua, y los atacantes lo bloquearon. En la década de 130 a. C., dice Josefo, un tal Zenón Cotilas era tirano de Filadelfia. Plinio la cuenta entre las ciudades de la Decápolis, y al estallar la revuelta judía en 66 d. C. bandas judías cayeron sobre Filadelfia y otras ciudades vecinas."
    - "Cuando el reino nabateo fue anexionado en 106 d. C., Filadelfia pasó a formar parte de la provincia romana de Arabia. En el siglo II fue reconstruida con un gran teatro, un ninfeo, calles con columnatas y un gran templo en la Ciudadela, llamado por lo común el Templo de Hércules. A principios del siglo IV Eusebio escribió que Rabbath, la ciudad del rey de Amón, era ahora Filadelfia, una famosa ciudad de Arabia. Se construyeron iglesias allí en el período bizantino, y tras la conquista árabe en el siglo VII el antiguo nombre volvió como Amán."
  pt:
    - "Rabá, a principal cidade dos amonitas, ficava na colina hoje chamada Cidadela, no centro de Amã, capital da Jordânia, acima do riacho que forma o curso superior do Jaboque. Havia gente na colina muito antes da Idade do Ferro, desde a Idade do Bronze. Na Idade do Ferro foi a capital do reino de Amom; uma inscrição da Cidadela está entre os textos mais antigos conhecidos em língua amonita. Na década de 730 a.C., Sanipu de Amom consta entre os reis que pagaram tributo a Tiglate-Pileser III da Assíria."
    - "O Deuteronômio diz que o leito de ferro de Ogue, rei de Basã, estava guardado em Rabá dos filhos de Amom. Depois que o rei amonita Hanum envergonhou os enviados de Davi, Joabe sitiou Rabá, e por ordem de Davi Urias, o heteu, foi deixado para morrer na luta diante de seu muro. Joabe tomou “a cidade das águas” e chamou Davi, que capturou a cidade e tomou a coroa de seu rei. Mais tarde Sobi, filho de Naás, de Rabá, levou provisões a Davi em Maanaim. Amós, Jeremias e Ezequiel predisseram juízo sobre Rabá, e Ezequiel imagina o rei da Babilônia numa bifurcação, escolhendo entre Rabá e Jerusalém."
    - "No século III a.C. a cidade foi rebatizada Filadélfia em honra de Ptolomeu II Filadelfo do Egito. Em 218 a.C. o rei selêucida Antíoco III a sitiou; Políbio relata que ela só caiu quando um prisioneiro mostrou aos atacantes a passagem subterrânea por onde os defensores desciam para buscar água, e os atacantes a bloquearam. Na década de 130 a.C., diz Josefo, um certo Zenão Cotilas era tirano de Filadélfia. Plínio a conta entre as cidades da Decápolis, e na eclosão da revolta judaica em 66 d.C. bandos judeus caíram sobre Filadélfia e outras cidades vizinhas."
    - "Quando o reino nabateu foi anexado em 106 d.C., Filadélfia passou a fazer parte da província romana da Arábia. No século II foi reconstruída com um grande teatro, um ninfeu, ruas de colunas e um grande templo na Cidadela, geralmente chamado Templo de Hércules. No início do século IV, Eusébio escreveu que Rabate, a cidade do rei de Amom, era agora Filadélfia, famosa cidade da Arábia. Igrejas foram construídas ali no período bizantino, e depois da conquista árabe, no século VII, o nome antigo voltou como Amã."
  de:
    - "Rabba, die Hauptstadt der Ammoniter, stand auf dem heute Zitadelle genannten Hügel im Zentrum von Amman, der Hauptstadt Jordaniens, über dem Bach, der den Oberlauf des Jabbok bildet. Schon lange vor der Eisenzeit, seit der Bronzezeit, lebten Menschen auf dem Hügel. In der Eisenzeit war er die Hauptstadt des Königreichs Ammon; eine Inschrift von der Zitadelle gehört zu den ältesten bekannten Texten in ammonitischer Sprache. In den 730er Jahren v. Chr. wird Sanipu von Ammon unter den Königen aufgeführt, die Tiglat-Pileser III. von Assyrien Tribut zahlten."
    - "Das Deuteronomium sagt, das eiserne Bett Ogs, des Königs von Baschan, sei in Rabba der Kinder Ammon aufbewahrt worden. Nachdem der Ammoniterkönig Hanun Davids Gesandte beschämt hatte, belagerte Joab Rabba, und auf Davids Befehl wurde Uria der Hetiter im Kampf vor seiner Mauer sich selbst überlassen und fiel. Joab gewann „die Wasserstadt“ und rief David, der die Stadt einnahm und die Krone ihres Königs nahm. Später brachte Schobi, der Sohn des Nahas, aus Rabba David in Mahanajim Vorräte. Amos, Jeremia und Hesekiel kündigten Rabba Gericht an, und Hesekiel zeichnet den König von Babylon an einer Wegscheide, wo er zwischen Rabba und Jerusalem wählt."
    - "Im 3. Jahrhundert v. Chr. wurde die Stadt nach Ptolemaios II. Philadelphos von Ägypten in Philadelphia umbenannt. Im Jahr 218 v. Chr. belagerte sie der Seleukidenkönig Antiochos III.; Polybios berichtet, sie sei erst gefallen, als ein Gefangener den Angreifern den unterirdischen Gang zeigte, auf dem die Verteidiger zum Wasser hinabstiegen, und die Angreifer ihn versperrten. In den 130er Jahren v. Chr. war nach Josephus ein gewisser Zenon Kotylas Tyrann von Philadelphia. Plinius zählt es zur Dekapolis, und beim Ausbruch des jüdischen Aufstands im Jahr 66 n. Chr. fielen jüdische Banden über Philadelphia und andere Nachbarstädte her."
    - "Als das Nabatäerreich 106 n. Chr. annektiert wurde, wurde Philadelphia Teil der römischen Provinz Arabia. Im 2. Jahrhundert wurde es mit einem großen Theater, einem Nymphäum, Säulenstraßen und einem großen Tempel auf der Zitadelle, gewöhnlich Herkulestempel genannt, neu gebaut. Im frühen 4. Jahrhundert schrieb Eusebius, Rabbath, die Stadt des Königs von Ammon, sei nun Philadelphia, eine berühmte Stadt Arabiens. In byzantinischer Zeit wurden dort Kirchen gebaut, und nach der arabischen Eroberung im 7. Jahrhundert kehrte der alte Name als Amman zurück."
  fr:
    - "Rabba, la principale ville des Ammonites, se dressait sur la colline appelée aujourd’hui la Citadelle, au centre d’Amman, capitale de la Jordanie, au-dessus du cours d’eau qui forme le cours supérieur du Jabbok. On vivait sur la colline bien avant l’âge du Fer, dès l’âge du Bronze. À l’âge du Fer, elle fut la capitale du royaume d’Ammon ; une inscription de la Citadelle compte parmi les plus anciens textes connus en langue ammonite. Dans les années 730 av. J.-C., Sanipou d’Ammon figure parmi les rois qui payaient tribut à Tiglath-Piléser III d’Assyrie."
    - "Le Deutéronome dit que le lit de fer d’Og, roi de Basan, était conservé à Rabba des fils d’Ammon. Après que le roi ammonite Hanun eut outragé les envoyés de David, Joab assiégea Rabba, et sur l’ordre de David Urie le Héthien fut laissé à la mort dans le combat devant son mur. Joab prit « la ville des eaux » et appela David, qui prit la ville et enleva la couronne de son roi. Plus tard Schobi, fils de Nachasch, de Rabba, apporta des vivres à David à Mahanaïm. Amos, Jérémie et Ézéchiel annoncèrent le jugement sur Rabba, et Ézéchiel montre le roi de Babylone à un carrefour, choisissant entre Rabba et Jérusalem."
    - "Au IIIe siècle av. J.-C., la ville fut rebaptisée Philadelphie d’après Ptolémée II Philadelphe d’Égypte. En 218 av. J.-C., le roi séleucide Antiochos III l’assiégea ; Polybe raconte qu’elle ne tomba que lorsqu’un prisonnier montra aux assaillants le passage souterrain par où les défenseurs descendaient chercher l’eau, et qu’ils l’obstruèrent. Dans les années 130 av. J.-C., dit Flavius Josèphe, un certain Zénon Cotylas était tyran de Philadelphie. Pline la compte parmi les villes de la Décapole, et au déclenchement de la révolte juive en 66 apr. J.-C., des bandes juives fondirent sur Philadelphie et d’autres villes voisines."
    - "Quand le royaume nabatéen fut annexé en 106 apr. J.-C., Philadelphie fit partie de la province romaine d’Arabie. Au IIe siècle, elle fut rebâtie avec un grand théâtre, un nymphée, des rues à colonnades et un grand temple sur la Citadelle, d’ordinaire appelé Temple d’Hercule. Au début du IVe siècle, Eusèbe écrivit que Rabbath, la ville du roi d’Ammon, était maintenant Philadelphie, ville célèbre d’Arabie. Des églises y furent bâties à l’époque byzantine, et après la conquête arabe du VIIe siècle l’ancien nom revint sous la forme Amman."
  it:
    - "Rabba, la città principale degli Ammoniti, sorgeva sulla collina oggi chiamata la Cittadella nel centro di Amman, capitale della Giordania, sopra il torrente che forma il corso superiore dello Iabbok. Sulla collina si abitava molto prima dell’età del Ferro, fin dall’età del Bronzo. Nell’età del Ferro fu la capitale del regno di Ammon; un’iscrizione dalla Cittadella è tra i più antichi testi noti in lingua ammonita. Negli anni 730 a.C. Sanipu di Ammon è elencato tra i re che pagarono tributo a Tiglat-Pilèser III d’Assiria."
    - "Il Deuteronomio dice che il letto di ferro di Og, re di Basan, era custodito a Rabba degli Ammoniti. Dopo che il re ammonita Canun umiliò gli inviati di Davide, Ioab assediò Rabba, e per ordine di Davide Uria l’Hittita fu lasciato morire nei combattimenti davanti alle sue mura. Ioab prese «la città delle acque» e chiamò Davide, che conquistò la città e prese la corona del suo re. Più tardi Sobi figlio di Naas, di Rabba, portò provviste a Davide a Maanaim. Amos, Geremia ed Ezechiele predissero il giudizio su Rabba, ed Ezechiele raffigura il re di Babilonia a un bivio, che sceglie tra Rabba e Gerusalemme."
    - "Nel III secolo a.C. la città fu ribattezzata Filadelfia in onore di Tolomeo II Filadelfo d’Egitto. Nel 218 a.C. il re seleucide Antioco III la assediò; Polibio racconta che cadde solo quando un prigioniero mostrò agli assalitori il passaggio sotterraneo per cui i difensori scendevano all’acqua, e gli assalitori lo bloccarono. Negli anni 130 a.C., dice Giuseppe Flavio, un certo Zenone Cotila era tiranno di Filadelfia. Plinio la conta tra le città della Decapoli, e allo scoppio della rivolta giudaica nel 66 d.C. bande ebraiche piombarono su Filadelfia e su altre città vicine."
    - "Quando il regno nabateo fu annesso nel 106 d.C., Filadelfia entrò a far parte della provincia romana d’Arabia. Nel II secolo fu ricostruita con un grande teatro, un ninfeo, vie colonnate e un grande tempio sulla Cittadella, di solito chiamato Tempio di Ercole. All’inizio del IV secolo Eusebio scrisse che Rabbat, la città del re di Ammon, era ora Filadelfia, una celebre città d’Arabia. Nel periodo bizantino vi furono costruite chiese, e dopo la conquista araba nel VII secolo l’antico nome tornò come Amman."
  pl:
    - "Rabba, główne miasto Ammonitów, stała na wzgórzu zwanym dziś Cytadelą w centrum Ammanu, stolicy Jordanii, nad strumieniem tworzącym górny bieg Jabboku. Ludzie mieszkali na wzgórzu na długo przed epoką żelaza, od epoki brązu. W epoce żelaza była stolicą królestwa Ammonu; napis z Cytadeli należy do najstarszych znanych tekstów w języku ammonickim. W latach 730. p.n.e. Sanipu z Ammonu wymieniany jest wśród królów płacących trybut Tiglat-Pileserowi III z Asyrii."
    - "Księga Powtórzonego Prawa mówi, że żelazne łoże Oga, króla Baszanu, przechowywano w Rabbie synów Ammonowych. Gdy król ammonicki Chanun zhańbił posłów Dawida, Joab oblegał Rabbę, a z rozkazu Dawida Uriasz Chittyta został pozostawiony na śmierć w walce przed jej murem. Joab zdobył „miasto wód” i wezwał Dawida, który zdobył miasto i zabrał koronę jego króla. Później Szobi, syn Nachasza, z Rabby, przyniósł zaopatrzenie Dawidowi do Mahanaim. Amos, Jeremiasz i Ezechiel zapowiedzieli sąd nad Rabbą, a Ezechiel ukazuje króla Babilonu na rozdrożu, wybierającego między Rabbą a Jerozolimą."
    - "W III wieku p.n.e. miasto przemianowano na Filadelfię na cześć Ptolemeusza II Filadelfosa z Egiptu. W 218 roku p.n.e. król seleucydzki Antioch III oblegał je; Polibiusz opowiada, że padło dopiero wtedy, gdy jeniec pokazał napastnikom podziemne przejście, którym obrońcy schodzili po wodę, a napastnicy je zablokowali. W latach 130. p.n.e., mówi Józef Flawiusz, pewien Zenon Kotylas był tyranem Filadelfii. Pliniusz zalicza ją do miast Dekapolu, a na początku powstania żydowskiego w 66 roku n.e. żydowskie bandy napadły na Filadelfię i inne sąsiednie miasta."
    - "Gdy w 106 roku n.e. przyłączono królestwo Nabatejczyków, Filadelfia weszła do rzymskiej prowincji Arabii. W II wieku odbudowano ją z wielkim teatrem, nimfeum, ulicami kolumnadowymi i wielką świątynią na Cytadeli, zwykle zwaną Świątynią Herkulesa. Na początku IV wieku Euzebiusz pisał, że Rabbat, miasto króla Ammonu, to teraz Filadelfia, sławne miasto Arabii. W okresie bizantyńskim zbudowano tam kościoły, a po arabskim podboju w VII wieku dawna nazwa powróciła jako Amman."
  cs:
    - "Rabba, hlavní město Amónců, stála na pahorku, který se dnes nazývá Citadela, ve středu Ammánu, hlavního města Jordánska, nad potokem tvořícím horní tok Jaboku. Lidé na pahorku žili dlouho před dobou železnou, od doby bronzové. V době železné byla hlavním městem království Amón; nápis z Citadely patří k nejstarším známým textům v amónském jazyce. Ve 30. letech 8. století př. n. l. je Sanipu z Amónu uveden mezi králi, kteří platili tribut Tiglatpilesarovi III. Asyrskému."
    - "Deuteronomium praví, že železné lože Óga, krále Bášanu, bylo uloženo v Rabbě synů Amónových. Poté, co amónský král Chanún zahanbil Davidovy posly, oblehl Rabbu Joáb a z Davidova rozkazu byl Urijáš Chetejský ponechán zahynout v boji před jejími hradbami. Joáb dobyl „město vod“ a zavolal Davida, který město zajal a vzal korunu jeho krále. Později Šobi syn Nachašův z Rabby přinesl Davidovi zásoby do Machanajim. Amos, Jeremjáš a Ezechiel předpověděli Rabbě soud a Ezechiel líčí babylónského krále na rozcestí, volícího mezi Rabbou a Jeruzalémem."
    - "Ve 3. století př. n. l. bylo město přejmenováno na Filadelfii po Ptolemaiovi II. Filadelfovi Egyptském. Roku 218 př. n. l. je oblehl seleukovský král Antiochos III.; Polybios vypráví, že padlo teprve tehdy, když zajatec ukázal útočníkům podzemní chodbu, kterou obránci scházeli pro vodu, a útočníci ji zablokovali. Ve 130. letech př. n. l. byl podle Josepha tyranem Filadelfie jakýsi Zénón Kotylás. Plinius ji počítá mezi města Dekapole a při vypuknutí židovského povstání roku 66 n. l. židovské bandy napadly Filadelfii a další sousední města."
    - "Když bylo roku 106 n. l. připojeno Nabatejské království, stala se Filadelfie částí římské provincie Arábie. Ve 2. století byla přestavěna s velkým divadlem, nymfeem, kolonádovými ulicemi a velkým chrámem na Citadele, obvykle zvaným Héraklův chrám. Počátkem 4. století napsal Eusebius, že Rabbath, město krále Amónova, je nyní Filadelfie, slavné město Arábie. V byzantské době tam byly vystavěny kostely a po arabském dobytí v 7. století se staré jméno vrátilo jako Ammán."
  nl:
    - "Rabba, de hoofdstad van de Ammonieten, lag op de heuvel die nu de Citadel heet in het centrum van Amman, de hoofdstad van Jordanië, boven de beek die de bovenloop van de Jabbok vormt. Er woonden al lang vóór de ijzertijd mensen op de heuvel, vanaf de bronstijd. In de ijzertijd was het de hoofdstad van het koninkrijk Ammon; een opschrift van de Citadel behoort tot de oudste bekende teksten in de Ammonitische taal. In de jaren 730 v.Chr. staat Sanipu van Ammon vermeld onder de koningen die schatting betaalden aan Tiglat-Pileser III van Assyrië."
    - "Deuteronomium zegt dat het ijzeren bed van Og, koning van Basan, in Rabba van de Ammonieten werd bewaard. Nadat de Ammonitische koning Chanun Davids gezanten had beschaamd, belegerde Joab Rabba, en op Davids bevel werd Uria de Hethiet aan de strijd voor de muur prijsgegeven. Joab nam “de waterstad” in en riep David, die de stad veroverde en de kroon van haar koning nam. Later bracht Sobi, de zoon van Nachas, uit Rabba, voorraden naar David in Machanaïm. Amos, Jeremia en Ezechiël voorspelden oordeel over Rabba, en Ezechiël beeldt de koning van Babylon uit op een tweesprong, kiezend tussen Rabba en Jeruzalem."
    - "In de 3e eeuw v.Chr. werd de stad herdoopt tot Filadelfia, naar Ptolemaeus II Philadelphus van Egypte. In 218 v.Chr. belegerde de Seleucidische koning Antiochus III haar; Polybios vertelt dat ze pas viel toen een gevangene de aanvallers de ondergrondse gang toonde waardoor de verdedigers water gingen halen, en de aanvallers die afsloten. In de jaren 130 v.Chr. was volgens Josephus een zekere Zeno Kotylas tiran van Filadelfia. Plinius rekent haar tot de steden van de Dekapolis, en bij het uitbreken van de Joodse opstand in 66 n.Chr. vielen Joodse benden Filadelfia en andere naburige steden aan."
    - "Toen het Nabateese koninkrijk in 106 n.Chr. werd geannexeerd, werd Filadelfia deel van de Romeinse provincie Arabië. In de 2e eeuw werd het herbouwd met een groot theater, een nymfeum, zuilenstraten en een grote tempel op de Citadel, meestal de Tempel van Hercules genoemd. Begin 4e eeuw schreef Eusebius dat Rabbath, de stad van de koning van Ammon, nu Filadelfia was, een beroemde stad van Arabië. In de Byzantijnse tijd werden er kerken gebouwd, en na de Arabische verovering in de 7e eeuw keerde de oude naam terug als Amman."
  sv:
    - "Rabba, ammoniternas huvudstad, låg på kullen som nu kallas Citadellet i centrala Amman, Jordaniens huvudstad, ovanför bäcken som bildar Jabboks övre lopp. Människor bodde på kullen långt före järnåldern, från bronsåldern och framåt. Under järnåldern var den huvudstad i kungariket Ammon; en inskription från Citadellet hör till de äldsta kända texterna på ammonitiska. På 730-talet f.Kr. förtecknas Sanipu av Ammon bland de kungar som betalade tribut till Tiglat-Pileser III av Assyrien."
    - "Femte Mosebok säger att järnsängen som tillhörde Og, kungen av Bashan, förvarades i Rabba i Ammons barns land. Sedan den ammonitiske kungen Hanun hade förödmjukat Davids sändebud belägrade Joav Rabba, och på Davids order lämnades hetiten Uria att dö i striden framför dess mur. Joav intog ”Vattenstaden” och kallade på David, som intog staden och tog kronan från dess kung. Senare förde Shovi, Nachashs son, från Rabba, förnödenheter till David i Mahanajim. Amos, Jeremia och Hesekiel förutsade dom över Rabba, och Hesekiel skildrar Babylons kung vid ett vägskäl, där han väljer mellan Rabba och Jerusalem."
    - "På 200-talet f.Kr. döptes staden om till Filadelfia efter Ptolemaios II Filadelfos av Egypten. År 218 f.Kr. belägrade den seleukidiske kungen Antiochos III den; Polybios berättar att den föll först när en fånge visade angriparna den underjordiska gång genom vilken försvararna gick ned efter vatten, och angriparna blockerade den. På 130-talet f.Kr. var, säger Josefus, en viss Zenon Kotylas tyrann i Filadelfia. Plinius räknar den bland Dekapolis städer, och när det judiska upproret bröt ut år 66 e.Kr. föll judiska band över Filadelfia och andra grannstäder."
    - "När det nabatéiska kungariket annekterades år 106 e.Kr. blev Filadelfia en del av den romerska provinsen Arabien. På 100-talet byggdes det om med en stor teater, ett nymfeum, kolonnförsedda gator och ett stort tempel på Citadellet, vanligen kallat Herkulestemplet. I början av 300-talet skrev Eusebios att Rabbat, ammoniternas kungs stad, nu var Filadelfia, en berömd stad i Arabien. Kyrkor byggdes där under bysantinsk tid, och efter den arabiska erövringen på 600-talet återkom det gamla namnet som Amman."
  nb:
    - "Rabba, ammonittenes hovedstad, lå på høyden som nå kalles Citadellet i sentrum av Amman, Jordans hovedstad, over bekken som danner øvre løp av Jabbok. Mennesker bodde på høyden lenge før jernalderen, fra bronsealderen av. I jernalderen var den hovedstad i kongeriket Ammon; en inskripsjon fra Citadellet hører til de eldste kjente tekstene på ammonittisk. På 730-årene f.Kr. er Sanipu av Ammon oppført blant kongene som betalte skatt til Tiglat-Pileser III av Assyria."
    - "5. Mosebok sier at Ogs jernseng, kongen av Basan, ble oppbevart i Rabba, ammonittenes by. Etter at den ammonittiske kongen Hanun hadde vanæret Davids sendebud, beleiret Joab Rabba, og etter Davids ordre ble hetitten Uria latt dø i kampen foran muren. Joab tok «vannbyen» og kalte på David, som erobret byen og tok kongens krone. Senere brakte Sjobi, sønn av Nahasj, fra Rabba, forsyninger til David i Mahanajim. Amos, Jeremia og Esekiel forutsa dom over Rabba, og Esekiel ser Babylons konge ved et veiskille, der han velger mellom Rabba og Jerusalem."
    - "På 200-tallet f.Kr. ble byen omdøpt til Filadelfia etter Ptolemaios II Filadelfos av Egypt. I 218 f.Kr. beleiret den seleukidiske kongen Antiokhos III den; Polybios forteller at den falt først da en fange viste angriperne den underjordiske gangen forsvarerne gikk ned til vann i, og angriperne blokkerte den. På 130-årene f.Kr. var, sier Josefus, en viss Zenon Kotylas tyrann i Filadelfia. Plinius regner den blant byene i Dekapolis, og ved utbruddet av det jødiske opprøret i 66 e.Kr. falt jødiske bander over Filadelfia og andre nabobyer."
    - "Da Nabateerriket ble annektert i 106 e.Kr., ble Filadelfia en del av den romerske provinsen Arabia. På 100-tallet ble den gjenreist med et stort teater, et nymfeum, søylegater og et stort tempel på Citadellet, vanligvis kalt Herkules-tempelet. Tidlig på 300-tallet skrev Eusebius at Rabbath, kongen av Ammons by, nå var Filadelfia, en berømt by i Arabia. Kirker ble bygd der i bysantinsk tid, og etter den arabiske erobringen på 600-tallet kom det gamle navnet tilbake som Amman."
  tl:
    - "Ang Rabba, ang pangunahing lungsod ng mga Ammonita, ay nakatayo sa burol na tinatawag ngayong Citadel sa gitna ng Amman, ang kabisera ng Jordan, sa itaas ng batis na bumubuo sa itaas na agos ng Jaboc. Matagal nang tinitirhan ang burol bago ang Panahong Bakal, mula pa sa Panahong Tanso. Noong Panahong Bakal, ito ang kabisera ng kaharian ng Ammon; ang isang inskripsiyon mula sa Citadel ay kabilang sa pinakamatandang kilalang teksto sa wikang Ammonita. Noong dekada 730 BK, nakalista si Sanipu ng Ammon sa mga haring nagbayad ng tributo kay Tiglath-pileser III ng Asiria."
    - "Sinasabi ng Deuteronomio na ang higaang bakal ni Og, hari ng Basan, ay iniingatan sa Rabba ng mga anak ni Ammon. Matapos hiyain ng haring Ammonita na si Hanun ang mga sugo ni David, kinubkob ni Joab ang Rabba, at sa utos ni David ay iniwan si Urias na Heteo upang mamatay sa labanan sa harap ng pader nito. Sinakop ni Joab “ang bayan ng mga bukal ng tubig” at tinawag si David, na sumakop sa lungsod at kumuha ng korona ng hari nito. Kalaunan, si Sobi na anak ni Naas, taga-Rabba, ay nagdala ng mga panustos kay David sa Mahanaim. Inihula nina Amos, Jeremias at Ezekiel ang hatol sa Rabba, at inilalarawan ni Ezekiel ang hari ng Babilonia sa sangandaan, namimili sa pagitan ng Rabba at Jerusalem."
    - "Noong ika-3 siglo BK, pinangalanang Filadelfia ang lungsod ayon kay Ptolemeo II Philadelphus ng Egipto. Noong 218 BK, kinubkob ito ng haring Seleucida na si Antioco III; isinasalaysay ni Polibio na bumagsak lamang ito nang ituro ng isang bilanggo sa mga sumasalakay ang daanang ilalim ng lupa kung saan bumababa ang mga tagapagtanggol para sa tubig, at hinarangan ito ng mga sumasalakay. Noong dekada 130 BK, ayon kay Josephus, isang Zeno Cotylas ang malupit na pinuno ng Filadelfia. Binibilang ito ni Plinio sa mga lungsod ng Decapolis, at sa pagsiklab ng paghihimagsik ng mga Judio noong AD 66, sinalakay ng mga pangkat na Judio ang Filadelfia at iba pang karatig na lungsod."
    - "Nang isama ang kaharian ng mga Nabateo noong AD 106, ang Filadelfia ay naging bahagi ng lalawigang Romano ng Arabia. Noong ika-2 siglo, muli itong itinayo na may malaking teatro, nymphaeum, mga kalyeng may mga haligi at isang malaking templo sa Citadel, na karaniwang tinatawag na Templo ni Hercules. Sa unang bahagi ng ika-4 na siglo, isinulat ni Eusebio na ang Rabbath, ang lungsod ng hari ng Ammon, ay ang Filadelfia na ngayon, isang bantog na lungsod ng Arabia. Nagtayo ng mga simbahan doon sa panahong Bisantino, at pagkatapos ng pananakop ng mga Arabe noong ika-7 siglo ay bumalik ang lumang pangalan bilang Amman."
  da:
    - "Rabba, ammonitternes hovedstad, lå på den høj, der nu kaldes Citadellet, i centrum af Amman, Jordans hovedstad, over åen, der danner Jabboks øvre løb. Der boede mennesker på højen længe før jernalderen, fra bronzealderen af. I jernalderen var den hovedstad i kongeriget Ammon; en indskrift fra Citadellet hører til de ældste kendte tekster på ammonitisk. I 730'erne f.Kr. er Sanipu af Ammon opregnet blandt de konger, der betalte tribut til Tiglat-Pileser 3. af Assyrien."
    - "5. Mosebog siger, at Ogs jernseng, kongen af Basan, blev opbevaret i ammonitternes Rabba. Efter at den ammonitiske konge Hanun havde krænket Davids udsendinge, belejrede Joab Rabba, og efter Davids ordre blev Urias hetitten ladt tilbage til at dø i kampen foran dens mur. Joab indtog »Vandstaden« og kaldte David, som erobrede byen og tog dens konges krone. Senere bragte Sjobi, Nahasjs søn, fra Rabba forsyninger til David i Mahanajim. Amos, Jeremias og Ezekiel forudsagde dom over Rabba, og Ezekiel malerer Babylons konge ved et vejskel, hvor han vælger mellem Rabba og Jerusalem."
    - "I 200-tallet f.Kr. blev byen omdøbt til Filadelfia efter Ptolemaios 2. Filadelfos af Egypten. I 218 f.Kr. belejrede den seleukidiske konge Antiochos 3. den; Polybios beretter, at den faldt først, da en fange viste angriberne den underjordiske gang, hvorigennem forsvarerne gik ned efter vand, og angriberne blokerede den. I 130'erne f.Kr. var ifølge Josefus en vis Zenon Kotylas tyran i Filadelfia. Plinius regner den blandt Dekapolis' byer, og ved udbruddet af det jødiske oprør i 66 e.Kr. faldt jødiske bander over Filadelfia og andre nabobyer."
    - "Da det nabatæiske kongerige blev indlemmet i 106 e.Kr., blev Filadelfia en del af den romerske provins Arabia. I 100-tallet blev den genopbygget med et stort teater, et nymfæum, søjlegader og et stort tempel på Citadellet, sædvanligvis kaldet Herkules-templet. I begyndelsen af 300-tallet skrev Eusebius, at Rabbath, Ammons konges by, nu var Filadelfia, en berømt by i Arabien. Der blev bygget kirker dér i byzantinsk tid, og efter den arabiske erobring i 600-tallet vendte det gamle navn tilbage som Amman."
