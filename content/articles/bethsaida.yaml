# Overview article (ADR 0007). Mainstream facts only; the site is disputed (et-Tell or el-Araj) and is named as such.
id: bethsaida
place: a91b732
title:
  en: "Bethsaida"
  ru: "Вифсаида"
  uk: "Віфсаїда"
  es: "Betsaida"
  pt: "Betsaida"
  de: "Betsaida"
  fr: "Bethsaïda"
  it: "Betsaida"
  pl: "Betsaida"
  nl: "Bethsaïda"
  cs: "Betsaida"
body:
  en:
    - 'Bethsaida, whose name means "house of fishing", lay at the north end of the Sea of Galilee, near where the Jordan enters the lake, east of the river. Its exact site is disputed. One candidate is et-Tell, a mound about 2 km from today''s shore, excavated since 1987 under Rami Arav. The other is el-Araj, on the shore by the river mouth, excavated in recent years by Mordechai Aviam and R. Steven Notley. A third site, el-Mesadiyeh, is seldom favoured.'
    - "At et-Tell lies a fortified city of the Iron Age with a massive gate, which the excavators take for a capital of the kingdom of Geshur; the view is widely held but remains a hypothesis, since no inscription names the city. In the Bible Talmai, king of Geshur, was the grandfather of Absalom, who fled to him and stayed there three years. The city was destroyed in the late eighth century BC, probably in the Assyrian campaign of Tiglath-pileser III about 732 BC. Josephus says that Philip the tetrarch raised the village of Bethsaida to the rank of a city and named it Julias, after the emperor's daughter; many scholars think rather of Livia, wife of Augustus, who bore the name Julia. Philip died at Julias about AD 34 and was buried in the tomb he had built for himself."
    - "In the Gospels Bethsaida is the town of the apostles Philip, Andrew and Peter. Near it Jesus withdrew with the apostles to a desert place, where the crowds followed and were fed; once he sent the disciples ahead across the lake to Bethsaida. There he led a blind man out of the town and healed him in two stages. With Chorazin, Bethsaida was reproached for not repenting after the mighty works done in it."
    - "In the revolt against Rome Josephus fought the troops of King Agrippa II beside the Jordan near Julias. Pliny the Elder places Julias on the eastern shore of the lake, and in the early fourth century Eusebius knew Bethsaida as the city of Andrew, Peter and Philip by the Lake of Gennesaret. At el-Araj the excavators have found remains of the Roman period, which they take for Julias, and a Byzantine basilica with a Greek mosaic inscription that invokes Saint Peter; they see in it the church that Byzantine tradition built over the apostles' home."
  ru:
    - "Вифсаида, чьё имя значит «дом рыбной ловли», лежала у северного края моря Галилейского, близ впадения Иордана в озеро, к востоку от реки. Её точное место спорно. Один кандидат — холм Эт-Телль примерно в 2 км от нынешнего берега, где с 1987 г. вела раскопки экспедиция Рами Арава. Другой — Эль-Арадж на самом берегу у устья реки, который в последние годы раскапывают Мордехай Авиам и Р. Стивен Нотли. Третье место, Эль-Месадие, поддерживают редко."
    - "В Эт-Телле лежит укреплённый город железного века с мощными воротами, который раскопщики считают столицей царства Гессур; это мнение широко распространено, но остаётся гипотезой, так как ни одна надпись не называет город. По Библии Фалмай, царь Гессурский, был дедом Авессалома, который бежал к нему и пробыл там три года. Город был разрушен в конце VIII века до н. э., вероятно в походе ассирийского царя Феглаффелласара III около 732 г. до н. э. Иосиф Флавий пишет, что четвертовластник Филипп возвёл селение Вифсаиду в достоинство города и назвал его Юлиадой в честь дочери императора; многие учёные думают скорее о Ливии, жене Августа, носившей имя Юлия. Филипп умер в Юлиаде около 34 г. н. э. и был погребён в гробнице, которую сам себе построил."
    - "В Евангелиях Вифсаида — город апостолов Филиппа, Андрея и Петра. Близ неё Иисус удалился с апостолами в пустое место, куда за Ним пошёл народ и был накормлен; однажды Он отправил учеников вперёд по озеру к Вифсаиде. Там Он вывел слепого вон из селения и исцелил его в два приёма. Вместе с Хоразином Вифсаида услышала укор за то, что не покаялась после явленных в ней сил."
    - "Во время восстания против Рима Иосиф Флавий сражался с войсками царя Агриппы II у Иордана близ Юлиады. Плиний Старший помещает Юлиаду на восточном берегу озера, а Евсевий в начале IV века знал Вифсаиду как город Андрея, Петра и Филиппа у озера Геннисаретского. В Эль-Арадже раскопщики нашли остатки римского времени, которые считают Юлиадой, и византийскую базилику с греческой мозаичной надписью, призывающей святого Петра; они видят в ней церковь, которую византийское предание поставило над домом апостолов."
  uk:
    - "Віфсаїда, чия назва означає «дім ловіння риби», лежала на північному краї Галілейського моря, неподалік від місця, де Йордан упадає в озеро, на схід від річки. Її точне розташування є спірним. Один кандидат — ет-Телль, горб приблизно за 2 км від сучасного берега, який розкопують від 1987 р. під керівництвом Рамі Арава. Другий — ель-Арадж, на березі біля гирла річки, який останніми роками розкопували Мордехай Авіам і Р. Стівен Нотлі. Третє місце, ель-Месадія, рідко знаходить прихильників."
    - "В ет-Телі лежить укріплене місто залізної доби з масивною брамою, яке розкопувачі вважають столицею царства Гешур; цей погляд широко поширений, але лишається гіпотезою, бо жоден напис не називає цього міста. У Біблії Фалмай, цар Гешуру, був дідом Авесалома, який утік до нього й перебув там три роки. Місто було зруйноване наприкінці VIII ст. до н. е., ймовірно, під час ассирійського походу Тіглатпаласара III близько 732 р. до н. е. Йосиф Флавій каже, що тетрарх Пилип піднес село Віфсаїду до рангу міста й назвав його Юліадою на честь дочки імператора; багато вчених радше думають про Лівію, дружину Августа, яка носила ім'я Юлія. Пилип помер в Юліаді близько 34 р. н. е. і був похований у гробниці, яку збудував для себе."
    - "В Євангеліях Віфсаїда — місто апостолів Пилипа, Андрія та Петра. Поблизу неї Ісус усамітнився з апостолами в місці пустому, куди пішов за ним народ і був нагодований; одного разу Він послав учнів уперед через озеро до Віфсаїди. Там Він вивів сліпого за місто й зцілив його у два етапи. Разом із Хоразином Віфсаїду докоряли за те, що вона не покаялася після великих чудес, учинених у ній."
    - "Під час повстання проти Риму Йосиф Флавій бився з військом царя Агриппи II біля Йордану поблизу Юліади. Пліній Старший розташовує Юліаду на східному березі озера, а на початку IV ст. Євсевій знав Віфсаїду як місто Андрія, Петра та Пилипа біля озера Генісарет. В ель-Араджі розкопувачі знайшли рештки римської доби, які вважають Юліадою, і візантійську базиліку з грецьким мозаїчним написом, що закликає святого Петра; у ній вони бачать церкву, яку візантійська традиція збудувала над домом апостолів."
  es:
    - "Betsaida, cuyo nombre significa «casa de pesca», se hallaba en el extremo norte del mar de Galilea, cerca de donde el Jordán entra en el lago, al este del río. Su emplazamiento exacto es objeto de debate. Un candidato es et-Tell, un montículo a unos 2 km de la orilla actual, excavado desde 1987 bajo la dirección de Rami Arav. El otro es el-Araj, en la orilla junto a la desembocadura del río, excavado en los últimos años por Mordechai Aviam y R. Steven Notley. Un tercer sitio, el-Mesadiyeh, rara vez cuenta con favor."
    - "En et-Tell se encuentra una ciudad fortificada de la Edad del Hierro con una puerta monumental, que los excavadores consideran la capital del reino de Gesur; la opinión está muy extendida, pero sigue siendo una hipótesis, pues ninguna inscripción nombra la ciudad. En la Biblia, Talmai, rey de Gesur, era el abuelo de Absalón, que huyó a su lado y permaneció allí tres años. La ciudad fue destruida a finales del siglo VIII a. C., probablemente en la campaña asiria de Tiglat-pileser III hacia el 732 a. C. Josefo dice que Filipo el tetrarca elevó la aldea de Betsaida al rango de ciudad y la llamó Julias, por la hija del emperador; muchos estudiosos piensan más bien en Livia, esposa de Augusto, que llevó el nombre de Julia. Filipo murió en Julias hacia el 34 d. C. y fue sepultado en la tumba que se había hecho construir."
    - "En los Evangelios, Betsaida es la ciudad de los apóstoles Felipe, Andrés y Pedro. Cerca de ella se retiró Jesús con los apóstoles a un lugar desierto, adonde las multitudes lo siguieron y fueron alimentadas; una vez envió a los discípulos por delante, a través del lago, a Betsaida. Allí sacó de la aldea a un ciego y lo sanó en dos etapas. Junto con Corazín, Betsaida fue reprendida por no haberse arrepentido tras los milagros hechos en ella."
    - "En la rebelión contra Roma, Josefo combatió a las tropas del rey Agripa II junto al Jordán, cerca de Julias. Plinio el Viejo sitúa Julias en la orilla oriental del lago, y a comienzos del siglo IV Eusebio conocía Betsaida como la ciudad de Andrés, Pedro y Felipe, junto al lago de Genesaret. En el-Araj los excavadores han hallado restos de época romana, que identifican con Julias, y una basílica bizantina con una inscripción griega en mosaico que invoca a san Pedro; ven en ella la iglesia que la tradición bizantina construyó sobre la casa de los apóstoles."
  pt:
    - "Betsaida, cujo nome significa “casa de pesca”, ficava na extremidade norte do Mar da Galileia, perto de onde o Jordão entra no lago, a leste do rio. Sua localização exata é disputada. Um candidato é et-Tell, um monte a cerca de 2 km da margem atual, escavado desde 1987 sob Rami Arav. O outro é el-Araj, na margem, junto à foz do rio, escavado nos últimos anos por Mordechai Aviam e R. Steven Notley. Um terceiro local, el-Mesadiyeh, raramente é preferido."
    - "Em et-Tell encontra-se uma cidade fortificada da Idade do Ferro com um portão maciço, que os escavadores tomam por capital do reino de Gesur; a opinião é amplamente aceita, mas continua sendo uma hipótese, pois nenhuma inscrição nomeia a cidade. Na Bíblia, Talmai, rei de Gesur, era avô de Absalão, que fugiu para ele e ficou ali três anos. A cidade foi destruída no fim do século VIII a.C., provavelmente na campanha assíria de Tiglate-Pileser III, por volta de 732 a.C. Josefo diz que Filipe, o tetrarca, elevou a aldeia de Betsaida à categoria de cidade e a chamou de Júlias, em honra da filha do imperador; muitos estudiosos pensam antes em Lívia, esposa de Augusto, que recebeu o nome de Júlia. Filipe morreu em Júlias por volta de 34 d.C. e foi sepultado no túmulo que havia construído para si."
    - "Nos Evangelhos, Betsaida é a cidade dos apóstolos Filipe, André e Pedro. Perto dela, Jesus retirou-se com os apóstolos para um lugar deserto, aonde as multidões o seguiram e foram alimentadas; certa vez, enviou os discípulos adiante, através do lago, para Betsaida. Ali conduziu um cego para fora da aldeia e o curou em duas etapas. Com Corazim, Betsaida foi repreendida por não se arrepender depois das obras poderosas realizadas nela."
    - "Na revolta contra Roma, Josefo combateu as tropas do rei Agripa II junto ao Jordão, perto de Júlias. Plínio, o Velho, situa Júlias na margem oriental do lago, e no início do século IV Eusébio conhecia Betsaida como a cidade de André, Pedro e Filipe, junto ao lago de Genesaré. Em el-Araj, os escavadores encontraram vestígios do período romano, que tomam por Júlias, e uma basílica bizantina com uma inscrição grega em mosaico que invoca São Pedro; veem nela a igreja que a tradição bizantina construiu sobre a casa dos apóstolos."
  de:
    - "Betsaida, dessen Name „Haus des Fischfangs“ bedeutet, lag am Nordende des Sees Genezareth, nahe der Stelle, an der der Jordan in den See mündet, östlich des Flusses. Seine genaue Lage ist umstritten. Ein Kandidat ist et-Tell, ein Hügel etwa 2 km vom heutigen Ufer entfernt, der seit 1987 unter Rami Arav ausgegraben wird. Der andere ist el-Araj am Ufer bei der Flussmündung, in den letzten Jahren von Mordechai Aviam und R. Steven Notley ausgegraben. Ein dritter Ort, el-Mesadiyeh, wird selten bevorzugt."
    - "In et-Tell liegt eine befestigte Stadt der Eisenzeit mit einem massiven Tor, die die Ausgräber für eine Hauptstadt des Königreichs Geschur halten; die Ansicht ist weit verbreitet, bleibt aber eine Hypothese, da keine Inschrift die Stadt nennt. In der Bibel war Talmai, König von Geschur, der Großvater Absaloms, der zu ihm floh und drei Jahre dort blieb. Die Stadt wurde im späten 8. Jahrhundert v. Chr. zerstört, wahrscheinlich im assyrischen Feldzug Tiglat-Pilesers III. um 732 v. Chr. Josephus sagt, der Tetrarch Philippus habe das Dorf Betsaida in den Rang einer Stadt erhoben und sie nach der Tochter des Kaisers Julias genannt; viele Gelehrte denken eher an Livia, die Frau des Augustus, die den Namen Julia trug. Philippus starb um 34 n. Chr. in Julias und wurde in dem Grab beigesetzt, das er sich selbst hatte bauen lassen."
    - "In den Evangelien ist Betsaida die Stadt der Apostel Philippus, Andreas und Petrus. In ihrer Nähe zog sich Jesus mit den Aposteln an einen einsamen Ort zurück, wohin ihm die Volksmenge folgte und gespeist wurde; einmal schickte er die Jünger voraus über den See nach Betsaida. Dort führte er einen Blinden aus der Stadt hinaus und heilte ihn in zwei Schritten. Zusammen mit Chorazin wurde Betsaida getadelt, weil es nach den dort geschehenen Machttaten nicht Buße getan hatte."
    - "Im Aufstand gegen Rom kämpfte Josephus am Jordan bei Julias gegen die Truppen König Agrippas II. Plinius der Ältere verlegt Julias an das Ostufer des Sees, und Anfang des 4. Jahrhunderts kannte Eusebius Betsaida als die Stadt des Andreas, Petrus und Philippus am See Genezareth. In el-Araj haben die Ausgräber Reste aus römischer Zeit gefunden, die sie für Julias halten, sowie eine byzantinische Basilika mit einer griechischen Mosaikinschrift, die den heiligen Petrus anruft; sie sehen darin die Kirche, die die byzantinische Überlieferung über dem Haus der Apostel errichtete."
  fr:
    - "Bethsaïda, dont le nom signifie « maison de la pêche », se trouvait à l’extrémité nord de la Mer de Galilée, près de l’endroit où le Jourdain entre dans le lac, à l’est du fleuve. Son emplacement exact est discuté. Un candidat est et-Tell, un tertre à environ 2 km du rivage actuel, fouillé depuis 1987 sous la direction de Rami Arav. L’autre est el-Araj, sur la rive près de l’embouchure du fleuve, fouillé ces dernières années par Mordechai Aviam et R. Steven Notley. Un troisième site, el-Mesadiyeh, est rarement retenu."
    - "À et-Tell se trouve une ville fortifiée de l’âge du Fer dotée d’une porte massive, que les fouilleurs tiennent pour une capitale du royaume de Gueschur ; cette opinion est largement répandue mais reste une hypothèse, aucune inscription ne nommant la ville. Dans la Bible, Talmaï, roi de Gueschur, était le grand-père d’Absalom, qui se réfugia chez lui et y resta trois ans. La ville fut détruite à la fin du VIIIe siècle av. J.-C., probablement lors de la campagne assyrienne de Tiglath-Piléser III vers 732 av. J.-C. Josèphe dit que Philippe le tétrarque éleva le village de Bethsaïda au rang de ville et la nomma Julias, d’après la fille de l’empereur ; beaucoup de spécialistes songent plutôt à Livie, épouse d’Auguste, qui porta le nom de Julie. Philippe mourut à Julias vers 34 apr. J.-C. et fut enterré dans le tombeau qu’il s’était fait construire."
    - "Dans les Évangiles, Bethsaïda est la ville des apôtres Philippe, André et Pierre. Près d’elle, Jésus se retira avec les apôtres dans un lieu désert, où les foules le suivirent et furent nourries ; une fois, il envoya les disciples en avant de l’autre côté du lac, vers Bethsaïda. Là, il conduisit un aveugle hors de la ville et le guérit en deux temps. Avec Chorazin, Bethsaïda fut blâmée de ne pas s’être repentie après les miracles accomplis en son sein."
    - "Lors de la révolte contre Rome, Josèphe combattit les troupes du roi Agrippa II près du Jourdain, non loin de Julias. Pline l’Ancien place Julias sur la rive orientale du lac, et au début du IVe siècle Eusèbe connaissait Bethsaïda comme la ville d’André, de Pierre et de Philippe, près du lac de Génésareth. À el-Araj, les fouilleurs ont trouvé des vestiges de l’époque romaine, qu’ils tiennent pour Julias, et une basilique byzantine dont une inscription grecque en mosaïque invoque saint Pierre ; ils y voient l’église que la tradition byzantine éleva au-dessus de la maison des apôtres."
  it:
    - "Betsaida, il cui nome significa «casa della pesca», si trovava all’estremità settentrionale del Lago di Tiberiade, vicino al punto in cui il Giordano vi entra, a est del fiume. Il suo sito esatto è controverso. Un candidato è et-Tell, un tell a circa 2 km dalla riva odierna, scavato dal 1987 sotto la direzione di Rami Arav. L’altro è el-Araj, sulla riva presso la foce del fiume, scavato negli ultimi anni da Mordechai Aviam e R. Steven Notley. Un terzo sito, el-Mesadiyeh, è raramente preferito."
    - "A et-Tell si trova una città fortificata dell’età del Ferro con una massiccia porta, che gli scavatori ritengono la capitale del regno di Ghesur; l’opinione è molto diffusa ma resta un’ipotesi, poiché nessuna iscrizione nomina la città. Nella Bibbia Talmai, re di Ghesur, era il nonno di Assalonne, che si rifugiò presso di lui e vi rimase tre anni. La città fu distrutta alla fine dell’VIII secolo a.C., probabilmente nella campagna assira di Tiglat-Pilèser III intorno al 732 a.C. Giuseppe Flavio dice che il tetrarca Filippo elevò il villaggio di Betsaida al rango di città e la chiamò Giulia, dal nome della figlia dell’imperatore; molti studiosi pensano piuttosto a Livia, moglie di Augusto, che portò il nome di Giulia. Filippo morì a Giulia intorno al 34 d.C. e fu sepolto nella tomba che si era fatto costruire."
    - "Nei Vangeli Betsaida è la città degli apostoli Filippo, Andrea e Pietro. Vicino a essa Gesù si ritirò con gli apostoli in un luogo deserto, dove le folle li seguirono e furono sfamate; una volta mandò i discepoli avanti, attraverso il lago, verso Betsaida. Là condusse fuori dal villaggio un cieco e lo guarì in due tempi. Insieme a Corazin, Betsaida fu rimproverata per non essersi ravveduta dopo le opere potenti compiute in essa."
    - "Nella rivolta contro Roma Giuseppe Flavio combatté le truppe del re Agrippa II lungo il Giordano, presso Giulia. Plinio il Vecchio colloca Giulia sulla riva orientale del lago, e all’inizio del IV secolo Eusebio conosceva Betsaida come la città di Andrea, Pietro e Filippo presso il lago di Gennesaret. A el-Araj gli scavatori hanno trovato resti di epoca romana, che ritengono appartenere a Giulia, e una basilica bizantina con un’iscrizione greca a mosaico che invoca san Pietro; vi vedono la chiesa che la tradizione bizantina costruì sulla casa degli apostoli."
  pl:
    - "Betsaida, której nazwa znaczy „dom rybołówstwa”, leżała na północnym krańcu Jeziora Galilejskiego, blisko miejsca, gdzie Jordan wpada do jeziora, na wschód od rzeki. Jej dokładne położenie jest sporne. Jednym kandydatem jest et-Tell, kopiec około 2 km od dzisiejszego brzegu, badany od 1987 r. pod kierunkiem Ramiego Arava. Drugim jest el-Araj, nad brzegiem przy ujściu rzeki, badane w ostatnich latach przez Mordechaja Aviama i R. Stevena Notleya. Trzecie miejsce, el-Mesadijje, rzadko bywa popierane."
    - "W et-Tell leży ufortyfikowane miasto z epoki żelaza z potężną bramą, które badacze uważają za stolicę królestwa Geszur; pogląd ten jest szeroko podzielany, lecz pozostaje hipotezą, bo żaden napis nie wymienia nazwy miasta. W Biblii Talmaj, król Geszuru, był dziadkiem Absaloma, który uciekł do niego i przebywał tam trzy lata. Miasto zniszczono pod koniec VIII w. p.n.e., prawdopodobnie podczas asyryjskiej wyprawy Tiglat-Pilesera III około 732 r. p.n.e. Józef Flawiusz mówi, że tetrarcha Filip podniósł wieś Betsaidę do rangi miasta i nazwał ją Julias na cześć córki cesarza; wielu uczonych myśli raczej o Liwii, żonie Augusta, która nosiła imię Julia. Filip zmarł w Julias około 34 r. n.e. i został pochowany w grobowcu, który sam sobie zbudował."
    - "W Ewangeliach Betsaida jest miastem apostołów Filipa, Andrzeja i Piotra. W jej pobliżu Jezus wycofał się z apostołami na miejsce pustynne, gdzie poszły za nim tłumy i zostały nakarmione; raz wysłał uczniów przodem przez jezioro do Betsaidy. Tam wyprowadził ślepego z miasta i uzdrowił go w dwóch etapach. Betsaidzie wraz z Korozain wyrzucano, że się nie nawróciła po cudach, które w niej uczyniono."
    - "W powstaniu przeciw Rzymowi Józef Flawiusz walczył z wojskami króla Agryppy II nad Jordanem koło Julias. Pliniusz Starszy umieszcza Julias na wschodnim brzegu jeziora, a na początku IV w. Euzebiusz znał Betsaidę jako miasto Andrzeja, Piotra i Filipa nad jeziorem Genezaret. W el-Araj badacze odkryli pozostałości z okresu rzymskiego, które uważają za Julias, oraz bizantyjską bazylikę z grecką inskrypcją mozaikową wzywającą świętego Piotra; widzą w niej kościół, który tradycja bizantyjska wzniosła nad domem apostołów."
  nl:
    - "Bethsaïda, wiens naam “huis van de visvangst” betekent, lag aan de noordkant van het Meer van Galilea, bij de plaats waar de Jordaan het meer instroomt, ten oosten van de rivier. De exacte ligging is omstreden. Een kandidaat is et-Tell, een heuvel op ongeveer 2 km van de huidige oever, sinds 1987 opgegraven onder leiding van Rami Arav. De andere is el-Araj, aan de oever bij de riviermonding, in de afgelopen jaren opgegraven door Mordechai Aviam en R. Steven Notley. Een derde plaats, el-Mesadiyeh, geniet zelden de voorkeur."
    - "Bij et-Tell ligt een versterkte stad uit de IJzertijd met een massieve poort, die de opgravers voor een hoofdstad van het koninkrijk Gesur houden; die opvatting wordt breed gedeeld, maar blijft een hypothese, aangezien geen enkel opschrift de stad noemt. In de Bijbel was Talmai, koning van Gesur, de grootvader van Absalom, die naar hem vluchtte en er drie jaar bleef. De stad werd verwoest in de late achtste eeuw v.Chr., waarschijnlijk tijdens de Assyrische veldtocht van Tiglat-Pileser III omstreeks 732 v.Chr. Flavius Josephus zegt dat tetrarch Filippus het dorp Bethsaïda tot stad verhief en het Julias noemde, naar de dochter van de keizer; veel geleerden denken eerder aan Livia, de vrouw van Augustus, die de naam Julia droeg. Filippus stierf omstreeks 34 n.Chr. in Julias en werd begraven in het graf dat hij voor zichzelf had laten bouwen."
    - "In de evangeliën is Bethsaïda de stad van de apostelen Filippus, Andreas en Petrus. In de buurt daarvan trok Jezus zich met de apostelen terug op een eenzame plaats, waar de menigte hem volgde en te eten kreeg; eenmaal stuurde hij de leerlingen vooruit over het meer naar Bethsaïda. Daar leidde hij een blinde de stad uit en genas hem in twee fasen. Samen met Chorazin kreeg Bethsaïda een verwijt omdat het zich niet bekeerde na de krachtige daden die daar waren verricht."
    - "Tijdens de opstand tegen Rome streed Flavius Josephus bij de Jordaan, nabij Julias, tegen de troepen van koning Agrippa II. Plinius de Oudere plaatst Julias aan de oostoever van het meer, en in het begin van de 4e eeuw kende Eusebius Bethsaïda als de stad van Andreas, Petrus en Filippus aan het meer van Gennesaret. Bij el-Araj hebben de opgravers resten uit de Romeinse tijd gevonden, die zij voor Julias houden, en een Byzantijnse basiliek met een Grieks mozaïekopschrift dat de heilige Petrus aanroept; zij zien daarin de kerk die de Byzantijnse overlevering bouwde boven het huis van de apostelen."
  cs:
    - "Betsaida, jejíž jméno znamená „dům rybolovu“, ležela na severním konci Galilejského jezera, poblíž místa, kde do jezera vtéká Jordán, na východ od řeky. Její přesná poloha je sporná. Jedním kandidátem je et-Tell, pahorek asi 2 km od dnešního břehu, zkoumaný od roku 1987 pod vedením Ramiho Arava. Druhým je el-Araj na břehu u ústí řeky, v posledních letech zkoumaný Mordechajem Aviamem a R. Stevenem Notleym. Třetímu místu, el-Mesadiyeh, se dává přednost jen zřídka."
    - "V et-Tellu leží opevněné město z doby železné s mohutnou branou, které vykopávači pokládají za hlavní město království Gešur; tento názor je široce sdílen, ale zůstává hypotézou, neboť žádný nápis město nejmenuje. V Bibli byl Talmaj, král Gešuru, dědem Abšaloma, který k němu uprchl a zůstal tam tři roky. Město bylo zničeno koncem 8. století př. n. l., pravděpodobně při tažení Tiglatpilesara III. kolem roku 732 př. n. l. Josephus uvádí, že tetrarcha Filip povýšil vesnici Betsaidu na město a pojmenoval je Julias po císařově dceři; mnozí badatelé spíše myslí na Livii, manželku Augustovu, která nesla jméno Julia. Filip zemřel v Julias kolem roku 34 n. l. a byl pohřben v hrobce, kterou si dal postavit."
    - "V evangeliích je Betsaida městem apoštolů Filipa, Ondřeje a Petra. Poblíž ní se Ježíš s apoštoly uchýlil na pusté místo, kam za ním šly zástupy a byly nasyceny; jednou poslal učedníky napřed přes jezero do Betsaidy. Tam vyvedl slepého z městečka a uzdravil ho ve dvou fázích. Spolu s Chorazinem byla Betsaida pokárána, že nečinila pokání po mocných skutcích, které se v ní staly."
    - "Za povstání proti Římu bojoval Josephus s vojsky krále Agrippy II. u Jordánu poblíž Julias. Plinius Starší klade Julias na východní břeh jezera a na počátku 4. století Eusebios znal Betsaidu jako město Ondřeje, Petra a Filipa u Genezaretského jezera. V el-Araji vykopávači nalezli pozůstatky z římské doby, které pokládají za Julias, a byzantskou baziliku s řeckým mozaikovým nápisem, který vzývá svatého Petra; vidí v ní kostel, který byzantská tradice postavila nad domovem apoštolů."
