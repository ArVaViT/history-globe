body:
  en:
    - "Sibmah, also written Shebam and Shibmah, was a town on the Moabite plateau near Heshbon, famous for its vines. The tribes of Reuben and Gad asked Moses for the land of “Heshbon, and Elealeh, and Shebam, and Nebo”, and Reuben rebuilt Sibmah with Nebo and Baal-meon; Joshua places it in Reuben's lot with Kiriathaim and Zereth-shahar. Eusebius knew it as a town of Moab in Gilead, and Jerome, commenting on Isaiah, put it barely five hundred paces from Heshbon. Its site is not fixed: the map's candidates are Qarn al-Qubish, a hill west of Hisban, Khirbet Ayun Musa below Mount Nebo, a spot near Baal-meon, and Sumia; none has been excavated."
    - "The town lives in two laments over Moab. Isaiah: “the fields of Heshbon languish, and the vine of Sibmah: the lords of the heathen have broken down the principal plants thereof … Therefore I will bewail with the weeping of Jazer the vine of Sibmah”; and Jeremiah, in the same words: “O vine of Sibmah, I will weep for thee with the weeping of Jazer: thy plants are gone over the sea”. The Synodal Bible calls it the vineyard of Sevam there. Moab had taken the plateau back from Israel by the ninth century BC, as the Mesha Stele shows, though the stele does not name Sibmah."
    - "Today the plateau between Hisban and Mount Nebo, in Jordan's Madaba governorate, is dry-farmed in wheat and barley; the vineyards that the prophets wept for are gone, and nothing on the ground marks Sibmah."
  ru:
    - "Сивма, также Севам, была городом на Моавитском плато близ Есевона, славным своими лозами. Колена Рувима и Гада просили у Моисея землю, где «Есевон, и Елеале, и Севам, и Нево», и Рувим отстроил Сивму вместе с Нево и Ваал-Меоном; Иисус Навин ставит её в удел Рувима рядом с Кириафаимом и Цереф-Шахаром. Евсевий знал её как город Моава в Галааде, а Иероним, толкуя Исаию, помещал её едва в пятистах шагах от Есевона. Место её не установлено: кандидаты на карте — Карн-аль-Кубиш, холм к западу от Хисбана, Хирбет-Аюн-Муса под горой Нево, место близ Ваал-Меона и Сумия; ни одно не раскопано."
    - "Город живёт в двух плачах о Моаве. Исаия: «Поля Есевонские оскудели, также и виноградник Севамский; властители народов истребили лучшие лозы его… Посему и я буду плакать о лозе Севамской плачем Иазера»; и Иеремия теми же словами: «Буду плакать о тебе, виноградник Севамский, плачем Иазера; отрасли твои простирались за море». Моав вернул себе плато у Израиля к IX веку до н. э., как показывает стела Меши, хотя Сивму стела не называет."
    - "Сегодня плато между Хисбаном и горой Нево, в иорданской провинции Мадаба, засевают пшеницей и ячменём без орошения; виноградников, о которых плакали пророки, больше нет, и ничто на земле не отмечает Сивму."
  uk:
    - "Сівма, яку пишуть також Севам і Шибма, була містом на моавському плато поблизу Гесбону, відомим своїми виноградними лозами. Коліна Рувима і Гада просили в Мойсея землю, де «Гесбон та Єлале та Себам та Небо», і Рувим відбудував Сівму разом з Нево та Ваал-Меоном; Ісус Навин відносить її до уділу Рувима поряд з Кіріатаїмом і Церет-Шахаром. Євсевій знав її як місто Моаву в Гілеаді, а Ієронім, коментуючи Ісаю, містив її заледве за п’ятсот кроків від Гесбону. Її місце не встановлено: кандидати на мапі — Карн-ель-Кубіш, пагорб на захід від Хісбану, Хірбет-Айюн-Муса під горою Нево, місце поблизу Ваал-Меону та Сумія; жодне з них не розкопане."
    - "Місто живе у двох плачах над Моавом. Ісая: «Ниви Есевонські спустїли, та й виноградник Севамський; властники народів вигубили ті прегарні лозини … Тим і я заплачу по садах Севамських, як плакав над Язером»; і Єремія тими самими словами: «Плакати му по тобі, Севамо виноградня, тим плачем, що й по Язері: паростки твої сягали аж поза море». Синодальний переклад називає її там виноградником Севам. Моав повернув собі плато від Ізраїлю вже в IX ст. до н. е., як свідчить стела Меші, хоч Сівму стела не згадує."
    - "Сьогодні плато між Хісбаном і горою Нево, в йорданській провінції Мадаба, обробляють без зрошення, сіючи пшеницю й ячмінь; виноградників, над якими плакали пророки, більше немає, і ніщо на землі не позначає Сівму."
  es:
    - "Sibma, que aparece también como Sabán y Sebam, era una ciudad de la meseta moabita, cerca de Hesbón, famosa por sus viñas. Las tribus de Rubén y de Gad pidieron a Moisés la tierra de «Hesbón, y Eleale, y Sabán, y Nebo», y Rubén reconstruyó Sibma junto con Nebo y Baal-meón; Josué la sitúa en el lote de Rubén con Quiriataim y Zeret-sahar. Eusebio la conocía como una ciudad de Moab en Galaad, y Jerónimo, al comentar a Isaías, la ponía a apenas quinientos pasos de Hesbón. Su emplazamiento no está fijado: los candidatos del mapa son Qarn al-Qubish, una colina al oeste de Hisbán, Khirbet Ayun Musa, al pie del monte Nebo, un paraje cercano a Baal-meón y Sumia; ninguno ha sido excavado."
    - "La ciudad vive en dos lamentaciones sobre Moab. Isaías: «los campos de Hesbón fueron talados, y las vides de Sibma; señores de gentes hollaron sus generosos sarmientos … Por lo cual lamentaré con lloro de Jazer la viña de Sibma»; y Jeremías, con las mismas palabras: «Con lloro de Jazer lloraré por ti, oh vid de Sibma: tus sarmientos pasaron la mar». La Biblia sinodal la llama allí viña de Sevam. Moab había recuperado la meseta de manos de Israel hacia el siglo IX a. C., como muestra la Estela de Mesa, aunque la estela no nombra Sibma."
    - "Hoy la meseta entre Hisbán y el monte Nebo, en la gobernación jordana de Madaba, se cultiva de secano con trigo y cebada; los viñedos por los que lloraron los profetas han desaparecido, y nada sobre el terreno señala Sibma."
  pt:
    - "Sibma, também escrita Sebã e Sibama, era uma cidade do planalto moabita, perto de Hesbom, famosa por suas videiras. As tribos de Rúben e Gade pediram a Moisés a terra de “Hesbom, Eleale, Sebã, Nebo”, e Rúben reconstruiu Sibma com Nebo e Baal-Meom; Josué a situa no lote de Rúben, com Quiriataim e Zerete-Saar. Eusébio a conhecia como uma cidade de Moabe, em Gileade, e Jerônimo, comentando Isaías, colocou-a a apenas quinhentos passos de Hesbom. Sua localização não está definida: os candidatos do mapa são Qarn al-Qubish, uma colina a oeste de Hisban, Khirbet Ayun Musa, abaixo do monte Nebo, um lugar perto de Baal-Meom e Sumia; nenhum foi escavado."
    - "A cidade vive em dois lamentos sobre Moabe. Isaías: “os campos de Hesbom definham com a videira de Sibma. Os senhores das nações despedaçaram os seus melhores ramos … Portanto, chorarei com o choro de Jazer pela videira de Sibma”; e Jeremias, com as mesmas palavras: “Com mais do que o choro de Jazer eu chorarei por você, videira de Sibma. Os seus ramos passaram além do mar”. A Bíblia Sinodal a chama ali de vinha de Sevam. Moabe havia retomado o planalto de Israel já no século IX a.C., como mostra a Estela de Mesa, embora a estela não mencione Sibma."
    - "Hoje, o planalto entre Hisban e o monte Nebo, na província jordaniana de Madaba, é cultivado em sequeiro com trigo e cevada; as vinhas pelas quais os profetas choraram desapareceram, e nada no terreno marca Sibma."
  de:
    - "Sibma, auch Sebam und Schibma geschrieben, war eine Stadt auf der moabitischen Hochebene bei Heschbon, berühmt für ihre Reben. Die Stämme Ruben und Gad baten Mose um das Land „Hesbon, Eleale, Sebam, Nebo“, und Ruben baute Sibma zusammen mit Nebo und Baal-Meon wieder auf; Josua nennt es im Erbteil Rubens neben Kirjatajim und Zeret-Schahar. Eusebius kannte es als Stadt Moabs in Gilead, und Hieronymus, der Jesaja kommentierte, setzte es kaum fünfhundert Schritte von Heschbon an. Seine Lage ist nicht gesichert: Die Kandidaten der Karte sind Qarn al-Qubish, ein Hügel westlich von Hisban, Khirbet Ayun Musa unterhalb des Berges Nebo, ein Ort nahe Baal-Meon und Sumia; keiner ist ausgegraben."
    - "Die Stadt lebt in zwei Klageliedern über Moab fort. Jesaja: „Hesbon ist ein wüstes Feld geworden; der Weinstock zu Sibma ist verderbt; die Herren unter den Heiden haben seine edlen Reben zerschlagen … Darum weine ich um Jaser und um den Weinstock zu Sibma“; und Jeremia mit denselben Worten: „Mehr als über Jaser muß ich über dich, du Weinstock zu Sibma, weinen, dessen Reben über das Meer reichten“. Die Synodalbibel nennt es dort den Weinberg von Sewam. Moab hatte die Hochebene spätestens im neunten Jahrhundert v. Chr. von Israel zurückgewonnen, wie die Mesa-Stele zeigt, auch wenn die Stele Sibma nicht nennt."
    - "Heute wird die Hochebene zwischen Hisban und dem Berg Nebo im jordanischen Gouvernement Madaba ohne Bewässerung mit Weizen und Gerste bestellt; die Weinberge, um die die Propheten klagten, sind verschwunden, und nichts im Gelände kennzeichnet Sibma."
  fr:
    - "Sibma, aussi écrite Sebam et Schibma, était une ville du plateau moabite près de Hesbon, célèbre pour ses vignes. Les tribus de Ruben et de Gad demandèrent à Moïse le pays de « Hesbon, Élealé, Sebam, Nebo et Beon », et Ruben rebâtit Sibma avec Nebo et Baal-Meon ; Josué la place dans le lot de Ruben avec Kirjathaïm et Tséreth-Haschachar. Eusèbe la connaissait comme une ville de Moab en Galaad, et Jérôme, commentant Ésaïe, la mettait à cinq cents pas à peine de Hesbon. Son site n’est pas fixé : la carte retient Qarn al-Qubish, une colline à l’ouest de Hisban, Khirbet Ayun Musa au pied du mont Nebo, un lieu proche de Baal-Meon, et Sumia ; aucun n’a été fouillé."
    - "La ville vit dans deux lamentations sur Moab. Ésaïe : « les campagnes de Hesbon languissent ; les maîtres des nations ont brisé les ceps de la vigne de Sibma … Aussi je pleure sur la vigne de Sibma, comme sur Jaezer » ; et Jérémie, dans les mêmes termes : « Vigne de Sibma, je pleure sur toi plus que sur Jaezer ; tes rameaux allaient au-delà de la mer ». La Bible synodale y parle de la vigne de Sevam. Moab avait repris le plateau à Israël dès le IXe siècle av. J.-C., comme le montre la stèle de Mescha, bien qu’elle ne nomme pas Sibma."
    - "Aujourd’hui, le plateau entre Hisban et le mont Nebo, dans le gouvernorat jordanien de Madaba, est cultivé sans irrigation en blé et en orge ; les vignobles que pleuraient les prophètes ont disparu, et rien sur le terrain ne marque Sibma."
