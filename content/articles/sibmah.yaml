body:
  en:
    - "Sibmah, also written Shebam and Shibmah, was a town on the Moabite plateau near Heshbon, famous for its vines. The tribes of Reuben and Gad asked Moses for the land of “Heshbon, and Elealeh, and Shebam, and Nebo”, and Reuben rebuilt Sibmah with Nebo and Baal-meon; Joshua places it in Reuben's lot with Kiriathaim and Zereth-shahar. Eusebius knew it as a town of Moab in Gilead, and Jerome, commenting on Isaiah, put it barely five hundred paces from Heshbon. Its site is not fixed: the map's candidates are Qarn al-Qubish, a hill west of Hisban, Khirbet Ayun Musa below Mount Nebo, a spot near Baal-meon, and Sumia; none has been excavated."
    - "The town lives in two laments over Moab. Isaiah: “the fields of Heshbon languish, and the vine of Sibmah: the lords of the heathen have broken down the principal plants thereof … Therefore I will bewail with the weeping of Jazer the vine of Sibmah”; and Jeremiah, in the same words: “O vine of Sibmah, I will weep for thee with the weeping of Jazer: thy plants are gone over the sea”. The Synodal Bible calls it the vineyard of Sevam there. Moab had taken the plateau back from Israel by the ninth century BC, as the Mesha Stele shows, though the stele does not name Sibmah."
    - "Today the plateau between Hisban and Mount Nebo, in Jordan's Madaba governorate, is dry-farmed in wheat and barley; the vineyards that the prophets wept for are gone, and nothing on the ground marks Sibmah."
  ru:
    - "Сивма, также Севам, была городом на Моавитском плато близ Есевона, славным своими лозами. Колена Рувима и Гада просили у Моисея землю, где «Есевон, и Елеале, и Севам, и Нево», и Рувим отстроил Сивму вместе с Нево и Ваал-Меоном; Иисус Навин ставит её в удел Рувима рядом с Кириафаимом и Цереф-Шахаром. Евсевий знал её как город Моава в Галааде, а Иероним, толкуя Исаию, помещал её едва в пятистах шагах от Есевона. Место её не установлено: кандидаты на карте — Карн-аль-Кубиш, холм к западу от Хисбана, Хирбет-Аюн-Муса под горой Нево, место близ Ваал-Меона и Сумия; ни одно не раскопано."
    - "Город живёт в двух плачах о Моаве. Исаия: «Поля Есевонские оскудели, также и виноградник Севамский; властители народов истребили лучшие лозы его… Посему и я буду плакать о лозе Севамской плачем Иазера»; и Иеремия теми же словами: «Буду плакать о тебе, виноградник Севамский, плачем Иазера; отрасли твои простирались за море». Моав вернул себе плато у Израиля к IX веку до н. э., как показывает стела Меши, хотя Сивму стела не называет."
    - "Сегодня плато между Хисбаном и горой Нево, в иорданской провинции Мадаба, засевают пшеницей и ячменём без орошения; виноградников, о которых плакали пророки, больше нет, и ничто на земле не отмечает Сивму."
  uk:
    - "Сівма, яку пишуть також Севам і Шибма, була містом на моавському плато поблизу Гесбону, відомим своїми виноградними лозами. Коліна Рувима і Гада просили в Мойсея землю, де «Гесбон та Єлале та Себам та Небо», і Рувим відбудував Сівму разом з Нево та Ваал-Меоном; Ісус Навин відносить її до уділу Рувима поряд з Кіріатаїмом і Церет-Шахаром. Євсевій знав її як місто Моаву в Гілеаді, а Ієронім, коментуючи Ісаю, містив її заледве за п’ятсот кроків від Гесбону. Її місце не встановлено: кандидати на мапі — Карн-ель-Кубіш, пагорб на захід від Хісбану, Хірбет-Айюн-Муса під горою Нево, місце поблизу Ваал-Меону та Сумія; жодне з них не розкопане."
    - "Місто живе у двох плачах над Моавом. Ісая: «Ниви Есевонські спустїли, та й виноградник Севамський; властники народів вигубили ті прегарні лозини … Тим і я заплачу по садах Севамських, як плакав над Язером»; і Єремія тими самими словами: «Плакати му по тобі, Севамо виноградня, тим плачем, що й по Язері: паростки твої сягали аж поза море». Синодальний переклад називає її там виноградником Севам. Моав повернув собі плато від Ізраїлю вже в IX ст. до н. е., як свідчить стела Меші, хоч Сівму стела не згадує."
    - "Сьогодні плато між Хісбаном і горою Нево, в йорданській провінції Мадаба, обробляють без зрошення, сіючи пшеницю й ячмінь; виноградників, над якими плакали пророки, більше немає, і ніщо на землі не позначає Сівму."
  es:
    - "Sibma, que aparece también como Sabán y Sebam, era una ciudad de la meseta moabita, cerca de Hesbón, famosa por sus viñas. Las tribus de Rubén y de Gad pidieron a Moisés la tierra de «Hesbón, y Eleale, y Sabán, y Nebo», y Rubén reconstruyó Sibma junto con Nebo y Baal-meón; Josué la sitúa en el lote de Rubén con Quiriataim y Zeret-sahar. Eusebio la conocía como una ciudad de Moab en Galaad, y Jerónimo, al comentar a Isaías, la ponía a apenas quinientos pasos de Hesbón. Su emplazamiento no está fijado: los candidatos del mapa son Qarn al-Qubish, una colina al oeste de Hisbán, Khirbet Ayun Musa, al pie del monte Nebo, un paraje cercano a Baal-meón y Sumia; ninguno ha sido excavado."
    - "La ciudad vive en dos lamentaciones sobre Moab. Isaías: «los campos de Hesbón fueron talados, y las vides de Sibma; señores de gentes hollaron sus generosos sarmientos … Por lo cual lamentaré con lloro de Jazer la viña de Sibma»; y Jeremías, con las mismas palabras: «Con lloro de Jazer lloraré por ti, oh vid de Sibma: tus sarmientos pasaron la mar». La Biblia sinodal la llama allí viña de Sevam. Moab había recuperado la meseta de manos de Israel hacia el siglo IX a. C., como muestra la Estela de Mesa, aunque la estela no nombra Sibma."
    - "Hoy la meseta entre Hisbán y el monte Nebo, en la gobernación jordana de Madaba, se cultiva de secano con trigo y cebada; los viñedos por los que lloraron los profetas han desaparecido, y nada sobre el terreno señala Sibma."
  pt:
    - "Sibma, também escrita Sebã e Sibama, era uma cidade do planalto moabita, perto de Hesbom, famosa por suas videiras. As tribos de Rúben e Gade pediram a Moisés a terra de “Hesbom, Eleale, Sebã, Nebo”, e Rúben reconstruiu Sibma com Nebo e Baal-Meom; Josué a situa no lote de Rúben, com Quiriataim e Zerete-Saar. Eusébio a conhecia como uma cidade de Moabe, em Gileade, e Jerônimo, comentando Isaías, colocou-a a apenas quinhentos passos de Hesbom. Sua localização não está definida: os candidatos do mapa são Qarn al-Qubish, uma colina a oeste de Hisban, Khirbet Ayun Musa, abaixo do monte Nebo, um lugar perto de Baal-Meom e Sumia; nenhum foi escavado."
    - "A cidade vive em dois lamentos sobre Moabe. Isaías: “os campos de Hesbom definham com a videira de Sibma. Os senhores das nações despedaçaram os seus melhores ramos … Portanto, chorarei com o choro de Jazer pela videira de Sibma”; e Jeremias, com as mesmas palavras: “Com mais do que o choro de Jazer eu chorarei por você, videira de Sibma. Os seus ramos passaram além do mar”. A Bíblia Sinodal a chama ali de vinha de Sevam. Moabe havia retomado o planalto de Israel já no século IX a.C., como mostra a Estela de Mesa, embora a estela não mencione Sibma."
    - "Hoje, o planalto entre Hisban e o monte Nebo, na província jordaniana de Madaba, é cultivado em sequeiro com trigo e cevada; as vinhas pelas quais os profetas choraram desapareceram, e nada no terreno marca Sibma."
  de:
    - "Sibma, auch Sebam und Schibma geschrieben, war eine Stadt auf der moabitischen Hochebene bei Heschbon, berühmt für ihre Reben. Die Stämme Ruben und Gad baten Mose um das Land „Hesbon, Eleale, Sebam, Nebo“, und Ruben baute Sibma zusammen mit Nebo und Baal-Meon wieder auf; Josua nennt es im Erbteil Rubens neben Kirjatajim und Zeret-Schahar. Eusebius kannte es als Stadt Moabs in Gilead, und Hieronymus, der Jesaja kommentierte, setzte es kaum fünfhundert Schritte von Heschbon an. Seine Lage ist nicht gesichert: Die Kandidaten der Karte sind Qarn al-Qubish, ein Hügel westlich von Hisban, Khirbet Ayun Musa unterhalb des Berges Nebo, ein Ort nahe Baal-Meon und Sumia; keiner ist ausgegraben."
    - "Die Stadt lebt in zwei Klageliedern über Moab fort. Jesaja: „Hesbon ist ein wüstes Feld geworden; der Weinstock zu Sibma ist verderbt; die Herren unter den Heiden haben seine edlen Reben zerschlagen … Darum weine ich um Jaser und um den Weinstock zu Sibma“; und Jeremia mit denselben Worten: „Mehr als über Jaser muß ich über dich, du Weinstock zu Sibma, weinen, dessen Reben über das Meer reichten“. Die Synodalbibel nennt es dort den Weinberg von Sewam. Moab hatte die Hochebene spätestens im neunten Jahrhundert v. Chr. von Israel zurückgewonnen, wie die Mesa-Stele zeigt, auch wenn die Stele Sibma nicht nennt."
    - "Heute wird die Hochebene zwischen Hisban und dem Berg Nebo im jordanischen Gouvernement Madaba ohne Bewässerung mit Weizen und Gerste bestellt; die Weinberge, um die die Propheten klagten, sind verschwunden, und nichts im Gelände kennzeichnet Sibma."
  fr:
    - "Sibma, aussi écrite Sebam et Schibma, était une ville du plateau moabite près de Hesbon, célèbre pour ses vignes. Les tribus de Ruben et de Gad demandèrent à Moïse le pays de « Hesbon, Élealé, Sebam, Nebo et Beon », et Ruben rebâtit Sibma avec Nebo et Baal-Meon ; Josué la place dans le lot de Ruben avec Kirjathaïm et Tséreth-Haschachar. Eusèbe la connaissait comme une ville de Moab en Galaad, et Jérôme, commentant Ésaïe, la mettait à cinq cents pas à peine de Hesbon. Son site n’est pas fixé : la carte retient Qarn al-Qubish, une colline à l’ouest de Hisban, Khirbet Ayun Musa au pied du mont Nebo, un lieu proche de Baal-Meon, et Sumia ; aucun n’a été fouillé."
    - "La ville vit dans deux lamentations sur Moab. Ésaïe : « les campagnes de Hesbon languissent ; les maîtres des nations ont brisé les ceps de la vigne de Sibma … Aussi je pleure sur la vigne de Sibma, comme sur Jaezer » ; et Jérémie, dans les mêmes termes : « Vigne de Sibma, je pleure sur toi plus que sur Jaezer ; tes rameaux allaient au-delà de la mer ». La Bible synodale y parle de la vigne de Sevam. Moab avait repris le plateau à Israël dès le IXe siècle av. J.-C., comme le montre la stèle de Mescha, bien qu’elle ne nomme pas Sibma."
    - "Aujourd’hui, le plateau entre Hisban et le mont Nebo, dans le gouvernorat jordanien de Madaba, est cultivé sans irrigation en blé et en orge ; les vignobles que pleuraient les prophètes ont disparu, et rien sur le terrain ne marque Sibma."
  pl:
    - "Sibma, zwana też Sebam i Szibma, było miastem na płaskowyżu Moabu w pobliżu Cheszbonu, słynnym z winorośli. Plemiona Rubena i Gada poprosiły Mojżesza o ziemię: „i Hesebon, i Eleale, i Seban, i Nebo”, a Ruben odbudował Sibmę wraz z Nebo i Baal-Meon; Jozue umieszcza ją w dziale Rubena obok Kiriataim i Seret-Haszszachar. Euzebiusz znał ją jako miasto Moabu w Gileadzie, a Hieronim, komentując Izajasza, umieścił ją zaledwie pięćset kroków od Cheszbonu. Jej położenie nie jest ustalone: kandydatami na mapie są Karn al-Kubisz, wzgórze na zachód od Hisbanu, Chirbet Ajun Musa u stóp Góry Nebo, miejsce w pobliżu Baal-Meon oraz Sumia; żadne z nich nie zostało przebadane wykopaliskowo."
    - "Miasto żyje w dwóch lamentach nad Moabem. Izajasz: „pola Hesebońskie spustoszone są, i winna macica Sabama. Panowie narodów potarli najwyborniejsze macice jego … Przetoż płaczę dla płaczu Jazerczyków, i dla winnicy Sabama”; i Jeremiasz tymi samymi słowami: „Bardziej niż płakano Jazerczyków, płaczę nad tobą, o winna macico Sabama! Latorośli twoje dostaną się za morze”. Biblia synodalna nazywa ją tam winnicą Sewam. Moab odzyskał płaskowyż od Izraela najpóźniej w IX wieku p.n.e., jak pokazuje stela Mesza, choć stela nie wymienia Sibmy."
    - "Dziś płaskowyż między Hisbanem a Górą Nebo, w jordańskiej prowincji Madaba, uprawia się bez nawadniania, siejąc pszenicę i jęczmień; winnic, nad którymi płakali prorocy, już nie ma, a nic w terenie nie oznacza miejsca Sibmy."
  it:
    - "Sibma, scritta anche Sebam e Sibmah, era una città dell’altopiano moabita presso Chesbon, famosa per le sue viti. Le tribù di Ruben e di Gad chiesero a Mosè la terra di «Heshbon, Elealeh, Sebam, Nebo», e Ruben ricostruì Sibma insieme a Nebo e a Baal-Meon; Giosuè la colloca nel lotto di Ruben con Kiriataim e Zeret-Saar. Eusebio la conosceva come una città di Moab in Galaad, e Girolamo, commentando Isaia, la poneva a meno di cinquecento passi da Chesbon. Il sito non è stabilito: i candidati della mappa sono Qarn al-Qubish, una collina a ovest di Hisban, Khirbet Ayun Musa sotto il monte Nebo, un luogo presso Baal-Meon e Sumia; nessuno è stato scavato."
    - "La città vive in due lamenti su Moab. Isaia: «le campagne di Heshbon languono; languono i vigneti di Sibmah, le cui viti scelte, che inebriavano i padroni delle nazioni, arrivavano fino a Jazer … Piango, perciò, come piange Jazer, i vigneti di Sibmah»; e Geremia, con le stesse parole: «O vigna di Sibma, io piango per te più ancora che per Jazer; i tuoi rami andavan oltre il mare». La Bibbia sinodale la chiama lì il vigneto di Sevam. Moab aveva ripreso l’altopiano a Israele entro il IX secolo a.C., come mostra la stele di Mesa, benché la stele non nomini Sibma."
    - "Oggi l’altopiano tra Hisban e il monte Nebo, nel governatorato giordano di Madaba, è coltivato in asciutto a frumento e orzo; i vigneti per i quali piansero i profeti sono scomparsi, e nulla sul terreno segna Sibma."
  nl:
    - "Sibma, ook geschreven als Sebam en Sjibma, was een stad op het Moabitische plateau bij Chesbon, beroemd om zijn wijnstokken. De stammen Ruben en Gad vroegen Mozes om het land van “Hesbon, en Eleale, en Schebam, en Nebo”, en Ruben herbouwde Sibma samen met Nebo en Baäl-Meon; Jozua rekent het tot het gebied van Ruben, naast Kirjataïm en Zereth-Sahar. Eusebius kende het als een stad van Moab in Gilead, en Hieronymus, die Jesaja toelichtte, plaatste het op nauwelijks vijfhonderd passen van Chesbon. De ligging is niet vastgesteld: de kandidaten op de kaart zijn Qarn al-Qubish, een heuvel ten westen van Hisban, Khirbet Ayun Musa onder de berg Nebo, een plek bij Baäl-Meon en Sumia; geen ervan is opgegraven."
    - "De stad leeft voort in twee klaagliederen over Moab. Jesaja: “de velden van Hesbon zijn verflauwd, ook de wijnstok van Sibma, de heren der heidenen hebben zijn uitgelezen planten verpletterd” … “Daarom beween ik, in de wening over Jaezer, den wijnstok van Sibma”; en Jeremia, in dezelfde woorden: “Boven het geween van Jaezer zal Ik u bewenen, gij wijnstok van Sibma! uw wijnranken zijn over zee gegaan”. De Synodale Bijbel noemt het daar de wijngaard van Sevam. Moab had het plateau in de 9e eeuw v.Chr. op Israël heroverd, zoals de stèle van Mesa laat zien, al noemt die stèle Sibma niet."
    - "Tegenwoordig wordt het plateau tussen Hisban en de berg Nebo, in de Jordaanse provincie Madaba, zonder irrigatie met tarwe en gerst bebouwd; de wijngaarden waarover de profeten treurden zijn verdwenen en niets op de grond markeert Sibma."
  cs:
    - "Sibma, psaná také Šebam a Šibma, byla město na moábské náhorní plošině poblíž Chešbónu, proslulé svými vinnými révami. Kmeny Rúben a Gád požádaly Mojžíše o zemi „Ezebon a Eleale, a Saban a Nébo“ a Rúben znovu vystavěl Sibmu spolu s Nebem a Báal-meónem; Jozue ji klade do údělu Rúbenova vedle Kirjatajimu a Seret-šacharu. Eusebius ji znal jako město Moábu v Gileadu a Jeroným, když komentoval Izajáše, ji umístil sotva pět set kroků od Chešbónu. Její poloha není stanovena: kandidáty mapy jsou Qarn al-Qubiš, návrší západně od Hisbánu, Chirbet Ajún Músa pod horou Nebo, místo poblíž Báal-meónu a Sumija; žádné z nich nebylo vykopáno."
    - "Město žije ve dvou nářcích nad Moábem. Izajáš: „Nýbrž i réví Ezebon usvadlo, i vinní kmenové Sibma. Páni národů potřeli výborné réví jeho … Protož pláči pro pláč Jazerských a pro vinici Sibma“; a Jeremjáš týmiž slovy: „Více než plakáno bylo Jazerských, plači tebe, ó vinný kmene Sibma. Rozvodové tvoji dostanouť se za moře“. Synodální překlad ji tam nazývá vinicí Sevam. Moáb si plošinu vzal od Izraele zpět do 9. stol. př. n. l., jak ukazuje Mešova stéla, třebaže stéla Sibmu nejmenuje."
    - "Dnes se na plošině mezi Hisbánem a horou Nebo, v jordánském guvernorátu Mádaba, hospodaří bez zavlažování a pěstuje se pšenice a ječmen; vinice, nad nimiž proroci plakali, zmizely a nic na zemi Sibmu nepřipomíná."
  sv:
    - "Sibma, som också skrivs Shebam och Shibma, var en stad på det moabitiska höglandet nära Heshbon, känd för sina vinstockar. Rubens och Gads stammar bad Mose om landet ”Hesbon, Eleale, Sebam, Nebo”, och Ruben byggde upp Sibma tillsammans med Nebo och Baal-Meon; Josua placerar den i Rubens lott med Kirjatajim och Seret-Hashachar. Eusebios kände den som en stad i Moab i Gilead, och Hieronymus, som kommenterar Jesaja, förlade den knappt femhundra steg från Heshbon. Dess läge är inte fastställt: kartans kandidater är Qarn al-Qubish, en kulle väster om Hisban, Khirbet Ayun Musa nedanför Nebo, en plats nära Baal-Meon och Sumia; ingen av dem har grävts ut."
    - "Staden lever i två klagosånger över Moab. Jesaja: ”Hesbons fält äro förvissnade, så ock Sibmas vinträd, vilkas ädla druvor slogo folkens herrar till marken … Därför gråter jag över Sibmas vinträd, såsom Jaeser gråter”; och Jeremia med samma ord: ”Mer än Jaeser gråter, måste jag gråta över dig, du Sibmas vinträd, du vars rankor gingo över havet”. Den synodala bibeln kallar den där Sevams vingård. Moab hade tagit tillbaka platån från Israel på 800-talet f.Kr., som Mesastenen visar, fastän stenen inte nämner Sibma."
    - "I dag odlas platån mellan Hisban och Nebo, i Jordaniens guvernement Madaba, utan bevattning med vete och korn; vingårdarna som profeterna grät över är borta, och ingenting på marken utmärker Sibma."
  nb:
    - "Sibma, også skrevet Sebam og Sjibma, var en by på Moabs høyslette nær Hesjbon, berømt for sine vinstokker. Stammene Ruben og Gad ba Moses om landet «Hesbon og El'ale og Sebam og Nebo», og Ruben bygde Sibma opp igjen sammen med Nebo og Baal-Meon; Josva plasserer den i Rubens lodd sammen med Kirjatajim og Seret-Sjahar. Eusebius kjente den som en by i Moab i Gilead, og Hieronymus, i sin kommentar til Jesaja, satte den knapt fem hundre skritt fra Hesjbon. Beliggenheten er ikke fastslått: kartets kandidater er Qarn al-Qubish, en høyde vest for Hisban, Khirbet Ayun Musa under Nebo, et sted nær Baal-Meon og Sumia; ingen er utgravd."
    - "Byen lever videre i to klagesanger over Moab. Jesaja: «Hesbons marker er visnet, og Sibmas vintre, hvis edle ranker slo folkenes herskere til jorden … Derfor gråter jeg med Jaser over Sibmas vintre»; og Jeremia med de samme ordene: «Som Jaser gråter, gråter jeg over dig, du Sibmas vintre! Dine kvister gikk ut over havet». Synodalbibelen kaller den der Sevams vingård. Moab hadde tatt høysletten tilbake fra Israel innen 800-tallet f.Kr., slik Mesa-stelen viser, selv om stelen ikke nevner Sibma."
    - "I dag dyrkes høysletten mellom Hisban og Nebo, i Jordans Madaba-guvernement, uten vanning med hvete og bygg; vingårdene som profetene gråt over, er borte, og ingenting på stedet markerer Sibma."
  tl:
    - "Ang Sibma, na isinusulat ding Shebam at Shibmah, ay isang bayan sa talampas ng Moab malapit sa Hesbon, bantog sa mga ubasan nito. Hiniling ng mga lipi ni Ruben at Gad kay Moises ang lupain ng “Hesbon, at ang Eleale, at ang Saban, at ang Nebo”, at muling itinayo ni Ruben ang Sibma kasama ang Nebo at Baal-meon; inilalagay ito ni Josue sa bahagi ni Ruben kasama ang Chiriat-haim at Zereth-shahar. Kilala ito ni Eusebio bilang bayan ng Moab sa Gilead, at si Jeronimo, sa kaniyang komentaryo kay Isaias, ay naglagay nito sa halos limandaang hakbang lamang mula sa Hesbon. Hindi tiyak ang kinaroroonan nito: ang mga kandidato ng mapa ay ang Qarn al-Qubish, isang burol sa kanluran ng Hisban, ang Khirbet Ayun Musa sa ilalim ng Bundok Nebo, isang lugar malapit sa Baal-meon, at ang Sumia; wala sa mga ito ang nahukay."
    - "Ang bayan ay nabubuhay sa dalawang panambitan para sa Moab. Isaias: “ang mga bukid ng Hesbon ay nanghihina, at ang ubasan ng Sibma; sinira ng mga mahal na tao ng mga bansa ang mga piling pananim niyaon … Kaya't iiyak ako ng iyak ng Jazer dahil sa puno ng ubas ng Sibma”; at Jeremias, sa halos gayon ding mga salita: “Tatangis ako ng higit kay sa pagtangis ng Jazer dahil sa iyo, Oh puno ng ubas ng Sibma: ang iyong mga sanga ay nagsisidaan ng dagat”. Tinatawag ito roon ng Synodal na Bibliya na ubasan ng Sevam. Binawi ng Moab ang talampas mula sa Israel noong ika-9 na siglo BK, gaya ng ipinakikita ng Estelang Mesa, bagaman hindi pinangangalanan ng estela ang Sibma."
    - "Ngayon, ang talampas sa pagitan ng Hisban at Bundok Nebo, sa lalawigan ng Madaba ng Jordan, ay sinasaka nang walang patubig ng trigo at sebada; ang mga ubasang iniyakan ng mga propeta ay wala na, at walang anumang nagmamarka sa Sibma sa lupa."
  da:
    - "Sibma, også skrevet Sebam og Sjibma, var en by på Moabs højslette nær Hesjbon, berømt for sine vinstokke. Rubens og Gads stammer bad Moses om landet »Hesbon og Eleale og Sebam og Nebo«, og Ruben genopbyggede Sibma sammen med Nebo og Ba'al-Meon; Josva placerer den i Rubens lod sammen med Kirjatajim og Seret-Hasjahar. Eusebius kendte den som en by i Moab i Gilead, og Hieronymus, der kommenterede Esajas, satte den knap fem hundrede skridt fra Hesjbon. Dens beliggenhed er ikke fastlagt: kortets kandidater er Qarn al-Qubish, en høj vest for Hisban, Khirbet Ayun Musa under Nebobjerget, et sted nær Ba'al-Meon og Sumia; ingen af dem er udgravet."
    - "Byen lever videre i to klagesange over Moab. Esajas: »Hesbons Marker ere henvisnede, paa Vintræet i Sibma have Folkenes Herrer knust de ædle Ranker … Derfor vil jeg græde med Jaesers Graad over det Vintræ i Sibma«; og Jeremias med de samme ord: »Jeg maa græde over dig, du Vintræ i Sibma! mere end jeg græder over Jaeser, dine Kviste gik hen over Havet«. Synodalbibelen kalder den dér Sevams vingård. Moab havde allerede i 800-tallet f.Kr. taget højsletten tilbage fra Israel, som Mesja-stelen viser, selv om stelen ikke nævner Sibma."
    - "I dag dyrkes højsletten mellem Hisban og Nebobjerget i Jordans Madaba-guvernement som tørlandsbrug med hvede og byg; de vingårde, som profeterne græd over, er væk, og intet på stedet markerer Sibma."
  sr:
    - "Сивма, пише се и Севам и Шибма, била је град на моавској висоравни близу Есевона, чувен по својим виновим лозама. Племена Рувимово и Гадово затражила су од Мојсија земљу „Есевон и Елеалија и Севама и Навав“, а Рувимовци су обновили Сивму заједно с Нево и Вал-Меоном; Исус је смешта у Рувимов жреб с Киријатајимом и Серет-Сахаром. Јевсевије ју је знао као моавски град у Галаду, а Јероним, тумачећи Исаију, смештао ју је једва петсто корака од Есевона. Њено налазиште није утврђено: кандидати на карти су Карн ал-Кубиш, брдо западно од Хисбана, Хирбет Ајун Муса испод горе Нево, место близу Вал-Меона и Сумија; ниједно није ископавано."
    - "Град живи у двема тужбалицама над Моавом. Исаија: „поља есевонска посушише се и чокот сивамски; господа народна потрше красне лозе његове … Зато ћу плакати плачем јазирским за чокотом сивамским“; а Јеремија готово истим речима: „плакаћу за тобом, лозо сивамска; одводе твоје пређоше море“. Руска синодална Библија ту га назива виноградом Севама. Моав је већ у 9. веку п. н. е. вратио висораван од Израиља, што показује Мисина стела, мада стела Сивму не помиње."
    - "Данас се висораван између Хисбана и горе Нево, у јорданском гувернорату Мадаба, обрађује без наводњавања, са пшеницом и јечмом; виногради за којима су пророци плакали нестали су, а ништа на терену не означава Сивму."
