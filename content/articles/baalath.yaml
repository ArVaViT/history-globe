body:
  en:
    - "Baalath was one of the towns Solomon fortified. Kings lists it after “Gezer, and Beth-horon the nether”: “And Baalath, and Tadmor in the wilderness, in the land”; Chronicles repeats it at the head of Solomon's store cities, chariot cities and cities for horsemen. The name, “lady” or “mistress”, points to a shrine of a goddess, and several places bore it or something like it."
    - "Which Baalath this was is uncertain. Its place next to Gezer and Lower Beth-horon suggests the Baalath of the tribe of Dan, listed with Eltekeh and Gibbethon on the edge of the coastal plain, and most scholars take it so; that town has itself not been found, though sites near Gedera such as Qatra have been proposed. Others think of Baalah, the old name of Kiriath-jearim in the hills west of Jerusalem, or, because Tamar in the south follows in the Hebrew text, of Baalath-beer in the Negev. No excavation has settled the question, and nothing more is known."
  ru:
    - "Ваалаф — один из городов, которые укрепил Соломон. Книга Царств называет его после Газера и нижнего Бефорона: «и Ваалаф и Фадмор в пустыне», а Паралипоменон ставит его во главе городов для запасов, городов для колесниц и городов для конных. Имя, «госпожа» или «владычица», указывает на святилище богини, и такое или похожее имя носили несколько мест."
    - "Какой это Ваалаф, неясно. Соседство с Газером и нижним Бефороном указывает на Ваалаф колена Данова, названный вместе с Елтеке и Гиввефоном на краю приморской равнины, и большинство учёных так и считает; но и этот город не найден, хотя предлагались места близ Гедеры, например Катра. Другие думают о Ваале (в еврейском — Баала), древнем имени Кириаф-Иарима в горах к западу от Иерусалима, или, поскольку в еврейском тексте дальше назван Фамарь на юге, о Ваалаф-Беере в Негеве. Ни одни раскопки вопроса не решили, и больше ничего не известно."
  uk:
    - "Ваалат було одним із міст, які Соломон укріпив. Книги Царів називають його після «Газер і нижнїй Беторон»: «і Баалам і Тадмор (Пальмиру) в пустинї»; Хроніки повторюють його на чолі Соломонових міст для запасів, міст для колісниць і міст для кінноти. Назва, «пані» чи «володарка», вказує на святилище богині, і кілька місць мали її чи подібну."
    - "Який саме це був Ваалат, невідомо. Його місце поруч із Гезером і Нижнім Бет-Хороном наводить на думку про Ваалат племені Дана, названий разом із Елтеке та Гіббетоном на краю прибережної рівнини, і більшість учених так і вважають; саме це місто не знайдено, хоча пропонували місця біля Гедери, як-от Катра. Інші думають про Ваалу, стару назву Кіріят-Єаріма в пагорбах на захід від Єрусалима, або, оскільки в єврейському тексті далі йде Тамара на півдні, про Ваалат-Беер у Негеві. Жодні розкопки питання не вирішили, і більше нічого не відомо."
  es:
    - "Baalat fue una de las ciudades que fortificó Salomón. Reyes la enumera después de «Gezer, y á la baja Beth-oron»: «Y á Baalath, y á Tadmor en tierra del desierto»; las Crónicas la repiten a la cabeza de las ciudades de almacenes, las ciudades de carros y las ciudades de caballeros de Salomón. El nombre, «señora» o «dueña», apunta a un santuario de una diosa, y varios lugares lo llevaron o llevaron algo parecido."
    - "Cuál fue esta Baalat es incierto. Su lugar junto a Gezer y Bet-horón de Abajo sugiere la Baalat de la tribu de Dan, enumerada con Elteque y Gibetón en el borde de la llanura costera, y la mayoría de los estudiosos la toman así; esa ciudad no ha sido hallada, aunque se han propuesto sitios cercanos a Gedera como Qatra. Otros piensan en Baala, el antiguo nombre de Quiriat-jearim en las colinas al oeste de Jerusalén, o, porque Tamar, en el sur, la sigue en el texto hebreo, en Baalat-beer, en el Néguev. Ninguna excavación ha resuelto la cuestión, y nada más se sabe."
  pt:
    - "Baalate foi uma das cidades que Salomão fortificou. Reis a lista depois de “Gezer, Bete-Horom Baixa”: “Baalate, Tamar no deserto”; Crônicas a repete à frente das cidades-armazém de Salomão, das cidades para os carros e das cidades para os cavaleiros. O nome, “senhora” ou “dona”, aponta para um santuário de uma deusa, e vários lugares o tiveram ou tiveram algo parecido."
    - "Qual Baalate era esta é incerto. Sua posição junto a Gezer e Bete-Horom de Baixo sugere a Baalate da tribo de Dã, listada com Elteque e Gibetom na borda da planície costeira, e a maioria dos estudiosos a toma assim; essa cidade não foi achada, embora se tenham proposto sítios perto de Gedera, como Qatra. Outros pensam em Baalá, o velho nome de Quiriate-Jearim, nas colinas a oeste de Jerusalém, ou, porque Tamar, no sul, vem em seguida no texto hebraico, em Baalate-Beer, no Neguebe. Nenhuma escavação resolveu a questão, e nada mais se sabe."
  de:
    - "Baalat war eine der Städte, die Salomo befestigte. Die Königsbücher führen es nach „Geser und das niedere Beth-Horon“ auf: „und Baalath und Thamar in der Wüste im Lande“; die Chronik wiederholt es an der Spitze von Salomos Kornstädten, Wagen- und Reiterstädten. Der Name, „Herrin“ oder „Gebieterin“, weist auf ein Heiligtum einer Göttin, und mehrere Orte trugen ihn oder etwas Ähnliches."
    - "Welches Baalat es war, ist ungewiss. Seine Stellung neben Geser und dem Unteren Bet-Horon legt das Baalat des Stammes Dan nahe, mit Elteke und Gibbeton am Rand der Küstenebene aufgeführt, und die meisten Gelehrten nehmen es so; diese Stadt selbst wurde nicht gefunden, doch wurden Orte bei Gedera wie Qatra vorgeschlagen. Andere denken an Baala, den alten Namen von Kirjat-Jearim in den Bergen westlich von Jerusalem, oder, weil im hebräischen Text Tamar im Süden folgt, an Baalat-Beer im Negev. Keine Grabung hat die Frage entschieden, und mehr ist nicht bekannt."
  fr:
    - "Baalath était l’une des villes que Salomon fortifia. Les Rois la citent après « Guézer, Beth-Horon la basse » : « Baalath, et Thadmor, au désert dans le pays » ; les Chroniques la répètent en tête des villes de magasins, des villes pour les chars et des villes pour la cavalerie de Salomon. Le nom, « dame » ou « maîtresse », renvoie à un sanctuaire de déesse, et plusieurs lieux le portaient ou en portaient un voisin."
    - "Quelle Baalath c’était, on ne le sait pas. Sa place à côté de Guézer et de Beth-Horon la basse suggère la Baalath de la tribu de Dan, citée avec Eltheké et Guibbethon au bord de la plaine côtière, et la plupart des savants l’entendent ainsi ; cette ville n’a elle-même pas été retrouvée, bien que des sites près de Gedera comme Qatra aient été proposés. D’autres pensent à Baala, ancien nom de Kirjath-Jearim dans les collines à l’ouest de Jérusalem, ou, parce que Tamar au sud suit dans le texte hébreu, à Baalath-Beer dans le Négev. Aucune fouille n’a tranché, et l’on ne sait rien de plus."
  it:
    - "Baalat era una delle città fortificate da Salomone. I Re la elencano dopo «Ghezer, Beth-Horon inferiore»: «Baalath e Tadmor nella parte deserta del paese»; le Cronache la ripetono in testa alle città di rifornimento di Salomone, alle città per i carri e alle città per i cavalieri. Il nome, «signora» o «padrona», rimanda a un santuario di una dea, e diversi luoghi lo portarono o ne portarono uno simile."
    - "Quale Baalat fosse è incerto. Il suo posto accanto a Ghezer e a Bet-Oron di sotto suggerisce la Baalat della tribù di Dan, elencata con Elteche e Ghibbeton ai margini della pianura costiera, e la maggior parte degli studiosi la intende così; quella città non è stata essa stessa trovata, benché siano stati proposti siti presso Gedera come Qatra. Altri pensano a Baala, il vecchio nome di Kiriat-Iearim sulle colline a ovest di Gerusalemme, o, poiché nel testo ebraico segue Tamar al sud, a Baalat-Beer nel Negheb. Nessuno scavo ha risolto la questione, e nulla più si sa."
  pl:
    - "Baalat było jednym z miast obwarowanych przez Salomona. Księga Królewska wymienia je po „Gazer i Betoron niższe”: „Przytem Baalat i Tadmor na puszczy w tejże ziemi”; Księga Kronik powtarza je na czele miast spichrzowych, miast wozów i miast dla jazdy Salomona. Nazwa, „pani” lub „władczyni”, wskazuje na sanktuarium bogini, a kilka miejsc nosiło ją lub podobną."
    - "Które Baalat to było, jest niepewne. Jego miejsce obok Gezer i Dolnego Bet-Choron sugeruje Baalat pokolenia Dana, wymienione z Elteke i Gibbeton na skraju równiny nadmorskiej, i tak uważa większość uczonych; samo to miasto nie zostało odnalezione, choć proponowano stanowiska koło Gedery, takie jak Qatra. Inni myślą o Baala, dawnej nazwie Kiriat-Jearim we wzgórzach na zachód od Jerozolimy, albo, ponieważ w tekście hebrajskim następuje Tamar na południu, o Baalat-Beer w Negewie. Żadne wykopaliska nie rozstrzygnęły sprawy i nic więcej nie wiadomo."
  nl:
    - "Baälat was een van de steden die Salomo versterkte. Koningen noemt haar na “Gezer, en het lage Beth-horon”: “En Baalath, en Tamor in de woestijn, in dat land”; Kronieken herhaalt haar aan het hoofd van Salomo’s voorraadsteden, wagensteden en steden voor ruiters. De naam, “vrouwe” of “meesteres”, wijst op een heiligdom van een godin, en verscheidene plaatsen droegen haar of iets dergelijks."
    - "Welk Baälat dit was, is onzeker. Haar plaats naast Gezer en Neder-Beth-Horon doet denken aan het Baälat van de stam Dan, genoemd met Elteke en Gibbeton aan de rand van de kustvlakte, en de meeste geleerden nemen het zo; die stad zelf is niet gevonden, al zijn plaatsen bij Gedera zoals Qatra voorgesteld. Anderen denken aan Baäla, de oude naam van Kirjat-Jearim in de heuvels ten westen van Jeruzalem, of, omdat in de Hebreeuwse tekst Tamar in het zuiden volgt, aan Baälat-Beër in de Negev. Geen opgraving heeft de vraag beslecht, en meer is niet bekend."
  cs:
    - "Báalat bylo jedno z měst, která Šalomoun opevnil. Knihy královské je uvádějí po „Gázer a Betoron dolní“: „Též Baalat a Tadmor na poušti v též zemi“; Letopisy je opakují v čele Šalomounových skladištních měst, měst vozů a měst jízdných. Jméno, „paní“ nebo „vládkyně“, ukazuje na svatyni bohyně a několik míst jej neslo nebo něco podobného."
    - "Které Báalat to bylo, je nejisté. Jeho místo vedle Gezeru a Dolního Bét-choronu naznačuje Báalat kmene Dan, uvedené s Eltekem a Gibetonem na okraji pobřežní roviny, a většina badatelů je tak bere; to město samo nebylo nalezeno, ač navrženy byly lokality poblíž Gedery, jako Qatra. Jiní myslí na Báalu, staré jméno Kirjat-jearímu v pahorcích západně od Jeruzaléma, nebo, protože v hebrejském textu následuje Tamar na jihu, na Báalat-beer v Negevu. Žádné vykopávky otázku nerozhodly a o místě nic víc nevíme."
  sv:
    - "Baalat var en av de städer Salomo befäste. Konungaböckerna nämner den efter ”Geser, ävensom Nedre Bet-Horon”: ”så ock Baalat och Tamar i öknen där i landet”; Krönikeböckerna upprepar den först bland Salomos förrådsstäder, vagnsstäder och häststäder. Namnet, ”härskarinna” eller ”fru”, pekar på en gudinnehelgedom, och flera platser bar det eller något liknande."
    - "Vilket Baalat det var är osäkert. Dess plats bredvid Geser och Nedre Bet-Horon tyder på Dans stams Baalat, upptaget med Elteke och Gibbeton vid kustslättens kant, och de flesta forskare tar det så; den staden har själv inte hittats, fastän platser nära Gedera såsom Qatra har föreslagits. Andra tänker på Baala, det gamla namnet på Kirjat-Jearim i bergen väster om Jerusalem, eller, eftersom Tamar i söder följer i den hebreiska texten, på Baalat-Beer i Negev. Ingen utgrävning har avgjort frågan, och ingenting mer är känt."
  nb:
    - "Baalat var en av byene Salomo befestet. Kongebøkene oppfører den etter «Geser» og «Nedre-Bet-Horon»: «Salomo bygget Geser op igjen, og likeså bygget han op Nedre-Bet-Horon og Ba'alat og Tadmor i ørkenen der i landet»; Krønikebøkene gjentar den først blant Salomos oplagsbyer, byer for stridsvogner og byer for hestfolk. Navnet, «frue» eller «herskerinne», peker på en gudinnehelligdom, og flere steder bar det eller noe lignende."
    - "Hvilken Baalat dette var, er usikkert. Plasseringen ved siden av Geser og Nedre Bet-Horon tyder på Baalat i Dans stamme, oppført med Elteke og Gibbeton i kanten av kystsletten, og de fleste forskere tar det slik; selve byen er ikke funnet, selv om steder nær Gedera som Qatra er foreslått. Andre tenker på Baala, det gamle navnet på Kirjat-Jearim i åsene vest for Jerusalem, eller, fordi Tamar i sør følger i den hebraiske teksten, på Baalat-Beer i Negev. Ingen utgravning har avgjort spørsmålet, og mer er ikke kjent."
  tl:
    - "Ang Baalat ay isa sa mga bayang pinatibay ni Salomon. Inililista ito ng Mga Hari pagkatapos ng “ang Gezer, at ang Beth-horon sa ibaba”: “At ang Baalath, at ang Tamar sa ilang, sa lupain”; inuulit ito ng Mga Cronica sa unahan ng mga bayang imbakan, bayang karo at bayang mangangabayo ni Salomon. Ang pangalan, “ginang” o “maybahay”, ay tumuturo sa dambana ng isang diyosa, at ilang lugar ang nagtaglay nito o katulad nito."
    - "Hindi tiyak kung aling Baalat ito. Ang lugar nito sa tabi ng Gezer at Beth-horon sa Ibaba ay nagmumungkahi ng Baalat ng lipi ni Dan, na nakalista kasama ng Elteche at Gibbethon sa gilid ng kapatagan sa baybayin, at ganito ang turing ng karamihan ng iskolar; hindi pa natatagpuan ang bayang iyon, bagaman iminungkahi ang mga lugar malapit sa Gedera gaya ng Qatra. Iniisip ng iba ang Baala, ang lumang pangalan ng Kiriath-jearim sa mga burol sa kanluran ng Jerusalem, o, dahil sumusunod ang Tamar sa timog sa tekstong Hebreo, ang Baalathbeer sa Negev. Walang paghuhukay na nakapagpasiya sa tanong, at wala nang iba pang alam."
