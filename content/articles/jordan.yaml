# Overview article (ADR 0007). Mainstream facts only; the baptism site is given as the traditional one; present-day flow figures are approximate.
id: jordan
place: ae686c9
title:
  en: "Jordan"
  ru: "Иордан"
  uk: "Йордан"
  es: "Jordán"
  pt: "Jordão"
  de: "Jordan"
  fr: "Jourdain"
  pl: "Jordan"
  it: "Giordano"
  nl: "Jordaan"
  cs: "Jordán"
body:
  en:
    - 'The Jordan rises at the foot of Mount Hermon from springs at Dan, Banias and the Hasbani, passes the former Lake Hula and enters the Sea of Galilee, about 210 m below sea level. From there it winds for more than 200 km through the deep trench of the Ghor to the Dead Sea, about 430 m below the sea and the lowest point on land, though the straight distance is barely 105 km. The Yarmuk and the Jabbok join it from the east. It is a narrow, muddy, winding river, hemmed in by tamarisk and willow; in spring, swollen by melting snow, it "overfloweth all his banks all the time of harvest", and Jeremiah speaks of "the swelling of Jordan".'
    - 'Lot "beheld all the plain of Jordan, that it was well watered every where" and chose it. Jacob prayed, "with my staff I passed over this Jordan". The river was the border of the promised land: Moses was not allowed to cross it, and under Joshua the priests bearing the ark stood in the riverbed while the waters "stood and rose up upon an heap very far from the city Adam", and the people passed over opposite Jericho. Gideon seized its fords against Midian, the Gileadites killed at its passages the Ephraimites who could not say Shibboleth, David crossed it fleeing from Absalom, Elijah smote the waters with his mantle and went over on dry ground, and Naaman the Syrian, told to "wash in Jordan seven times", was healed of his leprosy.'
    - 'In the Gospels the Jordan is the river of John the Baptist: all Judea went out to him "and were all baptized of him in the river of Jordan". Jesus came "from Galilee to Jordan unto John, to be baptized of him", and John''s Gospel places the baptizing at Bethabara (in most manuscripts, Bethany) beyond Jordan. Later Jesus withdrew again "beyond Jordan into the place where John at first baptized". The site venerated since Byzantine times, al-Maghtas on the east bank opposite Jericho, was inscribed by UNESCO in 2015; Qasr al-Yahud faces it on the west bank.'
    - "Today the lower Jordan forms the border between the Kingdom of Jordan and Israel and the West Bank. Since the 1960s Israel's National Water Carrier, Jordan's King Abdullah Canal and dams on the Yarmuk have taken most of its water, so that the river south of the Sea of Galilee carries only a small fraction of its natural flow and the Dead Sea falls by about a metre a year. The city Adam of Joshua's account is identified with Tell ed-Damiyeh, where landslides have dammed the river, as in 1927."
  ru:
    - "Иордан берёт начало у подножия Ермона из источников у Дана, Баниаса и реки Хасбани, проходит бывшее озеро Хула и впадает в Галилейское море, лежащее примерно на 210 м ниже уровня моря. Оттуда он более 200 км петляет по глубокой впадине Гор до Мёртвого моря, около 430 м ниже уровня моря, самой низкой точки суши, хотя по прямой это едва 105 км. С востока в него впадают Ярмук и Иавок. Почти на всём протяжении это узкая, мутная и извилистая река, стиснутая зарослями тамариска и ивы; весной, от талого снега, Иордан «выступает из всех берегов своих во все дни жатвы пшеницы», и Иеремия спрашивает, что будешь делать «в наводнение Иордана»."
    - "Лот «увидел всю окрестность Иорданскую», что она «вся до Сигора орошалась водою», и избрал её. Иаков молился: «я с посохом моим перешел этот Иордан». Река была границей обетованной земли: Моисею не позволено было перейти её, а при Иисусе Навине священники с ковчегом стояли среди русла, пока вода, «текущая сверху, остановилась и стала стеною на весьма большое расстояние, до города Адама», и народ переходил против Иерихона. Гедеон перехватил переправы у Мадианитян, Галаадитяне закалывали у переправы Ефремлян, не умевших выговорить «шибболет», Давид перешёл Иордан, спасаясь от Авессалома, Илия ударил милотью по воде и перешёл посуху, а Нееман Сириянин, которому велено было «омойся семь раз в Иордане», исцелился от проказы."
    - "В Евангелиях Иордан — река Иоанна Крестителя: к нему выходила вся страна Иудейская, «и крестились от него все в реке Иордане». Иисус пришёл «из Галилеи на Иордан к Иоанну креститься от него», а Евангелие от Иоанна помещает крещение в Вифаваре (в большинстве рукописей — Вифании) при Иордане. Позже Иисус снова ушёл «за Иордан, на то место, где прежде крестил Иоанн». Место, почитаемое с византийских времён, лежит на восточном берегу против Иерихона, в Эль-Магтасе в Иордании, и в 2015 году внесено в список ЮНЕСКО; напротив, на западном берегу, — Каср-эль-Яхуд."
    - "Сегодня нижний Иордан служит границей между Иорданским королевством, Израилем и Западным берегом. С 1960-х годов Всеизраильский водовод, иорданский канал короля Абдаллы и плотины на Ярмуке забирают большую часть воды, так что южнее Галилейского моря река несёт лишь малую долю своего прежнего стока, а Мёртвое море опускается примерно на метр в год. Город Адам из рассказа книги Иисуса Навина отождествляют с Телль-эд-Дамией, где оползни, как известно, перегораживали реку — так было и в 1927 году."
  uk:
    - "Йордан бере початок біля підніжжя гори Гермон із джерел у Дані, Баніасі та Хасбані, минає колишнє озеро Хула і входить у Галілейське море приблизно на 210 м нижче рівня моря. Звідти він звивається понад 200 км глибоким рівом Гор до Мертвого моря, приблизно на 430 м нижче рівня моря, найнижчої точки суходолу, хоч пряма відстань ледь 105 км. Ярмук і Яббок впадають у нього зі сходу. Це вузька, каламутна, звивиста річка, затиснута тамариском і вербою; навесні, розбухла від танення снігів, вона, за словами Книги Ісуса Навина, «виступає під жнива всюди з берегів своїх», а Єремія говорить, як «розбурхається Йордань»."
    - "Лот «побачив усю околицю Йорданську ... вся ... наповнена була водою» і обрав її. Яків молився: «з палицею бо сією перебрів я сю Йордань». Річка була межею обітованої землі: Мойсею не дозволили її перейти, а за Ісуса Навина священики, що несли ковчег, стояли в руслі, поки вода «стояла як мур аж до міста Адаму», і народ перейшов навпроти Єрихона. Гедеон захопив її броди проти Мадіаму, гілеадяни вбивали на її переправах єфремлян, які не вміли сказати «Шибболет», Давид перейшов її, тікаючи від Авесалома, Ілля вдарив воду своєю гунею й перейшов по сухому, а Нааман Сирієць, якому веліли «викупайся сїм раз у Йорданї», був зцілений від проказ."
    - "В Євангеліях Йордан — річка Івана Хрестителя: уся Юдея виходила до нього, і «хрестились від него всї в ріцї Йорданї». Ісус прийшов «із Галилеї на Йордан до Йоана, охреститись від него», а Євангеліє від Івана поміщає хрещення у Віфаварі (у більшості рукописів Віфанії) за Йорданом. Пізніше Ісус знову відійшов «на той бік у те місце, де Йоан перше хрестив». Місце, шановане від візантійських часів, Аль-Мактас на східному березі навпроти Єрихона, внесено ЮНЕСКО 2015 року; Каср-аль-Яхуд лежить навпроти на західному березі."
    - "Сьогодні нижній Йордан становить кордон між Королівством Йорданія та Ізраїлем і Західним берегом. Від 1960-х років Національний водогін Ізраїлю, канал короля Абдалли в Йорданії та греблі на Ярмуку забрали більшу частину його води, тож річка на південь від Галілейського моря несе лише малу частку природного стоку, а Мертве море падає приблизно на метр на рік. Місто Адам з оповіді Книги Ісуса Навина ототожнюють із Телль-ед-Дамією, де зсуви перегороджували річку, як 1927 року."
  es:
    - "El Jordán nace al pie del monte Hermón de los manantiales de Dan, Banias y el Hasbani, pasa por el antiguo lago Huleh y entra en el mar de Galilea, a unos 210 m bajo el nivel del mar. Desde allí serpentea más de 200 km por la profunda fosa del Ghor hasta el mar Muerto, a unos 430 m bajo el mar y el punto más bajo de tierra firme, aunque la distancia en línea recta es apenas de 105 km. El Yarmuk y el Jaboc se le unen por el este. Es un río estrecho, fangoso y sinuoso, cercado de tamariscos y sauces; en primavera, crecido por la nieve derretida, «suele reverter sobre todos sus bordes todo el tiempo de la siega», y Jeremías habla de «la hinchazón del Jordán»."
    - "Lot «vió toda la llanura del Jordán, que toda ella era de riego» y la escogió. Jacob oró: «con mi bordón pasé este Jordán». El río era la frontera de la tierra prometida: a Moisés no se le permitió cruzarlo, y bajo Josué los sacerdotes que llevaban el arca se quedaron en el lecho del río mientras las aguas «se pararon como en un montón bien lejos de la ciudad de Adam», y el pueblo pasó frente a Jericó. Gedeón se apoderó de sus vados contra Madián, los galaaditas mataron en sus pasos a los efraimitas que no sabían decir Shibolet, David lo cruzó huyendo de Absalón, Elías golpeó las aguas con su manto y pasó en seco, y Naamán el sirio, a quien dijeron «lávate siete veces en el Jordán», quedó sano de su lepra."
    - "En los Evangelios el Jordán es el río de Juan el Bautista: toda Judea salía a él y «eran todos bautizados por él en el río de Jordán». Jesús vino «de Galilea á Juan al Jordán, para ser bautizado de él», y el Evangelio de Juan sitúa el bautismo en Betábara (en la mayoría de los manuscritos, Betania) al otro lado del Jordán. Más tarde Jesús se retiró de nuevo «tras el Jordán, á aquel lugar donde primero había estado bautizando Juan». El sitio venerado desde la época bizantina, al-Maghtas, en la orilla este frente a Jericó, fue inscrito por la UNESCO en 2015; Qasr al-Yahud se encuentra frente a él, en la orilla oeste."
    - "Hoy el Jordán inferior forma la frontera entre el Reino de Jordania e Israel y Cisjordania. Desde los años sesenta el Acueducto Nacional de Israel, el canal del Rey Abdalá de Jordania y las presas del Yarmuk le han quitado la mayor parte de su agua, de modo que el río al sur del mar de Galilea lleva solo una pequeña fracción de su caudal natural y el mar Muerto baja cerca de un metro al año. La ciudad de Adam del relato de Josué se identifica con Tell ed-Damiyeh, donde los desprendimientos de tierra han represado el río, como en 1927."
  pt:
    - "O Jordão nasce ao pé do monte Hermom, de fontes em Dã, Banias e do Hasbani, passa pelo antigo lago Hula e entra no mar da Galileia, a cerca de 210 m abaixo do nível do mar. Dali serpenteia por mais de 200 km pela profunda fossa do Ghor até o mar Morto, a cerca de 430 m abaixo do mar e o ponto mais baixo em terra, embora a distância em linha reta seja de apenas 105 km. O Yarmuk e o Jaboque se juntam a ele pelo leste. É um rio estreito, lamacento e sinuoso, cercado de tamargueiras e salgueiros; na primavera, inchado pela neve derretida, “transborda por todas as suas margens durante todo o tempo da colheita”, e Jeremias fala das “matas do Jordão”, que a King James traduz como “a cheia do Jordão”."
    - "Ló “viu toda a planície do Jordão, que era bem regada em toda parte” e a escolheu. Jacó orou: “atravessei este Jordão apenas com o meu cajado”. O rio era a fronteira da terra prometida: Moisés não pôde atravessá-lo, e sob Josué os sacerdotes que levavam a arca ficaram no leito do rio enquanto as águas “pararam e se ergueram em um só monte muito longe dali, em Adã”, e o povo passou defronte de Jericó. Gideão tomou seus vaus contra Midiã, os gileaditas mataram em suas passagens os efraimitas que não sabiam dizer Chibolete, Davi o atravessou fugindo de Absalão, Elias feriu as águas com seu manto e passou a pé enxuto, e Naamã, o sírio, a quem mandaram “lave-se no Jordão sete vezes”, foi curado da lepra."
    - "Nos Evangelhos o Jordão é o rio de João Batista: toda a Judeia saiu a ele e “Eram batizados por ele no rio Jordão”. Jesus “veio da Galileia ao Jordão até João, para ser batizado por ele”, e o Evangelho de João situa o batismo em Betábara (na maioria dos manuscritos, Betânia) além do Jordão. Mais tarde Jesus se retirou de novo “para o outro lado do Jordão, para o lugar onde João batizava no princípio”. O sítio venerado desde os tempos bizantinos, al-Maghtas, na margem leste defronte de Jericó, foi inscrito pela UNESCO em 2015; Qasr al-Yahud fica diante dele, na margem oeste."
    - "Hoje o baixo Jordão forma a fronteira entre o Reino da Jordânia e Israel e a Cisjordânia. Desde a década de 1960, o Aqueduto Nacional de Israel, o Canal Rei Abdullah da Jordânia e represas no Yarmuk tomaram a maior parte de sua água, de modo que o rio ao sul do mar da Galileia leva apenas uma pequena fração de seu fluxo natural e o mar Morto baixa cerca de um metro por ano. A cidade de Adã do relato de Josué é identificada com Tell ed-Damiyeh, onde deslizamentos de terra represaram o rio, como em 1927."
  de:
    - "Der Jordan entspringt am Fuß des Hermon aus Quellen bei Dan, Banias und dem Hasbani, fließt am ehemaligen Hulasee vorbei und mündet etwa 210 m unter dem Meeresspiegel in den See Genezareth. Von dort windet er sich mehr als 200 km durch den tiefen Graben des Ghor zum Toten Meer, etwa 430 m unter dem Meer und der tiefste Punkt an Land, obwohl die Luftlinie kaum 105 km beträgt. Jarmuk und Jabbok münden von Osten ein. Er ist ein schmaler, schlammiger, gewundener Fluss, von Tamarisken und Weiden gesäumt; im Frühjahr, von Schmelzwasser angeschwollen, ist er „voll an allen seinen Ufern die ganze Zeit der Ernte“, und Jeremia spricht vom „stolzen Jordan“."
    - "Lot „besah die ganze Gegend am Jordan“, die „wasserreich“ war, und wählte sie. Jakob betete: „denn ich hatte nicht mehr als diesen Stab, da ich über den Jordan ging“. Der Fluss war die Grenze des verheißenen Landes: Mose durfte ihn nicht überqueren, und unter Josua standen die Priester mit der Lade im Flussbett, während das Wasser „aufgerichtet auf einem Haufen, sehr ferne, bei der Stadt Adam“ stand und das Volk Jericho gegenüber hinüberging. Gideon besetzte seine Furten gegen Midian, die Gileaditer töteten an seinen Übergängen die Ephraimiter, die nicht Schibbolet sagen konnten, David überquerte ihn auf der Flucht vor Absalom, Elia schlug mit seinem Mantel auf das Wasser und ging trocken hindurch, und Naaman der Syrer, dem gesagt wurde: „wasche dich siebenmal im Jordan“, wurde von seinem Aussatz geheilt."
    - "In den Evangelien ist der Jordan der Fluss Johannes des Täufers: Das ganze jüdische Land ging zu ihm hinaus, und sie „ließen sich alle von ihm taufen im Jordan“. Dann „kam Jesus aus Galiläa an den Jordan zu Johannes, daß er sich von ihm taufen ließe“, und das Johannesevangelium verlegt das Taufen nach Betabara (in den meisten Handschriften Betanien) jenseits des Jordan. Später zog sich Jesus wieder „jenseit des Jordans an den Ort, da Johannes zuvor getauft hatte“, zurück. Die seit byzantinischer Zeit verehrte Stätte, al-Maghtas am Ostufer gegenüber Jericho, wurde 2015 von der UNESCO eingetragen; Qasr al-Jahud liegt ihr am Westufer gegenüber."
    - "Heute bildet der untere Jordan die Grenze zwischen dem Königreich Jordanien und Israel und dem Westjordanland. Seit den 1960er Jahren haben Israels National Water Carrier, Jordaniens König-Abdullah-Kanal und Dämme am Jarmuk den größten Teil seines Wassers abgeleitet, sodass der Fluss südlich des Sees Genezareth nur einen kleinen Bruchteil seines natürlichen Abflusses führt und das Tote Meer um etwa einen Meter im Jahr sinkt. Die Stadt Adam in Josuas Bericht wird mit Tell ed-Damija gleichgesetzt, wo Erdrutsche den Fluss gestaut haben, wie 1927."
  fr:
    - "Le Jourdain naît au pied du mont Hermon, de sources à Dan, à Banias et du Hasbani, traverse l’ancien lac de la Houla et entre dans la mer de Galilée, à environ 210 m sous le niveau de la mer. De là il serpente sur plus de 200 km dans la profonde fosse du Ghor jusqu’à la mer Morte, à environ 430 m sous la mer et point le plus bas des terres émergées, alors que la distance en ligne droite n’est que de 105 km. Le Yarmouk et le Jabbok le rejoignent par l’est. C’est un fleuve étroit, boueux et sinueux, enserré de tamaris et de saules ; au printemps, gonflé par la fonte des neiges, « le Jourdain regorge par-dessus toutes ses rives tout le temps de la moisson », et Jérémie évoque « les rives orgueilleuses du Jourdain »."
    - "Lot « vit toute la plaine du Jourdain, qui était entièrement arrosée » et la choisit. Jacob pria : « j’ai passé ce Jourdain avec mon bâton ». Le fleuve était la frontière du pays promis : Moïse ne fut pas autorisé à le traverser, et sous Josué les prêtres portant l’arche se tinrent dans le lit tandis que les eaux « s’arrêtèrent, et s’élevèrent en un monceau, à une très grande distance, près de la ville d’Adam », et le peuple passa vis-à-vis de Jéricho. Gédéon s’empara de ses gués contre Madian, les Galaadites tuèrent à ses passages les Éphraïmites qui ne savaient pas dire Schibboleth, David le traversa en fuyant Absalom, Élie frappa les eaux de son manteau et passa à sec, et Naaman le Syrien, à qui il fut dit : « lave-toi sept fois dans le Jourdain », fut guéri de sa lèpre."
    - "Dans les Évangiles, le Jourdain est le fleuve de Jean-Baptiste : tout le pays de Judée allait à lui, et tous « se faisaient baptiser par lui dans le fleuve du Jourdain ». Jésus vint « de la Galilée au Jourdain vers Jean, pour être baptisé par lui », et l’Évangile de Jean place le baptême à Béthabara (dans la plupart des manuscrits, Béthanie), « au-delà du Jourdain ». Plus tard, Jésus se retira de nouveau « au-delà du Jourdain, dans le lieu où Jean avait d’abord baptisé ». Le site vénéré depuis l’époque byzantine, al-Maghtas sur la rive est en face de Jéricho, fut inscrit par l’UNESCO en 2015 ; Qasr al-Yahud lui fait face sur la rive ouest."
    - "Aujourd’hui, le bas Jourdain forme la frontière entre le Royaume de Jordanie et Israël et la Cisjordanie. Depuis les années 1960, le Conduit national d’eau d’Israël, le canal du roi Abdallah de Jordanie et les barrages sur le Yarmouk ont pris l’essentiel de son eau, si bien que le fleuve au sud de la mer de Galilée n’a plus qu’une faible fraction de son débit naturel et que la mer Morte baisse d’environ un mètre par an. La ville d’Adam du récit de Josué est identifiée à Tell ed-Damiyeh, où des glissements de terrain ont barré le fleuve, comme en 1927."
  pl:
    - "Jordan wypływa u stóp góry Hermon ze źródeł w Dan, Banijas i Hasbani, mija dawne jezioro Hula i wpada do Jeziora Galilejskiego, leżącego około 210 m poniżej poziomu morza. Stamtąd wije się ponad 200 km przez głęboki rów Ghor do Morza Martwego, około 430 m poniżej poziomu morza, najniższego punktu na lądzie, choć odległość w linii prostej wynosi ledwie 105 km. Jarmuk i Jabbok wpadają do niego ze wschodu. Jest rzeką wąską, mętną i krętą, ściśnioną przez tamaryszki i wierzby; na wiosnę, wezbrany roztopami, „wzbiera i wylewa na wszystkie brzegi swoje, na każdy czas żniwa”, a Jeremiasz mówi o „nadętości Jordanu”."
    - "Lot „obaczył wszystkę równinę nad Jordanem, iż wszystka wilgotna była” i ją wybrał. Jakub modlił się: „tylko o lasce mojej przeszedłem ten Jordan”. Rzeka była granicą ziemi obiecanej: Mojżeszowi nie wolno było jej przekroczyć, a za Jozuego kapłani niosący arkę stanęli w korycie, podczas gdy wody „stanęły w jednej kupie bardzo daleko od Adama”, i lud przeprawił się naprzeciw Jerycha. Gedeon zajął jej brody przeciw Madianowi, Gileadczycy zabijali na jej przeprawach Efraimitów, którzy nie umieli powiedzieć Szibbolet, Dawid przekroczył ją, uciekając przed Absalomem, Eliasz uderzył wody płaszczem i przeszedł po suchym, a Naaman Syryjczyk, któremu kazano „omyj się siedm kroć w Jordanie”, został uzdrowiony z trądu."
    - "W Ewangeliach Jordan jest rzeką Jana Chrzciciela: cała Judea wychodziła do niego, „a wszyscy byli od niego chrzczeni w rzece Jordanie”. Jezus przyszedł „od Galilei nad Jordan do Jana, aby był ochrzczony od niego”, a Ewangelia Jana umieszcza chrzest w Betabara (w większości rękopisów Betania) za Jordanem. Później Jezus znów wycofał się „za Jordan na ono miejsce, gdzie przedtem Jan chrzcił”. Miejsce czczone od czasów bizantyńskich, al-Maghtas na wschodnim brzegu naprzeciw Jerycha, zostało wpisane przez UNESCO w 2015 r.; naprzeciw niego na zachodnim brzegu leży Kasr al-Jahud."
    - "Dziś dolny Jordan tworzy granicę między Królestwem Jordanii a Izraelem i Zachodnim Brzegiem. Od lat sześćdziesiątych Narodowy Przewód Wodny Izraela, Kanał Króla Abdullaha w Jordanii i tamy na Jarmuku zabrały większość jego wody, tak że rzeka na południe od Jeziora Galilejskiego niesie tylko niewielki ułamek naturalnego przepływu, a Morze Martwe opada o około metr rocznie. Miasto Adam z opisu Jozuego utożsamia się z Tell ed-Damija, gdzie osuwiska zatamowały rzekę, jak w 1927 r."
  it:
    - "Il Giordano nasce ai piedi del Monte Ermon dalle sorgenti di Dan, di Banias e dell’Hasbani, passa l’ex lago Hula ed entra nel Lago di Tiberiade, circa 210 m sotto il livello del mare. Di lì serpeggia per più di 200 km attraverso la profonda fossa del Ghor fino al Mar Morto, circa 430 m sotto il mare e il punto più basso sulla terraferma, benché la distanza in linea retta sia appena 105 km. Lo Yarmuk e lo Iabbok vi confluiscono da est. È un fiume stretto, fangoso e sinuoso, serrato fra tamerici e salici; in primavera, gonfio per la neve che si scioglie, «straripa da per tutto durante tutto il tempo della mèsse», e Geremia parla di quando «il Giordano sarà gonfio»."
    - "Lot «vide l’intera pianura del Giordano», «tutta quanta irrigata», e la scelse. Giacobbe pregò: «io passai questo Giordano col mio bastone». Il fiume era il confine della terra promessa: a Mosè non fu concesso di attraversarlo, e sotto Giosuè i sacerdoti che portavano l’arca stettero nel letto del fiume mentre le acque «si fermarono e si elevarono in un mucchio, a una grandissima distanza, fin presso la città di Adam», e il popolo passò dirimpetto a Gerico. Gedeone si impadronì dei suoi guadi contro Madian, i Galaaditi uccisero ai suoi passaggi gli Efraimiti che non sapevano dire Scibboleth, Davide lo attraversò fuggendo da Assalonne, Elia percosse le acque con il suo mantello e passò all’asciutto, e Naaman il Siro, cui fu detto «làvati sette volte nel Giordano», fu guarito dalla lebbra."
    - "Nei Vangeli il Giordano è il fiume di Giovanni Battista: tutto il paese della Giudea accorreva a lui, «ed erano da lui battezzati nel fiume Giordano». Gesù «dalla Galilea si recò al Giordano da Giovanni per esser da lui battezzato», e il Vangelo di Giovanni pone il battesimo a Betabara (nella maggior parte dei manoscritti, Betania) al di là del Giordano. Più tardi Gesù si ritirò di nuovo «al di là del Giordano, nel luogo dove Giovanni da principio stava battezzando». Il sito venerato dall’epoca bizantina, al-Maghtas sulla riva orientale di fronte a Gerico, fu iscritto dall’UNESCO nel 2015; Qasr al-Yahud gli sta di fronte sulla riva occidentale."
    - "Oggi il Giordano inferiore forma il confine fra il Regno di Giordania e Israele e la Cisgiordania. Dagli anni Sessanta l’Acquedotto Nazionale d’Israele, il Canale King Abdullah della Giordania e le dighe sullo Yarmuk ne hanno preso la maggior parte dell’acqua, così che il fiume a sud del Lago di Tiberiade porta solo una piccola frazione della sua portata naturale e il Mar Morto cala di circa un metro all’anno. La città di Adam del racconto di Giosuè è identificata con Tell ed-Damiyeh, dove frane hanno sbarrato il fiume, come nel 1927."
  nl:
    - "De Jordaan ontspringt aan de voet van de Hermon uit bronnen bij Dan, Banias en de Hasbani, passeert het voormalige Hulameer en stroomt het Meer van Galilea in, ongeveer 210 m onder zeeniveau. Vandaar slingert hij ruim 200 km door de diepe graben van de Ghor naar de Dode Zee, ongeveer 430 m onder zee en het laagste punt op het land, al is de rechte afstand nauwelijks 105 km. De Yarmuk en de Jabbok vloeien vanuit het oosten in hem uit. Het is een smalle, modderige, kronkelende rivier, omzoomd door tamarisken en wilgen; in de lente, gezwollen door smeltende sneeuw, is hij “vol al de dagen des oogstes aan al haar oevers”, en Jeremia spreekt van “de verheffing van de Jordaan”."
    - "Lot “zag de ganse vlakte der Jordaan, dat zij die geheel bevochtigde” en koos haar. Jakob bad: “ik ben met mijn staf over deze Jordaan gegaan”. De rivier was de grens van het beloofde land: Mozes mocht haar niet oversteken, en onder Jozua stonden de priesters met de ark in de rivierbedding terwijl de wateren “rezen op een hoop, zeer verre van de stad Adam af”, en het volk trok over, tegenover Jericho. Gideon bezette haar voorden tegen Midian, de Gileadieten doodden bij haar overgangen de Efraïmieten die Sjibbolet niet konden zeggen, David stak haar over op de vlucht voor Absalom, Elia sloeg het water met zijn mantel en ging op het droge over, en de Syriër Naäman, aan wie gezegd werd: “was u zevenmaal in de Jordaan”, werd van zijn melaatsheid genezen."
    - "In de evangeliën is de Jordaan de rivier van Johannes de Doper: heel Judea ging naar hem uit en “werden allen van hem gedoopt in de rivier de Jordaan”. Jezus kwam “van Galilea naar de Jordaan, tot Johannes, om van hem gedoopt te worden”, en Johannes’ evangelie plaatst het dopen te Bethabara (in de meeste handschriften Bethanië) aan de overkant van de Jordaan. Later ging Jezus opnieuw “wederom over de Jordaan, tot de plaats, waar Johannes eerst doopte”. De sinds de Byzantijnse tijd vereerde plaats, al-Maghtas op de oostoever tegenover Jericho, werd in 2015 door UNESCO op de werelderfgoedlijst geplaatst; Qasr al-Yahud ligt er aan de westoever tegenover."
    - "Nu vormt de benedenloop van de Jordaan de grens tussen het Koninkrijk Jordanië en Israël en de Westoever. Sinds de jaren zestig hebben Israëls Nationale Waterleiding, Jordaniës Koning Abdoellah-kanaal en dammen in de Yarmuk het meeste water afgevoerd, zodat de rivier ten zuiden van het Meer van Galilea nog maar een klein deel van haar natuurlijke afvoer draagt en de Dode Zee ongeveer een meter per jaar daalt. De stad Adam uit Jozua’s verhaal wordt vereenzelvigd met Tell ed-Damiyeh, waar aardverschuivingen de rivier hebben gestuwd, zoals in 1927."
  cs:
    - "Jordán pramení na úpatí Hermonu z pramenů u Danu, Baníásu a Hasbání, protéká bývalým jezerem Chula a vlévá se do Galilejského jezera, asi 210 m pod hladinou moře. Odtud se vine více než 200 km hlubokým příkopem Ghóru k Mrtvému moři, asi 430 m pod mořem a nejníže položenému bodu na souši, ačkoli přímá vzdálenost je sotva 105 km. Z východu se do něj vlévá Jarmuk a Jabok. Je to úzká, bahnitá, klikatá řeka, sevřená tamaryšky a vrbami; na jaře, rozlitá táním sněhu, „vystupuje ze všech břehů svých v každý čas žně“ a Jeremjáš mluví o „zdutém Jordánu“."
    - "Lot „spatřil všecku rovinu vůkol Jordánu, kteráž … všecka až k Ségor svlažována byla“ a zvolil si ji. Jákob se modlil: „s holí svou přešel jsem Jordán tento“. Řeka byla hranicí zaslíbené země: Mojžíš ji nesměl přejít a za Jozua kněží nesoucí truhlu stáli v řečišti, zatímco vody „shrnuly se v hromadu jednu velmi daleko od Adam města“, a lid přešel naproti Jerichu. Gedeon obsadil její brody proti Midjánu, Gileadští zabili na jejích přechodech Efrajimce, kteří neuměli říci Šibolet, David ji přešel prchající před Abšalomem, Elijáš udeřil na vody svým pláštěm a přešel po suchu a Námán Syrský, jemuž bylo řečeno „umej se sedmkrát v Jordáně“, byl uzdraven z malomocenství."
    - "V evangeliích je Jordán řekou Jana Křtitele: vyšla k němu celá Judea a „křtili se od něho všickni v Jordáně řece“. Ježíš přišel „od Galilee k Jordánu k Janovi, aby také pokřtěn byl od něho“ a Janovo evangelium klade křtění do Betabary (ve většině rukopisů Betanie) za Jordánem. Později Ježíš odešel opět „za Jordán na to místo, kdež nejprv Jan křtil“. Místo uctívané od byzantských dob, al-Maghtas na východním břehu naproti Jerichu, bylo zapsáno UNESCO roku 2015; Qasr al-Jahúd stojí naproti na západním břehu."
    - "Dnes tvoří dolní Jordán hranici mezi Jordánským královstvím a Izraelem a Západním břehem. Od 60. let 20. století odebírají většinu jeho vody izraelský Národní vodovod, jordánský Kanál krále Abdalláha a přehrady na Jarmuku, takže řeka jižně od Galilejského jezera nese jen malý zlomek svého přirozeného průtoku a Mrtvé moře klesá asi o metr ročně. Město Adam z Jozueho vyprávění se ztotožňuje s Tell ed-Damíja, kde sesuvy půdy řeku přehradily, jako roku 1927."
