# Overview article (ADR 0007). Mainstream facts only; the hill is said to be unidentified, the nineteenth-century proposal named as such; no dates are given for Saul.
id: hachilah
place: a28a7df
title:
  en: "Hachilah"
  ru: "Гахила"
body:
  en:
    - "Hachilah is a hill in the wilderness of Judah east of Ziph, on the edge of the bare country the Bible calls Jeshimon, the waste that falls to the Dead Sea. It is named only in the story of David's flight from Saul. Twice the Ziphites went up to Saul at Gibeah to betray him: “Doth not David hide himself with us in strong holds in the wood, in the hill of Hachilah, which is on the south of Jeshimon?”, and again, “Doth not David hide himself in the hill of Hachilah, which is before Jeshimon?” The Synodal Bible, following the Hebrew, says the hill lay to the right of Jeshimon."
    - "The second time Saul came down with three thousand chosen men and “pitched in the hill of Hachilah, which is before Jeshimon, by the way”, while David watched from the wilderness. That night David and Abishai walked into the sleeping camp, found Saul with his spear stuck in the ground at his head, and took the spear and the cruse of water; from the hill opposite David called to Abner and to Saul, and Saul confessed, “I have sinned: return, my son David”. The hill's name may mean “dark” or “dusky”."
    - "The hill has not been identified with certainty. Ziph is Tell Zif, about 7 km south-east of Hebron, and the Jeshimon is the desert east of it; Claude Conder in the 1870s proposed the long ridge of Dhahret el-Kolah, east of Ziph above the descent to Engedi, on the ground of the name, and the map follows him. The ridge today is open desert pasture in the southern Hebron hills, grazed by Bedouin flocks, with the Dead Sea in view to the east."
  ru:
    - "Гахила — холм в пустыне Иудейской к востоку от Зифа, на краю голой земли, которую Библия зовёт Иесимоном, пустоши, спадающей к Мёртвому морю. Он назван только в рассказе о бегстве Давида от Саула. Дважды Зифеи приходили к Саулу в Гиву, чтобы выдать его: «вот, Давид скрывается у нас в неприступных местах, в лесу, на холме Гахила, что направо от Иесимона», и снова: «вот, Давид скрывается у нас на холме Гахила, что направо от Иесимона». Синодальный перевод следует здесь еврейскому тексту, где «направо» значит и «к югу», как и понимает это английская Библия короля Иакова."
    - "Во второй раз Саул спустился с тремя тысячами отборных мужей и «расположился Саул на холме Гахила, что направо от Иесимона, при дороге», а Давид наблюдал из пустыни. В ту ночь Давид с Авессой вошли в спящий стан, нашли Саула с копьём, воткнутым в землю у изголовья, и взяли копьё и сосуд с водой; с холма напротив Давид окликнул Авенира и Саула, и Саул признал: «согрешил я; возвратись, сын мой Давид». Имя холма может значить «тёмный»."
    - "Холм не опознан с уверенностью. Зиф — это Тель-Зиф примерно в 7 км к юго-востоку от Хеврона, а Иесимон — пустыня к востоку от него; Клод Кондер в 1870-х годах предложил по созвучию имени длинный хребет Захрат-эль-Кола к востоку от Зифа над спуском к Ен-Гадди, и карта следует ему. Хребет сегодня — открытое пустынное пастбище в южных Хевронских горах, где пасут бедуинские стада, а на востоке видно Мёртвое море."
