body:
  en:
    - "Hachilah is a hill in the wilderness of Judah east of Ziph, on the edge of the bare country the Bible calls Jeshimon, the waste that falls to the Dead Sea. It is named only in the story of David's flight from Saul. Twice the Ziphites went up to Saul at Gibeah to betray him: “Doth not David hide himself with us in strong holds in the wood, in the hill of Hachilah, which is on the south of Jeshimon?”, and again, “Doth not David hide himself in the hill of Hachilah, which is before Jeshimon?” The Synodal Bible, following the Hebrew, says the hill lay to the right of Jeshimon."
    - "The second time Saul came down with three thousand chosen men and “pitched in the hill of Hachilah, which is before Jeshimon, by the way”, while David watched from the wilderness. That night David and Abishai walked into the sleeping camp, found Saul with his spear stuck in the ground at his head, and took the spear and the cruse of water; from the hill opposite David called to Abner and to Saul, and Saul confessed, “I have sinned: return, my son David”. The hill's name may mean “dark” or “dusky”."
    - "The hill has not been identified with certainty. Ziph is Tell Zif, about 7 km south-east of Hebron, and the Jeshimon is the desert east of it; Claude Conder in the 1870s proposed the long ridge of Dhahret el-Kolah, east of Ziph above the descent to Engedi, on the ground of the name, and the map follows him. The ridge today is open desert pasture in the southern Hebron hills, grazed by Bedouin flocks, with the Dead Sea in view to the east."
  ru:
    - "Гахила — холм в пустыне Иудейской к востоку от Зифа, на краю голой земли, которую Библия зовёт Иесимоном, пустоши, спадающей к Мёртвому морю. Он назван только в рассказе о бегстве Давида от Саула. Дважды Зифеи приходили к Саулу в Гиву, чтобы выдать его: «вот, Давид скрывается у нас в неприступных местах, в лесу, на холме Гахила, что направо от Иесимона», и снова: «вот, Давид скрывается у нас на холме Гахила, что направо от Иесимона». Синодальный перевод следует здесь еврейскому тексту, где «направо» значит и «к югу», как и понимает это английская Библия короля Иакова."
    - "Во второй раз Саул спустился с тремя тысячами отборных мужей и «расположился Саул на холме Гахила, что направо от Иесимона, при дороге», а Давид наблюдал из пустыни. В ту ночь Давид с Авессой вошли в спящий стан, нашли Саула с копьём, воткнутым в землю у изголовья, и взяли копьё и сосуд с водой; с холма напротив Давид окликнул Авенира и Саула, и Саул признал: «согрешил я; возвратись, сын мой Давид». Имя холма может значить «тёмный»."
    - "Холм не опознан с уверенностью. Зиф — это Тель-Зиф примерно в 7 км к юго-востоку от Хеврона, а Иесимон — пустыня к востоку от него; Клод Кондер в 1870-х годах предложил по созвучию имени длинный хребет Захрат-эль-Кола к востоку от Зифа над спуском к Ен-Гадди, и карта следует ему. Хребет сегодня — открытое пустынное пастбище в южных Хевронских горах, где пасут бедуинские стада, а на востоке видно Мёртвое море."
  uk:
    - "Гахіла — пагорб у Юдейській пустелі на схід від Зіфа, на краю голого краю, який Біблія називає Єшимоном, пустиря, що спадає до Мертвого моря. Він названий лише в історії втечі Давида від Саула. Двічі зифеї ходили до Саула в Гіву, щоб видати Давида: «Давид ховається в нас по неприступних місцях, в лїсї, на верху гори Гахила, що направо від Есимону», і знову: «Чи знаєш ти, що Давид ховається в нас на горі Гахилї, перед пустинею?» Синодальна Біблія, слідуючи давньоєврейському тексту, каже, що пагорб лежав праворуч від Єшимона."
    - "Удруге Саул спустився з трьома тисячами обраних людей і «отаборився Саул на горі Гахилї, що лежить перед пустинею при дорозї», а Давид стежив із пустелі. Тієї ночі Давид і Авішай зайшли в сонний табір, знайшли Саула зі списом, устромленим у землю біля голови, і взяли спис та глечик з водою; з протилежного пагорба Давид гукнув Авеніра й Саула, і Саул визнав: «Провинив я; вернись назад, сину Давиде». Назва пагорба може означати «темний» або «смуглявий»."
    - "Пагорб не ототожнено з певністю. Зіф — це Телль-Зіф, приблизно за 7 км на південний схід від Хеврона, а Єшимон — пустеля на схід від нього; Клод Кондер у 1870-х роках запропонував довгий хребет Захрет-ель-Коля, на схід від Зіфа над спуском до Ен-Геді, на підставі назви, і карта йде за ним. Сьогодні хребет — відкрите пустельне пасовисько в південних хевронських пагорбах, де пасуться отари бедуїнів, з Мертвим морем на виду на сході."
  es:
    - "Haquila es una colina en el desierto de Judá, al este de Zif, en el borde del país árido que la Biblia llama Jesimón, el páramo que desciende hacia el mar Muerto. Se nombra solo en la historia de la huida de David ante Saúl. Dos veces subieron los zifeos a Saúl, en Gabaa, para traicionarlo: «¿No está David escondido en nuestra tierra en las peñas del bosque, en el collado de Hachîla que está á la mano derecha del desierto?», y de nuevo: «¿No está David escondido en el collado de Hachîla delante del desierto?». La Biblia sinodal, siguiendo el hebreo, dice que la colina estaba a la derecha de Jesimón."
    - "La segunda vez Saúl bajó con tres mil hombres escogidos y allí «asentó Saúl el campo en el collado de Hachîla, que está delante del desierto junto al camino», mientras David vigilaba desde el desierto. Aquella noche David y Abisai entraron en el campamento dormido, hallaron a Saúl con su lanza clavada en tierra a la cabecera, y se llevaron la lanza y la vasija de agua; desde la colina de enfrente David llamó a Abner y a Saúl, y Saúl confesó: «He pecado: vuélvete, hijo mío David». El nombre de la colina puede significar «oscura» o «sombría»."
    - "La colina no ha sido identificada con certeza. Zif es Tell Zif, a unos 7 km al sudeste de Hebrón, y el Jesimón es el desierto al este de ella; Claude Conder propuso en los años 1870, por el nombre, la larga loma de Dhahret el-Kolah, al este de Zif, sobre el descenso a Engadi, y el mapa lo sigue. Hoy la loma es un pasto abierto del desierto en las colinas del sur de Hebrón, apacentado por rebaños beduinos, con el mar Muerto a la vista hacia el este."
  pt:
    - "Haquilá é uma colina no deserto de Judá, a leste de Zife, na orla da terra árida que a Bíblia chama Jesimom, o ermo que desce para o mar Morto. É nomeada apenas na história da fuga de Davi diante de Saul. Duas vezes os zifeus subiram a Saul, em Gibeá, para traí-lo: “Por acaso Davi não está escondido entre nós, nas fortalezas de Horesa, na colina de Haquila, que fica ao sul do deserto?”, e de novo: “Davi não está escondido na colina de Haquila, em frente ao deserto?” A Bíblia Sinodal, seguindo o hebraico, diz que a colina ficava à direita de Jesimom."
    - "Na segunda vez Saul desceu com três mil homens escolhidos e “acampou na colina de Haquila, que fica em frente ao deserto, junto à estrada”, enquanto Davi observava do deserto. Naquela noite Davi e Abisai entraram no acampamento adormecido, acharam Saul com a lança cravada no chão à cabeceira, e levaram a lança e a jarra de água; da colina em frente Davi chamou Abner e Saul, e Saul confessou: “Pequei. Volte, meu filho Davi”. O nome da colina pode significar “escura” ou “sombria”."
    - "A colina não foi identificada com certeza. Zife é Tell Zif, a cerca de 7 km a sudeste de Hebrom, e o Jesimom é o deserto a leste dela; Claude Conder, na década de 1870, propôs a longa crista de Dhahret el-Kolah, a leste de Zife, acima da descida para En-Gedi, com base no nome, e o mapa o segue. A crista é hoje pasto aberto de deserto nas colinas de Hebrom do sul, percorrido por rebanhos de beduínos, com o mar Morto à vista a leste."
  de:
    - "Hachila ist ein Hügel in der Wüste Juda östlich von Sif, am Rand des kahlen Landes, das die Bibel Jeschimon nennt, der Einöde, die zum Toten Meer abfällt. Er wird nur in der Geschichte von Davids Flucht vor Saul genannt. Zweimal gingen die Sifiter zu Saul nach Gibea hinauf, um David zu verraten: „Ist nicht David bei uns verborgen an sicherem Ort in der Heide, auf dem Hügel Hachila, der zur Rechten liegt an der Wüste?“, und noch einmal: „Ist nicht David verborgen auf dem Hügel Hachila vor der Wüste?“ Die Synodalübersetzung sagt nach dem Hebräischen, der Hügel habe rechts von Jeschimon gelegen."
    - "Beim zweiten Mal kam Saul mit dreitausend auserwählten Männern herab und „lagerte sich auf dem Hügel Hachila, der vor der Wüste liegt am Wege“, während David aus der Wüste zusah. In jener Nacht gingen David und Abisai in das schlafende Lager, fanden Saul mit seinem Speer, der an seinem Kopf in der Erde steckte, und nahmen Speer und Wasserkrug; vom gegenüberliegenden Hügel rief David Abner und Saul an, und Saul bekannte: „Ich habe gesündigt, komm wieder, mein Sohn David“. Der Name des Hügels bedeutet vielleicht „dunkel“ oder „düster“."
    - "Der Hügel ist nicht sicher identifiziert. Sif ist Tell Zif, etwa 7 km südöstlich von Hebron, und Jeschimon ist die Wüste östlich davon; Claude Conder schlug in den 1870er Jahren aufgrund des Namens den langen Höhenzug Dhahret el-Kolah vor, östlich von Sif über dem Abstieg nach En-Gedi, und die Karte folgt ihm. Der Höhenzug ist heute offenes Wüstenweideland in den südlichen Hebroner Bergen, von Beduinenherden beweidet, mit dem Toten Meer im Blick nach Osten."
  fr:
    - "Hakila est une colline du désert de Juda, à l’est de Ziph, en lisière de la région nue que la Bible appelle Jeschimon, la solitude qui descend vers la mer Morte. Elle n’est nommée que dans l’histoire de la fuite de David devant Saül. À deux reprises, les Ziphiens montèrent auprès de Saül à Guibea pour le trahir : « David n’est-il pas caché parmi nous dans des lieux forts, dans la forêt, sur la colline de Hakila, qui est au midi du désert ? », puis : « David n’est-il pas caché sur la colline de Hakila, en face du désert ? » La Bible synodale, suivant l’hébreu, dit que la colline se trouvait à droite de Jeschimon."
    - "La seconde fois, Saül descendit avec trois mille hommes d’élite et « campa sur la colline de Hakila, en face du désert, près du chemin », tandis que David observait depuis le désert. Cette nuit-là, David et Abischaï entrèrent dans le camp endormi, trouvèrent Saül avec sa lance plantée en terre à son chevet, et prirent la lance et la cruche d’eau ; depuis la colline d’en face, David appela Abner et Saül, et Saül confessa : « J’ai péché ; reviens, mon fils David ». Le nom de la colline peut signifier « sombre » ou « obscure »."
    - "La colline n’a pas été identifiée avec certitude. Ziph est Tell Zif, à environ 7 km au sud-est d’Hébron, et le Jeschimon est le désert à l’est ; Claude Conder proposa dans les années 1870, d’après le nom, la longue crête de Dhahret el-Kolah, à l’est de Ziph, au-dessus de la descente vers En-Guédi, et la carte le suit. La crête est aujourd’hui un pâturage désertique ouvert dans les collines d’Hébron méridionales, parcouru par les troupeaux bédouins, avec la mer Morte en vue à l’est."
  pl:
    - "Chakila to wzgórze na pustyni Judzkiej na wschód od Zif, na skraju nagiej krainy, którą Biblia nazywa Jeszimon, pustkowiem opadającym ku Morzu Martwemu. Jest wymienione tylko w opowieści o ucieczce Dawida przed Saulem. Dwukrotnie Zifejczycy poszli do Saula do Gibei, by go zdradzić: „Azaż Dawid nie kryje się u nas po miejscach obronnych w lesie na pagórku Hachila, który jest po prawej stronie Jesymona?”, i ponownie: „Izali się nie kryje Dawid na pagórku Hachila, przeciw Jesymon?”. Biblia synodalna, idąc za hebrajskim, mówi, że wzgórze leżało po prawej stronie Jeszimonu."
    - "Za drugim razem Saul zszedł z trzema tysiącami wybranych mężów, a „położył się Saul obozem na pagórku Hachila, które jest przeciw Jesymon podle drogi”, podczas gdy Dawid obserwował z pustyni. Tej nocy Dawid i Abiszaj weszli do śpiącego obozu, znaleźli Saula z włócznią wbitą w ziemię przy głowie, zabrali włócznię i dzban z wodą; z przeciwległego wzgórza Dawid wołał do Abnera i do Saula, a Saul wyznał: „Zgrzeszyłem. Wróćże się, synu mój Dawidzie”. Nazwa wzgórza może znaczyć „ciemne” lub „mroczne”."
    - "Wzgórza nie zidentyfikowano z pewnością. Zif to Tell Zif, około 7 km na południowy wschód od Hebronu, a Jeszimon to pustynia na wschód od niego; Claude Conder w latach siedemdziesiątych XIX w. zaproponował długi grzbiet Dahret el-Kolah, na wschód od Zif nad zejściem ku En-Gedi, na podstawie nazwy, i mapa idzie za nim. Grzbiet jest dziś otwartym pustynnym pastwiskiem w południowych wzgórzach Hebronu, wypasanym przez trzody Beduinów, z widokiem na Morze Martwe na wschodzie."
  it:
    - "Chechilà è una collina nel deserto di Giuda a est di Zif, ai margini della terra spoglia che la Bibbia chiama Iesimon, la landa che scende al Mar Morto. È nominata solo nel racconto della fuga di Davide da Saul. Due volte gli Zifei salirono da Saul a Gabaa per tradirlo: «Davide non sta egli nascosto fra noi, ne’ luoghi forti della foresta, sul colle di Hakila che è a mezzogiorno del deserto?», e ancora: «Davide non sta egli nascosto sulla collina di Hakila dirimpetto al deserto?» La Bibbia sinodale, seguendo l’ebraico, dice che la collina si trovava a destra di Iesimon."
    - "La seconda volta Saul scese con tremila uomini scelti e «si accampò sulla collina di Hakila ch’è dirimpetto al deserto, presso la strada», mentre Davide osservava dal deserto. Quella notte Davide e Abisai entrarono nel campo addormentato, trovarono Saul con la lancia piantata in terra al suo capo, e presero la lancia e la brocca dell’acqua; dalla collina di fronte Davide chiamò Abner e Saul, e Saul confessò: «Ho peccato; torna, figliuol mio Davide». Il nome della collina può significare «scura» od «oscura»."
    - "La collina non è stata identificata con certezza. Zif è Tell Zif, circa 7 km a sud-est di Ebron, e lo Iesimon è il deserto a est di essa; Claude Conder negli anni Settanta dell’Ottocento propose la lunga dorsale di Dhahret el-Kolah, a est di Zif sopra la discesa verso En-Ghedi, in base al nome, e la mappa lo segue. La dorsale è oggi aperto pascolo desertico nelle colline meridionali di Ebron, brucato da greggi beduini, con il Mar Morto in vista a est."
  nl:
    - "Chachila is een heuvel in de woestijn van Juda ten oosten van Zif, aan de rand van het kale land dat de Bijbel Jesimon noemt, de woestenij die naar de Dode Zee afloopt. Zij wordt alleen genoemd in het verhaal van Davids vlucht voor Saul. Tweemaal gingen de Zifieten naar Saul in Gibea om hem te verraden: “Heeft zich niet David bij ons verborgen in de vestingen in het woud, op den heuvel van Hachila, die aan de rechterhand der wildernis is?”, en opnieuw: “Houdt zich David niet verborgen op den heuvel van Hachila, voor aan de wildernis?” De Synodale Bijbel zegt, het Hebreeuws volgend, dat de heuvel rechts van Jesimon lag."
    - "De tweede keer kwam Saul af met drieduizend uitgelezen mannen en “legerde zich op den heuvel van Hachila, die voor aan de wildernis is aan den weg”, terwijl David vanuit de woestijn toekeek. Die nacht liepen David en Abisai het slapende kamp in, vonden Saul met zijn speer in de grond bij zijn hoofd, en namen de speer en de waterkruik; vanaf de heuvel aan de overkant riep David naar Abner en naar Saul, en Saul bekende: “Ik heb gezondigd; keer weder, mijn zoon David”. De naam van de heuvel kan “donker” of “schemerig” betekenen."
    - "De heuvel is niet met zekerheid geïdentificeerd. Zif is Tell Zif, ongeveer 7 km ten zuidoosten van Hebron, en de Jesimon is de woestijn ten oosten ervan; Claude Conder stelde in de jaren zeventig van de 19e eeuw op grond van de naam de lange bergrug Dhahret el-Kolah voor, ten oosten van Zif boven de afdaling naar En-Gedi, en de kaart volgt hem. De rug is nu open woestijnweide in de zuidelijke heuvels van Hebron, begraasd door kudden van bedoeïenen, met de Dode Zee in zicht in het oosten."
  cs:
    - "Chachila je pahorek v judské poušti východně od Zífu, na okraji holé země, kterou Bible nazývá Ješimon, pustiny spadající k Mrtvému moři. Jmenuje se jen v příběhu o Davidově útěku před Saulem. Zifejští dvakrát přišli k Saulovi do Gibeje, aby ho zradili: „Zdaliž David nepokrývá se u nás v horách, v lese, na pahrbku Hachile, kterýž jest na pravé straně pouště“, a podruhé: „Nevíš-liž, že se David kryje na pahrbku Hachila proti poušti?“ Synodální Bible podle hebrejštiny říká, že pahorek ležel napravo od Ješimonu."
    - "Podruhé Saul sestoupil se třemi tisíci vybraných mužů a „položil se … na pahrbku Hachila, kterýž jest proti Jesimon při cestě“, zatímco David sledoval z pouště. Té noci David a Abišaj vešli do spícího tábora, našli Saula s kopím zapíchnutým v zemi u hlavy a vzali kopí a nádobu s vodou; z protějšího pahorku David zavolal na Abnera a na Saula a Saul vyznal: „Zhřešilť jsem, navratiž se, synu můj Davide“. Jméno pahorku může znamenat „tmavý“ nebo „šerý“."
    - "Pahorek nebyl s jistotou ztotožněn. Zíf je Tell Zif, asi 7 km jihovýchodně od Hebronu, a Ješimon je poušť východně od něj; Claude Conder v 70. letech 19. století navrhl dlouhý hřeben Dhahret el-Kolah, východně od Zífu nad sestupem k Én-gedi, na základě jména, a mapa jej následuje. Hřeben je dnes otevřenou pouštní pastvinou v jižních hebronských horách, spásanou beduínskými stády, s Mrtvým mořem na dohled na východě."
