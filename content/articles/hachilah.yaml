body:
  en:
    - "Hachilah is a hill in the wilderness of Ziph in Judah, probably east of the town, on the edge of the bare country the Bible calls Jeshimon, the waste that falls to the Dead Sea. It is named only in the story of David's flight from Saul. Twice the Ziphites went up to Saul at Gibeah to betray him: “Doth not David hide himself with us in strong holds in the wood, in the hill of Hachilah, which is on the south of Jeshimon?”, and again, “Doth not David hide himself in the hill of Hachilah, which is before Jeshimon?” The Hebrew has “on the right”, that is to the south, in the first passage and “facing” in the second."
    - "The second time Saul came down with three thousand chosen men and “pitched in the hill of Hachilah, which is before Jeshimon, by the way”, while David watched from the wilderness. That night David and Abishai walked into the sleeping camp, found Saul with his spear stuck in the ground at his head, and took the spear and the cruse of water; from the hill opposite David called to Abner and to Saul, and Saul confessed, “I have sinned: return, my son David”. The hill's name may mean “dark”."
    - "The hill has not been identified with certainty. Ziph is Tell Zif, about 7 km south-east of Hebron, and the Jeshimon is the desert east of it; Claude Conder of the Survey of Western Palestine proposed the long ridge of Dhahret el-Kolah, east of Ziph above the descent to Engedi, because it fits the biblical description and its name may echo Hachilah, and the map follows him. The ridge today is open desert pasture in the southern Hebron hills, grazed by Bedouin flocks, with the Dead Sea in view to the east."
  ru:
    - "Гахила — холм в пустыне Зиф в Иудее, вероятно к востоку от города, на краю голой земли, которую Библия зовёт Иесимоном, пустоши, спадающей к Мёртвому морю. Он назван только в рассказе о бегстве Давида от Саула. Дважды Зифеи приходили к Саулу в Гиву, чтобы выдать его: «вот, Давид скрывается у нас в неприступных местах, в лесу, на холме Гахила, что направо от Иесимона», и снова: «вот, Давид скрывается у нас на холме Гахила, что направо от Иесимона». Синодальный перевод каждый раз говорит, что холм лежал направо от Иесимона; в еврейском тексте «справа», то есть к югу, стоит только в первом месте, а во втором — «напротив»."
    - "Во второй раз Саул спустился с тремя тысячами отборных мужей и «расположился Саул на холме Гахила, что направо от Иесимона, при дороге», а Давид наблюдал из пустыни. В ту ночь Давид с Авессой вошли в спящий стан, нашли Саула с копьём, воткнутым в землю у изголовья, и взяли копьё и сосуд с водой; с холма напротив Давид окликнул Авенира и Саула, и Саул признал: «согрешил я; возвратись, сын мой Давид». Имя холма может значить «тёмный»."
    - "Холм не опознан с уверенностью. Зиф — это Тель-Зиф примерно в 7 км к юго-востоку от Хеврона, а Иесимон — пустыня к востоку от него; Клод Кондер из «Обзора Западной Палестины» предложил длинный хребет Захрат-эль-Кола к востоку от Зифа над спуском к Ен-Гадди, потому что он подходит к библейскому описанию, а его имя, возможно, перекликается с именем Гахилы, и карта следует ему. Хребет сегодня — открытое пустынное пастбище в южных Хевронских горах, где пасут бедуинские стада, а на востоке видно Мёртвое море."
  uk:
    - "Гахіла — пагорб у пустелі Зіф в Юдеї, імовірно на схід від міста, на краю голого краю, який Біблія називає Єшимоном, пустиря, що спадає до Мертвого моря. Він названий лише в історії втечі Давида від Саула. Двічі зифеї ходили до Саула в Гіву, щоб видати Давида: «Давид ховається в нас по неприступних місцях, в лїсї, на верху гори Гахила, що направо від Есимону», і знову: «Чи знаєш ти, що Давид ховається в нас на горі Гахилї, перед пустинею?» У давньоєврейському тексті в першому місці стоїть «праворуч», тобто на південь, а в другому — «навпроти»."
    - "Удруге Саул спустився з трьома тисячами обраних людей і «отаборився Саул на горі Гахилї, що лежить перед пустинею при дорозї», а Давид стежив із пустелі. Тієї ночі Давид і Авішай зайшли в сонний табір, знайшли Саула зі списом, устромленим у землю біля голови, і взяли спис та глечик з водою; з протилежного пагорба Давид гукнув Авеніра й Саула, і Саул визнав: «Провинив я; вернись назад, сину Давиде». Назва пагорба може означати «темний»."
    - "Пагорб не ототожнено з певністю. Зіф — це Телль-Зіф, приблизно за 7 км на південний схід від Хеврона, а Єшимон — пустеля на схід від нього; Клод Кондер із «Survey of Western Palestine» запропонував довгий хребет Захрет-ель-Коля, на схід від Зіфа над спуском до Ен-Геді, бо він відповідає біблійному опису, а його назва, можливо, перегукується з назвою Гахіли, і карта йде за ним. Сьогодні хребет — відкрите пустельне пасовисько в південних хевронських пагорбах, де пасуться отари бедуїнів, з Мертвим морем на виду на сході."
  es:
    - "Haquila es una colina en el desierto de Zif, en Judá, probablemente al este de la ciudad, en el borde del país árido que la Biblia llama Jesimón, el páramo que desciende hacia el mar Muerto. Se nombra solo en la historia de la huida de David ante Saúl. Dos veces subieron los zifeos a Saúl, en Gabaa, para traicionarlo: «¿No está David escondido en nuestra tierra en las peñas del bosque, en el collado de Hachîla que está á la mano derecha del desierto?», y de nuevo: «¿No está David escondido en el collado de Hachîla delante del desierto?». El hebreo tiene «a la derecha», es decir, al sur, en el primer pasaje y «frente a» en el segundo."
    - "La segunda vez Saúl bajó con tres mil hombres escogidos y allí «asentó Saúl el campo en el collado de Hachîla, que está delante del desierto junto al camino», mientras David vigilaba desde el desierto. Aquella noche David y Abisai entraron en el campamento dormido, hallaron a Saúl con su lanza clavada en tierra a la cabecera, y se llevaron la lanza y la vasija de agua; desde la colina de enfrente David llamó a Abner y a Saúl, y Saúl confesó: «He pecado: vuélvete, hijo mío David». El nombre de la colina puede significar «oscura»."
    - "La colina no ha sido identificada con certeza. Zif es Tell Zif, a unos 7 km al sudeste de Hebrón, y el Jesimón es el desierto al este de ella; Claude Conder, del Survey of Western Palestine, propuso la larga loma de Dhahret el-Kolah, al este de Zif, sobre el descenso a Engadi, porque encaja con la descripción bíblica y su nombre puede hacer eco de Haquila, y el mapa lo sigue. Hoy la loma es un pasto abierto del desierto en las colinas del sur de Hebrón, apacentado por rebaños beduinos, con el mar Muerto a la vista hacia el este."
  pt:
    - "Haquilá é uma colina no deserto de Zife, em Judá, provavelmente a leste da cidade, na orla da terra árida que a Bíblia chama Jesimom, o ermo que desce para o mar Morto. É nomeada apenas na história da fuga de Davi diante de Saul. Duas vezes os zifeus subiram a Saul, em Gibeá, para traí-lo: “Por acaso Davi não está escondido entre nós, nas fortalezas de Horesa, na colina de Haquila, que fica ao sul do deserto?”, e de novo: “Davi não está escondido na colina de Haquila, em frente ao deserto?” O hebraico tem “à direita”, isto é, ao sul, na primeira passagem e “em frente de” na segunda."
    - "Na segunda vez Saul desceu com três mil homens escolhidos e “acampou na colina de Haquila, que fica em frente ao deserto, junto à estrada”, enquanto Davi observava do deserto. Naquela noite Davi e Abisai entraram no acampamento adormecido, acharam Saul com a lança cravada no chão à cabeceira, e levaram a lança e a jarra de água; da colina em frente Davi chamou Abner e Saul, e Saul confessou: “Pequei. Volte, meu filho Davi”. O nome da colina pode significar “escura”."
    - "A colina não foi identificada com certeza. Zife é Tell Zif, a cerca de 7 km a sudeste de Hebrom, e o Jesimom é o deserto a leste dela; Claude Conder, do Survey of Western Palestine, propôs a longa crista de Dhahret el-Kolah, a leste de Zife, acima da descida para En-Gedi, porque ela se ajusta à descrição bíblica e o seu nome pode ecoar Haquilá, e o mapa o segue. A crista é hoje pasto aberto de deserto nas colinas de Hebrom do sul, percorrido por rebanhos de beduínos, com o mar Morto à vista a leste."
  de:
    - "Hachila ist ein Hügel in der Wüste Sif in Juda, wahrscheinlich östlich der Stadt, am Rand des kahlen Landes, das die Bibel Jeschimon nennt, der Einöde, die zum Toten Meer abfällt. Er wird nur in der Geschichte von Davids Flucht vor Saul genannt. Zweimal gingen die Sifiter zu Saul nach Gibea hinauf, um David zu verraten: „Ist nicht David bei uns verborgen an sicherem Ort in der Heide, auf dem Hügel Hachila, der zur Rechten liegt an der Wüste?“, und noch einmal: „Ist nicht David verborgen auf dem Hügel Hachila vor der Wüste?“ Das Hebräische hat an der ersten Stelle „zur Rechten“, also im Süden, und an der zweiten „gegenüber“."
    - "Beim zweiten Mal kam Saul mit dreitausend auserwählten Männern herab und „lagerte sich auf dem Hügel Hachila, der vor der Wüste liegt am Wege“, während David aus der Wüste zusah. In jener Nacht gingen David und Abisai in das schlafende Lager, fanden Saul mit seinem Speer, der an seinem Kopf in der Erde steckte, und nahmen Speer und Wasserkrug; vom gegenüberliegenden Hügel rief David Abner und Saul an, und Saul bekannte: „Ich habe gesündigt, komm wieder, mein Sohn David“. Der Name des Hügels bedeutet vielleicht „dunkel“."
    - "Der Hügel ist nicht sicher identifiziert. Sif ist Tell Zif, etwa 7 km südöstlich von Hebron, und Jeschimon ist die Wüste östlich davon; Claude Conder vom Survey of Western Palestine schlug den langen Höhenzug Dhahret el-Kolah vor, östlich von Sif über dem Abstieg nach En-Gedi, weil er zur biblischen Beschreibung passt und sein Name an Hachila anklingen mag, und die Karte folgt ihm. Der Höhenzug ist heute offenes Wüstenweideland in den südlichen Hebroner Bergen, von Beduinenherden beweidet, mit dem Toten Meer im Blick nach Osten."
  fr:
    - "Hakila est une colline du désert de Ziph, en Juda, probablement à l’est de la ville, en lisière de la région nue que la Bible appelle Jeschimon, la solitude qui descend vers la mer Morte. Elle n’est nommée que dans l’histoire de la fuite de David devant Saül. À deux reprises, les Ziphiens montèrent auprès de Saül à Guibea pour le trahir : « David n’est-il pas caché parmi nous dans des lieux forts, dans la forêt, sur la colline de Hakila, qui est au midi du désert ? », puis : « David n’est-il pas caché sur la colline de Hakila, en face du désert ? » L’hébreu porte « à droite », c’est-à-dire au sud, dans le premier passage, et « en face » dans le second."
    - "La seconde fois, Saül descendit avec trois mille hommes d’élite et « campa sur la colline de Hakila, en face du désert, près du chemin », tandis que David observait depuis le désert. Cette nuit-là, David et Abischaï entrèrent dans le camp endormi, trouvèrent Saül avec sa lance plantée en terre à son chevet, et prirent la lance et la cruche d’eau ; depuis la colline d’en face, David appela Abner et Saül, et Saül confessa : « J’ai péché ; reviens, mon fils David ». Le nom de la colline peut signifier « sombre »."
    - "La colline n’a pas été identifiée avec certitude. Ziph est Tell Zif, à environ 7 km au sud-est d’Hébron, et le Jeschimon est le désert à l’est ; Claude Conder, du Survey of Western Palestine, proposa la longue crête de Dhahret el-Kolah, à l’est de Ziph, au-dessus de la descente vers En-Guédi, parce qu’elle s’accorde avec la description biblique et que son nom pourrait faire écho à Hakila, et la carte le suit. La crête est aujourd’hui un pâturage désertique ouvert dans les collines d’Hébron méridionales, parcouru par les troupeaux bédouins, avec la mer Morte en vue à l’est."
  pl:
    - "Chakila to wzgórze na pustyni Zif w Judzie, prawdopodobnie na wschód od miasta, na skraju nagiej krainy, którą Biblia nazywa Jeszimon, pustkowiem opadającym ku Morzu Martwemu. Jest wymienione tylko w opowieści o ucieczce Dawida przed Saulem. Dwukrotnie Zifejczycy poszli do Saula do Gibei, by go zdradzić: „Azaż Dawid nie kryje się u nas po miejscach obronnych w lesie na pagórku Hachila, który jest po prawej stronie Jesymona?”, i ponownie: „Izali się nie kryje Dawid na pagórku Hachila, przeciw Jesymon?”. Hebrajski ma „po prawej”, czyli na południe, w pierwszym miejscu, a w drugim „naprzeciw”."
    - "Za drugim razem Saul zszedł z trzema tysiącami wybranych mężów, a „położył się Saul obozem na pagórku Hachila, które jest przeciw Jesymon podle drogi”, podczas gdy Dawid obserwował z pustyni. Tej nocy Dawid i Abiszaj weszli do śpiącego obozu, znaleźli Saula z włócznią wbitą w ziemię przy głowie, zabrali włócznię i dzban z wodą; z przeciwległego wzgórza Dawid wołał do Abnera i do Saula, a Saul wyznał: „Zgrzeszyłem. Wróćże się, synu mój Dawidzie”. Nazwa wzgórza może znaczyć „ciemne”."
    - "Wzgórza nie zidentyfikowano z pewnością. Zif to Tell Zif, około 7 km na południowy wschód od Hebronu, a Jeszimon to pustynia na wschód od niego; Claude Conder z Survey of Western Palestine zaproponował długi grzbiet Dahret el-Kolah, na wschód od Zif nad zejściem ku En-Gedi, bo pasuje on do biblijnego opisu, a jego nazwa może być echem Chakili, i mapa idzie za nim. Grzbiet jest dziś otwartym pustynnym pastwiskiem w południowych wzgórzach Hebronu, wypasanym przez trzody Beduinów, z widokiem na Morze Martwe na wschodzie."
  it:
    - "Chechilà è una collina nel deserto di Zif, in Giuda, probabilmente a est della città, ai margini della terra spoglia che la Bibbia chiama Iesimon, la landa che scende al Mar Morto. È nominata solo nel racconto della fuga di Davide da Saul. Due volte gli Zifei salirono da Saul a Gabaa per tradirlo: «Davide non sta egli nascosto fra noi, ne’ luoghi forti della foresta, sul colle di Hakila che è a mezzogiorno del deserto?», e ancora: «Davide non sta egli nascosto sulla collina di Hakila dirimpetto al deserto?» L’ebraico ha «a destra», cioè a sud, nel primo passo e «di fronte» nel secondo."
    - "La seconda volta Saul scese con tremila uomini scelti e «si accampò sulla collina di Hakila ch’è dirimpetto al deserto, presso la strada», mentre Davide osservava dal deserto. Quella notte Davide e Abisai entrarono nel campo addormentato, trovarono Saul con la lancia piantata in terra al suo capo, e presero la lancia e la brocca dell’acqua; dalla collina di fronte Davide chiamò Abner e Saul, e Saul confessò: «Ho peccato; torna, figliuol mio Davide». Il nome della collina può significare «scura»."
    - "La collina non è stata identificata con certezza. Zif è Tell Zif, circa 7 km a sud-est di Ebron, e lo Iesimon è il deserto a est di essa; Claude Conder, del Survey of Western Palestine, propose la lunga dorsale di Dhahret el-Kolah, a est di Zif sopra la discesa verso En-Ghedi, perché si accorda con la descrizione biblica e il suo nome potrebbe riecheggiare Chechilà, e la mappa lo segue. La dorsale è oggi aperto pascolo desertico nelle colline meridionali di Ebron, brucato da greggi beduini, con il Mar Morto in vista a est."
  nl:
    - "Chachila is een heuvel in de woestijn van Zif in Juda, waarschijnlijk ten oosten van de stad, aan de rand van het kale land dat de Bijbel Jesimon noemt, de woestenij die naar de Dode Zee afloopt. Zij wordt alleen genoemd in het verhaal van Davids vlucht voor Saul. Tweemaal gingen de Zifieten naar Saul in Gibea om hem te verraden: “Heeft zich niet David bij ons verborgen in de vestingen in het woud, op den heuvel van Hachila, die aan de rechterhand der wildernis is?”, en opnieuw: “Houdt zich David niet verborgen op den heuvel van Hachila, voor aan de wildernis?” Het Hebreeuws heeft “rechts”, dat is ten zuiden, in de eerste passage en “tegenover” in de tweede."
    - "De tweede keer kwam Saul af met drieduizend uitgelezen mannen en “legerde zich op den heuvel van Hachila, die voor aan de wildernis is aan den weg”, terwijl David vanuit de woestijn toekeek. Die nacht liepen David en Abisai het slapende kamp in, vonden Saul met zijn speer in de grond bij zijn hoofd, en namen de speer en de waterkruik; vanaf de heuvel aan de overkant riep David naar Abner en naar Saul, en Saul bekende: “Ik heb gezondigd; keer weder, mijn zoon David”. De naam van de heuvel kan “donker” betekenen."
    - "De heuvel is niet met zekerheid geïdentificeerd. Zif is Tell Zif, ongeveer 7 km ten zuidoosten van Hebron, en de Jesimon is de woestijn ten oosten ervan; Claude Conder van de Survey of Western Palestine stelde de lange bergrug Dhahret el-Kolah voor, ten oosten van Zif boven de afdaling naar En-Gedi, omdat die past bij de bijbelse beschrijving en de naam misschien aan Chachila herinnert, en de kaart volgt hem. De rug is nu open woestijnweide in de zuidelijke heuvels van Hebron, begraasd door kudden van bedoeïenen, met de Dode Zee in zicht in het oosten."
  cs:
    - "Chachila je pahorek na poušti Zíf v Judsku, pravděpodobně východně od města, na okraji holé země, kterou Bible nazývá Ješimon, pustiny spadající k Mrtvému moři. Jmenuje se jen v příběhu o Davidově útěku před Saulem. Zifejští dvakrát přišli k Saulovi do Gibeje, aby ho zradili: „Zdaliž David nepokrývá se u nás v horách, v lese, na pahrbku Hachile, kterýž jest na pravé straně pouště“, a podruhé: „Nevíš-liž, že se David kryje na pahrbku Hachila proti poušti?“ Hebrejština má „napravo“, tedy na jih, v prvním místě a ve druhém „naproti“."
    - "Podruhé Saul sestoupil se třemi tisíci vybraných mužů a „položil se … na pahrbku Hachila, kterýž jest proti Jesimon při cestě“, zatímco David sledoval z pouště. Té noci David a Abišaj vešli do spícího tábora, našli Saula s kopím zapíchnutým v zemi u hlavy a vzali kopí a nádobu s vodou; z protějšího pahorku David zavolal na Abnera a na Saula a Saul vyznal: „Zhřešilť jsem, navratiž se, synu můj Davide“. Jméno pahorku může znamenat „tmavý“."
    - "Pahorek nebyl s jistotou ztotožněn. Zíf je Tell Zif, asi 7 km jihovýchodně od Hebronu, a Ješimon je poušť východně od něj; Claude Conder ze Survey of Western Palestine navrhl dlouhý hřeben Dhahret el-Kolah, východně od Zífu nad sestupem k Én-gedi, protože odpovídá biblickému popisu a jeho jméno snad připomíná Chachilu, a mapa jej následuje. Hřeben je dnes otevřenou pouštní pastvinou v jižních hebronských horách, spásanou beduínskými stády, s Mrtvým mořem na dohled na východě."
  sv:
    - "Hakila är en kulle i Sifs öken i Juda, sannolikt öster om staden, i kanten av det kala landet som Bibeln kallar Jeshimon, ödemarken som stupar mot Döda havet. Den nämns bara i berättelsen om Davids flykt undan Saul. Två gånger gick sifiterna upp till Saul i Giva för att förråda honom: ”David håller sig nu gömd hos oss på bergfästena i Hores, på Hakilahöjden, som ligger söder om ödemarken”, och åter: ”David håller sig nu gömd på Hakilahöjden, gent emot ödemarken.” Hebreiskan har ”till höger”, det vill säga söder om, i det första stället och ”gent emot” i det andra."
    - "Andra gången drog Saul ned med tre tusen utvalda män och ”lägrade sig på Hakilahöjden, som ligger gent emot ödemarken, vid vägen”, medan David iakttog från öknen. Den natten gick David och Avishaj in i det sovande lägret, fann Saul med spjutet nedstött i marken vid huvudgärden och tog spjutet och vattenkruset; från kullen mitt emot ropade David till Avner och till Saul, och Saul bekände: ”Jag har syndat. Kom tillbaka, min son David”. Kullens namn kan betyda ”mörk”."
    - "Kullen har inte identifierats med säkerhet. Sif är Tell Zif, omkring 7 km sydost om Hebron, och Jeshimon är öknen öster om den; Claude Conder vid Survey of Western Palestine föreslog den långa åsen Dhahret el-Kolah, öster om Sif ovanför nedstigningen till En-Gedi, eftersom den passar den bibliska beskrivningen och dess namn kan eka Hakila, och kartan följer honom. Åsen är i dag öppen ökenbetesmark i södra Hebronbergen, betad av beduinernas hjordar, med Döda havet i sikte i öster."
  nb:
    - "Hakila er en høyde i Sifs ørken i Juda, trolig øst for byen, i kanten av det nakne landet Bibelen kaller Jesjimon, ødemarken som faller ned mot Dødehavet. Den nevnes bare i fortellingen om Davids flukt fra Saul. To ganger dro sifittene opp til Saul i Gibea for å forråde ham: «David holder sig skjult hos oss i fjellborgene i skogen, på Kakilahaugen sønnenfor ørkenen», og igjen: «David holder sig skjult på Kakilahaugen, midt imot ørkenen». Det hebraiske har «til høyre», det vil si mot sør, i den første teksten og «foran» i den andre."
    - "Andre gang kom Saul ned med tre tusen utvalgte menn og «leiret sig på Kakilahaugen, midt imot ørkenen, ved veien», mens David så på fra ørkenen. Den natten gikk David og Abisjai inn i den sovende leiren, fant Saul med spydet stukket ned i jorden ved hodet, og tok spydet og vannkrukken; fra høyden på den andre siden ropte David til Abner og til Saul, og Saul bekjente: «Jeg har syndet; kom tilbake, min sønn David!» Høydens navn kan bety «mørk»."
    - "Høyden er ikke identifisert med sikkerhet. Sif er Tell Zif, omtrent 7 km sørøst for Hebron, og Jesjimon er ørkenen øst for det; Claude Conder ved Survey of Western Palestine foreslo den lange ryggen Dhahret el-Kolah, øst for Sif over nedstigningen til En-Gedi, fordi den passer med den bibelske beskrivelsen og navnet kan ekkoe Hakila, og kartet følger ham. Ryggen er i dag åpent ørkenbeite i de sørlige Hebron-åsene, beitet av beduinenes flokker, med Dødehavet i sikte mot øst."
  tl:
    - "Ang Hachila ay burol sa ilang ng Ziph sa Juda, marahil sa silangan ng bayan, sa gilid ng tigang na lupain na tinatawag ng Biblia na Jesimon, ang ilang na pababa sa Dagat na Patay. Binabanggit lamang ito sa salaysay ng pagtakas ni David kay Saul. Makalawang umahon ang mga Zipheo kay Saul sa Gibea upang ipagkanulo siya: “Hindi ba nagkukubli sa amin si David sa mga katibayan sa gubat, sa burol ng Hachila, na nasa timugan ng ilang?”, at muli, “Hindi ba nagtatago si David sa burol ng Hachila, sa tapat ng ilang?” Ang Hebreo ay may “sa kanan”, ibig sabihin sa timog, sa unang talata at “sa tapat” sa ikalawa."
    - "Sa ikalawang pagkakataon ay bumaba si Saul na may tatlong libong piling lalaki at “humantong si Saul sa burol ng Hachila na nasa tapat ng ilang sa tabi ng daan”, habang si David ay nagmamasid mula sa ilang. Nang gabing iyon ay pumasok sina David at Abisai sa natutulog na kampo, natagpuan si Saul na nakatusok ang sibat sa lupa sa ulunan niya, at kinuha ang sibat at ang banga ng tubig; mula sa katapat na burol ay tinawag ni David si Abner at si Saul, at inamin ni Saul: “Ako'y nagkasala: bumalik ka, anak kong David”. Maaaring ang pangalan ng burol ay nangangahulugang “madilim”."
    - "Hindi tiyak na natukoy ang burol. Ang Ziph ay ang Tell Zif, mga 7 km sa timog-silangan ng Hebron, at ang Jesimon ay ang disyerto sa silangan nito; iminungkahi ni Claude Conder ng Survey of Western Palestine ang mahabang tagaytay ng Dhahret el-Kolah, sa silangan ng Ziph sa itaas ng daang pababa patungong En-gedi, sapagkat angkop ito sa paglalarawan ng Biblia at maaaring umalingawngaw dito ang pangalang Hachila, at sinusunod siya ng mapa. Ang tagaytay ngayon ay bukas na pastulan sa disyerto sa timog na mga burol ng Hebron, pinapastulan ng mga kawan ng mga Bedouin, na natatanaw ang Dagat na Patay sa silangan."
  da:
    - "Hakila er en høj i Zifs ørken i Juda, sandsynligvis øst for byen, i udkanten af det nøgne land, Bibelen kalder Jesjimon, ødemarken der falder mod Det Døde Hav. Den nævnes kun i fortællingen om Davids flugt fra Saul. To gange gik zifitterne op til Saul i Gibea for at forråde ham: »Har ikke David skjult sig hos os i Befæstningerne i Skoven paa Hakilas Høj, som ligger til højre for Jesimon?«, og igen: »Har ikke David skjult sig paa Hakilas Høj lige for Ørken?« Det hebraiske har »til højre«, det vil sige mod syd, i den første passage og »lige for« i den anden."
    - "Anden gang kom Saul ned med tre tusind udvalgte mænd og »lejrede sig ved Hakilas Høj, som ligger lige for Ørken ved Vejen«, mens David holdt udkig fra ørkenen. Den nat gik David og Abisjaj ind i den sovende lejr, fandt Saul med sit spyd stukket i jorden ved hans hoved og tog spyddet og vandkrukken; fra højen over for kaldte David på Abner og på Saul, og Saul bekendte: »Jeg har syndet, kom tilbage min Søn David«. Højens navn kan betyde »mørk«."
    - "Højen er ikke identificeret med sikkerhed. Zif er Tell Zif, omkring 7 km sydøst for Hebron, og Jesjimon er ørkenen øst for den; Claude Conder fra Survey of Western Palestine foreslog den lange højderyg Dhahret el-Kolah, øst for Zif over nedstigningen til En-Gedi, fordi den passer til den bibelske beskrivelse, og fordi dens navn kan give genlyd af Hakila, og kortet følger ham. Højderyggen er i dag åbent ørkengræsgang i de sydlige Hebron-bjerge, afgræsset af beduinernes hjorde, med Det Døde Hav i sigte mod øst."
  sr:
    - "Хавила је брдо у зифској пустињи у Јуди, вероватно источно од града, на ободу голе земље коју Библија зове Гесимон, пустоши која пада ка Мртвом мору. Именује се само у причи о Давидовом бекству од Саула. Двапут су Зифеји дошли Саулу у Гавају да га издају: „Не крије ли се Давид код нас по тврдим местима у шуми на брду Ехели надесно од Гесимона?“, и поново: „Не крије ли се Давид на брду Ехели према Гесимону?“ Хебрејски има „надесно“, то јест на југу, у првом одломку, а „према“ у другом."
    - "Други пут Саул је сишао с три хиљаде изабраних људи и улогорио се „на брду Ехели према Гесимону крај пута“, док је Давид посматрао из пустиње. Те ноћи Давид и Ависај ушли су у уснули логор, нашли Саула са копљем пободеним у земљу код главе и узели копље и чашу воде; са брда насупрот Давид је дозвао Авенира и Саула, а Саул је признао: „Згрешио сам; врати се, сине Давиде“. Име брда може значити „мрачно“."
    - "Брдо није са сигурношћу утврђено. Зиф је Тел Зиф, око 7 км југоисточно од Хеврона, а Гесимон је пустиња источно од њега; Клод Кондер из Истраживања Западне Палестине предложио је дугачак гребен Дахрет ел-Колах, источно од Зифа изнад силаска ка Енгаду, јер одговара библијском опису и његово име може одјекивати Хавилу, а карта га следи. Гребен је данас отворен пустињски пашњак у јужним хевронским брдима, на коме пасу бедуинска стада, с Мртвим морем на видику на истоку."
  hu:
    - "Hakila domb Júda Zif pusztájában, valószínűleg a várostól keletre, azon a kopár vidék szélén, amelyet a Biblia Jesimónnak nevez, a Holt-tenger felé lejtő pusztaságnak. Csak Dávidnak a Saul elől való menekülése történetében szerepel. A zifeusok kétszer mentek fel Saulhoz Gibeába, hogy elárulják: „Avagy nem nálunk lappang-é Dávid az erős helyeken az erdőben, Hakila halmán, mely a sivatagtól jobbkézre van?!”, majd újra: „Nemde nem a Hakila halmán lappang-é Dávid, a puszta átellenében?” A héber az első szakaszban „jobbkézre”, vagyis délre, a másodikban „átellenében” szót használ."
    - "Másodszor Saul háromezer válogatott emberrel jött le, és „tábort jára Saul a Hakila halmán, mely a puszta átellenében van, az úton”, míg Dávid a pusztából figyelte. Aznap éjjel Dávid és Abisai besétáltak az alvó táborba, megtalálták Sault, lándzsája a földbe szúrva feje mellett, és elvitték a lándzsát és a víztartó korsót; a szemközti dombról Dávid Abnerhez és Saulhoz kiáltott, és Saul bevallotta: „Vétkeztem! térj vissza fiam, Dávid”. A domb neve talán „sötétet” jelent."
    - "A dombot nem azonosították biztosan. Zif Tell Zif, mintegy 7 km-re délkeletre Hebrontól, Jesimón pedig a tőle keletre fekvő puszta; Claude Conder, a Survey of Western Palestine kutatója a Dhahret el-Kolah hosszú gerincét javasolta, Ziftől keletre, az Én-Gedibe vezető lejtő fölött, mert illik a bibliai leíráshoz, neve pedig visszhangozhatja Hakilát, és a térkép őt követi. A gerinc ma nyílt sivatagi legelő a déli hebroni hegyekben, beduin nyájak legelnek rajta, keleten a Holt-tengerre nyíló kilátással."
  fi:
    - "Hakila on kukkula Sifin erämaassa Juudassa, luultavasti kaupungista itään, paljaan maan reunalla, jota Raamattu kutsuu Jesimoniksi, Kuolleellemerelle laskevaksi autiomaaksi. Se mainitaan vain kertomuksessa Daavidin pakenemisesta Saulia. Siifiläiset menivät kahdesti Saulin luo Gibeaan kavaltamaan hänet: ”Daavid piileksii meillä päin, vuorten huipuilla Hooreksessa, Gibeat-Hakilassa, joka on kallioerämaasta etelään”, ja uudelleen: ”Daavid piileksii Gibeat-Hakilassa, kallioerämaan puolella”. Heprea sanoo ensimmäisessä kohdassa ”oikealla”, eli etelässä, ja toisessa ”vastapäätä”."
    - "Toisella kerralla Saul tuli alas kolmentuhannen valitun miehen kanssa ja ”leiriytyi Gibeat-Hakilaan, joka on kallioerämaan puolella tien varrella”, kun Daavid tarkkaili erämaasta. Sinä yönä Daavid ja Abisai kävelivät nukkuvaan leiriin, löysivät Saulin peitsen pystyssä maassa päänsä luona ja ottivat sen ja vesikannun; vastapäisestä kukkulasta Daavid huusi Abnerille ja Saulille, ja Saul tunnusti: ”Minä olen tehnyt syntiä. Tule takaisin, poikani Daavid”. Kukkulan nimi voi merkitä ”tummaa”."
    - "Kukkulaa ei ole tunnistettu varmasti. Sif on Tell Zif, noin 7 km Hebronista kaakkoon, ja Jesimon on sen itäpuolinen autiomaa; Claude Conder Länsi-Palestiinan kartoituksesta ehdotti Dhahret el-Kolahin pitkää harjannetta, Sifistä itään En-Gedin laskeutumisen yläpuolella, koska se sopii Raamatun kuvaukseen ja sen nimi voi kaikua Hakilaa, ja kartta seuraa häntä. Harjanne on nykyään avointa autiomaan laidunta Hebronin eteläisillä kukkuloilla, beduiinien laumojen laiduntamaa, ja idässä näkyy Kuollutmeri."
  vi:
    - "Ha-ki-la là một ngọn đồi trong đồng vắng Xíp ở Giu-đa, có lẽ ở phía đông thành, ở rìa vùng đất trơ trụi mà Kinh Thánh gọi là Giê-si-môn, vùng hoang vu dốc xuống Biển Chết. Nơi này chỉ được nêu tên trong câu chuyện Đa-vít chạy trốn Sau-lơ. Hai lần người Xíp đi lên với Sau-lơ tại Ghi-bê-a để phản Đa-vít: “Đa-vít ẩn giữa chúng tôi, tại nơi đồn trong rừng, trên gò Ha-ki-la, ở về phía nam của đồng vắng”, và lần nữa, “Đa-vít há chẳng ẩn tại trên gò Ha-ki-la, đối ngang đồng vắng sao?” Tiếng Hê-bơ-rơ có “bên phải”, tức là phía nam, ở đoạn thứ nhất và “đối diện” ở đoạn thứ hai."
    - "Lần thứ hai Sau-lơ xuống với ba ngàn người chọn lựa và “đóng trại trên gò Ha-ki-la, đối ngang đồng vắng, tại nơi đầu đường”, trong khi Đa-vít quan sát từ đồng vắng. Đêm đó Đa-vít và A-bi-sai đi vào trại đang ngủ, thấy Sau-lơ nằm với ngọn giáo cắm xuống đất bên đầu, và lấy ngọn giáo cùng bình nước; từ ngọn đồi đối diện, Đa-vít gọi Áp-ne và Sau-lơ, và Sau-lơ thú nhận: “Ta có phạm tội; hỡi Đa-vít, con ta, hãy trở lại!” Tên của ngọn đồi có thể có nghĩa là “tối tăm”."
    - "Ngọn đồi chưa được xác định chắc chắn. Xíp là Tell Zif, cách Hếp-rôn khoảng 7 km về phía đông nam, và Giê-si-môn là sa mạc phía đông của nó; Claude Conder của Khảo sát Tây Palestine đề nghị sống đồi dài Dhahret el-Kolah, phía đông Xíp, trên lối xuống Ên-ghê-đi, vì nó khớp với mô tả Kinh Thánh và tên có thể vang vọng Ha-ki-la, và bản đồ theo ông. Ngày nay sống đồi là đồng cỏ sa mạc rộng mở trong các đồi Hếp-rôn phía nam, có đàn gia súc Bedouin gặm cỏ, nhìn ra Biển Chết ở phía đông."
  ro:
    - "Hachila este un deal din pustia Zifului, în Iuda, probabil la est de oraș, la marginea ținutului gol pe care Biblia îl numește Ieșimon, pustietatea care coboară spre Marea Moartă. Este numit doar în povestea fugii lui David de Saul. De două ori zifeii s-au dus la Saul, la Ghibea, ca să-l trădeze: „iată David s’a ascuns la noi în Mesara în strâmtori, în pustie în dealul lui Ehela deadreapta Iesemonului”, și din nou: „iată David este ascuns la noi în dealul Ehelat de către fața Iesemului”. Ebraica are „deadreapta”, adică la sud, în primul pasaj și „de către fața” în al doilea."
    - "A doua oară Saul a coborât cu trei mii de bărbați aleși și „a tăbărît ... în dealul Ehelat în fața Iesemului lângă cale”, în timp ce David privea din pustie. În noaptea aceea, David și Abișai au intrat în tabăra adormită, l-au găsit pe Saul cu sulița înfiptă în pământ la căpătâi și au luat sulița și vasul cu apă; de pe dealul din față, David i-a strigat lui Abner și lui Saul, iar Saul a mărturisit: „păcătuit-am, întoarce-te fiule David!” Numele dealului poate însemna „întunecat”."
    - "Dealul nu a fost identificat cu certitudine. Zif este Tell Zif, la circa 7 km spre sud-est de Hebron, iar Ieșimonul este deșertul din estul lui; Claude Conder, de la Survey of Western Palestine, a propus lunga creastă Dhahret el-Kolah, la est de Zif, deasupra coborârii spre En-Ghedi, pentru că se potrivește cu descrierea biblică și numele ei poate repeta Hachila, iar harta îl urmează. Creasta este astăzi pășune deschisă de deșert în dealurile Hebronului de sud, pășunată de turmele beduinilor, cu Marea Moartă la vedere spre est."
  bg:
    - "Хахила е хълм в Зифската пустиня в Юдея, вероятно на изток от града, на края на голата земя, която Библията нарича Йесимон — пустошта, която се спуска към Мъртво море. Тя се назовава само в разказа за бягството на Давид от Саул. Два пъти зифците отидоха при Саул в Гива, за да го предадат: „Не е ли скрит Давид у нас в крепки места вътре в дъбравата, на хълма Ехела, който е към юг от Иесимон?“, и отново: „Не крие ли се Давид в хълма Ехела срещу Иесимон?“ Еврейският текст има в първия пасаж „отдясно“, тоест на юг, а във втория — „срещу“."
    - "Вторият път Саул слезе с три хиляди избрани мъже и „разположи стана си... на хълма Ехела който е срещу Иесимон, при пътя“, докато Давид наблюдаваше от пустинята. През нощта Давид и Авеса влязоха в заспалия стан, намериха Саул с копието му, забито в земята при главата му, и взеха копието и кърчага с вода; от хълма отсреща Давид извика към Авенир и към Саул, а Саул призна: „Съгреших; върни се, чадо мое Давиде“. Името на хълма може да означава „тъмен“."
    - "Хълмът не е идентифициран със сигурност. Зиф е Тел Зиф, на около 7 км югоизточно от Хеврон, а Йесимон е пустинята на изток от него; Клод Кондър от Проучването на Западна Палестина предложи дългия хребет Дахрет ел-Кола, източно от Зиф над спускането към Ен-Гади, защото отговаря на библейското описание и името му може да отеква Хахила, и картата следва него. Днес хребетът е открито пустинно пасище в южните Хевронски хълмове, където пасат бедуински стада, с изглед към Мъртво море на изток."
