body:
  en:
    - "The tower of Edar, Hebrew Migdal Eder, “tower of the flock”, stood somewhere beyond Rachel's grave, on the way to Bethlehem: after Rachel died and “was buried in the way to Ephrath, which is Beth-lehem”, “Israel journeyed, and spread his tent beyond the tower of Edar.” It was probably a watchtower for shepherds' flocks. Its site is unknown. Christian tradition, recorded by Jerome, placed it close to Bethlehem by the fields where the shepherds of Luke heard the angels, and the map follows this tradition at Shepherds' Field in Beit Sahur."
    - "Micah addresses Jerusalem as “O tower of the flock, the strong hold of the daughter of Zion, unto thee shall it come, even the first dominion”. Jewish tradition, in the Targum Pseudo-Jonathan on Genesis 35:21, expected the Messiah to be revealed at Migdal Eder; Alfred Edersheim, citing it, placed this tower close to Bethlehem on the road to Jerusalem and read the Mishnah, which counts animals found between Jerusalem and Migdal Eder as offerings, to mean that Temple flocks were pastured there; most modern scholars see in Micah's phrase simply a title of Zion, and the Mishnah uses Migdal Eder only to mark a distance from Jerusalem."
  ru:
    - "Башня Гадер, по-еврейски Мигдал-Эдер, «башня стада», стояла где-то за гробницей Рахили, на пути к Вифлеему: после того как Рахиль умерла и её погребли «на дороге в Ефрафу, то есть Вифлеем», Израиль «раскинул шатер свой за башнею Гадер». Вероятно, это была сторожевая башня пастухов. Её место неизвестно. Христианское предание, записанное Иеронимом, помещало её возле Вифлеема, у полей, где пастухи из Евангелия от Луки услышали ангелов, и карта следует этому преданию на Пастушьем поле в Бейт-Сахуре."
    - "Михей обращается к Иерусалиму: «А ты, башня стада, холм дщери Сиона! к тебе придет и возвратится прежнее владычество». Иудейское предание, в Таргуме Псевдо-Ионафана на Быт 35:21, ожидало, что Мессия откроется у Мигдал-Эдера; Альфред Эдершейм, ссылаясь на него, помещал эту башню возле Вифлеема на дороге в Иерусалим и читал Мишну, которая считает животных, найденных между Иерусалимом и Мигдал-Эдером, жертвенными, как свидетельство, что там паслись храмовые стада; большинство современных учёных видят в словах Михея просто имя Сиона, а Мишна упоминает Мигдал-Эдер лишь как меру расстояния от Иерусалима."
  cs:
    - "Věž Eder, hebrejsky Migdal Eder, „věž stáda“, stála kdesi za Rácheliným hrobem, na cestě k Betlému: poté, co Ráchel zemřela a „pochována jest na cestě k Efratě, jenž jest Betlém“, „odebral se odtud Izrael, a rozbil stan svůj za věží Eder.“ Byla to pravděpodobně hlásná věž pro pastýřská stáda. Její poloha není známa. Křesťanská tradice, zaznamenaná Jeronýmem, ji klade blízko Betléma k polím, kde pastýři u Lukáše slyšeli anděly, a mapa tuto tradici sleduje na Poli pastýřů v Bejt Sáhúru."
    - "Micheáš oslovuje Jeruzalém: „A tak ty věže bravná, bašto dcery Sionské, až k tobě přijde, přijde, pravím, panování první.“ Židovská tradice v Targumu Pseudo-Jonatanově ke Genesis 35,21 očekávala, že se Mesiáš zjeví v Migdal Eder; Alfred Edersheim ji citoval a klade tuto věž blízko Betléma na cestě do Jeruzaléma a čte Mišnu, která počítá zvířata nalezená mezi Jeruzalémem a Migdal Eder za oběti, tak, že tam byla pasena chrámová stáda; většina současných badatelů vidí v Micheášově výrazu prostě titul Sijónu a Mišna užívá Migdal Eder jen k vyznačení vzdálenosti od Jeruzaléma."
  uk:
    - "Вежа Гадер, івритом Мігдаль-Едер, «вежа отари», стояла десь за гробом Рахілі, на шляху до Віфлеєма: «Умерла ж Рахеля, і поховано її на шляху до Евфрата, се єсть Бетлегем»; потім «Помандрував же Ізраїль і напяв намета свого за Мигдаль-Єдером». Імовірно, це була сторожова вежа для пастушачих отар. Її місце невідоме. Християнська традиція, записана Єронімом, розміщувала її поблизу Віфлеєма біля полів, де пастухи Луки почули ангелів, і мапа йде за цією традицією в Полі пастухів у Бейт-Сахурі."
    - "Міха звертається до Єрусалима: «А ти, башто стада, ти горбе дочки Сионової, до тебе прийде давна власть». Єврейська традиція в Таргумі Псевдо-Йонатана на Буття 35:21 очікувала, що Месія відкриється в Мігдаль-Едері; Альфред Едершайм, посилаючись на неї, розмістив цю вежу поблизу Віфлеєма на дорозі до Єрусалима й читав Мишну, яка зараховує тварин, знайдених між Єрусалимом і Мігдаль-Едером, до жертв, як вказівку, що храмові отари паслися там; більшість сучасних учених бачать у словах Міхи просто титул Сіону, а Мишна вживає Мігдаль-Едер лише для позначення відстані від Єрусалима."
  pl:
    - "Wieża Eder, hebrajskie Migdal Eder, „wieża trzody”, stała gdzieś za grobem Rachel, na drodze do Betlejem: po śmierci Rachel, która „pogrzebiona jest na drodze ku Efracie; tać jest Betlehem”, „poszedł stamtąd Izrael, i rozbił namiot swój za wieżą Heder”. Była to prawdopodobnie wieża strażnicza dla stad pasterzy. Jej położenie jest nieznane. Tradycja chrześcijańska, zapisana przez Hieronima, umieszczała ją blisko Betlejem, przy polach, na których pasterze u Łukasza usłyszeli aniołów, i mapa idzie za tą tradycją w Polu Pasterzy w Bajt Sahur."
    - "Micheasz zwraca się do Jerozolimy: „wieżo trzody, baszto córki Syońskiej! wiedz, że aż do ciebie przyjdzie; przyjdzie mówię, pierwsze państwo”. Tradycja żydowska, w Targumie Pseudo-Jonatana do Rdz 35,21, oczekiwała objawienia Mesjasza w Migdal Eder; Alfred Edersheim, powołując się na nią, umieścił tę wieżę blisko Betlejem przy drodze do Jerozolimy i czytał Misznę, która zalicza zwierzęta znalezione między Jerozolimą a Migdal Eder jako ofiary, w ten sposób, że stada świątynne pasły się tam; większość współczesnych uczonych widzi w zwrocie Micheasza po prostu tytuł Syjonu, a Miszna używa Migdal Eder tylko do oznaczenia odległości od Jerozolimy."
  es:
    - "La torre de Eder, en hebreo Migdal Eder, «torre del rebaño», se alzaba en algún punto más allá de la tumba de Raquel, en el camino a Belén: después de que Raquel muriera y «fué sepultada en el camino de Ephrata, la cual es Beth-lehem», «partió Israel, y tendió su tienda de la otra parte de Migdaleder». Era probablemente una atalaya para los rebaños de los pastores. Se desconoce su emplazamiento. La tradición cristiana, recogida por Jerónimo, la situó cerca de Belén, junto a los campos donde los pastores de Lucas oyeron a los ángeles, y el mapa sigue esa tradición en el Campo de los Pastores, en Beit Sahur."
    - "Miqueas se dirige a Jerusalén: «oh torre del rebaño, la fortaleza de la hija de Sión vendrá hasta ti: y el señorío primero». La tradición judía, en el Targum Pseudo-Jonatán sobre Génesis 35:21, esperaba que el Mesías se revelara en Migdal Eder; Alfred Edersheim, que la cita, situó esta torre cerca de Belén en el camino de Jerusalén y leyó la Misná, que cuenta como ofrendas los animales hallados entre Jerusalén y Migdal Eder, en el sentido de que los rebaños del Templo pastaban allí; la mayoría de los estudiosos modernos ven en la frase de Miqueas simplemente un título de Sion, y la Misná usa Migdal Eder solo para marcar una distancia desde Jerusalén."
  pt:
    - "A torre de Éder (Edar na Versão King James), em hebraico Migdal Eder, “torre do rebanho”, ficava em algum ponto além do túmulo de Raquel, no caminho para Belém: depois que Raquel morreu e “foi sepultada no caminho para Efrata (também chamada Belém)”, “Israel viajou, e armou sua tenda além da torre de Éder.” Era provavelmente uma torre de vigia para os rebanhos dos pastores. Seu sítio é desconhecido. A tradição cristã, registrada por Jerônimo, a colocava perto de Belém, junto aos campos onde os pastores de Lucas ouviram os anjos, e o mapa segue essa tradição no Campo dos Pastores, em Beit Sahur."
    - "Miqueias se dirige a Jerusalém como “torre do rebanho, colina da filha de Sião”: “a você chegará o antigo domínio”. A tradição judaica, no Targum Pseudo-Jonatã sobre Gênesis 35:21, esperava que o Messias fosse revelado em Migdal Eder; Alfred Edersheim, citando-o, situou esta torre perto de Belém, na estrada para Jerusalém, e leu a Mishná, que conta como ofertas os animais encontrados entre Jerusalém e Migdal Eder, no sentido de que os rebanhos do Templo pastavam ali; a maioria dos estudiosos modernos vê na expressão de Miqueias simplesmente um título de Sião, e a Mishná usa Migdal Eder apenas para marcar uma distância de Jerusalém."
  de:
    - "Der Turm Eder, hebräisch Migdal Eder, „Turm der Herde“, stand irgendwo jenseits von Rahels Grab, auf dem Weg nach Bethlehem: Rahel starb und „ward begraben an dem Wege gen Ephrath, das nun heißt Bethlehem“; danach: „Und Israel zog aus und richtete seine Hütte auf jenseit des Turms Eder.“ Es war wahrscheinlich ein Wachturm für die Herden der Hirten. Seine Lage ist unbekannt. Die christliche Überlieferung, von Hieronymus aufgezeichnet, setzte ihn nahe Bethlehem bei den Feldern an, wo die Hirten des Lukas die Engel hörten, und die Karte folgt dieser Überlieferung am Hirtenfeld in Beit Sahur."
    - "Micha redet Jerusalem an: „Und du, Turm Eder, du Feste der Tochter Zion, zu dir wird kommen und einkehren die vorige Herrschaft“. Die jüdische Überlieferung, im Targum Pseudo-Jonathan zu Genesis 35,21, erwartete, dass der Messias in Migdal Eder offenbar würde; Alfred Edersheim setzte diesen Turm im Anschluss daran nahe Bethlehem an der Straße nach Jerusalem an und verstand die Mischna, die zwischen Jerusalem und Migdal Eder gefundene Tiere als Opfertiere zählt, so, dass dort Tempelherden weideten; die meisten modernen Gelehrten sehen in Michas Wendung einfach einen Titel Zions, und die Mischna gebraucht Migdal Eder nur, um eine Entfernung von Jerusalem zu bezeichnen."
  fr:
    - "La tour d’Édar (Migdal-Éder dans Louis Segond), en hébreu Migdal Eder, « tour du troupeau », se dressait quelque part au-delà du tombeau de Rachel, sur la route de Bethléem : après que Rachel mourut et « fut enterrée sur le chemin d’Éphrata, qui est Bethléhem », « Israël partit ; et il dressa sa tente au-delà de Migdal-Éder. » C’était probablement une tour de guet pour les troupeaux des bergers. Son site est inconnu. La tradition chrétienne, rapportée par Jérôme, la plaçait tout près de Bethléem, près des champs où les bergers de Luc entendirent les anges, et la carte suit cette tradition au Champ des Bergers, à Beit Sahur."
    - "Michée interpelle Jérusalem : « Et toi, tour du troupeau, colline de la fille de Sion, à toi viendra, à toi arrivera l’ancienne domination. » La tradition juive, dans le Targum Pseudo-Jonathan sur Genèse 35:21, attendait que le Messie se révèle à Migdal Eder ; Alfred Edersheim, qui la cite, plaça cette tour tout près de Bethléem, sur la route de Jérusalem, et lut la Mishna, qui compte comme offrandes les bêtes trouvées entre Jérusalem et Migdal Eder, comme signifiant que les troupeaux du Temple y paissaient ; la plupart des savants modernes ne voient dans l’expression de Michée qu’un titre de Sion, et la Mishna n’emploie Migdal Eder que pour marquer une distance depuis Jérusalem."
  it:
    - "La torre di Eder, in ebraico Migdal-Eder, «torre del gregge», sorgeva in qualche punto oltre la tomba di Rachele, sulla via di Betlemme: dopo che Rachele morì e «fu sepolta sulla via di Efrata; cioè di Bethlehem», «Israele si partì, e piantò la sua tenda al di là di Migdal-Eder». Era probabilmente una torre di guardia per le greggi dei pastori. Il suo sito è ignoto. La tradizione cristiana, registrata da Girolamo, la poneva vicino a Betlemme presso i campi dove i pastori di Luca udirono gli angeli, e la carta segue questa tradizione al Campo dei Pastori a Beit Sahur."
    - "Michea si rivolge a Gerusalemme: «torre del gregge, colle della figliuola di Sion, a te verrà, a te verrà l’antico dominio». La tradizione ebraica, nel Targum Pseudo-Gionata su Genesi 35,21, attendeva che il Messia si rivelasse a Migdal-Eder; Alfred Edersheim, citandola, pose questa torre vicino a Betlemme sulla strada per Gerusalemme e lesse la Mishnah, che conta come offerte gli animali trovati tra Gerusalemme e Migdal-Eder, nel senso che là pascolavano le greggi del Tempio; la maggior parte degli studiosi moderni vede nell’espressione di Michea semplicemente un titolo di Sion, e la Mishnah usa Migdal-Eder solo per indicare una distanza da Gerusalemme."
  nl:
    - "De toren van Eder, Hebreeuws Migdal Eder, ‘toren van de kudde’, stond ergens voorbij Rachels graf, aan de weg naar Bethlehem: nadat Rachel was gestorven en “werd begraven aan den weg naar Efrath, hetwelk is Bethlehem”, “verreisde Israel, en hij spande zijn tent op gene zijde van Migdal-Eder.” Het was waarschijnlijk een wachttoren voor de kudden van de herders. De ligging is onbekend. De christelijke overlevering, door Hiëronymus vastgelegd, plaatste hem dicht bij Bethlehem bij de velden waar de herders van Lukas de engelen hoorden, en de kaart volgt die overlevering bij Shepherds' Field in Beit Sahur."
    - "Micha spreekt Jeruzalem aan: “gij Schaapstoren, gij Ofel der dochter Sions! tot u zal komen, ja, daar zal komen de vorige heerschappij”. De Joodse overlevering, in de Targum Pseudo-Jonathan op Genesis 35:21, verwachtte dat de Messias bij Migdal Eder zou worden geopenbaard; Alfred Edersheim plaatste de toren, daarnaar verwijzend, dicht bij Bethlehem aan de weg naar Jeruzalem en las de Misjna, die dieren die tussen Jeruzalem en Migdal Eder worden gevonden als offers rekent, als aanwijzing dat de tempelkudden daar graasden; de meeste moderne geleerden zien in Micha's uitdrukking eenvoudig een titel van Sion, en de Misjna gebruikt Migdal Eder alleen om een afstand vanaf Jeruzalem aan te geven."
  sv:
    - "Tornet Eder, hebreiska Migdal Eder, ”hjordens torn”, stod någonstans bortom Rakels grav, på vägen till Betlehem: Rakel dog och ”blev begraven vid vägen till Efrat, det är Bet-Lehem”, varefter ”Israel bröt upp därifrån och slog upp sitt tält på andra sidan om Herdetornet”. Det var sannolikt ett vakttorn för herdarnas hjordar. Dess läge är okänt. Den kristna traditionen, som Hieronymus återger, placerade det nära Betlehem vid fälten där Lukas herdar hörde änglarna, och kartan följer denna tradition vid Herdarnas fält i Beit Sahur."
    - "Mika vänder sig till Jerusalem: ”du Herdetorn, du dotter Sions kulle, till dig skall det komma, ja, till dig skall det återvända, det forna herradömet”. Den judiska traditionen, i Targum Pseudo-Jonatan till 1 Mos 35:21, väntade att Messias skulle uppenbaras vid Migdal Eder; Alfred Edersheim, som anför den, placerade detta torn nära Betlehem vid vägen till Jerusalem och läste Mishnan, som räknar djur som påträffas mellan Jerusalem och Migdal Eder som offergåvor, så att tempelhjordar betade där; de flesta moderna forskare ser i Mikas uttryck helt enkelt en titel på Sion, och Mishnan använder Migdal Eder bara för att markera ett avstånd från Jerusalem."
  nb:
    - "Tårnet Migdal-Eder, «hjordens tårn», sto et sted bortenfor Rakels grav, på veien til Betlehem: etter at Rakel døde og «blev begravet på veien til Efrat, det er Betlehem», «brøt Israel op igjen og slo op sitt telt bortenfor Migdal-Eder.» Det var trolig et voktertårn for gjeterflokker. Dets sted er ukjent. Den kristne tradisjonen, nedtegnet av Hieronymus, plasserte det nær Betlehem ved markene der Lukas' hyrder hørte englene, og kartet følger denne tradisjonen ved Hyrdemarken i Beit Sahur."
    - "Mika taler til Jerusalem: «Og du hjordens tårn, du Sions datters haug! Til dig skal det nå, ja, det skal komme det forrige herredømme». Jødisk tradisjon, i Targum Pseudo-Jonatan til 1. Mosebok 35,21, ventet at Messias skulle åpenbares ved Migdal-Eder; Alfred Edersheim, som viste til den, plasserte dette tårnet nær Betlehem på veien til Jerusalem og leste Mishnaen, som regner dyr funnet mellom Jerusalem og Migdal-Eder som offerdyr, slik at tempelets flokker beitet der; de fleste moderne forskere ser i Mikas uttrykk bare en tittel på Sion, og Mishnaen bruker Migdal-Eder bare for å markere en avstand fra Jerusalem."
  tl:
    - "Ang moog ng Eder, sa Hebreo na Migdal Eder, “moog ng kawan”, ay nakatayo sa isang lugar sa kabila ng libingan ni Raquel, sa daan patungong Bethlehem: pagkamatay ni Raquel at “inilibing sa daang patungo sa Ephrata (na siyang Bethlehem)”, “naglakbay si Israel at iniladlad ang kaniyang tolda sa dako pa roon ng moog ng Eder.” Marahil ito ay moog-bantayan para sa kawan ng mga pastol. Hindi alam ang pook nito. Inilagay ito ng tradisyong Kristiyano, na itinala ni Jeronimo, malapit sa Bethlehem sa tabi ng mga bukid kung saan narinig ng mga pastol ni Lucas ang mga anghel, at sinusunod ng mapa ang tradisyong ito sa Bukid ng mga Pastol sa Beit Sahur."
    - "Tinutugunan ni Mikas ang Jerusalem: “At ikaw, oh moog ng kawan, na burol ng anak na babae ng Sion, ito sa iyo'y darating, oo, ang dating kapangyarihan ay darating”. Inaasahan ng tradisyong Judio, sa Targum Pseudo-Jonathan sa Genesis 35:21, na ihahayag ang Mesiyas sa Migdal Eder; si Alfred Edersheim, na sumisipi rito, ay naglagay sa moog na ito malapit sa Bethlehem sa daan patungong Jerusalem at binasa ang Mishnah, na nagbibilang ng mga hayop na natagpuan sa pagitan ng Jerusalem at Migdal Eder bilang mga handog, na nangangahulugang pinapastulan doon ang mga kawan ng Templo; itinuturing ng karamihan sa mga makabagong iskolar ang pariralang ito ni Mikas bilang pamagat lamang ng Sion, at ginagamit ng Mishnah ang Migdal Eder upang markahan lamang ang layo mula sa Jerusalem."
  da:
    - "Tårnet Eder, hebraisk Migdal Eder, »hjordens tårn«, stod et sted hinsides Rakels grav, på vejen til Betlehem: Efter at Rakel var død og »blev begraven paa Vejen til Efrat, det er Bethlehem«, »Israel rejste derfra og opslog sit Telt paa hin Side Migdal Eder«. Det var sandsynligvis et vagttårn for hyrdernes hjorde. Dets sted er ukendt. Kristen tradition, optegnet af Hieronymus, placerede det tæt ved Betlehem ved de marker, hvor Lukas' hyrder hørte englene, og kortet følger denne tradition ved Hyrdemarken i Beit Sahur."
    - "Mika tiltaler Jerusalem: »Og du, Hyrdetaarn, Zions Datters Høj! til dig skal det komme; ja, komme skal det tidligere Herredømme«. Den jødiske tradition i Targum Pseudo-Jonatan til 1 Mos 35,21 ventede, at Messias skulle åbenbares ved Migdal Eder; Alfred Edersheim, der citerer den, placerede dette tårn tæt ved Betlehem på vejen til Jerusalem og læste Mishnaen, som regner dyr, der findes mellem Jerusalem og Migdal Eder, som ofre, således at tempelflokke græssede dér; de fleste moderne forskere ser i Mikas udtryk blot en titel for Zion, og Mishnaen bruger kun Migdal Eder til at markere en afstand fra Jerusalem."
