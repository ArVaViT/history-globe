# Overview article (ADR 0007). Migdal Eder near Bethlehem is unlocated; the map's point at Shepherds' Field (Beit Sahur) follows the Christian tradition from Jerome; the Targum's Messiah at Migdal Eder and Edersheim's reading of Mishnah Shekalim 7.4 are shown with the objection to them.
id: eder
place: ab80fa1
