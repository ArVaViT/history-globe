# Overview article (ADR 0007). Mainstream facts only; the revolt against Athens is dated 428-427 BC, Pompey's grant of freedom 62 BC.
id: mitylene
place: a33910d
title:
  en: "Mitylene"
  ru: "Митилина"
  uk: "Мітилена"
  es: "Mitilene"
  pt: "Mitilene"
  de: "Mitylene"
  fr: "Mytilène"
  it: "Mitilene"
  nl: "Mitylene"
