body:
  en:
    - "Mitylene (Mytilene) was the chief city of Lesbos, the large island off the coast of north-west Asia Minor. It stood on the south-east coast of the island, facing the mainland, and Strabo notes that it had two harbours. Around 600 BC it was the city of the poets Sappho and Alcaeus and of Pittacus, one of the Seven Sages, who was chosen to rule it for ten years. The modern town of Mytilene, on the same site, is the capital of Lesbos and of the North Aegean region of Greece."
    - "On the way to Jerusalem at the end of his third journey, Paul walked overland from Troas to Assos while his companions went round by sea: “And when he met with us at Assos, we took him in, and came to Mitylene.” The ship seems to have spent the night there, for the next day it sailed on and “came the next day over against Chios”. Paul was hurrying to be at Jerusalem for Pentecost, which is why the ship passed by Ephesus. This is the only mention of the city in the Bible."
    - "In 428 BC Mitylene revolted from Athens. Thucydides tells how the Athenian assembly voted to kill all the men and enslave the women and children, then repented the next day, after the debate between Cleon and Diodotus, and sent a second ship that arrived just in time; the leaders of the revolt were still put to death and the city's walls were pulled down and its fleet taken. In the first century BC the young Julius Caesar won the civic crown at the storming of Mitylene. Pompey, says Plutarch, gave the city its freedom for the sake of its citizen Theophanes, his friend and historian, and was so pleased with its theatre that he had plans made of it to build a larger one in Rome. Part of the ancient theatre survives on the hill above the town."
  ru:
    - "Митилина (Митилини) — главный город Лесбоса, большого острова у побережья северо-западной Малой Азии. Она стояла на юго-восточном берегу острова, против материка, и Страбон отмечает, что у неё было две гавани. Около 600 г. до н. э. это был город поэтов Сапфо и Алкея и Питтака, одного из Семи мудрецов, которого избрали править городом на десять лет. Нынешний город Митилини на том же месте — столица Лесбоса и области Северные Эгейские острова в Греции."
    - "Возвращаясь в Иерусалим в конце третьего путешествия, Павел пошёл пешком из Троады в Асс, а его спутники обогнули мыс морем: «Когда же он сошелся с нами в Ассе, то, взяв его, мы прибыли в Митилину». Корабль, по-видимому, переночевал там, и на следующий день, по словам Луки, «мы остановились против Хиоса». Павел спешил быть в Иерусалиме ко дню Пятидесятницы, поэтому корабль миновал Ефес. Это единственное упоминание города в Библии."
    - "В 428 г. до н. э. Митилина отпала от Афин. Фукидид рассказывает, как афинское народное собрание постановило перебить всех мужчин, а женщин и детей обратить в рабство, но на следующий день, после спора Клеона и Диодота, раскаялось и послало второй корабль, который успел вовремя; зачинщиков восстания всё же казнили, а стены города срыли и флот его отняли. В I в. до н. э. молодой Юлий Цезарь получил гражданский венок при штурме Митилины. Помпей, по словам Плутарха, даровал городу свободу ради его гражданина Феофана, своего друга и историка, и так восхитился его театром, что велел снять с него планы, чтобы построить в Риме больший. Часть древнего театра сохранилась на холме над городом."
  uk:
    - "Мітилена (Мітіліні) була головним містом Лесбосу, великого острова біля узбережжя північно-західної Малої Азії. Вона стояла на південно-східному березі острова, зверненому до материка, і Страбон зазначає, що вона мала дві гавані. Близько 600 р. до н. е. це було місто поетів Сапфо й Алкея та Пітака, одного з Семи мудреців, якого обрали правити нею десять років. Сучасне місто Мітіліні на тому самому місці — столиця Лесбосу й Північно-Егейського регіону Греції."
    - "Дорогою до Єрусалима наприкінці третьої подорожі Павло пішов суходолом з Троади до Ассоса, тоді як його супутники обійшли морем: «Як же зійшов ся з нами в Асонї, узявши його, прибули ми в Митилену.» Здається, корабель провів там ніч, бо далі Лука пише: «причалили ми другого дня проти Хиоса». Павло поспішав бути в Єрусалимі на П'ятидесятницю, тому корабель і минув Ефес. Це єдина згадка про місто в Біблії."
    - "428 р. до н. е. Мітилена повстала проти Афін. Фукідід розповідає, як афінські збори проголосували вбити всіх чоловіків, а жінок і дітей обернути на рабів, а наступного дня схаменулися після суперечки між Клеоном і Діодотом і послали другий корабель, що прибув якраз вчасно; ватажків повстання все ж стратили, а мури міста зруйнували й флот його забрали. У I ст. до н. е. молодий Юлій Цезар здобув громадянський вінок під час штурму Мітилени. Помпей, за Плутархом, дарував місту свободу заради його громадянина Феофана, свого друга й історика, і був такий задоволений його театром, що наказав зняти з нього плани, щоб збудувати більший у Римі. Частина давнього театру збереглася на пагорбі над містом."
  es:
    - "Mitilene (Mytilene) fue la ciudad principal de Lesbos, la gran isla frente a la costa del noroeste de Asia Menor. Se alzaba en la costa sureste de la isla, frente al continente, y Estrabón observa que tenía dos puertos. Hacia 600 a. C. fue la ciudad de los poetas Safo y Alceo y de Pítaco, uno de los Siete Sabios, a quien eligieron para gobernarla durante diez años. La ciudad moderna de Mitilene, en el mismo lugar, es la capital de Lesbos y de la región del Egeo Septentrional, en Grecia."
    - "Camino de Jerusalén al final de su tercer viaje, Pablo fue por tierra de Troas a Asón mientras sus compañeros daban la vuelta por mar: «Y como se juntó con nosotros en Assón, tomándole vinimos á Mitilene». Parece que la nave pasó allí la noche, pues al día siguiente siguió su rumbo y «al día siguiente llegamos delante de Chîo». Pablo se apresuraba para estar en Jerusalén por Pentecostés, razón por la cual la nave pasó de largo por Éfeso. Es la única mención de la ciudad en la Biblia."
    - "En 428 a. C. Mitilene se sublevó contra Atenas. Tucídides cuenta que la asamblea ateniense votó dar muerte a todos los hombres y esclavizar a las mujeres y los niños, y que luego, tras el debate entre Cleón y Diódoto, se arrepintió al día siguiente y envió una segunda nave que llegó justo a tiempo; aun así, los jefes de la revuelta fueron ejecutados y se derribaron las murallas de la ciudad y se le quitó su flota. En el siglo I a. C. el joven Julio César ganó la corona cívica en el asalto a Mitilene. Pompeyo, dice Plutarco, concedió la libertad a la ciudad por amor a su ciudadano Teófanes, su amigo e historiador, y quedó tan complacido con su teatro que mandó levantar planos de él para construir uno mayor en Roma. Parte del teatro antiguo se conserva en la colina sobre la ciudad."
  pt:
    - "Mitilene (Mytilene) foi a cidade principal de Lesbos, a grande ilha ao largo da costa do noroeste da Ásia Menor. Ficava na costa sudeste da ilha, de frente para o continente, e Estrabão observa que tinha dois portos. Por volta de 600 a.C. foi a cidade dos poetas Safo e Alceu e de Pítaco, um dos Sete Sábios, que foi escolhido para governá-la por dez anos. A cidade moderna de Mitilene, no mesmo local, é a capital de Lesbos e da região do Egeu Setentrional, na Grécia."
    - "No caminho para Jerusalém ao fim de sua terceira viagem, Paulo foi por terra de Trôade a Assôs enquanto seus companheiros davam a volta por mar: “Quando ele nos encontrou em Assôs, nós o recebemos a bordo e fomos para Mitilene.” O navio parece ter passado ali a noite, pois no dia seguinte seguiu viagem e, como escreve Lucas, “chegamos no dia seguinte diante de Quios”. Paulo tinha pressa de estar em Jerusalém para o Pentecostes, razão pela qual o navio passou ao largo de Éfeso. Esta é a única menção da cidade na Bíblia."
    - "Em 428 a.C. Mitilene se revoltou contra Atenas. Tucídides conta como a assembleia ateniense votou matar todos os homens e escravizar as mulheres e crianças, depois se arrependeu no dia seguinte, após o debate entre Cléon e Diódoto, e enviou um segundo navio que chegou a tempo; os líderes da revolta foram mesmo assim mortos, e os muros da cidade foram derrubados e sua frota tomada. No século I a.C. o jovem Júlio César ganhou a coroa cívica no assalto a Mitilene. Pompeu, diz Plutarco, deu liberdade à cidade por causa de seu cidadão Teófanes, seu amigo e historiador, e ficou tão satisfeito com seu teatro que mandou fazer plantas dele para construir um maior em Roma. Parte do antigo teatro sobrevive na colina acima da cidade."
  de:
    - "Mitylene (Mytilene) war die Hauptstadt von Lesbos, der großen Insel vor der Küste Nordwestkleinasiens. Sie lag an der Südostküste der Insel, dem Festland gegenüber, und Strabon bemerkt, dass sie zwei Häfen hatte. Um 600 v. Chr. war sie die Stadt der Dichter Sappho und Alkaios und des Pittakos, eines der Sieben Weisen, der für zehn Jahre zu ihrem Herrscher gewählt wurde. Die moderne Stadt Mytilini auf demselben Platz ist die Hauptstadt von Lesbos und der griechischen Region Nördliche Ägäis."
    - "Auf dem Weg nach Jerusalem am Ende seiner dritten Reise ging Paulus zu Fuß über Land von Troas nach Assos, während seine Gefährten den Seeweg nahmen: „Als er nun zu uns traf zu Assos, nahmen wir ihn zu uns und kamen gen Mitylene.“ Das Schiff scheint dort die Nacht verbracht zu haben, denn am nächsten Tag fuhr es weiter und sie „kamen des andern Tages hin gegen Chios“. Paulus eilte, zu Pfingsten in Jerusalem zu sein, weshalb das Schiff an Ephesus vorbeifuhr. Dies ist die einzige Erwähnung der Stadt in der Bibel."
    - "428 v. Chr. fiel Mitylene von Athen ab. Thukydides erzählt, wie die athenische Volksversammlung beschloss, alle Männer zu töten und Frauen und Kinder zu versklaven, dies aber am nächsten Tag nach der Debatte zwischen Kleon und Diodotos bereute und ein zweites Schiff sandte, das gerade noch rechtzeitig ankam; die Anführer des Abfalls wurden dennoch hingerichtet, und die Mauern der Stadt wurden niedergerissen und ihre Flotte genommen. Im ersten Jahrhundert v. Chr. gewann der junge Julius Caesar bei der Erstürmung Mitylenes die Bürgerkrone. Pompeius, sagt Plutarch, schenkte der Stadt um ihres Bürgers Theophanes willen, seines Freundes und Geschichtsschreibers, die Freiheit und war von ihrem Theater so angetan, dass er Pläne davon anfertigen ließ, um in Rom ein größeres zu bauen. Ein Teil des antiken Theaters ist auf dem Hügel oberhalb der Stadt erhalten."
  fr:
    - "Mytilène était la ville principale de Lesbos, la grande île au large de la côte nord-ouest de l’Asie Mineure. Elle se dressait sur la côte sud-est de l’île, face au continent, et Strabon note qu’elle avait deux ports. Vers 600 av. J.-C., c’était la ville des poètes Sappho et Alcée et de Pittacos, l’un des Sept Sages, choisi pour la gouverner pendant dix ans. La ville moderne de Mytilène, sur le même site, est la capitale de Lesbos et de la région de l’Égée-Septentrionale, en Grèce."
    - "En route vers Jérusalem à la fin de son troisième voyage, Paul alla à pied de Troas à Assos pendant que ses compagnons faisaient le tour par mer : « Lorsqu’il nous eut rejoints à Assos, nous le prîmes à bord, et nous allâmes à Mytilène. » Le navire semble y avoir passé la nuit, car le lendemain il reprit la mer et « nous arrivâmes le lendemain vis-à-vis de Chios ». Paul se hâtait d’être à Jérusalem pour la Pentecôte, ce qui explique que le navire ait passé devant Éphèse. C’est la seule mention de la ville dans la Bible."
    - "En 428 av. J.-C., Mytilène se révolta contre Athènes. Thucydide raconte que l’assemblée athénienne vota de tuer tous les hommes et de réduire en esclavage les femmes et les enfants, puis se repentit le lendemain, après le débat entre Cléon et Diodote, et envoya un second navire qui arriva juste à temps ; les chefs de la révolte furent tout de même mis à mort et les murs de la ville abattus et sa flotte prise. Au Ier siècle av. J.-C., le jeune Jules César remporta la couronne civique à l’assaut de Mytilène. Pompée, dit Plutarque, rendit la liberté à la ville pour l’amour de son citoyen Théophane, son ami et historien, et fut si content de son théâtre qu’il en fit lever les plans pour en bâtir un plus grand à Rome. Une partie du théâtre antique subsiste sur la colline au-dessus de la ville."
  it:
    - "Mitilene (Mytilene) era la città principale di Lesbo, la grande isola al largo della costa dell’Asia Minore nord-occidentale. Sorgeva sulla costa sud-orientale dell’isola, di fronte alla terraferma, e Strabone nota che aveva due porti. Verso il 600 a.C. fu la città dei poeti Saffo e Alceo e di Pittaco, uno dei Sette Savi, scelto per governarla per dieci anni. La città moderna di Mitilene, sullo stesso sito, è il capoluogo di Lesbo e della regione dell’Egeo settentrionale in Grecia."
    - "Mentre andava a Gerusalemme alla fine del terzo viaggio, Paolo percorse a piedi la strada da Troade ad Asso mentre i suoi compagni facevano il giro per mare: «E avendoci incontrati ad Asso, lo prendemmo con noi, e venimmo a Mitilene». La nave sembra esservi rimasta la notte, perché il giorno dopo ripartì e «arrivammo il giorno dopo dirimpetto a Chio». Paolo aveva fretta di essere a Gerusalemme per la Pentecoste, ed è per questo che la nave passò oltre Efeso. È l’unica menzione della città nella Bibbia."
    - "Nel 428 a.C. Mitilene si ribellò ad Atene. Tucidide racconta come l’assemblea ateniese votò di uccidere tutti gli uomini e di ridurre in schiavitù donne e bambini, poi si pentì il giorno dopo, dopo il dibattito tra Cleone e Diodoto, e mandò una seconda nave che arrivò appena in tempo; i capi della rivolta furono comunque messi a morte e le mura della città furono abbattute e la flotta confiscata. Nel I secolo a.C. il giovane Giulio Cesare vinse la corona civica all’assalto di Mitilene. Pompeo, dice Plutarco, concesse alla città la libertà per amore del suo cittadino Teofane, suo amico e storico, e fu così compiaciuto del suo teatro che ne fece trarre i piani per costruirne uno più grande a Roma. Parte dell’antico teatro sopravvive sulla collina sopra la città."
  nl:
    - "Mitylene (Mytilene) was de hoofdstad van Lesbos, het grote eiland voor de kust van het noordwesten van Klein-Azië. Het lag aan de zuidoostkust van het eiland, tegenover het vasteland, en Strabo merkt op dat het twee havens had. Omstreeks 600 v.Chr. was het de stad van de dichters Sappho en Alcaeus en van Pittacus, een van de Zeven Wijzen, die gekozen werd om er tien jaar te regeren. De moderne stad Mytilene, op dezelfde plaats, is de hoofdstad van Lesbos en van de regio Noord-Egeïsche Eilanden van Griekenland."
    - "Op weg naar Jeruzalem aan het einde van zijn derde reis liep Paulus over land van Troas naar Assos, terwijl zijn metgezellen over zee voeren: “En als hij zich te Assus bij ons gevoegd had, namen wij hem in, en kwamen te Mitylene.” Het schip lijkt er de nacht te hebben doorgebracht, want de volgende dag voer het verder en “kwamen wij den volgenden dag tegen Chios over”. Paulus haastte zich om met Pinksteren in Jeruzalem te zijn, en daarom voer het schip Efeze voorbij. Dit is de enige vermelding van de stad in de Bijbel."
    - "In 428 v.Chr. kwam Mitylene tegen Athene in opstand. Thucydides vertelt hoe de Atheense volksvergadering besloot alle mannen te doden en de vrouwen en kinderen tot slaaf te maken, de volgende dag spijt kreeg, na het debat tussen Cleon en Diodotus, en een tweede schip zond dat nog net op tijd aankwam; de leiders van de opstand werden toch ter dood gebracht en de muren van de stad werden neergehaald en haar vloot genomen. In de eerste eeuw v.Chr. won de jonge Julius Caesar de burgerkroon bij de bestorming van Mitylene. Pompeius, zegt Plutarchus, schonk de stad haar vrijheid ter wille van haar burger Theophanes, zijn vriend en geschiedschrijver, en was zo verrukt van haar theater dat hij er plattegronden van liet maken om in Rome een groter te bouwen. Een deel van het antieke theater is bewaard op de heuvel boven de stad."
  pl:
    - "Mityleny (Mytilene) były głównym miastem Lesbos, dużej wyspy u wybrzeży północno-zachodniej Azji Mniejszej. Leżały na południowo-wschodnim wybrzeżu wyspy, zwrócone ku lądowi, a Strabon zauważa, że miały dwa porty. Około 600 p.n.e. były miastem poetów Safony i Alkajosa oraz Pittakosa, jednego z Siedmiu Mędrców, którego wybrano, by rządził nimi przez dziesięć lat. Współczesne miasto Mityleny, na tym samym miejscu, jest stolicą Lesbos i regionu Wysp Północnego Egejskiego w Grecji."
    - "W drodze do Jerozolimy pod koniec trzeciej podróży Paweł szedł lądem z Troady do Assos, podczas gdy jego towarzysze płynęli morzem naokoło: „A gdy się z nami zszedł w Assonie, wziąwszy go, przyjechaliśmy do Mityleny”. Okręt zdaje się spędzić tam noc, bo następnego dnia popłynął dalej i „drugiego dnia przyszliśmy przeciw Chyju”. Paweł spieszył się, by być w Jerozolimie na Pięćdziesiątnicę, dlatego okręt minął Efez. Jest to jedyna wzmianka o tym mieście w Biblii."
    - "W 428 p.n.e. Mityleny zbuntowały się przeciw Atenom. Tukidydes opowiada, że zgromadzenie ateńskie uchwaliło zabić wszystkich mężczyzn, a kobiety i dzieci zniewolić, po czym następnego dnia pożałowało tej decyzji, po sporze Kleona z Diodotosem, i wysłało drugi okręt, który przybył w ostatniej chwili; przywódców buntu mimo to stracono, a mury miasta zburzono, a flotę zabrano. W I w. p.n.e. młody Juliusz Cezar zdobył wieniec obywatelski przy szturmie na Mityleny. Pompejusz, według Plutarcha, dał miastu wolność ze względu na jego obywatela Teofanesa, swego przyjaciela i historyka, i tak spodobał mu się tamtejszy teatr, że kazał sporządzić jego plany, by zbudować większy w Rzymie. Część starożytnego teatru zachowała się na wzgórzu nad miastem."
  cs:
    - "Mitylény (Mytiléna) bylo hlavní město Lesbu, velkého ostrova u pobřeží severozápadní Malé Asie. Leželo na jihovýchodním pobřeží ostrova, obráceno k pevnině, a Strabón poznamenává, že mělo dva přístavy. Kolem roku 600 př. n. l. bylo městem básníků Sapfó a Alkaia a Pittaka, jednoho ze Sedmi mudrců, který byl zvolen, aby mu deset let vládl. Dnešní město Mytilene na témže místě je hlavním městem Lesbu a řeckého regionu Severní Egeis."
    - "Na cestě do Jeruzaléma na konci své třetí cesty šel Pavel pěšky z Troady do Assu, zatímco jeho společníci plul kolem po moři: „A když se k nám připojil v Asson, vzavše jej, přijeli jsme do Mitylénu.“ Loď tam zřejmě strávila noc, neboť nazítří plula dál a „druhý den byli jsme proti Chium“. Pavel spěchal, aby byl v Jeruzalémě o letnicích, a proto loď minula Efez. Toto je jediná zmínka o městě v Bibli."
    - "Roku 428 př. n. l. se Mitylény vzbouřily proti Athénám. Thúkydidés vypráví, jak athénské shromáždění odhlasovalo pobít všechny muže a ženy a děti zotročit, pak se druhý den po rozpravě Kleóna s Diodotem lekalo a vyslalo druhou loď, která dorazila právě včas; vůdci povstání byli přesto popraveni a městu byly strženy hradby a odňato loďstvo. V prvním století př. n. l. získal mladý Gaius Julius Caesar při dobývání Mitylén občanský věnec. Pompeius, říká Plútarchos, dal městu svobodu kvůli jeho občanu Theofanovi, svému příteli a dějepisci, a byl tak potěšen jeho divadlem, že si je nechal zakreslit, aby postavil větší v Římě. Část starověkého divadla se zachovala na návrší nad městem."
  sv:
    - "Mytilene var Lesbos huvudstad, den stora ön utanför Mindre Asiens nordvästra kust. Den låg på öns sydöstra kust, vänd mot fastlandet, och Strabon noterar att den hade två hamnar. Omkring 600 f.Kr. var den skaldernas Sapfos och Alkaios' stad och Pittakos', en av de sju vise, som valdes att styra den i tio år. Den moderna staden Mytilene, på samma plats, är huvudstad på Lesbos och i den nordegeiska regionen i Grekland."
    - "På väg till Jerusalem vid slutet av sin tredje resa gick Paulus över land från Troas till Assos medan hans följeslagare tog sjövägen: ”Och när han sammanträffade med oss i Assos, togo vi honom ombord och kommo sedan till Mitylene.” Skeppet tycks ha tillbringat natten där, ty de seglade vidare och ”kommo följande dag mitt för Kios”. Paulus hade bråttom att vara i Jerusalem till pingst, och därför seglade skeppet förbi Efesos. Detta är den enda omnämningen av staden i Bibeln."
    - "År 428 f.Kr. föll Mytilene ifrån Aten. Thukydides berättar hur den atenska folkförsamlingen röstade för att döda alla män och förslava kvinnorna och barnen, sedan ångrade sig nästa dag, efter debatten mellan Kleon och Diodotos, och sände ett andra skepp som kom precis i tid; upprorets ledare avrättades ändå och stadens murar revs och dess flotta togs. Under första århundradet f.Kr. vann den unge Julius Caesar borgarkronan vid stormningen av Mytilene. Pompeius gav, säger Plutarchos, staden dess frihet för dess medborgare Theophanes' skull, hans vän och historiker, och blev så belåten med dess teater att han lät göra ritningar av den för att bygga en större i Rom. En del av den antika teatern finns kvar på kullen ovanför staden."
  nb:
    - "Mitylene (Mytilene) var hovedbyen på Lesbos, den store øya utenfor kysten av nordvestlige Lilleasia. Den lå på sørøstkysten av øya, vendt mot fastlandet, og Strabon bemerker at den hadde to havner. Omkring 600 f.Kr. var den byen til dikterne Sapfo og Alkaios og til Pittakos, en av de sju vise, som ble valgt til å styre den i ti år. Den moderne byen Mytilene, på samme sted, er hovedstad på Lesbos og i regionen Nord-Egeerhavet i Hellas."
    - "På vei til Jerusalem ved slutten av sin tredje reise gikk Paulus over land fra Troas til Assos mens følgesvennene hans gikk rundt til sjøs: «Da han nu møtte oss i Assus, tok vi ham ombord, og kom til Mitylene». Skipet later til å ha tilbrakt natten der, for neste dag seilte det videre og «kom den næste dag bent ut for Kios». Paulus hastet for å være i Jerusalem til pinse, og derfor passerte skipet Efesos. Dette er den eneste omtalen av byen i Bibelen."
    - "I 428 f.Kr. gjorde Mitylene opprør mot Aten. Thukydid forteller hvordan den athenske folkeforsamlingen stemte for å drepe alle mennene og gjøre kvinner og barn til slaver, så angret dagen etter, etter debatten mellom Kleon og Diodotos, og sendte et annet skip som kom akkurat i tide; opprørslederne ble likevel henrettet, og byens murer ble revet og flåten tatt. I det første århundre f.Kr. vant unge Julius Cæsar borgerkransen ved stormingen av Mitylene. Pompeius ga, ifølge Plutarkhos, byen friheten for dens borger Theofanes' skyld, hans venn og historiker, og var så fornøyd med dens teater at han lot tegne planer av det for å bygge et større i Roma. Deler av det antikke teateret er bevart på høyden over byen."
  tl:
    - "Ang Mitilene (Mytilene) ay ang pangunahing lungsod ng Lesbos, ang malaking pulo sa baybayin ng hilagang-kanlurang Asia Minor. Nakatayo ito sa timog-silangang baybayin ng pulo, nakaharap sa kalupaan, at itinatala ni Estrabon na may dalawang daungan ito. Mga 600 BK, ito ang lungsod ng mga makatang sina Sappho at Alcaeus at ni Pittacus, isa sa Pitong Pantas, na hinirang upang mamuno rito sa loob ng sampung taon. Ang makabagong bayan ng Mytilene, sa gayon ding pook, ay kabisera ng Lesbos at ng rehiyon ng Hilagang Aegeo ng Grecia."
    - "Sa daan patungong Jerusalem sa pagtatapos ng kaniyang ikatlong paglalakbay, naglakad si Pablo sa lupa mula Troas hanggang Ason habang umikot sa dagat ang kaniyang mga kasama: “nang salubungin niya kami sa Ason, siya'y inilulan namin, at nagsiparoon kami sa Mitilene.” Waring doon nagpalipas ng gabi ang barko, sapagkat kinabukasan ay naglayag ito at “sumapit kami nang sumunod na araw sa tapat ng Chio”. Nagmamadali si Pablo na makarating sa Jerusalem para sa Pentecostes, kaya nilampasan ng barko ang Efeso. Ito lamang ang pagbanggit sa lungsod sa Biblia."
    - "Noong 428 BK, nag-alsa ang Mitilene laban sa Atenas. Isinasalaysay ni Thucydides kung paano bumoto ang kapulungan ng Atenas na patayin ang lahat ng lalaki at alipinin ang mga babae at bata, pagkatapos ay nagsisi kinabukasan, matapos ang debate nina Cleon at Diodotus, at nagpadala ng ikalawang barko na dumating sa tamang oras; pinatay pa rin ang mga pinuno ng paghihimagsik at giniba ang mga pader ng lungsod at kinuha ang armada nito. Noong unang siglo BK, napanalunan ng batang si Julio Cesar ang korona ng mamamayan sa pagsalakay sa Mitilene. Ibinigay ni Pompeyo, ayon kay Plutarch, ang kalayaan sa lungsod alang-alang sa mamamayan nitong si Theophanes, kaibigan at mananalaysay niya, at labis na nasiyahan sa teatro nito kaya ipinagawa niya ang mga plano nito upang magtayo ng mas malaki sa Roma. May natitira pang bahagi ng sinaunang teatro sa burol sa itaas ng bayan."
  da:
    - "Mitylene (Mytilene) var hovedbyen på Lesbos, den store ø ud for Lilleasiens nordvestkyst. Den lå på øens sydøstkyst, over for fastlandet, og Strabon bemærker, at den havde to havne. Omkring 600 f.Kr. var den byen for digterne Sappho og Alkaios og for Pittakos, en af de Syv Vise, der blev valgt til at styre den i ti år. Den moderne by Mytilene, på samme sted, er hovedstad på Lesbos og i regionen Nordegæis i Grækenland."
    - "På vej til Jerusalem ved slutningen af sin tredje rejse gik Paulus over land fra Troas til Assos, mens hans ledsagere sejlede rundt: »Da han nu stødte til os i Assus, toge vi ham om Bord og kom til Mitylene.« Skibet synes at have tilbragt natten dér, for det sejlede videre og »kom den næste Dag lige ud for Kios«. Paulus havde travlt med at nå Jerusalem til pinse, hvorfor skibet sejlede forbi Efesos. Dette er den eneste omtale af byen i Bibelen."
    - "I 428 f.Kr. faldt Mitylene fra Athen. Thukydid fortæller, hvordan den athenske folkeforsamling stemte for at dræbe alle mændene og gøre kvinderne og børnene til slaver, så fortrød det næste dag, efter debatten mellem Kleon og Diodotos, og sendte et andet skib, der ankom i sidste øjeblik; oprørets ledere blev stadig henrettet, og byens mure blev revet ned og dens flåde taget. I 1. århundrede f.Kr. vandt den unge Julius Cæsar borgerkransen ved stormen på Mitylene. Pompejus, siger Plutarch, gav byen dens frihed for dens borger Theophanes' skyld, hans ven og historiker, og var så glad for dens teater, at han lod tegne planer af det for at bygge et større i Rom. En del af det antikke teater er bevaret på højen over byen."
  sr:
    - "Митилина (Митилини) била је главни град Лезбоса, великог острва пред обалом северозападне Мале Азије. Стајала је на југоисточној обали острва, окренута копну, а Страбон примећује да је имала две луке. Око 600. п. н. е. била је град песника Сапфо и Алкеја и Питака, једног од Седам мудраца, који је био изабран да њоме влада десет година. Савремени град Митилини, на истом месту, главни је град Лезбоса и области Северни Егеј у Грчкој."
    - "На путу у Јерусалим на крају свог трећег путовања Павле је пешице ишао из Троаде до Аса док су његови сапутници обилазили морем: „А кад се саста с нама у Асу, узесмо га, и дођосмо у Митилину.“ Чини се да је лађа ту провела ноћ, јер је следећег дана отпловила даље: „дођосмо сутрадан према Хију“. Павле је журио да буде у Јерусалиму за Педесетницу, зато је лађа прошла мимо Ефеса. То је једини помен града у Библији."
    - "Године 428. п. н. е. Митилина се одметнула од Атине. Тукидид приповеда како је атинска скупштина изгласала да се побију сви мушкарци и поробе жене и деца, а затим се покајала следећег дана, после расправе између Клеона и Диодота, и послала други брод који је стигао у последњем тренутку; вође устанка ипак су погубљене, а градски зидови срушени и флота одузета. У I веку п. н. е. млади Јулије Цезар добио је грађански венац при јуришу на Митилину. Помпеј је, каже Плутарх, дао граду слободу ради свог грађанина Теофана, свог пријатеља и историчара, и био је толико задовољан њеним позориштем да је дао направити његове планове да изгради веће у Риму. Део античког позоришта сачуван је на брду изнад града."
  hu:
    - "Mitiléné (Mütiléné) Leszbosz, a Kis-Ázsia északnyugati partja előtti nagy sziget fő városa volt. A sziget délkeleti partján állt, a szárazfölddel szemben, és Sztrabón megjegyzi, hogy két kikötője volt. Kr. e. 600 körül Szapphó és Alkaiosz költők városa volt, valamint Pittakoszé, a hét bölcs egyikéé, akit tíz évre választottak uralkodójául. A mai Mitiléné város, ugyanazon a helyen, Leszbosz és Görögország Észak-égei régiójának fővárosa."
    - "Jeruzsálem felé harmadik útja végén Pál szárazföldön ment Troászból Asszoszba, míg társai tengeren kerültek: „Mikor pedig Assusban összetalálkozott velünk, felvévén őt, menénk Mitilénébe.” A hajó úgy látszik, ott töltötte az éjszakát, mert másnap tovább hajózott, és „másnap eljutánk Khius ellenébe”. Pál sietett, hogy pünkösdre Jeruzsálemben legyen, ezért haladt el a hajó Efezus mellett. Ez a város egyetlen említése a Bibliában."
    - "Kr. e. 428-ban Mitiléné elpártolt Athéntól. Thuküdidész elmeséli, hogy az athéni népgyűlés megszavazta az összes férfi megölését és az asszonyok és gyermekek rabszolgává tételét, majd másnap, a Kleón és Diodotosz közti vita után meggondolta magát, és második hajót küldött, amely épp időben ért oda; a lázadás vezetőit mégis kivégezték, a város falait lerombolták, flottáját elvették. A Kr. e. 1. században a fiatal Július Caesar elnyerte a polgári koszorút Mitiléné ostromakor. Pompeius – mondja Plutarkhosz – barátja és történetírója, Theophanész, a város polgára kedvéért szabadságot adott neki, és annyira megtetszett neki a színháza, hogy tervet készíttetett róla, hogy nagyobbat építsen Rómában. Az ókori színház egy része fennmaradt a város fölötti dombon."
  fi:
    - "Mytilene (Mitylene) oli Lesboksen, Vähän-Aasian luoteisrannikon edustalla olevan suuren saaren, pääkaupunki. Se sijaitsi saaren kaakkoisrannikolla mannerta vastapäätä, ja Strabon mainitsee sillä olleen kaksi satamaa. Noin 600 eaa. se oli runoilijoiden Sapphon ja Alkaiosin sekä Pittakoksen, yhden seitsemästä viisaasta, kaupunki; hänet valittiin hallitsemaan sitä kymmeneksi vuodeksi. Samalla paikalla oleva nykyinen Mytilenen kaupunki on Lesboksen ja Kreikan Pohjois-Egeanmeren alueen pääkaupunki."
    - "Matkalla Jerusalemiin kolmannen matkansa lopussa Paavali käveli maitse Trooaasta Assoon, kun hänen seuralaisensa kiersivät meritse: ”Ja kun hän yhtyi meihin Assossa, otimme hänet laivaan ja kuljimme Mityleneen.” Laiva näyttää viettäneen siellä yön, sillä seuraavana päivänä se purjehti edelleen ja ”saavuimme toisena päivänä Kion kohdalle”. Paavali kiirehti ehtimään Jerusalemiin helluntaiksi, minkä vuoksi laiva ohitti Efesoksen. Tämä on kaupungin ainoa maininta Raamatussa."
    - "Vuonna 428 eaa. Mytilene kapinoi Ateenaa vastaan. Thukydides kertoo, kuinka ateenalaisten kansankokous päätti tappaa kaikki miehet ja orjuuttaa naiset ja lapset, mutta katui seuraavana päivänä Kleonin ja Diodotoksen väittelyn jälkeen ja lähetti toisen laivan, joka saapui juuri ajoissa; kapinan johtajat silti tuomittiin kuolemaan, ja kaupungin muurit purettiin ja sen laivasto otettiin. 1. vuosisadalla eaa. nuori Julius Caesar voitti kansalaiskruunun Mytilenen valloituksessa. Pompeius, Plutarkhos sanoo, antoi kaupungille vapauden kansalaisensa Theofaneen, ystävänsä ja historioitsijansa, vuoksi ja ihastui niin sen teatteriin, että teetti siitä piirustukset rakentaakseen suuremman Roomaan. Osa antiikin teatterista on säilynyt kaupungin yläpuolella olevalla kukkulalla."
  vi:
    - "Mi-ti-len (Mytilene) là thành chính của Lesbos, hòn đảo lớn ngoài khơi tây bắc Tiểu Á. Nó đứng trên bờ đông nam của đảo, đối diện đất liền, và Strabo ghi rằng nó có hai bến cảng. Khoảng năm 600 TCN, đó là thành của các thi sĩ Sappho và Alcaeus và của Pittacus, một trong Thất hiền, người được chọn cai trị nó mười năm. Thị trấn Mytilene hiện đại, trên cùng địa điểm, là thủ phủ của Lesbos và của vùng Bắc Aegean của Hy Lạp."
    - "Trên đường đến Giê-ru-sa-lem vào cuối chuyến đi thứ ba, Phao-lô đi bộ từ Trô-ách đến A-sốt trong khi các bạn đồng hành đi đường biển: “Chúng ta gặp người tại thành A-sốt, bèn đem người đi với, cùng đến thành Mi-ti-len”. Tàu dường như qua đêm ở đó, vì hôm sau nó đi tiếp và “ngày mai đến ngang đảo Chi-ô”. Phao-lô đang vội đến Giê-ru-sa-lem kịp lễ Ngũ Tuần, nên tàu đi ngang qua Ê-phê-sô mà không ghé. Đây là lần duy nhất Kinh Thánh nhắc đến thành."
    - "Năm 428 TCN, Mi-ti-len nổi dậy chống A-thên. Thucydides kể hội nghị A-thên biểu quyết giết hết đàn ông và bắt đàn bà trẻ em làm nô lệ, rồi hôm sau hối hận, sau cuộc tranh luận giữa Cleon và Diodotus, và gửi chiếc tàu thứ hai đến vừa kịp; các thủ lĩnh cuộc nổi dậy vẫn bị xử tử, tường thành bị phá và hạm đội bị lấy. Thế kỷ 1 TCN, Julius Caesar trẻ giành vương miện công dân khi tấn công Mi-ti-len. Pompey, Plutarch nói, ban tự do cho thành vì công dân Theophanes, bạn và sử gia của ông, và rất hài lòng với nhà hát của nó đến mức cho vẽ họa đồ để xây một nhà hát lớn hơn ở Rô-ma. Một phần nhà hát cổ còn lại trên đồi phía trên thị trấn."
  ro:
    - "Mitilene (Mytilene) era orașul principal al Lesbosului, insula mare de lângă coasta de nord-vest a Asiei Mici. Se afla pe coasta de sud-est a insulei, față în față cu uscatul, iar Strabon notează că avea două porturi. În jurul anului 600 î.Hr. a fost orașul poeților Safo și Alceu și al lui Pittacos, unul dintre cei șapte înțelepți, ales să îl conducă zece ani. Orașul modern Mytilene, pe același loc, este capitala Lesbosului și a regiunii Egeea de Nord a Greciei."
    - "Pe drumul spre Ierusalim, la sfârșitul celei de-a treia călătorii, Pavel a mers pe uscat de la Troa la Asos, în timp ce însoțitorii lui au ocolit pe mare: „dacă s’a întâlnit cu noi la Ason, luându’l pre el, am venit la Mitilini”. Corabia pare să fi petrecut acolo noaptea, căci a doua zi a plecat mai departe și „a doua zi am sosit în preajma Hiului”. Pavel se grăbea să fie la Ierusalim de Cincizecime, de aceea corabia a trecut pe lângă Efes. Aceasta este singura pomenire a orașului în Biblie."
    - "În 428 î.Hr., Mitilene s-a răsculat împotriva Atenei. Tucidide povestește cum adunarea atenienilor a votat să fie uciși toți bărbații și robite femeile și copiii, apoi s-a căit a doua zi, după dezbaterea dintre Cleon și Diodot, și a trimis o a doua corabie, care a sosit tocmai la timp; conducătorii răscoalei au fost totuși omorâți, iar zidurile orașului au fost dărâmate și flota luată. În secolul I î.Hr., tânărul Iuliu Cezar a câștigat coroana civică la asaltul asupra Mitilenei. Pompei, spune Plutarh, a dat orașului libertatea de dragul cetățeanului său Teofan, prietenul și istoricul lui, și a fost atât de încântat de teatrul lui încât a pus să i se facă planurile ca să construiască unul mai mare la Roma. O parte din teatrul antic se păstrează pe dealul de deasupra orașului."
  bg:
    - "Митилини (Митилена) е бил главният град на Лесбос — големия остров край брега на северозападна Мала Азия. Той е стоял на югоизточния бряг на острова, срещу континента, и Страбон отбелязва, че имал две пристанища. Около 600 г. пр.н.е. това е градът на поетите Сафо и Алкей и на Питак, един от Седемте мъдреци, избран да го управлява десет години. Съвременният град Митилини, на същото място, е столица на Лесбос и на област Северен Егей в Гърция."
    - "На път за Йерусалим в края на третото си пътуване Павел вървял по суша от Троада до Асос, докато спътниците му заобиколили по море: „И когато се събра с нас в Асон, взехме го и дойдохме в Митилин.“ Корабът изглежда пренощувал там, защото, както се казва нататък, „на утрешния ден отплувахме срещу Хио“. Павел бързал да бъде в Йерусалим за Петдесетница и затова корабът отминал Ефес. Това е единственото споменаване на града в Библията."
    - "През 428 г. пр.н.е. Митилини въстава срещу Атина. Тукидид разказва как атинското народно събрание гласувало да бъдат избити всички мъже, а жените и децата — поробени, после на следващия ден се разкаяло, след спора между Клеон и Диодот, и изпратило втори кораб, който пристигнал точно навреме; водачите на въстанието все пак били екзекутирани, стените на града — съборени, а флотът му — отнет. През I в. пр.н.е. младият Юлий Цезар получава граждански венец при щурма на Митилини. Помпей, казва Плутарх, дал на града свобода заради неговия гражданин Теофан, свой приятел и историк, и толкова харесал театъра му, че наредил да се направят планове по него, за да построи по-голям в Рим. Част от древния театър е оцеляла на хълма над града."
