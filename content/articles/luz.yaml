# Overview article (ADR 0007). Mainstream facts only; Bethel at Beitin is the usual view, and the el-Bireh alternative is named.
id: luz
place: a397042
title:
  en: "Luz"
  ru: "Луз"
body:
  en:
    - "Luz was the Canaanite name of the town that Jacob renamed Bethel. After his dream of the ladder “he called the name of that place Beth-el: but the name of that city was called Luz at the first”. The name may mean “almond tree”. Returning from Haran, “Jacob came to Luz, which is in the land of Canaan”, that is, Bethel, and in old age he told Joseph, “God Almighty appeared unto me at Luz in the land of Canaan, and blessed me”. The border descriptions of Joshua run the line of Ephraim “from Beth-el to Luz” and that of Benjamin “to the side of Luz, which is Beth-el”; the first wording has led some scholars to think that the sanctuary of Bethel stood a little apart from the town of Luz. When the house of Joseph took the city, “the name of the city before was Luz”, and the man who showed them the way in went off “into the land of the Hittites” and built a city of the same name, never located."
    - "Bethel, and so Luz, is generally identified with Beitin, 16 km north of Jerusalem, a village that keeps the name; Edward Robinson made the identification in 1838, and Eusebius already placed Bethel, formerly called Luza, twelve miles from Jerusalem on the road to Neapolis. Excavations by W. F. Albright and J. L. Kelso in 1934 and 1954–60 found a walled town of the Middle Bronze Age, a Late Bronze destruction and an Iron Age settlement. A minority, following David Livingston, argue that Bethel lay instead at el-Bireh, 3 km to the south-west."
    - "Today Beitin is a Palestinian village north-east of Ramallah and al-Bireh, with the mound partly under its houses and the remains of a Byzantine church and a Crusader tower at its edge. The article on Bethel tells the later story of the place."
  ru:
    - "Луз — ханаанское имя города, который Иаков переименовал в Вефиль. После сна о лестнице «нарек Иаков имя месту тому: Вефиль, а прежнее имя того города было: Луз». Имя, вероятно, значит «миндальное дерево». Возвращаясь из Харрана, «пришел Иаков в Луз, что в земле Ханаанской, то есть в Вефиль», а в старости сказал Иосифу: «Бог Всемогущий явился мне в Лузе, в земле Ханаанской, и благословил меня». Описания границ в книге Иисуса Навина ведут предел Ефрема от Вефиля «к Лузу», а предел Вениамина — «к южной стороне Луза, иначе Вефиля»; первая формулировка навела некоторых учёных на мысль, что святилище Вефиль стояло чуть поодаль от города Луза. Когда дом Иосифов взял город, «имя же городу было прежде Луз», а человек, показавший вход в него, ушёл «в землю Хеттеев» и построил город с тем же именем, которого никто не нашёл."
    - "Вефиль, а значит и Луз, обычно отождествляют с Бейтином в 16 км к северу от Иерусалима — деревней, сохранившей имя; отождествление сделал Эдвард Робинсон в 1838 году, а Евсевий уже помещал Вефиль, прежде называвшийся Луза, в двенадцати милях от Иерусалима по дороге в Неаполь. Раскопки У. Ф. Олбрайта и Дж. Л. Келсо в 1934 и 1954–1960 годах открыли обнесённый стеной город среднего бронзового века, разрушение позднего бронзового века и поселение железного века. Меньшинство вслед за Дэвидом Ливингстоном считает, что Вефиль лежал в Эль-Бире, в 3 км к юго-западу."
    - "Сегодня Бейтин — палестинская деревня к северо-востоку от Рамаллы и Эль-Биры; холм частично под её домами, а на краю — остатки византийской церкви и крестоносной башни. Позднейшую историю места рассказывает статья о Вефиле."
