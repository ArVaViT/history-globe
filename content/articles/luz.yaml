body:
  en:
    - "Luz was the Canaanite name of the town that Jacob renamed Bethel. After his dream of the ladder “he called the name of that place Beth-el: but the name of that city was called Luz at the first”. The name may mean “almond tree”. Returning from Haran, “Jacob came to Luz, which is in the land of Canaan”, that is, Bethel, and in old age he told Joseph, “God Almighty appeared unto me at Luz in the land of Canaan, and blessed me”. Joshua's border descriptions run the line of the children of Joseph “from Beth-el to Luz” and that of Benjamin “to the side of Luz, which is Beth-el”; the first wording has led some scholars to think that the sanctuary of Bethel stood a little apart from Luz. When the house of Joseph took the city, “the name of the city before was Luz”, and the man who showed them the way in went off “into the land of the Hittites” and built a city of the same name, never located."
    - "Bethel, and so Luz, is generally identified with Beitin, 16 km north of Jerusalem, a village that keeps the name; Edward Robinson made the identification in 1838, and Eusebius already placed Bethel, formerly called Luza, twelve miles from Jerusalem on the road to Neapolis. Excavations by W. F. Albright and J. L. Kelso in 1934 and 1954–60 found a walled town of the Middle Bronze Age, a Late Bronze destruction and an Iron Age settlement. A minority, following David Livingston, argue that Bethel lay instead at el-Bireh, 3 km to the south-west."
    - "Today Beitin is a Palestinian village north-east of Ramallah and al-Bireh, with the mound partly under its houses and the remains of a Byzantine church and a Crusader tower at its edge. The article on Bethel tells the later story of the place."
  ru:
    - "Луз — ханаанское имя города, который Иаков переименовал в Вефиль. После сна о лестнице «нарек Иаков имя месту тому: Вефиль, а прежнее имя того города было: Луз». Имя, вероятно, значит «миндальное дерево». Возвращаясь из Харрана, «пришел Иаков в Луз, что в земле Ханаанской, то есть в Вефиль», а в старости сказал Иосифу: «Бог Всемогущий явился мне в Лузе, в земле Ханаанской, и благословил меня». Описания границ в книге Иисуса Навина ведут предел сынов Иосифовых от Вефиля «к Лузу», а предел Вениамина — «к южной стороне Луза, иначе Вефиля»; первая формулировка навела некоторых учёных на мысль, что святилище Вефиль стояло чуть поодаль от города Луза. Когда дом Иосифов взял город, «имя же городу было прежде Луз», а человек, показавший вход в него, ушёл «в землю Хеттеев» и построил город с тем же именем, которого никто не нашёл."
    - "Вефиль, а значит и Луз, обычно отождествляют с Бейтином в 16 км к северу от Иерусалима — деревней, сохранившей имя; отождествление сделал Эдвард Робинсон в 1838 году, а Евсевий уже помещал Вефиль, прежде называвшийся Луза, в двенадцати милях от Иерусалима по дороге в Неаполь. Раскопки У. Ф. Олбрайта и Дж. Л. Келсо в 1934 и 1954–1960 годах открыли обнесённый стеной город среднего бронзового века, разрушение позднего бронзового века и поселение железного века. Меньшинство вслед за Дэвидом Ливингстоном считает, что Вефиль лежал в Эль-Бире, в 3 км к юго-западу."
    - "Сегодня Бейтин — палестинская деревня к северо-востоку от Рамаллы и Эль-Биры; холм частично под её домами, а на краю — остатки византийской церкви и крестоносной башни. Позднейшую историю места рассказывает статья о Вефиле."
  uk:
    - "Луз було ханаанською назвою міста, яке Яків перейменував на Бет-Ел. Після сну про драбину «прозвав Яков урочище то Бетель; прежне прізвище городу було Луз». Назва може означати «мигдальне дерево». Повертаючись із Харану, «Прийшов же Яков у Луз, що в Канаан землї, се єсть Бетель», а в старості він сказав Йосипові: «Бог мій явивсь менї в Лусї, в Канаан землї, і благословив мене». Описи меж у Ісуса Навина ведуть лінію синів Йосипа «Від Бетеля йде границя до Лузи», а лінію Веніяміна — «на Луз, від полудня Луза або Бетеля»; перше формулювання змусило деяких учених думати, що святилище Бет-Елу стояло трохи осторонь від міста Луз. Коли дім Йосипа взяв місто, «сей город прозивався перше Лузом», а чоловік, що показав їм вхід, подався «у Гетійську землю» й збудував місто з тією самою назвою, яке ніколи не знайдено."
    - "Бет-Ел, а отже й Луз, зазвичай ототожнюють із Бейтіном, за 16 км на північ від Єрусалима, селом, що зберігає назву; Едвард Робінсон зробив це ототожнення 1838 р., а Євсевій уже розміщував Бет-Ел, колись званий Лузою, за дванадцять миль від Єрусалима на дорозі до Неаполя. Розкопки В. Ф. Олбрайта й Дж. Л. Келсо 1934 р. та 1954–1960 рр. виявили мурове місто середньої бронзової доби, руйнування пізньої бронзової та поселення залізної доби. Меншість, слідом за Девідом Лівінгстоном, стверджує, що Бет-Ел лежав натомість в ель-Біре, за 3 км на південний захід."
    - "Сьогодні Бейтін — палестинське село на північний схід від Рамалли й аль-Біре, з пагорбом, почасти під його будинками, та рештками візантійської церкви й вежі хрестоносців на краю. Стаття про Бет-Ел розповідає пізнішу історію місця."
  es:
    - "Luz era el nombre cananeo de la ciudad que Jacob rebautizó Betel. Tras su sueño de la escalera, «Y llamó el nombre de aquel lugar Beth-el, bien que Luz era el nombre de la ciudad primero». El nombre puede significar «almendro». A su regreso de Harán, «llegó Jacob á Luz, que está en tierra de Canaán», es decir Betel; ya anciano dijo a José: «El Dios Omnipotente me apareció en Luz en la tierra de Canaán, y me bendijo». Las fronteras de Josué trazan la línea de los hijos de José «de Beth-el sale á Luz» y la de Benjamín «por el lado de Luz (esta es Beth-el)»; la primera formulación lleva a algunos estudiosos a pensar que el santuario de Betel se alzaba algo apartado de Luz. Cuando la casa de José tomó la ciudad, esta «antes se llamaba Luz», y el hombre que les mostró la entrada se fue «á la tierra de los Hetheos» y edificó una ciudad del mismo nombre, nunca localizada."
    - "Betel, y por tanto Luz, se identifica generalmente con Beitin, a 16 km al norte de Jerusalén, una aldea que conserva el nombre; Edward Robinson hizo la identificación en 1838, y Eusebio ya situó Betel, antes llamada Luza, a doce millas de Jerusalén en el camino de Neápolis. Las excavaciones de W. F. Albright y J. L. Kelso en 1934 y 1954–60 hallaron una ciudad amurallada de la Edad del Bronce Medio, una destrucción del Bronce Final y un asentamiento de la Edad del Hierro. Una minoría, siguiendo a David Livingston, sostiene que Betel estaba más bien en el-Bireh, a 3 km al sudoeste."
    - "Hoy Beitin es una aldea palestina al nordeste de Ramala y al-Bireh, con el montículo en parte bajo sus casas y los restos de una iglesia bizantina y de una torre cruzada en su borde. El artículo sobre Betel cuenta la historia posterior del lugar."
  pt:
    - "Luz era o nome cananeu da cidade que Jacó rebatizou de Betel. Depois do sonho da escada, “chamou o nome daquele lugar de Betel, mas o nome da cidade era Luz no princípio”. O nome pode significar “amendoeira”. Voltando de Harã, “Jacó chegou a Luz (isto é, Betel), que fica na terra de Canaã”, e na velhice disse a José: “O Deus Todo-Poderoso apareceu a mim em Luz, na terra de Canaã, e me abençoou”. As descrições de fronteira de Josué traçam a linha dos filhos de José “de Betel para Luz” e a de Benjamim “para a encosta de Luz (também chamada Betel)”; a primeira formulação levou alguns estudiosos a pensar que o santuário de Betel ficava um pouco afastado da cidade de Luz. Quando a casa de José tomou a cidade, “O nome da cidade antes disso era Luz”, e o homem que lhes mostrou a entrada foi “para a terra dos hititas” e construiu uma cidade com o mesmo nome, nunca localizada."
    - "Betel, e portanto Luz, é geralmente identificada com Beitin, 16 km ao norte de Jerusalém, uma aldeia que conserva o nome; Edward Robinson fez a identificação em 1838, e Eusébio já situava Betel, antes chamada Luza, a doze milhas de Jerusalém, na estrada de Neápolis. As escavações de W. F. Albright e J. L. Kelso em 1934 e 1954–60 encontraram uma cidade murada da Idade do Bronze Médio, uma destruição do Bronze Recente e um povoado da Idade do Ferro. Uma minoria, seguindo David Livingston, sustenta que Betel ficava antes em el-Bireh, 3 km a sudoeste."
    - "Hoje Beitin é uma aldeia palestina a nordeste de Ramallah e al-Bireh, com o montículo em parte sob suas casas e os restos de uma igreja bizantina e de uma torre cruzada em sua orla. O verbete sobre Betel conta a história posterior do lugar."
  de:
    - "Lus war der kanaanäische Name der Stadt, die Jakob in Bethel umbenannte. Nach seinem Traum von der Leiter heißt es: „und hieß die Stätte Beth-El; zuvor aber hieß die Stadt Lus“. Der Name bedeutet vielleicht „Mandelbaum“. Bei der Rückkehr aus Haran „kam Jakob gen Lus im Lande Kanaan, das da Beth-El heißt“, und im Alter sagte er zu Josef: „Der allmächtige Gott erschien mir zu Lus im Lande Kanaan und segnete mich“. Josuas Grenzbeschreibungen führen die Linie der Kinder Josefs „von Beth-El heraus gen Lus“, die Benjamins „an der Seite her an Lus mittagwärts, das ist Beth-El“; wegen der ersten Fassung meinen manche, das Heiligtum von Bethel habe etwas abseits von Lus gestanden. Als das Haus Josefs Beth-El einnahm, „das vorzeiten Lus hieß“, zog der Mann, der ihnen den Zugang zeigte, „ins Land der Hethiter“ und baute eine gleichnamige Stadt, die nie gefunden wurde."
    - "Bethel und damit Lus wird allgemein mit Beitin gleichgesetzt, 16 km nördlich von Jerusalem, einem Dorf, das den Namen bewahrt; Edward Robinson nahm die Gleichsetzung 1838 vor, und schon Eusebius setzte Bethel, früher Luza genannt, zwölf Meilen von Jerusalem an der Straße nach Neapolis an. Die Ausgrabungen von W. F. Albright und J. L. Kelso 1934 und 1954–60 fanden eine ummauerte Stadt der Mittelbronzezeit, eine Zerstörung der Spätbronzezeit und eine Siedlung der Eisenzeit. Eine Minderheit, David Livingston folgend, vertritt die Ansicht, Bethel habe stattdessen in el-Bireh gelegen, 3 km südwestlich."
    - "Beitin ist heute ein palästinensisches Dorf nordöstlich von Ramallah und al-Bireh, mit dem Hügel teilweise unter seinen Häusern und den Resten einer byzantinischen Kirche und eines Kreuzfahrerturms an seinem Rand. Der Artikel über Bethel erzählt die spätere Geschichte des Ortes."
  fr:
    - "Luz était le nom cananéen de la ville que Jacob rebaptisa Béthel. Après son rêve de l’échelle, « il donna à ce lieu le nom de Béthel ; mais la ville s’appelait auparavant Luz ». Le nom signifie peut-être « amandier ». Au retour de Haran, « Jacob arriva … à Luz, qui est Béthel, dans le pays de Canaan », et dans sa vieillesse il dit à Joseph : « Le Dieu tout-puissant m’est apparu à Luz, dans le pays de Canaan, et il m’a béni. » Chez Josué, la limite des fils de Joseph va « de Béthel à Luz » et celle de Benjamin passe « au midi de Luz, qui est Béthel » ; la première formule a conduit certains savants à penser que le sanctuaire de Béthel se tenait un peu à l’écart de la ville de Luz. Quand la maison de Joseph prit la ville, qui « s’appelait autrefois Luz », l’homme qui leur montra par où entrer partit « dans le pays des Héthiens » et y bâtit une ville du même nom, jamais située."
    - "Béthel, et donc Luz, est généralement identifiée à Beitin, à 16 km au nord de Jérusalem, village qui garde le nom ; Edward Robinson fit l’identification en 1838, et Eusèbe plaçait déjà Béthel, appelée autrefois Luza, à douze milles de Jérusalem sur la route de Néapolis. Les fouilles de W. F. Albright et J. L. Kelso en 1934 et 1954–1960 ont mis au jour une ville fortifiée du Bronze moyen, une destruction du Bronze récent et un établissement de l’âge du Fer. Une minorité, à la suite de David Livingston, soutient que Béthel se trouvait plutôt à el-Bireh, à 3 km au sud-ouest."
    - "Aujourd’hui, Beitin est un village palestinien au nord-est de Ramallah et d’al-Bireh, avec le tertre en partie sous ses maisons et, à sa lisière, les restes d’une église byzantine et d’une tour des croisés. L’article sur Béthel raconte l’histoire plus tardive du lieu."
  it:
    - "Luz era il nome cananeo della città che Giacobbe ribattezzò Betel. Dopo il sogno della scala, «pose nome a quel luogo Bethel; ma, prima, il nome della città era Luz». Tornando da Carran, «Giacobbe giunse a Luz, cioè Bethel, ch’è nel paese di Canaan», e da vecchio disse a Giuseppe: «L’Iddio onnipotente mi apparve a Luz nel paese di Canaan, mi benedisse». Le descrizioni dei confini in Giosuè fanno correre la linea dei figli di Giuseppe «da Bethel a Luz» e quella di Beniamino «sul versante meridionale di Luz (che è Bethel)»; la prima formula ha indotto alcuni studiosi a pensare che il santuario di Betel sorgesse un po’ in disparte dalla città di Luz. Quando la casa di Giuseppe prese la città, era «Bethel, città che prima si chiamava Luz», e l’uomo che mostrò loro la via per entrare se ne andò «nel paese degli Hittei» e vi edificò una città con lo stesso nome, mai localizzata."
    - "Betel, e dunque Luz, è generalmente identificata con Beitin, 16 km a nord di Gerusalemme, un villaggio che ne conserva il nome; Edward Robinson fece l’identificazione nel 1838, e già Eusebio poneva Betel, un tempo chiamata Luza, a dodici miglia da Gerusalemme sulla strada per Neapoli. Gli scavi di W. F. Albright e J. L. Kelso nel 1934 e nel 1954–60 hanno trovato una città murata del Bronzo Medio, una distruzione del Bronzo Tardo e un insediamento dell’età del Ferro. Una minoranza, seguendo David Livingston, sostiene che Betel sorgesse invece a el-Bireh, 3 km a sud-ovest."
    - "Oggi Beitin è un villaggio palestinese a nord-est di Ramallah e al-Bireh, con il tell in parte sotto le sue case e i resti di una chiesa bizantina e di una torre crociata ai suoi margini. L’articolo su Betel racconta la storia successiva del luogo."
  pl:
    - "Luz było kananejską nazwą miasta, które Jakub przemianował na Betel. Po śnie o drabinie „nazwał imię miejsca onego Betel; bo było przedtem imię miasta onego Luz”. Nazwa może znaczyć „drzewo migdałowe”. Wracając z Charanu, „Przyszedł tedy Jakób do Luzy, która jest w ziemi Chananejskiej”, to jest do Betel, a na starość powiedział Józefowi: „Bóg wszechmogący ukazał mi się w Luzie, w ziemi Chananejskiej, i błogosławił mi”. Opisy granic u Jozuego prowadzą linię synów Józefa „od Betel do Luzy”, a Beniamina „od strony południowej Luzy, która jest Betel”; pierwsze sformułowanie skłoniło niektórych uczonych do myśli, że sanktuarium Betel stało nieco z dala od miasta Luz. Gdy dom Józefa zdobywał miasto, „imię miasta tego było przedtem Luz”, a człowiek, który wskazał im wejście, odszedł „do ziemi Hetejczyków” i zbudował miasto o tej samej nazwie, nigdy nie zlokalizowane."
    - "Betel, a więc Luz, utożsamia się zazwyczaj z Beitin, 16 km na północ od Jerozolimy, wsią zachowującą nazwę; utożsamienia dokonał Edward Robinson w 1838 r., a Euzebiusz umieszczał już Betel, dawniej zwane Luza, dwanaście mil od Jerozolimy przy drodze do Neapolis. Wykopaliska W. F. Albrighta i J. L. Kelso w 1934 r. i w latach 1954–60 odsłoniły obwarowane miasto z środkowej epoki brązu, zniszczenie z późnej epoki brązu i osadę z epoki żelaza. Mniejszość, idąc za Davidem Livingstonem, twierdzi, że Betel leżało raczej w el-Bireh, 3 km na południowy zachód."
    - "Dziś Beitin to palestyńska wieś na północny wschód od Ramallah i al-Bireh, z kopcem częściowo pod domami oraz resztkami bizantyjskiego kościoła i wieży krzyżowców na skraju. Artykuł o Betel opowiada późniejszą historię tego miejsca."
  nl:
    - "Luz was de Kanaänitische naam van de stad die Jakob Bethel noemde. Na zijn ladderdroom “noemde hij den naam dier plaats Beth-El; daar toch de naam dier stad te voren was Luz”. De naam kan “amandelboom” zijn. Terugkerend uit Haran “kwam Jakob te Luz, hetwelk is in het land Kanaän (dat is Beth-El)”, en als oude man zei hij tot Jozef: “God de Almachtige, is mij verschenen te Luz, in het land Kanaän, en Hij heeft mij gezegend”. Jozua's grensbeschrijvingen laten de lijn van de kinderen van Jozef lopen “van Beth-El uit naar Luz” en die van Benjamin “aan de zijde van Luz (welke is Beth-El)”; de eerste formulering doet sommigen denken dat het heiligdom van Bethel een eindje buiten Luz lag. Bij de verovering door Jozefs huis staat: “de naam nu dezer stad was te voren Luz”, en de man die hun de weg wees, ging heen “in het land der Hethieten” en bouwde een gelijknamige stad, nooit gelokaliseerd."
    - "Bethel, en dus Luz, wordt algemeen geïdentificeerd met Beitin, 16 km ten noorden van Jeruzalem, een dorp dat de naam bewaart; Edward Robinson deed die identificatie in 1838, en Eusebius plaatste Bethel, vroeger Luza genoemd, al op twaalf mijl van Jeruzalem aan de weg naar Neapolis. Opgravingen van W. F. Albright en J. L. Kelso in 1934 en 1954–60 vonden een ommuurde stad uit de midden-bronstijd, een verwoesting in de late bronstijd en een nederzetting uit de ijzertijd. Een minderheid, in navolging van David Livingston, betoogt dat Bethel in plaats daarvan bij el-Bireh lag, 3 km naar het zuidwesten."
    - "Beitin is tegenwoordig een Palestijns dorp ten noordoosten van Ramallah en al-Bireh, met de heuvel gedeeltelijk onder zijn huizen en de resten van een Byzantijnse kerk en een kruisvaarderstoren aan de rand. Het lemma over Bethel vertelt het latere verhaal van de plaats."
  cs:
    - "Lúz bylo kanaánské jméno města, které Jákob přejmenoval na Bét-el. Po snu o žebříku „nazval jméno místa toho Bethel, ješto prvé to město sloulo Lůza“. Jméno snad znamená „mandloň“. Při návratu z Cháranu „přišel Jákob do Lůz, kteréž jest v zemi Kananejské“, tedy do Bét-elu, a ve stáří řekl Josefovi: „Bůh silný všemohoucí ukázav mi se v Lůza v zemi Kananejské, požehnal mi“. Popisy hranic v Jozue vedou hranici synů Josefových „od Bethel vychází do Lůza“ a Benjamínovu „při straně Lůz polední, (jenž jest Bethel,)“; první znění vedlo některé badatele k myšlence, že svatyně Bét-elu stála trochu stranou od města Lúz. Když dům Josefův město dobyl, bylo to Bethel, „kteréhožto města jméno prvé bylo Lůza“, a muž, který jim ukázal vchod, odešel „do země Hetejských“ a vystavěl město téhož jména, které nebylo nikdy nalezeno."
    - "Bét-el, a tedy Lúz, se obecně ztotožňuje s Beitinem, 16 km severně od Jeruzaléma, vesnicí, která jméno zachovává; určení provedl roku 1838 Edward Robinson a Eusebius už kladl Bét-el, dříve zvaný Luza, dvanáct mil od Jeruzaléma při silnici do Neapole. Vykopávky W. F. Albrighta a J. L. Kelsa v letech 1934 a 1954–60 našly opevněné město z doby střední bronzové, zničení v době pozdní bronzové a osídlení z doby železné. Menšina, v čele s Davidem Livingstonem, tvrdí, že Bét-el ležel naopak v el-Bireh, 3 km na jihozápad."
    - "Dnes je Beitin palestinská vesnice severovýchodně od Ramalláhu a al-Bireh, s pahorkem zčásti pod domy a se zbytky byzantského kostela a křižácké věže na okraji. Článek o Bét-elu vypráví pozdější příběh místa."
  sv:
    - "Lus var det kanaaneiska namnet på staden som Jakob döpte om till Betel. Efter drömmen om stegen heter det: ”Och han gav den platsen namnet Betel; förut hade staden hetat Lus”. Namnet kan betyda ”mandelträd”. På återvägen från Harran heter det: ”Jakob kom till Lus, det är Betel, i Kanaans land”, och på sin ålderdom sade han till Josef: ”Gud den Allsmäktige uppenbarade sig för mig i Lus i Kanaans land och välsignade mig”. Josuas gränsbeskrivningar låter Josefs barns linje gå ”från Betel till Lus” och Benjamins ”fram till Lus, till höjden söder om Lus, det är Betel”; den första formuleringen har fått vissa forskare att tro att Betels helgedom låg något vid sidan av Lus. När Josefs hus intog staden, ”samma stad som fordom hette Lus”, begav sig mannen som visade dem in ”till hetiternas land” och byggde en stad med samma namn, aldrig lokaliserad."
    - "Betel, och därmed Lus, identifieras vanligen med Beitin, 16 km norr om Jerusalem, en by som bevarar namnet; Edward Robinson gjorde identifieringen 1838, och Eusebios förlade redan Betel, tidigare kallat Luza, tolv romerska mil från Jerusalem på vägen till Neapolis. Utgrävningar av W. F. Albright och J. L. Kelso 1934 och 1954–60 fann en muromgärdad stad från mellersta bronsåldern, en förstörelse under yngre bronsåldern och en bosättning från järnåldern. En minoritet, med David Livingston, hävdar att Betel i stället låg vid el-Bireh, 3 km sydväst därom."
    - "I dag är Beitin en palestinsk by nordost om Ramallah och al-Bireh, med kullen delvis under husen och lämningarna av en bysantinsk kyrka och ett korsfarartorn vid kanten. Artikeln om Betel berättar platsens senare historia."
  nb:
    - "Lus var det kanaanittiske navnet på byen som Jakob omdøpte til Betel. Etter drømmen om stigen heter det: «Og han kalte dette sted Betel; før hette byen Luz.» Navnet kan bety «mandeltre». På vei tilbake fra Harran: «Og Jakob kom til Luz, som ligger i Kana'ans land», det vil si Betel, og i høy alder sa han til Josef: «Den allmektige Gud åpenbarte sig for mig i Luz i Kana'ans land og velsignet mig». Josvas grensebeskrivelser fører Josefs barns linje «Fra Betel gikk grensen frem til Luz», og Benjamins «til Luz, til fjellryggen i syd for Luz, det er Betel»; den første formuleringen har fått noen forskere til å tro at helligdommen i Betel lå et stykke fra Lus. Da Josefs hus inntok byen, «byen hette før Luz», og mannen som viste dem veien inn, drog bort «til hetittenes land» og bygde en by med samme navn, som aldri er lokalisert."
    - "Betel, og dermed Lus, identifiseres vanligvis med Beitin, 16 km nord for Jerusalem, en landsby som har beholdt navnet; Edward Robinson gjorde identifikasjonen i 1838, og Eusebius plasserte allerede Betel, tidligere kalt Luza, tolv romerske mil fra Jerusalem på veien til Neapolis. Utgravninger ved W. F. Albright og J. L. Kelso i 1934 og 1954–60 fant en befestet by fra mellombronsealderen, en ødeleggelse i senbronsealderen og en bosetning fra jernalderen. En minoritet, etter David Livingston, hevder at Betel i stedet lå ved el-Bireh, 3 km mot sørvest."
    - "I dag er Beitin en palestinsk landsby nordøst for Ramallah og al-Bireh, med haugen delvis under husene og restene av en bysantinsk kirke og et korsfarertårn i utkanten. Artikkelen om Betel forteller stedets senere historie."
  tl:
    - "Ang Luz ang pangalang Cananeo ng bayang pinalitan ni Jacob ng Beth-el. Pagkatapos ng panaginip sa hagdan, “ang ipinangalan niya sa dakong yaon ay Betel: datapuwa't ang pangalan ng bayan nang una ay Luz”. Maaaring “puno ng almendras” ang kahulugan. Pagbalik mula sa Haran, “naparoon si Jacob sa Luz, na nasa lupain ng Canaan” (Beth-el), at sa pagtanda ay sinabi kay Jose, “Ang Dios na Makapangyarihan sa lahat ay napakita sa akin sa Luz sa lupain ng Canaan, at binasbasan ako”. Sa hangganan ni Josue, ang kay Jose ay “mula sa Beth-el na patungo sa Luz” at ang kay Benjamin “sa dako ng Luz (na siyang Beth-el)”; dahil sa unang pananalita, inisip ng ilang iskolar na bahagyang hiwalay sa Luz ang santuwaryo ng Beth-el. Sa pagkuha ng sambahayan ni Jose, Luz pa ang pangalan ng bayan, at ang lalaking nagturo ng daan ay pumasok “sa lupain ng mga Hetheo” at nagtayo ng bayang kapangalan, na di natukoy."
    - "Ang Beth-el, at kaya ang Luz, ay karaniwang kinikilala sa Beitin, 16 km sa hilaga ng Jerusalem, isang nayong nagtataglay ng pangalan; ginawa ni Edward Robinson ang pagkilalang ito noong 1838, at inilagay na ni Eusebio ang Beth-el, na dating tinatawag na Luza, labindalawang milya mula sa Jerusalem sa daan patungong Neapolis. Ang mga paghuhukay nina W. F. Albright at J. L. Kelso noong 1934 at 1954–60 ay nakatuklas ng bayang may pader ng Gitnang Panahon ng Tanso, pagkawasak ng Huling Panahon ng Tanso at pamayanan ng Panahon ng Bakal. Ang isang minorya, kasunod ni David Livingston, ay nangangatwirang ang Beth-el ay nasa el-Bireh sa halip, 3 km sa timog-kanluran."
    - "Ang Beitin ngayon ay nayong Palestino sa hilagang-silangan ng Ramallah at al-Bireh, na ang burol ay bahagyang nasa ilalim ng mga bahay nito at ang mga labi ng isang simbahang Bizantino at isang tore ng Krusado sa gilid nito. Isinasalaysay ng artikulo tungkol sa Beth-el ang mas huling kuwento ng lugar."
  da:
    - "Luz var det kana'anæiske navn på den by, som Jakob omdøbte Betel. Efter drømmen om stigen »kaldte han det samme Steds Navn Bethel, men ellers var Lus Stadens Navn fra Begyndelsen«. Navnet kan betyde »mandeltræ«. På vej tilbage fra Karan: »Jakob kom til Lus, som er i Kanaans Land«, det vil sige Betel, og som gammel sagde han til Josef: »Den almægtige Gud aabenbaredes for mig i Lus, udi Kanaans Land, og velsignede mig«. Josvas grænsebeskrivelser lader Josefs børns linje løbe »fra Bethel til Lus« og Benjamins »til den søndre Side af Lus, det er Bethel«; den første formulering har fået nogle forskere til at mene, at Betels helligdom lå lidt for sig selv fra Luz. Da Josefs hus indtog byen, var »Stadens Navn fordum Lus«, og manden, der viste dem vej ind, gik »til Hethiternes Land« og byggede en by med samme navn, aldrig lokaliseret."
    - "Betel, og dermed Luz, identificeres almindeligvis med Beitin, 16 km nord for Jerusalem, en landsby, der bevarer navnet; Edward Robinson foretog identifikationen i 1838, og Eusebius placerede allerede Betel, tidligere kaldet Luza, tolv romerske mil fra Jerusalem på vejen til Neapolis. Udgravninger af W. F. Albright og J. L. Kelso i 1934 og 1954–60 fandt en befæstet by fra mellembronzealderen, en ødelæggelse i senbronzealderen og en bosættelse fra jernalderen. En minoritet, efter David Livingston, argumenterer for, at Betel i stedet lå ved el-Bireh, 3 km mod sydvest."
    - "I dag er Beitin en palæstinensisk landsby nordøst for Ramallah og al-Bireh, med højen delvis under husene og resterne af en byzantinsk kirke og et korsfarertårn i udkanten. Artiklen om Betel fortæller stedets senere historie."
  sr:
    - "Луза је било ханаанско име града који је Јаков преименовао у Ветиљ. После сна о лествицама „прозва оно место Ветиљ, а пре беше име оном граду Луз“. Име можда значи „бадемово дрво“. Враћајући се из Харана, Јаков и сва чељад „дођоше у Луз у земљи хананској“, то јест у Ветиљ, а у старости је рекао Јосифу: „Бог Свемогући јави се мени у Лузу у земљи хананској, и благослови ме“. Описи међа у Књизи Исуса Навина воде линију Јосифових синова: „а од Ветиља иде на Луз“, а Венијаминову: „до Луза, с јужне стране Лузу, а то је Ветиљ“; прва формулација навела је неке научнике да мисле да је светилиште Ветиља стајало мало одвојено од Лузе. Када су дом Јосифов заузели град, „а име граду беше пре Луз“, а човек који им је показао улаз отишао је „у земљу хетејску“ и сазидао град истог имена, који никад није пронађен."
    - "Ветиљ, а тиме и Луза, углавном се поистовећује с Бајтином, 16 км северно од Јерусалима, селом које чува име; Едвард Робинсон је извео идентификацију 1838, а Јевсевије је већ сместио Ветиљ, раније зван Луза, дванаест миља од Јерусалима на путу за Неапољ. Ископавања В. Ф. Олбрајта и Џ. Л. Келсоа 1934. и 1954–60. нашла су град са зидинама из средњег бронзаног доба, рушење у касном бронзаном добу и насеље из гвозденог доба. Мањина, следећи Дејвида Ливингстона, тврди да је Ветиљ лежао уместо тога у ел-Бире, 3 км југозападно."
    - "Данас је Бајтин палестинско село североисточно од Рамале и ел-Бире, с хумком делом испод његових кућа и остацима византијске цркве и крсташке куле на његовом рубу. Каснију причу о том месту казује чланак о Ветиљу."
