  pt: "Luz"
  de: "Lus"
  fr: "Luz"
body:
  en:
    - "Luz was the Canaanite name of the town that Jacob renamed Bethel. After his dream of the ladder “he called the name of that place Beth-el: but the name of that city was called Luz at the first”. The name may mean “almond tree”. Returning from Haran, “Jacob came to Luz, which is in the land of Canaan”, that is, Bethel, and in old age he told Joseph, “God Almighty appeared unto me at Luz in the land of Canaan, and blessed me”. The border descriptions of Joshua run the line of Ephraim “from Beth-el to Luz” and that of Benjamin “to the side of Luz, which is Beth-el”; the first wording has led some scholars to think that the sanctuary of Bethel stood a little apart from the town of Luz. When the house of Joseph took the city, “the name of the city before was Luz”, and the man who showed them the way in went off “into the land of the Hittites” and built a city of the same name, never located."
    - "Bethel, and so Luz, is generally identified with Beitin, 16 km north of Jerusalem, a village that keeps the name; Edward Robinson made the identification in 1838, and Eusebius already placed Bethel, formerly called Luza, twelve miles from Jerusalem on the road to Neapolis. Excavations by W. F. Albright and J. L. Kelso in 1934 and 1954–60 found a walled town of the Middle Bronze Age, a Late Bronze destruction and an Iron Age settlement. A minority, following David Livingston, argue that Bethel lay instead at el-Bireh, 3 km to the south-west."
    - "Today Beitin is a Palestinian village north-east of Ramallah and al-Bireh, with the mound partly under its houses and the remains of a Byzantine church and a Crusader tower at its edge. The article on Bethel tells the later story of the place."
  ru:
    - "Луз — ханаанское имя города, который Иаков переименовал в Вефиль. После сна о лестнице «нарек Иаков имя месту тому: Вефиль, а прежнее имя того города было: Луз». Имя, вероятно, значит «миндальное дерево». Возвращаясь из Харрана, «пришел Иаков в Луз, что в земле Ханаанской, то есть в Вефиль», а в старости сказал Иосифу: «Бог Всемогущий явился мне в Лузе, в земле Ханаанской, и благословил меня». Описания границ в книге Иисуса Навина ведут предел Ефрема от Вефиля «к Лузу», а предел Вениамина — «к южной стороне Луза, иначе Вефиля»; первая формулировка навела некоторых учёных на мысль, что святилище Вефиль стояло чуть поодаль от города Луза. Когда дом Иосифов взял город, «имя же городу было прежде Луз», а человек, показавший вход в него, ушёл «в землю Хеттеев» и построил город с тем же именем, которого никто не нашёл."
    - "Вефиль, а значит и Луз, обычно отождествляют с Бейтином в 16 км к северу от Иерусалима — деревней, сохранившей имя; отождествление сделал Эдвард Робинсон в 1838 году, а Евсевий уже помещал Вефиль, прежде называвшийся Луза, в двенадцати милях от Иерусалима по дороге в Неаполь. Раскопки У. Ф. Олбрайта и Дж. Л. Келсо в 1934 и 1954–1960 годах открыли обнесённый стеной город среднего бронзового века, разрушение позднего бронзового века и поселение железного века. Меньшинство вслед за Дэвидом Ливингстоном считает, что Вефиль лежал в Эль-Бире, в 3 км к юго-западу."
    - "Сегодня Бейтин — палестинская деревня к северо-востоку от Рамаллы и Эль-Биры; холм частично под её домами, а на краю — остатки византийской церкви и крестоносной башни. Позднейшую историю места рассказывает статья о Вефиле."
  uk:
    - "Луз було ханаанською назвою міста, яке Яків перейменував на Бет-Ел. Після сну про драбину «прозвав Яков урочище то Бетель; прежне прізвище городу було Луз». Назва може означати «мигдальне дерево». Повертаючись із Харану, «Прийшов же Яков у Луз, що в Канаан землї, се єсть Бетель», а в старості він сказав Йосипові: «Бог мій явивсь менї в Лусї, в Канаан землї, і благословив мене». Описи меж у Ісуса Навина ведуть лінію Єфрема «Від Бетеля йде границя до Лузи», а лінію Веніяміна — «на Луз, від полудня Луза або Бетеля»; перше формулювання змусило деяких учених думати, що святилище Бет-Елу стояло трохи осторонь від міста Луз. Коли дім Йосипа взяв місто, «сей город прозивався перше Лузом», а чоловік, що показав їм вхід, подався «у Гетійську землю» й збудував місто з тією самою назвою, яке ніколи не знайдено."
    - "Бет-Ел, а отже й Луз, зазвичай ототожнюють із Бейтіном, за 16 км на північ від Єрусалима, селом, що зберігає назву; Едвард Робінсон зробив це ототожнення 1838 р., а Євсевій уже розміщував Бет-Ел, колись званий Лузою, за дванадцять миль від Єрусалима на дорозі до Неаполя. Розкопки В. Ф. Олбрайта й Дж. Л. Келсо 1934 р. та 1954–1960 рр. виявили мурове місто середньої бронзової доби, руйнування пізньої бронзової та поселення залізної доби. Меншість, слідом за Девідом Лівінгстоном, стверджує, що Бет-Ел лежав натомість в ель-Біре, за 3 км на південний захід."
    - "Сьогодні Бейтін — палестинське село на північний схід від Рамалли й аль-Біре, з пагорбом, почасти під його будинками, та рештками візантійської церкви й вежі хрестоносців на краю. Стаття про Бет-Ел розповідає пізнішу історію місця."
  es:
    - "Luz era el nombre cananeo de la ciudad que Jacob rebautizó Betel. Tras su sueño de la escalera, «Y llamó el nombre de aquel lugar Beth-el, bien que Luz era el nombre de la ciudad primero». El nombre puede significar «almendro». A su regreso de Harán, «llegó Jacob á Luz, que está en tierra de Canaán», es decir Betel; ya anciano dijo a José: «El Dios Omnipotente me apareció en Luz en la tierra de Canaán, y me bendijo». Las fronteras de Josué trazan la línea de Efraín «de Beth-el sale á Luz» y la de Benjamín «por el lado de Luz (esta es Beth-el)»; la primera formulación lleva a algunos estudiosos a pensar que el santuario de Betel se alzaba algo apartado de Luz. Cuando la casa de José tomó la ciudad, esta «antes se llamaba Luz», y el hombre que les mostró la entrada se fue «á la tierra de los Hetheos» y edificó una ciudad del mismo nombre, nunca localizada."
    - "Betel, y por tanto Luz, se identifica generalmente con Beitin, a 16 km al norte de Jerusalén, una aldea que conserva el nombre; Edward Robinson hizo la identificación en 1838, y Eusebio ya situó Betel, antes llamada Luza, a doce millas de Jerusalén en el camino de Neápolis. Las excavaciones de W. F. Albright y J. L. Kelso en 1934 y 1954–60 hallaron una ciudad amurallada de la Edad del Bronce Medio, una destrucción del Bronce Final y un asentamiento de la Edad del Hierro. Una minoría, siguiendo a David Livingston, sostiene que Betel estaba más bien en el-Bireh, a 3 km al sudoeste."
    - "Hoy Beitin es una aldea palestina al nordeste de Ramala y al-Bireh, con el montículo en parte bajo sus casas y los restos de una iglesia bizantina y de una torre cruzada en su borde. El artículo sobre Betel cuenta la historia posterior del lugar."
  pt:
    - "Luz era o nome cananeu da cidade que Jacó rebatizou de Betel. Depois do sonho da escada, “chamou o nome daquele lugar de Betel, mas o nome da cidade era Luz no princípio”. O nome pode significar “amendoeira”. Voltando de Harã, “Jacó chegou a Luz (isto é, Betel), que fica na terra de Canaã”, e na velhice disse a José: “O Deus Todo-Poderoso apareceu a mim em Luz, na terra de Canaã, e me abençoou”. As descrições de fronteira de Josué traçam a linha de Efraim “de Betel para Luz” e a de Benjamim “para a encosta de Luz (também chamada Betel)”; a primeira formulação levou alguns estudiosos a pensar que o santuário de Betel ficava um pouco afastado da cidade de Luz. Quando a casa de José tomou a cidade, “O nome da cidade antes disso era Luz”, e o homem que lhes mostrou a entrada foi “para a terra dos hititas” e construiu uma cidade com o mesmo nome, nunca localizada."
    - "Betel, e portanto Luz, é geralmente identificada com Beitin, 16 km ao norte de Jerusalém, uma aldeia que conserva o nome; Edward Robinson fez a identificação em 1838, e Eusébio já situava Betel, antes chamada Luza, a doze milhas de Jerusalém, na estrada de Neápolis. As escavações de W. F. Albright e J. L. Kelso em 1934 e 1954–60 encontraram uma cidade murada da Idade do Bronze Médio, uma destruição do Bronze Recente e um povoado da Idade do Ferro. Uma minoria, seguindo David Livingston, sustenta que Betel ficava antes em el-Bireh, 3 km a sudoeste."
    - "Hoje Beitin é uma aldeia palestina a nordeste de Ramallah e al-Bireh, com o montículo em parte sob suas casas e os restos de uma igreja bizantina e de uma torre cruzada em sua orla. O verbete sobre Betel conta a história posterior do lugar."
  de:
    - "Lus war der kanaanäische Name der Stadt, die Jakob in Bethel umbenannte. Nach seinem Traum von der Leiter heißt es: „und hieß die Stätte Beth-El; zuvor aber hieß die Stadt Lus“. Der Name bedeutet vielleicht „Mandelbaum“. Bei der Rückkehr aus Haran „kam Jakob gen Lus im Lande Kanaan, das da Beth-El heißt“, und im Alter sagte er zu Josef: „Der allmächtige Gott erschien mir zu Lus im Lande Kanaan und segnete mich“. Josuas Grenzbeschreibungen führen die Linie Ephraims „von Beth-El heraus gen Lus“, die Benjamins „an der Seite her an Lus mittagwärts, das ist Beth-El“; wegen der ersten Fassung meinen manche, das Heiligtum von Bethel habe etwas abseits von Lus gestanden. Als das Haus Josefs Beth-El einnahm, „das vorzeiten Lus hieß“, zog der Mann, der ihnen den Zugang zeigte, „ins Land der Hethiter“ und baute eine gleichnamige Stadt, die nie gefunden wurde."
    - "Bethel und damit Lus wird allgemein mit Beitin gleichgesetzt, 16 km nördlich von Jerusalem, einem Dorf, das den Namen bewahrt; Edward Robinson nahm die Gleichsetzung 1838 vor, und schon Eusebius setzte Bethel, früher Luza genannt, zwölf Meilen von Jerusalem an der Straße nach Neapolis an. Die Ausgrabungen von W. F. Albright und J. L. Kelso 1934 und 1954–60 fanden eine ummauerte Stadt der Mittelbronzezeit, eine Zerstörung der Spätbronzezeit und eine Siedlung der Eisenzeit. Eine Minderheit, David Livingston folgend, vertritt die Ansicht, Bethel habe stattdessen in el-Bireh gelegen, 3 km südwestlich."
    - "Beitin ist heute ein palästinensisches Dorf nordöstlich von Ramallah und al-Bireh, mit dem Hügel teilweise unter seinen Häusern und den Resten einer byzantinischen Kirche und eines Kreuzfahrerturms an seinem Rand. Der Artikel über Bethel erzählt die spätere Geschichte des Ortes."
  fr:
    - "Luz était le nom cananéen de la ville que Jacob rebaptisa Béthel. Après son rêve de l’échelle, « il donna à ce lieu le nom de Béthel ; mais la ville s’appelait auparavant Luz ». Le nom signifie peut-être « amandier ». Au retour de Haran, « Jacob arriva … à Luz, qui est Béthel, dans le pays de Canaan », et dans sa vieillesse il dit à Joseph : « Le Dieu tout-puissant m’est apparu à Luz, dans le pays de Canaan, et il m’a béni. » Chez Josué, la limite d’Éphraïm va « de Béthel à Luz » et celle de Benjamin passe « au midi de Luz, qui est Béthel » ; la première formule a conduit certains savants à penser que le sanctuaire de Béthel se tenait un peu à l’écart de la ville de Luz. Quand la maison de Joseph prit la ville, qui « s’appelait autrefois Luz », l’homme qui leur montra par où entrer partit « dans le pays des Héthiens » et y bâtit une ville du même nom, jamais située."
    - "Béthel, et donc Luz, est généralement identifiée à Beitin, à 16 km au nord de Jérusalem, village qui garde le nom ; Edward Robinson fit l’identification en 1838, et Eusèbe plaçait déjà Béthel, appelée autrefois Luza, à douze milles de Jérusalem sur la route de Néapolis. Les fouilles de W. F. Albright et J. L. Kelso en 1934 et 1954–1960 ont mis au jour une ville fortifiée du Bronze moyen, une destruction du Bronze récent et un établissement de l’âge du Fer. Une minorité, à la suite de David Livingston, soutient que Béthel se trouvait plutôt à el-Bireh, à 3 km au sud-ouest."
    - "Aujourd’hui, Beitin est un village palestinien au nord-est de Ramallah et d’al-Bireh, avec le tertre en partie sous ses maisons et, à sa lisière, les restes d’une église byzantine et d’une tour des croisés. L’article sur Béthel raconte l’histoire plus tardive du lieu."
