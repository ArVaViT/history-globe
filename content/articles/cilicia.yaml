# Overview article (ADR 0007). Mainstream facts only; the changes in the province's status under Rome are given in outline.
id: cilicia
place: ad63819
title:
  en: "Cilicia"
  ru: "Киликия"
  uk: "Кілікія"
  es: "Cilicia"
  pt: "Cilícia"
  de: "Kilikien"
  fr: "Cilicie"
  it: "Cilicia"
  pl: "Cylicja"
  nl: "Cilicië"
