# Overview article (ADR 0007). Mainstream facts only; the changes in the province's status under Rome are given in outline.
id: cilicia
place: ad63819
title:
  en: "Cilicia"
  ru: "Киликия"
  uk: "Кілікія"
  es: "Cilicia"
  pt: "Cilícia"
  de: "Kilikien"
  fr: "Cilicie"
body:
  en:
    - "Cilicia is the south-eastern corner of Asia Minor, between the Taurus mountains and the sea. Its western part, Rough Cilicia, is a mountainous coast of small harbours; its eastern part, Cilicia of the Plain, is the rich lowland around Tarsus, Adana and Mopsuestia, watered by the Cydnus, Sarus and Pyramus. Two passes bind it to the world: the Cilician Gates through the Taurus to Anatolia, and the Syrian Gates over the Amanus to Antioch. The Hittites knew the plain as Kizzuwatna and the Assyrians as Que; under Persia it was a satrapy ruled by native kings called Syennesis, and Xenophon describes Cyrus the Younger marching through the Gates to Tarsus in 401 BC. Alexander crossed Cilicia in 333 BC and defeated Darius at Issus, on its eastern border."
    - "The Seleucids held the plain; the rough coast became the lair of pirates until Pompey swept them from the sea in 67 BC. Rome had kept a province called Cilicia since about 100 BC; in 64 BC Pompey added the plain to it, and Cicero governed it in 51–50 BC. Under Augustus the eastern plain was attached to the province of Syria, which is why the New Testament speaks of “Syria and Cilicia” together, and only Vespasian, about AD 72, made the whole of Cilicia a single province. Tarsus, its capital, was a city of schools; Strabo wrote that its zeal for philosophy and learning surpassed even Athens and Alexandria."
    - "Paul was “a Jew of Tarsus, a city in Cilicia, a citizen of no mean city”, and men of Cilicia disputed with Stephen in the Jerusalem synagogue. After his conversion the brethren sent Paul from Caesarea to Tarsus, and he spent years in “the regions of Syria and Cilicia” until Barnabas fetched him to Antioch. The letter of the council in Jerusalem was addressed to the Gentile brethren “in Antioch and Syria and Cilicia”, and Paul “went through Syria and Cilicia, confirming the churches” at the start of his second journey. Felix asked of what province the prisoner was and learned that he was of Cilicia; on the voyage to Rome Paul “sailed over the sea of Cilicia and Pamphylia” to Myra. The coarse goat-hair cloth of the region was called cilicium, and tentmaking was Paul's trade."
    - "Cilicia was a stronghold of Christianity in late antiquity and, in the twelfth to fourteenth centuries, the seat of the Armenian kingdom of Cilicia. Today it is the Çukurova of southern Turkey, with the cities of Adana, Mersin and Tarsus, and the ruins of Anazarbus, Soli and Castabala along the plain."
  ru:
    - "Киликия — юго-восточный угол Малой Азии между горами Тавр и морем. Её западная часть, Киликия Суровая, — гористый берег с малыми гаванями; восточная, Киликия Равнинная, — богатая низменность вокруг Тарса, Аданы и Мопсуестии, орошаемая Кидном, Саром и Пирамом. Два прохода связывают её с миром: Киликийские ворота через Тавр в Анатолию и Сирийские ворота через Аман в Антиохию. Хетты знали равнину как Киццуватну, ассирийцы — как Куэ; при Персах это была сатрапия под властью местных царей, носивших имя Сиеннесий, и Ксенофонт описывает, как Кир Младший в 401 г. до н. э. прошёл через Ворота к Тарсу. Александр пересёк Киликию в 333 г. до н. э. и разбил Дария при Иссе, на её восточной границе."
    - "Равнину держали Селевкиды; суровый берег стал гнездом пиратов, пока Помпей в 67 г. до н. э. не очистил от них море. Провинция Киликия была у Рима примерно с 100 г. до н. э.; в 64 г. до н. э. Помпей присоединил к ней равнину, а в 51–50 гг. до н. э. ею управлял Цицерон. При Августе восточная равнина была присоединена к провинции Сирия, отчего Новый Завет говорит о «Сирии и Киликии» вместе, и лишь Веспасиан около 72 г. н. э. сделал всю Киликию единой провинцией. Тарс, её столица, был городом школ; Страбон писал, что рвением к философии и учёности он превзошёл даже Афины и Александрию."
    - "Павел был «Иудеянин, Тарсянин, гражданин небезызвестного Киликийского города», и люди из Киликии спорили со Стефаном в иерусалимской синагоге. После обращения братья отправили Павла из Кесарии в Тарс; «отошел я в страны Сирии и Киликии», пишет он сам, и провёл там годы, пока Варнава не привёл его в Антиохию. Послание собора в Иерусалиме было обращено к братьям из язычников, «находящимся в Антиохии, Сирии и Киликии», а в начале второго путешествия Павел «проходил Сирию и Киликию, утверждая церкви». Феликс спросил, из какой области узник, и узнал, что из Киликии; на пути в Рим Павел, «переплыв море против Киликии и Памфилии», прибыл в Миры. Грубая ткань из козьей шерсти, которую здесь делали, звалась киликием, а Павел по ремеслу был делателем палаток."
    - "В поздней античности Киликия была оплотом христианства, а в XII–XIV веках — средоточием Киликийского армянского царства. Сегодня это Чукурова на юге Турции с городами Адана, Мерсин и Тарс и развалинами Аназарба, Сол и Кастабалы вдоль равнины."
  uk:
    - "Кілікія — південно-східний куток Малої Азії, між горами Тавр і морем. Її західна частина, Гориста Кілікія, — гориста берегова смуга з малими гаванями; східна, Рівнинна Кілікія, — багата низовина навколо Тарса, Адани та Мопсуестії, зрошувана Кідном, Саром і Пірамісом. Два перевали пов'язують її зі світом: Кілікійські ворота крізь Тавр до Анатолії та Сирійські ворота над Аманом до Антіохії. Хетти знали рівнину як Кіццуватну, а ассирійці — як Куе; за Персії вона була сатрапією, якою правили тубільні царі на ім'я Сієннесіс, а Ксенофонт описує, як Кір Молодший у 401 р. до н. е. пройшов крізь Ворота до Тарса. Александр перетнув Кілікію в 333 р. до н. е. й розбив Дарія при Іссі на її східному кордоні."
    - "Селевкіди володіли рівниною; гориста берегова смуга стала лігвом піратів, доки Помпей не очистив від них море в 67 р. до н. е. Рим тримав провінцію під назвою Кілікія приблизно від 100 р. до н. е.; у 64 р. до н. е. Помпей приєднав до неї рівнину, а Цицерон керував нею в 51–50 рр. до н. е. За Августа східну рівнину було приєднано до провінції Сирія, тому Новий Заповіт і говорить про «Сирию і Киликию» разом, і лише Веспасіан близько 72 р. н. е. зробив усю Кілікію єдиною провінцією. Тарс, її столиця, був містом шкіл; Страбон писав, що його запал до філософії та науки перевершував навіть Афіни й Александрію."
    - "Павло казав про себе: «Я чоловік Жидовин Тарсийський, славного города Киликиї житель», а кілікійці сперечалися зі Стефаном в єрусалимській синагозі. Після його навернення брати відіслали Павла з Кесарії до Тарса, і він провів роки, як сам пише: «ходив я в сторони Сирські і Киликийські», доки Варнава не привів його до Антіохії. Лист єрусалимського собору було адресовано братам з поган, «що в Антиохиї, і Сириї і Киликиї», а на початку другої подорожі Павло «проходив Сирию і Киликию, утверджаючи церкви». Феликс спитав, з якої провінції в'язень, і дізнався, що з Кілікії; під час плавання до Риму корабель з Павлом, «перепливши море, що проти Киликиї та Памфилиї», прибув до Мир Лікійських. Грубу козячу тканину цього краю називали cilicium, а виготовлення наметів було ремеслом Павла."
    - "Кілікія була твердинею християнства в пізню давнину, а в XII–XIV ст. — осередком Вірменського царства Кілікії. Сьогодні це Чукурова на півдні Туреччини, з містами Адана, Мерсін і Тарс та руїнами Анаварзи, Солів і Кастабали вздовж рівнини."
  es:
    - "Cilicia es el rincón sudoriental de Asia Menor, entre los montes Tauro y el mar. Su parte occidental, la Cilicia Traquea, es una costa montañosa de pequeños puertos; su parte oriental, la Cilicia Campestre, es la rica llanura en torno a Tarso, Adana y Mopsuestia, regada por el Cidno, el Saro y el Píramo. Dos pasos la unen con el mundo: las Puertas Cilicias a través del Tauro hacia Anatolia, y las Puertas Sirias sobre el Amano hacia Antioquía. Los hititas conocían la llanura como Kizzuwatna y los asirios como Que; bajo Persia fue una satrapía gobernada por reyes nativos llamados Siénesis, y Jenofonte describe a Ciro el Joven marchando por las Puertas hasta Tarso en el 401 a. C. Alejandro cruzó Cilicia en el 333 a. C. y derrotó a Darío en Iso, en su frontera oriental."
    - "Los seléucidas poseyeron la llanura; la costa abrupta se convirtió en guarida de piratas hasta que Pompeyo los barrió del mar en el 67 a. C. Roma mantenía una provincia llamada Cilicia desde alrededor del 100 a. C.; en el 64 a. C. Pompeyo le añadió la llanura, y Cicerón la gobernó en 51–50 a. C. Bajo Augusto la llanura oriental se anexó a la provincia de Siria, por lo que el Nuevo Testamento habla de Siria y Cilicia juntas, y solo Vespasiano, hacia el 72 d. C., hizo de toda Cilicia una única provincia. Tarso, su capital, era una ciudad de escuelas; Estrabón escribió que su celo por la filosofía y el saber superaba incluso al de Atenas y Alejandría."
    - "Pablo era «hombre Judío, ciudadano de Tarso, ciudad no obscura de Cilicia», y hombres de Cilicia disputaron con Esteban en la sinagoga de Jerusalén. Tras su conversión, los hermanos enviaron a Pablo desde Cesarea a Tarso, y pasó años en «las partes de Siria y de Cilicia» hasta que Bernabé lo trajo a Antioquía. La carta del concilio de Jerusalén iba dirigida a los hermanos de los gentiles «en Antioquía, y en Siria, y en Cilicia», y Pablo «anduvo la Siria y la Cilicia, confirmando á las iglesias» al comienzo de su segundo viaje. Félix preguntó de qué provincia era el preso y supo que era de Cilicia; en el viaje a Roma, Pablo «habiendo pasado la mar de Cilicia y Pamphylia» llegó a Mira. El burdo tejido de pelo de cabra de la región se llamaba cilicium, y hacer tiendas era el oficio de Pablo."
    - "Cilicia fue un baluarte del cristianismo en la Antigüedad tardía y, entre los siglos XII y XIV, sede del reino armenio de Cilicia. Hoy es la Çukurova del sur de Turquía, con las ciudades de Adana, Mersin y Tarso, y las ruinas de Anazarbo, Soli y Castabala a lo largo de la llanura."
  pt:
    - "A Cilícia é o canto sudeste da Ásia Menor, entre as montanhas do Touro e o mar. Sua parte ocidental, a Cilícia Traqueia, é uma costa montanhosa de pequenos portos; a oriental, a Cilícia Campestre, é a rica planície em torno de Tarso, Adana e Mopsuéstia, regada pelo Cidno, o Saro e o Píramo. Duas passagens a ligam ao mundo: as Portas da Cilícia, através do Touro, para a Anatólia, e as Portas Sírias, sobre o Amano, para Antioquia. Os hititas conheciam a planície como Kizzuwatna e os assírios como Que; sob a Pérsia foi uma satrapia governada por reis nativos chamados Siênesis, e Xenofonte descreve Ciro, o Jovem, marchando pelas Portas até Tarso em 401 a.C. Alexandre atravessou a Cilícia em 333 a.C. e derrotou Dario em Isso, em sua fronteira oriental."
    - "Os selêucidas mantiveram a planície; a costa rochosa tornou-se covil de piratas até que Pompeu os varreu do mar em 67 a.C. Roma mantinha uma província chamada Cilícia desde cerca de 100 a.C.; em 64 a.C. Pompeu acrescentou-lhe a planície, e Cícero a governou em 51–50 a.C. Sob Augusto, a planície oriental foi anexada à província da Síria, razão pela qual o Novo Testamento fala de Síria e Cilícia juntas, e só Vespasiano, por volta de 72 d.C., fez de toda a Cilícia uma única província. Tarso, sua capital, era cidade de escolas; Estrabão escreveu que seu zelo pela filosofia e pelo saber superava até o de Atenas e Alexandria."
    - "Paulo era “um judeu de Tarso, na Cilícia, cidadão de uma cidade importante”, e homens da Cilícia discutiram com Estêvão na sinagoga de Jerusalém. Depois de sua conversão, os irmãos enviaram Paulo de Cesareia a Tarso, e ele passou anos nas “regiões da Síria e da Cilícia” até que Barnabé o buscou para Antioquia. A carta do concílio de Jerusalém foi dirigida aos irmãos dentre os gentios “em Antioquia, na Síria e na Cilícia”, e Paulo “passou pela Síria e pela Cilícia, fortalecendo as igrejas” no início da segunda viagem. Félix perguntou de que província era o prisioneiro e soube que ele era da Cilícia; na viagem a Roma, Paulo e os seus atravessaram “o mar ao longo da Cilícia e da Panfília” até Mira. O tecido grosseiro de pelo de cabra da região chamava-se cilício, e fabricar tendas era o ofício de Paulo."
    - "A Cilícia foi um baluarte do cristianismo na Antiguidade tardia e, nos séculos XII a XIV, a sede do Reino Armênio da Cilícia. Hoje é a Çukurova do sul da Turquia, com as cidades de Adana, Mersin e Tarso e as ruínas de Anazarbo, Soli e Castabala ao longo da planície."
  de:
    - "Kilikien ist die südöstliche Ecke Kleinasiens, zwischen dem Taurusgebirge und dem Meer. Sein westlicher Teil, das Raue Kilikien, ist eine gebirgige Küste mit kleinen Häfen; sein östlicher Teil, das Ebene Kilikien, ist das reiche Tiefland um Tarsus, Adana und Mopsuestia, bewässert von Kydnos, Saros und Pyramos. Zwei Pässe verbinden es mit der Welt: die Kilikischen Pforten durch den Taurus nach Anatolien und die Syrischen Pforten über den Amanus nach Antiochia. Die Hethiter kannten die Ebene als Kizzuwatna und die Assyrer als Que; unter den Persern war sie eine Satrapie, die von einheimischen Königen namens Syennesis regiert wurde, und Xenophon beschreibt, wie Kyros der Jüngere 401 v. Chr. durch die Pforten nach Tarsus zog. Alexander durchquerte Kilikien 333 v. Chr. und besiegte Darius bei Issos an seiner Ostgrenze."
    - "Die Seleukiden hielten die Ebene; die raue Küste wurde zum Schlupfwinkel von Piraten, bis Pompeius sie 67 v. Chr. vom Meer fegte. Rom unterhielt seit etwa 100 v. Chr. eine Provinz namens Kilikien; 64 v. Chr. fügte Pompeius ihr die Ebene hinzu, und Cicero verwaltete sie 51–50 v. Chr. Unter Augustus wurde die östliche Ebene der Provinz Syrien angeschlossen, weshalb das Neue Testament „Syrien und Zilizien“ zusammen nennt, und erst Vespasian machte um 72 n. Chr. ganz Kilikien zu einer einzigen Provinz. Tarsus, seine Hauptstadt, war eine Stadt der Schulen; Strabon schrieb, ihr Eifer für Philosophie und Bildung übertreffe sogar Athen und Alexandria."
    - "Paulus war „ein jüdischer Mann von Tarsus, ein Bürger einer namhaften Stadt in Zilizien“, und Männer aus Kilikien stritten in der Synagoge zu Jerusalem mit Stephanus. Nach seiner Bekehrung schickten die Brüder Paulus von Caesarea nach Tarsus, und er kam „in die Länder Syrien und Zilizien“, wo er Jahre verbrachte, bis Barnabas ihn nach Antiochia holte. Das Schreiben des Konzils in Jerusalem ging an die Brüder aus den Heiden „zu Antiochien und Syrien und Zilizien“, und Paulus zog „durch Syrien und Zilizien und stärkte die Gemeinden“ zu Beginn seiner zweiten Reise. Felix erfuhr auf seine Frage nach der Provinz des Gefangenen, dass er aus Kilikien stamme; auf der Reise nach Rom heißt es: „und schifften durch das Meer bei Zilizien und Pamphylien und kamen gen Myra in Lyzien“. Das grobe Ziegenhaartuch der Gegend hieß cilicium, und Zeltmacher war Paulus’ Handwerk."
    - "Kilikien war in der Spätantike eine Hochburg des Christentums und im 12. bis 14. Jahrhundert der Sitz des armenischen Königreichs Kilikien. Heute ist es die Çukurova im Süden der Türkei mit den Städten Adana, Mersin und Tarsus und den Ruinen von Anazarbos, Soloi und Kastabala entlang der Ebene."
  fr:
    - "La Cilicie est le coin sud-est de l’Asie Mineure, entre les monts du Taurus et la mer. Sa partie occidentale, la Cilicie Trachée, est une côte montagneuse de petits ports ; sa partie orientale, la Cilicie Plane, est la riche plaine autour de Tarse, d’Adana et de Mopsueste, arrosée par le Cydnus, le Sarus et le Pyramos. Deux passes la relient au monde : les Portes ciliciennes à travers le Taurus vers l’Anatolie, et les Portes syriennes par-dessus l’Amanus vers Antioche. Les Hittites connaissaient la plaine sous le nom de Kizzuwatna et les Assyriens sous celui de Que ; sous la Perse, c’était une satrapie gouvernée par des rois indigènes appelés Syennésis, et Xénophon décrit Cyrus le Jeune traversant les Portes jusqu’à Tarse en 401 av. J.-C. Alexandre traversa la Cilicie en 333 av. J.-C. et vainquit Darius à Issos, à sa frontière orientale."
    - "Les Séleucides tenaient la plaine ; la côte rocheuse devint le repaire des pirates jusqu’à ce que Pompée les balaie de la mer en 67 av. J.-C. Rome possédait une province nommée Cilicie depuis 100 av. J.-C. environ ; en 64 av. J.-C., Pompée y ajouta la plaine, et Cicéron la gouverna en 51–50 av. J.-C. Sous Auguste, la plaine orientale fut rattachée à la province de Syrie, d’où le fait que le Nouveau Testament parle ensemble de « la Syrie et la Cilicie », et seul Vespasien, vers 72 apr. J.-C., fit de toute la Cilicie une province unique. Tarse, sa capitale, était une ville d’écoles ; Strabon écrivit que son zèle pour la philosophie et le savoir surpassait même Athènes et Alexandrie."
    - "Paul était « Juif, de Tarse en Cilicie, citoyen d’une ville qui n’est pas sans importance », et des hommes de Cilicie disputèrent avec Étienne dans la synagogue de Jérusalem. Après sa conversion, les frères envoyèrent Paul de Césarée à Tarse, et il passa des années « dans les contrées de la Syrie et de la Cilicie » jusqu’à ce que Barnabas le fasse venir à Antioche. La lettre du concile de Jérusalem s’adressait aux frères d’entre les païens « à Antioche, en Syrie, et en Cilicie », et Paul « parcourut la Syrie et la Cilicie, fortifiant les Églises » au début de son deuxième voyage. Félix demanda de quelle province était le prisonnier : de Cilicie ; en route vers Rome, Paul, « après avoir traversé la mer qui baigne la Cilicie et la Pamphylie », arriva à Myra. L’étoffe grossière en poil de chèvre de la région s’appelait cilicium, et Paul était fabricant de tentes."
    - "La Cilicie fut un bastion du christianisme dans l’Antiquité tardive et, du XIIe au XIVe siècle, le siège du royaume arménien de Cilicie. Aujourd’hui, c’est la Çukurova, dans le sud de la Turquie, avec les villes d’Adana, de Mersin et de Tarse, et les ruines d’Anazarbe, de Soloi et de Castabala le long de la plaine."
