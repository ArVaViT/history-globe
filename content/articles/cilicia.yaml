# Overview article (ADR 0007). Mainstream facts only; the changes in the province's status under Rome are given in outline.
id: cilicia
place: ad63819
title:
  en: "Cilicia"
  ru: "Киликия"
body:
  en:
    - "Cilicia is the south-eastern corner of Asia Minor, between the Taurus mountains and the sea. Its western part, Rough Cilicia, is a mountainous coast of small harbours; its eastern part, Cilicia of the Plain, is the rich lowland around Tarsus, Adana and Mopsuestia, watered by the Cydnus, Sarus and Pyramus. Two passes bind it to the world: the Cilician Gates through the Taurus to Anatolia, and the Syrian Gates over the Amanus to Antioch. The Hittites knew the plain as Kizzuwatna and the Assyrians as Que; under Persia it was a satrapy ruled by native kings called Syennesis, and Xenophon describes Cyrus the Younger marching through the Gates to Tarsus in 401 BC. Alexander crossed Cilicia in 333 BC and defeated Darius at Issus, on its eastern border."
    - "The Seleucids held the plain; the rough coast became the lair of pirates until Pompey swept them from the sea in 67 BC. Rome had kept a province called Cilicia since about 100 BC; in 64 BC Pompey added the plain to it, and Cicero governed it in 51–50 BC. Under Augustus the eastern plain was attached to the province of Syria, which is why the New Testament speaks of “Syria and Cilicia” together, and only Vespasian, about AD 72, made the whole of Cilicia a single province. Tarsus, its capital, was a city of schools; Strabo wrote that its zeal for philosophy and learning surpassed even Athens and Alexandria."
    - "Paul was “a Jew of Tarsus, a city in Cilicia, a citizen of no mean city”, and men of Cilicia disputed with Stephen in the Jerusalem synagogue. After his conversion the brethren sent Paul from Caesarea to Tarsus, and he spent years in “the regions of Syria and Cilicia” until Barnabas fetched him to Antioch. The letter of the council in Jerusalem was addressed to the Gentile brethren “in Antioch and Syria and Cilicia”, and Paul “went through Syria and Cilicia, confirming the churches” at the start of his second journey. Felix asked of what province the prisoner was and learned that he was of Cilicia; on the voyage to Rome Paul “sailed over the sea of Cilicia and Pamphylia” to Myra. The coarse goat-hair cloth of the region was called cilicium, and tentmaking was Paul's trade."
    - "Cilicia was a stronghold of Christianity in late antiquity and, in the twelfth to fourteenth centuries, the seat of the Armenian kingdom of Cilicia. Today it is the Çukurova of southern Turkey, with the cities of Adana, Mersin and Tarsus, and the ruins of Anazarbus, Soli and Castabala along the plain."
  ru:
    - "Киликия — юго-восточный угол Малой Азии между горами Тавр и морем. Её западная часть, Киликия Суровая, — гористый берег с малыми гаванями; восточная, Киликия Равнинная, — богатая низменность вокруг Тарса, Аданы и Мопсуестии, орошаемая Кидном, Саром и Пирамом. Два прохода связывают её с миром: Киликийские ворота через Тавр в Анатолию и Сирийские ворота через Аман в Антиохию. Хетты знали равнину как Киццуватну, ассирийцы — как Куэ; при Персах это была сатрапия под властью местных царей, носивших имя Сиеннесий, и Ксенофонт описывает, как Кир Младший в 401 г. до н. э. прошёл через Ворота к Тарсу. Александр пересёк Киликию в 333 г. до н. э. и разбил Дария при Иссе, на её восточной границе."
    - "Равнину держали Селевкиды; суровый берег стал гнездом пиратов, пока Помпей в 67 г. до н. э. не очистил от них море. Провинция Киликия была у Рима примерно с 100 г. до н. э.; в 64 г. до н. э. Помпей присоединил к ней равнину, а в 51–50 гг. до н. э. ею управлял Цицерон. При Августе восточная равнина была присоединена к провинции Сирия, отчего Новый Завет говорит о «Сирии и Киликии» вместе, и лишь Веспасиан около 72 г. н. э. сделал всю Киликию единой провинцией. Тарс, её столица, был городом школ; Страбон писал, что рвением к философии и учёности он превзошёл даже Афины и Александрию."
    - "Павел был «Иудеянин, Тарсянин, гражданин небезызвестного Киликийского города», и люди из Киликии спорили со Стефаном в иерусалимской синагоге. После обращения братья отправили Павла из Кесарии в Тарс; «отошел я в страны Сирии и Киликии», пишет он сам, и провёл там годы, пока Варнава не привёл его в Антиохию. Послание собора в Иерусалиме было обращено к братьям из язычников, «находящимся в Антиохии, Сирии и Киликии», а в начале второго путешествия Павел «проходил Сирию и Киликию, утверждая церкви». Феликс спросил, из какой области узник, и узнал, что из Киликии; на пути в Рим Павел, «переплыв море против Киликии и Памфилии», прибыл в Миры. Грубая ткань из козьей шерсти, которую здесь делали, звалась киликием, а Павел по ремеслу был делателем палаток."
    - "В поздней античности Киликия была оплотом христианства, а в XII–XIV веках — средоточием Киликийского армянского царства. Сегодня это Чукурова на юге Турции с городами Адана, Мерсин и Тарс и развалинами Аназарба, Сол и Кастабалы вдоль равнины."
