body:
  en:
    - "Zoar, earlier called Bela, was the fifth of the cities of the plain, with Sodom, Gomorrah, Admah and Zeboiim, whose kings fought in the vale of Siddim. When Lot fled from Sodom he begged to be spared the mountains: “this city is near to flee unto, and it is a little one”, and so it was spared and named Zoar, “little”; “The sun was risen upon the earth when Lot entered into Zoar”. Yet he feared to stay and went up to a cave in the mountain, where his daughters bore Moab and Ammon. Lot had first seen the plain “well watered every where”, like the garden of the Lord, “as thou comest unto Zoar”, and Moses from Pisgah saw the valley of Jericho “unto Zoar”. In Isaiah and Jeremiah Zoar is a Moabite town; in Isaiah the fugitives of Moab flee to it."
    - "Where Zoar lay depends on where Sodom lay, and that is disputed. Josephus, Eusebius and the Madaba mosaic map of the sixth century all put Zoara at the southern end of the Dead Sea, and the usual identification is the oasis of Ghor es-Safi in Jordan, where the Wadi Hasa comes down; the other candidates on this map are nearby mounds such as Tell esh-Sheikh Isa and the sugar mills of Tawahin es-Sukkar, the vale of Siddim under the shallow southern basin, the mouth of the Arnon, and the plain north of the Dead Sea favoured by those who look for Sodom there."
    - "The southern site at least has a long history. Byzantine Zoara had a bishop, a Roman garrison in Eusebius' day, and a cemetery with hundreds of Greek tombstones and Jewish Aramaic ones dated by the years since the destruction of the Temple. On the hill above, at Deir Ain Abata, Konstantinos Politis excavated in 1988–2003 a monastery built around a cave that pilgrims venerated as Lot's; the Madaba map shows the sanctuary of Saint Lot beside Zoara. In the Middle Ages Zughar was known for its dates, indigo and sugar."
    - "Today Ghor es-Safi is a farming town of potash works and tomato fields at the lowest inhabited spot on earth, with a Museum at the Lowest Place on Earth, opened in 2012 beside the monastery of Lot."
  ru:
    - "Сигор, прежде называвшийся Бела, был пятым из городов долины, вместе с Содомом, Гоморрой, Адмой и Севоимом, чьи цари сражались в долине Сиддим. Убегая из Содома, Лот просил избавить его от гор: «ближе бежать в сей город, он же мал», и город был пощажён и назван Сигор, «малый»; «Солнце взошло над землею, и Лот пришел в Сигор». Но он побоялся остаться и ушёл в пещеру в горе, где дочери родили ему Моава и Аммона. Прежде Лот видел, что вся окрестность Иорданская «до Сигора орошалась водою, как сад Господень», а Моисей с Фасги видел равнину долины Иерихона «до Сигора». У Исаии и Иеремии Сигор — моавитский город; у Исаии к нему бегут беглецы Моава."
    - "Где лежал Сигор, зависит от того, где лежал Содом, а это спорно. Иосиф Флавий, Евсевий и мозаичная карта из Мадабы VI века помещают Зоару у южного конца Мёртвого моря, и обычное отождествление — оазис Гор-эс-Сафи в Иордании, куда спускается Вади-Хаса; другие кандидаты на этой карте — соседние холмы вроде Телль-эш-Шейх-Исы и сахарные мельницы Тавахин-эс-Суккар, долина Сиддим под мелкой южной частью моря, устье Арнона и равнина к северу от Мёртвого моря, которую предпочитают ищущие там Содом."
    - "У южного места, по крайней мере, долгая история. У византийской Зоары были епископ, римский гарнизон во дни Евсевия и кладбище с сотнями греческих надгробий и иудейскими арамейскими, датированными годами от разрушения Храма. На холме выше, в Дейр-Айн-Абата, Константинос Политис в 1988–2003 годах раскопал монастырь, построенный вокруг пещеры, которую паломники чтили как пещеру Лота; карта из Мадабы показывает святилище святого Лота рядом с Зоарой. В Средние века Зугар славился финиками, индиго и сахаром."
    - "Сегодня Гор-эс-Сафи — земледельческий городок с поташными заводами и томатными полями в самом низком обитаемом месте земли, с Музеем самого низкого места на земле, открытым в 2012 году рядом с монастырём Лота."
  uk:
    - "Сігор, раніше званий Бела, був п’ятим із міст рівнини, з Содомом, Гоморрою, Адмою та Цевоїмом, чиї царі билися в долині Сиддим. Коли Лот утікав із Содому, він просив пощадити його від гір: «споглянь городок сей близько, побіжу я туди; він маленький», і місто було збережене й названо Сігор, «малий»; «Сонце зійшло вже над землю, як Лот увійшов у Сигор». Та він побоявся лишитися й пішов до печери в горі, де його доньки народили Моава й Аммона. Лот спершу бачив рівнину, що «вся до Сигора наповнена була водою, як сад Господень», а Мойсей із Фасги бачив долину Єрихона «до Зоару». В Ісаї та Єремії Сігор — моавитське місто; в Ісаї до нього біжать моавські втікачі."
    - "Де лежав Сігор, залежить від того, де лежав Содом, а це оспорюється. Йосиф Флавій, Євсевій і мозаїчна карта з Мадаби VI століття ставлять Зоару на південному краю Мертвого моря, і звичайне ототожнення — оаза Гор-ес-Сафі в Йорданії, де спускається Вади-Хаса; інші кандидати на цій мапі — сусідні пагорби, як-от Телль-еш-Шейх-Іса і цукрові млини Таваін-ес-Суккар, долина Сиддим під мілким південним басейном, гирло Арнону та рівнина на північ від Мертвого моря, якій віддають перевагу ті, хто шукає там Содом."
    - "Південне місце принаймні має довгу історію. Візантійська Зоара мала єпископа, римський гарнізон за днів Євсевія і цвинтар із сотнями грецьких надгробків та юдейсько-арамейських, датованих роками від руйнування Храму. На пагорбі вище, у Дейр-Айн-Абаті, Константінос Політіс розкопав у 1988–2003 роках монастир, збудований навколо печери, яку прочани шанували як Лотову; мапа з Мадаби показує святилище святого Лота біля Зоари. У середньовіччі Зугар славився фініками, індиго та цукром."
    - "Нині Гор-ес-Сафі — землеробське містечко з калійними заводами і томатними полями на найнижчому заселеному місці землі, з Музеєм на найнижчому місці землі, відкритим 2012 року біля монастиря Лота."
  es:
    - "Zoar, llamada antes Bela, era la quinta de las ciudades de la llanura, con Sodoma, Gomorra, Adma y Zeboim, cuyos reyes lucharon en el valle de Siddim. Cuando Lot huyó de Sodoma, rogó que se le ahorraran los montes: «esta ciudad está cerca para huir allá, la cual es pequeña», y así fue perdonada y llamada Zoar, «pequeña»; «El sol salía sobre la tierra, cuando Lot llegó á Zoar». Sin embargo, temió quedarse y subió a una cueva del monte, donde sus hijas dieron a luz a Moab y Amón. Lot había visto primero la llanura que «toda ella era de riego», como el huerto del Señor, «entrando en Zoar», y Moisés desde Pisga vio el valle de Jericó «hasta Soar». En Isaías y Jeremías Zoar es una ciudad moabita; en Isaías los fugitivos de Moab huyen a ella."
    - "Dónde estaba Zoar depende de dónde estuviera Sodoma, y eso se discute. Josefo, Eusebio y el mapa-mosaico de Madaba del siglo VI sitúan todos Zoara en el extremo sur del mar Muerto, y la identificación habitual es el oasis de Ghor es-Safi, en Jordania, donde baja el Wadi Hasa; los otros candidatos en este mapa son montículos cercanos como Tell esh-Sheikh Isa y los ingenios azucareros de Tawahin es-Sukkar, el valle de Sidim bajo la poco profunda cuenca meridional, la desembocadura del Arnón y la llanura al norte del mar Muerto que prefieren quienes buscan allí Sodoma."
    - "El sitio meridional tiene al menos una larga historia. La Zoara bizantina tuvo un obispo, una guarnición romana en tiempos de Eusebio y un cementerio con cientos de lápidas griegas y otras arameas judías fechadas por los años desde la destrucción del Templo. En la colina de encima, en Deir Ain Abata, Konstantinos Politis excavó en 1988–2003 un monasterio construido en torno a una cueva que los peregrinos veneraban como la de Lot; el mapa de Madaba muestra el santuario de San Lot junto a Zoara. En la Edad Media Zughar era conocida por sus dátiles, su añil y su azúcar."
    - "Hoy Ghor es-Safi es una población agrícola de plantas de potasa y campos de tomates en el lugar habitado más bajo de la tierra, con un Museo en el Lugar más Bajo de la Tierra, inaugurado en 2012 junto al monasterio de Lot."
  pt:
    - "Zoar, antes chamada Belá, era a quinta das cidades da planície, com Sodoma, Gomorra, Admá e Zeboim, cujos reis lutaram no vale de Sidim. Quando Ló fugiu de Sodoma, pediu que lhe poupassem os montes: “esta cidade está perto para fugir, e é pequena”, e assim foi poupada e chamada Zoar, “pequena”; “O sol havia nascido sobre a terra quando Ló chegou a Zoar”. Mas temeu ficar e subiu a uma caverna no monte, onde suas filhas geraram Moabe e Amom. Ló vira primeiro a planície “bem regada em toda parte”, como o jardim do SENHOR, “em direção a Zoar”, e Moisés, do Pisga, viu a planície do vale de Jericó “até Zoar”. Em Isaías e Jeremias, Zoar é uma cidade moabita; em Isaías, os fugitivos de Moabe fogem para ela."
    - "Onde Zoar ficava depende de onde ficava Sodoma, e isso é discutido. Josefo, Eusébio e o mapa em mosaico de Madaba, do século VI, põem Zoara na extremidade sul do Mar Morto, e a identificação habitual é o oásis de Ghor es-Safi, na Jordânia, onde desce o Wadi Hasa; os outros candidatos neste mapa são montes próximos como Tell esh-Sheikh Isa e as usinas de açúcar de Tawahin es-Sukkar, o vale de Sidim sob a rasa bacia sul, a foz do Arnom e a planície ao norte do Mar Morto, preferida pelos que ali procuram Sodoma."
    - "O sítio do sul, ao menos, tem longa história. A Zoara bizantina teve bispo, uma guarnição romana nos dias de Eusébio e um cemitério com centenas de lápides gregas e outras em aramaico judaico, datadas pelos anos desde a destruição do Templo. Na colina acima, em Deir Ain Abata, Konstantinos Politis escavou em 1988–2003 um mosteiro construído em torno de uma caverna que os peregrinos veneravam como a de Ló; o mapa de Madaba mostra o santuário de São Ló ao lado de Zoara. Na Idade Média, Zughar era conhecida por suas tâmaras, anil e açúcar."
    - "Hoje Ghor es-Safi é uma cidade agrícola de fábricas de potássio e campos de tomate, no ponto habitado mais baixo da Terra, com um Museu no Lugar Mais Baixo da Terra, aberto em 2012 junto ao mosteiro de Ló."
  de:
    - "Zoar, früher Bela genannt, war die fünfte der Städte der Ebene, mit Sodom, Gomorra, Adma und Zeboim, deren Könige im Siddimtal kämpften. Als Lot aus Sodom floh, bat er, vor den Bergen verschont zu werden: „Siehe, da ist eine Stadt nahe, darein ich fliehen kann, und sie ist klein“, und so wurde sie verschont und Zoar genannt, „klein“; „Und die Sonne war aufgegangen auf Erden, da Lot nach Zoar kam“. Doch er fürchtete, dort zu bleiben, und zog hinauf in eine Höhle im Gebirge, wo seine Töchter Moab und Ammon gebaren. Lot hatte die Ebene zuerst gesehen, als sie „wasserreich“ war wie der Garten des Herrn, „bis man gen Zoar kommt“, und Mose sah vom Pisga das Tal von Jericho „bis gen Zoar“. Bei Jesaja und Jeremia ist Zoar eine moabitische Stadt; bei Jesaja fliehen die Flüchtlinge Moabs dorthin."
    - "Wo Zoar lag, hängt davon ab, wo Sodom lag, und das ist umstritten. Josephus, Eusebius und die Madaba-Mosaikkarte des sechsten Jahrhunderts setzen Zoara alle ans Südende des Toten Meeres, und die übliche Gleichsetzung ist die Oase Ghor es-Safi in Jordanien, wo das Wadi Hasa herabkommt; die anderen Kandidaten auf dieser Karte sind nahe Hügel wie Tell esh-Sheikh Isa und die Zuckermühlen von Tawahin es-Sukkar, das Siddimtal unter dem flachen Südbecken, die Mündung des Arnon und die Ebene nördlich des Toten Meeres, die diejenigen bevorzugen, die Sodom dort suchen."
    - "Die südliche Stätte hat wenigstens eine lange Geschichte. Das byzantinische Zoara hatte einen Bischof, zu Eusebius' Zeit eine römische Garnison und einen Friedhof mit Hunderten griechischer Grabsteine und jüdisch-aramäischer, datiert nach den Jahren seit der Zerstörung des Tempels. Auf dem Hügel darüber, in Deir Ain Abata, grub Konstantinos Politis 1988–2003 ein Kloster aus, das um eine Höhle gebaut war, die Pilger als die Lots verehrten; die Madaba-Karte zeigt das Heiligtum des heiligen Lot neben Zoara. Im Mittelalter war Zughar für seine Datteln, seinen Indigo und seinen Zucker bekannt."
    - "Heute ist Ghor es-Safi eine Stadt mit Kaliwerken und Tomatenfeldern am tiefsten bewohnten Punkt der Erde, mit einem Museum am tiefsten Ort der Erde, 2012 neben dem Lot-Kloster eröffnet."
  fr:
    - "Tsoar, d’abord appelée Béla, était la cinquième des villes de la plaine, avec Sodome, Gomorrhe, Adma et Tseboïm, dont les rois combattirent dans la vallée de Siddim. Quand Lot fuit Sodome, il supplia d’être épargné de la montagne : « cette ville est assez proche pour que je m’y réfugie, et elle est petite » ; elle fut donc épargnée et nommée Tsoar, « petite » ; « Le soleil se levait sur la terre, lorsque Lot entra dans Tsoar ». Pourtant il craignit d’y rester et monta dans une caverne de la montagne, où ses filles enfantèrent Moab et Ammon. Lot avait d’abord vu la plaine « entièrement arrosée », comme un jardin de l’Éternel, « jusqu’à Tsoar », et Moïse vit du Pisga la vallée de Jéricho « jusqu’à Tsoar ». Chez Ésaïe et Jérémie, Tsoar est une ville moabite ; chez Ésaïe, les fugitifs de Moab s’y enfuient."
    - "L’emplacement de Tsoar dépend de celui de Sodome, qui est discuté. Josèphe, Eusèbe et la carte-mosaïque de Madaba du VIe siècle placent tous Zoara à l’extrémité sud de la mer Morte, et l’identification habituelle est l’oasis de Ghor es-Safi, en Jordanie, où descend le Wadi Hasa ; les autres candidats sur cette carte sont des tertres voisins comme Tell esh-Sheikh Isa et les sucreries de Tawahin es-Sukkar, la vallée de Siddim sous le bassin sud peu profond, l’embouchure de l’Arnon, et la plaine au nord de la mer Morte que préfèrent ceux qui y cherchent Sodome."
    - "Le site méridional a du moins une longue histoire. La Zoara byzantine avait un évêque, une garnison romaine du temps d’Eusèbe et un cimetière avec des centaines de stèles grecques et d’autres, juives araméennes, datées en années depuis la destruction du Temple. Sur la colline au-dessus, à Deir Ain Abata, Konstantinos Politis fouilla en 1988-2003 un monastère bâti autour d’une grotte que vénéraient les pèlerins comme celle de Lot ; la carte de Madaba montre le sanctuaire de saint Lot à côté de Zoara. Au Moyen Âge, Zughar était connue pour ses dattes, son indigo et son sucre."
    - "Ghor es-Safi est aujourd’hui une ville agricole de potasse et de champs de tomates au point habité le plus bas de la Terre, avec un Musée du point le plus bas de la Terre, ouvert en 2012 à côté du monastère de Lot."
  pl:
    - "Soar, wcześniej zwane Bela, było piątym z miast równiny, obok Sodomy, Gomory, Adma i Seboim, których królowie walczyli w dolinie Siddim. Gdy Lot uciekał z Sodomy, błagał, by oszczędzono go w górach: „Ale oto tu jest miasto nie daleko, do którego bym uciekł, małeć jest”, więc je oszczędzono i nazwano Soar, „małe”; „Wtem słońce weszło na ziemię, a Lot wszedł do Zoar”. Jednak bał się tam zostać i wszedł do jaskini w górze, gdzie jego córki urodziły Moaba i Ammona. Lot ujrzał najpierw równinę, gdzie, jak czytamy, „wszystka wilgotna była”, jak ogród Pański, „idąc do Zoar”, a Mojżesz z Pisgi widział dolinę Jerycha „aż do Segor”. U Izajasza i Jeremiasza Soar jest moabickim miastem; u Izajasza uciekają do niego zbiegowie z Moabu."
    - "Gdzie leżało Soar, zależy od tego, gdzie leżała Sodoma, a to jest sporne. Józef Flawiusz, Euzebiusz i mozaikowa mapa z Madaby z VI wieku umieszczają Zoarę na południowym krańcu Morza Martwego, a zwykłe utożsamienie to oaza Ghor es-Safi w Jordanii, gdzie schodzi Wadi Hasa; inni kandydaci na tej mapie to pobliskie kopce, jak Tell asz-Szejch Isa i młyny cukrowe Tawahin es-Sukkar, dolina Siddim pod płytkim południowym basenem, ujście Arnonu i równina na północ od Morza Martwego, preferowana przez tych, którzy tam szukają Sodomy."
    - "Południowe stanowisko ma przynajmniej długą historię. Bizantyjska Zoara miała biskupa, rzymski garnizon za czasów Euzebiusza i cmentarz z setkami greckich nagrobków oraz żydowsko-aramejskich datowanych według lat od zburzenia Świątyni. Na wzgórzu powyżej, w Dajr Ajn Abata, Konstantinos Politis odkopał w latach 1988–2003 klasztor zbudowany wokół jaskini, którą pielgrzymi czcili jako jaskinię Lota; mapa z Madaby pokazuje sanktuarium świętego Lota obok Zoary. W średniowieczu Zugar słynęło z daktyli, indygo i cukru."
    - "Dziś Ghor es-Safi to miasto rolnicze z zakładami potażu i polami pomidorów w najniżej położonym zamieszkanym miejscu na ziemi, z Muzeum na Najniższym Miejscu Ziemi, otwartym w 2012 roku obok klasztoru Lota."
  it:
    - "Soar, in precedenza detta Bela, era la quinta delle città della piana, con Sodoma, Gomorra, Adma e Zeboim, i cui re combatterono nella valle di Siddim. Quando Lot fuggì da Sodoma pregò di essere risparmiato dai monti: «questa città è vicina da potermici rifugiare, ed è piccola», e così fu risparmiata e chiamata Soar, «piccola»; «Il sole si levava sulla terra quando Lot arrivò a Tsoar». Eppure temette di restare e salì a una spelonca sul monte, dove le sue figlie partorirono Moab e Ammon. Lot aveva visto prima la pianura «tutta quanta irrigata fino a Tsoar», come il giardino dell’Eterno, e Mosè dal Pisga vide la valle di Gerico «fino a Tsoar». In Isaia e in Geremia Soar è una città moabita; in Isaia vi si rifugiano i fuggiaschi di Moab."
    - "Dove sorgesse Soar dipende da dove sorgeva Sodoma, ed è discusso. Giuseppe Flavio, Eusebio e la mappa musiva di Madaba del VI secolo pongono tutti Zoara all’estremità meridionale del Mar Morto, e l’identificazione abituale è l’oasi di Ghor es-Safi in Giordania, dove scende il Wadi Hasa; gli altri candidati su questa mappa sono tell vicini come Tell esh-Sheikh Isa e gli zuccherifici di Tawahin es-Sukkar, la valle di Siddim sotto il basso bacino meridionale, la foce dell’Arnon, e la piana a nord del Mar Morto preferita da chi cerca lì Sodoma."
    - "Il sito meridionale ha almeno una lunga storia. La Zoara bizantina ebbe un vescovo, una guarnigione romana ai tempi di Eusebio, e un cimitero con centinaia di lapidi greche e altre giudeo-aramaiche datate dagli anni dalla distruzione del Tempio. Sulla collina sopra, a Deir Ain Abata, Konstantinos Politis scavò nel 1988–2003 un monastero costruito attorno a una grotta che i pellegrini veneravano come quella di Lot; la mappa di Madaba mostra il santuario di San Lot accanto a Zoara. Nel Medioevo Zughar era nota per i datteri, l’indaco e lo zucchero."
    - "Oggi Ghor es-Safi è una città agricola di stabilimenti di potassa e campi di pomodori nel luogo abitato più basso della terra, con un Museo del Punto più Basso della Terra, aperto nel 2012 accanto al monastero di Lot."
  nl:
    - "Zoar, eerder Bela genoemd, was de vijfde van de steden van de vlakte, met Sodom, Gomorra, Adma en Zeboïm, wier koningen in het dal Siddim vochten. Toen Lot uit Sodom vluchtte, smeekte hij om de bergen te worden gespaard: “deze stad is nabij, om derwaarts te vluchten, en zij is klein”, en zo werd ze gespaard en Zoar genoemd, “klein”; “De zon ging op boven de aarde, als Lot te Zoar inkwam”. Toch durfde hij er niet te blijven en ging naar een grot in de berg, waar zijn dochters Moab en Ammon baarden. Lot had de vlakte eerst gezien “als de hof des HEEREN, als Egypteland, als gij komt te Zoar”, en Mozes zag vanaf Pisga de vallei van Jericho “tot Zoar toe”. Bij Jesaja en Jeremia is Zoar een Moabitische stad; bij Jesaja vluchten de vluchtelingen van Moab daarheen."
    - "Waar Zoar lag, hangt af van waar Sodom lag, en dat wordt betwist. Flavius Josephus, Eusebius en de Madaba-mozaïekkaart uit de zesde eeuw plaatsen Zoara allemaal aan het zuidelijke einde van de Dode Zee, en de gebruikelijke gelijkstelling is de oase Ghor es-Safi in Jordanië, waar de Wadi Hasa afdaalt; de andere kandidaten op deze kaart zijn nabijgelegen heuvels zoals Tell esh-Sheikh Isa en de suikermolens van Tawahin es-Sukkar, het dal van Siddim onder het ondiepe zuidelijke bekken, de monding van de Arnon, en de vlakte ten noorden van de Dode Zee die de voorkeur heeft van hen die Sodom daar zoeken."
    - "De zuidelijke plaats heeft in elk geval een lange geschiedenis. Byzantijns Zoara had een bisschop, in de tijd van Eusebius een Romeins garnizoen, en een begraafplaats met honderden Griekse grafstenen en Joods-Aramese die zijn gedateerd naar de jaren sinds de verwoesting van de Tempel. Op de heuvel erboven, bij Deir Ain Abata, groef Konstantinos Politis in 1988–2003 een klooster op dat was gebouwd rond een grot die pelgrims als die van Lot vereerden; de Madaba-kaart toont het heiligdom van de heilige Lot naast Zoara. In de middeleeuwen stond Zughar bekend om zijn dadels, indigo en suiker."
    - "Tegenwoordig is Ghor es-Safi een landbouwstad met potasfabrieken en tomatenvelden op de laagste bewoonde plek op aarde, met een Museum at the Lowest Place on Earth, in 2012 geopend naast het klooster van Lot."
  cs:
    - "Soar, dříve zvaný Bela, bylo páté z měst roviny, spolu se Sodomou, Gomorou, Admou a Cebóímem, jejichž králové bojovali v údolí Siddim. Když Lot utíkal ze Sodomy, prosil, aby mu byly ušetřeny hory: „toto město blízko, do něhož bych utekl, a toť jest malé“, a tak bylo ušetřeno a nazváno Soar, „malé“; „Slunce vzcházelo nad zemi, když Lot všel do Ségor“. Přesto se bál zůstat a vystoupil do jeskyně v hoře, kde jeho dcery porodily Moába a Amóna. Lot nejprve viděl rovinu, která „všecka až k Ségor svlažována byla“, jako zahrada Hospodinova, a Mojžíš z Pisgy viděl údolí Jericha „až do Segor“. U Izajáše a Jeremjáše je Soar moábské město; u Izajáše k němu utíkají moábští uprchlíci."
    - "Kde Soar ležel, závisí na tom, kde ležela Sodoma, a to je sporné. Josephus, Eusebius i mozaiková mapa z Mádaby ze 6. století kladou Zoaru na jižní konec Mrtvého moře a obvyklým ztotožněním je oáza Ghór es-Sáfí v Jordánsku, kde sestupuje Wádí Hasa; další kandidáti na této mapě jsou blízké pahorky jako Tell aš-Šajch Ísá a cukrovary Tawáhín es-Sukkar, Siddimské údolí pod mělkou jižní pánví, ústí Arnonu a rovina severně od Mrtvého moře, kterou preferují ti, kdo tam hledají Sodomu."
    - "Jižní místo má alespoň dlouhou historii. Byzantská Zoara měla biskupa, římskou posádku za Eusebiových dnů a hřbitov se stovkami řeckých náhrobků a židovských aramejských, datovaných roky od zničení chrámu. Na kopci nad ním, v Dér Ajn Abáta, vykopal Konstantinos Politis v letech 1988–2003 klášter postavený kolem jeskyně, kterou poutníci uctívali jako Lotovu; mapa z Mádaby ukazuje svatyni svatého Lota vedle Zoary. Ve středověku byla Zughar známá svými datlemi, indigem a cukrem."
    - "Dnes je Ghór es-Sáfí zemědělské město s potašovými závody a rajčatovými poli na nejníže obydleném místě na zemi, s Muzeem na nejnižším místě na Zemi, otevřeným roku 2012 vedle Lotova kláštera."
