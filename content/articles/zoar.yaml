# Overview article (ADR 0007). Mainstream facts only; the location depends on that of Sodom and is given as disputed, with the map's candidates.
id: zoar
place: aacfcda
title:
  en: "Zoar"
  ru: "Сигор"
  uk: "Сігор"
  es: "Zoar"
  pt: "Zoar"
  de: "Zoar"
  fr: "Tsoar"
  pl: "Soar"
  it: "Soar"
