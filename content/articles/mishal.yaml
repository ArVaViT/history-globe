body:
  en:
    - "Mishal, in Chronicles Mashal, was a town of Asher on the plain of Acco, named only in lists. Joshua places it on the tribe's border: “And Alammelech, and Amad, and Misheal; and reacheth to Carmel westward, and to Shihor-libnath”, and it was given with its pastures to the Levites of Gershon: “And out of the tribe of Asher, Mishal with her suburbs, Abdon with her suburbs”. Nothing more is told of it. Some scholars find the same name in the list of Canaanite towns conquered by Thutmose III in the fifteenth century BC, which would make Mishal a Canaanite town long before the tribes; it was never, so far as the texts show, a place of any event."
    - "Its site is disputed, and the question is tied to that of Achshaph, another town of Asher in the same plain. The leading candidate is Tell Keisan, a large mound in the plain about 8 km south-east of Acco, which the École biblique of Jerusalem excavated in 1971–1980 and found occupied from the Early Bronze Age to the Byzantine period, with a prosperous Phoenician town of the Iron Age; but Keisan is claimed for Achshaph as well. Tell Bir el-Gharbi (Tel Bira) a little to the north and Tel Nahal by the mouth of the Kishon have also been proposed, and the map shows all three."
    - "Whichever it was, Mishal lay in the fertile plain between Acco and the hills of Galilee, today the Acco plain of northern Israel, where Tell Keisan rises among the fields a few kilometres from the Haifa–Acco road."
  ru:
    - "Мишал, в Паралипоменоне Машал, был городом Асира на равнине Акко, названным только в списках. Книга Иисуса Навина ставит его на границе колена: «Аламелех, Амад и Мишал; и примыкает предел к Кармилу с западной стороны и к Шихор-Ливнафу», и его отдали с предместьями левитам из рода Гирсона: «от колена Асирова: Мишал и предместья его, Авдон и предместья его». Больше о нём ничего не сказано. Некоторые учёные находят то же имя в списке ханаанских городов, покорённых Тутмосом III в XV веке до н. э., так что Мишал был бы ханаанским городом задолго до колен; местом какого-либо события он, насколько видно из текстов, не был никогда."
    - "Его положение спорно, и вопрос связан с вопросом об Ахсафе, другом городе Асира на той же равнине. Главный кандидат — Телль-Кейсан, большой холм на равнине примерно в 8 км к юго-востоку от Акко, который Иерусалимская библейская школа раскапывала в 1971–1980 годах и нашла заселённым от ранней бронзы до византийского времени, с зажиточным финикийским городом железного века; но на Кейсан претендует и Ахсаф. Предлагали также Телль-Бир-эль-Гарби (Тель-Бира) немного севернее и Тель-Нахаль у устья Киссона, и на карте показаны все три места."
    - "Каким бы он ни был, Мишал лежал на плодородной равнине между Акко и горами Галилеи — сегодня это равнина Акко на севере Израиля, где Телль-Кейсан поднимается среди полей в нескольких километрах от дороги из Хайфы в Акко."
  uk:
    - "Мішал, у Книзі Хронік Машал, був містом Асіра на рівнині Акко, названим лише в переліках. Ісус Навин розміщує його на межі племені: «Аламелех, Амад і Мишал, а впирається границя в Кармел з західнього боку і в Сихор-Ливнат», і його було віддано з пасовищами левітам з роду Гершома: «А від поколїння Ассерового: Мишал укупі з пасовищами його, та Абдон і передмістя його». Більше про нього нічого не розповідається. Деякі вчені знаходять ту саму назву в переліку ханаанських міст, завойованих Тутмосом III у XV ст. до н. е., що зробило б Мішал ханаанським містом задовго до племен; він ніколи, наскільки видно з текстів, не був місцем жодної події."
    - "Його місце спірне, і питання пов’язане з питанням Ахшафа, іншого міста Асіра на тій самій рівнині. Головний кандидат — Телль-Кейсан, великий пагорб на рівнині приблизно за 8 км на південний схід від Акко, який Єрусалимська біблійна школа (École biblique) розкопувала в 1971–1980 рр. і виявила заселення від ранньої бронзової доби до візантійської, з квітучим фінікійським містом залізної доби; але Кейсан претендує й на Ахшаф. Пропонували також Телль-Бір-ель-Гарбі (Тель-Біра) трохи північніше та Тель-Нахаль біля гирла Кішону, і мапа показує всі три."
    - "Хоч яким воно було, Мішал лежав на родючій рівнині між Акко і пагорбами Галілеї, сьогодні — рівнина Акко на півночі Ізраїлю, де Телль-Кейсан здіймається серед полів за кілька кілометрів від дороги Хайфа — Акко."
  es:
    - "Misal, en Crónicas Masal, era una ciudad de Aser en la llanura de Aco, nombrada solo en listas. Josué la sitúa en la frontera de la tribu: «Y Alammelec, y Amead, y Miseal; y llega hasta Carmel al occidente, y á Sihor-libnath», y fue dada con sus pastos a los levitas de Gersón: «Y de la tribu de Aser, á Miseal con sus ejidos, á Abdón con sus ejidos». No se cuenta nada más de ella. Algunos estudiosos hallan el mismo nombre en la lista de ciudades cananeas conquistadas por Tutmosis III en el siglo XV a. C., lo que haría de Misal una ciudad cananea mucho antes de las tribus; nunca fue, por lo que muestran los textos, lugar de ningún suceso."
    - "Su emplazamiento se discute, y la cuestión está ligada a la de Acsaf, otra ciudad de Aser en la misma llanura. El principal candidato es Tell Keisan, un gran montículo en la llanura, a unos 8 km al sudeste de Aco, que la École biblique de Jerusalén excavó en 1971–1980 y halló ocupado desde la Edad del Bronce Antiguo hasta el período bizantino, con una próspera ciudad fenicia de la Edad del Hierro; pero Keisan se reclama también para Acsaf. También se han propuesto Tell Bir el-Gharbi (Tel Bira), algo más al norte, y Tel Nahal, junto a la desembocadura del Cisón, y el mapa muestra los tres."
    - "Fuera cual fuese, Misal estaba en la fértil llanura entre Aco y las colinas de Galilea, hoy la llanura de Aco, en el norte de Israel, donde Tell Keisan se alza entre los campos a unos pocos kilómetros de la carretera Haifa–Aco."
  pt:
    - "Misal, nas Crônicas Masal, era uma cidade de Aser na planície de Aco, citada apenas em listas. Josué a põe na fronteira da tribo: “Alameleque, Amade e Misal. Chegava ao Carmelo, para o oeste, e a Sior-Libnate”, e foi dada com suas pastagens aos levitas de Gérson: “Da tribo de Aser, Misal com suas pastagens, Abdom com suas pastagens”. Nada mais se conta dela. Alguns estudiosos acham o mesmo nome na lista de cidades cananeias conquistadas por Tutmés III no século XV a.C., o que faria de Misal uma cidade cananeia muito antes das tribos; nunca foi, tanto quanto os textos mostram, lugar de qualquer acontecimento."
    - "Seu sítio é disputado, e a questão está ligada à de Acsafe, outra cidade de Aser na mesma planície. O principal candidato é Tell Keisan, um grande montículo na planície a cerca de 8 km a sudeste de Aco, que a École biblique de Jerusalém escavou em 1971–1980, encontrando-o ocupado da Idade do Bronze Antigo ao período bizantino, com uma próspera cidade fenícia da Idade do Ferro; mas Keisan também é reivindicada para Acsafe. Tell Bir el-Gharbi (Tel Bira), um pouco ao norte, e Tel Nahal, junto à foz do Quisom, também foram propostos, e o mapa mostra os três."
    - "Qualquer que fosse, Misal ficava na fértil planície entre Aco e as colinas da Galileia, hoje a planície de Aco, no norte de Israel, onde Tell Keisan se ergue entre os campos a poucos quilômetros da estrada Haifa–Aco."
  de:
    - "Mischal, in der Chronik Maschal, war eine Stadt Assers in der Ebene von Akko, nur in Listen genannt. Josua setzt sie an die Grenze des Stammes: „Allammelech, Amead, Miseal, und die Grenze stößt an den Karmel am Meer und an Sihor-Libnath“, und sie wurde mit ihren Weideplätzen den Leviten von Gerschon gegeben: „Von dem Stamm Asser vier Städte: Miseal und seine Vorstädte, Abdon und seine Vorstädte“. Mehr wird von ihr nicht erzählt. Manche Gelehrte finden denselben Namen in der Liste kanaanäischer Städte, die Thutmosis III. im 15. Jahrhundert v. Chr. eroberte, was Mischal lange vor den Stämmen zu einer kanaanäischen Stadt machen würde; sie war, soweit die Texte zeigen, nie Schauplatz eines Ereignisses."
    - "Ihre Lage ist umstritten, und die Frage hängt mit der von Achschaf zusammen, einer weiteren Stadt Assers in derselben Ebene. Der führende Kandidat ist Tell Keisan, ein großer Hügel in der Ebene etwa 8 km südöstlich von Akko, den die École biblique von Jerusalem 1971–1980 ausgrub und von der Frühbronzezeit bis zur byzantinischen Zeit besiedelt fand, mit einer wohlhabenden phönizischen Stadt der Eisenzeit; doch Keisan wird auch für Achschaf beansprucht. Tell Bir el-Gharbi (Tel Bira) ein Stück nördlich und Tel Nahal an der Mündung des Kischon wurden ebenfalls vorgeschlagen, und die Karte zeigt alle drei."
    - "Welcher es auch war, Mischal lag in der fruchtbaren Ebene zwischen Akko und den Hügeln Galiläas, heute die Ebene von Akko im Norden Israels, wo sich Tell Keisan einige Kilometer von der Straße Haifa–Akko aus den Feldern erhebt."
  fr:
    - "Mischeal, Maschal dans les Chroniques, était une ville d’Aser sur la plaine d’Acco, nommée seulement dans des listes. Josué la place sur la limite de la tribu : « Allammélec, Amead et Mischeal ; elle touchait, vers l’occident, au Carmel et au Schichor-Libnath », et elle fut donnée avec ses pâturages aux lévites de Guerschon : « de la tribu d’Aser, Mischeal et sa banlieue, Abdon et sa banlieue ». On n’en dit rien de plus. Certains savants retrouvent le même nom dans la liste des villes cananéennes conquises par Thoutmosis III au XVe siècle av. J.-C., ce qui ferait de Mischeal une ville cananéenne bien avant les tribus ; elle ne fut jamais, autant que les textes le montrent, le lieu d’un événement."
    - "Son site est discuté, et la question est liée à celle d’Acschaph, autre ville d’Aser dans la même plaine. Le principal candidat est Tell Keisan, grand tertre de la plaine à environ 8 km au sud-est d’Acco, que l’École biblique de Jérusalem a fouillé en 1971–1980, y trouvant une occupation de l’âge du Bronze ancien à l’époque byzantine, avec une prospère ville phénicienne de l’âge du Fer ; mais Keisan est aussi revendiquée pour Acschaph. Tell Bir el-Gharbi (Tel Bira), un peu plus au nord, et Tel Nahal, à l’embouchure du Kison, ont aussi été proposés, et la carte montre les trois."
    - "Quel qu’il ait été, Mischeal se trouvait dans la plaine fertile entre Acco et les collines de Galilée, aujourd’hui la plaine d’Acco dans le nord d’Israël, où Tell Keisan s’élève parmi les champs à quelques kilomètres de la route Haïfa–Acco."
  it:
    - "Miscal, in Cronache Masal, era una città di Aser sulla pianura di Acco, nominata solo negli elenchi. Giosuè la pone sul confine della tribù: «Allammelec, Amad, Mishal. Il loro confine giungeva, verso occidente, al Carmel e a Scihor-Libnath», e fu data con i suoi pascoli ai leviti di Gherson: «della tribù di Ascer, Misceal e il suo contado, Abdon e il suo contado». Nulla più si racconta di essa. Alcuni studiosi trovano lo stesso nome nell’elenco delle città cananee conquistate da Tutmosi III nel XV secolo a.C., il che farebbe di Miscal una città cananea molto prima delle tribù; non fu mai, per quanto mostrano i testi, teatro di alcun evento."
    - "Il suo sito è discusso, e la questione è legata a quella di Acsaf, un’altra città di Aser nella stessa pianura. Il candidato principale è Tell Keisan, un grande tell nella pianura a circa 8 km a sud-est di Acco, che l’École biblique di Gerusalemme scavò nel 1971–1980 trovandolo occupato dall’età del Bronzo antico al periodo bizantino, con una prospera città fenicia dell’età del Ferro; ma Keisan è rivendicata anche per Acsaf. Sono stati proposti anche Tell Bir el-Gharbi (Tel Bira), un poco più a nord, e Tel Nahal presso la foce del Kison, e la mappa mostra tutti e tre."
    - "Qualunque fosse, Miscal si trovava nella fertile pianura tra Acco e le colline della Galilea, oggi la pianura di Acco nel nord di Israele, dove Tell Keisan sorge tra i campi a pochi chilometri dalla strada Haifa–Acco."
  pl:
    - "Miszal, w Księdze Kronik Maszal, było miastem Aszera na równinie Akko, wymienianym tylko w listach. Jozue umieszcza je na granicy pokolenia: „I Elmelech, i Amaad, i Aessal, a idzie na Karmel do morza, i do Sychor, i Lobanat”, i zostało oddane wraz z pastwiskami Lewitom z rodu Gerszona: „A z pokolenia Aser: Masaa i przedmieścia jego; Abdon i przedmieścia jego”. Nic więcej o nim nie opowiedziano. Niektórzy uczeni znajdują tę samą nazwę na liście kananejskich miast zdobytych przez Totmesa III w XV w. p.n.e., co uczyniłoby Miszal miastem kananejskim na długo przed plemionami; nigdy, o ile wynika z tekstów, nie było miejscem żadnego wydarzenia."
    - "Jego położenie jest sporne, a pytanie wiąże się z Akszafem, innym miastem Aszera na tej samej równinie. Czołowym kandydatem jest Tell Keisan, duży kopiec na równinie około 8 km na południowy wschód od Akko, który École biblique z Jerozolimy wykopywała w latach 1971–1980 i stwierdziła osadnictwo od wczesnej epoki brązu do okresu bizantyjskiego, z zamożnym fenickim miastem z epoki żelaza; ale Keisan jest też przypisywane Akszafowi. Proponowano także Tell Bir el-Gharbi (Tel Bira) nieco na północ i Tel Nahal u ujścia Kiszonu, a mapa pokazuje wszystkie trzy."
    - "Którekolwiek to było, Miszal leżało na żyznej równinie między Akko a wzgórzami Galilei, dziś równinie Akko w północnym Izraelu, gdzie Tell Keisan wznosi się wśród pól kilka kilometrów od drogi Hajfa–Akko."
  nl:
    - "Misal, in Kronieken Masal, was een stad van Aser in de vlakte van Akko, alleen in lijsten genoemd. Jozua plaatst het aan de grens van de stam: “En Allammelech, en Am-ad, en Mis-al; en zij reikt aan Karmel westwaarts, en aan Sichor-Libnath”, en het werd met zijn weidegronden aan de Levieten van Gerson gegeven: “En van den stam van Aser, Misal en haar voorsteden, Abdon en haar voorsteden”. Verder wordt er niets van verteld. Sommige geleerden vinden dezelfde naam in de lijst van Kanaänitische steden die Thoetmosis III in de vijftiende eeuw v.Chr. veroverde, wat Misal tot een Kanaänitische stad lang vóór de stammen zou maken; het was, voor zover de teksten tonen, nooit de plaats van enige gebeurtenis."
    - "De ligging is omstreden, en de vraag hangt samen met die van Achsaf, een andere stad van Aser in dezelfde vlakte. De voornaamste kandidaat is Tell Keisan, een grote heuvel in de vlakte zo'n 8 km ten zuidoosten van Akko, die de École biblique van Jeruzalem in 1971–1980 opgroef en bewoond vond van de vroege bronstijd tot de Byzantijnse tijd, met een welvarende Fenicische stad uit de ijzertijd; maar Keisan wordt ook voor Achsaf opgeëist. Tell Bir el-Gharbi (Tel Bira) iets noordelijker en Tel Nahal bij de monding van de Kison zijn eveneens voorgesteld, en de kaart toont alle drie."
    - "Welke het ook was, Misal lag in de vruchtbare vlakte tussen Akko en de heuvels van Galilea, tegenwoordig de vlakte van Akko in het noorden van Israël, waar Tell Keisan tussen de velden oprijst, enkele kilometers van de weg Haifa–Akko."
  cs:
    - "Mišal, v Kronikách Mašal, bylo město Ašerovo na akkské pláni, jmenované jen v seznamech. Jozue je klade na hranici kmene: „Elmelech, též Amaad a Mesal, a přibíhá až na Karmel k moři, a do Sichor Libnat“, a bylo dáno s pastvinami levitům z Geršona: „Z pokolení pak Asserova: Mesal a předměstí jeho, též Abdon a podměstí jeho“. Nic dalšího se o něm neříká. Někteří badatelé nacházejí totéž jméno v seznamu kanaánských měst dobytých Thutmosem III. v 15. století př. n. l., což by z Mišalu činilo kanaánské město dávno před kmeny; podle textů nebylo nikdy místem žádné události."
    - "Jeho poloha je sporná a otázka souvisí s Achšafem, jiným městem Ašerovým na téže pláni. Přední kandidát je Tell Keisan, velký pahorek na pláni asi 8 km jihovýchodně od Akka, který École biblique v Jeruzalémě vykopávala v letech 1971–1980 a shledala jej osídlený od starší doby bronzové po byzantské období, s prosperujícím fénickým městem z doby železné; Keisan se však uplatňuje i pro Achšaf. Navrženy byly také Tell Bir el-Gharbi (Tel Bira) kousek na sever a Tel Nahal u ústí Kíšonu a mapa ukazuje všechny tři."
    - "Ať to bylo kdekoli, Mišal ležel v úrodné pláni mezi Akkem a galilejskými pahorky, dnešní akkské pláni severního Izraele, kde se Tell Keisan zvedá mezi poli několik kilometrů od silnice Haifa–Akko."
