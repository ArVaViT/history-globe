# Overview article (ADR 0007). Mainstream facts only; a border point only, placed among the springs of Quseima without choosing one.
id: azmon
place: a8f6a28
title:
  en: "Azmon"
  ru: "Ацмон"
  uk: "Ацмон"
  es: "Asmón"
  pt: "Azmom"
  de: "Azmon"
  fr: "Atsmon"
  it: "Asmon"
  pl: "Asmon"
