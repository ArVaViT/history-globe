# Overview article (ADR 0007). Mainstream facts only; a border point only, placed among the springs of Quseima without choosing one.
id: azmon
place: a8f6a28
title:
  en: "Azmon"
  ru: "Ацмон"
body:
  en:
    - "Azmon was a point on the southern border of the promised land, named only in the two descriptions of that border. Numbers draws the line from the ascent of Akrabbim through Zin south of Kadesh-barnea, “to Hazar-addar, and pass on to Azmon: And the border shall fetch a compass from Azmon unto the river of Egypt, and the goings out of it shall be at the sea”. Joshua repeats it for Judah: from Kadesh-barnea past Hezron, Adar and Karkaa, “From thence it passed toward Azmon, and went out unto the river of Egypt”. Azmon was thus the last named place before the Brook of Egypt, usually taken to be Wadi el-Arish, and lay somewhere west of Kadesh."
    - "The place has been sought among the springs of the Quseima oasis in north-eastern Sinai, west of Ain el-Qudeirat, the usual site of Kadesh-barnea: at Ain el-Qoseimeh, or at Ain Muweileh a few kilometres beyond it, which is where the map puts it. The identification rests on the order of the border points alone; nothing on the ground has yielded the name, no event of the Bible happened at Azmon, and Eusebius knew Asemona only as a desert town on the border of Judaea toward Egypt."
    - "Today the oasis of Quseima lies in Egypt's North Sinai governorate, a few kilometres west of the border with Israel."
  ru:
    - "Ацмон — точка на южной границе обетованной земли, названная только в двух описаниях этой границы. Книга Чисел ведёт черту от возвышенности Акравима через Син южнее Кадес-Варни, «оттуда пойдет к Гацар-Аддару и пройдет через Ацмон; от Ацмона направится граница к потоку Египетскому, и будут выступы ее к морю». Книга Иисуса Навина повторяет её для Иуды: от Кадес-Варни через Хецрон, Аддар и Каркаю предел «потом проходит Ацмон, идет к потоку Египетскому». Ацмон, стало быть, был последним названным местом перед потоком Египетским, которым обычно считают Вади-эль-Ариш, и лежал где-то к западу от Кадеса."
    - "Место искали среди источников оазиса Кусейма на северо-востоке Синая, к западу от Айн-эль-Кудейрата, обычного места Кадес-Варни: у Айн-эль-Кусеймы или у Айн-Мувейле в нескольких километрах дальше, где его и ставит карта. Отождествление держится только на порядке пограничных точек; ничто на земле не дало этого имени, никакое событие Библии в Ацмоне не произошло, а Евсевий знал Асемону лишь как город в пустыне на границе Иудеи с Египтом."
    - "Сегодня оазис Кусейма лежит в египетской провинции Северный Синай, в нескольких километрах к западу от границы с Израилем."
scripture:
