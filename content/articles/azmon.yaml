body:
  en:
    - "Azmon was a point on the southern border of the promised land, named only in the two descriptions of that border. Numbers draws the line from the ascent of Akrabbim through Zin south of Kadesh-barnea, “to Hazar-addar, and pass on to Azmon: And the border shall fetch a compass from Azmon unto the river of Egypt, and the goings out of it shall be at the sea”. Joshua repeats it for Judah: from Kadesh-barnea past Hezron, Adar and Karkaa, “From thence it passed toward Azmon, and went out unto the river of Egypt”. Azmon was thus the last named place before the Brook of Egypt, usually taken to be Wadi el-Arish, and lay somewhere west of Kadesh."
    - "The place has been sought among the springs of the Quseima oasis in north-eastern Sinai, west of Ain el-Qudeirat, the usual site of Kadesh-barnea: at Ain el-Qoseimeh, or at Ain Muweileh a few kilometres beyond it, which is where the map puts it. The identification rests on the order of the border points alone; nothing on the ground has yielded the name, no event of the Bible happened at Azmon, and Eusebius knew Asemona only as a desert town on the border of Judaea toward Egypt."
    - "Today the oasis of Quseima lies in Egypt's North Sinai governorate, about 10 km west of the border with Israel."
  ru:
    - "Ацмон — точка на южной границе обетованной земли, названная только в двух описаниях этой границы. Книга Чисел ведёт черту от возвышенности Акравима через Син южнее Кадес-Варни, «оттуда пойдет к Гацар-Аддару и пройдет через Ацмон; от Ацмона направится граница к потоку Египетскому, и будут выступы ее к морю». Книга Иисуса Навина повторяет её для Иуды: от Кадес-Варни через Хецрон, Аддар и Каркаю предел «потом проходит Ацмон, идет к потоку Египетскому». Ацмон, стало быть, был последним названным местом перед потоком Египетским, которым обычно считают Вади-эль-Ариш, и лежал где-то к западу от Кадеса."
    - "Место искали среди источников оазиса Кусейма на северо-востоке Синая, к западу от Айн-эль-Кудейрата, обычного места Кадес-Варни: у Айн-эль-Кусеймы или у Айн-Мувейле в нескольких километрах дальше, где его и ставит карта. Отождествление держится только на порядке пограничных точек; ничто на земле не дало этого имени, никакое событие Библии в Ацмоне не произошло, а Евсевий знал Асемону лишь как город в пустыне на границе Иудеи с Египтом."
    - "Сегодня оазис Кусейма лежит в египетской провинции Северный Синай, примерно в 10 км к западу от границы с Израилем."
  uk:
    - "Ацмон був пунктом на південному кордоні обітованої землі, названим лише у двох описах цього кордону. Числа проводять лінію від підйому Акравім через Сін на південь від Кадеса: «дійде до Газар Адару і перейде до Азмону; І повернеться гряниця ваша від Азмона до бурчака Египецького, і будуть кіньцї її проти моря». Книга Ісуса Навина повторює це для Юди: від Кадеса повз Хецрон, Адар і Каркаа «тягнеться на Азмон і йде далїй до Египецької річки». Отже, Ацмон був останнім названим місцем перед Єгипетським потоком, який зазвичай ототожнюють із вадієм аль-Аріш, і лежав десь на захід від Кадеса."
    - "Це місце шукали серед джерел оази Кусейма в північно-східному Сінаї, на захід від Айн-ель-Кудейрата, звичайного місця Кадеса: в Айн-ель-Косейме або в Айн-Мувейле за кілька кілометрів далі, де його й ставить мапа. Ототожнення спирається лише на порядок прикордонних пунктів; ніщо на місцевості не зберегло назви, жодна біблійна подія не сталася в Ацмоні, а Євсевій знав Асемону лише як пустельне місто на межі Юдеї з боку Єгипту."
    - "Нині оаза Кусейма лежить у єгипетській мухафазі Північний Синай, приблизно за 10 км на захід від кордону з Ізраїлем."
  es:
    - "Asmón era un punto de la frontera meridional de la tierra prometida, nombrado solo en las dos descripciones de esa frontera. Números traza la línea desde la subida de Acrabim por Zin, al sur de Cades-barnea, hasta que «saldrá á Hasar-addar, y pasará hasta Asmón; Y rodeará este término, desde Asmón hasta el torrente de Egipto, y sus remates serán al occidente». Josué la repite para Judá: desde Cades-barnea, pasando por Hezrón, Adar y Carca, «De allí pasaba á Azmón, y salía al arroyo de Egipto». Asmón era así el último lugar nombrado antes del Torrente de Egipto, que suele tomarse por el uadi el-Arish, y se hallaba en algún punto al oeste de Cades."
    - "El lugar se ha buscado entre los manantiales del oasis de Quseima, en el nordeste del Sinaí, al oeste de Ain el-Qudeirat, el sitio habitual de Cades-barnea: en Ain el-Qoseimeh, o en Ain Muweileh, unos kilómetros más allá, que es donde lo pone el mapa. La identificación descansa solo en el orden de los puntos de la frontera; nada sobre el terreno ha dado el nombre, ningún suceso de la Biblia ocurrió en Asmón, y Eusebio conocía Asemona solo como una ciudad del desierto en la frontera de Judea hacia Egipto."
    - "Hoy el oasis de Quseima se encuentra en la gobernación egipcia del Sinaí del Norte, a unos 10 km al oeste de la frontera con Israel."
  pt:
    - "Azmom era um ponto na fronteira sul da terra prometida, nomeado só nas duas descrições dessa fronteira. Números traça a linha da subida de Acrabim por Zim, ao sul de Cades-Barneia, “para Hazar-Adar, e passará até Azmom. A fronteira fará uma curva de Azmom até o ribeiro do Egito, e terminará no mar”. Josué a repete para Judá: de Cades-Barneia, passando por Hezrom, Adar e Carca, “passava por Azmom e saía no ribeiro do Egito”. Azmom era, pois, o último lugar nomeado antes do Ribeiro do Egito, geralmente tomado pelo uádi el-Arish, e ficava em algum ponto a oeste de Cades."
    - "O lugar foi procurado entre as fontes do oásis de Quseima, no nordeste do Sinai, a oeste de Ain el-Qudeirat, o sítio habitual de Cades-Barneia: em Ain el-Qoseimeh, ou em Ain Muweileh, alguns quilômetros além, onde o mapa o põe. A identificação se apoia só na ordem dos pontos da fronteira; nada no terreno rendeu o nome, nenhum acontecimento da Bíblia se deu em Azmom, e Eusébio conhecia Asemona apenas como uma cidade do deserto na fronteira da Judeia com o Egito."
    - "Hoje o oásis de Quseima fica na província do Sinai do Norte, no Egito, a cerca de 10 km a oeste da fronteira com Israel."
  de:
    - "Azmon war ein Punkt an der Südgrenze des Verheißenen Landes, nur in den beiden Beschreibungen dieser Grenze genannt. Das Vierte Buch Mose zieht die Linie von der Steige Akrabbim durch Zin südlich von Kadesch-Barnea, „und gelange zum Dorf Adar und gehe durch Azmon und lenke sich von Azmon an den Bach Ägyptens, und ihr Ende sei an dem Meer“. Josua wiederholt sie für Juda: von Kadesch-Barnea an Hezron, Adar und Karkaa vorbei, „und geht durch Azmon und kommt hinaus an den Bach Ägyptens“. Azmon war also der letzte benannte Ort vor dem Bach Ägyptens, gewöhnlich für den Wadi el-Arisch gehalten, und lag irgendwo westlich von Kadesch."
    - "Man hat den Ort unter den Quellen der Oase Quseima im nordöstlichen Sinai gesucht, westlich von Ain el-Qudeirat, der üblichen Stätte von Kadesch-Barnea: bei Ain el-Qoseime oder bei Ain Muweile einige Kilometer dahinter, wohin die Karte es setzt. Die Gleichsetzung beruht allein auf der Reihenfolge der Grenzpunkte; nichts im Gelände hat den Namen ergeben, in Azmon geschah kein Ereignis der Bibel, und Eusebius kannte Asemona nur als Wüstenstadt an der Grenze Judäas gegen Ägypten."
    - "Heute liegt die Oase Quseima im ägyptischen Gouvernement Nordsinai, etwa 10 km westlich der Grenze zu Israel."
  fr:
    - "Atsmon était un point de la frontière méridionale de la terre promise, nommé seulement dans les deux descriptions de cette frontière. Les Nombres tracent la ligne depuis la montée d’Akrabbim par Tsin au sud de Kadès-Barnéa : « elle continuera par Hatsar-Addar, et passera vers Atsmon ; depuis Atsmon, elle tournera jusqu’au torrent d’Égypte, pour aboutir à la mer ». Josué la reprend pour Juda : de Kadès-Barnéa par Hetsron, Adar et Karkaa, « elle passait ensuite par Atsmon, et continuait jusqu’au torrent d’Égypte ». Atsmon était donc le dernier lieu nommé avant le Torrent d’Égypte, d’ordinaire tenu pour le Wadi el-Arish, et se trouvait quelque part à l’ouest de Qadesh."
    - "On l’a cherché parmi les sources de l’oasis de Quseima, dans le nord-est du Sinaï, à l’ouest d’Ain el-Qudeirat, site habituel de Kadès-Barnéa : à Ain el-Qoseimeh, ou à Ain Muweileh quelques kilomètres plus loin, où la carte le met. L’identification repose sur le seul ordre des points de la frontière ; rien sur le terrain n’a livré le nom, aucun événement biblique n’eut lieu à Atsmon, et Eusèbe ne connaissait Asemona que comme une ville du désert à la frontière de la Judée vers l’Égypte."
    - "Aujourd’hui l’oasis de Quseima se trouve dans le gouvernorat égyptien du Sinaï Nord, à environ 10 km à l’ouest de la frontière avec Israël."
  it:
    - "Asmon era un punto sul confine meridionale della terra promessa, nominato soltanto nelle due descrizioni di quel confine. I Numeri tracciano la linea dalla salita di Akrabbim attraverso Zin a sud di Kades-Barnea, «poi continuerà verso Hatsar-Addar, e passerà per Atsmon. Da Atsmon la frontiera girerà fino al torrente d’Egitto, e finirà al mare». Giosuè la ripete per Giuda: da Kades-Barnea oltre Chesron, Addar e Carca, «passava quindi da Atsmon e continuava fino al torrente d’Egitto». Asmon era dunque l’ultimo luogo nominato prima del Torrente d’Egitto, di solito ritenuto lo Wadi el-Arish, e sorgeva da qualche parte a ovest di Kades."
    - "Il luogo è stato cercato fra le sorgenti dell’oasi di Quseima nel Sinai nord-orientale, a ovest di Ain el-Qudeirat, il sito abituale di Kades-Barnea: ad Ain el-Qoseimeh, o ad Ain Muweileh qualche chilometro oltre, dove lo pone la carta. L’identificazione poggia soltanto sull’ordine dei punti del confine; nulla sul terreno ha restituito il nome, nessun avvenimento della Bibbia accadde ad Asmon, ed Eusebio conosceva Asemona soltanto come una città del deserto sul confine della Giudea verso l’Egitto."
    - "Oggi l’oasi di Quseima si trova nel governatorato egiziano del Sinai settentrionale, a circa 10 km a ovest del confine con Israele."
  pl:
    - "Asmon było punktem na południowej granicy ziemi obiecanej, wymienionym tylko w dwóch opisach tej granicy. Księga Liczb prowadzi linię od wzniesienia Akrabbim przez Sin na południe od Kadesz-Barnea: „a stamtąd wynijdzie do wsi Addar, i pójdzie aż do Asmon. A zakrąży ta granica od Asmon aż do rzeki Egipskiej, a skończy się na zachód”. Jozue powtarza to dla Judy: z Kadesz-Barnea obok Chesronu, Addaru i Karkaa, „Stamtąd idąc do Asemona idzie ku rzece Egipskiej”. Asmon było więc ostatnim wymienionym miejscem przed Potokiem Egipskim, uważanym zwykle za Wadi el-Arisz, i leżało gdzieś na zachód od Kadesz."
    - "Miejsca szukano wśród źródeł oazy Quseima w północno-wschodnim Synaju, na zachód od Ain el-Qudeirat, zwykłego miejsca Kadesz-Barnea: w Ain el-Qoseimeh albo w Ain Muweileh kilka kilometrów dalej, gdzie umieszcza je mapa. Utożsamienie opiera się wyłącznie na kolejności punktów granicy; nic w terenie nie dało nazwy, żadne wydarzenie Biblii nie rozegrało się w Asmon, a Euzebiusz znał Asemonę tylko jako miasto na pustyni na granicy Judei ku Egiptowi."
    - "Dziś oaza Quseima leży w egipskiej muhafazie Synaj Północny, około 10 km na zachód od granicy z Izraelem."
  nl:
    - "Azmon was een punt op de zuidgrens van het beloofde land, alleen genoemd in de twee beschrijvingen van die grens. Numeri trekt de lijn van de beklimming van Akrabbim door Zin ten zuiden van Kades-Barnea, “naar Hazar-Addar, en doorgaan naar Azmon. Voorts zal deze landpale omgaan van Azmon naar de rivier van Egypte, en haar uitgangen zullen zijn naar de zee”. Jozua herhaalt het voor Juda: van Kades-Barnea langs Chesron, Adar en Karkaa, “En gaat door naar Azmon, en komt uit aan de beek van Egypte”. Azmon was dus de laatste genoemde plaats vóór de Beek van Egypte, gewoonlijk gehouden voor de Wadi el-Arish, en lag ergens ten westen van Kades."
    - "De plaats is gezocht bij de bronnen van de oase Quseima in het noordoosten van de Sinaï, ten westen van Ain el-Qudeirat, de gebruikelijke plaats van Kades-Barnea: bij Ain el-Qoseimeh, of bij Ain Muweileh enkele kilometers verder, waar de kaart haar plaatst. De identificatie berust alleen op de volgorde van de grenspunten; niets in het terrein heeft de naam opgeleverd, geen gebeurtenis uit de Bijbel vond bij Azmon plaats, en Eusebius kende Asemona slechts als een woestijnstad aan de grens van Judea richting Egypte."
    - "Tegenwoordig ligt de oase Quseima in het gouvernement Noord-Sinaï van Egypte, ongeveer 10 km ten westen van de grens met Israël."
  cs:
    - "Acmon byl bod na jižní hranici zaslíbené země, jmenovaný jen ve dvou popisech této hranice. Numeri vedou čáru od výstupu Akrabím přes Sín jižně od Kádeš-barney, „a odtud vyjde ke vsi Addar, a vztáhne se až k Asmon. Od Asmon zatočí se pomezí to vůkol až ku potoku Egyptskému, a tu se skonávati bude k západu“. Jozue ji opakuje pro Judu: od Kádeš-barney kolem Checronu, Addaru a Karkaa, „Odtud jde do Asmona, a vychází ku potoku Egyptskému“. Acmon byl tedy posledním jmenovaným místem před Egyptským potokem, obvykle pokládaným za vádí el-Aríš, a ležel někde západně od Kádeše."
    - "Místo se hledalo mezi prameny oázy Quseima v severovýchodním Sinaji, západně od Ain el-Qudeirat, obvyklého místa Kádeš-barney: v Ain el-Qoseimeh nebo v Ain Muweileh o několik kilometrů dál, kam jej klade mapa. Ztotožnění se opírá jen o pořadí hraničních bodů; nic na zemi jméno nevydalo, v Acmonu se nestala žádná biblická událost a Eusebios znal Asemonu jen jako pouštní město na hranici Judska k Egyptu."
    - "Dnes leží oáza Quseima v egyptském guvernorátu Severní Sinaj, asi 10 km západně od hranice s Izraelem."
  sv:
    - "Asmon var en punkt på det utlovade landets södra gräns, nämnd bara i de två beskrivningarna av den gränsen. Fjärde Mosebok drar linjen från Akrabbims stigning genom Sin söder om Kadesh-Barnea: ”Den skall gå vidare ut till Hasar-Addar och fram till Asmon. Och från Asmon skall gränsen böja sig mot Egyptens bäck och gå ut vid havet”. Josua upprepar den för Juda: från Kadesh-Barnea förbi Hesron, Addar och Karka, ”Vidare gick den fram till Asmon och därifrån ut till Egyptens bäck”. Asmon var alltså den sista namngivna platsen före Egyptens bäck, vanligen antagen vara Wadi el-Arish, och låg någonstans väster om Kadesh."
    - "Platsen har sökts bland källorna i oasen Quseima i nordöstra Sinai, väster om Ajin el-Qudeirat, den vanliga platsen för Kadesh-Barnea: vid Ajin el-Qoseimeh, eller vid Ajin Muweileh några kilometer bortom, där kartan placerar den. Identifieringen vilar enbart på gränspunkternas ordning; ingenting i terrängen har givit namnet, ingen bibelhändelse ägde rum i Asmon, och Eusebios kände Asemona bara som en ökenstad vid Judeens gräns mot Egypten."
    - "I dag ligger oasen Quseima i Egyptens guvernement Norra Sinai, omkring 10 km väster om gränsen mot Israel."
  nb:
    - "Asmon var et punkt på sørgrensen av det lovte land, nevnt bare i de to beskrivelsene av denne grensen. 4. Mosebok trekker linjen fra Akrabbim-skaret gjennom Sin sør for Kadesj-Barnea, «gå videre til Hasar-Adar og derfra ta over til Asmon. Fra Asmon skal grensen svinge bort til Egyptens bekk og så gå ut i havet». Josva gjentar det for Juda: fra Kadesj-Barnea forbi Hesron, Adar og Karka, «tok så bortefter til Asmon, gikk frem til Egyptens bekk og endte ute ved havet». Asmon var dermed det siste navngitte stedet før Egypts bekk, vanligvis regnet for Wadi el-Arish, og lå et sted vest for Kadesj."
    - "Stedet har vært søkt blant kildene i Quseima-oasen i nordøstlige Sinai, vest for Ajin el-Qudeirat, det vanlige stedet for Kadesj-Barnea: ved Ajin el-Qoseimeh, eller ved Ajin Muweileh noen få kilometer lenger, som er der kartet plasserer det. Identifiseringen hviler på rekkefølgen av grensepunktene alene; ingenting på bakken har gitt navnet, ingen bibelsk hendelse fant sted i Asmon, og Eusebius kjente Asemona bare som en ørkenby på grensen av Judea mot Egypt."
    - "I dag ligger Quseima-oasen i guvernementet Nord-Sinai i Egypt, omtrent 10 km vest for grensen mot Israel."
  tl:
    - "Ang Asmon ay punto sa katimugang hangganan ng lupang pangako, na pinangalanan lamang sa dalawang paglalarawan ng hangganang iyon. Iginuguhit ng Mga Bilang ang guhit mula sa pag-akyat ng Acrabbim sa Zin sa timog ng Cades-barnea, “mula rito ay pasampa sa Hasar-addar, at patuloy sa Asmon: At ang hangganan ay paliko mula sa Asmon hanggang sa batis ng Egipto, at ang magiging mga labasan niyaon ay sa dagat”. Inuulit ito ni Josue para sa hangganan ng Juda: mula Cades-barnea lampas sa Hezron, Addar at Carca, “At patuloy sa Azmon, at palabas sa batis ng Egipto”. Kaya ang Asmon ang huling pinangalanang lugar bago ang Batis ng Egipto, na karaniwang itinuturing na Wadi el-Arish, at nasa kanluran ng Cades."
    - "Hinanap ang lugar sa mga bukal ng oasis ng Quseima sa hilagang-silangang Sinai, sa kanluran ng Ain el-Qudeirat, ang karaniwang lugar ng Cades-barnea: sa Ain el-Qoseimeh, o sa Ain Muweileh ilang kilometro sa kabila nito, kung saan ito inilalagay ng mapa. Ang pagtutukoy ay nakasalig lamang sa pagkakasunod-sunod ng mga punto ng hangganan; walang nagbigay ng pangalan sa lupa, walang pangyayari sa Biblia ang naganap sa Asmon, at kilala lamang ni Eusebio ang Asemona bilang bayan sa disyerto sa hangganan ng Judea patungong Egipto."
    - "Ang oasis ng Quseima ay nasa Gobernorado ng Hilagang Sinai ng Egipto ngayon, mga 10 km sa kanluran ng hangganan ng Israel."
  da:
    - "Asmon var et punkt på det Forjættede Lands sydgrænse, nævnt kun i de to beskrivelser af denne grænse. 4 Mosebog trækker linjen fra Akrabbim-stigningen gennem Zin syd for Kadesj-Barnea, »og det skal gaa ud til Hazar-Adar og gaa over til Azmon. Og Landemærket skal gaa omkring fra Azmon til Ægyptens Bæk, og Udgangen derpaa skal være til Havet«. Josva gentager det for Juda: fra Kadesj-Barnea forbi Hezron, Addar og Karkaa, »og det gaar igennem til Azmon og gaar ud til Ægyptens Bæk«. Asmon var således det sidste navngivne sted før Egyptens Bæk, sædvanligvis taget for Wadi el-Arish, og lå et sted vest for Kadesj."
    - "Stedet er søgt blandt kilderne i Quseima-oasen i det nordøstlige Sinai, vest for Ain el-Qudeirat, det sædvanlige sted for Kadesj-Barnea: ved Ain el-Qoseimeh eller ved Ain Muweileh nogle få kilometer længere væk, hvor kortet placerer det. Identifikationen hviler alene på grænsepunkternes rækkefølge; intet på jorden har givet navnet, ingen begivenhed i Bibelen skete ved Asmon, og Eusebios kendte Asemona kun som en ørkenby på Judæas grænse mod Egypten."
    - "I dag ligger Quseima-oasen i Egyptens guvernement Nordsinai, omkring 10 km vest for grænsen til Israel."
  sr:
    - "Аселмон је била тачка на јужној међи обећане земље, именована само у два описа те међе. Књига Бројева повлачи линију од успона Акравима кроз Син јужно од Кадис-Варније, „нека изиђе на село Адар и иде до Аселмона; потом нека се савије та међа од Аселмона до потока мисирског и иде до мора“. Исус Навин понавља то за Јуду: од Кадис-Варније поред Есрома, Адара и Карке, „отуда, идући до Аселмона, излази на поток мисирски“. Аселмон је тако био последње именовано место пре Потока египатског, за који се обично узима Вади ел-Ариш, и лежао је негде западно од Кадиса."
    - "Место се тражило међу изворима оазе Кусејма у североисточном Синају, западно од Аин ел-Кудејрата, уобичајеног налазишта Кадис-Варније: у Аин ел-Косејмеу или у Аин Муејли неколико километара иза њега, где га карта поставља. Поистовећивање почива само на редоследу граничних тачака; ништа на терену није дало име, ниједан догађај Библије није се збио у Аселмону, а Јевсевије је знао Асемону само као пустињски град на граници Јудеје према Египту."
    - "Данас оаза Кусејма лежи у египатском гувернорату Северни Синај, око 10 км западно од границе с Израелом."
  hu:
    - "Acmon az Ígéret földjének déli határán álló pont, amelyet csak e határ két leírása nevez meg. A Számok könyve a vonalat az Akrabbim hágójától Cinen át Kádes-Barneától délre húzza, „és menjen tova Haczár-Adárig, és menjen át Aczmonig. Azután kerüljön a határ Aczmontól Égyiptom patakáig, a vége pedig a tengernél legyen”. Józsué Júdára megismétli: Kádes-Barneától Hecrón, Addár és Karka mellett, „majd átmegy Asmonnak és halad Égyiptom patakának”. Acmon tehát az Egyiptom pataka – általában a Wadi el-Arish – előtti utolsó megnevezett hely volt, és valahol Kádestől nyugatra feküdt."
    - "A helyet az északkelet-sínai Quseima-oázis forrásai között keresték, Ain el-Qudeirattól, Kádes-Barnea szokásos helyétől nyugatra: az Ain el-Qoseimehnél vagy a néhány kilométerrel azon túl fekvő Ain Muweilehnél, ahová a térkép is teszi. Az azonosítás kizárólag a határpontok sorrendjére épül; a terepen semmi sem őrizte meg a nevet, a Biblia egyetlen eseménye sem Acmonnál történt, Euszébiosz pedig Asemonát csak Júdea egyiptomi határán fekvő pusztai városként ismerte."
    - "Ma a Quseima-oázis Egyiptom Észak-Sínai kormányzóságában fekszik, az izraeli határtól mintegy 10 km-re nyugatra."
  fi:
    - "Asmon oli Luvatun maan eteläisen rajan piste, joka mainitaan vain kahdessa tämän rajan kuvauksessa. 4. Mooseksen kirja vetää linjan Akrabbimin nousulta Zinin kautta Kades-Barnean eteläpuolelle: ”Sieltä raja lähteköön Hasar-Addariin, kulkekoon Asmoniin ja kääntyköön Asmonista Egyptin purolle ja päättyköön mereen.” Joosua toistaa sen Juudan rajaksi: Kades-Barneasta Hesronin, Addarin ja Karkaan ohi, ”Edelleen se kulkee Asmoniin ja jatkuu Egyptin puroon”. Asmon oli siis viimeinen nimetty paikka ennen Egyptin puroa, jota pidetään yleensä Wadi el-Arishina, ja sijaitsi jossain Kadeksesta länteen."
    - "Paikkaa on etsitty Koillis-Siinain Quseiman keidaksen lähteiltä, Ain el-Qudeiratista, Kades-Barnean tavallisesta sijainnista, länteen: Ain el-Qoseimehista tai muutaman kilometrin sen takana olevalta Ain Muweilehiltä, minne kartta sen asettaa. Samaistus perustuu pelkästään rajapisteiden järjestykseen; mikään maastossa ei ole tuottanut nimeä, mikään Raamatun tapahtuma ei sijoittunut Asmoniin, ja Eusebios tunsi Asemonan vain Juudean rajalla Egyptiä kohti olevana aavikkokaupunkina."
    - "Nykyisin Quseiman keidas sijaitsee Egyptin Pohjois-Siinain kuvernementissa, noin 10 km Israelin rajasta länteen."
  vi:
    - "Át-môn là một điểm trên ranh giới phía nam của đất hứa, chỉ được nêu trong hai bản mô tả ranh giới ấy. Sách Dân Số Ký vạch đường từ dốc Ạc-ráp-bim qua Xin phía nam Ca-đe-Ba-nê-a, “đoạn chạy qua Hát-sa-Át-đa, và đi ngang hướng Át-môn. Từ Át-môn giới hạn chạy vòng về lối suối Ê-díp-tô và giáp biển”. Sách Giô-suê lặp lại cho Giu-đa: từ Ca-đe-Ba-nê-a qua Hết-rôn, Át-đa và Cạt-ca, rồi “đi ngang về hướng Át-nôn, đổ vào khe Ê-díp-tô”. Như vậy Át-môn là nơi có tên cuối cùng trước Khe Ê-díp-tô, thường được cho là Wadi el-Arish, và nằm đâu đó phía tây Ca-đe."
    - "Nơi này được tìm trong các mạch nước của ốc đảo Quseima ở đông bắc Sinai, phía tây Ain el-Qudeirat, địa điểm thông thường của Ca-đe-Ba-nê-a: tại Ain el-Qoseimeh, hoặc tại Ain Muweileh cách vài km, nơi bản đồ đặt nó. Sự đồng nhất chỉ dựa trên thứ tự các điểm ranh giới; không có gì trên mặt đất cho ra tên, không sự kiện nào của Kinh Thánh xảy ra tại Át-môn, và Eusebius chỉ biết Asemona là một thành trong sa mạc ở biên giới Giu-đê hướng về Ai Cập."
    - "Ngày nay ốc đảo Quseima nằm trong tỉnh Bắc Sinai của Ai Cập, cách biên giới với Israel khoảng 10 km về phía tây."
  ro:
    - "Ațmon era un punct pe hotarul de sud al țării făgăduite, numit doar în cele două descrieri ale acelui hotar. Numeri trasează linia de la urcușul Acrabimului prin Țin, la sud de Cades-Barnea: „și se va sfârșì la sălașul lui Arad, și va trece Asemona. Și va încunjurà hotarele dela Asemona valea Eghipetului, și va fi sfârșitul lor Marea cea mare”. Iosua o repetă pentru Iuda: de la Cades-Barnea pe lângă Hețron, Adar și Carcaa, apoi spre Ațmon, ieșind la pârâul Egiptului. Ațmon a fost astfel ultimul loc numit înainte de Pârâul Egiptului, socotit de obicei Wadi el-Arish, și se afla undeva la vest de Cades."
    - "Locul a fost căutat printre izvoarele oazei Quseima din nord-estul Sinaiului, la vest de Ain el-Qudeirat, locul obișnuit al Cades-Barnea: la Ain el-Qoseimeh sau la Ain Muweileh, la câțiva kilometri mai departe, unde îl pune harta. Identificarea se sprijină doar pe ordinea punctelor de hotar; nimic de pe teren nu a dat numele, niciun eveniment biblic nu s-a petrecut la Ațmon, iar Eusebiu cunoștea Asemona doar ca pe o cetate din deșert, la hotarul Iudeii spre Egipt."
    - "Astăzi oaza Quseima se află în guvernoratul Sinai de Nord al Egiptului, la aproximativ 10 km vest de granița cu Israelul."
  bg:
    - "Ацмон бил точка на южната граница на обетованата земя, назована само в двете описания на тази граница. Числа теглят линията от изкачването на Акравим през Цин южно от Кадес-Варни, „и ще излазя до Асад-адмар, и ще минува до Асмон. И ще се завръща пределът от Асмон до Египетския поток, и ще стига до морето“. Иисус Навин я повтаря за Юда: от Кадес-Варни покрай Хецрон, Адар и Каркаа, „и минуваше в Асмон, и излазяше до потока на Египет“. Така Ацмон бил последното назовано място преди Египетския поток, обикновено смятан за Вади ел-Ариш, и лежал някъде на запад от Кадеш."
    - "Мястото е търсено сред изворите на оазиса Кусейма в североизточен Синай, западно от Айн ел-Кудейрат, обичайното място на Кадес-Варни: при Айн ел-Косейме или при Айн Муейле на няколко километра отвъд него, където го поставя картата. Отъждествяването се опира единствено на реда на граничните точки; нищо на земята не е дало името, никакво събитие от Библията не е станало в Ацмон, а Евсевий знаел Асемона само като пустинен град на границата на Юдея към Египет."
    - "Днес оазисът Кусейма лежи в египетската мухафаза Северен Синай, на около 10 км западно от границата с Израил."
