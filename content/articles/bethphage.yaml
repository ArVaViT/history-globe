body:
  en:
    - "Bethphage, “house of unripe figs”, was a village on the Mount of Olives beside Bethany, the last stop before Jerusalem on the road up from Jericho. All three synoptic Gospels name it at the start of the entry into Jerusalem: “when they drew nigh unto Jerusalem, and were come to Bethphage, unto the mount of Olives, then sent Jesus two disciples” to fetch the ass and her colt from “the village over against you”; Mark and Luke say “Bethphage and Bethany”. Whether the colt was found in Bethphage itself or in Bethany the text does not say. The village is also known to rabbinic literature, which treats the wall of Bethphage as the outer limit of Jerusalem for certain rites, so that it must have stood close to the city on the east."
    - "Eusebius lists Bethphage as a village on the Mount of Olives where the Lord came, and Jerome's Latin version calls it a small village. The usual site is in Kefr et-Tur, the village on the mount's eastern slope just above al-Eizariya (Bethany), where in the 1870s a stone block came to light, painted by the Crusaders with the raising of Lazarus and the fetching of the colt; the Franciscans then built their chapel of Bethphage over it. Abu Dis, farther south-east, and Bethany itself are the other candidate sites on the map. Little of the ancient village has been excavated."
    - "Today the Franciscan church of Bethphage in at-Tur, with the painted stone inside it, is the place where the Palm Sunday procession to Jerusalem sets out each year along the road over the mount."
  ru:
    - "Виффагия, «дом незрелых смокв», — селение на горе Елеонской рядом с Вифанией, последняя остановка перед Иерусалимом на дороге, поднимающейся от Иерихона. Все три синоптических Евангелия называют её в начале входа в Иерусалим: «когда приблизились к Иерусалиму и пришли в Виффагию к горе Елеонской, тогда Иисус послал двух учеников» за ослицей и молодым ослом в «селение, которое прямо перед вами»; Марк и Лука говорят «к Виффагии и Вифании». Нашли ли ослёнка в самой Виффагии или в Вифании, текст не говорит. Селение знает и раввинская литература, для которой стена Виффагии — внешний предел Иерусалима для некоторых обрядов, так что оно должно было стоять вплотную к городу с востока."
    - "Евсевий числит Виффагию селением на горе Елеонской, куда приходил Господь, а латинский перевод Иеронима называет его маленьким селением. Обычное место — в Кефр-эт-Туре, деревне на восточном склоне горы прямо над Эль-Эйзарией (Вифанией), где в 1870-х годах был обнаружен каменный блок, расписанный крестоносцами сценами воскрешения Лазаря и приведения ослёнка; францисканцы затем построили над ним свою часовню Виффагии. Абу-Дис дальше к юго-востоку и сама Вифания — другие кандидаты, отмеченные на карте. Древнее селение почти не раскапывали."
    - "Сегодня францисканская церковь Виффагии в Эт-Туре, с расписанным камнем внутри, — место, откуда каждый год в Вербное воскресенье выходит шествие в Иерусалим по дороге через гору."
  uk:
    - "Віфагія, «дім незрілих смокв», була селом на Оливковій горі поряд із Віфанією, останньою зупинкою перед Єрусалимом на дорозі вгору від Єрихону. Усі три синоптичні євангелія називають її на початку входу до Єрусалима: «як зближались до Єрусалиму, й прийшли в Витфагию, до гори Оливної, послав тодї Ісус двох учеників», щоб привести ослицю й осля з неї із «села, що перед вами»; Марк каже: «до Витфагиї й Витаниї», Лука — «до Витфагиї та Витаниї». Чи знайшли осля у самій Віфагії, чи у Віфанії, текст не каже. Село відоме й рабинській літературі, яка вважає мур Віфагії зовнішньою межею Єрусалима для певних обрядів, тож воно мало стояти поруч із містом зі сходу."
    - "Євсевій перелічує Віфагію як село на Оливковій горі, куди прийшов Господь, а латинський переклад Ієроніма називає її малим селом. Звичайне місце її розташування — в Кефр-ет-Тур, селі на східному схилі гори просто над аль-Ейзарією (Віфанією), де в 1870-х рр. було виявлено кам'яний блок, розмальований хрестоносцями сценою воскресіння Лазаря та приведення осляти; тоді францисканці збудували над ним свою каплицю Віфагії. Абу-Діс, далі на південний схід, і сама Віфанія — інші місця-кандидати на мапі. Від давнього села розкопано мало."
    - "Сьогодні францисканська церква Віфагії в ат-Турі з розмальованим каменем усередині — місце, звідки щороку вирушає хресна хода Вербної неділі до Єрусалима дорогою через гору."
  es:
    - "Betfagé, «casa de los higos verdes», era una aldea del monte de los Olivos junto a Betania, la última parada antes de Jerusalén en el camino que sube desde Jericó. Los tres evangelios sinópticos la nombran al comienzo de la entrada en Jerusalén: «Y como se acercaron á Jerusalem, y vinieron á Bethfagé, al monte de las Olivas, entonces Jesús envió dos discípulos» a buscar la asna y su pollino en «la aldea que está delante de vosotros»; Marcos dice «de Bethphagé, y de Bethania», y Lucas, «de Bethfagé, y de Bethania». El texto no dice si el pollino se halló en la propia Betfagé o en Betania. La aldea es conocida también por la literatura rabínica, que considera el muro de Betfagé el límite exterior de Jerusalén para ciertos ritos, de modo que debió de estar cerca de la ciudad, por el este."
    - "Eusebio menciona Betfagé como una aldea del monte de los Olivos adonde llegó el Señor, y la versión latina de Jerónimo la llama aldea pequeña. El emplazamiento habitual está en Kefr et-Tur, la aldea de la ladera oriental del monte, justo por encima de al-Eizariya (Betania), donde en la década de 1870 salió a la luz un bloque de piedra, pintado por los cruzados con la resurrección de Lázaro y la búsqueda del pollino; los franciscanos edificaron entonces su capilla de Betfagé sobre él. Abu Dis, más al sudeste, y la propia Betania son los otros emplazamientos candidatos en el mapa. Se ha excavado poco de la antigua aldea."
    - "Hoy, la iglesia franciscana de Betfagé, en at-Tur, con la piedra pintada en su interior, es el lugar desde el que parte cada año la procesión del Domingo de Ramos hacia Jerusalén por el camino que cruza el monte."
  pt:
    - "Betfagé, “casa dos figos verdes”, era uma aldeia no Monte das Oliveiras, junto a Betânia, a última parada antes de Jerusalém na estrada que sobe de Jericó. Os três Evangelhos sinóticos a nomeiam no início da entrada em Jerusalém: “quando se aproximaram de Jerusalém e chegaram a Betesfagé, ao Monte das Oliveiras, Jesus enviou dois discípulos” para buscar a jumenta e seu jumentinho no “povoado que está em frente a vocês”; Marcos e Lucas dizem “Betesfagé e Betânia”. Se o jumentinho foi achado na própria Betfagé ou em Betânia, o texto não diz. A aldeia é conhecida também da literatura rabínica, que trata o muro de Betfagé como o limite externo de Jerusalém para certos ritos, de modo que ela deve ter ficado perto da cidade, a leste."
    - "Eusébio lista Betfagé como uma aldeia no Monte das Oliveiras aonde o Senhor veio, e a versão latina de Jerônimo a chama de pequena aldeia. O local habitual fica em Kefr et-Tur, a aldeia na encosta oriental do monte, logo acima de al-Eizariya (Betânia), onde, na década de 1870, veio à luz um bloco de pedra pintado pelos cruzados com a ressurreição de Lázaro e a busca do jumentinho; os franciscanos construíram então sobre ele a sua capela de Betfagé. Abu Dis, mais a sudeste, e a própria Betânia são os outros locais candidatos no mapa. Pouco da antiga aldeia foi escavado."
    - "Hoje a igreja franciscana de Betfagé, em at-Tur, com a pedra pintada em seu interior, é o lugar de onde parte todos os anos a procissão do Domingo de Ramos para Jerusalém, pela estrada que passa sobre o monte."
  de:
    - "Betphage, „Haus der unreifen Feigen“, war ein Dorf am Ölberg neben Bethanien, die letzte Station vor Jerusalem auf der Straße von Jericho hinauf. Alle drei synoptischen Evangelien nennen es zu Beginn des Einzugs in Jerusalem: „Da sie nun nahe an Jerusalem kamen, gen Bethphage an den Ölberg, sandte Jesus seiner Jünger zwei“, um die Eselin und ihr Füllen aus dem „Flecken, der vor euch liegt“ zu holen; Markus und Lukas sagen „gen Bethphage und Bethanien“. Ob das Füllen in Betphage selbst oder in Bethanien gefunden wurde, sagt der Text nicht. Das Dorf ist auch der rabbinischen Literatur bekannt, die die Mauer von Betphage für bestimmte Riten als äußere Grenze Jerusalems behandelt; es muss also nahe der Stadt im Osten gelegen haben."
    - "Eusebius führt Betphage als Dorf am Ölberg auf, wohin der Herr kam, und die lateinische Fassung des Hieronymus nennt es ein kleines Dorf. Der übliche Standort liegt in Kefr et-Tur, dem Dorf am Osthang des Berges direkt oberhalb von al-Eizariya (Bethanien), wo in den 1870er Jahren ein Steinblock zutage kam, den die Kreuzfahrer mit der Auferweckung des Lazarus und dem Holen des Füllens bemalt hatten; die Franziskaner errichteten darüber ihre Kapelle von Betphage. Abu Dis, weiter südöstlich, und Bethanien selbst sind die anderen Kandidaten auf der Karte. Vom antiken Dorf wurde wenig ausgegraben."
    - "Heute ist die franziskanische Kirche von Betphage in at-Tur mit dem bemalten Stein in ihrem Inneren der Ort, an dem jedes Jahr die Palmsonntagsprozession nach Jerusalem entlang der Straße über den Berg aufbricht."
  fr:
    - "Bethphagé, « maison des figues vertes », était un village du Mont des Oliviers, à côté de Béthanie, dernière étape avant Jérusalem sur la route montant de Jéricho. Les trois Évangiles synoptiques la nomment au début de l’entrée à Jérusalem : « Lorsqu’ils approchèrent de Jérusalem, et qu’ils furent arrivés à Bethphagé, vers la montagne des oliviers, Jésus envoya deux disciples » chercher l’ânesse et son ânon « au village qui est devant vous » ; Marc et Luc disent « de Bethphagé et de Béthanie ». Le texte ne dit pas si l’ânon fut trouvé à Bethphagé même ou à Béthanie. Le village est aussi connu de la littérature rabbinique, qui tient le mur de Bethphagé pour la limite extérieure de Jérusalem à l’égard de certains rites, de sorte qu’il devait se trouver tout près de la ville, à l’est."
    - "Eusèbe range Bethphagé parmi les villages du Mont des Oliviers où le Seigneur vint, et la version latine de Jérôme l’appelle un petit village. Le site habituel est à Kefr et-Tur, village du versant oriental de la montagne, juste au-dessus d’al-Eizariya (Béthanie), où, dans les années 1870, fut découvert un bloc de pierre que les croisés avaient orné de la résurrection de Lazare et de la quête de l’ânon ; les franciscains y bâtirent alors leur chapelle de Bethphagé. Abu Dis, plus au sud-est, et Béthanie même sont les autres sites candidats sur la carte. Peu de chose du village antique a été fouillé."
    - "Aujourd’hui, l’église franciscaine de Bethphagé à at-Tur, qui abrite la pierre peinte, est le lieu d’où part chaque année la procession du dimanche des Rameaux vers Jérusalem, par la route qui franchit la montagne."
  it:
    - "Betfage, «casa dei fichi acerbi», era un villaggio sul Monte degli Ulivi accanto a Betania, l’ultima tappa prima di Gerusalemme sulla strada che sale da Gerico. Tutti e tre i Vangeli sinottici la nominano all’inizio dell’ingresso in Gerusalemme: «quando furon vicini a Gerusalemme e furon giunti a Betfage, presso al monte degli Ulivi, Gesù mandò due discepoli» a prendere l’asina e il suo puledro dalla «borgata che è dirimpetto a voi»; Marco dice «a Betfage e Betania», Luca «a Betfage e a Betania». Se il puledro sia stato trovato a Betfage stessa o a Betania, il testo non lo dice. Il villaggio è noto anche alla letteratura rabbinica, che considera il muro di Betfage il limite esterno di Gerusalemme per certi riti, e perciò doveva sorgere vicino alla città, a oriente."
    - "Eusebio elenca Betfage come un villaggio sul Monte degli Ulivi dove venne il Signore, e la versione latina di Girolamo lo chiama un piccolo villaggio. Il sito abituale è a Kefr et-Tur, il villaggio sul versante orientale del monte, subito sopra al-Eizariya (Betania), dove negli anni 1870 venne alla luce un blocco di pietra, dipinto dai crociati con la risurrezione di Lazzaro e il recupero del puledro; i francescani vi costruirono poi sopra la loro cappella di Betfage. Abu Dis, più a sud-est, e la stessa Betania sono gli altri siti candidati sulla mappa. Dell’antico villaggio è stato scavato ben poco."
    - "Oggi la chiesa francescana di Betfage a at-Tur, con la pietra dipinta al suo interno, è il luogo da cui ogni anno parte la processione della Domenica delle Palme verso Gerusalemme lungo la strada che attraversa il monte."
  pl:
    - "Betfage, „dom niedojrzałych fig”, było wsią na Górze Oliwnej obok Betanii, ostatnim przystankiem przed Jerozolimą na drodze wiodącej w górę od Jerycha. Wszystkie trzy Ewangelie synoptyczne wymieniają je na początku wjazdu do Jerozolimy: „A gdy się przybliżyli do Jeruzalemu, i przyszli do Betfagie, do góry oliwnej, tedy Jezus posłał dwóch uczniów”, aby przyprowadzili oślicę i jej oślę z „miasteczka, które jest przeciwko wam”; Marek mówi: „do Betfagie i do Betanii”, Łukasz: „do Betfagie i Betanii”. Czy oślę znaleziono w samym Betfage, czy w Betanii, tekst nie mówi. Wieś zna też literatura rabiniczna, która uważa mur Betfage za zewnętrzną granicę Jerozolimy dla niektórych obrzędów, a więc musiała leżeć blisko miasta od wschodu."
    - "Euzebiusz wymienia Betfage jako wieś na Górze Oliwnej, do której przyszedł Pan, a łaciński przekład Hieronima nazywa ją małą wsią. Zwykle wskazuje się miejsce w Kefr et-Tur, wsi na wschodnim stoku góry tuż nad al-Ajzarijją (Betanią), gdzie w latach siedemdziesiątych XIX w. odkryto kamienny blok, pomalowany przez krzyżowców scenami wskrzeszenia Łazarza i sprowadzenia oślęcia; franciszkanie wznieśli nad nim swoją kaplicę Betfage. Abu Dis, dalej na południowy wschód, oraz sama Betania to inne miejsca kandydujące na mapie. Z dawnej wsi odkopano niewiele."
    - "Dziś franciszkański kościół Betfage w at-Tur, z malowanym kamieniem w środku, jest miejscem, z którego co roku w Niedzielę Palmową rusza procesja do Jerozolimy drogą przez górę."
  nl:
    - "Bethfage, “huis van onrijpe vijgen”, was een dorp op de Olijfberg naast Betanië, de laatste halte vóór Jeruzalem aan de weg omhoog vanuit Jericho. Alle drie de synoptische evangeliën noemen het aan het begin van de intocht in Jeruzalem: “En als zij nu Jeruzalem genaakten, en gekomen waren te Beth-fage, aan den Olijfberg, toen zond Jezus twee discipelen” om de ezelin en haar veulen te halen uit “het vlek, dat tegen u over ligt”; Marcus en Lukas zeggen “Beth-fage en Bethanie”. Of het veulen in Bethfage zelf of in Betanië werd gevonden, zegt de tekst niet. Het dorp is ook bekend uit de rabbijnse literatuur, die de muur van Bethfage als buitengrens van Jeruzalem beschouwt voor bepaalde riten, zodat het dicht bij de stad, aan de oostkant, moet hebben gelegen."
    - "Eusebius vermeldt Bethfage als een dorp op de Olijfberg waar de Heer kwam, en Hieronymus' Latijnse versie noemt het een klein dorp. De gebruikelijke plaats is Kefr et-Tur, het dorp op de oostelijke helling van de berg, vlak boven al-Eizariya (Betanië), waar in de jaren 1870 een steenblok aan het licht kwam dat door de kruisvaarders was beschilderd met de opwekking van Lazarus en het halen van het veulen; de franciscanen bouwden daarna hun kapel van Bethfage eromheen. Abu Dis, verder naar het zuidoosten, en Betanië zelf zijn de andere kandidaten op de kaart. Van het oude dorp is weinig opgegraven."
    - "Tegenwoordig is de franciscaanse kerk van Bethfage in at-Tur, met de beschilderde steen erin, de plaats waar elk jaar de Palmzondagsprocessie naar Jeruzalem vertrekt, langs de weg over de berg."
  cs:
    - "Betfage, „dům nezralých fíků“, byla vesnice na Olivové hoře vedle Betanie, poslední zastávka před Jeruzalémem na cestě vzhůru od Jericha. Všechna tři synoptická evangelia ji jmenují na začátku vjezdu do Jeruzaléma: „A když se přiblížili k Jeruzalému, a přišli do Betfage k hoře Olivetské, tedy Ježíš poslal dva učedlníky své“ pro oslici a oslátko do „městečka, kteréž proti vám jest“; Marek má „Betfagi i Betany“, Lukáš „k Betfagi a k Betany“. Zda bylo oslátko nalezeno v samém Betfage, nebo v Betanii, text neříká. Vesnici zná i rabínská literatura, která zeď Betfage pokládá za vnější hranici Jeruzaléma pro určité obřady, takže musela stát těsně u města na východě."
    - "Eusebios uvádí Betfage jako vesnici na Olivové hoře, kam přišel Pán, a Jeronýmova latinská verze ji nazývá malou vesnicí. Obvyklé místo je v Kefr et-Turu, vesnici na východním svahu hory těsně nad al-Eizariya (Betanií), kde byl v 70. letech 19. století nalezen kamenný blok, který křižáci pomalovali vzkříšením Lazara a přivedením oslátka; františkáni pak nad ním postavili svou betfažskou kapli. Abu Dis, dále na jihovýchod, a samotná Betanie jsou další kandidátská místa na mapě. Z dávné vesnice bylo vykopáno jen málo."
    - "Dnes je františkánský kostel Betfage v at-Turu s malovaným kamenem uvnitř místem, odkud každý rok vychází průvod na Květnou neděli do Jeruzaléma po cestě přes horu."
  sv:
    - "Betfage, ”de omogna fikonens hus”, var en by på Olivberget intill Betania, den sista anhalten före Jerusalem på vägen upp från Jeriko. Alla tre synoptiska evangelierna nämner den vid inledningen av intåget i Jerusalem: ”När de nu nalkades Jerusalem och kommo till Betfage vid Oljeberget, då sände Jesus åstad två lärjungar” för att hämta åsninnan och hennes fåle i ”byn som ligger mitt framför eder”; Markus och Lukas säger ”Betfage och Betania”. Om fålen fanns i själva Betfage eller i Betania säger texten inte. Byn är också känd i den rabbinska litteraturen, som behandlar Betfages mur som Jerusalems yttre gräns för vissa riter, så den måste ha legat nära staden i öster."
    - "Eusebios för upp Betfage som en by på Olivberget dit Herren kom, och Hieronymus latinska version kallar den en liten by. Den vanliga platsen ligger i Kefr et-Tur, byn på bergets östsluttning strax ovanför al-Eizariya (Betania), där ett stenblock kom i dagen på 1870-talet, målat av korsfararna med uppväckandet av Lasaros och hämtandet av fålen; franciskanerna byggde sedan sitt Betfagekapell över det. Abu Dis, längre åt sydost, och Betania självt är de andra kandidatplatserna på kartan. Litet av den antika byn har grävts ut."
    - "I dag är den franciskanska Betfagekyrkan i at-Tur, med den målade stenen inuti, platsen där palmsöndagens procession till Jerusalem varje år startar längs vägen över berget."
  nb:
    - "Betfage, «de umodne fikens hus», var en landsby på Oljeberget ved siden av Betania, siste stopp før Jerusalem på veien opp fra Jeriko. Alle tre synoptiske evangelier nevner den ved begynnelsen av inntoget i Jerusalem: «da de kom nær til Jerusalem og var kommet til Betfage ved Oljeberget, da sendte Jesus to disipler avsted» for å hente eselet og dets fole fra «den by som ligger rett for eder»; Markus og Lukas sier «Betfage og Betania». Om folen ble funnet i selve Betfage eller i Betania, sier teksten ikke. Landsbyen er også kjent fra rabbinsk litteratur, som regner Betfages mur som Jerusalems ytre grense for visse ritualer, så den må ha ligget tett ved byen i øst."
    - "Eusebius fører opp Betfage som en landsby på Oljeberget dit Herren kom, og Hieronymus' latinske versjon kaller den en liten landsby. Det vanlige stedet er i Kefr et-Tur, landsbyen på bergets østskråning like ovenfor al-Eizariya (Betania), der det på 1870-tallet kom for dagen en steinblokk, malt av korsfarerne med oppvekkelsen av Lasarus og hentingen av folen; franciskanerne bygde så sitt Betfage-kapell over den. Abu Dis, lenger sørøst, og Betania selv er de andre kandidatene på kartet. Lite av den gamle landsbyen er gravd ut."
    - "I dag er den franciskanske Betfage-kirken i at-Tur, med den malte steinen inne i seg, stedet der palmesøndagsprosesjonen til Jerusalem hvert år begynner langs veien over berget."
  tl:
    - "Ang Betfage, “bahay ng mga hilaw na igos”, ay isang nayon sa Bundok ng mga Olibo sa tabi ng Betania, ang huling hinto bago ang Jerusalem sa daang paakyat mula sa Jerico. Pinangangalanan ito ng lahat ng tatlong Ebanghelyong sinoptiko sa simula ng pagpasok sa Jerusalem: “At nang malapit na sila sa Jerusalem, at magsidating sa Betfage, sa bundok ng mga Olivo, ay nagsugo nga si Jesus ng dalawang alagad” upang kunin ang babaing asno at ang batang asno nito mula sa “nayong nasa tapat ninyo”; sinasabi nina Marcos at Lucas na “Betfage at Betania”. Hindi sinasabi ng teksto kung nasumpungan ang bisiro sa mismong Betfage o sa Betania. Kilala rin ang nayon sa panitikang rabiniko, na itinuturing ang pader ng Betfage na panlabas na hangganan ng Jerusalem para sa ilang ritwal, kaya dapat na nakatayo ito malapit sa lungsod sa silangan."
    - "Inililista ni Eusebio ang Betfage bilang nayon sa Bundok ng mga Olibo na pinuntahan ng Panginoon, at tinatawag itong maliit na nayon ng bersiyong Latin ni Jeronimo. Ang karaniwang pook ay sa Kefr et-Tur, ang nayon sa silangang dalisdis ng bundok na nasa itaas lamang ng al-Eizariya (Betania), kung saan noong dekada 1870 ay lumitaw ang isang bloke ng bato, na pinintahan ng mga Krusado ng tagpo ng pagbangon kay Lazaro at ng pagkuha sa bisiro; itinayo roon ng mga Pransiskano ang kanilang kapilya ng Betfage. Ang Abu Dis, sa timog-silangan pa, at ang Betania mismo ang iba pang pook na kandidato sa mapa. Kaunti lamang ng sinaunang nayon ang nahukay."
    - "Ngayon, ang simbahang Pransiskano ng Betfage sa at-Tur, na nasa loob ang ipinintang bato, ang pook kung saan nagsisimula taon-taon ang prusisyon ng Linggo ng Palaspas patungong Jerusalem sa daan sa ibabaw ng bundok."
  da:
    - "Betfage, »de umodne figeners hus«, var en landsby på Oliebjerget ved siden af Betania, det sidste stop før Jerusalem på vejen op fra Jeriko. Alle tre synoptiske evangelier nævner den i begyndelsen af indtoget i Jerusalem: »Og da de nærmede sig Jerusalem og kom til Bethfage ved Oliebjerget, da udsendte Jesus to Disciple« for at hente æselhoppen og dens føl fra »den Landsby, som ligger lige for eder«; Markus og Lukas siger »Bethfage og Bethania«. Om føllet blev fundet i selve Betfage eller i Betania, siger teksten ikke. Landsbyen kendes også fra den rabbinske litteratur, som regner Betfages mur for Jerusalems ydre grænse ved visse riter, så den må have ligget tæt på byen mod øst."
    - "Eusebius opfører Betfage som en landsby på Oliebjerget, hvor Herren kom, og Hieronymus' latinske bearbejdelse kalder den en lille landsby. Det sædvanlige sted er i Kefr et-Tur, landsbyen på bjergets østlige skråning lige over al-Eizariya (Betania), hvor der i 1870'erne kom en stenblok for dagen, malet af korsfarerne med Lazarus' opvækkelse og hentningen af føllet; franciskanerne byggede derefter deres Betfage-kapel over den. Abu Dis, længere mod sydøst, og Betania selv er de andre kandidatsteder på kortet. Lidt af den antikke landsby er udgravet."
    - "I dag er franciskanernes Betfage-kirke i at-Tur med den malede sten indeni det sted, hvorfra palmesøndagsprocessionen til Jerusalem hvert år begynder langs vejen over bjerget."
  sr:
    - "Витфага, „дом незрелих смокава“, било је село на Маслинској гори поред Витаније, последња станица пред Јерусалимом на путу који се пење из Јерихона. Сва три синоптичка јеванђеља именују је на почетку уласка у Јерусалим: „И кад се приближише к Јерусалиму и дођоше у Витфагу к маслинској гори, онда Исус посла два ученика“ да доведу магарицу и магаре из села „што је према вама“; Марко и Лука кажу „Витфази и Витанији“. Да ли је магаре нађено у самој Витфази или у Витанији, текст не каже. Село је познато и рабинској књижевности, која зид Витфаге сматра спољном границом Јерусалима за извесне обреде, па је морало стајати близу града на истоку."
    - "Јевсевије наводи Витфагу као село на Маслинској гори куда је дошао Господ, а Јеронимов латински превод је назива малим селом. Уобичајено налазиште је у Кефр ет Туру, селу на источној падини горе одмах изнад Ел Азарије (Витаније), где је 1870-их изашао на видело камени блок који су крсташи осликали подизањем Лазара и довођењем магарета; фрањевци су затим над њим подигли своју капелу Витфаге. Абу Дис, даље југоисточно, и сама Витанија остала су налазишта-кандидати на карти. Од старог села мало је ископано."
    - "Данас је францишканска црква Витфаге у ет Туру, са осликаним каменом унутра, место одакле сваке године креће литија на Цвети према Јерусалиму путем преко горе."
