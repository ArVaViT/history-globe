  - "Babylonian Talmud, Pesahim 63b and 91a; Menahot 78b (the wall of Bethphage)"
  - "S. J. Saller and E. Testa, The Archaeological Setting of the Shrine of Bethphage (1961)"
  - "J. Murphy-O'Connor, The Holy Land: An Oxford Archaeological Guide (5th ed., 2008)"
