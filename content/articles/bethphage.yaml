# Overview article (ADR 0007). Mainstream facts only; the Franciscan site at et-Tur is the usual one, and the app's other two candidates are named.
id: bethphage
place: abff59d
title:
  en: "Bethphage"
  ru: "Виффагия"
  uk: "Віфагія"
  es: "Betfagé"
  pt: "Betfagé"
  de: "Betphage"
  fr: "Bethphagé"
body:
  en:
    - "Bethphage, “house of unripe figs”, was a village on the Mount of Olives beside Bethany, the last stop before Jerusalem on the road up from Jericho. All three synoptic Gospels name it at the start of the entry into Jerusalem: “when they drew nigh unto Jerusalem, and were come to Bethphage, unto the mount of Olives, then sent Jesus two disciples” to fetch the ass and her colt from “the village over against you”; Mark and Luke say “unto Bethphage and Bethany, at the mount of Olives”. Whether the colt was found in Bethphage itself or in Bethany the text does not say. The village is also known to rabbinic literature, which treats the wall of Bethphage as the outer limit of Jerusalem for certain rites, so that it must have stood close to the city on the east."
    - "Eusebius lists Bethphage as a village on the Mount of Olives where the Lord came, and Jerome's Latin version calls it a small village. The usual site is in Kefr et-Tur, the village on the mount's eastern slope just above al-Eizariya (Bethany), where in the 1870s a local man came upon a stone block, painted by the Crusaders with the raising of Lazarus and the fetching of the colt; the Franciscans then built their chapel of Bethphage over it. Abu Dis, farther south-east, and Bethany itself are the other candidate sites on the map. Little of the ancient village has been excavated."
    - "Today the Franciscan church of Bethphage in at-Tur, with the painted stone inside it, is the place where the Palm Sunday procession to Jerusalem sets out each year along the road over the mount."
  ru:
    - "Виффагия, «дом незрелых смокв», — селение на горе Елеонской рядом с Вифанией, последняя остановка перед Иерусалимом на дороге, поднимающейся от Иерихона. Все три синоптических Евангелия называют её в начале входа в Иерусалим: «когда приблизились к Иерусалиму и пришли в Виффагию к горе Елеонской, тогда Иисус послал двух учеников» за ослицей и молодым ослом в «селение, которое прямо перед вами»; Марк и Лука говорят «к Виффагии и Вифании, к горе Елеонской». Нашли ли ослёнка в самой Виффагии или в Вифании, текст не говорит. Селение знает и раввинская литература, для которой стена Виффагии — внешний предел Иерусалима для некоторых обрядов, так что оно должно было стоять вплотную к городу с востока."
    - "Евсевий числит Виффагию селением на горе Елеонской, куда приходил Господь, а латинский перевод Иеронима называет его маленьким селением. Обычное место — в Кефр-эт-Туре, деревне на восточном склоне горы прямо над Эль-Эйзарией (Вифанией), где в 1870-х годах местный житель наткнулся на каменный блок, расписанный крестоносцами сценами воскрешения Лазаря и приведения ослёнка; францисканцы затем построили над ним свою часовню Виффагии. Абу-Дис дальше к юго-востоку и сама Вифания — другие кандидаты, отмеченные на карте. Древнее селение почти не раскапывали."
    - "Сегодня францисканская церковь Виффагии в Эт-Туре, с расписанным камнем внутри, — место, откуда каждый год в Вербное воскресенье выходит шествие в Иерусалим по дороге через гору."
  uk:
    - "Віфагія, «дім незрілих смокв», була селом на Оливковій горі поряд із Віфанією, останньою зупинкою перед Єрусалимом на дорозі вгору від Єрихону. Усі три синоптичні євангелія називають її на початку входу до Єрусалима: «як зближались до Єрусалиму, й прийшли в Витфагию, до гори Оливної, послав тодї Ісус двох учеників», щоб привести ослицю й осля з неї із «села, що перед вами»; Марк і Лука кажуть: «до Витфагиї й Витаниї, до гори Оливної». Чи знайшли осля у самій Віфагії, чи у Віфанії, текст не каже. Село відоме й рабинській літературі, яка вважає мур Віфагії зовнішньою межею Єрусалима для певних обрядів, тож воно мало стояти поруч із містом зі сходу."
    - "Євсевій перелічує Віфагію як село на Оливковій горі, куди прийшов Господь, а латинський переклад Ієроніма називає її малим селом. Звичайне місце її розташування — в Кефр-ет-Тур, селі на східному схилі гори просто над аль-Ейзарією (Віфанією), де в 1870-х рр. місцевий чоловік натрапив на кам'яний блок, розмальований хрестоносцями сценою воскресіння Лазаря та приведення осляти; тоді францисканці збудували над ним свою каплицю Віфагії. Абу-Діс, далі на південний схід, і сама Віфанія — інші місця-кандидати на мапі. Від давнього села розкопано мало."
    - "Сьогодні францисканська церква Віфагії в ат-Турі з розмальованим каменем усередині — місце, звідки щороку вирушає хресна хода Вербної неділі до Єрусалима дорогою через гору."
  es:
    - "Betfagé, «casa de los higos verdes», era una aldea del monte de los Olivos junto a Betania, la última parada antes de Jerusalén en el camino que sube desde Jericó. Los tres evangelios sinópticos la nombran al comienzo de la entrada en Jerusalén: «Y como se acercaron á Jerusalem, y vinieron á Bethfagé, al monte de las Olivas, entonces Jesús envió dos discípulos» a buscar la asna y su pollino en «la aldea que está delante de vosotros»; Marcos y Lucas dicen «de Bethphagé, y de Bethania, al monte de las Olivas». El texto no dice si el pollino se halló en la propia Betfagé o en Betania. La aldea es conocida también por la literatura rabínica, que considera el muro de Betfagé el límite exterior de Jerusalén para ciertos ritos, de modo que debió de estar cerca de la ciudad, por el este."
    - "Eusebio menciona Betfagé como una aldea del monte de los Olivos adonde llegó el Señor, y la versión latina de Jerónimo la llama aldea pequeña. El emplazamiento habitual está en Kefr et-Tur, la aldea de la ladera oriental del monte, justo por encima de al-Eizariya (Betania), donde en la década de 1870 un lugareño dio con un bloque de piedra, pintado por los cruzados con la resurrección de Lázaro y la búsqueda del pollino; los franciscanos edificaron entonces su capilla de Betfagé sobre él. Abu Dis, más al sudeste, y la propia Betania son los otros emplazamientos candidatos en el mapa. Se ha excavado poco de la antigua aldea."
    - "Hoy, la iglesia franciscana de Betfagé, en at-Tur, con la piedra pintada en su interior, es el lugar desde el que parte cada año la procesión del Domingo de Ramos hacia Jerusalén por el camino que cruza el monte."
  pt:
    - "Betfagé, “casa dos figos verdes”, era uma aldeia no Monte das Oliveiras, junto a Betânia, a última parada antes de Jerusalém na estrada que sobe de Jericó. Os três Evangelhos sinóticos a nomeiam no início da entrada em Jerusalém: “quando se aproximaram de Jerusalém e chegaram a Betesfagé, ao Monte das Oliveiras, Jesus enviou dois discípulos” para buscar a jumenta e seu jumentinho no “povoado que está em frente a vocês”; Marcos e Lucas dizem “a Betesfagé e Betânia, junto ao Monte das Oliveiras”. Se o jumentinho foi achado na própria Betfagé ou em Betânia, o texto não diz. A aldeia é conhecida também da literatura rabínica, que trata o muro de Betfagé como o limite externo de Jerusalém para certos ritos, de modo que ela deve ter ficado perto da cidade, a leste."
    - "Eusébio lista Betfagé como uma aldeia no Monte das Oliveiras aonde o Senhor veio, e a versão latina de Jerônimo a chama de pequena aldeia. O local habitual fica em Kefr et-Tur, a aldeia na encosta oriental do monte, logo acima de al-Eizariya (Betânia), onde, na década de 1870, um morador achou um bloco de pedra pintado pelos cruzados com a ressurreição de Lázaro e a busca do jumentinho; os franciscanos construíram então sobre ele a sua capela de Betfagé. Abu Dis, mais a sudeste, e a própria Betânia são os outros locais candidatos no mapa. Pouco da antiga aldeia foi escavado."
    - "Hoje a igreja franciscana de Betfagé, em at-Tur, com a pedra pintada em seu interior, é o lugar de onde parte todos os anos a procissão do Domingo de Ramos para Jerusalém, pela estrada que passa sobre o monte."
  de:
    - "Betphage, „Haus der unreifen Feigen“, war ein Dorf am Ölberg neben Bethanien, die letzte Station vor Jerusalem auf der Straße von Jericho hinauf. Alle drei synoptischen Evangelien nennen es zu Beginn des Einzugs in Jerusalem: „Da sie nun nahe an Jerusalem kamen, gen Bethphage an den Ölberg, sandte Jesus seiner Jünger zwei“, um die Eselin und ihr Füllen aus dem „Flecken, der vor euch liegt“ zu holen; Markus und Lukas sagen „gen Bethphage und Bethanien an den Ölberg“. Ob das Füllen in Betphage selbst oder in Bethanien gefunden wurde, sagt der Text nicht. Das Dorf ist auch der rabbinischen Literatur bekannt, die die Mauer von Betphage für bestimmte Riten als äußere Grenze Jerusalems behandelt; es muss also nahe der Stadt im Osten gelegen haben."
    - "Eusebius führt Betphage als Dorf am Ölberg auf, wohin der Herr kam, und die lateinische Fassung des Hieronymus nennt es ein kleines Dorf. Der übliche Standort liegt in Kefr et-Tur, dem Dorf am Osthang des Berges direkt oberhalb von al-Eizariya (Bethanien), wo in den 1870er Jahren ein Einheimischer auf einen Steinblock stieß, den die Kreuzfahrer mit der Auferweckung des Lazarus und dem Holen des Füllens bemalt hatten; die Franziskaner errichteten darüber ihre Kapelle von Betphage. Abu Dis, weiter südöstlich, und Bethanien selbst sind die anderen Kandidaten auf der Karte. Vom antiken Dorf wurde wenig ausgegraben."
    - "Heute ist die franziskanische Kirche von Betphage in at-Tur mit dem bemalten Stein in ihrem Inneren der Ort, an dem jedes Jahr die Palmsonntagsprozession nach Jerusalem entlang der Straße über den Berg aufbricht."
  fr:
    - "Bethphagé, « maison des figues vertes », était un village du Mont des Oliviers, à côté de Béthanie, dernière étape avant Jérusalem sur la route montant de Jéricho. Les trois Évangiles synoptiques la nomment au début de l’entrée à Jérusalem : « Lorsqu’ils approchèrent de Jérusalem, et qu’ils furent arrivés à Bethphagé, vers la montagne des oliviers, Jésus envoya deux disciples » chercher l’ânesse et son ânon « au village qui est devant vous » ; Marc et Luc disent « de Bethphagé et de Béthanie, vers la montagne des oliviers ». Le texte ne dit pas si l’ânon fut trouvé à Bethphagé même ou à Béthanie. Le village est aussi connu de la littérature rabbinique, qui tient le mur de Bethphagé pour la limite extérieure de Jérusalem à l’égard de certains rites, de sorte qu’il devait se trouver tout près de la ville, à l’est."
    - "Eusèbe range Bethphagé parmi les villages du Mont des Oliviers où le Seigneur vint, et la version latine de Jérôme l’appelle un petit village. Le site habituel est à Kefr et-Tur, village du versant oriental de la montagne, juste au-dessus d’al-Eizariya (Béthanie), où, dans les années 1870, un habitant découvrit un bloc de pierre que les croisés avaient orné de la résurrection de Lazare et de la quête de l’ânon ; les franciscains y bâtirent alors leur chapelle de Bethphagé. Abu Dis, plus au sud-est, et Béthanie même sont les autres sites candidats sur la carte. Peu de chose du village antique a été fouillé."
    - "Aujourd’hui, l’église franciscaine de Bethphagé à at-Tur, qui abrite la pierre peinte, est le lieu d’où part chaque année la procession du dimanche des Rameaux vers Jérusalem, par la route qui franchit la montagne."
