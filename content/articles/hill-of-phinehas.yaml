# Overview article (ADR 0007). The hill of Phinehas is unlocated; the Samaritan and Jewish tradition at Awarta is shown, and the map's point (Burj el-Bardawil near Jifna, from the atlas data) is named as such without a claimed proponent.
id: hill-of-phinehas
place: a3bba31
title:
  en: "Hill of Phinehas"
  ru: "Холм Финееса"
  cs: "Pahorek Pinchasův"
  uk: "Пагорб Фінеєса"
  pl: "Gibea Pinchasa"
  es: "Collado de Finees"
  pt: "Gibeá de Fineias"
  de: "Gibea des Pinhas"
  fr: "Colline de Phinées"
  it: "Colle di Pincas"
  nl: "Gibea van Pinechas"
  sv: "Pinechas kulle"
  nb: "Pinhas' høyde"
  tl: "Burol ni Phinees"
body:
  en:
    - "The book of Joshua ends with three burials. After Joshua and the bones of Joseph, “Eleazar the son of Aaron died; and they buried him in a hill that pertained to Phinehas his son, which was given him in mount Ephraim.” The Hebrew word, gibeah, means a hill, and is also a place name, so the verse can be read either as a hill belonging to Phinehas or as a town called Gibeah of Phinehas in the hill country of Ephraim. It is named only here, and its site is not known; the map marks Burj el-Bardawil near Jifna, north of Ramallah, as the atlas data place it."
    - "A long tradition places the hill at Awarta, a village 8 km south-east of Nablus. Between the fourth and the twelfth centuries Awarta was an important Samaritan centre with one of their main synagogues, and in the early eighteenth century a Samaritan bought the holy site for his community. Large tombs there are shown as those of Aaron's sons Eleazar and Ithamar and of Phinehas with his son Abishua, whom the Samaritans especially revere; Jews, Samaritans and Muslims have all venerated them, and Jewish sources call the place Giv'at Pinehas. Awarta lies today in the West Bank."
  ru:
    - "Книга Иисуса Навина заканчивается тремя погребениями. После Иисуса и костей Иосифа «умер и Елеазар, сын Аарона первосвященник, и похоронили его на холме Финееса, сына его, который дан ему на горе Ефремовой». Еврейское слово гива значит «холм» и бывает также названием места, поэтому стих можно читать и как холм, принадлежавший Финеесу, и как город Гива Финееса в горах Ефремовых. Он назван только здесь, и его место неизвестно; карта отмечает Бурдж-эль-Бардавиль близ Джифны, к северу от Рамаллы, как его помещают данные атласа."
    - "Давнее предание помещает холм в Аварте, селении в 8 км к юго-востоку от Наблуса. С IV по XII в. Аварта была важным самарянским центром с одной из их главных синагог, а в начале XVIII в. святое место купил для своей общины один самарянин. Большие гробницы там показывают как гробницы сыновей Аарона Елеазара и Ифамара и Финееса с его сыном Авишуем, которого самаряне особенно чтут; их почитали иудеи, самаряне и мусульмане, а еврейские источники называют это место Гиват-Пинхас. Аварта находится сегодня на Западном берегу."
  cs:
    - "Kniha Jozue končí třemi pohřby. Po Jozuovi a kostech Josefových: „Eleazar také, syn Aronův, umřel, a pochovali jej na pahrbku Fínesa syna jeho, kterýž dán byl jemu na hoře Efraim.“ Hebrejské slovo gibea znamená pahorek a je také místním jménem, takže verš lze číst buď jako pahorek patřící Pinchasovi, nebo jako město zvané Gibea Pinchasova v efrajimském pohoří. Je jmenován jen zde a jeho poloha není známa; mapa vyznačuje Burdž el-Bardawíl poblíž Džifny, severně od Rámalláhu, jak udávají data atlasu."
    - "Dlouhá tradice klade pahorek do Awarty, vesnice 8 km jihovýchodně od Nábulusu. Mezi čtvrtým a dvanáctým stoletím byla Awarta důležitým samaritánským střediskem s jednou z jejich hlavních synagog a na počátku osmnáctého století koupil jeden Samaritán svaté místo pro svou obec. Velké hrobky tam jsou ukazovány jako hrobky Áronových synů Eleazara a Itamara a Pinchase s jeho synem Abišuou, kterého Samaritáni zvlášť ctí; Židé, Samaritáni i muslimové je všichni uctívali a židovské prameny nazývají místo Giv'at Pinchas. Awarta leží dnes na Západním břehu."
  uk:
    - "Книга Ісуса Навина закінчується трьома похованнями. Після Ісуса й кісток Йосипа: «Умер же й Елеазар Ароненко, і поховано його на горі Фінееса, сина його, що надїлено йому на Ефраїм горах». Єврейське слово гіва означає пагорб і є також назвою місця, тож вірш можна читати як пагорб, що належав Фінеєсові, або як місто на ім'я Гіва Фінеєса в горах Єфрема. Воно назване лише тут, і його місце невідоме; мапа позначає Бурдж-ель-Бардавіль біля Джифни, на північ від Рамалли, як дають атласні дані."
    - "Давня традиція розміщує пагорб в Аварті, селі за 8 км на південний схід від Наблуса. Між IV і XII ст. Аварта була важливим самарійським центром з однією з їхніх головних синагог, а на початку XVIII ст. один самарянин купив святе місце для своєї громади. Великі гробниці там показують як гробниці синів Аарона Елеазара та Іфамара і Фінеєса з його сином Авішуа, якого самаряни особливо шанують; євреї, самаряни й мусульмани вшановували їх усі, а єврейські джерела називають місце Гів'ат-Пінхас. Аварта лежить нині на Західному березі."
  pl:
    - "Księga Jozuego kończy się trzema pogrzebami. Po Jozuem i kościach Józefa: „Eleazar także, syn Aaronów, umarł; i pogrzebali go na pagórku Fineesa, syna jego, który mu był dany na górze Efraim”. Hebrajskie słowo gibea oznacza wzgórze i jest także nazwą miejscową, więc werset można czytać jako wzgórze należące do Pinchasa lub jako miasto zwane Gibea Pinchasa w górach Efraima. Jest wymienione tylko tu, a jego położenie jest nieznane; mapa wskazuje Burdż el-Bardawil koło Dżifny, na północ od Ramallah, tak jak podają dane atlasu."
    - "Długa tradycja umieszcza wzgórze w Awarcie, wsi 8 km na południowy wschód od Nablusu. Między IV a XII wiekiem Awarta była ważnym ośrodkiem samarytańskim z jedną z ich głównych synagog, a na początku XVIII wieku pewien Samarytanin kupił święte miejsce dla swojej wspólnoty. Duże grobowce pokazuje się tam jako groby synów Aarona, Eleazara i Itamara, oraz Pinchasa z jego synem Abiszuą, szczególnie czczonym przez Samarytan; Żydzi, Samarytanie i muzułmanie czcili je wszyscy, a źródła żydowskie nazywają to miejsce Givat Pinchas. Awarta leży dziś na Zachodnim Brzegu."
  es:
    - "El libro de Josué termina con tres sepulturas. Después de Josué y los huesos de José: «También murió Eleazar, hijo de Aarón; al cual enterraron en el collado de Phinees su hijo, que le fué dado en el monte de Ephraim». La palabra hebrea, guibá, significa colina y es también un nombre de lugar, de modo que el versículo puede leerse como una colina que pertenecía a Finees o como una ciudad llamada Gabaa de Finees en la región montañosa de Efraín. Solo se nombra aquí y se desconoce su emplazamiento; el mapa marca Burj el-Bardawil, cerca de Jifna, al norte de Ramala, según los datos del atlas."
    - "Una larga tradición sitúa la colina en Awarta, una aldea a 8 km al sureste de Nablus. Entre los siglos IV y XII Awarta fue un importante centro samaritano con una de sus principales sinagogas, y a comienzos del siglo XVIII un samaritano compró el lugar santo para su comunidad. Allí se muestran grandes tumbas como las de los hijos de Aarón Eleazar e Itamar y las de Finees con su hijo Abisúa, a quien los samaritanos veneran especialmente; judíos, samaritanos y musulmanes los han venerado, y las fuentes judías llaman al lugar Giv'at Pinehas. Awarta se encuentra hoy en Cisjordania."
  pt:
    - "O livro de Josué termina com três sepultamentos. Depois de Josué e dos ossos de José: “Eleazar, filho de Arão, morreu. Eles o sepultaram na colina de Fineias, seu filho, que lhe fora dada na região montanhosa de Efraim.” A palavra hebraica gibeá significa colina e é também um nome de lugar, de modo que o versículo pode ser lido tanto como uma colina pertencente a Fineias quanto como uma cidade chamada Gibeá de Fineias na região montanhosa de Efraim. É nomeada somente aqui, e seu sítio não é conhecido; o mapa marca Burj el-Bardawil, perto de Jifna, ao norte de Ramallah, conforme os dados do atlas."
    - "Uma longa tradição situa a colina em Awarta, uma aldeia a 8 km a sudeste de Nablus. Entre os séculos IV e XII, Awarta foi um importante centro samaritano, com uma de suas principais sinagogas, e no início do século XVIII um samaritano comprou o lugar santo para sua comunidade. Grandes túmulos ali são mostrados como os de Eleazar e Itamar, filhos de Arão, e de Fineias com seu filho Abisua, a quem os samaritanos veneram especialmente; judeus, samaritanos e muçulmanos os veneraram, e fontes judaicas chamam o lugar Giv'at Pinehas. Awarta fica hoje na Cisjordânia."
  de:
    - "Das Buch Josua endet mit drei Begräbnissen. Nach Josua und den Gebeinen Josefs: „Eleasar, der Sohn Aarons, starb auch, und sie begruben ihn zu Gibea, der Stadt seines Sohnes Pinehas, die ihm gegeben war auf dem Gebirge Ephraim.“ Das hebräische Wort gibea bedeutet Hügel und ist auch ein Ortsname, sodass der Vers entweder als ein Hügel, der Pinhas gehörte (so die King-James-Bibel), oder als eine Stadt namens Gibea des Pinhas im Gebirge Ephraim gelesen werden kann. Sie wird nur hier genannt, und ihre Lage ist nicht bekannt; die Karte markiert Burdsch el-Bardawil bei Dschifna, nördlich von Ramallah, wie es die Atlasdaten ansetzen."
    - "Eine lange Überlieferung setzt den Hügel in Awarta an, einem Dorf 8 km südöstlich von Nablus. Zwischen dem vierten und dem zwölften Jahrhundert war Awarta ein bedeutendes samaritanisches Zentrum mit einer ihrer wichtigsten Synagogen, und im frühen achtzehnten Jahrhundert kaufte ein Samaritaner die heilige Stätte für seine Gemeinschaft. Große Gräber dort werden als die von Aarons Söhnen Eleasar und Itamar und von Pinhas mit seinem Sohn Abisua gezeigt, den die Samaritaner besonders verehren; Juden, Samaritaner und Muslime haben sie alle verehrt, und jüdische Quellen nennen den Ort Giv'at Pinchas. Awarta liegt heute im Westjordanland."
  fr:
    - "Le livre de Josué s’achève sur trois sépultures. Après Josué et les ossements de Joseph : « Éléazar, fils d’Aaron, mourut, et on l’enterra à Guibeath-Phinées, qui avait été donnée à son fils Phinées, dans la montagne d’Éphraïm. » Le mot hébreu, guibea, signifie une colline et est aussi un nom de lieu, de sorte que le verset se lit soit comme une colline appartenant à Phinées (version du roi Jacques), soit comme une ville nommée Guibeath-Phinées (Louis Segond) dans la région montagneuse d’Éphraïm. Elle n’est nommée qu’ici, et son site est inconnu ; la carte marque Burj el-Bardawil près de Jifna, au nord de Ramallah, comme le donnent les données de l’atlas."
    - "Une longue tradition place la colline à Awarta, village à 8 km au sud-est de Naplouse. Entre le IVe et le XIIe siècle, Awarta fut un centre samaritain important, avec l’une de leurs principales synagogues, et au début du XVIIIe siècle un Samaritain acheta le lieu saint pour sa communauté. De grands tombeaux y sont montrés comme ceux des fils d’Aaron, Éléazar et Ithamar, et de Phinées avec son fils Abischua, que les Samaritains révèrent tout particulièrement ; Juifs, Samaritains et musulmans les ont tous vénérés, et les sources juives appellent le lieu Giv’at Pinehas. Awarta se trouve aujourd’hui en Cisjordanie."
  it:
    - "Il libro di Giosuè si chiude con tre sepolture. Dopo Giosuè e le ossa di Giuseppe, «morì anche Eleazar, figliuolo di Aaronne, e lo seppellirono a Ghibeah di Fineas, ch’era stata data al suo figliuolo Fineas, nella contrada montuosa di Efraim». La parola ebraica, ghibeah, significa colle ed è anche un nome di luogo, perciò il versetto può essere letto o come un colle appartenente a Pincas o come una città detta Ghibeah di Pincas sulle montagne di Efraim. È nominato solo qui e il suo sito non è noto; la carta segna Burj el-Bardawil presso Jifna, a nord di Ramallah, come indicano i dati dell’atlante."
    - "Una lunga tradizione colloca il colle ad Awarta, un villaggio a 8 km a sud-est di Nablus. Tra il IV e il XII secolo Awarta fu un importante centro samaritano con una delle loro sinagoghe principali, e all’inizio del XVIII secolo un samaritano comprò il luogo santo per la sua comunità. Grandi tombe vi sono mostrate come quelle dei figli di Aronne Eleazaro e Itamar e di Pincas con suo figlio Abisua, che i Samaritani venerano in modo particolare; ebrei, samaritani e musulmani le hanno tutti venerate, e le fonti ebraiche chiamano il luogo Giv‘at Pinehas. Awarta si trova oggi in Cisgiordania."
  nl:
    - "Het boek Jozua eindigt met drie begrafenissen. Na Jozua en de beenderen van Jozef: “Ook stierf Eleazar, de zoon van Aaron; en zij begroeven hem op den heuvel van Pinehas, zijn zoon, die hem gegeven was geweest op het gebergte van Efraim.” Het Hebreeuwse woord, gibea, betekent heuvel en is ook een plaatsnaam, zodat het vers kan worden gelezen als een heuvel die aan Pinechas toebehoorde of als een stad genaamd Gibea van Pinechas in het bergland van Efraïm. Het wordt alleen hier genoemd, en de ligging is niet bekend; de kaart markeert Burj el-Bardawil bij Jifna, ten noorden van Ramallah, zoals de atlasgegevens haar plaatsen."
    - "Een lange overlevering plaatst de heuvel bij Awarta, een dorp 8 km ten zuidoosten van Nablus. Tussen de vierde en de twaalfde eeuw was Awarta een belangrijk Samaritaans centrum met een van hun voornaamste synagogen, en in het begin van de achttiende eeuw kocht een Samaritaan de heilige plaats voor zijn gemeenschap. Grote graven daar worden getoond als die van Aärons zonen Eleazar en Itamar en van Pinechas met zijn zoon Abisua, die de Samaritanen bijzonder vereren; Joden, Samaritanen en moslims hebben ze allen vereerd, en Joodse bronnen noemen de plaats Giv'at Pinehas. Awarta ligt tegenwoordig op de Westelijke Jordaanoever."
  sv:
    - "Josuas bok slutar med tre begravningar. Efter Josua och Josefs ben: ”Och Eleasar, Arons son, dog, och man begrov honom i hans son Pinehas' stad, Gibea, som hade blivit denne given i Efraims bergsbygd.” Det hebreiska ordet, gibeah, betyder en kulle och är också ett ortnamn, så versen kan läsas antingen som en kulle som tillhörde Pinechas eller som en stad kallad Pinechas' Giva i Efraims bergsbygd. Den nämns bara här, och dess läge är inte känt; kartan markerar Burj el-Bardawil nära Jifna, norr om Ramallah, så som atlasdata anger."
    - "En lång tradition placerar kullen i Awarta, en by 8 km sydost om Nablus. Mellan 300- och 1100-talen var Awarta ett viktigt samaritiskt centrum med en av deras främsta synagogor, och i början av 1700-talet köpte en samarit den heliga platsen åt sitt samfund. Stora gravar där visas som Arons söner Eleasars och Itamars och som Pinechas och hans son Avishuas, vilka samaritanerna särskilt vördar; judar, samaritaner och muslimer har alla vördat dem, och judiska källor kallar platsen Giv'at Pinehas. Awarta ligger i dag på Västbanken."
  nb:
    - "Josvas bok slutter med tre gravlegginger. Etter Josva og Josefs ben: «Og Eleasar, Arons sønn, døde, og de begravde ham på den haug som hans sønn Pinehas hadde fått i Efra'im-fjellene.» Det hebraiske ordet, gibea, betyr en høyde og er også et stedsnavn, så verset kan leses enten som en høyde som tilhørte Pinhas eller som en by kalt Pinhas' Gibea i Efraims fjellland. Den nevnes bare her, og stedet er ikke kjent; kartet markerer Burj el-Bardawil nær Jifna, nord for Ramallah, slik atlasdataene plasserer det."
    - "En lang tradisjon plasserer høyden ved Awarta, en landsby 8 km sørøst for Nablus. Mellom 300- og 1100-tallet var Awarta et viktig samaritansk senter med en av deres viktigste synagoger, og tidlig på 1700-tallet kjøpte en samaritan det hellige stedet for sitt samfunn. Store graver der vises som graver til Arons sønner Eleasar og Itamar og til Pinhas med sønnen Abisjua, som samaritanene særlig ærer; jøder, samaritaner og muslimer har alle æret dem, og jødiske kilder kaller stedet Giv'at Pinehas. Awarta ligger i dag på Vestbredden."
  tl:
    - "Nagtatapos ang aklat ni Josue sa tatlong libing. Pagkatapos ni Josue at ng mga buto ni Jose, “namatay si Eleazar na anak ni Aaron; at inilibing nila siya sa burol ni Phinees na kaniyang anak na nabigay sa kaniya sa lupaing maburol ng Ephraim.” Ang salitang Hebreo, gibeah, ay nangangahulugang burol at pangalan din ng isang lugar, kaya mababasa ang talata bilang isang burol na pag-aari ni Phinees o bilang isang bayang tinatawag na Gibea ni Phinees sa maburol na lupain ng Ephraim. Dito lamang ito binabanggit, at hindi alam ang kinalalagyan nito; minamarkahan ng mapa ang Burj el-Bardawil malapit sa Jifna, hilaga ng Ramallah, ayon sa datos ng atlas."
    - "Isang matagal nang tradisyon ang naglalagay ng burol sa Awarta, isang nayon na 8 km sa timog-silangan ng Nablus. Mula ika-4 hanggang ika-12 siglo, ang Awarta ay mahalagang sentro ng mga Samaritano na may isa sa kanilang pangunahing sinagoga, at noong unang bahagi ng ika-18 siglo ay binili ng isang Samaritano ang banal na lugar para sa kaniyang komunidad. Ang malalaking libingan doon ay ipinakikilalang mga libingan ng mga anak ni Aaron na sina Eleazar at Ithamar at ni Phinees kasama ang anak nitong si Abisua, na lalo nang iginagalang ng mga Samaritano; iginalang ang mga ito ng mga Judio, Samaritano at Muslim, at tinatawag ng mga sanggunian ng mga Judio ang lugar na Giv'at Pinehas. Ang Awarta ay nasa West Bank ngayon."
