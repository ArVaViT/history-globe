body:
  en:
    - "Ecbatana, Old Persian Hagmatana, lies under the city of Hamadan in western Iran, at the foot of Mount Alvand, the ancient Orontes, on the main road from Mesopotamia to the Iranian plateau. It was the chief city of the Medes. Herodotus says that Deioces, their first king, built it with seven walls one within another, their battlements each of a different colour and the two innermost plated with silver and gold. Because the modern city covers the site, little certainly Median has been found; excavations on the mound of Tepe Hegmataneh have chiefly exposed a quarter that is usually dated to the Parthian age, though it has also been taken for Median."
    - "About 550 BC the army of the Median king Astyages mutinied and handed him over to Cyrus, who took Ecbatana and carried its silver and gold to Anshan, as the Nabonidus Chronicle records. Under the Persians it was a royal residence, where, Xenophon says, the king spent the summer. When the Mede Phraortes rebelled, Darius I had him put to death at Ecbatana, as his Bisitun inscription relates. Darius and his son Xerxes cut inscriptions in the rock at Ganj Nameh nearby."
    - 'The Book of Ezra tells how the Jews'' right to rebuild the temple in Jerusalem was questioned under Darius. A search was made in the archives of Babylon, and at Achmetha, the Aramaic name of Ecbatana, "in the palace that is in the province of the Medes", a roll was found with the decree of Cyrus'' first year that the house of God be rebuilt. Darius confirmed it, and the temple was finished.'
    - "Alexander the Great reached Ecbatana in 330 BC and had the treasure brought from Persis stored in its citadel; his friend Hephaestion died there in 324 BC. Polybius describes its palace, with beams of cedar and cypress plated with silver and gold, and says that Antiochus III still found enough silver tiles and gold to coin nearly 4,000 talents. Under the Parthians it was a summer residence of the kings, as Strabo records, and as Hamadan it lived on through Sasanian times."
  ru:
    - "Екбатана, по-древнеперсидски Хагматана, лежит под городом Хамаданом на западе Ирана, у подножия горы Альванд, древнего Оронта, на главной дороге из Месопотамии на Иранское нагорье. Это был главный город мидян. Геродот рассказывает, что Деиок, их первый царь, построил его с семью стенами одна внутри другой; зубцы каждой были своего цвета, а у двух внутренних — покрыты серебром и золотом. Древний город скрыт под современным, поэтому несомненно мидийского здесь найдено мало; раскопки на холме Тепе-Хегматане открыли главным образом квартал, который обычно относят к парфянскому времени, хотя его относили и к мидийскому."
    - "Около 550 г. до н. э. войско мидийского царя Астиага восстало и выдало его Киру, который взял Екбатану и увёз её серебро и золото в Аншан, как сообщает Хроника Набонида. При персах Екбатана была царской резиденцией, где, по словам Ксенофонта, цари проводили лето. Когда восстал мидянин Фравартиш, Дарий I казнил его в Екбатане, о чём говорит Бехистунская надпись. Дарий и его сын Ксеркс высекли надписи на скале Гяндж-Наме поблизости."
    - "Книга Ездры рассказывает, что при Дарии право иудеев восстанавливать храм в Иерусалиме было оспорено. Искали в вавилонском книгохранилище, и в Екбатане (по-арамейски Ахмета), «во дворце, который в области Мидии», нашли свиток с указом Кира, данным в первый год его царствования, о том, чтобы дом Божий был отстроен. Дарий подтвердил указ, и храм был достроен."
    - "Александр Македонский пришёл в Екбатану в 330 г. до н. э. и велел сложить в её цитадели сокровища, привезённые из Персиды; его друг Гефестион умер здесь в 324 г. до н. э. Полибий описывает её дворец с балками из кедра и кипариса, обитыми серебром и золотом, и пишет, что Антиох III нашёл здесь ещё столько серебряной черепицы и золота, что начеканил монет почти на 4000 талантов. При парфянах Екбатана была летней резиденцией царей, как сообщает Страбон, а под именем Хамадан она жила и при Сасанидах."
  uk:
    - "Екбатана, староперською Хагматана, лежить під містом Хамадан на заході Ірану, біля підніжжя гори Альванд, давнього Оронта, на головній дорозі з Месопотамії на Іранське плато. Це було головне місто мідян. Геродот каже, що Дейок, їхній перший цар, збудував його із сімома мурами один в одному, з зубцями кожен іншого кольору, причому два внутрішні були оббиті сріблом і золотом. Оскільки сучасне місто покриває місце, певно мідійського знайдено мало; розкопки на горбі Тепе-Хегматане переважно відкрили квартал, який зазвичай датують парфянською добою, хоча його також вважали мідійським."
    - "Близько 550 р. до н. е. військо мідійського царя Астіага збунтувалося і видало його Кірові, який узяв Екбатану й повіз її срібло та золото в Аншан, як записує Хроніка Набоніда. За персів це була царська резиденція, де, за Ксенофонтом, цар проводив літо. Коли мідянин Фраорт збунтувався, Дарій I наказав стратити його в Екбатані, як розповідає його Бісутунський напис. Дарій і його син Ксеркс вирізали написи в скелі біля Гандж-Наме поблизу."
    - "Книга Ездри розповідає, як за Дарія було поставлено під сумнів право юдеїв відбудовувати храм в Єрусалимі. У книгосховищі Вавилона шукали, і в Ахметі, арамейській назві Екбатани, «в палатї, що в країнї Мидиї», знайшли звій з указом першого року Кіра про відбудову дому Божого. Дарій підтвердив його, і храм було закінчено."
    - "Александр Великий дійшов до Екбатани в 330 р. до н. е. і наказав зберігати в її цитаделі скарб, привезений з Персиди; його друг Гефестіон помер там у 324 р. до н. е. Полібій описує її палац, з балками з кедра й кипариса, оббитими сріблом і золотом, і каже, що Антіох III усе ще знайшов досить срібних плиток і золота, щоб викарбувати майже 4000 талантів. За парфян це була літня резиденція царів, як записує Страбон, і як Хамадан вона жила далі в часи Сасанідів."
  es:
    - "Ecbatana, en persa antiguo Hagmatana, yace bajo la ciudad de Hamadán, en el oeste de Irán, al pie del monte Alvand, el antiguo Orontes, en el camino principal de Mesopotamia a la meseta iraní. Era la ciudad principal de los medos. Heródoto dice que Deyoces, su primer rey, la construyó con siete murallas una dentro de otra, con las almenas de cada una de un color distinto y las dos más interiores chapadas de plata y oro. Como la ciudad moderna cubre el sitio, se ha hallado poco que sea con certeza medo; las excavaciones en el montículo de Tepe Hegmataneh han sacado a la luz sobre todo un barrio que suele fecharse en la época parta, aunque también se ha tomado por medo."
    - "Hacia el 550 a. C. el ejército del rey medo Astiages se amotinó y lo entregó a Ciro, que tomó Ecbatana y se llevó su plata y su oro a Anshan, como registra la Crónica de Nabónido. Bajo los persas fue residencia real, donde, según Jenofonte, el rey pasaba el verano. Cuando el medo Fraortes se rebeló, Darío I lo hizo ejecutar en Ecbatana, como relata su inscripción de Behistún. Darío y su hijo Jerjes hicieron grabar inscripciones en la roca de Ganj Nameh, cerca de allí."
    - "El libro de Esdras cuenta cómo se puso en duda bajo Darío el derecho de los judíos a reconstruir el templo de Jerusalén. Se hizo una búsqueda en los archivos de Babilonia, y en Acmeta, el nombre arameo de Ecbatana, «en Achmetta, en el palacio que está en la provincia de Media», se halló un libro con el decreto del primer año de Ciro para que se reedificara la casa de Dios. Darío lo confirmó, y el templo fue concluido."
    - "Alejandro Magno llegó a Ecbatana en el 330 a. C. y mandó guardar en su ciudadela el tesoro traído de Pérsida; su amigo Hefestión murió allí en el 324 a. C. Polibio describe su palacio, con vigas de cedro y de ciprés chapadas de plata y oro, y dice que Antíoco III todavía halló plata en tejas y oro suficientes para acuñar casi 4000 talentos. Bajo los partos fue residencia de verano de los reyes, como registra Estrabón, y como Hamadán siguió viviendo durante la época sasánida."
  pt:
    - "Ecbatana, em persa antigo Hagmatana, jaz sob a cidade de Hamadan, no oeste do Irã, ao pé do monte Alvand, o antigo Orontes, na principal estrada da Mesopotâmia para o planalto iraniano. Era a principal cidade dos medos. Heródoto diz que Dejoces, seu primeiro rei, a construiu com sete muros, um dentro do outro, com ameias cada uma de uma cor diferente e as duas mais internas revestidas de prata e ouro. Como a cidade moderna cobre o local, pouco de certamente medo foi achado; as escavações no monte de Tepe Hegmataneh expuseram sobretudo um bairro geralmente datado da época parta, embora também tenha sido tomado por medo."
    - "Por volta de 550 a.C., o exército do rei medo Astíages se amotinou e o entregou a Ciro, que tomou Ecbatana e levou sua prata e ouro a Anshan, como registra a Crônica de Nabonido. Sob os persas foi residência real, onde, diz Xenofonte, o rei passava o verão. Quando o medo Fraortes se rebelou, Dario I o mandou matar em Ecbatana, como relata sua inscrição de Bisutun. Dario e seu filho Xerxes gravaram inscrições na rocha em Ganj Nameh, ali perto."
    - "O livro de Esdras conta como o direito dos judeus de reconstruir o templo em Jerusalém foi questionado sob Dario. Fez-se uma busca nos arquivos da Babilônia, e em Acmeta, o nome aramaico de Ecbatana, “no palácio que fica na província da Média”, achou-se um rolo com o decreto do primeiro ano de Ciro para que a casa de Deus fosse reconstruída. Dario o confirmou, e o templo foi concluído."
    - "Alexandre, o Grande, chegou a Ecbatana em 330 a.C. e mandou guardar em sua cidadela o tesouro trazido da Pérsis; seu amigo Heféstion morreu ali em 324 a.C. Políbio descreve seu palácio, com vigas de cedro e cipreste revestidas de prata e ouro, e diz que Antíoco III ainda achou prata e ouro em telhas suficientes para cunhar quase 4.000 talentos. Sob os partas foi residência de verão dos reis, como registra Estrabão, e, como Hamadan, sobreviveu pelos tempos sassânidas."
  de:
    - "Ekbatana, altpersisch Hagmatana, liegt unter der Stadt Hamadan im Westen Irans, am Fuß des Berges Alwand, des antiken Orontes, an der Hauptstraße von Mesopotamien zum iranischen Hochland. Es war die Hauptstadt der Meder. Herodot sagt, Deiokes, ihr erster König, habe sie mit sieben ineinanderliegenden Mauern erbaut, deren Zinnen jeweils eine andere Farbe hatten und von denen die beiden innersten mit Silber und Gold überzogen waren. Weil die moderne Stadt den Ort bedeckt, ist wenig sicher Medisches gefunden worden; Ausgrabungen auf dem Hügel Tepe Hegmataneh haben vor allem ein Viertel freigelegt, das gewöhnlich in die Partherzeit datiert wird, obwohl es auch für medisch gehalten wurde."
    - "Um 550 v. Chr. meuterte das Heer des medischen Königs Astyages und lieferte ihn Kyrus aus, der Ekbatana einnahm und sein Silber und Gold nach Anschan brachte, wie die Nabonid-Chronik berichtet. Unter den Persern war es Residenz, in der, wie Xenophon sagt, der König den Sommer verbrachte. Als sich der Meder Phraortes empörte, ließ Darius I. ihn in Ekbatana hinrichten, wie seine Behistun-Inschrift erzählt. Darius und sein Sohn Xerxes ließen in der Nähe bei Ganj Nameh Inschriften in den Fels hauen."
    - "Das Buch Esra erzählt, wie das Recht der Juden, den Tempel in Jerusalem wieder aufzubauen, unter Darius in Frage gestellt wurde. Man suchte in den Archiven von Babylon, und in Achmeta, dem aramäischen Namen von Ekbatana, fand man „im Schloß, das in Medien liegt“, eine Schriftrolle mit dem Erlass aus dem ersten Jahr des Kyrus, dass das Haus Gottes wieder gebaut werden solle. Darius bestätigte ihn, und der Tempel wurde vollendet."
    - "Alexander der Große erreichte Ekbatana 330 v. Chr. und ließ den aus Persis herbeigeschafften Schatz in seiner Burg lagern; sein Freund Hephaistion starb dort 324 v. Chr. Polybios beschreibt seinen Palast mit Balken aus Zeder und Zypresse, die mit Silber und Gold überzogen waren, und sagt, Antiochos III. habe noch genug silberne Ziegel und Gold gefunden, um fast 4000 Talente zu münzen. Unter den Parthern war es, wie Strabon berichtet, Sommerresidenz der Könige, und als Hamadan lebte es durch die Sasanidenzeit fort."
  fr:
    - "Ecbatane, en vieux perse Hagmatana, se trouve sous la ville de Hamadan, dans l’ouest de l’Iran, au pied du mont Alvand, l’ancien Oronte, sur la grande route de la Mésopotamie au plateau iranien. C’était la principale ville des Mèdes. Hérodote dit que Déjocès, leur premier roi, la bâtit avec sept murailles concentriques, aux créneaux chacun d’une couleur différente, les deux plus intérieurs plaqués d’argent et d’or. Comme la ville moderne couvre le site, on y a peu trouvé de certainement mède ; les fouilles du tertre de Tepe Hegmataneh ont surtout dégagé un quartier que l’on date d’ordinaire de l’époque parthe, bien qu’on l’ait aussi tenu pour mède."
    - "Vers 550 av. J.-C., l’armée du roi mède Astyage se mutina et le livra à Cyrus, qui prit Ecbatane et emporta son argent et son or à Anshan, comme le consigne la Chronique de Nabonide. Sous les Perses, c’était une résidence royale où, dit Xénophon, le roi passait l’été. Quand le Mède Phraorte se révolta, Darius Ier le fit exécuter à Ecbatane, comme le relate son inscription de Behistun. Darius et son fils Xerxès firent graver des inscriptions dans le roc à Ganj Nameh, tout près."
    - "Le livre d’Esdras raconte comment le droit des Juifs à rebâtir le temple de Jérusalem fut contesté sous Darius. On fit des recherches dans les archives de Babylone, et à Achmetha, nom araméen d’Ecbatane, « capitale de la province de Médie », on trouva un rouleau portant le décret de la première année de Cyrus ordonnant de rebâtir la maison de Dieu. Darius le confirma, et le temple fut achevé."
    - "Alexandre le Grand atteignit Ecbatane en 330 av. J.-C. et y fit déposer dans la citadelle le trésor rapporté de Perside ; son ami Héphestion y mourut en 324 av. J.-C. Polybe décrit son palais, aux poutres de cèdre et de cyprès plaquées d’argent et d’or, et dit qu’Antiochus III y trouva encore assez de tuiles d’argent et d’or pour frapper près de 4 000 talents. Sous les Parthes, c’était une résidence d’été des rois, comme le rapporte Strabon, et sous le nom de Hamadan elle survécut à l’époque sassanide."
