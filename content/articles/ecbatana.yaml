body:
  en:
    - "Ecbatana, Old Persian Hagmatana, lies under the city of Hamadan in western Iran, at the foot of Mount Alvand, the ancient Orontes, on the main road from Mesopotamia to the Iranian plateau. It was the chief city of the Medes. Herodotus says that Deioces, their first king, built it with seven walls one within another, their battlements each of a different colour and the two innermost plated with silver and gold. Because the modern city covers the site, little certainly Median has been found; excavations on the mound of Tepe Hegmataneh have chiefly exposed a quarter that is usually dated to the Parthian age, though it has also been taken for Median."
    - "About 550 BC the army of the Median king Astyages mutinied and handed him over to Cyrus, who took Ecbatana and carried its silver and gold to Anshan, as the Nabonidus Chronicle records. Under the Persians it was a royal residence, where, Xenophon says, the king spent the summer. When the Mede Phraortes rebelled, Darius I had him put to death at Ecbatana, as his Bisitun inscription relates. Darius and his son Xerxes cut inscriptions in the rock at Ganj Nameh nearby."
    - 'The Book of Ezra tells how the Jews'' right to rebuild the temple in Jerusalem was questioned under Darius. A search was made in the archives of Babylon, and at Achmetha, the Aramaic name of Ecbatana, "in the palace that is in the province of the Medes", a roll was found with the decree of Cyrus'' first year that the house of God be rebuilt. Darius confirmed it, and the temple was finished.'
    - "Alexander the Great reached Ecbatana in 330 BC and had the treasure brought from Persis stored in its citadel; his friend Hephaestion died there in 324 BC. Polybius describes its palace, with beams of cedar and cypress plated with silver and gold, and says that Antiochus III still found enough silver tiles and gold to coin nearly 4,000 talents. Under the Parthians it was a summer residence of the kings, as Strabo records, and as Hamadan it lived on through Sasanian times."
  ru:
    - "Екбатана, по-древнеперсидски Хагматана, лежит под городом Хамаданом на западе Ирана, у подножия горы Альванд, древнего Оронта, на главной дороге из Месопотамии на Иранское нагорье. Это был главный город мидян. Геродот рассказывает, что Деиок, их первый царь, построил его с семью стенами одна внутри другой; зубцы каждой были своего цвета, а у двух внутренних — покрыты серебром и золотом. Древний город скрыт под современным, поэтому несомненно мидийского здесь найдено мало; раскопки на холме Тепе-Хегматане открыли главным образом квартал, который обычно относят к парфянскому времени, хотя его относили и к мидийскому."
    - "Около 550 г. до н. э. войско мидийского царя Астиага восстало и выдало его Киру, который взял Екбатану и увёз её серебро и золото в Аншан, как сообщает Хроника Набонида. При персах Екбатана была царской резиденцией, где, по словам Ксенофонта, цари проводили лето. Когда восстал мидянин Фравартиш, Дарий I казнил его в Екбатане, о чём говорит Бехистунская надпись. Дарий и его сын Ксеркс высекли надписи на скале Гяндж-Наме поблизости."
    - "Книга Ездры рассказывает, что при Дарии право иудеев восстанавливать храм в Иерусалиме было оспорено. Искали в вавилонском книгохранилище, и в Екбатане (по-арамейски Ахмета), «во дворце, который в области Мидии», нашли свиток с указом Кира, данным в первый год его царствования, о том, чтобы дом Божий был отстроен. Дарий подтвердил указ, и храм был достроен."
    - "Александр Македонский пришёл в Екбатану в 330 г. до н. э. и велел сложить в её цитадели сокровища, привезённые из Персиды; его друг Гефестион умер здесь в 324 г. до н. э. Полибий описывает её дворец с балками из кедра и кипариса, обитыми серебром и золотом, и пишет, что Антиох III нашёл здесь ещё столько серебряной черепицы и золота, что начеканил монет почти на 4000 талантов. При парфянах Екбатана была летней резиденцией царей, как сообщает Страбон, а под именем Хамадан она жила и при Сасанидах."
  uk:
    - "Екбатана, староперською Хагматана, лежить під містом Хамадан на заході Ірану, біля підніжжя гори Альванд, давнього Оронта, на головній дорозі з Месопотамії на Іранське плато. Це було головне місто мідян. Геродот каже, що Дейок, їхній перший цар, збудував його із сімома мурами один в одному, з зубцями кожен іншого кольору, причому два внутрішні були оббиті сріблом і золотом. Оскільки сучасне місто покриває місце, певно мідійського знайдено мало; розкопки на горбі Тепе-Хегматане переважно відкрили квартал, який зазвичай датують парфянською добою, хоча його також вважали мідійським."
    - "Близько 550 р. до н. е. військо мідійського царя Астіага збунтувалося і видало його Кірові, який узяв Екбатану й повіз її срібло та золото в Аншан, як записує Хроніка Набоніда. За персів це була царська резиденція, де, за Ксенофонтом, цар проводив літо. Коли мідянин Фраорт збунтувався, Дарій I наказав стратити його в Екбатані, як розповідає його Бісутунський напис. Дарій і його син Ксеркс вирізали написи в скелі біля Гандж-Наме поблизу."
    - "Книга Ездри розповідає, як за Дарія було поставлено під сумнів право юдеїв відбудовувати храм в Єрусалимі. У книгосховищі Вавилона шукали, і в Ахметі, арамейській назві Екбатани, «в палатї, що в країнї Мидиї», знайшли звій з указом першого року Кіра про відбудову дому Божого. Дарій підтвердив його, і храм було закінчено."
    - "Александр Великий дійшов до Екбатани в 330 р. до н. е. і наказав зберігати в її цитаделі скарб, привезений з Персиди; його друг Гефестіон помер там у 324 р. до н. е. Полібій описує її палац, з балками з кедра й кипариса, оббитими сріблом і золотом, і каже, що Антіох III усе ще знайшов досить срібних плиток і золота, щоб викарбувати майже 4000 талантів. За парфян це була літня резиденція царів, як записує Страбон, і як Хамадан вона жила далі в часи Сасанідів."
  es:
    - "Ecbatana, en persa antiguo Hagmatana, yace bajo la ciudad de Hamadán, en el oeste de Irán, al pie del monte Alvand, el antiguo Orontes, en el camino principal de Mesopotamia a la meseta iraní. Era la ciudad principal de los medos. Heródoto dice que Deyoces, su primer rey, la construyó con siete murallas una dentro de otra, con las almenas de cada una de un color distinto y las dos más interiores chapadas de plata y oro. Como la ciudad moderna cubre el sitio, se ha hallado poco que sea con certeza medo; las excavaciones en el montículo de Tepe Hegmataneh han sacado a la luz sobre todo un barrio que suele fecharse en la época parta, aunque también se ha tomado por medo."
    - "Hacia el 550 a. C. el ejército del rey medo Astiages se amotinó y lo entregó a Ciro, que tomó Ecbatana y se llevó su plata y su oro a Anshan, como registra la Crónica de Nabónido. Bajo los persas fue residencia real, donde, según Jenofonte, el rey pasaba el verano. Cuando el medo Fraortes se rebeló, Darío I lo hizo ejecutar en Ecbatana, como relata su inscripción de Behistún. Darío y su hijo Jerjes hicieron grabar inscripciones en la roca de Ganj Nameh, cerca de allí."
    - "El libro de Esdras cuenta cómo se puso en duda bajo Darío el derecho de los judíos a reconstruir el templo de Jerusalén. Se hizo una búsqueda en los archivos de Babilonia, y en Acmeta, el nombre arameo de Ecbatana, «en Achmetta, en el palacio que está en la provincia de Media», se halló un libro con el decreto del primer año de Ciro para que se reedificara la casa de Dios. Darío lo confirmó, y el templo fue concluido."
    - "Alejandro Magno llegó a Ecbatana en el 330 a. C. y mandó guardar en su ciudadela el tesoro traído de Pérsida; su amigo Hefestión murió allí en el 324 a. C. Polibio describe su palacio, con vigas de cedro y de ciprés chapadas de plata y oro, y dice que Antíoco III todavía halló plata en tejas y oro suficientes para acuñar casi 4000 talentos. Bajo los partos fue residencia de verano de los reyes, como registra Estrabón, y como Hamadán siguió viviendo durante la época sasánida."
  pt:
    - "Ecbatana, em persa antigo Hagmatana, jaz sob a cidade de Hamadan, no oeste do Irã, ao pé do monte Alvand, o antigo Orontes, na principal estrada da Mesopotâmia para o planalto iraniano. Era a principal cidade dos medos. Heródoto diz que Dejoces, seu primeiro rei, a construiu com sete muros, um dentro do outro, com ameias cada uma de uma cor diferente e as duas mais internas revestidas de prata e ouro. Como a cidade moderna cobre o local, pouco de certamente medo foi achado; as escavações no monte de Tepe Hegmataneh expuseram sobretudo um bairro geralmente datado da época parta, embora também tenha sido tomado por medo."
    - "Por volta de 550 a.C., o exército do rei medo Astíages se amotinou e o entregou a Ciro, que tomou Ecbatana e levou sua prata e ouro a Anshan, como registra a Crônica de Nabonido. Sob os persas foi residência real, onde, diz Xenofonte, o rei passava o verão. Quando o medo Fraortes se rebelou, Dario I o mandou matar em Ecbatana, como relata sua inscrição de Bisutun. Dario e seu filho Xerxes gravaram inscrições na rocha em Ganj Nameh, ali perto."
    - "O livro de Esdras conta como o direito dos judeus de reconstruir o templo em Jerusalém foi questionado sob Dario. Fez-se uma busca nos arquivos da Babilônia, e em Acmeta, o nome aramaico de Ecbatana, “no palácio que fica na província da Média”, achou-se um rolo com o decreto do primeiro ano de Ciro para que a casa de Deus fosse reconstruída. Dario o confirmou, e o templo foi concluído."
    - "Alexandre, o Grande, chegou a Ecbatana em 330 a.C. e mandou guardar em sua cidadela o tesouro trazido da Pérsis; seu amigo Heféstion morreu ali em 324 a.C. Políbio descreve seu palácio, com vigas de cedro e cipreste revestidas de prata e ouro, e diz que Antíoco III ainda achou prata e ouro em telhas suficientes para cunhar quase 4.000 talentos. Sob os partas foi residência de verão dos reis, como registra Estrabão, e, como Hamadan, sobreviveu pelos tempos sassânidas."
  de:
    - "Ekbatana, altpersisch Hagmatana, liegt unter der Stadt Hamadan im Westen Irans, am Fuß des Berges Alwand, des antiken Orontes, an der Hauptstraße von Mesopotamien zum iranischen Hochland. Es war die Hauptstadt der Meder. Herodot sagt, Deiokes, ihr erster König, habe sie mit sieben ineinanderliegenden Mauern erbaut, deren Zinnen jeweils eine andere Farbe hatten und von denen die beiden innersten mit Silber und Gold überzogen waren. Weil die moderne Stadt den Ort bedeckt, ist wenig sicher Medisches gefunden worden; Ausgrabungen auf dem Hügel Tepe Hegmataneh haben vor allem ein Viertel freigelegt, das gewöhnlich in die Partherzeit datiert wird, obwohl es auch für medisch gehalten wurde."
    - "Um 550 v. Chr. meuterte das Heer des medischen Königs Astyages und lieferte ihn Kyrus aus, der Ekbatana einnahm und sein Silber und Gold nach Anschan brachte, wie die Nabonid-Chronik berichtet. Unter den Persern war es Residenz, in der, wie Xenophon sagt, der König den Sommer verbrachte. Als sich der Meder Phraortes empörte, ließ Darius I. ihn in Ekbatana hinrichten, wie seine Behistun-Inschrift erzählt. Darius und sein Sohn Xerxes ließen in der Nähe bei Ganj Nameh Inschriften in den Fels hauen."
    - "Das Buch Esra erzählt, wie das Recht der Juden, den Tempel in Jerusalem wieder aufzubauen, unter Darius in Frage gestellt wurde. Man suchte in den Archiven von Babylon, und in Achmeta, dem aramäischen Namen von Ekbatana, fand man „im Schloß, das in Medien liegt“, eine Schriftrolle mit dem Erlass aus dem ersten Jahr des Kyrus, dass das Haus Gottes wieder gebaut werden solle. Darius bestätigte ihn, und der Tempel wurde vollendet."
    - "Alexander der Große erreichte Ekbatana 330 v. Chr. und ließ den aus Persis herbeigeschafften Schatz in seiner Burg lagern; sein Freund Hephaistion starb dort 324 v. Chr. Polybios beschreibt seinen Palast mit Balken aus Zeder und Zypresse, die mit Silber und Gold überzogen waren, und sagt, Antiochos III. habe noch genug silberne Ziegel und Gold gefunden, um fast 4000 Talente zu münzen. Unter den Parthern war es, wie Strabon berichtet, Sommerresidenz der Könige, und als Hamadan lebte es durch die Sasanidenzeit fort."
  fr:
    - "Ecbatane, en vieux perse Hagmatana, se trouve sous la ville de Hamadan, dans l’ouest de l’Iran, au pied du mont Alvand, l’ancien Oronte, sur la grande route de la Mésopotamie au plateau iranien. C’était la principale ville des Mèdes. Hérodote dit que Déjocès, leur premier roi, la bâtit avec sept murailles concentriques, aux créneaux chacun d’une couleur différente, les deux plus intérieurs plaqués d’argent et d’or. Comme la ville moderne couvre le site, on y a peu trouvé de certainement mède ; les fouilles du tertre de Tepe Hegmataneh ont surtout dégagé un quartier que l’on date d’ordinaire de l’époque parthe, bien qu’on l’ait aussi tenu pour mède."
    - "Vers 550 av. J.-C., l’armée du roi mède Astyage se mutina et le livra à Cyrus, qui prit Ecbatane et emporta son argent et son or à Anshan, comme le consigne la Chronique de Nabonide. Sous les Perses, c’était une résidence royale où, dit Xénophon, le roi passait l’été. Quand le Mède Phraorte se révolta, Darius Ier le fit exécuter à Ecbatane, comme le relate son inscription de Behistun. Darius et son fils Xerxès firent graver des inscriptions dans le roc à Ganj Nameh, tout près."
    - "Le livre d’Esdras raconte comment le droit des Juifs à rebâtir le temple de Jérusalem fut contesté sous Darius. On fit des recherches dans les archives de Babylone, et à Achmetha, nom araméen d’Ecbatane, « capitale de la province de Médie », on trouva un rouleau portant le décret de la première année de Cyrus ordonnant de rebâtir la maison de Dieu. Darius le confirma, et le temple fut achevé."
    - "Alexandre le Grand atteignit Ecbatane en 330 av. J.-C. et y fit déposer dans la citadelle le trésor rapporté de Perside ; son ami Héphestion y mourut en 324 av. J.-C. Polybe décrit son palais, aux poutres de cèdre et de cyprès plaquées d’argent et d’or, et dit qu’Antiochus III y trouva encore assez de tuiles d’argent et d’or pour frapper près de 4 000 talents. Sous les Parthes, c’était une résidence d’été des rois, comme le rapporte Strabon, et sous le nom de Hamadan elle survécut à l’époque sassanide."
  it:
    - "Ecbatana, in antico persiano Hagmatana, giace sotto la città di Hamadan nell’Iran occidentale, ai piedi del Monte Alvand, l’antico Oronte, sulla strada principale dalla Mesopotamia all’altopiano iranico. Era la città principale dei Medi. Erodoto dice che Deioce, il loro primo re, la costruì con sette cinte una dentro l’altra, con i merli ciascuno di un colore diverso e i due più interni rivestiti d’argento e d’oro. Poiché la città moderna ricopre il sito, poco di sicuramente medo è stato trovato; gli scavi sul tell di Tepe Hegmataneh hanno messo in luce soprattutto un quartiere di solito datato all’epoca partica, benché sia stato ritenuto anche medo."
    - "Intorno al 550 a.C. l’esercito del re medo Astiage si ammutinò e lo consegnò a Ciro, che prese Ecbatana e ne portò l’argento e l’oro ad Anshan, come registra la Cronaca di Nabonedo. Sotto i Persiani fu una residenza reale, dove, dice Senofonte, il re trascorreva l’estate. Quando il medo Fraorte si ribellò, Dario I lo fece mettere a morte a Ecbatana, come racconta la sua iscrizione di Bisitun. Dario e suo figlio Serse fecero incidere iscrizioni nella roccia a Ganj Nameh, nelle vicinanze."
    - "Il libro di Esdra racconta come il diritto dei Giudei di ricostruire il tempio a Gerusalemme fu messo in dubbio sotto Dario. Si fecero ricerche negli archivi di Babilonia, e «nel castello d’Ahmetha, ch’è nella provincia di Media» (Ahmetha è il nome aramaico di Ecbatana) si trovò un rotolo con il decreto del primo anno di Ciro che la casa di Dio fosse riedificata. Dario lo confermò, e il tempio fu finito."
    - "Alessandro Magno raggiunse Ecbatana nel 330 a.C. e fece custodire nella sua cittadella il tesoro portato dalla Perside; il suo amico Efestione vi morì nel 324 a.C. Polibio descrive il suo palazzo, con travi di cedro e di cipresso rivestite d’argento e d’oro, e dice che Antioco III vi trovò ancora argento in tegole e oro a sufficienza per coniare quasi 4000 talenti. Sotto i Parti fu una residenza estiva dei re, come registra Strabone, e come Hamadan sopravvisse in epoca sasanide."
  pl:
    - "Ekbatana, staroperskie Hagmatana, leży pod miastem Hamadan w zachodnim Iranie, u stóp góry Alwand, dawnego Orontesa, przy głównej drodze z Mezopotamii na płaskowyż irański. Było głównym miastem Medów. Herodot mówi, że Dejokes, ich pierwszy król, zbudował je z siedmioma murami jeden w drugim, których blanki miały każdy inny kolor, a dwa najbardziej wewnętrzne były pokryte srebrem i złotem. Ponieważ współczesne miasto zajmuje stanowisko, znaleziono niewiele z pewnością medyjskiego; wykopaliska na kopcu Tepe Hegmataneh odsłoniły głównie dzielnicę zwykle datowaną na epokę partyjską, choć uważano ją też za medyjską."
    - "Około 550 r. p.n.e. wojsko medyjskiego króla Astiagesa zbuntowało się i wydało go Cyrusowi, który zdobył Ekbatanę i zabrał jej srebro i złoto do Anszanu, jak zapisuje Kronika Nabonida. Pod Persami była rezydencją królewską, gdzie, według Ksenofonta, król spędzał lato. Gdy Med Fraortes się zbuntował, Dariusz I kazał go stracić w Ekbatanie, jak opowiada jego inskrypcja z Behistun. Dariusz i jego syn Kserkses wykuli inskrypcje w skale w pobliskim Gandż Name."
    - "Księga Ezdrasza opowiada, jak za Dariusza zakwestionowano prawo Żydów do odbudowy świątyni w Jerozolimie. Przeszukano archiwa Babilonu, a w Achmecie, aramejskiej nazwie Ekbatany, „na zamku, który jest w ziemi Medskiej”, znaleziono zwój z dekretem z pierwszego roku Cyrusa o odbudowie domu Bożego. Dariusz go potwierdził i świątynię ukończono."
    - "Aleksander Wielki dotarł do Ekbatany w 330 r. p.n.e. i kazał złożyć w jej cytadeli skarb przywieziony z Persydy; jego przyjaciel Hefajstion zmarł tam w 324 r. p.n.e. Polibiusz opisuje jej pałac, z belkami z cedru i cyprysu pokrytymi srebrem i złotem, i mówi, że Antioch III znalazł jeszcze dość srebrnych dachówek i złota, by wybić prawie 4000 talentów. Pod Partami była letnią rezydencją królów, jak zapisuje Strabon, a jako Hamadan przetrwała przez czasy sasanidzkie."
  nl:
    - "Ekbatana, Oudperzisch Hagmatana, ligt onder de stad Hamadan in West-Iran, aan de voet van de Alvand, de antieke Orontes, aan de hoofdweg van Mesopotamië naar het Iraanse plateau. Het was de hoofdstad van de Meden. Herodotus zegt dat Deiokes, hun eerste koning, haar bouwde met zeven muren binnen elkaar, hun kantelen elk in een andere kleur en de twee binnenste met zilver en goud bekleed. Omdat de moderne stad de plaats bedekt, is weinig zekers van Medische aard gevonden; opgravingen op de heuvel Tepe Hegmataneh hebben vooral een kwartier blootgelegd dat gewoonlijk in de Parthische tijd wordt gedateerd, al is het ook voor Medisch gehouden."
    - "Omstreeks 550 v.Chr. muitte het leger van de Medische koning Astyages en leverde hem uit aan Cyrus, die Ekbatana innam en zijn zilver en goud naar Anshan voerde, zoals de Kroniek van Nabonidus vermeldt. Onder de Perzen was het een koninklijke residentie, waar volgens Xenophon de koning de zomer doorbracht. Toen de Meder Fraortes in opstand kwam, liet Darius I hem te Ekbatana ter dood brengen, zoals zijn Bisitun-inscriptie vertelt. Darius en zijn zoon Xerxes lieten bij Ganj Nameh inscripties in de rots houwen."
    - "Het boek Ezra vertelt hoe het recht van de Joden om de tempel in Jeruzalem te herbouwen onder Darius werd betwist. Men zocht in de archieven van Babylon, en te Achmetha, de Aramese naam van Ekbatana, “in de burcht, die in het landschap Medië is”, werd een rol gevonden met het besluit van Cyrus' eerste jaar dat het huis Gods herbouwd moest worden. Darius bevestigde het, en de tempel werd voltooid."
    - "Alexander de Grote bereikte Ekbatana in 330 v.Chr. en liet de schat uit Persis in de burcht opslaan; zijn vriend Hefaistion stierf er in 324 v.Chr. Polybius beschrijft het paleis, met balken van ceder en cipres bekleed met zilver en goud, en zegt dat Antiochus III er nog genoeg zilveren tegels en goud vond om bijna 4000 talenten te munten. Onder de Parthen was het een zomerverblijf van de koningen, zoals Strabo vermeldt, en als Hamadan leefde het voort in de Sassanidische tijd."
  cs:
    - "Ekbatana, staropersky Hagmatana, leží pod městem Hamadán v západním Íránu, na úpatí hory Alvand, antického Orontu, na hlavní cestě z Mezopotámie na íránskou plošinu. Byla hlavním městem Médů. Hérodotos praví, že Deiokés, jejich první král, je vystavěl se sedmi hradbami uvnitř sebe, jejichž cimbuří mělo každé jinou barvu a dvě nejvnitřnější byly pokryty stříbrem a zlatem. Protože moderní město pokrývá místo, bylo nalezeno málo jistě médského; vykopávky na pahorku Tepe Hegmataneh odkryly hlavně čtvrť, která se obvykle datuje do doby parthské, ač byla pokládána i za médskou."
    - "Kolem roku 550 př. n. l. se vojsko médského krále Astyaga vzbouřilo a vydalo jej Kýrovi, který dobyl Ekbatany a odvezl jejich stříbro a zlato do Anšanu, jak zaznamenává Nabonidova kronika. Za Peršanů byly královským sídlem, kde, jak praví Xenofón, trávil král léto. Když se Méd Fravartiš vzbouřil, nechal jej Dareios I. v Ekbatanech popravit, jak vypráví jeho nápis z Bisotúnu. Dareios a jeho syn Xerxes vytesali nápisy do skály v nedalekém Ganj Nameh."
    - "Kniha Ezdrášova vypráví, jak bylo za Dareia zpochybněno právo Židů obnovit chrám v Jeruzalémě. V archivech Babylóna bylo hledáno a v Achmetě, aramejském jménu Ekbatan, „na hradě, kterýž jest v Médské krajině“, byl nalezen svitek s výnosem Kýrova prvního roku, aby byl dům Boží obnoven. Dareios jej potvrdil a chrám byl dokončen."
    - "Alexandr Veliký dosáhl Ekbatan roku 330 př. n. l. a nechal poklad přivezený z Persis uložit v jejich citadele; jeho přítel Héfaistión tam roku 324 př. n. l. zemřel. Polybios popisuje jejich palác s trámy z cedru a cypřiše pokrytými stříbrem a zlatem a praví, že Antiochos III. tam stále našel dost stříbrných tašek a zlata, aby ražbou získal téměř 4000 talentů. Za Parthů byly letním sídlem králů, jak zaznamenává Strabón, a jako Hamadán žily dál i v sásánovské době."
  sv:
    - "Ekbatana, fornpersiska Hagmatana, ligger under staden Hamadan i västra Iran, vid foten av berget Alvand, antikens Orontes, vid huvudvägen från Mesopotamien till den iranska högplatån. Det var mediernas huvudstad. Herodotos säger att Deiokes, deras förste kung, byggde den med sju murar innanför varandra, vars bröstvärn var och en hade olika färg och de två innersta var klädda med silver och guld. Eftersom den moderna staden täcker platsen har litet med säkerhet medisk hittats; utgrävningar på kullen Tepe Hegmataneh har främst blottat ett kvarter som vanligen dateras till parthisk tid, även om det också har ansetts vara medisk."
    - "Omkring 550 f.Kr. gjorde den mediske kungen Astyages armé myteri och utlämnade honom till Kyros, som intog Ekbatana och förde dess silver och guld till Anshan, som Nabonidkrönikan berättar. Under perserna var den en kunglig residensstad, där, säger Xenofon, kungen tillbringade sommaren. När mederna Fraortes gjorde uppror lät Dareios I avrätta honom i Ekbatana, som hans Behistuninskrift berättar. Dareios och hans son Xerxes lät hugga inskrifter i berget vid Ganj Nameh i närheten."
    - "Esras bok berättar hur judarnas rätt att bygga upp templet i Jerusalem ifrågasattes under Dareios. Man sökte i arkiven i Babylon, och i Ekbatana, som på arameiska heter Ahmeta, ”i Ametas borg, i hövdingdömet Medien”, fann man en bokrulle med Kyros edikt från hans första år att Guds hus skulle byggas upp på nytt. Dareios bekräftade det, och templet fullbordades."
    - "Alexander den store nådde Ekbatana 330 f.Kr. och lät skatten från Persis förvaras i dess borg; hans vän Hefaistion dog där 324 f.Kr. Polybios beskriver dess palats, med bjälkar av cederträ och cypress klädda med silver och guld, och säger att Antiochos III fortfarande fann tillräckligt med silvertegel och guld för att prägla nästan 4 000 talenter. Under parthernas tid var den en sommarresidens för kungarna, som Strabon berättar, och som Hamadan levde den vidare genom sasanidernas tid."
  nb:
    - "Ekbatana, gammelpersisk Hagmatana, ligger under byen Hamadan i vestlige Iran, ved foten av Alvand, det gamle Orontes, ved hovedveien fra Mesopotamia til det iranske platået. Det var mediernes hovedby. Herodot sier at Deiokes, deres første konge, bygde den med sju murer inni hverandre, med brystvern i hver sin farge og de to innerste kledd med sølv og gull. Fordi den moderne byen dekker stedet, er lite sikkert medisk funnet; utgravninger på haugen Tepe Hegmataneh har hovedsakelig avdekket et kvarter som vanligvis dateres til parthisk tid, selv om det også er blitt regnet som medisk."
    - "Omkring 550 f.Kr. gjorde hæren til mederkongen Astyages mytteri og overleverte ham til Kyros, som tok Ekbatana og førte dets sølv og gull til Anshan, slik Nabonid-krøniken opplyser. Under perserne var den kongelig residens, der kongen, sier Xenofon, tilbrakte sommeren. Da mederen Fraortes gjorde opprør, lot Dareios I ham henrette i Ekbatana, slik hans Bisitun-innskrift forteller. Dareios og hans sønn Xerxes hogg innskrifter i fjellet ved Ganj Nameh i nærheten."
    - "Esras bok forteller hvordan jødenes rett til å bygge opp tempelet i Jerusalem ble trukket i tvil under Dareios. Det ble foretatt en leting i arkivene i Babylon, og i Ahmeta, Ekbatanas arameiske navn, «i borgen Ahmeta, som ligger i landskapet Media», ble en rull funnet med Kyros' påbud fra hans første år om at Guds hus skulle bygges opp igjen. Dareios bekreftet det, og tempelet ble ferdig."
    - "Aleksander den store nådde Ekbatana i 330 f.Kr. og lot skatten fra Persis lagre i dens borg; hans venn Hefaistion døde der i 324 f.Kr. Polybios beskriver dets palass, med bjelker av sedertre og cypress kledd med sølv og gull, og sier at Antiokos III fremdeles fant nok sølvtegl og gull til å prege nesten 4000 talenter. Under parthernes herredømme var den en sommerresidens for kongene, som Strabon opplyser, og som Hamadan levde den videre gjennom sasanidetiden."
  tl:
    - "Ang Ecbatana, Hagmatana sa Lumang Persiano, ay nasa ilalim ng lungsod ng Hamadan sa kanlurang Iran, sa paanan ng Bundok Alvand, ang sinaunang Orontes, sa pangunahing daan mula Mesopotamia patungo sa talampas ng Iran. Ito ang pangunahing lungsod ng mga Medo. Sinasabi ni Herodoto na itinayo ito ni Deioces, ang una nilang hari, na may pitong pader na isa sa loob ng isa, na ang mga almenas ng bawat isa ay magkakaiba ng kulay at ang dalawang pinakaloob ay binalutan ng pilak at ginto. Dahil sakop ng makabagong lungsod ang pook, kaunti ang natagpuang tiyak na Medo; ang mga paghuhukay sa tel ng Tepe Hegmataneh ay higit na naglantad ng isang purok na karaniwang ipinepetsa sa panahong Parto, bagaman itinuring din itong Medo."
    - "Noong mga 550 BK, nag-alsa ang hukbo ng haring Medo na si Astyages at ibinigay siya kay Ciro, na kumuha sa Ecbatana at nagdala ng pilak at ginto nito sa Anshan, gaya ng itinatala ng Kronika ni Nabonido. Sa ilalim ng mga Persiano, ito ay tirahang maharlika, kung saan, sabi ni Xenofon, ginugugol ng hari ang tag-init. Nang maghimagsik ang Medong si Phraortes, ipinapatay siya ni Dario I sa Ecbatana, gaya ng isinasalaysay ng kaniyang inskripsiyon sa Bisitun. Nag-ukit sina Dario at ang anak niyang si Xerxes ng mga inskripsiyon sa bato sa Ganj Nameh sa malapit."
    - "Isinasalaysay ng Aklat ni Ezra kung paanong kinuwestiyon sa ilalim ni Dario ang karapatan ng mga Judio na muling itayo ang templo sa Jerusalem. Naghanap sa mga arkibo ng Babilonia, at sa Achmetta, ang pangalang Aramaiko ng Ecbatana, “sa bahay-hari na nasa lalawigan ng Media”, natagpuan ang isang ikid na may utos ni Ciro noong unang taon niya na muling itayo ang bahay ng Dios. Pinagtibay ito ni Dario, at natapos ang templo."
    - "Narating ni Alejandro na Dakila ang Ecbatana noong 330 BK at ipinaimbak sa kuta nito ang kayamanang dinala mula sa Persida; namatay doon ang kaibigan niyang si Hephaestion noong 324 BK. Inilalarawan ni Polybius ang palasyo nito, na may mga biga ng sedro at sipres na binalutan ng pilak at ginto, at sinasabing nakakita pa si Antiochus III ng sapat na tisang pilak at ginto upang magbarya ng halos 4,000 talento. Sa ilalim ng mga Parto, ito ay tirahang tag-init ng mga hari, gaya ng itinatala ni Strabo, at bilang Hamadan ay nanatili ito hanggang panahong Sasanian."
  da:
    - "Ekbatana, oldpersisk Hagmatana, ligger under byen Hamadan i det vestlige Iran, ved foden af Alvand-bjerget, antikkens Orontes, på hovedvejen fra Mesopotamien til det iranske plateau. Det var mediernes hovedby. Herodot siger, at Deiokes, deres første konge, byggede den med syv mure inden i hinanden, hvis kamme hver havde en forskellig farve og de to inderste var belagt med sølv og guld. Fordi den moderne by dækker stedet, er der kun fundet lidt med sikkerhed medisk; udgravninger på højen Tepe Hegmataneh har hovedsagelig blottet et kvarter, der sædvanligvis dateres til partisk tid, selv om det også er blevet anset for medisk."
    - "Omkring 550 f.Kr. gjorde hæren hos den mediske konge Astyages mytteri og overgav ham til Kyros, som indtog Ekbatana og førte dets sølv og guld til Anshan, som Nabonid-krøniken beretter. Under perserne var den kongelig residens, hvor kongen, siger Xenofon, tilbragte sommeren. Da mederen Fraortes gjorde oprør, lod Darius 1. ham henrette i Ekbatana, som hans Bisitun-indskrift fortæller. Darius og hans søn Xerxes huggede indskrifter i klippen ved Ganj Nameh i nærheden."
    - "Ezras Bog fortæller, hvordan jødernes ret til at genopbygge templet i Jerusalem blev draget i tvivl under Darius. Der blev søgt i arkiverne i Babylon, og i Akmetha, det aramæiske navn for Ekbatana, »paa Slottet, i Landskabet Medien«, blev der fundet en rulle med Kyros' dekret fra hans første år om, at Guds hus skulle genopbygges. Darius stadfæstede det, og templet blev færdigt."
    - "Alexander den Store nåede Ekbatana i 330 f.Kr. og lod skatten fra Persis opbevare i dens citadel; hans ven Hefaistion døde dér i 324 f.Kr. Polybios beskriver dens palads, med bjælker af cedertræ og cypres belagt med sølv og guld, og siger, at Antiochos 3. stadig fandt nok sølvtegl og guld til at præge næsten 4.000 talenter. Under partherne var den kongernes sommerresidens, som Strabon beretter, og som Hamadan levede den videre gennem sassanidisk tid."
  sr:
    - "Екбатана, староперсијски Хагматана, лежи испод града Хамадана у западном Ирану, у подножју планине Алванд, древног Оронта, на главном путу од Месопотамије до иранске висоравни. Била је главни град Мидјана. Херодот каже да ју је Дејок, њихов први краљ, саградио са седам зидова један унутар другог, чији су бедеми сваки био друге боје, а два најунутрашњија обложена сребром и златом. Пошто савремени град покрива налазиште, мало шта сигурно мидијско је нађено; ископавања на хумци Тепе Хегматане открила су углавном четврт која се обично датира у партско доба, мада је сматрана и мидијском."
    - "Око 550. п. н. е. војска мидијског краља Астијага побунила се и предала га Киру, који је заузео Екбатану и однео њено сребро и злато у Аншан, како бележи Набонидова хроника. Под Персијанцима била је краљевска резиденција, где, каже Ксенофонт, краљ проводи лето. Када се Мидјанин Фраорт побунио, Дарије I дао га је погубити у Екбатани, како приповеда његов бехистунски натпис. Дарије и његов син Ксеркс урезали су натписе у стену у оближњем Ганџ Намеу."
    - "Књига Јездрина приповеда како је оспорено право Јевреја да обнове храм у Јерусалиму под Даријем. Претраживане су архиве Вавилона, и у Ахмети, арамејском имену Екбатане, „у двору царском у земљи мидској“, нађена је књига с Кировим указом из прве године да се дом Божји обнови. Дарије га је потврдио, и храм је довршен."
    - "Александар Велики стигао је у Екбатану 330. п. н. е. и дао је благо донето из Персиде похранити у њену цитаделу; његов пријатељ Хефестион ту је умро 324. п. н. е. Полибије описује њену палату, с гредама од кедра и кипариса обложеним сребром и златом, и каже да је Антиох III још нашао довољно сребрних плочица и злата да искује готово 4.000 таланата. Под Партима била је летња резиденција краљева, како бележи Страбон, а као Хамадан живела је и кроз сасанидско доба."
