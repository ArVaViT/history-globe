# Overview article (ADR 0007). Mainstream facts only; Herodotus' account of the founding is given as his.
id: ecbatana
place: a212ef7
title:
  en: "Ecbatana"
  ru: "Екбатана"
body:
  en:
    - "Ecbatana, Old Persian Hagmatana, lies under the city of Hamadan in western Iran, at the foot of Mount Alvand, the ancient Orontes, on the main road from Mesopotamia to the Iranian plateau. It was the chief city of the Medes. Herodotus says that Deioces, their first king, built it with seven walls one within another, their battlements each of a different colour and the two innermost plated with silver and gold. Because the modern city covers the site, little certainly Median has been found; excavations on the mound of Tepe Hegmataneh have chiefly exposed a quarter that is usually dated to the Parthian age, though it has also been taken for Median."
    - "About 550 BC the army of the Median king Astyages mutinied and handed him over to Cyrus, who took Ecbatana and carried its silver and gold to Anshan, as the Nabonidus Chronicle records. Under the Persians it was a royal residence, where, Xenophon says, the king spent the summer. When the Mede Phraortes rebelled, Darius I had him put to death at Ecbatana, as his Bisitun inscription relates. Darius and his son Xerxes cut inscriptions in the rock at Ganj Nameh nearby."
    - 'The Book of Ezra tells how the Jews'' right to rebuild the temple in Jerusalem was questioned under Darius. A search was made in the archives of Babylon, and at Achmetha, the Aramaic name of Ecbatana, "in the palace that is in the province of the Medes", a roll was found with the decree of Cyrus'' first year that the house of God be rebuilt. Darius confirmed it, and the temple was finished.'
    - "Alexander the Great reached Ecbatana in 330 BC and had the treasure brought from Persis stored in its citadel; his friend Hephaestion died there in 324 BC. Polybius describes its palace, with beams of cedar and cypress plated with silver and gold, and says that Antiochus III still found enough silver tiles and gold to coin nearly 4,000 talents. Under the Parthians it was a summer residence of the kings, as Strabo records, and as Hamadan it lived on through Sasanian times."
  ru:
    - "Екбатана, по-древнеперсидски Хагматана, лежит под городом Хамаданом на западе Ирана, у подножия горы Альванд, древнего Оронта, на главной дороге из Месопотамии на Иранское нагорье. Это был главный город мидян. Геродот рассказывает, что Деиок, их первый царь, построил его с семью стенами одна внутри другой; зубцы каждой были своего цвета, а у двух внутренних — покрыты серебром и золотом. Древний город скрыт под современным, поэтому несомненно мидийского здесь найдено мало; раскопки на холме Тепе-Хегматане открыли главным образом квартал, который обычно относят к парфянскому времени, хотя его относили и к мидийскому."
    - "Около 550 г. до н. э. войско мидийского царя Астиага восстало и выдало его Киру, который взял Екбатану и увёз её серебро и золото в Аншан, как сообщает Хроника Набонида. При персах Екбатана была царской резиденцией, где, по словам Ксенофонта, цари проводили лето. Когда восстал мидянин Фравартиш, Дарий I казнил его в Екбатане, о чём говорит Бехистунская надпись. Дарий и его сын Ксеркс высекли надписи на скале Гяндж-Наме поблизости."
    - "Книга Ездры рассказывает, что при Дарии право иудеев восстанавливать храм в Иерусалиме было оспорено. Искали в вавилонском книгохранилище, и в Екбатане (по-арамейски Ахмета), «во дворце, который в области Мидии», нашли свиток с указом Кира, данным в первый год его царствования, о том, чтобы дом Божий был отстроен. Дарий подтвердил указ, и храм был достроен."
    - "Александр Македонский пришёл в Екбатану в 330 г. до н. э. и велел сложить в её цитадели сокровища, привезённые из Персиды; его друг Гефестион умер здесь в 324 г. до н. э. Полибий описывает её дворец с балками из кедра и кипариса, обитыми серебром и золотом, и пишет, что Антиох III нашёл здесь ещё столько серебряной черепицы и золота, что начеканил монет почти на 4000 талантов. При парфянах Екбатана была летней резиденцией царей, как сообщает Страбон, а под именем Хамадан она жила и при Сасанидах."
