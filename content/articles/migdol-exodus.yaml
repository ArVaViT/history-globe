# Overview article (ADR 0007). Mainstream facts only; the route of the exodus and the site are disputed, and the candidates are given without choosing one.
id: migdol-exodus
place: a411283
title:
  en: "Migdol (of the Exodus)"
  ru: "Мигдол (на пути Исхода)"
  uk: "Мігдол (виходу)"
  es: "Migdol (del Éxodo)"
  pt: "Migdol (do Êxodo)"
  de: "Migdol (des Exodus)"
  fr: "Migdol (de l’Exode)"
body:
  en:
    - "This Migdol is the landmark beside which Israel camped before crossing the sea. After Etham the LORD told Moses: “Speak unto the children of Israel, that they turn and encamp before Pi-hahiroth, between Migdol and the sea, over against Baal-zephon”; the list of stations repeats that they “turned again unto Pi-hahiroth, which is before Baal-zephon: and they pitched before Migdol”. The word is Semitic for “tower” or “fortress”, and Egyptian texts of the New Kingdom use it for several forts on the eastern border of the Delta, so the name may have belonged to more than one place. The Migdol where Jews lived in Jeremiah’s day, and the Migdol at the northern end of Egypt in Ezekiel, are kept as separate places on the map."
    - "Where it stood depends on the route of the exodus, which is itself disputed. The map marks first Tell el-Herr in northern Sinai, a fortress of the Persian and later periods on the old coast road; then a wide area around Tell el-Maskhuta in the Wadi Tumilat, for a southern route; a fort of the seventh and sixth centuries BC south of Pelusium (site T-21, Tell Qedua), which Eliezer Oren identified with the Migdol of Jeremiah; and Jebel Abu Hasa. None can be fixed as the Migdol of the Exodus; the area lies today in Egypt, between the Suez Canal and northern Sinai."
  ru:
    - "Этот Мигдол — ориентир, у которого Израиль стоял станом перед переходом через море. После Ефама Господь сказал Моисею: «скажи сынам Израилевым, чтобы они обратились и расположились станом пред Пи-Гахирофом, между Мигдолом и между морем, пред Ваал-Цефоном»; перечень станов повторяет, что они «обратились к Пи-Гахирофу, что пред Ваал-Цефоном, и расположились станом пред Мигдолом». Слово семитское и значит «башня» или «крепость», а египетские тексты Нового царства называют так несколько крепостей на восточной границе Дельты, так что имя могло принадлежать не одному месту. Мигдол, где во дни Иеремии жили Иудеи, и Мигдол на северном краю Египта у Иезекииля на карте показаны отдельными местами."
    - "Где он стоял, зависит от пути Исхода, который сам спорен. Карта первым делом отмечает Телль-эль-Херр на севере Синая — крепость персидского и более поздних времён на старой прибрежной дороге; затем широкую область вокруг Телль-эль-Масхуты в Вади-Тумилат — для южного пути; крепость VII–VI веков до н. э. к югу от Пелусия (урочище T-21, Телль-Кедуа), которую Элиэзер Орен отождествил с Мигдолом Иеремии; и Джебель-Абу-Хасу. Ни одно из этих мест нельзя признать Мигдолом Исхода; вся эта местность сегодня в Египте, между Суэцким каналом и северным Синаем."
  uk:
    - "Цей Мігдол — орієнтир, поряд з яким Ізраїль отаборився перед переходом моря. Після Етаму Господь сказав Мойсеєві: «Промов до синів Ізрайлевих, щоб одвернули й отаборились перед Пі-Гахиротом, між Микдолом і морем; перед Бааль-Цефоном отаборитесь навпроти його, при морі»; перелік стоянок повторює, що вони «повернули на Пі-Гахирот, що проти Бааль-Зефона, та й отаборились перед Микдолем». Слово семітське й означає «вежа» або «фортеця», і єгипетські тексти Нового царства вживають його для кількох фортів на східному кордоні Дельти, тож назва могла належати не одному місцю. Мігдол, де жили євреї за днів Єремії, і Мігдол на північному краю Єгипту в Єзекіїля на мапі тримаються як окремі місця."
    - "Де він стояв, залежить від маршруту виходу, який сам є спірним. Мапа першим позначає Телль-ель-Герр на півночі Синаю, фортецю перської та пізніших епох на давній прибережній дорозі; потім широку місцевість навколо Телль-ель-Машхути у Ваді-Тумілат, для південного маршруту; форт VII–VI ст. до н. е. на південь від Пелусія (місце T-21, Телль-Кедва), який Еліезер Орен ототожнив із Мігдолом Єремії; і Джебель-Абу-Хасу. Жодне не можна визначити як Мігдол виходу; ця місцевість лежить сьогодні в Єгипті, між Суецьким каналом і північним Синаєм."
  es:
    - "Este Migdol es el punto de referencia junto al cual acampó Israel antes de cruzar el mar. Después de Etam, Jehová dijo a Moisés: «Habla á los hijos de Israel que den la vuelta, y asienten su campo delante de Pihahiroth, entre Migdol y la mar hacia Baalzephón»; la lista de estaciones repite que «volvieron sobre Pi-hahiroth, que está delante de Baalsephon, y asentaron delante de Migdol». La palabra es semítica y significa «torre» o «fortaleza», y los textos egipcios del Reino Nuevo la usan para varios fuertes de la frontera oriental del Delta, de modo que el nombre pudo pertenecer a más de un lugar. El Migdol donde vivían judíos en tiempos de Jeremías y el Migdol del extremo septentrional de Egipto en Ezequiel se mantienen como lugares distintos en el mapa."
    - "Dónde estaba depende de la ruta del éxodo, que a su vez se discute. El mapa marca en primer lugar Tell el-Herr, en el norte del Sinaí, una fortaleza de época persa y posterior en el antiguo camino de la costa; luego una amplia zona en torno a Tell el-Maskhuta, en el Wadi Tumilat, para una ruta meridional; un fuerte de los siglos VII y VI a. C. al sur de Pelusio (sitio T-21, Tell Qedua), que Eliezer Orén identificó con el Migdol de Jeremías; y el Yebel Abu Hasa. Ninguno puede fijarse como el Migdol del Éxodo; la zona se halla hoy en Egipto, entre el canal de Suez y el norte del Sinaí."
  pt:
    - "Este Migdol é o marco junto ao qual Israel acampou antes de atravessar o mar. Depois de Etã, o SENHOR disse a Moisés: “Diga aos filhos de Israel que voltem e acampem diante de Pi-Hairote, entre Migdol e o mar, diante de Baal-Zefom”; a lista de etapas repete que “voltaram para Pi-Hairote, que fica em frente a Baal-Zefom, e acamparam diante de Migdol”. A palavra é semítica para “torre” ou “fortaleza”, e textos egípcios do Novo Reino a usam para vários fortes na fronteira oriental do Delta, de modo que o nome pode ter pertencido a mais de um lugar. O Migdol onde viviam judeus no tempo de Jeremias, e o Migdol no extremo norte do Egito em Ezequiel, são mantidos no mapa como lugares separados."
    - "Onde ficava depende da rota do êxodo, que é ela própria disputada. O mapa marca em primeiro lugar Tell el-Herr, no norte do Sinai, uma fortaleza do período persa e posteriores na antiga estrada costeira; depois uma ampla área em torno de Tell el-Maskhuta, no Wadi Tumilat, para uma rota meridional; um forte dos séculos VII e VI a.C. ao sul de Pelúsio (sítio T-21, Tell Qedua), que Eliezer Oren identificou com o Migdol de Jeremias; e Jebel Abu Hasa. Nenhum pode ser fixado como o Migdol do Êxodo; a área fica hoje no Egito, entre o canal de Suez e o norte do Sinai."
  de:
    - "Dieses Migdol ist der Orientierungspunkt, bei dem Israel lagerte, bevor es das Meer durchquerte. Nach Etam sagte der HERR zu Mose: „Rede mit den Kindern Israel und sprich, daß sie sich herumlenken und sich lagern bei Pihachiroth, zwischen Migdol und dem Meer, gegen Baal-Zephon“; die Stationenliste wiederholt: „Von Etham zogen sie aus und blieben in Pihachiroth, welches liegt gegen Baal-Zephon, und lagerten sich gegen Migdol“. Das Wort ist semitisch für „Turm“ oder „Festung“, und ägyptische Texte des Neuen Reiches verwenden es für mehrere Festungen an der Ostgrenze des Deltas, sodass der Name mehr als einem Ort gehört haben kann. Das Migdol, wo zu Jeremias Zeit Juden lebten, und das Migdol am Nordende Ägyptens bei Hesekiel werden auf der Karte als getrennte Orte geführt."
    - "Wo es stand, hängt von der Route des Exodus ab, die selbst umstritten ist. Die Karte zeigt zuerst Tell el-Herr im nördlichen Sinai, eine Festung der persischen und späteren Zeit an der alten Küstenstraße; dann ein weites Gebiet um Tell el-Maskhuta im Wadi Tumilat, für eine südliche Route; eine Festung des 7. und 6. Jahrhunderts v. Chr. südlich von Pelusium (Fundstelle T-21, Tell Qedua), die Eliezer Oren mit dem Migdol Jeremias gleichsetzte; und Jebel Abu Hasa. Keines lässt sich als das Migdol des Exodus festlegen; das Gebiet liegt heute in Ägypten, zwischen dem Suezkanal und dem nördlichen Sinai."
  fr:
    - "Ce Migdol est le repère à côté duquel Israël campa avant de traverser la mer. Après Étham, l’Éternel dit à Moïse : « Parle aux enfants d’Israël ; qu’ils se détournent, et qu’ils campent devant Pi-Hahiroth, entre Migdol et la mer, vis-à-vis de Baal-Tsephon » ; la liste des étapes répète qu’ils « se détournèrent vers Pi-Hahiroth, vis-à-vis de Baal-Tsephon, et campèrent devant Migdol ». Le mot est sémitique pour « tour » ou « forteresse », et des textes égyptiens du Nouvel Empire l’emploient pour plusieurs forts de la frontière orientale du Delta, de sorte que le nom a pu appartenir à plus d’un lieu. Le Migdol où vivaient des Juifs du temps de Jérémie, et le Migdol à l’extrémité nord de l’Égypte chez Ézéchiel, sont gardés comme des lieux distincts sur la carte."
    - "Où il se dressait dépend de l’itinéraire de l’exode, lui-même discuté. La carte marque d’abord Tell el-Herr, dans le nord du Sinaï, forteresse de l’époque perse et des suivantes sur l’ancienne route côtière ; puis une vaste zone autour de Tell el-Maskhuta dans l’ouadi Tumilat, pour un itinéraire méridional ; un fort des VIIe et VIe siècles av. J.-C. au sud de Péluse (site T-21, Tell Qedua), qu’Éliézer Oren a identifié avec le Migdol de Jérémie ; et le djebel Abou Hasa. Aucun ne peut être fixé comme le Migdol de l’Exode ; la zone se trouve aujourd’hui en Égypte, entre le canal de Suez et le nord du Sinaï."
scripture:
  - Exod.14.1-Exod.14.2
  - Num.33.7
sources:
  - "E. D. Oren, 'Migdol: A New Fortress on the Edge of the Eastern Nile Delta', Bulletin of the American Schools of Oriental Research 256 (1984)"
  - "J. K. Hoffmeier, Israel in Egypt: The Evidence for the Authenticity of the Exodus Tradition (1997)"
  - "G. I. Davies, The Way of the Wilderness: A Geographical Study of the Wilderness Itineraries in the Old Testament (1979)"
