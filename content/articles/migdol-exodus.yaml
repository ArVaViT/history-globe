# Overview article (ADR 0007). Mainstream facts only; the route of the exodus and the site are disputed, and the candidates are given without choosing one.
id: migdol-exodus
place: a411283
title:
  en: "Migdol (of the Exodus)"
  ru: "Мигдол (на пути Исхода)"
  uk: "Мігдол (виходу)"
  es: "Migdol (del Éxodo)"
  pt: "Migdol (do Êxodo)"
  de: "Migdol (des Exodus)"
  fr: "Migdol (de l’Exode)"
  it: "Migdol (dell’Esodo)"
  pl: "Migdol (z Wyjścia)"
  nl: "Migdol (van de uittocht)"
  cs: "Migdol (z exodu)"
  sv: "Migdol (vid uttåget)"
  nb: "Migdol (utvandringen)"
  tl: "Migdol (ng Exodo)"
  da: "Migdol (fra udvandringen)"
body:
  en:
    - "This Migdol is the landmark beside which Israel camped before crossing the sea. After Etham the LORD told Moses: “Speak unto the children of Israel, that they turn and encamp before Pi-hahiroth, between Migdol and the sea, over against Baal-zephon”; the list of stations repeats that they “turned again unto Pi-hahiroth, which is before Baal-zephon: and they pitched before Migdol”. The word is Semitic for “tower” or “fortress”, and Egyptian texts of the New Kingdom use it for several forts on the eastern border of the Delta, so the name may have belonged to more than one place. The Migdol where Jews lived in Jeremiah’s day, and the Migdol at the northern end of Egypt in Ezekiel, are kept as separate places on the map."
    - "Where it stood depends on the route of the exodus, which is itself disputed. The map marks first Tell el-Herr in northern Sinai, a fortress of the Persian and later periods on the old coast road; then a wide area around Tell el-Maskhuta in the Wadi Tumilat, for a southern route; site T-211, about 4 km south-east of Tell el-Borg in north-west Sinai, which James Hoffmeier proposes as the New Kingdom fort of Migdol; and Jebel Abu Hasa. None can be fixed as the Migdol of the Exodus; the candidates lie today in Egypt, on both sides of the Suez Canal."
  ru:
    - "Этот Мигдол — ориентир, у которого Израиль стоял станом перед переходом через море. После Ефама Господь сказал Моисею: «скажи сынам Израилевым, чтобы они обратились и расположились станом пред Пи-Гахирофом, между Мигдолом и между морем, пред Ваал-Цефоном»; перечень станов повторяет, что они «обратились к Пи-Гахирофу, что пред Ваал-Цефоном, и расположились станом пред Мигдолом». Слово семитское и значит «башня» или «крепость», а египетские тексты Нового царства называют так несколько крепостей на восточной границе Дельты, так что имя могло принадлежать не одному месту. Мигдол, где во дни Иеремии жили Иудеи, и Мигдол на северном краю Египта у Иезекииля на карте показаны отдельными местами."
    - "Где он стоял, зависит от пути Исхода, который сам спорен. Карта первым делом отмечает Телль-эль-Херр на севере Синая — крепость персидского и более поздних времён на старой прибрежной дороге; затем широкую область вокруг Телль-эль-Масхуты в Вади-Тумилат — для южного пути; урочище T-211 примерно в 4 км к юго-востоку от Телль-эль-Борга на северо-западе Синая, которое Джеймс Хоффмайер предлагает считать крепостью Мигдол эпохи Нового царства; и Джебель-Абу-Хасу. Ни одно из этих мест нельзя признать Мигдолом Исхода; все эти места сегодня в Египте, по обе стороны Суэцкого канала."
  uk:
    - "Цей Мігдол — орієнтир, поряд з яким Ізраїль отаборився перед переходом моря. Після Етаму Господь сказав Мойсеєві: «Промов до синів Ізрайлевих, щоб одвернули й отаборились перед Пі-Гахиротом, між Микдолом і морем; перед Бааль-Цефоном отаборитесь навпроти його, при морі»; перелік стоянок повторює, що вони «повернули на Пі-Гахирот, що проти Бааль-Зефона, та й отаборились перед Микдолем». Слово семітське й означає «вежа» або «фортеця», і єгипетські тексти Нового царства вживають його для кількох фортів на східному кордоні Дельти, тож назва могла належати не одному місцю. Мігдол, де жили євреї за днів Єремії, і Мігдол на північному краю Єгипту в Єзекіїля на мапі тримаються як окремі місця."
    - "Де він стояв, залежить від маршруту виходу, який сам є спірним. Мапа першим позначає Телль-ель-Герр на півночі Синаю, фортецю перської та пізніших епох на давній прибережній дорозі; потім широку місцевість навколо Телль-ель-Машхути у Ваді-Тумілат, для південного маршруту; місце T-211 приблизно за 4 км на південний схід від Телль-ель-Борга на північному заході Синаю, яке Джеймс Гофмаєр пропонує вважати фортом Мігдол доби Нового царства; і Джебель-Абу-Хасу. Жодне не можна визначити як Мігдол виходу; усі ці місця лежать сьогодні в Єгипті, по обидва боки Суецького каналу."
  es:
    - "Este Migdol es el punto de referencia junto al cual acampó Israel antes de cruzar el mar. Después de Etam, Jehová dijo a Moisés: «Habla á los hijos de Israel que den la vuelta, y asienten su campo delante de Pihahiroth, entre Migdol y la mar hacia Baalzephón»; la lista de estaciones repite que «volvieron sobre Pi-hahiroth, que está delante de Baalsephon, y asentaron delante de Migdol». La palabra es semítica y significa «torre» o «fortaleza», y los textos egipcios del Reino Nuevo la usan para varios fuertes de la frontera oriental del Delta, de modo que el nombre pudo pertenecer a más de un lugar. El Migdol donde vivían judíos en tiempos de Jeremías y el Migdol del extremo septentrional de Egipto en Ezequiel se mantienen como lugares distintos en el mapa."
    - "Dónde estaba depende de la ruta del éxodo, que a su vez se discute. El mapa marca en primer lugar Tell el-Herr, en el norte del Sinaí, una fortaleza de época persa y posterior en el antiguo camino de la costa; luego una amplia zona en torno a Tell el-Maskhuta, en el Wadi Tumilat, para una ruta meridional; el sitio T-211, a unos 4 km al sudeste de Tell el-Borg, en el noroeste del Sinaí, que James Hoffmeier propone como el fuerte de Migdol del Imperio Nuevo; y el Yebel Abu Hasa. Ninguno puede fijarse como el Migdol del Éxodo; los candidatos se hallan hoy en Egipto, a ambos lados del canal de Suez."
  pt:
    - "Este Migdol é o marco junto ao qual Israel acampou antes de atravessar o mar. Depois de Etã, o SENHOR disse a Moisés: “Diga aos filhos de Israel que voltem e acampem diante de Pi-Hairote, entre Migdol e o mar, diante de Baal-Zefom”; a lista de etapas repete que “voltaram para Pi-Hairote, que fica em frente a Baal-Zefom, e acamparam diante de Migdol”. A palavra é semítica para “torre” ou “fortaleza”, e textos egípcios do Novo Reino a usam para vários fortes na fronteira oriental do Delta, de modo que o nome pode ter pertencido a mais de um lugar. O Migdol onde viviam judeus no tempo de Jeremias, e o Migdol no extremo norte do Egito em Ezequiel, são mantidos no mapa como lugares separados."
    - "Onde ficava depende da rota do êxodo, que é ela própria disputada. O mapa marca em primeiro lugar Tell el-Herr, no norte do Sinai, uma fortaleza do período persa e posteriores na antiga estrada costeira; depois uma ampla área em torno de Tell el-Maskhuta, no Wadi Tumilat, para uma rota meridional; o sítio T-211, a cerca de 4 km a sudeste de Tell el-Borg, no noroeste do Sinai, que James Hoffmeier propõe como o forte de Migdol do Império Novo; e Jebel Abu Hasa. Nenhum pode ser fixado como o Migdol do Êxodo; os candidatos ficam hoje no Egito, dos dois lados do canal de Suez."
  de:
    - "Dieses Migdol ist der Orientierungspunkt, bei dem Israel lagerte, bevor es das Meer durchquerte. Nach Etam sagte der HERR zu Mose: „Rede mit den Kindern Israel und sprich, daß sie sich herumlenken und sich lagern bei Pihachiroth, zwischen Migdol und dem Meer, gegen Baal-Zephon“; die Stationenliste wiederholt: „Von Etham zogen sie aus und blieben in Pihachiroth, welches liegt gegen Baal-Zephon, und lagerten sich gegen Migdol“. Das Wort ist semitisch für „Turm“ oder „Festung“, und ägyptische Texte des Neuen Reiches verwenden es für mehrere Festungen an der Ostgrenze des Deltas, sodass der Name mehr als einem Ort gehört haben kann. Das Migdol, wo zu Jeremias Zeit Juden lebten, und das Migdol am Nordende Ägyptens bei Hesekiel werden auf der Karte als getrennte Orte geführt."
    - "Wo es stand, hängt von der Route des Exodus ab, die selbst umstritten ist. Die Karte zeigt zuerst Tell el-Herr im nördlichen Sinai, eine Festung der persischen und späteren Zeit an der alten Küstenstraße; dann ein weites Gebiet um Tell el-Maskhuta im Wadi Tumilat, für eine südliche Route; die Fundstelle T-211, etwa 4 km südöstlich von Tell el-Borg im Nordwesten des Sinai, die James Hoffmeier als die Festung Migdol des Neuen Reiches vorschlägt; und Jebel Abu Hasa. Keines lässt sich als das Migdol des Exodus festlegen; die Kandidaten liegen heute in Ägypten, beiderseits des Suezkanals."
  fr:
    - "Ce Migdol est le repère à côté duquel Israël campa avant de traverser la mer. Après Étham, l’Éternel dit à Moïse : « Parle aux enfants d’Israël ; qu’ils se détournent, et qu’ils campent devant Pi-Hahiroth, entre Migdol et la mer, vis-à-vis de Baal-Tsephon » ; la liste des étapes répète qu’ils « se détournèrent vers Pi-Hahiroth, vis-à-vis de Baal-Tsephon, et campèrent devant Migdol ». Le mot est sémitique pour « tour » ou « forteresse », et des textes égyptiens du Nouvel Empire l’emploient pour plusieurs forts de la frontière orientale du Delta, de sorte que le nom a pu appartenir à plus d’un lieu. Le Migdol où vivaient des Juifs du temps de Jérémie, et le Migdol à l’extrémité nord de l’Égypte chez Ézéchiel, sont gardés comme des lieux distincts sur la carte."
    - "Où il se dressait dépend de l’itinéraire de l’exode, lui-même discuté. La carte marque d’abord Tell el-Herr, dans le nord du Sinaï, forteresse de l’époque perse et des suivantes sur l’ancienne route côtière ; puis une vaste zone autour de Tell el-Maskhuta dans l’ouadi Tumilat, pour un itinéraire méridional ; le site T-211, à environ 4 km au sud-est de Tell el-Borg dans le nord-ouest du Sinaï, que James Hoffmeier propose comme le fort de Migdol du Nouvel Empire ; et le djebel Abou Hasa. Aucun ne peut être fixé comme le Migdol de l’Exode ; les candidats se trouvent aujourd’hui en Égypte, de part et d’autre du canal de Suez."
  it:
    - "Questo Migdol è il punto di riferimento accanto al quale Israele si accampò prima di attraversare il mare. Dopo Etam l’Eterno disse a Mosè: «Di’ ai figliuoli d’Israele che tornino indietro e s’accampino di rimpetto a Pi-Hahiroth, fra Migdol e il mare, di fronte a Baal-Tsefon»; l’elenco delle tappe ripete che «piegarono verso Pi-Hahiroth che è dirimpetto a Baal-Tsefon, e si accamparono davanti a Migdol». La parola è semitica per «torre» o «fortezza», e i testi egizi del Nuovo Regno la usano per diversi forti sul confine orientale del Delta, così il nome può essere appartenuto a più di un luogo. Il Migdol dove vivevano ebrei ai giorni di Geremia e il Migdol all’estremità settentrionale dell’Egitto in Ezechiele sono tenuti come luoghi distinti sulla mappa."
    - "Dove sorgesse dipende dal percorso dell’esodo, che è a sua volta discusso. La mappa segna per primo Tell el-Herr nel Sinai settentrionale, una fortezza del periodo persiano e dei successivi sull’antica strada costiera; poi un’ampia area intorno a Tell el-Maskhuta nel Wadi Tumilat, per un percorso meridionale; il sito T-211, circa 4 km a sud-est di Tell el-Borg nel Sinai nord-occidentale, che James Hoffmeier propone come il forte di Migdol del Nuovo Regno; e il Jebel Abu Hasa. Nessuno può essere fissato come il Migdol dell’Esodo; i candidati si trovano oggi in Egitto, su entrambe le sponde del Canale di Suez."
  pl:
    - "Ten Migdol jest punktem orientacyjnym, obok którego Izrael obozował przed przejściem przez morze. Po Etam Pan rzekł do Mojżesza: „Mów do synów Izraelskich, niech się wrócą i położą obozem przed Fihahirot między Migdoł, i między morzem, przeciw Baalsefon”; lista stacji powtarza, że „nawrócili się do Fihahyrot, które jest przeciw Baalsefon, i położyli się obozem przed Migdolem”. Słowo to semickie znaczy „wieża” albo „twierdza”, a teksty egipskie Nowego Państwa używają go dla kilku fortów na wschodniej granicy Delty, więc nazwa mogła należeć do więcej niż jednego miejsca. Migdol, gdzie Żydzi mieszkali za dni Jeremiasza, i Migdol na północnym krańcu Egiptu u Ezechiela są na mapie osobnymi miejscami."
    - "Gdzie stał, zależy od trasy Wyjścia, która sama jest sporna. Mapa zaznacza najpierw Tell el-Herr w północnym Synaju, twierdzę z okresu perskiego i późniejszych na starej drodze wybrzeżem; potem szeroki obszar wokół Tell el-Maskhuta w Wadi Tumilat, dla trasy południowej; stanowisko T-211, około 4 km na południowy wschód od Tell el-Borg w północno-zachodnim Synaju, które James Hoffmeier proponuje jako fort Migdol z czasów Nowego Państwa; oraz Dżabal Abu Hasa. Żadnego nie da się ustalić jako Migdolu Wyjścia; wszystkie te miejsca leżą dziś w Egipcie, po obu stronach Kanału Sueskiego."
  nl:
    - "Deze Migdol is het oriëntatiepunt waarbij Israël zich legerde voordat het de zee overstak. Na Etam zei de HEER tot Mozes: “Spreek tot de kinderen Israëls, dat zij wederkeren, en zich legeren voor Pi-Hachiroth, tussen Migdol en tussen de zee, voor Baal-Zefon”; de lijst van pleisterplaatsen herhaalt dat zij “keerden weder naar Pi-hachiroth, dat tegenover Baal-Sefon is, en zij legerden zich voor Migdol”. Het woord is Semitisch voor “toren” of “vesting”, en Egyptische teksten uit het Nieuwe Rijk gebruiken het voor verscheidene forten aan de oostgrens van de Delta, zodat de naam bij meer dan één plaats kan hebben gehoord. De Migdol waar joden woonden in Jeremia's tijd, en de Migdol aan de noordgrens van Egypte bij Ezechiël, worden op de kaart als aparte plaatsen gehouden."
    - "Waar het stond, hangt af van de route van de uittocht, die zelf omstreden is. De kaart toont eerst Tell el-Herr in het noorden van de Sinaï, een vesting uit de Perzische en latere tijd aan de oude kustweg; dan een groot gebied rond Tell el-Maskhuta in de Wadi Tumilat, voor een zuidelijke route; vindplaats T-211, ongeveer 4 km ten zuidoosten van Tell el-Borg in het noordwesten van de Sinaï, die James Hoffmeier voorstelt als het fort Migdol uit het Nieuwe Rijk; en de Jebel Abu Hasa. Niets daarvan kan als de Migdol van de uittocht worden vastgesteld; de kandidaten liggen tegenwoordig in Egypte, aan weerszijden van het Suezkanaal."
  cs:
    - "Tento Migdol je orientační bod, vedle něhož se Izrael utábořil před přechodem moře. Po Etamu Hospodin řekl Mojžíšovi: „Mluv k synům Izraelským, ať navrátíce se, rozbijí stany před Fiarot, mezi Magdalem a mořem, proti Belsefon“; seznam stanic opakuje, že „navrátili se zase k Fiarot, jenž jest před Belsefon, a položili se před Magdalem“. Slovo je semitské pro „věž“ nebo „pevnost“ a egyptské texty Nové říše je užívají pro několik pevností na východní hranici delty, takže jméno mohlo patřit více místům. Migdol, kde žili Židé za Jeremjáše, a Migdol na severním konci Egypta u Ezechiela, jsou na mapě vedeny jako samostatná místa."
    - "Kde stál, závisí na trase exodu, která je sama sporná. Mapa uvádí nejprve Tell el-Herr v severním Sinaji, pevnost perské a pozdější doby na staré pobřežní cestě; pak široké území kolem Tell el-Maskhuta ve Wádí Tumílát, pro jižní trasu; lokalitu T-211 asi 4 km jihovýchodně od Tell el-Borg na severozápadě Sinaje, kterou James Hoffmeier navrhuje jako pevnost Migdol z doby Nové říše; a Jebel Abu Hasa. Žádný nelze určit jako Migdol z exodu; všechna tato místa leží dnes v Egyptě, po obou stranách Suezského průplavu."
  sv:
    - "Detta Migdol är det landmärke vid vilket Israel lägrade sig innan de gick över havet. Efter Etam sade HERREN till Mose: ”Säg till Israels barn att de skola vända om och lägra sig framför Pi-Hahirot, mellan Migdol och havet; mitt framför Baal-Sefon skolen I lägra eder vid havet”; förteckningen över stationer upprepar att de ”vände om till Pi-Hahirot, som ligger mitt emot Baal-Sefon, och lägrade sig framför Migdol”. Ordet är semitiskt för ”torn” eller ”fästning”, och egyptiska texter från Nya riket använder det om flera fort vid Deltats östra gräns, så namnet kan ha hört till mer än en plats. Migdol där judar bodde på Jeremias tid, och Migdol vid Egyptens norra ände hos Hesekiel, hålls som separata platser på kartan."
    - "Var det låg beror på uttågets färdväg, som själv är omstridd. Kartan markerar först Tell el-Herr i norra Sinai, en fästning från persisk och senare tid vid den gamla kustvägen; sedan ett vitt område kring Tell el-Maskhuta i Wadi Tumilat, för en sydlig färdväg; plats T-211, omkring 4 km sydost om Tell el-Borg i nordvästra Sinai, som James Hoffmeier föreslår som Nya rikets fort Migdol; och Jebel Abu Hasa. Ingen kan fastställas som uttågets Migdol; kandidaterna ligger i dag i Egypten, på båda sidor om Suezkanalen."
  nb:
    - "Denne Migdol er landemerket ved siden av hvilket Israel slo leir før overgangen over havet. Etter Etam sa Herren til Moses: «Si til Israels barn at de skal vende om og slå leir foran Pi-Hakirot, mellem Migdol og havet; midt imot Ba'al-Sefon»; listen over stasjoner gjentar at de «tok veien til Pi-Hakirot, som ligger midt imot Ba'al-Sefon, og de leiret sig foran Migdol». Ordet er semittisk for «tårn» eller «festning», og egyptiske tekster fra Det nye riket bruker det om flere festninger på Deltaets østgrense, så navnet kan ha tilhørt mer enn ett sted. Migdol der jøder bodde på Jeremias tid, og Migdol i Egypts nordende hos Esekiel, holdes som egne steder på kartet."
    - "Hvor den sto, avhenger av ruten for utvandringen, som selv er omstridt. Kartet markerer først Tell el-Herr i Nord-Sinai, en festning fra persertiden og senere på den gamle kystveien; deretter et bredt område omkring Tell el-Maskhuta i Wadi Tumilat, for en sørlig rute; sted T-211, omkring 4 km sørøst for Tell el-Borg i nordvestlige Sinai, som James Hoffmeier foreslår som Det nye rikets festning Migdol; og Jebel Abu Hasa. Ingen kan fastslås som Migdol fra utvandringen; kandidatene ligger i dag i Egypt, på begge sider av Suezkanalen."
  tl:
    - "Ang Migdol na ito ang palatandaan sa tabi nito nagkampo ang Israel bago tumawid sa dagat. Pagkatapos ng Etham, sinabi ng Panginoon kay Moises: “Salitain mo sa mga anak ni Israel, na sila'y bumalik at humantong sa tapat ng Pi-hahiroth, sa pagitan ng Migdol at ng dagat, sa tapat ng Baalzephon”; inuulit ng talaan ng mga himpilan na “lumiko sa Pi-hahiroth, na nasa tapat ng Baal-sephon: at humantong sa tapat ng Migdol”. Ang salita ay Semitiko para sa “tore” o “kuta”, at ginagamit ito ng mga tekstong Egipcio ng Bagong Kaharian para sa ilang kuta sa silangang hangganan ng Delta, kaya ang pangalan ay maaaring kabilang sa higit sa isang lugar. Ang Migdol kung saan nanirahan ang mga Judio sa panahon ni Jeremias, at ang Migdol sa hilagang dulo ng Egipto sa Ezekiel, ay pinananatiling hiwalay na mga lugar sa mapa."
    - "Nakasalalay ang kinatatayuan nito sa ruta ng exodo, na pinagtatalunan din. Unang minamarkahan ng mapa ang Tell el-Herr sa hilagang Sinai, isang kuta ng panahong Persiano at kalaunan sa lumang daang baybayin; pagkatapos ay isang malawak na lugar sa palibot ng Tell el-Maskhuta sa Wadi Tumilat, para sa timog na ruta; ang pook T-211, mga 4 km sa timog-silangan ng Tell el-Borg sa hilagang-kanlurang Sinai, na iminumungkahi ni James Hoffmeier bilang kuta ng Bagong Kaharian na Migdol; at ang Jebel Abu Hasa. Walang matitiyak na ito ang Migdol ng Exodo; ang mga kandidato ay nasa Egipto ngayon, sa magkabilang panig ng Kanal ng Suez."
  da:
    - "Denne Migdol er det pejlemærke, ved hvilket Israel lejrede sig, før de krydsede havet. Efter Etam sagde Herren til Moses: »Tal til Israels Børn, at de drage om og lejre sig for Pi-Hakiroth, imellem Migdol og Havet, tvært over for Baal-Zefon«; listen over stationer gentager, at de »vendte om til Pi-Hakiroth, som er lige for Baal-Zefon, og de lejrede sig lige foran Migdol«. Ordet er semitisk for »tårn« eller »fæstning«, og egyptiske tekster fra Det Nye Rige bruger det om flere forter på deltaets østgrænse, så navnet kan have tilhørt mere end ét sted. Migdol, hvor jøder boede i Jeremias' dage, og Migdol i Egyptens nordende hos Ezekiel holdes som særskilte steder på kortet."
    - "Hvor den stod, afhænger af udvandringens rute, som selv er omstridt. Kortet markerer først Tell el-Herr i det nordlige Sinai, en fæstning fra den persiske og senere tid på den gamle kystvej; dernæst et bredt område omkring Tell el-Maskhuta i Wadi Tumilat, for en sydlig rute; stedet T-211, omkring 4 km sydøst for Tell el-Borg i det nordvestlige Sinai, som James Hoffmeier foreslår som Det Nye Riges fort Migdol; og Jebel Abu Hasa. Ingen kan fastlægges som Udvandringens Migdol; kandidaterne ligger i dag i Egypten, på begge sider af Suezkanalen."
scripture:
