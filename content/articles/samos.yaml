body:
  en:
    - "Samos is a large island of the eastern Aegean, parted from the coast of Asia Minor under Mount Mycale by a narrow strait. Its Ionian city stood on the south-east shore, where the town of Pythagoreio is today. Herodotus called three works on Samos the greatest of all the Greeks: a tunnel seven stades long cut through a mountain by Eupalinus of Megara to bring water to the city, the great mole of the harbour, and the temple of Hera, the largest he knew, first built by Rhoecus. Under the tyrant Polycrates, about 540–522 BC, Samos had the strongest fleet in the Greek world, until the Persian satrap Oroetes lured him to the mainland and put him to death. Pythagoras was a Samian; later tradition says he left the island in Polycrates' time."
    - "Paul passed Samos at the end of his third journey. Hurrying to be in Jerusalem by Pentecost, he chose not to stop at Ephesus, and his ship worked down the coast from Mitylene day by day: “we arrived at Samos, and tarried at Trogyllium; and the next day we came to Miletus.” Some two centuries earlier Samos had been one of the states to which, according to 1 Maccabees, a Roman consul sent copies of a letter in favour of the Jews."
    - "Augustus spent two winters on Samos on his journey to the East and made the island a free city. Today Samos is a Greek island of the North Aegean region, less than two kilometres across the Mycale Strait from the Turkish shore. The ancient city at Pythagoreio and the sanctuary of Hera a few kilometres to the west were inscribed together on the UNESCO World Heritage List in 1992, and the tunnel of Eupalinus can still be entered."
  ru:
    - "Самос — большой остров восточной части Эгейского моря, отделённый узким проливом от побережья Малой Азии под горой Микале. Его ионийский город стоял на юго-восточном берегу, там, где сегодня городок Пифагорион. Геродот назвал три сооружения на Самосе величайшими у всех эллинов: прорытый сквозь гору тоннель длиной в семь стадий, которым Евпалин из Мегар подвёл воду к городу, большой мол гавани и храм Геры, самый большой из известных ему, первым строителем которого был Рек. При тиране Поликрате, ок. 540–522 гг. до н. э., у Самоса был сильнейший флот в греческом мире, пока персидский сатрап Орет не заманил Поликрата на материк и не казнил его. Самосцем был Пифагор; по позднейшему преданию, он покинул остров во времена Поликрата."
    - "Павел миновал Самос в конце третьего путешествия. Спеша, если можно, к Пятидесятнице быть в Иерусалиме, он решил не заходить в Ефес, и корабль день за днём шёл вдоль берега от Митилины: «а на другой пристали к Самосу и, побывав в Трогиллии, в следующий день прибыли в Милит». Двумя веками раньше Самос был среди тех государств, которым, по Первой книге Маккавейской, римский консул разослал списки письма в пользу иудеев."
    - "Август провёл на Самосе две зимы во время поездки на Восток и даровал острову свободу. Сегодня Самос — греческий остров в области Северные Эгейские острова, менее чем в двух километрах от турецкого берега через пролив Микале. Древний город у Пифагориона и святилище Геры в нескольких километрах к западу в 1992 г. вместе внесены в список Всемирного наследия ЮНЕСКО, а в тоннель Евпалина можно войти и сегодня."
  uk:
    - "Самос — великий острів східного Егейського моря, відділений від узбережжя Малої Азії під горою Мікале вузькою протокою. Його іонійське місто стояло на південно-східному березі, там, де нині місто Піфагоріо. Геродот називав три споруди на Самосі найбільшими з усіх грецьких: тунель завдовжки сім стадіїв, прорубаний крізь гору Евпалином із Мегар, щоб подати воду до міста, великий мол гавані та храм Гери, найбільший з відомих йому, збудований спершу Ройком. За тирана Полікрата, близько 540–522 рр. до н. е., Самос мав найсильніший флот у грецькому світі, доки перський сатрап Орет не виманив його на материк і не стратив. Піфагор був самосцем; пізніше передання каже, що він покинув острів за часів Полікрата."
    - "Павло минав Самос наприкінці третьої подорожі. Поспішаючи бути в Єрусалимі до П'ятидесятниці, він вирішив не зупинятися в Ефесі, і його корабель щодня просувався узбережжям від Мітилени: «поплили в Самос, та, побувши в Трогилиї, другого дня прийшли в Милет». Приблизно двома століттями раніше Самос був однією з держав, до яких, за 1 Маккавеїв, римський консул розіслав копії листа на користь юдеїв."
    - "Август двічі зимував на Самосі під час подорожі на Схід і зробив острів вільним містом. Нині Самос — грецький острів регіону Північного Егеїду, менш ніж за два кілометри через протоку Мікале від турецького берега. Давнє місто в Піфагоріо та святилище Гери за кілька кілометрів на захід були разом внесені до Списку всесвітньої спадщини ЮНЕСКО 1992 р., а тунель Евпаліна й досі можна відвідати."
  es:
    - "Samos es una gran isla del Egeo oriental, separada de la costa de Asia Menor, al pie del monte Mícale, por un estrecho angosto. Su ciudad jonia se alzaba en la costa sureste, donde hoy está la población de Pitagorio. Heródoto llamó a tres obras de Samos las mayores de todos los griegos: un túnel de siete estadios excavado a través de una montaña por Eupalino de Mégara para llevar agua a la ciudad, el gran malecón del puerto y el templo de Hera, el mayor que conocía, construido primero por Reco. Bajo el tirano Polícrates, hacia 540–522 a. C., Samos tuvo la flota más fuerte del mundo griego, hasta que el sátrapa persa Oretes lo atrajo al continente y lo mandó matar. Pitágoras era samio; según la tradición posterior, abandonó la isla en tiempos de Polícrates."
    - "Pablo pasó por Samos al final de su tercer viaje. Con prisa por estar en Jerusalén por Pentecostés, decidió no detenerse en Éfeso, y su nave fue bajando por la costa desde Mitilene día tras día: «tomamos puerto en Samo: y habiendo reposado en Trogilio, al día siguiente llegamos á Mileto». Unos dos siglos antes, Samos había sido uno de los estados a los que, según 1 Macabeos, un cónsul romano envió copias de una carta en favor de los judíos."
    - "Augusto pasó dos inviernos en Samos durante su viaje a Oriente y convirtió la isla en ciudad libre. Hoy Samos es una isla griega de la región del Egeo Septentrional, a menos de dos kilómetros, a través del estrecho de Mícale, de la costa turca. La ciudad antigua de Pitagorio y el santuario de Hera, unos kilómetros al oeste, fueron inscritos juntos en la lista del Patrimonio Mundial de la UNESCO en 1992, y aún puede entrarse en el túnel de Eupalino."
  pt:
    - "Samos é uma grande ilha do Egeu oriental, separada da costa da Ásia Menor, sob o monte Mícale, por um estreito pouco largo. Sua cidade jônica ficava na costa sudeste, onde hoje está a cidade de Pitagório. Heródoto chamava três obras de Samos as maiores de todos os gregos: um túnel de sete estádios aberto numa montanha por Eupalino de Megara para levar água à cidade, o grande molhe do porto e o templo de Hera, o maior que conhecia, construído primeiro por Reco. Sob o tirano Polícrates, por volta de 540–522 a.C., Samos teve a frota mais forte do mundo grego, até que o sátrapa persa Oroites o atraiu ao continente e o matou. Pitágoras era sâmio; a tradição posterior diz que deixou a ilha no tempo de Polícrates."
    - "Paulo passou por Samos no fim de sua terceira viagem. Com pressa de estar em Jerusalém para o Pentecostes, decidiu não parar em Éfeso, e seu navio foi descendo a costa a partir de Mitilene dia após dia: “No outro dia, tocamos em Samos e ficamos em Trogílio, e no dia seguinte chegamos a Mileto.” Cerca de dois séculos antes, Samos fora um dos estados aos quais, segundo 1 Macabeus, um cônsul romano enviou cópias de uma carta em favor dos judeus."
    - "Augusto passou dois invernos em Samos em sua viagem ao Oriente e fez da ilha uma cidade livre. Hoje Samos é uma ilha grega da região do Egeu Setentrional, a menos de dois quilômetros, através do estreito de Mícale, da costa turca. A cidade antiga em Pitagório e o santuário de Hera, a poucos quilômetros a oeste, foram inscritos juntos na Lista do Patrimônio Mundial da UNESCO em 1992, e o túnel de Eupalino ainda pode ser visitado por dentro."
  de:
    - "Samos ist eine große Insel der östlichen Ägäis, vom Festland Kleinasiens unter dem Mykale-Gebirge durch eine schmale Meerenge getrennt. Ihre ionische Stadt lag an der Südostküste, wo heute die Stadt Pythagorio liegt. Herodot nannte drei Werke auf Samos die größten aller Griechen: einen sieben Stadien langen Tunnel, den Eupalinos von Megara durch einen Berg schlug, um Wasser in die Stadt zu leiten, den großen Hafendamm und den Tempel der Hera, den größten, den er kannte, zuerst von Rhoikos erbaut. Unter dem Tyrannen Polykrates, etwa 540–522 v. Chr., hatte Samos die stärkste Flotte der griechischen Welt, bis der persische Satrap Oroites ihn aufs Festland lockte und hinrichten ließ. Pythagoras war ein Samier; die spätere Überlieferung sagt, er habe die Insel zu Polykrates' Zeit verlassen."
    - "Paulus kam am Ende seiner dritten Reise an Samos vorbei. Er eilte, um bis Pfingsten in Jerusalem zu sein, entschied sich, nicht in Ephesus haltzumachen, und sein Schiff arbeitete sich von Mitylene aus Tag für Tag die Küste hinab: „stießen wir an Samos und blieben in Trogyllion; und des nächsten Tages kamen wir gen Milet.“ Etwa zwei Jahrhunderte zuvor war Samos einer der Staaten gewesen, an die nach dem Ersten Makkabäerbuch ein römischer Konsul Abschriften eines Briefes zugunsten der Juden sandte."
    - "Augustus verbrachte auf seiner Reise in den Osten zwei Winter auf Samos und machte die Insel zur freien Stadt. Heute ist Samos eine griechische Insel der Region Nördliche Ägäis, weniger als zwei Kilometer über die Mykale-Straße vom türkischen Ufer entfernt. Die antike Stadt bei Pythagorio und das Heiligtum der Hera einige Kilometer westlich davon wurden 1992 gemeinsam in die UNESCO-Welterbeliste eingetragen, und der Tunnel des Eupalinos kann noch betreten werden."
  fr:
    - "Samos est une grande île de l’Égée orientale, séparée de la côte d’Asie Mineure, au pied du mont Mycale, par un détroit étroit. Sa cité ionienne s’élevait sur la rive sud-est, à l’emplacement de la ville actuelle de Pythagorion. Hérodote tenait pour les plus grands ouvrages de tous les Grecs trois réalisations de Samos : un tunnel de sept stades de long, percé à travers une montagne par Eupalinos de Mégare pour amener l’eau jusqu’à la ville, la grande jetée du port et le temple d’Héra, le plus grand qu’il connût, bâti d’abord par Rhoïkos. Sous le tyran Polycrate, vers 540–522 av. J.-C., Samos posséda la plus puissante flotte du monde grec, jusqu’au jour où le satrape perse Oroétès l’attira sur le continent et le fit mettre à mort. Pythagore était Samien ; selon la tradition postérieure, il quitta l’île du temps de Polycrate."
    - "Paul passa devant Samos à la fin de son troisième voyage. Pressé d’être à Jérusalem pour la Pentecôte, il avait résolu de ne pas s’arrêter à Éphèse, et son navire descendit la côte depuis Mytilène, jour après jour : ils abordèrent à Samos, firent halte à Trogylle et, le lendemain, arrivèrent à Milet. Deux siècles environ plus tôt, Samos avait été l’un des États auxquels, selon 1 Maccabées, un consul romain avait envoyé des copies d’une lettre favorable aux Juifs."
    - "Auguste passa deux hivers à Samos lors de son voyage en Orient et fit de l’île une cité libre. Aujourd’hui, Samos est une île grecque de la région de l’Égée-Septentrionale, à moins de deux kilomètres de la côte turque, de l’autre côté du détroit de Mycale. La cité antique de Pythagorion et le sanctuaire d’Héra, à quelques kilomètres à l’ouest, ont été inscrits ensemble sur la Liste du patrimoine mondial de l’UNESCO en 1992, et l’on peut encore entrer dans le tunnel d’Eupalinos."
  it:
    - "Samo è una grande isola dell’Egeo orientale, separata dalla costa dell’Asia Minore, sotto il monte Micale, da uno stretto braccio di mare. La sua città ionica sorgeva sulla costa sud-orientale, dove oggi si trova la città di Pythagoreio. Erodoto considerava tre opere di Samo le più grandi di tutti i Greci: un tunnel lungo sette stadi scavato attraverso una montagna da Eupalino di Megara per portare l’acqua alla città, il grande molo del porto e il tempio di Era, il più grande che conoscesse, costruito per la prima volta da Reco. Sotto il tiranno Policrate, circa 540–522 a.C., Samo ebbe la flotta più forte del mondo greco, finché il satrapo persiano Orete lo attirò sulla terraferma e lo mise a morte. Pitagora era samio; la tradizione più tarda dice che lasciò l’isola al tempo di Policrate."
    - "Paolo passò per Samo alla fine del terzo viaggio. Avendo fretta di essere a Gerusalemme per la Pentecoste, scelse di non fermarsi a Efeso, e la sua nave scese lungo la costa da Mitilene giorno per giorno: «il giorno seguente approdammo a Samo, e il giorno dipoi giungemmo a Mileto». Circa due secoli prima Samo era stata uno degli stati ai quali, secondo il Primo libro dei Maccabei, un console romano inviò copie di una lettera a favore dei Giudei."
    - "Augusto trascorse due inverni a Samo durante il suo viaggio in Oriente e fece dell’isola una città libera. Oggi Samo è un’isola greca della regione dell’Egeo settentrionale, a meno di due chilometri, attraverso lo stretto di Micale, dalla costa turca. L’antica città di Pythagoreio e il santuario di Era a pochi chilometri a ovest furono iscritti insieme nella lista del patrimonio mondiale dell’UNESCO nel 1992, e nel tunnel di Eupalino si può ancora entrare."
  nl:
    - "Samos is een groot eiland in de oostelijke Egeïsche Zee, door een smalle zeestraat gescheiden van de kust van Klein-Azië onder de berg Mykale. De Ionische stad lag aan de zuidoostkust, waar nu het stadje Pythagoreio ligt. Herodotus noemde drie werken op Samos de grootste van alle Grieken: een tunnel van zeven stadiën lang die Eupalinos van Megara door een berg liet graven om water naar de stad te brengen, de grote havendam, en de tempel van Hera, de grootste die hij kende, voor het eerst gebouwd door Rhoikos. Onder de tiran Polycrates, omstreeks 540–522 v.Chr., had Samos de sterkste vloot van de Griekse wereld, tot de Perzische satraap Oroetes hem naar het vasteland lokte en ter dood bracht. Pythagoras was een Samiër; volgens latere overlevering verliet hij het eiland in Polycrates' tijd."
    - "Paulus kwam Samos voorbij aan het einde van zijn derde reis. Haastig om met Pinksteren in Jeruzalem te zijn, besloot hij niet in Efeze te stoppen, en zijn schip werkte zich dag aan dag langs de kust van Mitylene naar beneden: “legden wij aan te Samos, en bleven te Trogyllion, en den dag daaraan kwamen wij te Milete.” Zo'n twee eeuwen eerder was Samos een van de staten aan wie volgens 1 Makkabeeën een Romeinse consul afschriften van een brief ten gunste van de Joden zond."
    - "Augustus bracht twee winters op Samos door op zijn reis naar het Oosten en maakte het eiland tot een vrije stad. Tegenwoordig is Samos een Grieks eiland in de regio Noord-Egeïsche Eilanden, op minder dan twee kilometer over de Straat van Mykale van de Turkse kust. De antieke stad bij Pythagoreio en het heiligdom van Hera enkele kilometers westelijker werden in 1992 samen op de werelderfgoedlijst van UNESCO geplaatst, en de tunnel van Eupalinos kan nog worden betreden."
  pl:
    - "Samos to duża wyspa wschodniego Morza Egejskiego, oddzielona od wybrzeża Azji Mniejszej pod górą Mykale wąską cieśniną. Jej miasto jońskie stało na południowo-wschodnim brzegu, gdzie dziś leży Pytagoreion. Herodot nazwał trzy dzieła na Samos największymi ze wszystkich greckich: tunel długi na siedem stadionów, wykuty w górze przez Eupalinosa z Megary, by doprowadzić wodę do miasta, wielki falochron portu oraz świątynię Hery, największą, jaką znał, zbudowaną po raz pierwszy przez Rojkosa. Za tyrana Polikratesa, około 540-522 p.n.e., Samos miało najsilniejszą flotę w świecie greckim, aż perski satrapa Oroites zwabił go na kontynent i kazał stracić. Pitagoras był Samijczykiem; późniejsza tradycja mówi, że opuścił wyspę za czasów Polikratesa."
    - "Paweł minął Samos pod koniec trzeciej podróży. Spieszył się, by być w Jerozolimie na Pięćdziesiątnicę, więc postanowił nie zatrzymywać się w Efezie, a jego okręt posuwał się wzdłuż wybrzeża od Mityleny dzień po dniu: „a trzeciego dnia przypłynęliśmy do Samu, a pomieszkawszy w Trogillu, nazajutrz przyszliśmy do Miletu”. Około dwóch wieków wcześniej Samos było jednym z państw, do których według Pierwszej Księgi Machabejskiej rzymski konsul wysłał odpisy listu w sprawie Żydów."
    - "August spędził na Samos dwie zimy w czasie podróży na Wschód i uczynił z wyspy wolne miasto. Dziś Samos jest grecką wyspą regionu Północnego Egejskiego, oddzieloną od tureckiego brzegu cieśniną Mykale szeroką na niespełna dwa kilometry. Starożytne miasto w Pytagoreionie i sanktuarium Hery kilka kilometrów na zachód wpisano wspólnie na listę światowego dziedzictwa UNESCO w 1992 roku, a do tunelu Eupalinosa można do dziś wejść."
  cs:
    - "Samos je velký ostrov ve východním Egeidu, oddělený od pobřeží Malé Asie pod horou Mykalé úzkým průlivem. Jeho iónské město leželo na jihovýchodním břehu, kde dnes stojí město Pythagoreio. Hérodotos nazval tři stavby na Samu největšími ze všech řeckých: tunel dlouhý sedm stadií, proražený horou Eupalinem z Megar, aby přivedl vodu do města, velký přístavní mol a Héřin chrám, největší, jaký znal, vystavěný poprvé Rhoikem. Za tyrana Polykrata, asi 540–522 př. n. l., měl Samos nejsilnější loďstvo řeckého světa, dokud ho perský satrapa Oroités nelstí nezlákal na pevninu a nenechal ho popravit. Pýthagorás byl Samský rodák; pozdější podání říká, že ostrov opustil za Polykratových časů."
    - "Pavel minul Samos na konci své třetí cesty. Spěchal, aby byl o letnicích v Jeruzalémě, a rozhodl se u Efezu nezastavit, a jeho loď se den za dnem probíjela podél pobřeží od Mitylén: „přistavili jsme bárku k Sámu, a pobyvše v Trogyllí, nazejtří přišli jsme do Milétu“. Asi o dvě století dříve byl Samos jedním ze států, jimž podle 1. knihy Makabejské poslal římský konzul opisy listu ve prospěch Židů."
    - "Augustus strávil na Samu dvě zimy na své cestě na Východ a učinil z ostrova svobodné město. Dnes je Samos řecký ostrov regionu Severní Egeis, vzdálený od tureckého břehu přes Mykalský průliv méně než dva kilometry. Starověké město u Pythagorea a svatyně Héry několik kilometrů západně byly společně zapsány na seznam světového dědictví UNESCO roku 1992 a Eupalinův tunel lze dosud projít."
  sv:
    - "Samos är en stor ö i östra Egeiska havet, skild från Mindre Asiens kust under berget Mykale av ett smalt sund. Dess joniska stad låg på sydöstra stranden, där staden Pythagoreio ligger i dag. Herodotos kallade tre verk på Samos de största av alla greker: en tunnel sju stadier lång huggen genom ett berg av Eupalinos från Megara för att leda vatten till staden, hamnens stora pir, och Heras tempel, det största han kände, först byggt av Rhoikos. Under tyrannen Polykrates, omkring 540–522 f.Kr., hade Samos den starkaste flottan i den grekiska världen, tills den persiske satrapen Oroites lockade honom till fastlandet och lät avrätta honom. Pythagoras var samier; senare tradition säger att han lämnade ön på Polykrates tid."
    - "Paulus passerade Samos i slutet av sin tredje resa. Skyndande för att vara i Jerusalem till pingst valde han att inte stanna i Efesos, och hans skepp arbetade sig ned längs kusten från Mytilene dag för dag: ”Dagen därefter lade vi till vid Samos; och sedan vi hade legat över i Trogyllium, kommo vi nästföljande dag till Miletus.” Ett par århundraden tidigare hade Samos varit en av de stater till vilka, enligt Första Mackabeerboken, en romersk konsul sände kopior av ett brev till judarnas förmån."
    - "Augustus tillbringade två vintrar på Samos på sin resa till Orienten och gjorde ön till en fri stad. I dag är Samos en grekisk ö i regionen Norra Egeiska havet, mindre än två kilometer över Mykalesundet från den turkiska stranden. Den antika staden vid Pythagoreio och Heras helgedom några kilometer västerut upptogs tillsammans på Unescos världsarvslista 1992, och Eupalinos tunnel kan ännu beträdas."
  nb:
    - "Samos er en stor øy i det østlige Egeerhavet, skilt fra kysten av Lilleasia under Mykale av et smalt stred. Den joniske byen lå på sørøstkysten, der byen Pythagoreio ligger i dag. Herodot kalte tre verk på Samos de største av alle grekernes: en tunnel sju stadier lang hogd gjennom et fjell av Eupalinos fra Megara for å føre vann til byen, den store moloen i havnen, og Hera-tempelet, det største han kjente, først bygd av Rhoikos. Under tyrannen Polykrates, omkring 540–522 f.Kr., hadde Samos den sterkeste flåten i den greske verden, til den persiske satrapen Oroites lokket ham til fastlandet og lot ham drepe. Pythagoras var fra Samos; senere tradisjon sier at han forlot øya på Polykrates' tid."
    - "Paulus passerte Samos ved slutten av sin tredje reise. I hast for å være i Jerusalem til pinse valgte han å ikke stoppe i Efesos, og skipet hans arbeidet seg ned kysten fra Mytilene dag for dag: «annen dag gikk vi innom Samos og lå over i Trogillium, og kom dagen efter til Milet». Omkring to århundrer tidligere hadde Samos vært en av statene som, ifølge 1. Makkabeerbok, fikk kopier av et brev fra en romersk konsul til fordel for jødene."
    - "Augustus tilbrakte to vintre på Samos på reisen sin til Østen og gjorde øya til en fri by. I dag er Samos en gresk øy i regionen Nord-Egeerhavet, mindre enn to kilometer over Mykale-stredet fra den tyrkiske kysten. Den antikke byen ved Pythagoreio og Hera-helligdommen noen kilometer mot vest ble innskrevet sammen på UNESCOs verdensarvliste i 1992, og Eupalinos' tunnel kan fortsatt gås inn i."
  tl:
    - "Ang Samos ay malaking pulo sa silangang Egeo, hiwalay sa baybayin ng Asia Minor sa ilalim ng Bundok Mycale ng makipot na kipot. Nakatayo ang lungsod nitong Ionio sa timog-silangang baybayin, kung saan nakatayo ngayon ang Pythagoreio. Tinawag ni Herodotus na pinakadakila sa lahat ng gawa ng mga Griyego ang tatlo sa Samos: tunel na pitong stadia ang haba na tinabas sa bundok ni Eupalino ng Megara upang magdala ng tubig sa lungsod, ang malaking mole ng daungan, at ang templo ni Hera, ang pinakamalaking kilala niya, na unang itinayo ni Rhoecus. Sa ilalim ng malupit na si Polycrates, mga 540–522 BK, ang Samos ang may pinakamalakas na hukbong-dagat sa daigdig ng mga Griyego, hanggang sa akitin siya ng satrapang Persiyano na si Oroetes sa mainland at patayin. Si Pitagoras ay taga-Samos; sabi ng kalaunang tradisyon, iniwan niya ang pulo noong panahon ni Polycrates."
    - "Dumaan si Pablo sa Samos sa katapusan ng kaniyang ikatlong paglalakbay. Nagmamadaling makarating sa Jerusalem bago ang Pentecostes, pinili niyang huwag huminto sa Efeso, at ang kaniyang barko ay dahan-dahang bumaba sa baybayin mula sa Mitilene araw-araw: “at nang kinabukasan ay nagsidaong kami sa Samo; at nang kinabukasan ay nagsirating kami sa Mileto”. Mga dalawang siglo bago iyon, ang Samos ay isa sa mga estadong pinadalhan, ayon sa 1 Macabeo, ng isang konsul na Romano ng mga kopya ng liham na pabor sa mga Judio."
    - "Gumugol si Augusto ng dalawang taglamig sa Samos sa kaniyang paglalakbay sa Silangan at ginawang malayang lungsod ang pulo. Ang Samos ngayon ay pulong Griyego ng rehiyon ng Hilagang Egeo, wala pang dalawang kilometro sa kabila ng Kipot ng Mycale mula sa baybaying Turko. Ang sinaunang lungsod sa Pythagoreio at ang santuwaryo ni Hera na ilang kilometro sa kanluran ay magkasamang isinama sa Talaan ng Pandaigdigang Pamana ng UNESCO noong 1992, at maaari pa ring pasukin ang tunel ni Eupalino."
