# Overview article (ADR 0007). Mainstream facts only; the Synodal Bible renders the name three ways (Иония, Греция, Еллада), and the article says so.
id: greece
place: a4492a0
title:
  en: "Greece"
  ru: "Еллада"
  uk: "Еллада"
  es: "Grecia"
  pt: "Grécia"
  de: "Griechenland"
  fr: "Grèce"
  pl: "Grecja"
  it: "Grecia"
