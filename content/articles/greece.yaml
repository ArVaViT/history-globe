  cs: "Řecko"
body:
  en:
    - "Greece is the mountainous peninsula and islands at the south of the Balkans, the home of the Hellenes, whose city-states, Athens, Sparta, Corinth and the rest, shaped philosophy, drama, history and the Greek language in which the New Testament was written. The Hebrew Bible calls the Greeks Javan, the Ionians of the Asian coast, whom it met first: Javan is a son of Japheth in the table of nations, and his sons are Elishah, Tarshish, Kittim and Dodanim, the islands and coasts of the west. Joel accuses Tyre and Sidon of having sold the children of Judah “unto the Grecians”, and Zechariah promises to raise up the sons of Zion “against thy sons, O Greece”."
    - "Daniel saw Greece as an empire. The he-goat that flew from the west and broke the ram of Persia “is the king of Grecia: and the great horn that is between his eyes is the first king”, Alexander, who crossed into Asia in 334 BC and died at Babylon in 323; the fourth king of Persia, “far richer than they all”, who would “stir up all against the realm of Grecia”, is usually taken to be Xerxes, whose invasion of 480 BC was turned back at Salamis and Plataea. Alexander's successors, the Ptolemies and Seleucids, ruled the Jews for nearly two centuries, and under them Greek became the language of the Jews of Egypt, who translated the Law into it; the Maccabean revolt of 167 BC was fought against the Hellenising of Jerusalem. Rome conquered Greece in 146 BC and set it under the governor of Macedonia; in 27 BC Augustus made the south the province of Achaia."
    - "Paul crossed into Europe in answer to a man of Macedonia who said, “Come over into Macedonia, and help us”, and founded churches at Philippi, Thessalonica and Berea; he preached in the Areopagus at Athens and spent eighteen months at Corinth. Luke uses the name Hellas, Greece, once only, when on the third journey Paul “came into Greece” and stayed three months; elsewhere the New Testament says Macedonia and Achaia. The Synodal Bible renders the name three ways: Ionia in Zechariah, Greece in Daniel, Hellas in Acts."
    - "Greece was Byzantine and Orthodox for a thousand years, Ottoman for four centuries, and won its independence in 1830. Today the Hellenic Republic, with its capital at Athens, has about ten million people, and Philippi, Thessalonica, Berea and Corinth, where Paul founded churches, are still the sees of Orthodox metropolitans."
  ru:
    - "Еллада, Греция, — гористый полуостров и острова на юге Балкан, родина эллинов, чьи города-государства, Афины, Спарта, Коринф и другие, создали философию, театр, историю и греческий язык, на котором написан Новый Завет. Еврейская Библия зовёт греков Иаваном, по ионийцам азиатского берега, с которыми встретилась раньше других: Иаван — сын Иафета в таблице народов, а его сыновья Елиса, Фарсис, Киттим и Доданим — острова и берега запада. Иоиль обвиняет Тир и Сидон в том, что они продавали сынов Иуды «сынам Еллинов», а Захария обещает воздвигнуть сынов Сиона «против сынов твоих, Иония»."
    - "Даниил видел Грецию как империю. Козёл, прилетевший с запада и сломивший овна Персии, «царь Греции, а большой рог, который между глазами его, это первый ее царь» — Александр, перешедший в Азию в 334 г. до н. э. и умерший в Вавилоне в 323 г.; четвёртый царь Персии, который «превзойдет всех великим богатством» и «поднимет всех против царства Греческого», — обычно Ксеркс, чьё вторжение 480 г. до н. э. было отбито при Саламине и Платеях. Преемники Александра, Птолемеи и Селевкиды, почти два века правили Иудеями, и при них греческий стал языком Иудеев Египта, переведших на него Закон; восстание Маккавеев 167 г. до н. э. было поднято против эллинизации Иерусалима. Рим покорил Грецию в 146 г. до н. э. и подчинил её наместнику Македонии; в 27 г. до н. э. Август сделал юг провинцией Ахаия."
    - "Павел переправился в Европу по зову Македонянина, сказавшего: «приди в Македонию и помоги нам», и основал церкви в Филиппах, Фессалонике и Верии; он проповедовал в ареопаге в Афинах и полтора года провёл в Коринфе. Имя Еллада Лука употребляет лишь однажды, когда в третьем путешествии Павел «пришел в Елладу» и провёл там три месяца; в остальных местах Новый Завет говорит о Македонии и Ахаии. Синодальный перевод передаёт имя тремя способами: Иония у Захарии, Греция у Даниила, Еллада в Деяниях."
    - "Тысячу лет Греция была византийской и православной, четыре века — османской, а в 1830 году обрела независимость. Сегодня в Греческой Республике со столицей в Афинах живёт около десяти миллионов человек, а Филиппы, Фессалоника, Верия и Коринф, где Павел основал церкви, и ныне — кафедры православных митрополитов."
  uk:
    - "Еллада — гористий півострів та острови на півдні Балкан, батьківщина еллінів, чиї міста-держави, Афіни, Спарта, Коринт та інші, сформували філософію, драму, історію та грецьку мову, якою написано Новий Заповіт. Давньоєврейська Біблія називає греків Яван, іонійцями азійського узбережжя, з якими вона зустрілася першими: Яван — син Яфета в переліку народів, а його сини — Еліса, Тарсис, Кіттім і Доданім, острови й узбережжя заходу. Йоїл звинувачує Тір і Сідон у тому, що вони продавали синів Юди «Грекам», а Захарія обіцяє підняти синів Сіону «проти твоїх синів, земле ти Йонська»."
    - "Даниїл бачив Елладу як імперію. Цап, що прилетів із заходу й зламав барана Персії, — це «царь Грециї, а здоровенний ріг, що між очима в нього, се перший потугою царь її» — Александр, який перейшов до Азії 334 р. до н. е. і помер у Вавилоні 323 року; четвертий цар Персії, який «перевисшить усїх великою заможністю» і «підбурить усїх проти царства Грецького», зазвичай розуміється як Ксеркс, чиє вторгнення 480 р. до н. е. було відбито при Саламіні й Платеях. Наступники Александра, Птолемеї й Селевкіди, панували над юдеями майже два століття, і за них грецька стала мовою юдеїв Єгипту, які переклали нею Закон; повстання Макавеїв 167 р. до н. е. велося проти елінізації Єрусалима. Рим підкорив Елладу 146 р. до н. е. і підпорядкував її намісникові Македонії; 27 р. до н. е. Август зробив південь провінцією Ахая."
    - "Павло перейшов до Європи на відповідь чоловікові-македонцеві, який казав: «Прийшовши в Македонию, поможи нам», і заснував церкви у Філіппах, Солуні і Верії; він проповідував на Ареопазі в Афінах і провів вісімнадцять місяців у Коринті. Лука вживає назву Еллада, Греція, лише раз, коли під час третьої подорожі Павло «прийшов у Грецію» і пробув три місяці; в інших місцях Новий Заповіт каже Македонія й Ахая. Синодальна Біблія передає цю назву трьома способами: Іонія в Захарії, Греція в Даниїлі, Еллада в Діях."
    - "Еллада була візантійською й православною тисячу років, османською чотири століття і здобула незалежність 1830 року. Сьогодні Грецька Республіка зі столицею в Афінах має близько десяти мільйонів людей, а Філіппи, Солунь, Верія й Коринт, де Павло заснував церкви, і досі є кафедрами православних митрополитів."
  es:
    - "Grecia es la península montañosa y las islas del sur de los Balcanes, patria de los helenos, cuyas ciudades-estado, Atenas, Esparta, Corinto y las demás, dieron forma a la filosofía, el drama, la historia y la lengua griega en que se escribió el Nuevo Testamento. La Biblia hebrea llama a los griegos Javán, los jonios de la costa asiática, a quienes conoció primero: Javán es hijo de Jafet en la tabla de las naciones, y sus hijos son Elisa, Tarsis, Quitim y Dodanim, las islas y costas del occidente. Joel acusa a Tiro y a Sidón de haber vendido a los hijos de Judá «á los hijos de los Griegos», y Zacarías promete levantar a los hijos de Sión «contra tus hijos, oh Grecia»."
    - "Daniel vio a Grecia como un imperio. El macho cabrío que voló desde el oeste y quebró al carnero de Persia «es el rey de Javán: y el cuerno grande que tenía entre sus ojos es el rey primero», Alejandro, que pasó a Asia en 334 a. C. y murió en Babilonia en 323; el cuarto rey de Persia, que «se hará de grandes riquezas más que todos» y «despertará á todos contra el reino de Javán», suele identificarse con Jerjes, cuya invasión del 480 a. C. fue rechazada en Salamina y Platea. Los sucesores de Alejandro, los Ptolomeos y los seléucidas, gobernaron a los judíos casi dos siglos, y bajo ellos el griego se hizo la lengua de los judíos de Egipto, que tradujeron a él la Ley; la revuelta macabea del 167 a. C. se libró contra la helenización de Jerusalén. Roma conquistó Grecia en el 146 a. C. y la puso bajo el gobernador de Macedonia; en el 27 a. C. Augusto hizo del sur la provincia de Acaya."
    - "Pablo pasó a Europa en respuesta a un varón macedonio que decía: «Pasa á Macedonia, y ayúdanos», y fundó iglesias en Filipos, Tesalónica y Berea; predicó en el Areópago de Atenas y pasó dieciocho meses en Corinto. Lucas usa el nombre Hélade, Grecia, una sola vez, cuando en el tercer viaje Pablo «vino á Grecia» y se quedó tres meses; en los demás lugares el Nuevo Testamento dice Macedonia y Acaya. La Biblia sinodal traduce el nombre de tres maneras: Jonia en Zacarías, Grecia en Daniel, Hélade en Hechos."
    - "Grecia fue bizantina y ortodoxa durante mil años, otomana durante cuatro siglos, y obtuvo su independencia en 1830. Hoy la República Helénica, con su capital en Atenas, tiene unos diez millones de habitantes, y Filipos, Tesalónica, Berea y Corinto, donde Pablo fundó iglesias, siguen siendo sedes de metropolitas ortodoxos."
  pt:
    - "A Grécia é a península montanhosa e as ilhas no sul dos Bálcãs, terra dos helenos, cujas cidades-estado, Atenas, Esparta, Corinto e as demais, moldaram a filosofia, o drama, a história e a língua grega em que o Novo Testamento foi escrito. A Bíblia hebraica chama os gregos de Javã, os jônios da costa asiática, que encontrou primeiro: Javã é filho de Jafé na tabela das nações, e seus filhos são Elisá, Társis, Quitim e Dodanim, as ilhas e costas do oeste. Joel acusa Tiro e Sidom de terem vendido os filhos de Judá “aos filhos dos gregos”, e Zacarias promete levantar os filhos de Sião “contra os seus filhos, Grécia”."
    - "Daniel viu a Grécia como um império. O bode que veio voando do oeste e quebrou o carneiro da Pérsia “é o rei da Grécia. O grande chifre que está entre os seus olhos é o primeiro rei”, Alexandre, que passou à Ásia em 334 a.C. e morreu na Babilônia em 323; o quarto rei da Pérsia, “muito mais rico do que todos eles”, que “instigará a todos contra o reino da Grécia”, é usualmente tomado por Xerxes, cuja invasão de 480 a.C. foi repelida em Salamina e Plateias. Os sucessores de Alexandre, os Ptolomeus e os selêucidas, governaram os judeus por quase dois séculos, e sob eles o grego se tornou a língua dos judeus do Egito, que nela traduziram a Lei; a revolta macabaica de 167 a.C. foi travada contra a helenização de Jerusalém. Roma conquistou a Grécia em 146 a.C. e a pôs sob o governador da Macedônia; em 27 a.C., Augusto fez do sul a província da Acaia."
    - "Paulo passou à Europa em resposta a um homem da Macedônia que disse: “Passa à Macedônia e ajuda-nos”, e fundou igrejas em Filipos, Tessalônica e Bereia; pregou no Areópago de Atenas e passou dezoito meses em Corinto. Lucas usa o nome Hélade, Grécia, uma só vez, quando na terceira viagem Paulo “chegou à Grécia” e ficou três meses; em outros lugares o Novo Testamento diz Macedônia e Acaia. A Bíblia Sinodal traduz o nome de três modos: Jônia em Zacarias, Grécia em Daniel, Hélade em Atos."
    - "A Grécia foi bizantina e ortodoxa por mil anos, otomana por quatro séculos, e conquistou a independência em 1830. Hoje a República Helênica, com capital em Atenas, tem cerca de dez milhões de habitantes, e Filipos, Tessalônica, Bereia e Corinto, onde Paulo fundou igrejas, ainda são sedes de metropolitas ortodoxos."
  de:
    - "Griechenland ist die gebirgige Halbinsel mit den Inseln im Süden des Balkans, die Heimat der Hellenen, deren Stadtstaaten Athen, Sparta, Korinth und die übrigen Philosophie, Drama, Geschichtsschreibung und die griechische Sprache prägten, in der das Neue Testament geschrieben wurde. Die hebräische Bibel nennt die Griechen Jawan, nach den Ioniern der asiatischen Küste, denen sie zuerst begegnete: Jawan ist in der Völkertafel ein Sohn Jafets, und seine Söhne sind Elischa, Tarsis, Kittim und Dodanim, die Inseln und Küsten des Westens. Joel wirft Tyrus und Sidon vor, die Kinder Judas „den Griechen“ verkauft zu haben, und Sacharja verheißt, die Söhne Zions zu erwecken „über deine Kinder, Griechenland“."
    - "Daniel sah Griechenland als Reich. Der Ziegenbock, der aus dem Westen flog und Persiens Widder zerbrach, „ist der König in Griechenland. Das Horn zwischen seinen Augen ist der erste König“, Alexander, der 334 v. Chr. nach Asien übersetzte und 323 in Babylon starb; der vierte König Persiens, der „den größern Reichtum haben“ werde „denn alle andern“ und „alles wider das Königreich in Griechenland erregen“, gilt meist als Xerxes, dessen Invasion 480 v. Chr. bei Salamis und Platää scheiterte. Unter Alexanders Nachfolgern, Ptolemäern und Seleukiden, die fast zwei Jahrhunderte über die Juden herrschten, wurde Griechisch die Sprache der Juden Ägyptens, die das Gesetz übersetzten; der Makkabäeraufstand 167 v. Chr. galt der Hellenisierung Jerusalems. Rom eroberte es 146 v. Chr. und unterstellte es Mazedoniens Statthalter; 27 v. Chr. schuf Augustus im Süden die Provinz Achaja."
    - "Paulus setzte nach Europa über, weil ein Mann aus Mazedonien sagte: „Komm herüber nach Mazedonien und hilf uns!“, und gründete Gemeinden in Philippi, Thessalonich und Beröa; er predigte auf dem Areopag in Athen und verbrachte achtzehn Monate in Korinth. Lukas gebraucht den Namen Hellas, Griechenland, nur ein einziges Mal, als Paulus auf der dritten Reise „nach Griechenland“ kam und drei Monate blieb; sonst sagt das Neue Testament Mazedonien und Achaja. Die Synodalübersetzung gibt den Namen auf drei Weisen wieder: Ionien bei Sacharja, Griechenland bei Daniel, Hellas in der Apostelgeschichte."
    - "Griechenland war tausend Jahre byzantinisch und orthodox, vier Jahrhunderte osmanisch und erlangte 1830 seine Unabhängigkeit. Heute hat die Hellenische Republik mit der Hauptstadt Athen etwa zehn Millionen Einwohner, und Philippi, Thessalonich, Beröa und Korinth, wo Paulus Gemeinden gründete, sind noch immer Sitze orthodoxer Metropoliten."
  fr:
    - "La Grèce est la péninsule montagneuse et les îles du sud des Balkans, patrie des Hellènes, dont les cités-États, Athènes, Sparte, Corinthe et les autres, ont façonné la philosophie, le théâtre, l’histoire et la langue grecque dans laquelle fut écrit le Nouveau Testament. La Bible hébraïque appelle les Grecs Javan, les Ioniens de la côte asiatique, qu’elle rencontra les premiers : Javan est un fils de Japhet dans la table des nations, et ses fils sont Élischa, Tarsis, Kittim et Dodanim, les îles et les côtes de l’ouest. Joël accuse Tyr et Sidon d’avoir vendu les enfants de Juda « aux enfants de Javan », et Zacharie promet de soulever les fils de Sion « contre tes enfants, ô Javan »."
    - "Daniel voit en elle un empire. Du bouc de l’ouest qui brisa le bélier de Perse, il est dit : « c’est le roi de Javan, la grande corne entre ses yeux, c’est le premier roi » : Alexandre, qui passa en Asie en 334 av. J.-C. et mourut à Babylone en 323 ; le quatrième roi de Perse, qui « amassera plus de richesses que tous les autres » et « soulèvera tout contre le royaume de Javan », est d’ordinaire Xerxès, dont l’invasion de 480 av. J.-C. échoua à Salamine et à Platées. Les successeurs d’Alexandre, les Ptolémées et les Séleucides, dominèrent les Juifs près de deux siècles, et sous eux le grec devint la langue des Juifs d’Égypte, qui y traduisirent la Loi ; la révolte maccabéenne de 167 av. J.-C. visa l’hellénisation de Jérusalem. Rome conquit la Grèce en 146 av. J.-C. et la plaça sous le gouverneur de Macédoine ; en 27 av. J.-C., Auguste fit du sud la province d’Achaïe."
    - "Paul passa en Europe en réponse à un Macédonien qui lui dit : « Passe en Macédoine, secours-nous ! », et fonda des Églises à Philippes, à Thessalonique et à Bérée ; il prêcha à l’Aréopage d’Athènes et passa dix-huit mois à Corinthe. Luc n’emploie le nom d’Hellas, la Grèce, qu’une seule fois, quand, au troisième voyage, Paul « se rendit en Grèce, où il séjourna trois mois » ; ailleurs, le Nouveau Testament dit Macédoine et Achaïe. La Bible synodale rend le nom de trois façons : Ionie chez Zacharie, Grèce chez Daniel, Hellade dans les Actes."
    - "La Grèce fut byzantine et orthodoxe pendant mille ans, ottomane pendant quatre siècles, et conquit son indépendance en 1830. Aujourd’hui, la République hellénique, dont la capitale est Athènes, compte environ dix millions d’habitants, et Philippes, Thessalonique, Bérée et Corinthe, où Paul fonda des Églises, sont encore des sièges de métropolites orthodoxes."
  pl:
    - "Grecja to górzysty półwysep i wyspy na południu Bałkanów, ojczyzna Hellenów, których miasta-państwa, Ateny, Sparta, Korynt i inne, ukształtowały filozofię, dramat, historię i język grecki, w którym napisano Nowy Testament. Biblia hebrajska nazywa Greków Jawan, Jończykami z wybrzeża azjatyckiego, których spotkała najpierw: Jawan jest synem Jafeta w tablicy narodów, a jego synowie to Elisa, Tarszisz, Kittim i Dodanim, wyspy i wybrzeża zachodu. Joel oskarża Tyr i Sydon, że sprzedały dzieci Judy „synom Jawanowym”, a Zachariasz obiecuje wzbudzić synów Syjonu „przeciwko synom twoim, o Jawanie!”."
    - "Daniel widział Grecję jako imperium. Kozioł, który przyleciał z zachodu i połamał barana Persji, „jest król Grecki, a ten róg wielki, który jest między oczyma jego, jest król pierwszy”, Aleksander, który przeszedł do Azji w 334 r. p.n.e. i zmarł w Babilonie w 323; czwarty król Persji, który „zbogaci się bogactwy wielkimi nade wszystkich” i „pobudzi wszystkich przeciw królestwu Greckiemu”, jest zwykle uważany za Kserksesa, którego najazd w 480 r. p.n.e. odparto pod Salaminą i Platejami. Następcy Aleksandra, Ptolemeusze i Seleucydzi, rządzili Żydami blisko dwa stulecia, a greka stała się językiem Żydów Egiptu, którzy przełożyli na nią Prawo; powstanie machabejskie z 167 r. p.n.e. toczono przeciw hellenizacji Jerozolimy. Rzym podbił Grecję w 146 r. p.n.e. i podporządkował ją namiestnikowi Macedonii; w 27 r. p.n.e. August uczynił południe prowincją Achai."
    - "Paweł przeszedł do Europy w odpowiedzi na męża Macedończyka, który mówił: „Przepraw się do Macedonii, a ratuj nas”, i założył kościoły w Filippi, Tesalonice i Berei; głosił na Areopagu w Atenach i spędził osiemnaście miesięcy w Koryncie. Łukasz używa nazwy Hellada, Grecja, tylko raz, gdy w trzeciej podróży Paweł „przyszedł do Grecyi” i został trzy miesiące; gdzie indziej Nowy Testament mówi Macedonia i Achaja. Biblia synodalna oddaje nazwę na trzy sposoby: Jonia u Zachariasza, Grecja u Daniela, Hellada w Dziejach."
    - "Grecja była bizantyńska i prawosławna przez tysiąc lat, osmańska przez cztery stulecia, a niepodległość uzyskała w 1830 r. Dziś Republika Grecka ze stolicą w Atenach liczy około dziesięciu milionów ludzi, a Filippi, Tesalonika, Berea i Korynt, gdzie Paweł zakładał kościoły, są nadal siedzibami prawosławnych metropolitów."
  it:
    - "La Grecia è la penisola montuosa con le isole nel sud dei Balcani, patria degli Elleni, le cui città-stato, Atene, Sparta, Corinto e le altre, plasmarono filosofia, dramma, storia e la lingua greca in cui fu scritto il Nuovo Testamento. La Bibbia ebraica chiama i Greci Iavan, gli Ioni della costa asiatica, che incontrò per primi: Iavan è un figlio di Iafet nella tavola delle nazioni, e i suoi figli sono Elisa, Tarsis, Kittim e Dodanim, le isole e le coste dell’occidente. Gioele accusa Tiro e Sidone di aver venduto i figli di Giuda «ai figliuoli degli Javaniti», e Zaccaria promette di sollevare i figli di Sion «contro i tuoi figliuoli, o Javan»."
    - "Daniele vide la Grecia come un impero. Il capro che volò da occidente e spezzò l’ariete di Persia «è il re di Grecia; e il gran corno fra i suoi due occhi è il primo re», Alessandro, che passò in Asia nel 334 a.C. e morì a Babilonia nel 323; il quarto re di Persia, «molto più ricco di tutti gli altri», che «solleverà tutti contro il regno di Javan», è di solito identificato con Serse, la cui invasione del 480 a.C. fu respinta a Salamina e a Platea. I successori di Alessandro, Tolomei e Seleucidi, governarono i Giudei per quasi due secoli, e sotto di loro il greco divenne la lingua dei Giudei d’Egitto, che vi tradussero la Legge; la rivolta dei Maccabei del 167 a.C. fu combattuta contro l’ellenizzazione di Gerusalemme. Roma conquistò la Grecia nel 146 a.C. e la pose sotto il governatore di Macedonia; nel 27 a.C. Augusto fece del sud la provincia di Acaia."
    - "Paolo passò in Europa in risposta a un uomo di Macedonia che diceva: «Passa in Macedonia e soccorrici», e fondò chiese a Filippi, Tessalonica e Berea; predicò all’Areòpago di Atene e rimase diciotto mesi a Corinto. Luca usa il nome Ellade, Grecia, una sola volta, quando nel terzo viaggio Paolo «venne in Grecia» e vi rimase tre mesi; altrove il Nuovo Testamento dice Macedonia e Acaia. La Bibbia sinodale rende il nome in tre modi: Ionia in Zaccaria, Grecia in Daniele, Ellade negli Atti."
    - "La Grecia fu bizantina e ortodossa per mille anni, ottomana per quattro secoli, e conquistò l’indipendenza nel 1830. Oggi la Repubblica Ellenica, con capitale Atene, ha circa dieci milioni di abitanti, e Filippi, Tessalonica, Berea e Corinto, dove Paolo fondò chiese, sono ancora sedi di metropoliti ortodossi."
  nl:
    - "Griekenland is het bergachtige schiereiland met eilanden in het zuiden van de Balkan, de woonplaats van de Hellenen, wier stadstaten, Athene, Sparta, Korinthe en de rest, de filosofie, het drama, de geschiedschrijving en de Griekse taal vormden waarin het Nieuwe Testament werd geschreven. De Hebreeuwse Bijbel noemt de Grieken Javan, de Ioniërs van de Aziatische kust, die zij het eerst ontmoette: Javan is een zoon van Jafet in de volkerentafel, en zijn zonen zijn Elisa, Tarsis, Kittim en Dodanim, de eilanden en kusten van het westen. Joël beschuldigt Tyrus en Sidon ervan de kinderen van Juda verkocht te hebben “aan de kinderen der Grieken”, en Zacharia belooft Sions zonen te verwekken “tegen uw kinderen, o Griekenland”."
    - "Daniël zag Griekenland als rijk. De bok uit het westen die de ram van Perzië brak, “is de koning van Griekenland; en de grote hoorn, welke tussen zijn ogen is, is de eerste koning”: Alexander, die in 334 v.Chr. Azië binnentrok en in 323 te Babylon stierf. De vierde Perzische koning, verrijkt “met groten rijkdom, meer dan al de anderen”, die allen zal “verwekken tegen het koninkrijk van Griekenland”, is meestal Xerxes, wiens inval in 480 v.Chr. bij Salamis en Plataeae strandde. Alexanders opvolgers, de Ptolemaeën en Seleuciden, beheersten de Joden bijna twee eeuwen; onder hen werd Grieks de taal van de Egyptische Joden, die de Wet erin vertaalden, en de Makkabeese opstand van 167 v.Chr. keerde zich tegen de hellenisering van Jeruzalem. Rome veroverde Griekenland in 146 v.Chr. en stelde het onder de stadhouder van Macedonië; in 27 v.Chr. maakte Augustus het zuiden tot provincie Achaja."
    - "Paulus stak over naar Europa op het verzoek van een Macedonische man die zei: “Kom over in Macedonië, en help ons”, en stichtte gemeenten te Filippi, Tessalonica en Berea; hij predikte op de Areopagus te Athene en bleef anderhalf jaar te Korinthe. Lukas gebruikt de naam Hellas, Griekenland, slechts eenmaal, toen het van Paulus op zijn derde reis heet: “kwam hij in Griekenland”, waar hij drie maanden bleef; elders noemt het Nieuwe Testament Macedonië en Achaja. De Synodale Bijbel geeft de naam op drie manieren weer: Ionië in Zacharia, Griekenland in Daniël, Hellas in Handelingen."
    - "Griekenland was duizend jaar Byzantijns en orthodox, vier eeuwen Ottomaans, en verkreeg zijn onafhankelijkheid in 1830. Nu telt de Helleense Republiek, met Athene als hoofdstad, ongeveer tien miljoen inwoners, en Filippi, Tessalonica, Berea en Korinthe, waar Paulus gemeenten stichtte, zijn nog steeds zetels van orthodoxe metropolieten."
  cs:
    - "Řecko je hornatý poloostrov s ostrovy na jihu Balkánu, domov Helénů, jejichž městské státy, Atény, Sparta, Korint a další, formovaly filozofii, drama, dějepisectví a řecký jazyk, v němž byl napsán Nový zákon. Hebrejská Bible nazývá Řeky Javan, Ióny na asijském pobřeží, s nimiž se setkala nejdříve: Javan je syn Jafetův v tabulce národů a jeho synové jsou Eliša, Taršíš, Kitejští a Dodanim, ostrovy a pobřeží na západě. Joel viní Týr a Sidón, že prodaly syny Judovy „synům Javanovým“, a Zacharjáš slibuje pozdvihnout syny Sijónu „proti synům tvým, ó Javane“."
    - "Daniel viděl Řecko jako říši. Kozel, který přiletěl ze západu a zlomil berana Persie, „jest král Řecký, a roh ten veliký, kterýž jest mezi očima jeho, jest král první“, Alexandr, který přešel do Asie roku 334 př. n. l. a zemřel v Babylóně roku 323; čtvrtý perský král, který „zbohatne bohatstvím velikým nade všecky“ a „vzbudí všecky proti království Řeckému“, se obvykle pokládá za Xerxa, jehož invaze roku 480 př. n. l. byla odražena u Salamíny a Platají. Alexandrovi nástupci, Ptolemaiovci a Seleukovci, vládli Židům téměř dvě století a za nich se řečtina stala jazykem Židů v Egyptě, kteří do ní přeložili Zákon; makabejské povstání roku 167 př. n. l. bylo vedeno proti helenizaci Jeruzaléma. Řím dobyl Řecko roku 146 př. n. l. a podřídil je správci Makedonie; roku 27 př. n. l. Augustus učinil z jihu provincii Achaju."
    - "Pavel přešel do Evropy na výzvu muže z Makedonie, který řekl: „Přijda do Macedonie, pomoz nám“, a založil církve ve Filipách, Tesalonice a Beroii; kázal na Areopagu v Aténách a strávil osmnáct měsíců v Korintu. Lukáš užívá jména Hellas, Řecko, jen jednou, když na třetí cestě Pavel „přišel do země Řecké“ a zůstal tři měsíce; jinde Nový zákon říká Makedonie a Achaja. Synodální Bible vykládá jméno třemi způsoby: Ionie u Zacharjáše, Řecko u Daniele, Hellas ve Skutcích."
    - "Řecko bylo tisíc let byzantské a pravoslavné, čtyři století osmanské a nezávislost získalo roku 1830. Dnes má Helénská republika s hlavním městem Aténami asi deset milionů obyvatel a Filipy, Tesalonika, Beroia a Korint, kde Pavel zakládal církve, jsou dosud sídly pravoslavných metropolitů."
