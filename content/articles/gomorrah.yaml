body:
  en:
    - 'Gomorrah is almost never named without Sodom. Genesis lists it at the edge of Canaan, "unto Sodom, and Gomorrah, and Admah, and Zeboim", and gives its king a name, Birsha, who joined the four other kings of the plain against Chedorlaomer; when they were beaten in the vale of Siddim, the kings of Sodom and Gomorrah fell into its slime pits. Like Sodom, Gomorrah has never been located, and this map marks it at the same point, at the south end of the Dead Sea.'
    - "Among the Early Bronze Age sites east of the southern Dead Sea, the one most often proposed for Gomorrah is Numeira, a small walled town on the Wadi en-Numeira that the Expedition to the Dead Sea Plain of Walter Rast and Thomas Schaub excavated between 1977 and 1983. It was lived in only during the Early Bronze III period, a matter of a few centuries at most, and ended in fire, never to be resettled. Those who pair it with Bab edh-Dhra as Gomorrah and Sodom point to the burning; others object that it was a village, not a city, and that its end, in the third millennium BC, is hard to fit with the patriarchal stories. Others link the name of the wadi with the waters of Nimrim in Isaiah's oracle on Moab."
    - 'In Genesis the Lord rains brimstone and fire on Sodom and Gomorrah, and in the morning Abraham sees the smoke of the land go up "as the smoke of a furnace". After that Gomorrah lives on as a word for judgement: Deuteronomy pictures a land of brimstone and salt like the overthrow of the four cities; Isaiah says that without a remnant Judah would have been like unto Gomorrah, a verse Paul quotes in Romans; Jeremiah likens the inhabitants of Jerusalem to Gomorrah; Amos and the Gospel of Matthew name it beside Sodom.'
    - "Ancient writers still looked for the five cities by the Dead Sea. Josephus said traces of them could be seen; in the fourth century Eusebius' Onomasticon calls Gomorra one of the five cities of Sodom, destroyed together with the rest, and names Zoar as the only one that survived."
  ru:
    - "Гоморра почти никогда не называется без Содома. Книга Бытия упоминает её на краю Ханаана, «к Содому, Гоморре, Адме и Цевоиму», и называет её царя по имени — Бирша, который вместе с четырьмя другими царями окрестности выступил против Кедорлаомера; когда они были разбиты в долине Сиддим, цари Содомский и Гоморрский упали в её смоляные ямы. Как и Содом, Гоморра так и не найдена, и на этой карте она отмечена в той же точке, у южного края Мёртвого моря."
    - "Из поселений раннего бронзового века к востоку от южной части Мёртвого моря на роль Гоморры чаще всего предлагают Нумейру — небольшой обнесённый стеной город у Вади эн-Нумейра, который экспедиция Уолтера Раста и Томаса Шауба раскапывала в 1977–1983 гг. Он был населён только в период раннего бронзового века III, не дольше нескольких веков, и погиб в огне, после чего больше не заселялся. Те, кто видит в нём и Баб-эд-Дра Гоморру и Содом, указывают на пожар; другие возражают, что это было селение, а не город, и что его гибель в III тысячелетии до н. э. трудно согласовать с рассказами о патриархах. Другие связывают название вади с водами Нимрима из пророчества Исаии о Моаве."
    - "В Книге Бытия Господь проливает на Содом и Гоморру серу и огонь, а утром Авраам видит дым, поднимающийся с земли, «как дым из печи». После этого Гоморра живёт как слово о суде: Второзаконие описывает землю серы и соли, как по истреблении четырёх городов; Исаия говорит, что без остатка Иудея уподобилась бы Гоморре, и эти слова приводит Павел в Послании к Римлянам; Иеремия сравнивает жителей Иерусалима с Гоморрой; Амос и Евангелие от Матфея называют её рядом с Содомом."
    - "Древние авторы по-прежнему искали пять городов у Мёртвого моря. Иосиф Флавий писал, что их следы видны; в IV веке «Ономастикон» Евсевия называет Гоморру одним из пяти городов Содома, истреблённым вместе с остальными, а Сигор — единственным уцелевшим."
  uk:
    - "Гоморру майже ніколи не називають без Содома. Книга Буття перелічує її на краю Ханаану, «до Содому і Гоморри й Адами й Зевоіму», і дає її цареві ім’я — Бірша, який разом з іншими чотирма царями долини виступив проти Кедорлаомера; коли їх розбили в долині Сиддим, царі Содому й Гоморри попадали в її ями. Як і Содом, місце Гоморри ніколи не було встановлено, і ця карта позначає її в тій самій точці, на південному кінці Мертвого моря."
    - "Серед пам’яток раннього бронзового віку на схід від південної частини Мертвого моря найчастіше для Гоморри пропонують Нумейру — невелике місто з мурами на ваді Нумейра, яке Експедиція до рівнини Мертвого моря Волтера Раста й Томаса Шауба розкопувала в 1977–1983 роках. Воно було заселене лише в добу ранньої бронзи III, щонайбільше кілька століть, і скінчилося вогнем, ніколи не заселившись знову. Ті, хто поєднує його з Баб-ед-Дра як Гоморру й Содом, вказують на пожежу; інші заперечують, що це було село, а не місто, і що його кінець, у III тисячолітті до н. е., важко узгодити з патріархальними оповідями. Інші пов’язують назву вади з водами Німріма в оракулі Ісаї про Моав."
    - "У Книзі Буття Господь посилає сірку й вогонь на Содом і Гоморру, а вранці Авраам бачить, як дим землі здіймається «як дим із печі». Відтоді Гоморра живе як слово про суд: Повторення Закону змальовує землю сірки й солі, подібну до руйнації чотирьох міст; Ісая каже, що без залишку Юда була б як Гоморра, і цей вірш цитує Павло в Посланні до римлян; Єремія порівнює мешканців Єрусалима з Гоморрою; Амос і Євангеліє від Матвія називають її поряд із Содомом."
    - "Давні автори ще шукали п’ять міст біля Мертвого моря. Йосиф Флавій казав, що їхні сліди можна бачити; у IV ст. «Ономастикон» Євсевія називає Гоморру одним із п’яти міст Содому, знищених разом з рештою, і називає Сігор єдиним, що вцілів."
  es:
    - "Gomorra casi nunca se nombra sin Sodoma. El Génesis la sitúa en el borde de Canaán, «hasta entrar en Sodoma y Gomorra, Adma, y Zeboim», y da a su rey un nombre, Birsa, que se unió a los otros cuatro reyes de la llanura contra Quedorlaomer; cuando fueron vencidos en el valle de Siddim, los reyes de Sodoma y de Gomorra cayeron en sus pozos de betún. Como Sodoma, Gomorra nunca ha sido localizada, y este mapa la señala en el mismo punto, en el extremo sur del mar Muerto."
    - "Entre los yacimientos de la Edad del Bronce Antiguo al este del sur del mar Muerto, el más a menudo propuesto para Gomorra es Numeira, una pequeña población amurallada en el Wadi en-Numeira que la Expedición a la llanura del mar Muerto, de Walter Rast y Thomas Schaub, excavó entre 1977 y 1983. Solo estuvo habitada durante el período del Bronce Antiguo III, cuestión de unos pocos siglos como máximo, y terminó en un incendio, sin volver a ser poblada. Quienes la emparejan con Bab edh-Dhra como Gomorra y Sodoma señalan el incendio; otros objetan que era una aldea, no una ciudad, y que su fin, en el tercer milenio a. C., difícilmente encaja con los relatos patriarcales. Otros vinculan el nombre del wadi con las aguas de Nimrim del oráculo de Isaías sobre Moab."
    - "En el Génesis el Señor hace llover azufre y fuego sobre Sodoma y Gomorra, y por la mañana Abraham ve subir el humo de la tierra «como el humo de un horno». Después Gomorra sigue viviendo como palabra de juicio: el Deuteronomio imagina una tierra de azufre y sal como la subversión de las cuatro ciudades; Isaías dice que sin un residuo Judá habría sido semejante a Gomorra, versículo que Pablo cita en Romanos; Jeremías compara a los habitantes de Jerusalén con Gomorra; Amós y el Evangelio de Mateo la nombran junto a Sodoma."
    - "Los autores antiguos seguían buscando las cinco ciudades junto al mar Muerto. Josefo decía que se podían ver vestigios de ellas; en el siglo IV el Onomasticón de Eusebio llama a Gomorra una de las cinco ciudades de Sodoma, destruida junto con las demás, y nombra a Zoar como la única que sobrevivió."
  pt:
    - "Gomorra quase nunca é nomeada sem Sodoma. Gênesis a lista na orla de Canaã, “na direção de Sodoma, Gomorra, Admá e Zeboim”, e dá a seu rei um nome, Birsa, que se juntou aos outros quatro reis da planície contra Quedorlaomer; quando foram vencidos no vale de Sidim, os reis de Sodoma e Gomorra caíram nos seus poços de betume. Como Sodoma, Gomorra nunca foi localizada, e este mapa a marca no mesmo ponto, no extremo sul do mar Morto."
    - "Entre os sítios do Bronze Antigo a leste do sul do mar Morto, o mais frequentemente proposto para Gomorra é Numeira, uma pequena cidade murada no uádi en-Numeira que a Expedição à Planície do Mar Morto de Walter Rast e Thomas Schaub escavou entre 1977 e 1983. Foi habitada apenas durante o período do Bronze Antigo III, questão de poucos séculos no máximo, e acabou em fogo, nunca mais sendo reocupada. Os que a associam a Bab edh-Dhra como Gomorra e Sodoma apontam para o incêndio; outros objetam que era uma aldeia, não uma cidade, e que seu fim, no terceiro milênio a.C., é difícil de conciliar com as histórias patriarcais. Outros ligam o nome do uádi às águas de Ninrim no oráculo de Isaías sobre Moabe."
    - "Em Gênesis, o Senhor faz chover enxofre e fogo sobre Sodoma e Gomorra, e de manhã Abraão vê a fumaça da terra subir “como a fumaça de uma fornalha”. Depois disso Gomorra sobrevive como palavra para juízo: Deuteronômio pinta uma terra de enxofre e sal como a destruição das quatro cidades; Isaías diz que, sem um remanescente, Judá teria sido semelhante a Gomorra, versículo que Paulo cita em Romanos; Jeremias compara os habitantes de Jerusalém a Gomorra; Amós e o Evangelho de Mateus a nomeiam ao lado de Sodoma."
    - "Escritores antigos ainda procuravam as cinco cidades junto ao mar Morto. Josefo dizia que se podiam ver traços delas; no século IV, o Onomástico de Eusébio chama Gomorra uma das cinco cidades de Sodoma, destruída junto com as demais, e nomeia Zoar como a única que sobreviveu."
  de:
    - "Gomorra wird fast nie ohne Sodom genannt. Das erste Buch Mose führt es am Rand Kanaans auf, „bis man kommt gen Sodom, Gomorra, Adama, Zeboim“, und gibt seinem König einen Namen, Birscha, der sich mit den vier anderen Königen der Ebene gegen Kedorlaomer verband; als sie im Tal Siddim geschlagen wurden, fielen die Könige von Sodom und Gomorra in dessen Erdharzgruben. Wie Sodom ist Gomorra nie lokalisiert worden, und diese Karte setzt es an dieselbe Stelle, am Südende des Toten Meeres."
    - "Unter den frühbronzezeitlichen Stätten östlich des südlichen Toten Meeres wird für Gomorra am häufigsten Numeira vorgeschlagen, eine kleine ummauerte Stadt am Wadi en-Numeira, die die Expedition to the Dead Sea Plain von Walter Rast und Thomas Schaub zwischen 1977 und 1983 ausgrub. Sie war nur in der Frühbronzezeit III bewohnt, höchstens einige Jahrhunderte lang, und endete im Feuer, um nie wieder besiedelt zu werden. Wer sie mit Bab edh-Dhra als Gomorra und Sodom zusammenstellt, verweist auf den Brand; andere wenden ein, es sei ein Dorf gewesen, keine Stadt, und sein Ende im 3. Jahrtausend v. Chr. lasse sich kaum mit den Vätergeschichten vereinbaren. Wieder andere verbinden den Namen des Wadi mit den Wassern von Nimrim in Jesajas Orakel über Moab."
    - "Im ersten Buch Mose lässt der Herr Schwefel und Feuer auf Sodom und Gomorra regnen, und am Morgen sieht Abraham den Rauch des Landes aufsteigen, „wie ein Rauch vom Ofen“. Danach lebt Gomorra als Wort für das Gericht fort: Das fünfte Buch Mose malt ein Land aus Schwefel und Salz wie die Zerstörung der vier Städte; Jesaja sagt, ohne einen Rest wäre Juda wie Gomorra, ein Vers, den Paulus im Römerbrief zitiert; Jeremia vergleicht die Bewohner Jerusalems mit Gomorra; Amos und das Matthäusevangelium nennen es neben Sodom."
    - "Antike Schriftsteller suchten die fünf Städte noch am Toten Meer. Josephus sagte, man könne Spuren von ihnen sehen; im 4. Jahrhundert nennt das Onomastikon des Eusebius Gomorra eine der fünf Städte Sodoms, mit den übrigen zerstört, und nennt Zoar als die einzige, die überlebte."
  fr:
    - "Gomorrhe n’est presque jamais nommée sans Sodome. La Genèse la mentionne à la limite de Canaan, « du côté de Sodome, de Gomorrhe, d’Adma et de Tseboïm », et donne un nom à son roi, Birscha, qui se joignit aux quatre autres rois de la plaine contre Kedorlaomer ; quand ils furent battus dans la vallée de Siddim, les rois de Sodome et de Gomorrhe tombèrent dans ses puits de bitume. Comme Sodome, Gomorrhe n’a jamais été localisée, et cette carte la marque au même point, à l’extrémité sud de la mer Morte."
    - "Parmi les sites du Bronze ancien à l’est de la mer Morte méridionale, celui que l’on propose le plus souvent pour Gomorrhe est Numeira, une petite ville fortifiée sur l’oued en-Numeira que l’Expedition to the Dead Sea Plain de Walter Rast et Thomas Schaub fouilla entre 1977 et 1983. Elle ne fut habitée qu’au Bronze ancien III, quelques siècles tout au plus, et finit dans le feu, sans jamais être réoccupée. Ceux qui l’associent à Bab edh-Dhra comme Gomorrhe et Sodome invoquent l’incendie ; d’autres objectent qu’il s’agissait d’un village, non d’une ville, et que sa fin, au IIIe millénaire av. J.-C., s’accorde mal avec les récits patriarcaux. D’autres rattachent le nom de l’oued aux eaux de Nimrim dans l’oracle d’Ésaïe sur Moab."
    - "Dans la Genèse, l’Éternel fait pleuvoir du soufre et du feu sur Sodome et sur Gomorrhe, et au matin Abraham voit la fumée du pays monter « comme la fumée d’une fournaise ». Ensuite, Gomorrhe survit comme mot de jugement : le Deutéronome évoque une terre de soufre et de sel semblable au bouleversement des quatre villes ; Ésaïe dit que sans un faible reste Juda aurait été semblable à Gomorrhe, verset que Paul cite dans l’épître aux Romains ; Jérémie compare les habitants de Jérusalem à Gomorrhe ; Amos et l’Évangile de Matthieu la nomment à côté de Sodome."
    - "Les auteurs antiques cherchaient encore les cinq villes près de la mer Morte. Josèphe disait qu’on pouvait en voir des traces ; au IVe siècle, l’Onomasticon d’Eusèbe appelle Gomorra l’une des cinq villes de Sodome, détruite avec les autres, et nomme Tsoar comme la seule qui survécut."
  pl:
    - "Gomora niemal nigdy nie jest wymieniana bez Sodomy. Księga Rodzaju wymienia ją na skraju Kanaanu, „aż wnijdziesz do Sodomy i Gomorry, i Adamy, i Seboima”, i podaje imię jej króla, Birszy, który z czterema innymi królami równiny wystąpił przeciw Kedorlaomerowi; gdy ich pobito w dolinie Syddym, królowie Sodomy i Gomory wpadli w jej doły z asfaltem. Podobnie jak Sodomy, Gomory nigdy nie zlokalizowano, a ta mapa zaznacza ją w tym samym punkcie, na południowym krańcu Morza Martwego."
    - "Spośród stanowisk z wczesnej epoki brązu na wschód od południowego Morza Martwego najczęściej proponuje się dla Gomory Numeirę, małe obwarowane miasto nad Wadi en-Numeira, które Expedition to the Dead Sea Plain Waltera Rasta i Thomasa Schauba badała w latach 1977–1983. Było zamieszkane tylko w okresie wczesnej epoki brązu III, co najwyżej przez kilka stuleci, i skończyło się pożarem, by już nigdy nie zostać ponownie zasiedlone. Ci, którzy łączą je z Bab edh-Dhra jako Gomorę i Sodomę, wskazują na pożar; inni zarzucają, że była to wieś, nie miasto, a jej kres w III tysiącleciu p.n.e. trudno pogodzić z opowieściami patriarchalnymi. Jeszcze inni łączą nazwę wadi z wodami Nimrim w orędziu Izajasza o Moabie."
    - "W Księdze Rodzaju Pan zsyła na Sodomę i Gomorę siarkę i ogień, a rankiem Abraham widzi, jak dym z ziemi wznosi się „jako dym z pieca”. Potem Gomora żyje jako słowo oznaczające sąd: Księga Powtórzonego Prawa wyobraża ziemię siarki i soli jak zagłada czterech miast; Izajasz mówi, że bez ostatka Juda byłaby podobna do Gomory, wers, który Paweł cytuje w Liście do Rzymian; Jeremiasz przyrównuje mieszkańców Jerozolimy do Gomory; Amos i Ewangelia według Mateusza wymieniają ją obok Sodomy."
    - "Pisarze starożytni wciąż szukali pięciu miast nad Morzem Martwym. Józef Flawiusz mówił, że ich ślady można zobaczyć; w IV w. Onomastykon Euzebiusza nazywa Gomorę jednym z pięciu miast Sodomy, zniszczonym wraz z resztą, i wymienia Soar jako jedyne, które ocalało."
  it:
    - "Gomorra non è quasi mai nominata senza Sodoma. La Genesi la elenca al margine di Canaan, «in direzione di Sodoma, Gomorra, Adma e Tseboim», e dà al suo re un nome, Birsa, che si unì agli altri quattro re della pianura contro Chedorlaomer; quando furono sconfitti nella valle di Siddim, i re di Sodoma e di Gomorra caddero nei suoi pozzi di bitume. Come Sodoma, Gomorra non è mai stata localizzata, e questa mappa la segna nello stesso punto, all’estremità meridionale del Mar Morto."
    - "Fra i siti del Bronzo Antico a est del Mar Morto meridionale, quello più spesso proposto per Gomorra è Numeira, una piccola città murata sul Wadi en-Numeira che la Expedition to the Dead Sea Plain di Walter Rast e Thomas Schaub scavò fra il 1977 e il 1983. Fu abitata solo durante il Bronzo Antico III, al massimo per pochi secoli, e finì nel fuoco, senza più essere rioccupata. Chi l’accoppia a Bab edh-Dhra come Gomorra e Sodoma richiama l’incendio; altri obiettano che era un villaggio, non una città, e che la sua fine, nel III millennio a.C., si concilia male con i racconti patriarcali. Altri collegano il nome del wadi con le acque di Nimrim nell’oracolo di Isaia su Moab."
    - "Nella Genesi il Signore fa piovere zolfo e fuoco su Sodoma e Gomorra, e al mattino Abramo vede il fumo della terra salire «come il fumo d’una fornace». Poi Gomorra sopravvive come parola per il giudizio: il Deuteronomio raffigura una terra di zolfo e sale come lo sconvolgimento delle quattro città; Isaia dice che senza un residuo Giuda sarebbe stato simile a Gomorra, versetto che Paolo cita nella Lettera ai Romani; Geremia paragona gli abitanti di Gerusalemme a Gomorra; Amos e il Vangelo di Matteo la nominano accanto a Sodoma."
    - "Gli scrittori antichi cercavano ancora le cinque città presso il Mar Morto. Giuseppe Flavio diceva che se ne vedevano tracce; nel IV secolo l’Onomasticon di Eusebio chiama Gomorra una delle cinque città di Sodoma, distrutta con le altre, e nomina Soar come la sola che sopravvisse."
  nl:
    - "Gomorra wordt bijna nooit zonder Sodom genoemd. Genesis noemt het aan de rand van Kanaän, “daar gij gaat naar Sodom en Gomorra, en Adama, en Zoboim”, en geeft zijn koning een naam, Birsa, die zich met de vier andere koningen van het dal tegen Kedorlaomer verbond; toen zij in het dal van Siddim werden verslagen, vielen de koningen van Sodom en Gomorra in de lijmputten. Net als Sodom is Gomorra nooit gelokaliseerd, en deze kaart markeert het op hetzelfde punt, aan het zuideinde van de Dode Zee."
    - "Onder de plaatsen uit de Vroege Bronstijd ten oosten van de zuidelijke Dode Zee wordt voor Gomorra het vaakst Numeira voorgesteld, een kleine ommuurde stad aan de Wadi en-Numeira, die de Expedition to the Dead Sea Plain van Walter Rast en Thomas Schaub tussen 1977 en 1983 opgroef. Zij werd alleen bewoond in de periode Vroege Bronstijd III, hooguit enkele eeuwen, en eindigde in vuur, zonder ooit weer bewoond te worden. Wie haar met Bab edh-Dhra als Gomorra en Sodom paart, wijst op de brand; anderen werpen tegen dat het een dorp was, geen stad, en dat het einde ervan, in het 3e millennium v.Chr., moeilijk met de aartsvaderverhalen te rijmen is. Weer anderen verbinden de naam van de wadi met de wateren van Nimrim in Jesaja’s godsspraak over Moab."
    - "In Genesis laat de HEER zwavel en vuur regenen over Sodom en Gomorra, en in de ochtend ziet Abraham de rook van het land opgaan “gelijk de rook eens ovens”. Daarna leeft Gomorra voort als woord voor het oordeel: Deuteronomium schetst een land van zwavel en zout als de omkering van de vier steden; Jesaja zegt dat Juda zonder overblijfsel Gomorra gelijk zou zijn geworden, een vers dat Paulus in Romeinen aanhaalt; Jeremia vergelijkt de inwoners van Jeruzalem met Gomorra; Amos en het Evangelie van Mattheüs noemen het naast Sodom."
    - "Antieke schrijvers zochten de vijf steden nog bij de Dode Zee. Josephus zei dat er sporen van te zien waren; in de 4e eeuw noemt het Onomasticon van Eusebius Gomorra een van de vijf steden van Sodom, samen met de rest verwoest, en noemt Zoar als de enige die overbleef."
  cs:
    - "Gomora se téměř nikdy nejmenuje bez Sodomy. Genesis ji uvádí na okraji Kanaánu, „k Sodomě a Gomoře, a Adama a Seboim“, a dává jejímu králi jméno, Birša, který se spojil s dalšími čtyřmi králi roviny proti Kedorlaomerovi; když byli poraženi v údolí Siddim, králové Sodomy a Gomory padli do jeho studní klejovatých. Jako Sodoma nebyla ani Gomora nikdy lokalizována a tato mapa ji označuje na stejném bodě, na jižním konci Mrtvého moře."
    - "Mezi lokalitami rané doby bronzové východně od jižního Mrtvého moře je pro Gomoru nejčastěji navrhována Numejra, malé opevněné město na Wádí en-Numejra, které Expedice do pláně Mrtvého moře Waltera Rasta a Thomase Schauba vykopávala v letech 1977 až 1983. Bylo obydleno jen v období rané doby bronzové III, nejvýše několik staletí, a skončilo ohněm, aby nebylo nikdy znovu osídleno. Ti, kdo ji spojují s Bab edh-Dhra jako Gomoru a Sodomu, poukazují na požár; jiní namítají, že šlo o vesnici, nikoli město, a že její konec ve 3. tisíciletí př. n. l. lze těžko sladit s příběhy o patriarchách. Další spojují jméno wádí s vodami Nimrímu ve výroku Izajášově o Moábu."
    - "V Genesis Hospodin sešle na Sodomu a Gomoru déšť síry a ohně a ráno Abraham vidí, jak dým země vystupuje „jako dým z vápenice“. Potom Gomora žije dál jako slovo pro soud: Deuteronomium líčí zemi síry a soli jako zkázu čtyř měst; Izajáš praví, že bez pozůstatku by Juda byl podoben Gomoře, verš, který Pavel cituje v listu Římanům; Jeremjáš přirovnává obyvatele Jeruzaléma ke Gomoře; Amos a Matoušovo evangelium ji jmenují vedle Sodomy."
    - "Starověcí spisovatelé ještě hledali těch pět měst u Mrtvého moře. Josephus říkal, že jejich stopy lze vidět; ve 4. století Eusebiův Onomastikon nazývá Gomorru jedním z pěti měst Sodomy, zničeným spolu s ostatními, a jmenuje Soar jako jediné, které přežilo."
  sv:
    - "Gomorra nämns nästan aldrig utan Sodom. Första Moseboken räknar upp det vid Kanaans kant, ”fram emot Sodom, Gomorra, Adma och Seboim”, och ger dess kung ett namn, Birsha, som slöt sig till de fyra andra kungarna på slätten mot Kedorlaomer; när de besegrades i Siddimsdalen föll kungarna i Sodom och Gomorra i dess jordbecksgropar. Liksom Sodom har Gomorra aldrig lokaliserats, och denna karta markerar det på samma punkt, vid Döda havets södra ände."
    - "Bland bronsålderns platser öster om södra Döda havet är den som oftast föreslagits för Gomorra Numeira, en liten befäst stad vid Wadi en-Numeira som Expedition to the Dead Sea Plain under Walter Rast och Thomas Schaub grävde ut 1977–1983. Den var bebodd bara under tidig bronsålder III, högst några århundraden, och slutade i eld, aldrig mer bosatt. De som parar ihop den med Bab edh-Dhra som Gomorra och Sodom pekar på branden; andra invänder att den var en by, inte en stad, och att dess undergång, under tredje årtusendet f.Kr., är svår att foga ihop med patriarkberättelserna. Andra kopplar wadins namn till Nimrims vatten i Jesajas spådom om Moab."
    - "I Första Moseboken låter Herren svavel och eld regna över Sodom och Gomorra, och på morgonen ser Abraham rök stiga upp från landet, ”lik röken från en smältugn”. Därefter lever Gomorra kvar som ett ord för dom: Femte Moseboken skildrar ett land av svavel och salt likt de fyra städernas undergång; Jesaja säger att Juda utan en rest skulle ha blivit Gomorra likt, en vers som Paulus citerar i Romarbrevet; Jeremia likställer Jerusalems invånare med Gomorra; Amos och Matteusevangeliet nämner det vid sidan av Sodom."
    - "Antika författare sökte ännu de fem städerna vid Döda havet. Josefus sade att spår av dem kunde ses; på 300-talet kallar Eusebios Onomastikon Gomorra en av Sodoms fem städer, förstörd tillsammans med de övriga, och nämner Soar som den enda som överlevde."
  nb:
    - "Gomorra nevnes nesten aldri uten Sodoma. Første Mosebok oppfører den ved kanten av Kanaan, «bortimot Sodoma og Gomorra og Adma og Sebo'im», og gir dens konge et navn, Birsja, som slo seg sammen med de fire andre kongene på sletten mot Kedorlaomer; da de ble slått i Siddim-dalen, falt kongene av Sodoma og Gomorra i dens jordbekgruber. Som Sodoma er Gomorra aldri blitt lokalisert, og dette kartet markerer den på det samme punktet, i sørenden av Dødehavet."
    - "Blant stedene fra tidlig bronsealder øst for det sørlige Dødehavet er det som oftest foreslås for Gomorra Numeira, en liten befestet by ved Wadi en-Numeira som Walter Rasts og Thomas Schaubs ekspedisjon til Dødehavssletten gravde ut mellom 1977 og 1983. Den var bare bebodd i tidlig bronsealder III, en sak om høyst noen århundrer, og endte i brann, aldri mer bosatt. De som parer den med Bab edh-Dhra som Gomorra og Sodoma, peker på brannen; andre innvender at den var en landsby, ikke en by, og at dens slutt, i det tredje årtusen f.Kr., er vanskelig å få til å stemme med patriarkfortellingene. Andre knytter navnet på wadien til Nimrims vann i Jesajas utsagn om Moab."
    - "I Første Mosebok lar Herren svovel og ild regne over Sodoma og Gomorra, og om morgenen ser Abraham røken fra landet stige opp «som røken fra en smelteovn». Siden lever Gomorra videre som et ord for dom: Femte Mosebok maler et land av svovel og salt som ødeleggelsen av de fire byene; Jesaja sier at uten en rest ville Juda ha vært lik Gomorra, et vers Paulus siterer i Romerbrevet; Jeremia likner innbyggerne i Jerusalem med Gomorra; Amos og Matteusevangeliet nevner den ved siden av Sodoma."
    - "Antikke forfattere så fortsatt etter de fem byene ved Dødehavet. Josefus sa at spor etter dem kunne sees; på 300-tallet kaller Eusebius' Onomasticon Gomorra en av de fem byene i Sodoma, ødelagt sammen med de andre, og nevner Soar som den eneste som overlevde."
  tl:
    - "Halos hindi kailanman pinangangalanan ang Gomorra nang wala ang Sodoma. Itinatala ito ng Genesis sa gilid ng Canaan, “kung patungo sa Sodoma at Gomorra, at Adma, at Zeboim”, at binibigyan ang hari nito ng pangalan, Birsha, na sumama sa apat pang hari ng kapatagan laban kay Chedorlaomer; nang matalo sila sa libis ng Siddim, ang mga hari ng Sodoma at Gomorra ay nahulog sa mga hukay ng betun nito. Tulad ng Sodoma, hindi pa natatagpuan ang Gomorra, at minamarkahan ito ng mapang ito sa parehong punto, sa timog na dulo ng Dagat na Patay."
    - "Sa mga lugar ng Maagang Panahon ng Tanso sa silangan ng timog na Dagat na Patay, ang pinakamadalas na iminumungkahi para sa Gomorra ay ang Numeira, isang maliit na bayang may pader sa Wadi en-Numeira na hinukay ng Ekspedisyon sa Kapatagan ng Dagat na Patay nina Walter Rast at Thomas Schaub sa pagitan ng 1977 at 1983. Tinirhan lamang ito sa Maagang Panahon ng Tanso III, ilang siglo sa pinakamarami, at nagtapos sa apoy, at hindi na muling tinirhan. Itinuturo ng mga nag-uugnay dito sa Bab edh-Dhra bilang Gomorra at Sodoma ang pagkasunog; tumututol ang iba na ito ay nayon, hindi lungsod, at na ang wakas nito, sa ika-3 milenyo BK, ay mahirap iangkop sa mga kuwento ng mga patriyarka. Iniuugnay ng iba ang pangalan ng wadi sa tubig ng Nimrim sa orakulo ni Isaias tungkol sa Moab."
    - "Sa Genesis ay nagpapaulan ang Panginoon ng asupre at apoy sa Sodoma at Gomorra, at kinaumagahan nakikita ni Abraham na ang usok ng lupain ay “napaiilanglang na parang usok ng isang hurno”. Pagkatapos nito ay nabubuhay ang Gomorra bilang salita ng paghatol: inilalarawan ng Deuteronomio ang isang lupain ng asupre at asin na gaya ng pagkawasak ng apat na lungsod; sinasabi ni Isaias na kung walang labi ay naging gaya ng Gomorra ang Juda, isang talatang sinipi ni Pablo sa Roma; inihahambing ni Jeremias ang mga naninirahan sa Jerusalem sa Gomorra; pinangangalanan ito nina Amos at ng Ebanghelyo ni Mateo sa tabi ng Sodoma."
    - "Hinanap pa rin ng mga sinaunang manunulat ang limang lungsod sa tabi ng Dagat na Patay. Sinabi ni Josephus na makikita ang bakas ng mga ito; noong ika-4 na siglo ang Onomasticon ni Eusebio ay tinatawag ang Gomorra na isa sa limang lungsod ng Sodoma, nawasak kasama ng iba, at pinangangalanan ang Zoar bilang tanging nakaligtas."
  da:
    - "Gomorra nævnes næsten aldrig uden Sodoma. Første Mosebog opregner den ved Kana'ans rand, »henimod Sodoma og Gomorra, Adma og Zeboim«, og giver dens konge et navn, Birsja, som sluttede sig til de fire andre sletternes konger mod Kedorlaomer; da de blev slået i Siddims dal, faldt kongerne af Sodoma og Gomorra ned i dalens jordbegsgruber. Som Sodoma er Gomorra aldrig blevet lokaliseret, og dette kort markerer den på samme punkt, ved Det Døde Havs sydlige ende."
    - "Blandt bronzealderstederne øst for det sydlige Døde Hav er det, der oftest foreslås for Gomorra, Numeira, en lille befæstet by ved Wadi en-Numeira, som Walter Rasts og Thomas Schaubs Expedition to the Dead Sea Plain udgravede mellem 1977 og 1983. Den var kun beboet i den tidlige bronzealder III, højst nogle få århundreder, og endte i ild, uden nogensinde at blive genbosat. De, der parrer den med Bab edh-Dhra som Gomorra og Sodoma, peger på branden; andre indvender, at den var en landsby, ikke en by, og at dens ende, i 3. årtusinde f.Kr., er svær at forene med patriarkfortællingerne. Andre forbinder wadiens navn med Nimrims vande i Esajas' orakel om Moab."
    - "I Første Mosebog lader Herren svovl og ild regne over Sodoma og Gomorra, og om morgenen ser Abraham landets røg stige op »som en Røg af en Ovn«. Derefter lever Gomorra videre som et ord for dom: Femte Mosebog skildrer et land af svovl og salt som ødelæggelsen af de fire byer; Esajas siger, at Juda uden en rest ville være blevet som Gomorra, et vers Paulus citerer i Romerbrevet; Jeremias sammenligner Jerusalems indbyggere med Gomorra; Amos og Mattæusevangeliet nævner den ved siden af Sodoma."
    - "Antikke forfattere ledte stadig efter de fem byer ved Det Døde Hav. Josefus sagde, at spor af dem kunne ses; i 300-tallet kalder Eusebios' Onomastikon Gomorra en af de fem byer i Sodoma, ødelagt sammen med de øvrige, og nævner Soar som den eneste, der overlevede."
  sr:
    - "Гомор се готово никад не именује без Содома. Постање га наводи на ободу Ханана, „идући на Содом и Гомор и Адаму и Севојим“, и даје његовом цару име, Варса, који се с четири друга цара равнице придружио против Ходологомора; кад су потучени у долини сидимској, цареви Содома и Гомора пали су у њене јаме са смолом. Као и Содом, Гомор никад није лоциран, а ова карта га означава на истом месту, на јужном крају Мртвог мора."
    - "Међу налазиштима раног бронзаног доба источно од јужног Мртвог мора, она која се најчешће предлаже за Гомор је Нумејра, мали зидани град на Вади ен-Нумејра који су Експедиција на раван Мртвог мора Валтера Раста и Томаса Шауба ископавали између 1977. и 1983. Био је насељен само у раном бронзаном добу III, у распону од највише неколико векова, и завршио је у ватри, да се никад више не насели. Они који га упаривају с Баб ед-Драом као Гомор и Содом указују на паљевину; други приговарају да је то било село, не град, и да се његов крај, у трећем миленијуму п. н. е., тешко слаже са патријархалним причама. Други повезују име вадија с водама Нимрима у Исаијином пророштву о Моаву."
    - "У Постању Господ пушта сумпор и огањ на Содом и Гомор, а ујутру Аврам види како се дим земље диже „као дим из пећи“. После тога Гомор живи као реч за суд: Поновљени закони приказују земљу сумпора и соли попут разарања четири града; Исаија каже да би без остатка Јуда била као Гомор, стих који Павле цитира у Римљанима; Јеремија упоређује становнике Јерусалима с Гомором; Амос и Матејево јеванђеље именују га уз Содом."
    - "Антички писци су још тражили пет градова поред Мртвог мора. Јосиф Флавије је рекао да се трагови могу видети; у четвртом веку Јевсевијев „Ономастикон“ назива Гомор једним од пет градова Содома, уништеним заједно с осталима, и именује Сигор као једини који је преживео."
  hu:
    - "Gomorát szinte sosem nevezik meg Sodoma nélkül. A Teremtés könyve Kánaán szélén sorolja fel: „Sodoma, Gomora, Ádmáh, és Czeboim felé menve”, és királyának nevet ad, Birsa, aki a síkság négy másik királyával együtt Kedorlaomer ellen szövetkezett; amikor a siddimi völgyben vereséget szenvedtek, Sodoma és Gomora királyai a szurokgödrökbe estek. Sodomához hasonlóan Gomorát sem helyezték el biztosan, és a térkép ugyanarra a pontra teszi, a Holt-tenger déli végére."
    - "A déli Holt-tengertől keletre fekvő kora bronzkori lelőhelyek közül Gomorának leggyakrabban Numeirát javasolják, a Vádi en-Numeirán fekvő kis fallal körülvett várost, amelyet Walter Rast és Thomas Schaub Holt-tengeri Síkság Expedíciója ásott 1977 és 1983 között. Csak a Kora Bronz III. időszakban lakták, legfeljebb néhány évszázadig, és tűzben ért véget, soha többé nem népesült be. Akik Báb edh-Dhráával együtt Gomorának és Sodomának tartják, az égésre mutatnak; mások ellenvetik, hogy falu volt, nem város, és hogy a Kr. e. 3. évezredben bekövetkezett vége nehezen illeszthető a pátriárkák történeteihez. Mások a vádi nevét Ézsaiás Moábról szóló jövendölésének Nimrim vizeivel kapcsolják össze."
    - "A Teremtés könyvében az Úr kénkövet és tüzet zúdít Sodomára és Gomorára, és reggel Ábrahám látja, hogy a föld füstje felszáll, „mint a kemencze füstje”. Ezután Gomora az ítélet szavaként él tovább: a Mózes ötödik könyve kénkő és só földjét ábrázolja, mint a négy város pusztulását; Ézsaiás szerint maradék nélkül Júda Gomorához lett volna hasonló, amely verset Pál idézi a Rómaiakhoz írt levélben; Jeremiás Gomorához hasonlítja Jeruzsálem lakóit; Ámós és Máté evangéliuma Sodoma mellett nevezi meg."
    - "Az ókori írók még az öt várost keresték a Holt-tengernél. Josephus szerint nyomaik láthatók voltak; a 4. században Eusebius Onomasticonja Gomorrát Sodoma öt városa egyikének nevezi, amely a többivel együtt elpusztult, és Cóárt jelöli meg egyetlenként, amely túlélte."
  fi:
    - "Gomorraa tuskin koskaan mainitaan ilman Sodomaa. Genesis luettelee sen Kanaanin reunalla, ”Sodomaan, Gomorraan, Admaan ja Seboimiin”, ja antaa sen kuninkaalle nimen, Birsa, joka liittyi muiden tasangon neljän kuninkaan kanssa Kedorlaomeria vastaan; kun heidät voitettiin Siddimin laaksossa, Sodoman ja Gomorran kuninkaat putosivat sen maapihkakuoppiin. Kuten Sodomaa, Gomorraa ei ole koskaan paikannettu, ja tämä kartta merkitsee sen samaan pisteeseen, Kuolleenmeren eteläpäähän."
    - "Kuolleenmeren eteläosan itäpuolisista varhaispronssikauden paikoista Gomorraksi ehdotetaan useimmin Numeiraa, pientä muurien ympäröimää kaupunkia Wadi en-Numeiran varrella, jota Walter Rastin ja Thomas Schaubin Kuolleenmeren tasangon retkikunta kaivoi vuosina 1977–1983. Siinä asuttiin vain varhaispronssikauden III aikana, enintään muutaman vuosisadan ajan, ja se päättyi tuleen eikä sitä asutettu enää koskaan. Ne, jotka yhdistävät sen Bab edh-Dhran kanssa Gomorraksi ja Sodomaksi, viittaavat paloon; toiset vastustavat, että se oli kylä eikä kaupunki ja että sen loppu 3. vuosituhannella eaa. on vaikea sovittaa patriarkkakertomuksiin. Toiset yhdistävät wadin nimen Jesajan Moab-ennustuksen Nimrimin vesiin."
    - "Genesiksessä Herra sataa tulikiveä ja tulta Sodoman ja Gomorran päälle, ja aamulla Abraham näkee maan savun nousevan ”niinkuin pätsin savu”. Sen jälkeen Gomorra elää tuomion sanana: Mooseksen viides kirja kuvaa tulikiven ja suolan maata, joka on kuin neljän kaupungin tuho; Jesaja sanoo, että ilman jäännöstä Juuda olisi ollut Gomorran kaltainen, jakeen Paavali lainaa Roomalaiskirjeessä; Jeremia vertaa Jerusalemin asukkaita Gomorraan; Aamos ja Matteuksen evankeliumi mainitsevat sen Sodoman vieressä."
    - "Antiikin kirjoittajat etsivät yhä viittä kaupunkia Kuolleenmeren äärestä. Josephus sanoi niiden jälkien olevan yhä nähtävissä; 300-luvulla Eusebioksen Onomastikon kutsuu Gomorraa yhdeksi Sodoman viidestä kaupungista, jotka tuhottiin yhdessä muiden kanssa, ja nimeää Soarin ainoaksi, joka säilyi."
  vi:
    - "Gô-mô-rơ hầu như không bao giờ được nêu tên mà không có Sô-đôm. Sáng Thế Ký liệt kê thành ở rìa Ca-na-an, “Sô-đôm, Gô-mô-rơ, Át-ma và Sê-bô-im”, và cho vua của thành một cái tên, Bi-rê-sa, người cùng bốn vua khác của đồng bằng chống lại Kết-rô-Lao-me; khi họ bị đánh bại trong trũng Si-điêm, các vua Sô-đôm và Gô-mô-rơ rơi vào các hố nhựa của trũng. Cũng như Sô-đôm, Gô-mô-rơ chưa bao giờ được định vị, và bản đồ này đánh dấu thành tại cùng một điểm, ở đầu nam Biển Chết."
    - "Trong số các địa điểm thời Đồ Đồng Sớm phía đông nam Biển Chết, nơi thường được đề nghị cho Gô-mô-rơ nhất là Numeira, một thị trấn nhỏ có tường bao bên Wadi en-Numeira mà Đoàn thám hiểm Đồng bằng Biển Chết của Walter Rast và Thomas Schaub đã khai quật giữa năm 1977 và 1983. Nơi này chỉ có người ở trong thời Đồ Đồng Sớm III, nhiều lắm là vài thế kỷ, và kết thúc trong lửa, không bao giờ có người ở lại. Những người ghép nó với Bab edh-Dhra thành Gô-mô-rơ và Sô-đôm chỉ vào vụ cháy; những người khác phản đối rằng đó là một ngôi làng, không phải một thành, và sự kết thúc của nó, vào thiên niên kỷ 3 TCN, khó khớp với các câu chuyện thời các tổ phụ. Có người nối tên wadi với nước Nim-rim trong lời tiên tri của Ê-sai về Mô-áp."
    - "Trong Sáng Thế Ký, Chúa mưa diêm sinh và lửa trên Sô-đôm và Gô-mô-rơ, và sáng ra Áp-ra-ham thấy khói của xứ bay lên “như khói của một lò lửa lớn”. Sau đó Gô-mô-rơ sống tiếp như một từ chỉ sự phán xét: sách Phục Truyền hình dung một xứ diêm sinh và muối như sự hủy diệt của bốn thành; Ê-sai nói rằng nếu không còn một số sót lại thì Giu-đa đã giống như Gô-mô-rơ, một câu mà Phao-lô trích trong thư Rô-ma; Giê-rê-mi ví dân cư Giê-ru-sa-lem với Gô-mô-rơ; A-mốt và Phúc Âm Ma-thi-ơ nêu tên thành bên cạnh Sô-đôm."
    - "Các tác giả cổ đại vẫn tìm năm thành bên Biển Chết. Josephus nói còn có thể thấy dấu vết của chúng; vào thế kỷ 4, Onomasticon của Eusebius gọi Gomorra là một trong năm thành của Sô-đôm, bị hủy diệt cùng các thành khác, và nêu Xoa là thành duy nhất còn sót."
  ro:
    - "Gomora nu este aproape niciodată numită fără Sodoma. Geneza o enumeră la marginea Canaanului, „până la Sodoma și Gomora și Adama și Sevoin”, și dă regelui ei un nume, Birșa, care s-a alăturat celorlalți patru regi ai câmpiei împotriva lui Chedorlaomer; când au fost învinși în valea Sidim, regii Sodomei și Gomorei au căzut în gropile ei cu smoală. Ca și Sodoma, Gomora nu a fost niciodată localizată, iar această hartă o marchează în același punct, la capătul de sud al Mării Moarte."
    - "Dintre locurile din Bronzul Timpuriu de la est de sudul Mării Moarte, cel mai des propus pentru Gomora este Numeira, un mic oraș cu ziduri pe Wadi en-Numeira, pe care Expediția în câmpia Mării Moarte a lui Walter Rast și Thomas Schaub l-a săpat între 1977 și 1983. A fost locuit doar în Bronzul Timpuriu III, cel mult câteva secole, și s-a sfârșit în foc, fără să mai fie repopulat. Cei care îl asociază cu Bab edh-Dhra drept Gomora și Sodoma invocă arderea; alții obiectează că era un sat, nu un oraș, și că sfârșitul lui, în mileniul al III-lea î.Hr., se potrivește greu cu povestirile patriarhale. Alții leagă numele wadiului de apele Nimrimului din profeția lui Isaia despre Moab."
    - "În Geneza, Domnul plouă pucioasă și foc peste Sodoma și Gomora, iar dimineața Avraam vede fumul țării ridicându-se ca fumul unui cuptor. După aceea Gomora trăiește ca un cuvânt pentru judecată: Deuteronomul zugrăvește o țară de pucioasă și sare ca nimicirea celor patru cetăți; Isaia spune că, fără un rest, Iuda ar fi fost asemenea Gomorei, un verset pe care Pavel îl citează în Romani; Ieremia îi asemuiește pe locuitorii Ierusalimului cu Gomora; Amos și Evanghelia după Matei o numesc alături de Sodoma."
    - "Scriitorii antici mai căutau cele cinci cetăți lângă Marea Moartă. Iosif Flaviu spunea că urmele lor se puteau vedea; în secolul al IV-lea, Onomasticonul lui Eusebiu numește Gomora una dintre cele cinci cetăți ale Sodomei, nimicită laolaltă cu celelalte, și arată Țoarul drept singura care a supraviețuit."
  bg:
    - "Гомор почти никога не се назовава без Содом. Битие го изброява на края на Ханаан — „в Содом, и Гомор, и Адма, и Цевоим“, и дава име на царя му, Бирша, който се присъедини към другите четирима царе на равнината срещу Кедорлаомер; когато бяха разбити в долината Сидим, царете на Содом и Гомор паднаха в смолните ѝ кладенци. Подобно на Содом, Гомор никога не е бил локализиран и тази карта го отбелязва в същата точка, в южния край на Мъртво море."
    - "Сред селищата от ранната бронзова епоха на изток от южната част на Мъртво море най-често за Гомор се предлага Нумейра — малък град със стени на Уади ен-Нумейра, който Експедицията до равнината на Мъртво море на Уолтър Раст и Томас Шауб разкопа между 1977 и 1983 г. Той е бил обитаван само през периода Ранна бронзова епоха III, най-много няколко века, и е завършил в пожар, без никога да бъде заселен отново. Онези, които го съчетават с Баб ед-Дра като Гомор и Содом, изтъкват опожаряването; други възразяват, че той е бил село, а не град, и че краят му, през III хил. пр.н.е., трудно се съгласува с разказите за патриарсите. Други свързват името на уадито с водите на Нимрим от пророчеството на Исаия за Моав."
    - "В Битие Господ изсипва жупел и огън над Содом и Гомор, а на сутринта Авраам вижда дима на земята да се издига „като дим из пещ“. След това Гомор живее като дума за съд: Второзаконие рисува земя от жупел и сол като съсипването на четирите града; Исаия казва, че без остатък Юда би се уподобила на Гомор — стих, който Павел цитира в Римляни; Йеремия оприличава жителите на Йерусалим на Гомор; Амос и Евангелието от Матей го назовават редом със Содом."
    - "Древните автори още търсеха петте града край Мъртво море. Йосиф Флавий казва, че следи от тях могат да се видят; през IV в. „Ономастикон“ на Евсевий нарича Гомора един от петте града на Содом, унищожен заедно с останалите, и назовава Сигор като единствения оцелял."
