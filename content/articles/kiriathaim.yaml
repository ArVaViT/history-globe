# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the candidates are given without choosing.
id: kiriathaim
place: ad54201
title:
  en: "Kiriathaim"
  ru: "Кириафаим"
  uk: "Кіріатаїм"
  es: "Quiriataim"
  pt: "Quiriataim"
  de: "Kirjatajim"
  fr: "Kirjathaïm"
  it: "Kiriataim"
