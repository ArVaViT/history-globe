body:
  en:
    - "Kiriathaim, “the two towns”, was a town on the Moabite plateau east of the Dead Sea, in the country north of the Arnon that Israel and Moab disputed for centuries. It is old: in the war of the four kings Chedorlaomer smote “the Emims in Shaveh Kiriathaim”, the plain of Kiriathaim, the Emim being the giants whom Moab later displaced. After the conquest of Sihon “the children of Reuben built Heshbon, and Elealeh, and Kirjathaim”, and Joshua assigns it to Reuben with Sibmah and Zereth-shahar."
    - "It did not stay Israelite. On his stele of about 840 BC Mesha, king of Moab, says that he built Baal-meon with its reservoir, and Qiryaten. Jeremiah's oracle on Moab opens with it, “Woe unto Nebo! for it is spoiled: Kiriathaim is confounded and taken”, and names it again with Beth-gamul and Beth-meon; Ezekiel counts it among the frontier towns that were “the glory of the country, Beth-jeshimoth, Baal-meon, and Kiriathaim”. The Synodal Bible spells it Kiriathaim in the Law and Ezekiel and Kariathaim in Jeremiah. Eusebius knew Kariatha as a village entirely Christian, ten miles west of Medeba."
    - "The site is not settled. The name seems to survive at Khirbet el-Qureiye, some 10 km west of Medeba, and at el-Qureiyat, about 20 km south-south-west of it; each has been taken for the town. Others place Kiriathaim at Khirbet el-Mukhayyat on the slope of Mount Nebo, better known as the town of Nebo, or, less often, at Tall Jalul east of Medeba, a large Iron Age mound. All lie within about 25 km of one another in the Madaba governorate of Jordan."
  ru:
    - "Кириафаим, «два города», был городом на Моавитском плато к востоку от Мёртвого моря, в земле к северу от Арнона, за которую Израиль и Моав спорили веками. Он древен: в войне четырёх царей Кедорлаомер поразил «Эмимов в Шаве-Кириафаиме», на равнине Кириафаима, а Эмимы — исполины, которых позже вытеснил Моав. После победы над Сигоном «сыны Рувимовы построили Есевон, Елеале, Кириафаим», и книга Иисуса Навина отдаёт его Рувиму вместе с Сивмой и Цереф-Шахаром."
    - "Израильским он не остался. На своей стеле около 840 г. до н. э. Меса, царь Моавитский, говорит, что построил Ваал-Меон с его водоёмом и Кирьятен. Пророчество Иеремии о Моаве открывается им: «горе Нево! он опустошен; Кариафаим посрамлен и взят», и называет его снова вместе с Бет-Гамулом и Бет-Маоном; Иезекииль числит его среди пограничных городов, «красы земли, от Беф-Иешимофа, Ваалмеона и Кириафаима». Синодальный перевод пишет Кириафаим в Законе и у Иезекииля и Кариафаим у Иеремии. Евсевий знал Кариафу как селение, целиком христианское, в десяти милях к западу от Медевы."
    - "Место не установлено. Имя, по-видимому, сохранилось в Хирбет-эль-Курейе, примерно в 10 км к западу от Медевы, и в Эль-Курайяте, примерно в 20 км к юго-юго-западу от неё; тот и другой принимали за этот город. Другие помещают Кириафаим в Хирбет-эль-Мухайяте на склоне горы Нево, более известном как город Нево, или, реже, в Телль-Джалуле к востоку от Медевы, большом холме железного века. Все они лежат в пределах примерно 25 км друг от друга в иорданской провинции Мадаба."
  uk:
    - "Кіріатаїм, «два міста», був містом на моавитському плато на схід від Мертвого моря, в краї на північ від Арнону, за який Ізраїль і Моав сперечалися століттями. Він давній: у війні чотирьох царів Кедорлаомер побив «Еміїв на Кириятаїм-долинї», рівнині Кіріатаїма, а емії були велетні, яких Моав пізніше витіснив. Після завоювання землі Сігона «А сини Рубенові побудували: Гезбон та Єлале та Кирятаїм», а Ісус Навин відводить його Рувимові разом із Сівмою і Церет-Шахаром."
    - "Ізраїльським він не залишився. На своїй стелі близько 840 р. до н. е. Меша, цар Моаву, каже, що збудував Ваал-Меон з його водоймою та Кірйатен. Пророцтво Єремії про Моав відкривається ним: «Горе Неву-місту! воно спустошене буде; соромом окритий Киріятярим і звойований», і знову називає його разом із Бет-Гамулом і Бет-Меоном; Єзекіїль зараховує його до прикордонних міст, що були «від краси землї, Бет-Ешимота, Баалмеона й Киріятаїму». Синодальний переклад пише Кириафаим у Законі та в Єзекіїля й Кариафаим в Єремії. Євсевій знав Каріату як село, цілком християнське, за десять миль на захід від Мадаби."
    - "Місце не встановлено. Назва, схоже, збереглася в Хірбет-ель-Курейє, приблизно за 10 км на захід від Мадаби, і в ель-Курайяті, приблизно за 20 км на південь-південний захід від неї; кожне з них вважали за це місто. Інші розміщують Кіріатаїм у Хірбет-ель-Мухайяті на схилі гори Нево, відомішому як місто Нево, або, рідше, в Телль-Джалюлі на схід від Мадаби, великому пагорбі залізної доби. Усі вони лежать у межах приблизно 25 км один від одного в мухафазі Мадаба в Йорданії."
  es:
    - "Quiriataim, «las dos ciudades», era una ciudad de la meseta de Moab, al este del mar Muerto, en la región al norte del Arnón que Israel y Moab se disputaron durante siglos. Es antigua: en la guerra de los cuatro reyes, Quedorlaomer derrotó «á los Emitas en Shave-Kiriataim», la llanura de Quiriataim, siendo los emitas los gigantes a quienes Moab desplazó más tarde. Tras la conquista de Sehón, «los hijos de Rubén edificaron á Hesbón, y á Eleale, y á Kiriathaim», y Josué se la asigna a Rubén junto con Sibma y Zeret-sahar."
    - "No siguió siendo israelita. En su estela, de hacia 840 a. C., Mesa, rey de Moab, dice que edificó Baal-meón con su depósito de agua, y Qiryaten. El oráculo de Jeremías sobre Moab comienza con ella: «¡Ay de Nebo! que fué destruída, fué avergonzada; Chîriathaim fué tomada», y la nombra de nuevo con Bet-gamul y Bet-meón; Ezequiel la cuenta entre las ciudades fronterizas que eran «las tierras deseables de Beth-jesimoth, y Baal-meón, y Chîriathaim». La Biblia sinodal escribe su nombre Kiriathaim en la Ley y en Ezequiel y Kariathaim en Jeremías. Eusebio conoció Kariatha como una aldea enteramente cristiana, a diez millas al oeste de Medeba."
    - "El emplazamiento no está resuelto. El nombre parece sobrevivir en Khirbet el-Qureiye, a unos 10 km al oeste de Medeba, y en el-Qureiyat, a unos 20 km al sudsudoeste de ella; cada uno ha sido tomado por la ciudad. Otros sitúan Quiriataim en Khirbet el-Mukhayyat, en la ladera del monte Nebo, más conocido como la ciudad de Nebo, o, con menos frecuencia, en Tall Jalul, al este de Medeba, un gran montículo de la Edad del Hierro. Todos se hallan a menos de unos 25 km unos de otros, en la gobernación de Madaba, en Jordania."
  pt:
    - "Quiriataim, “as duas cidades”, era uma cidade do planalto moabita a leste do mar Morto, no país ao norte do Arnom que Israel e Moabe disputaram por séculos. É antiga: na guerra dos quatro reis, Quedorlaomer derrotou “os emins em Savé-Quiriataim”, a planície de Quiriataim, sendo os emins os gigantes que Moabe depois desalojou. Após a conquista de Seom, “Os filhos de Rúben construíram Hesbom, Eleale, Quiriataim”, e Josué a atribui a Rúben com Sibma e Zerete-Saar."
    - "Não permaneceu israelita. Em sua estela, de cerca de 840 a.C., Mesa, rei de Moabe, diz que construiu Baal-Meom com seu reservatório, e Qiryaten. O oráculo de Jeremias sobre Moabe começa com ela: “Ai de Nebo! Pois está devastada. Quiriataim está envergonhada. Ela foi tomada”, e a nomeia de novo com Bete-Gamul e Bete-Meom; Ezequiel a conta entre as cidades de fronteira que eram “a glória do país, Bete-Jesimote, Baal-Meom e Quiriataim”. A Bíblia Sinodal a grafa Quiriataim na Lei e em Ezequiel e Cariataim em Jeremias. Eusébio conhecia Cariata como uma aldeia inteiramente cristã, a dez milhas a oeste de Medeba."
    - "O sítio não está definido. O nome parece sobreviver em Khirbet el-Qureiye, a uns 10 km a oeste de Medeba, e em el-Qureiyat, a cerca de 20 km a sul-sudoeste dela; cada uma foi tomada pela cidade. Outros situam Quiriataim em Khirbet el-Mukhayyat, na encosta do monte Nebo, mais conhecida como a cidade de Nebo, ou, menos vezes, em Tall Jalul, a leste de Medeba, um grande montículo da Idade do Ferro. Todos ficam a menos de uns 25 km uns dos outros, na província de Madaba, na Jordânia."
  de:
    - "Kirjatajim, „die beiden Städte“, war eine Stadt auf der moabitischen Hochebene östlich des Toten Meeres, in dem Land nördlich des Arnon, um das Israel und Moab jahrhundertelang stritten. Sie ist alt: Im Krieg der vier Könige schlug Kedorlaomer „die Emiter in dem Felde Kirjathaim“, der Ebene von Kirjatajim, wobei die Emiter die Riesen waren, die Moab später verdrängte. Nach der Eroberung Sihons heißt es: „Die Kinder Ruben bauten Hesbon, Eleale, Kirjathaim“, und Josua weist sie Ruben zu, mit Sibma und Zeret-Schahar."
    - "Israelitisch blieb sie nicht. Auf seiner Stele von etwa 840 v. Chr. sagt Mesa, der König von Moab, er habe Baal-Meon mit seinem Wasserbecken gebaut, und Qiryaten. Jeremias Spruch über Moab beginnt damit: „Weh der Stadt Nebo! denn sie ist zerstört und liegt elend; Kirjathaim ist gewonnen“, und nennt sie wieder mit Bet-Gamul und Bet-Meon; Hesekiel zählt sie zu den Grenzstädten, die er so beschreibt: „das edle Land von Beth-Jesimoth, Baal-Meon und Kirjathaim“. Die Synodalbibel schreibt sie im Gesetz und bei Hesekiel Kiriathaim und bei Jeremia Kariathaim. Eusebius kannte Kariatha als ein ganz christliches Dorf, zehn Meilen westlich von Medeba."
    - "Die Lage ist nicht geklärt. Der Name scheint in Khirbet el-Qureiye, etwa 10 km westlich von Medeba, und in el-Qureiyat, etwa 20 km südsüdwestlich davon, fortzuleben; beide wurden für die Stadt gehalten. Andere setzen Kirjatajim in Khirbet el-Mukhayyat am Hang des Berges Nebo an, besser als die Stadt Nebo bekannt, oder, seltener, in Tall Jalul östlich von Medeba, einem großen eisenzeitlichen Hügel. Alle liegen im Gouvernement Madaba in Jordanien innerhalb von etwa 25 km voneinander."
  fr:
    - "Kirjathaïm, « les deux villes », était une ville du plateau moabite à l’est de la mer Morte, dans le pays au nord de l’Arnon qu’Israël et Moab se disputèrent pendant des siècles. Elle est ancienne : dans la guerre des quatre rois, Kedorlaomer battit « les Émim à Schavé-Kirjathaïm », la plaine de Kirjathaïm, les Émim étant les géants que Moab supplanta plus tard. Après la conquête du pays de Sihon, « les fils de Ruben bâtirent Hesbon, Élealé et Kirjathaïm », et Josué l’attribue à Ruben avec Sibma et Tséreth-Haschachar."
    - "Elle ne resta pas israélite. Sur sa stèle d’environ 840 av. J.-C., Mescha, roi de Moab, dit avoir bâti Baal-Meon avec son réservoir, et Qiryaten. L’oracle de Jérémie sur Moab s’ouvre avec elle, « Malheur à Nebo, car elle est ravagée ! Kirjathaïm est confuse, elle est prise », et la nomme de nouveau avec Beth-Gamul et Beth-Méon ; Ézéchiel la compte parmi les villes frontières qui étaient « l’ornement du pays, Beth-Jeschimoth, Baal-Meon et Kirjathaïm ». La Bible synodale écrit Kiriathaïm dans la Loi et chez Ézéchiel, et Kariathaïm chez Jérémie. Eusèbe connaissait Kariatha comme un village entièrement chrétien, à dix milles à l’ouest de Médeba."
    - "L’emplacement n’est pas établi. Le nom semble survivre à Khirbet el-Qureiye, à quelque 10 km à l’ouest de Médeba, et à el-Qureiyat, à environ 20 km au sud-sud-ouest de celle-ci ; chacune a été prise pour la ville. D’autres placent Kirjathaïm à Khirbet el-Mukhayyat, sur le versant du mont Nebo, mieux connue comme la ville de Nebo, ou, plus rarement, à Tall Jalul, à l’est de Médeba, grand tertre de l’âge du Fer. Tous se trouvent à moins de 25 km les uns des autres dans le gouvernorat de Madaba, en Jordanie."
  it:
    - "Kiriataim, «le due città», era una città dell’altopiano moabita a est del Mar Morto, nel paese a nord dell’Arnon che Israele e Moab si contesero per secoli. È antica: nella guerra dei quattro re Chedorlaomer sbaragliò «gli Emei nella pianura di Kiriathaim», gli Emim essendo i giganti che Moab più tardi scacciò. Dopo la conquista del regno di Sicon «i figliuoli di Ruben edificarono Heshbon, Elealeh, Kiriathaim», e Giosuè l’assegna a Ruben con Sibma e Zeret-Saar."
    - "Non rimase israelita. Nella sua stele dell’840 a.C. circa Mesa, re di Moab, dice di aver costruito Baal-Meon con il suo serbatoio, e Qiryaten. L’oracolo di Geremia su Moab si apre con essa: «Guai a Nebo! poiché è devastata; Kiriathaim è coperta d’onta, è presa», e la nomina di nuovo con Bet-Gamul e Bet-Meon; Ezechiele la annovera tra le città di frontiera che erano «lo splendore del paese, Beth-Ieschimoth, Baal-meon e Kiriathaim». La Bibbia sinodale la scrive Kiriathaim nella Legge e in Ezechiele e Kariathaim in Geremia. Eusebio conosceva Kariatha come un villaggio interamente cristiano, a dieci miglia a ovest di Màdaba."
    - "Il sito non è definito. Il nome sembra sopravvivere a Khirbet el-Qureiye, circa 10 km a ovest di Màdaba, e a el-Qureiyat, circa 20 km a sud-sud-ovest di essa; ciascuna è stata ritenuta la città. Altri collocano Kiriataim a Khirbet el-Mukhayyat sul pendio del Monte Nebo, meglio nota come la città di Nebo, o, meno spesso, a Tall Jalul a est di Màdaba, un grande tell dell’età del Ferro. Tutte si trovano entro circa 25 km l’una dall’altra nel governatorato di Màdaba, in Giordania."
  pl:
    - "Kiriataim, „dwa miasta”, było miastem na płaskowyżu Moabu na wschód od Morza Martwego, w kraju na północ od Arnonu, o który Izrael i Moab spierali się przez wieki. Jest stare: w wojnie czterech królów Kedorlaomer pobił „Emimy w Sawie Karyjataim”, równinie Kiriataim, przy czym Emimowie byli olbrzymami, których Moab później wyparł. Po zdobyciu ziemi Sychona „Synowie też Rubenowi pobudowali Hesebon, i Eleale, i Karyjataim”, a Jozue przydziela je Rubenowi razem z Sibmą i Seret-Haszszachar."
    - "Nie pozostało izraelskie. Na swojej steli z około 840 r. p.n.e. Mesza, król Moabu, mówi, że zbudował Baal-Meon z jego zbiornikiem oraz Qiryaten. Wyrocznia Jeremiasza o Moabie zaczyna się od niego: „Biada miastu Nebo, bo spustoszone będzie; pohańbione i wzięte będzie Karyjataim”, i wymienia je znów z Bet-Gamul i Bet-Meon; Ezechiel zalicza je do miast granicznych: „Ja otworzę stronę Moabczyków od miast, od miast mówię ich, i od granic ich, ozdobę ziemi Betiesymot, Baalmeon, i Karyjataim”. Biblia synodalna pisze Kiriafaim w Prawie i u Ezechiela, a Kariafaim u Jeremiasza. Euzebiusz znał Kariatę jako wieś w całości chrześcijańską, dziesięć mil na zachód od Medeby."
    - "Położenie nie jest ustalone. Nazwa zdaje się przetrwać w Khirbet el-Qureiye, około 10 km na zachód od Medeby, i w el-Qureiyat, około 20 km na południowy zachód od niego; każde z nich uważano za to miasto. Inni umieszczają Kiriataim w Khirbet el-Mukhayyat na zboczu góry Nebo, lepiej znanym jako miasto Nebo, albo, rzadziej, w Tall Jalul na wschód od Medeby, wielkim kopcu z epoki żelaza. Wszystkie leżą w odległości około 25 km od siebie w muhafazie Madaba w Jordanii."
  nl:
    - "Kirjataïm, “de twee steden”, was een stad op het Moabitische plateau ten oosten van de Dode Zee, in het land ten noorden van de Arnon waarom Israël en Moab eeuwenlang streden. Ze is oud: in de oorlog van de vier koningen versloeg Kedorlaomer “de Emieten in Schave-Kiriathaim”, de vlakte van Kirjataïm, waarbij de Emieten de reuzen zijn die Moab later verdreef. Na de verovering van het land van Sihon bouwden “de kinderen van Ruben Hezbon, en Eleale, en Kirjathaim”, en Jozua wijst het met Sibma en Zereth-Sahar aan Ruben toe."
    - "Het bleef niet Israëlitisch. Op zijn stèle van omstreeks 840 v.Chr. zegt Mesa, koning van Moab, dat hij Baäl-Meon met zijn waterreservoir bouwde, en Qiryaten. Jeremia's godsspraak over Moab opent ermee: “Wee over Nebo, want zij is verstoord; Kirjathaim is beschaamd, zij is ingenomen”, en noemt het opnieuw met Beth-Gamul en Beth-Meon; Ezechiël rekent het tot de grensteden die waren “het sieraad des lands, Beth-Jesimoth, Baal-Meon, en tot Kiriathaim toe”. De Synodale Bijbel spelt het Kiriathaim in de Wet en Ezechiël en Kariathaim in Jeremia. Eusebius kende Kariatha als een geheel christelijk dorp, tien mijl ten westen van Medeba."
    - "De plaats is niet vastgesteld. De naam lijkt bewaard te zijn in Khirbet el-Qureiye, zo'n 10 km ten westen van Medeba, en in el-Qureiyat, ongeveer 20 km ten zuidzuidwesten daarvan; elk is voor de stad gehouden. Anderen plaatsen Kirjataïm bij Khirbet el-Mukhayyat op de helling van de berg Nebo, beter bekend als de stad Nebo, of, minder vaak, bij Tall Jalul ten oosten van Medeba, een grote heuvel uit de ijzertijd. Alle liggen binnen ongeveer 25 km van elkaar in het gouvernement Madaba in Jordanië."
  cs:
    - "Kirjatajim, „dvě města“, bylo město na moábské náhorní rovině východně od Mrtvého moře, v zemi severně od Arnonu, o kterou Izrael s Moábem po staletí sváděl spor. Je staré: ve válce čtyř králů Kedorlaomer pobil „Eminské na rovinách Kariataimských“, tedy na pláni Kirjatajimu, přičemž Emimové byli obři, které později Moáb vytlačil. Po dobytí země Sichonovy „synové pak Ruben vystavěli Ezebon, Eleale a Kariataim“ a Jozue je přiděluje Rúbenovi se Sibmou a Seret-šacharem."
    - "Izraelským nezůstal. Na své stéle z doby kolem roku 840 př. n. l. říká Meša, král Moábu, že vystavěl Báal-meón s jeho nádrží a Qiryaten. Jeremjášovo proroctví o Moábu jím začíná: „Běda městu Nébo, neboť popléněno bude; zahanbeno a vzato bude Kariataim“, a jmenuje je znovu s Bét-gamúlem a Bét-meónem; Ezechiel jmenuje mezi pohraničními městy „rozkošnou zemi Betjesimotských, Balmeonských i Kariataimských“. Synodální Bible píše jméno Kiriathaim v Zákoně a u Ezechiela a Kariathaim u Jeremjáše. Eusebius znal Kariathu jako vesnici zcela křesťanskou, deset mil západně od Medeby."
    - "Místo není určeno. Jméno se zdá přežívat v Khirbet el-Qureiye, asi 10 km západně od Medeby, a v el-Qureiyat, asi 20 km jihojihozápadně od ní; každé z nich bylo pokládáno za toto město. Jiní kladou Kirjatajim do Khirbet el-Mukhayyat na svahu hory Nebo, lépe známého jako město Nebo, nebo méně často do Tall Jalul východně od Medeby, velkého pahorku z doby železné. Všechna leží do vzdálenosti asi 25 km od sebe v guvernorátu Madaba v Jordánsku."
  sv:
    - "Kirjatajim, ”de två städerna”, var en stad på den moabitiska högplatån öster om Döda havet, i landet norr om Arnon som Israel och Moab tvistade om i århundraden. Den är gammal: i de fyra konungarnas krig slog Kedorlaomer ”eméerna i Save-Kirjataim”, Kirjatajims slätt, där eméerna var de jättar som Moab senare trängde undan. Efter erövringen av Sichons land heter det: ”Rubens barn byggde upp Hesbon, Eleale, Kirjataim”, och Josua tilldelar den åt Ruben med Sibma och Seret-Hashachar."
    - "Den förblev inte israelitisk. På sin stele från omkring 840 f.Kr. säger Mesha, Moabs konung, att han byggde Baal-Meon med dess reservoar, och Qiryaten. Jeremias utsaga om Moab inleds med den: ”Ve över Nebo, ty det är förstört! Kirjataim har kommit på skam och är intaget”, och nämner den åter med Bet-Gamul och Bet-Meon; Hesekiel räknar den bland de gränsstäder som var ”vad härligast är i landet, Bet-Hajesimot, Baal-Meon och Kirjatama”. Synodalbibeln stavar den Kiriathaim i Lagen och Hesekiel och Kariathaim i Jeremia. Eusebios kände Kariatha som en alltigenom kristen by, tio romerska mil väster om Medeba."
    - "Platsen är inte avgjord. Namnet tycks leva kvar vid Khirbet el-Qureiye, omkring 10 km väster om Medeba, och vid el-Qureiyat, omkring 20 km sydsydväst om den; var och en har hållits för staden. Andra förlägger Kirjatajim till Khirbet el-Mukhayyat på Nebos sluttning, bättre känt som staden Nebo, eller, mer sällan, till Tall Jalul öster om Medeba, en stor kulle från järnåldern. Alla ligger inom omkring 25 km från varandra i Madabas guvernement i Jordanien."
  nb:
    - "Kirjatajim, «de to byene», var en by på det moabittiske høylandet øst for Dødehavet, i landet nord for Arnon som Israel og Moab tvistet om i århundrer. Den er gammel: i krigen mellom de fire kongene slo Kedorlaomer «emittene i Sjave-Kirjata'im», Kirjatajim-sletten, der emittene var kjempene som Moab senere fortrengte. Etter erobringen av Sihon: «Og Rubens barn bygget op igjen Hesbon og El'ale og Kirjata'im», og Josva tildeler den til Ruben sammen med Sibma og Seret-Sjahar."
    - "Den ble ikke værende israelittisk. På sin stele fra omkring 840 f.Kr. sier Mesa, konge av Moab, at han bygde Baal-Meon med dens reservoar, og Qiryaten. Jeremias orakel mot Moab åpner med den: «Ve over Nebo, for det er ødelagt; Kirjata'im er blitt til skamme, det er inntatt», og nevner den igjen sammen med Bet-Gamul og Bet-Meon; Esekiel regner den blant grensebyene som var «den fagreste del av landet, Bet-Jesimot, Ba'al-Meon og like til Kirjata'im». Den russiske synodalbibelen skriver det Kiriathaim i Loven og hos Esekiel og Kariathaim hos Jeremia. Eusebius kjente Kariatha som en helt kristen landsby, ti romerske mil vest for Medeba."
    - "Stedet er ikke avgjort. Navnet synes å leve videre ved Khirbet el-Qureiye, omkring 10 km vest for Medeba, og ved el-Qureiyat, omkring 20 km sør-sørvest for den; begge er blitt regnet for byen. Andre plasserer Kirjatajim ved Khirbet el-Mukhayyat på skråningen av Nebo, bedre kjent som byen Nebo, eller, sjeldnere, ved Tall Jalul øst for Medeba, en stor jernaldershaug. Alle ligger innen omkring 25 km fra hverandre i Madaba-guvernementet i Jordan."
