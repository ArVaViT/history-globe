body:
  en:
    - "India appears in the Bible only as the eastern limit of the Persian empire in the book of Esther. Its opening describes Ahasuerus, “which reigned, from India even unto Ethiopia, over an hundred and seven and twenty provinces”, and Mordecai's decree in favour of the Jews was sent to the rulers of the provinces “from India unto Ethiopia”, to each in its own script and language. The Hebrew name, Hoddu, comes from the same Persian form, Hindush, as the Greek India, and means the land of the Indus river, not the whole subcontinent. The king is usually identified with Xerxes I (486–465 BC); the Synodal Bible, following the Greek, calls him Artaxerxes."
    - "Darius I added the Indus lands to the empire about 518 BC, and they appear as Hindush in the lists of peoples carved in his inscriptions at Persepolis and Naqsh-i Rustam. Herodotus says the Indians paid the largest tribute of all, three hundred and sixty talents of gold dust a year, and that Indian troops marched with Xerxes against Greece. The region is today the Indus valley of Pakistan, with neighbouring north-western India."
    - "Alexander the Great followed the Persians into these lands. Arrian dates his victory over the Indian king Porus on the river Hydaspes to the spring of 326 BC; further east, at the Hyphasis, Alexander set up twelve great altars and turned back. Early Christian writers also linked India with the apostles. The Acts of Thomas, an apocryphal romance preserved in Syriac and Greek, tell that India fell by lot to the apostle Thomas and that he went there with a merchant sent by King Gundaphorus, a real ruler of part of India in the first century AD whose coins bear his name. Eusebius gives Thomas Parthia instead, and reports that Pantaenus of Alexandria, in the reign of Commodus, preached as far as India and was said to have found there the Gospel of Matthew in Hebrew, left by the apostle Bartholomew."
  ru:
    - "Индия в Библии появляется только как восточный предел Персидской державы в книге Есфири. Её начало описывает Артаксеркса, который «царствовал над ста двадцатью семью областями от Индии и до Ефиопии», а указ Мардохея в пользу Иудеев был послан правителям областей «от Индии до Ефиопии», каждой её письменами и на её языке. Еврейское имя, Ходду, восходит к той же персидской форме Хиндуш, что и греческое «Индия», и означает землю реки Инд, а не весь субконтинент. Царя обычно отождествляют с Ксерксом I (486–465 гг. до н. э.); Синодальный перевод вслед за греческим зовёт его Артаксерксом."
    - "Дарий I присоединил земли по Инду к державе около 518 г. до н. э., и они значатся как Хиндуш в списках народов, высеченных в его надписях в Персеполе и Накш-и-Рустаме. Геродот пишет, что индийцы платили самую большую дань из всех — триста шестьдесят талантов золотого песка в год — и что индийские воины шли с Ксерксом на Грецию. Сегодня это долина Инда в Пакистане и соседние северо-западные земли Индии."
    - "Вслед за персами в эти земли пришёл Александр Македонский. Арриан относит его победу над индийским царём Пором на реке Гидасп к весне 326 г. до н. э.; восточнее, на Гифасисе, Александр поставил двенадцать огромных алтарей и повернул назад. Ранние христианские писатели связывали Индию и с апостолами. «Деяния Фомы», апокрифическая повесть, сохранившаяся на сирийском и греческом языках, рассказывают, что Индия досталась по жребию апостолу Фоме и что он отправился туда с купцом, посланным царём Гундафором, — действительным правителем части Индии в I в. н. э., чьё имя стоит на его монетах. Евсевий же отдаёт Фоме Парфию и сообщает, что Пантен Александрийский при Коммоде проповедовал вплоть до Индии и, как говорят, нашёл там Евангелие от Матфея на еврейском языке, оставленное апостолом Варфоломеем."
  uk:
    - "Індія з’являється в Біблії лише як східна межа перської імперії в Книзі Естер. Її початок описує Ахашвероша, що «царював над сто двайцятьма сьома країнами від Индиї до Етиопиї», а указ Мардохея на користь юдеїв було надіслано правителям країн «від Индиї до Етиопиї», кожному його письмом і його мовою. Давньоєврейська назва, Годду, походить від тієї самої перської форми, Хіндуш, що й грецька Індія, і означає землю ріки Інд, а не весь субконтинент. Царя зазвичай ототожнюють із Ксерксом I (486–465 до н. е.); Синодальна Біблія, слідуючи грецькому текстові, називає його Артаксерксом."
    - "Дарій I приєднав землі Інду до імперії близько 518 р. до н. е., і вони з’являються як Хіндуш у переліках народів, вирізьблених на його написах у Персеполі та Накше-Рустамі. Геродот каже, що індійці платили найбільшу данину з усіх, триста шістдесят талантів золотого піску на рік, і що індійські війська йшли з Ксерксом проти Еллади. Цей край нині — долина Інду в Пакистані з сусідньою північно-західною Індією."
    - "Слідом за персами в ці землі прийшов Александр Великий. Арріан відносить його перемогу над індійським царем Пором на річці Гідасп до весни 326 р. до н. е.; далі на схід, на Гіфасісі, Александр поставив дванадцять величезних вівтарів і повернув назад. Ранні християнські письменники пов’язували Індію і з апостолами. «Діяння Хоми», апокрифічна повість, збережена сирійською та грецькою мовами, розповідають, що Індія випала за жеребом апостолові Хомі і що він вирушив туди з купцем, якого послав цар Гундафор, справжній володар частини Індії в I ст. н. е., чиє ім’я стоїть на його монетах. Євсевій натомість віддає Хомі Парфію і повідомляє, що Пантен Александрійський за Коммода проповідував аж до Індії і, як кажуть, знайшов там Євангеліє від Матвія єврейською мовою, залишене апостолом Варфоломієм."
  es:
    - "India aparece en la Biblia solo como el límite oriental del imperio persa en el libro de Ester. Su comienzo describe a Asuero, «que reinó desde la India hasta la Etiopía sobre ciento veinte y siete provincias», y el decreto de Mardoqueo en favor de los judíos fue enviado a los gobernantes de las provincias «desde la India hasta la Ethiopía», a cada una en su propia escritura y lengua. El nombre hebreo, Hoddu, procede de la misma forma persa, Hindush, que el griego India, y significa la tierra del río Indo, no todo el subcontinente. El rey suele identificarse con Jerjes I (486–465 a. C.); la Biblia sinodal, siguiendo el griego, lo llama Artajerjes."
    - "Darío I añadió las tierras del Indo al imperio hacia el 518 a. C., y figuran como Hindush en las listas de pueblos esculpidas en sus inscripciones de Persépolis y Naqsh-i Rustam. Heródoto dice que los indios pagaban el mayor tributo de todos, trescientos sesenta talentos de polvo de oro al año, y que tropas indias marcharon con Jerjes contra Grecia. La región es hoy el valle del Indo, en Pakistán, con el vecino noroeste de la India."
    - "Alejandro Magno siguió a los persas en estas tierras. Arriano fecha su victoria sobre el rey indio Poro junto al río Hidaspes en la primavera del 326 a. C.; más al este, en el Hífasis, Alejandro levantó doce grandes altares y se volvió. Los primeros escritores cristianos relacionaron también la India con los apóstoles. Los Hechos de Tomás, una novela apócrifa conservada en siríaco y en griego, cuentan que la India tocó en suerte al apóstol Tomás y que este fue allí con un mercader enviado por el rey Gundaforo, un gobernante real de parte de la India en el siglo I d. C. cuyas monedas llevan su nombre. Eusebio, en cambio, asigna Partia a Tomás, y refiere que Panteno de Alejandría, en el reinado de Cómodo, predicó hasta la India y que, según se decía, encontró allí el Evangelio de Mateo en hebreo, dejado por el apóstol Bartolomé."
  pt:
    - "A Índia aparece na Bíblia apenas como o limite oriental do império persa no livro de Ester. A abertura descreve Assuero, “que reinou desde a Índia até a Etiópia, sobre cento e vinte e sete províncias”, e o decreto de Mardoqueu em favor dos judeus foi enviado aos governantes das províncias “da Índia até a Etiópia”, a cada uma em sua própria escrita e língua. O nome hebraico, Hoddu, vem da mesma forma persa, Hindush, que o grego India, e significa a terra do rio Indo, não todo o subcontinente. O rei é usualmente identificado com Xerxes I (486–465 a.C.); a Bíblia Sinodal, seguindo o grego, chama-o Artaxerxes."
    - "Dario I acrescentou as terras do Indo ao império por volta de 518 a.C., e elas aparecem como Hindush nas listas de povos gravadas em suas inscrições em Persépolis e Naqsh-i Rustam. Heródoto diz que os indianos pagavam o maior tributo de todos, trezentos e sessenta talentos de pó de ouro por ano, e que tropas indianas marcharam com Xerxes contra a Grécia. A região é hoje o vale do Indo, no Paquistão, com o noroeste vizinho da Índia."
    - "Alexandre Magno seguiu os persas nessas terras. Arriano data a sua vitória sobre o rei indiano Poro junto ao rio Hidaspes na primavera de 326 a.C.; mais a leste, no Hífasis, Alexandre ergueu doze grandes altares e voltou atrás. Os primeiros escritores cristãos também ligaram a Índia aos apóstolos. Os Atos de Tomé, um romance apócrifo conservado em siríaco e em grego, contam que a Índia coube por sorte ao apóstolo Tomé e que ele foi para lá com um mercador enviado pelo rei Gundaforo, um governante real de parte da Índia no século I d.C., cujas moedas trazem o seu nome. Eusébio, em vez disso, atribui a Pártia a Tomé e relata que Panteno de Alexandria, no reinado de Cômodo, pregou até a Índia e que, segundo se dizia, encontrou ali o Evangelho de Mateus em hebraico, deixado pelo apóstolo Bartolomeu."
  de:
    - "Indien erscheint in der Bibel nur als östliche Grenze des persischen Reichs im Buch Ester. Zu Beginn wird Ahasveros beschrieben, „der da König war von Indien bis an Mohrenland über hundert und siebenundzwanzig Länder“, und Mordechais Erlass zugunsten der Juden erging an die Herrscher der Provinzen „in den Landen von Indien bis an das Mohrenland“, an jedes „nach seiner Schrift“ und „nach seiner Sprache“. Der hebräische Name, Hodu, stammt von derselben persischen Form, Hindush, wie das griechische India, und bedeutet das Land des Indus, nicht den ganzen Subkontinent. Der König wird meist mit Xerxes I. (486–465 v. Chr.) gleichgesetzt; die Synodalübersetzung nennt ihn nach dem Griechischen Artaxerxes."
    - "Darius I. fügte die Indusländer um 518 v. Chr. dem Reich hinzu, und sie erscheinen als Hindush in den Völkerlisten seiner Inschriften in Persepolis und Naqsch-e Rostam. Herodot sagt, die Inder hätten den größten Tribut von allen gezahlt, dreihundertsechzig Talente Goldstaub im Jahr, und indische Truppen seien mit Xerxes gegen Griechenland gezogen. Die Gegend ist heute das Industal Pakistans mit dem benachbarten Nordwestindien."
    - "Alexander der Große folgte den Persern in diese Länder. Arrian datiert seinen Sieg über den indischen König Poros am Fluss Hydaspes in das Frühjahr 326 v. Chr.; weiter östlich, am Hyphasis, errichtete Alexander zwölf gewaltige Altäre und kehrte um. Frühe christliche Schriftsteller verbanden Indien auch mit den Aposteln. Die Thomasakten, ein syrisch und griechisch erhaltener apokrypher Roman, erzählen, Indien sei durch das Los dem Apostel Thomas zugefallen und er sei mit einem Kaufmann dorthin gezogen, den König Gundaphorus gesandt hatte, ein realer Herrscher über einen Teil Indiens im 1. Jahrhundert n. Chr., dessen Münzen seinen Namen tragen. Eusebius dagegen weist Thomas Parthien zu und berichtet, Pantänus von Alexandria habe unter Commodus bis nach Indien gepredigt und dort angeblich das Matthäusevangelium auf Hebräisch gefunden, das der Apostel Bartholomäus hinterlassen habe."
  fr:
    - "L’Inde n’apparaît dans la Bible que comme la limite orientale de l’empire perse dans le livre d’Esther. Son ouverture décrit Assuérus, « qui régnait depuis l’Inde jusqu’en Éthiopie sur cent vingt-sept provinces », et le décret de Mardochée en faveur des Juifs fut envoyé aux chefs des provinces « de l’Inde à l’Éthiopie », à chacune selon son écriture et sa langue. Le nom hébreu, Hoddu, vient de la même forme perse, Hindush, que le grec India, et désigne le pays du fleuve Indus, non l’ensemble du sous-continent. Le roi est d’ordinaire identifié à Xerxès Ier (486–465 av. J.-C.) ; la Bible synodale, suivant le grec, l’appelle Artaxerxès."
    - "Darius Ier ajouta les terres de l’Indus à l’empire vers 518 av. J.-C., et elles figurent sous le nom de Hindush dans les listes de peuples gravées dans ses inscriptions à Persépolis et à Naqsh-e Rostam. Hérodote dit que les Indiens payaient le plus lourd tribut de tous, trois cent soixante talents de poudre d’or par an, et que des troupes indiennes marchèrent avec Xerxès contre la Grèce. La région est aujourd’hui la vallée de l’Indus, au Pakistan, avec le nord-ouest voisin de l’Inde."
    - "Alexandre le Grand suivit les Perses dans ces contrées. Arrien date sa victoire sur le roi indien Poros, au bord de l’Hydaspe, du printemps 326 av. J.-C. ; plus à l’est, sur l’Hyphase, Alexandre éleva douze grands autels et fit demi-tour. Les premiers écrivains chrétiens rattachèrent aussi l’Inde aux apôtres. Les Actes de Thomas, roman apocryphe conservé en syriaque et en grec, racontent que l’Inde échut par le sort à l’apôtre Thomas et qu’il s’y rendit avec un marchand envoyé par le roi Gundaphore, souverain réel d’une partie de l’Inde au Ier siècle apr. J.-C., dont les monnaies portent le nom. Eusèbe attribue au contraire la Parthie à Thomas, et rapporte que Pantène d’Alexandrie, sous le règne de Commode, prêcha jusqu’en Inde et y aurait trouvé l’Évangile de Matthieu en hébreu, laissé par l’apôtre Barthélemy."
  pl:
    - "Indie pojawiają się w Biblii tylko jako wschodni kraniec imperium perskiego w Księdze Estery. Jej początek opisuje Aswerusa, który królował od Indii aż do Kuszu, czyli Etiopii, nad stu dwudziestoma siedmioma krainami, a dekret Mardocheusza na rzecz Żydów wysłano do władców prowincji od Indii aż do Etiopii, do każdej jej pismem i językiem. Hebrajska nazwa, Hoddu, pochodzi od tej samej perskiej formy, Hindusz, co greckie India, i oznacza kraj rzeki Indus, nie cały subkontynent. Króla utożsamia się zwykle z Kserksesem I (486–465 p.n.e.); Biblia synodalna, idąc za greckim, nazywa go Artakserksesem."
    - "Dariusz I przyłączył ziemie Indusu do imperium około 518 r. p.n.e. i występują one jako Hindusz w wykazach ludów wykutych w jego napisach w Persepolis i Nakszi Rustam. Herodot mówi, że Hindusi płacili największą daninę ze wszystkich, trzysta sześćdziesiąt talentów złotego pyłu rocznie, i że wojska indyjskie maszerowały z Kserksesem przeciw Grecji. Region to dziś dolina Indusu w Pakistanie z sąsiednimi północno-zachodnimi Indiami."
    - "Za Persami w te ziemie przyszedł Aleksander Wielki. Arrian datuje jego zwycięstwo nad indyjskim królem Porosem nad rzeką Hydaspes na wiosnę 326 r. p.n.e.; dalej na wschód, nad Hyfasis, Aleksander wzniósł dwanaście wielkich ołtarzy i zawrócił. Wcześni pisarze chrześcijańscy łączyli Indie także z apostołami. Dzieje Tomasza, apokryficzny romans zachowany po syryjsku i po grecku, opowiadają, że Indie przypadły losem apostołowi Tomaszowi i że udał się tam z kupcem wysłanym przez króla Gundafora, rzeczywistego władcę części Indii w I wieku n.e., którego monety noszą jego imię. Euzebiusz natomiast przydziela Tomaszowi Partię i podaje, że Pantenos z Aleksandrii za Kommodusa nauczał aż po Indie i podobno znalazł tam Ewangelię Mateusza po hebrajsku, pozostawioną przez apostoła Bartłomieja."
  it:
    - "L’India compare nella Bibbia solo come limite orientale dell’impero persiano nel libro di Ester. L’inizio descrive Assuero, «che regnava dall’India sino all’Etiopia sopra centoventisette province», e il decreto di Mardocheo a favore dei Giudei fu inviato ai capi delle province «dall’India all’Etiopia», a ciascuna nella sua scrittura e lingua. Il nome ebraico, Hoddu, deriva dalla stessa forma persiana, Hindush, del greco India, e significa la terra del fiume Indo, non l’intero subcontinente. Il re è di solito identificato con Serse I (486–465 a.C.); la Bibbia sinodale, seguendo il greco, lo chiama Artaserse."
    - "Dario I aggiunse le terre dell’Indo all’impero verso il 518 a.C., ed esse compaiono come Hindush negli elenchi di popoli scolpiti nelle sue iscrizioni a Persepoli e a Naqsh-i Rustam. Erodoto dice che gli Indiani pagavano il tributo più grande di tutti, trecentosessanta talenti di polvere d’oro all’anno, e che truppe indiane marciarono con Serse contro la Grecia. La regione è oggi la valle dell’Indo del Pakistan, con la vicina India nord-occidentale."
    - "Alessandro Magno seguì i Persiani in queste terre. Arriano data la sua vittoria sul re indiano Poro presso il fiume Idaspe alla primavera del 326 a.C.; più a est, sull’Ifasi, Alessandro innalzò dodici grandi altari e tornò indietro. I primi scrittori cristiani collegarono l’India anche agli apostoli. Gli Atti di Tommaso, un romanzo apocrifo conservato in siriaco e in greco, narrano che l’India toccò in sorte all’apostolo Tommaso e che egli vi andò con un mercante mandato dal re Gundaforo, un sovrano realmente esistito di parte dell’India nel I secolo d.C., le cui monete ne portano il nome. Eusebio assegna invece a Tommaso la Partia, e riferisce che Panteno di Alessandria, sotto Commodo, predicò fino all’India e vi avrebbe trovato il Vangelo di Matteo in ebraico, lasciato dall’apostolo Bartolomeo."
  nl:
    - "Indië komt in de Bijbel alleen voor als de oostgrens van het Perzische rijk in het boek Ester. De opening beschrijft Ahasveros, “dewelke regeerde van Indië af tot aan Morenland toe, honderd zeven en twintig landschappen”, en Mordechai’s besluit ten gunste van de Joden werd gezonden aan de bestuurders van de landschappen “die van Indië af tot aan Morenland strekken”, aan elk in zijn eigen schrift en taal. De Hebreeuwse naam, Hoddu, komt van dezelfde Perzische vorm, Hindush, als het Griekse India, en betekent het land van de Indus, niet het hele subcontinent. De koning wordt gewoonlijk vereenzelvigd met Xerxes I (486–465 v.Chr.); de Synodale Bijbel, het Grieks volgend, noemt hem Artaxerxes."
    - "Darius I voegde de Indusgebieden omstreeks 518 v.Chr. aan het rijk toe, en ze verschijnen als Hindush in de lijsten van volken die in zijn opschriften te Persepolis en Naqsh-i Rustam zijn uitgebeiteld. Herodotos zegt dat de Indiërs de grootste schatting van allen betaalden, driehonderdzestig talenten goudstof per jaar, en dat Indiase troepen met Xerxes tegen Griekenland optrokken. De streek is nu de Indusvallei van Pakistan, met het aangrenzende noordwestelijke India."
    - "Alexander de Grote volgde de Perzen in deze landen. Arrianus dateert zijn overwinning op de Indische koning Porus aan de rivier de Hydaspes in het voorjaar van 326 v.Chr.; verder naar het oosten, aan de Hyphasis, richtte Alexander twaalf grote altaren op en keerde terug. Vroege christelijke schrijvers verbonden India ook met de apostelen. De Handelingen van Thomas, een in het Syrisch en Grieks bewaarde apocriefe roman, vertellen dat India bij loting aan de apostel Thomas toeviel en dat hij erheen ging met een koopman die koning Gundaforus had gezonden, een werkelijke heerser over een deel van India in de eerste eeuw n.Chr. wiens munten zijn naam dragen. Eusebius geeft Thomas daarentegen Parthië, en meldt dat Pantaenus van Alexandrië onder Commodus tot in India predikte en daar naar verluidt het Evangelie van Matteüs in het Hebreeuws vond, achtergelaten door de apostel Bartolomeüs."
  cs:
    - "Indie se v Bibli objevuje jen jako východní hranice perské říše v knize Ester. Její začátek popisuje Achašveroše, „jenž kraloval od Indie až k Mouřenínské zemi nad sto dvadcíti a sedmi krajinami“, a Mordokajův výnos ve prospěch Židů byl poslán správcům provincií, „kteréž jsou od Indie až do země Mouřenínské“, každé jejím písmem a jazykem. Hebrejské jméno, Hodu, pochází ze stejné perské podoby, Hindúš, jako řecké India, a znamená zemi řeky Indu, nikoli celý poloostrov. Král se obvykle ztotožňuje s Xerxem I. (486–465 př. n. l.); synodální Bible podle řečtiny jej nazývá Artaxerxem."
    - "Dareios I. připojil indské země k říši kolem roku 518 př. n. l. a objevují se jako Hindúš v seznamech národů vytesaných v jeho nápisech v Persepoli a Naqš-e Rostam. Hérodotos praví, že Indové platili největší tribut ze všech, tři sta šedesát talentů zlatého prachu ročně, a že indická vojska táhla s Xerxem proti Řecku. Oblast je dnes údolí Indu v Pákistánu se sousední severozápadní Indií."
    - "Za Peršany přišel do těchto zemí Alexandr Veliký. Arriános klade jeho vítězství nad indickým králem Pórem u řeky Hydaspés do jara roku 326 př. n. l.; dále na východ, u řeky Hyfasis, postavil Alexandr dvanáct velkých oltářů a obrátil se zpět. Raní křesťanští spisovatelé spojovali Indii také s apoštoly. Skutky Tomášovy, apokryfní román dochovaný syrsky a řecky, vyprávějí, že Indie připadla losem apoštolu Tomášovi a že se tam vydal s kupcem, kterého poslal král Gundafor, skutečný vládce části Indie v 1. století n. l., jehož mince nesou jeho jméno. Eusebios naproti tomu přiděluje Tomášovi Parthii a uvádí, že Pantainos Alexandrijský za vlády Commoda kázal až v Indii a prý tam našel Matoušovo evangelium v hebrejštině, které tam zanechal apoštol Bartoloměj."
  sv:
    - "Indien förekommer i Bibeln bara som det persiska rikets östra gräns i Esters bok. Dess inledning beskriver Ahasveros, ”den Ahasveros' som regerade från Indien ända till Etiopien, över ett hundra tjugusju hövdingdömen”, och Mordokajs påbud till judarnas förmån sändes till hövdingdömenas styresmän ”från Indien ända till Etiopien”, till vart och ett med dess egen skrift och tungomål. Det hebreiska namnet, Hoddu, kommer av samma persiska form, Hindush, som det grekiska Indien, och betyder landet vid floden Indus, inte hela subkontinenten. Kungen identifieras vanligen med Xerxes I (486–465 f.Kr.); den ryska synodalbibeln, som följer grekiskan, kallar honom Artaxerxes."
    - "Dareios I lade Indusländerna till riket omkring 518 f.Kr., och de förekommer som Hindush i förteckningarna över folk huggna i hans inskrifter i Persepolis och Naqsh-i Rustam. Herodotos säger att indierna betalade den största tributen av alla, trehundrasextio talenter guldstoft om året, och att indiska trupper marscherade med Xerxes mot Grekland. Regionen är i dag Indusdalen i Pakistan med angränsande nordvästra Indien."
    - "Alexander den store följde perserna in i dessa länder. Arrianos daterar hans seger över den indiske kungen Poros vid floden Hydaspes till våren 326 f.Kr.; längre österut, vid Hyfasis, reste Alexander tolv väldiga altaren och vände om. Tidiga kristna författare förknippade också Indien med apostlarna. Thomasakterna, en apokryfisk roman bevarad på syriska och grekiska, berättar att Indien genom lottning tillföll aposteln Tomas och att han reste dit med en köpman som kung Gundaforos sänt, en verklig härskare över en del av Indien under första århundradet e.Kr., vars mynt bär hans namn. Eusebios tilldelar i stället Tomas Parthien och berättar att Pantainos från Alexandria under Commodus predikade ända till Indien och där enligt uppgift fann Matteusevangeliet på hebreiska, lämnat av aposteln Bartolomeus."
  nb:
    - "India forekommer i Bibelen bare som den østlige grensen for det persiske riket i Esters bok. Åpningen beskriver Ahasverus, «den Ahasverus som regjerte fra India like til Etiopia over hundre og syv og tyve landskaper», og Mordekais dekret til fordel for jødene ble sendt til landskapenes herskere «fra India like til Etiopia», til hvert i dets egen skrift og språk. Det hebraiske navnet, Hoddu, kommer av den samme persiske formen, Hindush, som det greske India, og betyr landet ved elven Indus, ikke hele subkontinentet. Kongen identifiseres vanligvis med Xerxes 1. (486–465 f.Kr.); den synodale bibelen, som følger den greske teksten, kaller ham Artaxerxes."
    - "Dareios 1. la Indus-landene til riket omkring 518 f.Kr., og de forekommer som Hindush i listene over folk hugget i hans innskrifter i Persepolis og Naqsh-e Rustam. Herodot sier at inderne betalte den største tributten av alle, tre hundre og seksti talenter gullstøv i året, og at indiske tropper marsjerte med Xerxes mot Hellas. Området er i dag Indus-dalen i Pakistan, med det nærliggende nordvestlige India."
    - "Aleksander den store fulgte perserne inn i disse landene. Arrian daterer hans seier over den indiske kongen Poros ved elven Hydaspes til våren 326 f.Kr.; lenger øst, ved Hyfasis, reiste Aleksander tolv veldige altere og vendte om. Tidlige kristne forfattere knyttet også India til apostlene. Tomasaktene, en apokryf roman bevart på syrisk og gresk, forteller at India ved loddtrekning tilfalt apostelen Tomas, og at han reiste dit med en kjøpmann sendt av kong Gundaforos, en virkelig hersker over en del av India i første århundre e.Kr., hvis mynter bærer hans navn. Eusebios gir i stedet Tomas Partia og forteller at Pantainos fra Alexandria under Commodus forkynte helt til India og etter sigende fant Matteusevangeliet på hebraisk der, etterlatt av apostelen Bartolomeus."
  tl:
    - "Lumilitaw ang India sa Biblia bilang silangang hangganan lamang ng imperyong Persa sa aklat ni Esther. Inilalarawan sa pagbubukas nito si Assuero, “na naghari, mula sa India hanggang sa Etiopia, sa isang daan at dalawang pu't pitong lalawigan”, at ang utos ni Mardocheo na pabor sa mga Judio ay ipinadala sa mga pinuno ng mga lalawigan “mula sa India hanggang sa Etiopia”, sa bawat isa ayon sa sarili nitong sulat at wika. Ang pangalang Hebreo, Hoddu, ay mula sa gayunding anyong Persa, Hindush, gaya ng Griyegong India, at nangangahulugang lupain ng ilog Indus, hindi ang buong subkontinente. Karaniwang itinutugma ang hari kay Xerxes I (486–465 BK); tinatawag siya ng Bibliyang Synodal, na sumusunod sa Griyego, na Artajerjes."
    - "Idinagdag ni Dario I ang mga lupain ng Indus sa imperyo noong mga 518 BK, at lumilitaw ang mga ito bilang Hindush sa mga talaan ng mga bayan na nakaukit sa kaniyang mga inskripsiyon sa Persepolis at Naqsh-i Rustam. Sinasabi ni Herodoto na ang mga Indiyano ang nagbayad ng pinakamalaking buwis sa lahat, tatlong daan at animnapung talentong alabok ng ginto bawat taon, at na ang mga tropang Indiyano ay nagmartsa kasama ni Xerxes laban sa Grecia. Ang rehiyon ay ang libis ng Indus ng Pakistan ngayon, kasama ang karatig na hilagang-kanlurang India."
    - "Sinundan ni Alejandro Magno ang mga Persiano sa mga lupaing ito. Itinakda ni Arriano ang tagumpay niya laban sa haring Indiyanong si Poro sa ilog Hydaspes sa tagsibol ng 326 BK; sa silangan, sa Hyphasis, nagtayo si Alejandro ng labindalawang malalaking dambana at bumalik. Iniugnay rin ng mga unang manunulat na Kristiyano ang India sa mga apostol. Ayon sa Mga Gawa ni Tomas, apokripong salaysay sa Siriako at Griyego, napunta sa apostol na si Tomas ang India sa palabunutan at nagtungo siya roon kasama ang isang mangangalakal na sinugo ni Haring Gundaphorus, tunay na pinuno ng bahagi ng India noong unang siglo AD, na nasa mga barya ang pangalan. Ibinibigay naman ni Eusebio kay Tomas ang Partia, at iniuulat na si Pantaenus ng Alejandria, sa paghahari ni Commodo, ay nangaral hanggang India at sinasabing nakita roon ang Ebanghelyo ni Mateo sa Hebreo, na iniwan ng apostol na si Bartolome."
  da:
    - "Indien optræder i Bibelen kun som det persiske riges østlige grænse i Esters Bog. Dens åbning beskriver Ahasverus, »som regerede fra Indien og indtil Morland over hundrede og syv og tyve Landskaber«, og Mordokajs dekret til fordel for jøderne blev sendt til landskabernes herskere »fra Indien og indtil Morland«, til hvert i dets egen skrift og sprog. Det hebraiske navn, Hoddu, kommer af den samme persiske form, Hindush, som det græske Indien, og betyder landet ved floden Indus, ikke hele subkontinentet. Kongen identificeres sædvanligvis med Xerxes I (486–465 f.Kr.); den russiske synodalbibel, der følger det græske, kalder ham Artaxerxes."
    - "Darius I lagde Indus-landene til riget omkring 518 f.Kr., og de optræder som Hindush i listerne over folk i hans indskrifter ved Persepolis og Naqsh-i Rustam. Herodot siger, at inderne betalte den største tribut af alle, tre hundrede og tres talenter guldstøv om året, og at indiske tropper marcherede med Xerxes mod Grækenland. Egnen er i dag Industalen i Pakistan med det tilstødende nordvestlige Indien."
    - "Alexander den Store fulgte perserne ind i disse lande. Arrian daterer hans sejr over den indiske konge Poros ved floden Hydaspes til foråret 326 f.Kr.; længere mod øst, ved Hyfasis, rejste Alexander tolv vældige altre og vendte om. Tidlige kristne forfattere forbandt også Indien med apostlene. Thomasakterne, en apokryf roman bevaret på syrisk og græsk, fortæller, at Indien ved lodtrækning tilfaldt apostlen Thomas, og at han drog derhen med en købmand sendt af kong Gundaforos, en virkelig hersker over en del af Indien i første århundrede e.Kr., hvis mønter bærer hans navn. Eusebios giver i stedet Thomas Parthien og beretter, at Pantainos fra Alexandria under Commodus prædikede helt til Indien og efter sigende fandt Matthæusevangeliet på hebraisk dér, efterladt af apostlen Bartholomæus."
  sr:
    - "Индија се у Библији јавља само као источна граница персијског царства у Књизи о Јестири. Њен почетак описује Асвира, који „цароваше од Индије до Етиопије у сто и двадесет и седам земаља“, а Мардохејев указ у корист Јевреја послат је владарима покрајина „од Индије до Етиопије“, свакој њеним писмом и језиком. Хебрејско име, Ходу, потиче из истог персијског облика, Хиндуш, као и грчко Индија, и значи земљу реке Инд, не цео потконтинент. Цар се обично поистовећује с Ксерксом I (486–465. п. н. е.); руски синодски превод, следећи грчки, назива га Артаксеркс."
    - "Дарије I придодао је земље Инда царству око 518. п. н. е., и оне се јављају као Хиндуш на списковима народа уклесаним у његовим натписима у Персепољу и Накш-и Рустаму. Херодот каже да су Индијци плаћали највећи данак од свих, триста шездесет таланата златног праха годишње, и да су индијске чете марширале са Ксерксом на Грчку. Област је данас долина Инда у Пакистану са суседном северозападном Индијом."
    - "За Персијанцима је у ове земље дошао Александар Велики. Аријан ставља његову победу над индијским краљем Пором на реци Хидасп у пролеће 326. п. н. е.; даље на исток, на Хифасису, Александар је подигао дванаест великих олтара и вратио се. Рани хришћански писци повезивали су Индију и са апостолима. Дела Томина, апокрифни роман сачуван на сиријском и грчком, причају да је Индија жребом припала апостолу Томи и да је он отишао тамо с трговцем којег је послао краљ Гундафор, стварни владар дела Индије у 1. веку н. е., чији новац носи његово име. Јевсевије, напротив, Томи додељује Партију и бележи да је Пантен Александријски, за владе Комода, проповедао све до Индије и тамо, како се причало, нашао Матејево јеванђеље на хебрејском, које је оставио апостол Вартоломеј."
  hu:
    - "India a Bibliában csak a perzsa birodalom keleti határaként szerepel az Eszter könyvében. Ennek nyitánya leírja Ahasvérust, „a ki uralkodott Indiától fogva Szerecsenországig százhuszonhét tartományon”, és Mordokeus zsidók melletti rendelete a tartományok fejeinek ment „Indiától fogva Szerecsenországig”, mindegyiknek a saját írásával és nyelvén. A héber név, Hoddu, ugyanabból a perzsa alakból, Hindusból származik, mint a görög India, és az Indus folyó földjét jelenti, nem az egész szubkontinenst. A királyt rendszerint I. Xerxésszel (Kr. e. 486–465) azonosítják; a szinodális Biblia, a görögöt követve, Artaxerxésznek nevezi."
    - "I. Dárius Kr. e. 518 körül csatolta a birodalomhoz az Indus-vidéket, és ez Hindus néven szerepel a perszepoliszi és naqs-e rosztami feliratain kivésett népjegyzékekben. Hérodotosz szerint az indiaiak fizették a legnagyobb adót mindenki közül, évi háromszázhatvan talentum aranyport, és hogy indiai csapatok vonultak Xerxésszel Görögország ellen. A vidék ma Pakisztán Indus-völgye, a szomszédos északnyugat-indiai területtel."
    - "Nagy Alexandrosz a perzsák nyomában jutott el ezekre a földekre. Arrianosz Pórosz indiai király felett a Hüdaszpész folyónál aratott győzelmét Kr. e. 326 tavaszára teszi; keletebbre, a Hüphaszisznál Alexandrosz tizenkét hatalmas oltárt emelt, és visszafordult. A korai keresztény írók Indiát az apostolokkal is kapcsolatba hozták. A Tamás cselekedetei, egy szír és görög nyelven fennmaradt apokrif regény, elbeszéli, hogy India sorshúzással Tamás apostolnak jutott, és hogy egy kereskedővel ment oda, akit Gundaphorosz király küldött; ez a király valóban uralkodott India egy részén a Kr. u. 1. században, és érmei az ő nevét viselik. Eusebios ezzel szemben Pártiát adja Tamásnak, és beszámol arról, hogy az alexandriai Pantainosz Commodus uralkodása alatt egészen Indiáig hirdette az igét, és ott állítólag megtalálta Máté evangéliumát héberül, amelyet Bertalan apostol hagyott ott."
  fi:
    - "Intia esiintyy Raamatussa vain Persian valtakunnan itärajana Esterin kirjassa. Sen alku kuvaa Ahasverosta, ”joka hallitsi Intiasta Etiopiaan saakka, sataa kahtakymmentä seitsemää maakuntaa”, ja Mordokain juutalaisten hyväksi antama määräys lähetettiin maakuntien hallitsijoille ”Intiasta Etiopiaan”, kullekin sen omalla kirjoituksella ja kielellä. Heprealainen nimi, Hoddu, tulee samasta persialaisesta muodosta, Hindush, kuin kreikan India, ja merkitsee Indus-joen maata, ei koko niemimaata. Kuningas tunnistetaan yleensä Kserkses I:ksi (486–465 eaa.); synodaalinen Raamattu, kreikkalaista seuraten, kutsuu häntä Artahsastaksi."
    - "Dareios I liitti Indus-maat valtakuntaan noin vuonna 518 eaa., ja ne esiintyvät nimellä Hindush kansaluetteloissa, jotka on hakattu hänen kirjoituksiinsa Persepoliksessa ja Naqsh-i Rustamissa. Herodotos sanoo, että intialaiset maksoivat suurimman veron kaikista, kolmesataa kuusikymmentä talenttia kultahiekkaa vuodessa, ja että intialaisia joukkoja marssi Kserkseen mukana Kreikkaa vastaan. Alue on nykyään Pakistanin Induksen laakso ja naapurimaa Luoteis-Intia."
    - "Aleksanteri Suuri seurasi persialaisia näille maille. Arrianos ajoittaa hänen voittonsa intialaisesta kuninkaasta Poroksesta Hydaspes-joella kevääseen 326 eaa.; idempänä, Hyfasis-joella, Aleksanteri pystytti kaksitoista valtavaa alttaria ja kääntyi takaisin. Varhaiset kristityt kirjoittajat liittivät Intian myös apostoleihin. Tuomaan teot, syyriaksi ja kreikaksi säilynyt apokryfinen romaani, kertoo, että Intia lankesi arvalla apostoli Tuomaalle ja että hän lähti sinne kuningas Gundaforoksen lähettämän kauppiaan kanssa; Gundaforos oli todellinen osan Intiaa hallitsija ensimmäisellä vuosisadalla jaa., ja hänen rahoissaan on hänen nimensä. Eusebios taas antaa Tuomaalle Parthian ja kertoo, että Pantainos Aleksandriasta julisti Commoduksen aikana aina Intiaan saakka ja löysi sieltä kertoman mukaan Matteuksen evankeliumin hepreaksi, apostoli Bartolomeuksen jättämänä."
  vi:
    - "Ấn Độ xuất hiện trong Kinh Thánh chỉ như giới hạn phía đông của đế quốc Phe-rơ-sơ trong sách Ê-xơ-tê. Phần mở đầu mô tả A-suê-ru, người “cai trị trên một trăm hai mươi bảy tỉnh, từ Ấn-độ cho đến Ê-thi-ô-bi”, và chiếu chỉ của Mạc-đô-chê có lợi cho người Do Thái được gửi cho các quan cai các tỉnh “từ Ấn-độ cho đến Ê-thi-ô-bi”, mỗi nơi theo chữ và ngôn ngữ riêng. Tên Hê-bơ-rơ, Hoddu, đến từ cùng dạng Phe-rơ-sơ, Hindush, như India của Hy Lạp, và nghĩa là xứ của sông Ấn, không phải cả tiểu lục địa. Nhà vua thường được đồng nhất với Xerxes I (486–465 TCN); bản Synodal, theo bản Hy Lạp, gọi là Ạt-ta-xét-xe."
    - "Đa-ri-út I thêm các vùng đất sông Ấn vào đế quốc khoảng năm 518 TCN, và chúng xuất hiện dưới tên Hindush trong các bảng dân tộc khắc trong văn bia của ông ở Persepolis và Naqsh-i Rustam. Herodotus nói người Ấn nộp cống lớn nhất trong tất cả, ba trăm sáu mươi ta-lâng bột vàng mỗi năm, và rằng quân Ấn hành quân cùng Xerxes chống Hy Lạp. Vùng này ngày nay là thung lũng sông Ấn của Pakistan, cùng tây bắc Ấn Độ lân cận."
    - "A-léc-xan-đơ Đại đế theo chân người Ba Tư vào những vùng đất này. Arrianus định niên đại chiến thắng của ông trước vua Ấn Porus bên sông Hydaspes vào mùa xuân năm 326 TCN; xa hơn về phía đông, tại sông Hyphasis, A-léc-xan-đơ dựng mười hai bàn thờ lớn rồi quay về. Các tác giả Cơ Đốc thời đầu cũng gắn Ấn Độ với các sứ đồ. Công vụ Thô-ma, một truyện ngụy kinh còn lưu bằng tiếng Sy-ri và tiếng Hy Lạp, kể rằng khi bắt thăm, Ấn Độ rơi vào phần sứ đồ Thô-ma, và ông đến đó cùng một thương gia do vua Gundaphorus sai đến, một vị vua có thật cai trị một phần Ấn Độ vào thế kỷ 1 CN, có tên trên tiền xu của mình. Còn Eusebius thì giao Bạt-thê cho Thô-ma, và thuật rằng Pantaenus thành A-léc-xan-đơ-ri, dưới triều Commodus, đã giảng đạo đến tận Ấn Độ và nghe nói đã tìm thấy ở đó Phúc Âm Ma-thi-ơ bằng tiếng Hê-bơ-rơ do sứ đồ Ba-thê-lê-my để lại."
  ro:
    - "India apare în Biblie doar ca limită estică a imperiului persan în Cartea Esterei. Începutul ei îl descrie pe Ahașveroș, care „stăpâneà dela India o sută douăzeci și șapte de țări”, iar decretul lui Mardoheu în favoarea iudeilor a fost trimis conducătorilor provinciilor „dela India până la Etiopia”, fiecăreia în scrierea și limba ei. Numele ebraic, Hodu, vine din aceeași formă persană, Hindush, ca grecescul India, și înseamnă țara râului Indus, nu întregul subcontinent. Regele este identificat de obicei cu Xerxes I (486–465 î.Hr.); Biblia sinodală, urmând greaca, îl numește Artaxerxe."
    - "Darius I a adăugat ținuturile Indusului imperiului în jurul anului 518 î.Hr., iar ele apar ca Hindush în listele de popoare săpate în inscripțiile sale de la Persepolis și Naqsh-i Rustam. Herodot spune că indienii plăteau cel mai mare tribut dintre toți, trei sute șaizeci de talanți de praf de aur pe an, și că trupe indiene au mărșăluit cu Xerxes împotriva Greciei. Regiunea este astăzi valea Indusului din Pakistan, cu nord-vestul învecinat al Indiei."
    - "Alexandru cel Mare a pășit pe urmele perșilor în aceste ținuturi. Arrian datează victoria lui asupra regelui indian Porus, la râul Hydaspes, în primăvara anului 326 î.Hr.; mai la răsărit, la Hyphasis, Alexandru a ridicat douăsprezece altare mari și s-a întors. Primii scriitori creștini au legat India și de apostoli. Faptele lui Toma, un roman apocrif păstrat în siriacă și greacă, povestesc că India i-a căzut prin sorț apostolului Toma și că acesta a plecat acolo cu un negustor trimis de regele Gundaphorus, un stăpânitor real al unei părți din India în secolul I d.Hr., ale cărui monede îi poartă numele. Eusebiu îi dă în schimb lui Toma Parția și relatează că Pantenus din Alexandria, în domnia lui Commodus, a propovăduit până în India și ar fi găsit acolo Evanghelia după Matei în ebraică, lăsată de apostolul Bartolomeu."
  bg:
    - "Индия се появява в Библията само като източната граница на Персийската империя в книгата Естир. Началото ѝ описва Асуир, „който царуваше от Индия дори до Етиопия върху сто и двадесет и седем области“, а указът на Мардохей в полза на юдеите беше изпратен до управителите на областите, „които бяха от Индия до Етиопия“, до всяка с нейното писмо и език. Еврейското име, Ходу, идва от същата персийска форма, Хиндуш, както гръцкото Индия, и означава земята на река Инд, а не целия субконтинент. Царят обикновено се отъждествява с Ксеркс I (486–465 г. пр.н.е.); Синодалната Библия, следвайки гръцкия текст, го нарича Артаксеркс."
    - "Дарий I присъедини земите на Инд към империята около 518 г. пр.н.е. и те се появяват като Хиндуш в списъците на народите, издълбани в надписите му в Персеполис и Накш-и Рустам. Херодот казва, че индийците плащали най-големия данък от всички — триста и шестдесет таланта златен пясък годишно, и че индийски войски тръгнали с Ксеркс срещу Гърция. Областта днес е долината на Инд в Пакистан заедно със съседна Северозападна Индия."
    - "След персите в тези земи дошъл Александър Велики. Ариан отнася победата му над индийския цар Пор при река Хидасп към пролетта на 326 г. пр.н.е.; по-на изток, при Хифасис, Александър издигнал дванадесет огромни олтара и се върнал. Ранните християнски писатели също свързвали Индия с апостолите. Деянията на Тома, апокрифен роман, запазен на сирийски и гръцки, разказват, че Индия се паднала по жребий на апостол Тома и че той заминал там с търговец, изпратен от цар Гундафор, действителен владетел на част от Индия през I в., чиито монети носят името му. Евсевий пък дава на Тома Партия и съобщава, че Пантен Александрийски при Комод проповядвал чак до Индия и, както се говорело, намерил там Евангелието от Матей на еврейски, оставено от апостол Вартоломей."
