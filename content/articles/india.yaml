body:
  en:
    - "India appears in the Bible only as the eastern limit of the Persian empire in the book of Esther. Its opening describes Ahasuerus, “which reigned, from India even unto Ethiopia, over an hundred and seven and twenty provinces”, and Mordecai's decree in favour of the Jews was sent to the rulers of the provinces “from India unto Ethiopia”, to each in its own script and language. The Hebrew name, Hoddu, comes from the same Persian form, Hindush, as the Greek India, and means the land of the Indus river, not the whole subcontinent. The king is usually identified with Xerxes I (486–465 BC); the Synodal Bible, following the Greek, calls him Artaxerxes."
    - "Darius I added the Indus lands to the empire about 518 BC, and they appear as Hindush in the lists of peoples carved in his inscriptions at Persepolis and Naqsh-i Rustam. Herodotus says the Indians paid the largest tribute of all, three hundred and sixty talents of gold dust a year, and that Indian troops marched with Xerxes against Greece. The region is today the Indus valley of Pakistan, with neighbouring north-western India."
  ru:
    - "Индия в Библии появляется только как восточный предел Персидской державы в книге Есфири. Её начало описывает Артаксеркса, который «царствовал над ста двадцатью семью областями от Индии и до Ефиопии», а указ Мардохея в пользу Иудеев был послан правителям областей «от Индии до Ефиопии», каждой её письменами и на её языке. Еврейское имя, Ходду, восходит к той же персидской форме Хиндуш, что и греческое «Индия», и означает землю реки Инд, а не весь субконтинент. Царя обычно отождествляют с Ксерксом I (486–465 гг. до н. э.); Синодальный перевод вслед за греческим зовёт его Артаксерксом."
    - "Дарий I присоединил земли по Инду к державе около 518 г. до н. э., и они значатся как Хиндуш в списках народов, высеченных в его надписях в Персеполе и Накш-и-Рустаме. Геродот пишет, что индийцы платили самую большую дань из всех — триста шестьдесят талантов золотого песка в год — и что индийские воины шли с Ксерксом на Грецию. Сегодня это долина Инда в Пакистане и соседние северо-западные земли Индии."
  uk:
    - "Індія з’являється в Біблії лише як східна межа перської імперії в Книзі Естер. Її початок описує Ахашвероша, що «царював над сто двайцятьма сьома країнами від Индиї до Етиопиї», а указ Мардохея на користь юдеїв було надіслано правителям країн «від Индиї до Етиопиї», кожному його письмом і його мовою. Давньоєврейська назва, Годду, походить від тієї самої перської форми, Хіндуш, що й грецька Індія, і означає землю ріки Інд, а не весь субконтинент. Царя зазвичай ототожнюють із Ксерксом I (486–465 до н. е.); Синодальна Біблія, слідуючи грецькому текстові, називає його Артаксерксом."
    - "Дарій I приєднав землі Інду до імперії близько 518 р. до н. е., і вони з’являються як Хіндуш у переліках народів, вирізьблених на його написах у Персеполі та Накше-Рустамі. Геродот каже, що індійці платили найбільшу данину з усіх, триста шістдесят талантів золотого піску на рік, і що індійські війська йшли з Ксерксом проти Еллади. Цей край нині — долина Інду в Пакистані з сусідньою північно-західною Індією."
  es:
    - "India aparece en la Biblia solo como el límite oriental del imperio persa en el libro de Ester. Su comienzo describe a Asuero, «que reinó desde la India hasta la Etiopía sobre ciento veinte y siete provincias», y el decreto de Mardoqueo en favor de los judíos fue enviado a los gobernantes de las provincias «desde la India hasta la Ethiopía», a cada una en su propia escritura y lengua. El nombre hebreo, Hoddu, procede de la misma forma persa, Hindush, que el griego India, y significa la tierra del río Indo, no todo el subcontinente. El rey suele identificarse con Jerjes I (486–465 a. C.); la Biblia sinodal, siguiendo el griego, lo llama Artajerjes."
    - "Darío I añadió las tierras del Indo al imperio hacia el 518 a. C., y figuran como Hindush en las listas de pueblos esculpidas en sus inscripciones de Persépolis y Naqsh-i Rustam. Heródoto dice que los indios pagaban el mayor tributo de todos, trescientos sesenta talentos de polvo de oro al año, y que tropas indias marcharon con Jerjes contra Grecia. La región es hoy el valle del Indo, en Pakistán, con el vecino noroeste de la India."
  pt:
    - "A Índia aparece na Bíblia apenas como o limite oriental do império persa no livro de Ester. A abertura descreve Assuero, “que reinou desde a Índia até a Etiópia, sobre cento e vinte e sete províncias”, e o decreto de Mardoqueu em favor dos judeus foi enviado aos governantes das províncias “da Índia até a Etiópia”, a cada uma em sua própria escrita e língua. O nome hebraico, Hoddu, vem da mesma forma persa, Hindush, que o grego India, e significa a terra do rio Indo, não todo o subcontinente. O rei é usualmente identificado com Xerxes I (486–465 a.C.); a Bíblia Sinodal, seguindo o grego, chama-o Artaxerxes."
    - "Dario I acrescentou as terras do Indo ao império por volta de 518 a.C., e elas aparecem como Hindush nas listas de povos gravadas em suas inscrições em Persépolis e Naqsh-i Rustam. Heródoto diz que os indianos pagavam o maior tributo de todos, trezentos e sessenta talentos de pó de ouro por ano, e que tropas indianas marcharam com Xerxes contra a Grécia. A região é hoje o vale do Indo, no Paquistão, com o noroeste vizinho da Índia."
  de:
    - "Indien erscheint in der Bibel nur als östliche Grenze des persischen Reichs im Buch Ester. Zu Beginn wird Ahasveros beschrieben, „der da König war von Indien bis an Mohrenland über hundert und siebenundzwanzig Länder“, und Mordechais Erlass zugunsten der Juden erging an die Herrscher der Provinzen „in den Landen von Indien bis an das Mohrenland“, an jedes „nach seiner Schrift“ und „nach seiner Sprache“. Der hebräische Name, Hodu, stammt von derselben persischen Form, Hindush, wie das griechische India, und bedeutet das Land des Indus, nicht den ganzen Subkontinent. Der König wird meist mit Xerxes I. (486–465 v. Chr.) gleichgesetzt; die Synodalübersetzung nennt ihn nach dem Griechischen Artaxerxes."
    - "Darius I. fügte die Indusländer um 518 v. Chr. dem Reich hinzu, und sie erscheinen als Hindush in den Völkerlisten seiner Inschriften in Persepolis und Naqsch-e Rostam. Herodot sagt, die Inder hätten den größten Tribut von allen gezahlt, dreihundertsechzig Talente Goldstaub im Jahr, und indische Truppen seien mit Xerxes gegen Griechenland gezogen. Die Gegend ist heute das Industal Pakistans mit dem benachbarten Nordwestindien."
  fr:
    - "L’Inde n’apparaît dans la Bible que comme la limite orientale de l’empire perse dans le livre d’Esther. Son ouverture décrit Assuérus, « qui régnait depuis l’Inde jusqu’en Éthiopie sur cent vingt-sept provinces », et le décret de Mardochée en faveur des Juifs fut envoyé aux chefs des provinces « de l’Inde à l’Éthiopie », à chacune selon son écriture et sa langue. Le nom hébreu, Hoddu, vient de la même forme perse, Hindush, que le grec India, et désigne le pays du fleuve Indus, non l’ensemble du sous-continent. Le roi est d’ordinaire identifié à Xerxès Ier (486–465 av. J.-C.) ; la Bible synodale, suivant le grec, l’appelle Artaxerxès."
    - "Darius Ier ajouta les terres de l’Indus à l’empire vers 518 av. J.-C., et elles figurent sous le nom de Hindush dans les listes de peuples gravées dans ses inscriptions à Persépolis et à Naqsh-e Rostam. Hérodote dit que les Indiens payaient le plus lourd tribut de tous, trois cent soixante talents de poudre d’or par an, et que des troupes indiennes marchèrent avec Xerxès contre la Grèce. La région est aujourd’hui la vallée de l’Indus, au Pakistan, avec le nord-ouest voisin de l’Inde."
  pl:
    - "Indie pojawiają się w Biblii tylko jako wschodni kraniec imperium perskiego w Księdze Estery. Jej początek opisuje Aswerusa, który królował od Indii aż do Kuszu, czyli Etiopii, nad stu dwudziestoma siedmioma krainami, a dekret Mardocheusza na rzecz Żydów wysłano do władców prowincji od Indii aż do Etiopii, do każdej jej pismem i językiem. Hebrajska nazwa, Hoddu, pochodzi od tej samej perskiej formy, Hindusz, co greckie India, i oznacza kraj rzeki Indus, nie cały subkontynent. Króla utożsamia się zwykle z Kserksesem I (486–465 p.n.e.); Biblia synodalna, idąc za greckim, nazywa go Artakserksesem."
    - "Dariusz I przyłączył ziemie Indusu do imperium około 518 r. p.n.e. i występują one jako Hindusz w wykazach ludów wykutych w jego napisach w Persepolis i Nakszi Rustam. Herodot mówi, że Hindusi płacili największą daninę ze wszystkich, trzysta sześćdziesiąt talentów złotego pyłu rocznie, i że wojska indyjskie maszerowały z Kserksesem przeciw Grecji. Region to dziś dolina Indusu w Pakistanie z sąsiednimi północno-zachodnimi Indiami."
  it:
    - "L’India compare nella Bibbia solo come limite orientale dell’impero persiano nel libro di Ester. L’inizio descrive Assuero, «che regnava dall’India sino all’Etiopia sopra centoventisette province», e il decreto di Mardocheo a favore dei Giudei fu inviato ai capi delle province «dall’India all’Etiopia», a ciascuna nella sua scrittura e lingua. Il nome ebraico, Hoddu, deriva dalla stessa forma persiana, Hindush, del greco India, e significa la terra del fiume Indo, non l’intero subcontinente. Il re è di solito identificato con Serse I (486–465 a.C.); la Bibbia sinodale, seguendo il greco, lo chiama Artaserse."
    - "Dario I aggiunse le terre dell’Indo all’impero verso il 518 a.C., ed esse compaiono come Hindush negli elenchi di popoli scolpiti nelle sue iscrizioni a Persepoli e a Naqsh-i Rustam. Erodoto dice che gli Indiani pagavano il tributo più grande di tutti, trecentosessanta talenti di polvere d’oro all’anno, e che truppe indiane marciarono con Serse contro la Grecia. La regione è oggi la valle dell’Indo del Pakistan, con la vicina India nord-occidentale."
  nl:
    - "Indië komt in de Bijbel alleen voor als de oostgrens van het Perzische rijk in het boek Ester. De opening beschrijft Ahasveros, “dewelke regeerde van Indië af tot aan Morenland toe, honderd zeven en twintig landschappen”, en Mordechai’s besluit ten gunste van de Joden werd gezonden aan de bestuurders van de landschappen “die van Indië af tot aan Morenland strekken”, aan elk in zijn eigen schrift en taal. De Hebreeuwse naam, Hoddu, komt van dezelfde Perzische vorm, Hindush, als het Griekse India, en betekent het land van de Indus, niet het hele subcontinent. De koning wordt gewoonlijk vereenzelvigd met Xerxes I (486–465 v.Chr.); de Synodale Bijbel, het Grieks volgend, noemt hem Artaxerxes."
    - "Darius I voegde de Indusgebieden omstreeks 518 v.Chr. aan het rijk toe, en ze verschijnen als Hindush in de lijsten van volken die in zijn opschriften te Persepolis en Naqsh-i Rustam zijn uitgebeiteld. Herodotos zegt dat de Indiërs de grootste schatting van allen betaalden, driehonderdzestig talenten goudstof per jaar, en dat Indiase troepen met Xerxes tegen Griekenland optrokken. De streek is nu de Indusvallei van Pakistan, met het aangrenzende noordwestelijke India."
  cs:
    - "Indie se v Bibli objevuje jen jako východní hranice perské říše v knize Ester. Její začátek popisuje Achašveroše, „jenž kraloval od Indie až k Mouřenínské zemi nad sto dvadcíti a sedmi krajinami“, a Mordokajův výnos ve prospěch Židů byl poslán správcům provincií, „kteréž jsou od Indie až do země Mouřenínské“, každé jejím písmem a jazykem. Hebrejské jméno, Hodu, pochází ze stejné perské podoby, Hindúš, jako řecké India, a znamená zemi řeky Indu, nikoli celý poloostrov. Král se obvykle ztotožňuje s Xerxem I. (486–465 př. n. l.); synodální Bible podle řečtiny jej nazývá Artaxerxem."
    - "Dareios I. připojil indské země k říši kolem roku 518 př. n. l. a objevují se jako Hindúš v seznamech národů vytesaných v jeho nápisech v Persepoli a Naqš-e Rostam. Hérodotos praví, že Indové platili největší tribut ze všech, tři sta šedesát talentů zlatého prachu ročně, a že indická vojska táhla s Xerxem proti Řecku. Oblast je dnes údolí Indu v Pákistánu se sousední severozápadní Indií."
  sv:
    - "Indien förekommer i Bibeln bara som det persiska rikets östra gräns i Esters bok. Dess inledning beskriver Ahasveros, ”den Ahasveros' som regerade från Indien ända till Etiopien, över ett hundra tjugusju hövdingdömen”, och Mordokajs påbud till judarnas förmån sändes till hövdingdömenas styresmän ”från Indien ända till Etiopien”, till vart och ett med dess egen skrift och tungomål. Det hebreiska namnet, Hoddu, kommer av samma persiska form, Hindush, som det grekiska Indien, och betyder landet vid floden Indus, inte hela subkontinenten. Kungen identifieras vanligen med Xerxes I (486–465 f.Kr.); den ryska synodalbibeln, som följer grekiskan, kallar honom Artaxerxes."
    - "Dareios I lade Indusländerna till riket omkring 518 f.Kr., och de förekommer som Hindush i förteckningarna över folk huggna i hans inskrifter i Persepolis och Naqsh-i Rustam. Herodotos säger att indierna betalade den största tributen av alla, trehundrasextio talenter guldstoft om året, och att indiska trupper marscherade med Xerxes mot Grekland. Regionen är i dag Indusdalen i Pakistan med angränsande nordvästra Indien."
