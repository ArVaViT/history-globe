# Overview article (ADR 0007). Mainstream facts only; the garden is unlocated within Jerusalem and the article says so.
id: uzza
place: adfab55
title:
  en: "Garden of Uzza"
  ru: "Сад Уззы"
  uk: "Сад Узза"
  es: "Huerto de Uza"
  pt: "Jardim de Uzá"
  de: "Garten Usas"
  fr: "Jardin d’Uzza"
  pl: "Ogród Uzzy"
  it: "Giardino di Uzza"
  nl: "Hof van Uzza"
  cs: "Zahrada Uzova"
  sv: "Ussas trädgård"
  nb: "Ussas have"
  tl: "Hardin ng Uzza"
  da: "Uzzas Have"
  sr: "Врт Узин"
  hu: "Uzza kertje"
  fi: "Ussan puutarha"
  vi: "Vườn U-xa"
  ro: "Grădina lui Uza"
  bg: "Градината на Уза"
body:
  en:
    - "The garden of Uzza was the burial place of two kings of Judah. Manasseh, after fifty-five years on the throne, “was buried in the garden of his own house, in the garden of Uzza”, and his son Amon, murdered by his servants after two years, “was buried in his sepulchre in the garden of Uzza”. Chronicles says only that Manasseh was buried “in his own house”. Most of the kings before them had been laid in the tombs of the kings in the City of David, so the garden marks a change in royal burial, whatever its cause: the old tombs may have been full, or the palace may have moved."
    - "Where the garden was, and who Uzza was, nobody knows. The name was presumably that of an earlier owner; that it recalls King Uzziah, or the Uzzah who died touching the ark, has been guessed but cannot be shown. If the garden lay beside the palace it was somewhere on the eastern hill of Jerusalem, perhaps on the slope toward the Kidron, where “the king's garden” by the pool of Siloam is named at the fall of the city and in Nehemiah; but that is inference. No tomb that can be called Manasseh's or Amon's has been found, and the map sets the garden in Jerusalem without a closer site."
  ru:
    - "Сад Уззы — место погребения двух царей Иудеи. Манассия после пятидесяти пяти лет царствования «погребен в саду при доме его, в саду Уззы», а его сына Аммона, убитого слугами через два года, «похоронили… в гробнице его, в саду Уззы». Паралипоменон говорит лишь, что Манассию «похоронили его в доме его». Большинство царей до них клали в гробницах царей в городе Давидовом, так что сад означает перемену в царском погребении, какова бы ни была её причина: старые гробницы могли заполниться, или дворец мог переехать."
    - "Где был сад и кто такой Узза, никто не знает. Имя, видимо, принадлежало прежнему владельцу; догадки, что оно напоминает о царе Озии или об Озе, умершем, когда он коснулся ковчега, доказать нельзя. Если сад лежал при дворце, он был где-то на восточном холме Иерусалима, может быть, на склоне к Кедрону, где при падении города и у Неемии назван «царский сад» у водоёма Силоам; но это лишь вывод. Гробницы, которую можно было бы назвать гробницей Манассии или Аммона, не найдено, и карта помещает сад в Иерусалиме без более точного места."
  uk:
    - "Сад Узза був місцем поховання двох царів Юди. Про Манасію, який царював п’ятдесят п’ять років, сказано: «поховано його при домі його в саду Уззи», а про його сина Амона, вбитого слугами через два роки, — «поховали його в гробовищі його в саду Уззи». Хроніки кажуть лише, що Манасію поховали «в його домі». Більшість царів до них лягали в гробницях царів у Місті Давида, тож сад позначає зміну в царському похованні, хоч би яка була її причина: давні гробниці могли бути заповнені, або палац міг переїхати."
    - "Де був сад і хто такий Узза, не знає ніхто. Ім’я, ймовірно, належало попередньому власникові; що воно пригадує царя Уззію чи Узу, який помер, торкнувшись ковчега, вгадували, але показати не можна. Якщо сад лежав біля палацу, то він був десь на східному пагорбі Єрусалима, можливо, на схилі до Кедрону, де «царський сад» біля ставка Сілоаму названий при падінні міста й у Неемії; але це висновок. Жодної гробниці, яку можна було б назвати Манасіїною чи Амоновою, не знайдено, і мапа позначає сад в Єрусалимі без ближчого місця."
  es:
    - "El huerto de Uza fue el lugar de sepultura de dos reyes de Judá. Manasés, tras cincuenta y cinco años en el trono, «fué sepultado en el huerto de su casa, en el huerto de Uzza», y su hijo Amón, asesinado por sus siervos tras dos años, «fué sepultado en su sepulcro en el huerto de Uzza». Crónicas dice solo que Manasés fue sepultado «en su casa». La mayoría de los reyes anteriores habían sido depositados en las tumbas de los reyes en la Ciudad de David, de modo que el huerto señala un cambio en la sepultura real, sea cual sea su causa: las tumbas antiguas pueden haberse llenado, o el palacio puede haberse trasladado."
    - "Dónde estaba el huerto, y quién era Uza, nadie lo sabe. El nombre era presumiblemente el de un propietario anterior; que recuerde al rey Uzías, o al Uza que murió al tocar el arca, se ha conjeturado pero no puede demostrarse. Si el huerto estaba junto al palacio, se hallaba en algún lugar de la colina oriental de Jerusalén, quizá en la ladera hacia el Cedrón, donde «la huerta del rey» junto al estanque de Siloé se nombra en la caída de la ciudad y en Nehemías; pero eso es deducción. No se ha hallado ninguna tumba que pueda llamarse de Manasés o de Amón, y el mapa sitúa el huerto en Jerusalén sin un emplazamiento más preciso."
  pt:
    - "O jardim de Uzá foi o lugar de sepultamento de dois reis de Judá. Manassés, depois de cinquenta e cinco anos no trono, “foi sepultado no jardim de sua própria casa, no jardim de Uzá”, e seu filho Amom, assassinado por seus servos após dois anos, “foi sepultado em seu túmulo no jardim de Uzá”. Crônicas diz apenas que Manassés foi sepultado “em sua própria casa”. A maioria dos reis anteriores fora posta nos túmulos dos reis na Cidade de Davi, de modo que o jardim marca uma mudança no sepultamento real, qualquer que fosse a causa: os túmulos antigos podiam estar cheios, ou o palácio podia ter mudado de lugar."
    - "Onde ficava o jardim e quem era Uzá ninguém sabe. O nome presumivelmente era o de um dono anterior; que lembre o rei Uzias, ou o Uzá que morreu ao tocar a arca, já se conjeturou, mas não se pode demonstrar. Se o jardim ficava junto ao palácio, estava em algum ponto da colina oriental de Jerusalém, talvez na encosta para o Cedrom, onde “o jardim do rei”, junto ao tanque de Siloé, é nomeado na queda da cidade e em Neemias; mas isso é inferência. Nenhum túmulo que se possa chamar de Manassés ou de Amom foi achado, e o mapa situa o jardim em Jerusalém sem sítio mais preciso."
  de:
    - "Der Garten Usas war die Grabstätte zweier Könige von Juda. Manasse „ward begraben im Garten an seinem Hause, im Garten Usas“, nach fünfundfünfzig Jahren auf dem Thron, und sein Sohn Amon, nach zwei Jahren von seinen Knechten ermordet, wurde bestattet: „man begrub ihn in seinem Grabe im Garten Usas“. Die Chronik sagt nur, Manasse sei „in seinem Hause“ begraben worden. Die meisten Könige vor ihnen waren in den Königsgräbern in der Davidsstadt beigesetzt worden, der Garten bezeichnet also einen Wandel der königlichen Bestattung, welche Ursache er auch hatte: Die alten Gräber mögen voll gewesen sein, oder der Palast war umgezogen."
    - "Wo der Garten lag und wer Usa war, weiß niemand. Der Name war vermutlich der eines früheren Besitzers; dass er an König Usija oder an den Usa erinnert, der beim Berühren der Lade starb, wurde vermutet, lässt sich aber nicht zeigen. Lag der Garten neben dem Palast, dann irgendwo auf dem Osthügel Jerusalems, vielleicht am Hang zum Kidron, wo „des Königs Garten“ beim Fall der Stadt und bei Nehemia „bei dem Garten des Königs“ am Teich Siloah genannt wird; das ist aber Schlussfolgerung. Kein Grab, das Manasse oder Amon zugeschrieben werden könnte, ist gefunden worden, und die Karte setzt den Garten ohne genauere Stelle nach Jerusalem."
  fr:
    - "Le jardin d’Uzza fut le lieu de sépulture de deux rois de Juda. Manassé, après cinquante-cinq ans de règne, « fut enterré dans le jardin de sa maison, dans le jardin d’Uzza », et son fils Amon, assassiné par ses serviteurs après deux ans, « fut enterré dans son sépulcre, dans le jardin d’Uzza ». Les Chroniques disent seulement que Manassé fut enterré « dans sa maison ». La plupart des rois avant eux avaient été déposés dans les tombes des rois de la Cité de David ; le jardin marque donc un changement dans les sépultures royales, quelle qu’en soit la cause : les anciennes tombes étaient peut-être pleines, ou le palais avait peut-être été déplacé."
    - "Où était le jardin, et qui était Uzza, nul ne le sait. Le nom était sans doute celui d’un propriétaire antérieur ; on a supposé qu’il rappelle le roi Ozias, ou l’Uzza mort pour avoir touché l’arche, mais on ne peut le montrer. Si le jardin touchait au palais, il se trouvait quelque part sur la colline orientale de Jérusalem, peut-être sur la pente vers le Cédron, où « le jardin du roi » près du bassin de Siloé est nommé lors de la chute de la ville et chez Néhémie ; mais c’est une déduction. Aucune tombe qu’on puisse dire de Manassé ou d’Amon n’a été retrouvée, et la carte place le jardin à Jérusalem sans site plus précis."
  pl:
    - "Ogród Uzzy był miejscem pochówku dwóch królów Judy. Manasses, po pięćdziesięciu pięciu latach panowania, „pogrzebiony jest w ogrodzie domu swego, w ogrodzie Ozy”, a jego syn Amon, zamordowany przez sługi po dwóch latach, „pochowano go w grobie jego w ogrodzie Ozy”. Księgi Kronik mówią tylko, że Manasses został pochowany „w domu jego”. Większość królów przed nimi złożono w grobach królewskich w Mieście Dawida, więc ogród oznacza zmianę w pochówku królewskim, bez względu na jej przyczynę: dawne groby mogły być pełne albo pałac mógł się przenieść."
    - "Gdzie był ogród i kim był Uzza, nikt nie wie. Nazwa należała zapewne do wcześniejszego właściciela; zgadywano, że przypomina króla Uzzjasza albo Uzzę, który zmarł, dotknąwszy arki, ale nie da się tego wykazać. Jeśli ogród leżał obok pałacu, był gdzieś na wschodnim wzgórzu Jerozolimy, być może na stoku ku Cedronowi, gdzie ogród królewski przy sadzawce Siloe jest wymieniony przy upadku miasta i u Nehemiasza; ale to wniosek. Nie znaleziono żadnego grobowca, który można by nazwać grobem Manassesa lub Amona, a mapa umieszcza ogród w Jerozolimie bez dokładniejszego miejsca."
  it:
    - "Il giardino di Uzza fu il luogo di sepoltura di due re di Giuda. Manasse, dopo cinquantacinque anni di regno, «fu sepolto nel giardino della sua casa, nel giardino di Uzza», e suo figlio Amon, ucciso dai suoi servi dopo due anni, «fu sepolto nel suo sepolcro, nel giardino di Uzza». Le Cronache dicono solo che Manasse «fu sepolto in casa sua». La maggior parte dei re precedenti era stata deposta nelle tombe dei re nella Città di Davide, per cui il giardino segna un cambiamento nella sepoltura reale, quale che ne fosse la causa: le vecchie tombe possono essere state piene, o il palazzo può essersi spostato."
    - "Dove fosse il giardino, e chi fosse Uzza, nessuno lo sa. Il nome era presumibilmente quello di un precedente proprietario; che ricordi il re Ozia, o l’Uzza morto toccando l’arca, è stato ipotizzato ma non si può dimostrare. Se il giardino sorgeva accanto al palazzo, stava da qualche parte sulla collina orientale di Gerusalemme, forse sul pendio verso il Cedron, dove il «giardino del re» presso la vasca di Siloe è nominato alla caduta della città e in Neemia; ma è una deduzione. Non è stata trovata alcuna tomba che si possa dire di Manasse o di Amon, e la mappa pone il giardino a Gerusalemme senza un sito più preciso."
  nl:
    - "De hof van Uzza was de begraafplaats van twee koningen van Juda. Manasse, na vijfenvijftig jaar op de troon, “werd begraven in den hof van zijn huis, in den hof van Uzza”, en zijn zoon Amon, na twee jaar door zijn dienaren vermoord, werd begraven: “men begroef hem in zijn graf, in den hof van Uzza”. Kronieken zegt alleen dat Manasse werd begraven “in zijn huis”. De meeste koningen vóór hen waren in de koningsgraven in de Stad van David gelegd, dus de hof markeert een verandering in de koninklijke begrafenis, wat de oorzaak ook was: de oude graven kunnen vol zijn geweest, of het paleis kan zijn verhuisd."
    - "Waar de hof was en wie Uzza was, weet niemand. De naam was vermoedelijk die van een eerdere eigenaar; dat hij aan koning Uzzia herinnert, of aan de Uzza die stierf toen hij de ark aanraakte, is geopperd maar kan niet worden aangetoond. Als de hof naast het paleis lag, was het ergens op de oostelijke heuvel van Jeruzalem, misschien op de helling naar het Kidron, waar “des konings hof” bij de vijver van Siloam wordt genoemd bij de val van de stad en in Nehemia; maar dat is gevolgtrekking. Geen graf dat het graf van Manasse of Amon kan worden genoemd, is gevonden, en de kaart plaatst de hof in Jeruzalem zonder nauwere plaatsbepaling."
  cs:
    - "Zahrada Uzova byla pohřebištěm dvou judských králů. Manases, po padesáti pěti letech na trůnu: „pohřben jest v zahradě domu svého, v zahradě Uzy“, a jeho syn Amón, zavražděný svými služebníky po dvou letech, byl pohřben „v hrobě jeho v zahradě Uzy“. Kroniky říkají o Manasesovi jen to, že „pochovali jej v domě jeho“. Většina králů před nimi byla uložena do hrobek králů ve Městě Davidově, takže zahrada označuje změnu v královském pohřbívání, ať byla příčina jakákoli: staré hrobky mohly být plné nebo se mohl přesunout palác."
    - "Kde zahrada byla a kdo byl Uza, nikdo neví. Jméno bylo zřejmě jménem dřívějšího majitele; že připomíná krále Uzijáše nebo Uzu, který zemřel, když se dotkl truhly, bylo navrženo jako dohad, ale nelze to prokázat. Ležela-li zahrada vedle paláce, byla někde na východním pahorku Jeruzaléma, snad na svahu ke Kidronu, kde je jmenována zahrada královská u rybníka Siloe při pádu města a u Nehemjáše; ale to je dohad. Žádná hrobka, kterou by bylo možno nazvat Manasesovou nebo Amónovou, nebyla nalezena, a mapa klade zahradu do Jeruzaléma bez bližšího určení."
  sv:
    - "Ussas trädgård var gravplats för två kungar av Juda. Manasse, efter femtiofem år på tronen, ”blev begraven i trädgården till sitt hus, i Ussas trädgård”, och hans son Amon, mördad av sina tjänare efter två år, begrovs ”i hans grav i Ussas trädgård”. Krönikeboken säger bara att Manasse begrovs ”där han bodde”. De flesta av kungarna före dem hade lagts i kungagravarna i Davids stad, så trädgården markerar en förändring i kunglig begravning, vad orsaken än var: de gamla gravarna kan ha varit fulla, eller palatset kan ha flyttat."
    - "Var trädgården låg, och vem Ussa var, vet ingen. Namnet var förmodligen en tidigare ägares; att det erinrar om kung Ussia, eller om Ussa som dog när han rörde vid arken, har gissats men kan inte visas. Om trädgården låg bredvid palatset var den någonstans på Jerusalems östra kulle, kanske på sluttningen mot Kidron, där ”den kungliga trädgården” vid Siloadammen nämns vid stadens fall och hos Nehemja; men det är slutledning. Ingen grav som kan kallas Manasses eller Amons har hittats, och kartan placerar trädgården i Jerusalem utan närmare plats."
  nb:
    - "Ussas have var gravstedet for to konger av Juda. Manasse, etter femti og fem år på tronen, «blev begravet i haven til sitt hus, i Ussas have», og sønnen Amon, myrdet av tjenerne sine etter to år, «blev begravet i sin grav i Ussas have». Krønikebøkene sier bare at Manasse ble begravet «i hans hus». De fleste kongene før dem var blitt lagt i kongegravene i Davidsbyen, så haven markerer en forandring i kongelig gravlegging, uansett årsak: de gamle gravene kan ha vært fulle, eller palasset kan ha flyttet."
    - "Hvor haven lå, og hvem Ussa var, vet ingen. Navnet var antakelig en tidligere eiers; at det minner om kong Ussia, eller om Ussa som døde da han tok på arken, er blitt gjettet, men kan ikke vises. Hvis haven lå ved palasset, var den et sted på Jerusalems østre høyde, kanskje på skråningen mot Kedron, der «kongens have» ved Siloa-dammen er nevnt ved byens fall og hos Nehemja; men det er slutning. Ingen grav som kan kalles Manasses eller Amons er funnet, og kartet setter haven i Jerusalem uten et nærmere sted."
  tl:
    - "Ang hardin ng Uzza ang libingan ng dalawang hari ng Juda. Si Manases, matapos ang limampu't limang taon sa trono, ay “nalibing sa halamanan ng kaniyang sariling bahay, sa halamanan ng Uzza”, at ang anak niyang si Amon, na pinaslang ng kaniyang mga lingkod pagkaraan ng dalawang taon, ay “nalibing sa kaniyang libingan sa halamanan ng Uzza”. Sinasabi lamang ng Mga Cronica na inilibing si Manases “sa kaniyang sariling bahay”. Karamihan sa mga hari bago nila ay inilibing sa mga libingan ng mga hari sa Bayan ni David, kaya ang hardin ay tanda ng pagbabago sa maharlikang libing, anuman ang dahilan: maaaring puno na ang mga lumang libingan, o lumipat ang palasyo."
    - "Walang nakakaalam kung nasaan ang hardin, at kung sino si Uzza. Ang pangalan ay marahil ng naunang may-ari; hinulaan ngunit hindi mapatunayan na naaalala nito si Haring Uzzias, o si Uzza na namatay sa paghipo sa kaban. Kung ang hardin ay nasa tabi ng palasyo, ito ay saanman sa silangang burol ng Jerusalem, marahil sa dalisdis patungo sa Cedron, kung saan pinangalanan ang “halamanan ng hari” sa tabi ng tangke ng Siloe sa pagbagsak ng lunsod at sa Nehemias; ngunit hinuha lamang iyon. Walang libingang matatawag na kay Manases o Amon ang natagpuan, at inilalagay ng mapa ang hardin sa Jerusalem nang walang mas tiyak na pook."
  da:
    - "Uzzas Have var gravsted for to konger af Juda. Manasse, efter femoghalvtreds år på tronen, »blev begraven i sit Hus's Have, som var i Ussas Have«, og hans søn Amon, myrdet af sine tjenere efter to år, blev begravet »i hans Grav, udi Ussas Have«. Krønikebøgerne siger blot, at Manasse blev begravet »i hans Hus«. De fleste af kongerne før dem var blevet lagt i kongegravene i Davidsbyen, så haven markerer en ændring i den kongelige begravelse, uanset årsagen: de gamle grave kan have været fyldt, eller paladset kan være flyttet."
    - "Hvor haven lå, og hvem Uzza var, ved ingen. Navnet var formodentlig en tidligere ejers; at det minder om kong Uzzija eller den Uzza, der døde ved at røre ved arken, er blevet gættet, men kan ikke vises. Hvis haven lå ved paladset, lå den et sted på Jerusalems østlige højde, måske på skråningen mod Kedron, hvor »Kongens Have« ved Siloam-dammen nævnes ved byens fald og hos Nehemias; men det er slutning. Ingen grav, der kan kaldes Manasses eller Amons, er fundet, og kortet placerer haven i Jerusalem uden et nærmere sted."
  sr:
    - "Врт Узин био је гробно место двојице јудејских царева. Манасија, после педесет и пет година на престолу, „би погребен у врту код дома свог, у врту Озином“, а његов син Амон, убијен од својих слугу после две године, „погребоше га у његовом гробу у врту Озином“. Летописи кажу само да је Манасија погребен „у дому његовом“. Већина царева пре њих била је положена у царске гробнице у Давидовом граду, па врт означава промену у царском сахрањивању, ма шта била њен узрок: старе гробнице су можда биле пуне, или се палата преселила."
    - "Где је врт био и ко је био Уза, нико не зна. Име је вероватно припадало ранијем власнику; да подсећа на цара Озију или на Узу који је умро додирнувши ковчег, нагађано је, али се не може показати. Ако је врт лежао уз палату, био је негде на источном брду Јерусалима, можда на падини према Кедрону, где се „врт царев“ крај бање силоамске именује при паду града и код Немије; али то је закључак. Ниједна гробница која би се могла назвати Манасијином или Амоновом није нађена, а карта смешта врт у Јерусалим без ближег налазишта."
  hu:
    - "Uzza kertje két júdai király temetkezési helye volt. Manassét ötvenöt évi uralkodás után „eltemetteték az ő háza mellett lévő kertben, az Uzza kertjében”, fiát, Ámont pedig, akit két év után szolgái megöltek, „eltemeték … az ő sírjába, Uzza kertjében”. A Krónikák csak azt mondja, hogy Manassét „eltemeték őt az ő házában”. A királyok többségét előttük Dávid városában a királyok sírjaiban helyezték el, így a kert a királyi temetkezés változását jelzi, bármi legyen is az oka: a régi sírok megtelhettek, vagy a palota költözhetett."
    - "Hogy hol volt a kert, és ki volt Uzza, senki sem tudja. A név feltehetően egy korábbi tulajdonosé volt; hogy Uzziás királyra emlékeztet, vagy az Uzzára, aki a láda érintésétől halt meg, találgatták, de nem bizonyítható. Ha a kert a palota mellett feküdt, Jeruzsálem keleti dombján volt valahol, talán a Kidron felé eső lejtőn, ahol „a király kertje” a siloámi tó mellett szerepel a város elestekor és Nehémiásnál; de ez következtetés. Egyetlen olyan sírt sem találtak, amely Manasséé vagy Ámoné lehetne, és a térkép a kertet közelebbi hely nélkül Jeruzsálemben jelöli."
  fi:
    - "Ussan puutarha oli kahden Juudan kuninkaan hautapaikka. Manasse, viidenkymmenenviiden vuoden hallituskauden jälkeen, ”haudattiin linnansa puutarhaan, Ussan puutarhaan”, ja hänen poikansa Amon, jonka palvelijat murhasivat kahden vuoden jälkeen, ”haudattiin omaan hautaansa Ussan puutarhaan”. Aikakirjat sanovat vain, että Manasse haudattiin ”linnaansa”. Useimmat heitä edeltäneet kuninkaat oli laskettu kuninkaiden hautoihin Daavidin kaupungissa, joten puutarha merkitsee muutosta kuninkaiden hautaamisessa, mistä syystä tahansa: vanhat haudat ovat voineet olla täynnä tai palatsi on voinut siirtyä."
    - "Missä puutarha oli ja kuka Ussa oli, ei tiedä kukaan. Nimi oli oletettavasti aiemman omistajan; että se muistuttaa kuningas Ussiaa tai arkkia koskettaessaan kuollutta Ussaa, on arvattu mutta sitä ei voida osoittaa. Jos puutarha oli palatsin vieressä, se oli jossain Jerusalemin itäisellä kukkulalla, ehkä rinteellä kohti Kidronia, missä kuninkaan puutarha Siloan lammikon luona mainitaan kaupungin kukistuessa ja Nehemiassa; mutta tämä on päätelmä. Mitään Manassen tai Amonin haudaksi kutsuttavaa hautaa ei ole löydetty, ja kartta asettaa puutarhan Jerusalemiin ilman tarkempaa paikkaa."
  vi:
    - "Vườn U-xa là nơi chôn hai vua Giu-đa. Ma-na-se, sau năm mươi lăm năm trên ngai, “được chôn trong vườn của đền người, tức trong vườn U-xa”, và con ông là A-môn, bị các đầy tớ giết sau hai năm, “được chôn trong mồ mả người nơi vườn U-xa”. Sách Sử Ký chỉ nói rằng Ma-na-se được chôn “trong cung điện người”. Hầu hết các vua trước họ được đặt trong các mộ vua ở Thành Đa-vít, nên khu vườn đánh dấu một thay đổi trong cách chôn vua, dù nguyên nhân là gì: các mộ cũ có thể đã đầy, hoặc cung điện có thể đã dời."
    - "Khu vườn ở đâu, và U-xa là ai, không ai biết. Tên có lẽ là của một chủ cũ; việc nó gợi nhớ vua Ô-xia, hay U-xa chết vì chạm vào hòm giao ước, chỉ là phỏng đoán không chứng minh được. Nếu khu vườn nằm cạnh cung điện thì nó ở đâu đó trên đồi đông của Giê-ru-sa-lem, có lẽ trên sườn hướng về Xết-rôn, nơi “vườn vua” cạnh ao Si-lô-ê được nêu khi thành thất thủ và trong Nê-hê-mi; nhưng đó là suy luận. Chưa tìm thấy ngôi mộ nào có thể gọi là của Ma-na-se hay A-môn, và bản đồ đặt khu vườn ở Giê-ru-sa-lem mà không có địa điểm cụ thể hơn."
  ro:
    - "Grădina lui Uza a fost locul de înmormântare a doi regi ai lui Iuda. Manase, după cincizeci și cinci de ani pe tron, a fost îngropat în grădina casei lui, în grădina lui Uza, iar fiul său Amon, ucis de slujitorii săi după doi ani, a fost îngropat în mormântul lui din grădina lui Uza. Cronicile spun doar că Manase a fost îngropat în casa lui. Cei mai mulți dintre regii dinaintea lor fuseseră puși în mormintele regilor din Cetatea lui David, așa că grădina marchează o schimbare în înmormântarea regală, oricare ar fi cauza ei: poate că vechile morminte erau pline sau poate că palatul se mutase."
    - "Unde era grădina și cine era Uza nu știe nimeni. Numele era probabil al unui proprietar mai vechi; că ar aminti de regele Ozia sau de Uza care a murit atingând chivotul s-a presupus, dar nu poate fi dovedit. Dacă grădina se afla lângă palat, era undeva pe dealul estic al Ierusalimului, poate pe panta spre Chedron, unde „grădina împăratului” de lângă iazul Siloamului este numită la căderea cetății și la Neemia; dar aceasta este deducție. Nu s-a găsit niciun mormânt care să poată fi numit al lui Manase sau al lui Amon, iar harta așază grădina în Ierusalim, fără un loc mai precis."
  bg:
    - "Градината на Уза била мястото на погребение на двама юдейски царе. Манасия, след петдесет и пет години на престола, „погребе се в градината на дома си, в градината на Оза“, а синът му Амон, убит от слугите си след две години, бил погребан „в гроба му в градината на Оза“. Летописи казват само, че Манасия бил погребан „в дома му“. Повечето от царете преди тях били положени в царските гробници в Давидовия град, така че градината отбелязва промяна в царското погребение, каквато и да е била причината: старите гробници може да са били пълни или дворецът може да се е преместил."
    - "Къде е била градината и кой е бил Уза, никой не знае. Името вероятно е на по-ранен собственик; предполагано е, че то напомня за цар Узия или за Уза, който умрял, като докоснал ковчега, но това не може да се докаже. Ако градината е лежала до двореца, тя е била някъде на източния хълм на Йерусалим, може би по склона към Кедрон, където „царската градина“ при Силоамския водоем се споменава при падането на града и в Неемия; но това е извод. Не е намерена гробница, която да може да се нарече гробът на Манасия или на Амон, и картата поставя градината в Йерусалим без по-точно място."
