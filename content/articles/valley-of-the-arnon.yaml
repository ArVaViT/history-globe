# Overview article (ADR 0007). Mainstream facts only; the "city in the midst of the river" is left unidentified; Mesha's line on the Arnon road follows the standard translation.
id: valley-of-the-arnon
place: af4c2cd
title:
  en: "Valley of the Arnon"
  ru: "Поток Арнон"
  uk: "Потік Арнон"
  es: "Arroyo de Arnón"
  pt: "Vale do Arnom"
  de: "Arnontal"
  fr: "Torrent de l’Arnon"
  pl: "Dolina Arnonu"
  it: "Valle dell’Arnon"
  nl: "Dal van de Arnon"
  cs: "Arnonské údolí"
  sv: "Arnondalen"
  nb: "Arnon-dalen"
  tl: "Libis ng Arnon"
body:
  en:
    - "The Arnon is the river that cuts the Moabite plateau in two and falls into the Dead Sea half-way down its eastern shore, today the Wadi Mujib in Jordan. Where the road crosses it the gorge is some 3 to 4 km wide at the rim and more than 500 m deep, with the stream winding between sandstone walls far below. The Bible speaks of “the river of Arnon”, “the brooks of Arnon” and the valley, and the ancient road from north to south, the King's Highway, had to go down into it and climb out; Mesha of Moab boasts on his stele that he made the highway in the Arnon. On its northern rim stood Aroer, and “the city that is in the midst of the river” is named but not identified."
    - "The gorge was a border. Israel on its way from the desert “pitched on the other side of Arnon”, “for Arnon is the border of Moab, between Moab and the Amorites”, and the book of the wars of the LORD sang of the brooks of Arnon. Moses was told, “Rise ye up, take your journey, and pass over the river Arnon”, and when Sihon fell Israel held his land “from Arnon unto Jabbok”; Reuben and Gad received the country “from Aroer, which is by the river Arnon”, and Jephthah reckoned three hundred years of Israel “in all the cities that be along by the coasts of Arnon”. Moab never accepted the line: Mesha took back the plain north of it in the ninth century BC, and in the days of Jehu Hazael of Damascus seized everything “from Aroer, which is by the river Arnon”. Isaiah saw the daughters of Moab “at the fords of Arnon” like birds cast out of the nest."
    - "Eusebius writes that in his day soldiers from many forts kept watch over the place because of its dangers. The modern King's Highway still winds down and up the canyon. The lower gorge is the Mujib Biosphere Reserve, set up in 1987 and called the lowest nature reserve on earth, where the stream is waded in summer, and the Mujib dam, finished in 2004, holds the river above it."
  ru:
    - "Арнон — река, рассекающая Моавитское плоскогорье надвое и впадающая в Мёртвое море посередине его восточного берега; сегодня это Вади-Муджиб в Иордании. Там, где его пересекает дорога, ущелье шириной 3–4 км по кромке и глубиной более 500 м, а поток вьётся далеко внизу между стенами из песчаника. Библия называет его «поток Арнон», знает «потоки Арнона» и долину, и древняя дорога с севера на юг, Царский путь, должна была спускаться в него и подниматься; Меса Моавитский хвалится на своей стеле, что проложил дорогу в Арноне. На северной кромке стоял Ароер, а «город, который среди потока», назван, но не отождествлён."
    - "Ущелье было границей. Израиль, идя из пустыни, остановился «у той части Арнона в пустыне, которая течет вне пределов Аморрея, ибо Арнон граница Моава, между Моавом и Аморреем», и книга браней Господних воспевала потоки Арнона. Моисею было сказано: «Встаньте, отправьтесь и перейдите поток Арнон», а когда пал Сигон, Израиль взял его землю «от Арнона до Иавока»; Рувим и Гад получили удел «от Ароера, который у потока Арнона», а Иеффай насчитал триста лет Израиля «во всех городах, которые близ Арнона». Моав никогда не признал этой черты: Меса в IX веке до н. э. вернул равнину к северу от неё, а во дни Ииуя Азаил Дамасский захватил всё «начиная от Ароера, который при потоке Арноне». Исаия видел дочерей Моава «у бродов Арнонских» подобными птице, выброшенной из гнезда."
    - "Евсевий пишет, что в его время это место из-за его опасностей стерегли воины из многих крепостей. Современный Царский путь по-прежнему вьётся вниз и вверх по каньону. Нижняя часть ущелья — биосферный заповедник Муджиб, созданный в 1987 году и называемый самым низко лежащим заповедником на земле, где летом ходят по руслу потока, а плотина Муджиб, законченная в 2004 году, удерживает реку выше по течению."
  uk:
    - "Арнон — ріка, що розтинає Моавитське плато надвоє і впадає в Мертве море на півдорозі вниз його східним берегом, нині Вади-Муджиб в Йорданії. Де її перетинає дорога, ущелина має близько 3–4 км завширшки по краях і понад 500 м завглибшки, з потоком, що вигинається між пісковиковими стінами далеко внизу. Біблія говорить про «Арнон-ріку», «потоки Арнона» і долину, і давня дорога з півночі на південь, Царський шлях, мусила спускатися в неї й вибиратися з неї; Меша Моавський хвалиться на своїй стелі, що проклав шлях в Арноні. На її північному краю стояв Ароер, а «місто серед долини» названо, але не ототожнено."
    - "Ущелина була межею. Ізраїль на шляху з пустелі «отаборились по другім боцї Арнона», бо «Арнон границя Моабова, між Моабіями і Аморіями», і в книзі боїв Господніх співали про потоки Арнона. Мойсеєві було сказано: «Вставайте, рушайте в дорогу і переходьте Арнон-ріку», а коли Сігон упав, Ізраїль заволодів його землею «від Арнона до Ябока»; Рувим і Гад дістали країну «Від Ароеру, що над Арнон-рікою», а Єфтай нарахував триста років Ізраїлю «ув Ароері і по всїх його городах, по обох боках Арнону». Моав ніколи не визнав цієї лінії: Меша відібрав рівнину на північ від неї в IX ст. до н. е., а за днів Єгу Азаїл Дамаський захопив усе «від Ароеру на Арнон ріцї». Ісая бачив дочок Моаву «коло бродів Арнону», як птахів, викинутих із гнізда."
    - "Євсевій пише, що за його днів воїни з багатьох фортів охороняли це місце через його небезпеки. Сучасний Царський шлях досі вигинається вниз і вгору каньйоном. Нижня ущелина — біосферний заповідник Муджиб, створений 1987 року й названий найнижчим природним заповідником на землі, де потік переходять убрід улітку, а гребля Муджиб, завершена 2004 року, утримує ріку вище."
  es:
    - "El Arnón es el río que parte en dos la meseta moabita y desemboca en el mar Muerto a mitad de su orilla oriental, hoy el Wadi Mujib, en Jordania. Donde lo cruza el camino, la garganta tiene unos 3 o 4 km de ancho en el borde y más de 500 m de profundidad, con el arroyo serpenteando entre paredes de arenisca mucho más abajo. La Biblia habla del «arroyo de Arnón», de «los arroyos de Arnón» y del valle, y el antiguo camino de norte a sur, el Camino Real, tenía que descender a él y salir trepando; Mesa de Moab se jacta en su estela de haber hecho la carretera en el Arnón. En su borde norte se alzaba Aroer, y «la ciudad que está en medio del arroyo» se nombra pero no se identifica."
    - "La garganta era una frontera. Israel, saliendo del desierto, «asentaron de la otra parte de Arnón», «porque Arnón es término de Moab, entre Moab y el Amorrheo», y el libro de las batallas de Jehová cantaba los arroyos de Arnón. A Moisés se le dijo: «Levantaos, partid, y pasad el arroyo de Arnón», y cuando cayó Sehón, Israel poseyó su tierra «desde Arnón hasta Jaboc»; Rubén y Gad recibieron el país «desde Aroer, que está al arroyo de Arnón», y Jefté calculó trescientos años de Israel en «todas las ciudades que están á los términos de Arnón». Moab nunca aceptó la línea: Mesa recuperó la llanura al norte en el siglo IX a. C., y en los días de Jehú, Hazael de Damasco se apoderó de todo «desde Aroer que está junto al arroyo de Arnón». Isaías vio a las hijas de Moab «en los vados de Arnón» como aves espantadas de su nido."
    - "Eusebio escribe que en su tiempo soldados de muchos fuertes vigilaban el lugar por sus peligros. El moderno Camino Real sigue serpenteando por el cañón, bajando y subiendo. La garganta baja es la Reserva de la Biosfera de Mujib, establecida en 1987 y llamada la reserva natural más baja de la tierra, donde el arroyo se vadea en verano, y la presa de Mujib, terminada en 2004, retiene el río por encima de ella."
  pt:
    - "O Arnom é o rio que corta o planalto moabita em dois e cai no Mar Morto na metade de sua margem oriental, hoje o Wadi Mujib, na Jordânia. Onde a estrada o cruza, a garganta tem uns 3 a 4 km de largura na borda e mais de 500 m de profundidade, com o riacho serpenteando entre paredes de arenito bem abaixo. A Bíblia fala do “vale do Arnom”, dos “vales do Arnom” e do rio, e a antiga estrada de norte a sul, a Estrada Real, tinha de descer a ele e subir do outro lado; Mesa de Moabe se gaba em sua estela de ter feito a estrada no Arnom. Em sua borda norte ficava Aroer, e “a cidade que está no meio do vale” é nomeada mas não identificada."
    - "A garganta era uma fronteira. Israel, vindo do deserto, “acampou do outro lado do Arnom”, “pois o Arnom é a fronteira de Moabe, entre Moabe e os amorreus”, e O Livro das Guerras do SENHOR cantava os vales do Arnom. A Moisés foi dito: “Levantem-se, sigam sua jornada e atravessem o vale do Arnom”, e, quando Seom caiu, Israel tomou sua terra “desde o Arnom até o Jaboque”; Rúben e Gade receberam o país “desde Aroer, que está junto ao vale do Arnom”, e Jefté contou trezentos anos de Israel “em todas as cidades que estão ao longo das margens do Arnom”. Moabe nunca aceitou a linha: Mesa retomou a planície ao norte dela no século IX a.C., e nos dias de Jeú Hazael de Damasco tomou tudo “desde Aroer, que fica junto ao vale do Arnom”. Isaías viu as filhas de Moabe “nos vaus do Arnom” como pássaros expulsos do ninho."
    - "Eusébio escreve que em seus dias soldados de muitos fortes vigiavam o lugar por causa de seus perigos. A moderna Estrada Real ainda desce e sobe o desfiladeiro. A garganta inferior é a Reserva da Biosfera de Mujib, criada em 1987 e chamada de reserva natural mais baixa da Terra, onde o riacho é vadeado no verão, e a represa de Mujib, concluída em 2004, retém o rio acima dela."
  de:
    - "Der Arnon ist der Fluss, der die moabitische Hochebene in zwei Hälften schneidet und auf halber Höhe des Ostufers ins Tote Meer fällt, heute das Wadi Mujib in Jordanien. Wo die Straße ihn quert, ist die Schlucht am Rand etwa 3 bis 4 km breit und mehr als 500 m tief, mit dem Bach, der sich weit unten zwischen Sandsteinwänden windet. Die Bibel spricht vom „Bach Arnon“, von den „Bächen Arnon“ und vom Tal, und die alte Straße von Norden nach Süden, die Königsstraße, musste hinab und wieder hinaus; Mesa von Moab rühmt sich auf seiner Stele, die Straße im Arnon gebaut zu haben. Am Nordrand stand Aroër, und die „Stadt mitten im Tal“ wird genannt, ist aber nicht identifiziert."
    - "Die Schlucht war eine Grenze. Israel lagerte auf dem Weg aus der Wüste „diesseits am Arnon“, „denn der Arnon ist die Grenze Moabs zwischen Moab und den Amoritern“, und das Buch von den Kriegen des HERRN besang die Bäche Arnon. Mose wurde gesagt: „Macht euch auf und ziehet aus und gehet über den Bach Arnon“, und nach Sihons Fall nahm Israel sein Land ein „vom Arnon an bis an den Jabbok“; Ruben und Gad erhielten das Land „von Aroer an, das am Ufer des Bachs Arnon liegt“, und Jeftah rechnete dreihundert Jahre Israels in Hesbon und Aroer „und allen Städten, die am Arnon liegen“. Moab nahm die Linie nie an: Mesa gewann im neunten Jahrhundert v. Chr. die Ebene nördlich davon zurück, und unter Jehu eroberte Hasaël von Damaskus alles „von Aroer an, das am Bach Arnon liegt“. Jesaja sah die Töchter Moabs „in den Furten des Arnon“ wie Vögel, die aus dem Nest getrieben werden."
    - "Eusebius schreibt, zu seiner Zeit hätten Soldaten aus vielen Kastellen den Ort wegen seiner Gefahren bewacht. Die moderne Königsstraße windet sich noch immer in die Schlucht hinab und wieder hinauf. Die untere Schlucht ist das Biosphärenreservat Mujib, 1987 eingerichtet und als tiefstgelegenes Naturschutzgebiet der Erde bezeichnet, wo man im Sommer durch den Bach watet, und der 2004 fertiggestellte Mujib-Damm staut den Fluss oberhalb."
  fr:
    - "L’Arnon est le cours d’eau qui coupe en deux le plateau moabite et se jette dans la mer Morte à mi-hauteur de sa rive orientale, aujourd’hui le Wadi Mujib, en Jordanie. Là où la route le franchit, la gorge fait 3 à 4 km de large au bord et plus de 500 m de profondeur, le cours d’eau serpentant entre des parois de grès très bas. La Bible parle du « torrent de l’Arnon », des « torrents de l’Arnon » et de la vallée, et la route antique du nord au sud, la Route royale, devait y descendre et en remonter ; Mescha de Moab se vante sur sa stèle d’avoir fait la route dans l’Arnon. Sur son bord nord se dressait Aroër, et « la ville qui est au milieu de la vallée » est nommée mais non identifiée."
    - "La gorge était une frontière. Israël, venant du désert, « campèrent de l’autre côté de l’Arnon », « car l’Arnon est la frontière de Moab, entre Moab et les Amoréens », et le livre des Guerres de l’Éternel chantait les torrents de l’Arnon. Moïse reçut l’ordre : « Levez-vous, partez, et passez le torrent de l’Arnon », et quand Sihon tomba, Israël tint son pays « depuis l’Arnon jusqu’au Jabbok » ; Ruben et Gad reçurent le territoire « à partir d’Aroër sur le torrent de l’Arnon », et Jephté compta trois cents ans d’Israël « dans toutes les villes qui sont sur les bords de l’Arnon ». Moab n’accepta jamais cette ligne : Mescha reprit la plaine au nord au IXe siècle av. J.-C., et du temps de Jéhu Hazaël de Damas saisit tout « depuis Aroër sur le torrent de l’Arnon ». Ésaïe vit les filles de Moab « au passage de l’Arnon » comme des oiseaux chassés du nid."
    - "Eusèbe écrit que de son temps des soldats de nombreux forts surveillaient le lieu à cause de ses dangers. La Route royale moderne descend et remonte toujours le canyon. La gorge inférieure est la Réserve de biosphère de Mujib, créée en 1987 et dite la plus basse réserve naturelle du monde, où l’on traverse le cours d’eau à gué en été, et le barrage de Mujib, achevé en 2004, retient le fleuve en amont."
  pl:
    - "Arnon to rzeka, która przecina płaskowyż Moabu na dwie części i wpada do Morza Martwego w połowie jego wschodniego brzegu, dziś Wadi Mudżib w Jordanii. Tam, gdzie przecina ją droga, wąwóz ma u krawędzi 3 do 4 km szerokości i ponad 500 m głębokości, a strumień wije się między piaskowcowymi ścianami daleko w dole. Biblia mówi o rzece Arnon, potokach Arnonu i dolinie, a starożytna droga z północy na południe, Droga Królewska, musiała w nią zstępować i z niej się wspinać; Mesza z Moabu chlubi się na swej steli, że zbudował drogę w Arnonie. Na jego północnej krawędzi stało Aroer, a „miasto, które jest w pośrodku potoku” jest wymienione, lecz nieutożsamione."
    - "Wąwóz był granicą. Izraelici w drodze z pustyni „położyli się obozem za Arnon”, „albowiem Arnon jest granica Moabska między Moabczykiem i Amorejczykiem”, a księga wojen Pańskich opiewała potoki Arnonu. Mojżeszowi powiedziano: „Wstawszy tedy idźcie, a przeprawcie się przez potok Arnon”, a gdy Sychon upadł, Izrael objął jego ziemię „od Arnonu aż do Jaboku”; Ruben i Gad otrzymali kraj „od Aroer, które jest nad potokiem Arnon”, a Jefte naliczył trzysta lat Izraela „we wszystkich miastach, które są przy granicy Arnon”. Moab nigdy nie przyjął tej linii: Mesza odzyskał równinę na północ od niej w IX wieku p.n.e., a za dni Jehu Chazael z Damaszku zajął wszystko „od Aroer, które jest u potoku Arnon”. Izajasz widział, jak „córki Moabskie przy brodach Arnon” są niczym ptaki wypłoszone z gniazda."
    - "Euzebiusz pisze, że w jego czasach żołnierze z wielu fortów strzegli tego miejsca z powodu jego niebezpieczeństw. Współczesna Droga Królewska nadal wije się w dół i w górę kanionu. Dolny wąwóz to Rezerwat Biosfery Mudżib, utworzony w 1987 roku i nazywany najniżej położonym rezerwatem przyrody na ziemi, gdzie strumień przeprawia się wbród latem, a tama Mudżib, ukończona w 2004 roku, zatrzymuje rzekę powyżej."
  it:
    - "L’Arnon è il fiume che taglia in due l’altopiano moabita e sfocia nel Mar Morto a metà della sua riva orientale, oggi il Wadi Mujib in Giordania. Dove la strada lo attraversa la gola è larga 3-4 km al ciglio e profonda più di 500 m, con il torrente che serpeggia fra pareti di arenaria molto più in basso. La Bibbia parla del fiume Arnon, dei torrenti dell’Arnon e della valle, e l’antica strada da nord a sud, la Via del Re, doveva scendervi e risalire; Mesa di Moab si vanta nella sua stele di aver fatto la strada nell’Arnon. Sul suo ciglio settentrionale sorgeva Aroer, e «la città ch’è in mezzo alla valle» è nominata ma non identificata."
    - "La gola era un confine. I figli d’Israele, venendo dal deserto, «si accamparono dall’altro lato dell’Arnon», perché «l’Arnon è il confine di Moab, fra Moab e gli Amorei», e il Libro delle Guerre dell’Eterno cantava «le valli dell’Arnon». A Mosè fu detto: «Levatevi, partite, e passate la valle dell’Arnon», e quando Sicon cadde Israele tenne il suo paese «dall’Arnon fino al Jabbok»; Ruben e Gad ricevettero il paese «da Aroer sull’orlo della valle dell’Arnon», e Iefte calcolò trecento anni d’Israele «in tutte le città lungo l’Arnon». Moab non accettò mai la linea: Mesa riprese la piana a nord di essa nel IX secolo a.C., e ai giorni di Ieu Cazaèl di Damasco si impadronì di tutto «fino ad Aroer ch’è presso la valle dell’Arnon». Isaia vide le figlie di Moab «ai guadi dell’Arnon» come uccelli scacciati dal nido."
    - "Eusebio scrive che ai suoi giorni soldati di molti forti vigilavano sul luogo per i suoi pericoli. La moderna Via del Re scende e risale ancora il canyon. La gola inferiore è la Riserva della Biosfera di Mujib, istituita nel 1987 e detta la riserva naturale più bassa della terra, dove d’estate il torrente si guada, e la diga di Mujib, ultimata nel 2004, trattiene il fiume a monte."
  nl:
    - "De Arnon is de rivier die het Moabitische plateau in tweeën snijdt en halverwege de oostoever in de Dode Zee valt, tegenwoordig de Wadi Mujib in Jordanië. Waar de weg haar kruist, is de kloof aan de rand zo’n 3 tot 4 km breed en meer dan 500 m diep, met de beek kronkelend tussen zandstenen wanden ver beneden. De Bijbel spreekt van “de beek Arnon”, “de beken Arnon” en het dal, en de oude weg van noord naar zuid, de Koningsweg, moest erin afdalen en eruit klimmen; Mesa van Moab roemt op zijn stèle dat hij de weg in de Arnon aanlegde. Op de noordrand stond Aroër, en “de stad, die in het midden der beek is” wordt genoemd maar niet geïdentificeerd."
    - "De kloof was een grens. Israël kwam uit de woestijn en “zij legerden zich op gene zijde van de Arnon”, “want de Arnon is de landpale van Moab, tussen Moab en tussen de Amorieten”, en het boek van de oorlogen van de HEER bezong de beken Arnon. Aan Mozes werd gezegd: “Maakt u op, reist heen, en gaat over de beek Arnon”, en toen Sihon was gevallen, bezat Israël zijn land “van de Arnon af tot de Jabbok toe”; Ruben en Gad ontvingen het land “van Aroer af, dat aan de beek Arnon is”, en Jefta rekende driehonderd jaar van Israël “in al de steden, die aan de zijde van de Arnon zijn”. Moab aanvaardde de lijn nooit: Mesa nam in de 9e eeuw v.Chr. de vlakte ten noorden ervan terug, en in de dagen van Jehu nam Hazaël van Damascus alles in van “Aroer, dat aan de beek van Arnon is”. Jesaja zag de dochters van Moab “aan de veren van Arnon” als vogels uit het nest gedreven."
    - "Eusebius schrijft dat in zijn dagen soldaten uit vele forten de plek bewaakten vanwege haar gevaren. De moderne Koningsweg kronkelt nog steeds door de canyon naar beneden en weer omhoog. De benedenkloof is het Mujib Biosphere Reserve, opgericht in 1987 en het laagstgelegen natuurreservaat ter wereld genoemd, waar de beek in de zomer wordt doorwaad, en de Mujib-dam, voltooid in 2004, houdt de rivier erboven vast."
  cs:
    - "Arnon je řeka, která rozděluje moábskou plošinu na dvě poloviny a vlévá se do Mrtvého moře v polovině jeho východního břehu, dnes Wádí Mudžib v Jordánsku. Tam, kde ji překračuje silnice, je soutěska široká na okraji asi 3 až 4 km a hluboká více než 500 m, s potokem klikatícím se mezi pískovcovými stěnami hluboko dole. Bible mluví o řece Arnonu, o potocích Arnonu a o údolí a starověká cesta od severu k jihu, Královská cesta, do něj musela sestoupit a vystoupat z něj; Meša Moábský se na své stéle chlubí, že zbudoval cestu v Arnonu. Na jeho severním okraji stál Aroer a „město, kteréž jest u prostřed potoka“ je jmenováno, ale není určeno."
    - "Soutěska byla hranicí. Izraelci na cestě z pouště „položili se u brodu potoka Arnon“, „nebo Arnon jest pomezí Moábské mezi Moábskými a Amorejskými“, a kniha bojů Hospodinových opěvovala potoky Arnonu. Mojžíšovi bylo řečeno: „Vstanouce, beřte se a přejděte potok Arnon“, a když Sichon padl, držel Izrael jeho zemi „od Arnon až do Jabok“; Rúben a Gád dostali kraj „od Aroer, jenž jest při potoku Arnon“ a Jiftách počítal tři sta let Izraele „ve všech městech, kteráž jsou při pomezí Arnon“. Moáb čáru nikdy nepřijal: Meša vzal zpět rovinu severně od ní v 9. stol. př. n. l. a za dnů Jehúových zabral Chazael z Damašku vše „od Aroer, kteréž jest při potoku Arnon“. Izajáš viděl dcery Moábu „při brodech Arnon“ jako ptáky vyhnané z hnízda."
    - "Eusebius píše, že za jeho dnů hlídali místo kvůli jeho nebezpečím vojáci z mnoha pevností. Moderní Královská cesta se dosud vine dolů a nahoru kaňonem. Dolní soutěska je biosférická rezervace Mudžib, zřízená roku 1987 a nazývaná nejníže položenou přírodní rezervací na světě, kde se potok v létě přebrodí, a přehrada Mudžib, dokončená roku 2004, drží řeku nad ní."
  sv:
    - "Arnon är floden som skär Moabs platå i två delar och faller ut i Döda havet halvvägs ner på dess östra strand, i dag Wadi Mujib i Jordanien. Där vägen korsar den är ravinen omkring 3 till 4 km bred vid kanten och mer än 500 m djup, med bäcken slingrande mellan sandstensväggar långt där nere. Bibeln talar om ”bäcken Arnon”, ”dalarna där Arnon går fram” och dalen, och den forntida vägen från norr till söder, Kungsvägen, måste gå ner i den och klättra upp; Mesha av Moab skryter på sin stele att han gjorde vägen i Arnon. På dess norra kant låg Aroer, och ”staden i dalens mitt” nämns men identifieras inte."
    - "Ravinen var en gräns. Israel på väg från öknen ”lägrade sig på andra sidan Arnon”, ”ty Arnon är Moabs gräns och flyter fram mellan Moabs land och amoréernas”, och Boken om HERRENS krig sjöng om dalarna där Arnon går fram. Mose fick höra: ”Stån nu upp, bryten upp och gån över bäcken Arnon”, och när Sichon föll höll Israel hans land ”från Arnon ända till Jabbok”; Ruben och Gad fick landet ”från Aroer vid bäcken Arnon”, och Jefta räknade trehundra år av Israel ”i alla städer på båda sidor om Arnon”. Moab godtog aldrig linjen: Mesha tog tillbaka slätten norr om den på 800-talet f.Kr., och på Jehus tid intog Hasael av Damaskus allt ”från Aroer vid bäcken Arnon”. Jesaja såg Moabs döttrar ”till Arnons vadställen” som fåglar utkastade ur boet."
    - "Eusebios skriver att soldater från många fort på hans tid höll vakt över platsen på grund av dess faror. Den moderna Kungsvägen slingrar sig fortfarande ner och upp ur kanjonen. Den nedre ravinen är biosfärreservatet Mujib, inrättat 1987 och kallat jordens lägst belägna naturreservat, där bäcken vadas på sommaren, och Mujibdammen, färdig 2004, håller floden ovanför den."
  nb:
    - "Arnon er elven som skjærer Moabs høyslette i to og faller ut i Dødehavet halvveis nede på østbredden, i dag Wadi Mujib i Jordan. Der veien krysser den, er juvet omkring 3 til 4 km bredt ved kanten og mer enn 500 m dypt, med elven som slynger seg mellom sandsteinsvegger langt nede. Bibelen taler om «Arnon-åen», «Arnons bekker» og dalen, og den gamle veien fra nord til sør, Kongeveien, måtte gå ned i den og klatre opp igjen; Mesa av Moab skryter på steleen sin av at han bygde veien i Arnon. På nordkanten sto Aroer, og «den by som ligger midt i dalen» er nevnt, men ikke identifisert."
    - "Juvet var en grense. Israel på vei fra ørkenen «leiret sig på hin side Arnon», «for Arnon er grensen mellem Moab og amorittene», og Boken om Herrens kriger sang om «Arnons bekker». Moses fikk beskjed: «Gjør eder rede, bryt op og gå over Arnon-åen!», og da Sihon falt, tok Israel hans land «fra Arnon til Jabbok»; Ruben og Gad fikk landet «fra Aroer, som ligger ved Arnon-åen», og Jefta regnet tre hundre år for Israel «i alle de byer som ligger ved Arnons bredder». Moab godtok aldri linjen: Mesa tok tilbake sletten nord for den på 800-tallet f.Kr., og i Jehus dager la Hasael av Damaskus under seg alt «like fra Aroer ved Arnon-åen». Jesaja så Moabs døtre «ved Arnons ferjesteder» som fugler jaget bort fra redet."
    - "Eusebius skriver at soldater fra mange festninger på hans tid holdt vakt over stedet på grunn av farene. Den moderne Kongeveien slynger seg fortsatt ned og opp av canyonen. Det nedre juvet er Mujib biosfærereservat, opprettet i 1987 og kalt det laveste naturreservatet på jorden, der elven vades om sommeren, og Mujib-demningen, ferdig i 2004, holder elven tilbake ovenfor."
  tl:
    - "Ang Arnon ay ang ilog na naghahati sa talampas ng Moab at bumabagsak sa Dagat na Patay sa kalagitnaan ng silangang baybayin nito, ang Wadi Mujib sa Jordan ngayon. Kung saan ito tinatawid ng daan, ang bangin ay mga 3 hanggang 4 km ang luwang sa gilid at mahigit 500 m ang lalim, na ang agos ay paliku-liko sa pagitan ng mga pader na batong buhangin sa ibaba. Binabanggit ng Biblia ang ilog ng Arnon, “ang mga libis ng Arnon” at ang libis, at ang sinaunang daan mula hilaga hanggang timog, ang Daan ng Hari, ay kailangang bumaba rito at umakyat palabas; ipinagyayabang ni Mesa ng Moab sa kaniyang estela na ginawa niya ang daan sa Arnon. Sa hilagang gilid nito nakatayo ang Aroer, at “ang bayan na nasa gitna ng libis” ay pinangalanan ngunit hindi natutukoy."
    - "Hangganan ang bangin. Mula sa disyerto, ang Israel ay “humantong sa kabilang ibayo ng Arnon”, “sapagka't ang Arnon ay hangganan ng Moab, na nasa pagitan ng Moab at ng mga Amorrheo”, at inawit ng Mga Pakikipagbaka ng Panginoon ang mga libis nito. Sinabi kay Moises, “Magsitindig kayo, kayo'y maglakbay, at magdaan kayo sa libis ng Arnon”; nang bumagsak si Sehon, inari ng Israel ang lupa niya “mula sa Arnon hanggang Jaboc”; tinanggap nina Ruben at Gad ang bansa “mula sa Aroer, na nasa tabi ng libis ng Arnon”, at binilang ni Jephte ang 300 taon “sa lahat ng mga bayang nangasa tabi ng Arnon”. Tinanggihan ito ng Moab: binawi ni Mesa ang kapatagan sa hilaga noong ika-9 siglo BK, at sa kaarawan ni Jehu, sinakop ni Hazael ng Damasco ang lahat “mula sa Aroer, na nasa siping ng libis ng Arnon”. Nakita ni Isaias ang mga anak na babae ng Moab “sa mga tawiran ng Arnon”, gaya ng ibong itinaboy sa pugad."
    - "Isinulat ni Eusebio na noong kaniyang kapanahunan, binabantayan ng mga sundalo mula sa maraming kuta ang lugar dahil sa mga panganib nito. Ang makabagong Daan ng Hari ay bumababa pa rin at umaakyat sa bangin. Ang ibabang bangin ay ang Reserbang Biosphere ng Mujib, itinatag noong 1987 at tinatawag na pinakamababang reserbang likas sa lupa, kung saan nilulusong ang agos sa tag-init, at hawak ng dam ng Mujib, natapos noong 2004, ang ilog sa itaas nito."
