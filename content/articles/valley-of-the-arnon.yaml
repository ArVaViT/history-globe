# Overview article (ADR 0007). Mainstream facts only; the "city in the midst of the river" is left unidentified; Mesha's line on the Arnon road follows the standard translation.
id: valley-of-the-arnon
place: af4c2cd
title:
  en: "Valley of the Arnon"
  ru: "Поток Арнон"
body:
  en:
    - "The Arnon is the river that cuts the Moabite plateau in two and falls into the Dead Sea half-way down its eastern shore, today the Wadi Mujib in Jordan. Where the road crosses it the gorge is some 3 to 4 km wide at the rim and more than 500 m deep, with the stream winding between sandstone walls far below. The Bible speaks of “the river of Arnon”, “the brooks of Arnon” and the valley, and the ancient road from north to south, the King's Highway, had to go down into it and climb out; Mesha of Moab boasts on his stele that he made the highway in the Arnon. On its northern rim stood Aroer, and “the city that is in the midst of the river” is named but not identified."
    - "The gorge was a border. Israel on its way from the desert “pitched on the other side of Arnon”, “for Arnon is the border of Moab, between Moab and the Amorites”, and the book of the wars of the LORD sang of the brooks of Arnon. Moses was told, “Rise ye up, take your journey, and pass over the river Arnon”, and when Sihon fell Israel held his land “from Arnon unto Jabbok”; Reuben and Gad received the country “from Aroer, which is by the river Arnon”, and Jephthah reckoned three hundred years of Israel “in all the cities that be along by the coasts of Arnon”. Moab never accepted the line: Mesha took back the plain north of it in the ninth century BC, and in the days of Jehu Hazael of Damascus seized everything “from Aroer, which is by the river Arnon”. Isaiah saw the daughters of Moab “at the fords of Arnon” like birds cast out of the nest."
    - "Eusebius writes that in his day soldiers from many forts kept watch over the place because of its dangers. The modern King's Highway still winds down and up the canyon. The lower gorge is the Mujib Biosphere Reserve, set up in 1987 and called the lowest nature reserve on earth, where the stream is waded in summer, and the Mujib dam, finished in 2004, holds the river above it."
  ru:
    - "Арнон — река, рассекающая Моавитское плоскогорье надвое и впадающая в Мёртвое море посередине его восточного берега; сегодня это Вади-Муджиб в Иордании. Там, где его пересекает дорога, ущелье шириной 3–4 км по кромке и глубиной более 500 м, а поток вьётся далеко внизу между стенами из песчаника. Библия называет его «поток Арнон», знает «потоки Арнона» и долину, и древняя дорога с севера на юг, Царский путь, должна была спускаться в него и подниматься; Меса Моавитский хвалится на своей стеле, что проложил дорогу в Арноне. На северной кромке стоял Ароер, а «город, который среди потока», назван, но не отождествлён."
    - "Ущелье было границей. Израиль, идя из пустыни, остановился «у той части Арнона в пустыне, которая течет вне пределов Аморрея, ибо Арнон граница Моава, между Моавом и Аморреем», и книга браней Господних воспевала потоки Арнона. Моисею было сказано: «Встаньте, отправьтесь и перейдите поток Арнон», а когда пал Сигон, Израиль взял его землю «от Арнона до Иавока»; Рувим и Гад получили удел «от Ароера, который у потока Арнона», а Иеффай насчитал триста лет Израиля «во всех городах, которые близ Арнона». Моав никогда не признал этой черты: Меса в IX веке до н. э. вернул равнину к северу от неё, а во дни Ииуя Азаил Дамасский захватил всё «начиная от Ароера, который при потоке Арноне». Исаия видел дочерей Моава «у бродов Арнонских» подобными птице, выброшенной из гнезда."
    - "Евсевий пишет, что в его время это место из-за его опасностей стерегли воины из многих крепостей. Современный Царский путь по-прежнему вьётся вниз и вверх по каньону. Нижняя часть ущелья — биосферный заповедник Муджиб, созданный в 1987 году и называемый самым низко лежащим заповедником на земле, где летом ходят по руслу потока, а плотина Муджиб, законченная в 2004 году, удерживает реку выше по течению."
