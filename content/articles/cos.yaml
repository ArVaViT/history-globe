body:
  en:
    - "Cos (Kos) is an island of the Dodecanese, lying along the mouth of the gulf of Ceramus, opposite Halicarnassus (modern Bodrum) on the coast of Asia Minor. Its people were Dorian Greeks, and in 366 BC they founded a new capital, the city of Cos, on the north-east point of the island, facing the mainland. Cos was the home of Hippocrates, the physician of the fifth century BC, and of the medical school linked with his name. Ptolemy II Philadelphus was born on the island, and under the Ptolemies Cos was a centre of letters as well as of medicine."
    - "Returning to Jerusalem at the end of his third journey, Paul took leave of the elders of Ephesus at Miletus, and Luke writes: “we came with a straight course unto Coos, and the day following unto Rhodes, and from thence unto Patara”. The ship evidently lay at Cos for one night. Earlier, 1 Maccabees lists Cos among the states to which the Roman consul Lucius wrote on behalf of the Jews, and Josephus, quoting Strabo, says that Mithridates seized at Cos eight hundred talents belonging to the Jews, money which, Josephus explains, the Jews of Asia had sent there for safety, for fear of Mithridates."
    - "The sanctuary of Asclepius, the Asclepieion, stands on terraces about 4 km south-west of the town; it was built and enlarged from the fourth to the second century BC. Iakovos Zarraftis, a local scholar, pointed out the site, and Rudolf Herzog excavated it in 1902–1904; Italian archaeologists continued the work in the 1930s. Josephus says that Herod endowed the annual office of gymnasiarch at Cos for ever, and Tacitus tells how Claudius, at the request of his physician Xenophon, a Coan, freed the island from tribute. The earthquake of 1933 ruined much of the town and allowed Italian excavators to uncover the ancient agora and harbour quarter. Kos is today part of Greece."
  ru:
    - "Кос — остров Додеканеса, лежащий у входа в Керамический залив, напротив Галикарнаса (ныне Бодрум) на побережье Малой Азии. Его жители были греками-дорийцами, и в 366 г. до н. э. они основали новую столицу, город Кос, на северо-восточной оконечности острова, против материка. Кос был родиной Гиппократа, врача V в. до н. э., и связанной с его именем медицинской школы. На острове родился Птолемей II Филадельф, и при Птолемеях Кос был средоточием не только медицины, но и словесности."
    - "Возвращаясь в Иерусалим в конце третьего путешествия, Павел простился в Милите со старейшинами Ефесской церкви, и Лука пишет: «прямо пришли в Кос, на другой день в Родос и оттуда в Патару». Корабль, очевидно, простоял у Коса одну ночь. Ранее Первая книга Маккавейская называет Кос среди государств, которым римский консул Луций писал в пользу иудеев, а Иосиф Флавий со ссылкой на Страбона сообщает, что Митридат захватил на Косе восемьсот талантов, принадлежавших иудеям; по объяснению Иосифа, иудеи Азии переправили эти деньги туда на хранение из страха перед Митридатом."
    - "Святилище Асклепия, Асклепион, стоит на террасах примерно в 4 км к юго-западу от города; его строили и расширяли с IV по II в. до н. э. Место указал местный исследователь Яковос Зарафтис, а Рудольф Херцог раскопал его в 1902–1904 гг.; итальянские археологи продолжили работы в 1930-х. Иосиф Флавий пишет, что Ирод навечно обеспечил средствами ежегодную должность гимнасиарха на Косе, а Тацит рассказывает, как Клавдий по просьбе своего врача Ксенофонта, уроженца Коса, освободил остров от податей. Землетрясение 1933 г. разрушило большую часть города и позволило итальянским археологам открыть древнюю агору и портовый квартал. Сегодня Кос входит в состав Греции."
  uk:
    - "Кос — острів Додеканесу, що лежить уздовж входу до Керамської затоки, навпроти Галікарнаса (сучасний Бодрум) на узбережжі Малої Азії. Його мешканці були дорійськими греками, і 366 р. до н. е. вони заснували нову столицю, місто Кос, на північно-східному мисі острова, зверненому до материка. Кос був батьківщиною Гіппократа, лікаря V ст. до н. е., та медичної школи, пов'язаної з його ім'ям. Птолемей II Філадельф народився на острові, і за Птолемеїв Кос був осередком літератури так само, як і медицини."
    - "Повертаючись до Єрусалима наприкінці третьої подорожі, Павло попрощався зі старшинами Ефеса в Мілеті, і Лука пише: «просто верстаючи дорогу, прибули ми в Кон, другого ж дня в Родос, а з відтіля в Патару». Корабель, вочевидь, стояв у Косі одну ніч. Раніше 1 Маккавеїв називає Кос серед держав, до яких римський консул Луцій писав від імені юдеїв, а Йосиф Флавій, цитуючи Страбона, каже, що Мітридат захопив у Косі вісімсот талантів, які належали юдеям, — гроші, пояснює Йосиф, що юдеї Азії відправили туди на збереження, боячись Мітридата."
    - "Святилище Асклепія, Асклепієйон, стоїть на терасах приблизно за 4 км на південний захід від міста; його будували й розширювали від IV до II ст. до н. е. Яковос Заррафтіс, місцевий учений, вказав це місце, а Рудольф Герцог розкопав його 1902–1904 рр.; італійські археологи продовжили роботи в 1930-х рр. Йосиф Флавій каже, що Ірод назавжди заснував на Косі щорічну посаду гімнасіарха, а Тацит розповідає, як Клавдій на прохання свого лікаря Ксенофонта, косця, звільнив острів від данини. Землетрус 1933 р. зруйнував значну частину міста й дав змогу італійським розкопувачам відкрити давню агору та портовий квартал. Нині Кос — частина Греції."
  es:
    - "Cos (Kos) es una isla del Dodecaneso, situada a lo largo de la entrada del golfo de Cerámico, frente a Halicarnaso (la actual Bodrum), en la costa de Asia Menor. Sus habitantes eran griegos dorios, y en 366 a. C. fundaron una nueva capital, la ciudad de Cos, en el extremo nordeste de la isla, frente al continente. Cos fue la patria de Hipócrates, el médico del siglo V a. C., y de la escuela médica vinculada a su nombre. Ptolomeo II Filadelfo nació en la isla, y bajo los Ptolomeos Cos fue un centro de letras además de medicina."
    - "De regreso a Jerusalén al final de su tercer viaje, Pablo se despidió de los ancianos de Éfeso en Mileto, y Lucas escribe: «vinimos camino derecho á Coos, y al día siguiente á Rhodas, y de allí á Pátara». Evidentemente la nave pasó una noche en Cos. Antes, 1 Macabeos enumera Cos entre los estados a los que el cónsul romano Lucio escribió en favor de los judíos, y Josefo, citando a Estrabón, dice que Mitrídates se apoderó en Cos de ochocientos talentos pertenecientes a los judíos, dinero que, explica Josefo, los judíos de Asia habían enviado allí para ponerlo a salvo por temor a Mitrídates."
    - "El santuario de Asclepio, el Asclepieion, se alza en terrazas a unos 4 km al suroeste de la ciudad; fue construido y ampliado del siglo IV al II a. C. Iakovos Zarraftis, un erudito local, señaló el lugar, y Rudolf Herzog lo excavó en 1902–1904; arqueólogos italianos continuaron la obra en la década de 1930. Josefo dice que Herodes dotó para siempre el cargo anual de gimnasiarca en Cos, y Tácito cuenta que Claudio, a petición de su médico Jenofonte, natural de Cos, eximió a la isla de tributo. El terremoto de 1933 arruinó gran parte de la ciudad y permitió a los excavadores italianos descubrir la antigua ágora y el barrio del puerto. Cos forma hoy parte de Grecia."
  pt:
    - "Cós (Kos) é uma ilha do Dodecaneso, ao longo da entrada do golfo Cerâmico, defronte de Halicarnasso (a atual Bodrum), na costa da Ásia Menor. Seus habitantes eram gregos dórios, e em 366 a.C. fundaram uma nova capital, a cidade de Cós, no ponto nordeste da ilha, de frente para o continente. Cós foi a terra de Hipócrates, o médico do século V a.C., e da escola de medicina ligada a seu nome. Ptolomeu II Filadelfo nasceu na ilha, e sob os ptolomeus Cós foi um centro de letras além de medicina."
    - "De volta a Jerusalém ao fim de sua terceira viagem, Paulo despediu-se dos anciãos de Éfeso em Mileto, e Lucas escreve: “navegamos em curso direto para Cós, no dia seguinte para Rodes, e dali para Pátara”. O navio evidentemente passou uma noite em Cós. Antes, 1 Macabeus lista Cós entre os estados aos quais o cônsul romano Lúcio escreveu em favor dos judeus, e Josefo, citando Estrabão, diz que Mitrídates apreendeu em Cós oitocentos talentos pertencentes aos judeus, dinheiro que, explica Josefo, os judeus da Ásia haviam enviado para lá por segurança, por medo de Mitrídates."
    - "O santuário de Asclépio, o Asclepieion, ergue-se em terraços a cerca de 4 km a sudoeste da cidade; foi construído e ampliado do século IV ao século II a.C. Iakovos Zarraftis, estudioso local, indicou o sítio, e Rudolf Herzog o escavou em 1902–1904; arqueólogos italianos continuaram o trabalho na década de 1930. Josefo diz que Herodes dotou para sempre o cargo anual de ginasiarca em Cós, e Tácito conta como Cláudio, a pedido de seu médico Xenofonte, um cóio, isentou a ilha de tributo. O terremoto de 1933 arruinou grande parte da cidade e permitiu aos escavadores italianos descobrir a antiga ágora e o bairro do porto. Kos faz hoje parte da Grécia."
  de:
    - "Kos ist eine Insel des Dodekanes, die vor der Mündung des Keramischen Golfs liegt, gegenüber von Halikarnass (dem heutigen Bodrum) an der Küste Kleinasiens. Ihre Bewohner waren dorische Griechen, und 366 v. Chr. gründeten sie eine neue Hauptstadt, die Stadt Kos, an der Nordostspitze der Insel, dem Festland gegenüber. Kos war die Heimat des Hippokrates, des Arztes des fünften Jahrhunderts v. Chr., und der mit seinem Namen verbundenen Ärzteschule. Ptolemaios II. Philadelphos wurde auf der Insel geboren, und unter den Ptolemäern war Kos ebenso ein Zentrum der Literatur wie der Medizin."
    - "Auf der Rückkehr nach Jerusalem am Ende seiner dritten Reise nahm Paulus in Milet Abschied von den Ältesten von Ephesus, und Lukas schreibt: „kamen wir geradewegs gen Kos und am folgenden Tage gen Rhodus und von da nach Patara“. Das Schiff lag offenbar eine Nacht in Kos. Zuvor nennt das Erste Makkabäerbuch Kos unter den Staaten, an die der römische Konsul Lucius zugunsten der Juden schrieb, und Josephus sagt unter Berufung auf Strabon, Mithridates habe in Kos achthundert Talente beschlagnahmt, die den Juden gehörten, Geld, das nach Josephus die Juden Asiens aus Furcht vor Mithridates dorthin in Sicherheit gebracht hatten."
    - "Das Heiligtum des Asklepios, das Asklepieion, liegt auf Terrassen etwa 4 km südwestlich der Stadt; es wurde vom vierten bis zum zweiten Jahrhundert v. Chr. gebaut und erweitert. Iakovos Zarraftis, ein einheimischer Gelehrter, wies auf die Stätte hin, und Rudolf Herzog grub sie 1902–1904 aus; italienische Archäologen setzten die Arbeit in den 1930er Jahren fort. Josephus sagt, Herodes habe das jährliche Amt des Gymnasiarchen in Kos für immer gestiftet, und Tacitus erzählt, wie Claudius auf Bitten seines Arztes Xenophon, eines Koers, die Insel vom Tribut befreite. Das Erdbeben von 1933 zerstörte einen großen Teil der Stadt und erlaubte den italienischen Ausgräbern, die antike Agora und das Hafenviertel freizulegen. Kos gehört heute zu Griechenland."
  fr:
    - "Cos (Kos) est une île du Dodécanèse, qui borde l’entrée du golfe de Céramos, en face d’Halicarnasse (l’actuelle Bodrum), sur la côte d’Asie Mineure. Ses habitants étaient des Grecs doriens, et en 366 av. J.-C. ils fondèrent une nouvelle capitale, la ville de Cos, à la pointe nord-est de l’île, face au continent. Cos fut la patrie d’Hippocrate, le médecin du Ve siècle av. J.-C., et de l’école médicale liée à son nom. Ptolémée II Philadelphe naquit dans l’île, et sous les Ptolémées Cos fut un centre des lettres autant que de la médecine."
    - "À son retour vers Jérusalem, à la fin de son troisième voyage, Paul prit congé des anciens d’Éphèse à Milet, et Luc écrit : « nous allâmes directement à Cos, le lendemain à Rhodes, et de là à Patara ». Le navire resta manifestement une nuit à Cos. Plus tôt, 1 Maccabées range Cos parmi les États auxquels le consul romain Lucius écrivit en faveur des Juifs, et Josèphe, citant Strabon, dit que Mithridate saisit à Cos huit cents talents appartenant aux Juifs, argent que, explique Josèphe, les Juifs d’Asie y avaient envoyé en sûreté par crainte de Mithridate."
    - "Le sanctuaire d’Asclépios, l’Asclépieion, se dresse sur des terrasses à environ 4 km au sud-ouest de la ville ; il fut bâti et agrandi du IVe au IIe siècle av. J.-C. Iakovos Zarraftis, érudit local, signala le site, et Rudolf Herzog le fouilla en 1902–1904 ; des archéologues italiens poursuivirent le travail dans les années 1930. Josèphe dit qu’Hérode dota à perpétuité la charge annuelle de gymnasiarque à Cos, et Tacite raconte comment Claude, à la demande de son médecin Xénophon, un Coen, exempta l’île de tribut. Le tremblement de terre de 1933 ruina une grande partie de la ville et permit aux fouilleurs italiens de dégager l’agora antique et le quartier du port. Kos fait aujourd’hui partie de la Grèce."
  it:
    - "Coo (Kos) è un’isola del Dodecaneso, che si stende all’imboccatura del golfo di Ceramo, di fronte ad Alicarnasso (l’odierna Bodrum) sulla costa dell’Asia Minore. Il suo popolo erano Greci dori, e nel 366 a.C. essi fondarono una nuova capitale, la città di Coo, sulla punta nord-orientale dell’isola, rivolta verso la terraferma. Coo fu la patria di Ippocrate, il medico del V secolo a.C., e della scuola medica legata al suo nome. Tolomeo II Filadelfo nacque sull’isola, e sotto i Tolomei Coo fu un centro di lettere oltre che di medicina."
    - "Tornando a Gerusalemme alla fine del terzo viaggio, Paolo prese congedo dagli anziani di Efeso a Mileto, e Luca scrive: «salpammo, e per diritto corso giungemmo a Cos, e il giorno seguente a Rodi, e di là a Patara». La nave sostò evidentemente a Coo per una notte. In precedenza, il Primo libro dei Maccabei elenca Coo tra gli stati ai quali il console romano Lucio scrisse a favore dei Giudei, e Giuseppe Flavio, citando Strabone, dice che Mitridate sequestrò a Coo ottocento talenti appartenenti ai Giudei, denaro che, spiega Giuseppe, i Giudei dell’Asia vi avevano inviato in custodia per timore di Mitridate."
    - "Il santuario di Asclepio, l’Asclepieion, sorge su terrazze a circa 4 km a sud-ovest della città; fu costruito e ampliato dal IV al II secolo a.C. Iakovos Zarraftis, uno studioso locale, ne indicò il sito, e Rudolf Herzog lo scavò nel 1902–1904; archeologi italiani proseguirono il lavoro negli anni Trenta. Giuseppe Flavio dice che Erode dotò per sempre la carica annuale di ginnasiarca a Coo, e Tacito racconta come Claudio, su richiesta del suo medico Senofonte, originario di Coo, esentò l’isola dal tributo. Il terremoto del 1933 rovinò gran parte della città e permise agli scavatori italiani di portare alla luce l’antica agorà e il quartiere del porto. Kos fa oggi parte della Grecia."
  nl:
    - "Kos (Cos) is een eiland van de Dodekanesos, gelegen langs de monding van de golf van Ceramus, tegenover Halicarnassus (het huidige Bodrum) aan de kust van Klein-Azië. De bewoners waren Dorische Grieken, en in 366 v.Chr. stichtten zij een nieuwe hoofdstad, de stad Kos, op de noordoostpunt van het eiland, tegenover het vasteland. Kos was de woonplaats van Hippocrates, de arts uit de vijfde eeuw v.Chr., en van de aan zijn naam verbonden medische school. Ptolemaeus II Filadelfus werd op het eiland geboren, en onder de Ptolemaeën was Kos zowel een centrum van letteren als van geneeskunde."
    - "Bij de terugkeer naar Jeruzalem aan het einde van zijn derde reis nam Paulus te Milete afscheid van de oudsten van Efeze, en Lukas schrijft: “zo liepen wij rechtuit en kwamen te Kos, en den dag daaraan te Rhodus, en van daar te Patara”. Het schip lag blijkbaar een nacht te Kos. Eerder noemt 1 Makkabeeën Kos onder de staten aan wie de Romeinse consul Lucius ten gunste van de Joden schreef, en Josephus zegt, Strabo citerend, dat Mithridates te Kos achthonderd talenten in beslag nam die aan de Joden toebehoorden, geld dat volgens Josephus de Joden van Asia daarheen hadden gezonden om het uit vrees voor Mithridates in veiligheid te brengen."
    - "Het heiligdom van Asklepios, het Asklepieion, staat op terrassen ongeveer 4 km ten zuidwesten van de stad; het werd van de vierde tot de tweede eeuw v.Chr. gebouwd en uitgebreid. Iakovos Zarraftis, een plaatselijke geleerde, wees de plek aan, en Rudolf Herzog groef haar in 1902–1904 op; Italiaanse archeologen zetten het werk in de jaren dertig voort. Josephus zegt dat Herodes het jaarlijkse ambt van gymnasiarch te Kos voor altijd bekostigde, en Tacitus vertelt hoe Claudius op verzoek van zijn lijfarts Xenophon, een man uit Kos, het eiland van tribuut vrijstelde. De aardbeving van 1933 verwoestte een groot deel van de stad en stelde Italiaanse opgravers in staat de antieke agora en de havenwijk bloot te leggen. Kos maakt tegenwoordig deel uit van Griekenland."
  pl:
    - "Kos to wyspa Dodekanezu, leżąca u wejścia do zatoki Keramejskiej, naprzeciw Halikarnasu (dzisiejszy Bodrum) na wybrzeżu Azji Mniejszej. Jej mieszkańcy byli Dorami, a w 366 p.n.e. założyli nową stolicę, miasto Kos, na północno-wschodnim cyplu wyspy, zwróconym ku lądowi. Kos było ojczyzną Hipokratesa, lekarza z V w. p.n.e., i związanej z jego imieniem szkoły lekarskiej. Na wyspie urodził się Ptolemeusz II Filadelfos, a za Ptolemeuszów Kos było ośrodkiem nie tylko medycyny, lecz także literatury."
    - "Wracając do Jerozolimy pod koniec trzeciej podróży, Paweł pożegnał w Milecie starszych z Efezu, a Łukasz pisze: „prosto jadąc, przyjechaliśmy do Kou, a nazajutrz do Rodu, a stamtąd do Patary”. Okręt wyraźnie spędził w Kos jedną noc. Wcześniej Pierwsza Księga Machabejska wymienia Kos wśród państw, do których rzymski konsul Lucjusz pisał w sprawie Żydów, a Józef Flawiusz, cytując Strabona, mówi, że Mitrydates zajął w Kos osiemset talentów należących do Żydów, pieniędzy, które, jak wyjaśnia Józef, Żydzi z Azji tam przesłali dla bezpieczeństwa, w obawie przed Mitrydatesem."
    - "Sanktuarium Asklepiosa, Asklepiejon, stoi na tarasach około 4 km na południowy zachód od miasta; budowano je i rozbudowywano od IV do II w. p.n.e. Jakowos Zarraftis, miejscowy uczony, wskazał to miejsce, a Rudolf Herzog badał je w latach 1902-1904; włoscy archeolodzy kontynuowali prace w latach trzydziestych XX wieku. Józef Flawiusz mówi, że Herod ufundował na zawsze coroczny urząd gimnazjarchy w Kos, a Tacyt opowiada, jak Klaudiusz na prośbę swego lekarza Ksenofonta z Kos zwolnił wyspę z daniny. Trzęsienie ziemi w 1933 roku zniszczyło znaczną część miasta i pozwoliło włoskim badaczom odsłonić starożytną agorę i dzielnicę portową. Kos należy dziś do Grecji."
  cs:
    - "Kós (Kos) je ostrov Dodekanésu, ležící podél ústí Keramského zálivu, naproti Halikarnassu (dnešní Bodrum) na pobřeží Malé Asie. Jeho obyvatelé byli dórští Řekové a roku 366 př. n. l. založili nové hlavní město, město Kós, na severovýchodním výběžku ostrova, obráceném k pevnině. Kós byl domovem Hippokrata, lékaře pátého století př. n. l., a lékařské školy spojované s jeho jménem. Ptolemaios II. Filadelfos se na ostrově narodil a za Ptolemaiovců byl Kós střediskem písemnictví i lékařství."
    - "Cestou zpět do Jeruzaléma na konci své třetí cesty se Pavel v Milétu rozloučil se staršími z Efezu a Lukáš píše: „přímým během přijeli jsme do Koum, a druhý den do Ródu, a odtud do Patary“. Loď zřejmě v Kósu ležela jednu noc. Dříve uvádí 1. kniha Makabejská Kós mezi státy, jimž římský konzul Lucius psal ve prospěch Židů, a Josephus Flavius s odvoláním na Strabóna říká, že Mithridatés zabavil v Kósu osm set talentů patřících Židům, peníze, které tam podle Josepha poslali ze strachu před Mithridatem židé z Asie k uschování."
    - "Svatyně Asklépia, Asklépieion, stojí na terasách asi 4 km jihozápadně od města; byla budována a rozšiřována od čtvrtého do druhého století př. n. l. Místo ukázal místní učenec Iakovos Zarraftis a Rudolf Herzog je vykopal v letech 1902–1904; italští archeologové v práci pokračovali ve 30. letech. Josephus říká, že Herodes založil roční úřad gymnasiarchy v Kósu navždy, a Tacitus vypráví, že Klaudius na žádost svého lékaře Xenofónta, Kóana, osvobodil ostrov od daní. Zemětřesení roku 1933 zničilo velkou část města a umožnilo italským vykopávačům odkrýt starověkou agoru a přístavní čtvrť. Kos je dnes součástí Řecka."
  sv:
    - "Kos är en ö i Dodekanesos, som ligger vid mynningen av Keramiska viken, mittemot Halikarnassos (nuvarande Bodrum) på Mindre Asiens kust. Dess folk var dorier, och 366 f.Kr. grundade de en ny huvudstad, staden Kos, på öns nordöstra udde, vänd mot fastlandet. Kos var hemort för Hippokrates, läkaren på 400-talet f.Kr., och för den medicinska skola som är knuten till hans namn. Ptolemaios II Filadelfos föddes på ön, och under ptolemaierna var Kos ett centrum för litteratur såväl som för medicin."
    - "På hemresan till Jerusalem i slutet av sin tredje resa tog Paulus avsked av äldste i Efesos i Miletos, och Lukas skriver: ”foro raka vägen till Kos och kommo dagen därefter till Rodus och därifrån till Patara”. Skeppet låg uppenbarligen i Kos över natten. Tidigare listar Första Mackabeerboken Kos bland de stater till vilka den romerske konsuln Lucius skrev till förmån för judarna, och Josefus, som citerar Strabon, säger att Mithridates i Kos tog beslag på åtta hundra talenter som tillhörde judarna, pengar som, förklarar Josefus, Asiens judar hade sänt dit för säkerhets skull, av rädsla för Mithridates."
    - "Asklepios helgedom, Asklepieion, ligger på terrasser omkring 4 km sydväst om staden; den byggdes och utvidgades från 300-talet till 100-talet f.Kr. Iakovos Zarraftis, en lokal forskare, pekade ut platsen, och Rudolf Herzog grävde ut den 1902–1904; italienska arkeologer fortsatte arbetet på 1930-talet. Josefus säger att Herodes stiftade det årliga gymnasiarkämbetet i Kos för alltid, och Tacitus berättar hur Claudius, på begäran av sin läkare Xenofon, en kosier, befriade ön från tribut. Jordbävningen 1933 förstörde stora delar av staden och lät de italienska utgrävarna blottlägga den antika agoran och hamnkvarteret. Kos hör i dag till Grekland."
  nb:
    - "Kos er en øy i Dodekanesene, langs munningen av Keramos-bukta, midt imot Halikarnassos (dagens Bodrum) på kysten av Lilleasia. Folket var doriske grekere, og i 366 f.Kr. grunnla de en ny hovedstad, byen Kos, på øyas nordøstlige odde, vendt mot fastlandet. Kos var hjemstedet til Hippokrates, legen fra 400-tallet f.Kr., og til den medisinske skolen knyttet til hans navn. Ptolemaios II Filadelfos ble født på øya, og under ptolemeerne var Kos et sentrum for litteratur så vel som for medisin."
    - "På hjemveien til Jerusalem ved slutten av sin tredje reise tok Paulus avskjed med de eldste fra Efesos i Milet, og Lukas skriver: «kom vi rett frem til Kos, næste dag til Rodus, og derfra til Patara». Skipet lå åpenbart ved Kos én natt. Tidligere nevner 1. Makkabeerbok Kos blant statene som den romerske konsulen Lukius skrev til på jødenes vegne, og Josefus, som siterer Strabon, sier at Mithridates beslagla i Kos åtte hundre talenter som tilhørte jødene, penger som, forklarer Josefus, jødene i Asia hadde sendt dit for sikkerhets skyld av frykt for Mithridates."
    - "Asklepios-helligdommen, Asklepieion, ligger på terrasser omtrent 4 km sørvest for byen; den ble bygd og utvidet fra 300- til 100-tallet f.Kr. Iakovos Zarraftis, en lokal lærd, pekte ut stedet, og Rudolf Herzog gravde det ut i 1902–1904; italienske arkeologer fortsatte arbeidet på 1930-tallet. Josefus sier at Herodes grunnfestet det årlige embetet som gymnasiarkos i Kos for alltid, og Tacitus forteller hvordan Klaudius, på anmodning fra sin lege Xenofon, en kosier, fritok øya for skatt. Jordskjelvet i 1933 ødela mye av byen og lot italienske utgravere avdekke den gamle agoraen og havnekvarteret. Kos hører i dag til Hellas."
  tl:
    - "Ang Coos (Kos) ay isang pulo ng Dodecanese, nakahiga sa bunganga ng golpo ng Ceramus, sa tapat ng Halicarnassus (makabagong Bodrum) sa baybayin ng Asia Menor. Mga Griyegong Dorio ang mga tao nito, at noong 366 BK ay nagtatag sila ng bagong kabisera, ang lungsod ng Coos, sa hilagang-silangang dulo ng pulo, nakaharap sa kalupaan. Ang Coos ang tahanan ni Hippocrates, ang manggagamot noong ika-5 siglo BK, at ng paaralang medikal na nauugnay sa kaniyang pangalan. Isinilang sa pulo si Ptolemeo II Philadelphus, at sa ilalim ng mga Ptolemeo ang Coos ay sentro ng panitikan gayundin ng medisina."
    - "Pagbalik sa Jerusalem sa wakas ng ikatlong paglalakbay, nagpaalam si Pablo sa mga matanda ng Efeso sa Mileto, at sumulat si Lucas: “tuloytuloy na pinunta namin ang Coos, at nang kinabukasa'y ang Rodas, at buhat doo'y ang Patara”. Tila nanatili ang barko sa Coos nang isang gabi. Mas maaga, inililista ng 1 Macabeo ang Coos sa mga estadong sinulatan ng konsul na Romano na si Lucio para sa mga Judio, at sinasabi ni Josefo, na sumisipi kay Strabo, na inagaw ni Mithridates sa Coos ang walong daang talentong pag-aari ng mga Judio, perang, paliwanag ni Josefo, ipinadala roon ng mga Judio ng Asia para sa kaligtasan, sa takot kay Mithridates."
    - "Ang santuwaryo ni Asclepio, ang Asclepieion, ay nakatayo sa mga terasa mga 4 km sa timog-kanluran ng bayan; itinayo at pinalaki ito mula ika-4 hanggang ika-2 siglo BK. Itinuro ni Iakovos Zarraftis, lokal na iskolar, ang pook, at hinukay ito ni Rudolf Herzog noong 1902–1904; ipinagpatuloy ng mga arkeologong Italyano ang gawain noong dekada 1930. Sinasabi ni Josefo na itinatag ni Herodes ang taunang katungkulan ng gymnasiarch sa Coos magpakailanman, at isinasalaysay ni Tacito kung paanong pinalaya ni Claudio ang pulo sa tributo sa hiling ng kaniyang manggagamot na si Xenophon, isang taga-Coos. Winasak ng lindol noong 1933 ang karamihan sa bayan at pinahintulutan ang mga tagahukay na Italyano na tuklasin ang sinaunang agora at purok ng daungan. Ang Kos ay bahagi ngayon ng Grecia."
  da:
    - "Kos er en ø i Dodekaneserne, der ligger langs mundingen af Keramos-bugten, over for Halikarnassos (nutidens Bodrum) på Lilleasiens kyst. Dens folk var doriske grækere, og i 366 f.Kr. grundlagde de en ny hovedstad, byen Kos, på øens nordøstlige pynt, vendt mod fastlandet. Kos var hjemsted for Hippokrates, lægen fra 400-tallet f.Kr., og for den lægeskole, der knyttes til hans navn. Ptolemaios 2. Filadelfos blev født på øen, og under ptolemæerne var Kos et centrum for både litteratur og lægekunst."
    - "Da Paulus ved afslutningen af sin tredje rejse vendte tilbage til Jerusalem, tog han afsked med Efesos' ældste i Milet, og Lukas skriver: »droge vi lige til Kos, og den næste Dag til Rodus og derfra til Patara«. Skibet lå åbenbart ved Kos én nat. Tidligere opregner 1 Makkabæerbog Kos blandt de stater, som den romerske konsul Lucius skrev til på jødernes vegne, og Josefus, der citerer Strabon, siger, at Mithridates ved Kos beslaglagde otte hundrede talenter, der tilhørte jøderne, penge som, forklarer Josefus, Asiens jøder havde sendt dertil for at være i sikkerhed af frygt for Mithridates."
    - "Asklepios' helligdom, Asklepieion, ligger på terrasser cirka 4 km sydvest for byen; den blev bygget og udvidet fra 300- til 100-tallet f.Kr. Iakovos Zarraftis, en lokal lærd, påpegede stedet, og Rudolf Herzog udgravede det i 1902–1904; italienske arkæologer fortsatte arbejdet i 1930'erne. Josefus siger, at Herodes stiftede det årlige embede som gymnasiark på Kos for evigt, og Tacitus fortæller, hvordan Klaudius på begæring af sin læge Xenofon fra Kos fritog øen for skat. Jordskælvet i 1933 ødelagde en stor del af byen og gjorde det muligt for italienske udgravere at afdække den antikke agora og havnekvarteret. Kos er i dag en del af Grækenland."
  sr:
    - "Кос је острво Додеканеза, које лежи дуж ушћа Керамејског залива, насупрот Халикарнаса (данашњег Бодрума) на обали Мале Азије. Његови становници били су дорски Грци, а 366. п. н. е. основали су нову престоницу, град Кос, на североисточном рту острва, окренутом копну. Кос је био завичај Хипократа, лекара из 5. века п. н. е., и медицинске школе везане за његово име. Птолемеј II Филаделф рођен је на острву, а под Птолемејевићима Кос је био средиште књижевности као и медицине."
    - "Враћајући се у Јерусалим на крају свог трећег путовања, Павле се опростио од старешина Ефеса у Милету, а Лука пише: „идући право дођосмо у Ко, и други дан у Род и оданде у Патару“. Брод је очигледно једну ноћ лежао у Косу. Раније 1. књига о Макавејима набраја Кос међу државама којима је римски конзул Лукије писао у корист Јевреја, а Јосиф Флавије, цитирајући Страбона, каже да је Митридат у Косу запленио осам стотина таланата који су припадали Јеврејима, новац који су, објашњава Јосиф Флавије, азијски Јевреји тамо послали на чување, из страха од Митридата."
    - "Светилиште Асклепија, Асклепијеј, стоји на терасама око 4 км југозападно од града; грађено је и проширивано од 4. до 2. века п. н. е. Јаковос Заррафтис, локални учењак, указао је на налазиште, а Рудолф Херцог ископавао га је 1902–1904; италијански археолози наставили су рад 1930-их. Јосиф Флавије каже да је Ирод заувек основао годишњу дужност гимнасијарха у Косу, а Тацит приповеда како је Клаудије, на молбу свог лекара Ксенофонта, Косанина, ослободио острво данка. Земљотрес 1933. срушио је велики део града и омогућио италијанским ископавачима да открију древну агору и лучку четврт. Кос је данас део Грчке."
  hu:
    - "Kósz (Kos) a Dodekanészosz egyik szigete, a Kerameiai-öböl bejárata mentén, a kisázsiai parton fekvő Halikarnasszosszal (a mai Bodrum) szemben. Lakói dór görögök voltak, és Kr. e. 366-ban új fővárost alapítottak, Kósz városát a sziget északkeleti csúcsán, a szárazföld felé nézve. Kósz volt a Kr. e. 5. századi orvos, Hippokratész, és a nevéhez kötött orvosi iskola hazája. II. Ptolemaiosz Philadelphosz a szigeten született, és a Ptolemaioszok alatt Kósz az irodalom éppúgy központja volt, mint az orvoslásé."
    - "Harmadik útjának végén, Jeruzsálembe visszatérve Pál Milétoszban búcsúzott el Efezus véneitől, és Lukács így ír: „egyenesen haladva Kóusba érkezénk, másnap pedig Rhodusba, és onnét Patarába”. A hajó láthatóan egy éjszakára Kószon kötött ki. Korábban az 1Makkabeusok Kószt azok közé az államok közé sorolja, amelyeknek Lucius római konzul a zsidók érdekében írt, Josephus pedig Sztrabónt idézve azt mondja, hogy Mithridatész Kószon foglalta le a zsidóknak járó nyolcszáz talentumot, amelyet Josephus magyarázata szerint az ázsiai zsidók Mithridatésztől való félelmükben küldtek oda biztonságba."
    - "Az Aszklépiosz-szentély, az Aszklépieion a várostól mintegy 4 km-re délnyugatra, teraszokon áll; a Kr. e. 4. századtól a 2. századig építették és bővítették. Iakovos Zarraftis, egy helyi tudós mutatott rá a helyre, Rudolf Herzog pedig 1902–1904-ben ásta; olasz régészek az 1930-as években folytatták a munkát. Josephus szerint Heródes örökre alapítványt tett Kószon az éves gümnaszionarkhosz tisztségére, Tacitus pedig elmondja, hogyan mentesítette Klaudius orvosa, a kószi Xenophón kérésére a szigetet az adó alól. Az 1933-as földrengés a város nagy részét romba döntötte, és lehetővé tette az olasz ásatóknak, hogy feltárják az ókori agorát és a kikötőnegyedet. Kósz ma Görögországhoz tartozik."
  fi:
    - "Kos on Dodekanesian saari, joka sijaitsee Keramoksenlahden suulla Halikarnassoksen (nykyinen Bodrum) vastapäätä Vähän-Aasian rannikolla. Sen asukkaat olivat doorilaisia kreikkalaisia, ja vuonna 366 eaa. he perustivat uuden pääkaupungin, Kosin kaupungin, saaren koillisosaan mannerta vastapäätä. Kos oli 400-luvulla eaa. eläneen lääkäri Hippokrateen ja hänen nimeensä liittyvän lääketieteellisen koulun kotipaikka. Ptolemaios II Philadelphos syntyi saarella, ja Ptolemaiosten aikana Kos oli sekä kirjallisuuden että lääketieteen keskus."
    - "Palatessaan Jerusalemiin kolmannen matkansa lopussa Paavali erosi Efesoksen vanhimmista Miletoksessa, ja Luukas kirjoittaa: ”laskimme suoraan Koossaareen ja seuraavana päivänä Rodoon ja sieltä Pataraan”. Laiva oli ilmeisesti Kosissa yhden yön. Aiemmin 1. Makkabilaiskirja luettelee Kosin niiden valtioiden joukossa, joille roomalainen konsuli Lucius kirjoitti juutalaisten puolesta, ja Josefus, Strabonia lainaten, sanoo, että Mithridates takavarikoi Kosissa kahdeksansataa talenttia juutalaisille kuuluvia varoja, rahaa, jonka Aasian juutalaiset olivat Josefuksen mukaan lähettäneet sinne turvaan Mithridatesta peläten."
    - "Asklepioksen pyhäkkö, Asklepieion, sijaitsee terasseilla noin 4 km kaupungista lounaaseen; se rakennettiin ja laajennettiin 300-luvulta 100-luvulle eaa. Iakovos Zarraftis, paikallinen tutkija, osoitti paikan, ja Rudolf Herzog kaivoi sen vuosina 1902–1904; italialaiset arkeologit jatkoivat työtä 1930-luvulla. Josefus sanoo, että Herodes lahjoitti Kosissa vuosittaisen gymnasiarkin viran ikuisiksi ajoiksi, ja Tacitus kertoo, kuinka Klaudius lääkärinsä Ksenofonin, kosilaisen, pyynnöstä vapautti saaren veroista. Vuoden 1933 maanjäristys tuhosi suuren osan kaupungista ja antoi italialaisten kaivajien paljastaa antiikin agoran ja satamakorttelin. Kos kuuluu nykyisin Kreikkaan."
  vi:
    - "Cốt (Kos) là một đảo của quần đảo Dodecanese, nằm dọc cửa vịnh Ceramus, đối diện Halicarnassus (nay là Bodrum) trên bờ Tiểu Á. Dân của nó là người Hy Lạp Dorian, và năm 366 TCN họ lập một kinh đô mới, thành Cốt, ở mũi đông bắc của đảo, nhìn ra đất liền. Cốt là quê của Hippocrates, thầy thuốc thế kỷ 5 TCN, và của trường y gắn với tên ông. Ptolemy II Philadelphus sinh trên đảo, và dưới thời nhà Ptolemy, Cốt là một trung tâm văn chương cũng như y học."
    - "Khi trở về Giê-ru-sa-lem vào cuối chuyến hành trình thứ ba, Phao-lô từ biệt các trưởng lão Ê-phê-sô tại Mi-lê, và Lu-ca viết: “đi thẳng đến thành Cốt, ngày hôm sau tới thành Rô-đơ, và từ đó đến thành Ba-ta-ra”. Con tàu hiển nhiên đã đậu lại Cốt một đêm. Trước đó, 1 Ma-ca-bê liệt kê Cốt trong số các quốc gia mà chấp chính quan La Mã Lucius viết thư thay mặt người Do Thái, và Josephus, trích Strabo, nói rằng Mithridates chiếm ở Cốt tám trăm ta-lâng thuộc về người Do Thái, số tiền mà, Josephus giải thích, người Do Thái ở A-si đã gửi đến đó cho an toàn vì sợ Mithridates."
    - "Đền thờ Asclepius, Asclepieion, đứng trên các bậc thềm cách thị trấn khoảng 4 km về phía tây nam; nó được xây và mở rộng từ thế kỷ 4 đến thế kỷ 2 TCN. Iakovos Zarraftis, một học giả địa phương, chỉ ra địa điểm, và Rudolf Herzog khai quật nó năm 1902–1904; các nhà khảo cổ Ý tiếp tục công việc vào những năm 1930. Josephus nói rằng Hê-rốt đã tài trợ vĩnh viễn chức gymnasiarch hằng năm ở Cốt, và Tacitus kể rằng Cơ-lốt, theo lời xin của thầy thuốc Xenophon, một người Cốt, đã miễn cống thuế cho đảo. Trận động đất năm 1933 làm hư hại phần lớn thị trấn và cho phép các nhà khai quật Ý phát lộ chợ agora cổ và khu bến cảng. Ngày nay Kos thuộc Hy Lạp."
  ro:
    - "Cos (Kos) este o insulă din Dodecaneze, așezată de-a lungul gurii golfului Ceramic, față în față cu Halicarnas (Bodrumul de azi) de pe coasta Asiei Mici. Locuitorii ei erau greci dorieni, iar în 366 î.Hr. au întemeiat o capitală nouă, orașul Cos, pe punctul de nord-est al insulei, cu fața spre continent. Cos a fost patria lui Hipocrate, medicul din secolul al V-lea î.Hr., și a școlii medicale legate de numele lui. Ptolemeu al II-lea Filadelf s-a născut pe insulă, iar sub Ptolemei Cos a fost un centru al literelor, ca și al medicinii."
    - "Întorcându-se la Ierusalim la sfârșitul celei de-a treia călătorii, Pavel și-a luat rămas-bun de la bătrânii din Efes la Milet, iar Luca scrie: „mergând drept am venit la Con, și a doua zi la Rodos, și de acolo la Patara”. Corabia a stat evident la Cos o noapte. Mai înainte, 1 Macabei înșiră Cosul printre statele cărora consulul roman Luciu le-a scris în favoarea iudeilor, iar Iosif Flaviu, citându-l pe Strabon, spune că Mitridate a pus mâna la Cos pe opt sute de talanți care aparțineau iudeilor, bani pe care, explică Iosif Flaviu, iudeii din Asia îi trimiseseră acolo spre păstrare, de frica lui Mitridate."
    - "Sanctuarul lui Asclepios, Asclepieionul, se află pe terase la circa 4 km sud-vest de oraș; a fost zidit și mărit din secolul al IV-lea până în al II-lea î.Hr. Iakovos Zarraftis, un cărturar local, a arătat locul, iar Rudolf Herzog l-a săpat în 1902–1904; arheologi italieni au continuat lucrările în anii 1930. Iosif Flaviu spune că Irod a înzestrat pe veci slujba anuală de gimnaziarh la Cos, iar Tacitus povestește cum Claudiu, la cererea medicului său Xenofon, un cosian, a scutit insula de tribut. Cutremurul din 1933 a ruinat o mare parte din oraș și a îngăduit săpătorilor italieni să scoată la iveală agora antică și cartierul portului. Kos aparține astăzi Greciei."
  bg:
    - "Кос е остров от Додеканезите, разположен по протежение на входа на Керамийския залив, срещу Халикарнас (днешния Бодрум) на брега на Мала Азия. Жителите му били дорийски гърци и през 366 г. пр.н.е. те основали нова столица, град Кос, на североизточния край на острова, срещу сушата. Кос бил родното място на Хипократ, лекаря от V в. пр.н.е., и на медицинската школа, свързана с името му. Птолемей II Филаделф се родил на острова и при Птолемеите Кос бил средище както на медицината, така и на словесността."
    - "Връщайки се в Йерусалим в края на третото си пътуване, Павел се сбогувал със старейшините на Ефес в Милит, и Лука пише: „дойдохме право на Коос, а на утринта на Родос, и от там на Патара“. Корабът очевидно престоял на Кос една нощ. По-рано Първа книга Макавейска изброява Кос сред държавите, до които римският консул Луций писал в полза на юдеите, а Йосиф Флавий, цитирайки Страбон, казва, че Митридат заграбил на Кос осемстотин таланта, принадлежащи на юдеите — пари, които, обяснява Йосиф, юдеите от Азия изпратили там на сигурно място от страх пред Митридат."
    - "Светилището на Асклепий, Асклепионът, стои на тераси на около 4 км югозападно от града; то било строено и разширявано от IV до II в. пр.н.е. Яковос Зарафтис, местен учен, посочил мястото, а Рудолф Херцог го разкопал през 1902–1904 г.; италиански археолози продължили работата през 30-те години на XX в. Йосиф Флавий казва, че Ирод дарил завинаги средства за годишната длъжност на гимнасиарх на Кос, а Тацит разказва как Клавдий по молба на лекаря си Ксенофонт, родом от Кос, освободил острова от данък. Земетресението от 1933 г. разрушило голяма част от града и позволило на италианските разкопвачи да открият древната агора и пристанищния квартал. Кос днес е част от Гърция."
