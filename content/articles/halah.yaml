# Overview article (ADR 0007). Mainstream facts only; the identification with Assyrian Halahhu is the usual one and is said to rest on the name; the Obadiah reading is reported as an emendation.
id: halah
place: abf176f
title:
  en: "Halah"
  ru: "Халах"
  uk: "Халах"
  es: "Halah"
  pt: "Halá"
  de: "Halach"
  fr: "Chalach"
  pl: "Chalach"
  it: "Chelach"
  nl: "Chalach"
