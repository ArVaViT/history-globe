# Overview article (ADR 0007). Mainstream facts only; the identification with Assyrian Halahhu is the usual one and is said to rest on the name; the Obadiah reading is reported as an emendation.
id: halah
place: abf176f
title:
  en: "Halah"
  ru: "Халах"
  uk: "Халах"
  es: "Halah"
  pt: "Halá"
  de: "Halach"
  fr: "Chalach"
body:
  en:
    - "Halah is the first of the places to which the Assyrians deported the people of the northern kingdom. When Samaria fell in the ninth year of Hoshea, the king of Assyria “carried Israel away into Assyria, and placed them in Halah and in Habor by the river of Gozan, and in the cities of the Medes”; the note is repeated in the account of Hezekiah, and Chronicles says the same of the tribes east of the Jordan, carried off earlier by Tiglath-pileser III “unto Halah, and Habor, and Hara, and to the river Gozan, unto this day”. Halah thus stands with the Habor valley and Media as a region of exile, and the Bible says nothing else about it. Some commentators also find it in Obadiah, reading “this host” of the exiles as “Halah”, but that is an emendation."
    - "Assyrian records know a town and district Halahhu in the Assyrian heartland north-east of Nineveh, toward the hills; it appears in administrative texts and lists of provinces, and the name fits the Hebrew exactly. Most scholars therefore place Halah there, in the plain between Nineveh and the mountains, where the great kings settled deportees to farm royal estates. The identification rests on the name, since the deportees have left no trace of their own; the alternatives, a site on the Habor or the city of Calah (Nimrud), have found little support. Assyrian texts of the next decades do mention Samarians serving in the army and officials with Israelite names, so the exiles did not vanish, but where in Halah they lived is unknown."
    - "The district is today the north of the Nineveh governorate of Iraq, around Mosul and the foothills toward Dohuk, where Halahhu is usually sought near the modern village of al-Abbasiyah."
  ru:
    - "Халах — первое из мест, куда ассирийцы переселили народ северного царства. Когда Самария пала в девятый год Осии, царь Ассирийский «переселил Израильтян в Ассирию, и поселил их в Халахе и в Хаворе, при реке Гозан, и в городах Мидийских»; заметка повторена в рассказе о Езекии, и Паралипоменон говорит то же о заиорданских коленах, уведённых раньше Феглафелласаром III в Халах, Хавор и Ару и на реку Гозан. Так Халах стоит рядом с долиной Хавора и Мидией как область изгнания, и больше Библия о нём ничего не говорит. Некоторые толкователи находят его и у Авдия, читая «войско» переселенцев как «Халах», но это уже исправление текста."
    - "Ассирийские записи знают город и округ Халахху в сердце Ассирии, к северо-востоку от Ниневии, в сторону гор; он встречается в хозяйственных текстах и списках провинций, и имя точно отвечает еврейскому. Поэтому большинство учёных помещает Халах туда, на равнину между Ниневией и горами, где великие цари сажали переселенцев возделывать царские земли. Отождествление держится на имени, ведь сами переселенцы следов не оставили; другие предложения — место на Хаворе или город Калах (Нимруд) — поддержки почти не нашли. Ассирийские тексты ближайших десятилетий упоминают самарян на службе в войске и чиновников с израильскими именами, так что изгнанники не исчезли, но где именно в Халахе они жили, неизвестно."
    - "Сегодня этот округ — север иракской провинции Найнава, вокруг Мосула и предгорий в сторону Дахука, где Халахху обычно ищут у нынешнего селения Аль-Аббасия."
  uk:
    - "Халах — перше з місць, куди ассирійці виселили людей північного царства. Коли Самарія впала дев’ятого року Осії, цар Ассирії «одвів Ізрайлитян полонянами в Ассирию й поселив їх в Халасї й в Хаборі, при ріцї Гозан, та по Мидийських городах»; ця примітка повторюється в оповіді про Єзекію, а Хроніки кажуть те саме про коліна по той бік Йордану, виведені раніше Тіглатпаласаром III «в Халах і Хавір, і Ару, й на ріку Гозан, — де вони й до сього часу». Так Халах стоїть разом з долиною Хавора та Мідією як край вигнання, і більше Біблія про нього нічого не каже. Деякі коментатори знаходять його й у Овадії, читаючи «війська синів Ізрайлевих» у вигнанців як «Халах», але це виправлення тексту."
    - "Ассирійські записи знають місто й округу Халахху в ассирійському осередді на північний схід від Ніневії, у бік пагорбів; вони з’являються в адміністративних текстах і переліках провінцій, і назва цілком відповідає давньоєврейській. Тому більшість дослідників розміщують Халах там, на рівнині між Ніневією та горами, де великі царі селили депортованих обробляти царські маєтки. Це ототожнення спирається на назву, бо самі депортовані не залишили власного сліду; альтернативи — місце на Хаворі або місто Калах (Німруд) — знайшли мало підтримки. Ассирійські тексти наступних десятиліть таки згадують самарійців на військовій службі та чиновників з ізраїльськими іменами, тож вигнанці не зникли, але де саме в Халаху вони жили, невідомо."
    - "Ця округа нині — північ губернаторства Ніневія в Іраку, довкола Мосула та передгір’їв у бік Духока, де Халахху зазвичай шукають поблизу сучасного села ель-Аббасія."
  es:
    - "Halah es el primero de los lugares a los que los asirios deportaron al pueblo del reino del norte. Cuando Samaria cayó en el año noveno de Oseas, el rey de Asiria «trasportó á Israel á Asiria, y púsolos en Hala, y en Habor, junto al río de Gozán, y en las ciudades de los Medos»; la noticia se repite en el relato de Ezequías, y Crónicas dice lo mismo de las tribus al este del Jordán, llevadas antes por Tiglat-pileser III «á Halad, y á Habor y á Ara, y al río de Gozán, hasta hoy». Halah figura así, con el valle del Habor y Media, como región de destierro, y la Biblia no dice nada más de ella. Algunos comentaristas la hallan también en Abdías, leyendo «aqueste ejército» de los desterrados como «Halah», pero eso es una enmienda."
    - "Los registros asirios conocen una población y distrito Halahhu en el corazón de Asiria, al nordeste de Nínive, hacia las colinas; aparece en textos administrativos y en listas de provincias, y el nombre encaja exactamente con el hebreo. La mayoría de los estudiosos sitúan por tanto Halah allí, en la llanura entre Nínive y las montañas, donde los grandes reyes establecían deportados para cultivar fincas reales. La identificación se apoya en el nombre, pues los deportados no han dejado rastro propio; las alternativas, un sitio en el Habor o la ciudad de Cala (Nimrud), han hallado poco apoyo. Los textos asirios de las décadas siguientes mencionan a samarios que servían en el ejército y a funcionarios con nombres israelitas, de modo que los desterrados no desaparecieron, pero se ignora dónde vivieron en Halah."
    - "El distrito es hoy el norte de la gobernación de Nínive, en Irak, en torno a Mosul y las estribaciones hacia Dohuk, donde Halahhu suele buscarse cerca de la actual aldea de al-Abbasiyah."
  pt:
    - "Halá é o primeiro dos lugares para onde os assírios deportaram o povo do reino do norte. Quando Samaria caiu no nono ano de Oseias, o rei da Assíria “levou Israel cativo para a Assíria, e os colocou em Hala, e junto a Habor, o rio de Gozã, e nas cidades dos medos”; a nota é repetida no relato de Ezequias, e Crônicas diz o mesmo das tribos a leste do Jordão, levadas antes por Tiglate-Pileser III “para Hala, Habor, Hara e para o rio Gozã, até o dia de hoje”. Halá figura assim, com o vale do Habor e a Média, como região de exílio, e a Bíblia nada mais diz sobre ela. Alguns comentaristas a encontram também em Obadias, lendo como “Halá” o “exército” dos exilados, mas isso é uma emenda."
    - "Os registros assírios conhecem uma cidade e distrito Halahhu no coração da Assíria, a nordeste de Nínive, rumo às colinas; aparece em textos administrativos e listas de províncias, e o nome se ajusta exatamente ao hebraico. A maioria dos estudiosos, portanto, situa Halá ali, na planície entre Nínive e as montanhas, onde os grandes reis estabeleciam deportados para cultivar propriedades reais. A identificação repousa no nome, pois os deportados não deixaram vestígios próprios; as alternativas, um sítio no Habor ou a cidade de Calá (Nimrud), encontraram pouco apoio. Textos assírios das décadas seguintes mencionam habitantes de Samaria servindo no exército e funcionários com nomes israelitas, de modo que os exilados não desapareceram, mas onde em Halá viveram é desconhecido."
    - "O distrito é hoje o norte da província de Nínive, no Iraque, em torno de Mossul e das colinas rumo a Dohuk, onde Halahhu é usualmente procurada perto da aldeia moderna de al-Abbasiyah."
  de:
    - "Halach ist der erste der Orte, in die die Assyrer die Bevölkerung des Nordreichs verschleppten. Als Samaria im neunten Jahr Hoseas fiel, „führte“ der König von Assyrien „Israel weg nach Assyrien und setzte sie nach Halah und an den Habor, an das Wasser Gosan und in die Städte der Meder“; die Notiz wird im Bericht über Hiskia wiederholt, und die Chronik sagt dasselbe von den Stämmen östlich des Jordan, die Tiglat-Pileser III. früher weggeführt hatte „gen Halah und an den Habor und gen Hara und an das Wasser Gosan bis auf diesen Tag“. Halach steht somit mit dem Habortal und Medien als Verbannungsgebiet, und die Bibel sagt sonst nichts darüber. Manche Ausleger finden es auch bei Obadja, indem sie „dieses Heeres“ der Verbannten zu „Halach“ ändern, doch das ist eine Konjektur."
    - "Assyrische Quellen kennen eine Stadt und einen Bezirk Halahhu im assyrischen Kernland nordöstlich von Ninive, zu den Bergen hin; er erscheint in Verwaltungstexten und Provinzlisten, und der Name passt genau zum Hebräischen. Die meisten Forscher setzen Halach daher dort an, in der Ebene zwischen Ninive und den Bergen, wo die Großkönige Deportierte ansiedelten, um königliche Güter zu bewirtschaften. Die Gleichsetzung beruht auf dem Namen, da die Verschleppten keine eigene Spur hinterlassen haben; die Alternativen, eine Stätte am Habor oder die Stadt Kalach (Nimrud), haben wenig Unterstützung gefunden. Assyrische Texte der folgenden Jahrzehnte erwähnen Samarier im Heer und Beamte mit israelitischen Namen, die Verbannten verschwanden also nicht, doch wo in Halach sie lebten, ist unbekannt."
    - "Der Bezirk ist heute der Norden des irakischen Gouvernements Ninive, um Mossul und die Vorberge Richtung Dohuk, wo Halahhu meist nahe dem heutigen Dorf al-Abbasija gesucht wird."
  fr:
    - "Chalach est le premier des lieux où les Assyriens déportèrent le peuple du royaume du nord. Quand Samarie tomba la neuvième année d’Osée, le roi d’Assyrie « emmena Israël captif en Assyrie. Il les fit habiter à Chalach, et sur le Chabor, fleuve de Gozan, et dans les villes des Mèdes » ; la notice est répétée dans le récit d’Ézéchias, et les Chroniques disent la même chose des tribus à l’est du Jourdain, emmenées plus tôt par Tiglath-Piléser III « à Chalach, à Chabor, à Hara, et au fleuve de Gozan, où ils sont demeurés jusqu’à ce jour ». Chalach figure ainsi avec la vallée du Chabor et la Médie comme région d’exil, et la Bible n’en dit rien d’autre. Certains commentateurs la trouvent aussi chez Abdias, en lisant « cette armée » des exilés comme « Chalach », mais c’est une correction du texte."
    - "Les archives assyriennes connaissent une ville et un district Halahhu dans le cœur de l’Assyrie, au nord-est de Ninive, vers les collines ; il apparaît dans des textes administratifs et des listes de provinces, et le nom correspond exactement à l’hébreu. La plupart des spécialistes y placent donc Chalach, dans la plaine entre Ninive et les montagnes, où les grands rois installaient des déportés pour cultiver des domaines royaux. L’identification repose sur le nom, puisque les déportés n’ont laissé aucune trace propre ; les autres hypothèses, un site sur le Chabor ou la ville de Calach (Nimroud), ont trouvé peu de soutien. Des textes assyriens des décennies suivantes mentionnent bien des Samariens servant dans l’armée et des fonctionnaires aux noms israélites, de sorte que les exilés ne disparurent pas, mais où ils vivaient à Chalach, on l’ignore."
    - "Le district est aujourd’hui le nord du gouvernorat de Ninive, en Irak, autour de Mossoul et des contreforts vers Dohouk, où l’on cherche d’ordinaire Halahhu près du village moderne d’al-Abbasiyah."
