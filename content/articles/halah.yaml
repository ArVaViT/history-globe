body:
  en:
    - "Halah is the first of the places to which the Assyrians deported the people of the northern kingdom. When Samaria fell in the ninth year of Hoshea, the king of Assyria “carried Israel away into Assyria, and placed them in Halah and in Habor by the river of Gozan, and in the cities of the Medes”; the note is repeated in the account of Hezekiah, and Chronicles says the same of the tribes east of the Jordan, carried off earlier by Tiglath-pileser III “unto Halah, and Habor, and Hara, and to the river Gozan, unto this day”. Halah thus stands with the Habor valley and Media as a region of exile, and the Bible says nothing else about it. Some commentators also find it in Obadiah, reading “this host” of the exiles as “Halah”, but that is an emendation."
    - "Assyrian records know a town and district Halahhu in the Assyrian heartland north-east of Nineveh, toward the hills; it appears in administrative and legal texts, and in the second millennium BC it was a province, and the name fits the Hebrew exactly. Most scholars therefore place Halah there, in the plain between Nineveh and the mountains, where the great kings settled deportees to farm royal estates. The identification rests on the name, since the deportees have left no trace of their own; the alternatives, a site on the Habor or the city of Calah (Nimrud), have found little support. Assyrian texts of the next decades do mention Samarians serving in the army and officials with Israelite names, so the exiles did not vanish, but where in Halah they lived is unknown."
    - "The district is today the north of the Nineveh governorate of Iraq, around Mosul and the foothills toward Dohuk, where the Halahhu region took in the site of Sargon II's capital Dur-Sharrukin, modern Khorsabad, about 9 km from the map's point."
  ru:
    - "Халах — первое из мест, куда ассирийцы переселили народ северного царства. Когда Самария пала в девятый год Осии, царь Ассирийский «переселил Израильтян в Ассирию, и поселил их в Халахе и в Хаворе, при реке Гозан, и в городах Мидийских»; заметка повторена в рассказе о Езекии, и Паралипоменон говорит то же о заиорданских коленах, уведённых раньше Феглафелласаром III в Халах, Хавор и Ару и на реку Гозан. Так Халах стоит рядом с долиной Хавора и Мидией как область изгнания, и больше Библия о нём ничего не говорит. Некоторые толкователи находят его и у Авдия, читая «войско» переселенцев как «Халах», но это уже исправление текста."
    - "Ассирийские записи знают город и округ Халахху в сердце Ассирии, к северо-востоку от Ниневии, в сторону гор; он встречается в хозяйственных и правовых текстах, а во II тысячелетии до н. э. был провинцией, и имя точно отвечает еврейскому. Поэтому большинство учёных помещает Халах туда, на равнину между Ниневией и горами, где великие цари сажали переселенцев возделывать царские земли. Отождествление держится на имени, ведь сами переселенцы следов не оставили; другие предложения — место на Хаворе или город Калах (Нимруд) — поддержки почти не нашли. Ассирийские тексты ближайших десятилетий упоминают самарян на службе в войске и чиновников с израильскими именами, так что изгнанники не исчезли, но где именно в Халахе они жили, неизвестно."
    - "Сегодня этот округ — север иракской провинции Найнава, вокруг Мосула и предгорий в сторону Дахука, где область Халахху включала место столицы Саргона II Дур-Шаррукина, нынешнего Хорсабада, примерно в 9 км от точки на карте."
  uk:
    - "Халах — перше з місць, куди ассирійці виселили людей північного царства. Коли Самарія впала дев’ятого року Осії, цар Ассирії «одвів Ізрайлитян полонянами в Ассирию й поселив їх в Халасї й в Хаборі, при ріцї Гозан, та по Мидийських городах»; ця примітка повторюється в оповіді про Єзекію, а Хроніки кажуть те саме про коліна по той бік Йордану, виведені раніше Тіглатпаласаром III «в Халах і Хавір, і Ару, й на ріку Гозан, — де вони й до сього часу». Так Халах стоїть разом з долиною Хавора та Мідією як край вигнання, і більше Біблія про нього нічого не каже. Деякі коментатори знаходять його й у Овадії, читаючи «війська синів Ізрайлевих» у вигнанців як «Халах», але це виправлення тексту."
    - "Ассирійські записи знають місто й округу Халахху в ассирійському осередді на північний схід від Ніневії, у бік пагорбів; вони з’являються в адміністративних і правових текстах, а в II тисячолітті до н. е. округа була провінцією, і назва цілком відповідає давньоєврейській. Тому більшість дослідників розміщують Халах там, на рівнині між Ніневією та горами, де великі царі селили депортованих обробляти царські маєтки. Це ототожнення спирається на назву, бо самі депортовані не залишили власного сліду; альтернативи — місце на Хаворі або місто Калах (Німруд) — знайшли мало підтримки. Ассирійські тексти наступних десятиліть таки згадують самарійців на військовій службі та чиновників з ізраїльськими іменами, тож вигнанці не зникли, але де саме в Халаху вони жили, невідомо."
    - "Ця округа нині — північ губернаторства Ніневія в Іраку, довкола Мосула та передгір’їв у бік Духока, де область Халахху охоплювала місце столиці Саргона II Дур-Шаррукіна, нинішнього Хорсабада, приблизно за 9 км від точки на мапі."
  es:
    - "Halah es el primero de los lugares a los que los asirios deportaron al pueblo del reino del norte. Cuando Samaria cayó en el año noveno de Oseas, el rey de Asiria «trasportó á Israel á Asiria, y púsolos en Hala, y en Habor, junto al río de Gozán, y en las ciudades de los Medos»; la noticia se repite en el relato de Ezequías, y Crónicas dice lo mismo de las tribus al este del Jordán, llevadas antes por Tiglat-pileser III «á Halad, y á Habor y á Ara, y al río de Gozán, hasta hoy». Halah figura así, con el valle del Habor y Media, como región de destierro, y la Biblia no dice nada más de ella. Algunos comentaristas la hallan también en Abdías, leyendo «aqueste ejército» de los desterrados como «Halah», pero eso es una enmienda."
    - "Los registros asirios conocen una población y distrito Halahhu en el corazón de Asiria, al nordeste de Nínive, hacia las colinas; aparece en textos administrativos y jurídicos, y en el segundo milenio a. C. fue una provincia, y el nombre encaja exactamente con el hebreo. La mayoría de los estudiosos sitúan por tanto Halah allí, en la llanura entre Nínive y las montañas, donde los grandes reyes establecían deportados para cultivar fincas reales. La identificación se apoya en el nombre, pues los deportados no han dejado rastro propio; las alternativas, un sitio en el Habor o la ciudad de Cala (Nimrud), han hallado poco apoyo. Los textos asirios de las décadas siguientes mencionan a samarios que servían en el ejército y a funcionarios con nombres israelitas, de modo que los desterrados no desaparecieron, pero se ignora dónde vivieron en Halah."
    - "El distrito es hoy el norte de la gobernación de Nínive, en Irak, en torno a Mosul y las estribaciones hacia Dohuk, donde la región de Halahhu abarcaba el sitio de la capital de Sargón II, Dur-Sharrukin, la actual Jorsabad, a unos 9 km del punto del mapa."
  pt:
    - "Halá é o primeiro dos lugares para onde os assírios deportaram o povo do reino do norte. Quando Samaria caiu no nono ano de Oseias, o rei da Assíria “levou Israel cativo para a Assíria, e os colocou em Hala, e junto a Habor, o rio de Gozã, e nas cidades dos medos”; a nota é repetida no relato de Ezequias, e Crônicas diz o mesmo das tribos a leste do Jordão, levadas antes por Tiglate-Pileser III “para Hala, Habor, Hara e para o rio Gozã, até o dia de hoje”. Halá figura assim, com o vale do Habor e a Média, como região de exílio, e a Bíblia nada mais diz sobre ela. Alguns comentaristas a encontram também em Obadias, lendo como “Halá” o “exército” dos exilados, mas isso é uma emenda."
    - "Os registros assírios conhecem uma cidade e distrito Halahhu no coração da Assíria, a nordeste de Nínive, rumo às colinas; aparece em textos administrativos e jurídicos, e no segundo milênio a.C. foi uma província, e o nome se ajusta exatamente ao hebraico. A maioria dos estudiosos, portanto, situa Halá ali, na planície entre Nínive e as montanhas, onde os grandes reis estabeleciam deportados para cultivar propriedades reais. A identificação repousa no nome, pois os deportados não deixaram vestígios próprios; as alternativas, um sítio no Habor ou a cidade de Calá (Nimrud), encontraram pouco apoio. Textos assírios das décadas seguintes mencionam habitantes de Samaria servindo no exército e funcionários com nomes israelitas, de modo que os exilados não desapareceram, mas onde em Halá viveram é desconhecido."
    - "O distrito é hoje o norte da província de Nínive, no Iraque, em torno de Mossul e das colinas rumo a Dohuk, onde a região de Halahhu abrangia o sítio da capital de Sargão II, Dur-Sharrukin, a atual Khorsabad, a cerca de 9 km do ponto do mapa."
  de:
    - "Halach ist der erste der Orte, in die die Assyrer die Bevölkerung des Nordreichs verschleppten. Als Samaria im neunten Jahr Hoseas fiel, „führte“ der König von Assyrien „Israel weg nach Assyrien und setzte sie nach Halah und an den Habor, an das Wasser Gosan und in die Städte der Meder“; die Notiz wird im Bericht über Hiskia wiederholt, und die Chronik sagt dasselbe von den Stämmen östlich des Jordan, die Tiglat-Pileser III. früher weggeführt hatte „gen Halah und an den Habor und gen Hara und an das Wasser Gosan bis auf diesen Tag“. Halach steht somit mit dem Habortal und Medien als Verbannungsgebiet, und die Bibel sagt sonst nichts darüber. Manche Ausleger finden es auch bei Obadja, indem sie „dieses Heeres“ der Verbannten zu „Halach“ ändern, doch das ist eine Konjektur."
    - "Assyrische Quellen kennen eine Stadt und einen Bezirk Halahhu im assyrischen Kernland nordöstlich von Ninive, zu den Bergen hin; er erscheint in Verwaltungs- und Rechtstexten, und im zweiten Jahrtausend v. Chr. war er eine Provinz, und der Name passt genau zum Hebräischen. Die meisten Forscher setzen Halach daher dort an, in der Ebene zwischen Ninive und den Bergen, wo die Großkönige Deportierte ansiedelten, um königliche Güter zu bewirtschaften. Die Gleichsetzung beruht auf dem Namen, da die Verschleppten keine eigene Spur hinterlassen haben; die Alternativen, eine Stätte am Habor oder die Stadt Kalach (Nimrud), haben wenig Unterstützung gefunden. Assyrische Texte der folgenden Jahrzehnte erwähnen Samarier im Heer und Beamte mit israelitischen Namen, die Verbannten verschwanden also nicht, doch wo in Halach sie lebten, ist unbekannt."
    - "Der Bezirk ist heute der Norden des irakischen Gouvernements Ninive, um Mossul und die Vorberge Richtung Dohuk, wo die Region Halahhu die Stätte von Sargons II. Hauptstadt Dur-Scharrukin umfasste, dem heutigen Chorsabad, etwa 9 km vom Punkt auf der Karte."
  fr:
    - "Chalach est le premier des lieux où les Assyriens déportèrent le peuple du royaume du nord. Quand Samarie tomba la neuvième année d’Osée, le roi d’Assyrie « emmena Israël captif en Assyrie. Il les fit habiter à Chalach, et sur le Chabor, fleuve de Gozan, et dans les villes des Mèdes » ; la notice est répétée dans le récit d’Ézéchias, et les Chroniques disent la même chose des tribus à l’est du Jourdain, emmenées plus tôt par Tiglath-Piléser III « à Chalach, à Chabor, à Hara, et au fleuve de Gozan, où ils sont demeurés jusqu’à ce jour ». Chalach figure ainsi avec la vallée du Chabor et la Médie comme région d’exil, et la Bible n’en dit rien d’autre. Certains commentateurs la trouvent aussi chez Abdias, en lisant « cette armée » des exilés comme « Chalach », mais c’est une correction du texte."
    - "Les archives assyriennes connaissent une ville et un district Halahhu dans le cœur de l’Assyrie, au nord-est de Ninive, vers les collines ; il apparaît dans des textes administratifs et juridiques, et au IIe millénaire av. J.-C. c’était une province, et le nom correspond exactement à l’hébreu. La plupart des spécialistes y placent donc Chalach, dans la plaine entre Ninive et les montagnes, où les grands rois installaient des déportés pour cultiver des domaines royaux. L’identification repose sur le nom, puisque les déportés n’ont laissé aucune trace propre ; les autres hypothèses, un site sur le Chabor ou la ville de Calach (Nimroud), ont trouvé peu de soutien. Des textes assyriens des décennies suivantes mentionnent bien des Samariens servant dans l’armée et des fonctionnaires aux noms israélites, de sorte que les exilés ne disparurent pas, mais où ils vivaient à Chalach, on l’ignore."
    - "Le district est aujourd’hui le nord du gouvernorat de Ninive, en Irak, autour de Mossoul et des contreforts vers Dohouk, où la région de Halahhu englobait le site de la capitale de Sargon II, Dur-Sharrukin, l’actuelle Khorsabad, à environ 9 km du point de la carte."
  pl:
    - "Chalach jest pierwszym z miejsc, do których Asyryjczycy deportowali ludność królestwa północnego. Gdy w dziewiątym roku Ozeasza padła Samaria, król Asyrii „przeniósł Izraela do Assyryi, a osadził je w Hala i w Habor nad rzeką Gozan i w miastach Medskich”; wzmianka powtarza się w opowieści o Ezechiaszu, a Księgi Kronik mówią to samo o pokoleniach na wschód od Jordanu, wywiezionych wcześniej przez Tiglat-Pilesera III „do Hela, i Haboru, i do Ara, i do rzeki Gozan, aż do dnia tego”. Chalach stoi więc z doliną Chaburu i Medią jako region wygnania, a Biblia nic więcej o nim nie mówi. Niektórzy komentatorzy znajdują go także u Abdiasza, czytając „tego wojska” wygnańców jako „Chalach”, lecz jest to poprawka tekstu."
    - "Asyryjskie zapisy znają miasto i okręg Chalachchu w sercu Asyrii na północny wschód od Niniwy, ku wzgórzom; występuje w tekstach administracyjnych i prawnych, a w II tysiącleciu p.n.e. był prowincją, a nazwa pasuje do hebrajskiej dokładnie. Większość uczonych umieszcza więc Chalach tam, na równinie między Niniwą a górami, gdzie wielcy królowie osiedlali deportowanych do uprawy królewskich posiadłości. Utożsamienie opiera się na nazwie, ponieważ deportowani nie zostawili własnych śladów; alternatywy, stanowisko nad Chaburem lub miasto Kalach (Nimrud), znalazły niewielkie poparcie. Asyryjskie teksty z następnych dziesięcioleci wspominają o Samarytanach służących w wojsku i urzędnikach z izraelskimi imionami, więc wygnańcy nie znikli, lecz gdzie w Chalach mieszkali, nie wiadomo."
    - "Okręg to dziś północ muhafazy Niniwa w Iraku, wokół Mosulu i podnóża gór ku Dahukowi, gdzie region Chalachchu obejmował miejsce stolicy Sargona II, Dur-Szarrukin, dzisiejszego Chorsabadu, około 9 km od punktu na mapie."
  it:
    - "Chelach è il primo dei luoghi in cui gli Assiri deportarono il popolo del regno del nord. Quando Samaria cadde nel nono anno di Osea, il re d’Assiria «trasportò gl’Israeliti in Assiria e li collocò in Halah, e sullo Habor, fiume di Gozan, e nelle città dei Medi»; la nota è ripetuta nel racconto di Ezechia, e le Cronache dicono lo stesso delle tribù a est del Giordano, deportate prima da Tiglat-Pilèser III «a Halah, ad Habor, ad Hara e presso al fiume di Gozan, dove son rimasti fino al dì d’oggi». Chelach sta dunque con la valle del Cabor e la Media come regione d’esilio, e la Bibbia non ne dice altro. Alcuni commentatori la trovano anche in Abdia, leggendo «questo esercito» degli esuli come «Halah», ma è un’emendazione."
    - "I documenti assiri conoscono una città e un distretto Halahhu nel cuore dell’Assiria a nord-est di Ninive, verso i monti; compare in testi amministrativi e giuridici, e nel II millennio a.C. fu una provincia, e il nome corrisponde esattamente all’ebraico. La maggior parte degli studiosi vi colloca perciò Chelach, nella pianura fra Ninive e le montagne, dove i grandi re insediavano deportati a coltivare le tenute reali. L’identificazione poggia sul nome, poiché i deportati non hanno lasciato tracce proprie; le alternative, un sito sul Cabor o la città di Calach (Nimrud), hanno trovato poco sostegno. I testi assiri dei decenni seguenti menzionano uomini di Samaria che servono nell’esercito e funzionari con nomi israelitici, così gli esuli non svanirono, ma dove vivessero in Chelach è ignoto."
    - "Il distretto è oggi il nord del governatorato iracheno di Ninive, intorno a Mosul e alle pendici verso Dohuk, dove la regione di Halahhu comprendeva il sito della capitale di Sargon II, Dur-Sharrukin, l’odierna Khorsabad, a circa 9 km dal punto sulla mappa."
  nl:
    - "Chalach is de eerste van de plaatsen waarheen de Assyriërs het volk van het noordelijke koninkrijk wegvoerden. Toen Samaria viel in het negende jaar van Hosea, voerde de koning van Assyrië “Israel weg in Assyrie, en deed ze wonen in Halah, en in Habor, aan de rivier Gozan, en in de steden der Meden”; de aantekening wordt herhaald in het verslag over Chizkia, en Kronieken zegt hetzelfde van de stammen ten oosten van de Jordaan, eerder weggevoerd door Tiglat-Pileser III “te Halah, en Habor, en Hara, en aan de rivier Gozan, tot op dezen dag”. Chalach staat zo naast het Chabordal en Medië als gebied van ballingschap, en de Bijbel zegt er verder niets over. Sommige uitleggers vinden het ook in Obadja, door “dit heir” van de ballingen als “Chalach” te lezen, maar dat is een emendatie."
    - "Assyrische bronnen kennen een stad en district Halahhu in het Assyrische kerngebied ten noordoosten van Nineve, richting de heuvels; het komt voor in administratieve en juridische teksten, en in het tweede millennium v.Chr. was het een provincie, en de naam past precies bij het Hebreeuws. De meeste geleerden plaatsen Chalach daarom daar, in de vlakte tussen Nineve en de bergen, waar de grote koningen ontheemden vestigden om koninklijke landgoederen te bewerken. De identificatie berust op de naam, omdat de ballingen zelf geen spoor hebben nagelaten; de alternatieven, een plaats aan de Chabor of de stad Kalach (Nimrud), vonden weinig steun. Assyrische teksten uit de volgende decennia noemen wel Samariërs in het leger en ambtenaren met Israëlitische namen, dus de ballingen verdwenen niet, maar waar in Chalach zij woonden, is onbekend."
    - "Het district is nu het noorden van het Iraakse gouvernement Nineve, rond Mosul en de uitlopers richting Dohuk, waar de regio Halahhu de plaats van de hoofdstad van Sargon II, Dur-Sharrukin, omvatte, het huidige Khorsabad, ongeveer 9 km van het punt op de kaart."
  cs:
    - "Chalach je první z míst, kam Asyřané deportovali lid severního království. Když Samaří padlo v devátém roce Hóšeově, král asyrský „přenesl Izraele do Assyrie, a osadil je v Chelach a v Chabor při řece Gozan, a v městech Médských“; poznámka se opakuje ve vyprávění o Chizkijášovi a Letopisy praví totéž o kmenech východně od Jordánu, dříve odvlečených Tiglatpilesarem III. „do Chelach a do Chabor, až do Hara a k řece Gozan“. Chalach tak stojí s údolím Chabóru a Médií jako oblast exilu a Bible o něm jinak nic neříká. Někteří komentátoři jej nacházejí i u Obadjáše, když čtou „zajaté vojsko toto“ vyhnanců jako „Chalach“, ale to je oprava textu."
    - "Asyrské záznamy znají město a okres Halahhu v asyrském jádru severovýchodně od Ninive, směrem k pahorkům; objevuje se ve správních a právních textech a ve 2. tisíciletí př. n. l. byl provincií a jméno přesně odpovídá hebrejskému. Většina učenců proto klade Chalach tam, do roviny mezi Ninive a horami, kde velcí králové usazovali deportované, aby obdělávali královské statky. Ztotožnění se opírá o jméno, protože sami deportovaní nezanechali žádnou stopu; alternativy, místo na Chabóru nebo město Kalach (Nimrud), nalezly malou podporu. Asyrské texty příštích desetiletí zmiňují Samařany sloužící ve vojsku a úředníky s izraelskými jmény, takže vyhnanci nezmizeli, ale kde v Chalachu žili, není známo."
    - "Okres je dnes na severu gubernie Ninive v Iráku, kolem Mosulu a podhůří směrem k Dahúku, kde oblast Halahhu zahrnovala místo hlavního města Sargona II. Dur-Šarrukinu, dnešního Chorsabádu, asi 9 km od bodu na mapě."
  sv:
    - "Halach är den första av platserna dit assyrierna förde det norra rikets folk. När Samaria föll i Hoseas nionde år ”förde” Assyriens kung ”Israel bort till Assyrien och lät dem bo i Hala och vid Habor – en ström i Gosan – och i Mediens städer”; uppgiften upprepas i berättelsen om Hiskia, och Krönikeboken säger detsamma om stammarna öster om Jordan, som Tiglat-Pileser III tidigare fört bort ”till Hala, Habor, Hara och Gosans ström, där de äro ännu i dag”. Halach står alltså tillsammans med Habordalen och Medien som en exilregion, och Bibeln säger inget annat om den. Några kommentatorer finner den också hos Obadja, genom att läsa ”här” i uttrycket ”denna Israels barns här” som ”Halach”, men det är en emendation."
    - "Assyriska källor känner en stad och ett distrikt Halahhu i det assyriska kärnlandet nordost om Nineve, mot bergen; den förekommer i administrativa och juridiska texter, och under andra årtusendet f.Kr. var den en provins, och namnet passar det hebreiska exakt. De flesta forskare förlägger därför Halach dit, på slätten mellan Nineve och bergen, där de stora kungarna bosatte deporterade för att bruka kungliga gods. Identifieringen vilar på namnet, eftersom de deporterade inte lämnat några egna spår; alternativen, en plats vid Habor eller staden Kalach (Nimrud), har funnit litet stöd. Assyriska texter från de följande decennierna nämner samarier i armén och ämbetsmän med israelitiska namn, så de landsflyktiga försvann inte, men var i Halach de bodde är okänt."
    - "Distriktet är i dag norra delen av guvernementet Nineve i Irak, kring Mosul och förbergen mot Dohuk, där Halahhu-regionen rymde platsen för Sargon II:s huvudstad Dur-Sharrukin, nutida Khorsabad, omkring 9 km från kartans punkt."
  nb:
    - "Halah er det første av stedene assyrerne deporterte folket fra nordriket til. Da Samaria falt i Hoseas niende år, «bortførte» kongen av Assyria «Israel til Assyria; og han lot dem bo i Halah og ved Habor, en elv i Gosan, og i Medias byer»; notisen gjentas i beretningen om Hiskia, og Krønikebøkene sier det samme om stammene øst for Jordan, bortført tidligere av Tiglat-Pileser 3.: «flyttet dem til Halah og Habor og Hara og Gosan-elven, og der er de den dag idag». Halah står dermed sammen med Habor-dalen og Media som en eksilregion, og Bibelen sier ikke noe annet om den. Noen kommentatorer finner den også hos Obadja, ved å lese «denne Israels hær» om de bortførte som «Halah», men det er en tekstrettelse."
    - "Assyriske opptegnelser kjenner en by og et distrikt Halahhu i det assyriske kjerneområdet nordøst for Ninive, mot åsene; det forekommer i administrative og juridiske tekster, og i det andre årtusen f.Kr. var det en provins, og navnet passer nøyaktig med det hebraiske. De fleste forskere plasserer derfor Halah der, i sletten mellom Ninive og fjellene, hvor de store kongene bosatte deporterte for å drive kongelige gods. Identifikasjonen hviler på navnet, siden de deporterte ikke har etterlatt spor av seg selv; alternativene, et sted ved Habor eller byen Kalah (Nimrud), har funnet liten støtte. Assyriske tekster fra de neste tiårene nevner samarier som tjenestegjør i hæren og embetsmenn med israelittiske navn, så de bortførte forsvant ikke, men hvor i Halah de bodde, er ukjent."
    - "Distriktet er i dag den nordlige delen av guvernementet Ninive i Irak, rundt Mosul og foten av åsene mot Dohuk, der Halahhu-regionen omfattet stedet for Sargon 2.s hovedstad Dur-Sharrukin, dagens Khorsabad, omtrent 9 km fra kartets punkt."
