# Overview article (ADR 0007). Mainstream facts only; a place in Babylonia named only in the lists of returning exiles; its site is unknown; the Synodal Bible joins it with the next names.
id: cherub
place: ab3ad14
title:
  en: "Cherub"
  ru: "Херув"
body:
  en:
    - "Cherub was a place in Babylonia where Judean exiles lived, named only in the lists of those who returned to Judah with Zerubbabel. Ezra and Nehemiah give the same note: “these were they which went up from Tel-melah, Tel-harsa, Cherub, Addan, and Immer: but they could not shew their father’s house, and their seed, whether they were of Israel”. Some of these families, and some priests among them, could not find their genealogies and were set apart until a priest could consult the Urim and Thummim. The Synodal Bible reads the names as compounds, Kherub-Addan-Immer in Ezra and Kheruv-Addon in Nehemiah, so that the Russian text names fewer places than the English."
    - "Nothing more is known. The list puts Cherub beside settlements called Tel-, “mound”, like Tel-abib by the river Chebar, where Ezekiel lived among the exiles, and it was probably one of the villages in which the Babylonians settled deportees to farm the land. Cuneiform tablets from the sixth and fifth centuries BC, among them the archive from Al-Yahudu, “the town of Judah”, show such communities in central and southern Babylonia, but none of them names Cherub. The map can only mark Babylonia in general."
  ru:
    - "Херув — место в Вавилонии, где жили иудейские пленники, названное только в списках возвратившихся в Иудею с Зоровавелем. Ездра и Неемия дают одну и ту же заметку: «И вот вышедшие из Тел-Мелаха, Тел-Харши, Херув-Аддона и Иммера; но они не могли показать о поколении своем и о племени своем, от Израиля ли они». Часть этих семей, и среди них священники, не нашли своих родословий и были отстранены, пока не встанет священник с уримом и туммимом. Синодальный перевод читает имена слитно — «Херуб-Аддан-Иммер» у Ездры и «Херув-Аддон» у Неемии, — так что в русском тексте мест меньше, чем в английском."
    - "Больше ничего не известно. Список ставит Херув рядом с поселениями, чьи имена начинаются с «Тел», «холм», как Тел-Авив при реке Ховаре, где Иезекииль жил среди переселенцев, и это было, вероятно, одно из селений, куда вавилоняне сажали переселённых обрабатывать землю. Клинописные таблички VI–V веков до н. э., среди них архив из Аль-Яхуду, «города Иудеи», показывают такие общины в средней и южной Вавилонии, но ни одна из них не называет Херува. Карта может отметить лишь Вавилонию в целом."
scripture:
