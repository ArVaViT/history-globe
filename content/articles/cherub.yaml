# Overview article (ADR 0007). Mainstream facts only; a place in Babylonia named only in the lists of returning exiles; its site is unknown; the Synodal Bible joins it with the next names.
id: cherub
place: ab3ad14
title:
  en: "Cherub"
  ru: "Херув"
  uk: "Херув"
  es: "Querub"
  pt: "Querube"
  de: "Kerub"
  fr: "Kérub"
body:
  en:
    - "Cherub was a place in Babylonia where Judean exiles lived, named only in the lists of those who returned to Judah with Zerubbabel. Ezra and Nehemiah give the same note: “these were they which went up from Tel-melah, Tel-harsa, Cherub, Addan, and Immer: but they could not shew their father’s house, and their seed, whether they were of Israel”. Some of these families, and some priests among them, could not find their genealogies and were set apart until a priest could consult the Urim and Thummim. The Synodal Bible reads the names as compounds, Kherub-Addan-Immer in Ezra and Kheruv-Addon in Nehemiah, so that the Russian text names fewer places than the English."
    - "Nothing more is known. The list puts Cherub beside settlements called Tel-, “mound”, like Tel-abib by the river Chebar, where Ezekiel lived among the exiles, and it was probably one of the villages in which the Babylonians settled deportees to farm the land. Cuneiform tablets from the sixth and fifth centuries BC, among them the archive from Al-Yahudu, “the town of Judah”, show such communities in central and southern Babylonia, but none of them names Cherub. The map can only mark Babylonia in general."
  ru:
    - "Херув — место в Вавилонии, где жили иудейские пленники, названное только в списках возвратившихся в Иудею с Зоровавелем. Ездра и Неемия дают одну и ту же заметку: «И вот вышедшие из Тел-Мелаха, Тел-Харши, Херув-Аддона и Иммера; но они не могли показать о поколении своем и о племени своем, от Израиля ли они». Часть этих семей, и среди них священники, не нашли своих родословий и были отстранены, пока не встанет священник с уримом и туммимом. Синодальный перевод читает имена слитно — «Херуб-Аддан-Иммер» у Ездры и «Херув-Аддон» у Неемии, — так что в русском тексте мест меньше, чем в английском."
    - "Больше ничего не известно. Список ставит Херув рядом с поселениями, чьи имена начинаются с «Тел», «холм», как Тел-Авив при реке Ховаре, где Иезекииль жил среди переселенцев, и это было, вероятно, одно из селений, куда вавилоняне сажали переселённых обрабатывать землю. Клинописные таблички VI–V веков до н. э., среди них архив из Аль-Яхуду, «города Иудеи», показывают такие общины в средней и южной Вавилонии, но ни одна из них не называет Херува. Карта может отметить лишь Вавилонию в целом."
  uk:
    - "Херув був місцем у Вавилонії, де жили юдейські вигнанці, і названий лише в списках тих, хто повернувся до Юди з Зоровавелем. Ездра й Неемія подають ту саму примітку: «А оце ті, що вийшли з Телмелаха, Тел-харші, Херуб-Аддан-Іммера, та що не могли сказати про своє поколїннє й про своє племя — чи вони від Ізраїля». Деякі з цих родин і деякі священники серед них не змогли знайти своїх родоводів і були відсторонені, доки священник не зможе звернутися до урим і туммім. Синодальний переклад читає ці назви як складені — Херув-Аддан-Іммер в Ездри та Херув-Аддон у Неемії, — так що російський текст називає менше місць, ніж англійський."
    - "Більше нічого не відомо. Список ставить Херув поряд із поселеннями на ім'я Тель-, «горб», як Тел-Авів над річкою Хебар, де Єзекіїль жив серед вигнанців, і він, імовірно, був одним із сіл, куди вавилоняни оселяли переселенців обробляти землю. Клинописні таблички VI–V ст. до н. е., серед них архів з аль-Яхуду, «міста Юди», показують такі громади в центральній і південній Вавилонії, але жодна з них не називає Херува. Мапа може позначити лише Вавилонію загалом."
  es:
    - "Querub era un lugar de Babilonia donde vivían desterrados judíos, nombrado solo en las listas de quienes regresaron a Judá con Zorobabel. Esdras y Nehemías dan la misma nota: «Y estos fueron los que subieron de Tel-mela, Tel-harsa, Chêrub, Addan, é Immer, los cuales no pudieron mostrar la casa de sus padres, ni su linaje, si eran de Israel». Algunas de estas familias, y algunos sacerdotes entre ellas, no pudieron hallar sus genealogías y fueron apartados hasta que un sacerdote pudiera consultar el Urim y el Tumim. La Biblia sinodal lee los nombres como compuestos, Kherub-Addan-Immer en Esdras y Kheruv-Addon en Nehemías, de modo que el texto ruso nombra menos lugares que el inglés."
    - "No se sabe nada más. La lista sitúa Querub junto a asentamientos llamados Tel-, «montículo», como Tel-abib junto al río Quebar, donde Ezequiel vivía entre los desterrados, y probablemente era una de las aldeas en las que los babilonios asentaban a los deportados para que cultivaran la tierra. Tablillas cuneiformes de los siglos VI y V a. C., entre ellas el archivo de Al-Yahudu, «la ciudad de Judá», muestran comunidades así en el centro y el sur de Babilonia, pero ninguna nombra Querub. El mapa solo puede señalar Babilonia en general."
  pt:
    - "Querube era um lugar na Babilônia onde viviam exilados judeus, nomeado apenas nas listas dos que voltaram a Judá com Zorobabel. Esdras e Neemias dão a mesma nota: “Estes foram os que subiram de Tel-Melá, Tel-Harsa, Querube, Adã e Imer; mas eles não puderam provar as casas de seus pais e sua descendência, se eles eram de Israel”. Algumas dessas famílias, e alguns sacerdotes entre elas, não puderam achar suas genealogias e foram postos à parte até que um sacerdote pudesse consultar o Urim e o Tumim. A Bíblia Sinodal lê os nomes como compostos, Kherub-Addan-Immer em Esdras e Kheruv-Addon em Neemias, de modo que o texto russo nomeia menos lugares que o texto inglês."
    - "Nada mais se sabe. A lista põe Querube ao lado de povoados chamados Tel-, “monte”, como Tel-Abibe, junto ao rio Quebar, onde Ezequiel vivia entre os exilados, e ele era provavelmente uma das aldeias em que os babilônios fixavam deportados para cultivar a terra. Tabuinhas cuneiformes dos séculos VI e V a.C., entre elas o arquivo de Al-Yahudu, “a cidade de Judá”, mostram tais comunidades no centro e no sul da Babilônia, mas nenhuma delas nomeia Querube. O mapa só pode assinalar a Babilônia em geral."
  de:
    - "Kerub war ein Ort in Babylonien, an dem judäische Exilierte lebten, nur in den Listen derer genannt, die mit Serubbabel nach Juda zurückkehrten. Esra und Nehemia geben dieselbe Notiz: „Und diese zogen auch mit herauf von Thel-Melah, Thel-Harsa, Cherub, Addon und Immer, aber sie konnten nicht anzeigen ihr Vaterhaus noch ihr Geschlecht, ob sie aus Israel wären“. Einige dieser Familien, und einige Priester unter ihnen, konnten ihre Geschlechtsregister nicht finden und wurden zurückgestellt, bis ein Priester Urim und Tummim befragen könne. Die Synodalbibel liest die Namen als Zusammensetzungen, Cherub-Addan-Immer bei Esra und Cheruv-Addon bei Nehemia, sodass der russische Text weniger Orte nennt als der englische."
    - "Mehr ist nicht bekannt. Die Liste stellt Kerub neben Siedlungen mit dem Namen Tel-, „Hügel“, wie Tel-Abib am Fluss Kebar, wo Hesekiel unter den Exilierten lebte, und es war wahrscheinlich eines der Dörfer, in denen die Babylonier Deportierte ansiedelten, damit sie das Land bestellten. Keilschrifttafeln des 6. und 5. Jahrhunderts v. Chr., darunter das Archiv aus al-Jahudu, „Stadt Judas“, zeigen solche Gemeinden in Mittel- und Südbabylonien, doch keine nennt Kerub. Die Karte kann nur Babylonien im Allgemeinen markieren."
  fr:
    - "Kérub était un lieu de Babylonie où vivaient des exilés judéens, nommé seulement dans les listes de ceux qui revinrent en Juda avec Zorobabel. Esdras et Néhémie donnent la même note : « Voici ceux qui partirent de Thel-Mélach, de Thel-Harscha, de Kerub-Addan, et qui ne purent pas faire connaître leur maison paternelle et leur race, pour prouver qu’ils étaient d’Israël ». Certaines de ces familles, dont des prêtres, ne purent retrouver leurs généalogies et furent mises à l’écart jusqu’à ce qu’un prêtre puisse consulter l’Urim et le Thummim. La Bible synodale lit les noms comme des composés, Kherub-Addan-Immer chez Esdras et Kheruv-Addon chez Néhémie, si bien que le texte russe nomme moins de lieux que l’anglais ; la Louis Segond lit de même un composé, Kerub-Addan chez Esdras, Kerub-Addon et Immer chez Néhémie."
    - "On n’en sait pas davantage. La liste place Kérub à côté d’établissements nommés Tel-, « tertre », comme Tel-Abib près du fleuve Kebar, où Ézéchiel vécut parmi les exilés, et c’était probablement l’un des villages où les Babyloniens installaient des déportés pour cultiver la terre. Des tablettes cunéiformes des VIe et Ve siècles av. J.-C., dont les archives d’Al-Yahudu, « la ville de Juda », montrent de telles communautés en Babylonie centrale et méridionale, mais aucune ne nomme Kérub. La carte ne peut marquer que la Babylonie en général."
