  nb: "Kerub"
body:
  en:
    - "Cherub was a place in Babylonia where Judean exiles lived, named only in the lists of those who returned to Judah with Zerubbabel. Ezra and Nehemiah give the same note: “these were they which went up from Tel-melah, Tel-harsa, Cherub, Addan, and Immer: but they could not shew their father’s house, and their seed, whether they were of Israel”. These families could not prove their descent, and the priests among them whose register was not found were put from the priesthood until a priest should stand up with Urim and Thummim. The Synodal Bible reads the names as compounds, Kherub-Addan-Immer in Ezra and Kheruv-Addon in Nehemiah, so that the Russian text names fewer places than the English."
    - "Nothing more is known. The list puts Cherub beside settlements called Tel-, “mound”, like Tel-abib by the river Chebar, where Ezekiel lived among the exiles, and it was probably one of the villages in which the Babylonians settled deportees to farm the land. Cuneiform tablets from the sixth and fifth centuries BC, among them the archive from Al-Yahudu, “the town of Judah”, show such communities in central and southern Babylonia, but none of them names Cherub. The map can only mark Babylonia in general."
  ru:
    - "Херув — место в Вавилонии, где жили иудейские пленники, названное только в списках возвратившихся в Иудею с Зоровавелем. Ездра и Неемия дают одну и ту же заметку: «И вот вышедшие из Тел-Мелаха, Тел-Харши, Херув-Аддона и Иммера; но они не могли показать о поколении своем и о племени своем, от Израиля ли они». Эти семьи не могли доказать своего происхождения, а священники среди них, чья родословная запись не нашлась, были отстранены от священства, пока не встанет священник с уримом и туммимом. Синодальный перевод читает имена слитно — «Херуб-Аддан-Иммер» у Ездры и «Херув-Аддон» у Неемии, — так что в русском тексте мест меньше, чем в английском."
    - "Больше ничего не известно. Список ставит Херув рядом с поселениями, чьи имена начинаются с «Тел», «холм», как Тел-Авив при реке Ховаре, где Иезекииль жил среди переселенцев, и это было, вероятно, одно из селений, куда вавилоняне сажали переселённых обрабатывать землю. Клинописные таблички VI–V веков до н. э., среди них архив из Аль-Яхуду, «города Иудеи», показывают такие общины в средней и южной Вавилонии, но ни одна из них не называет Херува. Карта может отметить лишь Вавилонию в целом."
  uk:
    - "Херув був місцем у Вавилонії, де жили юдейські вигнанці, і названий лише в списках тих, хто повернувся до Юди з Зоровавелем. Ездра й Неемія подають ту саму примітку: «А оце ті, що вийшли з Телмелаха, Тел-харші, Херуб-Аддан-Іммера, та що не могли сказати про своє поколїннє й про своє племя — чи вони від Ізраїля». Ці родини не змогли довести свого походження, а священники серед них, чийого родоводу не знайшли, були усунені від священства, доки не постане священник з урим і туммім. Синодальний переклад читає ці назви як складені — Херув-Аддан-Іммер в Ездри та Херув-Аддон у Неемії, — так що російський текст називає менше місць, ніж англійський."
    - "Більше нічого не відомо. Список ставить Херув поряд із поселеннями на ім'я Тель-, «горб», як Тел-Авів над річкою Хебар, де Єзекіїль жив серед вигнанців, і він, імовірно, був одним із сіл, куди вавилоняни оселяли переселенців обробляти землю. Клинописні таблички VI–V ст. до н. е., серед них архів з аль-Яхуду, «міста Юди», показують такі громади в центральній і південній Вавилонії, але жодна з них не називає Херува. Мапа може позначити лише Вавилонію загалом."
  es:
    - "Querub era un lugar de Babilonia donde vivían desterrados judíos, nombrado solo en las listas de quienes regresaron a Judá con Zorobabel. Esdras y Nehemías dan la misma nota: «Y estos fueron los que subieron de Tel-mela, Tel-harsa, Chêrub, Addan, é Immer, los cuales no pudieron mostrar la casa de sus padres, ni su linaje, si eran de Israel». Estas familias no pudieron probar su ascendencia, y los sacerdotes entre ellas cuyo registro no se halló fueron excluidos del sacerdocio hasta que se levantara un sacerdote con el Urim y el Tumim. La Biblia sinodal lee los nombres como compuestos, Kherub-Addan-Immer en Esdras y Kheruv-Addon en Nehemías, de modo que el texto ruso nombra menos lugares que el inglés."
    - "No se sabe nada más. La lista sitúa Querub junto a asentamientos llamados Tel-, «montículo», como Tel-abib junto al río Quebar, donde Ezequiel vivía entre los desterrados, y probablemente era una de las aldeas en las que los babilonios asentaban a los deportados para que cultivaran la tierra. Tablillas cuneiformes de los siglos VI y V a. C., entre ellas el archivo de Al-Yahudu, «la ciudad de Judá», muestran comunidades así en el centro y el sur de Babilonia, pero ninguna nombra Querub. El mapa solo puede señalar Babilonia en general."
  pt:
    - "Querube era um lugar na Babilônia onde viviam exilados judeus, nomeado apenas nas listas dos que voltaram a Judá com Zorobabel. Esdras e Neemias dão a mesma nota: “Estes foram os que subiram de Tel-Melá, Tel-Harsa, Querube, Adã e Imer; mas eles não puderam provar as casas de seus pais e sua descendência, se eles eram de Israel”. Essas famílias não puderam provar sua descendência, e os sacerdotes entre elas cujo registro não foi achado foram excluídos do sacerdócio até que se levantasse um sacerdote com o Urim e o Tumim. A Bíblia Sinodal lê os nomes como compostos, Kherub-Addan-Immer em Esdras e Kheruv-Addon em Neemias, de modo que o texto russo nomeia menos lugares que o texto inglês."
    - "Nada mais se sabe. A lista põe Querube ao lado de povoados chamados Tel-, “monte”, como Tel-Abibe, junto ao rio Quebar, onde Ezequiel vivia entre os exilados, e ele era provavelmente uma das aldeias em que os babilônios fixavam deportados para cultivar a terra. Tabuinhas cuneiformes dos séculos VI e V a.C., entre elas o arquivo de Al-Yahudu, “a cidade de Judá”, mostram tais comunidades no centro e no sul da Babilônia, mas nenhuma delas nomeia Querube. O mapa só pode assinalar a Babilônia em geral."
  de:
    - "Kerub war ein Ort in Babylonien, an dem judäische Exilierte lebten, nur in den Listen derer genannt, die mit Serubbabel nach Juda zurückkehrten. Esra und Nehemia geben dieselbe Notiz: „Und diese zogen auch mit herauf von Thel-Melah, Thel-Harsa, Cherub, Addon und Immer, aber sie konnten nicht anzeigen ihr Vaterhaus noch ihr Geschlecht, ob sie aus Israel wären“. Diese Familien konnten ihre Abstammung nicht nachweisen, und die Priester unter ihnen, deren Geschlechtsregister nicht gefunden wurde, wurden vom Priestertum ausgeschlossen, bis ein Priester mit Urim und Tummim aufträte. Die Synodalbibel liest die Namen als Zusammensetzungen, Cherub-Addan-Immer bei Esra und Cheruv-Addon bei Nehemia, sodass der russische Text weniger Orte nennt als der englische."
    - "Mehr ist nicht bekannt. Die Liste stellt Kerub neben Siedlungen mit dem Namen Tel-, „Hügel“, wie Tel-Abib am Fluss Kebar, wo Hesekiel unter den Exilierten lebte, und es war wahrscheinlich eines der Dörfer, in denen die Babylonier Deportierte ansiedelten, damit sie das Land bestellten. Keilschrifttafeln des 6. und 5. Jahrhunderts v. Chr., darunter das Archiv aus al-Jahudu, „Stadt Judas“, zeigen solche Gemeinden in Mittel- und Südbabylonien, doch keine nennt Kerub. Die Karte kann nur Babylonien im Allgemeinen markieren."
  fr:
    - "Kérub était un lieu de Babylonie où vivaient des exilés judéens, nommé seulement dans les listes de ceux qui revinrent en Juda avec Zorobabel. Esdras et Néhémie donnent la même note : « Voici ceux qui partirent de Thel-Mélach, de Thel-Harscha, de Kerub-Addan, et qui ne purent pas faire connaître leur maison paternelle et leur race, pour prouver qu’ils étaient d’Israël ». Ces familles ne purent prouver leur origine, et les prêtres parmi elles dont le registre ne fut pas trouvé furent exclus du sacerdoce jusqu’à ce qu’un prêtre se lève avec l’Urim et le Thummim. La Bible synodale lit les noms comme des composés, Kherub-Addan-Immer chez Esdras et Kheruv-Addon chez Néhémie, si bien que le texte russe nomme moins de lieux que l’anglais ; la Louis Segond lit de même un composé, Kerub-Addan chez Esdras, Kerub-Addon et Immer chez Néhémie."
    - "On n’en sait pas davantage. La liste place Kérub à côté d’établissements nommés Tel-, « tertre », comme Tel-Abib près du fleuve Kebar, où Ézéchiel vécut parmi les exilés, et c’était probablement l’un des villages où les Babyloniens installaient des déportés pour cultiver la terre. Des tablettes cunéiformes des VIe et Ve siècles av. J.-C., dont les archives d’Al-Yahudu, « la ville de Juda », montrent de telles communautés en Babylonie centrale et méridionale, mais aucune ne nomme Kérub. La carte ne peut marquer que la Babylonie en général."
  it:
    - "Cherub era un luogo della Babilonia in cui vivevano esiliati giudei, nominato solo negli elenchi di quelli che tornarono in Giuda con Zorobabele. Esdra e Neemia danno la stessa nota: «quelli che tornarono da Tel-Melah, da Tel-Harsha, da Kerub-Addan, da Immer, e che non poterono indicare la loro casa patriarcale e la loro discendenza per provare ch’erano d’Israele». Queste famiglie non poterono provare la loro discendenza, e i sacerdoti fra loro il cui registro non fu trovato furono esclusi dal sacerdozio finché non sorgesse un sacerdote con l’Urim e il Tummim. La Bibbia sinodale legge i nomi come composti, Kherub-Addan-Immer in Esdra e Kheruv-Addon in Neemia, così che il testo russo nomina meno luoghi di quello inglese."
    - "Non si sa altro. L’elenco pone Cherub accanto a insediamenti chiamati Tel-, «tumulo», come Tel-Abib presso il fiume Chebar, dove Ezechiele viveva fra gli esiliati, ed essa fu probabilmente uno dei villaggi in cui i Babilonesi stanziarono i deportati per coltivare la terra. Tavolette cuneiformi dei secoli VI e V a.C., fra cui l’archivio di Al-Yahudu, «la città di Giuda», mostrano comunità simili nella Babilonia centrale e meridionale, ma nessuna nomina Cherub. La mappa può segnare soltanto la Babilonia in generale."
  pl:
    - "Cherub było miejscem w Babilonii, gdzie mieszkali judzcy wygnańcy, wymienionym tylko w wykazach tych, którzy wrócili do Judy z Zorobabelem. Ezdrasz i Nehemiasz podają tę samą notatkę: „Ci też zasię wyszli z Telmelachu: Telcharsa, Cherub, Addam i Immer; ale nie mogli okazać domu ojców swoich, i nasienia swego, jeźli z Izraela byli”. Te rodziny nie mogły dowieść swego pochodzenia, a kapłani wśród nich, których rodowodu nie odnaleziono, zostali odsunięci od kapłaństwa, dopóki nie stanie kapłan z Urim i Tummim. Biblia synodalna odczytuje nazwy jako złożone, Cherub-Addan-Immer u Ezdrasza i Cheruw-Addon u Nehemiasza, tak że tekst rosyjski wymienia mniej miejsc niż angielski."
    - "Nic więcej nie wiadomo. Lista umieszcza Cherub obok osad zwanych Tel-, „kopiec”, jak Tel-Abib nad rzeką Kebar, gdzie Ezechiel mieszkał wśród wygnańców, i prawdopodobnie była to jedna z wsi, w których Babilończycy osiedlali deportowanych do uprawy ziemi. Tabliczki klinowe z VI i V w. p.n.e., wśród nich archiwum z Al-Jahudu, „miasta Judy”, pokazują takie społeczności w środkowej i południowej Babilonii, lecz żadna nie wymienia Cherub. Mapa może wskazać tylko Babilonię ogólnie."
  nl:
    - "Cherub was een plaats in Babylonië waar Judese ballingen woonden, alleen genoemd in de lijsten van hen die met Zerubbabel naar Juda terugkeerden. Ezra en Nehemia geven dezelfde aantekening: “Dezen togen ook op van Tel-melah, Tel-harsa, Cherub, Addan en Immer; doch zij konden hunner vaderen huis en hun zaad niet bewijzen, of zij uit Israël waren”. Deze families konden hun afkomst niet bewijzen, en de priesters onder hen van wie het geslachtsregister niet werd gevonden, werden van het priesterschap uitgesloten totdat er een priester zou opstaan met de Urim en Tummim. De Synodale Bijbel leest de namen als samenstellingen, Cherub-Addan-Immer in Ezra en Cheruv-Addon in Nehemia, zodat de Russische tekst minder plaatsen noemt dan de Engelse."
    - "Verder is niets bekend. De lijst zet Cherub naast nederzettingen met de naam Tel-, “heuvel”, zoals Tel-Abib aan de rivier de Kebar, waar Ezechiël onder de ballingen woonde, en het was waarschijnlijk een van de dorpen waar de Babyloniërs gedeporteerden vestigden om het land te bewerken. Spijkerschrifttabletten uit de zesde en vijfde eeuw v.Chr., onder meer het archief van Al-Jahudu, “de stad Juda”, tonen zulke gemeenschappen in midden- en zuidelijk Babylonië, maar geen ervan noemt Cherub. De kaart kan alleen Babylonië in het algemeen aanduiden."
  cs:
    - "Kerúb bylo místo v Babylonii, kde žili judští vyhnanci, jmenované jen v seznamech těch, kdo se se Zerubábelem vrátili do Judska. Ezdráš a Nehemjáš podávají stejnou poznámku: „Tito také byli, kteříž šli z Telmelach, Telcharsa, Cherub, Addan a Immer, ale nemohli ukázati domu otců svých a semene svého, že by z Izraele byli“. Tyto rody nemohly prokázat svůj původ a kněží mezi nimi, jejichž rodokmen se nenašel, byli vyloučeni z kněžství, dokud by nepovstal kněz s urim a tumim. Synodální Bible čte jména jako složeniny, Cherub-Addan-Immer u Ezdráše a Cheruv-Addon u Nehemjáše, takže ruský text jmenuje méně míst než anglický."
    - "Nic dalšího se neví. Seznam klade Kerúb vedle osad zvaných Tel-, „pahorek“, jako Tel-abíb u řeky Kebar, kde Ezechiel žil mezi vyhnanci, a byla to pravděpodobně jedna z vesnic, v nichž Babylóňané usazovali odvlečené, aby obdělávali půdu. Klínopisné tabulky ze 6. a 5. století př. n. l., mezi nimi archiv z Al-Yahudu, „města Juda“, ukazují takové obce ve střední a jižní Babylonii, ale žádná nejmenuje Kerúb. Mapa může označit jen Babylonii obecně."
  sv:
    - "Keruv var en plats i Babylonien där judiska bortförda bodde, nämnd bara i förteckningarna över dem som återvände till Juda med Serubbabel. Esra och Nehemja ger samma anmärkning: ”Dessa voro de som drogo åstad från Tel-Mela, Tel-Harsa, Kerub, Addan och Immer, men som icke kunde uppgiva sina familjer och sin släkt och huruvida de voro av Israel”. Dessa släkter kunde inte bevisa sin härkomst, och prästerna bland dem vars släktregister inte fanns utesluts från prästadömet tills en präst skulle uppstå med urim och tummim. Den synodala bibeln läser namnen som sammansättningar, Kherub-Addan-Immer i Esra och Kheruv-Addon i Nehemja, så att den ryska texten nämner färre platser än den engelska."
    - "Mer är inte känt. Förteckningen sätter Keruv bredvid bosättningar som heter Tel-, ”kulle”, som Tel-Abib vid floden Kebar, där Hesekiel bodde bland de bortförda, och det var sannolikt en av byarna där babylonierna bosatte deporterade för att odla jorden. Kilskriftstavlor från 500- och 400-talen f.Kr., bland dem arkivet från Al-Yahudu, ”Judas stad”, visar sådana gemenskaper i centrala och södra Babylonien, men ingen av dem nämner Keruv. Kartan kan bara markera Babylonien i allmänhet."
  nb:
    - "Kerub var et sted i Babylonia der judeiske eksilerte bodde, nevnt bare i listene over dem som vendte tilbake til Juda med Serubabel. Esra og Nehemja gir den samme noten: «Og dette var de som drog hjem fra Tel-Melah, Tel-Harsa, Kerub, Addan og Immer, men ikke kunde opgi sin familie og sin ætt, eller om de var av Israel». Disse familiene kunne ikke bevise sin avstamning, og prestene blant dem, hvis register ikke ble funnet, ble utelukket fra prestedømmet til en prest sto frem med Urim og Tummim. Den synodale bibelen leser navnene som sammensetninger, Kherub-Addan-Immer hos Esra og Kheruv-Addon hos Nehemja, slik at den russiske teksten nevner færre steder enn den engelske."
    - "Mer er ikke kjent. Listen setter Kerub ved siden av bosetninger som heter Tel-, «haug», som Tel-Abib ved elven Kebar, der Esekiel bodde blant de eksilerte, og det var trolig en av landsbyene der babylonerne bosatte deporterte for å dyrke landet. Kileskrifttavler fra 500- og 400-tallet f.Kr., blant dem arkivet fra al-Yahudu, «Judas by», viser slike samfunn i det sentrale og sørlige Babylonia, men ingen av dem nevner Kerub. Kartet kan bare markere Babylonia generelt."
