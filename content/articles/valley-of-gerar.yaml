# Overview article (ADR 0007). Mainstream facts only; the valley follows the usual identification of Gerar with Tel Haror and Nahal Gerar, given as usual rather than certain.
id: valley-of-gerar
place: a816ed9
title:
  en: "Valley of Gerar"
  ru: "Долина Герарская"
  uk: "Долина Герарська"
  es: "Valle de Gerar"
  pt: "Vale de Gerar"
  de: "Gerartal"
  fr: "Vallée de Guérar"
  pl: "Dolina Gerar"
  it: "Valle di Gerar"
  nl: "Dal van Gerar"
  cs: "Gerárské údolí"
  sv: "Gerars dal"
