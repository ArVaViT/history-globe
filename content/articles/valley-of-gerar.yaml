body:
  en:
    - "The valley of Gerar is the wadi beside the town of Gerar in the western Negev, where Isaac camped during a famine after Abimelech, king of the Philistines, had sent him away: “Isaac departed thence, and pitched his tent in the valley of Gerar, and dwelt there.” There he reopened the wells of Abraham which the Philistines had stopped, and his servants “digged in the valley, and found there a well of springing water”; the herdmen of Gerar claimed it, and he named that well Esek, “strife”, and the next Sitnah, before digging Rehoboth, over which there was no quarrel. The valley is not mentioned again."
    - "Gerar is usually identified with Tel Haror (Tell Abu Hureira), a large mound on the north bank of Nahal Gerar (Wadi esh-Sharia), about 27 km north-west of Beersheba, so the valley is taken to be the broad bed of that stream, which runs west to join Nahal Besor on its way to the sea by Gaza and is dry for most of the year, with water only in winter floods and in wells dug in its bed, as in the story. The identification is not certain (Tell Jemmeh and Tell esh-Sharia were earlier candidates), and none of Isaac's wells can be pointed out. Today Nahal Gerar runs past Tel Haror, excavated in the 1980s and early 1990s, through farmland between Beersheba and the Gaza strip."
  ru:
    - "Долина Герарская — русло потока у города Герара в западном Негеве, где Исаак стал станом во время голода, после того как Авимелех, царь Филистимский, отослал его: «И Исаак удалился оттуда, и расположился шатрами в долине Герарской, и поселился там». Там он вновь откопал колодези Авраама, которые завалили Филистимляне, а его рабы «копали… в долине Герарской и нашли там колодезь воды живой»; пастухи Герарские заявили на него права, и он назвал этот колодезь Есек, «спор», а следующий — Ситна, пока не выкопал Реховоф, о котором спора уже не было. Больше долина не упоминается."
    - "Герар обычно отождествляют с Тель-Харором (Телль-Абу-Хурейрой), большим холмом на северном берегу ручья Нахаль-Герар (Вади-эш-Шариа) примерно в 27 км к северо-западу от Вирсавии, так что долиной считают широкое русло этого потока, который течёт на запад и впадает в Нахаль-Бесор, выходящий к морю у Газы, и большую часть года сух: вода в нём бывает только в зимние паводки и в колодцах, выкопанных в русле, как в рассказе. Отождествление не бесспорно (раньше называли Телль-Джемме и Телль-эш-Шариа), и ни один из колодезей Исаака указать нельзя. Сегодня Нахаль-Герар течёт мимо Тель-Харора, раскопанного в 1980-х и начале 1990-х годов, через поля между Вирсавией и сектором Газа."
  uk:
    - "Долина Герарська — вади біля міста Герар у західному Негеві, де Ісаак таборував під час голоду, після того як Авімелех, цар филистимлян, відіслав його: «І зійшов звідти Ізаак, та й зупинивсь у Герар долинї, і вселився там». Там він знову відкрив колодязі Авраама, які филистимляни засипали, і його слуги «копали … та й знайшли там колодязь води живої»; пастухи Герару заявили на нього права, і він назвав той колодязь Есек, «сварка», а наступний Ситна, перш ніж викопав Реховот, за який не було суперечки. Долина більше не згадується."
    - "Герар зазвичай ототожнюють із Тель-Харором (Телль-Абу-Хурейра), великим пагорбом на північному березі Нахаль-Герар (Вади-еш-Шарія), приблизно за 27 км на північний захід від Беер-Шеви, тож долиною вважають широке русло цього потоку, що тече на захід, щоб злитися з Нахаль-Бесор на шляху до моря біля Гази, і більшу частину року сухе, з водою лише в зимових повенях і в колодязях, викопаних у його руслі, як у розповіді. Ототожнення не певне (Телль-Джемме й Телль-еш-Шарія були раніше кандидатами), і жодного з колодязів Ісаака вказати не можна. Нині Нахаль-Герар тече повз Тель-Харор, розкопаний у 1980-х і на початку 1990-х років, через ріллю між Беер-Шевою та сектором Гази."
  es:
    - "El valle de Gerar es el wadi junto a la ciudad de Gerar, en el Néguev occidental, donde Isaac acampó durante una hambruna después de que Abimelec, rey de los filisteos, lo despidiera: «E Isaac se fué de allí; y asentó sus tiendas en el valle de Gerar, y habitó allí». Allí reabrió los pozos de Abraham que los filisteos habían cegado, y sus siervos «cavaron en el valle, y hallaron allí un pozo de aguas vivas»; los pastores de Gerar lo reclamaron, y él llamó a ese pozo Esec, «contienda», y al siguiente Sitna, antes de cavar Rehobot, por el cual no hubo disputa. El valle no se menciona de nuevo."
    - "Gerar se identifica habitualmente con Tel Haror (Tell Abu Hureira), un gran montículo en la orilla norte del Nahal Gerar (Wadi esh-Sharia), a unos 27 km al noroeste de Beerseba, de modo que se toma el valle por el ancho cauce de ese arroyo, que corre hacia el oeste para unirse al Nahal Besor en su camino al mar por Gaza y está seco la mayor parte del año, con agua solo en las crecidas invernales y en pozos cavados en su lecho, como en el relato. La identificación no es segura (Tell Jemmeh y Tell esh-Sharia fueron candidatos anteriores), y no puede señalarse ninguno de los pozos de Isaac. Hoy el Nahal Gerar pasa junto a Tel Haror, excavado en los años 1980 y a comienzos de los 1990, por tierras de cultivo entre Beerseba y la franja de Gaza."
  pt:
    - "O vale de Gerar é o uádi junto à cidade de Gerar, no Neguebe ocidental, onde Isaque acampou durante uma fome depois que Abimeleque, rei dos filisteus, o mandara embora: “Isaque partiu dali, acampou no vale de Gerar e habitou lá.” Ali reabriu os poços de Abraão que os filisteus haviam tapado, e seus servos “cavaram no vale e encontraram ali um poço de água corrente”; os pastores de Gerar o reclamaram, e ele chamou esse poço de Eseque, “contenda”, e o seguinte de Sitna, antes de cavar Reobote, pelo qual não houve disputa. O vale não é mencionado de novo."
    - "Gerar costuma ser identificada com Tel Haror (Tell Abu Hureira), um grande monte na margem norte do Nahal Gerar (Wadi esh-Sharia), a cerca de 27 km a noroeste de Berseba, de modo que o vale é tomado como o amplo leito desse curso, que corre para oeste para juntar-se ao Nahal Besor a caminho do mar junto a Gaza e fica seco a maior parte do ano, com água só nas cheias de inverno e em poços cavados no leito, como na história. A identificação não é certa (Tell Jemmeh e Tell esh-Sharia foram candidatos anteriores), e nenhum dos poços de Isaque pode ser apontado. Hoje o Nahal Gerar passa por Tel Haror, escavado nos anos 1980 e início dos 1990, por terras de cultivo entre Berseba e a faixa de Gaza."
  de:
    - "Das Gerartal ist das Wadi bei der Stadt Gerar im westlichen Negev, wo Isaak während einer Hungersnot lagerte, nachdem Abimelech, der König der Philister, ihn fortgeschickt hatte: „Da zog Isaak von dannen und schlug sein Gezelt auf im Grunde Gerar und wohnte allda.“ Dort ließ er die Brunnen Abrahams wieder aufgraben, die die Philister verstopft hatten; danach: „Auch gruben Isaaks Knechte im Grunde und fanden daselbst einen Brunnen lebendigen Wassers.“ Die Hirten von Gerar beanspruchten ihn, und er nannte diesen Brunnen Esek, „Streit“, und den nächsten Sitna, ehe er Rehobot grub, über den kein Streit entstand. Das Tal wird nicht wieder erwähnt."
    - "Gerar wird meist mit Tel Haror (Tell Abu Hureira) gleichgesetzt, einem großen Hügel am Nordufer des Nahal Gerar (Wadi esh-Sharia), etwa 27 km nordwestlich von Beerscheba, sodass das Tal als das breite Bett dieses Baches gilt, der nach Westen zum Bach Besor fließt, um bei Gaza das Meer zu erreichen, und die meiste Zeit des Jahres trocken ist, mit Wasser nur bei Winterfluten und in Brunnen in seinem Bett, wie in der Erzählung. Die Gleichsetzung ist nicht gesichert (Tell Jemmeh und Tell esh-Sharia waren frühere Kandidaten), und keiner der Brunnen Isaaks lässt sich zeigen. Heute fließt der Nahal Gerar an Tel Haror vorbei, in den 1980er und frühen 1990er Jahren ausgegraben, durch Ackerland zwischen Beerscheba und dem Gazastreifen."
  fr:
    - "La vallée de Guérar est l’oued voisin de la ville de Guérar, dans le Néguev occidental, où Isaac campa pendant une famine après qu’Abimélec, roi des Philistins, l’eut renvoyé : « Isaac partit de là, et campa dans la vallée de Guérar, où il s’établit. » Il y rouvrit les puits d’Abraham que les Philistins avaient comblés, et ses serviteurs « creusèrent encore dans la vallée, et y trouvèrent un puits d’eau vive » ; les bergers de Guérar le réclamèrent, et il nomma ce puits Ések, « dispute », et le suivant Sitna, avant de creuser Rehoboth, pour lequel on ne chercha pas querelle. La vallée n’est plus mentionnée ensuite."
    - "Guérar est d’ordinaire identifiée à Tel Haror (Tell Abu Hureira), grand tertre sur la rive nord du Nahal Gerar (Wadi esh-Sharia), à environ 27 km au nord-ouest de Beer-Schéba ; la vallée est donc le large lit de ce cours d’eau, qui court vers l’ouest pour rejoindre le Nahal Besor sur son chemin vers la mer près de Gaza, et est à sec la plus grande partie de l’année, avec de l’eau seulement lors des crues d’hiver et dans des puits creusés dans son lit, comme dans le récit. L’identification n’est pas certaine (Tell Jemmeh et Tell esh-Sharia furent des candidats antérieurs), et aucun des puits d’Isaac ne peut être désigné. Aujourd’hui, le Nahal Gerar passe devant Tel Haror, fouillé dans les années 1980 et au début des années 1990, à travers des terres cultivées entre Beer-Schéba et la bande de Gaza."
  pl:
    - "Dolina Gerar to wadi obok miasta Gerar w zachodnim Negewie, gdzie Izaak rozbił obóz podczas głodu, gdy Abimelek, król Filistynów, kazał mu odejść: „I odszedł stamtąd Izaak, i rozbił namioty w dolinie Gerar, i mieszkał tam.” Tam otworzył na nowo studnie Abrahama, które Filistyni zasypali, a, jak czytamy, „kopali słudzy Izaakowi w onej dolinie, i znaleźli tam studnią wód żywych”; pasterze Gerar ją sobie przypisali, więc nazwał tę studnię Esek, „spór”, a następną Sitna, zanim wykopał Rechobot, o którą nie było kłótni. Dolina nie jest wspomniana ponownie."
    - "Gerar utożsamia się zwykle z Tel Charor (Tell Abu Churejra), dużym kopcem na północnym brzegu Nachal Gerar (Wadi asz-Szari'a), około 27 km na północny zachód od Beer-Szeby, więc dolinę bierze się za szerokie koryto tego strumienia, który płynie na zachód i łączy się z Nachal Besor w drodze do morza koło Gazy, i jest suchy przez większość roku, z wodą tylko w zimowych wezbraniach i w studniach wykopanych w jego korycie, jak w opowieści. Utożsamienie nie jest pewne (Tell Dżemme i Tell asz-Szari'a były wcześniejszymi kandydatami), a żadnej ze studni Izaaka nie da się wskazać. Dziś Nachal Gerar biegnie obok Tel Charor, badanego w latach osiemdziesiątych i na początku dziewięćdziesiątych XX wieku, przez pola uprawne między Beer-Szebą a Strefą Gazy."
  it:
    - "La valle di Gerar è l’uadi accanto alla città di Gerar nel Negheb occidentale, dove Isacco si accampò durante una carestia dopo che Abimelech, re dei Filistei, lo aveva mandato via: «Isacco allora si partì di là, s’accampò nella valle di Gherar, e quivi dimorò». Là riaprì i pozzi di Abramo che i Filistei avevano turato, e i suoi servi «scavarono nella valle, e vi trovarono un pozzo d’acqua viva»; i pastori di Gerar lo rivendicarono, ed egli chiamò quel pozzo Esek, «contesa», e il successivo Sitna, prima di scavare Recobot, per il quale non vi fu litigio. La valle non è più menzionata."
    - "Gerar è di solito identificata con Tel Haror (Tell Abu Hureira), un grande tell sulla riva nord del Nahal Gerar (Wadi esh-Sharia), a circa 27 km a nord-ovest di Bersabea, per cui la valle è ritenuta il largo letto di quel torrente, che corre a ovest per unirsi al Nahal Besor nel suo cammino verso il mare presso Gaza ed è asciutto per la maggior parte dell’anno, con acqua solo nelle piene invernali e nei pozzi scavati nel suo letto, come nel racconto. L’identificazione non è certa (Tell Jemmeh e Tell esh-Sharia furono candidati precedenti), e nessuno dei pozzi di Isacco può essere indicato. Oggi il Nahal Gerar scorre accanto a Tel Haror, scavato negli anni 1980 e primi anni 1990, attraverso terreni coltivati fra Bersabea e la Striscia di Gaza."
  nl:
    - "Het dal van Gerar is de wadi naast de stad Gerar in de westelijke Negev, waar Isaak kampeerde tijdens een hongersnood nadat Abimelech, koning van de Filistijnen, hem had weggestuurd: “Toen toog Izak van daar, en hij legerde zich in het dal van Gerar, en woonde aldaar.” Daar heropende hij de putten van Abraham die de Filistijnen hadden dichtgestopt, en zijn knechten “groeven in dat dal, en zij vonden aldaar een put van levend water”; de herders van Gerar maakten er aanspraak op, en hij noemde die put Esek, “twist”, en de volgende Sitna, voordat hij Rehobot groef, waarover geen strijd was. Het dal wordt verder niet meer genoemd."
    - "Gerar wordt gewoonlijk vereenzelvigd met Tel Haror (Tell Abu Hureira), een grote heuvel aan de noordoever van Nahal Gerar (Wadi esh-Sharia), ongeveer 27 km ten noordwesten van Berseba, zodat het dal wordt opgevat als het brede bed van die beek, die naar het westen loopt om zich bij Nahal Besor te voegen op weg naar de zee bij Gaza en het grootste deel van het jaar droog is, met water alleen in winterse overstromingen en in putten gegraven in haar bedding, zoals in het verhaal. De gelijkstelling is niet zeker (Tell Jemmeh en Tell esh-Sharia waren eerder kandidaten), en geen van Isaaks putten kan worden aangewezen. Tegenwoordig loopt Nahal Gerar langs Tel Haror, opgegraven in de jaren 1980 en begin jaren 1990, door landbouwgrond tussen Berseba en de Gazastrook."
  cs:
    - "Gerárské údolí je vádí u města Gerar v západním Negevu, kde se Izák utábořil za hladu poté, co ho Abimelek, král Pelištejců, vyhnal: „Tedy odšel odtud Izák, a rozbil stany v údolí Gerar, a bydlil tu.“ Tam znovu otevřel Abrahamovy studny, které Pelištejci zasypali, a jeho služebníci „kopali … v tom údolí, a nalezli tam studnici vody živé“; pastýři z Gerar si ji nárokovali a on tu studnu nazval Esek, „spor“, a další Sitna, než vykopal Rechobót, o níž se nevadili. Údolí se už nezmiňuje."
    - "Gerar bývá ztotožněn s Tel Charor (Tell Abú Hurejra), velkým pahorkem na severním břehu Nachal Gerar (Wádí aš-Šarí'a), asi 27 km severozápadně od Beer-šeby, a proto se údolím rozumí široké koryto onoho potoka, který teče na západ, kde se spojuje s Nachal Besor na cestě k moři u Gazy, a je většinu roku suchý, s vodou jen při zimních záplavách a ve studních kopaných v jeho korytě, jako v příběhu. Ztotožnění není jisté (Tell Džemme a Tell aš-Šarí'a byly dřívějšími kandidáty) a žádnou z Izákových studní nelze ukázat. Dnes Nachal Gerar protéká kolem Tel Charor, vykopávaného v 80. a na počátku 90. let 20. století, zemědělskou krajinou mezi Beer-šebou a pásmem Gazy."
  sv:
    - "Gerars dal är wadin bredvid staden Gerar i västra Negev, där Isak slog läger under en hungersnöd sedan Avimelek, filisteernas kung, hade skickat bort honom: ”Då drog Isak bort därifrån och slog upp sitt läger i Gerars dal och bodde där.” Där öppnade han åter Abrahams brunnar som filisteerna hade stängt, och hans tjänare ”grävde i dalen och funno där en brunn med rinnande vatten”; Gerars herdar gjorde anspråk på den, och han kallade den brunnen Esek, ”tvist”, och nästa Sitna, innan han grävde Rehovot, om vilken ingen träta uppstod. Dalen nämns inte mer."
    - "Gerar identifieras vanligen med Tel Haror (Tell Abu Hureira), en stor kulle på norra stranden av Nahal Gerar (Wadi esh-Sharia), omkring 27 km nordväst om Beer Sheva, så dalen anses vara den breda bädden av denna bäck, som rinner västerut och förenas med Nahal Besor på väg till havet vid Gaza och är torr större delen av året, med vatten bara vid vinterns översvämningar och i brunnar grävda i dess bädd, som i berättelsen. Identifieringen är inte säker (Tell Jemmeh och Tell esh-Sharia var tidigare kandidater), och ingen av Isaks brunnar kan pekas ut. I dag rinner Nahal Gerar förbi Tel Haror, utgrävt på 1980-talet och tidigt 1990-tal, genom jordbruksmark mellan Beer Sheva och Gazaremsan."
  nb:
    - "Gerar-dalen er wadien ved byen Gerar i vestlige Negev, der Isak slo leir under en hungersnød etter at Abimelek, filistrenes konge, hadde sendt ham bort: «Så drog Isak derfra og slo leir i Gerar-dalen og blev boende der.» Der åpnet han Abrahams brønner som filistrene hadde tettet, og tjenerne hans «gravde i dalen og fant der en brønn med rinnende vann»; Gerars hyrder gjorde krav på den, og han kalte den brønnen Esek, «strid», og den neste Sitna, før han gravde Rehobot, som det ikke ble trettet om. Dalen er ikke nevnt igjen."
    - "Gerar identifiseres vanligvis med Tel Haror (Tell Abu Hureira), en stor haug på nordbredden av Nahal Gerar (Wadi esh-Sharia), omkring 27 km nordvest for Beer-Sjeba, så dalen antas å være det brede leiet til den bekken, som løper vestover og forener seg med Besor-bekken på vei til havet ved Gasa og er tørr det meste av året, med vann bare i vinterflommer og i brønner gravd i leiet, slik som i fortellingen. Identifikasjonen er ikke sikker (Tell Jemmeh og Tell esh-Sharia var tidligere kandidater), og ingen av Isaks brønner kan pekes ut. I dag løper Nahal Gerar forbi Tel Haror, utgravd på 1980-tallet og tidlig på 1990-tallet, gjennom jordbruksland mellom Beer-Sjeba og Gasastripen."
scripture:
  - Gen.26.1
  - Gen.26.16-Gen.26.22
