body:
  en:
    - "Pau, written Pai in Chronicles, was the city of Hadar (or Hadad), the last of the kings who “reigned in the land of Edom, before there reigned any king over the children of Israel”. Genesis says of him: “Hadar reigned in his stead: and the name of his city was Pau; and his wife's name was Mehetabel, the daughter of Matred, the daughter of Mezahab”, and Chronicles repeats the list. Almost every king in it is tied to a town of his own, and Pau is known only from this line."
    - "Its site is unknown. The map marks a point along Wadi Fai, west of the southern end of the Dead Sea, on the strength of the name, and also the possibility that the town is Beth-peor, since the Greek Bible reads the name as Phogor. Neither is more than a guess, and no inscription or later writer mentions Pau."
  ru:
    - "Пау — город Гадара (или Адада), последнего из царей, которые царствовали «в земле Едома, прежде царствования царей у сынов Израилевых». Книга Бытия говорит о нём: «воцарился по нем Гадар сын Варадов; имя городу его Пау; имя жене его Мегетавеель, дочь Матреды, сына Мезагава», а Паралипоменон повторяет этот список. Почти каждый царь в нём связан со своим городом, и Пау известен только по этой строке."
    - "Местоположение неизвестно. Карта отмечает точку вдоль Вади Фай к западу от южной оконечности Мёртвого моря, по созвучию имени, а также возможность, что это Беф-Фегор, поскольку греческая Библия читает имя как Фогор. И то и другое — не более чем догадка, и ни одна надпись, ни один позднейший писатель Пау не упоминают."
  uk:
    - "Пау (у Хроніках — Пай) було містом Гадара (або Хадада), останнього з царів, які «царювали в Едом землї, перш нїж царював там який царь в Ізраїлї». Буття говорить про нього: «царював намість його Гадар; город же його прозивали Пакгу, а жінку його Мегетабееля, дочка Матреда, дочки Мезагаба», і Хроніки повторюють перелік. Майже кожен цар у ньому пов’язаний із власним містом, а Пау відоме лише з цього рядка."
    - "Місце його невідоме. Мапа позначає точку вздовж Ваді-Фай, на захід від південного краю Мертвого моря, за співзвуччям назви, а також допускає, що місто — це Бет-Пеор, оскільки грецька Біблія читає назву як Фогор. Ні те, ні те не більше ніж здогад, і жоден напис чи пізніший автор Пау не згадує."
  es:
    - "Pau, escrita Pai en Crónicas, era la ciudad de Adar (o Adad), el último de los reyes que «reinaron en la tierra de Edom, antes que reinase rey sobre los hijos de Israel». El Génesis dice de él: «reinó Adar en lugar suyo: y el nombre de su ciudad fué Pau; y el nombre de su mujer Meetabel, hija de Matred, hija de Mezaab», y Crónicas repite la lista. Casi todos los reyes de ella están ligados a una ciudad propia, y Pau se conoce solo por esta línea."
    - "Su emplazamiento se desconoce. El mapa señala un punto a lo largo del uadi Fai, al oeste del extremo sur del mar Muerto, apoyándose en el nombre, y también la posibilidad de que la ciudad sea Bet-peor, ya que la Biblia griega lee el nombre como Fogor. Ninguna de las dos es más que una conjetura, y ninguna inscripción ni escritor posterior menciona Pau."
  pt:
    - "Paú, escrita Pai em Crônicas, era a cidade de Hadar (ou Hadade), o último dos reis que “reinaram na terra de Edom, antes que qualquer rei reinasse sobre os filhos de Israel”. O Gênesis diz dele: “Hadar reinou em seu lugar. O nome da sua cidade era Pau. O nome da sua mulher era Meetabel, filha de Matrede, filha de Mezaabe”, e Crônicas repete a lista. Quase todo rei dela está ligado a uma cidade própria, e Paú só é conhecida por esta linha."
    - "Seu local é desconhecido. O mapa marca um ponto ao longo do Uádi Fai, a oeste da extremidade sul do Mar Morto, por causa do nome, e também a possibilidade de que a cidade seja Bete-Peor, já que a Bíblia grega lê o nome como Fogor. Nenhuma das duas passa de um palpite, e nenhuma inscrição ou autor posterior menciona Paú."
  de:
    - "Pau (bei Luther Pagu), in der Chronik Pai geschrieben, war die Stadt Hadars (oder Hadads), des letzten der Könige, die „im Lande Edom regiert haben, ehe denn die Kinder Israel Könige hatten“. Die Genesis sagt von ihm: „ward an seiner Statt König Hadar; und seine Stadt hieß Pagu, und sein Weib Mehetabeel, eine Tochter Matreds, die Mesahabs Tochter war“, und die Chronik wiederholt die Liste. Fast jeder König darin ist mit einer eigenen Stadt verbunden, und Pau ist nur aus dieser Zeile bekannt."
    - "Ihre Lage ist unbekannt. Die Karte markiert einen Punkt am Wadi Fai westlich des Südendes des Toten Meeres wegen des Namens, und außerdem die Möglichkeit, dass die Stadt Bet-Peor ist, da die griechische Bibel den Namen als Phogor liest. Beides ist kaum mehr als eine Vermutung, und keine Inschrift und kein späterer Autor erwähnt Pau."
  fr:
    - "Pau, écrite Pahi dans les Chroniques, était la ville de Hadar (ou Hadad), le dernier des rois qui « ont régné dans le pays d’Édom, avant qu’un roi régnât sur les enfants d’Israël ». La Genèse dit de lui : « Hadar régna à sa place. Le nom de sa ville était Pau ; et le nom de sa femme Mehéthabeel, fille de Mathred, fille de Mézahab », et les Chroniques reprennent la liste. Presque chaque roi y est lié à une ville qui lui est propre, et Pau n’est connue que par cette ligne."
    - "Son site est inconnu. La carte marque un point le long du Wadi Fai, à l’ouest de l’extrémité sud de la mer Morte, d’après le nom, et aussi la possibilité que la ville soit Beth-Peor, puisque la Bible grecque lit le nom Phogor. Aucune hypothèse n’est plus qu’une conjecture, et aucune inscription ni aucun auteur postérieur ne mentionne Pau."
  it:
    - "Pau, scritta Pai nelle Cronache, era la città di Hadar (o Adad), l’ultimo dei re che «regnarono nel paese di Edom, prima che alcun re regnasse sui figliuoli d’Israele». La Genesi dice di lui: «Hadar regnò in luogo suo. Il nome della sua città fu Pau, e il nome della sua moglie, Mehetabeel, figliuola di Matred, figliuola di Mezahab», e le Cronache ripetono l’elenco. Quasi ogni re dell’elenco è legato a una città propria, e Pau è nota solo da questa riga."
    - "Il suo sito è ignoto. La mappa segna un punto lungo il Wadi Fai, a ovest dell’estremità meridionale del Mar Morto, in base al nome, e anche la possibilità che la città sia Bet-Peor, poiché la Bibbia greca legge il nome come Phogor. Nessuna delle due è più di un’ipotesi, e nessuna iscrizione o scrittore posteriore menziona Pau."
  pl:
    - "Pau, w Kronikach pisane Paj, było miastem Hadara (czyli Hadada), ostatniego z królów, którzy „królowali w ziemi Edomskiej, pierwej niż królował król nad syny Izraelskimi”. Księga Rodzaju mówi o nim: „królował miasto niego Hadar, a imię miasta jego Pahu, a imię żony jego Mehetabel, córka Matredy, córki Mezaabowej”, a Kroniki powtarzają listę. Prawie każdy król z niej jest związany z własnym miastem, a Pau znane jest tylko z tego wiersza."
    - "Jego położenie jest nieznane. Mapa zaznacza punkt wzdłuż Wadi Fai, na zachód od południowego krańca Morza Martwego, na podstawie nazwy, a także możliwość, że miasto to Bet-Peor, skoro Biblia grecka czyta nazwę jako Fogor. Żadne z tych przypuszczeń nie jest czymś więcej niż domysłem i żaden napis ani późniejszy pisarz nie wspomina Pau."
  cs:
    - "Pau, v Kronikách psané Pai, bylo město Hadara (či Hadada), posledního z králů, kteří „kralovali v zemi Idumejské, prvé než kraloval král nad syny Izraelskými“. Genesis o něm praví: „kraloval na místě jeho Adar; a jméno města jeho Pahu; jméno pak ženy jeho Mehetabel, dcera Matredy, dcery Mezábovy“, a Kroniky seznam opakují. Téměř každý král v něm je spojen s vlastním městem a Pau je známo jen z tohoto řádku."
    - "Jeho poloha je neznámá. Mapa vyznačuje bod u Vádí Fai, západně od jižního konce Mrtvého moře, na základě jména, a také možnost, že město je Bét-peór, neboť řecká Bible čte jméno jako Fogor. Ani jedno není víc než dohad a žádný nápis ani pozdější spisovatel Pau nejmenuje."
  nl:
    - "Pau, in Kronieken Pai gespeld, was de stad van Hadar (of Hadad), de laatste van de koningen die “geregeerd hebben in het land Edom, eer een koning regeerde over de kinderen Israels”. Genesis zegt van hem: “Hadar regeerde in zijn plaats; en de naam zijner stad was Pahu; en de naam zijner huisvrouw was Mechetabeël, een dochter van Matred, de dochter van Me-zahab”, en Kronieken herhaalt de lijst. Bijna elke koning daarin wordt aan een eigen stad gekoppeld, en Pau is alleen uit deze regel bekend."
    - "De ligging is onbekend. De kaart wijst een punt aan langs de Wadi Fai, ten westen van het zuidelijke uiteinde van de Dode Zee, op grond van de naam, en ook de mogelijkheid dat de stad Beth-Peor is, omdat de Griekse Bijbel de naam als Fogor leest. Geen van beide is meer dan een gok, en geen opschrift of latere schrijver noemt Pau."
  sv:
    - "Pau, i Krönikeböckerna skrivet Pai, var staden för Hadar (eller Hadad), den siste av kungarna som ”regerade i Edoms land, innan ännu någon israelitisk konung var konung där”. Första Mosebok säger om honom: ”… blev Hadar konung efter honom; och hans stad hette Pagu, och hans hustru hette Mehetabel, dotter till Matred, som var dotter till Me-Sahab”, och Krönikeböckerna upprepar förteckningen. Nästan varje kung i den är knuten till en egen stad, och Pau är känd endast från denna rad."
    - "Platsen är okänd. Kartan markerar en punkt längs Wadi Fai, väster om Döda havets södra ände, på grund av namnet, och även möjligheten att staden är Bet-Peor, eftersom den grekiska bibeln läser namnet som Phogor. Inget av dem är mer än en gissning, och ingen inskription eller senare författare nämner Pau."
