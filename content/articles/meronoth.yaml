body:
  en:
    - "Meronoth is known only from two men called after it. Among the overseers of David’s property, “over the asses was Jehdeiah the Meronothite”. Centuries later, when Nehemiah rebuilt the wall of Jerusalem, “next unto them repaired Melatiah the Gibeonite, and Jadon the Meronothite, the men of Gibeon, and of Mizpah”. The second verse ties the place to Gibeon and Mizpah, so Meronoth was presumably a village in the hills of Benjamin north of Jerusalem. The Bible names it nowhere else, and no ancient source adds anything."
    - "The map draws a circle within about 6 km of Mizpah (usually Tell en-Nasbeh) and gives Beitunia, west of Ramallah, as a second guess. Neither has any evidence beyond the neighbourhood of Gibeon and Mizpah; the village itself is lost."
  ru:
    - "Мероноф известен только по двум людям, названным по нему. Среди смотрителей имущества Давида: «над ослицами — Иехдия Меронифянин». Спустя века, когда Неемия восстанавливал стену Иерусалима, «подле них чинил Мелатия Гаваонитянин, и Иадон из Меронофа, с жителями Гаваона и Мицфы». Второй стих связывает место с Гаваоном и Мицфой, так что Мероноф, по-видимому, был селением в горах Вениамина к северу от Иерусалима. Больше Библия его нигде не называет, и древние источники ничего не прибавляют."
    - "На карте очерчен круг около 6 км вокруг Массифы — той же Мицфы, обычно отождествляемой с Телль-эн-Насбе, и второй догадкой дана Бейтуния к западу от Рамаллы. Ни у той, ни у другой нет иных доводов, кроме соседства с Гаваоном и Массифой; само селение утрачено."
  uk:
    - "Меронот відомий лише з двох чоловіків, названих за ним. Серед наглядачів над майном Давида «а над ослицями — Ехдїя з Мерониту». Через століття, коли Неемія відбудовував мур Єрусалима, «Коло їх лагодив Мелатїя Габаонїй, і Ядон із Меронота, з осадниками Габаону й Мицфи». Другий вірш пов’язує місце з Гаваоном та Міцпою, тож Меронот, мабуть, було селом у пагорбах Веніяміна на північ від Єрусалима. Біблія більше ніде його не називає, і жодне давнє джерело нічого не додає."
    - "Мапа креслить коло в межах приблизно 6 км від Міцпи (зазвичай Телль-ен-Насбех) і дає Бейтунію, на захід від Рамалли, як другу здогадку. Жодне не має доказів, окрім сусідства з Гаваоном і Міцпою; саме село втрачене."
  es:
    - "Meronot se conoce solo por dos hombres que llevan su nombre. Entre los administradores de los bienes de David, «y de las asnas, Jedías Meronothita». Siglos después, cuando Nehemías reconstruyó el muro de Jerusalén, «Junto á ellos restauró Melatías Gabaonita, y Jadón Meronothita, varones de Gabaón y de Mizpa». El segundo versículo vincula el lugar con Gabaón y Mizpa, de modo que Meronot era presumiblemente una aldea de las colinas de Benjamín, al norte de Jerusalén. La Biblia no la nombra en ningún otro lugar, y ninguna fuente antigua añade nada."
    - "El mapa traza un círculo a unos 6 km de Mizpa (habitualmente Tell en-Nasbeh) y da Beitunia, al oeste de Ramala, como segunda conjetura. Ninguna tiene más pruebas que la vecindad de Gabaón y Mizpa; la aldea misma se ha perdido."
  pt:
    - "Meronote é conhecida apenas por dois homens que dela receberam o nome. Entre os supervisores dos bens de Davi, “Sobre os jumentos estava Jedias, o meronotita”. Séculos depois, quando Neemias reconstruiu o muro de Jerusalém, “Junto a eles, Melatias, o gibeonita, e Jadom, o meronotita, homens de Gibeão e de Mispá, repararam” parte dele. O segundo versículo liga o lugar a Gibeão e Mispá, de modo que Meronote era presumivelmente uma aldeia nas colinas de Benjamim, ao norte de Jerusalém. A Bíblia não a nomeia em nenhum outro lugar, e nenhuma fonte antiga acrescenta algo."
    - "O mapa traça um círculo a cerca de 6 km de Mispá (geralmente Tell en-Nasbeh) e dá Beitunia, a oeste de Ramallah, como segundo palpite. Nenhuma tem evidência além da vizinhança de Gibeão e Mispá; a própria aldeia se perdeu."
  de:
    - "Meronot ist nur aus zwei nach ihm benannten Männern bekannt. Unter den Verwaltern von Davids Besitz: „Über die Esel war Jehdeja, der Meronothiter.“ Jahrhunderte später, als Nehemia die Mauer Jerusalems wieder aufbaute: „Neben ihnen bauten Melatja von Gibeon und Jadon von Meronoth, die Männer von Gibeon und von Mizpa“. Der zweite Vers verbindet den Ort mit Gibeon und Mizpa, sodass Meronot vermutlich ein Dorf im Bergland Benjamins nördlich von Jerusalem war. Die Bibel nennt es sonst nirgends, und keine antike Quelle fügt etwas hinzu."
    - "Die Karte zieht einen Kreis im Umkreis von etwa 6 km um Mizpa (meist Tell en-Nasbeh) und nennt Beitunia, westlich von Ramallah, als zweite Vermutung. Beide haben keinen Beleg außer der Nachbarschaft zu Gibeon und Mizpa; das Dorf selbst ist verloren."
  fr:
    - "Méronoth n’est connue que par deux hommes qui en tirent leur nom. Parmi les intendants des biens de David, « Jechdia, de Méronoth, sur les ânesses ». Des siècles plus tard, quand Néhémie rebâtit la muraille de Jérusalem, « à côté d’eux travaillèrent Melatia, le Gabaonite, Jadon, le Méronothite, et les hommes de Gabaon et de Mitspa ». Le second verset rattache le lieu à Gabaon et à Mitspa, de sorte que Méronoth était vraisemblablement un village des collines de Benjamin au nord de Jérusalem. La Bible ne la nomme nulle part ailleurs, et aucune source ancienne n’ajoute rien."
    - "La carte trace un cercle à environ 6 km de Mitspa (d’ordinaire Tell en-Nasbeh) et donne Beitunia, à l’ouest de Ramallah, comme seconde hypothèse. Ni l’un ni l’autre n’a d’indice au-delà du voisinage de Gabaon et de Mitspa ; le village lui-même est perdu."
  it:
    - "Meronot è nota solo da due uomini che ne prendono il nome. Tra i sovrintendenti dei beni di Davide c’era «Jehdeia da Meronoth, agli asini». Secoli dopo, quando Neemia ricostruì le mura di Gerusalemme, «Allato a loro lavorarono alle riparazioni Melatia, il Gabaonita, Jadon, il Meronothita, e gli uomini di Gabaon e di Mitspa». Il secondo versetto lega il luogo a Gabaon e Mizpa, così Meronot era presumibilmente un villaggio sulle colline di Beniamino a nord di Gerusalemme. La Bibbia non lo nomina altrove, e nessuna fonte antica aggiunge nulla."
    - "La mappa traccia un cerchio entro circa 6 km da Mizpa (di solito Tell en-Nasbeh) e dà Beitunia, a ovest di Ramallah, come seconda ipotesi. Nessuna delle due ha altra prova oltre la vicinanza a Gabaon e Mizpa; il villaggio stesso è perduto."
  pl:
    - "Meronot jest znane tylko z dwóch mężów od niego nazwanych. Wśród zarządców majątku Dawida „nad oślicami był Jechdejasz Merończyk”. Stulecia później, gdy Nehemiasz odbudowywał mur Jerozolimy, „podle nich poprawiał Melatyjasz Gabaonitczyk, Jadon Meronitczyk, mężowie z Gabaon i z Masfa”. Drugi werset wiąże to miejsce z Gibeonem i Mispą, więc Meronot było zapewne wsią w górach Beniamina na północ od Jerozolimy. Biblia nie wymienia go nigdzie indziej i żadne starożytne źródło nic nie dodaje."
    - "Mapa rysuje koło w promieniu około 6 km od Mispy (zwykle Tell en-Nasbeh) i podaje Beitunię, na zachód od Ramallah, jako drugi domysł. Żaden nie ma dowodu poza sąsiedztwem Gibeonu i Mispy; sama wieś jest zagubiona."
  nl:
    - "Meronot is alleen bekend uit twee mannen die naar de plaats heten. Onder de beheerders van Davids bezit: “over de ezelinnen was Jechdeja, de Meronothiet”. Eeuwen later, toen Nehemia de muur van Jeruzalem herbouwde, “aan hun hand verbeterden Melatja, de Gibeoniet, en Jadon, de Meronothiet, de mannen van Gibeon en van Mizpa”. Het tweede vers verbindt de plaats met Gibeon en Mizpa, dus Meronot was vermoedelijk een dorp in de heuvels van Benjamin ten noorden van Jeruzalem. De Bijbel noemt het nergens anders, en geen oude bron voegt iets toe."
    - "De kaart tekent een cirkel binnen ongeveer 6 km van Mizpa (gewoonlijk Tell en-Nasbeh) en geeft Beitunia, ten westen van Ramallah, als tweede gok. Geen van beide heeft enig bewijs buiten de nabijheid van Gibeon en Mizpa; het dorp zelf is verloren."
  cs:
    - "Meronot je znám jen ze dvou mužů, kteří podle něj dostali jméno. Mezi správci Davidova majetku byl „nad oslicemi Jechdeiáš Meronotský“. O staletí později, když Nehemjáš opravoval jeruzalémskou zeď, „Podlé nich opravoval Melatiáš Gabaonitský, a Jádon Meronotský, muži z Gabaon a z Masfa“. Druhý verš spojuje místo s Gibeonem a Micpou, takže Meronot byl zřejmě vesnice v benjamínských horách severně od Jeruzaléma. Bible ji nejmenuje nikde jinde a žádný starověký pramen nic nepřidává."
    - "Mapa kreslí kruh do vzdálenosti asi 6 km od Micpy (obvykle Tell en-Nasbeh) a jako druhý dohad uvádí Beitunii, západně od Ramalláhu. Ani jedno nemá doklad kromě sousedství Gibeonu a Micpy; samotná vesnice je ztracena."
  sv:
    - "Meronot är känt endast från två män som fått sitt namn efter det. Bland förvaltarna av Davids egendom var ”över åsninnorna meronotiten Jedeja”. Århundraden senare, när Nehemja byggde upp Jerusalems mur, ”Därbredvid arbetade gibeoniten Melatja och meronotiten Jadon jämte männen från Gibeon och Mispa”. Den andra versen knyter platsen till Gibeon och Mispa, så Meronot var förmodligen en by i Benjamins berg norr om Jerusalem. Bibeln nämner den ingen annanstans, och ingen antik källa tillför något."
    - "Kartan drar en cirkel inom omkring 6 km från Mispa (vanligen Tell en-Nasbeh) och ger Beitunia, väster om Ramallah, som en andra gissning. Ingen av dem har några belägg utöver närheten till Gibeon och Mispa; själva byn är förlorad."
  nb:
    - "Meronot er bare kjent fra to menn som er oppkalt etter det. Blant oppsynsmennene over Davids eiendeler var det «over aseninnene Jehdeja fra Meronot». Århundrer senere, da Nehemja bygde murene i Jerusalem, «arbeidet gibeonitten Melatja og meronotitten Jadon med mennene fra Gibeon og Mispa». Det andre verset knytter stedet til Gibeon og Mispa, så Meronot var antakelig en landsby i Benjamins åser nord for Jerusalem. Bibelen nevner den ingen andre steder, og ingen gammel kilde tilføyer noe."
    - "Kartet tegner en sirkel innen omkring 6 km fra Mispa (vanligvis Tell en-Nasbeh) og gir Beitunia, vest for Ramallah, som annet gjett. Ingen av dem har noe belegg utover nærheten til Gibeon og Mispa; selve landsbyen er tapt."
  tl:
    - "Kilala lamang ang Meronoth mula sa dalawang lalaking ipinangalan dito. Sa mga tagapamahala ng ari-arian ni David, “sa mga asno ay si Jedias na Meronothita”. Makalipas ang mga siglo, nang itayong muli ni Nehemias ang pader ng Jerusalem, “sumunod sa kanila ay hinusay ni Melatias na Gabaonita, at ni Jadon na Meronothita, ng mga lalaking taga Gabaon, at taga Mizpa”. Iniuugnay ng ikalawang talata ang lugar sa Gabaon at Mizpa, kaya ang Meronoth ay marahil nayon sa mga burol ng Benjamin sa hilaga ng Jerusalem. Hindi na ito pinangalanan ng Biblia saanman, at walang sinaunang sanggunian na nagdaragdag."
    - "Gumuguhit ang mapa ng bilog sa loob ng mga 6 km mula sa Mizpa (karaniwang Tell en-Nasbeh) at nagbibigay ng Beitunia, sa kanluran ng Ramallah, bilang ikalawang hula. Walang ebidensiya ang alinman maliban sa kalapitan ng Gabaon at Mizpa; nawala ang nayon mismo."
  da:
    - "Meronot er kun kendt fra to mænd, der er opkaldt efter det. Blandt opsynsmændene over Davids ejendom var »over Aseninderne var Jedeja, Meronothiten«. Århundreder senere, da Nehemias genopbyggede Jerusalems mur: »Gibeoniten Melathia og Meronothiten Jadon, Mændene af Gibeon og Mizpa istandsatte et Stykke ved Siden af dem«. Det andet vers knytter stedet til Gibeon og Mispa, så Meronot var formodentlig en landsby i Benjamins bjerge nord for Jerusalem. Bibelen nævner det ikke andetsteds, og ingen gammel kilde tilføjer noget."
    - "Kortet tegner en cirkel inden for omkring 6 km fra Mispa (sædvanligvis Tell en-Nasbeh) og giver Beitunia, vest for Ramallah, som andet gæt. Ingen af dem har andet bevis end nabolaget til Gibeon og Mispa; selve landsbyen er tabt."
  sr:
    - "Меронот је познат само по двојици људи названих по њему. Међу настојницима Давидовог имања било је „над магарцима Једаја Мероноћанин“. Столећима касније, када је Немија обнављао зид Јерусалима, „А до њих поправљаше Мелатија Гаваоњанин и Јадон Мероњанин, људи из Гаваона и из Миспе“. Други стих везује место за Гаваон и Масфу, па је Меронот вероватно био село у венијаминовим брдима северно од Јерусалима. Библија га нигде другде не именује, и ниједан древни извор не додаје ништа."
    - "Мапа црта круг у распону од око 6 км од Масфе (обично Тел ен-Насба) и као другу претпоставку даје Бајтунију, западно од Рамале. Ниједно нема доказа осим близине Гаваона и Масфе; само село је изгубљено."
