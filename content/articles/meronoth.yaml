# Overview article (ADR 0007). Mainstream facts only; a place known only from two gentilics: the guesses on the map are named as guesses.
id: meronoth
place: a662bda
title:
  en: "Meronoth"
  ru: "Мероноф"
body:
  en:
    - "Meronoth is known only from two men called after it. Among the overseers of David’s property, “over the asses was Jehdeiah the Meronothite”. Centuries later, when Nehemiah rebuilt the wall of Jerusalem, “next unto them repaired Melatiah the Gibeonite, and Jadon the Meronothite, the men of Gibeon, and of Mizpah”. The second verse ties the place to Gibeon and Mizpah, so Meronoth was presumably a village in the hills of Benjamin north of Jerusalem. The Bible names it nowhere else, and no ancient source adds anything."
    - "The map draws a circle within about 6 km of Mizpah (usually Tell en-Nasbeh) and gives Beitunia, west of Ramallah, as a second guess. Neither has any evidence beyond the neighbourhood of Gibeon and Mizpah; the village itself is lost."
  ru:
    - "Мероноф известен только по двум людям, названным по нему. Среди смотрителей имущества Давида: «над ослицами — Иехдия Меронифянин». Спустя века, когда Неемия восстанавливал стену Иерусалима, «подле них чинил Мелатия Гаваонитянин, и Иадон из Меронофа, с жителями Гаваона и Мицфы». Второй стих связывает место с Гаваоном и Мицфой, так что Мероноф, по-видимому, был селением в горах Вениамина к северу от Иерусалима. Больше Библия его нигде не называет, и древние источники ничего не прибавляют."
    - "На карте очерчен круг около 6 км вокруг Массифы — той же Мицфы, обычно отождествляемой с Телль-эн-Насбе, и второй догадкой дана Бейтуния к западу от Рамаллы. Ни у той, ни у другой нет иных доводов, кроме соседства с Гаваоном и Массифой; само селение утрачено."
scripture:
  - 1Chr.27.30
  - Neh.3.7
sources:
  - "H. G. M. Williamson, Ezra, Nehemiah (Word Biblical Commentary 16, 1985)"
  - "J. Blenkinsopp, Ezra-Nehemiah: A Commentary (Old Testament Library, 1988)"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
