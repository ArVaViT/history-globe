# Overview article (ADR 0007). Mainstream facts only; the identification with Jebel Halaq is given as the usual view.
id: mount-halak
place: a11fadd
title:
  en: "Mount Halak"
  ru: "Гора Халак"
  uk: "Гора Халак"
  es: "Monte Halac"
  pt: "Monte Halaque"
  de: "Berg Halak"
  fr: "Mont Halak"
body:
  en:
    - "Mount Halak, “the bare” or “smooth mountain”, is the southern limit of Joshua’s conquests. Summing them up, the book says he took the land “even from the mount Halak, that goeth up to Seir, even unto Baal-gad in the valley of Lebanon under mount Hermon”, and the list of defeated kings repeats the frame in reverse, “from Baal-gad in the valley of Lebanon even unto the mount Halak, that goeth up to Seir”. The two names mark the whole country from south to north, as “from Dan even to Beer-sheba” does elsewhere. Nothing else is said of the mountain."
    - "“That goeth up to Seir” places it on the way towards Edom, and it is usually identified with Jebel Halaq (Har Halak), a bare ridge in the central Negev of Israel, about 40 km south of Beersheba, whose Arabic name keeps the Hebrew one; the map follows that view with moderate confidence. No ancient source mentions it, and the identification rests on the name and the direction."
  ru:
    - "Гора Халак, «лысая» или «гладкая гора», — южный предел завоеваний Иисуса Навина. Подводя им итог, книга говорит, что он взял землю «от горы Халак, простирающейся к Сеиру, до Ваал-Гада в долине Ливанской, подле горы Ермона», а перечень побеждённых царей повторяет эти рамки в обратном порядке: «от Ваал-Гада на долине Ливанской до Халака, горы, простирающейся к Сеиру». Два имени обозначают всю страну с юга на север, как в других местах «от Дана до Вирсавии». Больше о горе ничего не сказано."
    - "Слова «простирающейся к Сеиру» ставят её на пути к Едому, и её обычно отождествляют с Джебель-Халаком (Хар-Халак) — голым хребтом в центральном Негеве, в Израиле, примерно в 40 км к югу от Вирсавии, чьё арабское имя сохраняет еврейское; карта следует этому мнению с умеренной уверенностью. Ни один древний источник её не упоминает, и отождествление держится на имени и направлении."
  uk:
    - "Гора Халак, «гола» або «гладка гора», — південна межа завоювань Ісуса Навина. Підсумовуючи їх, книга каже, що він узяв землю «Від гори Халак, що тягнесь до Сеїру, аж до Баал-Гаду в Ливанській долинї під Ермоном», а перелік переможених царів повторює раму у зворотному напрямку: «від Баал-Гаду, в Ливан-долинї та й до Лисих гір, що тягнуться до Сеїру». Дві назви позначають усю країну з півдня на північ, як в інших місцях — «від Дана аж до Берсабиї». Більше про гору нічого не сказано."
    - "«Що тягнесь до Сеїру» розміщує її на шляху до Едому, і її зазвичай ототожнюють із Джебель-Халаком (Хар-Халак), голим хребтом у центральному Негеві Ізраїлю, приблизно за 40 км на південь від Беер-Шеви, чия арабська назва зберігає староєврейську; мапа слідує цьому погляду із середньою впевненістю. Жодне давнє джерело її не згадує, і ототожнення спирається на назву та напрямок."
  es:
    - "El monte Halac, «el pelado» o «monte liso», es el límite meridional de las conquistas de Josué. Al resumirlas, el libro dice que tomó la tierra «Desde el monte de Halac, que sube hasta Seir, hasta Baal-gad en la llanura del Líbano, á las raíces del monte Hermón», y la lista de reyes derrotados repite el marco a la inversa, «desde Baal-gad en el llano del Líbano hasta el monte de Halac que sube á Seir». Los dos nombres marcan todo el país de sur a norte, como lo hace en otros lugares «desde Dan hasta Beer-seba». No se dice nada más de la montaña."
    - "«Que sube á Seir» la sitúa en el camino hacia Edom, y suele identificarse con el Yebel Halaq (Har Halak), una cresta pelada en el Néguev central de Israel, a unos 40 km al sur de Beerseba, cuyo nombre árabe conserva el hebreo; el mapa sigue esa opinión con confianza moderada. Ninguna fuente antigua la menciona, y la identificación descansa en el nombre y la dirección."
  pt:
    - "O monte Halaque, “o pelado” ou “monte liso”, é o limite sul das conquistas de Josué. Resumindo-as, o livro diz que ele tomou a terra “desde o monte Halaque, que sobe para Seir, até Baal-Gade, no vale do Líbano, ao pé do monte Hermom”, e a lista dos reis derrotados repete a moldura em sentido inverso, “desde Baal-Gade, no vale do Líbano, até o monte Halaque, que sobe para Seir”. Os dois nomes marcam todo o país de sul a norte, como em outros lugares “desde Dã até Berseba”. Nada mais se diz da montanha."
    - "“Que sobe para Seir” a situa no caminho rumo a Edom, e costuma ser identificada com o Jebel Halaq (Har Halak), uma crista nua no Neguebe central de Israel, a cerca de 40 km ao sul de Berseba, cujo nome árabe conserva o hebraico; o mapa segue essa opinião com confiança moderada. Nenhuma fonte antiga a menciona, e a identificação repousa no nome e na direção."
  de:
    - "Der Berg Halak, „der kahle“ oder „glatte Berg“, ist die Südgrenze von Josuas Eroberungen. In der Zusammenfassung heißt es, er habe das Land genommen „von dem kahlen Gebirge an, das aufsteigt gen Seir, bis gen Baal-Gad in der Ebene beim Berge Libanon, unten am Berge Hermon“, und die Liste der besiegten Könige wiederholt den Rahmen umgekehrt, „von Baal-Gad an auf der Ebene beim Berge Libanon bis an das kahle Gebirge, das aufsteigt gen Seir“. Die beiden Namen bezeichnen das ganze Land von Süd nach Nord, wie anderswo „von Dan bis gen Beer-Seba“. Sonst wird vom Berg nichts gesagt."
    - "Der Zusatz „das aufsteigt gen Seir“ setzt ihn auf den Weg nach Edom, und er wird meist mit dem Jebel Halaq (Har Halak) gleichgesetzt, einem kahlen Rücken im zentralen Negev Israels, etwa 40 km südlich von Beerscheba, dessen arabischer Name den hebräischen bewahrt; die Karte folgt dieser Ansicht mit mäßiger Sicherheit. Keine antike Quelle erwähnt ihn, und die Gleichsetzung beruht auf Namen und Richtung."
  fr:
    - "Le mont Halak, « la montagne nue » ou « lisse », est la limite méridionale des conquêtes de Josué. En les résumant, le livre dit qu’il prit le pays « depuis la montagne nue qui s’élève vers Séir jusqu’à Baal-Gad, dans la vallée du Liban, au pied de la montagne d’Hermon », et la liste des rois vaincus répète le cadre en sens inverse, « depuis Baal-Gad dans la vallée du Liban jusqu’à la montagne nue qui s’élève vers Séir ». Les deux noms marquent tout le pays du sud au nord, comme « depuis Dan jusqu’à Beer-Schéba » ailleurs. On ne dit rien d’autre de la montagne."
    - "« Qui s’élève vers Séir » la place sur le chemin d’Édom, et on l’identifie d’ordinaire au djebel Halaq (Har Halak), crête nue du centre du Négev d’Israël, à environ 40 km au sud de Beer-Schéba, dont le nom arabe garde le nom hébreu ; la carte suit cet avis avec une confiance modérée. Aucune source ancienne ne la mentionne, et l’identification repose sur le nom et la direction."
scripture:
  - Josh.11.16-Josh.11.17
  - Josh.12.7
sources:
