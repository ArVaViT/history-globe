body:
  en:
    - "Mount Halak, “the bare” or “smooth mountain”, is the southern limit of Joshua’s conquests. Summing them up, the book says he took the land “even from the mount Halak, that goeth up to Seir, even unto Baal-gad in the valley of Lebanon under mount Hermon”, and the list of defeated kings repeats the frame in reverse, “from Baal-gad in the valley of Lebanon even unto the mount Halak, that goeth up to Seir”. The two names mark the whole country from south to north, as “from Dan even to Beer-sheba” does elsewhere. Nothing else is said of the mountain."
    - "“That goeth up to Seir” places it on the way towards Edom, and it is usually identified with Jebel Halaq (Har Halak), a bare ridge in the central Negev of Israel, about 40 km south of Beersheba, whose Arabic name keeps the Hebrew one; the map follows that view with moderate confidence. Eusebius’ Onomasticon put it “above Paneas” in the far north, which does not fit “goeth up to Seir”; the modern identification rests on the name and the direction."
  ru:
    - "Гора Халак, «лысая» или «гладкая гора», — южный предел завоеваний Иисуса Навина. Подводя им итог, книга говорит, что он взял землю «от горы Халак, простирающейся к Сеиру, до Ваал-Гада в долине Ливанской, подле горы Ермона», а перечень побеждённых царей повторяет эти рамки в обратном порядке: «от Ваал-Гада на долине Ливанской до Халака, горы, простирающейся к Сеиру». Два имени обозначают всю страну с юга на север, как в других местах «от Дана до Вирсавии». Больше о горе ничего не сказано."
    - "Слова «простирающейся к Сеиру» ставят её на пути к Едому, и её обычно отождествляют с Джебель-Халаком (Хар-Халак) — голым хребтом в центральном Негеве, в Израиле, примерно в 40 км к югу от Вирсавии, чьё арабское имя сохраняет еврейское; карта следует этому мнению с умеренной уверенностью. «Ономастикон» Евсевия помещал её «над Панеадой», на крайнем севере, что не вяжется со словами «простирающейся к Сеиру»; современное отождествление держится на имени и направлении."
  uk:
    - "Гора Халак, «гола» або «гладка гора», — південна межа завоювань Ісуса Навина. Підсумовуючи їх, книга каже, що він узяв землю «Від гори Халак, що тягнесь до Сеїру, аж до Баал-Гаду в Ливанській долинї під Ермоном», а перелік переможених царів повторює раму у зворотному напрямку: «від Баал-Гаду, в Ливан-долинї та й до Лисих гір, що тягнуться до Сеїру». Дві назви позначають усю країну з півдня на північ, як в інших місцях — «від Дана аж до Берсабиї». Більше про гору нічого не сказано."
    - "«Що тягнесь до Сеїру» розміщує її на шляху до Едому, і її зазвичай ототожнюють із Джебель-Халаком (Хар-Халак), голим хребтом у центральному Негеві Ізраїлю, приблизно за 40 км на південь від Беер-Шеви, чия арабська назва зберігає староєврейську; мапа слідує цьому погляду із середньою впевненістю. «Ономастикон» Євсевія розміщував її «над Панеасом» на крайній півночі, що не узгоджується зі словами «що тягнесь до Сеїру»; сучасне ототожнення спирається на назву та напрямок."
  es:
    - "El monte Halac, «el pelado» o «monte liso», es el límite meridional de las conquistas de Josué. Al resumirlas, el libro dice que tomó la tierra «Desde el monte de Halac, que sube hasta Seir, hasta Baal-gad en la llanura del Líbano, á las raíces del monte Hermón», y la lista de reyes derrotados repite el marco a la inversa, «desde Baal-gad en el llano del Líbano hasta el monte de Halac que sube á Seir». Los dos nombres marcan todo el país de sur a norte, como lo hace en otros lugares «desde Dan hasta Beer-seba». No se dice nada más de la montaña."
    - "«Que sube á Seir» la sitúa en el camino hacia Edom, y suele identificarse con el Yebel Halaq (Har Halak), una cresta pelada en el Néguev central de Israel, a unos 40 km al sur de Beerseba, cuyo nombre árabe conserva el hebreo; el mapa sigue esa opinión con confianza moderada. El Onomasticón de Eusebio la situaba «sobre Paneas», en el extremo norte, lo que no encaja con «que sube á Seir»; la identificación moderna descansa en el nombre y la dirección."
  pt:
    - "O monte Halaque, “o pelado” ou “monte liso”, é o limite sul das conquistas de Josué. Resumindo-as, o livro diz que ele tomou a terra “desde o monte Halaque, que sobe para Seir, até Baal-Gade, no vale do Líbano, ao pé do monte Hermom”, e a lista dos reis derrotados repete a moldura em sentido inverso, “desde Baal-Gade, no vale do Líbano, até o monte Halaque, que sobe para Seir”. Os dois nomes marcam todo o país de sul a norte, como em outros lugares “desde Dã até Berseba”. Nada mais se diz da montanha."
    - "“Que sobe para Seir” a situa no caminho rumo a Edom, e costuma ser identificada com o Jebel Halaq (Har Halak), uma crista nua no Neguebe central de Israel, a cerca de 40 km ao sul de Berseba, cujo nome árabe conserva o hebraico; o mapa segue essa opinião com confiança moderada. O Onomástico de Eusébio a punha “acima de Paneas”, no extremo norte, o que não se ajusta a “que sobe para Seir”; a identificação moderna repousa no nome e na direção."
  de:
    - "Der Berg Halak, „der kahle“ oder „glatte Berg“, ist die Südgrenze von Josuas Eroberungen. In der Zusammenfassung heißt es, er habe das Land genommen „von dem kahlen Gebirge an, das aufsteigt gen Seir, bis gen Baal-Gad in der Ebene beim Berge Libanon, unten am Berge Hermon“, und die Liste der besiegten Könige wiederholt den Rahmen umgekehrt, „von Baal-Gad an auf der Ebene beim Berge Libanon bis an das kahle Gebirge, das aufsteigt gen Seir“. Die beiden Namen bezeichnen das ganze Land von Süd nach Nord, wie anderswo „von Dan bis gen Beer-Seba“. Sonst wird vom Berg nichts gesagt."
    - "Der Zusatz „das aufsteigt gen Seir“ setzt ihn auf den Weg nach Edom, und er wird meist mit dem Jebel Halaq (Har Halak) gleichgesetzt, einem kahlen Rücken im zentralen Negev Israels, etwa 40 km südlich von Beerscheba, dessen arabischer Name den hebräischen bewahrt; die Karte folgt dieser Ansicht mit mäßiger Sicherheit. Das Onomastikon des Eusebius setzte ihn „oberhalb von Paneas“ in den äußersten Norden, was zu „das aufsteigt gen Seir“ nicht passt; die heutige Gleichsetzung beruht auf Namen und Richtung."
  fr:
    - "Le mont Halak, « la montagne nue » ou « lisse », est la limite méridionale des conquêtes de Josué. En les résumant, le livre dit qu’il prit le pays « depuis la montagne nue qui s’élève vers Séir jusqu’à Baal-Gad, dans la vallée du Liban, au pied de la montagne d’Hermon », et la liste des rois vaincus répète le cadre en sens inverse, « depuis Baal-Gad dans la vallée du Liban jusqu’à la montagne nue qui s’élève vers Séir ». Les deux noms marquent tout le pays du sud au nord, comme « depuis Dan jusqu’à Beer-Schéba » ailleurs. On ne dit rien d’autre de la montagne."
    - "« Qui s’élève vers Séir » la place sur le chemin d’Édom, et on l’identifie d’ordinaire au djebel Halaq (Har Halak), crête nue du centre du Négev d’Israël, à environ 40 km au sud de Beer-Schéba, dont le nom arabe garde le nom hébreu ; la carte suit cet avis avec une confiance modérée. L’Onomasticon d’Eusèbe la plaçait « au-dessus de Paneas », dans l’extrême nord, ce qui ne s’accorde pas avec « qui s’élève vers Séir » ; l’identification moderne repose sur le nom et la direction."
  it:
    - "Il Monte Calak, «il monte spoglio» o «liscio», è il limite meridionale delle conquiste di Giosuè. Riassumendole, il libro dice che egli prese il paese «dalla montagna brulla che s’eleva verso Seir, fino a Baal-Gad nella valle del Libano appiè del monte Hermon», e l’elenco dei re sconfitti ripete la cornice a rovescio, «da Baal-Gad nella valle del Libano fino alla montagna brulla che si eleva verso Seir». I due nomi segnano l’intero paese da sud a nord, come altrove «da Dan fino a Beer-Sceba». Altro non si dice del monte."
    - "«Che s’eleva verso Seir» lo pone sulla via verso Edom, ed è di solito identificato con il Jebel Halaq (Har Halak), una dorsale spoglia nel Negheb centrale di Israele, a circa 40 km a sud di Bersabea, il cui nome arabo conserva quello ebraico; la mappa segue questa opinione con fiducia moderata. L’Onomasticon di Eusebio lo poneva «sopra Paneas», nell’estremo nord, il che non si accorda con «che s’eleva verso Seir»; l’identificazione moderna poggia sul nome e sulla direzione."
  pl:
    - "Góra Chalak, „łysa” albo „gładka góra”, jest południową granicą podbojów Jozuego. Podsumowując je, księga mówi, że zajął ziemię „Od góry Halak, która idzie ku Seir, aż do Baalgad, w równinie Libańskiej pod górą Hermon”, a lista pokonanych królów powtarza ramę w odwrotnej kolejności, „od Baalgad na polu Libańskiem, i aż do Halak, która idzie ku Seir”. Te dwie nazwy znaczą cały kraj z południa na północ, jak gdzie indziej „od Dan aż do Beerseba”. Nic więcej o tej górze się nie mówi."
    - "Słowa „która idzie ku Seir” umieszczają ją w drodze ku Edomowi i utożsamia się ją zwykle z Dżabal Halaq (Har Chalak), nagim grzbietem w środkowym Negewie w Izraelu, około 40 km na południe od Beer-Szeby, którego arabska nazwa zachowuje hebrajską; mapa idzie za tym poglądem z umiarkowaną pewnością. Onomastykon Euzebiusza umieszczał ją „nad Paneas” na dalekiej północy, co nie pasuje do słów „która idzie ku Seir”; współczesne utożsamienie opiera się na nazwie i kierunku."
  nl:
    - "De Berg Chalak, “de kale” of “gladde berg”, is de zuidgrens van Jozua's veroveringen. Bij het samenvatten ervan zegt het boek dat hij het land nam “Van den kalen berg, die opwaarts naar Seir gaat, tot Baal-Gad toe, in het dal van den Libanon, onder aan den berg Hermon”, en de lijst van verslagen koningen herhaalt het kader omgekeerd, “van Baal-Gad aan, in het dal van den Libanon, en tot aan den kalen berg, die naar Seir opgaat”. De twee namen markeren het hele land van zuid naar noord, zoals elders “van Dan af tot Ber-seba toe” doet. Verder wordt er niets van de berg gezegd."
    - "“Die opwaarts naar Seir gaat” plaatst hem op de weg naar Edom, en hij wordt gewoonlijk geïdentificeerd met de Jebel Halaq (Har Halak), een kale bergrug in de centrale Negev van Israël, zo'n 40 km ten zuiden van Berseba, wiens Arabische naam de Hebreeuwse bewaart; de kaart volgt die opvatting met matige zekerheid. Het Onomasticon van Eusebius plaatste hem “boven Paneas” in het verre noorden, wat niet past bij “die opwaarts naar Seir gaat”; de moderne identificatie berust op de naam en de richting."
  cs:
    - "Hora Chalak, „holá“ nebo „hladká hora“, je jižní hranice Jozuových výbojů. Shrnujíc je, kniha praví, že vzal zemi „Od hory Halak, kteráž se táhne do Seir, až k Balgad na rovině Libánské, pod horou Hermon“, a seznam poražených králů opakuje rámec obráceně, „od Balgad, kteréž jest na poli Libánském, až k hoře lysé, kteráž se táhne až do Seir“. Obě jména vymezují celou zemi od jihu k severu, jako jinde „od Dan až do Bersabé“. O hoře se nic jiného neříká."
    - "„Kteráž se táhne do Seir“ ji klade na cestu k Edómu a obvykle se ztotožňuje s Jebel Halaq (Har Halak), holým hřbetem ve středním Negevu v Izraeli, asi 40 km jižně od Beer-šeby, jehož arabské jméno uchovává hebrejské; mapa tento názor sleduje s mírnou jistotou. Eusebiův Onomastikon ji kladl „nad Paneas“ na daleký sever, což neodpovídá slovům „kteráž se táhne do Seir“; novodobé určení spočívá na jménu a směru."
  sv:
    - "Berget Halak, ”det kala” eller ”släta berget”, är södra gränsen för Josuas erövringar. Sammanfattningsvis säger boken att han tog landet ”från Halakberget, som höjer sig mot Seir, ända till Baal-Gad i Libanonsdalen nedanför berget Hermon”, och förteckningen över de besegrade konungarna upprepar ramen omvänd, ”från Baal-Gad i Libanonsdalen ända till Halakberget, som höjer sig mot Seir”. De två namnen markerar hela landet från söder till norr, liksom ”från Dan ända till Beer-Seba” gör på andra ställen. Inget annat sägs om berget."
    - "”Som höjer sig mot Seir” placerar det på vägen mot Edom, och det identifieras vanligen med Jebel Halaq (Har Halak), en kal rygg i centrala Negev i Israel, omkring 40 km söder om Beer Sheva, vars arabiska namn bevarar det hebreiska; kartan följer den uppfattningen med måttlig säkerhet. Eusebios' Onomastikon förlade det ”ovanför Paneas” i fjärran norr, vilket inte passar ”höjer sig mot Seir”; den moderna identifieringen vilar på namnet och riktningen."
  nb:
    - "Halak-fjellet, «det nakne» eller «glatte fjell», er den sørlige grensen for Josvas erobringer. I sin oppsummering sier boken at han tok landet «fra det nakne fjell som strekker sig op imot Se'ir, til Ba'al-Gad i Libanon-dalen ved foten av Hermon-fjellet», og listen over beseirede konger gjentar rammen i omvendt retning, «fra Ba'al-Gad i Libanon-dalen til det nakne fjell som strekker sig op imot Se'ir». De to navnene markerer hele landet fra sør til nord, som «fra Dan og til Be'erseba» gjør andre steder. Ingenting annet sies om fjellet."
    - "«som strekker sig op imot Se'ir» plasserer det på veien mot Edom, og det identifiseres vanligvis med Jebel Halaq (Har Halak), en bar rygg i det sentrale Negev i Israel, omkring 40 km sør for Beer-Sjeba, hvis arabiske navn bevarer det hebraiske; kartet følger dette synet med moderat sikkerhet. Eusebius' Onomasticon plasserte det «over Paneas» langt i nord, noe som ikke passer med «som strekker sig op imot Se'ir»; den moderne identifikasjonen hviler på navnet og retningen."
  tl:
    - "Ang Bundok Halac, “ang hubad” o “makinis na bundok”, ay ang katimugang hangganan ng mga pananakop ni Josue. Sa pagbubuod sa mga ito, sinasabi ng aklat na kinuha niya ang lupain “Mula sa bundok ng Halac na paahon sa Seir, hanggang sa Baal-gad sa libis ng Libano sa ibaba ng bundok Hermon”, at inuulit ng talaan ng mga natalong hari ang balangkas nang pabaligtad, “mula sa Baal-gad na libis ng Libano hanggang sa bundok ng Halac, na pasampa sa Seir”. Tinatandaan ng dalawang pangalan ang buong bansa mula timog hanggang hilaga, gaya ng “mula sa Dan hanggang sa Beer-seba” sa ibang dako. Wala nang iba pang sinasabi tungkol sa bundok."
    - "Inilalagay ito sa daan patungong Edom ng pariralang “na paahon sa Seir”, at karaniwang kinikilala ito sa Jebel Halaq (Har Halak), isang hubad na tagaytay sa gitnang Negev ng Israel, mga 40 km sa timog ng Beer-seba, na ang pangalang Arabe ay nag-iingat ng Hebreo; sinusunod ng mapa ang pananaw na iyon nang may katamtamang katiyakan. Inilagay ng Onomasticon ni Eusebio ito “sa itaas ng Paneas” sa malayong hilaga, na hindi akma sa “paahon sa Seir”; nakasalig ang makabagong pagkakakilanlan sa pangalan at sa direksiyon."
  da:
    - "Halak-bjerget, »det nøgne« eller »det glatte bjerg«, er den sydlige grænse for Josvas erobringer. Bogen opsummerer dem og siger, at han tog landet »fra det slette Bjerg, som strækker sig op mod Sejr, og indtil Baal-Gad ved Libanons Dal neden for det Bjerg Hermon«, og listen over besejrede konger gentager rammen omvendt, »fra Baal-Gad i Libanons Dal og indtil det slette Bjerg, som strækker sig op imod Sejr«. De to navne markerer hele landet fra syd til nord, som »fra Dan indtil Beersaba« gør andetsteds. Intet andet siges om bjerget."
    - "»Som strækker sig op mod Sejr« placerer det på vejen mod Edom, og det identificeres sædvanligvis med Jebel Halaq (Har Halak), en nøgen højderyg i det centrale Negev i Israel, omkring 40 km syd for Beersheba, hvis arabiske navn bevarer det hebraiske; kortet følger denne opfattelse med moderat sikkerhed. Eusebius' Onomasticon placerede det »over Paneas« i det fjerne nord, hvilket ikke passer med »som strækker sig op mod Sejr«; den moderne identifikation hviler på navnet og retningen."
  sr:
    - "Гора Халак, „гола“ или „глатка гора“, јужна је граница Исусових освајања. Сажимајући их, књига каже да је узео земљу „Од горе Алака, која се пружа к Сиру, до Вал-Гада у пољу ливанском, под гором Ермоном“, а списак побеђених царева понавља оквир обрнуто, „од Вал-Гада у пољу ливанском па до горе Алака како се иде к Сиру“. Та два имена обележавају целу земљу од југа ка северу, као што то на другом месту чини „од Дана до Вирсавеје“. О гори се ништа друго не каже."
    - "„Која се пружа к Сиру“ смешта је на пут према Едому, и обично се поистовећује с Џебел Халаком (Хар Халак), голим гребеном у средишњем Негеву Израела, око 40 км јужно од Вирсавеје, чије арапско име чува хебрејско; мапа следи то гледиште с умереним поуздањем. Јевсевијев Ономастикон смештао ју је „изнад Паниаса“ на далеком северу, што не одговара „која се пружа к Сиру“; савремена идентификација почива на имену и правцу."
