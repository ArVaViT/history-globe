body:
  en:
    - "Chesulloth was a town on the border of Issachar, in the list that begins “their border was toward Jezreel, and Chesulloth, and Shunem”. The border of Zebulun runs from Sarid “unto the border of Chisloth-tabor”, usually taken to be the same place on the north side of the line. Both are identified with Iksal, an Arab town at the edge of the Jezreel plain at the foot of the Nazareth hills, about 5 km south-east of Nazareth and west of Mount Tabor, which keeps the name; Hebrew sources still call it Kislot Tavor."
    - "Josephus knew it as Xaloth, a village “in the great plain” that marked the southern limit of Lower Galilee, whose breadth he measures from Xaloth to Bersabe. Finds from the Roman and Byzantine periods at Iksal include rock-cut tombs, glass vessels and a rock-cut winepress; Uzi Leibner counts it among the Galilean villages with a Jewish population in Roman times. In the Crusader period a castle was built there, whose ruins are still visible; the Survey of Western Palestine in 1881 described Iksal as a large stone village with a conspicuous square tower."
  ru:
    - "Кесуллоф — город на границе Иссахара, в списке, который начинается так: «пределом их был: Изреель, Кесуллоф и Сунем». Граница Завулона идёт от Сарида «до предела Кислоф-Фавора», и это обычно считают тем же местом с северной стороны черты. Оба отождествляют с Иксалем, арабским городом на краю Изреельской долины у подножия Назаретских гор, примерно в 5 км к юго-востоку от Назарета и к западу от горы Фавор, сохранившим имя; в еврейских источниках он и сейчас называется Кислот-Тавор."
    - "Иосиф Флавий знал его как Ксалоф — селение «на великой равнине», отмечавшее южный предел Нижней Галилеи, ширину которой он измеряет от Ксалофа до Берсаве. Среди находок римского и византийского времени в Иксале — высеченные в скале гробницы, стеклянные сосуды и вырубленная в скале давильня; Узи Лейбнер относит его к галилейским селениям с иудейским населением в римское время. Во времена крестоносцев здесь построили замок, развалины которого видны и сейчас; «Обзор Западной Палестины» в 1881 г. описал Иксаль как большое каменное селение с заметной квадратной башней."
  cs:
    - "Kesulót bylo město na hranici Isacharově, v seznamu, který začíná: „A meze jejich: Jezreel, Kasalat a Sunem“. Hranice Zebulunu vede od Saridu „ku pomezí Chazelet Tábor“, což se obvykle pokládá za totéž místo na severní straně hranice. Obě se ztotožňují s Iksalem, arabským městem na okraji Jizreelské roviny na úpatí nazaretských kopců, asi 5 km jihovýchodně od Nazareta a západně od Tábora, které jméno zachovalo; hebrejské prameny je dosud nazývají Kislot Tavor."
    - "Josephus Flavius je znal jako Xaloth, vesnici „ve Velké rovině“, která vyznačovala jižní mez Dolní Galileje, jejíž šířku měří od Xalothu k Bersabe. Nálezy z římského a byzantského období v Iksalu zahrnují hrobky vytesané ve skále, skleněné nádoby a lis na víno vytesaný ve skále; Uzi Leibner jej počítá mezi galilejské vesnice se židovským obyvatelstvem v římské době. V křižáckém období tam byl vystavěn hrad, jehož zříceniny jsou dosud vidět; Průzkum západní Palestiny roku 1881 popsal Iksal jako velkou kamennou vesnici s nápadnou čtvercovou věží."
  uk:
    - "Кесуллот був містом на межі Іссахара, у переліку, що починається: «А границями їх були: Езреель, Кесуллот і Сунем». Межа Завулона йде від Саріда «на займище Кислот-Таборське», яке зазвичай вважають тим самим місцем на північному боці лінії. Обидва ототожнюють з Іксалом, арабським містом на краю Їзреельської рівнини біля підніжжя назаретських пагорбів, приблизно за 5 км на південний схід від Назарета й на захід від гори Фавор, яке зберігає назву; єврейські джерела досі називають його Кислот-Тавор."
    - "Йосиф Флавій знав його як Ксалот, село «у великій рівнині», що позначало південну межу Нижньої Галілеї, ширину якої він міряє від Ксалота до Берсаве. Знахідки римського й візантійського періодів в Іксалі включають висічені в скелі гробниці, скляний посуд і висічений у скелі винний прес; Узі Лейбнер зараховує його до галілейських сіл з єврейським населенням у римські часи. За доби хрестоносців там збудували замок, руїни якого досі видно; «Survey of Western Palestine» 1881 р. описав Іксал як велике кам'яне село з помітною квадратною вежею."
  pl:
    - "Kislot było miastem na granicy Issachara, na liście, która zaczyna się od słów: „A była granica ich Jezreel, i Chasalot, i Sunem”. Granica Zabulona biegnie od Sarid „ku granicy Chasalek Tabor”, co uważa się zwykle za to samo miejsce po północnej stronie linii. Oba utożsamia się z Iksal, arabskim miastem na skraju równiny Jizreel u stóp wzgórz Nazaretu, około 5 km na południowy wschód od Nazaretu i na zachód od góry Tabor, które zachowuje nazwę; źródła hebrajskie nadal nazywają je Kislot Tawor."
    - "Józef Flawiusz znał je jako Xaloth, wieś „na Wielkiej Równinie”, która wyznaczała południową granicę Dolnej Galilei, której szerokość mierzy od Xaloth do Bersabe. Znaleziska z okresu rzymskiego i bizantyjskiego w Iksal obejmują grobowce wykute w skale, naczynia szklane i tłocznię wina wykutą w skale; Uzi Leibner zalicza je do wsi galilejskich z ludnością żydowską w czasach rzymskich. W okresie krzyżowców zbudowano tam zamek, którego ruiny są nadal widoczne; Survey of Western Palestine w 1881 roku opisał Iksal jako dużą kamienną wieś z rzucającą się w oczy czworokątną wieżą."
  es:
    - "Quesulot era una ciudad en la frontera de Isacar, en la lista que empieza «fué su término Izreel, y Chesullot, y Sunem». La frontera de Zabulón va desde Sarid «al término de Chisiloth-tabor», que suele tomarse por el mismo lugar en el lado norte de la línea. Ambos se identifican con Iksal, una ciudad árabe al borde de la llanura de Jezreel, al pie de las colinas de Nazaret, a unos 5 km al sureste de Nazaret y al oeste del monte Tabor, que conserva el nombre; las fuentes hebreas aún la llaman Kislot Tavor."
    - "Josefo la conocía como Xaloth, una aldea «en la gran llanura» que marcaba el límite meridional de la Baja Galilea, cuya anchura mide desde Xaloth hasta Bersabe. Entre los hallazgos romanos y bizantinos de Iksal hay tumbas excavadas en la roca, vasos de vidrio y un lagar excavado en la roca; Uzi Leibner la cuenta entre las aldeas galileas con población judía en época romana. En el período de los cruzados se construyó allí un castillo, cuyas ruinas aún se ven; el Survey of Western Palestine describió en 1881 Iksal como una gran aldea de piedra con una llamativa torre cuadrada."
  pt:
    - "Quesulote era uma cidade na fronteira de Issacar, na lista que começa assim: “A sua fronteira ia até Jezreel, Quesulote, Suném”. A fronteira de Zebulom corre de Saride “até a fronteira de Quislote-Tabor”, em geral tomada pelo mesmo lugar no lado norte da linha. Ambas são identificadas com Iksal, uma cidade árabe na borda da planície de Jezreel, ao pé das colinas de Nazaré, cerca de 5 km a sudeste de Nazaré e a oeste do monte Tabor, que conserva o nome; fontes hebraicas ainda a chamam Kislot Tavor."
    - "Josefo a conhecia como Xaloth, uma aldeia “na grande planície” que marcava o limite sul da Baixa Galileia, cuja largura ele mede de Xaloth a Bersabé. Achados dos períodos romano e bizantino em Iksal incluem túmulos escavados na rocha, vasos de vidro e um lagar escavado na rocha; Uzi Leibner a conta entre as aldeias galileias com população judaica em tempos romanos. No período cruzado foi construído ali um castelo, cujas ruínas ainda são visíveis; o Survey of Western Palestine, em 1881, descreveu Iksal como uma grande aldeia de pedra com uma torre quadrada bem visível."
  de:
    - "Kesullot war eine Stadt an der Grenze Issachars, in der Liste, die beginnt: „Und ihr Gebiet war Jesreel, Chesulloth, Sunem“. Die Grenze Sebulons verläuft von Sarid, sie „wendet sich von Sarid gegen der Sonne Aufgang bis an die Grenze Kisloth-Thabor“, gewöhnlich für denselben Ort an der Nordseite der Linie gehalten. Beide werden mit Iksal gleichgesetzt, einer arabischen Stadt am Rand der Jesreelebene am Fuß der Hügel von Nazareth, etwa 5 km südöstlich von Nazareth und westlich des Tabor, die den Namen bewahrt; hebräische Quellen nennen sie noch Kislot Tavor."
    - "Josephus kannte es als Xaloth, ein Dorf „in der großen Ebene“, das die Südgrenze Untergaliläas markierte, dessen Breite er von Xaloth bis Bersabe misst. Funde aus römischer und byzantinischer Zeit in Iksal umfassen Felsgräber, Glasgefäße und eine in den Fels gehauene Kelter; Uzi Leibner zählt es zu den galiläischen Dörfern mit jüdischer Bevölkerung in römischer Zeit. In der Kreuzfahrerzeit wurde dort eine Burg errichtet, deren Ruinen noch sichtbar sind; der Survey of Western Palestine beschrieb Iksal 1881 als großes Steindorf mit einem auffälligen quadratischen Turm."
  fr:
    - "Kesulloth était une ville de la frontière d’Issacar, dans la liste qui commence ainsi : « Leur limite passait par Jizreel, Kesulloth, Sunem ». La frontière de Zabulon va de Sarid « jusqu’à la frontière de Kisloth-Thabor », d’ordinaire tenue pour le même lieu, du côté nord de la ligne. Les deux sont identifiés avec Iksal, ville arabe au bord de la plaine de Jizreel, au pied des collines de Nazareth, à environ 5 km au sud-est de Nazareth et à l’ouest du mont Thabor, qui garde le nom ; les sources hébraïques l’appellent encore Kislot Tavor."
    - "Josèphe la connaissait sous le nom de Xaloth, village « dans la grande plaine » qui marquait la limite sud de la Basse Galilée, dont il mesure la largeur de Xaloth à Bersabé. Les trouvailles des époques romaine et byzantine à Iksal comprennent des tombes taillées dans le roc, des verres et un pressoir taillé dans le roc ; Uzi Leibner la compte parmi les villages galiléens à population juive à l’époque romaine. À l’époque des croisés, un château y fut bâti, dont les ruines sont encore visibles ; le Survey of Western Palestine décrivit en 1881 Iksal comme un grand village de pierre avec une tour carrée bien visible."
  it:
    - "Chesullot era una città sul confine di Issacar, nell’elenco che comincia: «Il loro territorio comprendeva: Izreel, Kesulloth, Sunem». Il confine di Zabulon va da Sarid «sino al confine di Kisloth-Tabor», di solito ritenuta lo stesso luogo sul lato nord della linea. Entrambe sono identificate con Iksal, una città araba al margine della piana di Izreel ai piedi delle colline di Nazaret, a circa 5 km a sud-est di Nazaret e a ovest del monte Tabor, che ne conserva il nome; le fonti ebraiche la chiamano ancora Kislot Tavor."
    - "Giuseppe Flavio la conosceva come Xaloth, un villaggio «nella grande pianura» che segnava il limite meridionale della Galilea inferiore, la cui larghezza egli misura da Xaloth a Bersabe. I reperti di epoca romana e bizantina a Iksal comprendono tombe scavate nella roccia, vasi di vetro e un torchio per il vino scavato nella roccia; Uzi Leibner la annovera tra i villaggi galilei con popolazione ebraica in epoca romana. In epoca crociata vi fu costruito un castello, le cui rovine sono ancora visibili; il Survey of Western Palestine nel 1881 descrisse Iksal come un grande villaggio di pietra con una vistosa torre quadrata."
  nl:
    - "Kesullot was een stad op de grens van Issachar, in de lijst die begint met “hun landpale was Jizreela, en Chesulloth, en Sunem”. De grens van Zebulon loopt van Sarid “tot de landpale van Chisloth-Thabor”, gewoonlijk opgevat als dezelfde plaats aan de noordzijde van de lijn. Beide worden vereenzelvigd met Iksal, een Arabische stad aan de rand van de vlakte van Jizreël aan de voet van de heuvels van Nazareth, ongeveer 5 km ten zuidoosten van Nazareth en ten westen van de Tabor, die de naam bewaart; Hebreeuwse bronnen noemen haar nog Kislot Tavor."
    - "Josephus kende haar als Xaloth, een dorp “in de grote vlakte” dat de zuidgrens van Neder-Galilea markeerde, wier breedte hij meet van Xaloth tot Bersabe. Vondsten uit de Romeinse en Byzantijnse tijd te Iksal omvatten in de rots uitgehouwen graven, glazen voorwerpen en een in de rots uitgehouwen wijnpers; Uzi Leibner rekent het tot de Galilese dorpen met een Joodse bevolking in Romeinse tijd. In de kruisvaardertijd werd er een kasteel gebouwd, waarvan de ruïnes nog zichtbaar zijn; de Survey of Western Palestine beschreef Iksal in 1881 als een groot stenen dorp met een opvallende vierkante toren."
  sv:
    - "Kesullot var en stad vid Isaskars gräns, i förteckningen som börjar: ”Och deras gräns omfattade Jisreel, Kesullot, Sunem”. Sebulons gräns löper från Sarid, och därefter ”vände den sig åt Kislot-Tabors område”, vanligen ansett vara samma plats på linjens norra sida. Båda identifieras med Iksal, en arabisk stad vid kanten av Jisreelslätten vid foten av Nasarets berg, omkring 5 km sydost om Nasaret och väster om berget Tabor, som bevarar namnet; hebreiska källor kallar den fortfarande Kislot Tavor."
    - "Josefus kände den som Xaloth, en by ”i den stora slätten” som markerade nedre Galileens södra gräns, vars bredd han mäter från Xaloth till Bersabe. Fynd från romersk och bysantinsk tid vid Iksal omfattar klipputhuggna gravar, glaskärl och en klipputhuggen vinpress; Uzi Leibner räknar den bland de galileiska byarna med judisk befolkning under romersk tid. Under korstågstiden byggdes en borg där, vars ruiner ännu syns; Survey of Western Palestine beskrev 1881 Iksal som en stor stenby med ett iögonfallande fyrkantigt torn."
  nb:
    - "Kesullot var en by på grensen til Issakar, i listen som begynner «I deres land lå Jisre'ela og Hakkesullot og Sunem». Sebuluns grense går fra Sarid «bort til Kislot-Tabors enemerker», vanligvis regnet for å være samme sted på nordsiden av linjen. Begge identifiseres med Iksal, en arabisk by i kanten av Jisreel-sletten ved foten av Nasaret-åsene, omtrent 5 km sørøst for Nasaret og vest for Tabor, som har bevart navnet; hebraiske kilder kaller det fremdeles Kislot Tavor."
    - "Josefus kjente den som Xaloth, en landsby «i den store sletten» som markerte sørgrensen av Nedre Galilea, hvis bredde han måler fra Xaloth til Bersabe. Funn fra romersk og bysantinsk tid ved Iksal omfatter fjellhugde graver, glasskar og en fjellhugd vinpresse; Uzi Leibner regner den blant de galileiske landsbyene med jødisk befolkning i romertiden. I korsfarertiden ble det bygd en borg der, hvis ruiner fremdeles er synlige; Survey of Western Palestine beskrev i 1881 Iksal som en stor steinlandsby med et iøynefallende firkantet tårn."
  tl:
    - "Ang Chesulloth ay isang bayan sa hangganan ng Issachar, sa talaang nagsisimula sa “ang kanilang hangganan ay hanggang sa Izreel, at Chesulloth, at Sunem”. Ang hangganan ng Zabulon ay tumatakbo mula sa Sarid “hanggang sa hangganan ng Chisiloth-tabor”, karaniwang itinuturing na gayunding pook sa hilagang panig ng guhit. Parehong kinikilala sa Iksal, isang bayang Arabe sa gilid ng kapatagan ng Jezreel sa paanan ng mga burol ng Nazaret, mga 5 km sa timog-silangan ng Nazaret at sa kanluran ng Bundok Tabor, na nagpapanatili ng pangalan; tinatawag pa rin ito ng mga pinagmulang Hebreo na Kislot Tavor."
    - "Kilala ito ni Josefo bilang Xaloth, isang nayon “sa malaking kapatagan” na nagmarka sa katimugang hangganan ng Mababang Galilea, na ang lapad ay sinusukat niya mula Xaloth hanggang Bersabe. Ang mga natagpuan sa Iksal mula sa mga panahong Romano at Bizantino ay kinabibilangan ng mga libingang tinabas sa bato, mga sisidlang salamin at isang pisaan ng alak na tinabas sa bato; ibinibilang ito ni Uzi Leibner sa mga nayon ng Galilea na may populasyong Judio noong panahong Romano. Noong panahon ng mga Krusado ay nagtayo roon ng kastilyo, na nakikita pa ang mga guho; inilarawan ng Survey ng Kanlurang Palestina noong 1881 ang Iksal bilang malaking nayong bato na may kitang-kitang parisukat na tore."
