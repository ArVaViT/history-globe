# Overview article (ADR 0007). Mainstream facts only; disputed points (where Philippians was written) are named as such.
id: philippi
place: a49e1d0
title:
  en: "Philippi"
  ru: "Филиппы"
  uk: "Філіппи"
  es: "Filipos"
  pt: "Filipos"
  de: "Philippi"
  fr: "Philippes"
body:
  en:
    - 'Philippi lies in eastern Macedonia, about 15 km inland from its port Neapolis (modern Kavala), on a hill above a fertile plain rich in springs and near gold mines. About 360 BC settlers from the island of Thasos founded a town here called Crenides, "the springs". Philip II of Macedon soon took it, enlarged it, named it after himself and worked its gold mines so well that, Diodorus says, they brought him more than a thousand talents.'
    - "In 42 BC the plain beside the city saw the battles in which Antony and Octavian defeated Brutus and Cassius, the murderers of Julius Caesar; both took their own lives. Philippi then became a Roman colony on the Via Egnatia, the road across the Balkans, and after his victory at Actium Octavian settled here Italians whose land he had given to his veterans. Most of its public inscriptions were written in Latin."
    - 'Paul, Silas and their companions sailed from Troas to Neapolis and came to Philippi, which Acts calls "the chief city of that part of Macedonia, and a colony". On the sabbath they went out to a place of prayer by a river, where Lydia, a seller of purple from Thyatira, believed and was baptised with her household. When Paul drove a spirit of divination out of a slave girl, her masters dragged him and Silas before the magistrates, who had them beaten and imprisoned. At midnight an earthquake opened the prison; the jailer was baptised, and in the morning the magistrates, hearing that the two were Roman citizens, came and asked them to leave. The church at Philippi sent Paul gifts more than once. His letter to it, written from prison (in Rome, Ephesus or Caesarea; this is disputed), greets its bishops and deacons.'
    - "Paul passed through Philippi again on his last journey to Jerusalem. In the first half of the second century, most probably, Polycarp of Smyrna wrote to the Philippians, reminding them that Paul had taught among them and written to them. In the fourth century the Christians of Philippi built a church dedicated to Paul, and about AD 500 a large basilica rose on the terrace above the forum."
  ru:
    - "Филиппы лежат в восточной Македонии, примерно в 15 км от своей гавани Неаполя (нынешней Кавалы), на холме над плодородной равниной, богатой источниками, неподалёку от золотых рудников. Около 360 г. до н. э. переселенцы с острова Фасос основали здесь городок Крениды, то есть «источники». Вскоре его взял Филипп II Македонский: он расширил город, назвал его своим именем и так наладил работу золотых рудников, что они, по словам Диодора, приносили ему более тысячи талантов."
    - "В 42 г. до н. э. на равнине у города произошли сражения, в которых Антоний и Октавиан разбили Брута и Кассия, убийц Юлия Цезаря; оба покончили с собой. Затем Филиппы стали римской колонией на Эгнатиевой дороге, пересекавшей Балканы, а после победы при Акции Октавиан поселил здесь италийцев, чьи земли отдал своим ветеранам. Большая часть надписей города была на латыни."
    - "Павел, Сила и их спутники отплыли из Троады в Неаполь и пришли в Филиппы — по словам Деяний, «первый город в той части Македонии, колония». В субботу они вышли к реке, где был молитвенный дом, и там уверовала и крестилась со своими домашними Лидия, торговавшая багряницею, из Фиатиры. Когда Павел изгнал дух прорицательный из одной служанки, её господа повлекли его и Силу к воеводам, и те велели бить их палками и бросить в темницу. Около полуночи землетрясение отворило двери темницы; темничный страж крестился, а утром воеводы, услышав, что оба — римские граждане, пришли и попросили их удалиться из города. Церковь в Филиппах не раз посылала Павлу помощь. Его послание к ней, написанное в узах (в Риме, Ефесе или Кесарии — это спорно), обращено и к её епископам и диаконам."
    - "Павел ещё раз прошёл через Филиппы на последнем пути в Иерусалим. Скорее всего, в первой половине II века Поликарп Смирнский написал филиппийцам послание, напоминая, что Павел учил у них и писал им. В IV веке христиане Филипп построили церковь во имя Павла, а около 500 г. н. э. на террасе над форумом поднялась большая базилика."
  uk:
    - "Філіппи лежать на сході Македонії, приблизно за 15 км углиб країни від свого порту Неаполя (нинішня Кавала), на пагорбі над родючою рівниною, багатою на джерела й розташованою поблизу золотих копалень. Близько 360 р. до н. е. поселенці з острова Тасос заснували тут місто Кренід, «Джерела». Пилип II Македонський невдовзі захопив його, розбудував, назвав своїм ім’ям і так успішно розробляв його золоті копальні, що, за словами Діодора, вони приносили йому понад тисячу талантів."
    - "У 42 р. до н. е. на рівнині біля міста відбулися битви, в яких Антоній і Октавіан розбили Брута й Кассія, вбивць Юлія Цезаря; обидва наклали на себе руки. Потім Філіппи стали римською колонією на Егнатієвій дорозі, шляху через Балкани, а після перемоги при Акції Октавіан оселив тут італійців, чию землю він віддав своїм ветеранам. Більшість публічних написів тут було складено латиною."
    - "Павло, Сила та їхні супутники попливли з Троади до Неаполя й дійшли до Філіпп, які Діяння називають: «первий город тієї части Македониї, — осада». У суботу вони вийшли до місця молитви біля річки, де Лідія, торговка пурпуром із Тіатири, увірувала й охрестилася разом зі своїм домом. Коли Павло вигнав дух ворожіння з рабині, її господарі потягли його й Силу до урядників, які звеліли їх побити й ув’язнити. Опівночі землетрус відчинив в’язницю; темничний сторож охрестився, а вранці урядники, почувши, що обидва — римські громадяни, прийшли й просили їх піти. Філіппійська церква не раз надсилала Павлові дари. Його лист до неї, писаний із в’язниці (в Римі, Ефесі чи Кесарії; це спірно), вітає її єпископів і дияконів."
    - "Павло знову проходив через Філіппи в останню подорож до Єрусалима. У першій половині II ст., найімовірніше, Полікарп Смирнський написав філіппійцям, нагадавши, що Павло навчав серед них і писав до них. У IV ст. християни Філіпп збудували церкву, присвячену Павлові, а близько 500 р. н. е. на терасі над форумом постала велика базиліка."
  es:
    - "Filipos está en la Macedonia oriental, a unos 15 km tierra adentro de su puerto Neápolis (la actual Kavala), en una colina sobre una fértil llanura rica en manantiales y cercana a minas de oro. Hacia 360 a. C. colonos de la isla de Tasos fundaron aquí una ciudad llamada Crénides, «las fuentes». Filipo II de Macedonia pronto se apoderó de ella, la amplió, le dio su nombre y explotó tan bien sus minas de oro que, dice Diodoro, le rindieron más de mil talentos."
    - "En 42 a. C. la llanura junto a la ciudad vio las batallas en que Antonio y Octavio derrotaron a Bruto y Casio, los asesinos de Julio César; ambos se quitaron la vida. Filipos se convirtió entonces en colonia romana en la Vía Egnatia, el camino que cruzaba los Balcanes, y tras su victoria en Accio Octavio asentó aquí a italianos cuyas tierras había dado a sus veteranos. La mayoría de sus inscripciones públicas estaban escritas en latín."
    - "Pablo, Silas y sus compañeros zarparon de Troas a Neápolis y llegaron a Filipos, a la que los Hechos llaman «la primera ciudad de la parte de Macedonia, y una colonia». El sábado salieron a un lugar de oración junto a un río, donde Lidia, vendedora de púrpura de Tiatira, creyó y fue bautizada con su familia. Cuando Pablo expulsó un espíritu de adivinación de una esclava, sus amos arrastraron a él y a Silas ante los magistrados, que los hicieron azotar y encarcelar. A medianoche un terremoto abrió la cárcel; el carcelero fue bautizado, y por la mañana los magistrados, al saber que los dos eran ciudadanos romanos, vinieron y les pidieron que se fueran. La iglesia de Filipos envió a Pablo regalos más de una vez. Su carta a ella, escrita desde la cárcel (en Roma, Éfeso o Cesarea; esto se discute), saluda a sus obispos y diáconos."
    - "Pablo pasó de nuevo por Filipos en su último viaje a Jerusalén. En la primera mitad del siglo II, con la mayor probabilidad, Policarpo de Esmirna escribió a los filipenses, recordándoles que Pablo había enseñado entre ellos y les había escrito. En el siglo IV los cristianos de Filipos construyeron una iglesia dedicada a Pablo, y hacia el 500 d. C. se levantó una gran basílica en la terraza sobre el foro."
  pt:
    - "Filipos fica no leste da Macedônia, a cerca de 15 km para o interior de seu porto Neápolis (a atual Cavala), numa colina acima de uma planície fértil, rica em fontes e perto de minas de ouro. Por volta de 360 a.C., colonos da ilha de Tasos fundaram aqui uma cidade chamada Crênides, “as fontes”. Filipe II da Macedônia logo a tomou, ampliou-a, deu-lhe o seu nome e explorou tão bem suas minas de ouro que, diz Diodoro, lhe renderam mais de mil talentos."
    - "Em 42 a.C., a planície ao lado da cidade viu as batalhas em que Antônio e Otaviano derrotaram Bruto e Cássio, os assassinos de Júlio César; ambos se mataram. Filipos tornou-se então colônia romana na Via Egnácia, a estrada que cruzava os Bálcãs, e depois de sua vitória em Áccio Otaviano ali instalou italianos cujas terras havia dado a seus veteranos. A maior parte de suas inscrições públicas foi escrita em latim."
    - "Paulo, Silas e seus companheiros navegaram de Trôade a Neápolis e chegaram a Filipos, que Atos chama de “a cidade principal daquele distrito da Macedônia, e uma colônia romana”. No sábado saíram a um lugar de oração junto a um rio, onde Lídia, vendedora de púrpura de Tiatira, creu e foi batizada com sua casa. Quando Paulo expulsou um espírito de adivinhação de uma escrava, seus senhores arrastaram-no com Silas diante dos magistrados, que os mandaram açoitar e prender. À meia-noite um terremoto abriu a prisão; o carcereiro foi batizado, e de manhã os magistrados, ao saber que os dois eram cidadãos romanos, vieram e lhes pediram que partissem. A igreja de Filipos enviou presentes a Paulo mais de uma vez. Sua carta a ela, escrita da prisão (em Roma, Éfeso ou Cesareia; é discutido), saúda seus bispos e diáconos."
    - "Paulo passou de novo por Filipos em sua última viagem a Jerusalém. Na primeira metade do século II, o mais provável, Policarpo de Esmirna escreveu aos filipenses, lembrando-lhes que Paulo havia ensinado entre eles e lhes escrito. No século IV os cristãos de Filipos construíram uma igreja dedicada a Paulo, e por volta de 500 d.C. uma grande basílica se ergueu no terraço acima do fórum."
  de:
    - "Philippi liegt im östlichen Mazedonien, etwa 15 km landeinwärts von seinem Hafen Neapolis (heute Kavala), auf einem Hügel über einer fruchtbaren, quellenreichen Ebene nahe Goldminen. Um 360 v. Chr. gründeten Siedler von der Insel Thasos hier eine Stadt namens Krenides, „die Quellen“. Philipp II. von Mazedonien nahm sie bald ein, erweiterte sie, benannte sie nach sich und baute ihre Goldminen so gut aus, dass sie ihm nach Diodor mehr als tausend Talente einbrachten."
    - "Im Jahr 42 v. Chr. sah die Ebene neben der Stadt die Schlachten, in denen Antonius und Oktavian Brutus und Cassius, die Mörder Julius Caesars, besiegten; beide nahmen sich das Leben. Philippi wurde dann römische Kolonie an der Via Egnatia, der Straße quer über den Balkan, und nach seinem Sieg bei Actium siedelte Oktavian hier Italiker an, deren Land er an seine Veteranen vergeben hatte. Die meisten öffentlichen Inschriften waren lateinisch."
    - "Paulus, Silas und ihre Gefährten fuhren von Troas nach Neapolis und kamen nach Philippi, das die Apostelgeschichte „die Hauptstadt des Landes Mazedonien und eine Freistadt“ nennt. Am Sabbat gingen sie zu einem Gebetsplatz am Fluss, wo Lydia, eine Purpurhändlerin aus Thyatira, glaubte und mit ihrem Haus getauft wurde. Als Paulus einen Wahrsagegeist aus einer Sklavin austrieb, schleppten ihre Herren ihn und Silas vor die Stadtobersten, die sie schlagen und einkerkern ließen. Um Mitternacht öffnete ein Erdbeben das Gefängnis; der Kerkermeister wurde getauft, und am Morgen kamen die Stadtobersten, als sie hörten, dass die beiden römische Bürger waren, und baten sie wegzugehen. Die Gemeinde in Philippi sandte Paulus mehrmals Gaben. Sein Brief an sie, aus der Haft geschrieben (in Rom, Ephesus oder Caesarea; das ist umstritten), grüßt ihre Bischöfe und Diakone."
    - "Paulus kam auf seiner letzten Reise nach Jerusalem erneut durch Philippi. In der ersten Hälfte des 2. Jahrhunderts, höchstwahrscheinlich, schrieb Polykarp von Smyrna an die Philipper und erinnerte sie, dass Paulus unter ihnen gelehrt und ihnen geschrieben hatte. Im 4. Jahrhundert bauten die Christen Philippis eine dem Paulus geweihte Kirche, und um 500 n. Chr. erhob sich auf der Terrasse über dem Forum eine große Basilika."
  fr:
    - "Philippes se trouve dans l’est de la Macédoine, à environ 15 km à l’intérieur des terres depuis son port Néapolis (l’actuelle Kavala), sur une colline au-dessus d’une plaine fertile, riche en sources et proche de mines d’or. Vers 360 av. J.-C., des colons de l’île de Thasos y fondèrent une ville appelée Crénides, « les sources ». Philippe II de Macédoine la prit bientôt, l’agrandit, lui donna son nom et exploita si bien ses mines d’or que, dit Diodore, elles lui rapportèrent plus de mille talents."
    - "En 42 av. J.-C., la plaine voisine de la ville vit les batailles où Antoine et Octavien vainquirent Brutus et Cassius, les meurtriers de Jules César ; tous deux se donnèrent la mort. Philippes devint alors une colonie romaine sur la voie Egnatia, la route qui traversait les Balkans, et après sa victoire d’Actium, Octavien y installa des Italiens dont il avait donné les terres à ses vétérans. La plupart de ses inscriptions publiques étaient en latin."
    - "Paul, Silas et leurs compagnons firent voile de Troas à Néapolis et vinrent à Philippes, que les Actes appellent « la première ville d’un district de Macédoine, et une colonie ». Le sabbat, ils sortirent vers un lieu de prière près d’une rivière, où Lydie, marchande de pourpre de Thyatire, crut et fut baptisée avec sa famille. Quand Paul chassa un esprit de divination d’une servante, ses maîtres traînèrent Paul et Silas devant les magistrats, qui les firent battre et emprisonner. À minuit un séisme ouvrit la prison ; le geôlier fut baptisé, et au matin les magistrats, apprenant que les deux étaient citoyens romains, vinrent leur demander de partir. L’Église de Philippes envoya plus d’une fois des dons à Paul. Sa lettre, écrite de prison (à Rome, Éphèse ou Césarée ; c’est disputé), salue ses évêques et ses diacres."
    - "Paul repassa par Philippes lors de son dernier voyage à Jérusalem. Dans la première moitié du IIe siècle, très probablement, Polycarpe de Smyrne écrivit aux Philippiens, leur rappelant que Paul avait enseigné parmi eux et leur avait écrit. Au IVe siècle, les chrétiens de Philippes bâtirent une église dédiée à Paul, et vers 500 apr. J.-C. une grande basilique s’éleva sur la terrasse au-dessus du forum."
