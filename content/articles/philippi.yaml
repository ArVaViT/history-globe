body:
  en:
    - 'Philippi lies in eastern Macedonia, about 15 km inland from its port Neapolis (modern Kavala), on a hill above a fertile plain rich in springs and near gold mines. About 360 BC settlers from the island of Thasos founded a town here called Crenides, "the springs". Philip II of Macedon soon took it, enlarged it, named it after himself and worked its gold mines so well that, Diodorus says, they brought him more than a thousand talents.'
    - "In 42 BC the plain beside the city saw the battles in which Antony and Octavian defeated Brutus and Cassius, the murderers of Julius Caesar; both took their own lives. Philippi then became a Roman colony on the Via Egnatia, the road across the Balkans, and after his victory at Actium Octavian settled here Italians whose land he had given to his veterans. Most of its public inscriptions were written in Latin."
    - 'Paul, Silas and their companions sailed from Troas to Neapolis and came to Philippi, which Acts calls "the chief city of that part of Macedonia, and a colony". On the sabbath they went out to a place of prayer by a river, where Lydia, a seller of purple from Thyatira, believed and was baptised with her household. When Paul drove a spirit of divination out of a slave girl, her masters dragged him and Silas before the magistrates, who had them beaten and imprisoned. At midnight an earthquake opened the prison; the jailer was baptised, and in the morning the magistrates, hearing that the two were Roman citizens, came and asked them to leave. The church at Philippi sent Paul gifts more than once. His letter to it, written from prison (in Rome, Ephesus or Caesarea; this is disputed), greets its bishops and deacons.'
    - "Paul passed through Philippi again on his last journey to Jerusalem. In the first half of the second century, most probably, Polycarp of Smyrna wrote to the Philippians, reminding them that Paul had taught among them and written to them. In the fourth century the Christians of Philippi built a church dedicated to Paul, and about AD 500 a large basilica rose on the terrace above the forum."
  ru:
    - "Филиппы лежат в восточной Македонии, примерно в 15 км от своей гавани Неаполя (нынешней Кавалы), на холме над плодородной равниной, богатой источниками, неподалёку от золотых рудников. Около 360 г. до н. э. переселенцы с острова Фасос основали здесь городок Крениды, то есть «источники». Вскоре его взял Филипп II Македонский: он расширил город, назвал его своим именем и так наладил работу золотых рудников, что они, по словам Диодора, приносили ему более тысячи талантов."
    - "В 42 г. до н. э. на равнине у города произошли сражения, в которых Антоний и Октавиан разбили Брута и Кассия, убийц Юлия Цезаря; оба покончили с собой. Затем Филиппы стали римской колонией на Эгнатиевой дороге, пересекавшей Балканы, а после победы при Акции Октавиан поселил здесь италийцев, чьи земли отдал своим ветеранам. Большая часть надписей города была на латыни."
    - "Павел, Сила и их спутники отплыли из Троады в Неаполь и пришли в Филиппы — по словам Деяний, «первый город в той части Македонии, колония». В субботу они вышли к реке, где был молитвенный дом, и там уверовала и крестилась со своими домашними Лидия, торговавшая багряницею, из Фиатиры. Когда Павел изгнал дух прорицательный из одной служанки, её господа повлекли его и Силу к воеводам, и те велели бить их палками и бросить в темницу. Около полуночи землетрясение отворило двери темницы; темничный страж крестился, а утром воеводы, услышав, что оба — римские граждане, пришли и попросили их удалиться из города. Церковь в Филиппах не раз посылала Павлу помощь. Его послание к ней, написанное в узах (в Риме, Ефесе или Кесарии — это спорно), обращено и к её епископам и диаконам."
    - "Павел ещё раз прошёл через Филиппы на последнем пути в Иерусалим. Скорее всего, в первой половине II века Поликарп Смирнский написал филиппийцам послание, напоминая, что Павел учил у них и писал им. В IV веке христиане Филипп построили церковь во имя Павла, а около 500 г. н. э. на террасе над форумом поднялась большая базилика."
  uk:
    - "Філіппи лежать на сході Македонії, приблизно за 15 км углиб країни від свого порту Неаполя (нинішня Кавала), на пагорбі над родючою рівниною, багатою на джерела й розташованою поблизу золотих копалень. Близько 360 р. до н. е. поселенці з острова Тасос заснували тут місто Кренід, «Джерела». Пилип II Македонський невдовзі захопив його, розбудував, назвав своїм ім’ям і так успішно розробляв його золоті копальні, що, за словами Діодора, вони приносили йому понад тисячу талантів."
    - "У 42 р. до н. е. на рівнині біля міста відбулися битви, в яких Антоній і Октавіан розбили Брута й Кассія, вбивць Юлія Цезаря; обидва наклали на себе руки. Потім Філіппи стали римською колонією на Егнатієвій дорозі, шляху через Балкани, а після перемоги при Акції Октавіан оселив тут італійців, чию землю він віддав своїм ветеранам. Більшість публічних написів тут було складено латиною."
    - "Павло, Сила та їхні супутники попливли з Троади до Неаполя й дійшли до Філіпп, які Діяння називають: «первий город тієї части Македониї, — осада». У суботу вони вийшли до місця молитви біля річки, де Лідія, торговка пурпуром із Тіатири, увірувала й охрестилася разом зі своїм домом. Коли Павло вигнав дух ворожіння з рабині, її господарі потягли його й Силу до урядників, які звеліли їх побити й ув’язнити. Опівночі землетрус відчинив в’язницю; темничний сторож охрестився, а вранці урядники, почувши, що обидва — римські громадяни, прийшли й просили їх піти. Філіппійська церква не раз надсилала Павлові дари. Його лист до неї, писаний із в’язниці (в Римі, Ефесі чи Кесарії; це спірно), вітає її єпископів і дияконів."
    - "Павло знову проходив через Філіппи в останню подорож до Єрусалима. У першій половині II ст., найімовірніше, Полікарп Смирнський написав філіппійцям, нагадавши, що Павло навчав серед них і писав до них. У IV ст. християни Філіпп збудували церкву, присвячену Павлові, а близько 500 р. н. е. на терасі над форумом постала велика базиліка."
  es:
    - "Filipos está en la Macedonia oriental, a unos 15 km tierra adentro de su puerto Neápolis (la actual Kavala), en una colina sobre una fértil llanura rica en manantiales y cercana a minas de oro. Hacia 360 a. C. colonos de la isla de Tasos fundaron aquí una ciudad llamada Crénides, «las fuentes». Filipo II de Macedonia pronto se apoderó de ella, la amplió, le dio su nombre y explotó tan bien sus minas de oro que, dice Diodoro, le rindieron más de mil talentos."
    - "En 42 a. C. la llanura junto a la ciudad vio las batallas en que Antonio y Octavio derrotaron a Bruto y Casio, los asesinos de Julio César; ambos se quitaron la vida. Filipos se convirtió entonces en colonia romana en la Vía Egnatia, el camino que cruzaba los Balcanes, y tras su victoria en Accio Octavio asentó aquí a italianos cuyas tierras había dado a sus veteranos. La mayoría de sus inscripciones públicas estaban escritas en latín."
    - "Pablo, Silas y sus compañeros zarparon de Troas a Neápolis y llegaron a Filipos, a la que los Hechos llaman «la primera ciudad de la parte de Macedonia, y una colonia». El sábado salieron a un lugar de oración junto a un río, donde Lidia, vendedora de púrpura de Tiatira, creyó y fue bautizada con su familia. Cuando Pablo expulsó un espíritu de adivinación de una esclava, sus amos arrastraron a él y a Silas ante los magistrados, que los hicieron azotar y encarcelar. A medianoche un terremoto abrió la cárcel; el carcelero fue bautizado, y por la mañana los magistrados, al saber que los dos eran ciudadanos romanos, vinieron y les pidieron que se fueran. La iglesia de Filipos envió a Pablo regalos más de una vez. Su carta a ella, escrita desde la cárcel (en Roma, Éfeso o Cesarea; esto se discute), saluda a sus obispos y diáconos."
    - "Pablo pasó de nuevo por Filipos en su último viaje a Jerusalén. En la primera mitad del siglo II, con la mayor probabilidad, Policarpo de Esmirna escribió a los filipenses, recordándoles que Pablo había enseñado entre ellos y les había escrito. En el siglo IV los cristianos de Filipos construyeron una iglesia dedicada a Pablo, y hacia el 500 d. C. se levantó una gran basílica en la terraza sobre el foro."
  pt:
    - "Filipos fica no leste da Macedônia, a cerca de 15 km para o interior de seu porto Neápolis (a atual Cavala), numa colina acima de uma planície fértil, rica em fontes e perto de minas de ouro. Por volta de 360 a.C., colonos da ilha de Tasos fundaram aqui uma cidade chamada Crênides, “as fontes”. Filipe II da Macedônia logo a tomou, ampliou-a, deu-lhe o seu nome e explorou tão bem suas minas de ouro que, diz Diodoro, lhe renderam mais de mil talentos."
    - "Em 42 a.C., a planície ao lado da cidade viu as batalhas em que Antônio e Otaviano derrotaram Bruto e Cássio, os assassinos de Júlio César; ambos se mataram. Filipos tornou-se então colônia romana na Via Egnácia, a estrada que cruzava os Bálcãs, e depois de sua vitória em Áccio Otaviano ali instalou italianos cujas terras havia dado a seus veteranos. A maior parte de suas inscrições públicas foi escrita em latim."
    - "Paulo, Silas e seus companheiros navegaram de Trôade a Neápolis e chegaram a Filipos, que Atos chama de “a cidade principal daquele distrito da Macedônia, e uma colônia romana”. No sábado saíram a um lugar de oração junto a um rio, onde Lídia, vendedora de púrpura de Tiatira, creu e foi batizada com sua casa. Quando Paulo expulsou um espírito de adivinhação de uma escrava, seus senhores arrastaram-no com Silas diante dos magistrados, que os mandaram açoitar e prender. À meia-noite um terremoto abriu a prisão; o carcereiro foi batizado, e de manhã os magistrados, ao saber que os dois eram cidadãos romanos, vieram e lhes pediram que partissem. A igreja de Filipos enviou presentes a Paulo mais de uma vez. Sua carta a ela, escrita da prisão (em Roma, Éfeso ou Cesareia; é discutido), saúda seus bispos e diáconos."
    - "Paulo passou de novo por Filipos em sua última viagem a Jerusalém. Na primeira metade do século II, o mais provável, Policarpo de Esmirna escreveu aos filipenses, lembrando-lhes que Paulo havia ensinado entre eles e lhes escrito. No século IV os cristãos de Filipos construíram uma igreja dedicada a Paulo, e por volta de 500 d.C. uma grande basílica se ergueu no terraço acima do fórum."
  de:
    - "Philippi liegt im östlichen Mazedonien, etwa 15 km landeinwärts von seinem Hafen Neapolis (heute Kavala), auf einem Hügel über einer fruchtbaren, quellenreichen Ebene nahe Goldminen. Um 360 v. Chr. gründeten Siedler von der Insel Thasos hier eine Stadt namens Krenides, „die Quellen“. Philipp II. von Mazedonien nahm sie bald ein, erweiterte sie, benannte sie nach sich und baute ihre Goldminen so gut aus, dass sie ihm nach Diodor mehr als tausend Talente einbrachten."
    - "Im Jahr 42 v. Chr. sah die Ebene neben der Stadt die Schlachten, in denen Antonius und Oktavian Brutus und Cassius, die Mörder Julius Caesars, besiegten; beide nahmen sich das Leben. Philippi wurde dann römische Kolonie an der Via Egnatia, der Straße quer über den Balkan, und nach seinem Sieg bei Actium siedelte Oktavian hier Italiker an, deren Land er an seine Veteranen vergeben hatte. Die meisten öffentlichen Inschriften waren lateinisch."
    - "Paulus, Silas und ihre Gefährten fuhren von Troas nach Neapolis und kamen nach Philippi, das die Apostelgeschichte „die Hauptstadt des Landes Mazedonien und eine Freistadt“ nennt. Am Sabbat gingen sie zu einem Gebetsplatz am Fluss, wo Lydia, eine Purpurhändlerin aus Thyatira, glaubte und mit ihrem Haus getauft wurde. Als Paulus einen Wahrsagegeist aus einer Sklavin austrieb, schleppten ihre Herren ihn und Silas vor die Stadtobersten, die sie schlagen und einkerkern ließen. Um Mitternacht öffnete ein Erdbeben das Gefängnis; der Kerkermeister wurde getauft, und am Morgen kamen die Stadtobersten, als sie hörten, dass die beiden römische Bürger waren, und baten sie wegzugehen. Die Gemeinde in Philippi sandte Paulus mehrmals Gaben. Sein Brief an sie, aus der Haft geschrieben (in Rom, Ephesus oder Caesarea; das ist umstritten), grüßt ihre Bischöfe und Diakone."
    - "Paulus kam auf seiner letzten Reise nach Jerusalem erneut durch Philippi. In der ersten Hälfte des 2. Jahrhunderts, höchstwahrscheinlich, schrieb Polykarp von Smyrna an die Philipper und erinnerte sie, dass Paulus unter ihnen gelehrt und ihnen geschrieben hatte. Im 4. Jahrhundert bauten die Christen Philippis eine dem Paulus geweihte Kirche, und um 500 n. Chr. erhob sich auf der Terrasse über dem Forum eine große Basilika."
  fr:
    - "Philippes se trouve dans l’est de la Macédoine, à environ 15 km à l’intérieur des terres depuis son port Néapolis (l’actuelle Kavala), sur une colline au-dessus d’une plaine fertile, riche en sources et proche de mines d’or. Vers 360 av. J.-C., des colons de l’île de Thasos y fondèrent une ville appelée Crénides, « les sources ». Philippe II de Macédoine la prit bientôt, l’agrandit, lui donna son nom et exploita si bien ses mines d’or que, dit Diodore, elles lui rapportèrent plus de mille talents."
    - "En 42 av. J.-C., la plaine voisine de la ville vit les batailles où Antoine et Octavien vainquirent Brutus et Cassius, les meurtriers de Jules César ; tous deux se donnèrent la mort. Philippes devint alors une colonie romaine sur la voie Egnatia, la route qui traversait les Balkans, et après sa victoire d’Actium, Octavien y installa des Italiens dont il avait donné les terres à ses vétérans. La plupart de ses inscriptions publiques étaient en latin."
    - "Paul, Silas et leurs compagnons firent voile de Troas à Néapolis et vinrent à Philippes, que les Actes appellent « la première ville d’un district de Macédoine, et une colonie ». Le sabbat, ils sortirent vers un lieu de prière près d’une rivière, où Lydie, marchande de pourpre de Thyatire, crut et fut baptisée avec sa famille. Quand Paul chassa un esprit de divination d’une servante, ses maîtres traînèrent Paul et Silas devant les magistrats, qui les firent battre et emprisonner. À minuit un séisme ouvrit la prison ; le geôlier fut baptisé, et au matin les magistrats, apprenant que les deux étaient citoyens romains, vinrent leur demander de partir. L’Église de Philippes envoya plus d’une fois des dons à Paul. Sa lettre, écrite de prison (à Rome, Éphèse ou Césarée ; c’est disputé), salue ses évêques et ses diacres."
    - "Paul repassa par Philippes lors de son dernier voyage à Jérusalem. Dans la première moitié du IIe siècle, très probablement, Polycarpe de Smyrne écrivit aux Philippiens, leur rappelant que Paul avait enseigné parmi eux et leur avait écrit. Au IVe siècle, les chrétiens de Philippes bâtirent une église dédiée à Paul, et vers 500 apr. J.-C. une grande basilique s’éleva sur la terrasse au-dessus du forum."
  it:
    - "Filippi si trova nella Macedonia orientale, circa 15 km nell’entroterra dal suo porto Neapoli (l’odierna Kavala), su una collina sopra una fertile pianura ricca di sorgenti e vicina a miniere d’oro. Verso il 360 a.C. coloni dell’isola di Taso vi fondarono una città chiamata Crenide, «le sorgenti». Filippo II di Macedonia la prese presto, la ampliò, le diede il proprio nome e sfruttò così bene le sue miniere d’oro che, dice Diodoro, gli fruttarono più di mille talenti."
    - "Nel 42 a.C. la pianura accanto alla città vide le battaglie in cui Antonio e Ottaviano sconfissero Bruto e Cassio, gli assassini di Giulio Cesare; entrambi si tolsero la vita. Filippi divenne poi una colonia romana sulla Via Egnatia, la strada che attraversava i Balcani, e dopo la sua vittoria ad Azio Ottaviano vi stabilì Italici le cui terre aveva dato ai suoi veterani. Gran parte delle sue iscrizioni pubbliche era in latino."
    - "Paolo, Sila e i loro compagni salparono da Troade per Neapoli e giunsero a Filippi, che gli Atti dicono «città primaria di quella parte della Macedonia, ed è colonia romana». Di sabato uscirono verso un luogo di preghiera presso un fiume, dove Lidia, venditrice di porpora di Tiatira, credette e fu battezzata con la sua casa. Quando Paolo scacciò uno spirito indovino da una schiava, i suoi padroni trascinarono lui e Sila davanti ai magistrati, che li fecero battere e imprigionare. A mezzanotte un terremoto aprì la prigione; il carceriere fu battezzato, e al mattino i magistrati, sentendo che i due erano cittadini romani, vennero a chiedere loro di andarsene. La chiesa di Filippi mandò doni a Paolo più di una volta. La sua lettera ad essa, scritta dal carcere (a Roma, a Efeso o a Cesarea; la questione è controversa), saluta i suoi vescovi e diaconi."
    - "Paolo passò di nuovo per Filippi nell’ultimo viaggio verso Gerusalemme. Nella prima metà del II secolo, molto probabilmente, Policarpo di Smirne scrisse ai Filippesi, ricordando che Paolo aveva insegnato tra loro e aveva scritto loro. Nel IV secolo i cristiani di Filippi costruirono una chiesa dedicata a Paolo, e verso il 500 d.C. una grande basilica sorse sulla terrazza sopra il foro."
  pl:
    - "Filippi leży we wschodniej Macedonii, około 15 km w głąb lądu od swego portu Neapolis (dzisiejsza Kawala), na wzgórzu nad żyzną równiną bogatą w źródła i położoną w pobliżu kopalń złota. Około 360 roku p.n.e. osadnicy z wyspy Tasos założyli tu miasto zwane Krenidy, „źródła”. Filip II Macedoński wkrótce je zajął, rozbudował, nazwał od swego imienia i tak dobrze eksploatował jego kopalnie złota, że, jak mówi Diodor, przyniosły mu ponad tysiąc talentów."
    - "W 42 roku p.n.e. na równinie obok miasta rozegrały się bitwy, w których Antoniusz i Oktawian pokonali Brutusa i Kasjusza, zabójców Juliusza Cezara; obaj odebrali sobie życie. Filippi stało się następnie rzymską kolonią przy Via Egnatia, drodze przez Bałkany, a po zwycięstwie pod Akcjum Oktawian osiedlił tu Włochów, których ziemię oddał swoim weteranom. Większość jego napisów publicznych sporządzono po łacinie."
    - "Paweł, Sylas i ich towarzysze odpłynęli z Troady do Neapolis i przybyli do Filippi, o którym Dzieje mówią, że to „pierwsze miasto tej części Macedonii nowo osadzone”. W szabat wyszli do miejsca modlitwy nad rzeką, gdzie Lidia, sprzedawczyni purpury z Tiatyry, uwierzyła i została ochrzczona wraz z domem. Gdy Paweł wygnał ducha wieszczego z niewolnicy, jej panowie zawlekli go i Sylasa przed urzędników, którzy kazali ich wychłostać i wtrącić do więzienia. O północy trzęsienie ziemi otworzyło więzienie; stróż został ochrzczony, a rano urzędnicy, usłyszawszy, że obaj są obywatelami rzymskimi, przyszli i poprosili ich o opuszczenie miasta. Kościół w Filippi przysyłał Pawłowi dary więcej niż raz. List Pawła do tej wspólnoty, pisany z więzienia (w Rzymie, Efezie lub Cezarei; jest to sporne), pozdrawia jej biskupów i diakonów."
    - "Paweł przeszedł przez Filippi ponownie w ostatniej podróży do Jerozolimy. W pierwszej połowie II wieku, najprawdopodobniej, Polikarp ze Smyrny napisał do Filipian, przypominając im, że Paweł nauczał wśród nich i pisał do nich. W IV wieku chrześcijanie z Filippi zbudowali kościół pod wezwaniem Pawła, a około 500 roku n.e. na tarasie nad forum wyrosła wielka bazylika."
  cs:
    - "Filipy leží ve východní Makedonii, asi 15 km ve vnitrozemí od svého přístavu Neapolis (dnešní Kavala), na pahorku nad úrodnou rovinou bohatou na prameny a poblíž zlatých dolů. Asi roku 360 př. n. l. tu osadníci z ostrova Thasos založili město zvané Krenidy, „prameny“. Filip II. Makedonský je brzy dobyl, rozšířil, pojmenoval po sobě a zlaté doly využil tak, že mu podle Diodóra vynesly přes tisíc talentů."
    - "Roku 42 př. n. l. se na rovině vedle města odehrály bitvy, v nichž Antonius a Octavianus porazili Bruta a Cassia, vrahy Julia Caesara; oba si vzali život. Filipy se pak staly římskou kolonií na Via Egnatia, silnici napříč Balkánem, a po vítězství u Actia tu Octavianus usadil Italy, jejichž půdu dal svým veteránům. Většina jejich veřejných nápisů byla psána latinsky."
    - "Pavel, Silas a jejich společníci odplouli z Troady do Neapole a přišli do Filip, které Skutky nazývají „první město krajiny Macedonské, obyvateli cizími osazené“. V sobotu vyšli na místo modlitby u řeky, kde Lydie, prodavačka purpuru z Tyatiry, uvěřila a byla pokřtěna se svým domem. Když Pavel vyhnal z otrokyně věšteckého ducha, její páni odvlekli jeho a Silase před úředníky, kteří je dali zbít a uvěznit. O půlnoci zemětřesení otevřelo vězení; žalářník byl pokřtěn a ráno úředníci, když uslyšeli, že jsou oba římští občané, přišli a prosili je, aby odešli. Filipská církev poslala Pavlovi dary víc než jednou. Jeho list jí, psaný z vězení (v Římě, Efezu či Cesareji; to je sporné), zdraví její biskupy a jáhny."
    - "Pavel prošel Filipami znovu na své poslední cestě do Jeruzaléma. V první polovině 2. století, nejspíše, napsal Polykarp ze Smyrny Filipanům a připomněl jim, že Pavel mezi nimi učil a psal jim. Ve 4. století postavili filipští křesťané kostel zasvěcený Pavlovi a asi roku 500 vyrostla na terase nad fórem velká bazilika."
  nl:
    - "Filippi ligt in het oosten van Macedonië, zo’n 15 km landinwaarts van de haven Neapolis (het huidige Kavala), op een heuvel boven een vruchtbare vlakte rijk aan bronnen en in de buurt van goudmijnen. Omstreeks 360 v.Chr. stichtten kolonisten van het eiland Thasos hier een stad genaamd Krenides, “de bronnen”. Filips II van Macedonië nam haar spoedig in, breidde haar uit, noemde haar naar zichzelf en exploiteerde haar goudmijnen zo goed dat ze hem, zegt Diodorus, meer dan duizend talenten opbrachten."
    - "In 42 v.Chr. zag de vlakte naast de stad de veldslagen waarin Antonius en Octavianus Brutus en Cassius, de moordenaars van Julius Caesar, versloegen; beiden pleegden zelfmoord. Filippi werd toen een Romeinse kolonie aan de Via Egnatia, de weg over de Balkan, en na zijn overwinning bij Actium vestigde Octavianus hier Italianen wier land hij aan zijn veteranen had gegeven. De meeste openbare opschriften waren in het Latijn gesteld."
    - "Paulus, Silas en hun metgezellen voeren van Troas naar Neapolis en kwamen te Filippi, dat Handelingen noemt “de eerste stad van dit deel van Macedonië, een kolonie”. Op de sabbat gingen zij naar een gebedsplaats bij een rivier, waar Lydia, een purperverkoopster uit Thyatira, geloofde en met haar huis werd gedoopt. Toen Paulus een waarzeggende geest uit een slavin dreef, sleepten haar meesters hem en Silas voor de overheid, die hen liet slaan en gevangenzetten. Om middernacht opende een aardbeving de gevangenis; de cipier werd gedoopt, en de volgende morgen kwamen de overheden, hoorden dat beiden Romeins burger waren, en vroegen hen te vertrekken. De gemeente van Filippi zond Paulus meermaals giften. Zijn brief aan haar, uit de gevangenis geschreven (in Rome, Efeze of Caesarea; dat is omstreden), groet haar bisschoppen en diakenen."
    - "Paulus kwam opnieuw door Filippi op zijn laatste reis naar Jeruzalem. In de eerste helft van de 2e eeuw, waarschijnlijk, schreef Polycarpus van Smyrna aan de Filippenzen en herinnerde hen eraan dat Paulus onder hen had geleerd en hun had geschreven. In de 4e eeuw bouwden de christenen van Filippi een aan Paulus gewijde kerk, en omstreeks 500 n.Chr. rees een grote basiliek op het terras boven het forum."
  sv:
    - "Filippi ligger i östra Makedonien, cirka 15 km inåt land från sin hamn Neapolis (nuvarande Kavala), på en kulle ovanför en bördig slätt rik på källor och nära guldgruvor. Omkring 360 f.Kr. grundade nybyggare från ön Thasos en stad här som kallades Krenides, ”källorna”. Filip II av Makedonien tog den snart, utvidgade den, uppkallade den efter sig själv och brukade dess guldgruvor så väl att de, säger Diodoros, gav honom mer än tusen talenter."
    - "År 42 f.Kr. såg slätten bredvid staden striderna där Antonius och Octavianus besegrade Brutus och Cassius, Julius Caesars mördare; båda tog sina egna liv. Filippi blev sedan en romersk koloni vid Via Egnatia, vägen över Balkan, och efter sin seger vid Actium bosatte Octavianus här italienare vars mark han hade gett åt sina veteraner. De flesta av dess offentliga inskriptioner var skrivna på latin."
    - "Paulus, Silas och deras följeslagare seglade från Troas till Neapolis och kom till Filippi: ”Denna stad, en romersk koloni, är den första i denna del av Macedonien.” På sabbaten gick de ut till en bönplats vid en flod, där Lydia, en purpurförsäljare från Tyatira, kom till tro och döptes med sitt husfolk. När Paulus drev en spådomsande ur en slavflicka släpade hennes herrar honom och Silas inför domarna, som lät piska och fängsla dem. Vid midnatt öppnade en jordbävning fängelset; fångvaktaren döptes, och på morgonen kom domarna, som hört att de båda var romerska medborgare, och bad dem lämna staden. Församlingen sände Paulus gåvor mer än en gång. Hans brev till den, skrivet i fångenskap (i Rom, Efesos eller Caesarea; detta är omstritt), hälsar dess biskopar och diakoner."
    - "Paulus passerade Filippi igen på sin sista resa till Jerusalem. Under första hälften av 100-talet, mest sannolikt, skrev Polykarpos av Smyrna till filipperna och påminde dem om att Paulus hade undervisat bland dem och skrivit till dem. På 300-talet byggde de kristna i Filippi en kyrka helgad åt Paulus, och omkring år 500 reste sig en stor basilika på terrassen ovanför forum."
  nb:
    - "Filippi ligger i østlige Makedonia, omtrent 15 km inne i landet fra havnen Neapolis (dagens Kavala), på en høyde over en fruktbar slette rik på kilder og nær gullgruver. Omkring 360 f.Kr. grunnla nybyggere fra øya Thasos en by her kalt Krenides, «kildene». Filip II av Makedonia tok den snart, utvidet den, oppkalte den etter seg selv og drev gullgruvene så godt at de, sier Diodoros, ga ham mer enn tusen talenter."
    - "I 42 f.Kr. så sletten ved byen slagene der Antonius og Oktavian beseiret Brutus og Cassius, Julius Cæsars mordere; begge tok sitt eget liv. Filippi ble så en romersk koloni ved Via Egnatia, veien over Balkan, og etter seieren ved Aktium bosatte Oktavian her italienere hvis land han hadde gitt til veteranene sine. De fleste av byens offentlige inskripsjoner ble skrevet på latin."
    - "Paulus, Silas og deres følge seilte fra Troas til Neapolis og kom til Filippi, som Apostlenes gjerninger kaller «den første by i den del av Makedonia og en romersk koloni». På sabbaten gikk de ut til et bønnested ved en elv, der Lydia, en purpurselger fra Tyatira, kom til tro og ble døpt med sitt hus. Da Paulus drev en spådomsånd ut av en trælkvinne, slepte hennes herrer ham og Silas fram for styresmennene, som lot dem piske og kaste i fengsel. Ved midnatt åpnet et jordskjelv fengselet; fangevokteren ble døpt, og om morgenen kom styresmennene, som hadde hørt at de to var romerske borgere, og ba dem dra. Menigheten i Filippi sendte Paulus gaver flere ganger. Hans brev til den, skrevet i fengsel (i Roma, Efesos eller Cæsarea; dette er omstridt), hilser dens biskoper og diakoner."
    - "Paulus kom gjennom Filippi igjen på sin siste reise til Jerusalem. Mest sannsynlig i første halvdel av 100-tallet skrev Polykarp av Smyrna til filipperne og minnet dem om at Paulus hadde undervist blant dem og skrevet til dem. På 300-tallet bygde de kristne i Filippi en kirke viet til Paulus, og omkring 500 e.Kr. reiste en stor basilika seg på terrassen over forumet."
  tl:
    - "Ang Filipos ay nasa silangang Macedonia, mga 15 km sa loob ng lupain mula sa daungan nito, ang Neapolis (makabagong Kavala), sa burol sa itaas ng matabang kapatagang sagana sa mga bukal at malapit sa mga minahan ng ginto. Bandang 360 BK, itinatag dito ng mga naninirahan mula sa pulo ng Thasos ang bayang tinawag na Crenides, “ang mga bukal”. Hindi nagtagal ay kinuha ito ni Felipe II ng Macedonia, pinalaki, pinangalanan sa kaniyang sarili at pinaghukayan ng ginto nang napakahusay na, ayon kay Diodoro, nagdala ito sa kaniya ng higit sa isang libong talento."
    - "Noong 42 BK, nasaksihan ng kapatagan sa tabi ng lungsod ang mga labanan kung saan tinalo nina Antonio at Octavian sina Brutus at Cassius, ang mga pumatay kay Julio Cesar; kapwa nila kinitil ang sarili nilang buhay. Ang Filipos ay naging koloniyang Romano sa Via Egnatia, ang daang tumatawid sa Balkan, at pagkatapos ng kaniyang tagumpay sa Actium ay pinatira rito ni Octavian ang mga Italyano na ang lupa ay ibinigay niya sa kaniyang mga beterano. Karamihan sa mga pampublikong inskripsiyon nito ay nakasulat sa Latin."
    - "Naglayag sina Pablo, Silas at kasama mula Troas patungong Neapolis at dumating sa Filipos, na tinawag ng Mga Gawa na “isang bayan ng Macedonia, na siyang una sa purok, lupang nasasakupan ng Roma”. Sa sabbath, pumunta sila sa dalanginan sa tabing-ilog, kung saan sumampalataya at nabautismuhan, kasama ang sambahayan, si Lidia, nagtitinda ng purpura mula Tiatira. Nang palayasin ni Pablo ang espiritu ng panghuhula sa aliping babae, kinaladkad ng kaniyang mga amo ang dalawa sa mga mahistrado, na nagpabugbog at nagpakulong sa kanila. Hatinggabi, binuksan ng lindol ang bilangguan; nabautismuhan ang bantay; kinaumagahan, nang malamang mamamayang Romano ang dalawa, hiniling ng mga mahistrado na umalis sila. Ilang ulit nagpadala ng kaloob kay Pablo ang iglesia roon; bumabati sa mga obispo at diakono nito ang liham niyang isinulat mula sa bilangguan (Roma, Efeso o Cesarea; di tiyak)."
    - "Dumaan muli si Pablo sa Filipos sa kaniyang huling paglalakbay patungong Jerusalem. Sa unang kalahati ng ika-2 siglo, pinakamalamang, sumulat si Policarpo ng Smirna sa mga taga-Filipos, na ipinaaalala sa kanila na nagturo si Pablo sa kanila at sumulat sa kanila. Noong ika-4 na siglo, nagtayo ang mga Kristiyano ng Filipos ng simbahang nakatalaga kay Pablo, at bandang AD 500 ay umangat ang isang malaking basilika sa terasa sa itaas ng forum."
  da:
    - "Filippi ligger i det østlige Makedonien, omkring 15 km inde i landet fra sin havn Neapolis (nutidens Kavala), på en bakke over en frugtbar slette rig på kilder og nær guldminer. Omkring 360 f.Kr. grundlagde bosættere fra øen Thasos en by her kaldet Krenides, »kilderne«. Filip 2. af Makedonien tog den snart, udvidede den, opkaldte den efter sig selv og drev dens guldminer så godt, at de ifølge Diodor indbragte ham mere end tusind talenter."
    - "I 42 f.Kr. så sletten ved byen slagene, hvor Antonius og Oktavian besejrede Brutus og Cassius, Julius Cæsars mordere; begge tog deres eget liv. Filippi blev derpå en romersk koloni ved Via Egnatia, vejen tværs over Balkan, og efter sin sejr ved Actium bosatte Oktavian her italienere, hvis jord han havde givet til sine veteraner. De fleste af byens offentlige indskrifter var skrevet på latin."
    - "Paulus, Silas og deres ledsagere sejlede fra Troas til Neapolis og kom til Filippi, som Apostlenes Gerninger kalder »den første By i den Del af Makedonien, en Koloni«. På sabbaten gik de ud til et bedested ved en flod, hvor Lydia, en purpurhandlerske fra Thyatira, kom til tro og blev døbt med sit hus. Da Paulus drev en spådomsånd ud af en slavepige, slæbte hendes herrer ham og Silas hen for høvedsmændene, som lod dem piske og fængsle. Ved midnat åbnede et jordskælv fængslet; fangevogteren blev døbt, og om morgenen kom høvedsmændene, da de hørte, at de to var romerske borgere, og bad dem forlade byen. Menigheden i Filippi sendte Paulus gaver mere end én gang. Hans brev til den, skrevet fra fængsel (i Rom, Efesos eller Cæsarea; det er omstridt), hilser dens biskopper og diakoner."
    - "Paulus kom igen gennem Filippi på sin sidste rejse til Jerusalem. I første halvdel af 100-tallet, højst sandsynligt, skrev Polykarp af Smyrna til filipperne og mindede dem om, at Paulus havde undervist blandt dem og skrevet til dem. I 300-tallet byggede Filippis kristne en kirke indviet til Paulus, og omkring 500 e.Kr. rejste en stor basilika sig på terrassen over forum."
  sr:
    - "Филипи леже у источној Македонији, око 15 км у унутрашњости од своје луке Неапоља (савремене Кавале), на брду изнад плодне равнице богате изворима и близу златних рудника. Око 360. п. н. е. досељеници с острва Тасоса основали су овде град назван Крениде, „извори“. Филип II Македонски убрзо га је узео, увећао, назвао по себи и тако добро користио његове златне руднике да су му, каже Диодор, донели више од хиљаду таланата."
    - "Године 42. п. н. е. равница поред града видела је битке у којима су Антоније и Октавијан победили Брута и Касија, убице Јулија Цезара; обојица су себи одузели живот. Филипи су потом постали римска колонија на Егнатијевом путу, путу преко Балкана, а Октавијан је после победе код Акцијума ту населио Италике чију је земљу дао својим ветеранима. Већина јавних натписа писана је на латинском."
    - "Павле, Сила и њихови сапутници пловили су из Троаде у Неапољ и дошли у Филипе, које Дела зову „први град земље Македоније, насеље римско“. У суботу су изашли на место молитве поред реке, где је Лидија, продавачица пурпура из Тијатире, поверовала и крштена с домом својим. Кад је Павле истерао дух прорицања из робиње, њени господари довукли су њега и Силу пред градске власти, које су их дале избити и бацити у тамницу. У поноћ је земљотрес отворио тамницу; тамничар је крштен, а ујутро су власти, чувши да су двојица римски грађани, дошле и замолиле их да оду. Црква у Филипима више пута је слала Павлу дарове. Његова посланица њој, писана из тамнице (у Риму, Ефесу или Цезареји; то је спорно), поздравља њене епископе и ђаконе."
    - "Павле је поново прошао кроз Филипе на свом последњем путу у Јерусалим. У првој половини 2. века, највероватније, Поликарп Смирнски писао је Филипљанима подсећајући их да је Павле међу њима поучавао и њима писао. У 4. веку хришћани Филипа подигли су цркву посвећену Павлу, а око 500. н. е. велика базилика уздигла се на тераси изнад форума."
  hu:
    - "Filippi Kelet-Macedóniában fekszik, kikötőjétől, Neapolisztól (a mai Kavala) mintegy 15 km-re a szárazföld belsejében, egy forrásokban gazdag, aranybányák közelében lévő termékeny síkság fölötti dombon. Kr. e. 360 körül Thászosz szigetéről érkezett telepesek várost alapítottak itt Krenidész néven, „a források”. II. Fülöp, Macedónia királya hamarosan elfoglalta, kibővítette, magáról nevezte el, és aranybányáit olyan jól művelte, hogy Diodórosz szerint több mint ezer talentumot hoztak neki."
    - "Kr. e. 42-ben a város melletti síkságon vívták azokat a csatákat, amelyekben Antonius és Octavianus legyőzte Brutust és Cassiust, Iulius Caesar gyilkosait; mindketten öngyilkosok lettek. Filippi ezután római gyarmat lett a Via Egnatián, a Balkánt átszelő úton, és Octavianus az actiumi győzelme után itt telepítette le azokat az itáliaiakat, akiknek földjét veteránjainak adta. Nyilvános feliratainak többsége latinul íródott."
    - "Pál, Szilász és társaik Troászból Neapoliszba hajóztak, és Filippibe jutottak, amelyet az ApCsel így ír le: „mely Macedónia azon részének első gyarmatvárosa”. Szombaton kimentek egy imahelyre egy folyóhoz, ahol Lydia, egy thiatirai bíborárus hitt, és házanépével együtt megkeresztelkedett. Amikor Pál kiűzött egy jövendőmondó szellemet egy rabszolgalányból, urai Pált és Szilászt a hatóság elé hurcolták, amely megvesszőztette és bebörtönöztette őket. Éjfélkor földrengés nyitotta ki a börtönt; a börtönőr megkeresztelkedett, reggel pedig a hatóság, amikor meghallotta, hogy a két férfi római polgár, odajött és megkérte őket, hogy távozzanak. A filippi egyház többször küldött Pálnak ajándékot. Levele hozzá, amelyet börtönből írt (Rómából, Efezusból vagy Cézáreából; ez vitatott), köszönti püspökeit és diakónusait."
    - "Pál utolsó jeruzsálemi útján ismét átment Filippin. A 2. század első felében, legvalószínűbben, a szmürnai Polükarposz levelet írt a filippieknek, emlékeztetve őket, hogy Pál tanított közöttük és írt nekik. A 4. században a filippi keresztények Pálnak szentelt templomot építettek, és Kr. u. 500 körül nagy bazilika emelkedett a fórum feletti teraszon."
  fi:
    - "Filippi sijaitsee Itä-Makedoniassa, noin 15 km sisämaassa satamastaan Neapoliksesta (nykyinen Kavala), kukkulalla hedelmällisen, lähteiden rikkaan tasangon yläpuolella kultakaivosten lähellä. Noin 360 eaa. Thasoksen saaren uudisasukkaat perustivat tänne kaupungin nimeltä Krenides, ”lähteet”. Makedonian Filippos II valtasi sen pian, laajensi sitä, nimesi sen itsensä mukaan ja hyödynsi sen kultakaivoksia niin hyvin, että ne Diodoroksen mukaan toivat hänelle yli tuhat talenttia."
    - "Vuonna 42 eaa. kaupungin vieressä olevalla tasangolla käytiin taistelut, joissa Antonius ja Octavianus voittivat Julius Caesarin murhaajat Brutuksen ja Cassiuksen; molemmat riistivät henkensä. Filippistä tuli sitten roomalainen siirtokunta Via Egnatian, Balkanin halki kulkevan tien, varrella, ja Aktionin voitostaan Octavianus asutti sinne italialaisia, joiden maan hän oli antanut veteraaneilleen. Suurin osa sen julkisista kirjoituksista oli latinaksi."
    - "Paavali, Silas ja heidän seuralaisensa purjehtivat Troasista Neapolikseen ja tulivat Filippiin, joka Apostolien tekojen mukaan oli ”ensimmäinen kaupunki siinä osassa Makedoniaa, siirtokunta”. Sapattina he menivät rukouspaikalle joen rannalle, missä Lyydia, tyatiralainen purppuranmyyjä, uskoi ja kastettiin perheineen. Kun Paavali ajoi ennustajahengen orjatytöstä, isännät raahasivat hänet ja Silaan hallitusmiesten eteen, jotka pieksättivät heidät ja vangitsivat. Keskiyöllä maanjäristys avasi vankilan; vanginvartija kastettiin, ja aamulla hallitusmiehet, kuultuaan kaksikon olevan Rooman kansalaisia, tulivat ja pyysivät heitä lähtemään. Filippin seurakunta lähetti Paavalille lahjoja useammin kuin kerran. Hänen sille vankilasta kirjoittamansa kirje (Roomasta, Efesoksesta tai Kesareasta; asia on kiistanalainen) tervehtii sen kaitsijoita ja seurakuntapalvelijoita."
    - "Paavali kulki Filippin kautta uudelleen viimeisellä matkallaan Jerusalemiin. Todennäköisimmin 100-luvun ensimmäisellä puoliskolla Smyrnan Polykarpos kirjoitti filippiläisille muistuttaen heitä siitä, että Paavali oli opettanut heidän parissaan ja kirjoittanut heille. 300-luvulla Filippin kristityt rakensivat Paavalille omistetun kirkon, ja noin vuonna 500 foorumin yläpuoliselle terassille nousi suuri basilika."
  vi:
    - "Phi-líp nằm ở đông Ma-xê-đoan, cách cảng Nê-a-bô-li (nay là Kavala) khoảng 15 km trong đất liền, trên một ngọn đồi phía trên đồng bằng phì nhiêu nhiều suối và gần các mỏ vàng. Khoảng năm 360 TCN, những người định cư từ đảo Thasos lập ở đây một thị trấn gọi là Crenides, “những con suối”. Philip II của Ma-xê-đoan sớm chiếm nó, mở rộng, đặt tên theo mình và khai thác mỏ vàng giỏi đến mức, Diodorus nói, chúng mang lại cho ông hơn một nghìn ta lâng."
    - "Năm 42 TCN, đồng bằng bên cạnh thành chứng kiến các trận đánh trong đó Antony và Octavian đánh bại Brutus và Cassius, những kẻ giết Julius Caesar; cả hai đều tự sát. Phi-líp sau đó trở thành thuộc địa La Mã trên Via Egnatia, con đường băng qua vùng Balkan, và sau chiến thắng ở Actium, Octavian định cư ở đây những người Ý mà ông đã lấy đất để cấp cho cựu binh. Phần lớn bia ký công cộng của thành viết bằng tiếng Latin."
    - "Phao-lô, Si-la và các bạn đồng hành đi thuyền từ Trô-ách đến Nê-a-bô-li rồi đến Phi-líp, mà sách Công Vụ gọi là “thành thứ nhất của tỉnh Ma-xê-đoan, và là thuộc địa nước Rô-ma”. Ngày Sa-bát họ ra một nơi cầu nguyện bên sông, nơi Ly-đi, một người buôn hàng sắc tía từ Thi-a-ti-rơ, tin và chịu phép báp-tem cùng cả nhà. Khi Phao-lô đuổi một quỷ bói khoa khỏi một đứa đầy tớ gái, các chủ nó kéo ông và Si-la đến trước các quan, những người cho đánh đòn và bỏ tù hai ông. Lúc nửa đêm một cơn động đất mở cửa ngục; người đề lao chịu phép báp-tem, và sáng hôm sau các quan, nghe rằng hai ông là công dân Rô-ma, đến xin hai ông rời đi. Hội thánh Phi-líp nhiều lần gửi quà cho Phao-lô. Thư của ông gửi cho họ, viết trong tù (ở Rô-ma, Ê-phê-sô hay Sê-sa-rê; điều này còn tranh luận), chào các giám mục và chấp sự của họ."
    - "Phao-lô đi qua Phi-líp lần nữa trong chuyến đi cuối cùng đến Giê-ru-sa-lem. Trong nửa đầu thế kỷ 2, nhiều khả năng nhất, Polycarp ở Si-miệc-nơ viết cho người Phi-líp, nhắc họ rằng Phao-lô đã dạy giữa họ và viết cho họ. Vào thế kỷ 4, các Cơ Đốc nhân ở Phi-líp xây một nhà thờ dâng cho Phao-lô, và khoảng năm 500 một đại thánh đường mọc lên trên bậc thềm phía trên quảng trường."
  ro:
    - "Filipi se află în Macedonia de est, la circa 15 km în interior față de portul său Neapolis (actualul Kavala), pe un deal deasupra unei câmpii fertile, bogate în izvoare și aflate lângă mine de aur. În jurul anului 360 î.Hr., coloniști din insula Thasos au întemeiat aici o așezare numită Crenides, „izvoarele”. Filip al II-lea al Macedoniei a luat-o curând, a mărit-o, a numit-o după sine și i-a exploatat atât de bine minele de aur încât, spune Diodor, i-au adus mai mult de o mie de talanți."
    - "În 42 î.Hr., câmpia de lângă oraș a văzut bătăliile în care Antoniu și Octavian i-au învins pe Brutus și Cassius, ucigașii lui Iuliu Cezar; amândoi și-au luat viața. Filipi a devenit apoi colonie romană pe Via Egnatia, drumul care străbătea Balcanii, iar după victoria de la Actium, Octavian a așezat aici italici ale căror pământuri le dăduse veteranilor săi. Cele mai multe dintre inscripțiile ei publice erau scrise în latină."
    - "Pavel, Sila și însoțitorii lor au navigat de la Troa la Neapolis și au ajuns la Filipi, pe care Faptele îl numesc „cetatea cea dintâi a părței acesteia a Machedoniei, colonie”. În sabat au ieșit la un loc de rugăciune de lângă un râu, unde Lidia, o vânzătoare de purpură din Tiatira, a crezut și a fost botezată cu casa ei. Când Pavel a scos un duh de ghicire dintr-o roabă, stăpânii ei l-au târât pe el și pe Sila în fața magistraților, care i-au bătut și i-au întemnițat. La miezul nopții un cutremur a deschis temnița; temnicerul a fost botezat, iar dimineața magistrații, auzind că cei doi sunt cetățeni romani, au venit și i-au rugat să plece. Biserica din Filipi i-a trimis lui Pavel daruri de mai multe ori. Epistola lui către ea, scrisă din închisoare (la Roma, Efes sau Cezareea; este disputat), îi salută pe episcopii și pe diaconii ei."
    - "Pavel a trecut din nou prin Filipi în ultima sa călătorie spre Ierusalim. În prima jumătate a secolului al II-lea, cel mai probabil, Policarp al Smirnei a scris filipenilor, amintindu-le că Pavel a învățat printre ei și le-a scris. În secolul al IV-lea, creștinii din Filipi au construit o biserică închinată lui Pavel, iar în jurul anului 500 d.Hr. s-a ridicat o mare bazilică pe terasa de deasupra forului."
  bg:
    - "Филипи се намира в Източна Македония, на около 15 км навътре от пристанището си Неапол (днешна Кавала), на хълм над плодородна равнина, богата на извори, близо до златни мини. Около 360 г. пр.н.е. заселници от остров Тасос основали тук град, наречен Кренидес, „изворите“. Скоро Филип II Македонски го превзел, разширил го, нарекъл го на себе си и експлоатирал златните му мини толкова успешно, че според Диодор те му донасяли над хиляда таланта."
    - "През 42 г. пр.н.е. в равнината до града се водили битките, в които Антоний и Октавиан разбили Брут и Касий, убийците на Юлий Цезар; и двамата сложили край на живота си. После Филипи станал римска колония на Виа Егнация, пътя през Балканите, а след победата си при Акциум Октавиан заселил тук италийци, чиято земя бил дал на ветераните си. Повечето от обществените му надписи са на латински."
    - "Павел, Сила и спътниците им отплавали от Троада до Неапол и дошли във Филипи, който Деяния нарича „първий град на онази част от Македония, и поселение Римско“. В съботата излезли до място за молитва край една река, където Лидия, продавачка на пурпур от Тиатира, повярвала и се кръстила с дома си. Когато Павел изгонил дух на гадаене от една робиня, господарите ѝ завлекли него и Сила пред началниците, които ги наказали с бой и ги хвърлили в тъмница. В полунощ земетресение отворило тъмницата; тъмничарят се кръстил, а сутринта началниците, научили, че двамата са римски граждани, дошли и ги помолили да напуснат. Църквата във Филипи неведнъж изпращала дарове на Павел. Писмото му до нея, писано от затвора (в Рим, Ефес или Кесария — спорно), поздравява епископите и дяконите ѝ."
    - "Павел отново минал през Филипи при последното си пътуване към Йерусалим. Най-вероятно през първата половина на II в. Поликарп Смирненски писал на филипяните, като им напомнял, че Павел ги е поучавал и им е писал. През IV в. християните във Филипи построили църква, посветена на Павел, а около 500 г. н.е. на терасата над форума се издигнала голяма базилика."
