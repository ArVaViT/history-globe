# Overview article (ADR 0007). Mainstream facts only; the identification of Hittite Parha with Perga is named as the usual view.
id: perga
place: aff04b8
title:
  en: "Perga"
  ru: "Пергия"
  uk: "Перге"
  es: "Perge"
  pt: "Perge"
  de: "Perge"
