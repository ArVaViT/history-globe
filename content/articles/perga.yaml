body:
  en:
    - "Perga lay in Pamphylia, on the coastal plain of southern Asia Minor some 15 km north-east of modern Antalya, near the river Cestrus, now the Aksu; Strabo says one sailed sixty stadia up the river to reach it. Its acropolis was already inhabited in prehistoric times, and a Hittite treaty of the thirteenth century BC names a town Parha on the western border of Tarhuntassa, usually identified with Perga. Herodotus, as Strabo reports, made the Pamphylians descendants of the mixed peoples who came from Troy with Amphilochus and Calchas."
    - "Alexander the Great marched through Perga in the winter of 334–333 BC, sending part of his army there by a mountain road. On a height near the city stood the temple of Artemis of Perga, where a festival was held every year, and the goddess and her temple appeared on the city's coins. The mathematician Apollonius, who wrote on conic sections in the third century BC, was born here."
    - "Paul and his company sailed from Paphos to Perga in Pamphylia, and there John Mark left them and returned to Jerusalem, a departure that later parted Paul and Barnabas. From Perga they went inland to Antioch in Pisidia. On the way back they preached the word in Perga, went down to the port of Attalia and sailed from there to Antioch in Syria."
    - "Under the Roman empire Perga grew rich. In the early second century the priestess Plancia Magna, daughter of a Roman governor, rebuilt the Hellenistic south gate as a grand courtyard with statues of the city's founders and of the imperial family. The city had a theatre, a stadium, baths and a colonnaded main street with a water channel running down its middle. In late antiquity it was a bishop's see with large churches. Excavations by Istanbul University since 1946 have uncovered much of the city."
  ru:
    - "Пергия лежала в Памфилии, на прибрежной равнине южной Малой Азии, примерно в 15 км к северо-востоку от нынешней Антальи, у реки Кестр, ныне Аксу; Страбон пишет, что до неё плыли вверх по реке шестьдесят стадий. Её акрополь был заселён ещё в доисторические времена, а хеттский договор XIII века до н. э. называет город Парха на западной границе Тархунтассы, который обычно отождествляют с Пергией. Геродот, как сообщает Страбон, считал памфилийцев потомками смешанных народов, пришедших из-под Трои с Амфилохом и Калхасом."
    - "Александр Македонский прошёл через Пергию зимой 334–333 гг. до н. э., направив туда часть войска горной дорогой. На возвышенности у города стоял храм Артемиды Пергейской, где каждый год справляли праздник, а богиню и её храм изображали на монетах города. Здесь родился математик Аполлоний, писавший в III веке до н. э. о конических сечениях."
    - "Павел и бывшие при нём отплыли из Пафа и прибыли в Пергию, в Памфилии; там Иоанн Марк отделился от них и возвратился в Иерусалим, и этот уход позже разлучил Павла и Варнаву. Из Пергии они пошли в глубь страны, в Антиохию Писидийскую. На обратном пути они проповедали слово в Пергии, сошли в гавань Атталию и оттуда отплыли в Антиохию Сирийскую."
    - "В Римской империи Пергия разбогатела. В начале II века жрица Планкия Магна, дочь римского наместника, перестроила эллинистические южные ворота в пышный двор со статуями основателей города и членов императорского дома. В городе были театр, стадион, бани и главная улица с колоннадами, посреди которой бежал водный канал. В поздней античности Пергия была епископской кафедрой с большими церквями. Раскопки Стамбульского университета, ведущиеся с 1946 г., открыли значительную часть города."
  uk:
    - "Перге лежало в Памфілії, на прибережній рівнині півдня Малої Азії приблизно за 15 км на північний схід від сучасної Анталії, біля річки Кестр, нині Аксу; Страбон каже, що до нього пливли шістдесят стадіїв угору рікою. Його акрополь був заселений ще в доісторичні часи, а хетський договір XIII ст. до н. е. називає місто Парха на західному кордоні Тархунтасси, яке зазвичай ототожнюють із Перге. Геродот, як повідомляє Страбон, вважав памфілійців нащадками змішаних народів, що прийшли з Трої разом з Амфілохом і Калхантом."
    - "Александр Великий пройшов через Перге взимку 334–333 рр. до н. е., послав туди частину війська гірською дорогою. На висоті поблизу міста стояв храм Артеміди Пергейської, де щороку відбувалося свято, а богиня та її храм зображені на монетах міста. Тут народився математик Аполлоній, який у III ст. до н. е. писав про конічні перерізи."
    - "Павло та його супутники відпливли з Пафоса до Перге в Памфілії, і там Іван Марк залишив їх і повернувся до Єрусалима — відхід, що згодом розвів Павла й Варнаву. З Перге вони пішли вглиб країни до Антіохії Пісідійської. На зворотному шляху вони проповідували слово в Перге, спустилися до порту Атталії й відпливли звідти до Антіохії Сирійської."
    - "За Римської імперії Перге розбагатіло. На початку II ст. жриця Планція Магна, донька римського намісника, перебудувала елліністичну південну браму на розкішний двір зі статуями засновників міста й імператорської родини. У місті були театр, стадіон, лазні та колонадна головна вулиця з водяним каналом посередині. У пізню античність це була єпископська кафедра з великими церквами. Розкопки Стамбульського університету з 1946 року відкрили значну частину міста."
  es:
    - "Perge estaba en Panfilia, en la llanura costera del sur de Asia Menor, a unos 15 km al noreste de la actual Antalya, cerca del río Cestro, hoy el Aksu; Estrabón dice que se remontaba el río sesenta estadios para llegar a ella. Su acrópolis estaba ya habitada en tiempos prehistóricos, y un tratado hitita del siglo XIII a. C. nombra una ciudad Parha en la frontera occidental de Tarhuntasa, que suele identificarse con Perge. Heródoto, según refiere Estrabón, hacía a los panfilios descendientes de los pueblos mezclados que vinieron de Troya con Anfíloco y Calcante."
    - "Alejandro Magno atravesó Perge en el invierno de 334–333 a. C., enviando allí parte de su ejército por un camino de montaña. En una altura cercana a la ciudad se alzaba el templo de Artemisa de Perge, donde cada año se celebraba una fiesta, y la diosa y su templo aparecían en las monedas de la ciudad. El matemático Apolonio, que escribió sobre las secciones cónicas en el siglo III a. C., nació aquí."
    - "Pablo y su comitiva zarparon de Pafos a Perge de Panfilia, y allí Juan Marcos los dejó y volvió a Jerusalén, una partida que más tarde separó a Pablo y Bernabé. Desde Perge fueron tierra adentro a Antioquía de Pisidia. A la vuelta predicaron la palabra en Perge, bajaron al puerto de Atalia y zarparon desde allí a Antioquía de Siria."
    - "Bajo el Imperio romano Perge se enriqueció. A principios del siglo II la sacerdotisa Plancia Magna, hija de un gobernador romano, reconstruyó la puerta sur helenística como un gran patio con estatuas de los fundadores de la ciudad y de la familia imperial. La ciudad tenía un teatro, un estadio, baños y una calle principal con columnata y un canal de agua que corría por su centro. En la Antigüedad tardía fue sede episcopal con grandes iglesias. Las excavaciones de la Universidad de Estambul desde 1946 han sacado a la luz gran parte de la ciudad."
  pt:
    - "Perge ficava na Panfília, na planície costeira do sul da Ásia Menor, a cerca de 15 km a nordeste da atual Antália, perto do rio Cestro, hoje Aksu; Estrabão diz que se subia o rio por sessenta estádios para chegar a ela. Sua acrópole já era habitada em tempos pré-históricos, e um tratado hitita do século XIII a.C. cita uma cidade Parha na fronteira ocidental de Tarhuntassa, geralmente identificada com Perge. Heródoto, segundo relata Estrabão, fazia dos panfílios descendentes dos povos mistos que vieram de Troia com Anfíloco e Calcas."
    - "Alexandre, o Grande, passou por Perge no inverno de 334–333 a.C., enviando para lá parte de seu exército por uma estrada de montanha. Numa altura perto da cidade ficava o templo de Ártemis de Perge, onde se realizava uma festa anual, e a deusa e seu templo apareciam nas moedas da cidade. O matemático Apolônio, que escreveu sobre as seções cônicas no século III a.C., nasceu aqui."
    - "Paulo e seus companheiros navegaram de Pafos a Perge, na Panfília, e ali João Marcos os deixou e voltou para Jerusalém, uma partida que mais tarde separou Paulo e Barnabé. De Perge foram para o interior, a Antioquia da Pisídia. Na volta pregaram a palavra em Perge, desceram ao porto de Atália e dali navegaram para Antioquia da Síria."
    - "Sob o império romano Perge enriqueceu. No início do século II, a sacerdotisa Plancia Magna, filha de um governador romano, reconstruiu a porta sul helenística como um grandioso pátio com estátuas dos fundadores da cidade e da família imperial. A cidade tinha teatro, estádio, banhos e uma rua principal de colunas com um canal de água correndo no meio. Na Antiguidade tardia foi sede de bispo, com grandes igrejas. As escavações da Universidade de Istambul, desde 1946, trouxeram à luz grande parte da cidade."
  de:
    - "Perge lag in Pamphylien, auf der Küstenebene Südkleinasiens etwa 15 km nordöstlich des heutigen Antalya, nahe dem Fluss Kestros, dem heutigen Aksu; Strabon sagt, man sei sechzig Stadien flussaufwärts gefahren, um die Stadt zu erreichen. Seine Akropolis war schon in vorgeschichtlicher Zeit bewohnt, und ein hethitischer Vertrag des 13. Jahrhunderts v. Chr. nennt eine Stadt Parha an der Westgrenze von Tarhuntascha, die meist mit Perge gleichgesetzt wird. Herodot machte, wie Strabon berichtet, die Pamphylier zu Nachkommen der gemischten Völker, die mit Amphilochos und Kalchas aus Troja gekommen waren."
    - "Alexander der Große zog im Winter 334–333 v. Chr. durch Perge und schickte einen Teil seines Heeres auf einer Bergstraße dorthin. Auf einer Anhöhe bei der Stadt stand der Tempel der Artemis von Perge, wo jedes Jahr ein Fest gefeiert wurde, und die Göttin und ihr Tempel erschienen auf den Münzen der Stadt. Der Mathematiker Apollonios, der im 3. Jahrhundert v. Chr. über die Kegelschnitte schrieb, wurde hier geboren."
    - "Paulus und seine Gefährten fuhren von Paphos nach Perge in Pamphylien, und dort verließ Johannes Markus sie und kehrte nach Jerusalem zurück, ein Weggang, der später Paulus und Barnabas trennte. Von Perge zogen sie landeinwärts nach Antiochia in Pisidien. Auf dem Rückweg predigten sie in Perge das Wort, gingen hinab zum Hafen Attalia und segelten von dort nach Antiochia in Syrien."
    - "Unter dem römischen Kaiserreich wurde Perge reich. Im frühen 2. Jahrhundert baute die Priesterin Plancia Magna, Tochter eines römischen Statthalters, das hellenistische Südtor zu einem prächtigen Hof mit Statuen der Stadtgründer und der Kaiserfamilie um. Die Stadt hatte ein Theater, ein Stadion, Bäder und eine Säulenstraße mit einem Wasserkanal in der Mitte. In der Spätantike war sie Bischofssitz mit großen Kirchen. Grabungen der Universität Istanbul seit 1946 haben einen großen Teil der Stadt freigelegt."
  fr:
    - "Perge se trouvait en Pamphylie, sur la plaine côtière du sud de l’Asie Mineure, à quelque 15 km au nord-est de l’actuelle Antalya, près du fleuve Cestrus, aujourd’hui l’Aksu ; Strabon dit qu’on remontait le fleuve sur soixante stades pour y arriver. Son acropole était déjà habitée à l’époque préhistorique, et un traité hittite du XIIIe siècle av. J.-C. nomme une ville Parha sur la frontière occidentale de Tarhuntassa, d’ordinaire identifiée à Perge. Hérodote, rapporte Strabon, faisait des Pamphyliens les descendants des peuples mêlés venus de Troie avec Amphilochos et Calchas."
    - "Alexandre le Grand traversa Perge pendant l’hiver 334–333 av. J.-C., y envoyant une partie de son armée par une route de montagne. Sur une hauteur près de la ville se dressait le temple d’Artémis de Perge, où se tenait chaque année une fête, et la déesse et son temple figuraient sur les monnaies de la ville. Le mathématicien Apollonios, qui écrivit sur les sections coniques au IIIe siècle av. J.-C., naquit ici."
    - "Paul et sa troupe firent voile de Paphos à Perge en Pamphylie, et c’est là que Jean Marc les quitta pour retourner à Jérusalem, départ qui sépara plus tard Paul et Barnabas. De Perge ils allèrent à l’intérieur, à Antioche de Pisidie. Au retour, ils prêchèrent la parole à Perge, descendirent au port d’Attalie et s’embarquèrent de là pour Antioche de Syrie."
    - "Sous l’Empire romain, Perge s’enrichit. Au début du IIe siècle, la prêtresse Plancia Magna, fille d’un gouverneur romain, transforma la porte sud hellénistique en une grande cour ornée de statues des fondateurs de la ville et de la famille impériale. La ville avait un théâtre, un stade, des bains et une rue principale à colonnades dont le milieu était parcouru par un canal d’eau. À l’Antiquité tardive, elle était un siège épiscopal doté de grandes églises. Les fouilles de l’université d’Istanbul, depuis 1946, ont mis au jour une grande partie de la ville."
  it:
    - "Perge si trovava in Panfilia, sulla pianura costiera dell’Asia Minore meridionale, circa 15 km a nord-est dell’odierna Antalya, presso il fiume Cestro, oggi Aksu; Strabone dice che si risaliva il fiume per sessanta stadi per raggiungerla. La sua acropoli era già abitata in epoca preistorica, e un trattato ittita del XIII secolo a.C. nomina una città Parha sul confine occidentale di Tarhuntassa, di solito identificata con Perge. Erodoto, come riferisce Strabone, faceva dei Panfili i discendenti dei popoli misti venuti da Troia con Anfiloco e Calcante."
    - "Alessandro Magno marciò attraverso Perge nell’inverno del 334–333 a.C., mandandovi parte del suo esercito per una strada di montagna. Su un’altura vicino alla città sorgeva il tempio di Artemide di Perge, dove ogni anno si teneva una festa, e la dea e il suo tempio compaiono sulle monete della città. Il matematico Apollonio, che scrisse sulle sezioni coniche nel III secolo a.C., nacque qui."
    - "Paolo e i suoi compagni salparono da Pafo per Perge di Panfilia, e là Giovanni Marco li lasciò e tornò a Gerusalemme, una partenza che più tardi separò Paolo e Barnaba. Da Perge salirono nell’entroterra verso Antiochia di Pisidia. Sulla via del ritorno predicarono la parola a Perge, scesero al porto di Attalia e di là salparono per Antiochia di Siria."
    - "Sotto l’impero romano Perge si arricchì. All’inizio del II secolo la sacerdotessa Plancia Magna, figlia di un governatore romano, ricostruì la porta meridionale ellenistica come un grande cortile con statue dei fondatori della città e della famiglia imperiale. La città aveva un teatro, uno stadio, terme e una via principale colonnata con un canale d’acqua che correva al centro. Nella tarda antichità fu sede vescovile con grandi chiese. Gli scavi dell’Università di Istanbul dal 1946 hanno portato alla luce gran parte della città."
  pl:
    - "Perge leżało w Pamfilii, na nadmorskiej równinie południowej Azji Mniejszej, około 15 km na północny wschód od dzisiejszej Antalyi, nad rzeką Kestros, dziś Aksu; Strabon mówi, że żeglowało się sześćdziesiąt stadiów w górę rzeki, by do niego dotrzeć. Jego akropol był zamieszkany już w czasach prehistorycznych, a traktat hetycki z XIII wieku p.n.e. wymienia miasto Parha na zachodniej granicy Tarhuntassy, zwykle utożsamiane z Perge. Herodot, jak podaje Strabon, uważał Pamfilijczyków za potomków mieszanych ludów, które przybyły spod Troi z Amfilochem i Kalchasem."
    - "Aleksander Wielki przemaszerował przez Perge zimą 334–333 roku p.n.e., posyłając tam część wojska drogą górską. Na wzgórzu koło miasta stała świątynia Artemidy z Perge, gdzie co roku odbywało się święto, a bogini i jej świątynia widniały na monetach miasta. Matematyk Apolloniusz, który w III wieku p.n.e. pisał o przekrojach stożkowych, urodził się tutaj."
    - "Paweł i jego towarzysze odpłynęli z Pafos do Perge w Pamfilii i tam Jan Marek ich opuścił i wrócił do Jerozolimy, odejście, które później rozdzieliło Pawła i Barnabę. Z Perge udali się w głąb lądu do Antiochii w Pizydii. W drodze powrotnej głosili w Perge słowo, zeszli do portu Attalii i stąd odpłynęli do Antiochii w Syrii."
    - "Za cesarstwa rzymskiego Perge wzbogaciło się. Na początku II wieku kapłanka Plancja Magna, córka rzymskiego namiestnika, przebudowała hellenistyczną bramę południową na wspaniały dziedziniec z posągami założycieli miasta i rodziny cesarskiej. Miasto miało teatr, stadion, łaźnie i kolumnadową ulicę główną z kanałem wodnym biegnącym jej środkiem. W późnej starożytności było siedzibą biskupa z wielkimi kościołami. Wykopaliska Uniwersytetu Stambulskiego od 1946 roku odsłoniły znaczną część miasta."
  cs:
    - "Perge ležela v Pamfylii, na pobřežní rovině jižní Malé Asie asi 15 km severovýchodně od dnešní Antalye, poblíž řeky Kestros, dnes Aksu; Strabón praví, že se k ní plulo šedesát stadií proti proudu řeky. Její akropole byla obydlena již v pravěku a chetitská smlouva ze 13. století př. n. l. jmenuje město Parha na západní hranici Tarchuntašši, obvykle ztotožňované s Perge. Hérodotos podle Strabóna pokládal Pamfyly za potomky smíšených národů, které přišly z Tróje s Amfilochem a Kalchantem."
    - "Alexandr Veliký prošel Pergí v zimě 334–333 př. n. l. a část svého vojska poslal horskou cestou. Na výšině poblíž města stál chrám Artemidy Pergské, kde se každý rok konala slavnost, a bohyně i její chrám se objevují na mincích města. Narodil se tu matematik Apollónios, který ve 3. století př. n. l. psal o kuželosečkách."
    - "Pavel a jeho družina odplouli z Pafu do Perge v Pamfylii a tam je Jan Marek opustil a vrátil se do Jeruzaléma, odchod, který později rozdělil Pavla a Barnabáše. Z Perge šli do vnitrozemí do Antiochie Pisidské. Na zpáteční cestě kázali slovo v Perge, sestoupili do přístavu Attaleie a odtud odplouli do Antiochie v Sýrii."
    - "Za římské říše Perge zbohatla. Na počátku 2. století kněžka Plancia Magna, dcera římského místodržitele, přestavěla helénistickou jižní bránu na velkolepé nádvoří se sochami zakladatelů města a císařské rodiny. Město mělo divadlo, stadion, lázně a kolonádovou hlavní ulici s vodním kanálem uprostřed. V pozdní antice bylo sídlem biskupa s velkými kostely. Vykopávky Istanbulské univerzity od roku 1946 odkryly velkou část města."
  nl:
    - "Perge lag in Pamfylië, op de kustvlakte van het zuiden van Klein-Azië, zo’n 15 km ten noordoosten van het moderne Antalya, bij de rivier Kestros, nu de Aksu; Strabo zegt dat men zestig stadiën de rivier opvoer om er te komen. De akropolis was al in de prehistorie bewoond, en een Hettitisch verdrag uit de 13e eeuw v.Chr. noemt een stad Parha aan de westgrens van Tarhuntassa, die meestal met Perge wordt gelijkgesteld. Herodotus maakte, zoals Strabo meldt, de Pamfyliërs tot afstammelingen van de gemengde volken die met Amphilochos en Kalchas uit Troje waren gekomen."
    - "Alexander de Grote trok in de winter van 334–333 v.Chr. door Perge en stuurde een deel van zijn leger over een bergweg erheen. Op een hoogte bij de stad stond de tempel van Artemis van Perge, waar elk jaar een feest werd gehouden, en de godin en haar tempel verschenen op de munten van de stad. De wiskundige Apollonios, die in de 3e eeuw v.Chr. over kegelsneden schreef, werd hier geboren."
    - "Paulus en zijn gezelschap voeren van Paffos naar Perge in Pamfylië, en daar verliet Johannes Marcus hen en keerde terug naar Jeruzalem, een vertrek dat Paulus en Barnabas later scheidde. Vanuit Perge trokken zij landinwaarts naar Antiochië in Pisidië. Op de terugweg predikten zij het woord in Perge, gingen af naar de haven Attalia en voeren vandaar naar Antiochië in Syrië."
    - "Onder het Romeinse keizerrijk werd Perge rijk. Begin 2e eeuw herbouwde de priesteres Plancia Magna, dochter van een Romeins gouverneur, de hellenistische zuidpoort als een grote binnenplaats met standbeelden van de stichters van de stad en van de keizerlijke familie. De stad had een theater, een stadion, baden en een zuilenstraat met een waterloop in het midden. In de late oudheid was het een bisschopszetel met grote kerken. Opgravingen van de Universiteit van Istanboel hebben sinds 1946 een groot deel van de stad blootgelegd."
  sv:
    - "Perge låg i Pamfylien, på kustslätten i södra Mindre Asien cirka 15 km nordost om nuvarande Antalya, nära floden Kestros, nu Aksu; Strabon säger att man seglade sextio stadier uppför floden för att nå den. Dess akropol var bebodd redan under förhistorisk tid, och ett hettitiskt fördrag från 1200-talet f.Kr. nämner en stad Parha på Tarhuntassas västgräns, vanligen identifierad med Perge. Herodotos gjorde, enligt Strabon, pamfylierna till ättlingar till de blandade folk som kom från Troja med Amfilochos och Kalchas."
    - "Alexander den store marscherade genom Perge vintern 334–333 f.Kr. och sände en del av sin armé dit på en bergsväg. På en höjd nära staden stod Artemistemplet i Perge, där en fest hölls varje år, och gudinnan och hennes tempel förekom på stadens mynt. Matematikern Apollonios, som skrev om kägelsnitt på 200-talet f.Kr., föddes här."
    - "Paulus och hans sällskap seglade från Pafos till Perge i Pamfylien, och där lämnade Johannes Markus dem och återvände till Jerusalem, en avskedstagning som senare skilde Paulus och Barnabas åt. Från Perge gick de inåt land till Antiochia i Pisidien. På tillbakavägen predikade de ordet i Perge, gick ned till hamnen i Attalia och seglade därifrån till Antiochia i Syrien."
    - "Under romartiden blev Perge rikt. I början av 100-talet byggde prästinnan Plancia Magna, dotter till en romersk guvernör, om den hellenistiska södra porten till en praktfull gård med statyer av stadens grundare och av kejsarfamiljen. Staden hade en teater, en stadion, bad och en kolonnförsedd huvudgata med en vattenränna längs mitten. Under senantiken var den biskopssäte med stora kyrkor. Utgrävningar av Istanbuls universitet sedan 1946 har frilagt mycket av staden."
