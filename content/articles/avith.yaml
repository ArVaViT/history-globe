# Overview article (ADR 0007). Mainstream facts only; the city of an early king of Edom known from one list in two copies; its site is unknown and said to be so.
id: avith
place: aae8a95
title:
  en: "Avith"
  ru: "Авиф"
  uk: "Авіт"
  es: "Avit"
  pt: "Avite"
  de: "Awit"
  fr: "Avith"
body:
  en:
    - "Avith was the city of Hadad son of Bedad, one of the kings of Edom listed in Genesis, “the kings that reigned in the land of Edom, before there reigned any king over the children of Israel”: “Hadad the son of Bedad, who smote Midian in the field of Moab, reigned in his stead: and the name of his city was Avith”. Chronicles copies the list word for word, and there the Synodal Bible spells the name Aviv. Each king of the list comes from a different town and none is a son of the one before, which suggests local chiefs rather than a dynasty. Hadad's victory over Midian in the country of Moab is the only deed recorded of any of them."
    - "Nothing else is known of Avith. It must have lain in Edom or on its edge, in the highlands of southern Jordan, and one proposal places it at Rujum al-Juththa west of Ma'an; no ruin bears the name, and the guess rests on nothing firmer than position."
  ru:
    - "Авиф — город Гадада, сына Бедадова, одного из царей Едома, перечисленных в книге Бытия: «Вот цари, царствовавшие в земле Едома, прежде царствования царей у сынов Израилевых». О нём сказано: «воцарился по нем Гадад, сын Бедадов, который поразил Мадианитян на поле Моава; имя городу его Авиф». Паралипоменон повторяет список слово в слово, и там Синодальный перевод пишет имя как Авив. Каждый царь списка происходит из своего города, и ни один не сын предыдущего, что говорит скорее о местных вождях, чем о династии. Победа Гадада над Мадианитянами в земле Моава — единственное дело, записанное о ком-либо из них."
    - "Больше об Авифе ничего не известно. Он должен был лежать в Едоме или на его краю, в нагорье южной Иордании, и одно из предположений помещает его в Руджум-эль-Джуфе к западу от Маана; ни одни развалины не носят этого имени, и догадка держится лишь на положении."
  uk:
    - "Авіт був містом Гадада, сина Бедада, одного з царів Едому в переліку Буття, «се царі, що царювали в Едом землї, перш нїж царював там який царь в Ізраїлї»: «царював намість його Гадад Бедаденко, що побив Мидіяніїв на полї Моаб, а город його прозивавсь Авит». Хроніки копіюють перелік слово в слово, і там Синодальний переклад пише назву як Авив. Кожен цар переліку походить з іншого міста, і жоден не син попереднього, що наводить на думку про місцевих вождів, а не про династію. Перемога Гадада над Мадіамом на моавській землі — єдиний записаний подвиг будь-кого з них."
    - "Більше про Авіт нічого не відомо. Він мав лежати в Едомі або на його краю, в нагір'ї південної Йорданії, і одна пропозиція розміщує його в Руджум-аль-Джутті на захід від Маана; жодна руїна не носить цієї назви, і здогад не спирається ні на що міцніше за розташування."
  es:
    - "Avit era la ciudad de Hadad hijo de Bedad, uno de los reyes de Edom enumerados en el Génesis, «los reyes que reinaron en la tierra de Edom, antes que reinase rey sobre los hijos de Israel»: «reinó en su lugar Adad, hijo de Badad, el que hirió á Midián en el campo de Moab: y el nombre de su ciudad fué Avith». Las Crónicas copian la lista palabra por palabra, y allí la Biblia sinodal escribe el nombre Aviv. Cada rey de la lista procede de una ciudad distinta y ninguno es hijo del anterior, lo que sugiere jefes locales más que una dinastía. La victoria de Hadad sobre Madián en el país de Moab es la única hazaña registrada de cualquiera de ellos."
    - "Nada más se sabe de Avit. Debió de estar en Edom o en su borde, en las tierras altas del sur de Jordania, y una propuesta la sitúa en Rujum al-Juththa, al oeste de Maán; ninguna ruina lleva el nombre, y la conjetura no descansa en nada más firme que la posición."
  pt:
    - "Avite era a cidade de Hadade, filho de Bedade, um dos reis de Edom listados em Gênesis, “os reis que reinaram na terra de Edom, antes que qualquer rei reinasse sobre os filhos de Israel”: “Hadade, filho de Bedade, que derrotou Midiã no campo de Moabe, reinou em seu lugar. O nome da sua cidade era Avite”. Crônicas copia a lista palavra por palavra, e ali a Bíblia sinodal grafa o nome Aviv. Cada rei da lista vem de uma cidade diferente e nenhum é filho do anterior, o que sugere chefes locais, e não uma dinastia. A vitória de Hadade sobre Midiã em terra de Moabe é o único feito registrado de qualquer deles."
    - "Nada mais se sabe de Avite. Deve ter ficado em Edom ou em sua borda, nas terras altas do sul da Jordânia, e uma proposta a põe em Rujum al-Juththa, a oeste de Ma'an; nenhuma ruína leva o nome, e a conjetura se apoia em nada mais firme que a posição."
  de:
    - "Awit war die Stadt Hadads, des Sohnes Bedads, eines der in der Genesis aufgeführten Könige von Edom, „die im Lande Edom regiert haben, ehe denn die Kinder Israel Könige hatten“: „Da Husam starb, ward König an seiner Statt Hadad, ein Sohn Bedads, der die Midianiter schlug auf der Moabiter Felde; und seine Stadt hieß Awith.“ Die Chronik schreibt die Liste Wort für Wort ab, und dort schreibt die Synodalbibel den Namen Awiw. Jeder König der Liste stammt aus einer anderen Stadt und keiner ist der Sohn seines Vorgängers, was auf lokale Häuptlinge statt auf eine Dynastie deutet. Hadads Sieg über Midian im Land Moab ist die einzige Tat, die von einem von ihnen berichtet wird."
    - "Sonst ist nichts über Awit bekannt. Es muss in Edom oder an seinem Rand gelegen haben, im Hochland von Südjordanien, und ein Vorschlag setzt es nach Rudschum al-Dschuththa westlich von Ma'an; keine Ruine trägt den Namen, und die Vermutung beruht auf nichts Festerem als der Lage."
  fr:
    - "Avith était la ville de Hadad, fils de Bedad, l’un des rois d’Édom énumérés dans la Genèse, « les rois qui ont régné dans le pays d’Édom, avant qu’un roi régnât sur les enfants d’Israël » : « Hadad, fils de Bedad, régna à sa place. C’est lui qui frappa Madian dans les champs de Moab. Le nom de sa ville était Avith ». Les Chroniques copient la liste mot pour mot, et la Bible synodale y orthographie le nom Aviv. Chaque roi de la liste vient d’une ville différente et aucun n’est fils du précédent, ce qui suggère des chefs locaux plutôt qu’une dynastie. La victoire de Hadad sur Madian au pays de Moab est le seul acte rapporté de l’un d’eux."
    - "On ne sait rien d’autre d’Avith. Elle devait se trouver en Édom ou à sa lisière, dans les hautes terres du sud de la Jordanie, et une proposition la place à Rujum al-Juththa, à l’ouest de Maan ; aucune ruine ne porte le nom, et l’hypothèse ne repose sur rien de plus ferme que la position."
