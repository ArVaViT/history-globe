body:
  en:
    - "Avith was the city of Hadad son of Bedad, one of the kings of Edom listed in Genesis, “the kings that reigned in the land of Edom, before there reigned any king over the children of Israel”: “Hadad the son of Bedad, who smote Midian in the field of Moab, reigned in his stead: and the name of his city was Avith”. Chronicles copies the list almost word for word, and there the Synodal Bible spells the name Aviv. Most kings of the list are tied to a different town and none is said to be a son of the one before, which suggests local chiefs rather than a dynasty. Hadad's victory over Midian in the country of Moab is the only deed recorded of any of them."
    - "Nothing else is known of Avith. It must have lain in Edom or on its edge, in the highlands of southern Jordan, and one proposal places it at Rujum al-Juththa west of Ma'an; no ruin bears the name, and the guess rests on nothing firmer than position."
  ru:
    - "Авиф — город Гадада, сына Бедадова, одного из царей Едома, перечисленных в книге Бытия: «Вот цари, царствовавшие в земле Едома, прежде царствования царей у сынов Израилевых». О нём сказано: «воцарился по нем Гадад, сын Бедадов, который поразил Мадианитян на поле Моава; имя городу его Авиф». Паралипоменон повторяет список почти слово в слово, и там Синодальный перевод пишет имя как Авив. Большинство царей списка связаны каждый со своим городом, и ни один не назван сыном предыдущего, что говорит скорее о местных вождях, чем о династии. Победа Гадада над Мадианитянами в земле Моава — единственное дело, записанное о ком-либо из них."
    - "Больше об Авифе ничего не известно. Он должен был лежать в Едоме или на его краю, в нагорье южной Иордании, и одно из предположений помещает его в Руджум-эль-Джуфе к западу от Маана; ни одни развалины не носят этого имени, и догадка держится лишь на положении."
  uk:
    - "Авіт був містом Гадада, сина Бедада, одного з царів Едому в переліку Буття, «се царі, що царювали в Едом землї, перш нїж царював там який царь в Ізраїлї»: «царював намість його Гадад Бедаденко, що побив Мидіяніїв на полї Моаб, а город його прозивавсь Авит». Хроніки копіюють перелік майже слово в слово, і там Синодальний переклад пише назву як Авив. Більшість царів переліку мають кожен своє місто, і жоден не названий сином попереднього, що наводить на думку про місцевих вождів, а не про династію. Перемога Гадада над Мадіамом на моавській землі — єдиний записаний подвиг будь-кого з них."
    - "Більше про Авіт нічого не відомо. Він мав лежати в Едомі або на його краю, в нагір'ї південної Йорданії, і одна пропозиція розміщує його в Руджум-аль-Джутті на захід від Маана; жодна руїна не носить цієї назви, і здогад не спирається ні на що міцніше за розташування."
  es:
    - "Avit era la ciudad de Hadad hijo de Bedad, uno de los reyes de Edom enumerados en el Génesis, «los reyes que reinaron en la tierra de Edom, antes que reinase rey sobre los hijos de Israel»: «reinó en su lugar Adad, hijo de Badad, el que hirió á Midián en el campo de Moab: y el nombre de su ciudad fué Avith». Las Crónicas copian la lista casi palabra por palabra, y allí la Biblia sinodal escribe el nombre Aviv. La mayoría de los reyes de la lista están ligados a una ciudad distinta y de ninguno se dice que sea hijo del anterior, lo que sugiere jefes locales más que una dinastía. La victoria de Hadad sobre Madián en el país de Moab es la única hazaña registrada de cualquiera de ellos."
    - "Nada más se sabe de Avit. Debió de estar en Edom o en su borde, en las tierras altas del sur de Jordania, y una propuesta la sitúa en Rujum al-Juththa, al oeste de Maán; ninguna ruina lleva el nombre, y la conjetura no descansa en nada más firme que la posición."
  pt:
    - "Avite era a cidade de Hadade, filho de Bedade, um dos reis de Edom listados em Gênesis, “os reis que reinaram na terra de Edom, antes que qualquer rei reinasse sobre os filhos de Israel”: “Hadade, filho de Bedade, que derrotou Midiã no campo de Moabe, reinou em seu lugar. O nome da sua cidade era Avite”. Crônicas copia a lista quase palavra por palavra, e ali a Bíblia sinodal grafa o nome Aviv. A maioria dos reis da lista está ligada a uma cidade diferente e de nenhum se diz que seja filho do anterior, o que sugere chefes locais, e não uma dinastia. A vitória de Hadade sobre Midiã em terra de Moabe é o único feito registrado de qualquer deles."
    - "Nada mais se sabe de Avite. Deve ter ficado em Edom ou em sua borda, nas terras altas do sul da Jordânia, e uma proposta a põe em Rujum al-Juththa, a oeste de Ma'an; nenhuma ruína leva o nome, e a conjetura se apoia em nada mais firme que a posição."
  de:
    - "Awit war die Stadt Hadads, des Sohnes Bedads, eines der in der Genesis aufgeführten Könige von Edom, „die im Lande Edom regiert haben, ehe denn die Kinder Israel Könige hatten“: „Da Husam starb, ward König an seiner Statt Hadad, ein Sohn Bedads, der die Midianiter schlug auf der Moabiter Felde; und seine Stadt hieß Awith.“ Die Chronik schreibt die Liste fast Wort für Wort ab, und dort schreibt die Synodalbibel den Namen Awiw. Die meisten Könige der Liste sind mit einer anderen Stadt verbunden, und von keinem heißt es, er sei der Sohn seines Vorgängers, was auf lokale Häuptlinge statt auf eine Dynastie deutet. Hadads Sieg über Midian im Land Moab ist die einzige Tat, die von einem von ihnen berichtet wird."
    - "Sonst ist nichts über Awit bekannt. Es muss in Edom oder an seinem Rand gelegen haben, im Hochland von Südjordanien, und ein Vorschlag setzt es nach Rudschum al-Dschuththa westlich von Ma'an; keine Ruine trägt den Namen, und die Vermutung beruht auf nichts Festerem als der Lage."
  fr:
    - "Avith était la ville de Hadad, fils de Bedad, l’un des rois d’Édom énumérés dans la Genèse, « les rois qui ont régné dans le pays d’Édom, avant qu’un roi régnât sur les enfants d’Israël » : « Hadad, fils de Bedad, régna à sa place. C’est lui qui frappa Madian dans les champs de Moab. Le nom de sa ville était Avith ». Les Chroniques copient la liste presque mot pour mot, et la Bible synodale y orthographie le nom Aviv. La plupart des rois de la liste sont rattachés à une ville différente et aucun n’est dit fils du précédent, ce qui suggère des chefs locaux plutôt qu’une dynastie. La victoire de Hadad sur Madian au pays de Moab est le seul acte rapporté de l’un d’eux."
    - "On ne sait rien d’autre d’Avith. Elle devait se trouver en Édom ou à sa lisière, dans les hautes terres du sud de la Jordanie, et une proposition la place à Rujum al-Juththa, à l’ouest de Maan ; aucune ruine ne porte le nom, et l’hypothèse ne repose sur rien de plus ferme que la position."
  it:
    - "Avit era la città di Adad figlio di Bedad, uno dei re di Edom elencati nella Genesi, «i re che regnarono nel paese di Edom, prima che alcun re regnasse sui figliuoli d’Israele»: «Husham morì, e Hadad, figliuolo di Bedad, che sconfisse i Madianiti ne’ campi di Moab, regnò in luogo suo; e il nome della sua città fu Avith». Le Cronache copiano l’elenco quasi parola per parola, e lì la Bibbia sinodale scrive il nome Aviv. La maggior parte dei re dell’elenco è legata a una città diversa e di nessuno si dice che sia figlio del precedente, il che suggerisce capi locali piuttosto che una dinastia. La vittoria di Adad sui Madianiti nel paese di Moab è l’unica impresa registrata di uno qualsiasi di loro."
    - "Nient’altro si sa di Avit. Deve essere stata in Edom o al suo margine, sugli altopiani della Giordania meridionale, e una proposta la pone a Rujum al-Juththa a ovest di Ma‘an; nessuna rovina porta il nome, e l’ipotesi non poggia su nulla di più solido della posizione."
  pl:
    - "Awit było miastem Hadada, syna Bedada, jednego z królów Edomu wymienionych w Księdze Rodzaju, królów, „którzy królowali w ziemi Edomskiej, pierwej niż królował król nad syny Izraelskimi”: „królował miasto niego Hadad, syn Badadów, który poraził Madyjańczyki, na polu Moabskiem, a imię miasta jego Hawid”. Księga Kronik kopiuje wykaz niemal słowo w słowo i tam Biblia synodalna zapisuje nazwę jako Awiw. Większość królów wykazu wiąże się z innym miastem i o żadnym nie mówi się, że jest synem poprzedniego, co sugeruje raczej lokalnych wodzów niż dynastię. Zwycięstwo Hadada nad Madianem w kraju Moabu to jedyny czyn zapisany o którymkolwiek z nich."
    - "Nic więcej o Awit nie wiadomo. Musiało leżeć w Edomie lub na jego skraju, w górach południowej Jordanii, a jedna propozycja umieszcza je w Rujum al-Juththa na zachód od Ma'an; żadna ruina nie nosi tej nazwy, a domysł opiera się tylko na położeniu."
  nl:
    - "Awit was de stad van Hadad, de zoon van Bedad, een van de koningen van Edom die in Genesis worden opgesomd, “koningen, die geregeerd hebben in het land Edom, eer een koning regeerde over de kinderen Israels”: “in zijn plaats regeerde Hadad, de zoon van Bedad, die Midian versloeg in het veld van Moab; en de naam zijner stad was Avith”. Kronieken kopieert de lijst bijna woord voor woord, en daar spelt de Synodale Bijbel de naam Aviv. De meeste koningen van de lijst zijn met een andere stad verbonden en van geen wordt gezegd dat hij een zoon van de vorige is, wat wijst op plaatselijke leiders eerder dan een dynastie. Hadads overwinning op Midian in het land Moab is de enige daad die van een van hen wordt vermeld."
    - "Verder is niets van Awit bekend. Het moet in Edom of aan de rand ervan hebben gelegen, in het hoogland van Zuid-Jordanië, en een voorstel plaatst het bij Rujum al-Juththa ten westen van Ma’an; geen ruïne draagt de naam, en de gissing berust op niets steviger dan de ligging."
  cs:
    - "Avit bylo město Hadada, syna Bedadova, jednoho z edómských králů vyjmenovaných v Genesis, „králové, kteříž kralovali v zemi Idumejské, prvé než kraloval král nad syny Izraelskými“: „kraloval místo něho Adad, syn Badadův, kterýž porazil Madianské v krajině Moábské; a jméno města jeho Avith“. Letopisy kopírují seznam téměř slovo od slova a synodální Bible tam píše jméno Aviv. Většina králů seznamu je spojena s jiným městem a o žádném se neříká, že je synem předchozího, což napovídá, že šlo o místní náčelníky, nikoli o dynastii. Hadadovo vítězství nad Midjánem v moábské zemi je jediným zaznamenaným činem kteréhokoli z nich."
    - "O Avitu není nic jiného známo. Muselo ležet v Edómu nebo na jeho okraji, ve vysočině jižního Jordánska, a jeden návrh jej klade do Rujum al-Juththa západně od Ma'ánu; žádná zřícenina jméno nenese a dohad se opírá jen o polohu."
  sv:
    - "Avit var staden åt Hadad, Bedads son, en av Edoms kungar som förtecknas i Första Mosebok, ”de konungar som regerade i Edoms land, innan ännu någon israelitisk konung var konung där”: ”blev Hadad, Bedads son, konung efter honom, han som slog midjaniterna på Moabs mark; och hans stad hette Avit”. Krönikeböckerna kopierar förteckningen nästan ord för ord, och där skriver synodalbibeln namnet Aviv. De flesta av förteckningens kungar knyts till en annan stad och ingen sägs vara son till den förre, vilket tyder på lokala hövdingar snarare än en dynasti. Hadads seger över Midjan i Moabs land är den enda gärning som berättas om någon av dem."
    - "Ingenting annat är känt om Avit. Det måste ha legat i Edom eller i dess utkant, i södra Jordaniens bergsland, och ett förslag placerar det vid Rujum al-Juththa väster om Ma'an; ingen ruin bär namnet, och gissningen vilar på inget fastare än läget."
  nb:
    - "Avit var byen til Hadad, Bedads sønn, en av Edoms konger oppført i 1. Mosebok, «de konger som regjerte i Edom-landet før det regjerte nogen konge over Israels barn»: «Da Husam døde, blev Hadad, Bedads sønn, konge i hans sted; det var han som slo midianittene på Moabs mark; hans by hette Avit». Krønikebøkene kopierer listen nesten ord for ord, og der skriver synodalbibelen navnet Aviv. De fleste kongene i listen er knyttet til en annen by, og ingen sies å være sønn av den forrige, noe som antyder lokale høvdinger snarere enn et dynasti. Hadads seier over Midjan på Moabs mark er den eneste gjerningen som er oppgitt om noen av dem."
    - "Mer er ikke kjent om Avit. Den må ha ligget i Edom eller i utkanten av det, i høylandet i Sør-Jordan, og ett forslag plasserer den ved Rujum al-Juththa vest for Ma'an; ingen ruin bærer navnet, og gjetningen hviler på ikke noe mer solid enn beliggenheten."
  tl:
    - "Ang Avith ay lungsod ni Adad na anak ni Badad, isa sa mga hari ng Edom na nakalista sa Genesis, “ang mga hari na nagsipaghari sa lupain ng Edom bago maghari ang sinomang hari sa angkan ni Israel”: “si Adad, na anak ni Badad, na siya ring sumakit kay Midian sa parang ni Moab: at ang pangalan ng kaniyang bayan ay Avita”. Halos salita-por-salitang kinokopya ng Mga Cronica ang talaan, at doon ay Aviv ang baybay ng Sinodal na Biblia sa pangalan. Karamihan ng mga hari sa talaan ay nakatali sa ibang bayan at wala ni isang sinasabing anak ng nauna, na nagmumungkahi ng mga lokal na pinuno sa halip na dinastiya. Ang tagumpay ni Adad laban sa Midian sa bansa ng Moab ang tanging gawang itinatala sa alinman sa kanila."
    - "Wala nang iba pang alam tungkol sa Avith. Dapat ay nasa Edom ito o sa gilid nito, sa kabundukan ng timog Jordan, at isang mungkahi ang naglalagay nito sa Rujum al-Juththa sa kanluran ng Ma'an; walang guhong may ganitong pangalan, at ang hula ay nakasalig sa wala nang mas matibay kaysa sa posisyon."
  da:
    - "Avit var byen for Hadad, Bedads søn, en af Edoms konger opregnet i Første Mosebog, »de Konger, som regerede i Edoms Land, førend der regerede en Konge over Israels Børn«: »Hadad, Bedads Søn, blev Konge i hans Sted, han, som slog Midianiterne paa Moabs Mark; og hans Stads Navn var Avith«. Krønikebøgerne kopierer listen næsten ord for ord, og dér staver synodalbibelen navnet Aviv. De fleste af listens konger knyttes til hver sin by, og ingen siges at være søn af den forrige, hvilket tyder på lokale høvdinge snarere end et dynasti. Hadads sejr over Midjan i Moabs land er den eneste gerning, der er optegnet om nogen af dem."
    - "Intet andet vides om Avit. Den må have ligget i Edom eller på dets kant, i højlandet i det sydlige Jordan, og ét forslag placerer den ved Rujum al-Juththa vest for Ma'an; ingen ruin bærer navnet, og gættet hviler på intet fastere end beliggenhed."
  sr:
    - "Авит је био град Адада сина Варадовог, једног од едомских краљева наведених у Постању, „цареви који цароваше у земљи едомској пре него се зацари цар над синовима Израиљевим“: „зацари се на његово место Адад син Варадов, који исече Мадијане у пољу моавском“, а његов град звао се Авит. Летописи преписују списак готово од речи до речи, и ту синодална Библија пише име Авив. Већина краљева списка везана је за други град и ни за једног се не каже да је син претходног, што наговештава месне поглавице пре него династију. Ададова победа над Мадијанцима у земљи Моавској једини је подвиг забележен за ма кога од њих."
    - "О Авиту се не зна ништа друго. Мора да је лежао у Едому или на његовом рубу, у горју јужног Јордана, а један предлог га смешта у Рујум ал-Џуту западно од Маана; ниједна рушевина не носи име, а претпоставка се ослања на ништа чвршће од положаја."
  hu:
    - "Avit Hadadnak, Bedád fiának volt a városa, aki Edom Teremtés könyvében felsorolt királyai közé tartozik, „a királyok, kik uralkodtak Edóm földén minekelőtte Izráel fiai között király uralkodott volna”: „uralkodék helyette Hadád, a Bédád fia, a ki megveré a Midiánitákat a Moáb mezején; az ő városának neve pedig Hávit vala”. A Krónikák szinte szóról szóra átveszik a jegyzéket, és ott a szinodális Biblia Avivnak írja a nevet. A jegyzék legtöbb királya más-más városhoz kötődik, és egyikről sem mondják, hogy az előzőnek a fia, ami helyi főnökökre utal, nem dinasztiára. Hadad Midián felett Moáb földjén aratott győzelme az egyetlen tett, amelyet bármelyikükről feljegyeztek."
    - "Avitról másról nem tudunk. Edomban vagy szélén kellett feküdnie, Dél-Jordánia felföldjén, és az egyik javaslat a Ma'antól nyugatra fekvő Rujum al-Juththába teszi; semmilyen rom nem viseli a nevet, és a feltevés nem szilárdabb a fekvésnél."
  fi:
    - "Avit oli Hadadin, Bedadin pojan, kaupunki; hän oli yksi Edomin kuninkaista, jotka luetellaan 1. Mooseksen kirjassa, kuninkaista, ”jotka hallitsivat Edomin maassa, ennenkuin yksikään kuningas oli hallinnut israelilaisia”: ”Kun Huusam kuoli, tuli Hadad, Bedadin poika, kuninkaaksi hänen sijaansa, hän, joka voitti midianilaiset Mooabin kedolla; ja hänen kaupunkinsa nimi oli Avit.” Aikakirjat kopioivat luettelon lähes sanasta sanaan, ja siellä synodaalinen Raamattu kirjoittaa nimen Aviv. Useimmat luettelon kuninkaat on sidottu eri kaupunkiin, eikä yhdenkään sanota olevan edellisen poika, mikä viittaa paikallisiin päälliköihin eikä dynastiaan. Hadadin voitto midianilaisista Moabin maassa on ainoa mistään heistä kirjattu teko."
    - "Avitista ei tiedetä muuta. Sen täytyi sijaita Edomissa tai sen reunalla, Etelä-Jordanian ylängöillä, ja yksi ehdotus sijoittaa sen Rujum al-Juththaan Ma'anista länteen; mikään rauniokaan ei kanna nimeä, ja arvaus perustuu pelkkään sijaintiin."
  vi:
    - "A-vít là thành của Ha-đát con trai Bê-đát, một trong các vua Ê-đôm được liệt kê trong Sáng Thế Ký, “Trước khi dân Y-sơ-ra-ên chưa có một vua nào cai trị, thì đây là các vua trị vì xứ Ê-đôm”: “Ha-đát, con trai Bê-đát, lên kế vị. Ấy là vua nầy đánh thắng dân Ma-đi-an tại đồng Mô-áp; và tên thành người là A-vít.” Sách Sử Ký chép lại danh sách gần như từng chữ, và ở đó Kinh Thánh Synodal viết tên là Aviv. Phần lớn các vua trong danh sách gắn với một thành khác nhau và không vua nào được nói là con của vua trước, điều này gợi ý các thủ lĩnh địa phương hơn là một triều đại. Chiến thắng của Ha-đát trước Ma-đi-an trên đất Mô-áp là việc duy nhất được ghi của bất kỳ vua nào trong số họ."
    - "Không biết gì thêm về A-vít. Nó hẳn nằm trong Ê-đôm hoặc ở rìa, trong vùng cao nguyên miền nam Gióc-đa-ni, và một đề xuất đặt nó tại Rujum al-Juththa phía tây Ma'an; không tàn tích nào mang tên ấy, và phỏng đoán không dựa trên gì vững hơn vị trí."
  ro:
    - "Avit era cetatea lui Hadad, fiul lui Bedad, unul dintre regii Edomului înșirați în Geneza, „carii au împărățit în Edom mai ’nainte de a împărățì împărat în Israil”: Hadad, fiul lui Bedad, care l-a învins pe Madian în câmpia Moabului, a domnit în locul lui, iar numele cetății lui era Avit. Cronicile copiază lista aproape cuvânt cu cuvânt, iar acolo Biblia sinodală scrie numele Aviv. Cei mai mulți regi din listă sunt legați de o cetate diferită și niciunul nu este numit fiul celui dinainte, ceea ce sugerează căpetenii locale, nu o dinastie. Victoria lui Hadad asupra lui Madian în țara Moabului este singura faptă consemnată a vreunuia dintre ei."
    - "Nimic altceva nu se știe despre Avit. Trebuie să fi fost în Edom sau la marginea lui, în înălțimile Iordaniei de sud, iar o propunere îl așază la Rujum al-Juththa, la vest de Ma'an; nicio ruină nu poartă numele, iar presupunerea nu se sprijină pe nimic mai ferm decât poziția."
  bg:
    - "Авит бил градът на Хадад, син на Бедад, един от царете на Едом, изброени в Битие, „царете които царуваха в земята Едом преди да се възцари цар над синовете Израилеви“: „и въцари се вместо него Адад синът на Вадада, който порази Мадиамците на полето Моав; а името на града му бе Авит“. Летописи копира списъка почти дума по дума и там Синодалната Библия записва името като Авив. Повечето царе от списъка са свързани с различен град и за никого не се казва, че е син на предишния, което подсказва местни вождове, а не династия. Победата на Хадад над Мадиам в страната на Моав е единственото деяние, записано за някого от тях."
    - "Нищо друго не се знае за Авит. Той трябва да е лежал в Едом или на ръба му, във възвишенията на южна Йордания, и едно предложение го поставя при Руджум ал-Джутха западно от Маан; никоя развалина не носи името и догадката се опира само на положението."
