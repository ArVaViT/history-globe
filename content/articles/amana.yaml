body:
  en:
    - "Amana is a mountain named once, in the Song of Songs, beside Senir and Hermon. Because of that company it is usually sought in the Anti-Lebanon north-west of Damascus, and identified with Jebel ez-Zebedani, a ridge of about 1,800 m above the town of Zabadani where the Barada rises; the reading tradition of the Hebrew text calls that river, Naaman's Abana, by the same name, Amana. The other proposal, set out in the International Standard Bible Encyclopedia, is Mount Amanus, the range in the far north of Syria above the Gulf of Iskenderun; Michael Avi-Yonah held that Amana should be kept distinct from it. A Roman road station named Amana stood on the road from Damascus to Palmyra."
    - "The bridegroom calls the bride down from the northern heights: “Come with me from Lebanon, my spouse, with me from Lebanon: look from the top of Amana, from the top of Shenir and Hermon, from the lions’ dens, from the mountains of the leopards.” The peaks stand for the wild and distant country from which he calls her to come away with him. The Zabadani heights today lie in Syria, close to the Lebanese border, above the valley of the upper Barada."
  ru:
    - "Амана — гора, названная один раз, в Песни Песней, рядом с Сениром и Ермоном. По этому соседству её обычно ищут в Антиливане к северо-западу от Дамаска и отождествляют с Джебель-эз-Зебедани — хребтом высотой около 1800 м над городом Забадани, где берёт начало Барада; традиция чтения еврейского текста называет эту реку, Авану Неемана, тем же именем — Амана. Другое предложение, изложенное в Международной стандартной библейской энциклопедии, — гора Аман, хребет на крайнем севере Сирии над заливом Искендерун; Михаэль Ави-Йона считал, что Аману не следует с ним смешивать. Римская дорожная станция Амана стояла на дороге из Дамаска в Пальмиру."
    - "Жених зовёт невесту с северных высот: «Со мною с Ливана, невеста! со мною иди с Ливана! спеши с вершины Аманы, с вершины Сенира и Ермона, от логовищ львиных, от гор барсовых!» Вершины обозначают дикую и далёкую страну, откуда он зовёт её уйти с ним. Высоты Забадани сегодня находятся в Сирии, близ ливанской границы, над долиной верхней Барады."
  uk:
    - "Амана — гора, названа один раз, у Пісні над піснями, поруч із Сеніром і Гермоном. Через таке сусідство її зазвичай шукають в Антилібані на північний захід від Дамаска й ототожнюють із Джебель-ез-Забадані, хребтом заввишки близько 1800 м над містечком Забадані, де бере початок Барада; традиція читання єврейського тексту називає цю річку, Нааманову Авану, тим самим ім'ям — Амана. Інша пропозиція, викладена в International Standard Bible Encyclopedia, — гора Аманус, хребет на крайній півночі Сирії над Іскендерунською затокою; Міхаель Ави-Йона вважав, що Амана має бути відмінна від неї. Римська станція Амана стояла на дорозі з Дамаска до Пальміри."
    - "Наречений кличе наречену з північних висот: «Зійди ж, подруго, за мною з Ливану; йди зо мною з Ливану! сьпіши з верхівя Амани, з верхівя Сенира й Єрмону, від леговищ левів, із гір, де рисї!» Вершини втілюють дику й далеку країну, з якої він кличе її піти з ним. Висоти Забадані нині лежать у Сирії, поблизу ліванського кордону, над долиною верхньої Баради."
  es:
    - "Amana es una montaña nombrada una sola vez, en el Cantar de los Cantares, junto a Senir y Hermón. Por esa compañía suele buscársela en el Antilíbano, al noroeste de Damasco, y se identifica con el Yebel ez-Zebedani, una cresta de unos 1800 m sobre la ciudad de Zabadani, donde nace el Barada; la tradición de lectura del texto hebreo da a ese río, el Abana de Naamán, el mismo nombre, Amana. La otra propuesta, expuesta en la International Standard Bible Encyclopedia, es el monte Amano, la cordillera del extremo norte de Siria sobre el golfo de Iskenderun; Michael Avi-Yonah sostuvo que Amana debe distinguirse de él. Una estación de la calzada romana llamada Amana se alzaba en el camino de Damasco a Palmira."
    - "El esposo llama a la esposa desde las alturas del norte: «Conmigo del Líbano, oh esposa, conmigo ven del Líbano: mira desde la cumbre de Amana, desde la cumbre de Senir y de Hermón, desde las guaridas de los leones, desde los montes de los tigres». Las cumbres representan el país salvaje y lejano desde el cual la llama a venir con él. Las alturas de Zabadani se hallan hoy en Siria, cerca de la frontera libanesa, sobre el valle del alto Barada."
  pt:
    - "Amana é um monte mencionado uma só vez, no Cântico dos Cânticos, ao lado do Senir e do Hermom. Por causa dessa companhia, costuma-se procurá-lo no Antilíbano, a noroeste de Damasco, e identificá-lo com o Jebel ez-Zebedani, uma cordilheira de cerca de 1.800 m acima da cidade de Zabadani, onde nasce o Barada; a tradição de leitura do texto hebraico chama esse rio, a Abana de Naamã, pelo mesmo nome, Amana. A outra proposta, apresentada na International Standard Bible Encyclopedia, é o monte Amano, a cordilheira do extremo norte da Síria, acima do golfo de Iskenderun; Michael Avi-Yonah sustentava que Amana deve ser distinguida dele. Uma estação da estrada romana chamada Amana ficava na estrada de Damasco a Palmira."
    - "O noivo chama a noiva para descer das alturas do norte: “Venha comigo do Líbano, minha noiva, comigo do Líbano. Olhe do topo do Amana, do topo do Senir e do Hermom, das covas dos leões, dos montes dos leopardos.” Os picos representam a região selvagem e distante da qual ele a convida a partir com ele. As alturas de Zabadani ficam hoje na Síria, perto da fronteira libanesa, acima do vale do alto Barada."
  de:
    - "Amana ist ein Berg, der einmal im Hohelied genannt wird, neben Senir und Hermon. Wegen dieser Gesellschaft sucht man ihn gewöhnlich im Antilibanon nordwestlich von Damaskus und setzt ihn mit dem Dschebel es-Sebedani gleich, einem Bergrücken von etwa 1800 m über der Stadt Zabadani, wo der Barada entspringt; die Lesetradition des hebräischen Textes nennt diesen Fluss, Naamans Abana, mit demselben Namen, Amana. Der andere Vorschlag, in der International Standard Bible Encyclopedia dargelegt, ist der Amanus, das Gebirge im äußersten Norden Syriens oberhalb des Golfs von Iskenderun; Michael Avi-Yonah hielt dafür, dass Amana von ihm unterschieden werden müsse. Eine römische Straßenstation namens Amana lag an der Straße von Damaskus nach Palmyra."
    - "Der Bräutigam ruft die Braut von den nördlichen Höhen herab: „Komm mit mir, meine Braut, vom Libanon, komm mit mir vom Libanon, tritt her von der Höhe Amana, von der Höhe Senir und Hermon, von den Wohnungen der Löwen, von den Bergen der Leoparden!“ Die Gipfel stehen für das wilde, ferne Land, aus dem er sie ruft, damit sie mit ihm fortgehe. Die Höhen von Zabadani liegen heute in Syrien, nahe der libanesischen Grenze, oberhalb des Tals des oberen Barada."
  fr:
    - "Amana est une montagne nommée une seule fois, dans le Cantique des cantiques, à côté du Senir et de l’Hermon. À cause de cette compagnie, on la cherche d’ordinaire dans l’Anti-Liban, au nord-ouest de Damas, et on l’identifie avec le Djebel ez-Zebedani, une crête d’environ 1 800 m au-dessus de la ville de Zabadani, où naît le Barada ; la tradition de lecture du texte hébreu donne à ce fleuve, l’Abana de Naaman, le même nom d’Amana. L’autre proposition, exposée dans l’International Standard Bible Encyclopedia, est le mont Amanus, la chaîne de l’extrême nord de la Syrie qui domine le golfe d’Iskenderun ; Michael Avi-Yonah tenait qu’Amana devait en rester distincte. Une station routière romaine nommée Amana se trouvait sur la route de Damas à Palmyre."
    - "L’époux appelle la fiancée des hauteurs du nord : « Viens avec moi du Liban, ma fiancée, viens avec moi du Liban ! Regarde du sommet de l’Amana, du sommet du Senir et de l’Hermon, des tanières des lions, des montagnes des léopards. » Les sommets figurent le pays sauvage et lointain d’où il l’appelle à venir avec lui. Les hauteurs de Zabadani se trouvent aujourd’hui en Syrie, près de la frontière libanaise, au-dessus de la vallée du haut Barada."
  it:
    - "L’Amana è un monte nominato una sola volta, nel Cantico dei Cantici, accanto al Senir e all’Ermon. Per questa compagnia lo si cerca di solito nell’Antilibano a nord-ovest di Damasco, identificandolo con il Jebel ez-Zebedani, una cresta di circa 1800 m sopra la città di Zabadani dove nasce il Barada; la tradizione di lettura del testo ebraico chiama quel fiume, l’Abana di Naaman, con lo stesso nome, Amana. L’altra proposta, esposta nella International Standard Bible Encyclopedia, è il monte Amano, la catena dell’estremo nord della Siria sopra il golfo di Iskenderun; Michael Avi-Yonah sosteneva che l’Amana vada tenuta distinta da esso. Una stazione stradale romana di nome Amana sorgeva sulla via da Damasco a Palmira."
    - "Lo sposo chiama la sposa dalle alture del nord: «Vieni meco dal Libano, o mia sposa, vieni meco dal Libano! Guarda dalla sommità dell’Amana, dalla sommità del Senir e dell’Hermon, dalle spelonche de’ leoni, dai monti de’ leopardi». Le vette rappresentano il paese selvaggio e lontano da cui egli la invita a venire via con lui. Le alture di Zabadani si trovano oggi in Siria, vicino al confine libanese, sopra la valle dell’alto Barada."
  nl:
    - "Amana is een berg die eenmaal wordt genoemd, in het Hooglied, naast Senir en Hermon. Vanwege dat gezelschap zoekt men hem gewoonlijk in de Anti-Libanon ten noordwesten van Damascus, en vereenzelvigt men hem met de Jebel ez-Zebedani, een bergrug van ongeveer 1800 m boven de stad Zabadani waar de Barada ontspringt; de leestraditie van de Hebreeuwse tekst noemt die rivier, de Abana van Naäman, met dezelfde naam, Amana. Het andere voorstel, uiteengezet in de International Standard Bible Encyclopedia, is de berg Amanus, het gebergte in het uiterste noorden van Syrië boven de Golf van Iskenderun; Michael Avi-Yonah hield staande dat Amana van hem onderscheiden moet blijven. Een Romeins wegstation met de naam Amana lag aan de weg van Damascus naar Palmyra."
    - "De bruidegom roept de bruid van de noordelijke hoogten omlaag: “Bij Mij van den Libanon af, o bruid! kom bij Mij van den Libanon af; zie van den top van Amana, van den top van Senir en van Hermon, van de woningen der leeuwinnen, van de bergen der luipaarden.” De toppen staan voor het wilde en verre land waaruit hij haar roept om met hem mee te gaan. De hoogten van Zabadani liggen tegenwoordig in Syrië, dicht bij de Libanese grens, boven het dal van de bovenloop van de Barada."
  pl:
    - "Amana to góra wymieniona raz, w Pieśni nad Pieśniami, obok Senir i Hermonu. Z powodu tego towarzystwa szuka się jej zwykle w Antylibanie na północny zachód od Damaszku i utożsamia z Dżabal az-Zabadani, grzbietem o wysokości około 1800 m nad miastem Zabadani, gdzie wypływa Barada; tradycja czytania tekstu hebrajskiego nazywa tę rzekę, Abanę Naamana, tą samą nazwą, Amana. Inna propozycja, przedstawiona w International Standard Bible Encyclopedia, to góra Amanus, pasmo na dalekiej północy Syrii nad Zatoką Iskenderuńską; Michael Avi-Yonah uważał, że Amanę należy od niej odróżniać. Rzymska stacja drogowa o nazwie Amana stała przy drodze z Damaszku do Palmiry."
    - "Oblubieniec wzywa oblubienicę z północnych wyżyn: „Pójdziesz ze mną z Libanu, o oblubienico moja! ze mną z Libanu pójdziesz, a spojrzysz z wierzchu góry Amana, z wierzchu góry Sanir i Hermon, z jaskiń lwich, i z gór lampartowych”. Szczyty oznaczają dziki i odległy kraj, z którego wzywa ją, by poszła z nim. Wyżyny Zabadani leżą dziś w Syrii, blisko granicy libańskiej, nad doliną górnej Barady."
  cs:
    - "Amana je hora jmenovaná jednou, v Písni písní, vedle Senír a Hermonu. Pro tuto společnost se obvykle hledá v Antilibanonu severozápadně od Damašku a ztotožňuje se s Džabal az-Zabadání, hřebenem asi 1 800 m nad městem Zabadání, kde pramení Barada; tradice čtení hebrejského textu nazývá touž řeku, Námánovu Abanu, stejným jménem Amana. Druhý návrh, vyložený v International Standard Bible Encyclopedia, je hora Amanos, pohoří na dalekém severu Sýrie nad Iskenderunským zálivem; Michael Avi-Yonah zastával názor, že Amana má být od ní odlišena. Římská cestovní stanice jménem Amana stála na cestě z Damašku do Palmyry."
    - "Ženich volá nevěstu dolů ze severních výšin: „Se mnou z Libánu, ó choti má, se mnou z Libánu půjdeš, a pohledíš s vrchu hory Amana, s vrchu Senir a Hermon, z peleší lvových a s hor pardových.“ Vrcholy představují divokou a vzdálenou krajinu, z níž ji volá, aby šla s ním. Výšiny Zabadání leží dnes v Sýrii, blízko libanonské hranice, nad údolím horní Barady."
