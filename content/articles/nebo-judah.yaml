body:
  en:
    - "This Nebo is a town of Judah or Benjamin known only from the lists of exiles who returned from Babylon: “The children of Nebo, fifty and two”, and in Nehemiah “The men of the other Nebo, fifty and two”. “The other” seems to set it apart from the better-known Nebo of Moab, which has its own article. In both lists it stands among towns north and west of Jerusalem, after Bethel and Ai, which is all that guides the search for it."
    - "The map gives three answers without choosing. The map point stands at Nuba, a village about 11 km north-west of Hebron, whose name is close; some take it for Nob, the priests' town near Jerusalem, which reappears among the towns of Benjamin in Nehemiah; and a few think the lists mean the Moabite Nebo after all. Nothing has been found that settles it, and nothing more is known of the fifty-two."
  ru:
    - "Это Нево — город Иудеи или Вениамина, известный только по спискам вернувшихся из Вавилона: «уроженцев Нево пятьдесят два», а у Неемии — «Жителей Нево другого пятьдесят два». Слово «другого», по-видимому, отличает его от более известного Нево Моавитского, о котором есть отдельная статья. В обоих списках он стоит среди городов к северу и западу от Иерусалима, после Вефиля и Гая, и только это помогает его искать."
    - "Карта даёт три ответа, не выбирая между ними. Точка на карте стоит у Нубы, селения примерно в 11 км к северо-западу от Хеврона, чьё имя созвучно; некоторые считают его Номвой, городом священников близ Иерусалима, который снова появляется среди городов Вениамина у Неемии; а немногие думают, что списки всё же говорят о Нево Моавитском. Ничего решающего не найдено, и больше о пятидесяти двух ничего не известно."
  uk:
    - "Це Нево — місто Юди або Веніяміна, відоме лише зі списків вигнанців, що повернулися з Вавилона: «…родом з Нево, пятьдесять два», а в Неемії — «Осадників другого Нево пятьдесять два». Слово «другого» в Неемії, схоже, відрізняє його від відомішого моавського Нево, якому присвячена окрема стаття. В обох списках воно стоїть серед міст на північ і захід від Єрусалима, після Бет-Ела та Гая, і лише це скеровує його пошуки."
    - "Карта подає три відповіді, не обираючи між ними. Позначка на карті стоїть у Нубі, селі приблизно за 11 км на північний захід від Хеврона, чия назва близька; дехто вважає його Нобом, містом священиків біля Єрусалима, яке знову з'являється серед міст Веніяміна в Неемії; а деякі думають, що списки все-таки мають на увазі моавське Нево. Нічого, що б розв'язало питання, не знайдено, і про цих п'ятдесят двох нічого більше не відомо."
  es:
    - "Este Nebo es una ciudad de Judá o de Benjamín conocida solo por las listas de los exiliados que volvieron de Babilonia: «Los hijos de Nebo, cincuenta y dos», y en Nehemías «Los varones de la otra Nebo, cincuenta y dos». «La otra» parece distinguirla del Nebo de Moab, más conocido, que tiene su propio artículo. En ambas listas figura entre ciudades al norte y al oeste de Jerusalén, después de Betel y Hai, y eso es todo lo que orienta su búsqueda."
    - "El mapa da tres respuestas sin elegir ninguna. El punto del mapa está en Nuba, una aldea a unos 11 km al noroeste de Hebrón, cuyo nombre es cercano; algunos la toman por Nob, la ciudad de los sacerdotes cerca de Jerusalén, que reaparece entre las ciudades de Benjamín en Nehemías; y unos pocos piensan que las listas se refieren al fin y al cabo al Nebo moabita. No se ha hallado nada que lo resuelva, y no se sabe nada más de los cincuenta y dos."
  pt:
    - "Este Nebo é uma cidade de Judá ou de Benjamim, conhecida apenas pelas listas dos exilados que voltaram da Babilônia: “Os filhos de Nebo, cinquenta e dois”, e em Neemias “Os homens do outro Nebo: cinquenta e dois”. “O outro” parece distingui-la do Nebo de Moabe, mais conhecido, que tem artigo próprio. Em ambas as listas ela aparece entre cidades ao norte e a oeste de Jerusalém, depois de Betel e Ai, o que é tudo o que orienta a busca."
    - "O mapa dá três respostas sem escolher. O ponto do mapa fica em Nuba, aldeia a cerca de 11 km a noroeste de Hebrom, cujo nome é próximo; alguns a tomam por Nobe, a cidade sacerdotal perto de Jerusalém, que reaparece entre as cidades de Benjamim em Neemias; e uns poucos pensam que as listas se referem, afinal, ao Nebo moabita. Nada se encontrou que resolva a questão, e nada mais se sabe dos cinquenta e dois."
  de:
    - "Dieses Nebo ist eine Stadt in Juda oder Benjamin, die nur aus den Listen der aus Babylon heimgekehrten Verbannten bekannt ist: „der Kinder von Nebo zweiundfünfzig“, und bei Nehemia „der Männer vom andern Nebo zweiundfünfzig“. „Das andere“ scheint es von dem bekannteren Nebo in Moab abzugrenzen, das einen eigenen Artikel hat. In beiden Listen steht es unter Orten nördlich und westlich von Jerusalem, nach Bethel und Ai; das ist alles, was die Suche leitet."
    - "Die Karte nennt drei Antworten, ohne sich zu entscheiden. Der Kartenpunkt liegt bei Nuba, einem Dorf etwa 11 km nordwestlich von Hebron, dessen Name nahekommt; manche halten es für Nob, die Priesterstadt bei Jerusalem, die bei Nehemia wieder unter den Städten Benjamins auftaucht; und einige meinen, die Listen bezeichneten doch das moabitische Nebo. Nichts Gefundenes entscheidet die Frage, und über die zweiundfünfzig ist nichts weiter bekannt."
  fr:
    - "Ce Nebo est une ville de Juda ou de Benjamin connue seulement par les listes des exilés revenus de Babylone : « les fils de Nebo, cinquante-deux », et chez Néhémie « les gens de l’autre Nebo, cinquante-deux ». « L’autre » semble le distinguer du Nebo de Moab, mieux connu, qui a son propre article. Dans les deux listes, il figure parmi des villes au nord et à l’ouest de Jérusalem, après Béthel et Aï, ce qui est tout ce qui guide sa recherche."
    - "La carte donne trois réponses sans choisir. Le point de la carte est à Nuba, village à environ 11 km au nord-ouest d’Hébron, dont le nom est proche ; certains y voient Nob, la ville des prêtres près de Jérusalem, qui reparaît parmi les villes de Benjamin chez Néhémie ; et quelques-uns pensent que les listes désignent malgré tout le Nebo de Moab. Rien n’a été trouvé qui tranche, et l’on ne sait rien de plus des cinquante-deux."
  it:
    - "Questo Nebo è una città di Giuda o di Beniamino nota solo dagli elenchi degli esuli tornati da Babilonia: «I figliuoli di Nebo, cinquantadue», e in Neemia «Uomini d’un altro Nebo, cinquantadue». «Un altro» sembra distinguerlo dal più noto Nebo di Moab, che ha un articolo a parte. In entrambi gli elenchi compare tra città a nord e a ovest di Gerusalemme, dopo Betel e Ai, ed è tutto ciò che guida la ricerca."
    - "La mappa dà tre risposte senza sceglierne una. Il punto sulla mappa si trova a Nuba, un villaggio circa 11 km a nord-ovest di Ebron, il cui nome è vicino; alcuni lo identificano con Nob, la città dei sacerdoti presso Gerusalemme, che ricompare tra le città di Beniamino in Neemia; e pochi pensano che gli elenchi intendano comunque il Nebo moabita. Non è stato trovato nulla che risolva la questione, e dei cinquantadue non si sa altro."
  pl:
    - "To Nebo jest miastem Judy lub Beniamina, znanym tylko z list wygnańców, którzy wrócili z Babilonu: „Synów z Nebo pięćdziesiąt i dwa”, a u Nehemiasza „Mężów z Nebo drugiego pięćdziesiąt i dwa”. Słowo „drugiego” zdaje się odróżniać je od lepiej znanego Nebo w Moabie, któremu poświęcono osobny artykuł. W obu listach stoi ono wśród miast na północ i zachód od Jerozolimy, po Betel i Aj, i tylko to wskazuje kierunek poszukiwań."
    - "Mapa podaje trzy odpowiedzi, nie rozstrzygając. Punkt na mapie leży w Nuba, wsi około 11 km na północny zachód od Hebronu, której nazwa jest bliska; niektórzy utożsamiają je z Nob, miastem kapłanów pod Jerozolimą, które u Nehemiasza powraca wśród miast Beniamina; a nieliczni sądzą, że listy mają jednak na myśli moabickie Nebo. Nie znaleziono niczego, co by to rozstrzygało, i nic więcej nie wiadomo o owych pięćdziesięciu dwóch."
  cs:
    - "Toto Nebo je město v Judsku nebo v Benjamínu, známé jen ze seznamů vyhnanců, kteří se vrátili z Babylóna: „Synů z Nébo padesáte dva“, a u Nehemjáše „Mužů z Nébo druhého padesáte dva“. „Druhého“ zřejmě odlišuje toto místo od známějšího Neba v Moábu, které má vlastní článek. V obou seznamech stojí mezi městy severně a západně od Jeruzaléma, po Bét-elu a Aji, což je vše, čím se hledání řídí."
    - "Mapa podává tři odpovědi, aniž si vybírá. Bod na mapě stojí u Nuby, vesnice asi 11 km severozápadně od Hebronu, jejíž jméno je blízké; někteří je pokládají za Nob, město kněží poblíž Jeruzaléma, které se u Nehemjáše znovu objevuje mezi městy Benjamínovými; a několik jich soudí, že seznamy mají přece jen na mysli moábské Nebo. Nic nebylo nalezeno, co by věc rozhodlo, a o oněch padesáti dvou se nic víc neví."
  nl:
    - "Deze Nebo is een stad van Juda of Benjamin die alleen bekend is uit de lijsten van de ballingen die uit Babylon terugkeerden: “De kinderen van Nebo, twee en vijftig”, en bij Nehemia “De mannen van het andere Nebo, twee en vijftig”. “Het andere” lijkt haar te onderscheiden van het bekendere Nebo van Moab, dat een eigen artikel heeft. In beide lijsten staat zij tussen steden ten noorden en westen van Jeruzalem, na Bethel en Ai, en dat is alles wat de zoektocht naar haar leidt."
    - "De kaart geeft drie antwoorden zonder te kiezen. Het kaartpunt staat bij Nuba, een dorp zo’n 11 km ten noordwesten van Hebron, waarvan de naam dichtbij komt; sommigen houden haar voor Nob, de priesterstad bij Jeruzalem, die bij Nehemia opnieuw opduikt onder de steden van Benjamin; en enkelen menen dat de lijsten toch het Moabitische Nebo bedoelen. Er is niets gevonden dat de kwestie beslecht, en over de tweeënvijftig is verder niets bekend."
  sv:
    - "Detta Nebo är en stad i Juda eller Benjamin som bara är känd från förteckningarna över de landsflyktiga som återvände från Babylon: ”Nebos barn: femtiotvå”, och hos Nehemja ”männen från det andra Nebo: femtiotvå”. ”Det andra” tycks skilja det från det bättre kända Nebo i Moab, som har en egen artikel. I båda förteckningarna står det bland städer norr och väster om Jerusalem, efter Betel och Ai, vilket är allt som vägleder sökandet efter det."
    - "Kartan ger tre svar utan att välja. Kartpunkten står vid Nuba, en by cirka 11 km nordväst om Hebron, vars namn ligger nära; några tar det för Nob, prästernas stad nära Jerusalem, som återkommer bland Benjamins städer hos Nehemja; och några få tror att förteckningarna ändå avser Moabs Nebo. Ingenting har hittats som avgör saken, och ingenting mer är känt om de femtiotvå."
