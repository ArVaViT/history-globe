# Overview article (ADR 0007). Mainstream facts only; the Nebo of the return lists, not the Moabite town; the site is unknown and the candidates on the map are given without choosing.
id: nebo-judah
place: accdd09
title:
  en: "Nebo"
  ru: "Нево"
body:
  en:
    - "This Nebo is a town of Judah or Benjamin known only from the lists of exiles who returned from Babylon: “The children of Nebo, fifty and two”, and in Nehemiah “The men of the other Nebo, fifty and two”. “The other” seems to set it apart from the better-known Nebo of Moab, which has its own article. In both lists it stands among towns north and west of Jerusalem, after Bethel and Ai, which is all that guides the search for it."
    - "The map gives three answers without choosing. The map point stands at Nuba, a village about 11 km north-west of Hebron, whose name is close; some take it for Nob, the priests' town near Jerusalem, which reappears among the towns of Benjamin in Nehemiah; and a few think the lists mean the Moabite Nebo after all. Nothing has been found that settles it, and nothing more is known of the fifty-two."
  ru:
    - "Это Нево — город Иудеи или Вениамина, известный только по спискам вернувшихся из Вавилона: «уроженцев Нево пятьдесят два», а у Неемии — «Жителей Нево другого пятьдесят два». Слово «другого», по-видимому, отличает его от более известного Нево Моавитского, о котором есть отдельная статья. В обоих списках он стоит среди городов к северу и западу от Иерусалима, после Вефиля и Гая, и только это помогает его искать."
    - "Карта даёт три ответа, не выбирая между ними. Точка на карте стоит у Нубы, селения примерно в 11 км к северо-западу от Хеврона, чьё имя созвучно; некоторые считают его Номвой, городом священников близ Иерусалима, который снова появляется среди городов Вениамина у Неемии; а немногие думают, что списки всё же говорят о Нево Моавитском. Ничего решающего не найдено, и больше о пятидесяти двух ничего не известно."
scripture:
  - Ezra.2.29
  - Neh.7.33
  - Neh.11.32
sources:
