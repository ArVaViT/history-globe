body:
  en:
    - "Me-jarkon, “the waters of the Yarkon”, is named in the list of Dan's towns near the coast: “And Me-jarkon, and Rakkon, with the border before Japho.” It is taken to be the Yarkon River, Arabic al-Auja, “the meandering one”, at 27.5 km the largest coastal river of Israel, which rises in the springs at Tel Afek, the Aphek and Antipatris of the Bible, north of Petah Tikva, and flows west through Tel Aviv to the Mediterranean, and it probably marked the northern edge of the land assigned to Dan."
    - "The Yarkon was a frontier for much of antiquity, often taken as the northern limit of Philistine territory. On its northern bank, within today's Tel Aviv, stood Tell Qasile, a port town founded by the Philistines in the twelfth century BC; Benjamin Mazar excavated it in 1948–1950 and Amihai Mazar in 1971–1974 and again from 1982, uncovering a sanctuary of three Philistine temples built one upon another, the first of plastered mud brick, the next with stone walls. The river was heavily polluted after the 1950s and has since been partly restored; its lower course runs through Tel Aviv's Yarkon Park."
  ru:
    - "Ме-Иаркон, «воды Яркона», назван в списке городов Дана у побережья: «Ме-Иаркон и Ракон с пределом близ Иоппии». Его понимают как реку Яркон, по-арабски эль-Ауджа, «извилистая», — с длиной 27,5 км крупнейшую прибрежную реку Израиля, которая начинается у источников при Тель-Афеке, библейских Афеке и Антипатриде, к северу от Петах-Тиквы, и течёт на запад через Тель-Авив к Средиземному морю; вероятно, она отмечала северный край земли, отданной Дану."
    - "Большую часть древности Яркон был рубежом, его часто считают северной границей филистимской земли. На его северном берегу, в черте нынешнего Тель-Авива, стоял Телль-Касиле — портовый город, основанный филистимлянами в XII в. до н. э.; Беньямин Мазар раскапывал его в 1948–1950 гг., а Амихай Мазар — в 1971–1974 гг. и снова с 1982 г., открыв святилище из трёх филистимских храмов, построенных один на другом: первый — из оштукатуренного сырцового кирпича, следующий — со стенами из камня. После 1950-х гг. река была сильно загрязнена и с тех пор частично очищена; её нижнее течение проходит через тель-авивский парк Яркон."
  uk:
    - "Ме-Яркон, «води Яркона», названий у переліку міст Дана біля узбережжя: «Ме-Яркон і Раккон вкупі з займищем проти Йоппії». Його вважають річкою Яркон, арабською аль-Ауджа, «звивиста», довжиною 27,5 км найбільшою прибережною річкою Ізраїлю, яка бере початок із джерел у Тель-Афеку, біблійних Афеку й Антипатриди, на північ від Петах-Тікви, і тече на захід через Тель-Авів до Середземного моря, і, імовірно, позначала північний край землі, відведеної Данові."
    - "Яркон був межею значну частину давнини, його часто вважали північною межею филистимської території. На його північному березі, у межах нинішнього Тель-Авіва, стояв Телль-Касіле, портове місто, засноване филистимлянами в XII ст. до н. е.; Бенджамін Мазар розкопував його в 1948–1950 рр., Аміхай Мазар — у 1971–1974 рр. і знову від 1982 р., виявивши святилище з трьох филистимських храмів, збудованих один на одному: перший із потинькованої сирцевої цегли, наступний із кам'яними стінами. Після 1950-х рр. річка була сильно забруднена, а відтоді її частково відновили; її нижня течія проходить через парк Яркон у Тель-Авіві."
  es:
    - "Me-jarcón, «las aguas del Yarkon», se nombra en la lista de las ciudades de Dan cerca de la costa: «Y Mejarcón, y Raccón, con el término que está delante de Joppa». Se entiende que es el río Yarkon, en árabe al-Auja, «el sinuoso», que con sus 27,5 km es el mayor río costero de Israel, nace en los manantiales de Tel Afek, la Afec y Antípatris de la Biblia, al norte de Petah Tikva, y fluye hacia el oeste atravesando Tel Aviv hasta el Mediterráneo, y probablemente marcaba el límite septentrional de la tierra asignada a Dan."
    - "El Yarkon fue una frontera durante buena parte de la Antigüedad, a menudo tomada como el límite septentrional del territorio filisteo. En su orilla norte, dentro de la actual Tel Aviv, se alzaba Tell Qasile, ciudad portuaria fundada por los filisteos en el siglo XII a. C.; Benjamin Mazar la excavó en 1948–1950 y Amihai Mazar en 1971–1974 y de nuevo desde 1982, y sacó a la luz un santuario de tres templos filisteos construidos uno sobre otro, el primero de adobe revocado, el siguiente con muros de piedra. El río quedó muy contaminado tras la década de 1950 y desde entonces ha sido restaurado en parte; su curso bajo atraviesa el Parque Yarkon de Tel Aviv."
  pt:
    - "Me-Jarcom, “as águas do Yarkon”, é nomeada na lista das cidades de Dã perto da costa: “Me-Jarcom e Racom, com a fronteira defronte de Jope.” É tomada pelo rio Yarkon, em árabe al-Auja, “o sinuoso”, que, com 27,5 km, é o maior rio costeiro de Israel, nasce nas fontes de Tel Afek, a Afeque e Antipátris da Bíblia, ao norte de Petah Tikva, e corre para o oeste, passando por Tel Aviv, até o Mediterrâneo, e provavelmente marcava o limite norte da terra atribuída a Dã."
    - "O Yarkon foi uma fronteira durante boa parte da Antiguidade, muitas vezes tomado como o limite norte do território filisteu. Em sua margem norte, dentro da atual Tel Aviv, ficava Tell Qasile, uma cidade portuária fundada pelos filisteus no século XII a.C.; Benjamin Mazar a escavou em 1948–1950 e Amihai Mazar em 1971–1974 e de novo a partir de 1982, revelando um santuário de três templos filisteus construídos um sobre o outro, o primeiro de tijolo de barro rebocado, o seguinte com muros de pedra. O rio foi muito poluído depois da década de 1950 e desde então foi em parte recuperado; seu curso inferior atravessa o Parque Yarkon, de Tel Aviv."
  de:
    - "Me-Jarkon, „die Wasser des Jarkon“, wird in der Liste der Städte Dans nahe der Küste genannt: „Me-Jarkon, Rakkon mit den Grenzen gegen Japho.“ Man hält es für den Fluss Jarkon, arabisch al-Audscha, „der Gewundene“, mit 27,5 km den größten Küstenfluss Israels, der in den Quellen bei Tel Afek, dem Afek und Antipatris der Bibel, nördlich von Petach Tikwa entspringt und nach Westen durch Tel Aviv zum Mittelmeer fließt, und er bildete wohl den nördlichen Rand des Dan zugewiesenen Landes."
    - "Der Jarkon war über lange Zeit der Antike eine Grenze, oft als Nordgrenze des philistäischen Gebiets angesehen. An seinem Nordufer, im heutigen Tel Aviv, lag Tell Qasile, eine im zwölften Jahrhundert v. Chr. von den Philistern gegründete Hafenstadt; Benjamin Mazar grub sie 1948–1950 aus und Amihai Mazar 1971–1974 und wieder ab 1982 und legte ein Heiligtum aus drei übereinander gebauten philistäischen Tempeln frei, den ersten aus verputztem Lehmziegel, den nächsten mit Steinmauern. Der Fluss wurde nach den 1950er Jahren stark verschmutzt und ist seither teilweise saniert worden; sein Unterlauf führt durch den Jarkon-Park von Tel Aviv."
  it:
    - "Me-Iarkon, «le acque dello Yarkon», è nominata nell’elenco delle città di Dan vicino alla costa: «Me-Iarkon e Rakkon col territorio dirimpetto a Iafo». È ritenuta il fiume Yarkon, in arabo al-Auja, «il tortuoso», con i suoi 27,5 km il maggiore fiume costiero di Israele, che nasce dalle sorgenti di Tel Afek, l’Afek e Antipatride della Bibbia, a nord di Petah Tikva, e scorre verso ovest attraverso Tel Aviv fino al Mediterraneo, e probabilmente segnava il limite settentrionale della terra assegnata a Dan."
    - "Lo Yarkon fu una frontiera per gran parte dell’antichità, spesso considerata il limite settentrionale del territorio filisteo. Sulla sua riva settentrionale, all’interno dell’odierna Tel Aviv, sorgeva Tell Qasile, una città portuale fondata dai Filistei nel XII secolo a.C.; Benjamin Mazar la scavò nel 1948–1950 e Amihai Mazar nel 1971–1974 e di nuovo dal 1982, portando alla luce un santuario di tre templi filistei costruiti uno sull’altro, il primo di mattoni crudi intonacati, il successivo con muri di pietra. Il fiume fu pesantemente inquinato dopo gli anni Cinquanta e da allora è stato in parte risanato; il suo corso inferiore attraversa lo Yarkon Park di Tel Aviv."
  fr:
    - "Me-Jarkon, « les eaux du Yarkon », est nommé dans la liste des villes de Dan près de la côte : « Mé-Jarkon et Rakkon, avec le territoire vis-à-vis de Japho. » On y voit le fleuve Yarkon, en arabe al-Auja, « le sinueux », qui avec 27,5 km est le plus grand fleuve côtier d’Israël, naît aux sources de Tel Afek, l’Aphek et Antipatris de la Bible, au nord de Petah Tikva, et coule vers l’ouest à travers Tel-Aviv jusqu’à la Méditerranée, et il marquait probablement la limite nord du pays attribué à Dan."
    - "Le Yarkon fut une frontière durant une bonne part de l’Antiquité, souvent tenu pour la limite nord du territoire philistin. Sur sa rive nord, dans l’actuelle Tel-Aviv, se dressait Tell Qasile, ville portuaire fondée par les Philistins au XIIe siècle av. J.-C. ; Benjamin Mazar la fouilla en 1948–1950 et Amihai Mazar en 1971–1974 puis dès 1982, mettant au jour un sanctuaire de trois temples philistins bâtis les uns sur les autres, le premier en briques crues enduites, le suivant avec des murs de pierre. Le fleuve fut très pollué après les années 1950 et a depuis été en partie restauré ; son cours inférieur traverse le parc Yarkon de Tel-Aviv."
  nl:
    - "Me-Jarkon, ‘de wateren van de Jarkon’, wordt genoemd in de lijst van Dans steden bij de kust: “En Me-Jarkon, en Rakkon, met de landpale tegenover Jafo.” Het wordt opgevat als de rivier de Jarkon, Arabisch al-Auja, ‘de kronkelende’, met 27,5 km de grootste kustrivier van Israël, die ontspringt in de bronnen bij Tel Afek, het Afek en Antipatris van de Bijbel, ten noorden van Petah Tikva, en westwaarts door Tel Aviv naar de Middellandse Zee stroomt, en zij markeerde waarschijnlijk de noordrand van het aan Dan toegewezen land."
    - "De Jarkon was een groot deel van de oudheid een grens, vaak opgevat als de noordgrens van het Filistijnse gebied. Op de noordoever, binnen het huidige Tel Aviv, lag Tell Qasile, een havenstad die de Filistijnen in de twaalfde eeuw v.Chr. stichtten; Benjamin Mazar groef er in 1948–1950 en Amihai Mazar in 1971–1974 en opnieuw vanaf 1982, en bracht een heiligdom aan het licht van drie Filistijnse tempels die op elkaar waren gebouwd, de eerste van gepleisterde leemsteen, de volgende met stenen muren. De rivier werd na de jaren vijftig zwaar vervuild en is sindsdien gedeeltelijk hersteld; haar benedenloop loopt door het Yarkon Park van Tel Aviv."
  cs:
    - "Me-jarkon, „vody Jarkonu“, je uvedeno v seznamu měst Danových blízko pobřeží: „Mehaiarkon a Rakon s pomezím, kteréž jest naproti Joppe.“ Pokládá se za řeku Jarkon, arabsky al-Audža, „klikatá“, s délkou 27,5 km největší pobřežní řeku Izraele, která pramení v pramenech u Tel Afek, biblického Afeku a Antipatridy, severně od Petach Tikvy, a teče na západ přes Tel Aviv do Středozemního moře, a pravděpodobně vyznačovala severní okraj země přidělené Danovi."
    - "Jarkon byl po většinu starověku hranicí, často pokládanou za severní mez pelištejského území. Na jeho severním břehu, v dnešním Tel Avivu, stálo Tell Kasile, přístavní město založené Pelištejci ve dvanáctém století př. n. l.; Benjamin Mazar je zkoumal v letech 1948–1950 a Amihai Mazar v letech 1971–1974 a znovu od roku 1982 a odkryl svatyni ze tří pelištejských chrámů postavených na sobě, první z omítnuté nepálené cihly, další s kamennými zdmi. Řeka byla po 50. letech silně znečištěna a od té doby byla zčásti obnovena; její dolní tok protéká Parkem Jarkon v Tel Avivu."
  pl:
    - "Me-Jarkon, „wody Jarkonu”, jest wymienione na liście miast Dana w pobliżu wybrzeża: „I Mehajarkon, i Rakon z granicą przeciwko Joppie”. Uważa się je za rzekę Jarkon, arabskie al-Audża, „kręta”, o długości 27,5 km największą rzekę przybrzeżną Izraela, która wypływa ze źródeł w Tel Afek, biblijnym Afek i Antypatris, na północ od Petach Tikwy, i płynie na zachód przez Tel Awiw do Morza Śródziemnego, i prawdopodobnie wyznaczała północny skraj ziemi przydzielonej Danowi."
    - "Jarkon był granicą przez znaczną część starożytności, często uważaną za północną granicę ziem filistyńskich. Na jego północnym brzegu, w obrębie dzisiejszego Tel Awiwu, stało Tell Kasile, port założony przez Filistynów w XII w. p.n.e.; Benjamin Mazar badał go w latach 1948-1950, a Amihai Mazar w latach 1971-1974 i ponownie od 1982, odsłaniając sanktuarium trzech filistyńskich świątyń zbudowanych jedna na drugiej, pierwsza z tynkowanej cegły mułowej, następna z murami kamiennymi. Rzeka była silnie zanieczyszczona po latach pięćdziesiątych XX wieku i została od tego czasu częściowo odtworzona; jej dolny bieg przebiega przez park Jarkon w Tel Awiwie."
  sv:
    - "Me-Hajarkon, ”Yarkons vatten”, nämns i förteckningen över Dans städer nära kusten: ”Me-Hajarkon och Harackon, tillika med området framför Jafo.” Det antas vara floden Yarkon, på arabiska al-Auja, ”den slingrande”, med 27,5 km Israels största kustflod, som har sitt ursprung i källorna vid Tel Afek, Bibelns Afek och Antipatris, norr om Petah Tikva, och rinner västerut genom Tel Aviv till Medelhavet, och den markerade sannolikt nordgränsen för det land som tilldelades Dan."
    - "Yarkon var en gräns under stora delar av antiken, ofta tagen som den filisteiska gränsen i norr. På dess norra strand, inom dagens Tel Aviv, låg Tell Qasile, en hamnstad grundad av filistéerna på 1100-talet f.Kr.; Benjamin Mazar grävde där 1948–1950 och Amihai Mazar 1971–1974 och åter från 1982, och fann en helgedom med tre filisteiska tempel byggda över varandra, det första av putsat lertegel, det nästa med stenmurar. Floden förorenades svårt efter 1950-talet och har sedan dess delvis återställts; dess nedre lopp går genom Yarkonparken i Tel Aviv."
  nb:
    - "Me-Jarkon, «Yarkons vann», er nevnt i listen over Dans byer nær kysten: «og Me-Hajarkon og Harakkon med bygdene bortimot Joppe.» Det regnes for å være elven Yarkon, arabisk al-Auja, «den buktende», med 27,5 km Israels største kystelv, som har sine kilder ved Tel Afek, Bibelens Afek og Antipatris, nord for Petah Tikva, og renner vestover gjennom Tel Aviv til Middelhavet, og den markerte trolig nordkanten av landet som var tildelt Dan."
    - "Yarkon var en grense i store deler av oldtiden, ofte regnet som nordgrensen for filisterområdet. På dens nordbredd, i dagens Tel Aviv, lå Tell Qasile, en havneby grunnlagt av filisterne på 1100-tallet f.Kr.; Benjamin Mazar gravde den ut i 1948–1950 og Amihai Mazar i 1971–1974 og igjen fra 1982, og avdekket en helligdom med tre filisterske templer bygget oppå hverandre, det første av pusset leirstein, det neste med steinmurer. Elven var sterkt forurenset etter 1950-årene og er siden delvis restaurert; dens nedre løp går gjennom Tel Avivs Yarkon-park."
  tl:
    - "Ang Me-jarcon, “ang tubig ng Yarkon”, ay pinangalanan sa talaan ng mga bayan ng Dan malapit sa baybayin: “At Me-jarcon, at Raccon pati ng hangganan sa tapat ng Joppa.” Itinuturing itong ilog Yarkon, sa Arabe ay al-Auja, “ang paliku-liko”, na may habang 27.5 km ang pinakamalaking ilog sa baybayin ng Israel, na nagmumula sa mga bukal sa Tel Afek, ang Aphec at Antipatris ng Biblia, sa hilaga ng Petah Tikva, at dumadaloy pakanluran sa Tel Aviv patungo sa Dagat Mediteraneo, at marahil ay tinandaan nito ang hilagang gilid ng lupaing itinakda sa Dan."
    - "Ang Yarkon ay hangganan sa karamihan ng sinaunang panahon, na madalas ituring na hilagang hangganan ng teritoryo ng mga Filisteo. Sa hilagang pampang nito, sa loob ng Tel Aviv ngayon, nakatayo ang Tell Qasile, isang bayang daungan na itinatag ng mga Filisteo noong ika-12 siglo BK; hinukay ito ni Benjamin Mazar noong 1948–1950 at ni Amihai Mazar noong 1971–1974 at muli mula 1982, na nakatuklas ng isang santuwaryo ng tatlong templong Filisteo na itinayo ang isa sa ibabaw ng isa, ang una ng plasterang laryong putik, ang sumunod ay may mga pader na bato. Lubhang narumihan ang ilog pagkatapos ng dekada 1950 at mula noon ay bahagyang naibalik; ang ibabang daloy nito ay dumadaan sa Yarkon Park ng Tel Aviv."
  da:
    - "Me-Jarkon, »Yarkons vande«, er nævnt i listen over Dans byer nær kysten: »og Me-Jarkon og Rakkon med det Landemærke tværs over for Jafo«. Det tages for at være floden Yarkon, arabisk al-Auja, »den bugtende«, med 27,5 km Israels største kystflod, der udspringer i kilderne ved Tel Afek, Bibelens Afek og Antipatris, nord for Petah Tikva, og flyder mod vest gennem Tel Aviv til Middelhavet, og den markerede sandsynligvis den nordlige kant af det land, der var tildelt Dan."
    - "Yarkon var en grænse i store dele af oldtiden, ofte taget for den nordlige grænse for filisternes område. På dens nordlige bred, inden for nutidens Tel Aviv, lå Tell Qasile, en havneby grundlagt af filisterne i 1100-tallet f.Kr.; Benjamin Mazar udgravede den i 1948–1950 og Amihai Mazar i 1971–1974 og igen fra 1982 og afdækkede en helligdom med tre filistertempler bygget oven på hinanden, det første af pudset lerstensmur, det næste med stenmure. Floden var stærkt forurenet efter 1950'erne og er siden delvis blevet genoprettet; dens nedre løb løber gennem Tel Avivs Yarkon Park."
scripture:
  - Josh.19.46
