body:
  en:
    - "Helbon was a wine country of the Anti-Lebanon, generally identified with Halbun, a village at the head of a fertile valley on the chalk slopes of the eastern Anti-Lebanon, about 20 km north-north-west of Damascus, where traces of old vineyard terraces remain; it lies today in the al-Tall district of the Rif Dimashq governorate of Syria."
    - "In Ezekiel's lament over Tyre, the trading partners of the city are listed one by one: “Damascus was thy merchant in the multitude of the wares of thy making, for the multitude of all riches; in the wine of Helbon, and white wool.” Babylonian texts of the same age speak of the land of Helbunim, from which Nebuchadnezzar received wine for sacrifices, and Strabo writes that the Persian kings had Chalybonian wine brought from Syria, often taken to be the wine of Helbon; Christie in the ISBE, however, warns against confusing Helbon with Chalybon, the Greek name of the district of Aleppo."
  ru:
    - "Хелбон — винодельческий край Антиливана, который обычно отождествляют с Халбуном, селением в верховьях плодородной долины на меловых склонах восточного Антиливана, примерно в 20 км к северо-северо-западу от Дамаска, где сохранились следы старых виноградных террас; сегодня это район Эт-Телль мухафазы Риф-Димашк в Сирии."
    - "В плаче Иезекииля о Тире торговые партнёры города перечислены один за другим: «Дамаск, по причине большого торгового производства твоего, по изобилию всякого богатства, торговал с тобою вином Хелбонским и белою шерстью». Вавилонские тексты того же времени говорят о стране Хелбуним, откуда Навуходоносор получал вино для жертвоприношений, а Страбон пишет, что персидские цари выписывали из Сирии халибонское вино, которое часто считают вином Хелбона; впрочем, Кристи в ISBE предостерегает от смешения Хелбона с Халибоном, греческим названием области Алеппо."
  de:
    - "Helbon war ein Weinland im Antilibanon, allgemein mit Halbun gleichgesetzt, einem Dorf am Kopf eines fruchtbaren Tals an den Kalkhängen des östlichen Antilibanon, etwa 20 km nordnordwestlich von Damaskus, wo Spuren alter Weinbergterrassen erhalten sind; es liegt heute im Bezirk at-Tall des Gouvernements Rif Dimaschq in Syrien."
    - "In Hesekiels Klage über Tyrus werden die Handelspartner der Stadt einzeln aufgezählt: „Dazu hat auch Damaskus bei dir geholt deine Arbeit und allerlei Ware um Wein von Helbon und köstliche Wolle.“ Babylonische Texte derselben Zeit sprechen vom Land Helbunim, aus dem Nebukadnezar Wein für Opfer erhielt, und Strabon schreibt, die persischen Könige hätten chalybonischen Wein aus Syrien bringen lassen, oft für den Wein von Helbon gehalten; Christie warnt in der ISBE jedoch davor, Helbon mit Chalybon zu verwechseln, dem griechischen Namen des Bezirks von Aleppo."
  fr:
    - "Helbon était un pays de vin de l’Anti-Liban, généralement identifié avec Halbun, village à la tête d’une vallée fertile sur les pentes calcaires de l’Anti-Liban oriental, à environ 20 km au nord-nord-ouest de Damas, où subsistent des traces de terrasses de vignes anciennes ; il se trouve aujourd’hui dans le district d’al-Tall, gouvernorat de Rif-Damas, en Syrie."
    - "Dans la lamentation d’Ézéchiel sur Tyr, les partenaires commerciaux de la ville sont énumérés un à un : « Damas trafiquait avec toi, à cause du grand nombre de tes produits, à cause de tous les biens que tu avais en abondance ; elle te fournissait du vin de Helbon et de la laine blanche. » Des textes babyloniens de la même époque parlent du pays de Helbunim, d’où Nebucadnetsar recevait du vin pour les sacrifices, et Strabon écrit que les rois perses faisaient venir de Syrie du vin chalybonien, souvent tenu pour le vin de Helbon ; Christie, dans l’ISBE, met toutefois en garde contre la confusion de Helbon avec Chalybon, nom grec du district d’Alep."
  pt:
    - "Helbom era uma região vinícola do Antilíbano, geralmente identificada com Halbun, uma aldeia na cabeceira de um vale fértil nas encostas calcárias do Antilíbano oriental, cerca de 20 km a norte-noroeste de Damasco, onde restam vestígios de antigos terraços de vinhedos; fica hoje no distrito de al-Tall, na governadoria de Rif Damasco, na Síria."
    - "No lamento de Ezequiel sobre Tiro, os parceiros comerciais da cidade são listados um a um: “Damasco era a sua mercadora pela multidão das suas obras, por causa da multidão de todos os tipos de riquezas, com o vinho de Helbom e lã branca.” Textos babilônicos da mesma época falam da terra de Helbunim, de onde Nabucodonosor recebia vinho para sacrifícios, e Estrabão escreve que os reis persas faziam trazer da Síria vinho calibônio, muitas vezes tomado pelo vinho de Helbom; Christie, na ISBE, porém, adverte contra confundir Helbom com Calibon, o nome grego do distrito de Alepo."
  it:
    - "Chelbon era una terra di vino dell’Antilibano, identificata in genere con Halbun, un villaggio in cima a una valle fertile sui pendii calcarei dell’Antilibano orientale, a circa 20 km a nord-nord-ovest di Damasco, dove restano tracce di antichi terrazzamenti di vigneti; si trova oggi nel distretto di al-Tall del governatorato siriano di Rif Dimashq."
    - "Nel lamento di Ezechiele su Tiro sono elencati uno per uno i partner commerciali della città: «Damasco commercia teco, scambiando i tuoi numerosi prodotti con abbondanza d’ogni sorta di beni, con vino di Helbon e con lana candida». Testi babilonesi della stessa epoca parlano del paese degli Helbunim, da cui Nabucodonosor riceveva vino per i sacrifici, e Strabone scrive che i re persiani si facevano portare dalla Siria vino calibonio, spesso ritenuto il vino di Chelbon; Christie, nella ISBE, avverte tuttavia di non confondere Chelbon con Calibone, il nome greco del distretto di Aleppo."
  nl:
    - "Chelbon was een wijnland van de Anti-Libanon, algemeen vereenzelvigd met Halbun, een dorp aan het hoofd van een vruchtbare vallei op de kalkhellingen van de oostelijke Anti-Libanon, ongeveer 20 km noord-noordwestelijk van Damascus, waar sporen van oude wijnbouwterrassen resten; het ligt tegenwoordig in het district al-Tall van het gouvernement Rif Dimashq in Syrië."
    - "In Ezechiëls klaagzang over Tyrus worden de handelspartners van de stad een voor een opgesomd: “Damaskus dreef koophandel met u, om de veelheid uwer werken, vanwege de veelheid van allerlei goed; met wijn van Chelbon en witte wol.” Babylonische teksten uit dezelfde tijd spreken van het land Chelbunim, vanwaar Nebukadnessar wijn voor offers ontving, en Strabo schrijft dat de Perzische koningen Chalybonische wijn uit Syrië lieten komen, vaak opgevat als de wijn van Chelbon; Christie waarschuwt in de ISBE echter tegen verwarring van Chelbon met Chalybon, de Griekse naam van het district Aleppo."
  pl:
    - "Chelbon było krainą winną Antylibanu, utożsamianą zwykle z Chalbun, wsią u początku żyznej doliny na kredowych stokach wschodniego Antylibanu, około 20 km na północny zachód od Damaszku, gdzie zachowały się ślady dawnych tarasów winnic; leży dziś w dystrykcie al-Tall w muhafazie Rif Dimaszk w Syrii."
    - "W lamencie Ezechiela nad Tyrem handlowi partnerzy miasta są wyliczani jeden po drugim: „Damaszczanie, kupcy twoi dla mnóstwa przemyślnych robót twoich, i dla mnóstwa wszelkich dostatków, winem z Helbonu i wełnę białą kupczyli”. Teksty babilońskie z tego samego czasu mówią o ziemi Helbunim, skąd Nabuchodonozor otrzymywał wino na ofiary, a Strabon pisze, że królowie perscy kazali sprowadzać z Syrii wino chalybońskie, często uważane za wino z Chelbonu; Christie w ISBE przestrzega jednak przed mieszaniem Chelbonu z Chalybon, greckim imieniem okręgu Aleppo."
  uk:
    - "Хелбон був винною країною Антилібану, яку зазвичай ототожнюють з Хальбуном, селом на чолі родючої долини на крейдових схилах східного Антилібану, приблизно за 20 км на північ-північний захід від Дамаска, де лишилися сліди давніх виноградних терас; нині він лежить у районі аль-Талль мухафази Ріф-Дімашк у Сирії."
    - "В оплакуванні Тіра в Єзекіїля торгових партнерів міста перелічено одного за одним: «Дамаск торгував із тобою задля великої добірностї виробів твоїх і достатків твоїх Хельбонським вином і білою вовною». Вавилонські тексти тієї самої доби говорять про країну Хелбуним, звідки Навуходоносор отримував вино для жертвоприношень, а Страбон пише, що перські царі привозили з Сирії халібонське вино, яке часто вважають вином Хелбона; Крісті в ISBE, однак, застерігає від змішування Хелбона з Халібоном, грецькою назвою області Алеппо."
  cs:
    - "Chelbon byla vinařská země Antilibanonu, obecně ztotožňovaná s Halbúnem, vesnicí na horním konci úrodného údolí na křídových svazích východního Antilibanonu, asi 20 km severo-severozápadně od Damašku, kde zůstaly stopy starých vinicových teras; leží dnes v okrese at-Tall v guvernorátu Rif Dimašk v Sýrii."
    - "V Ezechielově žalozpěvu nad Týrem jsou obchodní partneři města vyjmenováni jeden po druhém: „Damašští kupci tvoji, pro množství věcí tvých řemeslně udělaných, kupčili ve množství všelijakého zboží, ve víně Chelbonském a vně bělostkvoucí.“ Babylonské texty téže doby mluví o zemi Helbunim, z níž Nebukadnesar dostával víno k obětem, a Strabón píše, že perští králové dávali dovážet chalybónské víno ze Sýrie, což se často pokládá za víno z Chelbonu; Christie však v ISBE varuje před směšováním Chelbonu s Chalybónem, řeckým jménem aleppského okresu."
  es:
    - "Helbón era una región vinícola del Antilíbano, identificada por lo general con Halbun, una aldea en la cabecera de un valle fértil en las laderas calizas del Antilíbano oriental, a unos 20 km al nornoroeste de Damasco, donde quedan restos de antiguas terrazas de viñedos; hoy se halla en el distrito de al-Tall de la gobernación siria de Rif Dimashq."
    - "En la lamentación de Ezequiel sobre Tiro se enumeran uno a uno los socios comerciales de la ciudad: «Damasco, tu mercadera por la multitud de tus labores, por la abundancia de todas riquezas, con vino de Helbón, y lana blanca». Textos babilonios de la misma época hablan de la tierra de Helbunim, de la que Nabucodonosor recibía vino para los sacrificios, y Estrabón escribe que los reyes persas hacían traer de Siria vino calibonio, que a menudo se toma por el vino de Helbón; Christie, en la ISBE, advierte sin embargo contra confundir Helbón con Calibón, el nombre griego del distrito de Alepo."
  sv:
    - "Helbon var ett vinland i Antilibanon, allmänt identifierat med Halbun, en by vid övre änden av en bördig dal på kalksluttningarna i östra Antilibanon, omkring 20 km nordnordväst om Damaskus, där spår av gamla vingårdsterrasser finns kvar; den ligger i dag i distriktet al-Tall i guvernementet Rif Dimashq i Syrien."
    - "I Hesekiels klagosång över Tyros räknas stadens handelspartner upp en efter en: ”Damaskus var din handelsvän, ty du var rik på konstarbeten, ja, på allt slags gods; de kommo med vin från Helbon och med ull från Sahar.” Babyloniska texter från samma tid talar om landet Helbunim, varifrån Nebukadnessar fick vin till offer, och Strabon skriver att de persiska kungarna lät hämta kalybonskt vin från Syrien, ofta tagit för Helbons vin; Christie i ISBE varnar dock för att förväxla Helbon med Chalybon, det grekiska namnet på Aleppos distrikt."
  nb:
    - "Helbon var et vinland i Anti-Libanon, vanligvis identifisert med Halbun, en landsby i den øvre enden av en fruktbar dal på kalkskråningene av det østlige Anti-Libanon, omtrent 20 km nord-nordvest for Damaskus, der spor av gamle vingårdsterrasser fortsatt finnes; den ligger i dag i al-Tall-distriktet i guvernementet Rif Dimashq i Syria."
    - "I Esekiels klagesang over Tyros regnes byens handelspartnere opp én for én: «Damaskus handlet med dig fordi du var rik på alle slags kunstarbeider, på allslags gods; de kom med vin fra Helbon og hvit ull.» Babylonske tekster fra samme tid taler om landet Helbunim, hvorfra Nebukadnesar fikk vin til ofre, og Strabon skriver at de persiske kongene lot hente kalybonsk vin fra Syria, ofte tatt for å være vinen fra Helbon; Christie i ISBE advarer likevel mot å forveksle Helbon med Chalybon, det greske navnet på distriktet Aleppo."
  tl:
    - "Ang Helbon ay lupaing alak ng Anti-Libano, karaniwang tinutukoy sa Halbun, isang nayon sa dulo ng mayabong na libis sa mga dalisdis na tisa ng silangang Anti-Libano, mga 20 km sa hilaga-hilagang-kanluran ng Damasco, kung saan nananatili ang bakas ng mga lumang taras ng ubasan; nasa ngayon ito sa distrito ng al-Tall ng gobernadorado ng Rif Dimashq ng Siria."
    - "Sa panaghoy ni Ezekiel sa Tiro, itinatala isa-isa ang mga katuwang sa kalakalan ng lungsod: “Mangangalakal mo ang Damasko dahil sa karamihan ng iyong mga gawang kamay, dahil sa karamihan ng sarisaring kayamanan, sangpu ng alak sa Helbon, at maputing lana.” Ang mga tekstong Babilonio ng parehong panahon ay nagsasalita tungkol sa lupain ng Helbunim, kung saan tumanggap si Nabucodonosor ng alak para sa mga hain, at isinulat ni Strabo na ipinadadala ng mga haring Persiano ang alak na Chalybonio mula sa Siria, na madalas ituring na alak ng Helbon; gayunman nagbabala si Christie sa ISBE laban sa pagkalito ng Helbon sa Chalybon, ang pangalang Griyego ng distrito ng Aleppo."
  da:
    - "Helbon var et vinland i Antilibanon, almindeligvis identificeret med Halbun, en landsby ved den øvre ende af en frugtbar dal på kalkskråningerne af det østlige Antilibanon, omkring 20 km nord-nordvest for Damaskus, hvor spor af gamle vinterrasser endnu er tilbage; den ligger i dag i al-Tall-distriktet i Rif Dimashq-guvernementet i Syrien."
    - "I Ezekiels klagesang over Tyrus opregnes byens handelspartnere én for én: »Damaskus handlede med dig, fordi du havde en Mangfoldighed af Arbejder, for Mangfoldigheden af alle Haande Gods, med Vin af Helbon og hvid Uld.« Babylonske tekster fra samme tid taler om landet Helbunim, hvorfra Nebukadnezar modtog vin til ofre, og Strabon skriver, at de persiske konger lod chalybonsk vin bringe fra Syrien, ofte antaget for Helbons vin; Christie advarer dog i ISBE mod at forveksle Helbon med Chalybon, det græske navn på Aleppo-distriktet."
  sr:
    - "Хелвон је био винородни крај Антиливана, који се обично поистовећује с Халбуном, селом на горњем крају плодне долине на кречњачким падинама источног Антиливана, око 20 км северо-северозападно од Дамаска, где су остали трагови старих винограда у терасама; данас лежи у округу Ел-Тал гувернората Риф Дамаск у Сирији."
    - "У Језекиљевом јадиковању над Тиром наводе се редом трговински партнери града: „Дамаск трговаше с тобом мноштвом дела твојих, мноштвом сваког блага, вином хелвонским и белом вуном.“ Вавилонски текстови истог доба говоре о земљи Хелбуним, из које је Навуходоносор добијао вино за жртве, а Страбон пише да су персијски цареви доносили халибонско вино из Сирије, што се често узима за вино Хелвона; Кристи у ISBE, међутим, упозорава да се Хелвон не меша са Халибоном, грчким именом области Алепа."
scripture:
  - Ezek.27.18
sources:
  - "W. M. Christie, 'Helbon', International Standard Bible Encyclopedia (1915) (Halbun, 13 miles NNW of Damascus, old vineyard terraces; records contemporary with Ezekiel: Nebuchadnezzar's sacrificial wine from the land of Helbunim; not Chalybon)"
  - "Wikipedia, 'Halboun' (al-Tall district, Rif Dimashq; identified there with the Chalybon of Strabo and Ptolemy)"
  - "Strabo, Geography 15.3.22 (the Persian kings sent for Chalybonian wine from Syria)"
