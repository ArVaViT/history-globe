# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the candidates (Jal'ad area south of the Jabbok, Suf or Tell el-Masfa north of it) are given without choosing one. Named mizpah-gilead because mizpah is the Mizpah of Benjamin.
id: mizpah-gilead
place: a0f8af9
title:
  en: "Mizpah of Gilead"
  ru: "Массифа Галаадская"
  uk: "Міцпа Гілеадська"
  es: "Mizpa de Galaad"
  pt: "Mispá de Gileade"
  de: "Mizpa in Gilead"
  fr: "Mitspa de Galaad"
  it: "Mizpa di Galaad"
  pl: "Mispa w Gileadzie"
  nl: "Mizpa in Gilead"
  cs: "Micpa Gileadská"
  sv: "Mispa i Gilead"
  nb: "Mispa i Gilead"
body:
  en:
    - "Mizpah of Gilead, “the watchtower”, was the town east of the Jordan where Israel gathered against the Ammonites and where Jephthah had his house; it is not the Mizpah of Benjamin where Samuel judged. The site is disputed. The map follows those who seek it near Khirbet Jal'ad (Jel'ad), south of the Jabbok near es-Salt, where the name of Gilead survives; some of them take it also for the Ramath-mizpeh of Joshua's list, and Khirbet er-Rasuni close by is also proposed. Others look north of the Jabbok, at the village of Suf or the small Tell el-Masfa near Jerash. Some connect the town with the heap of stones that Jacob and Laban raised as a witness and named Galeed and Mizpah, which is sought in the same hills."
    - "When the Ammonites “encamped in Gilead”, the Israelites “assembled themselves together, and encamped in Mizpeh” and looked for a leader. The elders of Gilead fetched the outlaw Jephthah from the land of Tob and the people made him head and captain, “and Jephthah uttered all his words before the LORD in Mizpeh”. He “passed over Gilead, and Manasseh, and passed over Mizpeh of Gilead, and from Mizpeh of Gilead he passed over unto the children of Ammon”, having vowed to offer up whatever first came out of his house to meet him on his return. He won, “and Jephthah came to Mizpeh unto his house, and, behold, his daughter came out to meet him with timbrels and with dances”. Hosea's “snare on Mizpah, and a net spread upon Tabor” may mean this Mizpah or the other."
    - "The town is not heard of again. Surface surveys at Khirbet Jal'ad found mostly Byzantine pottery and perhaps a little of the Iron Age, so the name may have moved there from an older site nearby. The candidates lie in the wooded hills of north-western Jordan, on either side of the Jabbok, in the country that was Gilead."
  ru:
    - "Массифа Галаадская, «сторожевая башня», — город за Иорданом, где Израиль собрался против Аммонитян и где был дом Иеффая; это не Массифа Вениаминова, где судил Самуил. Место спорно. Карта следует тем, кто ищет его у Хирбет-Джальада (Джельада) к югу от Иавока близ Эс-Салта, где сохранилось имя Галаада; некоторые из них видят здесь и Рамаф-Мицфу из списка книги Иисуса Навина, предлагают также соседний Хирбет-эр-Расуни. Другие ищут к северу от Иавока — у деревни Суф или на небольшом Телль-эль-Масфе близ Джераша. Иные связывают город с холмом из камней, который Иаков и Лаван сложили во свидетельство и назвали Галаад и Мицпа, — его ищут в тех же горах."
    - "Когда Аммонитяне «расположились станом в Галааде», сыны Израилевы собрались «и стали станом в Массифе» и искали вождя. Старейшины Галаадские привели изгнанника Иеффая из земли Тов, и народ поставил его начальником и вождём, «и Иеффай произнес все слова свои пред лицом Господа в Массифе». Он «прошел Галаад и Манассию, и прошел Массифу Галаадскую, и из Массифы Галаадской пошел к Аммонитянам», дав обет вознести во всесожжение то, что первым выйдет из ворот его дома навстречу ему. Он победил, «и пришел Иеффай в Массифу в дом свой, и вот, дочь его выходит навстречу ему с тимпанами и ликами». Упрёк Осии, что вы были «западнею в Массифе и сетью, раскинутою на Фаворе», может относиться к этой Массифе или к другой."
    - "Больше о городе не слышно. Обследования поверхности на Хирбет-Джальаде дали в основном византийскую керамику и, возможно, немного керамики железного века, так что имя могло перейти сюда с более древнего поселения поблизости. Все эти места лежат в лесистых горах северо-западной Иордании, по обе стороны Иавока, в краю, который был Галаадом."
  uk:
    - "Міцпа Гілеадська, «сторожова вежа», була містом на схід від Йордану, де Ізраїль збирався проти аммонійців і де мав свій дім Єфтай; це не Міцпа Веніяміна, де судив Самуїл. Місце спірне. Мапа слідує тим, хто шукає його поблизу Хірбет-Джалад (Джелад), на південь від Яббоку біля ес-Сальта, де зберігається назва Гілеаду; дехто з них вважає його також Рамат-Міцпе з переліку Ісуса Навина, пропонують також розташований поблизу Хірбет-ер-Расуні. Інші дивляться на північ від Яббоку, на село Суф або на малий Телль-ель-Масфа поблизу Джераша. Дехто пов’язує місто з купою каменів, яку Яків і Лаван поставили як свідчення й назвали Галлед і Міцпа, що її шукають у тих самих пагорбах."
    - "Коли аммонійці «отаборились у Галаадї», ізраїльтяни «Зібрались і сини Ізрайлеві та й отаборились під Массифою» і шукали вождя. Старші Гілеаду привели вигнанця Єфтая із землі Тов, і народ зробив його головою і гетьманом, «й принїс Ефтай усї свої бажання перед Господа в Массифі». Він «перейшов Галаад і Манассію, і перейшов через Массифу Галаадську, а з Массифи Галаадської двинув проти Аммонїїв», давши обітницю принести в жертву те, що першим вийде з його дому йому назустріч по поверненні. Він переміг, «Як же прийшов Ефтай в Массифу додому, аж виходить зустріч йому дочка його з музиками й танцями». «Западнею (людові) в Массифі, неначе сїттю, що на Таворі заставляють» в Осії може означати цю Міцпу або іншу."
    - "Про місто більше не чути. Поверхневі розвідки у Хірбет-Джаладі знайшли переважно візантійську кераміку і, можливо, трохи залізної доби, тож назва могла перейти туди зі старішого місця поблизу. Кандидати лежать у лісистих пагорбах північного заходу Йорданії, по обидва боки Яббоку, в краї, що був Гілеадом."
  es:
    - "Mizpa de Galaad, «la atalaya», era la ciudad al este del Jordán donde Israel se reunió contra los amonitas y donde Jefté tenía su casa; no es la Mizpa de Benjamín donde juzgó Samuel. El emplazamiento se discute. El mapa sigue a quienes la buscan cerca de Khirbet Jal'ad (Jel'ad), al sur del Jaboc, cerca de es-Salt, donde sobrevive el nombre de Galaad; algunos de ellos la toman también por la Ramat-mizpa de la lista de Josué, y también se propone Khirbet er-Rasuni, muy cerca. Otros miran al norte del Jaboc, a la aldea de Suf o al pequeño Tell el-Masfa, cerca de Jerash. Algunos relacionan la ciudad con el montón de piedras que Jacob y Labán levantaron como testimonio y llamaron Galaad y Mizpa, que se busca en las mismas colinas."
    - "Cuando los amonitas «asentaron campo en Galaad: juntáronse asimismo los hijos de Israel, y asentaron su campo en Mizpa»; buscaban un caudillo. Los ancianos de Galaad fueron a buscar al proscrito Jefté a la tierra de Tob y el pueblo lo hizo cabeza y príncipe, y «Jephté habló todas sus palabras delante de Jehová en Mizpa». «Pasó por Galaad y Manasés; y de allí pasó á Mizpa de Galaad; y de Mizpa de Galaad pasó á los hijos de Ammón», habiendo hecho voto de ofrecer lo primero que saliera de su casa a recibirlo a su regreso. Venció, y «volviendo Jephté á Mizpa á su casa, he aquí que su hija le salió á recibir con adufes y danzas». El «lazo en Mizpa, y red extendida sobre Tabor» de Oseas puede referirse a esta Mizpa o a la otra."
    - "De la ciudad no se vuelve a oír. Las prospecciones de superficie en Khirbet Jal'ad hallaron sobre todo cerámica bizantina y quizá un poco de la Edad del Hierro, de modo que el nombre pudo trasladarse allí desde un sitio más antiguo cercano. Los candidatos se hallan en las colinas boscosas del noroeste de Jordania, a ambos lados del Jaboc, en la región que fue Galaad."
  pt:
    - "Mispá de Gileade, “a torre de vigia”, era a cidade a leste do Jordão onde Israel se reuniu contra os amonitas e onde Jefté tinha sua casa; não é a Mispá de Benjamim onde Samuel julgou. O sítio é disputado. O mapa segue os que o procuram perto de Khirbet Jal'ad (Jel'ad), ao sul do Jaboque, perto de es-Salt, onde sobrevive o nome de Gileade; alguns deles a tomam também pela Ramate-Mispa da lista de Josué, e também se propõe Khirbet er-Rasuni, ali perto. Outros olham ao norte do Jaboque, na aldeia de Suf ou no pequeno Tell el-Masfa, perto de Jerasa. Alguns ligam a cidade ao montão de pedras que Jacó e Labã ergueram como testemunho e chamaram Galeede e Mispá, procurado nas mesmas colinas."
    - "Quando os amonitas “acamparam em Gileade”, os israelitas “também se reuniram e acamparam em Mispá” e procuraram um líder. Os anciãos de Gileade foram buscar o fora-da-lei Jefté na terra de Tobe e o povo o fez chefe e comandante, e “Jefté repetiu todas as suas palavras perante o SENHOR em Mispá”. Ele “passou por Gileade e Manassés, passou por Mispá de Gileade, e de Mispá de Gileade ele avançou contra os filhos de Amom”, tendo prometido oferecer o que primeiro saísse de sua casa ao seu encontro quando voltasse. Venceu, e “Quando Jefté chegou à sua casa em Mispá, eis que a sua filha saiu ao seu encontro com tamborins e danças”. A “armadilha em Mispá, e uma rede estendida sobre o Tabor” de Oseias pode se referir a esta Mispá ou à outra."
    - "A cidade não é mais mencionada. Prospecções de superfície em Khirbet Jal'ad acharam sobretudo cerâmica bizantina e talvez um pouco da Idade do Ferro, de modo que o nome pode ter-se mudado para ali de um sítio mais antigo nas proximidades. Os candidatos situam-se nas colinas arborizadas do noroeste da Jordânia, de um lado e outro do Jaboque, na terra que foi Gileade."
  de:
    - "Mizpa in Gilead, „die Warte“, war die Stadt östlich des Jordan, in der sich Israel gegen die Ammoniter versammelte und wo Jeftah sein Haus hatte; es ist nicht das Mizpa Benjamins, wo Samuel richtete. Die Lage ist umstritten. Die Karte folgt denen, die es bei Khirbet Jal'ad (Jel'ad) suchen, südlich des Jabbok bei es-Salt, wo der Name Gileads fortlebt; einige von ihnen halten es auch für das Ramat-Mizpe der Liste Josuas, und auch das nahe Khirbet er-Rasuni wird vorgeschlagen. Andere suchen nördlich des Jabbok, beim Dorf Suf oder dem kleinen Tell el-Masfa bei Dscherasch. Manche verbinden die Stadt mit dem Steinhaufen, den Jakob und Laban als Zeugen aufrichteten und Galeed und Mizpa nannten, der in denselben Hügeln gesucht wird."
    - "Die Ammoniter „kamen zuhauf und lagerten sich in Gilead; aber die Kinder Israel versammelten sich und lagerten sich zu Mizpa“ und suchten einen Anführer. Die Ältesten Gileads holten den Geächteten Jeftah aus dem Land Tob, und das Volk setzte ihn zum Haupt und Obersten, und es heißt: „Und Jephthah redete solches alles vor dem HERRN zu Mizpa.“ Er „zog durch Gilead und Manasse und durch Mizpe, das in Gilead liegt, und von Mizpe, das in Gilead liegt auf die Kinder Ammon“, nachdem er gelobt hatte, zu opfern, was ihm bei der Rückkehr zuerst aus seinem Haus entgegenkäme. Er siegte, und es heißt: „Da nun Jephthah kam gen Mizpa zu seinem Hause, siehe, da geht seine Tochter heraus ihm entgegen mit Pauken und Reigen“. Hoseas „Strick zu Mizpa und ein ausgespanntes Netz zu Thabor“ kann dieses Mizpa meinen oder das andere."
    - "Von der Stadt hört man nicht wieder. Oberflächenuntersuchungen in Khirbet Jal'ad fanden meist byzantinische Keramik und vielleicht ein wenig aus der Eisenzeit, sodass der Name von einem älteren Ort in der Nähe dorthin gewandert sein mag. Die Kandidaten liegen in den bewaldeten Hügeln des nordwestlichen Jordanien, auf beiden Seiten des Jabbok, in dem Land, das Gilead war."
  fr:
    - "Mitspa de Galaad, « la tour de guet », était la ville à l’est du Jourdain où Israël se rassembla contre les Ammonites et où Jephthé avait sa maison ; ce n’est pas la Mitspa de Benjamin où Samuel jugea. Le site est discuté. La carte suit ceux qui la cherchent près de Khirbet Jal’ad (Jel’ad), au sud du Jabbok près d’es-Salt, où le nom de Galaad survit ; certains d’entre eux la prennent aussi pour la Ramath-Mitspé de la liste de Josué, et on propose aussi Khirbet er-Rasuni tout près. D’autres regardent au nord du Jabbok, au village de Suf ou au petit Tell el-Masfa près de Jerash. Certains rattachent la ville au monceau de pierres que Jacob et Laban élevèrent comme témoignage et appelèrent Galed et Mitspa, que l’on cherche dans les mêmes collines."
    - "Quand les Ammonites « campèrent en Galaad », les Israélites « se rassemblèrent et campèrent à Mitspa » et cherchèrent un chef. Les anciens de Galaad allèrent chercher le hors-la-loi Jephthé au pays de Tob et le peuple le mit à sa tête et l’établit comme chef, et « Jephthé répéta devant l’Éternel, à Mitspa, toutes les paroles qu’il avait prononcées ». Il « traversa Galaad et Manassé ; il passa à Mitspé de Galaad ; et de Mitspé de Galaad, il marcha contre les fils d’Ammon », ayant fait le vœu d’offrir le premier qui sortirait de sa maison à sa rencontre à son retour. Il vainquit, et « Jephthé retourna dans sa maison à Mitspa. Et voici, sa fille sortit au-devant de lui avec des tambourins et des danses ». Le « piège à Mitspa, et un filet tendu sur le Thabor » d’Osée peut désigner cette Mitspa ou l’autre."
    - "On n’entend plus parler de la ville. Les prospections de surface à Khirbet Jal’ad ont trouvé surtout de la céramique byzantine et peut-être un peu de l’âge du Fer, de sorte que le nom a pu s’y déplacer depuis un site plus ancien tout proche. Les candidats se trouvent dans les collines boisées du nord-ouest de la Jordanie, de part et d’autre du Jabbok, dans le pays qui était Galaad."
  it:
    - "Mizpa di Galaad, «la torre di guardia», era la città a est del Giordano dove Israele si radunò contro gli Ammoniti e dove Iefte aveva la sua casa; non è la Mizpa di Beniamino dove Samuele giudicò. Il sito è discusso. La mappa segue chi la cerca presso Khirbet Jal‘ad (Jel‘ad), a sud dello Iabbok presso es-Salt, dove sopravvive il nome di Galaad; alcuni di loro la ritengono anche la Ramat-Mizpe dell’elenco di Giosuè, e si propone anche Khirbet er-Rasuni lì vicino. Altri guardano a nord dello Iabbok, al villaggio di Suf o al piccolo Tell el-Masfa presso Jerash. Alcuni collegano la città al mucchio di pietre che Giacobbe e Laban innalzarono come testimonio e chiamarono Galed e Mitspa, cercato nelle stesse colline."
    - "Quando gli Ammoniti «si accamparono in Galaad», gli Israeliti «s’adunaron pure, e si accamparono a Mitspa» e cercarono un capo. Gli anziani di Galaad andarono a prendere il fuorilegge Iefte nel paese di Tob e il popolo lo costituì capo e condottiero, e «Jefte ripeté davanti all’Eterno, a Mitspa, tutte le parole che avea dette prima». Egli «attraversò Galaad e Manasse, passò a Mitspa di Galaad, e da Mitspa di Galaad mosse contro i figliuoli di Ammon», avendo fatto voto di offrire ciò che per primo fosse uscito dalla sua casa a incontrarlo al ritorno. Vinse, e «Jefte se ne tornò a Mitspa, a casa sua; ed ecco uscirgli incontro la sua figliuola, con timpani e danze». Il «laccio a Mitspa, e una rete tesa sul Tabor» di Osea può indicare questa Mizpa o l’altra."
    - "Della città non si sente più parlare. Le ricognizioni di superficie a Khirbet Jal‘ad hanno trovato per lo più ceramica bizantina e forse un poco dell’età del Ferro, così il nome può essersi spostato là da un sito più antico vicino. I candidati si trovano nelle colline boscose della Giordania nord-occidentale, su entrambi i lati dello Iabbok, nel paese che fu Galaad."
  pl:
    - "Mispa w Gileadzie, „strażnica”, było miastem na wschód od Jordanu, gdzie Izrael zebrał się przeciw Ammonitom i gdzie Jefte miał dom; to nie jest Mispa Beniamina, gdzie sądził Samuel. Położenie jest sporne. Mapa idzie za tymi, którzy szukają go koło Khirbet Jal'ad (Jel'ad), na południe od Jabboku koło es-Salt, gdzie przetrwała nazwa Gileadu; niektórzy z nich uważają je także za Ramat-Mispe z listy Jozuego, a proponuje się też pobliskie Khirbet er-Rasuni. Inni szukają na północ od Jabboku, we wsi Suf albo w małym Tell el-Masfa koło Dżerasz. Niektórzy łączą miasto z kopcem kamieni, który Jakub i Laban wznieśli na świadectwo i nazwali Galeed i Mispa, a którego szuka się w tych samych wzgórzach."
    - "Gdy „zebrali się tedy synowie Ammonowi, a położyli się obozem w Galaad”, to „zebrali się też i synowie Izraelscy, a położyli się obozem w Masfa” i szukali wodza. Starsi Gileadu sprowadzili banitę Jeftego z ziemi Tob, a lud ustanowił go głową i dowódcą, „i mówił Jefte wszystkie te słowa przed Panem w Masfa”. On „przeszedł przez Galaad, i przez Manase; przeszedł też przez Masfa w Galaad, a z Masfy w Galaad ciągnął przeciw synom Ammonowym”, ślubując ofiarować to, co pierwsze wyjdzie z jego domu na spotkanie po powrocie. Zwyciężył, a „gdy się wracał Jefte do Masfa do domu swego, oto, córka jego wyszła przeciw niemu, z bębny, i z muzyką”. Słowa Ozeasza, „żeście sidłem w Masfa, a siecią rozciągnioną na wierzchu Tabor”, mogą dotyczyć tej Mispy albo tamtej."
    - "Miasto nie pojawia się więcej. Badania powierzchniowe w Khirbet Jal'ad znalazły głównie ceramikę bizantyjską i może trochę z epoki żelaza, więc nazwa mogła przenieść się tam ze starszego stanowiska w pobliżu. Kandydaci leżą w zalesionych wzgórzach północno-zachodniej Jordanii, po obu stronach Jabboku, w kraju, który był Gileadem."
  nl:
    - "Mizpa in Gilead, “de uitkijktoren”, was de stad ten oosten van de Jordaan waar Israël zich verzamelde tegen de Ammonieten en waar Jefta zijn huis had; het is niet het Mizpa van Benjamin waar Samuël richtte. De ligging is omstreden. De kaart volgt degenen die haar zoeken bij Khirbet Jal'ad (Jel'ad), ten zuiden van de Jabbok bij es-Salt, waar de naam Gilead voortleeft; sommigen van hen houden haar ook voor het Ramat-Mizpe van Jozua's lijst, en ook het nabije Khirbet er-Rasuni wordt voorgesteld. Anderen kijken ten noorden van de Jabbok, naar het dorp Suf of de kleine Tell el-Masfa bij Jerash. Sommigen verbinden de stad met de steenhoop die Jakob en Laban als getuige opwierpen en Galëed en Mizpa noemden, die in dezelfde heuvels wordt gezocht."
    - "De kinderen Ammons “werden bijeengeroepen, en legerden zich in Gilead”; de kinderen Israëls werden “vergaderd, en legerden zich te Mizpa”, en zochten een leider. De oudsten van Gilead haalden de balling Jefta uit Tob en het volk stelde hem tot hoofd en overste, “en Jeftha sprak al zijn woorden voor het aangezicht des HEEREN te Mizpa”. Hij trok door Gilead en Manasse: “hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door tot de kinderen Ammons”, nadat hij had beloofd te offeren wat hem bij thuiskomst het eerst uit zijn huis tegemoet kwam. Hij won: “Toen nu Jeftha te Mizpa bij zijn huis kwam, ziet, zo ging zijn dochter uit hem tegemoet, met trommelen en met reien”. In Hosea's “gij een strik zijt geworden te Mizpa, en een uitgespannen net op Thabor” kan deze Mizpa bedoeld zijn of de andere."
    - "Van de stad wordt daarna niet meer gehoord. Oppervlakteonderzoek bij Khirbet Jal'ad vond vooral Byzantijns aardewerk en misschien een weinig uit de ijzertijd, zodat de naam daarheen kan zijn verhuisd van een oudere plaats in de buurt. De kandidaten liggen in de beboste heuvels van het noordwesten van Jordanië, aan weerszijden van de Jabbok, in het land dat Gilead was."
  cs:
    - "Micpa Gileadská, „strážní věž“, bylo město východně od Jordánu, kde se Izrael shromáždil proti Amónským a kde měl dům Jiftách; není to Micpa Benjamínova, kde soudil Samuel. Poloha je sporná. Mapa následuje ty, kdo ji hledají poblíž Khirbet Jal'ad (Jel'ad), jižně od Jaboku u es-Saltu, kde přežívá jméno Gileadu; někteří z nich ji pokládají i za Ramat-micpe ze seznamu Jozueho a navrhuje se také blízké Khirbet er-Rasuni. Jiní hledí severně od Jaboku, na vesnici Suf nebo malý Tell el-Masfa u Džerašu. Někteří spojují město s hromadou kamení, kterou Jákob a Laban vztyčili jako svědka a nazvali Galeed a Micpa a která se hledá v týchž pahorcích."
    - "Když Amónci „položili se v Galád“, „shromáždili se také synové Izraelští, a položili se v Masfa“ a hledali vůdce. Starší Gileadští přivedli psance Jiftacha z krajiny Tób a lid z něj učinil vůdce a velitele, „mluvil Jefte všecka slova svá před Hospodinem v Masfa“. Pak „táhl skrze Galád a Manasse, prošel i Masfa v Galád, a z Masfy v Galád táhl proti Ammonitským“, poté co slíbil obětovat, co mu první vyjde z domu vstříc při návratu. Zvítězil; a když se „navracoval Jefte do Masfa k domu svému, aj, dcera jeho vyšla jemu vstříc s bubny a s houfem plésajících“. Ozeášovo „osídlo v Masfa, a sítka rozestřená na vrchu Tábor“ může znamenat tuto Micpu nebo druhou."
    - "Město se už neobjevuje. Povrchové průzkumy v Khirbet Jal'ad našly většinou byzantskou keramiku a snad trochu z doby železné, takže jméno se sem mohlo přenést ze staršího místa poblíž. Kandidáti leží v zalesněných pahorcích severozápadního Jordánska, po obou stranách Jaboku, v zemi, která byla Gileadem."
  sv:
    - "Mispa i Gilead, ”utkikstornet”, var staden öster om Jordan där Israel samlades mot ammoniterna och där Jefta hade sitt hus; det är inte Mispa i Benjamin där Samuel dömde. Platsen är omstridd. Kartan följer dem som söker den nära Khirbet Jal'ad (Jel'ad), söder om Jabbok nära es-Salt, där Gileads namn lever kvar; några av dem håller den också för Ramat-Mispe i Josuas förteckning, och Khirbet er-Rasuni i närheten föreslås också. Andra söker norr om Jabbok, vid byn Suf eller den lilla Tell el-Masfa nära Jerash. Några förbinder staden med stenhögen som Jakob och Laban reste som vittne och kallade Galed och Mispa, vilken söks i samma berg."
    - "Då ammoniterna ”blevo uppbådade och lägrade sig i Gilead”, ”församlade sig” israeliterna ”och lägrade sig i Mispa” och sökte en ledare. Gileads äldste hämtade fredlösen Jefta från landet Tov och folket gjorde honom till hövding och anförare, och ”Jefta uttalade inför HERREN i Mispa allt vad han hade sagt”. Han ”tågade genom Gilead och Manasse och tågade så genom Mispe i Gilead, och från Mispe i Gilead tågade han fram mot Ammons barn”, sedan han lovat att offra det som först kom ut ur hans hus för att möta honom vid hemkomsten. Han vann, och ”När sedan Jefta kom hem till sitt hus i Mispa, då gick hans dotter ut emot honom med pukor och dans”. Hoseas ”en snara för Mispa och ett nät, utbrett på Tabor” kan avse denna Mispa eller den andra."
    - "Staden hörs inte av igen. Ytundersökningar vid Khirbet Jal'ad fann mest bysantinsk keramik och kanske lite från järnåldern, så namnet kan ha flyttat dit från en äldre plats i närheten. Kandidaterna ligger i de skogklädda bergen i nordvästra Jordanien, på båda sidor om Jabbok, i det land som var Gilead."
  nb:
    - "Mispa i Gilead, «vakttårnet», var byen øst for Jordan der Israel samlet seg mot ammonittene og der Jefta hadde sitt hus; den er ikke Benjamins Mispa der Samuel dømte. Beliggenheten er omstridt. Kartet følger dem som søker den nær Khirbet Jal'ad (Jel'ad), sør for Jabbok nær es-Salt, der navnet Gilead lever videre; noen av dem tar den også for Ramat-Mispe i Josvas liste, og Khirbet er-Rasuni like ved er også foreslått. Andre ser nord for Jabbok, ved landsbyen Suf eller den lille Tell el-Masfa nær Jerash. Noen knytter byen til steinhaugen som Jakob og Laban reiste som vitne og kalte Gal-Ed og Mispa, som søkes i de samme åsene."
    - "Da ammonittene «leiret sig i Gilead», «Israels barn samlet sig og leiret sig i Mispa» og lette etter en leder. De eldste i Gilead hentet fredløsen Jefta fra landet Tob, og folket gjorde ham til høvding og fører, «Og Jefta gjentok i Mispa alle sine ord for Herrens åsyn». Han «drog gjennem Gilead og Manasse; så drog han frem til Mispa i Gilead; og fra Mispa i Gilead drog han frem mot Ammons barn», etter å ha gjort et løfte om å ofre det første som kom ut av hans hus for å møte ham når han vendte tilbake. Han vant, og «Da Jefta kom hjem til sitt hus i Mispa, da gikk hans datter ut imot ham med trommer og dans». Hoseas «en snare har I vært på Mispa og et utspent nett på Tabor» kan bety denne Mispa eller den andre."
    - "Byen høres ikke om igjen. Overflateundersøkelser ved Khirbet Jal'ad fant mest bysantinsk keramikk og kanskje litt fra jernalderen, så navnet kan ha flyttet dit fra et eldre sted i nærheten. Kandidatene ligger i de skogkledde åsene i nordvestlige Jordan, på begge sider av Jabbok, i landet som var Gilead."
