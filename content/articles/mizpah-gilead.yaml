# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the candidates (Jal'ad area south of the Jabbok, Suf or Tell el-Masfa north of it) are given without choosing one. Named mizpah-gilead because mizpah is the Mizpah of Benjamin.
id: mizpah-gilead
place: a0f8af9
title:
  en: "Mizpah of Gilead"
  ru: "Массифа Галаадская"
  uk: "Міцпа Гілеадська"
  es: "Mizpa de Galaad"
  pt: "Mispá de Gileade"
  de: "Mizpa in Gilead"
  fr: "Mitspa de Galaad"
body:
  en:
    - "Mizpah of Gilead, “the watchtower”, was the town east of the Jordan where Israel gathered against the Ammonites and where Jephthah had his house; it is not the Mizpah of Benjamin where Samuel judged. The site is disputed. The map follows those who seek it near Khirbet Jal'ad (Jel'ad), south of the Jabbok near es-Salt, where the name of Gilead survives; some of them take it also for the Ramath-mizpeh of Joshua's list, and Noth proposed er-Reshuni close by. Others look north of the Jabbok, at the village of Suf or the small Tell el-Masfa near Jerash. Some connect the town with the heap of stones that Jacob and Laban raised as a witness and named Galeed and Mizpah, which is sought in the same hills."
    - "When the Ammonites “encamped in Gilead”, the Israelites “assembled themselves together, and encamped in Mizpeh” and looked for a leader. The elders of Gilead fetched the outlaw Jephthah from the land of Tob and the people made him head and captain, “and Jephthah uttered all his words before the LORD in Mizpeh”. He “passed over Gilead, and Manasseh, and passed over Mizpeh of Gilead, and from Mizpeh of Gilead he passed over unto the children of Ammon”, having vowed to offer up whatever first came out of his house to meet him on his return. He won, “and Jephthah came to Mizpeh unto his house, and, behold, his daughter came out to meet him with timbrels and with dances”. Hosea's “snare on Mizpah, and a net spread upon Tabor” may mean this Mizpah or the other."
    - "The town is not heard of again. Surface surveys at Khirbet Jal'ad found mostly Byzantine pottery and perhaps a little of the Iron Age, so the name may have moved there from an older site nearby. The candidates lie in the wooded hills of north-western Jordan, on either side of the Jabbok, in the country that was Gilead."
  ru:
    - "Массифа Галаадская, «сторожевая башня», — город за Иорданом, где Израиль собрался против Аммонитян и где был дом Иеффая; это не Массифа Вениаминова, где судил Самуил. Место спорно. Карта следует тем, кто ищет его у Хирбет-Джальада (Джельада) к югу от Иавока близ Эс-Салта, где сохранилось имя Галаада; некоторые из них видят здесь и Рамаф-Мицфу из списка книги Иисуса Навина, а Нот предлагал соседний Эр-Решуни. Другие ищут к северу от Иавока — у деревни Суф или на небольшом Телль-эль-Масфе близ Джераша. Иные связывают город с холмом из камней, который Иаков и Лаван сложили во свидетельство и назвали Галаад и Мицпа, — его ищут в тех же горах."
    - "Когда Аммонитяне «расположились станом в Галааде», сыны Израилевы собрались «и стали станом в Массифе» и искали вождя. Старейшины Галаадские привели изгнанника Иеффая из земли Тов, и народ поставил его начальником и вождём, «и Иеффай произнес все слова свои пред лицом Господа в Массифе». Он «прошел Галаад и Манассию, и прошел Массифу Галаадскую, и из Массифы Галаадской пошел к Аммонитянам», дав обет вознести во всесожжение то, что первым выйдет из ворот его дома навстречу ему. Он победил, «и пришел Иеффай в Массифу в дом свой, и вот, дочь его выходит навстречу ему с тимпанами и ликами». Упрёк Осии, что вы были «западнею в Массифе и сетью, раскинутою на Фаворе», может относиться к этой Массифе или к другой."
    - "Больше о городе не слышно. Обследования поверхности на Хирбет-Джальаде дали в основном византийскую керамику и, возможно, немного керамики железного века, так что имя могло перейти сюда с более древнего поселения поблизости. Все эти места лежат в лесистых горах северо-западной Иордании, по обе стороны Иавока, в краю, который был Галаадом."
  uk:
    - "Міцпа Гілеадська, «сторожова вежа», була містом на схід від Йордану, де Ізраїль збирався проти аммонійців і де мав свій дім Єфтай; це не Міцпа Веніяміна, де судив Самуїл. Місце спірне. Мапа слідує тим, хто шукає його поблизу Хірбет-Джалад (Джелад), на південь від Яббоку біля ес-Сальта, де зберігається назва Гілеаду; дехто з них вважає його також Рамат-Міцпе з переліку Ісуса Навина, а Нот запропонував поблизу ер-Решуні. Інші дивляться на північ від Яббоку, на село Суф або на малий Телль-ель-Масфа поблизу Джераша. Дехто пов’язує місто з купою каменів, яку Яків і Лаван поставили як свідчення й назвали Галлед і Міцпа, що її шукають у тих самих пагорбах."
    - "Коли аммонійці «отаборились у Галаадї», ізраїльтяни «Зібрались і сини Ізрайлеві та й отаборились під Массифою» і шукали вождя. Старші Гілеаду привели вигнанця Єфтая із землі Тов, і народ зробив його головою і гетьманом, «й принїс Ефтай усї свої бажання перед Господа в Массифі». Він «перейшов Галаад і Манассію, і перейшов через Массифу Галаадську, а з Массифи Галаадської двинув проти Аммонїїв», давши обітницю принести в жертву те, що першим вийде з його дому йому назустріч по поверненні. Він переміг, «Як же прийшов Ефтай в Массифу додому, аж виходить зустріч йому дочка його з музиками й танцями». «Западнею (людові) в Массифі, неначе сїттю, що на Таворі заставляють» в Осії може означати цю Міцпу або іншу."
    - "Про місто більше не чути. Поверхневі розвідки у Хірбет-Джаладі знайшли переважно візантійську кераміку і, можливо, трохи залізної доби, тож назва могла перейти туди зі старішого місця поблизу. Кандидати лежать у лісистих пагорбах північного заходу Йорданії, по обидва боки Яббоку, в краї, що був Гілеадом."
  es:
    - "Mizpa de Galaad, «la atalaya», era la ciudad al este del Jordán donde Israel se reunió contra los amonitas y donde Jefté tenía su casa; no es la Mizpa de Benjamín donde juzgó Samuel. El emplazamiento se discute. El mapa sigue a quienes la buscan cerca de Khirbet Jal'ad (Jel'ad), al sur del Jaboc, cerca de es-Salt, donde sobrevive el nombre de Galaad; algunos de ellos la toman también por la Ramat-mizpa de la lista de Josué, y Noth propuso er-Reshuni, muy cerca. Otros miran al norte del Jaboc, a la aldea de Suf o al pequeño Tell el-Masfa, cerca de Jerash. Algunos relacionan la ciudad con el montón de piedras que Jacob y Labán levantaron como testimonio y llamaron Galaad y Mizpa, que se busca en las mismas colinas."
    - "Cuando los amonitas «asentaron campo en Galaad: juntáronse asimismo los hijos de Israel, y asentaron su campo en Mizpa»; buscaban un caudillo. Los ancianos de Galaad fueron a buscar al proscrito Jefté a la tierra de Tob y el pueblo lo hizo cabeza y príncipe, y «Jephté habló todas sus palabras delante de Jehová en Mizpa». «Pasó por Galaad y Manasés; y de allí pasó á Mizpa de Galaad; y de Mizpa de Galaad pasó á los hijos de Ammón», habiendo hecho voto de ofrecer lo primero que saliera de su casa a recibirlo a su regreso. Venció, y «volviendo Jephté á Mizpa á su casa, he aquí que su hija le salió á recibir con adufes y danzas». El «lazo en Mizpa, y red extendida sobre Tabor» de Oseas puede referirse a esta Mizpa o a la otra."
    - "De la ciudad no se vuelve a oír. Las prospecciones de superficie en Khirbet Jal'ad hallaron sobre todo cerámica bizantina y quizá un poco de la Edad del Hierro, de modo que el nombre pudo trasladarse allí desde un sitio más antiguo cercano. Los candidatos se hallan en las colinas boscosas del noroeste de Jordania, a ambos lados del Jaboc, en la región que fue Galaad."
  pt:
    - "Mispá de Gileade, “a torre de vigia”, era a cidade a leste do Jordão onde Israel se reuniu contra os amonitas e onde Jefté tinha sua casa; não é a Mispá de Benjamim onde Samuel julgou. O sítio é disputado. O mapa segue os que o procuram perto de Khirbet Jal'ad (Jel'ad), ao sul do Jaboque, perto de es-Salt, onde sobrevive o nome de Gileade; alguns deles a tomam também pela Ramate-Mispa da lista de Josué, e Noth propôs er-Reshuni, ali perto. Outros olham ao norte do Jaboque, na aldeia de Suf ou no pequeno Tell el-Masfa, perto de Jerasa. Alguns ligam a cidade ao montão de pedras que Jacó e Labã ergueram como testemunho e chamaram Galeede e Mispá, procurado nas mesmas colinas."
    - "Quando os amonitas “acamparam em Gileade”, os israelitas “também se reuniram e acamparam em Mispá” e procuraram um líder. Os anciãos de Gileade foram buscar o fora-da-lei Jefté na terra de Tobe e o povo o fez chefe e comandante, e “Jefté repetiu todas as suas palavras perante o SENHOR em Mispá”. Ele “passou por Gileade e Manassés, passou por Mispá de Gileade, e de Mispá de Gileade ele avançou contra os filhos de Amom”, tendo prometido oferecer o que primeiro saísse de sua casa ao seu encontro quando voltasse. Venceu, e “Quando Jefté chegou à sua casa em Mispá, eis que a sua filha saiu ao seu encontro com tamborins e danças”. A “armadilha em Mispá, e uma rede estendida sobre o Tabor” de Oseias pode se referir a esta Mispá ou à outra."
    - "A cidade não é mais mencionada. Prospecções de superfície em Khirbet Jal'ad acharam sobretudo cerâmica bizantina e talvez um pouco da Idade do Ferro, de modo que o nome pode ter-se mudado para ali de um sítio mais antigo nas proximidades. Os candidatos situam-se nas colinas arborizadas do noroeste da Jordânia, de um lado e outro do Jaboque, na terra que foi Gileade."
  de:
    - "Mizpa in Gilead, „die Warte“, war die Stadt östlich des Jordan, in der sich Israel gegen die Ammoniter versammelte und wo Jeftah sein Haus hatte; es ist nicht das Mizpa Benjamins, wo Samuel richtete. Die Lage ist umstritten. Die Karte folgt denen, die es bei Khirbet Jal'ad (Jel'ad) suchen, südlich des Jabbok bei es-Salt, wo der Name Gileads fortlebt; einige von ihnen halten es auch für das Ramat-Mizpe der Liste Josuas, und Noth schlug das nahe er-Reshuni vor. Andere suchen nördlich des Jabbok, beim Dorf Suf oder dem kleinen Tell el-Masfa bei Dscherasch. Manche verbinden die Stadt mit dem Steinhaufen, den Jakob und Laban als Zeugen aufrichteten und Galeed und Mizpa nannten, der in denselben Hügeln gesucht wird."
    - "Die Ammoniter „kamen zuhauf und lagerten sich in Gilead; aber die Kinder Israel versammelten sich und lagerten sich zu Mizpa“ und suchten einen Anführer. Die Ältesten Gileads holten den Geächteten Jeftah aus dem Land Tob, und das Volk setzte ihn zum Haupt und Obersten, und es heißt: „Und Jephthah redete solches alles vor dem HERRN zu Mizpa.“ Er „zog durch Gilead und Manasse und durch Mizpe, das in Gilead liegt, und von Mizpe, das in Gilead liegt auf die Kinder Ammon“, nachdem er gelobt hatte, zu opfern, was ihm bei der Rückkehr zuerst aus seinem Haus entgegenkäme. Er siegte, und es heißt: „Da nun Jephthah kam gen Mizpa zu seinem Hause, siehe, da geht seine Tochter heraus ihm entgegen mit Pauken und Reigen“. Hoseas „Strick zu Mizpa und ein ausgespanntes Netz zu Thabor“ kann dieses Mizpa meinen oder das andere."
    - "Von der Stadt hört man nicht wieder. Oberflächenuntersuchungen in Khirbet Jal'ad fanden meist byzantinische Keramik und vielleicht ein wenig aus der Eisenzeit, sodass der Name von einem älteren Ort in der Nähe dorthin gewandert sein mag. Die Kandidaten liegen in den bewaldeten Hügeln des nordwestlichen Jordanien, auf beiden Seiten des Jabbok, in dem Land, das Gilead war."
  fr:
    - "Mitspa de Galaad, « la tour de guet », était la ville à l’est du Jourdain où Israël se rassembla contre les Ammonites et où Jephthé avait sa maison ; ce n’est pas la Mitspa de Benjamin où Samuel jugea. Le site est discuté. La carte suit ceux qui la cherchent près de Khirbet Jal’ad (Jel’ad), au sud du Jabbok près d’es-Salt, où le nom de Galaad survit ; certains d’entre eux la prennent aussi pour la Ramath-Mitspé de la liste de Josué, et Noth a proposé er-Reshuni tout près. D’autres regardent au nord du Jabbok, au village de Suf ou au petit Tell el-Masfa près de Jerash. Certains rattachent la ville au monceau de pierres que Jacob et Laban élevèrent comme témoignage et appelèrent Galed et Mitspa, que l’on cherche dans les mêmes collines."
    - "Quand les Ammonites « campèrent en Galaad », les Israélites « se rassemblèrent et campèrent à Mitspa » et cherchèrent un chef. Les anciens de Galaad allèrent chercher le hors-la-loi Jephthé au pays de Tob et le peuple le mit à sa tête et l’établit comme chef, et « Jephthé répéta devant l’Éternel, à Mitspa, toutes les paroles qu’il avait prononcées ». Il « traversa Galaad et Manassé ; il passa à Mitspé de Galaad ; et de Mitspé de Galaad, il marcha contre les fils d’Ammon », ayant fait le vœu d’offrir le premier qui sortirait de sa maison à sa rencontre à son retour. Il vainquit, et « Jephthé retourna dans sa maison à Mitspa. Et voici, sa fille sortit au-devant de lui avec des tambourins et des danses ». Le « piège à Mitspa, et un filet tendu sur le Thabor » d’Osée peut désigner cette Mitspa ou l’autre."
    - "On n’entend plus parler de la ville. Les prospections de surface à Khirbet Jal’ad ont trouvé surtout de la céramique byzantine et peut-être un peu de l’âge du Fer, de sorte que le nom a pu s’y déplacer depuis un site plus ancien tout proche. Les candidats se trouvent dans les collines boisées du nord-ouest de la Jordanie, de part et d’autre du Jabbok, dans le pays qui était Galaad."
