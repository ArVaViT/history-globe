# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the candidates (Jal'ad area south of the Jabbok, Suf or Tell el-Masfa north of it) are given without choosing one. Named mizpah-gilead because mizpah is the Mizpah of Benjamin.
id: mizpah-gilead
place: a0f8af9
title:
  en: "Mizpah of Gilead"
  ru: "Массифа Галаадская"
body:
  en:
    - "Mizpah of Gilead, “the watchtower”, was the town east of the Jordan where Israel gathered against the Ammonites and where Jephthah had his house; it is not the Mizpah of Benjamin where Samuel judged. The site is disputed. The map follows those who seek it near Khirbet Jal'ad (Jel'ad), south of the Jabbok near es-Salt, where the name of Gilead survives; some of them take it also for the Ramath-mizpeh of Joshua's list, and Noth proposed er-Reshuni close by. Others look north of the Jabbok, at the village of Suf or the small Tell el-Masfa near Jerash. Some connect the town with the heap of stones that Jacob and Laban raised as a witness and named Galeed and Mizpah, which is sought in the same hills."
    - "When the Ammonites “encamped in Gilead”, the Israelites “assembled themselves together, and encamped in Mizpeh” and looked for a leader. The elders of Gilead fetched the outlaw Jephthah from the land of Tob and the people made him head and captain, “and Jephthah uttered all his words before the LORD in Mizpeh”. He “passed over Gilead, and Manasseh, and passed over Mizpeh of Gilead, and from Mizpeh of Gilead he passed over unto the children of Ammon”, having vowed to offer up whatever first came out of his house to meet him on his return. He won, “and Jephthah came to Mizpeh unto his house, and, behold, his daughter came out to meet him with timbrels and with dances”. Hosea's “snare on Mizpah, and a net spread upon Tabor” may mean this Mizpah or the other."
    - "The town is not heard of again. Surface surveys at Khirbet Jal'ad found mostly Byzantine pottery and perhaps a little of the Iron Age, so the name may have moved there from an older site nearby. The candidates lie in the wooded hills of north-western Jordan, on either side of the Jabbok, in the country that was Gilead."
  ru:
    - "Массифа Галаадская, «сторожевая башня», — город за Иорданом, где Израиль собрался против Аммонитян и где был дом Иеффая; это не Массифа Вениаминова, где судил Самуил. Место спорно. Карта следует тем, кто ищет его у Хирбет-Джальада (Джельада) к югу от Иавока близ Эс-Салта, где сохранилось имя Галаада; некоторые из них видят здесь и Рамаф-Мицфу из списка книги Иисуса Навина, а Нот предлагал соседний Эр-Решуни. Другие ищут к северу от Иавока — у деревни Суф или на небольшом Телль-эль-Масфе близ Джераша. Иные связывают город с холмом из камней, который Иаков и Лаван сложили во свидетельство и назвали Галаад и Мицпа, — его ищут в тех же горах."
    - "Когда Аммонитяне «расположились станом в Галааде», сыны Израилевы собрались «и стали станом в Массифе» и искали вождя. Старейшины Галаадские привели изгнанника Иеффая из земли Тов, и народ поставил его начальником и вождём, «и Иеффай произнес все слова свои пред лицом Господа в Массифе». Он «прошел Галаад и Манассию, и прошел Массифу Галаадскую, и из Массифы Галаадской пошел к Аммонитянам», дав обет вознести во всесожжение то, что первым выйдет из ворот его дома навстречу ему. Он победил, «и пришел Иеффай в Массифу в дом свой, и вот, дочь его выходит навстречу ему с тимпанами и ликами». Упрёк Осии, что вы были «западнею в Массифе и сетью, раскинутою на Фаворе», может относиться к этой Массифе или к другой."
    - "Больше о городе не слышно. Обследования поверхности на Хирбет-Джальаде дали в основном византийскую керамику и, возможно, немного керамики железного века, так что имя могло перейти сюда с более древнего поселения поблизости. Все эти места лежат в лесистых горах северо-западной Иордании, по обе стороны Иавока, в краю, который был Галаадом."
