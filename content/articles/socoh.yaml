# Overview article (ADR 0007). Mainstream facts only; the identification with Tel Socoh is undisputed; the Synodal "Сокхоф" of 1 Samuel 17 is noted as a spelling of the same town. Which Socoh the lmlk stamps name is debated (Na'aman: this one; Rainey: the hill-country Socoh, see socoh-hill-country.yaml).
id: socoh
