body:
  en:
    - "Socoh was a town of Judah in the Shephelah, the low hills between the Judean mountains and the Philistine plain. It is identified, without dispute, with Tel Socoh (Khirbet Shuweikeh), a mound on the south side of the valley of Elah about 27 km south-west of Jerusalem, which keeps the ancient name; Azekah stands across the valley to the north-west and Khirbet Qeiyafa on the ridge opposite. Joshua lists it with Jarmuth, Adullam and Azekah among the towns of the lowland; another Socoh lay in the hill country near Hebron, and a third in Solomon's districts in the north. The tel has been surveyed, most recently in 2010, but never fully excavated, and its surface has yielded jar handles stamped for the king."
    - "The town's fame is the day of Goliath. “Now the Philistines gathered together their armies to battle, and were gathered together at Shochoh, which belongeth to Judah, and pitched between Shochoh and Azekah, in Ephes-dammim”, while Saul and Israel camped by the valley of Elah, each army on a mountain with the valley between them; the Synodal Bible there writes the name as Succoth. Rehoboam, fortifying Judah, built Socoh with Beth-zur and Adullam, and in the days of Ahaz the Philistines invaded the lowland “and had taken Beth-shemesh, and Ajalon, and Gederoth, and Shocho with the villages thereof”."
    - "Socoh was one of the four names, with Hebron, Ziph and Mmst, stamped on the royal jars of Hezekiah's reign found all over Judah. Which Socoh is meant is debated: N. Na'aman took it to be this one, which would make the town a centre of the kingdom's stores, while A. F. Rainey looked to the Socoh of the hill country. Eusebius knew Socho as two villages, upper and lower, at the ninth milestone on the road from Eleutheropolis to Jerusalem, and the Mishnah remembers the sage Antigonus of Socho, though which Socoh was his home is not said. The mound today stands above the Elah valley road in Israel's Adullam region, with the excavated Khirbet Qeiyafa and Tel Azekah within sight."
  ru:
    - "Сохо — город Иуды в Шефеле, низких холмах между Иудейскими горами и Филистимской равниной. Его бесспорно отождествляют с Тель-Сохо (Хирбет-Шувейке), холмом на южной стороне долины Дуба (Елах) примерно в 27 км к юго-западу от Иерусалима, сохранившим древнее имя; через долину к северо-западу стоит Азека, а на гребне напротив — Хирбет-Кейафа. Книга Иисуса Навина числит его с Иармуфом, Одолламом и Азекой среди городов низменности; другой Сохо лежал в горах близ Хеврона, третий — в северных областях Соломона. Холм обследован, в последний раз в 2010 году, но так и не раскопан полностью, и его поверхность дала ручки кувшинов с царской печатью."
    - "Слава города — день Голиафа. «Филистимляне собрали войска свои для войны и собрались в Сокхофе, что в Иудее, и расположились станом между Сокхофом и Азеком в Ефес-Даммиме», а Саул и Израильтяне стали у долины дуба, каждое войско на горе, и между ними была долина; Синодальный перевод пишет здесь имя как Сокхоф. Ровоам, укрепляя Иудею, обнёс стенами Сохо вместе с Вефцуром и Одолламом, а во дни Ахаза Филистимляне рассыпались по низменности «и взяли Вефсамис и Аиалон, и Гедероф и Сохо и зависящие от него города»."
    - "Сохо — одно из четырёх имён, вместе с Хевроном, Зифом и Ммшт, оттиснутых на царских кувшинах времён Езекии, найденных по всей Иудее. Какой Сохо имеется в виду, спорно: Н. Нааман считал, что этот, и тогда город был одним из складских центров царства, а Э. Ф. Рейни указывал на Сохо в горах. Евсевий знал Сохо как два селения, верхнее и нижнее, у девятого милевого столба на дороге из Елевферополя в Иерусалим, а Мишна помнит мудреца Антигона из Сохо, не говоря, впрочем, который Сохо был его родиной. Холм сегодня стоит над дорогой долины Елах в израильском округе Адуллам, в виду раскопанных Хирбет-Кейафы и Тель-Азеки."
  uk:
    - "Сохо було містом Юди в Шефелі, низьких пагорбах між юдейськими горами та філістимською рівниною. Його без суперечок ототожнюють з Тель-Сохо (Хірбет-Шувейка), пагорбом на південному боці долини Дуба приблизно за 27 км на південний захід від Єрусалима, що зберігає давню назву; Азека стоїть через долину на північний захід, а Хірбет-Кеяфа на протилежному гребені. Ісус Навин зараховує його разом з Ярмутом, Одолламом і Азекою до міст низовини; інше Сохо лежало в гірській країні поблизу Хеврона, а третє — в округах Соломона на півночі. Тель обстежено, востаннє 2010 року, але так і не розкопано повністю, і на його поверхні знайдено ручки глеків з царськими печатками."
    - "Слава міста — день Голіята. «Филистії зібрали своє військо до бою, та й зійшлись в Сохотї, що в Юдеї, та й отаборились під Ефес-Даммимом між Сохотом і Азеком», а Саул з Ізраїлем отаборилися біля долини Дуба, кожне військо на горі, і між ними була долина; Синодальний переклад пише там назву як Сокхот. Ровоам, укріплюючи Юду, збудував Сохо разом з Бет-Цуром і Одолламом, а за днів Ахаза филистимляни вдерлися в низовину й «взяли Бетсамис і Аялон, і Гедерот, і Сохо та залежні від його міста»."
    - "Сохо було одним із чотирьох імен, поряд з Хевроном, Зіфом і Ммст, відтиснених на царських глеках часів Єзекії, знайдених по всій Юдеї. Яке саме Сохо мається на увазі, обговорюють: Н. Нааман вважав, що йдеться про це Сохо, і тоді місто було осередком царських запасів, а А. Ф. Рейні мав на увазі Сохо в горах. Євсевій знав Сохо як два села, верхнє й нижнє, на дев’ятій милі дороги від Елевтеополя до Єрусалима, а Мішна пам’ятає мудреця Антигона із Сохо, хоч не сказано, яке Сохо було його домівкою. Нині пагорб здіймається над дорогою долини Дуба в ізраїльському районі Адулам, а розкопані Хірбет-Кеяфа та Тель-Азека видно з нього."
  es:
    - "Soco era una ciudad de Judá en la Sefelá, las colinas bajas entre las montañas de Judea y la llanura filistea. Se identifica, sin discusión, con Tel Soco (Khirbet Shuweikeh), un montículo en el lado sur del valle de Ela, a unos 27 km al suroeste de Jerusalén, que conserva el nombre antiguo; Azeca está al otro lado del valle, al noroeste, y Khirbet Qeiyafa en la cresta de enfrente. Josué la enumera con Jarmut, Adulam y Azeca entre las ciudades de la llanura; otra Soco estaba en la región montañosa cerca de Hebrón, y una tercera en los distritos de Salomón, en el norte. El tel ha sido prospectado, la última vez en 2010, pero nunca excavado del todo, y su superficie ha dado asas de jarras selladas para el rey."
    - "La fama de la ciudad es el día de Goliat. «Los Filisteos juntaron sus ejércitos para la guerra, y congregáronse en Sochô, que es de Judá, y asentaron el campo entre Sochô y Azeca, en Ephes-dammim», mientras Saúl e Israel acampaban junto al valle de Ela, cada ejército sobre un monte con el valle entre ellos; la Biblia sinodal escribe allí el nombre como Sucot. Roboam, al fortificar Judá, edificó Soco con Bet-sur y Adulam, y en los días de Acaz los filisteos invadieron la llanura «y habían tomado á Beth-semes, á Ajalón, Gederoth, y Sochô con sus aldeas»."
    - "Soco fue uno de los cuatro nombres, con Hebrón, Zif y Mmst, estampados en las jarras reales del reinado de Ezequías halladas por todo Judá. Se debate a qué Soco se refiere: N. Na'aman lo identificó con este, lo que haría de la ciudad un centro de los almacenes del reino, mientras que A. F. Rainey se inclinó por el Soco de la región montañosa. Eusebio conocía Soco como dos aldeas, alta y baja, en el noveno miliario del camino de Eleuterópolis a Jerusalén, y la Misná recuerda al sabio Antígono de Soco, aunque no dice cuál Soco era su patria. Hoy el montículo se alza sobre la carretera del valle de Ela, en la región israelí de Adulam, con Khirbet Qeiyafa, ya excavado, y Tel Azeca a la vista."
  pt:
    - "Socó era uma cidade de Judá na Sefelá, as colinas baixas entre as montanhas de Judá e a planície filisteia. É identificada, sem disputa, com Tel Socó (Khirbet Shuweikeh), um monte no lado sul do vale de Elá, a cerca de 27 km a sudoeste de Jerusalém, que conserva o nome antigo; Azeca fica do outro lado do vale, a noroeste, e Khirbet Qeiyafa na serra oposta. Josué a lista com Jarmute, Adulão e Azeca entre as cidades da planície; outra Socó ficava na região montanhosa perto de Hebrom, e uma terceira nos distritos de Salomão, no norte. O tel foi prospectado, mais recentemente em 2010, mas nunca escavado por completo, e sua superfície rendeu alças de jarros carimbadas para o rei."
    - "A fama da cidade vem do dia de Golias. “Ora, os filisteus reuniram os seus exércitos para a guerra; juntaram-se em Socó, que pertence a Judá, e acamparam entre Socó e Azeca, em Efes-Damim”, enquanto Saul e Israel acampavam junto ao vale de Elá, cada exército num monte, com o vale entre eles; a Bíblia Sinodal escreve ali o nome como Sucote. Roboão, fortificando Judá, construiu Socó com Bete-Zur e Adulão, e nos dias de Acaz os filisteus invadiram a planície e “haviam tomado Bete-Semes, Aijalom, Gederote, Socó com as suas aldeias”."
    - "Socó foi um dos quatro nomes, com Hebrom, Zife e Mmst, carimbados nos jarros reais do reinado de Ezequias encontrados por todo Judá. Qual Socó se tem em vista é debatido: N. Na'aman a identificou com esta, o que faria da cidade um centro dos armazéns do reino, enquanto A. F. Rainey se voltou para a Socó da região montanhosa. Eusébio conhecia Soco como duas aldeias, alta e baixa, no nono marco da estrada de Eleuterópolis a Jerusalém, e a Mixná recorda o sábio Antígono de Soco, embora não diga de qual Socó era natural. O monte hoje domina a estrada do vale de Elá, na região israelense de Adulão, com Khirbet Qeiyafa, já escavada, e Tel Azeca à vista."
  de:
    - "Socho war eine Stadt Judas in der Schefela, dem Hügelland zwischen dem judäischen Bergland und der Philisterebene. Es wird unbestritten mit Tel Socoh (Khirbet Shuweikeh) gleichgesetzt, einem Hügel an der Südseite des Elatals etwa 27 km südwestlich von Jerusalem, der den antiken Namen bewahrt; Aseka liegt jenseits des Tals im Nordwesten und Khirbet Qeiyafa auf dem gegenüberliegenden Höhenrücken. Josua zählt es mit Jarmut, Adullam und Aseka zu den Städten der Tiefebene; ein anderes Socho lag im Bergland bei Hebron, ein drittes in Salomos Bezirken im Norden. Der Tel wurde zuletzt 2010 vermessen, aber nie vollständig ausgegraben, und an seiner Oberfläche fanden sich Krughenkel mit königlichem Stempel."
    - "Berühmt wurde die Stadt durch den Tag Goliats. „Die Philister sammelten ihre Heere zum Streit und kamen zusammen zu Socho in Juda und lagerten sich zwischen Socho und Aseka bei Ephes-Dammim“, während Saul und Israel am Elatal lagerten, jedes Heer auf einem Berg, das Tal zwischen ihnen; die Synodalbibel schreibt den Namen dort Sukkot. Rehabeam baute bei der Befestigung Judas Socho mit Bet-Zur und Adullam aus, und zur Zeit des Ahas fielen die Philister in die Tiefebene ein „und gewannen Beth-Semes, Ajalon, Gederoth und Socho mit ihren Ortschaften“."
    - "Socho war einer von vier Namen, mit Hebron, Sif und Mmst, die auf den königlichen Krughenkeln aus der Zeit Hiskias gestempelt sind, die in ganz Juda gefunden wurden. Welches Socho gemeint ist, ist umstritten: N. Na'aman sah darin dieses, womit die Stadt ein Zentrum der Vorratshaltung des Königreichs gewesen wäre; A. F. Rainey dachte an das Socho im Bergland. Eusebius kannte Socho als zwei Dörfer, ein oberes und ein unteres, am neunten Meilenstein der Straße von Eleutheropolis nach Jerusalem, und die Mischna erinnert an den Weisen Antigonos von Socho, doch wird nicht gesagt, welches Socho seine Heimat war. Der Hügel erhebt sich heute über der Straße durch das Elatal in Israels Region Adullam, mit dem ausgegrabenen Khirbet Qeiyafa und Tel Aseka in Sichtweite."
  fr:
    - "Soco était une ville de Juda dans la Shéphéla, les basses collines entre les monts de Judée et la plaine philistine. On l’identifie, sans contestation, à Tel Soco (Khirbet Shuweikeh), un tertre du côté sud de la vallée d’Éla, à environ 27 km au sud-ouest de Jérusalem, qui garde le nom antique ; Azéka se dresse de l’autre côté de la vallée au nord-ouest, et Khirbet Qeiyafa sur la crête opposée. Josué la range avec Jarmuth, Adullam et Azéka parmi les villes de la plaine ; une autre Soco se trouvait dans la montagne près d’Hébron, et une troisième dans les districts de Salomon au nord. Le tell a été prospecté, la dernière fois en 2010, mais jamais entièrement fouillé, et sa surface a livré des anses de jarres estampillées pour le roi."
    - "La renommée de la ville tient au jour de Goliath. « Les Philistins réunirent leurs armées pour faire la guerre, et ils se rassemblèrent à Soco, qui appartient à Juda ; ils campèrent entre Soco et Azéka, à Éphès-Dammim », tandis que Saül et Israël campaient près de la vallée d’Éla, chaque armée sur une montagne, la vallée entre elles ; la Bible synodale y écrit le nom Succoth. Roboam, fortifiant Juda, bâtit Soco avec Beth-Tsur et Adullam, et du temps d’Achaz les Philistins envahirent la plaine : « ils prirent Beth-Schémesch, Ajalon, Guedéroth, Soco et les villes de son ressort »."
    - "Soco était l’un des quatre noms, avec Hébron, Ziph et Mmst, estampillés sur les jarres royales du règne d’Ézéchias, trouvées dans tout Juda. Quel Soco est visé est débattu : N. Na’aman y voyait celui-ci, ce qui ferait de la ville un centre des réserves du royaume, tandis qu’A. F. Rainey pensait au Soco de la montagne. Eusèbe connaissait Socho comme deux villages, haut et bas, à la neuvième borne de la route d’Éleuthéropolis à Jérusalem, et la Mishna se souvient du sage Antigone de Soco, sans dire de quel Soco il était. Le tertre domine aujourd’hui la route de la vallée d’Éla, dans la région israélienne d’Adullam, avec Khirbet Qeiyafa, fouillé, et Tel Azéka en vue."
  pl:
    - "Soko było miastem w Judzie na Szefeli, niskich wzgórzach między górami Judei a równiną filistyńską. Utożsamia się je bez sporu z Tel Soko (Chirbet Szuwejka), kopcem po południowej stronie doliny Ela, około 27 km na południowy zachód od Jerozolimy, który zachowuje starożytną nazwę; Azeka stoi po drugiej stronie doliny na północnym zachodzie, a Chirbet Kajafa na przeciwległym grzbiecie. Jozue wymienia je razem z Jarmutem, Adullam i Azeką wśród miast nizin; inne Soko leżało w górach koło Hebronu, a trzecie w okręgach Salomona na północy. Tel został zbadany powierzchniowo, ostatnio w 2010 roku, ale nigdy nie został w pełni przebadany wykopaliskami, a na jego powierzchni znaleziono uchwyty dzbanów z pieczęcią królewską."
    - "Sławę miasta zawdzięcza dniowi Goliata. „Tedy zebrali Filistynowie wojska swe, aby walczyli, a zeszli się u Sochot, które jest w Judzie, i położyli się obozem między Sochotem i między Asekiem na granicach Domim”, a Saul i Izrael stanęli przy dolinie Ela, każde wojsko na górze, z doliną między nimi; Biblia synodalna pisze tu to imię jako Sukkot. Roboam, umacniając Judę, zbudował Soko wraz z Bet-Sur i Adullam, a za dni Achaza Filistynowie wtargnęli do miast w nizinie, „a wzięli Betsemes, i Ajalon, i Gaderot, i Sokot i wsi jego”."
    - "Soko było jedną z czterech nazw, obok Hebronu, Zifu i Mmst, odciśniętych na królewskich dzbanach z czasów Ezechiasza, znajdowanych w całej Judzie. Które Soko ma się na myśli, jest przedmiotem sporu: N. Na'aman uznawał, że chodzi o to Soko, a wtedy miasto byłoby ośrodkiem magazynów królestwa, A. F. Rainey zaś wskazywał Soko w górach. Euzebiusz znał Socho jako dwie wsie, górną i dolną, przy dziewiątym kamieniu milowym drogi z Eleuteropolis do Jerozolimy, a Miszna pamięta mędrca Antygona z Soko, choć nie mówi, które Soko było jego domem. Kopiec stoi dziś nad drogą doliny Ela w izraelskim regionie Adullam, a wykopaliska Chirbet Kajafa i Tel Azeka są w zasięgu wzroku."
  it:
    - "Soco era una città di Giuda nella Sefela, le basse colline tra i monti della Giudea e la pianura filistea. È identificata, senza controversie, con Tel Soco (Khirbet Shuweikeh), un tell sul lato meridionale della valle di Ela, a circa 27 km a sud-ovest di Gerusalemme, che conserva l’antico nome; Azeka sta di fronte, a nord-ovest, e Khirbet Qeiyafa sul crinale opposto. Giosuè la elenca con Iarmut, Adullam e Azeka fra le città della pianura; un altro Soco si trovava sulle alture presso Ebron, e un terzo nei distretti di Salomone al nord. Il tell è stato esplorato, da ultimo nel 2010, ma mai scavato a fondo, e in superficie ha restituito anse di giare con il bollo del re."
    - "La fama della città è il giorno di Golia. «Or i Filistei misero insieme i loro eserciti per combattere, si radunarono a Soco, che appartiene a Giuda, e si accamparono fra Soco e Azeka, a Efes-Dammim», mentre Saul e Israele si accampavano presso la valle di Ela, ogni esercito su un monte con la valle in mezzo; la Bibbia sinodale scrive lì il nome come Succot. Roboamo, fortificando Giuda, costruì Soco con Bet-Zur e Adullam, e al tempo di Acaz i Filistei invasero la pianura «e avean preso Beth-Scemesh, Ajalon, Ghederoth, Soco e le città che ne dipendevano»."
    - "Soco era uno dei quattro nomi, con Ebron, Zif e Mmst, impressi sulle giare reali del regno di Ezechia trovate in tutta la Giudea. Quale Soco sia intesa è discusso: N. Na‘aman la identificò con questa, il che farebbe della città un centro dei magazzini del regno, mentre A. F. Rainey guardava alla Soco della regione montuosa. Eusebio conosceva Soco come due villaggi, superiore e inferiore, al nono miglio della strada da Eleuteropoli a Gerusalemme, e la Mishnà ricorda il saggio Antigono di Soco, senza dire quale Soco fosse la sua patria. Il tell sorge oggi sopra la strada della valle di Ela, nella regione israeliana di Adullam, con Khirbet Qeiyafa, già scavata, e Tel Azeka in vista."
  nl:
    - "Socho was een stad van Juda in de Sefela, de lage heuvels tussen het Judese bergland en de Filistijnse vlakte. Het wordt zonder betwisting vereenzelvigd met Tel Socho (Khirbet Shuweikeh), een heuvel aan de zuidkant van de Elavallei, ongeveer 27 km ten zuidwesten van Jeruzalem, die de oude naam bewaart; Azeka ligt aan de overkant van het dal naar het noordwesten en Khirbet Qeiyafa op de tegenoverliggende bergrug. Jozua noemt het met Jarmut, Adullam en Azeka onder de steden van de laagvlakte; een ander Socho lag in het bergland bij Hebron, en een derde in de districten van Salomo in het noorden. De tel is onderzocht, voor het laatst in 2010, maar nooit volledig opgegraven, en aan het oppervlak zijn kruikhengsels met een koninklijke stempel gevonden."
    - "De roem van de stad is de dag van Goliat. “En de Filistijnen verzamelden hun heir ten strijde, en verzamelden zich te Socho, dat in Juda is; en zij legerden zich tussen Socho en tussen Azeka, aan het einde van Dammim”, terwijl Saul en Israël zich legerden bij de Elavallei, elk leger op een berg met het dal ertussen; de Synodale Bijbel schrijft de naam daar als Sukkot. Rehabeam, die Juda versterkte, bouwde Socho met Beth-Zur en Adullam, en in de dagen van Achaz vielen de Filistijnen de laagvlakte binnen en “hadden ingenomen Beth-Semes, en Ajalon, en Gederoth, en Socho en haar onderhorige plaatsen”."
    - "Socho was een van de vier namen, met Hebron, Zif en Mmst, die waren ingedrukt op de koninklijke kruiken uit het bewind van Chizkia die overal in Juda zijn gevonden. Welk Socho bedoeld is, wordt besproken: N. Na'aman zag er dit Socho in, waarmee de stad een centrum van de voorraden van het koninkrijk zou zijn geweest, terwijl A. F. Rainey dacht aan het Socho in het bergland. Eusebius kende Socho als twee dorpen, een boven- en een benedendorp, bij de negende mijlpaal aan de weg van Eleutheropolis naar Jeruzalem, en de Misjna herinnert aan de wijze Antigonus van Socho, al wordt niet gezegd welk Socho zijn woonplaats was. De heuvel staat tegenwoordig boven de weg door de Elavallei in de Israëlische regio Adullam, met het opgegraven Khirbet Qeiyafa en Tel Azeka in zicht."
  cs:
    - "Sókó bylo město Judy v Šefele, nízkých pahorcích mezi judskými horami a pelištejskou rovinou. Je bez sporu ztotožňováno s Tel Sókó (Chirbet Šuwejke), pahorkem na jižní straně údolí Éla asi 27 km jihozápadně od Jeruzaléma, který si zachoval starověké jméno; Azeka stojí přes údolí na severozápadě a Chirbet Qejafa na protilehlém hřbetu. Jozue je uvádí s Jarmutem, Adulamem a Azekou mezi městy nížiny; další Sókó leželo v pohoří poblíž Hebronu a třetí v Šalomounových okresech na severu. Tel byl zkoumán povrchovým průzkumem, naposledy v roce 2010, ale nikdy nebyl úplně vykopán a na jeho povrchu se našla ucha džbánů s královskou pečetí."
    - "Slávu městu dává den Goliášův. „I sebrali Filistinští vojska svá k boji, a shromáždili se u Socho, kteréž jest Judovo, a položili se mezi Socho a Azeka na pomezí Dammim“, zatímco Saul a Izrael tábořili u údolí Éla, každé vojsko na hoře a údolí mezi nimi; synodální překlad tam píše jméno jako Sukot. Rechabeám při opevňování Judy vystavěl Sókó s Bét-curem a Adulamem a za dnů Achazových vpadli Pelištejci do nížiny a „vzali Betsemes a Aialon, a Gederot a Socho i vsi jeho“."
    - "Sókó bylo jedním ze čtyř jmen, spolu s Hebronem, Zífem a Mmst, vyražených na královských džbánech z doby Chizkijášovy, nalezených po celé Judě. Které Sókó je míněno, je sporné: N. Na'aman je ztotožňoval s tímto, a pak by město bylo střediskem zásob království, kdežto A. F. Rainey hledal Sókó v pohoří. Eusebius znal Sókó jako dvě vesnice, horní a dolní, u devátého milníku na silnici z Eleutheropole do Jeruzaléma, a Mišna připomíná mudrce Antigona ze Sókó, i když se neříká, které Sókó bylo jeho domovem. Pahorek dnes stojí nad silnicí údolím Éla v izraelské oblasti Adulam, s vykopaným Chirbet Qejafa a Tel Azeka na dohled."
