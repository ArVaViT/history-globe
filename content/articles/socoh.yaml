# Overview article (ADR 0007). Mainstream facts only; the identification with Tel Socoh is undisputed; the Synodal "Сокхоф" of 1 Samuel 17 is noted as a spelling of the same town.
id: socoh
place: a39a6b9
title:
  en: "Socoh"
  ru: "Сохо"
  uk: "Сохо"
  es: "Soco"
  pt: "Socó"
  de: "Socho"
  fr: "Soco"
body:
  en:
    - "Socoh was a town of Judah in the Shephelah, the low hills between the Judean mountains and the Philistine plain. It is identified, without dispute, with Tel Socoh (Khirbet Shuweikeh), a mound on the south side of the valley of Elah about 27 km south-west of Jerusalem, which keeps the ancient name; Azekah stands across the valley to the north-west and Khirbet Qeiyafa on the ridge opposite. Joshua lists it with Jarmuth, Adullam and Azekah among the towns of the lowland; another Socoh lay in the hill country near Hebron, and a third in Solomon's districts in the north. The tel has been surveyed, most recently in 2010, but not excavated, and its surface has yielded jar handles stamped for the king."
    - "The town's fame is the day of Goliath. “Now the Philistines gathered together their armies to battle, and were gathered together at Shochoh, which belongeth to Judah, and pitched between Shochoh and Azekah, in Ephes-dammim”, while Saul and Israel camped in the valley of Elah with the brook between the two camps; the Synodal Bible there writes the name as Succoth. Rehoboam, fortifying Judah, built Socoh with Beth-zur and Adullam, and in the days of Ahaz the Philistines invaded the lowland “and had taken Beth-shemesh, and Ajalon, and Gederoth, and Shocho with the villages thereof”."
    - "Socoh was one of the four names, with Hebron, Ziph and Mmst, stamped on the royal jars of Hezekiah's reign found all over Judah, so the town was then a centre of the kingdom's stores, perhaps for the vineyards of the Elah valley. Eusebius knew Socho as two villages, upper and lower, at the ninth milestone on the road from Eleutheropolis to Jerusalem, and the Mishnah remembers the sage Antigonus of Socho, though which Socoh was his home is not said. The mound today stands above the Elah valley road in Israel's Adullam region, with the excavated Khirbet Qeiyafa and Tel Azekah within sight."
  ru:
    - "Сохо — город Иуды в Шефеле, низких холмах между Иудейскими горами и Филистимской равниной. Его бесспорно отождествляют с Тель-Сохо (Хирбет-Шувейке), холмом на южной стороне долины Дуба (Елах) примерно в 27 км к юго-западу от Иерусалима, сохранившим древнее имя; через долину к северо-западу стоит Азека, а на гребне напротив — Хирбет-Кейафа. Книга Иисуса Навина числит его с Иармуфом, Одолламом и Азекой среди городов низменности; другой Сохо лежал в горах близ Хеврона, третий — в северных областях Соломона. Холм обследован, в последний раз в 2010 году, но не раскопан, и его поверхность дала ручки кувшинов с царской печатью."
    - "Слава города — день Голиафа. «Филистимляне собрали войска свои для войны и собрались в Сокхофе, что в Иудее, и расположились станом между Сокхофом и Азеком в Ефес-Даммиме», а Саул и Израильтяне стали в долине дуба, и между станами был поток; Синодальный перевод пишет здесь имя как Сокхоф. Ровоам, укрепляя Иудею, обнёс стенами Сохо вместе с Вефцуром и Одолламом, а во дни Ахаза Филистимляне рассыпались по низменности «и взяли Вефсамис и Аиалон, и Гедероф и Сохо и зависящие от него города»."
    - "Сохо — одно из четырёх имён, вместе с Хевроном, Зифом и Ммшт, оттиснутых на царских кувшинах времён Езекии, найденных по всей Иудее, так что город был тогда одним из складских центров царства, быть может, при виноградниках долины Елах. Евсевий знал Сохо как два селения, верхнее и нижнее, у девятого милевого столба на дороге из Елевферополя в Иерусалим, а Мишна помнит мудреца Антигона из Сохо, не говоря, впрочем, который Сохо был его родиной. Холм сегодня стоит над дорогой долины Елах в израильском округе Адуллам, в виду раскопанных Хирбет-Кейафы и Тель-Азеки."
  uk:
    - "Сохо було містом Юди в Шефелі, низьких пагорбах між юдейськими горами та філістимською рівниною. Його без суперечок ототожнюють з Тель-Сохо (Хірбет-Шувейка), пагорбом на південному боці долини Дуба приблизно за 27 км на південний захід від Єрусалима, що зберігає давню назву; Азека стоїть через долину на північний захід, а Хірбет-Кеяфа на протилежному гребені. Ісус Навин зараховує його разом з Ярмутом, Одолламом і Азекою до міст низовини; інше Сохо лежало в гірській країні поблизу Хеврона, а третє — в округах Соломона на півночі. Тель обстежено, востаннє 2010 року, але не розкопано, і на його поверхні знайдено ручки глеків з царськими печатками."
    - "Слава міста — день Голіята. «Филистії зібрали своє військо до бою, та й зійшлись в Сохотї, що в Юдеї, та й отаборились під Ефес-Даммимом між Сохотом і Азеком», а Саул з Ізраїлем отаборилися в долині Дуба, і між двома таборами був потік; Синодальний переклад пише там назву як Сокхот. Ровоам, укріплюючи Юду, збудував Сохо разом з Бет-Цуром і Одолламом, а за днів Ахаза филистимляни вдерлися в низовину й «взяли Бетсамис і Аялон, і Гедерот, і Сохо та залежні від його міста»."
    - "Сохо було одним із чотирьох імен, поряд з Хевроном, Зіфом і Ммст, відтиснених на царських глеках часів Єзекії, знайдених по всій Юдеї, отож місто було тоді осередком царських запасів, можливо, для виноградників долини Дуба. Євсевій знав Сохо як два села, верхнє й нижнє, на дев’ятій милі дороги від Елевтеополя до Єрусалима, а Мішна пам’ятає мудреця Антигона із Сохо, хоч не сказано, яке Сохо було його домівкою. Нині пагорб здіймається над дорогою долини Дуба в ізраїльському районі Адулам, а розкопані Хірбет-Кеяфа та Тель-Азека видно з нього."
  es:
    - "Soco era una ciudad de Judá en la Sefelá, las colinas bajas entre las montañas de Judea y la llanura filistea. Se identifica, sin discusión, con Tel Soco (Khirbet Shuweikeh), un montículo en el lado sur del valle de Ela, a unos 27 km al suroeste de Jerusalén, que conserva el nombre antiguo; Azeca está al otro lado del valle, al noroeste, y Khirbet Qeiyafa en la cresta de enfrente. Josué la enumera con Jarmut, Adulam y Azeca entre las ciudades de la llanura; otra Soco estaba en la región montañosa cerca de Hebrón, y una tercera en los distritos de Salomón, en el norte. El tel ha sido prospectado, la última vez en 2010, pero no excavado, y su superficie ha dado asas de jarras selladas para el rey."
    - "La fama de la ciudad es el día de Goliat. «Los Filisteos juntaron sus ejércitos para la guerra, y congregáronse en Sochô, que es de Judá, y asentaron el campo entre Sochô y Azeca, en Ephes-dammim», mientras Saúl e Israel acampaban en el valle de Ela con el torrente entre los dos campamentos; la Biblia sinodal escribe allí el nombre como Sucot. Roboam, al fortificar Judá, edificó Soco con Bet-sur y Adulam, y en los días de Acaz los filisteos invadieron la llanura «y habían tomado á Beth-semes, á Ajalón, Gederoth, y Sochô con sus aldeas»."
    - "Soco fue uno de los cuatro nombres, con Hebrón, Zif y Mmst, estampados en las jarras reales del reinado de Ezequías halladas por todo Judá, de modo que la ciudad era entonces un centro de los almacenes del reino, quizá para las viñas del valle de Ela. Eusebio conocía Soco como dos aldeas, alta y baja, en el noveno miliario del camino de Eleuterópolis a Jerusalén, y la Misná recuerda al sabio Antígono de Soco, aunque no dice cuál Soco era su patria. Hoy el montículo se alza sobre la carretera del valle de Ela, en la región israelí de Adulam, con Khirbet Qeiyafa, ya excavado, y Tel Azeca a la vista."
  pt:
    - "Socó era uma cidade de Judá na Sefelá, as colinas baixas entre as montanhas de Judá e a planície filisteia. É identificada, sem disputa, com Tel Socó (Khirbet Shuweikeh), um monte no lado sul do vale de Elá, a cerca de 27 km a sudoeste de Jerusalém, que conserva o nome antigo; Azeca fica do outro lado do vale, a noroeste, e Khirbet Qeiyafa na serra oposta. Josué a lista com Jarmute, Adulão e Azeca entre as cidades da planície; outra Socó ficava na região montanhosa perto de Hebrom, e uma terceira nos distritos de Salomão, no norte. O tel foi prospectado, mais recentemente em 2010, mas não escavado, e sua superfície rendeu alças de jarros carimbadas para o rei."
    - "A fama da cidade vem do dia de Golias. “Ora, os filisteus reuniram os seus exércitos para a guerra; juntaram-se em Socó, que pertence a Judá, e acamparam entre Socó e Azeca, em Efes-Damim”, enquanto Saul e Israel acampavam no vale de Elá, com o ribeiro entre os dois campos; a Bíblia Sinodal escreve ali o nome como Sucote. Roboão, fortificando Judá, construiu Socó com Bete-Zur e Adulão, e nos dias de Acaz os filisteus invadiram a planície e “haviam tomado Bete-Semes, Aijalom, Gederote, Socó com as suas aldeias”."
    - "Socó foi um dos quatro nomes, com Hebrom, Zife e Mmst, carimbados nos jarros reais do reinado de Ezequias encontrados por todo Judá; a cidade era então um centro dos armazéns do reino, talvez para as vinhas do vale de Elá. Eusébio conhecia Soco como duas aldeias, alta e baixa, no nono marco da estrada de Eleuterópolis a Jerusalém, e a Mixná recorda o sábio Antígono de Soco, embora não diga de qual Socó era natural. O monte hoje domina a estrada do vale de Elá, na região israelense de Adulão, com Khirbet Qeiyafa, já escavada, e Tel Azeca à vista."
  de:
    - "Socho war eine Stadt Judas in der Schefela, dem Hügelland zwischen dem judäischen Bergland und der Philisterebene. Es wird unbestritten mit Tel Socoh (Khirbet Shuweikeh) gleichgesetzt, einem Hügel an der Südseite des Elatals etwa 27 km südwestlich von Jerusalem, der den antiken Namen bewahrt; Aseka liegt jenseits des Tals im Nordwesten und Khirbet Qeiyafa auf dem gegenüberliegenden Höhenrücken. Josua zählt es mit Jarmut, Adullam und Aseka zu den Städten der Tiefebene; ein anderes Socho lag im Bergland bei Hebron, ein drittes in Salomos Bezirken im Norden. Der Tel wurde zuletzt 2010 vermessen, aber nicht ausgegraben, und an seiner Oberfläche fanden sich Krughenkel mit königlichem Stempel."
    - "Berühmt wurde die Stadt durch den Tag Goliats. „Die Philister sammelten ihre Heere zum Streit und kamen zusammen zu Socho in Juda und lagerten sich zwischen Socho und Aseka bei Ephes-Dammim“, während Saul und Israel im Elatal lagerten, den Bach zwischen den beiden Lagern; die Synodalbibel schreibt den Namen dort Sukkot. Rehabeam baute bei der Befestigung Judas Socho mit Bet-Zur und Adullam aus, und zur Zeit des Ahas fielen die Philister in die Tiefebene ein „und gewannen Beth-Semes, Ajalon, Gederoth und Socho mit ihren Ortschaften“."
    - "Socho war einer von vier Namen, mit Hebron, Sif und Mmst, die auf den königlichen Krughenkeln aus der Zeit Hiskias gestempelt sind, die in ganz Juda gefunden wurden; die Stadt war damals also ein Zentrum der Vorratshaltung des Königreichs, vielleicht für die Weinberge des Elatals. Eusebius kannte Socho als zwei Dörfer, ein oberes und ein unteres, am neunten Meilenstein der Straße von Eleutheropolis nach Jerusalem, und die Mischna erinnert an den Weisen Antigonos von Socho, doch wird nicht gesagt, welches Socho seine Heimat war. Der Hügel erhebt sich heute über der Straße durch das Elatal in Israels Region Adullam, mit dem ausgegrabenen Khirbet Qeiyafa und Tel Aseka in Sichtweite."
  fr:
    - "Soco était une ville de Juda dans la Shéphéla, les basses collines entre les monts de Judée et la plaine philistine. On l’identifie, sans contestation, à Tel Soco (Khirbet Shuweikeh), un tertre du côté sud de la vallée d’Éla, à environ 27 km au sud-ouest de Jérusalem, qui garde le nom antique ; Azéka se dresse de l’autre côté de la vallée au nord-ouest, et Khirbet Qeiyafa sur la crête opposée. Josué la range avec Jarmuth, Adullam et Azéka parmi les villes de la plaine ; une autre Soco se trouvait dans la montagne près d’Hébron, et une troisième dans les districts de Salomon au nord. Le tell a été prospecté, la dernière fois en 2010, mais non fouillé, et sa surface a livré des anses de jarres estampillées pour le roi."
    - "La renommée de la ville tient au jour de Goliath. « Les Philistins réunirent leurs armées pour faire la guerre, et ils se rassemblèrent à Soco, qui appartient à Juda ; ils campèrent entre Soco et Azéka, à Éphès-Dammim », tandis que Saül et Israël campaient dans la vallée d’Éla, le torrent entre les deux camps ; la Bible synodale y écrit le nom Succoth. Roboam, fortifiant Juda, bâtit Soco avec Beth-Tsur et Adullam, et du temps d’Achaz les Philistins envahirent la plaine : « ils prirent Beth-Schémesch, Ajalon, Guedéroth, Soco et les villes de son ressort »."
    - "Soco était l’un des quatre noms, avec Hébron, Ziph et Mmst, estampillés sur les jarres royales du règne d’Ézéchias, trouvées dans tout Juda : la ville était alors un centre des réserves du royaume, peut-être pour les vignobles de la vallée d’Éla. Eusèbe connaissait Socho comme deux villages, haut et bas, à la neuvième borne de la route d’Éleuthéropolis à Jérusalem, et la Mishna se souvient du sage Antigone de Soco, sans dire de quelle Soco il était. Le tertre domine aujourd’hui la route de la vallée d’Éla, dans la région israélienne d’Adullam, avec Khirbet Qeiyafa, fouillé, et Tel Azéka en vue."
