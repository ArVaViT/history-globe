body:
  en:
    - 'Moab is the tableland east of the Dead Sea, a plateau some 900 m high that falls steeply to the sea and is cut by the deep gorges of the Arnon (Wadi Mujib) and the Zered (Wadi Hasa), its southern border with Edom. Its heartland lay between the two gorges around Kir-hareseth (Kerak); the plain north of the Arnon, with Dibon, Medeba, Nebo and Heshbon, was long disputed with Israel. The land grows grain and pasture: Mesha, king of Moab, "was a sheepmaster". Genesis traces the Moabites to Lot''s elder daughter, and the Moabite language, known from the Mesha Stele, is a close relative of Hebrew.'
    - 'At the end of the wanderings Israel camped in the plains of Moab opposite Jericho, and Balak, king of Moab, hired Balaam to curse them; Balaam blessed instead and foresaw a sceptre out of Israel that "shall smite the corners of Moab". Israel was told not to attack Moab, "because I have given Ar unto the children of Lot". Moses died "in the land of Moab" on Mount Nebo. In the time of the judges Eglon of Moab oppressed Israel eighteen years until Ehud killed him; Elimelech''s family went to sojourn there, and Ruth the Moabitess became the great-grandmother of David, who later left his parents with the king of Moab, yet as king made the Moabites his servants.'
    - 'After Ahab died "the king of Moab rebelled against the king of Israel", and Jehoram, Jehoshaphat and the king of Edom marched against him; when Mesha was hemmed in he offered his eldest son as a burnt offering on the wall, and Israel withdrew. Mesha''s own account survives on the basalt stele found at Dhiban in 1868 and now in the Louvre: it tells how Omri had oppressed Moab, how Mesha took back Medeba, Nebo and other towns for his god Chemosh and built cities and cisterns. One damaged line is read by some as "house of David", which others doubt. Moab paid tribute to Tiglath-pileser III, Sennacherib and Esarhaddon, and Moabite bands harried Judah in the days of Jehoiakim. Isaiah, Jeremiah, Amos, Ezekiel and Zephaniah pronounced judgement on Moab, which "hath been at ease from his youth".'
    - "Nabonidus campaigned in the region in 553 BC, and Moab disappears as a kingdom; Arabs and later the Nabataeans held the plateau, which passed into the Roman province of Arabia in AD 106. Eusebius still knew Moab as a city of Arabia, by then called Areopolis, whose land was also called Moab. Today it is central Jordan, the governorates of Madaba and Karak, with the Crusader castle of Kerak, the mosaic map at Madaba and the ruins at Dhiban."
  ru:
    - "Моав — плоскогорье к востоку от Мёртвого моря, плато высотой около 900 м, круто обрывающееся к морю и прорезанное глубокими ущельями Арнона (Вади-Муджиб) и Зареда (Вади-Хаса), южной границы с Едомом. Сердце страны лежало между двумя ущельями вокруг Кирхарешета (Керака); равнина к северу от Арнона с Дивоном, Медевой, Нево и Есевоном долго была предметом спора с Израилем. Земля даёт хлеб и пастбища: Меса, царь Моавитский, «был богат скотом». Книга Бытия возводит Моавитян к старшей дочери Лота, а моавитский язык, известный по стеле Меши, — близкий родственник еврейского."
    - "В конце странствий Израиль стал станом на равнинах Моавитских против Иерихона, и Валак, царь Моавитский, нанял Валаама проклясть его; Валаам вместо того благословил и предрёк жезл от Израиля, который «разит князей Моава». Израилю было велено не воевать с Моавом, «потому что Ар отдал Я во владение сынам Лотовым». Моисей умер «в земле Моавитской» на горе Нево. Во времена судей Еглон, царь Моавитский, восемнадцать лет угнетал Израиль, пока его не убил Аод; семья Елимелеха пошла жить на поля Моавитские, и Руфь Моавитянка стала прабабушкой Давида, который позже оставил родителей у царя Моавитского, но, став царём, сделал Моавитян своими данниками."
    - "После смерти Ахава «царь Моавитский отложился от царя Израильского», и Иорам, Иосафат и царь Едомский выступили против него; когда Месу окружили, он вознёс своего первенца во всесожжение на стене, и Израиль отступил. Собственный рассказ Месы сохранился на базальтовой стеле, найденной в Дивоне в 1868 году и ныне хранящейся в Лувре: в ней говорится, как Амврий угнетал Моав, как Меса вернул Медеву, Нево и другие города своему богу Хамосу и строил города и водоёмы. Одну повреждённую строку некоторые читают как «дом Давида», другие это оспаривают. Моав платил дань Феглаффелласару III, Сеннахириму и Асардану, а полчища Моавитян тревожили Иудею во дни Иоакима. Исаия, Иеремия, Амос, Иезекииль и Софония возвещали суд Моаву, который «от юности своей был в покое»."
    - "Набонид воевал в этих краях в 553 г. до н. э., и Моав исчезает как царство; плато держали арабы, а затем Набатеи, и в 106 г. н. э. оно вошло в римскую провинцию Аравия. Евсевий ещё знал Моав как город Аравии, называвшийся уже Ареополем, земля которого тоже звалась Моавом. Сегодня это центральная Иордания, провинции Мадаба и Эль-Карак, с крестоносным замком Керак, мозаичной картой в Мадабе и развалинами в Дибане."
  uk:
    - "Моав — плоскогір’я на схід від Мертвого моря, плато заввишки близько 900 м, що круто спадає до моря й розсічене глибокими ущелинами Арнону (Ваді-Муджиб) і Заред (Ваді-Хаса), його південного кордону з Едомом. Його осердя лежало між двома ущелинами навколо Кір-Харешета (Керак); рівнина на північ від Арнону, з Дівоном, Мадабою, Нево й Гесбоном, довго була предметом суперечки з Ізраїлем. Край родить зерно й пасовища: Меша, цар Моаву, «мав великі стада». Книга Буття виводить моавитян від старшої дочки Лота, а моавитська мова, відома зі стели Меші, близька до староєврейської."
    - "Наприкінці блукань Ізраїль отаборився на рівнинах Моаву навпроти Єрихону, і Валак, цар Моаву, найняв Валаама прокляти їх; Валаам натомість благословив і побачив берло з Ізраїля, що «поламле Моабіям роги». Ізраїлеві було сказано не нападати на Моав, «бо віддав я Ар синам Лотовим у державу». Мойсей помер «у Моаб землї» на горі Нево. За часів суддів Еглон Моавитський гнобив Ізраїль вісімнадцять років, аж поки Егуд не вбив його; родина Елімелеха пішла пожити там, і Рут моавитянка стала прабабою Давида, який згодом залишив своїх батьків у царя Моаву, але як цар зробив моавитян своїми слугами."
    - "Після смерті Ахава «відпав царь Моабійський від царя Ізрайлевого», і Йорам, Йосафат та цар Едому пішли проти нього; коли Мешу було обложено, він приніс свого перворідного сина на мурі, і Ізраїль відступив. Власна розповідь Меші зберігається на базальтовій стелі, знайденій у Дібані 1868 р. і нині в Луврі: вона розказує, як Омрі гнобив Моав, як Меша повернув Мадабу, Нево й інші міста для свого бога Хемоша й збудував міста та цистерни. Один пошкоджений рядок дехто читає як «дім Давида», що інші ставлять під сумнів. Моав платив данину Тіглатпаласару III, Сінаххерібу й Асархаддону, а моавитські загони турбували Юду за днів Йоакима. Ісая, Єремія, Амос, Єзекіїль і Софонія виголосили суд над Моавом, який «Змалку жив Моаб у супокою»."
    - "Набонід воював у цьому краї 553 р. до н. е., і Моав зникає як царство; араби, а згодом набатеї тримали плато, яке 106 р. н. е. перейшло до римської провінції Аравії. Євсевій ще знав Моав як місто Аравії, на той час назване Ареополем, край якого теж звався Моавом. Сьогодні це центральна Йорданія, мухафази Мадаба і Карак, із замком хрестоносців Керак, мозаїчною мапою в Мадабі та руїнами в Дібані."
  es:
    - "Moab es la meseta al este del mar Muerto, una altiplanicie de unos 900 m de altura que cae abruptamente hacia el mar y está cortada por las profundas gargantas del Arnón (Wadi Mujib) y del Zered (Wadi Hasa), su frontera meridional con Edom. Su corazón se hallaba entre las dos gargantas, en torno a Kir-hareset (Kerak); la llanura al norte del Arnón, con Dibón, Medeba, Nebo y Hesbón, fue durante mucho tiempo disputada con Israel. La tierra da grano y pastos: Mesa, rey de Moab, «era propietario de ganados». Génesis hace descender a los moabitas de la hija mayor de Lot, y la lengua moabita, conocida por la Estela de Mesa, es una estrecha pariente del hebreo."
    - "Al final de las peregrinaciones, Israel acampó en las llanuras de Moab frente a Jericó, y Balac, rey de Moab, contrató a Balaam para maldecirlos; Balaam bendijo en cambio y previó un cetro de Israel que «herirá los cantones de Moab». A Israel se le dijo que no atacara a Moab, «porque yo he dado á Ar por heredad á los hijos de Lot». Moisés murió «en la tierra de Moab», en el monte Nebo. En tiempo de los jueces, Eglón de Moab oprimió a Israel dieciocho años hasta que Aod lo mató; la familia de Elimelec fue a residir allí, y Rut la moabita fue bisabuela de David, quien más tarde dejó a sus padres con el rey de Moab, aunque ya rey hizo de los moabitas sus siervos."
    - "Tras morir Acab, «el rey de Moab se rebeló contra el rey de Israel», y Joram, Josafat y el rey de Edom marcharon contra él; cuando Mesa se vio cercado, ofreció a su primogénito en holocausto sobre el muro, e Israel se retiró. El propio relato de Mesa sobrevive en la estela de basalto hallada en Dhiban en 1868 y hoy en el Louvre: cuenta cómo Omri había oprimido a Moab, cómo Mesa recuperó Medeba, Nebo y otras ciudades para su dios Quemós y construyó ciudades y cisternas. Una línea dañada es leída por algunos como «casa de David», lo que otros dudan. Moab pagó tributo a Tiglat-pileser III, Senaquerib y Esar-hadón, y bandas moabitas hostigaron a Judá en los días de Joacim. Isaías, Jeremías, Amós, Ezequiel y Sofonías pronunciaron juicio sobre Moab, que «Quieto estuvo [...] desde su mocedad»."
    - "Nabónido hizo campaña en la región en 553 a. C., y Moab desaparece como reino; los árabes y más tarde los nabateos ocuparon la meseta, que pasó a la provincia romana de Arabia en 106 d. C. Eusebio aún conocía Moab como una ciudad de Arabia, llamada ya entonces Areópolis, cuya tierra se llamaba también Moab. Hoy es el centro de Jordania, las gobernaciones de Madaba y Karak, con el castillo cruzado de Kerak, el mapa-mosaico de Madaba y las ruinas de Dhiban."
  pt:
    - "Moabe é o planalto a leste do mar Morto, uma meseta de uns 900 m de altura que cai abruptamente para o mar e é cortada pelas profundas gargantas do Arnom (Wadi Mujib) e do Zerede (Wadi Hasa), sua fronteira sul com Edom. Seu coração ficava entre as duas gargantas, em torno de Quir-Haresete (Kerak); a planície ao norte do Arnom, com Dibom, Medeba, Nebo e Hesbom, foi por muito tempo disputada com Israel. A terra produz grãos e pastagem: Mesa, rei de Moabe, “era criador de ovelhas”. Gênesis faz remontar os moabitas à filha mais velha de Ló, e a língua moabita, conhecida pela Estela de Mesa, é parente próxima do hebraico."
    - "No fim das peregrinações, Israel acampou nas planícies de Moabe defronte de Jericó, e Balaque, rei de Moabe, contratou Balaão para amaldiçoá-los; Balaão abençoou e previu um cetro que sairá de Israel e “ferirá os cantos de Moabe”. Disseram a Israel que não atacasse Moabe, “porque eu dei Ar aos filhos de Ló por possessão”. Moisés morreu “na terra de Moabe”, no monte Nebo. No tempo dos juízes, Eglom de Moabe oprimiu Israel dezoito anos até que Eúde o matou; a família de Elimeleque foi viver ali como estrangeira, e Rute, a moabita, tornou-se bisavó de Davi, que depois deixou seus pais com o rei de Moabe, mas como rei fez dos moabitas seus servos."
    - "Depois que Acabe morreu, “o rei de Moabe se rebelou contra o rei de Israel”, e Jeorão, Josafá e o rei de Edom marcharam contra ele; quando Mesa se viu cercado, ofereceu seu filho mais velho em holocausto sobre a muralha, e Israel se retirou. O próprio relato de Mesa sobrevive na estela de basalto encontrada em Dhiban em 1868 e hoje no Louvre: conta como Onri havia oprimido Moabe, como Mesa retomou Medeba, Nebo e outras cidades para seu deus Camos e construiu cidades e cisternas. Uma linha danificada é lida por alguns como “casa de Davi”, o que outros contestam. Moabe pagou tributo a Tiglate-Pileser III, Senaqueribe e Esar-Hadom, e bandos moabitas hostilizaram Judá nos dias de Jeoaquim. Isaías, Jeremias, Amós, Ezequiel e Sofonias pronunciaram juízo sobre Moabe, que “tem estado tranquilo desde a sua juventude”."
    - "Nabonido fez campanha na região em 553 a.C., e Moabe desaparece como reino; árabes e depois os nabateus ocuparam o planalto, que passou à província romana da Arábia em 106 d.C. Eusébio ainda conhecia Moabe como uma cidade da Arábia, então já chamada Areópolis, cuja terra também se chamava Moabe. Hoje é o centro da Jordânia, as províncias de Madaba e Karak, com o castelo cruzado de Kerak, o mapa-mosaico de Madaba e as ruínas de Dhiban."
  de:
    - "Moab ist das Hochland östlich des Toten Meeres, eine Hochebene von etwa 900 m Höhe, die steil zum Meer abfällt und von den tiefen Schluchten des Arnon (Wadi Mujib) und des Sered (Wadi Hasa), seiner Südgrenze zu Edom, zerschnitten wird. Sein Kernland lag zwischen den beiden Schluchten um Kir-Heres (Kerak); die Ebene nördlich des Arnon mit Dibon, Medeba, Nebo und Heschbon war lange mit Israel umstritten. Das Land trägt Getreide und Weide: Mesa, der König von Moab, „hatte viele Schafe“. Die Genesis führt die Moabiter auf Lots ältere Tochter zurück, und die moabitische Sprache, bekannt von der Mesa-Stele, ist mit dem Hebräischen eng verwandt."
    - "Am Ende der Wanderungen lagerte Israel in den Steppen Moabs gegenüber Jericho, und Balak, der König von Moab, dingte Bileam, es zu verfluchen; Bileam segnete stattdessen und sah voraus: „Es wird ein Stern aus Jakob aufgehen und ein Zepter aus Israel aufkommen und wird zerschmettern die Fürsten der Moabiter“. Israel wurde gesagt, Moab nicht anzugreifen, „denn ich habe Ar den Kindern Lot zu besitzen gegeben“. Mose starb „im Lande der Moabiter“ auf dem Nebo. Zur Richterzeit bedrückte Eglon von Moab Israel achtzehn Jahre, bis Ehud ihn tötete; Elimelechs Familie zog dorthin, und die Moabiterin Rut wurde Urgroßmutter Davids, der später seine Eltern beim König von Moab ließ, als König aber die Moabiter zu seinen Knechten machte."
    - "Nach Ahabs Tod „fiel der Moabiter König ab vom König Israels“, und Joram, Josaphat und der König von Edom zogen gegen ihn; als Mesa eingeschlossen war, opferte er seinen ältesten Sohn als Brandopfer auf der Mauer, und Israel zog ab. Mesas eigener Bericht ist auf der 1868 in Dhiban gefundenen Basaltstele erhalten, heute im Louvre: Sie erzählt, wie Omri Moab bedrückt hatte, wie Mesa Medeba, Nebo und andere Städte für seinen Gott Kemosch zurückholte und Städte und Zisternen baute. Eine beschädigte Zeile lesen manche als „Haus Davids“, was andere bezweifeln. Moab zahlte Tribut an Tiglat-Pileser III., Sanherib und Asarhaddon, und moabitische Streifscharen plagten Juda in den Tagen Jojakims. Jesaja, Jeremia, Amos, Hesekiel und Zefanja sprachen Gericht über Moab, das „von seiner Jugend auf sicher gewesen“ ist."
    - "Nabonid zog 553 v. Chr. in der Region zu Felde, und Moab verschwindet als Königreich; Araber und später die Nabatäer hielten die Hochebene, die 106 n. Chr. in die römische Provinz Arabien überging. Eusebius kannte Moab noch als eine Stadt Arabiens, die damals schon Areopolis hieß und deren Land ebenfalls Moab genannt wurde. Heute ist es das mittlere Jordanien, die Gouvernements Madaba und Karak, mit der Kreuzfahrerburg von Kerak, der Mosaikkarte von Madaba und den Ruinen von Dhiban."
  fr:
    - "Moab est le haut pays à l’est de la mer Morte, plateau d’environ 900 m d’altitude qui tombe abruptement vers la mer et que coupent les gorges profondes de l’Arnon (ouadi Mujib) et du Zéred (ouadi Hasa), sa frontière sud avec Édom. Son cœur se trouvait entre les deux gorges autour de Kir-Haréseth (Kérak) ; la plaine au nord de l’Arnon, avec Dibon, Médeba, Nebo et Hesbon, fut longtemps disputée avec Israël. Le pays produit du grain et des pâturages : Mescha, roi de Moab, « possédait des troupeaux ». La Genèse fait remonter les Moabites à la fille aînée de Lot, et la langue moabite, connue par la stèle de Mescha, est proche parente de l’hébreu."
    - "À la fin des errances, Israël campa dans les plaines de Moab en face de Jéricho, et Balak, roi de Moab, engagea Balaam pour les maudire ; Balaam les bénit au contraire et prévit un sceptre issu d’Israël qui « perce les flancs de Moab ». Il fut dit à Israël de ne pas attaquer Moab, car « c’est aux enfants de Lot que j’ai donné Ar en propriété ». Moïse mourut « dans le pays de Moab », sur le mont Nebo. Du temps des juges, Églon de Moab opprima Israël dix-huit ans jusqu’à ce qu’Éhud le tue ; la famille d’Élimélec alla y séjourner, et Ruth la Moabite devint l’arrière-grand-mère de David, qui laissa plus tard ses parents chez le roi de Moab, mais fit, devenu roi, des Moabites ses serviteurs."
    - "Après la mort d’Achab, « le roi de Moab se révolta contre le roi d’Israël », et Joram, Josaphat et le roi d’Édom marchèrent contre lui ; quand Mescha fut cerné, il offrit son fils aîné en holocauste sur la muraille, et Israël se retira. Le récit de Mescha lui-même subsiste sur la stèle de basalte trouvée à Dhiban en 1868 et conservée au Louvre : elle raconte comment Omri avait opprimé Moab, comment Mescha reprit Médeba, Nebo et d’autres villes pour son dieu Kemosch et bâtit des villes et des citernes. Une ligne endommagée est lue par certains comme « maison de David », ce que d’autres contestent. Moab paya tribut à Tiglath-Piléser III, à Sanchérib et à Esar-Haddon, et des bandes moabites harcelèrent Juda du temps de Jojakim. Ésaïe, Jérémie, Amos, Ézéchiel et Sophonie prononcèrent le jugement sur Moab, qui « était tranquille depuis sa jeunesse »."
    - "Nabonide fit campagne dans la région en 553 av. J.-C., et Moab disparaît comme royaume ; les Arabes puis les Nabatéens tinrent le plateau, qui passa dans la province romaine d’Arabie en 106 apr. J.-C. Eusèbe connaissait encore Moab comme une ville d’Arabie, appelée alors Aréopolis, dont le pays s’appelait aussi Moab. Aujourd’hui, c’est le centre de la Jordanie, les gouvernorats de Madaba et de Karak, avec le château croisé de Kerak, la carte-mosaïque de Madaba et les ruines de Dhiban."
  it:
    - "Moab è il tavolato a est del Mar Morto, un altopiano alto circa 900 m che cade ripido verso il mare ed è inciso dalle profonde gole dell’Arnon (Wadi Mujib) e dello Zered (Wadi Hasa), suo confine meridionale con Edom. Il suo cuore si trovava tra le due gole intorno a Kir-Cheres (Kerak); la pianura a nord dell’Arnon, con Dibon, Màdaba, Nebo e Chesbon, fu a lungo contesa con Israele. La terra dà grano e pascolo: Mesa, re di Moab, «allevava molto bestiame». La Genesi fa discendere i Moabiti dalla figlia maggiore di Lot, e la lingua moabita, nota dalla Stele di Mesa, è una stretta parente dell’ebraico."
    - "Alla fine delle peregrinazioni Israele si accampò nelle pianure di Moab di fronte a Gerico, e Balak, re di Moab, prese al soldo Balaam per maledirli; Balaam li benedisse invece e previde uno scettro da Israele che «colpirà Moab da un capo all’altro». A Israele fu detto di non attaccare Moab, «giacché ho dato Ar ai figliuoli di Lot». Mosè morì «nel paese di Moab» sul Monte Nebo. Al tempo dei giudici Eglon di Moab oppresse Israele per diciotto anni finché Eud lo uccise; la famiglia di Elimelech andò a soggiornarvi, e Rut la Moabita divenne bisnonna di Davide, che più tardi lasciò i genitori presso il re di Moab, ma da re fece dei Moabiti i suoi servi."
    - "Dopo la morte di Acab «il re di Moab si ribellò al re d’Israele», e Ioram, Giosafat e il re di Edom marciarono contro di lui; quando Mesa fu stretto d’assedio offrì il figlio primogenito in olocausto sulle mura, e Israele si ritirò. Il resoconto di Mesa stesso sopravvive sulla stele di basalto trovata a Dhiban nel 1868 e ora al Louvre: racconta come Omri aveva oppresso Moab, come Mesa riprese Màdaba, Nebo e altre città per il suo dio Chemosh e costruì città e cisterne. Una riga danneggiata è letta da alcuni «casa di Davide», cosa di cui altri dubitano. Moab pagò tributo a Tiglat-Pilèser III, Sennacherib e Assaraddon, e bande moabite infestarono Giuda ai giorni di Ioiakim. Isaia, Geremia, Amos, Ezechiele e Sofonia pronunciarono giudizio su Moab, che «era tranquillo fin dalla sua giovinezza»."
    - "Nabonedo condusse campagne nella regione nel 553 a.C., e Moab scompare come regno; gli Arabi e poi i Nabatei tennero l’altopiano, che passò nella provincia romana d’Arabia nel 106 d.C. Eusebio conosceva ancora Moab come una città d’Arabia, ormai chiamata Areopoli, la cui terra era detta anch’essa Moab. Oggi è la Giordania centrale, i governatorati di Màdaba e Karak, con il castello crociato di Kerak, la mappa musiva di Màdaba e le rovine di Dhiban."
  pl:
    - "Moab to wyżyna na wschód od Morza Martwego, płaskowyż o wysokości około 900 m, stromo opadający ku morzu i przecięty głębokimi wąwozami Arnonu (Wadi Mujib) i Zaredu (Wadi Hasa), jego południowej granicy z Edomem. Jego serce leżało między dwoma wąwozami wokół Kir-Chareszet (Kerak); równina na północ od Arnonu, z Dibon, Medebą, Nebo i Cheszbonem, była długo spornym terenem z Izraelem. Ziemia rodzi zboże i daje pastwiska: Mesza, król Moabu, „miał dosyć bydła”. Księga Rodzaju wywodzi Moabitów od starszej córki Lota, a język moabicki, znany ze steli Meszy, jest bliskim krewnym hebrajskiego."
    - "Pod koniec wędrówek Izrael obozował na równinach Moabu naprzeciw Jerycha, a Balak, król Moabu, wynajął Balaama, by ich przeklął; Balaam zamiast tego błogosławił i przepowiedział, że „powstanie laska z Izraela, i pobije książęta Moabskie”. Izraelowi kazano nie napadać na Moab, „gdyżem synom Lotowym dał Ar w dziedzictwo”. Mojżesz umarł „w ziemi Moabskiej” na górze Nebo. W czasach sędziów Eglon z Moabu uciskał Izraela osiemnaście lat, aż zabił go Ehud; rodzina Elimeleka poszła tam na pobyt, a Rut Moabitka została prababką Dawida, który później zostawił rodziców u króla Moabu, a jednak jako król uczynił Moabitów swoimi sługami."
    - "Po śmierci Achaba „odstąpił król Moabski od króla Izraelskiego”, a Joram, Jozafat i król Edomu wyruszyli przeciw niemu; gdy Mesza został osaczony, ofiarował swego pierworodnego syna jako całopalenie na murze, a Izrael się wycofał. Własna relacja Meszy przetrwała na bazaltowej steli znalezionej w Dhiban w 1868 r., dziś w Luwrze: opowiada, jak Omri uciskał Moab, jak Mesza odzyskał Medebę, Nebo i inne miasta dla swego boga Kemosza oraz zbudował miasta i cysterny. Jeden uszkodzony wiersz niektórzy czytają jako „dom Dawida”, co inni podają w wątpliwość. Moab płacił daninę Tiglat-Pileserowi III, Sennacherybowi i Asarhaddonowi, a bandy moabickie nękały Judę za dni Jojakima. Izajasz, Jeremiasz, Amos, Ezechiel i Sofoniasz wygłosili sąd nad Moabem: „Miałci Moab pokój od dzieciństwa swego”."
    - "Nabonid prowadził kampanię w tym regionie w 553 r. p.n.e. i Moab znika jako królestwo; Arabowie, a później Nabatejczycy, zajęli płaskowyż, który w 106 r. n.e. przeszedł do rzymskiej prowincji Arabia. Euzebiusz wciąż znał Moab jako miasto Arabii, zwane już wtedy Areopolis, którego ziemię również nazywano Moabem. Dziś jest to środkowa Jordania, muhafazy Madaba i Karak, z zamkiem krzyżowców w Keraku, mozaikową mapą w Madabie i ruinami w Dhiban."
  nl:
    - "Moab is het hoogland ten oosten van de Dode Zee, een plateau van zo'n 900 m hoog dat steil naar de zee afvalt en doorsneden wordt door de diepe kloven van de Arnon (Wadi Mujib) en de Zered (Wadi Hasa), zijn zuidgrens met Edom. Zijn kerngebied lag tussen de twee kloven rond Kir-Hareset (Kerak); de vlakte ten noorden van de Arnon, met Dibon, Medeba, Nebo en Chesbon, was lang omstreden met Israël. Het land levert graan en weide: Mesa, koning van Moab, “was een veehandelaar”. Genesis voert de Moabieten terug op Lots oudste dochter, en de Moabitische taal, bekend van de Mesa-stèle, is nauw verwant aan het Hebreeuws."
    - "Aan het eind van de zwerftocht legerde Israël zich in de vlakten van Moab tegenover Jericho, en Balak, koning van Moab, huurde Bileam om hen te vervloeken; Bileam zegende in plaats daarvan en voorzag een scepter uit Israël, “die zal de palen der Moabieten verslaan”. Israël kreeg te horen Moab niet aan te vallen, “dewijl Ik aan Lots kinderen Ar ter erfenis gegeven heb”. Mozes stierf “in het land van Moab” op de berg Nebo. In de tijd van de richters onderdrukte Eglon van Moab Israël achttien jaar tot Ehud hem doodde; Elimelechs gezin ging er verblijven, en Ruth de Moabitische werd de overgrootmoeder van David, die later zijn ouders bij de koning van Moab achterliet, maar als koning de Moabieten tot zijn dienaren maakte."
    - "Nadat Achab gestorven was, gebeurde het “dat de koning der Moabieten van den koning van Israël afviel”, en Joram, Josafat en de koning van Edom trokken tegen hem op; toen Mesa werd ingesloten, offerde hij zijn oudste zoon als brandoffer op de muur, en Israël trok zich terug. Mesa's eigen verslag staat op de basaltstèle die in 1868 bij Dhiban werd gevonden en nu in het Louvre staat: zij vertelt hoe Omri Moab had onderdrukt, hoe Mesa Medeba, Nebo en andere steden voor zijn god Kemos terugnam en steden en cisternes bouwde. Een beschadigde regel wordt door sommigen gelezen als “huis van David”, wat anderen betwijfelen. Moab betaalde schatting aan Tiglat-Pileser III, Sanherib en Esarhaddon, en Moabitische benden plaagden Juda in de dagen van Jojakim. Jesaja, Jeremia, Amos, Ezechiël en Zefanja spraken een oordeel uit over Moab, dat “van zijn jeugd aan gerust geweest” is."
    - "Nabonidus voerde in 553 v.Chr. campagne in de streek, en Moab verdwijnt als koninkrijk; Arabieren en later de Nabateeërs hielden het plateau, dat in 106 n.Chr. in de Romeinse provincie Arabië overging. Eusebius kende Moab nog als een stad van Arabië, toen al Areopolis genoemd, waarvan het land ook Moab heette. Tegenwoordig is het Midden-Jordanië, de gouvernementen Madaba en Karak, met het kruisvaarderskasteel van Kerak, de mozaïekkaart te Madaba en de ruïnes bij Dhiban."
  cs:
    - "Moáb je tabulová země východně od Mrtvého moře, plošina asi 900 m vysoká, která příkře klesá k moři a je rozříznuta hlubokými soutěskami Arnonu (Wádí Mudžib) a Zeredu (Wádí Hasa), jeho jižní hranice s Edómem. Jeho jádro leželo mezi oběma soutěskami kolem Kír-charesetu (Kerak); pláň severně od Arnonu, s Dibonem, Medebou, Nebem a Chešbónem, byla s Izraelem dlouho sporná. Země rodí obilí a poskytuje pastvu: Meša, král Moábu, „měl hojnost dobytka“. Genesis odvozuje Moábce od Lotovy starší dcery a moábský jazyk, známý ze Mešovy stély, je blízkým příbuzným hebrejštiny."
    - "Na konci putování se Izrael utábořil na pláních Moábu naproti Jerichu a Balak, král Moábu, najal Bileáma, aby jim zlořečil; Bileám místo toho požehnal a předvídal berlu z Izraele, „kteráž poláme knížata Moábská“. Izraeli bylo řečeno, aby na Moáb nezaútočil, „poněvadž synům Lot dal jsem Ar v dědictví“. Mojžíš zemřel „v zemi Moábské“ na hoře Nebo. V době soudců Eglon Moábský utlačoval Izrael osmnáct let, dokud ho Ehúd nezabil; rodina Elimelekova tam odešla pobývat a Rut Moábka se stala prababičkou Davidovou, který později ponechal své rodiče u krále Moábu, ale jako král učinil Moábce svými služebníky."
    - "Po Achabově smrti „se zprotivil král Moábský králi Izraelskému“ a Jehoram, Jozafat a král Edómu proti němu vytáhli; když byl Meša sevřen, obětoval svého prvorozeného syna jako zápalnou oběť na hradbě a Izrael odtáhl. Mešovo vlastní líčení se zachovalo na čedičové stéle nalezené v Dhibánu roku 1868 a nyní v Louvru: vypráví, jak Omrí Moáb utlačoval, jak Meša vzal zpět Medebu, Nebo a jiná města pro svého boha Kemoše a vystavěl města a cisterny. Jeden poškozený řádek někteří čtou jako „dům Davidův“, což jiní zpochybňují. Moáb platil tribut Tiglatpilesarovi III., Senacheribovi a Asarhadónovi a moábské tlupy sužovaly Judu za dnů Jójakimových. Izajáš, Jeremjáš, Amos, Ezechiel a Sofonjáš vyslovili nad Moábem soud; Jeremjáš o něm praví: „Mělť jest pokoj Moáb od dětinství svého“."
    - "Nabonid roku 553 př. n. l. vedl v oblasti tažení a Moáb mizí jako království; Arabové a později Nabatejci drželi plošinu, která roku 106 n. l. připadla římské provincii Arábie. Eusebius ještě znal Moáb jako město Arábie, tehdy již zvané Areopolis, jehož země se také nazývala Moáb. Dnes je to střední Jordánsko, guvernoráty Madaba a Karak, s křižáckým hradem Kerak, mozaikovou mapou v Madabě a zříceninami v Dhibánu."
  sv:
    - "Moab är högplatån öster om Döda havet, en platå omkring 900 m hög som stupar brant mot havet och skärs av de djupa ravinerna Arnon (Wadi Mujib) och Sered (Wadi Hasa), dess södra gräns mot Edom. Dess kärnland låg mellan de två ravinerna kring Kir-Hareset (Kerak); slätten norr om Arnon, med Dibon, Medeba, Nebo och Heshbon, var länge omstridd med Israel. Landet ger säd och bete: Mesha, Moabs kung, ”ägde mycken boskap”. Första Moseboken för moabiterna tillbaka på Lots äldre dotter, och det moabitiska språket, känt från Meshastelen, är nära besläktat med hebreiska."
    - "Vid vandringarnas slut lägrade Israel sig på Moabs hedar mitt emot Jeriko, och Balak, Moabs kung, lejde Bileam att förbanna dem; Bileam välsignade i stället och förutsåg en spira ur Israel som ”krossar Moabs tinningar”. Israel fick höra att inte angripa Moab, ”eftersom jag redan har givit Ar åt Lots barn till besittning”. Mose dog ”i Moabs land” på berget Nebo. På domarnas tid förtryckte Eglon av Moab Israel i arton år tills Ehud dräpte honom; Elimeleks familj drog dit för att bo som främlingar, och moabitiskan Rut blev farfars mor till David, som senare lämnade sina föräldrar hos Moabs kung, men som kung gjorde moabiterna till sina tjänare."
    - "Sedan Achav dött ”avföll konungen i Moab från konungen i Israel”, och Joram, Josafat och Edoms kung tågade mot honom; när Mesha blev inringad offrade han sin äldste son som brännoffer på muren, och Israel drog sig tillbaka. Meshas egen berättelse finns bevarad på basaltstelen som hittades i Dhiban 1868 och nu finns i Louvren: den berättar hur Omri hade förtryckt Moab, hur Mesha tog tillbaka Medeba, Nebo och andra städer åt sin gud Kemosh och byggde städer och cisterner. En skadad rad läses av vissa som ”Davids hus”, vilket andra betvivlar. Moab betalade tribut till Tiglat-Pileser III, Sanherib och Esarhaddon, och moabitiska band härjade Juda på Jojakims tid. Jesaja, Jeremia, Amos, Hesekiel och Sefanja uttalade dom över Moab, om vilket det heter: ”I säkerhet har Moab levat från sin ungdom”."
    - "Nabonid fälttågade i regionen 553 f.Kr., och Moab försvinner som kungarike; araber och senare nabateerna höll platån, som gick in i den romerska provinsen Arabien år 106 e.Kr. Eusebios kände ännu Moab som en stad i Arabien, då kallad Areopolis, vars land också kallades Moab. I dag är det centrala Jordanien, guvernementen Madaba och Karak, med korsfararslottet i Kerak, mosaikkartan i Madaba och ruinerna i Dhiban."
  nb:
    - "Moab er høylandet øst for Dødehavet, et platå på omkring 900 m som faller bratt ned mot havet og er skåret av de dype kløftene Arnon (Wadi Mujib) og Sered (Wadi Hasa), den sørlige grensen mot Edom. Kjerneområdet lå mellom de to kløftene omkring Kir-Hareset (Kerak); sletten nord for Arnon, med Dibon, Medeba, Nebo og Hesjbon, var lenge omstridt med Israel. Landet gir korn og beite: Mesa, Moabs konge, «hadde meget fe». Første Mosebok fører moabittene tilbake til Lots eldste datter, og det moabittiske språket, kjent fra Mesa-steinen, er en nær slektning av hebraisk."
    - "Ved slutten av vandringen slo Israel leir på Moab-slettene midt imot Jeriko, og Balak, Moabs konge, leide Bileam til å forbanne dem; Bileam velsignet i stedet og så et spir fra Israel som «knuser Moabs tinninger». Israel fikk beskjed om ikke å angripe Moab, «for jeg har gitt Lots barn Ar til eiendom». Moses døde «i Moabs land» på Nebo. På dommernes tid undertrykte Eglon av Moab Israel i atten år til Ehud drepte ham; Elimeleks familie dro for å bo der en tid, og moabittkvinnen Rut ble Davids oldemor; David overlot senere foreldrene til Moabs konge, men gjorde som konge moabittene til sine tjenere."
    - "Etter Ahabs død «falt kongen i Moab fra Israels konge», og Joram, Josjafat og Edoms konge marsjerte mot ham; da Mesa ble innestengt, ofret han sin eldste sønn som brennoffer på muren, og Israel trakk seg tilbake. Mesas egen beretning er bevart på basaltstelen funnet i Dhiban i 1868 og nå i Louvre: den forteller hvordan Omri hadde undertrykt Moab, hvordan Mesa tok tilbake Medeba, Nebo og andre byer for sin gud Kemosj og bygde byer og sisterner. En skadet linje leses av noen som «Davids hus», noe andre betviler. Moab betalte tributt til Tiglat-Pileser III, Sankerib og Asarhaddon, og moabittiske bander herjet Juda i Jojakims dager. Jesaja, Jeremia, Amos, Esekiel og Sefanja forkynte dom over Moab, som «har levd i ro fra sin ungdom av»."
    - "Nabonid førte felttog i området i 553 f.Kr., og Moab forsvinner som kongedømme; arabere og senere nabateerne holdt høylandet, som gikk inn i den romerske provinsen Arabia i 106 e.Kr. Eusebius kjente fortsatt Moab som en by i Arabia, da kalt Areopolis, hvis land også ble kalt Moab. I dag er det sentrale Jordan, guvernementene Madaba og Karak, med korsfarerslottet i Kerak, mosaikkartet i Madaba og ruinene i Dhiban."
  tl:
    - "Ang Moab ay ang talampas sa silangan ng Dagat na Patay, isang talampas na mga 900 m ang taas na matarik na bumababa sa dagat at hinahati ng malalalim na bangin ng Arnon (Wadi Mujib) at Zered (Wadi Hasa), ang katimugang hangganan nito sa Edom. Ang puso nito ay nasa pagitan ng dalawang bangin sa palibot ng Cir-hareseth (Kerak); ang kapatagan sa hilaga ng Arnon, na may Dibon, Medeba, Nebo at Hesbon, ay matagal na pinagtalunan nila ng Israel. Nagbubunga ang lupain ng butil at ng pastulan: si Mesa, hari ng Moab, ay “may mga tupa”. Ipinagmumula ng Genesis ang mga Moabita sa nakatatandang anak na babae ni Lot, at ang wikang Moabita, na kilala mula sa Estela ni Mesa, ay malapit na kamag-anak ng Hebreo."
    - "Sa pagtatapos ng mga paglalagalag, nagkampo ang Israel sa mga kapatagan ng Moab sa tapat ng Jerico, at inupahan ni Balac, hari ng Moab, si Balaam upang sumpain sila; pinagpala niya sila sa halip at nakita ang isang setro mula sa Israel na “sasaktan ang mga sulok ng Moab”. Sinabihan ang Israel na huwag salakayin ang Moab, sapagkat “aking ibinigay na pinakaari ang Ar sa mga anak ni Lot”. Namatay si Moises “sa lupain ng Moab” sa Bundok Nebo. Sa panahon ng mga hukom, inapi ni Eglon ng Moab ang Israel nang labingwalong taon hanggang patayin siya ni Aod; nanirahan doon ang pamilya ni Elimelech, at ang Moabitang si Ruth ay naging lola sa tuhod ni David, na kalaunang iniwan ang kaniyang mga magulang sa hari ng Moab, ngunit bilang hari ay ginawang kaniyang mga lingkod ang mga Moabita."
    - "Pagkamatay ni Achab, “ang hari sa Moab ay nanghimagsik laban sa hari sa Israel”, at sinalakay siya nina Joram, Josaphat at ng hari ng Edom; nang masukol si Mesa, inihandog ang panganay niyang anak bilang handog na susunugin sa pader, at umatras ang Israel. Nananatili ang salaysay ni Mesa sa estelang basalto na natagpuan sa Dhiban noong 1868, nasa Louvre ngayon: inapi raw ni Omri ang Moab, at binawi ni Mesa ang Medeba, Nebo at iba pang bayan para sa diyos niyang si Chemos, at nagtayo ng mga lungsod at imbakan ng tubig. Binabasa ng ilan ang sirang linya bilang “bahay ni David”, na pinagdududahan ng iba. Nagbayad ng tributo ang Moab kina Tiglath-pileser III, Sennacherib at Esar-hadon, at ginambala ng mga pangkat Moabita ang Juda sa mga araw ni Joacim. Hinatulan ang Moab, na “tiwasay mula sa kaniyang kabataan”, nina Isaias, Jeremias, Amos, Ezekiel at Zefanias."
    - "Nagkampanya si Nabonido sa rehiyon noong 553 BK, at naglaho ang Moab bilang kaharian; hinawakan ng mga Arabe at kalaunan ng mga Nabateo ang talampas, na napunta sa lalawigang Romano ng Arabia noong 106 AD. Kilala pa ni Eusebio ang Moab bilang lungsod ng Arabia, na noon ay tinatawag na Areopolis, na ang lupain ay tinatawag ding Moab. Ngayon ito ang gitnang Jordan, ang mga gobernasyon ng Madaba at Karak, na may kastilyong Krusado ng Kerak, ang mapang mosaiko sa Madaba at ang mga guho sa Dhiban."
  da:
    - "Moab er højsletten øst for Det Døde Hav, et plateau omkring 900 m højt, der falder stejlt ned mod havet og er gennemskåret af de dybe kløfter ved Arnon (Wadi Mujib) og Zered (Wadi Hasa), dets sydgrænse mod Edom. Dets kerneland lå mellem de to kløfter omkring Kir-Hareset (Kerak); sletten nord for Arnon, med Dibon, Medeba, Nebo og Hesjbon, blev længe stridt om med Israel. Landet giver korn og græsning: Mesja, Moabs konge, »havde meget Kvæg«. Første Mosebog fører moabitterne tilbage til Lots ældste datter, og det moabitiske sprog, kendt fra Mesja-stelen, er en nær slægtning til hebraisk."
    - "Ved slutningen af vandringerne lejrede Israel sig på Moabs sletter over for Jeriko, og Balak, Moabs konge, lejede Bileam til at forbande dem; Bileam velsignede i stedet og skuede et spir af Israel, der »knuser Moabs Hjørner«. Israel fik at vide, at det ikke skulle angribe Moab, »thi jeg har givet Lots Børn Ar til Ejendom«. Moses døde på Nebo-bjerget, »der i Moabs Land«. I dommernes tid undertrykte Eglon af Moab Israel i atten år, indtil Ehud dræbte ham; Elimeleks familie drog dertil for at bo som fremmede, og moabitinden Ruth blev Davids oldemor, som senere efterlod sine forældre hos Moabs konge, men som konge gjorde moabitterne til sine tjenere."
    - "Efter Akabs død »faldt Moabiternes Konge af fra Israels Konge«, og Joram, Josafat og Edoms konge marcherede mod ham; da Mesja blev indesluttet, ofrede han sin ældste søn som brændoffer på muren, og Israel trak sig tilbage. Mesjas egen beretning overlever på basaltstelen, fundet i Dhiban i 1868 og nu i Louvre: den fortæller, hvordan Omri havde undertrykt Moab, hvordan Mesja tog Medeba, Nebo og andre byer tilbage for sin gud Kemosj og byggede byer og cisterner. Én beskadiget linje læses af nogle som »Davids hus«, hvilket andre drager i tvivl. Moab betalte tribut til Tiglat-Pileser III, Sankerib og Esarhaddon, og moabitiske bander hærgede Juda i Jojakims dage. Esajas, Jeremias, Amos, Ezekiel og Sefanja udtalte dom over Moab, som »har boet trygt fra sin Ungdom af«."
    - "Nabonid førte felttog i regionen i 553 f.Kr., og Moab forsvinder som kongerige; arabere og siden nabatæerne holdt højsletten, som i 106 e.Kr. gik over i den romerske provins Arabien. Eusebios kendte stadig Moab som en by i Arabien, da kaldt Areopolis, hvis land også blev kaldt Moab. I dag er det det centrale Jordan, guvernementerne Madaba og Karak, med korsfarerborgen Kerak, mosaikkortet i Madaba og ruinerne i Dhiban."
  sr:
    - "Моав је висораван источно од Мртвог мора, висока око 900 м, која се стрмо спушта ка мору и пресечена је дубоким кланцима Арнона (Вади Муџиб) и Зареда (Вади Хаса), његове јужне границе са Едомом. Његово средиште лежало је између та два кланца око Кир-Харесе (Керак); равница северно од Арнона, са Девоном, Медевом, Невом и Есевоном, дуго је била спорна с Израиљем. Земља рађа жито и пашу: Миса, цар Моава, „имаше много стоке“. Књига Постања води Моавце од Лотове старије кћери, а моавски језик, познат из Мисине стеле, близак је рођак хебрејског."
    - "На крају лутања Израиљ се улогорио на равницама моавским насупрот Јерихону, и Валак, цар Моава, најмио је Валама да их прокуне; Валам је уместо тога благословио и предвидео палицу из Израиља „која ће разбити кнезове моавске“. Израиљу је речено да не напада Моав, „јер дадох синовима Лотовим у наследство Ар“. Мојсије је умро „у земљи моавској“ на Неву. У време судија Јеглон Моавски тлачио је Израиља осамнаест година док га Ехуд није убио; породица Елимелехова отишла је тамо да живи као дошљаци, а Рута Моавка постала је прабаба Давидова, који је касније оставио родитеље код цара моавског, али је као цар Моавце учинио својим слугама."
    - "После Ахавове смрти „одметну се цар моавски од цара Израиљевог“, и Јорам, Јосафат и цар едомски кренули су на њега; када је Миса био опкољен, принео је свог првенца на жртву паљеницу на зиду, и Израиљ се повукао. Мисин сопствени извештај сачуван је на базалтној стели нађеној у Дибану 1868, а сада у Лувру: приповеда како је Амрије тлачио Моав, како је Миса за свог бога Хамоса повратио Медеву, Нево и друге градове и саградио градове и цистерне. Један оштећени ред неки читају као „дом Давидов“, што други доводе у сумњу. Моав је плаћао данак Теглат-Феласару III, Сенахириму и Есарадону, а моавске чете харале су Јудом у време Јоакима. Исаија, Јеремија, Амос, Језекиљ и Софонија изрекли су суд над Моавом, који „је био у миру од детињства свог“."
    - "Набонид је водио поход у области 553. п. н. е., и Моав нестаје као краљевство; Арапи, а потом Набатејци држали су висораван, која је 106. н. е. прешла у римску провинцију Арабију. Јевсевије је још знао Моав као град у Арабији, који се тада звао Ареопољ, чија се земља такође звала Моав. Данас је то средишњи Јордан, гувернорати Мадаба и Керак, са крсташким замком Керака, мозаичком мапом у Мадаби и рушевинама у Дибану."
  hu:
    - "Moáb a Holt-tengertől keletre fekvő fennsík, mintegy 900 m magas, amely meredeken ereszkedik a tengerhez, és az Arnon (Wadi Mujib) és a Zéred (Wadi Hasa) mély szurdokai szelik át; ez utóbbi a déli határa Edommal. Szíve a két szurdok között feküdt Kir-Hareszet (Kerak) körül; az Arnontól északra fekvő síkság Dibonnal, Médebával, Nébóval és Hesbonnal sokáig vitatott volt Izráellel. A föld gabonát és legelőt terem: Mésa, Moáb királya, „nagyon sok juha volt”. A Teremtés könyve a moábiakat Lót idősebb leányától származtatja, és a moábi nyelv, amelyet a Mésa-sztéléből ismerünk, a héber közeli rokona."
    - "A vándorlás végén Izráel a Jerikóval szemben fekvő Moáb síkságán táborozott, és Bálák, Moáb királya, felbérelte Bálámot, hogy megátkozza őket; Bálám megáldotta, és előre látta az Izráelből támadó jogart, amely „általveri Moábnak oldalait”. Izráelnek megmondták, hogy ne támadja meg Moábot, „mert a Lót fiainak adtam Art örökségül”. Mózes „a Moáb földén” halt meg a Nébó-hegyen. A bírák idején Eglon, Moáb királya, tizennyolc évig sanyargatta Izráelt, míg Ehúd meg nem ölte; Elimélek családja odament tartózkodni, és Rúth, a moábita nő, Dávid dédanyja lett, aki később szüleit Moáb királyánál hagyta, mégis királyként szolgáivá tette a moábiakat."
    - "Aháb halála után „a Moáb királya elszakadt az Izráel királyától”, és Jórám, Jósafát és Edom királya hadba vonult ellene; amikor Mésát körülzárták, elsőszülött fiát égőáldozatul feláldozta a falon, és Izráel visszavonult. Mésa saját beszámolója a Dhibanban 1868-ban talált bazaltsztélén maradt fenn, amely ma a Louvre-ban van: elmondja, hogyan sanyargatta Omri Moábot, hogyan vette vissza Mésa Médebát, Nébót és más városokat istene, Kemós számára, és hogyan épített városokat és ciszternákat. Egy sérült sort egyesek „Dávid háza”-ként olvasnak, amit mások kétségbe vonnak. Moáb adót fizetett III. Tiglat-Pileszernek, Szanhéribnek és Asszarhaddonnak, és moábi csapatok zaklatták Júdát Jójákim napjaiban. Ézsaiás, Jeremiás, Ámós, Ezékiel és Sofóniás ítéletet mondott Moáb fölött, amelyről így szól a Biblia: „Nyugodtan élt Moáb gyermekségétől fogva”."
    - "Nabonidosz Kr. e. 553-ban hadjáratot viselt a térségben, és Moáb királyságként eltűnik; arabok, majd a nabateusok bírták a fennsíkot, amely Kr. u. 106-ban Arábia római tartományba került. Eusebius még ismerte Moábot Arábia városaként, amelyet akkor már Areopolisnak hívtak, és amelynek földjét szintén Moábnak nevezték. Ma Közép-Jordánia, Madaba és Karak kormányzóság, Kerak keresztes várával, a madabai mozaiktérképpel és a dhibani romokkal."
  fi:
    - "Moab on Kuolleenmeren itäpuolinen ylänkö, noin 900 m korkea ylätasanko, joka laskeutuu jyrkästi mereen ja jota halkovat Arnonin (Wadi Mujib) ja Seredin (Wadi Hasa), sen eteläisen Edomin rajan, syvät rotkot. Sen ydinalue sijaitsi kahden rotkon välissä Kir-Heresetin (Kerak) ympärillä; Arnonin pohjoispuolista tasankoa, jossa olivat Dibon, Medeba, Nebo ja Hesbon, kiisteltiin Israelin kanssa pitkään. Maa tuottaa viljaa ja laidunta: Mesa, Moabin kuningas, ”omisti lammaslaumoja”. Ensimmäinen Mooseksen kirja johtaa moabilaiset Lootin vanhemmasta tyttärestä, ja Mesan stelestä tunnettu moabin kieli on heprean läheinen sukulainen."
    - "Vaelluksen lopussa Israel leiriytyi Moabin aroille Jerikoa vastapäätä, ja Balak, Moabin kuningas, palkkasi Bileamin kiroamaan heitä; Bileam siunasi sen sijaan ja näki valtikan nousevan Israelista, joka ”ruhjoo Mooabilta ohimot”. Israelia kehotettiin olemaan hyökkäämättä Moabin kimppuun, ”koska minä olen antanut Aarin Lootin jälkeläisten omaksi”. Mooses kuoli ”Mooabin maassa” Nebovuorella. Tuomarien aikana Moabin Eglon sortoi Israelia kahdeksantoista vuotta, kunnes Ehud tappoi hänet; Elimelekin perhe lähti asumaan sinne muukalaisina, ja moabilaisesta Ruutista tuli Daavidin isoisoäiti; Daavid jätti myöhemmin vanhempansa Moabin kuninkaan luo, mutta teki kuninkaana moabilaiset palvelijoikseen."
    - "Ahabin kuoltua ”Mooabin kuningas luopui Israelin kuninkaasta”, ja Joram, Josafat ja Edomin kuningas marssivat häntä vastaan; kun Mesa oli saarrettuna, hän uhrasi esikoispoikansa polttouhriksi muurilla, ja Israel vetäytyi. Mesan oma kertomus on säilynyt Dhibanista vuonna 1868 löydetyllä basalttistelellä, joka on nyt Louvressa: se kertoo, kuinka Omri oli sortanut Moabia, kuinka Mesa otti takaisin Medeban, Nebon ja muita kaupunkeja jumalalleen Kemokselle ja rakensi kaupunkeja ja vesisäiliöitä. Yhden vaurioituneen rivin jotkut lukevat ”Daavidin huoneeksi”, mitä toiset epäilevät. Moab maksoi veroa Tiglat-Pileser III:lle, Sanheribille ja Esarhaddonille, ja moabilaisjoukot ahdistivat Juudaa Jojakimin päivinä. Jesaja, Jeremia, Aamos, Hesekiel ja Sefanja lausuivat tuomion Moabista: ”Surutonna on Mooab ollut nuoruudestaan asti”."
    - "Nabonid kävi sotaretkellä alueella vuonna 553 eaa., ja Moab katoaa kuningaskuntana; arabit ja myöhemmin nabatealaiset hallitsivat ylänköä, joka liitettiin Rooman Arabian provinssiin vuonna 106 jaa. Eusebios tunsi Moabin yhä Arabian kaupunkina, jota silloin kutsuttiin Areopolikseksi ja jonka maatakin kutsuttiin Moabiksi. Nykyään se on Keski-Jordania, Madaban ja Karakin kuvernementit, ristiretkeläislinna Kerakissa, Madaban mosaiikkikartta ja Dhibanin rauniot."
  vi:
    - "Mô-áp là cao nguyên phía đông Biển Chết, một cao nguyên cao khoảng 900 m đổ dốc xuống biển và bị cắt bởi các hẻm núi sâu của Ạt-nôn (Wadi Mujib) và Xê-rết (Wadi Hasa), biên giới phía nam với Ê-đôm. Trung tâm của nó nằm giữa hai hẻm núi quanh Kiệt-Ha-rê-sết (Kerak); đồng bằng phía bắc Ạt-nôn, với Đi-bôn, Mê-đê-ba, Nê-bô và Hết-bôn, bị tranh giành với Y-sơ-ra-ên rất lâu. Đất sản xuất ngũ cốc và đồng cỏ: Mê-sa, vua Mô-áp, “nuôi nhiều bầy chiên”. Sáng thế ký truy dân Mô-áp về con gái lớn của Lót, và tiếng Mô-áp, được biết qua Bia Mê-sa, là họ hàng gần của tiếng Hê-bơ-rơ."
    - "Cuối cuộc lang thang, Y-sơ-ra-ên đóng trại trong đồng bằng Mô-áp đối ngang Giê-ri-cô, và Ba-lác, vua Mô-áp, thuê Ba-la-am rủa họ; Ba-la-am lại chúc phước và thấy trước một cây phủ việt trồi lên từ Y-sơ-ra-ên, “Người sẽ đâm lủng Mô-áp từ đầu nầy tới đầu kia”. Y-sơ-ra-ên được bảo không đánh Mô-áp, “bởi ta đã ban A-rơ cho con cháu Lót làm sản nghiệp”. Môi-se qua đời trên núi Nê-bô, trong xứ Mô-áp. Vào đời các quan xét, Éc-lôn của Mô-áp hà hiếp Y-sơ-ra-ên mười tám năm cho đến khi Ê-hút giết ông; gia đình Ê-li-mê-léc đến kiều ngụ ở đó, và Ru-tơ người Mô-áp trở thành bà cố của Đa-vít, người về sau gửi cha mẹ mình cho vua Mô-áp, nhưng khi làm vua lại biến người Mô-áp thành tôi tớ."
    - "Sau khi A-háp chết, “vua Mô-áp dấy nghịch cùng vua Y-sơ-ra-ên”, và Giô-ram, Giô-sa-phát cùng vua Ê-đôm tiến quân chống ông; khi Mê-sa bị vây, ông dâng con trai cả làm của lễ thiêu trên tường, và Y-sơ-ra-ên rút lui. Lời tự thuật của chính Mê-sa còn lại trên bia đá bazan tìm thấy ở Dhiban năm 1868 và nay ở Louvre: bia kể Ôm-ri đã hà hiếp Mô-áp thế nào, Mê-sa lấy lại Mê-đê-ba, Nê-bô và các thành khác cho thần Chemosh của mình và xây thành và bể chứa nước. Một dòng hư hại được một số người đọc là “nhà Đa-vít”, điều những người khác nghi ngờ. Mô-áp nộp cống cho Tiếc-la-Phi-lê-se III, San-chê-ríp và Ê-sạt-ha-đôn, và các toán Mô-áp quấy phá Giu-đa vào đời Giê-hô-gia-kim. Ê-sai, Giê-rê-mi, A-mốt, Ê-xê-chi-ên và Sô-phô-ni tuyên án Mô-áp, dân mà Giê-rê-mi nói: “Mô-áp từ lúc còn trẻ vốn yên lặng”."
    - "Nabonidus vận động ở vùng này năm 553 TCN, và Mô-áp biến mất như một vương quốc; người Ả Rập rồi người Nabataea giữ cao nguyên, rồi cao nguyên này thuộc về tỉnh La Mã A-ra-bi từ năm 106. Eusebius còn biết Mô-áp là một thành của A-ra-bi, lúc đó gọi là Areopolis, có đất cũng gọi là Mô-áp. Ngày nay đó là miền trung Gióc-đa-ni, các tỉnh Madaba và Karak, với lâu đài Thập tự chinh Kerak, bản đồ khảm ở Madaba và tàn tích ở Dhiban."
  ro:
    - "Moab este podișul de la est de Marea Moartă, la circa 900 m înălțime, care coboară abrupt spre mare și este tăiat de cheile adânci ale Arnonului (Wadi Mujib) și ale Zeredului (Wadi Hasa), hotarul lui sudic cu Edomul. Inima lui se afla între cele două chei, în jurul Chir-Hareset (Kerak); câmpia de la nord de Arnon, cu Dibon, Medeba, Nebo și Hesbon, a fost multă vreme disputată cu Israel. Țara dă grâu și pășune: Meșa, regele Moabului, „aveà turme multe”. Facerea urmărește originea moabiților până la fiica mai mare a lui Lot, iar limba moabită, cunoscută din Stela lui Meșa, este o rudă apropiată a ebraicei."
    - "La sfârșitul rătăcirilor, Israel a tăbărât pe câmpiile Moabului în fața Ierihonului, iar Balac, regele Moabului, l-a tocmit pe Balaam să-i blesteme; Balaam a binecuvântat în schimb și a prevăzut un sceptru ridicat din Israel, care „va zdrobì pre domnii lui Moav”. Lui Israel i s-a spus să nu atace Moabul, „că fiilor lui Lot am dat Aroirul să-l moștenească”. Moise a murit „în pământul Moav”, pe Muntele Nebo. În vremea judecătorilor, Eglon al Moabului a asuprit Israelul optsprezece ani, până când Ehud l-a ucis; familia lui Elimelec a mers să locuiască acolo, iar Rut moabita a devenit străbunica lui David, care mai târziu și-a lăsat părinții la regele Moabului, dar ca rege i-a făcut pe moabiți slujitorii săi."
    - "După moartea lui Ahab, „s’a răsvrătit împăratul Moavului asupra împăratului lui Israil”, iar Ioram, Iosafat și regele Edomului au mărșăluit împotriva lui; când Meșa a fost încercuit, și-a adus fiul întâi născut ardere de tot pe zid, iar Israel s-a retras. Relatarea lui Meșa însuși se păstrează pe stela de bazalt găsită la Dhiban în 1868 și aflată acum la Luvru: spune cum Omri asuprise Moabul, cum Meșa a luat înapoi Medeba, Nebo și alte cetăți pentru zeul său Chemoș și a zidit cetăți și cisterne. Un rând deteriorat este citit de unii „casa lui David”, lucru de care alții se îndoiesc. Moabul a plătit tribut lui Tiglat-Pileser al III-lea, Senaherib și Esar-Hadon, iar cete moabite au hărțuit Iuda în zilele lui Ioiachim. Isaia, Ieremia, Amos, Ezechiel și Țefania au rostit judecata asupra Moabului, care a trăit în tihnă din tinerețea lui."
    - "Nabonid a făcut campanie în regiune în 553 î.Hr., iar Moabul dispare ca regat; arabii și mai târziu nabateenii au stăpânit podișul, care a trecut în provincia romană Arabia în 106 d.Hr. Eusebiu mai cunoștea Moabul ca oraș al Arabiei, pe atunci numit Areopolis, al cărui ținut se numea și el Moab. Astăzi este centrul Iordaniei, guvernoratele Madaba și Karak, cu castelul cruciat din Kerak, harta-mozaic de la Madaba și ruinele de la Dhiban."
  bg:
    - "Моав е платото на изток от Мъртво море, на около 900 м височина, което се спуска стръмно към морето и е прорязано от дълбоките клисури на Арнон (Уади Муджиб) и Заред (Уади Хаса) — южната му граница с Едом. Сърцето му е било между двете клисури около Кир-Харешет (Керак); равнината на север от Арнон, с Дивон, Медева, Нево и Есевон, дълго е била спорна с Израил. Земята дава зърно и пасища: „Миса Моавският цар имаше стада“. Битие извежда моавците от по-голямата дъщеря на Лот, а моавският език, известен от стелата на Меша, е близък роднина на еврейския."
    - "В края на странстванията Израил се разположи на Моавските равнини срещу Йерихон, а Валак, царят на Моав, нае Валаам да ги прокълне; Валаам вместо това ги благослови и предвиди скиптър от Израил, който „ще порази Моавските князове“. На Израил беше казано да не напада Моав, „понеже на Лотовите синове дадох Ар за наследие“. Мойсей умря „в Моавовата земя“ на планината Нево. Във времето на съдиите Еглон Моавски потискаше Израил осемнадесет години, докато Ехуд не го уби; семейството на Елимелех отиде да живее там, а моавката Рут стана прабаба на Давид, който по-късно остави родителите си при моавския цар, а като цар направи моавците свои слуги."
    - "След смъртта на Ахав „Моавският цар се подигна против Израилевия цар“ и Йорам, Йосафат и едомският цар потеглиха срещу него; когато Меша бил обграден, той принесъл най-големия си син във всеизгаряне на стената и Израил се оттеглил. Собственият разказ на Меша е запазен върху базалтовата стела, намерена в Дибан през 1868 г. и днес в Лувъра: тя разказва как Омри потискал Моав, как Меша си възвърнал Медева, Нево и други градове за своя бог Хамос и построил градове и цистерни. Един повреден ред някои четат като „дом Давидов“, в което други се съмняват. Моав плащал данък на Теглатфеласар III, Сенахирим и Асардан, а моавски отряди нападали Юда в дните на Йоаким. Исаия, Йеремия, Амос, Йезекиил и Софония произнасят съд над Моав, който „биде в спокойствие от младост“."
    - "Набонид воюва в региона през 553 г. пр.н.е. и Моав изчезва като царство; араби, а по-късно набатейците владеят платото, което през 106 г. н.е. преминава в римската провинция Арабия. Евсевий още познава Моав като град в Арабия, тогава наричан Ареопол, чиято земя се наричала също Моав. Днес това е Централна Йордания — губерниите Мадаба и Керак, с кръстоносния замък Керак, мозаичната карта в Мадаба и развалините в Дибан."
