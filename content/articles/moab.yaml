# Overview article (ADR 0007). Mainstream facts only; the disputed line of the Mesha Stele is named as such; Assyrian dates follow the eponym chronology.
id: moab
place: aa0b1d6
title:
  en: "Moab"
  ru: "Моав"
body:
  en:
    - 'Moab is the tableland east of the Dead Sea, a plateau some 900 m high that falls steeply to the sea and is cut by the deep gorges of the Arnon (Wadi Mujib) and the Zered (Wadi Hasa), its southern border with Edom. Its heartland lay between the two gorges around Kir-hareseth (Kerak); the plain north of the Arnon, with Dibon, Medeba, Nebo and Heshbon, was long disputed with Israel. The land grows grain and pasture: Mesha, king of Moab, "was a sheepmaster". Genesis traces the Moabites to Lot''s elder daughter, and the Moabite language, known from the Mesha Stele, is a close relative of Hebrew.'
    - 'At the end of the wanderings Israel camped in the plains of Moab opposite Jericho, and Balak, king of Moab, hired Balaam to curse them; Balaam blessed instead and foresaw a sceptre out of Israel that "shall smite the corners of Moab". Israel was told not to attack Moab, "because I have given Ar unto the children of Lot". Moses died "in the land of Moab" on Mount Nebo. In the time of the judges Eglon of Moab oppressed Israel eighteen years until Ehud killed him; Elimelech''s family went to sojourn there, and Ruth the Moabitess became the great-grandmother of David, who later left his parents with the king of Moab, yet as king made the Moabites his servants.'
    - 'After Ahab died "the king of Moab rebelled against the king of Israel", and Jehoram, Jehoshaphat and the king of Edom marched against him; when Mesha was hemmed in he offered his eldest son as a burnt offering on the wall, and Israel withdrew. Mesha''s own account survives on the basalt stele found at Dhiban in 1868 and now in the Louvre: it tells how Omri had oppressed Moab, how Mesha took back Medeba, Nebo and other towns for his god Chemosh and built cities and cisterns. One damaged line is read by some as "house of David", which others doubt. Moab paid tribute to Tiglath-pileser III, Sennacherib and Esarhaddon, and Moabite bands harried Judah in the days of Jehoiakim. Isaiah, Jeremiah, Amos, Ezekiel and Zephaniah pronounced judgement on Moab, which "hath been at ease from his youth".'
    - "Nabonidus campaigned in the region in 553 BC, and Moab disappears as a kingdom; Arabs and later the Nabataeans held the plateau, which passed into the Roman province of Arabia in AD 106. Eusebius still knew Moab as the land about Areopolis, the old Ar. Today it is central Jordan, the governorates of Madaba and Karak, with the Crusader castle of Kerak, the mosaic map at Madaba and the ruins at Dhiban."
  ru:
    - "Моав — плоскогорье к востоку от Мёртвого моря, плато высотой около 900 м, круто обрывающееся к морю и прорезанное глубокими ущельями Арнона (Вади-Муджиб) и Зареда (Вади-Хаса), южной границы с Едомом. Сердце страны лежало между двумя ущельями вокруг Кирхарешета (Керака); равнина к северу от Арнона с Дивоном, Медевой, Нево и Есевоном долго была предметом спора с Израилем. Земля даёт хлеб и пастбища: Меса, царь Моавитский, «был богат скотом». Книга Бытия возводит Моавитян к старшей дочери Лота, а моавитский язык, известный по стеле Меши, — близкий родственник еврейского."
    - "В конце странствий Израиль стал станом на равнинах Моавитских против Иерихона, и Валак, царь Моавитский, нанял Валаама проклясть его; Валаам вместо того благословил и предрёк жезл от Израиля, который «разит князей Моава». Израилю было велено не воевать с Моавом, «потому что Ар отдал Я во владение сынам Лотовым». Моисей умер «в земле Моавитской» на горе Нево. Во времена судей Еглон, царь Моавитский, восемнадцать лет угнетал Израиль, пока его не убил Аод; семья Елимелеха пошла жить на поля Моавитские, и Руфь Моавитянка стала прабабушкой Давида, который позже оставил родителей у царя Моавитского, но, став царём, сделал Моавитян своими данниками."
    - "После смерти Ахава «царь Моавитский отложился от царя Израильского», и Иорам, Иосафат и царь Едомский выступили против него; когда Месу окружили, он вознёс своего первенца во всесожжение на стене, и Израиль отступил. Собственный рассказ Месы сохранился на базальтовой стеле, найденной в Дивоне в 1868 году и ныне хранящейся в Лувре: в ней говорится, как Амврий угнетал Моав, как Меса вернул Медеву, Нево и другие города своему богу Хамосу и строил города и водоёмы. Одну повреждённую строку некоторые читают как «дом Давида», другие это оспаривают. Моав платил дань Феглаффелласару III, Сеннахириму и Асардану, а полчища Моавитян тревожили Иудею во дни Иоакима. Исаия, Иеремия, Амос, Иезекииль и Софония возвещали суд Моаву, который «от юности своей был в покое»."
    - "Набонид воевал в этих краях в 553 г. до н. э., и Моав исчезает как царство; плато держали арабы, а затем Набатеи, и в 106 г. н. э. оно вошло в римскую провинцию Аравия. Евсевий ещё знал Моав как землю вокруг Ареополя, древнего Ара. Сегодня это центральная Иордания, провинции Мадаба и Эль-Карак, с крестоносным замком Керак, мозаичной картой в Мадабе и развалинами в Дибане."
