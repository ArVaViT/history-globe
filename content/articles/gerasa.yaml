  - "Cassius Dio, Roman History 68.14.5 (annexation of Arabia under Trajan)"
  - "Origen, Commentary on John 6.24 (ANF 10; Gerasa, Gadara and Gergesa)"
  - "Eusebius, Onomasticon, s.v. Gergasei and Gergesa (C. U. Wolf's translation, nos. 304, 363)"
  - "Epiphanius, Panarion 51.30.2 (the stream at the martyrium of Gerasa); 73.26 (Exeresius of Gerasa at Seleucia, 359)"
  - "C. H. Kraeling (ed.), Gerasa: City of the Decapolis (1938), the report of the Yale, British School and ASOR excavations of 1928-1934"
  - "B. M. Metzger, A Textual Commentary on the Greek New Testament (2nd ed., 1994), on Matt 8:28, Mark 5:1, Luke 8:26"
