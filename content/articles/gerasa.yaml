body:
  en:
    - 'Gerasa, today''s Jerash in northern Jordan, lies in the hills of Gilead about 35 km north of Amman (some 48 km by road), on a stream the Greeks called Chrysorrhoas, "golden river", running down to the Jabbok. The city was a Greek foundation. Later tradition in Gerasa named Alexander the Great or his general Perdiccas as its founder, but its official name, Antioch on the Chrysorrhoas, points to a Seleucid king, probably in the second century BC. Josephus says that Alexander Jannaeus took Gerasa in the early first century BC after building a triple wall around it.'
    - "After the Roman conquest of 63 BC Gerasa came under Rome and was counted among the Greek cities of the Decapolis; Pliny lists it as Galasa. When the revolt of AD 66 broke out, Jewish bands laid waste the villages around it, yet, Josephus says, the Gerasenes did no harm to the Jews who stayed and escorted those who wished to leave as far as their borders. After Trajan annexed the Nabataean kingdom in 106, Gerasa belonged to the new province of Arabia. From the late first century and through the second it was rebuilt on a grand scale, with an oval plaza, a colonnaded main street, temples of Zeus and Artemis, theatres and an arch for Hadrian's visit of 129–130."
    - "Mark and Luke tell how Jesus crossed the Sea of Galilee and healed a man possessed by a legion of devils, which entered a herd of swine that ran down a steep place into the lake. The manuscripts name the place differently. The KJV and the Synodal text read Gadarenes in Mark and Luke and Gergesenes in Matthew, while many modern editions read Gerasenes in Mark and Luke and Gadarenes in Matthew. Gerasa lies more than 50 km from the lake, and already Origen preferred Gergesa, an old town by the lake with a steep bank above the water; Eusebius knew a village of that name on the hills by the lake. Mark adds that the healed man proclaimed in Decapolis what Jesus had done for him."
    - "By the fourth century the city had a Christian community. Exeresius, bishop of Gerasa, signed at the Council of Seleucia in 359, and Epiphanius writes that his brethren drank from a stream in the martyrium at Gerasa which, like other springs, was said to turn to wine on the day of the miracle at Cana. A cathedral was built in the fourth century, the first of many churches in the city. Large-scale excavations were carried out from 1928 by Yale University with the British and American schools of archaeology, and Gerasa is now one of the best preserved Roman cities of the Near East."
  ru:
    - "Гераса, нынешний Джераш на севере Иордании, лежит в горах Галаада, примерно в 35 км к северу от Аммана (около 48 км по дороге), на речке, которую греки называли Хрисороем, «золотой рекой»; она стекает к Иавоку. Город основали греки. Позднейшее предание самой Герасы называло основателем Александра Македонского или его полководца Пердикку, но официальное имя города — Антиохия на Хрисорое — указывает на царя из династии Селевкидов, вероятно, во II веке до н. э. Иосиф Флавий сообщает, что Александр Яннай взял Герасу в начале I века до н. э., окружив её тройной стеной."
    - "После римского завоевания 63 г. до н. э. Гераса перешла под власть Рима и причислялась к греческим городам Десятиградия; Плиний называет её Галасой. Когда в 66 г. н. э. вспыхнуло восстание, иудейские отряды опустошили селения вокруг неё, но жители Герасы, по словам Иосифа Флавия, не тронули оставшихся у них иудеев, а желавших уйти проводили до своих границ. После того как Траян в 106 г. присоединил Набатейское царство, Гераса вошла в новую провинцию Аравия. С конца I века и во II веке её перестроили с размахом: овальная площадь, главная улица с колоннадой, храмы Зевса и Артемиды, театры и арка в честь посещения Адриана в 129–130 гг."
    - "Марк и Лука рассказывают, как Иисус переправился через Море Галилейское и исцелил человека, одержимого легионом бесов; бесы вошли в стадо свиней, и оно бросилось с крутизны в озеро. В рукописях место названо по-разному. Синодальный перевод, как и KJV, читает у Марка и Луки «в страну Гадаринскую», у Матфея — «в страну Гергесинскую», а многие современные издания читают у Марка и Луки «Герасинская», у Матфея — «Гадаринская». Гераса лежит более чем в 50 км от озера, и уже Ориген предпочитал Гергесу, древний город у озера с крутым обрывом к воде; Евсевий знал селение с таким именем на горах у озера. Марк добавляет, что исцелённый проповедовал в Десятиградии, что сотворил с ним Иисус."
    - "К IV веку в городе была христианская община. Епископ Герасы Эксересий подписался на Селевкийском соборе 359 г., а Епифаний пишет, что его братия пила из потока в мартирии Герасы, который, как и другие источники, по преданию превращался в вино в день чуда в Кане. В IV веке был построен собор — первый из многих храмов города. Большие раскопки с 1928 г. вели Йельский университет вместе с Британской и Американской археологическими школами, и сегодня Гераса — один из лучше всего сохранившихся римских городов Ближнего Востока."
  uk:
    - "Гераса, сьогоднішній Джераш на півночі Йорданії, лежить у пагорбах Гілеаду приблизно за 35 км на північ від Амману (близько 48 км дорогою), на потоці, який греки називали Хрисороас, «золота річка», що збігає до Яббоку. Місто було грецьким заснуванням. Пізніша герасенська традиція називала його засновником Александра Македонського або його полководця Пердікку, але його офіційна назва — Антіохія на Хрисороасі — вказує на селевкідського царя, ймовірно, у II ст. до н. е. Йосиф Флавій розповідає, що Александр Яннай узяв Герасу на початку I ст. до н. е., збудувавши навколо неї потрійний мур."
    - "Після римського завоювання 63 р. до н. е. Гераса опинилася під владою Риму й була зарахована до грецьких міст Десятимістя; Пліній називає її Галаса. Коли 66 р. н. е. спалахнуло повстання, юдейські загони спустошили довколишні села, проте, за словами Йосифа Флавія, герасенці не заподіяли шкоди юдеям, які залишилися, а тих, хто хотів піти, провели до своїх меж. Після того як Траян 106 року анексував Набатейське царство, Гераса належала до нової провінції Аравія. З кінця I ст. і протягом II ст. її відбудовували у великому масштабі: з овальною площею, головною вулицею з колонадою, храмами Зевса й Артеміди, театрами та аркою на честь приїзду Адріана 129–130 років."
    - "Марк і Лука розповідають, як Ісус переплив Галілейське море й зцілив чоловіка, одержимого легіоном бісів, які ввійшли в череду свиней, що кинулася з кручі в озеро. Рукописи називають це місце по-різному. Біблія короля Якова й Синодальний текст читають «гадаринці» в Марка й Луки та «гергесинці» в Матвія, тоді як багато сучасних видань читають «герасенці» в Марка й Луки та «гадаринці» в Матвія. Гераса лежить більш як за 50 км від озера, і вже Оріген віддавав перевагу Гергесі, давньому місту біля озера з крутим берегом над водою; Євсевій знав село з такою назвою на пагорбах біля озера. Марк додає, що зцілений проголосив у Десятимісті, що зробив для нього Ісус."
    - "У IV ст. місто мало християнську громаду. Ексересій, єпископ Гераси, підписав акти Селевкійського собору 359 року, а Єпіфаній пише, що його брати пили з джерела в мартіріумі в Герасі, яке, як і інші джерела, нібито перетворювалося на вино в день чуда в Кані. У IV ст. збудували собор, перший із багатьох церков міста. Великі розкопки провів від 1928 року Єльський університет разом із британською та американською школами археології, і Гераса нині — одне з найкраще збережених римських міст Близького Сходу."
  es:
    - "Gerasa, la actual Jerash en el norte de Jordania, se halla en las colinas de Galaad, a unos 35 km al norte de Amán (unos 48 km por carretera), junto a un arroyo que los griegos llamaban Crisorroas, «río de oro», que desciende al Jaboc. La ciudad fue una fundación griega. Una tradición posterior de Gerasa señalaba como fundador a Alejandro Magno o a su general Pérdicas, pero su nombre oficial, Antioquía del Crisorroas, apunta a un rey seléucida, probablemente en el siglo II a. C. Josefo dice que Alejandro Janeo tomó Gerasa a comienzos del siglo I a. C. después de levantar a su alrededor una triple muralla."
    - "Tras la conquista romana del 63 a. C. Gerasa pasó a Roma y se contó entre las ciudades griegas de la Decápolis; Plinio la menciona como Galasa. Cuando estalló la revuelta del 66 d. C., bandas judías devastaron las aldeas de su entorno; sin embargo, dice Josefo, los gerasenos no hicieron daño a los judíos que se quedaron y escoltaron hasta sus fronteras a los que quisieron irse. Después de que Trajano anexionara el reino nabateo en el 106, Gerasa perteneció a la nueva provincia de Arabia. Desde fines del siglo I y durante el II fue reconstruida a gran escala, con una plaza oval, una calle principal de columnas, templos de Zeus y de Artemisa, teatros y un arco por la visita de Adriano en 129–130."
    - "Marcos y Lucas cuentan cómo Jesús cruzó el mar de Galilea y sanó a un hombre poseído por una legión de demonios, que entraron en una piara de cerdos que se precipitó por una pendiente al lago. Los manuscritos nombran el lugar de maneras distintas. La versión del rey Jacobo (King James) y el texto sinodal leen gadarenos en Marcos y Lucas y gergesenos en Mateo, mientras que muchas ediciones modernas leen gerasenos en Marcos y Lucas y gadarenos en Mateo. Gerasa está a más de 50 km del lago, y ya Orígenes prefería Gergesa, una antigua población junto al lago con una ribera escarpada sobre el agua; Eusebio conoció una aldea de ese nombre en las colinas junto al lago. Marcos añade que el hombre sanado proclamó en la Decápolis lo que Jesús había hecho por él."
    - "En el siglo IV la ciudad tenía una comunidad cristiana. Exeresio, obispo de Gerasa, firmó en el concilio de Seleucia del 359, y Epifanio escribe que sus hermanos bebían de un arroyo en el martirio de Gerasa que, como otras fuentes, se decía que se convertía en vino el día del milagro de Caná. En el siglo IV se construyó una catedral, la primera de muchas iglesias de la ciudad. Desde 1928 la Universidad de Yale realizó excavaciones a gran escala junto con las escuelas británica y estadounidense de arqueología, y Gerasa es hoy una de las ciudades romanas mejor conservadas del Oriente Próximo."
  pt:
    - "Gerasa, a atual Jerash, no norte da Jordânia, fica nas colinas de Gileade, a cerca de 35 km ao norte de Amã (uns 48 km por estrada), num riacho que os gregos chamavam Crisórroas, “rio de ouro”, que desce para o Jaboque. A cidade foi uma fundação grega. A tradição posterior em Gerasa apontava Alexandre, o Grande, ou seu general Perdicas como fundador, mas o seu nome oficial, Antioquia do Crisórroas, aponta para um rei selêucida, provavelmente no século II a.C. Josefo diz que Alexandre Janeu tomou Gerasa no início do século I a.C., depois de construir um triplo muro em volta dela."
    - "Depois da conquista romana de 63 a.C., Gerasa passou a Roma e foi contada entre as cidades gregas da Decápolis; Plínio a lista como Galasa. Quando a revolta de 66 d.C. estourou, bandos judeus devastaram as aldeias ao redor, mas, diz Josefo, os gerasenos não fizeram mal aos judeus que ficaram e escoltaram até suas fronteiras os que quiseram partir. Depois que Trajano anexou o reino nabateu em 106, Gerasa pertenceu à nova província da Arábia. Do fim do século I e durante o II foi reconstruída em grande escala, com uma praça oval, uma rua principal com colunatas, templos de Zeus e Ártemis, teatros e um arco para a visita de Adriano em 129–130."
    - "Marcos e Lucas contam como Jesus atravessou o mar da Galileia e curou um homem possuído por uma legião de demônios, que entrou numa manada de porcos que se precipitou num despenhadeiro para dentro do lago. Os manuscritos nomeiam o lugar de maneiras diferentes. A King James e o texto Sinodal leem gadarenos em Marcos e Lucas e gergesenos em Mateus, ao passo que muitas edições modernas leem gerasenos em Marcos e Lucas e gadarenos em Mateus. Gerasa fica a mais de 50 km do lago, e já Orígenes preferia Gergesa, uma antiga cidade junto ao lago com uma ribanceira íngreme acima da água; Eusébio conheceu uma aldeia desse nome nas colinas junto ao lago. Marcos acrescenta que o homem curado proclamou na Decápolis o que Jesus fizera por ele."
    - "No século IV a cidade já tinha uma comunidade cristã. Exeresius, bispo de Gerasa, assinou no Concílio de Selêucia em 359, e Epifânio escreve que seus irmãos bebiam de um riacho no martírio de Gerasa que, como outras fontes, se dizia transformar-se em vinho no dia do milagre de Caná. Uma catedral foi construída no século IV, a primeira de muitas igrejas na cidade. Escavações em grande escala foram realizadas a partir de 1928 pela Universidade Yale com as escolas britânica e americana de arqueologia, e Gerasa é hoje uma das cidades romanas mais bem conservadas do Oriente Próximo."
  de:
    - "Gerasa, das heutige Dscherasch im Norden Jordaniens, liegt im Bergland Gilead etwa 35 km nördlich von Amman (rund 48 km auf der Straße) an einem Bach, den die Griechen Chrysorrhoas, „Goldstrom“, nannten und der zum Jabbok hinabfließt. Die Stadt war eine griechische Gründung. Eine spätere Überlieferung in Gerasa nannte Alexander den Großen oder seinen General Perdikkas als Gründer, doch ihr amtlicher Name, Antiochia am Chrysorrhoas, weist auf einen seleukidischen König, wahrscheinlich im 2. Jahrhundert v. Chr. Josephus sagt, Alexander Jannäus habe Gerasa im frühen 1. Jahrhundert v. Chr. eingenommen, nachdem er eine dreifache Mauer um die Stadt gezogen hatte."
    - "Nach der römischen Eroberung von 63 v. Chr. kam Gerasa unter Rom und zählte zu den griechischen Städten der Dekapolis; Plinius führt es als Galasa auf. Als 66 n. Chr. der Aufstand ausbrach, verwüsteten jüdische Banden die Dörfer ringsum, doch die Gerasener, sagt Josephus, taten den Juden, die blieben, nichts zuleide und geleiteten jene, die gehen wollten, bis an ihre Grenzen. Nachdem Trajan 106 das Nabatäerreich annektiert hatte, gehörte Gerasa zur neuen Provinz Arabien. Vom späten 1. Jahrhundert an und durch das ganze 2. wurde es großartig neu gebaut, mit einem ovalen Platz, einer Säulenstraße, Tempeln für Zeus und Artemis, Theatern und einem Bogen für Hadrians Besuch von 129–130."
    - "Markus und Lukas erzählen, wie Jesus den See Genezareth überquerte und einen Mann heilte, der von einer Legion Dämonen besessen war, die in eine Schweineherde fuhr, welche den Abhang hinab in den See stürzte. Die Handschriften nennen den Ort unterschiedlich. Die King-James-Bibel und der Synodaltext lesen bei Markus und Lukas Gadarener und bei Matthäus Gergesener, während viele moderne Ausgaben bei Markus und Lukas Gerasener und bei Matthäus Gadarener lesen. Gerasa liegt mehr als 50 km vom See entfernt, und schon Origenes bevorzugte Gergesa, eine alte Stadt am See mit einem steilen Ufer über dem Wasser; Eusebius kannte ein Dorf dieses Namens auf den Hügeln am See. Markus fügt hinzu, der Geheilte habe in der Dekapolis verkündet, was Jesus an ihm getan hatte."
    - "Im 4. Jahrhundert hatte die Stadt eine christliche Gemeinde. Exeresios, Bischof von Gerasa, unterschrieb 359 auf dem Konzil von Seleukia, und Epiphanios schreibt, seine Brüder hätten aus einem Bach im Martyrion von Gerasa getrunken, der wie andere Quellen am Tag des Wunders zu Kana zu Wein geworden sein soll. Im 4. Jahrhundert wurde eine Kathedrale gebaut, die erste von vielen Kirchen der Stadt. Umfangreiche Grabungen führte ab 1928 die Yale-Universität mit den britischen und amerikanischen archäologischen Schulen durch, und Gerasa ist heute eine der am besten erhaltenen römischen Städte des Nahen Ostens."
  fr:
    - "Gérasa, aujourd’hui Jerash, dans le nord de la Jordanie, se trouve dans les collines de Galaad, à environ 35 km au nord d’Amman (quelque 48 km par la route), sur un cours d’eau que les Grecs appelaient Chrysorroas, « fleuve d’or », qui descend vers le Jabbok. La ville était une fondation grecque. Une tradition ultérieure de Gérasa donnait pour fondateur Alexandre le Grand ou son général Perdiccas, mais son nom officiel, Antioche sur le Chrysorroas, renvoie à un roi séleucide, probablement au IIe siècle av. J.-C. Josèphe dit qu’Alexandre Jannée prit Gérasa au début du Ier siècle av. J.-C. après l’avoir entourée d’un triple mur."
    - "Après la conquête romaine de 63 av. J.-C., Gérasa passa sous Rome et fut comptée parmi les cités grecques de la Décapole ; Pline la nomme Galasa. Quand la révolte de 66 apr. J.-C. éclata, des bandes juives ravagèrent les villages alentour, mais, dit Josèphe, les Géraséniens ne firent aucun mal aux Juifs qui restaient et escortèrent jusqu’à leurs frontières ceux qui voulaient partir. Après l’annexion du royaume nabatéen par Trajan en 106, Gérasa appartint à la nouvelle province d’Arabie. De la fin du Ier siècle et durant le IIe, elle fut rebâtie à grande échelle, avec une place ovale, une rue principale à colonnades, des temples de Zeus et d’Artémis, des théâtres et un arc pour la visite d’Hadrien en 129–130."
    - "Marc et Luc racontent comment Jésus traversa la mer de Galilée et guérit un homme possédé par une légion de démons, qui entrèrent dans un troupeau de pourceaux se précipitant d’une pente escarpée dans le lac. Les manuscrits nomment le lieu diversement. La King James et le texte synodal lisent Gadaréniens chez Marc et Luc et Gergéséniens chez Matthieu, tandis que beaucoup d’éditions modernes lisent Géraséniens chez Marc et Luc et Gadaréniens chez Matthieu. Gérasa se trouve à plus de 50 km du lac, et Origène préférait déjà Gergesa, ancienne ville au bord du lac dont la rive abrupte surplombe l’eau ; Eusèbe connaissait un village de ce nom sur les collines près du lac. Marc ajoute que l’homme guéri proclama dans la Décapole ce que Jésus avait fait pour lui."
    - "Au IVe siècle, la ville avait une communauté chrétienne. Exérésius, évêque de Gérasa, signa au concile de Séleucie en 359, et Épiphane écrit que ses frères buvaient à une source du martyrium de Gérasa qui, comme d’autres sources, passait pour se changer en vin le jour du miracle de Cana. Une cathédrale fut bâtie au IVe siècle, la première de nombreuses églises de la ville. De grandes fouilles furent menées à partir de 1928 par l’Université Yale avec les écoles britannique et américaine d’archéologie, et Gérasa est aujourd’hui l’une des villes romaines les mieux conservées du Proche-Orient."
  pl:
    - "Gerasa, dzisiejszy Dżerasz w północnej Jordanii, leży we wzgórzach Gileadu około 35 km na północ od Ammanu (jakieś 48 km drogą), nad strumieniem, który Grecy zwali Chryzorroas, „złota rzeka”, spływającym do Jabboku. Miasto było greckim założeniem. Późniejsza tradycja w Gerasie podawała za jego założyciela Aleksandra Wielkiego lub jego wodza Perdikkasa, lecz jego oficjalna nazwa, Antiochia nad Chryzorroasem, wskazuje na króla Seleucydów, prawdopodobnie w II w. p.n.e. Józef Flawiusz mówi, że Aleksander Janneusz zdobył Gerasę na początku I w. p.n.e., po otoczeniu jej potrójnym murem."
    - "Po rzymskim podboju w 63 r. p.n.e. Gerasa znalazła się pod Rzymem i zaliczano ją do greckich miast Dekapolu; Pliniusz wymienia ją jako Galasa. Gdy w 66 r. n.e. wybuchło powstanie, żydowskie bandy spustoszyły okoliczne wsie, lecz, jak mówi Józef Flawiusz, Gerazeńczycy nie skrzywdzili Żydów, którzy zostali, i odprowadzili tych, którzy chcieli odejść, aż do swoich granic. Gdy Trajan w 106 r. przyłączył królestwo Nabatejczyków, Gerasa należała do nowej prowincji Arabia. Od końca I w. i przez cały II w. odbudowywano ją na wielką skalę, z owalnym placem, główną ulicą z kolumnadą, świątyniami Zeusa i Artemidy, teatrami i łukiem na wizytę Hadriana w latach 129–130."
    - "Marek i Łukasz opowiadają, jak Jezus przeprawił się przez Jezioro Galilejskie i uzdrowił człowieka opętanego przez legion demonów, które weszły w stado świń, a to zbiegło po urwisku do jeziora. Rękopisy nazywają to miejsce różnie. Biblia Króla Jakuba i tekst synodalny czytają Gadareńczycy u Marka i Łukasza, a Gergezeńczycy u Mateusza, podczas gdy wiele nowoczesnych wydań czyta Gerazeńczycy u Marka i Łukasza, a Gadareńczycy u Mateusza. Gerasa leży ponad 50 km od jeziora i już Orygenes wolał Gergesę, dawne miasto nad jeziorem ze stromym brzegiem nad wodą; Euzebiusz znał wieś o tej nazwie na wzgórzach nad jeziorem. Marek dodaje, że uzdrowiony ogłosił w Dekapolu, co Jezus dla niego uczynił."
    - "Do IV w. miasto miało wspólnotę chrześcijańską. Eksereziusz, biskup Gerasy, podpisał akta synodu w Seleucji w 359 r., a Epifaniusz pisze, że jego bracia pili ze strumienia w martyrium w Gerasie, który, jak inne źródła, miał zamieniać się w wino w dniu cudu w Kanie. W IV w. zbudowano katedrę, pierwszą z wielu kościołów w mieście. Wielkoskalowe wykopaliska prowadził od 1928 r. Uniwersytet Yale z brytyjską i amerykańską szkołą archeologiczną, a Gerasa jest dziś jednym z najlepiej zachowanych rzymskich miast Bliskiego Wschodu."
  it:
    - "Gerasa, l’odierna Jerash nella Giordania settentrionale, sorge sulle colline di Galaad circa 35 km a nord di Amman (48 km circa su strada), su un torrente che i Greci chiamavano Crisorroa, «fiume d’oro», che scende verso lo Iabbok. La città fu una fondazione greca. La tradizione successiva a Gerasa indicava come fondatore Alessandro Magno o il suo generale Perdicca, ma il suo nome ufficiale, Antiochia sul Crisorroa, rimanda a un re seleucide, probabilmente nel II secolo a.C. Giuseppe Flavio dice che Alessandro Ianneo prese Gerasa all’inizio del I secolo a.C. dopo averla cinta con una triplice muraglia."
    - "Dopo la conquista romana del 63 a.C. Gerasa passò a Roma e fu annoverata fra le città greche della Decapoli; Plinio la elenca come Galasa. Quando scoppiò la rivolta del 66 d.C., bande giudaiche devastarono i villaggi attorno, ma, dice Giuseppe Flavio, i Gerasèni non fecero alcun male ai Giudei che rimasero e scortarono fino ai loro confini quelli che volevano partire. Dopo che Traiano annesse il regno nabateo nel 106, Gerasa appartenne alla nuova provincia di Arabia. Dalla fine del I secolo e per tutto il II fu ricostruita su vasta scala, con una piazza ovale, una strada principale colonnata, templi di Zeus e di Artemide, teatri e un arco per la visita di Adriano del 129–130."
    - "Marco e Luca raccontano come Gesù attraversò il Lago di Tiberiade e guarì un uomo posseduto da una legione di demoni, che entrarono in una mandria di porci la quale si precipitò giù per un pendio scosceso nel lago. I manoscritti indicano il luogo in modi diversi. La KJV e il testo sinodale leggono Gadareni in Marco e Luca e Gergeseni in Matteo, mentre molte edizioni moderne leggono Gerasèni in Marco e Luca e Gadareni in Matteo. Gerasa dista più di 50 km dal lago, e già Origene preferiva Gergesa, un’antica città presso il lago con una riva scoscesa sopra l’acqua; Eusebio conosceva un villaggio con quel nome sulle colline presso il lago. Marco aggiunge che l’uomo guarito proclamò nella Decapoli ciò che Gesù aveva fatto per lui."
    - "Nel IV secolo la città aveva una comunità cristiana. Exeresio, vescovo di Gerasa, firmò al concilio di Seleucia del 359, ed Epifanio scrive che i suoi fratelli bevevano da una sorgente nel martyrium di Gerasa che, come altre fonti, si diceva si mutasse in vino nel giorno del miracolo di Cana. Una cattedrale fu costruita nel IV secolo, la prima di molte chiese della città. Scavi su vasta scala furono condotti dal 1928 dall’Università di Yale con le scuole britannica e americana di archeologia, e Gerasa è oggi una delle città romane meglio conservate del Vicino Oriente."
  nl:
    - "Gerasa, het huidige Jerash in het noorden van Jordanië, ligt in het bergland van Gilead, ongeveer 35 km ten noorden van Amman (zo’n 48 km over de weg), aan een beek die de Grieken de Chrysorroas noemden, “gouden rivier”, die naar de Jabbok stroomt. De stad was een Griekse stichting. Een latere overlevering in Gerasa noemde Alexander de Grote of zijn generaal Perdikkas als stichter, maar haar officiële naam, Antiochië aan de Chrysorroas, wijst op een Seleucidische koning, waarschijnlijk in de 2e eeuw v.Chr. Josephus zegt dat Alexander Jannaeus Gerasa in het begin van de 1e eeuw v.Chr. innam nadat hij er een drievoudige muur omheen had gebouwd."
    - "Na de Romeinse verovering van 63 v.Chr. kwam Gerasa onder Rome en werd gerekend tot de Griekse steden van de Dekapolis; Plinius noemt het Galasa. Toen in 66 n.Chr. de opstand uitbrak, verwoestten Joodse benden de dorpen eromheen, maar de Gerasenen, zegt Josephus, deden de Joden die bleven geen kwaad en geleidden wie wilde vertrekken tot aan hun grenzen. Nadat Traianus in 106 het Nabateese koninkrijk annexeerde, hoorde Gerasa bij de nieuwe provincie Arabië. Vanaf het eind van de 1e eeuw en gedurende de 2e werd het op grote schaal herbouwd, met een ovaal plein, een zuilenstraat, tempels van Zeus en Artemis, theaters en een boog voor het bezoek van Hadrianus in 129–130."
    - "Marcus en Lukas vertellen hoe Jezus het Meer van Galilea overstak en een man genas die bezeten was door een legioen duivelen, die in een kudde zwijnen voeren die van een steile plaats in het meer stortte. De handschriften noemen de plaats verschillend. De King James Version en de Synodale tekst lezen Gadarenen in Marcus en Lukas en Gergesenen in Mattheüs, terwijl veel moderne edities Gerasenen lezen in Marcus en Lukas en Gadarenen in Mattheüs. Gerasa ligt meer dan 50 km van het meer, en al Origenes gaf de voorkeur aan Gergesa, een oude stad aan het meer met een steile oever boven het water; Eusebius kende een dorp met die naam op de heuvels bij het meer. Marcus voegt toe dat de genezen man in de Dekapolis verkondigde wat Jezus voor hem gedaan had."
    - "In de 4e eeuw had de stad een christelijke gemeente. Exeresius, bisschop van Gerasa, ondertekende in 359 op het concilie van Seleucië, en Epiphanius schrijft dat zijn broeders dronken uit een bron in het martyrium te Gerasa, die, zoals andere bronnen, op de dag van het wonder te Kana in wijn zou zijn veranderd. In de 4e eeuw werd een kathedraal gebouwd, de eerste van vele kerken in de stad. Vanaf 1928 vonden grootschalige opgravingen plaats door Yale University met de Britse en Amerikaanse archeologische scholen, en Gerasa is nu een van de best bewaarde Romeinse steden van het Nabije Oosten."
  cs:
    - "Gerasa, dnešní Džeraš v severním Jordánsku, leží v pahorcích Gileadu asi 35 km severně od Ammánu (po silnici zhruba 48 km), na potoce, který Řekové nazývali Chrysorrhoas, „zlatá řeka“, a který stéká k Jaboku. Město bylo řeckým založením. Pozdější tradice v Gerase jmenovala jako zakladatele Alexandra Velikého nebo jeho vojevůdce Perdikka, ale jeho úřední jméno, Antiochie na Chrysorrhou, ukazuje na seleukovského krále, pravděpodobně ve 2. stol. př. n. l. Josephus praví, že Alexandr Jannaios dobyl Gerasu na počátku 1. stol. př. n. l., když kolem ní postavil trojitou hradbu."
    - "Po římském dobytí roku 63 př. n. l. připadla Gerasa Římu a byla počítána mezi řecká města Dekapole; Plinius ji uvádí jako Galasa. Když roku 66 n. l. vypuklo povstání, židovské tlupy vyplenily okolní vesnice, avšak, jak praví Josephus, Gerasští neublížili Židům, kteří zůstali, a ty, kdo chtěli odejít, doprovodili až k hranicím. Po připojení nabatejského království Traianem roku 106 patřila Gerasa k nové provincii Arábii. Od konce 1. století a během 2. století byla ve velkém přestavěna, s oválným náměstím, sloupovou hlavní ulicí, chrámy Dia a Artemidy, divadly a obloukem k Hadrianově návštěvě v letech 129–130."
    - "Marek a Lukáš vyprávějí, jak Ježíš přeplul Galilejské jezero a uzdravil člověka posedlého legií ďáblů, kteří vešli do stáda vepřů, jež se řítilo z příkrého svahu do jezera. Rukopisy jmenují místo různě. Bible krále Jakuba a synodální text čtou u Marka a Lukáše Gadarenští a u Matouše Gergesenští, kdežto mnohá moderní vydání čtou u Marka a Lukáše Gerasenští a u Matouše Gadarenští. Gerasa leží více než 50 km od jezera a už Órigenés dával přednost Gergese, starému městu u jezera s příkrým břehem nad vodou; Eusebios znal vesnici tohoto jména na pahorcích u jezera. Marek dodává, že uzdravený hlásal v Dekapoli, co mu Ježíš učinil."
    - "Ve 4. století mělo město křesťanskou obec. Exeresios, biskup gerasský, podepsal na koncilu v Seleukii roku 359 a Epifanios píše, že jeho bratři pili z potoka v martyriu v Gerase, který se prý, podobně jako jiné prameny, měnil ve víno v den zázraku v Káně. Ve 4. století byla postavena katedrála, první z mnoha kostelů ve městě. Rozsáhlé vykopávky provádělo od roku 1928 Yaleova univerzita s britskými a americkými archeologickými školami a Gerasa je dnes jedním z nejlépe zachovaných římských měst Blízkého východu."
  sv:
    - "Gerasa, dagens Jerash i norra Jordanien, ligger i Gileads berg omkring 35 km norr om Amman (cirka 48 km på väg), vid en å som grekerna kallade Chrysorrhoas, ”guldfloden”, som rinner ned mot Jabbok. Staden var en grekisk grundläggning. Senare tradition i Gerasa nämnde Alexander den store eller hans fältherre Perdikkas som grundare, men dess officiella namn, Antiochia vid Chrysorrhoas, pekar på en seleukidisk kung, troligen på 100-talet f.Kr. Josefus säger att Alexander Jannaios intog Gerasa i början av första århundradet f.Kr. efter att ha byggt en trefaldig mur kring den."
    - "Efter den romerska erövringen år 63 f.Kr. kom Gerasa under Rom och räknades bland de grekiska städerna i Dekapolis; Plinius för upp den som Galasa. När upproret år 66 e.Kr. bröt ut, härjade judiska band byarna runt omkring, men, säger Josefus, gerasenerna gjorde inte de judar som stannade kvar något ont och eskorterade dem som ville lämna staden till gränsen. Sedan Trajanus annekterat det nabatéiska riket år 106 hörde Gerasa till provinsen Arabien. Från slutet av första århundradet och genom det andra byggdes den om i stor skala, med ett ovalt torg, en kolonnadgata, tempel för Zeus och Artemis, teatrar och en båge för Hadrianus besök 129–130."
    - "Markus och Lukas berättar hur Jesus korsade Galileiska sjön och botade en man som var besatt av en legion onda andar, vilka for in i en svinhjord som störtade utför en brant ned i sjön. Handskrifterna anger platsen olika. King James-bibeln och den synodala texten har gadarener hos Markus och Lukas och gergesener hos Matteus, medan många moderna utgåvor har gerasener hos Markus och Lukas och gadarener hos Matteus. Gerasa ligger mer än 50 km från sjön, och redan Origenes föredrog Gergesa, en gammal stad vid sjön med en brant strand ovanför vattnet; Eusebios kände en by med det namnet på höjderna vid sjön. Markus tillägger att den botade mannen förkunnade i Dekapolis vad Jesus hade gjort för honom."
    - "På 300-talet hade staden en kristen församling. Exeresios, biskop av Gerasa, undertecknade vid kyrkomötet i Seleukia år 359, och Epifanios skriver att hans bröder drack ur en bäck i martyrionet i Gerasa som, liksom andra källor, sades förvandlas till vin på dagen för miraklet i Kana. En katedral byggdes på 300-talet, den första av många kyrkor i staden. Storskaliga utgrävningar gjordes från 1928 av Yale-universitetet tillsammans med de brittiska och amerikanska arkeologiska skolorna, och Gerasa är nu en av Främre Orientens bäst bevarade romerska städer."
  nb:
    - "Gerasa, dagens Jerash i det nordlige Jordan, ligger i Gileads åser omtrent 35 km nord for Amman (om lag 48 km med vei), ved en bekk grekerne kalte Chrysorrhoas, «gullelven», som renner ned til Jabbok. Byen var en gresk grunnleggelse. Senere tradisjon i Gerasa nevnte Aleksander den store eller hans general Perdikkas som grunnlegger, men dens offisielle navn, Antiokia ved Chrysorrhoas, peker på en seleukidisk konge, trolig på 100-tallet f.Kr. Josefus sier at Aleksander Jannaios inntok Gerasa tidlig på det første århundre f.Kr. etter å ha bygd en tredobbel mur rundt den."
    - "Etter den romerske erobringen i 63 f.Kr. kom Gerasa under Roma og ble regnet blant de greske byene i Dekapolis; Plinius oppfører den som Galasa. Da opprøret i 66 e.Kr. brøt ut, herjet jødiske bander landsbyene rundt den, men, sier Josefus, gerasenerne gjorde ikke jødene som ble værende noe ondt, og fulgte dem som ville dra, til grensene. Etter at Trajan innlemmet nabatearriket i 106, hørte Gerasa til den nye provinsen Arabia. Fra slutten av det første århundre og gjennom det andre ble den gjenreist i stor stil, med en oval plass, en søylegate som hovedgate, templer for Zevs og Artemis, teatre og en bue til Hadrians besøk i 129–130."
    - "Markus og Lukas forteller hvordan Jesus krysset Galileasjøen og helbredet en mann besatt av en legion av onde ånder, som fór i en svinehjord som styrtet ned en bratt skråning og ut i innsjøen. Håndskriftene nevner stedet ulikt. KJV og den synodale teksten har gadarenerne hos Markus og Lukas og gergesenerne hos Matteus, mens mange moderne utgaver har gerasenerne hos Markus og Lukas og gadarenerne hos Matteus. Gerasa ligger mer enn 50 km fra innsjøen, og allerede Origenes foretrakk Gergesa, en gammel by ved innsjøen med en bratt bredd over vannet; Eusebius kjente en landsby med det navnet på åsene ved innsjøen. Markus legger til at den helbredede forkynte i Dekapolis hva Jesus hadde gjort for ham."
    - "På 300-tallet hadde byen et kristent samfunn. Exeresius, biskop av Gerasa, undertegnet ved kirkemøtet i Seleukia i 359, og Epifanius skriver at hans brødre drakk fra en bekk i martyriet i Gerasa som, som andre kilder, ble sagt å bli til vin på dagen for miraklet i Kana. En katedral ble bygd på 300-tallet, den første av mange kirker i byen. Storstilte utgravninger ble utført fra 1928 av Yale-universitetet sammen med de britiske og amerikanske arkeologiske skolene, og Gerasa er nå en av de best bevarte romerske byene i Midtøsten."
  tl:
    - "Ang Gerasa, ang Jerash ngayon sa hilagang Jordan, ay nasa mga burol ng Gilead mga 35 km sa hilaga ng Amman (mga 48 km sa daan), sa isang batis na tinawag ng mga Griyego na Chrysorrhoas, “ilog na ginto”, na umaagos pababa sa Jaboc. Ang lungsod ay itinatag ng mga Griyego. Ayon sa kalaunang tradisyon sa Gerasa, si Alejandro Magno o ang kaniyang heneral na si Perdicas ang tagapagtatag nito, ngunit ang opisyal nitong pangalan, Antioquia sa Chrysorrhoas, ay tumuturo sa isang haring Seleucid, marahil noong ika-2 siglo BK. Sinasabi ni Josephus na kinuha ni Alejandro Janneo ang Gerasa sa unang bahagi ng unang siglo BK pagkatapos magtayo ng tatlong-patong na pader sa palibot nito."
    - "Pagkatapos ng pananakop ng mga Romano noong 63 BK, napasailalim ang Gerasa sa Roma at nabilang sa mga lungsod Griyego ng Decapolis; inililista ito ni Plinio bilang Galasa. Nang sumiklab ang paghihimagsik noong 66 AD, sinalanta ng mga pangkat ng Judio ang mga nayon sa paligid nito, ngunit, ayon kay Josephus, walang ginawang masama ang mga taga-Gerasa sa mga Judiong nanatili at inihatid nila hanggang sa kanilang mga hangganan ang mga ibig umalis. Matapos isanib ni Trajano ang kaharian ng mga Nabateo noong 106, ang Gerasa ay napabilang sa bagong lalawigan ng Arabia. Mula sa huling bahagi ng unang siglo at sa buong ikalawa, muli itong itinayo nang engrande, na may hugis-itlog na liwasan, lansangang may hanay ng haligi, mga templo nina Zeus at Artemis, mga dulaan at isang arko para sa pagdalaw ni Hadriano noong 129–130."
    - "Isinasalaysay nina Marcos at Lucas kung paanong tumawid si Jesus sa Dagat ng Galilea at pinagaling ang isang lalaking inaalihan ng isang lehiyon ng mga demonyo, na pumasok sa isang kawan ng mga baboy na tumakbo pababa sa matarik na dalisdis papunta sa lawa. Magkakaiba ang pangalan ng lugar sa mga manuskrito. Ang KJV at ang tekstong Sinodal ay bumabasa ng Gadareno kina Marcos at Lucas at Gergeseno kay Mateo, samantalang maraming makabagong edisyon ang bumabasa ng Geraseno kina Marcos at Lucas at Gadareno kay Mateo. Ang Gerasa ay mahigit 50 km mula sa lawa, at mas pinili na noon ni Origenes ang Gergesa, isang matandang bayan sa tabi ng lawa na may matarik na pampang sa itaas ng tubig; may kilalang nayon si Eusebio na may gayong pangalan sa mga burol sa tabi ng lawa. Idinagdag ni Marcos na ipinahayag ng gumaling sa Decapolis ang ginawa ni Jesus para sa kaniya."
    - "Pagsapit ng ika-4 na siglo, may pamayanang Kristiyano na ang lungsod. Pumirma si Exeresius, obispo ng Gerasa, sa Konseho ng Seleucia noong 359, at isinulat ni Epifanio na uminom ang kaniyang mga kapatid mula sa isang batis sa martyrium sa Gerasa na, tulad ng ibang bukal, ay sinasabing nagiging alak sa araw ng himala sa Cana. Isang katedral ang itinayo noong ika-4 na siglo, ang una sa maraming simbahan sa lungsod. Malawakang paghuhukay ang isinagawa mula 1928 ng Yale University kasama ang mga paaralang Briton at Amerikano ng arkeolohiya, at ang Gerasa ay isa na ngayon sa pinakamaayos na napanatiling lungsod Romano sa Malapit na Silangan."
  da:
    - "Gerasa, nutidens Jerash i det nordlige Jordan, ligger i Gileads bjerge omkring 35 km nord for Amman (ca. 48 km ad vej), ved en å, som grækerne kaldte Chrysorrhoas, »den gyldne flod«, der løber ned til Jabbok. Byen var en græsk grundlæggelse. Senere tradition i Gerasa nævnte Alexander den Store eller hans general Perdikkas som grundlægger, men dens officielle navn, Antiokia ved Chrysorrhoas, peger på en seleukidisk konge, sandsynligvis i 2. århundrede f.Kr. Josefus siger, at Alexander Jannæus indtog Gerasa tidligt i 1. århundrede f.Kr. efter at have bygget en tredobbelt mur omkring den."
    - "Efter den romerske erobring i 63 f.Kr. kom Gerasa under Rom og blev regnet blandt Dekapolis' græske byer; Plinius opregner den som Galasa. Da oprøret i 66 e.Kr. brød ud, hærgede jødiske bander landsbyerne omkring den, men gerasenerne gjorde, siger Josefus, ingen skade på de jøder, der blev, og fulgte dem, der ønskede at tage af sted, helt til deres grænser. Efter at Trajan annekterede det nabatæiske kongerige i 106, hørte Gerasa til den nye provins Arabien. Fra sidst i 1. århundrede og gennem 2. århundrede blev den genopbygget i stor stil, med en oval plads, en søjlebesat hovedgade, templer for Zeus og Artemis, teatre og en bue til Hadrians besøg i 129–130."
    - "Markus og Lukas fortæller, hvordan Jesus krydsede Genesaret Sø og helbredte en mand besat af en legion af dæmoner, som for ind i en svineflok, der styrtede ned ad en brat skråning i søen. Håndskrifterne nævner stedet forskelligt. King James-oversættelsen og den russiske synodaltekst har Gadarener hos Markus og Lukas og Gergesener hos Mattæus, mens mange moderne udgaver har Gerasener hos Markus og Lukas og Gadarener hos Mattæus. Gerasa ligger mere end 50 km fra søen, og allerede Origenes foretrak Gergesa, en gammel by ved søen med en stejl skrænt over vandet; Eusebios kendte en landsby af det navn på bakkerne ved søen. Markus tilføjer, at den helbredte mand forkyndte i Dekapolis, hvad Jesus havde gjort for ham."
    - "I 300-tallet havde byen et kristent samfund. Exeresius, biskop af Gerasa, underskrev ved koncilet i Seleukia i 359, og Epifanios skriver, at hans brødre drak af en kilde i martyrkirken i Gerasa, som, ligesom andre kilder, skulle forvandles til vin på dagen for miraklet i Kana. En domkirke blev bygget i 300-tallet, den første af mange kirker i byen. Omfattende udgravninger blev udført fra 1928 af Yale-universitetet sammen med de britiske og amerikanske arkæologiske skoler, og Gerasa er nu en af de bedst bevarede romerske byer i Nærorienten."
  sr:
    - "Гераса, данашњи Џераш у северном Јордану, лежи у брдима Галада око 35 км северно од Амана (око 48 км путем), на потоку који су Грци звали Хризороа, „златна река“, што тече ка Јавоку. Град је основан као грчки. Каснија предања у Гераси називала су за оснивача Александра Великог или његовог војсковођу Пердику, али његово службено име, Антиохија на Хризороји, указује на селеукидског цара, вероватно у другом веку п. н. е. Јосиф Флавије каже да је Александар Јаној заузео Герасу почетком првог века п. н. е. пошто ју је опасао троструким зидом."
    - "После римског освајања 63. п. н. е. Гераса је дошла под Рим и убрајана је међу грчке градове Декаполиса; Плиније је наводи као Галасу. Кад је 66. н. е. букнуо устанак, јеврејске чете опустошиле су села око ње, али, каже Јосиф Флавије, Герасинци нису нашкодили Јеврејима који су остали и испратили су оне који су хтели да оду до њихових граница. После Трајановог припајања Набатејског краљевства 106. Гераса је припадала новој провинцији Арабији. Од краја првог века и кроз други обновљена је у великом стилу, с овалним тргом, главном улицом са стубовима, храмовима Зевса и Артемиде, позориштима и славолуком за Хадријанову посету 129–130."
    - "Марко и Лука приповедају како је Исус прешао Галилејско море и исцелио човека опседнутог легеоном ђавола, који су ушли у крдо свиња што је навалило низ стрмину у језеро. Рукописи то место именују различито. Превод краља Џејмса и синодски текст имају Гадаринце у Марку и Луки а Гергесинце у Матеју, док многа савремена издања имају Герасинце у Марку и Луки а Гадаринце у Матеју. Гераса лежи више од 50 км од језера, и већ је Ориген више волео Гергесу, стари град на језеру са стрмом обалом изнад воде; Јевсевије је знао село тог имена на брдима поред језера. Марко додаје да је исцељени објавио у Декаполису шта је Исус учинио за њега."
    - "Већ у четвртом веку град је имао хришћанску заједницу. Екзересије, епископ Герасе, потписао је на Сабору у Селеукији 359, а Епифаније пише да су његова браћа пила из потока у мартиријуму у Гераси за који се, као и за друге изворе, говорило да се претвара у вино на дан чуда у Кани. Катедрала је подигнута у четвртом веку, прва од многих цркава у граду. Велика ископавања водио је од 1928. Универзитет Јејл са британском и америчком школом археологије, а Гераса је данас један од најбоље очуваних римских градова Блиског истока."
  hu:
    - "Gerasza, a mai Dzserás Jordánia északi részén, Gileád hegyei között fekszik, Ammántól mintegy 35 km-re északra (közúton kb. 48 km), egy patak mellett, amelyet a görögök Chrysorrhoasnak, „arany folyónak” neveztek, és amely a Jabbókba fut. A város görög alapítású volt. Gerasza későbbi hagyománya Nagy Sándort vagy tábornokát, Perdikkaszt nevezte alapítójának, de hivatalos neve, Antiókhia a Chrysorrhoason, szeleukida királyra utal, valószínűleg a Kr. e. 2. században. Josephus szerint Alexandrosz Jannaiosz a Kr. e. 1. század elején foglalta el Geraszát, miután háromszoros fallal vette körül."
    - "A Kr. e. 63-as római hódítás után Gerasza Róma fennhatósága alá került, és a Dekapolisz görög városai közé számították; Plinius Galasaként sorolja fel. Amikor Kr. u. 66-ban kitört a lázadás, zsidó bandák elpusztították a környező falvakat, a gerasziak azonban Josephus szerint nem bántották a zsidókat, akik maradtak, és határukig kísérték azokat, akik el akartak menni. Miután Traianus Kr. u. 106-ban annektálta a nabateus királyságot, Gerasza az új Arábia provinciához tartozott. Az 1. század végétől és a 2. századon át nagy léptékben építették újjá, ovális térrel, oszlopsoros főutcával, Zeusz és Artemisz templomaival, színházakkal és Hadrianus Kr. u. 129–130-as látogatására emelt diadalívvel."
    - "Márk és Lukács elbeszéli, hogyan kelt át Jézus a Galileai-tengeren, és gyógyított meg egy embert, akit ördögök légiója szállt meg, és beléptek egy disznócsordába, amely a meredek lejtőn a tóba rohant. A kéziratok különbözőképpen nevezik meg a helyet. A KJV és a szinodális szöveg Márknál és Lukácsnál gadarenusokat, Mátéban gergesenusokat olvas, míg sok modern kiadás Márknál és Lukácsnál gerazenusokat, Mátéban gadarenusokat. Gerasza több mint 50 km-re fekszik a tótól, és már Órigenész is Gergeszát részesítette előnyben, a tó melletti régi várost, amelynek meredek partja a víz fölé magasodik; Eusebius ismert egy ilyen nevű falut a tó melletti dombokon. Márk hozzáteszi, hogy a meggyógyított ember a Dekapoliszban hirdette, mit tett vele Jézus."
    - "A 4. századra a városnak keresztény közössége volt. Exeresziosz, Gerasza püspöke aláírt a 359-es szeleukiai zsinaton, Epiphaniosz pedig azt írja, hogy testvérei ittak egy patakból a gerasai martyriumban, amelyről – mint más forrásokról – azt mondták, hogy a kánai csoda napján borrá változik. A 4. században székesegyházat építettek, a város sok temploma közül az elsőt. Nagyszabású ásatásokat 1928-tól a Yale Egyetem végzett a brit és az amerikai régészeti iskolával, és Gerasza ma a Közel-Kelet egyik legjobban megőrzött római városa."
  fi:
    - "Gerasa, nykyinen Jerash Pohjois-Jordaniassa, sijaitsee Gileadin kukkuloilla noin 35 km Ammanista pohjoiseen (noin 48 km tietä pitkin) purolla, jota kreikkalaiset kutsuivat nimellä Chrysorrhoas, ”kultainen joki”, ja joka laskee Jabbokiin. Kaupunki oli kreikkalainen perustus. Myöhempi perinne Gerasassa piti perustajana Aleksandros Suurta tai hänen kenraaliaan Perdikkasta, mutta sen virallinen nimi, Antiokia Chrysorrhoas-joen varrella, viittaa seleukidikuninkaaseen, luultavasti 100-luvulla eaa. Josephuksen mukaan Aleksandros Jannaios valtasi Gerasan 1. vuosisadan eaa. alussa rakennettuaan sen ympärille kolminkertaisen muurin."
    - "Rooman valloituksen jälkeen vuonna 63 eaa. Gerasa joutui Rooman alaisuuteen ja luettiin Dekapoliksen kreikkalaisiin kaupunkeihin; Plinius luettelee sen nimellä Galasa. Kun kapina puhkesi vuonna 66 jaa., juutalaiset joukot hävittivät sen ympärillä olevat kylät, mutta Josephuksen mukaan gerasalaiset eivät vahingoittaneet juutalaisia, jotka jäivät, ja saattoivat ne, jotka halusivat lähteä, rajoilleen asti. Kun Trajanus liitti nabatealaisen kuningaskunnan vuonna 106, Gerasa kuului uuteen Arabian provinssiin. 1. vuosisadan lopulta ja koko 100-luvun ajan se rakennettiin uudelleen suurella mittakaavalla soikeine aukioineen, pylväskatuineen, Zeuksen ja Artemiin temppeleineen, teattereineen ja Hadrianuksen vuosien 129–130 vierailua varten pystytettyine kaarineen."
    - "Markus ja Luukas kertovat, kuinka Jeesus ylitti Galileanjärven ja paransi miehen, jota riivasi legioona riivaajia, jotka menivät sikalaumaan, ja se syöksyi jyrkännettä alas järveen. Käsikirjoitukset nimeävät paikan eri tavoin. King James -käännös ja synodaaliteksti lukevat Markuksella ja Luukkaalla gadaralaiset ja Matteuksella gergesalaiset, kun taas monet nykyiset editiot lukevat Markuksella ja Luukkaalla gerasalaiset ja Matteuksella gadaralaiset. Gerasa on yli 50 km:n päässä järvestä, ja jo Origenes piti parempana Gergesaa, järven rannalla olevaa vanhaa kaupunkia, jonka vesirajan yläpuolella on jyrkkä äyräs; Eusebios tunsi samannimisen kylän järven rannan kukkuloilla. Markus lisää, että parannettu mies julisti Dekapoliksessa, mitä Jeesus oli tehnyt hänelle."
    - "300-luvulla kaupungissa oli kristillinen yhteisö. Gerasan piispa Exeresius allekirjoitti Seleukian kirkolliskokouksen asiakirjat vuonna 359, ja Epifanios kirjoittaa, että hänen veljensä joivat Gerasan marttyyrikirkon purosta, jonka, kuten muidenkin lähteiden, kerrottiin muuttuvan viiniksi Kaanan ihmeen päivänä. Katedraali rakennettiin 300-luvulla, ensimmäisenä kaupungin monista kirkoista. Laajamittaisia kaivauksia tehtiin vuodesta 1928 Yalen yliopiston johdolla brittiläisten ja amerikkalaisten arkeologiakoulujen kanssa, ja Gerasa on nyt yksi Lähi-idän parhaiten säilyneistä roomalaisista kaupungeista."
  vi:
    - "Giê-ra-sê, nay là Jerash ở bắc Jordan, nằm trong các đồi Ga-la-át cách Amman khoảng 35 km về phía bắc (khoảng 48 km theo đường bộ), bên một dòng suối mà người Hy Lạp gọi là Chrysorrhoas, “sông Vàng”, chảy xuống sông Gia-bốc. Thành là một nền lập của Hy Lạp. Truyền thống về sau ở Giê-ra-sê nêu A-léc-xan-đơ Đại đế hoặc tướng Perdiccas của ông là người sáng lập, nhưng tên chính thức của thành, An-ti-ốt trên sông Chrysorrhoas, chỉ về một vua Seleucid, có lẽ vào thế kỷ 2 TCN. Josephus nói rằng Alexander Jannaeus chiếm Giê-ra-sê vào đầu thế kỷ 1 TCN sau khi xây ba lớp tường quanh thành."
    - "Sau cuộc chinh phục của La Mã năm 63 TCN, Giê-ra-sê thuộc về Rô-ma và được kể trong các thành Hy Lạp của Đê-ca-bô-lơ; Pliny ghi thành là Galasa. Khi cuộc nổi dậy năm 66 bùng nổ, các toán Do Thái tàn phá những làng quanh thành, nhưng theo Josephus, người Giê-ra-sê không làm hại những người Do Thái ở lại và hộ tống những người muốn đi đến tận biên giới của họ. Sau khi Trajan sáp nhập vương quốc Nabataea năm 106, Giê-ra-sê thuộc tỉnh mới A-ra-bi. Từ cuối thế kỷ 1 và suốt thế kỷ 2, thành được xây lại trên quy mô lớn, với quảng trường hình bầu dục, phố chính có hàng cột, các đền thờ Zeus và Artemis, các nhà hát và một khải hoàn môn cho chuyến thăm của Hadrian năm 129–130."
    - "Mác và Lu-ca kể rằng Giê-su vượt Biển Ga-li-lê và chữa lành một người bị cả đạo quân quỷ ám, chúng nhập vào bầy heo rồi chạy xuống một dốc đứng vào hồ. Các bản thảo ghi tên nơi này khác nhau. Bản KJV và bản Synodal đọc là người Ga-đa-ra trong Mác và Lu-ca và người Ghê-ghê-sa trong Ma-thi-ơ, trong khi nhiều bản hiện đại đọc là người Giê-ra-sê trong Mác và Lu-ca và người Ga-đa-ra trong Ma-thi-ơ. Giê-ra-sê cách hồ hơn 50 km, và Origen đã ưa Ghê-ghê-sa, một thành cổ bên hồ với bờ dốc đứng trên mặt nước; Eusebius biết một làng tên ấy trên các đồi cạnh hồ. Mác thêm rằng người được chữa lành đã rao truyền trong Đê-ca-bô-lơ những điều Giê-su đã làm cho mình."
    - "Đến thế kỷ 4 thành đã có một cộng đồng Cơ Đốc. Exeresius, giám mục Giê-ra-sê, ký tại Công đồng Sê-lơ-xi năm 359, và Epiphanius viết rằng anh em của ông uống nước từ một dòng suối trong martyrium ở Giê-ra-sê, là dòng suối mà, cũng như các suối khác, được cho là hóa thành rượu vào ngày có phép lạ ở Ca-na. Một nhà thờ chính tòa được xây vào thế kỷ 4, đầu tiên trong nhiều nhà thờ của thành. Các cuộc khai quật quy mô lớn được tiến hành từ năm 1928 bởi Đại học Yale cùng các trường khảo cổ Anh và Mỹ, và Giê-ra-sê nay là một trong những thành La Mã được bảo tồn tốt nhất ở Cận Đông."
  ro:
    - "Gherasa, azi Jerash, în nordul Iordaniei, se află în dealurile Galaadului, la circa 35 km spre nord de Amman (aproximativ 48 km pe drum), pe un pârâu pe care grecii îl numeau Chrysorrhoas, „râul de aur”, care curge spre Iaboc. Orașul a fost o întemeiere greacă. Tradiția de mai târziu din Gherasa îl numea întemeietor pe Alexandru cel Mare sau pe generalul său Perdiccas, dar numele ei oficial, Antiohia de pe Chrysorrhoas, trimite la un rege seleucid, probabil din secolul al II-lea î.Hr. Iosif Flaviu spune că Alexandru Ianeu a luat Gherasa la începutul secolului I î.Hr., după ce o înconjurase cu un triplu zid."
    - "După cucerirea romană din 63 î.Hr., Gherasa a ajuns sub Roma și a fost numărată printre orașele grecești ale Decapolei; Pliniu o menționează ca Galasa. Când a izbucnit răscoala din 66 d.Hr., bandele iudaice au pustiit satele din jur, dar, spune Iosif Flaviu, gherasenii nu au făcut niciun rău iudeilor rămași și i-au însoțit până la hotarele lor pe cei care voiau să plece. După ce Traian a anexat în 106 regatul nabateean, Gherasa a aparținut noii provincii Arabia. De la sfârșitul secolului I și pe tot parcursul secolului al II-lea a fost reconstruită la scară mare, cu o piață ovală, o stradă principală cu coloane, temple ale lui Zeus și Artemis, teatre și un arc pentru vizita lui Hadrian din 129–130."
    - "Marcu și Luca povestesc cum Isus a trecut Marea Galileii și a vindecat un om stăpânit de o legiune de demoni, care au intrat într-o turmă de porci ce s-a năpustit pe o pantă abruptă în lac. Manuscrisele numesc locul în feluri diferite. Versiunea King James și textul sinodal citesc Gadareni la Marcu și Luca și Gergheseni la Matei, în timp ce multe ediții moderne citesc Gerasseni la Marcu și Luca și Gadareni la Matei. Gherasa se află la peste 50 km de lac, și Origen prefera deja Gherghesa, un oraș vechi de lângă lac, cu mal abrupt deasupra apei; Eusebiu cunoștea un sat cu acest nume pe dealurile de lângă lac. Marcu adaugă că omul vindecat a vestit în Decapole ce făcuse Isus pentru el."
    - "În secolul al IV-lea, orașul avea deja o comunitate creștină. Exeresiu, episcopul Gherasei, a semnat la Conciliul de la Seleucia din 359, iar Epifanie scrie că frații săi beau dintr-un izvor din martyrium-ul din Gherasa care, ca și alte izvoare, se zicea că se preface în vin în ziua minunii de la Cana. O catedrală a fost construită în secolul al IV-lea, prima dintre multele biserici ale orașului. Săpături de mare amploare au fost efectuate din 1928 de Universitatea Yale, împreună cu școlile britanică și americană de arheologie, iar Gherasa este acum unul dintre cele mai bine păstrate orașe romane din Orientul Apropiat."
  bg:
    - "Гераса, днешният Джераш в Северна Йордания, лежи в хълмовете на Галаад на около 35 км северно от Аман (около 48 км по шосе), на поток, който гърците наричаха Хрисороас, „златна река“, спускащ се към Явок. Градът е гръцко основаване. По-късното предание в Гераса сочеше като основател Александър Велики или неговия пълководец Пердика, но официалното му име, Антиохия на Хрисороас, сочи селевкидски цар, вероятно през II в. пр.н.е. Йосиф Флавий казва, че Александър Яней превзел Гераса в началото на I в. пр.н.е., след като издигнал около нея тройна стена."
    - "След римското завоевание от 63 г. пр.н.е. Гераса попадна под властта на Рим и беше причислена към гръцките градове на Декаполис; Плиний я изброява като Галаса. Когато избухна въстанието от 66 г. н.е., юдейски отряди опустошиха селата около нея, но, казва Йосиф Флавий, герасинците не сториха зло на останалите юдеи и придружиха желаещите да си отидат до границите си. След като Траян анексира Набатейското царство през 106 г., Гераса принадлежеше към новата провинция Арабия. От края на I и през II в. тя беше преустроена с размах: с овален площад, главна улица с колонади, храмове на Зевс и Артемида, театри и арка за посещението на Адриан през 129–130 г."
    - "Марко и Лука разказват как Исус премина Галилейското езеро и изцели човек, обладан от легион бесове, които влязоха в стадо свине, а то се устреми по стръмнината в езерото. Ръкописите назовават мястото различно. KJV и Синодалният превод четат „гадаринци“ при Марко и Лука и „гергесинци“ при Матей, докато много съвременни издания четат „герасинци“ при Марко и Лука и „гадаринци“ при Матей. Гераса лежи на повече от 50 км от езерото и още Ориген предпочиташе Гергеса — стар град край езерото със стръмен бряг над водата; Евсевий познаваше село с това име по хълмовете край езерото. Марко добавя, че изцеленият проповядваше в Декаполис какво беше сторил Исус за него."
    - "Към IV в. градът имаше християнска общност. Ексересий, епископ на Гераса, подписа на Селевкийския събор през 359 г., а Епифаний пише, че събратята му пили от поток в мартириума в Гераса, който, подобно на други извори, се смятало, че се превръща във вино в деня на чудото в Кана. През IV в. беше построена катедрала — първата от многото църкви в града. Мащабни разкопки бяха проведени от 1928 г. от Йейлския университет с Британската и Американската школа по археология, и днес Гераса е един от най-добре запазените римски градове в Близкия изток."
scripture:
  - Mark.5.1-Mark.5.20
  - Luke.8.26-Luke.8.39
  - Matt.8.28-Matt.8.34
sources:
  - "Josephus, Jewish War 1.104 (Alexander Jannaeus takes Gerasa); 2.458, 2.480 (the revolt of AD 66)"
  - "Pliny the Elder, Natural History 5.74 (Galasa among the cities of the Decapolis)"
  - "Cassius Dio, Roman History 68.14.5 (annexation of Arabia under Trajan)"
