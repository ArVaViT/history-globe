body:
  en:
    - "Zobah, or Aram-zobah, was an Aramaean kingdom north of Damascus, in the Beqaa valley of Lebanon and the country beyond it towards Hamath and the Euphrates; its capital has not been found, and its exact bounds are unknown. The record here is placed in the Beqaa. In the eighth and seventh centuries BC Assyrian lists and letters name a province Subutu, or Subat, in the same region, which keeps the name. The Bible speaks of “kings of Zobah” in Saul's day and of one king, Hadadezer son of Rehob, in David's; the cities of Hadadezer from which David carried off much bronze, Tibhath and Chun, or Betah and Berothai, probably lay in the northern Beqaa."
    - "Saul fought the kings of Zobah among his neighbours. David met Hadadezer when the king of Zobah “went to recover his border at the river Euphrates”: he took his chariots, horsemen and twenty thousand footmen, hamstrung the chariot horses, and when “the Syrians of Damascus came to succour Hadadezer king of Zobah” defeated them too and put garrisons in Damascus. Toi, king of Hamath, who had been at war with Hadadezer, sent his son with gifts of silver, gold and bronze. Later the Ammonites hired “the Syrians of Beth-rehob, and the Syrians of Zoba” against David; Joab beat them before Rabbah, and Hadadezer brought the Aramaeans from beyond the Euphrates to Helam, where David routed them, so that all the kings who had served Hadadezer made peace with Israel. Chronicles tells the same wars, and the title of Psalm 60 remembers the one with Aram-zobah."
    - "One of David's mighty men was “Igal the son of Nathan of Zobah”. Rezon son of Eliadah, who “fled from his lord Hadadezer king of Zobah”, gathered a band, seized Damascus and troubled Solomon all his days: the rise of Damascus marks the end of Zobah's leadership among the Aramaeans. The kingdom is not mentioned again, and the Assyrian province that kept its name lay between Damascus and Hamath. Today the Beqaa is the farmland of eastern Lebanon between the Lebanon and Anti-Lebanon ranges, with Baalbek, the ancient Heliopolis, in its north."
  ru:
    - "Сува, или Арам-Цова, была арамейским царством к северу от Дамаска, в долине Бекаа в Ливане и в землях за ней в сторону Емафа и Евфрата; её столица не найдена, а точные границы неизвестны. Запись здесь помещена в Бекаа. В VIII–VII веках до н. э. ассирийские списки и письма называют в тех же краях провинцию Субуту, или Субат, сохранившую это имя. Библия говорит о войне Саула «с царями Совы» и об одном царе, Адраазаре, сыне Рехова, во дни Давида; города Адраазара, из которых Давид вывез много меди, Тивхава и Кун, во Второй книге Царств — Беф и Бероф, лежали, вероятно, на севере Бекаа."
    - "Саул воевал с царями Сувы среди прочих соседей. Давид столкнулся с Адраазаром, когда царь Сувский «шел, чтоб восстановить свое владычество при реке Евфрате»: он взял его колесницы, всадников и двадцать тысяч пеших, подрезал жилы колесничным коням, а когда «пришли Сирийцы Дамасские на помощь к Адраазару, царю Сувскому», разбил и их и поставил охранные войска в Дамаске. Фой, царь Емафа, воевавший с Адраазаром, прислал своего сына с дарами из серебра, золота и меди. Позже Аммонитяне наняли против Давида «Сирийцев из Беф-Рехова и Сирийцев Сувы»; Иоав разбил их под Раввой, а Адраазар привёл арамеев из-за Евфрата к Еламу, где Давид разгромил их, так что все цари, покорные Адраазару, заключили мир с Израилем. Книги Паралипоменон рассказывают о тех же войнах, а надписание 59-го псалма вспоминает войну с «Сириею Цованскою»."
    - "Среди храбрых Давида был «Игал, сын Нафана, из Цобы». Разон, сын Елиады, «который убежал от государя своего Адраазара, царя Сувского», собрал отряд, захватил Дамаск и вредил Соломону во все его дни: возвышение Дамаска означает конец первенства Сувы среди арамеев. Больше царство не упоминается, а ассирийская провинция, сохранившая его имя, лежала между Дамаском и Емафом. Сегодня Бекаа — земледельческая долина восточного Ливана между хребтами Ливан и Антиливан, с Баальбеком, древним Гелиополем, на севере."
  uk:
    - "Сува, або Арам-Сува, була арамейським царством на північ від Дамаска, у долині Бекаа в Лівані та краї за нею до Хамата й Євфрату; її столицю не знайдено, а точні межі невідомі. Запис тут розміщено в Бекаа. У VIII–VII ст. до н. е. ассірійські переліки й листи називають провінцію Субуту, або Субат, у тому самому краї, що зберігає назву. Біблія говорить про «царів Суви» за Саула і про одного царя, Адраазара, сина Рехова, за Давида; міста Адраазара, з яких Давид забрав багато бронзи, Тівхава і Кун, або Бета й Берот, ймовірно, лежали в північній Бекаа."
    - "Саул воював з царями Суви серед своїх сусідів. Давид переміг Адраазара, царя Суви, «як він саме був у дорозї до Евфрата, щоб там відновити своє панованнє»: узяв його колісниці, вершників і двадцять тисяч піхоти, покалічив коней від возів, і коли «прийшли Сирийцї Дамаські на підмогу цареві Собському Адаразерові», переміг і їх та поставив гарнізони в Дамаску. Фой, цар Хамата, що воював з Адраазаром, послав свого сина з дарами срібла, золота й бронзи. Пізніше аммонітяни найняли проти Давида «Сирийцїв Бет-Рехобських і Сирийцїв Собських»; Йоав розбив їх перед Раввою, а Адраазар привів арамеїв із-за Євфрату до Елама, де Давид розбив їх, так що всі царі, які служили Адраазару, уклали мир з Ізраїлем. Хроніки розповідають ті самі війни, а напис Псалма 60 пам’ятає війну з Арам-Сувою."
    - "Один із лицарів Давида був «Ігал Натаненко з Зоби». Разон, син Еліади, що «втїк був від свого пана Адраазара, царя Собського», зібрав ватагу, захопив Дамаск і турбував Соломона всі його дні: піднесення Дамаска знаменує кінець провідництва Суви серед арамеїв. Царство більше не згадується, а ассірійська провінція, що зберегла його ім’я, лежала між Дамаском і Хаматом. Нині Бекаа — рілля східного Лівану між хребтами Лівану й Антиліван, з Баальбеком, давнім Геліополем, на півночі."
  es:
    - "Soba, o Aram-soba, era un reino arameo al norte de Damasco, en el valle de la Beqaa, en el Líbano, y en el país más allá hacia Hamat y el Éufrates; su capital no se ha hallado, y sus límites exactos se desconocen. El registro de aquí se sitúa en la Beqaa. En los siglos VIII y VII a. C. listas y cartas asirias nombran una provincia Subutu, o Subat, en la misma región, que conserva el nombre. La Biblia habla de «los reyes de Soba» en tiempos de Saúl y de un rey, Hadad-ezer hijo de Rehob, en los de David; las ciudades de Hadad-ezer de las que David se llevó mucho bronce, Tibhat y Chun, o Beta y Berotai, probablemente estaban en el norte de la Beqaa."
    - "Saúl combatió a los reyes de Soba entre sus vecinos. David se enfrentó a Hadad-ezer cuando el rey de Soba iba «á extender su término hasta el río de Eufrates»: le tomó carros, jinetes y veinte mil hombres de a pie, desjarretó los caballos de los carros, y cuando «vinieron los Siros de Damasco á dar ayuda á Hadad-ezer rey de Soba» los derrotó también y puso guarniciones en Damasco. Toi, rey de Hamat, que estaba en guerra con Hadad-ezer, envió a su hijo con regalos de plata, oro y bronce. Más tarde los amonitas contrataron contra David a «los Siros de la casa de Rehob, y á los Siros de Soba»; Joab los venció ante Rabá, y Hadad-ezer trajo a los arameos de más allá del Éufrates a Helam, donde David los derrotó; todos los reyes que habían servido a Hadad-ezer hicieron la paz con Israel. Crónicas cuenta las mismas guerras, y el título del Salmo 60 recuerda la de Aram-soba."
    - "Uno de los valientes de David era «Igheal hijo de Nathán de Soba». Rezón hijo de Eliada, que «había huído de su amo Adad-ezer, rey de Soba», juntó una banda, se apoderó de Damasco y molestó a Salomón todos sus días: el ascenso de Damasco marca el fin del liderazgo de Soba entre los arameos. El reino no se menciona de nuevo, y la provincia asiria que conservó su nombre estaba entre Damasco y Hamat. Hoy la Beqaa es la tierra de cultivo del este del Líbano entre las cordilleras del Líbano y del Antilíbano, con Baalbek, la antigua Heliópolis, en su norte."
  pt:
    - "Zobá, ou Arã-Zobá, era um reino arameu ao norte de Damasco, no vale de Beqaa, no Líbano, e na região além dele rumo a Hamate e ao Eufrates; sua capital não foi achada, e seus limites exatos são desconhecidos. O registro aqui está situado na Beqaa. Nos séculos VIII e VII a.C., listas e cartas assírias nomeiam uma província Subutu, ou Subat, na mesma região, que conserva o nome. A Bíblia fala de “reis de Zobá” nos dias de Saul e de um só rei, Hadadezer, filho de Reobe, nos de Davi; as cidades de Hadadezer de onde Davi levou muito bronze, Tibate e Cum, ou Betá e Berotai, provavelmente ficavam no norte da Beqaa."
    - "Saul combateu os reis de Zobá entre seus vizinhos. Davi enfrentou Hadadezer quando o rei de Zobá “foi estabelecer o seu domínio junto ao rio Eufrates”: tomou seus carros, cavaleiros e vinte mil homens a pé, cortou os tendões dos cavalos dos carros e, quando “os sírios de Damasco vieram para ajudar Hadadezer, rei de Zobá”, derrotou-os também e pôs guarnições em Damasco. Toí, rei de Hamate, que estivera em guerra com Hadadezer, enviou seu filho com presentes de prata, ouro e bronze. Depois os amonitas contrataram contra Davi “os sírios de Bete-Reobe e os sírios de Zobá”; Joabe os venceu diante de Rabá, e Hadadezer trouxe os arameus de além do Eufrates a Helã, onde Davi os pôs em fuga, de modo que todos os reis que serviam a Hadadezer fizeram paz com Israel. Crônicas conta as mesmas guerras, e o título do Salmo 60 recorda a que houve com Arã-Zobá."
    - "Um dos valentes de Davi era “Igal, filho de Natã, de Zobá”. Rezom, filho de Eliada, que “havia fugido de seu senhor, Hadadezer, rei de Zobá”, reuniu um bando, tomou Damasco e perturbou Salomão todos os seus dias: a ascensão de Damasco marca o fim da liderança de Zobá entre os arameus. O reino não é mencionado de novo, e a província assíria que conservou o nome ficava entre Damasco e Hamate. Hoje a Beqaa é a terra agrícola do leste do Líbano entre as cadeias do Líbano e do Antilíbano, com Baalbek, a antiga Heliópolis, ao norte."
  de:
    - "Zoba oder Aram-Zoba war ein aramäisches Königreich nördlich von Damaskus, in der Beqaa-Ebene des Libanon und dem Land dahinter gegen Hamat und den Euphrat; seine Hauptstadt wurde nicht gefunden, und seine genauen Grenzen sind unbekannt. Der Eintrag ist hier in der Beqaa angesetzt. Im achten und siebten Jahrhundert v. Chr. nennen assyrische Listen und Briefe in derselben Region eine Provinz Subutu oder Subat, die den Namen bewahrt. Die Bibel spricht zu Sauls Zeit von „den Königen Zobas“ und zu Davids Zeit von einem König, Hadadeser, Sohn Rehobs; die Städte Hadadesers, aus denen David viel Bronze fortführte, Tibhat und Chun oder Betah und Berotai, lagen wohl in der nördlichen Beqaa."
    - "Saul kämpfte unter seinen Nachbarn gegen die Könige Zobas. David traf Hadadeser, als der König von Zoba „hinzog, seine Macht wieder zu holen an dem Wasser Euphrat“: Er nahm seine Wagen, Reiter und zwanzigtausend Mann Fußvolk, lähmte die Wagenpferde, und als „die Syrer von Damaskus, zu helfen Hadadeser, dem König zu Zoba“ kamen, schlug er auch sie und legte Besatzungen nach Damaskus. Toi von Hamat, Hadadesers Kriegsgegner, sandte seinen Sohn mit Geschenken aus Silber, Gold und Bronze. Später dingten Ammoniter gegen David „die Syrer des Hauses Rehob und die Syrer zu Zoba“; Joab schlug sie vor Rabba, und Hadadeser brachte die Aramäer vom anderen Euphratufer nach Helam, wo David sie schlug, sodass alle Könige, die Hadadeser gedient hatten, mit Israel Frieden schlossen. Die Chronik erzählt dieselben Kriege, und die Überschrift von Psalm 60 erinnert an den mit Aram-Zoba."
    - "Einer von Davids Helden war „Jigeal, der Sohn Nathans, von Zoba“. Reson, Sohn Eljadas, der „von seinem Herrn, Hadadeser, dem König zu Zoba, geflohen war“, sammelte eine Schar, nahm Damaskus und setzte Salomo sein Leben lang zu: Der Aufstieg von Damaskus markiert das Ende der Führungsrolle Zobas unter den Aramäern. Das Königreich wird nicht wieder erwähnt, und die assyrische Provinz, die seinen Namen bewahrte, lag zwischen Damaskus und Hamat. Heute ist die Beqaa das Ackerland des östlichen Libanon zwischen den Gebirgen Libanon und Antilibanon, mit Baalbek, dem antiken Heliopolis, in ihrem Norden."
  fr:
    - "Tsoba, ou Aram-Tsoba, était un royaume araméen au nord de Damas, dans la vallée de la Beqaa, au Liban, et le pays au-delà vers Hamath et l’Euphrate ; sa capitale n’a pas été trouvée, et ses limites exactes sont inconnues. La carte la place dans la Beqaa. Aux VIIIe et VIIe siècles av. J.-C., des listes et des lettres assyriennes nomment une province Subutu, ou Subat, dans la même région, qui en garde le nom. La Bible parle de « rois de Tsoba » du temps de Saül et d’un seul roi, Hadadézer fils de Rehob, du temps de David ; les villes d’Hadadézer d’où David emporta beaucoup de bronze, Thibchath et Cun, ou Béthach et Bérothaï, se trouvaient probablement dans la Beqaa nord."
    - "Saül combattit les rois de Tsoba, entre autres voisins. David rencontra Hadadézer quand le roi de Tsoba « alla rétablir sa domination sur le fleuve de l’Euphrate » : il lui prit chars, cavaliers et vingt mille fantassins, coupa les jarrets des chevaux de trait, et quand « les Syriens de Damas vinrent au secours d’Hadadézer, roi de Tsoba », les battit aussi et mit des garnisons à Damas. Thoï, roi de Hamath, en guerre avec Hadadézer, envoya son fils offrir argent, or et airain. Plus tard, les Ammonites engagèrent contre David « les Syriens de Beth-Rehob et … les Syriens de Tsoba » ; Joab les battit à Rabba, et Hadadézer fit venir les Araméens d’au-delà de l’Euphrate à Hélam, où David les mit en déroute, et tous les rois sujets d’Hadadézer firent la paix avec Israël. Les Chroniques racontent les mêmes guerres, le titre du psaume 60 celle d’Aram-Tsoba."
    - "L’un des vaillants de David était « Jigueal, fils de Nathan, de Tsoba ». Rezon fils d’Éliada, qui « s’était enfui de chez son maître Hadadézer, roi de Tsoba », rassembla une bande, s’empara de Damas et tourmenta Salomon toute sa vie : l’essor de Damas marque la fin de la primauté de Tsoba chez les Araméens. Le royaume n’est plus mentionné ensuite, et la province assyrienne qui garda son nom se trouvait entre Damas et Hamath. La Beqaa est aujourd’hui la terre agricole de l’est du Liban entre le Liban et l’Anti-Liban, avec Baalbek, l’ancienne Héliopolis, dans son nord."
  pl:
    - "Soba, czyli Aram-Soba, było aramejskim królestwem na północ od Damaszku, w dolinie Bekaa w Libanie i w kraju za nią ku Chamat i Eufratowi; jego stolicy nie odnaleziono, a dokładne granice są nieznane. Zapis tu umieszcza je w Bekaa. W VIII i VII wieku p.n.e. asyryjskie spisy i listy nazywają w tym samym regionie prowincję Subutu, czyli Subat, która zachowuje nazwę. Biblia mówi o walce Saula „przeciw królom Soba” i o jednym królu, Hadadezerze, synu Rechoba, w dniach Dawida; miasta Hadadezera, z których Dawid zabrał wiele brązu, Tibchat i Chun, albo Betach i Berotaj, leżały prawdopodobnie w północnej Bekaa."
    - "Saul walczył z królami Soby wśród swoich sąsiadów. Dawid starł się z Hadadezerem, gdy król Soby „wyjechał, aby rozprzestrzenił granice swe nad rzeką Eufrates”: zabrał jego wozy, jeźdźców i dwadzieścia tysięcy pieszych, poderznął żyły koniom wozowym, a gdy „Przyciągnął tedy Syryjczyk z Damaszku na pomoc Hadadezerowi, królowi Soby”, pokonał i ich, i osadził załogi w Damaszku. Toi, król Chamat, który walczył z Hadadezerem, posłał swego syna z darami ze srebra, złota i brązu. Później Ammonici najęli przeciw Dawidowi, jak czytamy, „Syryjczyka z domu Rechob, i Syryjczyka w Soba”; Joab pobił ich pod Rabbą, a Hadadezer sprowadził Aramejczyków zza Eufratu do Chelam, gdzie Dawid ich rozgromił, tak że wszyscy królowie, którzy służyli Hadadezerowi, zawarli pokój z Izraelem. Księgi Kronik opowiadają te same wojny, a tytuł Psalmu 60 pamięta tę z Aram-Soba."
    - "Jednym z dzielnych mężów Dawida był „Igal, syn Natana z Soby”. Rezon, syn Eliady, o którym czytamy, że „był uciekł od Adarezera, króla Soby, Pana swego”, zebrał oddział, zajął Damaszek i niepokoił Salomona przez wszystkie jego dni: powstanie Damaszku oznacza koniec przywództwa Soby wśród Aramejczyków. Królestwo nie jest wymienione ponownie, a prowincja asyryjska, która zachowała jego nazwę, leżała między Damaszkiem a Chamat. Dziś Bekaa to ziemia uprawna wschodniego Libanu między pasmami Libanu i Antylibanu, z Baalbekiem, starożytnym Heliopolis, na północy."
  it:
    - "Zoba, o Aram-Zoba, era un regno aramaico a nord di Damasco, nella valle della Beqa in Libano e nel paese oltre di essa verso Camat e l’Eufrate; la sua capitale non è stata trovata, e i suoi confini esatti sono ignoti. La mappa la pone nella Beqa. Nell’VIII e VII secolo a.C. elenchi e lettere assire nominano una provincia Subutu, o Subat, nella stessa regione, che ne conserva il nome. La Bibbia parla di «re di Tsoba» ai giorni di Saul e di un solo re, Adadezer figlio di Recob, ai giorni di Davide; le città di Adadezer da cui Davide portò via molto bronzo, Tibcat e Cun, o Betach e Berotai, giacevano probabilmente nella Beqa settentrionale."
    - "Saul combatté i re di Zoba fra i suoi vicini. Davide incontrò Adadezer quando il re di Zoba «andava a ristabilire il suo dominio sul fiume Eufrate»: gli prese carri, cavalieri e ventimila pedoni, tagliò i garretti ai cavalli da tiro, e quando «i Siri di Damasco vennero per soccorrere Hadadezer, re di Tsoba» sconfisse anche loro e pose guarnigioni a Damasco. Toi, re di Camat, che era stato in guerra con Adadezer, mandò suo figlio con doni d’argento, oro e bronzo. In seguito gli Ammoniti presero al loro soldo «dei Siri di Beth-Rehob e dei Siri di Tsoba» contro Davide; Ioab li batté davanti a Rabba, e Adadezer fece venire gli Aramei da oltre l’Eufrate a Chelam, dove Davide li sbaragliò, così che tutti i re che avevano servito Adadezer fecero pace con Israele. Le Cronache raccontano le stesse guerre, e il titolo del Salmo 60 ricorda quella con Aram-Zoba."
    - "Uno dei prodi di Davide era «Igal, figliuolo di Nathan, da Tsoba». Rezon figlio di Eliada, «ch’era fuggito dal suo signore Hadadezer, re di Tsoba», radunò una banda, si impadronì di Damasco e tormentò Salomone per tutti i suoi giorni: l’ascesa di Damasco segna la fine del primato di Zoba fra gli Aramei. Il regno non è più menzionato, e la provincia assira che ne conservò il nome stava fra Damasco e Camat. Oggi la Beqa è la terra agricola del Libano orientale fra le catene del Libano e dell’Antilibano, con Baalbek, l’antica Eliopoli, a nord."
  nl:
    - "Soba, of Aram-Soba, was een Arameeërs koninkrijk ten noorden van Damascus, in de Beqaa-vallei van Libanon en het land erachter richting Hamat en de Eufraat; de hoofdstad is niet gevonden, en de precieze grenzen zijn onbekend. Het punt op de kaart ligt in de Beqaa. In de achtste en zevende eeuw v.Chr. noemen Assyrische lijsten en brieven in dezelfde streek een provincie Subutu, of Subat, die de naam bewaart. De Bijbel spreekt van “de koningen van Zoba” in de dagen van Saul en van één koning, Hadadezer, de zoon van Rechob, in die van David; de steden van Hadadezer waaruit David veel brons wegvoerde, Tibchat en Chun, of Betach en Berotai, lagen waarschijnlijk in de noordelijke Beqaa."
    - "Saul streed tegen “de koningen van Zoba” onder zijn buren. David trof Hadadezer toen die “heen toog, om zijn hand te wenden naar de rivier Frath”: hij nam hem zijn wagens, ruiters en twintigduizend man te voet af, ontzenuwde de wagenpaarden, en toen “De Syriers van Damaskus kwamen om Hadad-ezer, den koning van Zoba, te helpen” versloeg hij ook hen en legde bezettingen in Damascus. Toï, koning van Hamat, in oorlog met Hadadezer, zond zijn zoon met geschenken van zilver, goud en brons. Later huurden de Ammonieten “van de Syriers van Beth-Rechob, en van de Syriers van Zoba” tegen David; Joab versloeg hen voor Rabba, en Hadadezer haalde de Arameeërs van over de Eufraat naar Chelam, waar David hen versloeg, zodat alle koningen van Hadadezer vrede sloten met Israël. Kronieken vertelt dezelfde oorlogen, en het opschrift van Psalm 60 noemt die met Aram-Soba."
    - "Een van Davids helden was “Jig-al, de zoon van Nathan, van Zoba”. Rezon, de zoon van Eljada, die “gevloden was van zijn heer Hadad-ezer, den koning van Zoba”, verzamelde een bende, greep Damascus en kwelde Salomo al zijn dagen: de opkomst van Damascus markeert het einde van Soba’s leidende positie onder de Arameeërs. Het koninkrijk wordt verder niet meer genoemd, en de Assyrische provincie die de naam behield, lag tussen Damascus en Hamat. Tegenwoordig is de Beqaa het landbouwgebied van Oost-Libanon tussen de gebergten Libanon en Anti-Libanon, met in het noorden Baalbek, het antieke Heliopolis."
  cs:
    - "Sóba, neboli Aram-sóba, bylo aramejské království severně od Damašku, v údolí Bikáa v Libanonu a v zemi za ním směrem k Chamatu a Eufratu; jeho hlavní město nebylo nalezeno a jeho přesné hranice nejsou známy. Záznam zde je umístěn do Bikáy. V 8. a 7. stol. př. n. l. jmenují asyrské seznamy a listy provincii Subutu, neboli Subat, ve stejné oblasti, která si zachovává jméno. Bible mluví o Saulově válce „s králi Soba“ a o jediném králi, Hadadezerovi, synu Rechobovu, za Davidových dnů; města Hadadezerova, z nichž David odvezl mnoho bronzu, Tibchat a Chun, neboli Betach a Berotaj, ležela pravděpodobně v severní Bikáe."
    - "Saul bojoval s králi Sóby mezi svými sousedy. David se střetl s Hadadezerem, když král Sóby vytáhl, „aby rozšířil končiny své až k řece Eufraten“: vzal mu vozy, jezdce a dvacet tisíc pěšáků, podřezal šlachy vozním koním, a když „přitáhli pak byli Syrští od Damašku na pomoc Hadadezerovi králi Soba“, porazil i je a osadil Damašek posádkami. Toú, král Chamatu, který válčil s Hadadezerem, poslal svého syna s dary ze stříbra, zlata a bronzu. Později Amónci najali proti Davidovi „z Syrie z domu Rohob, a z Syrie Soba“; Joáb je porazil před Rabbou a Hadadezer přivedl Aramejce zpoza Eufratu do Chelamu, kde je David rozprášil, takže všichni králové, kteří Hadadezerovi sloužili, uzavřeli mír s Izraelem. Kroniky vypráví tytéž války a nadpis žalmu 60 připomíná tu s Aram-sóbou."
    - "Jedním z Davidových hrdinů byl „Igal syn Nátanův z Soba“. Rezon, syn Eljadův, který „utekl od Hadarezera krále Soby, pána svého“, shromáždil tlupu, zmocnil se Damašku a trápil Šalomouna po všechny jeho dny: vzestup Damašku označuje konec vedoucího postavení Sóby mezi Aramejci. Království se už nezmiňuje a asyrská provincie, která si zachovala jméno, ležela mezi Damaškem a Chamatem. Dnes je Bikáa zemědělskou půdou východního Libanonu mezi pohořími Libanon a Antilibanon, s Baalbekem, starověkým Héliopolí, na severu."
