body:
  en:
    - "Zobah, or Aram-zobah, was an Aramaean kingdom north of Damascus, in the Beqaa valley of Lebanon and the country beyond it towards Hamath and the Euphrates; its capital has not been found, and its exact bounds are unknown. The record here is placed in the Beqaa. In the eighth and seventh centuries BC Assyrian lists and letters name a province Subutu, or Subat, in the same region, which keeps the name. The Bible speaks of “kings of Zobah” in Saul's day and of one king, Hadadezer son of Rehob, in David's; the cities of Hadadezer from which David carried off much bronze, Tibhath and Chun, or Betah and Berothai, probably lay in the northern Beqaa."
    - "Saul fought the kings of Zobah among his neighbours. David met Hadadezer when the king of Zobah “went to recover his border at the river Euphrates”: he took his chariots, horsemen and twenty thousand footmen, hamstrung the chariot horses, and when “the Syrians of Damascus came to succour Hadadezer king of Zobah” defeated them too and put garrisons in Damascus. Toi, king of Hamath, who had been at war with Hadadezer, sent his son with gifts of silver, gold and bronze. Later the Ammonites hired “the Syrians of Beth-rehob, and the Syrians of Zoba” against David; Joab beat them, and Hadadezer brought the Aramaeans from beyond the Euphrates to Helam, where David routed them, so that all the kings who had served Hadadezer made peace with Israel. Chronicles tells the same wars, and the title of Psalm 60 remembers the one with Aram-zobah."
    - "One of David's mighty men was “Igal the son of Nathan of Zobah”. Rezon son of Eliadah, who “fled from his lord Hadadezer king of Zobah”, gathered a band, seized Damascus and troubled Solomon all his days: the rise of Damascus marks the end of Zobah's leadership among the Aramaeans. The Assyrian province that kept its name lay between Damascus and Hamath. Today the Beqaa is the farmland of eastern Lebanon between the Lebanon and Anti-Lebanon ranges, with Baalbek, the ancient Heliopolis, in its north."
  ru:
    - "Сува, или Арам-Цова, была арамейским царством к северу от Дамаска, в долине Бекаа в Ливане и в землях за ней в сторону Емафа и Евфрата; её столица не найдена, а точные границы неизвестны. Запись здесь помещена в Бекаа. В VIII–VII веках до н. э. ассирийские списки и письма называют в тех же краях провинцию Субуту, или Субат, сохранившую это имя. Библия говорит о войне Саула «с царями Совы» и об одном царе, Адраазаре, сыне Рехова, во дни Давида; города Адраазара, из которых Давид вывез много меди, Тивхава и Кун, во Второй книге Царств — Беф и Бероф, лежали, вероятно, на севере Бекаа."
    - "Саул воевал с царями Сувы среди прочих соседей. Давид столкнулся с Адраазаром, когда царь Сувский «шел, чтоб восстановить свое владычество при реке Евфрате»: он взял его колесницы, всадников и двадцать тысяч пеших, подрезал жилы колесничным коням, а когда «пришли Сирийцы Дамасские на помощь к Адраазару, царю Сувскому», разбил и их и поставил охранные войска в Дамаске. Фой, царь Емафа, воевавший с Адраазаром, прислал своего сына с дарами из серебра, золота и меди. Позже Аммонитяне наняли против Давида «Сирийцев из Беф-Рехова и Сирийцев Сувы»; Иоав разбил их, а Адраазар привёл арамеев из-за Евфрата к Еламу, где Давид разгромил их, так что все цари, покорные Адраазару, заключили мир с Израилем. Книги Паралипоменон рассказывают о тех же войнах, а надписание 59-го псалма вспоминает войну с «Сириею Цованскою»."
    - "Среди храбрых Давида был «Игал, сын Нафана, из Цобы». Разон, сын Елиады, «который убежал от государя своего Адраазара, царя Сувского», собрал отряд, захватил Дамаск и вредил Соломону во все его дни: возвышение Дамаска означает конец первенства Сувы среди арамеев. Ассирийская провинция, сохранившая её имя, лежала между Дамаском и Емафом. Сегодня Бекаа — земледельческая долина восточного Ливана между хребтами Ливан и Антиливан, с Баальбеком, древним Гелиополем, на севере."
  uk:
    - "Сува, або Арам-Сува, була арамейським царством на північ від Дамаска, у долині Бекаа в Лівані та краї за нею до Хамата й Євфрату; її столицю не знайдено, а точні межі невідомі. Запис тут розміщено в Бекаа. У VIII–VII ст. до н. е. ассірійські переліки й листи називають провінцію Субуту, або Субат, у тому самому краї, що зберігає назву. Біблія говорить про «царів Суви» за Саула і про одного царя, Адраазара, сина Рехова, за Давида; міста Адраазара, з яких Давид забрав багато бронзи, Тівхава і Кун, або Бета й Берот, ймовірно, лежали в північній Бекаа."
    - "Саул воював з царями Суви серед своїх сусідів. Давид переміг Адраазара, царя Суви, «як він саме був у дорозї до Евфрата, щоб там відновити своє панованнє»: узяв його колісниці, вершників і двадцять тисяч піхоти, покалічив коней від возів, і коли «прийшли Сирийцї Дамаські на підмогу цареві Собському Адаразерові», переміг і їх та поставив гарнізони в Дамаску. Фой, цар Хамата, що воював з Адраазаром, послав свого сина з дарами срібла, золота й бронзи. Пізніше аммонітяни найняли проти Давида «Сирийцїв Бет-Рехобських і Сирийцїв Собських»; Йоав розбив їх, а Адраазар привів арамеїв із-за Євфрату до Елама, де Давид розбив їх, так що всі царі, які служили Адраазару, уклали мир з Ізраїлем. Хроніки розповідають ті самі війни, а напис Псалма 60 пам’ятає війну з Арам-Сувою."
    - "Один із лицарів Давида був «Ігал Натаненко з Зоби». Разон, син Еліади, що «втїк був від свого пана Адраазара, царя Собського», зібрав ватагу, захопив Дамаск і турбував Соломона всі його дні: піднесення Дамаска знаменує кінець провідництва Суви серед арамеїв. Ассірійська провінція, що зберегла її ім’я, лежала між Дамаском і Хаматом. Нині Бекаа — рілля східного Лівану між хребтами Лівану й Антиліван, з Баальбеком, давнім Геліополем, на півночі."
  es:
    - "Soba, o Aram-soba, era un reino arameo al norte de Damasco, en el valle de la Beqaa, en el Líbano, y en el país más allá hacia Hamat y el Éufrates; su capital no se ha hallado, y sus límites exactos se desconocen. El registro de aquí se sitúa en la Beqaa. En los siglos VIII y VII a. C. listas y cartas asirias nombran una provincia Subutu, o Subat, en la misma región, que conserva el nombre. La Biblia habla de «los reyes de Soba» en tiempos de Saúl y de un rey, Hadad-ezer hijo de Rehob, en los de David; las ciudades de Hadad-ezer de las que David se llevó mucho bronce, Tibhat y Chun, o Beta y Berotai, probablemente estaban en el norte de la Beqaa."
    - "Saúl combatió a los reyes de Soba entre sus vecinos. David se enfrentó a Hadad-ezer cuando el rey de Soba iba «á extender su término hasta el río de Eufrates»: le tomó carros, jinetes y veinte mil hombres de a pie, desjarretó los caballos de los carros, y cuando «vinieron los Siros de Damasco á dar ayuda á Hadad-ezer rey de Soba» los derrotó también y puso guarniciones en Damasco. Toi, rey de Hamat, que estaba en guerra con Hadad-ezer, envió a su hijo con regalos de plata, oro y bronce. Más tarde los amonitas contrataron contra David a «los Siros de la casa de Rehob, y á los Siros de Soba»; Joab los venció, y Hadad-ezer trajo a los arameos de más allá del Éufrates a Helam, donde David los derrotó; todos los reyes que habían servido a Hadad-ezer hicieron la paz con Israel. Crónicas cuenta las mismas guerras, y el título del Salmo 60 recuerda la de Aram-soba."
    - "Uno de los valientes de David era «Igheal hijo de Nathán de Soba». Rezón hijo de Eliada, que «había huído de su amo Adad-ezer, rey de Soba», juntó una banda, se apoderó de Damasco y molestó a Salomón todos sus días: el ascenso de Damasco marca el fin del liderazgo de Soba entre los arameos. La provincia asiria que conservó su nombre estaba entre Damasco y Hamat. Hoy la Beqaa es la tierra de cultivo del este del Líbano entre las cordilleras del Líbano y del Antilíbano, con Baalbek, la antigua Heliópolis, en su norte."
  pt:
    - "Zobá, ou Arã-Zobá, era um reino arameu ao norte de Damasco, no vale de Beqaa, no Líbano, e na região além dele rumo a Hamate e ao Eufrates; sua capital não foi achada, e seus limites exatos são desconhecidos. O registro aqui está situado na Beqaa. Nos séculos VIII e VII a.C., listas e cartas assírias nomeiam uma província Subutu, ou Subat, na mesma região, que conserva o nome. A Bíblia fala de “reis de Zobá” nos dias de Saul e de um só rei, Hadadezer, filho de Reobe, nos de Davi; as cidades de Hadadezer de onde Davi levou muito bronze, Tibate e Cum, ou Betá e Berotai, provavelmente ficavam no norte da Beqaa."
    - "Saul combateu os reis de Zobá entre seus vizinhos. Davi enfrentou Hadadezer quando o rei de Zobá “foi estabelecer o seu domínio junto ao rio Eufrates”: tomou seus carros, cavaleiros e vinte mil homens a pé, cortou os tendões dos cavalos dos carros e, quando “os sírios de Damasco vieram para ajudar Hadadezer, rei de Zobá”, derrotou-os também e pôs guarnições em Damasco. Toí, rei de Hamate, que estivera em guerra com Hadadezer, enviou seu filho com presentes de prata, ouro e bronze. Depois os amonitas contrataram contra Davi “os sírios de Bete-Reobe e os sírios de Zobá”; Joabe os venceu, e Hadadezer trouxe os arameus de além do Eufrates a Helã, onde Davi os pôs em fuga, de modo que todos os reis que serviam a Hadadezer fizeram paz com Israel. Crônicas conta as mesmas guerras, e o título do Salmo 60 recorda a que houve com Arã-Zobá."
    - "Um dos valentes de Davi era “Igal, filho de Natã, de Zobá”. Rezom, filho de Eliada, que “havia fugido de seu senhor, Hadadezer, rei de Zobá”, reuniu um bando, tomou Damasco e perturbou Salomão todos os seus dias: a ascensão de Damasco marca o fim da liderança de Zobá entre os arameus. A província assíria que conservou o nome ficava entre Damasco e Hamate. Hoje a Beqaa é a terra agrícola do leste do Líbano entre as cadeias do Líbano e do Antilíbano, com Baalbek, a antiga Heliópolis, ao norte."
  de:
    - "Zoba oder Aram-Zoba war ein aramäisches Königreich nördlich von Damaskus, in der Beqaa-Ebene des Libanon und dem Land dahinter gegen Hamat und den Euphrat; seine Hauptstadt wurde nicht gefunden, und seine genauen Grenzen sind unbekannt. Der Eintrag ist hier in der Beqaa angesetzt. Im achten und siebten Jahrhundert v. Chr. nennen assyrische Listen und Briefe in derselben Region eine Provinz Subutu oder Subat, die den Namen bewahrt. Die Bibel spricht zu Sauls Zeit von „den Königen Zobas“ und zu Davids Zeit von einem König, Hadadeser, Sohn Rehobs; die Städte Hadadesers, aus denen David viel Bronze fortführte, Tibhat und Chun oder Betah und Berotai, lagen wohl in der nördlichen Beqaa."
    - "Saul kämpfte unter seinen Nachbarn gegen die Könige Zobas. David traf Hadadeser, als der König von Zoba „hinzog, seine Macht wieder zu holen an dem Wasser Euphrat“: Er nahm seine Wagen, Reiter und zwanzigtausend Mann Fußvolk, lähmte die Wagenpferde, und als „die Syrer von Damaskus, zu helfen Hadadeser, dem König zu Zoba“ kamen, schlug er auch sie und legte Besatzungen nach Damaskus. Toi von Hamat, Hadadesers Kriegsgegner, sandte seinen Sohn mit Geschenken aus Silber, Gold und Bronze. Später dingten Ammoniter gegen David „die Syrer des Hauses Rehob und die Syrer zu Zoba“; Joab schlug sie, und Hadadeser brachte die Aramäer vom anderen Euphratufer nach Helam, wo David sie schlug, sodass alle Könige, die Hadadeser gedient hatten, mit Israel Frieden schlossen. Die Chronik erzählt dieselben Kriege, und die Überschrift von Psalm 60 erinnert an den mit Aram-Zoba."
    - "Einer von Davids Helden war „Jigeal, der Sohn Nathans, von Zoba“. Reson, Sohn Eljadas, der „von seinem Herrn, Hadadeser, dem König zu Zoba, geflohen war“, sammelte eine Schar, nahm Damaskus und setzte Salomo sein Leben lang zu: Der Aufstieg von Damaskus markiert das Ende der Führungsrolle Zobas unter den Aramäern. Die assyrische Provinz, die seinen Namen bewahrte, lag zwischen Damaskus und Hamat. Heute ist die Beqaa das Ackerland des östlichen Libanon zwischen den Gebirgen Libanon und Antilibanon, mit Baalbek, dem antiken Heliopolis, in ihrem Norden."
  fr:
    - "Tsoba, ou Aram-Tsoba, était un royaume araméen au nord de Damas, dans la vallée de la Beqaa, au Liban, et le pays au-delà vers Hamath et l’Euphrate ; sa capitale n’a pas été trouvée, et ses limites exactes sont inconnues. La carte la place dans la Beqaa. Aux VIIIe et VIIe siècles av. J.-C., des listes et des lettres assyriennes nomment une province Subutu, ou Subat, dans la même région, qui en garde le nom. La Bible parle de « rois de Tsoba » du temps de Saül et d’un seul roi, Hadadézer fils de Rehob, du temps de David ; les villes d’Hadadézer d’où David emporta beaucoup de bronze, Thibchath et Cun, ou Béthach et Bérothaï, se trouvaient probablement dans la Beqaa nord."
    - "Saül combattit les rois de Tsoba, entre autres voisins. David rencontra Hadadézer quand le roi de Tsoba « alla rétablir sa domination sur le fleuve de l’Euphrate » : il lui prit chars, cavaliers et vingt mille fantassins, coupa les jarrets des chevaux de trait, et quand « les Syriens de Damas vinrent au secours d’Hadadézer, roi de Tsoba », les battit aussi et mit des garnisons à Damas. Thoï, roi de Hamath, en guerre avec Hadadézer, envoya son fils offrir argent, or et airain. Plus tard, les Ammonites engagèrent contre David « les Syriens de Beth-Rehob et … les Syriens de Tsoba » ; Joab les battit, et Hadadézer fit venir les Araméens d’au-delà de l’Euphrate à Hélam, où David les mit en déroute, et tous les rois sujets d’Hadadézer firent la paix avec Israël. Les Chroniques racontent les mêmes guerres, le titre du psaume 60 celle d’Aram-Tsoba."
    - "L’un des vaillants de David était « Jigueal, fils de Nathan, de Tsoba ». Rezon fils d’Éliada, qui « s’était enfui de chez son maître Hadadézer, roi de Tsoba », rassembla une bande, s’empara de Damas et tourmenta Salomon toute sa vie : l’essor de Damas marque la fin de la primauté de Tsoba chez les Araméens. La province assyrienne qui garda son nom se trouvait entre Damas et Hamath. La Beqaa est aujourd’hui la terre agricole de l’est du Liban entre le Liban et l’Anti-Liban, avec Baalbek, l’ancienne Héliopolis, dans son nord."
  pl:
    - "Soba, czyli Aram-Soba, było aramejskim królestwem na północ od Damaszku, w dolinie Bekaa w Libanie i w kraju za nią ku Chamat i Eufratowi; jego stolicy nie odnaleziono, a dokładne granice są nieznane. Zapis tu umieszcza je w Bekaa. W VIII i VII wieku p.n.e. asyryjskie spisy i listy nazywają w tym samym regionie prowincję Subutu, czyli Subat, która zachowuje nazwę. Biblia mówi o walce Saula „przeciw królom Soba” i o jednym królu, Hadadezerze, synu Rechoba, w dniach Dawida; miasta Hadadezera, z których Dawid zabrał wiele brązu, Tibchat i Chun, albo Betach i Berotaj, leżały prawdopodobnie w północnej Bekaa."
    - "Saul walczył z królami Soby wśród swoich sąsiadów. Dawid starł się z Hadadezerem, gdy król Soby „wyjechał, aby rozprzestrzenił granice swe nad rzeką Eufrates”: zabrał jego wozy, jeźdźców i dwadzieścia tysięcy pieszych, poderznął żyły koniom wozowym, a gdy „Przyciągnął tedy Syryjczyk z Damaszku na pomoc Hadadezerowi, królowi Soby”, pokonał i ich, i osadził załogi w Damaszku. Toi, król Chamat, który walczył z Hadadezerem, posłał swego syna z darami ze srebra, złota i brązu. Później Ammonici najęli przeciw Dawidowi, jak czytamy, „Syryjczyka z domu Rechob, i Syryjczyka w Soba”; Joab pobił ich, a Hadadezer sprowadził Aramejczyków zza Eufratu do Chelam, gdzie Dawid ich rozgromił, tak że wszyscy królowie, którzy służyli Hadadezerowi, zawarli pokój z Izraelem. Księgi Kronik opowiadają te same wojny, a tytuł Psalmu 60 pamięta tę z Aram-Soba."
    - "Jednym z dzielnych mężów Dawida był „Igal, syn Natana z Soby”. Rezon, syn Eliady, o którym czytamy, że „był uciekł od Adarezera, króla Soby, Pana swego”, zebrał oddział, zajął Damaszek i niepokoił Salomona przez wszystkie jego dni: powstanie Damaszku oznacza koniec przywództwa Soby wśród Aramejczyków. Prowincja asyryjska, która zachowała jej nazwę, leżała między Damaszkiem a Chamat. Dziś Bekaa to ziemia uprawna wschodniego Libanu między pasmami Libanu i Antylibanu, z Baalbekiem, starożytnym Heliopolis, na północy."
  it:
    - "Zoba, o Aram-Zoba, era un regno aramaico a nord di Damasco, nella valle della Beqa in Libano e nel paese oltre di essa verso Camat e l’Eufrate; la sua capitale non è stata trovata, e i suoi confini esatti sono ignoti. La mappa la pone nella Beqa. Nell’VIII e VII secolo a.C. elenchi e lettere assire nominano una provincia Subutu, o Subat, nella stessa regione, che ne conserva il nome. La Bibbia parla di «re di Tsoba» ai giorni di Saul e di un solo re, Adadezer figlio di Recob, ai giorni di Davide; le città di Adadezer da cui Davide portò via molto bronzo, Tibcat e Cun, o Betach e Berotai, giacevano probabilmente nella Beqa settentrionale."
    - "Saul combatté i re di Zoba fra i suoi vicini. Davide incontrò Adadezer quando il re di Zoba «andava a ristabilire il suo dominio sul fiume Eufrate»: gli prese carri, cavalieri e ventimila pedoni, tagliò i garretti ai cavalli da tiro, e quando «i Siri di Damasco vennero per soccorrere Hadadezer, re di Tsoba» sconfisse anche loro e pose guarnigioni a Damasco. Toi, re di Camat, che era stato in guerra con Adadezer, mandò suo figlio con doni d’argento, oro e bronzo. In seguito gli Ammoniti presero al loro soldo «dei Siri di Beth-Rehob e dei Siri di Tsoba» contro Davide; Ioab li batté, e Adadezer fece venire gli Aramei da oltre l’Eufrate a Chelam, dove Davide li sbaragliò, così che tutti i re che avevano servito Adadezer fecero pace con Israele. Le Cronache raccontano le stesse guerre, e il titolo del Salmo 60 ricorda quella con Aram-Zoba."
    - "Uno dei prodi di Davide era «Igal, figliuolo di Nathan, da Tsoba». Rezon figlio di Eliada, «ch’era fuggito dal suo signore Hadadezer, re di Tsoba», radunò una banda, si impadronì di Damasco e tormentò Salomone per tutti i suoi giorni: l’ascesa di Damasco segna la fine del primato di Zoba fra gli Aramei. La provincia assira che ne conservò il nome stava fra Damasco e Camat. Oggi la Beqa è la terra agricola del Libano orientale fra le catene del Libano e dell’Antilibano, con Baalbek, l’antica Eliopoli, a nord."
  nl:
    - "Soba, of Aram-Soba, was een Arameeërs koninkrijk ten noorden van Damascus, in de Beqaa-vallei van Libanon en het land erachter richting Hamat en de Eufraat; de hoofdstad is niet gevonden, en de precieze grenzen zijn onbekend. Het punt op de kaart ligt in de Beqaa. In de achtste en zevende eeuw v.Chr. noemen Assyrische lijsten en brieven in dezelfde streek een provincie Subutu, of Subat, die de naam bewaart. De Bijbel spreekt van “de koningen van Zoba” in de dagen van Saul en van één koning, Hadadezer, de zoon van Rechob, in die van David; de steden van Hadadezer waaruit David veel brons wegvoerde, Tibchat en Chun, of Betach en Berotai, lagen waarschijnlijk in de noordelijke Beqaa."
    - "Saul streed tegen “de koningen van Zoba” onder zijn buren. David trof Hadadezer toen die “heen toog, om zijn hand te wenden naar de rivier Frath”: hij nam hem zijn wagens, ruiters en twintigduizend man te voet af, ontzenuwde de wagenpaarden, en toen “De Syriers van Damaskus kwamen om Hadad-ezer, den koning van Zoba, te helpen” versloeg hij ook hen en legde bezettingen in Damascus. Toï, koning van Hamat, in oorlog met Hadadezer, zond zijn zoon met geschenken van zilver, goud en brons. Later huurden de Ammonieten “van de Syriers van Beth-Rechob, en van de Syriers van Zoba” tegen David; Joab versloeg hen, en Hadadezer haalde de Arameeërs van over de Eufraat naar Chelam, waar David hen versloeg, zodat alle koningen van Hadadezer vrede sloten met Israël. Kronieken vertelt dezelfde oorlogen, en het opschrift van Psalm 60 noemt die met Aram-Soba."
    - "Een van Davids helden was “Jig-al, de zoon van Nathan, van Zoba”. Rezon, de zoon van Eljada, die “gevloden was van zijn heer Hadad-ezer, den koning van Zoba”, verzamelde een bende, greep Damascus en kwelde Salomo al zijn dagen: de opkomst van Damascus markeert het einde van Soba’s leidende positie onder de Arameeërs. De Assyrische provincie die de naam behield, lag tussen Damascus en Hamat. Tegenwoordig is de Beqaa het landbouwgebied van Oost-Libanon tussen de gebergten Libanon en Anti-Libanon, met in het noorden Baalbek, het antieke Heliopolis."
  cs:
    - "Sóba, neboli Aram-sóba, bylo aramejské království severně od Damašku, v údolí Bikáa v Libanonu a v zemi za ním směrem k Chamatu a Eufratu; jeho hlavní město nebylo nalezeno a jeho přesné hranice nejsou známy. Záznam zde je umístěn do Bikáy. V 8. a 7. stol. př. n. l. jmenují asyrské seznamy a listy provincii Subutu, neboli Subat, ve stejné oblasti, která si zachovává jméno. Bible mluví o Saulově válce „s králi Soba“ a o jediném králi, Hadadezerovi, synu Rechobovu, za Davidových dnů; města Hadadezerova, z nichž David odvezl mnoho bronzu, Tibchat a Chun, neboli Betach a Berotaj, ležela pravděpodobně v severní Bikáe."
    - "Saul bojoval s králi Sóby mezi svými sousedy. David se střetl s Hadadezerem, když král Sóby vytáhl, „aby rozšířil končiny své až k řece Eufraten“: vzal mu vozy, jezdce a dvacet tisíc pěšáků, podřezal šlachy vozním koním, a když „přitáhli pak byli Syrští od Damašku na pomoc Hadadezerovi králi Soba“, porazil i je a osadil Damašek posádkami. Toú, král Chamatu, který válčil s Hadadezerem, poslal svého syna s dary ze stříbra, zlata a bronzu. Později Amónci najali proti Davidovi „z Syrie z domu Rohob, a z Syrie Soba“; Joáb je porazil a Hadadezer přivedl Aramejce zpoza Eufratu do Chelamu, kde je David rozprášil, takže všichni králové, kteří Hadadezerovi sloužili, uzavřeli mír s Izraelem. Kroniky vypráví tytéž války a nadpis žalmu 60 připomíná tu s Aram-sóbou."
    - "Jedním z Davidových hrdinů byl „Igal syn Nátanův z Soba“. Rezon, syn Eljadův, který „utekl od Hadarezera krále Soby, pána svého“, shromáždil tlupu, zmocnil se Damašku a trápil Šalomouna po všechny jeho dny: vzestup Damašku označuje konec vedoucího postavení Sóby mezi Aramejci. Asyrská provincie, která si zachovala jméno, ležela mezi Damaškem a Chamatem. Dnes je Bikáa zemědělskou půdou východního Libanonu mezi pohořími Libanon a Antilibanon, s Baalbekem, starověkým Héliopolí, na severu."
  sv:
    - "Sova, eller Aram-Sova, var ett arameiskt rike norr om Damaskus, i Beqaadalen i Libanon och landet bortom den mot Hamat och Eufrat; dess huvudstad har inte hittats, och dess exakta gränser är okända. Uppgiften här är placerad i Beqaa. På 700- och 600-talen f.Kr. nämner assyriska förteckningar och brev en provins Subutu, eller Subat, i samma region, som bevarar namnet. Bibeln talar om ”konungarna i Soba” på Sauls tid och om en kung, Hadadeser, Rehovs son, på Davids; Hadadesers städer varifrån David bar bort mycket brons, Tibchat och Kun, eller Betach och Berotaj, låg sannolikt i norra Beqaa."
    - "Saul stred mot kungarna i Sova bland sina grannar. David mötte Hadadeser när kungen av Sova ”hade dragit åstad för att utsträcka sitt välde till floden”: han tog hans vagnar, ryttare och tjugo tusen man fotfolk, skar av vagnshästarnas hasseninar, och när ”araméerna från Damaskus kommo för att hjälpa Hadadeser, konungen i Soba” besegrade han också dem och lade garnisoner i Damaskus. Toi, kung av Hamat, som hade legat i krig med Hadadeser, sände sin son med gåvor av silver, guld och brons. Senare lejde ammoniterna mot David män från ”Aram-Bet-Rehob och Aram-Soba”; Joav slog dem, och Hadadeser förde araméerna från andra sidan Eufrat till Helam, där David slog dem på flykt, så att alla kungar som hade tjänat Hadadeser slöt fred med Israel. Krönikeboken berättar samma krig, och rubriken till Psalm 60 minns kriget mot Aram-Sova."
    - "En av Davids hjältar var ”Jigeal, Natans son, från Soba”. Reson, Eljadas son, som ”hade flytt ifrån sin herre, Hadadeser, konungen i Soba”, samlade ett följe, grep Damaskus och oroade Salomo alla hans dagar: Damaskus uppgång markerar slutet på Sovas ledande ställning bland araméerna. Den assyriska provinsen som behöll namnet låg mellan Damaskus och Hamat. I dag är Beqaa det östra Libanons jordbruksmark mellan bergskedjorna Libanon och Anti-Libanon, med Baalbek, det forntida Heliopolis, i norr."
  nb:
    - "Soba, eller Aram-Soba, var et arameisk kongedømme nord for Damaskus, i Bekaa-dalen i Libanon og landet hinsides den mot Hamat og Eufrat; hovedstaden er ikke funnet, og de nøyaktige grensene er ukjente. Beretningen er her plassert i Bekaa. På 700- og 600-tallet f.Kr. nevner assyriske lister og brev en provins Subutu, eller Subat, i samme region, som bevarer navnet. Bibelen taler om «kongene i Soba» på Sauls tid og om én konge, Hadadeser, Rehobs sønn, på Davids; Hadadesers byer som David førte bort mye bronse fra, Tibhat og Kun, eller Betah og Berotai, lå trolig i det nordlige Bekaa."
    - "Saul kjempet mot kongene i Soba blant sine naboer. David møtte Hadadeser da kongen i Soba «drog avsted for å gjenvinne sin makt ved elven»: han tok vognene hans, hestfolket og tyve tusen mann fotfolk, skar over hasene på vognhestene, og da «Syrerne fra Damaskus kom for å hjelpe Hadadeser, kongen i Soba», slo han også dem og la garnisoner i Damaskus. To'i, kongen i Hamat, som hadde ligget i krig med Hadadeser, sendte sønnen sin med gaver av sølv, gull og bronse. Senere leide ammonittene «syrerne fra Bet-Rehob og syrerne fra Soba» mot David; Joab slo dem, og Hadadeser førte arameerne fra hinsides Eufrat til Helam, der David slo dem på flukt, slik at alle kongene som hadde tjent Hadadeser, sluttet fred med Israel. Krønikebøkene forteller de samme krigene, og overskriften til Salme 60 minnes den mot Aram-Soba."
    - "En av Davids helter var «Jigal, sønn av Natan, fra Soba». Reson, Eljadas sønn, som «var flyktet fra sin herre Hadadeser, kongen i Soba», samlet en flokk, grep Damaskus og plaget Salomo alle hans dager: Damaskus' oppgang markerer slutten på Sobas lederskap blant arameerne. Den assyriske provinsen som bevarte navnet, lå mellom Damaskus og Hamat. I dag er Bekaa jordbruksland i det østlige Libanon mellom fjellkjedene Libanon og Anti-Libanon, med Baalbek, det gamle Heliopolis, i nord."
  tl:
    - "Ang Soba, o Aram-soba, ay kahariang Arameo sa hilaga ng Damasco, sa libis ng Beqaa ng Libano at sa lupain sa kabila nito patungong Hamath at Eufrates; hindi natagpuan ang kabisera nito, at hindi alam ang eksaktong hangganan. Inilalagay dito ang tala sa Beqaa. Noong ika-8 at ika-7 siglo BK, pinangalanan ng mga talaan at liham na Asirio ang lalawigang Subutu, o Subat, sa parehong rehiyon, na nagpapanatili ng pangalan. Binabanggit ng Biblia ang “mga hari sa Soba” noong kaarawan ni Saul at isang hari, si Hadadezer na anak ni Rehob, noong kay David; ang mga lunsod ni Hadadezer na pinagkunan ni David ng maraming tanso, Thibath at Chun, o Beta at Berothai, ay marahil nasa hilagang Beqaa."
    - "Nakipaglaban si Saul sa mga hari ng Soba. Sinagupa ni David si Hadadezer nang “yumayaon upang bawiin ang kaniyang pamumuno sa Ilog”: kinuha niya ang mga karo, mangangabayo at 20,000 kawal, pinutol ang litid ng mga kabayo, at nang “sumaklolo ang mga taga Siria sa Damasco kay Hadadezer na hari sa Soba”, tinalo rin sila at naglagay ng garison sa Damasco. Nagpadala si Toi, hari ng Hamath na kaaway ni Hadadezer, ng anak na may regalong pilak, ginto at tanso. Inupahan ng mga Ammonita laban kay David “ang mga taga Siria sa Beth-rehob, at ang mga taga Siria sa Soba”; tinalo sila ni Joab, at dinala ni Hadadezer ang mga Arameo mula sa kabila ng Eufrates sa Helam, kung saan sila tinalo ni David, kaya nakipagpayapaan sa Israel ang lahat ng haring naglingkod kay Hadadezer. Isinasalaysay ng Mga Cronica ang mga digmaang ito, at inaalala ng pamagat ng Awit 60 ang kay Aram-soba."
    - "Isa sa mga makapangyarihang lalaki ni David ay si “Igheal na anak ni Nathan na taga Soba”. Si Rezon na anak ni Eliada, na “tumakas sa kaniyang panginoong kay Adadezer na hari sa Soba”, ay nagtipon ng pangkat, sinakop ang Damasco at ginulo si Salomon sa buong buhay nito: ang pag-angat ng Damasco ang wakas ng pamumuno ng Soba sa mga Arameo. Ang lalawigang Asirio na nagpanatili ng pangalan ay nasa pagitan ng Damasco at Hamath. Ngayon ang Beqaa ay bukirin ng silangang Libano sa pagitan ng mga hanay ng Libano at Anti-Libano, na ang Baalbek, ang sinaunang Heliopolis, ay nasa hilaga."
  da:
    - "Soba, eller Aram-Soba, var et arameisk kongerige nord for Damaskus, i Bekaadalen i Libanon og landet hinsides den mod Hamat og Eufrat; dets hovedstad er ikke fundet, og dets nøjagtige grænser er ukendte. Optegnelsen her er placeret i Bekaa. I 700- og 600-tallet f.Kr. nævner assyriske lister og breve en provins Subutu, eller Subat, i samme region, som har bevaret navnet. Bibelen taler om »Kongerne af Zoba« i Sauls dage og om én konge, Hadadezer, Rehobs søn, i Davids; Hadadezers byer, hvorfra David bortførte meget bronze, Tibhat og Kun, eller Betah og Berotaj, lå sandsynligvis i det nordlige Bekaa."
    - "Saul kæmpede mod Sobas konger blandt sine naboer. David mødte Hadadezer, da kongen af Soba »drog hen at vende sin Haand mod Floden Frat«: han tog hans vogne, ryttere og tyve tusind mand fodfolk, skar hasesenerne over på vognhestene, og da »Syrerne af Damaskus kom for at hjælpe Hadad-Eser, Kongen af Zoba«, besejrede han også dem og lagde garnisoner i Damaskus. Toi, konge af Hamat, som havde ligget i krig med Hadadezer, sendte sin søn med gaver af sølv, guld og bronze. Senere lejede ammonitterne »Syrerne af Rekobs Hus og Syrerne af Zoba« mod David; Joab slog dem, og Hadadezer bragte arameerne fra hinsides Eufrat til Helam, hvor David jog dem på flugt, så at alle de konger, der havde tjent Hadadezer, sluttede fred med Israel. Krønikebøgerne fortæller de samme krige, og overskriften til Salme 60 husker den med Aram-Soba."
    - "En af Davids helte var »Jigal, Nathans Søn, af Zoba«. Rezon, Eljadas søn, der »flyede fra sin Herre Hadad-Eser, Kongen af Zoba«, samlede en bande, greb Damaskus og gjorde Salomo fortræd alle hans dage: Damaskus' fremvækst markerer enden på Sobas lederskab blandt arameerne. Den assyriske provins, der beholdt navnet, lå mellem Damaskus og Hamat. I dag er Bekaa agerlandet i det østlige Libanon mellem Libanon- og Anti-Libanon-bjergene, med Baalbek, oldtidens Heliopolis, i nord."
  sr:
    - "Сова, или Арам-Сова, била је арамејско краљевство северно од Дамаска, у долини Бекаа у Ливану и земљи иза ње према Емату и Еуфрату; њена престоница није нађена, а тачне границе нису познате. Запис је овде смештен у Бекаа. У 8. и 7. веку п. н. е. асирски спискови и писма именују провинцију Субуту, или Субат, у истом крају, која чува име. Библија говори о „царевима совским“ у Саулово доба и о једном цару, Адад-Езеру сину Реововом, у Давидово; градови Адад-Езерови из којих је Давид однео много бронзе, Тиват и Хун, или Ветах и Виротаја, вероватно су лежали у северној Бекаа."
    - "Саул се борио с царевима совским међу својим суседима. Давид је срео Адад-Езера када је овај „изашав да рашири власт своју до реке Ефрата“: Давид му је узео кола, коњанике и двадесет хиљада пешака, пререзао тетиве коњима кола, а када су у помоћ Адад-Езеру дошли „Сирци из Дамаска“, победио је и њих и поставио посаде у Дамаску. Тој, цар Емата, који је био у рату с Адад-Езером, послао је свог сина са даровима сребра, злата и бронзе. Касније су Амонци најмили „Сираца од Вет-Реова и Сираца од Сове“ против Давида; Јоав их је победио, а Адад-Езер је довео Арамејце са друге стране Еуфрата у Елам, где их је Давид разбио, тако да су сви цареви који су служили Адад-Езеру склопили мир с Израиљем. Летописи приповедају исте ратове, а наслов Псалма 60 памти онај с Арам-Совом."
    - "Један од Давидових јунака био је „Игал син Натанов из Сове“. Резон син Елијадин, који „беше побегао од господара свог Адад-Езера, цара совског“, окупио је чету, заузео Дамаск и узнемиравао Соломуна свих његових дана: успон Дамаска означава крај водеће улоге Сове међу Арамејцима. Асирска провинција која је задржала име лежала је између Дамаска и Емата. Данас је Бекаа пољопривредна земља источног Либана између гребена Ливана и Антиливана, са Баалбеком, древним Хелиополисом, на северу."
  hu:
    - "Cóbá, vagy Arám-Cóbá, Damaszkusztól északra fekvő arám királyság volt, a libanoni Bekáa-völgyben és az azon túli országban Hamát és az Eufrátesz felé; fővárosát nem találták meg, pontos határai ismeretlenek. A feljegyzés itt a Bekáába van helyezve. A Kr. e. 8. és 7. században asszír jegyzékek és levelek ugyanabban a térségben Subutu vagy Subat tartományt nevezik meg, amely megőrizte a nevet. A Biblia Saul napjaiban „a Czobeusok királyai”-ról, Dávid napjaiban pedig egy királyról, Hadadézerről, Réhób fiáról beszél; Hadadézer városai, amelyekből Dávid sok bronzot vitt el, Tibhát és Kún, vagy Betah és Berótai, valószínűleg az északi Bekáában feküdtek."
    - "Saul harcolt „a Czobeusok királyai ellen”. Dávid Hadadézerrel akkor találkozott, amikor Cóbá királya elment, „hogy hatalmát kiterjessze az Eufrátes folyó vizéig”: elvette szekereit, lovasait és húszezer gyalogosát, megbénította a szekérlovakat, és amikor „Eljövének pedig a Siriabeliek Damaskusból, hogy megsegítsék Hadadézert, Czóbának királyát”, őket is legyőzte, helyőrséget tett Damaszkuszba. Tói, Hamát Hadadézerrel hadban álló királya, fiát ezüst-, arany- és bronzajándékkal küldte. Később az ammoniták „Siriában a Béth-Réhóbbelieket és ugyancsak Siriában a Czóbeusokat” fogadták fel Dávid ellen; Joáb megverte őket, Hadadézer pedig az Eufráteszen túli arámokat Hélámhoz hozta, ahol Dávid szétverte őket, és Hadadézer minden vazallusa békét kötött Izráellel. A Krónikák ugyanezeket a háborúkat mondja el, a 60. zsoltár felirata pedig az Arám-Cóbával vívottra emlékezik."
    - "Dávid egyik vitéze „Jigeál, Sobabeli Nátánnak fia” volt. Rezon, Eljada fia, aki „elfutott vala Hadadézertől, a Sóbabeli királytól, az ő urától”, bandát gyűjtött, elfoglalta Damaszkuszt, és Salamont élete végéig zaklatta: Damaszkusz felemelkedése jelzi Cóbá vezető szerepének végét az arámok között. Az asszír tartomány, amely megtartotta a nevét, Damaszkusz és Hamát között feküdt. Ma a Bekáa Kelet-Libanon termőföldje a Libanon- és az Antilibanon-hegylánc között, északi részén Baalbekkel, az ókori Héliopolisszal."
  fi:
    - "Soba eli Aram-Soba oli aramilaisvaltakunta Damaskoksen pohjoispuolella, Libanonin Bekaan laaksossa ja sen takana olevassa maassa kohti Hamatia ja Eufratia; sen pääkaupunkia ei ole löydetty, eikä sen tarkkoja rajoja tunneta. Kartta sijoittaa sen Bekaaseen. 700- ja 600-luvuilla eaa. assyrialaiset luettelot ja kirjeet nimeävät samalla alueella provinssin Subutu eli Subat, joka säilyttää nimen. Raamattu puhuu Soban kuninkaista Saulin päivinä ja yhdestä kuninkaasta, Rehobin pojasta Hadadeserista, Daavidin aikana; Hadadeserin kaupungit, joista Daavid vei paljon pronssia, Tibhat ja Kun, eli Betah ja Berotai, sijaitsivat todennäköisesti pohjoisessa Bekaassa."
    - "Saul sotaili Soban kuninkaita vastaan naapureidensa joukossa. Daavid kohtasi Hadadeserin, kun Soban kuningas oli menossa ”ulottamaan valtaansa Eufrat-virtaan”: hän otti tämän vaunut, ratsumiehet ja kaksikymmentätuhatta jalkamiestä, lamautti vaunuhevoset, ja kun ”Damaskon aramilaiset tulivat auttamaan Hadadeseria, Sooban kuningasta”, voitti nekin ja pani varuskuntia Damaskokseen. Hamatin kuningas Toi, joka oli sotinut Hadadeseria vastaan, lähetti poikansa lahjoineen hopeaa, kultaa ja pronssia. Myöhemmin ammonilaiset palkkasivat Daavidia vastaan ”Beet-Rehobin ja Sooban aramilaisia”; Joab löi heidät, ja Hadadeser toi aramilaiset Eufratin takaa Helamiin, missä Daavid musersi heidät, niin että kaikki kuninkaat, jotka olivat palvelleet Hadadeseria, tekivät rauhan Israelin kanssa. Aikakirjat kertovat samat sodat, ja Psalmin 60 otsikko muistaa sodan Aram-Soban kanssa."
    - "Yksi Daavidin sankareista oli ”Jigal, Naatanin poika, Soobasta”. Reson, Eljadan poika, joka ”oli paennut herransa Hadadeserin, Sooban kuninkaan, luota”, kokosi joukon, valtasi Damaskoksen ja vaivasi Salomoa koko tämän elinajan: Damaskoksen nousu merkitsee Soban johtoaseman päättymistä aramilaisten keskuudessa. Assyrian provinssi, joka säilytti nimen, sijaitsi Damaskoksen ja Hamatin välissä. Nykyisin Bekaa on Itä-Libanonin viljelysmaata Libanonin ja Anti-Libanonin vuorijonojen välissä, ja sen pohjoisosassa on Baalbek, muinainen Heliopolis."
  vi:
    - "Xô-ba, hay A-ram Xô-ba, là một vương quốc A-ram phía bắc Đa-mách, trong thung lũng Beqaa của Li-ban và xứ phía bên kia hướng về Ha-mát và sông Ơ-phơ-rát; thủ đô của nó chưa tìm thấy, và ranh giới chính xác không biết. Ghi chép ở đây đặt nó trong Beqaa. Vào thế kỷ 8 và 7 TCN, các danh sách và thư A-si-ri nêu một tỉnh Subutu, hay Subat, trong cùng vùng, còn giữ tên. Kinh Thánh nói về “các vua Xô-ba” thời Sau-lơ và về một vua, Ha-đa-đê-xe con Rê-hốp, thời Đa-vít; các thành của Ha-đa-đê-xe mà Đa-vít lấy nhiều đồng, Ti-bát và Cun, hay Bê-tách và Bê-rô-tôi, có lẽ nằm ở bắc Beqaa."
    - "Sau-lơ đánh các vua Xô-ba giữa các láng giềng. Đa-vít gặp Ha-đa-đê-xe khi vua Xô-ba “đi đặng lấy lại quyền quản hạt trên sông Ơ-phơ-rát”: ông bắt xe, kỵ binh và hai mươi nghìn bộ binh của hắn, chặt gân ngựa kéo xe, và khi “Dân Sy-ri ở Đa-mách đến tiếp trợ Ha-đa-đê-xe, vua Xô-ba” thì đánh bại họ nữa và đặt đồn binh ở Đa-mách. Thôi, vua Ha-mát, đã có chiến tranh với Ha-đa-đê-xe, sai con mình mang quà bạc, vàng và đồng. Về sau dân Am-môn thuê “dân Sy-ri ở Bết-Rê-hốt và ở Xô-ba” chống Đa-vít; Giô-áp đánh bại họ, và Ha-đa-đê-xe đem người A-ram từ bên kia sông Ơ-phơ-rát đến Hê-lam, nơi Đa-vít đánh tan họ, nên mọi vua từng phục vụ Ha-đa-đê-xe đều làm hòa với Y-sơ-ra-ên. Sách Sử Ký kể cùng các cuộc chiến ấy, và tựa đề Thi thiên 60 nhớ cuộc chiến với A-ram Xô-ba."
    - "Một dũng sĩ của Đa-vít là “Di-ganh, con trai của Na-than, ở Xô-ba”. Rê-xôn con Ê-li-gia-đa, “đã chạy trốn khỏi chúa mình là Ha-đa-đê-xe, vua Xô-ba”, nhóm một toán quân, chiếm Đa-mách và quấy rối Sa-lô-môn suốt đời: sự trỗi dậy của Đa-mách đánh dấu sự chấm dứt vị thế dẫn đầu của Xô-ba giữa người A-ram. Tỉnh A-si-ri còn giữ tên nằm giữa Đa-mách và Ha-mát. Ngày nay Beqaa là đất canh tác đông Li-ban giữa các dãy Li-ban và Anti-Li-ban, với Baalbek, Hê-li-ô-bô-li xưa, ở phía bắc."
  ro:
    - "Țoba, sau Aram-Țoba, era un regat arameu la nord de Damasc, în Valea Beqaa din Liban și în ținutul dincolo de ea, spre Hamat și Eufrat; capitala ei nu a fost găsită, iar hotarele ei exacte nu se cunosc. Harta o așază în Beqaa. În secolele al VIII-lea și al VII-lea î.Hr., liste și scrisori asiriene numesc o provincie Subutu, sau Subat, în aceeași regiune, care păstrează numele. Biblia vorbește despre regii Țobei în vremea lui Saul și despre un singur rege, Hadadezer, fiul lui Rehob, în vremea lui David; cetățile lui Hadadezer de unde David a luat multă aramă, Tibhat și Chun, sau Beta și Berotai, se aflau probabil în nordul Beqaa."
    - "Saul s-a luptat cu regii Țobei printre vecinii lui. David l-a întâlnit pe Hadadezer când regele Țobei „mergea să-și întindă puterea sa preste rîul Efratului”: i-a luat carele, călăreții și douăzeci de mii de pedestrași, a tăiat vinele cailor de la care, iar când „au venit Sirienii din Damasc să ajute lui Adraazar împăratul Suvei”, i-a învins și pe ei și a pus garnizoane în Damasc. Toi, regele Hamatului, care fusese în război cu Hadadezer, și-a trimis fiul cu daruri de argint, aur și aramă. Mai târziu, amoniții „au năimit din Siriea Vetraam și din Siriea Suvà” împotriva lui David; Ioab i-a învins, iar Hadadezer a adus arameii de dincolo de Eufrat la Helam, unde David i-a zdrobit, așa că toți regii care îl slujiseră pe Hadadezer au făcut pace cu Israel. Cronicile povestesc aceleași războaie, iar titlul Psalmului 60 amintește războiul cu Aram-Țoba."
    - "Unul dintre vitejii lui David era „Igala feciorul lui Natan”, din Țoba. Rezon, fiul lui Eliada, care a fugit de la stăpânul său Hadadezer, regele Țobei, a adunat o ceată, a pus stăpânire pe Damasc și l-a tulburat pe Solomon în toate zilele lui: ascensiunea Damascului marchează sfârșitul conducerii Țobei între arameeni. Provincia asiriană care i-a păstrat numele se afla între Damasc și Hamat. Astăzi Beqaa este ținutul agricol al estului Libanului, între lanțurile Liban și Anti-Liban, cu Baalbek, vechiul Heliopolis, în nordul ei."
  bg:
    - "Сува, или Арам-Сува, било арамейско царство северно от Дамаск, в долината Бекаа в Ливан и в страната отвъд нея към Емат и Ефрат; столицата му не е намерена, а точните му граници са неизвестни. Записът тук е поставен в Бекаа. През VIII и VII в. пр.н.е. асирийски списъци и писма назовават провинция Субуту, или Субат, в същата област, която пази името. Библията говори за „Совските царе“ по времето на Саул и за един цар, Адраазар, син на Рехов, по времето на Давид; градовете на Адраазар, от които Давид отнесъл много мед — Тивхат и Хун, или Бетах и Беротай, — вероятно са лежали в северната Бекаа."
    - "Саул воювал против царете на Сува сред съседите си. Давид се сблъскал с Адраазар, когато царят на Сува „отхождаше да постави властта си на реката Евфрат“: взел колесниците, конниците му и двадесет хиляди пешаци, прерязал жилите на конете от колесниците, а когато „дойдоха Дамасковите Сирийци за да помогнат на Ададезера царя на Сова“, разбил и тях и поставил стражи в Дамаск. Тоа, царят на Емат, който воювал с Адраазар, изпратил сина си с дарове от сребро, злато и мед. По-късно амонците наели против Давид „Вет-реовските Сирийци и Совските Сирийци“; Йоав ги разбил, а Адраазар довел арамейците отвъд Ефрат в Елам, където Давид ги разгромил, и всички царе, служили на Адраазар, сключили мир с Израил. Летописи разказват за същите войни, а надписът на Пс. 60 помни войната с Арам-Сува."
    - "Един от храбрите мъже на Давид бил „Игал Натановий син, от Сова“. Разон, синът на Елиада, който „бе побягнал от господаря си Ададезера Совския цар“, събрал чета, завзел Дамаск и досаждал на Соломон през всичките му дни: възходът на Дамаск бележи края на водачеството на Сува сред арамейците. Асирийската провинция, която запазила името, лежала между Дамаск и Емат. Днес Бекаа е земеделската земя на Източен Ливан между веригите Ливан и Антиливан, с Баалбек, древния Хелиополис, на север."
