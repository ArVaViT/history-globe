# Overview article (ADR 0007). Mainstream facts only; a minor place: the identification with et-Taiyibeh rests on the name and the setting and is said so; the Amarna "Tubu" is given as a possibility.
id: tob
place: aaff3e1
title:
  en: "Tob"
  ru: "Тов"
  uk: "Тов"
  es: "Tob"
  pt: "Tobe"
  de: "Tob"
  fr: "Tob"
  pl: "Tob"
