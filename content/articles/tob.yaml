body:
  en:
    - "The land of Tob was a district east of the Jordan, north of Gilead and towards the Aramaean country, where an outlaw could live beyond the reach of his kin. It is usually placed around et-Taiyibeh, a village some 15 km south-east of Daraa in southern Syria, in the Hauran plain near the Jordanian border, which may keep the name; a land Tubu in the Amarna letters is often taken for it. Nothing has been excavated there, and the identification rests on the name and on the position the stories require."
    - "“Then Jephthah fled from his brethren, and dwelt in the land of Tob: and there were gathered vain men to Jephthah, and went out with him.” When the Ammonites made war on Gilead the elders went “to fetch Jephthah out of the land of Tob”, and he came home as their captain and judge. Generations later Tob was on the other side: when the Ammonites had insulted David's envoys, they hired the Aramaeans of Beth-rehob and Zobah, the king of Maacah “and of Ish-tob twelve thousand men”, that is the men of Tob, who stood with the Aramaeans in the field while the Ammonites held the city gate, until Joab routed them. The Synodal Bible keeps the Hebrew form Ishtob as a name."
    - "In the Maccabean wars Jews living in the land of Tob were killed by their neighbours; Second Maccabees calls the Jews of that region the Tubieni, and some connect the name with the Tobiad family whose palace stands at Iraq al-Amir west of Amman, which the map offers as a second, less likely site. Et-Taiyibeh today is a village of the Daraa governorate of Syria, just north of the Jordanian border."
  ru:
    - "Земля Тов — область к востоку от Иордана, севернее Галаада, в сторону арамейских земель, где изгнанник мог жить вне досягаемости родни. Её обычно помещают вокруг Эт-Тайибе, селения примерно в 15 км к юго-востоку от Дераа на юге Сирии, на Хауранской равнине близ иорданской границы, которое, возможно, хранит имя; землю Туву в письмах из Амарны часто принимают за неё. Раскопок там не было, и отождествление держится на имени и на положении, которого требуют рассказы."
    - "«И убежал Иеффай от братьев своих и жил в земле Тов; и собрались к Иеффаю праздные люди и выходили с ним». Когда Аммонитяне пошли войной на Галаад, старейшины пришли «взять Иеффая из земли Тов», и он вернулся домой их вождём и судьёй. Поколения спустя Тов оказался на другой стороне: оскорбив послов Давида, Аммонитяне наняли Сирийцев из Беф-Рехова и Сувы, царя Маахи «и из Истова двенадцать тысяч человек», то есть людей Това, и те стояли с Сирийцами в поле, а Аммонитяне держали городские ворота, пока Иоав не обратил их в бегство. Синодальный перевод сохраняет еврейскую форму Истов как имя."
    - "В Маккавейских войнах иудеев, живших в земле Тов, перебили соседи; Вторая книга Маккавейская зовёт иудеев того края тувиенами, и некоторые связывают это имя с родом Товиадов, чей дворец стоит в Ирак-эль-Амире к западу от Аммана, — на карте он предложен как второе, менее вероятное место. Эт-Тайибе сегодня — селение в мухафазе Дераа в Сирии, чуть севернее иорданской границы."
  uk:
    - "Країна Тов була округою на схід від Йордану, на північ від Гілеаду та в бік арамейського краю, де вигнанець міг жити поза досяжністю родичів. Її зазвичай розміщують навколо ет-Тайїби, села приблизно за 15 км на південний схід від Дераа на півдні Сирії, на рівнині Хавран біля йорданського кордону, яке, можливо, зберігає назву; країну Тубу в листах з Амарни часто ототожнюють із нею. Там нічого не розкопано, і ототожнення спирається на назву й на положення, якого вимагають розповіді."
    - "«От і зник Ефтай од братів своїх, і пробував у землї Тоб: і зібрались там круг Ефтая волокити та й ходили за ним». Коли аммонітяни розпочали війну з Гілеадом, старійшини пішли, «щоб узяти Ефтая з Тоб-землї», і він повернувся додому їхнім ватажком і суддею. Через покоління Тов опинився по інший бік: коли аммонітяни образили послів Давида, вони найняли арамеїв Бет-Рехова та Суви, царя Мааха та «з Істоба дванайцять тисяч чоловіка», тобто людей Тову, які стояли з арамеями в полі, а аммонітяни тримали міську браму, доки Йоав їх не розбив. Синодальний переклад зберігає староєврейську форму Іш-Тов як ім’я."
    - "У макавейських війнах юдеїв, що жили в країні Тов, убили їхні сусіди; Друга книга Макавеїв називає юдеїв того краю тубієнами, і дехто пов’язує назву з родом Товіадів, чий палац стоїть в Ірак-ель-Емірі на захід від Аммана, який мапа пропонує як друге, менш імовірне місце. Ет-Тайїба нині — село в провінції Дераа в Сирії, одразу на північ від йорданського кордону."
  es:
    - "La tierra de Tob era un distrito al este del Jordán, al norte de Galaad y hacia el país arameo, donde un proscrito podía vivir fuera del alcance de sus parientes. Suele situarse en torno a et-Taiyibeh, una aldea a unos 15 km al sureste de Daraa, en el sur de Siria, en la llanura del Haurán, cerca de la frontera jordana, que puede conservar el nombre; a menudo se la identifica con una tierra de Tubu en las cartas de Amarna. Nada se ha excavado allí, y la identificación descansa en el nombre y en la posición que requieren los relatos."
    - "«Huyendo pues Jephté á causa de sus hermanos, habitó en tierra de Tob; y juntáronse con él hombres ociosos, los cuales con él salían». Cuando los amonitas hicieron la guerra a Galaad, los ancianos fueron «para volver á Jephté de tierra de Tob», y él regresó como su capitán y juez. Generaciones después, Tob estaba en el otro bando: cuando los amonitas ofendieron a los enviados de David, tomaron a sueldo a los arameos de Bet-rehob y de Soba, al rey de Maaca «y de Is-tob doce mil hombres», es decir, los hombres de Tob, que estuvieron con los arameos en el campo mientras los amonitas guardaban la puerta de la ciudad, hasta que Joab los derrotó. La Biblia sinodal conserva como nombre la forma hebrea Ishtob."
    - "En las guerras macabeas, los judíos que vivían en la tierra de Tob fueron muertos por sus vecinos; Segundo Macabeos llama a los judíos de esa región los tubieni, y algunos relacionan el nombre con la familia tobíada, cuyo palacio se alza en Iraq al-Amir, al oeste de Amán, que el mapa ofrece como segundo emplazamiento, menos probable. Et-Taiyibeh es hoy una aldea de la gobernación de Daraa, en Siria, justo al norte de la frontera jordana."
  pt:
    - "A terra de Tobe era um distrito a leste do Jordão, ao norte de Gileade e em direção ao país arameu, onde um fora da lei podia viver fora do alcance de seus parentes. Costuma ser situada em torno de et-Taiyibeh, aldeia a cerca de 15 km a sudeste de Daraa, no sul da Síria, na planície de Haurã, perto da fronteira jordaniana, que pode conservar o nome; uma terra Tubu nas cartas de Amarna é muitas vezes tomada por ela. Nada foi escavado ali, e a identificação se apoia no nome e na posição que as histórias exigem."
    - "“Então Jefté fugiu de seus irmãos e foi viver na terra de Tobe. Homens vadios juntaram-se a Jefté e saíam com ele.” Quando os amonitas guerrearam contra Gileade, os anciãos foram “buscar Jefté na terra de Tobe”, e ele voltou como seu capitão e juiz. Gerações depois, Tobe estava do outro lado: depois que os amonitas insultaram os enviados de Davi, contrataram os arameus de Bete-Reobe e de Zobá, o rei de Maacá e “os homens de Tobe, doze mil homens”, que ficaram com os arameus no campo enquanto os amonitas guardavam a porta da cidade, até que Joabe os pôs em fuga. A Bíblia Sinodal conserva a forma hebraica Ishtob como nome."
    - "Nas guerras dos macabeus, judeus que viviam na terra de Tobe foram mortos pelos vizinhos; 2 Macabeus chama os judeus dessa região de tubieni, e alguns ligam o nome à família dos tobíadas, cujo palácio se ergue em Iraq al-Amir, a oeste de Amã, que o mapa oferece como segundo sítio, menos provável. Et-Taiyibeh é hoje uma aldeia da província de Daraa, na Síria, logo ao norte da fronteira jordaniana."
  de:
    - "Das Land Tob war ein Gebiet östlich des Jordans, nördlich von Gilead und zum aramäischen Land hin, wo ein Geächteter außerhalb der Reichweite seiner Sippe leben konnte. Man setzt es meist um et-Taiyibeh an, ein Dorf etwa 15 km südöstlich von Daraa in Südsyrien, in der Hauran-Ebene nahe der jordanischen Grenze, das den Namen bewahren könnte; ein Land Tubu in den Amarna-Briefen wird oft damit gleichgesetzt. Dort wurde nichts ausgegraben, und die Gleichsetzung beruht auf dem Namen und der Lage, die die Erzählungen verlangen."
    - "Von Jeftah heißt es: „Da floh er vor seinen Brüdern und wohnte im Lande Tob. Und es sammelten sich zu ihm lose Leute und zogen aus mit ihm.“ Als die Ammoniter gegen Gilead Krieg führten, gingen die Ältesten hin, „daß sie Jephthah holten aus dem Lande Tob“, und er kam als ihr Hauptmann und Richter heim. Generationen später stand Tob auf der anderen Seite: Nachdem die Ammoniter Davids Boten beleidigt hatten, dingten sie die Aramäer von Bet-Rehob und Zoba, den König von Maacha „und von Is-Tob zwölftausend Mann“, also die Männer von Tob, die mit den Aramäern im Feld standen, während die Ammoniter das Stadttor hielten, bis Joab sie schlug. Die Synodalbibel behält die hebräische Form Ischtob als Namen bei."
    - "In den Makkabäerkriegen wurden Juden, die im Land Tob lebten, von ihren Nachbarn getötet; das Zweite Makkabäerbuch nennt die Juden jener Gegend die Tubieni, und manche verbinden den Namen mit der Familie der Tobiaden, deren Palast in Iraq al-Amir westlich von Amman steht, was die Karte als zweiten, weniger wahrscheinlichen Ort anbietet. Et-Taiyibeh ist heute ein Dorf im Gouvernement Daraa in Syrien, unmittelbar nördlich der jordanischen Grenze."
  fr:
    - "Le pays de Tob était un district à l’est du Jourdain, au nord de Galaad et vers le pays araméen, où un hors-la-loi pouvait vivre hors d’atteinte des siens. On le place d’ordinaire autour d’et-Taiyibeh, village à quelque 15 km au sud-est de Deraa, dans le sud de la Syrie, dans la plaine du Havran près de la frontière jordanienne, qui en garde peut-être le nom ; un pays Tubu des lettres d’Amarna lui est souvent identifié. Rien n’y a été fouillé, et l’identification repose sur le nom et sur la position qu’exigent les récits."
    - "« Jephthé s’enfuit loin de ses frères, et il habita dans le pays de Tob. Des gens de rien se rassemblèrent auprès de Jephthé, et ils faisaient avec lui des excursions. » Quand les Ammonites firent la guerre à Galaad, les anciens allèrent « chercher Jephthé au pays de Tob », et il revint comme leur chef et juge. Des générations plus tard, Tob était de l’autre côté : après avoir insulté les envoyés de David, les Ammonites engagèrent les Araméens de Beth-Rehob et de Tsoba, mille hommes chez le roi de Maaca « et douze mille hommes chez les gens de Tob », c’est-à-dire les hommes de Tob, qui se tinrent avec les Araméens dans la campagne, tandis que les Ammonites tenaient la porte de la ville, jusqu’à ce que Joab les mette en déroute. La Bible synodale garde la forme hébraïque Ish-Tob comme un nom."
    - "Dans les guerres maccabéennes, des Juifs du pays de Tob furent tués par leurs voisins ; le deuxième livre des Maccabées appelle les Juifs de cette région les Tubieni, et certains rattachent le nom à la famille des Tobiades, dont le palais se dresse à Iraq al-Amir, à l’ouest d’Amman, que la carte propose comme second site, moins probable. Et-Taiyibeh est aujourd’hui un village du gouvernorat de Deraa, en Syrie, juste au nord de la frontière jordanienne."
  pl:
    - "Kraj Tob był okręgiem na wschód od Jordanu, na północ od Gileadu i ku krainie aramejskiej, gdzie banita mógł żyć poza zasięgiem swojej rodziny. Umieszcza się go zwykle wokół et-Tajjiba, wsi, która może zachowywać nazwę, około 15 km na południowy wschód od Dary w południowej Syrii, na równinie Hauranu blisko granicy jordańskiej; kraj Tubu w listach z Amarna bierze się często za niego. Niczego tam nie wykopano, a utożsamienie opiera się na nazwie i na położeniu, jakiego wymagają opowieści."
    - "„Uciekł tedy Jefte przed bracią swoją, a mieszkał w ziemi Tob: i zebrali się do niego ludzie ogołoceni, i poszli z nim.” Gdy Ammonici wszczęli wojnę z Gileadem, starsi poszli, „aby wzięli Jeftego z ziemi Tob”, a on wrócił do domu jako ich wódz i sędzia. Pokolenia później Tob stał po drugiej stronie: gdy Ammonici znieważyli posłów Dawida, najęli Aramejczyków z Bet-Rechob i Soby, króla Maaki „a od Istoba dwanaście tysięcy mężów”, to znaczy ludzi z Tob, którzy stali z Aramejczykami w polu, gdy Ammonici trzymali bramę miasta, aż Joab ich rozgromił. Biblia synodalna zachowuje tu hebrajską formę Isztob jako imię."
    - "W wojnach machabejskich Żydzi mieszkający w kraju Tob byli zabijani przez sąsiadów; Druga Księga Machabejska nazywa Żydów tego regionu Tubianami, a niektórzy łączą tę nazwę z rodem Tobiadów, którego pałac stoi w Irak al-Amir na zachód od Ammanu, co mapa podaje jako drugie, mniej prawdopodobne stanowisko. Et-Tajjiba jest dziś wsią w muhafazie Dara w Syrii, tuż na północ od granicy jordańskiej."
  it:
    - "Il paese di Tob era un distretto a est del Giordano, a nord di Galaad e verso il paese aramaico, dove un fuorilegge poteva vivere fuori della portata dei parenti. Di solito lo si colloca attorno a et-Taiyibeh, un villaggio a circa 15 km a sud-est di Daraa, nella Siria meridionale, nella piana dell’Auran presso il confine giordano, che può conservarne il nome; un paese Tubu nelle lettere di Amarna è spesso ritenuto lo stesso. Nulla vi è stato scavato, e l’identificazione poggia sul nome e sulla posizione richiesta dai racconti."
    - "«E Jefte se ne fuggì lungi dai suoi fratelli e si stabilì nel paese di Tob. Degli uomini da nulla si raccolsero attorno a Jefte, e facevano delle incursioni con lui.» Quando gli Ammoniti mossero guerra a Galaad, gli anziani «andarono a cercare Jefte nel paese di Tob», ed egli tornò come loro capo e giudice. Generazioni dopo Tob era dall’altra parte: quando gli Ammoniti ebbero insultato gli inviati di Davide, presero al loro soldo gli Aramei di Bet-Recob e di Zoba, mille uomini del re di Maaca e «dodicimila uomini della gente di Tob», che stettero con gli Aramei in campo mentre gli Ammoniti tenevano la porta della città, finché Ioab li sbaragliò. La Bibbia sinodale mantiene la forma ebraica Ishtob come nome."
    - "Nelle guerre maccabaiche i Giudei che vivevano nel paese di Tob furono uccisi dai vicini; il Secondo libro dei Maccabei chiama i Giudei di quella regione Tubieni, e alcuni collegano il nome con la famiglia dei Tobiadi il cui palazzo sorge a Iraq al-Amir a ovest di Amman, che la mappa offre come secondo sito, meno probabile. Et-Taiyibeh è oggi un villaggio del governatorato siriano di Daraa, appena a nord del confine giordano."
  nl:
    - "Het land Tob was een district ten oosten van de Jordaan, ten noorden van Gilead en richting het Arameese land, waar een vogelvrije buiten het bereik van zijn verwanten kon leven. Het wordt gewoonlijk geplaatst rond et-Taiyibeh, een dorp zo’n 15 km ten zuidoosten van Daraa in het zuiden van Syrië, in de Hauran-vlakte bij de Jordaanse grens, dat de naam mogelijk bewaart; een land Tubu in de Amarnabrieven wordt vaak ermee gelijkgesteld. Er is niets opgegraven, en de gelijkstelling berust op de naam en op de ligging die de verhalen vereisen."
    - "“Toen vlood Jeftha voor het aangezicht zijner broederen, en woonde in het land Tob; en ijdele mannen vergaderden zich tot Jeftha, en togen met hem uit.” Toen de Ammonieten oorlog voerden tegen Gilead, gingen de oudsten “om Jeftha te halen uit het land van Tob”, en hij kwam thuis als hun aanvoerder en richter. Generaties later stond Tob aan de andere kant: nadat de Ammonieten de gezanten van David hadden beledigd, huurden zij de Arameeërs van Beth-Rechob en Soba, de koning van Maächa “duizend man, en van de mannen van Tob twaalf duizend man”, dat wil zeggen de mannen van Tob, die samen met de Arameeërs in het veld stonden terwijl de Ammonieten de stadspoort bezet hielden, totdat Joab hen versloeg. De Synodale Bijbel behoudt daar de Hebreeuwse vorm Ishtob als naam."
    - "In de Makkabeese oorlogen werden Joden die in het land Tob woonden door hun buren gedood; 2 Makkabeeën noemt de Joden van die streek de Tubieni, en sommigen verbinden de naam met de familie van de Tobiaden, wier paleis staat bij Iraq al-Amir ten westen van Amman, dat de kaart als tweede, minder waarschijnlijke plek aanbiedt. Et-Taiyibeh is tegenwoordig een dorp in het gouvernement Daraa van Syrië, net ten noorden van de Jordaanse grens."
  cs:
    - "Země Tób byla oblast východně od Jordánu, severně od Gileadu a směrem k aramejské zemi, kde mohl psanec žít mimo dosah svých příbuzných. Obvykle se klade kolem et-Tajjiby, vesnice asi 15 km jihovýchodně od Dar'á v jižní Sýrii, v planině Havran poblíž jordánské hranice, která může jméno uchovávat; země Tubu v amarnských listech bývá pokládána za ni. Nic tam nebylo vykopáno a ztotožnění stojí na jménu a na poloze, kterou příběhy vyžadují."
    - "V Knize Soudců: „Protož utekl Jefte od tváři bratří svých, a bydlil v zemi Tob; a sběhli se k Jefte lidé povaleči, a vycházeli s ním.“ Když Amónci začali válčit s Gileadem, odešli starší, „aby zase přivedli Jefte z země Tob“, a on se vrátil domů jako jejich vůdce a soudce. O generace později byl Tób na druhé straně: když Amónci urazili Davidovy posly, najali Aramejce z Bét-rechobu a Sóby, krále Maaky a „od Istoba dvanácte tisíc mužů“, tedy muže z Tóbu, kteří stáli s Aramejci v poli, zatímco Amónci drželi městskou bránu, dokud je Joáb nerozprášil. Synodální překlad uchovává hebrejskou podobu Ištob jako jméno."
    - "V makabejských válkách byli Židé žijící v zemi Tób zabíjeni svými sousedy; Druhá kniha Makabejská nazývá Židy onoho kraje Tubieni a někteří spojují jméno s rodem Tobiovců, jehož palác stojí v Irák al-Amír západně od Ammánu, který mapa nabízí jako druhé, méně pravděpodobné místo. Et-Tajjiba je dnes vesnice v guvernorátu Dar'á v Sýrii, těsně severně od jordánské hranice."
  sv:
    - "Landet Tov var ett distrikt öster om Jordan, norr om Gilead och mot det arameiska landet, där en fredlös kunde leva utom räckhåll för sin släkt. Det förläggs vanligen till trakten kring et-Taiyibeh, en by omkring 15 km sydost om Daraa i södra Syrien, på Hauranslätten nära den jordanska gränsen, som kan bevara namnet; ett land Tubu i Amarnabreven anses ofta vara detsamma. Inget har grävts ut där, och identifieringen vilar på namnet och på det läge som berättelserna kräver."
    - "”Då flydde Jefta bort ifrån sina bröder och bosatte sig i landet Tob; där sällade sig löst folk till Jefta och gjorde strövtåg med honom.” När ammoniterna gick i krig med Gilead gick de äldste åstad ”för att hämta Jefta från landet Tob”, och han kom hem som deras anförare och domare. Generationer senare stod Tov på andra sidan: när ammoniterna hade förolämpat Davids sändebud lejde de araméerna från Bet-Rehov och Sova, kungen av Maaka och ”av Tobs män tolv tusen”, det vill säga männen från Tov, som stod med araméerna på fältet medan ammoniterna höll stadsporten, tills Joav slog dem på flykt. Den synodala bibeln behåller den hebreiska formen Ishtob som namn."
    - "Under makkabeerkrigen dödades judar som bodde i landet Tov av sina grannar; Andra Mackabeerboken kallar judarna i den trakten tubienerna, och några förbinder namnet med tobiadfamiljen vars palats står vid Iraq al-Amir väster om Amman, som kartan erbjuder som en andra, mindre sannolik plats. Et-Taiyibeh är i dag en by i guvernementet Daraa i Syrien, strax norr om den jordanska gränsen."
  nb:
    - "Landet Tob var et distrikt øst for Jordan, nord for Gilead og mot det arameiske landet, der en lovløs kunne leve utenfor slektens rekkevidde. Det plasseres vanligvis omkring et-Taiyibeh, en landsby omkring 15 km sørøst for Daraa i det sørlige Syria, på Havran-sletten nær den jordanske grensen, som kan bevare navnet; et land Tubu i Amarna-brevene regnes ofte for å være det. Ingenting er utgravd der, og identifikasjonen hviler på navnet og på den beliggenheten fortellingene krever."
    - "«Da flyktet Jefta for sine brødre og bosatte sig i landet Tob; og der samlet sig en flokk løse menn om Jefta og var med ham på hans tog.» Da ammonittene gikk til krig mot Gilead, gikk de eldste «for å hente Jefta fra landet Tob», og han kom hjem som deres fører og dommer. Generasjoner senere var Tob på den andre siden: da ammonittene hadde krenket Davids sendebud, leide de arameerne fra Bet-Rehob og Soba, kongen i Maaka «med tusen mann og tolv tusen mann fra Tob», hebraisk Ish-tob, det vil si mennene fra Tob, som sto sammen med arameerne på marken mens ammonittene holdt byporten, til Joab slo dem på flukt. Synodalbibelen beholder den hebraiske formen Ishtob som navn."
    - "I makkabeerkrigene ble jøder som bodde i landet Tob drept av naboene sine; Andre Makkabeerbok kaller jødene i den regionen tubieni, og noen knytter navnet til tobiadefamilien, hvis palass står ved Iraq al-Amir vest for Amman, som kartet tilbyr som et annet, mindre sannsynlig sted. Et-Taiyibeh er i dag en landsby i Daraa-guvernementet i Syria, like nord for den jordanske grensen."
  tl:
    - "Ang lupain ng Tob ay distrito sa silangan ng Jordan, hilaga ng Gilead at patungo sa lupain ng mga Arameo, kung saan maaaring manirahan ang isang tampalasan na hindi maabot ng kaniyang kamag-anak. Karaniwan itong inilalagay sa paligid ng et-Taiyibeh, nayon mga 15 km sa timog-silangan ng Daraa sa timog Siria, sa kapatagan ng Hauran malapit sa hangganan ng Jordan, na maaaring nagpapanatili ng pangalan; ang lupaing Tubu sa mga sulat ng Amarna ay madalas na itinuturing na ito. Walang hinukay roon, at nakasalalay ang pagkakakilanlan sa pangalan at sa posisyong hinihingi ng mga kuwento."
    - "“Nang magkagayo'y tumakas si Jephte sa harap ng kaniyang mga kapatid, at tumahan sa lupain ng Tob: at doo'y nakipisan kay Jephte ang mga lalaking walang kabuluhan, at nagsilabas na kasama niya.” Nang lumaban ang mga Ammonita sa Gilead, ang mga matanda ay naparoon “upang sunduin si Jephte mula sa lupain ng Tob”, at umuwi siya bilang kanilang kapitan at hukom. Pagkaraan ng mga salinlahi, nasa kabilang panig na ang Tob: nang insultuhin ng mga Ammonita ang mga sugo ni David, inupahan nila ang mga Arameo ng Bethrehob at Soba, ang hari ng Maaca at “ang mga lalaking taga Tob na labing dalawang libong lalake”, na tumayo kasama ng mga Arameo sa parang habang hawak ng mga Ammonita ang pintuan ng lunsod, hanggang talunin sila ni Joab. Pinananatili ng Bibliyang Synodal ang anyong Hebreo na Ishtob bilang pangalan."
    - "Sa mga digmaan ng mga Macabeo, pinatay ng mga kapitbahay ang mga Judiong nakatira sa lupain ng Tob; tinatawag ng Ikalawang Macabeo ang mga Judio ng rehiyong iyon na Tubieni, at iniuugnay ng ilan ang pangalan sa pamilyang Tobiad na ang palasyo ay nasa Iraq al-Amir sa kanluran ng Amman, na iniaalok ng mapa bilang ikalawa at mas di-malamang na pook. Ang et-Taiyibeh ngayon ay nayon ng lalawigan ng Daraa ng Siria, sa hilaga lamang ng hangganan ng Jordan."
  da:
    - "Landet Tob var et distrikt øst for Jordan, nord for Gilead og mod det arameiske land, hvor en fredløs kunne leve uden for sine slægtninges rækkevidde. Det placeres sædvanligvis omkring et-Taiyibeh, en landsby omkring 15 km sydøst for Daraa i det sydlige Syrien, på Hauran-sletten nær den jordanske grænse, som kan have bevaret navnet; et land Tubu i Amarna-brevene tages ofte for det. Intet er udgravet dér, og identifikationen hviler på navnet og på den placering, historierne kræver."
    - "»Da flyede Jeftha fra sine Brødres Ansigt og boede i Landet Tob; og der samlede sig til Jeftha løse Mænd, og de droge ud med ham.« Da ammonitterne førte krig mod Gilead, gik de ældste »hen at hente Jeftha fra Landet Tob«, og han kom hjem som deres anfører og dommer. Generationer senere stod Tob på den anden side: da ammonitterne havde fornærmet Davids sendebud, lejede de arameerne fra Bet-Rehob og Soba, kongen af Maaka og »Mændene af Tob, tolv Tusinde Mand«, altså Tobs mænd, som stod sammen med arameerne på marken, mens ammonitterne holdt byens port, indtil Joab slog dem på flugt. Synodalbibelen bevarer den hebraiske form Ishtob som et navn."
    - "I makkabæerkrigene blev jøder, der boede i Tobs land, dræbt af deres naboer; Anden Makkabæerbog kalder jøderne i den egn tubienerne, og nogle sætter navnet i forbindelse med Tobiaderne, hvis palads står ved Iraq al-Amir vest for Amman, som kortet byder som et andet, mindre sandsynligt sted. Et-Taiyibeh er i dag en landsby i guvernementet Daraa i Syrien, lige nord for den jordanske grænse."
  sr:
    - "Земља Тов била је област источно од Јордана, северно од Галада и према арамејској земљи, где је одметник могао живети ван домашаја свог рода. Обично се смешта око ет Таибе, села неких 15 км југоисточно од Дараа у јужној Сирији, на равници Авран близу јорданске границе, које можда чува име; земља Туб у амарнским писмима често се узима за њу. Ништа онде није ископано, а поистовећење почива на имену и на положају који приче захтевају."
    - "„Зато побеже Јефтај од браће своје, и настани се у земљи Тову; и стекоше се к њему људи празнови, и иђаху с њим.“ Када су Амонци заратили на Галад, старешине су отишле „да доведу Јефтаја из земље Това“, и он се вратио кући као њихов заповедник и судија. Нараштаје касније Тов је био на другој страни: пошто су Амонци увредили Давидове посланике, најмили су Арамејце из Вет-Реова и Сове, цара од Махе, „и од Ис-Това дванаест хиљада људи“, то јест људе из Това, који су стајали с Арамејцима у пољу док су Амонци држали градску капију, све док их Јоав није разбио. Руска синодална Библија чува хебрејски облик Иштов као име."
    - "У макавејским ратовима Јевреје који су живели у земљи Тов побили су њихови суседи; Друга књига о Макавејима зове Јевреје тог краја Тубијенима, а неки име повезују с породицом Товијада чија палата стоји у Ирак ел Амиру западно од Амана, који карта нуди као друго, мање вероватно налазиште. Ет Таибе је данас село у гувернорату Дараа у Сирији, одмах северно од јорданске границе."
  hu:
    - "Tób földje a Jordánon túli kerület volt, Gileádtól északra, az arám ország felé, ahol egy törvényen kívüli rokonai karján kívül élhetett. Általában et-Tajjibe körül keresik, egy Dar'ától mintegy 15 km-re délkeletre fekvő falu körül Dél-Szíriában, a Hauran síkságán a jordán határ közelében, amely megőrizhette a nevet; az amarnai levelek Tubu földjét gyakran vele azonosítják. Semmit sem ástak ki ott, és az azonosítás a néven és a történetek által megkívánt fekvésen alapul."
    - "„És elfutott Jefte az ő atyjafiai elől, és Tób földén telepedett meg, és henyélő emberek gyűltek össze Jefte körül, és együtt portyáztak.” Amikor az ammoniták háborút indítottak Gileád ellen, a vének elmentek, „hogy visszahozzák Jeftét a Tób földéről”, és ő vezérükként és bírájukként tért haza. Nemzedékekkel később Tób a másik oldalon állt: amikor az ammoniták megsértették Dávid követeit, felfogadták Bét-Rehób és Cóbá arámjait, Maaka királyát „és a Tóbbelieket, tizenkétezer embert”, vagyis Tób embereit, akik az arámokkal együtt a mezőn álltak, míg az ammoniták a városkaput tartották, míg Joáb szét nem verte őket. Az orosz szinodális Biblia a héber Is-Tób alakot névként megtartja."
    - "A makkabeusi háborúkban a Tób földjén élő zsidókat szomszédaik megölték; a Makkabeusok második könyve a térség zsidóit tubienieknek nevezi, és egyesek a nevet a Tobiád családdal hozzák kapcsolatba, amelynek palotája Irák el-Amírnál áll Ammántól nyugatra, amelyet a térkép második, kevésbé valószínű helyként kínál. Et-Tajjibe ma Szíria Dar'á kormányzóságának faluja, közvetlenül a jordán határtól északra."
  fi:
    - "Tobin maa oli Jordanin itäpuolinen seutu Gileadista pohjoiseen aramilaismaata kohti, missä lainsuojaton saattoi elää sukulaistensa ulottumattomissa. Se sijoitetaan yleensä et-Taiyibehin ympärille, kylään noin 15 km Daraasta kaakkoon Etelä-Syyriassa Haurannin tasangolla lähellä Jordanian rajaa; kylä voi säilyttää nimen, ja Amarna-kirjeiden Tubu-maan katsotaan usein olevan sama. Siellä ei ole kaivettu mitään, ja tunnistus perustuu nimeen ja kertomusten edellyttämään asemaan."
    - "”Niin Jefta lähti pakoon veljiänsä ja asettui Toobin maahan. Ja Jeftan luo kerääntyi tyhjäntoimittajia, ja ne retkeilivät yhdessä hänen kanssaan.” Kun ammonilaiset sotivat Gileadia vastaan, vanhimmat lähtivät ”noutamaan Jeftaa Toobin maasta”, ja hän palasi kotiin päällikkönä ja tuomarina. Sukupolvia myöhemmin Tob oli toisella puolella: kun ammonilaiset olivat loukanneet Daavidin lähettiläitä, he palkkasivat Bet-Rehobin ja Soban aramilaiset sekä Maakan kuninkaalta tuhat miestä ”ja Toobin miehiä kaksitoista tuhatta”, eli Tobin miehet, jotka seisoivat aramilaisten rinnalla kentällä ammonilaisten pitäessä kaupungin porttia, kunnes Joab löi heidät. Venäjän synodaalinen Raamattu säilyttää heprealaisen muodon Ish-tob nimenä."
    - "Makkabeussodissa Tobin maassa asuvia juutalaisia tapettiin naapurien toimesta; Toinen Makkabeuskirja kutsuu seudun juutalaisia tubieneiksi, ja jotkut yhdistävät nimen tobiadien sukuun, jonka palatsi on Iraq al-Amirissa Ammanista länteen; kartta tarjoaa sitä toisena, epätodennäköisempänä paikkana. Et-Taiyibeh on nykyisin kylä Syyrian Daraan kuvernementissa, aivan Jordanian rajan pohjoispuolella."
  vi:
    - "Xứ Tóp là một vùng phía đông sông Giô-đanh, phía bắc Ga-la-át và hướng về xứ người A-ram, nơi một kẻ ngoài vòng pháp luật có thể sống ngoài tầm với của họ hàng. Nó thường được đặt quanh et-Taiyibeh, một làng cách Daraa ở nam Sy-ri khoảng 15 km về phía đông nam, trong đồng bằng Ha-vơ-ran gần biên giới Jordan, có thể còn giữ tên cũ; một xứ Tubu trong các thư Amarna thường được coi là nơi này. Chưa có gì được khai quật ở đó, và sự đồng nhất dựa vào tên gọi và vị trí mà các câu chuyện đòi hỏi."
    - "“Vậy, Giép-thê trốn xa anh em mình, và ở trong xứ Tóp. Có những đứa du đãng hiệp lại chung quanh Giép-thê, và đi ra với người.” Khi dân Am-môn đánh Ga-la-át, các trưởng lão “đi đem Giép-thê ở xứ Tóp về”, và ông trở về làm tướng và quan xét của họ. Nhiều đời sau, Tóp ở phía bên kia: khi dân Am-môn xúc phạm các sứ giả của Đa-vít, họ thuê người A-ram ở Bết-Rê-hóp và Xô-ba, vua Ma-a-ca “và một vạn hai ngàn người ở xứ Tóp”, tức người Tóp, đứng cùng người A-ram ngoài đồng trong khi dân Am-môn giữ cổng thành, cho đến khi Giô-áp đánh tan họ. Bản Synodal giữ dạng Hê-bơ-rơ Ishtob như một tên riêng."
    - "Trong các cuộc chiến Maccabee, người Do Thái sống ở xứ Tóp bị láng giềng giết; sách 2 Maccabee gọi người Do Thái vùng ấy là Tubieni, và một số người liên hệ tên này với gia tộc Tobiad mà cung điện đứng tại Iraq al-Amir phía tây Amman, mà bản đồ đưa ra như địa điểm thứ hai, ít có khả năng hơn. Et-Taiyibeh ngày nay là một làng của tỉnh Daraa của Sy-ri, ngay phía bắc biên giới Jordan."
  ro:
    - "Țara Tob era un district la est de Iordan, la nord de Galaad și spre ținutul arameilor, unde un proscris putea trăi la adăpost de rudele sale. Este așezată de obicei în jurul satului et-Taiyibeh, la circa 15 km sud-est de Daraa, în sudul Siriei, în câmpia Hauran, aproape de granița cu Iordania, care ar putea păstra numele; un ținut Tubu din scrisorile de la Amarna este adesea socotit același. Nimic nu a fost săpat acolo, iar identificarea se sprijină pe nume și pe poziția pe care o cer povestirile."
    - "„Și a fugit Ieftae dela fața fraților săi, și a lăcuit în pământul Tov, și s’au adunat la Ieftae oameni făcători de rău, și au ieșit cu el.” Când amoniții au pornit război împotriva Galaadului, bătrânii au mers „să ia pre Ieftae din pământul Tov”, iar el s-a întors acasă drept căpetenie și judecător. Generații mai târziu, Tob era de partea cealaltă: după ce amoniții i-au batjocorit pe solii lui David, ei i-au tocmit pe arameii din Bet-Rehob și Țoba, pe regele Maaca „și dela Istov douăsprezece mii de oameni”, adică oamenii din Tob, care au stat cu arameii în câmp, în timp ce amoniții țineau poarta cetății, până când Ioab i-a zdrobit. Biblia sinodală rusă păstrează forma ebraică Ishtob ca nume."
    - "În războaiele macabeene, iudeii care trăiau în țara Tob au fost uciși de vecinii lor; 2 Macabei îi numește pe iudeii din acea regiune Tubieni, iar unii leagă numele de familia tobiazilor, al cărei palat se află la Iraq al-Amir, la vest de Amman, pe care harta îl oferă ca al doilea loc, mai puțin probabil. Et-Taiyibeh este astăzi un sat din guvernoratul Daraa al Siriei, chiar la nord de granița cu Iordania."
  bg:
    - "Земята Тов била област източно от Йордан, северно от Галаад и към арамейската страна, където един изгнаник можел да живее извън досега на сродниците си. Обикновено се поставя около ет-Тайибе — село на около 15 км югоизточно от Дараа в Южна Сирия, в равнината Хауран близо до йорданската граница, което може би пази името; земя Тубу в писмата от Амарна често се смята за нея. Там нищо не е разкопавано, а отъждествяването почива на името и на положението, което изискват разказите."
    - "„И побягна Иефтай от лицето на братята си та се насели в земята Тов; и събраха се при Иефтая человеци безделници та излазяха с него.“ Когато амонците воювали срещу Галаад, старейшините отишли „да вземат със себе си Иефтая от земята Тов“ и той се върнал у дома като техен началник и съдия. Поколения по-късно Тов бил на другата страна: когато амонците оскърбили пратениците на Давид, те наели арамейците от Бет-Рехов и Сува, царя на Маха и дванадесет хиляди мъже от Иш-Тов, тоест мъжете от Тов, които стояли с арамейците на полето, докато амонците държали градската порта; Йоав обаче ги разбил. Руската Синодална Библия запазва еврейската форма Иштов като име."
    - "По време на Макавейските войни юдеи, живеещи в земята Тов, били избити от съседите си; Втора книга Макавейска нарича юдеите от тази област тубиени, а някои свързват името с рода на Товиадите, чийто дворец стои при Ирак ал-Амир западно от Аман и който картата предлага като второ, по-малко вероятно място. Днес ет-Тайибе е село в губернаторство Дараа в Сирия, точно северно от йорданската граница."
