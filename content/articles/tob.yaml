body:
  en:
    - "The land of Tob was a district east of the Jordan, north of Gilead and towards the Aramaean country, where an outlaw could live beyond the reach of his kin. It is usually placed around et-Taiyibeh, a village some 15 km south-east of Daraa in southern Syria, in the Hauran plain near the Jordanian border, which may keep the name; a land Tubu in the Amarna letters is often taken for it. Nothing has been excavated there, and the identification rests on the name and on the position the stories require."
    - "“Then Jephthah fled from his brethren, and dwelt in the land of Tob: and there were gathered vain men to Jephthah, and went out with him.” When the Ammonites made war on Gilead the elders went “to fetch Jephthah out of the land of Tob”, and he came home as their captain and judge. Generations later Tob was on the other side: when the Ammonites had insulted David's envoys, they hired the Aramaeans of Beth-rehob and Zobah, the king of Maacah “and of Ish-tob twelve thousand men”, that is the men of Tob, who stood with the Aramaeans in the field before Rabbah until Joab routed them. The Synodal Bible keeps the Hebrew form Ishtob as a name."
    - "In the Maccabean wars Jews living in the land of Tob were killed by their neighbours; Second Maccabees calls the Jews of that region the Tubieni, and some connect the name with the Tobiad family whose palace stands at Iraq al-Amir west of Amman, which the map offers as a second, less likely site. Et-Taiyibeh today is a village of the Daraa governorate of Syria, just north of the Jordanian border."
  ru:
    - "Земля Тов — область к востоку от Иордана, севернее Галаада, в сторону арамейских земель, где изгнанник мог жить вне досягаемости родни. Её обычно помещают вокруг Эт-Тайибе, селения примерно в 15 км к юго-востоку от Дераа на юге Сирии, на Хауранской равнине близ иорданской границы, которое, возможно, хранит имя; землю Туву в письмах из Амарны часто принимают за неё. Раскопок там не было, и отождествление держится на имени и на положении, которого требуют рассказы."
    - "«И убежал Иеффай от братьев своих и жил в земле Тов; и собрались к Иеффаю праздные люди и выходили с ним». Когда Аммонитяне пошли войной на Галаад, старейшины пришли «взять Иеффая из земли Тов», и он вернулся домой их вождём и судьёй. Поколения спустя Тов оказался на другой стороне: оскорбив послов Давида, Аммонитяне наняли Сирийцев из Беф-Рехова и Сувы, царя Маахи «и из Истова двенадцать тысяч человек», то есть людей Това, и те стояли с Сирийцами в поле перед Раввой, пока Иоав не обратил их в бегство. Синодальный перевод сохраняет еврейскую форму Истов как имя."
    - "В Маккавейских войнах иудеев, живших в земле Тов, перебили соседи; Вторая книга Маккавейская зовёт иудеев того края тувиенами, и некоторые связывают это имя с родом Товиадов, чей дворец стоит в Ирак-эль-Амире к западу от Аммана, — на карте он предложен как второе, менее вероятное место. Эт-Тайибе сегодня — селение в мухафазе Дераа в Сирии, чуть севернее иорданской границы."
  uk:
    - "Країна Тов була округою на схід від Йордану, на північ від Гілеаду та в бік арамейського краю, де вигнанець міг жити поза досяжністю родичів. Її зазвичай розміщують навколо ет-Тайїби, села приблизно за 15 км на південний схід від Дераа на півдні Сирії, на рівнині Хавран біля йорданського кордону, яке, можливо, зберігає назву; країну Тубу в листах з Амарни часто ототожнюють із нею. Там нічого не розкопано, і ототожнення спирається на назву й на положення, якого вимагають розповіді."
    - "«От і зник Ефтай од братів своїх, і пробував у землї Тоб: і зібрались там круг Ефтая волокити та й ходили за ним». Коли аммонітяни розпочали війну з Гілеадом, старійшини пішли, «щоб узяти Ефтая з Тоб-землї», і він повернувся додому їхнім ватажком і суддею. Через покоління Тов опинився по інший бік: коли аммонітяни образили послів Давида, вони найняли арамеїв Бет-Рехова та Суви, царя Мааха та «з Істоба дванайцять тисяч чоловіка», тобто людей Тову, які стояли з арамеями в полі перед Раввою, доки Йоав їх не розбив. Синодальний переклад зберігає староєврейську форму Іш-Тов як ім’я."
    - "У макавейських війнах юдеїв, що жили в країні Тов, убили їхні сусіди; Друга книга Макавеїв називає юдеїв того краю тубієнами, і дехто пов’язує назву з родом Товіадів, чий палац стоїть в Ірак-ель-Емірі на захід від Аммана, який мапа пропонує як друге, менш імовірне місце. Ет-Тайїба нині — село в провінції Дераа в Сирії, одразу на північ від йорданського кордону."
  es:
    - "La tierra de Tob era un distrito al este del Jordán, al norte de Galaad y hacia el país arameo, donde un proscrito podía vivir fuera del alcance de sus parientes. Suele situarse en torno a et-Taiyibeh, una aldea a unos 15 km al sureste de Daraa, en el sur de Siria, en la llanura del Haurán, cerca de la frontera jordana, que puede conservar el nombre; a menudo se la identifica con una tierra de Tubu en las cartas de Amarna. Nada se ha excavado allí, y la identificación descansa en el nombre y en la posición que requieren los relatos."
    - "«Huyendo pues Jephté á causa de sus hermanos, habitó en tierra de Tob; y juntáronse con él hombres ociosos, los cuales con él salían». Cuando los amonitas hicieron la guerra a Galaad, los ancianos fueron «para volver á Jephté de tierra de Tob», y él regresó como su capitán y juez. Generaciones después, Tob estaba en el otro bando: cuando los amonitas ofendieron a los enviados de David, tomaron a sueldo a los arameos de Bet-rehob y de Soba, al rey de Maaca «y de Is-tob doce mil hombres», es decir, los hombres de Tob, que estuvieron con los arameos en el campo ante Rabá hasta que Joab los derrotó. La Biblia sinodal conserva como nombre la forma hebrea Ishtob."
    - "En las guerras macabeas, los judíos que vivían en la tierra de Tob fueron muertos por sus vecinos; Segundo Macabeos llama a los judíos de esa región los tubieni, y algunos relacionan el nombre con la familia tobíada, cuyo palacio se alza en Iraq al-Amir, al oeste de Amán, que el mapa ofrece como segundo emplazamiento, menos probable. Et-Taiyibeh es hoy una aldea de la gobernación de Daraa, en Siria, justo al norte de la frontera jordana."
  pt:
    - "A terra de Tobe era um distrito a leste do Jordão, ao norte de Gileade e em direção ao país arameu, onde um fora da lei podia viver fora do alcance de seus parentes. Costuma ser situada em torno de et-Taiyibeh, aldeia a cerca de 15 km a sudeste de Daraa, no sul da Síria, na planície de Haurã, perto da fronteira jordaniana, que pode conservar o nome; uma terra Tubu nas cartas de Amarna é muitas vezes tomada por ela. Nada foi escavado ali, e a identificação se apoia no nome e na posição que as histórias exigem."
    - "“Então Jefté fugiu de seus irmãos e foi viver na terra de Tobe. Homens vadios juntaram-se a Jefté e saíam com ele.” Quando os amonitas guerrearam contra Gileade, os anciãos foram “buscar Jefté na terra de Tobe”, e ele voltou como seu capitão e juiz. Gerações depois, Tobe estava do outro lado: depois que os amonitas insultaram os enviados de Davi, contrataram os arameus de Bete-Reobe e de Zobá, o rei de Maacá e “os homens de Tobe, doze mil homens”, que ficaram com os arameus no campo diante de Rabá até que Joabe os pôs em fuga. A Bíblia Sinodal conserva a forma hebraica Ishtob como nome."
    - "Nas guerras dos macabeus, judeus que viviam na terra de Tobe foram mortos pelos vizinhos; 2 Macabeus chama os judeus dessa região de tubieni, e alguns ligam o nome à família dos tobíadas, cujo palácio se ergue em Iraq al-Amir, a oeste de Amã, que o mapa oferece como segundo sítio, menos provável. Et-Taiyibeh é hoje uma aldeia da província de Daraa, na Síria, logo ao norte da fronteira jordaniana."
  de:
    - "Das Land Tob war ein Gebiet östlich des Jordans, nördlich von Gilead und zum aramäischen Land hin, wo ein Geächteter außerhalb der Reichweite seiner Sippe leben konnte. Man setzt es meist um et-Taiyibeh an, ein Dorf etwa 15 km südöstlich von Daraa in Südsyrien, in der Hauran-Ebene nahe der jordanischen Grenze, das den Namen bewahren könnte; ein Land Tubu in den Amarna-Briefen wird oft damit gleichgesetzt. Dort wurde nichts ausgegraben, und die Gleichsetzung beruht auf dem Namen und der Lage, die die Erzählungen verlangen."
    - "Von Jeftah heißt es: „Da floh er vor seinen Brüdern und wohnte im Lande Tob. Und es sammelten sich zu ihm lose Leute und zogen aus mit ihm.“ Als die Ammoniter gegen Gilead Krieg führten, gingen die Ältesten hin, „daß sie Jephthah holten aus dem Lande Tob“, und er kam als ihr Hauptmann und Richter heim. Generationen später stand Tob auf der anderen Seite: Nachdem die Ammoniter Davids Boten beleidigt hatten, dingten sie die Aramäer von Bet-Rehob und Zoba, den König von Maacha „und von Is-Tob zwölftausend Mann“, also die Männer von Tob, die mit den Aramäern vor Rabba im Feld standen, bis Joab sie schlug. Die Synodalbibel behält die hebräische Form Ischtob als Namen bei."
    - "In den Makkabäerkriegen wurden Juden, die im Land Tob lebten, von ihren Nachbarn getötet; das Zweite Makkabäerbuch nennt die Juden jener Gegend die Tubieni, und manche verbinden den Namen mit der Familie der Tobiaden, deren Palast in Iraq al-Amir westlich von Amman steht, was die Karte als zweiten, weniger wahrscheinlichen Ort anbietet. Et-Taiyibeh ist heute ein Dorf im Gouvernement Daraa in Syrien, unmittelbar nördlich der jordanischen Grenze."
  fr:
    - "Le pays de Tob était un district à l’est du Jourdain, au nord de Galaad et vers le pays araméen, où un hors-la-loi pouvait vivre hors d’atteinte des siens. On le place d’ordinaire autour d’et-Taiyibeh, village à quelque 15 km au sud-est de Deraa, dans le sud de la Syrie, dans la plaine du Havran près de la frontière jordanienne, qui en garde peut-être le nom ; un pays Tubu des lettres d’Amarna lui est souvent identifié. Rien n’y a été fouillé, et l’identification repose sur le nom et sur la position qu’exigent les récits."
    - "« Jephthé s’enfuit loin de ses frères, et il habita dans le pays de Tob. Des gens de rien se rassemblèrent auprès de Jephthé, et ils faisaient avec lui des excursions. » Quand les Ammonites firent la guerre à Galaad, les anciens allèrent « chercher Jephthé au pays de Tob », et il revint comme leur chef et juge. Des générations plus tard, Tob était de l’autre côté : après avoir insulté les envoyés de David, les Ammonites engagèrent les Araméens de Beth-Rehob et de Tsoba, mille hommes chez le roi de Maaca « et douze mille hommes chez les gens de Tob », c’est-à-dire les hommes de Tob, qui se tinrent avec les Araméens dans la campagne devant Rabba jusqu’à ce que Joab les mette en déroute. La Bible synodale garde la forme hébraïque Ish-Tob comme un nom."
    - "Dans les guerres maccabéennes, des Juifs du pays de Tob furent tués par leurs voisins ; le deuxième livre des Maccabées appelle les Juifs de cette région les Tubieni, et certains rattachent le nom à la famille des Tobiades, dont le palais se dresse à Iraq al-Amir, à l’ouest d’Amman, que la carte propose comme second site, moins probable. Et-Taiyibeh est aujourd’hui un village du gouvernorat de Deraa, en Syrie, juste au nord de la frontière jordanienne."
