body:
  en:
    - "Sharuhen was a town of the far south-west of Canaan, near Gaza, whose site is disputed. W. F. Albright laid the basis for placing it at Tell el-Far'ah (South) on the Nahal Besor, which Flinders Petrie excavated in the late 1920s; Aharon Kempinski in the 1970s proposed Tell el-Ajjul near the mouth of the same stream, south-west of Gaza, which Petrie dug in the 1930s and Peter Fischer and Moain Sadeq again from 1999; Anson Rainey proposed Tel Haror on the Nahal Gerar, supported by Donald Redford. The map follows Tell el-Ajjul."
    - "In the Bible it appears once, in the towns of Simeon within Judah's southern lands: “And Beth-lebaoth, and Sharuhen; thirteen cities and their villages”. The parallel lists have Shilhim and Shaaraim in its place."
    - "Sharuhen is best known from Egypt. After Ahmose I drove the Hyksos from Avaris, his army besieged Sharuhen for three years and plundered it; the soldier Ahmose son of Ebana, who served there, records it in his tomb at Elkab. The name appears again in the list of Shoshenq I at Karnak in the tenth century BC. Tell el-Ajjul lies today in the Gaza Strip, Tell el-Far'ah (South) and Tel Haror in southern Israel."
  ru:
    - "Шарухен — город на крайнем юго-западе Ханаана, близ Газы, место которого спорно. У. Ф. Олбрайт положил начало его отождествлению с Телль-эль-Фара (Южным) на Нахаль-Бесоре, который Флиндерс Питри раскапывал в конце 1920-х гг.; Аарон Кемпински в 1970-х гг. предложил Телль-эль-Аджуль у устья того же потока, к юго-западу от Газы, который Питри копал в 1930-х гг., а Петер Фишер и Моайн Садек снова с 1999 г.; Энсон Рейни предложил Тель-Харор на Нахаль-Гераре, и его поддержал Дональд Редфорд. Карта следует Телль-эль-Аджулю."
    - "В Библии он упомянут один раз, среди городов Симеона в южных землях Иуды: «Беф-Леваоф и Шарухен: тринадцать городов с их селами». В параллельных списках на его месте стоят Шелихим и Шаараим."
    - "Шарухен известен прежде всего по египетским источникам. Изгнав гиксосов из Авариса, войско Яхмоса I три года осаждало Шарухен и разграбило его; об этом пишет в своей гробнице в Эль-Кабе воин Яхмос, сын Абаны, участвовавший в осаде. Имя снова встречается в списке Шешонка I в Карнаке в X в. до н. э. Телль-эль-Аджуль находится сегодня в секторе Газа, Телль-эль-Фара (Южный) и Тель-Харор — на юге Израиля."
  uk:
    - "Шарухен був містом крайнього південного заходу Ханаану, поблизу Гази, місце якого спірне. В. Ф. Олбрайт заклав основу для розміщення його в Телль-ель-Фараа (Південний) на Нахаль-Бесор, який Фліндерс Петрі розкопував наприкінці 1920-х рр.; Аарон Кемпінскі в 1970-х рр. запропонував Телль-ель-Аджул біля гирла того самого потоку, на південний захід від Гази, який Петрі копав у 1930-х рр., а Пітер Фішер і Моаїн Садек — знову від 1999 р.; Енсон Рейні запропонував Тель-Харор на Нахаль-Герар, за що виступав Дональд Редфорд. Мапа йде за Телль-ель-Аджулом."
    - "У Біблії воно з'являється один раз, у містах Симеона в південних землях Юди: «Бет-Лебаот і Сарухен — тринайцять міст з їх селами». Паралельні переліки мають на його місці Шілхім і Шаараїм."
    - "Найвідоміший Шарухен із єгипетських джерел. Після того як Яхмос I вигнав гіксосів з Авариса, його військо три роки облягало Шарухен і пограбувало його; воїн Яхмос, син Ебани, який там служив, записує це у своїй гробниці в Ель-Каабі. Назва з'являється знову в списку Шешонка I в Карнаку в X ст. до н. е. Телль-ель-Аджул лежить нині в секторі Гази, Телль-ель-Фараа (Південний) і Тель-Харор — на півдні Ізраїлю."
  es:
    - "Saruhén era una ciudad del extremo suroeste de Canaán, cerca de Gaza, cuyo emplazamiento se discute. W. F. Albright sentó la base para situarla en Tell el-Far'ah (Sur), en el Nahal Besor, que Flinders Petrie excavó a fines de la década de 1920; Aharon Kempinski propuso en la de 1970 Tell el-Ajjul, cerca de la desembocadura del mismo arroyo, al suroeste de Gaza, que Petrie excavó en la de 1930 y Peter Fischer y Moain Sadeq de nuevo desde 1999; Anson Rainey propuso Tel Haror, en el Nahal Gerar, con el apoyo de Donald Redford. El mapa sigue Tell el-Ajjul."
    - "En la Biblia aparece una vez, entre las ciudades de Simeón dentro de las tierras meridionales de Judá: «Beth-lebaoth, y Saruhén; trece ciudades con sus aldeas». Las listas paralelas tienen en su lugar Silhim y Saaraim."
    - "Saruhén es más conocida por Egipto. Después de que Ahmose I expulsara a los hicsos de Avaris, su ejército asedió Saruhén durante tres años y la saqueó; el soldado Ahmose, hijo de Ebana, que sirvió allí, lo registra en su tumba de Elkab. El nombre aparece de nuevo en la lista de Sheshonq I en Karnak, en el siglo X a. C. Tell el-Ajjul se halla hoy en la Franja de Gaza; Tell el-Far'ah (Sur) y Tel Haror, en el sur de Israel."
  de:
    - "Scharuhen war eine Stadt im äußersten Südwesten Kanaans, nahe Gaza, deren Lage umstritten ist. W. F. Albright legte die Grundlage dafür, es in Tell el-Far'a (Süd) am Nachal Besor anzusetzen, das Flinders Petrie in den späten 1920er Jahren ausgrub; Aharon Kempinski schlug in den 1970er Jahren Tell el-Adschul nahe der Mündung desselben Bachs südwestlich von Gaza vor, das Petrie in den 1930er Jahren und Peter Fischer und Moain Sadeq ab 1999 erneut ausgruben; Anson Rainey schlug Tel Haror am Nachal Gerar vor, unterstützt von Donald Redford. Die Karte folgt Tell el-Adschul."
    - "In der Bibel kommt es einmal vor, unter den Städten Simeons in den südlichen Ländern Judas: „Beth-Lebaoth, Saruhen. Das sind dreizehn Städte und ihre Dörfer.“ Die Parallellisten haben an seiner Stelle Schilhim und Schaarajim."
    - "Scharuhen ist vor allem aus Ägypten bekannt. Nachdem Ahmose I. die Hyksos aus Avaris vertrieben hatte, belagerte sein Heer Scharuhen drei Jahre lang und plünderte es; der Soldat Ahmose, Sohn des Ebana, der dort diente, hält es in seinem Grab in Elkab fest. Der Name erscheint wieder in der Liste Scheschonqs I. in Karnak aus dem zehnten Jahrhundert v. Chr. Tell el-Adschul liegt heute im Gazastreifen, Tell el-Far'a (Süd) und Tel Haror im Süden Israels."
  fr:
    - "Scharuchen était une ville de l’extrême sud-ouest de Canaan, près de Gaza, dont le site est disputé. W. F. Albright jeta les bases pour la placer à Tell el-Far’ah (Sud), sur le Nahal Besor, que Flinders Petrie fouilla à la fin des années 1920 ; Aharon Kempinski proposa dans les années 1970 Tell el-Ajjul, près de l’embouchure du même cours d’eau, au sud-ouest de Gaza, que Petrie fouilla dans les années 1930 et Peter Fischer et Moain Sadeq de nouveau à partir de 1999 ; Anson Rainey proposa Tel Haror sur le Nahal Gerar, soutenu par Donald Redford. La carte suit Tell el-Ajjul."
    - "Dans la Bible, elle apparaît une fois, parmi les villes de Siméon dans les terres méridionales de Juda : « Beth-Lebaoth et Scharuchen, treize villes, et leurs villages ». Les listes parallèles portent Schilhim et Schaaraïm à sa place."
    - "Scharuchen est surtout connue par l’Égypte. Après qu’Ahmosis Ier eut chassé les Hyksôs d’Avaris, son armée assiégea Scharuchen pendant trois ans et la pilla ; le soldat Ahmès, fils d’Ebana, qui y servit, le rapporte dans sa tombe à El-Kab. Le nom reparaît dans la liste de Sheshonq Ier à Karnak, au Xe siècle av. J.-C. Tell el-Ajjul se trouve aujourd’hui dans la bande de Gaza, Tell el-Far’ah (Sud) et Tel Haror dans le sud d’Israël."
  pt:
    - "Saruém era uma cidade do extremo sudoeste de Canaã, perto de Gaza, cuja localização é disputada. W. F. Albright lançou a base para situá-la em Tell el-Far'ah (Sul), no Nahal Besor, que Flinders Petrie escavou no final da década de 1920; Aharon Kempinski propôs nos anos 1970 Tell el-Ajjul, perto da foz do mesmo riacho, a sudoeste de Gaza, que Petrie escavou nos anos 1930 e Peter Fischer e Moain Sadeq de novo a partir de 1999; Anson Rainey propôs Tel Haror, no Nahal Gerar, com o apoio de Donald Redford. O mapa segue Tell el-Ajjul."
    - "Na Bíblia aparece uma só vez, entre as cidades de Simeão dentro das terras meridionais de Judá: “Bete-Lebaote e Saruém; treze cidades com as suas aldeias”. As listas paralelas trazem Silim e Saaraim em seu lugar."
    - "Saruém é mais conhecida pelo Egito. Depois que Amósis I expulsou os hicsos de Avaris, seu exército sitiou Saruém por três anos e a saqueou; o soldado Amósis, filho de Ebana, que serviu ali, registra isso em seu túmulo em Elkab. O nome aparece de novo na lista de Sosenque I em Carnaque, no século X a.C. Tell el-Ajjul fica hoje na Faixa de Gaza; Tell el-Far'ah (Sul) e Tel Haror, no sul de Israel."
  it:
    - "Saruchen era una città dell’estremo sud-ovest di Canaan, vicino a Gaza, il cui sito è discusso. W. F. Albright pose le basi per collocarla a Tell el-Far‘ah (Sud) sul Nahal Besor, che Flinders Petrie scavò alla fine degli anni Venti; Aharon Kempinski negli anni Settanta propose Tell el-Ajjul presso la foce dello stesso torrente, a sud-ovest di Gaza, che Petrie scavò negli anni Trenta e Peter Fischer e Moain Sadeq di nuovo dal 1999; Anson Rainey propose Tel Haror sul Nahal Gerar, sostenuto da Donald Redford. La carta segue Tell el-Ajjul."
    - "Nella Bibbia compare una sola volta, tra le città di Simeone entro le terre meridionali di Giuda: «Beth-Lebaoth e Sharuchen: tredici città e i loro villaggi». Gli elenchi paralleli hanno al suo posto Scilhim e Shaaraim."
    - "Saruchen è nota soprattutto dall’Egitto. Dopo che Amosi I ebbe scacciato gli Hyksos da Avaris, il suo esercito assediò Saruchen per tre anni e la saccheggiò; il soldato Amosi figlio di Ebana, che vi prestò servizio, lo registra nella sua tomba a El-Kab. Il nome compare di nuovo nell’elenco di Sheshonq I a Karnak nel X secolo a.C. Tell el-Ajjul si trova oggi nella Striscia di Gaza, Tell el-Far‘ah (Sud) e Tel Haror nel sud di Israele."
  nl:
    - "Saruhen was een stad in het uiterste zuidwesten van Kanaän, bij Gaza, waarvan de ligging omstreden is. W. F. Albright legde de basis voor de plaatsing bij Tell el-Far'ah (Zuid) aan de beek Besor, die Flinders Petrie in de late jaren twintig opgroef; Aharon Kempinski stelde in de jaren zeventig Tell el-Ajjul voor bij de monding van dezelfde beek, ten zuidwesten van Gaza, dat Petrie in de jaren dertig groef en Peter Fischer en Moain Sadeq opnieuw vanaf 1999; Anson Rainey stelde Tel Haror aan de beek Gerar voor, gesteund door Donald Redford. De kaart volgt Tell el-Ajjul."
    - "In de Bijbel komt het eenmaal voor, onder de steden van Simeon binnen Juda's zuidelijke landen: “En Beth-Lebaoth, en Saruhen; dertien steden en haar dorpen”. De parallelle lijsten hebben Silchim en Saäraïm in zijn plaats."
    - "Saruhen is vooral bekend uit Egypte. Nadat Ahmose I de Hyksos uit Avaris had verdreven, belegerde zijn leger Saruhen drie jaar en plunderde het; de soldaat Ahmose, zoon van Ebana, die daar diende, vermeldt het in zijn graf te Elkab. De naam komt opnieuw voor in de lijst van Sjosjenq I te Karnak uit de tiende eeuw v.Chr. Tell el-Ajjul ligt tegenwoordig in de Gazastrook, Tell el-Far'ah (Zuid) en Tel Haror in het zuiden van Israël."
  pl:
    - "Szaruchen było miastem na dalekim południowym zachodzie Kanaanu, w pobliżu Gazy, którego położenie jest sporne. W. F. Albright położył podstawy pod umieszczenie go w Tell el-Far'a (Południe) nad Nachal Besor, które Flinders Petrie badał pod koniec lat dwudziestych XX wieku; Aharon Kempinski w latach siedemdziesiątych zaproponował Tell el-Adżdżul koło ujścia tego samego potoku, na południowy zachód od Gazy, które Petrie kopał w latach trzydziestych, a Peter Fischer i Moain Sadeq ponownie od 1999 roku; Anson Rainey zaproponował Tel Haror nad Nachal Gerar, co poparł Donald Redford. Mapa idzie za Tell el-Adżdżul."
    - "W Biblii pojawia się raz, wśród miast Symeona w południowych ziemiach Judy: „I Betlebaot, i Serohem, i trzynaście miast, i wsi ich”. Listy paralelne mają na jego miejscu Szilchim i Szaaraim."
    - "Szaruchen jest najlepiej znane z Egiptu. Gdy Ahmose I wypędził Hyksosów z Awaris, jego wojsko oblegało Szaruchen przez trzy lata i je złupiło; żołnierz Ahmose syn Ebany, który tam służył, zapisał to w swoim grobowcu w Elkab. Nazwa pojawia się znów na liście Szeszonka I w Karnaku z X w. p.n.e. Tell el-Adżdżul leży dziś w Strefie Gazy, Tell el-Far'a (Południe) i Tel Haror w południowym Izraelu."
  cs:
    - "Šaruchen bylo město na dalekém jihozápadě Kanaánu, poblíž Gazy, jehož poloha je sporná. W. F. Albright položil základ pro jeho umístění do Tell el-Far'a (jih) na Nachal Besor, kde koncem 20. let 20. století kopal Flinders Petrie; Aharon Kempinski v 70. letech navrhl Tell el-Adžúl poblíž ústí téhož toku, jihozápadně od Gazy, kde Petrie kopal ve 30. letech a Peter Fischer a Moain Sadeq znovu od roku 1999; Anson Rainey navrhl Tel Charor na Nachal Gerar, což podporuje Donald Redford. Mapa sleduje Tell el-Adžúl."
    - "V Bibli se objevuje jednou, mezi městy Simeonovými v judských jižních zemích: „Betlebaot a Sarohem, měst třinácte i vsi jejich“. Souběžné seznamy mají na jeho místě Šilchim a Šaarajim."
    - "Šaruchen je nejznámější z Egypta. Poté, co Ahmose I. vyhnal Hyksósy z Avaridy, jeho vojsko obléhalo Šaruchen tři roky a vyplenilo je; voják Ahmose, syn Ebanin, který tam sloužil, to zaznamenává ve své hrobce v Elkábu. Jméno se objevuje znovu v seznamu Šošenka I. v Karnaku z desátého století př. n. l. Tell el-Adžúl leží dnes v Pásmu Gazy, Tell el-Far'a (jih) a Tel Charor v jižním Izraeli."
  sv:
    - "Sharuhen var en stad längst i sydväst i Kanaan, nära Gaza, vars läge är omstritt. W. F. Albright lade grunden för att placera den vid Tell el-Far'ah (söder) vid Nahal Besor, som Flinders Petrie grävde ut i slutet av 1920-talet; Aharon Kempinski föreslog på 1970-talet Tell el-Ajjul nära samma bäcks mynning, sydväst om Gaza, som Petrie grävde på 1930-talet och Peter Fischer och Moain Sadeq åter från 1999; Anson Rainey föreslog Tel Haror vid Nahal Gerar, med stöd av Donald Redford. Kartan följer Tell el-Ajjul."
    - "I Bibeln förekommer det en gång, bland Simeons städer i Judas södra land: ”Bet-Lebaot och Saruhen – tretton städer med deras byar”. De parallella förteckningarna har Shilchim och Shaarajim i dess ställe."
    - "Sharuhen är mest känt från Egypten. Sedan Ahmose I drivit hyksos från Avaris belägrade hans armé Sharuhen i tre år och plundrade det; soldaten Ahmose, Ebanas son, som tjänstgjorde där, berättar det i sin grav i Elkab. Namnet förekommer igen i Shoshenq I:s förteckning i Karnak på 900-talet f.Kr. Tell el-Ajjul ligger i dag i Gazaremsan, Tell el-Far'ah (söder) och Tel Haror i södra Israel."
  nb:
    - "Saruhen var en by helt i sørvest i Kanaan, nær Gasa, hvis sted er omstridt. W. F. Albright la grunnlaget for å plassere den ved Tell el-Far'ah (Sør) ved Nahal Besor, som Flinders Petrie gravde ut på slutten av 1920-årene; Aharon Kempinski foreslo på 1970-tallet Tell el-Ajjul nær munningen av den samme bekken, sørvest for Gasa, som Petrie gravde på 1930-tallet og Peter Fischer og Moain Sadeq igjen fra 1999; Anson Rainey foreslo Tel Haror ved Nahal Gerar, støttet av Donald Redford. Kartet følger Tell el-Ajjul."
    - "I Bibelen forekommer den én gang, blant Simeons byer innenfor Judas sørlige land: «og Bet-Lebaot og Saruhen – tretten byer med tilhørende landsbyer». De parallelle listene har Sjilhim og Sjaarajim i stedet."
    - "Saruhen er best kjent fra Egypt. Etter at Ahmose I drev hyksosene ut av Avaris, beleiret hæren hans Saruhen i tre år og plyndret den; soldaten Ahmose, sønn av Ebana, som tjenestegjorde der, forteller det i graven sin i Elkab. Navnet dukker opp igjen i Sjosjenk I's liste i Karnak på 900-tallet f.Kr. Tell el-Ajjul ligger i dag i Gazastripen, Tell el-Far'ah (Sør) og Tel Haror i det sørlige Israel."
  tl:
    - "Ang Saruhen ay bayan sa dulong timog-kanluran ng Canaan, malapit sa Gaza, na pinagtatalunan ang lugar. Inilatag ni W. F. Albright ang batayan sa paglalagay nito sa Tell el-Far'ah (Timog) sa Nahal Besor, na hinukay ni Flinders Petrie noong huling bahagi ng dekada 1920; iminungkahi ni Aharon Kempinski noong dekada 1970 ang Tell el-Ajjul malapit sa bunganga ng parehong batis, sa timog-kanluran ng Gaza, na hinukay ni Petrie noong dekada 1930 at muli nina Peter Fischer at Moain Sadeq mula 1999; iminungkahi ni Anson Rainey ang Tel Haror sa Nahal Gerar, na sinuportahan ni Donald Redford. Sinusunod ng mapa ang Tell el-Ajjul."
    - "Sa Bibliya, isang beses itong lumilitaw, sa mga bayan ni Simeon sa mga lupaing timog ng Juda: “At Beth-lebaoth, at Saruhen: labing tatlong bayan pati ng mga nayon niyaon”. Ang mga katapat na listahan ay may Silim at Saaraim sa lugar nito."
    - "Kilala ang Saruhen higit sa lahat mula sa Egipto. Matapos palayasin ni Ahmose I ang mga Hyksos mula sa Avaris, kinubkob ng kaniyang hukbo ang Saruhen nang tatlong taon at sinamsam ito; itinatala ito ng sundalong si Ahmose na anak ni Ebana, na naglingkod doon, sa kaniyang libingan sa Elkab. Muling lumilitaw ang pangalan sa listahan ni Shoshenq I sa Karnak noong ika-10 siglo BK. Ang Tell el-Ajjul ay nasa Gaza Strip ngayon, ang Tell el-Far'ah (Timog) at Tel Haror sa timog Israel."
  da:
    - "Sjaruhen var en by i Kana'ans yderste sydvest, nær Gaza, hvis sted er omstridt. W. F. Albright lagde grunden til at placere den ved Tell el-Far'ah (Syd) ved Nahal Besor, som Flinders Petrie udgravede i slutningen af 1920'erne; Aharon Kempinski foreslog i 1970'erne Tell el-Ajjul nær samme ås munding, sydvest for Gaza, som Petrie gravede i 1930'erne og Peter Fischer og Moain Sadeq igen fra 1999; Anson Rainey foreslog Tel Haror ved Nahal Gerar, støttet af Donald Redford. Kortet følger Tell el-Ajjul."
    - "I Bibelen optræder den én gang, blandt Simeons byer i Judas sydlige lande: »og Beth-Lebaoth og Saruhen; tretten Stæder og deres Landsbyer«. De parallelle lister har Sjilhim og Sja'arajim i stedet."
    - "Sjaruhen er bedst kendt fra Egypten. Efter at Ahmose 1. havde fordrevet hyksos fra Avaris, belejrede hans hær Sjaruhen i tre år og plyndrede den; soldaten Ahmose, Ebanas søn, der tjente dér, optegner det i sin grav i Elkab. Navnet optræder igen på Sjosjenk 1.'s liste i Karnak i 900-tallet f.Kr. Tell el-Ajjul ligger i dag i Gazastriben, Tell el-Far'ah (Syd) og Tel Haror i det sydlige Israel."
  sr:
    - "Саруен је био град крајњег југозапада Ханана, близу Газе, чије је место спорно. В. Ф. Олбрајт је поставио основу за његово смештање у Тел ел-Фару (јужни) на Нахал Бесору, који је Флиндерс Пири ископавао крајем 1920-их; Ахарон Кемпински је 1970-их предложио Тел ел-Аџул близу ушћа истог потока, југозападно од Газе, који је Пири копао 1930-их, а Петер Фишер и Моаин Садек поново од 1999; Ансон Рејни предложио је Тел Харор на Нахал Герару, што подржава Доналд Редфорд. Карта следи Тел ел-Аџул."
    - "У Библији се јавља једном, међу градовима Симеуновим у јужним земљама Јудиним: „и Вет-Леваот и Саруен; тринаест градова са селима својим“. Паралелни спискови имају Силеим и Сараим на његовом месту."
    - "Саруен је најпознатији из Египта. Пошто је Ахмос I протерао Хиксе из Авариса, његова војска је опседала Саруен три године и опљачкала га; војник Ахмос, син Ебанин, који је тамо служио, бележи то у својој гробници у Елкабу. Име се поново јавља на списку Шошенка I у Карнаку у 10. веку п. н. е. Тел ел-Аџул данас лежи у појасу Газе, Тел ел-Фара (јужни) и Тел Харор у јужном Израелу."
