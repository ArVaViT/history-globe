body:
  en:
    - "Abel-keramim, “meadow of vineyards”, marks the limit of Jephthah's pursuit of the Ammonites: “he smote them from Aroer, even till thou come to Minnith, even twenty cities, and unto the plain of the vineyards, with a very great slaughter.” The King James Version translates the name as “the plain of the vineyards”, while the Russian Synodal Bible keeps it as a place name. Eusebius knew a village of vineyards called Abela six Roman miles from Philadelphia, the Ammonite Rabbah, today Amman; Jerome's Latin version says seven."
    - "The site has not been identified. Proposals include Khirbet es-Suq south of Amman, Na'ur to the south-west (Grollenberg), Sahab to the south-east, where the map sets it, and Tall al-Umayri, some 10 km south of Amman by the airport road, which the Madaba Plains Project, excavating there since 1984, suggests. Umayri has one of the earliest and best-preserved four-room houses of Iron Age I and a seal impression of an official of Baalis, the Ammonite king named by Jeremiah."
  ru:
    - "Авель-Керамим, «луг виноградников», отмечает предел, до которого Иеффай преследовал аммонитян: «поразил их поражением весьма великим, от Ароера до Минифа двадцать городов, и до Авель-Керамима». Английская Библия короля Якова переводит это имя как «равнина виноградников», а Синодальный перевод сохраняет его как название места. Евсевий знал селение виноградников Авела в шести римских милях от Филадельфии, аммонитской Раввы, ныне Аммана; в латинском переводе Иеронима — в семи."
    - "Место не отождествлено. Среди предложений — Хирбет-эс-Сук к югу от Аммана, Наур к юго-западу (Гролленберг), Сахаб к юго-востоку, где его ставит карта, и Телль-эль-Умейри, примерно в 10 км к югу от Аммана у дороги к аэропорту, который предлагает проект «Равнины Мадавы», раскапывающий его с 1984 г. На Умейри открыт один из древнейших и лучше всего сохранившихся «четырёхкомнатных» домов железного века I и оттиск печати сановника Ваалиса, аммонитского царя, названного у Иеремии."
  cs:
    - "Ábel-keramím, „louka vinic“, vyznačuje mez Jiftáchova pronásledování Amonitských: „I pobil je od Aroer, až kudy se jde do Mennit, dvadceti měst, a až do Abel vinic porážkou velikou velmi.“ Bible krále Jakuba překládá jméno jako „rovina vinic“, zatímco ruská synodální Bible je ponechává jako místní jméno. Eusebius znal vesnici vinic zvanou Abela šest římských mil od Filadelfie, amonitské Rabby, dnešního Ammánu; Jeronýmův latinský překlad říká sedm."
    - "Poloha nebyla určena. Návrhy zahrnují Chirbet es-Súk jižně od Ammánu, Na'úr na jihozápadě (Grollenberg), Sahab na jihovýchodě, kam je klade mapa, a Tall al-Umajrí, asi 10 km jižně od Ammánu u silnice k letišti, který navrhuje Madaba Plains Project, kopající tam od roku 1984. Umajrí má jeden z nejstarších a nejlépe zachovaných čtyřprostorových domů starší doby železné a otisk pečeti úředníka Baalise, amonitského krále jmenovaného Jeremjášem."
  uk:
    - "Авел-Керамім, «луг виноградників», позначає межу переслідування аммонітян Єфтаєм: «І побив він їх страшенно, від Ароера до Минита двайцять міст, і аж до Абель-Керамиму». Біблія короля Якова перекладає цю назву як «рівнина виноградників», тоді як російська Синодальна Біблія зберігає її як назву місця. Євсевій знав село виноградників на ім'я Абела за шість римських миль від Філадельфії, аммонітської Равви, нині Амман; латинський переклад Єроніма каже сім."
    - "Місце не ототожнено. Пропозиції включають Хірбет-ес-Сук на південь від Аммана, Наур на південному заході (Гролленберг), Сахаб на південному сході, де його й ставить мапа, і Телль-ель-Умейрі, приблизно за 10 км на південь від Аммана біля дороги до аеропорту, який запропонував проєкт «Madaba Plains», що розкопує там від 1984 р. В Умейрі є один із найдавніших і найкраще збережених чотирикімнатних будинків залізної доби I і відбиток печатки урядовця Вааліса, аммонітського царя, названого Єремією."
  pl:
    - "Abel-Keramim, „łąka winnic”, wyznacza kres pościgu Jeftego za Ammonitami: „I poraził je od Aroer aż idąc do Menit, dwadzieścia miast, i aż do równiny winnic porażką bardzo wielką”. Biblia Króla Jakuba tłumaczy nazwę jako równinę winnic, podczas gdy rosyjska Biblia synodalna zachowuje ją jako nazwę miejscową. Euzebiusz znał wieś winnic zwaną Abela sześć mil rzymskich od Filadelfii, ammonickiej Rabby, dzisiejszego Ammanu; łacińska wersja Hieronima podaje siedem."
    - "Miejsca nie zidentyfikowano. Propozycje to Chirbet es-Suk na południe od Ammanu, Na'ur na południowym zachodzie (Grollenberg), Sahab na południowym wschodzie, gdzie umieszcza je mapa, oraz Tall al-Umajri, około 10 km na południe od Ammanu przy drodze na lotnisko, które Madaba Plains Project, prowadzący tam wykopaliska od 1984 roku, sugeruje. Umajri ma jeden z najstarszych i najlepiej zachowanych domów czteroizbowych z żelaza I oraz odcisk pieczęci urzędnika Baalisa, króla ammonickiego wymienionego przez Jeremiasza."
  es:
    - "Abel-queramim, «prado de viñas», marca el límite de la persecución de los amonitas por Jefté: «Y los hirió de grandísimo estrago desde Aroer hasta llegar á Minnith, veinte ciudades; y hasta la vega de las viñas». La versión King James traduce el nombre («la llanura de las viñas»), mientras que la Biblia sinodal rusa lo conserva como nombre de lugar. Eusebio conocía una aldea de viñas llamada Abela a seis millas romanas de Filadelfia, la Rabá amonita, hoy Amán; la versión latina de Jerónimo dice siete."
    - "El lugar no ha sido identificado. Entre las propuestas están Khirbet es-Suq, al sur de Amán; Na'ur, al suroeste (Grollenberg); Sahab, al sureste, donde lo sitúa el mapa; y Tall al-Umayri, a unos 10 km al sur de Amán por la carretera del aeropuerto, que sugiere el Madaba Plains Project, que excava allí desde 1984. Umayri tiene una de las casas de cuatro habitaciones más antiguas y mejor conservadas del Hierro I y una impronta de sello de un funcionario de Baalis, el rey amonita nombrado por Jeremías."
  pt:
    - "Abel-Queramim, “prado das vinhas”, marca o limite da perseguição de Jefté aos amonitas: “Ele os feriu com grande matança, desde Aroer até chegar a Minite, num total de vinte cidades, e até Abel-Queramim.” A Versão King James traduz o nome por “a planície das vinhas”, enquanto a Bíblia sinodal russa o conserva como nome de lugar. Eusébio conhecia uma aldeia de vinhedos chamada Abela, a seis milhas romanas de Filadélfia, a Rabá amonita, hoje Amã; a versão latina de Jerônimo diz sete."
    - "O sítio não foi identificado. As propostas incluem Khirbet es-Suq, ao sul de Amã, Na'ur, a sudoeste (Grollenberg), Sahab, a sudeste, onde o mapa o coloca, e Tall al-Umayri, cerca de 10 km ao sul de Amã, junto à estrada do aeroporto, que o Madaba Plains Project, que escava ali desde 1984, sugere. Umayri tem uma das casas de quatro cômodos mais antigas e mais bem conservadas do Ferro I e uma impressão de selo de um oficial de Baalis, o rei amonita nomeado por Jeremias."
  de:
    - "Abel-Keramim, „Wiese der Weinberge“, bezeichnet die Grenze von Jeftahs Verfolgung der Ammoniter: „Und er schlug sie von Aroer an, bis wo man kommt gen Minnith, zwanzig Städte, und bis an den Plan der Weinberge, eine sehr große Schlacht.“ Die King-James-Bibel übersetzt den Namen (Ebene der Weinberge), während die russische Synodalbibel ihn als Ortsnamen beibehält. Eusebius kannte ein Weinbergdorf namens Abela sechs römische Meilen von Philadelphia, dem ammonitischen Rabba, heute Amman; die lateinische Fassung des Hieronymus sagt sieben."
    - "Die Stätte ist nicht identifiziert. Zu den Vorschlägen gehören Chirbet es-Suq südlich von Amman, Na'ur im Südwesten (Grollenberg), Sahab im Südosten, wo die Karte es einträgt, und Tall al-Umaira, etwa 10 km südlich von Amman an der Flughafenstraße, das das Madaba Plains Project, das dort seit 1984 gräbt, vorschlägt. Umaira hat eines der frühesten und am besten erhaltenen Vierraumhäuser der Eisenzeit I und den Siegelabdruck eines Beamten des Baalis, des ammonitischen Königs, den Jeremia nennt."
  fr:
    - "Abel-Keramim, « prairie des vignes », marque la limite de la poursuite des Ammonites par Jephté : « Il leur fit éprouver une très grande défaite, depuis Aroër jusque vers Minnith, espace qui renfermait vingt villes, et jusqu’à Abel-Keramim. » La version du roi Jacques traduit le nom par « la plaine des vignobles », alors que Louis Segond et la Bible synodale russe le gardent comme nom de lieu. Eusèbe connaissait un village de vignobles appelé Abela, à six milles romains de Philadelphie, la Rabba ammonite, aujourd’hui Amman ; la version latine de Jérôme dit sept."
    - "Le site n’a pas été identifié. Parmi les propositions figurent Khirbet es-Suq au sud d’Amman, Na’ur au sud-ouest (Grollenberg), Sahab au sud-est, où la carte le place, et Tall al-Umayri, à quelque 10 km au sud d’Amman, près de la route de l’aéroport, que suggère le Madaba Plains Project, qui y fouille depuis 1984. Umayri a l’une des plus anciennes et des mieux conservées maisons à quatre pièces du Fer I et une empreinte de sceau d’un officier de Baalis, le roi ammonite nommé par Jérémie."
  it:
    - "Abel-Cheramim, «prato delle vigne», segna il limite dell’inseguimento degli Ammoniti da parte di Iefte: «E egli inflisse loro una grandissima sconfitta, da Aroer fin verso Minnith, prendendo loro venti città, e fino ad Abel-Keramim». La King James Version traduce il nome come «la pianura delle vigne», mentre la Bibbia sinodale russa lo conserva come nome di luogo. Eusebio conosceva un villaggio di vigne chiamato Abela a sei miglia romane da Filadelfia, la Rabba degli Ammoniti, oggi Amman; la versione latina di Girolamo dice sette."
    - "Il sito non è stato identificato. Tra le proposte vi sono Khirbet es-Suq a sud di Amman, Na‘ur a sud-ovest (Grollenberg), Sahab a sud-est, dove lo colloca la carta, e Tall al-Umayri, a circa 10 km a sud di Amman presso la strada dell’aeroporto, che il Madaba Plains Project, in scavo dal 1984, propone. Umayri ha una delle più antiche e meglio conservate case a quattro vani dell’età del Ferro I e un’impronta di sigillo di un funzionario di Baalis, il re ammonita nominato da Geremia."
  nl:
    - "Abel-Keramim, ‘weide van wijngaarden’, markeert de grens van Jefta's achtervolging van de Ammonieten: “sloeg hen van Aroer af tot daar gij komt te Minnith, twintig steden, en tot aan Abel-Keramim, met een zeer groten slag.” De King James Version vertaalt de naam als “the plain of the vineyards”, terwijl de Russische Synodale Bijbel hem als plaatsnaam houdt. Eusebius kende een wijngaarddorp Abela, zes Romeinse mijlen van Filadelfia, het Ammonitische Rabba, het huidige Amman; Hiëronymus' Latijnse versie zegt zeven."
    - "De plaats is niet geïdentificeerd. Voorstellen zijn onder meer Khirbet es-Suq ten zuiden van Amman, Na'ur ten zuidwesten (Grollenberg), Sahab ten zuidoosten, waar de kaart haar zet, en Tall al-Umayri, zo'n 10 km ten zuiden van Amman bij de luchthavenweg, dat het Madaba Plains Project, dat er sinds 1984 graaft, voorstelt. Umayri heeft een van de vroegste en best bewaarde huizen met vier vertrekken uit de ijzertijd I en een zegelafdruk van een ambtenaar van Baälis, de Ammonitische koning die Jeremia noemt."
  sv:
    - "Avel-Keramim, ”vingårdarnas äng”, markerar gränsen för Jeftas förföljelse av ammoniterna: ”Och han tillfogade dem ett mycket stort nederlag och intog landet från Aroer ända till fram emot Minnit, tjugu städer, och ända till Abel-Keramim”. King James-översättningen återger namnet som ”the plain of the vineyards”, medan den ryska synodalbibeln behåller det som ortnamn. Eusebios kände en by med vingårdar som hette Abela sex romerska mil från Filadelfia, det ammonitiska Rabba, nuvarande Amman; Hieronymus latinska version anger sju."
    - "Platsen har inte identifierats. Förslagen omfattar Khirbet es-Suq söder om Amman, Na’ur i sydväst (Grollenberg), Sahab i sydost, där kartan placerar den, och Tall al-Umayri, omkring 10 km söder om Amman invid flygplatsvägen, som föreslås av Madaba Plains Project, vilket har grävt där sedan 1984. Umayri har ett av de tidigaste och bäst bevarade fyrrumshusen från äldre järnåldern och ett sigillavtryck av en ämbetsman hos Baalis, den ammonitiske kung som Jeremia nämner."
  nb:
    - "Abel-Keramim, «vingårdenes eng», markerer grensen for Jeftas forfølgelse av ammonittene: «han slo dem og tok fra dem landet fra Aroer til bortimot Minnit, tyve byer, og like til Abel-Keramim; det blev et svært mannefall». King James-oversettelsen gjengir navnet som «the plain of the vineyards», mens den russiske synodalbibelen beholder det som stedsnavn. Eusebius kjente en vingårdsby kalt Abela seks romerske mil fra Filadelfia, ammonittenes Rabba, i dag Amman; Hieronymus' latinske oversettelse sier sju."
    - "Stedet er ikke identifisert. Forslagene omfatter Khirbet es-Suq sør for Amman, Na'ur i sørvest (Grollenberg), Sahab i sørøst, der kartet plasserer det, og Tall al-Umayri, omtrent 10 km sør for Amman ved flyplassveien, som Madaba Plains Project, som har gravd der siden 1984, foreslår. Umayri har et av de tidligste og best bevarte firromshusene fra jernalder I og et seglavtrykk av en embetsmann under Baalis, ammonittkongen som Jeremia nevner."
  tl:
    - "Ang Abelkeramim, “parang ng mga ubasan”, ang hangganan ng paghabol ni Jephte sa mga Ammonita: “At sila'y sinaktan niya ng di kawasang pagpatay mula sa Aroer hanggang sa Minnith, na may dalawang pung bayan, at hanggang sa Abelkeramim.” Isinasalin ng King James Version ang pangalan bilang “the plain of the vineyards”, samantalang pinananatili ito ng Sinodal na Biblia ng Rusya bilang pangalan ng lugar. Kilala ni Eusebio ang isang nayon ng mga ubasan na tinatawag na Abela, anim na milyang Romano mula sa Filadelfia, ang Rabba ng mga Ammonita, na ngayo'y Amman; yaon namang bersiyong Latin ni Jeronimo ay nagsasabing pito."
    - "Hindi pa natutukoy ang lugar. Kabilang sa mga mungkahi ang Khirbet es-Suq sa timog ng Amman, ang Na'ur sa timog-kanluran (Grollenberg), ang Sahab sa timog-silangan, kung saan ito inilalagay ng mapa, at ang Tall al-Umayri, mga 10 km sa timog ng Amman sa tabi ng daan sa paliparan, na iminumungkahi ng Madaba Plains Project, na naghuhukay roon mula 1984. May isa ang Umayri sa pinakamaaga at pinakamahusay na napanatiling bahay na may apat na silid ng Panahon ng Bakal I at isang tatak ng selyo ng isang opisyal ni Baalis, ang haring Ammonita na binanggit ni Jeremias."
  da:
    - "Abel-Keramim, »vingårdenes eng«, markerer grænsen for Jeftas forfølgelse af ammonitterne: »Og han slog dem fra Aroer, og indtil man kommer til Minnith, tyve Stæder, og indtil Abel-Keramim med et saare stort Slag«. Den engelske King James Version oversætter navnet som »vingårdenes slette«, mens den russiske synodalbibel bevarer det som stednavn. Eusebios kendte en vingårdsby ved navn Abela seks romerske mil fra Filadelfia, ammonitternes Rabba, i dag Amman; Hieronymus' latinske oversættelse siger syv."
    - "Stedet er ikke identificeret. Forslagene omfatter Khirbet es-Suq syd for Amman, Na'ur mod sydvest (Grollenberg), Sahab mod sydøst, hvor kortet placerer det, og Tall al-Umayri, omkring 10 km syd for Amman ved lufthavnsvejen, som Madaba Plains Project, der har gravet dér siden 1984, peger på. Umayri har et af de tidligste og bedst bevarede firerumshuse fra jernalder I og et segltryk af en embedsmand hos Ba'alis, den ammonitiske konge, som Jeremias nævner."
  sr:
    - "Авел-Керамим, „ливада винограда“, означава крај Јефтајевог гоњења Амонаца: „поби их од Ароира па до Минита у двадесет градова и до равнице виноградске у боју врло великом“. Библија краља Џејмса преводи име као „равница виноградска“, док га руска синодална Библија чува као властито име. Јевсевије је знао за село винограда зване Авела, шест римских миља од Филаделфије, амонске Раве, данашњег Амана; Јеронимов латински превод каже седам."
    - "Налазиште није утврђено. Предлози су Хирбет ас-Сук јужно од Амана, Наур на југозападу (Гролењберг), Сахаб на југоистоку, где га смешта карта, и Тал ал-Умајри, око 10 км јужно од Амана поред аеродромског пута, који предлаже Пројекат Мадабске равнице, што тамо ископава од 1984. У Умајрију је једна од најранијих и најбоље очуваних кућа са четири просторије из гвозденог доба I и отисак печата службеника Валиса, амонског цара кога помиње Јеремија."
  hu:
    - "Ábel-Keramim, „a szőlők rétje”, Jefte ammonita-üldözésének határát jelzi: „veré őket Aroertől fogva mindaddig, míg mennél Minnithbe, húsz városon át, és egész Abel-Keraminig nagy vérontással”. A King James-fordítás „a szőlők síkságának” fordítja a nevet, az orosz szinodális Biblia viszont helynévként tartja meg. Euszébiosz ismert egy Abela nevű szőlősfalut Filadelfiától, az ammoniták Rabbájától, a mai Ammántól hat római mérföldre; Hieronymus latin fordítása hetet mond."
    - "A helyet nem sikerült azonosítani. A javaslatok között szerepel az Ammántól délre fekvő Khirbet es-Suq, délnyugaton Na'ur (Grollenberg), délkeleten Sahab, ahová a térkép teszi, és a Tall al-Umayri, Ammántól mintegy 10 km-re délre, a repülőtéri út mellett, amelyet a Madaba Plains Project javasol, s amely 1984 óta ásatást folytat ott. Umayriban található a vaskor I egyik legkorábbi és legjobban megőrzött négyszobás háza, valamint Baalisz, a Jeremiás által említett ammonita király egyik tisztviselőjének pecsétlenyomata."
  fi:
    - "Abel-Keramim, ”viinitarhojen niitty”, merkitsee Jeftan ammonilaisten takaa-ajon rajaa: ”Ja hän tuotti heille hyvin suuren tappion, valloittaen maan Aroerista Minnitiin ja Aabel-Keramimiin asti, kaksikymmentä kaupunkia.” King James -käännös kääntää nimen sanoilla ”viinitarhojen tasanko”, kun taas venäläinen synodaalinen Raamattu pitää sen paikannimenä. Eusebios tunsi viinitarhojen kylän nimeltä Abela kuuden roomalaisen mailin päässä Filadelfiasta, ammonilaisten Rabbasta, nykyisestä Ammanista; Hieronymuksen latinankielinen versio sanoo seitsemän."
    - "Paikkaa ei ole tunnistettu. Ehdotuksia ovat Khirbet es-Suq Ammanista etelään, Na'ur lounaaseen (Grollenberg), Sahab kaakkoon, mihin kartta sen sijoittaa, ja Tall al-Umayri, noin 10 km Ammanista etelään lentokentän tien varrella, jota ehdottaa siellä vuodesta 1984 kaivanut Madaba Plains Project. Umayrissa on yksi rautakauden I varhaisimmista ja parhaiten säilyneistä nelihuoneisista taloista sekä sinetinjälki Baalisin, Jeremian mainitseman ammonilaiskuninkaan, virkamiehestä."
  vi:
    - "A-bên Kê-ra-mim, “đồng cỏ của các vườn nho”, đánh dấu giới hạn cuộc truy kích người Am-môn của Giép-thê: “Người đánh bại chúng nó từ A-rô-e cho đến Mi-nít, và cho đến A-bên-Kê-ra-mim, cùng chiếm lấy của chúng nó hai mươi cái thành. Ấy là một trận-bại rất lớn”. Bản King James dịch tên này là “đồng bằng của các vườn nho”, còn Kinh Thánh Synodal tiếng Nga giữ nó làm địa danh. Eusebius biết một làng trồng nho tên là Abela cách Phi-la-đen-phi, tức Ráp-ba của người Am-môn, nay là Amman, sáu dặm La Mã; bản Latinh của Hieronymus ghi là bảy."
    - "Địa điểm này chưa được xác định. Các đề xuất gồm Khirbet es-Suq ở phía nam Amman, Na'ur ở phía tây nam (Grollenberg), Sahab ở phía đông nam, nơi bản đồ đặt nó, và Tall al-Umayri, cách Amman khoảng 10 km về phía nam theo đường ra sân bay, do Madaba Plains Project, khai quật tại đó từ năm 1984, đề nghị. Umayri có một trong những ngôi nhà bốn gian sớm nhất và được bảo tồn tốt nhất của thời Đồ Sắt I, cùng một dấu ấn con dấu của một quan chức của Ba-a-lít, vua Am-môn được Giê-rê-mi nhắc đến."
  ro:
    - "Abel-Cheramim, „pajiștea viilor”, marchează limita urmăririi amoniților de către Ieftae: „Și i-a bătut pre ei dela Aroir până la intrarea în Semenit, douăzeci de cetăți, și până la viile lui Avel, cu bătae mare foarte”. Versiunea King James traduce numele prin „câmpia viilor”, în timp ce Biblia sinodală rusă îl păstrează ca nume de loc. Eusebiu cunoștea un sat al viilor numit Abela, la șase mile romane de Filadelfia, adică Raba amoniților, astăzi Amman; versiunea latină a lui Ieronim spune șapte."
    - "Locul nu a fost identificat. Printre propuneri se numără Khirbet es-Suq, la sud de Amman, Na'ur, la sud-vest (Grollenberg), Sahab, la sud-est, unde îl așază harta, și Tall al-Umayri, la aproximativ 10 km sud de Amman, lângă drumul aeroportului, propus de Madaba Plains Project, care face săpături acolo din 1984. La Umayri se află una dintre cele mai vechi și mai bine păstrate case cu patru încăperi din epoca fierului I și o amprentă de sigiliu a unui demnitar al lui Baalis, regele amoniților pomenit de Ieremia."
  bg:
    - "Авел-Керамим, „ливада на лозята“, бележи края на преследването на амонците от Йефтай: „та ги порази от Ароир дори до Минит, двадесет градове, и до Авел-керамим с поражение твърде голямо“. Библията на крал Джеймс превежда името като „равнината на лозята“, докато руската Синодална Библия го запазва като име на място. Евсевий знаел село на лозя на име Абела на шест римски мили от Филаделфия, амонската Рава, днешен Аман; латинският превод на Йероним казва седем."
    - "Мястото не е установено. Предложенията включват Хирбет ес-Сук на юг от Аман, Наур на югозапад (Гроленберг), Сахаб на югоизток, където го поставя картата, и Тал ал-Умайри, на около 10 км южно от Аман по пътя към летището, който предполага проектът „Равнините на Мадаба“, разкопаващ там от 1984 г. В Умайри има една от най-ранните и най-добре запазени къщи с четири помещения от Желязната епоха I и печатен отпечатък на служител на Ваалис, амонския цар, споменат от Йеремия."
