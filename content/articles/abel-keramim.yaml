# Overview article (ADR 0007). Abel-keramim is unidentified: Tall al-Umayri (Madaba Plains Project), Khirbet es-Suq and Na'ur are shown; the map's point at Sahab is one of the proposed sites. The KJV translates the name.
id: abel-keramim
