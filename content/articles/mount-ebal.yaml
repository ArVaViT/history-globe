# Overview article (ADR 0007). Mainstream facts only; Zertal's "altar" and the lead tablet are reported as disputed; the Samaritan reading of Deuteronomy 27:4 is noted without judgement.
id: mount-ebal
place: aa5cc66
title:
  en: "Mount Ebal"
  ru: "Гевал"
  uk: "Гевал"
  es: "Monte Ebal"
  pt: "Monte Ebal"
  de: "Ebal"
  fr: "Mont Ébal"
body:
  en:
    - "Mount Ebal is the bare northern mountain of the pass of Shechem, 940 m high, facing Gerizim across the narrow valley in which Nablus now lies; it is one of the highest summits of the hills of Samaria. Abram's first stopping place in the land, the oak of Moreh at Shechem, lay in this valley. The Law appointed the two mountains for the ceremony after the crossing of the Jordan: “thou shalt put the blessing upon mount Gerizim, and the curse upon mount Ebal”, six tribes standing on each, and on Ebal great stones plastered and inscribed with the Law and “an altar of stones: thou shalt not lift up any iron tool upon them”."
    - "Joshua carried it out after Ai: he “built an altar unto the LORD God of Israel in mount Ebal”, offered burnt and peace offerings, wrote on the stones a copy of the law, and read all its words, the blessings and the curses, before the whole assembly standing half toward Gerizim and half toward Ebal. The Samaritan Pentateuch reads Gerizim, not Ebal, for the altar in Deuteronomy 27:4, in keeping with its own holy mountain, and some critics think that the older reading; the Jewish text and the Septuagint have Ebal. Josephus retells the ceremony near Shechem, while Eusebius, followed by Jerome, placed the two mountains near Jericho and Gilgal and said the Samaritans were wrong to show them at Neapolis."
    - "Adam Zertal's survey of Manasseh found on the mountain's northern slope a large stone structure of the late thirteenth and twelfth centuries BC, which he excavated in 1982–1989: a filled rectangular platform with a ramp, surrounded by courtyards, with ashes and the burnt bones of cattle, sheep, goats and fallow deer, and no pig. He identified it as Joshua's altar; Aharon Kempinski answered that it was a farmhouse and watchtower, and others see a cult site without naming its builders, so the claim remains disputed. A tiny folded lead tablet sifted from Zertal's dumps, announced in 2022 and published in 2023 as a curse naming the God of Israel, is read so by its publishers; other scholars doubt that it bears any legible writing, and some take it for a net weight. The mountain overlooks Nablus, and in 2021 Palestinian road works damaged part of the site's outer wall."
  ru:
    - "Гора Гевал — голая северная гора Сихемского прохода высотой 940 м, стоящая против Гаризима через узкую долину, в которой теперь лежит Наблус; это одна из высочайших вершин Самарийских гор. В этой долине была первая стоянка Аврама в земле — дубрава Море у Сихема. Закон назначил обе горы для обряда после перехода Иордана: «произнеси благословение на горе Гаризим, а проклятие на горе Гевал», по шести колен на каждой, а на Гевале — большие камни, обмазанные известью и надписанные Законом, и «жертвенник из камней, не поднимая на них железа»."
    - "Иисус Навин исполнил это после Гая: он «устроил жертвенник Господу Богу Израилеву на горе Гевал», принёс всесожжения и мирные жертвы, написал на камнях список с закона и прочитал все его слова, благословение и проклятие, перед всем собранием, стоявшим половиной у Гаризима и половиной у Гевала. Самаритянское Пятикнижие читает во Второзаконии 27:4 не Гевал, а Гаризим, в согласии со своей святой горой, и некоторые критики считают это чтение более древним; еврейский текст и Септуагинта дают Гевал. Иосиф Флавий пересказывает обряд у Сихема, а Евсевий, а за ним Иероним, помещали обе горы у Иерихона и Галгала и говорили, что самаряне ошибаются, показывая их у Неаполя."
    - "Обследование Манассии Адама Зерталя нашло на северном склоне горы большое каменное сооружение конца XIII–XII веков до н. э., которое он раскапывал в 1982–1989 годах: засыпанную прямоугольную платформу с пандусом, окружённую дворами, с золой и обожжёнными костями коров, овец, коз и ланей и без единой свиной. Он отождествил его с жертвенником Иисуса Навина; Аарон Кемпински возразил, что это усадьба со сторожевой башней, другие видят культовое место, не называя строителей, так что утверждение остаётся спорным. Крошечную свёрнутую свинцовую табличку из отвалов Зерталя издатели в 2022–2023 годах прочли как проклятие с именем Бога Израилева; другие учёные сомневаются, есть ли на ней вообще различимые буквы, а некоторые считают её грузилом для сети. Гора возвышается над Наблусом, а в 2021 году палестинские дорожные работы повредили часть внешней стены памятника."
  uk:
    - "Гевал — гола північна гора проходу Сихема заввишки 940 м, що стоїть навпроти Гарізіму через вузьку долину, в якій тепер лежить Наблус; це одна з найвищих вершин пагорбів Самарії. Перша зупинка Аврама в цій землі, дубрава Море в Сихемі, лежала в цій долині. Закон призначив дві гори для церемонії після переходу Йордану: «принеси благословеннє на Геризім горі а прокляттє на Ебаль горі», шість племен на кожній, а на Гевалі — великі камені, побілені вапном і з написаним Законом, і «камяного жертівника; не замахнеш над ним зелїзом»."
    - "Ісус Навин виконав це після Гаю: «спорудив Йозуа жертівника Господеві, Богу Ізрайлевому, на Гебал горі», приніс всепалення й мирні жертви, написав на каменях відпис закону і прочитав усі його слова, благословення й прокляття, перед усім зібранням, що стояло наполовину в бік Гарізіму, наполовину в бік Гевалу. Самарянське П’ятикнижжя читає Гарізім, а не Гевал, для жертовника в Повторенні Закону 27:4, відповідно до власної святої гори, і деякі критики вважають це давнішим читанням; єврейський текст і Септуагінта мають Гевал. Йосиф Флавій переказує церемонію поблизу Сихема, а Євсевій, за ним Ієронім, розміщували дві гори поблизу Єрихону й Гілгала й казали, що самаряни помиляються, показуючи їх у Неаполі."
    - "Розвідка Адама Церталя в Манасії знайшла на північному схилі гори велику кам’яну споруду кінця XIII і XII ст. до н. е., яку він розкопував 1982–1989 рр.: заповнену прямокутну платформу з рампою, оточену подвір’ями, із золою та спаленими кістками великої рогатої худоби, овець, кіз і лані, але без свині. Він ототожнив її з жертовником Ісуса Навина; Аарон Кемпінський відповів, що це була садиба й сторожова вежа, а інші бачать культове місце, не називаючи будівників, тож твердження залишається спірним. Крихітну складену свинцеву табличку, просіяну зі звалищ Церталя, оголошену 2022 р. і опубліковану 2023 р. як прокляття, що називає Бога Ізраїлю, так читають її видавці; інші вчені сумніваються, що на ній є будь-який читабельний напис, а деякі вважають її за грузило для сітки. Гора височіє над Наблусом, і 2021 р. палестинські дорожні роботи пошкодили частину зовнішнього муру місця."
  es:
    - "El monte Ebal es la montaña septentrional y desnuda del paso de Siquem, de 940 m de altura, frente al Gerizim al otro lado del estrecho valle donde hoy se encuentra Nablus; es una de las cumbres más altas de las colinas de Samaria. La primera parada de Abram en la tierra, la encina de Moré en Siquem, estaba en este valle. La Ley designó las dos montañas para la ceremonia tras el cruce del Jordán: «pondrás la bendición sobre el monte Gerizim, y la maldición sobre el monte Ebal», con seis tribus en cada una, y en el Ebal grandes piedras revocadas e inscritas con la Ley y «altar de piedras: no alzarás sobre ellas hierro»."
    - "Josué la cumplió después de Hai: «edificó un altar á Jehová Dios de Israel en el monte de Ebal», ofreció holocaustos y sacrificios pacíficos, escribió en las piedras una copia de la ley y leyó todas sus palabras, las bendiciones y las maldiciones, ante toda la asamblea, de pie mitad hacia el Gerizim y mitad hacia el Ebal. El Pentateuco samaritano lee Gerizim, no Ebal, para el altar de Deuteronomio 27:4, de acuerdo con su propia montaña santa, y algunos críticos piensan que es la lectura más antigua; el texto judío y la Septuaginta tienen Ebal. Josefo vuelve a contar la ceremonia cerca de Siquem, mientras que Eusebio, seguido por Jerónimo, situó las dos montañas cerca de Jericó y Gilgal y dijo que los samaritanos se equivocaban al mostrarlas en Neápolis."
    - "La prospección de Adam Zertal en Manasés halló en la ladera norte de la montaña una gran estructura de piedra de fines del siglo XIII y del XII a. C., que excavó en 1982–1989: una plataforma rectangular rellena con una rampa, rodeada de patios, con cenizas y huesos quemados de vacuno, ovejas, cabras y gamos, y ningún cerdo. La identificó como el altar de Josué; Aharon Kempinski respondió que era una granja y atalaya, y otros ven un sitio de culto sin nombrar a sus constructores; la afirmación sigue discutida. Una diminuta tablilla de plomo plegada, cribada de los escombros de Zertal, anunciada en 2022 y publicada en 2023 como maldición que nombra al Dios de Israel, la leen así sus editores; otros dudan de que tenga escritura legible, y algunos la toman por pesa de red. La montaña domina Nablus, y en 2021 obras viales palestinas dañaron parte del muro exterior."
  pt:
    - "O monte Ebal é a montanha nua do norte da passagem de Siquém, com 940 m de altura, de frente para o Gerizim do outro lado do estreito vale em que hoje se situa Nablus; é um dos cumes mais altos das colinas de Samaria. O primeiro pouso de Abrão na terra, o carvalho de Moré em Siquém, ficava neste vale. A Lei designou as duas montanhas para a cerimônia após a travessia do Jordão: “vocês colocarão a bênção sobre o monte Gerizim, e a maldição sobre o monte Ebal”, seis tribos em cada uma, e no Ebal grandes pedras revestidas de cal e inscritas com a Lei e “um altar de pedras. Vocês não usarão nenhuma ferramenta de ferro sobre elas”."
    - "Josué a cumpriu depois de Ai: “construiu um altar ao SENHOR, o Deus de Israel, no monte Ebal”, ofereceu holocaustos e ofertas pacíficas, escreveu nas pedras uma cópia da lei e leu todas as suas palavras, as bênçãos e as maldições, diante de toda a assembleia, metade em frente ao Gerizim e metade em frente ao Ebal. O Pentateuco Samaritano lê Gerizim, e não Ebal, para o altar em Deuteronômio 27:4, em harmonia com sua própria montanha santa, e alguns críticos pensam que essa é a leitura mais antiga; o texto judaico e a Septuaginta trazem Ebal. Josefo reconta a cerimônia perto de Siquém, enquanto Eusébio, seguido por Jerônimo, situou as duas montanhas perto de Jericó e Gilgal e disse que os samaritanos erravam ao mostrá-las em Neápolis."
    - "A prospecção de Manassés por Adam Zertal achou na encosta norte uma grande estrutura de pedra do fim do século XIII e do XII a.C., que ele escavou em 1982–1989: uma plataforma retangular de aterro com rampa, cercada de pátios, com cinzas e ossos queimados de gado, ovelhas, cabras e gamos, e nenhum de porco. Ele a identificou como o altar de Josué; Aharon Kempinski respondeu que era casa de fazenda e torre de vigia, e outros veem um sítio de culto sem nomear seus construtores, e a afirmação é disputada. Uma minúscula tabuinha de chumbo dobrada, peneirada dos entulhos de Zertal, anunciada em 2022 e publicada em 2023 como maldição que nomeia o Deus de Israel, é lida assim por seus editores; outros duvidam que haja escrita legível, e alguns a tomam por peso de rede. A montanha domina Nablus; em 2021, obras viárias palestinas danificaram parte do muro externo do sítio."
  de:
    - "Der Ebal ist der kahle nördliche Berg des Passes von Sichem, 940 m hoch, dem Garizim gegenüber über dem engen Tal, in dem heute Nablus liegt; er ist einer der höchsten Gipfel des Berglands von Samaria. Abrams erste Station im Land, der Hain More bei Sichem, lag in diesem Tal. Das Gesetz bestimmte die beiden Berge für die Zeremonie nach der Überquerung des Jordan: „sollst den Segen sprechen lassen auf dem Berge Garizim und den Fluch auf dem Berge Ebal“, sechs Stämme standen auf jedem, und auf dem Ebal sollten große, getünchte Steine mit dem Gesetz beschrieben werden und „einen steinernen Altar, darüber kein Eisen fährt“."
    - "Josua führte es nach Ai aus: „Da baute Josua dem HERRN, dem Gott Israels, einen Altar auf dem Berge Ebal“, opferte Brand- und Dankopfer, schrieb auf die Steine eine Abschrift des Gesetzes und las alle seine Worte, die Segnungen und die Flüche, vor der ganzen Gemeinde vor, die zur Hälfte zum Garizim und zur Hälfte zum Ebal gewandt stand. Der Samaritanische Pentateuch liest in 5. Mose 27,4 für den Altar Garizim statt Ebal, in Übereinstimmung mit dem eigenen heiligen Berg, und manche Kritiker halten das für die ältere Lesart; der jüdische Text und die Septuaginta haben Ebal. Josephus erzählt die Zeremonie bei Sichem nach, während Eusebius, dem Hieronymus folgte, die beiden Berge nahe Jericho und Gilgal ansetzte und sagte, die Samaritaner irrten, wenn sie sie bei Neapolis zeigten."
    - "Adam Zertals Survey in Manasse fand am Nordhang eine große Steinstruktur des späten 13. und 12. Jahrhunderts v. Chr., die er 1982–1989 ausgrub: eine gefüllte rechteckige Plattform mit Rampe, von Höfen umgeben, mit Asche und verbrannten Knochen von Rindern, Schafen, Ziegen und Damhirschen, aber ohne Schwein. Er hielt sie für Josuas Altar; Aharon Kempinski hielt sie für ein Gehöft mit Wachturm, andere für einen Kultplatz ohne Nennung seiner Erbauer, die Behauptung bleibt umstritten. Ein winziges gefaltetes Bleitäfelchen aus Zertals Aushub, 2022 angekündigt und 2023 als Fluch mit Nennung des Gottes Israels veröffentlicht, wird von seinen Herausgebern so gelesen; andere bezweifeln lesbare Schrift, manche halten es für ein Netzgewicht. Der Berg überblickt Nablus, und 2021 beschädigten palästinensische Straßenarbeiten einen Teil der Außenmauer des Fundorts."
  fr:
    - "Le mont Ébal est la montagne nue du nord du défilé de Sichem, haute de 940 m, faisant face au Garizim de l’autre côté de l’étroite vallée où se trouve aujourd’hui Naplouse ; c’est l’un des plus hauts sommets des collines de Samarie. Le premier lieu d’arrêt d’Abram dans le pays, les chênes de Moré à Sichem, se trouvait dans cette vallée. La Loi désigna les deux montagnes pour la cérémonie qui suivrait la traversée du Jourdain : « tu prononceras la bénédiction sur la montagne de Garizim, et la malédiction sur la montagne d’Ébal », six tribus se tenant sur chacune, et sur l’Ébal de grandes pierres enduites de chaux et gravées de la Loi, et « un autel de pierres, sur lesquelles tu ne porteras point le fer »."
    - "Josué l’exécuta après Aï : il « bâtit un autel à l’Éternel, le Dieu d’Israël, sur le mont Ébal », offrit des holocaustes et des sacrifices d’actions de grâces, écrivit sur les pierres une copie de la loi, et en lut toutes les paroles, les bénédictions et les malédictions, devant toute l’assemblée, moitié tournée vers le Garizim et moitié vers l’Ébal. Le Pentateuque samaritain lit Garizim, non Ébal, pour l’autel de Deutéronome 27:4, conformément à sa propre montagne sainte, et certains critiques y voient la leçon plus ancienne ; le texte juif et la Septante ont Ébal. Flavius Josèphe raconte de nouveau la cérémonie près de Sichem, tandis qu’Eusèbe, suivi de Jérôme, plaçait les deux montagnes près de Jéricho et de Guilgal et disait que les Samaritains avaient tort de les montrer à Néapolis."
    - "L’enquête d’Adam Zertal sur Manassé a trouvé sur sa pente nord une grande structure de pierre de la fin du XIIIe et du XIIe siècle av. J.-C., qu’il a fouillée en 1982–1989 : plate-forme rectangulaire remplie, à rampe, entourée de cours, avec cendres et os brûlés de bovins, moutons, chèvres et daims, sans porc. Il y a vu l’autel de Josué ; Aharon Kempinski a répondu : ferme et tour de guet ; d’autres y voient un lieu de culte sans nommer ses bâtisseurs, et la thèse reste discutée. Une minuscule tablette de plomb pliée, tamisée dans les déblais de Zertal, annoncée en 2022, publiée en 2023 comme une malédiction nommant le Dieu d’Israël, est lue ainsi par ses éditeurs ; d’autres doutent d’une écriture lisible, certains y voyant un poids de filet. La montagne domine Naplouse, et en 2021 des travaux routiers palestiniens ont endommagé une partie du mur extérieur du site."
