body:
  en:
    - "Mount Ebal is the bare northern mountain of the pass of Shechem, 940 m high, facing Gerizim across the narrow valley in which Nablus now lies; it is one of the highest summits of the hills of Samaria. Abram's first stopping place in the land, the oak of Moreh at Shechem, lay in this valley. The Law appointed the two mountains for the ceremony after the crossing of the Jordan: “thou shalt put the blessing upon mount Gerizim, and the curse upon mount Ebal”, six tribes standing on each, and on Ebal great stones plastered and inscribed with the Law and “an altar of stones: thou shalt not lift up any iron tool upon them”."
    - "Joshua carried it out after Ai: he “built an altar unto the LORD God of Israel in mount Ebal”, offered burnt and peace offerings, wrote on the stones a copy of the law, and read all its words, the blessings and the curses, before the whole assembly standing half toward Gerizim and half toward Ebal. The Samaritan Pentateuch reads Gerizim, not Ebal, for the altar in Deuteronomy 27:4, in keeping with its own holy mountain, and some critics think that the older reading; the Jewish text and the Septuagint have Ebal. Josephus retells the ceremony near Shechem, while Eusebius, followed by Jerome, placed the two mountains near Jericho and Gilgal and said the Samaritans were wrong to show them at Neapolis."
    - "Adam Zertal's survey of Manasseh found on the mountain's northern slope a large stone structure of the late thirteenth and twelfth centuries BC, which he excavated in 1982–1989: a filled rectangular platform with a ramp, surrounded by courtyards, with ashes and the burnt bones of cattle, sheep, goats and fallow deer. He identified it as Joshua's altar; Aharon Kempinski answered that it was a farmhouse and watchtower, and others see a cult site without naming its builders, so the claim remains disputed. A tiny folded lead tablet sifted from Zertal's dumps, announced in 2022 and published in 2023 as a curse naming the God of Israel, is read so by its publishers; other scholars doubt that it bears any legible writing, and some take it for a net weight. The mountain overlooks Nablus, and in 2021 Palestinian road works damaged part of the site's outer wall."
  ru:
    - "Гора Гевал — голая северная гора Сихемского прохода высотой 940 м, стоящая против Гаризима через узкую долину, в которой теперь лежит Наблус; это одна из высочайших вершин Самарийских гор. В этой долине была первая стоянка Аврама в земле — дубрава Море у Сихема. Закон назначил обе горы для обряда после перехода Иордана: «произнеси благословение на горе Гаризим, а проклятие на горе Гевал», по шести колен на каждой, а на Гевале — большие камни, обмазанные известью и надписанные Законом, и «жертвенник из камней, не поднимая на них железа»."
    - "Иисус Навин исполнил это после Гая: он «устроил жертвенник Господу Богу Израилеву на горе Гевал», принёс всесожжения и мирные жертвы, написал на камнях список с закона и прочитал все его слова, благословение и проклятие, перед всем собранием, стоявшим половиной у Гаризима и половиной у Гевала. Самаритянское Пятикнижие читает во Второзаконии 27:4 не Гевал, а Гаризим, в согласии со своей святой горой, и некоторые критики считают это чтение более древним; еврейский текст и Септуагинта дают Гевал. Иосиф Флавий пересказывает обряд у Сихема, а Евсевий, а за ним Иероним, помещали обе горы у Иерихона и Галгала и говорили, что самаряне ошибаются, показывая их у Неаполя."
    - "Обследование Манассии Адама Зерталя нашло на северном склоне горы большое каменное сооружение конца XIII–XII веков до н. э., которое он раскапывал в 1982–1989 годах: засыпанную прямоугольную платформу с пандусом, окружённую дворами, с золой и обожжёнными костями коров, овец, коз и ланей. Он отождествил его с жертвенником Иисуса Навина; Аарон Кемпински возразил, что это усадьба со сторожевой башней, другие видят культовое место, не называя строителей, так что утверждение остаётся спорным. Крошечную свёрнутую свинцовую табличку из отвалов Зерталя издатели в 2022–2023 годах прочли как проклятие с именем Бога Израилева; другие учёные сомневаются, есть ли на ней вообще различимые буквы, а некоторые считают её грузилом для сети. Гора возвышается над Наблусом, а в 2021 году палестинские дорожные работы повредили часть внешней стены памятника."
  uk:
    - "Гевал — гола північна гора проходу Сихема заввишки 940 м, що стоїть навпроти Гарізіму через вузьку долину, в якій тепер лежить Наблус; це одна з найвищих вершин пагорбів Самарії. Перша зупинка Аврама в цій землі, дубрава Море в Сихемі, лежала в цій долині. Закон призначив дві гори для церемонії після переходу Йордану: «принеси благословеннє на Геризім горі а прокляттє на Ебаль горі», шість племен на кожній, а на Гевалі — великі камені, побілені вапном і з написаним Законом, і «камяного жертівника; не замахнеш над ним зелїзом»."
    - "Ісус Навин виконав це після Гаю: «спорудив Йозуа жертівника Господеві, Богу Ізрайлевому, на Гебал горі», приніс всепалення й мирні жертви, написав на каменях відпис закону і прочитав усі його слова, благословення й прокляття, перед усім зібранням, що стояло наполовину в бік Гарізіму, наполовину в бік Гевалу. Самарянське П’ятикнижжя читає Гарізім, а не Гевал, для жертовника в Повторенні Закону 27:4, відповідно до власної святої гори, і деякі критики вважають це давнішим читанням; єврейський текст і Септуагінта мають Гевал. Йосиф Флавій переказує церемонію поблизу Сихема, а Євсевій, за ним Ієронім, розміщували дві гори поблизу Єрихону й Гілгала й казали, що самаряни помиляються, показуючи їх у Неаполі."
    - "Розвідка Адама Церталя в Манасії знайшла на північному схилі гори велику кам’яну споруду кінця XIII і XII ст. до н. е., яку він розкопував 1982–1989 рр.: заповнену прямокутну платформу з рампою, оточену подвір’ями, із золою та спаленими кістками великої рогатої худоби, овець, кіз і лані. Він ототожнив її з жертовником Ісуса Навина; Аарон Кемпінський відповів, що це була садиба й сторожова вежа, а інші бачать культове місце, не називаючи будівників, тож твердження залишається спірним. Крихітну складену свинцеву табличку, просіяну зі звалищ Церталя, оголошену 2022 р. і опубліковану 2023 р. як прокляття, що називає Бога Ізраїлю, так читають її видавці; інші вчені сумніваються, що на ній є будь-який читабельний напис, а деякі вважають її за грузило для сітки. Гора височіє над Наблусом, і 2021 р. палестинські дорожні роботи пошкодили частину зовнішнього муру місця."
  es:
    - "El monte Ebal es la montaña septentrional y desnuda del paso de Siquem, de 940 m de altura, frente al Gerizim al otro lado del estrecho valle donde hoy se encuentra Nablus; es una de las cumbres más altas de las colinas de Samaria. La primera parada de Abram en la tierra, la encina de Moré en Siquem, estaba en este valle. La Ley designó las dos montañas para la ceremonia tras el cruce del Jordán: «pondrás la bendición sobre el monte Gerizim, y la maldición sobre el monte Ebal», con seis tribus en cada una, y en el Ebal grandes piedras revocadas e inscritas con la Ley y «altar de piedras: no alzarás sobre ellas hierro»."
    - "Josué la cumplió después de Hai: «edificó un altar á Jehová Dios de Israel en el monte de Ebal», ofreció holocaustos y sacrificios pacíficos, escribió en las piedras una copia de la ley y leyó todas sus palabras, las bendiciones y las maldiciones, ante toda la asamblea, de pie mitad hacia el Gerizim y mitad hacia el Ebal. El Pentateuco samaritano lee Gerizim, no Ebal, para el altar de Deuteronomio 27:4, de acuerdo con su propia montaña santa, y algunos críticos piensan que es la lectura más antigua; el texto judío y la Septuaginta tienen Ebal. Josefo vuelve a contar la ceremonia cerca de Siquem, mientras que Eusebio, seguido por Jerónimo, situó las dos montañas cerca de Jericó y Gilgal y dijo que los samaritanos se equivocaban al mostrarlas en Neápolis."
    - "La prospección de Adam Zertal en Manasés halló en la ladera norte de la montaña una gran estructura de piedra de fines del siglo XIII y del XII a. C., que excavó en 1982–1989: una plataforma rectangular rellena con una rampa, rodeada de patios, con cenizas y huesos quemados de vacuno, ovejas, cabras y gamos. La identificó como el altar de Josué; Aharon Kempinski respondió que era una granja y atalaya, y otros ven un sitio de culto sin nombrar a sus constructores; la afirmación sigue discutida. Una diminuta tablilla de plomo plegada, cribada de los escombros de Zertal, anunciada en 2022 y publicada en 2023 como maldición que nombra al Dios de Israel, la leen así sus editores; otros dudan de que tenga escritura legible, y algunos la toman por pesa de red. La montaña domina Nablus, y en 2021 obras viales palestinas dañaron parte del muro exterior."
  pt:
    - "O monte Ebal é a montanha nua do norte da passagem de Siquém, com 940 m de altura, de frente para o Gerizim do outro lado do estreito vale em que hoje se situa Nablus; é um dos cumes mais altos das colinas de Samaria. O primeiro pouso de Abrão na terra, o carvalho de Moré em Siquém, ficava neste vale. A Lei designou as duas montanhas para a cerimônia após a travessia do Jordão: “vocês colocarão a bênção sobre o monte Gerizim, e a maldição sobre o monte Ebal”, seis tribos em cada uma, e no Ebal grandes pedras revestidas de cal e inscritas com a Lei e “um altar de pedras. Vocês não usarão nenhuma ferramenta de ferro sobre elas”."
    - "Josué a cumpriu depois de Ai: “construiu um altar ao SENHOR, o Deus de Israel, no monte Ebal”, ofereceu holocaustos e ofertas pacíficas, escreveu nas pedras uma cópia da lei e leu todas as suas palavras, as bênçãos e as maldições, diante de toda a assembleia, metade em frente ao Gerizim e metade em frente ao Ebal. O Pentateuco Samaritano lê Gerizim, e não Ebal, para o altar em Deuteronômio 27:4, em harmonia com sua própria montanha santa, e alguns críticos pensam que essa é a leitura mais antiga; o texto judaico e a Septuaginta trazem Ebal. Josefo reconta a cerimônia perto de Siquém, enquanto Eusébio, seguido por Jerônimo, situou as duas montanhas perto de Jericó e Gilgal e disse que os samaritanos erravam ao mostrá-las em Neápolis."
    - "A prospecção de Manassés por Adam Zertal achou na encosta norte uma grande estrutura de pedra do fim do século XIII e do XII a.C., que ele escavou em 1982–1989: uma plataforma retangular de aterro com rampa, cercada de pátios, com cinzas e ossos queimados de gado, ovelhas, cabras e gamos. Ele a identificou como o altar de Josué; Aharon Kempinski respondeu que era casa de fazenda e torre de vigia, e outros veem um sítio de culto sem nomear seus construtores, e a afirmação é disputada. Uma minúscula tabuinha de chumbo dobrada, peneirada dos entulhos de Zertal, anunciada em 2022 e publicada em 2023 como maldição que nomeia o Deus de Israel, é lida assim por seus editores; outros duvidam que haja escrita legível, e alguns a tomam por peso de rede. A montanha domina Nablus; em 2021, obras viárias palestinas danificaram parte do muro externo do sítio."
  de:
    - "Der Ebal ist der kahle nördliche Berg des Passes von Sichem, 940 m hoch, dem Garizim gegenüber über dem engen Tal, in dem heute Nablus liegt; er ist einer der höchsten Gipfel des Berglands von Samaria. Abrams erste Station im Land, der Hain More bei Sichem, lag in diesem Tal. Das Gesetz bestimmte die beiden Berge für die Zeremonie nach der Überquerung des Jordan: „sollst den Segen sprechen lassen auf dem Berge Garizim und den Fluch auf dem Berge Ebal“, sechs Stämme standen auf jedem, und auf dem Ebal sollten große, getünchte Steine mit dem Gesetz beschrieben werden und „einen steinernen Altar, darüber kein Eisen fährt“."
    - "Josua führte es nach Ai aus: „Da baute Josua dem HERRN, dem Gott Israels, einen Altar auf dem Berge Ebal“, opferte Brand- und Dankopfer, schrieb auf die Steine eine Abschrift des Gesetzes und las alle seine Worte, die Segnungen und die Flüche, vor der ganzen Gemeinde vor, die zur Hälfte zum Garizim und zur Hälfte zum Ebal gewandt stand. Der Samaritanische Pentateuch liest in 5. Mose 27,4 für den Altar Garizim statt Ebal, in Übereinstimmung mit dem eigenen heiligen Berg, und manche Kritiker halten das für die ältere Lesart; der jüdische Text und die Septuaginta haben Ebal. Josephus erzählt die Zeremonie bei Sichem nach, während Eusebius, dem Hieronymus folgte, die beiden Berge nahe Jericho und Gilgal ansetzte und sagte, die Samaritaner irrten, wenn sie sie bei Neapolis zeigten."
    - "Adam Zertals Survey in Manasse fand am Nordhang eine große Steinstruktur des späten 13. und 12. Jahrhunderts v. Chr., die er 1982–1989 ausgrub: eine gefüllte rechteckige Plattform mit Rampe, von Höfen umgeben, mit Asche und verbrannten Knochen von Rindern, Schafen, Ziegen und Damhirschen. Er hielt sie für Josuas Altar; Aharon Kempinski hielt sie für ein Gehöft mit Wachturm, andere für einen Kultplatz ohne Nennung seiner Erbauer, die Behauptung bleibt umstritten. Ein winziges gefaltetes Bleitäfelchen aus Zertals Aushub, 2022 angekündigt und 2023 als Fluch mit Nennung des Gottes Israels veröffentlicht, wird von seinen Herausgebern so gelesen; andere bezweifeln lesbare Schrift, manche halten es für ein Netzgewicht. Der Berg überblickt Nablus, und 2021 beschädigten palästinensische Straßenarbeiten einen Teil der Außenmauer des Fundorts."
  fr:
    - "Le mont Ébal est la montagne nue du nord du défilé de Sichem, haute de 940 m, faisant face au Garizim de l’autre côté de l’étroite vallée où se trouve aujourd’hui Naplouse ; c’est l’un des plus hauts sommets des collines de Samarie. Le premier lieu d’arrêt d’Abram dans le pays, les chênes de Moré à Sichem, se trouvait dans cette vallée. La Loi désigna les deux montagnes pour la cérémonie qui suivrait la traversée du Jourdain : « tu prononceras la bénédiction sur la montagne de Garizim, et la malédiction sur la montagne d’Ébal », six tribus se tenant sur chacune, et sur l’Ébal de grandes pierres enduites de chaux et gravées de la Loi, et « un autel de pierres, sur lesquelles tu ne porteras point le fer »."
    - "Josué l’exécuta après Aï : il « bâtit un autel à l’Éternel, le Dieu d’Israël, sur le mont Ébal », offrit des holocaustes et des sacrifices d’actions de grâces, écrivit sur les pierres une copie de la loi, et en lut toutes les paroles, les bénédictions et les malédictions, devant toute l’assemblée, moitié tournée vers le Garizim et moitié vers l’Ébal. Le Pentateuque samaritain lit Garizim, non Ébal, pour l’autel de Deutéronome 27:4, conformément à sa propre montagne sainte, et certains critiques y voient la leçon plus ancienne ; le texte juif et la Septante ont Ébal. Flavius Josèphe raconte de nouveau la cérémonie près de Sichem, tandis qu’Eusèbe, suivi de Jérôme, plaçait les deux montagnes près de Jéricho et de Guilgal et disait que les Samaritains avaient tort de les montrer à Néapolis."
    - "L’enquête d’Adam Zertal sur Manassé a trouvé sur sa pente nord une grande structure de pierre de la fin du XIIIe et du XIIe siècle av. J.-C., qu’il a fouillée en 1982–1989 : plate-forme rectangulaire remplie, à rampe, entourée de cours, avec cendres et os brûlés de bovins, moutons, chèvres et daims. Il y a vu l’autel de Josué ; Aharon Kempinski a répondu : ferme et tour de guet ; d’autres y voient un lieu de culte sans nommer ses bâtisseurs, et la thèse reste discutée. Une minuscule tablette de plomb pliée, tamisée dans les déblais de Zertal, annoncée en 2022, publiée en 2023 comme une malédiction nommant le Dieu d’Israël, est lue ainsi par ses éditeurs ; d’autres doutent d’une écriture lisible, certains y voyant un poids de filet. La montagne domine Naplouse, et en 2021 des travaux routiers palestiniens ont endommagé une partie du mur extérieur du site."
  it:
    - "Il Monte Ebal è la spoglia montagna settentrionale del passo di Sichem, alta 940 m, di fronte al Garizim al di là della stretta valle in cui sorge oggi Nablus; è una delle vette più alte delle colline della Samaria. La prima sosta di Abramo nella terra, la quercia di Morè a Sichem, si trovava in questa valle. La Legge stabilì le due montagne per la cerimonia dopo l’attraversamento del Giordano: «tu pronunzierai la benedizione sul monte Gherizim, e la maledizione sul monte Ebal», sei tribù su ciascuno, e sull’Ebal grandi pietre intonacate e incise con la Legge e «un altare di pietre, sulle quali non passerai ferro»."
    - "Giosuè la eseguì dopo Ai: «edificò un altare all’Eterno, all’Iddio d’Israele, sul monte Ebal», offrì olocausti e sacrifici di azioni di grazie, scrisse sulle pietre una copia della legge e ne lesse tutte le parole, benedizioni e maledizioni, davanti all’assemblea, metà verso il Garizim e metà verso l’Ebal. Il Pentateuco samaritano legge Garizim, non Ebal, per l’altare di Deuteronomio 27,4, in accordo con il proprio monte santo, e alcuni critici lo ritengono la lezione più antica; il testo ebraico e la Settanta hanno Ebal. Giuseppe Flavio racconta di nuovo la cerimonia presso Sichem, mentre Eusebio, seguito da Girolamo, pose i due monti presso Gerico e Gàlgala e disse che i Samaritani sbagliavano a mostrarli a Neapoli."
    - "La ricognizione di Adam Zertal in Manasse trovò sul pendio nord una grande struttura di pietra del tardo XIII e XII secolo a.C., da lui scavata nel 1982–1989: una piattaforma rettangolare piena con rampa, circondata da cortili, con ceneri e ossa bruciate di bovini, pecore, capre e daini. La identificò con l’altare di Giosuè; Aharon Kempinski rispose che era una fattoria con torre di guardia, altri vi vedono un sito di culto senza nominarne i costruttori: la tesi resta discussa. Una minuscola tavoletta di piombo ripiegata, setacciata dai suoi detriti, annunciata nel 2022 e pubblicata nel 2023 come maledizione che nomina il Dio d’Israele, è letta così dai suoi editori; altri dubitano che rechi scrittura, e alcuni la ritengono un peso da rete. Il monte domina Nablus, e nel 2021 lavori stradali palestinesi hanno danneggiato parte del muro esterno."
  pl:
    - "Góra Ebal to naga północna góra przełęczy Sychem, wysoka na 940 m, zwrócona ku Garizim przez wąską dolinę, w której leży dziś Nablus; jest jednym z najwyższych szczytów wzgórz Samarii. Pierwsze miejsce postoju Abrama w kraju, dąb More w Sychem, leżało w tej dolinie. Prawo wyznaczyło obie góry na ceremonię po przejściu Jordanu: „dasz błogosławieństwo to na górze Garyzym, a przeklęstwo na górze Hebal”, sześć pokoleń stojących na każdej, a na Ebal wielkie kamienie otynkowane i zapisane Prawem oraz „ołtarz z kamienia; nie będziesz ich ciosał żelazem”."
    - "Jozue wykonał to po Aj: „zbudował ołtarz Panu, Bogu Izraelskiemu, na górze Hebal”, złożył całopalenia i ofiary pokojowe, napisał na kamieniach odpis prawa i odczytał wszystkie jego słowa, błogosławieństwa i przekleństwa, przed całym zgromadzeniem stojącym w połowie ku Garizim i w połowie ku Ebal. Pentateuch samarytański czyta Garizim, nie Ebal, dla ołtarza w Pwt 27,4, zgodnie z własną świętą górą, i niektórzy krytycy uważają to za czytanie starsze; tekst żydowski i Septuaginta mają Ebal. Józef Flawiusz opowiada ceremonię na nowo koło Sychem, a Euzebiusz, za którym poszedł Hieronim, umieszczał obie góry koło Jerycha i Gilgal i mówił, że Samarytanie błędnie pokazują je w Neapolis."
    - "Badanie Adama Zertala na terenie Manassesa odkryło na północnym zboczu góry dużą kamienną strukturę z końca XIII i XII w. p.n.e., którą wykopał w latach 1982–1989: wypełnioną prostokątną platformę z rampą, otoczoną dziedzińcami, z popiołem i spalonymi kośćmi bydła, owiec, kóz i danieli. Zidentyfikował ją jako ołtarz Jozuego; Aharon Kempinski odpowiedział, że to farma i wieża strażnicza, a inni widzą miejsce kultu bez wskazywania jego budowniczych, więc twierdzenie pozostaje sporne. Maleńką złożoną ołowianą tabliczkę z hałd Zertala, ogłoszoną w 2022 r. i opublikowaną w 2023 r. jako klątwę wymieniającą Boga Izraela, tak czytają ją wydawcy; inni uczeni wątpią, by zawierała jakiekolwiek czytelne pismo, a niektórzy biorą ją za ciężarek sieciowy. Góra góruje nad Nablusem, a w 2021 r. palestyńskie roboty drogowe uszkodziły część zewnętrznego muru stanowiska."
  nl:
    - "De Ebal is de kale noordelijke berg van de pas van Sichem, 940 m hoog, tegenover de Gerizim aan de overkant van het smalle dal waarin nu Nabloes ligt; het is een van de hoogste toppen van de heuvels van Samaria. Abrams eerste pleisterplaats in het land, de eik van More bij Sichem, lag in dit dal. De Wet wees de twee bergen aan voor de plechtigheid na de oversteek van de Jordaan: “dan zult gij den zegen uitspreken op den berg Gerizim, en den vloek op den berg Ebal”, zes stammen op elk, en op de Ebal grote stenen, bepleisterd en met de Wet beschreven, en “een altaar van stenen; gij zult geen ijzer over hetzelve bewegen”."
    - "Jozua voerde het uit na Ai: “Toen bouwde Jozua een altaar den HEERE, den God van Israël, op den berg Ebal”; hij bracht brand- en vredeoffers, schreef op de stenen een afschrift van de wet, en las al haar woorden, de zegeningen en de vloeken, voor de hele vergadering, die half naar de Gerizim en half naar de Ebal stond. De Samaritaanse Pentateuch leest Gerizim, niet Ebal, voor het altaar in Deuteronomium 27:4, passend bij zijn eigen heilige berg, en sommige critici houden dat voor de oudere lezing; de joodse tekst en de Septuaginta hebben Ebal. Josephus vertelt de plechtigheid na bij Sichem, terwijl Eusebius, gevolgd door Hiëronymus, de twee bergen bij Jericho en Gilgal plaatste en zei dat de Samaritanen ongelijk hadden ze bij Neapolis te tonen."
    - "Adam Zertals onderzoek van Manasse vond op de noordhelling een groot stenen bouwwerk uit de late dertiende en twaalfde eeuw v.Chr., door hem opgegraven in 1982–1989: een gevuld rechthoekig platform met helling en binnenplaatsen, met as en verbrande beenderen van runderen, schapen, geiten en damherten. Hij zag er Jozua's altaar in; Aharon Kempinski noemde het een boerderij met wachttoren, anderen een cultusplaats zonder de bouwers te noemen, dus de bewering blijft omstreden. Een klein, opgevouwen loden tabletje uit Zertals stortplaatsen, aangekondigd in 2022 en in 2023 gepubliceerd als vloek die de God van Israël noemt, wordt door zijn uitgevers zo gelezen; andere geleerden betwijfelen of er leesbaar schrift op staat, sommigen zien een netgewicht. De berg overziet Nabloes; in 2021 beschadigden Palestijnse wegwerkzaamheden een deel van de buitenmuur."
  cs:
    - "Hora Ébal je holá severní hora průsmyku Šekemu, vysoká 940 m, protilehlá Gerizimu přes úzké údolí, v němž dnes leží Nábulus; je jedním z nejvyšších vrcholů samařských pahorků. První zastávka Abramova v zemi, dub Móre u Šekemu, ležela v tomto údolí. Zákon určil obě hory pro obřad po přechodu Jordánu: „dáš požehnání toto na hoře Garizim, a zlořečení na hoře Hébal“, šest kmenů stálo na každé, a na Ébalu velké kameny omítnuté a popsané Zákonem a „oltář z kamenů, jichž nebudeš tesati železem“."
    - "Jozue to provedl po Aji: „vzdělal Jozue oltář Hospodinu Bohu Izraelskému na hoře Hébal“, obětoval oběti zápalné a pokojné, napsal na kameny opis zákona a přečetl všechna jeho slova, požehnání i zlořečení, před celým shromážděním stojícím zpola proti Gerizimu a zpola proti Ébalu. Samaritánský Pentateuch čte pro oltář v Deuteronomiu 27,4 Gerizim, ne Ébal, v souladu s vlastní svatou horou, a někteří kritikové to pokládají za starší čtení; židovský text a Septuaginta mají Ébal. Josephus převypráví obřad u Šekemu, kdežto Eusebius, za ním Jeroným, kladl obě hory poblíž Jericha a Gilgalu a řekl, že se Samaritáni mýlí, když je ukazují v Neapoli."
    - "Průzkum Manasesova území Adama Zertala nalezl na severním svahu hory velkou kamennou stavbu z konce 13. a z 12. století př. n. l., kterou vykopával v letech 1982–1989: vyplněnou obdélníkovou plošinu s rampou, obklopenou nádvořími, s popelem a spálenými kostmi skotu, ovcí, koz a daňků. Označil ji za Jozuův oltář; Aharon Kempinski odpověděl, že šlo o statek a strážní věž, a jiní vidí kultovní místo, aniž pojmenují jeho stavitele, takže tvrzení zůstává sporné. Maličká složená olověná destička nalezená prosíváním Zertalových výsypek, oznámená roku 2022 a zveřejněná roku 2023 jako kletba jmenující Boha Izraele, je tak čtena svými vydavateli; jiní badatelé pochybují, že nese jakékoli čitelné písmo, a někteří ji pokládají za závaží sítě. Hora shlíží na Nábulus a roku 2021 poškodily palestinské silniční práce část vnější zdi naleziště."
  sv:
    - "Berget Ebal är det kala norra berget vid passet i Shekem, 940 m högt, mitt emot Gerisim över den smala dalen där Nablus nu ligger; det är en av Samarias högsta toppar. Abrams första uppehållsplats i landet, eken i More vid Shekem, låg i denna dal. Lagen föreskrev de två bergen för ceremonin efter övergången över Jordan: ”skall du låta berget Gerissim bliva platsen för välsignelsen och berget Ebal platsen för förbannelsen”, sex stammar på vardera, och på Ebal stora stenar bestrukna med kalk och inskrivna med lagen, och ”ett altare av stenar, vid vilka du icke skall komma med något järn”."
    - "Josua genomförde det efter Ai: ”Då byggde Josua åt HERREN, Israels Gud, ett altare på berget Ebal”, offrade brännoffer och tackoffer, skrev på stenarna en avskrift av lagen och läste upp alla dess ord, välsignelserna och förbannelserna, inför hela församlingen som stod hälften mot Gerisim och hälften mot Ebal. Den samaritanska Pentateuken läser Gerisim, inte Ebal, för altaret i Femte Mosebok 27:4, i överensstämmelse med sitt eget heliga berg, och vissa kritiker anser att det är den äldre läsningen; den judiska texten och Septuaginta har Ebal. Josefus återberättar ceremonin nära Shekem, medan Eusebios, följd av Hieronymus, förlade de två bergen nära Jeriko och Gilgal och sade att samariterna hade fel när de visade dem vid Neapolis."
    - "Adam Zertals undersökning av Manasse fann på bergets norra sluttning en stor stenstruktur från slutet av 1200-talet och 1100-talet f.Kr., som han grävde ut 1982–1989: en fylld rektangulär plattform med ramp, omgiven av gårdar, med aska och brända ben av nötkreatur, får, getter och dovhjort. Han identifierade den som Josuas altare; Aharon Kempinski svarade att det var en gård och ett vakttorn, och andra ser en kultplats utan att namnge byggarna, så påståendet förblir omtvistat. En liten hopvikt blytavla som siktats fram ur Zertals avfall, tillkännagiven 2022 och publicerad 2023 som en förbannelse som nämner Israels Gud, läses så av dem som publicerade den; andra forskare betvivlar att den bär någon läsbar skrift, och några tar den för ett nätsänke. Berget tornar upp sig över Nablus, och 2021 skadade palestinska vägarbeten en del av platsens yttermur."
  nb:
    - "Ebal er det nakne nordlige fjellet ved passet til Sikem, 940 m høyt, vendt mot Garisim over den trange dalen der Nablus nå ligger; det er en av de høyeste toppene i åsene i Samaria. Abrams første stoppested i landet, Mores eik ved Sikem, lå i denne dalen. Loven utpekte de to fjellene for seremonien etter overgangen over Jordan: «da skal du lyse velsignelsen på fjellet Garisim og forbannelsen på fjellet Ebal», med seks stammer på hvert, og på Ebal skulle store steiner pusses og beskrives med loven og «et alter av stener; du skal ikke bruke jern på dem»."
    - "Josva gjennomførte det etter Ai: han bygget «et alter for Herren, Israels Gud, på Ebal-fjellet», ofret brennoffer og takkoffer, skrev på steinene en avskrift av loven og leste opp alle dens ord, velsignelsene og forbannelsene, for hele forsamlingen som sto halvt mot Garisim og halvt mot Ebal. Den samaritanske Pentateuk har Garisim, ikke Ebal, for alteret i Femte Mosebok 27,4, i samsvar med deres eget hellige fjell, og noen kritikere mener at det er den eldre lesemåten; den jødiske teksten og Septuaginta har Ebal. Josefus gjenforteller seremonien nær Sikem, mens Eusebius, fulgt av Hieronymus, plasserte de to fjellene nær Jeriko og Gilgal og sa at samaritanene tok feil da de viste dem ved Neapolis."
    - "Adam Zertals kartlegging av Manasse fant på fjellets nordlige skråning en stor steinkonstruksjon fra slutten av 1200-tallet og 1100-tallet f.Kr., som han gravde ut i 1982–1989: en fylt rektangulær plattform med en rampe, omgitt av gårdsrom, med aske og brente bein av storfe, sauer, geiter og dådyr. Han identifiserte den som Josvas alter; Aharon Kempinski svarte at det var en gård og et vakttårn, og andre ser et kultsted uten å navngi byggerne, så påstanden forblir omstridt. En liten sammenfoldet blytavle siktet ut fra Zertals avfallshauger, kunngjort i 2022 og utgitt i 2023 som en forbannelse som nevner Israels Gud, leses slik av utgiverne; andre forskere betviler at den bærer noe leselig skrift, og noen tar den for et nettlodd. Fjellet ser ned på Nablus, og i 2021 skadet palestinske veiarbeider en del av stedets ytre mur."
  tl:
    - "Ang Bundok Ebal ay ang hubad na hilagang bundok ng daanan ng Sichem, 940 m ang taas, nakaharap sa Gerizim sa kabila ng makitid na libis kung saan nakatayo ang Nablus ngayon; isa ito sa pinakamataas na tuktok ng mga burol ng Samaria. Ang unang tigil ni Abram sa lupain, ang encina ng Moreh sa Sichem, ay nasa libis na ito. Itinakda ng Kautusan ang dalawang bundok para sa seremonya pagkatawid sa Jordan: “iyong ilalagay ang pagpapala sa bundok ng Gerizim, at ang sumpa sa bundok ng Ebal”, na anim na lipi ang nakatayo sa bawat isa, at sa Ebal ay mga batong malalaki na pinlasteran at sinulatan ng Kautusan at “isang dambana na mga bato; huwag mong pagbubuhatan ang mga ito ng kasangkapang bakal”."
    - "Isinagawa ito ni Josue pagkatapos ng Ai: “ipinagtayo ni Josue ng isang dambana ang Panginoon, ang Dios ng Israel, sa bundok ng Ebal”, naghandog ng handog na susunugin at pangkapayapaan, sumulat sa mga bato ng sipi ng kautusan, at binasa ang lahat ng salita nito, ang mga pagpapala at ang mga sumpa, sa buong kapulungang nakatayo nang kalahati sa Gerizim at kalahati sa Ebal. Binabasa ng Pentateuko ng mga Samaritano ang Gerizim, hindi Ebal, para sa dambana sa Deuteronomio 27:4, ayon sa sarili nilang banal na bundok, at iniisip ng ilang kritiko na iyon ang mas matanda; ang tekstong Judio at ang Septuaginta ay may Ebal. Isinasalaysay muli ni Josefo ang seremonya malapit sa Sichem, samantalang inilagay ni Eusebio, na sinundan ni Jeronimo, ang dalawang bundok malapit sa Jerico at Gilgal at sinabing mali ang mga Samaritano na ipakita ang mga ito sa Neapolis."
    - "Sa hilagang dalisdis ng bundok, natagpuan ng pagsisiyasat ni Adam Zertal sa Manases ang malaking istrukturang bato ng huling ika-13 at ika-12 siglo BK, hinukay niya noong 1982–1989: pinunong parihabang plataporma na may rampa at patyo sa paligid, abo at sunog na buto ng baka, tupa, kambing at usa. Dambana ni Josue ito ayon sa kaniya; sagot ni Aharon Kempinski, bahay-bukid at tanod-tore, at pook ng pagsamba ayon sa iba nang di pinangalanan ang nagtayo, kaya pinagtatalunan pa. Maliit na nakatuping lamina ng tingga mula sa tambak ni Zertal, inanunsiyo noong 2022 at nilathala noong 2023 bilang sumpang nagpapangalan sa Diyos ng Israel, ayon sa naglathala; duda ang ibang iskolar na may nababasang sulat ito, at timbang ng lambat ayon sa ilan. Tinatanaw ng bundok ang Nablus; noong 2021, nasira ng gawaing-daan ng mga Palestino ang bahagi ng panlabas na pader nito."
  da:
    - "Ebal er det nøgne nordlige bjerg ved Sikems pas, 940 m højt, der ser over mod Garizim på tværs af den smalle dal, hvor Nablus nu ligger; det er en af de højeste toppe i Samarias bjerge. Abrams første opholdssted i landet, Mores eg ved Sikem, lå i denne dal. Loven bestemte de to bjerge til ceremonien efter krydsningen af Jordan: du skal »lyse Velsignelsen paa det Bjerg Garizim og Forbandelsen paa det Bjerg Ebal«, seks stammer på hvert, og på Ebal store sten, kalket og indskrevne med Loven, og »et Alter af Sten, du skal ikke røre Jern over dem«."
    - "Josva gennemførte det efter Aj: »Da byggede Josva Herren, Israels Gud, et Alter paa Ebals Bjerg«, ofrede brændofre og takofre, skrev på stenene en afskrift af loven og læste alle dens ord, velsignelserne og forbandelserne, for hele forsamlingen, der stod halvt mod Garizim og halvt mod Ebal. Den samaritanske Pentateuk læser Garizim, ikke Ebal, for alteret i Femte Mosebog 27,4, i overensstemmelse med deres eget hellige bjerg, og nogle kritikere mener, at det er den ældre læsning; den jødiske tekst og Septuaginta har Ebal. Josefus genfortæller ceremonien nær Sikem, mens Eusebios, fulgt af Hieronymus, placerede de to bjerge nær Jeriko og Gilgal og sagde, at samaritanerne tog fejl ved at vise dem ved Neapolis."
    - "Adam Zertals undersøgelse af Manasse fandt på bjergets nordlige skråning en stor stenkonstruktion fra det sene 1200-tal og 1100-tallet f.Kr., som han udgravede i 1982–1989: en opfyldt rektangulær platform med en rampe, omgivet af gårde, med aske og de brændte knogler af kvæg, får, geder og dådyr. Han identificerede den som Josvas alter; Aharon Kempinski svarede, at det var en gård og et vagttårn, og andre ser et kultsted uden at navngive dets bygherrer, så påstanden er stadig omstridt. En lille foldet blytavle, sigtet frem af Zertals dynger, bekendtgjort i 2022 og udgivet i 2023 som en forbandelse, der nævner Israels Gud, læses sådan af dens udgivere; andre forskere tvivler på, at den bærer nogen læselig skrift, og nogle tager den for en nettyngde. Bjerget ser ned over Nablus, og i 2021 beskadigede palæstinensiske vejarbejder en del af stedets ydre mur."
  sr:
    - "Гевал је гола северна гора кланца Сихема, висока 940 м, окренута Гаризиму преко уске долине у којој сада лежи Наблус; један је од највиших врхова брда Самарије. Аврамово прво стајалиште у земљи, храст Море код Сихема, лежало је у овој долини. Закон је одредио две горе за обред после прелаза Јордана: „изреци благослов онај на гори Гаризину, а проклетство на гори Евалу“, са по шест племена на свакој, а на Евалу велико камење малтерисано и исписано Законом и „олтар од камења, али га немој гвожђем тесати“."
    - "Исус Навин га је извршио после Аија: „Исус начини олтар Господу Богу Израиљевом на гори Евалу“, принео жртве паљенице и захвалне, написао на камењу препис закона и прочитао све његове речи, благослове и проклетства, пред целим збором који је стајао половином према Гаризину а половином према Евалу. Самаријанско Петокњижје чита Гаризим, а не Евал, за олтар у Поновљеном закону 27,4, у складу са својом светом гором, и неки критичари мисле да је то старије читање; јеврејски текст и Септуагинта имају Евал. Јосиф Флавије препричава обред близу Сихема, док су Јевсевије, а за њим Јероним, сместили две горе близу Јерихона и Галгала и рекли да Самаријанци греше показујући их у Неапољу."
    - "Истраживање Манасије, које је водио Адам Цертал, нашло је на северној падини горе велику камену структуру из касног XIII и XII века п. н. е., коју је ископавао 1982–1989: испуњену правоугаону платформу са рампом, окружену двориштима, с пепелом и спаљеним костима говеда, оваца, коза и јелена лопатара. Поистоветио ју је с Исусовим олтаром; Арон Кемпински одговорио је да је то фарма и стражарница, а други виде култно место без именовања градитеља, па тврдња остаје спорна. Мала савијена оловна плочица просејана из Церталових одлагалишта, саопштена 2022. и објављена 2023. као проклетство које именује Бога Израиљевог, тако се чита по својим издавачима; други научници сумњају да носи било какво читко писмо, а неки је узимају за нето тежину. Гора надгледа Наблус, а 2021. палестински путни радови оштетили су део спољног зида налазишта."
  hu:
    - "Az Ébál-hegy a sikemi hágó kopár északi hegye, 940 m magas, a Garizimmal szemben, a keskeny völgy túloldalán, ahol ma Nablusz fekszik; Szamária dombjainak egyik legmagasabb csúcsa. Ábrám első megállóhelye az országban, Móré tölgye Sikemnél, ebben a völgyben volt. A Törvény e két hegyet jelölte ki a szertartásra a Jordánon való átkelés után: „mondd el az áldást a Garizim hegyén, az átkot pedig az Ebál hegyén”, mindegyiken hat törzs állva, és az Ébálon a Törvénnyel bevakolt és felírt nagy kövek, és oltár: „olyan kövekből való oltárt, a melyeket vassal meg ne faragj”."
    - "Józsué az Aj után végrehajtotta: „oltárt építe Józsué az Úrnak, Izráel Istenének Ebál hegyén”, égő- és hálaáldozatot mutatott be, a kövekre felírta a törvény másolatát, és felolvasta minden szavát, az áldásokat és átkokat, az egész gyülekezet előtt, amely félig a Garizim, félig az Ébál felé állt. A szamaritánus Pentateuchus a Mózes ötödik könyve 27,4-ben az oltárhoz Ébál helyett Garizimot olvas, saját szent hegyének megfelelően, és egyes kritikusok ezt tartják régebbi olvasatnak; a zsidó szöveg és a Septuaginta Ébált ír. Josephus Sikem közelében mondja el a szertartást, Eusebius pedig, őt követve Hieronymus, a két hegyet Jerikó és Gilgál közelébe helyezte, és azt mondta, a szamaritánusok tévednek, amikor Neapoliszban mutatják."
    - "Adam Zertal Manassé-felmérése a hegy északi lejtőjén egy Kr. e. 13. század végi és 12. századi nagy kőszerkezetet talált, amelyet 1982–1989-ben ásott ki: feltöltött téglalap alakú emelvény rámpával, udvarokkal körülvéve, marhák, juhok, kecskék és dámszarvasok hamujával és égett csontjaival. Józsué oltáraként azonosította; Aharon Kempinski azt válaszolta, hogy tanya és őrtorony volt, mások kultikus helyet látnak, építőik megnevezése nélkül, így az állítás vitatott marad. Egy apró, összehajtott ólomtáblát, amelyet Zertal hányóiból szitáltak ki, 2022-ben jelentettek be, 2023-ban közöltek Izráel Istenét megnevező átokként, és kiadói így olvassák; más tudósok kétlik, hogy bármilyen olvasható írást hordozna, és egyesek hálónehezéknek tartják. A hegy Nablusz fölé magasodik, és 2021-ben palesztin útépítés megrongálta a lelőhely külső falának egy részét."
  fi:
    - "Ebalvuori on Sikemin solan paljas pohjoinen vuori, 940 m korkea, joka on Garisiminvuoren vastapäätä kapean laakson toisella puolella, jossa Nablus nykyään sijaitsee; se on Samarian kukkuloiden korkeimpia huippuja. Abramin ensimmäinen pysähdyspaikka maassa, Moren tammi Sikemissä, oli tässä laaksossa. Laki määräsi molemmat vuoret seremoniaan Jordanin ylittämisen jälkeen: ”tee Garissimin vuoresta siunauksen paikka ja Eebalin vuoresta kirouksen paikka”, kuusi sukukuntaa kummallakin, ja Ebalille suuret kalkilla sivellyt ja lailla kirjoitetut kivet ja ”alttari kivistä, joihin et saa rauta-aseella koskea”."
    - "Joosua toteutti sen Ain jälkeen: ”Joosua rakensi Eebalin vuorelle alttarin Herralle, Israelin Jumalalle”, uhrasi polttouhreja ja yhteysuhreja, kirjoitti kiviin jäljennöksen laista ja luki kaikki sen sanat, siunaukset ja kiroukset, koko kansankokoukselle, joka seisoi puoliksi Garisimia kohti ja puoliksi Ebalia kohti. Samarialainen Pentateukki lukee Viidennen Mooseksen kirjan 27:4:n alttarin kohdalla Garisimin, ei Ebalin, oman pyhän vuorensa mukaisesti, ja jotkut kriitikot pitävät sitä vanhempana lukutapana; juutalainen teksti ja Septuaginta lukevat Ebal. Josephus kertoo seremonian uudelleen Sikemin lähellä, kun taas Eusebios, Hieronymuksen seuraamana, sijoitti molemmat vuoret Jerikon ja Gilgalin lähelle ja sanoi samarialaisten erehtyvän näyttäessään ne Neapolisissa."
    - "Adam Zertalin Manassen maastotutkimus löysi vuoren pohjoisrinteeltä suuren kivirakennelman 1200-luvun lopulta ja 1100-luvulta eaa., jonka hän kaivoi vuosina 1982–1989: täytetty suorakulmainen alusta ramppeineen, pihojen ympäröimänä, tuhkaa sekä nautojen, lampaiden, vuohien ja kuusipeurojen palaneita luita. Hän tunnisti sen Joosuan alttariksi; Aharon Kempinski vastasi sen olleen maatila ja vartiotorni, ja toiset näkevät kulttipaikan nimeämättä rakentajia, joten väite on kiistanalainen. Zertalin kaatopaikoilta seulottu pieni taitettu lyijylevy, joka julkistettiin 2022 ja julkaistiin 2023 Israelin Jumalan nimeävänä kirouksena, luetaan niin julkaisijoidensa mukaan; toiset epäilevät, että siinä on mitään luettavaa, ja jotkut pitävät sitä verkonpainona. Vuori on Nablusin yläpuolella, ja vuonna 2021 palestiinalaiset tietyöt vaurioittivat osaa paikan ulkomuurista."
  vi:
    - "Núi Ê-banh là ngọn núi trụi phía bắc của đèo Si-chem, cao 940 m, đối diện Ga-ri-xim qua thung lũng hẹp nơi Nablus nay nằm; đó là một trong những đỉnh cao nhất của các đồi Sa-ma-ri. Nơi dừng chân đầu tiên của Áp-ram trong xứ, cây dẻ bộp của Mô-rê tại Si-chem, nằm trong thung lũng này. Luật pháp chỉ định hai ngọn núi cho nghi lễ sau khi qua sông Giô-đanh: “phải rao sự chúc lành trên núi Ga-ri-xim, và sự chúc dữ trên núi Ê-banh”, sáu chi phái đứng mỗi núi, và trên Ê-banh có những tảng đá lớn thoa vôi khắc luật pháp và “một bàn thờ bằng đá; chớ nên tra đồ bằng sắt vào nó”."
    - "Giô-suê thực hiện sau trận A-hi: ông “lập một bàn thờ cho Giê-hô-va Đức Chúa Trời của Y-sơ-ra-ên tại trên núi Ê-banh”, dâng của lễ thiêu và thù ân, khắc trên đá bản sao luật pháp, và đọc mọi lời, sự chúc lành và chúc dữ, trước cả hội chúng, một nửa đứng hướng Ga-ri-xim và một nửa hướng Ê-banh. Ngũ Kinh Sa-ma-ri đọc Ga-ri-xim, không phải Ê-banh, cho bàn thờ trong Phục truyền 27:4, phù hợp với núi thánh của họ, và một số nhà phê bình cho đó là cách đọc xưa hơn; bản Do Thái và Septuagint có Ê-banh. Josephus thuật lại nghi lễ gần Si-chem, còn Eusebius, được Jerome theo, đặt hai ngọn núi gần Giê-ri-cô và Ghinh-ganh và nói người Sa-ma-ri sai khi chỉ chúng ở Neapolis (Nablus)."
    - "Cuộc khảo sát Ma-na-se của Adam Zertal tìm thấy trên sườn bắc của núi một công trình đá lớn cuối thế kỷ 13 và thế kỷ 12 TCN, ông khai quật năm 1982–1989: một nền chữ nhật được lấp, có dốc, bao quanh bởi các sân, với tro và xương cháy của bò, cừu, dê và hươu nâu. Ông đồng nhất nó với bàn thờ của Giô-suê; Aharon Kempinski đáp rằng đó là nhà trại và tháp canh, và những người khác thấy một nơi thờ tự mà không nêu người xây, nên nhận định vẫn tranh cãi. Một phiến chì nhỏ gấp lại sàng ra từ đống đất của Zertal, công bố năm 2022 và xuất bản năm 2023 là một lời nguyền nêu Đức Chúa Trời của Y-sơ-ra-ên, được người xuất bản đọc như vậy; các học giả khác nghi ngờ nó có chữ đọc được, và một số coi là quả cân lưới. Ngọn núi nhìn xuống Nablus, và năm 2021 công trình đường của người Palestine làm hư một phần tường ngoài của địa điểm."
  ro:
    - "Muntele Ebal este muntele nordic gol al trecătorii Sihemului, înalt de 940 m, față în față cu Garizimul peste valea îngustă în care se află astăzi Nablus; este una dintre cele mai înalte culmi ale dealurilor Samariei. Primul popas al lui Avram în țară, stejarul lui Moreh de la Sihem, se afla în această vale. Legea a rânduit cei doi munți pentru ceremonia de după trecerea Iordanului: „vei da binecuvântarea în muntele Garizin și blestemul în muntele Gheval”, șase seminții stând pe fiecare, iar pe Ebal pietre mari tencuite și înscrise cu Legea și „jertfelnic de pietre, să nu pui preste el fier”."
    - "Iosua a împlinit-o după Ai: „a zidit Isus jertfelnic Domnului Dumnezeului lui Israil în muntele Gheval”, a adus arderi de tot și jertfe de pace, a scris pe pietre o copie a legii și a citit toate cuvintele ei, binecuvântările și blestemele, înaintea întregii adunări, stând pe jumătate spre Garizim și pe jumătate spre Ebal. Pentateuhul samaritean citește Garizim, nu Ebal, pentru jertfelnicul din Deuteronom 27:4, în acord cu muntele lor sfânt, și unii critici socotesc aceasta lectura mai veche; textul iudaic și Septuaginta au Ebal. Iosif Flaviu povestește ceremonia lângă Sihem, în timp ce Eusebiu, urmat de Ieronim, a așezat cei doi munți lângă Ierihon și Ghilgal și a spus că samaritenii greșesc arătându-i la Neapolis."
    - "Cercetările lui Adam Zertal în Manase au găsit pe versantul nordic o mare construcție de piatră din sfârșitul secolului al XIII-lea și din al XII-lea î.Hr., pe care a excavat-o în 1982–1989: o platformă dreptunghiulară umplută, cu rampă, înconjurată de curți, cu cenușă și oase arse de vite, oi, capre și cerbi lopătari. El a identificat-o drept jertfelnicul lui Iosua; Aharon Kempinski a răspuns că era o fermă cu turn de pază, iar alții văd un loc de cult fără ziditori numiți, deci afirmația rămâne disputată. O tăbliță de plumb pliată, cernută din haldele sale, anunțată în 2022 și publicată în 2023 ca un blestem care numește Dumnezeul lui Israel, este citită așa de editori; alții se îndoiesc că poartă scriere lizibilă, iar unii o iau drept greutate de plasă. Muntele domină Nablus; în 2021 lucrări rutiere palestiniene au deteriorat o parte din zidul exterior."
  bg:
    - "Гевал е голата северна планина на прохода при Сихем, висока 940 м, срещу Гаризим от другата страна на тясната долина, в която днес се намира Наблус; тя е един от най-високите върхове на Самарийските възвишения. Първото място, където Аврам спрял в земята, дъбът на Море при Сихем, е бил в тази долина. Законът отреди двете планини за церемонията след преминаването на Йордан: „да положиш благословението на гората Гаризин, а клетвата на гората Гевал“, като на всяка стояли по шест племена, а на Гевал — големи камъни, измазани и надписани със Закона, и „олтар от камене: желязо да не подигнеш върх тях“."
    - "Иисус Навин изпълни това след Гай: той „съгради… олтар на Господа Бога Израилева на гората Гевал“, принесе всеизгаряния и мирни жертви, написа на камъните препис от закона и прочете всичките му думи, благословенията и клетвите, пред цялото събрание, застанало наполовина към Гаризим и наполовина към Гевал. Самарянското Петокнижие чете Гаризим, а не Гевал, за олтара във Второзаконие 27:4, в съгласие със собствената си свята планина, и някои критици смятат това за по-старото четене; юдейският текст и Септуагинта имат Гевал. Йосиф Флавий преразказва церемонията близо до Сихем, докато Евсевий, последван от Йероним, поставя двете планини близо до Йерихон и Галгал и казва, че самаряните грешат, като ги показват при Неапол."
    - "При проучването си в Манасия Адам Зертал открива на северния склон голяма каменна постройка от края на XIII и XII в. пр.н.е., която той разкопава през 1982–1989 г.: запълнена правоъгълна платформа с рампа, обградена с дворове, с пепел и изгорени кости от говеда, овце, кози и елени лопатари. Той я отъждествява с олтара на Иисус Навин; Аарон Кемпински отговаря, че това е ферма и стражева кула, други виждат култово място, без да назовават строителите му, и твърдението остава спорно. Миниатюрна сгъната оловна плочка, пресята от насипите на Зертал, обявена през 2022 г. и публикувана през 2023 г. като проклятие, назоваващо Бога на Израил, се чете така от издателите си; други учени се съмняват, че по нея има четлив надпис, а някои я смятат за тежест за мрежа. Планината гледа към Наблус, а през 2021 г. палестински пътни работи повреждат част от външната стена на обекта."
