# Overview article (ADR 0007). Mainstream facts only; the identification of Gibeah with Tell el-Ful and the date of its fortress are named as disputed; no absolute dates are given for Saul.
id: gibeah
place: ac24f5f
title:
  en: "Gibeah"
  ru: "Гива"
  uk: "Гіва"
  es: "Gabaa"
  pt: "Gibeá"
  de: "Gibea"
  fr: "Guibea"
  pl: "Gibea"
  it: "Gabaa"
