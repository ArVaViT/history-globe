body:
  en:
    - 'Gibeah, whose name means "hill", was a town of Benjamin, also called Gibeah of Benjamin and Gibeah of Saul. It is usually identified with Tell el-Ful, a hill on the ridge road about 5 km north of ancient Jerusalem; Josephus puts "the Hill of Saul" about thirty furlongs from the city. The identification is not certain: Edward Robinson looked for Gibeah at Jaba, the site of Geba, and Israel Finkelstein has rejected Tell el-Ful. W. F. Albright began excavating the hill in 1922, and Paul Lapp dug a third campaign there in 1964.'
    - 'Albright found a fortified tower and ascribed its first phase to Saul; Finkelstein dates its building to the period of Assyrian rule and sees it as a watchtower on the northern approach to Jerusalem, so the date of the fortress remains disputed. In Judges, a Levite and his concubine lodged at Gibeah on their way home; men of the town abused the woman until she died. All Israel went up against Gibeah, Benjamin defended it, and after two defeats the tribes took the town by ambush and set it on fire. Hosea later recalled it in the words "as in the days of Gibeah".'
    - "Gibeah was the home of Saul, the first king of Israel. After he was chosen king, Saul went home to Gibeah, and there messengers came from besieged Jabesh-gilead to ask for help. During his war with the Philistines, Saul and his men held Gibeah of Benjamin while the enemy camped at Michmash, and after his break with Samuel, Saul went to his house at Gibeah of Saul. Later the Gibeonites asked for seven of Saul's descendants to hang them in Gibeah of Saul. Isaiah, describing an army marching on Jerusalem from the north, says that Gibeah of Saul has fled, and Hosea calls for the horn to be blown in Gibeah and Ramah."
    - "A fort stood on Tell el-Ful again in Hellenistic times. In AD 70 Titus, marching on Jerusalem, camped in the Valley of Thorns near a village that Josephus calls Gabaothsaul, the Hill of Saul. In his letter of AD 404 on the death of Paula, Jerome describes her pilgrimage and says that she stopped at Gibeah, now a complete ruin, and recalled the story of the concubine."
  ru:
    - "Гива, чьё имя означает «холм», — город Вениаминов, называемый также Гивой Вениаминовой и Гивой Сауловой. Обычно её отождествляют с Телль-эль-Фулем — холмом у дороги по хребту примерно в 5 км к северу от древнего Иерусалима; Иосиф Флавий помещает «холм Саула» примерно в тридцати стадиях от города. Отождествление не бесспорно: Эдвард Робинсон искал Гиву в Джабе, на месте Гевы, а Израиль Финкельштейн отверг Телль-эль-Фуль. Уильям Олбрайт начал раскопки холма в 1922 г., а Пол Лапп провёл здесь третий сезон в 1964 г."
    - "Олбрайт нашёл укреплённую башню и приписал её первый этап Саулу; Финкельштейн относит её постройку ко времени ассирийского владычества и видит в ней сторожевую башню на северном подступе к Иерусалиму, так что время постройки крепости остаётся спорным. В Книге Судей левит с наложницей остановились на ночлег в Гиве по пути домой; жители города надругались над женщиной, и она умерла. Весь Израиль пошёл на Гиву, Вениамин защищал её, и после двух поражений колена взяли город из засады и сожгли. Позже Осия вспоминал об этом словами «как во дни Гивы»."
    - "В Гиве был дом Саула, первого царя Израиля. После избрания Саул пошёл в свой дом в Гиву, и туда пришли послы из осаждённого Иависа Галаадского просить о помощи. Во время войны с филистимлянами Саул и его люди держали Гиву Вениаминову, а враги стояли станом в Михмасе; после разрыва с Самуилом Саул пошёл в свой дом, в Гиву Саулову. Позднее гаваонитяне потребовали семерых потомков Саула, чтобы повесить их в Гиве Саула. Исаия, описывая войско, идущее на Иерусалим с севера, говорит, что Гива Саулова разбежалась, а Осия призывает трубить рогом в Гиве и трубою в Раме."
    - "В эллинистическое время на Телль-эль-Фуле снова стояло укрепление. В 70 г. н. э. Тит, идя на Иерусалим, разбил лагерь в Долине терний близ селения, которое Иосиф Флавий называет «холмом Саула». В письме 404 г. н. э. о кончине Павлы Иероним описывает её паломничество и рассказывает, что она остановилась в Гиве, которая тогда лежала в полных развалинах, и вспомнила историю наложницы."
  uk:
    - "Гіва, назва якої означає «пагорб», була містом Веніямина, яке також називали Гівою Веніяминовою та Гівою Сауловою. Її зазвичай ототожнюють із Телль-ель-Фул — пагорбом біля хребтової дороги приблизно за 5 км на північ від стародавнього Єрусалима; Йосиф Флавій розміщує «Пагорб Саула» приблизно за тридцять стадій від міста. Це ототожнення не певне: Едвард Робінсон шукав Гіву в Джабі, на місці Геби, а Ізраель Фінкельштейн відкинув Телль-ель-Фул. В. Ф. Олбрайт почав розкопувати пагорб 1922 року, а Пол Лапп провів там третю кампанію 1964 року."
    - "Олбрайт знайшов укріплену вежу й приписав її першу фазу Саулові; Фінкельштейн датує її будівництво добою ассирійського панування й бачить у ній сторожову вежу на північному підході до Єрусалима, тож дата фортеці лишається спірною. У Книзі Суддів левіт зі своєю наложницею заночував у Гіві по дорозі додому; чоловіки міста наруговувалися над жінкою, доки вона не померла. Увесь Ізраїль виступив проти Гіви, Веніямин її боронив, і після двох поразок коліна взяли місто засідкою й підпалили його. Осія пізніше згадав її словами «як за часів Гиви»."
    - "Гіва була домівкою Саула, першого царя Ізраїлю. Після обрання царем Саул пішов додому в Гіву, і там з’явилися посли з обложеного Явіса Гілеадського просити допомоги. Під час його війни з філістимлянами Саул і його люди тримали Гіву Веніяминову, а ворог стояв табором у Міхмасі, а після розриву із Самуїлом Саул пішов до свого дому в Гіві Сауловій. Пізніше гаваонці попросили сімох нащадків Саула, щоб повісити їх у Гіві Саула. Ісая, описуючи військо, що йде на Єрусалим з півночі, каже, що Гіва Саулова розбіглася, а Осія закликає сурмити рогом у Гіві й Рамі."
    - "Фортеця знову стояла на Телль-ель-Фул за еллінізму. 70 р. н. е. Тит, ідучи на Єрусалим, отаборився в Долині Терну поблизу села, яке Йосиф Флавій називає Габаотсаул, Пагорб Саула. У своєму листі 404 року про смерть Павли Ієронім описує її прощу й каже, що вона зупинилася в Гіві, нині цілковитій руїні, і згадала історію наложниці."
  es:
    - "Gabaa, cuyo nombre significa «colina», era una población de Benjamín, llamada también Gabaa de Benjamín y Gabaa de Saúl. Suele identificarse con Tell el-Ful, una colina en el camino de la loma, a unos 5 km al norte de la antigua Jerusalén; Josefo sitúa «la Colina de Saúl» a unos treinta estadios de la ciudad. La identificación no es segura: Edward Robinson buscó Gabaa en Jaba, el sitio de Geba, e Israel Finkelstein ha rechazado Tell el-Ful. W. F. Albright comenzó a excavar la colina en 1922, y Paul Lapp realizó allí una tercera campaña en 1964."
    - "Albright halló una torre fortificada y atribuyó su primera fase a Saúl; Finkelstein fecha su construcción en el período del dominio asirio y la ve como una atalaya en el acceso norte a Jerusalén, de modo que la fecha de la fortaleza sigue discutida. En Jueces, un levita y su concubina se hospedaron en Gabaa de camino a casa; los hombres de la ciudad abusaron de la mujer hasta que murió. Todo Israel subió contra Gabaa, Benjamín la defendió, y tras dos derrotas las tribus tomaron la ciudad con una emboscada y le prendieron fuego. Oseas la recordó más tarde con las palabras «como en los días de Gabaa»."
    - "Gabaa fue la patria de Saúl, el primer rey de Israel. Después de ser elegido rey, Saúl volvió a su casa en Gabaa, y allí llegaron mensajeros de Jabes de Galaad, sitiada, a pedir ayuda. Durante su guerra con los filisteos, Saúl y sus hombres ocuparon Gabaa de Benjamín mientras el enemigo acampaba en Micmas, y tras su ruptura con Samuel, Saúl fue a su casa en Gabaa de Saúl. Más tarde los gabaonitas pidieron siete descendientes de Saúl para ahorcarlos en Gabaa de Saúl. Isaías, al describir un ejército que marcha sobre Jerusalén desde el norte, dice que Gabaa de Saúl ha huido, y Oseas pide que se toque el cuerno en Gabaa y en Ramá."
    - "Un fuerte se alzó de nuevo en Tell el-Ful en época helenística. En el 70 d. C. Tito, en marcha sobre Jerusalén, acampó en el valle de las Espinas, cerca de una aldea que Josefo llama Gabaothsaul, la Colina de Saúl. En su carta del 404 d. C. sobre la muerte de Paula, Jerónimo describe su peregrinación y dice que se detuvo en Gabaa, entonces una ruina completa, y recordó la historia de la concubina."
  pt:
    - "Gibeá, cujo nome significa “colina”, era uma cidade de Benjamim, também chamada Gibeá de Benjamim e Gibeá de Saul. É usualmente identificada com Tell el-Ful, uma colina na estrada da crista, a cerca de 5 km ao norte da antiga Jerusalém; Josefo põe “a Colina de Saul” a cerca de trinta estádios da cidade. A identificação não é certa: Edward Robinson procurou Gibeá em Jaba, o sítio de Geba, e Israel Finkelstein rejeitou Tell el-Ful. W. F. Albright começou a escavar a colina em 1922, e Paul Lapp realizou ali uma terceira campanha em 1964."
    - "Albright achou uma torre fortificada e atribuiu a Saul a sua primeira fase; Finkelstein data sua construção do período do domínio assírio e a vê como uma torre de vigia na aproximação norte a Jerusalém, de modo que a data da fortaleza permanece disputada. Em Juízes, um levita e sua concubina se hospedaram em Gibeá a caminho de casa; homens da cidade abusaram da mulher até que ela morreu. Todo Israel subiu contra Gibeá, Benjamim a defendeu e, depois de duas derrotas, as tribos tomaram a cidade por emboscada e a incendiaram. Oseias a recordou mais tarde nas palavras “como nos dias de Gibeá”."
    - "Gibeá foi a terra de Saul, o primeiro rei de Israel. Depois de escolhido rei, Saul voltou para casa, em Gibeá, e ali chegaram mensageiros de Jabes-Gileade, sitiada, pedindo ajuda. Durante sua guerra com os filisteus, Saul e seus homens mantiveram Gibeá de Benjamim enquanto o inimigo acampava em Micmás, e depois de seu rompimento com Samuel, Saul foi para a sua casa em Gibeá de Saul. Mais tarde os gibeonitas pediram sete descendentes de Saul para enforcá-los em Gibeá de Saul. Isaías, descrevendo um exército que marcha do norte contra Jerusalém, diz que Gibeá de Saul fugiu, e Oseias manda tocar a trombeta em Gibeá e em Ramá."
    - "Um forte ergueu-se de novo em Tell el-Ful em tempos helenísticos. Em 70 d.C., Tito, marchando sobre Jerusalém, acampou no Vale dos Espinhos, perto de uma aldeia que Josefo chama Gabaotsaul, a Colina de Saul. Em sua carta de 404 d.C. sobre a morte de Paula, Jerônimo descreve a peregrinação dela e diz que ela parou em Gibeá, agora completa ruína, e recordou a história da concubina."
  de:
    - "Gibea, dessen Name „Hügel“ bedeutet, war eine Stadt Benjamins, auch Gibea Benjamins und Gibea Sauls genannt. Meist wird es mit Tell el-Ful gleichgesetzt, einem Hügel an der Höhenstraße etwa 5 km nördlich des antiken Jerusalem; Josephus setzt „den Hügel Sauls“ etwa dreißig Stadien von der Stadt an. Die Gleichsetzung ist nicht sicher: Edward Robinson suchte Gibea in Jaba, der Stätte Gebas, und Israel Finkelstein hat Tell el-Ful verworfen. W. F. Albright begann 1922 mit der Ausgrabung des Hügels, und Paul Lapp führte dort 1964 eine dritte Kampagne durch."
    - "Albright fand einen befestigten Turm und schrieb seine erste Phase Saul zu; Finkelstein datiert seinen Bau in die Zeit der assyrischen Herrschaft und sieht in ihm einen Wachturm am nördlichen Zugang nach Jerusalem, sodass die Datierung der Festung umstritten bleibt. Im Buch der Richter kehrten ein Levit und seine Nebenfrau auf dem Heimweg in Gibea ein; Männer der Stadt misshandelten die Frau, bis sie starb. Ganz Israel zog gegen Gibea, Benjamin verteidigte es, und nach zwei Niederlagen nahmen die Stämme die Stadt aus einem Hinterhalt und steckten sie in Brand. Hosea erinnerte später daran mit den Worten „wie zur Zeit Gibeas“."
    - "Gibea war die Heimat Sauls, des ersten Königs Israels. Nachdem er zum König erwählt war, ging Saul heim nach Gibea, und dort kamen Boten aus dem belagerten Jabesch in Gilead, um Hilfe zu erbitten. Im Krieg gegen die Philister hielten Saul und seine Männer Gibea Benjamins, während der Feind bei Michmas lagerte, und nach dem Bruch mit Samuel ging Saul zu seinem Haus in Gibea Sauls. Später verlangten die Gibeoniter sieben Nachkommen Sauls, um sie in Gibea Sauls aufzuhängen. Jesaja sagt, als er ein Heer beschreibt, das von Norden gegen Jerusalem zieht, Gibea Sauls fliehe, und Hosea ruft dazu auf, in Gibea das Horn zu blasen, und in Rama."
    - "Auf Tell el-Ful stand in hellenistischer Zeit wieder eine Festung. Im Jahr 70 n. Chr. lagerte Titus auf dem Marsch gegen Jerusalem im Dornental bei einem Dorf, das Josephus Gabaothsaul nennt, den Hügel Sauls. In seinem Brief von 404 n. Chr. über den Tod der Paula beschreibt Hieronymus ihre Pilgerreise und sagt, sie habe in Gibea Halt gemacht, jetzt eine völlige Ruine, und der Geschichte von der Nebenfrau gedacht."
  fr:
    - "Guibea, dont le nom signifie « colline », était une ville de Benjamin, appelée aussi Guibea de Benjamin et Guibea de Saül. On l’identifie d’ordinaire à Tell el-Ful, une colline de la route de crête à environ 5 km au nord de l’ancienne Jérusalem ; Josèphe place « la colline de Saül » à une trentaine de stades de la ville. L’identification n’est pas certaine : Edward Robinson cherchait Guibea à Jaba, site de Guéba, et Israel Finkelstein a rejeté Tell el-Ful. W. F. Albright commença à fouiller la colline en 1922, et Paul Lapp y mena une troisième campagne en 1964."
    - "Albright trouva une tour fortifiée et attribua sa première phase à Saül ; Finkelstein date sa construction de la période de la domination assyrienne et y voit une tour de guet sur l’accès nord de Jérusalem, de sorte que la date de la forteresse reste discutée. Dans les Juges, un Lévite et sa concubine logèrent à Guibea en rentrant chez eux ; des hommes de la ville abusèrent de la femme jusqu’à sa mort. Tout Israël monta contre Guibea, Benjamin la défendit, et après deux défaites les tribus prirent la ville par embuscade et y mirent le feu. Osée s’en souvint plus tard dans ces mots : « comme aux jours de Guibea »."
    - "Guibea fut la patrie de Saül, premier roi d’Israël. Après son élection, Saül rentra chez lui à Guibea, et c’est là que vinrent les messagers de Jabès en Galaad assiégée pour demander du secours. Pendant sa guerre contre les Philistins, Saül et ses hommes tenaient Guibea de Benjamin tandis que l’ennemi campait à Micmasch, et après sa rupture avec Samuel, Saül monta dans sa maison à Guibea de Saül. Plus tard, les Gabaonites demandèrent sept descendants de Saül pour les pendre à Guibea de Saül. Ésaïe, décrivant une armée qui marche sur Jérusalem depuis le nord, dit que Guibea de Saül a pris la fuite, et Osée appelle à sonner de la trompette à Guibea et à Rama."
    - "Un fort se dressa de nouveau sur Tell el-Ful à l’époque hellénistique. En 70 apr. J.-C., Titus, marchant sur Jérusalem, campa dans la vallée des Épines près d’un village que Josèphe appelle Gabaothsaül, la colline de Saül. Dans sa lettre de 404 apr. J.-C. sur la mort de Paula, Jérôme décrit son pèlerinage et dit qu’elle s’arrêta à Guibea, aujourd’hui entièrement en ruine, et se rappela l’histoire de la concubine."
  pl:
    - "Gibea, której nazwa znaczy „wzgórze”, było miastem Beniamina, zwanym też Gibeą Beniaminową i Gibeą Saulową. Utożsamia się je zwykle z Tell el-Ful, wzgórzem przy drodze grzbietowej około 5 km na północ od starożytnej Jerozolimy; Józef Flawiusz umieszcza „Wzgórze Saula” około trzydziestu stadiów od miasta. Utożsamienie nie jest pewne: Edward Robinson szukał Gibei w Jaba, na miejscu Geby, a Israel Finkelstein odrzucił Tell el-Ful. W. F. Albright rozpoczął wykopaliska na wzgórzu w 1922 r., a Paul Lapp prowadził tam trzecią kampanię w 1964 r."
    - "Albright znalazł obwarowaną wieżę i przypisał jej pierwszą fazę Saulowi; Finkelstein datuje jej budowę na okres panowania asyryjskiego i widzi w niej wieżę strażniczą na północnym podejściu do Jerozolimy, więc data twierdzy pozostaje sporna. W Księdze Sędziów Lewita i jego nałożnica nocowali w Gibei w drodze do domu; mężowie miasta znęcali się nad kobietą, aż umarła. Cały Izrael wyruszył przeciw Gibei, Beniamin ją bronił, a po dwóch klęskach pokolenia zdobyły miasto podstępem i podpaliły je. Ozeasz przypomniał je później słowami „jako za dni Gabaa”."
    - "Gibea była rodzinnym miastem Saula, pierwszego króla Izraela. Po wybraniu na króla Saul wrócił do domu w Gibei i tam przybyli posłańcy z oblężonego Jabesz-Gilead z prośbą o pomoc. Podczas wojny z Filistynami Saul i jego ludzie trzymali Gibeę Beniaminową, gdy wróg obozował w Mikmas, a po zerwaniu z Samuelem Saul poszedł do swego domu w Gibei Saulowej. Później Gibeonici prosili o siedmiu potomków Saula, aby powiesić ich w Gibei Saulowej. Izajasz, opisując wojsko idące na Jerozolimę z północy, mówi, że Gibea Saulowa uciekła, a Ozeasz wzywa, by zatrąbić w róg w Gibei i Ramie."
    - "Na Tell el-Ful znów stał fort w czasach hellenistycznych. W 70 r. n.e. Tytus, idąc na Jerozolimę, rozłożył obóz w Dolinie Cierni koło wsi, którą Józef Flawiusz nazywa Gabaothsaul, Wzgórze Saula. W liście z 404 r. n.e. o śmierci Pauli Hieronim opisuje jej pielgrzymkę i mówi, że zatrzymała się w Gibei, dziś całkowitej ruinie, i przypomniała sobie historię nałożnicy."
  it:
    - "Gabaa, il cui nome significa «colle», era una città di Beniamino, detta anche Gabaa di Beniamino e Gabaa di Saul. È di solito identificata con Tell el-Ful, una collina sulla strada di dorsale circa 5 km a nord dell’antica Gerusalemme; Giuseppe Flavio pone «il Colle di Saul» a circa trenta stadi dalla città. L’identificazione non è certa: Edward Robinson cercò Gabaa a Jaba, il sito di Gheba, e Israel Finkelstein ha respinto Tell el-Ful. W. F. Albright iniziò a scavare la collina nel 1922, e Paul Lapp vi condusse una terza campagna nel 1964."
    - "Albright trovò una torre fortificata e ne attribuì la prima fase a Saul; Finkelstein ne data la costruzione al periodo del dominio assiro e la vede come una torre di guardia sull’accesso settentrionale a Gerusalemme, così la data della fortezza resta controversa. Nei Giudici, un Levita e la sua concubina pernottarono a Gabaa sulla via del ritorno; gli uomini della città abusarono della donna fino a farla morire. Tutto Israele salì contro Gabaa, Beniamino la difese e, dopo due sconfitte, le tribù presero la città con un’imboscata e la diedero alle fiamme. Osea la ricordò più tardi con le parole «come ai giorni di Ghibea»."
    - "Gabaa fu la patria di Saul, primo re d’Israele. Dopo essere stato scelto come re, Saul tornò a casa a Gabaa, e là giunsero i messi di Iabes di Galaad assediata a chiedere aiuto. Durante la sua guerra con i Filistei, Saul e i suoi uomini occuparono Gabaa di Beniamino mentre il nemico era accampato a Micmas, e dopo la rottura con Samuele, Saul salì a casa sua a Gabaa di Saul. Più tardi i Gabaoniti chiesero sette discendenti di Saul per impiccarli a Gabaa di Saul. Isaia, descrivendo un esercito che marcia su Gerusalemme da nord, dice che Gabaa di Saul è in fuga, e Osea invita a suonare il corno a Gabaa e a Rama."
    - "Un forte sorse di nuovo su Tell el-Ful in età ellenistica. Nel 70 d.C. Tito, marciando su Gerusalemme, si accampò nella Valle delle Spine presso un villaggio che Giuseppe Flavio chiama Gabaothsaul, il Colle di Saul. Nella sua lettera del 404 d.C. sulla morte di Paola, Girolamo descrive il suo pellegrinaggio e dice che si fermò a Gabaa, ormai una rovina completa, e ricordò la storia della concubina."
  nl:
    - "Gibea, een naam die “heuvel” betekent, was een stad van Benjamin, ook Gibea van Benjamin en Gibea van Saul genoemd. Het wordt gewoonlijk vereenzelvigd met Tell el-Ful, een heuvel aan de bergweg ongeveer 5 km ten noorden van het oude Jeruzalem; Josephus plaatst “de Heuvel van Saul” op ongeveer dertig stadiën van de stad. De identificatie is niet zeker: Edward Robinson zocht Gibea bij Jaba, de plaats van Geba, en Israel Finkelstein heeft Tell el-Ful verworpen. W. F. Albright begon de heuvel in 1922 op te graven, en Paul Lapp voerde er in 1964 een derde campagne uit."
    - "Albright vond een versterkte toren en schreef de eerste fase aan Saul toe; Finkelstein dateert de bouw in de tijd van de Assyrische heerschappij en ziet er een wachttoren in op de noordelijke toegang tot Jeruzalem, zodat de datering van het fort omstreden blijft. In Richteren overnachtten een Leviet en zijn bijvrouw te Gibea op weg naar huis; mannen van de stad mishandelden de vrouw tot ze stierf. Heel Israël trok tegen Gibea op, Benjamin verdedigde het, en na twee nederlagen namen de stammen de stad in met een hinderlaag en staken haar in brand. Hosea herinnerde er later aan met de woorden “als in de dagen van Gibea”."
    - "Gibea was de woonplaats van Saul, de eerste koning van Israël. Na zijn verkiezing tot koning ging Saul naar huis, naar Gibea, en daar kwamen boden uit het belegerde Jabes in Gilead om hulp vragen. Tijdens zijn oorlog met de Filistijnen hielden Saul en zijn mannen Gibea van Benjamin bezet terwijl de vijand bij Michmas lag, en na zijn breuk met Samuël ging Saul naar zijn huis te Gibea van Saul. Later vroegen de Gibeonieten zeven nakomelingen van Saul om hen op te hangen in Gibea van Saul. Jesaja zegt, een leger beschrijvend dat vanuit het noorden naar Jeruzalem optrekt, dat Gibea van Saul gevlucht is, en Hosea roept op de bazuin te blazen in Gibea en Rama."
    - "Op Tell el-Ful stond in de hellenistische tijd opnieuw een fort. In 70 n.Chr. sloeg Titus, op weg naar Jeruzalem, zijn kamp op in het Doornendal bij een dorp dat Josephus Gabaothsaul noemt, de Heuvel van Saul. In zijn brief van 404 n.Chr. over de dood van Paula beschrijft Hieronymus haar pelgrimstocht en zegt dat zij halt hield bij Gibea, nu een volledige ruïne, en het verhaal van de bijvrouw herdacht."
  cs:
    - "Gibea, jejíž jméno znamená „pahorek“, bylo město Benjamínovo, zvané také Gibea Benjamínova a Gibea Saulova. Obvykle se ztotožňuje s Tell el-Ful, pahorkem na hřebenové cestě asi 5 km severně od starověkého Jeruzaléma; Josephus klade „Saulův pahorek“ asi třicet stadií od města. Ztotožnění není jisté: Edward Robinson hledal Gibeu v Jabě, na místě Geby, a Israel Finkelstein Tell el-Ful odmítl. W. F. Albright zahájil vykopávky na pahorku roku 1922 a Paul Lapp tam vedl třetí kampaň roku 1964."
    - "Albright nalezl opevněnou věž a první fázi připsal Saulovi; Finkelstein klade její stavbu do období asyrské vlády a vidí v ní strážní věž na severním přístupu k Jeruzalému, takže datování pevnosti zůstává sporné. V Soudcích se levita a jeho družka ubytovali v Gibeji na cestě domů; muži města týrali ženu, až zemřela. Celý Izrael vytáhl proti Gibeji, Benjamín ji bránil a po dvou porážkách kmeny město dobyly lstí ze zálohy a zapálily je. Ozeáš si je později připomněl slovy „tak jako za dnů Gabaa“."
    - "Gibea byla domovem Saula, prvního krále Izraele. Po zvolení králem se Saul vrátil domů do Gibeje a tam přišli poslové z obleženého Jábeše gileadského prosit o pomoc. Za války s Pelištejci drželi Saul a jeho muži Gibeu Benjamínovu, zatímco nepřítel tábořil u Michmasu, a po rozchodu se Samuelem šel Saul do svého domu v Gibeji Saulově. Později Gibeonští žádali sedm Saulových potomků, aby je v Gibeji Saulově pověsili. Izajáš, líčící vojsko táhnoucí na Jeruzalém ze severu, praví, že Gibea Saulova utekla, a Ozeáš volá, aby se zatroubilo v Gibeji a Rámě."
    - "Na Tell el-Ful stála pevnost znovu v helénistické době. Roku 70 n. l. se Titus na pochodu na Jeruzalém utábořil v Trnitém údolí poblíž vesnice, kterou Josephus nazývá Gabaothsaul, Saulův pahorek. Ve svém dopise z roku 404 o smrti Pauly Jeroným popisuje její pouť a říká, že se zastavila v Gibeji, nyní úplné ruině, a připomněla si příběh o družce."
