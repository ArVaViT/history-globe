body:
  en:
    - "Gabbatha is the place in Jerusalem where Pilate sat in judgement on Jesus: “he brought Jesus forth, and sat down in the judgment seat in a place that is called the Pavement, but in the Hebrew, Gabbatha.” The Greek name, Lithostrotos, means a stone-paved floor; the Aramaic name is usually explained from a root meaning a raised place, so that the two names may describe the same spot in different ways. It is named only here."
    - "Two sites have been proposed. Tradition placed the judgement at the Antonia fortress north of the Temple, and the large stone pavement under the Convent of the Sisters of Zion near the Ecce Homo arch was long shown as the Lithostrotos; but Pierre Benoit argued, from a 1966 sounding under the arch and from Josephus' account of the open Struthion pool, that the pavement and the arch belong to the eastern forum of Hadrian's Aelia Capitolina in the second century AD, laid over the older Struthion pool. Benoit, followed by Shimon Gibson and many others, placed Pilate's tribunal instead at Herod's palace on the west side of the city, by today's Jaffa Gate, where Josephus tells that the governor Florus had his tribunal set before the palace in AD 66. The map follows this view."
  ru:
    - "Гаввафа — место в Иерусалиме, где Пилат судил Иисуса: «вывел вон Иисуса и сел на судилище, на месте, называемом Лифостротон, а по-еврейски Гаввафа». Греческое имя Лифостротон значит «вымощенное камнем место»; арамейское обычно объясняют от корня со значением «возвышение», так что оба имени, возможно, по-разному описывают одно место. Оно названо только здесь."
    - "Предлагают два места. Предание помещало суд в крепости Антония к северу от храма, и большую каменную мостовую под монастырём Сионских сестёр у арки Ecce Homo долго показывали как Лифостротон; но Пьер Бенуа, опираясь на зондаж 1966 г. под аркой и на рассказ Иосифа Флавия об открытом бассейне Струфион, доказывал, что мостовая и арка принадлежат восточному форуму Элии Капитолины Адриана II в. н. э., уложенному над более древним бассейном Струфион. Бенуа, а за ним Шимон Гибсон и многие другие, поместили судилище Пилата во дворце Ирода на западной стороне города, у нынешних Яффских ворот, где, по словам Иосифа Флавия, прокуратор Флор в 66 г. н. э. велел поставить своё судилище перед дворцом. Карта следует этому взгляду."
  de:
    - "Gabbata ist der Ort in Jerusalem, an dem Pilatus über Jesus zu Gericht saß: „Da Pilatus das Wort hörte, führte er Jesum heraus und setzte sich auf den Richtstuhl an der Stätte, die da heißt Hochpflaster, auf hebräisch aber Gabbatha.“ Der griechische Name, Lithostrotos, bedeutet einen mit Steinen gepflasterten Boden; der aramäische Name wird gewöhnlich von einer Wurzel mit der Bedeutung erhöhter Ort erklärt, sodass die beiden Namen dieselbe Stelle auf verschiedene Weise beschreiben können. Er wird nur hier genannt."
    - "Zwei Stätten sind vorgeschlagen worden. Die Überlieferung verlegte das Gericht in die Burg Antonia nördlich des Tempels, und das große Steinpflaster unter dem Kloster der Zionsschwestern nahe dem Ecce-Homo-Bogen wurde lange als Lithostrotos gezeigt; doch Pierre Benoit argumentierte aus einer Sondierung von 1966 unter dem Bogen und aus Josephus' Bericht über den offenen Struthion-Teich, dass Pflaster und Bogen zum östlichen Forum von Hadrians Aelia Capitolina im zweiten Jahrhundert n. Chr. gehören, über den älteren Struthion-Teich gelegt. Benoit, gefolgt von Shimon Gibson und vielen anderen, setzte Pilatus' Tribunal stattdessen im Palast des Herodes auf der Westseite der Stadt an, beim heutigen Jaffator, wo nach Josephus der Statthalter Florus im Jahr 66 n. Chr. sein Tribunal vor dem Palast aufstellen ließ. Die Karte folgt dieser Ansicht."
  fr:
    - "Gabbatha est le lieu de Jérusalem où Pilate siégea pour juger Jésus : Pilate « amena Jésus dehors ; et il s’assit sur le tribunal, au lieu appelé le Pavé, et en hébreu Gabbatha. » Le nom grec, Lithostrotos, désigne un sol pavé de pierres ; le nom araméen s’explique d’ordinaire par une racine signifiant un lieu élevé, de sorte que les deux noms peuvent décrire le même endroit de manières différentes. Il n’est nommé qu’ici."
    - "Deux sites ont été proposés. La tradition plaçait le jugement à la forteresse Antonia, au nord du Temple, et le grand pavement de pierre sous le couvent des Sœurs de Sion, près de l’arc de l’Ecce Homo, fut longtemps montré comme le Lithostrotos ; mais Pierre Benoit soutint, d’après un sondage de 1966 sous l’arc et le récit de Josèphe sur la piscine à ciel ouvert du Strouthion, que le pavement et l’arc appartiennent au forum oriental de l’Aelia Capitolina d’Hadrien au IIe siècle apr. J.-C., posé sur l’ancienne piscine du Strouthion. Benoit, suivi par Shimon Gibson et bien d’autres, plaça plutôt le tribunal de Pilate au palais d’Hérode, sur le côté ouest de la ville, près de l’actuelle porte de Jaffa, où, raconte Josèphe, le gouverneur Florus fit dresser son tribunal devant le palais en 66 apr. J.-C. La carte suit cette vue."
  pt:
    - "Gabatá é o lugar de Jerusalém onde Pilatos se sentou para julgar Jesus: “trouxe Jesus para fora e sentou-se no tribunal, em um lugar chamado ‘O Pavimento’, mas em hebraico, ‘Gábata’.” O nome grego, Litóstroto, significa um piso pavimentado de pedra; o nome aramaico costuma ser explicado a partir de uma raiz que significa lugar elevado, de modo que os dois nomes podem descrever o mesmo ponto de maneiras diferentes. É nomeado somente aqui."
    - "Dois sítios foram propostos. A tradição situava o julgamento na fortaleza Antônia, ao norte do Templo, e o grande pavimento de pedra sob o Convento das Irmãs de Sião, perto do arco do Ecce Homo, foi por muito tempo mostrado como o Litóstroto; mas Pierre Benoit argumentou, a partir de uma sondagem de 1966 sob o arco e do relato de Josefo sobre o tanque aberto do Estrutio, que o pavimento e o arco pertencem ao fórum oriental da Aelia Capitolina de Adriano, no século II d.C., assentado sobre o antigo tanque do Estrutio. Benoit, seguido por Shimon Gibson e muitos outros, situou o tribunal de Pilatos, em vez disso, no palácio de Herodes, no lado oeste da cidade, junto à atual Porta de Jafa, onde Josefo conta que o governador Floro mandou montar seu tribunal diante do palácio em 66 d.C. O mapa segue essa opinião."
  it:
    - "Gabbata è il luogo di Gerusalemme dove Pilato sedette in giudizio su Gesù: «menò fuori Gesù, e si assise al tribunale nel luogo detto Lastrico, e in ebraico Gabbatà». Il nome greco, Litostroto, significa un pavimento lastricato di pietra; il nome aramaico si spiega di solito da una radice che significa un luogo elevato, così che i due nomi possono descrivere lo stesso luogo in modi diversi. È nominato solo qui."
    - "Sono stati proposti due siti. La tradizione collocava il giudizio nella fortezza Antonia a nord del Tempio, e il grande lastricato di pietra sotto il convento delle Suore di Sion presso l’arco dell’Ecce Homo fu a lungo mostrato come Litostroto; ma Pierre Benoit sostenne, in base a un sondaggio del 1966 sotto l’arco e al racconto di Giuseppe Flavio sulla piscina scoperta dello Struthion, che il lastricato e l’arco appartengano al foro orientale dell’Aelia Capitolina di Adriano nel II secolo d.C., steso sopra la più antica piscina dello Struthion. Benoit, seguito da Shimon Gibson e da molti altri, collocò invece il tribunale di Pilato nel palazzo di Erode sul lato occidentale della città, presso l’odierna Porta di Giaffa, dove secondo Giuseppe Flavio il governatore Floro fece collocare il suo tribunale davanti al palazzo nel 66 d.C. La carta segue questa ipotesi."
  nl:
    - "Gabbata is de plaats in Jeruzalem waar Pilatus over Jezus rechtsprak: “bracht hij Jezus uit, en zat neder op den rechterstoel, in de plaats, genaamd Lithostrotos, en in het Hebreeuws Gabbatha.” De Griekse naam, Lithostrotos, betekent een met steen geplaveide vloer; de Aramese naam wordt gewoonlijk verklaard uit een wortel die een verhoogde plaats betekent, zodat de twee namen dezelfde plek op verschillende wijze kunnen beschrijven. Zij wordt alleen hier genoemd."
    - "Twee plaatsen zijn voorgesteld. De overlevering plaatste het vonnis in de Antoniavesting ten noorden van de Tempel, en het grote stenen plaveisel onder het klooster van de Zusters van Sion bij de Ecce Homo-boog werd lang als de Lithostrotos getoond; maar Pierre Benoit betoogde, op grond van een proefsleuf uit 1966 onder de boog en van Josephus' beschrijving van de open Struthionvijver, dat het plaveisel en de boog behoren tot het oostelijke forum van Hadrianus' Aelia Capitolina in de tweede eeuw n.Chr., aangelegd over de oudere Struthionvijver. Benoit, gevolgd door Shimon Gibson en velen anderen, plaatste Pilatus' rechterstoel in plaats daarvan bij het paleis van Herodes aan de westkant van de stad, bij de huidige Jaffapoort, waar volgens Josephus de landvoogd Florus in 66 n.Chr. zijn rechterstoel voor het paleis liet plaatsen. De kaart volgt deze opvatting."
  pl:
    - "Gabbata to miejsce w Jerozolimie, gdzie Piłat sądził Jezusa: „wywiódł Jezusa na dwór i siadł na stolicy, na miejscu, które zowią Litostrotos, a po żydowsku Gabbata”. Greckie imię, Litostrotos, oznacza posadzkę wyłożoną kamieniem; imię aramejskie wyjaśnia się zwykle od rdzenia oznaczającego miejsce wyniesione, tak że oba imiona mogą opisywać to samo miejsce na różne sposoby. Jest wymienione tylko tu."
    - "Zaproponowano dwa miejsca. Tradycja umieszczała sąd w twierdzy Antonia na północ od Świątyni, a wielki kamienny bruk pod klasztorem Sióstr Syjonu koło łuku Ecce Homo długo pokazywano jako Litostrotos; lecz Pierre Benoit dowodził, na podstawie sondażu z 1966 roku pod łukiem oraz opisu Józefa Flawiusza otwartej sadzawki Struthion, że bruk i łuk należą do wschodniego forum Aelii Capitolina Hadriana z II w. n.e., położonego nad starszą sadzawką Struthion. Benoit, a za nim Szimon Gibson i wielu innych, umieścił trybunał Piłata w pałacu Heroda po zachodniej stronie miasta, przy dzisiejszej Bramie Jafskiej, gdzie według Józefa Flawiusza namiestnik Florus kazał ustawić swój trybunał przed pałacem w 66 r. n.e. Mapa idzie za tym poglądem."
  uk:
    - "Габбата — місце в Єрусалимі, де Пилат сидів на суді над Ісусом: «Пилат же, почувши таке слово, вивів Ісуса, та й сїв на судищі, що зване Литостротос, а по єврейськи: Гавата». Грецька назва, Літостротос, означає вимощену каменем підлогу; арамейську назву зазвичай виводять від кореня зі значенням піднесене місце, тож обидві назви можуть описувати те саме місце по-різному. Вона названа лише тут."
    - "Запропоновано два місця. Традиція вбачала суд у фортеці Антонія на північ від Храму, а велике кам'яне мощення під монастирем Сестер Сіону біля арки «Ecce Homo» довго показували як Літостротос; але П'єр Беноа, виходячи із зондажу 1966 р. під аркою та з розповіді Йосифа Флавія про відкриту водойму Струтіон, доводив, що мощення й арка належать східному форуму Адріанової Елії Капітоліни II ст. н. е., покладеному над давнішою водоймою Струтіон. Беноа, за ним Шимон Гібсон і багато інших, розмістили трибунал Пилата натомість у палаці Ірода на західному боці міста, біля нинішніх Яффських воріт, де, як розповідає Йосиф Флавій, правитель Флор 66 р. н. е. поставив свій трибунал перед палацом. Мапа йде за цим поглядом."
  cs:
    - "Gabata je místo v Jeruzalémě, kde Pilát seděl na soudné stolici nad Ježíšem: „vyvedl ven Ježíše, a sedl na soudné stolici na místě, kteréž slove Litostrotos, a Židovsky Gabbata.“ Řecké jméno, Lithostrotos, znamená kamenem dlážděnou plochu; aramejské jméno se obvykle vykládá z kořene s významem vyvýšené místo, takže obě jména mohou popisovat totéž místo různým způsobem. Je jmenováno jen zde."
    - "Navrhována byla dvě místa. Tradice kladla soud do pevnosti Antonia severně od chrámu a velká kamenná dlažba pod klášterem Sionských sester poblíž oblouku Ecce homo byla dlouho ukazována jako Lithostrotos; ale Pierre Benoit na základě sondy z roku 1966 pod obloukem a Josephova líčení otevřeného rybníka Struthion tvrdil, že dlažba i oblouk patří východnímu foru Hadrianovy Aelie Capitoliny ve druhém století n. l., položené nad starším rybníkem Struthion. Benoit, za nímž šli Shimon Gibson a mnozí další, umístil Pilátovu soudnou stolici místo toho do Herodova paláce na západní straně města, u dnešní Jaffské brány, kde podle Josepha nechal správce Florus roku 66 n. l. postavit svou soudnou stolici před palácem. Mapa sleduje tento názor."
  es:
    - "Gábata es el lugar de Jerusalén donde Pilato se sentó a juzgar a Jesús: «llevó fuera á Jesús, y se sentó en el tribunal en el lugar que se dice Lithóstrotos, y en hebreo Gabbatha». El nombre griego, Lithóstrotos, significa un suelo enlosado de piedra; el nombre arameo suele explicarse a partir de una raíz que significa un lugar elevado, de modo que los dos nombres pueden describir el mismo sitio de maneras distintas. Solo se nombra aquí."
    - "Se han propuesto dos lugares. La tradición situó el juicio en la fortaleza Antonia, al norte del Templo, y el gran pavimento de piedra bajo el Convento de las Hermanas de Sión, cerca del arco del Ecce Homo, se mostró durante mucho tiempo como el Lithóstrotos; pero Pierre Benoit sostuvo, a partir de un sondeo de 1966 bajo el arco y del relato de Josefo sobre el estanque abierto del Estrutión, que el pavimento y el arco pertenecen al foro oriental de la Aelia Capitolina de Adriano, en el siglo II d. C., tendido sobre el estanque más antiguo del Estrutión. Benoit, seguido por Shimon Gibson y muchos otros, situó en cambio el tribunal de Pilato en el palacio de Herodes, en el lado occidental de la ciudad, junto a la actual Puerta de Jaffa, donde Josefo cuenta que el gobernador Floro hizo colocar su tribunal ante el palacio en 66 d. C. El mapa sigue esta opinión."
  sv:
    - "Gabbata är platsen i Jerusalem där Pilatus satt till doms över Jesus: ”lät han föra ut Jesus och satte sig på domarsätet, på en plats som kallades Litostroton, på hebreiska Gabbata.” Det grekiska namnet, Litostrotos, betyder ett stenlagt golv; det arameiska namnet förklaras oftast av en rot som betyder en upphöjd plats, så att de två namnen kan beskriva samma ställe på olika sätt. Den nämns bara här."
    - "Två platser har föreslagits. Traditionen förlade domen till Antoniaborgen norr om Templet, och den stora stenläggningen under Sions systrars kloster nära Ecce Homo-bågen visades länge som Litostrotos; men Pierre Benoit hävdade, utifrån en sondering 1966 under bågen och Josefus beskrivning av den öppna Struthion-dammen, att stenläggningen och bågen hör till Hadrianus östra forum i Aelia Capitolina på 100-talet e.Kr., lagt över den äldre Struthion-dammen. Benoit, följd av Shimon Gibson och många andra, förlade i stället Pilatus domarsäte till Herodes palats på stadens västra sida, vid dagens Jaffaport, där Josefus berättar att landshövdingen Florus lät ställa upp sitt domarsäte framför palatset år 66 e.Kr. Kartan följer denna uppfattning."
  nb:
    - "Gabbata er stedet i Jerusalem der Pilatus satt til doms over Jesus: «førte han Jesus ut og satte sig på dommersetet, på det sted som kalles Stenlagt, på hebraisk Gabbata.» Det greske navnet, Lithostrotos, betyr et steinbelagt gulv; det arameiske navnet forklares vanligvis ut fra en rot som betyr et hevet sted, slik at de to navnene kan beskrive samme sted på ulike måter. Det nevnes bare her."
    - "To steder er foreslått. Tradisjonen plasserte dommen ved Antonia-festningen nord for tempelet, og den store steinbelegningen under Sions søstres kloster nær Ecce Homo-buen ble lenge vist som Lithostrotos; men Pierre Benoit hevdet, ut fra en prøvegraving under buen i 1966 og ut fra Josefus' beretning om den åpne Struthion-dammen, at belegningen og buen hører til Hadrians østlige forum i Aelia Capitolina på 100-tallet e.Kr., lagt over den eldre Struthion-dammen. Benoit, fulgt av Shimon Gibson og mange andre, plasserte i stedet Pilatus' domstol ved Herodes' palass på vestsiden av byen, ved dagens Jaffaport, der Josefus forteller at stattholderen Florus lot sin domstol sette opp foran palasset i 66 e.Kr. Kartet følger dette synet."
  tl:
    - "Ang Gabbatha ang lugar sa Jerusalem kung saan naupo si Pilato sa paghatol kay Jesus: “inilabas niya si Jesus, at siya'y naupo sa hukuman sa dakong tinatawag na Pavimento, datapuwa't sa Hebreo ay Gabbatha.” Ang pangalang Griyego, Lithostrotos, ay nangangahulugang sahig na nilatagan ng bato; ang pangalang Arameo ay karaniwang ipinaliliwanag mula sa isang ugat na nangangahulugang isang nakataas na lugar, kaya't maaaring inilalarawan ng dalawang pangalan ang iisang lugar sa magkaibang paraan. Dito lamang ito pinangalanan."
    - "Dalawang lugar ang iminungkahi. Inilagay ng tradisyon ang paghatol sa Kutang Antonia sa hilaga ng Templo, at matagal nang ipinakita bilang Lithostrotos ang malaking sahig na bato sa ilalim ng Kumbento ng mga Madre ng Sion malapit sa arko ng Ecce Homo; ngunit ayon kay Pierre Benoit, mula sa pagsubok na hukay noong 1966 sa ilalim ng arko at sa salaysay ni Josephus sa bukas na tangke ng Struthion, kabilang ang sahig at arko sa silangang foro ng Aelia Capitolina ni Hadrian noong ika-2 siglo AD, na inilatag sa ibabaw ng lumang tangke ng Struthion. Si Benoit, na sinundan nina Shimon Gibson at marami pa, ay naglagay sa halip ng hukuman ni Pilato sa palasyo ni Herodes sa kanlurang bahagi ng lungsod, sa Pintuang Jaffa ngayon, kung saan ayon kay Josephus ay inilagay ng gobernador na si Florus ang hukuman niya sa harap ng palasyo noong 66 AD. Sinusunod ito ng mapa."
  da:
    - "Gabbata er stedet i Jerusalem, hvor Pilatus sad til doms over Jesus: »førte han Jesus ud og satte sig paa Dommersædet, paa det Sted, som kaldes Stenlagt, men paa Hebraisk Gabbatha«. Det græske navn, Lithostrotos, betyder et stenbelagt gulv; det aramæiske navn forklares sædvanligvis ud fra en rod, der betyder et forhøjet sted, så de to navne kan beskrive det samme sted på forskellig måde. Det nævnes kun her."
    - "To steder er foreslået. Traditionen henlagde domfældelsen til Antonia-fæstningen nord for templet, og det store stenbelagte gulv under Zion-søstrenes kloster nær Ecce Homo-buen blev længe vist som Lithostrotos; men Pierre Benoit hævdede ud fra en prøvegravning i 1966 under buen og ud fra Josefus' beretning om den åbne Struthion-dam, at gulvet og buen hører til det østlige forum i Hadrians Aelia Capitolina i 100-tallet e.Kr., lagt over den ældre Struthion-dam. Benoit, fulgt af Shimon Gibson og mange andre, placerede i stedet Pilatus' dommersæde ved Herodes' palads på byens vestside, ved nutidens Jaffaport, hvor Josefus fortæller, at statholderen Florus lod sit dommersæde opstille foran paladset i 66 e.Kr. Kortet følger dette synspunkt."
  sr:
    - "Гавата је место у Јерусалиму где је Пилат судио Исусу: „изведе Исуса напоље, и седе на судијску столицу на месту које се зове Калдрма а јеврејски Гавата.“ Грчко име, Литостротон, значи каменим плочама поплочан под; арамејско име обично се тумачи из корена који значи узвишено место, тако да оба имена могу описивати исто место на различите начине. Помиње се само овде."
    - "Предложена су два места. Предање је стављало суд у тврђаву Антонију северно од Храма, а велики каменом поплочани простор испод манастира сестара Сиона код лука Еце хомо дуго се показивао као Литостротон; али је Пјер Бено, на основу сонде из 1966. испод лука и приповести Јосифа Флавија о отвореном Струтионском базену, тврдио да плочник и лук припадају источном форуму Хадријанове Елије Капитолине из другог века н. е., положеном преко старијег Струтионског базена. Бено, а за њим Симон Гибсон и многи други, сместио је Пилатов трибунал уместо тога у Иродову палату на западној страни града, код данашње Јафске капије, где Јосиф Флавије приповеда да је намесник Флор 66. н. е. поставио свој трибунал пред палатом. Карта следи то гледиште."
scripture:
  - John.19.13
sources:
  - "Josephus, Jewish War 2.14.8 = Niese 2.301 (Florus lodged at the palace and had his tribunal set before it) (Whiston's division = Niese section)"
  - "P. Benoit, 'L'Antonia d'Hérode le Grand et le forum oriental d'Aelia Capitolina', Harvard Theological Review 64.2–3 (1971), 135–167"
