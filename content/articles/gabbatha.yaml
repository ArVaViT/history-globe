# Overview article (ADR 0007). Gabbatha: the Antonia (Ecce Homo pavement) tradition and the Herod's-palace view (Benoit, Gibson; the map's point) are shown; the Ecce Homo pavement's Hadrianic date follows Benoit 1971.
