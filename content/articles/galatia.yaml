# Overview article (ADR 0007). Mainstream facts only; the North and South Galatian views of the Epistle's addressees are given without choosing.
id: galatia
place: a0f440a
title:
  en: "Galatia"
  ru: "Галатия"
  uk: "Галатія"
  es: "Galacia"
  pt: "Galácia"
  de: "Galatien"
  fr: "Galatie"
  it: "Galazia"
  pl: "Galacja"
