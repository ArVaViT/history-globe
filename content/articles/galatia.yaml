body:
  en:
    - "Galatia is the high plateau of central Anatolia around Ancyra, modern Ankara, named after the Gauls (Galatai) who crossed into Asia Minor in 278 BC and settled there in three tribes, the Tolistobogii, Tectosages and Trocmi, with Pessinus, Ancyra and Tavium as their centres. They raided and hired themselves out for a century, were checked by Attalus I of Pergamum, whose victory the Dying Gaul commemorates, and crushed by the Roman consul Manlius Vulso in 189 BC; Jerome, in the fourth century AD, says they still spoke a tongue like that of the Treveri on the Moselle. When the last king, Amyntas, died in 25 BC, Augustus made Galatia a Roman province and added to it Pisidia and parts of Phrygia and Lycaonia, with Antioch, Iconium, Lystra and Derbe."
    - "That double meaning is why the New Testament's Galatia is debated. Paul and Barnabas founded churches in those southern cities on the first journey; on the second Paul had “gone throughout Phrygia and the region of Galatia”, and on the third went “over all the country of Galatia and Phrygia in order, strengthening all the disciples”. The Epistle “unto the churches of Galatia”, which recalls how he first preached to them “through infirmity of the flesh” and was received “as an angel of God”, is addressed by the South Galatian view to the churches of Acts 13–14 and by the older North Galatian view to converts in the Gaulish north, never named in Acts; the question is open, and with it the letter's date. Paul ordered a collection there for Jerusalem, Crescens went to Galatia in Paul's last days, and Peter writes to the strangers of “Pontus, Galatia, Cappadocia, Asia, and Bithynia”."
    - "Ancyra kept the best copy of Augustus' Res Gestae on the walls of his temple there. The province was divided in the fourth century, and the name faded under the Byzantines and Turks. Ankara, the capital of Turkey since 1923, stands on the old Ancyra, and Pessinus (Ballıhisar) and Tavium (Büyüknefes) are villages with ruins."
  ru:
    - "Галатия — высокое плоскогорье центральной Анатолии вокруг Анкиры, нынешней Анкары, названное по галлам (галатам), которые переправились в Малую Азию в 278 г. до н. э. и осели там тремя племенами — толистобогиями, тектосагами и трокмами — с центрами в Пессинунте, Анкире и Тавии. Целый век они совершали набеги и нанимались в войска, были остановлены Атталом I Пергамским, чью победу увековечил «Умирающий галл», и разгромлены римским консулом Манлием Вульсоном в 189 г. до н. э.; Иероним в IV веке н. э. говорит, что они всё ещё говорили на языке, похожем на язык треверов на Мозеле. Когда в 25 г. до н. э. умер последний царь Аминта, Август сделал Галатию римской провинцией и присоединил к ней Писидию и части Фригии и Ликаонии с Антиохией, Иконией, Листрой и Дервией."
    - "Из-за этого двойного смысла Галатия Нового Завета — предмет спора. Павел и Варнава основали церкви в этих южных городах в первом путешествии; во втором он со спутниками прошёл «через Фригию и Галатийскую страну», а в третьем «проходил по порядку страну Галатийскую и Фригию, утверждая всех учеников». Послание «церквам Галатийским», напоминающее, что он благовествовал им впервые «в немощи плоти» и что его приняли «как Ангела Божия», по южногалатийскому взгляду обращено к церквам 13–14 глав Деяний, а по северогалатийскому, более старому, — к обращённым среди галлов плоскогорья, которых Деяния не называют; вопрос остаётся открытым, а с ним и дата письма. Павел распорядился о сборе там для Иерусалима, Крискент в последние дни Павла пошёл в Галатию, а Пётр пишет пришельцам, рассеянным «в Понте, Галатии, Каппадокии, Асии и Вифинии»."
    - "Анкира сохранила лучшую копию «Деяний» Августа на стенах его храма. Провинцию разделили в IV веке, и имя поблёкло при византийцах и турках. Анкара, столица Турции с 1923 года, стоит на древней Анкире, а Пессинунт (Баллыхисар) и Тавий (Бююкнефес) — деревни с развалинами."
  uk:
    - "Галатія — високе плато центральної Анатолії навколо Анкіри, сучасної Анкари, названа за галлами (галатами), які перейшли до Малої Азії в 278 р. до н. е. й оселилися там трьома племенами — толістобогами, тектосагами і трокмами, — з Пессінунтом, Анкірою і Тавієм як центрами. Вони століття грабували й наймалися, були зупинені Атталом I Пергамським, чию перемогу вшановує «Вмираючий галл», і розгромлені римським консулом Манлієм Вульсоном у 189 р. до н. е.; Ієронім у IV ст. н. е. каже, що вони ще говорили мовою, схожою на мову треверів на Мозелі. Коли останній цар, Аминта, помер у 25 р. до н. е., Август зробив Галатію римською провінцією й додав до неї Пісідію та частини Фрігії та Лікаонії з Антіохією, Іконією, Лістрою та Дервією."
    - "Це подвійне значення і є причиною суперечок про Галатію Нового Заповіту. Павло й Варнава заснували церкви в тих південних містах під час першої подорожі; під час другої Павло з супутниками «пройшли Фригию та Галацьку сторону», а під час третьої він, «проходячи рядом Галацьку сторону та Фригию, і утверджуючи всїх учеників». Послання «церквам Галацьким», яке пригадує, як він вперше проповідував їм «у немощі тїла» і був прийнятий «як ангела Божого», південногалатійський погляд адресує церквам Діянь 13–14, а давніший північногалатійський — навернутим на галльській півночі, ніколи не названій у Діяннях; питання відкрите, а з ним і дата послання. Павло наказав там збір для Єрусалима, Крискент пішов до Галатії в останні дні Павла, а Петро пише захожанам «по Понту, Галатиї, Кападокиї, Азиї і Витиниї»."
    - "Анкіра зберігала найкращу копію «Діянь божественного Августа» на стінах його храму там. Провінцію було поділено в IV ст., і назва зблякла за візантійців і тюрків. Анкара, столиця Туреччини з 1923 р., стоїть на давній Анкірі, а Пессінунт (Баллихісар) і Тавій (Бююкнефес) — села з руїнами."
  es:
    - "Galacia es la alta meseta del centro de Anatolia en torno a Ancira, la actual Ankara, llamada así por los galos (Galatai) que cruzaron a Asia Menor en el 278 a. C. y se establecieron allí en tres tribus, los tolistobogios, los tectósages y los trocmos, con Pesinunte, Ancira y Tavio como centros. Saquearon y se alquilaron como mercenarios durante un siglo, fueron contenidos por Átalo I de Pérgamo, cuya victoria conmemora el Galo moribundo, y aplastados por el cónsul romano Manlio Vulso en el 189 a. C.; Jerónimo, en el siglo IV d. C., dice que todavía hablaban una lengua semejante a la de los tréveros del Mosela. Cuando murió el último rey, Amintas, en el 25 a. C., Augusto hizo de Galacia una provincia romana y le añadió Pisidia y partes de Frigia y Licaonia, con Antioquía, Iconio, Listra y Derbe."
    - "Ese doble sentido explica el debate sobre la Galacia neotestamentaria. Pablo y Bernabé fundaron iglesias en ellas en el primer viaje; en el segundo, Pablo iba «pasando á Phrygia y la provincia de Galacia», y en el tercero, «andando por orden la provincia de Galacia, y la Phrygia, confirmando á todos los discípulos». La Epístola «á las iglesias de Galacia», que recuerda cómo les anunció por primera vez el Evangelio «por flaqueza de carne» y fue recibido «como á un ángel de Dios», se dirige, según la Galacia del sur, a las iglesias de Hechos 13–14 y, según la antigua del norte, a conversos del norte galo, nunca nombrado en Hechos; la cuestión sigue abierta, con la fecha. Allí Pablo ordenó una colecta para Jerusalén, Crescente fue a Galacia al final de su vida, y Pedro escribe a los extranjeros esparcidos «en Ponto, en Galacia, en Capadocia, en Asia, y en Bithinia»."
    - "Ancira conservó la mejor copia de las Res Gestae de Augusto en los muros de su templo allí. La provincia se dividió en el siglo IV, y el nombre se fue borrando bajo bizantinos y turcos. Ankara, capital de Turquía desde 1923, se levanta sobre la antigua Ancira, y Pesinunte (Ballıhisar) y Tavio (Büyüknefes) son aldeas con ruinas."
  pt:
    - "A Galácia é o alto planalto do centro da Anatólia em torno de Ancira, a moderna Ankara, assim chamada pelos gauleses (Galatai) que passaram à Ásia Menor em 278 a.C. e ali se fixaram em três tribos, os Tolistóbogos, Tectósages e Trocmos, com Pessinunte, Ancira e Távio como centros. Fizeram incursões e se alugaram como mercenários por um século, foram contidos por Átalo I de Pérgamo, cuja vitória o Gálata Moribundo comemora, e esmagados pelo cônsul romano Mânlio Vulsão em 189 a.C.; Jerônimo, no século IV d.C., diz que ainda falavam uma língua semelhante à dos tréveros do Mosela. Quando o último rei, Amintas, morreu, em 25 a.C., Augusto fez da Galácia uma província romana e acrescentou-lhe a Pisídia e partes da Frígia e da Licaônia, com Antioquia, Icônio, Listra e Derbe."
    - "Por esse duplo sentido, a Galácia do Novo Testamento é debatida. Paulo e Barnabé fundaram igrejas nessas cidades do sul na primeira viagem; na segunda, Paulo havia “passado pela região da Frígia e da Galácia”, e na terceira “percorreu sucessivamente a região da Galácia e da Frígia, fortalecendo todos os discípulos”. A Epístola “às igrejas da Galácia”, que recorda como ele pregou a elas pela primeira vez “por causa de uma fraqueza na carne” e foi recebido “como a um anjo de Deus”, dirige-se, na hipótese da Galácia do Sul, às igrejas de Atos 13–14 e, na mais antiga (Galácia do Norte), a convertidos do norte gaulês, nunca nomeado em Atos; a questão está aberta, e com ela a data da carta. Paulo ordenou ali uma coleta para Jerusalém, Crescente foi à Galácia nos últimos dias de Paulo, e Pedro escreve aos estrangeiros “no Ponto, Galácia, Capadócia, Ásia e Bitínia”."
    - "Ancira guardou a melhor cópia das Res Gestae de Augusto nas paredes de seu templo ali. A província foi dividida no século IV, e o nome se apagou sob bizantinos e turcos. Ankara, capital da Turquia desde 1923, ergue-se sobre a antiga Ancira, e Pessinunte (Ballıhisar) e Távio (Büyüknefes) são aldeias com ruínas."
  de:
    - "Galatien ist die Hochebene Zentralanatoliens um Ancyra, das heutige Ankara, benannt nach den Galliern (Galatai), die 278 v. Chr. nach Kleinasien übersetzten und sich dort in drei Stämmen niederließen, den Tolistobogiern, Tektosagen und Trokmern, mit Pessinus, Ancyra und Tavium als Zentren. Sie plünderten und verdingten sich ein Jahrhundert lang, wurden von Attalos I. von Pergamon aufgehalten, dessen Sieg der Sterbende Gallier verewigt, und 189 v. Chr. vom römischen Konsul Manlius Vulso vernichtend geschlagen; Hieronymus sagt im 4. Jahrhundert n. Chr., sie sprächen noch immer eine Sprache wie die der Treverer an der Mosel. Als der letzte König, Amyntas, 25 v. Chr. starb, machte Augustus Galatien zur römischen Provinz und fügte Pisidien und Teile von Phrygien und Lykaonien hinzu, mit Antiochia, Ikonion, Lystra und Derbe."
    - "Diese doppelte Bedeutung macht Galatien im Neuen Testament umstritten. Paulus und Barnabas gründeten auf der ersten Reise Gemeinden in jenen Südstädten; auf der zweiten war Paulus „durch Phrygien und das Land Galatien“ gezogen, auf der dritten „durchwandelte nacheinander das galatische Land und Phrygien und stärkte alle Jünger“. Der Brief „den Gemeinden in Galatien“ (er erinnert an die erste Predigt „in Schwachheit nach dem Fleisch“ und die Aufnahme „wie ein Engel Gottes“) richtet sich nach der südgalatischen Ansicht an die Gemeinden von Apg 13–14, nach der älteren nordgalatischen an Bekehrte im gallischen Norden, in Apg ungenannt; offen ist die Frage, und mit ihr das Datum. Paulus ordnete dort eine Sammlung für Jerusalem an, Krescens ging in seinen letzten Tagen dorthin, und Petrus schreibt an die Fremdlinge „in Pontus, Galatien, Kappadozien, Asien und Bithynien“."
    - "Ancyra bewahrte die beste Abschrift der Res Gestae des Augustus an den Wänden seines dortigen Tempels. Die Provinz wurde im 4. Jahrhundert geteilt, und der Name verblasste unter Byzantinern und Türken. Ankara, seit 1923 Hauptstadt der Türkei, steht auf dem alten Ancyra, und Pessinus (Ballıhisar) und Tavium (Büyüknefes) sind Dörfer mit Ruinen."
  fr:
    - "La Galatie est le haut plateau de l’Anatolie centrale autour d’Ancyre, l’actuelle Ankara, nommée d’après les Gaulois (Galatai) qui passèrent en Asie Mineure en 278 av. J.-C. et s’y établirent en trois tribus, les Tolistoboges, les Tectosages et les Trocmes, avec Pessinonte, Ancyre et Tavium pour centres. Ils pillèrent et se louèrent pendant un siècle, furent arrêtés par Attale Ier de Pergame, dont la victoire est commémorée par le Gaulois mourant, et écrasés par le consul romain Manlius Vulso en 189 av. J.-C. ; Jérôme, au IVe siècle apr. J.-C., dit qu’ils parlaient encore une langue semblable à celle des Trévires de la Moselle. Quand le dernier roi, Amyntas, mourut en 25 av. J.-C., Auguste fit de la Galatie une province romaine et y ajouta la Pisidie et des parties de la Phrygie et de la Lycaonie, avec Antioche, Icone, Lystre et Derbe."
    - "Ce double sens explique le débat sur la Galatie du Nouveau Testament. Paul et Barnabas fondèrent des Églises dans ces villes du sud au premier voyage ; au deuxième, ils « traversèrent la Phrygie et le pays de Galatie », et au troisième Paul « parcourut successivement la Galatie et la Phrygie, fortifiant tous les disciples ». L’épître « aux Églises de la Galatie », qui rappelle qu’il leur annonça d’abord l’Évangile « à cause d’une infirmité de la chair » et fut reçu « comme un ange de Dieu », s’adresse selon la thèse du Sud aux Églises d’Actes 13–14, selon la thèse plus ancienne du Nord à des convertis du nord gaulois, absent des Actes ; la question est ouverte, avec la date de la lettre. Paul y ordonna une collecte pour Jérusalem, Crescens y partit à la fin de sa vie, et Pierre écrit aux étrangers « dans le Pont, la Galatie, la Cappadoce, l’Asie et la Bithynie »."
    - "Ancyre garda la meilleure copie des Res Gestae d’Auguste sur les murs de son temple. La province fut divisée au IVe siècle, et le nom s’effaça sous les Byzantins et les Turcs. Ankara, capitale de la Turquie depuis 1923, se dresse sur l’ancienne Ancyre, et Pessinonte (Ballıhisar) et Tavium (Büyüknefes) sont des villages avec ruines."
  it:
    - "La Galazia è l’alto altopiano dell’Anatolia centrale attorno ad Ancira, l’odierna Ankara, così chiamata dai Galli (Galatai) che passarono in Asia Minore nel 278 a.C. e vi si stabilirono in tre tribù, i Tolistobogi, i Tectosagi e i Trocmi, con Pessinunte, Ancira e Tavio come centri. Per un secolo compirono razzie e si misero al soldo altrui, furono fermati da Attalo I di Pergamo, la cui vittoria è ricordata dal Galata morente, e schiacciati dal console romano Manlio Vulsone nel 189 a.C.; Girolamo, nel IV secolo d.C., dice che parlavano ancora una lingua simile a quella dei Treviri sulla Mosella. Quando l’ultimo re, Aminta, morì nel 25 a.C., Augusto fece della Galazia una provincia romana e vi aggiunse la Pisidia e parti di Frigia e Licaonia, con Antiochia, Icònio, Listra e Derbe."
    - "Di qui il dibattito sulla Galazia neotestamentaria. Paolo e Barnaba fondarono chiese in quelle città del sud nel primo viaggio; nel secondo «traversarono la Frigia e il paese della Galazia», nel terzo andò «percorrendo di luogo in luogo il paese della Galazia e la Frigia, confermando tutti i discepoli». La lettera «alle chiese della Galazia», che ricorda la prima predicazione «a motivo di una infermità della carne» e l’accoglienza «come un angelo di Dio», va, per la tesi meridionale, alle chiese di Atti 13–14, per l’antica tesi settentrionale a convertiti del nord gallico, mai citato negli Atti; questione aperta, come la data. Paolo vi ordinò una colletta per Gerusalemme, Crescente vi andò negli ultimi giorni di Paolo, e Pietro scrive «agli eletti che vivono come forestieri nella dispersione del Ponto, della Galazia, della Cappadocia, dell’Asia e della Bitinia»."
    - "Ancira conservò la migliore copia delle Res Gestae di Augusto sulle pareti del tempio che vi era dedicato ad Augusto. La provincia fu divisa nel IV secolo, e il nome svanì sotto Bizantini e Turchi. Ankara, capitale della Turchia dal 1923, sorge sull’antica Ancira, e Pessinunte (Ballıhisar) e Tavio (Büyüknefes) sono villaggi con rovine."
  pl:
    - "Galacja to wysoki płaskowyż środkowej Anatolii wokół Ancyry, dzisiejszej Ankary, nazwany od Galów (Galatai), którzy przeszli do Azji Mniejszej w 278 r. p.n.e. i osiedlili się tam w trzech plemionach: Tolistobogach, Tektosagach i Trokmach, z Pessynuntem, Ancyrą i Tawionem jako ośrodkami. Przez stulecie najeżdżali i wynajmowali się na żołd, powstrzymał ich Attalos I z Pergamonu, którego zwycięstwo upamiętnia Umierający Gal, a rzymski konsul Manliusz Wulso rozgromił ich w 189 r. p.n.e.; Hieronim w IV w. n.e. mówi, że wciąż mówili językiem podobnym do języka Trewerów nad Mozelą. Gdy w 25 r. p.n.e. zmarł ostatni król, Amyntas, August uczynił Galację prowincją rzymską i dodał do niej Pizydię oraz części Frygii i Likaonii, z Antiochią, Ikonium, Listrą i Derbe."
    - "To podwójne znaczenie sprawia, że Galacja Nowego Testamentu jest sporna. Paweł i Barnaba założyli Kościoły w tych południowych miastach w pierwszej podróży; w drugiej Paweł przeszedł „Frygiję i Galatską krainę”, a w trzeciej „wyszedł obchodząc krainę Galatską i Frygiję, utwierdzając wszystkich uczniów”. List „zborom Galackim”, który wspomina, jak Paweł głosił im po raz pierwszy „w słabości ciała” i został przyjęty „jako Anioła Bożego”, według poglądu południowogalackiego jest adresowany do Kościołów z Dz 13–14, a według starszego poglądu północnogalackiego do nawróconych na galijskiej północy, nigdy niewymienionej w Dziejach; kwestia jest otwarta, a wraz z nią data listu. Paweł zarządził tam zbiórkę dla Jerozolimy, Kreskens poszedł do Galacji pod koniec życia Pawła, a Piotr pisze „przychodniom rozproszonym w Poncie, w Galacyi, w Kapadocyi, w Azji i w Bitynii”."
    - "Ancyra przechowywała najlepszy egzemplarz Res Gestae Augusta na murach jego tamtejszej świątyni. Prowincję podzielono w IV w., a nazwa zblakła pod Bizantyjczykami i Turkami. Ankara, stolica Turcji od 1923 r., stoi na dawnej Ancyrze, a Pessynunt (Ballıhisar) i Tawion (Büyüknefes) to wsie z ruinami."
  nl:
    - "Galatië is het hoge plateau van Midden-Anatolië rond Ancyra, het moderne Ankara, genoemd naar de Galliërs (Galatai) die in 278 v.Chr. naar Klein-Azië overstaken en zich daar in drie stammen vestigden, de Tolistobogiërs, Tectosagen en Trokmers, met Pessinus, Ancyra en Tavium als centra. Zij plunderden en verhuurden zich een eeuw lang, werden bedwongen door Attalus I van Pergamum, wiens overwinning de Stervende Galliër gedenkt, en verpletterd door de Romeinse consul Manlius Vulso in 189 v.Chr.; Hieronymus zegt in de 4e eeuw n.Chr. dat zij nog een taal spraken als die van de Treveri aan de Moezel. Toen de laatste koning, Amyntas, in 25 v.Chr. stierf, maakte Augustus Galatië een Romeinse provincie en voegde Pisidië en delen van Frygië en Lykaonië toe, met Antiochië, Ikonium, Lystra en Derbe."
    - "Daarom is het Galatië van het Nieuwe Testament omstreden. Paulus en Barnabas stichtten op de eerste reis gemeenten in die zuidelijke steden; op de tweede had hij “Frygië, en het land van Galatië doorgereisd”, en op de derde “doorreisde vervolgens het land van Galatië en Frygië, versterkende al de discipelen”. De brief “aan de Gemeenten van Galatië”, die zegt dat hij hun eerst predikte “door zwakheid des vleses” en als “een engel Gods” werd aangenomen, is volgens de Zuid-Galatische opvatting gericht aan de gemeenten van Handelingen 13–14, volgens de oudere Noord-Galatische aan bekeerlingen in het Gallische noorden, nooit in Handelingen genoemd; de vraag is open, en daarmee de datering. Paulus gebood daar een collecte voor Jeruzalem, Crescens ging in zijn laatste dagen naar Galatië, en Petrus schrijft de vreemdelingen in “Pontus, Galatië, Kappadocië, Azië en Bithynië”."
    - "Ancyra bewaarde het beste exemplaar van Augustus' Res Gestae op de wanden van zijn tempel aldaar. De provincie werd in de vierde eeuw verdeeld, en de naam vervaagde onder Byzantijnen en Turken. Ankara, sinds 1923 hoofdstad van Turkije, staat op het oude Ancyra, en Pessinus (Ballıhisar) en Tavium (Büyüknefes) zijn dorpen met ruïnes."
  cs:
    - "Galacie je vysoká plošina střední Anatolie kolem Ancyry, dnešní Ankary, pojmenovaná podle Galů (Galatai), kteří roku 278 př. n. l. přešli do Malé Asie a usadili se tam ve třech kmenech, Tolistobogů, Tektosagů a Trokmů, s Pessinúntem, Ancyrou a Tavium jako středisky. Století loupili a najímali se, byli zadrženi Attalem I. Pergamským, jehož vítězství připomíná Umírající Gal, a rozdrceni římským konzulem Manliem Vulsonem roku 189 př. n. l.; Jeroným ve 4. století n. l. praví, že dosud mluvili jazykem podobným jazyku Treverů na Mosele. Když zemřel poslední král Amyntás roku 25 př. n. l., učinil Augustus z Galacie římskou provincii a připojil k ní Pisidii a části Frygie a Lykaonie s Antiochií, Ikoniem, Lystrou a Derbe."
    - "Toto dvojí významové pole je důvodem, proč je Galacie Nového zákona sporná. Pavel a Barnabáš založili církve v oněch jižních městech na první cestě; na druhé „prošedše Frygii i Galatskou krajinu“ a na třetí „procházel pořád Galatskou krajinu a Frygii, potvrzuje všech učedlníků“. List „sborům Galatským“, který připomíná, jak jim poprvé kázal „s mdlobou těla“ a byl přijat „jako anděla Božího“, je podle jihogalatského názoru adresován církvím ze Sk 13–14 a podle staršího severogalatského názoru obráceným v galském severu, který Skutky nikdy nejmenují; otázka je otevřená, a s ní i datum listu. Pavel tam nařídil sbírku pro Jeruzalém, Krescens odešel do Galacie v Pavlových posledních dnech a Petr píše „příchozím rozptýleným v Pontu, Galacii, Kappadocii, v Azii a v Bitynii“."
    - "Ancyra uchovávala nejlepší opis Augustových Res Gestae na stěnách jeho tamního chrámu. Provincie byla ve 4. století rozdělena a jméno za Byzantinců a Turků vybledlo. Ankara, od roku 1923 hlavní město Turecka, stojí na staré Ancyře a Pessinús (Ballıhisar) a Tavium (Büyüknefes) jsou vesnice se zříceninami."
  sv:
    - "Galatien är det höga höglandet i centrala Anatolien kring Ankyra, dagens Ankara, uppkallat efter gallerna (galatai) som gick över till Mindre Asien år 278 f.Kr. och bosatte sig där i tre stammar, tolistobogierna, tektosagerna och trokmerna, med Pessinus, Ankyra och Tavium som centra. De plundrade och hyrde ut sig som legosoldater under ett sekel, hejdades av Attalos I av Pergamon, vars seger Den döende galliern minner om, och krossades av den romerske konsuln Manlius Vulso år 189 f.Kr.; Hieronymus säger på 300-talet e.Kr. att de fortfarande talade ett språk likt treverernas vid Mosel. När den siste kungen, Amyntas, dog år 25 f.Kr. gjorde Augustus Galatien till romersk provins och lade till Pisidien och delar av Frygien och Lykaonien, med Antiochia, Ikonion, Lystra och Derbe."
    - "Därför är Nya testamentets Galatien omdebatterat. Paulus och Barnabas grundade församlingar i de södra städerna på första resan; på den andra ”togo de vägen genom Frygien och det galatiska landet”, och på den tredje färdades Paulus ”först genom det galatiska landet och därefter genom Frygien och styrkte alla lärjungarna”. Brevet till ”församlingarna i Galatien”, som erinrar om hur han först förkunnade för dem ”på grund av kroppslig svaghet” och togs emot ”såsom en Guds ängel”, riktas enligt den sydgalatiska teorin till församlingarna i Apg 13–14, enligt den äldre nordgalatiska till omvända i det galliska norr, som Apg aldrig nämner; frågan är öppen, liksom brevets datering. Paulus ordnade en insamling där för Jerusalem, Crescens begav sig dit under Paulus sista dagar, och Petrus skriver till främlingarna i ”Pontus, Galatien, Kappadocien, provinsen Asien och Bitynien”."
    - "Ankyra bevarade det bästa exemplaret av Augustus' Res Gestae på väggarna till hans tempel där. Provinsen delades på 300-talet, och namnet bleknade under bysantinerna och turkarna. Ankara, Turkiets huvudstad sedan 1923, ligger på det gamla Ankyra, och Pessinus (Ballıhisar) och Tavium (Büyüknefes) är byar med ruiner."
  nb:
    - "Galatia er høyplatået i det sentrale Anatolia rundt Ancyra, dagens Ankara, oppkalt etter gallerne (galatai) som krysset over til Lilleasia i 278 f.Kr. og slo seg ned der i tre stammer, tolistobogiere, tektosager og trokmer, med Pessinus, Ancyra og Tavium som sentre. De plyndret og leide seg ut som leiesoldater i et århundre, ble stanset av Attalos 1. av Pergamon, hvis seier Den døende galler minnes, og knust av den romerske konsulen Manlius Vulso i 189 f.Kr.; Hieronymus sier på 300-tallet e.Kr. at de ennå talte et språk som liknet treverernes ved Mosel. Da den siste kongen, Amyntas, døde i 25 f.Kr., gjorde Augustus Galatia til en romersk provins og la til den Pisidia og deler av Frygia og Lykaonia, med Antiokia, Ikonium, Lystra og Derbe."
    - "Den doble betydningen gjør Det nye testamentets Galatia omdiskutert. Paulus og Barnabas grunnla menigheter i de sørlige byene på første reise; på den andre drog Paulus «igjennem Frygia og det galatiske land», og på den tredje «vandret gjennem det galatiske land og Frygia fra ende til annen og styrket alle disiplene». Brevet «til menighetene i Galatia», som minner om hans første forkynnelse for dem «på grunn av skrøpelighet i mitt kjød» og om at de tok imot ham «som en Guds engel», er etter den sørgalatiske teorien stilet til menighetene i Apg 13–14, etter den eldre nordgalatiske til omvendte i det galliske nord, aldri nevnt i Apg; spørsmålet er åpent, og med det brevets datering. Paulus ordnet en innsamling der til Jerusalem, Kreskens dro til Galatia mot slutten av Paulus' liv, og Peter skriver til «utlendinger som er spredt omkring i Pontus, Galatia, Kappadokia, Asia og Bitynia»."
    - "I Ancyra er den beste kopien av Augustus' Res Gestae bevart på veggene til hans tempel der. Provinsen ble delt på 300-tallet, og navnet bleknet bort under bysantinerne og tyrkerne. Ankara, Tyrkias hovedstad siden 1923, ligger på det gamle Ancyra, og Pessinus (Ballıhisar) og Tavium (Büyüknefes) er landsbyer med ruiner."
  tl:
    - "Ang Galacia ay ang mataas na talampas ng gitnang Anatolia sa palibot ng Ancyra, ang makabagong Ankara, na ipinangalan sa mga Galo (Galatai) na tumawid sa Asia Minor noong 278 BK at nanirahan doon sa tatlong tribo, ang mga Tolistobogii, Tectosages at Trocmi, na may Pessinus, Ancyra at Tavium bilang kanilang mga sentro. Sila ay nanalakay at nagpaupa ng sarili sa loob ng isang siglo, napigilan ni Attalus I ng Pergamo, na ang tagumpay ay inaalaala ng Naghihingalong Galo, at dinurog ng konsul na Romanong si Manlius Vulso noong 189 BK; sinasabi ni Jerome, noong ika-4 na siglo AD, na nagsasalita pa rin sila ng wikang gaya ng sa mga Treveri sa Moselle. Nang mamatay ang huling hari, si Amyntas, noong 25 BK, ginawa ni Augusto ang Galacia na lalawigang Romano at idinagdag dito ang Pisidia at mga bahagi ng Frigia at Licaonia, kasama ang Antioquia, Iconio, Listra at Derbe."
    - "Kaya pinagtatalunan ang Galacia ng Bagong Tipan. Itinatag nina Pablo at Bernabe ang mga iglesia sa mga lungsod sa timog sa unang paglalakbay; sa ikalawa, “nang kanilang matahak ang lupain ng Frigia at Galacia”, at sa ikatlo, “tinahak ang lupain ng Galacia, at Frigia, na sunodsunod, na pinagtitibay ang lahat ng mga alagad”. Ang Sulat “sa mga iglesia ng Galacia”, na nagpapaalala ng una niyang pangangaral sa kanila “dahil sa sakit ng laman” at pagtanggap sa kaniya “tulad sa isang anghel ng Dios”, ay para sa mga iglesia ng Gawa 13–14 sa pananaw na Timog Galacia, at sa nahikayat sa hilagang Galo, na wala sa Mga Gawa, sa mas lumang pananaw na Hilagang Galacia; bukas ang tanong, pati petsa nito. Nag-utos si Pablo ng ambagan doon para sa Jerusalem, pumunta si Crescente sa Galacia sa huling araw niya, at sumulat si Pedro sa mga nangingibang bayan sa “Ponto, Galacia, Capadocia, Asia at Bitinia”."
    - "Itinago ng Ancyra ang pinakamahusay na kopya ng Res Gestae ni Augusto sa mga pader ng kaniyang templo roon. Hinati ang lalawigan noong ika-4 na siglo, at nawala ang pangalan sa ilalim ng mga Bisantino at mga Turko. Ang Ankara, ang kabisera ng Turkiya mula 1923, ay nakatayo sa lumang Ancyra, at ang Pessinus (Ballıhisar) at Tavium (Büyüknefes) ay mga nayong may mga guho."
  da:
    - "Galatien er det høje plateau i det centrale Anatolien omkring Ancyra, nutidens Ankara, opkaldt efter gallerne (Galatai), som i 278 f.Kr. satte over til Lilleasien og bosatte sig der i tre stammer, tolistobogierne, tektosagerne og trokmerne, med Pessinus, Ancyra og Tavium som centre. De plyndrede og lejede sig ud i et århundrede, blev holdt i skak af Attalos I af Pergamon, hvis sejr mindes af skulpturen Den døende galler, og knust af den romerske konsul Manlius Vulso i 189 f.Kr.; Hieronymus siger i 300-tallet e.Kr., at de stadig talte et sprog som treverernes ved Mosel. Da den sidste konge, Amyntas, døde i 25 f.Kr., gjorde Augustus Galatien til en romersk provins og føjede Pisidien og dele af Frygien og Lykaonien til den, med Antiokia, Ikonion, Lystra og Derbe."
    - "Derfor er Det Nye Testamentes Galatien omstridt. Paulus og Barnabas grundlagde menigheder i de sydlige byer på første rejse; på anden rejse drog Paulus »igennem Frygien og det galatiske Land«, og på tredje »drog han bort og rejste fra Sted til Sted igennem det galatiske Land og Frygien og styrkede alle Disciplene«. Brevet »til Menighederne i Galatien«, der minder om, hvordan han første gang forkyndte for dem »paa Grund af en Kødets Svaghed« og blev modtaget »som en Guds Engel«, er efter den sydgalatiske opfattelse stilet til menighederne i ApG 13–14 og efter den ældre nordgalatiske til omvendte i det galliske nord, som ApG aldrig nævner; spørgsmålet er åbent, og med det brevets datering. Paulus pålagde en indsamling dér til Jerusalem, Krescens drog dertil i Paulus' sidste dage, og Peter skriver til udlændingene i »Pontus, Galatien, Kappadokien, Asien og Bithynien«."
    - "Ancyra bevarede den bedste kopi af Augustus' Res Gestae på væggene af hans tempel dér. Provinsen blev delt i 300-tallet, og navnet blegnede under byzantinerne og tyrkerne. Ankara, Tyrkiets hovedstad siden 1923, ligger på det gamle Ancyra, og Pessinus (Ballıhisar) og Tavium (Büyüknefes) er landsbyer med ruiner."
  sr:
    - "Галатија је висока висораван средње Анатолије око Анкире, данашње Анкаре, названа по Галима (Галатаи) који су 278. п. н. е. прешли у Малу Азију и ту се населили у три племена, Толистобоге, Тектосаге и Трокме, са средиштима у Песинунту, Анкири и Тавију. Век су пљачкали и најмљивали се, зауздао их је Атал I Пергамски, чију победу прославља „Умирући Гал“, а сломио их је римски конзул Манлије Вулсон 189. п. н. е.; Јероним у четвртом веку н. е. каже да су још говорили језиком налик језику Треверака на Мозелу. Кад је последњи краљ Аминта умро 25. п. н. е., Август је од Галатије направио римску провинцију и придодао јој Писидију и делове Фригије и Ликаоније, с Антиохијом, Иконијем, Листром и Дервом."
    - "Та двострука употреба разлог је зашто је Галатија Новог завета спорна. Павле и Варнава основали су цркве у тим јужним градовима на првом путу; на другом путу, како стоји, „прођоше Фригију и галатијску земљу“, а на трећем је Павле „прође редом галатијску земљу и Фригију утврђујући све ученике“. Посланица „црквама галатским“, која се сећа како им је најпре проповедао „у слабости тела“ и био примљен „као анђела Божјег“, по јужногалатијском гледишту упућена је црквама из Дап 13–14, а по старијем северногалатијском обраћеницима у галском северу, који се у Делима нигде не именује; питање је отворено, а с њим и датум посланице. Павле је тамо наложио сабирање прилога за Јерусалим, Крискент је у Павловим последњим данима отишао у Галатију, а Петар пише „избраним дошљацима, расејаним по Понту, Галатији, Кападокији, Азији и Витанији“."
    - "Анкира је чувала најбољи примерак Августових Рес гестае на зидовима његовог тамошњег храма. Провинција је подељена у четвртом веку, а име је бледело под Византинцима и Турцима. Анкара, главни град Турске од 1923, стоји на старој Анкири, а Песинунт (Балихисар) и Тавиј (Бујукнефес) села су с рушевинама."
