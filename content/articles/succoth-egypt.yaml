# Overview article (ADR 0007). Mainstream facts only; the Egyptian Succoth of the exodus, not the Succoth of the Jordan valley (succoth.yaml); the site is disputed and the app's candidates are named without choosing; the date of the Exodus is not given.
id: succoth-egypt
place: aa28709
title:
  en: "Succoth"
  ru: "Сокхоф"
  uk: "Сокхот"
  es: "Sucot"
  pt: "Sucote"
  de: "Sukkot"
  fr: "Succoth"
body:
  en:
    - "Succoth was the first station of the exodus: “the children of Israel journeyed from Rameses to Succoth, about six hundred thousand on foot that were men, beside children”, and from Succoth they went on to Etham “in the edge of the wilderness”. The itinerary of Numbers repeats the two stages. The Hebrew name means booths, and the place is not the Succoth of Jacob and Gideon in the Jordan valley. Most scholars see in it the Egyptian Tjeku, a name for the eastern Wadi Tumilat, the narrow valley that runs from the Delta to the Bitter Lakes and was the natural road out of Egypt towards Sinai. Two papyri of the late thirteenth century BC know Tjeku well: one reports Shasu bedouin from Edom let through its fortress to the pools of Pithom to water their flocks, another a pursuit of two runaway slaves past the walls of Tjeku."
    - "Where in the valley Succoth stood is disputed. The usual candidate is Tell el-Maskhuta near its eastern end, about 17 km west of Ismailia, where Édouard Naville dug in 1883 and found storehouses and the name Tjeku, though he took the site for Pithom. John Holladay's excavations of 1978–1985 showed that the town there was founded about 600 BC, when Necho II cut his canal through the valley, with a Hyksos-period settlement before and almost nothing of the New Kingdom between; so many now put Pithom at Tell er-Retaba, 13 km further west, and let Succoth be the district rather than one mound, while others hold that Succoth and Pithom were the same place. The map marks Tell el-Maskhuta, the neighbourhood of Jabal Maryam by Lake Timsah, Tell er-Retaba, and the identity with Pithom."
    - "Wadi Tumilat today lies in the Ismailia governorate of Egypt, watered by the Ismailia Canal of the 1860s along the line of the ancient one; the railway and the road from Zagazig to Ismailia follow it, and the mounds of el-Maskhuta and er-Retaba rise among the fields."
  ru:
    - "Сокхоф — первый стан исхода: «отправились сыны Израилевы из Раамсеса в Сокхоф до шестисот тысяч пеших мужчин, кроме детей», а из Сокхофа двинулись дальше в Ефам, «в конце пустыни». Список станов в книге Чисел повторяет оба перехода. Еврейское имя значит «шалаши», и это не Сокхоф Иакова и Гедеона в долине Иордана. Большинство учёных видят в нём египетское Чеку — название восточной части Вади-Тумилат, узкой долины, идущей от Дельты к Горьким озёрам и бывшей естественной дорогой из Египта к Синаю. Два папируса конца XIII века до н. э. хорошо знают Чеку: один доносит, что бедуинов-шасу из Едома пропустили через его крепость к прудам Пифома напоить стада, другой рассказывает о погоне за двумя беглыми рабами мимо стен Чеку."
    - "Где в долине стоял Сокхоф, спорно. Обычный кандидат — Телль-эль-Масхута у её восточного конца, примерно в 17 км к западу от Исмаилии, где Эдуар Навилль копал в 1883 году и нашёл склады и имя Чеку, хотя принял городище за Пифом. Раскопки Джона Холладея 1978–1985 годов показали, что тамошний город основан около 600 г. до н. э., когда Нехо II провёл по долине свой канал; до него было поселение времён гиксосов, а от Нового царства между ними почти ничего. Поэтому многие теперь помещают Пифом в Телль-эр-Ретабу, на 13 км западнее, а Сокхоф считают скорее округой, чем одним холмом; другие держатся того, что Сокхоф и Пифом — одно место. На карте отмечены Телль-эль-Масхута, окрестности Джебель-Марьям у озера Тимсах, Телль-эр-Ретаба и тождество с Пифомом."
    - "Вади-Тумилат сегодня лежит в египетской мухафазе Исмаилия; его орошает Исмаилийский канал 1860-х годов, проведённый по линии древнего; вдоль него идут железная дорога и шоссе из Загазига в Исмаилию, а холмы Эль-Масхута и Эр-Ретаба поднимаются среди полей."
  uk:
    - "Сокхот був першою стоянкою виходу: «мандрували сини Ізрайлеві од Рамсесу до Сухоту до шесьтьох сот тисяч пішки чоловіка, опріч дїтви», а від Сокхоту вони пішли до Етама «уз край степу». Подорожній перелік Числ повторює ці два переходи. Староєврейська назва означає шатра, і це місце — не той Сокхот Якова й Гедеона в долині Йордану. Більшість учених бачать у ньому єгипетське Чеку, назву східного Вади-Тумілат, вузької долини, що йде від Дельти до Гірких озер і була природною дорогою з Єгипту до Синаю. Два папіруси кінця XIII ст. до н. е. добре знають Чеку: один повідомляє, що бедуїнів-шасу з Едому пропустили через його фортецю до ставків Пітому напувати череди, інший — про погоню за двома втікачами-рабами повз мури Чеку."
    - "Де саме в долині стояв Сокхот, спірно. Звичайний кандидат — Телль-ель-Мескгута біля її східного краю, приблизно за 17 км на захід від Ісмаїлії, де Едуар Навіль копав 1883 року й знайшов склади та назву Чеку, хоч місце він вважав за Пітом. Розкопки Джона Холладея 1978–1985 років показали, що тамтешнє місто засноване близько 600 р. до н. е., коли Нехо II прорив крізь долину свій канал, з поселенням доби гіксосів перед тим і майже нічим з Нового царства між ними; тому багато хто тепер розміщує Пітом у Телль-ер-Ретабі, ще на 13 км на захід, а Сокхот вважає округою, а не одним пагорбом, тоді як інші вважають, що Сокхот і Пітом — те саме місце. Мапа позначає Телль-ель-Мескгуту, околиці Джебель-Мар’ям біля озера Тімсах, Телль-ер-Ретабу та тотожність із Пітомом."
    - "Вади-Тумілат нині лежить в єгипетській провінції Ісмаїлія, зрошуваний каналом Ісмаїлія 1860-х років уздовж лінії давнього; залізниця й дорога з Загазіга до Ісмаїлії йдуть уздовж нього, а пагорби Мескгути й Ретаби здіймаються серед полів."
  es:
    - "Sucot fue la primera estación del éxodo: «partieron los hijos de Israel de Rameses á Succoth, como seiscientos mil hombres de á pie, sin contar los niños», y de Sucot siguieron hasta Etam, «á la entrada del desierto». El itinerario de Números repite las dos etapas. El nombre hebreo significa cabañas, y el lugar no es el Sucot de Jacob y de Gedeón en el valle del Jordán. La mayoría de los estudiosos ven en él el egipcio Tjeku, nombre del Wadi Tumilat oriental, el valle estrecho que va del Delta a los lagos Amargos y era el camino natural de salida de Egipto hacia el Sinaí. Dos papiros de finales del siglo XIII a. C. conocen bien Tjeku: uno informa de beduinos shasu de Edom a quienes se dejó pasar por su fortaleza hasta los estanques de Pitón para abrevar sus rebaños, otro de la persecución de dos esclavos fugitivos más allá de las murallas de Tjeku."
    - "Dónde estuvo Sucot en el valle es discutido. El candidato habitual es Tell el-Maskhuta, cerca de su extremo oriental, a unos 17 km al oeste de Ismailía, donde Édouard Naville excavó en 1883 y halló almacenes y el nombre de Tjeku, aunque tomó el sitio por Pitón. Las excavaciones de John Holladay, de 1978 a 1985, mostraron que la ciudad allí se fundó hacia 600 a. C., cuando Necao II abrió su canal por el valle, con un asentamiento de época hicsa antes y casi nada del Reino Nuevo entre medias; por eso muchos sitúan ahora Pitón en Tell er-Retaba, 13 km más al oeste, y dejan que Sucot sea el distrito y no un solo montículo, mientras que otros sostienen que Sucot y Pitón eran el mismo lugar. El mapa marca Tell el-Maskhuta, las inmediaciones de Jabal Maryam junto al lago Timsah, Tell er-Retaba y la identidad con Pitón."
    - "El Wadi Tumilat se halla hoy en la gobernación egipcia de Ismailía, regado por el canal de Ismailía de la década de 1860, trazado sobre la línea del antiguo; el ferrocarril y la carretera de Zagazig a Ismailía lo siguen, y los montículos de el-Maskhuta y er-Retaba se alzan entre los campos."
  pt:
    - "Sucote foi a primeira estação do êxodo: “Os filhos de Israel viajaram de Ramessés a Sucote, cerca de seiscentos mil homens a pé, além das crianças”, e de Sucote foram a Etã, “na beira do deserto”. O itinerário de Números repete as duas etapas. O nome hebraico significa tendas, e o lugar não é a Sucote de Jacó e Gideão, no vale do Jordão. A maioria dos estudiosos vê nele o egípcio Tjeku, nome do Wadi Tumilat oriental, o vale estreito que vai do Delta aos Lagos Amargos e era o caminho natural para sair do Egito rumo ao Sinai. Dois papiros do fim do século XIII a.C. conhecem bem Tjeku: um relata beduínos shasu de Edom deixados passar pela fortaleza até os tanques de Pitom para dar de beber aos rebanhos, outro a perseguição de dois escravos fugitivos junto às muralhas de Tjeku."
    - "Onde no vale ficava Sucote é discutido. O candidato habitual é Tell el-Maskhuta, perto de sua extremidade leste, a cerca de 17 km a oeste de Ismailia, onde Édouard Naville escavou em 1883 e encontrou armazéns e o nome Tjeku, embora tenha tomado o sítio por Pitom. As escavações de John Holladay, de 1978–1985, mostraram que a cidade ali foi fundada por volta de 600 a.C., quando Neco II abriu seu canal pelo vale, com um povoado do período hicso antes e quase nada do Reino Novo entre eles; por isso muitos hoje põem Pitom em Tell er-Retaba, 13 km mais a oeste, e deixam Sucote ser o distrito, e não um só monte, enquanto outros sustentam que Sucote e Pitom eram o mesmo lugar. O mapa marca Tell el-Maskhuta, as imediações de Jabal Maryam junto ao lago Timsah, Tell er-Retaba e a identidade com Pitom."
    - "O Wadi Tumilat hoje fica na província de Ismailia, no Egito, irrigado pelo Canal de Ismailia, da década de 1860, que segue a linha do antigo; a ferrovia e a estrada de Zagazig a Ismailia o acompanham, e os montes de el-Maskhuta e er-Retaba se erguem entre os campos."
  de:
    - "Sukkot war die erste Station des Auszugs: „Also zogen aus die Kinder Israel von Raemses gen Sukkoth, sechshunderttausend Mann zu Fuß ohne die Kinder“, und von Sukkot zogen sie weiter nach Etam, „vorn an der Wüste“. Die Stationenliste im Buch Numeri wiederholt die beiden Etappen. Der hebräische Name bedeutet Hütten, und der Ort ist nicht das Sukkot Jakobs und Gideons im Jordantal. Die meisten Forscher sehen darin das ägyptische Tjeku, einen Namen für das östliche Wadi Tumilat, das schmale Tal, das vom Delta zu den Bitterseen führt und der natürliche Weg aus Ägypten Richtung Sinai war. Zwei Papyri des späten dreizehnten Jahrhunderts v. Chr. kennen Tjeku: Der eine meldet Schasu-Beduinen aus Edom, die durch seine Festung zu den Teichen von Pitom gelassen wurden, um ihre Herden zu tränken, der andere die Verfolgung zweier entlaufener Sklaven an den Mauern von Tjeku vorbei."
    - "Wo im Tal Sukkot lag, ist umstritten. Der übliche Kandidat ist Tell el-Maskhuta nahe seinem Ostende, etwa 17 km westlich von Ismailia, wo Édouard Naville 1883 grub und Magazine sowie den Namen Tjeku fand, obwohl er die Stätte für Pitom hielt. John Holladays Grabungen von 1978–1985 zeigten, dass die dortige Stadt um 600 v. Chr. gegründet wurde, als Necho II. seinen Kanal durch das Tal zog, mit einer Siedlung der Hyksos-Zeit davor und fast nichts aus dem Neuen Reich dazwischen; daher setzen viele Pitom nun nach Tell er-Retaba, 13 km weiter westlich, und lassen Sukkot den Bezirk statt eines einzelnen Hügels sein, während andere Sukkot und Pitom für denselben Ort halten. Die Karte verzeichnet Tell el-Maskhuta, die Umgebung des Jabal Maryam am Timsah-See, Tell er-Retaba und die Gleichsetzung mit Pitom."
    - "Das Wadi Tumilat liegt heute im Gouvernement Ismailia in Ägypten, bewässert vom Ismailia-Kanal der 1860er Jahre entlang der Linie des antiken; die Eisenbahn und die Straße von Zagazig nach Ismailia folgen ihm, und die Hügel von el-Maskhuta und er-Retaba erheben sich zwischen den Feldern."
  fr:
    - "Succoth fut la première étape de l’exode : « Les enfants d’Israël partirent de Ramsès pour Succoth au nombre d’environ six cent mille hommes de pied, sans les enfants », et de Succoth ils gagnèrent Étham, « à l’extrémité du désert ». L’itinéraire des Nombres répète les deux étapes. Le nom hébreu signifie cabanes, et le lieu n’est pas le Succoth de Jacob et de Gédéon dans la vallée du Jourdain. La plupart des spécialistes y voient l’égyptien Tjeku, nom de l’est du Ouadi Toumilat, l’étroite vallée qui va du Delta aux Lacs Amers et fut la route naturelle hors d’Égypte vers le Sinaï. Deux papyrus de la fin du XIIIe siècle av. J.-C. connaissent bien Tjeku : l’un signale des bédouins Shasou d’Édom admis par sa forteresse aux bassins de Pithom pour abreuver leurs troupeaux, l’autre la poursuite de deux esclaves fugitifs devant les murs de Tjeku."
    - "L’emplacement de Succoth dans la vallée est discuté. Le candidat habituel est Tell el-Maskhuta, près de son extrémité orientale, à environ 17 km à l’ouest d’Ismaïlia, où Édouard Naville fouilla en 1883 et trouva des entrepôts et le nom de Tjeku, bien qu’il y vît Pithom. Les fouilles de John Holladay en 1978-1985 montrèrent que la ville y fut fondée vers 600 av. J.-C., lorsque Néchao II creusa son canal dans la vallée, avec un établissement de l’époque hyksôs avant et presque rien du Nouvel Empire entre les deux ; beaucoup placent donc Pithom à Tell er-Retaba, 13 km plus à l’ouest, et font de Succoth un district plutôt qu’un seul tertre, tandis que d’autres tiennent Succoth et Pithom pour un même lieu. La carte marque Tell el-Maskhuta, les abords de Jabal Maryam près du lac Timsah, Tell er-Retaba, et l’identité avec Pithom."
    - "Le Ouadi Toumilat se trouve aujourd’hui dans le gouvernorat d’Ismaïlia, en Égypte, arrosé par le canal d’Ismaïlia des années 1860, qui suit la ligne de l’ancien ; le chemin de fer et la route de Zagazig à Ismaïlia l’empruntent, et les tertres d’el-Maskhuta et d’er-Retaba s’élèvent parmi les champs."
