body:
  en:
    - "Succoth was the first station of the exodus: “the children of Israel journeyed from Rameses to Succoth, about six hundred thousand on foot that were men, beside children”, and from Succoth they went on to Etham “in the edge of the wilderness”. The itinerary of Numbers repeats the two stages. The Hebrew name means booths, and the place is not the Succoth of Jacob and Gideon in the Jordan valley. Most scholars see in it the Egyptian Tjeku, a name for the eastern Wadi Tumilat, the narrow valley that runs from the Delta to Lake Timsah and was the natural road out of Egypt towards Sinai. Two papyri of the late thirteenth century BC know Tjeku well: one reports Shasu bedouin from Edom let through its fortress to the pools of Pithom to water their flocks, another a pursuit of two runaway slaves past the walls of Tjeku."
    - "Where in the valley Succoth stood is disputed. The usual candidate is Tell el-Maskhuta near its eastern end, about 17 km west of Ismailia, where Édouard Naville dug in 1883 and found storehouses and the name Tjeku, though he took the site for Pithom. John Holladay's excavations of 1978–1985 showed that the town there was founded about 600 BC, when Necho II cut his canal through the valley, with a Hyksos-period settlement before and almost nothing of the New Kingdom between; so many now put Pithom at Tell er-Retaba, 13 km further west, and let Succoth be the district rather than one mound, while others hold that Succoth and Pithom were the same place. The map marks Tell el-Maskhuta, the neighbourhood of Jabal Maryam by Lake Timsah, Tell er-Retaba, and the identity with Pithom."
    - "Wadi Tumilat today lies in the Ismailia governorate of Egypt, watered by the Ismailia Canal of the 1860s along the line of the ancient one; the railway and the road from Zagazig to Ismailia follow it, and the mounds of el-Maskhuta and er-Retaba rise among the fields."
  ru:
    - "Сокхоф — первый стан исхода: «отправились сыны Израилевы из Раамсеса в Сокхоф до шестисот тысяч пеших мужчин, кроме детей», а из Сокхофа двинулись дальше в Ефам, «в конце пустыни». Список станов в книге Чисел повторяет оба перехода. Еврейское имя значит «шалаши», и это не Сокхоф Иакова и Гедеона в долине Иордана. Большинство учёных видят в нём египетское Чеку — название восточной части Вади-Тумилат, узкой долины, идущей от Дельты к озеру Тимсах и бывшей естественной дорогой из Египта к Синаю. Два папируса конца XIII века до н. э. хорошо знают Чеку: один доносит, что бедуинов-шасу из Едома пропустили через его крепость к прудам Пифома напоить стада, другой рассказывает о погоне за двумя беглыми рабами мимо стен Чеку."
    - "Где в долине стоял Сокхоф, спорно. Обычный кандидат — Телль-эль-Масхута у её восточного конца, примерно в 17 км к западу от Исмаилии, где Эдуар Навилль копал в 1883 году и нашёл склады и имя Чеку, хотя принял городище за Пифом. Раскопки Джона Холладея 1978–1985 годов показали, что тамошний город основан около 600 г. до н. э., когда Нехо II провёл по долине свой канал; до него было поселение времён гиксосов, а от Нового царства между ними почти ничего. Поэтому многие теперь помещают Пифом в Телль-эр-Ретабу, на 13 км западнее, а Сокхоф считают скорее округой, чем одним холмом; другие держатся того, что Сокхоф и Пифом — одно место. На карте отмечены Телль-эль-Масхута, окрестности Джебель-Марьям у озера Тимсах, Телль-эр-Ретаба и тождество с Пифомом."
    - "Вади-Тумилат сегодня лежит в египетской мухафазе Исмаилия; его орошает Исмаилийский канал 1860-х годов, проведённый по линии древнего; вдоль него идут железная дорога и шоссе из Загазига в Исмаилию, а холмы Эль-Масхута и Эр-Ретаба поднимаются среди полей."
  uk:
    - "Сокхот був першою стоянкою виходу: «мандрували сини Ізрайлеві од Рамсесу до Сухоту до шесьтьох сот тисяч пішки чоловіка, опріч дїтви», а від Сокхоту вони пішли до Етама «уз край степу». Подорожній перелік Числ повторює ці два переходи. Староєврейська назва означає шатра, і це місце — не той Сокхот Якова й Гедеона в долині Йордану. Більшість учених бачать у ньому єгипетське Чеку, назву східного Вади-Тумілат, вузької долини, що йде від Дельти до озера Тімсах і була природною дорогою з Єгипту до Синаю. Два папіруси кінця XIII ст. до н. е. добре знають Чеку: один повідомляє, що бедуїнів-шасу з Едому пропустили через його фортецю до ставків Пітому напувати череди, інший — про погоню за двома втікачами-рабами повз мури Чеку."
    - "Де саме в долині стояв Сокхот, спірно. Звичайний кандидат — Телль-ель-Мескгута біля її східного краю, приблизно за 17 км на захід від Ісмаїлії, де Едуар Навіль копав 1883 року й знайшов склади та назву Чеку, хоч місце він вважав за Пітом. Розкопки Джона Холладея 1978–1985 років показали, що тамтешнє місто засноване близько 600 р. до н. е., коли Нехо II прорив крізь долину свій канал, з поселенням доби гіксосів перед тим і майже нічим з Нового царства між ними; тому багато хто тепер розміщує Пітом у Телль-ер-Ретабі, ще на 13 км на захід, а Сокхот вважає округою, а не одним пагорбом, тоді як інші вважають, що Сокхот і Пітом — те саме місце. Мапа позначає Телль-ель-Мескгуту, околиці Джебель-Мар’ям біля озера Тімсах, Телль-ер-Ретабу та тотожність із Пітомом."
    - "Вади-Тумілат нині лежить в єгипетській провінції Ісмаїлія, зрошуваний каналом Ісмаїлія 1860-х років уздовж лінії давнього; залізниця й дорога з Загазіга до Ісмаїлії йдуть уздовж нього, а пагорби Мескгути й Ретаби здіймаються серед полів."
  es:
    - "Sucot fue la primera estación del éxodo: «partieron los hijos de Israel de Rameses á Succoth, como seiscientos mil hombres de á pie, sin contar los niños», y de Sucot siguieron hasta Etam, «á la entrada del desierto». El itinerario de Números repite las dos etapas. El nombre hebreo significa cabañas, y el lugar no es el Sucot de Jacob y de Gedeón en el valle del Jordán. La mayoría de los estudiosos ven en él el egipcio Tjeku, nombre del Wadi Tumilat oriental, el valle estrecho que va del Delta al lago Timsah y era el camino natural de salida de Egipto hacia el Sinaí. Dos papiros de finales del siglo XIII a. C. conocen bien Tjeku: uno informa de beduinos shasu de Edom a quienes se dejó pasar por su fortaleza hasta los estanques de Pitón para abrevar sus rebaños, otro de la persecución de dos esclavos fugitivos más allá de las murallas de Tjeku."
    - "Dónde estuvo Sucot en el valle es discutido. El candidato habitual es Tell el-Maskhuta, cerca de su extremo oriental, a unos 17 km al oeste de Ismailía, donde Édouard Naville excavó en 1883 y halló almacenes y el nombre de Tjeku, aunque tomó el sitio por Pitón. Las excavaciones de John Holladay, de 1978 a 1985, mostraron que la ciudad allí se fundó hacia 600 a. C., cuando Necao II abrió su canal por el valle, con un asentamiento de época hicsa antes y casi nada del Reino Nuevo entre medias; por eso muchos sitúan ahora Pitón en Tell er-Retaba, 13 km más al oeste, y dejan que Sucot sea el distrito y no un solo montículo, mientras que otros sostienen que Sucot y Pitón eran el mismo lugar. El mapa marca Tell el-Maskhuta, las inmediaciones de Jabal Maryam junto al lago Timsah, Tell er-Retaba y la identidad con Pitón."
    - "El Wadi Tumilat se halla hoy en la gobernación egipcia de Ismailía, regado por el canal de Ismailía de la década de 1860, trazado sobre la línea del antiguo; el ferrocarril y la carretera de Zagazig a Ismailía lo siguen, y los montículos de el-Maskhuta y er-Retaba se alzan entre los campos."
  pt:
    - "Sucote foi a primeira estação do êxodo: “Os filhos de Israel viajaram de Ramessés a Sucote, cerca de seiscentos mil homens a pé, além das crianças”, e de Sucote foram a Etã, “na beira do deserto”. O itinerário de Números repete as duas etapas. O nome hebraico significa tendas, e o lugar não é a Sucote de Jacó e Gideão, no vale do Jordão. A maioria dos estudiosos vê nele o egípcio Tjeku, nome do Wadi Tumilat oriental, o vale estreito que vai do Delta ao lago Timsah e era o caminho natural para sair do Egito rumo ao Sinai. Dois papiros do fim do século XIII a.C. conhecem bem Tjeku: um relata beduínos shasu de Edom deixados passar pela fortaleza até os tanques de Pitom para dar de beber aos rebanhos, outro a perseguição de dois escravos fugitivos junto às muralhas de Tjeku."
    - "Onde no vale ficava Sucote é discutido. O candidato habitual é Tell el-Maskhuta, perto de sua extremidade leste, a cerca de 17 km a oeste de Ismailia, onde Édouard Naville escavou em 1883 e encontrou armazéns e o nome Tjeku, embora tenha tomado o sítio por Pitom. As escavações de John Holladay, de 1978–1985, mostraram que a cidade ali foi fundada por volta de 600 a.C., quando Neco II abriu seu canal pelo vale, com um povoado do período hicso antes e quase nada do Reino Novo entre eles; por isso muitos hoje põem Pitom em Tell er-Retaba, 13 km mais a oeste, e deixam Sucote ser o distrito, e não um só monte, enquanto outros sustentam que Sucote e Pitom eram o mesmo lugar. O mapa marca Tell el-Maskhuta, as imediações de Jabal Maryam junto ao lago Timsah, Tell er-Retaba e a identidade com Pitom."
    - "O Wadi Tumilat hoje fica na província de Ismailia, no Egito, irrigado pelo Canal de Ismailia, da década de 1860, que segue a linha do antigo; a ferrovia e a estrada de Zagazig a Ismailia o acompanham, e os montes de el-Maskhuta e er-Retaba se erguem entre os campos."
  de:
    - "Sukkot war die erste Station des Auszugs: „Also zogen aus die Kinder Israel von Raemses gen Sukkoth, sechshunderttausend Mann zu Fuß ohne die Kinder“, und von Sukkot zogen sie weiter nach Etam, „vorn an der Wüste“. Die Stationenliste im Buch Numeri wiederholt die beiden Etappen. Der hebräische Name bedeutet Hütten, und der Ort ist nicht das Sukkot Jakobs und Gideons im Jordantal. Die meisten Forscher sehen darin das ägyptische Tjeku, einen Namen für das östliche Wadi Tumilat, das schmale Tal, das vom Delta zum Timsahsee führt und der natürliche Weg aus Ägypten Richtung Sinai war. Zwei Papyri des späten dreizehnten Jahrhunderts v. Chr. kennen Tjeku: Der eine meldet Schasu-Beduinen aus Edom, die durch seine Festung zu den Teichen von Pitom gelassen wurden, um ihre Herden zu tränken, der andere die Verfolgung zweier entlaufener Sklaven an den Mauern von Tjeku vorbei."
    - "Wo im Tal Sukkot lag, ist umstritten. Der übliche Kandidat ist Tell el-Maskhuta nahe seinem Ostende, etwa 17 km westlich von Ismailia, wo Édouard Naville 1883 grub und Magazine sowie den Namen Tjeku fand, obwohl er die Stätte für Pitom hielt. John Holladays Grabungen von 1978–1985 zeigten, dass die dortige Stadt um 600 v. Chr. gegründet wurde, als Necho II. seinen Kanal durch das Tal zog, mit einer Siedlung der Hyksos-Zeit davor und fast nichts aus dem Neuen Reich dazwischen; daher setzen viele Pitom nun nach Tell er-Retaba, 13 km weiter westlich, und lassen Sukkot den Bezirk statt eines einzelnen Hügels sein, während andere Sukkot und Pitom für denselben Ort halten. Die Karte verzeichnet Tell el-Maskhuta, die Umgebung des Jabal Maryam am Timsah-See, Tell er-Retaba und die Gleichsetzung mit Pitom."
    - "Das Wadi Tumilat liegt heute im Gouvernement Ismailia in Ägypten, bewässert vom Ismailia-Kanal der 1860er Jahre entlang der Linie des antiken; die Eisenbahn und die Straße von Zagazig nach Ismailia folgen ihm, und die Hügel von el-Maskhuta und er-Retaba erheben sich zwischen den Feldern."
  fr:
    - "Succoth fut la première étape de l’exode : « Les enfants d’Israël partirent de Ramsès pour Succoth au nombre d’environ six cent mille hommes de pied, sans les enfants », et de Succoth ils gagnèrent Étham, « à l’extrémité du désert ». L’itinéraire des Nombres répète les deux étapes. Le nom hébreu signifie cabanes, et le lieu n’est pas le Succoth de Jacob et de Gédéon dans la vallée du Jourdain. La plupart des spécialistes y voient l’égyptien Tjeku, nom de l’est du Ouadi Toumilat, l’étroite vallée qui va du Delta au lac Timsah et fut la route naturelle hors d’Égypte vers le Sinaï. Deux papyrus de la fin du XIIIe siècle av. J.-C. connaissent bien Tjeku : l’un signale des bédouins Shasou d’Édom admis par sa forteresse aux bassins de Pithom pour abreuver leurs troupeaux, l’autre la poursuite de deux esclaves fugitifs devant les murs de Tjeku."
    - "L’emplacement de Succoth dans la vallée est discuté. Le candidat habituel est Tell el-Maskhuta, près de son extrémité orientale, à environ 17 km à l’ouest d’Ismaïlia, où Édouard Naville fouilla en 1883 et trouva des entrepôts et le nom de Tjeku, bien qu’il y vît Pithom. Les fouilles de John Holladay en 1978-1985 montrèrent que la ville y fut fondée vers 600 av. J.-C., lorsque Néchao II creusa son canal dans la vallée, avec un établissement de l’époque hyksôs avant et presque rien du Nouvel Empire entre les deux ; beaucoup placent donc Pithom à Tell er-Retaba, 13 km plus à l’ouest, et font de Succoth un district plutôt qu’un seul tertre, tandis que d’autres tiennent Succoth et Pithom pour un même lieu. La carte marque Tell el-Maskhuta, les abords de Jabal Maryam près du lac Timsah, Tell er-Retaba, et l’identité avec Pithom."
    - "Le Ouadi Toumilat se trouve aujourd’hui dans le gouvernorat d’Ismaïlia, en Égypte, arrosé par le canal d’Ismaïlia des années 1860, qui suit la ligne de l’ancien ; le chemin de fer et la route de Zagazig à Ismaïlia l’empruntent, et les tertres d’el-Maskhuta et d’er-Retaba s’élèvent parmi les champs."
  pl:
    - "Sukkot było pierwszą stacją wyjścia z Egiptu: „Ciągnęli tedy synowie Izraelscy z Rameses do Suchotu, około sześć kroć sto tysięcy pieszych mężów tylko, okrom dzieci”, a z Sukkot poszli do Etam, „na końcu puszczy”. Wykaz stacji w Księdze Liczb powtarza te dwa etapy. Hebrajska nazwa znaczy szałasy, a miejsce to nie jest Sukkot Jakuba i Gedeona w dolinie Jordanu. Większość badaczy widzi w nim egipskie Tjeku, nazwę wschodniego Wadi Tumilat, wąskiej doliny biegnącej od Delty do jeziora Timsah, która była naturalną drogą z Egiptu ku Synajowi. Dwa papirusy z końca XIII wieku p.n.e. dobrze znają Tjeku: jeden donosi o beduinach Szasu z Edomu, przepuszczonych przez jego twierdzę do sadzawek Pitom, by napoili swe trzody, drugi o pościgu za dwoma zbiegłymi niewolnikami wzdłuż murów Tjeku."
    - "Gdzie w dolinie leżało Sukkot, jest sporne. Zwykłym kandydatem jest Tell el-Maskuta u jej wschodniego krańca, około 17 km na zachód od Ismailii, gdzie Édouard Naville kopał w 1883 roku i znalazł magazyny oraz nazwę Tjeku, choć uznał to stanowisko za Pitom. Wykopaliska Johna Holladaya z lat 1978–1985 wykazały, że miasto tam założono około 600 roku p.n.e., gdy Neko II wykuł kanał przez dolinę, z osadą z okresu Hyksosów wcześniej i prawie niczym z Nowego Państwa pomiędzy; dlatego wielu umieszcza dziś Pitom w Tell er-Retaba, 13 km dalej na zachód, i uznaje Sukkot za okręg, a nie jeden kopiec, podczas gdy inni twierdzą, że Sukkot i Pitom były tym samym miejscem. Mapa zaznacza Tell el-Maskuta, okolice Dżabal Marjam nad jeziorem Timsah, Tell er-Retaba oraz utożsamienie z Pitom."
    - "Wadi Tumilat leży dziś w egipskiej muhafazie Ismailia, nawadniane kanałem Ismailia z lat sześćdziesiątych XIX wieku, biegnącym wzdłuż linii starożytnego; podąża nią kolej i droga z Zagazig do Ismailii, a kopce el-Maskuta i er-Retaba wznoszą się wśród pól."
  it:
    - "Succot fu la prima tappa dell’esodo: «I figliuoli d’Israele partirono da Ramses per Succoth, in numero di circa seicentomila uomini a piedi, senza contare i fanciulli», e da Succot proseguirono per Etam «all’estremità del deserto». L’itinerario dei Numeri ripete le due tappe. Il nome ebraico significa capanne, e il luogo non è la Succot di Giacobbe e di Gedeone nella valle del Giordano. La maggior parte degli studiosi vi riconosce l’egiziano Tjeku, nome dell’uadi Tumilat orientale, la stretta valle che va dal Delta al lago Timsah ed era la via naturale d’uscita dall’Egitto verso il Sinai. Due papiri della fine del XIII secolo a.C. conoscono bene Tjeku: uno riferisce che beduini Shasu di Edom furono lasciati passare dalla sua fortezza fino agli stagni di Pitom per abbeverare i greggi, un altro l’inseguimento di due schiavi fuggiaschi oltre le mura di Tjeku."
    - "Dove sorgesse Succot nella valle è discusso. Il candidato abituale è Tell el-Maskhuta, presso la sua estremità orientale, a circa 17 km a ovest di Ismailia, dove Édouard Naville scavò nel 1883 e trovò magazzini e il nome Tjeku, benché ritenesse il sito Pitom. Gli scavi di John Holladay del 1978–1985 mostrarono che la città lì fu fondata verso il 600 a.C., quando Necao II fece tagliare il suo canale attraverso la valle, con un insediamento di epoca hyksos prima e quasi nulla del Nuovo Regno in mezzo; perciò molti oggi collocano Pitom a Tell er-Retaba, 13 km più a ovest, e fanno di Succot il distretto più che un singolo tell, mentre altri ritengono che Succot e Pitom fossero lo stesso luogo. La mappa segna Tell el-Maskhuta, i dintorni di Jabal Maryam presso il lago Timsah, Tell er-Retaba e l’identità con Pitom."
    - "L’uadi Tumilat si trova oggi nel governatorato egiziano di Ismailia, irrigato dal canale di Ismailia degli anni 1860 lungo il tracciato dell’antico; la ferrovia e la strada da Zagazig a Ismailia lo seguono, e i tell di el-Maskhuta e di er-Retaba si ergono fra i campi."
  nl:
    - "Sukkot was het eerste station van de uittocht: “reisden de kinderen Israels uit van Rameses naar Sukkoth, omtrent zeshonderd duizend te voet, mannen alleen, behalve de kinderkens”, en vanuit Sukkot gingen zij verder naar Etam, “aan het einde der woestijn”. De reisroute in Numeri herhaalt de twee etappes. De Hebreeuwse naam betekent hutten, en de plaats is niet het Sukkot van Jakob en Gideon in de Jordaanvallei. De meeste geleerden zien erin het Egyptische Tjeku, een naam voor de oostelijke Wadi Tumilat, de smalle vallei van de Delta naar het Timsahmeer, de natuurlijke uitweg uit Egypte richting Sinaï. Twee papyri uit de late dertiende eeuw v.Chr. kennen Tjeku: de ene meldt Shasu-bedoeïenen uit Edom die door de vesting naar de poelen van Pitom mochten om hun kudden te drenken, de andere de achtervolging van twee weggelopen slaven langs de muren van Tjeku."
    - "Waar in de vallei Sukkot lag, wordt betwist. De gebruikelijke kandidaat is Tell el-Maskhuta nabij het oostelijke uiteinde, ongeveer 17 km ten westen van Ismailia, waar Édouard Naville in 1883 groef en voorraadhuizen en de naam Tjeku vond, al hield hij de plek voor Pitom. De opgravingen van John Holladay in 1978–1985 toonden dat de stad daar omstreeks 600 v.Chr. werd gesticht, toen Necho II zijn kanaal door de vallei groef, met een nederzetting uit de Hyksostijd daarvoor en bijna niets uit het Nieuwe Rijk daartussen; daarom plaatsen velen Pitom nu op Tell er-Retaba, 13 km verder naar het westen, en laten zij Sukkot het district zijn in plaats van één heuvel, terwijl anderen menen dat Sukkot en Pitom dezelfde plaats waren. De kaart markeert Tell el-Maskhuta, de omgeving van Jabal Maryam bij het Timsahmeer, Tell er-Retaba, en de gelijkstelling met Pitom."
    - "De Wadi Tumilat ligt tegenwoordig in het Egyptische gouvernement Ismailia, bevloeid door het Ismailiakanaal uit de jaren 1860 langs de lijn van het oude kanaal; de spoorlijn en de weg van Zagazig naar Ismailia volgen haar, en de heuvels van el-Maskhuta en er-Retaba rijzen op tussen de velden."
  cs:
    - "Sukot byl první stanicí exodu: „táhli synové Izraelští z Ramesses k Sochot, okolo šestkrát sto tisíc pěších, mužů toliko kromě dětí“ a ze Sukot šli dál do Etamu „při kraji pouště“. Itinerář Knihy Numeri tyto dvě etapy opakuje. Hebrejské jméno znamená „boudy“ a místo není Sukot Jákobův a Gedeonův v Jordánském údolí. Většina učenců v něm vidí egyptské Tjeku, jméno východního Wádí Tumílát, úzkého údolí vedoucího z Delty k jezeru Timsáh, které bylo přirozenou cestou z Egypta k Sinaji. Dva papyry z konce 13. stol. př. n. l. znají Tjeku dobře: jeden hlásí šasuské beduíny z Edómu, jimž byl pevností dovolen průchod k jezírkům Pitomu napojit stáda, druhý pronásledování dvou uprchlých otroků kolem hradeb Tjeku."
    - "Kde v údolí Sukot stál, je sporné. Obvyklým kandidátem je Tell el-Maskhúta při jeho východním konci, asi 17 km západně od Ismáílíje, kde Édouard Naville kopal v roce 1883 a našel sklady a jméno Tjeku, třebaže lokalitu pokládal za Pitom. Vykopávky Johna Holladaye z let 1978–1985 ukázaly, že tamní město bylo založeno kolem roku 600 př. n. l., kdy Nekó II. vedl údolím svůj kanál, s osadou z doby Hyksósů předtím a téměř ničím z Nové říše mezi tím; proto mnozí nyní kladou Pitom do Tell er-Retaby, 13 km dále na západ, a nechávají Sukot být spíše oblastí než jedním pahorkem, zatímco jiní míní, že Sukot a Pitom byly totéž místo. Mapa vyznačuje Tell el-Maskhútu, okolí Džabal Marjam u jezera Timsáh, Tell er-Retabu a ztotožnění s Pitomem."
    - "Wádí Tumílát dnes leží v egyptském guvernorátu Ismáílíja, zavlažované ismáílíjským kanálem z 60. let 19. století vedeným po trase starověkého; železnice a silnice ze Zagazigu do Ismáílíje po něm vedou a pahorky el-Maskhúta a er-Retaba se zvedají mezi poli."
  sv:
    - "Suckot var uttågets första station: ”Och Israels barn bröto upp och drogo från Rameses till Suckot, vid pass sex hundra tusen män till fots, förutom kvinnor och barn”, och från Suckot gick de vidare till Etam, ”där öknen begynte”. Färdvägen i Fjärde Mosebok upprepar de två etapperna. Det hebreiska namnet betyder hyddor, och platsen är inte det Suckot som Jakob och Gideon kom till i Jordandalen. De flesta forskare ser i det egyptiska Tjeku, ett namn på östra Wadi Tumilat, den smala dalen som löper från deltat till Timsahsjön och var den naturliga vägen ut ur Egypten mot Sinai. Två papyrer från slutet av 1200-talet f.Kr. känner väl till Tjeku: den ena berättar att shasu-beduiner från Edom släpptes in genom dess fästning till Pitoms dammar för att vattna sina hjordar, den andra om en jakt på två förrymda slavar förbi Tjekus murar."
    - "Var i dalen Suckot låg är omtvistat. Den vanliga kandidaten är Tell el-Maskhuta nära dalens östra ände, omkring 17 km väster om Ismailia, där Édouard Naville grävde 1883 och fann magasin och namnet Tjeku, fast han höll platsen för Pitom. John Holladays utgrävningar 1978–1985 visade att staden där grundades omkring 600 f.Kr., då Neko II grävde sin kanal genom dalen, med en hyksostida bosättning före och nästan ingenting från Nya riket däremellan; därför placerar många nu Pitom vid Tell er-Retaba, 13 km längre västerut, och låter Suckot vara området snarare än en enskild kulle, medan andra menar att Suckot och Pitom var samma plats. Kartan markerar Tell el-Maskhuta, trakten kring Jabal Maryam vid Timsahsjön, Tell er-Retaba och identiteten med Pitom."
    - "Wadi Tumilat ligger i dag i Egyptens guvernement Ismailia, bevattnat av Ismailiakanalen från 1860-talet längs den forna kanalens linje; järnvägen och vägen från Zagazig till Ismailia följer den, och kullarna el-Maskhuta och er-Retaba reser sig bland fälten."
  nb:
    - "Sukkot var utgangens første stasjon: «Så brøt da Israels barn op fra Ra'amses og tok veien til Sukkot, omkring seks hundre tusen mann til fots foruten barna», og fra Sukkot dro de videre til Etam «ved grensen av ørkenen». Reiseruten i Fjerde Mosebok gjentar de to etappene. Det hebraiske navnet betyr hytter, og stedet er ikke Jakobs og Gideons Sukkot i Jordandalen. De fleste forskere ser i det det egyptiske Tjeku, et navn på den østlige delen av Wadi Tumilat, den smale dalen som løper fra deltaet til Timsah-sjøen og var den naturlige veien ut av Egypt mot Sinai. To papyrus fra slutten av 1200-tallet f.Kr. kjenner Tjeku godt: den ene melder at shasu-beduiner fra Edom ble sluppet gjennom festningen til Pitoms dammer for å vanne flokkene sine, den andre at to rømte slaver ble forfulgt forbi Tjekus murer."
    - "Hvor i dalen Sukkot lå, er omstridt. Den vanlige kandidaten er Tell el-Maskhuta nær den østlige enden, omkring 17 km vest for Ismailia, hvor Édouard Naville gravde i 1883 og fant lagerhus og navnet Tjeku, selv om han mente stedet var Pitom. John Holladays utgravninger i 1978–1985 viste at byen der ble grunnlagt omkring 600 f.Kr., da Neko II gravde kanalen sin gjennom dalen, med en bosetning fra hyksostiden før og nesten ingenting fra Det nye riket imellom; derfor plasserer mange nå Pitom ved Tell er-Retaba, 13 km lenger vest, og lar Sukkot være distriktet snarere enn én haug, mens andre mener at Sukkot og Pitom var samme sted. Kartet markerer Tell el-Maskhuta, området rundt Jabal Maryam ved Timsah-sjøen, Tell er-Retaba, og identiteten med Pitom."
    - "Wadi Tumilat ligger i dag i Egypts guvernement Ismailia, vannet av Ismailia-kanalen fra 1860-årene langs linjen til den gamle; jernbanen og veien fra Zagazig til Ismailia følger den, og haugene el-Maskhuta og er-Retaba hever seg blant jordene."
  tl:
    - "Ang Succoth ang unang himpilan ng exodo: “ang angkan ni Israel ay naglakbay mula sa Rameses hanggang sa Succoth, na may anim na raang libong lalake na naglakad, bukod pa ang mga bata”, at mula roon ay tumuloy sila sa Etham “sa hangganan ng ilang”. Inuulit ng Bilang ang dalawang yugtong ito. “Mga balag” ang kahulugan ng pangalan sa Hebreo, at hindi ito ang Succoth nina Jacob at Gedeon sa libis ng Jordan. Karamihan ng iskolar ay nakakakita rito ng Ehipsiyong Tjeku, pangalan ng silangang Wadi Tumilat, makitid na libis mula sa Delta hanggang Lawa ng Timsah, likas na daan mula Egipto patungong Sinai. Kilala ang Tjeku sa dalawang papiro ng huling ika-13 siglo BK: ulat ng isa ang mga beduinong Shasu mula sa Edom na pinadaan sa kuta nito patungo sa mga lawa ng Phithom upang painumin ang kawan, ng isa pa ang paghabol sa dalawang tumakas na alipin sa tabi ng pader ng Tjeku."
    - "Pinagtatalunan kung saan sa libis nakatayo ang Succoth. Ang karaniwang kandidato ay ang Tell el-Maskhuta malapit sa silangang dulo nito, mga 17 km sa kanluran ng Ismailia, kung saan naghukay si Édouard Naville (1883) at nakatagpo ng mga imbakan at ng pangalang Tjeku, bagaman Phithom ang akala niya rito. Ipinakita ng paghuhukay ni John Holladay (1978–1985) na itinatag ang bayan doon noong mga 600 BK, nang hukayin ni Necho II ang kanal niya sa libis, na may pamayanang Hyksos bago iyon at halos wala mula sa Bagong Kaharian sa pagitan; kaya inilalagay ngayon ng marami ang Phithom sa Tell er-Retaba, 13 km pa sa kanluran, at distrito ang Succoth kaysa burol; ayon sa iba, iisa ang Succoth at Phithom. Minamarkahan ng mapa ang Tell el-Maskhuta, ang paligid ng Jabal Maryam sa Lawa ng Timsah, ang Tell er-Retaba, at ang pagkakakilanlan sa Phithom."
    - "Ang Wadi Tumilat ngayon ay nasa lalawigan ng Ismailia ng Egipto, na dinidiligan ng Kanal ng Ismailia noong dekada 1860 sa guhit ng sinaunang kanal; sinusundan ito ng riles at ng daan mula Zagazig patungong Ismailia, at ang mga burol ng el-Maskhuta at er-Retaba ay umaangat sa gitna ng mga bukid."
  da:
    - "Sukkot var udvandringens første station: »Saa rejste Israels Børn fra Raamses til Sukot, henved seks Hundrede Tusinde Mænd til Fods, foruden smaa Børn«, og fra Sukkot drog de videre til Etam »paa Grænsen af Ørken«. Numeri-bogens rejseliste gentager de to etaper. Det hebraiske navn betyder hytter, og stedet er ikke det Sukkot, som Jakob og Gideon kender, i Jordandalen. De fleste forskere ser i det det egyptiske Tjeku, et navn for den østlige Wadi Tumilat, den smalle dal, der løber fra Deltaet til Timsah-søen og var den naturlige vej ud af Egypten mod Sinaj. To papyrusser fra slutningen af 1200-tallet f.Kr. kender Tjeku godt: den ene beretter om shasu-beduiner fra Edom, der blev lukket igennem dens fæstning til Pitoms damme for at vande deres hjorde, den anden om en forfølgelse af to bortløbne slaver forbi Tjekus mure."
    - "Hvor i dalen Sukkot lå, er omstridt. Den sædvanlige kandidat er Tell el-Maskhuta nær dens østlige ende, omkring 17 km vest for Ismailia, hvor Édouard Naville gravede i 1883 og fandt pakhuse og navnet Tjeku, selv om han tog stedet for Pitom. John Holladays udgravninger i 1978–1985 viste, at byen dér blev grundlagt omkring 600 f.Kr., da Necho 2. lod sin kanal skære gennem dalen, med en bebyggelse fra hyksos-tiden før og næsten intet fra Det Nye Rige imellem; derfor placerer mange nu Pitom ved Tell er-Retaba, 13 km længere mod vest, og lader Sukkot være distriktet snarere end en enkelt tell, mens andre mener, at Sukkot og Pitom var det samme sted. Kortet markerer Tell el-Maskhuta, området omkring Jabal Maryam ved Timsah-søen, Tell er-Retaba og identiteten med Pitom."
    - "Wadi Tumilat ligger i dag i Egyptens guvernement Ismailia, vandet af Ismailia-kanalen fra 1860'erne langs linjen af den gamle kanal; jernbanen og vejen fra Zagazig til Ismailia følger den, og tellerne el-Maskhuta og er-Retaba hæver sig mellem markerne."
  sr:
    - "Сокот је била прва станица изласка: „отидоше синови Израиљеви из Рамесе у Сохот, око шест стотина хиљада пешака, самих људи осим деце“, а из Сокота су отишли у Етам, „накрај пустиње“. Попис станица у Књизи о бројевима понавља та два одсека. Хебрејско име значи колибе, а место није Сокот Јаковљев и Гедеонов у долини Јордана. Већина научника у њему види египатско Чеку, назив за источни Вади Тумилат, уску долину која иде од делте до језера Тимсах и била природни пут из Египта према Синају. Два папируса с краја 13. века п. н. е. добро знају Чеку: један извештава да су бедуини Шасу из Едома пропуштени кроз његову тврђаву до бара Питома да напоје стада, други о потери за двојицом одбеглих робова поред зидина Чекуа."
    - "Где је у долини Сокот стајао, спорно је. Уобичајени кандидат је Тел ел Масхута у њеном источном делу, око 17 км западно од Исмаилије, где је Едуар Навил копао 1883. и нашао складишта и име Чеку, мада је налазиште сматрао Питомом. Ископавања Џона Холидеја 1978–1985. показала су да је тамошњи град основан око 600. п. н. е., када је Нехо II провукао свој канал кроз долину, с насељем из доба Хикса пре тога и скоро ничим из Новог краљевства између; зато многи сада Питом смештају на Тел ер Ретаба, 13 км даље на запад, а Сокот остављају као област, а не један хум, док други држе да су Сокот и Питом исто место. Карта обележава Тел ел Масхуту, околину Џебел Мерјама крај језера Тимсах, Тел ер Ретабу и поистовећење с Питомом."
    - "Вади Тумилат данас лежи у гувернорату Исмаилија у Египту, натапан Исмаилијским каналом из 1860-их дуж трасе древног; железница и пут од Загазига до Исмаилије иду њоме, а хумови ел-Масхуте и ер-Ретабе уздижу се међу пољима."
  hu:
    - "Szukkót volt a kivonulás első állomása: „Elindulának Izráel fiai Rameszeszből Szukhóthba, mintegy hatszáz ezeren gyalog, csupán férfiak a gyermekeken kívül”, és Szukkótból Étámba mentek „a puszta szélén”. A Számok könyvének útleírása megismétli a két szakaszt. A héber név sátrakat jelent, és a hely nem azonos a Jordán-völgyi Szukkóttal, amely Jákób és Gedeon története révén ismert. A legtöbb tudós az egyiptomi Tjekut látja benne, a keleti Vádi Tumilát nevét, a Deltától a Timsza-tóig húzódó szűk völgyét, amely az Egyiptomból a Sínai felé vezető természetes út volt. A Kr. e. 13. század végi két papirusz jól ismeri Tjekut: az egyik szerint sászu beduinokat engedtek át erődjén Pitom tavaihoz, hogy megitassák nyájaikat, a másik két szökött rabszolga üldözéséről szól Tjeku falai mellett."
    - "Hogy a völgyben hol állt Szukkót, vitatott. A szokásos jelölt a Tell el-Maszkhuta a völgy keleti végénél, Iszmáílijától mintegy 17 km-re nyugatra, ahol Édouard Naville 1883-ban ásott, és raktárakat, valamint a Tjeku nevet találta, bár a lelőhelyet Pitomnak tartotta. John Holladay 1978–1985 közötti ásatásai megmutatták, hogy az ottani várost Kr. e. 600 körül alapították, amikor II. Nekó csatornáját átvágta a völgyön, előtte hükszosz kori település állt ott, közte pedig az Újbirodalomból szinte semmi; ezért ma sokan Pitomot a 13 km-rel nyugatabbra fekvő Tell er-Retabára teszik, Szukkótot pedig inkább kerületnek, mint egyetlen halomnak tartják, mások szerint Szukkót és Pitom ugyanaz a hely volt. A térkép a Tell el-Maszkhutát, a Timsza-tó melletti Dzsebel Marjam környékét, a Tell er-Retabát és a Pitommal való azonosságot jelöli."
    - "A Vádi Tumilát ma Egyiptom Iszmáílija kormányzóságában fekszik, az 1860-as évek Iszmáílija-csatornája öntözi az ókori csatorna vonalán; a vasút és a Zagazigból Iszmáílijába vezető út követi, és el-Maszkhuta és er-Retaba halmai a mezők között emelkednek."
  fi:
    - "Sukkot oli exoduksen ensimmäinen asema: ”israelilaiset lähtivät liikkeelle ja kulkivat Ramseksesta Sukkotiin; heitä oli noin kuusisataa tuhatta jalkamiestä, paitsi vaimoja ja lapsia”, ja Sukkotista he jatkoivat Etamiin, ”erämaan reunaan”. Neljännen Mooseksen kirjan reittiluettelo toistaa nämä kaksi vaihetta. Heprean nimi tarkoittaa lehtimajoja, eikä paikka ole Jaakobin ja Gideonin Sukkot Jordanin laaksossa. Useimmat tutkijat näkevät siinä egyptiläisen Tjekun, itäisen Wadi Tumilatin nimen; se on kapea laakso, joka kulkee suistosta Timsahjärvelle ja oli luonnollinen tie Egyptistä Siinaille. Kaksi 1200-luvun eaa. lopun papyrusta tuntee Tjekun hyvin: toinen kertoo Edomista tulleiden shasu-beduiinien päästetyn sen linnakkeen läpi Pitomin lammikoille juottamaan laumojaan, toinen kahden karanneen orjan takaa-ajosta Tjekun muurien ohi."
    - "Missä laaksossa Sukkot sijaitsi, on kiistanalaista. Tavallinen ehdokas on Tell el-Maskhuta sen itäpään lähellä, noin 17 km Ismailiasta länteen, jossa Édouard Naville kaivoi 1883 ja löysi varastorakennuksia ja nimen Tjeku, vaikka piti paikkaa Pitomina. John Holladayn kaivaukset 1978–1985 osoittivat kaupungin perustetun noin 600 eaa., kun Neko II kaivatti kanavansa laakson halki; sitä ennen oli hyksojen ajan asutus mutta Uuden valtakunnan ajalta lähes mitään. Siksi monet sijoittavat nyt Pitomin Tell er-Retabaan, 13 km kauemmas länteen, ja pitävät Sukkotia alueena eikä yhtenä kumpareena, kun taas toiset katsovat Sukkotin ja Pitomin olleen sama paikka. Kartalla on Tell el-Maskhuta, Jabal Maryamin seutu Timsahjärven äärellä, Tell er-Retaba ja tunnistus Pitomiin."
    - "Wadi Tumilat sijaitsee nykyisin Egyptin Ismailian kuvernementissa, ja sitä kastelee 1860-luvun Ismailian kanava muinaisen kanavan linjalla; rautatie ja Zagazigista Ismailiaan johtava tie seuraavat sitä, ja el-Maskhutan ja er-Retaban kumpareet kohoavat peltojen keskellä."
  vi:
    - "Su-cốt là chặng đầu tiên của cuộc xuất hành: “Dân Y-sơ-ra-ên đi từ Ram-se đến Su-cốt, số không kể con nít, được chừng sáu mươi vạn người đàn ông đi bộ”, và từ Su-cốt họ đi tiếp đến Ê-tam “ở cuối đầu đồng vắng”. Lộ trình trong sách Dân Số Ký lặp lại hai chặng này. Tên Hê-bơ-rơ nghĩa là các lều, và nơi này không phải Su-cốt của Gia-cốp và Ghê-đê-ôn ở thung lũng Giô-đanh. Đa số học giả thấy trong đó tên Ai Cập Tjeku, một tên chỉ phần đông của Wadi Tumilat, thung lũng hẹp chạy từ châu thổ đến hồ Timsah và là con đường tự nhiên ra khỏi Ê-díp-tô hướng về Sinai. Hai cuộn papyrus cuối thế kỷ 13 TCN biết rõ Tjeku: một cuộn tường thuật những người du mục Shasu từ Ê-đôm được cho qua pháo đài của nó đến các hồ Phi-thom để cho bầy gia súc uống nước, cuộn kia thuật việc truy đuổi hai nô lệ trốn chạy qua các bức tường của Tjeku."
    - "Su-cốt đứng ở đâu trong thung lũng thì còn tranh luận. Ứng viên thường được nêu là Tell el-Maskhuta gần đầu đông của nó, cách Ismailia khoảng 17 km về phía tây, nơi Édouard Naville khai quật năm 1883 và tìm thấy các kho chứa cùng tên Tjeku, dù ông cho di chỉ là Phi-thom. Các cuộc khai quật của John Holladay năm 1978–1985 cho thấy thị trấn ở đó được lập khoảng năm 600 TCN, khi Necho II đào kênh qua thung lũng, với một khu cư trú thời Hyksos trước đó và hầu như không có gì của Tân Vương quốc ở giữa; vì vậy nhiều người nay đặt Phi-thom tại Tell er-Retaba, xa hơn 13 km về phía tây, và coi Su-cốt là một vùng chứ không phải một gò, còn người khác cho rằng Su-cốt và Phi-thom là cùng một nơi. Bản đồ đánh dấu Tell el-Maskhuta, vùng lân cận Jabal Maryam bên hồ Timsah, Tell er-Retaba, và sự đồng nhất với Phi-thom."
    - "Ngày nay Wadi Tumilat nằm trong tỉnh Ismailia của Ai Cập, được tưới bởi kênh Ismailia thập niên 1860 chạy theo đường kênh cổ; đường sắt và đường bộ từ Zagazig đến Ismailia đi theo thung lũng, và các gò el-Maskhuta và er-Retaba nhô lên giữa đồng ruộng."
  ro:
    - "Sucot a fost primul popas al exodului: „s’au ridicat fiii lui Israil din Ramesi spre Sochot, ca șase sute de mii de bărbați pedeștri, afară de cele ce aveau”, iar din Sucot au mers mai departe la Etam, unde „au tăbărît în Otom lângă pustie”. Itinerarul din Numeri repetă cele două etape. Numele ebraic înseamnă colibe, iar locul nu este Sucotul lui Iacov și al lui Ghedeon din valea Iordanului. Cei mai mulți cercetători văd în el egipteanul Tjeku, un nume al Wadi Tumilat-ului estic, valea îngustă care merge de la Deltă la Lacul Timsah și era drumul firesc de ieșire din Egipt spre Sinai. Două papirusuri de la sfârșitul secolului al XIII-lea î.Hr. cunosc bine Tjeku: unul relatează că beduini shasu din Edom au fost lăsați să treacă prin fortăreața lui spre iazurile Pitomului ca să-și adape turmele, altul o urmărire a doi sclavi fugari pe lângă zidurile Tjeku."
    - "Unde se afla Sucot în vale este disputat. Candidatul obișnuit este Tell el-Maskhuta, spre capătul ei estic, la circa 17 km vest de Ismailia, unde Édouard Naville a săpat în 1883 și a găsit magazii și numele Tjeku, deși a socotit situl drept Pitom. Săpăturile lui John Holladay din 1978–1985 au arătat că orașul de acolo a fost întemeiat pe la 600 î.Hr., când Necao al II-lea a săpat canalul său prin vale, cu o așezare din vremea hicsoșilor înainte și aproape nimic din Regatul Nou între ele; de aceea mulți așază acum Pitomul la Tell er-Retaba, la 13 km mai spre vest, și lasă Sucotul să fie districtul, nu o singură movilă, în timp ce alții socotesc că Sucot și Pitom erau același loc. Harta marchează Tell el-Maskhuta, împrejurimile Jabal Maryam de lângă Lacul Timsah, Tell er-Retaba și identitatea cu Pitomul."
    - "Wadi Tumilat se află astăzi în guvernoratul Ismailia din Egipt, udat de Canalul Ismailia din anii 1860, care urmează traseul celui antic; calea ferată și drumul de la Zagazig la Ismailia îl urmează, iar movilele el-Maskhuta și er-Retaba se ridică printre câmpuri."
  bg:
    - "Сокхот бил първата стоянка на изхода: „дигнаха се Израилевите синове от Рамесий в Сокхот, около шестстотин тисящи мъже пешци освен челядите“, а от Сокхот те продължили към Етам, „към краищата на пустинята“. Маршрутът в Числа повтаря двата етапа. Еврейското име означава „колиби“ и мястото не е Сокхот на Яков и Гедеон в Йорданската долина. Повечето учени виждат в него египетското Чеку — име на източната част на Уади Тумилат, тясната долина, която води от Делтата до езерото Тимсах и била естественият път от Египет към Синай. Два папируса от края на XIII в. пр.н.е. познават добре Чеку: единият съобщава, че бедуини шасу от Едом били пропуснати през крепостта му до езерата на Питом, за да напоят стадата си, другият — за преследване на двама избягали роби покрай стените на Чеку."
    - "Къде в долината е бил Сокхот, е спорно. Обичайният кандидат е Тел ел-Масхута близо до източния ѝ край, на около 17 км западно от Исмаилия, където Едуар Навил копал през 1883 г. и открил складове и името Чеку, макар да смятал мястото за Питом. Разкопките на Джон Холадей през 1978–1985 г. показали, че градът там е основан около 600 г. пр.н.е., когато Нехо II прокопал канала си през долината, а преди това имало селище от времето на хиксосите и почти нищо от Новото царство помежду; затова мнозина днес поставят Питом при Тел ер-Ретаба, на 13 км по-на запад, и приемат Сокхот за областта, а не за една могила, докато други смятат, че Сокхот и Питом са едно и също място. Картата отбелязва Тел ел-Масхута, околностите на Джабал Мариам при езерото Тимсах, Тел ер-Ретаба и отъждествяването с Питом."
    - "Днес Уади Тумилат е в губернаторство Исмаилия в Египет и се напоява от канала Исмаилия от 1860-те години, прокаран по линията на древния; железопътната линия и пътят от Загазиг до Исмаилия вървят по него, а могилите ел-Масхута и ер-Ретаба се издигат сред полетата."
