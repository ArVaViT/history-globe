# Overview article (ADR 0007). Mainstream facts only; disputed datings are named as such.
# The place is the Old Testament Jericho at Tell es-Sultan; Herodian Jericho at Tulul Abu
# el-Alayiq is a separate place on the map (aaf03fa) and is only mentioned here.
id: jericho
place: a231f80
title:
  en: "Jericho"
  ru: "Иерихон"
  uk: "Єрихон"
  es: "Jericó"
  pt: "Jericó"
  de: "Jericho"
  fr: "Jéricho"
body:
  en:
    - "Jericho lies in the Jordan Valley about 250 m below sea level, north of the Dead Sea, beside a strong perennial spring, today Ein es-Sultan. The spring made it an oasis of palms, and people settled at the mound of Tell es-Sultan before 9000 BC; the Neolithic stone tower found there is among the oldest known buildings. Within the map's period the mound carried a walled town in the Early Bronze Age and a larger fortified city with a sloping rampart in the Middle Bronze Age."
    - "That Middle Bronze city was destroyed by fire in the sixteenth century BC. In the Bible, Joshua sends spies to Rahab, and the walls of Jericho fall before Israel. How the account relates to the ruins is disputed: John Garstang dated a fallen wall to about 1400 BC, Kathleen Kenyon showed it was far older and found little of a Late Bronze town, and the date of the conquest itself remains debated."
    - "The Bible says that Hiel of Bethel rebuilt Jericho in Ahab's days, and Elisha healed its spring. Excavation shows an Iron Age town that grew in the seventh century BC and was ruined in the Babylonian conquest early in the sixth; Zedekiah was overtaken in the plains of Jericho, and 345 men of Jericho are listed among those who returned from exile. After a small Persian-period settlement the mound was abandoned."
    - "Life moved south to the mouth of Wadi Qelt, now Tulul Abu el-Alayiq, where the Hasmoneans built winter palaces among balsam and date groves; there the young high priest Aristobulus III was drowned in 35 BC. Herod added palaces and died at Jericho in about 4 BC. This is the Jericho of the Gospels, where Jesus healed blind Bartimaeus and stayed with Zacchaeus. By the fourth century a Byzantine town stood further east, and in 333 the Pilgrim of Bordeaux was shown Elisha's spring and the house of Rahab."
  ru:
    - "Иерихон лежит в Иорданской долине, примерно в 250 м ниже уровня моря, к северу от Мёртвого моря, у сильного неиссякающего источника, ныне Эйн эс-Султан. Источник сделал это место пальмовым оазисом, и люди поселились на холме Телль-эс-Султан ещё до 9000 г. до н. э.; найденная там неолитическая каменная башня — одна из древнейших известных построек. В пределах эпохи карты на холме стоял обнесённый стеной город раннего бронзового века, а затем больший укреплённый город среднего бронзового века с наклонным валом."
    - "Этот город среднего бронзового века погиб в огне в XVI веке до н. э. По Библии, Иисус Навин посылает соглядатаев к Раав, и стены Иерихона падают перед Израилем. Как этот рассказ соотносится с развалинами, спорно: Джон Гарстанг датировал обрушенную стену примерно 1400 г. до н. э., Кэтлин Кеньон показала, что она гораздо древнее, и почти не нашла города позднего бронзового века, а дата самого завоевания по-прежнему обсуждается."
    - "Библия говорит, что во дни Ахава Иерихон отстроил Ахиил Вефилянин, а Елисей исцелил его источник. Раскопки показывают город железного века, который разросся в VII веке до н. э. и был разорён при вавилонском завоевании в начале VI века; на равнинах Иерихонских был настигнут Седекия, а среди вернувшихся из плена названы триста сорок пять уроженцев Иерихона. После небольшого поселения персидского времени холм опустел."
    - "Жизнь переместилась к югу, к выходу ущелья Вади Кельт, ныне Тулуль Абу эль-Алайик, где Хасмонеи построили зимние дворцы среди бальзамовых и финиковых рощ; там в 35 г. до н. э. утопили юного первосвященника Аристовула III. Ирод пристроил свои дворцы и около 4 г. до н. э. умер в Иерихоне. Это Иерихон Евангелий, где Иисус исцелил слепого Вартимея и остановился у Закхея. К IV веку восточнее стоял византийский город, и в 333 г. паломнику из Бордо показывали источник Елисея и дом Раав."
  uk:
    - "Єрихон лежить у Йорданській долині приблизно на 250 м нижче рівня моря, на північ від Мертвого моря, біля сильного постійного джерела, нині Айн-ес-Султан. Джерело зробило його оазою пальм, і люди оселилися на городищі Телль-ес-Султан ще до 9000 р. до н. е.; неолітична кам’яна вежа, знайдена там, — серед найдавніших відомих будівель. У межах доби карти городище несло обнесене муром місто раннього бронзового віку і більше укріплене місто з похилим валом середнього бронзового віку."
    - "Те місто середнього бронзового віку було знищене пожежею в XVI ст. до н. е. У Біблії Ісус Навин посилає розвідників до Рахав, і мури Єрихона падають перед Ізраїлем. Як ця оповідь стосується руїн, оспорюють: Джон Гарстанг датував повалений мур близько 1400 р. до н. е., Кетлін Кеньйон показала, що він набагато давніший, і майже не знайшла міста пізнього бронзового віку, а дата самого завоювання лишається дискусійною."
    - "Біблія каже, що Ахіїл із Бет-Ела відбудував Єрихон за днів Ахава, а Єлисей зцілив його джерело. Розкопки показують місто залізного віку, яке розрослося у VII ст. до н. е. і було зруйноване під час вавилонського завоювання на початку VI ст.; Седекію наздогнали на рівнинах Єрихона, а 345 мешканців Єрихона перелічені серед тих, хто повернувся з вигнання: «Що родом з Ерихону, триста сорок пять». Після невеликого поселення перської доби городище було покинуте."
    - "Життя перемістилося на південь, до гирла Ваді-Кельт, нині Туллюль-Абу-ель-Алайк, де хасмонеї збудували зимові палаци серед бальзамових і фінікових гаїв; там юного первосвященника Аристовула III втопили 35 р. до н. е. Ірод додав палаци й помер в Єрихоні близько 4 р. до н. е. Це Єрихон Євангелій, де Ісус зцілив сліпого Вартимея і гостював у Закхея. До IV ст. візантійське місто стояло далі на схід, і 333 року Бордоському прочанинові показали джерело Єлисея та дім Рахав."
  es:
    - "Jericó se halla en el valle del Jordán, a unos 250 m bajo el nivel del mar, al norte del mar Muerto, junto a un fuerte manantial perenne, hoy Ein es-Sultan. El manantial lo convirtió en un oasis de palmeras, y la gente se asentó en el montículo de Tell es-Sultan antes del 9000 a. C.; la torre de piedra neolítica hallada allí está entre los edificios más antiguos que se conocen. Dentro del período del mapa el montículo tuvo una ciudad amurallada en la Edad del Bronce Antiguo y una ciudad fortificada mayor, con un terraplén inclinado, en la Edad del Bronce Medio."
    - "Aquella ciudad del Bronce Medio fue destruida por el fuego en el siglo XVI a. C. En la Biblia, Josué envía espías a Rahab, y las murallas de Jericó caen ante Israel. Cómo se relaciona el relato con las ruinas es discutido: John Garstang fechó un muro caído hacia el 1400 a. C., Kathleen Kenyon mostró que era mucho más antiguo y halló poco de una ciudad del Bronce Final, y la propia fecha de la conquista sigue debatida."
    - "La Biblia dice que Hiel de Betel reedificó Jericó en los días de Acab, y que Eliseo sanó su manantial. La excavación muestra una población de la Edad del Hierro que creció en el siglo VII a. C. y fue arruinada en la conquista babilonia a comienzos del VI; Sedequías fue alcanzado en las llanuras de Jericó, y 345 hombres de Jericó figuran entre los que volvieron del destierro. Tras un pequeño asentamiento de época persa, el montículo fue abandonado."
    - "La vida se trasladó al sur, a la desembocadura del Wadi Qelt, hoy Tulul Abu el-Alayiq, donde los asmoneos construyeron palacios de invierno entre palmerales de bálsamo y dátiles; allí fue ahogado el joven sumo sacerdote Aristóbulo III en el 35 a. C. Herodes añadió palacios y murió en Jericó hacia el 4 a. C. Este es el Jericó de los Evangelios, donde Jesús sanó al ciego Bartimeo y se alojó con Zaqueo. En el siglo IV una población bizantina se alzaba más al este, y en el 333 al Peregrino de Burdeos le mostraron el manantial de Eliseo y la casa de Rahab."
  pt:
    - "Jericó fica no vale do Jordão, a cerca de 250 m abaixo do nível do mar, ao norte do mar Morto, junto a uma forte fonte perene, hoje Ein es-Sultan. A fonte fez dela um oásis de palmeiras, e as pessoas se estabeleceram no monte de Tell es-Sultan antes de 9000 a.C.; a torre neolítica de pedra ali achada está entre os mais antigos edifícios conhecidos. No período do mapa, o monte teve uma cidade murada na Idade do Bronze Antigo e uma cidade fortificada maior, com baluarte inclinado, no Bronze Médio."
    - "Essa cidade do Bronze Médio foi destruída pelo fogo no século XVI a.C. Na Bíblia, Josué envia espiões a Raabe, e as muralhas de Jericó caem diante de Israel. Como o relato se relaciona com as ruínas é disputado: John Garstang datou uma muralha caída de cerca de 1400 a.C., Kathleen Kenyon mostrou que era muito mais antiga e achou pouco de uma cidade do Bronze Tardio, e a própria data da conquista permanece debatida."
    - "A Bíblia diz que Hiel de Betel reconstruiu Jericó nos dias de Acabe, e Eliseu curou sua fonte. A escavação mostra uma cidade da Idade do Ferro que cresceu no século VII a.C. e foi arruinada na conquista babilônica no início do VI; Zedequias foi alcançado nas planícies de Jericó, e 345 homens de Jericó constam entre os que voltaram do exílio. Depois de um pequeno povoado do período persa, o monte foi abandonado."
    - "A vida se deslocou para o sul, para a foz do uádi Qelt, hoje Tulul Abu el-Alayiq, onde os asmoneus construíram palácios de inverno entre bálsamos e tamareiras; ali o jovem sumo sacerdote Aristóbulo III foi afogado em 35 a.C. Herodes acrescentou palácios e morreu em Jericó por volta de 4 a.C. Esta é a Jericó dos Evangelhos, onde Jesus curou o cego Bartimeu e se hospedou com Zaqueu. No século IV uma cidade bizantina ficava mais a leste, e em 333 o Peregrino de Bordeaux foi levado a ver a fonte de Eliseu e a casa de Raabe."
  de:
    - "Jericho liegt im Jordantal etwa 250 m unter dem Meeresspiegel, nördlich des Toten Meeres, bei einer starken, ganzjährig fließenden Quelle, heute Ein es-Sultan. Die Quelle machte es zu einer Palmenoase, und Menschen siedelten am Hügel Tell es-Sultan schon vor 9000 v. Chr.; der dort gefundene jungsteinzeitliche Steinturm gehört zu den ältesten bekannten Bauten. Im Zeitraum der Karte trug der Hügel in der Frühbronzezeit eine ummauerte Stadt und in der Mittelbronzezeit eine größere befestigte Stadt mit geböschtem Wall."
    - "Diese mittelbronzezeitliche Stadt wurde im 16. Jahrhundert v. Chr. durch Feuer zerstört. In der Bibel sendet Josua Kundschafter zu Rahab, und die Mauern Jerichos fallen vor Israel. Wie der Bericht zu den Ruinen steht, ist umstritten: John Garstang datierte eine gefallene Mauer auf etwa 1400 v. Chr., Kathleen Kenyon zeigte, dass sie weit älter war, und fand wenig von einer spätbronzezeitlichen Stadt, und das Datum der Landnahme selbst bleibt umstritten."
    - "Die Bibel sagt, Hiël aus Bethel habe Jericho in Ahabs Tagen wieder aufgebaut, und Elisa heilte seine Quelle. Die Grabung zeigt eine eisenzeitliche Stadt, die im 7. Jahrhundert v. Chr. wuchs und bei der babylonischen Eroberung zu Beginn des 6. zerstört wurde; Zedekia wurde in der Ebene von Jericho eingeholt, und 345 Männer von Jericho stehen unter den aus dem Exil Heimgekehrten. Nach einer kleinen Siedlung der Perserzeit wurde der Hügel aufgegeben."
    - "Das Leben zog nach Süden an die Mündung des Wadi Qelt, heute Tulul Abu el-Aleiq, wo die Hasmonäer Winterpaläste zwischen Balsam- und Dattelhainen bauten; dort wurde 35 v. Chr. der junge Hohepriester Aristobul III. ertränkt. Herodes fügte Paläste hinzu und starb um 4 v. Chr. in Jericho. Dies ist das Jericho der Evangelien, wo Jesus den blinden Bartimäus heilte und bei Zachäus einkehrte. Im 4. Jahrhundert stand weiter östlich eine byzantinische Stadt, und 333 wurden dem Pilger von Bordeaux Elisas Quelle und das Haus der Rahab gezeigt."
  fr:
    - "Jéricho se trouve dans la vallée du Jourdain, à environ 250 m sous le niveau de la mer, au nord de la mer Morte, près d’une forte source pérenne, aujourd’hui Ein es-Sultan. La source en fit une oasis de palmiers, et l’on s’installa sur le tertre de Tell es-Sultan avant 9000 av. J.-C. ; la tour de pierre néolithique qu’on y a trouvée compte parmi les plus anciens bâtiments connus. Dans la période de la carte, le tertre portait une ville fortifiée au Bronze ancien et une cité fortifiée plus grande, à rempart en pente, au Bronze moyen."
    - "Cette ville du Bronze moyen fut détruite par le feu au XVIe siècle av. J.-C. Dans la Bible, Josué envoie des espions chez Rahab, et les murailles de Jéricho tombent devant Israël. On discute de la manière dont le récit se rapporte aux ruines : John Garstang data un mur effondré d’environ 1400 av. J.-C., Kathleen Kenyon montra qu’il était bien plus ancien et trouva peu de chose d’une ville du Bronze récent, et la date de la conquête elle-même reste débattue."
    - "La Bible dit que Hiel de Béthel rebâtit Jéricho du temps d’Achab, et qu’Élisée assainit sa source. La fouille montre une ville de l’âge du Fer qui grandit au VIIe siècle av. J.-C. et fut ruinée lors de la conquête babylonienne au début du VIe ; Sédécias fut atteint dans les plaines de Jéricho, et 345 hommes de Jéricho figurent parmi ceux qui revinrent de l’exil. Après une petite implantation de l’époque perse, le tertre fut abandonné."
    - "La vie se déplaça vers le sud, à l’embouchure de l’oued Qelt, aujourd’hui Tulul Abu el-Alayiq, où les Hasmonéens bâtirent des palais d’hiver parmi les baumiers et les palmeraies ; là le jeune grand prêtre Aristobule III fut noyé en 35 av. J.-C. Hérode y ajouta des palais et mourut à Jéricho vers 4 av. J.-C. C’est le Jéricho des Évangiles, où Jésus guérit l’aveugle Bartimée et logea chez Zachée. Au IVe siècle, une ville byzantine se dressait plus à l’est, et en 333 on montra au Pèlerin de Bordeaux la source d’Élisée et la maison de Rahab."
