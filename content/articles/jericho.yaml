body:
  en:
    - "Jericho lies in the Jordan Valley about 250 m below sea level, north of the Dead Sea, beside a strong perennial spring, today Ein es-Sultan. The spring made it an oasis of palms, and people settled at the mound of Tell es-Sultan before 9000 BC; the Neolithic stone tower found there is among the oldest known buildings. Within the map's period the mound carried a walled town in the Early Bronze Age and a larger fortified city with a sloping rampart in the Middle Bronze Age."
    - "That Middle Bronze city was destroyed by fire in the sixteenth century BC. In the Bible, Joshua sends spies to Rahab, and the walls of Jericho fall before Israel. How the account relates to the ruins is disputed: John Garstang dated a fallen wall to about 1400 BC, Kathleen Kenyon showed it was far older and found little of a Late Bronze town, and the date of the conquest itself remains debated."
    - "The Bible says that Hiel of Bethel rebuilt Jericho in Ahab's days, and Elisha healed its spring. Excavation shows an Iron Age town that grew in the seventh century BC and was ruined in the Babylonian conquest early in the sixth; Zedekiah was overtaken in the plains of Jericho, and 345 men of Jericho are listed among those who returned from exile. After a small Persian-period settlement the mound was abandoned."
    - "Life moved south to the mouth of Wadi Qelt, now Tulul Abu el-Alayiq, where the Hasmoneans built winter palaces among balsam and date groves; there the young high priest Aristobulus III was drowned in 35 BC. Herod added palaces and died at Jericho in about 4 BC. This is the Jericho of the Gospels, where Jesus healed blind Bartimaeus and stayed with Zacchaeus. By the fourth century a Byzantine town stood further east, and in 333 the Pilgrim of Bordeaux was shown Elisha's spring and the house of Rahab."
  ru:
    - "Иерихон лежит в Иорданской долине, примерно в 250 м ниже уровня моря, к северу от Мёртвого моря, у сильного неиссякающего источника, ныне Эйн эс-Султан. Источник сделал это место пальмовым оазисом, и люди поселились на холме Телль-эс-Султан ещё до 9000 г. до н. э.; найденная там неолитическая каменная башня — одна из древнейших известных построек. В пределах эпохи карты на холме стоял обнесённый стеной город раннего бронзового века, а затем больший укреплённый город среднего бронзового века с наклонным валом."
    - "Этот город среднего бронзового века погиб в огне в XVI веке до н. э. По Библии, Иисус Навин посылает соглядатаев к Раав, и стены Иерихона падают перед Израилем. Как этот рассказ соотносится с развалинами, спорно: Джон Гарстанг датировал обрушенную стену примерно 1400 г. до н. э., Кэтлин Кеньон показала, что она гораздо древнее, и почти не нашла города позднего бронзового века, а дата самого завоевания по-прежнему обсуждается."
    - "Библия говорит, что во дни Ахава Иерихон отстроил Ахиил Вефилянин, а Елисей исцелил его источник. Раскопки показывают город железного века, который разросся в VII веке до н. э. и был разорён при вавилонском завоевании в начале VI века; на равнинах Иерихонских был настигнут Седекия, а среди вернувшихся из плена названы триста сорок пять уроженцев Иерихона. После небольшого поселения персидского времени холм опустел."
    - "Жизнь переместилась к югу, к выходу ущелья Вади Кельт, ныне Тулуль Абу эль-Алайик, где Хасмонеи построили зимние дворцы среди бальзамовых и финиковых рощ; там в 35 г. до н. э. утопили юного первосвященника Аристовула III. Ирод пристроил свои дворцы и около 4 г. до н. э. умер в Иерихоне. Это Иерихон Евангелий, где Иисус исцелил слепого Вартимея и остановился у Закхея. К IV веку восточнее стоял византийский город, и в 333 г. паломнику из Бордо показывали источник Елисея и дом Раав."
  uk:
    - "Єрихон лежить у Йорданській долині приблизно на 250 м нижче рівня моря, на північ від Мертвого моря, біля сильного постійного джерела, нині Айн-ес-Султан. Джерело зробило його оазою пальм, і люди оселилися на городищі Телль-ес-Султан ще до 9000 р. до н. е.; неолітична кам’яна вежа, знайдена там, — серед найдавніших відомих будівель. У межах доби карти городище несло обнесене муром місто раннього бронзового віку і більше укріплене місто з похилим валом середнього бронзового віку."
    - "Те місто середнього бронзового віку було знищене пожежею в XVI ст. до н. е. У Біблії Ісус Навин посилає розвідників до Рахав, і мури Єрихона падають перед Ізраїлем. Як ця оповідь стосується руїн, оспорюють: Джон Гарстанг датував повалений мур близько 1400 р. до н. е., Кетлін Кеньйон показала, що він набагато давніший, і майже не знайшла міста пізнього бронзового віку, а дата самого завоювання лишається дискусійною."
    - "Біблія каже, що Ахіїл із Бет-Ела відбудував Єрихон за днів Ахава, а Єлисей зцілив його джерело. Розкопки показують місто залізного віку, яке розрослося у VII ст. до н. е. і було зруйноване під час вавилонського завоювання на початку VI ст.; Седекію наздогнали на рівнинах Єрихона, а 345 мешканців Єрихона перелічені серед тих, хто повернувся з вигнання: «Що родом з Ерихону, триста сорок пять». Після невеликого поселення перської доби городище було покинуте."
    - "Життя перемістилося на південь, до гирла Ваді-Кельт, нині Туллюль-Абу-ель-Алайк, де хасмонеї збудували зимові палаци серед бальзамових і фінікових гаїв; там юного первосвященника Аристовула III втопили 35 р. до н. е. Ірод додав палаци й помер в Єрихоні близько 4 р. до н. е. Це Єрихон Євангелій, де Ісус зцілив сліпого Вартимея і гостював у Закхея. До IV ст. візантійське місто стояло далі на схід, і 333 року Бордоському прочанинові показали джерело Єлисея та дім Рахав."
  es:
    - "Jericó se halla en el valle del Jordán, a unos 250 m bajo el nivel del mar, al norte del mar Muerto, junto a un fuerte manantial perenne, hoy Ein es-Sultan. El manantial lo convirtió en un oasis de palmeras, y la gente se asentó en el montículo de Tell es-Sultan antes del 9000 a. C.; la torre de piedra neolítica hallada allí está entre los edificios más antiguos que se conocen. Dentro del período del mapa el montículo tuvo una ciudad amurallada en la Edad del Bronce Antiguo y una ciudad fortificada mayor, con un terraplén inclinado, en la Edad del Bronce Medio."
    - "Aquella ciudad del Bronce Medio fue destruida por el fuego en el siglo XVI a. C. En la Biblia, Josué envía espías a Rahab, y las murallas de Jericó caen ante Israel. Cómo se relaciona el relato con las ruinas es discutido: John Garstang fechó un muro caído hacia el 1400 a. C., Kathleen Kenyon mostró que era mucho más antiguo y halló poco de una ciudad del Bronce Final, y la propia fecha de la conquista sigue debatida."
    - "La Biblia dice que Hiel de Betel reedificó Jericó en los días de Acab, y que Eliseo sanó su manantial. La excavación muestra una población de la Edad del Hierro que creció en el siglo VII a. C. y fue arruinada en la conquista babilonia a comienzos del VI; Sedequías fue alcanzado en las llanuras de Jericó, y 345 hombres de Jericó figuran entre los que volvieron del destierro. Tras un pequeño asentamiento de época persa, el montículo fue abandonado."
    - "La vida se trasladó al sur, a la desembocadura del Wadi Qelt, hoy Tulul Abu el-Alayiq, donde los asmoneos construyeron palacios de invierno entre palmerales de bálsamo y dátiles; allí fue ahogado el joven sumo sacerdote Aristóbulo III en el 35 a. C. Herodes añadió palacios y murió en Jericó hacia el 4 a. C. Este es el Jericó de los Evangelios, donde Jesús sanó al ciego Bartimeo y se alojó con Zaqueo. En el siglo IV una población bizantina se alzaba más al este, y en el 333 al Peregrino de Burdeos le mostraron el manantial de Eliseo y la casa de Rahab."
  pt:
    - "Jericó fica no vale do Jordão, a cerca de 250 m abaixo do nível do mar, ao norte do mar Morto, junto a uma forte fonte perene, hoje Ein es-Sultan. A fonte fez dela um oásis de palmeiras, e as pessoas se estabeleceram no monte de Tell es-Sultan antes de 9000 a.C.; a torre neolítica de pedra ali achada está entre os mais antigos edifícios conhecidos. No período do mapa, o monte teve uma cidade murada na Idade do Bronze Antigo e uma cidade fortificada maior, com baluarte inclinado, no Bronze Médio."
    - "Essa cidade do Bronze Médio foi destruída pelo fogo no século XVI a.C. Na Bíblia, Josué envia espiões a Raabe, e as muralhas de Jericó caem diante de Israel. Como o relato se relaciona com as ruínas é disputado: John Garstang datou uma muralha caída de cerca de 1400 a.C., Kathleen Kenyon mostrou que era muito mais antiga e achou pouco de uma cidade do Bronze Tardio, e a própria data da conquista permanece debatida."
    - "A Bíblia diz que Hiel de Betel reconstruiu Jericó nos dias de Acabe, e Eliseu curou sua fonte. A escavação mostra uma cidade da Idade do Ferro que cresceu no século VII a.C. e foi arruinada na conquista babilônica no início do VI; Zedequias foi alcançado nas planícies de Jericó, e 345 homens de Jericó constam entre os que voltaram do exílio. Depois de um pequeno povoado do período persa, o monte foi abandonado."
    - "A vida se deslocou para o sul, para a foz do uádi Qelt, hoje Tulul Abu el-Alayiq, onde os asmoneus construíram palácios de inverno entre bálsamos e tamareiras; ali o jovem sumo sacerdote Aristóbulo III foi afogado em 35 a.C. Herodes acrescentou palácios e morreu em Jericó por volta de 4 a.C. Esta é a Jericó dos Evangelhos, onde Jesus curou o cego Bartimeu e se hospedou com Zaqueu. No século IV uma cidade bizantina ficava mais a leste, e em 333 o Peregrino de Bordeaux foi levado a ver a fonte de Eliseu e a casa de Raabe."
  de:
    - "Jericho liegt im Jordantal etwa 250 m unter dem Meeresspiegel, nördlich des Toten Meeres, bei einer starken, ganzjährig fließenden Quelle, heute Ein es-Sultan. Die Quelle machte es zu einer Palmenoase, und Menschen siedelten am Hügel Tell es-Sultan schon vor 9000 v. Chr.; der dort gefundene jungsteinzeitliche Steinturm gehört zu den ältesten bekannten Bauten. Im Zeitraum der Karte trug der Hügel in der Frühbronzezeit eine ummauerte Stadt und in der Mittelbronzezeit eine größere befestigte Stadt mit geböschtem Wall."
    - "Diese mittelbronzezeitliche Stadt wurde im 16. Jahrhundert v. Chr. durch Feuer zerstört. In der Bibel sendet Josua Kundschafter zu Rahab, und die Mauern Jerichos fallen vor Israel. Wie der Bericht zu den Ruinen steht, ist umstritten: John Garstang datierte eine gefallene Mauer auf etwa 1400 v. Chr., Kathleen Kenyon zeigte, dass sie weit älter war, und fand wenig von einer spätbronzezeitlichen Stadt, und das Datum der Landnahme selbst bleibt umstritten."
    - "Die Bibel sagt, Hiël aus Bethel habe Jericho in Ahabs Tagen wieder aufgebaut, und Elisa heilte seine Quelle. Die Grabung zeigt eine eisenzeitliche Stadt, die im 7. Jahrhundert v. Chr. wuchs und bei der babylonischen Eroberung zu Beginn des 6. zerstört wurde; Zedekia wurde in der Ebene von Jericho eingeholt, und 345 Männer von Jericho stehen unter den aus dem Exil Heimgekehrten. Nach einer kleinen Siedlung der Perserzeit wurde der Hügel aufgegeben."
    - "Das Leben zog nach Süden an die Mündung des Wadi Qelt, heute Tulul Abu el-Aleiq, wo die Hasmonäer Winterpaläste zwischen Balsam- und Dattelhainen bauten; dort wurde 35 v. Chr. der junge Hohepriester Aristobul III. ertränkt. Herodes fügte Paläste hinzu und starb um 4 v. Chr. in Jericho. Dies ist das Jericho der Evangelien, wo Jesus den blinden Bartimäus heilte und bei Zachäus einkehrte. Im 4. Jahrhundert stand weiter östlich eine byzantinische Stadt, und 333 wurden dem Pilger von Bordeaux Elisas Quelle und das Haus der Rahab gezeigt."
  fr:
    - "Jéricho se trouve dans la vallée du Jourdain, à environ 250 m sous le niveau de la mer, au nord de la mer Morte, près d’une forte source pérenne, aujourd’hui Ein es-Sultan. La source en fit une oasis de palmiers, et l’on s’installa sur le tertre de Tell es-Sultan avant 9000 av. J.-C. ; la tour de pierre néolithique qu’on y a trouvée compte parmi les plus anciens bâtiments connus. Dans la période de la carte, le tertre portait une ville fortifiée au Bronze ancien et une cité fortifiée plus grande, à rempart en pente, au Bronze moyen."
    - "Cette ville du Bronze moyen fut détruite par le feu au XVIe siècle av. J.-C. Dans la Bible, Josué envoie des espions chez Rahab, et les murailles de Jéricho tombent devant Israël. On discute de la manière dont le récit se rapporte aux ruines : John Garstang data un mur effondré d’environ 1400 av. J.-C., Kathleen Kenyon montra qu’il était bien plus ancien et trouva peu de chose d’une ville du Bronze récent, et la date de la conquête elle-même reste débattue."
    - "La Bible dit que Hiel de Béthel rebâtit Jéricho du temps d’Achab, et qu’Élisée assainit sa source. La fouille montre une ville de l’âge du Fer qui grandit au VIIe siècle av. J.-C. et fut ruinée lors de la conquête babylonienne au début du VIe ; Sédécias fut atteint dans les plaines de Jéricho, et 345 hommes de Jéricho figurent parmi ceux qui revinrent de l’exil. Après une petite implantation de l’époque perse, le tertre fut abandonné."
    - "La vie se déplaça vers le sud, à l’embouchure de l’oued Qelt, aujourd’hui Tulul Abu el-Alayiq, où les Hasmonéens bâtirent des palais d’hiver parmi les baumiers et les palmeraies ; là le jeune grand prêtre Aristobule III fut noyé en 35 av. J.-C. Hérode y ajouta des palais et mourut à Jéricho vers 4 av. J.-C. C’est le Jéricho des Évangiles, où Jésus guérit l’aveugle Bartimée et logea chez Zachée. Au IVe siècle, une ville byzantine se dressait plus à l’est, et en 333 on montra au Pèlerin de Bordeaux la source d’Élisée et la maison de Rahab."
  pl:
    - "Jerycho leży w Dolinie Jordanu około 250 m poniżej poziomu morza, na północ od Morza Martwego, przy silnym stałym źródle, dziś Ajn es-Sultan. Źródło uczyniło z niego oazę palm, a ludzie osiedlili się na pagórku Tell es-Sultan przed 9000 r. p.n.e.; neolityczna kamienna wieża tam znaleziona należy do najstarszych znanych budowli. W okresie objętym mapą pagórek nosił miasto obwarowane murami we wczesnej epoce brązu i większe miasto z pochyłym wałem w środkowej epoce brązu."
    - "To miasto ze środkowej epoki brązu zostało zniszczone pożarem w XVI w. p.n.e. W Biblii Jozue wysyła zwiadowców do Rachab, a mury Jerycha padają przed Izraelem. Jak opis ma się do ruin, jest sporne: John Garstang datował zwalony mur na około 1400 r. p.n.e., Kathleen Kenyon wykazała, że jest znacznie starszy, i znalazła niewiele z miasta późnej epoki brązu, a data samego podboju pozostaje dyskutowana."
    - "Biblia mówi, że Chiel z Betel odbudował Jerycho za dni Achaba, a Elizeusz uzdrowił jego źródło. Wykopaliska pokazują miasto z epoki żelaza, które rozwinęło się w VII w. p.n.e. i zostało zniszczone w babilońskim podboju na początku VI w.; Sedekiasz został dogoniony na równinach Jerycha, a 345 mężów z Jerycha wymieniono wśród powracających z wygnania. Po niewielkiej osadzie z okresu perskiego pagórek opuszczono."
    - "Życie przeniosło się na południe, do ujścia Wadi Kelt, dziś Tulul Abu el-Alajik, gdzie Hasmoneusze zbudowali zimowe pałace wśród gajów balsamu i daktyli; tam w 35 r. p.n.e. utopiono młodego arcykapłana Arystobula III. Herod dobudował pałace i zmarł w Jerychu około 4 r. p.n.e. To Jerycho z Ewangelii, gdzie Jezus uzdrowił ślepego Bartymeusza i zatrzymał się u Zacheusza. W IV w. bizantyńskie miasto stało dalej na wschód, a w 333 r. Pielgrzymowi z Bordeaux pokazano źródło Elizeusza i dom Rachab."
  it:
    - "Gerico si trova nella valle del Giordano circa 250 m sotto il livello del mare, a nord del Mar Morto, accanto a una forte sorgente perenne, oggi Ein es-Sultan. La sorgente ne fece un’oasi di palme, e si fissò dimora sul tell di Tell es-Sultan prima del 9000 a.C.; la torre di pietra neolitica trovata là è fra i più antichi edifici noti. Nel periodo della mappa il tell portava una città murata nel Bronzo Antico e una città fortificata più grande con un bastione inclinato nel Bronzo Medio."
    - "Quella città del Bronzo Medio fu distrutta da un incendio nel XVI secolo a.C. Nella Bibbia, Giosuè manda spie a Raab, e le mura di Gerico crollano davanti a Israele. Come il racconto si rapporti alle rovine è discusso: John Garstang datò un muro crollato al 1400 a.C. circa, Kathleen Kenyon mostrò che era molto più antico e trovò poco di una città del Bronzo Tardo, e la data della conquista stessa resta discussa."
    - "La Bibbia dice che Chiel di Betel ricostruì Gerico ai giorni di Acab, ed Eliseo guarì la sua sorgente. Lo scavo mostra una città dell’età del Ferro che crebbe nel VII secolo a.C. e fu rovinata dalla conquista babilonese all’inizio del VI; Sedecia fu raggiunto nelle pianure di Gerico, e 345 uomini di Gerico sono elencati fra quelli che tornarono dall’esilio. Dopo un piccolo insediamento di epoca persiana il tell fu abbandonato."
    - "La vita si spostò a sud, alla foce del Wadi Qelt, oggi Tulul Abu el-Alayiq, dove gli Asmonei costruirono palazzi invernali fra palmeti di balsamo e datteri; là il giovane sommo sacerdote Aristobulo III fu annegato nel 35 a.C. Erode vi aggiunse palazzi e morì a Gerico verso il 4 a.C. Questa è la Gerico dei Vangeli, dove Gesù guarì il cieco Bartimeo e fu ospite di Zaccheo. Nel IV secolo una città bizantina sorgeva più a est, e nel 333 il Pellegrino di Bordeaux vi vide mostrare la sorgente di Eliseo e la casa di Raab."
  nl:
    - "Jericho ligt in het Jordaandal ongeveer 250 m onder zeeniveau, ten noorden van de Dode Zee, naast een sterke bron met water het hele jaar, nu Ein es-Sultan. De bron maakte er een oase van palmen van, en mensen vestigden zich vóór 9000 v.Chr. op de heuvel Tell es-Sultan; de neolithische stenen toren die daar is gevonden, behoort tot de oudste bekende gebouwen. Binnen de periode van de kaart droeg de heuvel een ommuurde stad in de Vroege Bronstijd en een grotere versterkte stad met een hellende wal in de Midden-Bronstijd."
    - "Die stad uit de Midden-Bronstijd werd in de 16e eeuw v.Chr. door brand verwoest. In de Bijbel stuurt Jozua verspieders naar Rachab, en vallen de muren van Jericho voor Israël. Hoe het verslag zich verhoudt tot de ruïnes, is omstreden: John Garstang dateerde een omgevallen muur omstreeks 1400 v.Chr., Kathleen Kenyon toonde aan dat hij veel ouder was en vond weinig van een stad uit de Late Bronstijd, en de datum van de verovering zelf blijft besproken."
    - "De Bijbel zegt dat Chiël van Bethel Jericho herbouwde in de dagen van Achab, en dat Elisa zijn bron genas. Opgraving toont een stad uit de IJzertijd die in de 7e eeuw v.Chr. groeide en bij de Babylonische verovering vroeg in de 6e eeuw werd verwoest; Zedekia werd in de vlakten van Jericho achterhaald, en 345 mannen van Jericho staan vermeld onder hen die uit de ballingschap terugkeerden. Na een kleine nederzetting uit de Perzische tijd werd de heuvel verlaten."
    - "Het leven verhuisde naar het zuiden, naar de monding van de Wadi Qelt, nu Tulul Abu el-Alayiq, waar de Hasmoneeën winterpaleizen bouwden tussen balsem- en dadelgaarden; daar werd de jonge hogepriester Aristobulus III in 35 v.Chr. verdronken. Herodes voegde paleizen toe en stierf omstreeks 4 v.Chr. te Jericho. Dit is het Jericho van de evangeliën, waar Jezus de blinde Bartimeüs genas en bij Zacheüs verbleef. In de 4e eeuw stond een Byzantijnse stad verder oostelijk, en in 333 kreeg de Pelgrim van Bordeaux Elisa’s bron en het huis van Rachab te zien."
  cs:
    - "Jericho leží v Jordánském údolí asi 250 m pod hladinou moře, severně od Mrtvého moře, u silného stálého pramene, dnes Ajn es-Sultán. Pramen z něj učinil palmovou oázu a lidé se usadili na pahorku Tell es-Sultán před rokem 9000 př. n. l.; neolitická kamenná věž tam nalezená patří k nejstarším známým stavbám. V období mapy nesl pahorek opevněné město v rané době bronzové a větší opevněné město se šikmým valem ve střední době bronzové."
    - "Toto město střední doby bronzové bylo zničeno ohněm v 16. stol. př. n. l. V Bibli Jozue posílá zvědy k Rachab a hradby Jericha padají před Izraelem. Jak vyprávění souvisí se zříceninami, je sporné: John Garstang datoval padlou hradbu kolem roku 1400 př. n. l., Kathleen Kenyon ukázala, že je mnohem starší, a nalezla málo z města pozdní doby bronzové, a datum samotného dobytí zůstává sporné."
    - "Bible praví, že Chiel z Bét-elu vystavěl Jericho znovu za dnů Achabových a Elíša uzdravil jeho pramen. Vykopávky ukazují město doby železné, které vyrostlo v 7. stol. př. n. l. a bylo zničeno babylonským dobytím na počátku 6. století; Sidkijáš byl dostižen na jerišských pláních a 345 mužů z Jericha je uvedeno mezi těmi, kdo se vrátili z exilu. Po malém sídlišti perského období byl pahorek opuštěn."
    - "Život se přesunul na jih k ústí Wádí Kelt, nyní Tulul Abu el-Alayiq, kde Hasmonejští postavili zimní paláce mezi balzámovými a datlovými háji; tam byl roku 35 př. n. l. utopen mladý velekněz Aristobúlos III. Herodes přidal paláce a zemřel v Jerichu asi roku 4 př. n. l. To je Jericho evangelií, kde Ježíš uzdravil slepého Bartimaia a zůstal u Zachea. Ve 4. století stálo byzantské město dále na východ a roku 333 byly Poutníku z Bordeaux ukázány Elíšův pramen a dům Rachab."
  sv:
    - "Jeriko ligger i Jordandalen omkring 250 m under havsytan, norr om Döda havet, vid en stark ständig källa, i dag Ein es-Sultan. Källan gjorde det till en palmoas, och människor bosatte sig på kullen Tell es-Sultan före 9000 f.Kr.; det neolitiska stentornet som hittats där hör till de äldsta kända byggnaderna. Inom kartans tidsram bar kullen en ommurad stad under tidig bronsålder och en större befäst stad med en sluttande vall under mellanbronsåldern."
    - "Den mellanbronsåldriga staden förstördes av eld på 1500-talet f.Kr. I Bibeln sänder Josua spejare till Rachav, och Jerikos murar faller för Israel. Hur berättelsen förhåller sig till ruinerna är omstritt: John Garstang daterade en fallen mur till omkring 1400 f.Kr., Kathleen Kenyon visade att den var långt äldre och fann föga av en stad från senbronsåldern, och själva erövringens datering är fortfarande omdebatterad."
    - "Bibeln säger att Hiel från Betel byggde upp Jeriko på Achavs tid, och Elisha botade dess källa. Utgrävningarna visar en järnåldersstad som växte på 600-talet f.Kr. och ödelades vid den babyloniska erövringen tidigt på 500-talet; Sidkia hann ifatt på Jerikos slätter, och 345 män från Jeriko upptas bland dem som återvände från exilen. Efter en liten bosättning under persisk tid övergavs kullen."
    - "Livet flyttade söderut till mynningen av Wadi Qelt, nu Tulul Abu el-Alayiq, där hasmoneerna byggde vinterpalats bland balsam- och dadellundar; där drunknade den unge översteprästen Aristobulos III år 35 f.Kr. Herodes lade till palats och dog i Jeriko omkring 4 f.Kr. Det är evangeliernas Jeriko, där Jesus botade den blinde Bartimeus och stannade hos Sackeus. På 300-talet stod en bysantinsk stad längre österut, och år 333 visades Pilgrimen från Bordeaux Elishas källa och Rachavs hus."
  nb:
    - "Jeriko ligger i Jordandalen omtrent 250 m under havet, nord for Dødehavet, ved en sterk, varig kilde, i dag Ein es-Sultan. Kilden gjorde det til en palmeoase, og folk bosatte seg ved haugen Tell es-Sultan før 9000 f.Kr.; tårnet av stein fra yngre steinalder som er funnet der, er blant de eldste kjente bygningene. Innenfor kartets periode bar haugen en befestet by i tidlig bronsealder og en større befestet by med skrånende voll i mellombronsealder."
    - "Byen fra mellombronsealder ble ødelagt av brann på 1500-tallet f.Kr. I Bibelen sender Josva speidere til Rahab, og murene i Jeriko faller for Israel. Hvordan beretningen forholder seg til ruinene, er omstridt: John Garstang daterte en falt mur til omkring 1400 f.Kr., Kathleen Kenyon viste at den var langt eldre og fant lite av en by fra sen bronsealder, og dateringen av selve erobringen er fortsatt omdiskutert."
    - "Bibelen sier at Hiel fra Betel gjenoppbygde Jeriko i Akabs dager, og Elisja helbredet dens kilde. Utgravning viser en jernalderby som vokste på 600-tallet f.Kr. og ble ødelagt i den babylonske erobringen tidlig på 500-tallet; Sidkia ble innhentet på Jerikos sletter, og 345 menn fra Jeriko står oppført blant dem som vendte tilbake fra eksilet. Etter en liten bosetning fra persisk tid ble haugen forlatt."
    - "Livet flyttet sørover til munningen av Wadi Qelt, nå Tulul Abu el-Alayiq, der hasmoneerne bygde vinterpalasser blant balsam- og daddellunder; der ble den unge øverstepresten Aristobulos 3. druknet i 35 f.Kr. Herodes la til palasser og døde i Jeriko omkring 4 f.Kr. Dette er evangeliets Jeriko, der Jesus helbredet den blinde Bartimeus og bodde hos Sakkeus. På 300-tallet sto en bysantinsk by lenger øst, og i 333 ble Pilegrimen fra Bordeaux vist Elisjas kilde og Rahabs hus."
  tl:
    - "Ang Jerico ay nasa Libis ng Jordan mga 250 m sa ibaba ng antas ng dagat, sa hilaga ng Dagat na Patay, sa tabi ng malakas na pangmatagalang bukal, ngayon ay Ein es-Sultan. Ginawa itong oasis ng mga palma ng bukal na iyon, at nanirahan ang mga tao sa burol ng Tell es-Sultan bago ang 9000 BK; ang tore ng batong Neolitiko na natagpuan doon ay kabilang sa pinakamatandang kilalang gusali. Sa loob ng panahon ng mapa, ang burol ay may bayang may pader sa Maagang Panahon ng Tanso at mas malaking nakukutaang lungsod na may dalisdis na pampang sa Gitnang Panahon ng Tanso."
    - "Ang lungsod ng Gitnang Panahon ng Tanso ay winasak ng apoy noong ika-16 na siglo BK. Sa Biblia, nagsusugo si Josue ng mga tiktik kay Rahab, at bumabagsak ang mga pader ng Jerico sa harap ng Israel. Pinagtatalunan kung paano nauugnay ang salaysay sa mga guho: pinetsahan ni John Garstang ang isang bumagsak na pader sa mga 1400 BK, ipinakita ni Kathleen Kenyon na mas matanda ito nang malayo at kakaunti ang natagpuan niyang bayan ng Huling Panahon ng Tanso, at pinagtatalunan pa rin ang petsa ng mismong pananakop."
    - "Sinasabi ng Biblia na itinayong muli ni Hiel na taga-Beth-el ang Jerico sa mga araw ni Achab, at pinagaling ni Eliseo ang bukal nito. Ipinakikita ng paghuhukay ang bayan ng Panahon ng Bakal na lumago noong ika-7 siglo BK at nawasak sa pananakop ng Babilonia sa simula ng ika-6; naabutan si Sedecias sa mga kapatagan ng Jerico, at 345 lalaki ng Jerico ang nakatala sa mga bumalik mula sa pagkatapon. Pagkatapos ng maliit na paninirahan ng panahong Persiano ay iniwan ang burol."
    - "Lumipat ang buhay sa timog sa bukana ng Wadi Qelt, ngayon ay Tulul Abu el-Alayiq, kung saan nagtayo ang mga Hasmoneo ng mga palasyo sa taglamig sa gitna ng mga halamanan ng balsamo at datiles; doon nilunod ang batang dakilang saserdoteng si Aristobulo III noong 35 BK. Nagdagdag si Herodes ng mga palasyo at namatay sa Jerico noong mga 4 BK. Ito ang Jerico ng mga Ebanghelyo, kung saan pinagaling ni Jesus ang bulag na si Bartimeo at tumuloy kay Zaqueo. Pagsapit ng ika-4 na siglo, may bayang Bisantino nang nakatayo nang mas silangan, at noong 333 ay ipinakita sa Manlalakbay ng Bordeaux ang bukal ni Eliseo at ang bahay ni Rahab."
  da:
    - "Jeriko ligger i Jordandalen omkring 250 m under havets overflade, nord for Det Døde Hav, ved en stærk kilde, der løber hele året, i dag Ein es-Sultan. Kilden gjorde den til en palmeoase, og mennesker bosatte sig ved højen Tell es-Sultan før 9000 f.Kr.; det neolitiske stentårn fundet der er blandt de ældste kendte bygninger. I kortets periode bar højen en befæstet by i den tidlige bronzealder og en større befæstet by med en skrånende vold i mellembronzealderen."
    - "Den mellembronzealderlige by blev ødelagt ved brand i 1500-tallet f.Kr. I Bibelen sender Josva spejdere til Rahab, og Jerikos mure falder for Israel. Hvordan beretningen forholder sig til ruinerne, er omstridt: John Garstang daterede en faldet mur til omkring 1400 f.Kr., Kathleen Kenyon viste, at den var langt ældre, og fandt kun lidt af en by fra sen bronzealder, og erobringens datering er selv fortsat omdiskuteret."
    - "Bibelen siger, at Hiel fra Betel genopbyggede Jeriko i Akabs dage, og at Elisa helbredte dens kilde. Udgravningen viser en jernalderby, der voksede i 600-tallet f.Kr. og blev ødelagt ved den babylonske erobring tidligt i 500-tallet; Zedekias blev indhentet på Jerikos sletter, og 345 mænd fra Jeriko står blandt dem, der vendte tilbage fra eksilet. Efter en lille bebyggelse i den persiske periode blev højen forladt."
    - "Livet flyttede sydpå til mundingen af Wadi Qelt, nu Tulul Abu el-Alayiq, hvor hasmonæerne byggede vinterpaladser blandt balsam- og daddellunde; dér druknede den unge ypperstepræst Aristobul III i 35 f.Kr. Herodes tilføjede paladser og døde i Jeriko omkring 4 f.Kr. Dette er evangeliernes Jeriko, hvor Jesus helbredte den blinde Bartimæus og blev hos Zakæus. I 300-tallet stod en byzantinsk by længere mod øst, og i 333 blev Pilgrimmen fra Bordeaux vist Elisas kilde og Rahabs hus."
  sr:
    - "Јерихон лежи у долини Јордана око 250 м испод нивоа мора, северно од Мртвог мора, поред јаког сталног извора, данас Ајн ес-Султан. Извор га је учинио оазом палми, а људи су се населили на хумци Тел ес-Султан пре 9000. п. н. е.; неолитска камена кула нађена ту међу најстаријим је познатим зградама. У раздобљу карте хумка је носила зидани град у раном бронзаном добу и већи утврђени град са косим бедемом у средњем бронзаном добу."
    - "Тај град средњег бронзаног доба уништен је ватром у 16. веку п. н. е. У Библији Исус шаље уходе Рави, а зидови Јерихона падају пред Израиљем. Како се извештај односи на рушевине, спорно је: Џон Гарстанг датовао је срушен зид у око 1400. п. н. е., Кетлин Кенјон показала је да је много старији и нашла мало града касног бронзаног доба, а датум самог освајања остаје спорен."
    - "Библија каже да је Хил из Ветиља обновио Јерихон у Ахавове дане, а Јелисије је исцелио његов извор. Ископавања показују град гвозденог доба који је порастао у седмом веку п. н. е. и био разорен у вавилонском освајању почетком шестог; Седекија је стигнут на равницама Јерихона, а 345 људи из Јерихона наведено је међу онима који су се вратили из изгнанства. После малог насеља персијског доба хумка је напуштена."
    - "Живот се преселио на југ на ушће Вади Келта, данас Тулул Абу ел-Алајик, где су Хасмонејци саградили зимске палате међу гајевима балзама и датуља; тамо је млади првосвештеник Аристовул III био удављен 35. п. н. е. Ирод је додао палате и умро у Јерихону око 4. п. н. е. То је Јерихон из јеванђеља, где је Исус исцелио слепог Вартимеја и боравио код Закхеја. До четвртог века византијски град стајао је даље на истоку, а 333. Путнику из Бордоа показани су Јелисијев извор и Равина кућа."
