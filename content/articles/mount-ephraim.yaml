# Overview article (ADR 0007). Mainstream facts only; the record holds the three mentions in Jeremiah, and the article treats the hill country as a whole; the settlement surveys are reported, not interpreted.
id: mount-ephraim
place: ac0d1a5
title:
  en: "Mount Ephraim"
  ru: "Гора Ефремова"
  uk: "Гора Єфремова"
  es: "Monte de Efraín"
  pt: "Monte Efraim"
  de: "Gebirge Ephraim"
  fr: "Montagne d’Éphraïm"
  it: "Monte Efraim"
  pl: "Góry Efraima"
  nl: "Bergland van Efraïm"
  cs: "Efrajimské pohoří"
  sv: "Efraims bergsbygd"
  nb: "Efraim-fjellet"
body:
  en:
    - "Mount Ephraim, in modern versions the hill country of Ephraim, is not a single peak but the central range of the land between Bethel in the south and the plain of Jezreel in the north: limestone hills of 600 to 1,000 metres, once partly forested, with Shechem in its pass, Shiloh in its heart and Timnath-serah, Joshua's own town and grave, “which is in mount Ephraim”. The name belongs to the territory of the house of Joseph, and the Bible stretches it over the hills of Manasseh and down to Ramah and Bethel, where Deborah sat under her palm “in mount Ephraim”. Here lived Micah with his idol, and Elkanah of Ramathaim-zophim, Samuel's father; when the house of Joseph complained that the hills were too narrow for them, Joshua told them to clear the forest; and Jeroboam “built Shechem in mount Ephraim, and dwelt therein”, the first seat of the northern kingdom."
    - "Jeremiah names the hills three times. In the alarm of invasion from the north, “a voice declareth from Dan, and publisheth affliction from mount Ephraim”, the news running south toward Jerusalem. In the book of consolation he promises that the watchmen of the north will one day call the people to the Temple of the south: “there shall be a day, that the watchmen upon the mount Ephraim shall cry, Arise ye, and let us go up to Zion unto the LORD our God”, a reunion of the two kingdoms. And in the oracle against Babylon Israel is brought home to its pasture, “and his soul shall be satisfied upon mount Ephraim and Gilead”."
    - "Archaeological surveys of the hill country, led by Israel Finkelstein for southern Samaria and Adam Zertal for Manasseh, recorded hundreds of small villages founded in the twelfth and eleventh centuries BC on hills that had been thinly settled before, the material trace of the people who became Israel; the question of where they came from is debated. The hills are today the northern West Bank, around Nablus and Ramallah, and the ruins of Shiloh, Shechem and Khirbet Tibnah, the usual site of Timnath-serah, are still there among the terraced olives."
  ru:
    - "Гора Ефремова, в современных переводах нагорье Ефремово, — не одна вершина, а центральный хребет страны между Вефилем на юге и равниной Изреельской на севере: известняковые горы высотой от 600 до 1000 метров, когда-то отчасти лесистые, с Сихемом в проходе, Силомом в сердце и Фамнаф-Сараи, собственным городом и могилой Иисуса Навина, «что на горе Ефремовой». Имя принадлежит уделу дома Иосифова, и Библия распространяет его на горы Манассии и вниз до Рамы и Вефиля, где Девора сидела под своей пальмой «на горе Ефремовой». Здесь жил Миха со своим истуканом и Елкана из Рамафаим-Цофима, отец Самуила; когда дом Иосифов жаловался, что горы для него тесны, Иисус Навин велел ему расчищать лес; а о первой столице северного царства сказано: «обстроил Иеровоам Сихем на горе Ефремовой и поселился в нем»."
    - "Иеремия называет эти горы трижды. В тревоге нашествия с севера «уже несется голос от Дана и гибельная весть с горы Ефремовой» — весть бежит на юг к Иерусалиму. В книге утешения он обещает, что стражи севера однажды позовут народ к храму на юге: «будет день, когда стражи на горе Ефремовой провозгласят: „вставайте, и взойдем на Сион к Господу Богу нашему“», — воссоединение двух царств. А в пророчестве о Вавилоне Израиль возвращён на свою пажить, «и душа его насытится на горе Ефремовой и в Галааде»."
    - "Археологические обследования нагорья, которые вели Израэль Финкельштейн в южной Самарии и Адам Зерталь в Манассии, зафиксировали сотни маленьких селений, основанных в XII–XI веках до н. э. на холмах, прежде заселённых редко, — вещественный след народа, ставшего Израилем; откуда он пришёл, спорят. Сегодня эти горы — северная часть Западного берега вокруг Наблуса и Рамаллы, и среди террас с оливами всё ещё лежат развалины Силома, Сихема и Хирбет-Тибны, обычного места Фамнаф-Сараи."
  uk:
    - "Гора Єфремова, у сучасних перекладах гірська країна Єфрема, — не одна вершина, а центральний хребет землі між Бет-Елом на півдні й Їзреельською рівниною на півночі: вапнякові пагорби заввишки від 600 до 1000 метрів, колись почасти вкриті лісом, із Сихемом у проході, Шіло в серці й Тімнат-Серахом, власним містом і гробницею Ісуса Навина, «в Тамнат-Сараа на Ефраїмовій горі». Назва належить до території дому Йосипа, і Біблія простягає її на пагорби Манасії й униз до Рами та Бет-Ела, де Дебора сиділа під своєю пальмою «на Ефраїм-горах». Тут жив Міха зі своїм ідолом і Елкана з Рамафаїм-Цофіма, батько Самуїла; коли дім Йосипа скаржився, що пагорби замалі для нього, Ісус Навин сказав йому розчистити ліс; а Єровоам «укріпив Еробоам Сихем на Ефраїм-горах та й осївся там», перший осідок північного царства."
    - "Єремія називає ці пагорби тричі. У тривозі вторгнення з півночі «доходить голос від Дана й пагубна вість із гори Ефраїмової», вість біжить на південь до Єрусалима. У книзі потіхи він обіцяє, що сторожі півночі колись покличуть народ до Храму півдня: «І прийде день, коли сторожі покликати муть по горах Ефраїмових: Уставайте, пійдемо на Сион, до Господа, Бога нашого!» — возз’єднання двох царств. А в пророцтві проти Вавилона Ізраїль повертається до свого пасовища, «і насититься душа його на Ефраїмових горах і в Галаадї»."
    - "Археологічні розвідки гірської країни, проведені Ізраїлем Фінкельштейном для південної Самарії та Адамом Церталем для Манасії, зафіксували сотні малих сіл, заснованих у XII–XI ст. до н. е. на пагорбах, які раніше були слабо заселені, — матеріальний слід народу, що став Ізраїлем; питання, звідки він прийшов, є предметом суперечки. Сьогодні ці пагорби — північний Західний берег, навколо Наблуса й Рамалли, а руїни Шіло, Сихема й Хірбет-Тібни, звичайного місця Тімнат-Серах, і досі стоять там серед терасованих оливок."
  es:
    - "El monte de Efraín, en las versiones modernas la sierra de Efraín, no es una cima sino la cordillera central entre Betel, al sur, y la llanura de Jezreel, al norte: colinas calcáreas de 600 a 1000 metros, antes en parte boscosas, con Siquem en su paso, Silo en su corazón y Timnat-sera, la ciudad y la tumba del propio Josué, «que está en el monte de Ephraim». El nombre pertenece al territorio de la casa de José, y la Biblia lo extiende a las colinas de Manasés y hacia abajo hasta Ramá y Betel, donde Débora se sentaba bajo su palmera «en el monte de Ephraim». Aquí vivió Micaías con su ídolo, y Elcana de Ramataim-zofim, padre de Samuel; cuando la casa de José se quejó de que las colinas les quedaban estrechas, Josué les dijo que talaran el bosque; y Jeroboam «reedificó [...] á Sichêm en el monte de Ephraim, y habitó en ella», la primera sede del reino del norte."
    - "Jeremías nombra las colinas tres veces. En la alarma de la invasión desde el norte, «la voz se oye del que trae las nuevas desde Dan, y del que hace oir la calamidad desde el monte de Ephraim», con la noticia corriendo hacia el sur, hacia Jerusalén. En el libro de la consolación promete que los centinelas del norte llamarán un día al pueblo al Templo del sur: «habrá día en que clamarán los guardas en el monte de Ephraim: Levantaos, y subamos á Sión, á Jehová nuestro Dios», una reunión de los dos reinos. Y en el oráculo contra Babilonia, Israel es devuelto a su pasto, «y en el monte de Ephraim y de Galaad se hartará su alma»."
    - "Las prospecciones arqueológicas de la sierra, dirigidas por Israel Finkelstein en el sur de Samaria y por Adam Zertal en Manasés, registraron cientos de pequeñas aldeas fundadas en los siglos XII y XI a. C. en colinas que antes habían estado poco pobladas, la huella material del pueblo que llegó a ser Israel; de dónde procedía se debate. Las colinas son hoy el norte de Cisjordania, en torno a Nablus y Ramala, y las ruinas de Silo, Siquem y Khirbet Tibnah, el sitio habitual de Timnat-sera, siguen allí entre los olivos en terrazas."
  pt:
    - "O monte Efraim, nas versões modernas a região montanhosa de Efraim, não é um único pico, mas a cordilheira central da terra entre Betel, ao sul, e a planície de Jezreel, ao norte: colinas calcárias de 600 a 1.000 metros, outrora em parte florestadas, com Siquém em sua passagem, Siló em seu coração e Timnate-Sera, cidade e túmulo de Josué, “que fica na região montanhosa de Efraim”. O nome pertence ao território da casa de José, e a Bíblia o estende às colinas de Manassés e até Ramá e Betel, onde Débora se sentava sob sua palmeira “na região montanhosa de Efraim”. Aqui vivia Mica com seu ídolo, e Elcana de Ramataim-Zofim, pai de Samuel; quando a casa de José se queixou de que as colinas eram estreitas, Josué mandou desmatar a floresta; e Jeroboão “edificou Siquém na região montanhosa de Efraim, e morou nela”, a primeira sede do reino do norte."
    - "Jeremias nomeia as colinas três vezes. No alarme da invasão vinda do norte, “uma voz declara desde Dã, e publica o mal desde as colinas de Efraim”, a notícia correndo para o sul rumo a Jerusalém. No livro da consolação, promete que os vigias do norte um dia chamarão o povo ao Templo do sul: “haverá um dia em que os vigias nas colinas de Efraim clamarão: ‘Levantem-se! Vamos subir a Sião, ao SENHOR, nosso Deus’”, uma reunião dos dois reinos. E no oráculo contra a Babilônia Israel é trazido de volta ao seu pasto: “Sua alma se fartará nas colinas de Efraim e em Gileade”."
    - "Prospecções arqueológicas da região montanhosa, dirigidas por Israel Finkelstein para o sul de Samaria e Adam Zertal para Manassés, registraram centenas de pequenas aldeias fundadas nos séculos XII e XI a.C. em colinas antes escassamente povoadas, o vestígio material do povo que se tornou Israel; de onde veio é debatido. As colinas são hoje o norte da Cisjordânia, em torno de Nablus e Ramallah, e as ruínas de Siló, Siquém e Khirbet Tibnah, o sítio habitual de Timnate-Sera, ainda estão lá entre as oliveiras em terraços."
  de:
    - "Das Gebirge Ephraim, in neueren Fassungen das Bergland Ephraim, ist kein einzelner Gipfel, sondern der zentrale Höhenzug des Landes zwischen Bethel im Süden und der Ebene Jesreel im Norden: Kalksteinhügel von 600 bis 1000 Metern, einst bewaldet, mit Sichem in seinem Pass, Silo in seinem Herzen und Timnat-Serach, Josuas eigener Stadt und Grab, „das auf dem Gebirge Ephraim liegt“. Der Name gehört zum Gebiet des Hauses Josef, und die Bibel dehnt ihn über die Hügel Manasses und bis hinab nach Rama und Bethel, wo Debora unter ihrer Palme saß, „zwischen Rama und Beth-El auf dem Gebirge Ephraim“. Hier lebte Micha mit seinem Götzenbild und Elkana von Ramatajim-Zofim, Samuels Vater; als das Haus Josef über zu enge Berge klagte, hieß Josua es den Wald roden; und Jerobeam „baute Sichem auf dem Gebirge Ephraim und wohnte darin“, der erste Sitz des Nordreichs."
    - "Jeremia nennt die Berge dreimal. Im Alarm vor dem Einfall aus dem Norden: „Denn es kommt ein Geschrei von Dan her und eine böse Botschaft vom Gebirge Ephraim“, die Nachricht läuft nach Süden auf Jerusalem zu. Im Trostbuch verheißt er, dass die Wächter des Nordens das Volk eines Tages zum Tempel im Süden rufen: „daß die Hüter an dem Gebirge Ephraim werden rufen: Wohlauf, und laßt uns hinaufgehen gen Zion zu dem HERRN, unserm Gott!“, eine Wiedervereinigung der beiden Reiche. Und im Spruch gegen Babel wird Israel auf seine Weide heimgebracht, „daß ihre Seele auf dem Gebirge Ephraim und Gilead gesättigt werden soll“."
    - "Archäologische Surveys des Berglands, geleitet von Israel Finkelstein für das südliche Samaria und Adam Zertal für Manasse, erfassten Hunderte kleiner Dörfer, die im 12. und 11. Jahrhundert v. Chr. auf zuvor dünn besiedelten Hügeln gegründet wurden, die materielle Spur des Volkes, das zu Israel wurde; woher es kam, ist umstritten. Die Hügel sind heute das nördliche Westjordanland, um Nablus und Ramallah, und die Ruinen von Silo, Sichem und Khirbet Tibnah, dem üblichen Ort von Timnat-Serach, liegen noch zwischen den terrassierten Olivenhainen."
  fr:
    - "La montagne d’Éphraïm, pour les modernes le pays de collines d’Éphraïm, n’est pas un sommet unique mais la chaîne centrale du pays entre Béthel au sud et la plaine de Jizreel au nord : collines calcaires de 600 à 1 000 mètres, jadis en partie boisées, avec Sichem dans son défilé, Silo en son cœur et Thimnath-Sérach, la ville et la tombe de Josué, « dans la montagne d’Éphraïm ». Le nom appartient au territoire de la maison de Joseph, et la Bible l’étend sur les collines de Manassé et jusqu’à Rama et Béthel, où Débora siégeait sous son palmier « dans la montagne d’Éphraïm ». Là vécurent Mica avec son idole et Elkana de Ramathaïm-Tsophim, père de Samuel ; quand la maison de Joseph jugea les collines trop étroites, Josué lui dit de défricher la forêt ; et Jéroboam « bâtit Sichem sur la montagne d’Éphraïm, et il y demeura », premier siège du royaume du nord."
    - "Jérémie nomme trois fois ces collines. Dans l’alarme de l’invasion venue du nord, « une voix qui part de Dan annonce la calamité, elle la publie depuis la montagne d’Éphraïm », la nouvelle courant vers le sud en direction de Jérusalem. Dans le livre de la consolation, il promet que les guetteurs du nord appelleront un jour le peuple au Temple du sud : « le jour vient où les gardes crieront sur la montagne d’Éphraïm : Levez-vous, montons à Sion, vers l’Éternel, notre Dieu ! », une réunion des deux royaumes. Et dans l’oracle contre Babylone, Israël est ramené à son pâturage, « et son âme se rassasiera sur la montagne d’Éphraïm et dans Galaad »."
    - "Les prospections archéologiques du pays de collines, menées par Israel Finkelstein pour le sud de la Samarie et Adam Zertal pour Manassé, ont recensé des centaines de petits villages fondés aux XIIe et XIe siècles av. J.-C. sur des collines peu habitées auparavant, trace matérielle du peuple qui devint Israël ; d’où il venait est débattu. Les collines forment aujourd’hui le nord de la Cisjordanie, autour de Naplouse et de Ramallah, et les ruines de Silo, de Sichem et de Khirbet Tibnah, site habituel de Thimnath-Sérach, y sont toujours, parmi les oliviers en terrasses."
  it:
    - "Il Monte Efraim, nelle versioni moderne la regione montuosa di Efraim, non è una vetta sola ma la catena centrale del paese tra Betel a sud e la pianura di Izreel a nord: colline calcaree di 600-1000 metri, un tempo in parte boscose, con Sichem nel suo passo, Silo nel cuore e Timnat-Serah, la città e tomba di Giosuè, «che è nella contrada montuosa di Efraim». Il nome appartiene al territorio della casa di Giuseppe, e la Bibbia lo estende alle colline di Manasse e giù fino a Rama e Betel, dove Debora sedeva sotto la sua palma «nella contrada montuosa di Efraim». Qui abitavano Michea con il suo idolo ed Elkana di Ramataim-Zofim, padre di Samuele; quando la casa di Giuseppe si lamentò che le colline erano troppo anguste, Giosuè le mandò a dissodare la foresta; e Geroboamo «edificò Sichem nella contrada montuosa di Efraim, e vi si stabilì», prima sede del regno del nord."
    - "Geremia nomina le colline tre volte. Nell’allarme dell’invasione da nord, «una voce che viene da Dan annunzia la calamità, e la bandisce dai colli d’Efraim», la notizia che corre verso sud, a Gerusalemme. Nel libro della consolazione promette che le guardie del nord chiameranno un giorno il popolo al Tempio del sud: «il giorno verrà, quando le guardie grideranno sul monte d’Efraim: Levatevi, saliamo a Sion, all’Eterno ch’è il nostro Dio», la riunione dei due regni. E nell’oracolo contro Babilonia Israele è ricondotto al suo pascolo, «l’anima sua si sazierà sui colli d’Efraim e in Galaad»."
    - "Le ricognizioni archeologiche della regione collinare, guidate da Israel Finkelstein per la Samaria meridionale e da Adam Zertal per Manasse, hanno registrato centinaia di piccoli villaggi fondati nel XII e XI secolo a.C. su colline poco abitate prima, traccia materiale del popolo che divenne Israele; da dove venisse è discusso. Le colline sono oggi la Cisgiordania settentrionale, intorno a Nablus e Ramallah, e le rovine di Silo, Sichem e Khirbet Tibnah, sito abituale di Timnat-Serah, sono ancora là tra gli ulivi terrazzati."
  pl:
    - "Góry Efraima, we współczesnych przekładach pogórze Efraima, to nie pojedynczy szczyt, lecz środkowe pasmo kraju między Betel na południu a równiną Jizreel na północy: wapienne wzgórza o wysokości od 600 do 1000 m, niegdyś częściowo zalesione, z Sychem w przełęczy, Szilo w sercu i Timnat-Serach, miastem i grobem samego Jozuego, „które jest na górze Efraim”. Nazwa należy do terytorium domu Józefa, a Biblia rozciąga ją na wzgórza Manassesa i w dół aż do Ramy i Betel, gdzie Debora siedziała pod swoją palmą „na górze Efraim”. Tu mieszkał Mika ze swoim bożkiem i Elkana z Ramataim-Sofim, ojciec Samuela; gdy dom Józefa skarżył się, że wzgórza są dla nich za ciasne, Jozue kazał im wyrąbać las; a „zbudował Jeroboam Sychem na górze Efraim, i mieszkał w nim”, pierwsza siedziba królestwa północnego."
    - "Jeremiasz trzy razy wymienia te wzgórza. W alarmie inwazji z północy „głos opowiadającego idzie od Danu, a tego, który ogłasza nieprawość, z góry Efraim”, wieść biegnąca na południe ku Jerozolimie. W księdze pocieszenia obiecuje, że stróże północy wezwą kiedyś lud do Świątyni na południu: „nastanie dzień, którego stróżowie wołać będą na górze Efraimowej: Wstańcie a wstąpmy na Syon do Pana, Boga swego”, zjednoczenie obu królestw. A w wyroczni przeciw Babilonowi Izrael wraca do swego pastwiska, „na górze Efraimowej, a w Galaadzie nasycona będzie dusza jego”."
    - "Badania archeologiczne wyżyny, prowadzone przez Israela Finkelsteina dla południowej Samarii i Adama Zertala dla Manassesa, zarejestrowały setki małych wsi założonych w XII i XI w. p.n.e. na wzgórzach, które wcześniej były słabo zasiedlone, materialny ślad ludu, który stał się Izraelem; pytanie, skąd przybył, jest dyskutowane. Wzgórza to dziś północny Zachodni Brzeg, wokół Nablusu i Ramallah, a ruiny Szilo, Sychem i Khirbet Tibnah, zwykłego miejsca Timnat-Serach, wciąż tam są wśród tarasowych gajów oliwnych."
  nl:
    - "Het Bergland van Efraïm, in moderne vertalingen het heuvelland van Efraïm, is geen enkele top maar het middengebergte tussen Bethel in het zuiden en de vlakte van Jizreël in het noorden: kalksteenheuvels van 600 tot 1.000 meter, eens gedeeltelijk bebost, met Sichem in zijn pas, Silo in zijn hart en Timnat-Serach, Jozua's eigen stad en graf, “welke is op een berg van Efraim”. De naam hoort bij het gebied van Jozefs huis, en de Bijbel rekt hem uit over de heuvels van Manasse en tot Rama en Bethel, waar Debora onder haar palm zat “op het gebergte van Efraim”. Hier woonde Micha met zijn afgodsbeeld, en Elkana van Ramataïm-Zofim, Samuëls vader; toen het huis van Jozef klaagde dat de heuvels hun te eng waren, zei Jozua hun het woud te kappen; en Jerobeam “bouwde Sichem op het gebergte van Efraim, en woonde daarin”, de eerste zetel van het noordelijke koninkrijk."
    - "Jeremia noemt de heuvels driemaal. In de alarmkreet van een inval uit het noorden luidt het: “een stem verkondigt van Dan af, en doet ellende horen van het gebergte van Efraim”, het nieuws dat zuidwaarts richting Jeruzalem rent. In het boek van de vertroosting belooft hij dat de wachters van het noorden het volk eens zullen oproepen naar de tempel van het zuiden: “er zal een dag zijn, waarin de hoeders op Efraims gebergte zullen roepen: Maakt ulieden op, en laat ons opgaan naar Sion, tot den HEERE, onzen God!”, een hereniging van de twee koninkrijken. En in de godsspraak tegen Babel wordt Israël teruggebracht naar zijn weide, “en zijn ziel zal op het gebergte van Efraim en Gilead verzadigd worden”."
    - "Archeologische oppervlakteonderzoeken van het heuvelland, onder leiding van Israel Finkelstein voor zuidelijk Samaria en Adam Zertal voor Manasse, registreerden honderden kleine dorpen, gesticht in de twaalfde en elfde eeuw v.Chr. op heuvels die daarvoor dun bewoond waren, het materiële spoor van het volk dat Israël werd; waar zij vandaan kwamen, wordt betwist. De heuvels vormen tegenwoordig de noordelijke Westoever, rond Nabloes en Ramallah, en de ruïnes van Silo, Sichem en Khirbet Tibnah, de gebruikelijke plaats van Timnat-Serach, staan er nog tussen de terrassen met olijfbomen."
  cs:
    - "Efrajimské pohoří, v moderních překladech Efrajimská vrchovina, není jediný vrchol, nýbrž střední pásmo země mezi Bét-elem na jihu a pláni Jizreel na severu: vápencové pahorky 600 až 1000 metrů vysoké, kdysi zčásti zalesněné, se Šekemem v průsmyku, Šílem v srdci a Timnat-serachem, Jozuovým vlastním městem a hrobem, „kteréž jest na hoře Efraim“. Jméno patří území domu Josefova a Bible je rozšiřuje na pahorky Manasesovy a dolů k Rámě a Bét-elu, kde Debora seděla pod svou palmou „na hoře Efraim“. Tu žil Micheáš se svou modlou a Elkána z Ramatajim-sófim, Samuelův otec; když si dům Josefův stěžoval, že jsou pahorky pro ně příliš těsné, Jozue jim řekl, aby vyklučili les; a Jarobeám „vystavěl Sichem na hoře Efraim, a bydlil v něm“, první sídlo severního království."
    - "Jeremjáš jmenuje pahorky třikrát. V poplachu před vpádem ze severu „hlas oznamujícího přichází od Dan, a toho, kterýž ohlašuje nepravost, s hory Efraim“, zpráva běží na jih k Jeruzalému. V knize utěšení slibuje, že strážní severu jednou svolají lid k jižnímu chrámu: „nastane den, v němž volati budou strážní na hoře Efraimově: Vstaňte a vstupme na Sion k Hospodinu Bohu svému“, shledání obou království. A v proroctví proti Babylónu je Izrael přiveden domů na svou pastvu, „a na hoře Efraim, a v Galád aby se sytila duše jeho“."
    - "Archeologické průzkumy pahorkatiny, vedené Israelem Finkelsteinem pro jižní Samaří a Adamem Zertalem pro Manases, zaznamenaly stovky malých vesnic založených ve 12. a 11. století př. n. l. na pahorcích, které byly předtím řídce osídleny, hmotnou stopu lidu, který se stal Izraelem; otázka, odkud přišel, je sporná. Pahorky jsou dnes severním Západním břehem, kolem Nábulusu a Ramalláhu, a zříceniny Šíla, Šekemu a Khirbet Tibnah, obvyklého místa Timnat-serachu, tam dosud stojí mezi terasovitými olivami."
  sv:
    - "Efraims bergsbygd, på moderna språk Efraims bergsland, är inte en enskild topp utan landets centrala bergskedja mellan Betel i söder och Jisreelslätten i norr: kalkstensberg på 600 till 1 000 meter, en gång delvis skogsklädda, med Shekem i sitt pass, Shilo i sitt hjärta och Timnat-Serach, Josuas egen stad och grav, ”i Efraims bergsbygd”. Namnet hör till Josefs hus' område, och Bibeln sträcker det över Manasses berg och ned till Rama och Betel, där Debora satt under sin palm ”i Efraims bergsbygd”. Här bodde Mika med sin avgud, och Elkana från Ramatajim-Sofim, Samuels far; när Josefs hus klagade att bergen var för trånga för dem sade Josua åt dem att röja skogen; och Jerobeam ”befäste Sikem i Efraims bergsbygd och bosatte sig där”, det norra rikets första säte."
    - "Jeremia nämner bergen tre gånger. I larmet om invasionen från norr: ”Från Dan höres ju en budbärare ropa, och från Efraims bergsbygd en som bådar fördärv”, nyheten som rör sig söderut mot Jerusalem. I tröstens bok lovar han att vaktarna i norr en dag skall kalla folket till templet i söder: ”Ty en dag kommer, då vaktare skola ropa på Efraims berg: 'Upp, låt oss draga till Sion, upp till HERREN, vår Gud.'”, en återförening av de två rikena. Och i utsagan mot Babylon förs Israel hem till sin betesmark, ”och på Efraims berg och i Gilead skall han få äta sig mätt”."
    - "Arkeologiska undersökningar av bergslandet, ledda av Israel Finkelstein för södra Samaria och Adam Zertal för Manasse, registrerade hundratals små byar grundade på 1100- och 1000-talen f.Kr. på höjder som tidigare varit glest bebodda, det materiella spåret efter folket som blev Israel; frågan var de kom ifrån är omdebatterad. Bergen är i dag norra Västbanken, kring Nablus och Ramallah, och ruinerna av Shilo, Shekem och Khirbet Tibnah, den vanliga platsen för Timnat-Serach, finns ännu kvar bland de terrasserade olivlundarna."
  nb:
    - "Efraim-fjellet, i moderne oversettelser Efraims fjellland, er ikke én enkelt topp, men den sentrale åsryggen i landet mellom Betel i sør og Jisreel-sletten i nord: kalksteinsåser på 600 til 1000 meter, en gang delvis skogkledde, med Sikem i sitt pass, Sjilo i sitt hjerte og Timnat-Serah, Josvas egen by og grav, «som ligger i Efra'im-fjellene». Navnet hører til Josefs hus' område, og Bibelen strekker det over Manasses åser og ned til Rama og Betel, der Debora satt under sitt palmetre «på Efra'im-fjellet». Her bodde Mika med sitt avgudsbilde, og Elkana fra Ramatajim-Sofim, Samuels far; da Josefs hus klaget over at åsene var for trange for dem, sa Josva at de skulle rydde skogen; og Jeroboam «bygget Sikem i Efra'im-fjellene om til en fast by og bosatte sig der», det nordlige rikets første sete."
    - "Jeremia nevner åsene tre ganger. I alarmen om invasjon fra nord: «For en røst kommer med tidende fra Dan og varsler ondt fra Efra'ims fjell», nyheten som løper sørover mot Jerusalem. I trøstens bok lover han at nordens vektere en dag vil kalle folket til tempelet i sør: «For det kommer en dag da vektere skal rope på Efra'ims fjell: stå op og la oss dra op til Sion, til Herren vår Gud!», en gjenforening av de to rikene. Og i oraklet mot Babylon føres Israel hjem til sin beitemark, «og på Efra'ims fjell og i Gilead skal det ete sig mett»."
    - "Arkeologiske undersøkelser av åslandet, ledet av Israel Finkelstein for det sørlige Samaria og Adam Zertal for Manasse, registrerte hundrevis av små landsbyer grunnlagt på 1100- og 1000-tallet f.Kr. på åser som før var tynt bosatt, det materielle sporet etter folket som ble Israel; spørsmålet om hvor de kom fra, er omdiskutert. Åsene er i dag den nordlige delen av Vestbredden, omkring Nablus og Ramallah, og ruinene av Sjilo, Sikem og Khirbet Tibnah, det vanlige stedet for Timnat-Serah, er fortsatt der blant de terrasserte oliventrærne."
