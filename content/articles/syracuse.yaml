body:
  en:
    - "Syracuse, on the east coast of Sicily, was founded by settlers from Corinth under Archias, by Thucydides' reckoning in 733 BC, on the small island of Ortygia, from which the city spread over the mainland opposite. It became the greatest Greek city of Sicily. The great Athenian expedition of 415–413 BC, sent to subdue it, ended in the destruction of the Athenian fleet in its harbour and of the army on its retreat. Rome took Syracuse in 212 BC after a long siege in which the machines of Archimedes held off the consul Marcellus; Archimedes was killed in the sack."
    - "After three months on Malta, Paul and his companions sailed on towards Rome “in a ship of Alexandria, which had wintered in the isle, whose sign was Castor and Pollux”. The first port was Syracuse: “And landing at Syracuse, we tarried there three days.” From there they went on to Rhegium and to Puteoli."
    - "Under Rome Syracuse was the chief city of the province of Sicily. Cicero, prosecuting its governor Verres, recalled that it was held to be the largest of Greek cities and the most beautiful of all, and said to be made up of four towns, the Island, Achradina, Tyche and Neapolis. Augustus settled a colony of Roman citizens there, and in later centuries the Christians of Syracuse cut extensive catacombs into the rock, among them those beneath the church of San Giovanni. Today Siracusa is a city of Sicily in Italy, with its old town on Ortygia; with the nearby necropolis of Pantalica it was inscribed on the UNESCO World Heritage List in 2005."
  ru:
    - "Сиракузы на восточном берегу Сицилии основали переселенцы из Коринфа во главе с Архием, по счёту Фукидида в 733 г. до н. э., на маленьком острове Ортигия, откуда город разросся на противолежащий берег. Он стал величайшим греческим городом Сицилии. Большой афинский поход 415–413 гг. до н. э., посланный покорить его, кончился гибелью афинского флота в его гавани и войска при отступлении. Рим взял Сиракузы в 212 г. до н. э. после долгой осады, в которой машины Архимеда сдерживали консула Марцелла; при разграблении города Архимед был убит."
    - "После трёх месяцев на Мелите Павел и его спутники поплыли дальше к Риму «на Александрийском корабле, называемом Диоскуры, зимовавшем на том острове». Первой гаванью были Сиракузы: «и, приплыв в Сиракузы, пробыли там три дня». Оттуда они пошли в Ригию и в Путеол."
    - "При римлянах Сиракузы были главным городом провинции Сицилия. Цицерон, обвиняя её наместника Верреса, напомнил, что их считают самым большим из греческих городов и прекраснейшим из всех и что они, как говорят, состоят из четырёх городов — Острова, Ахрадины, Тихе и Неаполя. Август поселил там колонию римских граждан, а в последующие века христиане Сиракуз высекли в скале обширные катакомбы, среди них катакомбы под церковью Сан-Джованни. Сегодня Сиракузы — город на Сицилии в Италии со старым городом на Ортигии; вместе с соседним некрополем Панталика он в 2005 г. внесён в список Всемирного наследия ЮНЕСКО."
  uk:
    - "Сиракузи на східному узбережжі Сицилії заснували поселенці з Коринта під проводом Архія, за обчисленням Фукідіда 733 р. до н. е., на малому острові Ортігія, звідки місто розрослося на материк навпроти. Воно стало найбільшим грецьким містом Сицилії. Велика афінська експедиція 415–413 рр. до н. е., послана його підкорити, закінчилася знищенням афінського флоту в його гавані та війська під час відступу. Рим узяв Сиракузи 212 р. до н. е. після довгої облоги, під час якої машини Архімеда стримували консула Марцелла; Архімеда вбили під час розграбування."
    - "Після трьох місяців на Мальті Павло та його супутники рушили далі до Риму «кораблем Александрийським, надписаним Диоскур, що зимував на острові». Першою гаванню були Сиракузи: «І припливши в Сиракузу, пробули (там) три днї». Звідти вони пішли до Регія й до Путеол."
    - "Під владою Риму Сиракузи були головним містом провінції Сицилія. Цицерон, обвинувачуючи її намісника Верреса, нагадував, що його вважали найбільшим із грецьких міст і найгарнішим з усіх, і казали, що воно складається з чотирьох міст: Острова, Ахрадіни, Тіхе й Неаполя. Август оселив там колонію римських громадян, а в наступні століття християни Сиракуз вирубали в скелі розлогі катакомби, серед них ті, що під церквою Сан-Джованні. Нині Сиракузи (Сіракуза) — місто Сицилії в Італії, зі старим містом на Ортігії; разом із сусіднім некрополем Панталіка його внесено до Списку всесвітньої спадщини ЮНЕСКО 2005 р."
  es:
    - "Siracusa, en la costa oriental de Sicilia, fue fundada por colonos de Corinto bajo Arquias, según el cómputo de Tucídides en 733 a. C., en la pequeña isla de Ortigia, desde donde la ciudad se extendió por el continente frontero. Llegó a ser la mayor ciudad griega de Sicilia. La gran expedición ateniense de 415–413 a. C., enviada para someterla, terminó con la destrucción de la flota ateniense en su puerto y del ejército en su retirada. Roma tomó Siracusa en 212 a. C. tras un largo asedio en que las máquinas de Arquímedes detuvieron al cónsul Marcelo; Arquímedes murió en el saqueo."
    - "Tras tres meses en Malta, Pablo y sus compañeros navegaron hacia Roma «en una nave Alejandrina que había invernado en la isla, la cual tenía por enseña á Cástor y Pólux». El primer puerto fue Siracusa: «Y llegados á Siracusa, estuvimos allí tres días». De allí siguieron a Regio y a Puteoli."
    - "Bajo Roma, Siracusa fue la ciudad principal de la provincia de Sicilia. Cicerón, al acusar a su gobernador Verres, recordó que se tenía por la mayor de las ciudades griegas y la más hermosa de todas, y que se decía formada por cuatro ciudades: la Isla, Acradina, Tique y Neápolis. Augusto estableció allí una colonia de ciudadanos romanos, y en siglos posteriores los cristianos de Siracusa excavaron en la roca extensas catacumbas, entre ellas las situadas bajo la iglesia de San Giovanni. Hoy Siracusa es una ciudad de Sicilia, en Italia, con su casco antiguo en Ortigia; junto con la cercana necrópolis de Pantalica fue inscrita en la lista del Patrimonio Mundial de la UNESCO en 2005."
  pt:
    - "Siracusa, na costa leste da Sicília, foi fundada por colonos de Corinto sob Árquias, segundo o cálculo de Tucídides em 733 a.C., na pequena ilha de Ortígia, de onde a cidade se estendeu pelo continente em frente. Tornou-se a maior cidade grega da Sicília. A grande expedição ateniense de 415–413 a.C., enviada para submetê-la, terminou na destruição da frota ateniense em seu porto e do exército em sua retirada. Roma tomou Siracusa em 212 a.C. depois de um longo cerco em que as máquinas de Arquimedes detiveram o cônsul Marcelo; Arquimedes foi morto no saque."
    - "Depois de três meses em Malta, Paulo e seus companheiros navegaram para Roma “em um navio de Alexandria que havia passado o inverno na ilha, cuja figura de proa era ‘Os Irmãos Gêmeos’”. O primeiro porto foi Siracusa: “Aportando em Siracusa, ficamos ali três dias.” Dali seguiram para Régio e para Putéoli."
    - "Sob Roma, Siracusa foi a cidade principal da província da Sicília. Cícero, ao acusar seu governador Verres, lembrou que ela era tida como a maior das cidades gregas e a mais bela de todas, e dita formada por quatro cidades: a Ilha, Acradina, Tique e Neápolis. Augusto estabeleceu ali uma colônia de cidadãos romanos, e nos séculos seguintes os cristãos de Siracusa escavaram na rocha extensas catacumbas, entre elas as que ficam sob a igreja de San Giovanni. Hoje Siracusa é uma cidade da Sicília, na Itália, com sua cidade velha em Ortígia; com a necrópole próxima de Pantalica, foi inscrita na Lista do Patrimônio Mundial da UNESCO em 2005."
  de:
    - "Syrakus an der Ostküste Siziliens wurde von Siedlern aus Korinth unter Archias, nach Thukydides' Rechnung 733 v. Chr., auf der kleinen Insel Ortygia gegründet, von der aus sich die Stadt über das gegenüberliegende Festland ausbreitete. Sie wurde die größte griechische Stadt Siziliens. Die große athenische Expedition von 415–413 v. Chr., die sie unterwerfen sollte, endete mit der Vernichtung der athenischen Flotte in ihrem Hafen und des Heeres auf seinem Rückzug. Rom nahm Syrakus 212 v. Chr. nach einer langen Belagerung ein, in der die Maschinen des Archimedes den Konsul Marcellus aufhielten; Archimedes wurde bei der Plünderung getötet."
    - "Nach drei Monaten auf Malta segelten Paulus und seine Gefährten weiter nach Rom „in einem Schiffe von Alexandrien, welches bei der Insel überwintert hatte und hatte ein Panier der Zwillinge“. Der erste Hafen war Syrakus: „Und da wir gen Syrakus kamen, blieben wir drei Tage da.“ Von dort ging es weiter nach Rhegion und nach Puteoli."
    - "Unter Rom war Syrakus die Hauptstadt der Provinz Sizilien. Cicero erinnerte bei der Anklage gegen deren Statthalter Verres daran, sie gelte als die größte der griechischen Städte und die schönste von allen, und man sage, sie bestehe aus vier Städten, der Insel, Achradina, Tyche und Neapolis. Augustus gründete dort eine Kolonie römischer Bürger, und in späteren Jahrhunderten schlugen die Christen von Syrakus ausgedehnte Katakomben in den Fels, darunter die unter der Kirche San Giovanni. Heute ist Siracusa eine Stadt Siziliens in Italien, mit ihrer Altstadt auf Ortygia; zusammen mit der nahen Nekropole Pantalica wurde sie 2005 in die UNESCO-Welterbeliste eingetragen."
  fr:
    - "Syracuse, sur la côte orientale de la Sicile, fut fondée par des colons de Corinthe conduits par Archias, en 733 av. J.-C. selon le calcul de Thucydide, sur la petite île d’Ortygie, d’où la ville s’étendit sur la terre ferme voisine. Elle devint la plus grande cité grecque de Sicile. La grande expédition athénienne de 415–413 av. J.-C., envoyée pour la soumettre, s’acheva par la destruction de la flotte athénienne dans son port et celle de l’armée pendant sa retraite. Rome prit Syracuse en 212 av. J.-C. après un long siège où les machines d’Archimède tinrent en échec le consul Marcellus ; Archimède fut tué lors du sac."
    - "Après trois mois passés à Malte, Paul et ses compagnons reprirent la mer vers Rome « sur un navire d’Alexandrie, qui avait passé l’hiver dans l’île, et qui portait pour enseigne les Dioscures ». Le premier port fut Syracuse : « Ayant abordé à Syracuse, nous y restâmes trois jours. » De là, ils gagnèrent Rhegium, puis Pouzzoles."
    - "Sous Rome, Syracuse fut la principale ville de la province de Sicile. Cicéron, accusant son gouverneur Verrès, rappela qu’on la tenait pour la plus grande des cités grecques et la plus belle de toutes, et qu’on la disait formée de quatre villes : l’Île, Achradine, Tychè et Néapolis. Auguste y établit une colonie de citoyens romains, et dans les siècles suivants les chrétiens de Syracuse creusèrent dans le roc de vastes catacombes, dont celles qui s’étendent sous l’église San Giovanni. Aujourd’hui, Syracuse (Siracusa) est une ville de Sicile, en Italie, dont la vieille ville occupe Ortygie ; avec la nécropole voisine de Pantalica, elle a été inscrite sur la Liste du patrimoine mondial de l’UNESCO en 2005."
  it:
    - "Siracusa, sulla costa orientale della Sicilia, fu fondata da coloni di Corinto sotto Archia, secondo il calcolo di Tucidide nel 733 a.C., sulla piccola isola di Ortigia, da cui la città si estese sulla terraferma di fronte. Divenne la più grande città greca della Sicilia. La grande spedizione ateniese del 415–413 a.C., inviata per sottometterla, si concluse con la distruzione della flotta ateniese nel suo porto e dell’esercito nella ritirata. Roma prese Siracusa nel 212 a.C. dopo un lungo assedio in cui le macchine di Archimede tennero a bada il console Marcello; Archimede fu ucciso durante il saccheggio."
    - "Dopo tre mesi a Malta, Paolo e i suoi compagni proseguirono verso Roma «sopra una nave alessandrina che avea per insegna Castore e Polluce, e che avea svernato nell’isola». Il primo porto fu Siracusa: «E arrivati a Siracusa, vi restammo tre giorni». Di là proseguirono per Reggio e per Pozzuoli."
    - "Sotto Roma Siracusa fu la città principale della provincia di Sicilia. Cicerone, accusando il suo governatore Verre, ricordò che era ritenuta la più grande delle città greche e la più bella di tutte, e che si diceva composta di quattro città, l’Isola, Acradina, Tiche e Neapoli. Augusto vi stanziò una colonia di cittadini romani, e nei secoli successivi i cristiani di Siracusa scavarono nella roccia vaste catacombe, tra cui quelle sotto la chiesa di San Giovanni. Oggi Siracusa è una città della Sicilia, in Italia, con il centro storico su Ortigia; con la vicina necropoli di Pantalica fu iscritta nella lista del patrimonio mondiale dell’UNESCO nel 2005."
  nl:
    - "Syracuse, aan de oostkust van Sicilië, werd gesticht door kolonisten uit Korinthe onder Archias, volgens Thucydides' berekening in 733 v.Chr., op het kleine eiland Ortygia, van waaruit de stad zich over het vasteland ertegenover uitbreidde. Het werd de grootste Griekse stad van Sicilië. De grote Atheense expeditie van 415–413 v.Chr., gezonden om haar te onderwerpen, eindigde met de vernietiging van de Atheense vloot in haar haven en van het leger op zijn terugtocht. Rome nam Syracuse in 212 v.Chr. in na een lang beleg waarin de machines van Archimedes de consul Marcellus op afstand hielden; Archimedes werd bij de plundering gedood."
    - "Na drie maanden op Malta voeren Paulus en zijn metgezellen verder naar Rome “in een schip van Alexandrië, dat in het eiland overwinterd had, hebbende tot een teken, Kastor en Pollux”. De eerste haven was Syracuse: “En als wij te Syrakuse aangekomen waren, bleven wij aldaar drie dagen.” Vandaar gingen zij verder naar Regium en naar Puteoli."
    - "Onder Rome was Syracuse de hoofdstad van de provincie Sicilië. Cicero, die haar gouverneur Verres vervolgde, bracht in herinnering dat zij als de grootste der Griekse steden gold en als de mooiste van allemaal, en dat zij uit vier steden zou bestaan: het Eiland, Achradina, Tyche en Neapolis. Augustus vestigde er een kolonie van Romeinse burgers, en in latere eeuwen hieuwen de christenen van Syracuse uitgestrekte catacomben in de rots, onder andere die onder de kerk van San Giovanni. Tegenwoordig is Siracusa een stad op Sicilië in Italië, met haar oude stad op Ortygia; samen met de nabije necropolis van Pantalica werd zij in 2005 op de werelderfgoedlijst van UNESCO geplaatst."
  pl:
    - "Syrakuzy, na wschodnim wybrzeżu Sycylii, zostały założone przez osadników z Koryntu pod wodzą Archiasa, według rachuby Tukidydesa w 733 p.n.e., na małej wyspie Ortygia, skąd miasto rozrosło się na leżącym naprzeciw lądzie. Stało się największym miastem greckim Sycylii. Wielka wyprawa ateńska z lat 415-413 p.n.e., wysłana, by je ujarzmić, skończyła się zniszczeniem floty ateńskiej w ich porcie i armii podczas odwrotu. Rzym zdobył Syrakuzy w 212 p.n.e. po długim oblężeniu, w którym maszyny Archimedesa powstrzymywały konsula Marcellusa; Archimedes zginął podczas grabieży."
    - "Po trzech miesiącach na Malcie Paweł i jego towarzysze popłynęli dalej ku Rzymowi „w okręcie Aleksandryjskim, który zimował na onej wyspie, mającym za herb Kastora i Polluksa”. Pierwszym portem były Syrakuzy: „A przypłynąwszy do Syrakus, zamieszkaliśmy tam trzy dni”. Stamtąd udali się do Regium i do Puteoli."
    - "Pod panowaniem Rzymu Syrakuzy były głównym miastem prowincji Sycylia. Cyceron, oskarżając jej namiestnika Werresa, przypomniał, że uchodziły za największe z miast greckich i najpiękniejsze ze wszystkich oraz że mówiono, iż składają się z czterech miast: Wyspy, Achradiny, Tyche i Neapolis. August osiedlił tam kolonię obywateli rzymskich, a w późniejszych wiekach chrześcijanie z Syrakuz wykuli w skale rozległe katakumby, w tym te pod kościołem San Giovanni. Dziś Siracusa jest miastem na Sycylii we Włoszech, ze starym miastem na Ortygii; wraz z pobliską nekropolią Pantalica wpisano ją na listę światowego dziedzictwa UNESCO w 2005 roku."
  cs:
    - "Syrakusy na východním pobřeží Sicílie založili osadníci z Korintu pod vedením Archia, podle Thúkydidova výpočtu roku 733 př. n. l., na malém ostrově Ortygii, odkud se město rozšířilo na protější pevninu. Staly se největším řeckým městem Sicílie. Velká athénská výprava z let 415–413 př. n. l., vyslaná, aby je podrobila, skončila zničením athénského loďstva v jejich přístavu a vojska při ústupu. Řím dobyl Syrakusy roku 212 př. n. l. po dlouhém obléhání, v němž Archimédovy stroje zadržely konzula Marcella; Archimédés byl při vyplenění zabit."
    - "Po třech měsících na Maltě pokračovali Pavel a jeho společníci v plavbě do Říma „na bárce Alexandrinské, kteráž tu byla na tom ostrově přes zimu, majici za erb Kastora a Polluxa“. Prvním přístavem byly Syrakusy: „A když jsme přijeli do Syrakusis, zůstali jsme tu za tři dni.“ Odtud pluli do Regia a do Puteol."
    - "Za Říma byly Syrakusy hlavním městem provincie Sicílie. Cicero, který žaloval jejího správce Verra, připomněl, že je pokládáno za největší z řeckých měst a nejkrásnější ze všech a že se říká, že se skládá ze čtyř měst, Ostrova, Achradiny, Týché a Neapole. Augustus tam usadil kolonii římských občanů a v pozdějších stoletích vytesali syrakuští křesťané do skály rozsáhlé katakomby, mezi nimi ty pod kostelem San Giovanni. Dnes jsou Syrakusy (Siracusa) městem na Sicílii v Itálii se starým městem na Ortygii; spolu s nedalekou nekropolí Pantalica byly zapsány na seznam světového dědictví UNESCO roku 2005."
  sv:
    - "Syrakusa, på Siciliens östkust, grundades av nybyggare från Korinth under Archias, enligt Thukydides' räkning år 733 f.Kr., på den lilla ön Ortygia, varifrån staden bredde ut sig över fastlandet mittemot. Den blev Siciliens största grekiska stad. Den stora atenska expeditionen 415–413 f.Kr., utsänd för att kuva den, slutade med att den atenska flottan förstördes i dess hamn och armén under återtåget. Rom intog Syrakusa 212 f.Kr. efter en lång belägring där Arkimedes' maskiner höll konsuln Marcellus stången; Arkimedes dödades vid plundringen."
    - "Efter tre månader på Malta seglade Paulus och hans följeslagare vidare mot Rom ”på ett skepp som hade legat vid ön över vintern; det var från Alexandria och bar Tvillinggudarnas bilder”. Första hamnen var Syrakusa: ”Och vi lade till vid Syrakusa och stannade där i tre dagar.” Därifrån gick de vidare till Rhegion och Puteoli."
    - "Under Rom var Syrakusa huvudstad i provinsen Sicilien. Cicero, som anklagade dess guvernör Verres, erinrade om att den ansågs vara den största av de grekiska städerna och den vackraste av alla, och sades bestå av fyra städer: Ön, Achradina, Tyche och Neapolis. Augustus lät grunda en koloni av romerska medborgare där, och under senare århundraden högg de kristna i Syrakusa omfattande katakomber i berget, bland dem de under kyrkan San Giovanni. I dag är Siracusa en stad på Sicilien i Italien, med sin gamla stad på Ortygia; tillsammans med den närbelägna nekropolen Pantalica skrevs den in på Unescos världsarvslista 2005."
  nb:
    - "Syrakus, på østkysten av Sicilia, ble grunnlagt av nybyggere fra Korint under Archias, etter Thukydids regnskap i 733 f.Kr., på den lille øya Ortygia, hvorfra byen bredte seg over fastlandet overfor. Den ble den største greske byen på Sicilia. Den store athenske ekspedisjonen i 415–413 f.Kr., sendt for å underlegge den, endte med ødeleggelsen av den athenske flåten i havnen og av hæren på tilbaketoget. Roma inntok Syrakus i 212 f.Kr. etter en lang beleiring der Arkimedes' maskiner holdt konsulen Marcellus tilbake; Arkimedes ble drept under plyndringen."
    - "Etter tre måneder på Malta seilte Paulus og følgesvennene videre mot Roma «på et skib fra Aleksandria som hadde hatt vinterleie ved øen og hadde tvillingene til merke». Første havn var Syrakus: «og vi løp inn til Syrakus og blev der i tre dager». Derfra dro de videre til Regium og til Puteoli."
    - "Under Roma var Syrakus hovedbyen i provinsen Sicilia. Cicero, som førte sak mot guvernøren Verres, mintes at den ble regnet som den største av de greske byene og den vakreste av alle, og sa at den bestod av fire byer, Øya, Achradina, Tyche og Neapolis. Augustus bosatte en koloni av romerske borgere der, og i senere århundrer hogg de kristne i Syrakus omfattende katakomber i berget, blant dem de under kirken San Giovanni. I dag er Siracusa en by på Sicilia i Italia, med den gamle byen på Ortygia; sammen med den nærliggende nekropolen Pantalica ble den tatt opp på UNESCOs verdensarvliste i 2005."
  tl:
    - "Ang Siracusa, sa silangang baybayin ng Sicilia, ay itinatag ng mga mananakop mula sa Corinto sa ilalim ni Arquias, ayon sa pagtutuos ni Tucidides noong 733 BK, sa maliit na pulo ng Ortygia, mula roon ay kumalat ang lunsod sa lupain sa tapat. Naging pinakadakilang lunsod Griego ito ng Sicilia. Ang dakilang ekspedisyong Ateniense noong 415–413 BK, na ipinadala upang supilin ito, ay nagtapos sa pagkawasak ng hukbong-dagat ng Atenas sa daungan nito at ng hukbo sa pag-urong. Sinakop ng Roma ang Siracusa noong 212 BK matapos ang mahabang paglusob kung saan napigil ng mga makina ni Arquimedes ang konsul na si Marcellus; napatay si Arquimedes sa pandarambong."
    - "Pagkaraan ng tatlong buwan sa Malta, naglayag sina Pablo at ang kaniyang mga kasama patungong Roma “sa isang daong Alejandria na tumigil ng tagginaw sa pulo, na ang sagisag ay Ang Magkapatid na Kambal”. Ang unang daungan ay ang Siracusa: “At nang dumaong kami sa Siracusa, ay nagsitigil kami roong tatlong araw.” Mula roon ay nagpatuloy sila sa Regio at sa Puteoli."
    - "Sa ilalim ng Roma, ang Siracusa ang pangunahing lunsod ng lalawigan ng Sicilia. Naalaala ni Cicero, na nagsasakdal sa gobernador nitong si Verres, na ito ay itinuturing na pinakamalaki sa mga lunsod Griego at pinakamaganda sa lahat, at sinasabing binubuo ng apat na bayan, ang Pulo, Achradina, Tyche at Neapolis. Nagtatag si Augusto roon ng kolonya ng mga mamamayang Romano, at sa mga sumunod na siglo, ang mga Kristiyano ng Siracusa ay umukit ng malawak na katakumba sa bato, kabilang ang mga nasa ilalim ng simbahan ng San Giovanni. Ngayon ang Siracusa ay isang lunsod ng Sicilia sa Italia, na ang lumang bayan ay nasa Ortygia; kasama ng kalapit na nekropolis ng Pantalica, isinama ito sa Talaan ng Pamanang Pandaigdig ng UNESCO noong 2005."
  da:
    - "Syrakus, på Siciliens østkyst, blev grundlagt af kolonister fra Korinth under Arkhias, efter Thukydids beregning i 733 f.Kr., på den lille ø Ortygia, hvorfra byen bredte sig over fastlandet overfor. Den blev Siciliens største græske by. Den store athenske ekspedition i 415–413 f.Kr., sendt for at underlægge den, endte med ødelæggelsen af den athenske flåde i dens havn og af hæren under tilbagetoget. Rom indtog Syrakus i 212 f.Kr. efter en lang belejring, hvor Arkimedes' krigsmaskiner holdt konsul Marcellus tilbage; Arkimedes blev dræbt under plyndringen."
    - "Efter tre måneder på Malta sejlede Paulus og hans ledsagere videre mod Rom i »et aleksandrinsk Skib, som havde haft Vinterleje ved Øen og førte Tvillingernes Mærke«. Første havn var Syrakus: »Og vi løb ind til Syrakus, hvor vi bleve tre Dage.« Derfra fortsatte de til Regium og til Puteoli."
    - "Under Rom var Syrakus hovedbyen i provinsen Sicilien. Cicero, der anklagede dens guvernør Verres, mindede om, at den blev regnet for den største af de græske byer og den smukkeste af alle, og at den siges at bestå af fire byer: Øen, Achradina, Tyche og Neapolis. Augustus oprettede en koloni af romerske borgere der, og i de følgende århundreder huggede de kristne i Syrakus omfattende katakomber ind i klippen, blandt dem de under kirken San Giovanni. I dag er Siracusa en by på Sicilien i Italien med sin gamle bydel på Ortygia; sammen med den nærliggende nekropolis Pantalica blev den optaget på UNESCOs verdensarvsliste i 2005."
  sr:
    - "Сиракуза, на источној обали Сицилије, основали су насељеници из Коринта под Архијом, по Тукидидовом рачуну 733. п. н. е., на малом острву Ортигији, одакле се град проширио на копно наспрам. Постала је највећи грчки град на Сицилији. Велика атинска експедиција 415–413. п. н. е., послана да је покори, завршила је уништењем атинске флоте у њеној луци и војске при повлачењу. Рим је заузео Сиракузу 212. п. н. е. после дуге опсаде у којој су Архимедове справе задржавале конзула Марцела; Архимед је погинуо при пљачки."
    - "После три месеца на Мелити, Павле и његови сапутници кренули су даље према Риму „на лађи александријској, која је била презимила на острву, и беху на њој написани Диоскури“. Прва лука била је Сиракуза: „И допловивши у Сиракузу остасмо онде три дана“. Одатле су отишли у Ригију и у Поцуоли."
    - "Под Римом Сиракуза је била главни град провинције Сицилије. Цицерон је, тужећи њеног намесника Вера, подсетио да се сматрала највећим од грчких градова и најлепшим од свих, и да се каже да се састоји од четири града: Острва, Ахрадине, Тихе и Неапоља. Август је онде населио колонију римских грађана, а у каснијим вековима сиракушки хришћани усекли су у стену опсежне катакомбе, међу њима и оне испод цркве Сан Ђовани. Данас је Сиракуза град на Сицилији у Италији, са старим градом на Ортигији; заједно с оближњом некрополом Панталика уписана је на УНЕСКО-ву листу светске баштине 2005."
