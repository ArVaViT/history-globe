body:
  en:
    - "Zereth-shahar, “splendour of the dawn”, was a town of Reuben east of the Dead Sea, listed with Kirjathaim and Sibmah: “And Kirjathaim, and Sibmah, and Zareth-shahar in the mount of the valley”. It is named only here, and its site is uncertain. Easton's Bible Dictionary identified it with the ruins of Zara on the eastern shore of the Dead Sea; the International Standard Bible Encyclopedia was more cautious, hearing a possible echo of the name in Chammat ez-Zara, the hot springs near Machaerus, while holding that no identification was possible. The map sets it at the springs."
    - "The springs of ez-Zara are the Callirrhoe, “beautiful stream”, of Greek and Roman writers. Josephus tells that Herod the Great, mortally ill, went there shortly before his death in 4 BC to bathe in its warm waters, which he describes as sweet enough to drink and flowing into the Dead Sea. Callirrhoe served as the harbour of Machaerus, linked to the fortress by a road of about 8 km, and the sixth-century Madaba mosaic map shows it with a spring house and palm trees. August Strobel excavated it for the German Protestant Institute between 1985 and 1989. It lies today in Jordan."
  ru:
    - "Цереф-Шахар, «блеск зари», — город Рувима к востоку от Мёртвого моря, названный вместе с Кириафаимом и Сивмой: «Кириафаим, Сивма и Цереф-Шахар на горе Емек». Он назван только здесь, и его место не установлено. Библейский словарь Истона отождествлял его с развалинами Зары на восточном берегу Мёртвого моря; Международная стандартная библейская энциклопедия была осторожнее: она слышала возможный отзвук этого имени в Хаммат-эз-Заре — горячих источниках близ Махерона, но считала, что отождествить его нельзя. Карта ставит его у источников."
    - "Источники эз-Зары — это Каллироя, «прекрасный поток», греческих и римских авторов. Иосиф Флавий рассказывает, что Ирод Великий, смертельно больной, незадолго до смерти в 4 г. до н. э. отправился туда купаться в тёплых водах, которые, по его словам, были пресными настолько, что их можно было пить, и стекали в Мёртвое море. Каллироя служила гаванью Махерона, соединённой с крепостью дорогой около 8 км, а Мадабская мозаичная карта VI в. изображает её с источником и пальмами. Аугуст Штробель раскапывал её от Германского евангелического института в 1985–1989 гг. Сегодня это Иордания."
  fr:
    - "Tséreth-Haschachar, « splendeur de l’aurore », était une ville de Ruben à l’est de la mer Morte, citée avec Kirjathaïm et Sibma : « Kirjathaïm, Sibma, Tséreth-Haschachar sur la montagne de la vallée ». Elle n’est nommée qu’ici, et son site est incertain. Easton’s Bible Dictionary l’identifiait avec les ruines de Zara sur la rive orientale de la mer Morte ; l’International Standard Bible Encyclopedia, plus prudente, entendait un écho possible du nom dans Chammat ez-Zara, les sources chaudes près de Machéronte, tout en tenant qu’aucune identification n’était possible. La carte la place aux sources."
    - "Les sources d’ez-Zara sont la Callirrhoé, « belle source », des auteurs grecs et romains. Josèphe raconte qu’Hérode le Grand, gravement malade, s’y rendit peu avant sa mort en 4 av. J.-C. pour se baigner dans ses eaux chaudes, qu’il décrit comme assez douces pour être bues et se jetant dans la mer Morte. Callirrhoé servit de port à Machéronte, reliée à la forteresse par une route d’environ 8 km, et la carte-mosaïque de Madaba du VIe siècle la montre avec une maison de source et des palmiers. August Strobel la fouilla pour l’Institut protestant allemand entre 1985 et 1989. Elle se trouve aujourd’hui en Jordanie."
  it:
    - "Zeret-Saar, «splendore dell’aurora», era una città di Ruben a est del Mar Morto, elencata con Kiriataim e Sibma: «Kiriataim, Sibma, Tsereth-Hashahar sul monte della valle». È nominata solo qui e il suo sito è incerto. L’Easton’s Bible Dictionary la identificò con le rovine di Zara sulla riva orientale del Mar Morto; la International Standard Bible Encyclopedia fu più cauta, sentendo una possibile eco del nome in Chammat ez-Zara, le sorgenti calde presso Macheronte, pur ritenendo impossibile ogni identificazione. La carta la pone alle sorgenti."
    - "Le sorgenti di ez-Zara sono la Calliroe, «bel ruscello», degli scrittori greci e romani. Giuseppe Flavio racconta che Erode il Grande, gravemente malato, vi andò poco prima della morte, nel 4 a.C., per bagnarsi nelle sue acque calde, che descrive come dolci abbastanza da potersi bere e che scorrono nel Mar Morto. Calliroe servì da porto di Macheronte, collegato alla fortezza da una strada di circa 8 km, e la mappa musiva di Madaba, del VI secolo, la mostra con una casa della sorgente e palme. August Strobel la scavò per l’Istituto evangelico tedesco tra il 1985 e il 1989. Oggi si trova in Giordania."
  uk:
    - "Церет-Шахар, «блиск зорі», був містом Рувима на схід від Мертвого моря, згаданим разом із Кіріатаїмом і Сівмою: «Киріатаім, Сивма, і Церет-Сахар на горі Емек». Він названий лише тут, і його місце непевне. «Easton's Bible Dictionary» ототожнював його з руїнами Зара на східному березі Мертвого моря; International Standard Bible Encyclopedia була обережнішою, чуючи можливий відгомін назви в Хаммат-ез-Зара, гарячих джерелах поблизу Махерона, і водночас вважаючи, що ототожнення неможливе. Мапа ставить його біля джерел."
    - "Джерела ез-Зара — це Каллірое, «прекрасний потік», грецьких і римських авторів. Йосиф Флавій розповідає, що Ірод Великий, смертельно хворий, поїхав туди незадовго до смерті 4 р. до н. е. скупатися в його теплих водах, які він описує як досить солодкі, щоб їх пити, і які течуть до Мертвого моря. Каллірое слугувало гаванню Махерона, пов'язаною з фортецею дорогою завдовжки близько 8 км, і мадабська мозаїчна мапа VI ст. показує його з будинком над джерелом і пальмами. Авґуст Штробель розкопував його для Німецького євангельського інституту між 1985 і 1989 рр. Нині воно лежить в Йорданії."
  es:
    - "Zeret-sahar, «esplendor del alba», era una ciudad de Rubén al este del mar Muerto, enumerada con Quiriataim y Sibma: «Y Chîriataim, y Sibma, y Zerethshahar en el monte del valle». Solo se nombra aquí, y su emplazamiento es incierto. El Easton's Bible Dictionary la identificó con las ruinas de Zara en la orilla oriental del mar Muerto; la International Standard Bible Encyclopedia fue más cauta, al oír un posible eco del nombre en Hammat ez-Zara, las aguas termales cercanas a Maqueronte, aunque sostenía que ninguna identificación era posible. El mapa la sitúa en las aguas termales."
    - "Las fuentes de ez-Zara son la Calírroe, «hermosa corriente», de los autores griegos y romanos. Josefo cuenta que Herodes el Grande, gravemente enfermo, fue allí poco antes de su muerte en 4 a. C. para bañarse en sus aguas cálidas, que describe como lo bastante dulces para beberlas y que fluyen al mar Muerto. Calírroe sirvió de puerto de Maqueronte, unido a la fortaleza por un camino de unos 8 km, y el mapa mosaico de Madaba, del siglo VI, la muestra con una casa de manantial y palmeras. August Strobel la excavó para el Instituto Protestante Alemán entre 1985 y 1989. Hoy se encuentra en Jordania."
  nl:
    - "Zereth-Sahar, ‘glans van de dageraad’, was een stad van Ruben ten oosten van de Dode Zee, vermeld met Kirjataïm en Sibma: “En Kirjathaim, en Sibma, en Zeret-Hassahar op den berg des dals”. Het wordt alleen hier genoemd, en de ligging is onzeker. Easton's Bible Dictionary vereenzelvigde het met de ruïnes van Zara aan de oostkust van de Dode Zee; de International Standard Bible Encyclopedia was voorzichtiger, hoorde een mogelijke echo van de naam in Chammat ez-Zara, de warme bronnen bij Machaerus, en hield vol dat geen identificatie mogelijk was. De kaart zet het bij de bronnen."
    - "De bronnen van ez-Zara zijn de Kallirhoe, ‘mooie stroom’, van Griekse en Romeinse schrijvers. Josephus vertelt dat Herodes de Grote, dodelijk ziek, er kort voor zijn dood in 4 v.Chr. heen ging om te baden in het warme water, dat hij beschrijft als zoet genoeg om te drinken en in de Dode Zee stromend. Kallirhoe diende als haven van Machaerus, met de vesting verbonden door een weg van ongeveer 8 km, en de zesde-eeuwse mozaïekkaart van Madaba toont het met een bronhuis en palmbomen. August Strobel groef het tussen 1985 en 1989 op voor het Duitse Protestantse Instituut. Het ligt tegenwoordig in Jordanië."
  pl:
    - "Seret-Haszszachar, „blask jutrzenki”, było miastem Rubena na wschód od Morza Martwego, wymienionym wraz z Kiriataim i Sibmą: „I Karyjataim, i Sebama, i Saratasar na górze w dolinie”. Jest wymienione tylko tu, a jego położenie jest niepewne. Easton's Bible Dictionary utożsamił je z ruinami Zara na wschodnim brzegu Morza Martwego; International Standard Bible Encyclopedia była ostrożniejsza, słysząc możliwe echo nazwy w Chammat az-Zara, gorących źródłach koło Macheronu, przy czym uznawała, że żadne utożsamienie nie jest możliwe. Mapa umieszcza je przy źródłach."
    - "Źródła az-Zara to Kallirhoe, „piękny strumień”, pisarzy greckich i rzymskich. Józef Flawiusz opowiada, że Herod Wielki, śmiertelnie chory, udał się tam krótko przed śmiercią w 4 p.n.e., by kąpać się w jego ciepłych wodach, które opisuje jako dość słodkie, by je pić, i wpadające do Morza Martwego. Kallirhoe służyło jako port Macheronu, połączony z twierdzą drogą o długości około 8 km, a mozaikowa mapa z Madaby z VI wieku pokazuje je z domem przy źródle i palmami. August Strobel badał je dla German Protestant Institute w latach 1985-1989. Leży dziś w Jordanii."
  cs:
    - "Seret-šachar, „nádhera úsvitu“, bylo město Rúbenovo východně od Mrtvého moře, uvedené s Kirjatajimem a Sibmou: „A Kariataim a Sabma, a Saratazar na hoře údolí“. Je jmenováno jen zde a jeho poloha je nejistá. Easton's Bible Dictionary je ztotožnil se zříceninami Zary na východním břehu Mrtvého moře; International Standard Bible Encyclopedia byla opatrnější, slyšela možnou ozvěnu jména v Chammat az-Zára, horkých pramenech poblíž Machairú, ale tvrdila, že žádné ztotožnění není možné. Mapa je klade k pramenům."
    - "Prameny az-Zára jsou Kallirhoé, „krásný potok“, řeckých a římských autorů. Josephus Flavius vypráví, že Herodes Veliký, smrtelně nemocný, se tam krátce před svou smrtí roku 4 př. n. l. vydal koupat v jeho teplých vodách, které popisuje jako dost sladké k pití a tekoucí do Mrtvého moře. Kallirhoé sloužilo jako přístav Machairú, spojený s pevností cestou dlouhou asi 8 km, a madabská mozaiková mapa ze šestého století je zobrazuje s pramennou budovou a palmami. August Strobel je zkoumal pro Německý evangelický ústav v letech 1985 až 1989. Leží dnes v Jordánsku."
  pt:
    - "Zerete-Saar, “esplendor da aurora”, era uma cidade de Rúben a leste do mar Morto, listada com Quiriataim e Sibma: “Quiriataim, Sibma, Zerete-Saar no monte do vale”. É nomeada somente aqui, e seu sítio é incerto. O Easton's Bible Dictionary a identificou com as ruínas de Zara, na margem oriental do mar Morto; a International Standard Bible Encyclopedia foi mais cautelosa, ouvindo um possível eco do nome em Chammat ez-Zara, as fontes termais perto de Maquero, ao mesmo tempo que sustentava que nenhuma identificação era possível. O mapa a coloca nas fontes."
    - "As fontes de ez-Zara são a Calírroe, “belo riacho”, dos escritores gregos e romanos. Josefo conta que Herodes, o Grande, gravemente enfermo, foi ali pouco antes de sua morte, em 4 a.C., para banhar-se em suas águas mornas, que ele descreve como doces o bastante para beber e que corriam para o mar Morto. Calírroe servia de porto de Maquero, ligada à fortaleza por uma estrada de cerca de 8 km, e o mapa de Madaba, do século VI, a mostra com uma casa de fonte e palmeiras. August Strobel a escavou para o Instituto Protestante Alemão entre 1985 e 1989. Fica hoje na Jordânia."
  de:
    - "Zeret-Schahar, „Glanz der Morgenröte“, war eine Stadt Rubens östlich des Toten Meeres, mit Kirjatajim und Sibma aufgeführt: „Kirjathaim, Sibma, Zereth-Sahar auf dem Berge im Tal“. Es wird nur hier genannt, und seine Lage ist ungewiss. Easton's Bible Dictionary setzte es mit den Ruinen von Zara am Ostufer des Toten Meeres gleich; die International Standard Bible Encyclopedia war vorsichtiger, hörte einen möglichen Anklang des Namens in Chammat ez-Zara, den heißen Quellen nahe Machärus, und hielt doch jede Gleichsetzung für unmöglich. Die Karte setzt es an die Quellen."
    - "Die Quellen von ez-Zara sind die Kallirrhoe, „schöner Strom“, griechischer und römischer Schriftsteller. Josephus erzählt, Herodes der Große sei, todkrank, kurz vor seinem Tod im Jahr 4 v. Chr. dorthin gegangen, um in seinem warmen Wasser zu baden, das er als süß genug zum Trinken beschreibt und das ins Tote Meer fließt. Kallirrhoe diente als Hafen von Machärus, durch eine Straße von etwa 8 km mit der Festung verbunden, und die Mosaikkarte von Madaba aus dem sechsten Jahrhundert zeigt es mit einem Quellhaus und Palmen. August Strobel grub es zwischen 1985 und 1989 für das Deutsche Evangelische Institut aus. Es liegt heute in Jordanien."
  sv:
    - "Seret-Hashachar, ”gryningens glans”, var en stad i Ruben öster om Döda havet, upptagen tillsammans med Kirjataim och Sibma: ”Kirjataim, Sibma, Seret-Hassahar på Dalberget”. Den nämns bara här, och dess läge är osäkert. Eastons Bible Dictionary identifierade den med ruinerna av Zara på Döda havets östra strand; International Standard Bible Encyclopedia var försiktigare, hörde ett möjligt eko av namnet i Hammat ez-Zara, de heta källorna nära Machairos, men menade att ingen identifiering var möjlig. Kartan placerar den vid källorna."
    - "Källorna i ez-Zara är Kallirrhoe, ”den sköna källan”, hos grekiska och romerska författare. Josefus berättar att Herodes den store, dödligt sjuk, for dit strax före sin död år 4 f.Kr. för att bada i dess varma vatten, som han beskriver som sött nog att dricka och rinnande ut i Döda havet. Kallirrhoe tjänade som hamn åt Machairos, förbundet med fästningen av en väg på omkring 8 km, och Madabakartan från 500-talet visar den med ett källhus och palmer. August Strobel grävde ut den för Tyska evangeliska institutet mellan 1985 och 1989. Den ligger i dag i Jordanien."
  nb:
    - "Seret-Sjahar, «morgenrødens glans», var en by i Ruben øst for Dødehavet, oppført sammen med Kirjatajim og Sibma: «og Kirjata'im og Sibma og Seret-Hassahar på fjellet i dalen». Den er nevnt bare her, og beliggenheten er usikker. Eastons Bible Dictionary identifiserte den med ruinene av Zara på østbredden av Dødehavet; International Standard Bible Encyclopedia var mer forsiktig og hørte et mulig ekko av navnet i Chammat ez-Zara, de varme kildene nær Machaerus, mens den mente at ingen identifikasjon var mulig. Kartet setter den ved kildene."
    - "Kildene ved ez-Zara er Callirrhoe, «vakker bekk», hos greske og romerske forfattere. Josefus forteller at Herodes den store, dødelig syk, dro dit kort før sin død i 4 f.Kr. for å bade i det varme vannet, som han beskriver som søtt nok til å drikkes og rennende ut i Dødehavet. Callirrhoe tjente som havn for Machaerus, forbundet med festningen med en vei på omkring 8 km, og mosaikkartet fra Madaba fra 500-tallet viser det med et kildehus og palmer. August Strobel utgravde det for Det tyske protestantiske institutt mellom 1985 og 1989. Det ligger i dag i Jordan."
  tl:
    - "Ang Zereth-shahar, “ningning ng bukang-liwayway”, ay bayan ni Ruben sa silangan ng Dagat na Patay, nakatala kasama ng Chiriataim at Sibma: “ang Chiriataim, at ang Sibma, at ang Zereth-shahar, sa bundok ng libis”. Dito lamang ito pinangalanan, at hindi tiyak ang pook. Kinilala ito ng Easton's Bible Dictionary sa mga guho ng Zara sa silangang baybayin ng Dagat na Patay; mas maingat ang International Standard Bible Encyclopedia, na nakarinig ng posibleng alingawngaw ng pangalan sa Chammat ez-Zara, ang mga mainit na bukal malapit sa Machaerus, habang iginigiit na walang pagkakakilanlang posible. Inilalagay ito ng mapa sa mga bukal."
    - "Ang mga bukal ng ez-Zara ay ang Callirrhoe, “magandang agos”, ng mga manunulat na Griego at Romano. Isinasalaysay ni Josefo na si Herodes na Dakila, na may nakamamatay na sakit, ay pumunta roon bago mamatay noong 4 BK upang maligo sa maligamgam nitong tubig, na inilalarawan niyang matamis na sapat na inumin at umaagos sa Dagat na Patay. Nagsilbi ang Callirrhoe na daungan ng Machaerus, na nakaugnay sa kuta ng daang mga 8 km, at ipinakikita ito ng mapang mosaiko ng Madaba noong ika-6 na siglo na may bahay-bukal at mga palma. Hinukay ito ni August Strobel para sa Institutong Protestante ng Alemanya noong 1985–1989. Nasa Jordan ito ngayon."
  da:
    - "Seret-Hasjahar, »morgenrødens glans«, var en by i Ruben øst for Dødehavet, opført sammen med Kirjatajim og Sibma: »Kirjathaim og Sibma og Zereth-Sahar paa Dalens Bjerg«. Den nævnes kun her, og dens sted er usikkert. Easton's Bible Dictionary identificerede den med ruinerne af Zara på Dødehavets østlige bred; International Standard Bible Encyclopedia var mere forsigtig, hørte et muligt ekko af navnet i Chammat ez-Zara, de varme kilder nær Machaerus, men fastholdt, at ingen identifikation var mulig. Kortet placerer den ved kilderne."
    - "Ez-Zara-kilderne er Kallirrhoe, »den smukke strøm«, hos græske og romerske forfattere. Josephus fortæller, at Herodes den Store, dødssyg, tog derhen kort før sin død i 4 f.Kr. for at bade i dets varme vand, som han beskriver som sødt nok til at drikke og flydende ud i Dødehavet. Kallirrhoe tjente som Machaerus' havn, forbundet med fæstningen med en vej på omkring 8 km, og Madaba-mosaikkortet fra 500-tallet viser den med et kildehus og palmer. August Strobel udgravede den for det tyske protestantiske institut mellem 1985 og 1989. Den ligger i dag i Jordan."
scripture:
  - Josh.13.19
