# Overview article (ADR 0007). Zereth-shahar of Reuben is uncertain: Easton identified it with the ruins of Zara on the Dead Sea shore; the ISBE only heard an echo of the name in Chammat ez-Zara (the hot springs, Callirrhoe), the map's point, and held no identification possible. Callirrhoe's history follows Josephus and Strobel's excavations.
id: zereth-shahar
place: a31a510
title:
  en: "Zereth-shahar"
  ru: "Цереф-Шахар"
