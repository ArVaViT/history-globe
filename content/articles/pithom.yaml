body:
  en:
    - "Pithom renders the Egyptian Per-Atum, “house of Atum”, the sun god of Heliopolis. It lay in the Wadi Tumilat, the valley running east from the Nile Delta towards Lake Timsah, which the Egyptians called Tjeku. Two mounds there are put forward. In 1883 Édouard Naville dug at Tell el-Maskhuta, found inscriptions naming Per-Atum and brick storehouses, and identified it as Pithom; Flinders Petrie and later John Holladay agreed. Alan Gardiner proposed Tell er-Retaba, 13 km further west, and Manfred Bietak and Kenneth Kitchen have argued for it, because Holladay's excavations of 1978–1985 found at el-Maskhuta a Hyksos-period village and then a town founded only about 600 BC, with almost nothing of the New Kingdom. Both mounds lie in the Ismailia governorate of Egypt, west of Ismailia."
    - "Exodus names Pithom as one of the cities the Israelites were forced to build: “Therefore they did set over them taskmasters to afflict them with their burdens. And they built for Pharaoh treasure cities, Pithom and Raamses.” The Greek Bible adds a third city, “and On, which is Heliopolis”, and the Synodal translation follows it. Pithom is not named again in the Bible."
    - "A papyrus of the reign of Merneptah, Papyrus Anastasi VI, reports that Shasu tribes of Edom were let through the fortress of Merneptah in Tjeku “to the pools of Per-Atum” to keep themselves and their herds alive. Herodotus says that the canal begun by Necho II from the Nile to the Red Sea passed “by Patumos, the Arabian city”; that canal ran through the Wadi Tumilat, and the Saite town at el-Maskhuta grew up beside it. Petrie dug at Tell er-Retaba for one season in 1905, and since 2007 a Polish-Slovak mission has uncovered there a series of New Kingdom fortresses, with walls of the time of Ramesses II and Ramesses III. Many scholars therefore hold that the name Pithom belonged to er-Retaba in the Ramesside period and passed to el-Maskhuta later."
  ru:
    - "Пифом передаёт египетское Пер-Атум, «дом Атума», бога солнца Гелиополя. Он лежал в Вади-Тумилат, долине, идущей от Дельты Нила на восток к озеру Тимсах, которую египтяне называли Чеку. Предлагают два холма. В 1883 г. Эдуар Навиль копал на Телль-эль-Масхута, нашёл надписи с именем Пер-Атум и кирпичные хранилища и отождествил его с Пифомом; с ним согласились Флиндерс Питри, а позднее Джон Холладей. Алан Гардинер предложил Телль-эр-Ретаба, в 13 км западнее, и за него выступают Манфред Битак и Кеннет Китчен, потому что раскопки Холладея 1978–1985 гг. нашли на эль-Масхута поселение времени гиксосов, а затем город, основанный лишь около 600 г. до н. э., почти без слоёв Нового царства. Оба холма лежат в мухафазе Исмаилия в Египте, к западу от Исмаилии."
    - "Книга Исход называет Пифом одним из городов, которые израильтян заставили строить: «И поставили над ним начальников работ, чтобы изнуряли его тяжкими работами. И он построил фараону Пифом и Раамсес, города для запасов». Греческая Библия прибавляет третий город — Он, то есть Илиополь, — и Синодальный перевод следует ей: «и Он, иначе Илиополь». Больше Пифом в Библии не упоминается."
    - "Папирус времени Мернептаха, Анастази VI, сообщает, что шасу из Едома пропустили через крепость Мернептаха в Чеку «к прудам Пер-Атума», чтобы сохранить жизнь им и их стадам. Геродот пишет, что канал из Нила в Красное море, начатый Нехо II, проходил мимо «Патума, аравийского города»; этот канал шёл через Вади-Тумилат, и саисский город на эль-Масхута вырос рядом с ним. Питри провёл на Телль-эр-Ретаба один сезон раскопок в 1905 г., а с 2007 г. польско-словацкая экспедиция открыла там ряд крепостей Нового царства со стенами времени Рамсеса II и Рамсеса III. Поэтому многие учёные считают, что имя Пифом в эпоху Рамессидов принадлежало эр-Ретабе и лишь позже перешло к эль-Масхута."
  uk:
    - "Пітом передає єгипетське Пер-Атум, «дім Атума», бога сонця Геліополя. Він лежав у Ваді-Тумілат, долині, що йде на схід від дельти Нілу до озера Тімсах, яке єгиптяни називали Тджеку. Називають два пагорби. 1883 р. Едуар Навіль копав на Телль-ель-Маскгуті, знайшов написи з Пер-Атум і цегляні комори й визначив його як Пітом; Флундерс Петрі та пізніше Джон Голладей погодилися. Алан Гардінер запропонував Телль-ер-Ретабу, за 13 км далі на захід, і Манфред Бітак та Кеннет Кітчен обстоюють його, бо розкопки Голладея 1978–1985 рр. виявили в ель-Маскгуті гіксоське селище, а потім місто, засноване лише близько 600 р. до н. е., майже без залишків Нового царства. Обидва пагорби лежать у мухафазі Ісмаїлія в Єгипті, на захід від Ісмаїлії."
    - "Вихід називає Пітом одним із міст, які ізраїльтяни були змушені будувати: «І поставлено над ними приставникїв в роботї, щоб їх мучили паньщиною своєю; і збудували вони харчові городи Фараонові: Питом і Раємзес.» Грецька Біблія додає третє місто, «і Он, що є Геліополь», і синодальний переклад іде за нею. Пітом більше не згадується в Біблії."
    - "Папірус часів Мернептаха, Папірус Анастасі VI, повідомляє, що племена шасу з Едому пропустили крізь фортецю Мернептаха в Тджеку «до ставків Пер-Атума», щоб зберегти життя собі й своїм стадам. Геродот каже, що канал, розпочатий Нехо II від Нілу до Червоного моря, проходив «повз Патумос, арабське місто»; цей канал ішов через Ваді-Тумілат, і сайське місто в ель-Маскгуті виросло поряд із ним. Петрі копав у Телль-ер-Ретабі один сезон 1905 р., а від 2007 р. польсько-словацька місія відкрила там низку фортець Нового царства зі стінами часів Рамсеса II і Рамсеса III. Тому багато вчених вважають, що назва Пітом належала ер-Ретабі в рамессидський період і пізніше перейшла на ель-Маскгуту."
  es:
    - "Pitón es la forma que toma el egipcio Per-Atum, «casa de Atum», el dios solar de Heliópolis. Se encontraba en el Wadi Tumilat, el valle que va hacia el este desde el Delta del Nilo en dirección al lago Timsah, que los egipcios llamaban Tjeku. Se proponen dos montículos. En 1883 Édouard Naville excavó en Tell el-Maskhuta, halló inscripciones que nombran Per-Atum y almacenes de ladrillo, y lo identificó como Pitón; Flinders Petrie y más tarde John Holladay estuvieron de acuerdo. Alan Gardiner propuso Tell er-Retaba, 13 km más al oeste, y Manfred Bietak y Kenneth Kitchen lo han defendido, porque las excavaciones de Holladay de 1978–1985 hallaron en el-Maskhuta una aldea de época hicsa y luego una ciudad fundada solo hacia 600 a. C., con casi nada del Reino Nuevo. Ambos montículos están en la gobernación de Ismailía, en Egipto, al oeste de Ismailía."
    - "Éxodo nombra Pitón como una de las ciudades que los israelitas fueron obligados a construir: «Entonces pusieron sobre él comisarios de tributos que los molestasen con sus cargas; y edificaron á Faraón las ciudades de los bastimentos, Phithom y Raamses». La Biblia griega añade una tercera ciudad, «y On, que es Heliópolis», y la traducción sinodal la sigue. Pitón no vuelve a nombrarse en la Biblia."
    - "Un papiro del reinado de Merenptah, el Papiro Anastasi VI, informa de que a tribus shasu de Edom se les dejó pasar por la fortaleza de Merenptah en Tjeku «hasta los estanques de Per-Atum» para mantener con vida a ellos y a sus rebaños. Heródoto dice que el canal iniciado por Necao II del Nilo al mar Rojo pasaba «por Patumos, la ciudad arábiga»; ese canal atravesaba el Wadi Tumilat, y la ciudad saíta de el-Maskhuta creció junto a él. Petrie excavó en Tell er-Retaba una sola campaña en 1905, y desde 2007 una misión polaco-eslovaca ha sacado a la luz allí una serie de fortalezas del Reino Nuevo, con muros de la época de Ramsés II y Ramsés III. Por ello muchos estudiosos sostienen que el nombre de Pitón correspondió a er-Retaba en el período ramésida y pasó más tarde a el-Maskhuta."
  pt:
    - "Pitom reproduz o egípcio Per-Atum, “casa de Atum”, o deus-sol de Heliópolis. Ficava no uádi Tumilat, o vale que corre para o leste a partir do delta do Nilo em direção ao lago Timsah, que os egípcios chamavam Tjeku. Dois montículos ali são propostos. Em 1883 Édouard Naville escavou em Tell el-Maskhuta, encontrou inscrições com o nome Per-Atum e armazéns de tijolos, e o identificou como Pitom; Flinders Petrie e, mais tarde, John Holladay concordaram. Alan Gardiner propôs Tell er-Retaba, 13 km mais a oeste, e Manfred Bietak e Kenneth Kitchen o defenderam, porque as escavações de Holladay de 1978–1985 encontraram em el-Maskhuta uma aldeia do período hicso e depois uma cidade fundada somente por volta de 600 a.C., com quase nada do Novo Império. Ambos os montículos ficam na governadoria de Ismaília, no Egito, a oeste de Ismaília."
    - "Êxodo menciona Pitom como uma das cidades que os israelitas foram forçados a construir: “Portanto, colocaram sobre eles feitores para afligi-los com seus fardos. Eles construíram cidades-armazéns para o Faraó: Pitom e Ramsés.” A Bíblia grega acrescenta uma terceira cidade, On, isto é, Heliópolis, e a tradução sinodal a segue. Pitom não é mencionada de novo na Bíblia."
    - "Um papiro do reinado de Merneptá, o Papiro Anastasi VI, relata que tribos shasu de Edom foram deixadas passar pela fortaleza de Merneptá em Tjeku “até as lagoas de Per-Atum” para manter vivos a si mesmas e seus rebanhos. Heródoto diz que o canal iniciado por Neco II do Nilo ao mar Vermelho passava “por Patumos, a cidade árabe”; esse canal atravessava o uádi Tumilat, e a cidade saíta de el-Maskhuta cresceu ao seu lado. Petrie escavou em Tell er-Retaba por uma temporada em 1905, e desde 2007 uma missão polaco-eslovaca revelou ali uma série de fortalezas do Novo Império, com muros do tempo de Ramsés II e Ramsés III. Muitos estudiosos sustentam, portanto, que o nome Pitom pertenceu a er-Retaba no período ramséssida e passou depois a el-Maskhuta."
  de:
    - "Pitom gibt das ägyptische Per-Atum wieder, „Haus des Atum“, des Sonnengottes von Heliopolis. Es lag im Wadi Tumilat, dem Tal, das vom Nildelta nach Osten zum Timsahsee führt, den die Ägypter Tjeku nannten. Zwei Hügel dort werden vorgeschlagen. 1883 grub Édouard Naville in Tell el-Maschuta, fand Inschriften, die Per-Atum nennen, und Ziegelspeicher und bestimmte ihn als Pitom; Flinders Petrie und später John Holladay stimmten zu. Alan Gardiner schlug Tell er-Retaba vor, 13 km weiter westlich, und Manfred Bietak und Kenneth Kitchen sind dafür eingetreten, weil Holladays Grabungen von 1978–1985 in el-Maschuta ein Dorf der Hyksoszeit und dann eine erst um 600 v. Chr. gegründete Stadt fanden, mit fast nichts aus dem Neuen Reich. Beide Hügel liegen im Gouvernement Ismailia in Ägypten, westlich von Ismailia."
    - "Das Buch Exodus nennt Pitom als eine der Städte, die die Israeliten bauen mussten: „Und man setzte Fronvögte über sie, die sie mit schweren Diensten drücken sollten; denn man baute dem Pharao die Städte Pithon und Raemses zu Vorratshäusern.“ Die griechische Bibel fügt eine dritte Stadt hinzu, On, das ist Heliopolis, und die Synodalübersetzung folgt ihr. Pitom wird in der Bibel nicht wieder genannt."
    - "Ein Papyrus aus der Regierungszeit Merenptahs, Papyrus Anastasi VI, berichtet, dass Schasu-Stämme aus Edom durch die Festung Merenptahs in Tjeku „zu den Teichen von Per-Atum“ eingelassen wurden, um sich und ihre Herden am Leben zu erhalten. Herodot sagt, der von Necho II. begonnene Kanal vom Nil zum Roten Meer führe „bei Patumos, der arabischen Stadt“ vorbei; dieser Kanal verlief durch das Wadi Tumilat, und die saitische Stadt in el-Maschuta entstand neben ihm. Petrie grub 1905 eine Saison lang in Tell er-Retaba, und seit 2007 hat eine polnisch-slowakische Mission dort eine Reihe von Festungen des Neuen Reiches freigelegt, mit Mauern aus der Zeit Ramses' II. und Ramses' III. Viele Gelehrte halten daher den Namen Pitom in der Ramessidenzeit für den von er-Retaba, der später auf el-Maschuta überging."
  fr:
    - "Pithom rend l’égyptien Per-Atoum, « maison d’Atoum », le dieu solaire d’Héliopolis. Elle se trouvait dans l’ouadi Toumilat, la vallée qui court vers l’est depuis le delta du Nil en direction du lac Timsah, que les Égyptiens appelaient Tjékou. Deux buttes y sont proposées. En 1883, Édouard Naville fouilla à Tell el-Maskhouta, y trouva des inscriptions nommant Per-Atoum et des magasins de briques, et l’identifia à Pithom ; Flinders Petrie et plus tard John Holladay en convinrent. Alan Gardiner proposa Tell er-Retaba, à 13 km plus à l’ouest, et Manfred Bietak et Kenneth Kitchen l’ont défendue, parce que les fouilles de Holladay en 1978–1985 ont livré à el-Maskhouta un village de l’époque hyksôs puis une ville fondée seulement vers 600 av. J.-C., avec presque rien du Nouvel Empire. Les deux buttes se trouvent dans le gouvernorat d’Ismaïlia, à l’ouest d’Ismaïlia."
    - "L’Exode nomme Pithom parmi les villes que les Israélites furent forcés de bâtir : « Et l’on établit sur lui des chefs de corvées, afin de l’accabler de travaux pénibles. C’est ainsi qu’il bâtit les villes de Pithom et de Ramsès, pour servir de magasins à Pharaon. » La Bible grecque ajoute une troisième ville, « et On, qui est Héliopolis », et la traduction synodale la suit. Pithom n’est plus nommée dans la Bible."
    - "Un papyrus du règne de Merenptah, le papyrus Anastasi VI, rapporte que des tribus shasou d’Édom furent laissées passer par la forteresse de Merenptah à Tjékou « jusqu’aux bassins de Per-Atoum » pour faire survivre leurs personnes et leurs troupeaux. Hérodote dit que le canal commencé par Néchao II depuis le Nil jusqu’à la mer Rouge passait « près de Patoumos, la ville d’Arabie » ; ce canal traversait l’ouadi Toumilat, et la ville saïte d’el-Maskhouta grandit à côté de lui. Petrie fouilla à Tell er-Retaba pendant une saison en 1905, et depuis 2007 une mission polono-slovaque y a mis au jour une série de forteresses du Nouvel Empire, avec des murs du temps de Ramsès II et de Ramsès III. Beaucoup d’exégètes tiennent donc que le nom de Pithom appartenait à er-Retaba à l’époque ramesside et passa plus tard à el-Maskhouta."
  it:
    - "Pitom rende l’egizio Per-Atum, «casa di Atum», il dio sole di Eliopoli. Sorgeva nel Wadi Tumilat, la valle che corre a est dal Delta del Nilo verso il lago Timsah, che gli Egizi chiamavano Tjeku. Sono proposti due tell. Nel 1883 Édouard Naville scavò a Tell el-Maskhuta, trovò iscrizioni che nominano Per-Atum e magazzini di mattoni, e lo identificò con Pitom; Flinders Petrie e più tardi John Holladay concordarono. Alan Gardiner propose Tell er-Retaba, 13 km più a ovest, e Manfred Bietak e Kenneth Kitchen l’hanno sostenuto, perché gli scavi di Holladay del 1978–1985 trovarono a el-Maskhuta un villaggio dell’epoca hyksos e poi una città fondata solo verso il 600 a.C., con quasi nulla del Nuovo Regno. Entrambi i tell si trovano nel governatorato di Ismailia, in Egitto, a ovest di Ismailia."
    - "L’Esodo nomina Pitom come una delle città che gli Israeliti furono costretti a costruire: «Stabilirono dunque sopra Israele de’ soprastanti ai lavori, che l’opprimessero con le loro angherie. Ed esso edificò a Faraone le città di approvvigionamento, Pithom e Raamses». La Bibbia greca aggiunge una terza città, «e On, che è Eliopoli», e la traduzione sinodale la segue. Pitom non è più nominata nella Bibbia."
    - "Un papiro del regno di Merenptah, il Papiro Anastasi VI, riferisce che tribù shasu di Edom furono lasciate passare per la fortezza di Merenptah a Tjeku «alle pozze di Per-Atum» per mantenere in vita sé stesse e le loro greggi. Erodoto dice che il canale iniziato da Necao II dal Nilo al Mar Rosso passava «presso Patumo, la città araba»; quel canale correva attraverso il Wadi Tumilat, e la città saitica di el-Maskhuta sorse accanto ad esso. Petrie scavò a Tell er-Retaba per una stagione nel 1905, e dal 2007 una missione polacco-slovacca vi ha portato alla luce una serie di fortezze del Nuovo Regno, con mura dell’epoca di Ramses II e Ramses III. Molti studiosi ritengono perciò che il nome Pitom appartenesse a er-Retaba nel periodo ramesside e sia passato più tardi a el-Maskhuta."
  nl:
    - "Pitom geeft het Egyptische Per-Atum weer, ‘huis van Atum’, de zonnegod van Heliopolis. Het lag in de Wadi Tumilat, het dal dat vanuit de Nijldelta oostwaarts naar het Timsahmeer loopt, dat de Egyptenaren Tjeku noemden. Twee heuvels worden daarvoor voorgesteld. In 1883 groef Édouard Naville bij Tell el-Maskhuta, vond inscripties met de naam Per-Atum en bakstenen opslagplaatsen, en vereenzelvigde de heuvel met Pitom; Flinders Petrie en later John Holladay stemden in. Alan Gardiner stelde Tell er-Retaba voor, 13 km verder westwaarts, en Manfred Bietak en Kenneth Kitchen hebben ervoor gepleit, omdat Holladays opgravingen van 1978–1985 bij el-Maskhuta een dorp uit de Hyksostijd en daarna een stad aantroffen die pas omstreeks 600 v.Chr. werd gesticht, met vrijwel niets uit het Nieuwe Rijk. Beide heuvels liggen in het gouvernement Ismailia in Egypte, ten westen van Ismailia."
    - "Exodus noemt Pitom als een van de steden die de Israëlieten gedwongen werden te bouwen: “En zij zetten oversten der schattingen over hetzelve, om het te verdrukken met hun lasten; want men bouwde voor Farao schatsteden, Pitom en Raamses.” De Griekse Bijbel voegt een derde stad toe, “en On, dat is Heliopolis”, en de Synodale vertaling volgt die lezing. Pitom wordt elders in de Bijbel niet meer genoemd."
    - "Een papyrus uit de regering van Merenptah, Papyrus Anastasi VI, meldt dat Shasu-stammen van Edom door de vesting van Merenptah in Tjeku werden doorgelaten “naar de vijvers van Per-Atum” om zichzelf en hun kudden in leven te houden. Herodotus zegt dat het kanaal dat Necho II van de Nijl naar de Rode Zee begon te graven “bij Patumos, de Arabische stad” voorbijging; dat kanaal liep door de Wadi Tumilat, en de Saïtische stad bij el-Maskhuta ontstond ernaast. Petrie groef in 1905 één seizoen bij Tell er-Retaba, en sinds 2007 heeft een Pools-Slowaakse missie daar een reeks vestingen uit het Nieuwe Rijk blootgelegd, met muren uit de tijd van Ramses II en Ramses III. Veel geleerden menen daarom dat de naam Pitom in de Ramessidische tijd bij er-Retaba hoorde en later op el-Maskhuta overging."
  pl:
    - "Pitom oddaje egipskie Per-Atum, „dom Atuma”, boga słońca z Heliopolis. Leżało w Wadi Tumilat, dolinie biegnącej na wschód od Delty Nilu ku jezioru Timsah, które Egipcjanie nazywali Tjeku. Proponuje się dwa wzgórza. W 1883 roku Édouard Naville prowadził wykopaliska w Tell el-Maskhuta, znalazł inskrypcje z nazwą Per-Atum i ceglane magazyny i uznał je za Pitom; zgodzili się z nim Flinders Petrie, a później John Holladay. Alan Gardiner zaproponował Tell er-Retaba, 13 km dalej na zachód, a Manfred Bietak i Kenneth Kitchen opowiedzieli się za nim, ponieważ wykopaliska Holladaya z lat 1978-1985 odsłoniły w el-Maskhuta wieś z okresu Hyksosów, a potem miasto założone dopiero około 600 p.n.e., prawie bez śladów Nowego Państwa. Oba wzgórza leżą w muhafazie Ismailia w Egipcie, na zachód od Ismailii."
    - "Księga Wyjścia wymienia Pitom jako jedno z miast, które Izraelici musieli budować: „A tak ustawili nad nimi poborcę, aby go dręczyli ciężarami swemi; i zbudował lud Izraelski miasta składu Faraonowi: Pytom i Rameses”. Biblia grecka dodaje trzecie miasto, On, czyli Heliopolis, a przekład synodalny idzie za nią. Pitom nie jest w Biblii wymieniony ponownie."
    - "Papirus z czasów Merenptaha, Papirus Anastasi VI, donosi, że plemiona Szasu z Edomu przepuszczono przez twierdzę Merenptaha w Tjeku „do sadzawek Per-Atum”, by utrzymać przy życiu siebie i swoje stada. Herodot pisze, że kanał rozpoczęty przez Nekona II od Nilu do Morza Czerwonego przebiegał „przy Patumos, mieście arabskim”; kanał ten biegł przez Wadi Tumilat, a saickie miasto w el-Maskhuta wyrosło obok niego. Petrie prowadził prace w Tell er-Retaba przez jeden sezon w 1905 roku, a od 2007 roku misja polsko-słowacka odsłoniła tam szereg twierdz Nowego Państwa, z murami z czasów Ramzesa II i Ramzesa III. Wielu uczonych uważa więc, że nazwa Pitom należała do er-Retaba w okresie ramessydzkim i później przeszła na el-Maskhuta."
  cs:
    - "Pitom vyjadřuje egyptské Per-Atum, „dům Atumův“, slunečního boha Héliopole. Leželo ve Wádí Tumílát, údolí vedoucím z nilské delty na východ k jezeru Timsáh, které Egypťané nazývali Čeku. Navrhují se tam dva pahorky. V roce 1883 kopal Édouard Naville v Tell el-Maschúta, nalezl nápisy jmenující Per-Atum a cihlové sklady a ztotožnil jej s Pitomem; Flinders Petrie a později John Holladay souhlasili. Alan Gardiner navrhl Tell er-Retába, o 13 km dále na západ, a Manfred Bietak i Kenneth Kitchen se za něj zasazují, protože Holladayovy vykopávky z let 1978–1985 nalezly v el-Maschúta vesnici z doby Hyksósů a poté město založené teprve kolem roku 600 př. n. l., s téměř ničím z Nové říše. Oba pahorky leží v guvernorátu Ismá'ílíja v Egyptě, západně od Ismá'ílíje."
    - "Exodus jmenuje Pitom jako jedno z měst, která museli Izraelci stavět: „Protož ustanovili nad ním úředníky, kteříž by plat vybírali, aby je trápili břemeny svými. I vystavěl lid Izraelský Faraonovi města skladů, Fiton a Ramesses.“ Řecká Bible dodává třetí město, „a On, což je Héliopolis“, a synodální překlad ji následuje. Pitom není v Bibli jmenován znovu."
    - "Papyrus z doby Merenptahovy, Papyrus Anastasi VI, hlásí, že kmeny Šasuů z Edómu byly propuštěny pevností Merenptahovou v Čeku „k jezerům Per-Atum“, aby udržely při životě sebe a svá stáda. Hérodotos říká, že průplav zahájený Nekóem II. z Nilu k Rudému moři vedl „podle Patumu, arabského města“; tento průplav procházel Wádí Tumílát a sajské město v el-Maschúta vyrostlo vedle něj. Petrie kopal v Tell er-Retába jednu sezónu roku 1905 a od roku 2007 odkrývá polsko-slovenská mise řadu pevností Nové říše se zdmi z doby Ramesse II. a Ramesse III. Mnozí badatelé proto soudí, že jméno Pitom patřilo v ramessovské době Retábě a později přešlo na el-Maschútu."
  sv:
    - "Pitom återger egyptiska Per-Atum, ”Atums hus”, solguden från Heliopolis. Det låg i Wadi Tumilat, dalen som löper österut från Nildeltat mot Timsahsjön, som egyptierna kallade Tjeku. Två kullar föreslås där. År 1883 grävde Édouard Naville vid Tell el-Maskhuta, fann inskriptioner som nämner Per-Atum och förrådshus av tegel, och identifierade det som Pitom; Flinders Petrie och senare John Holladay höll med. Alan Gardiner föreslog Tell er-Retaba, 13 km längre väster, och Manfred Bietak och Kenneth Kitchen har argumenterat för det, eftersom Holladays utgrävningar 1978–1985 fann vid el-Maskhuta en by från hyksostid och därefter en stad grundad först omkring 600 f.Kr., med nästan ingenting från Nya riket. Båda kullarna ligger i guvernementet Ismailia i Egypten, väster om Ismailia."
    - "Andra Mosebok nämner Pitom som en av städerna israeliterna tvingades bygga: ”Alltså satte man arbetsfogdar över dem och förtryckte dem med trälarbeten. Och de måste bygga åt Farao förrådsstäder, Pitom och Raamses.” Den grekiska bibeln lägger till en tredje stad, ”och On, det är Heliopolis”, och den synodala översättningen följer den. Pitom nämns inte igen i Bibeln."
    - "En papyrus från Merneptahs tid, Papyrus Anastasi VI, rapporterar att shasu-stammar från Edom släpptes igenom Merneptahs fästning i Tjeku ”till Per-Atums dammar” för att hålla sig själva och sina hjordar vid liv. Herodotos säger att kanalen som Neko II började gräva från Nilen till Röda havet gick ”förbi Patumos, den arabiska staden”; den kanalen löpte genom Wadi Tumilat, och den saitiska staden vid el-Maskhuta växte upp bredvid den. Petrie grävde vid Tell er-Retaba under en säsong 1905, och sedan 2007 har en polsk-slovakisk mission frilagt där en rad fästningar från Nya riket, med murar från Ramses II:s och Ramses III:s tid. Många forskare menar därför att namnet Pitom tillhörde er-Retaba under ramessidtiden och övergick till el-Maskhuta senare."
  nb:
    - "Pitom gjengir det egyptiske Per-Atum, «Atums hus», solguden i Heliopolis. Det lå i Wadi Tumilat, dalen som løper østover fra Nildeltaet mot Timsah-sjøen, som egypterne kalte Tjeku. To hauger fremmes. I 1883 gravde Édouard Naville ved Tell el-Maskhuta, fant inskripsjoner som nevner Per-Atum og lagerhus av murstein, og identifiserte det som Pitom; Flinders Petrie og senere John Holladay var enige. Alan Gardiner foreslo Tell er-Retaba, 13 km lenger vest, og Manfred Bietak og Kenneth Kitchen har argumentert for det, fordi Holladays utgravninger i 1978–1985 fant ved el-Maskhuta en hyksos-tidens landsby og så en by grunnlagt først omkring 600 f.Kr., med nesten ingenting fra Det nye riket. Begge haugene ligger i det egyptiske guvernementet Ismailia, vest for Ismailia."
    - "2. Mosebok nevner Pitom som en av byene israelittene ble tvunget til å bygge: «Så satte de arbeidsfogder over dem til å plage dem med tvangsarbeid; og de måtte bygge for Farao to byer til oplagssteder, Pitom og Ra'amses.» Den greske bibelen legger til en tredje by, «og On, som er Heliopolis», og den synodale oversettelsen følger den. Pitom er ikke nevnt igjen i Bibelen."
    - "En papyrus fra Merneptahs regjeringstid, Papyrus Anastasi VI, melder at shasu-stammer fra Edom ble sluppet gjennom Merneptahs festning i Tjeku «til Per-Atums dammer» for å holde seg selv og hjordene i live. Herodot sier at kanalen Necho II begynte å grave fra Nilen til Rødehavet gikk «forbi Patumos, den arabiske byen»; den kanalen gikk gjennom Wadi Tumilat, og den saittiske byen ved el-Maskhuta vokste opp ved siden av den. Petrie gravde ved Tell er-Retaba én sesong i 1905, og siden 2007 har en polsk-slovakisk misjon avdekket en rekke festninger fra Det nye riket der, med murer fra Ramses II og Ramses III. Mange forskere mener derfor at navnet Pitom hørte til er-Retaba i ramessidetiden og senere gikk over til el-Maskhuta."
  tl:
    - "Isinasalin ng Phithom ang Egipcio na Per-Atum, “bahay ni Atum”, ang diyos ng araw ng Heliopolis. Nasa Wadi Tumilat ito, ang libis na tumatakbo silangan mula sa Delta ng Nilo patungong Lawa ng Timsah, na tinawag ng mga Egipcio na Tjeku. Dalawang burol ang iminumungkahi. Noong 1883, humukay si Édouard Naville sa Tell el-Maskhuta, nakatagpo ng inskripsiyong may Per-Atum at imbakan ng laryo, at kinilala itong Phithom; sumang-ayon sina Flinders Petrie at kalaunan si John Holladay. Iminungkahi ni Alan Gardiner ang Tell er-Retaba, 13 km pa sa kanluran, at ipinagtanggol nina Manfred Bietak at Kenneth Kitchen, dahil natagpuan ni Holladay noong 1978–1985 sa el-Maskhuta ang nayon ng panahong Hyksos at bayang itinatag lamang mga 600 BK, halos walang labi ng Bagong Kaharian. Nasa gobernorato ng Ismailia ng Egipto ang dalawang burol, kanluran ng Ismailia."
    - "Pinangangalanan ng Exodo ang Phithom bilang isa sa mga lungsod na pinilit na itayo ng mga Israelita: “nangaglagay sila ng mga tagapagpaatag, upang dalamhatiin sila sa atang sa kanila. At kanilang ipinagtayo si Faraon ng mga bayan na kamaligan, na dili iba't ang Phithom at Raamses.” Nagdaragdag ang Bibliyang Griyego ng ikatlong lungsod, “at On, na siyang Heliopolis”, at sinusundan ito ng saling Sinodal. Hindi na muling pinangalanan ang Phithom sa Bibliya."
    - "Iniulat ng isang papiro noong paghahari ni Merneptah, ang Papyrus Anastasi VI, na pinadaan ang mga tribong Shasu ng Edom sa kuta ni Merneptah sa Tjeku “sa mga tipunan ng tubig ng Per-Atum” upang mabuhay sila at ang kanilang mga kawan. Sinasabi ni Herodotus na ang kanal na sinimulan ni Necho II mula sa Nilo hanggang sa Dagat na Pula ay dumaan “sa Patumos, ang lungsod ng Arabia”; dumaan ang kanal sa Wadi Tumilat, at lumago sa tabi nito ang bayang Saite sa el-Maskhuta. Humukay si Petrie sa Tell er-Retaba nang isang panahon noong 1905, at mula 2007 ay naglantad doon ang isang misyon ng Poland at Slovakia ng serye ng mga kutang Bagong Kaharian, na may mga pader noong panahon nina Ramesses II at Ramesses III. Kaya marami ang naniniwalang pag-aari ng er-Retaba ang pangalang Phithom noong panahong Ramesside at kalaunan lamang napunta sa el-Maskhuta."
