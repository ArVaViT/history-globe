body:
  en:
    - "Kittim, Chittim in the King James Version, takes its name from Kition, the Phoenician city on the south coast of Cyprus where Larnaca now stands; Josephus says the island was called Chethima, now Cyprus, and that Citium kept the old name, and Hebrew ostraca from Arad around 600 BC mention “Kittim” serving in the Judean army, probably Greek or Cypriot mercenaries. In the table of nations Kittim is a son of Javan, and the word came to mean the islands and coasts of the west in general. In the two verses this place stands for, ships come from there. Balaam’s last oracle foresees that “ships shall come from the coast of Chittim, and shall afflict Asshur, and shall afflict Eber, and he also shall perish for ever”, and in Daniel’s vision of the king of the north, “the ships of Chittim shall come against him: therefore he shall be grieved, and return”."
    - "Readers have long matched Daniel’s words to the summer of 168 BC, when Antiochus IV, marching on Alexandria, was met by the Roman envoy Popillius Laenas, who drew a circle round him in the sand and made him promise to leave Egypt before he stepped out of it; Polybius and Livy tell the story, and the Old Greek translation of Daniel already reads “Romans” here. The Dead Sea Scrolls likewise use Kittim for the western conquerors, most often taken as the Romans. Cyprus itself has its own article; Kition is today a quarter of Larnaca, with the remains of its temples and harbour."
  ru:
    - "Киттим получил имя от Китиона, финикийского города на южном берегу Кипра, там, где ныне стоит Ларнака; Иосиф Флавий пишет, что остров, ныне Кипр, назывался Хефима и что Китион сохранил это древнее имя, а еврейские остраконы из Арада около 600 г. до н. э. упоминают «киттим» на службе в иудейском войске, вероятно, греческих или кипрских наёмников. В родословии народов Киттим — сын Иавана, и слово стало означать острова и берега запада вообще. В двух стихах, к которым относится это место, оттуда приходят корабли. Последнее пророчество Валаама предвещает: «придут корабли от Киттима, и смирят Ассура, и смирят Евера; но и им гибель!», а в видении Даниила о царе северном сказано: «придут корабли Киттимские; и он упадет духом, и возвратится»."
    - "Слова Даниила давно относят к лету 168 г. до н. э., когда Антиоха IV, шедшего на Александрию, встретил римский посол Попилий Ленат, очертил вокруг него круг на песке и потребовал обещания уйти из Египта, прежде чем тот выйдет из круга; эту историю рассказывают Полибий и Ливий, а древний греческий перевод Даниила уже читает здесь «римляне». Свитки Мёртвого моря тоже называют Киттимом западных завоевателей, обычно понимаемых как римляне. Самому Кипру посвящена отдельная статья; Китион сегодня — квартал Ларнаки с остатками храмов и гавани."
  uk:
    - "Кіттім, у Біблії короля Якова Чіттім, бере назву від Кітіона, фінікійського міста на південному узбережжі Кіпру, де нині стоїть Ларнака; Йосиф Флавій каже, що острів називали Хетіма, тепер Кіпр, і що Кітіон зберіг стару назву, а староєврейські остраки з Араду близько 600 р. до н. е. згадують «Кіттім», що служили в юдейському війську, ймовірно грецьких або кіпрських найманців. У Таблиці народів Кіттім — син Явана, а слово почало означати острови й узбережжя заходу загалом. У двох віршах, до яких належить це місце, звідти припливають кораблі. Останнє пророцтво Валаама передбачає: «Припливуть з Киттиму судна аж у тую землю, та й Ассурове звоюють», а в баченні Даниїла про царя півночі «прийдуть кораблї Киттимські; і він утратить відвагу й вернеться»."
    - "Читачі давно зіставляють слова Даниїла з літом 168 р. до н. е., коли Антіоха IV, що йшов на Александрію, зустрів римський посол Попілій Ленат, накреслив навколо нього коло на піску й змусив його пообіцяти покинути Єгипет, перш ніж він вийде з нього; цю історію розповідають Полібій і Лівій, а Стара грецька версія Даниїла вже читає тут «римляни». Кумранські сувої так само вживають Кіттім для західних завойовників, найчастіше розуміючи під ними римлян. Сам Кіпр має власну статтю; Кітіон сьогодні — квартал Ларнаки, із залишками його храмів і гавані."
  es:
    - "Quitim, Chittim en la versión del rey Jacobo, toma su nombre de Kition, la ciudad fenicia de la costa meridional de Chipre donde hoy se encuentra Larnaca; Josefo dice que la isla se llamaba Chethima, hoy Chipre, y que Citio conservó el nombre antiguo, y unos óstraca hebreos de Arad, de hacia 600 a. C., mencionan a «Quitim» sirviendo en el ejército de Judá, probablemente mercenarios griegos o chipriotas. En la tabla de las naciones, Quitim es un hijo de Javán, y la palabra pasó a designar en general las islas y costas del oeste. En los dos versículos a los que remite este lugar, de allí vienen naves. El último oráculo de Balaam prevé que «vendrán navíos de la costa de Cittim, y afligirán á Assur, afligirán también á Eber: mas él también perecerá para siempre», y en la visión de Daniel sobre el rey del norte, «vendrán contra él naves de Chîttim, y él se contristará, y se volverá»."
    - "Los lectores han hecho coincidir desde hace tiempo las palabras de Daniel con el verano de 168 a. C., cuando Antíoco IV, que marchaba sobre Alejandría, fue interceptado por el enviado romano Popilio Laenas, quien trazó un círculo a su alrededor en la arena y le hizo prometer que abandonaría Egipto antes de salir de él; Polibio y Livio cuentan la historia, y la antigua traducción griega de Daniel ya lee aquí «romanos». Los manuscritos del mar Muerto emplean asimismo Quitim para los conquistadores del oeste, que se suelen entender como los romanos. Chipre tiene su propio artículo; Kition es hoy un barrio de Larnaca, con los restos de sus templos y de su puerto."
  pt:
    - "Quitim, Chittim na King James Version, toma o nome de Cítio, a cidade fenícia na costa sul de Chipre onde hoje fica Lárnaca; Josefo diz que a ilha se chamava Chetima, hoje Chipre, e que Cítio conservou o nome antigo, e óstracos hebraicos de Arade, por volta de 600 a.C., mencionam “Quitim” servindo no exército de Judá, provavelmente mercenários gregos ou cipriotas. Na tabela das nações, Quitim é filho de Javã, e a palavra passou a designar em geral as ilhas e costas do ocidente. Nos dois versículos a que este verbete corresponde, vêm navios de lá. O último oráculo de Balaão prevê que “navios virão da costa de Quitim. Eles afligirão Assur, e afligirão Éber. Ele também chegará à destruição”, e na visão de Daniel sobre o rei do norte, “navios de Quitim virão contra ele. Portanto, ele se entristecerá, e retornará”."
    - "Os leitores há muito associam as palavras de Daniel ao verão de 168 a.C., quando Antíoco IV, marchando sobre Alexandria, foi interceptado pelo enviado romano Popílio Lenas, que traçou um círculo na areia ao redor dele e o fez prometer deixar o Egito antes de sair dele; Políbio e Lívio contam a história, e a antiga tradução grega de Daniel já lê aqui “romanos”. Os Manuscritos do Mar Morto também usam Quitim para os conquistadores do ocidente, mais frequentemente tomados como os romanos. Chipre tem seu próprio verbete; Cítio é hoje um bairro de Lárnaca, com os restos de seus templos e porto."
  de:
    - "Kittim, in der King-James-Version Chittim, hat seinen Namen von Kition, der phönizischen Stadt an der Südküste Zyperns, wo heute Larnaka liegt; Josephus sagt, die Insel habe Chethima geheißen, das heutige Zypern, und Kition habe den alten Namen bewahrt, und hebräische Ostraka aus Arad um 600 v. Chr. erwähnen „Kittim“ im judäischen Heer, wahrscheinlich griechische oder zypriotische Söldner. In der Völkertafel ist Kittim ein Sohn Jawans, und das Wort kam dazu, die Inseln und Küsten des Westens überhaupt zu bezeichnen. In den beiden Versen, für die dieser Ort steht, kommen von dort Schiffe. Bileams letzter Spruch sieht voraus: „Und Schiffe aus Chittim werden verderben den Assur und Eber; er aber wird auch umkommen“, und in Daniels Vision vom König des Nordens: „Denn es werden Schiffe aus Chittim wider ihn kommen, daß er verzagen wird und umkehren muß“."
    - "Seit langem bezieht man Daniels Worte auf den Sommer 168 v. Chr., als Antiochos IV. auf dem Marsch gegen Alexandria dem römischen Gesandten Popillius Laenas begegnete, der einen Kreis um ihn in den Sand zog und ihn versprechen ließ, Ägypten zu verlassen, ehe er ihn verließe; Polybios und Livius erzählen die Geschichte, und die altgriechische Übersetzung Daniels liest hier schon „Römer“. Auch die Schriftrollen vom Toten Meer verwenden Kittim für die westlichen Eroberer, meist als Römer verstanden. Zypern hat seinen eigenen Artikel; Kition ist heute ein Viertel von Larnaka, mit den Resten seiner Tempel und seines Hafens."
  fr:
    - "Kittim, Chittim dans la version du roi Jacques, tire son nom de Kition, la cité phénicienne de la côte sud de Chypre où se trouve aujourd’hui Larnaca ; Flavius Josèphe dit que l’île s’appelait Chethima, aujourd’hui Chypre, et que Citium gardait l’ancien nom, et des ostraca hébreux d’Arad, vers 600 av. J.-C., mentionnent des « Kittim » dans l’armée de Juda, probablement des mercenaires grecs ou chypriotes. Dans la table des nations, Kittim est un fils de Javan, et le mot en vint à désigner les îles et côtes de l’Occident. Dans les deux versets concernés, des navires en viennent. Le dernier oracle de Balaam prévoit que « des navires viendront de Kittim, ils humilieront l’Assyrien, ils humilieront l’Hébreu ; et lui aussi sera détruit », et, dans la vision de Daniel sur le roi du nord, « des navires de Kittim s’avanceront contre lui ; découragé, il rebroussera »."
    - "Les lecteurs rapprochent depuis longtemps les paroles de Daniel de l’été 168 av. J.-C., quand Antiochos IV, marchant sur Alexandrie, fut rencontré par l’envoyé romain Popilius Laenas, qui traça un cercle autour de lui dans le sable et lui fit promettre de quitter l’Égypte avant d’en sortir ; Polybe et Tite-Live racontent l’histoire, et la traduction grecque ancienne de Daniel lit déjà « Romains » ici. Les manuscrits de la mer Morte emploient de même Kittim pour les conquérants de l’Occident, le plus souvent pris pour les Romains. Chypre a son propre article ; Kition est aujourd’hui un quartier de Larnaca, avec les vestiges de ses temples et de son port."
  it:
    - "Kittim, Chittim nella King James Version, prende il nome da Kition, la città fenicia sulla costa meridionale di Cipro dove oggi sorge Larnaca; Giuseppe Flavio dice che l’isola era chiamata Chetima, ora Cipro, e che Citio conservò il nome antico, e ostraca ebraici di Arad intorno al 600 a.C. menzionano «Kittim» al servizio nell’esercito giudeo, probabilmente mercenari greci o ciprioti. Nella tavola delle nazioni Kittim è figlio di Iavan, e la parola venne a significare in generale le isole e le coste dell’Occidente. Nei due versetti a cui questo luogo rinvia, le navi vengono di là. L’ultimo oracolo di Balaam prevede che «delle navi verranno dalle parti di Kittim e umilieranno Assur, umilieranno Eber, ed egli pure finirà per esser distrutto», e nella visione di Daniele sul re del nord «delle navi di Kittim moveranno contro di lui; ed egli si perderà d’animo»."
    - "Da tempo i lettori accostano le parole di Daniele all’estate del 168 a.C., quando Antioco IV, marciando su Alessandria, fu incontrato dall’inviato romano Popillio Lenate, che tracciò un cerchio intorno a lui nella sabbia e gli fece promettere di lasciare l’Egitto prima di uscirne; Polibio e Livio raccontano la storia, e la traduzione greca antica di Daniele legge già qui «Romani». Anche i Rotoli del Mar Morto usano Kittim per i conquistatori occidentali, per lo più intesi come i Romani. Cipro ha un proprio articolo; Kition è oggi un quartiere di Larnaca, con i resti dei suoi templi e del suo porto."
  pl:
    - "Kittim, w Biblii Króla Jakuba Chittim, bierze nazwę od Kition, fenickiego miasta na południowym wybrzeżu Cypru, gdzie dziś leży Larnaka; Józef Flawiusz mówi, że wyspa zwała się Chethima, dziś Cypr, a Citium zachowało dawną nazwę, i hebrajskie ostraka z Aradu z około 600 r. p.n.e. wspominają „Kittim” w wojsku judzkim, prawdopodobnie greckich lub cypryjskich najemników. W tablicy narodów Kittim jest synem Jawana, a słowo to zaczęło oznaczać wyspy i wybrzeża zachodu w ogóle. W dwóch wersetach, które to miejsce reprezentuje, stamtąd przypływają okręty. Ostatnia wyrocznia Balaama zapowiada: „okręty przypłyną od brzegów Chyttymskich, i utrapią Assyryjany, utrapią Hebrejczyki; ale też same do szczętu zaginą”, a w widzeniu Daniela o królu północy „przyjdą przeciwko niemu okręty z Cytym”, a on, zmartwiony, zawróci."
    - "Czytelnicy od dawna wiążą słowa Daniela z latem 168 r. p.n.e., gdy Antioch IV, idąc na Aleksandrię, spotkał rzymskiego posła Popiliusza Laenasa, który zakreślił wokół niego koło na piasku i kazał mu obiecać opuszczenie Egiptu, zanim wyjdzie z tego koła; opowiadają to Polibiusz i Liwiusz, a starogrecki przekład Księgi Daniela czyta tu już „Rzymianie”. Zwoje znad Morza Martwego również używają Kittim na zachodnich zdobywców, najczęściej uznawanych za Rzymian. Cypr ma własny artykuł; Kition jest dziś dzielnicą Larnaki, z pozostałościami świątyń i portu."
  nl:
    - "Kittim, in de King James Version Chittim, is genoemd naar Kition, de Fenicische stad aan de zuidkust van Cyprus, nu Larnaca; volgens Josephus heette het eiland Chethima, nu Cyprus, en bewaarde Citium de oude naam, en Hebreeuwse ostraka uit Arad (omstreeks 600 v.Chr.) noemen “Kittim” in het Judese leger, waarschijnlijk Griekse of Cypriotische huurlingen. In de volkerentafel is Kittim Javans zoon, en het woord ging in het algemeen de eilanden en kusten van het westen betekenen. In de twee verzen over deze plaats komen er schepen vandaan. Bileams laatste godsspraak voorspelt: “de schepen van den oever der Chitteers, die zullen Assur plagen, zij zullen ook Heber plagen; en hij zal ook ten verderve zijn”, en in Daniëls visioen van de koning van het noorden: “er zullen schepen van Chittim tegen hem komen, daarom zal hij met smart bevangen worden, en hij zal wederkeren”."
    - "Lezers hebben Daniëls woorden lang gekoppeld aan de zomer van 168 v.Chr., toen Antiochus IV, op mars naar Alexandrië, werd opgewacht door de Romeinse gezant Popillius Laenas, die een cirkel om hem in het zand trok en hem liet beloven Egypte te verlaten voordat hij eruit stapte; Polybius en Livius vertellen het verhaal, en de Oudgriekse vertaling van Daniël leest hier al “Romeinen”. De Dode-Zeerollen gebruiken Kittim eveneens voor de westelijke veroveraars, meestal opgevat als de Romeinen. Cyprus heeft zijn eigen lemma; Kition is tegenwoordig een wijk van Larnaca, met de resten van zijn tempels en haven."
  cs:
    - "Kitim, v anglické Bibli krále Jakuba Chittim, má jméno podle Kitionu, fénického města na jižním pobřeží Kypru, kde dnes stojí Larnaka; Josephus praví, že ostrov se jmenoval Chethima, dnešní Kypr, a že Citium si staré jméno zachovalo, a hebrejské ostraky z Aradu kolem roku 600 př. n. l. zmiňují „Kitim“ ve službě v judské armádě, nejspíše řecké nebo kyperské žoldnéře. V tabulce národů je Kitim synem Javanovým a slovo začalo znamenat ostrovy a pobřeží západu vůbec. Ve dvou verších, jimž toto místo odpovídá, odtud připlouvají lodě. Bileámovo poslední proroctví předvídá, že „bárky z země Citim připlynou a ssouží Assyrské, ssouží také Židy, ale i ten lid do konce zahyne“, a ve vidění Danielově o králi severu „přijdou proti němu lodí Citejské, pročež bude jej to boleti … navrátí se“."
    - "Čtenáři dávno spojují Danielova slova s létem roku 168 př. n. l., kdy Antiochovi IV., táhnoucímu na Alexandrii, vyšel vstříc římský vyslanec Popilius Laenas, nakreslil kolem něj do písku kruh a přiměl ho slíbit, že odejde z Egypta, než z něho vystoupí; příběh vypravují Polybios a Livius a starořecký překlad Daniele zde čte už „Římané“. Svitky od Mrtvého moře rovněž užívají Kitim pro západní dobyvatele, nejčastěji chápané jako Římany. Kypr má vlastní článek; Kition je dnes čtvrtí Larnaky, se zbytky svých chrámů a přístavu."
  sv:
    - "Kittim, Chittim i King James Version, har sitt namn efter Kition, den fenikiska staden på Cyperns sydkust där Larnaca nu ligger; Josefus säger att ön kallades Chethima, nu Cypern, och att Kition bevarade det gamla namnet, och hebreiska ostraka från Arad omkring 600 f.Kr. nämner ”Kittim” i judeisk krigstjänst, sannolikt grekiska eller cypriotiska legosoldater. I folkens tavla är Kittim en son till Javan, och ordet kom att beteckna västerns öar och kuster i allmänhet. I de två verser som denna plats står för kommer skepp därifrån. Bileams sista orakel förutser: ”Skepp skola komma från kittéernas kust, de skola tukta Assur, tukta Eber; också han skall hemfalla åt undergång”, och i Daniels syn om konungen i norr: ”skepp från Kittim skola komma emot honom, och han skall förlora modet. Då skall han vända om”."
    - "Läsare har länge hänfört Daniels ord till sommaren 168 f.Kr., då Antiochos IV på marsch mot Alexandria möttes av den romerske sändebudet Popillius Laenas, som drog en ring i sanden runt honom och lät honom lova att lämna Egypten innan han steg ut ur den; Polybios och Livius berättar historien, och den gammalgrekiska översättningen av Daniel läser redan romare här. Dödahavsrullarna använder likaså Kittim om de västliga erövrarna, oftast tolkat som romarna. Cypern har en egen artikel; Kition är i dag en stadsdel i Larnaca, med lämningar av sina tempel och sin hamn."
  nb:
    - "Kittim, Chittim i King James-oversettelsen, har navn etter Kition, den fønikiske byen på sørkysten av Kypros der Larnaka nå ligger; Josefus sier at øya ble kalt Chethima, nå Kypros, og at Citium beholdt det gamle navnet, og hebraiske ostraka fra Arad omkring 600 f.Kr. nevner «Kittim» i tjeneste i den judeiske hæren, trolig greske eller kypriotiske leiesoldater. I folketavlen er Kittim en sønn av Javan, og ordet kom til å bety vestens øyer og kyster i alminnelighet. I de to versene dette stedet står for, kommer skip derfra. Bileams siste orakel forutser: «Skiber kommer fra Kittims kyst, de kuer Assur, og de kuer Eber; men også han skal gå til grunne», og i Daniels syn om nordens konge: «for skib fra Kittim skal komme imot ham, og han skal bli motfallen og vende om»."
    - "Lesere har lenge knyttet Daniels ord til sommeren 168 f.Kr., da Antiokos IV, på marsj mot Aleksandria, ble møtt av den romerske utsendingen Popillius Laenas, som trakk en sirkel rundt ham i sanden og fikk ham til å love å forlate Egypt før han trådte ut av den; Polybios og Livius forteller historien, og den gammelgreske oversettelsen av Daniel leser allerede «romere» her. Dødehavsrullene bruker likeledes Kittim om erobrerne fra vest, oftest regnet for romerne. Kypros har sin egen artikkel; Kition er i dag en bydel i Larnaka, med restene av sine templer og sin havn."
