# Overview article (ADR 0007). Mainstream facts only; the gate is unlocated and its northern position is given as the usual inference; the equation with the Gate of Benjamin is reported as a suggestion.
id: ephraim-gate
place: a7b6270
title:
  en: "Ephraim Gate"
  ru: "Ворота Ефремовы"
  uk: "Ворота Єфремові"
  es: "Puerta de Efraín"
  pt: "Porta de Efraim"
  de: "Ephraimtor"
  fr: "Porte d’Éphraïm"
body:
  en:
    - "The Gate of Ephraim was a gate in the north wall of Jerusalem under the kings and again in Nehemiah's day, named from the road that left it northward into the hill country of Ephraim. Nothing of it has been found, and its place is inferred from the texts: it stood four hundred cubits, about 200 m, east of the Corner Gate, and Nehemiah's procession passed it before the Old Gate, the Fish Gate and the tower of Hananel on its way east to the Sheep Gate, so it lay toward the western end of the north wall, in the area north of today's Jewish Quarter. Some scholars think it is the same gate as the Gate of Benjamin, at which Jeremiah was arrested, since the road north served both tribes; others keep them apart."
    - "The gate first appears in a defeat. When Jehoash of Israel beat Amaziah of Judah at Beth-shemesh he came to Jerusalem “and brake down the wall of Jerusalem from the gate of Ephraim unto the corner gate, four hundred cubits”, and took hostages and the treasures of the Temple home to Samaria. Nehemiah's account of the repair of the walls does not name the gate, perhaps because that stretch had survived or went by another name, yet it was there when the walls were done: at the Feast of Tabernacles the people made booths “in the street of the water gate, and in the street of the gate of Ephraim”, and at the dedication of the wall the second choir walked on the wall “from above the gate of Ephraim, and above the old gate, and above the fish gate”."
    - "The square before the gate shows that it was an open place inside the city where a crowd could gather. The north wall of that time ran roughly along the line of the Broad Wall found by Nahman Avigad in the Jewish Quarter in the 1970s, seven metres thick and of the late eighth century BC; the gate itself has not been identified. The present north wall of the Old City, with the Damascus Gate above a Roman gate of the second century AD, lies well to the north of it."
  ru:
    - "Ворота Ефремовы были воротами в северной стене Иерусалима при царях и снова во дни Неемии; имя им дала дорога, уходившая от них на север, в горы Ефремовы. Ничего от них не найдено, и их место выводят из текстов: они стояли в четырёхстах локтях, около 200 м, к востоку от Угольных ворот, а шествие Неемии прошло их прежде Старых ворот, Рыбных ворот и башни Хананела на пути к Овечьим воротам, так что они лежали ближе к западному концу северной стены, севернее нынешнего Еврейского квартала. Некоторые учёные считают их теми же воротами, что и ворота Вениаминовы, у которых схватили Иеремию, ведь северная дорога служила обоим коленам; другие их различают."
    - "Впервые ворота появляются в рассказе о поражении. Иоас Израильский, разбив Амасию Иудейского в Вефсамисе, пришёл в Иерусалим «и разрушил стену Иерусалимскую от ворот Ефремовых до ворот угольных на четыреста локтей», взял заложников и сокровища храма и ушёл в Самарию. Рассказ Неемии о починке стен ворот не называет — быть может, этот участок уцелел или звался иначе, — но, когда стены были готовы, они были на месте: в праздник Кущей народ сделал себе кущи «на площади у Водяных ворот, и на площади у Ефремовых ворот», а при освящении стены второй хор прошёл по стене «от ворот Ефремовых, мимо старых ворот и ворот Рыбных»."
    - "Площадь перед воротами показывает, что внутри города здесь было открытое место, где могла собраться толпа. Северная стена того времени шла примерно по линии Широкой стены, найденной Нахманом Авигадом в Еврейском квартале в 1970-х годах, — семиметровой толщины, конца VIII века до н. э.; сами ворота не опознаны. Нынешняя северная стена Старого города с Дамасскими воротами над римскими воротами II века н. э. лежит много севернее."
  uk:
    - "Ворота Єфремові були брамою в північному мурі Єрусалима за царів і знову за днів Неемії, названою за дорогою, що виходила з неї на північ у гори Єфрема. Від них нічого не знайдено, і їхнє місце виводять із текстів: вони стояли за чотириста ліктів, близько 200 м, на схід від Наріжних воріт, а процесія Неемії проходила їх перед Старими воротами, Рибними воротами та вежею Хананела на шляху на схід до Овечих воріт, тож вони лежали до західного краю північного муру, в районі на північ від сьогоднішнього Єврейського кварталу. Дехто з учених вважає, що це ті самі ворота, що й Веніяминові, біля яких заарештували Єремію, бо північна дорога служила обом племенам; інші розрізняють їх."
    - "Ворота вперше з'являються в оповіді про поразку. Коли Йоас Ізраїльський переміг Амассію Юдейського в Бет-Шемеші, він прийшов до Єрусалима й «зробив у Ерусалимському мурі проломину від Ефреїмових ворот та й до ворот наріжних, на чотириста локот», і забрав заручників і скарби храму додому, до Самарії. Розповідь Неемії про ремонт мурів не називає цих воріт, можливо тому, що ця ділянка вціліла або мала іншу назву, але вони були там, коли мури було закінчено: на свято кущів люди поробили собі кучки «на майданї коло воріт Водяних, і на майданї коло воріт Ефраїмових», а під час посвячення муру другий хор ішов мурами «від Ефраїмових воріт, попри старі ворота й ворота Рибні»."
    - "Майдан перед воротами показує, що це було відкрите місце всередині міста, де могла зібратися юрба. Тогочасний північний мур ішов приблизно вздовж лінії Широкої стіни, знайденої Нахманом Авігадом у Єврейському кварталі в 1970-х рр., завтовшки сім метрів і кінця VIII ст. до н. е.; самі ворота не ототожнені. Нинішній північний мур Старого міста з Дамаськими воротами над римською брамою II ст. н. е. лежить значно північніше."
  es:
    - "La Puerta de Efraín era una puerta de la muralla norte de Jerusalén bajo los reyes y de nuevo en tiempos de Nehemías, llamada así por el camino que salía de ella hacia el norte, a la región montañosa de Efraín. No se ha hallado nada de ella, y su lugar se deduce de los textos: se hallaba a cuatrocientos codos, unos 200 m, al este de la Puerta de la Esquina, y la procesión de Nehemías pasó junto a ella antes de la Puerta Vieja, la Puerta del Pescado y la torre de Hananeel en su camino hacia el este, a la Puerta de las Ovejas, de modo que estaba hacia el extremo occidental de la muralla norte, en la zona al norte del actual Barrio Judío. Algunos estudiosos piensan que es la misma puerta que la Puerta de Benjamín, en la que fue arrestado Jeremías, ya que el camino del norte servía a ambas tribus; otros las mantienen separadas."
    - "La puerta aparece por primera vez en una derrota. Cuando Joás de Israel venció a Amasías de Judá en Bet-semes llegó a Jerusalén «y derribó el muro de Jerusalem desde la puerta de Ephraim hasta la puerta del ángulo, cuatrocientos codos», y llevó rehenes y los tesoros del Templo a Samaria. El relato de Nehemías sobre la reparación de las murallas no nombra la puerta, quizá porque ese tramo se había conservado o se conocía por otro nombre, pero estaba allí cuando se terminaron los muros: en la fiesta de los Tabernáculos el pueblo hizo cabañas «en la plaza de la puerta de las Aguas, y en la plaza de la puerta de Ephraim», y en la dedicación del muro el segundo coro caminó sobre el muro: «Y desde la puerta de Ephraim hasta la puerta vieja, y á la puerta del Pescado»."
    - "La plaza ante la puerta muestra que era un espacio abierto dentro de la ciudad donde podía reunirse una multitud. La muralla norte de entonces corría aproximadamente a lo largo de la línea del Muro Ancho hallado por Nahman Avigad en el Barrio Judío en la década de 1970, de siete metros de grosor y de finales del siglo VIII a. C.; la puerta misma no ha sido identificada. La actual muralla norte de la Ciudad Vieja, con la Puerta de Damasco sobre una puerta romana del siglo II d. C., queda bastante más al norte."
  pt:
    - "A Porta de Efraim era uma porta no muro norte de Jerusalém sob os reis e de novo no tempo de Neemias, assim chamada pela estrada que saía dela para o norte, rumo às montanhas de Efraim. Nada dela foi achado, e seu lugar é deduzido dos textos: ficava a quatrocentos côvados, cerca de 200 m, a leste da Porta da Esquina, e a procissão de Neemias passou por ela antes da Porta Velha, da Porta do Peixe e da torre de Hananel, a caminho do leste, até a Porta das Ovelhas, de modo que ficava para o extremo ocidental do muro norte, na área ao norte do atual Bairro Judeu. Alguns estudiosos pensam que é a mesma porta que a Porta de Benjamim, em que Jeremias foi preso, já que a estrada do norte servia a ambas as tribos; outros as mantêm separadas."
    - "A porta aparece pela primeira vez numa derrota. Quando Jeoás de Israel venceu Amazias de Judá em Bete-Semes, veio a Jerusalém e “derrubou o muro de Jerusalém desde a porta de Efraim até a porta da esquina, quatrocentos côvados”, e levou reféns e os tesouros do Templo para Samaria. O relato de Neemias sobre o reparo dos muros não nomeia a porta, talvez porque esse trecho tivesse sobrevivido ou tivesse outro nome, mas ela existia quando os muros ficaram prontos: na Festa dos Tabernáculos o povo fez abrigos “na praça da Porta das Águas e na praça da Porta de Efraim”, e na dedicação do muro o segundo coro andou sobre o muro “por cima da Porta de Efraim, e pela Porta Velha, e pela Porta dos Peixes”."
    - "A praça diante da porta mostra que era um espaço aberto dentro da cidade onde uma multidão podia se reunir. O muro norte daquele tempo corria aproximadamente ao longo da linha da Muralha Larga achada por Nahman Avigad no Bairro Judeu na década de 1970, de sete metros de espessura e do fim do século VIII a.C.; a porta em si não foi identificada. O atual muro norte da Cidade Velha, com a Porta de Damasco sobre uma porta romana do século II d.C., fica bem ao norte dela."
  de:
    - "Das Ephraimtor war ein Tor in der Nordmauer Jerusalems unter den Königen und wieder zu Nehemias Zeit, benannt nach der Straße, die es nordwärts ins Bergland Ephraim verließ. Nichts von ihm ist gefunden worden, und sein Platz wird aus den Texten erschlossen: Es stand vierhundert Ellen, etwa 200 m, östlich des Ecktors, und Nehemias Prozession passierte es vor dem Alten Tor, dem Fischtor und dem Turm Hananeel auf ihrem Weg nach Osten zum Schaftor, sodass es zum westlichen Ende der Nordmauer hin lag, im Gebiet nördlich des heutigen Jüdischen Viertels. Manche Gelehrte halten es für dasselbe Tor wie das Benjamintor, an dem Jeremia verhaftet wurde, da die Straße nach Norden beiden Stämmen diente; andere halten sie auseinander."
    - "Das Tor erscheint zuerst in einer Niederlage. Als Joasch von Israel Amazja von Juda bei Bet-Schemesch besiegt hatte, kam er nach Jerusalem und „riß ein die Mauer Jerusalems von dem Tor Ephraim bis an das Ecktor, vierhundert Ellen lang“, und nahm Geiseln und die Schätze des Tempels mit heim nach Samaria. Nehemias Bericht über die Ausbesserung der Mauern nennt das Tor nicht, vielleicht weil dieser Abschnitt überdauert hatte oder unter einem anderen Namen lief, doch es war da, als die Mauern fertig waren: Am Laubhüttenfest machten sich die Leute Hütten „auf der breiten Gasse am Wassertor und auf der breiten Gasse am Tor Ephraim“, und bei der Einweihung der Mauer ging der zweite Chor auf der Mauer „zum Tor Ephraim hinan und zum alten Tor und zum Fischtor“."
    - "Der Platz vor dem Tor zeigt, dass es ein offener Ort innerhalb der Stadt war, wo sich eine Menge versammeln konnte. Die Nordmauer jener Zeit verlief ungefähr entlang der Linie der Breiten Mauer, die Nahman Avigad in den 1970er Jahren im Jüdischen Viertel fand, sieben Meter dick und aus dem späten 8. Jahrhundert v. Chr.; das Tor selbst ist nicht identifiziert. Die heutige Nordmauer der Altstadt, mit dem Damaskustor über einem römischen Tor des 2. Jahrhunderts n. Chr., liegt weit nördlich davon."
  fr:
    - "La Porte d’Éphraïm était une porte du mur nord de Jérusalem sous les rois et de nouveau à l’époque de Néhémie, nommée d’après la route qui en partait vers le nord, dans les montagnes d’Éphraïm. On n’en a rien retrouvé, et son emplacement se déduit des textes : elle se trouvait à quatre cents coudées, environ 200 m, à l’est de la Porte de l’Angle, et la procession de Néhémie la dépassait avant la vieille porte, la Porte des Poissons et la tour de Hananeel en allant vers l’est jusqu’à la Porte des Brebis ; elle se situait donc vers l’extrémité ouest du mur nord, dans la zone au nord de l’actuel quartier juif. Certains spécialistes pensent qu’elle est la même que la porte de Benjamin où Jérémie fut arrêté, puisque la route du nord desservait les deux tribus ; d’autres les distinguent."
    - "La porte apparaît d’abord dans une défaite. Quand Joas d’Israël battit Amatsia de Juda à Beth-Schémesch, il vint à Jérusalem et « fit une brèche de quatre cents coudées dans la muraille de Jérusalem, depuis la porte d’Éphraïm jusqu’à la porte de l’angle », et ramena à Samarie des otages et les trésors du Temple. Le récit de Néhémie sur la réparation des murs ne nomme pas la porte, peut-être parce que ce tronçon avait survécu ou portait un autre nom, mais elle existait quand les murs furent achevés : à la fête des Tabernacles, le peuple fit des cabanes « sur la place de la porte des eaux et sur la place de la porte d’Éphraïm », et à la dédicace du mur le second chœur marcha sur le mur « au-dessus de la porte d’Éphraïm, de la vieille porte, de la porte des poissons »."
    - "La place devant la porte montre qu’il s’agissait d’un espace ouvert à l’intérieur de la ville où une foule pouvait se rassembler. Le mur nord de cette époque suivait à peu près la ligne de la Muraille large trouvée par Nahman Avigad dans le quartier juif dans les années 1970, épaisse de sept mètres et de la fin du VIIIe siècle av. J.-C. ; la porte elle-même n’a pas été identifiée. L’actuel mur nord de la Vieille Ville, avec la Porte de Damas au-dessus d’une porte romaine du IIe siècle apr. J.-C., se trouve bien au nord de celle-ci."
