# Overview article (ADR 0007). Mainstream facts only; the gate is unlocated and its northern position is given as the usual inference; the equation with the Gate of Benjamin is reported as a suggestion.
id: ephraim-gate
place: a7b6270
title:
  en: "Ephraim Gate"
  ru: "Ворота Ефремовы"
body:
  en:
    - "The Gate of Ephraim was a gate in the north wall of Jerusalem under the kings and again in Nehemiah's day, named from the road that left it northward into the hill country of Ephraim. Nothing of it has been found, and its place is inferred from the texts: it stood four hundred cubits, about 200 m, east of the Corner Gate, and Nehemiah's procession passed it before the Old Gate, the Fish Gate and the tower of Hananel on its way east to the Sheep Gate, so it lay toward the western end of the north wall, in the area north of today's Jewish Quarter. Some scholars think it is the same gate as the Gate of Benjamin, at which Jeremiah was arrested, since the road north served both tribes; others keep them apart."
    - "The gate first appears in a defeat. When Jehoash of Israel beat Amaziah of Judah at Beth-shemesh he came to Jerusalem “and brake down the wall of Jerusalem from the gate of Ephraim unto the corner gate, four hundred cubits”, and took hostages and the treasures of the Temple home to Samaria. Nehemiah's account of the repair of the walls does not name the gate, perhaps because that stretch had survived or went by another name, yet it was there when the walls were done: at the Feast of Tabernacles the people made booths “in the street of the water gate, and in the street of the gate of Ephraim”, and at the dedication of the wall the second choir walked on the wall “from above the gate of Ephraim, and above the old gate, and above the fish gate”."
    - "The square before the gate shows that it was an open place inside the city where a crowd could gather. The north wall of that time ran roughly along the line of the Broad Wall found by Nahman Avigad in the Jewish Quarter in the 1970s, seven metres thick and of the late eighth century BC; the gate itself has not been identified. The present north wall of the Old City, with the Damascus Gate above a Roman gate of the second century AD, lies well to the north of it."
  ru:
    - "Ворота Ефремовы были воротами в северной стене Иерусалима при царях и снова во дни Неемии; имя им дала дорога, уходившая от них на север, в горы Ефремовы. Ничего от них не найдено, и их место выводят из текстов: они стояли в четырёхстах локтях, около 200 м, к востоку от Угольных ворот, а шествие Неемии прошло их прежде Старых ворот, Рыбных ворот и башни Хананела на пути к Овечьим воротам, так что они лежали ближе к западному концу северной стены, севернее нынешнего Еврейского квартала. Некоторые учёные считают их теми же воротами, что и ворота Вениаминовы, у которых схватили Иеремию, ведь северная дорога служила обоим коленам; другие их различают."
    - "Впервые ворота появляются в рассказе о поражении. Иоас Израильский, разбив Амасию Иудейского в Вефсамисе, пришёл в Иерусалим «и разрушил стену Иерусалимскую от ворот Ефремовых до ворот угольных на четыреста локтей», взял заложников и сокровища храма и ушёл в Самарию. Рассказ Неемии о починке стен ворот не называет — быть может, этот участок уцелел или звался иначе, — но, когда стены были готовы, они были на месте: в праздник Кущей народ сделал себе кущи «на площади у Водяных ворот, и на площади у Ефремовых ворот», а при освящении стены второй хор прошёл по стене «от ворот Ефремовых, мимо старых ворот и ворот Рыбных»."
    - "Площадь перед воротами показывает, что внутри города здесь было открытое место, где могла собраться толпа. Северная стена того времени шла примерно по линии Широкой стены, найденной Нахманом Авигадом в Еврейском квартале в 1970-х годах, — семиметровой толщины, конца VIII века до н. э.; сами ворота не опознаны. Нынешняя северная стена Старого города с Дамасскими воротами над римскими воротами II века н. э. лежит много севернее."
