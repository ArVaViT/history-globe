body:
  en:
    - "Keilah is Khirbet Qila, a terraced hill in the eastern Shephelah, about 11 km east of Beth Guvrin, above the Wadi es-Sur, an arm of the Valley of Elah. The Arab village of Qila beside it keeps the old name, and nineteenth-century explorers, among them Victor Guérin and the Survey of Western Palestine, identified the site from it. Adullam lies about 4 km to the north."
    - "Keilah already appears in the Amarna letters of the fourteenth century BC as Qiltu, a town fought over by Abdi-Heba, ruler of Jerusalem, and Shuwardata, a ruler in the lowland. Shuwardata complains that Abdi-Heba wrote to the men of Qiltu, offering them silver to follow him; Abdi-Heba writes in turn that Milkilu and Tagi brought troops into Qiltu against him."
    - 'In the Book of Joshua Keilah is one of the towns of the lowland of Judah. When the Philistines were robbing its threshingfloors, David asked the LORD, went down with his men and "saved the inhabitants of Keilah"; Abiathar the priest joined him there with the ephod. Saul said that David was "shut in, by entering into a town that hath gates and bars", and called out the people to besiege it. David asked the LORD whether the men of Keilah would hand him over, was answered "They will deliver thee up", and left with about six hundred men. After the exile Hashabiah and Bavai, each the ruler of half the district of Keilah, repaired the wall of Jerusalem under Nehemiah.'
    - "Josephus retells David's rescue of Keilah. In the early fourth century AD Eusebius knew Keilah as a village called Kela about eight miles east of Eleutheropolis on the road to Hebron, where the tomb of the prophet Habakkuk was shown."
  ru:
    - "Кеила — это Хирбет-Кила, холм с террасами на востоке Шефелы, примерно в 11 км к востоку от Бейт-Гуврина, над Вади-эс-Сур, ответвлением долины дуба (Эла). Соседнее арабское селение Кила сохраняет древнее имя, и по нему исследователи XIX века, среди них Виктор Герен и Съёмка Западной Палестины, отождествили это место. Одоллам лежит примерно в 4 км к северу."
    - "Кеила упоминается уже в амарнских письмах XIV века до н. э. как Кильту — город, за который спорили Абди-Хеба, правитель Иерусалима, и Шувардата, правитель в низменности. Шувардата жалуется, что Абди-Хеба писал жителям Кильту, обещая им серебро, если они пойдут за ним; Абди-Хеба, в свою очередь, пишет, что Милкилу и Таги ввели войска в Кильту против него."
    - "В книге Иисуса Навина Кеила — один из городов низменности Иуды. Когда филистимляне расхищали её гумна, Давид вопросил Господа, пошёл со своими людьми и «спас Давид жителей Кеиля»; туда же пришёл к нему священник Авиафар с ефодом. Саул сказал, что Давид «запер себя, войдя в город с воротами и запорами», и созвал народ, чтобы осадить его. Давид вопросил Господа, предадут ли его жители Кеилы, получил ответ «предадут» и ушёл с людьми, которых было около шестисот. После плена Хашавия и Баввай, каждый — начальник полуокруга Кеильского, при Неемии чинили стену Иерусалима."
    - "Иосиф Флавий пересказывает, как Давид спас Кеилу. В начале IV века н. э. Евсевий знал Кеилу как селение Кела примерно в восьми милях к востоку от Елевферополя по дороге в Хеврон, где показывали гробницу пророка Аввакума."
  uk:
    - "Кеїла — це Хірбет-Кіла, терасований пагорб у східній Шефелі, приблизно за 11 км на схід від Бейт-Гуврина, над вадою ес-Сур, відгалуженням Долини дуба. Арабське село Кіла поруч зберігає стару назву, і дослідники XIX ст., серед них Віктор Ґерен та «Обстеження Західної Палестини», упізнали місце саме за нею. Одолам лежить приблизно за 4 км на північ."
    - "Кеїла вже з’являється в амарнських листах XIV ст. до н. е. під назвою Кілту, як місто, за яке воювали Абді-Хеба, правитель Єрусалима, і Шувардата, правитель на рівнині. Шувардата скаржиться, що Абді-Хеба писав мужам Кілту, пропонуючи їм срібло, щоб вони пішли за ним; Абді-Хеба у свою чергу пише, що Мілкілу й Тагі ввели війська до Кілту проти нього."
    - "У Книзі Ісуса Навина Кеїла — одне з міст низовини Юди. Коли філістимляни грабували її тік, Давид запитав Господа, зійшов зі своїми людьми й «вибавив Давид осадників Кеїльських»; священик Авіятар долучився до нього там з ефодом. Саул сказав про Давида: «ввійшовши в город з ворітьми й засовами, він себе замкнув», і скликав людей облягати його. Давид запитав Господа, чи видадуть його городяни Кеїли, дістав відповідь «Видадуть» і пішов приблизно з шістьмастами чоловіків. Після полону Хашавія й Баввай, кожен — старшина половини повіту Кеїли, лагодили мур Єрусалима за Неемії."
    - "Йосиф Флавій переказує порятунок Кеїли Давидом. На початку IV ст. н. е. Євсевій знав Кеїлу як село Кела приблизно за вісім миль на схід від Елевтерополя при дорозі на Хеврон, де показували гробницю пророка Авакума."
  es:
    - "Keila es Khirbet Qila, una colina en terrazas de la Sefelá oriental, a unos 11 km al este de Beit Guvrin, sobre el uadi es-Sur, un brazo del valle de Ela. La aldea árabe de Qila, a su lado, conserva el nombre antiguo, y los exploradores del siglo XIX, entre ellos Victor Guérin y el Survey of Western Palestine, identificaron el sitio a partir de él. Adulam queda a unos 4 km al norte."
    - "Keila aparece ya en las cartas de Amarna del siglo XIV a. C. como Qiltu, una ciudad disputada entre Abdi-Heba, gobernante de Jerusalén, y Shuwardata, un gobernante de la llanura. Shuwardata se queja de que Abdi-Heba escribió a los hombres de Qiltu ofreciéndoles plata para que lo siguieran; Abdi-Heba escribe a su vez que Milkilu y Tagi introdujeron tropas en Qiltu contra él."
    - "En el libro de Josué, Keila es una de las ciudades de la llanura de Judá. Cuando los filisteos saqueaban sus eras, David consultó a Jehová, bajó con sus hombres y «libró David á los de Keila»; el sacerdote Abiatar se unió a él allí con el efod. Saúl dijo que David estaba «encerrado, habiéndose metido en ciudad con puertas y cerraduras», y convocó al pueblo para sitiarla. David preguntó a Jehová si los hombres de Keila lo entregarían, recibió la respuesta «Te entregarán», y se marchó con unos seiscientos hombres. Después del destierro, Hasabías y Bavai, cada uno gobernante de la mitad del distrito de Keila, repararon el muro de Jerusalén bajo Nehemías."
    - "Josefo relata de nuevo el rescate de Keila por David. A comienzos del siglo IV d. C., Eusebio conoció Keila como una aldea llamada Cela, a unas ocho millas al este de Eleuterópolis, en el camino de Hebrón, donde se mostraba la tumba del profeta Habacuc."
  pt:
    - "Queila é Khirbet Qila, uma colina em terraços na Sefelá oriental, a cerca de 11 km a leste de Bet Guvrin, acima do uádi es-Sur, um braço do vale de Elá. A aldeia árabe de Qila, ao lado, conserva o nome antigo, e exploradores do século XIX, entre eles Victor Guérin e o Survey of Western Palestine, identificaram o sítio a partir dele. Adulão fica a cerca de 4 km ao norte."
    - "Queila já aparece nas cartas de Amarna do século XIV a.C. como Qiltu, cidade disputada por Abdi-Heba, governante de Jerusalém, e Shuwardata, um governante da planície. Shuwardata queixa-se de que Abdi-Heba escreveu aos homens de Qiltu, oferecendo-lhes prata para que o seguissem; Abdi-Heba escreve, por sua vez, que Milkilu e Tagi introduziram tropas em Qiltu contra ele."
    - "No livro de Josué, Queila é uma das cidades da planície de Judá. Quando os filisteus saqueavam as suas eiras, Davi consultou o SENHOR, desceu com seus homens e “salvou os habitantes de Queila”; o sacerdote Abiatar juntou-se a ele ali com o éfode. Saul disse que Davi “se encurralou ao entrar numa cidade que tem portas e trancas” e convocou o povo para cercá-la. Davi perguntou ao SENHOR se os homens de Queila o entregariam, recebeu a resposta “Eles o entregarão” e partiu com cerca de seiscentos homens. Depois do exílio, Hasabias e Bavai, cada um governante de metade do distrito de Queila, repararam o muro de Jerusalém sob Neemias."
    - "Josefo reconta o resgate de Queila por Davi. No início do século IV d.C., Eusébio conhecia Queila como uma aldeia chamada Kela, a cerca de oito milhas a leste de Eleuterópolis, na estrada de Hebrom, onde se mostrava o túmulo do profeta Habacuque."
  de:
    - "Keïla ist Khirbet Qila, ein terrassierter Hügel in der östlichen Schefela, etwa 11 km östlich von Bet Guvrin, oberhalb des Wadi es-Sur, eines Arms des Elatals. Das arabische Dorf Qila daneben bewahrt den alten Namen, und Forscher des 19. Jahrhunderts, darunter Victor Guérin und der Survey of Western Palestine, bestimmten den Ort danach. Adullam liegt etwa 4 km nördlich."
    - "Keïla erscheint schon in den Amarna-Briefen des 14. Jahrhunderts v. Chr. als Qiltu, eine Stadt, um die Abdi-Heba, der Herrscher von Jerusalem, und Schuwardata, ein Herrscher im Tiefland, stritten. Schuwardata klagt, Abdi-Heba habe an die Männer von Qiltu geschrieben und ihnen Silber geboten, damit sie ihm folgten; Abdi-Heba schreibt seinerseits, Milkilu und Tagi hätten Truppen gegen ihn nach Qiltu gebracht."
    - "Im Buch Josua gehört Keïla zu den Städten der Schefela Judas. Als die Philister seine Tennen beraubten, fragte David den HERRN, zog mit seinen Männern hinab, und es heißt: „Also errettete David die zu Kegila“; der Priester Abjatar kam dort mit dem Leibrock zu ihm. Saul sagte, Gott habe David in seine Hände gegeben, „daß er eingeschlossen ist, nun er in eine Stadt gekommen ist, mit Türen und Riegeln verwahrt“, und rief das Volk auf, sie zu belagern. David fragte den HERRN, ob die Männer von Keïla ihn ausliefern würden, erhielt die Antwort, sie würden es tun, und zog mit etwa sechshundert Männern ab. Nach dem Exil bauten Haschabja und Bawai, jeder Oberster eines halben Bezirks von Keïla, unter Nehemia an der Mauer Jerusalems."
    - "Josephus erzählt Davids Rettung von Keïla nach. Im frühen 4. Jahrhundert n. Chr. kannte Eusebius Keïla als ein Dorf namens Kela, etwa acht Meilen östlich von Eleutheropolis an der Straße nach Hebron, wo man das Grab des Propheten Habakuk zeigte."
  fr:
    - "Keïla est Khirbet Qila, colline en terrasses de la Shéphéla orientale, à environ 11 km à l’est de Beth Guvrin, au-dessus de l’oued es-Sur, un bras de la vallée d’Éla. Le village arabe de Qila qui la jouxte garde l’ancien nom, et des explorateurs du XIXe siècle, dont Victor Guérin et le Survey of Western Palestine, ont identifié le site grâce à lui. Adullam se trouve à environ 4 km au nord."
    - "Keïla apparaît déjà dans les lettres d’Amarna du XIVe siècle av. J.-C. sous le nom de Qiltu, ville disputée entre Abdi-Héba, souverain de Jérusalem, et Shuwardata, souverain de la plaine. Shuwardata se plaint qu’Abdi-Héba ait écrit aux hommes de Qiltu en leur offrant de l’argent pour qu’ils le suivent ; Abdi-Héba écrit à son tour que Milkilu et Tagi ont fait entrer des troupes dans Qiltu contre lui."
    - "Dans le livre de Josué, Keïla est l’une des villes de la plaine de Juda. Alors que les Philistins pillaient ses aires, David consulta l’Éternel, descendit avec ses gens et « délivra les habitants de Keïla » ; le sacrificateur Abiathar le rejoignit là avec l’éphod. Saül dit que David était « venu s’enfermer dans une ville qui a des portes et des barres », et convoqua le peuple pour l’assiéger. David demanda à l’Éternel si les habitants de Keïla le livreraient, reçut cette réponse : « Ils te livreront », et partit avec environ six cents hommes. Après l’exil, Haschabia et Bavvaï, chacun chef de la moitié du district de Keïla, réparèrent la muraille de Jérusalem sous Néhémie."
    - "Flavius Josèphe reprend le récit de la délivrance de Keïla par David. Au début du IVe siècle apr. J.-C., Eusèbe connaissait Keïla comme un village appelé Kela, à environ huit milles à l’est d’Éleuthéropolis, sur la route d’Hébron, où l’on montrait le tombeau du prophète Habacuc."
  it:
    - "Keila è Khirbet Qila, una collina a terrazze nella Sefela orientale, a circa 11 km a est di Bet Guvrin, sopra il Wadi es-Sur, un ramo della Valle del Terebinto. Il villaggio arabo di Qila, accanto, ne conserva il nome antico, e gli esploratori dell’Ottocento, tra cui Victor Guérin e il Survey of Western Palestine, identificarono il sito proprio da esso. Adullam si trova a circa 4 km a nord."
    - "Keila compare già nelle lettere di Amarna del XIV secolo a.C. come Qiltu, una città contesa tra Abdi-Heba, signore di Gerusalemme, e Shuwardata, un signore della pianura. Shuwardata lamenta che Abdi-Heba abbia scritto agli uomini di Qiltu, offrendo loro argento perché lo seguissero; Abdi-Heba scrive a sua volta che Milkilu e Tagi hanno portato truppe in Qiltu contro di lui."
    - "Nel libro di Giosuè Keila è una delle città della pianura di Giuda. Mentre i Filistei ne saccheggiavano le aie, Davide consultò l’Eterno, scese con i suoi uomini e «liberò gli abitanti di Keila»; il sacerdote Abiatar lo raggiunse là con l’efod. Saul disse che Davide era «venuto a rinchiudersi in una città che ha porte e sbarre», e convocò il popolo per assediarla. Davide chiese all’Eterno se gli uomini di Keila lo avrebbero consegnato, ebbe per risposta «Vi daranno nelle sue mani», e se ne andò con circa seicento uomini. Dopo l’esilio Casabia e Bavvai, ciascuno capo di metà del distretto di Keila, riparò le mura di Gerusalemme sotto Neemia."
    - "Giuseppe Flavio racconta di nuovo il salvataggio di Keila da parte di Davide. All’inizio del IV secolo d.C. Eusebio conosceva Keila come un villaggio chiamato Kela, a circa otto miglia a est di Eleuteropoli sulla strada di Ebron, dove si mostrava la tomba del profeta Abacuc."
  pl:
    - "Keila to Khirbet Qila, wzgórze z tarasami we wschodniej Szefeli, około 11 km na wschód od Bet Guvrin, nad Wadi es-Sur, odnogą Doliny Ela. Arabska wieś Qila obok niego zachowuje dawną nazwę, a dziewiętnastowieczni badacze, wśród nich Victor Guérin i Survey of Western Palestine, zidentyfikowali na jej podstawie to stanowisko. Adullam leży około 4 km na północ."
    - "Keila pojawia się już w listach z Amarna z XIV w. p.n.e. jako Qiltu, miasto, o które walczyli Abdi-Cheba, władca Jerozolimy, i Szuwardata, władca na nizinie. Szuwardata skarży się, że Abdi-Cheba pisał do mieszkańców Qiltu, oferując im srebro, by poszli za nim; Abdi-Cheba pisze z kolei, że Milkilu i Tagi wprowadzili wojska do Qiltu przeciwko niemu."
    - "W Księdze Jozuego Keila należy do miast nizin Judy. Gdy Filistyni plądrowali jej klepiska, Dawid zapytał Pana, zszedł ze swymi ludźmi i „wybawił Dawid obywatele Ceili”; kapłan Abiatar dołączył do niego tam z efodem. Saul powiedział, że Dawid „się zawarł, wszedłszy do miasta, w którem są bramy i zamki”, i zwołał lud, by je oblegać. Dawid zapytał Pana, czy mężowie Keili wydadzą go w ręce Saula, otrzymał odpowiedź „Wydadzą” i wyszedł z około sześciuset mężami. Po niewoli Chaszabiasz i Bawaj, każdy władca połowy okręgu Keili, naprawiali mur Jerozolimy za Nehemiasza."
    - "Józef Flawiusz opowiada na nowo o ocaleniu Keili przez Dawida. Na początku IV w. n.e. Euzebiusz znał Keilę jako wieś zwaną Kela, około ośmiu mil na wschód od Eleuteropolis, przy drodze do Hebronu, gdzie pokazywano grób proroka Habakuka."
  nl:
    - "Keïla is Khirbet Qila, een terrasvormige heuvel in de oostelijke Sefela, ongeveer 11 km ten oosten van Beit Guvrin, boven de Wadi es-Sur, een arm van het Dal van Ela. Het Arabische dorp Qila ernaast bewaart de oude naam, en negentiende-eeuwse onderzoekers, onder wie Victor Guérin en de Survey of Western Palestine, herkenden de plaats daaraan. Adullam ligt ongeveer 4 km naar het noorden."
    - "Keïla komt al voor in de Amarnabrieven uit de veertiende eeuw v.Chr. als Qiltu, een stad waarom Abdi-Heba, heerser van Jeruzalem, en Shuwardata, een heerser in het laagland, streden. Shuwardata klaagt dat Abdi-Heba aan de mannen van Qiltu schreef en hun zilver aanbood om hem te volgen; Abdi-Heba schrijft op zijn beurt dat Milkilu en Tagi troepen in Qiltu brachten tegen hem."
    - "In het boek Jozua is Keïla een van de steden van het laagland van Juda. Toen de Filistijnen haar dorsvloeren plunderden, vroeg David de HEER, trok met zijn mannen af en “verloste David de inwoners van Kehila”; de priester Abjatar sloot zich daar met de efod bij hem aan. Saul zei dat David “besloten” was, “komende in een stad met poorten en grendelen”, en riep het volk op om haar te belegeren. David vroeg de HEER of de mannen van Keïla hem zouden uitleveren, kreeg ten antwoord “Zij zouden u overgeven”, en vertrok met ongeveer zeshonderd man. Na de ballingschap herstelden Chasabja en Bavvai, elk heerser over de helft van het district Keïla, de muur van Jeruzalem onder Nehemia."
    - "Josephus geeft Davids redding van Keïla opnieuw weer. In het begin van de vierde eeuw n.Chr. kende Eusebius Keïla als een dorp Kela, ongeveer acht mijl ten oosten van Eleutheropolis aan de weg naar Hebron, waar het graf van de profeet Habakuk werd getoond."
  cs:
    - "Keila je Khirbet Qila, terasovitý pahorek ve východní Šefele, asi 11 km východně od Bejt Guvrinu, nad Wádí es-Sur, ramenem Élského údolí. Arabská vesnice Qila vedle něj starý název uchovává a badatelé 19. století, mezi nimi Victor Guérin a Survey of Western Palestine, podle něj místo určili. Adulam leží asi 4 km na sever."
    - "Keila se objevuje už v amarnských dopisech ze 14. století př. n. l. jako Qiltu, město, o které bojovali Abdi-Cheba, vládce Jeruzaléma, a Šuwardata, vládce v nížině. Šuwardata si stěžuje, že Abdi-Cheba psal mužům z Qiltu a nabízel jim stříbro, aby ho následovali; Abdi-Cheba zase píše, že Milkilu a Tagi uvedli do Qiltu vojsko proti němu."
    - "V Knize Jozue je Keila jedním z měst judské nížiny. Když Pelištejci loupili její humna, tázal se David Hospodina, sestoupil s muži a „vysvobodil David obyvatele Cejly“; kněz Abjatar se k němu tam připojil s efódem. Saul řekl, že David „zavřel se, všed do města hrazeného a zavřitého“, a svolal lid, aby je oblehl. David se tázal Hospodina, zda by ho muži z Keily vydali, dostal odpověď „Vydali by“ a odešel s asi šesti sty muži. Po exilu opravovali Chašabjáš a Bavaj, každý vládce poloviny okresu Keily, za Nehemjáše jeruzalémskou zeď."
    - "Josephus vypráví Davidovo vysvobození Keily znovu. Na počátku 4. století n. l. znal Eusebius Keilu jako vesnici zvanou Kela asi osm mil východně od Eleutheropole při cestě do Hebronu, kde se ukazoval hrob proroka Abakuka."
  sv:
    - "Keila är Khirbet Qila, en terrasserad kulle i östra Shefela, omkring 11 km öster om Beit Guvrin, ovanför Wadi es-Sur, en arm av Terebintdalen. Den arabiska byn Qila intill den bevarar det gamla namnet, och upptäcktsresande på 1800-talet, bland dem Victor Guérin och Survey of Western Palestine, identifierade platsen utifrån det. Adullam ligger omkring 4 km norrut."
    - "Keila förekommer redan i Amarnabreven från 1300-talet f.Kr. som Qiltu, en stad som Abdi-Heba, härskare i Jerusalem, och Shuwardata, en härskare i låglandet, stred om. Shuwardata klagar över att Abdi-Heba skrev till männen i Qiltu och erbjöd dem silver för att de skulle följa honom; Abdi-Heba skriver i sin tur att Milkilu och Tagi förde in trupper i Qiltu mot honom."
    - "I Josuas bok är Keila en av städerna i Juda lågland. När filistéerna plundrade dess tröskplatser frågade David HERREN, drog ned med sina män och räddade staden: ”Så frälste David invånarna i Kegila.” Prästen Evjatar anslöt sig till honom där med efoden. Saul sade om David: ”han har själv stängt in sig genom att gå in i en stad med portar och bommar”, och kallade ut folket för att belägra den. David frågade HERREN om Keilas män skulle utlämna honom, fick svaret ”De skola utlämna eder.” och lämnade staden med omkring sexhundra man. Efter exilen reparerade Hashavja och Bavai, var och en härskare över halva Keilas distrikt, Jerusalems mur under Nehemja."
    - "Josefus återberättar Davids räddning av Keila. I början av 300-talet e.Kr. kände Eusebios Keila som en by kallad Kela omkring åtta romerska mil öster om Eleutheropolis på vägen till Hebron, där profeten Habackuks grav visades."
  nb:
    - "Keila er Khirbet Qila, en terrassert høyde i det østlige Sjefela, omkring 11 km øst for Bet Guvrin, over Wadi es-Sur, en arm av Ela-dalen. Den arabiske landsbyen Qila ved siden av har beholdt det gamle navnet, og oppdagelsesreisende på 1800-tallet, blant dem Victor Guérin og Survey of Western Palestine, identifiserte stedet ut fra det. Adullam ligger omkring 4 km mot nord."
    - "Keila forekommer allerede i Amarna-brevene fra 1300-tallet f.Kr. som Qiltu, en by som Abdi-Heba, hersker i Jerusalem, og Shuwardata, en hersker i lavlandet, kjempet om. Shuwardata klager over at Abdi-Heba skrev til mennene i Qiltu og tilbød dem sølv for å følge ham; Abdi-Heba skriver på sin side at Milkilu og Tagi førte tropper inn i Qiltu mot ham."
    - "I Josvas bok er Keila en av byene i lavlandet i Juda. Da filistrene plyndret treskeplassene dens, spurte David Herren, drog ned med mennene sine, og «således frelste David Ke'ilas innbyggere»; presten Abjatar kom til ham der med livkjortelen. Saul sa at David «har stengt sig selv inne ved å gå inn i en by med dobbelte porter og bommer», og kalte folket sammen for å kringsette den. David spurte Herren om Ke'ilas menn ville overgi ham, fikk svaret «Ja, det vil de», og drog bort med omkring seks hundre mann. Etter eksilet bygde Hasjabja og Bavvai, som hver var hersker over halvparten av Keilas distrikt, murene i Jerusalem under Nehemja."
    - "Josefus gjenforteller Davids redning av Keila. Tidlig på 300-tallet e.Kr. kjente Eusebius Keila som en landsby kalt Kela omkring åtte romerske mil øst for Eleutheropolis ved veien til Hebron, der profeten Habakkuks grav ble vist."
  tl:
    - "Ang Ceila ay ang Khirbet Qila, isang burol na may mga hagdan-hagdang lupa sa silangang Sephela, mga 11 km sa silangan ng Beth Guvrin, sa itaas ng Wadi es-Sur, isang sanga ng Libis ng Ela. Ang nayong Arabe ng Qila sa tabi nito ay nagtataglay ng lumang pangalan, at kinilala ang pook mula rito ng mga manggalugad noong ika-19 na siglo, kabilang sina Victor Guérin at ang Survey of Western Palestine. Ang Adullam ay mga 4 km sa hilaga."
    - "Lumilitaw na ang Ceila sa mga liham ng Amarna noong ika-14 na siglo BK bilang Qiltu, isang bayang pinag-aawayan ni Abdi-Heba, pinuno ng Jerusalem, at ni Shuwardata, isang pinuno sa mababang lupain. Dumaraing si Shuwardata na sumulat si Abdi-Heba sa mga tao ng Qiltu, na nag-aalok sa kanila ng pilak upang sumunod sa kaniya; sumusulat naman si Abdi-Heba na nagpasok sina Milkilu at Tagi ng mga tropa sa Qiltu laban sa kaniya."
    - "Sa Aklat ni Josue, ang Ceila ay isa sa mga bayan ng mababang lupain ng Juda. Nang pagnanakawan ng mga Filisteo ang mga giikan nito, nagtanong si David sa Panginoon, lumusong na kasama ng kaniyang mga tauhan, at “iniligtas ni David ang mga tumatahan sa Keila”; sumama sa kaniya roon ang saserdoteng si Abiathar na dala ang efod. Sinabi ni Saul na si David ay “nasarhan sa kaniyang pagpasok sa isang bayan na mayroong mga pintuang-bayan at mga halang”, at ipinatawag ang bayan upang kubkubin ito. Nagtanong si David sa Panginoon kung ibibigay siya ng mga tao ng Ceila, sinagot siya ng “Ibibigay ka nila”, at umalis na may mga animnaraang tauhan. Pagkatapos ng pagkatapon, sina Hasabias at Bavai, na bawat isa ay pinuno ng kalahati ng distrito ng Ceila, ay nagkumpuni ng pader ng Jerusalem sa ilalim ni Nehemias."
    - "Isinasalaysay muli ni Josefo ang pagliligtas ni David sa Ceila. Noong unang bahagi ng ika-4 na siglo AD, kilala ni Eusebio ang Ceila bilang nayong tinatawag na Kela, mga walong milya sa silangan ng Eleutheropolis sa daan patungong Hebron, kung saan ipinakikita ang libingan ng propetang si Habacuc."
  da:
    - "Ke'ila er Khirbet Qila, en terrassebelagt bakke i det østlige Sjefela, omkring 11 km øst for Beth Guvrin, over Wadi es-Sur, en gren af Terebintedalen. Den arabiske landsby Qila ved siden af bevarer det gamle navn, og opdagelsesrejsende i 1800-tallet, blandt dem Victor Guérin og Survey of Western Palestine, identificerede stedet ud fra det. Adullam ligger omkring 4 km mod nord."
    - "Ke'ila optræder allerede i Amarna-brevene fra 1300-tallet f.Kr. som Qiltu, en by, der blev kæmpet om af Abdi-Heba, hersker over Jerusalem, og Shuwardata, en hersker i lavlandet. Shuwardata klager over, at Abdi-Heba skrev til Qiltus mænd og tilbød dem sølv for at følge ham; Abdi-Heba skriver til gengæld, at Milkilu og Tagi bragte tropper ind i Qiltu mod ham."
    - "I Josvas Bog er Ke'ila en af byerne i Judas lavland. Da filisterne plyndrede dens tærskepladser, spurgte David Herren, gik ned med sine mænd og »frelste David Indbyggerne i Keila«; Abjatar, præsten, sluttede sig til ham dér med efoden. Saul sagde, at David var »indelukt, idet han er kommen i en Stad med dobbelte Porte og Stænger«, og kaldte folket ud for at belejre den. David spurgte Herren, om Ke'ilas mænd ville udlevere ham, fik svaret »De skulle overantvorde dig« og drog bort med omkring seks hundrede mand. Efter eksilet istandsatte Hasjabja og Bavai, hver hersker over halvdelen af Ke'ilas distrikt, Jerusalems mur under Nehemias."
    - "Josefus genfortæller Davids redning af Ke'ila. I det tidlige 300-tal e.Kr. kendte Eusebios Ke'ila som en landsby kaldet Kela omkring otte romerske mil øst for Eleutheropolis på vejen til Hebron, hvor profeten Habakkuks grav blev vist."
  sr:
    - "Кеила је Хирбет Кила, терасасто брдо у источној Сефели, око 11 км источно од Бејт Гуврина, изнад Вадија ес-Сур, огранка Долине храстова. Арапско село Кила поред њега чува старо име, а истраживачи из XIX века, међу њима Виктор Герен и Survey of Western Palestine, по њему су одредили налазиште. Одолам лежи око 4 км северно."
    - "Кеила се већ јавља у амарнским писмима из XIV века п. н. е. као Килту, град око ког су се отимали Абди-Хеба, владар Јерусалима, и Шувардата, владар у низији. Шувардата се жали да је Абди-Хеба писао људима Килтуа нудећи им сребро да га следе; Абди-Хеба пак пише да су Милкилу и Таги увели војску у Килту против њега."
    - "У Књизи Исуса Навина Кеила је један од градова јудејске низије. Када су Филистеји пљачкали њена гумна, Давид је питао Господа, сишао са својим људима и спасао Кеилу: „тако избави Давид становнике кеилске“; свештеник Авијатар придружио му се ту с оплећком. Саул је рекао да се Давид „затворио ушавши у град, који има врата и преворнице“, и сазвао народ да га опколи. Давид је питао Господа хоће ли га Кеиљани предати, добио одговор „Предаће“ и отишао са око шест стотина људи. После изгнанства Асавија и Вавај, сваки поглавар над половином краја кеилског, поправљали су зид Јерусалима за Немије."
    - "Јосиф Флавије препричава Давидово избављење Кеиле. Почетком IV века н. е. Јевсевије је знао Кеилу као село по имену Кела око осам миља источно од Елевтеропоља на путу за Хеврон, где се показивао гроб пророка Авакума."
  hu:
    - "Keila a Khirbet Qila, egy teraszos domb a keleti Sefélában, Bét Guvrintől mintegy 11 km-re keletre, a Wadi es-Sur fölött, amely az Éla-völgy egyik ága. A mellette fekvő arab Qila falu megőrizte a régi nevet, és a 19. századi felfedezők, köztük Victor Guérin és a Survey of Western Palestine, ebből azonosították a helyet. Adullám mintegy 4 km-re északra fekszik."
    - "Keila már a Kr. e. 14. századi Amarna-levelekben szerepel Qiltu néven, mint Abdi-Heba jeruzsálemi uralkodó és Suvardata, egy alföldi uralkodó közötti viszálykodás tárgya. Suvardata panaszolja, hogy Abdi-Heba levelet írt Qiltu embereinek, ezüstöt ajánlva nekik, hogy kövessék; Abdi-Heba viszont azt írja, hogy Milkilu és Tagi csapatokat vitt Qiltuba ellene."
    - "Józsué könyvében Keila Júda alföldjének egyik városa. Amikor a filiszteusok a szérűit dúlták, Dávid megkérdezte az Urat, lement az embereivel, és „megszabadítá Dávid Kehilla lakosait”; Abjátár pap ott csatlakozott hozzá az efóddal. Saul azt mondta, hogy Dávid „ott szorult, mivel kulcsos és záros városba méne”, és összehívta a népet az ostromra. Dávid megkérdezte az Urat, hogy Keila férfiai kiszolgáltatják-e, a válasz ez volt: „Kezébe adnak”, és mintegy hatszáz emberével elhagyta a várost. A száműzetés után Hasabja és Bavvai, a keilai kerület egyik-egyik felének fejedelme, Nehémiás alatt javította Jeruzsálem falát."
    - "Josephus elmeséli Dávid keilai megmentését. A Kr. u. 4. század elején Eusebius Keilát Kela nevű falunak ismerte, Eleutheropolistól mintegy nyolc mérföldre keletre, a hebroni úton, ahol Habakuk próféta sírját mutogatták."
  fi:
    - "Keila on Khirbet Qila, terassoitu kukkula itäisessä Sefelassa, noin 11 km Beth Guvrinista itään, Wadi es-Surin yläpuolella, joka on Elan laakson haara. Sen vieressä oleva arabikylä Qila säilyttää vanhan nimen, ja 1800-luvun tutkijat, muiden muassa Victor Guérin ja Survey of Western Palestine, tunnistivat paikan sen perusteella. Adullam sijaitsee noin 4 km pohjoiseen."
    - "Keila esiintyy jo 1300-luvun eaa. Amarna-kirjeissä nimellä Qiltu, kaupunkina, josta taistelivat Jerusalemin hallitsija Abdi-Heba ja alangon hallitsija Shuwardata. Shuwardata valittaa, että Abdi-Heba kirjoitti Qiltun miehille tarjoten heille hopeaa, jotta nämä seuraisivat häntä; Abdi-Heba kirjoittaa vuorostaan, että Milkilu ja Tagi toivat joukkoja Qiltuun häntä vastaan."
    - "Joosuan kirjassa Keila on yksi Juudan alangon kaupungeista. Kun filistealaiset ryöstivät sen puimatantereita, Daavid kysyi Herralta, meni miehineen alas ja ”pelasti Kegilan asukkaat”; pappi Abjatar liittyi häneen siellä kasukan kanssa. Saul sanoi, että Daavid oli ”itse sulkenut itsensä sisälle, kun on mennyt kaupunkiin, jossa on ovet ja salvat”, ja kutsui kansan piirittämään sitä. Daavid kysyi Herralta, luovuttaisivatko Kegilan miehet hänet, sai vastaukseksi ”Luovuttavat” ja lähti noin kuudensadan miehen kanssa. Pakkosiirtolaisuuden jälkeen Hasabja ja Bavvai, kumpikin Keilan piirin toisen puolen päällikkö, korjasivat Jerusalemin muuria Nehemian johdolla."
    - "Josephus kertoo uudelleen Daavidin pelastustyön Keilassa. 300-luvun alussa jaa. Eusebios tunsi Keilan kylänä nimeltä Kela, noin kahdeksan mailin päässä Eleutheropoliksesta itään Hebroniin johtavan tien varrella, ja siellä näytettiin profeetta Habakukin hautaa."
  vi:
    - "Kê-i-la là Khirbet Qila, một ngọn đồi bậc thang ở đông Sê-phê-la, cách Beth Guvrin khoảng 11 km về phía đông, trên Wadi es-Sur, một nhánh của Trũng Ê-la. Làng Ả Rập Qila bên cạnh giữ tên cổ, và các nhà thám hiểm thế kỷ 19, trong đó có Victor Guérin và Survey of Western Palestine, đã nhận ra địa điểm từ tên ấy. A-đu-lam cách khoảng 4 km về phía bắc."
    - "Kê-i-la đã xuất hiện trong các thư Amarna của thế kỷ 14 TCN dưới tên Qiltu, một thành bị tranh giành giữa Abdi-Heba, người cai trị Giê-ru-sa-lem, và Shuwardata, một người cai trị ở vùng đất thấp. Shuwardata than phiền rằng Abdi-Heba đã viết cho người Qiltu, hứa bạc để họ theo mình; đến lượt Abdi-Heba viết rằng Milkilu và Tagi đã đưa quân vào Qiltu chống lại ông."
    - "Trong sách Giô-suê, Kê-i-la là một trong các thành của vùng đất thấp Giu-đa. Khi người Phi-li-tin cướp các sân đạp lúa của thành, Đa-vít cầu vấn Đức Giê-hô-va, đi xuống cùng người của mình và “giải cứu dân Kê-i-la”; thầy tế lễ A-bia-tha theo ông đến đó với ê-phót. Sau-lơ nói rằng Đa-vít “đã đi giam mình trong thành có cửa có then”, và triệu tập dân chúng đến vây thành. Đa-vít cầu vấn Đức Giê-hô-va xem người Kê-i-la có nộp mình không, được đáp “Chúng nó sẽ nộp các ngươi”, và rời đi với khoảng sáu trăm người. Sau thời lưu đày, Ha-sa-bia và Ba-vai, mỗi người cai quản một nửa quận Kê-i-la, đã tu bổ tường thành Giê-ru-sa-lem dưới thời Nê-hê-mi."
    - "Josephus thuật lại việc Đa-vít giải cứu Kê-i-la. Vào đầu thế kỷ 4, Eusebius biết Kê-i-la là một làng tên Kela cách Eleutheropolis khoảng tám dặm về phía đông trên đường đi Hếp-rôn, nơi người ta chỉ mộ của nhà tiên tri Ha-ba-cúc."
  ro:
    - "Cheila este Khirbet Qila, un deal în terase din estul Șefelei, la circa 11 km est de Beth Guvrin, deasupra Wadi es-Sur, o ramură a Văii Elah. Satul arab Qila de lângă el păstrează vechiul nume, iar exploratorii din secolul al XIX-lea, printre ei Victor Guérin și Survey of Western Palestine, au identificat situl pornind de la el. Adulam se află la circa 4 km spre nord."
    - "Cheila apare deja în scrisorile de la Amarna din secolul al XIV-lea î.Hr. ca Qiltu, o cetate disputată între Abdi-Heba, conducătorul Ierusalimului, și Shuwardata, un conducător din câmpie. Shuwardata se plânge că Abdi-Heba a scris oamenilor din Qiltu, oferindu-le argint ca să-l urmeze; Abdi-Heba scrie la rândul lui că Milkilu și Tagi au adus trupe în Qiltu împotriva lui."
    - "În cartea lui Iosua, Cheila este una dintre cetățile din câmpia lui Iuda. Când filistenii îi jefuiau ariile, David l-a întrebat pe Domnul, s-a coborât cu oamenii lui și „a mântuit David pre cei ce lăcueau în Keila”; preotul Abiatar s-a alăturat lui acolo cu efodul. Saul a spus că David „s’a închis intrând în cetate cu porți și cu încuetori” și a chemat poporul să o asedieze. David l-a întrebat pe Domnul dacă oamenii din Cheila îl vor preda, i s-a răspuns „te vor dà” și a plecat cu circa șase sute de oameni. După exil, Hașabia și Bavai, fiecare conducător al unei jumătăți din ținutul Cheilei, au reparat zidul Ierusalimului sub Neemia."
    - "Iosif Flaviu povestește din nou salvarea Cheilei de către David. La începutul secolului al IV-lea d.Hr., Eusebiu cunoștea Cheila ca pe un sat numit Kela, la circa opt mile est de Eleuteropolis, pe drumul spre Hebron, unde se arăta mormântul prorocului Habacuc."
  bg:
    - "Кеила е Хирбет Кила — терасиран хълм в източната Шефела, на около 11 км източно от Бейт Гуврин, над Уади ес-Сур, ръкав на Долината Ела. Арабското село Кила до него пази старото име и изследователите през XIX в., сред тях Виктор Герен и Survey of Western Palestine, отъждествяват мястото по него. Одолам се намира на около 4 км на север."
    - "Кеила се появява още в писмата от Амарна от XIV в. пр.н.е. като Килту — град, за който се борят Абди-Хеба, владетел на Йерусалим, и Шуардата, владетел в низината. Шуардата се оплаква, че Абди-Хеба писал на мъжете от Килту, като им предлагал сребро, за да го последват; Абди-Хеба от своя страна пише, че Милкилу и Таги вкарали войски в Килту срещу него."
    - "В книга Иисус Навин Кеила е един от градовете в низината на Юда. Когато филистимците ограбвали хармановете ѝ, Давид попита Господа, слезе с мъжете си и „избави… Кеилските жители“; там при него дойде свещеникът Авиатар с ефода. Саул каза, че Давид „влезе и се затвори в град който има врати и вереи“, и свика народа да го обсади. Давид попита Господа дали мъжете от Кеила ще го предадат, получи отговор „Ще предадат“ и си отиде с около шестстотин мъже. След изгнанието Хашавия и Вавай, всеки от които управлявал половината от Кеилския окръг, поправяха стената на Йерусалим при Неемия."
    - "Йосиф Флавий преразказва избавянето на Кеила от Давид. В началото на IV в. н.е. Евсевий познава Кеила като село, наречено Кела, на около осем мили източно от Елевтерополис по пътя към Хеврон, където се показвал гробът на пророк Авакум."
