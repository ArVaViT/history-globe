body:
  en:
    - "Beth-pelet, “house of escape”, was a town of the Negeb of Judah, known from two lists and from nothing else. Joshua names it in the first, southern district of Judah's towns, “toward the coast of Edom”: “And Hazar-gaddah, and Heshmon, and Beth-palet”. After the exile it was settled again; Nehemiah's roll of the villages of Judah has “at Jeshua, and at Moladah, and at Beth-phelet”, in the same southern country around Beersheba. Helez the Paltite, one of David's thirty, may have come from here, if his name is a gentilic of the town."
    - "No site is known. Flinders Petrie called Tell el-Far'ah South, the large mound on the Besor stream, Beth-Pelet when he dug it at the end of the 1920s and published it under that name, but the identification was never accepted, and the mound is now usually taken for Sharuhen. Tell es-Saqati, north-east of Beersheba, Giv'at Hablanim, south-west of it, and Tel Masos, the usual site of Hormah, have each been suggested on no more than position. The town lay somewhere in the northern Negev of Israel around Beersheba; that is as much as can be said."
  ru:
    - "Веф-Палет, «дом спасения», — город в Негеве Иудином, известный из двух списков и больше ниоткуда. Книга Иисуса Навина называет его в первом, южном округе городов Иуды, «в смежности с Идумеею на юге»: «Хацар-Гадда, Хешмон и Веф-Палет». После плена он был заселён вновь; перечень селений Иуды у Неемии даёт «в Иешуе, в Моладе и в Беф-Палете», в той же южной стране вокруг Вирсавии. Херец Палтитянин, один из тридцати храбрых Давида, мог быть отсюда, если его прозвище образовано от имени города."
    - "Место неизвестно. Флиндерс Питри назвал Веф-Палетом Телль-эль-Фару Южную, большой холм на потоке Бесор, когда копал его в конце 1920-х годов, и под этим именем издал раскопки, но отождествление так и не приняли, и теперь в холме обычно видят Шарухен. Телль-эс-Сакати к северо-востоку от Беэр-Шевы, Гиват-ха-Бланим к юго-западу от неё и Тель-Масос, обычное место Хормы, предлагали лишь по положению. Город лежал где-то в северном Негеве Израиля вокруг Беэр-Шевы; больше сказать нечего."
  uk:
    - "Бет-Палет, «дім порятунку», було містом Негеву Юди, відомим із двох переліків і ні з чого іншого. Ісус Навин називає його в першому, південному окрузі міст Юди, «проти гряницї Ідумейської»: «Газар-Гадда, та Хешмон та Бет-Палет». Після вигнання його заселили знову; у Неемієвому переліку сіл Юди є «В Ешуї, в Моладї й Бет-Палетї», у тому самому південному краї навколо Беер-Шеви. Хелец Палтянин, один з тридцяти Давида, міг походити звідси, якщо його ім'я — етнонім міста."
    - "Місце невідоме. Фліндерс Петрі назвав Телль-ель-Фараг Південний, великий пагорб на потоці Бесор, Бет-Палетом, коли розкопував його наприкінці 1920-х років і опублікував під цією назвою, але ототожнення ніколи не було прийняте, і пагорб нині зазвичай вважають Шарухеном. Телль-ес-Сакаті на північний схід від Беер-Шеви, Гів'ат-Хабланім на південний захід від неї і Тель-Масос, звичайне місце Хорми, пропонували лише за розташуванням. Місто лежало десь у північному Негеві Ізраїлю навколо Беер-Шеви; це все, що можна сказати."
  es:
    - "Bet-pelet, «casa de escape», era una ciudad del Néguev de Judá, conocida por dos listas y por nada más. Josué la nombra en el primer distrito, el meridional, de las ciudades de Judá, «hacia el término de Edom»: «Y Asar-gadda, y Hesmón, y Beth-pelet». Tras el exilio fue poblada de nuevo; el registro de Nehemías de las aldeas de Judá tiene «Y en Jesuá, Moladah, y en Beth-pelet», en la misma región meridional en torno a Beerseba. Heles el paltita, uno de los treinta de David, pudo proceder de aquí, si su nombre es un gentilicio de la ciudad."
    - "No se conoce ningún sitio. Flinders Petrie llamó Bet-pelet a Tell el-Far'ah Sur, el gran montículo del arroyo Besor, cuando lo excavó a finales de la década de 1920 y lo publicó con ese nombre, pero la identificación nunca fue aceptada, y el montículo se toma ahora por lo común por Saruhén. Tell es-Saqati, al nordeste de Beerseba, Giv'at Hablanim, al sudoeste de ella, y Tel Masos, el sitio habitual de Horma, han sido sugeridos cada uno sin más base que la posición. La ciudad se hallaba en algún lugar del Néguev septentrional de Israel, en torno a Beerseba; eso es todo lo que puede decirse."
  pt:
    - "Bete-Pelete, “casa de fuga”, era uma cidade do Neguebe de Judá, conhecida por duas listas e por nada mais. Josué a nomeia no primeiro distrito, o meridional, das cidades de Judá, “em direção à fronteira de Edom”: “Hazar-Gada, Hesmom, Bete-Pelete”. Depois do exílio foi povoada de novo; o rol de Neemias das aldeias de Judá tem “em Jesua, em Molada, em Bete-Pelete”, na mesma região meridional em torno de Berseba. Helez, o paltita, um dos trinta de Davi, pode ter vindo daqui, se o seu nome é um gentílico da cidade."
    - "Nenhum sítio é conhecido. Flinders Petrie chamou Tell el-Far'ah Sul, o grande montículo no riacho Besor, de Bete-Pelete quando o escavou no fim da década de 1920 e o publicou com esse nome, mas a identificação nunca foi aceita, e o montículo costuma ser hoje tomado por Saruém. Tell es-Saqati, a nordeste de Berseba, Giv'at Hablanim, a sudoeste, e Tel Masos, o sítio habitual de Hormá, foram sugeridos, cada um só pela posição. A cidade ficava em algum ponto do norte do Neguev de Israel, em torno de Berseba; é tudo o que se pode dizer."
  de:
    - "Bet-Pelet, „Haus der Rettung“, war eine Stadt im Negev von Juda, aus zwei Listen und sonst nichts bekannt. Josua nennt sie im ersten, südlichen Bezirk der Städte Judas, „an der Grenze der Edomiter gegen Mittag“: „Hazar-Gadda, Hesmon, Beth-Pelet“. Nach dem Exil wurde sie wieder besiedelt; Nehemias Verzeichnis der Dörfer Judas hat „und zu Jesua, Molada, Beth-Pelet“, im selben südlichen Land um Beerscheba. Heles der Paltiter, einer von Davids Dreißig, mag von hier gekommen sein, wenn sein Name ein Herkunftsname der Stadt ist."
    - "Keine Stätte ist bekannt. Flinders Petrie nannte Tell el-Far'a Süd, den großen Hügel am Bach Besor, Bet-Pelet, als er ihn Ende der 1920er Jahre ausgrub und unter diesem Namen veröffentlichte, doch die Gleichsetzung wurde nie angenommen, und der Hügel gilt jetzt gewöhnlich als Scharuhen. Tell es-Saqati, nordöstlich von Beerscheba, Giv'at Hablanim, südwestlich davon, und Tel Masos, die übliche Stätte von Horma, wurden jeweils aus nicht mehr als der Lage vorgeschlagen. Die Stadt lag irgendwo im nördlichen Negev Israels um Beerscheba; mehr lässt sich nicht sagen."
  fr:
    - "Beth-Pelet, « maison d’évasion », était une ville du Négev de Juda, connue par deux listes et rien d’autre. Josué la nomme dans le premier district méridional des villes de Juda, « vers la frontière d’Édom » : « Hatsar-Gadda, Heschmon, Beth-Paleth ». Après l’exil, elle fut de nouveau peuplée ; la liste de Néhémie des villages de Juda porte « à Jéschua, à Molada, à Beth-Paleth », dans le même pays méridional autour de Beer-Schéba. Halets de Péleth, l’un des trente de David, venait peut-être d’ici, si son nom est un gentilé de la ville."
    - "Aucun site n’est connu. Flinders Petrie appela Beth-Pelet Tell el-Far’ah Sud, grand tertre sur le torrent de Besor, quand il le fouilla à la fin des années 1920 et le publia sous ce nom, mais l’identification ne fut jamais admise, et le tertre est maintenant d’ordinaire tenu pour Scharuchen. Tell es-Saqati, au nord-est de Beer-Schéba, Giv’at Hablanim, au sud-ouest, et Tel Masos, site habituel de Horma, ont chacun été suggérés sur la seule position. La ville se trouvait quelque part dans le nord du Négev israélien autour de Beer-Schéba ; c’est tout ce qu’on peut dire."
  it:
    - "Bet-Pelet, «casa della fuga», era una città del Negheb di Giuda, nota da due elenchi e da nient’altro. Giosuè la nomina nel primo distretto meridionale delle città di Giuda, «verso il confine di Edom»: «Hatsar-Gadda, Heshmon, Beth-Palet». Dopo l’esilio fu abitata di nuovo; l’elenco di Neemia dei villaggi di Giuda ha «in Jeshua, in Molada in Beth-Paleth», nello stesso paese meridionale intorno a Bersabea. Cheles il Paltita, uno dei trenta di Davide, può essere venuto di qui, se il suo nome è un gentilizio della città."
    - "Nessun sito è noto. Flinders Petrie chiamò Bet-Pelet Tell el-Far‘ah Sud, il grande tell sul torrente Besor, quando lo scavò alla fine degli anni Venti e lo pubblicò con tale nome, ma l’identificazione non fu mai accettata, e il tell è ora di solito ritenuto Saruchen. Tell es-Saqati, a nord-est di Bersabea, Giv‘at Hablanim, a sud-ovest, e Tel Masos, il sito abituale di Corma, sono stati ciascuno suggeriti per la sola posizione. La città sorgeva da qualche parte nel Negheb settentrionale di Israele intorno a Bersabea; è tutto ciò che si può dire."
  pl:
    - "Bet-Pelet, „dom ucieczki”, było miastem Negewu Judy, znanym z dwóch wykazów i z niczego więcej. Jozue wymienia je w pierwszym, południowym okręgu miast Judy, „podle granicy Edom ku południowi”: „I Asorgadda, i Hessemon, i Betfalet”. Po wygnaniu zasiedlono je znów; wykaz wsi Judy u Nehemiasza ma „I w Jesue, i w Molada, i w Betfelet”, w tym samym południowym kraju wokół Beer-Szeby. Cheles Paltyta, jeden z trzydziestu Dawida, mógł stąd pochodzić, jeśli jego przydomek jest nazwą mieszkańca miasta."
    - "Miejsce nie jest znane. Flinders Petrie nazwał Tell el-Far'ah (Południe), wielki tell nad strumieniem Besor, Bet-Pelet, gdy kopał go pod koniec lat 20. i publikował pod tą nazwą, lecz utożsamienia nigdy nie przyjęto, a tell uważa się dziś zwykle za Szaruchen. Tell es-Saqati na północny wschód od Beer-Szeby, Giv'at Hablanim na południowy zachód od niego i Tel Masos, zwykłe miejsce Hormy, proponowano na podstawie samego położenia. Miasto leżało gdzieś w północnym Negewie Izraela wokół Beer-Szeby; tyle można powiedzieć."
  nl:
    - "Beth-Pelet, “huis van de ontkoming”, was een stad in de Negev van Juda, bekend uit twee lijsten en uit niets anders. Jozua noemt haar in het eerste, zuidelijke district van Juda’s steden, “tot de landpale van Edom, tegen het zuiden”: “En Hazar-Gadda, en Hesmon, en Beth-Palet”. Na de ballingschap werd zij opnieuw bewoond; Nehemia’s lijst van de dorpen van Juda heeft “En te Jesua, en te Molada, en te Beth-Pelet”, in hetzelfde zuidelijke land rond Berseba. Chelez de Paltiet, een van Davids dertig, kwam misschien van hier, als zijn naam een bijvoeglijke vorm van de stad is."
    - "Geen plaats is bekend. Flinders Petrie noemde Tell el-Far’ah Zuid, de grote heuvel aan de Besorbeek, Beth-Pelet toen hij die eind jaren twintig opgroef en onder die naam publiceerde, maar de identificatie werd nooit aanvaard, en de heuvel wordt nu gewoonlijk voor Saruhen gehouden. Tell es-Saqati, ten noordoosten van Berseba, Giv’at Hablanim, ten zuidwesten ervan, en Tel Masos, de gebruikelijke plaats van Chorma, zijn elk voorgesteld op niet meer dan ligging. De stad lag ergens in de noordelijke Negev van Israël rond Berseba; meer kan niet gezegd worden."
  cs:
    - "Bét-pelet, „dům úniku“, bylo město judského Negevu, známé ze dvou seznamů a z ničeho jiného. Jozue je jmenuje v prvním, jižním okrsku judských měst, při pomezí Edómu: „A Azar Gadda, a Esmon, a Betfelet“. Po vyhnanství bylo osídleno znovu; Nehemjášův soupis vesnic Judových má „A v Jesua, v Molada, v Betfelet“, ve stejné jižní zemi kolem Beer-šeby. Cheles Paltský, jeden z Davidových třiceti, mohl pocházet odtud, je-li jeho přízvisko označením původu z města."
    - "Místo není známo. Flinders Petrie nazval Tell el-Far'ah (jižní), velký pahorek na potoce Besor, Bét-pelet, když jej koncem 20. let kopal a pod tímto jménem publikoval, ale ztotožnění nebylo nikdy přijato a pahorek je dnes obvykle pokládán za Šaruchen. Tell es-Saqati, severovýchodně od Beer-šeby, Giv'at Hablanim, jihozápadně od ní, a Tel Masos, obvyklé místo Chormy, byly navrženy každý jen podle polohy. Město leželo někde v severním Negevu Izraele kolem Beer-šeby; víc říci nelze."
  sv:
    - "Bet-Pelet, ”flyktens hus”, var en stad i Judas Negev, känd från två förteckningar och inget annat. Josua nämner den i det första, södra distriktet av Judas städer, ”mot Edoms gräns”: ”Hasar-Gadda, Hesmon, Bet-Pelet”. Efter exilen bosattes den på nytt; Nehemjas förteckning över Judas byar har ”i Jesua, Molada, Bet-Pelet”, i samma södra land kring Beer Sheva. Peletiten Heles, en av Davids trettio, kan ha kommit härifrån, om hans namn är en hemortsbeteckning efter staden."
    - "Ingen plats är känd. Flinders Petrie kallade Tell el-Far'ah söder, den stora kullen vid Besor-bäcken, Bet-Pelet när han grävde ut den i slutet av 1920-talet och publicerade den under det namnet, men identifieringen godtogs aldrig, och kullen tas nu vanligen för Sharuhen. Tell es-Saqati, nordost om Beer Sheva, Giv'at Hablanim, sydväst om den, och Tel Masos, den vanliga platsen för Horma, har var och en föreslagits på inget mer än läget. Staden låg någonstans i norra Negev i Israel kring Beer Sheva; det är så mycket som kan sägas."
  nb:
    - "Bet-Pelet, «flukthuset», var en by i Negev i Juda, kjent fra to lister og ellers ikke. Josva nevner den i det første, sørlige distriktet av Judas byer, «ved den ytterste grense av Judas barns stamme mot Edoms landemerke, i sydlandet»: «Hasur-Gadda og Hesmon og Bet-Pelet». Etter eksilet ble den gjenbosatt; Nehemjas register over landsbyene i Juda har «i Jesua, Molada, Bet-Pelet», i det samme sørlige landet rundt Beer-Sjeba. «Paltitten Heles», en av Davids tretti, kan ha kommet herfra, hvis navnet hans er en stedsbetegnelse for byen."
    - "Intet sted er kjent. Flinders Petrie kalte Tell el-Far'ah (sør), den store tellen ved Besor-bekken, for Bet-Pelet da han gravde den ved slutten av 1920-årene og publiserte den under det navnet, men identifiseringen ble aldri godtatt, og tellen regnes nå vanligvis for Saruhen. Tell es-Saqati, nordøst for Beer-Sjeba, Giv'at Hablanim, sørvest for den, og Tel Masos, det vanlige stedet for Horma, er hver foreslått ut fra beliggenhet alene. Byen lå et sted i nordlige Negev i Israel rundt Beer-Sjeba; det er alt som kan sies."
  tl:
    - "Ang Beth-pelet, “bahay ng pagtakas”, ay bayan ng Negeb ng Juda, na kilala mula sa dalawang talaan at wala nang iba. Pinangalanan ito ni Josue sa una, katimugang distrito ng mga bayan ng Juda, “sa dako ng hangganan ng Edom sa timugan”: “At Asar-gadda, at Hesmon, at Beth-pelet”. Pagkatapos ng pagkabihag, muli itong tinirhan; ang talaan ni Nehemias ng mga nayon ng Juda ay may “At sa Jesua, at sa Moladah, at sa Beth-pelet”, sa parehong katimugang lupain sa palibot ng Beer-seba. Si Heles na Paltita, isa sa tatlumpu ni David, ay maaaring taga-rito, kung ang kaniyang pangalan ay pang-uri ng bayan."
    - "Walang kilalang lugar. Tinawag ni Flinders Petrie na Beth-pelet ang Tell el-Far'ah Timugan, ang malaking burol sa batis ng Besor, nang hukayin niya ito sa katapusan ng dekada 1920 at ilathala sa pangalang iyon, ngunit hindi kailanman tinanggap ang pagtutukoy, at ang burol ay karaniwang itinuturing na ngayong Saruhen. Iminungkahi ang Tell es-Saqati, hilagang-silangan ng Beer-seba, Giv'at Hablanim, timog-kanluran nito, at Tel Masos, ang karaniwang lugar ng Horma, batay sa posisyon lamang. Nasa hilagang Negev ng Israel ang bayan sa palibot ng Beer-seba; iyon na ang masasabi."
  da:
    - "Bet-Pelet, »undslippelsens hus«, var en by i Judas Negev, kendt fra to lister og intet andet. Josva nævner den i Judas byers første, sydlige distrikt, »op mod Edoms Landemærke Sønder paa«: »og Hazor-Gadda og Hesmon og Beth-Peleth«. Efter eksilet blev den bosat igen; Nehemias' fortegnelse over Judas landsbyer har »og i Jesua og i Molada og i Beth-Peleth«, i det samme sydlige land omkring Beersheba. Helez, »Palthiteren«, en af Davids tredive, kan have været herfra, hvis hans navn er et stedsnavn-tilnavn til byen."
    - "Intet sted er kendt. Flinders Petrie kaldte Tell el-Far'ah syd, den store tell ved Besor-bækken, Bet-Pelet, da han gravede den i slutningen af 1920'erne og udgav den under det navn, men identifikationen blev aldrig accepteret, og tellen tages nu sædvanligvis for Sjaruhen. Tell es-Saqati, nordøst for Beersheba, Giv'at Hablanim, sydvest for den, og Tel Masos, det sædvanlige sted for Horma, er hver især foreslået ud fra blot beliggenhed. Byen lå et sted i Israels nordlige Negev omkring Beersheba; mere kan ikke siges."
  sr:
    - "Вет-Фалет, „дом бекства“, био је град Негева Јудиног, познат из два списка и ни по чему другом. Исус Навин га именује у првом, јужном округу градова Јуде, „дуж међе едомске к југу“: „и Асар-Гада и Есемон и Вет-Фалет“. После изгнанства поново је насељен; Немијин списак јудејских села има „и у Јесуји и Молади и Вет-Фелету“, у истом јужном крају око Вирсавеје. Хелис Фалћанин, један од Давидове тридесеторице, можда је био одавде, ако је његово име одредница града."
    - "Налазиште није познато. Флиндерс Петри је Тел ел-Фара Јужни, велику хумку на потоку Восор, назвао Вет-Фалет када ју је ископавао крајем 1920-их и објавио под тим именом, али поистовећивање никад није прихваћено, а хумка се данас обично узима за Саруен. Тел ес-Сакати, североисточно од Вирсавеје, Гиват Хабланим, југозападно од ње, и Тел Масос, уобичајено налазиште Хорме, предлагани су сваки само на основу положаја. Град је лежао негде у северном Негеву Израела око Вирсавеје; то је све што се може рећи."
scripture:
  - Josh.15.21
  - Josh.15.27
  - Neh.11.26
  - 2Sam.23.26
sources:
