# Overview article (ADR 0007). Mainstream facts only; two list entries and a possible gentilic; Petrie's Beth-Pelet at Tell el-Far'ah is given as a rejected identification; no site.
id: beth-pelet
place: ac4b767
title:
  en: "Beth-pelet"
  ru: "Веф-Палет"
  uk: "Бет-Палет"
  es: "Bet-pelet"
  pt: "Bete-Pelete"
  de: "Bet-Pelet"
  fr: "Beth-Pelet"
body:
  en:
    - "Beth-pelet, “house of escape”, was a town of the Negeb of Judah, known from two lists and from nothing else. Joshua names it in the first, southern district of Judah's towns, “toward the coast of Edom”: “And Hazar-gaddah, and Heshmon, and Beth-palet”. After the exile it was settled again; Nehemiah's roll of the villages of Judah has “at Jeshua, and at Moladah, and at Beth-phelet”, in the same southern country around Beersheba. Helez the Paltite, one of David's thirty, may have come from here, if his name is a gentilic of the town."
    - "No site is known. Flinders Petrie called Tell el-Far'ah South, the large mound on the Besor stream, Beth-Pelet when he dug it at the end of the 1920s and published it under that name, but the identification was never accepted, and the mound is now usually taken for Sharuhen. Tell es-Saqati, north-east of Beersheba, Giv'at Hablanim, south-west of it, and Tel Masos, the usual site of Hormah, have each been suggested on no more than position. The town lay somewhere in the northern Negev of Israel around Beersheba; that is as much as can be said."
  ru:
    - "Веф-Палет, «дом спасения», — город в Негеве Иудином, известный из двух списков и больше ниоткуда. Книга Иисуса Навина называет его в первом, южном округе городов Иуды, «в смежности с Идумеею на юге»: «Хацар-Гадда, Хешмон и Веф-Палет». После плена он был заселён вновь; перечень селений Иуды у Неемии даёт «в Иешуе, в Моладе и в Беф-Палете», в той же южной стране вокруг Вирсавии. Херец Палтитянин, один из тридцати храбрых Давида, мог быть отсюда, если его прозвище образовано от имени города."
    - "Место неизвестно. Флиндерс Питри назвал Веф-Палетом Телль-эль-Фару Южную, большой холм на потоке Бесор, когда копал его в конце 1920-х годов, и под этим именем издал раскопки, но отождествление так и не приняли, и теперь в холме обычно видят Шарухен. Телль-эс-Сакати к северо-востоку от Беэр-Шевы, Гиват-ха-Бланим к юго-западу от неё и Тель-Масос, обычное место Хормы, предлагали лишь по положению. Город лежал где-то в северном Негеве Израиля вокруг Беэр-Шевы; больше сказать нечего."
  uk:
    - "Бет-Палет, «дім порятунку», було містом Негеву Юди, відомим із двох переліків і ні з чого іншого. Ісус Навин називає його в першому, південному окрузі міст Юди, «проти гряницї Ідумейської»: «Газар-Гадда, та Хешмон та Бет-Палет». Після вигнання його заселили знову; у Неемієвому переліку сіл Юди є «В Ешуї, в Моладї й Бет-Палетї», у тому самому південному краї навколо Беер-Шеви. Хелец Палтянин, один з тридцяти Давида, міг походити звідси, якщо його ім'я — етнонім міста."
    - "Місце невідоме. Фліндерс Петрі назвав Телль-ель-Фараг Південний, великий пагорб на потоці Бесор, Бет-Палетом, коли розкопував його наприкінці 1920-х років і опублікував під цією назвою, але ототожнення ніколи не було прийняте, і пагорб нині зазвичай вважають Шарухеном. Телль-ес-Сакаті на північний схід від Беер-Шеви, Гів'ат-Хабланім на південний захід від неї і Тель-Масос, звичайне місце Хорми, пропонували лише за розташуванням. Місто лежало десь у північному Негеві Ізраїлю навколо Беер-Шеви; це все, що можна сказати."
  es:
    - "Bet-pelet, «casa de escape», era una ciudad del Néguev de Judá, conocida por dos listas y por nada más. Josué la nombra en el primer distrito, el meridional, de las ciudades de Judá, «hacia el término de Edom»: «Y Asar-gadda, y Hesmón, y Beth-pelet». Tras el exilio fue poblada de nuevo; el registro de Nehemías de las aldeas de Judá tiene «Y en Jesuá, Moladah, y en Beth-pelet», en la misma región meridional en torno a Beerseba. Heles el paltita, uno de los treinta de David, pudo proceder de aquí, si su nombre es un gentilicio de la ciudad."
    - "No se conoce ningún sitio. Flinders Petrie llamó Bet-pelet a Tell el-Far'ah Sur, el gran montículo del arroyo Besor, cuando lo excavó a finales de la década de 1920 y lo publicó con ese nombre, pero la identificación nunca fue aceptada, y el montículo se toma ahora por lo común por Saruhén. Tell es-Saqati, al nordeste de Beerseba, Giv'at Hablanim, al sudoeste de ella, y Tel Masos, el sitio habitual de Horma, han sido sugeridos cada uno sin más base que la posición. La ciudad se hallaba en algún lugar del Néguev septentrional de Israel, en torno a Beerseba; eso es todo lo que puede decirse."
  pt:
    - "Bete-Pelete, “casa de fuga”, era uma cidade do Neguebe de Judá, conhecida por duas listas e por nada mais. Josué a nomeia no primeiro distrito, o meridional, das cidades de Judá, “em direção à fronteira de Edom”: “Hazar-Gada, Hesmom, Bete-Pelete”. Depois do exílio foi povoada de novo; o rol de Neemias das aldeias de Judá tem “em Jesua, em Molada, em Bete-Pelete”, na mesma região meridional em torno de Berseba. Helez, o paltita, um dos trinta de Davi, pode ter vindo daqui, se o seu nome é um gentílico da cidade."
    - "Nenhum sítio é conhecido. Flinders Petrie chamou Tell el-Far'ah Sul, o grande montículo no riacho Besor, de Bete-Pelete quando o escavou no fim da década de 1920 e o publicou com esse nome, mas a identificação nunca foi aceita, e o montículo costuma ser hoje tomado por Saruém. Tell es-Saqati, a nordeste de Berseba, Giv'at Hablanim, a sudoeste, e Tel Masos, o sítio habitual de Hormá, foram sugeridos, cada um só pela posição. A cidade ficava em algum ponto do norte do Neguev de Israel, em torno de Berseba; é tudo o que se pode dizer."
  de:
    - "Bet-Pelet, „Haus der Rettung“, war eine Stadt im Negev von Juda, aus zwei Listen und sonst nichts bekannt. Josua nennt sie im ersten, südlichen Bezirk der Städte Judas, „an der Grenze der Edomiter gegen Mittag“: „Hazar-Gadda, Hesmon, Beth-Pelet“. Nach dem Exil wurde sie wieder besiedelt; Nehemias Verzeichnis der Dörfer Judas hat „und zu Jesua, Molada, Beth-Pelet“, im selben südlichen Land um Beerscheba. Heles der Paltiter, einer von Davids Dreißig, mag von hier gekommen sein, wenn sein Name ein Herkunftsname der Stadt ist."
    - "Keine Stätte ist bekannt. Flinders Petrie nannte Tell el-Far'a Süd, den großen Hügel am Bach Besor, Bet-Pelet, als er ihn Ende der 1920er Jahre ausgrub und unter diesem Namen veröffentlichte, doch die Gleichsetzung wurde nie angenommen, und der Hügel gilt jetzt gewöhnlich als Scharuhen. Tell es-Saqati, nordöstlich von Beerscheba, Giv'at Hablanim, südwestlich davon, und Tel Masos, die übliche Stätte von Horma, wurden jeweils aus nicht mehr als der Lage vorgeschlagen. Die Stadt lag irgendwo im nördlichen Negev Israels um Beerscheba; mehr lässt sich nicht sagen."
  fr:
    - "Beth-Pelet, « maison d’évasion », était une ville du Négev de Juda, connue par deux listes et rien d’autre. Josué la nomme dans le premier district méridional des villes de Juda, « vers la frontière d’Édom » : « Hatsar-Gadda, Heschmon, Beth-Paleth ». Après l’exil, elle fut de nouveau peuplée ; la liste de Néhémie des villages de Juda porte « à Jéschua, à Molada, à Beth-Paleth », dans le même pays méridional autour de Beer-Schéba. Halets de Péleth, l’un des trente de David, venait peut-être d’ici, si son nom est un gentilé de la ville."
    - "Aucun site n’est connu. Flinders Petrie appela Beth-Pelet Tell el-Far’ah Sud, grand tertre sur le torrent de Besor, quand il le fouilla à la fin des années 1920 et le publia sous ce nom, mais l’identification ne fut jamais admise, et le tertre est maintenant d’ordinaire tenu pour Scharuchen. Tell es-Saqati, au nord-est de Beer-Schéba, Giv’at Hablanim, au sud-ouest, et Tel Masos, site habituel de Horma, ont chacun été suggérés sur la seule position. La ville se trouvait quelque part dans le nord du Négev israélien autour de Beer-Schéba ; c’est tout ce qu’on peut dire."
