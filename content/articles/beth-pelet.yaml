# Overview article (ADR 0007). Mainstream facts only; two list entries and a possible gentilic; Petrie's Beth-Pelet at Tell el-Far'ah is given as a rejected identification; no site.
id: beth-pelet
place: ac4b767
title:
  en: "Beth-pelet"
  ru: "Веф-Палет"
body:
  en:
    - "Beth-pelet, “house of escape”, was a town of the Negeb of Judah, known from two lists and from nothing else. Joshua names it in the first, southern district of Judah's towns, “toward the coast of Edom”: “And Hazar-gaddah, and Heshmon, and Beth-palet”. After the exile it was settled again; Nehemiah's roll of the villages of Judah has “at Jeshua, and at Moladah, and at Beth-phelet”, in the same southern country around Beersheba. Helez the Paltite, one of David's thirty, may have come from here, if his name is a gentilic of the town."
    - "No site is known. Flinders Petrie called Tell el-Far'ah South, the large mound on the Besor stream, Beth-Pelet when he dug it at the end of the 1920s and published it under that name, but the identification was never accepted, and the mound is now usually taken for Sharuhen. Tell es-Saqati, north-east of Beersheba, Giv'at Hablanim, south-west of it, and Tel Masos, the usual site of Hormah, have each been suggested on no more than position. The town lay somewhere in the northern Negev of Israel around Beersheba; that is as much as can be said."
  ru:
    - "Веф-Палет, «дом спасения», — город в Негеве Иудином, известный из двух списков и больше ниоткуда. Книга Иисуса Навина называет его в первом, южном округе городов Иуды, «в смежности с Идумеею на юге»: «Хацар-Гадда, Хешмон и Веф-Палет». После плена он был заселён вновь; перечень селений Иуды у Неемии даёт «в Иешуе, в Моладе и в Беф-Палете», в той же южной стране вокруг Вирсавии. Херец Палтитянин, один из тридцати храбрых Давида, мог быть отсюда, если его прозвище образовано от имени города."
    - "Место неизвестно. Флиндерс Питри назвал Веф-Палетом Телль-эль-Фару Южную, большой холм на потоке Бесор, когда копал его в конце 1920-х годов, и под этим именем издал раскопки, но отождествление так и не приняли, и теперь в холме обычно видят Шарухен. Телль-эс-Сакати к северо-востоку от Беэр-Шевы, Гиват-ха-Бланим к юго-западу от неё и Тель-Масос, обычное место Хормы, предлагали лишь по положению. Город лежал где-то в северном Негеве Израиля вокруг Беэр-Шевы; больше сказать нечего."
scripture:
  - Josh.15.27
  - Neh.11.26
  - 2Sam.23.26
sources:
