# Overview article (ADR 0007). Mainstream facts only; the two mounds of Tulul edh-Dhahab are given as the candidates on the map with the usual assignment (east = Penuel) noted as not certain.
id: penuel
place: a8a9ff9
title:
  en: "Penuel"
  ru: "Пенуэл"
  uk: "Пенуел"
  es: "Peniel"
  pt: "Peniel"
  de: "Penuel"
  fr: "Peniel"
body:
  en:
    - "Penuel, or Peniel, “the face of God”, is the place on the Jabbok where Jacob wrestled through the night with a stranger, was lamed in the thigh, received the name Israel, and said, “I have seen God face to face, and my life is preserved”; “and as he passed over Penuel the sun rose upon him, and he halted upon his thigh”. Hosea remembers that “he had power over the angel, and prevailed”. The ford lay on Jacob's road home from Haran to Succoth and Shechem, in the gorge where the Jabbok (Wadi Zarqa) cuts through the hills of Gilead down to the Jordan valley."
    - "By the time of the judges there was a town with a tower. Gideon, chasing the Midianite kings, asked bread of Succoth and then of Penuel, was refused by both, and on his return “beat down the tower of Penuel, and slew the men of the city”. Jeroboam I, after fortifying Shechem, “went out from thence, and built Penuel”, perhaps as a stronghold for his lands east of the Jordan, and the name appears in the list of towns that Pharaoh Shoshenq I took about 925 BC."
    - "The site is sought at Tulul edh-Dhahab, “the mounds of gold”, two steep hills on either side of a bend of the Zarqa about a dozen kilometres east of the Jordan. Many take the larger western hill for Mahanaim and the eastern, Tell edh-Dhahab esh-Sharqi, for Penuel, but the assignment is not certain and some look for Penuel elsewhere. A German team under Thomas Pola has excavated the western hill since 2005, finding Iron Age remains, incised stone blocks of the eighth century BC and a Hellenistic and early Roman fortified building. Eusebius knew only that the place lay by the Jabbok. The gorge is now in Jordan, with the King Talal dam about 10 km upstream."
  ru:
    - "Пенуэл, или Пениэл, «лицо Божие», — место на Иавоке, где Иаков всю ночь боролся с Неким, повредил бедро, получил имя Израиль и сказал: «я видел Бога лицем к лицу, и сохранилась душа моя»; «И взошло солнце, когда он проходил Пенуэл; и хромал он на бедро свое». Осия помнит, что «Он боролся с Ангелом — и превозмог». Брод лежал на пути Иакова домой из Харрана в Сокхоф и Сихем, в ущелье, где Иавок (Вади-Зарка) прорезает горы Галаада, спускаясь к долине Иордана."
    - "Ко времени судей здесь был город с башней. Гедеон, преследуя мадиамских царей, просил хлеба у Сокхофа, потом у Пенуэла, получил отказ от обоих и на обратном пути «башню Пенуэльскую разрушил, и перебил жителей города». Иеровоам I, укрепив Сихем, «оттуда пошел и построил Пенуэл» — возможно, как опору для своих земель за Иорданом, — и это имя стоит в списке городов, взятых фараоном Шешонком I около 925 г. до н. э."
    - "Место ищут в Тулуль-эз-Захаб, «золотых холмах», — двух крутых холмах по сторонам излучины Зарки примерно в дюжине километров к востоку от Иордана. Многие считают больший, западный холм Маханаимом, а восточный, Телль-эз-Захаб-эш-Шарки, — Пенуэлом, но это распределение не бесспорно, и некоторые ищут Пенуэл в другом месте. С 2005 года западный холм раскапывает немецкая экспедиция Томаса Полы; найдены остатки железного века, каменные блоки с резьбой VIII века до н. э. и эллинистическое и раннеримское укреплённое здание. Евсевий знал лишь, что место лежит у Иавока. Ущелье теперь в Иордании, а примерно в 10 км выше по течению стоит плотина короля Талала."
  uk:
    - "Пенуел, або Пеніел, «обличчя Боже», — місце на Яббоку, де Яків цілу ніч боровся з незнайомцем, був скалічений у стегно, отримав ім’я Ізраїль і сказав: «бачив бо я Бога лицем до лиця, тай вирятувалась душа моя»; «Засяло ж йому соньце, як прийшов за Пенуель; він же кульгав на стегно». Осія згадує: «Боровся з ангелом, — і переміг». Брід лежав на шляху Якова додому з Харана до Сокхоту й Шехема, в ущелині, де Яббок (ваді Зерка) прорізає гори Гілеаду до долини Йордану."
    - "За часів суддів тут уже було місто з вежею. Гедеон, переслідуючи мадіанітських царів, просив хліба спершу в Сокхоту, а потім у Пенуела, але обидва відмовили, і на зворотному шляху він «зруйнував башту та й повбивав городян». Єровоам I, укріпивши Шехем, «вийшов звідти й укріпив Пенуїл», можливо, як опорний пункт для своїх земель на схід від Йордану, і ця назва є в переліку міст, які фараон Шешонк I узяв близько 925 р. до н. е."
    - "Місце шукають у Тулюль-ед-Дагабі, «золотих курганах», двох крутих пагорбах по обидва боки вигину Зерки приблизно за дюжину кілометрів на схід від Йордану. Багато хто вважає більший західний пагорб Маханаїмом, а східний, Телль-ед-Дагаб еш-Шаркі, — Пенуелом, але таке віднесення не певне, і дехто шукає Пенуел деінде. Німецька група під керівництвом Томаса Поли розкопує західний пагорб з 2005 року, знайшовши залишки залізної доби, різьблені кам’яні блоки VIII ст. до н. е. та укріплену споруду елліністичної й ранньоримської доби. Євсевій знав лише, що місце лежало біля Яббока. Ущелина нині в Йорданії, з греблею короля Таляла приблизно за 10 км вище за течією."
  es:
    - "Peniel, o Penuel, «el rostro de Dios», es el lugar del Jaboc donde Jacob luchó toda la noche con un desconocido, quedó cojo del muslo, recibió el nombre de Israel y dijo: «vi á Dios cara á cara, y fué librada mi alma»; «Y salióle el sol pasado que hubo á Peniel; y cojeaba de su anca». Oseas recuerda que «con su fortaleza venció al ángel». El vado estaba en el camino de regreso de Jacob desde Harán a Sucot y Siquem, en la garganta donde el Jaboc (uadi Zarqa) corta las colinas de Galaad hasta el valle del Jordán."
    - "En tiempos de los jueces había allí una ciudad con una torre. Gedeón, persiguiendo a los reyes madianitas, pidió pan a Sucot y luego a Penuel, fue rechazado por ambas, y a su regreso «derribó la torre de Penuel, y mató á los de la ciudad». Jeroboam I, tras fortificar Siquem, «saliendo de allí, reedificó á Penuel», quizá como plaza fuerte para sus tierras al este del Jordán, y el nombre figura en la lista de ciudades que el faraón Sheshonq I tomó hacia 925 a. C."
    - "El lugar se busca en Tulul edh-Dhahab, «los montículos de oro», dos colinas escarpadas a ambos lados de un recodo del Zarqa, a una docena de kilómetros al este del Jordán. Muchos toman la colina occidental, la mayor, por Mahanaim y la oriental, Tell edh-Dhahab esh-Sharqi, por Penuel, pero la asignación no es segura y algunos buscan Penuel en otra parte. Un equipo alemán dirigido por Thomas Pola excava la colina occidental desde 2005 y ha hallado restos de la Edad del Hierro, bloques de piedra incisos del siglo VIII a. C. y un edificio fortificado helenístico y romano temprano. Eusebio sabía solo que el lugar estaba junto al Jaboc. La garganta está hoy en Jordania, con la presa del Rey Talal a unos 10 km río arriba."
  pt:
    - "Peniel, ou Penuel, “a face de Deus”, é o lugar no Jaboque onde Jacó lutou a noite toda com um desconhecido, foi ferido na coxa, recebeu o nome de Israel e disse: “Vi a Deus face a face, e a minha vida foi preservada”; “o sol nasceu sobre ele quando passava por Peniel, e ele mancava por causa da sua coxa”. Oseias recorda que “lutou com o anjo e prevaleceu”. O vau ficava no caminho de volta de Jacó de Harã a Sucote e Siquém, na garganta em que o Jaboque (Uádi Zarqa) corta as colinas de Gileade rumo ao vale do Jordão."
    - "No tempo dos juízes já havia ali uma cidade com uma torre. Gideão, perseguindo os reis midianitas, pediu pão a Sucote e depois a Peniel, foi recusado por ambas e, na volta, “derrubou a torre de Penuel e matou os homens da cidade”. Jeroboão I, depois de fortificar Siquém, “saiu dali e edificou Penuel”, talvez como praça forte para suas terras a leste do Jordão, e o nome consta da lista de cidades que o faraó Shoshenq I tomou por volta de 925 a.C."
    - "O local é procurado em Tulul edh-Dhahab, “os montes de ouro”, duas colinas íngremes de cada lado de uma curva do Zarqa, a cerca de uma dúzia de quilômetros a leste do Jordão. Muitos tomam a colina ocidental, maior, por Maanaim e a oriental, Tell edh-Dhahab esh-Sharqi, por Peniel, mas a atribuição não é certa e alguns procuram Peniel em outro lugar. Uma equipe alemã sob Thomas Pola escava a colina ocidental desde 2005, e encontrou restos da Idade do Ferro, blocos de pedra incisos do século VIII a.C. e um edifício fortificado helenístico e do início do período romano. Eusébio sabia apenas que o lugar ficava junto ao Jaboque. A garganta está agora na Jordânia, com a represa King Talal cerca de 10 km a montante."
  de:
    - "Penuel oder Peniel, „das Angesicht Gottes“, ist der Ort am Jabbok, wo Jakob die Nacht hindurch mit einem Fremden rang, an der Hüfte verletzt wurde, den Namen Israel erhielt und sagte: „ich habe Gott von Angesicht gesehen, und meine Seele ist genesen“; „und als er an Pniel vorüberkam, ging ihm die Sonne auf; und er hinkte an seiner Hüfte“. Hosea erinnert sich: „Er kämpfte mit dem Engel und siegte“. Die Furt lag auf Jakobs Heimweg von Haran nach Sukkot und Sichem, in der Schlucht, wo der Jabbok (Wadi Zarqa) sich durch das Bergland Gilead zum Jordantal hinabschneidet."
    - "Zur Zeit der Richter gab es dort eine Stadt mit einem Turm. Gideon, der die midianitischen Könige verfolgte, bat Sukkot und dann Penuel um Brot, wurde von beiden abgewiesen. Bei seiner Rückkehr heißt es: „Und den Turm Pnuels zerbrach er und erwürgte die Leute der Stadt.“ Jerobeam I. baute Sichem aus, „zog von da heraus und baute Pnuel“, vielleicht als Stützpunkt für seine Gebiete östlich des Jordan, und der Name steht in der Liste der Städte, die Pharao Schoschenk I. um 925 v. Chr. einnahm."
    - "Die Stätte wird bei Tulul edh-Dhahab gesucht, „den Goldhügeln“, zwei steilen Hügeln auf beiden Seiten einer Biegung des Zarqa, etwa ein Dutzend Kilometer östlich des Jordan. Viele halten den größeren westlichen Hügel für Mahanajim und den östlichen, Tell edh-Dhahab esch-Scharqi, für Penuel, doch die Zuordnung ist nicht sicher, und manche suchen Penuel anderswo. Ein deutsches Team unter Thomas Pola gräbt seit 2005 auf dem westlichen Hügel und fand Reste der Eisenzeit, behauene Steinblöcke des 8. Jahrhunderts v. Chr. und ein hellenistisches und frührömisches befestigtes Gebäude. Eusebius wusste nur, dass der Ort am Jabbok lag. Die Schlucht liegt heute in Jordanien, mit dem König-Talal-Damm etwa 10 km flussaufwärts."
  fr:
    - "Peniel, ou Penuel, « la face de Dieu », est le lieu sur le Jabbok où Jacob lutta toute la nuit avec un inconnu, fut frappé à la hanche, reçut le nom d’Israël et dit : « j’ai vu Dieu face à face, et mon âme a été sauvée » ; « le soleil se levait, lorsqu’il passa Peniel. Jacob boitait de la hanche ». Osée rappelle : « Il lutta avec l’ange, et il fut vainqueur ». Le gué se trouvait sur la route de retour de Jacob de Haran vers Succoth et Sichem, dans la gorge où le Jabbok (Wadi Zarqa) traverse les collines de Galaad jusqu’à la vallée du Jourdain."
    - "Du temps des juges, il y avait une ville avec une tour. Gédéon, poursuivant les rois madianites, demanda du pain à Succoth puis à Penuel, fut refusé par les deux, et à son retour « renversa aussi la tour de Penuel, et tua les gens de la ville ». Jéroboam Ier, après avoir fortifié Sichem, « en sortit, et bâtit Penuel », peut-être comme place forte pour ses terres à l’est du Jourdain, et le nom figure dans la liste des villes que prit le pharaon Chéchonq Ier vers 925 av. J.-C."
    - "On cherche le site à Tulul edh-Dhahab, « les tertres d’or », deux collines escarpées de part et d’autre d’un coude du Zarqa à une douzaine de kilomètres à l’est du Jourdain. Beaucoup prennent la plus grande colline, à l’ouest, pour Mahanaïm et l’orientale, Tell edh-Dhahab esh-Sharqi, pour Penuel, mais l’attribution n’est pas certaine et certains cherchent Penuel ailleurs. Une équipe allemande dirigée par Thomas Pola fouille la colline ouest depuis 2005 et y a trouvé des vestiges de l’âge du Fer, des blocs de pierre incisés du VIIIe siècle av. J.-C. et un édifice fortifié hellénistique et du début de l’époque romaine. Eusèbe savait seulement que le lieu était près du Jabbok. La gorge est aujourd’hui en Jordanie, avec le barrage du roi Talal à environ 10 km en amont."
