body:
  en:
    - "The waters of Merom are the scene of Joshua's battle with the kings of the north. Jabin king of Hazor called together the kings of Galilee and the coast, a host “as the sand that is upon the sea shore in multitude, with horses and chariots very many”, and “they came and pitched together at the waters of Merom, to fight against Israel.” “So Joshua came, and all the people of war with him, against them by the waters of Merom suddenly; and they fell upon them”, chased them as far as Sidon, hamstrung their horses, burned their chariots and then took and burned Hazor itself. The name appears nowhere else in the Bible."
    - "Where the waters were is uncertain. For a long time they were taken to be Lake Huleh in the upper Jordan valley, but there is no ancient support for this, and the lake is now largely drained. Most scholars now look to the town of Merom, which seems to appear in the list of Thutmose III and in the annals of Tiglath-pileser III, and to the springs and wadis of Upper Galilee: the map's candidates include the spring below Meron near Safed, the pool of Birket Hafour by Marun er-Ras on the Lebanese border, and the streams of Nahal Amud and Nahal Arbel running down to the Sea of Galilee. Josephus puts the kings' camp at Beroth, a town of Upper Galilee near Kedesh. None of these has been confirmed, and the field of battle remains unknown."
  ru:
    - "Воды Меромские — место битвы Иисуса Навина с царями севера. Иавин, царь Асорский, собрал царей Галилеи и побережья, «многочисленный народ, который множеством равнялся песку на берегу морском; и коней и колесниц было весьма много», и «пришли и расположились станом вместе при водах Меромских, чтобы сразиться с Израилем». «Иисус и с ним весь народ, способный к войне, внезапно вышли на них к водам Меромским и напали на них», гнали их до Сидона, подрезали жилы их коням, сожгли их колесницы, а потом взяли и сожгли сам Асор. Больше в Библии это имя не встречается."
    - "Где были эти воды, неясно. Долгое время их считали озером Хула в верховьях Иорданской долины, но древних оснований для этого нет, а само озеро теперь почти осушено. Большинство учёных ищут их у города Мерома, который, по-видимому, упомянут в списке Тутмоса III и в анналах Тиглатпаласара III, среди источников и русел Верхней Галилеи: среди кандидатов на карте — источник под Мероном близ Цфата, пруд Биркет-Хафур у Марун-эр-Раса на ливанской границе и потоки Нахаль-Амуд и Нахаль-Арбель, сбегающие к Галилейскому морю. Иосиф Флавий помещает стан царей у Берота, города Верхней Галилеи близ Кедеса. Ни одно из этих мест не подтверждено, и поле битвы остаётся неизвестным."
  uk:
    - "Води Мером — місце битви Ісуса Навина з царями півночі. Явін, цар Гацору, скликав царів Галілеї та узбережжя, військо, «як піску на морському березї, і вельми багато коней та колесниць (возів)», і вони «двинули та й отаборились укупі при водах Меромських, щоб ударити на Ізраїля». «От і напав їх Ісус з усією боєвою потугою своєю несподївано на Мером водах, та й кинувсь на них», гнав їх до Сідону, поперерізував жили їхнім коням, попалив їхні колісниці, а потім узяв і спалив сам Гацор. Назва більше ніде в Біблії не з’являється."
    - "Де були води, непевно. Довгий час їх брали за озеро Хула у верхній долині Йордану, але давньої підтримки цьому немає, а озеро тепер здебільшого осушене. Більшість учених нині дивляться на місто Мером, яке, схоже, з’являється в переліку Тутмоса III та в аналах Тіглатпаласара III, і на джерела та вади Верхньої Галілеї: кандидати мапи включають джерело під Мероном біля Цфату, ставок Біркет-Хафур біля Марун-ер-Расу на ліванському кордоні та потоки Нахаль-Амуд і Нахаль-Арбель, що збігають до Галілейського моря. Йосиф Флавій ставить табір царів у Беротах, місті Верхньої Галілеї поблизу Кедеса. Жодне з цих місць не підтверджене, і поле битви лишається невідомим."
  es:
    - "Las aguas de Merom son el escenario de la batalla de Josué con los reyes del norte. Jabín, rey de Hazor, convocó a los reyes de Galilea y de la costa, una hueste «como la arena que está á la orilla del mar, con gran muchedumbre de caballos y carros», y «reunieron los campos junto á las aguas de Merom, para pelear contra Israel». «Y vino Josué, y con él todo el pueblo de guerra, contra ellos, y dió de repente sobre ellos junto á las aguas de Merom», los persiguió hasta Sidón, desjarretó sus caballos, quemó sus carros y luego tomó e incendió la propia Hazor. El nombre no aparece en ningún otro lugar de la Biblia."
    - "Se ignora dónde estaban las aguas. Durante mucho tiempo se tomaron por el lago Hule, en el valle alto del Jordán, pero no hay apoyo antiguo para ello, y el lago está hoy en gran parte drenado. La mayoría de los estudiosos miran ahora a la ciudad de Merom, que parece aparecer en la lista de Tutmosis III y en los anales de Tiglat-pileser III, y a los manantiales y wadis de la Alta Galilea: los candidatos del mapa incluyen la fuente bajo Meron, cerca de Safed, el estanque de Birket Hafour junto a Marun er-Ras, en la frontera libanesa, y los arroyos del Nahal Amud y del Nahal Arbel, que descienden al Mar de Galilea. Josefo sitúa el campamento de los reyes en Berot, una ciudad de la Alta Galilea cerca de Cedes. Ninguno de estos ha sido confirmado, y el campo de batalla sigue siendo desconocido."
  pt:
    - "As águas de Merom são o cenário da batalha de Josué com os reis do norte. Jabim, rei de Hazor, convocou os reis da Galileia e da costa, uma hoste “tão numerosa como a areia que está na praia do mar, com muitíssimos cavalos e carros de guerra”, e “vieram e acamparam juntos nas águas de Merom, para lutar contra Israel”. “Então Josué veio repentinamente, com todos os guerreiros, contra eles junto às águas de Merom, e os atacou”, perseguiu-os até Sidom, cortou os tendões de seus cavalos, queimou seus carros e depois tomou e queimou a própria Hazor. O nome não aparece em nenhum outro lugar da Bíblia."
    - "Onde ficavam as águas é incerto. Por muito tempo foram tomadas pelo lago Hula, no alto vale do Jordão, mas não há apoio antigo para isso, e o lago está hoje em grande parte drenado. A maioria dos estudiosos hoje olha para a cidade de Merom, que parece aparecer na lista de Tutmés III e nos anais de Tiglate-Pileser III, e para as fontes e uádis da Alta Galileia: os candidatos do mapa incluem a fonte abaixo de Meron, perto de Safed, o tanque de Birket Hafour junto a Marun er-Ras, na fronteira libanesa, e os riachos de Nahal Amud e Nahal Arbel, que descem ao Mar da Galileia. Josefo põe o acampamento dos reis em Berote, cidade da Alta Galileia perto de Quedes. Nenhum desses foi confirmado, e o campo de batalha continua desconhecido."
  de:
    - "Das Wasser von Merom ist der Schauplatz von Josuas Schlacht mit den Königen des Nordens. Jabin, der König von Hazor, rief die Könige Galiläas und der Küste zusammen, „ein großes Volk, so viel als des Sandes am Meer, und sehr viel Rosse und Wagen“, und „alle diese Könige versammelten sich und kamen und lagerten sich zuhauf an das Wasser Merom, zu streiten mit Israel“. „Und Josua kam plötzlich über sie und alles Kriegsvolk mit ihm am Wasser Merom, und überfielen sie“, jagte sie bis Sidon, lähmte ihre Rosse, verbrannte ihre Wagen und nahm und verbrannte dann Hazor selbst. Der Name erscheint sonst nirgends in der Bibel."
    - "Wo das Wasser lag, ist unsicher. Lange hielt man es für den Huleh-See im oberen Jordantal, doch dafür gibt es keine antike Stütze, und der See ist heute großenteils trockengelegt. Die meisten Forscher blicken jetzt auf die Stadt Merom, die in der Liste Thutmosis' III. und in den Annalen Tiglat-Pilesers III. zu erscheinen scheint, und auf die Quellen und Wadis Obergaliläas: Zu den Kandidaten der Karte gehören die Quelle unterhalb von Meron bei Safed, der Teich Birket Hafour bei Marun er-Ras an der libanesischen Grenze und die Bäche Nahal Amud und Nahal Arbel, die zum See Genezareth hinabfließen. Josephus setzt das Lager der Könige bei Beroth, einer Stadt Obergaliläas nahe Kedesch. Nichts davon ist bestätigt, und das Schlachtfeld bleibt unbekannt."
  fr:
    - "Les eaux de Mérom sont le théâtre de la bataille de Josué contre les rois du nord. Jabin, roi de Hatsor, convoqua les rois de Galilée et de la côte, une armée « innombrable comme le sable qui est sur le bord de la mer, et ayant des chevaux et des chars en très grande quantité », et ils « vinrent camper ensemble près des eaux de Mérom, pour combattre contre Israël ». « Josué, avec tous ses gens de guerre, arriva subitement sur eux près des eaux de Mérom, et ils se précipitèrent au milieu d’eux », les poursuivirent jusqu’à Sidon, coupèrent les jarrets de leurs chevaux, brûlèrent leurs chars, puis prirent et brûlèrent Hatsor elle-même. Le nom n’apparaît nulle part ailleurs dans la Bible."
    - "L’emplacement des eaux est incertain. On les a longtemps prises pour le lac de la Houla, dans la haute vallée du Jourdain, mais rien d’antique ne l’appuie, et le lac est aujourd’hui en grande partie asséché. La plupart des spécialistes regardent maintenant vers la ville de Mérom, qui semble figurer dans la liste de Thoutmosis III et dans les annales de Tiglath-Piléser III, et vers les sources et les oueds de la Haute Galilée : les candidats de la carte comprennent la source sous Meron près de Safed, le bassin de Birket Hafour près de Marun er-Ras, à la frontière libanaise, et les cours d’eau du Nahal Amud et du Nahal Arbel qui descendent vers la mer de Galilée. Josèphe place le camp des rois à Béroth, ville de la Haute Galilée près de Kédesch. Aucun de ces sites n’est confirmé, et le champ de bataille reste inconnu."
  pl:
    - "Wody Merom są sceną bitwy Jozuego z królami północy. Jabin, król Chasoru, zwołał królów Galilei i wybrzeża, wojsko, „lud wielki, jako piasek, który jest na brzegu morskim, i koni i wozów bardzo wiele”, a oni „przyszli, i położyli się pospołu obozem u wód Merom, aby zwiedli bitwę z Izraelem”. „Wyciągnął tedy Jozue, i wszystek lud waleczny z nim, przeciwko nim ku wodom Merom z nagła, i uderzyli na nie”, gonił ich aż do Sydonu, poderżnął żyły ich koniom, spalił ich wozy, a potem wziął i spalił sam Chasor. Nazwa nie występuje nigdzie indziej w Biblii."
    - "Gdzie leżały wody, jest niepewne. Przez długi czas brano je za jezioro Chula w górnej dolinie Jordanu, ale nie ma na to starożytnego poparcia, a jezioro jest dziś w dużej mierze osuszone. Większość badaczy szuka teraz miasta Merom, które zdaje się pojawiać na liście Totmesa III i w rocznikach Tiglat-Pilesera III, oraz źródeł i wadi Górnej Galilei: kandydaci na mapie to źródło poniżej Meron koło Safedu, sadzawka Birket Hafour przy Marun er-Ras na granicy libańskiej oraz strumienie Nachal Amud i Nachal Arbel spływające ku Jezioru Galilejskiemu. Józef Flawiusz umieszcza obóz królów w Berot, mieście Górnej Galilei koło Kedesz. Żadne z tych miejsc nie zostało potwierdzone, a pole bitwy pozostaje nieznane."
  it:
    - "Le acque di Merom sono la scena della battaglia di Giosuè con i re del nord. Iabin re di Asor convocò i re della Galilea e della costa, un popolo «innumerevole come la rena ch’è sul lido del mare, e con cavalli e carri in grandissima quantità», ed essi «vennero ad accamparsi assieme presso le acque di Merom per combattere contro Israele». «Giosuè dunque, con tutta la sua gente di guerra, marciò all’improvviso contro di essi alle acque di Merom, e piombò loro addosso»; li inseguì fino a Sidone, tagliò i garretti ai loro cavalli, bruciò i loro carri e poi prese e incendiò la stessa Asor. Il nome non compare altrove nella Bibbia."
    - "Dove fossero le acque è incerto. Per lungo tempo furono identificate con il lago di Hula nell’alta valle del Giordano, ma non c’è sostegno antico per questo, e il lago è ora in gran parte prosciugato. La maggior parte degli studiosi guarda oggi alla città di Merom, che sembra comparire nell’elenco di Tutmosi III e negli annali di Tiglat-Pilèser III, e alle sorgenti e agli uadi dell’Alta Galilea: fra i candidati della mappa vi sono la sorgente sotto Meron presso Safed, la vasca di Birket Hafour presso Marun er-Ras sul confine libanese, e i torrenti Nahal Amud e Nahal Arbel che scendono al lago di Tiberiade. Giuseppe Flavio pone il campo dei re a Beroth, una città dell’Alta Galilea presso Kedes. Nessuno di questi è confermato, e il campo di battaglia resta ignoto."
  nl:
    - "De wateren van Merom zijn het toneel van de slag van Jozua met de koningen van het noorden. Jabin, koning van Hazor, riep de koningen van Galilea en de kust bijeen, een leger “veel volks, als het zand, dat aan den oever der zee is, in veelheid; en zeer vele paarden en wagens”, en zij “kwamen en legerden zich samen aan de wateren van Merom, om tegen Israel te krijgen.” “En Jozua, en al het krijgsvolk met hem, kwam snellijk over hen aan de wateren van Merom, en zij overvielen hen”, joegen hen na tot Sidon, verlamden hun paarden, verbrandden hun wagens en namen en verbrandden daarna Hazor zelf. De naam komt nergens anders in de Bijbel voor."
    - "Waar de wateren lagen, is onzeker. Lange tijd werden ze voor het Huleh-meer in de bovenste Jordaanvallei gehouden, maar daarvoor is geen antieke steun, en het meer is nu grotendeels drooggelegd. De meeste geleerden kijken nu naar de stad Merom, die voorkomt in de lijst van Thoetmosis III en in de annalen van Tiglat-Pileser III, en naar de bronnen en wadi’s van Boven-Galilea: de kandidaten op de kaart zijn de bron onder Meron bij Safed, de vijver Birket Hafour bij Marun er-Ras op de Libanese grens, en de beken Nahal Amud en Nahal Arbel die naar het Meer van Galilea stromen. Flavius Josephus plaatst het kamp van de koningen bij Beroth, een stad in Boven-Galilea bij Kedes. Geen daarvan is bevestigd, en het slagveld blijft onbekend."
  cs:
    - "Merómské vody jsou dějištěm Jozuovy bitvy s králi severu. Jabín, král Chacoru, svolal krále Galileje a pobřeží, vojsko, „lid mnohý jako písek, kterýž jest na břehu mořském nesčíslný, i koňů i vozů velmi mnoho“, a ti „přitáhli a položili se spolu při vodách Merom, aby bojovali proti Izraelovi“. „Tedy vytáhl Jozue a s ním všecken lid válečný proti nim k vodám Merom rychle, a udeřili na ně“, honili je až k Sidónu, podřezali koním šlachy, spálili jejich vozy a pak dobyli a vypálili samotný Chacor. Jméno se jinde v Bibli nevyskytuje."
    - "Kde vody byly, je nejisté. Dlouho se pokládaly za jezero Chúla v horním Jordánském údolí, ale pro to není starověká opora a jezero je nyní z velké části vysušeno. Většina učenců dnes hledí k městu Merom, které se zdá být v seznamu Thutmose III. a v análech Tiglatpilesara III., a k pramenům a vádím Horní Galileje: kandidáty mapy jsou pramen pod Meronem u Cefatu, nádrž Birket Chafúr u Marún er-Rás na libanonské hranici a toky Nachal Amud a Nachal Arbel stékající ke Galilejskému jezeru. Josephus klade tábor králů do Beróty, města v Horní Galileji poblíž Kedeše. Nic z toho nebylo potvrzeno a bojiště zůstává neznámé."
  sv:
    - "Meroms vatten är skådeplats för Josuas strid med kungarna i norr. Javin, kung av Hasor, kallade samman kungarna i Galileen och vid kusten, ”en folkskara så talrik som sanden på havets strand, jämte hästar och vagnar i stor myckenhet”, och ”de kommo och lägrade sig tillhopa vid Meroms vatten, för att strida mot Israel”. ”Och Josua kom med allt sitt krigsfolk plötsligt över dem vid Meroms vatten och anföll dem”, jagade dem ända till Sidon, skar av hästarnas hasseninar, brände deras vagnar och intog och brände sedan själva Hasor. Namnet förekommer ingen annanstans i Bibeln."
    - "Var vattnet fanns är osäkert. Länge ansågs det vara Hulesjön i övre Jordandalen, men det finns inget forntida stöd för detta, och sjön är nu till stor del utdikad. De flesta forskare ser nu till staden Merom, som tycks förekomma i Thutmosis III:s förteckning och i Tiglat-Pileser III:s annaler, och till källorna och wadierna i Övre Galileen: kartans kandidater omfattar källan nedanför Meron nära Safed, dammen Birket Hafour vid Marun er-Ras på den libanesiska gränsen, och bäckarna Nahal Amud och Nahal Arbel som rinner ner till Galileiska sjön. Josefus förlägger kungarnas läger till Beroth, en stad i Övre Galileen nära Kedesh. Inget av detta har bekräftats, och slagfältet förblir okänt."
  nb:
    - "Merom-vannet er åstedet for Josvas slag med kongene i nord. Jabin, kongen i Hasor, kalte sammen kongene i Galilea og ved kysten, en hær «en mengde så tallrik som sanden på havets bredd, og hester og vogner i hopetall», og «de kom og leiret sig sammen ved Merom-vannet for å stride mot Israel». «Og Josva med alt sitt krigsfolk kom brått på dem ved Meromvannet og overfalt dem», jaget dem helt til Sidon, skar over hasene på hestene deres, brente vognene og tok og brente så selve Hasor. Navnet forekommer ikke noe annet sted i Bibelen."
    - "Hvor vannet lå, er usikkert. Lenge ble det tatt for Hula-sjøen i øvre Jordandal, men det finnes ingen antikk støtte for dette, og sjøen er nå stort sett tørrlagt. De fleste forskere ser nå til byen Merom, som later til å forekomme i listen til Tutmosis III og i annalene til Tiglat-Pileser III, og til kildene og wadiene i Øvre Galilea: kartets kandidater omfatter kilden under Meron nær Safed, dammen Birket Hafour ved Marun er-Ras på den libanesiske grensen, og bekkene Nahal Amud og Nahal Arbel som renner ned til Galileasjøen. Josefus plasserer kongenes leir ved Berot, en by i Øvre Galilea nær Kedesj. Ingen av disse er bekreftet, og slagmarken er fortsatt ukjent."
  tl:
    - "Ang tubig ng Merom ang tagpuan ng labanan ni Josue at ng mga hari ng hilaga. Tinipon ni Jabin, hari ng Hasor, ang mga hari ng Galilea at baybayin, isang hukbong “gaya nga ng mga buhangin na nasa baybayin ng dagat sa karamihan, na may mga kabayo at mga karo na totoong marami”, at sila'y “naparoon at humantong na magkakasama sa tubig ng Merom, upang makipaglaban sa Israel.” “Sa gayo'y biglang naparoon si Josue, at ang buong bayang pangdigma na kasama niya, laban sa kanila sa tabi ng tubig ng Merom, at dumaluhong sila sa kanila”, hinabol sila hanggang Sidon, pinutol ang litid ng kanilang mga kabayo, sinunog ang kanilang mga karo at pagkatapos ay sinakop at sinunog ang Hasor mismo. Hindi na lumilitaw saanman pa sa Biblia ang pangalan."
    - "Hindi tiyak kung saan ang tubig. Matagal itong itinuring na Lawa ng Huleh sa itaas na libis ng Jordan, ngunit walang sinaunang suporta rito, at higit nang pinatuyo ang lawa. Karamihan ng iskolar ngayon ay tumitingin sa bayan ng Merom, na tila lumilitaw sa talaan ni Thutmose III at sa mga salaysay ni Tiglath-pileser III, at sa mga bukal at wadi ng Itaas na Galilea: kabilang sa mga kandidato ng mapa ang bukal sa ilalim ng Meron malapit sa Safed, ang tangke ng Birket Hafour sa tabi ng Marun er-Ras sa hangganan ng Libano, at ang mga batis ng Nahal Amud at Nahal Arbel na bumababa sa Dagat ng Galilea. Inilalagay ni Josefo ang kampamento ng mga hari sa Beroth, bayan ng Itaas na Galilea malapit sa Cedes. Walang nakumpirma, at hindi pa rin alam ang larangan ng labanan."
  da:
    - "Meroms vand er skuepladsen for Josvas kamp med kongerne i nord. Jabin, konge af Hazor, kaldte kongerne af Galilæa og kysten sammen, en hær af »mangfoldigt Folk som Sand, der er paa Havbredden, i Mangfoldighed, og saare mange Heste og Vogne«, og »de kom, og de lejrede sig tilsammen ved Søen Merom, at stride imod Israel.« »Og Josva og alt Krigsfolket med ham kom over dem hasteligen ved Søen Merom, og de overfaldt dem«, jagede dem helt til Sidon, skar hasesenerne over på deres heste, brændte deres vogne og indtog og brændte derefter selve Hazor. Navnet optræder ikke andre steder i Bibelen."
    - "Hvor vandet var, er usikkert. Længe blev det taget for Huleh-søen i den øvre Jordandal, men det har ingen støtte i oldtiden, og søen er nu for en stor del drænet. De fleste forskere ser nu mod byen Merom, som synes at optræde i Thutmosis 3.s liste og i Tiglat-Pileser 3.s annaler, og mod kilderne og wadierne i Øvre Galilæa: kortets kandidater omfatter kilden neden for Meron nær Safed, dammen Birket Hafour ved Marun er-Ras på den libanesiske grænse og bækkene Nahal Amud og Nahal Arbel, der løber ned til Genesaret Sø. Josefus placerer kongernes lejr ved Beroth, en by i Øvre Galilæa nær Kedesj. Intet af dette er bekræftet, og slagmarken forbliver ukendt."
  sr:
    - "Воде Мерома поприште су Исусове битке с царевима севера. Јавин, цар асорски, сазвао је цареве Галилеје и обале, војску „многи народ као песак на брегу морском, и коњи и кола многа веома“, и они „стадоше заједно у логор на води Мерому, да ударе на Израиља“. „И изађе Исус и сва војска с њим на њих на воду Мером изненада, и ударише на њих“, гонио их је све до Сидона, пререзао им коњима тетиве, спалио њихова кола, а затим узео и спалио сам Асор. Име се нигде другде у Библији не јавља."
    - "Где су воде биле, није сигурно. Дуго су се узимале за језеро Хула у горњој долини Јордана, али за то нема античне подршке, а језеро је сада великим делом исушено. Већина научника сада гледа на град Мером, који се као да јавља на списку Тутмоса III и у аналима Теглат-Феласара III, и на изворе и вадије Горње Галилеје: кандидати на карти укључују извор испод Мерона код Цфата, језерце Биркет Хафур код Марун ер Раса на либанској граници, и потоке Нахал Амуд и Нахал Арбел који теку доле до Галилејског мора. Јосиф Флавије смешта логор царева у Берот, град Горње Галилеје близу Кедеса. Ништа од тога није потврђено, а бојно поље остаје непознато."
  hu:
    - "Mérom vizei Józsué északi királyok elleni csatájának színhelyei. A hácóri Jábin összehívta Galilea és a tengerpart királyait, olyan sereget, amely „olyan sok, mint a fövény, a mely a tenger partján van, és igen sok ló és szekér”, és „megindulának, és táborba szállának együttesen Méromnak vizeinél, hogy hadakozzanak Izráel ellen.” „Elméne azért Józsué és vele az egész hadakozó nép azok ellen a Mérom vizeihez nagy hirtelen, és reájok rohanának”, Szidónig kergették őket, megbénították lovaikat, elégették szekereiket, majd elfoglalták és felégették magát Hácórt. A név sehol másutt nem fordul elő a Bibliában."
    - "Hogy hol voltak a vizek, bizonytalan. Sokáig a felső Jordán-völgy Hule-tavának tartották, de ennek nincs ókori alátámasztása, és a tavat ma nagyrészt lecsapolták. A legtöbb tudós ma Mérom városára gondol, amely III. Thotmesz jegyzékében és III. Tiglat-Pileszer évkönyveiben úgy tűnik, szerepel, és Felső-Galilea forrásaira és vádijaira: a térkép jelöltjei között a Cfat melletti Merón alatti forrás, a libanoni határnál lévő Marún er-Rász melletti Birket Haffúr tava, és a Galileai-tengerbe lefutó Nahal Amúd és Nahal Arbel patakjai szerepelnek. Josephus a királyok táborát Beróthnál helyezi el, Felső-Galilea Kedes melletti városánál. Egyik sem nyert megerősítést, és a csata színhelye ismeretlen marad."
  fi:
    - "Meromin vedet ovat Joosuan pohjoisten kuninkaiden vastaisen taistelun näyttämö. Hasorin Jabin kutsui koolle Galilean ja rannikon kuninkaat, joukon, jossa ”väkeä oli niin paljon kuin hiekkaa meren rannalla ja hevosia ja sotavaunuja ylen paljon”, ja nämä ”tulivat ja leiriytyivät yhdessä Meeromin veden rannalle sotiaksensa Israelia vastaan”. ”Niin Joosua ja kaikki sotaväki hänen kanssaan yllätti heidät Meeromin veden rannalla ja hyökkäsi heidän kimppuunsa”, ajoi heitä takaa Sidoniin asti, lamautti heidän hevosensa, poltti heidän vaununsa ja valloitti sitten Hasorin itse ja poltti sen. Nimi ei esiinny muualla Raamatussa."
    - "Missä vedet olivat, on epävarmaa. Pitkään niiden katsottiin olevan Hulajärvi Jordanin ylälaaksossa, mutta tälle ei ole antiikin tukea, ja järvi on nykyisin pääosin kuivattu. Useimmat tutkijat katsovat nykyisin Meromin kaupunkiin, joka näyttää esiintyvän Tuthmosis III:n luettelossa ja Tiglat-Pileser III:n kronikoissa, sekä Ylä-Galilean lähteisiin ja wadeihin: kartan ehdokkaita ovat Safedin lähellä Meronin alla oleva lähde, Marun er-Rasin luona Libanonin rajalla oleva Birket Hafourin lammikko sekä Galileanjärveen laskevat Nahal Amudin ja Nahal Arbelin purot. Josefus sijoittaa kuninkaiden leirin Beerotiin, Ylä-Galilean kaupunkiin Kedeksen lähellä. Mitään näistä ei ole vahvistettu, ja taistelukenttä on yhä tuntematon."
  vi:
    - "Nước Mê-rôm là cảnh trận chiến của Giô-suê với các vua phương bắc. Gia-bin vua Hát-so nhóm các vua Ga-li-lê và bờ biển, một đạo quân “đông vô số, như cát nơi bờ biển, có ngựa và xe theo rất nhiều”, và họ “đã hẹn nhau đến đóng trại chung gần nước Mê-rôm, đặng giao chiến cùng Y-sơ-ra-ên.” “Giô-suê và hết thảy chiến sĩ người lập tức đi đến, xông vào chúng nó gần nước Mê-rôm”, đuổi chúng đến tận Si-đôn, chặt gân chân ngựa, đốt xe của chúng rồi chiếm và đốt chính Hát-so. Tên không xuất hiện ở chỗ nào khác trong Kinh Thánh."
    - "Nước ở đâu thì không chắc chắn. Lâu nay người ta coi đó là hồ Huleh trong thung lũng Giô-đanh thượng, nhưng không có chứng cứ xưa, và hồ nay phần lớn đã tháo cạn. Hầu hết học giả nay hướng đến thị trấn Mê-rôm, dường như xuất hiện trong danh sách của Thutmose III và trong biên niên sử của Tiếc-la-Phi-lê-se III, và đến các suối và wadi của Thượng Ga-li-lê: các ứng viên của bản đồ gồm suối dưới Meron gần Safed, ao Birket Hafour cạnh Marun er-Ras ở biên giới Li-ban, và các dòng Nahal Amud và Nahal Arbel chảy xuống Biển Ga-li-lê. Josephus đặt trại của các vua tại Beroth, một thị trấn ở Thượng Ga-li-lê gần Kê-đe. Chưa nơi nào được xác nhận, và chiến trường vẫn chưa biết."
  ro:
    - "Apele Merom sunt scena bătăliei lui Iosua cu regii din nord. Iabin, regele Hațorului, i-a chemat pe regii Galileii și ai coastei, o oaste „ca nisipul de pre marginea mării de mulți, și cai și care multe foarte”, și „s’au strâns într’un loc, și au tăbărît la apa Meron să se bată cu Israil.” „Și a venit Isus și tot poporul cel răsboinic cu dânsul asupra lor la apa Meron fără de veste, și au năvălit preste ei în munte”; i-a gonit până la Sidon, a tăiat vinele cailor lor, le-a ars carele și apoi a luat și a ars Hațorul însuși. Numele nu apare nicăieri altundeva în Biblie."
    - "Unde se aflau apele este nesigur. Multă vreme s-a crezut că sunt Lacul Hula din valea superioară a Iordanului, dar nu există sprijin antic pentru aceasta, iar lacul este acum în mare parte secat. Cei mai mulți cercetători privesc acum spre orașul Merom, care pare să apară în lista lui Tutmes al III-lea și în analele lui Tiglat-Pileser al III-lea, și spre izvoarele și uadiurile Galileii de Sus: candidații hărții includ izvorul de sub Meron, lângă Țefat, iazul Birket Hafour, lângă Marun er-Ras, la granița libaneză, și pâraiele Nahal Amud și Nahal Arbel, care coboară spre Marea Galileii. Iosif Flaviu așază tabăra regilor la Berot, un oraș din Galileea de Sus, lângă Chedeș. Niciunul dintre acestea nu a fost confirmat, iar câmpul de luptă rămâne necunoscut."
  bg:
    - "Водите на Мером са мястото на битката на Иисус Навин с царете от севера. Явин, царят на Хацор, събрал царете на Галилея и на крайбрежието — войска „много както е пясъкът който е покрай морето по множество, с коне и колесници твърде много“, и те „дойдоха и разположиха заедно стана си близу при водата Мером за да се бият с Израиля.“ Иисус Навин с всичките си бойци внезапно ги нападнал при водите на Мером, преследвал ги чак до Сидон, прерязал жилите на конете им, изгорил колесниците им, а после превзел и изгорил самия Хацор. Името не се среща никъде другаде в Библията."
    - "Къде са били водите, е несигурно. Дълго време ги приемали за езерото Хула в горната Йорданска долина, но за това няма древна опора, а езерото днес е до голяма степен пресушено. Повечето учени сега търсят град Мером, който изглежда се появява в списъка на Тутмос III и в летописите на Теглатфеласар III, и изворите и уадитата на Горна Галилея: кандидатите на картата включват извора под Мерон близо до Сафед, езерцето Биркет Хафур при Марун ер-Рас на ливанската граница и потоците Нахал Амуд и Нахал Арбел, които се спускат към Галилейското езеро. Йосиф Флавий поставя стана на царете при Берот, град в Горна Галилея близо до Кедес. Нито едно от тях не е потвърдено и бойното поле остава неизвестно."
