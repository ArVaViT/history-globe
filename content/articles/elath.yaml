body:
  en:
    - "Elath, or Eloth, was the port at the head of the Gulf of Aqaba, the eastern arm of the Red Sea, named in the Bible beside Ezion-geber “on the shore of the Red sea, in the land of Edom”. Its site is disputed. The Nabataean and Roman town of Aila lies under the modern Aqaba, where the Islamic port of Ayla has been excavated; Tell el-Kheleifeh, a mound on the shore between Aqaba and Eilat, was dug by Nelson Glueck in 1938–40, who took it for Ezion-geber, but a later reappraisal dated its fort and store rooms to the eighth to sixth centuries BC, which would suit the Elath of Uzziah; others hold that Elath and Ezion-geber are the same place, and Israel gave the biblical name to its own town of Eilat. All four appear as candidates on the map."
    - "Israel passed Edom “through the way of the plain from Elath, and from Ezion-gaber” on the way to Moab. Solomon “made a navy of ships in Ezion-geber, which is beside Eloth”, manned with Hiram's “shipmen that had knowledge of the sea”, which brought gold from Ophir, and Jehoshaphat's ships of Tarshish “were broken at Ezion-geber”. Azariah, or Uzziah, “built Elath, and restored it to Judah” in the eighth century BC, and under Ahaz “Rezin king of Syria recovered Elath to Syria, and drave the Jews from Elath”; the Hebrew margin and the Synodal Bible then say that Edomites, not Syrians, settled there, the two names differing by one letter."
    - "Aila was the terminus of Trajan's road from Bostra, held a Roman legion from about AD 300, and sent a bishop to the council of Nicaea; Eusebius knew it as Ailam, a town at the edge of Palestine by the Red Sea where a detachment of the Tenth Legion was stationed. Under Islam the port of Ayla served pilgrims on the way to Mecca. Today Aqaba, Jordan's only seaport, and Eilat, Israel's Red Sea resort, face each other across the head of the gulf, with Egyptian Taba and the Saudi shore beyond, and the mound of Tell el-Kheleifeh lies between them on the border."
  ru:
    - "Елаф, или Елоф, был портом в вершине залива Акаба, восточного рукава Красного моря, названным в Библии рядом с Ецион-Гавером «на берегу Чермного моря, в земле Идумейской». Его место спорно. Набатейский и римский город Айла лежит под нынешней Акабой, где раскопан исламский порт Айла; Телль-эль-Хелейфе, холм на берегу между Акабой и Эйлатом, копал в 1938–1940 годах Нельсон Глюк, принявший его за Ецион-Гавер, но позднейшая переоценка отнесла его крепость и кладовые к VIII–VI векам до н. э., что подошло бы Елафу Озии; иные считают Елаф и Ецион-Гавер одним местом, а Израиль дал библейское имя своему городу Эйлат. Все четыре места показаны на карте как кандидаты."
    - "Израиль прошёл мимо Едома «путем равнины, от Елафа и Ецион-Гавера» по дороге в Моав. Соломон «сделал корабль в Ецион-Гавере, что при Елафе», Хирам послал на него «корабельщиков, знающих море», и корабли привезли золото из Офира, а корабли Иосафата «разбились в Ецион-Гавере». Азария, он же Озия, «обстроил Елаф, и возвратил его Иуде» в VIII веке до н. э., а при Ахазе «Рецин, царь Сирийский, возвратил Сирии Елаф и изгнал Иудеев из Елафа»; еврейское чтение на полях и Синодальный перевод говорят дальше, что там поселились Идумеяне, а не Сирийцы, — два имени различаются одной буквой."
    - "Айла была концом дороги Траяна из Бостры, с 300 г. н. э. держала римский легион и послала епископа на Никейский собор; Евсевий знал её как Айлам, город на краю Палестины у Красного моря, где стоял отряд Десятого легиона. При исламе порт Айла служил паломникам на пути в Мекку. Сегодня Акаба, единственный морской порт Иордании, и Эйлат, израильский курорт на Красном море, смотрят друг на друга через вершину залива, за ними — египетская Таба и саудовский берег, а холм Телль-эль-Хелейфе лежит между ними на границе."
  uk:
    - "Елат, або Елот, був портом у вершині Акабської затоки, східного рукава Червоного моря, названим у Біблії поряд з Еціон-Гевером, що «на березї Червоного моря в Едом землї». Його місце є спірним. Набатейське й римське місто Айла лежить під сучасною Акабою, де розкопано ісламський порт Айла; Телль-ель-Хелейфе, горб на березі між Акабою та Ейлатом, розкопував Нельсон Глюк у 1938–1940 рр., вважаючи його Еціон-Гевером, але пізніша переоцінка датувала його форт і комори VIII–VI ст. до н. е., що пасувало б до Елата Уззії; інші вважають, що Елат і Еціон-Гевер — те саме місце, а Ізраїль дав біблійну назву власному місту Ейлат. Усі чотири показано на мапі як кандидатів."
    - "Ізраїль обійшов Едом «від дороги на поділлю, від Елата і від Езйон-Гебер» дорогою до Моаву. Соломон «Побудував … кораблї в Асіонгабері, коло Елота», на яких, як сказано, «послав Гирам … своїх підданих мореходів, що з морем обізнані були», і вони привозили золото з Офіру, а кораблі Тарсису Йосафата розбилися в Еціон-Гевері. Азарія, або Уззія, «відбудував Елат і вернув його Юдеї» у VIII ст. до н. е., а за Ахаза «Резин, царь Сирийський, прилучив Елам назад до Сириї й повиганяв Юдеїв із Елату»; єврейське маргінальне читання й Синодальна Біблія тоді кажуть, що там оселилися едоміти, а не сирійці, і ці дві назви відрізняються однією літерою."
    - "Айла була кінцем Траянової дороги від Бостри, тримала римський легіон приблизно від 300 р. н. е. і послала єпископа на Нікейський собор; Євсевій знав її як Айлам, місто на краю Палестини біля Червоного моря, де стояв загін Десятого легіону. За ісламу порт Айла обслуговував прочан на шляху до Мекки. Сьогодні Акаба, єдиний морський порт Йорданії, і Ейлат, ізраїльський курорт на Червоному морі, дивляться одне на одного через вершину затоки, з єгипетською Табою та саудівським берегом за ними, а горб Телль-ель-Хелейфе лежить між ними на кордоні."
  es:
    - "Elat, o Eloth, era el puerto en la cabecera del golfo de Áqaba, el brazo oriental del mar Rojo, nombrado en la Biblia junto a Ezión-geber, «en la ribera del mar Bermejo, en la tierra de Edom». Su emplazamiento es objeto de debate. La ciudad nabatea y romana de Aila yace bajo la actual Áqaba, donde se ha excavado el puerto islámico de Ayla; Tell el-Kheleifeh, un montículo en la orilla entre Áqaba y Eilat, fue excavado por Nelson Glueck en 1938–40, que lo tomó por Ezión-geber, pero una reevaluación posterior fechó su fuerte y sus almacenes entre los siglos VIII y VI a. C., lo que convendría al Elat de Uzías; otros sostienen que Elat y Ezión-geber son el mismo lugar, e Israel dio el nombre bíblico a su propia ciudad de Eilat. Los cuatro aparecen como candidatos en el mapa."
    - "Israel pasó junto a Edom «por el camino de la llanura de Elath y de Esiongeber» camino de Moab. Salomón «hizo [...] navíos en Ezión-geber, que es junto á Elath», tripulados por «marineros y diestros en la mar» de Hiram, que trajeron oro de Ofir, y los navíos de Tarsis de Josafat «se rompieron en Ezion-geber». Azarías, o Uzías, «edificó él á Elath, y la restituyó á Judá» en el siglo VIII a. C., y bajo Acaz «Resín rey de Siria restituyó Elath á Siria, y echó á los Judíos de Elath»; el margen hebreo y la Biblia sinodal dicen entonces que fueron edomitas, y no sirios, quienes se establecieron allí, pues los dos nombres difieren en una sola letra."
    - "Aila fue el término de la vía de Trajano desde Bostra, albergó una legión romana desde alrededor del 300 d. C. y envió un obispo al concilio de Nicea; Eusebio la conocía como Ailam, una ciudad en el borde de Palestina junto al mar Rojo donde estaba destacado un destacamento de la Legión X. Bajo el islam el puerto de Ayla servía a los peregrinos camino de La Meca. Hoy Áqaba, único puerto marítimo de Jordania, y Eilat, el centro turístico israelí del mar Rojo, se miran a través de la cabecera del golfo, con la egipcia Taba y la costa saudí más allá, y el montículo de Tell el-Kheleifeh se halla entre ellas, en la frontera."
  pt:
    - "Elate, ou Elote, era o porto na cabeceira do Golfo de Aqaba, o braço oriental do Mar Vermelho, nomeado na Bíblia ao lado de Eziom-Geber, “na margem do mar Vermelho, na terra de Edom”. Seu local é disputado. A cidade nabateia e romana de Aila fica sob a moderna Aqaba, onde o porto islâmico de Ayla foi escavado; Tell el-Kheleifeh, um monte na margem entre Aqaba e Eilat, foi escavado por Nelson Glueck em 1938–40, que o tomou por Eziom-Geber, mas uma reavaliação posterior datou seu forte e depósitos dos séculos VIII a VI a.C., o que combinaria com a Elate de Uzias; outros sustentam que Elate e Eziom-Geber são o mesmo lugar, e Israel deu o nome bíblico à sua própria cidade de Eilat. Os quatro aparecem como candidatos no mapa."
    - "Israel passou por Edom afastando-se “do caminho da Arabá, de Elate e de Eziom-Geber”, a caminho de Moabe. Salomão “fez uma frota de navios em Eziom-Geber, que fica perto de Elate”, tripulada por “marinheiros que tinham conhecimento do mar” enviados por Hirão, que trouxe ouro de Ofir, e os navios de Társis de Josafá “naufragaram em Eziom-Geber”. Azarias, ou Uzias, “construiu Elate e a restaurou a Judá” no século VIII a.C., e sob Acaz “Rezim, rei da Síria, recuperou Elate para a Síria, e expulsou os judeus de Elate”; a margem hebraica e a Bíblia Sinodal dizem então que edomitas, e não sírios, se estabeleceram ali, pois os dois nomes diferem por uma letra."
    - "Aila foi o término da estrada de Trajano vinda de Bostra, abrigou uma legião romana desde cerca de 300 d.C. e enviou um bispo ao concílio de Niceia; Eusébio a conhecia como Ailam, cidade na orla da Palestina, junto ao Mar Vermelho, onde estava estacionado um destacamento da Décima Legião. Sob o islã, o porto de Ayla serviu aos peregrinos a caminho de Meca. Hoje Aqaba, único porto marítimo da Jordânia, e Eilat, a estância israelense do Mar Vermelho, defrontam-se através da cabeceira do golfo, com a egípcia Taba e a costa saudita além, e o monte de Tell el-Kheleifeh fica entre elas, na fronteira."
  de:
    - "Elat, oder Eloth, war der Hafen am Kopf des Golfs von Akaba, dem östlichen Arm des Roten Meeres, in der Bibel neben Ezjon-Geber genannt, „das bei Eloth liegt am Ufer des Schilfmeers im Lande der Edomiter“. Seine Lage ist umstritten. Die nabatäische und römische Stadt Aila liegt unter dem heutigen Akaba, wo der islamische Hafen Ayla ausgegraben wurde; Tell el-Kheleifeh, ein Hügel am Ufer zwischen Akaba und Eilat, wurde 1938–40 von Nelson Glueck ausgegraben, der ihn für Ezjon-Geber hielt, doch eine spätere Neubewertung datierte sein Fort und seine Vorratsräume ins 8. bis 6. Jahrhundert v. Chr., was zum Elat Usijas passen würde; andere halten Elat und Ezjon-Geber für denselben Ort, und Israel gab seiner eigenen Stadt Eilat den biblischen Namen. Alle vier erscheinen als Kandidaten auf der Karte."
    - "Israel zog an Edom vorbei „auf dem Wege des Gefildes von Elath und Ezeon-Geber“ auf dem Weg nach Moab. Salomo „machte auch Schiffe zu Ezeon-Geber, das bei Eloth liegt“, bemannt mit Hirams Knechten, „die gute Schiffsleute und auf dem Meer erfahren waren“, und die Gold aus Ofir brachten, und Josaphats Tarsisschiffe, die „wurden zerbrochen zu Ezeon-Geber“. Asarja, oder Usija, „baute Elath und brachte es wieder zu Juda“ im 8. Jahrhundert v. Chr., und unter Ahas „brachte Rezin, König von Syrien, Elath wieder an Syrien und stieß die Juden aus Elath“; der hebräische Randvermerk und die Synodalbibel sagen dann, dass sich dort Edomiter, nicht Syrer niederließen, wobei sich die beiden Namen durch einen Buchstaben unterscheiden."
    - "Aila war Endpunkt von Trajans Straße von Bostra, hielt ab etwa 300 n. Chr. eine römische Legion und sandte einen Bischof zum Konzil von Nizäa; Eusebius kannte es als Ailam, eine Stadt am Rand Palästinas am Roten Meer, wo eine Abteilung der Zehnten Legion stationiert war. Unter dem Islam diente der Hafen Ayla den Pilgern auf dem Weg nach Mekka. Heute liegen Akaba, Jordaniens einziger Seehafen, und Eilat, Israels Ferienort am Roten Meer, einander am Kopf des Golfs gegenüber, mit dem ägyptischen Taba und dem saudischen Ufer dahinter, und der Hügel Tell el-Kheleifeh liegt zwischen ihnen an der Grenze."
  fr:
    - "Élath, ou Éloth, était le port au fond du golfe d’Aqaba, bras oriental de la mer Rouge, nommé dans la Bible à côté d’Étsjon-Guéber « sur les bords de la mer Rouge, dans le pays d’Édom ». Son site est débattu. La ville nabatéenne et romaine d’Aila se trouve sous l’actuelle Aqaba, où le port islamique d’Ayla a été fouillé ; Tell el-Kheleifeh, un tertre sur le rivage entre Aqaba et Eilat, fut fouillé par Nelson Glueck en 1938–1940, qui le prit pour Étsjon-Guéber, mais une réévaluation ultérieure data son fort et ses magasins des VIIIe-VIe siècles av. J.-C., ce qui conviendrait à l’Élath d’Ozias ; d’autres tiennent qu’Élath et Étsjon-Guéber sont un même lieu, et Israël a donné le nom biblique à sa propre ville d’Eilat. Les quatre figurent comme candidats sur la carte."
    - "Israël passa à distance d’Édom « du chemin de la plaine, d’Élath et d’Étsjon-Guéber » en route vers Moab. Salomon « construisit des navires à Étsjon-Guéber, près d’Éloth », montés par « des matelots connaissant la mer » envoyés par Hiram, qui rapportèrent de l’or d’Ophir, et les navires de Tarsis de Josaphat « se brisèrent à Étsjon-Guéber ». Azaria, ou Ozias, « rebâtit Élath et la fit rentrer sous la puissance de Juda » au VIIIe siècle av. J.-C., et sous Achaz « Retsin, roi de Syrie, fit rentrer Élath au pouvoir des Syriens ; il expulsa d’Élath les Juifs » ; la marge hébraïque et la Bible synodale disent alors que ce sont des Édomites, et non des Syriens, qui s’y établirent, les deux noms ne différant que d’une lettre."
    - "Aila fut le terminus de la route de Trajan depuis Bostra, abrita une légion romaine vers 300 apr. J.-C. et envoya un évêque au concile de Nicée ; Eusèbe la connaissait sous le nom d’Ailam, ville aux confins de la Palestine, au bord de la mer Rouge, où stationnait un détachement de la Xe légion. Sous l’islam, le port d’Ayla servit les pèlerins en route vers La Mecque. Aujourd’hui, Aqaba, seul port de Jordanie, et Eilat, station balnéaire israélienne de la mer Rouge, se font face au fond du golfe, avec Taba, en Égypte, et la côte saoudienne au-delà, et le tertre de Tell el-Kheleifeh se trouve entre elles, sur la frontière."
  it:
    - "Elat, o Eloth, era il porto in fondo al Golfo di Aqaba, il braccio orientale del Mar Rosso, nominato nella Bibbia accanto a Ezion-Gheber «sul lido del mar Rosso, nel paese di Edom». Il suo sito è controverso. La città nabatea e romana di Aila giace sotto l’odierna Aqaba, dove è stato scavato il porto islamico di Ayla; Tell el-Kheleifeh, un tell sulla riva fra Aqaba ed Eilat, fu scavato da Nelson Glueck nel 1938–40, che lo ritenne Ezion-Gheber, ma una successiva rivalutazione datò il suo forte e i suoi magazzini all’VIII–VI secolo a.C., il che si adatterebbe all’Elat di Ozia; altri ritengono che Elat ed Ezion-Gheber siano lo stesso luogo, e Israele diede il nome biblico alla propria città di Eilat. Tutti e quattro compaiono come candidati sulla mappa."
    - "Israele passò oltre Edom, «evitando la via della pianura, come pure Elath ed Etsion-Gheber», in cammino verso Moab. Salomone «costruì anche una flotta ad Etsion-Gheber, presso Eloth», con equipaggi di Chiram, «marinai, che conoscevano il mare», che portò oro da Ofir, e le navi di Tarsis di Giosafat «naufragarono a Etsion-Gheber». Azaria, ossia Ozia, «riedificò Elath, e la riconquistò a Giuda» nell’VIII secolo a.C., e sotto Acaz «Retsin, re di Siria, riconquistò Elath alla Siria, e cacciò i Giudei da Elath»; il margine ebraico e la Bibbia sinodale dicono poi che vi si stabilirono Edomiti, non Siri, i due nomi differendo per una sola lettera."
    - "Aila fu il termine della strada di Traiano da Bostra, ospitò una legione romana dal 300 d.C. circa e mandò un vescovo al concilio di Nicea; Eusebio la conosceva come Ailam, città al confine della Palestina presso il Mar Rosso dove era di stanza un distaccamento della Decima Legione. Sotto l’Islam il porto di Ayla serviva i pellegrini diretti alla Mecca. Oggi Aqaba, unico porto marittimo della Giordania, ed Eilat, località israeliana sul Mar Rosso, si fronteggiano in fondo al golfo, con l’egiziana Taba e la riva saudita al di là, e il tell di Tell el-Kheleifeh sta fra loro sul confine."
  pl:
    - "Elat, czyli Elot, był portem na krańcu Zatoki Akaba, wschodniego ramienia Morza Czerwonego, wymienionym w Biblii obok Esjon-Geber „nad brzegiem morza czerwonego, w ziemi Edomskiej”. Jego położenie jest sporne. Nabatejskie i rzymskie miasto Aila leży pod dzisiejszą Akabą, gdzie wykopano islamski port Ajla; Tell el-Chelejfe, kopiec na brzegu między Akabą a Ejlatem, badał Nelson Glueck w latach 1938–40, który uważał go za Esjon-Geber, lecz późniejsza ponowna ocena datowała jego fort i magazyny na VIII–VI w. p.n.e., co pasowałoby do Elatu Uzzjasza; inni sądzą, że Elat i Esjon-Geber to to samo miejsce, a Izrael nadał biblijną nazwę własnemu miastu Ejlat. Wszystkie cztery widnieją na mapie jako kandydaci."
    - "Izrael minął Edom „drogą równą od Elat, i od Asyjongaber” w drodze do Moabu. „Okrętów też nabudował król Salomon w Asyjongaber, które jest podle Elotu”, obsadzonych sługami Hirama (w tekście: „żeglarze świadome morza”), które przywoziły złoto z Ofiru, a tarszijskie okręty Jozafata, jak czytamy, nie doszły, „bo się rozbiły one okręty w Asyjon Gaber”. Azariasz, czyli Uzzjasz, „pobudował Elat, i przywrócił je do Judy” w VIII w. p.n.e., a za Achaza „Rasyn, król Syryjski, przywrócił zasię Elat do Syryi, a wykorzenił Żydy z Elat”; margines hebrajski i Biblia synodalna mówią wtedy, że osiedlili się tam Edomici, nie Syryjczycy, bo obie nazwy różnią się jedną literą."
    - "Aila była końcem drogi Trajana z Bostry, od około 300 r. n.e. stacjonowała tam rzymska legia i wysłała biskupa na sobór w Nicei; Euzebiusz znał ją jako Ailam, miasto na skraju Palestyny nad Morzem Czerwonym, gdzie stacjonował oddział X Legii. Pod islamem port Ajla służył pielgrzymom w drodze do Mekki. Dziś Akaba, jedyny port morski Jordanii, i Ejlat, izraelski kurort nad Morzem Czerwonym, patrzą na siebie przez kraniec zatoki, z egipską Tabą i brzegiem saudyjskim za nimi, a kopiec Tell el-Chelejfe leży między nimi na granicy."
  nl:
    - "Elat, of Eloth, was de havenstad aan het hoofd van de Golf van Akaba, de oostelijke arm van de Rode Zee, in de Bijbel genoemd naast Ezeon-Geber “aan den oever der Schelfzee, in het land van Edom”. De ligging is omstreden. De Nabateese en Romeinse stad Aila ligt onder het moderne Akaba, waar de islamitische haven Ayla is opgegraven; Tell el-Kheleifeh, een heuvel aan de kust tussen Akaba en Eilat, werd in 1938–40 door Nelson Glueck opgegraven, die hem voor Ezeon-Geber hield, maar een latere herbeoordeling dateerde zijn fort en voorraadkamers in de achtste tot zesde eeuw v.Chr., wat bij het Elat van Uzzia zou passen; anderen menen dat Elat en Ezeon-Geber dezelfde plaats zijn, en Israël gaf de bijbelse naam aan zijn eigen stad Eilat. Alle vier staan als kandidaten op de kaart."
    - "Israël trok Edom voorbij “van den weg des vlakken velds, van Elath, en van Ezeon-Geber” op weg naar Moab. Salomo “maakte ook schepen te Ezeon-Geber, dat bij Eloth is”, bemand met Hirams “scheepslieden, kenners van de zee”, die goud uit Ofir brachten, en Josafats schepen van Tarsis “werden gebroken te Ezeon-Geber”. Azarja, of Uzzia, “bouwde Elath, en bracht haar weder aan Juda” in de achtste eeuw v.Chr., en onder Achaz “bracht Rezin, de koning van Syrië, Elath weder aan Syrië, en wierp de Joden uit Elath”; de Hebreeuwse kanttekening en de Synodale Bijbel zeggen dan dat Edomieten, geen Syriërs, zich daar vestigden, twee namen die één letter verschillen."
    - "Aila was het eindpunt van Trajanus' weg uit Bostra, had vanaf omstreeks 300 n.Chr. een Romeins legioen en zond een bisschop naar het concilie van Nicea; Eusebius kende het als Ailam, een stad aan de rand van Palestina aan de Rode Zee waar een detachement van het Tiende Legioen lag. Onder de islam diende de haven Ayla pelgrims op weg naar Mekka. Tegenwoordig liggen Akaba, Jordaniës enige zeehaven, en Eilat, Israëls badplaats aan de Rode Zee, tegenover elkaar aan het hoofd van de golf, met het Egyptische Taba en de Saoedische kust erachter, en de heuvel Tell el-Kheleifeh ligt tussen hen in op de grens."
  cs:
    - "Élat, též Elot, byl přístav na horním konci Akabského zálivu, východního ramene Rudého moře, jmenovaný v Bibli vedle Ecjon-gebera „na břehu moře Rudého v zemi Idumejské“. Jeho poloha je sporná. Nabatejské a římské město Aila leží pod dnešní Akabou, kde byl vykopán islámský přístav Ayla; Tell el-Kheleifeh, pahorek na břehu mezi Akabou a Eilatem, vykopával Nelson Glueck v letech 1938–40, který jej pokládal za Ecjon-geber, ale pozdější přehodnocení datovalo jeho pevnost a skladiště do 8. až 6. století př. n. l., což by se hodilo k Élatu za Uzijáše; jiní tvrdí, že Élat a Ecjon-geber jsou totéž místo, a Izrael dal biblické jméno vlastnímu městu Eilat. Všechny čtyři se na mapě objevují jako kandidáti."
    - "Izrael prošel kolem Edómu „s cesty polní od Elat a od Aziongaber“ na cestě do Moábu. Šalomoun podle Bible „nadělal také … lodí velikých v Aziongaber, kteréž jest podlé Elat“, na něž Chíram poslal „plavce umělé na moři“; lodě přivezly zlato z Ofíru, a o Jozafatovi se praví, že nadělal lodí mořských, ale „nejeli, nebo polámaly se lodí v Aziongaber“. Azarjáš neboli Uzijáš „vzdělal Elat a dobyl ho Judovi“ v 8. století př. n. l. a za Achaze „Rezin král Syrský odtrhl zase město Elat k Syrii, a vyplénil Židy z Elot“; hebrejská okrajová poznámka a synodální Bible pak říkají, že se tam usadili Edómci, ne Syřané, přičemž obě jména se liší jedním písmenem."
    - "Aila byla konečnou stanicí Traianovy cesty z Bostry, držela od asi 300 n. l. římskou legii a poslala biskupa na nicejský koncil; Eusebios ji znal jako Ailam, město na kraji Palestiny u Rudého moře, kde byl umístěn oddíl Desáté legie. Za islámu sloužil přístav Ayla poutníkům na cestě do Mekky. Dnes Akaba, jediný jordánský námořní přístav, a Eilat, izraelské letovisko u Rudého moře, stojí proti sobě přes horní konec zálivu, za nimi egyptská Taba a saúdský břeh, a pahorek Tell el-Kheleifeh leží mezi nimi na hranici."
  sv:
    - "Elat, eller Elot, var hamnen vid Akabaviken, Röda havets östra arm, nämnd i Bibeln vid sidan av Esjon-Geber, ”på stranden av Röda havet, i Edoms land”. Dess läge är omtvistat. Den nabatéiska och romerska staden Aila ligger under dagens Aqaba, där den islamiska hamnen Ayla har grävts ut; Tell el-Kheleifeh, en kulle vid stranden mellan Aqaba och Eilat, grävdes av Nelson Glueck 1938–40, som höll den för Esjon-Geber, men en senare omvärdering daterade dess fort och förrådsrum till 700- till 500-talen f.Kr., vilket skulle passa Ussias Elat; andra menar att Elat och Esjon-Geber är samma plats, och Israel gav det bibliska namnet åt sin egen stad Eilat. Alla fyra förekommer som kandidater på kartan."
    - "Israel passerade Edom och ”lämnade Hedmarksvägen och Elat och Esjon-Geber” på väg mot Moab. Salomo byggde ”en flotta i Esjon-Geber, som ligger vid Elot”, bemannad med Hirams ”sjökunnigt skeppsmanskap”, som hämtade guld från Ofir, och Josafats Tarshish-skepp ”ledo skeppsbrott vid Esjon-Geber”. Asarja, eller Ussia, ”befäste Elat; ock han lade det åter under Juda” på 700-talet f.Kr., och under Achas ”återvann Resin, konungen i Aram, Elat åt Aram och jagade Juda män bort ifrån Elot”; den hebreiska marginalen och den synodala bibeln säger sedan att det var edoméer, inte araméer, som bosatte sig där, två namn som skiljer sig med en bokstav."
    - "Aila var slutpunkten för Trajanus väg från Bostra, höll en romersk legion från omkring år 300 och sände en biskop till konciliet i Nicaea; Eusebios kände den som Ailam, en stad vid Palestinas kant vid Röda havet där en avdelning av tionde legionen var förlagd. Under islam tjänade hamnen Ayla pilgrimer på väg till Mecka. I dag ligger Aqaba, Jordaniens enda sjöstad, och Eilat, Israels semesterort vid Röda havet, mitt emot varandra över vikens inre del, med egyptiska Taba och den saudiska stranden bortom, och kullen Tell el-Kheleifeh ligger mellan dem vid gränsen."
  nb:
    - "Elat, eller Elot, var havnen ved enden av Akababukta, den østlige armen av Rødehavet, nevnt i Bibelen ved siden av Esjon-Geber «på bredden av det Røde Hav i Edoms land». Dens beliggenhet er omdiskutert. Den nabateiske og romerske byen Aila ligger under dagens Aqaba, der den islamske havnen Ayla er gravd ut; Tell el-Kheleifeh, en haug på stranden mellom Aqaba og Eilat, ble gravd av Nelson Glueck i 1938–40, som regnet den for Esjon-Geber, men en senere revurdering daterte dens fort og lagerrom til 700- til 500-tallet f.Kr., noe som ville passe Ussias Elat; andre mener at Elat og Esjon-Geber er samme sted, og Israel gav det bibelske navnet til sin egen by Eilat. Alle fire står som kandidater på kartet."
    - "Israel passerte Edom ved «veien som går fra Elat og Esjon-Geber gjennem ødemarken» på vei til Moab. Salomo «lot også bygge skiber i Esjon-Geber, som ligger ved Elot», bemannet med Hirams «sjøvant mannskap», som hentet gull fra Ofir, og Josjafats Tarsis-skip: «nogen av skibene forliste ved Esjon-Geber». Asarja, eller Ussia, «gjorde Elat til en fast by og vant det tilbake for Juda» på 700-tallet f.Kr., og under Ahas «la kongen i Syria Resin Elat til Syria; han drev jødene bort fra Elat»; den hebraiske marginen og den synodale bibelen sier så at edomitter, ikke syrere, bosatte seg der, siden de to navnene skiller seg med én bokstav."
    - "Aila var endestasjonen for Trajans vei fra Bostra, holdt en romersk legion fra omkring 300 e.Kr. og sendte en biskop til konsilet i Nikea; Eusebius kjente den som Ailam, en by ved kanten av Palestina ved Rødehavet der en avdeling av Tiende legion var stasjonert. Under islam tjente havnen Ayla pilegrimer på vei til Mekka. I dag ligger Aqaba, Jordans eneste sjøhavn, og Eilat, Israels badeby ved Rødehavet, vendt mot hverandre over enden av bukten, med egyptiske Taba og den saudiske kysten bortenfor, og haugen Tell el-Kheleifeh ligger mellom dem på grensen."
  tl:
    - "Ang Elath, o Eloth, ay ang daungan sa dulo ng Golpo ng Aqaba, ang silangang bisig ng Dagat na Pula, na pinangalanan sa Bibliya sa tabi ng Esion-geber “sa baybayin ng Dagat na Mapula, sa lupain ng Edom”. Pinagtatalunan ang pook nito. Ang bayang Nabateo at Romano ng Aila ay nasa ilalim ng makabagong Aqaba, kung saan hinukay ang daungang Islamiko ng Ayla; ang Tell el-Kheleifeh, isang tel sa baybayin sa pagitan ng Aqaba at Eilat, ay hinukay ni Nelson Glueck noong 1938–40, na inakalang Esion-geber, ngunit ipinetsa ng mas huling muling pagtatasa ang kuta at mga imbakan nito sa ika-8 hanggang ika-6 na siglo BK, na babagay sa Elath ni Uzzias; iniisip ng iba na iisang pook ang Elath at Esion-geber, at ibinigay ng Israel ang pangalang biblikal sa sarili nitong bayan ng Eilat. Lahat ng apat ay lumilitaw na kandidato sa mapa."
    - "Dumaan ang Israel sa Edom “mula sa daan ng Araba, mula sa Elath at mula sa Esion-geber” patungong Moab. Si Salomon ay nagpagawa ng mga “sasakyang dagat sa Ezion-geber na nasa siping ng Elath”, na pinuno ng “mga magdadagat na bihasa sa dagat” ni Hiram, na nagdala ng ginto mula Ophir, at ang mga sasakyang Tharsis ni Josaphat ay “nangasira sa Ezion-geber”. Si Azarias, o Uzzias, ay “itinayo ang Elath, at isinauli sa Juda” noong ika-8 siglo BK, at sa ilalim ni Achaz ay “binawi ni Resin na hari sa Siria ang Elath sa Siria at pinalayas ang mga Judio sa Elath”; sinasabi ng gilid na tala ng Hebreo at ng Bibliyang Sinodal na mga Edomita, hindi Siryo, ang nanirahan doon, at isang titik lamang ang pagkakaiba ng dalawang pangalan."
    - "Ang Aila ang dulo ng daan ni Trajano mula Bostra, may legiyong Romano mula mga 300 AD, at nagsugo ng obispo sa konsilyo ng Nicaea; kilala ito ni Eusebio bilang Ailam, bayan sa gilid ng Palestina sa tabi ng Dagat na Pula kung saan nakahimpil ang isang pangkat ng Ikasampung Legiyon. Sa ilalim ng Islam, naglingkod ang daungan ng Ayla sa mga peregrinong patungong Mecca. Ngayon, ang Aqaba, ang tanging daungan ng Jordan, at ang Eilat, ang pasyalang Dagat na Pula ng Israel, ay magkaharap sa dulo ng golpo, na ang Taba ng Egipto at ang baybaying Saudi ay nasa kabila, at ang tel ng Tell el-Kheleifeh ay nasa pagitan nila sa hangganan."
  da:
    - "Elat, eller Eloth, var havnen inderst i Aqaba-bugten, Det Røde Havs østlige arm, nævnt i Bibelen ved siden af Esjon-Geber »ved det røde Havs Bred, i Edoms Land«. Dens sted er omstridt. Den nabatæiske og romerske by Aila ligger under det moderne Aqaba, hvor den islamiske havn Ayla er udgravet; Tell el-Kheleifeh, en høj ved kysten mellem Aqaba og Eilat, blev udgravet af Nelson Glueck i 1938–40, som anså den for Esjon-Geber, men en senere revurdering daterede dens fort og lagerrum til 700- til 500-tallet f.Kr., hvilket ville passe til Uzzijas Elat; andre mener, at Elat og Esjon-Geber er det samme sted, og Israel gav det bibelske navn til sin egen by Eilat. Alle fire optræder som kandidater på kortet."
    - "Israel drog forbi Edom »paa Vejen til den slette Mark, fra Elath og fra Eziongeber« på vej til Moab. Salomo »lod gøre Skibe i Eziongeber, som er ved Eloth«, bemandet med Hirams »Skibsmænd, forfarne til Søs«, som bragte guld fra Ofir, og Josafats Tarsis-skibe »bleve sønderslagne i Ezion-Geber«. Azarja, eller Uzzija, »byggede Elath og bragte den igen til Juda« i 700-tallet f.Kr., og under Akaz »bragte Rezin, Kongen af Syrien, Elath igen til Syrien og fordrev Jøderne af Elath«; den hebraiske marginal og den synodale bibel siger derpå, at edomitter, ikke syrere, bosatte sig dér, idet de to navne adskiller sig med ét bogstav."
    - "Aila var endestationen for Trajans vej fra Bostra, holdt en romersk legion fra omkring 300 e.Kr. og sendte en biskop til koncilet i Nikæa; Eusebios kendte den som Ailam, en by ved Palæstinas rand ved Det Røde Hav, hvor en afdeling af Tiende Legion var stationeret. Under islam tjente havnen Ayla pilgrimme på vej til Mekka. I dag ligger Aqaba, Jordans eneste havneby, og Eilat, Israels badeby ved Det Røde Hav, over for hinanden inderst i bugten, med egyptiske Taba og den saudiske kyst bagved, og højen Tell el-Kheleifeh ligger mellem dem på grænsen."
  sr:
    - "Елат, или Елот, била је лука у дну Акабског залива, источног крака Црвеног мора, наведена у Библији уз Есион-Гавер, „који је код Елота на брегу црвеног мора у земљи едомској“. Њено место је спорно. Набатејски и римски град Аила лежи испод данашње Акабе, где је ископана исламска лука Ајла; Тел ел Хелејфа, хумку на обали између Акабе и Ејлата, копао је Нелсон Глук 1938–40, који ју је сматрао Есион-Гавером, али каснија преоцена датирала је њену тврђаву и складишта у 8. до 6. век п. н. е., што би одговарало Озијином Елату; други држе да су Елат и Есион-Гавер исто место, а Израел је библијско име дао свом граду Ејлату. Сва четири се на карти јављају као кандидати."
    - "Израиљ је прошао поред Едома „пољем од Елата и од Гесион-Гавера“ на путу у Моав. Соломун, како стоји, „лађе начини цар Соломун у Есион-Гаверу, који је код Елота“, а Хирам је послао „лађаре веште мору“, који су доносили злато из Офира, а Јосафатове тарсиске лађе: „јер се лађе разбише у Есион-Гаверу“. Азарија, или Озија, „сазида Елат повративши га Јуди“ у 8. веку п. н. е., а под Ахазом „Ресин цар сирски поврати Сирцима Елат, и изагна Јудеје из Елата“; хебрејска маргина и Синодална Библија тада кажу да су ту живели Едомци, а не Сирци, пошто се два имена разликују за једно слово."
    - "Аила је била крајња тачка Трајановог пута из Бостре, држала је римску легију од око 300. н. е. и послала епископа на сабор у Никеју; Јевсевије ју је знао као Аилам, град на рубу Палестине уз Црвено море где је био стациониран одред Десете легије. Под исламом лука Ајла служила је ходочасницима на путу за Меку. Данас Акаба, једина лука Јордана, и Ејлат, израелско одмаралиште на Црвеном мору, гледају један другог преко дна залива, са египатском Табом и саудијском обалом иза њих, а хумка Тел ел Хелејфа лежи између њих на граници."
  hu:
    - "Élát, vagy Élót, az Akabai-öböl, a Vörös-tenger keleti ága végén fekvő kikötő volt, a Bibliában Ecjón-Géber mellett említve, „a Veres tenger partján, az Edom földén”. Helye vitatott. A nabateus és római Aila a mai Akaba alatt fekszik, ahol az iszlám kori Ajla kikötőjét ásták; Tell el-Kheleifeh, az Akaba és Ejlat közötti parti halom, amelyet Nelson Glueck 1938–40-ben ásott, és Ecjón-Gébernek vett, de egy későbbi újraértékelés erődjét és raktárhelyiségeit a Kr. e. 8–6. századra keltezte, ami Uzziás Élátjához illene; mások szerint Élát és Ecjón-Géber ugyanaz a hely, Izrael pedig a bibliai nevet adta saját Ejlat városának. Mind a négy jelöltként szerepel a térképen."
    - "Izráel Edomot „a síkság útján Eláthtól és Éczjon-Gebertől fogva” kerülte meg Moáb felé menet. Salamon „hajókat is csináltata ... Esiongáberben, a mely Elót mellett van”, Hírám szolgái pedig „jó hajósok és a tengeren jártasak” voltak, és Ofírból aranyat hoztak; Jósafát Társis-hajókat csináltatott, de „a hajók összetörtek Esiongáberben”. Azarjá, vagyis Uzziás „építé meg Elátot, a melyet visszavett Júdának” a Kr. e. 8. században, és Áház alatt „nyerte vissza Réczin, Siria királya Elátot a Siriabelieknek, és irtotta ki a zsidókat Elátból”; a héber széljegyzet és a Szinodális Biblia szerint ezután edomiak, nem szíriaiak telepedtek le ott, a két név egy betűben különbözik."
    - "Aila Traianus Bosztrából induló útjának végpontja volt, Kr. u. 300 körül római légiót tartott, és püspököt küldött a níkaiai zsinatra; Eusebius Ailamként ismerte, Palesztina szélén a Vörös-tenger mellett fekvő városként, ahol a X. légió egy különítménye állomásozott. Az iszlám alatt Ajla kikötője a Mekkába tartó zarándokokat szolgálta. Ma Akaba, Jordánia egyetlen tengeri kikötője, és Ejlat, Izrael vörös-tengeri üdülővárosa néznek egymással szembe az öböl végén, mögöttük az egyiptomi Tábá és a szaúdi part, közöttük pedig a határon a Tell el-Kheleifeh halma."
  fi:
    - "Elat eli Elot oli satama Aqaban lahden pohjukassa, Punaisenmeren itähaarassa, mainittu Raamatussa Esjon-Geberin vieressä ”Kaislameren rannalla Edomin maassa”. Sen sijainti on kiistanalainen. Nabatealainen ja roomalainen Aila-kaupunki on nykyisen Aqaban alla, missä islamilaista Ayla-satamaa on kaivettu; Tell el-Kheleifeh, rannalla Aqaban ja Eilatin välissä oleva kumpare, jonka Nelson Glueck kaivoi vuosina 1938–40 ja katsoi Esjon-Geberiksi, mutta myöhempi uudelleenarviointi ajoitti sen linnoituksen ja varastohuoneet 700–500-luvuille eaa., mikä sopisi Ussian Elatiin; toiset katsovat, että Elat ja Esjon-Geber ovat sama paikka, ja Israel antoi raamatullisen nimen omalle Eilat-kaupungilleen. Kaikki neljä esiintyvät kartalla ehdokkaina."
    - "Israel kulki Edomin ohi ”Aromaan tieltä, joka tulee Eelatista ja Esjon-Geberistä”, matkalla Moabiin. Salomo ”rakensi myös laivaston Esjon-Geberissä, joka on lähellä Eelatia”, jonka miehistönä oli Hiramin ”meritaitoisia laivamiehiä”, ja joka toi kultaa Ofirista, ja Josafatin Tarsiin-laivat ”särkyivät Esjon-Geberissä”. Asarja eli Ussia ”linnoitti Eelatin ja palautti sen Juudalle” 700-luvulla eaa., ja Ahaan aikana ”Resin, Aramin kuningas, palautti Eelatin Aramille ja karkoitti Juudan miehet Eelatista”; heprealainen marginaali ja synodaalikäännös sanovat sitten, että siellä asettuivat edomilaiset eivätkä syyrialaiset, kahden nimen eroten yhden kirjaimen verran."
    - "Aila oli Trajanuksen Bostrasta johtavan tien päätepiste, siellä oli roomalainen legioona noin vuodesta 300 jaa., ja se lähetti piispan Nikaian kirkolliskokoukseen; Eusebios tunsi sen nimellä Ailam, Palestiinan reunalla Punaisenmeren rannalla sijaitseva kaupunki, jossa oli Kymmenennen legioonan osasto. Islamin aikana Ayla-satama palveli Mekkaan matkaavia pyhiinvaeltajia. Nykyisin Aqaba, Jordanian ainoa merisatama, ja Eilat, Israelin Punaisenmeren lomakaupunki, ovat vastakkain lahden pohjukassa, Egyptin Taba ja Saudi-Arabian ranta niiden takana, ja Tell el-Kheleifehin kumpare sijaitsee niiden välissä rajalla."
  vi:
    - "Ê-lát, hay Ê-lốt, là hải cảng ở đầu Vịnh Aqaba, nhánh đông của Biển Đỏ, được Kinh Thánh nêu tên bên cạnh Ê-xi-ôn-Ghê-be, “trên mé Biển đỏ, trong xứ Ê-đôm”. Vị trí còn tranh cãi. Thị trấn Nabataea và La Mã Aila nằm dưới Aqaba hiện đại, nơi cảng Hồi giáo Ayla đã được khai quật; Tell el-Kheleifeh, một gò trên bờ giữa Aqaba và Eilat, được Nelson Glueck đào năm 1938–40, người coi nó là Ê-xi-ôn-Ghê-be, nhưng một cuộc đánh giá lại về sau định niên đại pháo đài và các phòng kho của nó vào các thế kỷ 8 đến 6 TCN, điều sẽ phù hợp với Ê-lát của Ô-xia; những người khác cho rằng Ê-lát và Ê-xi-ôn-Ghê-be là cùng một nơi, và Israel đặt tên Kinh Thánh cho thị trấn Eilat của mình. Cả bốn xuất hiện như các ứng viên trên bản đồ."
    - "Y-sơ-ra-ên đi ngang Ê-đôm, “tránh con đường đồng bằng, cùng Ê-lát và Ê-xi-ôn-Ghê-be”, trên đường đến Mô-áp. Sa-lô-môn “sắm sửa một đoàn tàu tại Ê-xi-ôn-Ghê-be, gần Ê-lốt”, có “những thủy thủ, thông thạo về nghề đi biển” của Hi-ram, chở vàng từ Ô-phia về, và các tàu Ta-rê-si của Giô-sa-phát “vỡ ra tại Ê-xi-ôn-Ghê-be”. A-xa-ria, tức Ô-xia, “lại xây Ê-lát, và khôi phục thành ấy về dưới quyền Giu-đa” vào thế kỷ 8 TCN, và dưới thời A-cha, “Rê-xin, vua Sy-ri; khôi phục Ê-lát, về nước Sy-ri; người đuổi dân Giu-đa khỏi Ê-lát”; chú thích Hê-bơ-rơ bên lề và Kinh Thánh Synodal sau đó nói rằng người Ê-đôm, chứ không phải người Sy-ri, đến định cư ở đó, hai tên chỉ khác nhau một chữ cái."
    - "Aila là điểm cuối của con đường Trajanus từ Bostra, nắm một quân đoàn La Mã từ khoảng năm 300, và gửi một giám mục đến Công đồng Nicaea; Eusebius biết nó là Ailam, một thị trấn ở rìa Palestine bên Biển Đỏ nơi đóng một phân đội của Quân đoàn X. Dưới Hồi giáo, cảng Ayla phục vụ khách hành hương đi Mecca. Ngày nay Aqaba, cảng biển duy nhất của Jordan, và Eilat, khu nghỉ dưỡng Biển Đỏ của Israel, đối diện nhau qua đầu vịnh, với Taba của Ai Cập và bờ biển Ả Rập Xê Út ở xa hơn, và gò Tell el-Kheleifeh nằm giữa chúng trên biên giới."
  ro:
    - "Elat, sau Elot, era portul de la capătul Golfului Aqaba, brațul estic al Mării Roșii, numit în Biblie alături de Ețion-Gheber „la marginea mării cei dinapoi în pământul Edomului”. Locul lui este disputat. Orașul nabateean și roman Aila se află sub Aqaba de azi, unde a fost săpat portul islamic Ayla; Tell el-Kheleifeh, o movilă pe țărm între Aqaba și Eilat, a fost săpată de Nelson Glueck în 1938–40, care a luat-o drept Ețion-Gheber, dar o reevaluare ulterioară a datat fortul și încăperile ei de depozit în secolele al VIII-lea–al VI-lea î.Hr., ceea ce s-ar potrivi cu Elatul lui Ozia; alții susțin că Elat și Ețion-Gheber sunt același loc, iar Israelul a dat numele biblic propriului său oraș Eilat. Toate patru apar drept candidate pe hartă."
    - "Israel a trecut pe lângă Edom „lângă calea Aravei, dela Elon, și dela Ghesion Gaver”, în drum spre Moab. „A făcut împăratul Solomon corabie în Gasionul Gaverului, care este lângă Elat”, cu „oameni corăbieri, carii știeau umblà pre mare” trimiși de Hiram, care au adus aur din Ofir, iar corăbiile de Tarsis ale lui Iosafat s-au sfărâmat la Ețion-Gheber. Azaria, sau Ozia, „a zidit Elotul, și o a întors Iudei” în secolul al VIII-lea î.Hr., iar sub Ahaz „a întors Raason împăratul Siriei Elatul la Siria, și a scos pre Evrei din Elat”; marginea ebraică și Biblia sinodală spun apoi că edomiții, nu sirienii, s-au așezat acolo, cele două nume deosebindu-se printr-o literă."
    - "Aila a fost capătul drumului lui Traian de la Bostra, a ținut o legiune romană din jurul anului 300 d.Hr. și a trimis un episcop la sinodul de la Nicaea; Eusebiu o cunoștea ca Ailam, o cetate la marginea Palestinei, lângă Marea Roșie, unde era staționat un detașament al Legiunii a X-a. Sub islam, portul Ayla a slujit pelerinilor în drum spre Mecca. Astăzi Aqaba, singurul port maritim al Iordaniei, și Eilat, stațiunea Israelului de la Marea Roșie, se privesc peste capătul golfului, cu Taba egipteană și țărmul saudit dincolo, iar movila Tell el-Kheleifeh se află între ele, la graniță."
  bg:
    - "Елат, или Елот, бил пристанището на върха на залива Акаба, източния ръкав на Червено море, назован в Библията до Ецион-Гавер „на устието на червено Море, в земята Едом“. Мястото му е спорно. Набатейският и римски град Айла лежи под днешна Акаба, където е разкопано ислямското пристанище Айла; Тел ел-Хелейфе, могила на брега между Акаба и Ейлат, била разкопана от Нелсън Глюк през 1938–1940 г., който я смятал за Ецион-Гавер, но по-късна преоценка датира крепостта и складовете ѝ към VIII–VI в. пр.н.е., което би подхождало на Елат на Узия; други смятат, че Елат и Ецион-Гавер са едно и също място, а Израил дал библейското име на своя град Ейлат. И четирите се появяват като кандидати на картата."
    - "Израил заобиколил Едом „през пътя на полето от Елат и от Есион-гавер“ на път към Моав. „Направи цар Соломон кораби в Есион-гавер, който е при Елот“, с Хирамови „изкусни по морето корабници“, които донесли злато от Офир, а Тарсийските кораби на Йосафат „се строшиха в Есион-гавер“. Азария, или Узия, „съгради Елат, и възвърна го на Юда“ през VIII в. пр.н.е., а при Ахаз „Расин Сирийският цар тури пак Елат под властта на Сирия, и изпъди Юдеите из Елат“; еврейското поле и Синодалната Библия казват след това, че там се заселили едомци, а не сирийци, като двете имена се различават с една буква."
    - "Айла била краят на пътя на Траян от Бостра, от около 300 г. н.е. в нея стоял римски легион и тя изпратила епископ на Никейския събор; Евсевий я познавал като Айлам, град на края на Палестина при Червено море, където бил разположен отряд от Десети легион. При исляма пристанището Айла служело на поклонниците по пътя за Мека. Днес Акаба, единственото морско пристанище на Йордания, и Ейлат, израилският курорт на Червено море, гледат един към друг през върха на залива, с египетската Таба и саудитския бряг отвъд, а могилата Тел ел-Хелейфе лежи между тях на границата."
