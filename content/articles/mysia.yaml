body:
  en:
    - "Mysia was the north-western corner of Asia Minor, between the Hellespont and the Sea of Marmara to the north, Bithynia to the east and Lydia to the south; the Troad, with Troas and Assos, and the cities of Pergamum and Adramyttium lay within or beside it. It belonged to the Attalid kings of Pergamum; the last of them left his kingdom to Rome in 133 BC, and after the revolt of Aristonicus it became part of the Roman province of Asia, organised by Manius Aquillius. By Paul's time Mysia was a regional name, not a separate state."
    - "Acts names it twice in one passage. Kept by the Holy Spirit from preaching in Asia, Paul, Silas and Timothy went north: “After they were come to Mysia, they assayed to go into Bithynia: but the Spirit suffered them not. And they passing by Mysia came down to Troas.” There Paul saw the vision of the man of Macedonia. “Passing by” probably means crossing the region without stopping to preach. Mysia lies today in north-western Turkey, mostly in the provinces of Balıkesir, Bursa and Çanakkale."
    - "Homer counts the Mysians, led by Chromis and Ennomus, among the allies of Troy. Their origin was debated in antiquity. Strabo reports that some called them Thracians and others Lydians, and that Xanthus of Lydia and Menecrates of Elaea derived their name from the Lydian word for the oxya tree, which grows thickly around Mount Olympus. He divides Mysia into two parts, Olympene around the Mysian Olympus and the country of the Caicus river around Pergamum. He admits that its borders with the Phrygians and Bithynians were hard to draw, and that under Roman rule most of these peoples had lost their languages and their names."
    - "Under the empire Cyzicus was the capital of Mysia and later of the province of Hellespontus, and the metropolitan see of its church. The Arian Eunomius was one of its bishops, and Proclus, later patriarch of Constantinople, was consecrated for it, though the people of Cyzicus elected another bishop before he could take up the see."
  ru:
    - "Мисия — северо-западный угол Малой Азии между Геллеспонтом и Мраморным морем на севере, Вифинией на востоке и Лидией на юге; область Троада с городами Троадой и Ассом, а также Пергам и Адрамит лежали в ней или рядом с ней. Она принадлежала Атталидам, царям Пергама; последний из них в 133 г. до н. э. завещал своё царство Риму, и после восстания Аристоника она вошла в римскую провинцию Азия, устроенную Манием Аквилием. Ко времени Павла Мисия была названием края, а не отдельным государством."
    - "Деяния называют её дважды в одном рассказе. Когда Дух Святой не допустил Павла, Силу и Тимофея проповедовать в Азии, они пошли на север: «Дойдя до Мисии, предпринимали идти в Вифинию; но Дух не допустил их. Миновав же Мисию, сошли они в Троаду». Там Павлу было видение мужа Македонянина. «Миновав», вероятно, значит, что они прошли край, не останавливаясь для проповеди. Сегодня Мисия лежит на северо-западе Турции, большей частью в провинциях Балыкесир, Бурса и Чанаккале."
    - "Гомер называет мисийцев во главе с Хромием и Энномом среди союзников Трои. Об их происхождении спорили уже в древности. Страбон сообщает, что одни считали их фракийцами, другие лидийцами и что Ксанф Лидийский и Менекрат Элейский выводили их имя из лидийского названия дерева оксия, которое во множестве растёт вокруг горы Олимп. Он делит Мисию на две части: Олимпену вокруг Мисийского Олимпа и область реки Каик вокруг Пергама. Он признаёт, что её границы с фригийцами и вифинцами трудно провести и что под властью Рима большинство этих народов утратило свои языки и имена."
    - "В имперское время Кизик был столицей Мисии, а затем провинции Геллеспонт и митрополией её церкви. Одним из его епископов был арианин Евномий, а Прокл, впоследствии патриарх Константинопольский, был рукоположен на эту кафедру, но жители Кизика избрали другого епископа, прежде чем он успел её занять."
  uk:
    - "Місія була північно-західним кутом Малої Азії, між Геллеспонтом і Мармуровим морем на півночі, Віфінією на сході й Лідією на півдні; околиці Трої з містом Троада та Ассосом і міста Пергам та Адрамитій лежали в її межах або поряд. Вона належала царям Пергама з династії Атталідів; останній з них заповів своє царство Риму 133 р. до н. е., і після повстання Аристоніка вона стала частиною римської провінції Азія, яку облаштував Маній Аквілій. За часів Павла Місія була регіональною назвою, а не окремою державою."
    - "Дії двічі називають її в одному уривку. Дух Святий утримав Павла, Силу й Тимофія від проповіді в Азії, і вони пішли на північ: «Прийшовши ж в Мисию, поривались ійти в Витинию, і не пустив їх Дух. Перейшовши ж Мисию, прийшли в Трояду.» Там Павло побачив видіння македонця. «Перейшовши», імовірно, означає перетнути край, не зупиняючись проповідувати. Місія лежить сьогодні в північно-західній Туреччині, здебільшого в провінціях Баликесір, Бурса і Чанаккале."
    - "Гомер називає місійців на чолі з Хромієм та Енномом серед союзників Трої. Про їхнє походження сперечалися вже в давнину. Страбон повідомляє, що одні вважали їх фракійцями, інші лідійцями і що Ксанф Лідійський і Менекрат з Елеї виводили їхнє ім'я від лідійської назви дерева оксія, яке рясно росте довкола гори Олімп. Він ділить Місію на дві частини: Олімпену довкола Місійського Олімпу і край річки Каїк довкола Пергама. Він визнає, що її межі з фригійцями та віфінцями важко провести і що під владою Рима більшість цих народів втратила свої мови та імена."
    - "За імперії Кізік був столицею Місії, а згодом провінції Геллеспонт і митрополією її церкви. Одним із його єпископів був аріанин Євномій, а Прокла, згодом патріарха Константинопольського, висвятили на цю кафедру, але мешканці Кізіка обрали іншого єпископа, перш ніж він устиг її посісти."
  es:
    - "Misia era el rincón noroccidental de Asia Menor, entre el Helesponto y el mar de Mármara, al norte, Bitinia, al este, y Lidia, al sur; la Tróade, con Troas y Asón, y las ciudades de Pérgamo y Adramitio se hallaban dentro o junto a ella. Perteneció a los reyes atálidas de Pérgamo; el último de ellos legó su reino a Roma en 133 a. C., y tras la revuelta de Aristónico pasó a formar parte de la provincia romana de Asia, organizada por Manio Aquilio. En tiempos de Pablo, Misia era un nombre regional, no un Estado separado."
    - "Hechos la nombra dos veces en un mismo pasaje. Impedidos por el Espíritu Santo de predicar en Asia, Pablo, Silas y Timoteo fueron hacia el norte: «Y como vinieron á Misia, tentaron de ir á Bithynia; mas el Espíritu no les dejó. Y pasando á Misia, descendieron á Troas». Allí Pablo vio la visión del varón de Macedonia. «Pasando» significa probablemente cruzar la región sin detenerse a predicar. Misia se halla hoy en el noroeste de Turquía, sobre todo en las provincias de Balıkesir, Bursa y Çanakkale."
    - "Homero cuenta a los misios, mandados por Cromis y Ennomo, entre los aliados de Troya. Su origen se discutía ya en la Antigüedad. Estrabón refiere que unos los tenían por tracios y otros por lidios, y que Janto de Lidia y Menécrates de Elea derivaban su nombre de la palabra lidia para el árbol oxya, que abunda en torno al monte Olimpo. Divide Misia en dos partes, la Olimpene, en torno al Olimpo de Misia y la región del río Caico en torno a Pérgamo. Admite que sus fronteras con frigios y bitinios eran difíciles de trazar y que bajo el dominio romano la mayoría de estos pueblos había perdido sus lenguas y sus nombres."
    - "Bajo el Imperio, Cícico fue la capital de Misia y después de la provincia del Helesponto, y la sede metropolitana de su Iglesia. El arriano Eunomio fue uno de sus obispos, y Proclo, más tarde patriarca de Constantinopla, fue consagrado para ella, aunque los habitantes de Cícico eligieron a otro obispo antes de que pudiera ocupar la sede."
  pt:
    - "A Mísia era o canto noroeste da Ásia Menor, entre o Helesponto e o mar de Mármara, ao norte, a Bitínia, a leste, e a Lídia, ao sul; a Tróade, com Trôade e Assôs, e as cidades de Pérgamo e Adramítio ficavam dentro ou ao lado dela. Pertencia aos reis atálidas de Pérgamo; o último deles deixou seu reino a Roma em 133 a.C., e após a revolta de Aristônico passou a fazer parte da província romana da Ásia, organizada por Mânio Aquílio. No tempo de Paulo, a Mísia era um nome regional, e não um Estado separado."
    - "Atos a nomeia duas vezes numa só passagem. Impedidos pelo Espírito Santo de pregar na Ásia, Paulo, Silas e Timóteo foram para o norte: “Quando chegaram perto da Mísia, tentaram ir para a Bitínia, mas o Espírito não lhes permitiu. Passando pela Mísia, desceram a Trôade.” Ali Paulo viu a visão do homem da Macedônia. “Passando” provavelmente significa atravessar a região sem parar para pregar. A Mísia fica hoje no noroeste da Turquia, sobretudo nas províncias de Balıkesir, Bursa e Çanakkale."
    - "Homero conta os mísios, comandados por Crômis e Ênomo, entre os aliados de Troia. Sua origem já era debatida na Antiguidade. Estrabão relata que uns os tinham por trácios e outros por lídios, e que Xanto da Lídia e Menécrates de Eleia derivavam seu nome da palavra lídia para a árvore oxya, que abunda em torno do monte Olimpo. Ele divide a Mísia em duas partes, a Olimpena, em torno do Olimpo da Mísia e a região do rio Caico em torno de Pérgamo. Admite que suas fronteiras com frígios e bitínios eram difíceis de traçar e que, sob o domínio romano, a maioria desses povos havia perdido suas línguas e seus nomes."
    - "Sob o Império, Cízico foi a capital da Mísia e depois da província do Helesponto, e a sé metropolitana de sua Igreja. O ariano Eunômio foi um de seus bispos, e Proclo, mais tarde patriarca de Constantinopla, foi sagrado para ela, embora os habitantes de Cízico tenham eleito outro bispo antes que ele pudesse assumir a sé."
  de:
    - "Mysien war die Nordwestecke Kleinasiens, zwischen dem Hellespont und dem Marmarameer im Norden, Bithynien im Osten und Lydien im Süden; die Troas mit Troas und Assos sowie die Städte Pergamon und Adramyttion lagen in ihm oder daneben. Es gehörte den attalidischen Königen von Pergamon; der letzte von ihnen vermachte 133 v. Chr. sein Königreich Rom, und nach dem Aufstand des Aristonikos wurde es Teil der römischen Provinz Asia, die Manius Aquillius einrichtete. Zur Zeit des Paulus war Mysien ein regionaler Name, kein eigener Staat."
    - "Die Apostelgeschichte nennt es zweimal in einer Stelle. Vom Heiligen Geist gehindert, in Asien zu predigen, zogen Paulus, Silas und Timotheus nach Norden: „Als sie aber kamen an Mysien, versuchten sie, durch Bithynien zu reisen; und der Geist ließ es ihnen nicht zu. Sie zogen aber an Mysien vorüber und kamen hinab gen Troas.“ Dort sah Paulus das Gesicht des Mannes aus Mazedonien. „Vorüberziehen“ bedeutet wahrscheinlich, die Region zu durchqueren, ohne zu predigen. Mysien liegt heute im Nordwesten der Türkei, überwiegend in den Provinzen Balıkesir, Bursa und Çanakkale."
    - "Homer zählt die Myser unter Chromis und Ennomos zu den Verbündeten Trojas. Ihre Herkunft war schon im Altertum umstritten. Strabon berichtet, die einen hielten sie für Thraker, die anderen für Lyder, und Xanthos von Lydien sowie Menekrates von Elaia leiteten ihren Namen vom lydischen Wort für den Oxya-Baum ab, der um den Olymp in Fülle wächst. Er teilt Mysien in zwei Teile, die Olympene um den Mysischen Olymp und das Land am Fluss Kaikos um Pergamon. Er räumt ein, dass die Grenzen zu den Phrygern und Bithyniern schwer zu ziehen waren und dass die meisten dieser Völker unter römischer Herrschaft ihre Sprachen und Namen verloren hatten."
    - "In der Kaiserzeit war Kyzikos die Hauptstadt Mysiens und später der Provinz Hellespontus und der Metropolitansitz ihrer Kirche. Der Arianer Eunomios war einer seiner Bischöfe, und Proklos, später Patriarch von Konstantinopel, wurde für den Sitz geweiht, doch die Bewohner von Kyzikos wählten einen anderen Bischof, bevor er ihn antreten konnte."
  fr:
    - "La Mysie était le coin nord-ouest de l’Asie Mineure, entre l’Hellespont et la mer de Marmara au nord, la Bithynie à l’est et la Lydie au sud ; la Troade, avec Troas et Assos, et les villes de Pergame et d’Adramytte s’y trouvaient ou la bordaient. Elle appartenait aux rois attalides de Pergame ; le dernier d’entre eux légua son royaume à Rome en 133 av. J.-C., et après la révolte d’Aristonicos elle devint une partie de la province romaine d’Asie, organisée par Manius Aquillius. Au temps de Paul, la Mysie était un nom régional, non un État distinct."
    - "Les Actes la nomment deux fois dans un même passage. Empêchés par le Saint-Esprit d’annoncer la parole en Asie, Paul, Silas et Timothée allèrent vers le nord : « Arrivés près de la Mysie, ils se disposaient à entrer en Bithynie ; mais l’Esprit de Jésus ne le leur permit pas. Ils franchirent alors la Mysie, et descendirent à Troas. » Là, Paul eut la vision de l’homme de Macédoine. « Franchirent » signifie probablement traverser la région sans s’arrêter pour prêcher. La Mysie se trouve aujourd’hui dans le nord-ouest de la Turquie, surtout dans les provinces de Balıkesir, de Bursa et de Çanakkale."
    - "Homère compte les Mysiens, conduits par Chromis et Ennomos, parmi les alliés de Troie. Leur origine était déjà débattue dans l’Antiquité. Strabon rapporte que les uns les tenaient pour des Thraces et les autres pour des Lydiens, et que Xanthos de Lydie et Ménécrate d’Élaïa tiraient leur nom du mot lydien désignant l’arbre oxya, qui abonde autour du mont Olympe. Il divise la Mysie en deux parties, l’Olympène, autour de l’Olympe de Mysie et le pays du fleuve Caïque autour de Pergame. Il admet que ses frontières avec les Phrygiens et les Bithyniens étaient difficiles à tracer et que sous la domination romaine la plupart de ces peuples avaient perdu leurs langues et leurs noms."
    - "Sous l’Empire, Cyzique fut la capitale de la Mysie, puis de la province de l’Hellespont, et le siège métropolitain de son Église. L’arien Eunome fut l’un de ses évêques, et Proclus, plus tard patriarche de Constantinople, fut sacré pour ce siège, mais les habitants de Cyzique élurent un autre évêque avant qu’il ait pu en prendre possession."
  it:
    - "La Misia era l’angolo nord-occidentale dell’Asia Minore, tra l’Ellesponto e il Mar di Marmara a nord, la Bitinia a est e la Lidia a sud; la regione della Troade, con la città di Troade e Asso, e le città di Pergamo e Adramitto si trovavano al suo interno o accanto. Apparteneva ai re attalidi di Pergamo; l’ultimo di loro lasciò il suo regno a Roma nel 133 a.C., e dopo la rivolta di Aristonico divenne parte della provincia romana d’Asia, organizzata da Manio Aquilio. Al tempo di Paolo la Misia era un nome regionale, non uno stato a sé."
    - "Gli Atti la nominano due volte in un solo passo. Impediti dallo Spirito Santo di predicare in Asia, Paolo, Sila e Timoteo andarono a nord: «giunti sui confini della Misia, tentavano d’andare in Bitinia; ma lo Spirito di Gesù non lo permise loro; e passata la Misia, discesero in Troas». Là Paolo ebbe la visione dell’uomo macedone. «Passata» significa probabilmente attraversare la regione senza fermarsi a predicare. La Misia si trova oggi nella Turchia nord-occidentale, soprattutto nelle province di Balıkesir, Bursa e Çanakkale."
    - "Omero annovera i Misi, guidati da Cromi ed Ennomo, tra gli alleati di Troia. La loro origine era discussa già nell’antichità. Strabone riferisce che alcuni li ritenevano Traci e altri Lidi, e che Xanto di Lidia e Menecrate di Elea facevano derivare il loro nome dalla parola lidia per l’albero oxya, che abbonda intorno al monte Olimpo. Divide la Misia in due parti, l’Olimpene, intorno all’Olimpo di Misia e la regione del fiume Caico intorno a Pergamo. Ammette che i suoi confini con Frigi e Bitini erano difficili da tracciare e che sotto il dominio romano la maggior parte di questi popoli aveva perduto le proprie lingue e i propri nomi."
    - "In età imperiale Cizico fu la capitale della Misia e poi della provincia dell’Ellesponto, e la sede metropolitana della sua Chiesa. L’ariano Eunomio fu uno dei suoi vescovi, e Proclo, poi patriarca di Costantinopoli, fu consacrato per quella sede, ma gli abitanti di Cizico elessero un altro vescovo prima che potesse prenderne possesso."
  pl:
    - "Myzja była północno-zachodnim narożnikiem Azji Mniejszej, między Hellespontem i Morzem Marmara na północy, Bitynią na wschodzie i Lidią na południu; Troada z miastem Troas i Assos oraz miasta Pergamon i Adramyttium leżały w jej obrębie lub obok. Należała do królów Attalidów z Pergamonu; ostatni z nich zapisał swoje królestwo Rzymowi w 133 r. p.n.e., a po powstaniu Aristonika stała się częścią rzymskiej prowincji Azji, zorganizowanej przez Maniusza Akwiliusza. W czasach Pawła Myzja była nazwą regionalną, nie osobnym państwem."
    - "Dzieje wymieniają ją dwa razy w jednym ustępie. Powstrzymani przez Ducha Świętego od głoszenia w Azji, Paweł, Sylas i Tymoteusz poszli na północ: „Przyszedłszy do Mizyi, kusili się iść do Bitynii, ale im Duch Jezusowy nie dopuścił.” „Tedy minąwszy Mizyję, zstąpili do Troady.” Tam Paweł ujrzał widzenie męża z Macedonii. „Minąwszy” oznacza prawdopodobnie przejście przez region bez zatrzymania się, by głosić. Myzja leży dziś w północno-zachodniej Turcji, głównie w prowincjach Balıkesir, Bursa i Çanakkale."
    - "Homer zalicza Myzów, prowadzonych przez Chromisa i Ennomosa, do sprzymierzeńców Troi. O ich pochodzenie spierano się już w starożytności. Strabon podaje, że jedni uważali ich za Traków, inni za Lidyjczyków, a Ksantos z Lidii i Menekrates z Elai wywodzili ich nazwę od lidyjskiego słowa oznaczającego drzewo oxya, które obficie rośnie wokół góry Olimp. Dzieli Myzję na dwie części: Olimpenę wokół Olimpu Myzyjskiego i krainę nad rzeką Kaikos wokół Pergamonu. Przyznaje, że jej granice z Frygijczykami i Bitynami trudno wytyczyć i że pod panowaniem rzymskim większość tych ludów utraciła swe języki i nazwy."
    - "W czasach cesarstwa Kyzikos był stolicą Myzji, a później prowincji Hellespont, oraz siedzibą metropolity jej Kościoła. Jednym z jego biskupów był arianin Eunomiusz, a Proklos, później patriarcha Konstantynopola, został na to biskupstwo wyświęcony, lecz mieszkańcy Kyzikos wybrali innego biskupa, zanim zdążył je objąć."
  nl:
    - "Mysië was de noordwesthoek van Klein-Azië, tussen de Hellespont en de Zee van Marmara in het noorden, Bithynië in het oosten en Lydië in het zuiden; de Troade, met Troas en Assos, en de steden Pergamum en Adramyttium lagen erin of ernaast. Het behoorde aan de Attalidische koningen van Pergamum; de laatste van hen liet zijn koninkrijk in 133 v.Chr. aan Rome na, en na de opstand van Aristonicus werd het deel van de Romeinse provincie Asia, ingericht door Manius Aquillius. In Paulus' tijd was Mysië een regionale naam, geen aparte staat."
    - "Handelingen noemt het tweemaal in één passage. Door de Heilige Geest belet in Asia te prediken, gingen Paulus, Silas en Timoteüs naar het noorden: “En aan Mysië gekomen zijnde, poogden zij naar Bithynië te reizen; en de Geest liet het hun niet toe. En zij, Mysië voorbij gereisd zijnde, kwamen af tot Troas.” Daar zag Paulus het visioen van de man van Macedonië. “Voorbij gereisd” betekent waarschijnlijk dat zij de streek doorkruisten zonder te prediken. Mysië ligt tegenwoordig in het noordwesten van Turkije, grotendeels in de provincies Balıkesir, Bursa en Çanakkale."
    - "Homerus rekent de Mysiërs, aangevoerd door Chromis en Ennomus, tot de bondgenoten van Troje. Hun herkomst was al in de oudheid omstreden. Strabo meldt dat sommigen hen voor Thraciërs hielden en anderen voor Lydiërs, en dat Xanthus van Lydië en Menecrates van Elaea hun naam afleidden van het Lydische woord voor de oxya-boom, die rond de berg Olympus overvloedig groeit. Hij verdeelt Mysië in twee delen, Olympene rond de Mysische Olympus en het land van de rivier de Caicus rond Pergamum. Hij geeft toe dat de grenzen met de Phrygiërs en Bithyniërs moeilijk te trekken waren en dat de meeste van deze volken onder Romeins bewind hun talen en hun namen hadden verloren."
    - "In de keizertijd was Cyzicus de hoofdstad van Mysië en later van de provincie Hellespontus, en de metropolitane zetel van haar kerk. De ariaan Eunomius was een van zijn bisschoppen, en Proclus, later patriarch van Constantinopel, werd ervoor gewijd, maar de inwoners van Cyzicus kozen een andere bisschop voordat hij de zetel kon innemen."
  cs:
    - "Mýsie byla severozápadní kout Malé Asie, mezi Hellespontem a Marmarským mořem na severu, Bithýnií na východě a Lýdií na jihu; Troáda s Troasem a Assem a města Pergamon a Adramyttion ležela uvnitř ní nebo vedle ní. Patřila attalovským králům Pergamonu; poslední z nich roku 133 př. n. l. odkázal své království Římu a po vzpouře Aristonika se stala součástí římské provincie Asie, kterou zřídil Manius Aquillius. V Pavlově době byla Mýsie regionálním jménem, ne samostatným státem."
    - "Skutky ji jmenují dvakrát v jednom úseku. Duch svatý Pavlovi, Silovi a Timoteovi zabránil kázat v Asii, a ti šli na sever: „Přišedše do Myzie, pokoušeli se jíti do Bitynie. Ale nedal jim Duch Ježíšův. Tedy pominuvše Myzii, šli do Troady.“ Tam Pavel spatřil vidění muže z Makedonie. „Pominuvše“ pravděpodobně znamená projít krajem, aniž by tam kázali. Mýsie leží dnes v severozápadním Turecku, převážně v provinciích Balıkesir, Bursa a Çanakkale."
    - "Homér řadí Mýsany, vedené Chromiem a Ennomem, mezi spojence Tróje. O jejich původu se vedly spory už ve starověku. Strabón uvádí, že jedni je pokládali za Thráky a druzí za Lýdy a že Xanthos z Lýdie a Menekratés z Elaie odvozovali jejich jméno od lýdského slova pro strom oxya, který hojně roste kolem hory Olymp. Dělí Mýsii na dvě části, Olympénu kolem Mýského Olympu a kraj řeky Kaïkos kolem Pergamonu. Připouští, že její hranice s Frygy a Bithýny bylo těžké vymezit a že pod římskou vládou většina těchto národů ztratila své jazyky i jména."
    - "V době císařství byl Kyzikos hlavním městem Mýsie a později provincie Hellespontus a metropolí její církve. Jedním z jeho biskupů byl arián Eunomios a Proklos, pozdější konstantinopolský patriarcha, byl pro něj vysvěcen, ale obyvatelé Kyziku zvolili jiného biskupa dřív, než mohl stolec převzít."
  sv:
    - "Mysien var det nordvästra hörnet av Mindre Asien, mellan Hellesponten och Marmarasjön i norr, Bitynien i öster och Lydien i söder; Troaden, med Troas och Assos, och städerna Pergamon och Adramyttion låg inom eller invid det. Det tillhörde attaliderna, kungarna av Pergamon; den siste av dem testamenterade sitt rike till Rom 133 f.Kr., och efter Aristonikos uppror blev det en del av den romerska provinsen Asien, organiserad av Manius Aquillius. På Paulus tid var Mysien ett regionalt namn, inte en egen stat."
    - "Apostlagärningarna nämner det två gånger i samma avsnitt. Paulus, Silas och Timoteus hindrades av den helige Ande från att predika i Asien och gick norrut: ”Och när de hade kommit fram emot Mysien, försökte de att fara in i Bitynien, men Jesu Ande tillstadde dem det icke. Då begåvo de sig över Mysien ned till Troas.” Där såg Paulus synen av mannen från Makedonien. Uttrycket ”begåvo de sig över Mysien” betyder sannolikt att de korsade området utan att stanna för att predika. Mysien ligger i dag i nordvästra Turkiet, till största delen i provinserna Balıkesir, Bursa och Çanakkale."
    - "Homeros räknar myserna, ledda av Chromis och Ennomos, till Trojas bundsförvanter. Deras ursprung var omstritt redan i antiken. Strabon uppger att somliga ansåg dem vara thraker och andra lyder, och att Xanthos från Lydien och Menekrates från Elaia härledde deras namn från det lydiska ordet för oxyaträdet, som växer rikligt kring berget Olympos. Han delar Mysien i två delar, Olympene kring det mysiska Olympos och landet kring floden Kaïkos runt Pergamon. Han medger att gränserna mot fryger och bityner var svåra att dra och att de flesta av dessa folk under romerskt styre hade förlorat sina språk och sina namn."
    - "Under kejsartiden var Kyzikos huvudstad i Mysien och senare i provinsen Hellespontus, och metropolitsäte för dess kyrka. Arianen Eunomios var en av dess biskopar, och Proklos, senare patriark av Konstantinopel, vigdes till biskop där, men invånarna i Kyzikos valde en annan biskop innan han hann tillträda."
  nb:
    - "Mysia var det nordvestlige hjørnet av Lilleasia, mellom Hellespont og Marmarahavet i nord, Bitynia i øst og Lydia i sør; Troas-området med Troas og Assos, og byene Pergamon og Adramyttion lå innenfor eller ved siden av. Det tilhørte de attalidiske kongene av Pergamon; den siste av dem testamenterte kongeriket sitt til Roma i 133 f.Kr., og etter Aristonikos' opprør ble det en del av den romerske provinsen Asia, organisert av Manius Aquillius. På Paulus' tid var Mysia et regionnavn, ikke en egen stat."
    - "Apostlenes gjerninger nevner det to ganger i én og samme tekst. Da Den hellige ånd hindret dem fra å tale ordet i Asia, dro Paulus, Silas og Timoteus nordover: «da de var kommet bortimot Mysia, prøvde de på å fare til Bitynia, men Jesu Ånd gav dem ikke lov; så drog de da utenom Mysia og drog ned til Troas.» Der så Paulus synet av mannen fra Makedonia. «Drog utenom» betyr trolig at de krysset området uten å stanse for å forkynne. Mysia ligger i dag i nordvestlige Tyrkia, for det meste i provinsene Balıkesir, Bursa og Çanakkale."
    - "Homer regner myserne, ledet av Chromis og Ennomos, blant Trojas forbundsfeller. Opphavet deres var omstridt allerede i oldtiden. Strabon forteller at noen holdt dem for trakere og andre for lydere, og at Xanthos fra Lydia og Menekrates fra Elaia avledet navnet deres av det lydiske ordet for oxya-treet, som vokser rikelig rundt fjellet Olympos. Han deler Mysia i to deler, Olympene rundt det mysiske Olympos og landet ved elven Kaikos rundt Pergamon. Han innrømmer at grensene mot frygerne og bitynerne var vanskelige å trekke, og at de fleste av disse folkene under romersk styre hadde mistet sine språk og sine navn."
    - "I keisertiden var Kyzikos hovedstad i Mysia og senere i provinsen Hellespontus, og metropolittsete for kirken der. Arianeren Eunomios var en av biskopene, og Proklos, senere patriark av Konstantinopel, ble vigslet til biskop der, men folket i Kyzikos valgte en annen biskop før han rakk å tiltre."
  tl:
    - "Ang Misia ang hilagang-kanlurang sulok ng Asia Minor, sa pagitan ng Hellespont at ng Dagat ng Marmara sa hilaga, Bitinia sa silangan at Lidia sa timog; ang Troad, kasama ang Troas at Ason, at ang mga lungsod ng Pergamo at Adrameto ay nasa loob o sa tabi nito. Pag-aari ito ng mga haring Attalida ng Pergamo; iniwan ng huli sa kanila ang kaniyang kaharian sa Roma noong 133 BK, at pagkatapos ng paghihimagsik ni Aristonicus ay naging bahagi ito ng lalawigang Romano ng Asia, na inayos ni Manius Aquillius. Pagsapit ng panahon ni Pablo, ang Misia ay isa nang pangalang pangrehiyon, hindi na hiwalay na estado."
    - "Dalawang ulit itong pinangalanan ng Mga Gawa sa iisang talata. Dahil pinigilan ng Espiritu Santo na mangaral sa Asia, sina Pablo, Silas at Timoteo ay nagtungo sa hilaga: “At nang sila'y magsidating sa tapat ng Misia, ay pinagsikapan nilang magsipasok sa Bitinia; at hindi sila tinulutan ng Espiritu ni Jesus; At pagkaraan nila sa Misia, ay nagsilusong sila sa Troas.” Doon nakita ni Pablo ang pangitain ng lalaking taga-Macedonia. Ang “pagkaraan” ay marahil nangangahulugang pagtawid sa rehiyon nang hindi humihinto upang mangaral. Ang Misia ay nasa hilagang-kanlurang Turkey ngayon, higit sa lahat sa mga lalawigan ng Balıkesir, Bursa at Çanakkale."
    - "Ibinibilang ni Homero ang mga Misio, sa pamumuno nina Cromis at Ennomo, sa mga kakampi ng Troya. Pinagtalunan na noong sinaunang panahon ang kanilang pinagmulan. Ayon kay Strabo, itinuring sila ng ilan na mga Tracio at ng iba na mga Lidiano, at hinango nina Xanthus ng Lidia at Menecrates ng Elaea ang pangalan nila sa salitang Lidiano para sa punong oxya, na sagana sa bundok Olimpo. Hinahati niya ang Misia sa dalawa, ang Olympene sa paligid ng Olimpo ng Misia at ang lupain ng ilog Caicus sa paligid ng Pergamo. Aminado siyang mahirap tukuyin ang hangganan nito sa mga Frigio at Bitinio, at sa ilalim ng Roma ay nawalan ng wika at pangalan ang karamihan sa mga bayang ito."
    - "Sa imperyo, ang Cizico ang kabisera ng Misia at saka ng lalawigan ng Hellespontus, at luklukang metropolitano ng iglesia nito. Isa sa mga obispo nito ang Arianong si Eunomio, at itinalaga para rito si Proclo, na naging patriarka ng Constantinopla, ngunit naghalal ang mga taga-Cizico ng ibang obispo bago pa niya nahawakan ang luklukan."
  da:
    - "Mysien var det nordvestlige hjørne af Lilleasien, mellem Hellespont og Marmarahavet mod nord, Bithynien mod øst og Lydien mod syd; Troaden med Troas og Assos og byerne Pergamon og Adramyttion lå inden for eller ved siden af det. Det tilhørte attalidekongerne af Pergamon; den sidste af dem testamenterede sit rige til Rom i 133 f.Kr., og efter Aristonikos' opstand blev det en del af den romerske provins Asia, organiseret af Manius Aquillius. På Paulus' tid var Mysien et regionalt navn og ikke en selvstændig stat."
    - "ApG nævner det to gange i samme afsnit. Hindret af Helligånden i at prædike i Asien drog Paulus, Silas og Timotheus mod nord: »Da de nu kom hen imod Mysien, forsøgte de at drage til Bithynien; og Jesu Aand tilstedte dem det ikke. De droge da Mysien forbi og kom ned til Troas.« Dér så Paulus synet af manden fra Makedonien. »Mysien forbi« betyder sandsynligvis, at de krydsede egnen uden at standse for at prædike. Mysien ligger i dag i det nordvestlige Tyrkiet, for størstedelen i provinserne Balıkesir, Bursa og Çanakkale."
    - "Homer regner myserne, ført af Chromis og Ennomos, blandt Trojas forbundsfæller. Deres oprindelse var omstridt allerede i oldtiden. Strabon beretter, at nogle holdt dem for thrakere og andre for lydere, og at Xanthos fra Lydien og Menekrates fra Elaia afledte deres navn af det lydiske ord for oxya-træet, som vokser rigeligt omkring bjerget Olympos. Han deler Mysien i to dele, Olympene omkring det mysiske Olympos og landet ved floden Kaikos omkring Pergamon. Han indrømmer, at grænserne mod frygerne og bithynerne var svære at drage, og at de fleste af disse folk under romersk styre havde mistet deres sprog og deres navne."
    - "I kejsertiden var Kyzikos hovedstad i Mysien og senere i provinsen Hellespontus og metropolitsæde for dens kirke. Arianeren Eunomios var en af dens biskopper, og Proklos, senere patriark af Konstantinopel, blev viet til biskop der, men folket i Kyzikos valgte en anden biskop, før han nåede at tiltræde."
  sr:
    - "Мисија је била северозападни угао Мале Азије, између Хелеспонта и Мраморног мора на северу, Витиније на истоку и Лидије на југу; Тројанска област, с Троадом и Асосом, и градови Пергам и Адрамитија лежали су у њој или поред ње. Припадала је аталидским царевима Пергама; последњи од њих оставио је своје царство Риму 133. п. н. е., а после Аристоникове побуне постала је део римске провинције Азије, коју је уредио Маније Аквилије. У Павлово доба Мисија је била географски назив, а не посебна држава."
    - "Дела је помињу двапут у једном одломку. Духом Светим спречени да проповедају у Азији, Павле, Сила и Тимотије кренули су северно: „А кад дођоше у Мисију хтеше да иду у Витинију, и Дух не даде. А кад прођоше Мисију, сиђоше у Троаду.“ Ту је Павле видео утвару човека из Македоније. „Проћи“ вероватно значи прећи област не застајући да се проповеда. Мисија данас лежи у северозападној Турској, углавном у покрајинама Баликесир, Бурса и Чанаккале."
    - "Хомер убраја Мисијце, које предводе Хромије и Еномо, међу савезнике Троје. О њиховом пореклу спорило се већ у старини. Страбон бележи да су их једни сматрали Трачанима, а други Лиђанима, и да су Ксант Лидијски и Менекрат из Елеје изводили њихово име од лидијске речи за дрво оксија, које у обиљу расте око планине Олимп. Он дели Мисију на два дела, Олимпену око Мисијског Олимпа и крај реке Каик око Пергама. Признаје да је њене границе према Фригијцима и Витинцима тешко повући и да је под римском влашћу већина ових народа изгубила своје језике и имена."
    - "У царско доба Кизик је био престоница Мисије, а затим провинције Хелеспонт, и митрополија њене цркве. Један од његових епископа био је аријанац Евномије, а Прокло, касније патријарх цариградски, био је рукоположен за ову катедру, али су становници Кизика изабрали другог епископа пре него што је стигао да је преузме."
  hu:
    - "Müsia Kis-Ázsia északnyugati csücske volt, északon a Hellészpontosz és a Márvány-tenger, keleten Bithünia, délen Lüdia között; a Troász-vidék Troásszal és Asszosszal, valamint Pergamon és Adramüttion városai a területén vagy mellette feküdtek. A pergamoni Attalidák királyaié volt; közülük az utolsó Kr. e. 133-ban Rómára hagyta királyságát, és Arisztonikosz lázadása után Ázsia római provinciájának része lett, amelyet Manius Aquillius szervezett meg. Pál idejére Müsia már régiónév volt, nem önálló állam."
    - "Az Apostolok cselekedetei kétszer nevezi meg egyetlen szakaszban. Miután a Szentlélek megakadályozta őket abban, hogy Ázsiában hirdessék az igét, Pál, Szilász és Timóteus észak felé indult: „Misia felé menvén, igyekeznek vala Bithiniába jutni; de nem ereszté őket a Lélek. Áthaladván azért Misián, lemenének Tróásba.” Ott Pál meglátta a macedón férfi látomását. Az „áthaladás” valószínűleg azt jelenti, hogy a vidéket megállás és igehirdetés nélkül keresztezték. Müsia ma Törökország északnyugati részén fekszik, többnyire Balıkesir, Bursa és Çanakkale tartományban."
    - "Homérosz a müszokat, Khromisz és Ennomosz vezetésével, Trója szövetségesei közé sorolja. Eredetük már az ókorban vitatott volt. Sztrabón beszámol arról, hogy egyesek trákoknak, mások lüdiaiaknak tartották őket, és hogy a lüdiai Xanthosz és az elaiai Menekratész nevüket az oxüa nevű fa lüdiai nevéből vezették le, amely bőven nő az Olümposz-hegy körül. Müsiát két részre osztja: az Olümpénére a müsiai Olümposz körül és a Kaikosz folyó vidékére Pergamon körül. Elismeri, hogy határait a phrügök és a bithünök felé nehéz meghúzni, és hogy a római uralom alatt e népek többsége elvesztette nyelvét és nevét."
    - "A császárkorban Küzikosz volt Müsia, majd Hellészpontosz provincia fővárosa és egyházának metropolitai széke. Egyik püspöke az ariánus Eunomiosz volt, Proklosz, a későbbi konstantinápolyi pátriárka pedig erre a székre kapott püspökszentelést, ám a küzikosziak más püspököt választottak, mielőtt elfoglalhatta volna."
  fi:
    - "Mysia oli Vähän-Aasian luoteiskulma, Hellespontoksen ja Marmarameren välissä pohjoisessa, Bityniasta idässä ja Lyydiasta etelässä; Troas-alue (Troad), johon kuuluivat Troas ja Assos, sekä Pergamonin ja Adramyttionin kaupungit sijaitsivat sen alueella tai sen vieressä. Se kuului Pergamonin attalidikuninkaille; heistä viimeinen jätti valtakuntansa Roomalle vuonna 133 eaa., ja Aristonikoksen kapinan jälkeen se tuli osaksi Rooman Aasian provinssia, jonka Manius Aquillius järjesti. Paavalin aikaan Mysia oli alueen nimi, ei erillinen valtio."
    - "Apostolien teot mainitsee sen kahdesti samassa kohdassa. Pyhän Hengen estettyä heitä julistamasta sanaa Aasiassa Paavali, Silas ja Timoteus lähtivät pohjoiseen: ”Ja tultuaan Mysian kohdalle he yrittivät lähteä Bityniaan, mutta Jeesuksen Henki ei sallinut heidän sitä tehdä. Niin he vaelsivat ohi Mysian ja menivät Trooaaseen.” Siellä Paavali näki makedonialaisen miehen näyn. ”Ohi vaeltaminen” tarkoittaa luultavasti sitä, että he kulkivat alueen läpi pysähtymättä saarnaamaan. Mysia sijaitsee nykyään Luoteis-Turkissa, enimmäkseen Balıkesirin, Bursan ja Çanakkalen maakunnissa."
    - "Homeros lukee myysialaiset, joita johtivat Khromis ja Ennomos, Troijan liittolaisiin. Heidän alkuperästään kiisteltiin jo antiikin aikana. Strabon kertoo, että jotkut pitivät heitä traakialaisina ja toiset lyydialaisina ja että lyydialainen Ksanthos ja elaialainen Menekrates johtivat heidän nimensä oxya-puun lyydialaisesta nimestä; puuta kasvaa runsaasti Olympos-vuoren ympärillä. Hän jakaa Mysian kahteen osaan, Olympeneen Mysian Olympoksen ympärillä ja Kaikos-joen seutuun Pergamonin ympärillä. Hän myöntää, että sen rajoja fryygialaisiin ja bityynialaisiin oli vaikea vetää ja että Rooman vallan alla useimmat näistä kansoista olivat menettäneet kielensä ja nimensä."
    - "Keisariaikana Kyzikos oli Mysian ja myöhemmin Hellespontoksen provinssin pääkaupunki ja sen kirkon metropoliittaistuin. Areiolainen Eunomios oli yksi sen piispoista, ja Proklos, myöhemmin Konstantinopolin patriarkka, vihittiin sen piispaksi, mutta Kyzikoksen asukkaat valitsivat toisen piispan ennen kuin hän ehti ottaa istuimen vastaan."
  vi:
    - "My-si là góc tây bắc của Tiểu Á, nằm giữa Hellespont và Biển Marmara ở phía bắc, Bi-thi-ni ở phía đông và Ly-đi ở phía nam; vùng Troad, với Trô-ách và A-sốt, cùng các thành Bẹt-găm và A-tra-mít nằm trong hoặc bên cạnh vùng này. Nó thuộc các vua triều Attalos ở Bẹt-găm; vị vua cuối cùng của triều này để lại vương quốc cho Rô-ma năm 133 TCN, và sau cuộc nổi dậy của Aristonicus, nó trở thành một phần của tỉnh A-si thuộc La Mã, do Manius Aquillius tổ chức. Đến thời Phao-lô, My-si chỉ còn là tên một vùng, không phải một quốc gia riêng."
    - "Sách Công Vụ nhắc đến nó hai lần trong một đoạn. Bị Đức Thánh Linh cấm truyền đạo trong cõi A-si, Phao-lô, Si-la và Ti-mô-thê đi lên phía bắc: “Tới gần xứ My-si rồi, hai người sắm sửa vào xứ Bi-thi-ni; nhưng Thánh Linh của Đức Chúa Jêsus không cho phép, bèn kíp qua khỏi xứ My-si, và xuống thành Trô-ách.” Tại đó Phao-lô thấy khải tượng về người Ma-xê-đoan. “Qua khỏi” có lẽ có nghĩa là đi ngang vùng này mà không dừng lại để rao giảng. Ngày nay My-si nằm ở tây bắc Thổ Nhĩ Kỳ, phần lớn thuộc các tỉnh Balıkesir, Bursa và Çanakkale."
    - "Homeros kể người My-si, do Chromis và Ennomos chỉ huy, trong số các đồng minh của thành Troia. Nguồn gốc của họ đã bị tranh luận từ thời cổ. Strabo thuật lại rằng có người cho họ là người Thrace, có người cho là người Ly-đi, và Xanthus người Ly-đi cùng Menecrates người Elaea giải thích tên họ bằng từ Ly-đi chỉ cây oxya, mọc nhiều quanh núi Olympos. Ông chia My-si làm hai phần: Olympene quanh núi Olympos của My-si và vùng sông Caicus quanh Bẹt-găm. Ông thừa nhận rằng ranh giới của nó với người Phrygia và người Bi-thi-ni rất khó vạch, và dưới quyền La Mã phần lớn các dân tộc này đã mất tiếng nói và tên gọi của mình."
    - "Thời đế quốc, Cyzicus là thủ phủ của My-si rồi của tỉnh Hellespontus, đồng thời là tòa giám mục đô thành của Hội Thánh tại đó. Eunomius theo phái Arius từng là một giám mục của nó, còn Proclus, về sau là thượng phụ Constantinople, được tấn phong cho tòa này, nhưng dân Cyzicus đã bầu một giám mục khác trước khi ông kịp nhận nhiệm sở."
  ro:
    - "Misia era colțul de nord-vest al Asiei Mici, între Helespont și Marea Marmara la nord, Bitinia la est și Lidia la sud; Troada, cu Troa și Asos, și orașele Pergam și Adramitiu se aflau înăuntrul ei sau lângă ea. Aparținea regilor atalizi ai Pergamului; ultimul dintre ei și-a lăsat regatul Romei în 133 î.Hr., iar după răscoala lui Aristonic a devenit parte a provinciei romane Asia, organizată de Manius Aquilius. Pe vremea lui Pavel, Misia era un nume regional, nu un stat separat."
    - "Faptele Apostolilor o numesc de două ori în același pasaj. Opriți de Duhul Sfânt să predice în Asia, Pavel, Sila și Timotei au mers spre nord: „Venind spre Misia, se ispitiau a merge spre Vitinia; și nu i-a lăsat pre ei Duhul. Și trecând Misia, s’au pogorît în Troada.” Acolo Pavel a avut vedenia bărbatului din Macedonia. „Trecând” înseamnă probabil că au străbătut regiunea fără să se oprească să predice. Misia se află astăzi în nord-vestul Turciei, mai ales în provinciile Balıkesir, Bursa și Çanakkale."
    - "Homer îi numără pe misieni, conduși de Chromis și Ennomos, printre aliații Troiei. Originea lor era dezbătută încă din Antichitate. Strabon relatează că unii îi socoteau traci, iar alții lidieni, și că Xanthos din Lidia și Menecrate din Elaea le derivau numele din cuvântul lidian pentru arborele oxya, care crește din belșug în jurul muntelui Olimp. El împarte Misia în două părți, Olimpena, în jurul Olimpului Misiei și ținutul râului Caicus în jurul Pergamului. Admite că granițele ei cu frigienii și bitinienii erau greu de trasat și că sub stăpânirea romană cele mai multe dintre aceste popoare își pierduseră limbile și numele."
    - "În epoca imperială, Cyzicul a fost capitala Misiei și apoi a provinciei Hellespont și scaunul mitropolitan al Bisericii ei. Arianul Eunomiu a fost unul dintre episcopii săi, iar Proclu, mai târziu patriarh al Constantinopolului, a fost hirotonit pentru acest scaun, însă locuitorii Cyzicului au ales un alt episcop înainte ca el să-l poată ocupa."
  bg:
    - "Мизия била северозападният ъгъл на Мала Азия, между Хелеспонта и Мраморно море на север, Витиния на изток и Лидия на юг; Троада с градовете Троада и Асос, както и градовете Пергам и Адрамитий, лежали в нея или до нея. Тя принадлежала на пергамските царе от династията на Аталидите; последният от тях завещал царството си на Рим през 133 г. пр.н.е. и след въстанието на Аристоник то станало част от римската провинция Азия, устроена от Маний Аквилий. По времето на Павел Мизия била название на област, а не отделна държава."
    - "Деяния я назовава два пъти в един пасаж. Възпрени от Светия Дух да проповядват в Азия, Павел, Сила и Тимотей тръгнали на север: „дойдоха в Мизия, и предприемаха да идат във Витиния; но Духът не им допусти. И като изминаха Мизия, слезоха в Троада.“ Там Павел видял видението на мъжа от Македония. „Изминаха“ вероятно означава, че прекосили областта, без да се спират да проповядват. Днес Мизия се намира в северозападна Турция, предимно в провинциите Балъкесир, Бурса и Чанаккале."
    - "Омир причислява мизийците, водени от Хромий и Еном, към съюзниците на Троя. За произхода им се спорело още в древността. Страбон съобщава, че едни ги смятали за траки, а други за лидийци и че Ксант Лидийски и Менекрат от Елея извеждали името им от лидийската дума за дървото оксия, което расте в изобилие около планината Олимп. Той дели Мизия на две части, Олимпена около Мизийския Олимп и областта на река Каик около Пергам. Признава, че границите ѝ с фригийците и витинците трудно се прокарват и че под римска власт повечето от тези народи загубили езиците и имената си."
    - "В имперската епоха Кизик бил столица на Мизия, а после на провинция Хелеспонт, и митрополия на нейната църква. Един от епископите му бил арианинът Евномий, а Прокъл, по-късно патриарх на Константинопол, бил ръкоположен за тази катедра, но жителите на Кизик избрали друг епископ, преди той да успее да я заеме."
