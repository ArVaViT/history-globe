# Overview article (ADR 0007). Mainstream facts only; a region of north-west Asia Minor that Paul crossed without preaching; mainstream facts only.
id: mysia
place: a2d9bc8
title:
  en: "Mysia"
  ru: "Мисия"
  uk: "Місія"
  es: "Misia"
  pt: "Mísia"
  de: "Mysien"
  fr: "Mysie"
body:
  en:
    - "Mysia was the north-western corner of Asia Minor, between the Hellespont and the Sea of Marmara to the north, Bithynia to the east and Lydia to the south; the Troad, with Troas and Assos, and the cities of Pergamum and Adramyttium lay within or beside it. It belonged to the Attalid kings of Pergamum, and when the last of them left his kingdom to Rome in 133 BC it became part of the province of Asia. By Paul's time Mysia was a regional name, not a separate state."
    - "Acts names it twice in one passage. Kept by the Holy Spirit from preaching in Asia, Paul, Silas and Timothy went north: “After they were come to Mysia, they assayed to go into Bithynia: but the Spirit suffered them not. And they passing by Mysia came down to Troas.” There Paul saw the vision of the man of Macedonia. “Passing by” probably means crossing the region without stopping to preach. Mysia lies today in north-western Turkey, mostly in the provinces of Balıkesir and Çanakkale."
  ru:
    - "Мисия — северо-западный угол Малой Азии между Геллеспонтом и Мраморным морем на севере, Вифинией на востоке и Лидией на юге; область Троада с городами Троадой и Ассом, а также Пергам и Адрамит лежали в ней или рядом с ней. Она принадлежала Атталидам, царям Пергама, и когда последний из них в 133 г. до н. э. завещал своё царство Риму, вошла в провинцию Азия. Ко времени Павла Мисия была названием края, а не отдельным государством."
    - "Деяния называют её дважды в одном рассказе. Когда Дух Святой не допустил Павла, Силу и Тимофея проповедовать в Азии, они пошли на север: «Дойдя до Мисии, предпринимали идти в Вифинию; но Дух не допустил их. Миновав же Мисию, сошли они в Троаду». Там Павлу было видение мужа Македонянина. «Миновав», вероятно, значит, что они прошли край, не останавливаясь для проповеди. Сегодня Мисия лежит на северо-западе Турции, большей частью в провинциях Балыкесир и Чанаккале."
  uk:
    - "Місія була північно-західним кутом Малої Азії, між Геллеспонтом і Мармуровим морем на півночі, Віфінією на сході й Лідією на півдні; околиці Трої з містом Троада та Ассосом і міста Пергам та Адрамитій лежали в її межах або поряд. Вона належала царям Пергама з династії Атталідів, і коли останній з них заповів своє царство Риму 133 р. до н. е., вона стала частиною провінції Азія. За часів Павла Місія була регіональною назвою, а не окремою державою."
    - "Дії двічі називають її в одному уривку. Дух Святий утримав Павла, Силу й Тимофія від проповіді в Азії, і вони пішли на північ: «Прийшовши ж в Мисию, поривались ійти в Витинию, і не пустив їх Дух. Перейшовши ж Мисию, прийшли в Трояду.» Там Павло побачив видіння македонця. «Перейшовши», імовірно, означає перетнути край, не зупиняючись проповідувати. Місія лежить сьогодні в північно-західній Туреччині, переважно в провінціях Баликесір і Чанаккале."
  es:
    - "Misia era el rincón noroccidental de Asia Menor, entre el Helesponto y el mar de Mármara, al norte, Bitinia, al este, y Lidia, al sur; la Tróade, con Troas y Asón, y las ciudades de Pérgamo y Adramitio se hallaban dentro o junto a ella. Perteneció a los reyes atálidas de Pérgamo, y cuando el último de ellos legó su reino a Roma en 133 a. C. pasó a formar parte de la provincia de Asia. En tiempos de Pablo, Misia era un nombre regional, no un Estado separado."
    - "Hechos la nombra dos veces en un mismo pasaje. Impedidos por el Espíritu Santo de predicar en Asia, Pablo, Silas y Timoteo fueron hacia el norte: «Y como vinieron á Misia, tentaron de ir á Bithynia; mas el Espíritu no les dejó. Y pasando á Misia, descendieron á Troas». Allí Pablo vio la visión del varón de Macedonia. «Pasando» significa probablemente cruzar la región sin detenerse a predicar. Misia se halla hoy en el noroeste de Turquía, sobre todo en las provincias de Balıkesir y Çanakkale."
  pt:
    - "A Mísia era o canto noroeste da Ásia Menor, entre o Helesponto e o mar de Mármara, ao norte, a Bitínia, a leste, e a Lídia, ao sul; a Tróade, com Trôade e Assôs, e as cidades de Pérgamo e Adramítio ficavam dentro ou ao lado dela. Pertencia aos reis atálidas de Pérgamo, e quando o último deles deixou seu reino a Roma em 133 a.C., passou a fazer parte da província da Ásia. No tempo de Paulo, a Mísia era um nome regional, e não um Estado separado."
    - "Atos a nomeia duas vezes numa só passagem. Impedidos pelo Espírito Santo de pregar na Ásia, Paulo, Silas e Timóteo foram para o norte: “Quando chegaram perto da Mísia, tentaram ir para a Bitínia, mas o Espírito não lhes permitiu. Passando pela Mísia, desceram a Trôade.” Ali Paulo viu a visão do homem da Macedônia. “Passando” provavelmente significa atravessar a região sem parar para pregar. A Mísia fica hoje no noroeste da Turquia, sobretudo nas províncias de Balıkesir e Çanakkale."
  de:
    - "Mysien war die Nordwestecke Kleinasiens, zwischen dem Hellespont und dem Marmarameer im Norden, Bithynien im Osten und Lydien im Süden; die Troas mit Troas und Assos sowie die Städte Pergamon und Adramyttion lagen in ihm oder daneben. Es gehörte den attalidischen Königen von Pergamon, und als der letzte von ihnen 133 v. Chr. sein Königreich Rom vermachte, wurde es Teil der Provinz Asia. Zur Zeit des Paulus war Mysien ein regionaler Name, kein eigener Staat."
    - "Die Apostelgeschichte nennt es zweimal in einer Stelle. Vom Heiligen Geist gehindert, in Asien zu predigen, zogen Paulus, Silas und Timotheus nach Norden: „Als sie aber kamen an Mysien, versuchten sie, durch Bithynien zu reisen; und der Geist ließ es ihnen nicht zu. Sie zogen aber an Mysien vorüber und kamen hinab gen Troas.“ Dort sah Paulus das Gesicht des Mannes aus Mazedonien. „Vorüberziehen“ bedeutet wahrscheinlich, die Region zu durchqueren, ohne zu predigen. Mysien liegt heute im Nordwesten der Türkei, überwiegend in den Provinzen Balıkesir und Çanakkale."
  fr:
    - "La Mysie était le coin nord-ouest de l’Asie Mineure, entre l’Hellespont et la mer de Marmara au nord, la Bithynie à l’est et la Lydie au sud ; la Troade, avec Troas et Assos, et les villes de Pergame et d’Adramytte s’y trouvaient ou la bordaient. Elle appartenait aux rois attalides de Pergame, et quand le dernier d’entre eux légua son royaume à Rome en 133 av. J.-C., elle devint une partie de la province d’Asie. Au temps de Paul, la Mysie était un nom régional, non un État distinct."
    - "Les Actes la nomment deux fois dans un même passage. Empêchés par le Saint-Esprit d’annoncer la parole en Asie, Paul, Silas et Timothée allèrent vers le nord : « Arrivés près de la Mysie, ils se disposaient à entrer en Bithynie ; mais l’Esprit de Jésus ne le leur permit pas. Ils franchirent alors la Mysie, et descendirent à Troas. » Là, Paul eut la vision de l’homme de Macédoine. « Franchirent » signifie probablement traverser la région sans s’arrêter pour prêcher. La Mysie se trouve aujourd’hui dans le nord-ouest de la Turquie, surtout dans les provinces de Balıkesir et de Çanakkale."
scripture:
