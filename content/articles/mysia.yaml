body:
  en:
    - "Mysia was the north-western corner of Asia Minor, between the Hellespont and the Sea of Marmara to the north, Bithynia to the east and Lydia to the south; the Troad, with Troas and Assos, and the cities of Pergamum and Adramyttium lay within or beside it. It belonged to the Attalid kings of Pergamum; the last of them left his kingdom to Rome in 133 BC, and after the revolt of Aristonicus it became part of the Roman province of Asia, organised by Manius Aquillius. By Paul's time Mysia was a regional name, not a separate state."
    - "Acts names it twice in one passage. Kept by the Holy Spirit from preaching in Asia, Paul, Silas and Timothy went north: “After they were come to Mysia, they assayed to go into Bithynia: but the Spirit suffered them not. And they passing by Mysia came down to Troas.” There Paul saw the vision of the man of Macedonia. “Passing by” probably means crossing the region without stopping to preach. Mysia lies today in north-western Turkey, mostly in the provinces of Balıkesir, Bursa and Çanakkale."
  ru:
    - "Мисия — северо-западный угол Малой Азии между Геллеспонтом и Мраморным морем на севере, Вифинией на востоке и Лидией на юге; область Троада с городами Троадой и Ассом, а также Пергам и Адрамит лежали в ней или рядом с ней. Она принадлежала Атталидам, царям Пергама; последний из них в 133 г. до н. э. завещал своё царство Риму, и после восстания Аристоника она вошла в римскую провинцию Азия, устроенную Манием Аквилием. Ко времени Павла Мисия была названием края, а не отдельным государством."
    - "Деяния называют её дважды в одном рассказе. Когда Дух Святой не допустил Павла, Силу и Тимофея проповедовать в Азии, они пошли на север: «Дойдя до Мисии, предпринимали идти в Вифинию; но Дух не допустил их. Миновав же Мисию, сошли они в Троаду». Там Павлу было видение мужа Македонянина. «Миновав», вероятно, значит, что они прошли край, не останавливаясь для проповеди. Сегодня Мисия лежит на северо-западе Турции, большей частью в провинциях Балыкесир, Бурса и Чанаккале."
  uk:
    - "Місія була північно-західним кутом Малої Азії, між Геллеспонтом і Мармуровим морем на півночі, Віфінією на сході й Лідією на півдні; околиці Трої з містом Троада та Ассосом і міста Пергам та Адрамитій лежали в її межах або поряд. Вона належала царям Пергама з династії Атталідів; останній з них заповів своє царство Риму 133 р. до н. е., і після повстання Аристоніка вона стала частиною римської провінції Азія, яку облаштував Маній Аквілій. За часів Павла Місія була регіональною назвою, а не окремою державою."
    - "Дії двічі називають її в одному уривку. Дух Святий утримав Павла, Силу й Тимофія від проповіді в Азії, і вони пішли на північ: «Прийшовши ж в Мисию, поривались ійти в Витинию, і не пустив їх Дух. Перейшовши ж Мисию, прийшли в Трояду.» Там Павло побачив видіння македонця. «Перейшовши», імовірно, означає перетнути край, не зупиняючись проповідувати. Місія лежить сьогодні в північно-західній Туреччині, здебільшого в провінціях Баликесір, Бурса і Чанаккале."
  es:
    - "Misia era el rincón noroccidental de Asia Menor, entre el Helesponto y el mar de Mármara, al norte, Bitinia, al este, y Lidia, al sur; la Tróade, con Troas y Asón, y las ciudades de Pérgamo y Adramitio se hallaban dentro o junto a ella. Perteneció a los reyes atálidas de Pérgamo; el último de ellos legó su reino a Roma en 133 a. C., y tras la revuelta de Aristónico pasó a formar parte de la provincia romana de Asia, organizada por Manio Aquilio. En tiempos de Pablo, Misia era un nombre regional, no un Estado separado."
    - "Hechos la nombra dos veces en un mismo pasaje. Impedidos por el Espíritu Santo de predicar en Asia, Pablo, Silas y Timoteo fueron hacia el norte: «Y como vinieron á Misia, tentaron de ir á Bithynia; mas el Espíritu no les dejó. Y pasando á Misia, descendieron á Troas». Allí Pablo vio la visión del varón de Macedonia. «Pasando» significa probablemente cruzar la región sin detenerse a predicar. Misia se halla hoy en el noroeste de Turquía, sobre todo en las provincias de Balıkesir, Bursa y Çanakkale."
  pt:
    - "A Mísia era o canto noroeste da Ásia Menor, entre o Helesponto e o mar de Mármara, ao norte, a Bitínia, a leste, e a Lídia, ao sul; a Tróade, com Trôade e Assôs, e as cidades de Pérgamo e Adramítio ficavam dentro ou ao lado dela. Pertencia aos reis atálidas de Pérgamo; o último deles deixou seu reino a Roma em 133 a.C., e após a revolta de Aristônico passou a fazer parte da província romana da Ásia, organizada por Mânio Aquílio. No tempo de Paulo, a Mísia era um nome regional, e não um Estado separado."
    - "Atos a nomeia duas vezes numa só passagem. Impedidos pelo Espírito Santo de pregar na Ásia, Paulo, Silas e Timóteo foram para o norte: “Quando chegaram perto da Mísia, tentaram ir para a Bitínia, mas o Espírito não lhes permitiu. Passando pela Mísia, desceram a Trôade.” Ali Paulo viu a visão do homem da Macedônia. “Passando” provavelmente significa atravessar a região sem parar para pregar. A Mísia fica hoje no noroeste da Turquia, sobretudo nas províncias de Balıkesir, Bursa e Çanakkale."
  de:
    - "Mysien war die Nordwestecke Kleinasiens, zwischen dem Hellespont und dem Marmarameer im Norden, Bithynien im Osten und Lydien im Süden; die Troas mit Troas und Assos sowie die Städte Pergamon und Adramyttion lagen in ihm oder daneben. Es gehörte den attalidischen Königen von Pergamon; der letzte von ihnen vermachte 133 v. Chr. sein Königreich Rom, und nach dem Aufstand des Aristonikos wurde es Teil der römischen Provinz Asia, die Manius Aquillius einrichtete. Zur Zeit des Paulus war Mysien ein regionaler Name, kein eigener Staat."
    - "Die Apostelgeschichte nennt es zweimal in einer Stelle. Vom Heiligen Geist gehindert, in Asien zu predigen, zogen Paulus, Silas und Timotheus nach Norden: „Als sie aber kamen an Mysien, versuchten sie, durch Bithynien zu reisen; und der Geist ließ es ihnen nicht zu. Sie zogen aber an Mysien vorüber und kamen hinab gen Troas.“ Dort sah Paulus das Gesicht des Mannes aus Mazedonien. „Vorüberziehen“ bedeutet wahrscheinlich, die Region zu durchqueren, ohne zu predigen. Mysien liegt heute im Nordwesten der Türkei, überwiegend in den Provinzen Balıkesir, Bursa und Çanakkale."
  fr:
    - "La Mysie était le coin nord-ouest de l’Asie Mineure, entre l’Hellespont et la mer de Marmara au nord, la Bithynie à l’est et la Lydie au sud ; la Troade, avec Troas et Assos, et les villes de Pergame et d’Adramytte s’y trouvaient ou la bordaient. Elle appartenait aux rois attalides de Pergame ; le dernier d’entre eux légua son royaume à Rome en 133 av. J.-C., et après la révolte d’Aristonicos elle devint une partie de la province romaine d’Asie, organisée par Manius Aquillius. Au temps de Paul, la Mysie était un nom régional, non un État distinct."
    - "Les Actes la nomment deux fois dans un même passage. Empêchés par le Saint-Esprit d’annoncer la parole en Asie, Paul, Silas et Timothée allèrent vers le nord : « Arrivés près de la Mysie, ils se disposaient à entrer en Bithynie ; mais l’Esprit de Jésus ne le leur permit pas. Ils franchirent alors la Mysie, et descendirent à Troas. » Là, Paul eut la vision de l’homme de Macédoine. « Franchirent » signifie probablement traverser la région sans s’arrêter pour prêcher. La Mysie se trouve aujourd’hui dans le nord-ouest de la Turquie, surtout dans les provinces de Balıkesir, de Bursa et de Çanakkale."
  it:
    - "La Misia era l’angolo nord-occidentale dell’Asia Minore, tra l’Ellesponto e il Mar di Marmara a nord, la Bitinia a est e la Lidia a sud; la regione della Troade, con la città di Troade e Asso, e le città di Pergamo e Adramitto si trovavano al suo interno o accanto. Apparteneva ai re attalidi di Pergamo; l’ultimo di loro lasciò il suo regno a Roma nel 133 a.C., e dopo la rivolta di Aristonico divenne parte della provincia romana d’Asia, organizzata da Manio Aquilio. Al tempo di Paolo la Misia era un nome regionale, non uno stato a sé."
    - "Gli Atti la nominano due volte in un solo passo. Impediti dallo Spirito Santo di predicare in Asia, Paolo, Sila e Timoteo andarono a nord: «giunti sui confini della Misia, tentavano d’andare in Bitinia; ma lo Spirito di Gesù non lo permise loro; e passata la Misia, discesero in Troas». Là Paolo ebbe la visione dell’uomo macedone. «Passata» significa probabilmente attraversare la regione senza fermarsi a predicare. La Misia si trova oggi nella Turchia nord-occidentale, soprattutto nelle province di Balıkesir, Bursa e Çanakkale."
  pl:
    - "Myzja była północno-zachodnim narożnikiem Azji Mniejszej, między Hellespontem i Morzem Marmara na północy, Bitynią na wschodzie i Lidią na południu; Troada z miastem Troas i Assos oraz miasta Pergamon i Adramyttium leżały w jej obrębie lub obok. Należała do królów Attalidów z Pergamonu; ostatni z nich zapisał swoje królestwo Rzymowi w 133 r. p.n.e., a po powstaniu Aristonika stała się częścią rzymskiej prowincji Azji, zorganizowanej przez Maniusza Akwiliusza. W czasach Pawła Myzja była nazwą regionalną, nie osobnym państwem."
    - "Dzieje wymieniają ją dwa razy w jednym ustępie. Powstrzymani przez Ducha Świętego od głoszenia w Azji, Paweł, Sylas i Tymoteusz poszli na północ: „Przyszedłszy do Mizyi, kusili się iść do Bitynii, ale im Duch Jezusowy nie dopuścił.” „Tedy minąwszy Mizyję, zstąpili do Troady.” Tam Paweł ujrzał widzenie męża z Macedonii. „Minąwszy” oznacza prawdopodobnie przejście przez region bez zatrzymania się, by głosić. Myzja leży dziś w północno-zachodniej Turcji, głównie w prowincjach Balıkesir, Bursa i Çanakkale."
  nl:
    - "Mysië was de noordwesthoek van Klein-Azië, tussen de Hellespont en de Zee van Marmara in het noorden, Bithynië in het oosten en Lydië in het zuiden; de Troade, met Troas en Assos, en de steden Pergamum en Adramyttium lagen erin of ernaast. Het behoorde aan de Attalidische koningen van Pergamum; de laatste van hen liet zijn koninkrijk in 133 v.Chr. aan Rome na, en na de opstand van Aristonicus werd het deel van de Romeinse provincie Asia, ingericht door Manius Aquillius. In Paulus' tijd was Mysië een regionale naam, geen aparte staat."
    - "Handelingen noemt het tweemaal in één passage. Door de Heilige Geest belet in Asia te prediken, gingen Paulus, Silas en Timoteüs naar het noorden: “En aan Mysië gekomen zijnde, poogden zij naar Bithynië te reizen; en de Geest liet het hun niet toe. En zij, Mysië voorbij gereisd zijnde, kwamen af tot Troas.” Daar zag Paulus het visioen van de man van Macedonië. “Voorbij gereisd” betekent waarschijnlijk dat zij de streek doorkruisten zonder te prediken. Mysië ligt tegenwoordig in het noordwesten van Turkije, grotendeels in de provincies Balıkesir, Bursa en Çanakkale."
  cs:
    - "Mýsie byla severozápadní kout Malé Asie, mezi Hellespontem a Marmarským mořem na severu, Bithýnií na východě a Lýdií na jihu; Troáda s Troasem a Assem a města Pergamon a Adramyttion ležela uvnitř ní nebo vedle ní. Patřila attalovským králům Pergamonu; poslední z nich roku 133 př. n. l. odkázal své království Římu a po vzpouře Aristonika se stala součástí římské provincie Asie, kterou zřídil Manius Aquillius. V Pavlově době byla Mýsie regionálním jménem, ne samostatným státem."
    - "Skutky ji jmenují dvakrát v jednom úseku. Duch svatý Pavlovi, Silovi a Timoteovi zabránil kázat v Asii, a ti šli na sever: „Přišedše do Myzie, pokoušeli se jíti do Bitynie. Ale nedal jim Duch Ježíšův. Tedy pominuvše Myzii, šli do Troady.“ Tam Pavel spatřil vidění muže z Makedonie. „Pominuvše“ pravděpodobně znamená projít krajem, aniž by tam kázali. Mýsie leží dnes v severozápadním Turecku, převážně v provinciích Balıkesir, Bursa a Çanakkale."
  sv:
    - "Mysien var det nordvästra hörnet av Mindre Asien, mellan Hellesponten och Marmarasjön i norr, Bitynien i öster och Lydien i söder; Troaden, med Troas och Assos, och städerna Pergamon och Adramyttion låg inom eller invid det. Det tillhörde attaliderna, kungarna av Pergamon; den siste av dem testamenterade sitt rike till Rom 133 f.Kr., och efter Aristonikos uppror blev det en del av den romerska provinsen Asien, organiserad av Manius Aquillius. På Paulus tid var Mysien ett regionalt namn, inte en egen stat."
    - "Apostlagärningarna nämner det två gånger i samma avsnitt. Paulus, Silas och Timoteus hindrades av den helige Ande från att predika i Asien och gick norrut: ”Och när de hade kommit fram emot Mysien, försökte de att fara in i Bitynien, men Jesu Ande tillstadde dem det icke. Då begåvo de sig över Mysien ned till Troas.” Där såg Paulus synen av mannen från Makedonien. Uttrycket ”begåvo de sig över Mysien” betyder sannolikt att de korsade området utan att stanna för att predika. Mysien ligger i dag i nordvästra Turkiet, till största delen i provinserna Balıkesir, Bursa och Çanakkale."
scripture:
  - Acts.15.40-Acts.16.10
