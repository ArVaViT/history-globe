# Overview article (ADR 0007). Mainstream facts only; a region of north-west Asia Minor that Paul crossed without preaching; mainstream facts only.
id: mysia
place: a2d9bc8
title:
  en: "Mysia"
  ru: "Мисия"
body:
  en:
    - "Mysia was the north-western corner of Asia Minor, between the Hellespont and the Sea of Marmara to the north, Bithynia to the east and Lydia to the south; the Troad, with Troas and Assos, and the cities of Pergamum and Adramyttium lay within or beside it. It belonged to the Attalid kings of Pergamum, and when the last of them left his kingdom to Rome in 133 BC it became part of the province of Asia. By Paul's time Mysia was a regional name, not a separate state."
    - "Acts names it twice in one passage. Kept by the Holy Spirit from preaching in Asia, Paul, Silas and Timothy went north: “After they were come to Mysia, they assayed to go into Bithynia: but the Spirit suffered them not. And they passing by Mysia came down to Troas.” There Paul saw the vision of the man of Macedonia. “Passing by” probably means crossing the region without stopping to preach. Mysia lies today in north-western Turkey, mostly in the provinces of Balıkesir and Çanakkale."
  ru:
    - "Мисия — северо-западный угол Малой Азии между Геллеспонтом и Мраморным морем на севере, Вифинией на востоке и Лидией на юге; область Троада с городами Троадой и Ассом, а также Пергам и Адрамит лежали в ней или рядом с ней. Она принадлежала Атталидам, царям Пергама, и когда последний из них в 133 г. до н. э. завещал своё царство Риму, вошла в провинцию Азия. Ко времени Павла Мисия была названием края, а не отдельным государством."
    - "Деяния называют её дважды в одном рассказе. Когда Дух Святой не допустил Павла, Силу и Тимофея проповедовать в Азии, они пошли на север: «Дойдя до Мисии, предпринимали идти в Вифинию; но Дух не допустил их. Миновав же Мисию, сошли они в Троаду». Там Павлу было видение мужа Македонянина. «Миновав», вероятно, значит, что они прошли край, не останавливаясь для проповеди. Сегодня Мисия лежит на северо-западе Турции, большей частью в провинциях Балыкесир и Чанаккале."
scripture:
  - Acts.16.6-Acts.16.10
sources:
  - "Strabo, Geography, books 12-13"
  - "W. M. Ramsay, The Historical Geography of Asia Minor (1890)"
  - "S. Mitchell, Anatolia: Land, Men, and Gods in Asia Minor, vol. 1 (1993)"
  - "C. J. Hemer, The Book of Acts in the Setting of Hellenistic History (1989)"
