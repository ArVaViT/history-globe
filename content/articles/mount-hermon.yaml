body:
  en:
    - "Mount Hermon is the highest mountain of the Levant, 2,814 m, the southern end of the Anti-Lebanon range, with three summits, snow on them most of the year and the sources of the Jordan at its feet at Dan, Banias and the Hasbani. It is now Jebel esh-Sheikh, “the mountain of the chief”, where Lebanon, Syria and the Israeli-held Golan meet. The Bible knows its other names: “Hermon the Sidonians call Sirion; and the Amorites call it Shenir”, and Deuteronomy once calls it Sion. Ugaritic poems speak of the cedars of Sirion, and Shalmaneser III of Assyria, chasing Hazael of Damascus in 841 BC, fought him at Mount Saniru."
    - "Hermon was the northern limit of Israel's land east of the Jordan: the two Amorite kings held “from the river of Arnon unto mount Hermon”, Baal-gad lay “in the valley of Lebanon under mount Hermon”, Hivites lived “under Hermon in the land of Mizpeh”, and half Manasseh spread “unto Baal-hermon and Senir, and unto mount Hermon”. The poets loved it: the voice of the Lord makes “Lebanon and Sirion” skip like a young wild ox; the exiled psalmist remembers God “from the land of Jordan, and of the Hermonites”; “Tabor and Hermon shall rejoice in thy name”; brotherly unity is “As the dew of Hermon”, which drenches the slopes on summer nights. The Song calls the bride down “from the top of Shenir and Hermon, from the lions’ dens, from the mountains of the leopards”."
    - "The mountain was holy to its neighbours. The book of Enoch has the rebel angels swear their oath on its summit; Eusebius says the gentiles still revered it as holy, and the ruin of Qasr Antar on the highest peak, with a Greek inscription about those who take an oath there, found by Charles Warren in 1869, is the loftiest ancient sanctuary known. More than twenty temples of the Roman period ring its slopes. Caesarea Philippi at its southern foot was where Peter confessed Christ, and since Hermon is the “high mountain” nearest it, some have placed the Transfiguration there, though tradition since the fourth century points to Tabor."
    - "Today the summit lies in Syria, in the buffer zone of 1974 that the United Nations watched; Israeli troops have held it since December 2024; the southern shoulder has Israel's only ski resort, and the Druze towns of Majdal Shams and Hasbaya lie on its slopes. Its snowmelt still feeds the Jordan, the “cold flowing waters” of Jeremiah."
  ru:
    - "Гора Ермон — высочайшая гора Леванта, 2814 м, южный конец хребта Антиливан, с тремя вершинами, снегом на них большую часть года и истоками Иордана у подножия, в Дане, Баниасе и Хасбани. Ныне это Джебель-эш-Шейх, «гора старейшины», где сходятся Ливан, Сирия и занятые Израилем Голаны. Библия знает её другие имена: «Сидоняне Ермон называют Сирионом, а Аморреи называют его Сениром», а Второзаконие однажды зовёт её Сионом. Угаритские поэмы говорят о кедрах Сириона, а Салманасар III Ассирийский, преследуя Азаила Дамасского в 841 г. до н. э., бился с ним у горы Санир."
    - "Ермон был северным пределом земли Израиля за Иорданом: два царя Аморрейских владели землёй «от потока Арнона до горы Ермона», Ваал-Гад лежал «в долине Ливанской, подле горы Ермона», Евеи жили «подле Ермона в земле Массифе», а полуколено Манассиино расселилось «до Ваал-Ермона и Сенира и до горы Ермона». Поэты любили её: глас Господа заставляет скакать «Ливан и Сирион, подобно молодому единорогу»; изгнанник-псалмопевец вспоминает Бога «с земли Иорданской, с Ермона»; «Фавор и Ермон о имени Твоем радуются»; братское единство — «как роса Ермонская», которая летними ночами обильно смачивает склоны. Песнь песней зовёт невесту «с вершины Сенира и Ермона, от логовищ львиных, от гор барсовых»."
    - "Гора была священна для соседей. Книга Еноха заставляет мятежных ангелов клясться на её вершине; Евсевий говорит, что язычники всё ещё чтили её как святыню, а развалины Каср-Антар на высшей вершине с греческой надписью о приносящих здесь клятву, найденной Чарльзом Уорреном в 1869 году, — самое высокое из известных древних святилищ. Более двадцати храмов римского времени окружают её склоны. У южного подножия, в Кесарии Филипповой, Пётр исповедал Христа, и, поскольку Ермон — ближайшая к ней «гора высокая», некоторые помещают сюда Преображение, хотя предание с IV века указывает на Фавор."
    - "Сегодня вершина лежит в Сирии, в буферной зоне 1974 года, за которой следила ООН; с декабря 2024 года её держат израильские войска; на южном плече — единственный горнолыжный курорт Израиля, а на склонах — друзские города Мадждаль-Шамс и Хасбая. Талые воды горы по-прежнему питают Иордан — «текущие холодные воды» Иеремии."
  uk:
    - "Гора Гермон — найвища гора Леванту, 2814 м, південний кінець хребта Антиліван, із трьома вершинами, снігом на них більшість року й витоками Йордану біля підніжжя — у Дані, Баніясі й Хасбані. Нині це Джебель-еш-Шейх, «гора вождя», де сходяться Ліван, Сирія і утримувані Ізраїлем Голани. Біблія знає її інші назви: «Зидонїї звуть Гермона Сирйон, Аморії ж звуть його Сенір», і Повторення Закону раз називає її Сіоном: «Сійон гора». Угаритські поеми говорять про кедри Сіріону, а Салманассар III Ассирійський, переслідуючи Хазаїла Дамаського 841 р. до н. е., воював з ним біля гори Саніру."
    - "Гермон був північною межею землі Ізраїлю на схід від Йордану: два аморейські царі володіли землею «від Арнон-ріки до Гермон-гори», Ваал-Гад лежав «в Ливанській долинї під Ермоном», хіввеї жили «попід Гермонам в землї Массифі», а половина Манасії розселилася «до Баал-Ермона й Сенира й до гори Ермона». Поети любили її: голос Господа змушує «Ливан-гори і Сирион» скакати, «як молоді буйволи»; вигнаний псалмоспівець згадує Бога «із землї Йорданської і Гермонської»; «Табор і Гермон торжествують задля імені твого»; братня єдність — «Як роса Єрмонська», що рясно зрошує схили літніми ночами. Пісня над піснями кличе наречену «з верхівя Сенира й Єрмону, від леговищ левів, із гір, де рисї»."
    - "Гора була священною для сусідів. Книга Еноха змушує повсталих ангелів присягатися на її вершині; Євсевій каже, що язичники й досі шанували її як святу, а руїна Каср-Антар на найвищій вершині, з грецьким написом про тих, хто присягає там, знайдена Чарльзом Ворреном 1869 р., — найвище з відомих давніх святилищ. Понад двадцять храмів римської доби оточують її схили. Кесарія Пилипова біля південного підніжжя була місцем, де Петро визнав Христа, і оскільки Гермон — «гора висока» найближча до неї, дехто розміщував там Преображення, хоча традиція від IV ст. вказує на Фавор."
    - "Сьогодні вершина лежить у Сирії, у буферній зоні 1974 р., яку стерегла ООН; ізраїльські війська тримають її від грудня 2024 р.; на південному плечі єдиний лижний курорт Ізраїлю, а друзькі містечка Маджаль-Шамс і Хасбая лежать на її схилах. Її талий сніг і досі живить Йордан, «текучі холодні води» Єремії."
  es:
    - "El monte Hermón es la montaña más alta del Levante, con 2814 m, el extremo meridional de la cordillera del Antilíbano, con tres cumbres, nieve en ellas la mayor parte del año y las fuentes del Jordán a sus pies, en Dan, Banias y el Hasbani. Es hoy el Yebel esh-Sheikh, «la montaña del jeque», donde se encuentran el Líbano, Siria y el Golán en manos israelíes. La Biblia conoce sus otros nombres: «Los Sidonios llaman á Hermón Sirión; y los Amorrheos, Senir», y Deuteronomio la llama una vez Sión. Poemas ugaríticos hablan de los cedros del Sirión, y Salmanasar III de Asiria, persiguiendo a Hazael de Damasco en 841 a. C., lo combatió en el monte Saniru."
    - "El Hermón era el límite septentrional de la tierra de Israel al este del Jordán: los dos reyes amorreos poseían «desde el arroyo de Arnón hasta el monte de Hermón», Baal-gad estaba «en la llanura del Líbano, á las raíces del monte Hermón», los heveos vivían «debajo de Hermón en tierra de Mizpa», y la media tribu de Manasés se extendía «hasta Baal-Hermón, y Senir y el monte de Hermón». Los poetas lo amaron: la voz del Señor hace saltar «al Líbano y al Sirión» como a un joven toro salvaje; el salmista desterrado recuerda a Dios «desde tierra del Jordán, y de los Hermonitas»; «Tabor y Hermón cantarán en tu nombre»; la unión fraterna es «Como el rocío de Hermón», que empapa las laderas en las noches de verano. El Cantar llama a la esposa a bajar «desde la cumbre de Senir y de Hermón, desde las guaridas de los leones, desde los montes de los tigres»."
    - "La montaña era sagrada para sus vecinos. El libro de Enoc hace que los ángeles rebeldes juren su juramento en su cima; Eusebio dice que los gentiles aún la veneraban como santa, y la ruina de Qasr Antar, en el pico más alto, con una inscripción griega sobre quienes juran allí, hallada por Charles Warren en 1869, es el santuario antiguo más elevado que se conoce. Más de veinte templos de época romana rodean sus laderas. Cesarea de Filipo, a su pie meridional, fue donde Pedro confesó a Cristo, y como el Hermón es el «monte alto» más cercano, algunos han situado allí la Transfiguración, aunque la tradición desde el siglo IV apunta al Tabor."
    - "Hoy la cumbre se halla en Siria, en la zona de separación de 1974 vigilada por las Naciones Unidas; tropas israelíes la ocupan desde diciembre de 2024; la vertiente sur tiene la única estación de esquí de Israel, y las ciudades drusas de Majdal Shams y Hasbaya se hallan en sus laderas. Su deshielo sigue alimentando el Jordán, las «aguas frías que corren» de Jeremías."
  pt:
    - "O monte Hermom é a montanha mais alta do Levante, com 2.814 m, a extremidade sul da cordilheira do Anti-Líbano, com três cumes, neve neles quase o ano todo e as nascentes do Jordão ao seu pé, em Dã, Banias e o Hasbani. Hoje é o Jebel esh-Sheikh, “a montanha do chefe”, onde se encontram o Líbano, a Síria e o Golã sob controle israelense. A Bíblia conhece seus outros nomes: “Os sidônios chamam Hermom de Siriom, e os amorreus o chamam de Senir”, e Deuteronômio o chama uma vez de Siom. Poemas ugaríticos falam dos cedros de Siriom, e Salmaneser III da Assíria, perseguindo Hazael de Damasco em 841 a.C., lutou com ele no monte Saniru."
    - "O Hermom era o limite norte da terra de Israel a leste do Jordão: os dois reis amorreus tinham a terra “desde o vale do Arnom até o monte Hermom”, Baal-Gade ficava “no vale do Líbano, ao pé do monte Hermom”, os heveus viviam “ao pé do Hermom, na terra de Mispá”, e a meia tribo de Manassés se espalhou “até Baal-Hermom, Senir e o monte Hermom”. Os poetas o amaram: a voz do Senhor faz “o Líbano e o Siriom” saltarem como um novilho selvagem; o salmista exilado se lembra de Deus “desde a terra do Jordão, das alturas do Hermom”; “Tabor e Hermom se alegram no teu nome”; a união fraterna é “como o orvalho do Hermom”, que encharca as encostas nas noites de verão. O Cântico chama a noiva a descer “do topo do Senir e do Hermom, das covas dos leões, dos montes dos leopardos”."
    - "A montanha era santa para seus vizinhos. O livro de Enoque faz os anjos rebeldes jurarem seu juramento em seu cume; Eusébio diz que os gentios ainda a veneravam como santa, e a ruína de Qasr Antar no pico mais alto, com uma inscrição grega sobre os que ali prestam juramento, achada por Charles Warren em 1869, é o santuário antigo mais elevado conhecido. Mais de vinte templos do período romano cercam suas encostas. Cesareia de Filipe, ao seu pé sul, foi onde Pedro confessou Cristo, e como o Hermom é o “alto monte” mais próximo dela, alguns situaram ali a Transfiguração, embora a tradição desde o século IV aponte o Tabor."
    - "Hoje o cume fica na Síria, na zona-tampão de 1974 vigiada pelas Nações Unidas; tropas israelenses o ocupam desde dezembro de 2024; o ombro sul tem a única estação de esqui de Israel, e as cidades drusas de Majdal Shams e Hasbaya ficam em suas encostas. O degelo ainda alimenta o Jordão, as “águas frias que descem de longe” de Jeremias."
  de:
    - "Der Hermon ist der höchste Berg der Levante, 2814 m, das Südende des Antilibanon, mit drei Gipfeln, auf denen die meiste Zeit des Jahres Schnee liegt, und mit den Quellen des Jordan zu seinen Füßen bei Dan, Banias und dem Hasbani. Er heißt heute Dschebel esch-Scheich, „Berg des Scheichs“, wo Libanon, Syrien und der israelisch gehaltene Golan zusammentreffen. Die Bibel kennt seine anderen Namen: „welchen die Sidoniter Sirjon heißen, aber die Amoriter heißen ihn Senir“, und das 5. Buch Mose nennt ihn einmal Sion. Ugaritische Dichtungen sprechen von den Zedern des Sirion, und Salmanassar III. von Assyrien kämpfte 841 v. Chr., als er Hasaël von Damaskus verfolgte, am Berg Saniru gegen ihn."
    - "Der Hermon war die Nordgrenze von Israels Land östlich des Jordan: Die beiden Amoriterkönige hielten das Land „von dem Bach Arnon an bis an den Berg Hermon“, Baal-Gad lag „in der Ebene beim Berge Libanon, unten am Berge Hermon“, Heviter wohnten „unten am Berge Hermon im Lande Mizpa“, und der halbe Stamm Manasse breitete sich „bis gen Baal-Hermon und Senir und den Berg Hermon“ aus. Die Dichter liebten ihn: Die Stimme des HERRN macht „den Libanon und Sirjon wie ein junges Einhorn“ hüpfen; der verbannte Psalmist gedenkt Gottes „im Lande am Jordan und Hermonim“; „Thabor und Hermon jauchzen in deinem Namen“; die brüderliche Eintracht ist „wie der Tau, der vom Hermon herabfällt“, der in Sommernächten die Hänge tränkt. Das Hohelied ruft die Braut herab „von der Höhe Senir und Hermon, von den Wohnungen der Löwen, von den Bergen der Leoparden“."
    - "Der Berg war seinen Nachbarn heilig. Das Henochbuch lässt die abtrünnigen Engel auf seinem Gipfel ihren Eid schwören; Eusebius sagt, die Heiden verehrten ihn noch als heilig, und die Ruine Qasr Antar auf dem höchsten Gipfel, mit einer griechischen Inschrift über die, die dort einen Eid leisten, 1869 von Charles Warren gefunden, ist das höchstgelegene bekannte antike Heiligtum. Mehr als zwanzig Tempel der römischen Zeit umgeben seine Hänge. Caesarea Philippi an seinem Südfuß war der Ort, wo Petrus Christus bekannte, und da der Hermon der ihm nächste „hohe Berg“ ist, haben manche die Verklärung dorthin verlegt, obwohl die Überlieferung seit dem 4. Jahrhundert auf den Tabor weist."
    - "Heute liegt der Gipfel in Syrien, in der Pufferzone von 1974, die die Vereinten Nationen überwachten; israelische Truppen halten ihn seit Dezember 2024; die Südschulter hat Israels einziges Skigebiet, und die drusischen Orte Majdal Schams und Hasbaya liegen an seinen Hängen. Seine Schneeschmelze speist noch immer den Jordan, die kalten fließenden Wasser Jeremias."
  fr:
    - "Le mont Hermon est la plus haute montagne du Levant, 2 814 m, extrémité sud de la chaîne de l’Anti-Liban, avec trois sommets, de la neige la plus grande partie de l’année et les sources du Jourdain à son pied, à Dan, à Banias et au Hasbani. C’est aujourd’hui le djebel ech-Cheikh, « la montagne du chef », où se rencontrent le Liban, la Syrie et le Golan tenu par Israël. La Bible connaît ses autres noms : « les Sidoniens donnent à l’Hermon le nom de Sirion, et les Amoréens celui de Senir », et le Deutéronome l’appelle une fois Sion. Des poèmes ougaritiques parlent des cèdres du Sirion, et Salmanasar III d’Assyrie, poursuivant Hazaël de Damas en 841 av. J.-C., le combattit au mont Saniru."
    - "L’Hermon était la limite nord du pays d’Israël à l’est du Jourdain : les deux rois amoréens tenaient le pays « depuis le torrent de l’Arnon jusqu’à la montagne de l’Hermon », Baal-Gad se trouvait « dans la vallée du Liban, au pied de la montagne d’Hermon », des Héviens vivaient « au pied de l’Hermon dans le pays de Mitspa », et la demi-tribu de Manassé s’étendait « jusqu’à Baal-Hermon et à Senir, et à la montagne d’Hermon ». Les poètes l’aimaient : la voix de l’Éternel fait bondir « le Liban et le Sirion comme de jeunes buffles » ; le psalmiste exilé pense à Dieu « depuis le pays du Jourdain, depuis l’Hermon » ; « Le Thabor et l’Hermon se réjouissent à ton nom » ; l’unité fraternelle est « comme la rosée de l’Hermon », qui trempe les pentes en été. Le Cantique appelle l’épouse « du sommet du Senir et de l’Hermon, des tanières des lions, des montagnes des léopards »."
    - "La montagne était sainte pour ses voisins. Le livre d’Hénoch fait jurer aux anges rebelles leur serment sur son sommet ; Eusèbe dit que les païens la vénéraient encore comme sainte, et la ruine de Qasr Antar sur le plus haut sommet, avec une inscription grecque sur ceux qui y prêtent serment, trouvée par Charles Warren en 1869, est le plus élevé des sanctuaires antiques connus. Plus de vingt temples de l’époque romaine ceignent ses pentes. Césarée de Philippe, à son pied sud, fut le lieu où Pierre confessa le Christ, et comme l’Hermon est la « haute montagne » la plus proche, certains y ont placé la Transfiguration, bien que la tradition depuis le IVe siècle désigne le Thabor."
    - "Aujourd’hui, le sommet se trouve en Syrie, dans la zone tampon de 1974 que surveillent les Nations unies ; des troupes israéliennes la tiennent depuis décembre 2024 ; l’épaulement sud abrite l’unique station de ski d’Israël, et les villes druzes de Majdal Shams et de Hasbaya s’étendent sur ses pentes. Sa fonte des neiges alimente toujours le Jourdain, les eaux « fraîches et courantes » de Jérémie."
  it:
    - "Il Monte Ermon è la montagna più alta del Levante, 2814 m, l’estremità meridionale della catena dell’Antilibano, con tre cime coperte di neve per la maggior parte dell’anno e le sorgenti del Giordano ai suoi piedi a Dan, Banias e Hasbani. È oggi il Jebel esh-Sheikh, «il monte del capo», dove si incontrano Libano, Siria e il Golan tenuto da Israele. La Bibbia ne conosce altri nomi: «il quale Hermon i Sidonii chiamano Sirion, e gli Amorei Senir», e il Deuteronomio una volta lo chiama Sion. I poemi ugaritici parlano dei cedri del Sirion, e Salmanàssar III d’Assiria, inseguendo Cazaèl di Damasco nell’841 a.C., lo combatté al Monte Saniru."
    - "L’Ermon era il limite settentrionale della terra d’Israele a est del Giordano: i due re amorei tenevano il paese «dalla valle dell’Arnon al monte Hermon», Baal-Gad si trovava «nella valle del Libano appiè del monte Hermon», gli Evei abitavano «appiè dello Hermon nel paese di Mitspa», e la metà di Manasse si estendeva «fino a Baal-Hermon e a Senir e al monte Hermon». I poeti lo amarono: la voce del Signore fa saltellare «il Libano e il Sirio come giovani bufali»; il salmista in esilio si ricorda di Dio «dal paese del Giordano, dai monti dell’Hermon»; «il Tabor e l’Hermon mandan grida di gioia al tuo nome»; l’unità fraterna è «come la rugiada dell’Hermon», che bagna i pendii nelle notti d’estate. Il Cantico chiama la sposa «dalla sommità del Senir e dell’Hermon, dalle spelonche de’ leoni, dai monti de’ leopardi»."
    - "Il monte era sacro ai vicini. Il libro di Enoc fa giurare gli angeli ribelli sulla sua cima; Eusebio dice che i gentili lo veneravano ancora come sacro, e la rovina di Qasr Antar sulla vetta più alta, con un’iscrizione greca su chi vi presta giuramento, trovata da Charles Warren nel 1869, è il più alto santuario antico noto. Più di venti templi del periodo romano ne cingono i pendii. Cesarea di Filippo, ai suoi piedi meridionali, fu dove Pietro confessò Cristo, e poiché l’Ermon è l’«alto monte» più vicino, alcuni vi hanno collocato la Trasfigurazione, benché la tradizione dal IV secolo indichi il Tabor."
    - "Oggi la vetta si trova in Siria, nella zona cuscinetto del 1974 sorvegliata dalle Nazioni Unite; truppe israeliane la tengono da dicembre 2024; il fianco meridionale ha l’unica stazione sciistica d’Israele, e le città druse di Majdal Shams e Hasbaya sorgono sui suoi pendii. Il suo disgelo alimenta ancora il Giordano, le «acque che vengon di lontano, fresche, correnti» di Geremia."
  pl:
    - "Hermon to najwyższa góra Lewantu, 2814 m, południowy kraniec pasma Antylibanu, z trzema szczytami, przez większą część roku pokrytymi śniegiem, i ze źródłami Jordanu u stóp w Dan, Banias i Hasbani. Dziś jest to Dżabal asz-Szajch, „góra szejka”, gdzie spotykają się Liban, Syria i kontrolowany przez Izrael Golan. Biblia zna jego inne nazwy: „Sydończycy zowią Hermon Szyryjon, a Amorejczycy zowią go Sanir”, a Księga Powtórzonego Prawa raz nazywa go Syonem. Poematy ugaryckie mówią o cedrach Sirionu, a Salmanasar III Asyryjski, ścigając Chazaela z Damaszku w 841 r. p.n.e., walczył z nim pod górą Saniru."
    - "Hermon był północną granicą ziemi Izraela na wschód od Jordanu: dwaj królowie amorejscy władali „od rzeki Arnon aż do góry Hermon”, Baal-Gad leżało „w równinie Libańskiej pod górą Hermon”, Hewejczycy mieszkali „pod górą Hermon, w ziemi Maswa”, a połowa Manassesa rozciągała się „do Baal-Hermon i Sanir, które jest góra Hermon”. Poeci go kochali: głos Pana czyni, że „skaczą jako cielęta; Liban i Syryjon jako młody jednorożec”; wygnany psalmista wspomina Boga „w ziemi Jordańskiej i Hermońskiej”; „Tabor i Hermon śpiewają o imieniu twojem”; braterska jedność jest „Jako rosa Hermon”, która zrasza zbocza w letnie noce. Pieśń nad Pieśniami woła oblubienicę „z wierzchu góry Sanir i Hermon, z jaskiń lwich, i z gór lampartowych”."
    - "Góra była święta dla sąsiadów. Księga Henocha każe zbuntowanym aniołom złożyć przysięgę na jej szczycie; Euzebiusz mówi, że poganie wciąż czcili ją jako świętą, a ruina Qasr Antar na najwyższym szczycie, z greckim napisem o tych, którzy tam składają przysięgę, znalezionym przez Charlesa Warrena w 1869 r., jest najwyżej położonym znanym starożytnym sanktuarium. Ponad dwadzieścia świątyń z okresu rzymskiego otacza jej zbocza. Cezarea Filipowa u jej południowego podnóża była miejscem, gdzie Piotr wyznał Chrystusa, a ponieważ Hermon jest najbliższą wysoką górą, niektórzy umieścili tam Przemienienie, choć tradycja od IV w. wskazuje Tabor."
    - "Dziś szczyt leży w Syrii, w strefie buforowej z 1974 r., którą nadzorowała ONZ; wojska izraelskie zajmują go od grudnia 2024 r.; południowe ramię ma jedyny izraelski ośrodek narciarski, a druzyjskie miasta Madżdal Szams i Hasbaja leżą na jego zboczach. Jego roztopy wciąż zasilają Jordan, zimne „wody ciekące” Jeremiasza."
  nl:
    - "De Hermon is de hoogste berg van de Levant, 2.814 m, het zuidelijke einde van het Antilibanongebergte, met drie toppen, het grootste deel van het jaar met sneeuw, en aan zijn voet de bronnen van de Jordaan bij Dan, Banias en de Hasbani. Hij heet nu Jebel esh-Sheikh, “de berg van het opperhoofd”, waar Libanon, Syrië en de door Israël bezette Golan samenkomen. De Bijbel kent zijn andere namen: “De Zidoniers noemen Hermon Sirjon; maar de Amorieten noemen hem Senir”, en Deuteronomium noemt hem één keer Sion. Ugaritische gedichten spreken van de cederen van Sirion, en Salmaneser III van Assyrië, die Hazaël van Damascus achtervolgde, streed in 841 v.Chr. tegen hem bij de berg Saniru."
    - "De Hermon was de noordgrens van Israëls land ten oosten van de Jordaan: de twee Amorietische koningen hielden het land “van de beek Arnon tot den berg Hermon toe”, Baäl-Gad lag “in het dal van den Libanon, onder aan den berg Hermon”, Hevieten woonden “onder aan Hermon, in het land van Mizpa”, en de halve stam Manasse verspreidde zich “van Basan tot aan Baal-Hermon, en Senir, en den berg Hermon”. De dichters hielden ervan: de stem van de HEER doet “den Libanon en Sirjon” huppelen als een jong wild rund; de verbannen psalmist gedenkt God “uit het land van de Jordaan, en Hermon, uit het klein gebergte”; “Thabor en Hermon juichen in Uw Naam”; broederlijke eendracht is “gelijk de dauw van Hermon”, die op zomernachten de hellingen doordrenkt. Het Hooglied roept de bruid van “den top van Senir en van Hermon, van de woningen der leeuwinnen, van de bergen der luipaarden”."
    - "De berg was heilig voor zijn buren. Het boek Henoch laat de opstandige engelen hun eed zweren op zijn top; Eusebius zegt dat de heidenen hem nog als heilig vereerden, en de ruïne van Qasr Antar op de hoogste piek, met een Griekse inscriptie over wie daar een eed zweren, in 1869 gevonden door Charles Warren, is het hoogste bekende oude heiligdom. Meer dan twintig tempels uit de Romeinse tijd omringen zijn hellingen. Caesarea Filippi aan zijn zuidelijke voet was waar Petrus Christus beleed, en aangezien de Hermon de berg is die het dichtst bij de “hogen berg” van de evangelisten ligt, hebben sommigen de Gedaanteverandering daar geplaatst, hoewel de overlevering sinds de vierde eeuw naar de Tabor wijst."
    - "Tegenwoordig ligt de top in Syrië, in de bufferzone van 1974 waarop de Verenigde Naties toezagen; Israëlische troepen houden hem sinds december 2024 bezet; de zuidelijke schouder heeft Israëls enige skioord, en de Druzische stadjes Majdal Shams en Hasbaya liggen op zijn hellingen. Zijn smeltwater voedt nog steeds de Jordaan, de “koude, vlietende wateren” van Jeremia."
  cs:
    - "Hermon je nejvyšší hora Levanty, 2814 m, jižní konec pohoří Antilibanon, o třech vrcholech, se sněhem na nich většinu roku a s prameny Jordánu u úpatí v Danu, Baníasu a Hasbání. Dnes je to Jebel aš-Šajch, „hora náčelníka“, kde se stýkají Libanon, Sýrie a izraelsky držený Golán. Bible zná jeho jiná jména: „Sidonští říkají Hermonu Sarion, a Amorejští říkají jemu Sanir“, a Deuteronomium jej jednou nazývá Sion: „až k hoře Sion, kteráž jest Hermon“. Ugaritské básně mluví o cedrech Siriónu a Salmanasar III. Asyrský, pronásledující roku 841 př. n. l. Chazaela Damašského, s ním bojoval u hory Saniru."
    - "Hermon byl severní hranicí země Izraele východně od Jordánu: dva amorejští králové drželi zemi „od potoku Arnon až k hoře Hermon“, Báal-gad ležel „na rovině Libánské, pod horou Hermon“, Hevejci žili „pod horou Hermon v zemi Masfa“ a polovina Manasese se rozprostírala „až do Balhermon i Sanir, totiž hory Hermon“. Básníci ji milovali: hlas Hospodinův nechává skákat „Libán a Sirion“ jako mladého jednorožce; vyhnaný žalmista si na Boha vzpomíná „v krajině Jordánské a Hermonské“; „Tábor a Hermon o tvém jménu zpívají“; bratrská svornost je „jako rosa Hermon“, která v letních nocích smáčí svahy. Píseň písní volá nevěstu dolů „s vrchu Senir a Hermon, z peleší lvových a s hor pardových“."
    - "Hora byla svatá i sousedům. Kniha Enochova nechává vzbouřené anděly přísahat na jejím vrcholu; Eusebius praví, že ji pohané dosud uctívali jako svatou, a zřícenina Qasr Antar na nejvyšším vrcholu, s řeckým nápisem o těch, kdo tam přísahají, nalezeným Charlesem Warrenem roku 1869, je nejvýše položená známá starověká svatyně. Přes dvacet chrámů z doby římské obklopuje její svahy. Cesarea Filipova na jejím jižním úpatí byla místem, kde Petr vyznal Krista, a protože Hermon je nejbližší vysoká hora, někteří tam kladli Proměnění, ačkoli tradice od 4. století ukazuje na Tábor."
    - "Dnes vrchol leží v Sýrii, v nárazníkovém pásmu z roku 1974, které střežila Organizace spojených národů; izraelské jednotky ho drží od prosince 2024; na jižním rameni je jediné izraelské lyžařské středisko a drúzská městečka Madždal Šams a Hasbaya leží na jeho svazích. Jeho tající sníh stále živí Jordán, Jeremjášovy studené tekoucí vody."
