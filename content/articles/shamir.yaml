# Overview article (ADR 0007). Mainstream facts only; Tola's Shamir is unlocated; the Samaria hill and Khirbet Samara are given as the candidates on the map, neither as fact.
id: shamir
place: af6476f
title:
  en: "Shamir"
  ru: "Шамир"
  uk: "Шамір"
  es: "Samir"
  pt: "Samir"
  de: "Schamir"
  fr: "Schamir"
body:
  en:
    - "Shamir in the hill country of Ephraim was the home and burial place of Tola, the first of the so-called minor judges: “Tola the son of Puah, the son of Dodo, a man of Issachar”, who “dwelt in Shamir in mount Ephraim”, judged Israel twenty-three years, “and died, and was buried in Shamir”. That is all the Bible says of it; a Shamir in the hill country of Judah, listed with Jattir and Socoh, is another place."
    - "Where it was is not known. The hill of Samaria, Shomron, which Omri later bought from Shemer, bears a name of the same root, and some suppose that Shamir was the village on that hill before the royal city was built; excavations there found an olive-oil installation and pottery of the early Iron Age under the Omride palace, so the hill was settled then, but nothing links it with Tola. Others point to Khirbet Samara in the hills south of Nablus, or leave the question open; the map shows these candidates. The country of Tola's Shamir is today the northern West Bank between Nablus and Jenin."
  ru:
    - "Шамир на горе Ефремовой — дом и место погребения Фолы, первого из так называемых малых судей: «Фола, сын Фуи, сына Додова, из колена Иссахарова», который «жил в Шамире на горе Ефремовой», судил Израиль двадцать три года, «и умер, и погребен в Шамире». Это всё, что говорит о нём Библия; Шамир на горах Иудеи, названный вместе с Иаттиром и Сохо, — другое место."
    - "Где он находился, неизвестно. Гора Самария, Шомрон, которую Амврий позже купил у Семира, носит имя того же корня, и некоторые полагают, что Шамир был селением на этой горе до постройки царского города; раскопки нашли там под дворцом Амврия давильню для масла и керамику раннего железного века, так что гора тогда была заселена, но с Фолой её ничто не связывает. Другие указывают на Хирбет-Самару в горах к югу от Наблуса или оставляют вопрос открытым; на карте показаны эти варианты. Страна Фолова Шамира — это сегодня север Западного берега между Наблусом и Дженином."
  uk:
    - "Шамір у гірській країні Єфрема був домівкою й місцем поховання Фоли, першого з так званих малих суддів: «Тола, син Пуї, сина Додового, з поколїння Іссахарового», що «жив у Самирі, на горах Ефраїмових», судив Ізраїль двадцять три роки, а потім «умер, і поховано його в Самирі». Це все, що Біблія каже про нього; Шамір у гірській країні Юди, названий поруч із Яттіром і Сохо, — інше місце."
    - "Де він був, невідомо. Пагорб Самарії, Шомрон, який Омрі згодом купив у Шемера, має назву від того самого кореня, і дехто припускає, що Шамір було селом на цьому пагорбі до побудови царського міста; розкопки виявили там під палацом Омрідів олійню й кераміку раннього залізного віку, тож пагорб тоді був заселений, але з Фолою його ніщо не пов'язує. Інші вказують на Хірбет-Самару в горах на південь від Наблуса або залишають питання відкритим; на карті показано ці кандидатури. Край Шаміра Фоли — це нині північна частина Західного берега між Наблусом і Дженіном."
  es:
    - "Samir, en la región montañosa de Efraín, fue la patria y el lugar de sepultura de Tola, el primero de los llamados jueces menores: «Tola hijo de Púa, hijo de Dodo, varón de Issachâr», que «habitaba en Samir, en el monte de Ephraim», juzgó a Israel veintitrés años, «y murió, y fué sepultado en Samir». Eso es todo lo que la Biblia dice de ella; un Samir en la región montañosa de Judá, enumerado con Jatir y Soco, es otro lugar."
    - "Dónde estaba no se sabe. La colina de Samaria, Shomrón, que Omri compró más tarde a Semer, lleva un nombre de la misma raíz, y algunos suponen que Samir era la aldea de esa colina antes de que se construyera la ciudad real; las excavaciones allí hallaron una instalación de aceite de oliva y cerámica de la Edad del Hierro temprana bajo el palacio omrida, de modo que la colina estaba poblada entonces, pero nada la vincula con Tola. Otros señalan Khirbet Samara, en las colinas al sur de Nablus, o dejan la cuestión abierta; el mapa muestra estos candidatos. La región del Samir de Tola es hoy el norte de Cisjordania, entre Nablus y Jenín."
  pt:
    - "Samir, na região montanhosa de Efraim, foi a casa e o lugar de sepultamento de Tolá, o primeiro dos chamados juízes menores: “Tola, filho de Puá, filho de Dodô, homem de Issacar”, que “habitava em Samir, na região montanhosa de Efraim”, julgou Israel vinte e três anos, “morreu e foi sepultado em Samir”. É tudo o que a Bíblia diz dela; uma Samir na região montanhosa de Judá, listada com Jatir e Socó, é outro lugar."
    - "Onde ficava não se sabe. A colina de Samaria, Shomron, que Onri comprou depois de Semer, tem um nome da mesma raiz, e alguns supõem que Samir fosse a aldeia nessa colina antes da cidade real; escavações ali acharam uma instalação de azeite e cerâmica do início da Idade do Ferro sob o palácio omrida, de modo que a colina estava povoada então, mas nada a liga a Tolá. Outros apontam Khirbet Samara, nas colinas ao sul de Nablus, ou deixam a questão aberta; o mapa mostra esses candidatos. O país da Samir de Tolá é hoje o norte da Cisjordânia, entre Nablus e Jenin."
  de:
    - "Schamir im Bergland Ephraim war Heimat und Begräbnisstätte Tolas, des ersten der sogenannten kleinen Richter: „Thola, ein Mann von Isaschar, ein Sohn Phuas, des Sohnes Dodos“, der „wohnte zu Samir auf dem Gebirge Ephraim“, Israel dreiundzwanzig Jahre richtete „und starb und wurde begraben zu Samir“. Das ist alles, was die Bibel darüber sagt; ein Schamir im Bergland Judas, mit Jattir und Socho aufgeführt, ist ein anderer Ort."
    - "Wo es lag, ist unbekannt. Der Hügel von Samaria, Schomron, den Omri später von Schemer kaufte, trägt einen Namen derselben Wurzel, und manche vermuten, Schamir sei das Dorf auf diesem Hügel gewesen, ehe die Königsstadt gebaut wurde; Grabungen dort fanden unter dem omridischen Palast eine Olivenölanlage und Keramik der frühen Eisenzeit, der Hügel war also damals besiedelt, doch nichts verbindet ihn mit Tola. Andere verweisen auf Chirbet Samara in den Hügeln südlich von Nablus oder lassen die Frage offen; die Karte zeigt diese Kandidaten. Tolas Schamir lag in dem Land, das heute das nördliche Westjordanland zwischen Nablus und Dschenin ist."
  fr:
    - "Schamir, dans les collines d’Éphraïm, fut la patrie et le lieu de sépulture de Thola, le premier des juges dits mineurs : « Thola, fils de Pua, fils de Dodo, homme d’Issacar », qui « habitait à Schamir, dans la montagne d’Éphraïm », jugea Israël vingt-trois ans, « puis il mourut, et fut enterré à Schamir ». C’est tout ce que la Bible en dit ; un Schamir dans les collines de Juda, cité avec Jatthir et Soco, est un autre lieu."
    - "On ignore où il se trouvait. La colline de Samarie, Shomron, qu’Omri acheta plus tard à Schémer, porte un nom de même racine, et certains supposent que Schamir était le village de cette colline avant la construction de la ville royale ; les fouilles y ont trouvé une installation d’huile d’olive et de la céramique du début de l’âge du Fer sous le palais omride, si bien que la colline était alors habitée, mais rien ne la relie à Thola. D’autres désignent Khirbet Samara dans les collines au sud de Naplouse, ou laissent la question ouverte ; la carte montre ces candidats. Le pays du Schamir de Thola est aujourd’hui le nord de la Cisjordanie entre Naplouse et Jénine."
