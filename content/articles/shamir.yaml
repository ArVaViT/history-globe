body:
  en:
    - "Shamir in the hill country of Ephraim was the home and burial place of Tola, one of the so-called minor judges: “Tola the son of Puah, the son of Dodo, a man of Issachar”, who “dwelt in Shamir in mount Ephraim”, judged Israel twenty-three years, “and died, and was buried in Shamir”. That is all the Bible says of it; a Shamir in the hill country of Judah, listed with Jattir and Socoh, is another place."
    - "Where it was is not known. The hill of Samaria, Shomron, which Omri later bought from Shemer, bears a name of the same root, and some suppose that Shamir was the village on that hill before the royal city was built; excavations there found an olive-oil installation and pottery of the early Iron Age under the Omride palace, so the hill was settled then, but nothing links it with Tola. Others point to Khirbet Samara in the hills south of Nablus, or leave the question open; the map shows these candidates. Both candidates lie today in the West Bank."
  ru:
    - "Шамир на горе Ефремовой — дом и место погребения Фолы, одного из так называемых малых судей: «Фола, сын Фуи, сына Додова, из колена Иссахарова», который «жил в Шамире на горе Ефремовой», судил Израиль двадцать три года, «и умер, и погребен в Шамире». Это всё, что говорит о нём Библия; Шамир на горах Иудеи, названный вместе с Иаттиром и Сохо, — другое место."
    - "Где он находился, неизвестно. Гора Самария, Шомрон, которую Амврий позже купил у Семира, носит имя того же корня, и некоторые полагают, что Шамир был селением на этой горе до постройки царского города; раскопки нашли там под дворцом Амврия давильню для масла и керамику раннего железного века, так что гора тогда была заселена, но с Фолой её ничто не связывает. Другие указывают на Хирбет-Самару в горах к югу от Наблуса или оставляют вопрос открытым; на карте показаны эти варианты. Оба кандидата лежат сегодня на Западном берегу."
  uk:
    - "Шамір у гірській країні Єфрема був домівкою й місцем поховання Фоли, одного з так званих малих суддів: «Тола, син Пуї, сина Додового, з поколїння Іссахарового», що «жив у Самирі, на горах Ефраїмових», судив Ізраїль двадцять три роки, а потім «умер, і поховано його в Самирі». Це все, що Біблія каже про нього; Шамір у гірській країні Юди, названий поруч із Яттіром і Сохо, — інше місце."
    - "Де він був, невідомо. Пагорб Самарії, Шомрон, який Омрі згодом купив у Шемера, має назву від того самого кореня, і дехто припускає, що Шамір було селом на цьому пагорбі до побудови царського міста; розкопки виявили там під палацом Омрідів олійню й кераміку раннього залізного віку, тож пагорб тоді був заселений, але з Фолою його ніщо не пов'язує. Інші вказують на Хірбет-Самару в горах на південь від Наблуса або залишають питання відкритим; на карті показано ці кандидатури. Обидва кандидати лежать нині на Західному березі."
  es:
    - "Samir, en la región montañosa de Efraín, fue la patria y el lugar de sepultura de Tola, uno de los llamados jueces menores: «Tola hijo de Púa, hijo de Dodo, varón de Issachâr», que «habitaba en Samir, en el monte de Ephraim», juzgó a Israel veintitrés años, «y murió, y fué sepultado en Samir». Eso es todo lo que la Biblia dice de ella; un Samir en la región montañosa de Judá, enumerado con Jatir y Soco, es otro lugar."
    - "Dónde estaba no se sabe. La colina de Samaria, Shomrón, que Omri compró más tarde a Semer, lleva un nombre de la misma raíz, y algunos suponen que Samir era la aldea de esa colina antes de que se construyera la ciudad real; las excavaciones allí hallaron una instalación de aceite de oliva y cerámica de la Edad del Hierro temprana bajo el palacio omrida, de modo que la colina estaba poblada entonces, pero nada la vincula con Tola. Otros señalan Khirbet Samara, en las colinas al sur de Nablus, o dejan la cuestión abierta; el mapa muestra estos candidatos. Ambos candidatos se encuentran hoy en Cisjordania."
  pt:
    - "Samir, na região montanhosa de Efraim, foi a casa e o lugar de sepultamento de Tolá, um dos chamados juízes menores: “Tola, filho de Puá, filho de Dodô, homem de Issacar”, que “habitava em Samir, na região montanhosa de Efraim”, julgou Israel vinte e três anos, “morreu e foi sepultado em Samir”. É tudo o que a Bíblia diz dela; uma Samir na região montanhosa de Judá, listada com Jatir e Socó, é outro lugar."
    - "Onde ficava não se sabe. A colina de Samaria, Shomron, que Onri comprou depois de Semer, tem um nome da mesma raiz, e alguns supõem que Samir fosse a aldeia nessa colina antes da cidade real; escavações ali acharam uma instalação de azeite e cerâmica do início da Idade do Ferro sob o palácio omrida, de modo que a colina estava povoada então, mas nada a liga a Tolá. Outros apontam Khirbet Samara, nas colinas ao sul de Nablus, ou deixam a questão aberta; o mapa mostra esses candidatos. Ambos os candidatos ficam hoje na Cisjordânia."
  de:
    - "Schamir im Bergland Ephraim war Heimat und Begräbnisstätte Tolas, eines der sogenannten kleinen Richter: „Thola, ein Mann von Isaschar, ein Sohn Phuas, des Sohnes Dodos“, der „wohnte zu Samir auf dem Gebirge Ephraim“, Israel dreiundzwanzig Jahre richtete „und starb und wurde begraben zu Samir“. Das ist alles, was die Bibel darüber sagt; ein Schamir im Bergland Judas, mit Jattir und Socho aufgeführt, ist ein anderer Ort."
    - "Wo es lag, ist unbekannt. Der Hügel von Samaria, Schomron, den Omri später von Schemer kaufte, trägt einen Namen derselben Wurzel, und manche vermuten, Schamir sei das Dorf auf diesem Hügel gewesen, ehe die Königsstadt gebaut wurde; Grabungen dort fanden unter dem omridischen Palast eine Olivenölanlage und Keramik der frühen Eisenzeit, der Hügel war also damals besiedelt, doch nichts verbindet ihn mit Tola. Andere verweisen auf Chirbet Samara in den Hügeln südlich von Nablus oder lassen die Frage offen; die Karte zeigt diese Kandidaten. Beide Kandidaten liegen heute im Westjordanland."
  fr:
    - "Schamir, dans les collines d’Éphraïm, fut la patrie et le lieu de sépulture de Thola, l’un des juges dits mineurs : « Thola, fils de Pua, fils de Dodo, homme d’Issacar », qui « habitait à Schamir, dans la montagne d’Éphraïm », jugea Israël vingt-trois ans, « puis il mourut, et fut enterré à Schamir ». C’est tout ce que la Bible en dit ; un Schamir dans les collines de Juda, cité avec Jatthir et Soco, est un autre lieu."
    - "On ignore où il se trouvait. La colline de Samarie, Shomron, qu’Omri acheta plus tard à Schémer, porte un nom de même racine, et certains supposent que Schamir était le village de cette colline avant la construction de la ville royale ; les fouilles y ont trouvé une installation d’huile d’olive et de la céramique du début de l’âge du Fer sous le palais omride, si bien que la colline était alors habitée, mais rien ne la relie à Thola. D’autres désignent Khirbet Samara dans les collines au sud de Naplouse, ou laissent la question ouverte ; la carte montre ces candidats. Les deux candidats se trouvent aujourd’hui en Cisjordanie."
  it:
    - "Samir, nella regione montuosa di Efraim, fu la patria e il luogo di sepoltura di Tola, uno dei cosiddetti giudici minori: «Thola, figliuolo di Puah, figliuolo di Dodo, uomo d’Issacar», che «dimorava a Samir, nella contrada montuosa di Efraim», giudicò Israele ventitré anni, «poi morì e fu sepolto a Samir». È tutto ciò che la Bibbia dice di essa; una Samir nella regione montuosa di Giuda, elencata con Iattir e Soco, è un altro luogo."
    - "Dove fosse non si sa. Il colle di Samaria, Shomron, che Omri comprò poi da Semer, porta un nome della stessa radice, e alcuni suppongono che Samir fosse il villaggio su quel colle prima che fosse costruita la città regale; gli scavi lì hanno trovato un impianto per l’olio d’oliva e ceramica dell’inizio dell’età del Ferro sotto il palazzo degli Omridi, per cui il colle era abitato allora, ma nulla lo collega a Tola. Altri indicano Khirbet Samara sulle colline a sud di Nablus, o lasciano la questione aperta; la mappa mostra questi candidati. Entrambi i candidati si trovano oggi in Cisgiordania."
  pl:
    - "Szamir w górach Efraima było domem i miejscem pochówku Toli, jednego z tak zwanych sędziów mniejszych: „Tola, syn Fui, syna Dodowego, mąż z pokolenia Isascharowego”, który „mieszkał w Samir na górze Efraim”, sądził Izraela dwadzieścia trzy lata, „potem umarł, i pogrzbion jest w Samir”. To wszystko, co Biblia mówi o nim; Szamir w górach Judy, wymienione z Jattir i Soko, to inne miejsce."
    - "Gdzie leżało, nie wiadomo. Wzgórze Samarii, Szomron, które Omri kupił później od Szemera, nosi nazwę od tego samego pierwiastka i niektórzy przypuszczają, że Szamir było wsią na tym wzgórzu, zanim zbudowano miasto królewskie; wykopaliska znalazły tam urządzenie do tłoczenia oliwy i ceramikę z wczesnej epoki żelaza pod pałacem Omridów, więc wzgórze było wtedy zasiedlone, ale nic nie łączy go z Tolą. Inni wskazują Chirbet Samara we wzgórzach na południe od Nablusu albo zostawiają pytanie otwarte; mapa pokazuje tych kandydatów. Obie lokalizacje leżą dziś na Zachodnim Brzegu."
  cs:
    - "Šamir v pahorkatině Efrajimově byl domovem a hrobem Toly, jednoho z tzv. vedlejších soudců: „Tola, syn Fua, syna Dodova, muž z pokolení Izachar“, který „bydlil v Samir na hoře Efraim“, soudil Izraele třiadvacet let, „a umřev, pochován jest v Samir“. To je vše, co Bible o něm říká; Šamir v judské pahorkatině, uvedený s Jatirem a Sókó, je jiné místo."
    - "Kde byl, není známo. Pahorek Samaří, Šomron, který Omrí později koupil od Šemera, nese jméno téhož kořene a někteří se domnívají, že Šamir byla vesnice na tom pahorku před vznikem královského města; vykopávky tam nalezly zařízení na výrobu olivového oleje a keramiku z rané doby železné pod omríovským palácem, takže pahorek byl tehdy osídlen, ale nic jej s Tolou nespojuje. Jiní ukazují na Chirbet Samara v pahorcích jižně od Nábulusu nebo nechávají otázku otevřenou; mapa tyto kandidáty ukazuje. Oba kandidáti leží dnes na Západním břehu."
  nl:
    - "Samir in het bergland van Efraïm was de woon- en begraafplaats van Tola, een van de zogeheten kleine richters: “Thola, een zoon van Pua, zoon van Dodo, een man van Issaschar”, die “woonde te Samir, op het gebergte van Efraim”, Israël drieëntwintig jaar richtte, “en hij stierf, en werd begraven te Samir”. Dat is alles wat de Bijbel erover zegt; een Samir in het bergland van Juda, vermeld met Jattir en Socho, is een andere plaats."
    - "Waar het lag, is niet bekend. De heuvel van Samaria, Shomron, die Omri later van Semer kocht, draagt een naam van dezelfde wortel, en sommigen veronderstellen dat Samir het dorp op die heuvel was vóór de koningsstad werd gebouwd; opgravingen daar vonden een olijfolie-installatie en aardewerk uit de vroege ijzertijd onder het paleis van de Omrieten, dus de heuvel was toen bewoond, maar niets verbindt hem met Tola. Anderen wijzen op Khirbet Samara in de heuvels ten zuiden van Nabloes, of laten de vraag open; de kaart toont deze kandidaten. Beide kandidaten liggen tegenwoordig op de Westelijke Jordaanoever."
  sv:
    - "Shamir i Efraims bergsbygd var hem och gravplats för Tola, en av de så kallade mindre domarna: ”Tola, son till Pua, son till Dodo, en man från Isaskar; och han bodde i Samir, i Efraims bergsbygd”, dömde Israel i tjugotre år, ”sedan dog han och blev begraven i Samir”. Det är allt Bibeln säger om det; ett Shamir i Judas bergsbygd, förtecknat med Jattir och Soko, är en annan plats."
    - "Var det låg är inte känt. Samarias kulle, Shomron, som Omri senare köpte av Shemer, bär ett namn av samma rot, och vissa antar att Shamir var byn på den kullen innan kungastaden byggdes; utgrävningar där fann en olivoljeanläggning och keramik från tidig järnålder under omridernas palats, så kullen var bebodd då, men ingenting knyter den till Tola. Andra pekar på Khirbet Samara i bergen söder om Nablus, eller låter frågan stå öppen; kartan visar dessa kandidater. Båda kandidaterna ligger i dag på Västbanken."
  nb:
    - "Sjamir i Efraims fjellland var hjemstedet og gravstedet til Tola, en av de såkalte mindre dommerne: «han var sønn av Pua, Dodos sønn, av Issakars stamme, og bodde i Samir på Efra'im-fjellet», dømte Israel i tre og tyve år, «og han døde og blev begravet i Samir». Det er alt Bibelen sier om det; et Sjamir i Judas fjellland, oppført sammen med Jattir og Soko, er et annet sted."
    - "Hvor det lå, er ikke kjent. Høyden Samaria, Shomron, som Omri senere kjøpte av Sjemer, bærer et navn av samme rot, og noen antar at Sjamir var landsbyen på den høyden før kongebyen ble bygd; utgravninger der fant et olivenoljeanlegg og keramikk fra tidlig jernalder under omridenes palass, så høyden var bosatt da, men ingenting knytter den til Tola. Andre peker på Khirbet Samara i åsene sør for Nablus, eller lar spørsmålet stå åpent; kartet viser disse kandidatene. Begge kandidatene ligger i dag på Vestbredden."
  tl:
    - "Ang Samir sa maburol na lupain ng Ephraim ay ang tahanan at libingan ni Thola, isa sa tinatawag na mga menor na hukom: “si Tola na anak ni Pua, na anak ni Dodo, na lalake ng Issachar”, na “tumahan sa Samir sa lupaing maburol ng Ephraim”, naghukom sa Israel nang dalawampu't tatlong taon, “at namatay, at inilibing sa Samir”. Iyon na lamang ang sinasabi ng Bibliya tungkol dito; ang Samir sa maburol na lupain ng Juda, na nakalista kasama ng Jattir at Socho, ay ibang lugar."
    - "Hindi alam kung nasaan ito. Ang burol ng Samaria, Shomron, na kalaunan ay binili ni Omri kay Semer, ay may pangalang magkapareho ang ugat, at inaakala ng ilan na ang Samir ay ang nayon sa burol na iyon bago itinayo ang maharlikang lungsod; nakatagpo ang mga paghuhukay roon ng pasilidad ng langis ng oliba at palayok ng maagang Panahong Bakal sa ilalim ng palasyo ng mga Omrida, kaya tinirhan ang burol noon, ngunit walang nag-uugnay rito kay Thola. Itinuturo ng iba ang Khirbet Samara sa mga burol sa timog ng Nablus, o iniiwang bukás ang tanong; ipinapakita ng mapa ang mga kandidatong ito. Ang dalawang kandidato ay nasa West Bank ngayon."
  da:
    - "Sjamir i Efraims bjerge var hjemsted og gravsted for Tola, en af de såkaldte mindre dommere: »Thola, en Søn af Pua, Dodos Søn, en Mand af Isaskar«, som »boede i Samir paa Efraims Bjerg«, dømte Israel i tre og tyve år, og »han døde og blev begraven i Samir«. Det er alt, Bibelen siger om det; et Sjamir i Judas bjerge, opregnet sammen med Jattir og Soko, er et andet sted."
    - "Hvor det lå, vides ikke. Samarias høj, Shomron, som Omri senere købte af Sjemer, bærer et navn af samme rod, og nogle antager, at Sjamir var landsbyen på den høj, før kongebyen blev bygget; udgravninger dér fandt et olivenolieanlæg og keramik fra tidlig jernalder under omridernes palads, så højen var bebygget da, men intet knytter den til Tola. Andre peger på Khirbet Samara i bjergene syd for Nablus, eller lader spørgsmålet stå åbent; kortet viser disse kandidater. Begge kandidater ligger i dag på Vestbredden."
  sr:
    - "Самир у брдовитој земљи Јефремовој био је дом и место погреба Толе, једног од такозваних мањих судија: „Тола син Фуве сина Додовог, човек племена Исахаровог, који сеђаше у Самиру у гори Јефремовој“, судио је Израиљу двадесет и три године, „па умре и би погребен у Самиру“. То је све што Библија каже о њему; Самир у брдовитој земљи Јудиној, наведен с Јатиром и Сохотом, друго је место."
    - "Где је био, не зна се. Брдо Самарије, Шомрон, које је Амрије касније купио од Семера, носи име истог корена, и неки претпостављају да је Самир било село на том брду пре него што је подигнут краљевски град; ископавања тамо нашла су уређај за маслиново уље и керамику раног гвозденог доба испод Амријеве палате, па је брдо тада било насељено, али ништа га не веже са Толом. Други упућују на Хирбет Самару у брдима јужно од Наблуса или остављају питање отвореним; карта приказује те кандидате. Оба кандидата леже данас на Западној обали."
