# Overview article (ADR 0007). Mainstream facts only; the station is said to be unlocated, the name-based proposal reported as such; the difference between the two itineraries is noted without resolving it.
id: hor-haggidgad
place: a5e36e6
title:
  en: "Hor-haggidgad"
  ru: "Хор-Агидгад"
  uk: "Хор-Гагідгад"
  es: "Hor-hagidgad"
  pt: "Hor-Gidgade"
  de: "Hor-Gidgad"
  fr: "Hor-Guidgad"
  pl: "Chor-ha-Gidgad"
  it: "Cor-Ghidgad"
  nl: "Chor-Haggidgad"
  cs: "Chor-hagidgad"
body:
  en:
    - "Hor-haggidgad was a camping place of Israel on the march from Kadesh toward the Red Sea, named in the list of stations in Numbers: “they removed from Bene-jaakan, and encamped at Hor-hagidgad. And they went from Hor-hagidgad, and pitched in Jotbathah”. Deuteronomy, telling the same stretch of road in a short note on the death of Aaron, calls it Gudgodah: “From thence they journeyed unto Gudgodah; and from Gudgodah to Jotbath, a land of rivers of waters”. The two lists do not agree in the order of the stations before it, Moseroth and Bene-jaakan, and Deuteronomy places Aaron's death at Moserah while Numbers places it on Mount Hor; how the two accounts fit together is debated. Hor means a hole or cave, so the name is “the cave of Gidgad”."
    - "The place has not been found. The stations between Kadesh and Ezion-geber lie somewhere in the mountains of the eastern Sinai or the western Negev and the Arabah, and the name is the only clue: in the nineteenth century travellers matched it with the Wadi Ghadhaghidh, written Khadakhid, in the eastern Sinai, and the map follows that; others, taking Jotbathah to be in the southern Arabah, look for Hor-haggidgad in the Arabah and the Negev, around En Orahot or the spring of Et-Taba. Nothing from Israel's time has been found at any of them."
    - "Eusebius lists Gadgad only as a mountain and a station in the desert. The places in question lie today on both sides of the border between Egypt's Sinai and Israel's Negev and Arabah, desert crossed by a few tracks and the road down to the gulf."
  ru:
    - "Хор-Агидгад был стоянкой Израиля на пути от Кадеса к Чермному морю, названной в перечне станов в книге Чисел: «И отправились из Бене-Яакана и расположились станом в Хор-Агидгаде. И отправились из Хор-Агидгада и расположились станом в Иотвафе». Второзаконие, рассказывая тот же отрезок пути в короткой заметке о смерти Аарона, зовёт его Гудгод: «Оттуда отправились в Гудгод, из Гудгода в Иотвафу, в землю, где потоки вод». Два перечня расходятся в порядке станов перед ним, Мосерофа и Бене-Яакана, и Второзаконие помещает смерть Аарона в Мозере, а книга Чисел — на горе Ор; как согласовать два рассказа, спорят. Хор значит «пещера», так что имя означает «пещера Гидгада»."
    - "Место не найдено. Станы между Кадесом и Ецион-Гавером лежат где-то в горах восточного Синая или западного Негева и Аравы, и имя — единственная подсказка: в XIX веке путешественники сопоставили его с Вади-Гадагид, пишется и Хадахид, в восточном Синае, и карта следует этому; другие, помещая Иотвафу в южной Араве, ищут Хор-Агидгад в Араве и Негеве, у Эйн-Орахота или источника Эт-Таба. Ничего от времён Израиля не найдено ни в одном из этих мест."
    - "Евсевий называет Гадгад только горой и стоянкой в пустыне. Эти места лежат сегодня по обе стороны границы египетского Синая с израильскими Негевом и Аравой, в пустыне, которую пересекают несколько троп и дорога к заливу."
  uk:
    - "Хор-Гагідгад був станом Ізраїлю на марші від Кадеша до Червоного моря, названим у переліку стоянок у Числах: «І рушили з Бене-Яакана та й отаборолись у Гор-Гідгадї. І рушили з Гор-Гідгада та й отаборились у Йотбатї». Повторення Закону, розповідаючи той самий відтинок дороги в короткій примітці про смерть Аарона, називає його Гудгода: «Звідтіля пійшли вони до Гудгода, а від Гудгода у Йотбату країну, де багацько водяних бурчаків». Два переліки не збігаються в порядку станів перед ним, Мосеротом і Бене-Яаканом, а Повторення Закону ставить смерть Аарона в Мосері, тоді як Числа — на горі Гор; як ці дві оповіді узгоджуються, дискутують. Хор означає діру або печеру, тож назва — «печера Гідгада»."
    - "Місце не знайдено. Стани між Кадешем та Еціон-Гевером лежать десь у горах східного Синаю або західного Негеву й Арави, і назва — єдина підказка: у XIX ст. мандрівники зіставили її з Ваді-Гадагід, пишуть Хадахід, у східному Синаї, і карта йде за цим; інші, вважаючи, що Йотвата лежала в південній Араві, шукають Хор-Гагідгад в Араві й Негеві, довкола Ейн-Орахот або джерела Ет-Таба. Нічого з часів Ізраїлю не знайдено в жодному з них."
    - "Євсевій згадує Гадгад лише як гору й стан у пустелі. Ці місця нині лежать по обидва боки кордону між єгипетським Синаєм та ізраїльським Негевом і Аравою, пустеля, яку перетинає кілька стежок та дорога до затоки."
  es:
    - "Hor-hagidgad fue un lugar de campamento de Israel en la marcha de Cades hacia el mar Rojo, nombrado en la lista de estaciones de Números: «Y partidos de Bene-jaacán, asentaron en el monte de Gidgad. Y partidos del monte de Gidgad, asentaron en Jotbatha». El Deuteronomio, al contar el mismo tramo del camino en una breve nota sobre la muerte de Aarón, lo llama Gudgoda: «De allí partieron á Gudgod, y de Gudgod á Jotbath, tierra de arroyos de aguas». Las dos listas no concuerdan en el orden de las estaciones anteriores, Moserot y Bene-jaacán, y el Deuteronomio sitúa la muerte de Aarón en Moserá mientras que Números la sitúa en el monte Hor; cómo encajan los dos relatos es discutido. Hor significa agujero o cueva, de modo que el nombre es «la cueva de Gidgad»."
    - "El lugar no se ha hallado. Las estaciones entre Cades y Ezión-geber están en algún punto de las montañas del Sinaí oriental o del Néguev occidental y el Arabá, y el nombre es la única pista: en el siglo XIX los viajeros lo identificaron con el Wadi Ghadhaghidh, escrito Khadakhid, en el Sinaí oriental, y el mapa lo sigue; otros, tomando Jotbata por situada en el sur del Arabá, buscan Hor-hagidgad en el Arabá y el Néguev, en torno a En Orahot o a la fuente de Et-Taba. Nada de la época de Israel se ha hallado en ninguno de ellos."
    - "Eusebio enumera Gadgad solo como un monte y una estación en el desierto. Los lugares en cuestión se hallan hoy a ambos lados de la frontera entre el Sinaí egipcio y el Néguev y el Arabá israelíes, un desierto cruzado por unas pocas pistas y por la carretera que baja al golfo."
  pt:
    - "Hor-Gidgade foi um pouso de Israel na marcha de Cades rumo ao mar Vermelho, nomeado na lista de estações em Números: “Partiram de Bene-Jaacã e acamparam em Hor-Hagidgade. Partiram de Hor-Hagidgade e acamparam em Jotbatá”. Deuteronômio, narrando o mesmo trecho da estrada numa breve nota sobre a morte de Arão, a chama Gudgoda: “De lá viajaram para Gudgoda; e de Gudgoda para Jotbatá, uma terra de ribeiros de água”. As duas listas não concordam na ordem das estações anteriores, Moserote e Bene-Jaacã, e Deuteronômio põe a morte de Arão em Moserá, enquanto Números a põe no monte Hor; como os dois relatos se ajustam é debatido. Hor significa buraco ou caverna, de modo que o nome é “a caverna de Gidgad”."
    - "O lugar não foi encontrado. As estações entre Cades e Eziom-Geber ficam em algum ponto das montanhas do Sinai oriental ou do Neguebe ocidental e da Arabá, e o nome é a única pista: no século XIX viajantes o igualaram ao uádi Ghadhaghidh, escrito Khadakhid, no Sinai oriental, e o mapa segue isso; outros, tomando Jotbatá como situada na Arabá meridional, procuram Hor-Gidgade na Arabá e no Neguebe, em torno de En Orahot ou da fonte de Et-Taba. Nada do tempo de Israel foi achado em nenhum deles."
    - "Eusébio lista Gadgad apenas como um monte e uma estação no deserto. Os lugares em questão ficam hoje dos dois lados da fronteira entre o Sinai do Egito e o Neguebe e a Arabá de Israel, deserto atravessado por poucas trilhas e pela estrada que desce ao golfo."
  de:
    - "Hor-Gidgad war ein Lagerplatz Israels auf dem Zug von Kadesch zum Roten Meer, in der Stationenliste im vierten Buch Mose genannt: „Von Bne-Jaakan zogen sie aus und lagerten sich in Horgidgad. Von Horgidgad zogen sie aus und lagerten sich in Jotbatha.“ Das fünfte Buch Mose, das dieselbe Wegstrecke in einer kurzen Notiz zum Tod Aarons erzählt, nennt es Gudgoda: „Von da zogen sie aus gen Gudegoda, von Gugegoda gen Jotbatha, ein Land, da Bäche sind.“ Die beiden Listen stimmen in der Reihenfolge der vorhergehenden Stationen, Moserot und Bne-Jaakan, nicht überein, und das fünfte Buch Mose verlegt Aarons Tod nach Mosera, das vierte auf den Berg Hor; wie beide Berichte zusammenpassen, ist umstritten. Hor bedeutet ein Loch oder eine Höhle, der Name also „die Höhle des Gidgad“."
    - "Der Ort ist nicht gefunden. Die Stationen zwischen Kadesch und Ezjon-Geber liegen irgendwo im Gebirge des östlichen Sinai oder des westlichen Negev und der Araba, und der Name ist der einzige Anhaltspunkt: Im 19. Jahrhundert verglichen Reisende ihn mit dem Wadi Ghadhaghidh, auch Chadachid geschrieben, im östlichen Sinai, und die Karte folgt dem; andere, die Jotbata im südlichen Araba ansetzen, suchen Hor-Gidgad in der Araba und im Negev, um En Orahot oder die Quelle Et-Taba. An keinem davon wurde etwas aus Israels Zeit gefunden."
    - "Eusebius führt Gadgad nur als Berg und Station in der Wüste auf. Die infrage kommenden Orte liegen heute beiderseits der Grenze zwischen dem ägyptischen Sinai und Israels Negev und Araba, Wüste, die von wenigen Pisten und der Straße zum Golf durchzogen wird."
  fr:
    - "Hor-Guidgad était un lieu de campement d’Israël en marche de Qadesh vers la mer Rouge, nommé dans la liste des étapes des Nombres : « Ils partirent de Bené-Jaakan, et campèrent à Hor-Guidgad. Ils partirent de Hor-Guidgad, et campèrent à Jothbatha. » Le Deutéronome, racontant le même tronçon de route dans une brève note sur la mort d’Aaron, l’appelle Gudgoda : « Ils partirent de là pour Gudgoda, et de Gudgoda pour Jothbatha, pays où il y a des cours d’eaux. » Les deux listes ne s’accordent pas sur l’ordre des étapes précédentes, Moséroth et Bené-Jaakan, et le Deutéronome place la mort d’Aaron à Moséra tandis que les Nombres la placent sur le mont Hor ; l’accord des deux récits est débattu. Hor signifie un trou ou une caverne, de sorte que le nom est « la caverne de Guidgad »."
    - "Le lieu n’a pas été retrouvé. Les étapes entre Qadesh et Etsjon-Guéber se situent quelque part dans les montagnes du Sinaï oriental ou du Négev occidental et dans l’Araba, et le nom est le seul indice : au XIXe siècle, des voyageurs le rapprochèrent de l’oued Ghadhaghidh, écrit Khadakhid, dans le Sinaï oriental, et la carte le suit ; d’autres, prenant Jothbatha pour située dans le sud de l’Araba, cherchent Hor-Guidgad dans l’Araba et le Négev, autour d’En Orahot ou de la source d’Et-Taba. Rien du temps d’Israël n’a été trouvé en aucun de ces lieux."
    - "Eusèbe ne mentionne Gadgad que comme une montagne et une étape dans le désert. Les lieux en question se trouvent aujourd’hui des deux côtés de la frontière entre le Sinaï égyptien et le Négev et l’Araba israéliens, désert traversé par quelques pistes et la route qui descend au golfe."
  pl:
    - "Chor-ha-Gidgad było miejscem obozowania Izraela w marszu z Kadesz ku Morzu Czerwonemu, wymienionym w wykazie stacji w Księdze Liczb: „A ruszywszy się z Benejaakan, położyli się obozem w Horgidgad. A ruszywszy się z Horgidgad, położyli się obozem u Jotbata”. Księga Powtórzonego Prawa, opowiadając ten sam odcinek drogi w krótkiej notatce o śmierci Aarona, nazywa je Gadgad: „Stamtąd się ruszyli do Gadgad, a z Gadgad do Jotbata, do ziemi ciekących wód”. Oba wykazy nie zgadzają się w kolejności stacji przed nim, Moserot i Bene-Jaakan, a Księga Powtórzonego Prawa umieszcza śmierć Aarona w Moserze, podczas gdy Księga Liczb na górze Hor; jak oba opisy do siebie pasują, jest sporne. Hor znaczy dziurę lub jaskinię, więc nazwa brzmi „jaskinia Gidgad”."
    - "Miejsca nie odnaleziono. Stacje między Kadesz a Esjon-Geber leżą gdzieś w górach wschodniego Synaju lub zachodniego Negewu i Arabie, a jedyną wskazówką jest nazwa: w XIX w. podróżnicy zestawili ją z Wadi Ghadhaghidh, pisanym Chadachid, we wschodnim Synaju, i mapa idzie za tym; inni, uważając Jotbatę za leżącą w południowej Arabie, szukają Chor-ha-Gidgad w Arabie i Negewie, koło En Orachot lub źródła et-Taba. Nic z czasów Izraela nie znaleziono w żadnym z nich."
    - "Euzebiusz wymienia Gadgad tylko jako górę i stację na pustyni. Omawiane miejsca leżą dziś po obu stronach granicy między egipskim Synajem a izraelskim Negewem i Arabą, na pustyni przeciętej kilkoma szlakami i drogą w dół do zatoki."
  it:
    - "Cor-Ghidgad era un accampamento d’Israele sulla marcia da Kades verso il Mar Rosso, nominato nell’elenco delle tappe nei Numeri: «Partirono da Bene-Jaakan e si accamparono a Hor-Ghidgad. Partirono da Hor-Ghidgad e si accamparono a Jotbathah». Il Deuteronomio, narrando lo stesso tratto di strada in una breve nota sulla morte di Aronne, lo chiama Gudgoda: «Di là partirono alla volta di Gudgoda; e da Gudgoda alla volta di Jotbatha, paese di corsi d’acqua». I due elenchi non concordano sull’ordine delle tappe che lo precedono, Moserot e Bene-Iaakan, e il Deuteronomio pone la morte di Aronne a Mosera mentre i Numeri la pongono sul Monte Or; come i due racconti si accordino è discusso. Cor significa buco o grotta, perciò il nome è «la grotta di Gidgad»."
    - "Il luogo non è stato trovato. Le tappe fra Kades ed Ezion-Gheber si trovano da qualche parte sui monti del Sinai orientale o del Negheb occidentale e dell’Araba, e il nome è l’unico indizio: nell’Ottocento i viaggiatori lo accostarono al Wadi Ghadhaghidh, scritto Khadakhid, nel Sinai orientale, e la mappa segue questa identificazione; altri, ritenendo Iotbata nell’Araba meridionale, cercano Cor-Ghidgad nell’Araba e nel Negheb, intorno a En Orahot o alla sorgente di Et-Taba. Nulla del tempo d’Israele è stato trovato in alcuno di questi luoghi."
    - "Eusebio elenca Gadgad solo come monte e tappa nel deserto. I luoghi in questione si trovano oggi su entrambi i lati del confine fra il Sinai egiziano e il Negheb e l’Araba israeliani, deserto attraversato da pochi sentieri e dalla strada che scende al golfo."
  nl:
    - "Chor-Haggidgad was een legerplaats van Israël op de tocht van Kades naar de Rode Zee, genoemd in de lijst van haltes in Numeri: “En zij verreisden van Bene-Jaakan, en legerden zich in Hor-Gidgad. En zij verreisden van Hor-gidgad, en legerden zich in Jotbatha”. Deuteronomium, dat hetzelfde stuk weg vertelt in een korte aantekening over de dood van Aäron, noemt het Gudgod: “Van daar reisden zij naar Gudgod, en van Gudgod naar Jotbath, een land van waterbeken”. De twee lijsten verschillen in de volgorde van de haltes ervoor, Moserot en Bene-Jaäkan, en Deuteronomium plaatst Aärons dood te Mosera terwijl Numeri die op de berg Hor plaatst; hoe beide verhalen samenhangen, wordt besproken. Hor betekent gat of grot, dus de naam is “de grot van Gidgad”."
    - "De plaats is niet gevonden. De haltes tussen Kades en Ezeon-Geber liggen ergens in het gebergte van het oostelijke Sinaï of de westelijke Negev en de Araba, en de naam is de enige aanwijzing: in de 19e eeuw brachten reizigers hem in verband met de Wadi Ghadhaghidh, geschreven Khadakhid, in het oostelijke Sinaï, en de kaart volgt dat; anderen, die Jotbata in de zuidelijke Araba plaatsen, zoeken Chor-Haggidgad in de Araba en de Negev, rond En Orahot of de bron van Et-Taba. Op geen van deze is iets uit Israëls tijd gevonden."
    - "Eusebius noemt Gadgad alleen als berg en halte in de woestijn. De bedoelde plaatsen liggen nu aan weerszijden van de grens tussen het Egyptische Sinaï en de Israëlische Negev en Araba, woestijn doorkruist door enkele paden en de weg naar de golf."
  cs:
    - "Chor-hagidgad bylo tábořiště Izraele na pochodu z Kádeše k Rudému moři, jmenované v seznamu stanic v Numeri: „A hnuvše se z Benejakan, položili se v Chor Gidgad. A hnuvše se z Chor Gidgad, položili se v Jotbata.“ Deuteronomium, líčící týž úsek cesty v krátké poznámce o Áronově smrti, jej nazývá Gudgoda: „Odtud táhli do Gadgad, a z Gadgad do Jotbata, do země vod tekutých.“ Oba seznamy se neshodují v pořadí stanic před ním, Moserótu a Bené-jaakan, a Deuteronomium klade Áronovu smrt do Moserá, kdežto Numeri na horu Hor; jak se obě vyprávění slučují, je sporné. Chor znamená díru nebo jeskyni, takže jméno je „jeskyně Gidgad“."
    - "Místo nebylo nalezeno. Stanice mezi Kádešem a Ecjon-geberem leží někde v horách východního Sinaje nebo západního Negevu a Arabě a jméno je jedinou stopou: v 19. století je cestovatelé spojili s Wádí Ghadhaghidh, psaným Khadakhid, ve východním Sinaji, a mapa to následuje; jiní, kdo kladou Jotbatu do jižní Araby, hledají Chor-hagidgad v Arabě a Negevu, kolem En Orahot nebo pramene Et-Taba. Na žádném z nich nebylo nalezeno nic z Izraelovy doby."
    - "Eusebios uvádí Gadgad jen jako horu a stanici na poušti. Dotčená místa leží dnes po obou stranách hranice mezi egyptským Sinajem a izraelským Negevem a Arabou, v poušti křížené několika stezkami a cestou dolů k zálivu."
scripture:
  - Num.33.32-Num.33.33
  - Deut.10.6-Deut.10.7
