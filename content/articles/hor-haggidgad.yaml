# Overview article (ADR 0007). Mainstream facts only; the station is said to be unlocated, the name-based proposal reported as such; the difference between the two itineraries is noted without resolving it.
id: hor-haggidgad
place: a5e36e6
title:
  en: "Hor-haggidgad"
  ru: "Хор-Агидгад"
  uk: "Хор-Гагідгад"
