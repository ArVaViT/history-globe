body:
  en:
    - "Holon was a town in the hill country of Judah, named in the district whose chief town was Debir: “Goshen, and Holon, and Giloh; eleven cities with their villages”. It was one of the cities given to the priests, the sons of Aaron: “Holon with her suburbs, and Debir with her suburbs”, where the Chronicler's copy of the list reads Hilen. The Holon of Jeremiah's oracle on Moab, on the plateau east of the Dead Sea, is a different place. Nothing else is told of the town."
    - "Its site is not known. The usual proposal is Khirbet Alin, a ruin west of Beit Ummar some 15 km north-north-west of Hebron, on the strength of the name; but Joshua's list sets Holon with Debir, Goshen and Giloh in the hills south-west of Hebron, and the second candidate on the map, Khirbet Bism, lies in that country. Neither has been excavated with Holon in view."
    - "Both candidates lie today in the Hebron governorate of the West Bank, among the terraced vineyards and orchards of the Judean hills, Khirbet Alin in the hills west of Beit Ummar."
  ru:
    - "Холон был городом в горах Иуды, названным в округе, главным городом которого был Давир: «Гошен, Холон и Гило: одиннадцать городов с их селами». Он был одним из городов, отданных священникам, сынам Аарона: «Холон и предместья его, Давир и предместья его», где список летописца читает Хилен. Халон из пророчества Иеремии о Моаве, на плоскогорье к востоку от Мёртвого моря, — другое место. Больше о городе не рассказано ничего."
    - "Место его не известно. Обычное предложение — Хирбет-Алин, развалины к западу от Бейт-Уммара примерно в 15 км к северо-северо-западу от Хеврона, по созвучию имени; но список Иисуса Навина ставит Холон вместе с Давиром, Гошеном и Гило в горах к юго-западу от Хеврона, и второй кандидат на карте, Хирбет-Бисм, лежит в тех краях. Ни одно место не раскапывали ради Холона."
    - "Оба кандидата лежат сегодня в Хевронской мухафазе Западного берега, среди террасных виноградников и садов Иудейских гор, Хирбет-Алин — в холмах к западу от Бейт-Уммара."
  uk:
    - "Холон було містом у гірській країні Юди, названим в окрузі, головним містом якої був Девір: «Гозен, Холон та Гило — одинайцять городів з їх селами». Це було одне з міст, даних священикам, синам Аарона: «Холон вкупі з пасовищами його, Дабир вкупі з пасовищами його», де в копії переліку в Хроніках стоїть Хілен. Холон з оракула Єремії про Моав, на плато на схід від Мертвого моря, — інше місце. Більше нічого про місто не розповідається."
    - "Його місце невідоме. Звичайна пропозиція — Хірбет-Алін, руїна на захід від Бейт-Уммара приблизно за 15 км на північ-північний захід від Хеврона, на підставі назви; але перелік у Книзі Ісуса Навина ставить Холон з Девіром, Гошеном і Гіло в пагорбах на південний захід від Хеврона, і другий кандидат на карті, Хірбет-Бісм, лежить у тому краї. Жодного не розкопували з огляду на Холон."
    - "Обидва кандидати лежать нині в Хевронському окрузі Західного берега, серед терасованих виноградників і садів юдейських пагорбів, Хірбет-Алін — у пагорбах на захід від Бейт-Уммара."
  es:
    - "Holón era una población de la región montañosa de Judá, nombrada en el distrito cuya ciudad principal era Debir: «Gosén, y Olón, y Gilo; once ciudades con sus aldeas». Fue una de las ciudades dadas a los sacerdotes, hijos de Aarón: «A Helón con sus ejidos, y á Debir con sus ejidos», donde la copia de la lista del Cronista lee Hilem. El Holón del oráculo de Jeremías sobre Moab, en la meseta al este del mar Muerto, es un lugar distinto. No se cuenta nada más de la población."
    - "Su sitio no se conoce. La propuesta habitual es Khirbet Alin, una ruina al oeste de Beit Ummar, a unos 15 km al nornoroeste de Hebrón, por el nombre; pero la lista de Josué sitúa Holón con Debir, Gosén y Gilo en las colinas al suroeste de Hebrón, y el segundo candidato del mapa, Khirbet Bism, se halla en esa comarca. Ninguno se ha excavado con Holón en mente."
    - "Ambos candidatos se hallan hoy en la gobernación de Hebrón, en Cisjordania, entre los viñedos y huertos en terrazas de las colinas de Judea, Khirbet Alin en las colinas al oeste de Beit Ummar."
  pt:
    - "Holom era uma cidade na região montanhosa de Judá, nomeada no distrito cuja principal cidade era Debir: “Gósen, Holom e Gilo; onze cidades com as suas aldeias”. Foi uma das cidades dadas aos sacerdotes, filhos de Arão: “Holom com suas pastagens, Debir com suas pastagens”, onde a cópia da lista do cronista lê Hilém. A Holom do oráculo de Jeremias sobre Moabe, no planalto a leste do mar Morto, é um lugar diferente. Nada mais se conta da cidade."
    - "Seu sítio não é conhecido. A proposta usual é Khirbet Alin, uma ruína a oeste de Beit Ummar, a cerca de 15 km a nor-noroeste de Hebrom, pela força do nome; mas a lista de Josué põe Holom com Debir, Gósen e Gilo nas colinas a sudoeste de Hebrom, e o segundo candidato do mapa, Khirbet Bism, fica nessa região. Nenhum foi escavado com Holom em vista."
    - "Ambos os candidatos ficam hoje na província de Hebrom, na Cisjordânia, entre os vinhedos e pomares em terraços das colinas da Judeia, Khirbet Alin nas colinas a oeste de Beit Ummar."
  de:
    - "Holon war eine Stadt im Bergland Judas, im Bezirk genannt, dessen Hauptstadt Debir war: „Gosen, Holon, Gilo. Das sind elf Städte und ihre Dörfer.“ Sie war eine der Städte, die den Priestern, den Söhnen Aarons, gegeben wurden: „Holon und seine Vorstädte, Debir und seine Vorstädte“, wo die Abschrift der Liste beim Chronisten Hilen liest. Das Holon in Jeremias Orakel über Moab, auf der Hochebene östlich des Toten Meeres, ist ein anderer Ort. Sonst wird von der Stadt nichts erzählt."
    - "Ihre Lage ist unbekannt. Der übliche Vorschlag ist wegen des Namens Chirbet Alin, eine Ruine westlich von Beit Ummar, etwa 15 km nord-nordwestlich von Hebron; doch Josuas Liste stellt Holon mit Debir, Goschen und Gilo ins Bergland südwestlich von Hebron, und der zweite Kandidat auf der Karte, Chirbet Bism, liegt in dieser Gegend. Keiner ist im Blick auf Holon ausgegraben worden."
    - "Beide Kandidaten liegen heute im Gouvernement Hebron des Westjordanlands, zwischen den Terrassenweinbergen und Obstgärten der judäischen Berge, Chirbet Alin im Bergland westlich von Beit Ummar."
  fr:
    - "Holon était une ville de la montagne de Juda, nommée dans le district dont Debir était la ville principale : « Gosen, Holon, et Guilo, onze villes, et leurs villages ». Elle fut l’une des villes données aux prêtres, fils d’Aaron : « Holon et sa banlieue, Debir et sa banlieue », où la copie de la liste par le Chroniqueur lit Hilen. Le Holon de l’oracle de Jérémie sur Moab, sur le plateau à l’est de la mer Morte, est un autre lieu. On ne raconte rien d’autre de la ville."
    - "Son site n’est pas connu. La proposition habituelle est Khirbet Alin, une ruine à l’ouest de Beit Ummar, à quelque 15 km au nord-nord-ouest d’Hébron, d’après le nom ; mais la liste de Josué place Holon avec Debir, Gosen et Guilo dans les collines au sud-ouest d’Hébron, et le second candidat de la carte, Khirbet Bism, se trouve dans cette région. Aucun des deux n’a été fouillé en vue de Holon."
    - "Les deux candidats se trouvent aujourd’hui dans le gouvernorat d’Hébron, en Cisjordanie, parmi les vignobles et les vergers en terrasses des collines de Judée, Khirbet Alin dans les collines à l’ouest de Beit Ummar."
  pl:
    - "Cholon było miastem w górach Judy, wymienionym w okręgu, którego głównym miastem był Debir: „Gosen, i Holon, i Gilo, miast jedenaście, i wsi ich”. Było jednym z miast oddanych kapłanom, synom Aarona: „Helon, i przedmieścia jego, i Dabir, i przedmieścia jego”, gdzie kopia wykazu u Kronikarza czyta Chilen. Cholon z orędzia Jeremiasza o Moabie, na płaskowyżu na wschód od Morza Martwego, to inne miejsce. Nic więcej o mieście nie opowiedziano."
    - "Jego położenie nie jest znane. Zwykła propozycja to Chirbet Alin, ruina na zachód od Bajt Ummar około 15 km na północ-północny zachód od Hebronu, na podstawie nazwy; ale wykaz Jozuego umieszcza Cholon z Debirem, Goszen i Gilo we wzgórzach na południowy zachód od Hebronu, i drugi kandydat na mapie, Chirbet Bism, leży w tej okolicy. Żaden nie był badany z myślą o Cholonie."
    - "Obaj kandydaci leżą dziś w muhafazie Hebron na Zachodnim Brzegu, wśród tarasowych winnic i sadów gór judzkich, Chirbet Alin we wzgórzach na zachód od Bajt Ummar."
  it:
    - "Colon era una città sui monti di Giuda, nominata nel distretto la cui città principale era Debir: «Goscen, Holon e Ghilo: undici città e i loro villaggi». Fu una delle città date ai sacerdoti, figli di Aronne: «Holon e il suo contado, Debir e il suo contado», dove la copia dell’elenco del Cronista legge Hilen. La Colon dell’oracolo di Geremia su Moab, sull’altopiano a est del Mar Morto, è un luogo diverso. Nulla d’altro si racconta della città."
    - "Il suo sito non è noto. La proposta consueta è Khirbet Alin, una rovina a ovest di Beit Ummar circa 15 km a nord-nord-ovest di Ebron, in base al nome; ma l’elenco di Giosuè pone Colon con Debir, Gosen e Gilo sulle colline a sud-ovest di Ebron, e il secondo candidato sulla mappa, Khirbet Bism, si trova in quella zona. Nessuno dei due è stato scavato con Colon in vista."
    - "Entrambi i candidati si trovano oggi nel governatorato di Ebron in Cisgiordania, fra i vigneti e i frutteti a terrazze dei colli di Giuda, Khirbet Alin sulle colline a ovest di Beit Ummar."
  nl:
    - "Cholon was een stad in het bergland van Juda, genoemd in het district waarvan Debir de hoofdstad was: “Gosen, en Holon, en Gilo; elf steden en haar dorpen”. Het was een van de steden die aan de priesters, de zonen van Aäron, werden gegeven: “Holon en haar voorsteden, en Debir en haar voorsteden”, waar de kopie van de lijst bij de kroniekschrijver Hilen leest. Het Cholon uit Jeremia’s godsspraak over Moab, op het plateau ten oosten van de Dode Zee, is een andere plaats. Verder wordt van de stad niets verteld."
    - "De plaats is onbekend. Het gebruikelijke voorstel is Khirbet Alin, een ruïne ten westen van Beit Ummar, zo’n 15 km noordnoordwestelijk van Hebron, op grond van de naam; maar Jozua’s lijst zet Cholon met Debir, Gosen en Gilo in het bergland ten zuidwesten van Hebron, en de tweede kandidaat op de kaart, Khirbet Bism, ligt in die streek. Geen van beide is opgegraven met Cholon voor ogen."
    - "Beide kandidaten liggen nu in het gouvernement Hebron op de Westoever, tussen de terrassen met wijngaarden en boomgaarden van het Judese bergland, Khirbet Alin in de heuvels ten westen van Beit Ummar."
  cs:
    - "Cholon bylo město v judské pahorkatině, jmenované v okrese, jehož hlavním městem byl Debír: „Gosen, Holon a Gilo, měst jedenácte i vsi jejich“. Bylo jedním z měst daných kněžím, synům Áronovým: „Holon i předměstí jeho, a Dabir s podměstím jeho“, kde kronikářův opis seznamu čte Chilen. Cholon z Jeremjášova výroku o Moábu, na náhorní plošině východně od Mrtvého moře, je jiné místo. Nic dalšího se o městě nevypráví."
    - "Jeho poloha není známa. Obvyklým návrhem je Chirbet Alin, zřícenina západně od Bejt Ummar asi 15 km severoseverozápadně od Hebronu, podle jména; ale Jozuův seznam klade Cholon s Debírem, Gošenem a Gilem do hor jihozápadně od Hebronu a druhý kandidát na mapě, Chirbet Bism, leží v tomto kraji. Žádný nebyl vykopáván s ohledem na Cholon."
    - "Oba kandidáti leží dnes v hebronské gubernii Západního břehu, mezi terasovitými vinicemi a sady judských hor, Chirbet Alin v horách západně od Bejt Ummar."
