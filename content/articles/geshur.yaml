# Overview article (ADR 0007). Mainstream facts only; the identification of Bethsaida (et-Tell) as the capital is given as the excavators' view.
id: geshur
place: af6c325
title:
  en: "Geshur"
  ru: "Гессур"
body:
  en:
    - "Geshur was a small kingdom east and north-east of the Sea of Galilee, on the southern slopes of the Golan between Bashan and the lake, with Maacah as its neighbour to the north. Joshua names “the border of the Geshurites and the Maachathites” as the limit of Og's kingdom and admits that Israel “expelled not the Geshurites, nor the Maachathites”, who lived among the Israelites “until this day”. Its people were probably Aramean, or close to the Arameans; the Bible calls it “Geshur in Syria”. The Geshurites of the south near the Philistines, raided by David from Ziklag, are a different people with the same name."
    - "The kingdom matters in the story of David. He married “Maacah the daughter of Talmai king of Geshur”, and she bore him Absalom and Tamar. After Absalom had Amnon killed he “fled, and went to Talmai, the son of Ammihud, king of Geshur”, and stayed three years until Joab brought him back; he later complained, “Wherefore am I come from Geshur? it had been good for me to have been there still”, and claimed a vow made “while I abode at Geshur in Syria” as his excuse to go to Hebron. In the Hebrew of Chronicles, Geshur and Aram took the towns of Jair and Kenath, sixty towns, from the sons of Machir, perhaps a sign that the kingdom later grew at Israel's expense."
    - "Excavations since 1987 at et-Tell, the mound at the mouth of the Jordan usually identified with New Testament Bethsaida, uncovered a large Iron Age city with a massive gate, in whose chamber stood a stele of a bull-headed god with a sword; the excavators take it for the capital of Geshur. The city was destroyed in the Assyrian conquest of 732 BC, and Geshur is not heard of again. The region today is the southern Golan Heights, held by Israel since 1967, with et-Tell in the Jordan River Park above the lake."
  ru:
    - "Гессур — небольшое царство к востоку и северо-востоку от Галилейского моря, на южных склонах Голана между Васаном и озером; его северным соседом была Мааха. Книга Иисуса Навина доводит царство Ога «до предела Гессурского и Маахского» и признаёт, что сыны Израилевы «не выгнали жителей Гессура и Маахи», которые живут среди Израиля «до сего дня». Его жители, вероятно, были Арамеями или близким им народом; Библия говорит о «Гессуре в Сирии». Гессуряне на юге, близ Филистимлян, на которых Давид нападал из Секелага, — другой народ с тем же именем."
    - "Царство важно в истории Давида. Он женился на Маахе, «дочери Фалмая, царя Гессурского», и она родила ему Авессалома и Фамарь. После того как Авессалом велел убить Амнона, он «убежал и пошел к Фалмаю, сыну Емиуда, царю Гессурскому» и пробыл там три года, пока Иоав не привёл его назад; позже он жаловался: «зачем я пришел из Гессура? Лучше было бы мне оставаться там», а обет, данный, «живя в Гессуре в Сирии», стал его предлогом уйти в Хеврон. Книга Паралипоменон записывает, что «Гессуряне и Сирияне» взяли у сыновей Махира селения Иаира и Кенаф, шестьдесят городов, — быть может, знак того, что царство позже росло за счёт Израиля."
    - "Раскопки, ведущиеся с 1987 г. на Эт-Телле, холме у впадения Иордана в озеро, который обычно отождествляют с новозаветной Вифсаидой, открыли большой город железного века с мощными воротами; в их камере стояла стела бога с головой быка и мечом. Раскопщики считают город столицей Гессура. Он погиб при ассирийском завоевании 732 г. до н. э., и больше о Гессуре не слышно. Сегодня это южные Голанские высоты, занятые Израилем с 1967 г.; Эт-Телль лежит в парке реки Иордан над озером."
