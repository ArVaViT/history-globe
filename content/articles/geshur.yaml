# Overview article (ADR 0007). Mainstream facts only; the identification of Bethsaida (et-Tell) as the capital is given as the excavators' view.
id: geshur
place: af6c325
title:
  en: "Geshur"
  ru: "Гессур"
  uk: "Гешур"
  es: "Gesur"
  pt: "Gesur"
  de: "Geschur"
  fr: "Gueschur"
  pl: "Geszur"
  it: "Ghesur"
  nl: "Gesur"
  cs: "Gešur"
body:
  en:
    - "Geshur was a small kingdom east and north-east of the Sea of Galilee, on the southern slopes of the Golan between Bashan and the lake, with Maacah as its neighbour to the north. Joshua names “the border of the Geshurites and the Maachathites” as the limit of Og's kingdom and admits that Israel “expelled not the Geshurites, nor the Maachathites”, who lived among the Israelites “until this day”. Its people were probably Aramean, or close to the Arameans; the Bible calls it “Geshur in Syria”. The Geshurites of the south near the Philistines, raided by David from Ziklag, are a different people with the same name."
    - "The kingdom matters in the story of David. He married “Maacah the daughter of Talmai king of Geshur”, and she bore him Absalom and Tamar. After Absalom had Amnon killed he “fled, and went to Talmai, the son of Ammihud, king of Geshur”, and stayed three years until Joab brought him back; he later complained, “Wherefore am I come from Geshur? it had been good for me to have been there still”, and claimed a vow made “while I abode at Geshur in Syria” as his excuse to go to Hebron. In the Hebrew of Chronicles, Geshur and Aram took the towns of Jair and Kenath, sixty towns, from the sons of Machir, perhaps a sign that the kingdom later grew at Israel's expense."
    - "Excavations since 1987 at et-Tell, the mound near the mouth of the Jordan long identified with New Testament Bethsaida (el-Araj, nearer the shore, is now a strong rival), uncovered a large Iron Age city with a massive gate, beside which stood a stele of a bull-headed god with a dagger; the excavators take it for the capital of Geshur. The city was destroyed in the Assyrian conquest of 732 BC, and Geshur is not heard of again. The region today is the southern Golan Heights, held by Israel since 1967, with et-Tell in the Jordan River Park above the lake."
  ru:
    - "Гессур — небольшое царство к востоку и северо-востоку от Галилейского моря, на южных склонах Голана между Васаном и озером; его северным соседом была Мааха. Книга Иисуса Навина доводит царство Ога «до предела Гессурского и Маахского» и признаёт, что сыны Израилевы «не выгнали жителей Гессура и Маахи», которые живут среди Израиля «до сего дня». Его жители, вероятно, были Арамеями или близким им народом; Библия говорит о «Гессуре в Сирии». Гессуряне на юге, близ Филистимлян, на которых Давид нападал из Секелага, — другой народ с тем же именем."
    - "Царство важно в истории Давида. Он женился на Маахе, «дочери Фалмая, царя Гессурского», и она родила ему Авессалома и Фамарь. После того как Авессалом велел убить Амнона, он «убежал и пошел к Фалмаю, сыну Емиуда, царю Гессурскому» и пробыл там три года, пока Иоав не привёл его назад; позже он жаловался: «зачем я пришел из Гессура? Лучше было бы мне оставаться там», а обет, данный, «живя в Гессуре в Сирии», стал его предлогом уйти в Хеврон. Книга Паралипоменон записывает, что «Гессуряне и Сирияне» взяли у сыновей Махира селения Иаира и Кенаф, шестьдесят городов, — быть может, знак того, что царство позже росло за счёт Израиля."
    - "Раскопки, ведущиеся с 1987 г. на Эт-Телле, холме близ впадения Иордана в озеро, который давно отождествляют с новозаветной Вифсаидой (сильным соперником ему теперь стал Эль-Арадж, ближе к берегу), открыли большой город железного века с мощными воротами; рядом с ними стояла стела бога с головой быка и кинжалом. Раскопщики считают город столицей Гессура. Он погиб при ассирийском завоевании 732 г. до н. э., и больше о Гессуре не слышно. Сегодня это южные Голанские высоты, занятые Израилем с 1967 г.; Эт-Телль лежит в парке реки Иордан над озером."
  uk:
    - "Гешур було невеликим царством на схід і північний схід від Галілейського моря, на південних схилах Голану між Башаном і озером, із сусідньою Маахою на півночі. Книга Ісуса Навина доводить царство Ога «до гряницї Гессурійської і Маахійської» й визнає, що сини Ізраїлеві «не прогнали Гесуріїв нї Маахів», які залишилися серед ізраїльтян «по сей день». Його народ був, імовірно, арамейським або близьким до арамеїв; Біблія називає його Гешуром у Сирії. Гешурійці півдня поблизу філістимлян, на яких нападав Давид із Ціклага, — інший народ із тією самою назвою."
    - "Це царство важливе в історії Давида. Він одружився з Маахою, дочкою Фалмая, царя Гешуру, і вона народила йому Авесалома й Тамар. Після того як Авесалом звелів убити Амнона, він «втїк і пійшов до Талмая Емиюденка, царя Гессурського» і прожив там три роки, доки Йоав не привів його назад; пізніше він нарікав: «за чим я вернувсь із Гессуру? Лучче було б менї пробувати там і далїй», а обітницю, дану, «пробуваючи в Гессурі в Сириї», назвав приводом піти до Хеврона. У давньоєврейському тексті Хронік Гешур і Арам забрали в синів Махіра міста Яіра й Кенат, шістдесят міст, що, можливо, свідчить: пізніше царство зросло коштом Ізраїлю."
    - "Розкопки від 1987 року в ет-Телль, на городищі поблизу гирла Йордану, яке давно ототожнюють із новозавітною Віфсаїдою (ель-Арадж, ближче до берега, тепер є сильним суперником), відкрили велике місто залізного віку з масивною брамою, біля якої стояла стела бикоголового бога з кинджалом; розкопувачі вважають його столицею Гешуру. Місто було зруйноване під час ассирійського завоювання 732 р. до н. е., і про Гешур більше не чути. Нині цей край — південні Голанські висоти, якими Ізраїль володіє від 1967 року, з ет-Теллем у парку «Йордан» над озером."
  es:
    - "Gesur era un pequeño reino al este y nordeste del mar de Galilea, en las laderas meridionales del Golán entre Basán y el lago, con Maaca como vecino al norte. Josué nombra «los términos de Gessuri y de Maachâti» como límite del reino de Og y reconoce que Israel no echó «á los de Gessuri y Maachâti», que habitaron entre los israelitas «hasta hoy». Su pueblo era probablemente arameo, o cercano a los arameos; la Biblia la llama «Gessur en Siria». Los gesureos del sur, cerca de los filisteos, a quienes David atacaba desde Siclag, son otro pueblo con el mismo nombre."
    - "El reino importa en la historia de David. Este se casó con «Maachâ, hija de Talmai rey de Gessur», que le dio a Absalón y a Tamar. Después de que Absalón hizo matar a Amnón, «huyó, y fuése á Talmai hijo de Amiud, rey de Gessur», y estuvo allí tres años hasta que Joab lo trajo de vuelta; más tarde se quejó: «¿Para qué vine de Gessur? mejor me fuera estar aún allá», y alegó un voto hecho «cuando estaba en Gessur en Siria» como pretexto para ir a Hebrón. En el hebreo de Crónicas, Gesur y Aram tomaron a los hijos de Maquir las ciudades de Jair y Kenat, sesenta poblaciones, quizá señal de que el reino creció después a expensas de Israel."
    - "Las excavaciones iniciadas en 1987 en et-Tell, el montículo cerca de la desembocadura del Jordán identificado desde hace mucho con la Betsaida del Nuevo Testamento (el-Araj, más cerca de la orilla, es hoy un fuerte rival), sacaron a la luz una gran ciudad de la Edad del Hierro con una puerta monumental, junto a la cual se alzaba una estela de un dios con cabeza de toro y un puñal; los excavadores la toman por la capital de Gesur. La ciudad fue destruida en la conquista asiria del 732 a. C., y de Gesur no vuelve a oírse nada. La región es hoy el sur de los Altos del Golán, en poder de Israel desde 1967, con et-Tell en el Parque del Río Jordán, sobre el lago."
  pt:
    - "Gesur era um pequeno reino a leste e nordeste do mar da Galileia, nas encostas meridionais do Golã, entre Basã e o lago, tendo Maacá por vizinha ao norte. Josué menciona “a fronteira dos gesuritas e dos maacatitas” como o limite do reino de Ogue e admite que Israel “não expulsou os gesuritas, nem os maacatitas”, que viviam no meio dos israelitas “até o dia de hoje”. Seu povo era provavelmente arameu, ou próximo dos arameus; a Bíblia a chama “Gesur, na Síria”. Os gesuritas do sul, perto dos filisteus, atacados por Davi a partir de Ziclague, são outro povo com o mesmo nome."
    - "O reino importa na história de Davi. Ele se casou com “Maaca, filha de Talmai, rei de Gesur”, que lhe deu Absalão e Tamar. Depois que Absalão mandou matar Amnom, ele “fugiu e foi para Talmai, filho de Amiúde, rei de Gesur”, e ali ficou três anos, até que Joabe o trouxe de volta; mais tarde ele se queixou: “Por que vim de Gesur? Seria melhor para mim ainda estar lá”, e alegou um voto feito “enquanto morava em Gesur, na Síria” como pretexto para ir a Hebrom. No hebraico de Crônicas, Gesur e Arã tomaram dos filhos de Maquir as cidades de Jair, com Quenate, sessenta cidades, talvez sinal de que o reino cresceu depois à custa de Israel."
    - "As escavações desde 1987 em et-Tell, o monte perto da foz do Jordão há muito identificado com a Betsaida do Novo Testamento (el-Araj, mais perto da margem, é hoje um forte rival), revelaram uma grande cidade da Idade do Ferro com um portão maciço, junto ao qual havia uma estela de um deus com cabeça de touro e um punhal; os escavadores a tomam pela capital de Gesur. A cidade foi destruída na conquista assíria de 732 a.C., e de Gesur não se ouve mais falar. A região é hoje o sul das colinas de Golã, mantidas por Israel desde 1967, com et-Tell no Parque do Rio Jordão, acima do lago."
  de:
    - "Geschur war ein kleines Königreich östlich und nordöstlich des Sees Genezareth, auf den Südhängen des Golan zwischen Baschan und dem See, mit Maacha als nördlichem Nachbarn. Josua nennt „die Grenze der Gessuriter und Maachathiter“ als Grenze von Ogs Reich und räumt ein, dass die Kinder Israel „die zu Gessur und zu Maacha nicht“ vertrieben, die „bis auf diesen Tag“ unter den Israeliten wohnten. Seine Bewohner waren wahrscheinlich Aramäer oder standen ihnen nahe; die Bibel spricht von „Gessur in Syrien“. Die Geschuriter im Süden nahe den Philistern, die David von Ziklag aus überfiel, sind ein anderes Volk mit demselben Namen."
    - "Das Königreich spielt in Davids Geschichte eine Rolle. Er nahm Maacha zur Frau, und Absalom, „der Sohn Maachas, der Tochter Thalmais, des Königs zu Gessur“, und Tamar waren ihre Kinder. Nachdem Absalom Amnon hatte töten lassen, „floh“ er und „zog zu Thalmai, dem Sohn Ammihuds, dem König zu Gessur“ und blieb drei Jahre, bis Joab ihn zurückholte; später klagte er: „Warum bin ich von Gessur gekommen? Es wäre mir besser, daß ich noch da wäre“, und er berief sich auf ein Gelübde, das er getan hatte, „da ich zu Gessur in Syrien wohnte“, als Vorwand, nach Hebron zu gehen. Im hebräischen Text der Chronik nahmen Geschur und Aram die Städte Jaïrs und Kenat, sechzig Städte, den Söhnen Machirs ab, vielleicht ein Zeichen, dass das Königreich später auf Kosten Israels wuchs."
    - "Grabungen seit 1987 in et-Tell, dem Hügel nahe der Jordanmündung, der lange mit dem neutestamentlichen Betsaida gleichgesetzt wurde (el-Araj, näher am Ufer, ist heute ein starker Rivale), legten eine große eisenzeitliche Stadt mit einem massiven Tor frei, neben dem eine Stele eines stierköpfigen Gottes mit Dolch stand; die Ausgräber halten sie für die Hauptstadt von Geschur. Die Stadt wurde bei der assyrischen Eroberung von 732 v. Chr. zerstört, und von Geschur hört man nicht wieder. Die Gegend umfasst heute die südlichen Golanhöhen, seit 1967 von Israel gehalten, mit et-Tell im Jordan-River-Park über dem See."
  fr:
    - "Gueschur était un petit royaume à l’est et au nord-est de la mer de Galilée, sur les pentes méridionales du Golan, entre Basan et le lac, avec Maaca pour voisine au nord. Josué nomme « la frontière des Gueschuriens et des Maacathiens » comme limite du royaume d’Og et admet que les enfants d’Israël « ne chassèrent point les Gueschuriens et les Maacathiens, qui ont habité au milieu d’Israël jusqu’à ce jour ». Son peuple était probablement araméen, ou proche des Araméens ; la Bible l’appelle « Gueschur en Syrie ». Les Gueschuriens du sud, près des Philistins, attaqués par David depuis Tsiklag, sont un autre peuple de même nom."
    - "Le royaume compte dans l’histoire de David. Il épousa « Maaca, fille de Talmaï, roi de Gueschur », qui lui donna Absalom et Tamar. Après avoir fait tuer Amnon, Absalom s’enfuit et « alla chez Talmaï, fils d’Ammihur, roi de Gueschur », où il resta trois ans jusqu’à ce que Joab le ramène ; plus tard, il se plaignit : « Pourquoi suis-je revenu de Gueschur ? Il vaudrait mieux pour moi que j’y fusse encore », et allégua un vœu fait « pendant que je demeurais à Gueschur en Syrie » comme prétexte pour aller à Hébron. Dans l’hébreu des Chroniques, Gueschur et Aram prirent les bourgs de Jaïr et Kenath, soixante villes, aux fils de Makir, signe peut-être que le royaume s’agrandit plus tard aux dépens d’Israël."
    - "Les fouilles menées depuis 1987 à et-Tell, le tertre près de l’embouchure du Jourdain longtemps identifié à la Bethsaïda du Nouveau Testament (el-Araj, plus près du rivage, est aujourd’hui un sérieux rival), ont mis au jour une grande ville de l’âge du Fer dotée d’une porte massive, près de laquelle se dressait une stèle d’un dieu à tête de taureau portant un poignard ; les fouilleurs y voient la capitale de Gueschur. La ville fut détruite lors de la conquête assyrienne de 732 av. J.-C., et l’on n’entend plus parler de Gueschur. La région est aujourd’hui le sud du plateau du Golan, tenu par Israël depuis 1967, avec et-Tell dans le parc du Jourdain au-dessus du lac."
  pl:
    - "Geszur było małym królestwem na wschód i północny wschód od Jeziora Galilejskiego, na południowych stokach Golanu między Baszanem a jeziorem, z Maaką jako sąsiadem od północy. Jozue mówi, że królestwo Oga sięgało „aż do granic Gessurytów, i Mahachatytów”, i przyznaje, że „nie wygnali synowie Izraelscy Gessurytów i Machatytów”, którzy mieszkali wśród Izraelczyków „aż do dnia tego”. Jego mieszkańcy byli prawdopodobnie Aramejczykami lub blisko z nimi spokrewnieni; Biblia nazywa je „Giessur Syryjskim”. Gessuryci z południa, w pobliżu Filistynów, na których Dawid urządzał wyprawy z Siklag, to inny lud o tej samej nazwie."
    - "Królestwo ma znaczenie w dziejach Dawida. Ożenił się on z Maaką: Absalom jest w Biblii opisany jako „syn Moachy, córki Tolmaja króla Giessur”, a ona urodziła mu Absaloma i Tamar. Gdy Absalom kazał zabić Amnona, „uciekłszy uszedł do Tolmaja, syna Ammihudowego, króla Giessur”, i przebywał tam trzy lata, aż Joab sprowadził go z powrotem; później skarżył się: „Nacóżem przyszedł z Giessur? Lepiej mi było tam jeszcze zostać”, a ślub złożony, „kiedym mieszkał w Giessur Syryjskim”, podał jako pretekst wyprawy do Hebronu. W hebrajskim tekście Kronik Geszur i Aram zabrały synom Makira miasta Jaira i Kenat, sześćdziesiąt miast, co może wskazywać, że królestwo później rosło kosztem Izraela."
    - "Wykopaliska prowadzone od 1987 r. w et-Tell, pagórku w pobliżu ujścia Jordanu, od dawna utożsamianym z nowotestamentową Betsaidą (el-Araj, bliżej brzegu, jest dziś silnym rywalem), odsłoniły wielkie miasto z epoki żelaza z masywną bramą, obok której stała stela boga o głowie byka ze sztyletem; badacze uważają je za stolicę Geszur. Miasto zostało zniszczone podczas asyryjskiego podboju w 732 r. p.n.e., a o Geszur nie słychać już więcej. Region to dziś południowe Wzgórza Golan, zajęte przez Izrael od 1967 r., z et-Tell w Parku Rzeki Jordan nad jeziorem."
  it:
    - "Ghesur era un piccolo regno a est e nord-est del Lago di Tiberiade, sui pendii meridionali del Golan fra Basan e il lago, con Maaca come vicino settentrionale. Giosuè nomina «i confini dei Ghesuriti e dei Maacatiti» come limite del regno di Og e ammette che Israele «non cacciò i Ghesuriti e i Maacatiti», che abitavano fra gli Israeliti «fino al dì d’oggi». Il suo popolo era probabilmente aramaico, o vicino agli Aramei; la Bibbia la chiama «Gheshur, in Siria». I Ghesuriti del sud, presso i Filistei, contro cui Davide faceva scorrerie da Siclag, sono un popolo diverso con lo stesso nome."
    - "Il regno ha importanza nella storia di Davide. Egli sposò «Maaca, figliuola di Talmai re di Gheshur», che gli partorì Assalonne e Tamar. Dopo che Assalonne ebbe fatto uccidere Amnon, «se ne fuggì e andò da Talmai, figliuolo di Ammihur, re di Gheshur» e vi rimase tre anni, finché Ioab lo riportò indietro; più tardi si lamentò: «Perché son io tornato da Gheshur? Meglio per me s’io vi fossi ancora!», e addusse come scusa per recarsi a Ebron un voto fatto «durante la sua dimora a Gheshur, in Siria». Nell’ebraico delle Cronache, Ghesur e Aram presero le città di Iair e Kenat, sessanta città, ai figli di Machir, forse segno che il regno crebbe in seguito a spese d’Israele."
    - "Gli scavi dal 1987 a et-Tell, il tell presso la foce del Giordano a lungo identificato con la Betsaida del Nuovo Testamento (el-Araj, più vicino alla riva, è oggi un forte rivale), hanno portato alla luce una grande città dell’età del Ferro con una massiccia porta, accanto alla quale sorgeva una stele di un dio dalla testa di toro con un pugnale; gli scavatori la ritengono la capitale di Ghesur. La città fu distrutta nella conquista assira del 732 a.C., e di Ghesur non si sente più parlare. La regione è oggi l’altopiano meridionale del Golan, in mano a Israele dal 1967, con et-Tell nel Parco del Fiume Giordano sopra il lago."
  nl:
    - "Gesur was een klein koninkrijk ten oosten en noordoosten van het Meer van Galilea, op de zuidelijke hellingen van de Golan tussen Basan en het meer, met Maächa als noorderbuur. Jozua noemt “de landpale der Gezurieten, en der Maachathieten” als de grens van het rijk van Og en erkent dat Israël “de Gezurieten en de Maachathieten niet” verdreef, die onder de Israëlieten woonden “tot op dezen dag”. Het volk was waarschijnlijk Arameeërs, of stond dicht bij de Arameeërs; de Bijbel noemt het “Gesur in Syrie”. De Gesurieten in het zuiden bij de Filistijnen, door David vanuit Ziklag overvallen, zijn een ander volk met dezelfde naam."
    - "Het koninkrijk is belangrijk in het verhaal van David. Hij trouwde met “Maacha, de dochter van Thalmai, koning van Gesur”, en zij schonk hem Absalom en Tamar. Nadat Absalom Amnon had laten doden, “vluchtte, en toog” hij “tot Thalmai, den zoon van Ammihur, koning van Gesur”, en bleef er drie jaar tot Joab hem terugbracht; later klaagde hij: “Waarom ben ik van Gesur gekomen? Het ware mij goed, dat ik nog daar ware”, en beriep hij zich op een gelofte gedaan “als ik te Gesur in Syrie woonde” als voorwendsel om naar Hebron te gaan. In het Hebreeuws van Kronieken namen Gesur en Aram de steden van Jaïr en Kenat, zestig steden, van de zonen van Machir af, misschien een teken dat het koninkrijk later ten koste van Israël groeide."
    - "Opgravingen sinds 1987 te et-Tell, de heuvel nabij de monding van de Jordaan die lang werd vereenzelvigd met het Bethsaïda van het Nieuwe Testament (el-Araj, dichter bij de oever, is nu een sterke rivaal), legden een grote stad uit de IJzertijd bloot met een massieve poort, waarnaast een stele stond van een god met een stierenkop en een dolk; de opgravers houden haar voor de hoofdstad van Gesur. De stad werd verwoest bij de Assyrische verovering van 732 v.Chr., en van Gesur wordt niets meer vernomen. De streek is nu het zuidelijke Golanplateau, sinds 1967 in handen van Israël, met et-Tell in het Jordaanrivierpark boven het meer."
  cs:
    - "Gešur bylo malé království východně a severovýchodně od Galilejského jezera, na jižních svazích Golánu mezi Bášanem a jezerem, se sousední Maakou na severu. Jozue jmenuje „ku pomezí Gessuri a Machati“ jako hranici Ógova království a přiznává, že Izrael „Nevyhnali pak synové Izraelští Gessuri a Machati“, kteří bydleli mezi Izraelci „až do dnešního dne“. Jeho lid byl pravděpodobně aramejský nebo blízký Aramejcům; Bible je nazývá „Gessur v Syrii“. Gešurci z jihu poblíž Pelištejců, přepadaní Davidem ze Siklagu, jsou jiný lid se stejným jménem."
    - "Království má význam v příběhu o Davidovi. Oženil se s „Maachy dcery Tolmai krále Gessur“, která mu porodila Abšaloma a Tamar. Když Abšalom nechal zabít Amnóna, „utekl a ušel k Tolmai synu Amiudovu, králi Gessur“, a zůstal tři roky, dokud ho Joáb nepřivedl zpět; později si stěžoval: „I proč jsem přišel z Gessur? Lépe mi bylo ještě tam zůstati“, a jako omluvu pro odchod do Hebronu uvedl slib učiněný, „když jsem bydlil v Gessur v Syrii“. V hebrejštině Letopisů Gešur a Aram vzaly Jaírovy vsi a Kenat, šedesát měst, synům Machírovým, snad jako znamení, že království později rostlo na účet Izraele."
    - "Vykopávky od roku 1987 na et-Tell, pahorku poblíž ústí Jordánu, dlouho ztotožňovaném s novozákonní Betsaidou (el-Araj, blíže břehu, je dnes silným soupeřem), odkryly velké město z doby železné s mohutnou branou, u níž stála stéla boha s býčí hlavou s dýkou; vykopávači ji pokládají za hlavní město Gešuru. Město bylo zničeno při asyrském dobytí roku 732 př. n. l. a o Gešuru se již neslyší. Oblast je dnes jižní část Golanských výšin, držená Izraelem od roku 1967, s et-Tell v Parku řeky Jordán nad jezerem."
