# Overview article (ADR 0007). Mainstream facts only; the Byzantine and later history follows the Franciscan excavations on Mount Nebo.
id: abarim
place: aa8275b
title:
  en: "Abarim"
  ru: "Аварим"
body:
  en:
    - "Abarim, “the regions beyond”, is the biblical name for the mountains east of the Dead Sea and the lower Jordan: the western edge of the Moabite plateau as seen from the land of Israel, the heights that include Mount Nebo and Pisgah, rising some 700 m above the sea and more than a thousand above the Jordan valley. Iye-abarim, “the ruins of Abarim”, was an earlier camp “in the border of Moab”, further south. Jeremiah bids Judah go up to Lebanon and Bashan and cry “from the passages”, in Hebrew from Abarim, the three great lookouts of the land."
    - "Israel's last camps before the plains of Moab were “in the mountains of Abarim, before Nebo”. Here Moses was told, “Get thee up into this mount Abarim, and see the land which I have given unto the children of Israel”, and be gathered to his people as Aaron had been on Mount Hor; Deuteronomy names the summit: “this mountain Abarim, unto mount Nebo, which is in the land of Moab, that is over against Jericho”. From the top of Pisgah the LORD showed him all the land, from Gilead to Dan and to the sea, and Moses died there in the land of Moab, and no one knows his grave."
    - "Eusebius knew Abarim as the mountain where Moses died, on the way up from Livias to Heshbon near Mount Peor. The pilgrim Egeria in the 380s was led up from Livias to the summit of Nebo and shown a small church where, the monks told her, the angels had laid Moses. That church, enlarged into a basilica with fine mosaics in the sixth century, was excavated by the Franciscans from 1933; it stands restored at Siyagha (Mount Nebo), about 9 km west of Madaba in Jordan, with the view Moses was given across the Jordan valley to Jericho and, on a clear day, to Jerusalem."
  ru:
    - "Аварим, «области по ту сторону», — библейское имя гор к востоку от Мёртвого моря и нижнего Иордана: западного края Моавитского плато, каким он виден из земли Израиля, — высот, к которым принадлежат гора Нево и Фасга, поднимающихся примерно на 700 м над морем и более чем на тысячу над Иорданской долиной. Ийе-Аварим, «развалины Аварима», был более ранним станом «на пределах Моава», южнее. Иеремия велит Иудее взойти на Ливан и Васан и кричать «с Аварима» — с трёх больших дозорных высот страны."
    - "Последние станы Израиля перед равнинами Моавитскими были «на горах Аваримских пред Нево». Здесь Моисею было сказано: «взойди на сию гору Аварим... и посмотри на землю Ханаанскую, которую Я даю сынам Израилевым во владение», и приложись к народу своему, как Аарон на горе Ор; Второзаконие называет вершину: «на сию гору Аварим, на гору Нево, которая в земле Моавитской, против Иерихона». С вершины Фасги Господь показал ему всю землю, от Галаада до Дана и до моря, и Моисей умер там, в земле Моавитской, и никто не знает его могилы."
    - "Евсевий знал Аварим как гору, где умер Моисей, на подъёме из Ливиады в Есевон близ горы Фегор. Паломница Эгерия в 380-х годах поднялась из Ливиады на вершину Нево, и ей показали небольшую церковь, где, по словам монахов, ангелы положили Моисея. Эту церковь, расширенную в VI веке в базилику с прекрасными мозаиками, францисканцы раскапывали с 1933 года; она стоит восстановленной на Сияге (горе Нево), примерно в 9 км к западу от Мадабы в Иордании, с тем видом, что был дан Моисею, — через Иорданскую долину на Иерихон, а в ясный день и на Иерусалим."
