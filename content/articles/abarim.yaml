body:
  en:
    - "Abarim, “the regions beyond”, is the biblical name for the mountains east of the Dead Sea and the lower Jordan: the western edge of the Moabite plateau as seen from the land of Israel, the heights that include Mount Nebo and Pisgah, rising some 700 m above the sea and more than a thousand above the Jordan valley. Iye-abarim, “the ruins of Abarim”, was an earlier camp “in the border of Moab”, further south. Jeremiah bids Judah go up to Lebanon and Bashan and cry “from the passages”, in Hebrew from Abarim, the three great lookouts of the land."
    - "Israel's last camps before the plains of Moab were “in the mountains of Abarim, before Nebo”. Here Moses was told, “Get thee up into this mount Abarim, and see the land which I have given unto the children of Israel”, and be gathered to his people as Aaron had been on Mount Hor; Deuteronomy names the summit: “this mountain Abarim, unto mount Nebo, which is in the land of Moab, that is over against Jericho”. From the top of Pisgah the LORD showed him all the land, from Gilead to Dan and to the sea, and Moses died there in the land of Moab, and no one knows his grave."
    - "Eusebius knew Abarim as the mountain where Moses died, on the way up from Livias to Heshbon near Mount Peor. The pilgrim Egeria in the 380s was led up from Livias to the summit of Nebo and shown a small church where, the monks told her, the angels had laid Moses. That church, enlarged in the late fifth and the sixth century into a basilica with fine mosaics, was excavated by the Franciscans from 1933; it stands restored at Siyagha (Mount Nebo), about 9 km north-west of Madaba in Jordan, with the view Moses was given across the Jordan valley to Jericho and, on a clear day, to Jerusalem."
  ru:
    - "Аварим, «области по ту сторону», — библейское имя гор к востоку от Мёртвого моря и нижнего Иордана: западного края Моавитского плато, каким он виден из земли Израиля, — высот, к которым принадлежат гора Нево и Фасга, поднимающихся примерно на 700 м над морем и более чем на тысячу над Иорданской долиной. Ийе-Аварим, «развалины Аварима», был более ранним станом «на пределах Моава», южнее. Иеремия велит Иудее взойти на Ливан и Васан и кричать «с Аварима» — с трёх больших дозорных высот страны."
    - "Последние станы Израиля перед равнинами Моавитскими были «на горах Аваримских пред Нево». Здесь Моисею было сказано: «взойди на сию гору Аварим... и посмотри на землю Ханаанскую, которую Я даю сынам Израилевым во владение», и приложись к народу своему, как Аарон на горе Ор; Второзаконие называет вершину: «на сию гору Аварим, на гору Нево, которая в земле Моавитской, против Иерихона». С вершины Фасги Господь показал ему всю землю, от Галаада до Дана и до моря, и Моисей умер там, в земле Моавитской, и никто не знает его могилы."
    - "Евсевий знал Аварим как гору, где умер Моисей, на подъёме из Ливиады в Есевон близ горы Фегор. Паломница Эгерия в 380-х годах поднялась из Ливиады на вершину Нево, и ей показали небольшую церковь, где, по словам монахов, ангелы положили Моисея. Эту церковь, расширенную в конце V и в VI веке в базилику с прекрасными мозаиками, францисканцы раскапывали с 1933 года; она стоит восстановленной на Сияге (горе Нево), примерно в 9 км к северо-западу от Мадабы в Иордании, с тем видом, что был дан Моисею, — через Иорданскую долину на Иерихон, а в ясный день и на Иерусалим."
  uk:
    - "Аварім, «області по той бік», — біблійна назва гір на схід від Мертвого моря та нижнього Йордану: західного краю Моавського плато, яким воно видно із Землі Ізраїлю, — висот, до яких належать гора Нево та Фасга; вони здіймаються приблизно на 700 м над рівнем моря і понад тисячу метрів над Йорданською долиною. Ійє-Аварім, «руїни Авариму», був раннішим табором «на границї Моаба», південніше. Єремія велить Юді зійти на Ліван і Башан та кричати «з Аваримських гір» (в івриті — з Авариму), з трьох великих оглядових висот краю."
    - "Останні табори Ізраїлю перед моавськими степами були «під Абарим горами на проти Небо». Тут Мойсею було сказано: «Ізійди на Абарім гору, і побачиш землю, що я надїлив синам Ізрайлевим», і що він приєднається до свого народу, як приєднався Аарон на горі Гор; Второзаконня називає вершину: «сї гори Абарим, на гору Небо, що в землї Моабській, проти Єрихону». З вершини Фасги Господь показав йому всю землю, від Гілеаду до Дану й до моря, і Мойсей помер там, у землі Моавській, і ніхто не знає його гробу."
    - "Євсевій знав Аварім як гору, де помер Мойсей, на підйомі від Лівіади до Гесбону поблизу гори Пеор. Прочанка Егерія в 380-х роках піднялася з Лівіади на вершину Нево, і їй показали невелику церкву, де, за словами ченців, ангели поклали Мойсея. Ту церкву, розбудовану наприкінці V і в VI столітті до базиліки з чудовими мозаїками, францисканці розкопували від 1933 року; вона стоїть відновленою на Сіяґі (гора Нево), приблизно за 9 км на північний захід від Мадаби в Йорданії, з тим краєвидом, що відкрився Мойсею, — через Йорданську долину на Єрихон, а за ясної погоди і на Єрусалим."
  es:
    - "Abarim, «las regiones del otro lado», es el nombre bíblico de las montañas situadas al este del mar Muerto y del bajo Jordán: el borde occidental de la meseta de Moab visto desde la tierra de Israel, las alturas que incluyen el monte Nebo y Pisga, que se elevan unos 700 m sobre el mar y más de mil sobre el valle del Jordán. Ije-abarim, «las ruinas de Abarim», fue un campamento anterior «en el término de Moab», más al sur. Jeremías ordena a Judá subir al Líbano y a Basán y clamar desde los pasos (en hebreo, desde Abarim), los tres grandes miradores de la tierra."
    - "Los últimos campamentos de Israel antes de las llanuras de Moab estuvieron «en los montes de Abarim, delante de Nebo». Allí se dijo a Moisés: «Sube á este monte Abarim, y verás la tierra que he dado á los hijos de Israel», y que sería reunido con su pueblo, como lo había sido Aarón en el monte Hor; el Deuteronomio nombra la cumbre: «este monte de Abarim, al monte Nebo, que está en la tierra de Moab, que está en derecho de Jericó». Desde lo alto de Pisga Jehová le mostró toda la tierra, desde Galaad hasta Dan y hasta el mar, y Moisés murió allí, en la tierra de Moab, y nadie conoce su sepultura."
    - "Eusebio conocía Abarim como el monte donde murió Moisés, en el camino que sube de Livias a Hesbón, cerca del monte Peor. La peregrina Egeria, en los años 380, fue conducida desde Livias hasta la cumbre del Nebo y se le mostró una pequeña iglesia donde, según le dijeron los monjes, los ángeles habían depositado a Moisés. Esa iglesia, ampliada a finales del siglo V y en el VI hasta convertirse en una basílica con hermosos mosaicos, fue excavada por los franciscanos a partir de 1933; hoy se alza restaurada en Siyagha (monte Nebo), a unos 9 km al noroeste de Madaba, en Jordania, con la vista que se concedió a Moisés a través del valle del Jordán hasta Jericó y, en un día despejado, hasta Jerusalén."
  pt:
    - "Abarim, “as regiões do outro lado”, é o nome bíblico das montanhas a leste do mar Morto e do baixo Jordão: a borda ocidental do planalto de Moabe, vista da terra de Israel, as alturas que incluem o monte Nebo e Pisga, elevando-se cerca de 700 m acima do mar e mais de mil acima do vale do Jordão. Ie-Abarim, “as ruínas de Abarim”, foi um acampamento anterior, mais ao sul, “na fronteira de Moabe”. Jeremias manda Judá subir ao Líbano e a Basã e clamar “desde Abarim”, em hebraico “desde as passagens”, os três grandes pontos de observação da terra."
    - "Os últimos acampamentos de Israel antes das campinas de Moabe foram “nas montanhas de Abarim, diante de Nebo”. Ali foi dito a Moisés: “Suba a este monte de Abarim, e veja a terra que dei aos filhos de Israel”, para ser reunido ao seu povo, como Arão o fora no monte Hor; Deuteronômio nomeia o cume: “Suba a esta montanha de Abarim, ao Monte Nebo, que está na terra de Moabe, em frente a Jericó”. Do topo de Pisga o SENHOR lhe mostrou toda a terra, de Gileade até Dã e até o mar, e Moisés morreu ali, na terra de Moabe, e ninguém sabe onde fica o seu túmulo."
    - "Eusébio conhecia Abarim como o monte onde morreu Moisés, no caminho que sobe de Lívias a Hesbom, perto do monte Peor. A peregrina Egéria, nos anos 380, foi conduzida de Lívias até o cume do Nebo e lhe mostraram uma pequena igreja onde, segundo os monges, os anjos haviam colocado Moisés. Essa igreja, ampliada no fim do século V e no século VI numa basílica de belos mosaicos, foi escavada pelos franciscanos a partir de 1933; hoje está restaurada em Siyagha (monte Nebo), cerca de 9 km a noroeste de Madaba, na Jordânia, com a vista concedida a Moisés sobre o vale do Jordão até Jericó e, em dia claro, até Jerusalém."
  de:
    - "Abarim, „die Gegenden jenseits“, ist der biblische Name der Berge östlich des Toten Meeres und des unteren Jordan: der Westrand des moabitischen Hochplateaus, vom Land Israel aus gesehen, die Höhen mit dem Berg Nebo und Pisga, die sich etwa 700 m über das Meer und mehr als tausend über das Jordantal erheben. Ije-Abarim, „die Ruinen von Abarim“, war ein früheres Lager „in der Moabiter Gebiet“, weiter südlich. Jeremia heißt Juda auf den Libanon steigen, nach Baschan rufen und „von Abarim“ schreien, von den drei großen Aussichtshöhen des Landes."
    - "Israels letzte Lager vor den Gefilden der Moabiter lagen „in dem Gebirge Abarim vor dem Nebo“. Hier wurde Mose gesagt: „Steig auf dies Gebirge Abarim und besiehe das Land, das ich den Kindern Israel geben werde“, und er solle zu seinem Volk versammelt werden, wie Aaron auf dem Berg Hor; das Fünfte Buch Mose nennt den Gipfel: „auf das Gebirge Abarim, auf den Berg Nebo, der da liegt im Moabiterland, gegenüber Jericho“. Von der Spitze des Pisga zeigte der HERR ihm das ganze Land, von Gilead bis Dan und bis zum Meer, und Mose starb dort im Land der Moabiter, und niemand kennt sein Grab."
    - "Eusebius kannte Abarim als den Berg, auf dem Mose starb, am Aufstieg von Livias nach Heschbon nahe dem Berg Peor. Die Pilgerin Egeria wurde in den 380er Jahren von Livias auf den Gipfel des Nebo geführt, und man zeigte ihr eine kleine Kirche, in die nach den Worten der Mönche die Engel Mose gelegt hatten. Diese Kirche, im späten 5. und im 6. Jahrhundert zu einer Basilika mit prächtigen Mosaiken erweitert, wird seit 1933 von den Franziskanern ausgegraben; sie steht wiederhergestellt in Siyagha (Berg Nebo), etwa 9 km nordwestlich von Madaba in Jordanien, mit der Aussicht, die Mose gegeben wurde, über das Jordantal hinweg nach Jericho und an klaren Tagen bis Jerusalem."
  fr:
    - "Abarim, « les régions d’au-delà », est le nom biblique des montagnes situées à l’est de la mer Morte et du bas Jourdain : le bord occidental du plateau moabite vu depuis le pays d’Israël, les hauteurs qui comprennent le mont Nebo et le Pisga, et qui s’élèvent à quelque 700 m au-dessus de la mer et à plus de mille au-dessus de la vallée du Jourdain. Ijé-Abarim, « les ruines d’Abarim », était un campement plus ancien « sur la frontière de Moab », plus au sud. Jérémie invite Juda à monter sur le Liban et sur le Basan et à crier depuis les passages, en hébreu depuis Abarim, les trois grands belvédères du pays."
    - "Les derniers campements d’Israël avant les plaines de Moab furent « aux montagnes d’Abarim, devant Nebo ». C’est là que Moïse reçut cet ordre : « Monte sur cette montagne d’Abarim, et regarde le pays que je donne aux enfants d’Israël », puis il devait être recueilli auprès de son peuple comme Aaron l’avait été sur le mont Hor ; le Deutéronome nomme le sommet : « cette montagne d’Abarim, sur le mont Nebo, au pays de Moab, vis-à-vis de Jéricho ». Du haut du Pisga, l’Éternel lui fit voir tout le pays, de Galaad jusqu’à Dan et jusqu’à la mer ; Moïse mourut là, au pays de Moab, et personne n’a connu son sépulcre."
    - "Eusèbe connaissait Abarim comme la montagne où mourut Moïse, sur la route montante de Livias à Hesbon, près du mont Peor. La pèlerine Égérie, dans les années 380, fut conduite de Livias jusqu’au sommet du Nebo et on lui montra une petite église où, lui dirent les moines, les anges avaient déposé Moïse. Cette église, agrandie à la fin du Ve et au VIe siècle en une basilique ornée de belles mosaïques, a été fouillée par les franciscains à partir de 1933 ; elle se dresse restaurée à Siyagha (mont Nebo), à environ 9 km au nord-ouest de Madaba, en Jordanie, avec la vue qui fut donnée à Moïse par-dessus la vallée du Jourdain jusqu’à Jéricho et, par temps clair, jusqu’à Jérusalem."
  it:
    - "Abarim, «le regioni al di là», è il nome biblico dei monti a est del Mar Morto e del basso Giordano: il margine occidentale dell’altopiano moabita visto dalla terra d’Israele, le alture che comprendono il monte Nebo e il Pisga, e che si innalzano di circa 700 m sul mare e di più di mille sulla valle del Giordano. Iie-Abarim, «le rovine di Abarim», era un accampamento più antico, più a sud, «sui confini di Moab». Geremia invita Giuda a salire sul Libano, a gridare in Basan e a gridare dai passaggi, in ebraico dall’Abarim, i tre grandi punti di osservazione del paese."
    - "Gli ultimi accampamenti d’Israele prima delle pianure di Moab furono «ai monti d’Abarim dirimpetto a Nebo». Qui fu detto a Mosè: «Sali su questo monte di Abarim e contempla il paese che io do ai figliuoli d’Israele», e sarebbe stato raccolto presso il suo popolo, come Aronne sul monte Or; il Deuteronomio nomina la vetta: «questo monte di Abarim, sul monte Nebo, ch’è nel paese di Moab, di faccia a Gerico». Dalla cima del Pisga il Signore gli mostrò tutto il paese, da Galaad fino a Dan e al mare, e Mosè morì là, nel paese di Moab, e nessuno ha saputo dove fosse la sua tomba."
    - "Eusebio conosceva Abarim come il monte dove morì Mosè, sulla salita da Livias a Chesbon, vicino al monte Peor. La pellegrina Egeria, negli anni Ottanta del IV secolo, fu condotta da Livias fino alla vetta del Nebo e le fu mostrata una piccola chiesa dove, le dissero i monaci, gli angeli avevano deposto Mosè. Quella chiesa, ampliata tra la fine del V e il VI secolo in una basilica con splendidi mosaici, è stata scavata dai francescani dal 1933; sorge restaurata a Siyagha (monte Nebo), a circa 9 km a nord-ovest di Madaba, in Giordania, con la vista concessa a Mosè sulla valle del Giordano fino a Gerico e, nelle giornate limpide, fino a Gerusalemme."
  pl:
    - "Abarim, „obszary po drugiej stronie”, to biblijna nazwa gór na wschód od Morza Martwego i dolnego Jordanu: zachodniego skraju wyżyny Moabu, widzianego od strony ziemi Izraela, wzniesień obejmujących górę Nebo i Pisgę, które wznoszą się około 700 m nad morzem i ponad tysiąc nad Doliną Jordanu. Ije-Abarim, „ruiny Abarim”, było wcześniejszym obozowiskiem „na granicy Moabskiej”, dalej na południu. Jeremiasz każe Judzie wstąpić na Liban i Baszan i wołać „u brodów”, po hebrajsku z Abarim, z trzech wielkich punktów widokowych kraju."
    - "Ostatnie obozowiska Izraela przed równinami Moabu były „na górach Abarym, przeciwko Nebo”. Tutaj powiedziano Mojżeszowi: „Wstąp na tę górę Abarym, a oglądaj ziemię, którąm dał synom Izraelskim”, a potem zostanie przyłączony do swego ludu, jak Aaron na górze Hor; Księga Powtórzonego Prawa wymienia szczyt: „na tę górę Abarym, na górę Nebo, która jest w ziemi Moabskiej przeciw Jerychu”. Ze szczytu Pisgi Pan pokazał mu całą ziemię, od Gileadu po Dan i po morze, a Mojżesz umarł tam w ziemi Moabu i nikt nie zna jego grobu."
    - "Euzebiusz znał Abarim jako górę, na której umarł Mojżesz, przy drodze z Liwias do Cheszbon, w pobliżu góry Peor. Pątniczka Egeria została w latach 380. poprowadzona z Liwias na szczyt Nebo i pokazano jej mały kościół, w którym, jak mówili jej mnisi, aniołowie złożyli Mojżesza. Kościół ten, pod koniec V i w VI wieku rozbudowany w bazylikę z pięknymi mozaikami, odkopywali od 1933 roku franciszkanie; stoi odnowiony w Siyagha (góra Nebo), około 9 km na północny zachód od Madaby w Jordanii, z widokiem, jaki dano Mojżeszowi, przez Dolinę Jordanu na Jerycho, a w pogodny dzień na Jerozolimę."
  nl:
    - "Abarim, “de streken aan gene zijde”, is de bijbelse naam voor het gebergte ten oosten van de Dode Zee en de benedenloop van de Jordaan: de westrand van het Moabitische plateau, gezien vanuit het land Israël, de hoogten waartoe de berg Nebo en de Pisga behoren, die zo’n 700 m boven de zee uitrijzen en meer dan duizend boven de Jordaanvallei. Ijje-Abarim, “de ruïnes van Abarim”, was een eerder kamp “in de landpale van Moab”, verder naar het zuiden. Jeremia gebiedt Juda naar de Libanon en Basan op te gaan en te roepen vanaf de overgangen, in het Hebreeuws vanaf Abarim, de drie grote uitkijkpunten van het land."
    - "Israëls laatste kampen vóór de vlakten van Moab lagen “in de bergen Abarim, tegen Nebo”. Hier werd tot Mozes gezegd: “Klim op dezen berg Abarim, en zie dat land, hetwelk Ik den kinderen Israels gegeven heb”, en bij zijn volk te worden verzameld zoals Aäron op de berg Hor; Deuteronomium noemt de top: “den berg Abarim (deze is de berg Nebo, die in het land van Moab is, die tegenover Jericho is)”. Vanaf de top van de Pisga toonde de HEER hem het hele land, van Gilead tot Dan en tot de zee, en Mozes stierf daar in het land van Moab; niemand kent zijn graf."
    - "Eusebius kende Abarim als de berg waar Mozes stierf, aan de weg die van Livias naar Chesbon omhoogvoerde, nabij de berg Peor. De pelgrim Egeria werd in de jaren 380 van Livias naar de top van de Nebo geleid en kreeg er een kleine kerk te zien waar de engelen Mozes volgens de monniken hadden neergelegd. Die kerk, eind vijfde en in de zesde eeuw uitgebreid tot een basiliek met prachtige mozaïeken, werd vanaf 1933 door de franciscanen opgegraven; zij staat gerestaureerd in Siyagha (berg Nebo), ongeveer 9 km ten noordwesten van Madaba in Jordanië, met het uitzicht dat Mozes kreeg over de Jordaanvallei tot Jericho en, op een heldere dag, tot Jeruzalem."
  cs:
    - "Abárím, „oblasti na druhé straně“, je biblický název hor východně od Mrtvého moře a dolního Jordánu: západního okraje moábské planiny, jak se jeví ze země Izraele, výšin, k nimž patří hora Nebo a Pisga a které se zdvíhají asi 700 m nad hladinu moře a o více než tisíc metrů nad Jordánské údolí. Ijje-abarím, „zříceniny Abarímu“, byl dřívější tábor „na pomezí Moábském“, dále na jih. Jeremjáš vybízí Judu, aby vystoupila na Libanon a Bášan a volala „přes brody“, hebrejsky z Abarímu, z těch tří velkých rozhleden země."
    - "Poslední tábory Izraele před pláněmi Moábu byly „na horách Abarim proti Nébo“. Zde bylo Mojžíšovi řečeno: „Vstup na horu tuto Abarim, a spatř zemi, kterouž jsem dal synům Izraelským“, a že bude připojen k svému lidu, jako byl Áron na hoře Hor; Deuteronomium jmenuje vrchol: „Vstup na horu tuto Abarim, na vrch Nébo, kteráž jest v zemi Moábské naproti Jerichu“. Z vrcholu Pisgy ukázal Hospodin Mojžíšovi všechnu zemi od Gileadu až k Danu a k moři a Mojžíš tam zemřel v zemi Moábské a nikdo nezná jeho hrob."
    - "Eusebios znal Abárím jako horu, na níž zemřel Mojžíš, při výstupu z Livias do Chešbónu poblíž hory Peór. Poutnici Egerii vedli v 380. letech z Livias na vrchol Nebo a ukázali jí malý kostel, kam podle slov mnichů andělé Mojžíše uložili. Tento kostel, koncem 5. a v 6. století rozšířený na baziliku s nádhernými mozaikami, odkrývali od roku 1933 františkáni; stojí obnovený v Siyaghe (hora Nebo), asi 9 km severozápadně od Madaby v Jordánsku, s výhledem, jaký byl dán Mojžíšovi, přes Jordánské údolí k Jerichu a za jasného dne až k Jeruzalému."
  sv:
    - "Abarim, ”områdena på andra sidan”, är det bibliska namnet på bergen öster om Döda havet och nedre Jordan: moabitiska högplatåns västra kant sedd från Israels land, höjderna som omfattar Nebo och Pisga, och som reser sig omkring 700 m över havet och mer än tusen över Jordandalen. Ije-Haabarim, ”Abarims ruiner”, var ett tidigare läger ”vid Moabs gräns”, längre söderut. Jeremia uppmanar Juda att gå upp på Libanon och Bashan och ropa ”från Abarim” (King James-översättningen har ”from the passages”, ”från passen”), landets tre stora utsiktspunkter."
    - "Israels sista läger före Moabs hedar låg ”vid Abarimbergen, framför Nebo”. Här fick Mose höra: ”Stig upp här på Abarimberget, så skall du få se det land som jag har givit åt Israels barn”, och samlas till sina fäder såsom Aron hade blivit på berget Hor; Femte Mosebok nämner toppen: ”Stig upp här på Abarimberget, på berget Nebo i Moabs land, gent emot Jeriko”. Från Pisgas topp lät HERREN honom se hela landet, ”Gilead ända till Dan” och ända till havet, och Mose dog där i Moabs land, och ingen vet var hans grav är."
    - "Eusebios kände Abarim som berget där Mose dog, på vägen upp från Livias till Heshbon nära berget Peor. Pilgrimen Egeria fördes på 380-talet upp från Livias till toppen av Nebo och visades en liten kyrka där änglarna, enligt munkarna, hade lagt Mose. Den kyrkan, som under slutet av 400-talet och på 500-talet byggdes ut till en basilika med vackra mosaiker, grävdes ut av franciskanerna från 1933; den står restaurerad vid Siyagha (berget Nebo), omkring 9 km nordväst om Madaba i Jordanien, med den utsikt som Mose fick över Jordandalen till Jeriko och, en klar dag, till Jerusalem."
  nb:
    - "Abarim, «landene på hin side», er det bibelske navnet på fjellene øst for Dødehavet og nedre Jordan: den vestlige kanten av Moabs høyslette sett fra Israels land, høydene som omfatter Nebo-fjellet og Pisga, og som hever seg omtrent 700 m over havet og mer enn tusen over Jordandalen. Ije-Abarim, «Abarims ruiner», var en tidligere leir «ved Moabs grense», lenger sør. Jeremia ber Juda gå opp på Libanon og Basan og rope «fra overgangene», på hebraisk fra Abarim, landets tre store utkikkspunkter."
    - "Israels siste leirer før Moabs ødemarker lå «ved Abarim-fjellene, foran Nebo». Her fikk Moses beskjed: «Stig op på Abarim-fjellet her og se utover landet som jeg har gitt Israels barn!», og han skulle samles til sitt folk, slik Aron var blitt det på fjellet Hor; 5. Mosebok nevner toppen: «Gå op på Abarim-fjellet her, på Nebo-fjellet i Moabs land midt imot Jeriko». Fra toppen av Pisga lot Herren ham se hele landet, fra Gilead til Dan og til havet, og Moses døde der i Moabs land, og ingen kjenner hans grav."
    - "Eusebius kjente Abarim som fjellet der Moses døde, på veien opp fra Livias til Hesjbon nær Peor-fjellet. Pilegrimen Egeria ble på 380-tallet ført opp fra Livias til toppen av Nebo og vist en liten kirke der, fortalte munkene henne, englene hadde lagt Moses. Kirken ble utvidet på slutten av 400-tallet og på 500-tallet til en basilika med fine mosaikker, og ble gravd ut av fransiskanerne fra 1933; den står restaurert ved Siyagha (Nebo-fjellet), omtrent 9 km nordvest for Madaba i Jordan, med den utsikten Moses fikk over Jordandalen til Jeriko og, på en klar dag, til Jerusalem."
  tl:
    - "Ang Abarim, “ang mga lupain sa kabila”, ay ang pangalang biblikal ng mga bundok sa silangan ng Dagat na Patay at ng ibabang Jordan: ang kanlurang gilid ng talampas ng Moab na tanaw mula sa lupain ng Israel, ang mga tuktok na kinabibilangan ng Bundok Nebo at Pisga, na umaabot nang humigit-kumulang 700 m sa ibabaw ng dagat at mahigit isang libo sa ibabaw ng libis ng Jordan. Ang Ije-abarim, “ang mga guho ng Abarim”, ay isang naunang kampo “sa hangganan ng Moab”, na mas timog pa. Ipinag-uutos ni Jeremias sa Juda na sumampa sa Libano at Basan at humiyaw mula sa mga daanan, sa Hebreo ay mula sa Abarim, ang tatlong dakilang tanawan ng lupain."
    - "Ang huling mga kampo ng Israel bago ang mga kapatagan ng Moab ay “sa mga bundok ng Abarim, sa harap ng Nebo”. Dito'y sinabi kay Moises, “Sumampa ka sa bundok na ito ng Abarim, at tanawin mo ang lupain na aking ibinigay sa mga anak ni Israel”, at malalakip siya sa kaniyang bayan gaya ni Aaron sa Bundok Hor; pinangalanan ng Deuteronomio ang tuktok: “bundok na ito ng Abarim, sa bundok ng Nebo na nasa lupain ng Moab, na nasa tapat ng Jerico”. Mula sa taluktok ng Pisga ay ipinakita sa kaniya ng Panginoon ang buong lupain, mula sa Gilead hanggang sa Dan at sa dagat, at doon namatay si Moises sa lupain ng Moab, at walang nakaaalam ng kaniyang libingan."
    - "Kilala ni Eusebio ang Abarim bilang bundok kung saan namatay si Moises, sa daang paakyat mula Livias patungong Hesbon malapit sa Bundok Peor. Ang peregrinang si Egeria noong dekada 380 ay dinala paakyat mula Livias hanggang sa tuktok ng Nebo at ipinakita ang isang maliit na simbahan na, ayon sa mga monghe, ay pinaglagakan ng mga anghel kay Moises. Ang simbahang iyon, na pinalaki noong huling bahagi ng ika-5 siglo at noong ika-6 na siglo bilang isang basilika na may magagandang mosaiko, ay hinukay ng mga Pransiskano mula 1933; nakatayo itong naibalik sa Siyagha (Bundok Nebo), mga 9 km sa hilagang-kanluran ng Madaba sa Jordan, na may tanaw na ipinagkaloob kay Moises sa ibayo ng libis ng Jordan hanggang Jerico at, sa maaliwalas na araw, hanggang Jerusalem."
  da:
    - "Abarim, »egnene hinsides«, er det bibelske navn på bjergene øst for Det Døde Hav og den nedre Jordan: den moabitiske højsletes vestlige rand set fra Israels land, højderne, der omfatter Nebo-bjerget og Pisga, og som rejser sig omkring 700 m over havet og mere end tusind over Jordandalen. Ijje-ha-Abarim, »Abarims ruiner«, var en tidligere lejrplads »ved Moabiternes Landemærke«, længere mod syd. Jeremias byder Juda gå op til Libanon og Basan og råbe fra Abarim (King James Version: »fra overgangene«), landets tre store udsigtspunkter."
    - "Israels sidste lejre før Moabs sletter lå »ved Abarims Bjerge, foran Nebo«. Her fik Moses besked: »Gak op paa dette Bjerg Abarim og bese Landet, som jeg har givet Israels Børn«, og han skulle samles til sit folk, som Aron var blevet det på Hor-bjerget; 5 Mosebog nævner toppen: »dette Abarims Bjerg, paa Nebo Bjerg, som er i Moabs Land, som er lige for Jeriko«. Fra Pisgas top lod Herren ham se hele landet, fra Gilead til Dan og til havet, og Moses døde dér i Moabs land, og ingen kender hans grav."
    - "Eusebios kendte Abarim som bjerget, hvor Moses døde, på vejen op fra Livias til Hesjbon nær Peor-bjerget. Pilgrimmen Egeria blev i 380'erne ført op fra Livias til Nebos top og vist en lille kirke, hvor englene ifølge munkene havde lagt Moses. Den kirke, der i slutningen af 400-tallet og i 500-tallet blev udvidet til en basilika med smukke mosaikker, blev udgravet af franciskanerne fra 1933; den står restaureret ved Siyagha (Nebo-bjerget), omkring 9 km nordvest for Madaba i Jordan, med den udsigt, Moses fik, hen over Jordandalen til Jeriko og, på en klar dag, til Jerusalem."
  sr:
    - "Аварим, „крајеви са друге стране“, библијски је назив за планине источно од Мртвог мора и доњег Јордана: западни обод моавске висоравни како се види из земље Израиљеве, висови међу којима су гора Нево и Фазга, високи око 700 м изнад мора и више од хиљаду изнад јорданске долине. Ије-Аварим, „развалине Аварима“, био је ранији логор „на међи моавској“, даље на југу. Јеремија налаже Јуди да изиђе на Ливан и Васан и да виче „преко бродова“, на хебрејском из Аварима, са три велика осматрачка места земље."
    - "Последњи израиљски логори пред моавским пољем били су „у планинама аваримским према Нававу“. Овде је Мојсију речено: „Изиђи на гору ову аваримску, и види земљу коју сам дао синовима Израиљевим“, и да ће се прибрати к роду свом као што се прибрао Арон на гори Ору; Поновљени закон именује врх: „на ову гору аваримску, на гору Навав, која је у земљи моавској према Јерихону“. Са врха Фазге Господ му је показао сву земљу, од Галада до Дана и до мора, и Мојсије је онде умро у земљи моавској, и нико не зна за гроб његов."
    - "Јевсевије је Аварим знао као гору на којој је умро Мојсије, на путу од Ливијаде ка Есевону, близу горе Фегор. Ходочасница Егерија је 380-их година одведена од Ливијаде на врх Нева и показана јој је мала црква у којој су, како су јој рекли монаси, анђели положили Мојсија. Та црква, проширена крајем петог и у 6. веку у базилику с лепим мозаицима, ископавана је од 1933. године од стране фрањеваца; обновљена стоји у Сијаги (гора Нево), око 9 км северозападно од Мадабе у Јордану, с погледом који је Мојсије имао преко јорданске долине на Јерихон и, по ведром дану, на Јерусалим."
  hu:
    - "Abárim, „a túloldali vidékek”, a Holt-tengertől és az alsó Jordántól keletre fekvő hegyek bibliai neve: a moábi fennsík nyugati pereme az Izráel földje felől nézve, azok a magaslatok, amelyek között a Nébó-hegy és a Piszga is van, és amelyek mintegy 700 m-rel emelkednek a tenger fölé, a Jordán-völgy fölé pedig több mint ezer méterrel. Az Ijjé-Abárim, „Abárim romjai” egy korábbi tábor volt „a Moáb határán”, délebbre. Jeremiás arra szólítja Júdát, hogy menjen fel a Libanonra és Básánra, és kiáltson – a héberben az Abarimról (egyes fordításokban az átjárókról) –, vagyis a föld három nagy kilátópontjáról."
    - "Izráel utolsó táborai a Moáb mezősége előtt „az Abarim hegységnél, Nébó ellenében” voltak. Itt mondta az Úr Mózesnek: „Menj fel az Abarim hegyére, és lásd meg a földet, a melyet Izráel fiainak adtam”, és takaríttassék a népéhez, ahogyan Áron is a Hór-hegyen; a Deuteronomium megnevezi a csúcsot: „Menj fel ebbe az Abarim hegységbe, a Nébó hegyére, a mely Moáb földén van és pedig Jérikhóval átellenben”. A Piszga tetejéről az Úr megmutatta neki az egész földet Gileádtól Dánig és a tengerig, és Mózes ott halt meg Moáb földjén, sírját pedig senki sem ismeri."
    - "Euszébiosz Abárimot úgy ismerte, mint azt a hegyet, ahol Mózes meghalt, a Liviasból Hesbonba vezető úton, a Peór-hegy közelében. Egéria zarándok a 380-as években Liviasból felvezették a Nébó csúcsára, és megmutattak neki egy kis templomot, ahová – mondták a szerzetesek – az angyalok Mózest letették. Ezt a templomot az 5. század végén és a 6. században bazilikává bővítették szép mozaikokkal; 1933-tól a ferencesek tárták fel, és helyreállítva áll Siyaghában (Nébó-hegy), Mádabától mintegy 9 km-re északnyugatra, Jordániában, azzal a kilátással, amelyet Mózes kapott a Jordán-völgyön át Jerikóra, tiszta időben pedig Jeruzsálemig."
  fi:
    - "Abarim, ”takana olevat seudut”, on Raamatun nimi Kuolleenmeren ja Jordanin alajuoksun itäpuolisille vuorille: Moabin ylängön länsireunalle sellaisena kuin se näkyy Israelin maasta, korkeuksille, joihin kuuluvat Nebovuori ja Pisga ja jotka kohoavat noin 700 metriä meren pinnan yläpuolelle ja yli tuhat metriä Jordanin laakson yläpuolelle. Ijje-Abarim, ”Abarimin rauniot”, oli aiempi leiripaikka kauempana etelässä, jonka Raamattu sijoittaa ”Mooabin rajalle”. Jeremia käskee Juudan nousta Libanonille ja Basaniin ja huutaa ”Abarimin vuorilta” (englanninkielisessä käännöksessä ”solista”, heprean tekstissä Abarimista), maan kolmelta suurelta tähystyspaikalta."
    - "Israelin viimeiset leirit ennen Moabin arotasankoja olivat siellä, minne he ”leiriytyivät Abarimin vuoristoon vastapäätä Neboa”. Täällä Moosekselle sanottiin: ”Nouse tälle Abarimin vuorelle ja katsele sitä maata, jonka minä annan israelilaisille”, ja hänet otettaisiin pois heimonsa tykö, niinkuin Aaron oli otettu Horinvuorella; 5. Mooseksen kirja nimeää huipun: ”Nouse tänne Abarimin vuoristoon, Nebon vuorelle, joka on Mooabin maassa vastapäätä Jerikoa”. Pisgan huipulta Herra näytti hänelle koko maan Gileadista Daaniin ja mereen asti, ja Mooses kuoli siellä Moabin maassa, eikä kukaan tiedä hänen hautaansa."
    - "Eusebios tunsi Abarimin vuorena, jolla Mooses kuoli, Liviaksesta Hesbonia kohti nousevan tien varrella lähellä Peorin vuorta. Pyhiinvaeltaja Egeria johdettiin 380-luvulla Liviaksesta Nebon huipulle, ja hänelle näytettiin pieni kirkko, johon munkkien mukaan enkelit olivat laskeneet Mooseksen. Tuo kirkko, joka laajennettiin 400-luvun lopulla ja 500-luvulla hienoin mosaiikein koristetuksi basilikaksi, kaivettiin esiin fransiskaanien toimesta vuodesta 1933 alkaen; se on entisöitynä Siyaghassa (Nebovuori), noin 9 km Madabasta luoteeseen Jordaniassa, ja sieltä avautuu se näkymä, jonka Mooses sai: yli Jordanin laakson Jerikoon ja selkeällä säällä Jerusalemiin."
  vi:
    - "A-ba-rim, nghĩa là “những miền bên kia”, là tên trong Kinh Thánh chỉ các dãy núi phía đông Biển Chết và hạ lưu sông Giô-đanh: rìa phía tây của cao nguyên Mô-áp nhìn từ xứ Y-sơ-ra-ên, gồm các đỉnh có núi Nê-bô và Phích-ga, cao khoảng 700 m so với mặt biển và hơn một nghìn mét so với thung lũng Giô-đanh. Y-giê A-ba-rim, “những đống đổ nát của A-ba-rim”, là một nơi đóng trại trước đó “trên bờ cõi Mô-áp”, nằm xa hơn về phía nam. Giê-rê-mi truyền cho Giu-đa hãy lên Li-ban và Ba-san và kêu la “từ chót núi”, trong tiếng Hê-bơ-rơ là từ A-ba-rim, tức ba điểm quan sát lớn của xứ này."
    - "Những nơi đóng trại cuối cùng của dân Y-sơ-ra-ên trước khi đến đồng bằng Mô-áp là “tại núi A-ba-rim trước Nê-bô”. Tại đây Môi-se được phán rằng: “Hãy lên trên núi A-ba-rim nầy và nhìn xem xứ mà ta đã ban cho dân Y-sơ-ra-ên”, và rồi sẽ được về cùng tổ phụ như A-rôn đã được về trên núi Hô-rơ; sách Phục Truyền Luật Lệ Ký chỉ rõ đỉnh núi: “núi A-ba-rim, trên đỉnh Nê-bô, ở trong xứ Mô-áp, đối ngang Giê-ri-cô”. Từ đỉnh Phích-ga, Đức Giê-hô-va cho ông xem toàn xứ, “từ Ga-la-át chí Đan” và cho đến biển Tây; Môi-se qua đời tại đó trong xứ Mô-áp, và “cho đến ngày nay không có ai biết được mộ của người”."
    - "Eusebius biết A-ba-rim là ngọn núi nơi Môi-se qua đời, trên đường từ Livias lên Hết-bôn, gần núi Phê-ô. Nữ hành hương Egeria vào những năm 380 được dẫn từ Livias lên đỉnh Nê-bô và được cho xem một nhà thờ nhỏ, nơi các thầy tu nói với bà rằng các thiên sứ đã đặt Môi-se. Nhà thờ ấy, được mở rộng vào cuối thế kỷ 5 và trong thế kỷ 6 thành một thánh đường có những bức khảm tinh xảo, được các tu sĩ dòng Phan-xi-cô khai quật từ năm 1933; nay nó được phục dựng tại Siyagha (núi Nê-bô), cách Madaba ở Gióc-đa-ni khoảng 9 km về phía tây bắc, với tầm nhìn mà Môi-se đã được ban, qua thung lũng Giô-đanh tới Giê-ri-cô và, vào ngày trời quang, tới Giê-ru-sa-lem."
  ro:
    - "Abarim, „regiunile de dincolo”, este numele biblic al munților de la est de Marea Moartă și de cursul inferior al Iordanului: marginea de vest a platoului moabit, văzută din țara lui Israel, înălțimile care includ muntele Nebo și Pisga, ridicându-se la aproximativ 700 m deasupra mării și la mai mult de o mie deasupra văii Iordanului. Ie-Abarim, „ruinele Abarimului”, era o tabără mai veche, „dincoace de hotarele lui Moav”, mai spre sud. Ieremia îndeamnă Iuda să se suie în Liban și în Basan și să strige din locurile de trecere, în ebraică din Abarim, cele trei mari puncte de observație ale țării."
    - "Ultimele tabere ale lui Israel înainte de câmpiile Moabului au fost „la munții Avarim împreajma Navavului”. Aici Moise a primit porunca să se suie pe acest munte Abarim și să vadă țara pe care Domnul a dat-o fiilor lui Israel, apoi să se adauge la poporul său, așa cum se adăugase Aaron pe muntele Hor; Deuteronomul numește culmea: muntele Abarim, până la muntele Nebo, care este în țara Moabului, în fața Ierihonului. Din vârful Pisgăi, Domnul i-a arătat toată țara, de la Galaad până la Dan și până la mare, iar Moise a murit acolo, în țara Moabului, și nimeni nu știe unde este mormântul lui."
    - "Eusebiu cunoștea Abarimul ca muntele în care a murit Moise, pe drumul care urcă de la Livias spre Hesbon, aproape de muntele Peor. Pelerina Egeria a fost dusă, în anii 380, de la Livias până în vârful muntelui Nebo și i s-a arătat o bisericuță în care, după spusele călugărilor, îngerii îl așezaseră pe Moise. Biserica aceea, extinsă la sfârșitul secolului al V-lea și în secolul al VI-lea într-o bazilică cu mozaicuri alese, a fost cercetată arheologic de franciscani începând din 1933; ea se află restaurată la Siyagha (muntele Nebo), la aproximativ 9 km nord-vest de Madaba, în Iordania, cu priveliștea oferită lui Moise peste valea Iordanului până la Ierihon și, în zilele senine, până la Ierusalim."
  bg:
    - "Аварим, „отвъдните области“, е библейското название на планините на изток от Мъртво море и долното течение на Йордан: западният край на моавското плато, погледнат от Израилевата земя, възвишенията, към които принадлежат планината Нево и Фасга и които се издигат на около 700 м над морето и на повече от хиляда над долината на Йордан. Ийе-Аварим, „развалините на Аварим“, е по-ранен стан „в пределите на Моав“, по на юг. Йеремия призовава Юда да се изкачи на Ливан и Васан и да извика „от Аварим“, тоест от проходите — трите големи наблюдателници на страната."
    - "Последните стануваня на Израил преди моавските полета били „на горите Аварим, срещу Нево“. Тук на Мойсей било казано: „Възлез на таз гора Аварим и виж земята която дадох на Израилевите синове“, и да се прибере при своите люде, както се прибрал Аарон на планината Хор; Второзаконие назовава върха: „на тая гора Аварим, гората Нево, която е в Моавовата земя срещу Иерихон“. От върха на Фасга Господ му показал цялата земя от Галаад до Дан и до морето, а Мойсей умрял там, в Моавовата земя, и „никой не знае гроба му дори до днес“."
    - "Евсевий знаел Аварим като планината, където умрял Мойсей, по пътя нагоре от Ливиас към Есевон, близо до планината Фегор. Поклонничката Егерия през 380-те години била изведена от Ливиас до върха на Нево и ѝ показали малка църква, където според монасите ангелите положили Мойсей. Тази църква, разширена в края на V и през VI в. в базилика с изящни мозайки, е разкопана от францисканците от 1933 г.; днес тя стои възстановена в Сиягха (планината Нево), на около 9 км северозападно от Мадаба в Йордания, с гледката, дадена на Мойсей, през долината на Йордан към Йерихон и, в ясно време, към Йерусалим."
