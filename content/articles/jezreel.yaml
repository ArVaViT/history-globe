# Overview article (ADR 0007). Mainstream facts only; disputed datings are named as such.
id: jezreel
place: ae0bf4a
title:
  en: "Jezreel"
  ru: "Изреель"
  uk: "Їзреель"
  es: "Jezreel"
  pt: "Jezreel"
  de: "Jesreel"
  fr: "Jizreel"
