body:
  en:
    - 'Jezreel stood on a low hill at the foot of Mount Gilboa, at the eastern end of the Jezreel Valley, above a spring; the site is Tel Jezreel, by the former village of Zer''in. The earliest finds on the site go back to the fifth millennium BC, and an unwalled village stood here in the Bronze Age. In Joshua, Jezreel lies on the border of Issachar. Before the battle of Gilboa the Israelites pitched "by a fountain which is in Jezreel", and Abner later made Ish-bosheth, Saul''s son, king over Jezreel and all Israel.'
    - 'Under the house of Omri, Jezreel was a royal residence. Elijah ran before Ahab''s chariot to Jezreel. Next to Ahab''s palace lay the vineyard of Naboth the Jezreelite; when Naboth would not sell it, Jezebel had him stoned on false witness, and Elijah foretold that dogs would eat Jezebel by the wall of Jezreel. Ahab''s son Joram came back here to be healed of wounds from the war with Hazael of Syria. Jehu shot Joram in the field of Naboth, had Jezebel thrown down from a window and received in baskets the heads of Ahab''s seventy sons. Hosea named his son Jezreel, for the LORD said, "I will avenge the blood of Jezreel upon the house of Jehu".'
    - "Excavations by David Ussishkin and John Woodhead in 1990–1996 uncovered a large rectangular royal enclosure of the Iron Age, with a casemate wall, corner towers, a gate and a moat. The excavators date it to the ninth century BC, the time of the Omride kings, and it was used only for a short time; its dating became part of the wider dispute over the chronology of Iron Age Israel. A new survey and excavation project at the site began in 2012."
    - "Later settlement was smaller. In the fourth century AD Eusebius knew Esdraela as a very large village in the Great Plain between Scythopolis and Legio, and the excavators found the remains of a Byzantine village on the mound."
  ru:
    - "Изреель стоял на невысоком холме у подножия горы Гелвуй, у восточного края Изреельской долины, над источником; это Тель-Изреель, рядом с бывшей деревней Зерин. Древнейшие находки здесь относятся к V тысячелетию до н. э., а в бронзовом веке тут стояло неукреплённое селение. В книге Иисуса Навина Изреель лежит в пределах Иссахара. Перед битвой на Гелвуе израильтяне расположились станом «у источника, что в Изрееле», а позже Авенир воцарил Иевосфея, сына Саула, над Изреелем и над всем Израилем."
    - "При доме Амврия Изреель был царской резиденцией. Илия бежал перед колесницей Ахава до самого Изрееля. Подле дворца Ахава был виноградник Навуфея Изреелитянина; когда Навуфей не захотел продать его, Иезавель велела побить его камнями по ложному свидетельству, а Илия предсказал, что псы съедят Иезавель за стеною Изрееля. Сын Ахава Иорам вернулся сюда лечиться от ран, полученных в войне с Азаилом, царём Сирийским. Ииуй поразил Иорама стрелой на поле Навуфея, велел выбросить Иезавель из окна и получил в корзинах головы семидесяти сыновей Ахава. Осия назвал сына Изреелем, ибо Господь сказал: «Я взыщу кровь Изрееля с дома Ииуева»."
    - "Раскопки Давида Уссишкина и Джона Вудхеда в 1990–1996 гг. открыли большую прямоугольную царскую ограду железного века с казематной стеной, угловыми башнями, воротами и рвом. Раскопщики датируют её IX веком до н. э., временем царей из дома Амврия, и она использовалась лишь недолго; её датировка стала частью более широкого спора о хронологии Израиля железного века. Новый проект разведки и раскопок на этом месте начался в 2012 г."
    - "Позднее поселение было меньше. В IV веке н. э. Евсевий знал Ездраэлу как очень большое селение на Великой равнине между Скифополем и Легионом, а раскопщики нашли на холме остатки византийского селения."
  uk:
    - "Їзреель стояв на низькому пагорбі біля підніжжя гори Гільбоа, на східному кінці долини Їзреель, над джерелом; місце — Тель-Їзреель, біля колишнього села Зерін. Найраніші знахідки на місці сягають V тисячоліття до н. е., а необнесене село стояло тут у бронзовому віці. У Книзі Ісуса Навина Їзреель лежить на межі Іссахара. Перед битвою на Гілбоа ізраїльтяни отаборилися «коло криницї під Езреелем», а Авенір пізніше зробив Ішбошета, сина Саула, царем над Їзреелем і всім Ізраїлем."
    - "За дому Омрі Їзреель був царською резиденцією. Ілля біг перед колісницею Ахава до Їзреелю. Поруч із палацом Ахава лежав виноградник Навуфея Їзреелянина; коли Навуфей не захотів його продати, Єзавель звеліла побити його камінням за неправдивим свідченням, а Ілля передбачив, що пси з’їдять Єзавель біля муру Їзреелю. Син Ахава Йорам повернувся сюди зцілюватися від ран у війні з Азаїлом Сирійським. Єгу вистрілив у Йорама на полі Навуфея, звелів скинути Єзавель із вікна й прийняв у кошиках голови сімдесяти синів Ахава. Осія назвав свого сина Їзреель, бо Господь сказав: «навідаю я карою за кров Езреелеву дом Егуїв»."
    - "Розкопки Девіда Усишкіна і Джона Вудгеда в 1990–1996 роках відкрили велику прямокутну царську огорожу залізного віку з казематним муром, кутовими вежами, брамою й ровом. Розкопувачі датують її IX ст. до н. е., часом царів з дому Омрі, і вона використовувалася лише недовго; її датування стало частиною ширшої суперечки про хронологію Ізраїлю залізного віку. Новий проєкт обстеження й розкопок на місці розпочався 2012 року."
    - "Пізніше поселення було меншим. У IV ст. н. е. Євсевій знав Есдраелу як дуже велике село у Великій рівнині між Скитополем і Легіоном, а розкопувачі знайшли на городищі рештки візантійського села."
  es:
    - "Jezreel se alzaba en una colina baja al pie del monte Gilboa, en el extremo oriental del valle de Jezreel, sobre un manantial; el sitio es Tel Jezreel, junto a la antigua aldea de Zer'in. Los hallazgos más antiguos del sitio se remontan al quinto milenio a. C., y una aldea sin muralla se alzó aquí en la Edad del Bronce. En Josué, Jezreel se halla en la frontera de Isacar. Antes de la batalla de Gilboa los israelitas acamparon «junto á la fuente que está en Jezreel», y Abner hizo más tarde a Is-boset, hijo de Saúl, rey sobre Jezreel y todo Israel."
    - "Bajo la casa de Omri, Jezreel fue residencia real. Elías corrió delante del carro de Acab hasta Jezreel. Junto al palacio de Acab estaba la viña de Nabot el jezreelita; cuando Nabot no quiso venderla, Jezabel lo hizo apedrear con falso testimonio, y Elías anunció que los perros comerían a Jezabel junto al muro de Jezreel. Joram, hijo de Acab, volvió aquí para curarse de las heridas de la guerra con Hazael de Siria. Jehú flechó a Joram en el campo de Nabot, hizo arrojar a Jezabel por una ventana y recibió en canastillos las cabezas de los setenta hijos de Acab. Oseas puso a su hijo el nombre de Jezreel, porque el Señor dijo: «yo visitaré las sangres de Jezreel sobre la casa de Jehú»."
    - "Las excavaciones de David Ussishkin y John Woodhead en 1990–1996 sacaron a la luz un gran recinto real rectangular de la Edad del Hierro, con un muro de casamatas, torres en las esquinas, una puerta y un foso. Los excavadores lo fechan en el siglo IX a. C., la época de los reyes omridas, y se usó solo por breve tiempo; su datación pasó a formar parte de la disputa más amplia sobre la cronología del Israel de la Edad del Hierro. En 2012 comenzó un nuevo proyecto de prospección y excavación en el sitio."
    - "El poblamiento posterior fue menor. En el siglo IV d. C. Eusebio conocía Esdraela como una aldea muy grande de la Gran Llanura entre Escitópolis y Legio, y los excavadores hallaron los restos de una aldea bizantina en el montículo."
  pt:
    - "Jezreel erguia-se numa colina baixa ao pé do monte Gilboa, na extremidade oriental do vale de Jezreel, acima de uma fonte; o sítio é Tel Jezreel, junto à antiga aldeia de Zer’in. Os achados mais antigos no sítio remontam ao quinto milênio a.C., e uma aldeia sem muralha ali existiu na Idade do Bronze. Em Josué, Jezreel fica na fronteira de Issacar. Antes da batalha de Gilboa os israelitas acamparam “junto à fonte que fica em Jezreel”, e Abner fez depois de Is-Bosete, filho de Saul, rei sobre Jezreel e todo o Israel."
    - "Sob a casa de Onri, Jezreel foi residência real. Elias correu diante do carro de Acabe até Jezreel. Junto ao palácio de Acabe ficava a vinha de Nabote, o jezreelita; quando Nabote não quis vendê-la, Jezabel o mandou apedrejar sob falso testemunho, e Elias predisse que os cães comeriam Jezabel junto ao muro de Jezreel. Jorão, filho de Acabe, voltou aqui para ser curado dos ferimentos da guerra contra Hazael da Síria. Jeú atirou em Jorão no campo de Nabote, mandou lançar Jezabel de uma janela e recebeu em cestos as cabeças dos setenta filhos de Acabe. Oseias deu a seu filho o nome Jezreel, pois o SENHOR disse: “vingarei o sangue de Jezreel sobre a casa de Jeú”."
    - "As escavações de David Ussishkin e John Woodhead em 1990–1996 trouxeram à luz um grande recinto real retangular da Idade do Ferro, com muralha de casamatas, torres de canto, portão e fosso. Os escavadores o datam do século IX a.C., o tempo dos reis da casa de Onri, e foi usado só por pouco tempo; sua datação tornou-se parte da disputa mais ampla sobre a cronologia do Israel da Idade do Ferro. Um novo projeto de prospecção e escavação no sítio começou em 2012."
    - "O povoamento posterior foi menor. No século IV d.C., Eusébio conheceu Esdraela como uma aldeia muito grande na Grande Planície entre Citópolis e Legião, e os escavadores acharam restos de uma aldeia bizantina no monte."
  de:
    - "Jesreel stand auf einem niedrigen Hügel am Fuß des Gilboa, am Ostende des Jesreeltals, über einer Quelle; die Stätte ist Tel Jesreel beim ehemaligen Dorf Zer'in. Die frühesten Funde an der Stätte reichen ins 5. Jahrtausend v. Chr. zurück, und in der Bronzezeit stand hier ein unummauertes Dorf. Bei Josua liegt Jesreel an der Grenze Issachars. Vor der Schlacht am Gilboa lagerten die Israeliten an der Quelle in Jesreel, und Abner machte später Isch-Boschet, Sauls Sohn, zum König über Jesreel und ganz Israel."
    - "Unter dem Haus Omri war Jesreel eine königliche Residenz. Elia lief vor Ahabs Wagen her nach Jesreel. Neben Ahabs Palast lag der Weinberg Nabots, des Jesreeliten; als Nabot ihn nicht verkaufen wollte, ließ Isebel ihn aufgrund falschen Zeugnisses steinigen, und Elia kündigte an, die Hunde würden Isebel an der Mauer Jesreels fressen. Ahabs Sohn Joram kam hierher zurück, um von den Wunden des Krieges mit Hasaël von Syrien zu genesen. Jehu erschoss Joram auf dem Acker Nabots, ließ Isebel aus dem Fenster stürzen und empfing in Körben die Köpfe von Ahabs siebzig Söhnen. Hosea nannte seinen Sohn Jesreel, denn der HERR sprach: „so will ich die Blutschulden in Jesreel heimsuchen über das Haus Jehu“."
    - "Grabungen von David Ussishkin und John Woodhead 1990–1996 legten einen großen rechteckigen königlichen Bezirk der Eisenzeit frei, mit Kasemattenmauer, Ecktürmen, Tor und Graben. Die Ausgräber datieren ihn ins 9. Jahrhundert v. Chr., die Zeit der Omriden, und er wurde nur kurz genutzt; seine Datierung wurde Teil des weiteren Streits um die Chronologie des eisenzeitlichen Israel. Ein neues Survey- und Grabungsprojekt an der Stätte begann 2012."
    - "Die spätere Besiedlung war kleiner. Im 4. Jahrhundert n. Chr. kannte Eusebius Esdraela als sehr großes Dorf in der Großen Ebene zwischen Skythopolis und Legio, und die Ausgräber fanden Reste eines byzantinischen Dorfes auf dem Hügel."
  fr:
    - "Jizreel se dressait sur une colline basse au pied du mont Guilboa, à l’extrémité orientale de la vallée de Jizreel, au-dessus d’une source ; le site est Tel Jezreel, près de l’ancien village de Zer’in. Les plus anciennes trouvailles du site remontent au Ve millénaire av. J.-C., et un village sans murs s’y trouvait à l’âge du Bronze. Chez Josué, Jizreel se trouve sur la frontière d’Issacar. Avant la bataille de Guilboa, les Israélites campèrent « près de la source de Jizreel », et Abner fit plus tard d’Isch-Boscheth, fils de Saül, le roi sur Jizreel et tout Israël."
    - "Sous la maison d’Omri, Jizreel fut une résidence royale. Élie courut devant le char d’Achab jusqu’à Jizreel. À côté du palais d’Achab se trouvait la vigne de Naboth le Jizréelite ; quand Naboth refusa de la vendre, Jézabel le fit lapider sur de faux témoignages, et Élie annonça que les chiens mangeraient Jézabel près du rempart de Jizreel. Joram, fils d’Achab, revint ici se faire soigner de blessures reçues dans la guerre contre Hazaël de Syrie. Jéhu tira sur Joram dans le champ de Naboth, fit jeter Jézabel par une fenêtre et reçut dans des corbeilles les têtes des soixante-dix fils d’Achab. Osée appela son fils Jizreel, car l’Éternel avait dit : « je châtierai la maison de Jéhu pour le sang versé à Jizreel »."
    - "Les fouilles de David Ussishkin et de John Woodhead en 1990–1996 ont mis au jour une grande enceinte royale rectangulaire de l’âge du Fer, avec un mur à casemates, des tours d’angle, une porte et un fossé. Les fouilleurs la datent du IXe siècle av. J.-C., temps des rois omrides, et elle ne fut utilisée que peu de temps ; sa datation est entrée dans le débat plus large sur la chronologie de l’Israël de l’âge du Fer. Un nouveau projet de prospection et de fouilles sur le site a commencé en 2012."
    - "L’occupation ultérieure fut plus petite. Au IVe siècle apr. J.-C., Eusèbe connaissait Esdraela comme un très grand village de la Grande Plaine entre Scythopolis et Legio, et les fouilleurs ont trouvé sur le tertre les vestiges d’un village byzantin."
  pl:
    - "Jizreel stał na niskim wzgórzu u stóp góry Gilboa, na wschodnim końcu doliny Jizreel, nad źródłem; miejscem jest Tel Jizreel, koło dawnej wsi Zer'in. Najwcześniejsze znaleziska na stanowisku sięgają V tysiąclecia p.n.e., a niemurowana wieś stała tu w epoce brązu. U Jozuego Jizreel leży na granicy Issachara. Przed bitwą na Gilboa Izraelici rozłożyli się obozem „nad źródłem, które było w Jezreelu”, a Abner później ustanowił Isz-Boszeta, syna Saula, królem nad Jizreel i całym Izraelem."
    - "Za domu Omriego Jizreel był rezydencją królewską. Eliasz biegł przed rydwanem Achaba do Jizreel. Obok pałacu Achaba leżała winnica Nabota Jizreelity; gdy Nabot nie chciał jej sprzedać, Izebel kazała go ukamienować na fałszywe świadectwo, a Eliasz zapowiedział, że psy zjedzą Izebel przy murze Jizreel. Syn Achaba Joram wrócił tu, by się leczyć z ran z wojny z Chazaelem z Syrii. Jehu zastrzelił Jorama na polu Nabota, kazał zrzucić Izebel z okna i przyjął w koszach głowy siedemdziesięciu synów Achaba. Ozeasz nazwał swego syna Jizreel, bo Pan powiedział: „nawiedzę krew Jezreel nad domem Jehu”."
    - "Wykopaliska Davida Ussishkina i Johna Woodheada w latach 1990–1996 odsłoniły wielkie prostokątne królewskie ogrodzenie z epoki żelaza, z murem kazamatowym, wieżami narożnymi, bramą i fosą. Badacze datują je na IX w. p.n.e., czas królów z rodu Omriego, i używano go tylko krótko; jego datowanie stało się częścią szerszego sporu o chronologię Izraela epoki żelaza. Nowy projekt badań powierzchniowych i wykopalisk na stanowisku rozpoczął się w 2012 r."
    - "Późniejsze osadnictwo było mniejsze. W IV w. n.e. Euzebiusz znał Esdraelę jako bardzo dużą wieś na Wielkiej Równinie między Scytopolis a Legio, a badacze znaleźli na pagórku szczątki wsi bizantyńskiej."
  it:
    - "Izreel sorgeva su una bassa collina ai piedi del Monte Gelboe, all’estremità orientale della valle di Izreel, sopra una sorgente; il sito è Tel Jezreel, presso l’ex villaggio di Zer’in. I più antichi ritrovamenti nel sito risalgono al V millennio a.C., e un villaggio non murato sorgeva qui nell’età del Bronzo. In Giosuè, Izreel si trova sul confine di Issacar. Prima della battaglia del Gelboe gli Israeliti si accamparono «presso la sorgente di Izreel», e Abner fece poi re Is-Baal, figlio di Saul, «di Izreel» e di tutto Israele."
    - "Sotto la casa di Omri, Izreel fu una residenza regia. Elia corse davanti al carro di Acab fino a Izreel. Accanto al palazzo di Acab sorgeva la vigna di Nabot l’Izreelita; quando Nabot non volle venderla, Gezabele lo fece lapidare su falsa testimonianza, ed Elia predisse che i cani avrebbero divorato Gezabele sotto le mura di Izreel. Ioram, figlio di Acab, tornò qui per farsi curare le ferite della guerra con Cazaèl di Siria. Ieu colpì Ioram nel campo di Nabot, fece gettare Gezabele da una finestra e ricevette in ceste le teste dei settanta figli di Acab. Osea chiamò suo figlio Izreel, perché il Signore disse: «io punirò la casa di Jehu a motivo del sangue sparso a Jizreel»."
    - "Gli scavi di David Ussishkin e John Woodhead nel 1990–1996 portarono alla luce un grande recinto regio rettangolare dell’età del Ferro, con un muro a casematte, torri angolari, una porta e un fossato. Gli scavatori lo datano al IX secolo a.C., al tempo dei re omridi, e fu usato solo per breve tempo; la sua datazione divenne parte della più ampia disputa sulla cronologia dell’Israele dell’età del Ferro. Un nuovo progetto di ricognizione e scavo nel sito è iniziato nel 2012."
    - "L’insediamento posteriore fu più piccolo. Nel IV secolo d.C. Eusebio conosceva Esdraela come un grandissimo villaggio nella Grande Pianura fra Scitopoli e Legio, e gli scavatori hanno trovato resti di un villaggio bizantino sul tell."
  nl:
    - "Jizreël stond op een lage heuvel aan de voet van de Gilboa, aan het oostelijke einde van de Vallei van Jizreël, boven een bron; de plaats is Tel Jezreel, bij het voormalige dorp Zer’in. De oudste vondsten ter plaatse gaan terug tot het 5e millennium v.Chr., en in de Bronstijd stond hier een onommuurd dorp. In Jozua ligt Jizreël aan de grens van Issachar. Voor de slag bij de Gilboa legerden de Israëlieten zich “bij de fontein, die bij Jizreel is”, en Abner maakte later Isboset, Sauls zoon, koning over Jizreël en heel Israël."
    - "Onder het huis van Omri was Jizreël een koninklijke residentie. Elia liep voor Achabs wagen uit naar Jizreël. Naast Achabs paleis lag de wijngaard van Nabot de Jizreëliet; toen Nabot hem niet wilde verkopen, liet Izebel hem op valse getuigenis stenigen, en Elia voorspelde dat de honden Izebel bij de muur van Jizreël zouden eten. Achabs zoon Joram kwam hier terug om te genezen van wonden uit de oorlog met Hazaël van Syrië. Jehu schoot Joram neer op het veld van Nabot, liet Izebel uit een venster werpen en ontving in korven de hoofden van Achabs zeventig zonen. Hosea noemde zijn zoon Jizreël, want de HEER zei: “nog een weinig tijds, zo zal Ik de bloedschulden van Jizreel bezoeken over het huis van Jehu”."
    - "Opgravingen van David Ussishkin en John Woodhead in 1990–1996 legden een groot rechthoekig koninklijk omheind complex uit de IJzertijd bloot, met een kazemattenmuur, hoektorens, een poort en een gracht. De opgravers dateren het in de 9e eeuw v.Chr., de tijd van de Omridische koningen, en het werd maar kort gebruikt; de datering werd deel van de bredere discussie over de chronologie van het IJzertijd-Israël. In 2012 begon een nieuw survey- en opgravingsproject op de plaats."
    - "Latere bewoning was kleiner. In de 4e eeuw n.Chr. kende Eusebius Esdraela als een zeer groot dorp in de Grote Vlakte tussen Scythopolis en Legio, en de opgravers vonden resten van een Byzantijns dorp op de heuvel."
  cs:
    - "Jizreel stál na nízkém pahorku na úpatí hory Gilboa, na východním konci Jizreelského údolí, nad pramenem; místem je Tel Jizreel, u bývalé vesnice Cer'in. Nejstarší nálezy na místě sahají do 5. tisíciletí př. n. l. a neopevněná vesnice tu stála v době bronzové. V Jozue leží Jizreel na hranici Isacharově. Před bitvou na Gilboa se Izraelité utábořili „u studnice, kteráž byla v Jezreel“ a Abner později učinil Íš-bošeta, Saulova syna, králem nad Jizreelem a celým Izraelem."
    - "Za domu Omrího byl Jizreel královským sídlem. Elijáš běžel před Achabovým vozem do Jizreelu. Vedle Achabova paláce ležela vinice Nábota Jizreelského; když ji Nábot nechtěl prodat, dala jej Jezábel ukamenovat na křivé svědectví a Elijáš předpověděl, že psi sežerou Jezábel u hradby Jizreelu. Achabův syn Joram se sem vrátil, aby se léčil z ran z války s Chazaelem Syrským. Jehú zastřelil Jorama na Nábotově poli, nechal Jezábel srazit z okna a přijal v košících hlavy Achabových sedmdesáti synů. Ozeáš nazval svého syna Jizreel, neboť Hospodin řekl: „já vyhledávati budu krve Jezreel na domu Jéhu“."
    - "Vykopávky Davida Ussiškina a Johna Woodheada v letech 1990–1996 odkryly velký obdélníkový královský areál z doby železné s kazematovou hradbou, nárožními věžemi, branou a příkopem. Vykopávači jej datují do 9. stol. př. n. l., doby králů z rodu Omrího, a byl užíván jen krátce; jeho datování se stalo součástí širšího sporu o chronologii izraelské doby železné. Nový projekt průzkumu a vykopávek na místě začal roku 2012."
    - "Pozdější osídlení bylo menší. Ve 4. století n. l. znal Eusebios Esdraelu jako velmi velkou vesnici ve Velké pláni mezi Skythopolí a Legio a vykopávači nalezli na pahorku zbytky byzantské vesnice."
  sv:
    - "Jisreel låg på en låg kulle vid foten av Gilboa, i östra änden av Jisreeldalen, ovanför en källa; platsen är Tel Jezreel, vid den forna byn Zer'in. De äldsta fynden på platsen går tillbaka till femte årtusendet f.Kr., och en omurad by stod här under bronsåldern. Hos Josua ligger Jisreel vid Isaskars gräns. Före slaget vid Gilboa slog israeliterna läger ”vid källan i Jisreel”, och Avner gjorde senare Sauls son Ish-Boshet till kung över Jisreel och hela Israel."
    - "Under Omris hus var Jisreel en kunglig residensstad. Elia sprang framför Achavs vagn till Jisreel. Intill Achavs palats låg jisreeliten Navots vingård; när Navot inte ville sälja den lät Isebel stena honom på falskt vittnesbörd, och Elia förutsade att hundar skulle äta Isebel vid Jisreels murar. Achavs son Joram kom hit tillbaka för att läkas från såren i kriget mot Hasael av Syrien. Jehu sköt Joram på Navots åker, lät störta Isebel ned från ett fönster och tog emot Achavs sjuttio söners huvuden i korgar. Hosea gav sin son namnet Jisreel, ty HERREN sade: ”när ännu en liten tid har förgått, skall jag hemsöka Jisreels blodskulder på Jehus hus”."
    - "Utgrävningar av David Ussishkin och John Woodhead 1990–1996 frilade en stor rektangulär kunglig inhägnad från järnåldern, med kasemattmur, hörntorn, port och vallgrav. Utgrävarna daterar den till 800-talet f.Kr., omriddynastins tid, och den användes bara en kort tid; dateringen blev en del av den vidare striden om järnålderns kronologi i Israel. Ett nytt undersöknings- och utgrävningsprojekt på platsen inleddes 2012."
    - "Senare bosättning var mindre. På 300-talet e.Kr. kände Eusebios Esdraela som en mycket stor by på Stora slätten mellan Skytopolis och Legio, och utgrävarna fann lämningar av en bysantinsk by på kullen."
  nb:
    - "Jisreel sto på en lav høyde ved foten av Gilboa, i den østlige enden av Jisreel-dalen, over en kilde; stedet er Tel Jezreel, ved den tidligere landsbyen Zer'in. De tidligste funnene på stedet går tilbake til det femte årtusen f.Kr., og en ubefestet landsby sto her i bronsealderen. Hos Josva ligger Jisreel på Issakars grense. Før slaget ved Gilboa slo israelittene leir «ved kilden i Jisre'el», og Abner gjorde senere Isjbosjet, Sauls sønn, til konge over Jisreel og hele Israel."
    - "Under Omris hus var Jisreel en kongelig residens. Elia løp foran Akabs vogn til Jisreel. Ved siden av Akabs palass lå vingården til jisreelitten Nabot; da Nabot ikke ville selge den, lot Jesabel ham steine på falsk vitnesbyrd, og Elia forutsa at hundene skulle fortære Jesabel ved Jisreels voll. Akabs sønn Joram kom tilbake hit for å lege sår fra krigen mot Hasael av Syria. Jehu skjøt Joram på Nabots mark, lot Jesabel styrte ut av et vindu og mottok i kurver hodene til Akabs sytti sønner. Hosea ga sin sønn navnet Jisreel, for Herren sa: «om en liten stund vil jeg hjemsøke Jisre'els blodskyld på Jehus hus»."
    - "Utgravninger av David Ussishkin og John Woodhead i 1990–1996 avdekket en stor rektangulær kongelig inngjerding fra jernalderen, med kasemattmur, hjørnetårn, en port og en grøft. Utgraverne daterer den til 800-tallet f.Kr., omridekongenes tid, og den ble bare brukt en kort tid; dens datering ble en del av den videre striden om kronologien i jernalderens Israel. Et nytt kartleggings- og utgravningsprosjekt på stedet begynte i 2012."
    - "Senere bosetning var mindre. På 300-tallet e.Kr. kjente Eusebius Esdraela som en svært stor landsby på Den store sletten mellom Skytopolis og Legio, og utgraverne fant rester av en bysantinsk landsby på haugen."
  tl:
    - "Ang Jezreel ay nakatayo sa mababang burol sa paanan ng Bundok Gilboa, sa silangang dulo ng Libis ng Jezreel, sa ibabaw ng isang bukal; ang lugar ay ang Tel Jezreel, sa tabi ng dating nayon ng Zer'in. Ang pinakamaagang natuklasan sa lugar ay bumabalik sa ika-5 milenyo BK, at isang nayong walang pader ang nakatayo rito sa Panahon ng Tanso. Sa Josue, ang Jezreel ay nasa hangganan ng Issachar. Bago ang labanan sa Gilboa nagkampo ang mga Israelita sa “bukal na nasa Jezreel”, at kalaunan ginawa ni Abner si Is-boseth, anak ni Saul, na hari sa Jezreel at sa buong Israel."
    - "Sa ilalim ng sangbahayan ni Omri, ang Jezreel ay tirahan ng hari. Tumakbo si Elias sa unahan ng karo ni Achab patungong Jezreel. Sa tabi ng palasyo ni Achab ang ubasan ni Naboth na Jezreelita; nang ayaw ibenta ni Naboth, ipinabato siya ni Jezabel batay sa bulaang saksi, at inihula ni Elias na kakainin ng mga aso si Jezabel sa tabi ng pader ng Jezreel. Bumalik dito si Joram na anak ni Achab upang gumaling sa mga sugat mula sa digmaan kay Hazael ng Siria. Pinana ni Jehu si Joram sa bukid ni Naboth, ipinatapon si Jezabel mula sa bintana at tumanggap sa mga basket ng ulo ng pitumpung anak ni Achab. Pinangalanan ni Oseas ang kaniyang anak na Jezreel, sapagkat sinabi ng Panginoon, “aking igaganti ang dugo ng Jezreel sa sangbahayan ni Jehu”."
    - "Ang mga paghuhukay nina David Ussishkin at John Woodhead noong 1990–1996 ay nakatuklas ng malaking parihabang maharlikang bakuran ng Panahon ng Bakal, na may dalawahang pader na may mga silid (casemate), mga moog sa sulok, pintuan at hukay. Ipinepetsa ito ng mga naghukay sa ika-9 na siglo BK, ang panahon ng mga haring Omrida, at ginamit lamang ito sa maikling panahon; ang pagpepetsa nito ay naging bahagi ng mas malawak na pagtatalo sa kronolohiya ng Israel sa Panahon ng Bakal. Isang bagong proyekto ng pagsisiyasat at paghuhukay sa lugar ang nagsimula noong 2012."
    - "Mas maliit ang kalaunang paninirahan. Noong ika-4 na siglo AD kilala ni Eusebio ang Esdraela bilang napakalaking nayon sa Malaking Kapatagan sa pagitan ng Scythopolis at Legio, at natagpuan ng mga naghukay ang mga labi ng isang nayong Bisantino sa burol."
  da:
    - "Jizre'el lå på en lav høj ved foden af Gilboa, i den østlige ende af Jizre'el-dalen, over en kilde; stedet er Tel Jezreel, ved den tidligere landsby Zer'in. De tidligste fund på stedet går tilbage til 5. årtusinde f.Kr., og en ubefæstet landsby stod her i bronzealderen. Hos Josva ligger Jizre'el på Issakars grænse. Før slaget ved Gilboa lejrede israelitterne sig »ved den Kilde, som er udi Jisreel«, og Abner gjorde senere Isj-Bosjet, Sauls søn, til konge over Jizre'el og hele Israel."
    - "Under Omris hus var Jizre'el en kongelig residens. Elias løb foran Akabs vogn til Jizre'el. Ved siden af Akabs palads lå vingården tilhørende jizre'elitten Nabot; da Nabot ikke ville sælge den, lod Jezabel ham stene på falsk vidnesbyrd, og Elias forudsagde, at hundene ville æde Jezabel ved Jizre'els mur. Akabs søn Joram kom hertil tilbage for at blive helbredt for sår fra krigen med Hazael af Syrien. Jehu skød Joram på Nabots mark, lod Jezabel kaste ned fra et vindue og modtog i kurve hovederne af Akabs halvfjerds sønner. Hoseas kaldte sin søn Jizre'el, for Herren sagde: »saa vil jeg hjemsøge Jisreels Blodskyld over Jehus Hus«."
    - "Udgravninger af David Ussishkin og John Woodhead i 1990–1996 afdækkede en stor rektangulær kongelig indhegning fra jernalderen, med en kasematmur, hjørnetårne, en port og en grav. Udgraverne daterer den til 800-tallet f.Kr., omridekongernes tid, og den blev kun brugt i en kort tid; dens datering blev en del af den bredere strid om kronologien for jernalderens Israel. Et nyt undersøgelses- og udgravningsprojekt på stedet begyndte i 2012."
    - "Senere bebyggelse var mindre. I 300-tallet e.Kr. kendte Eusebios Esdraela som en meget stor landsby i Den Store Slette mellem Skythopolis og Legio, og udgraverne fandt levn af en byzantinsk landsby på højen."
  sr:
    - "Језраел је стајао на ниском брду у подножју Гелвује, на источном крају долине Језраела, изнад извора; налазиште је Тел Језраел, код некадашњег села Зерин. Најранији налази на локалитету сежу у пети миленијум п. н. е., а незидано село стајало је овде у бронзаном добу. У Исусу Навину Језраел лежи на граници Исахара. Пред битку на Гелвуји Израиљци су стали у логор „код извора у Језраелу“, а Авенир је касније поставио Исвостеја, Саулова сина, за цара над Језраелом и целим Израиљем."
    - "Под Амријевим домом Језраел је био краљевска резиденција. Илија је трчао пред Ахавовим колима до Језраела. Поред Ахавове палате лежао је виноград Навутеја Језраељанина; кад Навутеј није хтео да га прода, Језавеља га је дала каменовати на лажно сведочанство, а Илија је прорекао да ће пси појести Језавељу код зида Језраела. Ахавов син Јорам вратио се овамо да се лечи од рана из рата са Азаилом Сиријским. Јуј је устрелио Јорама на њиви Навутејевој, дао бацити Језавељу кроз прозор и примио у котарицама главе Ахавових седамдесет синова. Осија је свом сину дао име Језраел, јер је Господ рекао: „још мало, па ћу походити крв језраелску на дому Јујевом“."
    - "Ископавања Дејвида Ушишкина и Џона Вудхеда 1990–1996. открила су велику правоугаону краљевску ограду из гвозденог доба, са зидом са казаматима, угаоним кулама, капијом и опкопом. Ископавачи је датују у девети век п. н. е., доба амријевских царева, а коришћена је само кратко; њено датовање постало је део ширег спора о хронологији гвозденог доба Израиља. Нов пројекат истраживања и ископавања на налазишту почео је 2012."
    - "Каснија насеља била су мања. У четвртом веку н. е. Јевсевије је знао Есдраелу као врло велико село у Великој равници између Скитопоља и Легија, а ископавачи су на хумци нашли остатке византијског села."
  hu:
    - "Jezréel egy alacsony dombon állt a Gilbóa-hegy lábánál, a Jezréel-völgy keleti végén, egy forrás fölött; a lelőhely Tel Jezréel, az egykori Zer'in falu mellett. A lelőhely legkorábbi leletei a Kr. e. 5. évezredig nyúlnak vissza, és a bronzkorban fallal nem körülvett falu állt itt. Józsuénál Jezréel Issakár határán fekszik. A gilbóai csata előtt az izraeliták tábort jártak „a forrásnál, mely Jezréel mellett van”, és Abner később Isbósetet, Saul fiát tette királlyá Jezréel és egész Izráel felett."
    - "Omri háza alatt Jezréel királyi rezidencia volt. Illés Aháb szekere előtt futott Jezréelbe. Aháb palotája mellett feküdt a jezréeli Nábót szőlője; amikor Nábót nem akarta eladni, Jézabel hamis tanúvallomás alapján megkövezteté, Illés pedig megjövendölte, hogy a kutyák Jézabelt a jezréeli fal mellett fogják megenni. Aháb fia, Jórám itt tért vissza, hogy begyógyuljanak a Házael szíriai király elleni háborúban kapott sebei. Jéhu Nábót mezején lelőtte Jórámot, Jézabelt kidobatta az ablakból, és kosarakban kapta Aháb hetven fiának fejét. Hóseás fiát Jezréelnek nevezte, mert az Úr azt mondta: „megbüntetem a Jehu házát a Jezréel vére miatt”."
    - "David Ussishkin és John Woodhead 1990–1996-os ásatásai egy nagy, téglalap alakú vaskori királyi udvart tártak fel kazamatafallal, saroktornyokkal, kapuval és árokkal. Az ásatók a Kr. e. 9. századra, az omridák korára keltezik, és csak rövid ideig használták; keltezése a vaskori Izráel kronológiájáról szóló tágabb vita részévé vált. Új felmérési és ásatási projekt 2012-ben kezdődött a helyen."
    - "A későbbi település kisebb volt. A Kr. u. 4. században Eusebius Esdraelát igen nagy falunak ismerte a Szkütopolisz és Legio közötti Nagy-síkságon, az ásatók pedig bizánci falu maradványait találták a halmon."
  fi:
    - "Jisreel sijaitsi matalalla kukkulalla Gilboavuoren juurella, Jisreelin laakson itäpäässä, lähteen yläpuolella; paikka on Tel Jezreel entisen Zer'inin kylän vieressä. Varhaisimmat löydöt paikalta ulottuvat 5. vuosituhannelle eaa., ja pronssikaudella täällä oli muuriton kylä. Joosuassa Jisreel on Isaskarin rajalla. Ennen Gilboan taistelua israelilaiset leiriytyivät ”lähteelle, joka on Jisreelissä”, ja Abner teki myöhemmin Isbosetin, Saulin pojan, kuninkaaksi Jisreelin ja koko Israelin yli."
    - "Omrin suvun aikana Jisreel oli kuninkaallinen asuinpaikka. Elia juoksi Ahabin vaunujen edellä Jisreeliin. Ahabin palatsin vieressä oli jisreeliläisen Nabotin viinitarha; kun Nabot ei myynyt sitä, Isebel antoi kivittää hänet väärän todistuksen perusteella, ja Elia ennusti koirien syövän Isebelin Jisreelin muurin luona. Ahabin poika Joram palasi tänne parantumaan Syyrian Hasaelia vastaan käydyn sodan haavoista. Jehu ampui Joramin Nabotin pellolla, heitätti Isebelin alas ikkunasta ja sai koreissa Ahabin seitsemänkymmenen pojan päät. Hoosea antoi poikansa nimeksi Jisreel, sillä Herra sanoi: ”minä kostan Jisreelin verivelat Jeehun suvulle”."
    - "David Ussishkinin ja John Woodheadin vuosina 1990–1996 tekemät kaivaukset paljastivat suuren suorakaiteen muotoisen rautakautisen kuninkaallisen aitauksen, jossa oli kasemattimuuri, kulmatornit, portti ja vallihauta. Kaivaajat ajoittavat sen 800-luvulle eaa., Omrin kuninkaiden aikaan, ja sitä käytettiin vain lyhyen aikaa; sen ajoituksesta tuli osa laajempaa kiistaa rautakauden Israelin kronologiasta. Uusi kartoitus- ja kaivaushanke paikalla alkoi vuonna 2012."
    - "Myöhempi asutus oli pienempää. 300-luvulla jaa. Eusebios tunsi Esdraelan hyvin suurena kylänä Suuressa tasangossa Skythopoliksen ja Legion välillä, ja kaivaajat löysivät kummulta bysanttilaiskylän jäänteet."
  vi:
    - "Gít-rê-ên đứng trên một ngọn đồi thấp ở chân Núi Ghinh-bô-a, ở đầu đông thung lũng Gít-rê-ên, phía trên một con suối; địa điểm là Tel Jezreel, bên ngôi làng cũ Zer'in. Những phát hiện sớm nhất ở đó có từ thiên niên kỷ 5 TCN, và một ngôi làng không tường bao đã đứng ở đây vào thời Đồ Đồng. Trong sách Giô-suê, Gít-rê-ên nằm trên ranh giới Y-sa-ca. Trước trận Ghinh-bô-a, dân Y-sơ-ra-ên “đóng trại gần suối Gít-rê-ên”, và Áp-ne về sau lập Ích-bô-sết, con Sau-lơ, làm vua trên Gít-rê-ên và cả Y-sơ-ra-ên."
    - "Dưới nhà Ôm-ri, Gít-rê-ên là nơi ở của vua. Ê-li chạy trước xe của A-háp đến Gít-rê-ên. Cạnh cung của A-háp là vườn nho của Na-bốt người Gít-rê-ên; khi Na-bốt không chịu bán, Giê-sa-bên khiến ông bị ném đá bằng lời chứng gian, và Ê-li báo trước rằng chó sẽ ăn thịt Giê-sa-bên bên tường Gít-rê-ên. Giô-ram, con A-háp, trở về đây để được chữa các vết thương từ cuộc chiến với Ha-xa-ên của Sy-ri. Giê-hu bắn Giô-ram trong ruộng của Na-bốt, cho ném Giê-sa-bên xuống từ cửa sổ và nhận trong giỏ đầu của bảy mươi con trai A-háp. Ô-sê đặt tên con trai là Gít-rê-ên, vì Chúa phán: “ta sẽ báo thù cho huyết của Gít-rê-ên nơi nhà Giê-hu”."
    - "Các cuộc khai quật của David Ussishkin và John Woodhead năm 1990–1996 phát lộ một khu vua hình chữ nhật lớn thời Đồ Sắt, với tường hộp, tháp góc, một cổng và một hào. Các nhà khai quật định niên đại vào thế kỷ 9 TCN, thời các vua nhà Ôm-ri, và nó chỉ được dùng trong thời gian ngắn; niên đại của nó trở thành một phần của tranh luận rộng hơn về niên đại Y-sơ-ra-ên thời Đồ Sắt. Một dự án khảo sát và khai quật mới tại địa điểm bắt đầu năm 2012."
    - "Khu định cư về sau nhỏ hơn. Vào thế kỷ 4, Eusebius biết Esdraela là một làng rất lớn trong Đồng bằng Lớn giữa Scythopolis và Legio, và các nhà khai quật tìm thấy di tích một ngôi làng Byzantine trên gò."
  ro:
    - "Izreel se afla pe un deal jos, la poalele Muntelui Ghilboa, la capătul estic al văii Izreelului, deasupra unui izvor; locul este Tel Jezreel, lângă fostul sat Zer'in. Cele mai vechi descoperiri de pe loc merg până în mileniul al V-lea î.Hr., iar un sat fără ziduri s-a aflat aici în Epoca Bronzului. În Iosua, Izreel se află la hotarul lui Isahar. Înaintea bătăliei de la Ghilboa, israeliții au tăbărât „la Izvorul cel din Iezreel”, iar Abner l-a făcut mai târziu rege pe Iș-Boșet, fiul lui Saul, peste Izreel și tot Israelul."
    - "Sub casa lui Omri, Izreel a fost reședință regală. Ilie a alergat înaintea carului lui Ahab până la Izreel. Lângă palatul lui Ahab se afla via lui Nabot izreelitul; când Nabot n-a vrut să o vândă, Izabela l-a pus să fie ucis cu pietre pe mărturie mincinoasă, iar Ilie a prezis că câinii o vor mânca pe Izabela lângă zidul Izreelului. Fiul lui Ahab, Ioram, s-a întors aici ca să se vindece de rănile din războiul cu Hazael al Siriei. Iehu l-a săgetat pe Ioram pe ogorul lui Nabot, a poruncit ca Izabela să fie aruncată de la o fereastră și a primit în coșuri capetele celor șaptezeci de fii ai lui Ahab. Osea și-a numit fiul Izreel, căci Domnul a spus că va izbândi sângele Izreelului asupra casei lui Iehu."
    - "Săpăturile lui David Ussishkin și John Woodhead din 1990–1996 au dezvelit o mare incintă regală dreptunghiulară din Epoca Fierului, cu zid cu casemate, turnuri de colț, o poartă și un șanț. Cei care au săpat o datează în secolul al IX-lea î.Hr., vremea regilor omrizi, și a fost folosită doar scurt timp; datarea ei a devenit parte din disputa mai largă asupra cronologiei Israelului din Epoca Fierului. Un nou proiect de cercetare și săpătură pe loc a început în 2012."
    - "Așezarea de mai târziu a fost mai mică. În secolul al IV-lea d.Hr., Eusebiu cunoștea Esdraela ca un sat foarte mare în Marea Câmpie, între Scythopolis și Legio, iar cei care au săpat au găsit pe movilă rămășițele unui sat bizantin."
  bg:
    - "Изреел стоеше на нисък хълм в подножието на планината Гелвуя, в източния край на Изреелската долина, над един извор; мястото е Тел Изреел, до бившето село Зерин. Най-ранните находки на мястото датират от V хил. пр.н.е., а през бронзовата епоха тук имаше неукрепено село. В книгата на Иисус Навин Изреел лежи на границата на Исахар. Преди битката при Гелвуя израилтяните разположиха стана си „при извора който е в Иезраел“, а по-късно Авенир направи Йевостей, сина на Саул, цар над Изреел и над целия Израил."
    - "При дома на Омри Изреел беше царска резиденция. Илия тича пред колесницата на Ахав до Изреел. До двореца на Ахав беше лозето на Навутей Изреелеца; когато Навутей отказа да го продаде, Йезавел го накара да бъде убит с камъни по лъжливо свидетелство, а Илия предрече, че кучетата ще изядат Йезавел при стената на Изреел. Синът на Ахав Йорам се върна тук, за да се лекува от раните си от войната с Азаил Сирийски. Йеху простреля Йорам в нивата на Навутей, заповяда Йезавел да бъде хвърлена от прозореца и получи в кошници главите на седемдесетте сина на Ахав. Осия нарече сина си Изреел, защото Господ рече: „ще отмъстя за кръвта на Иезраела върху дома на Ииуя“."
    - "Разкопките на Давид Усишкин и Джон Уудхед през 1990–1996 г. разкриха голямо правоъгълно царско заграждение от желязната епоха с казематна стена, ъглови кули, порта и ров. Разкопвачите го датират към IX в. пр.н.е., времето на царете от династията на Омри, и то е било използвано само кратко време; датировката му стана част от по-широкия спор за хронологията на Израил през желязната епоха. През 2012 г. на мястото започна нов проект за проучвания и разкопки."
    - "По-късното заселване беше по-малко. През IV в. н.е. Евсевий познаваше Ездраела като много голямо село в Голямата равнина между Скитопол и Легио, а разкопвачите откриха на могилата останките на византийско село."
