# Overview article (ADR 0007). Mainstream facts only; the springs are placed by the site of Debir, itself an identification.
id: lower-gulloth
place: aacc081
title:
  en: "Lower Gulloth"
  ru: "Источники нижние"
body:
  en:
    - "The lower springs belong to the story of Achsah, Caleb’s daughter. Caleb promised her to whoever took Kirjath-sepher, that is Debir; Othniel took it and married her. When she came to him she asked her father for a gift: “Give me a blessing; for thou hast given me a south land; give me also springs of water. And he gave her the upper springs, and the nether springs.” The story is told twice, in Joshua and again in Judges. The Hebrew word, gulloth, means “basins” or “bowls” of water, and the two springs are named only here; this place is the lower of them, paired with Upper Gulloth."
    - "A “south land”, dry Negev ground, needed water, and the springs must have been near Debir. If Debir is Khirbet Rabud south-west of Hebron, as most now hold after the surveys of the 1960s, the basins can be looked for in the valleys around it, where the map places both springs; but no spring there carries the name, and the location depends wholly on the identification of Debir. Little more can be said."
  ru:
    - "Источники нижние связаны с рассказом об Ахсе, дочери Халева. Халев обещал её тому, кто возьмёт Кириаф-Сефер, то есть Давир; его взял Гофониил и получил её в жёны. Придя к нему, она попросила у отца дара: «дай мне благословение; ты дал мне землю полуденную, дай мне и источники вод. И дал он ей источники верхние и источники нижние». Рассказ повторён дважды — в книге Иисуса Навина и в книге Судей. Еврейское слово «гуллот» значит «чаши», «водоёмы», и оба источника названы только здесь; это место — нижний из них, в паре с верхними источниками."
    - "«Земля полуденная», сухая земля Негева, нуждалась в воде, и источники должны были быть недалеко от Давира. Если Давир — это Хирбет-Рабуд к юго-западу от Хеврона, как ныне считает большинство после обследований 1960-х годов, источники можно искать в долинах вокруг него, где на карте и стоят оба; но ни один источник там не носит этого имени, и место целиком зависит от того, где Давир. Больше сказать почти нечего."
scripture:
  - Josh.15.15-Josh.15.19
  - Judg.1.12-Judg.1.15
sources:
  - "M. Kochavi, 'Khirbet Rabûd = Debir', Tel Aviv 1 (1974)"
  - "R. G. Boling and G. E. Wright, Joshua (Anchor Bible 6, 1982)"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
status: checked
