# Overview article (ADR 0007). Mainstream facts only; the springs are placed by the site of Debir, itself an identification.
id: lower-gulloth
place: aacc081
title:
  en: "Lower Gulloth"
  ru: "Источники нижние"
  uk: "Джерела нижні"
  es: "Gulot de Abajo"
  pt: "Gulote de Baixo"
  de: "Untere Quellen"
  fr: "Sources inférieures"
body:
  en:
    - "The lower springs belong to the story of Achsah, Caleb’s daughter. Caleb promised her to whoever took Kirjath-sepher, that is Debir; Othniel took it and married her. When she came to him she asked her father for a gift: “Give me a blessing; for thou hast given me a south land; give me also springs of water. And he gave her the upper springs, and the nether springs.” The story is told twice, in Joshua and again in Judges. The Hebrew word, gulloth, means “basins” or “bowls” of water, and the two springs are named only here; this place is the lower of them, paired with Upper Gulloth."
    - "A “south land”, dry Negev ground, needed water, and the springs must have been near Debir. If Debir is Khirbet Rabud south-west of Hebron, as most now hold after the surveys of the 1960s, the basins can be looked for in the valleys around it, where the map places both springs; but no spring there carries the name, and the location depends wholly on the identification of Debir. Little more can be said."
  ru:
    - "Источники нижние связаны с рассказом об Ахсе, дочери Халева. Халев обещал её тому, кто возьмёт Кириаф-Сефер, то есть Давир; его взял Гофониил и получил её в жёны. Придя к нему, она попросила у отца дара: «дай мне благословение; ты дал мне землю полуденную, дай мне и источники вод. И дал он ей источники верхние и источники нижние». Рассказ повторён дважды — в книге Иисуса Навина и в книге Судей. Еврейское слово «гуллот» значит «чаши», «водоёмы», и оба источника названы только здесь; это место — нижний из них, в паре с верхними источниками."
    - "«Земля полуденная», сухая земля Негева, нуждалась в воде, и источники должны были быть недалеко от Давира. Если Давир — это Хирбет-Рабуд к юго-западу от Хеврона, как ныне считает большинство после обследований 1960-х годов, источники можно искать в долинах вокруг него, где на карте и стоят оба; но ни один источник там не носит этого имени, и место целиком зависит от того, где Давир. Больше сказать почти нечего."
  uk:
    - "Нижні джерела належать до оповіді про Ахсу, дочку Калеба. Калеб пообіцяв її тому, хто візьме Кіріят-Сефер, тобто Девір; Отніїл узяв його й одружився з нею. Коли вона прийшла до нього, вона попросила в батька дарунку: «Дай менї благословеннє; дав бо єси менї полуденню землю, дай же менї й криничані протоки. І дав їй Калеб криничані протоки верхові й криничані протоки низові.» Оповідь розказано двічі, в Книзі Ісуса Навина й знову в Книзі Суддів. Староєврейське слово гуллот означає «водойми» або «чаші» води, і обидва джерела названі лише тут; це місце — нижнє з них, у парі з Джерелами верхніми."
    - "«Полуденна земля», суха земля Негеву, потребувала води, і джерела мали бути поблизу Девіра. Якщо Девір — це Хірбет-Рабуд на південний захід від Хеврона, як більшість нині вважає після обстежень 1960-х, водойми можна шукати в долинах навколо нього, де мапа й розміщує обидва джерела; але жодне джерело там не носить цієї назви, і розташування цілком залежить від ототожнення Девіра. Більше сказати майже нічого."
  es:
    - "Las fuentes de abajo pertenecen a la historia de Acsa, hija de Caleb. Caleb la prometió a quien tomara Quiriat-séfer, es decir, Debir; Otoniel la tomó y se casó con ella. Cuando ella llegó a él, pidió un regalo a su padre: «Dame bendición: pues que me has dado tierra de secadal, dame también fuentes de aguas. El entonces le dió las fuentes de arriba, y las de abajo». La historia se cuenta dos veces, en Josué y de nuevo en Jueces. La palabra hebrea, gulot, significa «cuencos» o «vasos» de agua, y las dos fuentes se nombran solo aquí; este lugar es la de abajo, emparejada con Gulot de Arriba."
    - "Una «tierra de secadal», suelo árido del Néguev, necesitaba agua, y las fuentes debían de estar cerca de Debir. Si Debir es Khirbet Rabud, al sudoeste de Hebrón, como sostienen hoy la mayoría tras las prospecciones de los años sesenta, los cuencos pueden buscarse en los valles que la rodean, donde el mapa sitúa ambas fuentes; pero ninguna fuente de allí lleva el nombre, y la ubicación depende por completo de la identificación de Debir. Poco más puede decirse."
  pt:
    - "As fontes inferiores pertencem à história de Acsa, filha de Calebe. Calebe a prometeu a quem tomasse Quiriate-Sefer, isto é, Debir; Otniel a tomou e casou-se com ela. Quando ela chegou a ele, pediu um presente ao pai: “Dê-me uma bênção; já que você me deu terras no Sul, dê-me também fontes de água. Então Calebe lhe deu as fontes superiores e as fontes inferiores.” A história é contada duas vezes, em Josué e de novo em Juízes. A palavra hebraica, gulloth, significa “bacias” ou “tigelas” de água, e as duas fontes são nomeadas só aí; este lugar é a inferior delas, emparelhada com Gulote de Cima."
    - "Uma terra do Sul, solo seco do Neguebe, precisava de água, e as fontes devem ter ficado perto de Debir. Se Debir é Khirbet Rabud, a sudoeste de Hebrom, como a maioria hoje sustenta depois das prospecções dos anos 1960, as bacias podem ser procuradas nos vales ao redor, onde o mapa situa as duas fontes; mas nenhuma fonte ali leva o nome, e a localização depende inteiramente da identificação de Debir. Pouco mais se pode dizer."
  de:
    - "Die unteren Quellen gehören zur Geschichte von Achsa, der Tochter Kalebs. Kaleb versprach sie dem, der Kirjat-Sefer, das ist Debir, einnahm; Otniël nahm es ein und heiratete sie. Als sie zu ihm kam, bat sie ihren Vater um ein Geschenk: „Gib mir einen Segen! Denn du hast mir ein Mittagsland gegeben; gib mir auch Wasserquellen! Da gab er ihr die Quellen von oben und unten.“ Die Geschichte wird zweimal erzählt, bei Josua und noch einmal im Buch der Richter. Das hebräische Wort gulloth bedeutet „Becken“ oder „Schalen“ von Wasser, und die beiden Quellen werden nur hier genannt; dieser Ort ist die untere von ihnen, gepaart mit den Oberen Quellen."
    - "Ein „Mittagsland“, trockener Negevboden, brauchte Wasser, und die Quellen müssen nahe bei Debir gelegen haben. Liegt Debir bei Khirbet Rabud südwestlich von Hebron, wie die meisten nach den Surveys der 1960er Jahre nun annehmen, so kann man die Becken in den Tälern ringsum suchen, wo die Karte beide Quellen einträgt; doch keine Quelle dort trägt den Namen, und die Lage hängt ganz an der Gleichsetzung Debirs. Mehr lässt sich kaum sagen."
  fr:
    - "Les sources inférieures appartiennent à l’histoire d’Acsa, fille de Caleb. Caleb la promit à celui qui prendrait Kirjath-Sépher, c’est-à-dire Debir ; Othniel la prit et l’épousa. Lorsqu’elle vint chez lui, elle demanda un présent à son père : « Fais-moi un présent, car tu m’as donné une terre du midi ; donne-moi aussi des sources d’eau. Et il lui donna les sources supérieures et les sources inférieures. » L’histoire est racontée deux fois, dans Josué et de nouveau dans les Juges. Le mot hébreu, gulloth, signifie « bassins » ou « coupes » d’eau, et les deux sources ne sont nommées qu’ici ; ce lieu est la source inférieure, associée aux Gulloth supérieures."
    - "Une « terre du midi », sol sec du Négev, avait besoin d’eau, et les sources devaient se trouver près de Debir. Si Debir est Khirbet Rabud, au sud-ouest d’Hébron, comme la plupart le soutiennent aujourd’hui depuis les prospections des années 1960, on peut chercher les bassins dans les vallées qui l’entourent, où la carte place les deux sources ; mais aucune source n’y porte le nom, et l’emplacement dépend entièrement de l’identification de Debir. On ne peut guère en dire davantage."
scripture:
  - Josh.15.15-Josh.15.19
  - Judg.1.12-Judg.1.15
sources:
  - "M. Kochavi, 'Khirbet Rabûd = Debir', Tel Aviv 1 (1974)"
  - "R. G. Boling and G. E. Wright, Joshua (Anchor Bible 6, 1982)"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
