# Overview article (ADR 0007). Mainstream facts only; the springs are placed by the site of Debir, itself an identification.
id: lower-gulloth
place: aacc081
title:
  en: "Lower Gulloth"
  ru: "Источники нижние"
  uk: "Джерела нижні"
  es: "Gulot de Abajo"
  pt: "Gulote de Baixo"
  de: "Untere Quellen"
  fr: "Sources inférieures"
  it: "Gullot di Sotto"
  pl: "Dolne Gullot"
  nl: "Neder-Gulot"
  cs: "Dolní prameny"
  sv: "Nedre Gullot"
  nb: "Nedre Gullot"
  tl: "Gulloth sa Ibaba"
  da: "Nedre Gullot"
  sr: "Доњи извори"
  hu: "Alsó-Gullót"
