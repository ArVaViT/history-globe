# Overview article (ADR 0007). Mainstream facts only; the gate is placed at the southern tip of the City of David as most do, and is said not to have been found.
id: fountain-gate
place: a2fc4c4
title:
  en: "Fountain Gate"
  ru: "Ворота Источника"
  uk: "Ворота Джерела"
  es: "Puerta de la Fuente"
  pt: "Porta da Fonte"
  de: "Quelltor"
  fr: "Porte de la Source"
  it: "Porta della Fonte"
  pl: "Brama Źródlana"
  nl: "Bronpoort"
  cs: "Pramenná brána"
  sv: "Källporten"
  nb: "Kildeporten"
body:
  en:
    - "The Fountain Gate was a gate of Jerusalem in Nehemiah's day at the southern tip of the City of David, where the Kidron and Hinnom valleys meet, named for a spring below it, En-rogel or the outflow of the Siloam tunnel. Nehemiah met it on his night ride round the broken walls in 445 BC: from the Valley Gate he passed the Dung Gate and came “to the gate of the fountain, and to the king's pool: but there was no place for the beast that was under me to pass”. In the account of the rebuilding, Shallun the son of Col-hozeh “built it, and covered it, and set up the doors thereof, the locks thereof, and the bars thereof, and the wall of the pool of Siloah by the king's garden, and unto the stairs that go down from the city of David”. At the dedication the first procession went “at the fountain gate, which was over against them” up the stairs of the City of David to the Water Gate."
    - "These three verses fix the gate between the Dung Gate, the pool of Siloam with the king's garden, and the stairs of the City of David, that is at the south-east corner of the old city on the ridge. Frederick Bliss and Archibald Dickie, tunnelling round the southern hill in 1894–1897, traced walls and gateways near the pool of Siloam from several periods, and the lower pool itself, with the stepped street climbing from it, was uncovered by Ronny Reich and Eli Shukron from 2004; which, if any, of these remains belongs to Nehemiah's gate is not agreed, and the gate itself has not been identified."
    - "The spot is today the southern end of the City of David archaeological park in Silwan, below the Old City of Jerusalem, where the pool of Siloam and the Herodian street are open to visitors and the valley runs down to the well of Job, the old En-rogel."
  ru:
    - "Ворота Источника были воротами Иерусалима во дни Неемии на южной оконечности города Давидова, там, где сходятся долины Кедрона и Еннома, и названы они, должно быть, по источнику под ними: Ен-Рогелу чуть ниже по долине или по выходу Силоамского туннеля в водоём. Неемия подъехал к ним во время ночного объезда разрушенных стен в 445 г. до н. э.: от ворот Долины он миновал Навозные ворота, «и подъехал я к воротам Источника и к царскому водоему, но там не было места пройти животному, которое было подо мною». В рассказе о восстановлении их чинил Шаллум, сын Колхозея: «он построил их, и покрыл их, и вставил двери их, замки их и засовы их», и он же чинил «стену у водоема Селах против царского сада и до ступеней, спускающихся из города Давидова». При освящении стены первое шествие прошло «подле ворот Источника, против них», и взошло по ступеням города Давидова к Водяным воротам."
    - "Эти три стиха ставят ворота между Навозными воротами, Силоамским водоёмом с царским садом и ступенями города Давидова, то есть у юго-восточного угла древнего города на хребте. Фредерик Блисс и Арчибальд Дики, прокладывая туннели вокруг южного холма в 1894–1897 годах, проследили у Силоамского водоёма стены и ворота разных эпох, а сам нижний водоём со ступенчатой улицей, поднимающейся от него, открыли Ронни Райх и Эли Шукрон с 2004 года; какие из этих остатков, если вообще какие-то, принадлежат воротам Неемии, согласия нет, и сами ворота не опознаны."
    - "Сегодня это южный конец археологического парка «Город Давида» в Силуане, под Старым городом Иерусалима, где Силоамский водоём и иродианская улица открыты для посетителей, а долина спускается к колодцу Иова, древнему Ен-Рогелу."
  uk:
    - "Ворота Джерела були брамою Єрусалима за днів Неемії біля південного вістря Міста Давида, де сходяться долини Кедрон і Гінном, названою за джерелом під нею, Ен-Рогелом або витоком тунелю Сілоам. Неемія зустрів їх під час нічної поїздки довкола зруйнованих мурів у 445 р. до н. е.: від Воріт Долини він проїхав повз Гноєві ворота й приїхав «до воріт Криничаних і до царського водопроводу, але там не було місця, щоб пройти животинї, що була підо мною». У розповіді про відбудову Шаллум, син Колхозея, «він збудував їх і вкрив їх, і вставив двері їх, замки їх і засуви їх, — він же лагодив і мур коло ставка Селаха, проти царського садка й до сходів, що вели вниз із міста Давидового». Під час посвячення перша процесія йшла «Коло Криничаних воріт навпроти їх» вгору сходами Міста Давида до Водяних воріт."
    - "Ці три вірші ставлять браму між Гноєвими воротами, купіллю Сілоам із царським садом і сходами Міста Давида, тобто в південно-східному куті давнього міста на кряжі. Фредерик Бліс і Арчібальд Дікі, прокопуючи тунелі довкола південного пагорба в 1894–1897 рр., простежили мури й проходи біля купелі Сілоам з кількох періодів, а саму нижню купіль з сходинчастою вулицею, що здіймається від неї, відкрили Ронні Райх і Елі Шукрон від 2004 р.; яка з цих решток, якщо вона є, належить воротам Неемії, немає згоди, і самі ворота не ототожнені."
    - "Місце сьогодні — південний кінець археологічного парку Міста Давида в Сілуані, під Старим містом Єрусалима, де купіль Сілоам та іродіанська вулиця відкриті для відвідувачів, а долина спускається до колодязя Йова, давнього Ен-Рогела."
  es:
    - "La Puerta de la Fuente de Jerusalén estaba, en tiempos de Nehemías, en el extremo sur de la Ciudad de David, en el cruce de los valles del Cedrón y del Hinom, por una fuente de debajo, En-rogel o el desagüe del túnel de Siloé. Nehemías la halló en su cabalgata nocturna por los muros derribados en el 445 a. C.: desde la Puerta del Valle pasó la del Muladar y llegó «á la puerta de la Fuente, y al estanque del Rey; mas no había lugar por donde pasase la cabalgadura en que iba». Salum hijo de Col-hozé «él la reedificó, y la enmaderó, y levantó sus puertas, sus cerraduras y sus cerrojos, y el muro del estanque de Selah hacia la huerta del rey, y hasta las gradas que descienden de la ciudad de David». En la dedicación la primera procesión fue «á la puerta de la Fuente, en derecho delante de ellos» y subió por las gradas de la Ciudad de David hasta la Puerta de las Aguas."
    - "Estos tres versículos fijan la puerta entre la Puerta del Muladar, el estanque de Siloé con el huerto del rey y las gradas de la Ciudad de David, es decir, en el ángulo sudeste de la ciudad antigua, sobre la loma. Frederick Bliss y Archibald Dickie, al abrir túneles en torno a la colina meridional en 1894–1897, siguieron muros y accesos cerca del estanque de Siloé de varios periodos, y el propio estanque inferior, con la calle escalonada que sube desde él, fue descubierto por Ronny Reich y Eli Shukron desde 2004; cuál de estos restos, si alguno, pertenece a la puerta de Nehemías no está acordado, y la puerta misma no ha sido identificada."
    - "El lugar es hoy el extremo sur del parque arqueológico de la Ciudad de David, en Silwan, bajo la Ciudad Vieja de Jerusalén, donde el estanque de Siloé y la calle herodiana están abiertos a los visitantes y el valle desciende hasta el pozo de Job, la antigua En-rogel."
  pt:
    - "A Porta da Fonte era uma porta de Jerusalém no tempo de Neemias, na ponta sul da Cidade de Davi, onde se encontram os vales do Cedrom e de Hinom, assim chamada por uma fonte abaixo dela, En-Rogel ou o escoadouro do túnel de Siloé. Neemias a alcançou em sua cavalgada noturna pelos muros derrubados, em 445 a.C.: da Porta do Vale passou pela Porta do Esterco e foi “para a Porta da Fonte e para o Tanque do Rei, mas não havia espaço para o animal que estava debaixo de mim passar”. Na reconstrução, de Salum, filho de Col-Hozé, diz-se: “Ele a edificou, a cobriu, e assentou as suas portas, os seus ferrolhos e as suas trancas; e também reparou a muralha do tanque de Selá, junto ao jardim do rei, até os degraus que descem da Cidade de Davi”. Na dedicação, a primeira procissão passou “pela Porta da Fonte, e direto em frente a eles” e subiu as escadas da Cidade de Davi até a Porta das Águas."
    - "Esses três versículos fixam a porta entre a Porta do Esterco, o tanque de Siloé com o jardim do rei e as escadas da Cidade de Davi, isto é, no canto sudeste da cidade antiga, na crista. Frederick Bliss e Archibald Dickie, abrindo túneis em torno da colina sul em 1894–1897, seguiram muros e passagens perto do tanque de Siloé de vários períodos, e o próprio tanque inferior, com a rua de degraus que sobe dele, foi descoberto por Ronny Reich e Eli Shukron a partir de 2004; qual desses vestígios, se algum, pertence à porta de Neemias não é consensual, e a porta em si não foi identificada."
    - "O lugar é hoje a extremidade sul do parque arqueológico da Cidade de Davi, em Silwan, abaixo da Cidade Velha de Jerusalém, onde o tanque de Siloé e a rua herodiana estão abertos aos visitantes e o vale desce até o poço de Jó, a antiga En-Rogel."
  de:
    - "Das Quelltor war zu Nehemias Zeit ein Tor Jerusalems an der Südspitze der Stadt Davids, wo Kidron- und Hinnomtal zusammentreffen, nach einer Quelle darunter benannt, En-Rogel oder dem Abfluss des Siloah-Tunnels. Nehemia kam auf seinem nächtlichen Ritt um die zerstörten Mauern 445 v. Chr. hin: Vom Taltor ritt er am Misttor vorbei und „ging hinüber zu dem Brunnentor und zu des Königs Teich; und war da nicht Raum meinem Tier, daß es unter mir hätte gehen können“. Beim Wiederaufbau baute Sallun, der Sohn Kol-Hoses, das Tor: „er baute es und deckte es und setzte ein seine Türen, Schlösser und Riegel, dazu die Mauer am Teich Siloah bei dem Garten des Königs bis an die Stufen, die von der Stadt Davids herabgehen“. Bei der Einweihung zog die erste Prozession: „Und zogen zum Brunnentor hin und gingen stracks vor sich auf den Stufen zur Stadt Davids“, bis zum Wassertor."
    - "Diese drei Stellen legen das Tor zwischen das Misttor, den Teich Siloah mit dem Garten des Königs und die Stufen der Stadt Davids, das heißt an die Südostecke der alten Stadt auf dem Höhenrücken. Frederick Bliss und Archibald Dickie, die 1894–1897 den Südhügel mit Stollen umgingen, verfolgten nahe dem Teich Siloah Mauern und Torwege aus mehreren Epochen, und der untere Teich selbst mit der von ihm ansteigenden Stufenstraße wurde ab 2004 von Ronny Reich und Eli Shukron freigelegt; welcher dieser Reste, wenn überhaupt einer, zu Nehemias Tor gehört, ist nicht Konsens, und das Tor selbst ist nicht identifiziert."
    - "Die Stelle ist heute das Südende des archäologischen Parks Stadt Davids in Silwan, unterhalb der Altstadt von Jerusalem, wo der Teich Siloah und die herodianische Straße Besuchern offenstehen und das Tal zum Hiobsbrunnen hinabführt, dem alten En-Rogel."
  fr:
    - "La Porte de la Source était une porte de la Jérusalem de Néhémie, à la pointe sud de la Cité de David, au confluent du Cédron et de Hinnom, nommée d’après une source, En-Roguel ou la sortie du tunnel de Siloé. Lors de sa chevauchée nocturne de 445 av. J.-C., Néhémie passa de la Porte de la Vallée à la Porte du Fumier, puis vint à elle : « Je passai près de la porte de la source et de l’étang du roi, et il n’y avait point de place par où pût passer la bête qui était sous moi ». Schallum, fils de Col-Hozé, la répara : « Il la bâtit, la couvrit, et en posa les battants, les verrous et les barres. Il fit de plus le mur de l’étang de Siloé, près du jardin du roi, jusqu’aux degrés qui descendent de la cité de David ». À la dédicace, le premier cortège, « à la porte de la source, ils montèrent vis-à-vis d’eux les degrés de la cité de David », gagna la Porte des Eaux."
    - "Ces trois versets fixent la porte entre la Porte du Fumier, le bassin de Siloé avec le jardin du roi et les degrés de la Cité de David, c’est-à-dire à l’angle sud-est de la vieille ville sur la crête. Frederick Bliss et Archibald Dickie, creusant des tunnels autour de la colline sud en 1894–1897, relevèrent des murs et des passages près du bassin de Siloé de plusieurs époques, et le bassin inférieur lui-même, avec la rue à degrés qui en part, fut mis au jour par Ronny Reich et Eli Shukron à partir de 2004 ; lequel de ces vestiges, s’il en est un, appartient à la porte de Néhémie n’est pas convenu, et la porte elle-même n’a pas été identifiée."
    - "Le lieu est aujourd’hui l’extrémité sud du parc archéologique de la Cité de David à Silwan, sous la Vieille Ville de Jérusalem, où le bassin de Siloé et la rue hérodienne sont ouverts aux visiteurs et où la vallée descend vers le puits de Job, l’ancienne En-Roguel."
  it:
    - "La Porta della Fonte era una porta di Gerusalemme al tempo di Neemia, alla punta sud della Città di Davide, alla confluenza delle valli del Cedron e dell’Hinnom, così detta da una sorgente sottostante, En-Roghel o lo sbocco del tunnel di Siloe. Nel 445 a.C., cavalcando di notte lungo le mura, Neemia, oltre la Porta del Letame, giunse «presso la porta della Sorgente e il serbatoio del Re, ma non v’era posto per cui il giumento ch’io cavalcavo potesse passare». Poi Sallum figlio di Col-Cozeh «la costruì, la coperse, vi pose le imposte, le serrature e le sbarre. Fece inoltre il muro del serbatoio di Scelah, presso il giardino del re fino alla scalinata per cui si scende dalla città di Davide». Alla dedicazione il primo corteo, «Giunti che furono alla porta della Sorgente, montarono, dirimpetto a loro la scalinata della città di Davide», arrivò alla Porta delle Acque."
    - "Questi tre versetti fissano la porta fra la Porta del Letame, la piscina di Siloe con il giardino del re e la scalinata della Città di Davide, cioè all’angolo sud-orientale della città antica sul crinale. Frederick Bliss e Archibald Dickie, scavando gallerie attorno alla collina meridionale nel 1894–1897, seguirono mura e passaggi di varie epoche presso la piscina di Siloe, e la piscina inferiore stessa, con la strada a gradini che sale da essa, fu portata alla luce da Ronny Reich ed Eli Shukron dal 2004; quale, se mai, di questi resti appartenga alla porta di Neemia non è concordato, e la porta stessa non è stata identificata."
    - "Il luogo è oggi l’estremità meridionale del parco archeologico della Città di Davide a Silwan, sotto la Città Vecchia di Gerusalemme, dove la piscina di Siloe e la strada erodiana sono aperte ai visitatori e la valle scende fino al pozzo di Giobbe, l’antica En-Roghel."
  pl:
    - "Brama Źródlana była bramą Jerozolimy za Nehemiasza na południowym krańcu Miasta Dawida, gdzie spotykają się doliny Cedronu i Hinnom, nazwaną od źródła pod nią, En-Rogel lub wypływu tunelu Siloe. Nehemiasz spotkał ją podczas nocnej przejażdżki wokół zburzonych murów w 445 r. p.n.e.: od Bramy Doliny minął Bramę Gnojną i dojechał „ku bramie żródła, i ku sadzawce królewskiej, gdzie nie było miejsca bydlęciu, na któremem jechał, aby przejść mogło”. W opisie odbudowy Szallun, syn Kol-Chozeha, „a ten ją zbudował, i przykrył ją, i przyprawił wrota do niej, i zamki jej, i zawory jej, i mur nad stawem Selach ku ogrodowi królewskiemu aż do schodu, po którym schodzą z miasta Dawidowego”. Przy poświęceniu pierwsza procesja szła „ku bramie źródła, która przeciwko nim była” w górę po schodach Miasta Dawida do Bramy Wodnej."
    - "Te trzy wersety umieszczają bramę między Bramą Gnojną, sadzawką Siloe z królewskim ogrodem i schodami Miasta Dawida, czyli w południowo-wschodnim narożniku starego miasta na grzbiecie. Frederick Bliss i Archibald Dickie, drążąc tunele wokół południowego wzgórza w latach 1894–1897, wytropili mury i bramy koło sadzawki Siloe z kilku okresów, a dolną sadzawkę, z biegnącą od niej stopniowaną ulicą, odsłonili Ronny Reich i Eli Shukron od 2004 r.; która, jeśli w ogóle, z tych pozostałości należy do bramy Nehemiasza, nie jest uzgodnione, a sama brama nie została zidentyfikowana."
    - "Miejsce to jest dziś południowym krańcem parku archeologicznego Miasta Dawida w Silwan, poniżej Starego Miasta Jerozolimy, gdzie sadzawka Siloe i ulica herodiańska są otwarte dla zwiedzających, a dolina schodzi do studni Hioba, dawnego En-Rogel."
  nl:
    - "De Bronpoort was een poort van Jeruzalem in Nehemia's dagen aan de zuidpunt van de Stad van David, waar Kidron- en Hinnomdal samenkomen, genoemd naar een bron eronder: En-Rogel of de uitstroom van de Siloamtunnel. Nehemia kwam haar tegen op zijn nachtelijke rit langs de verbrokkelde muren in 445 v.Chr.: vanaf de Dalpoort passeerde hij de Mestpoort en “ging voort naar de Fonteinpoort, en naar des konings vijver; doch daar was geen plaats voor het dier, om onder mij voort te gaan”. Bij de herbouw verbeterde Sallum, zoon van Kol-Chozeh, haar: “hij bouwde ze, en overdekte ze, en richtte haar deuren op, met haar sloten en haar grendelen; daartoe den muur des vijvers Schelah bij des konings hof, en tot aan de trappen, die afgaan van Davids stad”. Bij de inwijding ging de eerste optocht “naar de Fonteinpoort, en tegen hen over, gingen zij op bij de trappen van Davids stad” naar de Waterpoort."
    - "Deze drie verzen leggen de poort vast tussen de Mestpoort, de vijver van Siloam met de koningstuin en de trappen van de Stad van David, dat is op de zuidoosthoek van de oude stad op de bergrug. Frederick Bliss en Archibald Dickie, die in 1894–1897 rond de zuidelijke heuvel tunnelden, volgden muren en poorten bij de vijver van Siloam uit verscheidene perioden, en de benedenvijver zelf, met de getrapte straat die eruit opklimt, werd vanaf 2004 door Ronny Reich en Eli Shukron blootgelegd; welke van deze resten, zo al een, bij Nehemia's poort hoort, is niet vastgesteld, en de poort zelf is niet geïdentificeerd."
    - "De plek is nu het zuideinde van het archeologisch park Stad van David in Silwan, onder de Oude Stad van Jeruzalem, waar de vijver van Siloam en de Herodiaanse straat voor bezoekers openstaan en het dal naar de put van Job loopt, het oude En-Rogel."
  cs:
    - "Pramenná brána byla branou Jeruzaléma za Nehemjášových dnů na jižním cípu Města Davidova, kde se setkávají údolí Kidronu a Hinnomu, pojmenovanou podle pramene pod ní, Én-rógelu nebo vyústění siloského tunelu. Nehemjáš se k ní dostal na své noční jízdě kolem pobořených hradeb roku 445 př. n. l.: od Brány v údolí minul Hnojnou bránu a přišel „k bráně studničné, a k rybníku královskému, kdež nebylo brodu hovádku, na němž jsem jel, aby přejíti mohlo“. V líčení přestavby se o Šalunovi, synu Kol-chozeho, praví: „On ji vystavěl a přikryl ji, a vstavil vrata její s zámky i závorami jejími, a zed rybníka Selach, od zahrady královské až k stupňům sstoupajícím z města Davidova“. Při vysvěcení šel první průvod „k bráně u studnice, kteráž naproti nim byla“ vzhůru po stupních Města Davidova k Vodní bráně."
    - "Tyto tři verše určují bránu mezi Hnojnou bránou, rybníkem Siloe se zahradou královskou a stupni Města Davidova, tedy na jihovýchodním rohu starého města na hřbetu. Frederick Bliss a Archibald Dickie, razící tunely kolem jižního pahorku v letech 1894–1897, vysledovali u rybníka Siloe zdi a brány z několika období a dolní rybník samotný, se stupňovitou ulicí z něj stoupající, odkryli od roku 2004 Ronny Reich a Eli Shukron; která z těchto zbytků, pokud nějaký, patří Nehemjášově bráně, není shodně uznáno a samotná brána nebyla určena."
    - "Místo je dnes jižním koncem archeologického parku Města Davidova v Silwanu pod Starým městem Jeruzaléma, kde jsou návštěvníkům otevřeny rybník Siloe a herodiánská ulice a údolí sbíhá k Jóbově studni, staré Én-rógel."
  sv:
    - "Källporten var en port i Jerusalem på Nehemjas tid vid södra spetsen av Davids stad, där Kidrondalen och Hinnomdalen möts, uppkallad efter en källa nedanför, En-Rogel eller utloppet från Siloatunneln. Nehemja kom dit på sitt nattliga ritt runt de brutna murarna år 445 f.Kr.: från Dalporten passerade han Dyngporten och drog vidare ”till Källporten och till Konungsdammen, men där var det icke möjligt för djuret att komma fram med mig”. I berättelsen om återuppbyggnaden satte Shallun, Kol-Hoses son, upp den: ”byggde upp den och lade tak därpå och satte in dess dörrar, dess riglar och bommar. Han byggde ock muren vid Vattenledningsdammen, invid den kungliga trädgården, ända fram till trapporna som föra ned från Davids stad”. Vid invigningen gick det första tåget, där ”de gingo över Källporten och rakt fram uppför trapporna till Davids stad”, vidare till Vattenporten."
    - "Dessa tre verser placerar porten mellan Dyngporten, Siloadammen med kungens trädgård och Davids stads trappor, alltså i sydöstra hörnet av den gamla staden på åsen. Frederick Bliss och Archibald Dickie, som grävde tunnlar kring södra kullen 1894–1897, följde murar och portar nära Siloadammen från flera perioder, och själva nedre dammen, med den trappade gatan som klättrar från den, frilades av Ronny Reich och Eli Shukron från 2004; vilka av lämningarna, om några, som hör till Nehemjas port är inte avgjort, och själva porten har inte identifierats."
    - "Platsen är i dag södra änden av den arkeologiska parken Davids stad i Silwan, nedanför Jerusalems Gamla stad, där Siloadammen och den herodianska gatan är öppna för besökare och dalen löper ned mot Jobs brunn, den gamla En-Rogel."
  nb:
    - "Kildeporten var en port i Jerusalem på Nehemjas tid, ved den sørlige spissen av Davidsbyen, der Kedrondalen og Hinnomdalen møtes, oppkalt etter en kilde nedenfor, En-Rogel eller utløpet av Siloa-tunnelen. Nehemja kom til den på sitt nattlige ritt rundt de nedrevne murene i 445 f.Kr.: fra Dalporten passerte han Møkkporten og tok «over til Kildeporten og til Kongedammen; men der var det ikke rum for dyret som jeg red på, til å komme frem». I beretningen om gjenoppbyggingen heter det at Sjallun, Kol-Hoses sønn, «bygget den, la tak på den og satte inn dører, låser og slåer; likeledes bygget han muren ved Selah-dammen ved kongens have helt frem til de trapper som går ned fra Davids stad». Ved innvielsen gikk det første toget «over Kildeporten og rett frem, opover trappene til Davids stad» til Vannporten."
    - "Disse tre versene fastlegger porten mellom Møkkporten, Siloa-dammen med kongens have og trappene i Davidsbyen, det vil si i sørøsthjørnet av den gamle byen på ryggen. Frederick Bliss og Archibald Dickie, som gravde tunneler rundt den sørlige høyden i 1894–1897, kartla murer og portåpninger fra flere perioder nær Siloa-dammen, og selve den nedre dammen, med den trappede gaten som går opp fra den, ble avdekket av Ronny Reich og Eli Shukron fra 2004; hvilke av disse restene, om noen, som hører til Nehemjas port, er man ikke enige om, og selve porten er ikke identifisert."
    - "Stedet er i dag den sørlige enden av den arkeologiske parken i Davidsbyen i Silwan, nedenfor Jerusalems gamleby, der Siloa-dammen og den herodianske gaten er åpne for besøkende og dalen løper ned til Jobs brønn, den gamle En-Rogel."
