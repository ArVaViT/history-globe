# Overview article (ADR 0007). Mainstream facts only; present-day figures are approximate.
id: great-sea
place: aa805fb
title:
  en: "Great Sea"
  ru: "Великое море"
  uk: "Велике море"
  es: "Mar Grande"
  pt: "Mar Mediterrâneo"
  de: "Mittelmeer"
  fr: "Grande mer"
body:
  en:
    - "The Great Sea is the Mediterranean, the sea that bounded the land of Israel on the west. It stretches nearly 4,000 km from the Strait of Gibraltar to the Levant and covers about 2.5 million square kilometres; its eastern basin, off the Levant, is the warmest and saltiest part. The Hebrew Bible calls it simply “the great sea”, or, since one faced east to take one's bearings, “the hinder sea” and “the uttermost sea”, which the Synodal Bible renders as the western sea. Exodus once calls it “the sea of the Philistines”. The Greeks and Romans had no single name for it either until late antiquity: Isidore of Seville explains Mediterraneum as the sea that flows through the middle of the lands."
    - "The sea marked the promised land's edge: “ye shall even have the great sea for a border”, Moses said of the western boundary, and Joshua was promised everything “unto the great sea toward the going down of the sun”. Yet Israel was a people of the hills, with a straight, harbourless coast; the sailors were the Phoenicians of Tyre and Sidon. Hiram told Solomon, “I will convey them by sea in floats” of cedar from Lebanon, and the same route served the Temple of the return, when Sidonians and Tyrians brought cedar to the sea of Joppa. Jonah went down to Joppa to find a ship bound for Tarshish. The psalmist looked at “this great and wide sea, wherein are things creeping innumerable”, and Ezekiel promised that the Dead Sea would one day teem with fish “as the fish of the great sea, exceeding many”."
    - "In Daniel's vision “the four winds of the heaven strove upon the great sea”, and out of it came the four beasts, the empires that ruled the Jews in turn. Under the Romans, who called it mare nostrum, the sea became a highway: Herod built the first great artificial harbour on the coast at Caesarea, and by that harbour Paul sailed to Rome, through the sea of Cilicia and Pamphylia, past Crete, to shipwreck at Malta. The church spread along the same sea lanes, from Antioch and Alexandria to Corinth and Rome."
    - "Today more than twenty states share the Mediterranean coast, and the Suez Canal, opened in 1869, has made it a passage between the oceans. On the biblical shore lie Gaza, Ashkelon, Ashdod, Tel Aviv with ancient Joppa, Caesarea, Haifa under Mount Carmel, Acre, and across the border Tyre, Sidon and Beirut."
  ru:
    - "Великое море — это Средиземное море, замыкавшее землю Израиля с запада. Оно тянется почти на 4000 км от Гибралтарского пролива до Леванта и занимает около 2,5 млн квадратных километров; его восточная котловина, у Леванта, самая тёплая и солёная. Еврейская Библия зовёт его просто «великое море», а поскольку сторону света определяли, стоя лицом к востоку, также морем задним и крайним, что Синодальный перевод передаёт словами «до моря западного». В книге Исход пределы Израиля однажды проведены «от моря Чермного до моря Филистимского». У греков и римлян единого имени тоже долго не было; Исидор Севильский объясняет слово Mediterraneum как море, протекающее посреди земель."
    - "Море было краем обетованной земли: «границею западною будет у вас великое море», — сказал Моисей, а Иисусу Навину обещаны пределы «до великого моря к западу солнца». Но Израиль был народом гор, с прямым берегом без гаваней; мореходами были Финикийцы Тира и Сидона. Хирам писал Соломону: «я плотами доставлю их морем» — кедры с Ливана, и тем же путём служили Храму возвращения, когда Сидоняне и Тиряне везли кедровый лес по морю в Яфу. Иона пришёл в Иоппию искать корабль в Фарсис. Псалмопевец смотрел на «море великое и пространное: там пресмыкающиеся, которым нет числа», а Иезекииль обещал, что в Мёртвом море однажды, «как в большом море, рыбы будет весьма много»."
    - "В видении Даниила «четыре ветра небесных боролись на великом море», и из него вышли четыре зверя — державы, по очереди правившие Иудеями. При римлянах, звавших его mare nostrum, «наше море», оно стало большой дорогой: Ирод построил на побережье первую большую искусственную гавань в Кесарии, и из этой гавани Павел отплыл в Рим — мимо Киликии и Памфилии, мимо Крита, к кораблекрушению у Мальты. Теми же морскими путями шла церковь: из Антиохии и Александрии в Коринф и Рим."
    - "Сегодня побережье Средиземного моря делят более двадцати государств, а Суэцкий канал, открытый в 1869 году, сделал его проходом между океанами. На библейском берегу стоят Газа, Ашкелон, Ашдод, Тель-Авив с древней Яффой, Кесария, Хайфа под горой Кармил, Акко, а за границей — Тир, Сидон и Бейрут."
  uk:
    - "Велике море — це Середземне море, море, що обмежувало землю Ізраїлю із заходу. Воно простягається майже на 4000 км від Гібралтарської протоки до Леванту й охоплює приблизно 2,5 мільйона квадратних кілометрів; його східний басейн, біля Леванту, — найтепліша й найсолоніша частина. Давньоєврейська Біблія називає його просто «велике море» або, оскільки орієнтувалися обличчям на схід, «заднім морем» і «крайнім морем», що Синодальна Біблія передає як західне море. Книга Вихід один раз називає його «море Филистимське». Греки й римляни також не мали для нього єдиної назви до пізньої давнини: Ісидор Севільський пояснює Mediterraneum як море, що тече посеред земель."
    - "Море позначало край обітованої землі: «західньою гряницею буде вам Велике море і побережє», сказав Мойсей про західну межу, а Ісусові Навину було обіцяно все «аж до великого моря на захід сонця». Проте Ізраїль був народом гір, з прямим берегом без гаваней; моряками були фінікійці Тіру й Сідона. Хірам сказав Соломонові: «повелю тратвами гнати їх морем» — кедр з Лівану, і той самий шлях послужив храмові після повернення, коли сидонці й тирійці «приставляли кедрину з Ливану морем у Яфу». Йона зійшов до Яффи знайти корабель, що йшов у Тарсис. Псалмоспівець дивився на «Те море, велике і на всї сторони широке: там ворушиться безлїч зьвірини», а Єзекіїль обіцяв, що Мертве море колись кишітиме рибою, «й як у великому морі, буде риби дуже багато»."
    - "У видінні Даниїла «чотирі вітри під небом змагались один проти одного на великому морі», і з нього вийшли чотири звірі, імперії, які по черзі панували над юдеями. За римлян, які називали його mare nostrum, море стало магістраллю: Ірод збудував першу велику штучну гавань на узбережжі в Кесарії, і з цієї гавані Павло відплив до Рима, через море Кілікії та Памфілії, повз Крит, до корабельної аварії на Мальті. Церква поширювалася тими самими морськими шляхами, від Антіохії й Александрії до Коринта й Рима."
    - "Сьогодні понад двадцять держав ділять середземноморське узбережжя, а Суецький канал, відкритий 1869 року, зробив його проходом між океанами. На біблійному березі лежать Газа, Ашкелон, Ашдод, Тель-Авів із давньою Яффою, Кесарія, Хайфа під горою Кармель, Акко, а по той бік кордону Тір, Сідон і Бейрут."
  es:
    - "El Mar Grande es el Mediterráneo, el mar que limitaba la tierra de Israel por el oeste. Se extiende casi 4000 km desde el estrecho de Gibraltar hasta el Levante y cubre unos 2,5 millones de kilómetros cuadrados; su cuenca oriental, frente al Levante, es la parte más cálida y salada. La Biblia hebrea lo llama sencillamente «la gran mar» o, como uno se orientaba mirando al este, «la mar postrera», que la Biblia sinodal traduce como mar occidental. El Éxodo lo llama una vez «la mar de Palestina». Griegos y romanos tampoco tuvieron un nombre único para él hasta la antigüedad tardía: Isidoro de Sevilla explica Mediterraneum como el mar que corre por medio de las tierras."
    - "El mar marcaba el borde de la tierra prometida: «Y el término occidental os será la gran mar», dijo Moisés del límite occidental, y a Josué se le prometió todo «hasta la gran mar del poniente del sol». Sin embargo, Israel era un pueblo de colinas, con una costa recta y sin puertos; los marinos eran los fenicios de Tiro y Sidón. Hiram dijo a Salomón, a propósito del cedro del Líbano: «yo la pondré en balsas por la mar», y la misma ruta sirvió para el Templo del regreso, cuando sidonios y tirios llevaron cedro al mar de Jope. Jonás bajó a Jope a buscar una nave rumbo a Tarsis. El salmista contempló «esta gran mar y ancha de términos: en ella pescados sin número, animales pequeños y grandes», y Ezequiel prometió que el mar Muerto rebosaría un día de peces «como el pescado de la gran mar, mucho en gran manera»."
    - "En la visión de Daniel, «los cuatro vientos del cielo combatían en la gran mar», y de ella salieron las cuatro bestias, los imperios que gobernaron a los judíos por turno. Bajo los romanos, que lo llamaban mare nostrum, el mar se convirtió en una vía: Herodes construyó el primer gran puerto artificial de la costa en Cesarea, y desde ese puerto navegó Pablo a Roma, por el mar de Cilicia y Panfilia, pasando Creta, hasta naufragar en Malta. La Iglesia se extendió por las mismas rutas marítimas, de Antioquía y Alejandría a Corinto y Roma."
    - "Hoy más de veinte Estados comparten la costa mediterránea, y el canal de Suez, abierto en 1869, lo ha convertido en un paso entre los océanos. En la costa bíblica se hallan Gaza, Ascalón, Asdod, Tel Aviv con la antigua Jope, Cesarea, Haifa al pie del monte Carmelo, Acre, y al otro lado de la frontera Tiro, Sidón y Beirut."
  pt:
    - "O Grande Mar é o Mediterrâneo, o mar que limitava a terra de Israel a oeste. Estende-se por quase 4.000 km, do Estreito de Gibraltar ao Levante, e cobre cerca de 2,5 milhões de quilômetros quadrados; sua bacia oriental, junto ao Levante, é a parte mais quente e mais salgada. A Bíblia hebraica o chama simplesmente “o grande mar” ou, já que para se orientar se olhava para o leste, o mar de trás e o mar extremo, que a Bíblia Sinodal traduz como o mar ocidental. Êxodo uma vez o chama “o mar dos filisteus”. Gregos e romanos também não tiveram um nome único para ele até a Antiguidade tardia: Isidoro de Sevilha explica Mediterraneum como o mar que corre pelo meio das terras."
    - "O mar marcava o limite da terra prometida: “vocês terão o mar Grande e a sua costa”, disse Moisés sobre a fronteira ocidental, e a Josué foi prometido tudo “até o grande mar na direção do pôr do sol”. Contudo, Israel era um povo das colinas, de costa reta e sem portos; os marinheiros eram os fenícios de Tiro e Sidom. Hirão disse a Salomão, sobre cedro do Líbano: “Eu as armarei em jangadas para irem pelo mar”, e a mesma rota serviu ao Templo do retorno, quando sidônios e tírios trouxeram cedro até o mar de Jope. Jonas desceu a Jope para achar um navio com destino a Társis. O salmista contemplou “o mar, grande e vasto, no qual há inumeráveis seres vivos”, e Ezequiel prometeu que o mar Morto um dia fervilharia de peixes “como os peixes do Mar Grande, muitíssimos”."
    - "Na visão de Daniel, “os quatro ventos do céu irrompiam sobre o grande mar”, e dele saíram as quatro feras, os impérios que dominaram os judeus um após o outro. Sob os romanos, que o chamavam mare nostrum, o mar tornou-se uma estrada: Herodes construiu o primeiro grande porto artificial da costa em Cesareia, e por esse porto Paulo navegou para Roma, pelo mar da Cilícia e da Panfília, passando por Creta, até o naufrágio em Malta. A igreja se espalhou pelas mesmas rotas marítimas, de Antioquia e Alexandria a Corinto e Roma."
    - "Hoje mais de vinte Estados partilham a costa do Mediterrâneo, e o Canal de Suez, aberto em 1869, fez dele uma passagem entre os oceanos. Na costa bíblica ficam Gaza, Ascalom, Asdode, Tel Aviv com a antiga Jope, Cesareia, Haifa ao pé do monte Carmelo, Acre e, do outro lado da fronteira, Tiro, Sidom e Beirute."
  de:
    - "Das Große Meer ist das Mittelmeer, das Meer, das das Land Israel im Westen begrenzte. Es erstreckt sich fast 4000 km von der Straße von Gibraltar bis zur Levante und bedeckt etwa 2,5 Millionen Quadratkilometer; sein östliches Becken vor der Levante ist der wärmste und salzigste Teil. Die hebräische Bibel nennt es schlicht „das große Meer“ oder, weil man sich beim Orientieren nach Osten wandte, „das Meer gegen Abend“ (wörtlich das hintere, das äußerste Meer), das die Synodalübersetzung als westliches Meer wiedergibt. Das zweite Buch Mose nennt es einmal „das Philistermeer“. Auch Griechen und Römer hatten bis in die Spätantike keinen einheitlichen Namen dafür: Isidor von Sevilla erklärt Mediterraneum als das Meer, das mitten durch die Länder fließt."
    - "Das Meer bezeichnete den Rand des verheißenen Landes: „Die Grenze gegen Abend soll diese sein, nämlich das große Meer“, sagte Mose von der Westgrenze, und Josua wurde alles zugesagt „bis an das große Meer gegen Abend“. Doch Israel war ein Bergvolk mit gerader, hafenloser Küste; Seefahrer waren die Phönizier von Tyrus und Sidon. Hiram sagte Salomo, er wolle die Stämme „in Flöße legen lassen auf dem Meer“, Zedernholz vom Libanon, und derselbe Weg diente dem Tempel der Heimkehr, als Sidonier und Tyrer Zedernholz „aufs Meer gen Japho“ brachten. Jona ging nach Joppe hinab, um ein Schiff nach Tarsis zu finden. Der Psalmist betrachtete „das Meer, das so groß und weit ist, da wimmelt's ohne Zahl, große und kleine Tiere“, und Hesekiel verhieß, das Tote Meer werde von Fischen wimmeln, denn dort werden „sehr viel Fische von allerlei Art sein, gleichwie im großen Meer“."
    - "In Daniels Vision „die vier Winde unter dem Himmel stürmten widereinander auf dem großen Meer“, und aus ihm stiegen die vier Tiere, die Reiche, die nacheinander über die Juden herrschten. Unter den Römern, die es mare nostrum nannten, wurde das Meer zur Hauptstraße: Herodes baute in Caesarea den ersten großen künstlichen Hafen der Küste, und von diesem Hafen segelte Paulus nach Rom, „durch das Meer bei Zilizien und Pamphylien“, an Kreta vorbei, bis zum Schiffbruch vor Malta. Die Kirche breitete sich auf denselben Seewegen aus, von Antiochia und Alexandria bis Korinth und Rom."
    - "Heute teilen sich mehr als zwanzig Staaten die Mittelmeerküste, und der 1869 eröffnete Suezkanal hat es zu einem Durchgang zwischen den Ozeanen gemacht. An der biblischen Küste liegen Gaza, Aschkelon, Aschdod, Tel Aviv mit dem antiken Joppe, Caesarea, Haifa unter dem Karmel, Akko und jenseits der Grenze Tyrus, Sidon und Beirut."
  fr:
    - "La Grande mer est la Méditerranée, la mer qui bornait à l’ouest le pays d’Israël. Elle s’étend sur près de 4 000 km du détroit de Gibraltar au Levant et couvre environ 2,5 millions de kilomètres carrés ; son bassin oriental, au large du Levant, en est la partie la plus chaude et la plus salée. La Bible hébraïque l’appelle simplement « la grande mer » ou, puisque l’on s’orientait face à l’est, la mer de derrière et la mer extrême, que la Bible synodale rend par mer occidentale. L’Exode l’appelle une fois « la mer des Philistins ». Les Grecs et les Romains n’avaient pas non plus de nom unique pour elle avant l’Antiquité tardive : Isidore de Séville explique Mediterraneum comme la mer qui coule au milieu des terres."
    - "La mer marquait la limite du pays promis : « Votre limite occidentale sera la grande mer », dit Moïse, et à Josué fut promis tout le pays « jusqu’à la grande mer vers le soleil couchant ». Pourtant Israël était un peuple de collines, avec une côte rectiligne sans port ; les marins étaient les Phéniciens de Tyr et de Sidon. Hiram dit à Salomon, à propos des cèdres du Liban : « je les expédierai par mer en radeaux », et la même voie servit pour le Temple du retour, quand Sidoniens et Tyriens amenèrent du cèdre par mer jusqu’à Joppé. Jonas descendit à Joppé pour trouver un navire à destination de Tarsis. Le psalmiste contemplait « la grande et vaste mer : là se meuvent sans nombre des animaux petits et grands », et Ézéchiel promit que la mer Morte regorgerait un jour de poissons « comme les poissons de la grande mer, et ils seront très nombreux »."
    - "Dans la vision de Daniel, « les quatre vents des cieux firent irruption sur la grande mer », et de là sortirent les quatre bêtes, les empires qui dominèrent tour à tour les Juifs. Sous les Romains, qui l’appelaient mare nostrum, la mer devint une grande route : Hérode construisit sur la côte, à Césarée, le premier grand port artificiel, et de ce port Paul embarqua pour Rome, par la mer de Cilicie et de Pamphylie, le long de la Crète, jusqu’au naufrage de Malte. L’Église se répandit par les mêmes routes maritimes, d’Antioche et d’Alexandrie à Corinthe et à Rome."
    - "Aujourd’hui, plus de vingt États se partagent le littoral méditerranéen, et le canal de Suez, ouvert en 1869, en a fait un passage entre les océans. Sur le rivage biblique se trouvent Gaza, Askalon, Asdod, Tel-Aviv avec l’antique Joppé, Césarée, Haïfa au pied du mont Carmel, Acre, et, de l’autre côté de la frontière, Tyr, Sidon et Beyrouth."
