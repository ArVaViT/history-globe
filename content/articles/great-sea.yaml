# Overview article (ADR 0007). Mainstream facts only; present-day figures are approximate.
id: great-sea
place: aa805fb
title:
  en: "Great Sea"
  ru: "Великое море"
  uk: "Велике море"
  es: "Mar Grande"
  pt: "Mar Mediterrâneo"
  de: "Mittelmeer"
  fr: "Grande mer"
  pl: "Morze Wielkie"
  it: "Mare Grande"
  nl: "Grote Zee"
  cs: "Velké moře"
  sv: "Stora havet"
  nb: "Storhavet"
  tl: "Malaking Dagat"
body:
  en:
    - "The Great Sea is the Mediterranean, the sea that bounded the land of Israel on the west. It stretches nearly 4,000 km from the Strait of Gibraltar to the Levant and covers about 2.5 million square kilometres; its eastern basin, off the Levant, is the warmest and saltiest part. The Hebrew Bible calls it simply “the great sea”, or, since one faced east to take one's bearings, “the hinder sea” and “the uttermost sea”, which the Synodal Bible renders as the western sea. Exodus once calls it “the sea of the Philistines”. The Greeks and Romans had no single name for it either until late antiquity: Isidore of Seville explains Mediterraneum as the sea that flows through the middle of the lands."
    - "The sea marked the promised land's edge: “ye shall even have the great sea for a border”, Moses said of the western boundary, and Joshua was promised everything “unto the great sea toward the going down of the sun”. Yet Israel was a people of the hills, with a straight, harbourless coast; the sailors were the Phoenicians of Tyre and Sidon. Hiram told Solomon, “I will convey them by sea in floats” of cedar from Lebanon, and the same route served the Temple of the return, when Sidonians and Tyrians brought cedar to the sea of Joppa. Jonah went down to Joppa to find a ship bound for Tarshish. The psalmist looked at “this great and wide sea, wherein are things creeping innumerable”, and Ezekiel promised that the Dead Sea would one day teem with fish “as the fish of the great sea, exceeding many”."
    - "In Daniel's vision “the four winds of the heaven strove upon the great sea”, and out of it came the four beasts, the empires that ruled the Jews in turn. Under the Romans, who called it mare nostrum, the sea became a highway: Herod built the first great artificial harbour on the coast at Caesarea, and by that harbour Paul sailed to Rome, through the sea of Cilicia and Pamphylia, past Crete, to shipwreck at Malta. The church spread along the same sea lanes, from Antioch and Alexandria to Corinth and Rome."
    - "Today more than twenty states share the Mediterranean coast, and the Suez Canal, opened in 1869, has made it a passage between the oceans. On the biblical shore lie Gaza, Ashkelon, Ashdod, Tel Aviv with ancient Joppa, Caesarea, Haifa under Mount Carmel, Acre, and across the border Tyre, Sidon and Beirut."
  ru:
    - "Великое море — это Средиземное море, замыкавшее землю Израиля с запада. Оно тянется почти на 4000 км от Гибралтарского пролива до Леванта и занимает около 2,5 млн квадратных километров; его восточная котловина, у Леванта, самая тёплая и солёная. Еврейская Библия зовёт его просто «великое море», а поскольку сторону света определяли, стоя лицом к востоку, также морем задним и крайним, что Синодальный перевод передаёт словами «до моря западного». В книге Исход пределы Израиля однажды проведены «от моря Чермного до моря Филистимского». У греков и римлян единого имени тоже долго не было; Исидор Севильский объясняет слово Mediterraneum как море, протекающее посреди земель."
    - "Море было краем обетованной земли: «границею западною будет у вас великое море», — сказал Моисей, а Иисусу Навину обещаны пределы «до великого моря к западу солнца». Но Израиль был народом гор, с прямым берегом без гаваней; мореходами были Финикийцы Тира и Сидона. Хирам писал Соломону: «я плотами доставлю их морем» — кедры с Ливана, и тем же путём служили Храму возвращения, когда Сидоняне и Тиряне везли кедровый лес по морю в Яфу. Иона пришёл в Иоппию искать корабль в Фарсис. Псалмопевец смотрел на «море великое и пространное: там пресмыкающиеся, которым нет числа», а Иезекииль обещал, что в Мёртвом море однажды, «как в большом море, рыбы будет весьма много»."
    - "В видении Даниила «четыре ветра небесных боролись на великом море», и из него вышли четыре зверя — державы, по очереди правившие Иудеями. При римлянах, звавших его mare nostrum, «наше море», оно стало большой дорогой: Ирод построил на побережье первую большую искусственную гавань в Кесарии, и из этой гавани Павел отплыл в Рим — мимо Киликии и Памфилии, мимо Крита, к кораблекрушению у Мальты. Теми же морскими путями шла церковь: из Антиохии и Александрии в Коринф и Рим."
    - "Сегодня побережье Средиземного моря делят более двадцати государств, а Суэцкий канал, открытый в 1869 году, сделал его проходом между океанами. На библейском берегу стоят Газа, Ашкелон, Ашдод, Тель-Авив с древней Яффой, Кесария, Хайфа под горой Кармил, Акко, а за границей — Тир, Сидон и Бейрут."
  uk:
    - "Велике море — це Середземне море, море, що обмежувало землю Ізраїлю із заходу. Воно простягається майже на 4000 км від Гібралтарської протоки до Леванту й охоплює приблизно 2,5 мільйона квадратних кілометрів; його східний басейн, біля Леванту, — найтепліша й найсолоніша частина. Давньоєврейська Біблія називає його просто «велике море» або, оскільки орієнтувалися обличчям на схід, «заднім морем» і «крайнім морем», що Синодальна Біблія передає як західне море. Книга Вихід один раз називає його «море Филистимське». Греки й римляни також не мали для нього єдиної назви до пізньої давнини: Ісидор Севільський пояснює Mediterraneum як море, що тече посеред земель."
    - "Море позначало край обітованої землі: «західньою гряницею буде вам Велике море і побережє», сказав Мойсей про західну межу, а Ісусові Навину було обіцяно все «аж до великого моря на захід сонця». Проте Ізраїль був народом гір, з прямим берегом без гаваней; моряками були фінікійці Тіру й Сідона. Хірам сказав Соломонові: «повелю тратвами гнати їх морем» — кедр з Лівану, і той самий шлях послужив храмові після повернення, коли сидонці й тирійці «приставляли кедрину з Ливану морем у Яфу». Йона зійшов до Яффи знайти корабель, що йшов у Тарсис. Псалмоспівець дивився на «Те море, велике і на всї сторони широке: там ворушиться безлїч зьвірини», а Єзекіїль обіцяв, що Мертве море колись кишітиме рибою, «й як у великому морі, буде риби дуже багато»."
    - "У видінні Даниїла «чотирі вітри під небом змагались один проти одного на великому морі», і з нього вийшли чотири звірі, імперії, які по черзі панували над юдеями. За римлян, які називали його mare nostrum, море стало магістраллю: Ірод збудував першу велику штучну гавань на узбережжі в Кесарії, і з цієї гавані Павло відплив до Рима, через море Кілікії та Памфілії, повз Крит, до корабельної аварії на Мальті. Церква поширювалася тими самими морськими шляхами, від Антіохії й Александрії до Коринта й Рима."
    - "Сьогодні понад двадцять держав ділять середземноморське узбережжя, а Суецький канал, відкритий 1869 року, зробив його проходом між океанами. На біблійному березі лежать Газа, Ашкелон, Ашдод, Тель-Авів із давньою Яффою, Кесарія, Хайфа під горою Кармель, Акко, а по той бік кордону Тір, Сідон і Бейрут."
  es:
    - "El Mar Grande es el Mediterráneo, el mar que limitaba la tierra de Israel por el oeste. Se extiende casi 4000 km desde el estrecho de Gibraltar hasta el Levante y cubre unos 2,5 millones de kilómetros cuadrados; su cuenca oriental, frente al Levante, es la parte más cálida y salada. La Biblia hebrea lo llama sencillamente «la gran mar» o, como uno se orientaba mirando al este, «la mar postrera», que la Biblia sinodal traduce como mar occidental. El Éxodo lo llama una vez «la mar de Palestina». Griegos y romanos tampoco tuvieron un nombre único para él hasta la antigüedad tardía: Isidoro de Sevilla explica Mediterraneum como el mar que corre por medio de las tierras."
    - "El mar marcaba el borde de la tierra prometida: «Y el término occidental os será la gran mar», dijo Moisés del límite occidental, y a Josué se le prometió todo «hasta la gran mar del poniente del sol». Sin embargo, Israel era un pueblo de colinas, con una costa recta y sin puertos; los marinos eran los fenicios de Tiro y Sidón. Hiram dijo a Salomón, a propósito del cedro del Líbano: «yo la pondré en balsas por la mar», y la misma ruta sirvió para el Templo del regreso, cuando sidonios y tirios llevaron cedro al mar de Jope. Jonás bajó a Jope a buscar una nave rumbo a Tarsis. El salmista contempló «esta gran mar y ancha de términos: en ella pescados sin número, animales pequeños y grandes», y Ezequiel prometió que el mar Muerto rebosaría un día de peces «como el pescado de la gran mar, mucho en gran manera»."
    - "En la visión de Daniel, «los cuatro vientos del cielo combatían en la gran mar», y de ella salieron las cuatro bestias, los imperios que gobernaron a los judíos por turno. Bajo los romanos, que lo llamaban mare nostrum, el mar se convirtió en una vía: Herodes construyó el primer gran puerto artificial de la costa en Cesarea, y desde ese puerto navegó Pablo a Roma, por el mar de Cilicia y Panfilia, pasando Creta, hasta naufragar en Malta. La Iglesia se extendió por las mismas rutas marítimas, de Antioquía y Alejandría a Corinto y Roma."
    - "Hoy más de veinte Estados comparten la costa mediterránea, y el canal de Suez, abierto en 1869, lo ha convertido en un paso entre los océanos. En la costa bíblica se hallan Gaza, Ascalón, Asdod, Tel Aviv con la antigua Jope, Cesarea, Haifa al pie del monte Carmelo, Acre, y al otro lado de la frontera Tiro, Sidón y Beirut."
  pt:
    - "O Grande Mar é o Mediterrâneo, o mar que limitava a terra de Israel a oeste. Estende-se por quase 4.000 km, do Estreito de Gibraltar ao Levante, e cobre cerca de 2,5 milhões de quilômetros quadrados; sua bacia oriental, junto ao Levante, é a parte mais quente e mais salgada. A Bíblia hebraica o chama simplesmente “o grande mar” ou, já que para se orientar se olhava para o leste, o mar de trás e o mar extremo, que a Bíblia Sinodal traduz como o mar ocidental. Êxodo uma vez o chama “o mar dos filisteus”. Gregos e romanos também não tiveram um nome único para ele até a Antiguidade tardia: Isidoro de Sevilha explica Mediterraneum como o mar que corre pelo meio das terras."
    - "O mar marcava o limite da terra prometida: “vocês terão o mar Grande e a sua costa”, disse Moisés sobre a fronteira ocidental, e a Josué foi prometido tudo “até o grande mar na direção do pôr do sol”. Contudo, Israel era um povo das colinas, de costa reta e sem portos; os marinheiros eram os fenícios de Tiro e Sidom. Hirão disse a Salomão, sobre cedro do Líbano: “Eu as armarei em jangadas para irem pelo mar”, e a mesma rota serviu ao Templo do retorno, quando sidônios e tírios trouxeram cedro até o mar de Jope. Jonas desceu a Jope para achar um navio com destino a Társis. O salmista contemplou “o mar, grande e vasto, no qual há inumeráveis seres vivos”, e Ezequiel prometeu que o mar Morto um dia fervilharia de peixes “como os peixes do Mar Grande, muitíssimos”."
    - "Na visão de Daniel, “os quatro ventos do céu irrompiam sobre o grande mar”, e dele saíram as quatro feras, os impérios que dominaram os judeus um após o outro. Sob os romanos, que o chamavam mare nostrum, o mar tornou-se uma estrada: Herodes construiu o primeiro grande porto artificial da costa em Cesareia, e por esse porto Paulo navegou para Roma, pelo mar da Cilícia e da Panfília, passando por Creta, até o naufrágio em Malta. A igreja se espalhou pelas mesmas rotas marítimas, de Antioquia e Alexandria a Corinto e Roma."
    - "Hoje mais de vinte Estados partilham a costa do Mediterrâneo, e o Canal de Suez, aberto em 1869, fez dele uma passagem entre os oceanos. Na costa bíblica ficam Gaza, Ascalom, Asdode, Tel Aviv com a antiga Jope, Cesareia, Haifa ao pé do monte Carmelo, Acre e, do outro lado da fronteira, Tiro, Sidom e Beirute."
  de:
    - "Das Große Meer ist das Mittelmeer, das Meer, das das Land Israel im Westen begrenzte. Es erstreckt sich fast 4000 km von der Straße von Gibraltar bis zur Levante und bedeckt etwa 2,5 Millionen Quadratkilometer; sein östliches Becken vor der Levante ist der wärmste und salzigste Teil. Die hebräische Bibel nennt es schlicht „das große Meer“ oder, weil man sich beim Orientieren nach Osten wandte, „das Meer gegen Abend“ (wörtlich das hintere, das äußerste Meer), das die Synodalübersetzung als westliches Meer wiedergibt. Das zweite Buch Mose nennt es einmal „das Philistermeer“. Auch Griechen und Römer hatten bis in die Spätantike keinen einheitlichen Namen dafür: Isidor von Sevilla erklärt Mediterraneum als das Meer, das mitten durch die Länder fließt."
    - "Das Meer bezeichnete den Rand des verheißenen Landes: „Die Grenze gegen Abend soll diese sein, nämlich das große Meer“, sagte Mose von der Westgrenze, und Josua wurde alles zugesagt „bis an das große Meer gegen Abend“. Doch Israel war ein Bergvolk mit gerader, hafenloser Küste; Seefahrer waren die Phönizier von Tyrus und Sidon. Hiram sagte Salomo, er wolle die Stämme „in Flöße legen lassen auf dem Meer“, Zedernholz vom Libanon, und derselbe Weg diente dem Tempel der Heimkehr, als Sidonier und Tyrer Zedernholz „aufs Meer gen Japho“ brachten. Jona ging nach Joppe hinab, um ein Schiff nach Tarsis zu finden. Der Psalmist betrachtete „das Meer, das so groß und weit ist, da wimmelt's ohne Zahl, große und kleine Tiere“, und Hesekiel verhieß, das Tote Meer werde von Fischen wimmeln, denn dort werden „sehr viel Fische von allerlei Art sein, gleichwie im großen Meer“."
    - "In Daniels Vision „die vier Winde unter dem Himmel stürmten widereinander auf dem großen Meer“, und aus ihm stiegen die vier Tiere, die Reiche, die nacheinander über die Juden herrschten. Unter den Römern, die es mare nostrum nannten, wurde das Meer zur Hauptstraße: Herodes baute in Caesarea den ersten großen künstlichen Hafen der Küste, und von diesem Hafen segelte Paulus nach Rom, „durch das Meer bei Zilizien und Pamphylien“, an Kreta vorbei, bis zum Schiffbruch vor Malta. Die Kirche breitete sich auf denselben Seewegen aus, von Antiochia und Alexandria bis Korinth und Rom."
    - "Heute teilen sich mehr als zwanzig Staaten die Mittelmeerküste, und der 1869 eröffnete Suezkanal hat es zu einem Durchgang zwischen den Ozeanen gemacht. An der biblischen Küste liegen Gaza, Aschkelon, Aschdod, Tel Aviv mit dem antiken Joppe, Caesarea, Haifa unter dem Karmel, Akko und jenseits der Grenze Tyrus, Sidon und Beirut."
  fr:
    - "La Grande mer est la Méditerranée, la mer qui bornait à l’ouest le pays d’Israël. Elle s’étend sur près de 4 000 km du détroit de Gibraltar au Levant et couvre environ 2,5 millions de kilomètres carrés ; son bassin oriental, au large du Levant, en est la partie la plus chaude et la plus salée. La Bible hébraïque l’appelle simplement « la grande mer » ou, puisque l’on s’orientait face à l’est, la mer de derrière et la mer extrême, que la Bible synodale rend par mer occidentale. L’Exode l’appelle une fois « la mer des Philistins ». Les Grecs et les Romains n’avaient pas non plus de nom unique pour elle avant l’Antiquité tardive : Isidore de Séville explique Mediterraneum comme la mer qui coule au milieu des terres."
    - "La mer marquait la limite du pays promis : « Votre limite occidentale sera la grande mer », dit Moïse, et à Josué fut promis tout le pays « jusqu’à la grande mer vers le soleil couchant ». Pourtant Israël était un peuple de collines, avec une côte rectiligne sans port ; les marins étaient les Phéniciens de Tyr et de Sidon. Hiram dit à Salomon, à propos des cèdres du Liban : « je les expédierai par mer en radeaux », et la même voie servit pour le Temple du retour, quand Sidoniens et Tyriens amenèrent du cèdre par mer jusqu’à Joppé. Jonas descendit à Joppé pour trouver un navire à destination de Tarsis. Le psalmiste contemplait « la grande et vaste mer : là se meuvent sans nombre des animaux petits et grands », et Ézéchiel promit que la mer Morte regorgerait un jour de poissons « comme les poissons de la grande mer, et ils seront très nombreux »."
    - "Dans la vision de Daniel, « les quatre vents des cieux firent irruption sur la grande mer », et de là sortirent les quatre bêtes, les empires qui dominèrent tour à tour les Juifs. Sous les Romains, qui l’appelaient mare nostrum, la mer devint une grande route : Hérode construisit sur la côte, à Césarée, le premier grand port artificiel, et de ce port Paul embarqua pour Rome, par la mer de Cilicie et de Pamphylie, le long de la Crète, jusqu’au naufrage de Malte. L’Église se répandit par les mêmes routes maritimes, d’Antioche et d’Alexandrie à Corinthe et à Rome."
    - "Aujourd’hui, plus de vingt États se partagent le littoral méditerranéen, et le canal de Suez, ouvert en 1869, en a fait un passage entre les océans. Sur le rivage biblique se trouvent Gaza, Askalon, Asdod, Tel-Aviv avec l’antique Joppé, Césarée, Haïfa au pied du mont Carmel, Acre, et, de l’autre côté de la frontière, Tyr, Sidon et Beyrouth."
  pl:
    - "Morze Wielkie to Morze Śródziemne, morze, które ograniczało ziemię Izraela od zachodu. Rozciąga się na blisko 4000 km od Cieśniny Gibraltarskiej po Lewant i obejmuje około 2,5 mln km²; jego wschodnia kotlina, przy Lewancie, jest najcieplejszą i najsłoniejszą częścią. Biblia hebrajska nazywa je po prostu „morze wielkie”, a także, ponieważ orientowano się twarzą na wschód, morzem tylnym i morzem ostatecznym, co Biblia synodalna oddaje jako morze zachodnie. Księga Wyjścia raz wyznacza granicę „aż do morza Filistyńskiego”. Grecy i Rzymianie też nie mieli dla niego jednej nazwy aż do późnej starożytności: Izydor z Sewilli objaśnia Mediterraneum jako morze, które przepływa przez środek ziem."
    - "Morze wyznaczało kraniec ziemi obiecanej: „Zachodnią zaś granicę będziecie mieli morze wielkie”, mówił Mojżesz o zachodniej granicy, a Jozuemu obiecano wszystko „aż do morza wielkiego na zachód słońca”. Jednak Izrael był ludem wzgórz, z prostym wybrzeżem bez portów; żeglarzami byli Fenicjanie z Tyru i Sydonu. Hiram powiedział Salomonowi o drzewie cedrowym z Libanu: „każę złożyć w tratwy, i spuścić morzem”, i tą samą drogą korzystano przy Świątyni po powrocie z wygnania, gdy Sydończycy i Tyryjczycy zwozili cedr do morza Joppy. Jonasz zszedł do Jafy, by znaleźć statek płynący do Tarszisz. Psalmista śpiewał: „W morzu zaś wielkiem i bardzo szerokiem, tam są płazy, którym nie masz liczby”, a Ezechiel obiecał, że Morze Martwe będzie kiedyś pełne ryb: „ryb będzie bardzo wiele rozmaitego rodzaju, jako ryb morza wielkiego”."
    - "W widzeniu Daniela „cztery wiatry niebieskie potykały się na morzu wielkiem”, a z niego wyszły cztery bestie, imperia, które kolejno panowały nad Żydami. Za Rzymian, którzy nazywali je mare nostrum, morze stało się szlakiem: Herod zbudował pierwszy wielki sztuczny port na wybrzeżu w Cezarei, i z tego portu Paweł popłynął do Rzymu, przez morze Cylicji i Pamfilii, obok Krety, na rozbicie pod Maltą. Kościół rozszerzał się tymi samymi szlakami morskimi, od Antiochii i Aleksandrii po Korynt i Rzym."
    - "Dziś ponad dwadzieścia państw dzieli wybrzeże Morza Śródziemnego, a Kanał Sueski, otwarty w 1869 r., uczynił je przejściem między oceanami. Na biblijnym brzegu leżą Gaza, Aszkelon, Aszdod, Tel Awiw ze starożytną Jafą, Cezarea, Hajfa pod Karmelem, Akko, a za granicą Tyr, Sydon i Bejrut."
  it:
    - "Il Mare Grande è il Mediterraneo, il mare che delimitava a ovest la terra d’Israele. Si estende per quasi 4000 km dallo Stretto di Gibilterra al Levante e copre circa 2,5 milioni di chilometri quadrati; il suo bacino orientale, al largo del Levante, è la parte più calda e più salata. La Bibbia ebraica lo chiama semplicemente «il mare grande» oppure, poiché per orientarsi si guardava a est, «il mare posteriore» e «il mare estremo», che la Bibbia sinodale rende come mare occidentale. L’Esodo lo chiama una volta «mar de’ Filistei». Neppure i Greci e i Romani ebbero per esso un unico nome fino alla tarda antichità: Isidoro di Siviglia spiega Mediterraneum come il mare che scorre in mezzo alle terre."
    - "Il mare segnava il margine della terra promessa: «La vostra frontiera a occidente sarà il mar grande», disse Mosè del confine occidentale, e a Giosuè fu promesso tutto «sino al mar grande, verso occidente». Eppure Israele era un popolo dei monti, con una costa dritta e senza porti; i marinai erano i Fenici di Tiro e di Sidone. Chiram disse a Salomone: «io li spedirò per mare su zattere» di cedro del Libano, e la stessa rotta servì al Tempio del ritorno, quando Sidoni e Tiri portarono cedro per mare sino a Giaffa. Giona scese a Giaffa per trovare una nave diretta a Tarsis. Il salmista guardava «il mare, grande ed ampio, dove si muovon creature senza numero», ed Ezechiele promise che il Mar Morto avrebbe un giorno brulicato di pesci «come il pesce del mar Grande, e in grande abbondanza»."
    - "Nella visione di Daniele si vide «scatenarsi sul mar grande i quattro venti del cielo», e da esso salirono le quattro bestie, gli imperi che governarono a turno i Giudei. Sotto i Romani, che lo chiamavano mare nostrum, il mare divenne un’autostrada: Erode costruì a Cesarea il primo grande porto artificiale della costa, e da quel porto Paolo salpò per Roma, attraverso il mare di Cilicia e di Panfilia, oltre Creta, fino al naufragio a Malta. La Chiesa si diffuse lungo le stesse rotte marittime, da Antiochia e Alessandria a Corinto e Roma."
    - "Oggi più di venti Stati condividono la costa mediterranea, e il Canale di Suez, aperto nel 1869, ne ha fatto un passaggio fra gli oceani. Sulla costa biblica si trovano Gaza, Ascalona, Asdod, Tel Aviv con l’antica Giaffa, Cesarea, Haifa sotto il Monte Carmelo, Acri e, oltre il confine, Tiro, Sidone e Beirut."
  nl:
    - "De Grote Zee is de Middellandse Zee, de zee die het land Israël in het westen begrensde. Zij strekt zich bijna 4000 km uit van de Straat van Gibraltar tot de Levant en beslaat ongeveer 2,5 miljoen vierkante kilometer; het oostelijke bekken, bij de Levant, is het warmste en zoutste deel. De Hebreeuwse Bijbel noemt haar eenvoudig “de grote zee”, of, omdat men zich naar het oosten oriënteerde, “de achterste zee”, die de Synodale Bijbel weergeeft als de westelijke zee. Exodus noemt haar eenmaal “de zee der Filistijnen”. Ook de Grieken en Romeinen hadden tot in de late oudheid geen vaste naam voor haar: Isidorus van Sevilla verklaart Mediterraneum als de zee die midden door de landen stroomt."
    - "De zee markeerde de rand van het beloofde land: “daar zal u de grote zee de landpale zijn”, zei Mozes over de westgrens, en Jozua kreeg alles beloofd “tot aan de grote zee, tegen den ondergang der zon”. Toch was Israël een volk van de heuvels, met een rechte kust zonder havens; de zeelieden waren de Feniciërs van Tyrus en Sidon. Hiram zei tegen Salomo: “ik zal het op vlotten over de zee doen voeren”, het cederhout uit Libanon, en dezelfde route diende voor de tempel van de terugkeer, toen Sidoniërs en Tyriërs cederhout naar de zee van Joppe brachten. Jona ging naar Joppe af om een schip naar Tarsis te vinden. De psalmist zag “deze zee, die groot en wijd van ruimte is, daarin is het wriemelende gedierte, en dat zonder getal”, en Ezechiël beloofde dat de Dode Zee eens zou wemelen van vis, “als de vis van de grote zee, zeer menigvuldig”."
    - "In Daniëls visioen “de vier winden des hemels braken voort op de grote zee”, en eruit kwamen de vier dieren, de rijken die de Joden na elkaar beheersten. Onder de Romeinen, die haar mare nostrum noemden, werd de zee een snelweg: Herodes bouwde de eerste grote kunstmatige haven aan de kust bij Caesarea, en vanuit die haven voer Paulus naar Rome, door de zee van Cilicië en Pamfylië, langs Kreta, tot schipbreuk bij Malta. De kerk verspreidde zich langs dezelfde zeeroutes, van Antiochië en Alexandrië naar Korinthe en Rome."
    - "Nu delen meer dan twintig staten de Middellandse Zeekust, en het Suezkanaal, geopend in 1869, heeft haar tot een doorgang tussen de oceanen gemaakt. Aan de bijbelse kust liggen Gaza, Askelon, Asdod, Tel Aviv met het oude Joppe, Caesarea, Haifa onder de Karmel, Akko, en over de grens Tyrus, Sidon en Beiroet."
  cs:
    - "Velké moře je Středozemní moře, moře, které vymezovalo izraelskou zemi na západě. Táhne se téměř 4 000 km od Gibraltarského průlivu k Levantě a zaujímá asi 2,5 milionu čtverečních kilometrů; jeho východní pánev, u Levanty, je nejteplejší a nejslanější částí. Hebrejská Bible je nazývá prostě „moře veliké“ nebo, protože se při určování světových stran stálo čelem k východu, moře zadní a moře nejzazší, což synodální Bible vykládá jako moře západní. Exodus je jednou nazývá „moře Filistinské“. Ani Řekové a Římané neměli pro ně až do pozdní antiky jediné jméno: Isidor Sevillský vysvětluje Mediterraneum jako moře, které protéká středem zemí."
    - "Moře vyznačovalo okraj zaslíbené země: „Pomezí pak západní budete míti moře veliké“, řekl Mojžíš o západní hranici, a Jozue dostal zaslíbeno vše „až do moře velikého na západ slunce“. Izrael byl však lid hor, s rovným pobřežím bez přístavů; námořníky byli Féničané z Týru a Sidónu. Chíram řekl Šalomounovi o cedrech z Libanonu: „dám je v vořích splaviti po moři“, a stejná trasa sloužila chrámu po návratu, když Sidonští a Týrští vezli cedr k moři Joppe. Jonáš sestoupil do Joppe hledat loď do Taršíše. Žalmista praví: „V moři pak velikém a přeširokém, tamť jsou hmyzové nesčíslní“, a Ezechiel slíbil, že Mrtvé moře bude jednou hemžit rybami „jako ryb moře velikého, velmi mnoho“."
    - "V Danielově vidění „čtyři větrové nebeští bojovali na moři velikém“ a z něj vyšla čtyři zvířata, říše, které po sobě vládly Židům. Za Římanů, kteří je nazývali mare nostrum, se moře stalo dálnicí: Herodes vybudoval první velký umělý přístav na pobřeží v Cesareji a z tohoto přístavu Pavel plul do Říma, přes moře Kilikie a Pamfylie, kolem Kréty, k ztroskotání u Malty. Církev se šířila týmiž námořními cestami, z Antiochie a Alexandrie do Korintu a Říma."
    - "Dnes sdílí pobřeží Středozemního moře přes dvacet států a Suezský průplav, otevřený roku 1869, z něj učinil průchod mezi oceány. Na biblickém pobřeží leží Gaza, Aškelon, Ašdod, Tel Aviv se starověkou Joppe, Cesarea, Haifa pod Karmelem, Akko a za hranicí Týr, Sidón a Bejrút."
  sv:
    - "Stora havet är Medelhavet, havet som begränsade Israels land i väster. Det sträcker sig nära 4 000 km från Gibraltar sund till Levanten och täcker omkring 2,5 miljoner kvadratkilometer; dess östra bäcken, utanför Levanten, är den varmaste och saltaste delen. Hebreiska bibeln kallar det helt enkelt ”Stora havet”, eller, eftersom man orienterade sig mot öster, ”Västra havet” (hebreiskans ”det bakre” eller ”yttersta” havet), vilket också den ryska synodalbibeln återger som västra havet. Andra Moseboken kallar det en gång ”filistéernas hav”. Inte heller greker och romare hade något enda namn på det förrän sen antik: Isidorus av Sevilla förklarar Mediterraneum som havet som flyter genom mitten av länderna."
    - "Havet markerade det utlovade landets kant: ”eder gräns i väster skall vara Stora havet”, sade Mose om västgränsen, och Josua fick löftet om allt ”ända till Stora havet västerut”. Ändå var Israel ett folk av bergen, med en rak, hamnlös kust; sjöfararna var fenicierna i Tyros och Sidon. Hiram lovade Salomo cederträ från Libanon: ”jag skall låta lägga det i flottar på havet”, och samma väg tjänade återkomstens tempel, när sidonier och tyrier förde cederträ sjöledes till Joppe. Jona gick ned till Joppe för att finna ett skepp till Tarshish. Psalmisten såg på ”havet, det stora ock vida: ett tallöst vimmel rör sig däri”, och Hesekiel lovade att Döda havet en dag skulle vimla av ”fiskar av olika slag i stor myckenhet, alldeles såsom i Stora havet”."
    - "I Daniels syn ”himmelens fyra vindar stormade fram mot det stora havet”, och ur det steg de fyra djuren, imperierna som i tur och ordning härskade över judarna. Under romarna, som kallade det mare nostrum, blev havet en landsväg: Herodes byggde den första stora konstgjorda hamnen på kusten i Caesarea, och från den hamnen seglade Paulus till Rom, genom havet utanför Kilikien och Pamfylien, förbi Kreta, till skeppsbrott vid Malta. Kyrkan spreds längs samma sjövägar, från Antiochia och Alexandria till Korinth och Rom."
    - "I dag delar mer än tjugo stater Medelhavets kust, och Suezkanalen, öppnad 1869, har gjort det till en genomfart mellan oceanerna. På den bibliska kusten ligger Gaza, Ashkelon, Ashdod, Tel Aviv med forntidens Joppe, Caesarea, Haifa under Karmel, Akko, och över gränsen Tyros, Sidon och Beirut."
  nb:
    - "Storhavet er Middelhavet, havet som avgrenset Israels land i vest. Det strekker seg nesten 4000 km fra Gibraltarstredet til Levanten og dekker omtrent 2,5 millioner kvadratkilometer; dets østlige basseng, utenfor Levanten, er den varmeste og saltholdigste delen. Den hebraiske Bibelen kaller det ganske enkelt «det store hav», eller, siden man vendte seg mot øst for å orientere seg, «havet i vest», det bakre eller ytterste hav, som den synodale bibelen gjengir som det vestlige havet. Andre Mosebok kaller det én gang «filistrenes hav». Heller ikke grekerne og romerne hadde ett enkelt navn på det før sent i oldtiden: Isidor av Sevilla forklarer Mediterraneum som havet som strømmer gjennom midten av landene."
    - "Havet markerte det lovede landets rand: «I vest skal eders grense være det store hav og landet langsmed det», sa Moses om den vestlige grensen, og Josva ble lovet alt «helt til det store hav i vest». Likevel var Israel et folk i åsene, med en rett kyst uten havner; sjøfolkene var fønikerne i Tyros og Sidon. Hiram sa til Salomo: «jeg vil la dem legge i flåter på havet», sedertre fra Libanon, og den samme ruten tjente tempelet etter hjemkomsten, da sidonierne og tyrerne førte sedertre sjøveien til Jaffa. Jona dro ned til Jaffa for å finne et skip på vei til Tarsis. Salmisten så på «havet, stort og vidtstrakt; der er en vrimmel uten tall», og Esekiel lovet at Dødehavet en dag skulle ha «fisk av forskjellig slag i stor mengde, som i det store hav»."
    - "I Daniels syn «brøt himmelens fire vinder frem over det store hav», og ut av det kom de fire dyrene, rikene som etter tur styrte jødene. Under romerne, som kalte det mare nostrum, ble havet en hovedvei: Herodes bygde den første store kunstige havnen på kysten ved Cæsarea, og fra den havnen seilte Paulus til Roma, gjennom havet ved Kilikia og Pamfylia, forbi Kreta, til skipbrudd på Malta. Kirken spredte seg langs de samme sjøveiene, fra Antiokia og Aleksandria til Korint og Roma."
    - "I dag deler mer enn tjue stater Middelhavets kyst, og Suezkanalen, åpnet i 1869, har gjort det til en passasje mellom verdenshavene. På den bibelske kysten ligger Gasa, Asjkelon, Asjdod, Tel Aviv med det gamle Jaffa, Cæsarea, Haifa under Karmel, Akko, og over grensen Tyros, Sidon og Beirut."
  tl:
    - "Ang Malaking Dagat ay ang Mediteraneo, ang dagat na naghangganan sa lupain ng Israel sa kanluran. Umaabot ito nang halos 4,000 km mula sa Kipot ng Gibraltar hanggang sa Levant at sumasaklaw ng mga 2.5 milyong kilometrong parisukat; ang silangang palanggana nito, sa tapat ng Levant, ang pinakamainit at pinakamaalat na bahagi. Tinatawag lamang ito ng Biblia Hebreo na “ang malaking dagat”, o, dahil humaharap ang tao sa silangan upang tumukoy ng direksiyon, ang hulihang dagat at ang pinakamalayong dagat, na isinasalin ng Bibliyang Synodal na kanlurang dagat. Minsang tinatawag ito ng Exodo na “dagat ng Filistia”. Wala ring iisang pangalan para rito ang mga Griyego at Romano hanggang sa huling sinaunang panahon: ipinaliliwanag ni Isidore ng Seville ang Mediterraneum bilang dagat na dumadaloy sa gitna ng mga lupain."
    - "Hangganan ng lupang pangako ang dagat: “ang magiging inyong hangganang kalunuran ay ang malaking dagat at ang baybayin niyaon”, sabi ni Moises, at pinangakuan si Josue ng lahat “hanggang sa malaking dagat sa dakong nilulubugan ng araw”. Ngunit bayan ng burol ang Israel, na may tuwid at walang daungang baybayin; Fenicio ang mandaragat ng Tiro at Sidon. Sabi ni Hiram kay Salomon, “aking gagawing mga balsa upang dumaan sa dagat” ang sedro mula sa Libano, at gayon din sa Templo ng pagbabalik, nang magdala ng sedro sa dagat sa Joppa ang Sidonio at Tiro. Lumusong si Jonas sa Joppe para humanap ng “sasakyan na patungo sa Tarsis”. Tumingin ang mang-aawit sa “dagat, na malaki at maluwang, na ginagalawan ng di mabilang na mga bagay”, at ipinangako ni Ezekiel na mapupuno ng isda balang araw ang Dagat na Patay “gaya ng isda sa malaking dagat, na totoong marami”."
    - "Sa pangitain ni Daniel, “ang apat na hangin ng langit ay nagsisihihip sa malaking dagat”, at mula rito ay lumabas ang apat na hayop, ang mga imperyong namahala sa mga Judio nang sunud-sunod. Sa ilalim ng mga Romano, na tumawag dito na mare nostrum, ang dagat ay naging lansangan: itinayo ni Herodes ang unang malaking artipisyal na daungan sa baybayin sa Cesarea, at sa daungang iyon naglayag si Pablo patungong Roma, sa dagat ng Cilicia at Pamfilia, lampas sa Creta, hanggang sa pagkawasak sa Malta. Kumalat ang iglesia sa kahabaan ng parehong mga ruta ng dagat, mula Antioquia at Alejandria hanggang Corinto at Roma."
    - "Ngayon, mahigit dalawampung estado ang nagbabahagi ng baybayin ng Mediteraneo, at ang Kanal ng Suez, na binuksan noong 1869, ay ginawa itong daanan sa pagitan ng mga karagatan. Sa baybayin ng Biblia ay naroon ang Gaza, Ascalon, Asdod, Tel Aviv kasama ang sinaunang Joppa, Cesarea, Haifa sa ilalim ng Bundok Carmelo, Acre, at sa kabila ng hangganan ang Tiro, Sidon at Beirut."
