# Overview article (ADR 0007). Mainstream facts only; the "Carmel" of 2 Kings 19:23 is noted as a common noun for Lebanon's orchard land; Song 7:5 is Synodal 7:6.
id: mount-carmel
place: a3e21c6
title:
  en: "Mount Carmel"
  ru: "Гора Кармил"
  uk: "Кармель"
  es: "Monte Carmelo"
  pt: "Monte Carmelo"
  de: "Karmel"
  fr: "Mont Carmel"
body:
  en:
    - "Mount Carmel is the wooded limestone ridge that runs some 25 km from the Mediterranean south-east into the hills of Samaria, rising to 546 m and dropping to the sea at the headland above Haifa. The name means a garden or orchard land, and the Bible uses it for the mountain and for any fruitful country: the “forest of his Carmel” that Sennacherib boasted of lay in Lebanon, and the Carmel of Nabal was a town near Hebron. Jokneam “of Carmel” was a Canaanite royal city at its foot, and the border of Asher reached “to Carmel westward”. The caves on its western slopes (Tabun, Skhul, el-Wad) hold remains of Neanderthals and early modern humans, dug by Dorothy Garrod in 1929–1934."
    - "Carmel is the mountain of Elijah. Ahab gathered “all Israel unto mount Carmel”, and there the prophet asked, “How long halt ye between two opinions?”, rebuilt the broken altar of the LORD with twelve stones, drenched his sacrifice with water, and “the fire of the LORD fell”; the people cried, “The LORD, he is the God”, the prophets of Baal were killed at the Kishon, and Elijah, his face between his knees on the top of Carmel, prayed until a little cloud rose out of the sea and the drought broke. Elisha later made the mountain his home, and the Shunammite rode there to find him when her son died."
    - "For the poets Carmel is the picture of plenty: the bride's head is “like Carmel”, Israel restored “shall feed on Carmel and Bashan”, the desert shall be given “the excellency of Carmel and Sharon”; and when God judges, “the top of Carmel shall wither”. The mountain was holy to others too. Pseudo-Scylax calls it a sacred mountain of Zeus, Iamblichus says Pythagoras withdrew to it, and Tacitus tells how Vespasian, in AD 69, consulted the god Carmel, who had neither image nor temple, only an altar."
    - "Byzantine and medieval monks settled in Elijah's caves, and in the early thirteenth century the hermits there received the rule that made them the Carmelite order. Their monastery of Stella Maris stands on the headland, and the Muhraqa, the chapel at the south-eastern end, marks the traditional site of the sacrifice. Haifa climbs the northern slope, the Baha'i gardens cut its face, the prehistoric caves became a World Heritage site in 2012, and the ridge is a national park, badly burned in 2010."
  ru:
    - "Гора Кармил — лесистый известняковый хребет, который тянется километров на двадцать пять от Средиземного моря на юго-восток к холмам Самарии, поднимается до 546 м и обрывается к морю мысом над Хайфой. Имя означает сад или плодовую землю, и Библия называет так и гору, и вообще всякий плодородный край: роща, которой хвалился Сеннахирим, по-еврейски зовётся кармилом, но лежала на Ливане, а Кармил Навала был городом близ Хеврона. Иокнеам «при Кармиле» был ханаанским царским городом у его подножия, а предел Асира примыкал «к Кармилу с западной стороны». В пещерах на его западных склонах (Табун, Схул, Эль-Вад) найдены останки неандертальцев и ранних современных людей; их раскапывала Дороти Гаррод в 1929–1934 годах."
    - "Кармил — гора Илии. Ахав собрал «всего Израиля на гору Кармил», и там пророк спросил: «долго ли вам хромать на оба колена?», восстановил разрушенный жертвенник Господень из двенадцати камней и залил жертву водой. «И ниспал огонь Господень и пожрал всесожжение, и дрова, и камни, и прах, и поглотил воду, которая во рве»; народ воскликнул: «Господь есть Бог», пророков Ваала перебили у Киссона, а Илия, положив лицо между коленами на вершине Кармила, молился, пока из моря не поднялось маленькое облако и не кончилась засуха. Позже на горе жил Елисей, и Сонамитянка поскакала туда к нему, когда умер её сын."
    - "Для поэтов Кармил — образ изобилия: голова невесты «как Кармил», возвращённому Израилю обещано, что «будет он пастись на Кармиле и Васане», пустыне дастся «великолепие Кармила и Сарона»; а когда судит Бог, «иссохнет вершина Кармила». Гора была святой и для других. Псевдо-Скилак называет её священной горой Зевса, Ямвлих говорит, что на неё удалялся Пифагор, а Тацит рассказывает, как Веспасиан в 69 г. н. э. вопрошал бога Кармила, у которого не было ни изображения, ни храма — только жертвенник."
    - "Византийские и средневековые монахи селились в пещерах Илии, а в начале XIII века тамошние отшельники получили устав, сделавший их орденом кармелитов. Их монастырь Стелла Марис стоит на мысу, а Мухрака, часовня на юго-восточном конце хребта, отмечает предание о месте жертвоприношения. По северному склону взбирается Хайфа, его лицо прорезают сады бахаи, доисторические пещеры стали объектом Всемирного наследия в 2012 году, а хребет — национальный парк, сильно пострадавший от пожара в 2010 году."
  uk:
    - "Кармель — лісистий вапняковий хребет, що тягнеться приблизно на 25 км від Середземного моря на південний схід у пагорби Самарії, сягаючи 546 м і спадаючи до моря на мисі над Хайфою. Назва означає сад або садову землю, і Біблія вживає її для гори й для будь-якого родючого краю: «найгусчого саду його», яким хвалився Сінаххеріб, лежав у Лівані, а Кармель Навала був містом поблизу Хеврона. Йокнеам «коло Кармиля» був ханаанським царським містом біля його підніжжя, а межа Асіра сягала «в Кармел з західнього боку». Печери на його західних схилах (Табун, Схул, ель-Вад) зберігають рештки неандертальців і ранніх сучасних людей, розкопані Дороті Гаррод у 1929–1934 рр."
    - "Кармель — гора Іллі. Ахав «послав Ахаб по всього Ізраїля та й поскликав пророки на Кармель-гору», і там пророк запитав: «Доки ще кульгати мете на оба боки?», відбудував зруйнований жертовник Господа з дванадцяти каменів, облив свою жертву водою, і «спав огонь Господень»; народ вигукнув: «Господь є Богом», пророків Ваала вбито біля Кішону, а Ілля, з обличчям між колінами на вершині Кармеля, молився, аж поки маленька хмарка не піднялася з моря і посуха не скінчилася. Єлисей пізніше зробив гору своїм домом, і сунамітянка поїхала туди шукати його, коли помер її син."
    - "Для поетів Кармель — образ достатку: голова нареченої «мов Кармель», відновлений Ізраїль «буде пастися на Кармелї й Базанї», пустелі буде дано «роскіш Кармеля й Сарону»; а коли Бог судить, «вигорять верховини Кармелські». Гора була святою й для інших. Псевдо-Скілак називає її священною горою Зевса, Ямвліх каже, що Піфагор усамітнювався на ній, а Тацит розповідає, як Веспасіан 69 р. н. е. запитував бога Кармеля, який не мав ні зображення, ні храму, лише жертовник."
    - "Візантійські й середньовічні ченці оселялися в печерах Іллі, а на початку XIII ст. тамтешні відлюдники прийняли статут, що зробив їх орденом кармелітів. Їхній монастир Стела Маріс стоїть на мисі, а Мухрака, каплиця на південно-східному краю, позначає традиційне місце жертви. Хайфа здіймається північним схилом, сади бахаїв прорізають його поверхню, доісторичні печери стали об’єктом Всесвітньої спадщини 2012 р., а хребет є національним парком, сильно спаленим 2010 р."
  es:
    - "El monte Carmelo es la cresta calcárea cubierta de bosque que se extiende unos 25 km desde el Mediterráneo hacia el sudeste, hasta las colinas de Samaria, alcanza los 546 m y cae hacia el mar en el cabo sobre Haifa. El nombre significa tierra de jardín o de huerto, y la Biblia lo usa para la montaña y para cualquier país fértil: el «monte de su Carmel» del que se jactó Senaquerib estaba en el Líbano, y el Carmel de Nabal era una ciudad cerca de Hebrón. Jocneam «de Carmel» era una ciudad real cananea a su pie, y la frontera de Aser llegaba «hasta Carmel al occidente». Las cuevas de sus laderas occidentales (Tabun, Skhul, el-Wad) guardan restos de neandertales y de los primeros humanos modernos, excavados por Dorothy Garrod en 1929–1934."
    - "El Carmelo es el monte de Elías. Acab reunió «á todo Israel en el monte de Carmelo», y allí el profeta preguntó: «¿Hasta cuándo claudicaréis vosotros entre dos pensamientos?», reparó el altar derruido de Jehová con doce piedras, empapó su sacrificio con agua, y «cayó fuego de Jehová»; el pueblo exclamó: «¡Jehová es el Dios!», los profetas de Baal fueron muertos junto al Cisón, y Elías, con el rostro entre las rodillas en la cima del Carmelo, oró hasta que una pequeña nube subió del mar y se acabó la sequía. Eliseo hizo más tarde de la montaña su morada, y la sunamita cabalgó hasta allí a buscarlo cuando murió su hijo."
    - "Para los poetas el Carmelo es la imagen de la abundancia: la cabeza de la esposa es «como el Carmelo», Israel restaurado «pacerá en el Carmelo y en Basán», al desierto se le dará «la hermosura de Carmel y de Sarón»; y cuando Dios juzga, «secaráse la cumbre del Carmelo». La montaña era sagrada también para otros. Pseudo-Escílax la llama monte sagrado de Zeus, Jámblico dice que Pitágoras se retiró a ella, y Tácito cuenta cómo Vespasiano, en 69 d. C., consultó al dios Carmelo, que no tenía imagen ni templo, solo un altar."
    - "Monjes bizantinos y medievales se establecieron en las cuevas de Elías, y a comienzos del siglo XIII los ermitaños de allí recibieron la regla que los convirtió en la orden carmelita. Su monasterio de Stella Maris se alza en el cabo, y la Muhraqa, la capilla del extremo sudoriental, señala el lugar tradicional del sacrificio. Haifa trepa por la ladera norte, los jardines bahaíes cortan su frente, las cuevas prehistóricas fueron declaradas Patrimonio Mundial en 2012, y la cresta es un parque nacional, gravemente quemado en 2010."
  pt:
    - "O monte Carmelo é a crista calcária arborizada que corre cerca de 25 km do Mediterrâneo para sudeste até as colinas de Samaria, elevando-se a 546 m e caindo para o mar no promontório acima de Haifa. O nome significa terra de jardim ou pomar, e a Bíblia o usa para a montanha e para qualquer país fértil: a floresta do seu Carmelo, de que Senaqueribe se gabou, ficava no Líbano, e o Carmelo de Nabal era uma cidade perto de Hebrom. Jocneão “no Carmelo” era uma cidade real cananeia ao seu pé, e a fronteira de Aser ia “ao Carmelo, para o oeste”. As cavernas de suas encostas ocidentais (Tabun, Skhul, el-Wad) guardam restos de neandertais e dos primeiros humanos modernos, escavadas por Dorothy Garrod em 1929–1934."
    - "O Carmelo é o monte de Elias. Acabe reuniu todo o Israel “no monte Carmelo”, e ali o profeta perguntou: “Até quando vocês vacilarão entre os dois lados?”, reconstruiu com doze pedras o altar do SENHOR que fora derrubado, encharcou seu sacrifício com água, e “o fogo do SENHOR caiu”; o povo exclamou: “O SENHOR, ele é Deus!”, os profetas de Baal foram mortos no Quisom, e Elias, com o rosto entre os joelhos no topo do Carmelo, orou até que uma pequena nuvem subisse do mar e a seca se quebrasse. Eliseu depois fez da montanha a sua morada, e a sunamita cavalgou até lá para encontrá-lo quando seu filho morreu."
    - "Para os poetas, o Carmelo é a imagem da abundância: a cabeça da noiva se ergue “como o Carmelo”, Israel restaurado “se alimentará no Carmelo e em Basã”, ao deserto será dada “a excelência do Carmelo e de Sarom”; e quando Deus julga, “o topo do Carmelo secará”. A montanha era santa também para outros. Pseudo-Cílax a chama de monte sagrado de Zeus, Jâmblico diz que Pitágoras se retirou para ela, e Tácito conta que Vespasiano, em 69 d.C., consultou o deus Carmelo, que não tinha imagem nem templo, apenas um altar."
    - "Monges bizantinos e medievais se estabeleceram nas cavernas de Elias, e no início do século XIII os eremitas ali receberam a regra que os fez a ordem carmelita. Seu mosteiro de Stella Maris está no promontório, e a Muhraqa, a capela na extremidade sudeste, marca o sítio tradicional do sacrifício. Haifa sobe pela encosta norte, os jardins bahá'ís cortam sua face, as cavernas pré-históricas tornaram-se Patrimônio Mundial em 2012, e a crista é um parque nacional, gravemente queimado em 2010."
  de:
    - "Der Karmel ist der bewaldete Kalksteinrücken, der sich etwa 25 km vom Mittelmeer nach Südosten in das Bergland von Samaria zieht, bis auf 546 m ansteigt und an der Landspitze über Haifa zum Meer abfällt. Der Name bedeutet Garten oder Obstland, und die Bibel verwendet ihn für den Berg und für jedes fruchtbare Land: Der „Wald seines Baumgartens“, den Sanherib zu fällen prahlte (im Hebräischen sein Karmel), lag im Libanon, und der Karmel Nabals war eine Stadt bei Hebron. Jokneam „am Karmel“ war eine kanaanäische Königsstadt an seinem Fuß, und die Grenze Assers stieß „an den Karmel am Meer“. Die Höhlen an seinen Westhängen (Tabun, Skhul, el-Wad) bergen Reste von Neandertalern und frühen modernen Menschen, 1929–1934 von Dorothy Garrod ausgegraben."
    - "Der Karmel ist der Berg Elias. Ahab ließ „das ganze Israel auf den Berg Karmel“ versammeln; dort fragte der Prophet: „Wie lange hinkt ihr auf beide Seiten?“, baute den zerbrochenen Altar des HERRN mit zwölf Steinen wieder auf, übergoss sein Opfer mit Wasser, und es heißt: „Da fiel das Feuer des HERRN herab“; das Volk rief: „Der HERR ist Gott, der HERR ist Gott!“, die Propheten Baals wurden am Kischon getötet, und Elia betete, sein Gesicht zwischen den Knien, auf der Spitze des Karmel, bis eine kleine Wolke aus dem Meer aufstieg und die Dürre brach. Elisa machte den Berg später zu seiner Heimat, und die Schunemiterin ritt dorthin, um ihn zu finden, als ihr Sohn starb."
    - "Für die Dichter ist der Karmel das Bild der Fülle: Das Haupt der Braut steht „wie der Karmel“, das wiederhergestellte Israel wird „auf Karmel und Basan weiden“, der Wüste wird „der Schmuck Karmels und Sarons“ gegeben; und wenn Gott richtet, wird „der Karmel oben verdorren“. Der Berg war auch anderen heilig. Pseudo-Skylax nennt ihn einen heiligen Berg des Zeus, Jamblichos sagt, Pythagoras habe sich dorthin zurückgezogen, und Tacitus erzählt, wie Vespasian im Jahr 69 n. Chr. den Gott Karmel befragte, der weder Bild noch Tempel hatte, nur einen Altar."
    - "Byzantinische und mittelalterliche Mönche ließen sich in Elias Höhlen nieder, und im frühen 13. Jahrhundert erhielten die Eremiten dort die Regel, die sie zum Karmelitenorden machte. Ihr Kloster Stella Maris steht auf der Landspitze, und die Muhraqa, die Kapelle am südöstlichen Ende, bezeichnet die überlieferte Stätte des Opfers. Haifa klettert am Nordhang hinauf, die Bahai-Gärten zerschneiden seine Front, die prähistorischen Höhlen wurden 2012 Welterbe, und der Rücken ist ein Nationalpark, 2010 schwer verbrannt."
  fr:
    - "Le mont Carmel est la crête boisée de calcaire qui s’étend sur quelque 25 km de la Méditerranée vers le sud-est dans les collines de Samarie, s’élevant à 546 m et tombant dans la mer au promontoire au-dessus de Haïfa. Le nom signifie jardin ou verger, et la Bible l’emploie pour la montagne et pour tout pays fertile : la forêt de son Carmel dont se vantait Sanchérib se trouvait au Liban, et le Carmel de Nabal était une ville près d’Hébron. Jokneam « au Carmel » était une ville royale cananéenne à son pied, et la limite d’Aser allait « vers l’occident, au Carmel ». Les grottes de ses pentes occidentales (Tabun, Skhul, el-Wad) recèlent des restes de Néandertaliens et d’humains modernes anciens, fouillés par Dorothy Garrod en 1929–1934."
    - "Le Carmel est la montagne d’Élie. Achab rassembla tout Israël et les prophètes « à la montagne du Carmel », et là le prophète demanda : « Jusqu’à quand clocherez-vous des deux côtés ? », rétablit l’autel de l’Éternel avec douze pierres, inonda son sacrifice d’eau, et « le feu de l’Éternel tomba » ; le peuple s’écria : « C’est l’Éternel qui est Dieu ! », les prophètes de Baal furent tués au Kison, et Élie, le visage entre les genoux au sommet du Carmel, pria jusqu’à ce qu’un petit nuage monte de la mer et que la sécheresse prenne fin. Élisée en fit plus tard sa demeure, et la Sunamite y chevaucha pour le trouver quand son fils mourut."
    - "Pour les poètes, le Carmel est l’image de l’abondance : la tête de l’épouse est élevée « comme le Carmel », Israël restauré « aura ses pâturages du Carmel et du Basan », le désert recevra « la magnificence du Carmel et de Saron » ; et quand Dieu juge, « le sommet du Carmel est desséché ». La montagne était sainte aussi pour d’autres. Pseudo-Scylax l’appelle une montagne sacrée de Zeus, Jamblique dit que Pythagore s’y retira, et Tacite raconte que Vespasien, en 69 apr. J.-C., consulta le dieu Carmel, qui n’avait ni image ni temple, seulement un autel."
    - "Des moines byzantins et médiévaux s’établirent dans les grottes d’Élie, et au début du XIIIe siècle les ermites qui s’y trouvaient reçurent la règle qui en fit l’ordre des Carmes. Leur monastère de Stella Maris se dresse sur le promontoire, et la Muhraqa, la chapelle à l’extrémité sud-est, marque le site traditionnel du sacrifice. Haïfa gravit la pente nord, les jardins bahaïs entaillent sa face, les grottes préhistoriques sont devenues un site du patrimoine mondial en 2012, et la crête est un parc national, gravement brûlé en 2010."
