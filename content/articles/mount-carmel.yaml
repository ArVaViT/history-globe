body:
  en:
    - "Mount Carmel is the wooded limestone ridge that runs some 25 km from the Mediterranean south-east into the hills of Samaria, rising to 546 m and dropping to the sea at the headland above Haifa. The name means a garden or orchard land, and the Bible uses it for the mountain and for any fruitful country: the “forest of his Carmel” that Sennacherib boasted of lay in Lebanon, and the Carmel of Nabal was a town near Hebron. Jokneam “of Carmel” was a Canaanite royal city at its foot, and the border of Asher reached “to Carmel westward”. The caves on its western slopes (Tabun, Skhul, el-Wad) hold remains of Neanderthals and early modern humans, dug by Dorothy Garrod in 1929–1934."
    - "Carmel is the mountain of Elijah. Ahab gathered “all Israel unto mount Carmel”, and there the prophet asked, “How long halt ye between two opinions?”, rebuilt the broken altar of the LORD with twelve stones, drenched his sacrifice with water, and “the fire of the LORD fell”; the people cried, “The LORD, he is the God”, the prophets of Baal were killed at the Kishon, and Elijah, his face between his knees on the top of Carmel, prayed until a little cloud rose out of the sea and the drought broke. Elisha later went to the mountain, and the Shunammite rode there to find him when her son died."
    - "For the poets Carmel is the picture of plenty: the bride's head is “like Carmel”, Israel restored “shall feed on Carmel and Bashan”, the desert shall be given “the excellency of Carmel and Sharon”; and when God judges, “the top of Carmel shall wither”. The mountain was holy to others too. Pseudo-Scylax calls it a sacred mountain of Zeus, Iamblichus says Pythagoras withdrew to it, and Tacitus tells how Vespasian, in AD 69, consulted the god Carmel, who had neither image nor temple, only an altar."
    - "Byzantine and medieval monks settled in Elijah's caves, and in the early thirteenth century the hermits there received the rule that made them the Carmelite order. Their monastery of Stella Maris stands on the headland, and the Muhraqa, the chapel at the south-eastern end, marks the traditional site of the sacrifice. Haifa climbs the northern slope, the Baha'i gardens cut its face, the prehistoric caves became a World Heritage site in 2012, and the ridge is a national park, badly burned in 2010."
  ru:
    - "Гора Кармил — лесистый известняковый хребет, который тянется километров на двадцать пять от Средиземного моря на юго-восток к холмам Самарии, поднимается до 546 м и обрывается к морю мысом над Хайфой. Имя означает сад или плодовую землю, и Библия называет так и гору, и вообще всякий плодородный край: роща, которой хвалился Сеннахирим, по-еврейски зовётся кармилом, но лежала на Ливане, а Кармил Навала был городом близ Хеврона. Иокнеам «при Кармиле» был ханаанским царским городом у его подножия, а предел Асира примыкал «к Кармилу с западной стороны». В пещерах на его западных склонах (Табун, Схул, Эль-Вад) найдены останки неандертальцев и ранних современных людей; их раскапывала Дороти Гаррод в 1929–1934 годах."
    - "Кармил — гора Илии. Ахав собрал «всего Израиля на гору Кармил», и там пророк спросил: «долго ли вам хромать на оба колена?», восстановил разрушенный жертвенник Господень из двенадцати камней и залил жертву водой. «И ниспал огонь Господень и пожрал всесожжение, и дрова, и камни, и прах, и поглотил воду, которая во рве»; народ воскликнул: «Господь есть Бог», пророков Ваала перебили у Киссона, а Илия, положив лицо между коленами на вершине Кармила, молился, пока из моря не поднялось маленькое облако и не кончилась засуха. Позже на гору приходил Елисей, и Сонамитянка поскакала туда к нему, когда умер её сын."
    - "Для поэтов Кармил — образ изобилия: голова невесты «как Кармил», возвращённому Израилю обещано, что «будет он пастись на Кармиле и Васане», пустыне дастся «великолепие Кармила и Сарона»; а когда судит Бог, «иссохнет вершина Кармила». Гора была святой и для других. Псевдо-Скилак называет её священной горой Зевса, Ямвлих говорит, что на неё удалялся Пифагор, а Тацит рассказывает, как Веспасиан в 69 г. н. э. вопрошал бога Кармила, у которого не было ни изображения, ни храма — только жертвенник."
    - "Византийские и средневековые монахи селились в пещерах Илии, а в начале XIII века тамошние отшельники получили устав, сделавший их орденом кармелитов. Их монастырь Стелла Марис стоит на мысу, а Мухрака, часовня на юго-восточном конце хребта, отмечает предание о месте жертвоприношения. По северному склону взбирается Хайфа, его лицо прорезают сады бахаи, доисторические пещеры стали объектом Всемирного наследия в 2012 году, а хребет — национальный парк, сильно пострадавший от пожара в 2010 году."
  uk:
    - "Кармель — лісистий вапняковий хребет, що тягнеться приблизно на 25 км від Середземного моря на південний схід у пагорби Самарії, сягаючи 546 м і спадаючи до моря на мисі над Хайфою. Назва означає сад або садову землю, і Біблія вживає її для гори й для будь-якого родючого краю: «найгусчого саду його», яким хвалився Сінаххеріб, лежав у Лівані, а Кармель Навала був містом поблизу Хеврона. Йокнеам «коло Кармиля» був ханаанським царським містом біля його підніжжя, а межа Асіра сягала «в Кармел з західнього боку». Печери на його західних схилах (Табун, Схул, ель-Вад) зберігають рештки неандертальців і ранніх сучасних людей, розкопані Дороті Гаррод у 1929–1934 рр."
    - "Кармель — гора Іллі. Ахав «послав Ахаб по всього Ізраїля та й поскликав пророки на Кармель-гору», і там пророк запитав: «Доки ще кульгати мете на оба боки?», відбудував зруйнований жертовник Господа з дванадцяти каменів, облив свою жертву водою, і «спав огонь Господень»; народ вигукнув: «Господь є Богом», пророків Ваала вбито біля Кішону, а Ілля, з обличчям між колінами на вершині Кармеля, молився, аж поки маленька хмарка не піднялася з моря і посуха не скінчилася. Єлисей пізніше ходив на гору, і сунамітянка поїхала туди шукати його, коли помер її син."
    - "Для поетів Кармель — образ достатку: голова нареченої «мов Кармель», відновлений Ізраїль «буде пастися на Кармелї й Базанї», пустелі буде дано «роскіш Кармеля й Сарону»; а коли Бог судить, «вигорять верховини Кармелські». Гора була святою й для інших. Псевдо-Скілак називає її священною горою Зевса, Ямвліх каже, що Піфагор усамітнювався на ній, а Тацит розповідає, як Веспасіан 69 р. н. е. запитував бога Кармеля, який не мав ні зображення, ні храму, лише жертовник."
    - "Візантійські й середньовічні ченці оселялися в печерах Іллі, а на початку XIII ст. тамтешні відлюдники прийняли статут, що зробив їх орденом кармелітів. Їхній монастир Стела Маріс стоїть на мисі, а Мухрака, каплиця на південно-східному краю, позначає традиційне місце жертви. Хайфа здіймається північним схилом, сади бахаїв прорізають його поверхню, доісторичні печери стали об’єктом Всесвітньої спадщини 2012 р., а хребет є національним парком, сильно спаленим 2010 р."
  es:
    - "El monte Carmelo es la cresta calcárea cubierta de bosque que se extiende unos 25 km desde el Mediterráneo hacia el sudeste, hasta las colinas de Samaria, alcanza los 546 m y cae hacia el mar en el cabo sobre Haifa. El nombre significa tierra de jardín o de huerto, y la Biblia lo usa para la montaña y para cualquier país fértil: el «monte de su Carmel» del que se jactó Senaquerib estaba en el Líbano, y el Carmel de Nabal era una ciudad cerca de Hebrón. Jocneam «de Carmel» era una ciudad real cananea a su pie, y la frontera de Aser llegaba «hasta Carmel al occidente». Las cuevas de sus laderas occidentales (Tabun, Skhul, el-Wad) guardan restos de neandertales y de los primeros humanos modernos, excavados por Dorothy Garrod en 1929–1934."
    - "El Carmelo es el monte de Elías. Acab reunió «á todo Israel en el monte de Carmelo», y allí el profeta preguntó: «¿Hasta cuándo claudicaréis vosotros entre dos pensamientos?», reparó el altar derruido de Jehová con doce piedras, empapó su sacrificio con agua, y «cayó fuego de Jehová»; el pueblo exclamó: «¡Jehová es el Dios!», los profetas de Baal fueron muertos junto al Cisón, y Elías, con el rostro entre las rodillas en la cima del Carmelo, oró hasta que una pequeña nube subió del mar y se acabó la sequía. Eliseo fue más tarde a la montaña, y la sunamita cabalgó hasta allí a buscarlo cuando murió su hijo."
    - "Para los poetas el Carmelo es la imagen de la abundancia: la cabeza de la esposa es «como el Carmelo», Israel restaurado «pacerá en el Carmelo y en Basán», al desierto se le dará «la hermosura de Carmel y de Sarón»; y cuando Dios juzga, «secaráse la cumbre del Carmelo». La montaña era sagrada también para otros. Pseudo-Escílax la llama monte sagrado de Zeus, Jámblico dice que Pitágoras se retiró a ella, y Tácito cuenta cómo Vespasiano, en 69 d. C., consultó al dios Carmelo, que no tenía imagen ni templo, solo un altar."
    - "Monjes bizantinos y medievales se establecieron en las cuevas de Elías, y a comienzos del siglo XIII los ermitaños de allí recibieron la regla que los convirtió en la orden carmelita. Su monasterio de Stella Maris se alza en el cabo, y la Muhraqa, la capilla del extremo sudoriental, señala el lugar tradicional del sacrificio. Haifa trepa por la ladera norte, los jardines bahaíes cortan su frente, las cuevas prehistóricas fueron declaradas Patrimonio Mundial en 2012, y la cresta es un parque nacional, gravemente quemado en 2010."
  pt:
    - "O monte Carmelo é a crista calcária arborizada que corre cerca de 25 km do Mediterrâneo para sudeste até as colinas de Samaria, elevando-se a 546 m e caindo para o mar no promontório acima de Haifa. O nome significa terra de jardim ou pomar, e a Bíblia o usa para a montanha e para qualquer país fértil: a floresta do seu Carmelo, de que Senaqueribe se gabou, ficava no Líbano, e o Carmelo de Nabal era uma cidade perto de Hebrom. Jocneão “no Carmelo” era uma cidade real cananeia ao seu pé, e a fronteira de Aser ia “ao Carmelo, para o oeste”. As cavernas de suas encostas ocidentais (Tabun, Skhul, el-Wad) guardam restos de neandertais e dos primeiros humanos modernos, escavadas por Dorothy Garrod em 1929–1934."
    - "O Carmelo é o monte de Elias. Acabe reuniu todo o Israel “no monte Carmelo”, e ali o profeta perguntou: “Até quando vocês vacilarão entre os dois lados?”, reconstruiu com doze pedras o altar do SENHOR que fora derrubado, encharcou seu sacrifício com água, e “o fogo do SENHOR caiu”; o povo exclamou: “O SENHOR, ele é Deus!”, os profetas de Baal foram mortos no Quisom, e Elias, com o rosto entre os joelhos no topo do Carmelo, orou até que uma pequena nuvem subisse do mar e a seca se quebrasse. Eliseu depois foi à montanha, e a sunamita cavalgou até lá para encontrá-lo quando seu filho morreu."
    - "Para os poetas, o Carmelo é a imagem da abundância: a cabeça da noiva se ergue “como o Carmelo”, Israel restaurado “se alimentará no Carmelo e em Basã”, ao deserto será dada “a excelência do Carmelo e de Sarom”; e quando Deus julga, “o topo do Carmelo secará”. A montanha era santa também para outros. Pseudo-Cílax a chama de monte sagrado de Zeus, Jâmblico diz que Pitágoras se retirou para ela, e Tácito conta que Vespasiano, em 69 d.C., consultou o deus Carmelo, que não tinha imagem nem templo, apenas um altar."
    - "Monges bizantinos e medievais se estabeleceram nas cavernas de Elias, e no início do século XIII os eremitas ali receberam a regra que os fez a ordem carmelita. Seu mosteiro de Stella Maris está no promontório, e a Muhraqa, a capela na extremidade sudeste, marca o sítio tradicional do sacrifício. Haifa sobe pela encosta norte, os jardins bahá'ís cortam sua face, as cavernas pré-históricas tornaram-se Patrimônio Mundial em 2012, e a crista é um parque nacional, gravemente queimado em 2010."
  de:
    - "Der Karmel ist der bewaldete Kalksteinrücken, der sich etwa 25 km vom Mittelmeer nach Südosten in das Bergland von Samaria zieht, bis auf 546 m ansteigt und an der Landspitze über Haifa zum Meer abfällt. Der Name bedeutet Garten oder Obstland, und die Bibel verwendet ihn für den Berg und für jedes fruchtbare Land: Der „Wald seines Baumgartens“, den Sanherib zu fällen prahlte (im Hebräischen sein Karmel), lag im Libanon, und der Karmel Nabals war eine Stadt bei Hebron. Jokneam „am Karmel“ war eine kanaanäische Königsstadt an seinem Fuß, und die Grenze Assers stieß „an den Karmel am Meer“. Die Höhlen an seinen Westhängen (Tabun, Skhul, el-Wad) bergen Reste von Neandertalern und frühen modernen Menschen, 1929–1934 von Dorothy Garrod ausgegraben."
    - "Der Karmel ist der Berg Elias. Ahab ließ „das ganze Israel auf den Berg Karmel“ versammeln; dort fragte der Prophet: „Wie lange hinkt ihr auf beide Seiten?“, baute den zerbrochenen Altar des HERRN mit zwölf Steinen wieder auf, übergoss sein Opfer mit Wasser, und es heißt: „Da fiel das Feuer des HERRN herab“; das Volk rief: „Der HERR ist Gott, der HERR ist Gott!“, die Propheten Baals wurden am Kischon getötet, und Elia betete, sein Gesicht zwischen den Knien, auf der Spitze des Karmel, bis eine kleine Wolke aus dem Meer aufstieg und die Dürre brach. Elisa ging später auf den Berg, und die Schunemiterin ritt dorthin, um ihn zu finden, als ihr Sohn starb."
    - "Für die Dichter ist der Karmel das Bild der Fülle: Das Haupt der Braut steht „wie der Karmel“, das wiederhergestellte Israel wird „auf Karmel und Basan weiden“, der Wüste wird „der Schmuck Karmels und Sarons“ gegeben; und wenn Gott richtet, wird „der Karmel oben verdorren“. Der Berg war auch anderen heilig. Pseudo-Skylax nennt ihn einen heiligen Berg des Zeus, Jamblichos sagt, Pythagoras habe sich dorthin zurückgezogen, und Tacitus erzählt, wie Vespasian im Jahr 69 n. Chr. den Gott Karmel befragte, der weder Bild noch Tempel hatte, nur einen Altar."
    - "Byzantinische und mittelalterliche Mönche ließen sich in Elias Höhlen nieder, und im frühen 13. Jahrhundert erhielten die Eremiten dort die Regel, die sie zum Karmelitenorden machte. Ihr Kloster Stella Maris steht auf der Landspitze, und die Muhraqa, die Kapelle am südöstlichen Ende, bezeichnet die überlieferte Stätte des Opfers. Haifa klettert am Nordhang hinauf, die Bahai-Gärten zerschneiden seine Front, die prähistorischen Höhlen wurden 2012 Welterbe, und der Rücken ist ein Nationalpark, 2010 schwer verbrannt."
  fr:
    - "Le mont Carmel est la crête boisée de calcaire qui s’étend sur quelque 25 km de la Méditerranée vers le sud-est dans les collines de Samarie, s’élevant à 546 m et tombant dans la mer au promontoire au-dessus de Haïfa. Le nom signifie jardin ou verger, et la Bible l’emploie pour la montagne et pour tout pays fertile : la forêt de son Carmel dont se vantait Sanchérib se trouvait au Liban, et le Carmel de Nabal était une ville près d’Hébron. Jokneam « au Carmel » était une ville royale cananéenne à son pied, et la limite d’Aser allait « vers l’occident, au Carmel ». Les grottes de ses pentes occidentales (Tabun, Skhul, el-Wad) recèlent des restes de Néandertaliens et d’humains modernes anciens, fouillés par Dorothy Garrod en 1929–1934."
    - "Le Carmel est la montagne d’Élie. Achab rassembla tout Israël et les prophètes « à la montagne du Carmel », et là le prophète demanda : « Jusqu’à quand clocherez-vous des deux côtés ? », rétablit l’autel de l’Éternel avec douze pierres, inonda son sacrifice d’eau, et « le feu de l’Éternel tomba » ; le peuple s’écria : « C’est l’Éternel qui est Dieu ! », les prophètes de Baal furent tués au Kison, et Élie, le visage entre les genoux au sommet du Carmel, pria jusqu’à ce qu’un petit nuage monte de la mer et que la sécheresse prenne fin. Élisée s’y rendit plus tard, et la Sunamite y chevaucha pour le trouver quand son fils mourut."
    - "Pour les poètes, le Carmel est l’image de l’abondance : la tête de l’épouse est élevée « comme le Carmel », Israël restauré « aura ses pâturages du Carmel et du Basan », le désert recevra « la magnificence du Carmel et de Saron » ; et quand Dieu juge, « le sommet du Carmel est desséché ». La montagne était sainte aussi pour d’autres. Pseudo-Scylax l’appelle une montagne sacrée de Zeus, Jamblique dit que Pythagore s’y retira, et Tacite raconte que Vespasien, en 69 apr. J.-C., consulta le dieu Carmel, qui n’avait ni image ni temple, seulement un autel."
    - "Des moines byzantins et médiévaux s’établirent dans les grottes d’Élie, et au début du XIIIe siècle les ermites qui s’y trouvaient reçurent la règle qui en fit l’ordre des Carmes. Leur monastère de Stella Maris se dresse sur le promontoire, et la Muhraqa, la chapelle à l’extrémité sud-est, marque le site traditionnel du sacrifice. Haïfa gravit la pente nord, les jardins bahaïs entaillent sa face, les grottes préhistoriques sont devenues un site du patrimoine mondial en 2012, et la crête est un parc national, gravement brûlé en 2010."
  it:
    - "Il Monte Carmelo è la dorsale calcarea boscosa che corre per circa 25 km dal Mediterraneo a sud-est verso le colline della Samaria, innalzandosi a 546 m e cadendo sul mare al promontorio sopra Haifa. Il nome significa terra di giardino o di frutteto, e la Bibbia lo usa per il monte e per ogni paese fertile: la «più magnifica foresta» di cui si vantò Sennacherib, in ebraico la foresta del suo Carmelo, si trovava nel Libano, e il Carmel di Nabal era una città presso Ebron. Iokneam «al Carmelo» era una città reale cananea ai suoi piedi, e il confine di Aser giungeva «verso occidente, al Carmel». Le grotte sui pendii occidentali (Tabun, Skhul, el-Wad) conservano resti di Neanderthal e dei primi uomini moderni, scavate da Dorothy Garrod nel 1929–1934."
    - "Il Carmelo è il monte di Elia. Acab radunò «tutto Israele presso di me sul monte Carmel», e là il profeta chiese: «Fino a quando zoppicherete voi dai due lati?», restaurò l’altare dell’Eterno demolito con dodici pietre, inzuppò d’acqua il suo sacrificio, e «cadde il fuoco dell’Eterno»; il popolo gridò: «L’Eterno è Dio!», i profeti di Baal furono uccisi al Kison, ed Elia, con la faccia tra le ginocchia sulla cima del Carmelo, pregò finché una piccola nube salì dal mare e la siccità si spezzò. Eliseo più tardi si recò sul monte, e la Sunammita vi cavalcò per trovarlo quando suo figlio morì."
    - "Per i poeti il Carmelo è l’immagine dell’abbondanza: il capo della sposa è «come il Carmelo», Israele restaurato «pasturerà al Carmel e in Basan», al deserto sarà data «la magnificenza del Carmel e di Saron»; e quando Dio giudica, «la vetta del Carmelo è inaridita». Il monte era sacro anche ad altri. Pseudo-Scilace lo chiama monte sacro di Zeus, Giamblico dice che vi si ritirò Pitagora, e Tacito racconta che Vespasiano, nel 69 d.C., consultò il dio Carmelo, che non aveva immagine né tempio, solo un altare."
    - "Monaci bizantini e medievali si stabilirono nelle grotte di Elia, e all’inizio del XIII secolo gli eremiti là ricevettero la regola che ne fece l’ordine carmelitano. Il loro monastero di Stella Maris sorge sul promontorio, e la Muhraqa, la cappella all’estremità sud-orientale, segna il sito tradizionale del sacrificio. Haifa sale sul pendio settentrionale, i giardini bahá’í ne incidono la fronte, le grotte preistoriche sono diventate patrimonio mondiale nel 2012, e la dorsale è un parco nazionale, gravemente bruciato nel 2010."
  pl:
    - "Góra Karmel to zalesiony wapienny grzbiet ciągnący się około 25 km od Morza Śródziemnego na południowy wschód w wzgórza Samarii, wznoszący się do 546 m i opadający ku morzu na przylądku nad Hajfą. Nazwa znaczy kraj ogrodów albo sadów, a Biblia używa jej dla góry i dla każdego urodzajnego kraju: las jego Karmelu, którym chełpił się Sennacheryb, leżał w Libanie, a Karmel Nabala był miastem koło Hebronu. Jokneam „z Karmelu” było kananejskim miastem królewskim u jego stóp, a granica Aszera sięgała „na Karmel do morza”. Jaskinie na jego zachodnich zboczach (Tabun, Skhul, el-Wad) kryją szczątki neandertalczyków i wczesnych ludzi współczesnych, wykopywane przez Dorothy Garrod w latach 1929–1934."
    - "Karmel jest górą Eliasza. Achab zebrał „wszystkiego Izraela na górę Karmel”, a tam prorok zapytał: „I długoż będziecie chramać na obie strony?”, naprawił rozwalony ołtarz Pański dwunastoma kamieniami, zalał ofiarę wodą i „spadł ogień Pański”; lud zawołał: „Pan jest Bogiem, Panci jest Bogiem”, prorocy Baala zostali zabici nad Kiszonem, a Eliasz, z twarzą między kolanami na szczycie Karmelu, modlił się, aż mały obłok wzniósł się z morza i susza się skończyła. Elizeusz udał się później na górę, a Sunamitka pojechała tam, by go znaleźć, gdy umarł jej syn."
    - "Dla poetów Karmel jest obrazem obfitości: głowa oblubienicy jest „jako Karmel”, odnowiony Izrael „paść się będzie na Karmelu, i na Basanie”, pustyni zostanie dana „ozdoba Karmelu i Saronu”; a gdy Bóg sądzi, szczyt Karmelu usycha. Góra była święta także dla innych. Pseudo-Scylaks nazywa ją świętą górą Zeusa, Jamblich mówi, że wycofał się na nią Pitagoras, a Tacyt opowiada, jak Wespazjan w 69 r. n.e. zasięgnął rady boga Karmela, który nie miał ani wizerunku, ani świątyni, tylko ołtarz."
    - "Bizantyjscy i średniowieczni mnisi osiedlali się w jaskiniach Eliasza, a na początku XIII w. pustelnicy tam otrzymali regułę, która uczyniła z nich zakon karmelitów. Ich klasztor Stella Maris stoi na przylądku, a Muhraqa, kaplica na południowo-wschodnim krańcu, wyznacza tradycyjne miejsce ofiary. Hajfa wspina się na północne zbocze, ogrody bahaickie przecinają jego lico, prehistoryczne jaskinie stały się miejscem światowego dziedzictwa w 2012 r., a grzbiet jest parkiem narodowym, mocno spalonym w 2010 r."
  nl:
    - "De Karmel is de beboste kalksteenrug die zo'n 25 km vanaf de Middellandse Zee zuidoostwaarts in de heuvels van Samaria loopt, tot 546 m oprijst en bij de kaap boven Haifa in zee afvalt. De naam betekent een tuin of boomgaardland, en de Bijbel gebruikt hem voor de berg en voor elk vruchtbaar land: het bos van zijn Karmel waarop Sanherib zich beroemde lag in de Libanon, en de Karmel van Nabal was een stad bij Hebron. Jokneam “aan den Karmel” was een Kanaänitische koningsstad aan zijn voet, en de grens van Aser reikte “aan Karmel westwaarts”. De grotten op zijn westelijke hellingen (Tabun, Skhul, el-Wad) bevatten resten van neanderthalers en vroege moderne mensen, opgegraven door Dorothy Garrod in 1929–1934."
    - "De Karmel is de berg van Elia. Achab verzamelde “het ganse Israel op den berg Karmel”, en daar vroeg de profeet: “Hoe lang hinkt gij op twee gedachten?”, herbouwde het verbrokene altaar van de HEER met twaalf stenen, doorweekte zijn offer met water, en het vuur van de HEER viel; het volk riep: “De HEERE is God, de HEERE is God!”, de profeten van Baäl werden bij de Kison gedood, en Elia, met zijn gezicht tussen zijn knieën op de top van de Karmel, bad tot een wolkje uit de zee opsteeg en de droogte brak. Elisa ging later naar de berg, en de Sunamitische reed erheen om hem te zoeken toen haar zoon stierf."
    - "Voor de dichters is de Karmel het beeld van overvloed: het hoofd van de bruid is “als Karmel”, het herstelde Israël “zal weiden op den Karmel en op den Basan”, de woestijn zal krijgen “het sieraad van Karmel en Saron”; en wanneer God oordeelt, klinkt het: “de hoogte van Karmel zal verdorren”. De berg was ook voor anderen heilig. Pseudo-Scylax noemt hem een heilige berg van Zeus, Iamblichus zegt dat Pythagoras zich erheen terugtrok, en Tacitus vertelt hoe Vespasianus in 69 n.Chr. de god Karmel raadpleegde, die noch beeld noch tempel had, alleen een altaar."
    - "Byzantijnse en middeleeuwse monniken vestigden zich in Elia's grotten, en in het begin van de dertiende eeuw ontvingen de kluizenaars daar de regel die hen tot de orde van de Karmelieten maakte. Hun klooster Stella Maris staat op de kaap, en de Muhraqa, de kapel aan het zuidoostelijke uiteinde, markeert de traditionele plaats van het offer. Haifa klimt langs de noordhelling, de Bahá'í-tuinen snijden door haar gezicht, de prehistorische grotten werden in 2012 werelderfgoed, en de rug is een nationaal park, in 2010 zwaar verbrand."
  cs:
    - "Karmel je zalesněný vápencový hřbet, který se táhne asi 25 km od Středozemního moře na jihovýchod do samařských pahorků, vystupuje do 546 m a klesá k moři na výběžku nad Haifou. Jméno znamená zahradu nebo sad a Bible je užívá pro horu i pro každou úrodnou zemi: Karmelský les, jímž se chlubil Senacherib, ležel v Libanonu, a Nábalův Karmel bylo město poblíž Hebronu. Jokneam „z Karmelu“ bylo kanaánské královské město na jeho úpatí a hranice Ašerova sahala „až na Karmel k moři“. Jeskyně na jeho západních svazích (Tabun, Skhul, el-Wad) obsahují pozůstatky neandrtálců a raných moderních lidí, vykopávané Dorothy Garrodovou v letech 1929–1934."
    - "Karmel je hora Elijášova. Achab shromáždil „všecken lid Izraelský na horu Karmel“ a tam se prorok zeptal: „I dokudž kulhati budete na obě straně?“, opravil zbořený oltář Hospodinův dvanácti kameny, zalil svou oběť vodou a „spadl oheň Hospodinův“; lid zvolal: „Hospodinť jest Bohem, Hospodin jest Bohem“, proroci Baalovi byli zabiti u Kíšonu a Elijáš, s tváří mezi koleny na vrcholu Karmelu, se modlil, dokud se z moře nezvedl malý obláček a sucho neskončilo. Elíša později na horu odešel a Šunemská tam jela, aby ho našla, když jí zemřel syn."
    - "Pro básníky je Karmel obrazem hojnosti: hlava nevěsty je „jako Karmel“, obnovený Izrael, „aby se pásl na Karmeli a Bázan“, poušti bude dána „okrasa Karmelská a Sáronská“; a když Bůh soudí, uschne vrchol Karmelu. Hora byla svatá i jiným. Pseudo-Skylax ji nazývá posvátnou horou Diovou, Iamblichos praví, že se na ni stáhl Pythagoras, a Tacitus vypráví, jak se Vespasianus roku 69 n. l. radil s bohem Karmelem, který neměl obraz ani chrám, jen oltář."
    - "Byzantští a středověcí mniši se usadili v Elijášových jeskyních a na počátku 13. století poustevníci tam přijali řád, který z nich učinil karmelitány. Jejich klášter Stella Maris stojí na výběžku a Muhraqa, kaple na jihovýchodním konci, označuje tradiční místo oběti. Haifa šplhá po severním svahu, bahájské zahrady rozřezávají jeho líc, pravěké jeskyně se roku 2012 staly památkou světového dědictví a hřbet je národním parkem, těžce vypáleným roku 2010."
  sv:
    - "Karmel är den skogklädda kalkstensåsen som löper omkring 25 km från Medelhavet sydost in i Samarias berg, når 546 m och faller mot havet vid udden ovanför Haifa. Namnet betyder en trädgård eller fruktbart land, och Bibeln använder det om berget och om varje fruktbart land: Karmelskogen som Sanherib skröt över låg i Libanon, och Navals Karmel var en stad nära Hebron. Jokneam ”vid Karmel” var en kanaaneisk kungastad vid dess fot, och Ashers gräns nådde ”vid havet … Karmel”. Grottorna på dess västra sluttningar (Tabun, Skhul, el-Wad) rymmer lämningar av neandertalare och tidiga moderna människor, utgrävda av Dorothy Garrod 1929–1934."
    - "Karmel är Elias berg. Elia bad Achav församla ”hela Israel till mig på berget Karmel”, och där frågade profeten: ”Huru länge viljen I halta på båda sidor?”, byggde upp HERRENS söndrade altare med tolv stenar, dränkte sitt offer med vatten, och HERRENS eld föll ned; folket ropade: ”HERREN är det som är Gud!”, Baals profeter dräptes vid Kishon, och Elia, med ansiktet mellan knäna på Karmels topp, bad tills ett litet moln steg upp ur havet och torkan bröts. Elisha gick senare till berget, och sunemitiskan red dit för att finna honom när hennes son dog."
    - "För skalderna är Karmel en bild av överflöd: brudens huvud höjer sig ”såsom Karmel”, det återupprättade Israel ”skall få gå bet på Karmel och i Basan”, öknen skall ges ”Karmels och Sarons prakt”; och när Gud dömer, ”Karmels topp förtorkas”. Berget var heligt för andra också. Pseudo-Skylax kallar det Zeus' heliga berg, Iamblichos säger att Pythagoras drog sig tillbaka dit, och Tacitus berättar hur Vespasianus år 69 rådfrågade guden Karmel, som varken hade bild eller tempel, bara ett altare."
    - "Bysantinska och medeltida munkar bosatte sig i Elias grottor, och i början av 1200-talet fick eremiterna där den regel som gjorde dem till karmelitorden. Deras kloster Stella Maris står på udden, och Muhraqa, kapellet i sydöstra änden, markerar den traditionella platsen för offret. Haifa klättrar uppför norra sluttningen, bahá'í-trädgårdarna skär sig in i dess sida, de förhistoriska grottorna blev världsarv 2012, och åsen är en nationalpark, svårt bränd 2010."
  nb:
    - "Karmel er den skogkledde kalksteinsryggen som løper omkring 25 km fra Middelhavet mot sørøst inn i åsene i Samaria, stiger til 546 m og faller ned mot havet ved odden over Haifa. Navnet betyr en hage eller et frukthageland, og Bibelen bruker det om fjellet og om ethvert fruktbart land: «dets frodige skog» som Sankerib skrøt av, lå i Libanon, og Nabals Karmel var en by nær Hebron. «Jokneam ved Karmel» var en kanaanittisk kongeby ved foten, og Asjers grense nådde «mot vest til Karmel». Hulene på dens vestlige skråninger (Tabun, Skhul, el-Wad) rommer levninger av neandertalere og tidlige moderne mennesker, gravd ut av Dorothy Garrod i 1929–1934."
    - "Karmel er Elias' fjell. Ahab samlet «hele Israel» på «Karmel-fjellet», og der spurte profeten: «Hvor lenge vil I halte til begge sider?», satte i stand Herrens nedrevne alter med tolv steiner, øste vann over offeret sitt, og «Da falt Herrens ild ned»; folket ropte: «Herren, han er Gud!», Baals profeter ble drept ved Kisjon, og Elia, med ansiktet mellom knærne på toppen av Karmel, ba til en liten sky steg opp av havet og tørken brøt. Elisja dro senere til fjellet, og sunamitten red dit for å finne ham da hennes sønn døde."
    - "For dikterne er Karmel et bilde på overflod: brudens hode er «likesom Karmel», det gjenopprettede Israel «skal beite på Karmel og i Basan», ørkenen skal få «Karmels og Sarons prakt»; og når Gud dømmer, skal «Karmels topp bli tørr». Fjellet var hellig for andre også. Pseudo-Skylax kaller det et hellig fjell for Zevs, Iamblikhos sier at Pythagoras trakk seg tilbake dit, og Tacitus forteller hvordan Vespasian i 69 e.Kr. rådspurte guden Karmel, som hverken hadde bilde eller tempel, bare et alter."
    - "Bysantinske og middelalderske munker bosatte seg i Elias' huler, og tidlig på 1200-tallet mottok eremittene der regelen som gjorde dem til karmelittordenen. Deres kloster Stella Maris ligger på odden, og Muhraqa, kapellet i den sørøstlige enden, markerer det tradisjonelle stedet for offeret. Haifa klatrer opp den nordlige skråningen, bahá'í-hagene skjærer inn i dens flate, de forhistoriske hulene ble verdensarvsted i 2012, og ryggen er en nasjonalpark, hardt brent i 2010."
  tl:
    - "Ang Bundok Carmelo ay ang makahoy na tagaytay ng apog na umaabot ng mga 25 km mula sa Dagat Mediteraneo patimog-silangan hanggang sa mga burol ng Samaria, na tumataas sa 546 m at bumababa sa dagat sa tangos sa itaas ng Haifa. Ang pangalan ay nangangahulugang hardin o lupain ng halamanan, at ginagamit ito ng Biblia para sa bundok at para sa anumang mabungang lupain: ang “gubat ng kaniyang mabungang bukid” na ipinagmalaki ni Sennacherib ay nasa Libano, at ang Carmel ni Nabal ay isang bayan malapit sa Hebron. Ang Jocneam “sa Carmel” ay maharlikang lungsod ng mga Cananeo sa paanan nito, at ang hangganan ng Aser ay umabot “sa Carmel na dakong kalunuran”. Ang mga yungib sa kanlurang dalisdis nito (Tabun, Skhul, el-Wad) ay may mga labi ng mga Neanderthal at maagang makabagong tao, na hinukay ni Dorothy Garrod noong 1929–1934."
    - "Ang Carmelo ang bundok ni Elias. Pinisan ni Achab ang “buong Israel sa bundok ng Carmelo”, at doon tinanong ng propeta, “Hanggang kaylan kayo mangagaalinlangan sa dalawang isipan?”, itinayong muli ang sirang dambana ng Panginoon ng labindalawang bato, binasa ng tubig ang kaniyang handog, at “ang apoy ng Panginoon ay nalaglag”; sumigaw ang bayan, “Ang Panginoon ay siyang Dios”, pinatay ang mga propeta ni Baal sa Cison, at si Elias, na ang mukha ay nasa pagitan ng kaniyang mga tuhod sa tuktok ng Carmelo, ay nanalangin hanggang sumilang ang isang munting ulap mula sa dagat at natapos ang tagtuyot. Kalaunan ay pumunta si Eliseo sa bundok, at sumakay roon ang Sunamita upang hanapin siya nang mamatay ang kaniyang anak."
    - "Para sa mga makata, ang Carmel ay larawan ng kasaganaan: ang ulo ng nobya ay “gaya ng Carmelo”, ang naibalik na Israel ay “sasabsab sa Carmel at sa Basan”, ang disyerto ay bibigyan ng “karilagan ng Carmel at ng Saron”; at kapag naghahatol ang Diyos, “ang taluktok ng Carmelo ay matutuyo”. Banal din ang bundok sa iba. Tinatawag ito ni Pseudo-Scylax na sagradong bundok ni Zeus, sinasabi ni Iamblichus na nagtungo rito si Pythagoras upang mag-isa, at isinasalaysay ni Tacito kung paano sumangguni si Vespasiano, noong 69 AD, sa diyos na Carmel, na walang larawan o templo, altar lamang."
    - "Nanirahan ang mga monghe ng panahong Bizantino at medyebal sa mga yungib ni Elias, at noong unang bahagi ng ika-13 siglo, tinanggap ng mga ermitanyo roon ang patakarang naging orden ng mga Carmelita. Ang kanilang monasteryo ng Stella Maris ay nakatayo sa tangos, at ang Muhraqa, ang kapilya sa timog-silangang dulo, ay nagmamarka sa tradisyonal na pook ng paghahandog. Inaakyat ng Haifa ang hilagang dalisdis, hinahati ng mga hardin ng Baha'i ang harapan nito, ang mga yungib na prehistoriko ay naging Pandaigdigang Pamanang Pook noong 2012, at ang tagaytay ay pambansang liwasan, na lubhang nasunog noong 2010."
  da:
    - "Karmel er den skovklædte kalkstensryg, der løber omkring 25 km fra Middelhavet mod sydøst ind i Samarias bjerge, hæver sig til 546 m og falder ned til havet ved forbjerget over Haifa. Navnet betyder en have eller et frugtland, og Bibelen bruger det om bjerget og om ethvert frugtbart land: »dens frodige Skov«, som Sankerib pralede af, lå i Libanon, og Nabals Karmel var en by nær Hebron. Jokneam »ved Karmel« var en kana'anæisk kongeby ved dets fod, og Asers grænse nåede »op til Karmel mod Vesten«. Hulerne på dets vestlige skråninger (Tabun, Skhul, el-Wad) rummer levn af neandertalere og tidlige moderne mennesker, udgravet af Dorothy Garrod i 1929–1934."
    - "Karmel er Elias' bjerg. Akab sendte »hen iblandt alle Israels Børn og samlede Profeterne til Karmels Bjerg«, og dér spurgte profeten: »Hvor længe ville I halte til begge Sider?«, genopbyggede Herrens nedbrudte alter med tolv sten, overøste sit offer med vand, og da »faldt Herrens Ild ned«; folket råbte: »Herren, han er Gud!«, Ba'als profeter blev dræbt ved Kisjon, og Elias, med ansigtet mellem knæene på toppen af Karmel, bad, til en lille sky steg op af havet, og tørken brød. Elisa gik senere til bjerget, og sunemitinden red derhen for at finde ham, da hendes søn døde."
    - "For digterne er Karmel billedet på overflod: brudens hoved er »som Karmel«, det genoprettede Israel »skal græsse paa Karmel og Basan«, ørkenen skal få »Karmels og Sarons Pragt«; og når Gud dømmer, skal »Karmels Top blive tør«. Bjerget var også helligt for andre. Pseudo-Skylax kalder det et helligt bjerg for Zeus, Iamblichos siger, at Pythagoras trak sig tilbage dertil, og Tacitus fortæller, hvordan Vespasian i 69 e.Kr. rådførte sig med guden Karmel, som hverken havde billede eller tempel, kun et alter."
    - "Byzantinske og middelalderlige munke bosatte sig i Elias' huler, og i begyndelsen af 1200-tallet fik eremitterne dér den regel, der gjorde dem til karmelitterordenen. Deres kloster Stella Maris ligger på forbjerget, og Muhraqa, kapellet i den sydøstlige ende, markerer det traditionelle sted for ofringen. Haifa klatrer op ad den nordlige skråning, bahá'í-haverne skærer sig ind i dens side, de forhistoriske huler blev verdensarvssted i 2012, og højderyggen er en nationalpark, hårdt brændt i 2010."
  sr:
    - "Кармил је шумовити кречњачки гребен који се протеже око 25 км од Средоземног мора на југоисток у брда Самарије, висок 546 м, и спушта се у море на рту изнад Хаифе. Име значи врт или земља воћњака, а Библија га употребљава за планину и за сваку плодну земљу: „шума његова Кармила“ којом се хвалио Сенахирим лежала је у Ливану, а Навалов Кармил био је град код Хеврона. Јокнеам „код Кармела“ био је ханаански краљевски град у његовом подножју, а граница Асирова допирала је „до Кармела к мору“. Пећине на његовим западним падинама (Табун, Схул, ел-Вад) садрже остатке неандерталаца и раних савремених људи, које је ископавала Дороти Герод 1929–1934."
    - "Кармил је Илијина планина. Ахав је сабрао „свега Израиља на гору кармилску“, и тамо је пророк питао: „Докле ћете храмати на обе стране?“, обновио разваљени олтар Господњи од дванаест камена, залио жртву водом, и „Тада паде огањ Господњи“; народ је повикао: „Господ је Бог“, пророци Валови убијени су на Кисону, а Илија се на врху Кармила, лица међу коленима, молио док се мали облак није подигао из мора и суша се прекинула. Јелисије је касније отишао на гору, а Сунамка је јахала тамо да га нађе када јој је син умро."
    - "За песнике је Кармил слика обиља: глава невесте је „као Кармил“, обновљени Израиљ „пашће по Кармилу и Васану“, пустињи ће бити дата „красота кармилска и саронска“; а када Бог суди, „посушиће се врх Кармилу“. Планина је била света и другима. Псеудо-Скилак је зове светом гором Зевсовом, Јамблих каже да се Питагора повукао на њу, а Тацит приповеда како је Веспазијан 69. н. е. питао божанство Кармил, које није имало ни слику ни храм, само жртвеник."
    - "Византијски и средњовековни монаси настанили су се у Илијиним пећинама, а почетком XIII века тамошњи пустињаци примили су правило које их је начинило Кармелићанским редом. Њихов манастир Стела Марис стоји на рту, а Мухрака, капела на југоисточном крају, означава традиционално место жртве. Хаифа се пење северном падином, бахајске баште секу његово лице, праисторијске пећине постале су место светске баштине 2012, а гребен је национални парк, тешко спаљен 2010."
  hu:
    - "A Kármel-hegy az erdős mészkőgerinc, amely mintegy 25 km hosszan húzódik a Földközi-tengertől délkeletre Szamária dombjai közé, 546 m-re emelkedik, és a tengerhez a Haifa fölötti hegyfokon ereszkedik. A név kertet vagy gyümölcsöst jelent, és a Biblia a hegyre és minden termékeny országra használja: a Kármel, amelynek „kertes erdejébe” Szanhérib kérkedése szerint be akart menni, a Libanonban volt, Nábál Kármelje pedig egy Hebron melletti város. A „Kármelen levő” Jokneám kánaáni királyi város volt a lábánál, Áser határa pedig „éri Karmelt nyugot felé”. A nyugati lejtők barlangjai (Tabun, Skhul, el-Wad) neandervölgyi és korai modern emberek maradványait őrzik, amelyeket Dorothy Garrod ásott 1929–1934-ben."
    - "A Kármel Illés hegye. Aháb Illés kérésére egybegyűjtötte az egész Izráelt „a Kármel hegyre”, és ott kérdezte a próféta: „Meddig sántikáltok kétfelé?”, újjáépítette az Úr leomlott oltárát tizenkét kővel, vízzel öntötte le áldozatát, és „alászálla az Úr tüze”; a nép felkiáltott: „Az Úr az Isten! az Úr az Isten!”, a Baál prófétáit megölték a Kisonnál, Illés pedig, arcát térde közé hajtva a Kármel tetején, addig imádkozott, míg egy kis felhő fel nem szállt a tengerből, és az aszály meg nem tört. Elizeus később felment a hegyre, és a súnemita asszony odalovagolt hozzá, amikor fia meghalt."
    - "A költőknek a Kármel a bőség képe: a menyasszony feje „hasonló rajtad a Kármelhez”, a helyreállított Izráel „Básánban legel és a Kármelen”, a sivatagnak megadatik „Karmel és Sáron ékessége”; és amikor Isten ítél, „megszárad a Kármel teteje”. A hegy másoknak is szent volt. Pszeudo-Szkülax Zeusz szent hegyének nevezi, Iamblikhosz szerint Püthagorasz vonult oda vissza, Tacitus pedig elmeséli, hogy Vespasianus Kr. u. 69-ben megkérdezte Kármel istent, akinek sem képe, sem temploma nem volt, csak oltára."
    - "Bizánci és középkori szerzetesek telepedtek le Illés barlangjaiban, és a 13. század elején az ottani remeték megkapták a szabályt, amely a karmelita renddé tette őket. Stella Maris kolostoruk a hegyfokon áll, a Muhraqa, a délkeleti végén álló kápolna, az áldozat hagyományos helyét jelöli. Haifa az északi lejtőre kapaszkodik, a bahá'í kertek átvágják homlokzatát, az őskori barlangok 2012-ben világörökségi helyszínek lettek, a gerinc pedig nemzeti park, amely 2010-ben súlyosan leégett."
  fi:
    - "Karmelvuori on metsäinen kalkkikiviharjanne, joka ulottuu noin 25 km Välimereltä kaakkoon Samarian kukkuloille, kohoaa 546 metriin ja laskeutuu mereen Haifan yläpuolisella niemellä. Nimi merkitsee puutarhaa tai hedelmätarhamaata, ja Raamattu käyttää sitä vuoresta ja mistä tahansa hedelmällisestä maasta: Sanheribin kerskaama Karmelin metsä sijaitsi Libanonissa, ja Nabalin Karmel oli kaupunki Hebronin lähellä. Jokneam oli kanaanilainen kuninkaankaupunki sen juurella, ”Karmelin juurella olevan Jokneamin kuningas”, ja Asserin rajasta sanotaan: ”lännessä raja koskettaa Karmelia”. Sen läntisten rinteiden luolat (Tabun, Skhul, el-Wad) sisältävät neandertalinihmisten ja varhaisten nykyihmisten jäänteitä, jotka Dorothy Garrod kaivoi vuosina 1929–1934."
    - "Karmel on Elian vuori. Ahab ”lähetti sanan kaikille israelilaisille ja kokosi profeetat Karmel-vuorelle”, ja siellä profeetta kysyi: ”Kuinka kauan te onnutte molemmille puolille?”, korjasi hajotetun Herran alttarin kahdellatoista kivellä, kasteli uhrinsa vedellä, ja ”Herran tuli iski alas”; kansa huusi: ”Herra on Jumala!”, Baalin profeetat tapettiin Kisonilla, ja Elia, kasvot polvien välissä Karmelin huipulla, rukoili, kunnes pieni pilvi nousi merestä ja kuivuus päättyi. Elisa meni myöhemmin vuorelle, ja sunemilainen vaimo ratsasti sinne etsimään häntä poikansa kuoltua."
    - "Runoilijoille Karmel on yltäkylläisyyden kuva: morsiamen pää on ”kuin Karmel”, ennallistettu Israel ”on käyvä laitumella Karmelilla ja Baasanissa”, erämaalle annetaan ”Karmelin ja Saaronin ihanuus”; ja kun Jumala tuomitsee, ”Karmelin laki kuivuu”. Vuori oli pyhä muillekin. Pseudo-Skylax kutsuu sitä Zeuksen pyhäksi vuoreksi, Iamblikhos sanoo Pythagoraan vetäytyneen sinne, ja Tacitus kertoo, kuinka Vespasianus vuonna 69 jaa. kysyi neuvoa jumala Karmelilta, jolla ei ollut kuvaa eikä temppeliä, vain alttari."
    - "Bysanttilaiset ja keskiaikaiset munkit asettuivat Elian luoliin, ja 1200-luvun alussa siellä olevat erakot saivat säännön, joka teki heistä karmeliittaveljeskunnan. Heidän Stella Maris -luostarinsa seisoo niemellä, ja Muhraqa, kappeli kaakkoispäässä, merkitsee uhrin perinteistä paikkaa. Haifa kiipeää pohjoisrinnettä, bahá'í-puutarhat leikkaavat sen kasvoja, esihistorialliset luolat tulivat maailmanperintökohteeksi vuonna 2012, ja harjanne on kansallispuisto, pahoin palanut vuonna 2010."
  vi:
    - "Núi Cạt-mên là sống đá vôi có rừng chạy khoảng 25 km từ Địa Trung Hải về đông nam vào các đồi Sa-ma-ri, cao đến 546 m và đổ xuống biển ở mũi đất phía trên Haifa. Tên nghĩa là vườn hay đất vườn cây, và Kinh Thánh dùng cho ngọn núi và cho mọi xứ phì nhiêu: “rừng rậm của nó” mà San-chê-ríp khoe khoang (bản King James: “forest of his Carmel”) nằm ở Li-ban, còn Cạt-mên của Na-banh là một thành gần Hếp-rôn. Giốc-nê-am, mà Giô-suê gọi là Giốc-nê-am “ở tại Cạt-mên”, là một thành vua của người Ca-na-an ở chân núi, và ranh giới của A-se chạy đến “Cạt-mên” ở phía tây. Các hang ở sườn tây (Tabun, Skhul, el-Wad) chứa di cốt người Neanderthal và người hiện đại sớm, do Dorothy Garrod đào năm 1929–1934."
    - "Cạt-mên là núi của Ê-li. A-háp “sai người đi nhóm cả dân Y-sơ-ra-ên và những tiên tri đến núi Cạt-mên”, và tại đó nhà tiên tri hỏi: “Các ngươi đi giẹo hai bên cho đến chừng nào?”, sửa lại bàn thờ bị phá của Đức Giê-hô-va bằng mười hai hòn đá, đổ nước ướt đẫm của lễ, và “Lửa của Đức Giê-hô-va bèn giáng xuống”; dân kêu: “Giê-hô-va là Đức Chúa Trời!”, các tiên tri của Ba-anh bị giết ở Ki-sôn, và Ê-li, úp mặt giữa hai đầu gối trên chót Cạt-mên, cầu nguyện cho đến khi một đám mây nhỏ nổi lên từ biển và hạn hán chấm dứt. Ê-li-sê về sau lên núi, và người đàn bà Su-nem cưỡi đến tìm ông khi con trai bà chết."
    - "Với các thi sĩ, Cạt-mên là hình ảnh của sự dư dật: đầu cô dâu “khác nào núi Cạt-mên”, Y-sơ-ra-ên được phục hồi “sẽ ăn cỏ trên Cạt-mên và Ba-san”, đồng vắng sẽ được ban “sự tốt đẹp của Cạt-mên và Sa-rôn”; và khi Đức Chúa Trời xét xử, “chót núi Cạt-mên sẽ khô héo”. Ngọn núi cũng thánh với những người khác. Pseudo-Scylax gọi nó là núi thiêng của Zeus, Iamblichus nói Pythagoras lui về đó, và Tacitus kể Vespasian, năm 69, hỏi ý thần Cạt-mên, vị không có tượng hay đền, chỉ một bàn thờ."
    - "Các tu sĩ Byzantine và trung đại định cư trong hang của Ê-li, và đầu thế kỷ 13 các ẩn sĩ ở đó nhận quy luật làm nên dòng Cát Minh. Tu viện Stella Maris của họ đứng trên mũi đất, và Muhraqa, nhà nguyện ở đầu đông nam, đánh dấu địa điểm truyền thống của lễ tế. Haifa leo lên sườn bắc, các khu vườn Baha'i cắt mặt núi, các hang tiền sử trở thành Di sản Thế giới năm 2012, và sống núi là một vườn quốc gia, bị cháy nặng năm 2010."
  ro:
    - "Muntele Carmel este creasta calcaroasă împădurită care se întinde pe circa 25 km de la Mediterana spre sud-est până în dealurile Samariei, ridicându-se la 546 m și coborând spre mare la promontoriul de deasupra Haifei. Numele înseamnă o țară de grădini sau livezi, iar Biblia îl folosește pentru munte și pentru orice țară roditoare: „până la mijlocul dumbrăvii Carmilului” de care s-a lăudat Senaherib se afla în Liban, iar Carmelul lui Nabal era o cetate lângă Hebron. Iocneam „al Carmelului” era o cetate regală canaanită la poalele lui, iar hotarul lui Așer ajungea până acolo: „de către apus se împreună cu Carmilul”. Peșterile de pe versantul vestic (Tabun, Skhul, el-Wad) păstrează rămășițe de neanderthalieni și de oameni moderni timpurii, săpate de Dorothy Garrod în 1929–1934."
    - "Carmelul este muntele lui Ilie. Ahab a trimis „la tot Israilul” și a adunat „pre toți prorocii în muntele Karmilului”, și acolo proorocul a întrebat: „până când veți șchiopătà într’amândouă gleznele voastre?”, a rezidit jertfelnicul dărâmat al Domnului cu douăsprezece pietre, și-a udat jertfa cu apă și „a căzut foc dela Domnul din cer”; poporul a strigat: „adevărat Domnul este Dumnezeu, Domnul acesta este Dumnezeu”, proorocii lui Baal au fost uciși la Chison, iar Ilie, cu fața între genunchi, pe vârful Carmelului, s-a rugat până când un mic nor s-a ridicat din mare și seceta s-a rupt. Elisei a mers mai târziu la munte, iar sunamita a călărit acolo ca să-l găsească când i-a murit fiul."
    - "Pentru poeți, Carmelul este chipul belșugului: capul miresei este „ca și Carmilul”, Israel restaurat „se va paște în Carmil și în muntele lui Efraim și în Galaad”, pustiei i se va da strălucirea Carmelului și a Șaronului; iar când judecă Dumnezeu, „s’a uscat vârful Karmilului”. Muntele era sfânt și pentru alții. Pseudo-Scylax îl numește munte sacru al lui Zeus, Iamblichos spune că Pitagora s-a retras pe el, iar Tacit povestește cum Vespasian, în 69 d.Hr., l-a consultat pe zeul Carmel, care nu avea nici imagine, nici templu, doar un altar."
    - "Călugări bizantini și medievali s-au așezat în peșterile lui Ilie, iar la începutul secolului al XIII-lea pustnicii de acolo au primit regula care i-a făcut ordinul carmeliților. Mănăstirea lor Stella Maris se află pe promontoriu, iar Muhraqa, capela de la capătul sud-estic, marchează locul tradițional al jertfei. Haifa urcă pe versantul nordic, grădinile Baha'i îi taie fața, peșterile preistorice au devenit sit al Patrimoniului Mondial în 2012, iar creasta este parc național, grav ars în 2010."
  bg:
    - "Кармил е залесеният варовиков хребет, който се простира на около 25 км от Средиземно море на югоизток към хълмовете на Самария, издига се до 546 м и се спуска към морето при носа над Хайфа. Името означава градина или овощна земя и Библията го използва за планината и за всяка плодородна страна: „дъбравата на неговия Кармил“, с която се хвалел Сенахирим, е била в Ливан, а Кармил на Навал е бил град близо до Хеврон. Йокнеам „в Кармил“ е бил ханаански царски град в подножието ѝ, а границата на Асир стигала „до Кармил към запад“. Пещерите по западните ѝ склонове (Табун, Схул, ел-Уад) съдържат останки от неандерталци и ранни съвременни хора, разкопани от Дороти Гарод през 1929–1934 г."
    - "Кармил е планината на Илия. Ахав събра „всичкия Израил на гората Кармил“ и там пророкът попита: „До кога ще хромите между две мъдрувания?“, възстанови разрушения олтар на Господа с дванадесет камъка, заля жертвата си с вода и „падна огън от Господа“; народът извика: „Иеова, той е Бог“, Вааловите пророци бяха избити при Кисон, а Илия, с лице между коленете си на върха на Кармил, се моли, докато от морето не се издигна малък облак и сушата не свърши. По-късно Елисей отиде на планината, а сунамката отиде там на ездитно животно да го намери, когато синът ѝ умря."
    - "За поетите Кармил е образ на изобилие: главата на невестата е „като Кармил“, възстановеният Израил „ще пасе в Кармил и Васан“, на пустинята ще се даде „Величието на Кармил и Сарон“; а когато Бог съди, „върхът на Кармил ще изсъхне“. Планината била свята и за други. Псевдо-Скилак я нарича свещена планина на Зевс, Ямвлих казва, че Питагор се оттеглил на нея, а Тацит разказва как Веспасиан през 69 г. н.е. се допитал до бога Кармил, който нямал нито образ, нито храм, а само олтар."
    - "Византийски и средновековни монаси се заселили в пещерите на Илия, а в началото на XIII в. отшелниците там получили устава, който ги направил кармелитски орден. Техният манастир „Стела Марис“ стои на носа, а Мухрака, параклисът в югоизточния край, бележи традиционното място на жертвоприношението. Хайфа се изкачва по северния склон, бахайските градини прорязват лицето му, праисторическите пещери стават обект на световното наследство през 2012 г., а хребетът е национален парк, силно опожарен през 2010 г."
