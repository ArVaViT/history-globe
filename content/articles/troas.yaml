body:
  en:
    - "Troas, in full Alexandria Troas, lay on the Aegean coast of the Troad in north-west Asia Minor, opposite the island of Tenedos and about 25 km south of Troy. Antigonus founded it late in the fourth century BC as Antigonia, on a site called Sigia, and brought in the people of nearby towns such as Neandria and Cebren. Lysimachus, who held the region after 301 BC, renamed it Alexandria in honour of Alexander. Strabo says it endured and grew, received a colony of Romans and was one of the notable cities of the world."
    - "Under Augustus the city became a Roman colony, and it was the chief harbour for the crossing from Asia to Macedonia. The circuit of its walls, the remains of baths and a theatre, and the silted basins of its harbour can still be traced."
    - 'On his second journey Paul, passing by Mysia, came down to Troas. There in the night he saw a man of Macedonia praying him, "Come over into Macedonia, and help us", and the company sailed straight to Samothracia and Neapolis; here Acts begins to speak of "we". Later Paul came to Troas to preach the gospel and found a door opened, but went on to Macedonia because Titus was not there. On his last journey to Jerusalem he stayed seven days: on the first day of the week, when the disciples came together to break bread, he spoke until midnight, and the young man Eutychus fell from the third loft and was taken up dead, but was brought alive. The Second Letter to Timothy, written in Paul''s name, asks for the cloak left at Troas with Carpus.'
    - "Early in the second century, by the usual dating, Ignatius of Antioch, taken under guard to Rome, wrote from Troas his letters to the Philadelphians, to the Smyrnaeans and to Polycarp, and sailed from there to Neapolis. Under Hadrian, Philostratus tells, Herodes Atticus, then in charge of the free cities of Asia, gave the city a costly water supply. Zosimus says that Constantine first began to build his new capital between Troas and old Ilium, then left the work unfinished and chose Byzantium."
  ru:
    - "Троада, полностью Александрия Троадская, лежала на эгейском берегу Троады на северо-западе Малой Азии, напротив острова Тенедос и примерно в 25 км к югу от Трои. Антигон основал её в конце IV века до н. э. как Антигонию на месте, называвшемся Сигия, и переселил туда жителей соседних городов, таких как Неандрия и Кебрена. Лисимах, владевший краем после 301 г. до н. э., переименовал её в Александрию в честь Александра. Страбон пишет, что город устоял и вырос, принял колонию римлян и стал одним из примечательных городов мира."
    - "При Августе город стал римской колонией и был главной гаванью для переправы из Азии в Македонию. До сих пор прослеживаются кольцо его стен, остатки бань и театра и занесённые песком бассейны гавани."
    - "Во втором путешествии Павел, миновав Мисию, сошёл в Троаду. Там ночью ему явился некий муж, Македонянин, прося его: «приди в Македонию и помоги нам», и спутники прямо прибыли в Самофракию и Неаполь; с этого места Деяния начинают говорить «мы». Позже Павел пришёл в Троаду для благовествования и нашёл отверстую дверь, но ушёл в Македонию, потому что не нашёл там Тита. На последнем пути в Иерусалим он пробыл здесь семь дней: в первый день недели, когда ученики собрались для преломления хлеба, он беседовал до полуночи, и юноша Евтих упал с третьего жилья и был поднят мёртвым, но его привели живого. Второе послание к Тимофею, написанное от имени Павла, просит принести фелонь, оставленный в Троаде у Карпа."
    - "В начале II века, по обычной датировке, Игнатий Антиохийский, которого под стражей везли в Рим, написал из Троады послания к филадельфийцам, к смирнянам и к Поликарпу и оттуда отплыл в Неаполь. При Адриане, как рассказывает Филострат, Ирод Аттик, ведавший тогда свободными городами Асии, дал городу дорогой водопровод. Зосим пишет, что Константин сначала начал строить новую столицу между Троадой и древним Илионом, но оставил работу незаконченной и избрал Византий."
  uk:
    - "Троада, повністю Александрія Троада, лежала на егейському узбережжі Троади на північному заході Малої Азії, навпроти острова Тенедос і приблизно за 25 км на південь від Трої. Антигон заснував її наприкінці IV ст. до н. е. як Антигонію, на місці, званому Сігія, і переселив людей сусідніх міст, як-от Неандрії та Кебрена. Лісімах, який володів краєм після 301 р. до н. е., перейменував її на Александрію на честь Александра. Страбон каже, що вона вціліла й зросла, прийняла колонію римлян і була одним із визначних міст світу."
    - "За Августа місто стало римською колонією і було головною гаванню для переправи з Азії до Македонії. Обвід її мурів, залишки лазень і театру та замулені басейни гавані можна простежити й досі."
    - "Під час другої подорожі Павло, минувши Місію, зійшов у Троаду. Там уночі він побачив мужа македонця, що благав його: «Прийшовши в Македонию, поможи нам», і супутники відплили просто до Самотракії та Неаполя; тут Книга Дій починає говорити «ми». Пізніше Павло прийшов у Троаду проповідувати євангеліє й знайшов відчинені двері, але пішов далі в Македонію, бо Тита там не було. У своїй останній подорожі до Єрусалима він пробув там сім днів: першого дня тижня, коли учні зібралися ламати хліб, він проповідував до півночі, і юнак Євтих упав з третього поверху й був піднятий мертвим, але його привели живим. Друге послання до Тимофія, написане від імені Павла, просить плащ, залишений у Троаді в Карпа."
    - "На початку II століття за звичайним датуванням Ігнатій Антіохійський, якого під вартою везли до Риму, написав з Троади свої листи до филадельфійців, до смирнян і до Полікарпа й відплив звідти до Неаполя. За Адріана, розповідає Філострат, Герод Аттік, що тоді відав вільними містами Азії, дав місту дороговартісне водопостачання. Зосима каже, що Костянтин спершу почав будувати свою нову столицю між Троадою і старим Ілієм, потім залишив роботу недокінченою і обрав Візантій."
  es:
    - "Troas, en su nombre completo Alejandría de Troas, estaba en la costa egea de la Tróade, en el noroeste de Asia Menor, frente a la isla de Tenedos y a unos 25 km al sur de Troya. Antígono la fundó a finales del siglo IV a. C. como Antigonia, en un lugar llamado Sigia, y trasladó a ella a la población de ciudades cercanas como Neandria y Cebrén. Lisímaco, que dominó la región después de 301 a. C., la rebautizó Alejandría en honor de Alejandro. Estrabón dice que perduró y creció, recibió una colonia de romanos y fue una de las ciudades notables del mundo."
    - "Bajo Augusto la ciudad se convirtió en colonia romana, y era el principal puerto para la travesía de Asia a Macedonia. Aún pueden rastrearse el perímetro de sus murallas, los restos de unas termas y de un teatro, y las dársenas colmatadas de su puerto."
    - "En su segundo viaje, Pablo, pasando por Misia, descendió a Troas. Allí, de noche, vio a un varón macedonio que le rogaba: «Pasa á Macedonia, y ayúdanos», y el grupo navegó derecho a Samotracia y Neápolis; aquí los Hechos empiezan a hablar de «nosotros». Más tarde Pablo llegó a Troas para predicar el evangelio y encontró una puerta abierta, pero siguió a Macedonia porque Tito no estaba allí. En su último viaje a Jerusalén se quedó siete días: el primer día de la semana, cuando los discípulos se reunieron para partir el pan, habló hasta la medianoche, y el joven Eutico cayó del tercer piso y fue alzado muerto, pero fue devuelto vivo. La Segunda Carta a Timoteo, escrita en nombre de Pablo, pide el capote que quedó en Troas en casa de Carpo."
    - "A comienzos del siglo II, según la datación habitual, Ignacio de Antioquía, llevado bajo custodia a Roma, escribió desde Troas sus cartas a los filadelfios, a los esmirniotas y a Policarpo, y de allí navegó a Neápolis. Bajo Adriano, cuenta Filóstrato, Herodes Ático, entonces a cargo de las ciudades libres de Asia, dotó a la ciudad de un costoso abastecimiento de agua. Zósimo dice que Constantino empezó primero a construir su nueva capital entre Troas y la antigua Ilión, y luego dejó la obra inacabada y eligió Bizancio."
  pt:
    - "Trôade, em nome completo Alexandria Trôade, ficava na costa do Egeu da Tróade, no noroeste da Ásia Menor, em frente à ilha de Tenedos e a cerca de 25 km ao sul de Troia. Antígono a fundou no fim do século IV a.C. como Antigônia, num sítio chamado Sigia, e trouxe o povo de cidades próximas como Neândria e Cebren. Lisímaco, que dominou a região depois de 301 a.C., rebatizou-a Alexandria em honra de Alexandre. Estrabão diz que ela perdurou e cresceu, recebeu uma colônia de romanos e foi uma das cidades notáveis do mundo."
    - "Sob Augusto, a cidade tornou-se colônia romana e foi o principal porto para a travessia da Ásia à Macedônia. O perímetro de suas muralhas, os restos de termas e de um teatro e as bacias assoreadas de seu porto ainda podem ser traçados."
    - "Em sua segunda viagem, Paulo, passando pela Mísia, desceu a Trôade. Ali, de noite, viu um homem da Macedônia que lhe rogava: “Passa à Macedônia e ajuda-nos”, e a comitiva navegou direto para Samotrácia e Neápolis; aqui Atos começa a falar em “nós”. Mais tarde Paulo foi a Trôade para pregar o evangelho e encontrou uma porta aberta, mas seguiu para a Macedônia porque Tito não estava ali. Em sua última viagem a Jerusalém, ficou sete dias: no primeiro dia da semana, quando os discípulos se reuniram para partir o pão, falou até a meia-noite, e o jovem Êutico caiu do terceiro andar e foi levantado morto, mas foi trazido com vida. A Segunda Carta a Timóteo, escrita em nome de Paulo, pede a capa deixada em Trôade com Carpo."
    - "No início do século II, pela datação usual, Inácio de Antioquia, levado sob escolta a Roma, escreveu de Trôade suas cartas aos filadelfienses, aos esmirniotas e a Policarpo, e dali navegou para Neápolis. Sob Adriano, conta Filóstrato, Herodes Ático, então encarregado das cidades livres da Ásia, deu à cidade um dispendioso abastecimento de água. Zózimo diz que Constantino começou a construir sua nova capital entre Trôade e a velha Ílion, depois deixou a obra inacabada e escolheu Bizâncio."
  de:
    - "Troas, vollständig Alexandria Troas, lag an der Ägäisküste der Troas im Nordwesten Kleinasiens, gegenüber der Insel Tenedos und etwa 25 km südlich von Troja. Antigonos gründete es Ende des vierten Jahrhunderts v. Chr. als Antigonia an einem Ort namens Sigia und siedelte die Bewohner nahegelegener Städte wie Neandria und Kebren an. Lysimachos, der die Gegend nach 301 v. Chr. hielt, benannte es zu Ehren Alexanders in Alexandria um. Strabon sagt, es habe Bestand gehabt und sei gewachsen, habe eine Kolonie von Römern aufgenommen und sei eine der bedeutenden Städte der Welt gewesen."
    - "Unter Augustus wurde die Stadt römische Kolonie und war der wichtigste Hafen für die Überfahrt von Asien nach Mazedonien. Der Verlauf ihrer Mauern, Reste von Bädern und einem Theater und die verlandeten Becken ihres Hafens lassen sich noch verfolgen."
    - "Auf seiner zweiten Reise zog Paulus an Mysien vorüber und kam hinab nach Troas. Dort sah er in der Nacht einen Mann aus Mazedonien, der ihn bat: „Komm herüber nach Mazedonien und hilf uns!“, und die Gruppe fuhr geradewegs nach Samothrazien und Neapolis; hier beginnt die Apostelgeschichte, von „wir“ zu sprechen. Später kam Paulus nach Troas, um das Evangelium zu predigen, und fand eine Tür aufgetan, ging aber weiter nach Mazedonien, weil Titus nicht da war. Auf seiner letzten Reise nach Jerusalem blieb er sieben Tage: Am ersten Tag der Woche, als die Jünger zusammenkamen, das Brot zu brechen, sprach er bis Mitternacht, und der junge Eutychus fiel vom dritten Söller und wurde tot aufgehoben, wurde aber lebendig gebracht. Der Zweite Brief an Timotheus, in Paulus' Namen geschrieben, bittet um den Mantel, der in Troas bei Karpus blieb."
    - "Anfang des zweiten Jahrhunderts, nach der üblichen Datierung, schrieb Ignatius von Antiochia, unter Bewachung nach Rom gebracht, von Troas aus seine Briefe an die Philadelphier, an die Smyrnäer und an Polykarp und segelte von dort nach Neapolis. Unter Hadrian, erzählt Philostratos, gab Herodes Atticus, damals für die freien Städte Asiens zuständig, der Stadt eine kostspielige Wasserversorgung. Zosimos sagt, Konstantin habe seine neue Hauptstadt zuerst zwischen Troas und dem alten Ilion zu bauen begonnen, dann das Werk unvollendet gelassen und Byzanz gewählt."
  fr:
    - "Troas, en entier Alexandrie de Troade, se trouvait sur la côte égéenne de la Troade, dans le nord-ouest de l’Asie Mineure, en face de l’île de Ténédos et à environ 25 km au sud de Troie. Antigone la fonda à la fin du IVe siècle av. J.-C. sous le nom d’Antigonia, sur un site appelé Sigia, et y fit venir les habitants de villes voisines comme Néandria et Cébrène. Lysimaque, qui tint la région après 301 av. J.-C., la rebaptisa Alexandrie en l’honneur d’Alexandre. Strabon dit qu’elle dura et grandit, reçut une colonie de Romains et fut l’une des villes remarquables du monde."
    - "Sous Auguste, la ville devint colonie romaine, et fut le principal port pour la traversée d’Asie en Macédoine. Le tracé de ses remparts, les vestiges de thermes et d’un théâtre, et les bassins ensablés de son port se distinguent encore."
    - "Lors de son deuxième voyage, Paul, passant la Mysie, descendit à Troas. Là, de nuit, il vit un Macédonien qui le priait : « Passe en Macédoine, secours-nous ! », et la troupe fit voile directement vers la Samothrace et Néapolis ; c’est ici que les Actes se mettent à dire « nous ». Plus tard, Paul vint à Troas pour l’Évangile et y trouva une porte ouverte, mais partit pour la Macédoine parce que Tite n’y était pas. Lors de son dernier voyage à Jérusalem, il y resta sept jours : le premier jour de la semaine, comme les disciples étaient réunis pour rompre le pain, il parla jusqu’à minuit, et le jeune Eutychus tomba du troisième étage et fut relevé mort, mais fut ramené à la vie. La Seconde Lettre à Timothée, écrite au nom de Paul, demande le manteau laissé à Troas chez Carpus."
    - "Au début du IIe siècle, selon la datation usuelle, Ignace d’Antioche, conduit sous escorte à Rome, écrivit de Troas ses lettres aux Philadelphiens, aux Smyrniotes et à Polycarpe, et s’y embarqua pour Néapolis. Sous Hadrien, raconte Philostrate, Hérode Atticus, alors chargé des villes libres d’Asie, dota la ville d’un coûteux aqueduc. Selon Zosime, Constantin commença d’abord à bâtir sa nouvelle capitale entre Troas et l’ancienne Ilion, puis laissa le chantier inachevé et choisit Byzance."
  pl:
    - "Troada, a w pełnej nazwie Aleksandria Troas, leżała na egejskim wybrzeżu Troady w północno-zachodniej Azji Mniejszej, naprzeciw wyspy Tenedos i około 25 km na południe od Troi. Antygonos założył ją pod koniec IV wieku p.n.e. jako Antigonię, na miejscu zwanym Sigia, i sprowadził tu mieszkańców pobliskich miast, takich jak Neandria i Kebren. Lizymach, który władał regionem po 301 roku p.n.e., przemianował ją na Aleksandrię na cześć Aleksandra. Strabon mówi, że przetrwała i rosła, przyjęła kolonię Rzymian i była jednym ze znamienitych miast świata."
    - "Za Augusta miasto stało się rzymską kolonią i było głównym portem na przeprawie z Azji do Macedonii. Obwód jego murów, pozostałości łaźni i teatru oraz zamulone baseny portu można prześledzić do dziś."
    - "W swej drugiej podróży Paweł, mijając Myzję, zstąpił do Troady. Tam w nocy ujrzał męża z Macedonii, który prosił go: „Przepraw się do Macedonii, a ratuj nas”, i towarzysze popłynęli prosto do Samotraki i Neapolis; tu Dzieje Apostolskie zaczynają mówić „my”. Później Paweł przybył do Troady głosić ewangelię i znalazł otwarte drzwi, ale poszedł dalej do Macedonii, bo nie zastał tam Tytusa. W ostatniej podróży do Jerozolimy został tam siedem dni: pierwszego dnia tygodnia, gdy uczniowie zebrali się na łamanie chleba, przemawiał do północy, a młodzieniec Eutych spadł z trzeciego piętra i podniesiono go martwego, lecz został przywrócony do życia. Drugi List do Tymoteusza, napisany w imieniu Pawła, prosi o opończę zostawioną w Troadzie u Karpa."
    - "Na początku II wieku, według zwykłego datowania, Ignacy z Antiochii, prowadzony pod strażą do Rzymu, napisał z Troady swoje listy do Filadelfijczyków, Smyrneńczyków i Polikarpa i stamtąd odpłynął do Neapolis. Za Hadriana, jak opowiada Filostrat, Herodes Attyk, wówczas zarządzający wolnymi miastami Azji, ufundował miastu kosztowny wodociąg. Zozym pisze, że Konstantyn zaczął najpierw budować swą nową stolicę między Troadą a dawnym Ilionem, po czym porzucił nieukończone dzieło i wybrał Bizancjum."
  it:
    - "Troade, per intero Alessandria Troade, sorgeva sulla costa egea della Troade, nell’Asia Minore nord-occidentale, di fronte all’isola di Tenedo e a circa 25 km a sud di Troia. Antigono la fondò alla fine del IV secolo a.C. come Antigonia, in un luogo chiamato Sigia, e vi raccolse gli abitanti di città vicine come Neandria e Cebren. Lisimaco, che tenne la regione dopo il 301 a.C., la ribattezzò Alessandria in onore di Alessandro. Strabone dice che durò e crebbe, ricevette una colonia di Romani e fu una delle città notevoli del mondo."
    - "Sotto Augusto la città divenne colonia romana, e fu il porto principale per la traversata dall’Asia alla Macedonia. Il circuito delle sue mura, i resti di terme e di un teatro e i bacini interrati del suo porto si possono ancora riconoscere."
    - "Nel suo secondo viaggio Paolo, oltrepassata la Misia, scese a Troade. Lì di notte vide un uomo macedone che lo pregava: «Passa in Macedonia e soccorrici», e la comitiva salpò diritta verso Samotracia e Neapoli; da qui gli Atti cominciano a parlare con «noi». Più tardi Paolo venne a Troade per annunciare il Vangelo e vi trovò una porta aperta, ma proseguì per la Macedonia perché Tito non c’era. Nel suo ultimo viaggio a Gerusalemme vi rimase sette giorni: il primo giorno della settimana, mentre i discepoli erano radunati per rompere il pane, parlò fino a mezzanotte, e il giovane Eutico cadde dal terzo piano e fu levato morto, ma fu ricondotto vivo. La Seconda lettera a Timoteo, scritta a nome di Paolo, chiede il mantello lasciato a Troade da Carpo."
    - "All’inizio del II secolo, secondo la datazione abituale, Ignazio di Antiochia, condotto sotto scorta a Roma, scrisse da Troade le sue lettere ai Filadelfesi, agli Smirnesi e a Policarpo, e di lì salpò per Neapoli. Sotto Adriano, racconta Filostrato, Erode Attico, allora incaricato delle città libere d’Asia, diede alla città un costoso acquedotto. Zosimo dice che Costantino cominciò a costruire la sua nuova capitale fra Troade e l’antica Ilio, poi lasciò l’opera incompiuta e scelse Bisanzio."
  nl:
    - "Troas, voluit Alexandria Troas, lag aan de Egeïsche kust van de Troas in het noordwesten van Klein-Azië, tegenover het eiland Tenedos en ongeveer 25 km ten zuiden van Troje. Antigonus stichtte het laat in de vierde eeuw v.Chr. als Antigonia, op een plek genaamd Sigia, en bracht er de bewoners van nabijgelegen steden als Neandria en Kebren heen. Lysimachus, die de streek na 301 v.Chr. in handen had, noemde het ter ere van Alexander Alexandria. Strabo zegt dat het standhield en groeide, een kolonie van Romeinen ontving en een van de opmerkelijke steden van de wereld was."
    - "Onder Augustus werd de stad een Romeinse kolonie, en ze was de voornaamste haven voor de oversteek van Asia naar Macedonië. De omtrek van haar muren, de resten van baden en een theater, en de dichtgeslibde havenbekkens zijn nog te volgen."
    - "Op zijn tweede reis kwam Paulus, Mysië voorbijgaand, af naar Troas. Daar zag hij in de nacht een man uit Macedonië die hem bad: “Kom over in Macedonië, en help ons”, en het gezelschap voer rechtstreeks naar Samothrace en Neapolis; hier begint Handelingen over “wij” te spreken. Later kwam Paulus naar Troas om het evangelie te prediken en vond een deur geopend, maar ging door naar Macedonië omdat Titus er niet was. Op zijn laatste reis naar Jeruzalem bleef hij er zeven dagen: op de eerste dag van de week, toen de discipelen bijeenkwamen om brood te breken, sprak hij tot middernacht, en de jongeling Eutychus viel van de derde verdieping en werd dood opgenomen, maar werd levend gebracht. De Tweede Brief aan Timoteüs, in naam van Paulus geschreven, vraagt om de reismantel die bij Karpus in Troas was achtergelaten."
    - "Vroeg in de tweede eeuw, volgens de gebruikelijke datering, schreef Ignatius van Antiochië, onder bewaking naar Rome gebracht, vanuit Troas zijn brieven aan de Filadelfiërs, aan de Smyrnanen en aan Polycarpus, en voer van daar naar Neapolis. Onder Hadrianus, vertelt Philostratus, schonk Herodes Atticus, toen belast met de vrije steden van Asia, de stad een kostbare watervoorziening. Zosimus zegt dat Constantijn zijn nieuwe hoofdstad eerst tussen Troas en het oude Ilium begon te bouwen, daarna het werk onvoltooid liet en Byzantium koos."
  cs:
    - "Troas, celým jménem Alexandria Troas, leželo na egejském pobřeží Troady v severozápadní Malé Asii, naproti ostrovu Tenedos a asi 25 km jižně od Tróje. Antigonos je založil koncem 4. stol. př. n. l. jako Antigonii na místě zvaném Sigia a přivedl obyvatele okolních měst jako Neandreia a Kebren. Lysimachos, který kraj držel po roce 301 př. n. l., je na počest Alexandra přejmenoval na Alexandrii. Strabón říká, že přetrvalo a rostlo, přijalo kolonii Římanů a bylo jedním ze známých měst světa."
    - "Za Augusta se město stalo římskou kolonií a bylo hlavním přístavem pro přeplavbu z Asie do Makedonie. Obvod jeho hradeb, zbytky lázní a divadla i zanesené pánve přístavu lze dosud vysledovat."
    - "Na své druhé cestě přišel Pavel, míjeje Mýsii, do Troas. Tam v noci spatřil muže Makedonce, který ho prosil: „Přijda do Macedonie, pomoz nám“, a družina se plavila přímo do Samothráké a Neapole; zde začínají Skutky mluvit v první osobě množného čísla. Později přišel Pavel do Troas kázat evangelium a nalezl otevřené dveře, ale pokračoval do Makedonie, protože tam nebyl Titus. Na své poslední cestě do Jeruzaléma tam zůstal sedm dní: první den v týdnu, když se učedníci sešli k lámání chleba, mluvil až do půlnoci a mladík Eutychos spadl z třetího poschodí a byl zvednut mrtvý, ale byl přiveden živý. Druhý list Timoteovi, psaný Pavlovým jménem, žádá o plášť zanechaný v Troas u Karpa."
    - "Na počátku 2. století, podle obvyklého datování, napsal Ignatius Antiochijský, vezený pod stráží do Říma, z Troas své listy Filadelfským, Smyrnským a Polykarpovi a odtud se plavil do Neapole. Za Hadriana, vypráví Filostratos, dal Herodes Attikos, tehdy správce svobodných měst Asie, městu nákladný vodovod. Zosimos říká, že Konstantin začal nové hlavní město stavět nejprve mezi Troas a starým Ílionem, pak dílo nechal nedokončené a zvolil Byzantion."
  sv:
    - "Troas, fullständigt Alexandria Troas, låg på Egeiska kusten av Troas i nordvästra Mindre Asien, mitt emot ön Tenedos och omkring 25 km söder om Troja. Antigonos grundade det sent på 300-talet f.Kr. som Antigonia, på en plats kallad Sigia, och förde dit invånarna från närliggande städer som Neandria och Kebren. Lysimachos, som höll regionen efter 301 f.Kr., döpte om det till Alexandria till Alexanders ära. Strabon säger att det bestod och växte, fick en koloni av romare och var en av världens märkliga städer."
    - "Under Augustus blev staden en romersk koloni, och den var den främsta hamnen för överfarten från Asien till Makedonien. Muromkretsen, lämningarna av bad och en teater och hamnens igenslammade bassänger kan fortfarande spåras."
    - "På sin andra resa kom Paulus, förbi Mysien, ner till Troas. Där såg han om natten en man från Makedonien som bad honom: ”Far över till Macedonien och hjälp oss”, och sällskapet seglade rakt till Samotrake och Neapolis; här börjar Apostlagärningarna tala om ”vi”. Senare kom Paulus till Troas för att predika evangeliet och fann en dörr öppnad, men fortsatte till Makedonien eftersom Titus inte var där. På sin sista resa till Jerusalem stannade han sju dagar: på första dagen i veckan, då lärjungarna samlades för att bryta bröd, talade han till midnatt, och den unge mannen Eutykos föll från tredje våningen och togs upp död, men fördes levande därifrån. Andra Timoteusbrevet, skrivet i Paulus' namn, ber om manteln som lämnats i Troas hos Karpos."
    - "Tidigt på 100-talet, enligt den vanliga dateringen, skrev Ignatios av Antiochia, förd under bevakning till Rom, från Troas sina brev till filadelfierna, till smyrnierna och till Polykarpos, och seglade därifrån till Neapolis. Under Hadrianus, berättar Philostratos, gav Herodes Atticus, då ansvarig för Asiens fria städer, staden en kostsam vattenförsörjning. Zosimos säger att Konstantin först började bygga sin nya huvudstad mellan Troas och det gamla Ilion, och sedan lämnade arbetet ofullbordat och valde Byzantion."
  nb:
    - "Troas, i full form Aleksandria Troas, lå på Egeerhavskysten av Troas-regionen i nordvestlige Lilleasia, midt overfor øya Tenedos og omkring 25 km sør for Troja. Antigonos grunnla den sent på 300-tallet f.Kr. som Antigonia, på et sted kalt Sigia, og hentet inn folk fra nærliggende byer som Neandria og Cebren. Lysimakhos, som hadde regionen etter 301 f.Kr., døpte den om til Aleksandria til ære for Aleksander. Strabon sier at den holdt seg og vokste, fikk en koloni av romere og var en av verdens fremtredende byer."
    - "Under Augustus ble byen en romersk koloni, og den var hovedhavnen for overfarten fra Asia til Makedonia. Omkretsen av murene, levningene av bad og et teater og de oppslammede havnebassengene kan fortsatt følges."
    - "På sin andre reise kom Paulus, forbi Mysia, ned til Troas. Der så han om natten en mann fra Makedonia som ba ham: «Kom over til Makedonia og hjelp oss!», og selskapet seilte rett til Samotrake og Neapolis; her begynner Apostlenes gjerninger å tale om «vi». Senere kom Paulus til Troas for å forkynne evangeliet og fant en dør åpnet, men drog videre til Makedonia fordi Titus ikke var der. På sin siste reise til Jerusalem ble han sju dager: på ukens første dag, da disiplene var samlet for å bryte brødet, talte han til midnatt, og den unge mannen Evtykos falt ned fra tredje etasje og ble tatt opp død, men ble ført levende bort. Andre Timoteusbrev, skrevet i Paulus' navn, ber om kappen som ble latt igjen i Troas hos Karpos."
    - "Tidlig på 100-tallet, etter vanlig datering, skrev Ignatius av Antiokia, ført under bevoktning til Roma, fra Troas brevene sine til filadelferne, til smyrnerne og til Polykarp, og seilte derfra til Neapolis. Under Hadrian, forteller Filostratos, ga Herodes Atticus, da ansvarlig for de frie byene i Asia, byen en kostbar vannforsyning. Zosimos sier at Konstantin først begynte å bygge sin nye hovedstad mellom Troas og det gamle Ilion, så lot arbeidet stå uferdig og valgte Byzantion."
