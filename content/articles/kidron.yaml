body:
  en:
    - "The Kidron is the valley on the east side of Jerusalem, between the Temple Mount and the City of David on one hand and the Mount of Olives on the other. The Hebrew calls it a nahal, a torrent bed that runs only after heavy rain. It begins north of the Old City, deepens as it passes the temple and the Gihon spring on its western slope, takes in the Tyropoeon and the Valley of Hinnom below Siloam, and goes on as Wadi en-Nar through the wilderness of Judah to the Dead Sea. Centuries of rubble have raised its floor by many metres beside the temple. On its eastern side stand rock-cut monuments of the Hasmonean and Herodian age, the so-called tombs of Absalom and Zechariah and the tomb of the priestly family of Hezir, and above it the village of Silwan with tombs of the kingdom of Judah."
    - "David, fleeing from Absalom, “passed over the brook Kidron” toward the wilderness, and Solomon forbade Shimei to cross it on pain of death. The reforming kings threw into it what they cleared out of the temple: Asa burnt his mother's idol “by the brook Kidron”; Hezekiah's Levites carried the uncleanness of the house “into the brook Kidron” and the altars of the city were cast there at his Passover; Josiah burnt the vessels of Baal “in the fields of Kidron”, ground the Asherah to powder beside the brook and threw the dust of Manasseh's altars into it. Nehemiah rode by night “by the brook” to inspect the ruined wall, and Jeremiah promises that “all the fields unto the brook of Kidron” will be holy to the LORD."
    - "After the last supper Jesus “went forth with his disciples over the brook Cedron, where was a garden”, Gethsemane on the slope opposite. Josephus describes the dizzying depth of the valley below the temple's colonnades. Since Jews, Christians and Muslims took it for the “valley of Jehoshaphat” of Joel, where God will judge the nations, graves have covered both its slopes; at its head the Byzantine crypt and twelfth-century church mark the Tomb of the Virgin. Far down the wadi, in the desert, Sabas founded his great laura, Mar Saba, in 483."
    - "Today the valley divides the Old City and the City of David excavations from Silwan and the villages of the Mount of Olives; a road runs along its floor past the Gihon spring. Much of the city's sewage still runs down it toward the Dead Sea, and in wet winters the Kidron floods."
  ru:
    - "Кедрон — долина с восточной стороны Иерусалима, между Храмовой горой и Городом Давида с одной стороны и Елеонской горой с другой. По-еврейски это нахал, русло потока, текущего лишь после сильных дождей. Долина начинается к северу от Старого города, углубляется, проходя мимо храма и источника Гихон на западном склоне, принимает Тиропеон и долину Еннома ниже Силоама и уходит как Вади-эн-Нар через Иудейскую пустыню к Мёртвому морю. Века мусора подняли её дно у храма на много метров. На восточной стороне стоят высеченные в скале памятники хасмонейского и иродианского времени — так называемые гробницы Авессалома и Захарии и гробница священнического рода Хезира, а выше — селение Силван с гробницами эпохи Иудейского царства."
    - "Давид, спасаясь от Авессалома, «перешел поток Кедрон» по дороге к пустыне, а Соломон под страхом смерти запретил Семею переходить его. Цари-реформаторы бросали туда то, что выносили из храма: Аса сжёг истукан своей матери «у потока Кедрона»; левиты Езекии вынесли нечистое из дома «к потоку Кедрону», и туда же бросили жертвенники города в его Пасху; Иосия сжёг вещи Ваала «в долине Кедрон», истёр Астарту в прах у потока и бросил в него прах жертвенников Манассии. Неемия ночью ехал «по лощине», осматривая разрушенную стену, а Иеремия обещает, что «все поле до потока Кедрона» будет святынею Господа."
    - "После Тайной вечери Иисус «вышел с учениками Своими за поток Кедрон, где был сад» — Гефсимания на склоне напротив. Иосиф Флавий описывает головокружительную глубину долины под колоннадами храма. Поскольку иудеи, христиане и мусульмане приняли её за «долину Иосафата» из книги Иоиля, где Бог будет судить народы, могилы покрыли оба склона; у её верховья византийская крипта и церковь XII века отмечают Гробницу Богородицы. Далеко вниз по вади, в пустыне, Савва основал в 483 году свою великую лавру — Мар-Сабу."
    - "Сегодня долина отделяет Старый город и раскопки Города Давида от Силвана и селений Елеонской горы; по её дну идёт дорога мимо источника Гихон. По ней до сих пор стекает к Мёртвому морю значительная часть сточных вод города, а в дождливые зимы Кедрон разливается."
  uk:
    - "Кедрон — це долина зі східного боку Єрусалима, між Храмовою горою й Містом Давида з одного боку та Оливковою горою з другого. Староєврейською вона зветься нахаль, тобто русло потоку, що тече лише після сильних дощів. Вона починається на північ від Старого міста, поглиблюється, минаючи храм і джерело Гіхон на її західному схилі, приймає Тіропеон і Долину Гінном нижче Сілоаму й далі йде як ваді ен-Нар крізь Юдейську пустелю до Мертвого моря. Багатовікове сміття підняло її дно на багато метрів поруч із храмом. На її східному боці стоять висічені в скелі пам’ятки хасмонейської та іродіянської доби, так звані гробниці Авесалома й Захарії та гробниця священицького роду Хезір, а над нею — село Сільван з гробницями Юдейського царства."
    - "Давид, утікаючи від Авесалома, разом з усім народом «перейшли потік Кидрон» у напрямку пустелі, а Соломон заборонив Шимеєві переходити його під страхом смерті. Царі-реформатори скидали в нього те, що виносили з храму: Аса спалив ідол своєї матері «коло Кидрон-потока»; левіти Єзекії «винесли ʼд Кедрон-потокові» нечисть дому, і туди ж скинули жертівники міста під час його Пасхи; Йосія спалив посуд Ваала «у долинї Кедрон», розбив Ашеру на порох біля потоку й жбурнув у нього порох манасійних жертівників. Неемія вночі їхав «через потік», оглядаючи зруйнований мур, а Єремія обіцяє, що «всї поля до Кедрон-потока» будуть святі Господеві."
    - "Після Таємної вечері Ісус «вийшов з учениками своїми за потік Кедрон, де був сад», — Гетсиманія на протилежному схилі. Йосиф Флавій описує запаморочливу глибину долини під колонадами храму. Відколи євреї, християни й мусульмани вважали її за долину Йосафата з книги Йоїла, де Бог судитиме народи, могили вкривають обидва її схили; на її початку візантійська крипта й церква XII ст. позначають Гробницю Діви Марії. Далеко вниз по ваді, у пустелі, Сава Освячений 483 р. заснував свою велику лавру — Мар-Саба."
    - "Сьогодні долина відокремлює Старе місто й розкопки Міста Давида від Сільвана та сіл Оливкової гори; вздовж її дна йде дорога повз джерело Гіхон. Значна частина міських стоків і досі тече по ній до Мертвого моря, а в дощові зими Кедрон розливається."
  es:
    - "El Cedrón es el valle del lado oriental de Jerusalén, entre el Monte del Templo y la Ciudad de David, por un lado, y el Monte de los Olivos, por el otro. El hebreo lo llama nahal, un cauce torrencial que solo lleva agua tras fuertes lluvias. Comienza al norte de la Ciudad Vieja, se hace más profundo al pasar junto al templo y al manantial de Gihón, en su ladera occidental, recoge el Tiropeón y el valle de Hinnom por debajo de Siloé, y continúa como Wadi en-Nar por el desierto de Judá hasta el mar Muerto. Siglos de escombros han elevado su fondo muchos metros junto al templo. En su lado oriental se alzan monumentos excavados en la roca de época asmonea y herodiana, las llamadas tumbas de Absalón y de Zacarías y la tumba de la familia sacerdotal de Hezir, y sobre él la aldea de Silwan, con tumbas del reino de Judá."
    - "David, huyendo de Absalón, cruzó «el torrente de Cedrón» hacia el desierto, y Salomón prohibió a Simei cruzarlo bajo pena de muerte. Los reyes reformadores arrojaron a él lo que sacaban del templo: Asa quemó el ídolo de su madre «junto al torrente de Cedrón»; los levitas de Ezequías llevaron la inmundicia de la casa «al torrente de Cedrón» y allí fueron arrojados los altares de la ciudad en su Pascua; Josías quemó los vasos de Baal «en el campo de Cedrón», redujo a polvo la Asera junto al torrente y echó en él el polvo de los altares de Manasés. Nehemías subió de noche «por el torrente» para inspeccionar el muro en ruinas, y Jeremías promete que «todas las llanuras hasta el arroyo de Cedrón» serán «santo á Jehová»."
    - "Después de la última cena, Jesús «salióse con sus discípulos tras el arroyo de Cedrón, donde estaba un huerto», Getsemaní, en la ladera opuesta. Josefo describe la vertiginosa profundidad del valle bajo los pórticos del templo. Desde que judíos, cristianos y musulmanes lo tuvieron por el «valle de Josaphat» de Joel, donde Dios juzgará a las naciones, las tumbas han cubierto ambas laderas; en su cabecera, la cripta bizantina y la iglesia del siglo XII señalan la Tumba de la Virgen. Muy abajo en el uadi, en el desierto, Sabas fundó en 483 su gran laura, Mar Saba."
    - "Hoy el valle separa la Ciudad Vieja y las excavaciones de la Ciudad de David de Silwan y de las aldeas del Monte de los Olivos; una carretera recorre su fondo junto al manantial de Gihón. Gran parte de las aguas residuales de la ciudad sigue bajando por él hacia el mar Muerto, y en los inviernos lluviosos el Cedrón se desborda."
  pt:
    - "O Cedrom é o vale do lado leste de Jerusalém, entre o monte do Templo e a Cidade de Davi, de um lado, e o monte das Oliveiras, de outro. O hebraico o chama de nahal, leito de torrente que só corre depois de chuvas fortes. Começa ao norte da Cidade Velha, aprofunda-se ao passar pelo templo e pela fonte de Giom em sua encosta ocidental, recebe o Tiropeão e o vale de Hinom abaixo de Siloé e segue como uádi en-Nar pelo deserto de Judá até o mar Morto. Séculos de entulho elevaram o seu leito em muitos metros junto ao templo. Em seu lado oriental erguem-se monumentos escavados na rocha da época asmoneia e herodiana, os chamados túmulos de Absalão e de Zacarias e o túmulo da família sacerdotal de Hezir, e acima dele fica a aldeia de Silwan, com túmulos do reino de Judá."
    - "Davi, fugindo de Absalão, “atravessou o ribeiro de Cedrom” rumo ao deserto, e Salomão proibiu Simei de cruzá-lo sob pena de morte. Os reis reformadores lançaram nele o que retiravam do templo: Asa queimou o ídolo de sua mãe “no ribeiro de Cedrom”; os levitas de Ezequias levaram a impureza da casa “até o ribeiro de Cedrom” e os altares da cidade foram lançados ali na sua Páscoa; Josias queimou os utensílios de Baal “nos campos de Cedrom”, reduziu a Aserá a pó junto ao ribeiro e lançou nele o pó dos altares de Manassés. Neemias subiu de noite “pelo ribeiro” para inspecionar a muralha em ruínas, e Jeremias promete que “todos os campos até o ribeiro de Cedrom” serão santos para o SENHOR."
    - "Depois da última ceia, Jesus “saiu com os seus discípulos para o outro lado do ribeiro de Cedrom, onde havia um jardim”, o Getsêmani, na encosta oposta. Josefo descreve a profundidade vertiginosa do vale sob os pórticos do templo. Desde que judeus, cristãos e muçulmanos o tomaram pelo “vale de Josafá” de Joel, onde Deus julgará as nações, sepulturas cobrem as suas duas encostas; em sua cabeceira, a cripta bizantina e a igreja do século XII assinalam o Túmulo da Virgem. Mais abaixo no uádi, no deserto, Sabas fundou em 483 a sua grande lavra, Mar Saba."
    - "Hoje o vale separa a Cidade Velha e as escavações da Cidade de Davi de Silwan e das aldeias do monte das Oliveiras; uma estrada corre por seu leito, passando pela fonte de Giom. Grande parte do esgoto da cidade ainda desce por ele rumo ao mar Morto, e nos invernos chuvosos o Cedrom transborda."
  de:
    - "Das Kidron ist das Tal an der Ostseite Jerusalems, zwischen Tempelberg und Stadt Davids auf der einen und dem Ölberg auf der anderen Seite. Das Hebräische nennt es einen Nahal, ein Bachbett, das nur nach starkem Regen Wasser führt. Es beginnt nördlich der Altstadt, vertieft sich am Tempel und an der Gihonquelle an seinem Westhang, nimmt das Tyropoiontal und das Hinnomtal unterhalb von Siloah auf und zieht als Wadi en-Nar durch die Wüste Juda zum Toten Meer. Jahrhunderte von Schutt haben seine Sohle neben dem Tempel um viele Meter erhöht. An seiner Ostseite stehen in den Fels gehauene Denkmäler der hasmonäischen und herodianischen Zeit, die sogenannten Gräber Absaloms und Sacharjas und das Grab der Priesterfamilie Hesir, darüber das Dorf Silwan mit Gräbern aus dem Königreich Juda."
    - "David, der vor Absalom floh, „ging über den Bach Kidron“ zur Wüste hin, und Salomo verbot Schimi bei Todesstrafe, ihn zu überschreiten. Die reformierenden Könige warfen hinein, was sie aus dem Tempel räumten: Asa, so heißt es vom Bild seiner Mutter, „verbrannte es am Bach Kidron“; Hiskias Leviten „trugen sie hinaus an den Bach Kidron“, und die Altäre der Stadt „warfen sie in den Bach Kidron“; Josia ließ die Geräte Baals „im Tal Kidron“ verbrennen, das Ascherabild „am Bach Kidron“ verbrennen und zu Staub machen und warf den Staub der Altäre Manasses in denselben Bach. Nehemia berichtet: „Da zog ich bei Nacht den Bach hinan“, um die zerstörte Mauer zu besehen, und Jeremia verheißt, das Tal der Leichen und Asche „samt dem ganzen Acker bis an den Bach Kidron“ werde „dem Herrn heilig sein“."
    - "Nach dem letzten Abendmahl ging Jesus „hinaus mit seinen Jüngern über den Bach Kidron; da war ein Garten“, Gethsemane am gegenüberliegenden Hang. Josephus beschreibt die schwindelnde Tiefe des Tals unterhalb der Säulenhallen des Tempels. Seit Juden, Christen und Muslime es für das „Tal Josaphat“ Joels hielten, wo Gott die Völker richten wird, bedecken Gräber beide Hänge; an seinem Kopf bezeichnen die byzantinische Krypta und die Kirche des 12. Jahrhunderts das Grab der Jungfrau. Weit unten im Wadi, in der Wüste, gründete Sabas 483 seine große Laura, Mar Saba."
    - "Heute trennt das Tal die Altstadt und die Grabungen der Stadt Davids von Silwan und den Dörfern des Ölbergs; an der Gihonquelle vorbei führt eine Straße auf seiner Sohle. Ein Großteil der Abwässer der Stadt fließt noch immer hindurch zum Toten Meer, und in nassen Wintern führt das Kidron Hochwasser."
  fr:
    - "Le Cédron est la vallée du côté est de Jérusalem, entre le mont du Temple et la Cité de David d’une part et le mont des Oliviers de l’autre. L’hébreu l’appelle un nahal, lit de torrent qui ne coule qu’après de fortes pluies. Il commence au nord de la Vieille Ville, se creuse en passant devant le temple et la source du Guihon sur son versant occidental, reçoit le Tyropéon et la vallée de Hinnom en contrebas de Siloé, et se poursuit sous le nom d’oued en-Nar à travers le désert de Juda jusqu’à la mer Morte. Des siècles de gravats ont exhaussé son fond de plusieurs mètres près du temple. Sur son côté oriental se dressent des monuments taillés dans le roc de l’époque hasmonéenne et hérodienne, les prétendus tombeaux d’Absalom et de Zacharie et le tombeau de la famille sacerdotale des Hézir, et au-dessus, le village de Silwan avec des tombes du royaume de Juda."
    - "David, fuyant devant Absalom, « passa le torrent de Cédron » vers le désert, et Salomon interdit à Schimei de le franchir sous peine de mort. Les rois réformateurs y jetèrent ce qu’ils ôtaient du temple : Asa brûla l’idole de sa mère « au torrent de Cédron » ; les lévites d’Ézéchias emportèrent l’impureté de la maison « dehors au torrent de Cédron » et les autels de la ville y furent jetés lors de sa Pâque ; Josias brûla les ustensiles de Baal « dans les champs du Cédron », réduisit l’Ashéra en poussière près du torrent et y jeta la poussière des autels de Manassé. Néhémie monta de nuit « par le torrent » inspecter la muraille ruinée, et Jérémie promet que « tous les champs jusqu’au torrent de Cédron » seront consacrés à l’Éternel."
    - "Après le dernier repas, Jésus « alla avec ses disciples de l’autre côté du torrent du Cédron, où se trouvait un jardin », Gethsémané, sur le versant opposé. Flavius Josèphe décrit la profondeur vertigineuse de la vallée sous les portiques du temple. Depuis que Juifs, chrétiens et musulmans y ont vu la « vallée de Josaphat » de Joël, où Dieu jugera les nations, des tombes ont couvert ses deux versants ; à sa tête, la crypte byzantine et l’église du XIIe siècle marquent le Tombeau de la Vierge. Loin en aval de l’oued, dans le désert, Sabas fonda en 483 sa grande laure, Mar Saba."
    - "Aujourd’hui la vallée sépare la Vieille Ville et les fouilles de la Cité de David de Silwan et des villages du mont des Oliviers ; une route court sur son fond, devant la source du Guihon. Une grande partie des eaux usées de la ville y descend encore vers la mer Morte, et, les hivers pluvieux, le Cédron déborde."
  it:
    - "Il Cedron è la valle sul lato orientale di Gerusalemme, tra il Monte del Tempio e la Città di Davide da una parte e il Monte degli Ulivi dall’altra. L’ebraico lo chiama nahal, un letto di torrente che scorre solo dopo forti piogge. Comincia a nord della Città Vecchia, si approfondisce passando davanti al tempio e alla sorgente di Ghicon sul suo pendio occidentale, accoglie il Tiropeo e la Valle di Innom sotto Siloe, e prosegue come Wadi en-Nar attraverso il deserto di Giuda fino al Mar Morto. Secoli di detriti ne hanno sollevato il fondo di molti metri presso il tempio. Sul suo lato orientale sorgono monumenti scavati nella roccia dell’età asmonea ed erodiana, le cosiddette tombe di Assalonne e di Zaccaria e la tomba della famiglia sacerdotale di Chezir, e sopra di esso il villaggio di Silwan con tombe del regno di Giuda."
    - "Davide, fuggendo da Assalonne, «passò il torrente Kidron» verso il deserto, e Salomone vietò a Simei di attraversarlo pena la morte. I re riformatori vi gettarono ciò che toglievano dal tempio: Asa bruciò l’idolo di sua madre «presso al torrente Kidron»; i leviti di Ezechia portarono l’impurità della casa per «gettarle nel torrente Kidron» e vi furono gettati gli altari della città durante la sua Pasqua; Giosia bruciò gli arredi di Baal «nei campi del Kidron», ridusse in polvere l’Asera presso il torrente e vi gettò la polvere degli altari di Manasse. Neemia risalì di notte la valle per ispezionare le mura in rovina, e Geremia promette che «tutti i campi fino al torrente di Kidron» saranno consacrati all’Eterno."
    - "Dopo l’ultima cena Gesù «uscì coi suoi discepoli di là dal torrente Chedron, dov’era un orto», il Getsemani sul pendio di fronte. Giuseppe Flavio descrive la vertiginosa profondità della valle sotto i colonnati del tempio. Poiché ebrei, cristiani e musulmani la identificarono con la «valle di Giosafat» di Gioele, dove Dio giudicherà le nazioni, le tombe hanno coperto entrambi i suoi pendii; alla sua testata la cripta bizantina e la chiesa del XII secolo segnano la Tomba della Vergine. Molto più in basso lungo il wadi, nel deserto, Saba fondò nel 483 la sua grande laura, Mar Saba."
    - "Oggi la valle separa la Città Vecchia e gli scavi della Città di Davide da Silwan e dai villaggi del Monte degli Ulivi; una strada corre sul suo fondo davanti alla sorgente di Ghicon. Gran parte delle acque di scarico della città scorre ancora lungo di essa verso il Mar Morto, e negli inverni piovosi il Cedron straripa."
  pl:
    - "Cedron to dolina po wschodniej stronie Jerozolimy, między Górą Świątynną i Miastem Dawida z jednej strony a Górą Oliwną z drugiej. Hebrajski nazywa ją nahal, korytem potoku, który płynie tylko po obfitych deszczach. Zaczyna się na północ od Starego Miasta, pogłębia się, przechodząc obok świątyni i źródła Gichon na jej zachodnim zboczu, przyjmuje Tyropoeon i Dolinę Hinnom poniżej Siloe i biegnie dalej jako Wadi en-Nar przez pustynię Judzką do Morza Martwego. Wieki gruzu podniosły jej dno o wiele metrów obok świątyni. Po jej wschodniej stronie stoją wykute w skale pomniki z epoki hasmonejskiej i herodiańskiej, tak zwane grobowce Absaloma i Zachariasza oraz grobowiec rodziny kapłańskiej Chezir, a nad nią wieś Silwan z grobowcami z czasów królestwa Judy."
    - "Dawid, uciekając przed Absalomem, „przeszedł przez potok Cedron” w stronę pustyni, a Salomon zakazał Szimejowi przekraczać go pod groźbą śmierci. Królowie-reformatorzy wrzucali do niego to, co usuwali ze świątyni: Asa spalił bożka swojej matki „u potoku Cedron”; lewici Ezechiasza wynieśli nieczystość domu „do potoku Cedron”, a ołtarze miasta wrzucono tam podczas jego Paschy; Jozjasz spalił naczynia Baala „na polu Cedron”, starł Aszerę na proch nad potokiem i wrzucił do niego proch ołtarzy Manassesa. Nehemiasz jechał nocą „nad potokiem”, by obejrzeć zburzony mur, a Jeremiasz obiecuje, że „to wszystko pole aż do potoku Cedron” będzie poświęcone Panu."
    - "Po ostatniej wieczerzy Jezus „wyszedł z uczniami swoimi przez potok Cedron, gdzie był ogród”, Getsemani na przeciwległym zboczu. Józef Flawiusz opisuje zawrotną głębokość doliny pod portykami świątyni. Odkąd Żydzi, chrześcijanie i muzułmanie uznali ją za „dolinę Jozafat” u Joela, gdzie Bóg będzie sądził narody, groby pokryły oba jej zbocza; u jej początku bizantyjska krypta i dwunastowieczny kościół znaczą Grób Maryi. Daleko w dole wadi, na pustyni, Sabas założył w 483 r. swoją wielką ławrę, Mar Saba."
    - "Dziś dolina oddziela Stare Miasto i wykopaliska w Mieście Dawida od Silwanu i wsi na Górze Oliwnej; wzdłuż jej dna biegnie droga obok źródła Gichon. Znaczna część ścieków miasta wciąż spływa nią ku Morzu Martwemu, a w mokre zimy Cedron wylewa."
  nl:
    - "De Kidron is het dal aan de oostzijde van Jeruzalem, tussen de Tempelberg en de Stad van David aan de ene kant en de Olijfberg aan de andere. Het Hebreeuws noemt het een nachal, een stroombedding die alleen na zware regen water voert. Het begint ten noorden van de Oude Stad, wordt dieper bij de tempel en de bron Gihon op de westelijke helling, neemt de Tyropoeon en het Dal van Hinnom onder Siloam op, en loopt als Wadi en-Nar verder door de woestijn van Juda naar de Dode Zee. Eeuwen puin hebben de bodem naast de tempel vele meters verhoogd. Aan de oostzijde staan uit de rots gehouwen monumenten uit de Hasmonese en Herodiaanse tijd, de zogenoemde graven van Absalom en Zacharia en het graf van het priestergeslacht Chezir, en erboven het dorp Silwan met graven uit het koninkrijk Juda."
    - "David, op de vlucht voor Absalom, trok de woestijn in: “ook ging de koning over de beek Kidron”, en Salomo verbood Simeï haar over te steken op straffe van de dood. De hervormende koningen wierpen erin wat zij uit de tempel verwijderden: Asa verbrandde het afgodsbeeld van zijn moeder “aan de beek Kidron”; Chizkia's Levieten droegen de onreinheid van het huis “in de beek Kidron” en de altaren van de stad werden er bij zijn Pesach in geworpen; Josia verbrandde de voorwerpen van Baäl “in de velden van Kidron”, vergruisde de Asjera naast de beek tot stof en wierp het stof van Manasses altaren erin. Nehemia reed 's nachts “door de beek” om de verwoeste muur te inspecteren, en Jeremia belooft dat “al de velden tot aan de beek Kidron” de HEER heilig zullen zijn."
    - "Na het laatste avondmaal ging Jezus “uit met Zijn discipelen over de beek Kedron, waar een hof was”, Getsemane op de helling aan de overkant. Josephus beschrijft de duizelingwekkende diepte van het dal onder de zuilengangen van de tempel. Omdat joden, christenen en moslims het hielden voor het “dal van Josafat” van Joël, waar God de volken zal oordelen, bedekken graven beide hellingen; aan het begin ervan markeren de Byzantijnse crypte en de twaalfde-eeuwse kerk het Graf van Maria. Ver stroomafwaarts in de woestijn stichtte Sabas in 483 zijn grote lavra, Mar Saba."
    - "Tegenwoordig scheidt het dal de Oude Stad en de opgravingen van de Stad van David van Silwan en de dorpen van de Olijfberg; een weg loopt over de bodem langs de bron Gihon. Een groot deel van het rioolwater van de stad stroomt er nog steeds door naar de Dode Zee, en in natte winters overstroomt de Kidron."
  cs:
    - "Kidron je údolí na východní straně Jeruzaléma, mezi Chrámovou horou a Městem Davidovým na jedné straně a Olivovou horou na druhé. Hebrejština je nazývá nachal, koryto bystřiny, které teče jen po vydatném dešti. Začíná severně od Starého Města, prohlubuje se kolem chrámu a pramene Gichón na jeho západním svahu, přijímá údolí Tyropoeon a Hinómovo údolí pod Siloe a pokračuje jako Wádí en-Nar Judskou pouští k Mrtvému moři. Staletí sutin zvedla jeho dno u chrámu o mnoho metrů. Na východní straně stojí skalní památky z doby hasmonejské a herodovské, takzvané hroby Abšalomův a Zacharjášův a hrob kněžského rodu Chezírova, a nad ním vesnice Silwan s hroby z doby království Juda."
    - "David, prchaje před Abšalomem, „přešel král potok Cedron“ k poušti a Šalomoun zakázal Šimeimu přejít jej pod trestem smrti. Reformující králové do něj házeli, co vyklidili z chrámu: Asa spálil modlu své matky „při potoku Cedron“; Chizkijášovi levité vynesli nečistotu z domu „ku potoku Cedron“ a oltáře města byly do něj vmeteny při jeho pesachu; Jošijáš spálil nádoby Baalovy „na poli Cedron“, rozetřel Ašeru na prach u potoka a vsypal do něj prach Manasesových oltářů. Nehemjáš jel v noci „podlé potoka“ ohledat zbořenou zeď a Jeremjáš slibuje, že „všecko to pole až ku potoku Cedron“ bude posvěceno Hospodinu."
    - "Po poslední večeři Ježíš „vyšel s učedlníky svými přes potok Cedron, kdež byla zahrada“, Getsemane na protějším svahu. Josephus líčí závratnou hloubku údolí pod sloupořadími chrámu. Protože je Židé, křesťané i muslimové pokládali za Joelovo „údolí Jozafat“, kde Bůh bude soudit národy, pokryly hroby oba jeho svahy; na jeho počátku označují byzantská kobka a kostel ze 12. století Hrob Panny Marie. Hluboko v údolí, v poušti, založil roku 483 Sabas svou velkou lauru, Mar Saba."
    - "Dnes údolí odděluje Staré Město a vykopávky Města Davidova od Silwanu a vesnic na Olivové hoře; po jeho dně vede silnice kolem pramene Gichón. Velká část městských odpadních vod stále teče jím k Mrtvému moři a za vlhkých zim Kidron zaplavuje."
  sv:
    - "Kidron är dalen på Jerusalems östra sida, mellan Tempelberget och Davids stad å ena sidan och Olivberget å den andra. Hebreiskan kallar den en nahal, en flodbädd som bara för vatten efter kraftigt regn. Den börjar norr om Gamla staden, fördjupas när den passerar templet och Gihonkällan på dess västra sluttning, tar upp Tyropoeon och Hinnoms dal nedanför Siloa, och fortsätter som Wadi en-Nar genom Juda öken till Döda havet. Sekler av byggnadsrester har höjt dess botten med många meter intill templet. På dess östra sida står klippgravar från den hasmoneiska och herodianska tiden, de så kallade Absaloms och Sakarjas gravar och graven för prästsläkten Hesir, och ovanför den ligger byn Silwan med gravar från kungariket Juda."
    - "David, som flydde undan Absalom, ”gick över bäcken Kidron” mot öknen, och Salomo förbjöd Shimi att gå över den vid dödsstraff. De reformerande konungarna kastade i den vad de rensade ut ur templet: Asa brände sin moders avgud ”i Kidrons dal”; Hiskias leviter bar orenheten från huset ”i Kidrons dal” och stadens altaren kastades dit vid hans påsk; Josia brände Baals kärl ”på Kidrons fält”, malde Asheran till stoft vid bäcken och kastade stoftet av Manasses altaren i den. Nehemja färdades om natten ”uppför dalen” för att besiktiga den förfallna muren, och Jeremia lovar att ”alla fälten intill bäcken Kidron” skall vara helgade åt HERREN."
    - "Efter den sista måltiden begav sig Jesus ”med sina lärjungar därifrån och gick över bäcken Kidron till andra sidan. Där var en örtagård”, Getsemane på den motsatta sluttningen. Josefus beskriver dalens svindlande djup nedanför templets pelargångar. Sedan judar, kristna och muslimer har hållit den för Joels ”Josafats dal”, där Gud skall döma folken, har gravar täckt båda dess sluttningar; vid dess början markerar den bysantinska kryptan och en kyrka från 1100-talet Jungfru Marias grav. Långt ned i wadin, i öknen, grundade Sabas sin stora lavra, Mar Saba, år 483."
    - "I dag skiljer dalen Gamla staden och utgrävningarna i Davids stad från Silwan och byarna på Olivberget; en väg löper längs dess botten förbi Gihonkällan. Mycket av stadens avloppsvatten rinner fortfarande ned genom den mot Döda havet, och under regniga vintrar översvämmas Kidron."
