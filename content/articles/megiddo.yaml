body:
  en:
    - "Megiddo stands on a mound at the western edge of the Jezreel Valley, where the pass of Wadi Ara comes through the Carmel ridge, and it guarded the main road between Egypt and Syria. About 3000 BC a monumental temple already stood here. In the fifteenth century BC Thutmose III of Egypt routed a coalition of Canaanite kings before its walls and took the city after a siege; his annals at Karnak call its capture the capture of a thousand cities. In the Amarna letters of the fourteenth century BC its ruler Biridiya asks Pharaoh for troops, as Labayu means to take Megiddo."
    - 'Joshua lists the king of Megiddo among the kings Israel defeated, yet Manasseh did not drive out the Canaanites of the town. The Song of Deborah tells of the kings of Canaan fighting in Taanach "by the waters of Megiddo". Megiddo belonged to one of Solomon''s districts, and 1 Kings names it with Hazor and Gezer among the cities he built. Ahaziah, king of Judah, fled from Jehu to Megiddo and died there; Pharaoh Necho slew King Josiah at Megiddo in 609 BC. Zechariah speaks of mourning in the valley of Megiddon, and the Armageddon of Revelation is usually explained as "mount of Megiddo".'
    - "Iron Age Megiddo had palaces, a six-chambered gate, long pillared buildings once taken for Solomon's stables, and a shaft and tunnel to its spring. Whether the gate and palaces belong to Solomon's tenth century or to the ninth century of Ahab's dynasty is one of the main disputes of biblical archaeology. A fragment of a victory stela of Pharaoh Shishak was found on the mound. After 732 BC Megiddo was the seat of an Assyrian province; later the town dwindled, and the mound was abandoned about the fourth century BC."
    - "In the second century AD the Roman Sixth Legion, Ferrata, set up its camp south of the mound, at a place called Legio beside the village of Kefar Othnay; Eusebius measures distances in the Great Plain from Legio. In the village a Christian prayer hall with mosaic inscriptions was found, dated by its excavators to the third century AD and by others to the early fourth. In the fourth and fifth centuries a city named Maximianopolis stood nearby; its exact site is debated."
  ru:
    - "Мегиддон стоит на холме у западного края Изреельской долины, там, где проход Вади-Ара пересекает хребет Кармил, и охранял главную дорогу между Египтом и Сирией. Уже около 3000 г. до н. э. здесь стоял монументальный храм. В XV веке до н. э. египетский фараон Тутмос III разбил под его стенами союз ханаанских царей и после осады взял город; в его анналах в Карнаке взятие Мегиддона названо взятием тысячи городов. В амарнских письмах XIV века до н. э. его правитель Биридия просит у фараона войско, потому что Лабайу хочет захватить Мегиддон."
    - "Книга Иисуса Навина называет царя Мегиддона среди побеждённых Израилем царей, но Манассия не выгнал хананеев из этого города. Песнь Деворы говорит, что цари Ханаанские сразились в Фаанахе «у вод Мегиддонских». Мегиддон входил в один из округов Соломона, и Третья книга Царств называет его вместе с Асором и Газером среди городов, которые он построил. Охозия, царь Иудейский, бежал от Ииуя в Мегиддон и умер там; в 609 г. до н. э. фараон Нехао умертвил в Мегиддоне царя Иосию. Захария говорит о плаче в долине Мегиддонской, а Армагеддон из Откровения обычно объясняют как «гора Мегиддо»."
    - "В Мегиддоне железного века были дворцы, шестикамерные ворота, длинные здания с колоннами, которые прежде считали конюшнями Соломона, а также шахта и туннель к источнику. Относятся ли ворота и дворцы к X веку Соломона или к IX веку династии Ахава — один из главных споров библейской археологии. На холме нашли обломок победной стелы фараона Сусакима. После 732 г. до н. э. Мегиддон был центром ассирийской провинции; позже город пришёл в упадок, и около IV века до н. э. холм опустел."
    - "Во II веке н. э. римский Шестой легион Железный поставил свой лагерь к югу от холма, в месте, называемом Легион, рядом с селением Кфар-Отнай; Евсевий отмеряет от Легиона расстояния на Великой равнине. В селении нашли христианский молитвенный зал с мозаичными надписями: раскопщики датируют его III веком н. э., другие — началом IV века. В IV–V веках рядом стоял город Максимианополь; где именно, спорят."
  uk:
    - "Мегіддо стоїть на пагорбі на західному краю Їзреельської долини, де прохід Ваді-Ара проходить крізь хребет Кармеля, і охороняв головну дорогу між Єгиптом і Сирією. Близько 3000 р. до н. е. тут уже стояв монументальний храм. У XV ст. до н. е. Тутмос III Єгипетський розбив під його мурами коаліцію ханаанських царів і взяв місто після облоги; його аннали в Карнаку називають його здобуття здобуттям тисячі міст. В амарнських листах XIV ст. до н. е. його правитель Бірідія просить у фараона війська, бо Лабайю має намір узяти Мегіддо."
    - "Ісус Навин зараховує царя Мегіддо до царів, яких переміг Ізраїль, але Манасія не прогнав ханаанеян міста. Пісня Дебори розповідає, як царі Ханаану билися «в Танаах у вод Мегидонських». Мегіддо належало до одного з округів Соломона, а Книга Царів називає його разом з Гацором і Гезером серед міст, які він збудував. Охозія, цар Юди, втік від Єгу до Мегіддо й помер там; фараон Нехо вбив царя Йосію в Мегіддо 609 р. до н. е. Захарія говорить про плач «на Мегиддо-долинї», а Армагеддон Одкровення зазвичай пояснюють як «гора Мегіддо»."
    - "Мегіддо залізної доби мало палаци, шестикамерну браму, довгі стовпові будівлі, колись прийняті за стайні Соломона, і шахту з тунелем до джерела. Чи належать брама й палаци Соломоновому X ст., чи IX ст. династії Ахава, — одна з головних суперечок біблійної археології. На пагорбі знайшли уламок переможної стели фараона Сусакіма. Після 732 р. до н. е. Мегіддо було осідком ассирійської провінції; пізніше місто занепало, і пагорб покинули близько IV ст. до н. е."
    - "У II ст. н. е. римський VI Залізний легіон (Ferrata) розташував свій табір на південь від пагорба, у місці під назвою Легіо біля села Кфар-Отнай; Євсевій міряє відстані у Великій рівнині від Легіо. У селі знайшли християнську молитовну залу з мозаїчними написами, яку розкопувачі датують III ст. н. е., а інші — початком IV ст. У IV–V ст. поблизу стояло місто Максиміанополь; його точне місце спірне."
  es:
    - "Meguido se alza sobre un montículo en el borde occidental del valle de Jezreel, donde el paso del Wadi Ara atraviesa la cresta del Carmel, y guardaba el camino principal entre Egipto y Siria. Hacia 3000 a. C. ya se alzaba aquí un templo monumental. En el siglo XV a. C. Tutmosis III de Egipto derrotó ante sus muros a una coalición de reyes cananeos y tomó la ciudad tras un asedio; sus anales en Karnak llaman a su captura la captura de mil ciudades. En las cartas de Amarna del siglo XIV a. C., su gobernante Biridiya pide tropas al faraón, pues Labayu pretende tomar Meguido."
    - "Josué enumera al rey de Meguido entre los reyes que Israel derrotó, pero Manasés no expulsó a los cananeos de la ciudad. El cántico de Débora cuenta que los reyes de Canaán pelearon en Taanac «junto á las aguas de Megiddo». Meguido pertenecía a uno de los distritos de Salomón, y 1 Reyes la nombra con Hazor y Gezer entre las ciudades que edificó. Ocozías, rey de Judá, huyó de Jehú a Meguido y murió allí; el faraón Necao mató al rey Josías en Meguido en 609 a. C. Zacarías habla de llanto en «el valle de Megiddo», y el Armagedón del Apocalipsis suele explicarse como «monte de Meguido»."
    - "La Meguido de la Edad del Hierro tuvo palacios, una puerta de seis cámaras, largos edificios con pilares que antes se tomaron por las caballerizas de Salomón, y un pozo y un túnel hasta su manantial. Si la puerta y los palacios pertenecen al siglo X de Salomón o al siglo IX de la dinastía de Acab es una de las principales disputas de la arqueología bíblica. En el montículo se halló un fragmento de una estela de victoria del faraón Sisac. Después de 732 a. C. Meguido fue sede de una provincia asiria; más tarde la ciudad decayó, y el montículo fue abandonado hacia el siglo IV a. C."
    - "En el siglo II d. C. la Sexta Legión romana, Ferrata, estableció su campamento al sur del montículo, en un lugar llamado Legio, junto a la aldea de Kefar Othnay; Eusebio mide las distancias en la Gran Llanura desde Legio. En la aldea se halló una sala de oración cristiana con inscripciones en mosaico, fechada por sus excavadores en el siglo III d. C. y por otros a comienzos del IV. En los siglos IV y V se alzaba cerca una ciudad llamada Maximianópolis; su emplazamiento exacto se discute."
  pt:
    - "Megido ergue-se num montículo na borda ocidental do vale de Jezreel, onde a passagem do Wadi Ara atravessa a cordilheira do Carmelo, e guardava a principal estrada entre o Egito e a Síria. Por volta de 3000 a.C. já havia ali um templo monumental. No século XV a.C., Tutmés III do Egito derrotou uma coalizão de reis cananeus diante de suas muralhas e tomou a cidade após um cerco; seus anais em Karnak chamam a sua captura a captura de mil cidades. Nas cartas de Amarna do século XIV a.C., seu governante Biridiya pede tropas ao faraó, pois Labayu pretende tomar Megido."
    - "Josué lista o rei de Megido entre os reis que Israel derrotou, mas Manassés não expulsou os cananeus da cidade. O Cântico de Débora conta os reis de Canaã lutando em Taanaque “junto às águas de Megido”. Megido pertencia a um dos distritos de Salomão, e 1 Reis a nomeia com Hazor e Gezer entre as cidades que ele construiu. Acazias, rei de Judá, fugiu de Jeú para Megido e morreu ali; o faraó Neco matou o rei Josias em Megido em 609 a.C. Zacarias fala de pranto no vale de Megido, e o Armagedom do Apocalipse costuma ser explicado como “monte de Megido”."
    - "A Megido da Idade do Ferro tinha palácios, um portão de seis câmaras, longos edifícios de pilares outrora tomados por estábulos de Salomão, e um poço e túnel até sua fonte. Se o portão e os palácios pertencem ao século X de Salomão ou ao século IX da dinastia de Acabe é uma das principais disputas da arqueologia bíblica. Um fragmento de uma estela de vitória do faraó Sisaque foi achado no montículo. Depois de 732 a.C., Megido foi sede de uma província assíria; mais tarde a cidade minguou, e o montículo foi abandonado por volta do século IV a.C."
    - "No século II d.C., a Sexta Legião romana, Ferrata, montou seu acampamento ao sul do montículo, num lugar chamado Legio, junto à aldeia de Kefar Otnay; Eusébio mede as distâncias na Grande Planície a partir de Legio. Na aldeia foi encontrada uma sala de oração cristã com inscrições em mosaico, datada por seus escavadores do século III d.C. e por outros do início do IV. Nos séculos IV e V uma cidade chamada Maximianópolis ficava nas proximidades; seu sítio exato é debatido."
  de:
    - "Megiddo liegt auf einem Hügel am Westrand der Jesreelebene, wo der Pass des Wadi Ara durch den Karmelrücken kommt, und bewachte die Hauptstraße zwischen Ägypten und Syrien. Um 3000 v. Chr. stand hier schon ein monumentaler Tempel. Im 15. Jahrhundert v. Chr. schlug Thutmosis III. von Ägypten vor seinen Mauern eine Koalition kanaanäischer Könige und nahm die Stadt nach einer Belagerung ein; seine Annalen in Karnak nennen ihre Einnahme die Einnahme von tausend Städten. In den Amarna-Briefen des 14. Jahrhunderts v. Chr. bittet ihr Herrscher Biridija den Pharao um Truppen, da Labaju Megiddo nehmen will."
    - "Josua zählt den König von Megiddo unter den von Israel besiegten Königen auf, doch Manasse vertrieb die Kanaaniter der Stadt nicht. Das Lied der Debora erzählt von den Königen Kanaans, die „zu Thaanach am Wasser Megiddos“ stritten. Megiddo gehörte zu einem der Bezirke Salomos, und 1. Könige nennt es mit Hazor und Geser unter den Städten, die er baute. Ahasja, der König von Juda, floh vor Jehu nach Megiddo und starb dort; Pharao Necho erschlug König Josia 609 v. Chr. bei Megiddo. Sacharja spricht von Klage „im Felde Megiddos“, und das Harmagedon der Offenbarung wird meist als „Berg von Megiddo“ erklärt."
    - "Das eisenzeitliche Megiddo hatte Paläste, ein Sechskammertor, lange Pfeilerbauten, die man einst für Salomos Ställe hielt, und einen Schacht und Tunnel zu seiner Quelle. Ob Tor und Paläste in Salomos 10. Jahrhundert oder ins 9. Jahrhundert der Dynastie Ahabs gehören, ist einer der Hauptstreitpunkte der biblischen Archäologie. Ein Fragment einer Siegesstele des Pharao Schischak wurde auf dem Hügel gefunden. Nach 732 v. Chr. war Megiddo Sitz einer assyrischen Provinz; später schrumpfte die Stadt, und der Hügel wurde um das 4. Jahrhundert v. Chr. aufgegeben."
    - "Im 2. Jahrhundert n. Chr. schlug die römische VI. Legion, Ferrata, ihr Lager südlich des Hügels auf, an einem Ort namens Legio bei dem Dorf Kefar Othnay; Eusebius misst Entfernungen in der Großen Ebene von Legio aus. Im Dorf wurde ein christlicher Betsaal mit Mosaikinschriften gefunden, von den Ausgräbern ins 3. Jahrhundert n. Chr. datiert, von anderen in den frühen 4. Im 4. und 5. Jahrhundert stand in der Nähe eine Stadt namens Maximianopolis; ihre genaue Lage ist umstritten."
  fr:
    - "Meguiddo se dresse sur un tertre à la bordure occidentale de la vallée de Jizreel, là où le passage de l’ouadi Ara traverse la crête du Carmel, et gardait la grande route entre l’Égypte et la Syrie. Vers 3000 av. J.-C., un temple monumental s’y dressait déjà. Au XVe siècle av. J.-C., Thoutmosis III d’Égypte mit en déroute devant ses murs une coalition de rois cananéens et prit la ville après un siège ; ses annales de Karnak appellent sa prise la prise de mille villes. Dans les lettres d’Amarna du XIVe siècle av. J.-C., son souverain Biridiya demande des troupes au pharaon, car Labayou veut prendre Meguiddo."
    - "Josué compte le roi de Meguiddo parmi les rois qu’Israël vainquit, mais Manassé ne chassa pas les Cananéens de la ville. Le Cantique de Débora raconte que les rois de Canaan combattirent « à Thaanac, aux eaux de Meguiddo ». Meguiddo appartenait à l’un des districts de Salomon, et 1 Rois la nomme avec Hatsor et Guézer parmi les villes qu’il bâtit. Achazia, roi de Juda, s’enfuit devant Jéhu à Meguiddo et y mourut ; Pharaon Néco tua le roi Josias à Meguiddo en 609 av. J.-C. Zacharie parle d’un deuil dans la vallée de Meguiddon, et l’Armageddon de l’Apocalypse s’explique d’ordinaire par « mont de Meguiddo »."
    - "Meguiddo de l’âge du Fer avait des palais, une porte à six chambres, de longs bâtiments à piliers pris autrefois pour les écuries de Salomon, et un puits et un tunnel menant à sa source. Savoir si la porte et les palais appartiennent au Xe siècle de Salomon ou au IXe siècle de la dynastie d’Achab est l’une des principales controverses de l’archéologie biblique. Un fragment de stèle de victoire du pharaon Schischak a été trouvé sur le tertre. Après 732 av. J.-C., Meguiddo fut le siège d’une province assyrienne ; plus tard la ville déclina, et le tertre fut abandonné vers le IVe siècle av. J.-C."
    - "Au IIe siècle apr. J.-C., la Sixième légion romaine, Ferrata, établit son camp au sud du tertre, en un lieu appelé Legio, près du village de Kefar Othnay ; Eusèbe mesure les distances dans la Grande Plaine à partir de Legio. Dans le village, on a trouvé une salle de prière chrétienne aux inscriptions de mosaïque, datée par ses fouilleurs du IIIe siècle apr. J.-C. et par d’autres du début du IVe. Aux IVe et Ve siècles, une ville nommée Maximianopolis se dressait à proximité ; son emplacement exact est débattu."
  it:
    - "Meghiddo sorge su un tell al margine occidentale della valle di Izreel, dove il passo del Wadi Ara attraversa la dorsale del Carmelo, e sorvegliava la grande strada tra l’Egitto e la Siria. Già verso il 3000 a.C. vi sorgeva un tempio monumentale. Nel XV secolo a.C. Tutmosi III d’Egitto mise in rotta davanti alle sue mura una coalizione di re cananei e prese la città dopo un assedio; i suoi annali a Karnak chiamano la sua conquista la conquista di mille città. Nelle lettere di Amarna del XIV secolo a.C. il suo sovrano Biridiya chiede truppe al faraone, perché Labayu intende prendere Meghiddo."
    - "Giosuè elenca il re di Meghiddo tra i re sconfitti da Israele, ma Manasse non cacciò i Cananei della città. Il Cantico di Debora narra dei re di Canaan che combatterono a Taanach «presso le acque di Meghiddo». Meghiddo apparteneva a uno dei distretti di Salomone, e il primo libro dei Re la nomina con Asor e Ghezer tra le città da lui costruite. Acazia, re di Giuda, fuggì da Ieu a Meghiddo e vi morì; il faraone Neco uccise il re Giosia a Meghiddo nel 609 a.C. Zaccaria parla di un lutto «nella valle di Meghiddon», e l’Armaghedon dell’Apocalisse è di solito spiegato come «monte di Meghiddo»."
    - "Meghiddo dell’età del Ferro ebbe palazzi, una porta a sei camere, lunghi edifici a pilastri un tempo ritenuti le scuderie di Salomone, e un pozzo con galleria fino alla sorgente. Se la porta e i palazzi appartengano al X secolo di Salomone o al IX secolo della dinastia di Acab è una delle principali dispute dell’archeologia biblica. Un frammento di una stele di vittoria del faraone Sisak è stato trovato sul tell. Dopo il 732 a.C. Meghiddo fu sede di una provincia assira; più tardi la città si ridusse, e il tell fu abbandonato verso il IV secolo a.C."
    - "Nel II secolo d.C. la Legio VI Ferrata romana pose il suo campo a sud del tell, in un luogo chiamato Legio presso il villaggio di Kefar Othnay; Eusebio misura le distanze nella Grande Pianura a partire da Legio. Nel villaggio è stata trovata una sala di preghiera cristiana con iscrizioni a mosaico, datata dagli scavatori al III secolo d.C. e da altri all’inizio del IV. Nel IV e V secolo sorgeva nelle vicinanze una città chiamata Massimianopoli; la sua esatta ubicazione è discussa."
  pl:
    - "Megiddo stoi na kopcu na zachodnim skraju doliny Jizreel, gdzie przełęcz Wadi Ara przechodzi przez grzbiet Karmelu, i strzegło głównej drogi między Egiptem a Syrią. Około 3000 r. p.n.e. stała tu już monumentalna świątynia. W XV w. p.n.e. Totmes III Egipski rozgromił pod jego murami koalicję kananejskich królów i po oblężeniu zdobył miasto; jego annały w Karnaku nazywają jego zdobycie zdobyciem tysiąca miast. W listach z Amarna z XIV w. p.n.e. jego władca Biridija prosi faraona o wojska, bo Labaju zamierza zająć Megiddo."
    - "Jozue wymienia króla Megiddo wśród królów pobitych przez Izraela, ale Manasses nie wypędził Kananejczyków z miasta. Pieśń Debory opowiada o królach Kanaanu walczących w Taanak „u wód Magieddo”. Megiddo należało do jednego z okręgów Salomona, a 1 Księga Królewska wymienia je z Chasorem i Gezerem wśród miast, które zbudował. Ochozjasz, król Judy, uciekł przed Jehu do Megiddo i tam umarł; faraon Necho zabił króla Jozjasza w Megiddo w 609 r. p.n.e. Zachariasz mówi o żałobie w dolinie Megiddon, a Armagedon z Apokalipsy zwykle wyjaśnia się jako „góra Megiddo”."
    - "Megiddo z epoki żelaza miało pałace, sześciokomorową bramę, długie budynki filarowe, niegdyś brane za stajnie Salomona, oraz szyb i tunel do źródła. Czy brama i pałace należą do X w. Salomona, czy do IX w. dynastii Achaba, to jeden z głównych sporów archeologii biblijnej. Na kopcu znaleziono fragment steli zwycięstwa faraona Sziszaka. Po 732 r. p.n.e. Megiddo było siedzibą asyryjskiej prowincji; później miasto podupadło, a kopiec opuszczono około IV w. p.n.e."
    - "W II w. n.e. rzymska VI Legia Żelazna (Ferrata) rozbiła obóz na południe od kopca, w miejscu zwanym Legio obok wsi Kefar Otnaj; Euzebiusz mierzy odległości na Wielkiej Równinie od Legio. We wsi znaleziono chrześcijańską salę modlitewną z napisami mozaikowymi, datowaną przez odkrywców na III w. n.e., a przez innych na początek IV. W IV i V w. w pobliżu stało miasto o nazwie Maksymianopolis; jego dokładne położenie jest sporne."
  nl:
    - "Megiddo ligt op een heuvel aan de westrand van de Jizreëlvallei, waar de pas van Wadi Ara door de Karmelrug komt, en bewaakte de hoofdweg tussen Egypte en Syrië. Omstreeks 3000 v.Chr. stond hier al een monumentale tempel. In de vijftiende eeuw v.Chr. versloeg Thoetmosis III van Egypte voor zijn muren een coalitie van Kanaänitische koningen en nam de stad na een beleg in; zijn annalen in Karnak noemen haar inname de inname van duizend steden. In de Amarnabrieven van de veertiende eeuw v.Chr. vraagt haar heerser Biridiya de farao om troepen, omdat Labayu Megiddo wil innemen."
    - "Jozua noemt de koning van Megiddo onder de koningen die Israël versloeg, maar Manasse verdreef de Kanaänieten van de stad niet. Het lied van Debora vertelt van de koningen van Kanaän die streden “te Thaanach aan de wateren van Megiddo”. Megiddo behoorde tot een van Salomo's districten, en 1 Koningen noemt het met Hazor en Gezer onder de steden die hij bouwde. Achazia, koning van Juda, vluchtte voor Jehu naar Megiddo en stierf daar; farao Necho doodde koning Josia in 609 v.Chr. bij Megiddo. Zacharia spreekt van rouw in het dal van Megiddon, en het Armageddon van Openbaring wordt gewoonlijk verklaard als “berg van Megiddo”."
    - "Megiddo uit de ijzertijd had paleizen, een poort met zes kamers, lange pilaargebouwen die ooit voor Salomo's stallen werden gehouden, en een schacht en tunnel naar zijn bron. Of de poort en paleizen horen bij Salomo's tiende eeuw of bij de negende eeuw van Achabs dynastie is een van de belangrijkste geschillen van de bijbelse archeologie. Een fragment van een overwinningsstèle van farao Sisak werd op de heuvel gevonden. Na 732 v.Chr. was Megiddo de zetel van een Assyrische provincie; later liep de stad terug, en de heuvel werd omstreeks de vierde eeuw v.Chr. verlaten."
    - "In de tweede eeuw n.Chr. sloeg het Romeinse Zesde Legioen, Ferrata, zijn kamp op ten zuiden van de heuvel, op een plaats genaamd Legio naast het dorp Kefar Othnay; Eusebius meet afstanden in de Grote Vlakte vanaf Legio. In het dorp werd een christelijke gebedsruimte met mozaïekinscripties gevonden, door de opgravers gedateerd in de derde eeuw n.Chr. en door anderen in het begin van de vierde. In de vierde en vijfde eeuw lag in de buurt een stad genaamd Maximianopolis; haar exacte ligging wordt betwist."
  cs:
    - "Megido stojí na pahorku na západním okraji Jizreelského údolí, kde průsmyk Wádí Ara prochází hřebenem Karmelu, a střežilo hlavní cestu mezi Egyptem a Sýrií. Kolem roku 3000 př. n. l. tu už stál monumentální chrám. V 15. století př. n. l. rozprášil Thutmose III. Egyptský před jeho hradbami koalici kanaánských králů a po obléhání město dobyl; jeho anály v Karnaku nazývají jeho dobytí dobytím tisíce měst. V amarnských dopisech ze 14. století př. n. l. žádá jeho vládce Biridija faraona o vojsko, protože Labaju hodlá Megido vzít."
    - "Jozue uvádí krále Megida mezi krále, které Izrael porazil, Manases však kanaánské obyvatele města nevyhnal. Píseň Debořina vypráví o králích kanaánských, kteří bojovali v Taanachu „při vodách Mageddo“. Megido patřilo k jednomu ze Šalomounových okresů a První kniha Královská je jmenuje s Chacorem a Gezerem mezi městy, která vystavěl. Achazjáš, král Judský, utekl před Jehúem do Megida a tam zemřel; farao Nekó zabil krále Jošijáše u Megida roku 609 př. n. l. Zacharjáš mluví o nářku v údolí Megidon a Armagedon ze Zjevení se obvykle vykládá jako „hora Megido“."
    - "Megido z doby železné mělo paláce, bránu o šesti komorách, dlouhé sloupové budovy kdysi pokládané za Šalomounovy stáje a šachtu s tunelem k prameni. Zda brána a paláce patří do Šalomounova 10. století, nebo do 9. století Achabovy dynastie, je jedním z hlavních sporů biblické archeologie. Na pahorku byl nalezen zlomek vítězné stély faraona Šíšaka. Po roce 732 př. n. l. bylo Megido sídlem asyrské provincie; později město upadalo a pahorek byl opuštěn kolem 4. století př. n. l."
    - "Ve 2. století n. l. zřídila římská Šestá legie Ferrata svůj tábor jižně od pahorku, na místě zvaném Legio u vesnice Kefar Othnay; Eusebius měří vzdálenosti ve Velké rovině od Legia. Ve vesnici byla nalezena křesťanská modlitebna s mozaikovými nápisy, datovaná vykopávači do 3. století n. l. a jinými do počátku 4. století. Ve 4. a 5. století stálo poblíž město jménem Maximianopolis; jeho přesná poloha je sporná."
  sv:
    - "Megiddo ligger på en kulle vid Jisreeldalens västra kant, där passet Wadi Ara går genom Karmelåsen, och bevakade huvudvägen mellan Egypten och Syrien. Omkring 3000 f.Kr. stod redan ett monumentalt tempel här. På 1400-talet f.Kr. slog Thutmosis III av Egypten en koalition av kanaaneiska kungar framför dess murar och intog staden efter en belägring; hans annaler i Karnak kallar dess intagande intagandet av tusen städer. I Amarnabreven från 1300-talet f.Kr. ber dess härskare Biridiya farao om trupper, eftersom Labayu tänker inta Megiddo."
    - "Josua förtecknar Megiddos konung bland de konungar Israel besegrade, men Manasse fördrev inte kanaaneerna i staden. Deboras sång berättar om Kanaans konungar som stred i Taanak ”invid Megiddos vatten”. Megiddo hörde till ett av Salomos distrikt, och Första Konungaboken nämner den med Hasor och Geser bland de städer han byggde. Achasja, kung av Juda, flydde från Jehu till Megiddo och dog där; farao Neko dräpte kung Josia vid Megiddo 609 f.Kr. Sakarja talar om sorg på Megiddons slätt, och Uppenbarelsebokens Harmagedon förklaras vanligen som ”Megiddos berg”."
    - "Megiddo från järnåldern hade palats, en port med sex kamrar, långa pelarbyggnader som en gång togs för Salomos stall, och en schaktgång och en tunnel till sin källa. Om porten och palatsen hör till Salomos 900-tal eller till Achavs dynastis 800-tal är en av den bibliska arkeologins huvudstridsfrågor. Ett fragment av farao Shishaks segerstele hittades på kullen. Efter 732 f.Kr. var Megiddo säte för en assyrisk provins; senare krympte staden, och kullen övergavs omkring 300-talet f.Kr."
    - "På 100-talet e.Kr. slog den romerska sjätte legionen, Ferrata, läger söder om kullen, på en plats kallad Legio vid byn Kefar Othnay; Eusebios mäter avstånd på Stora slätten från Legio. I byn hittades en kristen bönesal med mosaikinskrifter, daterad av utgrävarna till 200-talet e.Kr. och av andra till tidiga 300-talet. På 300- och 400-talen låg en stad vid namn Maximianopolis i närheten; dess exakta läge är omdebatterat."
  nb:
    - "Megiddo ligger på en haug i den vestlige kanten av Jisreel-dalen, der passet Wadi Ara kommer gjennom Karmel-ryggen, og vernet hovedveien mellom Egypt og Syria. Omkring 3000 f.Kr. sto allerede et monumentalt tempel her. På 1400-tallet f.Kr. slo Thutmosis III av Egypt en koalisjon av kanaanittiske konger foran murene og tok byen etter en beleiring; hans annaler i Karnak kaller erobringen av den inntakelsen av tusen byer. I Amarna-brevene fra 1300-tallet f.Kr. ber dens hersker Biridiya farao om tropper, da Labayu har til hensikt å ta Megiddo."
    - "Josva oppfører kongen av Megiddo blant kongene Israel beseiret, men Manasse drev likevel ikke ut kanaanittene i byen. Deboras sang forteller om Kanaans konger som kjempet i Taanak «ved Megiddos vann». Megiddo hørte til et av Salomos distrikter, og Første Kongebok nevner den sammen med Hasor og Geser blant byene han bygde. Ahasja, konge av Juda, flyktet fra Jehu til Megiddo og døde der; farao Neko drepte kong Josjia ved Megiddo i 609 f.Kr. Sakarja taler om sorg i «Megiddons dal», og Åpenbaringens Harmageddon forklares vanligvis som «Megiddos fjell»."
    - "Megiddo i jernalderen hadde palasser, en port med seks kamre, lange søylebygninger som en gang ble tatt for Salomos staller, og en sjakt og tunnel til kilden. Om porten og palassene hører til Salomos 900-tall f.Kr. eller til 800-tallet f.Kr. under Ahabs dynasti, er en av de viktigste striddene i bibelsk arkeologi. Et fragment av en seiersstele av farao Sjisjak ble funnet på haugen. Etter 732 f.Kr. var Megiddo sete for en assyrisk provins; senere minket byen, og haugen ble forlatt omkring 300-tallet f.Kr."
    - "På 100-tallet e.Kr. slo den romerske sjette legion, Ferrata, leir sør for haugen, på et sted kalt Legio ved landsbyen Kefar Othnay; Eusebius måler avstander i Den store sletten fra Legio. I landsbyen ble det funnet en kristen bønnesal med mosaikkinnskrifter, datert av utgraverne til 200-tallet e.Kr. og av andre til tidlig 300-tall. På 300- og 400-tallet lå en by kalt Maximianopolis i nærheten; dens eksakte sted er omdiskutert."
