body:
  en:
    - "Anaharath was a town of Issachar in eastern Lower Galilee. Yohanan Aharoni identified it with Tel Rekhesh (Arabic Tell el-Mekurkush), a mound in the deep gorge of Nahal Tabor about 9 km south-east of Mount Tabor; the Japanese team that later excavated the site came to the same conclusion. In the Bible it appears once, in Issachar's list of towns: “And Hapharaim, and Shion, and Anaharath”."
    - "Anaharath is a Canaanite city of the Egyptian records: it is listed among the towns Thutmose III took on his first campaign, and Amenhotep II plundered it on his second Asiatic campaign. A team led by Yitzhak Paz with Shuichi Hasegawa of Rikkyo University and Japanese colleagues excavated Tel Rekhesh in 2006–2010, 2013–2017 and 2019. Besides the Bronze and Iron Age town, they found a Jewish estate of the first and second centuries AD with an assembly room lined with stone benches, which the excavators suggest may have been a synagogue."
  ru:
    - "Анахараф — город Иссахара в восточной части Нижней Галилеи. Йоханан Ахарони отождествил его с Тель-Рехешем (арабское Телль-эль-Мекуркуш), холмом в глубоком ущелье Нахаль-Тавора примерно в 9 км к юго-востоку от горы Фавор; японская экспедиция, позднее раскапывавшая холм, пришла к тому же выводу. В Библии он упомянут один раз, в списке городов Иссахара: «Хафараим, Шион и Анахараф»."
    - "Анахараф — ханаанский город египетских записей: он назван среди городов, взятых Тутмосом III в первом походе, и Аменхотеп II разграбил его во втором азиатском походе. Экспедиция под руководством Ицхака Паза с Сюити Хасэгавой из Университета Риккё и японскими коллегами раскапывала Тель-Рехеш в 2006–2010, 2013–2017 и 2019 гг. Кроме города бронзового и железного веков, они нашли иудейскую усадьбу I–II вв. н. э. с залом собраний, вдоль стен которого шли каменные скамьи; археологи полагают, что это могла быть синагога."
  uk:
    - "Анахарат був містом Іссахара у східній Нижній Галілеї. Йохонан Ахарон ототожнив його з Тель-Рехеш (арабською Телль-ель-Мекуркуш), пагорбом у глибокій ущелині Нахаль-Табор приблизно за 9 км на південний схід від гори Фавор; японська група, що згодом розкопувала місце, дійшла того самого висновку. У Біблії він з'являється один раз, у переліку міст Іссахара: «Хафараім, Шіон й Анахарат»."
    - "Анахарат — ханаанське місто єгипетських записів: його названо серед міст, які Тутмос III узяв у першому поході, а Аменхотеп II пограбував його під час свого другого азійського походу. Група під керівництвом Іцхака Паза із Сюїті Хасегавою з університету Ріккьо та японськими колегами розкопувала Тель-Рехеш у 2006–2010, 2013–2017 і 2019 рр. Крім міста бронзової та залізної доби, вони знайшли єврейську садибу I–II ст. н. е. із залою зборів, обкладеною кам'яними лавами, яка, на думку розкопувачів, могла бути синагогою."
  es:
    - "Anaharat era una ciudad de Isacar en el este de la Baja Galilea. Yohanan Aharoni la identificó con Tel Rekhesh (en árabe Tell el-Mekurkush), un montículo en la profunda garganta del Nahal Tabor, a unos 9 km al sureste del monte Tabor; el equipo japonés que excavó después el lugar llegó a la misma conclusión. En la Biblia aparece una vez, en la lista de ciudades de Isacar: «Y Hapharaim, y Sión, y Anaarath»."
    - "Anaharat es una ciudad cananea de los registros egipcios: figura entre las ciudades que tomó Tutmosis III en su primera campaña, y Amenhotep II la saqueó en su segunda campaña asiática. Un equipo dirigido por Yitzhak Paz con Shuichi Hasegawa, de la Universidad Rikkyo, y colegas japoneses excavó Tel Rekhesh en 2006–2010, 2013–2017 y 2019. Además de la ciudad de las edades del Bronce y del Hierro, hallaron una hacienda judía de los siglos I y II d. C. con una sala de reunión revestida de bancos de piedra, que según los excavadores pudo ser una sinagoga."
  de:
    - "Anaharat war eine Stadt Issachars im östlichen Untergaliläa. Yohanan Aharoni setzte es mit Tel Rechesch (arabisch Tell el-Mekurkusch) gleich, einem Hügel in der tiefen Schlucht des Nachal Tabor etwa 9 km südöstlich des Berges Tabor; das japanische Team, das die Stätte später ausgrub, kam zum selben Schluss. In der Bibel erscheint es einmal, in Issachars Städteliste: „Hapharaim, Sion, Anaharath“."
    - "Anaharat ist eine kanaanäische Stadt der ägyptischen Quellen: Es steht unter den Städten, die Thutmosis III. auf seinem ersten Feldzug nahm, und Amenophis II. plünderte es auf seinem zweiten asiatischen Feldzug. Ein Team unter Yitzhak Paz mit Shuichi Hasegawa von der Rikkyo-Universität und japanischen Kollegen grub Tel Rechesch 2006–2010, 2013–2017 und 2019 aus. Neben der bronze- und eisenzeitlichen Stadt fanden sie ein jüdisches Gehöft des ersten und zweiten Jahrhunderts n. Chr. mit einem Versammlungsraum, den Steinbänke säumten und der nach Ansicht der Ausgräber eine Synagoge gewesen sein könnte."
  fr:
    - "Anacharath était une ville d’Issacar dans l’est de la Basse Galilée. Yohanan Aharoni l’identifia avec Tel Rekhesh (en arabe Tell el-Mekurkush), une butte dans la profonde gorge du Nahal Thabor, à environ 9 km au sud-est du mont Thabor ; l’équipe japonaise qui fouilla plus tard le site parvint à la même conclusion. Dans la Bible, elle apparaît une fois, dans la liste des villes d’Issacar : « Hapharaïm, Schion, Anacharath »."
    - "Anacharath est une ville cananéenne des sources égyptiennes : elle figure parmi les villes que Thoutmosis III prit lors de sa première campagne, et Aménophis II la pilla lors de sa seconde campagne en Asie. Une équipe dirigée par Yitzhak Paz avec Shuichi Hasegawa de l’université Rikkyo et des collègues japonais fouilla Tel Rekhesh en 2006–2010, 2013–2017 et 2019. Outre la ville de l’âge du Bronze et du Fer, ils trouvèrent un domaine juif des Ier et IIe siècles apr. J.-C. avec une salle d’assemblée bordée de bancs de pierre, qui, suggèrent les fouilleurs, a pu être une synagogue."
  pt:
    - "Anaarate era uma cidade de Issacar, no leste da Baixa Galileia. Yohanan Aharoni a identificou com Tel Rekhesh (em árabe Tell el-Mekurkush), um montículo na profunda garganta do Nahal Tabor, cerca de 9 km a sudeste do monte Tabor; a equipe japonesa que escavou depois o sítio chegou à mesma conclusão. Na Bíblia aparece uma só vez, na lista de cidades de Issacar: “Hafaraim, Siom, Anaharate”."
    - "Anaarate é uma cidade cananeia dos registros egípcios: está listada entre as cidades que Tutmés III tomou em sua primeira campanha, e Amenófis II a saqueou em sua segunda campanha asiática. Uma equipe liderada por Yitzhak Paz, com Shuichi Hasegawa, da Universidade Rikkyo, e colegas japoneses, escavou Tel Rekhesh em 2006–2010, 2013–2017 e 2019. Além da cidade das Idades do Bronze e do Ferro, encontraram uma propriedade judaica dos séculos I e II d.C. com uma sala de reuniões forrada de bancos de pedra, que, segundo os escavadores, pode ter sido uma sinagoga."
  it:
    - "Anacarat era una città di Issacar nella Galilea inferiore orientale. Yohanan Aharoni la identificò con Tel Rekhesh (in arabo Tell el-Mekurkush), un tell nella profonda gola del Nahal Tabor a circa 9 km a sud-est del monte Tabor; la squadra giapponese che scavò poi il sito giunse alla stessa conclusione. Nella Bibbia compare una sola volta, nell’elenco delle città di Issacar: «Hafaraim, Scion, Anaharat»."
    - "Anacarat è una città cananea delle fonti egizie: è elencata tra le città prese da Tutmosi III nella sua prima campagna, e Amenofi II la saccheggiò nella sua seconda campagna asiatica. Una squadra guidata da Yitzhak Paz con Shuichi Hasegawa dell’Università Rikkyo e colleghi giapponesi scavò Tel Rekhesh nel 2006–2010, nel 2013–2017 e nel 2019. Oltre alla città dell’età del Bronzo e del Ferro, trovarono una tenuta ebraica del I e II secolo d.C. con una sala di riunione rivestita di panche di pietra, che secondo gli scavatori potrebbe essere stata una sinagoga."
  nl:
    - "Anacharat was een stad van Issachar in het oostelijke Neder-Galilea. Yohanan Aharoni vereenzelvigde het met Tel Rekhesh (Arabisch Tell el-Mekurkush), een heuvel in de diepe kloof van de beek Tabor ongeveer 9 km ten zuidoosten van de Tabor; het Japanse team dat de plaats later opgroef, kwam tot dezelfde conclusie. In de Bijbel komt het eenmaal voor, in Issachars lijst van steden: “En Hafaraim, en Sion, en Anacharath”."
    - "Anacharat is een Kanaänitische stad in de Egyptische bronnen: zij staat onder de steden die Thoetmosis III op zijn eerste veldtocht innam, en Amenhotep II plunderde haar op zijn tweede Aziatische veldtocht. Een team onder leiding van Yitzhak Paz met Shuichi Hasegawa van de Rikkyo-universiteit en Japanse collega's groef Tel Rekhesh op in 2006–2010, 2013–2017 en 2019. Behalve de stad uit de bronstijd en ijzertijd vonden zij een Joods landgoed uit de eerste en tweede eeuw n.Chr. met een vergaderzaal met stenen banken langs de wanden, die volgens de opgravers een synagoge kan zijn geweest."
  pl:
    - "Anacharat było miastem Issachara we wschodniej Dolnej Galilei. Yohanan Aharoni utożsamił je z Tel Rekhesh (arabskie Tell el-Mekurkusz), wzgórzem w głębokim wąwozie Nachal Tabor około 9 km na południowy wschód od góry Tabor; japoński zespół, który później badał stanowisko, doszedł do tego samego wniosku. W Biblii pojawia się raz, na liście miast Issachara: „I Hafaraim, i Seon, i Anaharat”."
    - "Anacharat jest kananejskim miastem ze źródeł egipskich: figuruje wśród miast zdobytych przez Totmesa III w pierwszej wyprawie, a Amenhotep II złupił je w drugiej wyprawie azjatyckiej. Zespół pod kierunkiem Yitzhaka Paza, z Shuichim Hasegawą z Uniwersytetu Rikkyo i japońskimi kolegami, badał Tel Rekhesh w latach 2006-2010, 2013-2017 i 2019. Oprócz miasta z epoki brązu i żelaza odkryli żydowską posiadłość z I i II w. n.e. z salą zgromadzeń otoczoną kamiennymi ławami, która według badaczy mogła być synagogą."
  cs:
    - "Anacharat bylo město Isacharovo ve východní Dolní Galileji. Jochanan Aharoni je ztotožnil s Tel Rechesh (arabsky Tell el-Mukurkuš), pahorkem v hluboké soutěsce Nachal Tavor asi 9 km jihovýchodně od hory Tábor; japonský tým, který místo později zkoumal, dospěl k témuž závěru. V Bibli se objevuje jednou, v Isacharově seznamu měst: „Hafaraim, Sion, též Anaharat“."
    - "Anacharat je kanaánské město egyptských záznamů: je uvedeno mezi městy, která Thutmose III. dobyl na první výpravě, a Amenhotep II. je vyplenil na své druhé asijské výpravě. Tým vedený Jicchakem Pazem se Šuičim Hasegawou z Univerzity Rikkyó a japonskými kolegy kopal v Tel Rechesh v letech 2006–2010, 2013–2017 a 2019. Kromě města z doby bronzové a železné nalezli židovský statek z prvního a druhého století n. l. se shromažďovacím sálem lemovaným kamennými lavicemi, v němž podle vykopávačů mohla být synagoga."
