body:
  en:
    - "Nazareth lies in a basin high in the hills of Lower Galilee, above the Jezreel Valley, about 6 km from the city of Sepphoris. Tombs and pottery show people here in the Middle Bronze Age, and silos and grinding stones in the Iron Age. The village of the Gospels was settled again in the late Hellenistic period, when Jews moved into Galilee under the Hasmoneans, and it stayed small: the estimates of scholars run to a few hundred people living from farming in houses partly cut into the rock."
    - "Nazareth is not named in the Old Testament, in Josephus or in the Mishnah. In the Gospels it is the town of Mary and Joseph, where the angel Gabriel came to Mary, and where Jesus grew up after the family returned from Egypt; he is called Jesus of Nazareth. Luke tells how he read from Isaiah in its synagogue and how the townspeople drove him out to the brow of the hill, and Nathanael asked whether any good thing could come out of Nazareth."
    - "Excavations by Bellarmino Bagatti from 1955 under the Church of the Annunciation found rock-cut houses, cisterns and storage pits of the Roman village. In 2009 Yardenna Alexandre excavated a house of the early Roman period nearby, and Ken Dark has studied another under the convent of the Sisters of Nazareth. A Hebrew inscription from Caesarea, found in 1962 and dated to the third or fourth century AD, lists Nazareth as the seat of one of the priestly courses, a list usually taken to show where they settled after the revolts against Rome."
    - "In the early third century Julius Africanus wrote that relatives of Jesus, the desposynoi, came from Nazareth and Kokhaba. Epiphanius says that under Constantine Joseph of Tiberias had leave to build churches in Jewish towns, Nazareth among them. In the fifth century a church was built over the venerated cave of the Annunciation; Bagatti thought an earlier sanctuary lay beneath it, a reading other scholars dispute. The town itself remained largely Jewish through late antiquity."
  ru:
    - "Назарет лежит в котловине высоко в горах Нижней Галилеи, над Изреельской долиной, примерно в 6 км от города Сепфорис. Гробницы и керамика говорят о людях здесь в среднем бронзовом веке, а зернохранилища и жернова — в железном. Селение евангельских времён возникло заново в позднеэллинистический период, когда при Хасмонеях иудеи переселялись в Галилею, и оставалось небольшим: по оценкам учёных, несколько сот человек жили земледелием в домах, отчасти вырубленных в скале."
    - "Назарет не упоминается ни в Ветхом Завете, ни у Иосифа Флавия, ни в Мишне. В Евангелиях это город Марии и Иосифа, куда ангел Гавриил пришёл к Марии и где Иисус вырос после возвращения семьи из Египта; Его называют Иисусом из Назарета. Лука рассказывает, как Он читал Исаию в здешней синагоге и как жители вывели Его на вершину горы, чтобы свергнуть, а Нафанаил спрашивал, может ли что доброе быть из Назарета."
    - "Раскопки Беллармино Багатти под храмом Благовещения, начатые в 1955 г., открыли вырубленные в скале жилища, цистерны и хозяйственные ямы римского селения. В 2009 г. Ярдена Александр раскопала неподалёку дом раннеримского времени, а Кен Дарк исследовал другой дом под монастырём сестёр Назарета. Еврейская надпись из Кесарии, найденная в 1962 г. и датируемая III или IV веком н. э., называет Назарет местом одной из священнических черед; обычно считают, что этот список показывает, где череды поселились после восстаний против Рима."
    - "В начале III века Юлий Африкан писал, что родственники Иисуса, деспосины, происходили из Назарета и Кохавы. Епифаний пишет, что при Константине Иосиф Тивериадский получил позволение строить церкви в иудейских городах, и среди них в Назарете. В V веке над почитаемой пещерой Благовещения построили церковь; Багатти считал, что под ней было более раннее святилище, но с этим толкованием спорят другие учёные. Сам город в поздней античности оставался в основном иудейским."
  uk:
    - "Назарет лежить у котловині високо в горах Нижньої Галілеї, над Їзреельською долиною, приблизно за 6 км від міста Сепфорис. Гробниці та кераміка свідчать про людей тут у середню бронзову добу, а силоси й жорна — у залізну добу. Село з Євангелій було заселене знову наприкінці елліністичної доби, коли євреї за Хасмонеїв переселялися до Галілеї, і воно залишалося малим: за оцінками вчених, тут жило кілька сотень людей, що кормилися землеробством, у будинках, частково висічених у скелі."
    - "Назарет не згадано ні в Старому Завіті, ні в Йосифа Флавія, ні в Мішні. В Євангеліях це місто Марії та Йосипа, куди до Марії прийшов ангел Гавриїл і де росте Ісус після повернення родини з Єгипту; Його називають Ісусом з Назарета. Лука розповідає, як Він читав з Ісаї в тутешній синагозі і як городяни вивели Його до краю гори, а Натанаїл спитав, чи може бути щось добре з Назарета."
    - "Розкопки Белларміно Баґатті, які з 1955 року велися під церквою Благовіщення, виявили висічені в скелі будинки, цистерни та сховища римського села. 2009 року Ярдена Александр розкопала поблизу будинок ранньоримської доби, а Кен Дарк вивчав інший під монастирем Сестер Назарету. Давньоєврейський напис із Кесарії, знайдений 1962 року й датований III або IV століттям н. е., називає Назарет місцем перебування однієї з священицьких черг; цей перелік зазвичай вважають свідченням того, де вони оселилися після повстань проти Риму."
    - "На початку III століття Юлій Африкан писав, що родичі Ісуса, десповсини, походили з Назарета та Кохаби. Епіфаній повідомляє, що за Костянтина Йосип Тіверіадський мав дозвіл будувати церкви в єврейських містах, серед них у Назареті. У V столітті над шанованою печерою Благовіщення збудували церкву; Баґатті вважав, що під нею лежало давніше святилище, але інші вчені це заперечують. Саме місто в пізній античності залишалося переважно єврейським."
  es:
    - "Nazaret se encuentra en una cuenca en lo alto de las colinas de la Baja Galilea, sobre el valle de Jezreel, a unos 6 km de la ciudad de Séforis. Tumbas y cerámica muestran presencia humana aquí en el Bronce Medio, y silos y piedras de molino en la Edad del Hierro. La aldea de los Evangelios se pobló de nuevo a finales del período helenístico, cuando los judíos se establecieron en Galilea bajo los asmoneos, y siguió siendo pequeña: las estimaciones de los estudiosos hablan de unos pocos cientos de personas que vivían de la agricultura en casas en parte excavadas en la roca."
    - "Nazaret no se nombra en el Antiguo Testamento, ni en Josefo, ni en la Misná. En los Evangelios es la ciudad de María y José, adonde el ángel Gabriel vino a María, y donde Jesús creció después de que la familia volviera de Egipto; se le llama Jesús de Nazaret. Lucas cuenta cómo leyó a Isaías en su sinagoga y cómo los habitantes lo echaron fuera hasta la cumbre del monte, y Natanael preguntó si de Nazaret podía haber algo de bueno."
    - "Las excavaciones de Bellarmino Bagatti desde 1955 bajo la Iglesia de la Anunciación hallaron casas excavadas en la roca, cisternas y fosas de almacenamiento de la aldea romana. En 2009 Yardenna Alexandre excavó cerca una casa del período romano temprano, y Ken Dark ha estudiado otra bajo el convento de las Hermanas de Nazaret. Una inscripción hebrea de Cesarea, hallada en 1962 y fechada en el siglo III o IV d. C., enumera Nazaret como sede de una de las clases sacerdotales, lista que suele tomarse como indicio de dónde se establecieron tras las rebeliones contra Roma."
    - "A principios del siglo III, Julio Africano escribió que los parientes de Jesús, los desposynoi, procedían de Nazaret y Kokhaba. Epifanio dice que bajo Constantino José de Tiberíades tuvo permiso para construir iglesias en las ciudades judías, entre ellas Nazaret. En el siglo V se construyó una iglesia sobre la venerada gruta de la Anunciación; Bagatti pensaba que debajo había un santuario anterior, interpretación que otros estudiosos discuten. La propia ciudad siguió siendo en gran parte judía durante la Antigüedad tardía."
  pt:
    - "Nazaré fica numa bacia no alto das colinas da Baixa Galileia, acima do vale de Jezreel, a cerca de 6 km da cidade de Séforis. Túmulos e cerâmica mostram presença humana aqui na Idade do Bronze Médio, e silos e mós na Idade do Ferro. A aldeia dos Evangelhos foi povoada de novo no fim do período helenístico, quando judeus se mudaram para a Galileia sob os hasmoneus, e continuou pequena: as estimativas dos estudiosos chegam a algumas centenas de pessoas que viviam da agricultura em casas em parte escavadas na rocha."
    - "Nazaré não é citada no Antigo Testamento, em Josefo nem na Mixná. Nos Evangelhos é a cidade de Maria e José, onde o anjo Gabriel veio a Maria, e onde Jesus cresceu depois que a família voltou do Egito; ele é chamado Jesus de Nazaré. Lucas conta como ele leu Isaías na sinagoga dali e como os habitantes o expulsaram até a beira do monte, e Natanael perguntou se podia vir alguma coisa boa de Nazaré."
    - "As escavações de Bellarmino Bagatti, a partir de 1955, sob a Igreja da Anunciação, encontraram casas escavadas na rocha, cisternas e fossas de armazenamento da aldeia romana. Em 2009, Yardenna Alexandre escavou ali perto uma casa do início do período romano, e Ken Dark estudou outra sob o convento das Irmãs de Nazaré. Uma inscrição hebraica de Cesareia, encontrada em 1962 e datada do século III ou IV d.C., lista Nazaré como sede de um dos turnos sacerdotais, lista em geral tomada como indício de onde eles se estabeleceram depois das revoltas contra Roma."
    - "No início do século III, Júlio Africano escreveu que parentes de Jesus, os desposynoi, vinham de Nazaré e Kokhaba. Epifânio diz que, sob Constantino, José de Tiberíades teve licença para construir igrejas em cidades judaicas, entre elas Nazaré. No século V foi construída uma igreja sobre a venerada gruta da Anunciação; Bagatti pensou que um santuário anterior jazia sob ela, leitura que outros estudiosos contestam. A própria cidade continuou em grande parte judaica durante a Antiguidade tardia."
  de:
    - "Nazareth liegt in einem Becken hoch in den Bergen Untergaliläas, oberhalb der Jesreel-Ebene, etwa 6 km von der Stadt Sepphoris entfernt. Gräber und Keramik zeigen hier Menschen in der Mittelbronzezeit, Getreidesilos und Mahlsteine in der Eisenzeit. Das Dorf der Evangelien wurde in der späthellenistischen Zeit neu besiedelt, als Juden unter den Hasmonäern nach Galiläa zogen, und blieb klein: Gelehrte schätzen einige hundert Menschen, die von der Landwirtschaft lebten, in teils in den Fels gehauenen Häusern."
    - "Nazareth wird im Alten Testament, bei Josephus und in der Mischna nicht genannt. In den Evangelien ist es die Stadt von Maria und Josef, wo der Engel Gabriel zu Maria kam und wo Jesus aufwuchs, nachdem die Familie aus Ägypten zurückgekehrt war; er heißt Jesus von Nazareth. Lukas erzählt, wie er in der dortigen Synagoge aus Jesaja las und wie die Bewohner ihn an den Rand des Hügels hinausführten, und Nathanael fragte, ob aus Nazareth etwas Gutes kommen könne."
    - "Grabungen von Bellarmino Bagatti ab 1955 unter der Verkündigungskirche fanden in den Fels gehauene Häuser, Zisternen und Vorratsgruben des römischen Dorfes. 2009 grub Yardenna Alexandre in der Nähe ein Haus der frührömischen Zeit aus, und Ken Dark untersuchte ein weiteres unter dem Kloster der Schwestern von Nazareth. Eine hebräische Inschrift aus Caesarea, 1962 gefunden und ins 3. oder 4. Jahrhundert n. Chr. datiert, nennt Nazareth als Sitz einer der Priesterordnungen; die Liste gilt gewöhnlich als Hinweis darauf, wo sie sich nach den Aufständen gegen Rom niederließen."
    - "Im frühen 3. Jahrhundert schrieb Julius Africanus, Verwandte Jesu, die Desposynoi, stammten aus Nazareth und Kochaba. Epiphanius berichtet, unter Konstantin habe Josef von Tiberias die Erlaubnis erhalten, in jüdischen Städten Kirchen zu bauen, darunter in Nazareth. Im 5. Jahrhundert wurde über der verehrten Verkündigungsgrotte eine Kirche errichtet; Bagatti hielt ein früheres Heiligtum darunter für wahrscheinlich, was andere Gelehrte bestreiten. Die Stadt selbst blieb in der Spätantike überwiegend jüdisch."
  fr:
    - "Nazareth se trouve dans une cuvette haut perchée des collines de Basse Galilée, au-dessus de la vallée de Jizreel, à environ 6 km de la ville de Sepphoris. Des tombes et de la céramique attestent une présence humaine à l’âge du Bronze moyen, des silos et des meules à l’âge du Fer. Le village des Évangiles fut repeuplé à la fin de l’époque hellénistique, quand des Juifs s’installèrent en Galilée sous les Hasmonéens, et il resta petit : les estimations des spécialistes vont à quelques centaines d’habitants vivant de l’agriculture dans des maisons en partie creusées dans le roc."
    - "Nazareth n’est nommée ni dans l’Ancien Testament, ni chez Flavius Josèphe, ni dans la Mishna. Dans les Évangiles, c’est la ville de Marie et de Joseph, où l’ange Gabriel vint trouver Marie, et où Jésus grandit après le retour d’Égypte de la famille ; on l’appelle Jésus de Nazareth. Luc raconte comment il lut Ésaïe dans sa synagogue et comment les gens de la ville le chassèrent jusqu’au sommet de la montagne, et Nathanaël demanda s’il pouvait venir de Nazareth quelque chose de bon."
    - "Les fouilles de Bellarmino Bagatti, à partir de 1955, sous l’église de l’Annonciation, ont mis au jour des maisons taillées dans le roc, des citernes et des fosses de stockage du village romain. En 2009, Yardenna Alexandre a fouillé tout près une maison du début de l’époque romaine, et Ken Dark en a étudié une autre sous le couvent des Sœurs de Nazareth. Une inscription hébraïque de Césarée, découverte en 1962 et datée du IIIe ou du IVe siècle apr. J.-C., cite Nazareth comme résidence de l’une des classes sacerdotales, liste que l’on tient d’ordinaire pour un témoin de leur installation après les révoltes contre Rome."
    - "Au début du IIIe siècle, Julius Africanus écrivit que des parents de Jésus, les desposynoi, venaient de Nazareth et de Kokhaba. Épiphane dit que, sous Constantin, Joseph de Tibériade fut autorisé à bâtir des églises dans des villes juives, dont Nazareth. Au Ve siècle, une église fut élevée sur la grotte vénérée de l’Annonciation ; Bagatti pensait qu’un sanctuaire plus ancien se trouvait dessous, lecture que d’autres spécialistes contestent. La ville resta en grande partie juive pendant l’Antiquité tardive."
  it:
    - "Nazaret si trova in una conca in alto tra le colline della Bassa Galilea, sopra la valle di Izreel, a circa 6 km dalla città di Sefforis. Tombe e ceramica mostrano una presenza umana nel Bronzo Medio, e silos e macine nell’età del Ferro. Il villaggio dei Vangeli fu rifondato alla fine del periodo ellenistico, quando gli Ebrei si trasferirono in Galilea sotto gli Asmonei, e rimase piccolo: le stime degli studiosi parlano di poche centinaia di persone che vivevano di agricoltura in case in parte scavate nella roccia."
    - "Nazaret non è nominata nell’Antico Testamento, in Giuseppe Flavio né nella Mishnah. Nei Vangeli è la città di Maria e di Giuseppe, dove l’angelo Gabriele venne da Maria e dove Gesù crebbe dopo il ritorno della famiglia dall’Egitto; è chiamato Gesù di Nazaret. Luca racconta come lesse Isaia nella sua sinagoga e come la gente della città lo cacciò fuori fino al ciglio del monte, e Natanaele si chiese se da Nazaret potesse venire qualcosa di buono."
    - "Gli scavi di Bellarmino Bagatti dal 1955 sotto la Chiesa dell’Annunciazione portarono alla luce case scavate nella roccia, cisterne e fosse di deposito del villaggio romano. Nel 2009 Yardenna Alexandre scavò nelle vicinanze una casa del primo periodo romano, e Ken Dark ne ha studiata un’altra sotto il convento delle Suore di Nazaret. Un’iscrizione ebraica da Cesarea, trovata nel 1962 e datata al III o IV secolo d.C., elenca Nazaret come sede di una delle classi sacerdotali, elenco di solito inteso come indicazione dei luoghi in cui si stabilirono dopo le rivolte contro Roma."
    - "All’inizio del III secolo Giulio Africano scrisse che i parenti di Gesù, i desposynoi, venivano da Nazaret e da Kokhaba. Epifanio dice che sotto Costantino Giuseppe di Tiberiade ebbe licenza di costruire chiese nelle città ebraiche, tra cui Nazaret. Nel V secolo fu costruita una chiesa sulla venerata grotta dell’Annunciazione; Bagatti pensava che sotto di essa ci fosse un santuario più antico, una lettura che altri studiosi contestano. La città rimase in gran parte ebraica per tutta la tarda antichità."
  pl:
    - "Nazaret leży w kotlinie wysoko wśród wzgórz Dolnej Galilei, ponad doliną Jizreel, około 6 km od miasta Sefforis. Groby i ceramika świadczą o obecności ludzi w środkowej epoce brązu, a silosy i kamienie żarnowe w epoce żelaza. Wieś z Ewangelii zasiedlono na nowo pod koniec okresu hellenistycznego, gdy za Hasmoneuszy Żydzi przenosili się do Galilei, i pozostała niewielka: szacunki uczonych mówią o kilkuset mieszkańcach żyjących z rolnictwa w domach częściowo wykutych w skale."
    - "Nazaret nie jest wymieniony w Starym Testamencie, u Józefa Flawiusza ani w Misznie. W Ewangeliach jest miastem Marii i Józefa, do którego anioł Gabriel przyszedł do Marii i w którym Jezus dorastał po powrocie rodziny z Egiptu; nazywany jest Jezusem z Nazaretu. Łukasz opowiada, jak czytał w tamtejszej synagodze z Izajasza i jak mieszkańcy wypędzili go na szczyt wzgórza, a Natanael zapytał, czy z Nazaretu może być coś dobrego."
    - "Wykopaliska Bellarmina Bagattiego od 1955 roku pod bazyliką Zwiastowania odsłoniły wykute w skale domy, cysterny i jamy zasobowe rzymskiej wsi. W 2009 roku Yardenna Alexandre odkopała w pobliżu dom z wczesnego okresu rzymskiego, a Ken Dark zbadał inny pod klasztorem Sióstr Nazaretanek. Hebrajski napis z Cezarei, odkryty w 1962 roku i datowany na III lub IV wiek n.e., wymienia Nazaret jako siedzibę jednej z kapłańskich zmian służby, a lista ta uchodzi zwykle za świadectwo tego, gdzie osiedlili się kapłani po powstaniach przeciw Rzymowi."
    - "Na początku III wieku Juliusz Afrykan pisał, że krewni Jezusa, desposynoi, pochodzili z Nazaretu i Kochaby. Epifaniusz twierdzi, że za Konstantyna Józef z Tyberiady otrzymał zezwolenie na budowę kościołów w żydowskich miastach, w tym w Nazarecie. W V wieku nad czczoną jaskinią Zwiastowania wzniesiono kościół; Bagatti sądził, że pod nim leżało wcześniejsze sanktuarium, co inni uczeni kwestionują. Samo miasto pozostało w późnej starożytności w przeważającej części żydowskie."
  cs:
    - "Nazaret leží v kotlině vysoko v pahorcích Dolní Galileje, nad Jizreelským údolím, asi 6 km od města Sefóris. Hrobky a keramika dokládají lidi tu již ve střední době bronzové a sila a žernovy v době železné. Vesnice z evangelií byla osídlena znovu v pozdní helénistické době, kdy se Židé za Hasmoncovců stěhovali do Galileje, a zůstala malá: odhady učenců mluví o několika stech lidí žijících ze zemědělství v domech částečně vytesaných do skály."
    - "Nazaret se nejmenuje ve Starém zákoně, u Josefa Flavia ani v Mišně. V evangeliích je to město Marie a Josefa, kam k Marii přišel anděl Gabriel a kde Ježíš vyrůstal poté, co se rodina vrátila z Egypta; nazývá se Ježíš Nazaretský. Lukáš vypráví, jak v tamní synagoze četl z Izajáše a jak ho obyvatelé vyhnali na úbočí pahorku, a Natanael se ptal, zda může z Nazareta vzejít něco dobrého."
    - "Vykopávky Bellarmina Bagattiho od roku 1955 pod kostelem Zvěstování odkryly skalní domy, cisterny a zásobní jámy římské vesnice. V roce 2009 vykopala Yardenna Alexandre nedaleko dům z raného římského období a Ken Dark prostudoval další pod klášterem Sester z Nazareta. Hebrejský nápis z Cesareje, nalezený roku 1962 a datovaný do 3. nebo 4. století n. l., uvádí Nazaret jako sídlo jedné z kněžských tříd, seznam, který se obvykle chápe jako doklad toho, kde se po povstáních proti Římu usadily."
    - "Na počátku 3. století napsal Julius Africanus, že příbuzní Ježíšovi, desposynoi, pocházeli z Nazareta a Kochaby. Epifanius říká, že za Konstantina měl Josef z Tiberiady dovoleno stavět kostely v židovských městech, mezi nimi v Nazaretu. V 5. století byl nad ctěnou jeskyní Zvěstování postaven kostel; Bagatti soudil, že pod ním ležela starší svatyně, což jiní učenci zpochybňují. Samo město zůstalo po celou pozdní antiku převážně židovské."
  nl:
    - "Nazareth ligt in een kom hoog in de heuvels van Neder-Galilea, boven de vallei van Jizreël, ongeveer 6 km van de stad Sepphoris. Graven en aardewerk wijzen op mensen hier in de middenbronstijd, en silo’s en maalstenen op de ijzertijd. Het dorp van de evangeliën werd in de late hellenistische tijd opnieuw bewoond, toen Joden onder de Hasmoneeën naar Galilea trokken, en het bleef klein: schattingen van geleerden komen uit op enkele honderden mensen die van landbouw leefden in huizen die gedeeltelijk in de rots waren uitgehouwen."
    - "Nazareth wordt niet genoemd in het Oude Testament, bij Josephus of in de Misjna. In de evangeliën is het de stad van Maria en Jozef, waar de engel Gabriël bij Maria kwam en waar Jezus opgroeide nadat het gezin uit Egypte was teruggekeerd; hij wordt Jezus van Nazareth genoemd. Lukas vertelt hoe hij in de synagoge uit Jesaja las en hoe de stadsbewoners hem tot aan de rand van de heuvel verdreven, en Natanaël vroeg of er iets goeds uit Nazareth kon komen."
    - "Opgravingen van Bellarmino Bagatti vanaf 1955 onder de Kerk van de Annunciatie vonden uit de rots gehouwen huizen, cisternes en voorraadputten van het Romeinse dorp. In 2009 groef Yardenna Alexandre vlakbij een huis uit de vroeg-Romeinse tijd op, en Ken Dark heeft er een ander onder het klooster van de Zusters van Nazareth bestudeerd. Een Hebreeuws opschrift uit Caesarea, in 1962 gevonden en gedateerd in de derde of 4e eeuw n.Chr., noemt Nazareth als zetel van een van de priesterdiensten, een lijst die gewoonlijk wordt opgevat als aanwijzing waar zij zich na de opstanden tegen Rome vestigden."
    - "In het begin van de 3e eeuw schreef Julius Africanus dat verwanten van Jezus, de desposynoi, uit Nazareth en Kokhaba kwamen. Epifanius zegt dat Jozef van Tiberias onder Constantijn verlof had kerken te bouwen in Joodse steden, onder andere Nazareth. In de 5e eeuw werd een kerk gebouwd boven de vereerde grot van de Annunciatie; Bagatti meende dat daaronder een eerder heiligdom lag, een lezing die andere geleerden betwisten. De stad zelf bleef in de late oudheid grotendeels Joods."
  sv:
    - "Nasaret ligger i en skålformig dal högt uppe i bergen i Nedre Galileen, ovanför Jisreeldalen, cirka 6 km från staden Sefforis. Gravar och keramik visar att människor bodde här under mellersta bronsåldern, och silor och kvarnstenar under järnåldern. Evangeliernas by bosattes på nytt under sen hellenistisk tid, när judar flyttade in i Galileen under hasmoneerna, och den förblev liten: forskarnas uppskattningar rör sig om några hundra människor som levde av jordbruk i hus som delvis var uthuggna i berget."
    - "Nasaret nämns inte i Gamla testamentet, hos Josefus eller i Mishna. I evangelierna är det Marias och Josefs stad, dit ängeln Gabriel kom till Maria och där Jesus växte upp sedan familjen återvänt från Egypten; han kallas Jesus från Nasaret. Lukas berättar hur han läste ur Jesaja i dess synagoga och hur stadsborna drev ut honom till kanten av höjden, och Natanael frågade om något gott kunde komma från Nasaret."
    - "Utgrävningar av Bellarmino Bagatti från 1955 under Bebådelsekyrkan fann klipphuggna hus, cisterner och förrådsgropar från den romerska byn. År 2009 grävde Yardenna Alexandre ut ett hus från tidig romersk tid i närheten, och Ken Dark har studerat ett annat under Nasaretsystrarnas kloster. En hebreisk inskrift från Caesarea, funnen 1962 och daterad till 200- eller 300-talet e.Kr., förtecknar Nasaret som säte för en av prästavdelningarna, en förteckning som vanligen tas som belägg för var de bosatte sig efter upproren mot Rom."
    - "I början av 200-talet skrev Julius Africanus att Jesu släktingar, desposynoi, kom från Nasaret och Kokhaba. Epifanios säger att Josef från Tiberias under Konstantin hade tillstånd att bygga kyrkor i judiska städer, bland dem Nasaret. På 400-talet byggdes en kyrka över den vördade Bebådelsegrottan; Bagatti menade att en tidigare helgedom låg under den, en tolkning som andra forskare bestrider. Staden förblev i stort sett judisk under hela senantiken."
