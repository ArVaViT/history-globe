body:
  en:
    - "Netophah was a village of Judah near Bethlehem, listed with it among the descendants of Salma in the Chronicler's genealogies. It is usually sought at Khirbet Badd Faluh, a ruin on a hill some 4–5 km south-south-east of Bethlehem toward Tekoa, where pottery from the Iron Age to the Byzantine period has been found; the identification is likely but unproven, and Ramat Rahel has also been proposed."
    - "The place is known from its men. Two of David's thirty mighty men were Netophathites, Maharai and Heleb the son of Baanah (Heled, Heldai in Chronicles), and both commanded a monthly division of the royal army, for the tenth and the twelfth months. After the fall of Jerusalem in 586 BC Seraiah the son of Tanhumeth the Netophathite was among the captains who came to Gedaliah at Mizpah. Fifty-six “men of Netophah” returned from Babylon with Zerubbabel (Nehemiah's copy of the list gives 188 for Bethlehem and Netophah together), Levites lived “in the villages of the Netophathites”, and at the dedication of Nehemiah's wall the singers gathered “from the villages of Netophathi”."
    - "That is all. The hills south-east of Bethlehem are farmed today by the Palestinian villages between Bethlehem and Tuqu' (Tekoa), with Israeli settlements on the ridges, and nothing marks the spot."
  ru:
    - "Нетофа была селением Иуды близ Вифлеема и стоит рядом с ним среди потомков Салмы в родословиях Паралипоменон. Её обычно ищут в Хирбет-Бадд-Фалухе, развалинах на холме километрах в четырёх-пяти к юго-юго-востоку от Вифлеема по дороге на Фекою, где найдена керамика от железного века до византийского времени; отождествление вероятно, но не доказано, и предлагался также Рамат-Рахель."
    - "Место известно по своим людям. Двое из тридцати храбрых Давида были Нетофафяне — Магарай и Хелев, сын Бааны (в Паралипоменоне — Хелед, Хелдай), и оба начальствовали над месячным отделением царского войска, в десятом и в двенадцатом месяце. После падения Иерусалима в 586 г. до н. э. Сераия, сын Танхумефа из Нетофафа, был среди военачальников, пришедших к Годолии в Массифу. Пятьдесят шесть «жителей Нетофы» вернулись из Вавилона с Зоровавелем (список у Неемии даёт 188 для Вифлеема и Нетофы вместе), левиты жили «в селениях Нетофафских», а при освящении стены Неемии певцы собрались «из сел Нетофафских»."
    - "Это всё. Холмы к юго-востоку от Вифлеема сегодня возделывают палестинские деревни между Вифлеемом и Тукуа (Фекоей), на гребнях стоят израильские поселения, и ничто не отмечает это место."
  uk:
    - "Нетофа була селом Юди поблизу Вифлеєма, названим разом із ним серед нащадків Салми в родоводах Хроніста. Її зазвичай шукають у Хірбет-Бадд-Фалюх, руїнах на пагорбі приблизно за 4–5 км на південь-південний схід від Вифлеєма в бік Текої, де знайдено кераміку від залізної до візантійської доби; ототожнення ймовірне, але не доведене, і запропоновано також Рамат-Рахель."
    - "Місце відоме за його людьми. Двоє з тридцяти Давидових воїнів були нетофатянами — Магарай і Хелеб, син Баани (Хелед, Хелдай у Хроніках), і обидва командували місячним відділом царського війська, на десятий і дванадцятий місяць. Після падіння Єрусалима 586 р. до н. е. Сераїя, син Танхумета нетофатянина, був серед воєвод, що прийшли до Гедалії в Міцпі. З Вавилона із Зоровавелем повернулися, за списком, «Мужів з Нетофи пятьдесять шість» (у Неемієвому варіанті списку для Вифлеєма й Нетофи разом названо 188), левіти жили «у селах Нетофатських», а на освяченні Неемієвого муру співаки зібралися «з сіл Нетофатських»."
    - "Це все. Пагорби на південний схід від Вифлеєма нині обробляють палестинські села між Вифлеємом і Туку' (Текоя), а на хребтах стоять ізраїльські поселення; місце нічим не позначене."
  es:
    - "Netofa era una aldea de Judá cerca de Belén, enumerada con ella entre los descendientes de Salma en las genealogías del Cronista. Suele buscarse en Khirbet Badd Faluh, unas ruinas en una colina a unos 4–5 km al sur-sureste de Belén, hacia Tecoa, donde se ha hallado cerámica desde la Edad del Hierro hasta el período bizantino; la identificación es probable, pero no está probada, y también se ha propuesto Ramat Rahel."
    - "El lugar se conoce por sus hombres. Dos de los treinta valientes de David eran netofatitas, Maharai y Helec hijo de Baana (Heled, Heldai en Crónicas), y ambos mandaban una división mensual del ejército real, para los meses décimo y duodécimo. Tras la caída de Jerusalén en 586 a. C., Seraías hijo de Tanhumet el netofatita estuvo entre los capitanes que fueron a Gedalías en Mizpa. Cincuenta y seis «varones de Nethopha» volvieron de Babilonia con Zorobabel (la copia de la lista en Nehemías da 188 para Belén y Netofa juntas), los levitas vivían «en las aldeas de Nethophati», y en la dedicación del muro de Nehemías los cantores se reunieron «de las aldeas de Netophati»."
    - "Eso es todo. Las colinas al sureste de Belén son cultivadas hoy por las aldeas palestinas entre Belén y Tuqu' (Tecoa), con asentamientos israelíes en las crestas, y nada marca el lugar."
  pt:
    - "Netofa era uma aldeia de Judá perto de Belém, listada com ela entre os descendentes de Salma nas genealogias do Cronista. Costuma ser procurada em Khirbet Badd Faluh, uma ruína numa colina a cerca de 4–5 km a su-sudeste de Belém, em direção a Tecoa, onde se encontrou cerâmica da Idade do Ferro ao período bizantino; a identificação é provável, mas não comprovada, e Ramat Rahel também foi proposta."
    - "O lugar é conhecido por seus homens. Dois dos trinta valentes de Davi eram netofatitas, Maarai e Helebe, filho de Baaná (Helede, Heldai em Crônicas), e ambos comandavam uma divisão mensal do exército real, para o décimo e o décimo segundo meses. Depois da queda de Jerusalém, em 586 a.C., Seraías, filho de Tanumete, o netofatita, esteve entre os capitães que foram a Gedalias, em Mispá. Cinquenta e seis “homens de Netofa” voltaram da Babilônia com Zorobabel (a cópia da lista em Neemias dá 188 para Belém e Netofa juntas), levitas moravam “nas aldeias dos netofatitas”, e na dedicação do muro de Neemias os cantores se reuniram “das aldeias dos netofatitas”."
    - "É só isso. As colinas a sudeste de Belém são hoje cultivadas pelas aldeias palestinas entre Belém e Tuqu' (Tecoa), com assentamentos israelenses nas cristas, e nada assinala o lugar."
  de:
    - "Netofa war ein Dorf in Juda nahe Bethlehem und wird in den Genealogien des Chronisten zusammen mit ihm unter den Nachkommen Salmas aufgeführt. Man sucht es meist bei Chirbet Badd Faluch, einer Ruine auf einem Hügel etwa 4–5 km südsüdöstlich von Bethlehem in Richtung Tekoa, wo Keramik von der Eisenzeit bis zur byzantinischen Zeit gefunden wurde; die Gleichsetzung ist wahrscheinlich, aber unbewiesen, und auch Ramat Rachel wurde vorgeschlagen."
    - "Der Ort ist von seinen Männern her bekannt. Zwei von Davids dreißig Helden waren Netophathiter, Maharai und Heleb, der Sohn Baanas (Heled, Heldai in der Chronik), und beide führten eine monatliche Abteilung des königlichen Heeres, für den zehnten und den zwölften Monat. Nach dem Fall Jerusalems 586 v. Chr. gehörte Seraja, der Sohn Tanhumets, der Netophathiter, zu den Hauptleuten, die zu Gedalja nach Mizpa kamen. Sechsundfünfzig „Männer von Netopha“ kehrten mit Serubbabel aus Babylon zurück (Nehemias Abschrift der Liste nennt 188 für Bethlehem und Netofa zusammen), Leviten wohnten „in den Dörfern der Netophathiter“, und bei der Einweihung von Nehemias Mauer versammelten sich die Sänger „von den Höfen der Netophathiter“."
    - "Das ist alles. Die Hügel südöstlich von Bethlehem werden heute von den palästinensischen Dörfern zwischen Bethlehem und Tuqu' (Tekoa) bewirtschaftet, mit israelischen Siedlungen auf den Höhenzügen, und nichts markiert die Stelle."
  fr:
    - "Netopha était un village de Juda près de Bethléem, cité avec elle parmi les descendants de Salma dans les généalogies du Chroniqueur. On la cherche d’ordinaire à Khirbet Badd Faluh, une ruine sur une colline à 4–5 km environ au sud-sud-est de Bethléem, vers Tekoa, où l’on a trouvé de la céramique de l’âge du Fer à l’époque byzantine ; l’identification est probable mais non prouvée, et Ramat Rahel a aussi été proposée."
    - "Le lieu est connu par ses hommes. Deux des trente vaillants de David étaient Nethophathiens, Maharaï et Héleb, fils de Baana (Héled, Heldaï dans les Chroniques), et tous deux commandaient une division mensuelle de l’armée royale, pour le dixième et le douzième mois. Après la chute de Jérusalem en 586 av. J.-C., Seraja, fils de Thanhumeth, de Nethopha, fut parmi les chefs qui vinrent auprès de Guedalia à Mitspa. Cinquante-six « gens de Nethopha » revinrent de Babylone avec Zorobabel (la copie de Néhémie donne 188 pour Bethléem et Netopha ensemble), des Lévites habitaient « dans les villages des Nethophathiens », et à la dédicace du mur de Néhémie les chantres se rassemblèrent « des villages des Nethophatiens »."
    - "C’est tout. Les collines au sud-est de Bethléem sont cultivées aujourd’hui par les villages palestiniens entre Bethléem et Tuqu‘ (Tekoa), avec des colonies israéliennes sur les crêtes, et rien ne marque l’endroit."
  it:
    - "Netofa era un villaggio di Giuda presso Betlemme, elencato con essa tra i discendenti di Salma nelle genealogie del Cronista. Di solito la si cerca a Khirbet Badd Faluh, una rovina su una collina a circa 4–5 km a sud-sud-est di Betlemme verso Tekoa, dove è stata trovata ceramica dall’età del Ferro al periodo bizantino; l’identificazione è probabile ma non provata, ed è stata proposta anche Ramat Rachel."
    - "Il luogo è noto dai suoi uomini. Due dei trenta prodi di Davide erano Netofatiti, Maarai ed Eleb figlio di Baana (Cheled, Cheldai nelle Cronache), ed entrambi comandavano una divisione mensile dell’esercito reale, per il decimo e il dodicesimo mese. Dopo la caduta di Gerusalemme nel 586 a.C. Seraia figlio di Tanumet il Netofatita fu tra i capitani che vennero da Godolia a Mizpa. Cinquantasei «uomini di Netofa» tornarono da Babilonia con Zorobabele (la copia dell’elenco in Neemia ne dà 188 per Betlemme e Netofa insieme), dei Leviti abitavano «nei villaggi dei Netofatiti», e alla dedicazione delle mura di Neemia i cantori si radunarono «dai villaggi dei Netofathiti»."
    - "Questo è tutto. Le colline a sud-est di Betlemme sono coltivate oggi dai villaggi palestinesi tra Betlemme e Tuqu’ (Tekoa), con insediamenti israeliani sulle creste, e nulla segna il luogo."
  pl:
    - "Netofa była wsią w Judzie koło Betlejem, wymienioną wraz z nim wśród potomków Salmy w rodowodach Kronikarza. Zwykle szuka się jej w Chirbet Badd Faluh, ruinach na wzgórzu około 4–5 km na południe-południowy wschód od Betlejem w stronę Tekoa, gdzie znaleziono ceramikę od epoki żelaza po okres bizantyński; utożsamienie jest prawdopodobne, lecz niepewne, proponowano też Ramat Rachel."
    - "Miejsce znane jest z jego mężów. Dwaj z trzydziestu dzielnych mężów Dawida byli Netofatczykami: Maharaj i Cheleb, syn Baany (Cheled, w Kronikach Cheldaj), a każdy z nich dowodził miesięczną zmianą wojska królewskiego, w miesiącu dziesiątym i dwunastym. Po upadku Jerozolimy w 586 roku p.n.e. Serajasz, syn Tanchumeta Netofatczyka, był wśród dowódców, którzy przyszli do Gedaliasza do Mispy. Pięćdziesięciu sześciu „Mężów z Netofatu” wróciło z Babilonu ze Zorobabelem (w odpisie listy u Nehemiasza podano razem dla Betlejem i Netofy 188), lewici mieszkali „we wsiach Netofatyckich”, a przy poświęceniu muru Nehemiasza śpiewacy zgromadzili się „ze wsi Netofatyckich”."
    - "To wszystko. Wzgórza na południowy wschód od Betlejem uprawiają dziś palestyńskie wsie między Betlejem a Tuku' (Tekoa), z izraelskimi osiedlami na grzbietach, i nic nie znaczy tego miejsca."
  cs:
    - "Netofa byla vesnice v Judsku u Betléma, uváděná s ním mezi potomky Salmy v kronikářských rodokmenech. Obvykle se hledá v Chirbet Badd Falúh, na rozvalinách na pahorku asi 4–5 km jihojihovýchodně od Betléma směrem k Tekoa, kde byla nalezena keramika od doby železné po byzantskou; ztotožnění je pravděpodobné, ale nedokázané, navrhován byl i Ramat Rachel."
    - "Místo je známo podle svých mužů. Dva z Davidových třiceti hrdinů byli Netofatští, Maharaj a Cheleb syn Baany (Cheled, v Kronikách Cheldaj), a oba velili měsíčnímu oddílu královského vojska, pro desátý a dvanáctý měsíc. Po pádu Jeruzaléma roku 586 př. n. l. byl Serajáš syn Tanchumet Netofatský mezi vojevůdci, kteří přišli ke Gedaljášovi do Micpy. Z Babylóna se se Zerubábelem vrátilo „Mužů Netofatských padesáte šest“ (Nehemjášův opis seznamu uvádí pro Betlém a Netofu dohromady 188), leviti přebývali „ve vsech Netofatských“ a při vysvěcení Nehemjášovy hradby se zpěváci shromáždili „ze vsí Netofatských“."
    - "To je vše. Pahorky jihovýchodně od Betléma dnes obdělávají palestinské vesnice mezi Betlémem a Tuqu' (Tekoa), s izraelskými osadami na hřebenech, a nic místo neoznačuje."
  nl:
    - "Netofa was een dorp van Juda bij Bethlehem, samen met Bethlehem vermeld onder de nakomelingen van Salma in de geslachtsregisters van de Kronieken. Het wordt meestal gezocht bij Khirbet Badd Faluh, een ruïne op een heuvel zo’n 4–5 km zuidzuidoost van Bethlehem, richting Tekoa, waar aardewerk van de ijzertijd tot de Byzantijnse tijd is gevonden; de identificatie is waarschijnlijk maar onbewezen, en ook Ramat Rachel is voorgesteld."
    - "De plaats is bekend uit haar mannen. Twee van Davids dertig helden waren Netofathieten, Maharai en Cheleb, de zoon van Baäna (Heled, Cheldai in de Kronieken), en beiden voerden het bevel over een maandelijkse afdeling van het koninklijke leger, voor de tiende en de twaalfde maand. Na de val van Jeruzalem in 586 v.Chr. behoorde Seraja, de zoon van Tanchumet, de Netofathiet, tot de aanvoerders die bij Gedalja in Mizpa kwamen. Zesenvijftig “mannen van Netofa” keerden met Zerubbabel uit Babylon terug (Nehemia’s afschrift van de lijst geeft 188 voor Bethlehem en Netofa samen), Levieten woonden “in de dorpen der Netofathieten”, en bij de inwijding van Nehemia’s muur werden de zangers verzameld “uit de dorpen van de Netofathieten”."
    - "Dat is alles. De heuvels ten zuidoosten van Bethlehem worden tegenwoordig bewerkt door de Palestijnse dorpen tussen Bethlehem en Tuqu’ (Tekoa), met Israëlische nederzettingen op de ruggen, en niets markeert de plek."
  sv:
    - "Netofa var en by i Juda nära Betlehem, upptagen tillsammans med den bland Salmas ättlingar i krönikeförfattarens släkttavlor. Den söks vanligen vid Khirbet Badd Faluh, en ruin på en kulle cirka 4–5 km sydsydost om Betlehem mot Tekoa, där keramik från järnåldern till bysantinsk tid har hittats; identifikationen är sannolik men obevisad, och Ramat Rahel har också föreslagits."
    - "Platsen är känd genom sina män. Två av Davids trettio hjältar var netofatiter, Maharaj och Heleb, Baanas son (Heled, Heldaj i Krönikeböckerna), och båda ledde var sin månadsavdelning av kungens här, för tionde och tolfte månaden. Efter Jerusalems fall 586 f.Kr. var netofatiten Seraja, Tanchumets son, bland befälhavarna som kom till Gedalja i Mispa. Femtiosex av ”männen från Netofa” återvände från Babylon med Serubbabel (Nehemjas avskrift av förteckningen anger 188 för Betlehem och Netofa tillsammans), leviter bodde ”i netofatiternas byar”, och vid invigningen av Nehemjas mur samlades sångarna ”från netofatiternas byar”."
    - "Det är allt. Kullarna sydost om Betlehem brukas i dag av de palestinska byarna mellan Betlehem och Tuqu' (Tekoa), med israeliska bosättningar på åsarna, och ingenting markerar platsen."
  nb:
    - "Netofa var en landsby i Juda nær Betlehem, oppført sammen med den blant Salmas etterkommere i Krønikebøkenes slektsregistre. Den søkes vanligvis ved Khirbet Badd Faluh, en ruin på en høyde omtrent 4–5 km sør-sørøst for Betlehem mot Tekoa, der det er funnet keramikk fra jernalderen til bysantinsk tid; identifikasjonen er sannsynlig, men ikke bevist, og Ramat Rahel er også foreslått."
    - "Stedet er kjent gjennom sine menn. To av Davids tretti helter var netofatitter, Maharai og Heleb, sønn av Baana (Heled, Heldai i Krønikebøkene), og begge ledet en månedlig avdeling av kongehæren, for den tiende og den tolvte måneden. Etter Jerusalems fall i 586 f.Kr. var Seraja, sønn av netofatitten Tanhumet, blant høvedsmennene som kom til Gedalja i Mispa. Seks og femti «Netofas menn» vendte tilbake fra Babylon med Serubabel (Nehemjas eksemplar av listen oppgir 188 for Betlehem og Netofa sammen), levitter bodde «i netofatittenes landsbyer», og ved innvielsen av Nehemjas mur samlet sangerne seg «fra netofatittenes landsbyer»."
    - "Det er alt. Åsene sørøst for Betlehem dyrkes i dag av de palestinske landsbyene mellom Betlehem og Tuqu' (Tekoa), med israelske bosetninger på ryggene, og ingenting markerer stedet."
  tl:
    - "Ang Nethopha ay isang nayon ng Juda malapit sa Bethlehem, na nakalista kasama nito sa mga inapo ni Salma sa mga talaangkanan ng may-akda ng Mga Cronica. Karaniwang hinahanap ito sa Khirbet Badd Faluh, isang guho sa isang burol na mga 4–5 km sa timog-timog-silangan ng Bethlehem patungong Tecoa, kung saan natagpuan ang mga palayok mula sa Panahong Bakal hanggang sa panahong Bisantino; malamang ngunit hindi napatunayan ang pagkakakilanlan, at iminungkahi rin ang Ramat Rahel."
    - "Kilala ang lugar mula sa mga lalaki nito. Dalawa sa tatlumpung makapangyarihang lalaki ni David ay mga Nethophatita, sina Maharai at Helec na anak ni Baana (Heled, Heldai sa Mga Cronica), at kapwa namuno sa buwanang pangkat ng hukbo ng hari, para sa ikasampu at ikalabindalawang buwan. Matapos bumagsak ang Jerusalem noong 586 BK, si Seraias na anak ni Tanhumet na Nethophatita ay kabilang sa mga pinunong pumunta kay Gedalias sa Mizpa. Limampu't anim na “mga lalake ng Nethopha” ang bumalik mula sa Babilonia kasama ni Zorobabel (188 para sa Bethlehem at Nethopha nang magkasama ang ibinibigay ng kopya ni Nehemias ng listahan), ang mga Levita ay “tumahan sa mga nayon ng mga Nethophatita”, at sa pagtatalaga ng pader ni Nehemias ay nagtipon ang mga mang-aawit “mula sa mga nayon ng mga Netophatita”."
    - "Iyon na lamang iyon. Ang mga burol sa timog-silangan ng Bethlehem ay sinasaka ngayon ng mga nayong Palestino sa pagitan ng Bethlehem at Tuqu' (Tecoa), na may mga paninirahang Israeli sa mga tagaytay, at walang nagmamarka sa lugar."
  da:
    - "Netofa var en landsby i Juda nær Betlehem, opregnet sammen med den blandt Salmas efterkommere i Krønikebøgernes slægtsregistre. Den søges sædvanligvis ved Khirbet Badd Faluh, en ruin på en høj omkring 4–5 km syd-sydøst for Betlehem mod Tekoa, hvor der er fundet keramik fra jernalder til byzantinsk tid; identifikationen er sandsynlig, men ikke bevist, og Ramat Rachel er også blevet foreslået."
    - "Stedet kendes fra sine mænd. To af Davids tredive helte var netofatitter, Maharaj og Heleb, Baanas søn (Heled og Heldaj i Krønikebøgerne), og begge førte en månedlig afdeling af kongens hær, for den tiende og den tolvte måned. Efter Jerusalems fald i 586 f.Kr. var Seraja, netofatitten Tanhumets søn, blandt høvedsmændene, der kom til Gedalja i Mispa. Seks og halvtreds »Nethofas Mænd« vendte tilbage fra Babylon med Zerubbabel (Nehemias' afskrift af listen giver 188 for Betlehem og Netofa tilsammen), leviter boede »i Nethofathiternes Landsbyer«, og ved indvielsen af Nehemias' mur samledes sangerne »fra Netofatiternes Landsbyer«."
    - "Det er alt. Højderne sydøst for Betlehem dyrkes i dag af de palæstinensiske landsbyer mellem Betlehem og Tuqu' (Tekoa), med israelske bosættelser på højdedragene, og intet markerer stedet."
  sr:
    - "Нетофата је било село у Јуди близу Витлејема, наведено с њим међу потомцима Салминим у Летописовим родословима. Обично се тражи у Хирбет Бад Фалуху, рушевини на брду око 4–5 км јужно-југоисточно од Витлејема према Текуји, где је нађена керамика од гвозденог до византијског доба; идентификација је вероватна, али недоказана, а предложен је и Рамат Рахел."
    - "Место је познато по својим људима. Двојица од Давидових тридесет јунака била су Нетофаћани, Марај и Хелев син Ванин (у Летописима Хелед и Хелдај), и обојица су командовала месечним одредом царске војске, за десети и дванаести месец. После пада Јерусалима 586. п. н. е. Сераја син Тануметов Нетофаћанин био је међу војводама које су дошле Годолији у Масфу. Педесет и шест „људи из Нетофата“ вратило се из Вавилона са Зоровављем (Немијина копија списка даје 188 за Витлејем и Нетофату заједно), левити су становали „у селима нетофатским“, а на освећењу Немијиног зида певачи су се скупили „из села нетофатских“."
    - "То је све. Брда југоисточно од Витлејема данас обрађују палестинска села између Витлејема и Туку (Текује), са израелским насељима на гребенима, и ништа не означава то место."
  hu:
    - "Netófa júdai falu volt Betlehem közelében, vele együtt említik Szalma leszármazottai között a Krónikák genealógiáiban. Általában a Khirbet Badd Faluhnál keresik, egy dombon álló romnál Betlehemtől mintegy 4–5 km-re dél-délkeletre, Tekóa felé, ahol a vaskortól a bizánci korig terjedő kerámiát találtak; az azonosítás valószínű, de nem bizonyított, és a Ramat Rahelt is javasolták."
    - "A hely a férfiairól ismert. Dávid harminc vitéze közül kettő netófai volt, Maharai és Héleb, Baaná fia (a Krónikákban Héled, Heldai), és mindketten a királyi hadsereg egy havi osztagát vezették, a tizedik és a tizenkettedik hónapra. Jeruzsálem Kr. e. 586-os eleste után Szerája, a netófai Tanhumet fia a hadvezérek között volt, akik Gedaljához mentek Micpába. Babilonból Zerubbábellel „Netófah férfiai” közül ötvenhatan tértek vissza (Nehémiás jegyzékének másolata Betlehemre és Netófára együtt 188-at ad), a leviták „a Nétofáti faluiban” laktak, és Nehémiás falának felszentelésekor az énekesek összegyűltek „a Netófátiak faluiból”."
    - "Ennyi az egész. A Betlehemtől délkeletre fekvő dombokat ma a Betlehem és Tuqu' (Tekóa) közötti palesztin falvak művelik, a gerinceken izraeli települések állnak, és semmi sem jelöli a helyet."
  fi:
    - "Netofa oli Juudan kylä Betlehemin lähellä, ja se mainitaan sen kanssa Salman jälkeläisten joukossa Aikakirjojen sukuluetteloissa. Sitä etsitään yleensä Khirbet Badd Faluhista, kukkulalla olevista raunioista noin 4–5 km Betlehemistä etelä-kaakkoon Tekoan suuntaan, missä on löydetty keramiikkaa rautakaudelta bysanttilaiselle ajalle; tunnistus on todennäköinen mutta todistamaton, ja myös Ramat Rahelia on ehdotettu."
    - "Paikka tunnetaan miehistään. Kaksi Daavidin kolmestakymmenestä sankarista oli netofalaisia, Maharai ja Heleb, Baanan poika (Heled, Aikakirjoissa Heldai), ja kumpikin johti kuukausittaista osastoa kuninkaan sotajoukossa, kymmenennellä ja kahdennellatoista kuukaudella. Jerusalemin kukistumisen jälkeen vuonna 586 eaa. netofalainen Seraja, Tanhumetin poika, oli niiden päälliköiden joukossa, jotka tulivat Gedaljan luo Mispaan. Viisikymmentäkuusi ”Netofan miestä” palasi Babylonista Serubbabelin mukana (Nehemian kirjan luettelo antaa Betlehemille ja Netofalle yhteensä 188), leeviläiset asuivat ”netofalaisten kylissä”, ja Nehemian muurin vihkiäisissä veisaajat kokoontuivat ”netofalaisten kylistä”."
    - "Siinä kaikki. Betlehemin kaakkoispuolen kukkuloita viljelevät nykyään Betlehemin ja Tuqu'n (Tekoa) väliset palestiinalaiskylät, harjanteilla on israelilaisia siirtokuntia, eikä mikään merkitse paikkaa."
  vi:
    - "Nê-tô-pha là một làng của Giu-đa gần Bết-lê-hem, được liệt kê cùng Bết-lê-hem trong số con cháu Sanh-ma trong các gia phả của tác giả sách Sử Ký. Người ta thường tìm nó ở Khirbet Badd Faluh, một tàn tích trên đồi cách Bết-lê-hem khoảng 4–5 km về phía nam đông nam, hướng về Thê-cô-a, nơi đã tìm thấy đồ gốm từ Thời đại Đồ Sắt đến thời Byzantine; sự đồng nhất này có khả năng nhưng chưa được chứng minh, và Ramat Rahel cũng đã được đề xuất."
    - "Nơi này được biết qua những người của nó. Hai trong số ba mươi dũng sĩ của Đa-vít là người Nê-tô-pha-tít, Ma-ha-rai và Hê-lép con trai Ba-a-na (Hê-lết, Hiên-đai trong sách Sử Ký), và cả hai đều chỉ huy một ban quân hằng tháng của quân đội hoàng gia, cho tháng thứ mười và tháng thứ mười hai. Sau khi Giê-ru-sa-lem sụp đổ năm 586 TCN, Sê-ra-gia con trai Tan-hu-mết người Nê-tô-pha-tít nằm trong số các tướng đến gặp Ghê-đa-lia tại Mích-ba. Năm mươi sáu “người Nê-tô-pha” trở về từ Ba-by-lôn cùng Xô-rô-ba-bên (bản sao danh sách trong Nê-hê-mi ghi 188 người cho Bết-lê-hem và Nê-tô-pha cộng lại), người Lê-vi sống “trong làng dân Nê-tô-pha-tít”, và khi dâng thành tường của Nê-hê-mi, các ca sĩ tụ họp từ “các làng người Nê-tô-pha-tít”."
    - "Chỉ có vậy. Ngày nay các đồi phía đông nam Bết-lê-hem được canh tác bởi các làng người Palestine giữa Bết-lê-hem và Tuqu' (Thê-cô-a), với các khu định cư Israel trên các sườn núi, và không có gì đánh dấu địa điểm."
  ro:
    - "Netofa era un sat din Iuda, lângă Betleem, înșirat împreună cu el printre descendenții lui Salma în genealogiile cronicarului. Este căutat de obicei la Khirbet Badd Faluh, o ruină pe un deal la circa 4–5 km sud-sud-est de Betleem, spre Tecoa, unde s-a găsit ceramică din Epoca fierului până în perioada bizantină; identificarea este probabilă, dar nedovedită, iar Ramat Rahel a fost și el propus."
    - "Locul este cunoscut prin oamenii lui. Doi dintre cei treizeci de viteji ai lui David erau netofatiți, Maharai și Heleb, fiul lui Baana (Heled, Heldai în Cronici), și amândoi comandau câte o divizie lunară a armatei regale, pentru luna a zecea și pentru luna a douăsprezecea. După căderea Ierusalimului în 586 î.Hr., Seraia, fiul lui Tanhumet netofatitul, s-a numărat printre căpeteniile care au venit la Ghedalia la Mițpa. Din Babilon s-au întors cu Zorobabel „Fiii din Nelofa, cincizeci și șase” (copia listei din Neemia dă 188 pentru Betleem și Netofa împreună), leviții locuiau „în satele lui Notefati”, iar la sfințirea zidului lui Neemia cântăreții s-au adunat „dela sălașurile lui Netofati”."
    - "Atât. Dealurile de la sud-est de Betleem sunt lucrate astăzi de satele palestiniene dintre Betleem și Tuqu' (Tecoa), cu așezări israeliene pe creste, iar nimic nu marchează locul."
  bg:
    - "Нетофа било село на Юда близо до Витлеем, изброено заедно с него сред потомците на Салма в родословията на Летописеца. Обикновено се търси при Хирбет Бад Фалух, руина на хълм на около 4–5 км юг-югоизточно от Витлеем към Текоя, където е намерена керамика от желязната епоха до византийския период; отъждествяването е вероятно, но не е доказано, като е предлаган и Рамат Рахел."
    - "Мястото е известно от хората си. Двама от тридесетте храбреци на Давид били нетофатци — Махарай и Хелев, синът на Ваана (в Летописи Хелед, Хелдай), и двамата командвали месечно отделение на царската войска, за десетия и за дванадесетия месец. След падането на Йерусалим през 586 г. пр.н.е. Сераия, синът на нетофатеца Танхумет, бил сред военачалниците, дошли при Годолия в Мицпа. Петдесет и шест „Нетофатски мъже“ се завърнали от Вавилон със Зоровавел (копието на списъка у Неемия дава 188 за Витлеем и Нетофа заедно), левити живеели „в селата на Нетофатците“, а при освещаването на стената на Неемия певците се събрали „от Нетофатските села“."
    - "Това е всичко. Днес хълмовете югоизточно от Витлеем се обработват от палестинските села между Витлеем и Тукуа (Текоя), с израелски селища по билата, и нищо не отбелязва мястото."
