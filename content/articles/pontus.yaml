# Overview article (ADR 0007). Mainstream facts only; the suggestion that the order of provinces in 1 Peter follows the carrier's route is given as a suggestion; Roman dates follow Magie.
id: pontus
place: a83a43e
title:
  en: "Pontus"
  ru: "Понт"
  uk: "Понт"
  es: "Ponto"
  pt: "Ponto"
  de: "Pontus"
  fr: "Pont"
body:
  en:
    - "Pontus is the land along the south-eastern shore of the Black Sea, the Pontus Euxinus from which it took its name: a narrow, rainy coast with the Greek ports of Sinope, Amisus and Trapezus, and behind it the parallel ridges of the Pontic mountains and the valleys of the Iris and the Lycus, with Amaseia and the temple city of Comana. About 281 BC a Persian noble, Mithridates, founded a kingdom here; its greatest king, Mithridates VI Eupator, fought Rome in three wars from 89 BC and died in 63 BC, when Pompey joined the western part of his kingdom with Bithynia as the province of Bithynia and Pontus and gave the rest to client kings. The last of these, the kingdom of Polemon, was annexed under Nero in AD 64. Strabo, the geographer, was born at Amaseia and described his homeland with care."
    - "In the New Testament Jews from Pontus were among those who heard the apostles at Pentecost; Aquila, Paul's fellow tentmaker and host at Corinth, was “a certain Jew named Aquila, born in Pontus”, who with his wife Priscilla had left Rome when Claudius expelled the Jews, and the couple later went with Paul to Ephesus and were greeted in his letter to Rome; and the First Epistle of Peter is addressed “to the strangers scattered throughout Pontus, Galatia, Cappadocia, Asia, and Bithynia”. Pontus stands first in that list, perhaps because the letter's bearer landed at a Pontic port and went round the provinces in that order, a suggestion that cannot be proved."
    - "In AD 111 Pliny the Younger, governing Bithynia and Pontus, wrote to Trajan, probably from the Pontic coast, that the Christians were many, of every age and rank, in the towns, villages and countryside, and that the temples had been almost deserted; the emperor's reply fixed Roman practice for a century. Aquila of Pontus, who translated the Old Testament into Greek for the Jews in the second century, and Marcion, son of a bishop of Sinope, came from the country, and in the third century Gregory the Wonderworker was bishop of Neocaesarea. Pontus is today the Black Sea coast of Turkey, the provinces of Samsun, Sinop, Amasya, Tokat and Trabzon; its Greek population left in the exchange of 1923."
  ru:
    - "Понт — земля вдоль юго-восточного берега Чёрного моря, Понта Евксинского, от которого она получила имя: узкое дождливое побережье с греческими гаванями Синопой, Амисом и Трапезунтом, а за ним параллельные гряды Понтийских гор и долины Ириса и Лика с Амасией и храмовым городом Команой. Около 281 г. до н. э. персидский вельможа Митридат основал здесь царство; величайший его царь, Митридат VI Евпатор, с 89 г. до н. э. вёл с Римом три войны и погиб в 63 г. до н. э., когда Помпей соединил западную часть его царства с Вифинией в провинцию Вифиния и Понт, а остальное отдал зависимым царям. Последнее из их владений, царство Полемона, было присоединено при Нероне в 64 г. н. э. Географ Страбон родился в Амасии и описал свою родину с особой заботой."
    - "В Новом Завете Иудеи из Понта были среди слышавших апостолов в день Пятидесятницы; в Коринфе Павел нашёл «некоторого Иудея, именем Акилу, родом Понтянина, недавно пришедшего из Италии», товарища по ремеслу, который с женой Прискиллой покинул Рим, когда Клавдий изгнал Иудеев; потом чета отправилась с Павлом в Ефес и получила привет в его послании к Римлянам; Первое же послание Петра обращено «пришельцам, рассеянным в Понте, Галатии, Каппадокии, Асии и Вифинии». Понт стоит в этом списке первым — быть может, потому, что податель письма высадился в понтийской гавани и обошёл провинции в таком порядке; доказать это нельзя."
    - "В 111 г. н. э. Плиний Младший, управляя Вифинией и Понтом, писал Траяну, вероятно, с понтийского берега, что христиан много, всякого возраста и звания, в городах, сёлах и по деревням, и что храмы почти опустели; ответ императора определил римскую практику на столетие. Из этой страны происходили Акила Понтийский, во II веке переведший Ветхий Завет на греческий для Иудеев, и Маркион, сын епископа Синопы, а в III веке Григорий Чудотворец был епископом Неокесарии. Понт сегодня — черноморское побережье Турции, провинции Самсун, Синоп, Амасья, Токат и Трабзон; его греческое население ушло при обмене 1923 года."
  uk:
    - "Понт — край уздовж південно-східного берега Чорного моря, Понту Евксинського, від якого він узяв назву: вузьке дощове узбережжя з грецькими портами Синоп, Аміс і Трапезунт, а за ним — паралельні хребти Понтійських гір і долини Іриса та Ліка, з Амасією й храмовим містом Команою. Близько 281 р. до н. е. перський вельможа Мітридат заснував тут царство; його найвидатніший цар, Мітридат VI Євпатор, вів проти Риму три війни з 89 р. до н. е. і помер 63 р. до н. е., коли Помпей з’єднав західну частину його царства з Віфінією в провінцію Віфінія й Понт, а решту віддав залежним царям. Останнє з них, царство Полемона, було приєднане за Нерона 64 р. н. е. Географ Страбон народився в Амасії й дбайливо описав свою батьківщину."
    - "У Новому Завіті юдеї з Понту були серед тих, хто чув апостолів у день П’ятдесятниці; у Коринті Павло знайшов «одного Жидовина, на ймя Авкилу, родом Понтянина» — свого товариша з виготовлення наметів і господаря; той разом із дружиною Прискиллою залишив Рим, коли Клавдій вигнав юдеїв, подружжя пізніше вирушило з Павлом до Ефеса, і їх вітають у його листі до Риму; а Перше послання Петра адресоване «вибраним захожанам розсїяння по Понту, Галатиї, Кападокиї, Азиї і Витиниї». Понт стоїть першим у цьому переліку, можливо, тому, що той, хто віз листа, висадився в понтійському порту й обійшов провінції в такому порядку; довести це припущення неможливо."
    - "У 111 р. н. е. Пліній Молодший, керуючи Віфінією й Понтом, писав Траянові, ймовірно з понтійського узбережжя, що християн багато, будь-якого віку й стану, в містах, селах і сільській місцевості, і що храми майже спорожніли; відповідь імператора встановила римську практику на століття. Акила з Понту, який у II ст. переклав Старий Завіт грецькою для юдеїв, і Маркіон, син єпископа Синопа, походили з цього краю, а в III ст. Григорій Чудотворець був єпископом Неокесарії. Сьогодні Понт — чорноморське узбережжя Туреччини, провінції Самсун, Синоп, Амасья, Токат і Трабзон; його грецьке населення виїхало під час обміну 1923 р."
  es:
    - "El Ponto es la tierra a lo largo de la costa sureste del mar Negro, el Ponto Euxino del que tomó su nombre: una costa estrecha y lluviosa con los puertos griegos de Sínope, Amiso y Trapezunte, y detrás las crestas paralelas de los montes Pónticos y los valles del Iris y del Lico, con Amasia y la ciudad-templo de Comana. Hacia 281 a. C. un noble persa, Mitrídates, fundó aquí un reino; su mayor rey, Mitrídates VI Eupátor, luchó contra Roma en tres guerras desde 89 a. C. y murió en 63 a. C., cuando Pompeyo unió la parte occidental de su reino con Bitinia como la provincia de Bitinia y Ponto y dio el resto a reyes clientes. El último de ellos, el reino de Polemón, fue anexionado bajo Nerón en 64 d. C. Estrabón, el geógrafo, nació en Amasia y describió con esmero su tierra natal."
    - "En el Nuevo Testamento había judíos del Ponto entre los que oyeron a los apóstoles en Pentecostés; Aquila, compañero de oficio de Pablo como fabricante de tiendas y su anfitrión en Corinto, era «un Judío llamado Aquila, natural del Ponto», que con su mujer Priscila había salido de Roma cuando Claudio expulsó a los judíos, y la pareja fue después con Pablo a Éfeso y recibió saludos en su carta a Roma; y la Primera Epístola de Pedro está dirigida «á los extranjeros esparcidos en Ponto, en Galacia, en Capadocia, en Asia, y en Bithinia». El Ponto figura el primero en esa lista, quizá porque el portador de la carta desembarcó en un puerto póntico y recorrió las provincias en ese orden, una sugerencia que no puede probarse."
    - "En 111 d. C. Plinio el Joven, gobernador de Bitinia y Ponto, escribió a Trajano, probablemente desde la costa póntica, que los cristianos eran muchos, de toda edad y condición, en las ciudades, aldeas y campos, y que los templos habían quedado casi desiertos; la respuesta del emperador fijó la práctica romana durante un siglo. Aquila del Ponto, que tradujo el Antiguo Testamento al griego para los judíos en el siglo II, y Marción, hijo de un obispo de Sínope, procedían de esta tierra, y en el siglo III Gregorio Taumaturgo fue obispo de Neocesarea. El Ponto es hoy la costa del mar Negro de Turquía, las provincias de Samsun, Sinop, Amasya, Tokat y Trabzon; su población griega se marchó en el intercambio de 1923."
  pt:
    - "O Ponto é a terra ao longo da costa sudeste do Mar Negro, o Ponto Euxino de que tomou o nome: uma costa estreita e chuvosa com os portos gregos de Sinope, Amiso e Trapezunte e, atrás dela, as cristas paralelas das montanhas pônticas e os vales do Íris e do Lico, com Amaseia e a cidade-templo de Comana. Por volta de 281 a.C., um nobre persa, Mitrídates, fundou aqui um reino; seu maior rei, Mitrídates VI Eupátor, combateu Roma em três guerras a partir de 89 a.C. e morreu em 63 a.C., quando Pompeu uniu a parte ocidental de seu reino à Bitínia como a província de Bitínia e Ponto e deu o resto a reis clientes. O último deles, o reino de Polemon, foi anexado sob Nero em 64 d.C. Estrabão, o geógrafo, nasceu em Amaseia e descreveu sua terra natal com cuidado."
    - "No Novo Testamento, judeus do Ponto estavam entre os que ouviram os apóstolos no Pentecostes; Áquila, companheiro de ofício de Paulo na fabricação de tendas e seu anfitrião em Corinto, era “um certo judeu chamado Áquila, natural do Ponto”, que com a mulher Priscila deixara Roma quando Cláudio expulsou os judeus, e o casal depois foi com Paulo a Éfeso e foi saudado em sua carta a Roma; e a Primeira Epístola de Pedro é dirigida “aos eleitos que vivem como estrangeiros na Dispersão no Ponto, Galácia, Capadócia, Ásia e Bitínia”. O Ponto vem primeiro nessa lista, talvez porque o portador da carta desembarcou num porto pôntico e percorreu as províncias nessa ordem, sugestão que não pode ser provada."
    - "Em 111 d.C., Plínio, o Jovem, governador da Bitínia e Ponto, escreveu a Trajano, provavelmente da costa pôntica, que os cristãos eram muitos, de todas as idades e condições, nas cidades, aldeias e campos, e que os templos estavam quase desertos; a resposta do imperador fixou a prática romana por um século. Áquila do Ponto, que traduziu o Antigo Testamento para o grego para os judeus no século II, e Marcião, filho de um bispo de Sinope, vieram dessa região, e no século III Gregório Taumaturgo foi bispo de Neocesareia. O Ponto é hoje a costa do Mar Negro da Turquia, as províncias de Samsun, Sinop, Amasya, Tokat e Trabzon; sua população grega partiu na troca de 1923."
  de:
    - "Pontus ist das Land an der südöstlichen Küste des Schwarzen Meeres, des Pontos Euxeinos, nach dem es benannt ist: eine schmale, regenreiche Küste mit den griechischen Häfen Sinope, Amisos und Trapezunt, dahinter die parallelen Ketten des Pontischen Gebirges und die Täler des Iris und des Lykos, mit Amaseia und der Tempelstadt Komana. Um 281 v. Chr. gründete ein persischer Adliger, Mithridates, hier ein Königreich; sein größter König, Mithridates VI. Eupator, führte ab 89 v. Chr. drei Kriege gegen Rom und starb 63 v. Chr., als Pompeius den westlichen Teil seines Reiches mit Bithynien zur Provinz Bithynia et Pontus vereinte und den Rest Klientelkönigen gab. Das letzte dieser Reiche, das des Polemon, wurde 64 n. Chr. unter Nero annektiert. Strabon, der Geograph, wurde in Amaseia geboren und beschrieb seine Heimat sorgfältig."
    - "Im Neuen Testament waren Juden aus Pontus unter denen, die zu Pfingsten die Apostel hörten; Paulus „fand einen Juden mit Namen Aquila, von Geburt aus Pontus“, in Korinth seinen Zeltmacher-Genossen und Gastgeber, der mit seiner Frau Priscilla Rom verlassen hatte, als Klaudius die Juden auswies, und das Paar ging später mit Paulus nach Ephesus und wird in seinem Brief nach Rom gegrüßt; und der Erste Petrusbrief ist gerichtet „den erwählten Fremdlingen hin und her in Pontus, Galatien, Kappadozien, Asien und Bithynien“. Pontus steht in dieser Liste an erster Stelle, vielleicht weil der Überbringer des Briefes in einem pontischen Hafen landete und die Provinzen in dieser Reihenfolge durchzog, was sich nicht beweisen lässt."
    - "Im Jahr 111 n. Chr. schrieb Plinius der Jüngere als Statthalter von Bithynien und Pontus an Trajan, wohl von der pontischen Küste, die Christen seien zahlreich, jeden Alters und Standes, in Städten, Dörfern und auf dem Land, und die Tempel fast verödet; die Antwort des Kaisers bestimmte die römische Praxis für ein Jahrhundert. Aquila von Pontus, der im 2. Jahrhundert das Alte Testament für die Juden ins Griechische übersetzte, und Marcion, Sohn eines Bischofs von Sinope, stammten aus dem Land, und im 3. Jahrhundert war Gregor der Wundertäter Bischof von Neokaisareia. Pontus ist heute die Schwarzmeerküste der Türkei, die Provinzen Samsun, Sinop, Amasya, Tokat und Trabzon; seine griechische Bevölkerung verließ es im Austausch von 1923."
  fr:
    - "Le Pont est le pays le long de la rive sud-est de la mer Noire, le Pont-Euxin dont il tire son nom : côte étroite et pluvieuse avec les ports grecs de Sinope, d’Amisos et de Trapézonte, et derrière elle les chaînes parallèles des monts pontiques et les vallées de l’Iris et du Lycos, avec Amasée et la ville-temple de Comana. Vers 281 av. J.-C., un noble perse, Mithridate, y fonda un royaume ; son plus grand roi, Mithridate VI Eupator, fit trois guerres à Rome dès 89 av. J.-C. et mourut en 63 av. J.-C., quand Pompée joignit la partie occidentale de son royaume à la Bithynie en province de Bithynie et Pont et donna le reste à des rois clients. Le dernier, le royaume de Polémon, fut annexé sous Néron en 64 apr. J.-C. Strabon, le géographe, naquit à Amasée et décrivit avec soin sa patrie."
    - "Dans le Nouveau Testament, des Juifs du Pont étaient parmi ceux qui entendirent les apôtres à la Pentecôte ; Aquilas, compagnon de métier de Paul, faiseur de tentes comme lui, et son hôte à Corinthe, était « un Juif nommé Aquilas, originaire du Pont », qui avait quitté Rome avec sa femme Priscille quand Claude expulsa les Juifs, et le couple alla plus tard avec Paul à Éphèse et fut salué dans sa lettre aux Romains ; et la Première Épître de Pierre s’adresse « à ceux qui sont étrangers et dispersés dans le Pont, la Galatie, la Cappadoce, l’Asie et la Bithynie ». Le Pont figure en tête de cette liste, peut-être parce que le porteur de la lettre aborda dans un port pontique et fit le tour des provinces dans cet ordre, hypothèse impossible à prouver."
    - "En 111 apr. J.-C., Pline le Jeune, gouverneur de Bithynie et Pont, écrivit à Trajan, probablement depuis la côte pontique, que les chrétiens étaient nombreux, de tout âge et de tout rang, dans les villes, les villages et les campagnes, et que les temples étaient presque désertés ; la réponse de l’empereur fixa la pratique romaine pour un siècle. Aquila du Pont, qui traduisit l’Ancien Testament en grec pour les Juifs au IIe siècle, et Marcion, fils d’un évêque de Sinope, venaient de ce pays, et au IIIe siècle Grégoire le Thaumaturge fut évêque de Néocésarée. Le Pont est aujourd’hui la côte turque de la mer Noire, les provinces de Samsun, Sinop, Amasya, Tokat et Trabzon ; sa population grecque partit lors de l’échange de 1923."
