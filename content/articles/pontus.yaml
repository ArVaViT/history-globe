body:
  en:
    - "Pontus is the land along the south-eastern shore of the Black Sea, the Pontus Euxinus from which it took its name: a narrow, rainy coast with the Greek ports of Sinope, Amisus and Trapezus, and behind it the parallel ridges of the Pontic mountains and the valleys of the Iris and the Lycus, with Amaseia and the temple city of Comana. About 281 BC a Persian noble, Mithridates, founded a kingdom here; its greatest king, Mithridates VI Eupator, fought Rome in three wars from 89 BC and died in 63 BC, when Pompey joined the western part of his kingdom with Bithynia as the province of Bithynia and Pontus and gave the rest to client kings. The last of these, the kingdom of Polemon, was annexed under Nero in the early 60s AD. Strabo, the geographer, was born at Amaseia and described his homeland with care."
    - "In the New Testament Jews from Pontus were among those who heard the apostles at Pentecost; Aquila, Paul's fellow tentmaker and host at Corinth, was “a certain Jew named Aquila, born in Pontus”, who with his wife Priscilla had left Rome when Claudius expelled the Jews, and the couple later went with Paul to Ephesus and were greeted in his letter to Rome; and the First Epistle of Peter is addressed “to the strangers scattered throughout Pontus, Galatia, Cappadocia, Asia, and Bithynia”. Pontus stands first in that list, perhaps because the letter's bearer landed at a Pontic port and went round the provinces in that order, a suggestion that cannot be proved."
    - "About AD 111 Pliny the Younger, governing Bithynia and Pontus, wrote to Trajan, probably from the Pontic coast, that the Christians were many, of every age and rank, in the towns, villages and countryside, and that the temples had been almost deserted; the emperor's reply fixed Roman practice for a century. Aquila of Pontus, who translated the Old Testament into Greek for the Jews in the second century, and Marcion, son of a bishop of Sinope, came from the country, and in the third century Gregory the Wonderworker was bishop of Neocaesarea. Pontus is today the Black Sea coast of Turkey, including the provinces of Samsun, Sinop, Amasya, Tokat and Trabzon; its Greek population left in the exchange of 1923."
  ru:
    - "Понт — земля вдоль юго-восточного берега Чёрного моря, Понта Евксинского, от которого она получила имя: узкое дождливое побережье с греческими гаванями Синопой, Амисом и Трапезунтом, а за ним параллельные гряды Понтийских гор и долины Ириса и Лика с Амасией и храмовым городом Команой. Около 281 г. до н. э. персидский вельможа Митридат основал здесь царство; величайший его царь, Митридат VI Евпатор, с 89 г. до н. э. вёл с Римом три войны и погиб в 63 г. до н. э., когда Помпей соединил западную часть его царства с Вифинией в провинцию Вифиния и Понт, а остальное отдал зависимым царям. Последнее из их владений, царство Полемона, было присоединено при Нероне в начале 60-х годов н. э. Географ Страбон родился в Амасии и описал свою родину с особой заботой."
    - "В Новом Завете Иудеи из Понта были среди слышавших апостолов в день Пятидесятницы; в Коринфе Павел нашёл «некоторого Иудея, именем Акилу, родом Понтянина, недавно пришедшего из Италии», товарища по ремеслу, который с женой Прискиллой покинул Рим, когда Клавдий изгнал Иудеев; потом чета отправилась с Павлом в Ефес и получила привет в его послании к Римлянам; Первое же послание Петра обращено «пришельцам, рассеянным в Понте, Галатии, Каппадокии, Асии и Вифинии». Понт стоит в этом списке первым — быть может, потому, что податель письма высадился в понтийской гавани и обошёл провинции в таком порядке; доказать это нельзя."
    - "Около 111 г. н. э. Плиний Младший, управляя Вифинией и Понтом, писал Траяну, вероятно, с понтийского берега, что христиан много, всякого возраста и звания, в городах, сёлах и по деревням, и что храмы почти опустели; ответ императора определил римскую практику на столетие. Из этой страны происходили Акила Понтийский, во II веке переведший Ветхий Завет на греческий для Иудеев, и Маркион, сын епископа Синопы, а в III веке Григорий Чудотворец был епископом Неокесарии. Понт сегодня — черноморское побережье Турции, в том числе провинции Самсун, Синоп, Амасья, Токат и Трабзон; его греческое население ушло при обмене 1923 года."
  uk:
    - "Понт — край уздовж південно-східного берега Чорного моря, Понту Евксинського, від якого він узяв назву: вузьке дощове узбережжя з грецькими портами Синоп, Аміс і Трапезунт, а за ним — паралельні хребти Понтійських гір і долини Іриса та Ліка, з Амасією й храмовим містом Команою. Близько 281 р. до н. е. перський вельможа Мітридат заснував тут царство; його найвидатніший цар, Мітридат VI Євпатор, вів проти Риму три війни з 89 р. до н. е. і помер 63 р. до н. е., коли Помпей з’єднав західну частину його царства з Віфінією в провінцію Віфінія й Понт, а решту віддав залежним царям. Останнє з них, царство Полемона, було приєднане за Нерона на початку 60-х рр. н. е. Географ Страбон народився в Амасії й дбайливо описав свою батьківщину."
    - "У Новому Завіті юдеї з Понту були серед тих, хто чув апостолів у день П’ятдесятниці; у Коринті Павло знайшов «одного Жидовина, на ймя Авкилу, родом Понтянина» — свого товариша з виготовлення наметів і господаря; той разом із дружиною Прискиллою залишив Рим, коли Клавдій вигнав юдеїв, подружжя пізніше вирушило з Павлом до Ефеса, і їх вітають у його листі до Риму; а Перше послання Петра адресоване «вибраним захожанам розсїяння по Понту, Галатиї, Кападокиї, Азиї і Витиниї». Понт стоїть першим у цьому переліку, можливо, тому, що той, хто віз листа, висадився в понтійському порту й обійшов провінції в такому порядку; довести це припущення неможливо."
    - "Близько 111 р. н. е. Пліній Молодший, керуючи Віфінією й Понтом, писав Траянові, ймовірно з понтійського узбережжя, що християн багато, будь-якого віку й стану, в містах, селах і сільській місцевості, і що храми майже спорожніли; відповідь імператора встановила римську практику на століття. Акила з Понту, який у II ст. переклав Старий Завіт грецькою для юдеїв, і Маркіон, син єпископа Синопа, походили з цього краю, а в III ст. Григорій Чудотворець був єпископом Неокесарії. Сьогодні Понт — чорноморське узбережжя Туреччини, зокрема провінції Самсун, Синоп, Амасья, Токат і Трабзон; його грецьке населення виїхало під час обміну 1923 р."
  es:
    - "El Ponto es la tierra a lo largo de la costa sureste del mar Negro, el Ponto Euxino del que tomó su nombre: una costa estrecha y lluviosa con los puertos griegos de Sínope, Amiso y Trapezunte, y detrás las crestas paralelas de los montes Pónticos y los valles del Iris y del Lico, con Amasia y la ciudad-templo de Comana. Hacia 281 a. C. un noble persa, Mitrídates, fundó aquí un reino; su mayor rey, Mitrídates VI Eupátor, luchó contra Roma en tres guerras desde 89 a. C. y murió en 63 a. C., cuando Pompeyo unió la parte occidental de su reino con Bitinia como la provincia de Bitinia y Ponto y dio el resto a reyes clientes. El último de ellos, el reino de Polemón, fue anexionado bajo Nerón a comienzos de los años 60 d. C. Estrabón, el geógrafo, nació en Amasia y describió con esmero su tierra natal."
    - "En el Nuevo Testamento había judíos del Ponto entre los que oyeron a los apóstoles en Pentecostés; Aquila, compañero de oficio de Pablo como fabricante de tiendas y su anfitrión en Corinto, era «un Judío llamado Aquila, natural del Ponto», que con su mujer Priscila había salido de Roma cuando Claudio expulsó a los judíos, y la pareja fue después con Pablo a Éfeso y recibió saludos en su carta a Roma; y la Primera Epístola de Pedro está dirigida «á los extranjeros esparcidos en Ponto, en Galacia, en Capadocia, en Asia, y en Bithinia». El Ponto figura el primero en esa lista, quizá porque el portador de la carta desembarcó en un puerto póntico y recorrió las provincias en ese orden, una sugerencia que no puede probarse."
    - "Hacia 111 d. C. Plinio el Joven, gobernador de Bitinia y Ponto, escribió a Trajano, probablemente desde la costa póntica, que los cristianos eran muchos, de toda edad y condición, en las ciudades, aldeas y campos, y que los templos habían quedado casi desiertos; la respuesta del emperador fijó la práctica romana durante un siglo. Aquila del Ponto, que tradujo el Antiguo Testamento al griego para los judíos en el siglo II, y Marción, hijo de un obispo de Sínope, procedían de esta tierra, y en el siglo III Gregorio Taumaturgo fue obispo de Neocesarea. El Ponto es hoy la costa del mar Negro de Turquía, incluidas las provincias de Samsun, Sinop, Amasya, Tokat y Trabzon; su población griega se marchó en el intercambio de 1923."
  pt:
    - "O Ponto é a terra ao longo da costa sudeste do Mar Negro, o Ponto Euxino de que tomou o nome: uma costa estreita e chuvosa com os portos gregos de Sinope, Amiso e Trapezunte e, atrás dela, as cristas paralelas das montanhas pônticas e os vales do Íris e do Lico, com Amaseia e a cidade-templo de Comana. Por volta de 281 a.C., um nobre persa, Mitrídates, fundou aqui um reino; seu maior rei, Mitrídates VI Eupátor, combateu Roma em três guerras a partir de 89 a.C. e morreu em 63 a.C., quando Pompeu uniu a parte ocidental de seu reino à Bitínia como a província de Bitínia e Ponto e deu o resto a reis clientes. O último deles, o reino de Polemon, foi anexado sob Nero no início dos anos 60 d.C. Estrabão, o geógrafo, nasceu em Amaseia e descreveu sua terra natal com cuidado."
    - "No Novo Testamento, judeus do Ponto estavam entre os que ouviram os apóstolos no Pentecostes; Áquila, companheiro de ofício de Paulo na fabricação de tendas e seu anfitrião em Corinto, era “um certo judeu chamado Áquila, natural do Ponto”, que com a mulher Priscila deixara Roma quando Cláudio expulsou os judeus, e o casal depois foi com Paulo a Éfeso e foi saudado em sua carta a Roma; e a Primeira Epístola de Pedro é dirigida “aos eleitos que vivem como estrangeiros na Dispersão no Ponto, Galácia, Capadócia, Ásia e Bitínia”. O Ponto vem primeiro nessa lista, talvez porque o portador da carta desembarcou num porto pôntico e percorreu as províncias nessa ordem, sugestão que não pode ser provada."
    - "Por volta de 111 d.C., Plínio, o Jovem, governador da Bitínia e Ponto, escreveu a Trajano, provavelmente da costa pôntica, que os cristãos eram muitos, de todas as idades e condições, nas cidades, aldeias e campos, e que os templos estavam quase desertos; a resposta do imperador fixou a prática romana por um século. Áquila do Ponto, que traduziu o Antigo Testamento para o grego para os judeus no século II, e Marcião, filho de um bispo de Sinope, vieram dessa região, e no século III Gregório Taumaturgo foi bispo de Neocesareia. O Ponto é hoje a costa do Mar Negro da Turquia, incluindo as províncias de Samsun, Sinop, Amasya, Tokat e Trabzon; sua população grega partiu na troca de 1923."
  de:
    - "Pontus ist das Land an der südöstlichen Küste des Schwarzen Meeres, des Pontos Euxeinos, nach dem es benannt ist: eine schmale, regenreiche Küste mit den griechischen Häfen Sinope, Amisos und Trapezunt, dahinter die parallelen Ketten des Pontischen Gebirges und die Täler des Iris und des Lykos, mit Amaseia und der Tempelstadt Komana. Um 281 v. Chr. gründete ein persischer Adliger, Mithridates, hier ein Königreich; sein größter König, Mithridates VI. Eupator, führte ab 89 v. Chr. drei Kriege gegen Rom und starb 63 v. Chr., als Pompeius den westlichen Teil seines Reiches mit Bithynien zur Provinz Bithynia et Pontus vereinte und den Rest Klientelkönigen gab. Das letzte dieser Reiche, das des Polemon, wurde Anfang der 60er Jahre n. Chr. unter Nero annektiert. Strabon, der Geograph, wurde in Amaseia geboren und beschrieb seine Heimat sorgfältig."
    - "Im Neuen Testament waren Juden aus Pontus unter denen, die zu Pfingsten die Apostel hörten; Paulus „fand einen Juden mit Namen Aquila, von Geburt aus Pontus“, in Korinth seinen Zeltmacher-Genossen und Gastgeber, der mit seiner Frau Priscilla Rom verlassen hatte, als Klaudius die Juden auswies, und das Paar ging später mit Paulus nach Ephesus und wird in seinem Brief nach Rom gegrüßt; und der Erste Petrusbrief ist gerichtet „den erwählten Fremdlingen hin und her in Pontus, Galatien, Kappadozien, Asien und Bithynien“. Pontus steht in dieser Liste an erster Stelle, vielleicht weil der Überbringer des Briefes in einem pontischen Hafen landete und die Provinzen in dieser Reihenfolge durchzog, was sich nicht beweisen lässt."
    - "Um 111 n. Chr. schrieb Plinius der Jüngere als Statthalter von Bithynien und Pontus an Trajan, wohl von der pontischen Küste, die Christen seien zahlreich, jeden Alters und Standes, in Städten, Dörfern und auf dem Land, und die Tempel fast verödet; die Antwort des Kaisers bestimmte die römische Praxis für ein Jahrhundert. Aquila von Pontus, der im 2. Jahrhundert das Alte Testament für die Juden ins Griechische übersetzte, und Marcion, Sohn eines Bischofs von Sinope, stammten aus dem Land, und im 3. Jahrhundert war Gregor der Wundertäter Bischof von Neokaisareia. Pontus ist heute die Schwarzmeerküste der Türkei, darunter die Provinzen Samsun, Sinop, Amasya, Tokat und Trabzon; seine griechische Bevölkerung verließ es im Austausch von 1923."
  fr:
    - "Le Pont est le pays le long de la rive sud-est de la mer Noire, le Pont-Euxin dont il tire son nom : côte étroite et pluvieuse avec les ports grecs de Sinope, d’Amisos et de Trapézonte, et derrière elle les chaînes parallèles des monts pontiques et les vallées de l’Iris et du Lycos, avec Amasée et la ville-temple de Comana. Vers 281 av. J.-C., un noble perse, Mithridate, y fonda un royaume ; son plus grand roi, Mithridate VI Eupator, fit trois guerres à Rome dès 89 av. J.-C. et mourut en 63 av. J.-C., quand Pompée joignit la partie occidentale de son royaume à la Bithynie en province de Bithynie et Pont et donna le reste à des rois clients. Le dernier, le royaume de Polémon, fut annexé sous Néron au début des années 60 apr. J.-C. Strabon, le géographe, naquit à Amasée et décrivit avec soin sa patrie."
    - "Dans le Nouveau Testament, des Juifs du Pont étaient parmi ceux qui entendirent les apôtres à la Pentecôte ; Aquilas, compagnon de métier de Paul, faiseur de tentes comme lui, et son hôte à Corinthe, était « un Juif nommé Aquilas, originaire du Pont », qui avait quitté Rome avec sa femme Priscille quand Claude expulsa les Juifs, et le couple alla plus tard avec Paul à Éphèse et fut salué dans sa lettre aux Romains ; et la Première Épître de Pierre s’adresse « à ceux qui sont étrangers et dispersés dans le Pont, la Galatie, la Cappadoce, l’Asie et la Bithynie ». Le Pont figure en tête de cette liste, peut-être parce que le porteur de la lettre aborda dans un port pontique et fit le tour des provinces dans cet ordre, hypothèse impossible à prouver."
    - "Vers 111 apr. J.-C., Pline le Jeune, gouverneur de Bithynie et Pont, écrivit à Trajan, probablement depuis la côte pontique, que les chrétiens étaient nombreux, de tout âge et de tout rang, dans les villes, les villages et les campagnes, et que les temples étaient presque désertés ; la réponse de l’empereur fixa la pratique romaine pour un siècle. Aquila du Pont, qui traduisit l’Ancien Testament en grec pour les Juifs au IIe siècle, et Marcion, fils d’un évêque de Sinope, venaient de ce pays, et au IIIe siècle Grégoire le Thaumaturge fut évêque de Néocésarée. Le Pont est aujourd’hui la côte turque de la mer Noire, dont les provinces de Samsun, Sinop, Amasya, Tokat et Trabzon ; sa population grecque partit lors de l’échange de 1923."
  it:
    - "Il Ponto è la terra lungo la riva sud-orientale del Mar Nero, il Pontus Euxinus da cui prese il nome: una costa stretta e piovosa con i porti greci di Sinope, Amiso e Trapezunte, e dietro di essa le dorsali parallele dei monti Pontici e le valli dell’Iris e del Lico, con Amasea e la città-tempio di Comana. Verso il 281 a.C. un nobile persiano, Mitridate, vi fondò un regno; il suo più grande sovrano, Mitridate VI Eupatore, combatté Roma in tre guerre dall’89 a.C. e morì nel 63 a.C., quando Pompeo unì la parte occidentale del suo regno con la Bitinia nella provincia di Bitinia e Ponto e diede il resto a re clienti. L’ultimo di essi, il regno di Polemone, fu annesso sotto Nerone all’inizio degli anni 60 d.C. Strabone, il geografo, nacque ad Amasea e descrisse con cura la sua patria."
    - "Nel Nuovo Testamento Ebrei del Ponto erano tra coloro che ascoltarono gli apostoli alla Pentecoste; Aquila, compagno di Paolo nel mestiere di fabbricante di tende e suo ospite a Corinto, era «un certo Giudeo, per nome Aquila, oriundo del Ponto», che con la moglie Priscilla aveva lasciato Roma quando Claudio espulse i Giudei, e la coppia andò poi con Paolo a Efeso e fu salutata nella sua lettera a Roma; e la Prima lettera di Pietro è indirizzata «agli eletti che vivono come forestieri nella dispersione del Ponto, della Galazia, della Cappadocia, dell’Asia e della Bitinia». Il Ponto è il primo in quell’elenco, forse perché il portatore della lettera sbarcò in un porto pontico e fece il giro delle province in quell’ordine, una congettura che non si può provare."
    - "Verso il 111 d.C. Plinio il Giovane, governatore della Bitinia e del Ponto, scrisse a Traiano, probabilmente dalla costa pontica, che i cristiani erano molti, di ogni età e condizione, nelle città, nei villaggi e nelle campagne, e che i templi erano quasi deserti; la risposta dell’imperatore fissò la prassi romana per un secolo. Aquila del Ponto, che nel II secolo tradusse in greco l’Antico Testamento per gli Ebrei, e Marcione, figlio di un vescovo di Sinope, vennero da quel paese, e nel III secolo Gregorio Taumaturgo fu vescovo di Neocesarea. Il Ponto è oggi la costa turca del Mar Nero, comprese le province di Samsun, Sinope, Amasya, Tokat e Trabzon; la sua popolazione greca se ne andò con lo scambio del 1923."
  pl:
    - "Pont to kraina wzdłuż południowo-wschodniego brzegu Morza Czarnego, Pontus Euxinus, od którego wzięła nazwę: wąskie, deszczowe wybrzeże z greckimi portami Synopa, Amisos i Trapezunt, a za nim równoległe grzbiety gór Pontyjskich oraz doliny Irysu i Likosu, z Amazeją i świątynnym miastem Komana. Około 281 roku p.n.e. perski szlachcic Mitrydates założył tu królestwo; jego największy król, Mitrydates VI Eupator, walczył z Rzymem w trzech wojnach od 89 roku p.n.e. i zmarł w 63, gdy Pompejusz połączył zachodnią część jego królestwa z Bitynią w prowincję Bitynia i Pont, a resztę oddał królom zależnym. Ostatni z nich, królestwo Polemona, został przyłączony za Nerona na początku lat 60. n.e. Geograf Strabon urodził się w Amazei i starannie opisał swoją ojczyznę."
    - "W Nowym Testamencie Żydzi z Pontu byli wśród tych, którzy słuchali apostołów w Pięćdziesiątnicę; Paweł znalazł w Koryncie „niektórego Żyda, imieniem Akwilas, rodem z Pontu”, wytwórcę namiotów jak on sam i gospodarza; Akwila z żoną Pryscyllą opuścił Rzym, gdy Klaudiusz wypędził Żydów, para później poszła z Pawłem do Efezu i została pozdrowiona w jego liście do Rzymu; a Pierwszy List Piotra jest skierowany „przychodniom rozproszonym w Poncie, w Galacyi, w Kapadocyi, w Azji i w Bitynii”. Pont stoi na pierwszym miejscu tej listy, może dlatego, że posłaniec listu wylądował w pontyjskim porcie i objeżdżał prowincje w tej kolejności, czego nie da się udowodnić."
    - "Około 111 roku n.e. Pliniusz Młodszy, namiestnik Bitynii i Pontu, napisał do Trajana, prawdopodobnie z wybrzeża pontyjskiego, że chrześcijan jest wielu, w każdym wieku i stanie, w miastach, wsiach i na wsi, a świątynie prawie opustoszały; odpowiedź cesarza ustaliła rzymską praktykę na sto lat. Akwila z Pontu, który w II wieku przełożył Stary Testament na grecki dla Żydów, i Marcjon, syn biskupa Synopy, pochodzili z tego kraju, a w III wieku Grzegorz Cudotwórca był biskupem Neocezarei. Pont to dziś czarnomorskie wybrzeże Turcji, w tym prowincje Samsun, Sinop, Amasya, Tokat i Trabzon; jego grecka ludność wyjechała w wymianie w 1923 roku."
  cs:
    - "Pontus je země podél jihovýchodního pobřeží Černého moře, Pontu Euxeinského, od něhož dostala jméno: úzké, deštivé pobřeží s řeckými přístavy Sinópé, Amisos a Trapezús a za ním rovnoběžné hřebeny Pontského pohoří a údolí Iridu a Lyku, s Amaseií a chrámovým městem Komana. Asi roku 281 př. n. l. zde perský šlechtic Mithridatés založil království; jeho největší král, Mithridatés VI. Eupator, vedl s Římem tři války od roku 89 př. n. l. a zemřel roku 63 př. n. l., kdy Pompeius spojil západní část jeho království s Bithýnií jako provincii Bithýnii a Pontus a zbytek dal závislým králům. Posledního z nich, království Polemónovo, připojil za Nerona na počátku 60. let n. l. Římu. Geograf Strabón se narodil v Amaseii a svou vlast pečlivě popsal."
    - "V Novém zákoně byli Židé z Pontu mezi těmi, kdo slyšeli apoštoly o Letnicích; v Korintu Pavel „nalezl jednoho Žida, jménem Akvilu, jenž byl rodem z Pontu“, svého druha ve stanařském řemesle a hostitele, který s manželkou Priscillou opustil Řím, když Klaudius vyhnal Židy; oba později šli s Pavlem do Efezu a byli pozdraveni v jeho listu do Říma; a První list Petrův je adresován „příchozím rozptýleným v Pontu, Galacii, Kappadocii, v Azii a v Bitynii“. Pontus stojí v tomto seznamu první, snad proto, že nositel listu přistál v pontském přístavu a obešel provincie v tomto pořadí, což nelze dokázat."
    - "Kolem roku 111 n. l. psal Plinius Mladší, místodržitel Bithýnie a Pontu, Traianovi, pravděpodobně z pontského pobřeží, že křesťanů je mnoho, každého věku a stavu, ve městech, vesnicích i na venkově, a že chrámy byly téměř opuštěny; císařova odpověď určila římskou praxi na sto let. Akvila z Pontu, který ve 2. století přeložil Starý zákon do řečtiny pro Židy, a Markión, syn sinópského biskupa, pocházeli z této země a ve 3. století byl biskupem v Neokaisareji Řehoř Divotvorce. Pontus je dnes černomořské pobřeží Turecka, mimo jiné provincie Samsun, Sinop, Amasya, Tokat a Trabzon; jeho řecké obyvatelstvo odešlo při výměně roku 1923."
  nl:
    - "Pontus is het land langs de zuidoostkust van de Zwarte Zee, de Pontus Euxinus waaraan het zijn naam dankt: een smalle, regenrijke kust met de Griekse havens Sinope, Amisos en Trapezus, en erachter de parallelle ruggen van het Pontische gebergte en de dalen van de Iris en de Lykos, met Amaseia en de tempelstad Comana. Omstreeks 281 v.Chr. stichtte een Perzische edele, Mithridates, hier een koninkrijk; zijn grootste koning, Mithridates VI Eupator, voerde vanaf 89 v.Chr. drie oorlogen tegen Rome en stierf in 63 v.Chr., toen Pompeius het westelijke deel van zijn rijk met Bithynië verenigde tot de provincie Bithynië en Pontus en de rest aan vazalkoningen gaf. De laatste daarvan, het koninkrijk van Polemon, werd begin jaren 60 n.Chr. onder Nero geannexeerd. De geograaf Strabo werd te Amaseia geboren en beschreef zijn vaderland zorgvuldig."
    - "In het Nieuwe Testament behoorden Joden uit Pontus tot hen die de apostelen met Pinksteren hoorden; Aquila, Paulus’ mede-tentenmaker en gastheer te Korinthe, was “een zekeren Jood, met name Aquila, van geboorte uit Pontus”, die met zijn vrouw Priscilla Rome had verlaten toen Claudius de Joden verbande, en het paar ging later met Paulus naar Efeze en wordt in zijn brief aan Rome gegroet; en de Eerste Brief van Petrus is gericht “aan de vreemdelingen, verstrooid in Pontus, Galatië, Kappadocië, Azië en Bithynië”. Pontus staat vooraan in die lijst, misschien omdat de brenger van de brief in een Pontische haven landde en de provincies in die volgorde afliep, een veronderstelling die niet te bewijzen is."
    - "Omstreeks 111 n.Chr. schreef Plinius de Jongere, bestuurder van Bithynië en Pontus, aan Trajanus, waarschijnlijk vanaf de Pontische kust, dat de christenen talrijk waren, van elke leeftijd en rang, in steden, dorpen en op het platteland, en dat de tempels bijna verlaten waren; het antwoord van de keizer legde de Romeinse praktijk voor een eeuw vast. Aquila van Pontus, die in de 2e eeuw het Oude Testament voor de Joden in het Grieks vertaalde, en Marcion, zoon van een bisschop van Sinope, kwamen uit dit land, en in de 3e eeuw was Gregorius de Wonderdoener bisschop van Neocaesarea. Pontus is nu de Zwarte Zeekust van Turkije, waaronder de provincies Samsun, Sinop, Amasya, Tokat en Trabzon; de Griekse bevolking vertrok bij de uitwisseling van 1923."
  sv:
    - "Pontos är landet längs Svarta havets sydöstra strand, Pontos Euxeinos varifrån det fick sitt namn: en smal, regnig kust med de grekiska hamnarna Sinope, Amisos och Trapezus, och bakom den de parallella ryggarna av de pontiska bergen och dalarna längs Iris och Lykos, med Amaseia och tempelstaden Comana. Omkring 281 f.Kr. grundade en persisk adelsman, Mithridates, ett kungarike här; dess störste kung, Mithridates VI Eupator, förde tre krig mot Rom från 89 f.Kr. och dog 63 f.Kr., då Pompejus förenade den västra delen av hans rike med Bitynien som provinsen Bitynien och Pontos och gav resten åt vasallkungar. Den siste av dessa, Polemons rike, annekterades under Nero i början av 60-talet e.Kr. Geografen Strabon föddes i Amaseia och beskrev sitt hemland noggrant."
    - "I Nya testamentet fanns judar från Pontos bland dem som hörde apostlarna vid pingst; Aquila, Paulus medtältmakare och värd i Korinth, var ”en jude vid namn Akvila, bördig från Pontus”, som med sin hustru Priscilla hade lämnat Rom när Claudius utvisade judarna, och paret följde senare med Paulus till Efesos och hälsas i hans brev till Rom; och Första Petrusbrevet riktas till ”de utvalda främlingar som bo kringspridda i Pontus, Galatien, Kappadocien, provinsen Asien och Bitynien”. Pontos står först i den listan, kanske därför att brevets överbringare landade i en pontisk hamn och gick runt provinserna i den ordningen, ett förslag som inte kan bevisas."
    - "Omkring år 111 skrev Plinius den yngre, som styrde Bitynien och Pontos, till Trajanus, sannolikt från den pontiska kusten, att de kristna var många, av alla åldrar och stånd, i städerna, byarna och på landsbygden, och att templen nästan hade övergivits; kejsarens svar fastställde romersk praxis för ett århundrade. Aquila från Pontos, som på 100-talet översatte Gamla testamentet till grekiska åt judarna, och Marcion, son till en biskop av Sinope, kom från landet, och på 200-talet var Gregorios Thaumaturgos biskop av Neokaisareia. Pontos är i dag Turkiets Svartahavskust, med provinserna Samsun, Sinop, Amasya, Tokat och Trabzon; dess grekiska befolkning lämnade det i befolkningsutbytet 1923."
  nb:
    - "Pontos er landet langs sørøstkysten av Svartehavet, Pontus Euxinus, som det har navnet fra: en smal, regnfull kyst med de greske havnene Sinope, Amisos og Trapezous, og bak den de parallelle åsene i Pontos-fjellene og dalene til Iris og Lykos, med Amaseia og tempelbyen Komana. Omkring 281 f.Kr. grunnla en persisk adelsmann, Mithridates, et kongerike her; dets største konge, Mithridates VI Eupator, kjempet mot Roma i tre kriger fra 89 f.Kr. og døde i 63 f.Kr., da Pompeius forente den vestlige delen av riket hans med Bitynia som provinsen Bitynia og Pontos og ga resten til lydkonger. Den siste av dem, Polemons rike, ble annektert under Nero tidlig på 60-tallet e.Kr. Geografen Strabon ble født i Amaseia og beskrev hjemlandet sitt nøye."
    - "I Det nye testamente var jøder fra Pontos blant dem som hørte apostlene på pinsedagen; Akvilas, Paulus' medtelmaker og vert i Korint, var «en jøde ved navn Akvilas, født i Pontus», som sammen med sin hustru Priskilla hadde forlatt Roma da Klaudius utviste jødene, og paret fulgte senere Paulus til Efesos og ble hilst i hans brev til Roma; og Første Petersbrev er adressert «til de utlendinger som er spredt omkring i Pontus, Galatia, Kappadokia, Asia og Bitynia». Pontos står først i den listen, kanskje fordi brevets overbringer gikk i land i en pontisk havn og gikk rundt provinsene i den rekkefølgen, en antakelse som ikke kan bevises."
    - "Omkring 111 e.Kr. skrev Plinius den yngre, som styrte Bitynia og Pontos, trolig fra den pontiske kysten, til Trajan at de kristne var mange, av alle aldre og stand, i byene, landsbyene og på landsbygda, og at tempelene nesten var forlatt; keiserens svar fastla romersk praksis i et århundre. Akvilas fra Pontos, som oversatte Det gamle testamente til gresk for jødene på 100-tallet, og Markion, sønn av en biskop i Sinope, kom fra landet, og på 200-tallet var Gregorios Thaumaturgos biskop i Neocæsarea. Pontos er i dag Tyrkias Svartehavskyst, med provinsene Samsun, Sinop, Amasya, Tokat og Trabzon; den greske befolkningen dro i utvekslingen i 1923."
  tl:
    - "Ang Ponto ay lupain sa timog-silangang baybayin ng Dagat Itim, ang Pontus Euxinus, pinagmulan ng pangalan: makipot at maulang baybayin, may daungang Griyego ng Sinope, Amisus at Trapezus, at sa likod nito ang magkatulad na tagaytay ng bundok ng Ponto at libis ng Iris at Lycus, kasama ang Amaseia at lungsod-templong Comana. Mga 281 BK, nagtatag dito ng kaharian ang Persiyanong maharlika na si Mithridates; ang pinakadakila nitong hari, si Mithridates VI Eupator, ay nakipagdigma sa Roma nang tatlong beses mula 89 BK at namatay noong 63 BK, nang gawing lalawigan ng Bitinia at Ponto ni Pompeyo ang kanlurang bahagi nito at ang Bitinia, at ibigay ang natira sa mga haring tagasunod. Ang huli, ang kaharian ni Polemon, ay isinama ni Nero noong unang bahagi ng dekada 60 AD. Si Strabo, ang heograpo, ay isinilang sa Amaseia at maingat na inilarawan ang kaniyang bayan."
    - "Sa Bagong Tipan, kabilang ang mga Judio mula sa Ponto sa mga nakarinig sa mga apostol noong Pentecostes; si Aquila, kapwa gumagawa ng tolda at punong-abala ni Pablo sa Corinto, ay “isang Judio na nagngangalang Aquila, isang lalaking tubo sa Ponto”, na kasama ni Priscila na kaniyang asawa ay umalis sa Roma nang paalisin ni Claudio ang mga Judio, at ang mag-asawa ay sumama kalaunan kay Pablo sa Efeso at binati sa kaniyang liham sa Roma; at ang Unang Sulat ni Pedro ay nakatuon “sa mga hinirang na nangingibang bayan na nasa Pangangalat sa Ponto, Galacia, Capadocia, Asia at Bitinia”. Nangunguna ang Ponto sa listahang iyon, marahil dahil dumaong sa isang daungan ng Ponto ang tagapagdala ng sulat at umikot sa mga lalawigan sa ayos na iyon, isang mungkahing hindi mapatutunayan."
    - "Noong mga AD 111, sumulat si Plinio na Mas Bata, na gobernador ng Bitinia at Ponto, kay Trajan, marahil mula sa baybayin ng Ponto, na marami ang mga Kristiyano, sa bawat edad at ranggo, sa mga bayan, nayon at kanayunan, at halos wala nang tao sa mga templo; ang sagot ng emperador ang nagtakda ng gawi ng mga Romano sa loob ng isang siglo. Sina Aquila ng Ponto, na nagsalin ng Lumang Tipan sa Griyego para sa mga Judio noong ika-2 siglo, at Marcion, anak ng obispo ng Sinope, ay nagmula sa lupaing ito, at noong ika-3 siglo si Gregorio ang Gumagawa ng Himala ay obispo ng Neocesarea. Ang Ponto ay ang baybayin ng Dagat Itim ng Turkey ngayon, kasama ang mga lalawigan ng Samsun, Sinop, Amasya, Tokat at Trabzon; umalis ang populasyong Griyego nito sa palitan noong 1923."
  da:
    - "Pontus er landet langs Sortehavets sydøstlige kyst, Pontus Euxinus, som det har sit navn efter: en smal, regnfuld kyst med de græske havne Sinope, Amisos og Trapezus og bag den de parallelle højderygge i De Pontiske Bjerge og dalene ved Iris og Lykos, med Amaseia og tempelbyen Komana. Omkring 281 f.Kr. grundlagde en persisk adelsmand, Mithridates, et kongerige her; dets største konge, Mithridates 6. Eupator, kæmpede mod Rom i tre krige fra 89 f.Kr. og døde i 63 f.Kr., da Pompejus forenede den vestlige del af hans rige med Bithynien som provinsen Bithynien og Pontus og gav resten til klientkonger. Den sidste af disse, Polemons rige, blev indlemmet under Nero i begyndelsen af 60'erne e.Kr. Geografen Strabon blev født i Amaseia og beskrev sit hjemland nøje."
    - "I Det Nye Testamente var jøder fra Pontus blandt dem, der hørte apostlene til pinse; Akvila, Paulus' medtelmager og vært i Korinth, var »en Jøde ved Navn Akvila, født i Pontus«, som med sin hustru Priskilla havde forladt Rom, da Klaudius udviste jøderne, og parret fulgte senere Paulus til Efesos og blev hilst i hans brev til Rom; og Første Petersbrev er stilet »til Udlændingene i Adspredelse i Pontus, Galatien, Kappadokien, Asien og Bithynien«. Pontus står først på listen, måske fordi brevets bærer landede i en pontisk havn og gik rundt til provinserne i den rækkefølge, et forslag der ikke kan bevises."
    - "Omkring 111 e.Kr. skrev Plinius den Yngre, guvernør i Bithynien og Pontus, til Trajan, sandsynligvis fra den pontiske kyst, at de kristne var mange, af alle aldre og stande, i byer, landsbyer og på landet, og at templerne næsten var blevet forladt; kejserens svar fastlagde romersk praksis i et århundrede. Akylas fra Pontus, der oversatte Det Gamle Testamente til græsk for jøderne i 100-tallet, og Markion, søn af en biskop af Sinope, kom fra landet, og i 200-tallet var Gregor Undergøreren biskop af Neocaesarea. Pontus er i dag Tyrkiets Sortehavskyst, med provinserne Samsun, Sinop, Amasya, Tokat og Trabzon; dets græske befolkning forlod det ved udvekslingen i 1923."
  sr:
    - "Понт је земља дуж југоисточне обале Црног мора, Понтоса Евксинског по коме је добио име: уска, кишна обала са грчким лукама Синопом, Амисом и Трапезунтом, а иза ње паралелни гребени Понтских планина и долине Ириса и Лика, са Амасијом и храмовним градом Команом. Око 281. п. н. е. персијски племић Митридат основао је овде краљевство; његов највећи краљ, Митридат VI Евпатор, ратовао је с Римом у три рата од 89. п. н. е. и умро 63. п. н. е., кад је Помпеј западни део његовог краљевства спојио с Витинијом у провинцију Витинију и Понт, а остатак дао зависним краљевима. Последњи од њих, Полемоново краљевство, анектирано је за Нерона раних 60-их н. е. Страбон, географ, рођен је у Амасији и брижљиво је описао свој завичај."
    - "У Новом завету Јевреји из Понта били су међу онима који су чули апостоле о Педесетници; Павле је у Коринту нашао „једног Јеврејина, по имену Акилу, родом из Понта“, свог колегу шаторџију и домаћина, који је са женом Прискилом напустио Рим кад је Клаудије протерао Јевреје, а пар је касније отишао с Павлом у Ефес и поздрављен је у његовој посланици Римљанима; а Прва посланица Петрова упућена је „избраним дошљацима, расејаним по Понту, Галатији, Кападокији, Азији и Витанији“. Понт стоји први у том списку, можда зато што је носилац посланице пристао у понтској луци и обилазио провинције тим редом, претпоставка која се не може доказати."
    - "Око 111. н. е. Плиније Млађи, управљајући Витинијом и Понтом, писао је Трајану, вероватно са понтске обале, да су хришћани многобројни, свих узраста и сталежа, у градовима, селима и на селу, и да су храмови скоро опустели; царев одговор одредио је римску праксу за читав век. Из тог краја потичу Акила Понтски, који је у 2. веку превео Стари завет на грчки за Јевреје, и Маркион, син епископа из Синопе, а у 3. веку Григорије Чудотворац био је епископ Неоцезареје. Понт је данас црноморска обала Турске, укључујући покрајине Самсун, Синоп, Амасју, Токат и Трабзон; његово грчко становништво отишло је разменом 1923."
  hu:
    - "Pontus a Fekete-tenger délkeleti partja menti föld, a Pontus Euxinusról, amelyről a nevét kapta: keskeny, esős part Szinópé, Amiszosz és Trapezusz görög kikötőivel, mögötte a Pontoszi-hegység párhuzamos gerinceivel és az Irisz és a Lükosz völgyeivel, Amaszeiával és a templomváros Komanával. Kr. e. 281 körül egy perzsa nemes, Mithridatész, királyságot alapított itt; legnagyobb királya, VI. Mithridatész Eupator, Kr. e. 89-től három háborút vívott Rómával és Kr. e. 63-ban halt meg, amikor Pompeius királyságának nyugati részét Bithünia tartománnyal egyesítette Bithünia és Pontus néven, a többit pedig hűbéres királyoknak adta. Az utolsó közülük, Polemón királyságát Néró alatt, a Kr. u. 60-as évek elején csatolták be. Sztrabón, a földrajztudós Amaszeiában született, és gondosan leírta hazáját."
    - "Az Újszövetségben pontusi zsidók voltak azok között, akik hallották az apostolokat pünkösdkor; Akvila, Pál sátorkészítő társa és korinthusi vendéglátója, „egy Akvila nevű, pontusi származású zsidó” volt, aki feleségével, Priszcillával elhagyta Rómát, amikor Klaudius kiűzte a zsidókat, a házaspár később Pállal Efezusba ment, és a Rómaiakhoz írt levélben üdvözlik; Péter első levele pedig „a Pontusban, Galátziában, Kappadóciában, Ázsiában és Bithiniában elszéledt jövevényeknek” szól. Pontus áll első helyen ebben a felsorolásban, talán mert a levél vivője pontoszi kikötőben szállt partra, és abban a sorrendben járta be a tartományokat, de ez nem bizonyítható."
    - "Kr. u. 111 körül az ifjabb Plinius, Bithünia és Pontus kormányzója, valószínűleg a pontoszi partról azt írta Traianusnak, hogy a keresztények sokan vannak, minden korból és rangból, a városokban, falvakban és a vidéken, és hogy a templomok szinte elnéptelenedtek; a császár válasza egy évszázadra meghatározta a római gyakorlatot. A pontoszi Akvila, aki a 2. században görögre fordította az Ószövetséget a zsidóknak, és Markión, szinópéi püspök fia, e vidékről származtak, a 3. században pedig a Csodatevő Gergely volt Neokaiszareia püspöke. Pontus ma Törökország Fekete-tenger-parti vidéke, Samsun, Sinop, Amasya, Tokat és Trabzon tartományokkal; görög lakossága az 1923-as lakosságcserében távozott."
  fi:
    - "Pontos on maa Mustanmeren kaakkoisrannikolla, Pontos Euxeinoksen, josta se sai nimensä: kapea, sateinen rannikko, jolla ovat kreikkalaiset satamat Sinope, Amisos ja Trapezus, ja sen takana Pontoksen vuorten yhdensuuntaiset harjanteet sekä Irisin ja Lykoksen laaksot, joissa ovat Amaseia ja temppelikaupunki Komana. Noin 281 eaa. persialainen aatelismies Mithridates perusti tänne kuningaskunnan; sen suurin kuningas, Mithridates VI Eupator, kävi Roomaa vastaan kolme sotaa vuodesta 89 eaa. ja kuoli 63 eaa., jolloin Pompeius liitti hänen valtakuntansa länsiosan Bityniaan Bityniaksi ja Pontokseksi nimetyksi provinssiksi ja antoi lopun vasallikuninkaille. Näistä viimeinen, Polemonin kuningaskunta, liitettiin Neron aikana 60-luvun alussa jaa. Maantieteilijä Strabon syntyi Amaseiassa ja kuvasi kotimaataan huolella."
    - "Uudessa testamentissa Pontoksen juutalaisia oli niiden joukossa, jotka kuulivat apostoleja helluntaina; Korintissa Paavali tapasi ”erään Akylas nimisen juutalaisen, joka oli Pontosta syntyisin”, teltantekijätoverinsa ja isäntänsä, joka vaimonsa Priskillan kanssa oli lähtenyt Roomasta, kun Klaudius karkotti juutalaiset, ja pariskunta meni myöhemmin Paavalin mukana Efesokseen ja heitä tervehditään hänen Rooman kirjeessään; ja Pietarin ensimmäinen kirje on osoitettu ”valituille muukalaisille, jotka asuvat hajallaan Pontossa, Galatiassa, Kappadokiassa, Aasiassa ja Bityniassa”. Pontos on luettelon ensimmäisenä, ehkä siksi, että kirjeen viejä nousi maihin Pontoksen satamassa ja kiersi provinssit tässä järjestyksessä; ehdotusta ei voi todistaa."
    - "Noin 111 jaa. nuorempi Plinius, Bityniaa ja Pontosta hallitessaan, kirjoitti Trajanukselle, luultavasti Pontoksen rannikolta, että kristittyjä oli paljon, kaikenikäisiä ja -arvoisia, kaupungeissa, kylissä ja maaseudulla, ja että temppelit olivat melkein autioituneet; keisarin vastaus vahvisti Rooman käytännön vuosisadaksi. Pontoslainen Akylas, joka käänsi Vanhan testamentin kreikaksi juutalaisille 100-luvulla, ja Markion, Sinopen piispan poika, olivat kotoisin sieltä, ja 200-luvulla Gregorios Ihmetyöntekijä oli Neokaisareian piispa. Pontos on nykyään Turkin Mustanmeren rannikko, johon kuuluvat Samsunin, Sinopin, Amasyan, Tokatin ja Trabzonin maakunnat; sen kreikkalainen väestö lähti vuoden 1923 vaihdossa."
  vi:
    - "Bông là vùng đất dọc bờ đông nam Biển Đen, Pontus Euxinus mà nó lấy tên: một dải bờ biển hẹp, nhiều mưa, với các cảng Hy Lạp Sinope, Amisus và Trapezus, và phía sau là những dãy núi Pontic song song cùng các thung lũng của sông Iris và sông Lycus, với Amaseia và thành đền Comana. Khoảng năm 281 TCN, một quý tộc Ba Tư, Mithridates, lập một vương quốc ở đây; vị vua vĩ đại nhất, Mithridates VI Eupator, đánh Rô-ma trong ba cuộc chiến từ năm 89 TCN và chết năm 63 TCN, khi Pompey nhập phần phía tây vương quốc của ông với Bi-thi-ni thành tỉnh Bi-thi-ni và Bông và trao phần còn lại cho các vua chư hầu. Vương quốc chư hầu cuối cùng trong số này, vương quốc của Polemon, bị sáp nhập dưới thời Nero vào đầu thập niên 60. Strabo, nhà địa lý, sinh ở Amaseia và mô tả quê hương mình cẩn thận."
    - "Trong Tân Ước, người Do Thái từ Bông nằm trong số những người nghe các sứ đồ vào lễ Ngũ Tuần; A-qui-la, bạn làm lều của Phao-lô và là chủ nhà ở Cô-rinh-tô, là “một người Giu-đa, tên là A-qui-la, quê ở xứ Bông”, người cùng vợ là Bê-rít-sin đã rời Rô-ma khi Cơ-lốt trục xuất người Do Thái, về sau hai vợ chồng cùng Phao-lô đến Ê-phê-sô và được chào trong thư gửi Rô-ma; và Thư thứ nhất của Phi-e-rơ gửi “những người kiều ngụ rải rác trong xứ Bông, Ga-la-ti, Cáp-ba-đốc, A-si và Bi-thi-ni”. Bông đứng đầu danh sách ấy, có lẽ vì người mang thư đến một cảng ở Bông và đi vòng các tỉnh theo thứ tự đó, một gợi ý không thể chứng minh."
    - "Khoảng năm 111, Pliny the Younger, khi làm tổng đốc Bi-thi-ni và Bông, viết cho Trajan, có lẽ từ bờ biển Bông, rằng Cơ Đốc nhân đông, đủ mọi tuổi và hạng, trong các thành, làng và vùng quê, và các đền thờ gần như bỏ trống; thư trả lời của hoàng đế định ra thông lệ La Mã trong một thế kỷ. Aquila người Bông, người dịch Cựu Ước sang tiếng Hy Lạp cho người Do Thái vào thế kỷ 2, và Marcion, con trai một giám mục của Sinope, đều xuất thân từ vùng này, và vào thế kỷ 3, Gregory Thaumaturgus (Gregory Người Làm Phép Lạ) là giám mục của Neocaesarea. Bông ngày nay là bờ Biển Đen của Thổ Nhĩ Kỳ, gồm các tỉnh Samsun, Sinop, Amasya, Tokat và Trabzon; dân Hy Lạp của nó rời đi trong cuộc trao đổi dân cư năm 1923."
  ro:
    - "Pontul este țara de-a lungul țărmului sud-estic al Mării Negre, Pontus Euxinus, de la care și-a luat numele: o coastă îngustă și ploioasă, cu porturile grecești Sinope, Amisos și Trapezus, iar în spatele ei crestele paralele ale munților Pontici și văile Irisului și Lycusului, cu Amaseia și orașul-templu Comana. În jurul anului 281 î.Hr., un nobil persan, Mithridates, a întemeiat aici un regat; cel mai mare rege al lui, Mithridates al VI-lea Eupator, a purtat trei războaie cu Roma din 89 î.Hr. și a murit în 63 î.Hr., când Pompei a unit partea de vest a regatului său cu Bitinia, ca provincie Bitinia și Pont, și a dat restul unor regi clienți. Ultimul dintre ei, regatul lui Polemon, a fost anexat sub Nero la începutul anilor 60 d.Hr. Geograful Strabon s-a născut la Amaseia și și-a descris cu grijă ținutul natal."
    - "În Noul Testament, evrei din Pont se numărau printre cei care i-au auzit pe apostoli la Rusalii; Acvila, tovarășul de meșteșug al lui Pavel și gazda lui la Corint, era „oarecare Iudeu anume Achila, de neam din Pont”, care împreună cu soția sa Priscila părăsise Roma când Claudiu i-a izgonit pe evrei, iar cuplul a mers mai târziu cu Pavel la Efes și a fost salutat în epistola lui către Roma; iar Prima epistolă a lui Petru este adresată „nemernicilor celor aleși ai risipirei Pontului, Galatiei, Capadochiei, Asiei și Vitiniei”. Pontul stă primul în această listă, poate pentru că purtătorul epistolei a debarcat într-un port pontic și a străbătut provinciile în această ordine, o sugestie care nu poate fi dovedită."
    - "În jurul anului 111 d.Hr., Pliniu cel Tânăr, guvernând Bitinia și Pontul, i-a scris lui Traian, probabil de pe coasta pontică, că creștinii erau mulți, de toate vârstele și rangurile, în orașe, sate și la țară, și că templele fuseseră aproape pustiite; răspunsul împăratului a fixat practica romană pentru un secol. Acvila din Pont, care a tradus Vechiul Testament în greacă pentru evrei în secolul al II-lea, și Marcion, fiul unui episcop din Sinope, veneau din această țară, iar în secolul al III-lea Grigorie Taumaturgul a fost episcop al Neocezareei. Pontul este astăzi coasta Mării Negre a Turciei, cu provinciile Samsun, Sinop, Amasya, Tokat și Trabzon; populația lui greacă a plecat în schimbul din 1923."
  bg:
    - "Понт е земята по югоизточния бряг на Черно море, Понт Евксински, от който взела името си: тясно, дъждовно крайбрежие с гръцките пристанища Синопа, Амис и Трапезунт, а зад него — успоредните била на Понтийските планини и долините на Ирис и Лик, с Амасия и храмовия град Комана. Около 281 г. пр.н.е. персийски благородник, Митридат, основал тук царство; най-великият му цар, Митридат VI Евпатор, воювал с Рим в три войни от 89 г. пр.н.е. и умрял през 63 г. пр.н.е., когато Помпей съединил западната част на царството му с Витиния като провинция Витиния и Понт, а останалото дал на зависими царе. Последното от тях, царството на Полемон, било анексирано при Нерон в началото на 60-те години н.е. Географът Страбон се родил в Амасия и описал грижливо родината си."
    - "В Новия завет юдеи от Понт били сред слушалите апостолите на Петдесетница; Акила, събрат на Павел по занаят за шатри и негов домакин в Коринт, бил юдеин „на име Акила, роден в Понт“, който с жена си Прискила напуснал Рим, когато Клавдий изгонил юдеите; по-късно двамата отишли с Павел в Ефес и той ги поздравява в писмото си до Рим. Първото послание на Петър е адресирано „до преселниците които са пръснати по Понт, по Галатия, по Кападокия, по Азия и по Витиния“. Понт стои пръв в този списък, може би защото приносителят на писмото слязъл на понтийско пристанище и обиколил провинциите в този ред — предположение, което не може да се докаже."
    - "Около 111 г. н.е. Плиний Млади, управител на Витиния и Понт, писал на Траян, вероятно от понтийския бряг, че християните са много, от всяка възраст и съсловие, в градовете, селата и полето, и че храмовете почти опустели; отговорът на императора определил римската практика за цял век. От тази земя произхождали Акила от Понт, който през II в. превел Стария завет на гръцки за юдеите, и Маркион, син на епископ на Синопа, а през III в. Григорий Чудотворец бил епископ на Неокесария. Днес Понт е черноморският бряг на Турция, включително провинциите Самсун, Синоп, Амасия, Токат и Трабзон; гръцкото му население го напуснало при размяната през 1923 г."
