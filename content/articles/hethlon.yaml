body:
  en:
    - "Hethlon is a point on the northern border of the land as Ezekiel draws it in his vision of the restored Israel: “this shall be the border of the land toward the north side, from the great sea, the way of Hethlon, as men go to Zedad”. The border is repeated when the land is divided among the tribes, and Dan's portion is described in the same terms: “From the north end to the coast of the way of Hethlon, as one goeth to Hamath”. Hethlon thus lay on a road leading inland from the Mediterranean towards Hamath and Zedad, and it is named nowhere else in the Bible."
    - "Its place depends on how far north one draws Ezekiel's border. The map follows those who see the name in Heitela, a village north-east of Tripoli in Lebanon, on the way from the coast through the gap between the Lebanon and the Nusayriyah mountains; others take “the way of Hethlon” as the road to Lebo-hamath in the Beqaa, and a southern view puts it at Adlun, between Sidon and Tyre. Nothing else is known."
  ru:
    - "Хетлон — точка на северной границе земли, как её проводит Иезекииль в видении о восстановленном Израиле: «И вот предел земли: на северном конце, начиная от великого моря, через Хетлон, по дороге в Цедад». Граница повторяется, когда землю делят между коленами, и удел Дана описан теми же словами: «На северном краю по дороге от Хетлона, ведущей в Емаф». Хетлон, таким образом, лежал на дороге, ведущей от Средиземного моря вглубь страны к Емафу и Цедаду, и больше нигде в Библии не упоминается."
    - "Его место зависит от того, как далеко на север проводить границу Иезекииля. Карта следует тем, кто узнаёт имя в Хейтеле, селении к северо-востоку от Триполи в Ливане, на пути от побережья через проход между Ливанскими горами и горами Ансария; другие понимают дорогу на Хетлон как путь к входу в Емаф в долине Бекаа, а южное мнение помещает его в Адлуне, между Сидоном и Тиром. Больше ничего не известно."
  uk:
    - "Хетлон — точка на північній межі краю, як її малює Єзекіїль у видінні відновленого Ізраїлю: «А се гряниця країни: На північньому концї, починаючи од великого моря, через Хетлон, по дорозї в Зедад». Межа повторюється, коли землю ділять між колінами, і пай Дана описано в тих самих термінах: «На північньому боцї по дорозї від Хетлону, що веде в Емат». Отже, Хетлон лежав на дорозі, що веде вглиб країни від Середземного моря до Хамату й Цедаду, і більше ніде в Біблії не названий."
    - "Його місце залежить від того, як далеко на північ проводити межу Єзекіїля. Карта йде за тими, хто бачить назву в Хейтелі, селі на північний схід від Тріполі в Лівані, на шляху від узбережжя крізь прохід між Ліваном і Нусайрійськими горами; інші розуміють «дорогу до Хетлону» як дорогу до Входу у Хамат у Бекаа, а південний погляд ставить його в Адлуні між Сідоном і Тіром. Більше нічого невідомо."
  es:
    - "Hetlón es un punto de la frontera norte del país tal como la traza Ezequiel en su visión del Israel restaurado: «este será el término de la tierra hacia la parte del norte; desde la gran mar, camino de Hethlon viniendo á Sedad». La frontera se repite cuando la tierra se reparte entre las tribus, y la porción de Dan se describe en los mismos términos: «Desde la extremidad septentrional por la vía de Hethlon viniendo á Hamath». Hetlón estaba, pues, en un camino que llevaba tierra adentro desde el Mediterráneo hacia Hamat y Sedad, y no se nombra en ningún otro lugar de la Biblia."
    - "Su emplazamiento depende de hasta qué punto del norte se trace la frontera de Ezequiel. El mapa sigue a quienes ven el nombre en Heitela, una aldea al nordeste de Trípoli, en el Líbano, en el camino de la costa por el paso entre el Líbano y los montes Nusayriyah; otros toman «camino de Hethlon» como el camino a la Entrada de Hamat, en la Becá, y una opinión más meridional lo sitúa en Adlun, entre Sidón y Tiro. No se sabe nada más."
  pt:
    - "Hetlom é um ponto na fronteira norte da terra como Ezequiel a traça em sua visão do Israel restaurado: “No lado norte, desde o Mar Grande, pelo caminho de Hetlom, até a entrada de Zedade”. A fronteira é repetida quando a terra é dividida entre as tribos, e a porção de Dã é descrita nos mesmos termos: “Desde a extremidade norte, junto ao caminho de Hetlom até a entrada de Hamate”. Hetlom ficava assim numa estrada que levava para o interior desde o Mediterrâneo em direção a Hamate e Zedade, e não é nomeada em nenhum outro lugar da Bíblia."
    - "Seu lugar depende de até onde ao norte se traça a fronteira de Ezequiel. O mapa segue os que veem o nome em Heitela, uma aldeia a nordeste de Trípoli, no Líbano, no caminho que vai da costa pela passagem entre o Líbano e os montes Nusayriyah; outros tomam “o caminho de Hetlom” como a estrada para Lebo-Hamate, em Beca, e uma visão meridional a põe em Adlun, entre Sidom e Tiro. Nada mais se sabe."
  de:
    - "Hetlon ist ein Punkt auf der Nordgrenze des Landes, wie Hesekiel sie in seiner Vision des wiederhergestellten Israel zieht: „Dies ist nun die Grenze des Landes gegen Mitternacht: von dem großen Meer an des Weges nach Hethlon gen Zedad“. Die Grenze wird wiederholt, wenn das Land unter die Stämme verteilt wird, und Dans Anteil wird in denselben Worten beschrieben: „von Mitternacht, an dem Wege nach Hethlon, gen Hamath“. Hetlon lag also an einer Straße, die vom Mittelmeer landeinwärts nach Hamat und Zedad führte, und wird sonst nirgends in der Bibel genannt."
    - "Seine Lage hängt davon ab, wie weit nördlich man Hesekiels Grenze zieht. Die Karte folgt denen, die den Namen in Heitela sehen, einem Dorf nordöstlich von Tripoli im Libanon, auf dem Weg von der Küste durch die Lücke zwischen dem Libanon und dem Nusairiergebirge; andere verstehen „an dem Wege nach Hethlon“ als die Straße nach Lebo-Hamat in der Bekaa, und eine südliche Ansicht setzt es bei Adlun zwischen Sidon und Tyrus an. Mehr ist nicht bekannt."
  fr:
    - "Hethlon est un point de la frontière nord du pays tel qu’Ézéchiel le trace dans sa vision d’Israël restauré : « Du côté septentrional, depuis la grande mer, le chemin de Hethlon jusqu’à Tsedad ». La frontière est répétée quand le pays est réparti entre les tribus, et la part de Dan est décrite dans les mêmes termes : « Depuis l’extrémité septentrionale, le long du chemin de Hethlon à Hamath ». Hethlon se trouvait donc sur une route menant de la Méditerranée à l’intérieur vers Hamath et Tsedad, et elle n’est nommée nulle part ailleurs dans la Bible."
    - "Sa place dépend de la hauteur à laquelle on trace la frontière d’Ézéchiel. La carte suit ceux qui voient le nom dans Heitela, un village au nord-est de Tripoli, au Liban, sur le chemin de la côte à travers la trouée entre le Liban et les monts Nusayriyah ; d’autres prennent « le chemin de Hethlon » pour la route de l’entrée de Hamath dans la Bekaa, et une thèse méridionale la place à Adloun, entre Sidon et Tyr. On ne sait rien d’autre."
  pl:
    - "Chetlon to punkt na północnej granicy ziemi, jak rysuje ją Ezechiel w widzeniu odnowionego Izraela: „Tać jest tedy granica tej ziemi ku stronie północnej, od morza wielkiego, drogą do Hetlonu, kędy wchodzą do Sedad”. Granica powtarza się przy podziale ziemi między pokolenia, a dział Dana opisany jest w tych samych słowach: „W granicach na północną stronę podle drogi Hetlon, kędy wchodzą do Emat”. Chetlon leżał więc na drodze prowadzącej w głąb lądu od Morza Śródziemnego ku Chamat i Sedad i nie jest wymieniony nigdzie indziej w Biblii."
    - "Jego położenie zależy od tego, jak daleko na północ poprowadzi się granicę Ezechiela. Mapa idzie za tymi, którzy widzą nazwę w Hejteli, wsi na północny wschód od Trypolisu w Libanie, na drodze od wybrzeża przez przerwę między górami Liban a Nusajrijja; inni biorą drogę „do Hetlonu” za drogę do Lebo-Chamat w Bekaa, a pogląd południowy umieszcza go w Adlunie, między Sydonem a Tyrem. Nic więcej nie wiadomo."
  it:
    - "Chetlon è un punto sul confine settentrionale del paese come lo traccia Ezechiele nella sua visione dell’Israele restaurato: «Dalla parte di settentrione: partendo dal mar Grande, in direzione di Hethlon, venendo verso Tsedad». Il confine è ripetuto quando il paese è diviso fra le tribù, e la porzione di Dan è descritta negli stessi termini: «Partendo dall’estremità settentrionale, lungo la via d’Hethlon per andare a Hamath». Chetlon si trovava dunque su una strada che dal Mediterraneo conduceva verso l’interno, a Camat e a Zedad, e non è nominata altrove nella Bibbia."
    - "La sua posizione dipende da quanto a nord si tracci il confine di Ezechiele. La mappa segue quanti vedono il nome in Heitela, un villaggio a nord-est di Tripoli in Libano, sulla via dalla costa attraverso il varco fra il Libano e i monti Nusayriyah; altri intendono «la via d’Hethlon» come la strada verso l’Entrata di Camat nella Beqa, e una opinione meridionale la pone ad Adlun, fra Sidone e Tiro. Nulla di più si sa."
  nl:
    - "Chetlon is een punt op de noordgrens van het land zoals Ezechiël die tekent in zijn visioen van het herstelde Israël: “Dit nu zal de landpale des lands zijn: aan den noorderhoek, van de grote zee af, den weg van Hethlon, waar men komt te Zedad”. De grens wordt herhaald bij de verdeling van het land over de stammen, en het deel van Dan wordt in dezelfde termen beschreven: “Van het einde noordwaarts, aan de zijde des wegs van Hethlon, waar men komt te Hamath”. Chetlon lag dus aan een weg die vanaf de Middellandse Zee landinwaarts leidde naar Hamat en Zedad, en wordt nergens elders in de Bijbel genoemd."
    - "De plaats hangt ervan af hoe ver naar het noorden men Ezechiëls grens trekt. De kaart volgt degenen die de naam zien in Heitela, een dorp ten noordoosten van Tripoli in Libanon, op de weg van de kust door de bergpas tussen het Libanongebergte en het Nusayriyah-gebergte; anderen vatten “den weg van Hethlon” op als de weg naar Lebo-Hamat in de Bekaa, en een zuidelijke opvatting plaatst het bij Adlun, tussen Sidon en Tyrus. Verder is niets bekend."
  cs:
    - "Chetlon je bod na severní hranici země, jak ji Ezechiel líčí ve svém vidění obnoveného Izraele: „Toto jest tedy pomezí té země: K straně půlnoční od moře velikého cestou Chetlonu, kudyž se vchází do Sedad“. Hranice se opakuje při rozdělení země mezi kmeny a Danův podíl je popsán týmiž slovy: „V končinách na půlnoční stranu podlé cesty Chetlon, kudyž se vchází do Emat“. Chetlon tak ležel na cestě vedoucí do vnitrozemí od Středozemního moře k Chamatu a Sedadu a nejmenuje se nikde jinde v Bibli."
    - "Jeho poloha závisí na tom, jak daleko na sever se vede Ezechielova hranice. Mapa následuje ty, kdo vidí jméno v Heitele, vesnici severovýchodně od Tripolisu v Libanonu, na cestě od pobřeží průrvou mezi Libanonem a pohořím Nusajríja; jiní berou „cestu Chetlon“ jako cestu k Lebo-chamat v Bikáa a jižní pohled ji klade do Adlúnu, mezi Sidón a Týr. Nic dalšího není známo."
  sv:
    - "Hetlon är en punkt på landets norra gräns så som Hesekiel drar den i sin syn om det återupprättade Israel: ”Detta skall vara landets gräns på norra sidan: från Stora havet längs Hetlonsvägen, dit fram där vägen går till Sedad”. Gränsen upprepas när landet fördelas mellan stammarna, och Dans del beskrivs i samma ordalag: ”Vid norra gränsen längs efter Hetlonsvägen, dit fram där vägen går till Hamat”. Hetlon låg alltså vid en väg som leder inåt landet från Medelhavet mot Hamat och Sedad, och det nämns ingen annanstans i Bibeln."
    - "Dess plats beror på hur långt norrut man drar Hesekiels gräns. Kartan följer dem som ser namnet i Heitela, en by nordost om Tripoli i Libanon, på vägen från kusten genom passet mellan Libanon- och Nusayriyah-bergen; andra tar ”Hetlonsvägen” för vägen till Lebo-Hamat i Bekaa, och en sydlig uppfattning förlägger den till Adlun, mellan Sidon och Tyros. Inget annat är känt."
  nb:
    - "Hetlon er et punkt på nordgrensen av landet slik Esekiel tegner det i sitt syn om det gjenopprettede Israel: «Dette skal være landets grenser: Mot nord fra det store hav på veien til Hetlon i retning mot Sedad». Grensen gjentas når landet deles mellom stammene, og Dans andel beskrives i de samme ordene: «Fra nordenden langs Hetlon-veien til bortimot Hamat». Hetlon lå dermed ved en vei som førte inn i landet fra Middelhavet mot Hamat og Sedad, og det nevnes ikke noe annet sted i Bibelen."
    - "Plasseringen avhenger av hvor langt nord man trekker Esekiels grense. Kartet følger dem som ser navnet i Heitela, en landsby nordøst for Tripoli i Libanon, på veien fra kysten gjennom gapet mellom Libanon og Nusayriyah-fjellene; andre tar «Hetlon-veien» som veien til Lebo-Hamat i Bekaa, og et sørlig syn setter den ved Adlun, mellom Sidon og Tyros. Ingenting annet er kjent."
  tl:
    - "Ang Hethlon ay isang punto sa hilagang hangganan ng lupain gaya ng iginuguhit ni Ezekiel sa kaniyang pangitain ng naibalik na Israel: “Sa dakong hilagaan, mula sa malaking dagat, sa daang Hethlon, hanggang sa pasukan sa Sedad”. Inuulit ang hangganan nang hatiin ang lupain sa mga lipi, at ang bahagi ni Dan ay inilalarawan sa parehong mga salita: “Mula sa dulong hilagaan, sa tabi ng daan ng Hethlon hanggang sa pasukan sa Hamath”. Kaya't ang Hethlon ay nasa isang daang patungo sa loob mula sa Mediteraneo tungo sa Hamath at Sedad, at hindi ito pinangalanan saanman sa Biblia."
    - "Nakasalalay ang lugar nito sa kung gaano kahilaga iginuguhit ang hangganan ni Ezekiel. Sinusunod ng mapa ang mga nakakakita ng pangalan sa Heitela, isang nayon sa hilagang-silangan ng Tripoli sa Libano, sa daan mula sa baybayin sa agwat sa pagitan ng mga bundok ng Libano at Nusayriyah; kinukuha ng iba ang “daang Hethlon” bilang daan patungo sa Pasukan sa Hamath sa Beqaa, at inilalagay ito ng pananaw sa timog sa Adlun, sa pagitan ng Sidon at Tiro. Wala nang ibang nalalaman."
  da:
    - "Hetlon er et punkt på landets nordgrænse, som Ezekiel trækker den i sit syn om det genoprettede Israel: »Og dette er Landets Grænse: Paa Nordsiden, fra det store Hav Vejen til Hethlon i Retning ad Zedad«. Grænsen gentages, når landet deles mellem stammerne, og Dans andel beskrives med de samme ord: »Fra Enden imod Nord, langs Vejen til Hethlon, i Retning af Hamath«. Hetlon lå altså ved en vej, der førte ind i landet fra Middelhavet mod Hamat og Sedad, og nævnes ikke andre steder i Bibelen."
    - "Dets sted afhænger af, hvor langt mod nord man trækker Ezekiels grænse. Kortet følger dem, der ser navnet i Heitela, en landsby nordøst for Tripoli i Libanon, på vejen fra kysten gennem skaret mellem Libanon og Nusayriyah-bjergene; andre tager »Vejen til Hethlon« for vejen til Lebo-Hamat i Beqaa, og et sydligt synspunkt placerer den ved Adlun, mellem Sidon og Tyrus. Intet andet er kendt."
  sr:
    - "Хетлон је тачка на северној граници земље како је Језекиљ повлачи у својој визији обновљеног Израиља: „Ово је дакле међа земље: на северној страни од великог мора на Етлон како се иде у Седад“. Граница се понавља кад се земља дели међу племена, а Данов део описује се истим речима: „Од краја према северу, уз пут етлонски како се иде у Емат“. Хетлон је тако лежао на путу који од Средоземног мора води у унутрашњост према Емату и Седаду, и нигде се другде у Библији не именује."
    - "Његово место зависи од тога колико се далеко на север повлачи Језекиљева граница. Карта следи оне који виде име у Хајтели, селу североисточно од Триполија у Ливану, на путу од обале кроз пролаз између Ливана и планина Нусајрија; други узимају „пут етлонски“ као пут ка Улазу у Емат у Бекаи, а јужно гледиште ставља га у Адлун, између Сидона и Тира. Ништа друго се не зна."
  hu:
    - "Hetlon az ország északi határának egy pontja, ahogyan Ezékiel a helyreállított Izráelről szóló látomásában megrajzolja: „És ez legyen a föld határa, észak felé a nagy-tengertől, Hetlónon át Sedádnak menve”. A határt megismétli, amikor a földet felosztják a törzsek között, és Dán részét ugyanígy írja le: „az északi határon a Hetlóntól Hamáthig vezető út mentén”. Hetlon tehát a Földközi-tengertől Hamát és Cedád felé vezető országút mentén feküdt, és a Biblia máshol nem említi."
    - "Helye attól függ, milyen messze északra húzzuk Ezékiel határát. A térkép azokat követi, akik a nevet Heitelában látják, Tripolitól északkeletre fekvő libanoni faluban, a tengerparttól a Libanon és a Nuszajrijja-hegység közötti nyíláson át vezető úton; mások a „Hetlóntól Hamáthig vezető utat” a Beqaa-beli Lebó-Hamát felé vezető útnak veszik, és egy déli nézet Adlunra helyezi, Szidón és Tírusz között. Mást nem tudunk."
  fi:
    - "Hetlon on piste maan pohjoisrajalla, sellaisena kuin Hesekiel sen piirtää näyssään ennallistetusta Israelista: ”Tämä on maan pohjoispuolinen raja: Suuresta merestä Hetlonin tietä siihen asti, mistä mennään Sedadiin.” Raja toistuu, kun maa jaetaan heimoille, ja Danin osuus kuvataan samoin sanoin: ”Pohjois-äärellä, pitkin Hetlonin tien vartta siihen asti, mistä mennään Hamatiin”. Hetlon sijaitsi siis tiellä, joka johti sisämaahan Välimereltä kohti Hamatia ja Sedadia, eikä sitä mainita missään muualla Raamatussa."
    - "Sen paikka riippuu siitä, kuinka pohjoiseen Hesekielin rajan vetää. Kartta seuraa niitä, jotka näkevät nimen Heitelassa, kylässä Tripolista koilliseen Libanonissa, rannikolta Libanonin ja Nusayriyahin vuorten välisen aukon kautta johtavalla tiellä; toiset pitävät ”Hetlonin tietä” Lebo-Hamatiin Beqaassa johtavana tienä, ja eteläinen näkemys sijoittaa sen Adluniin Sidonin ja Tyroksen välille. Muuta ei tiedetä."
  vi:
    - "Hết-lôn là một điểm trên ranh giới phía bắc của xứ như Ê-xê-chi-ên vẽ trong khải tượng về Y-sơ-ra-ên được phục hồi: “Nầy là giới hạn của đất; về phía bắc, từ biển lớn, theo con đường Hết-lôn cho đến đường sang Xê-đát”. Ranh giới được lặp lại khi đất được chia cho các chi phái, và phần của Đan được mô tả cùng cách: “phần đất khởi từ phía cực bắc và chạy dài từ phía Hết-lôn cho đến đường vào Ha-mát”. Như vậy Hết-lôn nằm trên một con đường dẫn vào nội địa từ Địa Trung Hải hướng Ha-mát và Xê-đát, và không được nêu ở nơi nào khác trong Kinh Thánh."
    - "Vị trí tùy vào việc vẽ ranh của Ê-xê-chi-ên xa về phía bắc đến đâu. Bản đồ theo những người thấy tên ấy ở Heitela, một làng đông bắc Tripoli ở Li-ban, trên đường từ bờ biển qua khe giữa núi Li-ban và dãy Nusayriyah; những người khác coi “con đường Hết-lôn” là đường đến Cửa vào Ha-mát ở Beqaa, và một quan điểm phía nam đặt nó ở Adlun, giữa Si-đôn và Ty-rơ. Không biết gì khác."
  ro:
    - "Hetlon este un punct de pe hotarul de nord al țării, așa cum îl trasează Ezechiel în viziunea sa despre Israelul restaurat: acesta va fi hotarul țării înspre miazănoapte, de la marea cea mare, pe calea Hetlonului, spre Țedad. Hotarul este repetat când țara este împărțită între triburi, iar partea lui Dan este descrisă în aceiași termeni: de la capătul de nord până la țărmul căii Hetlonului, spre Hamat. Hetlon se afla deci pe un drum care ducea din Mediterana spre interior, înspre Hamat și Țedad, și nu este numit nicăieri altundeva în Biblie."
    - "Locul lui depinde de cât de departe spre nord se trage hotarul lui Ezechiel. Harta îi urmează pe cei care văd numele în Heitela, un sat la nord-est de Tripoli în Liban, pe drumul de la coastă prin trecătoarea dintre munții Liban și Nusayriyah; alții iau „calea Hetlonului” drept drumul spre Intrarea Hamatului din Bekaa, iar o părere sudică îl așază la Adlun, între Sidon și Tir. Nu se mai știe nimic altceva."
  bg:
    - "Хетлон е точка на северната граница на земята, както я очертава Йезекиил във видението си за възстановения Израил: „И този ще е пределът на земята: към северната страна, от голямото море, към пътя на Етлон, като отива някой в Седад“. Границата се повтаря, когато земята се разпределя между племената, и делът на Дан е описан със същите думи: „от северния край, къде пътя на Етлон като отива някой в Емат“. Така Хетлон е лежал на път, водещ навътре от Средиземно море към Емат и Цедад, и не се назовава никъде другаде в Библията."
    - "Мястото му зависи от това колко на север се прокарва границата на Йезекиил. Картата следва онези, които виждат името в Хейтела, село североизточно от Триполи в Ливан, по пътя от брега през прохода между Ливан и планината Нусайрия; други разбират „пътя на Етлон“ като пътя към Входа на Емат в Бекаа, а едно южно мнение го поставя в Адлун, между Сидон и Тир. Нищо друго не се знае."
