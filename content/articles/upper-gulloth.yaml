# Overview article (ADR 0007). Mainstream facts only; the springs are placed near Debir on the usual identification of Debir with Khirbet Rabud, and the article says that nothing on the ground is certain.
id: upper-gulloth
place: a380434
title:
  en: "Upper Gulloth"
  ru: "Источники верхние"
body:
  en:
    - "Upper Gulloth is one of the two groups of springs that Caleb gave his daughter Achsah. When Othniel took Kiriath-sepher, that is Debir, and won her as his wife, she asked her father for more than the dry land he had given: “thou hast given me a south land; give me also springs of water. And he gave her the upper springs, and the nether springs.” The story is told twice, in Joshua and in Judges. The Hebrew gulloth means “basins” or “springs”; whether Gulloth was a proper name, as the Greek Bible took it, or only the word for springs is itself uncertain, and the map treats Upper Gulloth as the same place as Gulloth-mayim, “springs of water”."
    - "The springs must be sought near Debir. Since Moshe Kochavi's excavations in 1968–1969 Debir is generally identified with Khirbet Rabud, about 13 km south-west of Hebron, and Kochavi pointed to the two wells of el-'Alaqa, an upper and a lower, about 3 km from the mound, as the likely upper and nether springs; the older identification of Debir with Tell Beit Mirsim, excavated by Albright, would put them elsewhere. Nothing more is known: the name survives nowhere, and the place appears in no other story. Today it is open hill country of the southern Hebron hills, in the West Bank."
  ru:
    - "Источники верхние — одна из двух групп источников, которые Халев дал своей дочери Ахсе. Когда Гофониил взял Кириаф-Сефер, то есть Давир, и получил её в жёны, она попросила у отца больше, чем сухую землю, которую он дал: «ты дал мне землю полуденную, дай мне и источники вод. И дал он ей источники верхние и источники нижние». Рассказ приведён дважды, в книге Иисуса Навина и в книге Судей. Еврейское гуллот значит «чаши» или «источники»; было ли Гуллот собственным именем, как понял его греческий перевод, или просто словом «источники», само по себе неясно, и карта считает Источники верхние тем же местом, что и Гуллот-Маим, «источники вод»."
    - "Искать их нужно близ Давира. После раскопок Моше Кохави в 1968–1969 годах Давир обычно отождествляют с Хирбет-Рабудом примерно в 13 км к юго-западу от Хеврона, и Кохави указал на два колодца эль-Алака, верхний и нижний, примерно в 3 км от холма, как на вероятные верхние и нижние источники; прежнее отождествление Давира с Телль-Бейт-Мирсимом, который копал Олбрайт, помещало бы их в другом месте. Больше ничего не известно: имя нигде не сохранилось, и ни в одном другом рассказе это место не встречается. Сегодня это открытые холмы южной части Хевронского нагорья на Западном берегу."
scripture:
