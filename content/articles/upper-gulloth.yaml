# Overview article (ADR 0007). Mainstream facts only; the springs are placed near Debir on the usual identification of Debir with Khirbet Rabud, and the article says that nothing on the ground is certain.
id: upper-gulloth
place: a380434
title:
  en: "Upper Gulloth"
  ru: "Источники верхние"
  uk: "Джерела верхні"
  es: "Gulot de Arriba"
  pt: "Gulote de Cima"
  de: "Obere Quellen"
  fr: "Gulloth supérieures"
  pl: "Górne Gullot"
  it: "Gullot di Sopra"
  nl: "Boven-Gulot"
  cs: "Horní prameny"
  sv: "Övre Gullot"
  nb: "Øvre Gulot"
body:
  en:
    - "Upper Gulloth is one of the two groups of springs that Caleb gave his daughter Achsah. When Othniel took Kiriath-sepher, that is Debir, and won her as his wife, she asked her father for more than the dry land he had given: “thou hast given me a south land; give me also springs of water. And he gave her the upper springs, and the nether springs.” The story is told twice, in Joshua and in Judges. The Hebrew gulloth means “basins” or “springs”; whether Gulloth was a proper name, as the Greek Bible took it, or only the word for springs is itself uncertain, and the map treats Upper Gulloth as the same place as Gulloth-mayim, “springs of water”."
    - "The springs must be sought near Debir. Since Moshe Kochavi's excavations in 1968–1969 Debir is generally identified with Khirbet Rabud, about 13 km south-west of Hebron, and Kochavi pointed to the two wells of el-'Alaqa, an upper and a lower, about 3 km from the mound, as the likely upper and nether springs; the older identification of Debir with Tell Beit Mirsim, excavated by Albright, would put them elsewhere. Nothing more is known: the name survives nowhere, and the place appears in no other story. Today it is open hill country of the southern Hebron hills, in the West Bank."
  ru:
    - "Источники верхние — одна из двух групп источников, которые Халев дал своей дочери Ахсе. Когда Гофониил взял Кириаф-Сефер, то есть Давир, и получил её в жёны, она попросила у отца больше, чем сухую землю, которую он дал: «ты дал мне землю полуденную, дай мне и источники вод. И дал он ей источники верхние и источники нижние». Рассказ приведён дважды, в книге Иисуса Навина и в книге Судей. Еврейское гуллот значит «чаши» или «источники»; было ли Гуллот собственным именем, как понял его греческий перевод, или просто словом «источники», само по себе неясно, и карта считает Источники верхние тем же местом, что и Гуллот-Маим, «источники вод»."
    - "Искать их нужно близ Давира. После раскопок Моше Кохави в 1968–1969 годах Давир обычно отождествляют с Хирбет-Рабудом примерно в 13 км к юго-западу от Хеврона, и Кохави указал на два колодца эль-Алака, верхний и нижний, примерно в 3 км от холма, как на вероятные верхние и нижние источники; прежнее отождествление Давира с Телль-Бейт-Мирсимом, который копал Олбрайт, помещало бы их в другом месте. Больше ничего не известно: имя нигде не сохранилось, и ни в одном другом рассказе это место не встречается. Сегодня это открытые холмы южной части Хевронского нагорья на Западном берегу."
  uk:
    - "Джерела верхні — одна з двох груп джерел, які Калеб дав своїй доньці Ахсі. Коли Отніїл узяв Кіріят-Сефер, тобто Девір, і здобув її за дружину, вона попросила в батька більше, ніж суху землю, яку він дав: «дав бо єси менї полуденню землю, дай же менї й криничані протоки. І дав їй Калеб криничані протоки верхові й криничані протоки низові». Розповідь наведено двічі, в Ісуса Навина і в Суддів. Староєврейське «гуллот» означає «басейни» або «джерела»; чи Гуллот було власною назвою, як вважала грецька Біблія, чи лише словом для джерел, саме по собі непевно, і мапа трактує Верхні джерела як те саме місце, що й Джерела вод."
    - "Джерел слід шукати поблизу Девіра. Після розкопок Моше Кохаві 1968–1969 років Девір зазвичай ототожнюють із Хірбет-Рабудом, приблизно за 13 км на південний захід від Хеврона, а Кохаві вказав на два колодязі ель-Алака, верхній і нижній, приблизно за 3 км від пагорба, як на ймовірні верхні й нижні джерела; старіше ототожнення Девіра з Телль-Бейт-Мірсімом, розкопаним Олбрайтом, поклало б їх деінде. Більше нічого не відомо: назва ніде не збереглася, і місце не з’являється в жодній іншій розповіді. Нині це відкрита гориста місцевість південних пагорбів Хеврона на Західному березі."
  es:
    - "Gulot de Arriba es uno de los dos grupos de manantiales que Caleb dio a su hija Acsa. Cuando Otoniel tomó Quiriat-sefer, que es Debir, y la ganó por esposa, ella pidió a su padre más que la tierra seca que le había dado: «me has dado tierra de secadal, dame también fuentes de aguas. El entonces le dió las fuentes de arriba, y las de abajo». La historia se cuenta dos veces, en Josué y en Jueces. El hebreo gulot significa «cuencas» o «manantiales»; si Gulot era un nombre propio, como lo tomó la Biblia griega, o solo la palabra para manantiales es en sí mismo incierto, y el mapa trata Gulot de Arriba como el mismo lugar que Gulot-maim, «manantiales de agua»."
    - "Los manantiales hay que buscarlos cerca de Debir. Desde las excavaciones de Moshe Kochavi en 1968–1969, Debir se identifica generalmente con Khirbet Rabud, a unos 13 km al suroeste de Hebrón, y Kochavi señaló los dos pozos de el-'Alaqa, uno superior y otro inferior, a unos 3 km del montículo, como los probables manantiales de arriba y de abajo; la identificación más antigua de Debir con Tell Beit Mirsim, excavado por Albright, los situaría en otra parte. No se sabe nada más: el nombre no sobrevive en ningún lugar, y el sitio no aparece en ninguna otra historia. Hoy es campo abierto de colinas en el sur de las colinas de Hebrón, en Cisjordania."
  pt:
    - "Gulote de Cima é um dos dois grupos de fontes que Calebe deu à sua filha Acsa. Quando Otniel tomou Quiriate-Sefer, isto é, Debir, e a ganhou por esposa, ela pediu ao pai mais do que a terra seca que ele lhe dera: “Já que você me estabeleceu na terra do Sul, dê-me também fontes de água. Então ele lhe deu as fontes superiores e as fontes inferiores.” A história é contada duas vezes, em Josué e em Juízes. O hebraico gulloth significa “bacias” ou “fontes”; se Gulote era um nome próprio, como a Bíblia grega o tomou, ou apenas a palavra para fontes, é também incerto, e o mapa trata Gulote de Cima como o mesmo lugar que Gulote-Maim, “fontes de água”."
    - "As fontes devem ser procuradas perto de Debir. Desde as escavações de Moshe Kochavi em 1968–1969, Debir é geralmente identificada com Khirbet Rabud, cerca de 13 km a sudoeste de Hebrom, e Kochavi apontou os dois poços de el-'Alaqa, um superior e um inferior, a cerca de 3 km do monte, como prováveis fontes superiores e inferiores; a identificação mais antiga de Debir com Tell Beit Mirsim, escavada por Albright, as poria em outro lugar. Nada mais se sabe: o nome não sobrevive em lugar algum, e o lugar não aparece em nenhuma outra história. Hoje é região montanhosa aberta, no sul das colinas de Hebrom, na Cisjordânia."
  de:
    - "Obere Quellen ist eine der beiden Quellgruppen, die Kaleb seiner Tochter Achsa gab. Als Otniël Kirjat-Sefer, das ist Debir, einnahm und sie zur Frau gewann, bat sie ihren Vater um mehr als das trockene Land, das er ihr gegeben hatte: „Denn du hast mir ein Mittagsland gegeben; gib mir auch Wasserquellen! Da gab er ihr die Quellen von oben und unten.“ Die Geschichte steht zweimal, bei Josua und im Buch der Richter. Das hebräische gulloth bedeutet „Becken“ oder „Quellen“; ob Gulot ein Eigenname war, wie die griechische Bibel ihn auffasste, oder nur das Wort für Quellen, ist selbst unsicher, und die Karte behandelt Obere Quellen als denselben Ort wie Gulot-Majim, „Wasserquellen“."
    - "Die Quellen sind in der Nähe von Debir zu suchen. Seit Moshe Kochavis Grabungen 1968–1969 wird Debir meist mit Khirbet Rabud gleichgesetzt, etwa 13 km südwestlich von Hebron, und Kochavi wies auf die beiden Brunnen von el-'Alaqa, einen oberen und einen unteren, etwa 3 km vom Hügel, als wahrscheinliche obere und untere Quellen hin; die ältere Gleichsetzung Debirs mit Tell Beit Mirsim, von Albright ausgegraben, würde sie anderswo ansiedeln. Mehr ist nicht bekannt: Der Name hat sich nirgends erhalten, und der Ort erscheint in keiner anderen Geschichte. Heute ist es offenes Bergland der südlichen Hebroner Berge im Westjordanland."
  fr:
    - "Les Gulloth supérieures sont l’un des deux groupes de sources que Caleb donna à sa fille Acsa. Quand Othniel prit Kirjath-Sépher, c’est-à-dire Debir, et l’obtint pour femme, elle demanda à son père plus que la terre aride qu’il lui avait donnée : « tu m’as donné une terre du midi ; donne-moi aussi des sources d’eau. Et il lui donna les sources supérieures et les sources inférieures. » L’histoire est racontée deux fois, dans Josué et dans les Juges. L’hébreu gulloth signifie « bassins » ou « sources » ; que Gulloth soit un nom propre, comme l’a compris la Bible grecque, ou seulement le mot pour sources est lui-même incertain, et la carte traite les Gulloth supérieures comme le même lieu que Gulloth-Maïm, « sources d’eau »."
    - "Il faut chercher les sources près de Debir. Depuis les fouilles de Moshe Kochavi en 1968-1969, Debir est généralement identifiée à Khirbet Rabud, à environ 13 km au sud-ouest d’Hébron, et Kochavi désigna les deux puits d’el-’Alaqa, un haut et un bas, à environ 3 km du tertre, comme les probables sources supérieures et inférieures ; l’ancienne identification de Debir avec Tell Beit Mirsim, fouillé par Albright, les placerait ailleurs. On ne sait rien de plus : le nom ne survit nulle part, et le lieu n’apparaît dans aucun autre récit. C’est aujourd’hui un pays de collines ouvertes du sud des collines d’Hébron, en Cisjordanie."
  pl:
    - "Górne Gullot to jedna z dwóch grup źródeł, które Kaleb dał swej córce Aksie. Gdy Otniel zdobył Kiriat-Sefer, czyli Debir, i zyskał ją za żonę, poprosiła ojca o więcej niż suchą ziemię, którą jej dał: „gdyżeś mi dał ziemię suchą, przydaj mi też źródła wód. I dał jej źródła wyższe, i źródła dolne.” Opowieść występuje dwukrotnie, w Księdze Jozuego i w Księdze Sędziów. Hebrajskie gullot znaczy „misy” lub „źródła”; czy Gullot było nazwą własną, jak ujęła to Biblia grecka, czy tylko słowem na źródła, jest samo niepewne, i mapa traktuje Górne Gullot jako to samo miejsce co Gullot-Majim, „źródła wód”."
    - "Źródeł należy szukać w pobliżu Debir. Od wykopalisk Moszego Kochawiego w latach 1968–1969 Debir utożsamia się zwykle z Chirbet Rabud, około 13 km na południowy zachód od Hebronu, a Kochawi wskazał dwie studnie el-Alaka, górną i dolną, około 3 km od kopca, jako prawdopodobne górne i dolne źródła; starsze utożsamienie Debir z Tell Bajt Mirsim, badanym przez Albrighta, umieściłoby je gdzie indziej. Nic więcej nie wiadomo: nazwa nigdzie nie przetrwała, a miejsce nie występuje w żadnej innej opowieści. Dziś jest to otwarty teren górzysty południowych wzgórz Hebronu na Zachodnim Brzegu."
  it:
    - "Gullot di Sopra è uno dei due gruppi di sorgenti che Caleb diede alla figlia Acsa. Quando Otniel prese Kiriat-Sefer, cioè Debir, e la conquistò come moglie, ella chiese al padre più della terra arida che le aveva dato: «giacché tu m’hai stabilita in una terra arida, dammi anche delle sorgenti d’acqua». Ed egli le donò «le sorgenti superiori e le sorgenti sottostanti». La storia è raccontata due volte, in Giosuè e nei Giudici. L’ebraico gullot significa «bacini» o «sorgenti»; se Gullot fosse un nome proprio, come lo intese la Bibbia greca, o solo la parola per sorgenti è a sua volta incerto, e la mappa tratta Gullot di Sopra come lo stesso luogo di Gullot-Maim, «sorgenti d’acqua»."
    - "Le sorgenti vanno cercate presso Debir. Dagli scavi di Moshe Kochavi del 1968–1969 Debir è generalmente identificata con Khirbet Rabud, circa 13 km a sud-ovest di Ebron, e Kochavi indicò i due pozzi di el-’Alaqa, uno superiore e uno inferiore, a circa 3 km dal tell, come probabili sorgenti superiore e inferiore; la più antica identificazione di Debir con Tell Beit Mirsim, scavata da Albright, le porrebbe altrove. Non si sa altro: il nome non sopravvive da nessuna parte, e il luogo non compare in altri racconti. Oggi è terreno collinare aperto delle colline di Ebron meridionali, in Cisgiordania."
  nl:
    - "Boven-Gulot is een van de twee groepen bronnen die Kaleb aan zijn dochter Achsa gaf. Toen Otniël Kirjat-Sefer, dat is Debir, innam en haar tot vrouw won, vroeg zij haar vader om meer dan het dorre land dat hij haar had gegeven: “dewijl gij mij een dor land gegeven hebt, geef mij ook waterwellingen. Toen gaf hij haar hoge waterwellingen en lage waterwellingen.” Het verhaal wordt tweemaal verteld, in Jozua en in Richteren. Het Hebreeuwse gulloth betekent “bekkens” of “bronnen”; of Gulot een eigennaam was, zoals de Griekse Bijbel het opvatte, of alleen het woord voor bronnen, is zelf onzeker, en de kaart behandelt Boven-Gulot als dezelfde plaats als Gulot-Majim, “bronnen van water”."
    - "De bronnen moeten bij Debir worden gezocht. Sinds de opgravingen van Moshe Kochavi in 1968–1969 wordt Debir algemeen vereenzelvigd met Khirbet Rabud, ongeveer 13 km ten zuidwesten van Hebron, en Kochavi wees op de twee putten van el-’Alaqa, een bovenste en een onderste, op zo’n 3 km van de heuvel, als de waarschijnlijke boven- en onderbronnen; de oudere gelijkstelling van Debir met Tell Beit Mirsim, opgegraven door Albright, zou ze elders plaatsen. Meer is niet bekend: de naam leeft nergens voort, en de plaats komt in geen ander verhaal voor. Tegenwoordig is het open heuvelland van de zuidelijke heuvels van Hebron, op de Westelijke Jordaanoever."
  cs:
    - "Horní prameny jsou jedna ze dvou skupin pramenů, které Káleb dal své dceři Aksa. Když Otniel dobyl Kirjat-sefer, tedy Debír, a získal ji za ženu, požádala otce o víc než suchou zemi, kterou jí dal: „poněvadž jsi mi dal zemi suchou, dejž mi také studnice vod. I dal jí studnice horní a studnice dolní.“ Příběh je vyprávěn dvakrát, v Jozuovi a v Soudcích. Hebrejské gulot znamená „nádrže“ nebo „prameny“; zda byl Gulot vlastním jménem, jak je pojala řecká Bible, nebo jen slovem pro prameny, je samo nejisté, a mapa pokládá Horní prameny za totéž místo jako Gulót-majim, „prameny vod“."
    - "Prameny je třeba hledat poblíž Debíru. Od vykopávek Moše Kochaviho v letech 1968–1969 je Debír obecně ztotožňován s Chirbet Rabúd, asi 13 km jihozápadně od Hebronu, a Kochavi ukázal na dvě studny el-'Alaka, horní a dolní, asi 3 km od pahorku, jako pravděpodobné horní a dolní prameny; starší ztotožnění Debíru s Tell Bejt Mirsim, vykopaným Albrightem, by je kladlo jinam. Nic víc není známo: jméno nepřežilo nikde a místo se neobjevuje v žádném jiném příběhu. Dnes je to otevřená pahorkatina jižních hebronských hor na Západním břehu."
  sv:
    - "Övre Gullot är en av de två grupperna av källor som Kalev gav sin dotter Aksa. När Otniel intog Kirjat-Sefer, det vill säga Devir, och vann henne till hustru bad hon sin far om mer än det torra land han hade gett henne: ”eftersom du har gift bort mig till det torra Sydlandet, må du giva mig vattenkällor. Då gav Kaleb henne Illitkällorna och Tatitkällorna.” Berättelsen återges två gånger, i Josua och i Domarboken. Det hebreiska gullot betyder ”bassänger” eller ”källor”; om Gullot var ett egennamn, som den grekiska Bibeln tog det, eller bara ordet för källor är i sig osäkert, och kartan behandlar Övre Gullot som samma plats som Gullot-Majim, ”vattenkällor”."
    - "Källorna ska sökas nära Devir. Sedan Moshe Kochavis utgrävningar 1968–1969 identifieras Devir allmänt med Khirbet Rabud, omkring 13 km sydväst om Hebron, och Kochavi pekade på de två brunnarna i el-'Alaqa, en övre och en nedre, omkring 3 km från kullen, som de sannolika övre och nedre källorna; den äldre identifieringen av Devir med Tell Beit Mirsim, utgrävt av Albright, skulle förlägga dem någon annanstans. Inget mer är känt: namnet lever inte kvar någonstans, och platsen förekommer i ingen annan berättelse. I dag är det öppen bergsbygd i de södra Hebronbergen, på Västbanken."
  nb:
    - "Øvre Gulot er en av de to kildegruppene som Kaleb ga datteren Aksa. Da Otniel inntok Kirjat-Sefer, det er Debir, og vant henne til hustru, ba hun faren om mer enn det tørre landet han hadde gitt: «Du har giftet mig bort til dette tørre sydlandet, gi mig nu vannkilder! Så gav han henne de øvre og de nedre kilder.» Fortellingen er gjengitt to ganger, i Josva og i Dommerne. Det hebraiske gulloth betyr «bassenger» eller «kilder»; om Gulot var et egennavn, slik den greske Bibelen tok det, eller bare ordet for kilder, er selv usikkert, og kartet behandler Øvre Gulot som samme sted som Gulot-Majim, «vannkilder»."
    - "Kildene må søkes nær Debir. Siden Moshe Kochavis utgravninger i 1968–1969 identifiseres Debir vanligvis med Khirbet Rabud, omkring 13 km sørvest for Hebron, og Kochavi pekte på de to brønnene ved el-'Alaqa, en øvre og en nedre, omkring 3 km fra haugen, som de sannsynlige øvre og nedre kildene; den eldre identifikasjonen av Debir med Tell Beit Mirsim, utgravd av Albright, ville plassere dem et annet sted. Mer er ikke kjent: navnet overlever ikke noe sted, og stedet forekommer ikke i noen annen fortelling. I dag er det åpent fjellandskap i de sørlige Hebron-åsene, på Vestbredden."
scripture:
  - Josh.15.15-Josh.15.19
  - Judg.1.12-Judg.1.15
