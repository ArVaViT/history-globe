# Overview article (ADR 0007). Mainstream facts only; this id covers the border Shihor of Joshua 13 and 1 Chronicles 13; the Nile branch and the Wadi el-Arish are given as the two views, the candidates on the map named, none chosen.
id: shihor
place: a305f43
title:
  en: "Shihor"
  ru: "Сихор"
  uk: "Сихор"
  es: "Sihor"
  pt: "Sior"
  de: "Schihor"
  fr: "Schichor"
