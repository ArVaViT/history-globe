body:
  en:
    - "Shihor marks the south-western end of the promised land in two passages. Joshua describes the land that still remained to be taken as running “from Sihor, which is before Egypt, even unto the borders of Ekron northward”, the country of the five lords of the Philistines; and when David brought up the ark from Kirjath-jearim he gathered all Israel “from Shihor of Egypt even unto the entering of Hemath”, an idiom for the whole land from end to end. The name is Egyptian, usually explained as “the waters of Horus”, and elsewhere in the prophets Shihor plainly means the Nile or one of its arms."
    - "Which water is meant at the border is debated. Many take it to be the Pelusiac branch, the easternmost arm of the Nile in the Delta, which ran out to the sea near Pelusium; others think the border lay at the Wadi el-Arish, the Brook of Egypt of other border lists, and that Shihor is here another name for it; a few take it simply as the Nile. The map shows the Pelusiac branch and the Wadi el-Arish, and also the Nahal Besor south of Gaza, which some have proposed. The Pelusiac branch silted up long ago and survives only as traces in the north-eastern Delta near Port Said; the Wadi el-Arish reaches the sea at the city of El-Arish in northern Sinai."
  ru:
    - "Сихор отмечает юго-западный край обетованной земли в двух отрывках. Книга Иисуса Навина описывает ещё не занятую землю как простирающуюся «от Сихора, что пред Египтом, до пределов Екрона к северу», — страну пяти владельцев Филистимских; а когда Давид переносил ковчег из Кириаф-Иарима, он собрал всех израильтян «от Шихора Египетского до входа в Емаф» — оборот, означающий всю землю из конца в конец. Имя египетское, его обычно толкуют как «воды Гора», и в других местах у пророков Сихор ясно означает Нил или один из его рукавов."
    - "Какая вода имеется в виду на границе, спорно. Многие считают, что это Пелусийский рукав — самый восточный рукав Нила в Дельте, впадавший в море у Пелусия; другие думают, что граница проходила по Вади-Эль-Ариш, Потоку Египетскому других описаний границ, и что Сихор здесь — другое его имя; некоторые видят в нём просто Нил. На карте показаны Пелусийский рукав и Вади-Эль-Ариш, а также Нахаль-Бесор к югу от Газы, который предлагали некоторые. Пелусийский рукав давно занесло, и от него остались лишь следы на северо-востоке Дельты близ Порт-Саида; Вади-Эль-Ариш выходит к морю у города Эль-Ариш на севере Синая."
  uk:
    - "Сихор позначає південно-західний кінець обітованої землі у двох уривках. Ісус Навин описує землю, що ще лишалася для захоплення, як таку, що йде «від Сихора, що тече на схід сонця від Египту, аж до півношньої границї Екронської» — край п'яти володарів філістимських; а коли Давид переносив скриню з Кір'ят-Єаріма, він зібрав увесь Ізраїль «від Египецького Сихор-потока до ввіходу в Емат» — ідіома, що означає всю землю від краю до краю. Ім'я це єгипетське, його зазвичай тлумачать як «води Гора», а в інших місцях пророків Сихор очевидно означає Ніл або одне з його рукавів."
    - "Яка саме вода мається на увазі на кордоні, обговорюється. Багато хто вважає, що це Пелусійський рукав — найсхідніший рукав Нілу в дельті, що впадав у море біля Пелусія; інші думають, що кордон проходив по ваді Ель-Аріш, Потоку Єгипетському інших переліків кордонів, і що Сихор тут — інша його назва; дехто просто бере його за Ніл. Карта показує Пелусійський рукав і ваді Ель-Аріш, а також Нахал-Бесор на південь від Гази, який дехто пропонував. Пелусійський рукав давно замулився і зберігся лише слідами в північно-східній дельті поблизу Порт-Саїда; ваді Ель-Аріш впадає в море біля міста Ель-Аріш на півночі Синаю."
  es:
    - "Sihor marca el extremo suroccidental de la tierra prometida en dos pasajes. Josué describe la tierra que aún quedaba por tomar como la que va «Desde Sihor, que está delante de Egipto, hasta el término de Accarón al norte», el país de los cinco señores de los filisteos; y cuando David subió el arca desde Quiriat-jearim, reunió a todo Israel «desde Sihor de Egipto hasta entrar en Hamath», una expresión para todo el país de un extremo a otro. El nombre es egipcio, por lo común explicado como «las aguas de Horus», y en otros lugares de los profetas Sihor significa claramente el Nilo o uno de sus brazos."
    - "Qué agua se quiere decir en la frontera se debate. Muchos la toman por el brazo pelusíaco, el brazo más oriental del Nilo en el Delta, que desembocaba en el mar cerca de Pelusio; otros piensan que la frontera estaba en el uadi el-Arish, el Torrente de Egipto de otras listas de fronteras, y que Sihor es aquí otro nombre para él; unos pocos lo toman simplemente por el Nilo. El mapa muestra el brazo pelusíaco y el uadi el-Arish, y también el Nahal Besor, al sur de Gaza, que algunos han propuesto. El brazo pelusíaco se cegó hace mucho y sobrevive solo como vestigios en el noreste del Delta cerca de Port Said; el uadi el-Arish llega al mar en la ciudad de El-Arish, en el norte del Sinaí."
  pt:
    - "Sior marca o extremo sudoeste da terra prometida em duas passagens. Josué descreve a terra que ainda restava a tomar como indo “desde o Sior, que está diante do Egito, até a fronteira de Ecrom ao norte”, o país dos cinco senhores dos filisteus; e quando Davi trouxe a arca de Quiriate-Jearim, reuniu todo o Israel “desde o rio Sior, no Egito, até a entrada de Hamate”, expressão para toda a terra de ponta a ponta. O nome é egípcio, em geral explicado como “as águas de Hórus”, e em outros lugares dos profetas Sior designa claramente o Nilo ou um de seus braços."
    - "Que água se tem em vista na fronteira é debatido. Muitos a tomam pelo braço pelusíaco, o braço mais oriental do Nilo no Delta, que desaguava no mar perto de Pelúsio; outros pensam que a fronteira ficava no Wadi el-Arish, o Ribeiro do Egito de outras listas de fronteiras, e que Sior é aqui outro nome para ele; uns poucos o tomam simplesmente pelo Nilo. O mapa mostra o braço pelusíaco e o Wadi el-Arish, e também o Nahal Besor, ao sul de Gaza, que alguns propuseram. O braço pelusíaco assoreou há muito e sobrevive apenas em vestígios no nordeste do Delta, perto de Porto Said; o Wadi el-Arish chega ao mar na cidade de El-Arish, no norte do Sinai."
  de:
    - "Schihor markiert in zwei Stellen das südwestliche Ende des verheißenen Landes. Josua beschreibt das noch einzunehmende Land als verlaufend „vom Sihor an, der vor Ägypten fließt bis an die Grenze Ekrons gegen Mitternacht“, das Land der fünf Herren der Philister; und als David die Lade aus Kirjat-Jearim heraufholte, versammelte er ganz Israel „vom Sihor Ägyptens an, bis man kommt gen Hamath“, eine Redewendung für das ganze Land von einem Ende zum anderen. Der Name ist ägyptisch, meist als „Wasser des Horus“ erklärt, und anderswo bei den Propheten meint Schihor eindeutig den Nil oder einen seiner Arme."
    - "Welches Wasser an der Grenze gemeint ist, ist umstritten. Viele halten es für den pelusischen Arm, den östlichsten Nilarm im Delta, der nahe Pelusium ins Meer mündete; andere meinen, die Grenze habe am Wadi el-Arisch gelegen, dem Bach Ägyptens anderer Grenzlisten, und Schihor sei hier ein anderer Name dafür; einige halten es schlicht für den Nil. Die Karte zeigt den pelusischen Arm und das Wadi el-Arisch und außerdem den Nahal Besor südlich von Gaza, den manche vorgeschlagen haben. Der pelusische Arm verlandete längst und überlebt nur als Spuren im nordöstlichen Delta nahe Port Said; das Wadi el-Arisch erreicht das Meer bei der Stadt El-Arisch im nördlichen Sinai."
  fr:
    - "Schichor marque l’extrémité sud-ouest de la terre promise dans deux passages. Josué décrit le pays qui restait à prendre comme allant « depuis le Schichor qui coule devant l’Égypte jusqu’à la frontière d’Ékron au nord », le pays des cinq princes des Philistins ; et quand David fit monter l’arche de Kirjath-Jearim, il rassembla tout Israël « depuis le Schichor d’Égypte jusqu’à l’entrée de Hamath », expression pour tout le pays d’un bout à l’autre. Le nom est égyptien, d’ordinaire expliqué comme « les eaux d’Horus », et ailleurs chez les prophètes Schichor désigne clairement le Nil ou l’un de ses bras."
    - "Quelle eau est visée à la frontière est débattu. Beaucoup y voient la branche pélusiaque, le bras le plus oriental du Nil dans le Delta, qui se jetait dans la mer près de Péluse ; d’autres pensent que la frontière passait au Wadi el-Arish, le torrent d’Égypte des autres listes de frontières, et que Schichor en est ici un autre nom ; quelques-uns y voient simplement le Nil. La carte montre la branche pélusiaque et le Wadi el-Arish, ainsi que le Nahal Besor au sud de Gaza, que certains ont proposé. La branche pélusiaque s’est envasée depuis longtemps et ne survit qu’en traces dans le nord-est du Delta près de Port-Saïd ; le Wadi el-Arish atteint la mer à la ville d’El-Arish, dans le nord du Sinaï."
  it:
    - "Sicor segna l’estremità sud-occidentale della terra promessa in due passi. Giosuè descrive il paese che restava ancora da prendere come esteso «dallo Scihor che scorre a oriente dell’Egitto, sino al confine di Ekron a settentrione», il paese dei cinque principi dei Filistei; e quando Davide riportò l’arca da Kiriat-Iearim radunò tutto Israele «dallo Scihor d’Egitto fino all’ingresso di Hamath», un’espressione per l’intero paese da un capo all’altro. Il nome è egizio, di solito spiegato come «le acque di Horus», e altrove nei profeti Sicor significa chiaramente il Nilo o uno dei suoi bracci."
    - "Quale acqua sia intesa al confine è dibattuto. Molti la ritengono il ramo pelusiaco, il braccio più orientale del Nilo nel Delta, che sfociava in mare presso Pelusio; altri pensano che il confine fosse al Wadi el-Arish, il Torrente d’Egitto di altri elenchi di confine, e che Sicor sia qui un altro nome per esso; pochi lo prendono semplicemente come il Nilo. La mappa mostra il ramo pelusiaco e il Wadi el-Arish, e anche il Nahal Besor a sud di Gaza, proposto da alcuni. Il ramo pelusiaco si insabbiò da tempo e sopravvive solo come tracce nel Delta nord-orientale presso Porto Said; il Wadi el-Arish raggiunge il mare alla città di El-Arish nel Sinai settentrionale."
  pl:
    - "Szichor wyznacza południowo-zachodni kraniec ziemi obiecanej w dwóch fragmentach. Jozue opisuje ziemię, która pozostała do zdobycia, jako biegnącą od Szichoru, który leży przed Egiptem, aż do granic Ekronu na północy, kraj pięciu władców filistyńskich; a gdy Dawid sprowadzał arkę z Kiriat-Jearim, zgromadził całego Izraela od Szichoru egipskiego aż do wejścia do Chamat, co jest idiomem oznaczającym cały kraj od końca do końca. Nazwa jest egipska, zwykle objaśniana jako „wody Horusa”, a gdzie indziej u proroków Szichor wyraźnie oznacza Nil lub jedno z jego ramion."
    - "Która woda jest tu na myśli na granicy, jest dyskutowane. Wielu uważa, że to ramię peluzyjskie, najbardziej wschodnie ramię Nilu w Delcie, które uchodziło do morza koło Peluzjum; inni sądzą, że granica leżała nad Wadi el-Arisz, Potokiem Egipskim z innych list granicznych, i że Szichor jest tu jego innym imieniem; nieliczni biorą to po prostu za Nil. Mapa pokazuje ramię peluzyjskie i Wadi el-Arisz, a także Nahal Besor na południe od Gazy, proponowany przez niektórych. Ramię peluzyjskie zamuliło się dawno temu i przetrwało tylko jako ślady w północno-wschodniej Delcie koło Port Said; Wadi el-Arisz dociera do morza w mieście El-Arisz w północnym Synaju."
  cs:
    - "Šichor označuje jihozápadní konec zaslíbené země ve dvou pasážích. Jozue popisuje zemi, která zůstávala k dobytí, jako sahající „Od Níle, kterýž jest naproti Egyptu, až ku pomezí Akaron na půlnoci“, zemi pěti pelištejských knížat; a když David přivážel truhlu z Kirjat-jearímu, shromáždil všechen Izrael „od Nílu Egyptského, až kudy se vchází do Emat“, rčení pro celou zemi od konce do konce. Jméno je egyptské, obvykle vykládané jako „vody Hóra“, a jinde u proroků Šichor jasně znamená Nil nebo jedno z jeho ramen."
    - "Která voda se na hranici myslí, je sporné. Mnozí v ní vidí pelúsijské rameno, nejvýchodnější rameno Nilu v Deltě, které ústilo do moře poblíž Pelúsia; jiní soudí, že hranice vedla ve Vádí el-Aríš, Egyptském potoku jiných hraničních seznamů, a že Šichor je zde jeho jiným jménem; několik jich v něm vidí prostě Nil. Mapa ukazuje pelúsijské rameno a Vádí el-Aríš a také Nachal Besor jižně od Gazy, který někteří navrhli. Pelúsijské rameno dávno zaniklo a zůstalo jen ve stopách v severovýchodní Deltě poblíž Port Saídu; Vádí el-Aríš ústí do moře u města El-Aríš v severním Sinaji."
  nl:
    - "Sichor markeert het zuidwestelijke einde van het beloofde land in twee passages. Jozua beschrijft het land dat nog moest worden ingenomen als lopend “van de Sichor, die voor aan Egypte is, tot aan de landpale van Ekron tegen het noorden”, het land van de vijf vorsten der Filistijnen; en toen David de ark uit Kirjat-Jearim haalde, verzamelde hij heel Israël “van het Egyptische Sichor af, tot daar men komt te Hamath”, een uitdrukking voor het hele land van het ene tot het andere einde. De naam is Egyptisch, meestal verklaard als “de wateren van Horus”, en elders bij de profeten betekent Sichor duidelijk de Nijl of een van haar armen."
    - "Welk water aan de grens bedoeld is, is omstreden. Velen houden het voor de Pelusische arm, de oostelijkste arm van de Nijl in de Delta, die bij Pelusium in zee uitliep; anderen menen dat de grens bij de Wadi el-Arisj lag, de Beek van Egypte uit andere grenslijsten, en dat Sichor hier een andere naam daarvoor is; enkelen nemen het eenvoudig voor de Nijl. De kaart toont de Pelusische arm en de Wadi el-Arisj, en ook de Nahal Besor ten zuiden van Gaza, die sommigen hebben voorgesteld. De Pelusische arm verzandde lang geleden en bestaat alleen nog als sporen in de noordoostelijke Delta bij Port Said; de Wadi el-Arisj bereikt de zee bij de stad El-Arisj in het noorden van de Sinaï."
  sv:
    - "Shihor markerar det utlovade landets sydvästra ände i två passager. Josua beskriver landet som ännu återstod att ta som löpande ”mellan Sihor, öster om Egypten, och Ekrons område norrut”, de fem filisteiska hövdingarnas land; och när David hämtade upp arken från Kirjat-Jearim församlade han hela Israel ”från Sihor i Egypten ända dit där vägen går till Hamat”, ett uttryck för hela landet från ände till ände. Namnet är egyptiskt, vanligen förklarat som ”Horus vatten”, och på andra ställen hos profeterna betyder Shihor tydligt Nilen eller en av dess grenar."
    - "Vilket vatten som avses vid gränsen är omdebatterat. Många tar det för den pelusiska grenen, den östligaste armen av Nilen i deltat, som rann ut i havet nära Pelusium; andra menar att gränsen låg vid Wadi el-Arish, Egyptens bäck i andra gränsförteckningar, och att Shihor här är ett annat namn på den; några tar det helt enkelt för Nilen. Kartan visar den pelusiska grenen och Wadi el-Arish, och även Nahal Besor söder om Gaza, som vissa har föreslagit. Den pelusiska grenen slammade igen för länge sedan och överlever bara som spår i nordöstra deltat nära Port Said; Wadi el-Arish når havet vid staden El-Arish i norra Sinai."
  nb:
    - "Sjihor markerer den sørvestlige enden av det lovede land i to tekster. Josva beskriver landet som ennå gjensto å ta som løpende «mellem Sihor østenfor Egypten og Ekrons landemerke mot nord», filisternes fem fyrsters land; og da David hentet arken opp fra Kirjat-Jearim, samlet han hele Israel «fra Sihor i Egypten til bortimot Hamat», et uttrykk for hele landet fra ende til annen. Navnet er egyptisk, vanligvis forklart som «Horus' vann», og andre steder hos profetene betyr Sjihor tydelig Nilen eller en av armene."
    - "Hvilket vann som menes ved grensen, er omdiskutert. Mange tar det for den pelusiske armen, den østligste armen av Nilen i Deltaet, som løp ut i havet nær Pelusium; andre mener at grensen lå ved Wadi el-Arish, Egypts bekk i andre grenselister, og at Sjihor her er et annet navn på den; noen få tar det rett og slett for Nilen. Kartet viser den pelusiske armen og Wadi el-Arish, og også Besor-bekken sør for Gasa, som noen har foreslått. Den pelusiske armen siltet igjen for lenge siden og overlever bare som spor i det nordøstlige Deltaet nær Port Said; Wadi el-Arish når havet ved byen El-Arish i nordlige Sinai."
