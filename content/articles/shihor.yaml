# Overview article (ADR 0007). Mainstream facts only; this id covers the border Shihor of Joshua 13 and 1 Chronicles 13; the Nile branch and the Wadi el-Arish are given as the two views, the candidates on the map named, none chosen.
id: shihor
place: a305f43
title:
  en: "Shihor"
  ru: "Сихор"
  uk: "Сихор"
  es: "Sihor"
  pt: "Sior"
  de: "Schihor"
  fr: "Schichor"
body:
  en:
    - "Shihor marks the south-western end of the promised land in two passages. Joshua describes the land that still remained to be taken as running “from Sihor, which is before Egypt, even unto the borders of Ekron northward”, the country of the five lords of the Philistines; and when David brought up the ark from Kirjath-jearim he gathered all Israel “from Shihor of Egypt even unto the entering of Hemath”, an idiom for the whole land from end to end. The name is Egyptian, usually explained as “the waters of Horus”, and elsewhere in the prophets Shihor plainly means the Nile or one of its arms."
    - "Which water is meant at the border is debated. Many take it to be the Pelusiac branch, the easternmost arm of the Nile in the Delta, which ran out to the sea near Pelusium; others think the border lay at the Wadi el-Arish, the Brook of Egypt of other border lists, and that Shihor is here another name for it; a few take it simply as the Nile. The map shows all three. The Pelusiac branch silted up long ago and survives only as traces in the north-eastern Delta near Port Said; the Wadi el-Arish reaches the sea at the city of El-Arish in northern Sinai."
  ru:
    - "Сихор отмечает юго-западный край обетованной земли в двух отрывках. Книга Иисуса Навина описывает ещё не занятую землю как простирающуюся «от Сихора, что пред Египтом, до пределов Екрона к северу», — страну пяти владельцев Филистимских; а когда Давид переносил ковчег из Кириаф-Иарима, он собрал всех израильтян «от Шихора Египетского до входа в Емаф» — оборот, означающий всю землю из конца в конец. Имя египетское, его обычно толкуют как «воды Гора», и в других местах у пророков Сихор ясно означает Нил или один из его рукавов."
    - "Какая вода имеется в виду на границе, спорно. Многие считают, что это Пелусийский рукав — самый восточный рукав Нила в Дельте, впадавший в море у Пелусия; другие думают, что граница проходила по Вади-Эль-Ариш, Потоку Египетскому других описаний границ, и что Сихор здесь — другое его имя; некоторые видят в нём просто Нил. На карте показаны все три варианта. Пелусийский рукав давно занесло, и от него остались лишь следы на северо-востоке Дельты близ Порт-Саида; Вади-Эль-Ариш выходит к морю у города Эль-Ариш на севере Синая."
  uk:
    - "Сихор позначає південно-західний кінець обітованої землі у двох уривках. Ісус Навин описує землю, що ще лишалася для захоплення, як таку, що йде «від Сихора, що тече на схід сонця від Египту, аж до півношньої границї Екронської» — край п'яти володарів філістимських; а коли Давид переносив скриню з Кір'ят-Єаріма, він зібрав увесь Ізраїль «від Египецького Сихор-потока до ввіходу в Емат» — ідіома, що означає всю землю від краю до краю. Ім'я це єгипетське, його зазвичай тлумачать як «води Гора», а в інших місцях пророків Сихор очевидно означає Ніл або одне з його рукавів."
    - "Яка саме вода мається на увазі на кордоні, обговорюється. Багато хто вважає, що це Пелусійський рукав — найсхідніший рукав Нілу в дельті, що впадав у море біля Пелусія; інші думають, що кордон проходив по ваді Ель-Аріш, Потоку Єгипетському інших переліків кордонів, і що Сихор тут — інша його назва; дехто просто бере його за Ніл. Карта показує всі три. Пелусійський рукав давно замулився і зберігся лише слідами в північно-східній дельті поблизу Порт-Саїда; ваді Ель-Аріш впадає в море біля міста Ель-Аріш на півночі Синаю."
  es:
    - "Sihor marca el extremo suroccidental de la tierra prometida en dos pasajes. Josué describe la tierra que aún quedaba por tomar como la que va «Desde Sihor, que está delante de Egipto, hasta el término de Accarón al norte», el país de los cinco señores de los filisteos; y cuando David subió el arca desde Quiriat-jearim, reunió a todo Israel «desde Sihor de Egipto hasta entrar en Hamath», una expresión para todo el país de un extremo a otro. El nombre es egipcio, por lo común explicado como «las aguas de Horus», y en otros lugares de los profetas Sihor significa claramente el Nilo o uno de sus brazos."
    - "Qué agua se quiere decir en la frontera se debate. Muchos la toman por el brazo pelusíaco, el brazo más oriental del Nilo en el Delta, que desembocaba en el mar cerca de Pelusio; otros piensan que la frontera estaba en el uadi el-Arish, el Torrente de Egipto de otras listas de fronteras, y que Sihor es aquí otro nombre para él; unos pocos lo toman simplemente por el Nilo. El mapa muestra las tres. El brazo pelusíaco se cegó hace mucho y sobrevive solo como vestigios en el noreste del Delta cerca de Port Said; el uadi el-Arish llega al mar en la ciudad de El-Arish, en el norte del Sinaí."
  pt:
    - "Sior marca o extremo sudoeste da terra prometida em duas passagens. Josué descreve a terra que ainda restava a tomar como indo “desde o Sior, que está diante do Egito, até a fronteira de Ecrom ao norte”, o país dos cinco senhores dos filisteus; e quando Davi trouxe a arca de Quiriate-Jearim, reuniu todo o Israel “desde o rio Sior, no Egito, até a entrada de Hamate”, expressão para toda a terra de ponta a ponta. O nome é egípcio, em geral explicado como “as águas de Hórus”, e em outros lugares dos profetas Sior designa claramente o Nilo ou um de seus braços."
    - "Que água se tem em vista na fronteira é debatido. Muitos a tomam pelo braço pelusíaco, o braço mais oriental do Nilo no Delta, que desaguava no mar perto de Pelúsio; outros pensam que a fronteira ficava no Wadi el-Arish, o Ribeiro do Egito de outras listas de fronteiras, e que Sior é aqui outro nome para ele; uns poucos o tomam simplesmente pelo Nilo. O mapa mostra os três. O braço pelusíaco assoreou há muito e sobrevive apenas em vestígios no nordeste do Delta, perto de Porto Said; o Wadi el-Arish chega ao mar na cidade de El-Arish, no norte do Sinai."
  de:
    - "Schihor markiert in zwei Stellen das südwestliche Ende des verheißenen Landes. Josua beschreibt das noch einzunehmende Land als verlaufend „vom Sihor an, der vor Ägypten fließt bis an die Grenze Ekrons gegen Mitternacht“, das Land der fünf Herren der Philister; und als David die Lade aus Kirjat-Jearim heraufholte, versammelte er ganz Israel „vom Sihor Ägyptens an, bis man kommt gen Hamath“, eine Redewendung für das ganze Land von einem Ende zum anderen. Der Name ist ägyptisch, meist als „Wasser des Horus“ erklärt, und anderswo bei den Propheten meint Schihor eindeutig den Nil oder einen seiner Arme."
    - "Welches Wasser an der Grenze gemeint ist, ist umstritten. Viele halten es für den pelusischen Arm, den östlichsten Nilarm im Delta, der nahe Pelusium ins Meer mündete; andere meinen, die Grenze habe am Wadi el-Arisch gelegen, dem Bach Ägyptens anderer Grenzlisten, und Schihor sei hier ein anderer Name dafür; einige halten es schlicht für den Nil. Die Karte zeigt alle drei. Der pelusische Arm verlandete längst und überlebt nur als Spuren im nordöstlichen Delta nahe Port Said; das Wadi el-Arisch erreicht das Meer bei der Stadt El-Arisch im nördlichen Sinai."
  fr:
    - "Schichor marque l’extrémité sud-ouest de la terre promise dans deux passages. Josué décrit le pays qui restait à prendre comme allant « depuis le Schichor qui coule devant l’Égypte jusqu’à la frontière d’Ékron au nord », le pays des cinq princes des Philistins ; et quand David fit monter l’arche de Kirjath-Jearim, il rassembla tout Israël « depuis le Schichor d’Égypte jusqu’à l’entrée de Hamath », expression pour tout le pays d’un bout à l’autre. Le nom est égyptien, d’ordinaire expliqué comme « les eaux d’Horus », et ailleurs chez les prophètes Schichor désigne clairement le Nil ou l’un de ses bras."
    - "Quelle eau est visée à la frontière est débattu. Beaucoup y voient la branche pélusiaque, le bras le plus oriental du Nil dans le Delta, qui se jetait dans la mer près de Péluse ; d’autres pensent que la frontière passait au Wadi el-Arish, le torrent d’Égypte des autres listes de frontières, et que Schichor en est ici un autre nom ; quelques-uns y voient simplement le Nil. La carte montre les trois. La branche pélusiaque s’est envasée depuis longtemps et ne survit qu’en traces dans le nord-est du Delta près de Port-Saïd ; le Wadi el-Arish atteint la mer à la ville d’El-Arish, dans le nord du Sinaï."
