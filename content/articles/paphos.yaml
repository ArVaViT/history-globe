body:
  en:
    - "The Paphos of Acts is New Paphos, the harbour city on the south-west coast of Cyprus, at modern Kato Paphos. Strabo puts Old Paphos, now Kouklia, sixty stadia away by land; there stood the ancient sanctuary of the Paphian Aphrodite, whose image, Tacitus notes, was not a human figure but a rounded cone. Old Paphos was the seat of one of the island's kingdoms: about 673 BC the Assyrian king Esarhaddon listed Ituandar, king of Paphos, among the ten kings of Cyprus."
    - "New Paphos was founded near the end of the fourth century BC, probably by Nicocles, the last king of Paphos; Strabo gives the legendary Agapenor as its founder. Under the later Ptolemies it became the seat of government of Cyprus, and it kept that role after Rome annexed the island in 58 BC. Each year men and women from the other cities walked in procession along the road to the old sanctuary. After an earthquake in 15 BC Augustus gave the Paphians money and allowed them to call their city Augusta."
    - 'Barnabas and Saul crossed the island from Salamis to Paphos. There the proconsul Sergius Paulus, whom Acts calls "a prudent man", called for them and wished to hear the word of God, but the sorcerer Bar-jesus, called Elymas, tried to turn him away from the faith. Saul, "who also is called Paul", declared that the hand of the Lord was upon him, and he was blind for a season; the proconsul believed. From here on Acts calls the apostle Paul, and from Paphos the company sailed to Perga in Pamphylia.'
    - "In AD 69 Titus, on his way back to his father's army in the east, turned aside to see the temple of the Paphian Venus, and Tacitus describes its rites. The great houses of Roman Paphos, among them the Houses of Dionysus, Theseus and Aion, have mosaic floors of the late second to fifth centuries that are among the finest in the eastern Mediterranean. In the fourth century, after earthquakes, the capital passed to Salamis, rebuilt as Constantia."
  ru:
    - "Паф Деяний — это Новый Паф, гавань на юго-западном берегу Кипра, на месте нынешнего Като-Пафоса. Старый Паф, нынешнюю Куклию, Страбон помещает в шестидесяти стадиях по суше; там стояло древнее святилище Афродиты Пафосской, чей образ, как отмечает Тацит, был не человеческой фигурой, а округлым конусом. Старый Паф был столицей одного из царств острова: около 673 г. до н. э. ассирийский царь Асардан назвал Итуандара, царя Пафа, среди десяти царей Кипра."
    - "Новый Паф был основан в конце IV века до н. э., вероятно, Никоклом, последним царём Пафа; Страбон называет его основателем легендарного Агапенора. При поздних Птолемеях он стал средоточием управления Кипром и сохранил эту роль после того, как Рим в 58 г. до н. э. присоединил остров. Каждый год мужчины и женщины из других городов шли по дороге к старому святилищу торжественным шествием. После землетрясения 15 г. до н. э. Август дал пафосцам денег и позволил им называть свой город Августой."
    - "Варнава и Савл прошли весь остров от Саламина до Пафа. Там проконсул Сергий Павел, которого Деяния называют «мужем разумным», призвал их и пожелал услышать слово Божие, но волхв Вариисус, называемый Елимой, старался отвратить его от веры. Савл, «он же и Павел», объявил ему, что рука Господня на нём, и тот ослеп до времени; проконсул уверовал. Отсюда Деяния называют апостола Павлом, и из Пафа спутники отплыли в Пергию Памфилийскую."
    - "В 69 г. н. э. Тит, возвращаясь к войску своего отца на Востоке, завернул посмотреть храм Венеры Пафосской, и Тацит описывает его обряды. Большие дома римского Пафа, среди них дома Диониса, Тесея и Эона, сохранили мозаичные полы конца II–V веков, одни из лучших в Восточном Средиземноморье. В IV веке, после землетрясений, столица перешла в Саламин, отстроенный под именем Констанция."
  uk:
    - "Пафос Дій — це Новий Пафос, портове місто на південно-західному узбережжі Кіпру, нинішній Като-Пафос. Страбон ставить Старий Пафос, нині Куклія, на відстані шістдесяти стадіїв суходолом; там стояло давнє святилище пафоської Афродіти, зображенням якої, як зазначає Тацит, була не людська постать, а закруглений конус. Старий Пафос був столицею одного з царств острова: близько 673 р. до н. е. ассирійський цар Асархаддон назвав Ітуандара, царя Пафоса, серед десяти царів Кіпру."
    - "Новий Пафос було засновано наприкінці IV ст. до н. е., ймовірно Нікоклом, останнім царем Пафоса; Страбон називає засновником легендарного Агапенора. За пізніх Птолемеїв він став резиденцією уряду Кіпру і зберіг цю роль після анексії острова Римом 58 р. до н. е. Щороку чоловіки й жінки з інших міст ішли процесією дорогою до старого святилища. Після землетрусу 15 р. до н. е. Август дав пафосцям гроші й дозволив називати їхнє місто Августою."
    - "Варнава і Савл перетнули острів від Саламіна до Пафоса. Там проконсул Сергій Павел, якого Дії згадують як «чоловіка розумного», покликав їх і побажав почути слово Боже, але чарівник Вар-Ісус, званий Єлимою, намагався відвернути його від віри. Савл, «(він же) й Павел», заявив, що рука Господня на ньому, і той осліп на якийсь час; проконсул увірував. Відтоді Дії називають апостола Павлом, а з Пафоса гурт відплив до Перге в Памфілії."
    - "У 69 р. н. е. Тит, повертаючись до батькового війська на сході, звернув, щоб побачити храм пафоської Венери, і Тацит описує її обряди. Великі будинки римського Пафоса, серед них будинки Діоніса, Тесея й Айона, мають мозаїчні підлоги кінця II — V ст., що належать до найкращих у східному Середземномор’ї. У IV ст., після землетрусів, столиця перейшла до Саламіна, відбудованого як Констанція."
  es:
    - "La Pafos de los Hechos es Nueva Pafos, la ciudad portuaria de la costa suroccidental de Chipre, en la actual Kato Pafos. Estrabón sitúa Vieja Pafos, hoy Kouklia, a sesenta estadios por tierra; allí estaba el antiguo santuario de la Afrodita pafia, cuya imagen, anota Tácito, no tenía figura humana, sino que era un cono redondeado. Vieja Pafos fue sede de uno de los reinos de la isla: hacia 673 a. C. el rey asirio Esar-hadón enumeró a Ituandar, rey de Pafos, entre los diez reyes de Chipre."
    - "Nueva Pafos fue fundada hacia finales del siglo IV a. C., probablemente por Nicocles, el último rey de Pafos; Estrabón da como fundador al legendario Agapénor. Bajo los últimos Tolomeos se convirtió en sede del gobierno de Chipre, y conservó ese papel después de que Roma anexionara la isla en 58 a. C. Cada año hombres y mujeres de las demás ciudades marchaban en procesión por el camino hacia el antiguo santuario. Tras un terremoto en 15 a. C., Augusto dio dinero a los pafios y les permitió llamar a su ciudad Augusta."
    - "Bernabé y Saulo cruzaron la isla de Salamina a Pafos. Allí el procónsul Sergio Paulo, a quien los Hechos llaman «varón prudente», los hizo llamar y deseaba oír la palabra de Dios, pero el hechicero Barjesús, llamado Elimas, procuró apartarlo de la fe. Saulo, «que también es Pablo», declaró que la mano del Señor era contra él, y quedó ciego por un tiempo; el procónsul creyó. Desde aquí los Hechos llaman al apóstol Pablo, y desde Pafos la comitiva zarpó hacia Perge de Panfilia."
    - "En el 69 d. C., Tito, de regreso al ejército de su padre en el este, se desvió para ver el templo de la Venus pafia, y Tácito describe sus ritos. Las grandes casas de la Pafos romana, entre ellas las Casas de Dioniso, Teseo y Eón, tienen suelos de mosaico de finales del siglo II al V que están entre los más hermosos del Mediterráneo oriental. En el siglo IV, tras los terremotos, la capital pasó a Salamina, reconstruida como Constancia."
  pt:
    - "A Pafos de Atos é Nova Pafos, a cidade portuária da costa sudoeste de Chipre, na atual Kato Pafos. Estrabão põe Pafos Antiga, hoje Kouklia, a sessenta estádios por terra; ali ficava o antigo santuário da Afrodite Pafiana, cuja imagem, nota Tácito, não era figura humana, mas um cone arredondado. Pafos Antiga foi sede de um dos reinos da ilha: por volta de 673 a.C. o rei assírio Esar-Hadom listou Ituandar, rei de Pafos, entre os dez reis de Chipre."
    - "Nova Pafos foi fundada perto do fim do século IV a.C., provavelmente por Nicocles, o último rei de Pafos; Estrabão dá como fundador o lendário Agapenor. Sob os últimos Ptolomeus tornou-se a sede do governo de Chipre, e manteve esse papel depois que Roma anexou a ilha em 58 a.C. Todo ano homens e mulheres das outras cidades iam em procissão pela estrada até o antigo santuário. Depois de um terremoto em 15 a.C., Augusto deu dinheiro aos pafianos e permitiu que chamassem sua cidade de Augusta."
    - "Barnabé e Saulo atravessaram a ilha de Salamina a Pafos. Ali o procônsul Sérgio Paulo, a quem Atos chama de “um homem inteligente”, mandou chamá-los e quis ouvir a palavra de Deus, mas o feiticeiro Barjesus, chamado Elimas, tentou desviá-lo da fé. Saulo, “que também é chamado Paulo”, declarou que a mão do Senhor estava sobre ele, e ele ficou cego por algum tempo; o procônsul creu. Daí em diante Atos chama o apóstolo de Paulo, e de Pafos o grupo navegou para Perge, na Panfília."
    - "Em 69 d.C., Tito, a caminho do exército de seu pai no Oriente, desviou-se para ver o templo da Vênus Pafiana, e Tácito descreve seus ritos. As grandes casas da Pafos romana, entre elas as Casas de Dionísio, Teseu e Aion, têm mosaicos de pavimento do fim do século II ao V que estão entre os mais belos do Mediterrâneo oriental. No século IV, depois de terremotos, a capital passou a Salamina, reconstruída como Constância."
  de:
    - "Das Paphos der Apostelgeschichte ist Neu-Paphos, die Hafenstadt an der Südwestküste Zyperns, beim heutigen Kato Paphos. Strabon setzt Alt-Paphos, heute Kouklia, sechzig Stadien entfernt über Land; dort stand das uralte Heiligtum der paphischen Aphrodite, deren Bild nach Tacitus keine menschliche Gestalt war, sondern ein runder Kegel. Alt-Paphos war Sitz eines der Königreiche der Insel: Um 673 v. Chr. zählte der assyrische König Asarhaddon Ituandar, den König von Paphos, unter die zehn Könige Zyperns auf."
    - "Neu-Paphos wurde gegen Ende des 4. Jahrhunderts v. Chr. gegründet, wohl von Nikokles, dem letzten König von Paphos; Strabon nennt den legendären Agapenor als Gründer. Unter den späteren Ptolemäern wurde es Regierungssitz Zyperns und blieb es auch, nachdem Rom die Insel 58 v. Chr. annektiert hatte. Jedes Jahr zogen Männer und Frauen aus den anderen Städten in Prozession auf der Straße zum alten Heiligtum. Nach einem Erdbeben im Jahr 15 v. Chr. gab Augustus den Paphiern Geld und erlaubte ihnen, ihre Stadt Augusta zu nennen."
    - "Barnabas und Saulus durchquerten die Insel von Salamis nach Paphos. Dort ließ der Prokonsul Sergius Paulus, den die Apostelgeschichte „einen verständigen Mann“ nennt, sie rufen und wollte das Wort Gottes hören, doch der Zauberer Bar-Jesus, genannt Elymas, suchte ihn vom Glauben abzuhalten. Saulus, „der auch Paulus heißt“, erklärte, die Hand des Herrn sei über ihm, und er war eine Zeitlang blind; der Prokonsul kam zum Glauben. Von hier an nennt die Apostelgeschichte den Apostel Paulus, und von Paphos segelte die Gruppe nach Perge in Pamphylien."
    - "Im Jahr 69 n. Chr. kehrte Titus auf dem Rückweg zum Heer seines Vaters im Osten ab, um den Tempel der paphischen Venus zu sehen, und Tacitus beschreibt dessen Riten. Die großen Häuser des römischen Paphos, darunter die Häuser des Dionysos, des Theseus und des Aion, haben Mosaikböden des späten 2. bis 5. Jahrhunderts, die zu den schönsten im östlichen Mittelmeer gehören. Im 4. Jahrhundert ging die Hauptstadt nach Erdbeben an Salamis, das als Constantia wiederaufgebaut wurde."
  fr:
    - "La Paphos des Actes est Néa Paphos, la ville portuaire de la côte sud-ouest de Chypre, à l’actuelle Kato Paphos. Strabon place Palaepaphos, aujourd’hui Kouklia, à soixante stades par terre ; là se dressait l’antique sanctuaire de l’Aphrodite paphienne, dont l’image, note Tacite, n’était pas une figure humaine mais un cône arrondi. Palaepaphos était le siège de l’un des royaumes de l’île : vers 673 av. J.-C., le roi assyrien Assarhaddon cita Ituandar, roi de Paphos, parmi les dix rois de Chypre."
    - "Néa Paphos fut fondée vers la fin du IVe siècle av. J.-C., probablement par Nicoclès, dernier roi de Paphos ; Strabon donne pour fondateur le légendaire Agapénor. Sous les derniers Ptolémées, elle devint le siège du gouvernement de Chypre, et le resta après l’annexion de l’île par Rome en 58 av. J.-C. Chaque année, hommes et femmes des autres villes marchaient en procession le long de la route vers l’ancien sanctuaire. Après un séisme en 15 av. J.-C., Auguste donna de l’argent aux Paphiens et leur permit d’appeler leur ville Augusta."
    - "Barnabas et Saul traversèrent l’île de Salamine à Paphos. Là, le proconsul Sergius Paulus, que les Actes disent « intelligent », les fit appeler et désira entendre la parole de Dieu, mais le magicien Bar-Jésus, appelé Élymas, chercha à le détourner de la foi. Saul, « appelé aussi Paul », déclara que la main du Seigneur était sur lui, et il fut aveugle pour un temps ; le proconsul crut. À partir de là, les Actes appellent l’apôtre Paul, et de Paphos la troupe fit voile vers Perge en Pamphylie."
    - "En 69 apr. J.-C., Titus, en route pour rejoindre l’armée de son père en Orient, fit un détour pour voir le temple de la Vénus paphienne, et Tacite en décrit les rites. Les grandes demeures de la Paphos romaine, dont les maisons de Dionysos, de Thésée et d’Aïon, ont des sols de mosaïque de la fin du IIe au Ve siècle qui comptent parmi les plus beaux de la Méditerranée orientale. Au IVe siècle, après des séismes, la capitale passa à Salamine, rebâtie sous le nom de Constantia."
  it:
    - "La Pafo degli Atti è Nea Pafo, la città portuale sulla costa sud-occidentale di Cipro, all’odierna Kato Paphos. Strabone pone Palea Pafo, oggi Kouklia, a sessanta stadi di distanza per via di terra; là sorgeva l’antico santuario dell’Afrodite pafia, la cui immagine, nota Tacito, non era una figura umana ma un cono arrotondato. Palea Pafo era la sede di uno dei regni dell’isola: verso il 673 a.C. il re assiro Assaraddon elencò Ituandar, re di Pafo, tra i dieci re di Cipro."
    - "Nea Pafo fu fondata verso la fine del IV secolo a.C., probabilmente da Nicocle, l’ultimo re di Pafo; Strabone indica come fondatore il leggendario Agapenore. Sotto gli ultimi Tolomei divenne la sede del governo di Cipro, e conservò quel ruolo dopo che Roma annetté l’isola nel 58 a.C. Ogni anno uomini e donne delle altre città andavano in processione lungo la strada verso l’antico santuario. Dopo un terremoto nel 15 a.C. Augusto diede denaro ai Pafii e permise loro di chiamare la città Augusta."
    - "Barnaba e Saulo attraversarono l’isola da Salamina a Pafo. Là il proconsole Sergio Paolo, che gli Atti dicono «uomo intelligente», li chiamò e volle udire la parola di Dio, ma il mago Bar-Gesù, chiamato Elima, cercò di stornarlo dalla fede. Saulo, «chiamato anche Paolo», dichiarò che «la mano del Signore è sopra te», ed egli fu cieco per un certo tempo; il proconsole credette. Da qui in poi gli Atti chiamano l’apostolo Paolo, e da Pafo il gruppo salpò per Perge di Panfilia."
    - "Nel 69 d.C. Tito, tornando verso l’esercito del padre in Oriente, deviò per vedere il tempio di Venere pafia, e Tacito ne descrive i riti. Le grandi case della Pafo romana, tra cui le Case di Dioniso, di Teseo e di Aion, hanno pavimenti a mosaico dalla fine del II al V secolo che sono tra i più belli del Mediterraneo orientale. Nel IV secolo, dopo i terremoti, la capitale passò a Salamina, ricostruita come Costanza."
  pl:
    - "Pafos z Dziejów Apostolskich to Nowe Pafos, miasto portowe na południowo-zachodnim wybrzeżu Cypru, w dzisiejszym Kato Pafos. Strabon umieszcza Stare Pafos, dziś Kuklia, o sześćdziesiąt stadiów drogą lądową; tam stało starożytne sanktuarium Afrodyty Pafijskiej, której wizerunek, jak zauważa Tacyt, nie był postacią ludzką, lecz zaokrąglonym stożkiem. Stare Pafos było siedzibą jednego z królestw wyspy: około 673 roku p.n.e. asyryjski król Asarhaddon wymienił Ituandara, króla Pafos, wśród dziesięciu królów Cypru."
    - "Nowe Pafos założono pod koniec IV wieku p.n.e.; prawdopodobnie jego założycielem był Nikokles, ostatni król Pafos, choć Strabon podaje jako założyciela legendarnego Agapenora. Za późniejszych Ptolemeuszów stało się siedzibą władz Cypru i zachowało tę rolę po zajęciu wyspy przez Rzym w 58 roku p.n.e. Co roku mężczyźni i kobiety z innych miast szli procesją drogą do starego sanktuarium. Po trzęsieniu ziemi w 15 roku p.n.e. August dał mieszkańcom Pafos pieniądze i zezwolił nazywać miasto Augusta."
    - "Barnaba i Saul przeszli wyspę z Salaminy do Pafos. Przy prokonsulu Sergiuszu Pawle, „mężu roztropnym”, był tam czarownik Bar-Jezus, zwany Elimasem; prokonsul wezwał Barnabę i Saula i pragnął słuchać słowa Bożego, lecz czarownik starał się odwrócić go od wiary. Saul, „którego zowią i Pawłem”, oznajmił, że ręka Pańska jest nad czarownikiem, i ten oślepł na pewien czas; prokonsul uwierzył. Od tej chwili Dzieje nazywają apostoła Pawłem, a z Pafos towarzysze popłynęli do Perge w Pamfilii."
    - "W 69 roku n.e. Tytus, wracając do armii swego ojca na wschodzie, zboczył, by zobaczyć świątynię Wenus Pafijskiej, a Tacyt opisuje jej obrzędy. Wielkie domy rzymskiego Pafos, wśród nich Dom Dionizosa, Tezeusza i Ajona, mają posadzki mozaikowe z okresu od końca II do V wieku, należące do najpiękniejszych we wschodnim Morzu Śródziemnym. W IV wieku, po trzęsieniach ziemi, stolica przeszła do Salaminy, odbudowanej jako Konstancja."
  cs:
    - "Pafos z Skutků je Nový Pafos, přístavní město na jihozápadním pobřeží Kypru, dnešní Kato Pafos. Strabón klade Starý Pafos, dnes Kukliá, šedesát stadií daleko po souši; stála tam prastará svatyně pafské Afrodíty, jejíž podobou podle Tacita nebyla lidská postava, ale zaoblený kužel. Starý Pafos byl sídlem jednoho z ostrovních království: asi roku 673 př. n. l. uvedl asyrský král Asarhadón Ituandara, krále Pafu, mezi deseti králi Kypru."
    - "Nový Pafos byl založen koncem 4. století př. n. l., pravděpodobně Nikoklem, posledním králem Pafu; Strabón uvádí jako zakladatele bájného Agapéna. Za pozdějších Ptolemaiovců se stal sídlem vlády Kypru a tuto úlohu si udržel i poté, co Řím ostrov roku 58 př. n. l. připojil. Každý rok šli muži a ženy z ostatních měst průvodem po cestě k staré svatyni. Po zemětřesení roku 15 př. n. l. dal Augustus Pafským peníze a dovolil jim nazývat město Augusta."
    - "Barnabáš a Saul přešli ostrov ze Salamis do Pafu. Tam prokonzul Sergius Paulus, o němž Skutky praví, že byl „muž opatrný“, je povolal a chtěl slyšet slovo Boží, ale čaroděj Barježíš, zvaný Elymas, se ho snažil odvrátit od víry. Saul, „kterýž slove i Pavel“, prohlásil, že na něm je ruka Páně, a byl na čas slepý; prokonzul uvěřil. Od té chvíle Skutky nazývají apoštola Pavlem a z Pafu družina odplula do Perge v Pamfylii."
    - "Roku 69 n. l. se Titus na cestě zpět k otcovu vojsku na východě odklonil, aby spatřil chrám pafské Venuše, a Tacitus popisuje její obřady. Velké domy římského Pafu, mezi nimi domy Dionýsův, Théseův a Aiónův, mají mozaikové podlahy z pozdního 2. až 5. století, které patří k nejkrásnějším ve východním Středomoří. Ve 4. století přešlo po zemětřeseních hlavní město na Salamis, přestavěnou jako Constantia."
  nl:
    - "Het Paffos van de Handelingen is Nieuw-Paffos, de havenstad aan de zuidwestkust van Cyprus, bij het huidige Kato Paphos. Strabo plaatst Oud-Paffos, nu Kouklia, over land zestig stadiën verder; daar stond het oude heiligdom van de Paffische Aphrodite, wier beeld volgens Tacitus geen menselijke gedaante was maar een afgeronde kegel. Oud-Paffos was de zetel van een van de koninkrijken van het eiland: omstreeks 673 v.Chr. noemde de Assyrische koning Esarhaddon Ituandar, koning van Paffos, onder de tien koningen van Cyprus."
    - "Nieuw-Paffos werd aan het eind van de 4e eeuw v.Chr. gesticht, waarschijnlijk door Nikokles, de laatste koning van Paffos; Strabo noemt de legendarische Agapenor als stichter. Onder de latere Ptolemaeën werd het de regeringszetel van Cyprus, en dat bleef het nadat Rome het eiland in 58 v.Chr. annexeerde. Elk jaar liepen mannen en vrouwen uit de andere steden in processie over de weg naar het oude heiligdom. Na een aardbeving in 15 v.Chr. gaf Augustus de Paffiërs geld en stond hij toe hun stad Augusta te noemen."
    - "Barnabas en Saulus trokken van Salamis naar Paffos over het eiland. Daar liet de proconsul Sergius Paulus, door Handelingen “een verstandigen man” genoemd, hen roepen en wilde het woord van God horen, maar de tovenaar Bar-Jezus, Elymas genoemd, probeerde hem van het geloof af te houden. Saulus, “die ook Paulus genaamd is”, verklaarde dat de hand van de Heer op hem was, en hij was voor een tijd blind; de proconsul geloofde. Vanaf hier noemt Handelingen de apostel Paulus, en vanuit Paffos voer het gezelschap naar Perge in Pamfylië."
    - "In 69 n.Chr. week Titus, op weg terug naar het leger van zijn vader in het oosten, af om de tempel van de Paffische Venus te zien, en Tacitus beschrijft de riten. De grote huizen van het Romeinse Paffos, onder andere de Huizen van Dionysos, Theseus en Aion, hebben mozaïekvloeren uit de late 2e tot de 5e eeuw die tot de mooiste van de oostelijke Middellandse Zee behoren. In de 4e eeuw ging de hoofdstad na aardbevingen over op Salamis, herbouwd als Constantia."
  sv:
    - "Pafos i Apostlagärningarna är Nya Pafos, hamnstaden på Cyperns sydvästra kust, vid nuvarande Kato Pafos. Strabon placerar Gamla Pafos, nu Kouklia, sextio stadier bort landvägen; där stod den forntida helgedomen för den pafiska Afrodite, vars bild, noterar Tacitus, inte var en människogestalt utan en rundad kon. Gamla Pafos var säte för ett av öns kungadömen: omkring 673 f.Kr. förtecknade den assyriske kungen Esarhaddon Ituandar, kung av Pafos, bland Cyperns tio kungar."
    - "Nya Pafos grundades nära slutet av 300-talet f.Kr., sannolikt av Nikokles, Pafos siste kung; Strabon anger den legendariske Agapenor som dess grundare. Under de senare ptolemaierna blev det Cyperns regeringssäte, och det behöll den rollen sedan Rom annekterat ön 58 f.Kr. Varje år gick män och kvinnor från de andra städerna i procession längs vägen till den gamla helgedomen. Efter en jordbävning 15 f.Kr. gav Augustus pafierna pengar och lät dem kalla sin stad Augusta."
    - "Barnabas och Saulus korsade ön från Salamis till Pafos. Där kallade landshövdingen Sergius Paulus, som Apostlagärningarna beskriver som ”en förståndig man”, till sig dem och ville höra Guds ord, men trollkarlen Barjesus, kallad Elymas, försökte vända honom bort från tron. Saulus, ”som ock kallades Paulus”, förklarade att Herrens hand var över honom, och han blev blind för en tid; landshövdingen kom till tro. Från och med nu kallar Apostlagärningarna aposteln Paulus, och från Pafos seglade sällskapet till Perge i Pamfylien."
    - "År 69 e.Kr. gjorde Titus, på väg tillbaka till sin fars armé i öster, en avstickare för att se templet för den pafiska Venus, och Tacitus beskriver dess riter. De stora husen i romerska Pafos, bland dem Dionysos, Theseus och Aions hus, har mosaikgolv från sent 100-tal till 400-talet som hör till de finaste i östra Medelhavet. På 300-talet, efter jordbävningar, övergick huvudstaden till Salamis, återuppbyggt som Constantia."
  nb:
    - "Pafos i Apostlenes gjerninger er Ny-Pafos, havnebyen på sørvestkysten av Kypros, ved dagens Kato Paphos. Strabon plasserer Gamle Pafos, nå Kouklia, seksti stadier unna over land; der sto den gamle helligdommen for den pafiske Afrodite, hvis bilde, bemerker Tacitus, ikke var en menneskeskikkelse, men en avrundet kjegle. Gamle Pafos var sete for et av øyas kongedømmer: omkring 673 f.Kr. oppførte den assyriske kongen Asarhaddon Ituandar, konge av Pafos, blant de ti kongene på Kypros."
    - "Ny-Pafos ble grunnlagt mot slutten av 300-tallet f.Kr., trolig av Nikokles, Pafos' siste konge; Strabon oppgir den sagnomsuste Agapenor som grunnlegger. Under de senere ptolemeerne ble den regjeringssete for Kypros, og den beholdt den rollen etter at Roma annekterte øya i 58 f.Kr. Hvert år gikk menn og kvinner fra de andre byene i prosesjon langs veien til den gamle helligdommen. Etter et jordskjelv i 15 f.Kr. ga Augustus pafierne penger og lot dem kalle byen Augusta."
    - "Barnabas og Saulus krysset øya fra Salamis til Pafos. Der kalte landshøvdingen Sergius Paulus, som Apostlenes gjerninger kaller «en forstandig mann», dem til seg og ville høre Guds ord, men trollmannen Barjesus, kalt Elymas, forsøkte å vende ham bort fra troen. Saulus, «som også kaltes Paulus», sa at Herrens hånd var over ham, og han var blind en tid; landshøvdingen kom til troen. Fra da av kaller Apostlenes gjerninger apostelen Paulus, og fra Pafos seilte følget til Perge i Pamfylia."
    - "I 69 e.Kr. tok Titus, på vei tilbake til farens hær i øst, en avstikker for å se tempelet for den pafiske Venus, og Tacitus beskriver ritene der. De store husene i romersk Pafos, blant dem Dionysos-huset, Theseus-huset og Aion-huset, har mosaikkgulv fra slutten av 100-tallet til 400-tallet som hører til de fineste i det østlige Middelhavet. På 300-tallet gikk hovedstaden, etter jordskjelv, over til Salamis, gjenoppbygd som Konstantia."
  tl:
    - "Ang Pafos ng Mga Gawa ay ang Bagong Pafos, ang lungsod-daungan sa timog-kanlurang baybayin ng Chipre, sa makabagong Kato Paphos. Inilalagay ni Strabo ang Lumang Pafos, na ngayon ay Kouklia, nang animnapung stadia ang layo sa lupa; naroon ang sinaunang santuwaryo ng Afroditang Pafia, na ang larawan, ayon kay Tacitus, ay hindi anyong tao kundi isang bilugang kono. Ang Lumang Pafos ang luklukan ng isa sa mga kaharian ng pulo: bandang 673 BK, inilista ng haring Asiryo na si Esar-hadon si Ituandar, hari ng Pafos, sa sampung hari ng Chipre."
    - "Itinatag ang Bagong Pafos malapit sa wakas ng ika-4 na siglo BK, marahil ni Nicocles, ang huling hari ng Pafos; ibinibigay ni Strabo ang alamat na si Agapenor bilang tagapagtatag nito. Sa ilalim ng mga huling Ptolemeo, ito ang naging luklukan ng pamahalaan ng Chipre, at pinanatili nito ang tungkuling iyon pagkatapos isama ng Roma ang pulo noong 58 BK. Bawat taon, naglalakad ang mga lalaki at babae mula sa ibang mga lungsod sa prusisyon sa daan patungo sa lumang santuwaryo. Pagkatapos ng lindol noong 15 BK, binigyan ni Augusto ang mga taga-Pafos ng salapi at pinahintulutan silang tawaging Augusta ang kanilang lungsod."
    - "Tumawid sina Bernabe at Saulo sa pulo mula Salamina hanggang Pafos. Doon, ipinatawag sila ng proconsul na si Sergio Paulo, na tinatawag ng Mga Gawa na “lalaking matalino”, at nais niyang marinig ang salita ng Dios, ngunit tinangka ng manggagaway na si Bar-Jesus, na tinatawag na Elimas, na ilayo siya sa pananampalataya. Si Saulo, “na tinatawag ding Pablo”, ay nagpahayag na ang kamay ng Panginoon ay nasa kaniya, at siya ay bulag nang ilang panahon; sumampalataya ang proconsul. Mula rito ay Pablo na ang tawag ng Mga Gawa sa apostol, at mula sa Pafos ay naglayag ang pangkat patungong Perga sa Pamfilia."
    - "Noong AD 69, si Tito, sa kaniyang pagbabalik sa hukbo ng kaniyang ama sa silangan, ay lumiko upang makita ang templo ng Pafiang Venus, at inilalarawan ni Tacitus ang mga ritwal nito. Ang malalaking bahay ng Romanong Pafos, kabilang ang mga Bahay ni Dionysus, ni Teseo at ni Aion, ay may mga sahig na mosaiko mula sa huling ika-2 hanggang ika-5 siglo na kabilang sa pinakamahusay sa silangang Mediteraneo. Noong ika-4 na siglo, pagkatapos ng mga lindol, ang kabisera ay napunta sa Salamina, na muling itinayo bilang Constantia."
  da:
    - "Apostlenes Gerningers Pafos er Ny-Pafos, havnebyen på Cyperns sydvestkyst, ved nutidens Kato Pafos. Strabon placerer Gamle Pafos, nu Kouklia, tres stadier borte over land; dér lå den gamle helligdom for den pafiske Afrodite, hvis billede, bemærker Tacitus, ikke var en menneskeskikkelse, men en afrundet kegle. Gamle Pafos var sæde for et af øens kongedømmer: omkring 673 f.Kr. opregnede den assyriske konge Esarhaddon Ituandar, konge af Pafos, blandt Cyperns ti konger."
    - "Ny-Pafos blev grundlagt mod slutningen af 300-tallet f.Kr., sandsynligvis af Nikokles, Pafos' sidste konge; Strabon angiver den sagnomspundne Agapenor som dens grundlægger. Under de senere ptolemæere blev den regeringssæde for Cypern, og den beholdt den rolle, efter at Rom indlemmede øen i 58 f.Kr. Hvert år gik mænd og kvinder fra de andre byer i procession ad vejen til den gamle helligdom. Efter et jordskælv i 15 f.Kr. gav Augustus pafierne penge og tillod dem at kalde deres by Augusta."
    - "Barnabas og Saulus krydsede øen fra Salamis til Pafos. Dér kaldte prokonsulen Sergius Paulus, som Apostlenes Gerninger kalder »en forstandig Mand«, dem til sig og ønskede at høre Guds ord, men troldkarlen Bar-Jesus, kaldet Elymas, forsøgte at vende ham bort fra troen. Saulus, »som ogsaa kaldes Paulus«, erklærede, at Herrens hånd var over ham, og han var blind for en tid; prokonsulen troede. Fra da af kalder Apostlenes Gerninger apostlen Paulus, og fra Pafos sejlede følget til Perge i Pamfylien."
    - "I 69 e.Kr. drejede Titus, på vej tilbage til sin fars hær i øst, af for at se templet for den pafiske Venus, og Tacitus beskriver dets riter. De store huse i det romerske Pafos, blandt dem Dionysos', Theseus' og Aions huse, har mosaikgulve fra slutningen af 100-tallet til 400-tallet e.Kr., som hører til de fineste i det østlige Middelhav. I 300-tallet gik hovedstaden efter jordskælv til Salamis, genopbygget som Konstantia."
