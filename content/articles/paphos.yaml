# Overview article (ADR 0007). Mainstream facts only; the founder of New Paphos is named as probable, not certain.
id: paphos
place: a314765
title:
  en: "Paphos"
  ru: "Паф"
  uk: "Пафос"
  es: "Pafos"
  pt: "Pafos"
  de: "Paphos"
