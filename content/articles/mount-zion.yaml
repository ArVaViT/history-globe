# Overview article (ADR 0007). Mainstream facts only; the hill is the present-day Mount Zion (the western hill), and the article leaves the history of the name to the Zion article.
id: mount-zion
place: abd9596
title:
  en: "Mount Zion"
  ru: "Гора Сион"
  uk: "Гора Сіон"
  es: "Monte Sion"
  pt: "Monte Sião"
  de: "Berg Zion"
  fr: "Mont Sion"
body:
  en:
    - "Mount Zion is the name the Bible gives to the holy hill of Jerusalem, and the name has travelled: in the Psalms and the prophets it means the Temple hill, while since the fourth century it has belonged to the higher western hill south of the present Old City. The article on Zion follows that migration; this one is about the phrase “mount Zion” and the hill that now bears it, which rises above the Hinnom valley on the south and west and the Tyropoeon on the east, higher than the Temple Mount."
    - "For the psalmists mount Zion is the hill God chose: “Beautiful for situation, the joy of the whole earth, is mount Zion, on the sides of the north, the city of the great King”; those who trust in the Lord “shall be as mount Zion, which cannot be removed”. Isaiah promised that “out of Jerusalem shall go forth a remnant, and they that escape out of mount Zion”. Micah warned that Zion would be “plowed as a field”, words the elders quoted a century later to save Jeremiah, and Lamentations saw them fulfilled: “Because of the mountain of Zion, which is desolate, the foxes walk upon it.” Joel and Obadiah looked past the ruin: “in mount Zion and in Jerusalem shall be deliverance”."
    - "In the New Testament the name is lifted off the ground. Hebrews tells its readers, “ye are come unto mount Sion, and unto the city of the living God, the heavenly Jerusalem”, and in Revelation the Lamb stands “on the mount Sion” with the hundred and forty-four thousand. How the name came down to the western hill is told in the article on Zion. On the hill itself the church of Holy Sion was burned by the Persians in 614; the Crusaders rebuilt it as St Mary of Mount Sion; in 1335 the Franciscans acquired the Upper Room, and in the sixteenth century the Ottomans made it a mosque and expelled the friars."
    - "Today Mount Zion lies just outside the Zion Gate of the Old City. On it stand the Cenacle, a Gothic hall of the Crusader period restored by the Franciscans, which tradition holds to be the room of the Last Supper; beneath it the cenotaph venerated since the Middle Ages as the Tomb of David; and the Abbey of the Dormition, built in 1900–1910 on land Kaiser Wilhelm II obtained in 1898, where tradition says Mary died. On the eastern slope St Peter in Gallicantu marks one traditional site of the house of Caiaphas. Excavations by Bliss and Dickie in the 1890s and by Magen Broshi in the 1970s traced the ancient walls that once enclosed the hill."
  ru:
    - "Гора Сион — имя, которым Библия называет святой холм Иерусалима, и имя это странствовало: в Псалтири и у пророков оно означает холм Храма, а с IV века закрепилось за более высоким западным холмом к югу от нынешнего Старого города. Статья о Сионе прослеживает это переселение; здесь речь о словах «гора Сион» и о холме, который теперь так зовётся: он поднимается над долиной Енном с юга и запада и над Тиропеоном с востока и стоит выше Храмовой горы."
    - "Для псалмопевцев гора Сион — холм, избранный Богом: «Прекрасная возвышенность, радость всей земли гора Сион; на северной стороне ее город великого Царя»; надеющийся на Господа «как гора Сион, не подвигнется». Исаия обещал: «из Иерусалима произойдет остаток, и спасенное от горы Сиона». Михей предупреждал, что Сион «распахан будет, как поле», и столетие спустя старейшины приводили эти слова, чтобы спасти Иеремию, а Плач Иеремии увидел их исполненными: «Оттого, что опустела гора Сион, лисицы ходят по ней». Иоиль и Авдий смотрели дальше разорения: «на горе Сионе и в Иерусалиме будет спасение»."
    - "В Новом Завете имя отрывается от земли. Послание к Евреям говорит читателям: «вы приступили к горе Сиону и ко граду Бога живого, и к небесному Иерусалиму», а в Откровении Агнец стоит «на горе Сионе» со ста сорока четырьмя тысячами. Как имя перешло на западный холм, рассказывает статья о Сионе. На самом холме церковь Святого Сиона сожгли персы в 614 году; крестоносцы отстроили её как церковь Святой Марии на горе Сион; в 1335 году францисканцы приобрели Сионскую горницу, а в XVI веке османы обратили её в мечеть и изгнали монахов."
    - "Сегодня гора Сион лежит сразу за Сионскими воротами Старого города. На ней стоят Сионская горница — готический зал времён крестоносцев, восстановленный францисканцами, который предание считает комнатой Тайной вечери; под ним кенотаф, почитаемый со Средних веков как гробница Давида; и аббатство Успения, построенное в 1900–1910 годах на земле, которую кайзер Вильгельм II получил в 1898 году, там, где, по преданию, скончалась Мария. На восточном склоне церковь Святого Петра в Галликанту отмечает одно из преданий о доме Каиафы. Раскопки Блисса и Дики в 1890-х и Магена Броши в 1970-х проследили древние стены, некогда охватывавшие холм."
  uk:
    - "Гора Сіон — назва, яку Біблія дає святому пагорбу Єрусалима, і ця назва мандрувала: у Псалмах і пророків вона означає пагорб Храму, тоді як від IV ст. вона належить вищому західному пагорбу на південь від сучасного Старого міста. Стаття про Сіон простежує цю міграцію; ця ж — про вираз «гора Сіон» і пагорб, що тепер носить його, який здіймається над долиною Гінном на півдні й заході та Тіропеоном на сході, вище за Храмову гору."
    - "Для псалмоспівців гора Сіон — пагорб, який обрав Бог: «Стремить у воздух гора Сион, радість землї цїлої, на самій півночі город царя великого!»; ті, хто вповає на Господа, «подібні горі Сиону, що не хитається». Ісая обіцяв: «з Ерусалиму зійде (мов трава) останок, а те, що врятуєсь — із гори Сиону». Міхей застерігав: «буде Сион, як поле, розʼораний», слова, які старші цитували сторіччя потому, щоб урятувати Єремію, а Плач Єремії побачив їх виконаними: «Ой попустїли вершини Сионські, хиба шакалі ходять по них». Йоїл та Овадія дивилися поза руїну: «тілько на Сионї і в Ерусалимі буде спасеннє»."
    - "У Новому Завіті назва піднімається над землею. Послання до євреїв каже читачам: «А приступили ви до Сионської гори і до города Бога живого, Єрусалима небесного», а в Одкровенні Агнець стоїть «на горі Сіон» зі ста сорока чотирма тисячами. Як назва спустилася на західний пагорб, розповідає стаття про Сіон. На самому пагорбі церкву Святого Сіону спалили перси 614 р.; хрестоносці відбудували її як церкву Святої Марії на горі Сіон; 1335 р. францисканці здобули Горницю, а в XVI ст. османи зробили її мечеттю й вигнали ченців."
    - "Сьогодні гора Сіон лежить просто поза Сіонською брамою Старого міста. На ній стоять Верхня кімната (Cenacle), готична зала доби хрестоносців, відновлена францисканцями, яку традиція вважає за кімнату Таємної вечері; під нею — кенотаф, що його шанують від середньовіччя як Гробницю Давида; і абатство Успіння, збудоване 1900–1910 рр. на землі, яку кайзер Вільгельм II здобув 1898 р., де, за традицією, померла Марія. На східному схилі церква Святого Петра «Півнячий спів» (St Peter in Gallicantu) позначає одне з традиційних місць дому Каяфи. Розкопки Бліса і Дікі в 1890-х рр. і Магена Броші в 1970-х рр. простежили давні мури, що колись оточували пагорб."
  es:
    - "El monte Sion es el nombre que la Biblia da a la colina santa de Jerusalén, y el nombre ha viajado: en los Salmos y los profetas designa la colina del Templo, mientras que desde el siglo IV pertenece a la colina occidental más alta, al sur de la actual Ciudad Vieja. El artículo sobre Sion sigue esa migración; este trata de la expresión «monte Sion» y de la colina que hoy la lleva, que se eleva sobre el valle de Hinnom, al sur y al oeste, y sobre el Tiropeón, al este, más alta que el Monte del Templo."
    - "Para los salmistas el monte Sion es la colina que Dios eligió: «Hermosa provincia, el gozo de toda la tierra es el monte de Sión, á los lados del aquilón, la ciudad del gran Rey»; quienes confían en el Señor «son como el monte de Sión, que no deslizará». Isaías prometió que «de Jerusalem saldrán reliquias, y del monte de Sión salvamento». Miqueas advirtió que Sion sería «arada como campo», palabras que los ancianos citaron un siglo después para salvar a Jeremías, y Lamentaciones las vio cumplidas: «Por el monte de Sión que está asolado; zorras andan en él». Joel y Abdías miraron más allá de la ruina: «en el monte de Sión y en Jerusalem habrá salvación»."
    - "En el Nuevo Testamento el nombre se eleva del suelo. Hebreos dice a sus lectores: «os habéis llegado al monte de Sión, y á la ciudad del Dios vivo, Jerusalem la celestial», y en el Apocalipsis el Cordero está «sobre el monte de Sión» con los ciento cuarenta y cuatro mil. Cómo bajó el nombre a la colina occidental se cuenta en el artículo sobre Sion. En la colina misma, la iglesia de la Santa Sion fue incendiada por los persas en 614; los cruzados la reconstruyeron como Santa María del Monte Sion; en 1335 los franciscanos adquirieron el Cenáculo, y en el siglo XVI los otomanos lo convirtieron en mezquita y expulsaron a los frailes."
    - "Hoy el monte Sion se encuentra justo fuera de la Puerta de Sion de la Ciudad Vieja. En él se alzan el Cenáculo, una sala gótica de época cruzada restaurada por los franciscanos, que la tradición tiene por la sala de la Última Cena; bajo ella el cenotafio venerado desde la Edad Media como Tumba de David; y la Abadía de la Dormición, construida en 1900–1910 en terrenos que el káiser Guillermo II obtuvo en 1898, donde la tradición dice que murió María. En la ladera oriental, San Pedro in Gallicantu señala un lugar tradicional de la casa de Caifás. Las excavaciones de Bliss y Dickie en la década de 1890 y de Magen Broshi en la de 1970 trazaron las antiguas murallas que en otro tiempo rodeaban la colina."
  pt:
    - "O monte Sião é o nome que a Bíblia dá à colina santa de Jerusalém, e o nome viajou: nos Salmos e nos profetas significa a colina do Templo, ao passo que desde o século IV pertence à colina ocidental mais alta, ao sul da atual Cidade Velha. O verbete sobre Sião acompanha essa migração; este trata da expressão “monte Sião” e da colina que hoje a leva, que se ergue acima do vale de Hinom, ao sul e a oeste, e do Tiropeão, a leste, mais alta que o Monte do Templo."
    - "Para os salmistas, o monte Sião é a colina que Deus escolheu: “Belo em sua elevação, a alegria de toda a terra, é o monte Sião, nos lados do norte, a cidade do grande Rei”; os que confiam no Senhor “são como o monte Sião, que não pode ser abalado”. Isaías prometeu que “de Jerusalém sairá um remanescente, e os sobreviventes escaparão do monte Sião”. Miqueias advertiu que Sião seria “arada como um campo”, palavras que os anciãos citaram um século depois para salvar Jeremias, e Lamentações as viu cumpridas: “pelo monte Sião, que está desolado. As raposas andam sobre ele.” Joel e Obadias olharam além da ruína: “no monte Sião e em Jerusalém haverá os que escapem”."
    - "No Novo Testamento o nome é erguido do chão. Hebreus diz aos seus leitores: “vocês chegaram ao monte Sião e à cidade do Deus vivo, a Jerusalém celestial”, e no Apocalipse o Cordeiro está “sobre o monte Sião” com os cento e quarenta e quatro mil. Como o nome desceu à colina ocidental está contado no verbete sobre Sião. Na própria colina, a igreja de Santa Sião foi queimada pelos persas em 614; os cruzados a reconstruíram como Santa Maria do Monte Sião; em 1335 os franciscanos adquiriram o Cenáculo, e no século XVI os otomanos o fizeram mesquita e expulsaram os frades."
    - "Hoje o monte Sião fica logo fora do Portão de Sião da Cidade Velha. Nele estão o Cenáculo, um salão gótico do período cruzado restaurado pelos franciscanos, que a tradição tem pela sala da Última Ceia; sob ele o cenotáfio venerado desde a Idade Média como o Túmulo de Davi; e a Abadia da Dormição, construída em 1900–1910 em terreno que o Kaiser Guilherme II obteve em 1898, onde a tradição diz que Maria morreu. Na encosta oriental, São Pedro em Galicantu marca um sítio tradicional da casa de Caifás. Escavações de Bliss e Dickie nos anos 1890 e de Magen Broshi nos anos 1970 traçaram as antigas muralhas que um dia cercaram a colina."
  de:
    - "Berg Zion ist der Name, den die Bibel dem heiligen Hügel Jerusalems gibt, und der Name ist gewandert: In den Psalmen und bei den Propheten bezeichnet er den Tempelberg, während er seit dem 4. Jahrhundert zum höheren westlichen Hügel südlich der heutigen Altstadt gehört. Der Artikel über Zion folgt dieser Wanderung; dieser behandelt die Wendung „Berg Zion“ und den Hügel, der sie heute trägt und der sich über dem Hinnomtal im Süden und Westen und dem Tyropoiontal im Osten erhebt, höher als der Tempelberg."
    - "Für die Psalmisten ist der Berg Zion der von Gott erwählte Hügel: „Schön ragt empor der Berg Zion, des sich das ganze Land tröstet; an der Seite gegen Mitternacht liegt die Stadt des großen Königs“; die auf den HERRN hoffen, „werden nicht fallen, sondern ewig bleiben wie der Berg Zion“. Jesaja verhieß: „von Jerusalem werden noch ausgehen, die übriggeblieben sind, und die Erretteten von Berge Zion“. Micha warnte, Zion werde „wie ein Acker gepflügt werden“, Worte, die die Ältesten ein Jahrhundert später zitierten, um Jeremia zu retten, und die Klagelieder sahen sie erfüllt: „um des Berges Zion willen, daß er so wüst liegt, daß die Füchse darüber laufen“. Joel und Obadja blickten über die Trümmer hinaus: „auf dem Berge Zion und zu Jerusalem wird eine Errettung sein“."
    - "Im Neuen Testament wird der Name vom Boden gehoben. Der Hebräerbrief sagt seinen Lesern: „Sondern ihr seid gekommen zu dem Berge Zion und zu der Stadt des lebendigen Gottes, dem himmlischen Jerusalem“, und in der Offenbarung steht das Lamm „auf dem Berg Zion und mit ihm hundertvierundvierzigtausend“. Wie der Name auf den westlichen Hügel kam, erzählt der Artikel über Zion. Auf dem Hügel selbst wurde die Kirche Heilig Zion 614 von den Persern verbrannt; die Kreuzfahrer bauten sie als St. Maria vom Berg Zion wieder auf; 1335 erwarben die Franziskaner den Abendmahlssaal, und im 16. Jahrhundert machten die Osmanen ihn zur Moschee und vertrieben die Mönche."
    - "Heute liegt der Berg Zion unmittelbar vor dem Zionstor der Altstadt. Auf ihm stehen der Abendmahlssaal, eine gotische Halle der Kreuzfahrerzeit, von den Franziskanern restauriert, die der Überlieferung nach der Raum des letzten Abendmahls ist; darunter der seit dem Mittelalter verehrte Kenotaph als Grab Davids; und die Dormitio-Abtei, 1900–1910 auf einem Grundstück erbaut, das Kaiser Wilhelm II. 1898 erwarb, wo nach der Überlieferung Maria starb. Am Osthang bezeichnet St. Peter in Gallicantu eine der überlieferten Stätten des Hauses des Kaiphas. Ausgrabungen von Bliss und Dickie in den 1890er Jahren und von Magen Broshi in den 1970er Jahren verfolgten die antiken Mauern, die den Hügel einst umschlossen."
  fr:
    - "Le mont Sion est le nom que la Bible donne à la sainte colline de Jérusalem, et le nom a voyagé : dans les Psaumes et les prophètes, il désigne la colline du Temple, tandis que depuis le IVe siècle il appartient à la colline occidentale plus haute, au sud de l’actuelle Vieille Ville. L’article sur Sion suit cette migration ; celui-ci porte sur l’expression « mont Sion » et sur la colline qui la porte aujourd’hui, qui s’élève au-dessus de la vallée de Hinnom au sud et à l’ouest et du Tyropéon à l’est, plus haute que le mont du Temple."
    - "Pour les psalmistes, le mont Sion est la colline que Dieu a choisie : « Belle est la colline, joie de toute la terre, la montagne de Sion ; le côté septentrional, c’est la ville du grand roi » ; ceux qui se confient en l’Éternel « sont comme la montagne de Sion : elle ne chancelle point ». Ésaïe promit que « de Jérusalem il sortira un reste, et de la montagne de Sion des réchappés ». Michée avertit que Sion serait « labourée comme un champ », paroles que les anciens citèrent un siècle plus tard pour sauver Jérémie, et les Lamentations les virent accomplies : « C’est que la montagne de Sion est ravagée, c’est que les renards s’y promènent. » Joël et Abdias regardèrent au-delà de la ruine : « Le salut sera sur la montagne de Sion et à Jérusalem »."
    - "Dans le Nouveau Testament, le nom est détaché du sol. L’épître aux Hébreux dit à ses lecteurs : « vous vous êtes approchés de la montagne de Sion, de la cité du Dieu vivant, la Jérusalem céleste », et dans l’Apocalypse l’Agneau se tient « sur la montagne de Sion » avec les cent quarante-quatre mille. Comment le nom descendit à la colline occidentale est raconté dans l’article sur Sion. Sur la colline même, l’église de Sainte-Sion fut brûlée par les Perses en 614 ; les croisés la rebâtirent sous le nom de Sainte-Marie du Mont Sion ; en 1335 les franciscains acquirent la Chambre haute, et au XVIe siècle les Ottomans en firent une mosquée et expulsèrent les frères."
    - "Aujourd’hui, le mont Sion se trouve juste à l’extérieur de la porte de Sion de la Vieille Ville. On y trouve le Cénacle, salle gothique de l’époque des croisés restaurée par les franciscains, que la tradition tient pour la salle de la Cène ; au-dessous, le cénotaphe vénéré depuis le Moyen Âge comme le tombeau de David ; et l’abbaye de la Dormition, bâtie en 1900–1910 sur un terrain obtenu par l’empereur Guillaume II en 1898, où la tradition dit que Marie mourut. Sur la pente orientale, Saint-Pierre-en-Gallicante marque un site traditionnel de la maison de Caïphe. Les fouilles de Bliss et Dickie dans les années 1890 et de Magen Broshi dans les années 1970 ont retracé les anciens murs qui ceignaient la colline."
