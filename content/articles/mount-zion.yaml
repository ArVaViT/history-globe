# Overview article (ADR 0007). Mainstream facts only; the hill is the present-day Mount Zion (the western hill), and the article leaves the history of the name to the Zion article.
id: mount-zion
place: abd9596
title:
  en: "Mount Zion"
  ru: "Гора Сион"
body:
  en:
    - "Mount Zion is the name the Bible gives to the holy hill of Jerusalem, and the name has travelled: in the Psalms and the prophets it means the Temple hill, while since the fourth century it has belonged to the higher western hill south of the present Old City. The article on Zion follows that migration; this one is about the phrase “mount Zion” and the hill that now bears it, which rises above the Hinnom valley on the south and west and the Tyropoeon on the east, higher than the Temple Mount."
    - "For the psalmists mount Zion is the hill God chose: “Beautiful for situation, the joy of the whole earth, is mount Zion, on the sides of the north, the city of the great King”; those who trust in the Lord “shall be as mount Zion, which cannot be removed”. Isaiah promised that “out of Jerusalem shall go forth a remnant, and they that escape out of mount Zion”. Micah warned that Zion would be “plowed as a field”, words the elders quoted a century later to save Jeremiah, and Lamentations saw them fulfilled: “Because of the mountain of Zion, which is desolate, the foxes walk upon it.” Joel and Obadiah looked past the ruin: “in mount Zion and in Jerusalem shall be deliverance”."
    - "In the New Testament the name is lifted off the ground. Hebrews tells its readers, “ye are come unto mount Sion, and unto the city of the living God, the heavenly Jerusalem”, and in Revelation the Lamb stands “on the mount Sion” with the hundred and forty-four thousand. How the name came down to the western hill is told in the article on Zion. On the hill itself the church of Holy Sion was burned by the Persians in 614; the Crusaders rebuilt it as St Mary of Mount Sion; in 1335 the Franciscans acquired the Upper Room, and in the sixteenth century the Ottomans made it a mosque and expelled the friars."
    - "Today Mount Zion lies just outside the Zion Gate of the Old City. On it stand the Cenacle, a Gothic hall of the Crusader period restored by the Franciscans, which tradition holds to be the room of the Last Supper; beneath it the cenotaph venerated since the Middle Ages as the Tomb of David; and the Abbey of the Dormition, built in 1900–1910 on land Kaiser Wilhelm II obtained in 1898, where tradition says Mary died. On the eastern slope St Peter in Gallicantu marks one traditional site of the house of Caiaphas. Excavations by Bliss and Dickie in the 1890s and by Magen Broshi in the 1970s traced the ancient walls that once enclosed the hill."
  ru:
    - "Гора Сион — имя, которым Библия называет святой холм Иерусалима, и имя это странствовало: в Псалтири и у пророков оно означает холм Храма, а с IV века закрепилось за более высоким западным холмом к югу от нынешнего Старого города. Статья о Сионе прослеживает это переселение; здесь речь о словах «гора Сион» и о холме, который теперь так зовётся: он поднимается над долиной Енном с юга и запада и над Тиропеоном с востока и стоит выше Храмовой горы."
    - "Для псалмопевцев гора Сион — холм, избранный Богом: «Прекрасная возвышенность, радость всей земли гора Сион; на северной стороне ее город великого Царя»; надеющийся на Господа «как гора Сион, не подвигнется». Исаия обещал: «из Иерусалима произойдет остаток, и спасенное от горы Сиона». Михей предупреждал, что Сион «распахан будет, как поле», и столетие спустя старейшины приводили эти слова, чтобы спасти Иеремию, а Плач Иеремии увидел их исполненными: «Оттого, что опустела гора Сион, лисицы ходят по ней». Иоиль и Авдий смотрели дальше разорения: «на горе Сионе и в Иерусалиме будет спасение»."
    - "В Новом Завете имя отрывается от земли. Послание к Евреям говорит читателям: «вы приступили к горе Сиону и ко граду Бога живого, и к небесному Иерусалиму», а в Откровении Агнец стоит «на горе Сионе» со ста сорока четырьмя тысячами. Как имя перешло на западный холм, рассказывает статья о Сионе. На самом холме церковь Святого Сиона сожгли персы в 614 году; крестоносцы отстроили её как церковь Святой Марии на горе Сион; в 1335 году францисканцы приобрели Сионскую горницу, а в XVI веке османы обратили её в мечеть и изгнали монахов."
    - "Сегодня гора Сион лежит сразу за Сионскими воротами Старого города. На ней стоят Сионская горница — готический зал времён крестоносцев, восстановленный францисканцами, который предание считает комнатой Тайной вечери; под ним кенотаф, почитаемый со Средних веков как гробница Давида; и аббатство Успения, построенное в 1900–1910 годах на земле, которую кайзер Вильгельм II получил в 1898 году, там, где, по преданию, скончалась Мария. На восточном склоне церковь Святого Петра в Галликанту отмечает одно из преданий о доме Каиафы. Раскопки Блисса и Дики в 1890-х и Магена Броши в 1970-х проследили древние стены, некогда охватывавшие холм."
