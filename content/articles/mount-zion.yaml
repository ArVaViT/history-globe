# Overview article (ADR 0007). Mainstream facts only; the hill is the present-day Mount Zion (the western hill), and the article leaves the history of the name to the Zion article.
id: mount-zion
place: abd9596
title:
  en: "Mount Zion"
  ru: "Гора Сион"
  uk: "Гора Сіон"
  es: "Monte Sion"
  pt: "Monte Sião"
  de: "Berg Zion"
  fr: "Mont Sion"
  it: "Monte Sion"
  pl: "Góra Syjon"
  nl: "Berg Sion"
  cs: "Hora Sijón"
  sv: "Sions berg"
  nb: "Sionfjellet"
body:
  en:
    - "Mount Zion is the name the Bible gives to the holy hill of Jerusalem, and the name has travelled: in the Psalms and the prophets it means the Temple hill, while since the fourth century it has belonged to the higher western hill south of the present Old City. The article on Zion follows that migration; this one is about the phrase “mount Zion” and the hill that now bears it, which rises above the Hinnom valley on the south and west and the Tyropoeon on the east, higher than the Temple Mount."
    - "For the psalmists mount Zion is the hill God chose: “Beautiful for situation, the joy of the whole earth, is mount Zion, on the sides of the north, the city of the great King”; those who trust in the Lord “shall be as mount Zion, which cannot be removed”. Isaiah promised that “out of Jerusalem shall go forth a remnant, and they that escape out of mount Zion”. Micah warned that Zion would be “plowed as a field”, words the elders quoted a century later to save Jeremiah, and Lamentations saw them fulfilled: “Because of the mountain of Zion, which is desolate, the foxes walk upon it.” Joel and Obadiah looked past the ruin: “in mount Zion and in Jerusalem shall be deliverance”."
    - "In the New Testament the name is lifted off the ground. Hebrews tells its readers, “ye are come unto mount Sion, and unto the city of the living God, the heavenly Jerusalem”, and in Revelation the Lamb stands “on the mount Sion” with the hundred and forty-four thousand. How the name came down to the western hill is told in the article on Zion. On the hill itself the church of Holy Sion was burned by the Persians in 614; the Crusaders rebuilt it as St Mary of Mount Sion; in 1333 the Franciscans acquired the Upper Room, and in the sixteenth century the Ottomans made it a mosque and expelled the friars."
    - "Today Mount Zion lies just outside the Zion Gate of the Old City. On it stand the Cenacle, a Gothic hall of the Crusader period restored by the Franciscans, which tradition holds to be the room of the Last Supper; beneath it the cenotaph venerated since the Middle Ages as the Tomb of David; and the Abbey of the Dormition, built in 1900–1910 on land Kaiser Wilhelm II obtained in 1898, where tradition says Mary died. On the eastern slope St Peter in Gallicantu marks one traditional site of the house of Caiaphas. Excavations by Bliss and Dickie in the 1890s and by Magen Broshi in the 1970s traced the ancient walls that once enclosed the hill."
  ru:
    - "Гора Сион — имя, которым Библия называет святой холм Иерусалима, и имя это странствовало: в Псалтири и у пророков оно означает холм Храма, а с IV века закрепилось за более высоким западным холмом к югу от нынешнего Старого города. Статья о Сионе прослеживает это переселение; здесь речь о словах «гора Сион» и о холме, который теперь так зовётся: он поднимается над долиной Енном с юга и запада и над Тиропеоном с востока и стоит выше Храмовой горы."
    - "Для псалмопевцев гора Сион — холм, избранный Богом: «Прекрасная возвышенность, радость всей земли гора Сион; на северной стороне ее город великого Царя»; надеющийся на Господа «как гора Сион, не подвигнется». Исаия обещал: «из Иерусалима произойдет остаток, и спасенное от горы Сиона». Михей предупреждал, что Сион «распахан будет, как поле», и столетие спустя старейшины приводили эти слова, чтобы спасти Иеремию, а Плач Иеремии увидел их исполненными: «Оттого, что опустела гора Сион, лисицы ходят по ней». Иоиль и Авдий смотрели дальше разорения: «на горе Сионе и в Иерусалиме будет спасение»."
    - "В Новом Завете имя отрывается от земли. Послание к Евреям говорит читателям: «вы приступили к горе Сиону и ко граду Бога живого, и к небесному Иерусалиму», а в Откровении Агнец стоит «на горе Сионе» со ста сорока четырьмя тысячами. Как имя перешло на западный холм, рассказывает статья о Сионе. На самом холме церковь Святого Сиона сожгли персы в 614 году; крестоносцы отстроили её как церковь Святой Марии на горе Сион; в 1333 году францисканцы приобрели Сионскую горницу, а в XVI веке османы обратили её в мечеть и изгнали монахов."
    - "Сегодня гора Сион лежит сразу за Сионскими воротами Старого города. На ней стоят Сионская горница — готический зал времён крестоносцев, восстановленный францисканцами, который предание считает комнатой Тайной вечери; под ним кенотаф, почитаемый со Средних веков как гробница Давида; и аббатство Успения, построенное в 1900–1910 годах на земле, которую кайзер Вильгельм II получил в 1898 году, там, где, по преданию, скончалась Мария. На восточном склоне церковь Святого Петра в Галликанту отмечает одно из преданий о доме Каиафы. Раскопки Блисса и Дики в 1890-х и Магена Броши в 1970-х проследили древние стены, некогда охватывавшие холм."
  uk:
    - "Гора Сіон — назва, яку Біблія дає святому пагорбу Єрусалима, і ця назва мандрувала: у Псалмах і пророків вона означає пагорб Храму, тоді як від IV ст. вона належить вищому західному пагорбу на південь від сучасного Старого міста. Стаття про Сіон простежує цю міграцію; ця ж — про вираз «гора Сіон» і пагорб, що тепер носить його, який здіймається над долиною Гінном на півдні й заході та Тіропеоном на сході, вище за Храмову гору."
    - "Для псалмоспівців гора Сіон — пагорб, який обрав Бог: «Стремить у воздух гора Сион, радість землї цїлої, на самій півночі город царя великого!»; ті, хто вповає на Господа, «подібні горі Сиону, що не хитається». Ісая обіцяв: «з Ерусалиму зійде (мов трава) останок, а те, що врятуєсь — із гори Сиону». Міхей застерігав: «буде Сион, як поле, розʼораний», слова, які старші цитували сторіччя потому, щоб урятувати Єремію, а Плач Єремії побачив їх виконаними: «Ой попустїли вершини Сионські, хиба шакалі ходять по них». Йоїл та Овадія дивилися поза руїну: «тілько на Сионї і в Ерусалимі буде спасеннє»."
    - "У Новому Завіті назва піднімається над землею. Послання до євреїв каже читачам: «А приступили ви до Сионської гори і до города Бога живого, Єрусалима небесного», а в Одкровенні Агнець стоїть «на горі Сіон» зі ста сорока чотирма тисячами. Як назва спустилася на західний пагорб, розповідає стаття про Сіон. На самому пагорбі церкву Святого Сіону спалили перси 614 р.; хрестоносці відбудували її як церкву Святої Марії на горі Сіон; 1333 р. францисканці здобули Горницю, а в XVI ст. османи зробили її мечеттю й вигнали ченців."
    - "Сьогодні гора Сіон лежить просто поза Сіонською брамою Старого міста. На ній стоять Верхня кімната (Cenacle), готична зала доби хрестоносців, відновлена францисканцями, яку традиція вважає за кімнату Таємної вечері; під нею — кенотаф, що його шанують від середньовіччя як Гробницю Давида; і абатство Успіння, збудоване 1900–1910 рр. на землі, яку кайзер Вільгельм II здобув 1898 р., де, за традицією, померла Марія. На східному схилі церква Святого Петра «Півнячий спів» (St Peter in Gallicantu) позначає одне з традиційних місць дому Каяфи. Розкопки Бліса і Дікі в 1890-х рр. і Магена Броші в 1970-х рр. простежили давні мури, що колись оточували пагорб."
  es:
    - "El monte Sion es el nombre que la Biblia da a la colina santa de Jerusalén, y el nombre ha viajado: en los Salmos y los profetas designa la colina del Templo, mientras que desde el siglo IV pertenece a la colina occidental más alta, al sur de la actual Ciudad Vieja. El artículo sobre Sion sigue esa migración; este trata de la expresión «monte Sion» y de la colina que hoy la lleva, que se eleva sobre el valle de Hinnom, al sur y al oeste, y sobre el Tiropeón, al este, más alta que el Monte del Templo."
    - "Para los salmistas el monte Sion es la colina que Dios eligió: «Hermosa provincia, el gozo de toda la tierra es el monte de Sión, á los lados del aquilón, la ciudad del gran Rey»; quienes confían en el Señor «son como el monte de Sión, que no deslizará». Isaías prometió que «de Jerusalem saldrán reliquias, y del monte de Sión salvamento». Miqueas advirtió que Sion sería «arada como campo», palabras que los ancianos citaron un siglo después para salvar a Jeremías, y Lamentaciones las vio cumplidas: «Por el monte de Sión que está asolado; zorras andan en él». Joel y Abdías miraron más allá de la ruina: «en el monte de Sión y en Jerusalem habrá salvación»."
    - "En el Nuevo Testamento el nombre se eleva del suelo. Hebreos dice a sus lectores: «os habéis llegado al monte de Sión, y á la ciudad del Dios vivo, Jerusalem la celestial», y en el Apocalipsis el Cordero está «sobre el monte de Sión» con los ciento cuarenta y cuatro mil. Cómo bajó el nombre a la colina occidental se cuenta en el artículo sobre Sion. En la colina misma, la iglesia de la Santa Sion fue incendiada por los persas en 614; los cruzados la reconstruyeron como Santa María del Monte Sion; en 1333 los franciscanos adquirieron el Cenáculo, y en el siglo XVI los otomanos lo convirtieron en mezquita y expulsaron a los frailes."
    - "Hoy el monte Sion se encuentra justo fuera de la Puerta de Sion de la Ciudad Vieja. En él se alzan el Cenáculo, una sala gótica de época cruzada restaurada por los franciscanos, que la tradición tiene por la sala de la Última Cena; bajo ella el cenotafio venerado desde la Edad Media como Tumba de David; y la Abadía de la Dormición, construida en 1900–1910 en terrenos que el káiser Guillermo II obtuvo en 1898, donde la tradición dice que murió María. En la ladera oriental, San Pedro in Gallicantu señala un lugar tradicional de la casa de Caifás. Las excavaciones de Bliss y Dickie en la década de 1890 y de Magen Broshi en la de 1970 trazaron las antiguas murallas que en otro tiempo rodeaban la colina."
  pt:
    - "O monte Sião é o nome que a Bíblia dá à colina santa de Jerusalém, e o nome viajou: nos Salmos e nos profetas significa a colina do Templo, ao passo que desde o século IV pertence à colina ocidental mais alta, ao sul da atual Cidade Velha. O verbete sobre Sião acompanha essa migração; este trata da expressão “monte Sião” e da colina que hoje a leva, que se ergue acima do vale de Hinom, ao sul e a oeste, e do Tiropeão, a leste, mais alta que o Monte do Templo."
    - "Para os salmistas, o monte Sião é a colina que Deus escolheu: “Belo em sua elevação, a alegria de toda a terra, é o monte Sião, nos lados do norte, a cidade do grande Rei”; os que confiam no Senhor “são como o monte Sião, que não pode ser abalado”. Isaías prometeu que “de Jerusalém sairá um remanescente, e os sobreviventes escaparão do monte Sião”. Miqueias advertiu que Sião seria “arada como um campo”, palavras que os anciãos citaram um século depois para salvar Jeremias, e Lamentações as viu cumpridas: “pelo monte Sião, que está desolado. As raposas andam sobre ele.” Joel e Obadias olharam além da ruína: “no monte Sião e em Jerusalém haverá os que escapem”."
    - "No Novo Testamento o nome é erguido do chão. Hebreus diz aos seus leitores: “vocês chegaram ao monte Sião e à cidade do Deus vivo, a Jerusalém celestial”, e no Apocalipse o Cordeiro está “sobre o monte Sião” com os cento e quarenta e quatro mil. Como o nome desceu à colina ocidental está contado no verbete sobre Sião. Na própria colina, a igreja de Santa Sião foi queimada pelos persas em 614; os cruzados a reconstruíram como Santa Maria do Monte Sião; em 1333 os franciscanos adquiriram o Cenáculo, e no século XVI os otomanos o fizeram mesquita e expulsaram os frades."
    - "Hoje o monte Sião fica logo fora do Portão de Sião da Cidade Velha. Nele estão o Cenáculo, um salão gótico do período cruzado restaurado pelos franciscanos, que a tradição tem pela sala da Última Ceia; sob ele o cenotáfio venerado desde a Idade Média como o Túmulo de Davi; e a Abadia da Dormição, construída em 1900–1910 em terreno que o Kaiser Guilherme II obteve em 1898, onde a tradição diz que Maria morreu. Na encosta oriental, São Pedro em Galicantu marca um sítio tradicional da casa de Caifás. Escavações de Bliss e Dickie nos anos 1890 e de Magen Broshi nos anos 1970 traçaram as antigas muralhas que um dia cercaram a colina."
  de:
    - "Berg Zion ist der Name, den die Bibel dem heiligen Hügel Jerusalems gibt, und der Name ist gewandert: In den Psalmen und bei den Propheten bezeichnet er den Tempelberg, während er seit dem 4. Jahrhundert zum höheren westlichen Hügel südlich der heutigen Altstadt gehört. Der Artikel über Zion folgt dieser Wanderung; dieser behandelt die Wendung „Berg Zion“ und den Hügel, der sie heute trägt und der sich über dem Hinnomtal im Süden und Westen und dem Tyropoiontal im Osten erhebt, höher als der Tempelberg."
    - "Für die Psalmisten ist der Berg Zion der von Gott erwählte Hügel: „Schön ragt empor der Berg Zion, des sich das ganze Land tröstet; an der Seite gegen Mitternacht liegt die Stadt des großen Königs“; die auf den HERRN hoffen, „werden nicht fallen, sondern ewig bleiben wie der Berg Zion“. Jesaja verhieß: „von Jerusalem werden noch ausgehen, die übriggeblieben sind, und die Erretteten von Berge Zion“. Micha warnte, Zion werde „wie ein Acker gepflügt werden“, Worte, die die Ältesten ein Jahrhundert später zitierten, um Jeremia zu retten, und die Klagelieder sahen sie erfüllt: „um des Berges Zion willen, daß er so wüst liegt, daß die Füchse darüber laufen“. Joel und Obadja blickten über die Trümmer hinaus: „auf dem Berge Zion und zu Jerusalem wird eine Errettung sein“."
    - "Im Neuen Testament wird der Name vom Boden gehoben. Der Hebräerbrief sagt seinen Lesern: „Sondern ihr seid gekommen zu dem Berge Zion und zu der Stadt des lebendigen Gottes, dem himmlischen Jerusalem“, und in der Offenbarung steht das Lamm „auf dem Berg Zion und mit ihm hundertvierundvierzigtausend“. Wie der Name auf den westlichen Hügel kam, erzählt der Artikel über Zion. Auf dem Hügel selbst wurde die Kirche Heilig Zion 614 von den Persern verbrannt; die Kreuzfahrer bauten sie als St. Maria vom Berg Zion wieder auf; 1333 erwarben die Franziskaner den Abendmahlssaal, und im 16. Jahrhundert machten die Osmanen ihn zur Moschee und vertrieben die Mönche."
    - "Heute liegt der Berg Zion unmittelbar vor dem Zionstor der Altstadt. Auf ihm stehen der Abendmahlssaal, eine gotische Halle der Kreuzfahrerzeit, von den Franziskanern restauriert, die der Überlieferung nach der Raum des letzten Abendmahls ist; darunter der seit dem Mittelalter verehrte Kenotaph als Grab Davids; und die Dormitio-Abtei, 1900–1910 auf einem Grundstück erbaut, das Kaiser Wilhelm II. 1898 erwarb, wo nach der Überlieferung Maria starb. Am Osthang bezeichnet St. Peter in Gallicantu eine der überlieferten Stätten des Hauses des Kaiphas. Ausgrabungen von Bliss und Dickie in den 1890er Jahren und von Magen Broshi in den 1970er Jahren verfolgten die antiken Mauern, die den Hügel einst umschlossen."
  fr:
    - "Le mont Sion est le nom que la Bible donne à la sainte colline de Jérusalem, et le nom a voyagé : dans les Psaumes et les prophètes, il désigne la colline du Temple, tandis que depuis le IVe siècle il appartient à la colline occidentale plus haute, au sud de l’actuelle Vieille Ville. L’article sur Sion suit cette migration ; celui-ci porte sur l’expression « mont Sion » et sur la colline qui la porte aujourd’hui, qui s’élève au-dessus de la vallée de Hinnom au sud et à l’ouest et du Tyropéon à l’est, plus haute que le mont du Temple."
    - "Pour les psalmistes, le mont Sion est la colline que Dieu a choisie : « Belle est la colline, joie de toute la terre, la montagne de Sion ; le côté septentrional, c’est la ville du grand roi » ; ceux qui se confient en l’Éternel « sont comme la montagne de Sion : elle ne chancelle point ». Ésaïe promit que « de Jérusalem il sortira un reste, et de la montagne de Sion des réchappés ». Michée avertit que Sion serait « labourée comme un champ », paroles que les anciens citèrent un siècle plus tard pour sauver Jérémie, et les Lamentations les virent accomplies : « C’est que la montagne de Sion est ravagée, c’est que les renards s’y promènent. » Joël et Abdias regardèrent au-delà de la ruine : « Le salut sera sur la montagne de Sion et à Jérusalem »."
    - "Dans le Nouveau Testament, le nom est détaché du sol. L’épître aux Hébreux dit à ses lecteurs : « vous vous êtes approchés de la montagne de Sion, de la cité du Dieu vivant, la Jérusalem céleste », et dans l’Apocalypse l’Agneau se tient « sur la montagne de Sion » avec les cent quarante-quatre mille. Comment le nom descendit à la colline occidentale est raconté dans l’article sur Sion. Sur la colline même, l’église de Sainte-Sion fut brûlée par les Perses en 614 ; les croisés la rebâtirent sous le nom de Sainte-Marie du Mont Sion ; en 1333 les franciscains acquirent la Chambre haute, et au XVIe siècle les Ottomans en firent une mosquée et expulsèrent les frères."
    - "Aujourd’hui, le mont Sion se trouve juste à l’extérieur de la porte de Sion de la Vieille Ville. On y trouve le Cénacle, salle gothique de l’époque des croisés restaurée par les franciscains, que la tradition tient pour la salle de la Cène ; au-dessous, le cénotaphe vénéré depuis le Moyen Âge comme le tombeau de David ; et l’abbaye de la Dormition, bâtie en 1900–1910 sur un terrain obtenu par l’empereur Guillaume II en 1898, où la tradition dit que Marie mourut. Sur la pente orientale, Saint-Pierre-en-Gallicante marque un site traditionnel de la maison de Caïphe. Les fouilles de Bliss et Dickie dans les années 1890 et de Magen Broshi dans les années 1970 ont retracé les anciens murs qui ceignaient la colline."
  it:
    - "Il Monte Sion è il nome che la Bibbia dà alla santa collina di Gerusalemme, e il nome ha viaggiato: nei Salmi e nei profeti indica il colle del Tempio, mentre dal IV secolo appartiene alla collina occidentale più alta a sud dell’attuale Città Vecchia. La scheda su Sion segue questa migrazione; questa riguarda l’espressione «monte Sion» e la collina che oggi la porta, che si leva sopra la valle di Innom a sud e a ovest e sopra il Tiropeo a est, più alta del Monte del Tempio."
    - "Per i salmisti il monte Sion è la collina scelta da Dio: «Bello si erge, gioia di tutta la terra, il monte di Sion, dalle parti del settentrione, bella è la città del gran re»; quelli che confidano nel Signore «sono come il monte di Sion, che non può essere smosso». Isaia promise che «da Gerusalemme uscirà un residuo, e dal monte di Sion usciranno degli scampati». Michea avvertì che «Sion sarà arata come un campo», parole che gli anziani citarono un secolo dopo per salvare Geremia, e le Lamentazioni le videro compiute: «perché il monte di Sion è desolato, e vi passeggian le volpi». Gioele e Abdia guardarono oltre la rovina: «sul monte Sion ed in Gerusalemme vi sarà salvezza»."
    - "Nel Nuovo Testamento il nome è sollevato da terra. Gli Ebrei dicono ai lettori: «voi siete venuti al monte di Sion, e alla città dell’Iddio vivente, che è la Gerusalemme celeste», e nell’Apocalisse l’Agnello sta «sul monte Sion» con i centoquarantaquattromila. Come il nome sia sceso alla collina occidentale è raccontato nella scheda su Sion. Sulla collina stessa la chiesa di Santa Sion fu bruciata dai Persiani nel 614; i Crociati la ricostruirono come Santa Maria del Monte Sion; nel 1333 i Francescani acquistarono il Cenacolo, e nel Cinquecento gli Ottomani ne fecero una moschea e scacciarono i frati."
    - "Oggi il Monte Sion si trova subito fuori dalla Porta di Sion della Città Vecchia. Vi sorgono il Cenacolo, una sala gotica del periodo crociato restaurata dai Francescani, che la tradizione ritiene la stanza dell’Ultima Cena; sotto di esso il cenotafio venerato dal Medioevo come Tomba di Davide; e l’Abbazia della Dormizione, costruita nel 1900–1910 su terreno che il Kaiser Guglielmo II ottenne nel 1898, dove la tradizione dice che morì Maria. Sul pendio orientale San Pietro in Gallicantu segna un sito tradizionale della casa di Caifa. Gli scavi di Bliss e Dickie negli anni 1890 e di Magen Broshi negli anni 1970 hanno tracciato le antiche mura che un tempo cingevano la collina."
  pl:
    - "Góra Syjon to nazwa, jaką Biblia nadaje świętemu wzgórzu Jerozolimy, a nazwa wędrowała: w Psalmach i u proroków oznacza wzgórze Świątyni, podczas gdy od IV w. należy do wyższego zachodniego wzgórza na południe od dzisiejszego Starego Miasta. Artykuł o Syjonie śledzi tę wędrówkę; ten dotyczy wyrażenia „góra Syjon” i wzgórza, które dziś ją nosi, wznoszącego się nad doliną Hinnom na południu i zachodzie i Tyropoeonem na wschodzie, wyższego niż Góra Świątynna."
    - "Dla psalmistów góra Syjon jest wzgórzem, które wybrał Bóg: „Ozdobą krainy, uciechą wszystkiej ziemi jest góra Syon w stronach północnych, miasto króla wielkiego”; ci, którzy ufają Panu, „są jako góra Syon, która się nie poruszy, ale na wieki zostaje”. Izajasz obiecał, że „z Jeruzalemu wyjdą ostatki, i zachowani z góry Syońskiej”. Mika ostrzegał, że Syjon będzie „jako pole poorany”, słowa, które starsi zacytowali wiek później, by ocalić Jeremiasza, a Lamentacje widziały je spełnione: „Dla góry Syońskiej, że jest spustoszona, liszki chodzą po niej.” Joel i Abdiasz patrzyli poza ruinę: „na górze Syon i w Jeruzalemie będzie wybawienie”."
    - "W Nowym Testamencie nazwa zostaje oderwana od ziemi. List do Hebrajczyków mówi czytelnikom: „Aleście przystąpili do góry Syon i do miasta Boga żywego, do Jeruzalemu niebieskiego”, a w Apokalipsie Baranek stoi „na górze Syońskiej” ze stu czterdziestoma czterema tysiącami. Jak nazwa zeszła na zachodnie wzgórze, opowiada artykuł o Syjonie. Na samym wzgórzu kościół Świętego Syjonu został spalony przez Persów w 614 r.; krzyżowcy odbudowali go jako Świętą Marię z Góry Syjon; w 1333 r. franciszkanie nabyli Wieczernik, a w XVI w. Osmanowie zamienili go w meczet i wypędzili braci."
    - "Dziś Góra Syjon leży tuż za Bramą Syjońską Starego Miasta. Stoją na niej Wieczernik, gotycka sala z okresu krzyżowców odnowiona przez franciszkanów, którą tradycja uważa za salę Ostatniej Wieczerzy; pod nim kenotaf czczony od średniowiecza jako Grób Dawida; oraz Opactwo Zaśnięcia, zbudowane w latach 1900–1910 na ziemi, którą cesarz Wilhelm II uzyskał w 1898 r., gdzie według tradycji umarła Maria. Na wschodnim zboczu św. Piotr in Gallicantu wyznacza jedno z tradycyjnych miejsc domu Kajfasza. Wykopaliska Blissa i Dickiego w latach dziewięćdziesiątych XIX w. oraz Magena Broshiego w latach siedemdziesiątych XX w. odsłoniły starożytne mury, które niegdyś otaczały wzgórze."
  nl:
    - "De berg Sion is de naam die de Bijbel geeft aan de heilige heuvel van Jeruzalem, en de naam heeft gereisd: in de Psalmen en de profeten betekent hij de tempelheuvel, terwijl hij sinds de vierde eeuw toebehoort aan de hogere westelijke heuvel ten zuiden van de huidige Oude Stad. Het lemma over Sion volgt die verhuizing; dit gaat over de uitdrukking “berg Sion” en de heuvel die haar nu draagt, die boven het Hinnomdal in het zuiden en westen en de Tyropoeon in het oosten oprijst, hoger dan de Tempelberg."
    - "Voor de psalmisten is de berg Sion de heuvel die God koos: “Schoon van gelegenheid, een vreugde der ganse aarde is de berg Sion, aan de zijden van het noorden; de stad des groten Konings”; wie op de HEER vertrouwen, “zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid”. Jesaja beloofde dat “van Jeruzalem zal het overblijfsel uitgaan, en het ontkomene van den berg Sion”. Micha waarschuwde dat Sion “als een akker geploegd” zou worden, woorden die de oudsten een eeuw later aanhaalden om Jeremia te redden, en Klaagliederen zag ze vervuld: “Om des bergs Sions wil, die verwoest is, waar de vossen op lopen.” Joël en Obadja keken voorbij de ruïne: “op den berg Sions en te Jeruzalem zal ontkoming zijn”."
    - "In het Nieuwe Testament wordt de naam van de grond opgetild. Hebreeën zegt zijn lezers: “Maar gij zijt gekomen tot den berg Sion, en de stad des levenden Gods, tot het hemelse Jeruzalem”, en in Openbaring staat het Lam “op den berg Sion” met de honderdvierenveertigduizend. Hoe de naam naar de westelijke heuvel kwam, wordt verteld in het lemma over Sion. Op de heuvel zelf werd de kerk van Heilig Sion in 614 door de Perzen verbrand; de kruisvaarders herbouwden haar als Sint-Maria van de berg Sion; in 1333 verwierven de franciscanen de Opperzaal, en in de zestiende eeuw maakten de Ottomanen er een moskee van en verdreven de broeders."
    - "Tegenwoordig ligt de berg Sion net buiten de Sionspoort van de Oude Stad. Erop staan het Cenakel, een gotische zaal uit de kruisvaarderstijd, hersteld door de franciscanen, die volgens de overlevering de zaal van het Laatste Avondmaal is; daaronder het cenotaaf dat sinds de middeleeuwen als het Graf van David wordt vereerd; en de Dormitio-abdij, gebouwd in 1900–1910 op grond die keizer Wilhelm II in 1898 verkreeg, waar volgens de overlevering Maria stierf. Op de oosthelling markeert Sint-Petrus in Gallicantu een traditionele plaats van het huis van Kajafas. Opgravingen van Bliss en Dickie in de jaren 1890 en van Magen Broshi in de jaren 1970 brachten de oude muren in kaart die de heuvel eens omsloten."
  cs:
    - "Hora Sijón je jméno, které Bible dává svatému pahorku Jeruzaléma, a jméno putovalo: v Žalmech a u proroků znamená chrámový pahorek, kdežto od 4. století patří vyššímu západnímu pahorku jižně od dnešního Starého Města. Článek o Sijónu sleduje toto putování; tento je o rčení „hora Sijón“ a o pahorku, který je nyní nese a který se zvedá nad Hinómovým údolím na jihu a západě a nad Tyropoeonem na východě, výše než Chrámová hora."
    - "Pro žalmisty je hora Sijón pahorek, který Bůh vyvolil: „Ozdoba krajiny, útěcha vší země jestiť hora Sion, k straně půlnoční, město krále velikého“; ti, kdo doufají v Pána, „podobni jsou k hoře Sionu, kteráž se nepohybuje“. Izajáš slíbil, že „z Jeruzaléma vyjdou ostatkové, a zachovaní z hory Siona“. Micheáš varoval, že „Sion jako pole orán bude“, slova, jež starší citovali o století později, aby zachránili Jeremjáše, a Pláč je viděl naplněná: „Pro horu Sion, že zpuštěna jest; lišky chodí po ní.“ Joel a Obadjáš hleděli za zříceniny: „na hoře Sion a v Jeruzalémě bude vysvobození“."
    - "V Novém zákoně je jméno zvednuto ze země. List Židům praví svým čtenářům: „přistoupili jste k hoře Sionu, a k městu Boha živého, Jeruzalému nebeskému“, a ve Zjevení stojí Beránek „na hoře Sion“ se sto čtyřiceti čtyřmi tisíci. Jak jméno sestoupilo na západní pahorek, vypráví článek o Sijónu. Na samém pahorku byl kostel Svatého Sijónu spálen Peršany roku 614; křižáci jej přestavěli jako Svatou Marii na hoře Sijón; roku 1333 získali františkáni Večeřadlo a v 16. století z něj Osmané udělali mešitu a vyhnali mnichy."
    - "Dnes leží hora Sijón těsně za Sijónskou bránou Starého Města. Stojí na ní Večeřadlo, gotická síň z křižácké doby obnovená františkány, o níž tradice tvrdí, že je místností Poslední večeře; pod ním kenotaf uctívaný od středověku jako Davidův hrob; a Opatství Zesnutí Panny Marie, vystavěné v letech 1900–1910 na půdě, kterou císař Vilém II. získal roku 1898 a kde podle tradice Marie zemřela. Na východním svahu označuje kostel svatého Petra in Gallicantu jedno tradiční místo domu Kaifášova. Vykopávky Blisse a Dickieho v 90. letech 19. století a Magena Broshiho v 70. letech sledovaly dávné hradby, které pahorek kdysi obklopovaly."
  sv:
    - "Sions berg är det namn Bibeln ger åt Jerusalems heliga kulle, och namnet har vandrat: i Psaltaren och hos profeterna betecknar det tempelberget, medan det sedan 300-talet har tillhört den högre västra kullen söder om nuvarande Gamla stan. Artikeln om Sion följer den vandringen; den här handlar om uttrycket ”Sions berg” och den kulle som nu bär det, som höjer sig över Hinnoms dal i söder och väster och Tyropoeondalen i öster, högre än Tempelberget."
    - "För psalmisterna är Sions berg den kulle som Gud utvalde: ”Skönt höjer det sig, hela jordens fröjd, berget Sion längst uppe i norr, den store konungens stad”; de som förtrösta på HERREN ”likna Sions berg, som icke vacklar”. Jesaja förkunnade att ”från Jerusalem skall utgå en kvarleva, en räddad skara från Sions berg”. Mika varnade för att Sion skulle bli ”upplöjt till en åker”, ord som de äldste citerade ett århundrade senare för att rädda Jeremia, och Klagovisorna såg dem uppfyllda: ”för Sions bergs skull, som nu ligger öde, så att rävarna ströva omkring därpå”. Joel och Obadja såg bortom ödeläggelsen: ”på Sions berg och i Jerusalem skall finnas en räddad skara”."
    - "I Nya testamentet lyfts namnet från marken. Hebreerbrevet säger till sina läsare: ”I haven kommit till Sions berg och den levande Gudens stad, det himmelska Jerusalem”, och i Uppenbarelseboken står Lammet ”på Sions berg” tillsammans med de hundrafyrtiofyra tusen. Hur namnet kom att flyttas till västra kullen berättas i artikeln om Sion. På själva kullen brändes kyrkan Heliga Sion av perserna år 614; korsfararna återuppbyggde den som Sankta Maria på Sions berg; 1333 förvärvade franciskanerna Övre salen, och på 1500-talet gjorde osmanerna den till moské och utvisade bröderna."
    - "I dag ligger Sions berg strax utanför Gamla stans Sions port. På det står Cenaculum, en gotisk sal från korsfararnas tid som restaurerats av franciskanerna och som enligt traditionen är rummet för den sista måltiden; därunder kenotafen som sedan medeltiden vördas som Davids grav; och Dormitionabbeyn, byggd 1900–1910 på mark som kejsar Vilhelm II erhöll 1898, där Maria enligt traditionen dog. På den östra sluttningen markerar Sankt Petrus in Gallicantu en traditionell plats för Kajafas hus. Utgrävningar av Bliss och Dickie på 1890-talet och av Magen Broshi på 1970-talet kartlade de forntida murarna som en gång omslöt kullen."
  nb:
    - "Sionfjellet er navnet Bibelen gir på Jerusalems hellige høyde, og navnet har vandret: i Salmene og hos profetene betyr det tempelhøyden, mens det siden 300-tallet har tilhørt den høyere vestlige høyden sør for dagens gamleby. Artikkelen om Sion følger denne vandringen; denne handler om uttrykket «Sions berg» og høyden som nå bærer det, som hever seg over Hinnom-dalen i sør og vest og Tyropoion-dalen i øst, høyere enn Tempelhøyden."
    - "For salmistene er Sions berg høyden Gud valgte: «Fagert hever det sig, en glede for all jorden er Sions berg, det ytterste Norden, den store konges stad»; de som setter sin lit til Herren, «er som Sions berg, som ikke rokkes». Jesaja lovte at «fra Jerusalem skal utgå en levning og fra Sions berg en rest som har sloppet unda». Mika advarte om at Sion skulle «pløies som en aker», ord som de eldste et århundre senere siterte for å berge Jeremia, og Klagesangene så dem oppfylt: «for Sions bergs skyld, som er øde; rever løper om på det.» Joel og Obadja så forbi ruinene: «på Sions berg og i Jerusalem skal det være en flokk av undkomne»."
    - "I Det nye testamente løftes navnet løs fra bakken. Hebreerbrevet sier til sine lesere: «I er kommet til Sions berg og den levende Guds stad, det himmelske Jerusalem», og i Johannes' åpenbaring står Lammet «på Sions berg» med de hundre og førti og fire tusen. Hvordan navnet kom ned på den vestlige høyden, fortelles i artikkelen om Sion. På selve høyden ble kirken Hellige Sion brent av perserne i 614; korsfarerne bygde den opp igjen som Sankt Maria av Sions berg; i 1333 overtok franziskanerne Overværelset, og på 1500-tallet gjorde osmanerne det til en moské og utviste brødrene."
    - "I dag ligger Sionfjellet like utenfor Sion-porten i gamlebyen. På det står Cenaculum, en gotisk hall fra korsfarertiden som er restaurert av franziskanerne, og som tradisjonen mener er rommet for det siste måltid; under den en kenotaf som siden middelalderen har vært æret som Davids grav; og Dormitio-abbediet, bygd 1900–1910 på grunn keiser Wilhelm II skaffet i 1898, der tradisjonen sier at Maria døde. På østskråningen markerer Sankt Peter in Gallicantu ett tradisjonelt sted for Kaifas' hus. Utgravninger ved Bliss og Dickie på 1890-tallet og ved Magen Broshi på 1970-tallet kartla de gamle murene som en gang omsluttet høyden."
