body:
  en:
    - "Beth-togarmah, “the house of Togarmah”, was a people and land of the far north in Ezekiel. Togarmah is a son of Gomer in the table of nations, a brother of Ashkenaz, that is a people of Anatolia. In the lament over Tyre, “they of the house of Togarmah traded in thy fairs with horses and horsemen and mules”, and in the prophecy of Gog it marches in his host: “Gomer, and all his bands; the house of Togarmah of the north quarters, and all his bands”. Horses and mules were the famous export of the Anatolian plateau, and the north is where the prophet puts it."
    - "Most scholars identify it with Tegarama of the Hittite texts, Til-garimmu of the Assyrian, a town and district on the border of Tabal in the Anti-Taurus, near modern Gürün in the province of Sivas in Turkey, on the road from Malatya to Kayseri; Sennacherib's annals record its capture in 695 BC. Armenian tradition, in Moses of Khorene, made Torgom the father of Hayk, ancestor of the Armenians, and “the house of Torgom” became a name for Armenia, which is why older maps put Togarmah there; the Georgian chronicles have a Targamos too. The town at Gürün has not been excavated, and the biblical name is known only from these three verses."
  ru:
    - "Дом Фогарма — народ и земля далёкого севера у Иезекииля. Фогарма — сын Гомера в таблице народов, брат Аскеназа, то есть народ Анатолии. В плаче о Тире «из дома Фогарма за товары твои доставляли тебе лошадей и строевых коней и лошаков», а в пророчестве о Гоге он идёт в его полчище: «Гомера со всеми отрядами его, дом Фогарма, от пределов севера, со всеми отрядами его». Кони и мулы были знаменитым вывозом Анатолийского плоскогорья, а север — туда пророк его и помещает."
    - "Большинство учёных отождествляют его с Тегарамой хеттских текстов, Тиль-гариммой ассирийских, городом и областью на границе Табала в Антитавре, близ нынешнего Гюрюна в турецкой провинции Сивас, на дороге из Малатьи в Кайсери; анналы Сеннахирима записывают его взятие в 695 г. до н. э. Армянское предание у Мовсеса Хоренаци сделало Торгома отцом Хайка, родоначальника армян, и «дом Торгома» стало именем Армении, оттого на старых картах Фогарму помещали там; есть Таргамос и в грузинских летописях. Город у Гюрюна не раскопан, а библейское имя известно только по этим трём стихам."
  uk:
    - "Бет-Тогарма, «дім Тогарми», був народом і краєм далекої півночі в Єзекіїля. Тогарма — син Гомера в таблиці народів, брат Аскеназа, тобто народу Анатолії. У плачі над Тіром «Люде з Тогарму віддавали тобі за твої вироби конї возові й верхові та мули», а в пророцтві про Гога вона виступає в його війську: «Гомера й усю ватагу його, дом Тогармів із ватагами його від північних гряниць». Коні й мули були славним експортом Анатолійського плато, і на півночі пророк її й ставить."
    - "Більшість учених ототожнює її з Тегарамою хетських текстів, Тіль-Гарімму ассирійських, містом і округом на кордоні Табала в Антитаврі, поблизу сучасного Гюрюна в провінції Сівас у Туреччині, на дорозі від Малатьї до Кайсері; аннали Сінаххеріба фіксують його здобуття в 695 р. до н. е. Вірменське передання у Мовсеса Хоренаці зробило Торгома батьком Айка, предка вірмен, і «дім Торгома» став назвою Вірменії, тому старіші мапи ставили Тогарму там; грузинські хроніки теж мають Таргамоса. Місто в Гюрюні не розкопували, і біблійна назва відома лише з цих трьох віршів."
  es:
    - "Bet-togarma, «la casa de Togarma», era un pueblo y tierra del lejano norte en Ezequiel. Togarma es un hijo de Gomer en la tabla de las naciones, hermano de Askenaz, es decir, un pueblo de Anatolia. En el lamento sobre Tiro, «De la casa de Togarma, caballos y caballeros y mulos, dieron en tu mercado», y en la profecía de Gog marcha en su hueste: «Gomer, y todas sus compañías; la casa de Togarma, á los lados del norte, y todas sus compañías». Caballos y mulos eran la famosa exportación de la meseta anatolia, y el norte es donde el profeta la sitúa."
    - "La mayoría de los estudiosos la identifican con Tegarama de los textos hititas, Til-garimmu de los asirios, una ciudad y distrito en la frontera de Tabal, en el Antitauro, cerca de la actual Gürün, en la provincia de Sivas, en Turquía, en el camino de Malatya a Kayseri; los anales de Senaquerib registran su captura en 695 a. C. La tradición armenia, en Moisés de Corene, hizo de Torgom el padre de Haik, antepasado de los armenios, y «la casa de Torgom» pasó a ser un nombre de Armenia, razón por la cual los mapas más antiguos la sitúan allí; las crónicas georgianas tienen también un Targamos. La ciudad de Gürün no ha sido excavada, y el nombre bíblico se conoce solo por estos tres versículos."
  pt:
    - "Bete-Togarma, “a casa de Togarma”, era um povo e terra do extremo norte em Ezequiel. Togarma é filho de Gômer na tabela das nações, irmão de Asquenaz, isto é, um povo da Anatólia. No lamento sobre Tiro, “Os da casa de Togarma trocavam cavalos, cavalos de guerra e mulas pelas suas mercadorias”, e na profecia de Gogue marcha em sua hoste: “Gômer e todas as suas hordas; a casa de Togarma, nos confins do norte, e todas as suas hordas”. Cavalos e mulas eram a famosa exportação do planalto anatólio, e o norte é onde o profeta a põe."
    - "A maioria dos estudiosos a identifica com Tegarama dos textos hititas, Til-garimmu dos assírios, uma cidade e distrito na fronteira de Tabal, no Anti-Touro, perto da atual Gürün, na província de Sivas, na Turquia, na estrada de Malatya a Kayseri; os anais de Senaqueribe registram sua captura em 695 a.C. A tradição armênia, em Moisés de Corene, fez de Torgom o pai de Hayk, antepassado dos armênios, e “a casa de Torgom” tornou-se nome da Armênia, razão por que mapas antigos a põem ali; as crônicas georgianas também têm um Targamos. A cidade de Gürün não foi escavada, e o nome bíblico só é conhecido por esses três versículos."
  de:
    - "Bet-Togarma, „das Haus Togarma“, war bei Hesekiel ein Volk und Land des fernen Nordens. Togarma ist in der Völkertafel ein Sohn Gomers, ein Bruder von Aschkenas, also ein Volk Anatoliens. In der Klage über Tyrus: „Die von Thogarma haben dir Rosse und Wagenpferde und Maulesel auf deine Märkte gebracht“, und in der Weissagung über Gog zieht es in seinem Heer mit: „dazu Gomer und all sein Heer samt dem Hause Thogarma, so gegen Mitternacht liegt, mit all seinem Heer“. Pferde und Maultiere waren der berühmte Export des anatolischen Hochlands, und im Norden setzt der Prophet es an."
    - "Die meisten Gelehrten setzen es mit Tegarama der hethitischen Texte gleich, Til-Garimmu der assyrischen, einer Stadt und einem Bezirk an der Grenze von Tabal im Antitaurus, nahe dem heutigen Gürün in der Provinz Sivas in der Türkei, an der Straße von Malatya nach Kayseri; Sanheribs Annalen verzeichnen seine Eroberung 695 v. Chr. Die armenische Überlieferung bei Moses von Choren machte Torgom zum Vater Hayks, des Ahnherrn der Armenier, und „das Haus Torgom“ wurde zum Namen Armeniens, weshalb ältere Karten Togarma dorthin setzen; auch die georgischen Chroniken kennen einen Targamos. Die Stadt bei Gürün wurde nicht ausgegraben, und der biblische Name ist nur aus diesen drei Versen bekannt."
  fr:
    - "Beth-Togarma, « la maison de Togarma », était un peuple et un pays du lointain nord chez Ézéchiel. Togarma est un fils de Gomer dans la table des nations, frère d’Aschkenaz, c’est-à-dire d’un peuple d’Anatolie. Dans la lamentation sur Tyr, « Ceux de la maison de Togarma pourvoyaient tes marchés de chevaux, de cavaliers et de mulets », et dans la prophétie sur Gog elle marche dans son armée : « Gomer et toutes ses troupes, la maison de Togarma, à l’extrémité du septentrion, et toutes ses troupes ». Chevaux et mulets étaient l’exportation célèbre du plateau anatolien, et le nord est où le prophète la met."
    - "La plupart des savants l’identifient à Tegarama des textes hittites, Til-garimmu des assyriens, ville et district à la frontière du Tabal dans l’Anti-Taurus, près de l’actuelle Gürün dans la province de Sivas, en Turquie, sur la route de Malatya à Kayseri ; les annales de Sanchérib consignent sa prise en 695 av. J.-C. La tradition arménienne, chez Moïse de Khorène, fit de Torgom le père de Hayk, ancêtre des Arméniens, et « la maison de Torgom » devint un nom de l’Arménie, ce pour quoi d’anciennes cartes y placent Togarma ; les chroniques géorgiennes ont aussi un Targamos. La ville de Gürün n’a pas été fouillée, et le nom biblique n’est connu que par ces trois versets."
