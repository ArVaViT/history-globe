body:
  en:
    - "Beth-togarmah, “the house of Togarmah”, was a people and land of the far north in Ezekiel. Togarmah is a son of Gomer in the table of nations, a brother of Ashkenaz, that is a people of Anatolia. In the lament over Tyre, “they of the house of Togarmah traded in thy fairs with horses and horsemen and mules”, and in the prophecy of Gog it marches in his host: “Gomer, and all his bands; the house of Togarmah of the north quarters, and all his bands”. Horses and mules were the famous export of the Anatolian plateau, and the north is where the prophet puts it."
    - "Most scholars identify it with Tegarama of the Hittite texts, Til-garimmu of the Assyrian, a town and district on the border of Tabal in the Anti-Taurus, near modern Gürün in the province of Sivas in Turkey, on the road from Malatya to Kayseri; Sennacherib's annals record its capture in 695 BC. Armenian tradition, in Moses of Khorene, made Torgom the father of Hayk, ancestor of the Armenians, and “the house of Torgom” became a name for Armenia, which is why older maps put Togarmah there; the Georgian chronicles have a Targamos too. The town at Gürün has not been excavated, and the Bible names it only in the table of nations (Genesis 10, repeated in 1 Chronicles 1) and in Ezekiel."
  ru:
    - "Дом Фогарма — народ и земля далёкого севера у Иезекииля. Фогарма — сын Гомера в таблице народов, брат Аскеназа, то есть народ Анатолии. В плаче о Тире «из дома Фогарма за товары твои доставляли тебе лошадей и строевых коней и лошаков», а в пророчестве о Гоге он идёт в его полчище: «Гомера со всеми отрядами его, дом Фогарма, от пределов севера, со всеми отрядами его». Кони и мулы были знаменитым вывозом Анатолийского плоскогорья, а север — туда пророк его и помещает."
    - "Большинство учёных отождествляют его с Тегарамой хеттских текстов, Тиль-гариммой ассирийских, городом и областью на границе Табала в Антитавре, близ нынешнего Гюрюна в турецкой провинции Сивас, на дороге из Малатьи в Кайсери; анналы Сеннахирима записывают его взятие в 695 г. до н. э. Армянское предание у Мовсеса Хоренаци сделало Торгома отцом Хайка, родоначальника армян, и «дом Торгома» стало именем Армении, оттого на старых картах Фогарму помещали там; есть Таргамос и в грузинских летописях. Город у Гюрюна не раскопан, а Библия называет его только в родословии народов (Бытие 10, повторено в 1 Паралипоменон 1) и у Иезекииля."
  uk:
    - "Бет-Тогарма, «дім Тогарми», був народом і краєм далекої півночі в Єзекіїля. Тогарма — син Гомера в таблиці народів, брат Аскеназа, тобто народу Анатолії. У плачі над Тіром «Люде з Тогарму віддавали тобі за твої вироби конї возові й верхові та мули», а в пророцтві про Гога вона виступає в його війську: «Гомера й усю ватагу його, дом Тогармів із ватагами його від північних гряниць». Коні й мули були славним експортом Анатолійського плато, і на півночі пророк її й ставить."
    - "Більшість учених ототожнює її з Тегарамою хетських текстів, Тіль-Гарімму ассирійських, містом і округом на кордоні Табала в Антитаврі, поблизу сучасного Гюрюна в провінції Сівас у Туреччині, на дорозі від Малатьї до Кайсері; аннали Сінаххеріба фіксують його здобуття в 695 р. до н. е. Вірменське передання у Мовсеса Хоренаці зробило Торгома батьком Айка, предка вірмен, і «дім Торгома» став назвою Вірменії, тому старіші мапи ставили Тогарму там; грузинські хроніки теж мають Таргамоса. Місто в Гюрюні не розкопували, а Біблія називає її лише в таблиці народів (Буття 10, повторено в 1 Хронік 1) і в Єзекіїля."
  es:
    - "Bet-togarma, «la casa de Togarma», era un pueblo y tierra del lejano norte en Ezequiel. Togarma es un hijo de Gomer en la tabla de las naciones, hermano de Askenaz, es decir, un pueblo de Anatolia. En el lamento sobre Tiro, «De la casa de Togarma, caballos y caballeros y mulos, dieron en tu mercado», y en la profecía de Gog marcha en su hueste: «Gomer, y todas sus compañías; la casa de Togarma, á los lados del norte, y todas sus compañías». Caballos y mulos eran la famosa exportación de la meseta anatolia, y el norte es donde el profeta la sitúa."
    - "La mayoría de los estudiosos la identifican con Tegarama de los textos hititas, Til-garimmu de los asirios, una ciudad y distrito en la frontera de Tabal, en el Antitauro, cerca de la actual Gürün, en la provincia de Sivas, en Turquía, en el camino de Malatya a Kayseri; los anales de Senaquerib registran su captura en 695 a. C. La tradición armenia, en Moisés de Corene, hizo de Torgom el padre de Haik, antepasado de los armenios, y «la casa de Torgom» pasó a ser un nombre de Armenia, razón por la cual los mapas más antiguos la sitúan allí; las crónicas georgianas tienen también un Targamos. La ciudad de Gürün no ha sido excavada, y la Biblia la nombra solo en la tabla de las naciones (Génesis 10, repetida en 1 Crónicas 1) y en Ezequiel."
  pt:
    - "Bete-Togarma, “a casa de Togarma”, era um povo e terra do extremo norte em Ezequiel. Togarma é filho de Gômer na tabela das nações, irmão de Asquenaz, isto é, um povo da Anatólia. No lamento sobre Tiro, “Os da casa de Togarma trocavam cavalos, cavalos de guerra e mulas pelas suas mercadorias”, e na profecia de Gogue marcha em sua hoste: “Gômer e todas as suas hordas; a casa de Togarma, nos confins do norte, e todas as suas hordas”. Cavalos e mulas eram a famosa exportação do planalto anatólio, e o norte é onde o profeta a põe."
    - "A maioria dos estudiosos a identifica com Tegarama dos textos hititas, Til-garimmu dos assírios, uma cidade e distrito na fronteira de Tabal, no Anti-Touro, perto da atual Gürün, na província de Sivas, na Turquia, na estrada de Malatya a Kayseri; os anais de Senaqueribe registram sua captura em 695 a.C. A tradição armênia, em Moisés de Corene, fez de Torgom o pai de Hayk, antepassado dos armênios, e “a casa de Torgom” tornou-se nome da Armênia, razão por que mapas antigos a põem ali; as crônicas georgianas também têm um Targamos. A cidade de Gürün não foi escavada, e a Bíblia só a nomeia na tábua das nações (Gênesis 10, repetida em 1 Crônicas 1) e em Ezequiel."
  de:
    - "Bet-Togarma, „das Haus Togarma“, war bei Hesekiel ein Volk und Land des fernen Nordens. Togarma ist in der Völkertafel ein Sohn Gomers, ein Bruder von Aschkenas, also ein Volk Anatoliens. In der Klage über Tyrus: „Die von Thogarma haben dir Rosse und Wagenpferde und Maulesel auf deine Märkte gebracht“, und in der Weissagung über Gog zieht es in seinem Heer mit: „dazu Gomer und all sein Heer samt dem Hause Thogarma, so gegen Mitternacht liegt, mit all seinem Heer“. Pferde und Maultiere waren der berühmte Export des anatolischen Hochlands, und im Norden setzt der Prophet es an."
    - "Die meisten Gelehrten setzen es mit Tegarama der hethitischen Texte gleich, Til-Garimmu der assyrischen, einer Stadt und einem Bezirk an der Grenze von Tabal im Antitaurus, nahe dem heutigen Gürün in der Provinz Sivas in der Türkei, an der Straße von Malatya nach Kayseri; Sanheribs Annalen verzeichnen seine Eroberung 695 v. Chr. Die armenische Überlieferung bei Moses von Choren machte Torgom zum Vater Hayks, des Ahnherrn der Armenier, und „das Haus Torgom“ wurde zum Namen Armeniens, weshalb ältere Karten Togarma dorthin setzen; auch die georgischen Chroniken kennen einen Targamos. Die Stadt bei Gürün wurde nicht ausgegraben, und die Bibel nennt es nur in der Völkertafel (Genesis 10, wiederholt in 1 Chronik 1) und bei Ezechiel."
  fr:
    - "Beth-Togarma, « la maison de Togarma », était un peuple et un pays du lointain nord chez Ézéchiel. Togarma est un fils de Gomer dans la table des nations, frère d’Aschkenaz, c’est-à-dire d’un peuple d’Anatolie. Dans la lamentation sur Tyr, « Ceux de la maison de Togarma pourvoyaient tes marchés de chevaux, de cavaliers et de mulets », et dans la prophétie sur Gog elle marche dans son armée : « Gomer et toutes ses troupes, la maison de Togarma, à l’extrémité du septentrion, et toutes ses troupes ». Chevaux et mulets étaient l’exportation célèbre du plateau anatolien, et le nord est où le prophète la met."
    - "La plupart des savants l’identifient à Tegarama des textes hittites, Til-garimmu des assyriens, ville et district à la frontière du Tabal dans l’Anti-Taurus, près de l’actuelle Gürün dans la province de Sivas, en Turquie, sur la route de Malatya à Kayseri ; les annales de Sanchérib consignent sa prise en 695 av. J.-C. La tradition arménienne, chez Moïse de Khorène, fit de Torgom le père de Hayk, ancêtre des Arméniens, et « la maison de Torgom » devint un nom de l’Arménie, ce pour quoi d’anciennes cartes y placent Togarma ; les chroniques géorgiennes ont aussi un Targamos. La ville de Gürün n’a pas été fouillée, et la Bible ne la nomme que dans la table des peuples (Genèse 10, reprise en 1 Chroniques 1) et chez Ézéchiel."
  it:
    - "Bet-Togarma, «la casa di Togarma», era un popolo e una terra dell’estremo nord in Ezechiele. Togarma è un figlio di Gomer nella tavola delle nazioni, fratello di Aschenàz, cioè un popolo dell’Anatolia. Nel lamento su Tiro, «Quelli della casa di Togarma pagano le tue mercanzie con cavalli da tiro, con cavalli da corsa, e con muli», e nella profezia di Gog marcia nel suo esercito: «Gomer e tutte le sue schiere, la casa di Togarma dell’estremità del settentrione e tutte le sue schiere». Cavalli e muli erano la famosa esportazione dell’altopiano anatolico, e il nord è dove il profeta la pone."
    - "La maggior parte degli studiosi la identifica con Tegarama dei testi ittiti, Til-garimmu degli assiri, una città e distretto al confine di Tabal nell’Anti-Tauro, presso l’odierna Gürün nella provincia di Sivas in Turchia, sulla strada da Malatya a Kayseri; gli annali di Sennacherib ne registrano la presa nel 695 a.C. La tradizione armena, in Mosè di Corene, fece di Torgom il padre di Hayk, antenato degli Armeni, e «la casa di Torgom» divenne un nome per l’Armenia, per cui carte più antiche vi collocano Togarma; le cronache georgiane hanno anch’esse un Targamos. La città di Gürün non è stata scavata, e la Bibbia la nomina soltanto nella tavola delle nazioni (Genesi 10, ripresa in 1 Cronache 1) e in Ezechiele."
  pl:
    - "Bet-Togarma, „dom Togarmy”, było ludem i krajem dalekiej północy u Ezechiela. Togarma jest synem Gomera w Tablicy Ludów, bratem Aszkenaza, czyli ludu Anatolii. W lamencie nad Tyrem „Z domu Togorma końmi, i jezdnymi, i mułami kupczyli na jarmarkach twoich”, a w proroctwie o Gogu maszeruje w jego wojsku: „Gomer i wszystkie hufy jego, dom Togormy mieszkającego w stronach północnych, i wszystkie poczty jego”. Konie i muły były słynnym towarem eksportowym płaskowyżu anatolijskiego, a na północy umieszcza je prorok."
    - "Większość uczonych utożsamia je z Tegaramą tekstów hetyckich, Til-garimmu asyryjskich, miastem i okręgiem na granicy Tabalu w Antytaurusie, koło dzisiejszego Gürün w prowincji Sivas w Turcji, przy drodze z Malatyi do Kayseri; roczniki Sennacheryba zapisują jego zdobycie w 695 r. p.n.e. Tradycja ormiańska u Mojżesza z Chorenu uczyniła Torgoma ojcem Hajka, przodka Ormian, a „dom Torgoma” stał się nazwą Armenii, dlatego starsze mapy umieszczają tam Togarmę; kroniki gruzińskie też mają Targamosa. Miasta w Gürün nie wykopywano, a Biblia wymienia je tylko w tablicy narodów (Księga Rodzaju 10, powtórzona w 1 Kronik 1) i u Ezechiela."
  nl:
    - "Beth-Togarma, “het huis van Togarma”, was bij Ezechiël een volk en land in het verre noorden. Togarma is in de volkerentafel een zoon van Gomer, een broer van Askenaz, dat wil zeggen een volk van Anatolië. In de klaagzang over Tyrus staat: “Uit het huis van Togarma leverden zij paarden, en ruiteren, en muilezels op uw markten”, en in de profetie over Gog trekt het mee in zijn leger: “Gomer en al zijn benden, en het huis van Togarma, aan de zijden van het noorden, en al zijn benden”. Paarden en muilezels waren het beroemde exportproduct van het Anatolische plateau, en het noorden is waar de profeet het plaatst."
    - "De meeste geleerden identificeren het met Tegarama van de Hettitische teksten, Til-garimmu van de Assyrische, een stad en district aan de grens van Tabal in de Anti-Taurus, nabij het huidige Gürün in de provincie Sivas in Turkije, aan de weg van Malatya naar Kayseri; Sanheribs annalen vermelden de verovering ervan in 695 v.Chr. De Armeense overlevering maakte bij Mozes van Choren Torgom tot de vader van Hayk, de voorvader van de Armeniërs, en “het huis van Torgom” werd een naam voor Armenië, en daarom plaatsen oudere kaarten Togarma daar; de Georgische kronieken kennen ook een Targamos. De stad bij Gürün is niet opgegraven, en de Bijbel noemt het alleen in de volkerentafel (Genesis 10, herhaald in 1 Kronieken 1) en bij Ezechiël."
  cs:
    - "Bét-togarma, „dům Togarmy“, byl národ a země dalekého severu u Ezechiela. Togarma je syn Gomerův v Tabulce národů, bratr Aškenaze, tedy národ Anatolie. V nářku nad Týrem „Z domu Togarma v koních a jezdcích i mezcích kupčili na jarmarcích tvých“ a v proroctví o Gogovi táhne v jeho vojsku: „Gomera i všecky houfy jeho, dům Togarmy od stran půlnočních, i všecky houfy jeho“. Koně a muly byly slavným vývozním zbožím anatolské plošiny a sever je tam, kam jej prorok klade."
    - "Většina badatelů jej ztotožňuje s Tegaramou chetitských textů, Til-garimmu asyrských, městem a okresem na hranici Tabalu v Antitauru, poblíž dnešního Gürünu v provincii Sivas v Turecku, na cestě z Malatye do Kayseri; Senacheribovy anály zaznamenávají jeho dobytí roku 695 př. n. l. Arménská tradice u Mojžíše Chorenského učinila z Torgoma otce Hayka, předka Arménů, a „dům Torgomův“ se stal jménem pro Arménii, proto jej starší mapy kladou tam; gruzínské kroniky mají také Targamose. Město u Gürünu nebylo vykopáno a Bible jej jmenuje jen v tabulce národů (Genesis 10, zopakováno v 1. Paralipomenon 1) a u Ezechiele."
