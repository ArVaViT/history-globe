body:
  en:
    - "Meribah, “strife” or “quarrel”, is the name the Bible gives to two places where Israel quarrelled with Moses over water, and at both the water came out of a rock. The first was at Rephidim, on the way to Sinai: the people chided Moses, he struck the rock in Horeb at God's word, and “he called the name of the place Massah, and Meribah”, Trial and Strife, “because they tempted the LORD, saying, Is the LORD among us, or not?” The second, nearly forty years later, was at Kadesh in the wilderness of Zin, and it is the waters of Meribah in Kadesh that the later books mostly mean; the record here stands at Kadesh."
    - "At Kadesh, where Miriam had just died, the congregation again had no water. God told Moses to speak to the rock; Moses cried, “Hear now, ye rebels; must we fetch you water out of this rock?”, struck it twice, and water came out abundantly. But the LORD said to Moses and Aaron, “Because ye believed me not, to sanctify me in the eyes of the children of Israel, therefore ye shall not bring this congregation into the land which I have given them.” “This is the water of Meribah; because the children of Israel strove with the LORD, and he was sanctified in them.” For this Aaron died on Mount Hor and Moses on Mount Nebo, outside the land. What exactly their fault was the text leaves to the reader, and commentators have argued it since antiquity."
    - "The name became a byword. Moses' blessing says of Levi, “whom thou didst prove at Massah, and with whom thou didst strive at the waters of Meribah”; in Psalm 81 God says, “I proved thee at the waters of Meribah”; Psalm 95 warns, “Harden not your heart, as in the provocation”, which the Synodal Bible renders “as in Meribah”, and Hebrews repeats the warning; Psalm 106 recalls that “they angered him also at the waters of strife, so that it went ill with Moses for their sakes”. Ezekiel makes “the waters of strife in Kadesh”, Meribath-kadesh, a point on the southern border of the restored land, and some read the same name in the opening of Moses' blessing, where the King James Version has “ten thousands of saints”."
    - "No spring is called Meribah today. Kadesh is usually placed at the springs of Ain el-Qudeirat and Ain Qedeis in north-eastern Sinai, and the waters of Meribah are sought there; Rephidim, the first Meribah, is sought in the wadis of southern Sinai, often at Wadi Feiran, but neither place is identified with certainty."
  ru:
    - "Мерива, «распря» или «ссора», — имя, которое Библия даёт двум местам, где Израиль ссорился с Моисеем из-за воды, и в обоих вода вышла из скалы. Первое было в Рефидиме, по дороге к Синаю: народ укорял Моисея, тот по слову Божию ударил в скалу в Хориве, «и нарек месту тому имя: Масса и Мерива», Искушение и Распря, «по причине укорения сынов Израилевых и потому, что они искушали Господа, говоря: есть ли Господь среди нас, или нет?» Второе, почти сорок лет спустя, было в Кадесе в пустыне Син, и именно воды Меривы при Кадесе чаще всего имеют в виду позднейшие книги; запись здесь стоит в Кадесе."
    - "В Кадесе, где только что умерла Мариам, у общества снова не было воды. Бог велел Моисею сказать скале; Моисей воскликнул: «послушайте, непокорные, разве нам из этой скалы извести для вас воду?», ударил в неё дважды, и потекло много воды. Но Господь сказал Моисею и Аарону: «за то, что вы не поверили Мне, чтоб явить святость Мою пред очами сынов Израилевых, не введете вы народа сего в землю, которую Я даю ему». «Это вода Меривы, у которой вошли в распрю сыны Израилевы с Господом, и Он явил им святость Свою». За это Аарон умер на горе Ор, а Моисей на горе Нево, вне земли. В чём именно состояла их вина, текст оставляет читателю, и толкователи спорят об этом с древности."
    - "Имя стало нарицательным. Благословение Моисея говорит о Левии: «которого Ты искусил в Массе, с которым Ты препирался при водах Меривы»; в 80-м псалме Бог говорит: «при водах Меривы испытал тебя»; 94-й псалом предостерегает: «не ожесточите сердца вашего, как в Мериве», и Послание к Евреям повторяет это предостережение; 105-й псалом вспоминает: «И прогневали Бога у вод Меривы, и Моисей потерпел за них». Иезекииль доводит южную границу восстановленной земли «до вод пререкания при Кадисе», до Мериват-Кадеса, а некоторые читают то же имя в начале благословения Моисея, где в Синодальном переводе стоит «со тьмами святых»."
    - "Источника по имени Мерива сегодня нет. Кадес обычно помещают у источников Айн-эль-Кудейрат и Айн-Кдейс на северо-востоке Синая, и там ищут воды Меривы; Рефидим, первую Мериву, ищут в вади южного Синая, чаще всего в Вади-Фейран, но ни одно из мест не отождествлено с уверенностью."
  uk:
    - "Мерива, «сварка» або «суперечка», — ім’я, яке Біблія дає двом місцям, де Ізраїль сперечався з Мойсеєм через воду, і в обох вода вийшла зі скелі. Перше було в Рефідімі, на шляху до Синаю: народ сварився з Мойсеєм, він ударив скелю в Хориві за словом Бога, і «проложив прізвище врочищу тому: Маса і Мерива», Випробування й Сварка, «задля того, що спокушували Бога мовляючи: Чи Господь є між нами, чи нема?» Друге, майже сорок років потому, було в Кадесі в пустелі Сін, і саме води Мериви в Кадесі переважно мають на увазі пізніші книги; запис тут стосується Кадеса."
    - "У Кадесі, де щойно померла Міріам, громада знову не мала води. Бог сказав Мойсеєві промовити до скелі; Мойсей вигукнув: «Слухайте ж, ворохобники, чи добудемо з сієї скелї воду про вас?», ударив її двічі, і вода потекла рясно. Але Господь сказав Мойсеєві й Аарону: «За те, що не няли ви менї віри, щоб осьвятити мене в очу синів Ізраїля, за те не приведете ви громади сієї в землю, що я надїлив їм». «Се води Мериви, де сварились Ізрайлеві сини з Господом, і він явив їм сьвятість свою.» За це Аарон помер на горі Гор, а Мойсей на горі Нево, поза землею. У чому саме була їхня провина, текст залишає читачеві, і коментатори сперечаються про це з давнини."
    - "Назва стала прислів’ям. Благословення Мойсея каже про Левія: «котрого ти спокушував в Массї, і заводив сварку при водах Мериви»; у Псалмі 81 Бог каже: «я пробував тебе над водами Мериви»; Псалом 95 застерігає: «Та не стали тверді серцями, як в Мериві», що Синодальний переклад передає назвою «как в Мериве», і Послання до євреїв повторює застереження; Псалом 106 згадує: «Ще прогнївили Бога над водами Мериви; і задля них дізнав Мойсей лиха». Єзекіїль робить «вод переріку коло Кадесу», Мериват-Кадес, точкою на південному кордоні відновленої землі, а дехто читає ту саму назву на початку благословення Мойсея, де в тексті Куліша стоїть «з тьмами сьвятих»."
    - "Жодне джерело сьогодні не зветься Мерива. Кадес зазвичай розміщують біля джерел Айн-ель-Кудейрат і Айн-Кедіс на північному сході Синаю, і води Мериви шукають там; Рефідім, першу Мериву, шукають у ваді півдня Синаю, часто у Ваді-Фейран, але жодне з місць не ототожнене певно."
  es:
    - "Meriba, «querella» o «riña», es el nombre que la Biblia da a dos lugares donde Israel riñó con Moisés por el agua, y en ambos el agua brotó de una roca. El primero estuvo en Refidim, de camino al Sinaí: el pueblo altercó con Moisés, este golpeó la roca en Horeb por palabra de Dios, y «llamó el nombre de aquel lugar Massah y Meribah», Prueba y Querella, «y porque tentaron á Jehová, diciendo: ¿Está, pues, Jehová entre nosotros, ó no?». El segundo, casi cuarenta años después, estuvo en Cades, en el desierto de Zin, y son las aguas de Meriba en Cades las que los libros posteriores suelen significar; el registro de aquí corresponde a Cades."
    - "En Cades, donde María acababa de morir, la congregación volvió a quedarse sin agua. Dios dijo a Moisés que hablara a la roca; Moisés exclamó: «Oid ahora, rebeldes: ¿os hemos de hacer salir aguas de esta peña?», la golpeó dos veces, y salió agua en abundancia. Pero Jehová dijo a Moisés y a Aarón: «Por cuanto no creísteis en mí, para santificarme en ojos de los hijos de Israel, por tanto, no meteréis esta congregación en la tierra que les he dado». «Estas son las aguas de la rencilla, por las cuales contendieron los hijos de Israel con Jehová, y él se santificó en ellos». Por ello Aarón murió en el monte Hor y Moisés en el monte Nebo, fuera de la tierra. En qué consistió exactamente su falta lo deja el texto al lector, y los comentaristas lo discuten desde la antigüedad."
    - "El nombre se convirtió en proverbio. La bendición de Moisés dice de Leví: «al cual tentaste en Massa, y le hiciste reñir en las aguas de la rencilla»; en el Salmo 81 Dios dice: «te probé sobre las aguas de Meriba»; el Salmo 95 advierte: «No endurezcáis vuestro corazón como en Meriba», que la Biblia sinodal traduce igual, y Hebreos repite la advertencia; el Salmo 106 recuerda que «También le irritaron en las aguas de Meriba: é hizo mal á Moisés por causa de ellos». Ezequiel hace de las «aguas de las rencillas» de Cades, Meribat-cades, un punto de la frontera meridional de la tierra restaurada, y algunos leen el mismo nombre al comienzo de la bendición de Moisés, donde la versión del rey Jacobo tiene «diez mil santos»."
    - "Hoy ningún manantial se llama Meriba. Cades suele situarse en los manantiales de Ain el-Qudeirat y Ain Qedeis, en el nordeste del Sinaí, y allí se buscan las aguas de Meriba; Refidim, la primera Meriba, se busca en los uadis del sur del Sinaí, a menudo en el Wadi Feirán, pero ninguno de los dos lugares está identificado con certeza."
  pt:
    - "Meribá, “contenda” ou “querela”, é o nome que a Bíblia dá a dois lugares onde Israel brigou com Moisés por água, e em ambos a água saiu de uma rocha. O primeiro foi em Refidim, a caminho do Sinai: o povo contendeu com Moisés, ele feriu a rocha em Horebe por ordem de Deus, e “Ele chamou o nome do lugar de Massá, e Meribá”, Prova e Contenda, “porque puseram o SENHOR à prova, dizendo: ‘O SENHOR está entre nós, ou não?’” O segundo, quase quarenta anos depois, foi em Cades, no deserto de Zim, e são as águas de Meribá em Cades que os livros posteriores mais entendem; o registro aqui está em Cades."
    - "Em Cades, onde Miriã acabara de morrer, a congregação de novo não tinha água. Deus disse a Moisés que falasse à rocha; Moisés gritou: “Ouçam agora, rebeldes! Tiraremos nós água desta rocha para vocês?”, feriu-a duas vezes, e a água jorrou abundantemente. Mas o SENHOR disse a Moisés e a Arão: “Como vocês não creram em mim, para me santificar aos olhos dos filhos de Israel, por isso vocês não introduzirão esta assembleia na terra que lhes dei.” “Estas são as águas de Meribá; porque os filhos de Israel contenderam com o SENHOR, e ele foi santificado neles.” Por isso Arão morreu no monte Hor e Moisés no monte Nebo, fora da terra. Qual foi exatamente a falta deles o texto deixa ao leitor, e os comentadores a discutem desde a Antiguidade."
    - "O nome tornou-se símbolo. A bênção de Moisés diz de Levi: “a quem você provou em Massá, com quem você contendeu nas águas de Meribá”; no Salmo 81, Deus diz: “Eu o provei nas águas de Meribá”; o Salmo 95 adverte: “Não endureçam o seu coração, como em Meribá”, e Hebreus repete o aviso; o Salmo 106 recorda que “Eles também o iraram nas águas de Meribá, de modo que Moisés sofreu por causa deles”. Ezequiel faz das “águas de Meribá-Cades” um ponto da fronteira sul da terra restaurada, e alguns leem o mesmo nome na abertura da bênção de Moisés, onde a King James Version traz “das dezenas de milhares de santos”."
    - "Nenhuma fonte se chama hoje Meribá. Cades é geralmente situada nas fontes de Ain el-Qudeirat e Ain Qedeis, no nordeste do Sinai, e as águas de Meribá são procuradas ali; Refidim, a primeira Meribá, é procurada nos uádis do sul do Sinai, muitas vezes no Wadi Feiran, mas nenhum dos dois lugares é identificado com certeza."
  de:
    - "Meriba, „Streit“ oder „Zank“, ist der Name, den die Bibel zwei Orten gibt, an denen Israel mit Mose um Wasser haderte, und an beiden kam das Wasser aus einem Felsen. Der erste lag bei Refidim, auf dem Weg zum Sinai: Das Volk haderte mit Mose, er schlug auf Gottes Wort den Fels am Horeb, und „Da hieß man den Ort Massa und Meriba“, Prüfung und Streit, „daß sie den HERRN versucht und gesagt hatten: Ist der HERR unter uns oder nicht?“ Der zweite, fast vierzig Jahre später, lag bei Kadesch in der Wüste Zin, und die späteren Bücher meinen meist das Haderwasser bei Kadesch; der Eintrag hier steht bei Kadesch."
    - "In Kadesch, wo Mirjam eben gestorben war, hatte die Gemeinde wieder kein Wasser. Gott sagte Mose, er solle zum Fels reden; Mose rief: „Höret, ihr Ungehorsamen, werden wir euch Wasser bringen aus jenem Fels?“, schlug ihn zweimal, und viel Wasser kam heraus. Aber der HERR sprach zu Mose und Aaron: „Darum daß ihr nicht an mich geglaubt habt, mich zu heiligen vor den Kindern Israel, sollt ihr diese Gemeinde nicht in das Land bringen, das ich ihnen geben werde.“ „Das ist das Haderwasser, darüber die Kinder Israel mit dem HERRN haderten und er geheiligt ward an ihnen.“ Deshalb starb Aaron auf dem Berg Hor und Mose auf dem Berg Nebo, außerhalb des Landes. Worin genau ihre Schuld bestand, überlässt der Text dem Leser, und die Ausleger streiten seit der Antike darüber."
    - "Der Name wurde zum Inbegriff. Moses Segen sagt von Levi, „den du versucht hast zu Massa, da ihr hadertet am Haderwasser“; in Psalm 81 spricht Gott: „und versuchte dich am Haderwasser“; Psalm 95 warnt: „so verstocket euer Herz nicht, wie zu Meriba geschah“, was die Synodalbibel ebenso hat, und der Hebräerbrief wiederholt die Warnung; Psalm 106 erinnert: „Und sie erzürnten ihn am Haderwasser, und Mose ging es übel um ihretwillen“. Bei Hesekiel reicht die Südgrenze des wiederhergestellten Landes „bis ans Haderwasser zu Kades“, Meribat-Kadesch, und manche lesen denselben Namen am Anfang von Moses Segen, wo die King-James-Version von Zehntausenden Heiligen spricht."
    - "Heute heißt keine Quelle Meriba. Kadesch wird meist bei den Quellen von Ain el-Qudeirat und Ain Qedeis im nordöstlichen Sinai angesetzt, und dort sucht man die Wasser von Meriba; Refidim, das erste Meriba, sucht man in den Wadis des südlichen Sinai, oft im Wadi Feiran, doch keiner der Orte ist sicher identifiziert."
  fr:
    - "Meriba, « querelle » ou « dispute », est le nom que la Bible donne à deux lieux où Israël se querella avec Moïse à propos de l’eau, et aux deux l’eau sortit d’un rocher. Le premier fut à Rephidim, sur la route du Sinaï : le peuple chercha querelle à Moïse, qui frappa le rocher d’Horeb sur l’ordre de Dieu, et « il donna à ce lieu le nom de Massa et Meriba », Épreuve et Querelle, « parce qu’ils avaient tenté l’Éternel, en disant : L’Éternel est-il au milieu de nous, ou n’y est-il pas ? » Le second, près de quarante ans plus tard, fut à Qadesh, dans le désert de Tsin, et ce sont les eaux de Meriba à Qadesh que veulent surtout dire les livres tardifs ; la fiche présente est placée à Qadesh."
    - "À Qadesh, où Miriam venait de mourir, l’assemblée n’avait de nouveau pas d’eau. Dieu dit à Moïse de parler au rocher ; Moïse s’écria : « Écoutez donc, rebelles ! Est-ce de ce rocher que nous vous ferons sortir de l’eau ? », le frappa deux fois, et l’eau en sortit en abondance. Mais l’Éternel dit à Moïse et à Aaron : « Parce que vous n’avez pas cru en moi, pour me sanctifier aux yeux des enfants d’Israël, vous ne ferez point entrer cette assemblée dans le pays que je lui donne. » « Ce sont les eaux de Meriba, où les enfants d’Israël contestèrent avec l’Éternel, qui fut sanctifié en eux. » Pour cela Aaron mourut sur le mont Hor et Moïse sur le mont Nebo, hors du pays. En quoi consistait exactement leur faute, le texte le laisse au lecteur, et les commentateurs en débattent depuis l’Antiquité."
    - "Le nom devint proverbial. La bénédiction de Moïse dit de Lévi : « que tu as tenté à Massa, et avec qui tu as contesté aux eaux de Meriba » ; au Psaume 81, Dieu dit : « Je t’ai éprouvé près des eaux de Meriba » ; le Psaume 95 avertit : « N’endurcissez pas votre cœur, comme à Meriba », ce que la Bible synodale rend de même, et l’épître aux Hébreux répète l’avertissement ; le Psaume 106 rappelle qu’« ils irritèrent l’Éternel près des eaux de Meriba ; et Moïse fut puni à cause d’eux ». Ézéchiel fait des « eaux de Meriba à Kadès », Meriboth-Qadesh, un point de la frontière sud du pays restauré, et certains lisent le même nom au début de la bénédiction de Moïse, là où la version du roi Jacques a des dizaines de milliers de saints."
    - "Aucune source ne s’appelle aujourd’hui Meriba. On place d’ordinaire Qadesh aux sources d’Aïn el-Qudeirat et d’Aïn Qedeis, dans le nord-est du Sinaï, et l’on y cherche les eaux de Meriba ; Rephidim, la première Meriba, se cherche dans les ouadis du sud du Sinaï, souvent à l’ouadi Feiran, mais aucun des deux lieux n’est identifié avec certitude."
  it:
    - "Meriba, «contesa» o «lite», è il nome che la Bibbia dà a due luoghi in cui Israele litigò con Mosè per l’acqua, e in entrambi l’acqua uscì da una roccia. Il primo fu a Refidim, sulla via del Sinai: il popolo contese con Mosè, egli percosse la roccia in Horeb per ordine di Dio, e «pose nome a quel luogo Massah e Meribah», Prova e Contesa, «e perché aveano tentato l’Eterno, dicendo: “L’Eterno è egli in mezzo a noi, si o no?”». Il secondo, quasi quarant’anni dopo, fu a Kades nel deserto di Zin, ed è per lo più alle acque di Meriba a Kades che pensano i libri successivi; la scheda presente riguarda Kades."
    - "A Kades, dove Maria era appena morta, la raunanza di nuovo non aveva acqua. Dio disse a Mosè di parlare alla roccia; Mosè gridò: «Ora ascoltate, o ribelli; vi farem noi uscir dell’acqua da questo sasso?», la percosse due volte, e ne uscì acqua in abbondanza. Ma l’Eterno disse a Mosè e ad Aronne: «Siccome non avete avuto fiducia in me per dar gloria al mio santo nome agli occhi dei figliuoli d’Israele, voi non introdurrete questa raunanza nel paese che io le do». «Queste sono le acque di Meriba dove i figliuoli d’Israele contesero con l’Eterno che si fece riconoscere come il Santo in mezzo a loro.» Per questo Aronne morì sul Monte Or e Mosè sul Monte Nebo, fuori della terra. In che cosa consistesse esattamente la loro colpa il testo lo lascia al lettore, e i commentatori ne discutono fin dall’antichità."
    - "Il nome divenne proverbiale. La benedizione di Mosè dice di Levi: «che tu provasti a Massa, e col quale contendesti alle acque di Meriba»; nel Salmo 81 Dio dice: «ti provai alle acque di Meriba»; il Salmo 95 avverte: «non indurate il vostro cuore come a Meriba», dove la King James Version ha «provocazione» e la Bibbia sinodale «Meriba», e la Lettera agli Ebrei ripete l’avvertimento; il Salmo 106 ricorda che «Lo provocarono ad ira anche alle acque di Meriba, e venne del male a Mosè per cagion loro». Ezechiele fa de «le acque di Meriboth di Kades», Meribat-Kades, un punto del confine meridionale della terra restaurata, e alcuni leggono lo stesso nome all’inizio della benedizione di Mosè, dove la King James Version ha «decine di migliaia di santi»."
    - "Oggi nessuna sorgente si chiama Meriba. Kades è di solito collocata alle sorgenti di Ain el-Qudeirat e Ain Qedeis nel Sinai nord-orientale, e le acque di Meriba si cercano là; Refidim, la prima Meriba, si cerca nei wadi del Sinai meridionale, spesso al Wadi Feiran, ma nessuno dei due luoghi è identificato con certezza."
  pl:
    - "Meriba, „spór” albo „swar”, to nazwa, którą Biblia daje dwóm miejscom, gdzie Izrael spierał się z Mojżeszem o wodę, i w obu woda wyszła ze skały. Pierwsze było w Refidim, w drodze na Synaj: lud swarzył się z Mojżeszem, on uderzył skałę w Horeb na słowo Boże i „nazwał imię onego miejsca Masa i Meryba”, Próba i Spór, „a iż kusili Pana mówiąc: I jestże Pan między nami czyli nie?” Drugie, prawie czterdzieści lat później, było w Kadesz na pustyni Sin i to o wodach Meriby w Kadesz mówią głównie późniejsze księgi; zapis tutaj dotyczy Kadesz."
    - "W Kadesz, gdzie właśnie umarła Miriam, zgromadzenie znów nie miało wody. Bóg kazał Mojżeszowi przemówić do skały; Mojżesz zawołał: „Słuchajcież teraz ludzie odporni, izali z tej skały możemy wam wywieść wodę?”, uderzył ją dwa razy i woda wyszła obficie. Ale Pan rzekł do Mojżesza i Aarona: „Dlatego, żeście mi nie uwierzyli, abyście mię poświęcili przed oczyma synów Izraelskich, przetoż nie wprowadzicie zgromadzenia tego do ziemi, którąm im dał.” „Teć są wody poswarku, o które się swarzyli synowie Izraelscy z Panem, i poświęcony jest w nich.” Za to Aaron umarł na górze Hor, a Mojżesz na górze Nebo, poza ziemią. Na czym dokładnie polegała ich wina, tekst pozostawia czytelnikowi, a komentatorzy spierają się o to od starożytności."
    - "Nazwa stała się przysłowiem. Błogosławieństwo Mojżesza mówi o Lewim: „któregoś kusił w Massa, i z którymeś miał spór u wód Meryba”; w Psalmie 81 Bóg mówi: „doświadczałem cię u wód poswarku”; Psalm 95 ostrzega: „Nie zatwardzajcież serca swego, jako w Meryba” (w Biblii synodalnej „jak w Meriwie”), a List do Hebrajczyków powtarza to ostrzeżenie; Psalm 106 wspomina: „Znowu go byli wzruszyli do gniewu u wód Meryba, tak, iż się źle działo i z Mojżeszem dla nich”. Ezechiel czyni z „wód poswarków w Kades”, Meribat-Kadesz, punkt na południowej granicy odnowionej ziemi, a niektórzy czytają to samo imię na początku błogosławieństwa Mojżesza, gdzie Biblia Króla Jakuba ma dziesiątki tysięcy świętych."
    - "Dziś żadne źródło nie nazywa się Meriba. Kadesz umieszcza się zwykle przy źródłach Ain el-Qudeirat i Ain Qedeis w północno-wschodnim Synaju i tam szuka się wód Meriby; Refidim, pierwszej Meriby, szuka się w wadi południowego Synaju, często w Wadi Feiran, ale żadnego z tych miejsc nie utożsamiono z pewnością."
  nl:
    - "Meriba, “twist” of “ruzie”, is de naam die de Bijbel geeft aan twee plaatsen waar Israël met Mozes twistte over water, en bij beide kwam het water uit een rots. De eerste lag bij Refidim, op weg naar de Sinaï: het volk twistte met Mozes, hij sloeg op Gods woord de rots in Horeb, en “hij noemde den naam dier plaats Massa en Meriba”, Verzoeking en Twist, “omdat zij den HEERE verzocht hadden, zeggende: Is de HEERE in het midden van ons, of niet?” De tweede, bijna veertig jaar later, was bij Kades in de woestijn Zin, en het zijn de wateren van Meriba bij Kades die de latere boeken meestal bedoelen; het lemma hier staat bij Kades."
    - "Bij Kades, waar Mirjam net gestorven was, had de gemeente opnieuw geen water. God zei Mozes tot de rots te spreken; Mozes riep: “Hoort toch, gij wederspannigen, zullen wij water voor ulieden uit deze steenrots hervoorbrengen?”, sloeg haar tweemaal, en er kwam overvloedig water uit. Maar de HEER zei tot Mozes en Aäron: “Omdat gijlieden Mij niet geloofd hebt, dat gij Mij heiligdet voor de ogen der kinderen van Israël, daarom zult gijlieden deze gemeente niet inbrengen in het land, hetwelk Ik hun gegeven heb.” “Dit zijn de wateren van Meriba, daar de kinderen Israels met den HEERE om getwist hebben; en Hij werd aan hen geheiligd.” Hierom stierf Aäron op de berg Hor en Mozes op de berg Nebo, buiten het land. Wat hun fout precies was, laat de tekst aan de lezer over, en commentatoren hebben er sinds de oudheid over getwist."
    - "De naam werd een spreekwoord. Mozes' zegen zegt van Levi: “dien Gij verzocht hebt in Massa, met welken Gij getwist hebt aan de wateren van Meriba”; in Psalm 81 zegt God: “Ik beproefde u aan de wateren van Meriba”; Psalm 95 waarschuwt: “Verhardt uw hart niet, gelijk te Meriba”, waar de Synodale Bijbel “als bij Meriba” heeft, en Hebreeën herhaalt de waarschuwing; Psalm 106 gedenkt dat “Zij maakten Hem ook zeer toornig aan het twistwater, en het ging Mozes kwalijk om hunnentwil”. Ezechiël maakt van “het twistwater van Kades”, Meribat-Kades, een punt op de zuidgrens van het herstelde land, en sommigen lezen dezelfde naam in het begin van Mozes' zegen, waar de King James Version “tienduizenden heiligen” heeft."
    - "Geen bron heet nu Meriba. Kades wordt gewoonlijk geplaatst bij de bronnen van Ain el-Qudeirat en Ain Qedeis in het noordoosten van de Sinaï, en de wateren van Meriba worden daar gezocht; Refidim, de eerste Meriba, wordt gezocht in de wadi's van de zuidelijke Sinaï, vaak bij de Wadi Feiran, maar geen van beide plaatsen is met zekerheid geïdentificeerd."
  cs:
    - "Meriba, „svár“ nebo „hádka“, je jméno, které Bible dává dvěma místům, kde se Izrael s Mojžíšem hádal o vodu, a u obou vyšla voda ze skály. První bylo v Refídimu, na cestě na Sinaj: lid se domlouval na Mojžíše, ten na Boží slovo udeřil do skály na Orébě a „dal jméno místu tomu Massah a Meribah“, Zkoušení a Svár, „a že pokoušeli Hospodina, řkouce: Jest-li Hospodin u prostřed nás, či není?“ Druhé, téměř o čtyřicet let později, bylo v Kádeši na poušti Sín a právě „vody sváru“ v Kádeši mají pozdější knihy většinou na mysli; záznam zde stojí u Kádeše."
    - "V Kádeši, kde právě zemřela Mirjam, neměla pospolitost opět vodu. Bůh řekl Mojžíšovi, aby ke skále promluvil; Mojžíš zvolal: „Slyštež nyní, ó reptáci: Zdali z skály této vyvedeme vám vodu?“, udeřil do ní dvakrát a vyšla hojná voda. Hospodin však řekl Mojžíšovi a Áronovi: „Že jste mi nevěřili, abyste posvětili mne před očima synů Izraelských, proto neuvedete shromáždění tohoto do země, kterouž jsem jim dal.“ „Toť jsou ty vody sváru, o kteréž svařili se synové Izraelští s Hospodinem, a posvěcen jest v nich.“ Pro to zemřel Áron na hoře Hor a Mojžíš na hoře Nebo, mimo zemi. V čem přesně spočívala jejich vina, text ponechává čtenáři, a vykladači o tom spolu zápolí od starověku."
    - "Jméno se stalo pojmem. Mojžíšovo požehnání praví o Levim, „kteréhož jsi zkusil v pokušení, a kterýž podlé tebe měl nesnáz při vodách Meribah“; v Žalmu 81 Bůh praví: „zkušoval jsem tě při vodách sváru“; Žalm 95 varuje: „Nezatvrzujte srdce svého, jako při popuzení“, což synodální Bible vyjadřuje „jako v Meribě“, a List Židům varování opakuje; Žalm 106 připomíná: „Opět ho byli popudili při vodách sváru, až se i Mojžíšovi zle stalo pro ně“. Ezechiel vede jižní hranici obnovené země „od Támar až k vodám sváru v Kádes“, v Meribat-kádeš, a někteří čtou totéž jméno na začátku Mojžíšova požehnání, kde anglická Bible krále Jakuba má „s desíti tisíci svatých“."
    - "Dnes se žádný pramen nejmenuje Meriba. Kádeš se obvykle klade k pramenům Ain el-Qudeirat a Ain Qedeis v severovýchodním Sinaji a vody Meriby se hledají tam; Refídim, první Meriba, se hledá ve wádí jižního Sinaje, často ve Wádí Feiran, ale ani jedno místo není určeno s jistotou."
  sv:
    - "Meriva, ”kiv” eller ”tvist”, är namnet Bibeln ger två platser där Israel tvistade med Mose om vatten, och vid båda kom vattnet ur en klippa. Den första låg i Refidim, på väg till Sinai: folket klandrade Mose, han slog på Horebs klippa på Guds ord, och ”han gav stället namnet Massa och Meriba”, Prövning och Kiv, ”därför att Israels barn hade tvistat och frestat HERREN och sagt: »Är HERREN ibland oss eller icke?»” Den andra, nästan fyrtio år senare, låg vid Kadesh i Sins öken, och det är Merivas vatten vid Kadesh som de senare böckerna oftast menar; denna post står vid Kadesh."
    - "Vid Kadesh, där Mirjam just hade dött, saknade menigheten åter vatten. Gud sade åt Mose att tala till klippan; Mose ropade: ”Hören nu, I gensträvige; kunna vi väl ur denna klippa skaffa fram vatten åt eder?”, slog på den två gånger, och vatten kom ut i överflöd. Men HERREN sade till Mose och Aron: ”Eftersom I icke trodden på mig och icke höllen mig helig inför Israels barns ögon, därför skolen I icke få föra denna församling in i det land som jag har givit dem.” ”Detta var Meribas vatten, där Israels barn tvistade med HERREN, och där han bevisade sig helig på dem.” För detta dog Aron på berget Hor och Mose på berget Nebo, utanför landet. Vad deras fel exakt var lämnar texten åt läsaren, och kommentatorer har diskuterat det sedan antiken."
    - "Namnet blev ett ordspråk. Moses välsignelse säger om Levi: ”dem du frestade i Massa, dem du tvistade med vid Meribas vatten”; i Psalm 81 säger Gud: ”jag prövade dig vid Meribas vatten”; Psalm 95 varnar: ”Förhärden icke edra hjärtan såsom i Meriba”, vilket Synodalbibeln också återger med namnet, och Hebreerbrevet upprepar varningen; Psalm 106 erinrar om att ”De förtörnade honom ock vid Meribas vatten, och det gick Mose illa för deras skull”. Hesekiel gör ”Meribas vatten vid Kades”, Meribat-Kadesh, till en punkt på det återställda landets södra gräns, och vissa läser samma namn i inledningen av Moses välsignelse, där King James Version har ”mångtusen heliga”."
    - "Ingen källa kallas Meriva i dag. Kadesh placeras vanligen vid källorna Ain el-Qudeirat och Ain Qedeis i nordöstra Sinai, och Merivas vatten söks där; Refidim, den första Meriva, söks i södra Sinais wadier, ofta vid Wadi Feiran, men ingen av platserna är identifierad med säkerhet."
  nb:
    - "Meriba, «strid» eller «krangel», er navnet Bibelen gir to steder der Israel kivdes med Moses om vann, og begge steder kom vannet ut av en klippe. Det første var ved Refidim, på veien til Sinai: folket kivdes med Moses, han slo klippen ved Horeb på Guds ord, og «han kalte stedet Massa og Meriba», Prøvelse og Strid, «fordi de fristet Herren og sa: Er Herren iblandt oss eller ikke?» Det andre, nesten førti år senere, var ved Kadesj i ørkenen Sin, og det er Meribas vann ved Kadesj som de senere bøkene mest mener; oppføringen her står ved Kadesj."
    - "Ved Kadesj, der Mirjam nettopp var død, hadde menigheten igjen ikke vann. Gud sa til Moses at han skulle tale til klippen; Moses ropte: «Nu, I gjenstridige! Mon vi kan la vann strømme frem for eder av denne klippe?», slo to ganger på den, og vann strømmet rikelig ut. Men Herren sa til Moses og Aron: «Fordi I ikke trodde på mig og ikke helliget mig for Israels barns øine, derfor skal I ikke føre dette folk inn i det land jeg har gitt dem.» «Dette var Meribas vann, hvor Israels barn kivedes med Herren, og han helliget sig på dem.» For dette døde Aron på Hor-fjellet og Moses på Nebo, utenfor landet. Hva deres feil egentlig var, overlater teksten til leseren, og kommentatorer har diskutert det siden oldtiden."
    - "Navnet ble et ordtak. Moses' velsignelse sier om Levi: «som du fristet ved Massa, som du trettet med ved Meribas vann»; i Salme 81 sier Gud: «jeg prøvde dig ved Meriba-vannene»; Salme 95 advarer: «Forherd ikke eders hjerte, likesom ved Meriba», der King James-oversettelsen har «som i forbitrelsen» og den russiske synodalbibelen «som ved Meriba», og Hebreerbrevet gjentar advarselen; Salme 106 minner om at «de vakte vrede ved Meribas vann, og det gikk Moses ille for deres skyld». Esekiel gjør «Meribots vann ved Kades», Meribat-Kadesj, til et punkt på den sørlige grensen av det gjenopprettede landet, og noen leser det samme navnet i åpningen av Moses' velsignelse, der King James-oversettelsen har «ti tusener av hellige»."
    - "Ingen kilde kalles Meriba i dag. Kadesj plasseres vanligvis ved kildene Ain el-Qudeirat og Ain Qedeis i nordøstlige Sinai, og Meribas vann søkes der; Refidim, den første Meriba, søkes i wadiene i det sørlige Sinai, ofte ved Wadi Feiran, men ingen av stedene er identifisert med sikkerhet."
  tl:
    - "Ang Meribah, “pakikipagtalo” o “pag-aaway”, ay ang pangalang ibinibigay ng Biblia sa dalawang lugar kung saan nakipagtalo ang Israel kay Moises tungkol sa tubig, at sa dalawa ay lumabas ang tubig mula sa bato. Ang una ay sa Rephidim, sa daan patungong Sinai: nakipagtalo ang bayan kay Moises, hinampas niya ang bato sa Horeb sa utos ng Diyos, at “tinawag nila ang pangalan ng dakong yaon, na Massah at Meribah”, Pagsubok at Pakikipagtalo, “dahil sa kanilang tinukso ang Panginoon, na kanilang sinasabi, Ang Panginoon ba'y nasa gitna natin o wala?” Ang ikalawa, halos apatnapung taon pagkaraan, ay sa Cades sa ilang ng Zin, at ang tubig ng Meribah sa Cades ang kalimitang tinutukoy ng mga huling aklat; ang talaan dito ay nasa Cades."
    - "Sa Cades, kamamatay lamang ni Miriam, muling walang tubig ang kapulungan. Sinabi ng Diyos kay Moises na magsalita sa bato; sumigaw si Moises, “Makinig kayo ngayon, mga mapanghimagsik, ikukuha ba namin kayo ng tubig sa batong ito?”, hinampas itong makalawa, at lumabas nang sagana ang tubig. Ngunit sinabi ng Panginoon kina Moises at Aaron, “Sapagka't hindi kayo sumampalataya sa akin upang ipakilala ninyong banal ako sa mga mata ng mga anak ni Israel, kaya't hindi ninyo dadalhin ang kapisanang ito sa lupain na aking ibinigay sa kanila.” “Ito ang tubig ng Meriba; sapagka't sinisi ng mga anak ni Israel ang Panginoon, at siya'y napakilalang banal sa kanila.” Dahil dito namatay si Aaron sa Bundok Hor at si Moises sa Bundok Nebo, sa labas ng lupain. Hindi tinukoy ng teksto ang eksaktong kasalanan nila, at pinagtatalunan ito ng mga komentarista mula pa noong una."
    - "Ang pangalan ay naging sawikain. Sinasabi ng pagpapala ni Moises tungkol kay Levi, “Na siyang iyong sinubok sa Massa, Na siya mong kinatunggali sa tubig ng Meriba”; sa Awit 81 sinasabi ng Diyos, “sinubok kita sa tubig ng Meriba”; nagbababala ang Awit 95: “Huwag ninyong papagmatigasin ang inyong puso, gaya sa Meriba”, na sa King James Version ay “provocation” at sa Synodal Bible ay “gaya sa Meriba”, at inuulit ng Sulat sa mga Hebreo ang babala; inaalala ng Awit 106 na “Kanilang ginalit din siya sa tubig ng Meriba, na anopa't naging masama kay Moises dahil sa kanila”. Ginagawa ni Ezekiel ang “tubig ng Meribot-cades” na isang punto sa katimugang hangganan ng naibalik na lupain, at binabasa ng ilan ang gayon ding pangalan sa pagbubukas ng pagpapala ni Moises, kung saan ang King James Version ay may “ten thousands of saints”."
    - "Walang bukal na tinatawag na Meribah ngayon. Ang Cades ay karaniwang inilalagay sa mga bukal ng Ain el-Qudeirat at Ain Qedeis sa hilagang-silangang Sinai, at doon hinahanap ang tubig ng Meribah; ang Rephidim, ang unang Meribah, ay hinahanap sa mga wadi ng timog Sinai, madalas sa Wadi Feiran, ngunit wala sa dalawang lugar ang natutukoy nang tiyak."
  da:
    - "Meriba, »kiv« eller »strid«, er det navn, Bibelen giver to steder, hvor Israel kivedes med Moses om vand, og begge steder kom vandet ud af en klippe. Det første var ved Refidim, på vejen til Sinaj: folket kivedes med Moses, han slog »Klippen paa Horeb« på Guds ord, og »kaldte han Stedets Navn Massa og Meriba«, Prøvelse og Kiv, »for Israels Børns Kiv, og fordi de havde fristet Herren og sagt: Monne Herren være iblandt os eller ej?« Det andet, næsten fyrre år senere, var ved Kadesj i Zin-ørkenen, og det er Meribas vand ved Kadesj, de senere bøger mest mener; posten her står ved Kadesj."
    - "Ved Kadesj, hvor Miriam netop var død, havde menigheden igen intet vand. Gud bød Moses tale til klippen; Moses råbte: »Hører dog, I genstridige! monne vi kunne lade Vand komme ud til eder af denne Klippe?«, slog den to gange, og vand kom rigeligt ud. Men Herren sagde til Moses og Aron: »Fordi I ikke troede paa mig, til at helliggøre mig for Israels Børns Øjne, derfor skulle I ikke føre denne Menighed ind i det Land, som jeg har givet dem.« »Dette er Kivevandet, hvor Israels Børn kivedes med Herren; og han helliggjorde sig paa dem.« For dette døde Aron på Hor-bjerget og Moses på Nebo-bjerget, uden for landet. Hvad præcis deres fejl var, overlader teksten til læseren, og kommentatorer har diskuteret det siden oldtiden."
    - "Navnet blev et ordsprog. Moses' velsignelse siger om Levi: »hvem du fristede i Massa, med hvem du kivedes ved Meribas Vand«; i Salme 81 siger Gud: »jeg prøvede dig ved Meriba Vande«; Salme 95 advarer: »Forhærder ikke eders Hjerte«, hvorpå synodalbibelen fortsætter »som ved Meriba«, og Hebræerbrevet gentager advarslen; Salme 106 minder om, at de »fortørnede ham ogsaa ved Meribas Vand, og det gik Mose ilde for deres Skyld«. Ezekiel gør »Kivevandet ved Kades«, Meribat-Kadesj, til et punkt på det genoprettede lands sydgrænse, og nogle læser det samme navn i indledningen til Moses' velsignelse, hvor King James-oversættelsen har ti tusinde hellige."
    - "Ingen kilde kaldes i dag Meriba. Kadesj placeres sædvanligvis ved kilderne Ain el-Qudeirat og Ain Qedeis i det nordøstlige Sinai, og Meribas vand søges dér; Refidim, den første Meriba, søges i wadierne i det sydlige Sinai, ofte ved Wadi Feiran, men ingen af stederne er identificeret med sikkerhed."
  sr:
    - "Мерива, „свађа“, име је које Библија даје двама местима где се Израиљ свађао с Мојсијем око воде, и на оба је вода потекла из стене. Прво је било у Рафидину, на путу на Синај: народ се препирао с Мојсијем, он је по Божјој речи ударио у стену на Хориву, а место је названо Маса и Мерива, Искушење и Свађа: „А место оно прозва Маса и Мерива зато што се свађаше синови Израиљеви и што кушаше Господа говорећи: Је ли Господ међу нама или није?“ Друго, скоро четрдесет година касније, било је код Кадиса у пустињи Син, и то су воде Мериве у Кадису које каснији списи већином подразумевају; запис овде стоји код Кадиса."
    - "Код Кадиса, где је Маријама управо умрла, збор опет није имао воде. Бог је рекао Мојсију да проговори стени; Мојсије је повикао: „Слушајте одметници! Хоћемо ли вам из ове стене извести воду?“, ударио је двапут и вода је потекла у изобиљу. Али Господ је рекао Мојсију и Арону: „Што ми не веровасте и не прослависте ме пред синовима Израиљевим, зато нећете одвести збора тог у земљу коју сам им дао.“ „То је вода од свађе, где се свађаше синови Израиљеви с Господом, и Он се прослави међу њима.“ Због тога је Арон умро на гори Ор, а Мојсије на гори Нево, изван земље. У чему је тачно била њихова кривица, текст препушта читаоцу, а тумачи се око тога споре од старине."
    - "Име је постало синоним. Мојсијев благослов каже за Левија: „ког си окушао у Маси и с којим си се препирао на води Мериви“; у Псалму 81 Бог каже: „на води Мериви искушах те“; Псалам 95 опомиње: „Немојте да вам одрвени срце ваше као у Мериви“, што и Синодална Библија преводи именом, „као у Мериви“, а Посланица Јеврејима понавља опомену; Псалам 106 подсећа да су „разгневише Бога на води Мериви, и Мојсије пострада њих ради“. Језекиљ чини „воде Мериве у Кадису“, Меривот-Кадис, тачком на јужној граници обновљене земље, а неки исто име читају и на почетку Мојсијевог благослова, где Библија краља Џејмса има „десет хиљада светаца“."
    - "Данас се ниједан извор не зове Мерива. Кадис се обично смешта на изворе Ајн ел-Кудејрат и Ајн Кедис у североисточном Синају, и воде Мериве траже се ту; Рафидин, прва Мерива, тражи се у вадијима јужног Синаја, често у Вади Фајрану, али ниједно место није идентификовано са сигурношћу."
  hu:
    - "Meriba, „veszekedés” vagy „vita”, a neve annak a két helynek a Bibliában, ahol Izráel vízért vitatkozott Mózessel, és mindkét helyen sziklából fakadt a víz. Az első Refidimnél volt, a Sínaira vezető úton: a nép perlekedett Mózessel, ő Isten szavára megütötte a sziklát a Hóreben, és „nevezé annak a helynek nevét Masszának és Méribának”, Megpróbáltatásnak és Veszekedésnek, „mert kísértették az Urat, mondván: Vajjon köztünk van-é az Úr vagy nincsen?” A második, majdnem negyven évvel később, Kádesnél volt a Cin pusztájában, és a későbbi könyvek többnyire a kádesi Meriba vizeit értik; a lap itt Kádesnél áll."
    - "Kádesnél, ahol Mirjám éppen meghalt, a gyülekezetnek ismét nem volt vize. Isten azt mondta Mózesnek, hogy szóljon a sziklához; Mózes így kiáltott: „Halljátok meg most, ti lázadók! Avagy e kősziklából fakasszunk-é néktek vizet?”, kétszer megütötte, és bőven jött ki a víz. Az Úr azonban azt mondta Mózesnek és Áronnak: „Mivelhogy nem hittetek nékem, hogy megdicsőítettetek volna engem Izráel fiainak szemei előtt: azért nem viszitek be e községet a földre, a melyet adtam nékik.” „Ezek a versengésnek vizei, a melyekért feddőztek Izráel fiai az Úrral; és megdicsőítette magát ő bennök.” Ezért halt meg Áron a Hór-hegyen, Mózes pedig a Nébó-hegyen, az ország határán kívül. Hogy pontosan mi volt a vétkük, a szöveg az olvasóra bízza, és a magyarázók az ókor óta vitatkoznak rajta."
    - "A név közmondássá lett. Mózes áldása Lévi felől ezt mondja: „a kit megkísértél Masszában, a kivel perbe szálltál Mériba vizeinél”; a 81. zsoltárban Isten így szól: „megpróbáltalak téged a versengések vizénél”; a 95. zsoltár int: „Ne keményítsétek meg a ti szíveteket, mint Meribáhnál”, ahol a King James-fordítás „a lázadásnál” ír, a szinodális Biblia pedig Meribát, és a Zsidókhoz írt levél megismétli az intést; a 106. zsoltár emlékeztet: „Megharagíták a Meribáh vizeinél is, és baja támadt Mózesnek miattok”. Ezékiel a déli határt „Támártól a versengések vizéig Kádesben” vonja meg, Meribat-Kádest az újjáéledt föld déli határpontjává téve, és egyesek ugyanezt a nevet olvassák Mózes áldásának elején, ahol a King James-fordítás „ten thousands of saints”-et ír, Károli pedig így: „tízezer szent közül”."
    - "Ma egy forrást sem hívnak Meribának. Kádest rendszerint az északkelet-sínai Ain el-Qudeirat és Ain Qedeis forrásainál keresik, és ott keresik Meriba vizeit; Refidimet, az első Meribát a déli Sínai vádijaiban, gyakran a Wadi Feiranban keresik, de egyik hely sem azonosítható biztosan."
  fi:
    - "Meriba, ”kiista” tai ”riita”, on nimi, jonka Raamattu antaa kahdelle paikalle, joissa Israel riiteli Mooseksen kanssa vedestä ja joissa vesi tuli kalliosta. Ensimmäinen oli Refidimissä, matkalla Siinaille: kansa riiteli Mooseksen kanssa, tämä löi kalliota Hoorebin luona Jumalan sanasta, ja ”hän antoi sille paikalle nimen Massa ja Meriba”, Koettelu ja Kiista, ”sentähden, että israelilaiset siellä riitelivät ja kiusasivat Herraa, sanoen: ’Onko Herra meidän keskellämme vai ei?’” Toinen, lähes neljäkymmentä vuotta myöhemmin, oli Kadeksessa Zinin erämaassa, ja sitä myöhemmät kirjat enimmäkseen tarkoittavat Meriban vesillä; kirjaus tässä on Kadeksessa."
    - "Kadeksessa, jossa Mirjam oli juuri kuollut, seurakunnalla ei jälleen ollut vettä. Jumala käski Mooseksen puhua kalliolle; Mooses sanoi: ”Kuulkaa nyt, te niskurit! Onko meidän saatava teille vettä tästä kalliosta?”, löi sitä kahdesti, ja vettä tuli runsaasti. Mutta Herra sanoi Moosekselle ja Aaronille: ”Koska ette uskoneet minuun ettekä pitäneet minua pyhänä israelilaisten silmien edessä, niin te ette saa viedä tätä seurakuntaa siihen maahan, jonka minä heille annan”. ”Tämä oli Meriban vesi, jonka luona israelilaiset riitelivät Herraa vastaan ja hän näytti heille pyhyytensä.” Tämän vuoksi Aaron kuoli Horinvuorella ja Mooses Nebovuorella, maan ulkopuolella. Mikä heidän virheensä tarkalleen oli, teksti jättää lukijan pääteltäväksi, ja kommentaattorit ovat kiistelleet siitä antiikista asti."
    - "Nimestä tuli sananparsi. Mooseksen siunaus sanoo Leevistä: ”jota sinä Massassa koettelit, jonka kanssa sinä riitelit Meriban veden luona”; Ps. 81:ssä Jumala sanoo: ”minä koettelin sinua Meriban veden luona”; Ps. 95 varoittaa: ”Älkää paaduttako sydäntänne, niinkuin Meribassa”, kuten myös Synodaalinen Raamattu kääntää, ja Heprealaiskirje toistaa varoituksen; Ps. 106 muistuttaa: ”He vihoittivat hänet Meriban vetten luona, ja Mooseksen kävi pahoin heidän tähtensä”. Hesekiel vetää palautetun maan eteläisen rajan Taamarista ”Meriban veteen, joka on Kaadeksessa”, Meribat-Kadekseen, ja jotkut lukevat saman nimen Mooseksen siunauksen alussa, missä on ”kymmentuhantisesta pyhien joukosta”."
    - "Mikään lähde ei nykyään kanna nimeä Meriba. Kades sijoitetaan yleensä Ain el-Qudeiratin ja Ain Qedeisin lähteille Koillis-Siinailla, ja Meriban vesiä etsitään sieltä; Refidimiä, ensimmäistä Meribaa, etsitään Etelä-Siinain wadeista, usein Wadi Feiranilta, mutta kumpaakaan paikkaa ei ole tunnistettu varmuudella."
  vi:
    - "Mê-ri-ba, “tranh cãi” hay “cãi cọ”, là tên Kinh Thánh đặt cho hai nơi mà Y-sơ-ra-ên cãi cọ với Môi-se vì nước, và ở cả hai, nước chảy ra từ một tảng đá. Nơi thứ nhất ở Rê-phi-đim, trên đường đến Si-na-i: dân sự cãi cọ với Môi-se, ông đập hòn đá ở Hô-rếp theo lời Đức Chúa Trời, và “Người đặt tên nơi nầy là Ma-sa và Mê-ri-ba”, Thử thách và Tranh cãi, “vì họ đã ướm thử Đức Giê-hô-va mà nói rằng: Có Đức Giê-hô-va ở giữa chúng ta hay chăng?”. Nơi thứ hai, gần bốn mươi năm sau, ở Ca-đe trong đồng vắng Xin, và các sách về sau phần lớn muốn nói đến nước Mê-ri-ba ở Ca-đe; mục này đặt tại Ca-đe."
    - "Tại Ca-đe, nơi Mi-ri-am vừa qua đời, hội chúng lại không có nước. Đức Chúa Trời bảo Môi-se nói với hòn đá; Môi-se kêu: “Hỡi dân phản nghịch! hãy nghe, chúng ta há dễ khiến nước chảy từ hòn đá nầy ra cho các ngươi được sao?”, đập hai lần, và nước chảy ra dồi dào. Nhưng Đức Giê-hô-va phán với Môi-se và A-rôn: “Bởi vì hai ngươi không có tin đến ta, đặng tôn ta nên thánh trước mặt dân Y-sơ-ra-ên, vì cớ đó, hai ngươi sẽ không đem hội chúng nầy vào xứ mà ta đã cho nó đâu”. “Ấy đó là nước của Mê-ri-ba, tức là nơi dân Y-sơ-ra-ên cãi-trã cùng Đức Giê-hô-va; Ngài tự nên thánh trước mặt dân đó”. Vì điều này, A-rôn chết trên núi Hô-rơ và Môi-se trên núi Nê-bô, ngoài xứ. Lỗi của họ chính xác là gì, văn bản để người đọc, và các nhà chú giải tranh luận từ thời cổ đại."
    - "Cái tên trở thành một thành ngữ. Lời chúc phước của Môi-se nói về Lê-vi: “ngươi thử thách tại Ma-sa, Tranh giành với tại nước Mê-ri-ba”; trong Thi thiên 81 Đức Chúa Trời phán: “Và cũng thử thách ngươi nơi nước Mê-ri-ba”; Thi thiên 95 cảnh cáo: “Chớ cứng lòng như tại Mê-ri-ba”, nơi bản King James dịch tên như một danh từ chung còn bản Synodal đọc là Mê-ri-ba, và thư Hê-bơ-rơ lặp lại lời cảnh cáo; Thi thiên 106 nhắc rằng “Tổ phụ chúng tôi cũng chọc giận Ngài tại nước Mê-ri-ba, Nên, vì cớ họ, có tai họa xảy đến cho Môi-se”. Ê-xê-chi-ên coi “sông Mê-ri-ba, tại Ca-đe”, Mê-ri-bát-Ca-đe, là một điểm trên biên giới phía nam của xứ được phục hồi, và một số người đọc cùng tên ở đầu lời chúc phước của Môi-se, nơi bản King James có “muôn vàn đấng thánh”."
    - "Ngày nay không mạch nước nào gọi là Mê-ri-ba. Ca-đe thường được đặt ở các mạch nước Ain el-Qudeirat và Ain Qedeis ở đông bắc Si-na-i, và nước Mê-ri-ba được tìm ở đó; Rê-phi-đim, Mê-ri-ba thứ nhất, được tìm trong các wadi nam Si-na-i, thường ở Wadi Feiran, nhưng không nơi nào được xác định chắc chắn."
  ro:
    - "Meriba, „ceartă” sau „dispută”, este numele pe care Biblia îl dă la două locuri unde Israel s-a certat cu Moise pentru apă, iar la amândouă apa a ieșit dintr-o stâncă. Primul a fost la Refidim, pe drumul spre Sinai: poporul s-a certat cu Moise, el a lovit stânca din Horeb la porunca lui Dumnezeu și „a numit numele locului aceluia: ispită și blestem”, adică Masa și Meriba, Încercare și Ceartă, „pentru blestemul fiilor lui Israil, și pentrucă au ispitit pre Domnul, zicând: de este Domnul întru noi, au ba?” Al doilea, aproape patruzeci de ani mai târziu, a fost la Cades, în pustia Țin, și la apele Meribei din Cades se referă mai ales cărțile de mai târziu; înregistrarea de aici se află la Cades."
    - "La Cades, unde tocmai murise Maria, adunarea nu mai avea din nou apă. Dumnezeu i-a spus lui Moise să vorbească stâncii; Moise a strigat: „ascultați-mă cei neascultători, au din piatra aceasta voiu scoate vouă apă?”, a lovit-o de două ori și a ieșit apă din belșug. Dar Domnul a zis lui Moise și lui Aaron: „pentrucă n’ați crezut să mă sfințiți înaintea fiilor lui Israil, pentru aceea nu veți băgà voi adunarea aceasta în pământul care l-am dat lor”. „Aceasta este apa pricirii, că s’au certat fiii lui Israil înaintea Domnului, și el s’au sfințit întru dânșii.” Pentru aceasta a murit Aaron pe Muntele Hor, iar Moise pe Muntele Nebo, în afara țării. Textul lasă în seama cititorului care a fost exact vina lor, iar comentatorii se ceartă pe tema aceasta încă din Antichitate."
    - "Numele a devenit proverbial. Binecuvântarea lui Moise spune despre Levi: „pre care l-a ispitit la ispitire, și l-a batjocorit pre el la apa prigonirei”; în Psalmul 81 Dumnezeu spune că l-a încercat pe Israel la apele Meribei; Psalmul 95 avertizează să nu vă învârtoșați inima ca în întărâtare, unde Biblia sinodală are Meriba, iar Epistola către Evrei repetă avertismentul; Psalmul 106 amintește că l-au mâniat la apele certei, așa încât i-a mers rău lui Moise din pricina lor. Ezechiel face din apele certei din Cades, Meribat-Cades, un punct de pe hotarul sudic al țării restaurate, iar unii citesc același nume la începutul binecuvântării lui Moise, unde textul obișnuit are „cu zeci de mii de sfinți”."
    - "Astăzi niciun izvor nu se numește Meriba. Cades este plasat de obicei la izvoarele Ain el-Qudeirat și Ain Qedeis din nord-estul Sinaiului, iar apele Meribei sunt căutate acolo; Refidim, prima Meriba, este căutat în wadiurile din sudul Sinaiului, adesea la Wadi Feiran, dar niciunul dintre locuri nu este identificat cu certitudine."
  bg:
    - "Мерива, „препирня“ или „кавга“, е името, което Библията дава на две места, където Израил се препираше с Мойсей за вода, и на двете водата излезе от канара. Първото беше в Рефидим, на пътя към Синай: народът се караше с Мойсей, той удари канарата в Хорив по Божие слово и „нарече името на мястото Маса и Мерива“, Изпитание и Препирня, „защото изкусиха Господа и казваха: Да ли е между нас Господ, или не?“ Второто, почти четиридесет години по-късно, беше в Кадес в пустинята Цин и по-късните книги най-често имат предвид именно водите на Мерива в Кадес; записът тук е поставен в Кадес."
    - "В Кадес, където току-що беше умряла Мириам, обществото отново нямаше вода. Бог каза на Мойсей да говори на канарата; Мойсей извика: „чуйте сега, вие метежници; да ви извадим ли вода из тази канара?“, удари я два пъти и излезе изобилно вода. Но Господ каза на Мойсей и Аарон: „Понеже не ме повярвахте да ме осветите пред Израилевите синове, за това вие няма да възведете това събрание в земята която им давам.“ „Тая е водата на Мерива; защото Израилевите синове се препираха с Господа, и той се освети всред тях.“ Затова Аарон умря на планината Хор, а Мойсей — на Планината Нево, извън земята. В какво точно е била вината им, текстът оставя на читателя и тълкувателите спорят за това от древността."
    - "Името става нарицателно. Благословението на Мойсей казва за Леви: „Когото си изкусил в Маса, И с когото си се препирал при водите на Мерива“; в Псалом 81 Бог казва: „Изкусих те при водите на пререканието“; Псалом 95 предупреждава: „Не ожесточавайте сърдцето си както в Мерива“, както предава и Синодалната Библия, а Посланието към евреите повтаря предупреждението; Псалом 106 припомня, че „разяриха го въ водите на Мерива, И стана зле с Моисея поради тях“. Йезекиил прави „водата на Мерива Кадис“, Меривот-Кадес, точка на южната граница на възстановената земя, а някои четат същото име в началото на благословението на Мойсей, където King James Version има „десетки хиляди светии“."
    - "Днес никой извор не се нарича Мерива. Кадес обикновено се поставя при изворите Айн ел-Кудейрат и Айн Кедейс в североизточен Синай и водите на Мерива се търсят там; Рефидим, първата Мерива, се търси в уадитата на Южен Синай, често в Уади Фейран, но нито едно от двете места не е отъждествено със сигурност."
