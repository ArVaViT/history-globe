# Overview article (ADR 0007). Mainstream facts only; the two Meribahs are kept apart; the sites of Kadesh and Rephidim are given as usual but uncertain, without restating the Kadesh-barnea article.
id: meribah
place: a505743
title:
  en: "Meribah"
  ru: "Мерива"
body:
  en:
    - "Meribah, “strife” or “quarrel”, is the name the Bible gives to two places where Israel quarrelled with Moses over water, and at both the water came out of a rock. The first was at Rephidim, on the way to Sinai: the people chided Moses, he struck the rock in Horeb at God's word, and “he called the name of the place Massah, and Meribah”, Trial and Strife, “because they tempted the LORD, saying, Is the LORD among us, or not?” The second, nearly forty years later, was at Kadesh in the wilderness of Zin, and it is the waters of Meribah in Kadesh that the later books mostly mean; the record here stands at Kadesh."
    - "At Kadesh, where Miriam had just died, the congregation again had no water. God told Moses to speak to the rock; Moses cried, “Hear now, ye rebels; must we fetch you water out of this rock?”, struck it twice, and water came out abundantly. But the LORD said to Moses and Aaron, “Because ye believed me not, to sanctify me in the eyes of the children of Israel, therefore ye shall not bring this congregation into the land which I have given them.” “This is the water of Meribah; because the children of Israel strove with the LORD, and he was sanctified in them.” For this Aaron died on Mount Hor and Moses on Mount Nebo, outside the land. What exactly their fault was the text leaves to the reader, and commentators have argued it since antiquity."
    - "The name became a byword. Moses' blessing says of Levi, “whom thou didst prove at Massah, and with whom thou didst strive at the waters of Meribah”; in Psalm 81 God says, “I proved thee at the waters of Meribah”; Psalm 95 warns, “Harden not your heart, as in the provocation”, which the Synodal Bible renders “as in Meribah”, and Hebrews repeats the warning; Psalm 106 recalls that “they angered him also at the waters of strife, so that it went ill with Moses for their sakes”. Ezekiel makes “the waters of strife in Kadesh”, Meribath-kadesh, a point on the southern border of the restored land, and some read the same name in the opening of Moses' blessing, where the King James Version has “ten thousands of saints”."
    - "No spring is called Meribah today. Kadesh is usually placed at the springs of Ain el-Qudeirat and Ain Qedeis in north-eastern Sinai, and the waters of Meribah are sought there; Rephidim, the first Meribah, is sought in the wadis of southern Sinai, often at Wadi Feiran, but neither place is identified with certainty."
  ru:
    - "Мерива, «распря» или «ссора», — имя, которое Библия даёт двум местам, где Израиль ссорился с Моисеем из-за воды, и в обоих вода вышла из скалы. Первое было в Рефидиме, по дороге к Синаю: народ укорял Моисея, тот по слову Божию ударил в скалу в Хориве, «и нарек месту тому имя: Масса и Мерива», Искушение и Распря, «по причине укорения сынов Израилевых и потому, что они искушали Господа, говоря: есть ли Господь среди нас, или нет?» Второе, почти сорок лет спустя, было в Кадесе в пустыне Син, и именно воды Меривы при Кадесе чаще всего имеют в виду позднейшие книги; запись здесь стоит в Кадесе."
    - "В Кадесе, где только что умерла Мариам, у общества снова не было воды. Бог велел Моисею сказать скале; Моисей воскликнул: «послушайте, непокорные, разве нам из этой скалы извести для вас воду?», ударил в неё дважды, и потекло много воды. Но Господь сказал Моисею и Аарону: «за то, что вы не поверили Мне, чтоб явить святость Мою пред очами сынов Израилевых, не введете вы народа сего в землю, которую Я даю ему». «Это вода Меривы, у которой вошли в распрю сыны Израилевы с Господом, и Он явил им святость Свою». За это Аарон умер на горе Ор, а Моисей на горе Нево, вне земли. В чём именно состояла их вина, текст оставляет читателю, и толкователи спорят об этом с древности."
    - "Имя стало нарицательным. Благословение Моисея говорит о Левии: «которого Ты искусил в Массе, с которым Ты препирался при водах Меривы»; в 80-м псалме Бог говорит: «при водах Меривы испытал тебя»; 94-й псалом предостерегает: «не ожесточите сердца вашего, как в Мериве», и Послание к Евреям повторяет это предостережение; 105-й псалом вспоминает: «И прогневали Бога у вод Меривы, и Моисей потерпел за них». Иезекииль доводит южную границу восстановленной земли «до вод пререкания при Кадисе», до Мериват-Кадеса, а некоторые читают то же имя в начале благословения Моисея, где в Синодальном переводе стоит «со тьмами святых»."
    - "Источника по имени Мерива сегодня нет. Кадес обычно помещают у источников Айн-эль-Кудейрат и Айн-Кдейс на северо-востоке Синая, и там ищут воды Меривы; Рефидим, первую Мериву, ищут в вади южного Синая, чаще всего в Вади-Фейран, но ни одно из мест не отождествлено с уверенностью."
