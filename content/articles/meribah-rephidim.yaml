# Overview article (ADR 0007). Mainstream facts only; this record is the Meribah of Rephidim, kept apart from the Meribah of Kadesh, which has its own article; the site follows Rephidim's and is given as unlocated.
id: meribah-rephidim
place: a65db0f
title:
  en: "Meribah"
  ru: "Мерива"
  uk: "Мерива"
  es: "Meriba"
  pt: "Meribá"
  de: "Meriba"
  fr: "Meriba"
body:
  en:
    - "Meribah, “strife”, is the name Moses gave to the place at Rephidim where Israel, on the way from the Red Sea to Sinai, found no water and quarrelled with him: “And he called the name of the place Massah, and Meribah, because of the chiding of the children of Israel, and because they tempted the LORD, saying, Is the LORD among us, or not?” At God's word Moses went before the people with the elders and struck the rock in Horeb with his rod, and water came out of it. This is the first Meribah; the second, where Moses himself was condemned, lay at Kadesh nearly forty years later and has its own record. The two names, Massah and Meribah, Trial and Strife, describe one event, and the later books usually pair them."
    - "The blessing of Moses recalls that day for Levi, “whom thou didst prove at Massah, and with whom thou didst strive at the waters of Meribah”, and Psalm 95, in the Synodal Bible Psalm 94, turns it into a warning for every generation: “Harden not your heart, as in the provocation, and as in the day of temptation in the wilderness”, where the Hebrew has the names themselves, Meribah and Massah, as the Synodal text shows. The Epistle to the Hebrews quotes the psalm at length to its readers, and Paul, saying that the fathers “did all drink the same spiritual drink: for they drank of that spiritual Rock that followed them: and that Rock was Christ”, draws on the Jewish tradition that the rock of Rephidim went with Israel through the wilderness."
    - "Where it was depends on Rephidim, which is itself unlocated. With Sinai at Jebel Musa, the usual choices are the oasis of Wadi Feiran or a wadi nearer the mountain; Eusebius placed Rephidim beside Horeb, and the pilgrim of Piacenza in the sixth century was shown at Pharan the place where Moses prayed during the battle with Amalek, which followed the miracle of the water. A split boulder in Wadi el-Leja by the monastery of St Catherine has long been shown to pilgrims as the rock of Moses. None of this is confirmed by any find; the map keeps the camp beside its Rephidim in the south of the Sinai peninsula."
  ru:
    - "Мерива, «распря», — имя, которое Моисей дал месту в Рефидиме, где Израиль, идя от Чермного моря к Синаю, не нашёл воды и ссорился с ним: «И нарек месту тому имя: Масса и Мерива, по причине укорения сынов Израилевых и потому, что они искушали Господа, говоря: есть ли Господь среди нас, или нет?» По слову Божию Моисей пошёл перед народом со старейшинами и ударил жезлом в скалу в Хориве, и из неё пошла вода. Это первая Мерива; вторая, где был осуждён сам Моисей, лежала в Кадесе почти сорок лет спустя, и у неё своя запись. Два имени, Масса и Мерива, Искушение и Распря, описывают одно событие, и позднейшие книги обычно ставят их рядом."
    - "Благословение Моисея вспоминает тот день ради Левия, «которого Ты искусил в Массе, с которым Ты препирался при водах Меривы», а 95-й псалом, в Синодальной Библии 94-й, обращает его в предостережение всякому поколению: «не ожесточите сердца вашего, как в Мериве, как в день искушения в пустыне», — там, где в еврейском тексте стоят сами имена, Мерива и Масса. Послание к Евреям подробно приводит этот псалом своим читателям, а Павел, говоря, что отцы «пили одно и то же духовное питие: ибо пили из духовного последующего камня; камень же был Христос», опирается на иудейское предание о том, что скала Рефидима шла с Израилем по пустыне."
    - "Где это было, зависит от Рефидима, а он сам не найден. При Синае на Джебель-Муса обычно выбирают оазис Вади-Фейран или вади поближе к горе; Евсевий помещал Рефидим рядом с Хоривом, а паломнику из Пьяченцы в VI веке показывали в Фаране место, где Моисей молился во время битвы с Амаликом, последовавшей за чудом с водой. Расколотую глыбу в Вади-эль-Леджа у монастыря Святой Екатерины издавна показывают паломникам как скалу Моисея. Ничто из этого не подтверждено находками; на карте стан стоит рядом с отмеченным там Рефидимом на юге Синайского полуострова."
  uk:
    - "Мерива, «сварка», — ім’я, яке Мойсей дав місцю в Рефідімі, де Ізраїль на шляху від Червоного моря до Синаю не знайшов води й посварився з ним: «І проложив прізвище врочищу тому: Маса і Мерива задля сварки між синами Ізрайлевими і задля того, що спокушували Бога мовляючи: Чи Господь є між нами, чи нема?» За словом Бога Мойсей пішов перед народом зі старшими й ударив жезлом скелю в Хориві, і з неї потекла вода. Це перша Мерива; друга, де був засуджений сам Мойсей, лежала в Кадесі майже сорок років потому і має власний запис. Дві назви, Масса й Мерива, Випробування й Сварка, описують одну подію, і пізніші книги зазвичай їх парують."
    - "Благословення Мойсея згадує той день для Левія, «котрого ти спокушував в Массї, і заводив сварку при водах Мериви», а Псалом 95, у Синодальному — Псалом 94, обертає його на застереження для кожного покоління: «Та не стали тверді серцями, як в Мериві, як у день Масси в пустинї!», де староєврейський текст має самі назви, Мериву й Массу, як показує й Синодальний переклад. Послання до євреїв цитує псалом читачам докладно, а Павло, кажучи, що батьки «всї той самий напиток духовний пили; бо пили з духовної скелї, що йшла за ними, скеля ж була Христос», спирається на єврейську традицію, що скеля Рефідіму йшла з Ізраїлем крізь пустелю."
    - "Де це було, залежить від Рефідіму, який сам не встановлений. Якщо Синай — Джебель-Муса, звичайний вибір — оазис Ваді-Фейран або ваді ближче до гори; Євсевій розміщував Рефідім поруч із Хоривом, а піаченцький пілігрим у VI ст. бачив у Фарані місце, де Мойсей молився під час битви з Амаликом, що настала після дива з водою. Розколотий валун у Ваді-ель-Леджа біля монастиря святої Катерини давно показують прочанам як скелю Мойсея. Нічого з цього не підтверджує жодна знахідка; мапа тримає табір поруч з його Рефідімом на півдні Синайського півострова."
  es:
    - "Meriba, «querella», es el nombre que Moisés dio al lugar de Refidim donde Israel, de camino del mar Rojo al Sinaí, no halló agua y riñó con él: «Y llamó el nombre de aquel lugar Massah y Meribah, por la rencilla de los hijos de Israel, y porque tentaron á Jehová, diciendo: ¿Está, pues, Jehová entre nosotros, ó no?». Por palabra de Dios, Moisés pasó delante del pueblo con los ancianos y golpeó con su vara la roca en Horeb, y de ella salió agua. Esta es la primera Meriba; la segunda, donde el propio Moisés fue condenado, estuvo en Cades casi cuarenta años después y tiene su propio registro. Los dos nombres, Masá y Meriba, Prueba y Querella, describen un solo suceso, y los libros posteriores suelen emparejarlos."
    - "La bendición de Moisés recuerda aquel día para Leví, «al cual tentaste en Massa, y le hiciste reñir en las aguas de la rencilla», y el Salmo 95, Salmo 94 en la Biblia sinodal, lo convierte en una advertencia para cada generación: «No endurezcáis vuestro corazón como en Meriba, como el día de Masa en el desierto», donde el hebreo tiene los propios nombres, Meriba y Masá, como muestra el texto sinodal. La Epístola a los Hebreos cita el salmo extensamente a sus lectores, y Pablo, al decir que los padres «bebieron la misma bebida espiritual; porque bebían de la piedra espiritual que los seguía, y la piedra era Cristo», recurre a la tradición judía de que la roca de Refidim acompañó a Israel por el desierto."
    - "Dónde estaba depende de Refidim, que a su vez no está localizada. Con el Sinaí en el Yebel Musa, las opciones habituales son el oasis del Wadi Feirán o un uadi más cercano a la montaña; Eusebio situó Refidim junto a Horeb, y al peregrino de Piacenza, en el siglo VI, se le mostró en Farán el lugar donde Moisés oró durante la batalla con Amalec, que siguió al milagro del agua. Una roca partida en el Wadi el-Leja, junto al monasterio de Santa Catalina, se ha mostrado desde antiguo a los peregrinos como la roca de Moisés. Nada de esto está confirmado por hallazgo alguno; el mapa mantiene el campamento junto a su Refidim, en el sur de la península del Sinaí."
  pt:
    - "Meribá, “contenda”, é o nome que Moisés deu ao lugar em Refidim onde Israel, a caminho do Mar Vermelho ao Sinai, não achou água e brigou com ele: “Ele chamou o nome do lugar de Massá, e Meribá, porque os filhos de Israel contenderam, e porque puseram o SENHOR à prova, dizendo: ‘O SENHOR está entre nós, ou não?’” Por palavra de Deus, Moisés passou à frente do povo com os anciãos e feriu a rocha em Horebe com a vara, e dela saiu água. Esta é a primeira Meribá; a segunda, onde o próprio Moisés foi condenado, ficava em Cades quase quarenta anos depois e tem seu próprio registro. Os dois nomes, Massá e Meribá, Prova e Contenda, descrevem um só acontecimento, e os livros posteriores costumam emparelhá-los."
    - "A bênção de Moisés recorda aquele dia a respeito de Levi, “a quem você provou em Massá, com quem você contendeu nas águas de Meribá”, e o Salmo 95, na Bíblia Sinodal o Salmo 94, o converte em advertência para toda geração: “Não endureçam o seu coração, como em Meribá, como no dia de Massá no deserto”, onde o hebraico traz os próprios nomes, Meribá e Massá, como mostra o texto sinodal. A Carta aos Hebreus cita o salmo longamente a seus leitores, e Paulo, ao escrever que “todos beberam da mesma bebida espiritual. Pois bebiam de uma rocha espiritual que os seguia, e a rocha era Cristo”, apoia-se na tradição judaica de que a rocha de Refidim acompanhou Israel pelo deserto."
    - "Onde ficava depende de Refidim, que por sua vez não está localizada. Com o Sinai no Jebel Musa, as escolhas usuais são o oásis do Wadi Feiran ou um uádi mais perto da montanha; Eusébio situou Refidim junto a Horebe, e o peregrino de Piacenza, no século VI, viu em Farã o lugar onde Moisés orou durante a batalha com Amaleque, que se seguiu ao milagre da água. Um bloco rachado no Wadi el-Leja, junto ao mosteiro de Santa Catarina, é há muito mostrado aos peregrinos como a rocha de Moisés. Nada disso é confirmado por qualquer achado; o mapa mantém o acampamento junto a seu Refidim, no sul da península do Sinai."
  de:
    - "Meriba, „Streit“, ist der Name, den Mose dem Ort bei Refidim gab, wo Israel auf dem Weg vom Roten Meer zum Sinai kein Wasser fand und mit ihm haderte: „Da hieß man den Ort Massa und Meriba um des Zanks willen der Kinder Israel, und daß sie den HERRN versucht und gesagt hatten: Ist der HERR unter uns oder nicht?“ Auf Gottes Wort ging Mose mit den Ältesten vor das Volk und schlug mit seinem Stab den Fels am Horeb, und Wasser kam heraus. Dies ist das erste Meriba; das zweite, wo Mose selbst verurteilt wurde, lag fast vierzig Jahre später bei Kadesch und hat einen eigenen Eintrag. Die beiden Namen, Massa und Meriba, Prüfung und Streit, beschreiben ein Ereignis, und die späteren Bücher nennen sie meist zusammen."
    - "Der Segen des Mose erinnert für Levi an jenen Tag, „den du versucht hast zu Massa, da ihr hadertet am Haderwasser“, und Psalm 95, in der Synodalbibel Psalm 94, macht ihn zur Warnung für jede Generation: „so verstocket euer Herz nicht, wie zu Meriba geschah, wie zu Massa in der Wüste“, wo der hebräische Text die Namen selbst hat, Meriba und Massa, wie der Synodaltext zeigt. Der Hebräerbrief zitiert den Psalm ausführlich vor seinen Lesern, und Paulus, der sagt, die Väter hätten „alle einerlei geistlichen Trank getrunken; sie tranken aber vom geistlichen Fels, der mitfolgte, welcher war Christus“, greift auf die jüdische Überlieferung zurück, der Fels von Refidim sei mit Israel durch die Wüste gezogen."
    - "Wo es lag, hängt von Refidim ab, das selbst nicht lokalisiert ist. Mit dem Sinai am Jebel Musa sind die üblichen Wahlen die Oase des Wadi Feiran oder ein Wadi näher am Berg; Eusebius setzte Refidim neben den Horeb, und dem Pilger von Piacenza zeigte man im 6. Jahrhundert in Pharan die Stelle, wo Mose während der Schlacht gegen Amalek betete, die auf das Wunder des Wassers folgte. Ein gespaltener Felsblock im Wadi el-Leja beim Katharinenkloster wird Pilgern seit langem als der Fels des Mose gezeigt. Nichts davon ist durch einen Fund bestätigt; die Karte behält das Lager neben seinem Refidim im Süden der Sinai-Halbinsel."
  fr:
    - "Meriba, « querelle », est le nom que Moïse donna au lieu de Rephidim où Israël, en route de la mer Rouge au Sinaï, ne trouva pas d’eau et se querella avec lui : « Il donna à ce lieu le nom de Massa et Meriba, parce que les enfants d’Israël avaient contesté, et parce qu’ils avaient tenté l’Éternel, en disant : L’Éternel est-il au milieu de nous, ou n’y est-il pas ? » Sur la parole de Dieu, Moïse passa devant le peuple avec les anciens et frappa de sa verge le rocher d’Horeb, et l’eau en sortit. C’est la première Meriba ; la seconde, où Moïse lui-même fut condamné, se trouvait à Qadesh près de quarante ans plus tard et a sa propre fiche. Les deux noms, Massa et Meriba, Épreuve et Querelle, décrivent un seul événement, et les livres tardifs les associent d’ordinaire."
    - "La bénédiction de Moïse rappelle ce jour pour Lévi, « que tu as tenté à Massa, et avec qui tu as contesté aux eaux de Meriba », et le Psaume 95, le Psaume 94 dans la Bible synodale, en fait un avertissement pour chaque génération : « N’endurcissez pas votre cœur, comme à Meriba, comme à la journée de Massa, dans le désert », où l’hébreu a les noms eux-mêmes, Meriba et Massa, comme le montre le texte synodal. L’épître aux Hébreux cite longuement le psaume à ses lecteurs, et Paul, disant que les pères « ont tous bu le même breuvage spirituel, car ils buvaient à un rocher spirituel qui les suivait, et ce rocher était Christ », s’appuie sur la tradition juive selon laquelle le rocher de Rephidim accompagnait Israël à travers le désert."
    - "Où elle se trouvait dépend de Rephidim, qui n’est elle-même pas située. Avec le Sinaï au djebel Moussa, les choix habituels sont l’oasis de l’ouadi Feiran ou un ouadi plus proche de la montagne ; Eusèbe plaçait Rephidim à côté d’Horeb, et le pèlerin de Plaisance, au VIe siècle, se fit montrer à Pharan le lieu où Moïse pria pendant la bataille contre Amalek, qui suivit le miracle de l’eau. Un rocher fendu dans l’ouadi el-Leja, près du monastère Sainte-Catherine, est montré depuis longtemps aux pèlerins comme le rocher de Moïse. Rien de tout cela n’est confirmé par une trouvaille ; la carte garde le campement à côté de sa Rephidim, dans le sud de la péninsule du Sinaï."
