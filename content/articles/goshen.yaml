# Overview article (ADR 0007). Mainstream facts only; the extent of Goshen is given as the usual placing in the eastern Delta; the exodus is not dated here; the Goshen of Joshua is said to be another place.
id: goshen
place: a60f092
title:
  en: "Goshen"
  ru: "Гесем"
  uk: "Гошен"
  es: "Gosén"
  pt: "Gósen"
  de: "Goschen"
  fr: "Gosen"
  pl: "Goszen"
  it: "Gosen"
  nl: "Gosen"
  cs: "Gošen"
body:
  en:
    - "Goshen is the district of the eastern Nile Delta where Jacob's family settled, “the best of the land”, which Genesis also calls “the land of Rameses”. It was pasture country on the edge of Egypt, near enough to the court for Joseph to drive out in his chariot to meet his father, and apart enough for shepherds, “for every shepherd is an abomination unto the Egyptians”. The Septuagint renders it “Gesem of Arabia”, after the Arabian nome of the eastern Delta whose capital was Phakoussa, the modern Faqus, and most scholars place Goshen between Faqus and the Wadi Tumilat, the valley that leads east from the Delta towards the Bitter Lakes. Édouard Naville, who dug at Saft el-Henneh in 1885, held that the Egyptian name of its district lay behind the Septuagint's Gesem. The Goshen of Joshua's conquest is a different place in the hills of Judah."
    - "Joseph sent word to his father, “thou shalt dwell in the land of Goshen, and thou shalt be near unto me”; Jacob sent Judah ahead “to direct his face unto Goshen”, and there Joseph “fell on his neck, and wept on his neck a good while”. Pharaoh gave leave: “in the land of Goshen let them dwell”, and Israel “grew, and multiplied exceedingly” there. When the brothers went up to bury Jacob they left their little ones and flocks in Goshen. In the plagues God set the land apart: “I will sever in that day the land of Goshen, in which my people dwell, that no swarms of flies shall be there”, and “only in the land of Goshen, where the children of Israel were, was there no hail”. The exodus itself set out “from Rameses to Succoth”."
    - "Excavation has filled in the region. Tell el-Dab'a, near Faqus, is Avaris, the capital of the Hyksos, where Manfred Bietak's work since 1966 has uncovered a large town of settlers from Canaan in the Middle Bronze Age; Qantir beside it is Pi-Ramesses, the Delta residence of Rameses II; and Tell er-Retabah and Tell el-Maskhuta in the Wadi Tumilat are the candidates for Pithom. These show Semitic herdsmen and labourers living in the very district Genesis names, though no Egyptian text names Israel in Goshen."
    - "Today the region lies in the Sharqia governorate of Egypt, dense farmland between Zagazig and Faqus, cut by the Ismailia canal that follows the Wadi Tumilat east to Ismailia. The mounds of Tell el-Dab'a and Qantir lie among the fields, and statues and obelisks of Pi-Ramesses were carried off to be reused at Tanis."
  ru:
    - "Гесем — область восточной дельты Нила, где поселилась семья Иакова, «в лучшей части земли», как говорит Бытие, помещая их «в земле Раамсес». Это была пастушья страна на краю Египта: достаточно близкая ко двору, чтобы Иосиф выехал на колеснице встретить отца, и достаточно обособленная для пастухов, «ибо мерзость для Египтян всякий пастух овец». Септуагинта передаёт её как «Гесем Аравийский», по Аравийскому ному восточной Дельты со столицей Факусса, нынешним Факусом, и большинство учёных помещает Гесем между Факусом и Вади-Тумилат, долиной, ведущей из Дельты на восток к Горьким озёрам. Эдуар Навиль, копавший в Сафт-эль-Хенне в 1885 году, считал, что за Гесемом Септуагинты стоит египетское имя этого округа. Гошен из завоеваний Иисуса Навина — другое место, в горах Иудеи."
    - "Иосиф велел передать отцу: «ты будешь жить в земле Гесем; и будешь близ меня»; Иаков послал вперёд Иуду, «чтобы он указал путь в Гесем», и там Иосиф «пал на шею его, и долго плакал на шее его». Фараон дозволил: «пусть живут они в земле Гесем», и Израиль там «плодились, и весьма умножились». Отправляясь хоронить Иакова, братья оставили в Гесеме детей и скот. В казнях Бог отделил эту землю: «отделю в тот день землю Гесем, на которой пребывает народ Мой, и там не будет песьих мух», и «только в земле Гесем, где жили сыны Израилевы, не было града». Сам исход начался «из Раамсеса в Сокхоф»."
    - "Раскопки наполнили эту область содержанием. Телль-эд-Даба близ Факуса — это Аварис, столица гиксосов, где работы Манфреда Битака с 1966 года открыли большой город переселенцев из Ханаана эпохи средней бронзы; Кантир рядом — Пер-Рамсес, дельтовая резиденция Рамсеса II; а Телль-эр-Ретаба и Телль-эль-Масхута в Вади-Тумилат — кандидаты на Пифом. Всё это показывает семитских пастухов и работников в той самой области, которую называет Бытие, хотя ни один египетский текст не упоминает Израиль в Гесеме."
    - "Сегодня эта область лежит в провинции Шаркия в Египте, густо возделанной земле между Загазигом и Факусом, прорезанной Исмаилийским каналом, который идёт по Вади-Тумилат на восток к Исмаилии. Холмы Телль-эд-Даба и Кантира лежат среди полей, а статуи и обелиски Пер-Рамсеса были увезены и заново использованы в Танисе."
  uk:
    - "Гошен — область східної частини дельти Нілу, де оселилася родина Якова, «на щонайлуччій землї», яку Книга Буття також називає «в Раємзес землї». Це був пасовищний край на межі Єгипту, досить близький до двору, щоб Йосип міг виїхати на колісниці назустріч батькові, і досить осібний для пастухів, бо «Чабанами ж бо гидують Египтяне». Септуагінта передає назву як «Гесем Аравійський» — за Аравійським номом східної дельти, столицею якого була Факусса, нинішній Факус, і більшість дослідників розміщують Гошен між Факусом і Ваді-Тумілат, долиною, що веде на схід від дельти до Гірких озер. Едуар Навіль, який розкопував Сафт-ель-Хенне 1885 року, вважав, що за Гесем Септуагінти стоїть єгипетська назва її округи. Гошен із завоювання Ісуса Навина — інше місце в горах Юди."
    - "Йосип переказав батькові: «І осядешся в Гозен землї, і будеш поблизу в мене»; Яків послав Юду вперед «направляти лице його до Госену», і там Йосип «впав йому на шию, і плакався плачем великим». Фараон дозволив: «Нехай селяться в Госен землї», і Ізраїль там «були плодющі й намножувались велико». Коли брати пішли ховати Якова, вони залишили дітей і отари в Гошені. Під час єгипетських кар Бог відділив цю землю: «І відріжню того дня Гозен землю, що на їй осїлись люде мої тим, що не буде там песячих мух», і «Тільки в Гозен землї, де були сини Ізрайлеві, не було гряду». Сам вихід вирушив «од Рамсесу до Сухоту»."
    - "Розкопки заповнили картину краю. Телль-ед-Даба поблизу Факуса — це Аварис, столиця гіксосів, де праця Манфреда Бітака від 1966 року відкрила велике місто поселенців із Ханаану доби середньої бронзи; сусідній Кантір — це Пі-Рамсес, дельтова резиденція Рамсеса II; а Телль-ер-Ретаба й Телль-ель-Мескхута у Ваді-Тумілат — кандидати на Пітом. Вони показують семітських пастухів і робітників, що жили в самій окрузі, яку називає Книга Буття, хоча жоден єгипетський текст не згадує Ізраїль у Гошені."
    - "Сьогодні ця місцевість лежить у губернаторстві Шаркія в Єгипті — це щільні землі між Загазігом і Факусом, перетяті каналом Ісмаїлія, який іде вздовж Ваді-Тумілат на схід до Ісмаїлії. Городища Телль-ед-Даба й Кантір лежать серед полів, а статуї й обеліски Пі-Рамсеса було вивезено для повторного використання в Танісі."
  es:
    - "Gosén es el distrito del este del delta del Nilo donde se estableció la familia de Jacob, «lo mejor de la tierra», que el Génesis llama también «la tierra de Rameses». Era un país de pastos en el borde de Egipto, bastante cerca de la corte para que José fuera en su carro a recibir a su padre, y bastante apartado para los pastores, «porque los Egipcios abominan todo pastor de ovejas». La Septuaginta lo traduce «Gesem de Arabia», por el nomo arábigo del delta oriental cuya capital era Fakusa, la actual Faqus, y la mayoría de los estudiosos sitúan Gosén entre Faqus y el Wadi Tumilat, el valle que va hacia el este desde el delta en dirección a los Lagos Amargos. Édouard Naville, que excavó en Saft el-Henneh en 1885, sostuvo que el nombre egipcio de su distrito estaba detrás del Gesem de la Septuaginta. El Gosén de la conquista de Josué es un lugar distinto, en las colinas de Judá."
    - "José mandó decir a su padre: «Y habitarás en la tierra de Gosén, y estarás cerca de mí»; Jacob envió a Judá delante «para que le viniese á ver á Gosén», y allí José «echóse sobre su cuello, y lloró sobre su cuello bastante». El faraón dio permiso: «habiten en la tierra de Gosén», e Israel allí «se aumentaron, y multiplicaron en gran manera». Cuando los hermanos subieron a sepultar a Jacob, dejaron en Gosén a sus niños y sus rebaños. En las plagas Dios apartó la tierra: «yo apartaré la tierra de Gosén, en la cual mi pueblo habita, para que ninguna suerte de moscas haya en ella», y «Solamente en la tierra de Gosén, donde los hijos de Israel estaban, no hubo granizo». El propio éxodo partió «de Rameses á Succoth»."
    - "La excavación ha rellenado la región. Tell el-Dab'a, cerca de Faqus, es Avaris, la capital de los hicsos, donde los trabajos de Manfred Bietak desde 1966 han sacado a la luz una gran ciudad de colonos de Canaán en la Edad del Bronce Medio; Qantir, a su lado, es Pi-Ramsés, la residencia de Ramsés II en el delta; y Tell er-Retabah y Tell el-Maskhuta, en el Wadi Tumilat, son los candidatos para Pitón. Estos muestran a pastores y trabajadores semitas viviendo en el mismísimo distrito que nombra el Génesis, aunque ningún texto egipcio nombra a Israel en Gosén."
    - "Hoy la región se halla en la gobernación de Sharqia, en Egipto, densa tierra de cultivo entre Zagazig y Faqus, cortada por el canal de Ismailía, que sigue el Wadi Tumilat hacia el este hasta Ismailía. Los montículos de Tell el-Dab'a y Qantir se hallan entre los campos, y estatuas y obeliscos de Pi-Ramsés fueron llevados para reutilizarlos en Tanis."
  pt:
    - "Gósen é o distrito do leste do delta do Nilo onde a família de Jacó se estabeleceu, “no melhor da terra”, que Gênesis chama também de “terra de Ramessés”. Era região de pastagem na orla do Egito, perto o bastante da corte para que José fosse de carruagem ao encontro de seu pai, e afastada o bastante para os pastores, pois “todo pastor de ovelhas é abominação para os egípcios”. A Septuaginta a traduz “Gesém da Arábia”, segundo o nomo árabe do delta oriental cuja capital era Facusa, a moderna Faqus, e a maioria dos estudiosos situa Gósen entre Faqus e o uádi Tumilat, o vale que leva do delta para o leste, em direção aos Lagos Amargos. Édouard Naville, que escavou em Saft el-Henneh em 1885, sustentou que o nome egípcio de seu distrito estava por trás do Gesém da Septuaginta. A Gósen da conquista de Josué é outro lugar, nas colinas de Judá."
    - "José mandou dizer a seu pai: “Você habitará na terra de Gósen e estará perto de mim”; Jacó enviou Judá adiante “para mostrar o caminho à sua frente até Gósen”, e ali José “lançou-se ao seu pescoço e chorou em seu pescoço por um bom tempo”. O Faraó deu licença: “Deixe-os habitar na terra de Gósen”, e Israel ali “foram frutíferos e se multiplicaram grandemente”. Quando os irmãos subiram para sepultar Jacó, deixaram em Gósen as crianças e os rebanhos. Nas pragas Deus separou a terra: “separarei a terra de Gósen, onde habita o meu povo, para que não haja enxames de moscas ali”, e “Somente na terra de Gósen, onde estavam os filhos de Israel, não houve granizo”. O próprio êxodo partiu “de Ramessés a Sucote”."
    - "A escavação preencheu a região. Tell el-Dab’a, perto de Faqus, é Avaris, a capital dos hicsos, onde o trabalho de Manfred Bietak desde 1966 trouxe à luz uma grande cidade de colonos de Canaã no Bronze Médio; Qantir, ao lado, é Pi-Ramessés, a residência de Ramessés II no delta; e Tell er-Retabah e Tell el-Maskhuta, no uádi Tumilat, são os candidatos a Pitom. Estes mostram pastores e trabalhadores semitas vivendo no próprio distrito que Gênesis nomeia, embora nenhum texto egípcio nomeie Israel em Gósen."
    - "Hoje a região fica na província de Sharqia, no Egito, terra agrícola densa entre Zagazig e Faqus, cortada pelo canal de Ismaília que segue o uádi Tumilat para o leste até Ismaília. Os montes de Tell el-Dab’a e Qantir ficam entre os campos, e estátuas e obeliscos de Pi-Ramessés foram levados para serem reutilizados em Tânis."
  de:
    - "Goschen ist der Bezirk im östlichen Nildelta, in dem sich Jakobs Familie niederließ, „am besten Ort des Landes“, den das erste Buch Mose auch das Land Raemses nennt. Es war Weideland am Rand Ägyptens, nahe genug am Hof, dass Josef im Wagen hinausfahren konnte, um seinen Vater zu treffen, und abgelegen genug für Hirten, denn „was Viehhirten sind, das ist den Ägyptern ein Greuel“. Die Septuaginta gibt es als „Gesem Arabiens“ wieder, nach dem arabischen Gau des östlichen Deltas mit der Hauptstadt Phakusa, dem heutigen Faqus, und die meisten Forscher setzen Goschen zwischen Faqus und dem Wadi Tumilat an, dem Tal, das vom Delta ostwärts zu den Bitterseen führt. Édouard Naville, der 1885 in Saft el-Henneh grub, hielt den ägyptischen Namen seines Gaus für den Hintergrund des Gesem der Septuaginta. Das Goschen der Eroberung Josuas ist ein anderer Ort im Bergland Judas."
    - "Josef ließ seinem Vater sagen: „du sollst im Lande Gosen wohnen und nahe bei mir sein“; Jakob sandte Juda voraus zu Josef, damit dieser ihn nach Gosen weise, und dort „fiel er ihm um den Hals und weinte lange an seinem Halse“. Pharao gab die Erlaubnis: „laß sie im Lande Gosen wohnen“, und Israel wohnte dort; sie „hatten's inne und wuchsen und mehrten sich sehr“. Als die Brüder hinaufzogen, um Jakob zu begraben, ließen sie ihre Kinder und Herden in Goschen. In den Plagen sonderte Gott das Land aus: „Ich will des Tages ein Besonderes tun mit dem Lande Gosen, da sich mein Volk aufhält, daß kein Ungeziefer da sei“, und „allein im Lande Gosen, da die Kinder Israel wohnten, da hagelte es nicht“. Der Auszug selbst brach „von Raemses gen Sukkoth“ auf."
    - "Die Ausgrabungen haben die Gegend gefüllt. Tell el-Dab'a bei Faqus ist Avaris, die Hauptstadt der Hyksos, wo Manfred Bietaks Arbeit seit 1966 eine große Stadt von Siedlern aus Kanaan in der Mittelbronzezeit freigelegt hat; das benachbarte Qantir ist Pi-Ramses, die Deltaresidenz Ramses' II.; und Tell er-Retabah und Tell el-Maskhuta im Wadi Tumilat sind die Kandidaten für Pitom. Sie zeigen semitische Hirten und Arbeiter in eben dem Bezirk, den das erste Buch Mose nennt, auch wenn kein ägyptischer Text Israel in Goschen nennt."
    - "Heute liegt die Gegend im ägyptischen Gouvernement Scharkija, dichtem Ackerland zwischen Zagazig und Faqus, vom Ismailia-Kanal durchschnitten, der dem Wadi Tumilat ostwärts bis Ismailia folgt. Die Hügel von Tell el-Dab'a und Qantir liegen zwischen den Feldern, und Statuen und Obelisken von Pi-Ramses wurden zur Wiederverwendung nach Tanis verschleppt."
  fr:
    - "Gosen est le district de l’est du delta du Nil où s’établit la famille de Jacob, « la meilleure partie du pays », que la Genèse appelle aussi « la contrée de Ramsès ». C’était un pays de pâturages en bordure de l’Égypte, assez proche de la cour pour que Joseph y vienne en char à la rencontre de son père, et assez à l’écart pour des bergers, « car tous les bergers sont en abomination aux Égyptiens ». La Septante le rend par « Gesem d’Arabie », d’après le nome arabique du delta oriental, de capitale Phakoussa (l’actuelle Faqus), et la plupart des spécialistes placent Gosen entre Faqus et l’ouadi Toumilat, la vallée qui mène du delta vers les lacs Amers. Édouard Naville, qui fouilla à Saft el-Henneh en 1885, y voyait le nom égyptien de son district derrière le Gesem de la Septante. Le Gosen de la conquête de Josué est un autre lieu, dans les collines de Juda."
    - "Joseph fit dire à son père : « Tu habiteras dans le pays de Gosen, et tu seras près de moi » ; Jacob envoya Juda devant lui « pour l’informer qu’il se rendait en Gosen », et là Joseph « se jeta à son cou, et pleura longtemps sur son cou ». Pharaon donna son accord : « Qu’ils habitent dans le pays de Gosen », et Israël y eut « des possessions, ils furent féconds et multiplièrent beaucoup ». Quand les frères montèrent ensevelir Jacob, ils laissèrent leurs enfants et leurs troupeaux en Gosen. Dans les plaies, Dieu mit le pays à part : « je distinguerai le pays de Gosen où habite mon peuple, et là il n’y aura point de mouches », et « ce fut seulement dans le pays de Gosen, où étaient les enfants d’Israël, qu’il n’y eut point de grêle ». L’exode lui-même se mit en route : les enfants d’Israël « partirent de Ramsès pour Succoth »."
    - "Les fouilles ont comblé la région. Tell el-Dab’a, près de Faqus, est Avaris, la capitale des Hyksôs, où les travaux de Manfred Bietak depuis 1966 ont mis au jour une grande ville de colons venus de Canaan au Bronze moyen ; Qantir, à côté, est Pi-Ramsès, la résidence deltaïque de Ramsès II ; et Tell er-Retabah et Tell el-Maskhuta, dans l’ouadi Toumilat, sont les candidats pour Pithom. Ils montrent des bergers et des ouvriers sémites vivant dans le district même que nomme la Genèse, bien qu’aucun texte égyptien ne nomme Israël en Gosen."
    - "Aujourd’hui, la région se trouve dans le gouvernorat de Charkia, en Égypte, dense région agricole entre Zagazig et Faqus, coupée par le canal d’Ismaïlia qui suit l’ouadi Toumilat vers l’est jusqu’à Ismaïlia. Les tertres de Tell el-Dab’a et de Qantir se trouvent parmi les champs, et statues et obélisques de Pi-Ramsès furent emportés pour être réemployés à Tanis."
  pl:
    - "Goszen to okręg wschodniej Delty Nilu, gdzie osiedliła się rodzina Jakuba, „w najlepszem miejscu tej ziemi”, który Księga Rodzaju umieszcza też „w ziemi Rameses”. Był to kraj pastwisk na skraju Egiptu, dość blisko dworu, by Józef mógł wyjechać wozem na spotkanie z ojcem, i dość na uboczu dla pasterzy, „bo obrzydłością Egipczanom jest wszelki pasterz bydła”. Septuaginta oddaje go jako „Gesem Arabii”, od arabskiego nomu wschodniej Delty, którego stolicą była Fakussa, dzisiejszy Fakus, i większość uczonych umieszcza Goszen między Fakus a Wadi Tumilat, doliną prowadzącą na wschód od Delty ku Jeziorom Gorzkim. Édouard Naville, który prowadził wykopaliska w Saft el-Henna w 1885 r., twierdził, że za Gesem Septuaginty stoi egipska nazwa tego okręgu. Goszen z podboju Jozuego to inne miejsce w górach Judy."
    - "Józef kazał powiedzieć ojcu: „I będziesz mieszkał w ziemi Gosen; a będziesz blisko mnie”; Jakub posłał przed sobą Judę do Józefa, aby oznajmił o jego przybyciu do Gosen, a tam Józef „padł na szyję jego, i płakał na szyi jego chwilę”. Faraon udzielił zezwolenia: „niech mieszkają w ziemi Gosen”, a Izraelici „rozrodzili się, i rozmnożyli się wielce” tam. Gdy bracia poszli pochować Jakuba, zostawili swoje dzieci i trzody w Goszen. W plagach Bóg oddzielił tę ziemię: „A oddzielę dnia onego ziemię Gosen, w której lud mój mieszka, aby tam nie było rozmaitego robactwa”, i „Tylko w ziemi Gosen, gdzie synowie Izraelscy mieszkali, nie było gradu”. Sam exodus wyruszył „z Rameses do Suchotu”."
    - "Wykopaliska wypełniły obraz regionu. Tell el-Dab'a koło Fakus to Awaris, stolica Hyksosów, gdzie prace Manfreda Bietaka od 1966 r. odsłoniły wielkie miasto osadników z Kanaanu w środkowej epoce brązu; sąsiedni Kantir to Pi-Ramses, rezydencja Ramzesa II w Delcie; a Tell er-Retabah i Tell el-Maskhuta w Wadi Tumilat są kandydatami na Pitom. Ukazują one semickich pasterzy i robotników mieszkających w samym okręgu, który wymienia Księga Rodzaju, choć żaden egipski tekst nie wymienia Izraela w Goszen."
    - "Dziś ten obszar leży w muhafazie Szarkija w Egipcie; to gęsto uprawiane pola między Zakazikiem a Fakus, przecięte kanałem Ismailijskim, który biegnie wzdłuż Wadi Tumilat na wschód do Ismailii. Pagórki Tell el-Dab'a i Kantir leżą wśród pól, a posągi i obeliski Pi-Ramses zabrano do ponownego użycia w Tanis."
  it:
    - "Gosen è il distretto del Delta orientale del Nilo dove si stabilì la famiglia di Giacobbe, «nella parte migliore del paese», che la Genesi chiama anche «nella contrada di Ramses». Era una terra di pascolo ai margini dell’Egitto, abbastanza vicina alla corte perché Giuseppe potesse andare in carro incontro al padre, e abbastanza discosta per i pastori, «poiché gli Egiziani hanno in abominio tutti i pastori». La Settanta la rende «Gesem d’Arabia», dal nomo arabico del Delta orientale la cui capitale era Fakusa, l’attuale Faqus, e la maggior parte degli studiosi colloca Gosen fra Faqus e il Wadi Tumilat, la valle che dal Delta va a est verso i Laghi Amari. Édouard Naville, che scavò a Saft el-Henneh nel 1885, riteneva che il nome egizio del suo distretto stesse dietro il Gesem della Settanta. La Gosen della conquista di Giosuè è un luogo diverso, sui monti di Giuda."
    - "Giuseppe mandò a dire al padre: «tu dimorerai nel paese di Goscen, e sarai vicino a me»; Giacobbe mandò avanti Giuda «perché questi lo introducesse nel paese di Goscen», e là Giuseppe «gli si gettò al collo, e pianse lungamente sul collo di lui». Il faraone diede il permesso: «dimorino pure nel paese di Goscen», e Israele vi «s’accrebbero, e moltiplicarono oltremodo». Quando i fratelli salirono a seppellire Giacobbe, lasciarono in Gosen i bambini e i greggi. Nelle piaghe Dio mise da parte il paese: «in quel giorno io farò eccezione del paese di Goscen, dove abita il mio popolo; e quivi non ci saranno mosche», e «solamente nel paese di Goscen, dov’erano i figliuoli d’Israele, non cadde grandine». L’esodo stesso si avviò «da Ramses per Succoth»."
    - "Gli scavi hanno riempito il quadro della regione. Tell el-Dab’a, presso Faqus, è Avaris, la capitale degli Hyksos, dove i lavori di Manfred Bietak dal 1966 hanno portato alla luce una grande città di coloni provenienti da Canaan nel Bronzo Medio; Qantir, accanto, è Pi-Ramses, la residenza deltizia di Ramses II; e Tell er-Retabah e Tell el-Maskhuta nel Wadi Tumilat sono i candidati per Pitom. Questi mostrano pastori e lavoratori semiti che vivevano nel distretto stesso nominato dalla Genesi, benché nessun testo egizio nomini Israele in Gosen."
    - "Oggi la regione si trova nel governatorato egiziano di Sharqia, una fitta campagna coltivata fra Zagazig e Faqus, attraversata dal canale di Ismailia che segue il Wadi Tumilat verso est fino a Ismailia. I tell di Tell el-Dab’a e Qantir giacciono fra i campi, e statue e obelischi di Pi-Ramses furono portati via per essere riutilizzati a Tanis."
  nl:
    - "Gosen is het district in de oostelijke Nijldelta waar Jakobs familie zich vestigde, “het beste van het land”, dat Genesis ook “het land Rameses” noemt. Het was weideland aan de rand van Egypte, dicht genoeg bij het hof om Jozef met zijn wagen zijn vader tegemoet te laten rijden, en afgelegen genoeg voor herders, “want alle schaapherder is den Egyptenaren een gruwel”. De Septuaginta geeft het weer als “Gesem van Arabië”, naar de Arabische nomos van de oostelijke Delta met als hoofdstad Fakoessa, het huidige Faqus, en de meeste geleerden plaatsen Gosen tussen Faqus en de Wadi Tumilat, het dal dat vanuit de Delta oostwaarts naar de Bittermeren leidt. Édouard Naville, die in 1885 te Saft el-Henneh groef, meende dat de Egyptische naam van zijn district achter de Gesem van de Septuaginta lag. Het Gosen van Jozua’s verovering is een andere plaats in het bergland van Juda."
    - "Jozef liet zijn vader weten: “gij zult in het land Gosen wonen, en nabij mij wezen”; Jakob zond Juda vooruit “om voor zijn aangezicht aanwijzing te doen naar Gosen”, en daar, toen Jozef zich aan hem vertoonde, “viel hij hem aan zijn hals, en weende lang aan zijn hals”. Farao gaf toestemming: “laat hen in het land Gosen wonen”, en Israël woonde er en “zij werden vruchtbaar en vermeerderden zeer”. Toen de broers Jakob gingen begraven, lieten zij hun kleine kinderen en kudden in Gosen achter. Bij de plagen zonderde God het land af: “Ik zal te dien dage het land Gosen, waarin Mijn volk woont, afzonderen, dat daar geen vermenging van ongedierte zij”, en “alleen in het land Gosen, waar de kinderen Israels waren, daar was geen hagel”. De uittocht zelf begon “van Rameses naar Sukkoth”."
    - "Opgravingen hebben het gebied ingevuld. Tell el-Dab’a, bij Faqus, is Avaris, de hoofdstad van de Hyksos, waar het werk van Manfred Bietak sinds 1966 een grote stad van kolonisten uit Kanaän uit de Midden-Bronstijd blootlegde; Qantir ernaast is Pi-Ramses, de Delta-residentie van Ramses II; en Tell er-Retabah en Tell el-Maskhuta in de Wadi Tumilat zijn de kandidaten voor Pitom. Zij tonen Semitische herders en arbeiders in het district dat Genesis noemt, al noemt geen Egyptische tekst Israël in Gosen."
    - "Nu ligt de streek in het gouvernement Sharqia in Egypte, dicht bebouwd akkerland tussen Zagazig en Faqus, doorsneden door het Ismailiakanaal dat de Wadi Tumilat oostwaarts volgt naar Ismailia. De heuvels van Tell el-Dab’a en Qantir liggen tussen de akkers, en beelden en obelisken van Pi-Ramses werden weggevoerd om bij Tanis opnieuw te worden gebruikt."
  cs:
    - "Gošen je okres východní nilské delty, kde se usadila Jákobova rodina, „v nejlepším kraji země této“, který Genesis nazývá také „v zemi Ramesses“. Byl to pastevní kraj na okraji Egypta, dost blízko dvoru, aby mu Josef mohl vyjet na voze vstříc otci, a dost stranou pro pastýře, „nebo v mrzkosti mají Egyptští všecky pastýře stáda“. Septuaginta jej vykládá jako „Gesem Arabie“, podle arabského nomu východní delty, jehož hlavním městem byla Phakoussa, dnešní Faqus, a většina učenců klade Gošen mezi Faqus a Wádí Tumilát, údolí vedoucí z delty na východ k Hořkým jezerům. Édouard Naville, který kopal v Saft el-Henneh roku 1885, soudil, že za Gesem Septuaginty stojí egyptské jméno jeho okresu. Gošen Jozuova dobývání je jiné místo v judských horách."
    - "Josef vzkázal otci: „A bydliti budeš v zemi Gesen; a budeš blízko mne“; Jákob poslal Judu napřed, „aby oznámil jemu prvé, než přišel do Gesen“, a tam Josef „padl na jeho šíji, a plakal dlouho na šíji jeho“. Faraon dal svolení: „nechť bydlí v zemi Gesen“, a o Izraeli se tam praví: „a rozplodili se, a rozmnoženi jsou velmi“. Když bratři šli pohřbít Jákoba, nechali v Gošenu své děti a stáda. V ranách Bůh zemi oddělil: „Oddělím v ten den zemi Gesen, v níž lid můj zůstává, aby tam nebylo směsice té“, a „Toliko v zemi Gesen, v níž byli synové Izraelští, nebylo krupobití“. Sám exodus vyšel „z Ramesses k Sochot“."
    - "Vykopávky oblast doplnily. Tell el-Dab'a u Faqusu je Avaris, hlavní město Hyksósů, kde práce Manfreda Bietaka od roku 1966 odkryla velké město osadníků z Kanaánu ve střední době bronzové; Qantir vedle je Pi-Ramesse, delta-sídlo Ramesse II.; a Tell er-Retabah a Tell el-Maskhuta ve Wádí Tumilát jsou kandidáty na Pitom. Ukazují semitské pastevce a dělníky žijící právě v okrese, který Genesis jmenuje, ačkoli žádný egyptský text nejmenuje Izrael v Gošenu."
    - "Dnes tento kraj leží v egyptské gubernii Šarkíja, hustě osídlené zemědělské půdě mezi Zagazigem a Faqusem, protínané kanálem Ismáílíja, který sleduje Wádí Tumilát na východ k Ismáílíji. Pahorky Tell el-Dab'a a Qantir leží mezi poli a sochy a obelisky Pi-Ramesse byly odvezeny a znovu použity v Tanidě."
