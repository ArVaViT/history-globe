body:
  en:
    - "Puteoli, today's Pozzuoli, lies on the Bay of Naples in Campania, in the volcanic country of hot springs and sulphur west of Naples. It began as the Greek town of Dicaearchia: Strabo calls it the port of Cumae, while Eusebius and Stephanus of Byzantium say settlers from Samos founded it in the later sixth century BC. Strabo derives the Latin name Puteoli from its wells, or from the smell of its waters. In 215 BC the Romans fortified and garrisoned it against Hannibal, and in 194 BC they settled a colony of Roman citizens there."
    - "Its harbour, built with the local volcanic sand that sets hard even under water, made Puteoli the chief port of Rome in the late Republic and early Empire. Grain ships from Alexandria unloaded here, and Seneca describes the crowds on the mole watching for the first of them. Merchants from the East settled in the town, among them Jews: Josephus tells how the impostor who passed himself off as Herod's son Alexander was received by the Jews of Dicaearchia. Caligula bridged the bay from Baiae to the mole of Puteoli with a double line of ships."
    - 'Paul, a prisoner bound for Rome, came here from Rhegium in an Alexandrian ship: "we came the next day to Puteoli: Where we found brethren, and were desired to tarry with them seven days". From there he went on by road toward Rome, and brethren came out to meet him as far as Appii Forum and the Three Taverns. A few years later Josephus, after a shipwreck in the Adriatic Sea, also landed at Puteoli; there he met a Jewish actor favoured by Nero, through whom he reached the empress Poppaea.'
    - "In AD 60 Nero gave the old town the rights and title of a colony. Under the Flavian emperors it built a great amphitheatre, and the ruins of its market hall, long misnamed the Temple of Serapis, still stand. Hadrian, who died at nearby Baiae in 138, was first buried at Puteoli on an estate that had once belonged to Cicero. After Claudius built a harbour at Ostia, later enlarged by Trajan, much of the trade of Rome moved there, and Puteoli slowly lost its place, though it remained a town of some note into late antiquity."
  ru:
    - "Путеол, ныне Поццуоли, лежит на берегу Неаполитанского залива в Кампании, в вулканическом краю горячих источников и серы к западу от Неаполя. Он возник как греческий город Дикеархия: Страбон называет его гаванью Кум, а Евсевий и Стефан Византийский пишут, что его основали переселенцы с Самоса во второй половине VI века до н. э. Латинское имя Путеолы Страбон выводит от здешних колодцев или от запаха здешних вод. В 215 г. до н. э. римляне укрепили город и поставили в нём гарнизон против Ганнибала, а в 194 г. до н. э. вывели сюда колонию римских граждан."
    - "Гавань, построенная из местного вулканического песка, который твердеет даже под водой, сделала Путеол главным портом Рима в конце Республики и в начале Империи. Сюда приходили корабли с зерном из Александрии, и Сенека описывает толпы на моле, высматривающие первые из них. В городе селились купцы с Востока, среди них иудеи: Иосиф Флавий рассказывает, как самозванца, выдававшего себя за Александра, сына Ирода, принимали иудеи Дикеархии. Калигула перекрыл залив от Бай до мола Путеола мостом из двойного ряда кораблей."
    - "Павел, которого везли узником в Рим, прибыл сюда из Ригии на александрийском корабле: «прибыли на второй день в Путеол, где нашли братьев, и были упрошены пробыть у них семь дней». Отсюда он пошёл дальше по суше в Рим, и братья вышли ему навстречу до Аппиевой площади и Трёх гостиниц. Через несколько лет и Иосиф Флавий после кораблекрушения в Адриатическом море высадился в Путеоле; здесь он познакомился с актёром-иудеем, любимцем Нерона, и через него добился встречи с императрицей Поппеей."
    - "В 60 г. н. э. Нерон дал старому городу права и звание колонии. При Флавиях здесь построили большой амфитеатр, а руины рынка, долго ошибочно называвшегося храмом Сераписа, стоят до сих пор. Адриан, умерший в соседних Байях в 138 г., был сначала похоронен в Путеоле, в имении, принадлежавшем некогда Цицерону. После того как Клавдий построил гавань в Остии, позднее расширенную Траяном, большая часть римской торговли перешла туда, и Путеол постепенно утратил своё значение, хотя оставался заметным городом и в поздней античности."
  uk:
    - "Путеоли, нинішній Поццуолі, лежать на Неаполітанській затоці в Кампанії, у вулканічному краю гарячих джерел і сірки на захід від Неаполя. Починалися вони як грецьке місто Діцеархія: Страбон називає його портом Кум, тоді як Євсевій і Стефан Візантійський кажуть, що його заснували переселенці з Самоса в другій половині VI ст. до н. е. Страбон виводить латинську назву Путеоли від його колодязів або від запаху його вод. У 215 р. до н. е. римляни укріпили його й поставили гарнізон проти Ганнібала, а 194 р. до н. е. оселили там колонію римських громадян."
    - "Його гавань, споруджена з місцевого вулканічного піску, що твердне навіть під водою, зробила Путеоли головним портом Риму наприкінці Республіки та на початку Імперії. Тут розвантажувалися зернові кораблі з Александрії, і Сенека описує натовпи на молі, що чекали на перший з них. У місті оселилися купці зі Сходу, серед них юдеї: Йосиф Флавій розповідає, як самозванця, що видавав себе за сина Ірода Александра, прийняли юдеї Діцеархії. Калігула перекинув через затоку міст з двох рядів кораблів від Байїв до молу Путеол."
    - "Павло, в’язень на шляху до Риму, прибув сюди з Регія на александрійському кораблі: «прийшли другого дня в Путеоли, де знайшовши братів, ублагані були від них перебути у них сїм день». Звідти він рушив далі дорогою до Риму, і брати вийшли йому назустріч аж до Аппієвого форуму й Трьох таверн. Через кілька років Йосиф Флавій після корабельної аварії в Адріатичному морі також висадився в Путеолах; там він зустрів юдейського актора, улюбленця Нерона, через якого дістався імператриці Поппеї."
    - "У 60 р. н. е. Нерон надав старому місту права й титул колонії. За імператорів династії Флавіїв воно збудувало великий амфітеатр, а руїни його торгової зали, яку довго помилково називали храмом Серапіса, стоять досі. Адріана, що помер у сусідніх Байях 138 р., спершу поховали в Путеолах, у маєтку, який колись належав Цицерону. Після того як Клавдій збудував гавань в Остії, згодом розширену Траяном, значна частина римської торгівлі перемістилася туди, і Путеоли поволі втратили своє місце, хоч лишалися помітним містом до пізньої античності."
  es:
    - "Puteoli, la actual Pozzuoli, se encuentra en la bahía de Nápoles, en la Campania, en el país volcánico de aguas termales y azufre al oeste de Nápoles. Empezó como la ciudad griega de Dicearquía: Estrabón la llama el puerto de Cumas, mientras que Eusebio y Esteban de Bizancio dicen que la fundaron colonos de Samos a finales del siglo VI a. C. Estrabón deriva el nombre latino Puteoli de sus pozos, o del olor de sus aguas. En 215 a. C. los romanos la fortificaron y guarnecieron contra Aníbal, y en 194 a. C. asentaron allí una colonia de ciudadanos romanos."
    - "Su puerto, construido con la arena volcánica local que fragua con dureza incluso bajo el agua, hizo de Puteoli el principal puerto de Roma a finales de la República y comienzos del Imperio. Los barcos de grano de Alejandría descargaban aquí, y Séneca describe las multitudes en el malecón esperando ver el primero de ellos. Mercaderes del Oriente se establecieron en la ciudad, entre ellos judíos: Josefo cuenta cómo el impostor que se hacía pasar por Alejandro, hijo de Herodes, fue recibido por los judíos de Dicearquía. Calígula tendió un puente sobre la bahía, de Bayas al malecón de Puteoli, con una doble línea de naves."
    - "Pablo, preso camino de Roma, llegó aquí desde Regio en una nave alejandrina: «vinimos al segundo día á Puteolos: Donde habiendo hallado hermanos, nos rogaron que quedásemos con ellos siete días». Desde allí siguió por tierra hacia Roma, y los hermanos salieron a recibirlo hasta la plaza de Apio y las Tres Tabernas. Unos años después Josefo, tras un naufragio en el mar Adriático, desembarcó también en Puteoli; allí conoció a un actor judío favorito de Nerón, por medio del cual llegó a la emperatriz Popea."
    - "En 60 d. C. Nerón concedió a la vieja ciudad los derechos y el título de colonia. Bajo los emperadores flavios construyó un gran anfiteatro, y aún se alzan las ruinas de su mercado, durante mucho tiempo mal llamado el Templo de Serapis. Adriano, que murió en la cercana Bayas en 138, fue sepultado primero en Puteoli, en una finca que había pertenecido a Cicerón. Después de que Claudio construyera un puerto en Ostia, ampliado más tarde por Trajano, gran parte del comercio de Roma se trasladó allí, y Puteoli fue perdiendo poco a poco su lugar, aunque siguió siendo una ciudad de cierta importancia hasta la Antigüedad tardía."
  pt:
    - "Putéoli, a atual Pozzuoli, fica na baía de Nápoles, na Campânia, no país vulcânico de águas quentes e enxofre a oeste de Nápoles. Começou como a cidade grega de Dicearquia: Estrabão a chama de porto de Cumas, enquanto Eusébio e Estêvão de Bizâncio dizem que colonos de Samos a fundaram no fim do século VI a.C. Estrabão deriva o nome latino Puteoli de seus poços, ou do cheiro de suas águas. Em 215 a.C. os romanos a fortificaram e guarneceram contra Aníbal, e em 194 a.C. estabeleceram ali uma colônia de cidadãos romanos."
    - "Seu porto, construído com a areia vulcânica local, que endurece mesmo debaixo d'água, fez de Putéoli o principal porto de Roma no fim da República e início do Império. Navios de grãos de Alexandria descarregavam aqui, e Sêneca descreve as multidões no molhe esperando o primeiro deles. Mercadores do Oriente se fixaram na cidade, entre eles judeus: Josefo conta como o impostor que se fazia passar por Alexandre, filho de Herodes, foi recebido pelos judeus de Dicearquia. Calígula ligou a baía de Baias ao molhe de Putéoli com uma dupla fila de navios."
    - "Paulo, prisioneiro a caminho de Roma, chegou aqui vindo de Régio num navio alexandrino: “no segundo dia chegamos a Putéoli, onde encontramos irmãos, e fomos convidados a ficar com eles por sete dias”. Dali seguiu por terra em direção a Roma, e irmãos saíram ao seu encontro até a Praça de Ápio e as Três Vendas. Alguns anos depois, Josefo, depois de um naufrágio no mar Adriático, também desembarcou em Putéoli; ali conheceu um ator judeu favorito de Nero, por meio de quem chegou à imperatriz Popeia."
    - "Em 60 d.C., Nero deu à velha cidade os direitos e o título de colônia. Sob os imperadores flavianos construiu um grande anfiteatro, e as ruínas de seu mercado, por muito tempo chamado erroneamente Templo de Serápis, ainda estão de pé. Adriano, que morreu na vizinha Baias em 138, foi primeiro sepultado em Putéoli numa propriedade que fora de Cícero. Depois que Cláudio construiu um porto em Óstia, mais tarde ampliado por Trajano, grande parte do comércio de Roma se mudou para lá, e Putéoli perdeu aos poucos o seu lugar, embora continuasse uma cidade de certa importância até a Antiguidade tardia."
  de:
    - "Puteoli, das heutige Pozzuoli, liegt am Golf von Neapel in Kampanien, im vulkanischen Land der heißen Quellen und des Schwefels westlich von Neapel. Es begann als die griechische Stadt Dikaiarchia: Strabon nennt es den Hafen von Cumae, während Eusebius und Stephanos von Byzanz sagen, Siedler von Samos hätten es im späteren 6. Jahrhundert v. Chr. gegründet. Strabon leitet den lateinischen Namen Puteoli von seinen Brunnen oder vom Geruch seiner Wasser ab. Im Jahr 215 v. Chr. befestigten und besetzten die Römer es gegen Hannibal, und 194 v. Chr. siedelten sie dort eine Kolonie römischer Bürger an."
    - "Sein Hafen, mit dem einheimischen vulkanischen Sand gebaut, der selbst unter Wasser hart wird, machte Puteoli in der späten Republik und frühen Kaiserzeit zum wichtigsten Hafen Roms. Getreideschiffe aus Alexandria luden hier aus, und Seneca beschreibt die Menschenmengen auf der Mole, die nach dem ersten von ihnen Ausschau hielten. Kaufleute aus dem Osten ließen sich in der Stadt nieder, darunter Juden: Josephus erzählt, wie der Betrüger, der sich als Herodes' Sohn Alexander ausgab, von den Juden von Dikaiarchia aufgenommen wurde. Caligula überbrückte die Bucht von Baiae zur Mole von Puteoli mit einer doppelten Schiffsreihe."
    - "Paulus, ein Gefangener auf dem Weg nach Rom, kam hierher von Rhegion in einem alexandrinischen Schiff: „kamen wir des andern Tages gen Puteoli. Da fanden wir Brüder und wurden von ihnen gebeten, daß wir sieben Tage dablieben.“ Von dort ging er auf dem Landweg weiter nach Rom, und Brüder kamen ihm bis zum Forum Appii und den Tres Tabernae entgegen. Einige Jahre später landete auch Josephus nach einem Schiffbruch im Adriatischen Meer in Puteoli; dort traf er einen jüdischen Schauspieler, den Nero schätzte, durch den er zur Kaiserin Poppaea gelangte."
    - "Im Jahr 60 n. Chr. verlieh Nero der alten Stadt Recht und Titel einer Kolonie. Unter den flavischen Kaisern baute sie ein großes Amphitheater, und die Ruinen ihrer Markthalle, lange fälschlich Serapis-Tempel genannt, stehen noch. Hadrian, der 138 im nahen Baiae starb, wurde zunächst in Puteoli auf einem Landgut beigesetzt, das einst Cicero gehört hatte. Nachdem Klaudius einen Hafen in Ostia gebaut hatte, später von Trajan erweitert, verlagerte sich ein großer Teil des Handels Roms dorthin, und Puteoli verlor langsam seinen Platz, blieb aber bis in die Spätantike eine Stadt von einiger Bedeutung."
  fr:
    - "Pouzzoles se trouve sur la baie de Naples, en Campanie, dans le pays volcanique de sources chaudes et de soufre à l’ouest de Naples. Elle débuta comme la ville grecque de Dicéarchie : Strabon l’appelle le port de Cumes, tandis qu’Eusèbe et Étienne de Byzance disent que des colons de Samos la fondèrent à la fin du VIe siècle av. J.-C. Strabon tire le nom latin Puteoli de ses puits, ou de l’odeur de ses eaux. En 215 av. J.-C., les Romains la fortifièrent et y mirent garnison contre Hannibal, et en 194 av. J.-C. ils y établirent une colonie de citoyens romains."
    - "Son port, bâti avec le sable volcanique local qui durcit même sous l’eau, fit de Pouzzoles le principal port de Rome à la fin de la République et au début de l’Empire. Les navires céréaliers d’Alexandrie y déchargeaient, et Sénèque décrit les foules sur le môle guettant le premier d’entre eux. Des marchands d’Orient s’y installèrent, dont des Juifs : Flavius Josèphe raconte que l’imposteur qui se faisait passer pour Alexandre, fils d’Hérode, fut reçu par les Juifs de Dicéarchie. Caligula jeta sur la baie, de Baïes au môle de Pouzzoles, un pont de navires sur deux rangs."
    - "Paul, prisonnier en route pour Rome, y vint de Reggio sur un navire d’Alexandrie : « nous fîmes en deux jours le trajet jusqu’à Pouzzoles, où nous trouvâmes des frères qui nous prièrent de passer sept jours avec eux ». De là il poursuivit par la route vers Rome, et des frères vinrent à sa rencontre jusqu’au Forum d’Appius et aux Trois-Tavernes. Quelques années plus tard, Flavius Josèphe, après un naufrage dans la mer Adriatique, aborda lui aussi à Pouzzoles ; il y rencontra un acteur juif favori de Néron, par qui il parvint jusqu’à l’impératrice Poppée."
    - "En 60 apr. J.-C., Néron donna à la vieille ville les droits et le titre de colonie. Sous les empereurs flaviens, elle bâtit un grand amphithéâtre, et les ruines de sa halle de marché, longtemps appelée à tort Temple de Sérapis, se dressent encore. Hadrien, mort à Baïes, tout près, en 138, fut d’abord enterré à Pouzzoles dans un domaine qui avait appartenu à Cicéron. Après que Claude eut bâti un port à Ostie, plus tard agrandi par Trajan, une grande part du commerce de Rome s’y déplaça, et Pouzzoles perdit lentement sa place, tout en restant une ville de quelque renom jusqu’à l’Antiquité tardive."
  it:
    - "Puteoli, l’odierna Pozzuoli, sorge sul Golfo di Napoli in Campania, nel paese vulcanico di sorgenti calde e di zolfo a ovest di Napoli. Cominciò come la città greca di Dicearchia: Strabone la chiama il porto di Cuma, mentre Eusebio e Stefano di Bisanzio dicono che la fondarono coloni di Samo nel tardo VI secolo a.C. Strabone fa derivare il nome latino Puteoli dai suoi pozzi, o dall’odore delle sue acque. Nel 215 a.C. i Romani la fortificarono e vi misero una guarnigione contro Annibale, e nel 194 a.C. vi insediarono una colonia di cittadini romani."
    - "Il suo porto, costruito con la sabbia vulcanica locale che indurisce anche sott’acqua, fece di Pozzuoli il principale porto di Roma nella tarda Repubblica e nel primo Impero. Qui scaricavano le navi granarie di Alessandria, e Seneca descrive le folle sul molo in attesa della prima di esse. Mercanti dall’Oriente si stabilirono in città, tra cui Ebrei: Giuseppe Flavio racconta come l’impostore che si spacciava per Alessandro, figlio di Erode, fu accolto dagli Ebrei di Dicearchia. Caligola collegò con un doppio ponte di navi la baia da Baia al molo di Pozzuoli."
    - "Paolo, prigioniero diretto a Roma, vi giunse da Reggio su una nave alessandrina: «in due giorni arrivammo a Pozzuoli. E avendo quivi trovato de’ fratelli, fummo pregati di rimanere presso di loro sette giorni». Da lì proseguì per via di terra verso Roma, e i fratelli gli vennero incontro fino al Foro Appio e alle Tre Taverne. Alcuni anni dopo anche Giuseppe Flavio, dopo un naufragio nel Mare Adriatico, approdò a Pozzuoli; là incontrò un attore ebreo favorito da Nerone, grazie al quale giunse all’imperatrice Poppea."
    - "Nel 60 d.C. Nerone concesse alla vecchia città i diritti e il titolo di colonia. Sotto gli imperatori flavi costruì un grande anfiteatro, e le rovine del suo mercato, a lungo erroneamente chiamato Tempio di Serapide, sono ancora in piedi. Adriano, che morì nella vicina Baia nel 138, fu sepolto dapprima a Pozzuoli in una tenuta che era appartenuta a Cicerone. Dopo che Claudio costruì un porto a Ostia, poi ampliato da Traiano, gran parte dei traffici di Roma vi si spostò, e Pozzuoli perse lentamente il suo posto, pur restando una città di qualche rilievo fino alla tarda antichità."
  pl:
    - "Puteoli, dzisiejsze Pozzuoli, leży nad Zatoką Neapolitańską w Kampanii, w wulkanicznym kraju gorących źródeł i siarki na zachód od Neapolu. Zaczęło jako greckie miasto Dikajarchia: Strabon nazywa je portem Kyme, a Euzebiusz i Stefan z Bizancjum mówią, że założyli je osadnicy z Samos w późniejszym VI wieku p.n.e. Strabon wywodzi łacińską nazwę Puteoli od jego studni albo od zapachu jego wód. W 215 roku p.n.e. Rzymianie ufortyfikowali je i obsadzili garnizonem przeciw Hannibalowi, a w 194 roku p.n.e. osiedlili tam kolonię obywateli rzymskich."
    - "Jego port, zbudowany z miejscowego piasku wulkanicznego, który twardnieje nawet pod wodą, uczynił z Puteoli główny port Rzymu w późnej republice i wczesnym cesarstwie. Statki zbożowe z Aleksandrii wyładowywały się tutaj, a Seneka opisuje tłumy na molo wypatrujące pierwszego z nich. W mieście osiedlali się kupcy ze Wschodu, wśród nich Żydzi: Józef Flawiusz opowiada, że oszust podający się za Aleksandra, syna Heroda, został przyjęty przez Żydów z Dikajarchii. Kaligula połączył zatokę od Baje do mola w Puteoli podwójnym szeregiem statków."
    - "Paweł, więzień w drodze do Rzymu, przybył tu z Region okrętem aleksandryjskim: „wtórego dnia płynęliśmy do Puteolów. Gdzie znalazłszy braci, uproszeniśmy byli od nich, żebyśmy zamieszkali u nich przez siedm dni”. Stąd poszedł drogą lądową do Rzymu, a bracia wyszli mu naprzeciw aż do Forum Appiusza i Trzech Gospód. Kilka lat później Józef Flawiusz, po rozbiciu okrętu na Morzu Adriatyckim, również wylądował w Puteoli; tam spotkał żydowskiego aktora ulubionego przez Nerona, przez którego dotarł do cesarzowej Poppei."
    - "W 60 roku n.e. Neron nadał staremu miastu prawa i tytuł kolonii. Za cesarzy Flawiuszów zbudowało wielki amfiteatr, a ruiny jego hali targowej, długo błędnie zwanej Świątynią Serapisa, wciąż stoją. Hadrian, który zmarł w pobliskich Baje w 138 roku, został najpierw pochowany w Puteoli w posiadłości, która niegdyś należała do Cycerona. Gdy Klaudiusz zbudował port w Ostii, później powiększony przez Trajana, znaczna część handlu Rzymu przeniosła się tam, a Puteoli powoli utraciło swą pozycję, choć pozostało miastem pewnego znaczenia do późnej starożytności."
  cs:
    - "Puteoli, dnešní Pozzuoli, leží v Neapolském zálivu v Kampánii, v sopečné krajině horkých pramenů a síry západně od Neapole. Začalo jako řecké město Dikaiarcheia: Strabón je nazývá přístavem Kymé, zatímco Eusebius a Štěpán Byzantský říkají, že je založili osadníci ze Samu v pozdním 6. století př. n. l. Strabón odvozuje latinské jméno Puteoli od jeho studní, nebo od zápachu jeho vod. Roku 215 př. n. l. je Římané opevnili a obsadili posádkou proti Hannibalovi a roku 194 př. n. l. tam usadili kolonii římských občanů."
    - "Jeho přístav, vybudovaný z místního sopečného písku, který tvrdne i pod vodou, učinil z Puteol hlavní přístav Říma v pozdní republice a raném císařství. Obilné lodě z Alexandrie zde vykládaly a Seneca popisuje davy na mole, které vyhlížely první z nich. Obchodníci z Východu se ve městě usazovali, mezi nimi Židé: Josephus vypráví, jak podvodníka, který se vydával za Herodova syna Alexandra, přijali Židé v Dikaiarcheji. Caligula přemostil záliv od Baiae k molu Puteol dvojitou řadou lodí."
    - "Pavel, vězeň na cestě do Říma, sem přišel z Regia alexandrijskou lodí: „druhý den přijeli jsme do Puteolos. Kdežto nalezli jsme bratří, kteříž nás prosili, abychom pobyli u nich za sedm dní.“ Odtud šel dále po souši k Římu a bratří mu vyšli vstříc až k Appiovu tržišti a Třem hostincům. O několik let později také Josephus po ztroskotání v Jaderském moři přistál v Puteolech; tam potkal židovského herce oblíbeného Neronem, jehož prostřednictvím se dostal k císařovně Poppaee."
    - "Roku 60 n. l. dal Nero starému městu práva a titul kolonie. Za císařů Flaviovců vystavělo velký amfiteátr a zříceniny jeho tržnice, dlouho nesprávně zvané Serapeion, dosud stojí. Hadrianus, který zemřel v nedalekých Baiích roku 138, byl nejprve pohřben v Puteolech na statku, který kdysi patřil Ciceronovi. Když Klaudius vystavěl přístav v Ostii, později rozšířený Traianem, přesunula se tam velká část obchodu Říma a Puteoli pomalu ztratilo své postavení, ač zůstalo městem jistého významu až do pozdní antiky."
  nl:
    - "Puteoli, het huidige Pozzuoli, ligt aan de Baai van Napels in Campanië, in het vulkanische land van warme bronnen en zwavel ten westen van Napels. Het begon als de Griekse stad Dikaiarchia: Strabo noemt haar de haven van Cumae, terwijl Eusebius en Stephanus van Byzantium zeggen dat kolonisten van Samos haar in de late 6e eeuw v.Chr. stichtten. Strabo leidt de Latijnse naam Puteoli af van haar putten, of van de geur van haar wateren. In 215 v.Chr. versterkten en bezetten de Romeinen haar tegen Hannibal, en in 194 v.Chr. vestigden zij er een kolonie van Romeinse burgers."
    - "De haven, gebouwd met het plaatselijke vulkanische zand dat zelfs onder water hard wordt, maakte Puteoli in de late Republiek en het vroege Keizerrijk tot de belangrijkste haven van Rome. Graanschepen uit Alexandrië losten hier, en Seneca beschrijft de menigte op de pier die naar de eerste ervan uitkeek. Kooplieden uit het Oosten vestigden zich in de stad, onder wie Joden: Josephus vertelt hoe de bedrieger die zich uitgaf voor Herodes’ zoon Alexander door de Joden van Dikaiarchia werd ontvangen. Caligula overbrugde de baai van Baiae tot de pier van Puteoli met een dubbele lijn schepen."
    - "Paulus, een gevangene op weg naar Rome, kwam hier van Regium in een Alexandrijns schip: “kwamen wij den tweeden dag te Puteoli; Alwaar wij broeders vonden, en werden gebeden, zeven dagen bij hen te blijven”. Van daar ging hij over land naar Rome, en broeders kwamen hem tot Appiusforum en de Drie Tavernen tegemoet. Enkele jaren later landde ook Josephus na een schipbreuk op de Adriatische Zee te Puteoli; daar ontmoette hij een Joodse acteur die door Nero werd begunstigd, via wie hij keizerin Poppaea bereikte."
    - "In 60 n.Chr. gaf Nero de oude stad de rechten en titel van een kolonie. Onder de Flavische keizers bouwde ze een groot amfitheater, en de ruïnes van haar markthal, lang ten onrechte de Tempel van Serapis genoemd, staan er nog. Hadrianus, die in 138 in het nabije Baiae stierf, werd eerst te Puteoli begraven op een landgoed dat ooit aan Cicero had toebehoord. Nadat Claudius een haven bij Ostia had gebouwd, later door Trajanus uitgebreid, verplaatste veel van Romes handel zich daarheen, en Puteoli verloor langzaam zijn plaats, al bleef het tot in de late oudheid een stad van betekenis."
  sv:
    - "Puteoli, nuvarande Pozzuoli, ligger vid Neapelbukten i Kampanien, i det vulkaniska landet av heta källor och svavel väster om Neapel. Det började som den grekiska staden Dikaiarchia: Strabon kallar det Cumaes hamn, medan Eusebios och Stefanos av Byzantion säger att nybyggare från Samos grundade det under senare delen av 500-talet f.Kr. Strabon härleder det latinska namnet Puteoli från dess brunnar, eller från lukten av dess vatten. År 215 f.Kr. befäste och garnisonerade romarna det mot Hannibal, och 194 f.Kr. bosatte de en koloni av romerska medborgare där."
    - "Dess hamn, byggd av den lokala vulkaniska sanden som härdar även under vatten, gjorde Puteoli till Roms främsta hamn under sena republiken och tidiga kejsartiden. Spannmålsskepp från Alexandria lastade av här, och Seneca beskriver folkmassorna på hamnpiren som spanar efter det första av dem. Köpmän från Orienten bosatte sig i staden, bland dem judar: Josefus berättar hur bedragaren som utgav sig för att vara Herodes son Alexander togs emot av judarna i Dikaiarchia. Caligula slog en bro över bukten från Baiae till Puteolis hamnpir med en dubbel rad av fartyg."
    - "Paulus, en fånge på väg till Rom, kom hit från Rhegion med ett alexandrinskt skepp: ”kommo så redan på andra dagen till Puteoli. Där träffade vi på bröder, och hos dem stannade vi, på deras inbjudning, i sju dagar”. Därifrån gick han vidare landvägen mot Rom, och bröder kom ut för att möta honom ända till Forum Appii och Tres Tabernae. Några år senare landade också Josefus vid Puteoli, efter ett skeppsbrott i Adriatiska havet; där träffade han en judisk skådespelare i Neros gunst, genom vilken han nådde kejsarinnan Poppaea."
    - "År 60 e.Kr. gav Nero den gamla staden kolonins rättigheter och titel. Under de flaviska kejsarna byggde den en stor amfiteater, och ruinerna av dess marknadshall, länge felaktigt kallad Serapistemplet, står ännu. Hadrianus, som dog i närliggande Baiae år 138, begravdes först i Puteoli på en egendom som en gång tillhört Cicero. Sedan Claudius byggt en hamn vid Ostia, senare utvidgad av Trajanus, flyttade mycket av Roms handel dit, och Puteoli förlorade sakta sin plats, fastän det förblev en stad av viss betydelse in i senantiken."
  nb:
    - "Puteoli, dagens Pozzuoli, ligger ved Napolibukta i Campania, i det vulkanske landet med varme kilder og svovel vest for Napoli. Det begynte som den greske byen Dikaiarkhia: Strabon kaller den Cumaes havn, mens Eusebius og Stefanos av Bysants sier at nybyggere fra Samos grunnla den sent på 500-tallet f.Kr. Strabon utleder det latinske navnet Puteoli fra brønnene dens, eller fra lukten av vannet. I 215 f.Kr. befestet og garnisonerte romerne den mot Hannibal, og i 194 f.Kr. bosatte de en koloni av romerske borgere der."
    - "Havnen, bygd med lokal vulkansk sand som herdner hardt selv under vann, gjorde Puteoli til Romas viktigste havn i sen republikk og tidlig keisertid. Kornskip fra Aleksandria losset her, og Seneca beskriver folkemengdene på moloen som speidet etter det første av dem. Kjøpmenn fra Østen bosatte seg i byen, blant dem jøder: Josefus forteller hvordan bedrageren som utga seg for å være Herodes' sønn Aleksander ble mottatt av jødene i Dikaiarkhia. Caligula slo bro over bukten fra Baiae til moloen i Puteoli med en dobbelt rekke skip."
    - "Paulus, en fange på vei til Roma, kom hit fra Regium med et skip fra Aleksandria: «så vi efter to dagers fart kom til Puteoli. Der fant vi brødre, og de bad oss bli syv dager hos dem». Derfra dro han videre til lands mot Roma, og brødre kom ham i møte helt til Forum Appii og Tres Tabernae. Noen år senere gikk Josefus, etter et skipsforlis i Adriaterhavet, også i land i Puteoli; der møtte han en jødisk skuespiller som Nero favoriserte, og gjennom ham nådde han keiserinnen Poppaea."
    - "I 60 e.Kr. ga Nero den gamle byen koloniens rettigheter og tittel. Under de flaviske keiserne bygde den et stort amfiteater, og ruinene av markedshallen, lenge feilaktig kalt Serapis-tempelet, står fortsatt. Hadrian, som døde ved nærliggende Baiae i 138, ble først gravlagt i Puteoli på en eiendom som en gang hadde tilhørt Cicero. Etter at Klaudius bygde en havn ved Ostia, senere utvidet av Trajan, flyttet mye av Romas handel dit, og Puteoli mistet sakte sin plass, selv om det forble en by av en viss betydning langt inn i senantikken."
  tl:
    - "Ang Puteoli, ang Pozzuoli ngayon, ay nasa Look ng Naples sa Campania, sa lupaing bulkaniko ng mga mainit na bukal at asupre sa kanluran ng Naples. Nagsimula ito bilang bayang Griyego ng Dicaearchia: tinatawag ito ni Strabo na daungan ng Cumas, samantalang sinasabi nina Eusebio at Esteban ng Bisancio na itinatag ito ng mga naninirahan mula sa Samos sa huling bahagi ng ika-6 na siglo BK. Hinango ni Strabo ang pangalang Latin na Puteoli mula sa mga balon nito, o sa amoy ng mga tubig nito. Noong 215 BK, pinatibay at binantayan ito ng mga Romano laban kay Anibal, at noong 194 BK ay nagtatag sila roon ng koloniya ng mga mamamayang Romano."
    - "Ang daungan nito, na itinayo gamit ang lokal na buhangin bulkaniko na tumitigas kahit sa ilalim ng tubig, ang naging pangunahing daungan ng Roma sa huling Republika at maagang Imperyo. Dito nagbaba ng kargada ang mga barkong butil mula sa Alejandria, at inilalarawan ni Seneca ang mga tao sa muelye na nagmamasid sa una sa mga ito. Nanirahan sa bayan ang mga mangangalakal mula sa Silangan, kabilang ang mga Judio: isinasalaysay ni Josephus kung paano tinanggap ng mga Judio ng Dicaearchia ang impostor na nagpanggap na anak ni Herodes na si Alejandro. Tinulayan ni Caligula ang look mula Baiae hanggang sa muelye ng Puteoli ng dobleng hanay ng mga barko."
    - "Si Pablo, isang bilanggong papunta sa Roma, ay dumating dito mula sa Regio sa isang barko ng Alejandria: “nang ikalawang araw ay nagsirating kami sa Puteoli; Na doo'y nakasumpong kami ng mga kapatid, at kami'y pinakiusapang matira sa kanilang pitong araw”. Mula roon ay nagpatuloy siya sa daan patungong Roma, at sinalubong siya ng mga kapatid hanggang sa Pamilihan ng Appio at Tatlong Bahay-Tuluyan. Ilang taon pagkaraan, si Josephus, matapos ang pagkawasak ng barko sa Dagat Adriatico, ay dumaong din sa Puteoli; doon niya nakilala ang isang aktor na Judio na paborito ni Nero, na sa pamamagitan niya ay nakarating siya sa emperatris na si Popea."
    - "Noong AD 60, ibinigay ni Nero sa lumang bayan ang mga karapatan at titulo ng isang koloniya. Sa ilalim ng mga emperador na Flavio, nagtayo ito ng malaking ampiteatro, at nakatayo pa rin ang mga guho ng bulwagan ng pamilihan nito, na matagal nang maling tinawag na Templo ni Serapis. Si Hadrian, na namatay sa karatig na Baiae noong 138, ay unang inilibing sa Puteoli sa isang ari-ariang dating pag-aari ni Ciceron. Pagkatapos magtayo si Claudio ng daungan sa Ostia, na pinalaki ni Trajan kalaunan, malaking bahagi ng kalakalan ng Roma ay lumipat doon, at unti-unting nawala ang lugar ng Puteoli, bagaman nanatili itong bayang may kahalagahan hanggang sa huling antigidad."
  da:
    - "Puteoli, nutidens Pozzuoli, ligger ved Napolibugten i Campania, i det vulkanske land med varme kilder og svovl vest for Napoli. Det begyndte som den græske by Dikaiarkhia: Strabon kalder den Kymes havn, mens Eusebios og Stefanos fra Byzans siger, at bosættere fra Samos grundlagde den i den senere del af 500-tallet f.Kr. Strabon udleder det latinske navn Puteoli af dens brønde eller af lugten af dens vand. I 215 f.Kr. befæstede og besatte romerne den mod Hannibal, og i 194 f.Kr. bosatte de en koloni af romerske borgere dér."
    - "Dens havn, bygget med den lokale vulkanske sand, der hærder selv under vand, gjorde Puteoli til Roms hovedhavn i sen republik og tidligt kejserrige. Kornskibe fra Alexandria lossede her, og Seneca beskriver menneskemængden på molen, der ventede på det første af dem. Købmænd fra Østen bosatte sig i byen, blandt dem jøder: Josefus fortæller, hvordan bedrageren, der udgav sig for Herodes' søn Alexander, blev modtaget af jøderne i Dikaiarkhia. Caligula slog en bro over bugten fra Baiae til Puteolis mole med en dobbelt række skibe."
    - "Paulus, en fange på vej til Rom, kom hertil fra Regium i et aleksandrinsk skib: »kom den næste Dag til Puteoli. Der fandt vi Brødre og bleve opfordrede til at blive hos dem i syv Dage«. Derfra drog han videre ad landevejen mod Rom, og brødre kom ham i møde helt til Appius' Forum og Tres Tabernæ. Nogle år senere landede Josefus, efter et skibbrud i Adriaterhavet, også i Puteoli; dér mødte han en jødisk skuespiller, Nero yndede, ved hvem han nåede kejserinde Poppaea."
    - "I 60 e.Kr. gav Nero den gamle by kolonis ret og titel. Under de flaviske kejsere byggede den et stort amfiteater, og ruinerne af dens markedshal, længe fejlagtigt kaldt Serapis-templet, står stadig. Hadrian, der døde i nærliggende Baiae i 138, blev først begravet i Puteoli på en ejendom, der engang havde tilhørt Cicero. Efter at Klaudius byggede en havn i Ostia, senere udvidet af Trajan, flyttede en stor del af Roms handel dertil, og Puteoli mistede langsomt sin plads, selv om det forblev en by af nogen betydning ind i senantikken."
  sr:
    - "Путеоли, данашњи Поцуоли, леже на Напуљском заливу у Кампанији, у вулканском крају топлих извора и сумпора западно од Напуља. Почели су као грчки град Дикеархија: Страбон га зове луком Куме, а Јевсевије и Стефан Византијски кажу да су га основали досељеници са Самоса у касном 6. веку п. н. е. Страбон латинско име Путеоли изводи од његових бунара или од мириса његових вода. Године 215. п. н. е. Римљани су га утврдили и посели посадом против Ханибала, а 194. п. н. е. ту су населили колонију римских грађана."
    - "Његова лука, грађена од локалног вулканског песка који се и под водом тврдо веже, учинила је Путеоле главном луком Рима у касној Републици и раном Царству. Житне лађе из Александрије истоварале су се овде, а Сенека описује гомиле на молу које чекају прве од њих. У граду су се настанили трговци с Истока, међу њима и Јевреји: Јосиф Флавије приповеда како су варалицу која се представљала као Иродов син Александар примили Јевреји Дикеархије. Калигула је премостио залив од Баја до мола Путеола двоструким низом лађа."
    - "Павле, затвореник на путу у Рим, дошао је овамо из Ригије на александријском броду: „дођосмо други дан у Потиоле. Онде нађемо браћу, и они нас замоле те останемо код њих седам дана“. Одатле је даље копном ишао према Риму, а браћа су му изашла у сусрет све до Апијевог трга и Три гостионице. Неколико година касније Јосиф Флавије, после бродолома у Јадранском мору, такође је пристао у Путеолима; ту је срео јеврејског глумца Нероновог миљеника, преко кога је стигао до царице Попеје."
    - "Године 60. н. е. Нерон је старом граду дао права и наслов колоније. Под флавијевским царевима град је подигао велики амфитеатар, а рушевине његове пијачне дворане, дуго погрешно назване Серапидовим храмом, још стоје. Хадријан, који је умро у оближњим Бајама 138, најпре је сахрањен у Путеолима, на имању које је некад припадало Цицерону. Пошто је Клаудије саградио луку у Остији, коју је Трајан касније проширио, велики део римске трговине преселио се тамо, и Путеоли су полако губили место, мада су остали град извесног значаја до касне антике."
  hu:
    - "Puteoli, a mai Pozzuoli, a Nápolyi-öbölben fekszik Campaniában, a Nápolytól nyugatra eső vulkanikus vidéken, forró források és kén országában. Dikaiarkheia görög városként kezdte: Sztrabón Kümé kikötőjének nevezi, míg Euszebiosz és a bizánci Stephanosz szerint számoszi telepesek alapították a Kr. e. 6. század későbbi felében. Sztrabón a latin Puteoli nevet kútjaiból vagy vizeinek szagából vezeti le. Kr. e. 215-ben a rómaiak megerősítették és helyőrséggel látták el Hannibal ellen, Kr. e. 194-ben pedig római polgárok gyarmatát telepítették oda."
    - "Kikötője, amelyet a helyi vulkáni homokból építettek, amely a víz alatt is keményre köt, a késő köztársaság és a korai császárkor Rómájának fő kikötőjévé tette Puteolit. Az alexandriai gabonahajók itt rakodtak ki, és Seneca leírja a mólón tolongó tömeget, amely az elsőre vár. Keleti kereskedők telepedtek le a városban, köztük zsidók is: Josephus Flavius elmondja, hogyan fogadták a dikaiarkheiai zsidók a szélhámost, aki Heródes fiának, Alexandrosznak adta ki magát. Caligula kettős hajósorral áthidalta az öblöt Baiae-tól Puteoli móljáig."
    - "Pál, a Rómába tartó fogoly, Régiumból érkezett ide egy alexandriai hajón: „másnap megérkezénk Puteóliba. Hol mikor atyafiakat találtunk, kérének minket, hogy nálok maradjunk hét napig”. Onnan szárazföldön ment tovább Róma felé, és az atyafiak elé jöttek egészen az Appius-fórumig és a Három Fogadóig. Néhány évvel később Josephus Flavius is Puteoliban szállt partra az Adriai-tengeren elszenvedett hajótörés után; ott találkozott egy Néró kegyeltjének számító zsidó színésszel, aki által eljutott Poppaea császárnéhoz."
    - "Kr. u. 60-ban Néró a régi városnak gyarmati jogot és címet adott. A Flaviusok alatt nagy amfiteátrumot épített, és piaccsarnokának romjai, amelyet sokáig tévesen Serapis-templomnak neveztek, ma is állnak. Hadrianus, aki 138-ban a közeli Baiae-ban halt meg, először Puteoliban temették el egy olyan birtokon, amely egykor Cicero tulajdona volt. Miután Klaudius kikötőt épített Ostiában, amelyet Traianus később kibővített, Róma kereskedelmének nagy része oda költözött, és Puteoli lassan elveszítette helyét, bár a késő ókorig számottevő város maradt."
  fi:
    - "Puteoli, nykyinen Pozzuoli, sijaitsee Napolinlahdella Campaniassa, Napolin länsipuolella kuumien lähteiden ja rikin tulivuorimaassa. Se alkoi kreikkalaisena Dikaiarkhia-kaupunkina: Strabon kutsuu sitä Kymen satamaksi, kun taas Eusebios ja Bysantionin Stefanos sanovat Samoksen uudisasukkaiden perustaneen sen 500-luvun loppupuolella eaa. Strabon johtaa latinankielisen nimen Puteoli sen kaivoista tai sen vesien hajusta. Vuonna 215 eaa. roomalaiset linnoittivat sen ja sijoittivat sinne varusväen Hannibalia vastaan, ja vuonna 194 eaa. he perustivat sinne Rooman kansalaisten siirtokunnan."
    - "Sen satama, rakennettu paikallisella tulivuorihiekalla, joka kovettuu vedenalaisenakin, teki Puteolista Rooman pääsataman myöhäisellä tasavallan ajalla ja varhaisen keisarikunnan aikana. Aleksandrian viljalaivat purettiin täällä, ja Seneca kuvaa laiturilla olevaa väkijoukkoa odottamassa ensimmäistä niistä. Idän kauppiaita asettui kaupunkiin, muun muassa juutalaisia: Josephus kertoo, kuinka Herodeksen poikana Aleksandroksena esiintynyt huijari otettiin vastaan Dikaiarkhian juutalaisten luona. Caligula rakensi lahden yli sillan Baiaesta Puteolin laiturille kaksinkertaisella laivarivillä."
    - "Paavali, Roomaan matkalla oleva vanki, tuli tänne Regionista aleksandrialaisella laivalla: ”tulimme seuraavana päivänä Puteoliin. Siellä tapasimme veljiä, jotka pyysivät meitä viipymään heidän tykönänsä seitsemän päivää”. Sieltä hän jatkoi maitse kohti Roomaa, ja veljet tulivat häntä vastaan Appii Forumiin ja Kolmeen majataloon asti. Muutamaa vuotta myöhemmin Josephus, haaksirikon jälkeen Adrianmerellä, nousi myös maihin Puteolissa; siellä hän tapasi Neron suosiman juutalaisen näyttelijän, jonka kautta hän pääsi keisarinna Poppaean luo."
    - "Vuonna 60 jaa. Nero antoi vanhalle kaupungille siirtokunnan oikeudet ja arvonimen. Flaviusten keisarien aikana se rakensi suuren amfiteatterin, ja sen torihallin rauniot, joita on pitkään virheellisesti kutsuttu Serapiksen temppeliksi, ovat yhä pystyssä. Hadrianus, joka kuoli läheisessä Baiaessa vuonna 138, haudattiin ensin Puteoliin tilalle, joka oli ollut Cicerolle kuulunut. Kun Klaudius rakensi sataman Ostiaan, jota Trajanus myöhemmin laajensi, suuri osa Rooman kaupasta siirtyi sinne, ja Puteoli menetti vähitellen asemansa, vaikka se pysyi huomattavana kaupunkina myöhäisantiikkiin asti."
  vi:
    - "Bu-xô-lơ, nay là Pozzuoli, nằm trên vịnh Naples ở Campania, trong vùng núi lửa có suối nước nóng và lưu huỳnh phía tây Naples. Nó khởi đầu là thị trấn Hy Lạp Dicaearchia: Strabo gọi đó là cảng của Cumae, trong khi Eusebius và Stephanus của Byzantium nói những người định cư từ Sa-mốt lập nó vào cuối thế kỷ 6 TCN. Strabo cho rằng tên Latin Puteoli bắt nguồn từ các giếng của nó, hay từ mùi nước. Năm 215 TCN, người La Mã củng cố và đóng quân ở đó chống Hannibal, và năm 194 TCN họ lập ở đó một thuộc địa của công dân La Mã."
    - "Bến cảng của nó, xây bằng cát núi lửa địa phương đông cứng ngay cả dưới nước, khiến Bu-xô-lơ trở thành cảng chính của Rô-ma vào cuối thời Cộng hòa và đầu Đế quốc. Các tàu lúa mì từ A-léc-xan-tri dỡ hàng ở đây, và Seneca mô tả đám đông trên con đê chắn sóng chờ tàu đầu tiên. Thương nhân từ Phương Đông định cư trong thành, trong đó có người Do Thái: Josephus kể kẻ mạo danh con của Hê-rốt là A-léc-xan-đơ được người Do Thái ở Dicaearchia tiếp đón. Caligula bắc cầu qua vịnh từ Baiae đến đê chắn sóng của Bu-xô-lơ bằng hai hàng tàu."
    - "Phao-lô, tù nhân bị giải đến Rô-ma, đến đây từ Rê-ghi-um trên một tàu A-léc-xan-tri: “tới thành Bu-xô-lơ. Ở đó gặp anh em mời chúng ta ở lại” bảy ngày. Từ đó ông đi tiếp bằng đường bộ về Rô-ma, và anh em ra đón ông đến tận Phô-rum Áp-bi-u và Ba Quán. Vài năm sau, Josephus, sau một vụ đắm tàu ở Biển A-đri-a-tích, cũng lên bờ ở Bu-xô-lơ; ở đó ông gặp một diễn viên Do Thái được Nero ưa chuộng, nhờ đó đến được hoàng hậu Poppaea."
    - "Năm 60, Nero ban cho thị trấn cũ quyền và danh hiệu thuộc địa. Dưới các hoàng đế Flavius, nó xây một nhà hát vòng lớn, và tàn tích chợ có mái của nó, từ lâu bị gọi nhầm là Đền Serapis, vẫn còn đứng. Hadrian, qua đời ở Baiae gần đó năm 138, lúc đầu được chôn ở Bu-xô-lơ trên một điền trang từng thuộc về Cicero. Sau khi Cơ-lốt xây cảng ở Ostia, về sau được Trajan mở rộng, phần lớn thương mại của Rô-ma chuyển về đó, và Bu-xô-lơ dần mất vị trí, dù vẫn là một thị trấn có tiếng đến hậu kỳ cổ đại."
  ro:
    - "Puteoli, actualul Pozzuoli, se află pe Golful Napoli, în Campania, în ținutul vulcanic cu izvoare termale și sulf de la vest de Napoli. A început ca orașul grecesc Dicearhia: Strabon îl numește portul Cumaei, în timp ce Eusebiu și Ștefan din Bizanț spun că l-au întemeiat coloniști din Samos în a doua jumătate a secolului al VI-lea î.Hr. Strabon derivă numele latin Puteoli de la fântânile sale sau de la mirosul apelor. În 215 î.Hr., romanii l-au fortificat și au pus în el o garnizoană împotriva lui Hannibal, iar în 194 î.Hr. au așezat acolo o colonie de cetățeni romani."
    - "Portul său, construit cu nisipul vulcanic local care se întărește chiar și sub apă, a făcut din Puteoli principalul port al Romei la sfârșitul Republicii și începutul Imperiului. Corăbiile cu grâu din Alexandria descărcau aici, iar Seneca descrie mulțimile de pe dig care așteptau prima dintre ele. Negustori din Răsărit s-au stabilit în oraș, între ei și evrei: Iosif Flaviu povestește cum impostorul care se dădea drept Alexandru, fiul lui Irod, a fost primit de evreii din Dicearhia. Caligula a unit golful de la Baiae la digul Puteoli printr-un pod dublu de corăbii."
    - "Pavel, prizonier în drum spre Roma, a ajuns aici de la Regium cu o corabie alexandrină: „a doua zi am venit în Potioli; Unde aflând frați, ne-au rugat de ne-am zăbovit la ei șapte zile”. De acolo a mers mai departe pe uscat spre Roma, iar frații au ieșit în întâmpinarea lui până la Forul lui Appius și Trei Taverne. Câțiva ani mai târziu, Iosif Flaviu, după un naufragiu în Marea Adriatică, a debarcat și el la Puteoli; acolo a cunoscut un actor evreu favorizat de Nero, prin care a ajuns la împărăteasa Poppaea."
    - "În anul 60 d.Hr., Nero a dat vechiului oraș drepturile și titlul de colonie. Sub împărații flavieni a construit un mare amfiteatru, iar ruinele halei sale de piață, multă vreme numită greșit Templul lui Serapis, încă stau în picioare. Hadrian, care a murit la apropiatul Baiae în 138, a fost îngropat mai întâi la Puteoli, pe o proprietate care aparținuse odinioară lui Cicero. După ce Claudiu a construit un port la Ostia, mărit mai târziu de Traian, o mare parte din comerțul Romei s-a mutat acolo, iar Puteoli și-a pierdut treptat locul, deși a rămas un oraș de oarecare importanță până în antichitatea târzie."
  bg:
    - "Потиоли, днешният Поцуоли, се намира на Неаполитанския залив в Кампания, във вулканичната област с горещи извори и сяра на запад от Неапол. Той започнал като гръцкия град Дикеархия: Страбон го нарича пристанище на Куме, а Евсевий и Стефан Византийски казват, че го основали заселници от Самос в края на VI в. пр.н.е. Страбон извежда латинското име Puteoli от кладенците му или от миризмата на водите му. През 215 г. пр.н.е. римляните го укрепили и поставили там гарнизон срещу Ханибал, а през 194 г. пр.н.е. заселили там колония от римски граждани."
    - "Пристанището му, построено от местния вулканичен пясък, който се втвърдява дори под вода, направило Потиоли главното пристанище на Рим в късната република и ранната империя. Корабите с жито от Александрия се разтоварвали тук и Сенека описва тълпите по вълнолома, които очаквали първия от тях. В града се заселили търговци от Изтока, сред тях и юдеи: Йосиф Флавий разказва как самозванецът, който се представял за сина на Ирод Александър, бил приет от юдеите на Дикеархия. Калигула прехвърлил залива от Бая до вълнолома на Потиоли с двойна редица кораби."
    - "Павел, затворник на път за Рим, дошъл тук от Ригия с александрийски кораб: „на втория ден дойдохме в Потиоли; дето намерихме братя които ни умолиха да преседим у тех седем дена“. Оттам продължил по суша към Рим, а братята излезли да го посрещнат чак до Апиевото тържище и Трите гостилници. Няколко години по-късно и Йосиф Флавий, след корабокрушение в Адриатическо море, слязъл на брега в Потиоли; там срещнал юдейски актьор, любимец на Нерон, чрез когото стигнал до императрица Попея."
    - "През 60 г. н.е. Нерон дал на стария град правата и титлата на колония. При Флавиите там бил построен голям амфитеатър, а руините на пазарната му зала, дълго погрешно наричана храм на Серапис, все още стоят. Адриан, който умрял в близката Бая през 138 г., бил погребан първоначално в Потиоли, в имение, принадлежало някога на Цицерон. След като Клавдий построил пристанище в Остия, по-късно разширено от Траян, голяма част от търговията на Рим се преместила там и Потиоли бавно загубил мястото си, макар да останал град с известно значение и в късната античност."
