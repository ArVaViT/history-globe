body:
  en:
    - "Minnith was a town of the Ammonite borderland east of the Jordan. When Jephthah defeated the Ammonites, “he smote them from Aroer, even till thou come to Minnith, even twenty cities, and unto the plain of the vineyards, with a very great slaughter. Thus the children of Ammon were subdued before the children of Israel.” Ezekiel’s lament over Tyre lists among Judah’s goods “wheat of Minnith, and Pannag, and honey, and oil, and balm”; whether this is the same Minnith, famed for its grain, is uncertain, since the ancient versions read the words differently and some scholars correct the text. The Bible says nothing more."
    - "Eusebius knew a village Maanith about four Roman miles from Heshbon on the road to Philadelphia (Amman), which fits the plateau between the two towns. The map marks first Umm el-Hanafish there and gives Khirbet Hamzeh and Khirbet el-Yadudeh as other guesses; no inscription names the town. The area lies today on the fertile plateau between Hisban and Amman in Jordan, still wheat country."
  ru:
    - "Миниф — город на пограничье Аммонитян к востоку от Иордана. Когда Иеффай разбил Аммонитян, он «поразил их поражением весьма великим, от Ароера до Минифа двадцать городов, и до Авель-Керамима, и смирились Аммонитяне пред сынами Израилевыми». В плаче Иезекииля о Тире среди товаров Иудеи названа пшеница Миннифская: Иудея и земля Израилева «за товар твой платили пшеницею Миннифскою и сластями, и медом, и деревянным маслом, и бальзамом». Тот ли это Миниф, славный хлебом, — неясно: древние переводы читают эти слова по-разному, и некоторые учёные исправляют текст. Больше Библия ничего не говорит."
    - "Евсевий знал селение Маанит примерно в четырёх римских милях от Есевона по дороге на Филадельфию (Амман), что подходит к плато между этими городами. На карте первым отмечен там Умм-эль-Ханафиш, а другими догадками даны Хирбет-Хамзе и Хирбет-эль-Ядуде; надписи с именем города не найдено. Сегодня это плодородное плато между Хисбаном и Амманом в Иордании, по-прежнему пшеничный край."
  uk:
    - "Мініт був містом пограниччя Аммону на схід від Йордану. Коли Єфтай переміг аммонійців, «І побив він їх страшенно, від Ароера до Минита двайцять міст, і аж до Абель-Керамиму, й впокорились Аммонїї перед синами Ізрайлевими». Плач Єзекіїля над Тиром перелічує серед товарів Юди «Миннитською пшеницею, пахощами, медом, оливою та балзамом»; чи це той самий Мініт, славний зерном, непевно, бо давні переклади читають слова по-різному, а деякі вчені виправляють текст. Більше Біблія нічого не каже."
    - "Євсевій знав село Маніт приблизно за чотири римські милі від Гесбона на дорозі до Філадельфії (Амман), що пасує плато між двома містами. Мапа першим позначає там Умм-ель-Ханафіш і дає Хірбет-Хамзе та Хірбет-ель-Ядуде як інші здогадки; жоден напис не називає міста. Ця місцевість лежить сьогодні на родючому плато між Хісбаном і Амманом в Йорданії, і досі хлібний край."
  es:
    - "Minit era una ciudad de la frontera amonita al este del Jordán. Cuando Jefté derrotó a los amonitas, «los hirió de grandísimo estrago desde Aroer hasta llegar á Minnith, veinte ciudades; y hasta la vega de las viñas. Así fueron domeñados los Ammonitas delante de los hijos de Israel». El lamento de Ezequiel sobre Tiro enumera entre los bienes de Judá «trigos de Minith, y pannah, y miel, y aceite, y resina»; si esta es la misma Minit, famosa por su grano, es incierto, pues las versiones antiguas leen las palabras de otro modo y algunos estudiosos corrigen el texto. La Biblia no dice nada más."
    - "Eusebio conoció una aldea Maanith a unas cuatro millas romanas de Hesbón, en el camino de Filadelfia (Amán), lo que concuerda con la meseta entre las dos ciudades. El mapa marca allí en primer lugar Umm el-Hanafish y da Khirbet Hamzeh y Khirbet el-Yadudeh como otras conjeturas; ninguna inscripción nombra la ciudad. La zona se halla hoy en la fértil meseta entre Hisban y Amán, en Jordania, todavía tierra de trigo."
  pt:
    - "Minite era uma cidade da fronteira amonita a leste do Jordão. Quando Jefté derrotou os amonitas, “Ele os feriu com grande matança, desde Aroer até chegar a Minite, num total de vinte cidades, e até Abel-Queramim. Assim os filhos de Amom foram subjugados diante dos filhos de Israel.” O lamento de Ezequiel por Tiro lista entre os bens de Judá “trigo de Minite, doces, mel, azeite e bálsamo”; se é a mesma Minite, famosa por seus grãos, é incerto, pois as versões antigas leem as palavras de modo diferente e alguns estudiosos corrigem o texto. A Bíblia nada mais diz."
    - "Eusébio conhecia uma aldeia Maanite a cerca de quatro milhas romanas de Hesbom, na estrada de Filadélfia (Amã), o que combina com o planalto entre as duas cidades. O mapa marca ali em primeiro lugar Umm el-Hanafish e dá Khirbet Hamzeh e Khirbet el-Yadudeh como outros palpites; nenhuma inscrição nomeia a cidade. A área fica hoje no fértil planalto entre Hisban e Amã, na Jordânia, ainda terra de trigo."
  de:
    - "Minnit war eine Stadt im ammonitischen Grenzland östlich des Jordan. Als Jeftah die Ammoniter besiegte, heißt es: „Und er schlug sie von Aroer an, bis wo man kommt gen Minnith, zwanzig Städte, und bis an den Plan der Weinberge, eine sehr große Schlacht. Und wurden also die Kinder Ammon gedemütigt vor den Kindern Israel.“ Hesekiels Klage über Tyrus nennt unter den Waren Judas „Weizen von Minnith und Balsam und Honig und Öl und Mastix“; ob es sich um dasselbe, für sein Getreide berühmte Minnit handelt, ist unsicher, da die alten Übersetzungen die Worte verschieden lesen und manche Gelehrte den Text verbessern. Mehr sagt die Bibel nicht."
    - "Eusebius kannte ein Dorf Maanith, etwa vier römische Meilen von Heschbon an der Straße nach Philadelphia (Amman), was zur Hochebene zwischen den beiden Städten passt. Die Karte zeigt dort zuerst Umm el-Hanafish und nennt Khirbet Hamzeh und Khirbet el-Yadudeh als weitere Vermutungen; keine Inschrift nennt die Stadt. Das Gebiet liegt heute auf der fruchtbaren Hochebene zwischen Hisban und Amman in Jordanien, noch immer Weizenland."
  fr:
    - "Minnith était une ville de la marche ammonite à l’est du Jourdain. Quand Jephthé vainquit les Ammonites, « il leur fit éprouver une très grande défaite, depuis Aroër jusque vers Minnith, espace qui renfermait vingt villes, et jusqu’à Abel-Keramim. Et les fils d’Ammon furent humiliés devant les enfants d’Israël. » La complainte d’Ézéchiel sur Tyr range parmi les marchandises de Juda « le froment de Minnith, la pâtisserie, le miel, l’huile et le baume » ; qu’il s’agisse de la même Minnith, réputée pour son grain, est incertain, car les versions anciennes lisent les mots différemment et certains savants corrigent le texte. La Bible n’en dit pas plus."
    - "Eusèbe connaissait un village Maanith à environ quatre milles romains de Hesbon sur la route de Philadelphie (Amman), ce qui convient au plateau entre les deux villes. La carte marque d’abord Umm el-Hanafish, et donne Khirbet Hamzeh et Khirbet el-Yadudeh comme autres hypothèses ; aucune inscription ne nomme la ville. La région se trouve aujourd’hui sur le plateau fertile entre Hisban et Amman, en Jordanie, toujours pays de blé."
  it:
    - "Minnit era una città della zona di confine ammonita a est del Giordano. Quando Iefte sconfisse gli Ammoniti, «egli inflisse loro una grandissima sconfitta, da Aroer fin verso Minnith, prendendo loro venti città, e fino ad Abel-Keramim. Così i figliuoli di Ammon furono umiliati dinanzi ai figliuoli d’Israele». Il lamento di Ezechiele su Tiro elenca tra le merci di Giuda «grano di Minnith, pasticcerie, miele, olio e balsamo»; se si tratti della stessa Minnit, famosa per il grano, è incerto, poiché le antiche versioni leggono le parole in modo diverso e alcuni studiosi correggono il testo. La Bibbia non dice altro."
    - "Eusebio conosceva un villaggio Maanith a circa quattro miglia romane da Chesbon sulla strada per Filadelfia (Amman), il che si accorda con l’altopiano tra le due città. La mappa segna per prima Umm el-Hanafish là e dà Khirbet Hamzeh e Khirbet el-Yadudeh come altre ipotesi; nessuna iscrizione nomina la città. La zona si trova oggi sul fertile altopiano tra Hisban e Amman in Giordania, ancora terra di grano."
  pl:
    - "Minnit było miastem na pograniczu ammonickim na wschód od Jordanu. Gdy Jefte pokonał Ammonitów, „poraził je od Aroer aż idąc do Menit, dwadzieścia miast, i aż do równiny winnic porażką bardzo wielką, a poniżeni są synowie Ammonowi przed syny Izraelskimi”. Lament Ezechiela nad Tyrem wymienia wśród dóbr Judy „pszenicę z Minnit i z Pannag, i miód, i oliwę, i kadzidło”; czy to ten sam Minnit, słynny ze zboża, jest niepewne, bo starożytne przekłady czytają te słowa inaczej, a niektórzy uczeni poprawiają tekst. Biblia nie mówi nic więcej."
    - "Euzebiusz znał wieś Maanith około czterech mil rzymskich od Cheszbonu przy drodze do Filadelfii (Ammanu), co pasuje do płaskowyżu między tymi dwoma miastami. Mapa zaznacza tam najpierw Umm el-Hanafish i podaje Khirbet Hamzeh i Khirbet el-Yadudeh jako inne domysły; żadna inskrypcja nie wymienia miasta. Obszar leży dziś na żyznym płaskowyżu między Hisban a Ammanem w Jordanii, wciąż kraju pszenicy."
  nl:
    - "Minnit was een stad in het Ammonitische grensgebied ten oosten van de Jordaan. Toen Jefta de Ammonieten versloeg, “sloeg hij hen van Aroer af tot daar gij komt te Minnith, twintig steden, en tot aan Abel-Keramim, met een zeer groten slag”. Zo werden de Ammonieten onderworpen voor het aangezicht van Israël. Ezechiëls klaaglied over Tyrus noemt onder de waren van Juda “tarwe van Minnit en Pannag, en honig, en olie, en balsem”; of dit dezelfde Minnit is, beroemd om zijn graan, is onzeker, aangezien de oude vertalingen de woorden anders lezen en sommige geleerden de tekst verbeteren. De Bijbel zegt er verder niets over."
    - "Eusebius kende een dorp Maanith ongeveer vier Romeinse mijlen van Chesbon aan de weg naar Filadelfia (Amman), wat past bij het plateau tussen de twee steden. De kaart toont daar eerst Umm el-Hanafish en geeft Khirbet Hamzeh en Khirbet el-Yadudeh als andere gissingen; geen inscriptie noemt de stad. Het gebied ligt tegenwoordig op het vruchtbare plateau tussen Hisban en Amman in Jordanië, nog steeds graanland."
  cs:
    - "Minit bylo město na amónském pomezí východně od Jordánu. Když Jiftách porazil Amónce, „pobil je od Aroer, až kudy se jde do Mennit, dvadceti měst, a až do Abel vinic porážkou velikou velmi; a sníženi jsou Ammonitští před syny Izraelskými“. Ezechielův nářek nad Týrem uvádí mezi zbožím Judy „pšenici Mennitskou i Fenickou, a med, olej i kadidlo“; zda jde o týž Minit, proslulý obilím, je nejisté, protože starověké překlady čtou slova různě a někteří badatelé text opravují. Bible už nic dalšího neříká."
    - "Eusebius znal vesnici Maanith asi čtyři římské míle od Chešbónu při cestě do Filadelfie (Ammánu), což odpovídá náhorní rovině mezi oběma městy. Mapa tam uvádí nejprve Umm el-Hanafish a jako další dohady Khirbet Hamzeh a Khirbet el-Yadudeh; žádný nápis město nejmenuje. Oblast leží dnes na úrodné náhorní rovině mezi Hisbánem a Ammánem v Jordánsku, dosud pšeničné zemi."
  sv:
    - "Minnit var en stad i det ammonitiska gränslandet öster om Jordan. När Jefta besegrade ammoniterna: ”Och han tillfogade dem ett mycket stort nederlag och intog landet från Aroer ända till fram emot Minnit, tjugu städer, och ända till Abel-Keramim. Alltså blevo Ammons barn kuvade under Israels barn.” Hesekiels klagosång över Tyros förtecknar bland Judas varor ”vete från Minnit, bakverk och honung, olja och balsam”; om detta är samma Minnit, berömt för sitt spannmål, är osäkert, eftersom de antika versionerna läser orden olika och vissa forskare korrigerar texten. Bibeln säger inget mer."
    - "Eusebios kände en by Maanith omkring fyra romerska mil från Heshbon vid vägen till Filadelfia (Amman), vilket passar högslätten mellan de två städerna. Kartan markerar först Umm el-Hanafish där och ger Khirbet Hamzeh och Khirbet el-Yadudeh som andra gissningar; ingen inskrift nämner staden. Området ligger i dag på den bördiga högslätten mellan Hisban och Amman i Jordanien, fortfarande vetebygd."
  nb:
    - "Minnit var en by i ammonittenes grenseland øst for Jordan. Da Jefta beseiret ammonittene, «han slo dem og tok fra dem landet fra Aroer til bortimot Minnit, tyve byer, og like til Abel-Keramim; det blev et svært mannefall, og Ammons barn blev ydmyket under Israels barn.» Esekiels klagesang over Tyros oppfører blant Judas varer «hvete fra Minnit og søte kaker og honning og olje og balsam»; om dette er den samme Minnit, kjent for sitt korn, er usikkert, siden de gamle oversettelsene leser ordene forskjellig og noen forskere retter teksten. Bibelen sier ikke mer."
    - "Eusebius kjente en landsby Maanith omkring fire romerske mil fra Hesjbon ved veien til Filadelfia (Amman), noe som passer med høylandet mellom de to byene. Kartet markerer først Umm el-Hanafish der og gir Khirbet Hamzeh og Khirbet el-Yadudeh som andre gjett; ingen innskrift nevner byen. Området ligger i dag på det fruktbare høylandet mellom Hisban og Amman i Jordan, fortsatt hvetebygd."
  tl:
    - "Ang Minnith ay bayan ng hangganan ng mga Ammonita sa silangan ng Jordan. Nang talunin ni Jephte ang mga Ammonita, “sinaktan niya ng di kawasang pagpatay mula sa Aroer hanggang sa Minnith, na may dalawang pung bayan, at hanggang sa Abelkeramim. Sa gayo'y sumuko ang mga anak ni Ammon sa mga anak ni Israel.” Itinatala ng panaghoy ni Ezekiel para sa Tiro sa mga kalakal ng Juda ang “trigo ng Minith, at ng pannag, at ng pulot, at ng langis, at ng balsamo”; hindi tiyak kung ito rin ang Minnith na tanyag sa butil nito, yamang magkaiba ang pagbasa ng mga sinaunang salin sa mga salita at itinatama ng ilang iskolar ang teksto. Wala nang iba pang sinasabi ang Biblia."
    - "Kilala ni Eusebio ang isang nayong Maanith mga apat na milyang Romano mula sa Hesbon sa daan patungong Filadelfia (Amman), na akma sa talampas sa pagitan ng dalawang bayan. Unang minamarkahan ng mapa roon ang Umm el-Hanafish at nagbibigay ng Khirbet Hamzeh at Khirbet el-Yadudeh bilang iba pang hula; walang inskripsiyong nagpapangalan sa bayan. Ang lugar ay nasa matabang talampas sa pagitan ng Hisban at Amman sa Jordan ngayon, bansa pa rin ng trigo."
  da:
    - "Minnit var en by i det ammonitiske grænseland øst for Jordan. Da Jefta besejrede ammonitterne: »Og han slog dem fra Aroer, og indtil man kommer til Minnith, tyve Stæder, og indtil Abel-Keramim med et saare stort Slag; saa bleve Ammons Børn ydmygede for Israels Børns Ansigt.« Ezekiels klagesang over Tyrus opregner blandt Judas varer »Hvede fra Minnit og søde Sager og Honning og Olie og Balsam gave de dig i Tusk«; om dette er den samme Minnit, berømt for sit korn, er usikkert, da de gamle oversættelser læser ordene forskelligt, og nogle forskere retter teksten. Bibelen siger intet mere."
    - "Eusebios kendte en landsby Maanith omkring fire romerske mil fra Hesjbon på vejen til Filadelfia (Amman), hvilket passer til højsletten mellem de to byer. Kortet markerer først Umm el-Hanafish dér og giver Khirbet Hamzeh og Khirbet el-Yadudeh som andre gæt; ingen indskrift nævner byen. Området ligger i dag på den frugtbare højslette mellem Hisban og Amman i Jordan, stadig hvedeland."
  sr:
    - "Минит је био град на амонској граничној земљи источно од Јордана. Када је Јефтај победио Амонце, „И поби их од Ароира па до Минита у двадесет градова и до равнице виноградске у боју врло великом; и синови Амонови бише покорени пред синовима Израиљевим.“ Језекиљева тужбалица над Тиром наводи међу робом Јуде „са пшеницом минитском и финичком и медом и уљем и балсамом“; да ли је то исти Минит, прочувен по житу, неизвесно је, јер древни преводи ове речи читају различито, а неки научници исправљају текст. Библија више ништа не каже."
    - "Јевсевије је знао село Маанит око четири римске миље од Есевона на путу за Филаделфију (Аман), што одговара висоравни између ова два града. Мапа ту прво означава Умм ел-Ханафиш и даје Хирбет Хамзу и Хирбет ел-Јадуде као друге претпоставке; ниједан натпис не именује град. Подручје данас лежи на плодној висоравни између Хисбана и Амана у Јордану, и даље земља жита."
  hu:
    - "Minnit város volt az ammóni határvidéken, a Jordántól keletre. Amikor Jefte legyőzte az ammónikat, „veré őket Aroertől fogva mindaddig, míg mennél Minnithbe, húsz városon át, és egész Abel-Keraminig nagy vérontással, és az Ammon fiai megaláztattak az Izráel fiai előtt”. Ezékiel Tírusz fölötti siralma Júda áruinak sorában említi „búzát Minnithből és édes süteményt és mézet és olajat és balzsamot”; hogy ez ugyanaz a Minnit-e, gabonájáról híres, bizonytalan, mert az ókori fordítások másképp olvassák a szavakat, és egyes tudósok javítják a szöveget. A Biblia többet nem mond."
    - "Eusebius ismert egy Maanith falut Hesbontól mintegy négy római mérföldre, a Filadelfia (Amman) felé vezető úton, ami a két város közötti fennsíkra illik. A térkép elsőként az Umm el-Hanafisht jelöli ott, és a Khirbet Hamzeh-t és a Khirbet el-Yadudeh-t adja más találgatásként; felirat nem nevezi meg a várost. A terület ma a Hisban és Amman közötti termékeny fennsík Jordániában, még mindig búzavidék."
  fi:
    - "Minnit oli kaupunki Ammonin rajamaalla Jordanin itäpuolella. Kun Jefta voitti ammonilaiset, ”hän tuotti heille hyvin suuren tappion, valloittaen maan Aroerista Minnitiin ja Aabel-Keramimiin asti, kaksikymmentä kaupunkia. Niin täytyi ammonilaisten nöyrtyä israelilaisten edessä.” Hesekielin valitus Tyroksesta luettelee Juudan tavaroiden joukossa ”Minnitin nisulla, leivoksilla, hunajalla, öljyllä ja balsamilla”; onko tämä sama Minnit, viljastaan kuuluisa, on epävarmaa, sillä muinaiset käännökset lukevat sanat eri tavoin ja jotkut tutkijat korjaavat tekstiä. Raamattu ei sano enempää."
    - "Eusebios tunsi kylän nimeltä Maanith noin neljän roomalaisen mailin päässä Hesbonista Filadelfiaan (Amman) johtavan tien varrella, mikä sopii kahden kaupungin väliselle ylätasangolle. Kartta merkitsee sinne ensin Umm el-Hanafishin ja antaa muiksi arvauksiksi Khirbet Hamzehin ja Khirbet el-Yadudehin; mikään kirjoitus ei nimeä kaupunkia. Alue sijaitsee nykyään Hisbanin ja Ammanin välisellä hedelmällisellä ylätasangolla Jordaniassa, yhä vehnämaata."
  vi:
    - "Min-nít là một thành ở vùng biên giới Am-môn phía đông sông Giô-đanh. Khi Giép-thê đánh bại người Am-môn: “Người đánh bại chúng nó từ A-rô-e cho đến Mi-nít, và cho đến A-bên-Kê-ra-mim, cùng chiếm lấy của chúng nó hai mươi cái thành. Ấy là một trận-bại rất lớn; dân Am-môn bị phục trước mặt dân Y-sơ-ra-ên”. Bài than của Ê-xê-chi-ên về Ty-rơ liệt kê trong hàng hóa của Giu-đa “những lúa mì ở Min-nít, bánh ngọt, mật ong, dầu, và nhũ hương”; không chắc đó có phải cùng Min-nít, nổi tiếng về lúa, vì các bản dịch cổ đọc những chữ ấy khác nhau và một số học giả sửa văn bản. Kinh Thánh không nói gì thêm."
    - "Eusebius biết một làng Maanith cách Hết-bôn khoảng bốn dặm La Mã trên đường đến Phi-la-đen-phi (Amman), phù hợp với cao nguyên giữa hai thành. Bản đồ đánh dấu trước hết Umm el-Hanafish ở đó và đưa Khirbet Hamzeh và Khirbet el-Yadudeh làm các phỏng đoán khác; không bản khắc nào nêu tên thành. Khu vực ngày nay nằm trên cao nguyên phì nhiêu giữa Hisban và Amman ở Gióc-đa-ni, vẫn là xứ lúa mì."
  ro:
    - "Minit era o cetate din ținutul de graniță al Amonului, la est de Iordan. Când Ieftae i-a învins pe amoniți, „i-a bătut pre ei dela Aroir până la intrarea în Semenit, douăzeci de cetăți, și până la viile lui Avel, cu bătae mare foarte, și s’au umilit fiii lui Amon dela fața fiilor lui Israil”. Plângerea lui Ezechiel asupra Tirului înșiră printre bunurile lui Iuda grâu din Minit, Pannag, miere, untdelemn și rășină; dacă este același Minit, vestit pentru grâul său, este nesigur, fiindcă versiunile antice citesc cuvintele altfel, iar unii cercetători corectează textul. Biblia nu mai spune nimic."
    - "Eusebiu cunoștea un sat Maanith la circa patru mile romane de Hesbon, pe drumul spre Filadelfia (Amman), ceea ce se potrivește cu podișul dintre cele două cetăți. Harta marchează întâi acolo Umm el-Hanafish și dă ca alte presupuneri Khirbet Hamzeh și Khirbet el-Yadudeh; nicio inscripție nu numește cetatea. Zona se află astăzi pe fertilul podiș dintre Hisban și Amman în Iordania, încă țară a grâului."
  bg:
    - "Минит е бил град в амонските погранични земи на изток от Йордан. Когато Йефтай разби амонците, той „ги порази от Ароир дори до Минит, двадесет градове, и до Авел-керамим с поражение твърде голямо. И покориха се Амоновите синове пред Израилевите синове.“ Плачът на Йезекиил за Тир изброява сред стоките на Юда „жито Менитско, и сухар, и мед, и елей, и балсама“; дали това е същият Минит, прочут със зърното си, е несигурно, тъй като древните преводи четат думите различно и някои учени поправят текста. Библията не казва нищо повече."
    - "Евсевий познава село Маанит на около четири римски мили от Есевон по пътя за Филаделфия (Аман), което подхожда на платото между двата града. Картата отбелязва на първо място Ум ел-Ханафиш там и дава Хирбет Хамзе и Хирбет ел-Ядуде като други догадки; никакъв надпис не назовава града. Районът днес се намира на плодородното плато между Хисбан и Аман в Йордания, все още земя на пшеница."
