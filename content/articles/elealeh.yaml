body:
  en:
    - "Elealeh was a town on the Moabite plateau east of the Dead Sea, a near neighbour of Heshbon, with which it is always named. The name survives in el-'Al, a village on a hill about 3 km north-east of Hisban in Jordan. Eusebius already knew it as a large village no more than a mile from Esbus. The site is known from surface surveys of the Hesban region rather than from excavation, and nothing found there names the town."
    - "Elealeh is one of the towns of the good cattle country for which Reuben and Gad asked Moses, “Ataroth, and Dibon, and Jazer, and Nimrah, and Heshbon, and Elealeh”; afterwards “the children of Reuben built Heshbon, and Elealeh, and Kirjathaim”. By the days of the prophets it was Moab's, and it suffers in Moab's doom: “Heshbon shall cry, and Elealeh: their voice shall be heard even unto Jahaz”; Isaiah weeps for its vines, “I will water thee with my tears, O Heshbon, and Elealeh”, and Jeremiah repeats the cry “from the cry of Heshbon even unto Elealeh”."
    - "That is all the record holds. The village of el-'Al today belongs to the Amman governorate of Jordan, within sight of the mound of Hisban, the biblical Heshbon."
  ru:
    - "Елеале — город на моавитском плато к востоку от Мёртвого моря, ближайший сосед Есевона, с которым он всегда назван вместе. Имя сохранилось в Эль-Але, деревне на холме примерно в 3 км к северо-востоку от Хисбана в Иордании. Евсевий уже знал его как большое селение не более чем в миле от Есбуса. Место известно по наземным обследованиям округи Хесбана, а не по раскопкам, и ничто найденное там не называет города."
    - "Елеале — один из городов доброй скотоводческой земли, которую Рувим и Гад просили у Моисея: «Атароф и Дивон, и Иазер, и Нимра, и Есевон, и Елеале»; затем «сыны Рувимовы построили Есевон, Елеале, Кириафаим». Ко дням пророков он был моавитским и разделяет участь Моава: «И вопит Есевон и Елеала; голос их слышится до самой Иаацы»; Исаия плачет о его лозах: «буду обливать тебя слезами моими, Есевон и Елеала», а Иеремия повторяет вопль «от вопля Есевона до Елеалы»."
    - "Больше запись ничего не хранит. Деревня Эль-Аль сегодня относится к столичной мухафазе Амман в Иордании, в виду холма Хисбан, библейского Есевона."
  uk:
    - "Елеале було містом на моавському плато на схід від Мертвого моря, близьким сусідом Гесбона, з яким його завжди називають разом. Назва збереглася в ель-Аль, селі на пагорбі приблизно за 3 км на північний схід від Хісбана в Йорданії. Євсевій уже знав його як велике село не далі як за милю від Есбуса. Місце відоме з поверхневих обстежень околиць Хесбана, а не з розкопок, і ніщо знайдене там не називає міста."
    - "Елеале — одне з міст доброї скотарської країни, про яку Рувим і Гад просили Мойсея: «Атарот та Дибон та Язер та Нимра та Гесбон та Єлале»; потім «сини Рубенові побудували: Гезбон та Єлале та Кирятаїм». За днів пророків воно було моавським і страждає в долі Моаву: «Есебон і Елеала голосять; крик їх доходить аж до Яази»; Ісая плаче над його виноградниками: «поливати му сльозами тебе, Есевоне й Елеало!», а Єремія повторює голосіння: «Од плачу в Есевонї аж до Елеали»."
    - "Це все, що містить запис. Село ель-Аль сьогодні належить до провінції Амман в Йорданії, у видноті горба Хісбан, біблійного Гесбона."
  es:
    - "Eleale era una ciudad de la meseta moabita al este del mar Muerto, vecina cercana de Hesbón, con la que se nombra siempre. El nombre sobrevive en el-'Al, una aldea en una colina a unos 3 km al nordeste de Hisban, en Jordania. Eusebio ya la conocía como una gran aldea a no más de una milla de Esbus. El sitio se conoce por prospecciones de superficie de la región de Hesbán más que por excavaciones, y nada de lo hallado allí nombra la ciudad."
    - "Eleale es una de las ciudades de la buena tierra de ganado que Rubén y Gad pidieron a Moisés, «Ataroth, y Dibón, y Jazer, y Nimra, y Hesbón, y Eleale»; después «los hijos de Rubén edificaron á Hesbón, y á Eleale, y á Kiriathaim». En los días de los profetas era de Moab, y sufre en la condena de Moab: «Hesbón y Eleale gritarán, hasta Jahas se oirá su voz»; Isaías llora por sus viñas, «embriagarte hé de mis lágrimas, oh Hesbón y Eleale», y Jeremías repite el clamor «desde Hesbón hasta Eleale»."
    - "Eso es todo lo que contiene el registro. La aldea de el-'Al pertenece hoy a la gobernación de Amán, en Jordania, a la vista del montículo de Hisban, la Hesbón bíblica."
  pt:
    - "Eleale era uma cidade do planalto moabita a leste do Mar Morto, vizinha próxima de Hesbom, com a qual é sempre nomeada. O nome sobrevive em el-'Al, uma aldeia numa colina a cerca de 3 km a nordeste de Hisban, na Jordânia. Eusébio já a conhecia como uma grande aldeia a não mais de uma milha de Esbus. O local é conhecido por levantamentos de superfície da região de Hesban e não por escavação, e nada achado ali nomeia a cidade."
    - "Eleale é uma das cidades da boa terra de gado que Rúben e Gade pediram a Moisés: “Atarote, Dibom, Jazer, Ninra, Hesbom, Eleale”; depois “Os filhos de Rúben construíram Hesbom, Eleale, Quiriataim”. Nos dias dos profetas era de Moabe, e sofre na condenação de Moabe: “Hesbom clama com Eleale. Sua voz é ouvida até Jaza”; Isaías chora por suas vinhas: “Eu regarei vocês com as minhas lágrimas, Hesbom e Eleale”, e Jeremias repete o clamor: “Do clamor de Hesbom até Eleale”."
    - "Isso é tudo o que o registro guarda. A aldeia de el-'Al pertence hoje à província de Amã, na Jordânia, à vista do monte de Hisban, a Hesbom bíblica."
  de:
    - "Elale war eine Stadt auf der moabitischen Hochebene östlich des Toten Meeres, ein enger Nachbar von Heschbon, mit dem es immer zusammen genannt wird. Der Name lebt in el-‘Al fort, einem Dorf auf einem Hügel etwa 3 km nordöstlich von Hisban in Jordanien. Eusebius kannte es bereits als großes Dorf, nicht mehr als eine Meile von Esbus entfernt. Der Ort ist aus Oberflächenuntersuchungen der Region Hesban bekannt, nicht aus Ausgrabungen, und nichts dort Gefundenes nennt die Stadt."
    - "Elale gehört zu den Städten des guten Viehlandes, um das Ruben und Gad Mose baten: „Ataroth, Dibon, Jaser, Nimra, Hesbon, Eleale“; später: „Die Kinder Ruben bauten Hesbon, Eleale, Kirjathaim“. Zur Zeit der Propheten gehörte es Moab und erleidet dessen Untergang: „Hesbon und Eleale schreien, daß man’s zu Jahza hört“; Jesaja klagt: „Darum weine ich um Jaser und um den Weinstock zu Sibma und vergieße viel Tränen um Hesbon und Eleale“, und Jeremia wiederholt den Schrei „von des Geschreies wegen zu Hesbon bis gen Eleale“."
    - "Das ist alles, was die Überlieferung enthält. Das Dorf el-‘Al gehört heute zum Gouvernement Amman in Jordanien, in Sichtweite des Hügels von Hisban, dem biblischen Heschbon."
  fr:
    - "Élealé était une ville du plateau moabite à l’est de la mer Morte, proche voisine de Hesbon, avec laquelle elle est toujours nommée. Le nom survit dans el-’Al, village sur une colline à environ 3 km au nord-est de Hisban, en Jordanie. Eusèbe la connaissait déjà comme un grand village à un mille tout au plus d’Esbus. Le site est connu par des prospections de surface de la région de Hesban plutôt que par des fouilles, et rien de ce qu’on y a trouvé ne nomme la ville."
    - "Élealé est l’une des villes du bon pays d’élevage que Ruben et Gad demandèrent à Moïse : « Atharoth, Dibon, Jaezer, Nimra, Hesbon, Élealé » ; ensuite « les fils de Ruben bâtirent Hesbon, Élealé et Kirjathaïm ». Au temps des prophètes, elle appartenait à Moab et partage son destin : « Hesbon et Élealé poussent des cris, on entend leur voix jusqu’à Jahats » ; Ésaïe pleure sur ses vignes : « Je vous arrose de mes larmes, Hesbon, Élealé ! », et Jérémie reprend le cri : « Les cris de Hesbon retentissent jusqu’à Élealé »."
    - "C’est tout ce que contient le récit. Le village d’el-’Al appartient aujourd’hui au gouvernorat d’Amman, en Jordanie, en vue du tertre de Hisban, l’Hesbon biblique."
  it:
    - "Eleale era una città dell’altopiano moabita a est del Mar Morto, vicina a Chesbon, con la quale è sempre nominata. Il nome sopravvive in el-‘Al, un villaggio su una collina a circa 3 km a nord-est di Hisban in Giordania. Eusebio la conosceva già come un grande villaggio a non più di un miglio da Esbus. Il sito è noto da ricognizioni di superficie della regione di Hesban più che da scavi, e nulla di quanto vi è stato trovato nomina la città."
    - "Eleale è una delle città del buon paese da bestiame che Ruben e Gad chiesero a Mosè: «Ataroth, Dibon, Iazer, Nimrah, Heshbon, Elealeh»; in seguito «i figliuoli di Ruben edificarono Heshbon, Elealeh, Kiriathaim». Ai giorni dei profeti era di Moab, e ne subisce il destino: «Heshbon ed Elealeh gridano; la loro voce s’ode fino a Jahats»; Isaia piange per le sue vigne: «io v’irrigo delle mie lacrime, o Heshbon, o Elealeh!», e Geremia ripete il grido: «Gli alti lamenti di Heshbon giungon fino a Elealeh»."
    - "È tutto ciò che il racconto contiene. Il villaggio di el-‘Al appartiene oggi al governatorato di Amman in Giordania, in vista del tell di Hisban, la biblica Chesbon."
  pl:
    - "Eleale było miastem na płaskowyżu Moabu na wschód od Morza Martwego, bliskim sąsiadem Cheszbonu, z którym zawsze jest wymieniane. Nazwa przetrwała w el-Al, wsi na wzgórzu około 3 km na północny wschód od Chisbanu w Jordanii. Euzebiusz znał je już jako dużą wieś nie dalej niż o milę od Esbus. Miejsce znane jest z badań powierzchniowych regionu Chisban, a nie z wykopalisk, i nic tam znalezionego nie wymienia nazwy miasta."
    - "Eleale należy do miast dobrego kraju pasterskiego, o który Ruben i Gad prosili Mojżesza: „Ataret i Dybon, i Jazer, i Nemra, i Hesebon, i Eleale”; potem „Synowie też Rubenowi pobudowali Hesebon, i Eleale, i Karyjataim”. Za dni proroków należało do Moabu i cierpi w wyroku na Moab: „I będzie wołał Hesebon i Eleale, aż w Jahas słyszany będzie głos ich”; Izajasz opłakuje jego winorośle: „oblewam się łzami mojemi, o Hesebonie, i Eleale!”, a Jeremiasz powtarza ten krzyk: „Bardziej krzyczeć będą niż Hesebończycy; aż do Eleale”."
    - "Na tym kończy się wszystko, co zapisano. Wieś el-Al należy dziś do muhafazy Amman w Jordanii, w zasięgu wzroku kopca Chisban, biblijnego Cheszbonu."
  nl:
    - "Eleale was een stad op het Moabitische plateau ten oosten van de Dode Zee, een naaste buur van Chesbon, met wie het altijd wordt genoemd. De naam leeft voort in el-'Al, een dorp op een heuvel zo'n 3 km ten noordoosten van Hisban in Jordanië. Eusebius kende het al als een groot dorp op niet meer dan een mijl van Esbus. De plaats is bekend uit oppervlakteonderzoek van de Hesbon-streek en niet uit opgraving, en niets daar gevonden noemt de stad."
    - "Eleale is een van de steden van het goede veeland waarom Ruben en Gad aan Mozes vroegen: “Ataroth, en Dibon, en Jaezer, en Nimra, en Hesbon, en Eleale”; daarna “de kinderen van Ruben bouwden Hezbon, en Eleale, en Kirjathaim”. In de dagen van de profeten was het Moabs, en het deelt in Moabs ondergang: “Zo Hesbon als Eleale schreeuwt, hun stem wordt gehoord tot Jahaz toe”; Jesaja beweent zijn wijnstokken, “ik maak u doornat met mijn tranen, o Hesbon en Eleale!”, en Jeremia herhaalt de kreet “Vanwege Hesbons gekrijt tot Eleale toe”."
    - "Meer weet het archief niet. Het dorp el-'Al hoort nu bij het gouvernement Amman van Jordanië, in zicht van de heuvel Hisban, het bijbelse Chesbon."
  cs:
    - "Elale bylo město na moábské plošině východně od Mrtvého moře, blízký soused Chešbónu, s nímž je vždy jmenováno. Jméno se zachovalo v el-'Al, vesnici na pahorku asi 3 km severovýchodně od Hisbanu v Jordánsku. Eusebios je již znal jako velkou vesnici ne dále než míli od Esbu. Místo je známo z povrchových průzkumů oblasti Hesban, ne z vykopávek, a nic tam nalezeného město nejmenuje."
    - "Elale je jedno z měst dobré pastevní země, o niž Rúben a Gád žádali Mojžíše, „Atarot a Dibon, a Jazer a Nemra, Ezebon a Eleale“; potom „Synové pak Ruben vystavěli Ezebon, Eleale a Kariataim“. Za dnů proroků bylo moábské a postihuje je Moábův soud: „křičeti bude Ezebon a Eleale, až v Jasa slyšán bude hlas jejich“; Izajáš oplakává jeho vinice: „svlažuji tě slzami svými, ó Ezebon a Eleale“ a Jeremjáš opakuje křik: „Více křičeti budou než Ezebonští, až do Eleale“."
    - "To je vše, co záznam obsahuje. Vesnice el-'Al dnes patří k ammánskému guvernorátu Jordánska, v dohledu pahorku Hisban, biblického Chešbónu."
