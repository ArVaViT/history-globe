body:
  en:
    - "Elealeh was a town on the Moabite plateau east of the Dead Sea, a near neighbour of Heshbon, with which it is always named. The name survives in el-'Al, a village on a hill about 3 km north-east of Hisban in Jordan. Eusebius already knew it as a large village no more than a mile from Esbus. The site is known from surface surveys of the Hesban region rather than from excavation, and nothing found there names the town."
    - "Elealeh is one of the towns of the good cattle country for which Reuben and Gad asked Moses, “Ataroth, and Dibon, and Jazer, and Nimrah, and Heshbon, and Elealeh”; afterwards “the children of Reuben built Heshbon, and Elealeh, and Kirjathaim”. By the days of the prophets it was Moab's, and it suffers in Moab's doom: “Heshbon shall cry, and Elealeh: their voice shall be heard even unto Jahaz”; Isaiah weeps for it, “I will water thee with my tears, O Heshbon, and Elealeh”, and Jeremiah repeats the cry “from the cry of Heshbon even unto Elealeh”."
    - "That is all the record holds. The village of el-'Al today lies in Jordan, within sight of the mound of Hisban, the biblical Heshbon."
  ru:
    - "Елеале — город на моавитском плато к востоку от Мёртвого моря, ближайший сосед Есевона, с которым он всегда назван вместе. Имя сохранилось в Эль-Але, деревне на холме примерно в 3 км к северо-востоку от Хисбана в Иордании. Евсевий уже знал его как большое селение не более чем в миле от Есбуса. Место известно по наземным обследованиям округи Хесбана, а не по раскопкам, и ничто найденное там не называет города."
    - "Елеале — один из городов доброй скотоводческой земли, которую Рувим и Гад просили у Моисея: «Атароф и Дивон, и Иазер, и Нимра, и Есевон, и Елеале»; затем «сыны Рувимовы построили Есевон, Елеале, Кириафаим». Ко дням пророков он был моавитским и разделяет участь Моава: «И вопит Есевон и Елеала; голос их слышится до самой Иаацы»; Исаия плачет о нём: «буду обливать тебя слезами моими, Есевон и Елеала», а Иеремия повторяет вопль «от вопля Есевона до Елеалы»."
    - "Больше запись ничего не хранит. Деревня Эль-Аль сегодня лежит в Иордании, в виду холма Хисбан, библейского Есевона."
  uk:
    - "Елеале було містом на моавському плато на схід від Мертвого моря, близьким сусідом Гесбона, з яким його завжди називають разом. Назва збереглася в ель-Аль, селі на пагорбі приблизно за 3 км на північний схід від Хісбана в Йорданії. Євсевій уже знав його як велике село не далі як за милю від Есбуса. Місце відоме з поверхневих обстежень околиць Хесбана, а не з розкопок, і ніщо знайдене там не називає міста."
    - "Елеале — одне з міст доброї скотарської країни, про яку Рувим і Гад просили Мойсея: «Атарот та Дибон та Язер та Нимра та Гесбон та Єлале»; потім «сини Рубенові побудували: Гезбон та Єлале та Кирятаїм». За днів пророків воно було моавським і страждає в долі Моаву: «Есебон і Елеала голосять; крик їх доходить аж до Яази»; Ісая плаче над ним: «поливати му сльозами тебе, Есевоне й Елеало!», а Єремія повторює голосіння: «Од плачу в Есевонї аж до Елеали»."
    - "Це все, що містить запис. Село ель-Аль сьогодні лежить у Йорданії, у видноті горба Хісбан, біблійного Гесбона."
  es:
    - "Eleale era una ciudad de la meseta moabita al este del mar Muerto, vecina cercana de Hesbón, con la que se nombra siempre. El nombre sobrevive en el-'Al, una aldea en una colina a unos 3 km al nordeste de Hisban, en Jordania. Eusebio ya la conocía como una gran aldea a no más de una milla de Esbus. El sitio se conoce por prospecciones de superficie de la región de Hesbán más que por excavaciones, y nada de lo hallado allí nombra la ciudad."
    - "Eleale es una de las ciudades de la buena tierra de ganado que Rubén y Gad pidieron a Moisés, «Ataroth, y Dibón, y Jazer, y Nimra, y Hesbón, y Eleale»; después «los hijos de Rubén edificaron á Hesbón, y á Eleale, y á Kiriathaim». En los días de los profetas era de Moab, y sufre en la condena de Moab: «Hesbón y Eleale gritarán, hasta Jahas se oirá su voz»; Isaías llora por ella, «embriagarte hé de mis lágrimas, oh Hesbón y Eleale», y Jeremías repite el clamor «desde Hesbón hasta Eleale»."
    - "Eso es todo lo que contiene el registro. La aldea de el-'Al se encuentra hoy en Jordania, a la vista del montículo de Hisban, la Hesbón bíblica."
  pt:
    - "Eleale era uma cidade do planalto moabita a leste do Mar Morto, vizinha próxima de Hesbom, com a qual é sempre nomeada. O nome sobrevive em el-'Al, uma aldeia numa colina a cerca de 3 km a nordeste de Hisban, na Jordânia. Eusébio já a conhecia como uma grande aldeia a não mais de uma milha de Esbus. O local é conhecido por levantamentos de superfície da região de Hesban e não por escavação, e nada achado ali nomeia a cidade."
    - "Eleale é uma das cidades da boa terra de gado que Rúben e Gade pediram a Moisés: “Atarote, Dibom, Jazer, Ninra, Hesbom, Eleale”; depois “Os filhos de Rúben construíram Hesbom, Eleale, Quiriataim”. Nos dias dos profetas era de Moabe, e sofre na condenação de Moabe: “Hesbom clama com Eleale. Sua voz é ouvida até Jaza”; Isaías chora por ela: “Eu regarei vocês com as minhas lágrimas, Hesbom e Eleale”, e Jeremias repete o clamor: “Do clamor de Hesbom até Eleale”."
    - "Isso é tudo o que o registro guarda. A aldeia de el-'Al fica hoje na Jordânia, à vista do monte de Hisban, a Hesbom bíblica."
  de:
    - "Elale war eine Stadt auf der moabitischen Hochebene östlich des Toten Meeres, ein enger Nachbar von Heschbon, mit dem es immer zusammen genannt wird. Der Name lebt in el-‘Al fort, einem Dorf auf einem Hügel etwa 3 km nordöstlich von Hisban in Jordanien. Eusebius kannte es bereits als großes Dorf, nicht mehr als eine Meile von Esbus entfernt. Der Ort ist aus Oberflächenuntersuchungen der Region Hesban bekannt, nicht aus Ausgrabungen, und nichts dort Gefundenes nennt die Stadt."
    - "Elale gehört zu den Städten des guten Viehlandes, um das Ruben und Gad Mose baten: „Ataroth, Dibon, Jaser, Nimra, Hesbon, Eleale“; später: „Die Kinder Ruben bauten Hesbon, Eleale, Kirjathaim“. Zur Zeit der Propheten gehörte es Moab und erleidet dessen Untergang: „Hesbon und Eleale schreien, daß man’s zu Jahza hört“; Jesaja klagt: „Darum weine ich um Jaser und um den Weinstock zu Sibma und vergieße viel Tränen um Hesbon und Eleale“, und Jeremia wiederholt den Schrei „von des Geschreies wegen zu Hesbon bis gen Eleale“."
    - "Das ist alles, was die Überlieferung enthält. Das Dorf el-‘Al liegt heute in Jordanien, in Sichtweite des Hügels von Hisban, dem biblischen Heschbon."
  fr:
    - "Élealé était une ville du plateau moabite à l’est de la mer Morte, proche voisine de Hesbon, avec laquelle elle est toujours nommée. Le nom survit dans el-’Al, village sur une colline à environ 3 km au nord-est de Hisban, en Jordanie. Eusèbe la connaissait déjà comme un grand village à un mille tout au plus d’Esbus. Le site est connu par des prospections de surface de la région de Hesban plutôt que par des fouilles, et rien de ce qu’on y a trouvé ne nomme la ville."
    - "Élealé est l’une des villes du bon pays d’élevage que Ruben et Gad demandèrent à Moïse : « Atharoth, Dibon, Jaezer, Nimra, Hesbon, Élealé » ; ensuite « les fils de Ruben bâtirent Hesbon, Élealé et Kirjathaïm ». Au temps des prophètes, elle appartenait à Moab et partage son destin : « Hesbon et Élealé poussent des cris, on entend leur voix jusqu’à Jahats » ; Ésaïe pleure sur elle : « Je vous arrose de mes larmes, Hesbon, Élealé ! », et Jérémie reprend le cri : « Les cris de Hesbon retentissent jusqu’à Élealé »."
    - "C’est tout ce que contient le récit. Le village d’el-’Al se trouve aujourd’hui en Jordanie, en vue du tertre de Hisban, l’Hesbon biblique."
  it:
    - "Eleale era una città dell’altopiano moabita a est del Mar Morto, vicina a Chesbon, con la quale è sempre nominata. Il nome sopravvive in el-‘Al, un villaggio su una collina a circa 3 km a nord-est di Hisban in Giordania. Eusebio la conosceva già come un grande villaggio a non più di un miglio da Esbus. Il sito è noto da ricognizioni di superficie della regione di Hesban più che da scavi, e nulla di quanto vi è stato trovato nomina la città."
    - "Eleale è una delle città del buon paese da bestiame che Ruben e Gad chiesero a Mosè: «Ataroth, Dibon, Iazer, Nimrah, Heshbon, Elealeh»; in seguito «i figliuoli di Ruben edificarono Heshbon, Elealeh, Kiriathaim». Ai giorni dei profeti era di Moab, e ne subisce il destino: «Heshbon ed Elealeh gridano; la loro voce s’ode fino a Jahats»; Isaia piange per essa: «io v’irrigo delle mie lacrime, o Heshbon, o Elealeh!», e Geremia ripete il grido: «Gli alti lamenti di Heshbon giungon fino a Elealeh»."
    - "È tutto ciò che il racconto contiene. Il villaggio di el-‘Al si trova oggi in Giordania, in vista del tell di Hisban, la biblica Chesbon."
  pl:
    - "Eleale było miastem na płaskowyżu Moabu na wschód od Morza Martwego, bliskim sąsiadem Cheszbonu, z którym zawsze jest wymieniane. Nazwa przetrwała w el-Al, wsi na wzgórzu około 3 km na północny wschód od Chisbanu w Jordanii. Euzebiusz znał je już jako dużą wieś nie dalej niż o milę od Esbus. Miejsce znane jest z badań powierzchniowych regionu Chisban, a nie z wykopalisk, i nic tam znalezionego nie wymienia nazwy miasta."
    - "Eleale należy do miast dobrego kraju pasterskiego, o który Ruben i Gad prosili Mojżesza: „Ataret i Dybon, i Jazer, i Nemra, i Hesebon, i Eleale”; potem „Synowie też Rubenowi pobudowali Hesebon, i Eleale, i Karyjataim”. Za dni proroków należało do Moabu i cierpi w wyroku na Moab: „I będzie wołał Hesebon i Eleale, aż w Jahas słyszany będzie głos ich”; Izajasz opłakuje je: „oblewam się łzami mojemi, o Hesebonie, i Eleale!”, a Jeremiasz powtarza ten krzyk: „Bardziej krzyczeć będą niż Hesebończycy; aż do Eleale”."
    - "Na tym kończy się wszystko, co zapisano. Wieś el-Al leży dziś w Jordanii, w zasięgu wzroku kopca Chisban, biblijnego Cheszbonu."
  nl:
    - "Eleale was een stad op het Moabitische plateau ten oosten van de Dode Zee, een naaste buur van Chesbon, met wie het altijd wordt genoemd. De naam leeft voort in el-'Al, een dorp op een heuvel zo'n 3 km ten noordoosten van Hisban in Jordanië. Eusebius kende het al als een groot dorp op niet meer dan een mijl van Esbus. De plaats is bekend uit oppervlakteonderzoek van de Hesbon-streek en niet uit opgraving, en niets daar gevonden noemt de stad."
    - "Eleale is een van de steden van het goede veeland waarom Ruben en Gad aan Mozes vroegen: “Ataroth, en Dibon, en Jaezer, en Nimra, en Hesbon, en Eleale”; daarna “de kinderen van Ruben bouwden Hezbon, en Eleale, en Kirjathaim”. In de dagen van de profeten was het Moabs, en het deelt in Moabs ondergang: “Zo Hesbon als Eleale schreeuwt, hun stem wordt gehoord tot Jahaz toe”; Jesaja beweent het, “ik maak u doornat met mijn tranen, o Hesbon en Eleale!”, en Jeremia herhaalt de kreet “Vanwege Hesbons gekrijt tot Eleale toe”."
    - "Meer weet het archief niet. Het dorp el-'Al ligt nu in Jordanië, in zicht van de heuvel Hisban, het bijbelse Chesbon."
  cs:
    - "Elale bylo město na moábské plošině východně od Mrtvého moře, blízký soused Chešbónu, s nímž je vždy jmenováno. Jméno se zachovalo v el-'Al, vesnici na pahorku asi 3 km severovýchodně od Hisbanu v Jordánsku. Eusebios je již znal jako velkou vesnici ne dále než míli od Esbu. Místo je známo z povrchových průzkumů oblasti Hesban, ne z vykopávek, a nic tam nalezeného město nejmenuje."
    - "Elale je jedno z měst dobré pastevní země, o niž Rúben a Gád žádali Mojžíše, „Atarot a Dibon, a Jazer a Nemra, Ezebon a Eleale“; potom „Synové pak Ruben vystavěli Ezebon, Eleale a Kariataim“. Za dnů proroků bylo moábské a postihuje je Moábův soud: „křičeti bude Ezebon a Eleale, až v Jasa slyšán bude hlas jejich“; Izajáš je oplakává: „svlažuji tě slzami svými, ó Ezebon a Eleale“ a Jeremjáš opakuje křik: „Více křičeti budou než Ezebonští, až do Eleale“."
    - "To je vše, co záznam obsahuje. Vesnice el-'Al dnes leží v Jordánsku, v dohledu pahorku Hisban, biblického Chešbónu."
  sv:
    - "Elale var en stad på den moabitiska platån öster om Döda havet, en nära granne till Heshbon, med vilket den alltid nämns. Namnet lever kvar i el-’Al, en by på en kulle omkring 3 km nordost om Hisban i Jordanien. Eusebios kände den redan som en stor by högst en romersk mil från Esbus. Platsen är känd genom ytinventeringar av Hesbanregionen snarare än genom utgrävning, och inget som hittats där nämner staden."
    - "Elale är en av städerna i det goda boskapslandet som Ruben och Gad bad Mose om, ”Atarot, Dibon, Jaeser, Nimra, Hesbon, Eleale”; därefter byggde Rubens barn upp ”Hesbon, Eleale, Kirjataim”. På profeternas tid var den Moabs och drabbas av Moabs dom: ”Hesbon och Eleale höja klagorop, så att det höres ända till Jahas”; Jesaja gråter över den, ”med mina tårar vattnar jag dig, Hesbon, och dig, Eleale”, och Jeremia upprepar ropet: ”Från Hesbon, jämmerstaden, ända till Eleale”."
    - "Det är allt vad källorna rymmer. Byn el-’Al ligger i dag i Jordanien, inom synhåll från kullen Hisban, det bibliska Heshbon."
  nb:
    - "Elale var en by på moabittplatået øst for Dødehavet, en nær nabo til Hesjbon, som den alltid nevnes sammen med. Navnet lever i el-'Al, en landsby på en høyde omtrent 3 km nordøst for Hisban i Jordan. Eusebius kjente den allerede som en stor landsby ikke mer enn én romersk mil fra Esbus. Stedet er kjent fra overflateundersøkelser i Hesban-området snarere enn fra utgravning, og intet funnet der nevner byen."
    - "Elale er en av byene i det gode beitelandet som Ruben og Gad ba Moses om: «Atarot og Dibon og Jaser og Nimra og Hesbon og El'ale»; senere bygget Rubens barn opp igjen «Hesbon og El'ale og Kirjata'im». På profetenes tid var den Moabs, og den lider under Moabs dom: «Hesbon og El'ale skriker så det høres like til Jahas»; Jesaja gråter over den: «jeg vanner dig med mine tårer, Hesbon, og dig El'ale!», og Jeremia gjentar ropet: «Det lyder skrik fra Hesbon like til El'ale»."
    - "Det er alt kildene har. Landsbyen el-'Al ligger i dag i Jordan, i sikte av haugen Hisban, det bibelske Hesjbon."
  tl:
    - "Ang Eleale ay isang bayan sa talampas ng Moab sa silangan ng Dagat na Patay, malapit na kapitbahay ng Hesbon, na laging kasama nitong pinangangalanan. Ang pangalan ay nananatili sa el-'Al, isang nayon sa burol mga 3 km sa hilagang-silangan ng Hisban sa Jordan. Kilala na ito ni Eusebio bilang malaking nayon na isang milya lamang mula sa Esbus. Ang pook ay kilala mula sa mga surbey sa ibabaw ng rehiyon ng Hesban at hindi mula sa paghuhukay, at walang natagpuan doon na nagpapangalan sa bayan."
    - "Ang Eleale ay isa sa mga bayan ng mabuting lupaing pastulan na hiningi nina Ruben at Gad kay Moises, “Ang Ataroth, at ang Dibon, at ang Jazer, at ang Nimra, at ang Hesbon, at ang Eleale”; pagkatapos ay “itinayo naman ng mga anak ni Ruben ang Hesbon, at ang Eleale, at ang Ciriathaim”. Noong mga araw ng mga propeta, sakop na ito ng Moab, at nagdurusa ito sa hatol sa Moab: “ang Hesbon ay humihiyaw, at ang Eleale; ang kanilang tinig ay naririnig hanggang sa Jahas”; tumatangis si Isaias para rito, “aking didiligin ka ng aking mga luha, Oh Hesbon, at Eleale”, at inuulit ni Jeremias ang sigaw “Mula sa hiniyawan ng Hesbon hanggang sa Eleale”."
    - "Iyon na ang laman ng talaan. Ang nayon ng el-'Al ay nasa Jordan ngayon, sa tanaw ng tel ng Hisban, ang Hesbon ng Bibliya."
  da:
    - "El'ale var en by på det moabitiske plateau øst for Det Døde Hav, en nær nabo til Hesjbon, med hvilken den altid nævnes. Navnet lever videre i el-'Al, en landsby på en bakke cirka 3 km nordøst for Hisban i Jordan. Eusebios kendte den allerede som en stor landsby, ikke mere end en romersk mil fra Esbus. Stedet kendes fra overfladeundersøgelser af Hesban-egnen snarere end fra udgravning, og intet fundet dér nævner byen."
    - "El'ale er en af byerne i det gode kvægland, som Ruben og Gad bad Moses om: »Atharoth og Dibon og Jaeser og Nimra og Hesbon og Eleale«; senere »Rubens Børn byggede Hesbon og Eleale og Kirjathajim«. I profeternes dage var den Moabs, og den lider i Moabs dom: »Hesbon og Eleale raabe, deres Røst høres indtil Jahaz«; Esajas græder over den: »jeg vil væde dig, Hesbon og Eleale, med min Graad«, og Jeremias gentager råbet: »Af Skriget i Hesbon lade de Lyden høres, indtil Eleale«."
    - "Det er alt, hvad overleveringen rummer. Landsbyen el-'Al ligger i dag i Jordan, i sigte af højen Hisban, det bibelske Hesjbon."
  sr:
    - "Елеале је био град на моавској висоравни источно од Мртвог мора, близак сусед Есевона, с којим се увек помиње. Име је сачувано у ел Алу, селу на брду око 3 км североисточно од Хисбана у Јордану. Јевсевије га је већ знао као велико село удаљено највише миљу од Есбуса. Налазиште је познато из површинских прегледа области Хесбан, а не из ископавања, и ништа нађено тамо не именује град."
    - "Елеале је један од градова доброг сточног краја које су Рувим и Гад тражили од Мојсија: „Атарот и Девон и Јазир и Намра и Есевон и Елеалија“; после тога „синови Рувимови саградише Есевон и Елеалију и Киријатајим“. У доба пророка био је Моавов, и страда у Моавовој пропасти: „И викаће Есевон и Елеала, до Јасе чуће им се глас“; Исаија плаче за њим: „заливаћу те сузама својим, Есевоне и Елеало“, а Јеремија понавља вапај: „Од вике есевонске, која допре до Елеале“."
    - "То је све што запис садржи. Село ел Ал данас лежи у Јордану, на видику хумке Хисбана, библијског Есевона."
  hu:
    - "Eleále a Holt-tengertől keletre fekvő moábi fennsík városa volt, Hesbon közeli szomszédja, amellyel mindig együtt említik. A név fennmaradt el-'Alban, egy dombon fekvő faluban Hisbantól mintegy 3 km-re északkeletre, Jordániában. Eusebius már úgy ismerte, mint Esbustól legfeljebb egy mérföldre fekvő nagy falut. A hely a Hesban-vidék felszíni felméréseiből ismert, nem ásatásból, és semmi sem nevezi meg ott a várost."
    - "Eleále egyike a jó marhatartó vidék városainak, amelyet Rúben és Gád Mózestől kért: „Atárót, Díbon, Jázér, Nimra, Hesbon, Elealé”; később „A Rúben fiai pedig megépíték Hesbont, Elealét, Kirjáthaimot”. A próféták napjaira Moábé volt, és osztozik Moáb ítéletében: „kiált Hesbon és Eleálé, szavok Jáháczig hallatik”; Ézsaiás siratja: „megnedvesítlek könyeimmel Hesbon és Eleálé”, Jeremiás pedig megismétli a kiáltást: „Hesbon kiáltása miatt Elealéig”."
    - "Ennyi a feljegyzés. Az el-'Al falu ma Jordániában fekszik, Hisban, a bibliai Hesbon halmának látótávolságában."
  fi:
    - "Eleale oli kaupunki Moabin ylätasangolla Kuolleenmeren itäpuolella, Hesbonin läheinen naapuri, jonka kanssa se aina mainitaan. Nimi säilyy el-'Alissa, kukkulalla sijaitsevassa kylässä noin 3 km Hisbanista koilliseen Jordaniassa. Eusebios tunsi sen jo suurena kylänä, korkeintaan mailin päässä Esbuksesta. Paikka tunnetaan Hesbanin alueen pintakartoituksista pikemmin kuin kaivauksista, eikä mikään siellä löydetty nimeää kaupunkia."
    - "Eleale on yksi hyvän karjamaan kaupungeista, jota Ruuben ja Gaad pyysivät Moosekselta: ”Atarot, Diibon, Jaeser, Nimra, Hesbon, Elale”; sen jälkeen ”ruubenilaiset rakensivat Hesbonin, Elalen ja Kirjataimin”. Profeettojen päiviin mennessä se oli Moabin, ja se kärsii Moabin tuomiossa: ”Hesbon ja Elale huutavat; Jahaaseen asti kuuluu niiden parku”; Jesaja itkee sitä, ”kastelen kyyneleilläni sinua, Hesbon, ja sinua, Elale”, ja Jeremia toistaa huudon: ”Hesbonin parku kuuluu Elaleen”."
    - "Siinä kaikki, mitä lähteet kertovat. El-'Alin kylä on nykyisin Jordaniassa, Hisbanin kumpareen, raamatullisen Hesbonin, näköpiirissä."
  vi:
    - "Ê-lê-a-lê là một thành trên cao nguyên Mô-áp phía đông Biển Chết, láng giềng gần của Hết-bôn, luôn được nêu tên cùng với Hết-bôn. Tên còn lại ở el-'Al, một làng trên đồi cách Hisban khoảng 3 km về phía đông bắc ở Jordan. Eusebius đã biết nó là một làng lớn cách Esbus không quá một dặm. Địa điểm được biết qua các cuộc khảo sát bề mặt vùng Hesban chứ không qua khai quật, và không có gì tìm thấy ở đó nêu tên thành."
    - "Ê-lê-a-lê là một trong các thành của xứ nuôi súc vật tốt mà Ru-bên và Gát xin Môi-se, “A-ta-rốt, Đi-bôn, Gia-ê-xe, Nim-ra, Hết-bôn, Ê-lê-a-lê”; sau đó “Con cháu Ru-bên xây cất Hết-bôn, Ê-lê-a-lê, Ki-ri-a-ta-im”. Đến thời các nhà tiên tri nó thuộc Mô-áp, và chịu chung số phận của Mô-áp: “Hết-bôn và Ê-lê-a-lê kêu la, tiếng nghe thấu đến Gia-hát”; Ê-sai khóc cho nó, “Hỡi Hết-bôn, hỡi Ê-lê-a-lê, ta sẽ tưới nước mắt ta trên các ngươi”, và Giê-rê-mi lặp lại tiếng kêu “Tiếng than khóc từ Hết-bôn nghe thấu Ê-lê-a-lê”."
    - "Đó là tất cả những gì ghi chép lưu giữ. Ngày nay làng el-'Al nằm ở Jordan, trong tầm nhìn của gò Hisban, Hết-bôn trong Kinh Thánh."
  ro:
    - "Eleale era o cetate de pe podișul Moabului, la est de Marea Moartă, vecină apropiată a Hesbonului, cu care este mereu numită. Numele se păstrează în el-'Al, un sat pe un deal la circa 3 km nord-est de Hisban, în Iordania. Eusebiu îl cunoștea deja ca pe un sat mare, la nu mai mult de o milă de Esbus. Locul este cunoscut din cercetări de suprafață ale regiunii Hesban, nu din săpături, și nimic găsit acolo nu numește cetatea."
    - "Eleale este una dintre cetățile țării bune de vite pe care au cerut-o Ruben și Gad de la Moise: Atarot, Dibon, Iazer, Nimra, Hesbon, Eleale; apoi „fiii lui Ruvim au zidit Esevonul și Elealinul și Kariatanul”. Pe vremea profeților era a Moabului și suferă în osânda Moabului: „a strigat Esevon și Elealì, până la Iassa s’a auzit glasul lor”; Isaia plânge pentru ea: „voiu plânge, ca plângerea Iazirului viea din Sevama. Copacii tăi i-a oborît Esevon și Elealì”, iar Ieremia repetă strigătul, de la strigătul Hesbonului până la Eleale."
    - "Atât cuprinde înregistrarea. Satul el-'Al se află astăzi în Iordania, în vederea movilei Hisban, Hesbonul biblic."
  bg:
    - "Елеале бил град на моавското плато източно от Мъртво море, близък съсед на Есевон, с който винаги е назоваван заедно. Името е оцеляло в ел-Ал, село на хълм на около 3 км североизточно от Хисбан в Йордания. Евсевий вече го познавал като голямо село на не повече от миля от Есбус. Мястото е известно от повърхностни обследвания на областта Хесбан, а не от разкопки, и нищо намерено там не назовава града."
    - "Елеале е един от градовете в добрата скотовъдна страна, която Рувим и Гад поискали от Мойсей: „Атарот, и Девон, и Язир, и Нимра, и Есевон, и Елеала“; после „Рувимовите синове съградиха Есевон, и Елеала, и Кириатаим“. В дните на пророците той бил на Моав и споделя участта на Моав: „Есевон ще въпие, и Елеала: Гласът им ще се чуе дори до Яса“; Исаия плаче за него: „Ще те измокря със сълзите си, Есевоне и Елеало“, а Йеремия повтаря вика: „Заради вопъла на Есевон, който стигна до Елеала“."
    - "Това е всичко, което записите пазят. Село ел-Ал днес лежи в Йордания, в полезрението на могилата Хисбан, библейския Есевон."
