body:
  en:
    - "Pisgah is the name, always with the article in Hebrew, of a height on the edge of the Moabite plateau opposite Jericho, from which the whole Jordan valley and the hills of the west lie open. The Bible speaks of “the top of Pisgah” and of the slopes of Pisgah, Ashdoth-pisgah, which run down to the Dead Sea. Deuteronomy puts the top of Pisgah on Mount Nebo, and the two names are usually taken for the ridge and its summit, or for the eastern and western ends of one ridge: Jebel Neba, about 800 m, and its western headland Ras Siyagha, about 710 m, some 9 km north-west of Madaba in Jordan. The record here stands at Siyagha."
    - "Israel's march up through Moab ends “to the top of Pisgah, which looketh toward Jeshimon”, the desert. Balak brought Balaam “into the field of Zophim, to the top of Pisgah”, built seven altars there and heard a second blessing instead of a curse. Moses, forbidden to cross the Jordan, was told, “Get thee up into the top of Pisgah, and lift up thine eyes westward, and northward, and southward, and eastward”; at the end of Deuteronomy he “went up from the plains of Moab unto the mountain of Nebo, to the top of Pisgah”, saw the land from Gilead to Dan and to the sea, and died, buried in a valley “but no man knoweth of his sepulchre unto this day”. The slopes of Pisgah mark the border of Sihon's kingdom and of the tribe of Reuben."
    - "Christians found the place of Moses' vision early. Egeria, about 384, rode up from Livias to the summit, where a church stood and the monks showed her the place where Moses was believed to be buried; the Life of Peter the Iberian tells how a shepherd's vision led to the finding of Moses' memorial. The Franciscans, who acquired Siyagha in 1932, uncovered under Sylvester Saller and then Michele Piccirillo a monastery and a basilica of the sixth century with mosaic floors, among them a hunting and pastoral scene of about 530, over the earlier chapel of the memorial. The Memorial of Moses, restored and reopened in 2016, was visited by Pope John Paul II in 2000 and Benedict XVI in 2009; a view-indicator on the terrace points out Jericho, Jerusalem and the Dead Sea below."
  ru:
    - "Фасга — имя, в еврейском тексте всегда с артиклем, высоты на краю Моавитского плато против Иерихона, с которой открываются вся Иорданская долина и горы запада. Библия говорит о «вершине горы Фасги» и о местах «при подошве Фасги», склонах, сбегающих к Мёртвому морю. Второзаконие ставит вершину Фасги на гору Нево, и два имени обычно понимают как хребет и его вершину или как восточный и западный концы одного хребта: Джебель-Неба, около 800 м, и его западный выступ Рас-Сияга, около 710 м, примерно в 9 км к северо-западу от Мадабы в Иордании. Запись здесь стоит на Сияге."
    - "Путь Израиля через Моав кончается «на вершине горы Фасги, обращенной лицем к пустыне». Валак взял Валаама «на место стражей, на вершину горы Фасги», построил там семь жертвенников и услышал вместо проклятия второе благословение. Моисею, которому не дано было перейти Иордан, сказано: «взойди на вершину Фасги и взгляни глазами твоими к морю и к северу, и к югу и к востоку»; в конце Второзакония сказано, что «взошел Моисей с равнин Моавитских на гору Нево, на вершину Фасги»; он увидел землю от Галаада до Дана и до моря и умер, погребённый на долине, «и никто не знает места погребения его даже до сего дня». Подошва Фасги обозначает границу царства Сигона и удела Рувима."
    - "Христиане рано нашли место, где Моисей видел землю. Эгерия около 384 г. поднялась из Ливиады на вершину, где стояла церковь и монахи показали ей место, где, как верили, погребён Моисей; Житие Петра Ивера рассказывает, как видение пастуха привело к обретению памятника Моисея. Францисканцы, получившие Сиягу в 1932 г., раскопали под началом Сильвестра Саллера, а затем Микеле Пиччирилло монастырь и базилику VI века с мозаичными полами, среди них сцену охоты и пастушества около 530 г., поверх более ранней часовни памятника. Мемориал Моисея, восстановленный и вновь открытый в 2016 г., посещали папа Иоанн Павел II в 2000 г. и Бенедикт XVI в 2009 г.; указатель на террасе показывает внизу Иерихон, Иерусалим и Мёртвое море."
  uk:
    - "Фасга — назва, в івриті завжди з артиклем, висоти на краю моавського плато навпроти Єрихону, з якої відкриваються вся Йорданська долина й гори заходу. Біблія говорить про «верх Пизги» та про схили Фасги, Ашдот-Фасга, що збігають до Мертвого моря. Повторення Закону поміщає верх Фасги на горі Нево, і ці дві назви зазвичай розуміють як хребет і його вершину або як східний і західний кінці одного хребта: Джебель-Неба, близько 800 м, та її західний виступ Рас-Сіяґа, близько 710 м, приблизно за 9 км на північний захід від Мадаби в Йорданії. Запис тут стоїть на Сіяґі."
    - "Шлях Ізраїля через Моав закінчується «до верховин гори Пізга, що стремить над дикою полониною» — над Єшимоном, пустелею. Валак привів Валаама «на поле сторожі, на верховину Пісги-гори», звів там сім жертовників і почув друге благословення замість прокляття. Мойсею, якому заборонено перейти Йордан, було сказано: «Ізійди на верх Пізги і знїми очі твої на захід і на північ і на полудне і на схід сонця»; наприкінці Повторення Закону він зійшов «з Моабового поділля на Небо гору, на верх Пизги», побачив землю від Гілеаду до Дану й до моря і помер, похований у долині, і «по сей день нїхто не знає гробища його». Схили Фасги позначають межу царства Сігона та племені Рувима."
    - "Християни рано знайшли місце бачення Мойсея. Егерія близько 384 р. піднялася з Лівіади на вершину, де стояла церква, і ченці показали їй місце, де, як вважали, був похований Мойсей; «Житіє Петра Іберійця» розповідає, як видіння пастуха привело до віднайдення пам’ятки Мойсея. Францисканці, що придбали Сіяґу 1932 року, розкрили під керівництвом Сильвестра Саллера, а потім Мікеле Пікірілло монастир і базиліку VI ст. з мозаїчними підлогами, серед них мисливську й пасторальну сцену близько 530 р., над раннішою каплицею пам’ятки. Меморіал Мойсея, відновлений і знову відкритий 2016 року, відвідали папа Іван Павло II у 2000 р. і Бенедикт XVI у 2009 р.; покажчик краєвидів на терасі вказує на Єрихон, Єрусалим і Мертве море внизу."
  es:
    - "Pisga es el nombre, siempre con artículo en hebreo, de una altura en el borde de la meseta moabita frente a Jericó, desde la cual se abren a la vista todo el valle del Jordán y las colinas del oeste. La Biblia habla de «la cumbre de Pisga» y de las laderas de Pisga, Asdot-pisga, que descienden hasta el mar Muerto. El Deuteronomio pone la cumbre de Pisga en el monte Nebo, y los dos nombres suelen tomarse por la cresta y su cumbre, o por los extremos oriental y occidental de una misma cresta: el Jebel Neba, de unos 800 m, y su promontorio occidental Ras Siyagha, de unos 710 m, a unos 9 km al noroeste de Madaba, en Jordania. El registro de aquí está en Siyagha."
    - "La marcha de Israel hacia arriba por Moab termina «á la cumbre de Pisga, que mira á Jesimón», el desierto. Balac llevó a Balaam «al campo de Sophim, á la cumbre de Pisga», edificó allí siete altares y oyó una segunda bendición en lugar de una maldición. A Moisés, a quien se prohibió cruzar el Jordán, se le dijo: «Sube á la cumbre del Pisga, y alza tus ojos al occidente, y al aquilón, y al mediodía, y al oriente»; al final del Deuteronomio subió «de los campos de Moab al monte de Nebo, á la cumbre de Pisga», vio la tierra desde Galaad hasta Dan y hasta el mar, y murió, sepultado en un valle, y «ninguno sabe su sepulcro hasta hoy». Las laderas de Pisga marcan la frontera del reino de Sehón y de la tribu de Rubén."
    - "Los cristianos hallaron pronto el lugar de la visión de Moisés. Egeria, hacia 384, subió a caballo desde Livias hasta la cumbre, donde había una iglesia y los monjes le mostraron el lugar donde se creía que estaba sepultado Moisés; la Vida de Pedro el Íbero cuenta cómo la visión de un pastor llevó al hallazgo del memorial de Moisés. Los franciscanos, que adquirieron Siyagha en 1932, sacaron a la luz bajo Silvestre Saller y luego Michele Piccirillo un monasterio y una basílica del siglo VI con suelos de mosaico, entre ellos una escena de caza y pastoreo de hacia 530, sobre la capilla anterior del memorial. El Memorial de Moisés, restaurado y reabierto en 2016, fue visitado por el papa Juan Pablo II en 2000 y por Benedicto XVI en 2009; un indicador panorámico en la terraza señala Jericó, Jerusalén y el mar Muerto abajo."
  pt:
    - "Pisga é o nome, sempre com artigo em hebraico, de uma altura na orla do planalto moabita defronte de Jericó, de onde se abre todo o vale do Jordão e as colinas do oeste. A Bíblia fala de “o topo de Pisga” e das encostas de Pisga, Asdote-Pisga, que descem ao Mar Morto. O Deuteronômio põe o topo de Pisga no Monte Nebo, e os dois nomes costumam ser tomados pela crista e seu cume, ou pelas pontas leste e oeste de uma só crista: o Jebel Neba, com cerca de 800 m, e seu promontório ocidental Ras Siyagha, com cerca de 710 m, a uns 9 km a noroeste de Madaba, na Jordânia. O registro aqui fica em Siyagha."
    - "A marcha de Israel por Moabe chega “até o topo de Pisga, que olha para o deserto”. Balaque levou Balaão “ao campo de Zofim, ao topo de Pisga”, construiu ali sete altares e ouviu uma segunda bênção em vez de maldição. A Moisés, proibido de atravessar o Jordão, foi dito: “Suba ao topo de Pisga, e levante os seus olhos para o oeste, para o norte, para o sul e para o leste”; no fim do Deuteronômio ele “subiu das campinas de Moabe ao monte Nebo, ao topo de Pisga”, viu a terra de Gileade a Dã e até o mar, e morreu, sepultado num vale, “mas ninguém sabe onde fica o seu túmulo até o dia de hoje”. As encostas de Pisga marcam a fronteira do reino de Seom e da tribo de Rúben."
    - "Os cristãos encontraram cedo o lugar da visão de Moisés. Egéria, por volta de 384, subiu de Lívias ao cume, onde havia uma igreja e os monges lhe mostraram o lugar onde se cria que Moisés fora sepultado; a Vida de Pedro, o Ibero, conta como a visão de um pastor levou ao achado do memorial de Moisés. Os franciscanos, que adquiriram Siyagha em 1932, descobriram, sob Silvestre Saller e depois Michele Piccirillo, um mosteiro e uma basílica do século VI com mosaicos de pavimento, entre eles uma cena de caça e pastoreio de cerca de 530, sobre a capela anterior do memorial. O Memorial de Moisés, restaurado e reaberto em 2016, foi visitado pelo papa João Paulo II em 2000 e por Bento XVI em 2009; um indicador de vistas no terraço aponta Jericó, Jerusalém e o Mar Morto lá embaixo."
  de:
    - "Pisga ist der Name, im Hebräischen stets mit Artikel, einer Anhöhe am Rand der moabitischen Hochfläche gegenüber von Jericho, von der das ganze Jordantal und die Berge des Westens offen daliegen. Die Bibel spricht von der „Spitze des Gebirges Pisga“ und von den Hängen des Pisga, Aschdod-Pisga, die zum Toten Meer hinabführen. Das Deuteronomium setzt die Spitze des Pisga auf den Berg Nebo, und beide Namen hält man meist für den Höhenzug und seinen Gipfel oder für das östliche und das westliche Ende eines Höhenzugs: Dschebel Neba, etwa 800 m, und sein westlicher Vorsprung Ras Siyagha, etwa 710 m, rund 9 km nordwestlich von Madaba in Jordanien. Die Karte setzt den Eintrag auf Siyagha."
    - "Israels Zug hinauf durch Moab endet „zu dem hohen Berge Pisgas, der gegen die Wüste sieht“, Jeschimon. Balak brachte Bileam auf das Feld Zofim, auf die Höhe Pisga, baute dort sieben Altäre und hörte einen zweiten Segen statt eines Fluchs. Mose, dem verboten war, den Jordan zu überschreiten, wurde gesagt: „Steige auf die Höhe des Berges Pisga, und hebe deine Augen auf gegen Abend und gegen Mitternacht und gegen Mittag und gegen Morgen“; am Ende des Deuteronomiums heißt es: „Und Mose ging von dem Gefilde der Moabiter auf den Berg Nebo, auf die Spitze des Gebirges Pisga“; er sah das Land von Gilead bis Dan und bis zum Meer und starb, in einem Tal begraben, doch „niemand hat sein Grab erfahren bis auf diesen heutigen Tag“. Die Hänge des Pisga bezeichnen die Grenze von Sihons Königreich und des Stammes Ruben."
    - "Christen fanden den Ort von Moses Schau früh. Egeria ritt um 384 von Livias zum Gipfel hinauf, wo eine Kirche stand und die Mönche ihr die Stelle zeigten, an der Mose begraben sein sollte; die Vita Petrus' des Iberers erzählt, wie die Vision eines Hirten zum Auffinden der Gedenkstätte des Mose führte. Die Franziskaner, die Siyagha 1932 erwarben, legten unter Sylvester Saller und dann Michele Piccirillo ein Kloster und eine Basilika des 6. Jahrhunderts mit Mosaikböden frei, darunter eine Jagd- und Hirtenszene von etwa 530, über der früheren Kapelle der Gedenkstätte. Die Mose-Gedenkstätte, 2016 restauriert und wiedereröffnet, besuchten Papst Johannes Paul II. im Jahr 2000 und Benedikt XVI. 2009; eine Orientierungstafel auf der Terrasse weist auf Jericho, Jerusalem und das Tote Meer unten hin."
  fr:
    - "Pisga est le nom, toujours avec l’article en hébreu, d’une hauteur au bord du plateau moabite en face de Jéricho, d’où s’ouvrent toute la vallée du Jourdain et les collines de l’ouest. La Bible parle du « sommet du Pisga » et des pentes du Pisga, Ashdoth-Pisga, qui descendent vers la mer Morte. Le Deutéronome place le sommet du Pisga sur le mont Nebo, et les deux noms sont d’ordinaire pris pour la crête et son sommet, ou pour les extrémités est et ouest d’une même crête : le Djebel Neba, environ 800 m, et son promontoire occidental Ras Siyagha, environ 710 m, à quelque 9 km au nord-ouest de Madaba en Jordanie. Le relevé ici est placé à Siyagha."
    - "La marche d’Israël à travers Moab s’achève « au sommet du Pisga, en regard du désert ». Balak mena Balaam « au champ de Tsophim, sur le sommet du Pisga », y bâtit sept autels et entendit une seconde bénédiction au lieu d’une malédiction. Moïse, à qui il était interdit de passer le Jourdain, s’entendit dire : « Monte au sommet du Pisga, porte tes regards à l’occident, au nord, au midi et à l’orient » ; à la fin du Deutéronome, il « monta des plaines de Moab sur le mont Nebo, au sommet du Pisga », vit le pays de Galaad jusqu’à Dan et jusqu’à la mer, et mourut, enterré dans une vallée : « Personne n’a connu son sépulcre jusqu’à ce jour ». Les pentes du Pisga marquent la frontière du royaume de Sihon et de la tribu de Ruben."
    - "Les chrétiens trouvèrent tôt le lieu de la vision de Moïse. Égérie, vers 384, monta de Livias au sommet, où se dressait une église et où les moines lui montrèrent l’endroit où l’on croyait Moïse enterré ; la Vie de Pierre l’Ibère raconte comment la vision d’un berger conduisit à la découverte du mémorial de Moïse. Les franciscains, qui acquirent Siyagha en 1932, mirent au jour, sous Sylvester Saller puis Michele Piccirillo, un monastère et une basilique du VIe siècle aux sols de mosaïque, dont une scène de chasse et de pastorale d’environ 530, au-dessus de la chapelle plus ancienne du mémorial. Le Mémorial de Moïse, restauré et rouvert en 2016, reçut la visite du pape Jean-Paul II en 2000 et de Benoît XVI en 2009 ; une table d’orientation sur la terrasse indique Jéricho, Jérusalem et la mer Morte en contrebas."
  it:
    - "Pisga è il nome, in ebraico sempre con l’articolo, di un’altura sul margine dell’altopiano moabita di fronte a Gerico, da cui si apre alla vista l’intera valle del Giordano e le colline a ovest. La Bibbia parla della «cima del Pisga» e delle pendici del Pisga, Ashdoth-Pisga, che scendono al Mar Morto. Il Deuteronomio pone la vetta del Pisga sul Monte Nebo, e i due nomi sono di solito intesi come la dorsale e la sua sommità, o come le estremità orientale e occidentale di un’unica dorsale: il Jebel Neba, circa 800 m, e il suo promontorio occidentale Ras Siyagha, circa 710 m, a circa 9 km a nord-ovest di Madaba in Giordania. La voce qui si trova a Siyagha."
    - "La marcia di Israele attraverso Moab finisce «verso l’altura del Pisga che domina il deserto» (ebraico Iesimon). Balak condusse Balaam «al campo di Tsofim, sulla cima del Pisga», vi edificò sette altari e udì una seconda benedizione invece di una maledizione. A Mosè, cui era vietato attraversare il Giordano, fu detto: «Sali in vetta al Pisga, volgi lo sguardo a occidente, a settentrione, a mezzogiorno e ad oriente»; alla fine del Deuteronomio «salì dalle pianure di Moab sul Monte Nebo, in vetta al Pisga», vide il paese da Galaad fino a Dan e al mare, e morì, sepolto in una valle, e «nessuno fino a questo giorno ha mai saputo dove fosse la sua tomba». Le pendici del Pisga segnano il confine del regno di Sicon e della tribù di Ruben."
    - "I cristiani trovarono presto il luogo della visione di Mosè. Egeria, verso il 384, salì a cavallo da Livias fino alla vetta, dove sorgeva una chiesa e i monaci le mostrarono il luogo in cui si credeva fosse sepolto Mosè; la Vita di Pietro l’Ibero racconta come la visione di un pastore portò al ritrovamento del memoriale di Mosè. I Francescani, che acquisirono Siyagha nel 1932, portarono alla luce con Sylvester Saller e poi Michele Piccirillo un monastero e una basilica del VI secolo con pavimenti a mosaico, tra cui una scena di caccia e pastorale del 530 circa, sopra la cappella più antica del memoriale. Il Memoriale di Mosè, restaurato e riaperto nel 2016, fu visitato da papa Giovanni Paolo II nel 2000 e da Benedetto XVI nel 2009; un indicatore panoramico sulla terrazza segnala Gerico, Gerusalemme e il Mar Morto sottostante."
  pl:
    - "Pisga to nazwa, w hebrajskim zawsze z rodzajnikiem, wzniesienia na skraju płaskowyżu moabskiego naprzeciw Jerycha, z którego widać całą dolinę Jordanu i wzgórza na zachodzie. Biblia zna „wierzch góry Fazga” i stoki Pisgi, Aszdot-Pisga, które opadają ku Morzu Martwemu. Księga Powtórzonego Prawa umieszcza szczyt Pisgi na Górze Nebo, a obie nazwy uważa się zwykle za grzbiet i jego szczyt albo za wschodni i zachodni kraniec jednego grzbietu: Dżabal Niba, około 800 m, i jego zachodni cypel Ras Sijaga, około 710 m, w odległości około 9 km na północny zachód od Madaby w Jordanii. Punkt na mapie stoi w Sijaga."
    - "Marsz Izraela przez Moab kończy się „na wierzchu pagórka, który leży ku puszczy” (w hebrajskim Pisga). Balak zaprowadził Balaama „na pole Sofim, na wierzch góry Fazga”, zbudował tam siedem ołtarzy i usłyszał drugie błogosławieństwo zamiast przekleństwa. Mojżeszowi, któremu zabroniono przejść Jordan, powiedziano: „Wstąp na wierzch góry Fazga, a podnieś oczy swe ku zachodowi, i ku północy, i ku południowi, i ku wschodowi”; na końcu Księgi Powtórzonego Prawa czytamy: „Wstąpił Mojżesz z onych równin Moabskich na górę Nebo, na wierzch pagórka, który jest na przeciwko Jerychu” (znów w hebrajskim Pisga); ujrzał ziemię od Gileadu po Dan i po morze i umarł, pochowany w dolinie, „a nie dowiedział się nikt o grobie jego aż do dnia tego”. Stoki Pisgi wyznaczają granicę królestwa Sychona i pokolenia Rubena."
    - "Chrześcijanie wcześnie znaleźli miejsce widzenia Mojżesza. Egeria, około 384 roku, wjechała z Liwias na szczyt, gdzie stał kościół, a mnisi pokazali jej miejsce, w którym miał być pochowany Mojżesz; Żywot Piotra Iberyjczyka opowiada, jak widzenie pasterza doprowadziło do odnalezienia pamiątki Mojżesza. Franciszkanie, którzy nabyli Sijaga w 1932 roku, odsłonili pod kierunkiem Sylvestra Sallera, a potem Michele Piccirillo klasztor i bazylikę z VI wieku z posadzkami mozaikowymi, wśród nich scenę łowiecką i pasterską z około 530 roku, nad wcześniejszą kaplicą pamiątki. Memoriał Mojżesza, odnowiony i ponownie otwarty w 2016 roku, odwiedzili papież Jan Paweł II w 2000 i Benedykt XVI w 2009; tablica widokowa na tarasie wskazuje Jerycho, Jerozolimę i Morze Martwe poniżej."
  cs:
    - "Pisga je jméno, v hebrejštině vždy s členem, výšiny na okraji moábské plošiny naproti Jerichu, z níž se otevírá celé jordánské údolí a západní pahorky. Bible mluví o výstupu „na vrch hory Fazga“ a o svazích Pisgy, Ašdot-pisga, které sbíhají k Mrtvému moři. Deuteronomium klade vrchol Pisgy na horu Nebo a obě jména se obvykle pokládají za hřeben a jeho vrchol, nebo za východní a západní konec jednoho hřebene: Džabal Nebá, asi 800 m, a jeho západní výběžek Rás Sijága, asi 710 m, zhruba 9 km severozápadně od Mádaby v Jordánsku. Záznam zde stojí na Sijáze."
    - "Izraelův pochod vzhůru přes Moáb končí „až k vrchu hory, kteráž leží na proti poušti“. Balak přivedl Bileáma „na rovinu Zofim, na vrch jednoho pahrbku“, vystavěl tam sedm oltářů a slyšel druhé požehnání místo kletby. Mojžíšovi, kterému bylo zakázáno přejít Jordán, bylo řečeno: „Vstup na vrch hory Fazga, a pozdvihna očí svých k západu a k půlnoci, ku poledni i k východu, hleď očima svýma“; na konci Deuteronomia „vstoupil Mojžíš z rovin Moábských na horu Nébo, na vrch hory, kteráž jest proti Jerichu“, spatřil zemi od Gileadu po Dan i k moři a zemřel, pohřben v údolí, „a žádný nezvěděl o jeho hrobu až do tohoto dne“. Svahy Pisgy označují hranici Sichonova království i pokolení Rúbenova."
    - "Křesťané našli místo Mojžíšova vidění záhy. Egerie, asi roku 384, vyjela z Liviady na vrchol, kde stál kostel a kde jí mniši ukázali místo, kde měl být Mojžíš pohřben; Život Petra Ibérského vypráví, jak pastýřovo vidění vedlo k nalezení Mojžíšova památníku. Františkáni, kteří Sijágu získali roku 1932, odkryli pod Sylvesterem Sallerem a pak Michelem Piccirillem klášter a baziliku z 6. století s mozaikovými podlahami, mezi nimi lovecká a pastýřská scéna z asi 530, nad starší kaplí památníku. Mojžíšův památník, obnovený a znovu otevřený roku 2016, navštívil papež Jan Pavel II. roku 2000 a Benedikt XVI. roku 2009; ukazatel výhledu na terase ukazuje Jericho, Jeruzalém a Mrtvé moře dole."
  nl:
    - "Pisga is de naam, in het Hebreeuws altijd met lidwoord, van een hoogte aan de rand van het Moabitische plateau tegenover Jericho, vanwaar de hele Jordaanvallei en de heuvels van het westen openliggen. De Bijbel spreekt van “de hoogte van Pisga” en van de hellingen van Pisga, Asdot-Pisga, die naar de Dode Zee aflopen. Deuteronomium plaatst de top van Pisga op de Nebo, en de twee namen worden meestal opgevat als de rug en zijn top, of als het oostelijke en westelijke einde van één rug: Jebel Neba, ongeveer 800 m, en zijn westelijke voorgebergte Ras Siyagha, ongeveer 710 m, zo’n 9 km ten noordwesten van Madaba in Jordanië. De kaartvermelding hier staat bij Siyagha."
    - "Israëls tocht omhoog door Moab eindigt “aan de hoogte van Pisga, en dat tegen de wildernis ziet”, de woestijn. Balak bracht Bileam “tot het veld Zofim, op de hoogte van Pisga”, bouwde daar zeven altaren en hoorde een tweede zegen in plaats van een vloek. Mozes, die de Jordaan niet over mocht, kreeg te horen: “Klim op de hoogte van Pisga, en hef uw ogen op naar het westen, en naar het noorden, en naar het zuiden, en naar het oosten”; aan het einde van Deuteronomium “ging Mozes op uit de vlakke velden van Moab, naar den berg Nebo, op de hoogten van Pisga”, zag het land van Gilead tot Dan en tot de zee, en stierf, begraven in een dal, “en niemand heeft zijn graf geweten, tot op dezen dag”. De hellingen van Pisga markeren de grens van Sihons koninkrijk en van de stam Ruben."
    - "Christenen vonden de plaats van Mozes’ visioen vroeg. Egeria reed omstreeks 384 van Livias naar de top, waar een kerk stond en de monniken haar de plaats toonden waar Mozes begraven zou zijn; het Leven van Petrus de Iberiër vertelt hoe een visioen van een herder leidde tot de vondst van Mozes’ gedenkteken. De franciscanen, die Siyagha in 1932 verwierven, legden onder Sylvester Saller en daarna Michele Piccirillo een klooster en een basiliek uit de 6e eeuw met mozaïekvloeren bloot, onder andere een jacht- en herderstafereel van omstreeks 530, boven de eerdere kapel van het gedenkteken. Het Gedenkteken van Mozes, in 2016 hersteld en heropend, werd bezocht door paus Johannes Paulus II in 2000 en Benedictus XVI in 2009; een oriëntatietafel op het terras wijst Jericho, Jeruzalem en de Dode Zee beneden aan."
  sv:
    - "Pisga är namnet, på hebreiska alltid med bestämd artikel, på en höjd i kanten av den moabitiska platån mitt emot Jeriko, varifrån hela Jordandalen och bergen i väster ligger öppna. Bibeln talar om ”toppen av Pisga” och om Pisgas sluttningar, Ashdot-Pisga, som löper ned mot Döda havet. Femte Mosebok förlägger toppen av Pisga till berget Nebo, och de två namnen tas vanligen för åsen och dess topp, eller för östra och västra ändan av en och samma ås: Jebel Neba, omkring 800 m, och dess västra udde Ras Siyagha, omkring 710 m, cirka 9 km nordväst om Madaba i Jordanien. Posten här står vid Siyagha."
    - "Israels marsch uppför genom Moab slutar ”uppe på Pisga, där man kan se ut över ödemarken”. Balak förde Bileam till ”Väktarplanen på toppen av Pisga”, byggde sju altaren där och fick höra en andra välsignelse i stället för en förbannelse. Mose, som förbjudits att gå över Jordan, fick höra: ”Stig nu upp på toppen av Pisga, och lyft upp dina ögon mot väster och norr och söder och öster”; i slutet av Femte Mosebok heter det att ”Mose gick från Moabs hedar upp på berget Nebo, på toppen av Pisga”, såg landet från Gilead till Dan och till havet, och dog, begravd i en dal, ”men ännu intill denna dag har ingen fått veta var hans grav är”. Pisgas sluttningar markerar gränsen för Sichons rike och för Rubens stam."
    - "Kristna fann platsen för Moses syn tidigt. Egeria red omkring 384 upp från Livias till toppen, där en kyrka stod och munkarna visade henne platsen där Mose ansågs vara begravd; Petrus Ibers levnad berättar hur en herdes syn ledde till att Moses minnesplats hittades. Franciskanerna, som förvärvade Siyagha 1932, frilade under Sylvester Saller och sedan Michele Piccirillo ett kloster och en basilika från 500-talet med mosaikgolv, bland dem en jakt- och herdescen från omkring 530, över det tidigare minneskapellet. Moses minnesmärke, restaurerat och återöppnat 2016, besöktes av påve Johannes Paulus II år 2000 och Benedictus XVI år 2009; en utsiktstavla på terrassen pekar ut Jeriko, Jerusalem och Döda havet nedanför."
  nb:
    - "Pisga er navnet, på hebraisk alltid med artikkel, på en høyde i kanten av det moabittiske platået overfor Jeriko, fra hvilken hele Jordandalen og åsene i vest ligger åpne. Bibelen taler om «toppen av Pisga» og om skråningene av Pisga, Asjdot-Pisga, som løper ned mot Dødehavet. 5. Mosebok setter Pisgas topp på Nebo-fjellet, og de to navnene tas vanligvis for ryggen og dens topp, eller for østre og vestre ende av én ås: Jebel Neba, omkring 800 m, og dens vestlige forhøyning Ras Siyagha, omkring 710 m, omtrent 9 km nordvest for Madaba i Jordan. Kartoppføringen her står ved Siyagha."
    - "Israels marsj opp gjennom Moab ender «tett ved toppen av Pisga, og hvor en skuer ut over ørkenen». Balak førte Bileam «til speider-haugen på toppen av Pisga», bygde sju altere der og hørte en annen velsignelse i stedet for en forbannelse. Moses, som ikke fikk gå over Jordan, fikk høre: «Gå op på Pisgas topp og løft dine øine mot vest og mot nord og mot syd og mot øst»; på slutten av 5. Mosebok «gikk [han] fra Moabs ødemarker op på Nebo-fjellet, på Pisgas topp», så landet fra Gilead til Dan og til havet, og døde, begravet i en dal, «ingen kjenner til denne dag hans grav». Pisgas skråninger markerer grensen for Sihons rike og for Rubens stamme."
    - "Kristne fant stedet for Moses' syn tidlig. Egeria, omkring 384, red opp fra Livias til toppen, der en kirke sto og munkene viste henne stedet der Moses ble antatt å være gravlagt; Peter iberens liv forteller hvordan et gjeterens syn førte til funnet av Moses' minnesmerke. Franziskanerne, som overtok Siyagha i 1932, avdekket under Sylvester Saller og siden Michele Piccirillo et kloster og en basilika fra 500-tallet med mosaikkgulv, blant dem en jakt- og gjeterscene fra omkring 530, over det tidligere minnekapellet. Moses-minnesmerket, restaurert og gjenåpnet i 2016, ble besøkt av pave Johannes Paul II i 2000 og Benedikt XVI i 2009; en utsiktstavle på terrassen peker ut Jeriko, Jerusalem og Dødehavet nedenfor."
  tl:
    - "Ang Pisga ang pangalan, palaging may artikulo sa Hebreo, ng isang taas sa gilid ng talampas ng Moab sa tapat ng Jerico, kung saan nakabukas ang buong libis ng Jordan at ang mga burol sa kanluran. Binabanggit ng Bibliya ang “taluktok ng Pisga” at ang mga dalisdis ng Pisga, ang Ashdoth-pisga, na bumababa hanggang sa Dagat na Patay. Inilalagay ng Deuteronomio ang taluktok ng Pisga sa Bundok Nebo, at ang dalawang pangalan ay karaniwang itinuturing na tagaytay at tuktok nito, o ang silangan at kanlurang dulo ng iisang tagaytay: ang Jebel Neba, mga 800 m, at ang kanlurang tangos nito na Ras Siyagha, mga 710 m, mga 9 km sa hilagang-kanluran ng Madaba sa Jordan. Ang talaan dito ay nasa Siyagha."
    - "Nagtatapos ang martsa ng Israel paakyat sa Moab “sa taluktok ng Pisga, na patungo sa ilang”. Dinala ni Balac si Balaam “sa parang ng Sophim, sa taluktok ng Pisga”, nagtayo roon ng pitong dambana at nakarinig ng ikalawang basbas sa halip na sumpa. Si Moises, na pinagbawalang tumawid sa Jordan, ay sinabihan, “Sumampa ka sa taluktok ng Pisga at ilingap mo ang iyong mga mata sa dakong kalunuran, at sa dakong hilagaan, at sa dakong timugan, at sa dakong silanganan”; sa katapusan ng Deuteronomio ay “sumampa si Moises mula sa mga kapatagan ng Moab sa bundok ng Nebo, sa taluktok ng Pisga”, nakita ang lupain mula Gilead hanggang Dan at hanggang sa dagat, at namatay, inilibing sa isang libis na “sinomang tao ay hindi nakaaalam ng libingan niya hanggang sa araw na ito”. Ang mga dalisdis ng Pisga ang nagmamarka sa hangganan ng kaharian ni Sehon at ng lipi ni Ruben."
    - "Maaga nang natagpuan ng mga Kristiyano ang lugar ng pangitain ni Moises. Si Egeria, bandang 384, ay umakyat mula Livias hanggang tuktok, kung saan may simbahan at ipinakita sa kaniya ng mga monghe ang pinaniniwalaang libingan ni Moises; ayon sa Buhay ni Pedro ang Iberiano, pangitain ng isang pastol ang humantong sa pagkatuklas sa bantayog ni Moises. Ang mga Pransiskano, na nakakuha ng Siyagha noong 1932, ay naglantad, sa ilalim nina Sylvester Saller at Michele Piccirillo, ng monasteryo at basilika noong ika-6 na siglo na may sahig na mosaiko, kabilang ang eksena ng pangangaso at pagpapastol mga 530, sa ibabaw ng naunang kapilya. Dinalaw nina Papa Juan Pablo II (2000) at Benedicto XVI (2009) ang Bantayog ni Moises, naibalik at muling binuksan noong 2016; itinuturo ng panuro ng tanawin sa terasa ang Jerico, Jerusalem at Dagat na Patay sa ibaba."
  da:
    - "Pisga er navnet, på hebraisk altid med bestemt kendeord, på en højde i randen af Moabs højslette over for Jeriko, hvorfra hele Jordandalen og bjergene mod vest ligger åbne. Bibelen taler om »Pisgas Top« og om Pisgas skråninger, Asdot-Pisga, der løber ned til Det Døde Hav. 5. Mosebog sætter Pisgas top på Nebo, og de to navne tages sædvanligvis for højderyggen og dens top, eller for den østlige og vestlige ende af én højderyg: Jebel Neba, omkring 800 m, og dens vestlige forbjerg Ras Siyagha, omkring 710 m, omkring 9 km nordvest for Madaba i Jordan. Posten her står ved Siyagha."
    - "Israels march op gennem Moab ender »mod Toppen af Pisga, der skuer ud over Ørken«, ørkenen Jesjimon. Balak førte Bileam »paa Zofims Mark til Pisgas Top«, byggede dér syv altre og hørte en anden velsignelse i stedet for en forbandelse. Moses, der fik forbud mod at krydse Jordan, fik besked: »Gak op paa Pisgas Top, og opløft dine Øjne mod Vesten og mod Norden og mod Sønden og mod Østen«; ved slutningen af 5. Mosebog gik han, som det hedder, »op fra Moabs slette Marker paa Nebo Bjerg, paa Pisgas Top«, så landet fra Gilead til Dan og til havet og døde, begravet i en dal, men »ingen ved hans Grav indtil denne Dag«. Pisgas skråninger markerer grænsen for Sihons rige og for Rubens stamme."
    - "Kristne fandt tidligt stedet for Moses' syn. Egeria red omkring 384 op fra Livias til toppen, hvor der stod en kirke, og munkene viste hende stedet, hvor Moses menes at være begravet; Peter Iberers Liv fortæller, hvordan en hyrdes syn førte til, at Moses' mindesmærke blev fundet. Franciskanerne, der erhvervede Siyagha i 1932, afdækkede under Sylvester Saller og derefter Michele Piccirillo et kloster og en basilika fra 500-tallet med mosaikgulve, blandt dem en jagt- og hyrdescene fra omkring 530, over det tidligere mindekapel. Mindesmærket for Moses, restaureret og genåbnet i 2016, blev besøgt af pave Johannes Paul 2. i 2000 og Benedikt 16. i 2009; en panoramatavle på terrassen udpeger Jeriko, Jerusalem og Det Døde Hav nedenfor."
  sr:
    - "Фазга је име, на хебрејском увек с чланом, узвишења на ободу моавске висоравни насупрот Јерихону, са ког је отворена читава долина Јордана и западна брда. Библија говори о „врху Фазге“ и о падинама Фазге, Аздот-Фазги, које се спуштају ка Мртвом мору. Поновљени закон ставља врх Фазге на гору Нево, а та два имена обично се узимају за гребен и његов врх, или за источни и западни крај једног гребена: Џебел Неба, око 800 м, и његова западна узвисина Рас Сијага, око 710 м, неких 9 км северозападно од Мадабе у Јордану. Овде је запис постављен на Сијагу."
    - "Израиљев марш кроз Моав води „у долину која је у пољу моавском код горе Фазге и гледа у пустињу“. Валак је довео Валама „у поље Зофим, наврх Фазге“, подигао ту седам жртвеника и чуо друго благосиљање уместо проклетства. Мојсију, коме је забрањено да пређе Јордан, речено је: „Попни се на врх ове горе, и подигавши очи своје на запад и на север и на југ и на исток“; на крају Поновљеног закона „изиђе Мојсије из поља моавског на гору Нава, на врх Фазге“, видео земљу од Галада до Дана и до мора, и умро, сахрањен у долини, „и нико не дозна за гроб његов до данашњег дана“. Падине Фазге означавају границу Сионовог краљевства и племена Рувимовог."
    - "Хришћани су рано пронашли место Мојсијевог виђења. Егерија се око 384. успела из Ливије на врх, где је стајала црква и где су јој монаси показали место на коме се веровало да је Мојсије сахрањен; Живот Петра Ивера приповеда како је пастирово виђење довело до налаза Мојсијевог спомена. Фрањевци, који су Сијагу стекли 1932, открили су под Силвестром Салером, а затим Микелеом Пичирилом, манастир и базилику из 6. века с мозаичким подовима, међу њима ловачку и пастирску сцену из око 530, изнад раније капеле спомена. Спомен Мојсију, обновљен и поново отворен 2016, посетили су папа Јован Павле II 2000. и Бенедикт XVI 2009; показивач погледа на тераси указује на Јерихон, Јерусалим и Мртво море испод."
