# Overview article (ADR 0007). Mainstream facts only; Pisgah is placed at Ras Siyagha on the Nebo ridge as usual, and the relation of the names Nebo and Pisgah is given as the common view, not as certain.
id: pisgah
place: afd9259
title:
  en: "Pisgah"
  ru: "Фасга"
  uk: "Фасга"
