body:
  en:
    - "Ashkenaz is a people and land of the far north in the biblical view of the world. In the table of nations Ashkenaz is the first son of Gomer: “the sons of Gomer; Ashkenaz, and Riphath, and Togarmah”. Most scholars identify the name with the Ashguza or Ishkuza of Assyrian texts, the Scythians who in the seventh century BC appear south of the Caucasus on the borders of Urartu and Mannea; the Hebrew form is often explained as a miscopy of Ashkuz, with nun written for waw. Esarhaddon's inscriptions tell of Ishpakaia of Ashguza, allied with the Mannaeans, whom he defeated; Herodotus says that the Scythians later ruled Asia for twenty-eight years. August Dillmann, among others, doubted the equation."
    - "Jeremiah's oracle against Babylon summons its enemies from the north: “call together against her the kingdoms of Ararat, Minni, and Ashchenaz; appoint a captain against her”, and in the next verse “the kings of the Medes”. Ararat is Urartu and Minni the Mannaeans, so Ashkenaz stands with peoples of the Armenian and north-west Iranian highlands that had come under Median power by the sixth century BC. In the Middle Ages Jewish writers, Rashi among them, used Ashkenaz for Germany, and from this the Jews of central and eastern Europe came to be called Ashkenazim."
  ru:
    - "Аскеназ — народ и земля крайнего севера в библейской картине мира. В родословии народов Аскеназ — первый сын Гомера: «Сыны Гомера: Аскеназ, Рифат и Фогарма». Большинство учёных отождествляют это имя с Ашгузой, или Ишкузой, ассирийских текстов — скифами, которые в VII в. до н. э. появляются к югу от Кавказа, на границах Урарту и Маннеи; еврейское написание часто объясняют ошибкой переписчика вместо Ашкуз, с буквой «нун» на месте «вав». Надписи Асархаддона рассказывают об Ишпакае из Ашгузы, союзнике маннеев, которого он разбил; Геродот говорит, что позднее скифы владели Азией двадцать восемь лет. Август Дильман, среди прочих, сомневался в этом отождествлении."
    - "Пророчество Иеремии на Вавилон созывает его врагов с севера: «созовите на него царства Араратские, Мидийские и Аскеназские, поставьте вождя против него», а в следующем стихе — «царей Мидии». Арарат — это Урарту, а Минни еврейского текста (в Синодальном переводе «Мидийские») — маннеи, так что Аскеназ стоит рядом с народами Армянского нагорья и северо-запада Ирана, подпавшими к VI в. до н. э. под власть Мидии. В Средние века иудейские авторы, и среди них Раши, называли Аскеназом Германию, и отсюда евреев Центральной и Восточной Европы стали звать ашкеназами."
  uk:
    - "Аскеназ — народ і земля далекої півночі в біблійному баченні світу. У таблиці народів Аскеназ — перший син Гомера: «А сини Гомерові: Аскеназ та Рифат та Тогарма». Більшість учених ототожнюють це ім'я з Ашгузою чи Ішкузою ассирійських текстів, скіфами, які в VII ст. до н. е. з'являються на південь від Кавказу, на кордонах Урарту й Манни; єврейську форму часто пояснюють як помилкове переписування від Ашкуз, де замість вав написано нун. Написи Асархаддона розповідають про Ішпакая з Ашгузи, союзника маннеїв, якого він переміг; Геродот каже, що скіфи згодом двадцять вісім років панували над Азією. Серед інших у цьому ототожненні сумнівався Август Діллман."
    - "Пророцтво Єремії проти Вавилона закликає його ворогів з півночі: «поскликайте на його царства: Арарацькі, Минїйські, Аскеназькі; настановіть гетьманів проти його», а в наступному вірші — «царів Мідиї». Арарат — це Урарту, а Мінні — маннеї, тож Аскеназ стоїть поряд із народами вірменського й північно-західного іранського нагір'їв, які до VI ст. до н. е. опинилися під владою Мідії. У середньовіччі єврейські автори, серед них Раші, вживали Аскеназ для Німеччини, і звідси євреїв Центральної та Східної Європи стали називати ашкеназами."
  es:
    - "Askenaz es un pueblo y una tierra del extremo norte en la visión bíblica del mundo. En la tabla de las naciones, Askenaz es el primer hijo de Gomer: «Y los hijos de Gomer: Ashkenaz, y Riphat, y Togorma». La mayoría de los estudiosos identifican el nombre con los Ashguza o Ishkuza de los textos asirios, los escitas que en el siglo VII a. C. aparecen al sur del Cáucaso, en las fronteras de Urartu y Mana; la forma hebrea suele explicarse como una copia errónea de Ashkuz, con nun escrita por vav. Las inscripciones de Esar-hadón cuentan de Ishpakaia de Ashguza, aliado de los manneos, a quien derrotó; Heródoto dice que los escitas dominaron después Asia durante veintiocho años. August Dillmann, entre otros, dudó de la ecuación."
    - "El oráculo de Jeremías contra Babilonia convoca a sus enemigos desde el norte: «juntad contra ella los reinos de Ararat, de Minni, y de Aschênaz; señalad contra ella capitán», y en el versículo siguiente «reyes de Media». Ararat es Urartu y Mini los manneos, de modo que Askenaz figura junto a pueblos de las tierras altas armenias y del noroeste de Irán que en el siglo VI a. C. habían caído bajo el poder medo. En la Edad Media los autores judíos, entre ellos Rashi, usaron Askenaz para Alemania, y de ahí los judíos de Europa central y oriental pasaron a llamarse asquenazíes."
  pt:
    - "Asquenaz é um povo e uma terra do extremo norte na visão bíblica do mundo. Na tabela das nações, Asquenaz é o primeiro filho de Gômer: “Os filhos de Gomer foram: Asquenaz, Rifate e Togarma”. A maioria dos estudiosos identifica o nome com os Ashguza ou Ishkuza dos textos assírios, os citas que no século VII a.C. aparecem ao sul do Cáucaso, nas fronteiras de Urartu e Manneia; a forma hebraica é muitas vezes explicada como cópia errada de Ashkuz, com nun escrito no lugar de waw. As inscrições de Esar-Hadom contam de Ishpakaia de Ashguza, aliado dos manneus, a quem ele derrotou; Heródoto diz que os citas dominaram depois a Ásia por vinte e oito anos. August Dillmann, entre outros, duvidou da equação."
    - "O oráculo de Jeremias contra a Babilônia convoca seus inimigos do norte: “Convoquem contra ela os reinos de Ararate, Mini e Asquenaz! Nomeiem um comandante contra ela!”, e no versículo seguinte “os reis dos medos”. Ararate é Urartu e Mini os manneus, de modo que Asquenaz está ao lado de povos das terras altas da Armênia e do noroeste do Irã que no século VI a.C. haviam passado ao domínio medo. Na Idade Média, autores judeus, entre eles Rashi, usaram Asquenaz para a Alemanha, e daí os judeus da Europa central e oriental passaram a ser chamados asquenazitas."
  de:
    - "Aschkenas ist ein Volk und Land des äußersten Nordens im biblischen Weltbild. In der Völkertafel ist Aschkenas der erste Sohn Gomers: „die Kinder von Gomer sind diese: Askenas, Riphath und Thorgama“. Die meisten Gelehrten setzen den Namen mit den Aschguza oder Ischkuza der assyrischen Texte gleich, den Skythen, die im siebten Jahrhundert v. Chr. südlich des Kaukasus an den Grenzen von Urartu und Mannea auftreten; die hebräische Form wird oft als Verschreibung von Aschkuz erklärt, mit Nun statt Waw. Asarhaddons Inschriften erzählen von Ischpakaja von Aschguza, einem Verbündeten der Mannäer, den er besiegte; Herodot sagt, die Skythen hätten später achtundzwanzig Jahre lang über Asien geherrscht. August Dillmann bezweifelte die Gleichung unter anderen."
    - "Jeremias Spruch gegen Babel ruft dessen Feinde aus dem Norden herbei: „rufet wider sie die Königreiche Ararat, Minni und Askenas; bestellt Hauptleute wider sie“, und im nächsten Vers „die Könige aus Medien“. Ararat ist Urartu und Minni sind die Mannäer, Aschkenas steht also mit Völkern des armenischen und nordwestiranischen Hochlands, die im sechsten Jahrhundert v. Chr. unter medische Herrschaft gekommen waren. Im Mittelalter gebrauchten jüdische Gelehrte, darunter Raschi, Aschkenas für Deutschland, und daher nennt man die Juden Mittel- und Osteuropas Aschkenasim."
  fr:
    - "Aschkenaz est un peuple et un pays de l’extrême nord dans la vision biblique du monde. Dans la table des nations, Aschkenaz est le premier fils de Gomer : « Les fils de Gomer : Aschkenaz, Riphat et Togarma. » La plupart des exégètes identifient le nom avec l’Ashguza ou Ishkuza des textes assyriens, les Scythes qui, au VIIe siècle av. J.-C., apparaissent au sud du Caucase, aux confins de l’Urartu et de la Mannée ; la forme hébraïque s’explique souvent comme une copie fautive d’Ashkuz, avec un noun écrit pour un waw. Les inscriptions d’Esar-Haddon parlent d’Ishpakaya d’Ashguza, allié aux Mannéens, qu’il vainquit ; Hérodote dit que les Scythes dominèrent plus tard l’Asie pendant vingt-huit ans. August Dillmann, entre autres, doutait de l’équation."
    - "L’oracle de Jérémie contre Babylone appelle ses ennemis du nord : « Appelez contre elle les royaumes d’Ararat, de Minni et d’Aschkenaz ! Établissez contre elle des chefs ! », puis, au verset suivant, « les rois de Médie ». Ararat est l’Urartu et Minni les Mannéens ; Aschkenaz est donc rangé avec des peuples des hautes terres arméniennes et du nord-ouest iranien passés sous la puissance mède au VIe siècle av. J.-C. Au Moyen Âge, des auteurs juifs, Rachi entre autres, employèrent Aschkenaz pour l’Allemagne, d’où les Juifs d’Europe centrale et orientale vinrent à être appelés ashkénazes."
  it:
    - "Aschenàz è un popolo e un paese dell’estremo nord nella visione biblica del mondo. Nella tavola dei popoli Aschenàz è il primo figlio di Gomer: «I figliuoli di Gomer: Ashkenaz, Rifat e Togarma». La maggior parte degli studiosi identifica il nome con gli Ashguza o Ishkuza dei testi assiri, gli Sciti che nel VII secolo a.C. compaiono a sud del Caucaso ai confini di Urartu e Mannea; la forma ebraica è spesso spiegata come errore di copia di Ashkuz, con nun scritta al posto di waw. Le iscrizioni di Assaraddon parlano di Ishpakaia di Ashguza, alleato dei Mannei, che egli sconfisse; Erodoto dice che gli Sciti dominarono poi l’Asia per ventotto anni. August Dillmann, tra altri, dubitava dell’equazione."
    - "L’oracolo di Geremia contro Babilonia convoca i suoi nemici dal nord: «chiamate a raccolta contro di lei i regni d’Ararat, di Minni e d’Ashkenaz! Costituite contro di lei de’ generali!», e nel versetto seguente «i re di Media». Ararat è Urartu e Minni sono i Mannei, così Aschenàz sta con popoli degli altipiani armeni e dell’Iran nord-occidentale, passati sotto il dominio dei Medi entro il VI secolo a.C. Nel Medioevo gli scrittori ebrei, tra cui Rashi, usarono Aschenàz per la Germania, e da qui gli ebrei dell’Europa centrale e orientale furono chiamati ashkenaziti."
  nl:
    - "Askenaz is een volk en land in het uiterste noorden in het bijbelse wereldbeeld. In de volkerentafel is Askenaz de eerste zoon van Gomer: “de zonen van Gomer zijn: Askenaz, en Rifath, en Togarma”. De meeste geleerden vereenzelvigen de naam met de Ashguza of Ishkuza van Assyrische teksten, de Scythen die in de zevende eeuw v.Chr. ten zuiden van de Kaukasus verschijnen aan de grenzen van Urartu en Mannea; de Hebreeuwse vorm wordt vaak verklaard als een verschrijving van Ashkuz, met nun geschreven voor waw. Esarhaddons inscripties vertellen van Ishpakaia van Ashguza, een bondgenoot van de Mannaeërs, die hij versloeg; Herodotus zegt dat de Scythen later achtentwintig jaar over Azië heersten. August Dillmann betwijfelde onder anderen de gelijkstelling."
    - "Jeremia's godsspraak tegen Babylon roept haar vijanden uit het noorden op: “roept tegen haar bijeen de koninkrijken van Ararat, Minni en Askenaz; bestelt een krijgsoverste tegen haar”, en in het volgende vers “de koningen van Medië”. Ararat is Urartu en Minni zijn de Mannaeërs, zodat Askenaz staat bij volken van het Armeense en noordwest-Iraanse hoogland die in de zesde eeuw v.Chr. onder Medische macht waren gekomen. In de middeleeuwen gebruikten Joodse schrijvers, onder wie Rasji, Askenaz voor Duitsland, en daarom werden de Joden van Midden- en Oost-Europa asjkenazim genoemd."
  pl:
    - "Aszkenaz to lud i kraj dalekiej północy w biblijnym obrazie świata. W tablicy narodów Aszkenaz jest pierwszym synem Gomera: „synowie Gomerowi: Aschenaz, i Ryfat, i Togorma”. Większość uczonych utożsamia tę nazwę z Aszguzą lub Iszkuzą tekstów asyryjskich, czyli ze Scytami, którzy w VII w. p.n.e. pojawiają się na południe od Kaukazu, na granicach Urartu i Mannei; formę hebrajską często tłumaczy się błędnym odpisem od Aszkuz, z nun zapisanym zamiast waw. Inskrypcje Asarhaddona opowiadają o Isz-pakai z Aszguzy, sprzymierzonym z Mannejczykami, którego pokonał; Herodot pisze, że Scytowie rządzili później Azją przez dwadzieścia osiem lat. August Dillmann, między innymi, kwestionował to utożsamienie."
    - "Wyrocznia Jeremiasza przeciw Babilonowi przywołuje jego wrogów z północy: „zwołajcie przeciwko niemu królestwa Ararad, Minny, i Aschenas; postanówcie przeciwko niemu hetmana”, a w następnym wersecie „królów Medskich”. Ararat to Urartu, a Minni to Mannejczycy, więc Aszkenaz stoi obok ludów wyżyn armeńskich i północno-zachodniego Iranu, które do VI w. p.n.e. dostały się pod panowanie Medów. W średniowieczu pisarze żydowscy, między innymi Raszi, używali nazwy Aszkenaz na określenie Niemiec, i stąd Żydów Europy środkowej i wschodniej zaczęto nazywać Aszkenazyjczykami."
  cs:
    - "Aškenaz je lid a země dalekého severu v biblickém pohledu na svět. V tabulce národů je Aškenaz prvním synem Gomerovým: „Synové pak Gomerovi: Ascenez, Rifat, a Togorma.“ Většina badatelů ztotožňuje jméno s Ašguzou či Iškuzou asyrských textů, se Skythy, kteří se v sedmém století př. n. l. objevují jižně od Kavkazu na hranicích Urartu a Mannai; hebrejská podoba se často vysvětluje jako chybný opis Aškuz, s nun psaným místo vav. Nápisy Asarhadónovy vypráví o Išpakajovi z Ašguzy, spojenci Mannajců, jehož porazil; Hérodotos říká, že Skythové později vládli Asii osmadvacet let. Ztotožnění zpochybnil mimo jiné August Dillmann."
    - "Jeremjášovo proroctví proti Babylonu svolává jeho nepřátele ze severu: „svolejte proti němu království Ararat, Minni, Ascenez, ustanovte hejtmana proti němu“ a v dalším verši „krále země Médské“. Ararat je Urartu a Mini Mannajci, takže Aškenaz stojí vedle národů arménské a severozápadní íránské vysočiny, které se do šestého století př. n. l. dostaly pod médskou moc. Ve středověku používali židovští autoři, mezi nimi Raši, jméno Aškenaz pro Německo, a odtud se Židé střední a východní Evropy začali nazývat aškenázové."
  sv:
    - "Ashkenas är ett folk och ett land i det yttersta norr i Bibelns världsbild. I folkens tavla är Ashkenas Gomers förste son: ”Gomers söner voro Askenas, Rifat och Togarma”. De flesta forskare identifierar namnet med Ashguza eller Ishkuza i assyriska texter, skyterna som på 600-talet f.Kr. förekommer söder om Kaukasus vid gränserna till Urartu och Mannea; den hebreiska formen förklaras ofta som en felskrivning av Ashkuz, med nun skrivet i stället för vav. Esarhaddons inskrifter berättar om Ishpakaia av Ashguza, allierad med mannéerna, som han besegrade; Herodotos säger att skyterna senare härskade över Asien i tjugoåtta år. August Dillmann, bland andra, betvivlade likställandet."
    - "Jeremias utsaga mot Babylon kallar dess fiender från norr: ”båden upp mot det riken, både Ararats, Minnis och Askenas', tillsätten hövdingar mot det”, och i nästa vers ”Mediens konungar”. Ararat är Urartu och Minni mannéerna, så Ashkenas står med folk i det armeniska och nordvästiranska höglandet som hade kommit under mediskt välde på 500-talet f.Kr. Under medeltiden använde judiska författare, bland dem Rashi, Ashkenas för Tyskland, och därav kom Mellaneuropas och Östeuropas judar att kallas Ashkenazim."
  nb:
    - "Asjkenas er et folk og et land i det fjerne nord i bibelens verdensbilde. I folketavlen er Asjkenas den første sønnen til Gomer: «Og Gomers sønner var Askenas og Rifat og Togarma.» De fleste forskere identifiserer navnet med Ashguza eller Ishkuza i assyriske tekster, skyterne som på 600-tallet f.Kr. dukker opp sør for Kaukasus ved grensene til Urartu og Mannea; den hebraiske formen forklares ofte som en feilkopiering av Ashkuz, med nun skrevet for waw. Asarhaddons innskrifter forteller om Ishpakaia av Ashguza, alliert med mannaerne, som han beseiret; Herodot sier at skyterne senere hersket over Asia i tjueåtte år. August Dillmann, blant andre, betvilte likningen."
    - "Jeremias utsagn mot Babylon kaller fiendene dens fra nord: «kall sammen mot det Ararats, Minnis og Askenas' riker, innsett høvedsmenn imot det», og i neste vers «kongene i Media». Ararat er Urartu og Minni mannaerne, så Asjkenas står sammen med folk i det armenske og nordvestiranske høylandet som var kommet under medisk makt på 500-tallet f.Kr. I middelalderen brukte jødiske forfattere, blant dem Rashi, Asjkenas om Tyskland, og herav kom jødene i Sentral- og Øst-Europa til å bli kalt asjkenasim."
  tl:
    - "Ang Aschenaz ay bayan at lupain ng malayong hilaga sa pananaw ng Biblia sa daigdig. Sa talaan ng mga bansa, ang Aschenaz ang panganay na anak ni Gomer: “ang mga anak ni Gomer: si Azkenaz, at si Rifat, at si Togarma”. Karamihan ng mga iskolar ay nagtutumbas sa pangalan sa Ashguza o Ishkuza ng mga tekstong Asirio, ang mga Scita na noong ika-7 siglo BK ay lumilitaw sa timog ng Caucasus sa mga hangganan ng Urartu at Mannea; ang anyong Hebreo ay madalas ipaliwanag bilang maling kopya ng Ashkuz, na nun ang naisulat sa halip na waw. Isinasalaysay ng mga inskripsiyon ni Esar-hadon si Ishpakaia ng Ashguza, kaalyado ng mga Mannaeo, na kaniyang tinalo; sinasabi ni Herodoto na kalaunang pinamunuan ng mga Scita ang Asia nang dalawampu't walong taon. Pinagdudahan ni August Dillmann, bukod sa iba, ang pagtutumbas."
    - "Ipinatatawag ng hula ni Jeremias laban sa Babilonia ang mga kaaway nito mula sa hilaga: “pisanin laban sa kaniya ang mga kaharian ng Ararat, ng Minmi, at ng Aschenaz: mangaghalal ng puno laban sa kaniya”, at sa kasunod na talata “ang mga hari ng mga Medo”. Ang Ararat ay Urartu at ang Minni ay ang mga Mannaeo, kaya kasama ng Aschenaz ang mga bayan ng kabundukang Armenio at hilagang-kanlurang Iran na napasailalim ng kapangyarihang Medo pagsapit ng ika-6 na siglo BK. Noong Gitnang Panahon, ginamit ng mga manunulat na Judio, kabilang si Rashi, ang Aschenaz para sa Alemanya, at mula rito ay tinawag na mga Ashkenazi ang mga Judio ng gitna at silangang Europa."
  da:
    - "Asjkenaz er et folk og land i det fjerne nord i Bibelens verdensbillede. I folketavlen er Asjkenaz Gomers førstefødte: »Og Gomers Sønner: Askenas og Rifat og Thogarma«. De fleste forskere identificerer navnet med assyriske teksters Ashguza eller Ishkuza, skyterne, der i 600-tallet f.Kr. optræder syd for Kaukasus ved Urartus og Manneas grænser; den hebraiske form forklares ofte som en fejlskrivning af Ashkuz, med nun skrevet for waw. Esarhaddons indskrifter fortæller om Ishpakaia af Ashguza, forbundet med mannæerne, som han besejrede; Herodot siger, at skyterne senere herskede over Asien i otteogtyve år. August Dillmann tvivlede blandt andre på ligningen."
    - "Jeremias' udsagn mod Babylon kalder dets fjender fra nord: »kalder Ararats, Minnis og Askenas's Riger frem imod den; beskikker Høvedsmænd imod den«, og i det næste vers »Kongerne af Medien«. Ararat er Urartu og Minni mannæerne, så Asjkenaz står sammen med folk fra det armenske og nordvestiranske højland, som i 500-tallet f.Kr. var kommet under medisk magt. I middelalderen brugte jødiske forfattere, blandt dem Rashi, Asjkenaz om Tyskland, og heraf kom jøderne i Central- og Østeuropa til at hedde askenasim."
  sr:
    - "Асхенас је народ и земља крајњег севера у библијском виђењу света. У Табели народа Асхенас је први син Гомеров: „синови Гомерови: Асхенас и Рифат и Тогарма“. Већина научника поистовећује име са Ашгузом или Ишкузом асирских текстова, Скитима који се у 7. веку п. н. е. јављају јужно од Кавказа на границама Урартуа и Мане; хебрејски облик често се објашњава као погрешан препис Ашкуза, са нун написаним уместо вав. Есарадонови натписи говоре о Ишпакаји из Ашгузе, савезнику Манејаца, кога је победио; Херодот каже да су Скити касније владали Азијом двадесет и осам година. Аугуст Дилман, међу осталима, сумњао је у ту једначину."
    - "Јеремијино пророштво против Вавилона позива његове непријатеље са севера: „сазовите на њ царство араратско, минијско и асханаско; поставите војводу супрот њему“, а у следећем стиху „цареве мидске“. Арарат је Урарту, а Мини Манејци, па Асхенас стоји с народима јерменског и северозападног иранског горја који су до 6. века п. н. е. дошли под међанску власт. У средњем веку јеврејски писци, међу њима Раши, користили су Асхенас за Немачку, и отуда су Јевреји средње и источне Европе названи Ашкенази."
  hu:
    - "Askenáz a bibliai világkép szerint nép és ország a távoli északon. A népek táblázatában Askenáz Gómer első fia: „A Gómer fiai pedig: Askhenáz, Rifáth, és Tógármah.” A legtöbb kutató az asszír szövegek Asguzájával vagy Iskuzájával azonosítja a nevet, a szkítákkal, akik a Kr. e. 7. században a Kaukázustól délre, Urartu és Mannai határain tűnnek fel; a héber alakot gyakran az Askuz elírásával magyarázzák, ahol vav helyett nun áll. Asszarhaddon feliratai elmesélik, hogy az asguzai Ispakaja a mannaiakkal szövetkezett, és ő legyőzte; Hérodotosz szerint a szkíták később huszonnyolc évig uralkodtak Ázsián. August Dillmann többek között kételkedett az azonosításban."
    - "Jeremiás Babilon elleni jövendölése északról szólítja ellenségeit: „gyűjtsétek össze ellene az Ararátnak, Menninek és Askenáznak országait, válaszszatok ő ellene hadvezért”, a következő versben pedig „Médiának királyait”. Ararát Urartu, Minni a mannaiak, így Askenáz az örmény és északnyugat-iráni felföld népei mellett áll, amelyek a Kr. e. 6. századra méd uralom alá kerültek. A középkorban zsidó írók, köztük Rási, Askenázt Németországra használták, és ebből a közép- és kelet-európai zsidókat askenázinak kezdték nevezni."
  fi:
    - "Askenas on Raamatun maailmankuvassa kaukaisen pohjoisen kansa ja maa. Kansojen luettelossa Askenas on Goomerin ensimmäinen poika: ”Goomerin pojat olivat Askenas, Riifat ja Toogarma”. Useimmat tutkijat samaistavat nimen assyrialaisten tekstien Ashguzaan eli Ishkuzaan, skyytteihin, jotka esiintyvät 600-luvulla eaa. Kaukasuksen eteläpuolella Urartun ja Mannean rajoilla; heprean muotoa selitetään usein Ashkuzin virhekopioinniksi, jossa waw:n tilalla on nun. Esarhaddonin kirjoitukset kertovat Ashguzan Ishpakaiasta, joka liittoutui mannailaisten kanssa ja jonka hän voitti; Herodotos sanoo skyyttien hallinneen myöhemmin Aasiaa kaksikymmentäkahdeksan vuotta. August Dillmann ja muut epäilivät rinnastusta."
    - "Jeremian ennustus Babylonia vastaan kutsuu sen viholliset pohjoisesta: ”kutsukaa häntä vastaan Araratin, Minnin ja Askenaan valtakunnat, asettakaa päämies häntä vastaan”, ja seuraavassa jakeessa ”Meedian kuninkaat”. Ararat on Urartu ja Minni mannailaiset, joten Askenas on Armenian ja Luoteis-Iranin ylängöiden kansojen joukossa, jotka olivat joutuneet Meedian vallan alle 500-luvulla eaa. Keskiajalla juutalaiset kirjoittajat, muun muassa Rashi, käyttivät nimeä Askenas Saksasta, ja tästä Keski- ja Itä-Euroopan juutalaisia alettiin kutsua aškenasijuutalaisiksi."
  vi:
    - "Ách-kê-na là một dân và một xứ ở cực bắc theo thế giới quan của Kinh Thánh. Trong Bảng các dân, Ách-kê-na là con trai đầu của Gô-me: “Con trai của Gô-me là Ách-kê-na, Ri-phát, và Tô-ga-ma.” Phần lớn các học giả đồng nhất tên này với Ashguza hay Ishkuza trong các văn bản A-si-ri, người Scythia, vào thế kỷ 7 TCN xuất hiện ở phía nam dãy Kavkaz trên biên giới Urartu và Mannea; dạng Hê-bơ-rơ thường được giải thích là chép sai Ashkuz, với chữ nun viết thay cho waw. Các bia văn của Ê-sạt-ha-đôn kể về Ishpakaia của Ashguza, đồng minh của người Mannai, mà ông đã đánh bại; Herodotus nói người Scythia về sau cai trị châu Á hai mươi tám năm. August Dillmann, cùng những người khác, nghi ngờ sự đồng nhất này."
    - "Lời sấm của Giê-rê-mi nghịch cùng Ba-by-lôn triệu tập kẻ thù của nó từ phương bắc: “Hãy gọi những nước A-ra-rát, Min-ni, Ách-kê-na, đến đánh nó! Hãy lập một quan tướng đạo binh!”, và trong câu kế tiếp là “các vua Mê-đi”. A-ra-rát là Urartu và Min-ni là người Mannai, nên Ách-kê-na đứng cùng các dân của cao nguyên Armenia và tây bắc Iran đã nằm dưới quyền lực Mê-đi vào thế kỷ 6 TCN. Vào thời Trung cổ, các tác giả Do Thái, trong đó có Rashi, dùng Ashkenaz chỉ nước Đức, và từ đó người Do Thái ở Trung và Đông Âu được gọi là Ashkenazim."
  ro:
    - "Așchenaz este un popor și o țară din extremul nord în viziunea biblică asupra lumii. În tabelul neamurilor, Așchenaz este primul fiu al lui Gomer: „Și feciorii lui Gamer: Ashanaz și Rifat și Torgama”. Cei mai mulți cercetători identifică numele cu Ashguza sau Ishkuza din textele asiriene, sciții care în secolul al VII-lea î.Hr. apar la sud de Caucaz, la hotarele Urartului și ale Mannaei; forma ebraică este adesea explicată ca o copiere greșită a lui Ashkuz, cu nun scris în loc de waw. Inscripțiile lui Esar-Hadon vorbesc despre Ishpakaia din Ashguza, aliat cu mannaii, pe care l-a învins; Herodot spune că sciții au stăpânit mai târziu Asia douăzeci și opt de ani. August Dillmann, printre alții, s-a îndoit de această echivalare."
    - "Oracolul lui Ieremia împotriva Babilonului îi cheamă dușmanii din nord: să fie adunate împotriva lui împărățiile Araratului, Minni și Așchenaz, să fie pusă împotriva lui o căpetenie, iar în versetul următor, regii mezilor. Ararat este Urartu, iar Minni, mannaii, așa că Așchenaz stă alături de popoare din podișurile armenești și nord-vestice iraniene care ajunseseră sub puterea mezilor în secolul al VI-lea î.Hr. În Evul Mediu, scriitorii iudei, printre ei Rashi, au folosit Așchenaz pentru Germania, iar de aici evreii din Europa centrală și de est au ajuns să fie numiți așchenazi."
  bg:
    - "Аскеназ е народ и земя на далечния север в библейския поглед върху света. В Таблицата на народите Аскеназ е първият син на Гомер: „А синовете Гомерови: Асханаз, и Рифат, и Тогарма“. Повечето изследователи отъждествяват името с Ашгуза или Ишкуза от асирийските текстове, скитите, които през VII в. пр.н.е. се появяват на юг от Кавказ по границите на Урарту и Манея; еврейската форма често се обяснява като грешно преписване на Ашкуз, с нун, написан вместо ваф. Надписите на Асардан разказват за Ишпакая от Ашгуза, съюзен с манеите, когото победил; Херодот казва, че скитите по-късно владели Азия двадесет и осем години. Аугуст Дилман, между другите, се съмнявал в отъждествяването."
    - "Прорицанието на Йеремия против Вавилон призовава враговете му от севера: „Свикайте против нея царствата На Арарат, на Мини, и на Асханаз: Поставете над нея главатари“, а в следващия стих — „Мидските царе“. Арарат е Урарту, а Мини — манеите, така че Аскеназ стои с народи от арменските и северозападните ирански възвишения, които до VI в. пр.н.е. били попаднали под мидийска власт. През Средновековието еврейски автори, между които Раши, използвали Аскеназ за Германия и оттук евреите от Централна и Източна Европа започнали да се наричат ашкенази."
