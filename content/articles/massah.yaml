# Overview article (ADR 0007). Mainstream facts only; Massah is a name given to the place of an event rather than a camp, and the candidates on the map (Meribah, Rephidim, Kadesh-barnea) are given without a choice; the Synodal psalm numbering is noted.
id: massah
place: a296e06
title:
  en: "Massah"
  ru: "Масса"
  uk: "Масса"
  es: "Masá"
  pt: "Massá"
