body:
  en:
    - "Massah, “testing”, is the name Moses gave, with Meribah, “quarrel”, to the place at Rephidim where Israel found no water on the way from the wilderness of Sin to Sinai. The people “did chide with Moses, and said, Give us water that we may drink”, and asked, “Is the LORD among us, or not?”; Moses struck “the rock in Horeb” with his rod before the elders, and water came out. Massah is thus not a camp of its own but the name of what happened at Rephidim, and the map shows it with the places it may be: Meribah and Rephidim, which tradition sets in the south of Sinai, in or near the oasis of Feiran, and Kadesh-barnea in the north, where a second “water of Meribah” was struck from the rock near the end of the forty years. Deuteronomy, which names Massah between Taberah and Kibroth-hattaavah as a place where Israel provoked the Lord, may count it separately."
    - "Massah became the byword for testing God. “Ye shall not tempt the LORD your God, as ye tempted him in Massah”, says Deuteronomy, and Jesus answered the tempter with that verse; the blessing of Levi recalls the holy one “whom thou didst prove at Massah, and with whom thou didst strive at the waters of Meribah”. Psalm 95 (94 in the Synodal numbering) warns, “Harden not your heart, as in the provocation, and as in the day of temptation in the wilderness”, where the Hebrew has Meribah and Massah, and the Letter to the Hebrews repeats the warning. Paul saw in the rock that gave water a figure of Christ."
    - "Eusebius placed Rephidim near Pharan, the oasis of Feiran, and pilgrims on the way to Sinai passed through it from the fourth century on. Feiran, the largest oasis of the peninsula, with its palm groves, Byzantine ruins and Jebel Serbal above, is in the South Sinai governorate of Egypt; nothing on the ground can be tied to Massah."
  ru:
    - "Масса, «искушение», — имя, которое Моисей дал вместе с Меривой, «укорение», месту в Рефидиме, где Израиль не нашёл воды на пути из пустыни Син к Синаю. Народ укорял Моисея, говоря: «дайте нам воды пить», и спрашивал: «есть ли Господь среди нас, или нет?»; Моисей ударил жезлом «в скалу» в Хориве перед старейшинами, и пошла вода. Масса, таким образом, не отдельный стан, а имя того, что случилось в Рефидиме, и карта показывает её вместе с местами, которыми она может быть: Меривой и Рефидимом, которые предание помещает на юге Синая, в оазисе Фейран или близ него, и Кадесом на севере, где к концу сорока лет из скалы была изведена вторая «вода Меривы». Второзаконие, называющее Массу между Таверой и Киброт-Гаттаавой как место, где Израиль раздражил Господа, возможно, считает её отдельно."
    - "Масса стала нарицательным именем искушения Бога. «Не искушайте Господа, Бога вашего, как вы искушали Его в Массе», — говорит Второзаконие, и этим стихом Иисус ответил искусителю; благословение Левия вспоминает святого мужа, «которого Ты искусил в Массе, с которым Ты препирался при водах Меривы». Псалом 94 (95-й по еврейскому счёту) предостерегает: «не ожесточите сердца вашего, как в Мериве, как в день искушения в пустыне», и Послание к Евреям повторяет это предостережение. Павел видел в скале, давшей воду, образ Христа."
    - "Евсевий помещал Рефидим близ Фарана, оазиса Фейран, и паломники на пути к Синаю проходили через него с IV века. Фейран, крупнейший оазис полуострова, с пальмовыми рощами, византийскими развалинами и горой Сербал над ним, лежит в провинции Южный Синай в Египте; ничто на земле нельзя связать с Массой."
  uk:
    - "Масса, «випробування», — ім’я, яке Мойсей дав, разом з Меривою, «сварка», місцю в Рефідімі, де Ізраїль не знайшов води на шляху від пустелі Син до Синаю. Народ «сварились люде з Мойсейом, і гукали: Дай нам пити!» і питав: «Чи Господь є між нами, чи нема?»; Мойсей ударив жезлом «на скелї в Горебі» перед старшими, і вода потекла. Масса, отже, не окремий табір, а ім’я того, що сталося в Рефідімі, і мапа показує її з місцями, де вона може бути: Мерива й Рефідім, які традиція розміщує на півдні Синаю, в оазисі Фейран або поблизу нього, та Кадес на півночі, де другу «воду Мериви» було викликано зі скелі наприкінці сорока років. Книга Повторення Закону, що називає Массу між Таверою й Кіброт-Гаттаавою як місце, де Ізраїль розгнівив Господа, може рахувати її окремо."
    - "Масса стала прислів’ям про випробування Бога. «Не спокушуйте Господа, Бога вашого, як спокушували його коло Масси», — каже Повторення Закону, і Ісус відповів спокусникові цим віршем; благословення Левія згадує побожного, «котрого ти спокушував в Массї, і заводив сварку при водах Мериви». Псалом 95 (94 за синодальною нумерацією) застерігає: «Та не стали тверді серцями, як в Мериві, як у день Масси в пустинї!», де староєврейський текст має Мериву й Массу, і Послання до євреїв повторює застереження. Павло побачив у скелі, що дала воду, образ Христа."
    - "Євсевій розміщував Рефідім поблизу Фарану, оазису Фейран, і прочани на шляху до Синаю проходили через нього від IV ст. Фейран, найбільший оазис півострова, з пальмовими гаями, візантійськими руїнами й Джебель-Сербалем над ним, лежить у єгипетській мухафазі Південний Синай; ніщо на місці не можна пов’язати з Массою."
  es:
    - "Masá, «prueba», es el nombre que Moisés dio, junto con Meriba, «querella», al lugar de Refidim donde Israel no halló agua en el camino del desierto de Sin al Sinaí. El pueblo «altercó [...] con Moisés, y dijeron: Danos agua que bebamos», y preguntó: «¿Está, pues, Jehová entre nosotros, ó no?»; Moisés golpeó con su vara «la peña en Horeb» ante los ancianos, y salió agua. Masá no es, pues, un campamento propio sino el nombre de lo ocurrido en Refidim, y el mapa lo muestra con los lugares donde puede estar: Meriba y Refidim, que la tradición sitúa en el sur del Sinaí, en el oasis de Feirán o cerca de él, y Cades-barnea, en el norte, donde cerca del final de los cuarenta años se hizo brotar de la roca otras «aguas de la rencilla». Deuteronomio, que nombra Masá entre Tabera y Kibrot-hataava como lugar donde Israel provocó al Señor, quizá la cuente aparte."
    - "Masá se convirtió en el símbolo de tentar a Dios. «No tentaréis á Jehová vuestro Dios, como lo tentasteis en Massa», dice Deuteronomio, y Jesús respondió al tentador con ese versículo; la bendición de Leví recuerda al santo «al cual tentaste en Massa, y le hiciste reñir en las aguas de la rencilla». El Salmo 95 (94 en la numeración sinodal) advierte: «No endurezcáis vuestro corazón como en Meriba, como el día de Masa en el desierto», donde el hebreo tiene Meriba y Masá, y la Carta a los Hebreos repite la advertencia. Pablo vio en la roca que daba agua una figura de Cristo."
    - "Eusebio situó Refidim cerca de Farán, el oasis de Feirán, y los peregrinos camino del Sinaí pasaban por él desde el siglo IV. Feirán, el mayor oasis de la península, con sus palmerales, sus ruinas bizantinas y el Yebel Serbal por encima, está en la gobernación egipcia del Sinaí Meridional; nada sobre el terreno puede vincularse con Masá."
  pt:
    - "Massá, “prova”, é o nome que Moisés deu, com Meribá, “contenda”, ao lugar em Refidim onde Israel não achou água no caminho do deserto de Sim ao Sinai. O povo “contendeu com Moisés e disse: ‘Dê-nos água para beber’”, e perguntou: “O SENHOR está entre nós, ou não?”; Moisés feriu “a rocha em Horebe” com a vara diante dos anciãos, e saiu água. Massá não é, portanto, um acampamento próprio, mas o nome do que aconteceu em Refidim, e o mapa a mostra com os lugares em que pode estar: Meribá e Refidim, que a tradição põe no sul do Sinai, no oásis de Feiran ou perto dele, e Cades-Barneia, no norte, onde, perto do fim dos quarenta anos, se deram outras “águas de Meribá”, tiradas da rocha. Deuteronômio, que nomeia Massá entre Taberá e Quibrote-Hataavá como lugar onde Israel provocou o Senhor, pode contá-la à parte."
    - "Massá tornou-se o símbolo de pôr Deus à prova. “Você não tentará o SENHOR, seu Deus, como o tentou em Massá”, diz Deuteronômio, e Jesus respondeu ao tentador com esse versículo; a bênção de Levi recorda o piedoso “a quem você provou em Massá, com quem você contendeu nas águas de Meribá”. O Salmo 95 (94 na numeração sinodal) adverte: “Não endureçam o seu coração, como em Meribá, como no dia de Massá no deserto”, onde o hebraico traz Meribá e Massá, e a Carta aos Hebreus repete a advertência. Paulo viu na rocha que deu água uma figura de Cristo."
    - "Eusébio situou Refidim perto de Farã, o oásis de Feiran, e peregrinos a caminho do Sinai passavam por ele desde o século IV. Feiran, o maior oásis da península, com seus palmeirais, ruínas bizantinas e o Jebel Serbal acima, fica na província egípcia do Sinai do Sul; nada no terreno pode ser ligado a Massá."
  de:
    - "Massa, „Prüfung“, ist der Name, den Mose zusammen mit Meriba, „Streit“, dem Ort bei Refidim gab, wo Israel auf dem Weg von der Wüste Sin zum Sinai kein Wasser fand. Die Israeliten „zankten mit Mose und sprachen: Gebt uns Wasser, daß wir trinken“ und fragten: „Ist der HERR unter uns oder nicht?“; Mose schlug vor den Ältesten mit seinem Stab den Fels am Horeb, und Wasser kam heraus. Massa ist also kein eigenes Lager, sondern der Name dessen, was bei Refidim geschah, und die Karte zeigt es bei den möglichen Orten: Meriba und Refidim, die die Überlieferung im Süden des Sinai ansetzt, in oder nahe der Oase Feiran, und Kadesch-Barnea im Norden, wo gegen Ende der vierzig Jahre ein zweites „Haderwasser“ aus dem Felsen geschlagen wurde. Das 5. Buch Mose nennt Massa zwischen Tabera und Kibrot-Taawa als Ort, an dem Israel den HERRN erzürnte, und zählt es vielleicht gesondert."
    - "Massa wurde zum Inbegriff, Gott zu versuchen. „Ihr sollt den HERRN, euren Gott, nicht versuchen, wie ihr ihn versuchtet zu Massa“, sagt das 5. Buch Mose, und Jesus antwortete dem Versucher mit dem Wort: „Du sollst Gott, deinen HERRN, nicht versuchen.“ Der Segen Levis erinnert an den heiligen Mann, „den du versucht hast zu Massa, da ihr hadertet am Haderwasser“. Psalm 95 (94 in der Zählung der Synodalbibel) warnt: „so verstocket euer Herz nicht, wie zu Meriba geschah, wie zu Massa in der Wüste“, wo auch der hebräische Text Meriba und Massa nennt, und der Hebräerbrief wiederholt die Warnung. Paulus sah im Fels, der Wasser gab, ein Bild Christi."
    - "Eusebius setzte Refidim bei Pharan an, der Oase Feiran, und Pilger auf dem Weg zum Sinai zogen ab dem 4. Jahrhundert durch sie hindurch. Feiran, die größte Oase der Halbinsel, mit ihren Palmenhainen, byzantinischen Ruinen und dem Jebel Serbal darüber, liegt im ägyptischen Gouvernement Südsinai; nichts am Boden lässt sich mit Massa verbinden."
  fr:
    - "Massa, « mise à l’épreuve », est le nom que Moïse donna, avec Meriba, « querelle », au lieu de Rephidim où Israël, en route du désert de Sin au Sinaï, ne trouva pas d’eau. Le peuple « chercha querelle à Moïse. Ils dirent : Donnez-nous de l’eau à boire », puis : « L’Éternel est-il au milieu de nous, ou n’y est-il pas ? » ; Moïse frappa de sa verge « le rocher d’Horeb » devant les anciens, et l’eau en sortit. Massa n’est donc pas un camp à part mais le nom de ce qui arriva à Rephidim ; la carte la montre avec ses lieux possibles : Meriba et Rephidim, que la tradition place au sud du Sinaï, dans ou près de l’oasis de Feiran, et Kadès-Barnéa au nord, où une seconde « eau de Meriba » jaillit du rocher vers la fin des quarante ans. Le Deutéronome, qui nomme Massa entre Tabeéra et Kibroth-Hattaava, lieux où Israël excita la colère de l’Éternel, la compte peut-être à part."
    - "Massa devint le symbole de la mise à l’épreuve de Dieu. « Vous ne tenterez point l’Éternel, votre Dieu, comme vous l’avez tenté à Massa », dit le Deutéronome, et Jésus répondit au tentateur par ce verset ; la bénédiction de Lévi rappelle « l’homme saint, que tu as tenté à Massa, et avec qui tu as contesté aux eaux de Meriba ». Le Psaume 95 (94 dans la numérotation synodale) avertit : « N’endurcissez pas votre cœur, comme à Meriba, comme à la journée de Massa, dans le désert », où l’hébreu a Meriba et Massa, et l’épître aux Hébreux répète l’avertissement. Paul voyait dans le rocher qui donna de l’eau une figure du Christ."
    - "Eusèbe plaçait Rephidim près de Pharan, l’oasis de Feiran, et les pèlerins en route vers le Sinaï y passaient dès le IVe siècle. Feiran, la plus grande oasis de la péninsule, avec ses palmeraies, ses ruines byzantines et le djebel Serbal au-dessus, se trouve dans le gouvernorat du Sud-Sinaï, en Égypte ; rien sur le terrain ne peut être rattaché à Massa."
  it:
    - "Massa, «prova», è il nome che Mosè diede, con Meriba, «contesa», al luogo di Refidim dove Israele non trovò acqua nel cammino dal deserto di Sin al Sinai. Il popolo «contese con Mosè, e disse: “Dateci dell’acqua da bere”», e chiese: «L’Eterno è egli in mezzo a noi, si o no?»; Mosè percosse con il suo bastone «la roccia ch’è in Horeb» davanti agli anziani, e ne uscì acqua. Massa non è dunque un accampamento a sé ma il nome di ciò che accadde a Refidim, e la mappa la mostra con i luoghi in cui può trovarsi: Meriba e Refidim, che la tradizione pone nel sud del Sinai, nell’oasi di Feiran o presso di essa, e Kades-Barnea nel nord, dove verso la fine dei quarant’anni furono fatte sgorgare dalla roccia le seconde «acque di Meriba». Il Deuteronomio, che nomina Massa tra Taberà e Kibrot-Taava come luogo in cui Israele provocò il Signore, può contarla a parte."
    - "Massa divenne il simbolo proverbiale del tentare Dio. «Non tenterete l’Eterno, il vostro Dio, come lo tentaste a Massa», dice il Deuteronomio, e Gesù rispose al tentatore con quel versetto; la benedizione di Levi ricorda l’uomo pio «che tu provasti a Massa, e col quale contendesti alle acque di Meriba». Il Salmo 95 (94 nella numerazione sinodale) avverte: «non indurate il vostro cuore come a Meriba, come nel giorno di Massa nel deserto», dove l’ebraico ha i nomi stessi, Meriba e Massa, mentre la Lettera agli Ebrei ripete l’avvertimento rendendoli «come nel dì della provocazione, come nel dì della tentazione nel deserto». Paolo vide nella roccia che dava acqua una figura di Cristo."
    - "Eusebio collocava Refidim presso Faran, l’oasi di Feiran, e i pellegrini diretti al Sinai vi passavano dal IV secolo in poi. Feiran, la più grande oasi della penisola, con i suoi palmeti, le rovine bizantine e il Jebel Serbal sopra, si trova nel governatorato egiziano del Sinai meridionale; nulla sul terreno può essere legato a Massa."
  pl:
    - "Massa, „próba”, to nazwa, którą Mojżesz nadał, wraz z Merybą, „spór”, miejscu w Refidim, gdzie Izrael nie znalazł wody w drodze z pustyni Sin na Synaj. Wtedy „swarzył się lud z Mojżeszem, mówiąc: Dajcie nam wody, abyśmy pili”, i pytano: „I jestże Pan między nami czyli nie?”; Mojżesz, gdzie Pan stanął „na skale w Horeb”, uderzył laską w skałę przed starszymi i wyszła woda. Massa nie jest więc osobnym obozem, lecz nazwą tego, co stało się w Refidim; mapa pokazuje ją z miejscami, którymi może być: Meriba i Refidim, które tradycja umieszcza na południu Synaju, w oazie Feiran lub blisko niej, oraz Kadesz-Barnea na północy, gdzie drugie „wody poswarku” wydobyto ze skały pod koniec czterdziestu lat. Księga Powtórzonego Prawa, która wymienia Massę między Taberą a Kibrot-Hattaawa jako miejsce, gdzie Izrael pobudził Pana do gniewu, może liczyć ją osobno."
    - "Massa stała się przysłowiem kuszenia Boga. „Nie będziecie kusić Pana, Boga waszego, jakoście go kusili w Massa”, mówi Księga Powtórzonego Prawa, i Jezus odparł kusiciela tym wersetem; błogosławieństwo Lewiego wspomina świętego męża, „któregoś kusił w Massa, i z którymeś miał spór u wód Meryba”. Psalm 95 (94 w numeracji synodalnej) ostrzega: „Nie zatwardzajcież serca swego, jako w Meryba, a jako czasu kuszenia na puszczy”, gdzie hebrajski ma Merybę i Massę, a List do Hebrajczyków powtarza to ostrzeżenie. Paweł widział w skale, która dawała wodę, obraz Chrystusa."
    - "Euzebiusz umieszczał Refidim koło Faran, oazy Feiran, a pielgrzymi w drodze na Synaj przechodzili przez nią od IV w. Feiran, największa oaza półwyspu, z gajami palmowymi, ruinami bizantyjskimi i górą Dżabal Serbal ponad nią, leży w muhafazie Synaj Południowy w Egipcie; nic w terenie nie da się powiązać z Massą."
  nl:
    - "Massa, “verzoeking”, is de naam die Mozes, met Meriba, “twist”, gaf aan de plaats bij Refidim waar Israël op weg van de woestijn van Sin naar de Sinaï geen water vond. “Toen twistte het volk met Mozes, en zeide: Geeft gijlieden ons water, dat wij drinken!”, en vroeg: “Is de HEERE in het midden van ons, of niet?”; Mozes sloeg met zijn staf op “de rotssteen in Horeb” voor de oudsten, en er kwam water uit. Massa is dus geen legerplaats maar de naam van wat bij Refidim gebeurde; de kaart toont het bij mogelijke plaatsen: Meriba en Refidim, die de overlevering in het zuiden van de Sinaï plaatst, bij de oase Feiran, en Kades-Barnea in het noorden, waar tegen het einde van de veertig jaar een tweede “wateren van Meriba” uit de rots kwamen. Deuteronomium noemt Massa tussen Tabera en Kibrot-Hattaäva, plaatsen waar Israël de HEER vertoornde, en telt het misschien afzonderlijk."
    - "Massa werd het spreekwoord voor het beproeven van God. “Gij zult den HEERE, uw God, niet verzoeken, gelijk als gij Hem verzocht hebt te Massa”, zegt Deuteronomium, en Jezus antwoordde de verzoeker met dat vers; de zegen over Levi gedenkt de gunstgenoot “dien Gij verzocht hebt in Massa, met welken Gij getwist hebt aan de wateren van Meriba”. Psalm 95 (94 in de nummering van de Synodale Bijbel) waarschuwt: “Verhardt uw hart niet, gelijk te Meriba, gelijk ten dage van Massa in de woestijn”, waar het Hebreeuws Meriba en Massa heeft, en de Brief aan de Hebreeën herhaalt de waarschuwing. Paulus zag in de rots die water gaf een beeld van Christus."
    - "Eusebius plaatste Refidim bij Pharan, de oase Feiran, en pelgrims op weg naar de Sinaï trokken er vanaf de vierde eeuw doorheen. Feiran, de grootste oase van het schiereiland, met zijn palmbossen, Byzantijnse ruïnes en de Jebel Serbal erboven, ligt in het Egyptische gouvernement Zuid-Sinaï; niets ter plaatse kan met Massa in verband worden gebracht."
  cs:
    - "Masa, „zkoušení“, je jméno, které Mojžíš dal spolu s Meribou, „svár“, místu v Refídimu, kde Izrael nenalezl vodu na cestě z pouště Sín na Sinaj. Tu „domlouval se lid na Mojžíše, pravě: Dejte nám vody, abychom pili“ a ptal se: „Jest-li Hospodin u prostřed nás, či není?“; Mojžíš udeřil holí před staršími „na skále, na Orébě“ a vyšla voda. Masa tedy není samostatný tábor, nýbrž jméno toho, co se stalo v Refídimu, a mapa ji ukazuje s místy, kde snad byla: Meribou a Refídimem, které tradice klade na jih Sinaje, do oázy Feiran nebo blízko ní, a Kádeš-barneou na severu, kde byly ke konci čtyřiceti let ze skály vyraženy druhé „vody sváru“. Deuteronomium, které jmenuje Masu mezi Taberou a Kibrót-hataavou jako místo, kde Izrael popouzel Hospodina, ji může počítat zvlášť."
    - "Masa se stala synonymem pokoušení Boha. „Nebudete pokoušeti Hospodina Boha svého, jako jste pokoušeli v Massah“, praví Deuteronomium, a Ježíš touto větou odpověděl pokušiteli; požehnání Leviho připomíná svatého, „kteréhož jsi zkusil v pokušení, a kterýž podlé tebe měl nesnáz při vodách Meribah“. Žalm 95 (94 v synodálním číslování) varuje: „Nezatvrzujte srdce svého, jako při popuzení, a v den pokušení na poušti“, kde hebrejština má Meribu a Masu, a List Židům to varování opakuje. Pavel viděl ve skále, která dala vodu, obraz Krista."
    - "Eusebius kladl Refídim k Faranu, oáze Feiran, a poutníci na cestě na Sinaj jí od 4. století procházeli. Feiran, největší oáza poloostrova, se svými palmovými háji, byzantskými zříceninami a Jebel Serbal nad sebou, leží v egyptském guvernorátu Jižní Sinaj; nic na místě nelze spojit s Masou."
  sv:
    - "Massa, ”prövning”, är det namn Mose gav, tillsammans med Meriva, ”kiv”, åt platsen i Refidim där Israel inte fann något vatten på vägen från Sins öken till Sinai. Folket begynte ”tvista med Mose och sade: »Given oss vatten att dricka.»” och frågade: ”Är HERREN ibland oss eller icke?”; Mose slog på ”Horebs klippa” med sin stav inför de äldste, och vatten kom ut. Massa är alltså inte ett eget läger utan namnet på det som hände i Refidim, och kartan visar det med de platser det kan vara: Meriva och Refidim, som traditionen förlägger i södra Sinai, i eller nära oasen Feiran, och Kadesh-Barnea i norr, där ett andra ”Meribas vatten” slogs ur klippan nära slutet av de fyrtio åren. Femte Mosebok, som nämner Massa mellan Tavera och Kivrot-Hattaava som en plats där Israel förtörnade Herren, kan räkna det för sig."
    - "Massa blev ett ordspråk för att fresta Gud. ”I skolen icke fresta HERREN, eder Gud, såsom I frestaden honom i Massa”, säger Femte Mosebok, och Jesus svarade frestaren med den versen; Levis välsignelse erinrar om ”din frommes skara”, ”dem du frestade i Massa, dem du tvistade med vid Meribas vatten”. Psalm 95 (94 i den synodala numreringen) varnar: ”Förhärden icke edra hjärtan såsom i Meriba, såsom på Massas dag i öknen”, där hebreiskan har Meriva och Massa, och Hebreerbrevet upprepar varningen. Paulus såg i klippan som gav vatten en bild av Kristus."
    - "Eusebios förlade Refidim nära Pharan, oasen Feiran, och pilgrimer på väg till Sinai passerade den från 300-talet och framåt. Feiran, halvöns största oas, med sina palmlundar, bysantinska ruiner och Jebel Serbal ovanför, ligger i Egyptens guvernement Södra Sinai; ingenting på marken kan knytas till Massa."
  nb:
    - "Massa, «prøvelse», er navnet Moses ga, sammen med Meriba, «strid», til stedet ved Refidim der Israel ikke fant vann på veien fra ørkenen Sin til Sinai. Der «kivedes folket med Moses og sa: Gi oss vann, så vi får drikke!», og spurte: «Er Herren iblandt oss eller ikke?»; Moses slo på «klippen ved Horeb» med staven foran de eldste, og vann kom ut. Massa er altså ikke en egen leir, men navnet på det som skjedde ved Refidim, og kartet viser det med de stedene det kan være: Meriba og Refidim, som tradisjonen plasserer i det sørlige Sinai, i eller nær oasen Feiran, og Kadesj-Barnea i nord, der et annet «Meribas vann» ble slått fra klippen mot slutten av de førti årene. Femte Mosebok, som nevner Massa mellom Tabera og Kibrot-Hattaava som et sted der Israel vakte Herrens vrede, kan telle det særskilt."
    - "Massa ble et ordtak for å friste Gud. «I skal ikke friste Herren eders Gud, således som I fristet ham i Massa», sier Femte Mosebok, og Jesus svarte fristeren med dette verset; Levis velsignelse minner om den fromme mann «som du fristet ved Massa, som du trettet med ved Meribas vann». Salme 95 (94 i synodalbibelens nummerering) advarer: «Forherd ikke eders hjerte, likesom ved Meriba, likesom på Massadagen i ørkenen», der hebraisk har Meriba og Massa, og Hebreerbrevet gjentar advarselen. Paulus så i klippen som ga vann et bilde på Kristus."
    - "Eusebius plasserte Refidim nær Faran, oasen Feiran, og pilegrimer på vei til Sinai passerte gjennom den fra 300-tallet. Feiran, halvøyas største oase, med sine palmelunder, bysantinske ruiner og Jebel Serbal ovenfor, ligger i Egypts guvernement Sør-Sinai; ingenting på bakken kan knyttes til Massa."
  tl:
    - "Ang Massah, “pagsubok”, at Meribah, “pakikipagtalo”, ay pangalang ibinigay ni Moises sa Rephidim, kung saan walang tubig ang Israel sa daan mula ilang ng Sin patungong Sinai. Ang bayan ay “nakipagtalo kay Moises, at nagsabi, Bigyan mo kami ng tubig na aming mainom”, at nagtanong, “Ang Panginoon ba'y nasa gitna natin o wala?”; hinampas ni Moises ng tungkod ang “bato sa Horeb” sa harap ng matatanda, at lumabas ang tubig. Pangalan ng nangyari sa Rephidim ang Massah, di kampo; itinatampok ng mapa mga posibleng lugar: Meribah at Rephidim, sa timog ng Sinai ayon sa tradisyon, sa oasis ng Feiran o malapit, at Cades-barnea sa hilaga, kung saan pinalabas sa bato ang ikalawang “tubig ng Meriba” bandang wakas ng apatnapung taon. Maaaring ibilang itong hiwalay ng Deuteronomio, na naglalagay sa Massah sa pagitan ng Tabera at Kibroth-hattaavah, mga pook kung saan minungkahi ng Israel ang Panginoon."
    - "Ang Massah ay naging sagisag ng pagsubok sa Diyos. “Huwag ninyong tutuksuhin ang Panginoon ninyong Dios, gaya ng tuksuhin ninyo siya sa Massah”, sabi ng Deuteronomio, at sinagot ni Jesus ang manunukso ng talatang iyon; inaalala ng pagpapala kay Levi ang banal na “Na siyang iyong sinubok sa Massa, Na siya mong kinatunggali sa tubig ng Meriba”. Nagbababala ang Awit 95 (94 sa bilang ng Synodal): “Huwag ninyong papagmatigasin ang inyong puso, gaya sa Meriba, gaya sa kaarawan ng Masa sa ilang”, kung saan ang Hebreo ay may Meribah at Massah, at inuulit ng Sulat sa mga Hebreo ang babala. Nakita ni Pablo sa batong nagbigay ng tubig ang larawan ni Cristo."
    - "Inilagay ni Eusebio ang Rephidim malapit sa Pharan, ang oasis ng Feiran, at dumaan dito ang mga peregrinong patungong Sinai mula ika-4 na siglo. Ang Feiran, ang pinakamalaking oasis ng tangway, na may mga kakahuyan ng palma, mga guhong Bizantino at ang Jebel Serbal sa itaas, ay nasa South Sinai Governorate ng Egipto; walang nasa lupa na maiuugnay sa Massah."
  da:
    - "Massa, »prøvelse«, er det navn, Moses gav, sammen med Meriba, »kiv«, til stedet ved Refidim, hvor Israel ikke fandt vand på vejen fra Sin-ørkenen til Sinaj. Folket »kivedes med Mose, og de sagde: Giver os Vand, at vi kunne drikke« og spurgte: »Monne Herren være iblandt os eller ej?«; Moses slog »Klippen paa Horeb« med sin stav for de ældste, og vand kom ud. Massa er således ikke en lejr for sig, men navnet på det, der skete ved Refidim, og kortet viser det med de steder, det kan være: Meriba og Refidim, som traditionen sætter i det sydlige Sinai, i eller nær oasen Feiran, og Kadesj-Barnea i nord, hvor et andet »Kivevandet« blev slået af klippen nær slutningen af de fyrre år. Femte Mosebog, som nævner Massa mellem Tab'era og Kibrot-ha-Ta'ava som et sted, hvor Israel vakte Herrens vrede, kan regne det for sig."
    - "Massa blev det faste udtryk for at friste Gud. »I skulle ikke friste Herren eders Gud, saaledes som I fristede ham i Massa«, siger Femte Mosebog, og Jesus svarede fristeren med det vers; Levis velsignelse mindes den hellige, »hvem du fristede i Massa, med hvem du kivedes ved Meribas Vand«. Salme 95 (94 i den synodale nummerering) advarer: »Forhærder ikke eders Hjerte, som ved Meriba, som paa den Dag ved Massa udi Ørken«, hvor den hebraiske tekst har Meriba og Massa, og Brevet til Hebræerne gentager advarslen. Paulus så i klippen, der gav vand, et billede af Kristus."
    - "Eusebios placerede Refidim nær Faran, oasen Feiran, og pilgrimme på vej til Sinaj drog gennem den fra 300-tallet. Feiran, halvøens største oase, med sine palmelunde, byzantinske ruiner og Jebel Serbal ovenover, ligger i Egyptens guvernement Sydsinai; intet på stedet kan knyttes til Massa."
  sr:
    - "Маса, „кушање“, име је које је Мојсије дао, заједно с Меривом, „свађа“, месту у Рафидину где Израиљ није нашао воде на путу из пустиње Син на Синај. Народ се „свађаше с Мојсијем говорећи: Дај нам воде да пијемо“ и питао: „Је ли Господ међу нама или није?“; Мојсије је пред старешинама штапом ударио у стену, док је Господ стајао „на стени на Хориву“, и потекла је вода. Маса дакле није посебан логор него име оног што се догодило у Рафидину, а мапа је приказује с местима у која може спадати: Мерива и Рафидин, које предање смешта на југ Синаја, у оазу Фајран или близу ње, и Кадис-Варнија на северу, где је близу краја четрдесет година из стене истерана друга „вода од свађе“. Поновљени закон, који Масу наводи између Тавере и Киврот-Атаве као место где је Израиљ гневио Господа, можда је броји посебно."
    - "Маса је постала синоним за искушавање Бога. „Немојте кушати Господа Бога свог као што Га кушасте у Маси“, каже Поновљени закон, и Исус је тим стихом одговорио кушачу; благослов Левијев подсећа на светог човека „ког си окушао у Маси и с којим си се препирао на води Мериви“. Псалам 95 (94 по синодалном нумерисању) опомиње: „Немојте да вам одрвени срце ваше као у Мериви, као у дан кушања у пустињи“, где хебрејски има Мериву и Масу, а Посланица Јеврејима понавља опомену. Павле је у стени која је дала воду видео слику Христа."
    - "Јевсевије је сместио Рафидин близу Фарана, оазе Фајран, а ходочасници на путу на Синај пролазили су кроз њу од IV века. Фајран, највећа оаза полуострва, са палмовим гајевима, византијским рушевинама и Џебел Сербалом изнад, налази се у египатском гувернорату Јужни Синај; ништа на терену не може се везати за Масу."
  hu:
    - "Massza, „megkísértés”, a neve annak a helynek, amelyet Mózes Meribával, „veszekedéssel”, együtt adott Refidimnek, ahol Izráel nem talált vizet a Szín pusztájából a Sínaira vezető úton. A nép „Verseng vala azért a nép Mózessel és mondák: Adjatok nékünk vizet, hogy igyunk”, és megkérdezte: „Vajjon köztünk van-é az Úr vagy nincsen?”; Mózes a vének előtt vesszejével „a sziklára a Hóreben” sújtott, és víz jött ki. Massza tehát nem külön tábor, hanem a refidimi esemény neve; a térkép a lehetséges helyekkel mutatja: Meriba és Refidim, amelyeket a hagyomány Dél-Sínaira, a Feiran-oázisba vagy közelébe helyez, és Kádes-Barnea északon, ahol a negyven év vége felé újabb „versengésnek vizei” fakadtak a sziklából. Mózes ötödik könyve, amely Masszát Tabera és Kibrót-Hattaava között említi mint azt a helyet, ahol Izráel haragra indította az Urat, talán külön számolja."
    - "Massza az Isten megkísértésének közmondása lett. „Meg ne kísértsétek az Urat, a ti Isteneteket, miképen megkísértettétek Maszszában!” mondja Mózes ötödik könyve, és Jézus ezzel a verssel felelt a kísértőnek; Lévi áldása az Úr szentjét idézi, „a kit megkísértél Masszában, a kivel perbe szálltál Mériba vizeinél”. A 95. zsoltár (a szinodális számozásban 94.) int: „Ne keményítsétek meg a ti szíveteket, mint Meribáhnál, mint Maszszáh napján a pusztában”, ahol a héberben Meriba és Massza áll, és a Zsidókhoz írt levél megismétli az intést. Pál a vizet adó sziklában Krisztus előképét látta."
    - "Eusebius Refidimet Pharan, a Feiran-oázis közelébe helyezte, és a Sínaira tartó zarándokok a 4. századtól kezdve átmentek rajta. Feiran, a félsziget legnagyobb oázisa, pálmaligeteivel, bizánci romjaival és a fölötte magasodó Jebel Serbal-lal, Egyiptom Dél-Sínai kormányzóságában van; semmi a terepen nem köthető Masszához."
  fi:
    - "Massa, ”koettelu”, on nimi, jonka Mooses antoi Meriban, ”riidan”, kanssa Refidimin paikalle, jossa Israel ei löytänyt vettä matkalla Sinin erämaasta Siinaille. Kansa ”riiteli Moosesta vastaan ja sanoi: ’Antakaa meille vettä juoda!’” ja kysyi: ”Onko Herra meidän keskellämme vai ei?”; Mooses löi sauvallaan vanhinten nähden kalliota Hoorebin luona, ja vettä tuli ulos. Massa ei siis ole oma leirinsä vaan Refidimissä tapahtuneen nimi, ja kartta näyttää sen paikkojen kanssa, joita se voi olla: Meriba ja Refidim, jotka perimätieto sijoittaa Siinain eteläosaan, Feiranin keitaaseen tai sen lähelle, ja Kades-Barnea pohjoisessa, jossa toinen ”Meriban vesi” iskettiin kalliosta lähellä neljänkymmenen vuoden loppua. Viides Mooseksen kirja, joka nimeää Massan Taberan ja Kibrot-Hattaavan välissä paikkana, jossa Israel vihoitti Herran, saattaa laskea sen erikseen."
    - "Massa tuli sananparreksi Jumalan koettelemisesta. ”Älkää kiusatko Herraa, teidän Jumalaanne, niinkuin kiusasitte häntä Massassa”, sanoo Viides Mooseksen kirja, ja Jeesus vastasi kiusaajalle tällä jakeella; Leevin siunaus muistaa hurskaan, ”jota sinä Massassa koettelit, jonka kanssa sinä riitelit Meriban veden luona”. Ps. 95 (Synodaalisessa numeroinnissa 94) varoittaa: ”Älkää paaduttako sydäntänne, niinkuin Meribassa, niinkuin Massan päivänä erämaassa”, missä heprea sanoo Meriba ja Massa, ja Heprealaiskirje toistaa varoituksen. Paavali näki vettä antaneessa kalliossa Kristuksen kuvan."
    - "Eusebios sijoitti Refidimin lähelle Pharania, Feiranin keidasta, ja Siinaille matkaavat pyhiinvaeltajat kulkivat sen kautta 300-luvulta lähtien. Feiran, niemimaan suurin keidas palmulehtoineen, bysanttilaisine raunioineen ja yläpuolellaan kohoavine Jebel Serbal -vuorineen, sijaitsee Egyptin Etelä-Siinain kuvernementissa; mikään maastossa ei ole sidottavissa Massaan."
  vi:
    - "Ma-sa, “thử thách”, là tên Môi-se đặt, cùng với Mê-ri-ba, “tranh cãi”, cho nơi ở Rê-phi-đim, nơi Y-sơ-ra-ên không có nước trên đường từ đồng vắng Sin đến Si-na-i. Dân sự “kiếm cớ cãi lộn cùng Môi-se mà rằng: Hãy cho chúng tôi nước uống”, và hỏi: “Có Đức Giê-hô-va ở giữa chúng ta hay chăng?”; Môi-se đập “hòn đá tại Hô-rếp” bằng cây gậy trước mặt các trưởng lão, và nước chảy ra. Vậy Ma-sa không phải một nơi đóng trại riêng mà là tên của điều đã xảy ra ở Rê-phi-đim, và bản đồ cho thấy nó cùng những nơi nó có thể là: Mê-ri-ba và Rê-phi-đim, mà truyền thống đặt ở nam Si-na-i, trong hay gần ốc đảo Feiran, và Ca-đe-Ba-nê-a ở phía bắc, nơi “nước của Mê-ri-ba” thứ hai được đập ra từ đá gần cuối bốn mươi năm. Sách Phục truyền, nêu Ma-sa giữa Tha-bê-ra và Kíp-rốt Ha-ta-ava là nơi Y-sơ-ra-ên chọc giận Chúa, có thể kể nó riêng."
    - "Ma-sa trở thành tiếng chỉ việc thử Đức Chúa Trời. “Các ngươi chớ thử Giê-hô-va Đức Chúa Trời các ngươi, như đã thử Ngài tại Ma-sa”, Phục truyền nói, và Giê-su đáp kẻ cám dỗ bằng câu ấy; lời chúc phước cho Lê-vi nhớ đến đấng thánh “ngươi thử thách tại Ma-sa, Tranh giành với tại nước Mê-ri-ba”. Thi thiên 95 (94 theo cách đánh số Synodal) cảnh cáo: “Chớ cứng lòng như tại Mê-ri-ba, Như nhằm ngày Ma-sa trong đồng vắng”, nơi bản Hê-bơ-rơ có Mê-ri-ba và Ma-sa, và thư gửi người Hê-bơ-rơ lặp lại lời cảnh cáo. Phao-lô thấy trong hòn đá cho nước một hình ảnh của Đấng Christ."
    - "Eusebius đặt Rê-phi-đim gần Pha-ran, ốc đảo Feiran, và những người hành hương đến Si-na-i đi qua đó từ thế kỷ 4 trở đi. Feiran, ốc đảo lớn nhất của bán đảo, với các lùm chà là, tàn tích Byzantine và Jebel Serbal phía trên, nằm trong tỉnh Nam Si-na-i của Ai Cập; không có gì trên mặt đất có thể gắn với Ma-sa."
  ro:
    - "Masa, „încercare”, este numele pe care Moise l-a dat, împreună cu Meriba, „ceartă”, locului de la Refidim unde Israel n-a găsit apă pe drumul din pustia Sin spre Sinai. Poporul s-a certat cu Moise – „blestemà poporul pre Moisì, zicând: dă-ne apă să bem” – și a întrebat: „de este Domnul întru noi, au ba?”; Moise a mers „la piatră în Horiv”, a lovit-o cu toiagul în fața bătrânilor și a ieșit apă. Masa nu este deci o tabără aparte, ci numele a ceea ce s-a petrecut la Refidim, iar harta o arată cu locurile în care poate fi: Meriba și Refidim, pe care tradiția le așază în sudul Sinaiului, în oaza Feiran sau lângă ea, și Cades-Barnea în nord, unde o a doua „apă a pricirii” a fost scoasă din stâncă spre sfârșitul celor patruzeci de ani. Deuteronomul, care numește Masa între Tabera și Chibrot-Hataava ca loc unde Israel l-a întărâtat pe Domnul, poate să o numere separat."
    - "Masa a devenit sinonimul încercării lui Dumnezeu. „Să nu ispitești pre Domnul Dumnezeul tău, precum l-ați ispitit la ispită”, spune Deuteronomul, și Isus i-a răspuns ispititorului cu acest verset; binecuvântarea lui Levi amintește pe cel cuvios „pre care l-a ispitit la ispitire, și l-a batjocorit pre el la apa prigonirei”. Psalmul 95 (94 în numerotarea sinodală) avertizează să nu vă învârtoșați inima, ca în întărâtare și ca în ziua ispitirii în pustie, unde ebraica are Meriba și Masa, iar Epistola către Evrei repetă avertismentul: „Nu vă învârtoșați inimele voastre, ca și întru întărîtare, în ziua ispitirei în pustie”. Pavel a văzut în stânca ce dădea apă o figură a lui Hristos."
    - "Eusebiu așeza Refidim lângă Faran, oaza Feiran, iar pelerinii în drum spre Sinai au trecut prin ea din secolul al IV-lea încolo. Feiran, cea mai mare oază a peninsulei, cu palmierii, ruinele bizantine și Jebel Serbal deasupra, se află în guvernoratul Sinai de Sud al Egiptului; nimic de pe teren nu poate fi legat de Masa."
  bg:
    - "Маса, „изпитание“, е името, което Мойсей даде, заедно с Мерива, „препирня“, на мястото в Рефидим, където Израил не намери вода по пътя от пустинята Син към Синай. Людете „се караха… с Мойсея и рекоха: Дай ни вода да пием“ и питаха: „Да ли е между нас Господ, или не?“; Мойсей удари с жезъла си „канарата в Хорив“ пред старейшините и излезе вода. Следователно Маса не е отделен стан, а името на случилото се в Рефидим, и картата го показва заедно с местата, където може да е: Мерива и Рефидим, които традицията поставя в Южен Синай, във или близо до оазиса Фейран, и Кадес-Варни на север, където към края на четиридесетте години от канарата бе изведена втора „водата на Мерива“. Второзаконие, което назовава Маса между Тавера и Киброт-Хатаава като място, където Израил разгневи Господа, може да го брои отделно."
    - "Маса става нарицателно за изпитване на Бога. „Да не изкушавате Господа Бога нашего както го изкусихте в Маса“, казва Второзаконие, и Исус отговори на изкусителя с този стих; благословението на Леви припомня светия, „Когото си изкусил в Маса, И с когото си се препирал при водите на Мерива“. Псалом 95 (94 в Синодалната номерация) предупреждава: „Не ожесточавайте сърдцето си както в Мерива, Както в деня на изкушението в пустинята“, където еврейският текст има Мерива и Маса, а Посланието към евреите повтаря предупреждението. Павел видя в канарата, която даде вода, образ на Христос."
    - "Евсевий поставя Рефидим близо до Фаран, оазиса Фейран, и поклонниците на път за Синай минавали през него от IV в. нататък. Фейран, най-големият оазис на полуострова, с палмовите си горички, византийски развалини и Джебел Сербал над него, е в египетската губерния Южен Синай; нищо на терена не може да бъде свързано с Маса."
