# Overview article (ADR 0007). Mainstream facts only; disputed things are said to be disputed.
id: dan
place: a513646
title:
  en: "Dan"
  ru: "Дан"
body:
  en:
    - "Dan lay at Tel Dan (Tell el-Qadi), at the foot of Mount Hermon, beside the springs that are the main source of the Jordan, and it marked the northern end of Israel. Under its older name, Laish, the town appears in Egyptian execration texts and among the places taken by Thutmose III in the fifteenth century BC. In the Middle Bronze Age it was ringed by huge earthen ramparts, and a mudbrick gate with three arches, built about 1750 BC, still stands. Avraham Biran excavated the site from 1966 to 1999."
    - 'Abram pursued the kings who had carried off Lot as far as Dan. Judges tells how the tribe of Dan, seeking land, sent spies to Laish, a quiet and secure town far from Sidon; the Danites burned it, rebuilt it and named it Dan after their forefather, and set up the graven image taken from Micah, with Jonathan son of Gershom as their priest. "From Dan even to Beer-sheba" became the phrase for the whole land of Israel.'
    - 'When the kingdom divided, Jeroboam set one golden calf at Bethel and the other at Dan; excavators uncovered a large sacred precinct with a raised platform and an altar from the Israelite period. Ben-hadad of Damascus struck Dan in the days of Baasha. In 1993 and 1994 fragments of an Aramaic stela of the ninth century BC were found near the city gate: an Aramean king, usually identified as Hazael, boasts of killing a king of Israel and a king of the "house of David". About 733/732 BC the city fell to Tiglath-pileser III of Assyria.'
    - 'A dedication in Greek and Aramaic of the late third or early second century BC, "to the god who is in Dan", shows that the sanctuary and the old name survived into Hellenistic times. Josephus places Dan at the springs of the Lesser Jordan. In the early fourth century Eusebius knew Dan as a village four Roman miles from Paneas on the road to Tyre, where the Jordan springs forth.'
  ru:
    - "Дан стоял на холме Тель-Дан (Телль-эль-Кади) у подножия Ермона, возле источников, которые служат главным истоком Иордана, и отмечал северный край Израиля. Под прежним именем Лаис город упоминается в египетских текстах проклятий и среди мест, взятых Тутмосом III в XV веке до н. э. В среднем бронзовом веке его окружили огромные земляные валы, а глинобитные ворота с тремя арками, построенные около 1750 г. до н. э., стоят до сих пор. Авраам Биран раскапывал городище с 1966 по 1999 г."
    - "Аврам преследовал царей, уведших Лота, до Дана. Книга Судей рассказывает, как колено Даново, искавшее себе удела, послало соглядатаев в Лаис — спокойный и беспечный город, далёкий от Сидона; сыны Дановы сожгли его, построили снова и назвали Даном по имени своего праотца, а у себя поставили истукан, взятый у Михи, и священником при нём был Ионафан, сын Гирсона. Слова «от Дана до Вирсавии» стали означать всю землю Израиля."
    - "Когда царство разделилось, Иеровоам поставил одного золотого тельца в Вефиле, а другого в Дане; раскопки открыли большое священное место с возвышенной площадкой и жертвенником израильского времени. Венадад Дамасский поразил Дан во дни Ваасы. В 1993 и 1994 гг. у городских ворот нашли обломки арамейской стелы IX века до н. э.: арамейский царь, которого обычно отождествляют с Азаилом, хвалится, что убил царя Израиля и царя «дома Давида». Около 733/732 г. до н. э. город пал перед ассирийским царём Феглафелласаром III."
    - "Посвятительная надпись на греческом и арамейском языках конца III или начала II века до н. э., «богу, который в Дане», показывает, что святилище и древнее имя дожили до эллинистической эпохи. Иосиф Флавий помещает Дан у источников Малого Иордана. В начале IV века Евсевий знал Дан как селение в четырёх римских милях от Панеады по дороге в Тир, где берёт начало Иордан."
