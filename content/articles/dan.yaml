body:
  en:
    - "Dan lay at Tel Dan (Tell el-Qadi), at the foot of Mount Hermon, beside the springs that are the main source of the Jordan, and it marked the northern end of Israel. Under its older name, Laish, the town appears in Egyptian execration texts and among the places taken by Thutmose III in the fifteenth century BC. In the Middle Bronze Age it was ringed by huge earthen ramparts, and a mudbrick gate with three arches, built about 1750 BC, still stands. Avraham Biran excavated the site from 1966 to 1999."
    - 'Abram pursued the kings who had carried off Lot as far as Dan. Judges tells how the tribe of Dan, seeking land, sent spies to Laish, a quiet and secure town far from Sidon; the Danites burned it, rebuilt it and named it Dan after their forefather, and set up the graven image taken from Micah, with Jonathan son of Gershom as their priest. "From Dan even to Beer-sheba" became the phrase for the whole land of Israel.'
    - 'When the kingdom divided, Jeroboam set one golden calf at Bethel and the other at Dan; excavators uncovered a large sacred precinct with a raised platform and an altar from the Israelite period. Ben-hadad of Damascus struck Dan in the days of Baasha. In 1993 and 1994 fragments of an Aramaic stela of the ninth century BC were found near the city gate: an Aramean king, usually identified as Hazael, boasts of killing a king of Israel and a king of the "house of David". About 733/732 BC the city fell to Tiglath-pileser III of Assyria.'
    - 'A dedication in Greek and Aramaic of the late third or early second century BC, "to the god who is in Dan", shows that the sanctuary and the old name survived into Hellenistic times. Josephus places Dan at the springs of the Lesser Jordan. In the early fourth century Eusebius knew Dan as a village four Roman miles from Paneas on the road to Tyre, where the Jordan springs forth.'
  ru:
    - "Дан стоял на холме Тель-Дан (Телль-эль-Кади) у подножия Ермона, возле источников, которые служат главным истоком Иордана, и отмечал северный край Израиля. Под прежним именем Лаис город упоминается в египетских текстах проклятий и среди мест, взятых Тутмосом III в XV веке до н. э. В среднем бронзовом веке его окружили огромные земляные валы, а глинобитные ворота с тремя арками, построенные около 1750 г. до н. э., стоят до сих пор. Авраам Биран раскапывал городище с 1966 по 1999 г."
    - "Аврам преследовал царей, уведших Лота, до Дана. Книга Судей рассказывает, как колено Даново, искавшее себе удела, послало соглядатаев в Лаис — спокойный и беспечный город, далёкий от Сидона; сыны Дановы сожгли его, построили снова и назвали Даном по имени своего праотца, а у себя поставили истукан, взятый у Михи, и священником при нём был Ионафан, сын Гирсона. Слова «от Дана до Вирсавии» стали означать всю землю Израиля."
    - "Когда царство разделилось, Иеровоам поставил одного золотого тельца в Вефиле, а другого в Дане; раскопки открыли большое священное место с возвышенной площадкой и жертвенником израильского времени. Венадад Дамасский поразил Дан во дни Ваасы. В 1993 и 1994 гг. у городских ворот нашли обломки арамейской стелы IX века до н. э.: арамейский царь, которого обычно отождествляют с Азаилом, хвалится, что убил царя Израиля и царя «дома Давида». Около 733/732 г. до н. э. город пал перед ассирийским царём Феглафелласаром III."
    - "Посвятительная надпись на греческом и арамейском языках конца III или начала II века до н. э., «богу, который в Дане», показывает, что святилище и древнее имя дожили до эллинистической эпохи. Иосиф Флавий помещает Дан у источников Малого Иордана. В начале IV века Евсевий знал Дан как селение в четырёх римских милях от Панеады по дороге в Тир, где берёт начало Иордан."
  uk:
    - "Дан лежав на Телль-Дані (Телль-ель-Кади), біля підніжжя гори Гермон, поряд із джерелами, що є головним витоком Йордану, і позначав північний кінець Ізраїлю. Під давнішою назвою Лаіш місто з'являється в єгипетських текстах прокльонів та серед місць, узятих Тутмосом III у XV ст. до н. е. В добу середньої бронзи його оточували величезні земляні вали, а цегляна брама з трьома арками, збудована близько 1750 р. до н. е., стоїть досі. Авраам Біран розкопував місце з 1966 до 1999 р."
    - "Аврам гнався за царями, які вивели Лота в полон, аж до Дана. Книга Суддів розповідає, як плем'я Дана, шукаючи землі, послало розвідників до Лаіша, тихого й безпечного міста, далекого від Сідона; данити спалили його, відбудували й назвали Даном на честь свого предка, і поставили вирізьблений ідол, узятий у Міхи, зі священником Йонатаном, сином Гершома. «Від Дана аж до Берсабиї» стало висловом для всієї землі Ізраїлю."
    - "Коли царство розділилося, Єровоам поставив одного золотого бичка в Бет-Елі, а другого в Дані; розкопувачі відкрили велике священне подвір'я з підвищенням і жертовником ізраїльської доби. Бен-Гадад Дамаський напав на Дан за днів Вааси. У 1993 і 1994 рр. поблизу міської брами знайшли уламки арамейської стели IX ст. до н. е.: арамейський цар, якого зазвичай ототожнюють з Азаїлом, хвалиться, що вбив царя Ізраїлю і царя «дому Давида». Близько 733/732 р. до н. е. місто впало перед Тіглатпаласаром III Ассирійським."
    - "Присвята грецькою й арамейською кінця III або початку II ст. до н. е., «богові, що в Дані», показує, що святилище і стара назва вціліли до елліністичних часів. Йосиф Флавій розміщує Дан біля джерел Малого Йордану. На початку IV ст. Євсевій знав Дан як село за чотири римські милі від Панеади на дорозі до Тиру, де витікає Йордан."
  es:
    - "Dan se hallaba en Tel Dan (Tell el-Qadi), al pie del monte Hermón, junto a las fuentes que son el principal origen del Jordán, y marcaba el extremo norte de Israel. Bajo su nombre más antiguo, Lais, la ciudad aparece en textos egipcios de execración y entre los lugares tomados por Tutmosis III en el siglo XV a. C. En la Edad del Bronce Medio estaba rodeada por enormes terraplenes de tierra, y una puerta de adobe con tres arcos, construida hacia el 1750 a. C., sigue en pie. Avraham Biran excavó el sitio de 1966 a 1999."
    - "Abram persiguió hasta Dan a los reyes que se habían llevado a Lot. Jueces cuenta cómo la tribu de Dan, en busca de tierra, envió espías a Lais, una ciudad tranquila y segura, lejos de Sidón; los danitas la quemaron, la reconstruyeron y la llamaron Dan por su antepasado, e instalaron la imagen tallada tomada de Micaías, con Jonatán hijo de Gersom como sacerdote. «Desde Dan hasta Beer-seba» pasó a ser la expresión para toda la tierra de Israel."
    - "Al dividirse el reino, Jeroboam puso un becerro de oro en Betel y el otro en Dan; los excavadores sacaron a la luz un gran recinto sagrado con una plataforma elevada y un altar del periodo israelita. Ben-adad de Damasco atacó Dan en tiempos de Baasa. En 1993 y 1994 se hallaron cerca de la puerta de la ciudad fragmentos de una estela aramea del siglo IX a. C.: un rey arameo, identificado habitualmente como Hazael, se jacta de haber matado a un rey de Israel y a un rey de la «casa de David». Hacia el 733/732 a. C. la ciudad cayó ante Tiglat-pileser III de Asiria."
    - "Una dedicatoria en griego y arameo de finales del siglo III o comienzos del II a. C., «al dios que está en Dan», muestra que el santuario y el antiguo nombre sobrevivieron hasta la época helenística. Josefo sitúa Dan en las fuentes del Pequeño Jordán. A comienzos del siglo IV Eusebio conocía Dan como una aldea a cuatro millas romanas de Paneas, en el camino a Tiro, donde brota el Jordán."
  pt:
    - "Dã ficava em Tel Dan (Tell el-Qadi), ao pé do Monte Hermom, junto às nascentes que são a principal fonte do Jordão, e marcava o extremo norte de Israel. Sob seu nome mais antigo, Laís, a cidade aparece nos textos egípcios de proscrição e entre os lugares tomados por Tutmés III no século XV a.C. No Bronze Médio era cercada por enormes muralhas de terra, e um portão de tijolos de barro com três arcos, construído por volta de 1750 a.C., ainda está de pé. Avraham Biran escavou o local de 1966 a 1999."
    - "Abrão perseguiu até Dã os reis que haviam levado Ló. Juízes conta como a tribo de Dã, em busca de terra, enviou espias a Laís, cidade tranquila e segura, longe de Sidom; os danitas a queimaram, a reconstruíram e a chamaram Dã, segundo o nome de seu antepassado, e levantaram a imagem esculpida tomada de Mica, com Jônatas, filho de Gérson, como sacerdote. “Desde Dã até Berseba” tornou-se a expressão para toda a terra de Israel."
    - "Quando o reino se dividiu, Jeroboão pôs um bezerro de ouro em Betel e o outro em Dã; os escavadores descobriram um grande recinto sagrado com plataforma elevada e um altar do período israelita. Ben-Hadade de Damasco atacou Dã nos dias de Baasa. Em 1993 e 1994, fragmentos de uma estela aramaica do século IX a.C. foram achados perto do portão da cidade: um rei arameu, geralmente identificado como Hazael, gaba-se de ter matado um rei de Israel e um rei da “casa de Davi”. Por volta de 733/732 a.C., a cidade caiu diante de Tiglate-Pileser III da Assíria."
    - "Uma dedicatória em grego e aramaico do fim do século III ou início do II a.C., “ao deus que está em Dã”, mostra que o santuário e o antigo nome sobreviveram até a época helenística. Josefo situa Dã nas nascentes do Pequeno Jordão. No início do século IV, Eusébio conhecia Dã como uma aldeia a quatro milhas romanas de Paneas, na estrada para Tiro, onde o Jordão brota."
  de:
    - "Dan lag bei Tel Dan (Tell el-Qadi), am Fuß des Hermon, neben den Quellen, die die Hauptquelle des Jordan sind, und bezeichnete das Nordende Israels. Unter seinem älteren Namen Lais erscheint die Stadt in ägyptischen Ächtungstexten und unter den Orten, die Thutmosis III. im 15. Jahrhundert v. Chr. einnahm. In der Mittleren Bronzezeit war sie von riesigen Erdwällen umgeben, und ein Lehmziegeltor mit drei Bögen, um 1750 v. Chr. gebaut, steht noch. Avraham Biran grub den Ort von 1966 bis 1999 aus."
    - "Abram verfolgte die Könige, die Lot weggeführt hatten, bis Dan. Das Richterbuch erzählt, wie der Stamm Dan auf der Suche nach Land Kundschafter nach Lais sandte, einer ruhigen und sicheren Stadt fern von Sidon; die Daniten verbrannten sie, bauten sie wieder auf und nannten sie nach ihrem Stammvater Dan und stellten das von Micha genommene Götzenbild auf, mit Jonatan, dem Sohn Gerschoms, als ihrem Priester. „Von Dan bis gen Beer-Seba“ wurde zur Wendung für das ganze Land Israel."
    - "Nach der Teilung des Reiches stellte Jerobeam das eine goldene Kalb in Bethel auf und das andere in Dan; Ausgräber legten einen großen heiligen Bezirk mit einer erhöhten Plattform und einem Altar aus israelitischer Zeit frei. Ben-Hadad von Damaskus schlug Dan in den Tagen Baesas. In den Jahren 1993 und 1994 wurden nahe dem Stadttor Bruchstücke einer aramäischen Stele des 9. Jahrhunderts v. Chr. gefunden: Ein aramäischer König, gewöhnlich als Hasaël identifiziert, rühmt sich, einen König von Israel und einen König des „Hauses Davids“ getötet zu haben. Um 733/732 v. Chr. fiel die Stadt an Tiglat-Pileser III. von Assyrien."
    - "Eine Weihinschrift in Griechisch und Aramäisch aus dem späten 3. oder frühen 2. Jahrhundert v. Chr., „dem Gott in Dan“, zeigt, dass das Heiligtum und der alte Name bis in hellenistische Zeit überlebten. Josephus setzt Dan an die Quellen des Kleinen Jordan. Anfang des 4. Jahrhunderts kannte Eusebius Dan als Dorf vier römische Meilen von Paneas an der Straße nach Tyrus, wo der Jordan hervorbricht."
  fr:
    - "Dan se trouvait à Tel Dan (Tell el-Qadi), au pied du Mont Hermon, près des sources qui sont la principale origine du Jourdain, et marquait l’extrémité nord d’Israël. Sous son nom plus ancien, Laïsch, la ville figure dans les textes d’envoûtement égyptiens et parmi les lieux pris par Thoutmosis III au XVe siècle av. J.-C. À l’âge du Bronze moyen, elle était ceinte d’immenses remparts de terre, et une porte de briques crues à trois arcs, bâtie vers 1750 av. J.-C., se dresse encore. Avraham Biran fouilla le site de 1966 à 1999."
    - "Abram poursuivit jusqu’à Dan les rois qui avaient emmené Lot. Les Juges racontent comment la tribu de Dan, en quête de terre, envoya des espions à Laïsch, ville tranquille et sûre éloignée de Sidon ; les Danites la brûlèrent, la rebâtirent et l’appelèrent Dan du nom de leur ancêtre, et établirent l’image taillée prise à Michée, avec Jonathan, fils de Guerschom, pour prêtre. « Depuis Dan jusqu’à Beer-Schéba » devint l’expression désignant tout le pays d’Israël."
    - "À la division du royaume, Jéroboam plaça un veau d’or à Béthel et l’autre à Dan ; les fouilleurs ont mis au jour un vaste enclos sacré avec une plate-forme surélevée et un autel de l’époque israélite. Ben-Hadad de Damas frappa Dan du temps de Baescha. En 1993 et 1994, des fragments d’une stèle araméenne du IXe siècle av. J.-C. furent trouvés près de la porte de la ville : un roi araméen, généralement identifié à Hazaël, se vante d’avoir tué un roi d’Israël et un roi de la « maison de David ». Vers 733/732 av. J.-C., la ville tomba aux mains de Tiglath-Piléser III d’Assyrie."
    - "Une dédicace en grec et en araméen de la fin du IIIe ou du début du IIe siècle av. J.-C., « au dieu qui est à Dan », montre que le sanctuaire et l’ancien nom survécurent à l’époque hellénistique. Josèphe place Dan aux sources du Petit Jourdain. Au début du IVe siècle, Eusèbe connaissait Dan comme un village à quatre milles romains de Paneas, sur la route de Tyr, où jaillit le Jourdain."
  it:
    - "Dan sorgeva a Tel Dan (Tell el-Qadi), ai piedi del Monte Ermon, accanto alle sorgenti che sono la fonte principale del Giordano, e segnava l’estremità settentrionale d’Israele. Con il suo nome più antico, Lais, la città compare nei testi egizi di esecrazione e fra i luoghi presi da Tutmosi III nel XV secolo a.C. Nel Bronzo Medio era circondata da enormi bastioni di terra, e una porta di mattoni crudi a tre archi, costruita intorno al 1750 a.C., è ancora in piedi. Avraham Biran scavò il sito dal 1966 al 1999."
    - "Abramo inseguì fino a Dan i re che avevano portato via Lot. Il libro dei Giudici racconta come la tribù di Dan, in cerca di terra, mandò esploratori a Lais, una città tranquilla e sicura lontana da Sidone; i Daniti la bruciarono, la ricostruirono e la chiamarono Dan dal nome del loro progenitore, e vi collocarono l’immagine scolpita presa a Michea, con Gionata figlio di Gherson come sacerdote. «Da Dan fino a Beer-Sceba» divenne l’espressione per l’intero paese d’Israele."
    - "Quando il regno si divise, Geroboamo pose un vitello d’oro a Betel e l’altro a Dan; gli scavatori hanno portato alla luce un grande recinto sacro con una piattaforma rialzata e un altare del periodo israelita. Ben-Adad di Damasco colpì Dan ai giorni di Baasa. Nel 1993 e 1994 presso la porta della città furono trovati frammenti di una stele aramaica del IX secolo a.C.: un re arameo, di solito identificato con Cazaèl, si vanta di aver ucciso un re d’Israele e un re della «casa di Davide». Intorno al 733/732 a.C. la città cadde in mano a Tiglat-Pilèser III d’Assiria."
    - "Una dedica in greco e aramaico della fine del III o dell’inizio del II secolo a.C., «al dio che è in Dan», mostra che il santuario e il vecchio nome sopravvissero fino all’età ellenistica. Giuseppe Flavio pone Dan alle sorgenti del Piccolo Giordano. All’inizio del IV secolo Eusebio conosceva Dan come un villaggio a quattro miglia romane da Paneas sulla strada per Tiro, dove sgorga il Giordano."
  pl:
    - "Dan leżało w Tel Dan (Tell el-Kadi), u stóp Hermonu, obok źródeł będących głównym źródłem Jordanu, i wyznaczało północny kraniec Izraela. Pod starszą nazwą, Lajisz, miasto pojawia się w egipskich tekstach przekleństw i wśród miejsc zdobytych przez Totmesa III w XV w. p.n.e. W środkowej epoce brązu otaczały je ogromne wały ziemne, a trójłukowa brama z cegły mułowej, zbudowana około 1750 r. p.n.e., stoi do dziś. Awraham Biran prowadził wykopaliska na stanowisku od 1966 do 1999 r."
    - "Abram ścigał królów, którzy uprowadzili Lota, aż do Dan. Księga Sędziów opowiada, jak pokolenie Dana, szukając ziemi, wysłało zwiadowców do Lajisz, spokojnego i bezpiecznego miasta daleko od Sydonu; Danici spalili je, odbudowali i nazwali Dan od swego praojca, i ustawili rzeźbiony posąg zabrany Mice, z Jonatanem, synem Gerszoma, jako kapłanem. Wyrażenie „od Dan aż do Beerseba” stało się określeniem całej ziemi Izraela."
    - "Gdy królestwo się podzieliło, Jeroboam ustawił jednego złotego cielca w Betel, a drugiego w Dan; archeolodzy odsłonili duży święty obszar z podwyższeniem i ołtarzem z okresu izraelskiego. Ben-Hadad z Damaszku uderzył na Dan za dni Baaszy. W 1993 i 1994 r. fragmenty aramejskiej steli z IX w. p.n.e. znaleziono przy bramie miejskiej: aramejski król, zwykle utożsamiany z Chazaelem, chełpi się zabiciem króla Izraela i króla „domu Dawida”. Około 733/732 r. p.n.e. miasto padło łupem Tiglat-Pilesera III z Asyrii."
    - "Dedykacja po grecku i aramejsku z końca III lub początku II w. p.n.e., „bogu, który jest w Dan”, pokazuje, że sanktuarium i dawna nazwa przetrwały do czasów hellenistycznych. Józef Flawiusz umieszcza Dan przy źródłach Małego Jordanu. Na początku IV w. Euzebiusz znał Dan jako wieś w odległości czterech mil rzymskich od Paneas przy drodze do Tyru, gdzie tryska Jordan."
  nl:
    - "Dan lag bij Tel Dan (Tell el-Qadi), aan de voet van de Hermon, naast de bronnen die de hoofdbron van de Jordaan zijn, en markeerde het noordeinde van Israël. Onder haar oudere naam Lais komt de stad voor in Egyptische vervloekingsteksten en onder de plaatsen die Thoetmosis III in de vijftiende eeuw v.Chr. innam. In de Midden-Bronstijd was zij omringd door enorme aarden wallen, en een lemen poort met drie bogen, omstreeks 1750 v.Chr. gebouwd, staat nog overeind. Avraham Biran groef de plaats op van 1966 tot 1999."
    - "Abram achtervolgde de koningen die Lot hadden weggevoerd tot Dan. Richteren vertelt hoe de stam Dan, op zoek naar land, verspieders naar Lais zond, een rustige en veilige stad ver van Sidon; de Danieten verbrandden haar, bouwden haar weer op en noemden haar Dan naar hun stamvader, en richtten het uit Micha genomen gesneden beeld op, met Jonatan, zoon van Gersom, als hun priester. “Van Dan af tot Ber-seba toe” werd de uitdrukking voor het hele land Israël."
    - "Toen het koninkrijk zich splitste, plaatste Jerobeam het ene gouden kalf te Bethel en het andere te Dan; opgravers legden een groot cultisch terrein bloot met een verhoogd platform en een altaar uit de Israëlitische tijd. Ben-Hadad van Damascus viel Dan aan in de dagen van Baësa. In 1993 en 1994 werden bij de stadspoort fragmenten gevonden van een Aramese stèle uit de negende eeuw v.Chr.: een Aramese koning, gewoonlijk geïdentificeerd als Hazaël, pocht een koning van Israël en een koning van het “huis van David” te hebben gedood. Omstreeks 733/732 v.Chr. viel de stad aan Tiglat-Pileser III van Assyrië."
    - "Een opdracht in het Grieks en Aramees uit de late derde of vroege tweede eeuw v.Chr., “aan de god die in Dan is”, toont dat het heiligdom en de oude naam tot in de hellenistische tijd bleven bestaan. Flavius Josephus plaatst Dan bij de bronnen van de Kleine Jordaan. In het begin van de 4e eeuw kende Eusebius Dan als een dorp op vier Romeinse mijlen van Paneas aan de weg naar Tyrus, waar de Jordaan ontspringt."
  cs:
    - "Dan ležel v Tel Dan (Tell el-Qadi), na úpatí Hermonu, u pramenů, které jsou hlavním zdrojem Jordánu, a označoval severní konec Izraele. Pod starším jménem Lajiš se město objevuje v egyptských klatebních textech a mezi místy dobytými Thutmosisem III. v 15. století př. n. l. Ve střední době bronzové bylo obklopeno obrovskými zemními valy a cihlová brána se třemi oblouky, postavená kolem roku 1750 př. n. l., dosud stojí. Avraham Biran zde vykopával v letech 1966 až 1999."
    - "Abram pronásledoval krále, kteří odvlekli Lota, až k Danu. Kniha soudců vypráví, jak kmen Dan, hledající zemi, poslal zvědy do Lajiše, klidného a bezpečného města daleko od Sidónu; Danité je vypálili, znovu vystavěli a nazvali Dan po svém praotci, a postavili si rytinu odňatou Micheášovi s Jonatanem, synem Geršomovým, jako knězem. „Od Dan až do Bersabé“ se stalo rčením pro celou zemi Izraele."
    - "Po rozdělení království postavil Jarobeám jedno zlaté tele v Bét-elu a druhé v Danu; vykopávači odkryli velký posvátný okrsek s vyvýšenou plošinou a oltářem z izraelského období. Ben-hadad Damašský udeřil na Dan za dnů Baešových. V letech 1993 a 1994 byly poblíž městské brány nalezeny zlomky aramejské stély z 9. století př. n. l.: aramejský král, obvykle ztotožňovaný s Chazaelem, se chlubí zabitím krále Izraele a krále „domu Davidova“. Kolem roku 733/732 př. n. l. město padlo Tiglatpilesarovi III. Asyrskému."
    - "Zasvěcení v řečtině a aramejštině z pozdního 3. nebo raného 2. století př. n. l. „bohu, který je v Danu“ ukazuje, že svatyně i staré jméno přežily do helénistické doby. Josephus klade Dan k pramenům Menšího Jordánu. Na počátku 4. století znal Eusebios Dan jako vesnici čtyři římské míle od Paneas na cestě do Týru, kde Jordán vyvěrá."
  sv:
    - "Dan låg vid Tel Dan (Tell el-Qadi), vid foten av Hermon, intill källorna som är Jordans huvudkälla, och markerade Israels norra ända. Under sitt äldre namn Lajish förekommer staden i egyptiska förbannelsetexter och bland de platser som Thutmosis III intog på 1400-talet f.Kr. Under mellersta bronsåldern var den omgiven av jättelika jordvallar, och en port av lertegel med tre valv, byggd omkring 1750 f.Kr., står ännu kvar. Avraham Biran grävde ut platsen 1966–1999."
    - "Abram förföljde kungarna som hade fört bort Lot ända till Dan. Domarboken berättar hur Dans stam, som sökte land, sände spejare till Lajish, en lugn och trygg stad långt från Sidon; daniterna brände den, byggde upp den igen och gav den namnet Dan efter sin stamfader, och reste den skurna gudabilden som tagits från Mika, med Jonatan, Gershoms son, som sin präst. ”Från Dan ända till Beer-Seba” blev uttrycket för hela Israels land."
    - "När riket delades ställde Jerobeam upp den ena gyllene kalven i Betel och den andra i Dan; utgrävarna blottade ett stort heligt område med en förhöjd plattform och ett altare från israelitisk tid. Ben-Hadad av Damaskus slog Dan på Bashas tid. Åren 1993 och 1994 hittades fragment av en arameisk stele från 800-talet f.Kr. nära stadsporten: en arameisk kung, vanligen identifierad som Hasael, skryter med att ha dödat en kung av Israel och en kung av ”Davids hus”. Omkring 733/732 f.Kr. föll staden för Tiglat-Pileser III av Assyrien."
    - "En dedikation på grekiska och arameiska från slutet av 200- eller början av 100-talet f.Kr., ”till guden som är i Dan”, visar att helgedomen och det gamla namnet överlevde in i hellenistisk tid. Josefus förlägger Dan vid källorna till Lilla Jordan. I början av 300-talet kände Eusebios Dan som en by fyra romerska mil från Paneas på vägen till Tyros, där Jordan väller fram."
  nb:
    - "Dan lå ved Tel Dan (Tell el-Qadi), ved foten av Hermon, ved kildene som er Jordans hovedkilde, og markerte den nordlige enden av Israel. Under det eldre navnet Lajisj forekommer byen i egyptiske forbannelsestekster og blant stedene Tutmosis III tok på 1400-tallet f.Kr. I mellombronsealderen var den omgitt av enorme jordvoller, og en port av leirstein med tre buer, bygd omkring 1750 f.Kr., står fremdeles. Avraham Biran gravde ut stedet fra 1966 til 1999."
    - "Abram forfulgte kongene som hadde ført Lot bort, helt til Dan. Dommerboken forteller hvordan Dans stamme, på jakt etter land, sendte speidere til Lajisj, en stille og trygg by langt fra Sidon; danittene brente den, bygde den opp igjen og kalte den Dan etter sin stamfar, og reiste det utskårne bildet som var tatt fra Mika, med Jonatan, Gersjoms sønn, som sin prest. «Fra Dan til Be'erseba» ble uttrykket for hele Israels land."
    - "Da riket delte seg, satte Jeroboam den ene gullkalven i Betel og den andre i Dan; utgraverne avdekket et stort hellig område med en opphøyd plattform og et alter fra israelittisk tid. Ben-Hadad av Damaskus slo Dan i Basjas dager. I 1993 og 1994 ble det funnet fragmenter av en arameisk stele fra 800-tallet f.Kr. nær byporten: en arameisk konge, vanligvis identifisert som Hasael, roser seg av å ha drept en konge av Israel og en konge av «Davids hus». Omkring 733/732 f.Kr. falt byen til Tiglat-Pileser III av Assyria."
    - "En innvielse på gresk og arameisk fra slutten av 200-tallet eller begynnelsen av 100-tallet f.Kr., «til guden som er i Dan», viser at helligdommen og det gamle navnet overlevde inn i hellenistisk tid. Josefus plasserer Dan ved kildene til Lille-Jordan. Tidlig på 300-tallet kjente Eusebius Dan som en landsby fire romerske mil fra Paneas på veien til Tyros, der Jordan springer frem."
  tl:
    - "Ang Dan ay nasa Tel Dan (Tell el-Qadi), sa paanan ng Bundok Hermon, sa tabi ng mga bukal na pangunahing pinagmumulan ng Jordan, at minarkahan nito ang hilagang dulo ng Israel. Sa mas luma nitong pangalan, Lais, lumilitaw ang bayan sa mga tekstong sumpa ng Egipto at sa mga lugar na kinuha ni Thutmose III noong ika-15 siglo BK. Noong Gitnang Panahon ng Tanso, napapalibutan ito ng malalaking muog na lupa, at nakatayo pa ang pintuang laryong putik na may tatlong arko, na itinayo noong mga 1750 BK. Hinukay ni Avraham Biran ang pook mula 1966 hanggang 1999."
    - "Hinabol ni Abram ang mga haring nagdala kay Lot hanggang sa Dan. Isinasalaysay ng Mga Hukom kung paanong ang lipi ni Dan, na naghahanap ng lupa, ay nagsugo ng mga tiktik sa Lais, isang tahimik at tiwasay na bayan na malayo sa Sidon; sinunog ito ng mga Danita, itinayong muli at pinangalanang Dan ayon sa kanilang ninuno, at itinayo ang larawang inanyuan na kinuha kay Mikas, na si Jonathan na anak ni Gersom ang kanilang saserdote. Ang “mula sa Dan hanggang sa Beer-seba” ay naging pariralang tumutukoy sa buong lupain ng Israel."
    - "Nang mahati ang kaharian, inilagay ni Jeroboam ang isang gintong guya sa Beth-el at ang isa pa sa Dan; natuklasan ng mga tagahukay ang malaking banal na bakuran na may nakataas na plataporma at dambana mula sa panahong Israelita. Sinalakay ni Ben-adad ng Damasco ang Dan noong mga araw ni Baasa. Noong 1993 at 1994, natagpuan malapit sa pintuang-bayan ang mga piraso ng estelang Arameo noong ika-9 na siglo BK: ipinagmamalaki ng isang haring Arameo, karaniwang kinikilalang si Hazael, ang pagpatay sa isang hari ng Israel at isang hari ng “bahay ni David”. Noong mga 733/732 BK, bumagsak ang lungsod kay Tiglath-pileser III ng Asiria."
    - "Ang isang alay sa Griyego at Aramaiko mula sa huling ika-3 o maagang ika-2 siglo BK, “sa diyos na nasa Dan”, ay nagpapakitang nanatili ang santuwaryo at ang lumang pangalan hanggang panahong Helenistiko. Inilalagay ni Josefo ang Dan sa mga bukal ng Mas Maliit na Jordan. Noong maagang ika-4 na siglo, kilala ni Eusebio ang Dan bilang nayong apat na milyang Romano mula sa Paneas sa daan patungong Tiro, kung saan bumubukal ang Jordan."
  da:
    - "Dan lå ved Tel Dan (Tell el-Qadi), ved foden af Hermon, ved siden af kilderne, der er Jordans hovedkilde, og markerede Israels nordlige ende. Under sit ældre navn, Laisj, optræder byen i egyptiske forbandelsestekster og blandt de steder, Thutmosis 3. indtog i 1400-tallet f.Kr. I mellembronzealderen var den omgivet af enorme jordvolde, og en lerstensport med tre buer, bygget omkring 1750 f.Kr., står endnu. Avraham Biran udgravede stedet fra 1966 til 1999."
    - "Abram forfulgte de konger, der havde ført Lot bort, helt til Dan. Dommerbogen fortæller, hvordan Dans stamme, der søgte land, sendte spejdere til Laisj, en fredelig og tryg by langt fra Sidon; daniterne brændte den, genopbyggede den og kaldte den Dan efter deres stamfader og opstillede det udskårne billede, taget fra Mika, med Jonatan, Gersjoms søn, som deres præst. Udtrykket »fra Dan indtil Beersaba« blev betegnelsen for hele Israels land."
    - "Da riget blev delt, opstillede Jeroboam den ene guldkalv i Betel og den anden i Dan; udgraverne afdækkede et stort helligt område med en forhøjet platform og et alter fra den israelitiske tid. Ben-Hadad af Damaskus slog Dan i Basjas dage. I 1993 og 1994 blev fragmenter af en aramæisk stele fra 800-tallet f.Kr. fundet nær byporten: En aramæisk konge, sædvanligvis identificeret som Hazael, praler af at have dræbt en konge af Israel og en konge af »Davids hus«. Omkring 733/732 f.Kr. faldt byen til Tiglat-Pileser 3. af Assyrien."
    - "En indvielse på græsk og aramæisk fra slutningen af 200-tallet eller begyndelsen af 100-tallet f.Kr., »til guden, som er i Dan«, viser, at helligdommen og det gamle navn overlevede ind i den hellenistiske tid. Josefus placerer Dan ved kilderne til Lille Jordan. I begyndelsen af 300-tallet kendte Eusebius Dan som en landsby fire romerske mil fra Paneas på vejen til Tyrus, hvor Jordan udspringer."
  sr:
    - "Дан је лежао на Тел Дану (Тел ел Кади), у подножју Хермона, поред извора који су главно врело Јордана, и означавао је северни крај Израиља. Под својим старијим именом Лаис град се јавља у египатским текстовима клетви и међу местима која је у 15. веку п. н. е. заузео Тутмес III. У средње бронзано доба био је опасан огромним земљаним бедемима, а капија од цигала од блата с три лука, саграђена око 1750. п. н. е., још увек стоји. Аврахам Биран ископавао је налазиште од 1966. до 1999."
    - "Аврам је гонио цареве који су одвели Лота све до Дана. Књига о Судијама приповеда како је племе Данево, тражећи земљу, послало уходе у Лаис, миран и безбедан град далеко од Сидона; Дановци су га спалили, обновили и назвали Дан по свом праоцу, и поставили резани лик узет од Михе, са Јонатаном, сином Гирсамовим, као својим свештеником. „Од Дана до Вирсавеје“ постало је израз за целу земљу Израиљеву."
    - "Када се краљевство поделило, Јеровоам је једно златно теле поставио у Ветиљу а друго у Дану; ископавачи су открили велики свети простор с подигнутом платформом и жртвеником из израиљског периода. Вен-Адад из Дамаска ударио је на Дан у доба Васе. Године 1993. и 1994. нађени су одломци арамејске стеле из 9. века п. н. е. близу градске капије: један арамејски краљ, обично поистовећен са Азаилом, хвали се да је убио израиљског краља и краља „дома Давидова“. Око 733/732. п. н. е. град је пао пред Теглат-Феласаром III Асирским."
    - "Посвета на грчком и арамејском из касног 3. или раног 2. века п. н. е., „богу који је у Дану“, показује да су светилиште и старо име преживели у хеленистичко доба. Јосиф Флавије смешта Дан на изворе Малог Јордана. Почетком 4. века Јевсевије је знао Дан као село четири римске миље од Панеаде на путу за Тир, где извире Јордан."
