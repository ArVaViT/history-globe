# Overview article (ADR 0007). Mainstream facts only; the gate is unlocated; today's Dung Gate is distinguished as a later gate that borrowed the name.
id: dung-gate
place: a1611b6
title:
  en: "Dung Gate"
  ru: "Навозные ворота"
  uk: "Гноєві ворота"
  es: "Puerta del Muladar"
  pt: "Porta do Esterco"
  de: "Misttor"
  fr: "Porte du Fumier"
body:
  en:
    - "The Dung Gate was a gate in the southern wall of Jerusalem in Nehemiah's day, through which the city's refuse was carried out to be dumped in the valley of Hinnom; the Hebrew name means “gate of the ash heaps”. It stood a thousand cubits, about 450 m, from the Valley Gate along the wall, which places it near the southern tip of the City of David, where the Tyropoeon valley runs into the Hinnom, though its exact spot is unknown. Some identify it with the Potsherd Gate of Jeremiah, the way out to the valley of Hinnom (the Synodal text calls that gate Harshith), since both led to the same waste ground."
    - "Nehemiah's night ride took him “by the gate of the valley, even before the dragon well, and to the dung port”, past the broken walls and burnt gates. In the repair the Valley Gate's builders worked “a thousand cubits on the wall unto the dung gate”, and the gate itself “repaired Malchiah the son of Rechab, the ruler of part of Beth-haccerem; he built it, and set up the doors thereof, the locks thereof, and the bars thereof”. At the dedication of the wall one of the two companies of singers “went on the right hand upon the wall toward the dung gate”, round the south of the city to the Temple."
    - "Bliss and Dickie, tunnelling along the southern walls in 1894–1897, found a gate near the Pool of Siloam that has sometimes been taken for Nehemiah's; the matter is unproved, and the lower city, left outside the Ottoman walls, has been dug piecemeal since. Today's Dung Gate (Bab al-Maghariba) in the wall that Suleiman the Magnificent built in 1537–1541, the entrance nearest the Western Wall, took over the biblical name but is a different gate, about half a kilometre to the north."
  ru:
    - "Навозные ворота — ворота в южной стене Иерусалима во дни Неемии, через которые городские отбросы вывозили в долину Еннома; еврейское имя значит «ворота мусорных куч». Они стояли в тысяче локтей, около 450 м, от ворот Долины вдоль стены, что помещает их у южной оконечности города Давидова, где долина Тиропеон впадает в Енном, хотя точное место неизвестно. Некоторые отождествляют их с воротами Харшиф у Иеремии, выходом в долину сыновей Енномовых, поскольку оба вели на ту же свалку."
    - "Ночной объезд Неемии прошёл «через ворота Долины перед источником Драконовым к воротам Навозным», мимо разрушенных стен и сожжённых ворот. При починке строители ворот Долины «чинили они тысячу локтей стены до ворот Навозных», а сами ворота «чинил Малхия, сын Рехава, начальник Бефкаремского округа: он построил их и вставил двери их, замки их и засовы их». При освящении стены один из двух хоров «шел по правой стороне стены к Навозным воротам», вокруг южной части города к Храму."
    - "Блисс и Дики, прокладывая туннели вдоль южных стен в 1894–1897 годах, нашли у Силоамского пруда ворота, которые иногда принимали за ворота Неемии; это не доказано, а нижний город, оставшийся вне османских стен, с тех пор раскапывают по частям. Нынешние Навозные (Мусорные) ворота, Баб-эль-Магариба, в стене, построенной Сулейманом Великолепным в 1537–1541 годах, ближайший вход к Западной стене, унаследовали библейское имя, но это другие ворота, примерно на полкилометра севернее."
  uk:
    - "Гноєві ворота були брамою в південному мурі Єрусалима за днів Неемії, крізь яку міські відходи виносили, щоб скинути в долині Гінном; єврейська назва означає «ворота попелищ». Вони стояли за тисячу ліктів, близько 450 м, від Воріт Долини вздовж муру, що ставить їх біля південного вістря Міста Давида, де долина Тіропеон упадає в Гінном, хоча точне місце невідоме. Дехто ототожнює їх з Черепяною брамою Єремії, виходом до долини Гінном (Синодальний текст називає ці ворота Харшіф), бо обидва вели до того самого смітника."
    - "Нічна поїздка Неемії провела його «через Долинні ворота перед Драконовою криницею до воріт Гнояних», повз розвалені мури й спалені ворота. Під час ремонту будівничі Воріт Долини лагодили «тисячу локот муру до Гнояних воріт», а самі ворота «лагодив Малхія, син Рехавів, старшина повіту Беткаремського: він збудував їх і вставив в їх браму, замки їх і засуви їх». Під час посвячення муру один із двох хорів співаків «йшов … по правому боцї муру до Гнояних воріт», обходячи місто з півдня до храму."
    - "Бліс і Дікі, прокопуючи тунелі вздовж південних мурів у 1894–1897 рр., знайшли браму біля купелі Сілоам, яку іноді вважали брамою Неемії; справа недоведена, а нижнє місто, залишене поза османськими мурами, розкопується уривками. Сьогоднішні Гноєві ворота (Баб-аль-Магаріба) в мурі, збудованому Сулейманом Пишним у 1537–1541 рр., вхід найближчий до Західної стіни, перейняли біблійну назву, але це інші ворота, приблизно за півкілометра на північ."
  es:
    - "La Puerta del Muladar era una puerta de la muralla meridional de Jerusalén en tiempos de Nehemías, por la que se sacaba la basura de la ciudad para arrojarla al valle de Hinom; el nombre hebreo significa «puerta de los montones de ceniza». Se hallaba a mil codos, unos 450 m, de la Puerta del Valle a lo largo de la muralla, lo que la sitúa cerca del extremo sur de la Ciudad de David, donde el valle del Tiropeón desemboca en el Hinom, aunque su lugar exacto se desconoce. Algunos la identifican con la Puerta de los Tiestos de Jeremías, la salida al valle de Hinom (el texto sinodal llama a esa puerta Harshith), pues ambas conducían al mismo vertedero."
    - "La cabalgata nocturna de Nehemías lo llevó «por la puerta del Valle hacia la fuente del Dragón y á la puerta del Muladar», ante los muros derribados y las puertas quemadas. En la reparación, los constructores de la Puerta del Valle hicieron «mil codos en el muro hasta la puerta del Muladar», y de la puerta misma: «reedificó la puerta del Muladar, Malchîas hijo de Rechâb, príncipe de la provincia de Beth-haccerem: él la reedificó, y levantó sus puertas, sus cerraduras y sus cerrojos». En la dedicación del muro, uno de los dos coros de cantores fue «á la mano derecha sobre el muro hacia la puerta del Muladar», rodeando la ciudad por el sur hasta el Templo."
    - "Bliss y Dickie, al abrir túneles a lo largo de las murallas meridionales en 1894–1897, hallaron cerca del estanque de Siloé una puerta que a veces se ha tomado por la de Nehemías; el asunto no está probado, y la ciudad baja, que quedó fuera de las murallas otomanas, se ha excavado desde entonces por partes. La actual Puerta del Muladar (Bab al-Maghariba), en la muralla que Solimán el Magnífico construyó en 1537–1541, la entrada más cercana al Muro Occidental, tomó el nombre bíblico pero es otra puerta, unos quinientos metros más al norte."
  pt:
    - "A Porta do Esterco era uma porta do muro sul de Jerusalém no tempo de Neemias, por onde o lixo da cidade era levado para ser despejado no vale de Hinom; o nome hebraico significa “porta dos montes de cinzas”. Ficava a mil côvados, cerca de 450 m, da Porta do Vale ao longo do muro, o que a situa perto da ponta sul da Cidade de Davi, onde o vale do Tiropeão desemboca no Hinom, embora seu lugar exato seja desconhecido. Alguns a identificam com a Porta dos Cacos de Jeremias, a saída para o vale de Hinom (o texto sinodal chama essa porta de Harshith), já que ambas levavam ao mesmo terreno de despejo."
    - "A cavalgada noturna de Neemias o levou “pela Porta do Vale, em direção à Fonte do Chacal, e depois para a Porta do Esterco”, passando pelos muros derrubados e pelas portas queimadas. No reparo, os construtores da Porta do Vale trabalharam “mil côvados da muralha até a Porta do Esterco”, e a própria porta foi reparada assim: “Malquias, filho de Recabe, governante do distrito de Bete-Haquerém, reparou a Porta do Esterco. Ele a edificou, e assentou as suas portas, os seus ferrolhos e as suas trancas”. Na dedicação do muro, um dos dois coros de cantores “foi para a direita sobre a muralha, em direção à Porta do Esterco”, contornando o sul da cidade até o Templo."
    - "Bliss e Dickie, abrindo túneis ao longo dos muros do sul em 1894–1897, acharam uma porta perto do tanque de Siloé que às vezes foi tomada pela de Neemias; o ponto não está provado, e a cidade baixa, deixada fora dos muros otomanos, tem sido escavada aos poucos desde então. A atual Porta do Esterco (Bab al-Maghariba), no muro que Solimão, o Magnífico, construiu em 1537–1541, a entrada mais próxima do Muro Ocidental, assumiu o nome bíblico mas é outra porta, cerca de meio quilômetro ao norte."
  de:
    - "Das Misttor war zu Nehemias Zeit ein Tor in der Südmauer Jerusalems, durch das der Unrat der Stadt hinausgetragen wurde, um im Hinnomtal abgeladen zu werden; der hebräische Name bedeutet „Tor der Aschehaufen“. Es stand tausend Ellen, etwa 450 m, vom Taltor entfernt an der Mauer entlang, was es nahe der Südspitze der Stadt Davids ansetzt, wo das Tyropoiontal ins Hinnomtal mündet, obwohl seine genaue Lage unbekannt ist. Manche setzen es mit dem Scherbentor Jeremias gleich, dem Ausgang zum Hinnomtal (der synodale Text nennt dieses Tor Harshith), da beide zum selben Abfallplatz führten."
    - "Nehemias nächtlicher Ritt führte ihn „zum Taltor aus bei der Nacht und gegen den Drachenbrunnen und an das Misttor“, vorbei an den eingerissenen Mauern und verbrannten Toren. Bei der Ausbesserung bauten die Erbauer des Taltors „tausend Ellen an der Mauer bis an das Misttor“, und das Tor selbst: „Das Misttor aber baute Malchia, der Sohn Rechabs, der Oberste des Kreises von Beth-Cherem; er baute es und setzte ein seine Türen, Schlösser und Riegel.“ Bei der Einweihung der Mauer ging einer der beiden Dankchöre: „Die einen gingen hin zur Rechten oben auf der Mauer zum Misttor hin“, um den Süden der Stadt herum zum Tempel."
    - "Bliss und Dickie fanden 1894–1897 beim Vortreiben von Stollen entlang der Südmauern ein Tor nahe dem Teich Siloah, das manchmal für das Nehemias gehalten wurde; die Sache ist unbewiesen, und die Unterstadt, die außerhalb der osmanischen Mauern blieb, ist seither stückweise ausgegraben worden. Das heutige Misttor (Bab al-Maghariba) in der Mauer, die Süleyman der Prächtige 1537–1541 errichtete, der Eingang, der der Westmauer am nächsten liegt, hat den biblischen Namen übernommen, ist aber ein anderes Tor, etwa einen halben Kilometer weiter nördlich."
  fr:
    - "La Porte du Fumier était une porte du mur sud de Jérusalem à l’époque de Néhémie, par laquelle les ordures de la ville étaient emportées pour être jetées dans la vallée de Hinnom ; le nom hébreu signifie « porte des tas de cendres ». Elle se trouvait à mille coudées, environ 450 m, de la Porte de la Vallée le long du mur, ce qui la place près de la pointe sud de la Cité de David, là où la vallée du Tyropéon rejoint celle de Hinnom, bien que son emplacement exact soit inconnu. Certains l’identifient à la Porte des Tessons de Jérémie, la sortie vers la vallée de Hinnom (le texte synodal appelle cette porte Harshith), puisque toutes deux menaient au même terrain de décharge."
    - "Dans sa sortie nocturne, Néhémie dit : « Je sortis de nuit par la porte de la vallée, et je me dirigeai contre la source du dragon et vers la porte du fumier », devant les murailles en ruines et les portes brûlées. Lors de la réparation, les bâtisseurs de la Porte de la Vallée firent « mille coudées de mur jusqu’à la porte du fumier », et pour la porte elle-même : « Malkija, fils de Récab, chef du district de Beth-Hakkérem, répara la porte du fumier. Il la bâtit, et en posa les battants, les verrous et les barres ». À la dédicace de la muraille, l’un des deux chœurs de chantres « se mit en marche du côté droit sur la muraille, vers la porte du fumier », autour du sud de la ville jusqu’au Temple."
    - "Bliss et Dickie, creusant des tunnels le long des murs sud en 1894–1897, trouvèrent près du bassin de Siloé une porte que l’on a parfois prise pour celle de Néhémie ; la chose n’est pas prouvée, et la ville basse, laissée hors des murailles ottomanes, a été fouillée par morceaux depuis. L’actuelle Porte du Fumier (Bab al-Maghariba), dans le mur que Soliman le Magnifique fit bâtir en 1537–1541, l’entrée la plus proche du Mur occidental, a repris le nom biblique mais est une autre porte, à environ un demi-kilomètre au nord."
