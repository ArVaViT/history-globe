body:
  en:
    - "The Dung Gate was a gate in the southern wall of Jerusalem in Nehemiah's day, through which the city's refuse was carried out to be dumped in the valley of Hinnom; the Hebrew name means “gate of the ash heaps”. It stood a thousand cubits, about 450 m, from the Valley Gate along the wall, which, on the usual view that Nehemiah's wall enclosed only the eastern hill, places it near the southern tip of the City of David, where the Tyropoeon valley runs into the Hinnom, though its exact spot is unknown. Some identify it with the Potsherd Gate of Jeremiah, the way out to the valley of Hinnom (the Synodal text calls that gate Harshith), since both led to the same waste ground."
    - "Nehemiah's night ride took him “by the gate of the valley, even before the dragon well, and to the dung port”, past the broken walls and burnt gates. In the repair the Valley Gate's builders worked “a thousand cubits on the wall unto the dung gate”, and the gate itself “repaired Malchiah the son of Rechab, the ruler of part of Beth-haccerem; he built it, and set up the doors thereof, the locks thereof, and the bars thereof”. At the dedication of the wall one of the two companies of singers “went on the right hand upon the wall toward the dung gate”, round the south of the city to the Temple."
    - "Bliss and Dickie, tunnelling along the southern walls in 1894–1897, found a gate near the Pool of Siloam, which they took for Nehemiah's Fountain Gate, and another at the south-west angle of the western hill, on whose site they thought the Dung Gate probably stood; neither identification is proved, and the lower city, left outside the Ottoman walls, has been dug piecemeal since. Today's Dung Gate (Bab al-Maghariba) in the wall that Suleiman the Magnificent built in 1537–1541, the entrance nearest the Western Wall, took over the biblical name but is a different gate, about half a kilometre to the north."
  ru:
    - "Навозные ворота — ворота в южной стене Иерусалима во дни Неемии, через которые городские отбросы вывозили в долину Еннома; еврейское имя значит «ворота мусорных куч». Они стояли в тысяче локтей, около 450 м, от ворот Долины вдоль стены, что, если стена Неемии, как обычно считают, охватывала лишь восточный холм, помещает их у южной оконечности города Давидова, где долина Тиропеон впадает в Енном, хотя точное место неизвестно. Некоторые отождествляют их с воротами Харшиф у Иеремии, выходом в долину сыновей Енномовых, поскольку оба вели на ту же свалку."
    - "Ночной объезд Неемии прошёл «через ворота Долины перед источником Драконовым к воротам Навозным», мимо разрушенных стен и сожжённых ворот. При починке строители ворот Долины «чинили они тысячу локтей стены до ворот Навозных», а сами ворота «чинил Малхия, сын Рехава, начальник Бефкаремского округа: он построил их и вставил двери их, замки их и засовы их». При освящении стены один из двух хоров «шел по правой стороне стены к Навозным воротам», вокруг южной части города к Храму."
    - "Блисс и Дики, прокладывая туннели вдоль южных стен в 1894–1897 годах, нашли у Силоамского пруда ворота, которые приняли за ворота Источника у Неемии, и другие — у юго-западного угла западного холма, где, по их мнению, вероятно, стояли Навозные ворота; ни одно из этих отождествлений не доказано, а нижний город, оставшийся вне османских стен, с тех пор раскапывают по частям. Нынешние Навозные (Мусорные) ворота, Баб-эль-Магариба, в стене, построенной Сулейманом Великолепным в 1537–1541 годах, ближайший вход к Западной стене, унаследовали библейское имя, но это другие ворота, примерно на полкилометра севернее."
  uk:
    - "Гноєві ворота були брамою в південному мурі Єрусалима за днів Неемії, крізь яку міські відходи виносили, щоб скинути в долині Гінном; єврейська назва означає «ворота попелищ». Вони стояли за тисячу ліктів, близько 450 м, від Воріт Долини вздовж муру, що, якщо мур Неемії, як зазвичай вважають, охоплював лише східний пагорб, ставить їх біля південного вістря Міста Давида, де долина Тіропеон упадає в Гінном, хоча точне місце невідоме. Дехто ототожнює їх з Черепяною брамою Єремії, виходом до долини Гінном (Синодальний текст називає ці ворота Харшіф), бо обидва вели до того самого смітника."
    - "Нічна поїздка Неемії провела його «через Долинні ворота перед Драконовою криницею до воріт Гнояних», повз розвалені мури й спалені ворота. Під час ремонту будівничі Воріт Долини лагодили «тисячу локот муру до Гнояних воріт», а самі ворота «лагодив Малхія, син Рехавів, старшина повіту Беткаремського: він збудував їх і вставив в їх браму, замки їх і засуви їх». Під час посвячення муру один із двох хорів співаків «йшов … по правому боцї муру до Гнояних воріт», обходячи місто з півдня до храму."
    - "Бліс і Дікі, прокопуючи тунелі вздовж південних мурів у 1894–1897 рр., знайшли браму біля купелі Сілоам, яку вони вважали Воротами Джерела Неемії, і ще одну біля південно-західного кута західного пагорба, де, на їхню думку, імовірно, стояли Гноєві ворота; жодне з цих ототожнень не доведене, а нижнє місто, залишене поза османськими мурами, розкопується уривками. Сьогоднішні Гноєві ворота (Баб-аль-Магаріба) в мурі, збудованому Сулейманом Пишним у 1537–1541 рр., вхід найближчий до Західної стіни, перейняли біблійну назву, але це інші ворота, приблизно за півкілометра на північ."
  es:
    - "La Puerta del Muladar era una puerta de la muralla meridional de Jerusalén en tiempos de Nehemías, por la que se sacaba la basura de la ciudad para arrojarla al valle de Hinom; el nombre hebreo significa «puerta de los montones de ceniza». Se hallaba a mil codos, unos 450 m, de la Puerta del Valle a lo largo de la muralla, lo que, según la opinión común de que la muralla de Nehemías encerraba solo la colina oriental, la sitúa cerca del extremo sur de la Ciudad de David, donde el valle del Tiropeón desemboca en el Hinom, aunque su lugar exacto se desconoce. Algunos la identifican con la Puerta de los Tiestos de Jeremías, la salida al valle de Hinom (el texto sinodal llama a esa puerta Harshith), pues ambas conducían al mismo vertedero."
    - "La cabalgata nocturna de Nehemías lo llevó «por la puerta del Valle hacia la fuente del Dragón y á la puerta del Muladar», ante los muros derribados y las puertas quemadas. En la reparación, los constructores de la Puerta del Valle hicieron «mil codos en el muro hasta la puerta del Muladar», y de la puerta misma: «reedificó la puerta del Muladar, Malchîas hijo de Rechâb, príncipe de la provincia de Beth-haccerem: él la reedificó, y levantó sus puertas, sus cerraduras y sus cerrojos». En la dedicación del muro, uno de los dos coros de cantores fue «á la mano derecha sobre el muro hacia la puerta del Muladar», rodeando la ciudad por el sur hasta el Templo."
    - "Bliss y Dickie, al abrir túneles a lo largo de las murallas meridionales en 1894–1897, hallaron cerca del estanque de Siloé una puerta que tomaron por la Puerta de la Fuente de Nehemías, y otra en el ángulo suroeste de la colina occidental, en cuyo lugar creyeron que probablemente estuvo la Puerta del Muladar; ninguna de las dos identificaciones está probada, y la ciudad baja, que quedó fuera de las murallas otomanas, se ha excavado desde entonces por partes. La actual Puerta del Muladar (Bab al-Maghariba), en la muralla que Solimán el Magnífico construyó en 1537–1541, la entrada más cercana al Muro Occidental, tomó el nombre bíblico pero es otra puerta, unos quinientos metros más al norte."
  pt:
    - "A Porta do Esterco era uma porta do muro sul de Jerusalém no tempo de Neemias, por onde o lixo da cidade era levado para ser despejado no vale de Hinom; o nome hebraico significa “porta dos montes de cinzas”. Ficava a mil côvados, cerca de 450 m, da Porta do Vale ao longo do muro, o que, na visão usual de que o muro de Neemias cercava apenas a colina oriental, a situa perto da ponta sul da Cidade de Davi, onde o vale do Tiropeão desemboca no Hinom, embora seu lugar exato seja desconhecido. Alguns a identificam com a Porta dos Cacos de Jeremias, a saída para o vale de Hinom (o texto sinodal chama essa porta de Harshith), já que ambas levavam ao mesmo terreno de despejo."
    - "A cavalgada noturna de Neemias o levou “pela Porta do Vale, em direção à Fonte do Chacal, e depois para a Porta do Esterco”, passando pelos muros derrubados e pelas portas queimadas. No reparo, os construtores da Porta do Vale trabalharam “mil côvados da muralha até a Porta do Esterco”, e a própria porta foi reparada assim: “Malquias, filho de Recabe, governante do distrito de Bete-Haquerém, reparou a Porta do Esterco. Ele a edificou, e assentou as suas portas, os seus ferrolhos e as suas trancas”. Na dedicação do muro, um dos dois coros de cantores “foi para a direita sobre a muralha, em direção à Porta do Esterco”, contornando o sul da cidade até o Templo."
    - "Bliss e Dickie, abrindo túneis ao longo dos muros do sul em 1894–1897, acharam uma porta perto do tanque de Siloé, que tomaram pela Porta da Fonte de Neemias, e outra no ângulo sudoeste da colina ocidental, em cujo local julgaram que provavelmente ficava a Porta do Esterco; nenhuma das identificações está provada, e a cidade baixa, deixada fora dos muros otomanos, tem sido escavada aos poucos desde então. A atual Porta do Esterco (Bab al-Maghariba), no muro que Solimão, o Magnífico, construiu em 1537–1541, a entrada mais próxima do Muro Ocidental, assumiu o nome bíblico mas é outra porta, cerca de meio quilômetro ao norte."
  de:
    - "Das Misttor war zu Nehemias Zeit ein Tor in der Südmauer Jerusalems, durch das der Unrat der Stadt hinausgetragen wurde, um im Hinnomtal abgeladen zu werden; der hebräische Name bedeutet „Tor der Aschehaufen“. Es stand tausend Ellen, etwa 450 m, vom Taltor entfernt an der Mauer entlang, was es nach der üblichen Ansicht, Nehemias Mauer habe nur den Osthügel umschlossen, nahe der Südspitze der Stadt Davids ansetzt, wo das Tyropoiontal ins Hinnomtal mündet, obwohl seine genaue Lage unbekannt ist. Manche setzen es mit dem Scherbentor Jeremias gleich, dem Ausgang zum Hinnomtal (der synodale Text nennt dieses Tor Harshith), da beide zum selben Abfallplatz führten."
    - "Nehemias nächtlicher Ritt führte ihn „zum Taltor aus bei der Nacht und gegen den Drachenbrunnen und an das Misttor“, vorbei an den eingerissenen Mauern und verbrannten Toren. Bei der Ausbesserung bauten die Erbauer des Taltors „tausend Ellen an der Mauer bis an das Misttor“, und das Tor selbst: „Das Misttor aber baute Malchia, der Sohn Rechabs, der Oberste des Kreises von Beth-Cherem; er baute es und setzte ein seine Türen, Schlösser und Riegel.“ Bei der Einweihung der Mauer ging einer der beiden Dankchöre: „Die einen gingen hin zur Rechten oben auf der Mauer zum Misttor hin“, um den Süden der Stadt herum zum Tempel."
    - "Bliss und Dickie fanden 1894–1897 beim Vortreiben von Stollen entlang der Südmauern ein Tor nahe dem Teich Siloah, das sie für Nehemias Quelltor hielten, und ein weiteres an der Südwestecke des Westhügels, an dessen Stelle ihrer Ansicht nach wahrscheinlich das Misttor stand; keine der beiden Gleichsetzungen ist bewiesen, und die Unterstadt, die außerhalb der osmanischen Mauern blieb, ist seither stückweise ausgegraben worden. Das heutige Misttor (Bab al-Maghariba) in der Mauer, die Süleyman der Prächtige 1537–1541 errichtete, der Eingang, der der Westmauer am nächsten liegt, hat den biblischen Namen übernommen, ist aber ein anderes Tor, etwa einen halben Kilometer weiter nördlich."
  fr:
    - "La Porte du Fumier était une porte du mur sud de Jérusalem à l’époque de Néhémie, par laquelle les ordures de la ville étaient emportées pour être jetées dans la vallée de Hinnom ; le nom hébreu signifie « porte des tas de cendres ». Elle se trouvait à mille coudées, environ 450 m, de la Porte de la Vallée le long du mur, ce qui, si l’on admet comme d’ordinaire que le mur de Néhémie n’enfermait que la colline orientale, la place près de la pointe sud de la Cité de David, là où la vallée du Tyropéon rejoint celle de Hinnom, bien que son emplacement exact soit inconnu. Certains l’identifient à la Porte des Tessons de Jérémie, la sortie vers la vallée de Hinnom (le texte synodal appelle cette porte Harshith), puisque toutes deux menaient au même terrain de décharge."
    - "Dans sa sortie nocturne, Néhémie dit : « Je sortis de nuit par la porte de la vallée, et je me dirigeai contre la source du dragon et vers la porte du fumier », devant les murailles en ruines et les portes brûlées. Lors de la réparation, les bâtisseurs de la Porte de la Vallée firent « mille coudées de mur jusqu’à la porte du fumier », et pour la porte elle-même : « Malkija, fils de Récab, chef du district de Beth-Hakkérem, répara la porte du fumier. Il la bâtit, et en posa les battants, les verrous et les barres ». À la dédicace de la muraille, l’un des deux chœurs de chantres « se mit en marche du côté droit sur la muraille, vers la porte du fumier », autour du sud de la ville jusqu’au Temple."
    - "Bliss et Dickie, creusant des tunnels le long des murs sud en 1894–1897, trouvèrent près du bassin de Siloé une porte qu’ils prirent pour la Porte de la Source de Néhémie, et une autre à l’angle sud-ouest de la colline occidentale, où, pensaient-ils, se trouvait probablement la Porte du Fumier ; aucune des deux identifications n’est prouvée, et la ville basse, laissée hors des murailles ottomanes, a été fouillée par morceaux depuis. L’actuelle Porte du Fumier (Bab al-Maghariba), dans le mur que Soliman le Magnifique fit bâtir en 1537–1541, l’entrée la plus proche du Mur occidental, a repris le nom biblique mais est une autre porte, à environ un demi-kilomètre au nord."
  it:
    - "La Porta del Letame era una porta del muro meridionale di Gerusalemme ai giorni di Neemia, attraverso la quale i rifiuti della città venivano portati fuori per essere scaricati nella valle di Hinnom; il nome ebraico significa «porta dei mucchi di cenere». Sorgeva a mille cubiti, circa 450 m, dalla Porta della Valle lungo le mura, il che, secondo l’opinione comune che il muro di Neemia racchiudesse solo il colle orientale, la colloca presso l’estremità meridionale della Città di Davide, dove la valle del Tiropeon sbocca nell’Hinnom, benché il suo punto esatto sia ignoto. Alcuni la identificano con la Porta dei Cocci di Geremia, la via d’uscita verso la valle di Hinnom (il testo sinodale chiama quella porta Harshith), poiché entrambe portavano allo stesso terreno di scarico."
    - "Della cavalcata notturna Neemia scrive: «uscii di notte per la porta della Valle, e mi diressi verso la sorgente del Dragone e la porta del Letame», oltre le mura rotte e le porte bruciate. Nei restauri i costruttori della Porta della Valle fecero «mille cubiti di muro fino alla porta del Letame», e la porta stessa fu restaurata da «Malkia, figliuolo di Recab, capo del distretto di Beth-Hakkerem», che «la costruì, vi pose le imposte, le serrature, le sbarre». Alla dedicazione delle mura uno dei due cori di cantori «s’incamminò dal lato destro, sulle mura, verso la porta del Letame», girando a sud della città fino al Tempio."
    - "Bliss e Dickie, scavando gallerie lungo le mura meridionali nel 1894–1897, trovarono presso la Piscina di Siloe una porta che ritennero la Porta della Fonte di Neemia, e un’altra all’angolo sud-occidentale del colle occidentale, sul cui sito ritennero che sorgesse probabilmente la Porta del Letame; nessuna delle due identificazioni è provata, e la città bassa, rimasta fuori dalle mura ottomane, è stata scavata a pezzi da allora. L’odierna Porta del Letame (Bab al-Maghariba) nel muro costruito da Solimano il Magnifico nel 1537–1541, l’ingresso più vicino al Muro Occidentale, ha ripreso il nome biblico ma è una porta diversa, a circa mezzo chilometro a nord."
  pl:
    - "Brama Gnojna była bramą w południowym murze Jerozolimy za dni Nehemiasza, którą wynoszono z miasta nieczystości, by wysypać je w dolinie Hinnom; hebrajska nazwa znaczy „brama hałd popiołu”. Stała tysiąc łokci, około 450 m, od Bramy Doliny wzdłuż muru, co, przy powszechnym poglądzie, że mur Nehemiasza obejmował tylko wzgórze wschodnie, umieszcza ją blisko południowego krańca Miasta Dawida, gdzie dolina Tyropoeon wpada w Hinnom, choć jej dokładne miejsce jest nieznane. Niektórzy utożsamiają ją z Bramą Garncarską Jeremiasza, wyjściem do doliny Hinnom (tekst synodalny nazywa tę bramę Charsit), ponieważ obie prowadziły na to samo wysypisko."
    - "Nocna przejażdżka Nehemiasza prowadziła „bramą nad doliną w nocy, ku żródłu smoczemu, i ku bramie gnojowej”, obok rozwalonych murów i spalonych bram. Przy naprawie budowniczowie Bramy Doliny pracowali „na tysiąc łokci muru aż do bramy gnojowej”, a samą bramę: „Bramy zaś gnojowej poprawiał Melchyjasz, syn Rechaby, przełożony nad powiatem Betcherem; tenci ją zbudował, i przyprawił wrota do niej, zamki jej, i zawory jej”. Przy poświęceniu muru jeden z dwóch chórów śpiewaków, „z których jedni szli na prawo od wyższej strony muru ku bramie gnojowej”, obchodził miasto od południa do świątyni."
    - "Bliss i Dickie, drążąc tunele wzdłuż murów południowych w latach 1894–1897, znaleźli bramę koło sadzawki Siloe, którą uznali za Bramę Źródlaną Nehemiasza, i drugą przy południowo-zachodnim narożniku wzgórza zachodniego, na której miejscu ich zdaniem stała prawdopodobnie Brama Gnojna; żadne z tych utożsamień nie jest udowodnione, a dolne miasto, pozostawione poza murami osmańskimi, było od tamtej pory badane fragmentarycznie. Dzisiejsza Brama Gnojna (Bab al-Magharibe) w murze zbudowanym przez Sulejmana Wspaniałego w latach 1537–1541, wejście najbliższe Ścianie Zachodniej, przejęła biblijną nazwę, ale jest inną bramą, około pół kilometra na północ."
  nl:
    - "De Mestpoort was een poort in de zuidmuur van Jeruzalem in Nehemia's dagen, waardoor het afval van de stad naar buiten werd gedragen om in het dal van Hinnom te worden gestort; de Hebreeuwse naam betekent “poort van de asbergen”. Zij stond duizend el, zo'n 450 m, van de Dalpoort langs de muur, wat haar, in de gangbare opvatting dat Nehemia's muur alleen de oostelijke heuvel omsloot, bij de zuidpunt van de Stad van David plaatst, waar het Tyropoeondal in het Hinnomdal uitloopt, al is haar exacte plaats onbekend. Sommigen identificeren haar met Jeremia's Potscherfpoort, de uitgang naar het dal van Hinnom (de Synodale tekst noemt die poort Charsit), omdat beide naar hetzelfde stortterrein leidden."
    - "Nehemia's nachtelijke rit voerde hem “door de Dalpoort, en voorbij de Drakenfontein, en naar de Mistpoort”, langs de verscheurde muren en verbrande poorten. Bij het herstel werkten de bouwers van de Dalpoort “duizend ellen aan den muur, tot aan de Mistpoort”, en de poort zelf “verbeterde Malchia, de zoon van Rechab, overste van het deel Beth-Cherem; hij bouwde ze, en richtte haar deuren op, met haar sloten en haar grendelen”. Bij de inwijding van de muur ging een van de twee zangerskoren “ter rechterhand op den muur, naar de Mistpoort toe”, rond de zuidkant van de stad naar de tempel."
    - "Bliss en Dickie, die in 1894–1897 langs de zuidmuren tunnelden, vonden bij de Vijver van Siloam een poort die zij voor Nehemia's Bronpoort hielden, en een andere bij de zuidwesthoek van de westelijke heuvel, op welker plaats volgens hen waarschijnlijk de Mestpoort stond; geen van beide identificaties is bewezen, en de benedenstad, buiten de Ottomaanse muren gelaten, is sindsdien stukje bij beetje opgegraven. De huidige Mestpoort (Bab al-Maghariba) in de muur die Süleyman de Grote in 1537–1541 bouwde, de ingang het dichtst bij de Westelijke Muur, nam de bijbelse naam over maar is een andere poort, ongeveer een halve kilometer naar het noorden."
  cs:
    - "Hnojná brána byla branou v jižní hradbě Jeruzaléma za Nehemjášových dnů, kterou se odpadky města vynášely a vysypávaly v Hinnomově údolí; hebrejské jméno znamená „brána hromad popela“. Stála tisíc loktů, asi 450 m, od Brány v údolí podél hradby, což ji při obvyklém názoru, že Nehemjášova hradba obepínala jen východní pahorek, klade poblíž jižního cípu Města Davidova, kde Tyropoion ústí do Hinnomu, ač přesné místo je neznámé. Někteří ji ztotožňují se Střepovou bránou u Jeremjáše, cestou ven do Hinnomova údolí (synodální text tuto bránu nazývá Charšit), protože obě vedly na tutéž skládku."
    - "Nehemjášova noční jízda ho vedla „branou při údolí v noci k studnici drakové a k bráně hnojné“, kolem pobořených hradeb a spálených bran. Při opravě stavitelé Brány v údolí pracovali „a zdi na tisíc loket až do brány hnojné“ a samu bránu „opravil Malkiáš syn Rechabův, hejtman kraje Betkarem. On ji ustavěl, a vstavil vrata s zámky i závorami jejími“. Při vysvěcení hradby jeden ze dvou sborů zpěváků „šli na pravo, od horní strany zdi k bráně hnojné“, kolem jihu města k chrámu."
    - "Bliss a Dickie, razící tunely podél jižních hradeb v letech 1894–1897, nalezli u rybníka Siloe bránu, kterou pokládali za Nehemjášovu Pramennou bránu, a další u jihozápadního rohu západního pahorku, na jejímž místě podle nich pravděpodobně stála Hnojná brána; ani jedno ztotožnění není prokázáno a dolní město, ponechané mimo osmanské hradby, bylo od té doby vykopáváno po částech. Dnešní Hnojná brána (Bab al-Maghariba) v hradbě, kterou Sulejman Nádherný postavil v letech 1537–1541, nejbližší vchod k Západní zdi, převzala biblické jméno, ale je to jiná brána, asi půl kilometru na sever."
  sv:
    - "Dyngporten var en port i Jerusalems södra mur på Nehemjas tid, genom vilken stadens avfall bars ut för att tippas i Hinnoms dal; det hebreiska namnet betyder ”askhögarnas port”. Den stod ett tusen alnar, omkring 450 m, från Dalporten längs muren, vilket, enligt den vanliga uppfattningen att Nehemjas mur bara omslöt östra kullen, placerar den nära Davids stads södra udde, där Tyropoiondalen mynnar i Hinnom, även om dess exakta plats är okänd. Somliga identifierar den med Jeremias Lerskärvsport, vägen ut till Hinnoms dal (den synodala texten kallar den porten Harshith), eftersom båda ledde till samma avfallsplats."
    - "Nehemjas nattliga ritt gick ”genom Dalporten fram emot Drakkällan och Dyngporten” förbi de nedbrutna murarna och de brända portarna. Vid återuppbyggnaden byggde Dalportens byggare ”ett tusen alnar på muren, ända fram till Dyngporten”, och själva porten: ”Dyngporten sattes i stånd av Malkia, Rekabs son, hövdingen över Bet-Hackerems område; han byggde upp den och satte in dess dörrar, dess riglar och bommar”. Vid murens invigning gick en av de två sångarkörerna ”till höger ovanpå muren, fram till Dyngporten”, runt söder om staden till templet."
    - "Bliss och Dickie, som grävde tunnlar längs de södra murarna 1894–1897, fann en port nära Siloadammen, som de höll för Nehemjas Källport, och en annan i sydvästra hörnet av västra kullen, på vars plats de trodde att Dyngporten sannolikt stod; ingendera identifieringen är bevisad, och nedre staden, som lämnades utanför de osmanska murarna, har grävts ut bit för bit. Dagens Dyngport (Bab al-Maghariba) i muren som Suleiman den store lät bygga 1537–1541, ingången närmast Västra muren, övertog det bibliska namnet men är en annan port, omkring en halv kilometer åt norr."
  nb:
    - "Møkkporten var en port i Jerusalems sørmur på Nehemjas tid, som byens avfall ble båret ut gjennom for å dumpes i Hinnoms dal; det hebraiske navnet betyr «askehaugenes port». Den sto tusen alen, omkring 450 m, fra Dalporten langs muren, noe som etter den vanlige oppfatningen at Nehemjas mur bare omsluttet østhøyden, plasserer den nær sørspissen av Davidsbyen, der Tyropoion-dalen løper ut i Hinnom, selv om dens nøyaktige sted er ukjent. Noen identifiserer den med Jeremias Potteskårport, veien ut til Hinnoms dal (den synodale teksten kaller den porten Harshith), siden begge førte til den samme avfallsplassen."
    - "Nehemjas nattlige ritt tok ham «ut gjennem Dalporten og bortimot Dragekilden og kom til Møkkporten», forbi de nedrevne murene og de brente portene. Ved gjenoppbyggingen bygde Dalportens byggere «tusen alen av muren, til Møkkporten», og porten selv «blev satt i stand av Malkia, Rekabs sønn, høvdingen over Bet-Hakkerems distrikt; han bygget den op og satte inn dører og låser og slåer». Ved innvielsen av muren gikk det ene av de to sangerkorene «til høire ovenpå muren frem til Møkkporten», rundt sørsiden av byen til tempelet."
    - "Bliss og Dickie fant, mens de gravde tunneler langs sørmurene i 1894–1897, en port nær Siloa-dammen, som de regnet for Nehemjas Kildeport, og en annen i sørvesthjørnet av vesthøyden, på hvis sted de mente Møkkporten trolig sto; ingen av identifiseringene er bevist, og Underbyen, som ble liggende utenfor de osmanske murene, er gravd ut stykkevis siden. Dagens Møkkport (Bab al-Maghariba) i muren som Süleyman den storslåtte bygde i 1537–1541, inngangen nærmest Vestmuren, overtok det bibelske navnet, men er en annen port, omtrent en halv kilometer lenger nord."
  tl:
    - "Ang Pintuang-bayan ng Dumi ay isang pintuan sa katimugang pader ng Jerusalem noong panahon ni Nehemias, na dinaanan ng basura ng lungsod palabas upang itapon sa libis ng Hinnom; ang pangalang Hebreo ay nangangahulugang “pintuang-bayan ng mga bunton ng abo”. Nakatayo ito isang libong siko, mga 450 m, mula sa Pintuang-bayan ng Libis sa kahabaan ng pader; ayon sa karaniwang pananaw na ang pader ni Nehemias ay pumapaligid lamang sa silangang burol, inilalagay ito ng layong iyon malapit sa katimugang dulo ng Bayan ni David, kung saan dumadaloy ang libis ng Tyropoeon sa Hinnom, bagaman hindi alam ang eksaktong lugar. Kinikilala ito ng ilan sa Pintuang-bayan ng Harsit ni Jeremias, ang labasan patungo sa libis ng Hinnom (Harshith ang tawag ng tekstong Sinodal sa pintuang iyon), yamang parehong patungo sa iisang tapunan."
    - "Dinala ang pagsakay ni Nehemias sa gabi “sa pintuang-bayan ng libis, sa makatuwid baga'y sa dako ng balon ng dragon, at sa pintuang-bayan ng tapunan ng dumi”, sa tabi ng mga nawasak na pader at sinunog na pintuan. Sa pagkukumpuni, ang mga tagapagtayo ng Pintuang-bayan ng Libis ay gumawa ng “isang libong siko sa kuta hanggang sa pintuang-bayan ng tapunan ng dumi”, at ang mismong pintuan ay “hinusay ni Malchias na anak ni Rechab, na pinuno ng distrito ng Beth-haccerem; kaniyang itinayo, at inilagay ang mga pinto niyaon, ang mga trangka niyaon, at ang mga halang niyaon”. Sa pagtatalaga ng pader, ang isa sa dalawang pangkat ng mga mang-aawit ay “lumalakad sa kanan sa ibabaw ng kuta sa dako ng pintuang-bayan ng tapunan ng dumi”, paikot sa timog ng lungsod patungo sa Templo."
    - "Sina Bliss at Dickie, na naghuhukay ng lagusan sa kahabaan ng katimugang pader noong 1894–1897, ay nakatagpo ng isang pintuan malapit sa Tangke ng Siloe, na itinuring nilang Pintuang-bayan ng Bukal ni Nehemias, at ng isa pa sa timog-kanlurang anggulo ng kanlurang burol, na sa pook nito ay inakala nilang marahil nakatayo ang Pintuang-bayan ng Dumi; walang napatunayang pagkilala, at ang ibabang lungsod, na naiwan sa labas ng mga pader na Otomano, ay hinuhukay nang pira-piraso mula noon. Ang kasalukuyang Pintuang-bayan ng Dumi (Bab al-Maghariba) sa pader na itinayo ni Suleiman ang Dakila noong 1537–1541, ang pasukang pinakamalapit sa Pader sa Kanluran, ay kumuha ng pangalang biblikal ngunit ibang pintuan, mga kalahating kilometro sa hilaga."
  da:
    - "Møgporten var en port i Jerusalems sydmur i Nehemias' dage, hvorigennem byens affald blev båret ud for at blive dumpet i Hinnoms dal; det hebraiske navn betyder »askedyngernes port«. Den stod tusind alen, cirka 450 m, fra Dalporten langs muren, hvilket ifølge den sædvanlige opfattelse, at Nehemias' mur kun omsluttede den østlige høj, placerer den nær den sydlige spids af Davidsbyen, hvor Tyropoion-dalen løber ud i Hinnom, selv om dens nøjagtige sted er ukendt. Nogle identificerer den med Jeremias' Potteskårsport, udgangen til Hinnoms dal (den synodale tekst kalder den port Harshith), da begge førte til det samme affaldsområde."
    - "Nehemias' natlige ridt gik ud ad Dalporten og »hen imod Dragekilden og hen til Møgporten«, forbi de nedrevne mure og de brændte porte. Ved genopbygningen arbejdede Dalportens bygmestre »tusinde Alen paa Muren indtil Møgporten«, og selve porten istandsattes af Malkija, Rekabs søn: »Øversten for Beth-Kerems Kreds, istandsatte Møgporten; han byggede den og indsatte dens Døre med dens Laase og Stænger«. Ved murens indvielse »gik« det ene af de to sangerkor »til den højre Side oven paa Muren til Møgporten«, rundt om byens sydside til templet."
    - "Bliss og Dickie fandt, mens de gravede tunneler langs sydmurene i 1894–1897, en port nær Siloam-dammen, som de anså for Nehemias' Kildeport, og en anden i den vestlige højs sydvestlige vinkel, på hvis sted de mente, at Møgporten sandsynligvis stod; ingen af identifikationerne er bevist, og Nedre By, som blev efterladt uden for de osmanniske mure, er siden blevet udgravet stykkevis. Nutidens Møgport (Bab al-Maghariba) i den mur, Suleiman den Prægtige byggede i 1537–1541, indgangen nærmest Vestmuren, overtog det bibelske navn, men er en anden port, cirka en halv kilometer mod nord."
