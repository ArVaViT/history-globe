# Overview article (ADR 0007). Mainstream facts only; the gate is unlocated; today's Dung Gate is distinguished as a later gate that borrowed the name.
id: dung-gate
place: a1611b6
title:
  en: "Dung Gate"
  ru: "Навозные ворота"
body:
  en:
    - "The Dung Gate was a gate in the southern wall of Jerusalem in Nehemiah's day, through which the city's refuse was carried out to be dumped in the valley of Hinnom; the Hebrew name means “gate of the ash heaps”. It stood a thousand cubits, about 450 m, from the Valley Gate along the wall, which places it near the southern tip of the City of David, where the Tyropoeon valley runs into the Hinnom, though its exact spot is unknown. Some identify it with the Potsherd Gate of Jeremiah, the way out to the valley of Hinnom (the Synodal text calls that gate Harshith), since both led to the same waste ground."
    - "Nehemiah's night ride took him “by the gate of the valley, even before the dragon well, and to the dung port”, past the broken walls and burnt gates. In the repair the Valley Gate's builders worked “a thousand cubits on the wall unto the dung gate”, and the gate itself “repaired Malchiah the son of Rechab, the ruler of part of Beth-haccerem; he built it, and set up the doors thereof, the locks thereof, and the bars thereof”. At the dedication of the wall one of the two companies of singers “went on the right hand upon the wall toward the dung gate”, round the south of the city to the Temple."
    - "Bliss and Dickie, tunnelling along the southern walls in 1894–1897, found a gate near the Pool of Siloam that has sometimes been taken for Nehemiah's; the matter is unproved, and the lower city, left outside the Ottoman walls, has been dug piecemeal since. Today's Dung Gate (Bab al-Maghariba) in the wall that Suleiman the Magnificent built in 1537–1541, the entrance nearest the Western Wall, took over the biblical name but is a different gate, about half a kilometre to the north."
  ru:
    - "Навозные ворота — ворота в южной стене Иерусалима во дни Неемии, через которые городские отбросы вывозили в долину Еннома; еврейское имя значит «ворота мусорных куч». Они стояли в тысяче локтей, около 450 м, от ворот Долины вдоль стены, что помещает их у южной оконечности города Давидова, где долина Тиропеон впадает в Енном, хотя точное место неизвестно. Некоторые отождествляют их с воротами Харшиф у Иеремии, выходом в долину сыновей Енномовых, поскольку оба вели на ту же свалку."
    - "Ночной объезд Неемии прошёл «через ворота Долины перед источником Драконовым к воротам Навозным», мимо разрушенных стен и сожжённых ворот. При починке строители ворот Долины «чинили они тысячу локтей стены до ворот Навозных», а сами ворота «чинил Малхия, сын Рехава, начальник Бефкаремского округа: он построил их и вставил двери их, замки их и засовы их». При освящении стены один из двух хоров «шел по правой стороне стены к Навозным воротам», вокруг южной части города к Храму."
    - "Блисс и Дики, прокладывая туннели вдоль южных стен в 1894–1897 годах, нашли у Силоамского пруда ворота, которые иногда принимали за ворота Неемии; это не доказано, а нижний город, оставшийся вне османских стен, с тех пор раскапывают по частям. Нынешние Навозные (Мусорные) ворота, Баб-эль-Магариба, в стене, построенной Сулейманом Великолепным в 1537–1541 годах, ближайший вход к Западной стене, унаследовали библейское имя, но это другие ворота, примерно на полкилометра севернее."
