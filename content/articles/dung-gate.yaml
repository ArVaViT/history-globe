# Overview article (ADR 0007). Mainstream facts only; the gate is unlocated; today's Dung Gate is distinguished as a later gate that borrowed the name.
id: dung-gate
place: a1611b6
title:
  en: "Dung Gate"
  ru: "Навозные ворота"
  uk: "Гноєві ворота"
  es: "Puerta del Muladar"
  pt: "Porta do Esterco"
  de: "Misttor"
  fr: "Porte du Fumier"
  it: "Porta del Letame"
  pl: "Brama Gnojna"
  nl: "Mestpoort"
  cs: "Hnojná brána"
  sv: "Dyngporten"
  nb: "Møkkporten"
  tl: "Pintuang-bayan ng Dumi"
