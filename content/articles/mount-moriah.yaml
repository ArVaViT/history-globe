# Overview article (ADR 0007). Mount Moriah of 2 Chr 3:1 is the Temple hill in Jerusalem, today the Temple Mount / Haram al-Sharif; only plain facts about the site today. The land of Gen 22 is moriah.yaml.
id: mount-moriah
