body:
  en:
    - "Mount Moriah is the hill in Jerusalem on which Solomon built the Temple: “Then Solomon began to build the house of the LORD at Jerusalem in mount Moriah, where the Lord appeared unto David his father, in the place that David had prepared in the threshingfloor of Ornan the Jebusite.” It is the only place in the Bible that names the mountain. The threshing floor was where David, at the end of the plague after his census, built an altar at the prophet Gad's word and bought the floor from its Jebusite owner, called Araunah in Samuel and Ornan in Chronicles."
    - "By naming the Temple hill Moriah, Chronicles links it with the land of Moriah where Abraham was sent to offer Isaac, and Josephus says outright that the offering took place on this spot. The hill rises north of the City of David, between the Kidron and the central valley; Herod the Great enclosed its top in the great platform whose retaining walls still stand, among them the Western Wall. Since the late seventh century the platform has carried the Dome of the Rock, completed in 691–692 over the bedrock outcrop known as the Foundation Stone, and the al-Aqsa Mosque at its southern end."
  ru:
    - "Гора Мориа — холм в Иерусалиме, на котором Соломон построил храм: «И начал Соломон строить дом Господень в Иерусалиме на горе Мориа, которая указана была Давиду, отцу его, на месте, которое приготовил Давид, на гумне Орны Иевусеянина». Это единственное место в Библии, где гора так названа. На этом гумне Давид, когда после переписи прекратилась моровая язва, по слову пророка Гада поставил жертвенник и купил гумно у его владельца-иевусея, которого Книги Царств и Паралипоменон называют Орной."
    - "Называя храмовый холм Мориа, Паралипоменон связывает его с землёй Мориа, куда Авраам был послан принести в жертву Исаака, а Иосиф Флавий прямо говорит, что жертвоприношение было на этом месте. Холм поднимается к северу от Города Давида, между Кедроном и центральной долиной; Ирод Великий заключил его вершину в огромную платформу, подпорные стены которой стоят до сих пор, среди них Западная стена. С конца VII в. на платформе стоят Купол Скалы, завершённый в 691–692 гг. над выходом скальной породы, известным как Камень основания, и мечеть аль-Акса у её южного края."
  de:
    - "Der Berg Morija ist der Hügel in Jerusalem, auf dem Salomo den Tempel baute: „Und Salomo fing an zu bauen das Haus des HERRN zu Jerusalem auf dem Berge Morija, der David, seinem Vater, gezeigt war, welchen David zubereitet hatte zum Raum auf der Tenne Ornans, des Jebusiters.“ Es ist die einzige Stelle der Bibel, die den Berg nennt. Auf der Tenne errichtete David am Ende der Seuche nach seiner Volkszählung auf das Wort des Propheten Gad einen Altar und kaufte sie ihrem jebusitischen Besitzer ab, der in Samuel Arauna und in der Chronik Ornan heißt."
    - "Indem die Chronik den Tempelberg Morija nennt, verbindet sie ihn mit dem Land Morija, wohin Abraham gesandt wurde, um Isaak zu opfern, und Josephus sagt ausdrücklich, das Opfer habe an dieser Stelle stattgefunden. Der Hügel erhebt sich nördlich der Davidsstadt zwischen dem Kidron und dem Zentraltal; Herodes der Große fasste seine Spitze in die große Plattform ein, deren Stützmauern noch stehen, darunter die Westmauer. Seit dem späten siebten Jahrhundert trägt die Plattform den Felsendom, 691–692 über dem als Gründungsstein bekannten Felsvorsprung vollendet, und an ihrem Südende die al-Aqsa-Moschee."
  fr:
    - "Le mont Morija est la colline de Jérusalem sur laquelle Salomon bâtit le Temple : « Salomon commença à bâtir la maison de l’Éternel à Jérusalem, sur la montagne de Morija, qui avait été indiquée à David, son père, dans le lieu préparé par David sur l’aire d’Ornan, le Jébusien. » C’est le seul endroit de la Bible qui nomme la montagne. L’aire était le lieu où David, à la fin de la peste qui suivit son recensement, éleva un autel sur la parole du prophète Gad et acheta l’aire à son propriétaire jébusien, appelé Aravna (Araunah dans la version du roi Jacques) dans Samuel et Ornan dans les Chroniques."
    - "En nommant Morija la colline du Temple, les Chroniques la relient au pays de Morija où Abraham fut envoyé offrir Isaac, et Josèphe dit sans détour que l’offrande eut lieu à cet endroit. La colline s’élève au nord de la cité de David, entre le Cédron et la vallée centrale ; Hérode le Grand enferma son sommet dans la grande plate-forme dont les murs de soutènement se dressent encore, parmi eux le Mur occidental. Depuis la fin du VIIe siècle, la plate-forme porte le Dôme du Rocher, achevé en 691–692 au-dessus de l’affleurement rocheux appelé la Pierre de fondation, et la mosquée al-Aqsa à son extrémité sud."
  pt:
    - "O monte Moriá é a colina de Jerusalém em que Salomão construiu o Templo: “Então Salomão começou a construir a casa do SENHOR em Jerusalém, no monte Moriá, onde o SENHOR havia aparecido a Davi, seu pai, no lugar que Davi tinha preparado na eira de Ornã, o jebuseu.” É o único lugar da Bíblia que nomeia o monte. A eira era onde Davi, no fim da praga que se seguiu ao seu recenseamento, construiu um altar por palavra do profeta Gade e comprou a eira de seu dono jebuseu, chamado Araúna em Samuel e Ornã em Crônicas."
    - "Ao chamar de Moriá a colina do Templo, Crônicas a liga à terra de Moriá aonde Abraão foi enviado para oferecer Isaque, e Josefo diz sem rodeios que a oferta ocorreu neste lugar. A colina se ergue ao norte da Cidade de Davi, entre o Cedrom e o vale central; Herodes, o Grande, cercou seu topo na grande plataforma cujos muros de arrimo ainda estão de pé, entre eles o Muro Ocidental. Desde o final do século VII a plataforma traz a Cúpula da Rocha, concluída em 691–692 sobre o afloramento rochoso conhecido como Pedra Fundamental, e a Mesquita de al-Aqsa em sua extremidade sul."
  it:
    - "Il monte Moria è il colle di Gerusalemme su cui Salomone costruì il Tempio: «Salomone cominciò a costruire la casa dell’Eterno a Gerusalemme, sul monte Moriah, dove l’Eterno era apparso a Davide suo padre, nel luogo che Davide aveva preparato, nell’aia di Ornan, il Gebuseo». È l’unico passo della Bibbia che nomina il monte. L’aia era il luogo dove Davide, alla fine della peste dopo il suo censimento, eresse un altare su parola del profeta Gad e comprò l’aia dal suo proprietario gebuseo, chiamato Arauna in Samuele e Ornan nelle Cronache."
    - "Chiamando Moria il colle del Tempio, le Cronache lo collegano al paese di Moria dove Abramo fu mandato a offrire Isacco, e Giuseppe Flavio dice apertamente che l’offerta avvenne in questo luogo. Il colle si leva a nord della Città di Davide, tra il Cedron e la valle centrale; Erode il Grande ne racchiuse la sommità nella grande piattaforma i cui muri di sostegno sono ancora in piedi, tra cui il Muro occidentale. Dalla fine del VII secolo la piattaforma porta la Cupola della Roccia, completata nel 691–692 sull’affioramento di roccia nota come Pietra del Fondamento, e la moschea di al-Aqsa alla sua estremità meridionale."
  nl:
    - "De berg Moria is de heuvel in Jeruzalem waarop Salomo de Tempel bouwde: “En Salomo begon het huis des HEEREN te bouwen te Jeruzalem, op den berg Moria, die zijn vader David gewezen was, in de plaats, die David toebereid had, op den dorsvloer van Ornan, den Jebusiet.” Het is de enige plaats in de Bijbel die de berg noemt. De dorsvloer was waar David, aan het einde van de plaag na zijn volkstelling, op het woord van de profeet Gad een altaar bouwde en de vloer kocht van zijn Jebusitische eigenaar, in Samuël Arauna en in Kronieken Ornan genoemd."
    - "Door de tempelheuvel Moria te noemen verbindt Kronieken die met het land Moria waarheen Abraham werd gezonden om Isaak te offeren, en Josephus zegt met zoveel woorden dat het offer op deze plek plaatsvond. De heuvel rijst ten noorden van de Stad van David, tussen het Kidrondal en de centrale vallei; Herodes de Grote omsloot de top in het grote platform waarvan de steunmuren nog staan, onder meer de Westelijke Muur. Sinds het einde van de zevende eeuw draagt het platform de Rotskoepel, voltooid in 691–692 boven de rotsuitloper die bekendstaat als de Fundamentsteen, en aan de zuidkant de al-Aqsa-moskee."
  pl:
    - "Góra Moria to wzgórze w Jerozolimie, na którym Salomon zbudował Świątynię: „Począł tedy Salomon budować dom Pański w Jeruzalemie na górze Moryja, która była ukazana Dawidowi, ojcu jego, na miejscu, które zgotował Dawid na bojewisku Ornana Jebuzejczyka”. Jest to jedyne miejsce w Biblii, które nazywa tę górę. Klepisko było miejscem, gdzie Dawid pod koniec zarazy po swoim spisie ludności zbudował ołtarz na słowo proroka Gada i kupił klepisko od jego jebuzyckiego właściciela, zwanego Arauną w Księgach Samuela i Ornanem w Kronikach."
    - "Nazywając wzgórze Świątyni Moria, Kroniki łączą je z ziemią Moria, do której posłano Abrahama, by ofiarował Izaaka, a Józef Flawiusz mówi wprost, że ofiara odbyła się na tym miejscu. Wzgórze wznosi się na północ od Miasta Dawida, między Cedronem a doliną środkową; Herod Wielki obudował jego szczyt wielką platformą, której mury oporowe stoją do dziś, wśród nich Mur Zachodni. Od końca VII wieku platforma nosi Kopułę na Skale, ukończoną w latach 691–692 nad wychodnią skalną zwaną Kamieniem Fundamentowym, oraz meczet al-Aksa na jej południowym krańcu."
  uk:
    - "Гора Морія — пагорб в Єрусалимі, на якому Соломон збудував Храм: «І почав Соломон будувати дом Господнїй в Ерусалимі на горі Моріа, що була вказана Давидові, його батькові, на місцї, що зготував Давид на току Орни Евузія». Це єдине місце в Біблії, яке називає цю гору. На току Давид наприкінці чуми після свого перепису спорудив жертовник за словом пророка Гада й купив тік у його євусейського власника, якого Самуїл називає Аравною, а Хроніки — Орною."
    - "Називаючи пагорб Храму Морією, Хроніки пов'язують його із землею Морія, куди Авраама було послано принести в жертву Ісаака, а Йосиф Флавій прямо каже, що жертвопринесення відбулося на цьому місці. Пагорб здіймається на північ від Міста Давида, між Кедроном і центральною долиною; Ірод Великий обгородив його вершину величезною платформою, підпірні стіни якої досі стоять, серед них Західна стіна. Від кінця VII ст. платформа несе Купол Скелі, завершений 691–692 рр. над виступом скельної породи, відомим як Камінь основи, і мечеть аль-Акса на її південному краї."
  cs:
    - "Hora Moria je návrší v Jeruzalémě, na němž Šalomoun vystavěl chrám: „I začal stavěti Šalomoun domu Hospodinova v Jeruzalémě na hoře Moria, kteráž byla ukázána Davidovi otci jeho, na místě, kteréž byl připravil David, na humně Ornana Jebuzejského.“ Je to jediné místo v Bibli, které horu jmenuje. Humno bylo místem, kde David na konci moru po svém sčítání lidu vystavěl oltář na slovo proroka Gáda a koupil humno od jeho jebuzejského majitele, zvaného Arauna v Samuelovi a Ornana v Paralipomenu."
    - "Tím, že Paralipomenon nazývá chrámový pahorek Moria, spojuje jej se zemí Moria, kam byl Abraham poslán obětovat Izáka, a Josephus Flavius přímo říká, že oběť se konala na tomto místě. Pahorek se zvedá severně od Města Davidova, mezi Kidronem a středním údolím; Herodes Veliký uzavřel jeho vrchol do velké plošiny, jejíž opěrné zdi dosud stojí, mezi nimi Zeď nářků. Od konce sedmého století nese plošina Skalní dóm, dokončený v letech 691–692 nad skalním výchozem známým jako Základní kámen, a na jižním konci mešitu al-Aksá."
  es:
    - "Moria es el monte de Jerusalén en el que Salomón edificó el Templo: «comenzó Salomón á edificar la casa en Jerusalem, en el monte Moria que había sido mostrado á David su padre, en el lugar que David había preparado en la era de Ornán Jebuseo». Es el único lugar de la Biblia que nombra el monte. La era era el sitio donde David, al final de la plaga posterior a su censo, levantó un altar por palabra del profeta Gad y compró la era a su dueño jebuseo, llamado Arauna en Samuel y Ornán en Crónicas."
    - "Al llamar Moria al monte del Templo, Crónicas lo vincula con la tierra de Moriah adonde fue enviado Abraham a ofrecer a Isaac, y Josefo dice sin rodeos que la ofrenda tuvo lugar en este sitio. El monte se alza al norte de la Ciudad de David, entre el Cedrón y el valle central; Herodes el Grande encerró su cima en la gran plataforma cuyos muros de contención aún se mantienen, entre ellos el Muro Occidental. Desde fines del siglo VII la plataforma lleva la Cúpula de la Roca, terminada en 691–692 sobre el afloramiento de roca madre conocido como la Piedra Fundacional, y en su extremo sur la mezquita de al-Aqsa."
  sv:
    - "Berget Moria är kullen i Jerusalem på vilken Salomo byggde templet: ”Och Salomo begynte att bygga HERRENS hus i Jerusalem, på berget Moria, där hans fader David hade fått sin uppenbarelse, och där han nu själv hade berett rum, på det ställe som David hade utsett, nämligen på jebuséen Ornans tröskplats.” Det är det enda ställe i Bibeln som nämner berget. Tröskplatsen var där David, vid slutet av pesten efter sin folkräkning, byggde ett altare på profeten Gads ord och köpte platsen av dess jebusitiske ägare, kallad Aravna i Samuelsböckerna och Ornan i Krönikeböckerna."
    - "Genom att kalla tempelkullen Moria förbinder Krönikeböckerna den med Moria land där Abraham sändes för att offra Isak, och Josefus säger rakt ut att offret ägde rum på denna plats. Kullen reser sig norr om Davids stad, mellan Kidron och centraldalen; Herodes den store inhägnade dess topp i den stora plattform vars stödmurar ännu står, bland dem Västra muren. Sedan sent 600-tal bär plattformen Klippdomen, färdigställd 691–692 över det uppstickande berggrundspartiet som kallas Grundstenen, och al-Aqsamoskén i dess södra ände."
  nb:
    - "Moriafjellet er høyden i Jerusalem der Salomo bygde tempelet: «Så begynte Salomo å bygge Herrens hus i Jerusalem, på Moriafjellet, der hvor Herren hadde åpenbaret sig for hans far David, på den plass hvor David hadde samlet forråd, på jebusitten Ornans treskeplass.» Det er det eneste stedet i Bibelen som nevner fjellet ved navn. Treskeplassen var der David, ved slutten av pesten etter folketellingen, bygde et alter etter profeten Gads ord og kjøpte plassen av dens jebusittiske eier, kalt Aravna i Samuel og Ornan i Krønikebøkene."
    - "Ved å kalle tempelhøyden Moria knytter Krønikebøkene den til landet Moria dit Abraham ble sendt for å ofre Isak, og Josefus sier rett ut at offeret fant sted på dette stedet. Høyden stiger nord for Davidsbyen, mellom Kedron og den sentrale dalen; Herodes den store innhegnet toppen i den store plattformen hvis støttemurer fortsatt står, blant dem Vestmuren. Siden slutten av 600-tallet har plattformen båret Klippedomen, fullført i 691–692 over fjellknausen kjent som Grunnsteinen, og al-Aqsa-moskeen i sin sørlige ende."
  tl:
    - "Ang Bundok Moria ay ang burol sa Jerusalem kung saan itinayo ni Salomon ang Templo: “Nang magkagayo'y pinasimulan ni Salomon na itayo ang bahay ng Panginoon, sa Jerusalem sa bundok ng Moria, na pinagkakitaan ng Panginoon kay David na kaniyang ama, sa dakong kaniyang pinaghandaan na pinagtakdaan ni David sa giikan ni Ornan na Jebuseo.” Ito lamang ang lugar sa Biblia na nagpapangalan sa bundok. Ang giikan ay kung saan itinayo ni David, sa pagtatapos ng salot pagkatapos ng kaniyang senso, ang isang dambana sa salita ng propetang si Gad at binili ang giikan sa may-ari nitong Jebuseo, tinatawag na Araunah sa Samuel at Ornan sa Mga Cronica."
    - "Sa pagpapangalan sa burol ng Templo na Moria, iniuugnay ito ng Mga Cronica sa lupain ng Moria kung saan isinugo si Abraham upang ihandog si Isaac, at tuwirang sinasabi ni Josefo na naganap ang paghahandog sa lugar na ito. Tumataas ang burol sa hilaga ng Bayan ni David, sa pagitan ng Cedron at ng gitnang libis; ipinaloob ni Herodes na Dakila ang tuktok nito sa malaking plataporma na ang mga pader na tagapagpigil ay nakatayo pa, kabilang ang Kanlurang Pader. Mula huling ika-7 siglo, dala ng plataporma ang Simboryo ng Bato, natapos noong 691–692 sa ibabaw ng batong-lupa na kilala bilang Bato ng Pundasyon, at ang Moske ng al-Aqsa sa timog na dulo nito."
  da:
    - "Morija-bjerget er bakken i Jerusalem, hvorpå Salomo byggede templet: »Og Salomo begyndte at bygge Herrens Hus i Jerusalem paa Moria Bjerg, hvor han havde aabenbaret sig for David, hans Fader, … David havde beredt paa Ornans, Jebusitens, Tærskeplads.« Det er det eneste sted i Bibelen, der nævner bjerget ved navn. Tærskepladsen var, hvor David, ved slutningen af pesten efter sin folketælling, byggede et alter på profeten Gads ord og købte pladsen af dens jebusitiske ejer, kaldet Aravna i Samuelsbøgerne og Ornan i Krønikebøgerne."
    - "Ved at kalde tempelbakken Morija forbinder Krønikebøgerne den med Morijas land, hvor Abraham blev sendt for at ofre Isak, og Josefus siger ligeud, at ofringen fandt sted på dette sted. Bakken hæver sig nord for Davidsbyen, mellem Kedron og den centrale dal; Herodes den Store omsluttede dens top i den store platform, hvis støttemure stadig står, blandt dem Vestmuren. Siden slutningen af 600-tallet har platformen båret Klippedomen, fuldført i 691–692 over det blottede grundfjeld kendt som Grundstenen, og al-Aqsa-moskeen i dens sydlige ende."
  sr:
    - "Морија је брдо у Јерусалиму на коме је Соломун саградио Храм: „И поче Соломун зидати дом Господњи у Јерусалиму на брду Морији, које би показано Давиду оцу његовом на месту које беше приправио Давид, на гумну Орнана Јевусејина.“ То је једино место у Библији које именује гору. Гумно је било место где је Давид, на крају помора после свог пописа, по речи пророка Гада подигао олтар и купио гумно од његовог јевусејског власника, званог Орна у Књизи Самуиловој и Орнан у Дневницима."
    - "Именујући брдо Храма Морија, Дневници га повезују са земљом Морија у коју је Аврам био послат да принесе Исака, а Јосиф Флавије отворено каже да се жртва догодила на овом месту. Брдо се диже северно од Давидовог града, између Кедрона и средишње долине; Ирод Велики оградио је његов врх великом платформом чији потпорни зидови још стоје, међу њима и Западни зид. Од касног VII века платформа носи Куполу на стени, довршену 691–692. над избочином стене познатом као Камен темељац, и џамију Ел-Акса на њеном јужном крају."
  hu:
    - "A Móriá-hegy az a jeruzsálemi domb, amelyen Salamon felépítette a templomot: „Elkezdé építtetni Salamon az Úr házát Jeruzsálemben a Mórija hegyén, mely Dávidnak, az ő atyjának megmutattatott, azon a helyen, melyet készített vala Dávid a Jebuzeus Ornán szérűjén.” Ez az egyetlen hely a Bibliában, amely megnevezi a hegyet. A szérű az volt, ahol Dávid a népszámlálása utáni csapás végén Gád próféta szavára oltárt épített, és megvette a szérűt jebuzeus tulajdonosától, akit Sámuel könyvében Araunának, a Krónikákban Ornánnak neveznek."
    - "Azzal, hogy a templomdombot Móriának nevezi, a Krónikák összekapcsolja a Móriá földjével, ahová Ábrahámot küldték Izsák feláldozására, és Josephus egyenesen azt mondja, hogy az áldozat ezen a helyen történt. A domb Dávid városától északra emelkedik, a Kidron és a középső völgy között; Nagy Heródes a tetejét a nagy emelvénybe zárta, amelynek tartófalai ma is állnak, köztük a Nyugati Fal. A 7. század vége óta az emelvényen áll a Sziklamecset, amely 691–692-ben készült el az Alapkőnek nevezett alapkőzet-kibúvás fölött, és déli végén az al-Aksza mecset."
  fi:
    - "Morianvuori on Jerusalemin kukkula, jolle Salomo rakensi temppelin: ”Sitten Salomo alkoi rakentaa Herran temppeliä Jerusalemiin, Moorian vuorelle, jossa Herra oli ilmestynyt hänen isällensä Daavidille, siihen paikkaan, jonka Daavid oli valmistanut, jebusilaisen Ornanin puimatantereelle.” Se on ainoa paikka Raamatussa, joka nimeää vuoren. Puimatanner oli paikka, jossa Daavid vitsauksen päätteeksi väenlaskunsa jälkeen rakensi alttarin profeetta Gadin sanasta ja osti tantereen sen jebusilaiselta omistajalta, jota Samuelin kirjoissa kutsutaan Araunaksi ja Aikakirjoissa Ornaniksi."
    - "Nimeämällä temppelivuoren Moriaksi Aikakirjat yhdistävät sen Moorian maahan, jonne Abraham lähetettiin uhraamaan Iisak, ja Josephus sanoo suoraan, että uhri tapahtui tällä paikalla. Kukkula kohoaa Daavidin kaupungin pohjoispuolella Kidronin ja keskilaakson välissä; Herodes Suuri sulki sen huipun suureen alustaan, jonka tukimuurit ovat yhä pystyssä, muiden muassa Länsimuuri. 600-luvun lopulta lähtien alustalla on ollut Kalliomoskeija, valmistunut 691–692 niin sanotun Perustuskiven peruskallionkohouman päälle, ja sen eteläpäässä al-Aqsa-moskeija."
  vi:
    - "Núi Mô-ri-a là ngọn đồi ở Giê-ru-sa-lem nơi Sa-lô-môn xây Đền Thờ: “Sa-lô-môn khởi cất đền Đức Giê-hô-va tại Giê-ru-sa-lem, trên núi Mô-ri-a, là nơi Đức Giê-hô-va đã hiện ra cùng Đa-vít, cha người, tại trên chỗ mà Đa-vít đã dọn, tức là trong sân đạp lúa của Ọt-na, người Giê-bu-sít”. Đây là nơi duy nhất trong Kinh Thánh nêu tên ngọn núi. Sân đạp lúa là nơi Đa-vít, vào cuối tai vạ sau cuộc kiểm tra dân số, dựng bàn thờ theo lời nhà tiên tri Gát và mua sân từ chủ người Giê-bu-sít, gọi là A-rau-na trong Sa-mu-ên và Ọt-nan trong Sử ký."
    - "Bằng việc gọi đồi Đền Thờ là Mô-ri-a, sách Sử ký nối nó với xứ Mô-ri-a nơi Áp-ra-ham được sai đi dâng Y-sác, và Josephus nói thẳng rằng việc dâng tế xảy ra tại chỗ này. Đồi nhô lên phía bắc Thành Đa-vít, giữa thung lũng Xết-rôn và thung lũng giữa; Hê-rốt Đại đế bao đỉnh bằng nền lớn mà các bức tường chắn vẫn còn đứng, trong đó có Tường Phía Tây. Từ cuối thế kỷ 7, nền mang Vòm Đá, hoàn thành năm 691–692 trên mỏm đá gốc gọi là Đá Nền, và Đền thờ Hồi giáo al-Aqsa ở đầu nam."
  ro:
    - "Muntele Moria este dealul din Ierusalim pe care Solomon a zidit Templul: Solomon a început să zidească casa Domnului la Ierusalim, pe muntele Moria, unde Domnul i se arătase tatălui său David, în locul pregătit de David pe aria lui Ornan iebusitul. Este singurul loc din Biblie care numește muntele. Aria era locul unde David, la sfârșitul ciumei de după recensământul lui, a zidit un jertfelnic la cuvântul proorocului Gad și a cumpărat aria de la stăpânul ei iebusit, numit Arauna în Samuel și Ornan în Cronici."
    - "Numind dealul Templului Moria, Cronicile îl leagă de țara Moria unde Avraam a fost trimis să-l aducă jertfă pe Isaac, iar Iosif Flaviu spune limpede că jertfa a avut loc în acest loc. Dealul se înalță la nord de Cetatea lui David, între Chedron și valea centrală; Irod cel Mare i-a îngrădit vârful cu marea platformă ale cărei ziduri de sprijin încă stau, printre ele Zidul de Vest. Din sfârșitul secolului al VII-lea, platforma poartă Domul Stâncii, terminat în 691–692 peste ieșirea de rocă cunoscută ca Piatra Temeliei, și moscheea al-Aqsa la capătul ei sudic."
  bg:
    - "Мория е хълмът в Йерусалим, на който Соломон построил Храма: „И начна Соломон да гради дома Господен в Ерусалим на хълма Мория, дето се яви Господ на Давида отца му, на мястото което приготви Давид в гумното на Орна Иевусеца.“ Това е единственото място в Библията, което назовава планината. Харманът е мястото, където Давид, в края на язвата след преброяването си, издигна олтар по словото на пророк Гад и купи хармана от неговия йевусейски собственик, наречен Аравна в Царе и Орна в Летописи."
    - "Като нарича храмовия хълм Мория, Летописи го свързват със земята Мория, където Авраам бил изпратен да принесе Исаак, а Йосиф Флавий казва направо, че жертвоприношението станало на това място. Хълмът се издига на север от Давидовия град, между Кедрон и централната долина; Ирод Велики обгражда върха му с голямата платформа, чиито подпорни стени още стоят, сред тях Западната стена. От края на VII в. на платформата стоят Куполът на скалата, завършен през 691–692 г. над скалния издатък, известен като Основния камък, и джамията ал-Акса в южния ѝ край."
