body:
  en:
    - "Sepharad is named once, at the end of Obadiah's prophecy against Edom: “and the captivity of Jerusalem, which is in Sepharad, shall possess the cities of the south.” It was evidently a place where exiles from Jerusalem lived, but the text gives no clue to where it lay."
    - "The most widely accepted identification is Sardis, the capital of Lydia and later of a Persian satrapy, which Old Persian inscriptions call Sparda. A Lydian–Aramaic funerary inscription found at Sardis in 1912, dated to the tenth year of Artaxerxes, about 394 BC, writes the city's name in Aramaic with the same consonants as Obadiah's Sepharad; the map follows this. Others have proposed Saparda, a district of Media named in the annals of Sargon II. The Aramaic Targum renders Sepharad as Ispamia, Spain; by the ninth century AD the word had come to mean Spain in Jewish usage, and the Jews of Spain and their descendants are still called Sephardim."
    - "The ancient translators were no more certain. Most manuscripts of the Greek version read Ephratha, a name linked with Bethlehem, where the Hebrew has Sepharad. Jerome's Latin puts the exiles in the Bosporus, and in his commentary on Obadiah he explains that his Jewish teacher had told him the Bosporus is called Sepharad in Hebrew; he adds that any place in the kingdom of Babylon may be understood."
    - "Sardis itself had a large Jewish community in Roman times. Josephus preserves a letter of the Roman official Lucius Antonius and a decree of the city, both from the first century BC, upholding the right of the Jews of Sardis to meet in their own assembly. In 1962 excavators found their synagogue in one corner of the Roman bath-gymnasium. Its main hall, over 50 metres long, could hold nearly a thousand people, and most of its mosaics and marble fittings date from the fourth and fifth centuries AD."
  ru:
    - "Сефарад назван один раз, в конце пророчества Авдия против Едома: «а переселенные из Иерусалима, находящиеся в Сефараде, получат во владение города южные». Это, очевидно, было место, где жили изгнанники из Иерусалима, но текст не даёт никаких указаний, где оно находилось."
    - "Наиболее принятое отождествление — Сарды, столица Лидии, а затем персидской сатрапии, которую древнеперсидские надписи называют Спарда. Лидийско-арамейская надгробная надпись, найденная в Сардах в 1912 г. и датированная десятым годом Артаксеркса, около 394 г. до н. э., пишет имя города по-арамейски теми же согласными, что и Сефарад у Авдия; карта следует этому. Другие предлагали Сапарду — область Мидии, названную в анналах Саргона II. Арамейский Таргум передаёт Сефарад как Испамия, то есть Испания; к IX в. н. э. это слово в еврейском употреблении стало означать Испанию, и евреев Испании и их потомков до сих пор называют сефардами."
    - "Древние переводчики знали не больше. Большинство рукописей греческого перевода вместо Сефарада читают Ефрафа — имя, связанное с Вифлеемом. Латинский перевод Иеронима помещает пленников в Боспор, а в толковании на книгу Авдия Иероним объясняет, что его учитель-еврей сказал ему, будто Боспор по-еврейски называется Сефарад; он добавляет, что можно понимать любое место в Вавилонском царстве."
    - "В самих Сардах в римское время жила большая иудейская община. Иосиф Флавий сохранил письмо римского должностного лица Луция Антония и постановление города, оба I в. до н. э., подтверждающие право иудеев Сард иметь собственное собрание. В 1962 г. археологи нашли их синагогу в одном из углов римского комплекса бань и гимнасия. Её главный зал длиной более 50 м вмещал почти тысячу человек, а большая часть мозаик и мраморного убранства относится к IV и V вв. н. э."
  uk:
    - "Сефарад названий один раз, наприкінці пророцтва Овадії проти Едому: «переселенцї ж Ерусалимські, що жиють у Сефарадї, одержать міста полуденні». Це, очевидно, було місце, де жили вигнанці з Єрусалима, але текст не дає жодної ознаки, де воно лежало."
    - "Найпоширеніше ототожнення — Сарди, столиця Лідії, а згодом перського намісництва, які староперські написи називають Спарда. Лідійсько-арамейський надгробний напис, знайдений у Сардах 1912 р., датований десятим роком Артаксеркса, близько 394 р. до н. е., пише назву міста арамейською з тими самими приголосними, що й Сефарад Овадії; мапа йде за цим. Інші пропонували Сапарду, округ Мідії, названий в аналах Саргона II. Арамейський таргум передає Сефарад як Іспамія, Іспанія; до IX ст. н. е. це слово в єврейському вжитку стало означати Іспанію, а євреїв Іспанії та їхніх нащадків і нині називають сефардами."
    - "Давні перекладачі знали не більше. Більшість рукописів грецького перекладу замість Сефарада читає Ефрата, ім’я, пов’язане з Віфлеємом. Латинський переклад Єроніма поміщає вигнанців у Боспор, а в коментарі на Овадію Єронім пояснює, що його вчитель-юдей сказав йому, ніби Боспор єврейською називається Сефарад; він додає, що можна розуміти будь-яке місце у Вавилонському царстві."
    - "У самих Сардах у римський час жила велика юдейська громада. Йосиф Флавій зберіг лист римського урядовця Луція Антонія і постанову міста, обидва з I ст. до н. е., що підтверджують право юдеїв Сард мати власні зібрання. 1962 р. археологи знайшли їхню синагогу в одному з кутів римського комплексу лазень і гімнасія. Її головна зала завдовжки понад 50 м вміщала майже тисячу людей, а більшість мозаїк і мармурового оздоблення датується IV і V ст. н. е."
  es:
    - "Sefarad se nombra una vez, al final de la profecía de Abdías contra Edom: «y los cautivos de Jerusalem, que están en Sepharad, poseerán las ciudades del mediodía». Era evidentemente un lugar donde vivían exiliados de Jerusalén, pero el texto no da pista alguna sobre dónde estaba."
    - "La identificación más aceptada es Sardis, la capital de Lidia y más tarde de una satrapía persa, que las inscripciones en persa antiguo llaman Sparda. Una inscripción funeraria lidio-aramea hallada en Sardis en 1912, fechada en el año décimo de Artajerjes, hacia 394 a. C., escribe en arameo el nombre de la ciudad con las mismas consonantes que el Sefarad de Abdías; el mapa lo sigue. Otros han propuesto Saparda, un distrito de Media nombrado en los anales de Sargón II. El Targum arameo traduce Sefarad por Ispamia, España; hacia el siglo IX d. C. la palabra había pasado a significar España en el uso judío, y los judíos de España y sus descendientes siguen llamándose sefardíes."
    - "Los traductores antiguos no estaban más seguros. La mayoría de los manuscritos de la versión griega leen Efrata, un nombre ligado a Belén, donde el hebreo tiene Sefarad. El latín de Jerónimo sitúa a los cautivos en el Bósforo, y en su comentario a Abdías explica que su maestro judío le había dicho que el Bósforo se llama Sefarad en hebreo; añade que puede entenderse cualquier lugar del reino de Babilonia."
    - "La propia Sardis tuvo una gran comunidad judía en época romana. Josefo conserva una carta del funcionario romano Lucio Antonio y un decreto de la ciudad, ambos del siglo I a. C., que confirman el derecho de los judíos de Sardis a reunirse en su propia asamblea. En 1962 los excavadores hallaron su sinagoga en una esquina del complejo romano de baños y gimnasio. Su sala principal, de más de 50 metros de largo, podía acoger a casi mil personas, y la mayor parte de sus mosaicos y elementos de mármol datan de los siglos IV y V d. C."
  pt:
    - "Sefarade é nomeada uma vez, no final da profecia de Obadias contra Edom: “os cativos de Jerusalém, que estão em Sefarade, possuirão as cidades do Neguebe.” Era evidentemente um lugar onde viviam exilados de Jerusalém, mas o texto não dá nenhuma pista de onde ficava."
    - "A identificação mais amplamente aceita é Sardes, a capital da Lídia e depois de uma satrapia persa, que as inscrições em persa antigo chamam Sparda. Uma inscrição funerária lídio-aramaica encontrada em Sardes em 1912, datada do décimo ano de Artaxerxes, por volta de 394 a.C., escreve em aramaico o nome da cidade com as mesmas consoantes da Sefarade de Obadias; o mapa segue isso. Outros propuseram Saparda, um distrito da Média mencionado nos anais de Sargão II. O Targum aramaico traduz Sefarade por Ispamia, Espanha; no século IX d.C. a palavra já passara a significar Espanha no uso judaico, e os judeus da Espanha e seus descendentes ainda são chamados sefarditas."
    - "Os tradutores antigos não estavam mais seguros. A maioria dos manuscritos da versão grega lê Efrata, nome ligado a Belém, onde o hebraico tem Sefarade. O latim de Jerônimo coloca os exilados no Bósforo, e no seu comentário a Obadias ele explica que o seu mestre judeu lhe dissera que o Bósforo se chama Sefarade em hebraico; acrescenta que se pode entender qualquer lugar do reino da Babilônia."
    - "A própria Sardes teve uma grande comunidade judaica no período romano. Josefo preserva uma carta do funcionário romano Lúcio Antônio e um decreto da cidade, ambos do século I a.C., que confirmam o direito dos judeus de Sardes de se reunirem em assembleia própria. Em 1962 os escavadores encontraram a sua sinagoga num canto do complexo romano de banhos e ginásio. A sua sala principal, com mais de 50 metros de comprimento, comportava quase mil pessoas, e a maior parte dos seus mosaicos e peças de mármore data dos séculos IV e V d.C."
  de:
    - "Sefarad wird einmal genannt, am Ende von Obadjas Weissagung gegen Edom: „die Vertriebenen der Stadt Jerusalem, die zu Sepharad sind, werden die Städte gegen Mittag besitzen“. Es war offenbar ein Ort, an dem Verbannte aus Jerusalem lebten, aber der Text gibt keinen Hinweis, wo es lag."
    - "Die am weitesten verbreitete Gleichsetzung ist Sardes, die Hauptstadt Lydiens und später einer persischen Satrapie, die altpersische Inschriften Sparda nennen. Eine lydisch-aramäische Grabinschrift, 1912 in Sardes gefunden und auf das zehnte Jahr des Artaxerxes datiert, etwa 394 v. Chr., schreibt den Namen der Stadt aramäisch mit denselben Konsonanten wie Obadjas Sefarad; die Karte folgt dem. Andere haben Saparda vorgeschlagen, einen Bezirk Mediens, der in den Annalen Sargons II. genannt wird. Der aramäische Targum gibt Sefarad mit Ispamia wieder, Spanien; im neunten Jahrhundert n. Chr. war das Wort im jüdischen Sprachgebrauch zu Spanien geworden, und die Juden Spaniens und ihre Nachkommen heißen noch heute Sefarden."
    - "Die alten Übersetzer waren nicht sicherer. Die meisten Handschriften der griechischen Übersetzung lesen Ephrata, einen mit Bethlehem verbundenen Namen, wo der hebräische Text Sefarad hat. Die lateinische Übersetzung des Hieronymus versetzt die Verbannten an den Bosporus, und in seinem Kommentar zu Obadja erklärt er, sein jüdischer Lehrer habe ihm gesagt, der Bosporus heiße auf Hebräisch Sefarad; er fügt hinzu, man könne jeden beliebigen Ort im Reich Babylon verstehen."
    - "Sardes selbst hatte in römischer Zeit eine große jüdische Gemeinde. Josephus überliefert einen Brief des römischen Beamten Lucius Antonius und einen Beschluss der Stadt, beide aus dem 1. Jahrhundert v. Chr., die das Recht der Juden von Sardes bestätigen, sich in ihrer eigenen Versammlung zu treffen. 1962 fanden Ausgräber ihre Synagoge in einer Ecke des römischen Bad-Gymnasium-Komplexes. Ihr Hauptsaal, über 50 Meter lang, fasste fast tausend Menschen, und die meisten Mosaiken und Marmorausstattungen stammen aus dem 4. und 5. Jahrhundert n. Chr."
  it:
    - "Sefarad è nominata una sola volta, alla fine della profezia di Abdia contro Edom: «e i deportati di Gerusalemme che sono a Sefarad, possederanno le città del mezzogiorno». Era evidentemente un luogo in cui vivevano esuli di Gerusalemme, ma il testo non dà alcun indizio su dove si trovasse."
    - "L’identificazione più largamente accettata è Sardi, capitale della Lidia e più tardi di una satrapia persiana, che le iscrizioni in antico persiano chiamano Sparda. Un’iscrizione funeraria lidio-aramaica trovata a Sardi nel 1912, datata al decimo anno di Artaserse, circa il 394 a.C., scrive il nome della città in aramaico con le stesse consonanti della Sefarad di Abdia; la carta segue questa ipotesi. Altri hanno proposto Saparda, un distretto della Media nominato negli annali di Sargon II. Il Targum aramaico rende Sefarad con Ispamia, la Spagna; entro il IX secolo d.C. la parola era giunta a significare Spagna nell’uso ebraico, e gli ebrei di Spagna e i loro discendenti sono ancora chiamati sefarditi."
    - "Gli antichi traduttori non erano più sicuri. La maggior parte dei manoscritti della versione greca legge Efrata, un nome legato a Betlemme, dove l’ebraico ha Sefarad. Il latino di Girolamo colloca gli esuli nel Bosforo, e nel suo commento ad Abdia egli spiega che il suo maestro ebreo gli aveva detto che il Bosforo si chiama Sefarad in ebraico; aggiunge che si può intendere qualunque luogo del regno di Babilonia."
    - "La stessa Sardi ebbe in epoca romana una grande comunità ebraica. Giuseppe Flavio conserva una lettera del funzionario romano Lucio Antonio e un decreto della città, entrambi del I secolo a.C., che confermano il diritto degli ebrei di Sardi di riunirsi in una propria assemblea. Nel 1962 gli archeologi trovarono la loro sinagoga in un angolo del complesso romano delle terme e del ginnasio. La sua sala principale, lunga oltre 50 metri, poteva accogliere quasi mille persone, e la maggior parte dei mosaici e degli arredi di marmo risale al IV e V secolo d.C."
  fr:
    - "Sepharad n’est nommé qu’une fois, à la fin de la prophétie d’Abdias contre Édom : « les captifs de Jérusalem qui sont à Sepharad posséderont les villes du midi ». C’était manifestement un lieu où vivaient des exilés de Jérusalem, mais le texte ne donne aucun indice sur son emplacement."
    - "L’identification la plus largement admise est Sardes, capitale de la Lydie puis d’une satrapie perse, que les inscriptions en vieux perse appellent Sparda. Une inscription funéraire lydo-araméenne trouvée à Sardes en 1912, datée de la dixième année d’Artaxerxès, vers 394 av. J.-C., écrit le nom de la ville en araméen avec les mêmes consonnes que le Sepharad d’Abdias ; la carte suit cet avis. D’autres ont proposé Saparda, district de Médie nommé dans les annales de Sargon II. Le Targum araméen rend Sepharad par Ispamia, l’Espagne ; dès le IXe siècle apr. J.-C., le mot en était venu à désigner l’Espagne dans l’usage juif, et les Juifs d’Espagne et leurs descendants s’appellent encore séfarades."
    - "Les traducteurs anciens n’étaient pas plus sûrs. La plupart des manuscrits de la version grecque lisent Éphrata, nom lié à Bethléem, là où l’hébreu a Sepharad. Le latin de Jérôme place les exilés dans le Bosphore, et dans son commentaire sur Abdias il explique que son maître juif lui avait dit que le Bosphore s’appelle Sepharad en hébreu ; il ajoute qu’on peut entendre n’importe quel lieu du royaume de Babylone."
    - "Sardes elle-même eut à l’époque romaine une importante communauté juive. Josèphe conserve une lettre du fonctionnaire romain Lucius Antonius et un décret de la cité, tous deux du Ier siècle av. J.-C., qui confirment le droit des Juifs de Sardes de se réunir en leur propre assemblée. En 1962, les fouilleurs trouvèrent leur synagogue dans un angle du complexe romain des thermes et du gymnase. Sa salle principale, longue de plus de 50 mètres, pouvait accueillir près d’un millier de personnes, et la plupart de ses mosaïques et de ses aménagements de marbre datent des IVe et Ve siècles apr. J.-C."
  nl:
    - "Sefarad wordt eenmaal genoemd, aan het einde van Obadja's profetie tegen Edom: “en de gevankelijk weggevoerden van Jeruzalem, hetgeen in Sefarad is, zij zullen de steden van het zuiden erfelijk bezitten.” Het was kennelijk een plaats waar ballingen uit Jeruzalem woonden, maar de tekst geeft geen aanwijzing waar het lag."
    - "De meest aanvaarde identificatie is Sardes, de hoofdstad van Lydië en later van een Perzische satrapie, die Oudperzische inscripties Sparda noemen. Een Lydisch-Aramees grafschrift, in 1912 te Sardes gevonden en gedateerd in het tiende jaar van Artaxerxes, omstreeks 394 v.Chr., schrijft de naam van de stad in het Aramees met dezelfde medeklinkers als Obadja's Sefarad; de kaart volgt dit. Anderen hebben Saparda voorgesteld, een district van Medië dat in de annalen van Sargon II wordt genoemd. De Aramese Targum geeft Sefarad weer als Ispamia, Spanje; in de negende eeuw n.Chr. was het woord in Joods gebruik Spanje gaan betekenen, en de Joden van Spanje en hun nakomelingen heten nog steeds sefardim."
    - "De oude vertalers wisten het evenmin. De meeste handschriften van de Griekse vertaling lezen Efratha, een naam die met Bethlehem verbonden is, waar het Hebreeuws Sefarad heeft. Het Latijn van Hiëronymus plaatst de ballingen in de Bosporus, en in zijn commentaar op Obadja legt hij uit dat zijn joodse leraar hem had verteld dat de Bosporus in het Hebreeuws Sefarad heet; hij voegt eraan toe dat men elke plaats in het rijk van Babylon kan verstaan."
    - "Sardes zelf had in de Romeinse tijd een grote joodse gemeenschap. Josephus bewaart een brief van de Romeinse functionaris Lucius Antonius en een besluit van de stad, beide uit de 1e eeuw v.Chr., die het recht van de joden van Sardes bevestigen om in hun eigen vergadering bijeen te komen. In 1962 vonden opgravers hun synagoge in een hoek van het Romeinse bad- en gymnasiumcomplex. De grote zaal, ruim 50 meter lang, bood plaats aan bijna duizend mensen, en de meeste mozaïeken en marmeren inrichting dateren uit de 4e en 5e eeuw n.Chr."
  cs:
    - "Sefarad je jmenováno jednou, na konci Obadjášova proroctví proti Edómu: zajatí Jeruzalémští, kteří jsou v Sefaradu, obdrží do dědictví města na jihu. Bylo to zřejmě místo, kde žili vyhnanci z Jeruzaléma, ale text nedává žádnou stopu, kde leželo."
    - "Nejpřijímanější ztotožnění je se Sardami, hlavním městem Lýdie a později perské satrapie, které staroperské nápisy nazývají Sparda. Lýdsko-aramejský pohřební nápis nalezený v Sardách roku 1912, datovaný do desátého roku Artaxerxova, asi 394 př. n. l., píše jméno města aramejsky týmiž souhláskami jako Obadjášovo Sefarad; mapa tento názor sleduje. Jiní navrhli Sapardu, okres Médie jmenovaný v análech Sargona II. Aramejský targum překládá Sefarad jako Ispamia, Španělsko; do devátého století n. l. začalo slovo v židovském úzu znamenat Španělsko a španělští Židé a jejich potomci se dosud nazývají sefardové."
    - "Starověcí překladatelé si nebyli jistější. Většina rukopisů řeckého překladu čte místo Sefaradu Efrata, jméno spojené s Betlémem. Jeronýmův latinský překlad umisťuje vyhnance do Bosporu a ve svém komentáři k Obadjášovi Jeroným vysvětluje, že mu jeho židovský učitel řekl, že Bospor se hebrejsky nazývá Sefarad; dodává, že lze rozumět jakékoli místo v Babylonské říši."
    - "Samotné Sardy měly v římské době velkou židovskou obec. Josephus uchoval dopis římského úředníka Lucia Antonia a usnesení města, obojí z 1. století př. n. l., které potvrzují právo sardských Židů scházet se ve vlastním shromáždění. Roku 1962 archeologové nalezli jejich synagogu v jednom rohu římského komplexu lázní a gymnasia. Její hlavní sál, dlouhý přes 50 metrů, pojal téměř tisíc lidí a většina mozaik a mramorové výzdoby pochází ze 4. a 5. století n. l."
  pl:
    - "Sefarad jest wymienione raz, na końcu proroctwa Abdiasza przeciw Edomowi: według Biblii Króla Jakuba pojmani z Jerozolimy, którzy są w Sefarad, posiądą miasta południa. Było to oczywiście miejsce, gdzie mieszkali wygnańcy z Jerozolimy, lecz tekst nie daje wskazówki, gdzie leżało."
    - "Najpowszechniej przyjmowane utożsamienie to Sardes, stolica Lidii, a później perskiej satrapii, które staroperskie inskrypcje nazywają Sparda. Lidyjsko-aramejski napis nagrobny znaleziony w Sardes w 1912 roku, datowany na dziesiąty rok Artakserksesa, około 394 p.n.e., zapisuje nazwę miasta po aramejsku tymi samymi spółgłoskami co Sefarad Abdiasza; mapa idzie za tym. Inni proponowali Saparda, okręg Medii wymieniony w annałach Sargona II. Targum aramejski oddaje Sefarad jako Ispamia, Hiszpania; do IX wieku n.e. słowo to oznaczało w użyciu żydowskim Hiszpanię, a Żydów hiszpańskich i ich potomków nadal nazywa się Sefardyjczykami."
    - "Starożytni tłumacze nie byli pewniejsi. Większość rękopisów przekładu greckiego czyta w miejscu Sefarad Efrata, nazwę związaną z Betlejem. Łaciński przekład Hieronima umieszcza wygnańców w Bosforze, a w komentarzu do Księgi Abdiasza Hieronim wyjaśnia, że jego żydowski nauczyciel powiedział mu, iż Bosfor nazywa się po hebrajsku Sefarad; dodaje, że można rozumieć dowolne miejsce w królestwie babilońskim."
    - "W samym Sardes w czasach rzymskich żyła duża gmina żydowska. Józef Flawiusz przechowuje list rzymskiego urzędnika Lucjusza Antoniusza i uchwałę miasta, oba z I wieku p.n.e., potwierdzające prawo Żydów z Sardes do zbierania się na własnym zgromadzeniu. W 1962 roku archeolodzy odnaleźli ich synagogę w jednym z narożników rzymskiego kompleksu łaźni i gimnazjonu. Jej główna sala, długa na ponad 50 metrów, mieściła blisko tysiąc osób, a większość mozaik i marmurowego wystroju pochodzi z IV i V wieku n.e."
  sv:
    - "Sefarad nämns en gång, i slutet av Obadjas profetia mot Edom: ”de bortförda från Jerusalem, de som leva i Sefarad, dessa skola taga Sydlandets städer i besittning.” Det var uppenbarligen en plats där landsflyktiga från Jerusalem bodde, men texten ger ingen ledtråd om var den låg."
    - "Den mest allmänt godtagna identifikationen är Sardes, huvudstad i Lydien och senare i en persisk satrapi, som gammalpersiska inskriptioner kallar Sparda. En lydisk-arameisk gravinskrift som hittades i Sardes 1912, daterad till Artaxerxes tionde år, omkring 394 f.Kr., skriver stadens namn på arameiska med samma konsonanter som Obadjas Sefarad; kartan följer detta. Andra har föreslagit Saparda, ett distrikt i Medien som nämns i Sargon II:s annaler. Det arameiska Targum återger Sefarad som Ispamia, Spanien; redan på 800-talet e.Kr. hade ordet kommit att betyda Spanien i judiskt bruk, och Spaniens judar och deras ättlingar kallas ännu sefarder."
    - "De forntida översättarna var inte säkrare. De flesta handskrifter av den grekiska översättningen läser Efrata, ett namn som förknippas med Betlehem, där hebreiskan har Sefarad. Hieronymus latinska översättning placerar de landsflyktiga i Bosporen, och i sin kommentar till Obadja förklarar han att hans judiske lärare hade sagt honom att Bosporen på hebreiska kallas Sefarad; han tillägger att man kan förstå vilken plats som helst i det babyloniska riket."
    - "I Sardes fanns under romersk tid en stor judisk gemenskap. Josefus återger ett brev från den romerske ämbetsmannen Lucius Antonius och ett beslut av staden, båda från första århundradet f.Kr., som bekräftar rätten för judarna i Sardes att samlas i sin egen församling. År 1962 fann arkeologer deras synagoga i ett hörn av det romerska bad- och gymnasiekomplexet. Dess huvudsal, över 50 meter lång, rymde nästan tusen människor, och de flesta mosaiker och marmorinredningar är från 300- och 400-talen e.Kr."
  nb:
    - "Sefarad er nevnt én gang, på slutten av Obadjas profeti mot Edom: «og de bortførte fra Jerusalem som er i Sefarad, skal ta sydlandets byer i eie.» Det var åpenbart et sted der landflyktige fra Jerusalem bodde, men teksten gir ingen anvisning på hvor det lå."
    - "Den mest utbredte identifikasjonen er Sardes, hovedstaden i Lydia og senere i et persisk satrapi, som gammelpersiske inskripsjoner kaller Sparda. En lydisk-arameisk gravinskripsjon funnet i Sardes i 1912, datert til Artaxerxes' tiende år, omkring 394 f.Kr., skriver byens navn på arameisk med de samme konsonantene som Obadjas Sefarad; kartet følger dette. Andre har foreslått Saparda, et distrikt i Media nevnt i Sargon II's annaler. Den arameiske targumen gjengir Sefarad som Ispamia, Spania; på 800-tallet e.Kr. var ordet kommet til å bety Spania i jødisk bruk, og jødene i Spania og deres etterkommere kalles fortsatt sefardene."
    - "De gamle oversetterne var ikke sikrere. De fleste håndskriftene av den greske oversettelsen leser Efrata, et navn knyttet til Betlehem, der hebraisk har Sefarad. Hieronymus’ latinske oversettelse plasserer de bortførte i Bosporos, og i sin kommentar til Obadja forklarer han at hans jødiske lærer hadde fortalt ham at Bosporos på hebraisk heter Sefarad; han legger til at man kan forstå hvilket som helst sted i det babylonske riket."
    - "Sardes hadde selv et stort jødisk samfunn i romersk tid. Josefus gjengir et brev fra den romerske embetsmannen Lucius Antonius og et vedtak fra byen, begge fra første århundre f.Kr., som stadfester retten for jødene i Sardes til å møtes i sin egen forsamling. I 1962 fant arkeologer synagogen deres i et hjørne av det romerske bad- og gymnasionkomplekset. Hovedsalen, over 50 meter lang, rommet nesten tusen mennesker, og de fleste mosaikkene og marmorinnredningen er fra 300- og 400-tallet e.Kr."
  tl:
    - "Ang Sepharad ay isang beses lamang pinangalanan, sa wakas ng hula ni Obadias laban sa Edom: “ang mga bihag sa Jerusalem na nasa Sepharad ay magaari ng mga bayan ng Timugan.” Malinaw na lugar ito kung saan nanirahan ang mga tapon mula sa Jerusalem, ngunit walang palatandaan ang teksto kung nasaan ito."
    - "Ang pinakamalawak na tinatanggap na pagkilala ay ang Sardis, ang kabisera ng Lidia at kalaunan ng isang satrapiyang Persiyano, na tinatawag ng mga inskripsiyong Lumang Persa na Sparda. Isang inskripsiyong libing na Lidio-Arameo na natagpuan sa Sardis noong 1912, na may petsang ika-10 taon ni Artajerjes, bandang 394 BK, ay nagsusulat ng pangalan ng lungsod sa Arameo na may parehong katinig ng Sepharad ni Obadias; sinusunod ito ng mapa. Iminungkahi ng iba ang Saparda, isang distrito ng Media na pinangalanan sa mga talaan ni Sargon II. Isinasalin ng Targum na Arameo ang Sepharad bilang Ispamia, Espanya; pagsapit ng ika-9 na siglo AD, ang salita ay nangangahulugan nang Espanya sa gamit ng mga Judio, at ang mga Judio ng Espanya at ang kanilang mga inapo ay tinatawag pa ring Sephardim."
    - "Hindi rin tiyak ang mga sinaunang tagasalin. Karamihan sa mga manuskrito ng saling Griyego ay bumabasa ng Ephrata, isang pangalang kaugnay ng Bethlehem, kung saan Sepharad ang nasa Hebreo. Inilalagay ng saling Latin ni Jeronimo ang mga bihag sa Bosforo, at sa kaniyang komentaryo sa Obadias ay ipinaliwanag niya na sinabi sa kaniya ng kaniyang gurong Judio na ang Bosforo ay tinatawag na Sepharad sa Hebreo; idinagdag niya na maaaring unawain ang alinmang lugar sa kaharian ng Babilonia."
    - "Ang Sardis mismo ay may malaking pamayanang Judio noong panahon ng Roma. Iniingatan ni Josefo ang isang liham ng Romanong opisyal na si Lucio Antonio at isang kapasiyahan ng lungsod, kapuwa mula sa unang siglo BK, na nagpapatibay sa karapatan ng mga Judio ng Sardis na magtipon sa sarili nilang kapulungan. Noong 1962 natagpuan ng mga arkeologo ang kanilang sinagoga sa isang sulok ng Romanong gusali ng paliguan at gymnasium. Ang pangunahing bulwagan nito, na mahigit 50 metro ang haba, ay kayang maglaman ng halos isang libong tao, at ang karamihan sa mga mosaiko at palamuting marmol nito ay mula sa ika-4 at ika-5 siglo AD."
  da:
    - "Sefarad nævnes én gang, ved slutningen af Obadjas profeti mod Edom: »de bortførte af Jerusalem, som ere i Sefarad, de skulle eje Stæderne i Sydlandet.« Det var åbenbart et sted, hvor landflygtige fra Jerusalem boede, men teksten giver ingen anvisning på, hvor det lå."
    - "Den mest udbredte identifikation er Sardes, Lydiens hovedstad og senere en persisk satrapi, som oldpersiske indskrifter kalder Sparda. En lydisk-aramæisk gravindskrift fundet i Sardes i 1912, dateret til Artaxerxes' tiende år, omkring 394 f.Kr., skriver byens navn på aramæisk med de samme konsonanter som Obadjas Sefarad; kortet følger dette. Andre har foreslået Saparda, et distrikt i Medien nævnt i Sargon 2.'s annaler. Det aramæiske targum gengiver Sefarad som Ispamia, Spanien; i 800-tallet e.Kr. var ordet i jødisk sprogbrug kommet til at betyde Spanien, og Spaniens jøder og deres efterkommere kaldes stadig sefardimer."
    - "De gamle oversættere var ikke sikrere. De fleste håndskrifter af den græske oversættelse læser Efrata, et navn knyttet til Betlehem, hvor hebraisk har Sefarad. Hieronymus’ latinske oversættelse anbringer de bortførte i Bosporus, og i sin kommentar til Obadja forklarer han, at hans jødiske lærer havde fortalt ham, at Bosporus på hebraisk hedder Sefarad; han tilføjer, at man kan forstå et hvilket som helst sted i det babyloniske rige."
    - "Sardes havde selv et stort jødisk samfund i romersk tid. Josefus gengiver et brev fra den romerske embedsmand Lucius Antonius og en beslutning fra byen, begge fra 1. århundrede f.Kr., som stadfæster retten for jøderne i Sardes til at mødes i deres egen forsamling. I 1962 fandt arkæologer deres synagoge i et hjørne af det romerske bade- og gymnasionkompleks. Hovedsalen, over 50 meter lang, kunne rumme næsten tusind mennesker, og de fleste mosaikker og marmorudsmykninger stammer fra 300- og 400-tallet e.Kr."
  sr:
    - "Сефарад се помиње једном, на крају Овадијиног пророштва против Едома: „а робље јерусалимско, што је у Сефараду, наследиће јужне градове“. То је очигледно било место где су живели изгнаници из Јерусалима, али текст не даје трага где је лежало."
    - "Најшире прихваћено поистовећење је Сард, престоница Лидије и касније персијске сатрапије, који староперсијски натписи зову Спарда. Лидијско-арамејски погребни натпис нађен у Сарду 1912, датиран у десету годину Артаксеркса, око 394. п. н. е., пише име града на арамејском истим сугласницима као Овадијин Сефарад; карта то следи. Други су предложили Сапарду, област Мидије поменуту у аналима Саргона II. Арамејски Таргум преводи Сефарад као Испамија, Шпанија; до 9. века н. е. реч је у јеврејској употреби почела да значи Шпанију, а шпански Јевреји и њихови потомци и данас се зову Сефарди."
    - "Ни древни преводиоци нису знали више. Већина рукописа грчког превода уместо Сефарада чита Ефрата, име повезано с Витлејемом. Јеронимов латински превод смешта изгнанике у Босфор, а у свом коментару на Овадију Јероним објашњава да му је његов учитељ Јеврејин рекао да се Босфор на хебрејском зове Сефарад; додаје да се може разумети било које место у Вавилонском царству."
    - "У самом Сарду у римско доба живела је велика јеврејска заједница. Јосиф Флавије чува писмо римског службеника Луција Антонија и одлуку града, обоје из I века п. н. е., који потврђују право Јевреја из Сарда да се окупљају у сопственој скупштини. Археолози су 1962. пронашли њихову синагогу у једном углу римског комплекса купатила и гимназије. Њена главна сала, дуга више од 50 метара, примала је скоро хиљаду људи, а већина мозаика и мермерне опреме потиче из IV и V века н. е."
  hu:
    - "Széfárád egyszer szerepel, Abdiás Edom elleni jövendölésének végén: „a jeruzsálemi száműzöttek pedig, a kik Szefarádban vannak, elfoglalják majd a déli városokat.” Nyilván olyan hely volt, ahol Jeruzsálem száműzöttei éltek, de a szöveg nem ad támpontot arra, hol feküdt."
    - "A legelterjedtebb azonosítás Szárdisz, Lüdia fővárosa és később perzsa satrapia központja, amelyet óperzsa feliratok Spardának neveznek. Egy 1912-ben Szárdiszban talált lüd–arám sírfelirat, amely Artaxerxész tizedik évére, vagyis Kr. e. 394 tájára datált, a város nevét arámul ugyanazokkal a mássalhangzókkal írja, mint Abdiás Széfárádját; a térkép ezt követi. Mások Szapardát javasolták, Média egy kerületét, amelyet II. Szargon évkönyvei neveznek meg. Az arám Targum Széfárádot Ispamiaként, Hispániaként adja vissza; a Kr. u. 9. századra a szó a zsidó nyelvhasználatban Hispániát jelentette, és Hispánia zsidóit és leszármazottaikat ma is szefárdoknak nevezik."
    - "Az ókori fordítók sem voltak biztosabbak. A görög fordítás kéziratainak többsége Széfárád helyén Efrátát olvas, amely név Betlehemhez kapcsolódik. Jeromos latin fordítása a Boszporuszba helyezi a száműzötteket, Abdiás könyvéhez írt kommentárjában pedig elmagyarázza, hogy zsidó tanítója szerint a Boszporusz héberül Széfárád; hozzáteszi, hogy a babiloni birodalom bármely helyét érthetjük rajta."
    - "Magában Szárdiszban a római korban nagy zsidó közösség élt. Josephus megőrizte Lucius Antonius római tisztviselő levelét és a város határozatát, mindkettő a Kr. e. 1. századból való, amelyek megerősítik a szárdiszi zsidók jogát, hogy saját gyülekezetükben jöjjenek össze. 1962-ben a régészek megtalálták zsinagógájukat a római fürdő- és gimnáziumegyüttes egyik sarkában. Több mint 50 méter hosszú főtermébe közel ezer ember fért be, mozaikjai és márványberendezése pedig nagyrészt a Kr. u. 4. és 5. századból valók."
  fi:
    - "Sefarad mainitaan kerran, Obadjan Edomia koskevan ennustuksen lopussa: ”Ja Jerusalemin pakkosiirtolaiset, jotka ovat Sefaradissa, ottavat perinnöksensä Etelämaan kaupungit.” Se oli ilmeisesti paikka, jossa Jerusalemin pakkosiirtolaiset asuivat, mutta teksti ei anna vihjettä sen sijainnista."
    - "Laajimmin hyväksytty tunnistus on Sardes, Lyydian ja myöhemmin Persian satraapian pääkaupunki, jota muinaispersialaiset kirjoitukset kutsuvat nimellä Sparda. Sardeksesta vuonna 1912 löydetty lyydialais-aramealainen hautakirjoitus, ajoitettu Artahsastan kymmenenteen vuoteen, noin 394 eaa., kirjoittaa kaupungin nimen arameaksi samoilla konsonanteilla kuin Obadjan Sefarad; kartta seuraa tätä. Toiset ovat ehdottaneet Saparda-nimistä Meedian piirikuntaa, joka mainitaan Sargon II:n annaaleissa. Aramealainen targum kääntää Sefaradin Ispamiaksi, Espanjaksi; 800-luvulle jaa. mennessä sana oli tullut juutalaisessa käytössä tarkoittamaan Espanjaa, ja Espanjan juutalaisia ja heidän jälkeläisiään kutsutaan yhä sefardeiksi."
    - "Muinaiset kääntäjät eivät olleet sen varmempia. Useimmat kreikkalaisen käännöksen käsikirjoitukset lukevat Sefaradin kohdalla Efrata, Betlehemiin liitetty nimi. Hieronymuksen latinankielinen käännös sijoittaa pakkosiirtolaiset Bosporiin, ja Obadjan kirjan kommentaarissaan hän selittää juutalaisen opettajansa kertoneen hänelle, että Bosporia kutsutaan hepreaksi Sefaradiksi; hän lisää, että sillä voidaan ymmärtää mitä tahansa paikkaa Babylonian valtakunnassa."
    - "Itse Sardeksessa oli roomalaisaikana suuri juutalainen yhteisö. Josefus säilyttää roomalaisen virkamiehen Lucius Antoniuksen kirjeen ja kaupungin päätöksen, kumpikin ensimmäiseltä vuosisadalta eaa., jotka vahvistavat Sardeksen juutalaisten oikeuden kokoontua omaan kokoukseensa. Vuonna 1962 kaivajat löysivät heidän synagogansa roomalaisen kylpylä- ja gymnasionkompleksin yhdestä kulmasta. Sen yli 50 metriä pitkään pääsaliin mahtui lähes tuhat ihmistä, ja suurin osa sen mosaiikeista ja marmorikalusteista on 300- ja 400-luvuilta jaa."
  vi:
    - "Sê-pha-rát được nêu một lần, ở cuối lời tiên tri của Áp-đia nghịch cùng Ê-đôm: “Những phu tù của Giê-ru-sa-lem ở tại Sê-pha-rát sẽ được các thành phương nam.” Rõ ràng đó là nơi những người lưu đày từ Giê-ru-sa-lem sống, nhưng bản văn không cho manh mối nào về vị trí."
    - "Sự đồng nhất được chấp nhận rộng rãi nhất là Sạt-đe, thủ đô của Ly-đi và về sau của một tổng trấn Ba Tư, mà các bia ký Ba Tư cổ gọi là Sparda. Một bia ký mộ tiếng Ly-đi–Aram tìm thấy ở Sạt-đe năm 1912, định niên đại vào năm thứ mười của Ạt-ta-xét-xe, khoảng năm 394 TCN, viết tên thành bằng tiếng Aram với cùng các phụ âm như Sê-pha-rát của Áp-đia; bản đồ theo đó. Những người khác đã đề xuất Saparda, một quận của Mê-đi được nêu trong biên niên sử của Sargon II. Targum tiếng Aram dịch Sê-pha-rát là Ispamia, Tây Ban Nha; đến thế kỷ 9, từ này trong cách dùng của người Do Thái đã có nghĩa là Tây Ban Nha, và người Do Thái ở Tây Ban Nha cùng hậu duệ của họ vẫn được gọi là Sephardim."
    - "Các dịch giả xưa cũng không chắc chắn hơn. Phần lớn các bản chép tay của bản dịch Hy Lạp đọc là Ép-ra-ta, một tên gắn với Bết-lê-hem, ở chỗ bản Hê-bơ-rơ ghi Sê-pha-rát. Bản dịch La-tinh của Jerome đặt những người lưu đày ở eo Bosphorus, và trong sách chú giải Áp-đia, ông giải thích rằng thầy dạy người Do Thái của ông đã nói với ông rằng trong tiếng Hê-bơ-rơ eo Bosphorus được gọi là Sê-pha-rát; ông nói thêm rằng có thể hiểu là bất kỳ nơi nào trong vương quốc Ba-by-lôn."
    - "Chính Sạt-đe có một cộng đồng Do Thái lớn vào thời La Mã. Josephus lưu giữ một bức thư của viên chức La Mã Lucius Antonius và một nghị quyết của thành, cả hai đều từ thế kỷ 1 TCN, xác nhận quyền của người Do Thái ở Sạt-đe được nhóm họp trong hội đồng riêng của họ. Năm 1962, các nhà khảo cổ tìm thấy hội đường của họ ở một góc của khu nhà tắm và nhà thể dục La Mã. Gian chính của hội đường dài hơn 50 mét, chứa được gần một nghìn người, và phần lớn tranh khảm cùng đồ trang trí bằng đá cẩm thạch có niên đại từ thế kỷ 4 và 5 SCN."
  ro:
    - "Sefarad este numit o singură dată, la sfârșitul profeției lui Obadia împotriva Edomului: exilații Ierusalimului, care sunt în Sefarad, vor stăpâni cetățile din sud. Era evident un loc unde trăiau exilați din Ierusalim, dar textul nu dă niciun indiciu unde se afla."
    - "Identificarea cea mai larg acceptată este Sardes, capitala Lidiei și mai târziu a unei satrapii persane, pe care inscripțiile în persana veche o numesc Sparda. O inscripție funerară lidiano-aramaică găsită la Sardes în 1912, datată în al zecelea an al lui Artaxerxe, în jurul anului 394 î.Hr., scrie în aramaică numele orașului cu aceleași consoane ca Sefaradul lui Obadia; harta urmează această opinie. Alții au propus Saparda, un district al Mediei numit în analele lui Sargon al II-lea. Targumul aramaic redă Sefarad ca Ispamia, Spania; până în secolul al IX-lea d.Hr., cuvântul ajunsese să însemne Spania în uzul evreiesc, iar evreii din Spania și descendenții lor sunt numiți și acum sefarzi."
    - "Traducătorii antici nu erau mai siguri. Cele mai multe manuscrise ale versiunii grecești citesc Efrata, un nume legat de Betleem, acolo unde ebraica are Sefarad. Latina lui Ieronim îi așază pe exilați în Bosfor, iar în comentariul său la Obadia el explică faptul că învățătorul său evreu îi spusese că Bosforul se numește în ebraică Sefarad; adaugă că se poate înțelege orice loc din regatul Babilonului."
    - "În Sardes a existat în epoca romană o mare comunitate evreiască. Iosif Flaviu păstrează o scrisoare a funcționarului roman Lucius Antonius și un decret al orașului, ambele din secolul I î.Hr., care confirmă dreptul evreilor din Sardes de a se întruni în propria adunare. În 1962 arheologii au găsit sinagoga lor într-un colț al complexului roman de băi și gimnaziu. Sala ei principală, lungă de peste 50 de metri, putea primi aproape o mie de oameni, iar cele mai multe mozaicuri și piese de marmură datează din secolele IV și V d.Hr."
  bg:
    - "Сефарад е назован веднъж, в края на пророчеството на Овадия против Едом: „И запленените Ерусалимски които са в Сефарад Ще наследят южните градове“. Очевидно това е било място, където живеели изгнаници от Йерусалим, но текстът не дава указание къде се е намирало."
    - "Най-широко приетото отъждествяване е със Сарди, столицата на Лидия, а по-късно на персийска сатрапия, която староперсийските надписи наричат Спарда. Лидийско-арамейски надгробен надпис, намерен в Сарди през 1912 г. и датиран в десетата година на Артаксеркс, около 394 г. пр.н.е., изписва името на града на арамейски със същите съгласни като Сефарад у Овадия; картата следва това. Други предлагат Сапарда, област в Мидия, назована в аналите на Саргон II. Арамейският Таргум предава Сефарад като Испамия, Испания; към IX в. н.е. в еврейската употреба думата вече означавала Испания, а евреите от Испания и техните потомци и днес се наричат сефаради."
    - "Древните преводачи не са знаели повече. Повечето ръкописи на гръцкия превод четат вместо Сефарад Ефрата, име, свързано с Витлеем. Латинският превод на Йероним поставя изгнаниците в Босфора, а в тълкуванието си на Овадия Йероним обяснява, че неговият учител юдеин му казал, че Босфорът на еврейски се нарича Сефарад; той добавя, че може да се разбира всяко място във Вавилонското царство."
    - "В самите Сарди през римската епоха живеела голяма юдейска общност. Йосиф Флавий запазва писмо на римския служител Луций Антоний и решение на града, и двете от I в. пр.н.е., които потвърждават правото на юдеите от Сарди да се събират в собствено събрание. През 1962 г. археолози откриват тяхната синагога в един от ъглите на римския комплекс от бани и гимназион. Главната ѝ зала, дълга над 50 метра, побирала почти хиляда души, а повечето от мозайките и мраморната украса датират от IV и V в. н.е."
