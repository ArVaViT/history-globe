body:
  en:
    - "Sepharad is named once, at the end of Obadiah's prophecy against Edom: “and the captivity of Jerusalem, which is in Sepharad, shall possess the cities of the south.” It was evidently a place where exiles from Jerusalem lived, but the text gives no clue to where it lay."
    - "The most widely accepted identification is Sardis, the capital of Lydia and later of a Persian satrapy, which Old Persian inscriptions call Sparda. A Lydian–Aramaic funerary inscription found at Sardis in 1912, dated to the tenth year of Artaxerxes, about 394 BC, writes the city's name in Aramaic with the same consonants as Obadiah's Sepharad; the map follows this. Others have proposed Saparda, a district of Media named in the annals of Sargon II. The Aramaic Targum renders Sepharad as Ispamia, Spain; by the ninth century AD the word had come to mean Spain in Jewish usage, and the Jews of Spain and their descendants are still called Sephardim."
  ru:
    - "Сефарад назван один раз, в конце пророчества Авдия против Едома: «а переселенные из Иерусалима, находящиеся в Сефараде, получат во владение города южные». Это, очевидно, было место, где жили изгнанники из Иерусалима, но текст не даёт никаких указаний, где оно находилось."
    - "Наиболее принятое отождествление — Сарды, столица Лидии, а затем персидской сатрапии, которую древнеперсидские надписи называют Спарда. Лидийско-арамейская надгробная надпись, найденная в Сардах в 1912 г. и датированная десятым годом Артаксеркса, около 394 г. до н. э., пишет имя города по-арамейски теми же согласными, что и Сефарад у Авдия; карта следует этому. Другие предлагали Сапарду — область Мидии, названную в анналах Саргона II. Арамейский Таргум передаёт Сефарад как Испамия, то есть Испания; к IX в. н. э. это слово в еврейском употреблении стало означать Испанию, и евреев Испании и их потомков до сих пор называют сефардами."
  uk:
    - "Сефарад названий один раз, наприкінці пророцтва Овадії проти Едому: «переселенцї ж Ерусалимські, що жиють у Сефарадї, одержать міста полуденні». Це, очевидно, було місце, де жили вигнанці з Єрусалима, але текст не дає жодної ознаки, де воно лежало."
    - "Найпоширеніше ототожнення — Сарди, столиця Лідії, а згодом перського намісництва, які староперські написи називають Спарда. Лідійсько-арамейський надгробний напис, знайдений у Сардах 1912 р., датований десятим роком Артаксеркса, близько 394 р. до н. е., пише назву міста арамейською з тими самими приголосними, що й Сефарад Овадії; мапа йде за цим. Інші пропонували Сапарду, округ Мідії, названий в аналах Саргона II. Арамейський таргум передає Сефарад як Іспамія, Іспанія; до IX ст. н. е. це слово в єврейському вжитку стало означати Іспанію, а євреїв Іспанії та їхніх нащадків і нині називають сефардами."
  es:
    - "Sefarad se nombra una vez, al final de la profecía de Abdías contra Edom: «y los cautivos de Jerusalem, que están en Sepharad, poseerán las ciudades del mediodía». Era evidentemente un lugar donde vivían exiliados de Jerusalén, pero el texto no da pista alguna sobre dónde estaba."
    - "La identificación más aceptada es Sardis, la capital de Lidia y más tarde de una satrapía persa, que las inscripciones en persa antiguo llaman Sparda. Una inscripción funeraria lidio-aramea hallada en Sardis en 1912, fechada en el año décimo de Artajerjes, hacia 394 a. C., escribe en arameo el nombre de la ciudad con las mismas consonantes que el Sefarad de Abdías; el mapa lo sigue. Otros han propuesto Saparda, un distrito de Media nombrado en los anales de Sargón II. El Targum arameo traduce Sefarad por Ispamia, España; hacia el siglo IX d. C. la palabra había pasado a significar España en el uso judío, y los judíos de España y sus descendientes siguen llamándose sefardíes."
  pt:
    - "Sefarade é nomeada uma vez, no final da profecia de Obadias contra Edom: “os cativos de Jerusalém, que estão em Sefarade, possuirão as cidades do Neguebe.” Era evidentemente um lugar onde viviam exilados de Jerusalém, mas o texto não dá nenhuma pista de onde ficava."
    - "A identificação mais amplamente aceita é Sardes, a capital da Lídia e depois de uma satrapia persa, que as inscrições em persa antigo chamam Sparda. Uma inscrição funerária lídio-aramaica encontrada em Sardes em 1912, datada do décimo ano de Artaxerxes, por volta de 394 a.C., escreve em aramaico o nome da cidade com as mesmas consoantes da Sefarade de Obadias; o mapa segue isso. Outros propuseram Saparda, um distrito da Média mencionado nos anais de Sargão II. O Targum aramaico traduz Sefarade por Ispamia, Espanha; no século IX d.C. a palavra já passara a significar Espanha no uso judaico, e os judeus da Espanha e seus descendentes ainda são chamados sefarditas."
  de:
    - "Sefarad wird einmal genannt, am Ende von Obadjas Weissagung gegen Edom: „die Vertriebenen der Stadt Jerusalem, die zu Sepharad sind, werden die Städte gegen Mittag besitzen“. Es war offenbar ein Ort, an dem Verbannte aus Jerusalem lebten, aber der Text gibt keinen Hinweis, wo es lag."
    - "Die am weitesten verbreitete Gleichsetzung ist Sardes, die Hauptstadt Lydiens und später einer persischen Satrapie, die altpersische Inschriften Sparda nennen. Eine lydisch-aramäische Grabinschrift, 1912 in Sardes gefunden und auf das zehnte Jahr des Artaxerxes datiert, etwa 394 v. Chr., schreibt den Namen der Stadt aramäisch mit denselben Konsonanten wie Obadjas Sefarad; die Karte folgt dem. Andere haben Saparda vorgeschlagen, einen Bezirk Mediens, der in den Annalen Sargons II. genannt wird. Der aramäische Targum gibt Sefarad mit Ispamia wieder, Spanien; im neunten Jahrhundert n. Chr. war das Wort im jüdischen Sprachgebrauch zu Spanien geworden, und die Juden Spaniens und ihre Nachkommen heißen noch heute Sefarden."
  it:
    - "Sefarad è nominata una sola volta, alla fine della profezia di Abdia contro Edom: «e i deportati di Gerusalemme che sono a Sefarad, possederanno le città del mezzogiorno». Era evidentemente un luogo in cui vivevano esuli di Gerusalemme, ma il testo non dà alcun indizio su dove si trovasse."
    - "L’identificazione più largamente accettata è Sardi, capitale della Lidia e più tardi di una satrapia persiana, che le iscrizioni in antico persiano chiamano Sparda. Un’iscrizione funeraria lidio-aramaica trovata a Sardi nel 1912, datata al decimo anno di Artaserse, circa il 394 a.C., scrive il nome della città in aramaico con le stesse consonanti della Sefarad di Abdia; la carta segue questa ipotesi. Altri hanno proposto Saparda, un distretto della Media nominato negli annali di Sargon II. Il Targum aramaico rende Sefarad con Ispamia, la Spagna; entro il IX secolo d.C. la parola era giunta a significare Spagna nell’uso ebraico, e gli ebrei di Spagna e i loro discendenti sono ancora chiamati sefarditi."
  fr:
    - "Sepharad n’est nommé qu’une fois, à la fin de la prophétie d’Abdias contre Édom : « les captifs de Jérusalem qui sont à Sepharad posséderont les villes du midi ». C’était manifestement un lieu où vivaient des exilés de Jérusalem, mais le texte ne donne aucun indice sur son emplacement."
    - "L’identification la plus largement admise est Sardes, capitale de la Lydie puis d’une satrapie perse, que les inscriptions en vieux perse appellent Sparda. Une inscription funéraire lydo-araméenne trouvée à Sardes en 1912, datée de la dixième année d’Artaxerxès, vers 394 av. J.-C., écrit le nom de la ville en araméen avec les mêmes consonnes que le Sepharad d’Abdias ; la carte suit cet avis. D’autres ont proposé Saparda, district de Médie nommé dans les annales de Sargon II. Le Targum araméen rend Sepharad par Ispamia, l’Espagne ; dès le IXe siècle apr. J.-C., le mot en était venu à désigner l’Espagne dans l’usage juif, et les Juifs d’Espagne et leurs descendants s’appellent encore séfarades."
  nl:
    - "Sefarad wordt eenmaal genoemd, aan het einde van Obadja's profetie tegen Edom: “en de gevankelijk weggevoerden van Jeruzalem, hetgeen in Sefarad is, zij zullen de steden van het zuiden erfelijk bezitten.” Het was kennelijk een plaats waar ballingen uit Jeruzalem woonden, maar de tekst geeft geen aanwijzing waar het lag."
    - "De meest aanvaarde identificatie is Sardes, de hoofdstad van Lydië en later van een Perzische satrapie, die Oudperzische inscripties Sparda noemen. Een Lydisch-Aramees grafschrift, in 1912 te Sardes gevonden en gedateerd in het tiende jaar van Artaxerxes, omstreeks 394 v.Chr., schrijft de naam van de stad in het Aramees met dezelfde medeklinkers als Obadja's Sefarad; de kaart volgt dit. Anderen hebben Saparda voorgesteld, een district van Medië dat in de annalen van Sargon II wordt genoemd. De Aramese Targum geeft Sefarad weer als Ispamia, Spanje; in de negende eeuw n.Chr. was het woord in Joods gebruik Spanje gaan betekenen, en de Joden van Spanje en hun nakomelingen heten nog steeds sefardim."
  cs:
    - "Sefarad je jmenováno jednou, na konci Obadjášova proroctví proti Edómu: zajatí Jeruzalémští, kteří jsou v Sefaradu, obdrží do dědictví města na jihu. Bylo to zřejmě místo, kde žili vyhnanci z Jeruzaléma, ale text nedává žádnou stopu, kde leželo."
    - "Nejpřijímanější ztotožnění je se Sardami, hlavním městem Lýdie a později perské satrapie, které staroperské nápisy nazývají Sparda. Lýdsko-aramejský pohřební nápis nalezený v Sardách roku 1912, datovaný do desátého roku Artaxerxova, asi 394 př. n. l., píše jméno města aramejsky týmiž souhláskami jako Obadjášovo Sefarad; mapa tento názor sleduje. Jiní navrhli Sapardu, okres Médie jmenovaný v análech Sargona II. Aramejský targum překládá Sefarad jako Ispamia, Španělsko; do devátého století n. l. začalo slovo v židovském úzu znamenat Španělsko a španělští Židé a jejich potomci se dosud nazývají sefardové."
  pl:
    - "Sefarad jest wymienione raz, na końcu proroctwa Abdiasza przeciw Edomowi: według Biblii Króla Jakuba pojmani z Jerozolimy, którzy są w Sefarad, posiądą miasta południa. Było to oczywiście miejsce, gdzie mieszkali wygnańcy z Jerozolimy, lecz tekst nie daje wskazówki, gdzie leżało."
    - "Najpowszechniej przyjmowane utożsamienie to Sardes, stolica Lidii, a później perskiej satrapii, które staroperskie inskrypcje nazywają Sparda. Lidyjsko-aramejski napis nagrobny znaleziony w Sardes w 1912 roku, datowany na dziesiąty rok Artakserksesa, około 394 p.n.e., zapisuje nazwę miasta po aramejsku tymi samymi spółgłoskami co Sefarad Abdiasza; mapa idzie za tym. Inni proponowali Saparda, okręg Medii wymieniony w annałach Sargona II. Targum aramejski oddaje Sefarad jako Ispamia, Hiszpania; do IX wieku n.e. słowo to oznaczało w użyciu żydowskim Hiszpanię, a Żydów hiszpańskich i ich potomków nadal nazywa się Sefardyjczykami."
  sv:
    - "Sefarad nämns en gång, i slutet av Obadjas profetia mot Edom: ”de bortförda från Jerusalem, de som leva i Sefarad, dessa skola taga Sydlandets städer i besittning.” Det var uppenbarligen en plats där landsflyktiga från Jerusalem bodde, men texten ger ingen ledtråd om var den låg."
    - "Den mest allmänt godtagna identifikationen är Sardes, huvudstad i Lydien och senare i en persisk satrapi, som gammalpersiska inskriptioner kallar Sparda. En lydisk-arameisk gravinskrift som hittades i Sardes 1912, daterad till Artaxerxes tionde år, omkring 394 f.Kr., skriver stadens namn på arameiska med samma konsonanter som Obadjas Sefarad; kartan följer detta. Andra har föreslagit Saparda, ett distrikt i Medien som nämns i Sargon II:s annaler. Det arameiska Targum återger Sefarad som Ispamia, Spanien; på 800-talet e.Kr. hade ordet kommit att betyda Spanien i judiskt bruk, och Spaniens judar och deras ättlingar kallas ännu sefarder."
  nb:
    - "Sefarad er nevnt én gang, på slutten av Obadjas profeti mot Edom: «og de bortførte fra Jerusalem som er i Sefarad, skal ta sydlandets byer i eie.» Det var åpenbart et sted der landflyktige fra Jerusalem bodde, men teksten gir ingen anvisning på hvor det lå."
    - "Den mest utbredte identifikasjonen er Sardes, hovedstaden i Lydia og senere i et persisk satrapi, som gammelpersiske inskripsjoner kaller Sparda. En lydisk-arameisk gravinskripsjon funnet i Sardes i 1912, datert til Artaxerxes' tiende år, omkring 394 f.Kr., skriver byens navn på arameisk med de samme konsonantene som Obadjas Sefarad; kartet følger dette. Andre har foreslått Saparda, et distrikt i Media nevnt i Sargon II's annaler. Den arameiske targumen gjengir Sefarad som Ispamia, Spania; på 800-tallet e.Kr. var ordet kommet til å bety Spania i jødisk bruk, og jødene i Spania og deres etterkommere kalles fortsatt sefardene."
  tl:
    - "Ang Sepharad ay isang beses lamang pinangalanan, sa wakas ng hula ni Obadias laban sa Edom: “ang mga bihag sa Jerusalem na nasa Sepharad ay magaari ng mga bayan ng Timugan.” Malinaw na lugar ito kung saan nanirahan ang mga tapon mula sa Jerusalem, ngunit walang palatandaan ang teksto kung nasaan ito."
    - "Ang pinakamalawak na tinatanggap na pagkilala ay ang Sardis, ang kabisera ng Lidia at kalaunan ng isang satrapiyang Persiyano, na tinatawag ng mga inskripsiyong Lumang Persa na Sparda. Isang inskripsiyong libing na Lidio-Arameo na natagpuan sa Sardis noong 1912, na may petsang ika-10 taon ni Artajerjes, bandang 394 BK, ay nagsusulat ng pangalan ng lungsod sa Arameo na may parehong katinig ng Sepharad ni Obadias; sinusunod ito ng mapa. Iminungkahi ng iba ang Saparda, isang distrito ng Media na pinangalanan sa mga talaan ni Sargon II. Isinasalin ng Targum na Arameo ang Sepharad bilang Ispamia, Espanya; pagsapit ng ika-9 na siglo AD, ang salita ay nangangahulugan nang Espanya sa gamit ng mga Judio, at ang mga Judio ng Espanya at ang kanilang mga inapo ay tinatawag pa ring Sephardim."
  da:
    - "Sefarad nævnes én gang, ved slutningen af Obadjas profeti mod Edom: »de bortførte af Jerusalem, som ere i Sefarad, de skulle eje Stæderne i Sydlandet.« Det var åbenbart et sted, hvor landflygtige fra Jerusalem boede, men teksten giver ingen anvisning på, hvor det lå."
    - "Den mest udbredte identifikation er Sardes, Lydiens hovedstad og senere en persisk satrapi, som oldpersiske indskrifter kalder Sparda. En lydisk-aramæisk gravindskrift fundet i Sardes i 1912, dateret til Artaxerxes' tiende år, omkring 394 f.Kr., skriver byens navn på aramæisk med de samme konsonanter som Obadjas Sefarad; kortet følger dette. Andre har foreslået Saparda, et distrikt i Medien nævnt i Sargon 2.'s annaler. Det aramæiske targum gengiver Sefarad som Ispamia, Spanien; i 800-tallet e.Kr. var ordet i jødisk sprogbrug kommet til at betyde Spanien, og Spaniens jøder og deres efterkommere kaldes stadig sefardimer."
  sr:
    - "Сефарад се помиње једном, на крају Овадијиног пророштва против Едома: „а робље јерусалимско, што је у Сефараду, наследиће јужне градове“. То је очигледно било место где су живели изгнаници из Јерусалима, али текст не даје трага где је лежало."
    - "Најшире прихваћено поистовећење је Сард, престоница Лидије и касније персијске сатрапије, који староперсијски натписи зову Спарда. Лидијско-арамејски погребни натпис нађен у Сарду 1912, датиран у десету годину Артаксеркса, око 394. п. н. е., пише име града на арамејском истим сугласницима као Овадијин Сефарад; карта то следи. Други су предложили Сапарду, област Мидије поменуту у аналима Саргона II. Арамејски Таргум преводи Сефарад као Испамија, Шпанија; до 9. века н. е. реч је у јеврејској употреби почела да значи Шпанију, а шпански Јевреји и њихови потомци и данас се зову Сефарди."
  hu:
    - "Széfárád egyszer szerepel, Abdiás Edom elleni jövendölésének végén: „a jeruzsálemi száműzöttek pedig, a kik Szefarádban vannak, elfoglalják majd a déli városokat.” Nyilván olyan hely volt, ahol Jeruzsálem száműzöttei éltek, de a szöveg nem ad támpontot arra, hol feküdt."
    - "A legelterjedtebb azonosítás Szárdisz, Lüdia fővárosa és később perzsa satrapia központja, amelyet óperzsa feliratok Spardának neveznek. Egy 1912-ben Szárdiszban talált lüd–arám sírfelirat, amely Artaxerxész tizedik évére, vagyis Kr. e. 394 tájára datált, a város nevét arámul ugyanazokkal a mássalhangzókkal írja, mint Abdiás Széfárádját; a térkép ezt követi. Mások Szapardát javasolták, Média egy kerületét, amelyet II. Szargon évkönyvei neveznek meg. Az arám Targum Széfárádot Ispamiaként, Hispániaként adja vissza; a Kr. u. 9. századra a szó a zsidó nyelvhasználatban Hispániát jelentette, és Hispánia zsidóit és leszármazottaikat ma is szefárdoknak nevezik."
  fi:
    - "Sefarad mainitaan kerran, Obadjan Edomia koskevan ennustuksen lopussa: ”Ja Jerusalemin pakkosiirtolaiset, jotka ovat Sefaradissa, ottavat perinnöksensä Etelämaan kaupungit.” Se oli ilmeisesti paikka, jossa Jerusalemin pakkosiirtolaiset asuivat, mutta teksti ei anna vihjettä sen sijainnista."
    - "Laajimmin hyväksytty tunnistus on Sardes, Lyydian ja myöhemmin Persian satraapian pääkaupunki, jota muinaispersialaiset kirjoitukset kutsuvat nimellä Sparda. Sardeksesta vuonna 1912 löydetty lyydialais-aramealainen hautakirjoitus, ajoitettu Artahsastan kymmenenteen vuoteen, noin 394 eaa., kirjoittaa kaupungin nimen arameaksi samoilla konsonanteilla kuin Obadjan Sefarad; kartta seuraa tätä. Toiset ovat ehdottaneet Saparda-nimistä Meedian piirikuntaa, joka mainitaan Sargon II:n annaaleissa. Aramealainen targum kääntää Sefaradin Ispamiaksi, Espanjaksi; 800-luvulle jaa. mennessä sana oli tullut juutalaisessa käytössä tarkoittamaan Espanjaa, ja Espanjan juutalaisia ja heidän jälkeläisiään kutsutaan yhä sefardeiksi."
  vi:
    - "Sê-pha-rát được nêu một lần, ở cuối lời tiên tri của Áp-đia nghịch cùng Ê-đôm: “Những phu tù của Giê-ru-sa-lem ở tại Sê-pha-rát sẽ được các thành phương nam.” Rõ ràng đó là nơi những người lưu đày từ Giê-ru-sa-lem sống, nhưng bản văn không cho manh mối nào về vị trí."
    - "Sự đồng nhất được chấp nhận rộng rãi nhất là Sạt-đe, thủ đô của Ly-đi và về sau của một tổng trấn Ba Tư, mà các bia ký Ba Tư cổ gọi là Sparda. Một bia ký mộ tiếng Ly-đi–Aram tìm thấy ở Sạt-đe năm 1912, định niên đại vào năm thứ mười của Ạt-ta-xét-xe, khoảng năm 394 TCN, viết tên thành bằng tiếng Aram với cùng các phụ âm như Sê-pha-rát của Áp-đia; bản đồ theo đó. Những người khác đã đề xuất Saparda, một quận của Mê-đi được nêu trong biên niên sử của Sargon II. Targum tiếng Aram dịch Sê-pha-rát là Ispamia, Tây Ban Nha; đến thế kỷ 9, từ này trong cách dùng của người Do Thái đã có nghĩa là Tây Ban Nha, và người Do Thái ở Tây Ban Nha cùng hậu duệ của họ vẫn được gọi là Sephardim."
  ro:
    - "Sefarad este numit o singură dată, la sfârșitul profeției lui Obadia împotriva Edomului: exilații Ierusalimului, care sunt în Sefarad, vor stăpâni cetățile din sud. Era evident un loc unde trăiau exilați din Ierusalim, dar textul nu dă niciun indiciu unde se afla."
    - "Identificarea cea mai larg acceptată este Sardes, capitala Lidiei și mai târziu a unei satrapii persane, pe care inscripțiile în persana veche o numesc Sparda. O inscripție funerară lidiano-aramaică găsită la Sardes în 1912, datată în al zecelea an al lui Artaxerxe, în jurul anului 394 î.Hr., scrie în aramaică numele orașului cu aceleași consoane ca Sefaradul lui Obadia; harta urmează această opinie. Alții au propus Saparda, un district al Mediei numit în analele lui Sargon al II-lea. Targumul aramaic redă Sefarad ca Ispamia, Spania; până în secolul al IX-lea d.Hr., cuvântul ajunsese să însemne Spania în uzul evreiesc, iar evreii din Spania și descendenții lor sunt numiți și acum sefarzi."
  bg:
    - "Сефарад е назован веднъж, в края на пророчеството на Овадия против Едом: „И запленените Ерусалимски които са в Сефарад Ще наследят южните градове“. Очевидно това е било място, където живеели изгнаници от Йерусалим, но текстът не дава указание къде се е намирало."
    - "Най-широко приетото отъждествяване е със Сарди, столицата на Лидия, а по-късно на персийска сатрапия, която староперсийските надписи наричат Спарда. Лидийско-арамейски надгробен надпис, намерен в Сарди през 1912 г. и датиран в десетата година на Артаксеркс, около 394 г. пр.н.е., изписва името на града на арамейски със същите съгласни като Сефарад у Овадия; картата следва това. Други предлагат Сапарда, област в Мидия, назована в аналите на Саргон II. Арамейският Таргум предава Сефарад като Испамия, Испания; към IX в. н.е. в еврейската употреба думата вече означавала Испания, а евреите от Испания и техните потомци и днес се наричат сефаради."
