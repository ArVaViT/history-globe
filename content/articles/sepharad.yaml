# Overview article (ADR 0007). Sepharad: Sardis (the most widely accepted view, after Vernet Pons 2014; the map's point) and Saparda in Media are shown; the later use for Spain from the Targum on.
id: sepharad
place: a0a98de
title:
  en: "Sepharad"
  ru: "Сефарад"
  uk: "Сефарад"
