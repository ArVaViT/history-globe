body:
  en:
    - "Beth-rehob was an Aramaean land and small kingdom north of Galilee, in the country between Mount Hermon and the Lebanon. The Bible fixes it only by Dan: when the Danites took Laish, the city had no helper, “because it was far from Zidon … and it was in the valley that lieth by Beth-rehob”. A century or two later the Ammonites, at war with David, “sent and hired the Syrians of Beth-rehob, and the Syrians of Zoba, twenty thousand footmen”, who were routed by Joab before the Ammonite city and are called simply “Rehob” a few verses on. The spies had earlier gone “unto Rehob, as men come to Hamath”, probably the same place, and Hadadezer, king of Zobah, “the son of Rehob”, may have been a prince of this house; the texts do not say."
    - "That is nearly all. Its seat has never been found: some put it in the southern Beqaa valley of Lebanon, on the road to Zobah and Hamath; others in the upper Huleh valley near Dan itself, at Hunin on the hills above, at Tel Dan, or at Banias. Nothing has been excavated under its name, and its later history, after it was absorbed by Damascus, is unknown. The region is today the Marjayoun and West Beqaa districts of Lebanon and the upper Jordan valley around Dan and Banias."
  ru:
    - "Беф-Рехов — арамейская земля и небольшое царство к северу от Галилеи, в краю между Ермоном и Ливаном. Библия привязывает его только к Дану: когда Дановы сыны взяли Лаис, помочь городу было некому, «потому что он был отдален от Сидона … Город сей находился в долине, что близ Беф-Рехова». Веком-двумя позже Аммонитяне, воевавшие с Давидом, послали «нанять Сирийцев из Беф-Рехова и Сирийцев Сувы двадцать тысяч пеших», которых Иоав разбил перед аммонитским городом и которые несколькими стихами дальше зовутся просто «Рехов». Соглядатаи раньше доходили до Рехова на пути в Емаф, вероятно, того же места, а Адраазар, сын Рехова, царь Сувский, мог быть князем этого дома; тексты этого не говорят."
    - "Это почти всё. Его столицу так и не нашли: одни помещают её в южной долине Бекаа в Ливане, на дороге к Суве и Емафу; другие — в верхней долине Хула у самого Дана, в Хунине на холмах над ней, в Тель-Дане или в Баниасе. Ничего под этим именем не копали, а его позднейшая история, после поглощения Дамаском, неизвестна. Сегодня это районы Марджаюн и Западная Бекаа в Ливане и верховья Иордана около Дана и Баниаса."
  uk:
    - "Бет-Рехов був арамейським краєм і невеликим царством на північ від Галілеї, у країні між горою Хермон і Ліваном. Біблія фіксує його лише через Дан: коли данити взяли Лаіш, місто не мало помічника, бо його мешканці «жили далеко від Сидону ... Місто се находилось на долинї, не далеко Бет-Рехова». Століття-два потому аммонітяни, воюючи з Давидом, «послали найняти Сирийцїв Бет-Рехобських і Сирийцїв Собських, двайцять тисяч пішого війська», які були розбиті Йоавом перед аммонітським містом й через кілька віршів названі просто «Рехобські». Розвідники раніше дійшли «до Регобу, як ійти до Гамату», імовірно, до того самого місця, а Адраазар, цар Суви, «Рехобенка», міг бути князем цього дому; тексти цього не кажуть."
    - "Це майже все. Його осередок так і не знайдено: одні ставлять його в південній долині Бекаа в Лівані, на дорозі до Суви та Хамату; інші — у верхній долині Хула біля самого Дану, у Хуніні на пагорбах над ним, у Тель-Дані або в Баніясі. Ніщо не розкопано під його ім'ям, а його пізніша історія, після поглинання Дамаском, невідома. Цей край нині — округи Маржаюн і Західна Бекаа в Лівані та верхня Йорданська долина навколо Дану і Баніясу."
  es:
    - "Bet-rehob era una tierra aramea y pequeño reino al norte de Galilea, en el país entre el monte Hermón y el Líbano. La Biblia la fija solo por Dan: cuando los danitas tomaron Lais, la ciudad no tenía quien la defendiera, «porque estaban lejos de Sidón, ... Y la ciudad estaba en el valle que hay en Beth-rehob». Uno o dos siglos después los amonitas, en guerra con David, «enviaron los hijos de Ammón y tomaron á sueldo á los Siros de la casa de Rehob, y á los Siros de Soba, veinte mil hombres de á pie», que fueron derrotados por Joab ante la ciudad amonita y se llaman simplemente «Rehob» unos versículos más adelante. Los espías habían llegado antes «hasta Rehob, entrando en Emath», probablemente al mismo lugar, y Hadad-ezer, rey de Soba, «hijo de Rehob», pudo ser un príncipe de esta casa; los textos no lo dicen."
    - "Eso es casi todo. Su sede nunca ha sido hallada: algunos la sitúan en el valle meridional de la Becá, en el Líbano, en el camino a Soba y Hamat; otros en el alto valle de Huleh cerca de la propia Dan, en Hunin, en las colinas de arriba, en Tel Dan o en Banias. Nada ha sido excavado bajo su nombre, y se ignora su historia posterior, tras ser absorbida por Damasco. La región es hoy los distritos de Marjayoun y de la Becá Occidental, en el Líbano, y el alto valle del Jordán en torno a Dan y Banias."
  pt:
    - "Bete-Reobe era uma terra e pequeno reino arameu ao norte da Galileia, no país entre o monte Hermom e o Líbano. A Bíblia a fixa só por Dã: quando os danitas tomaram Laís, a cidade não teve quem a livrasse, “porque a cidade ficava longe de Sidom … ela se localizava no vale que fica perto de Bete-Reobe”. Um ou dois séculos depois, os amonitas, em guerra com Davi, “mandaram contratar os sírios de Bete-Reobe e os sírios de Zobá, vinte mil soldados de infantaria”, que foram derrotados por Joabe diante da cidade amonita e poucos versículos adiante são chamados simplesmente “Reobe”. Os espias haviam ido antes “até Reobe, à entrada de Hamate”, provavelmente o mesmo lugar, e Hadadezer, rei de Zobá, “filho de Reobe”, pode ter sido um príncipe desta casa; os textos não o dizem."
    - "Isso é quase tudo. Sua sede nunca foi achada: alguns a põem no sul do vale da Beqaa, no Líbano, na estrada para Zobá e Hamate; outros no alto vale de Hula, perto da própria Dã, em Hunin, nas colinas acima, em Tel Dan ou em Banias. Nada foi escavado sob o seu nome, e sua história posterior, depois de absorvida por Damasco, é desconhecida. A região é hoje os distritos de Marjayoun e Beqaa Ocidental, no Líbano, e o alto vale do Jordão em torno de Dã e Banias."
  de:
    - "Bet-Rehob war ein aramäisches Land und kleines Königreich nördlich von Galiläa, im Land zwischen dem Hermon und dem Libanon. Die Bibel verortet es nur durch Dan: Als die Daniter Lais nahmen, hatte die Stadt keinen Helfer: „Und war niemand, der sie errettete; denn sie lag fern von Sidon, und sie hatten mit den Leuten nichts zu schaffen; und sie lag im Grunde, welcher an Beth-Rehob liegt.“ Ein bis zwei Jahrhunderte später, im Krieg mit David, heißt es von den Ammonitern: „sandten hin und dingten die Syrer des Hauses Rehob und die Syrer zu Zoba, zwanzigtausend Mann Fußvolk“, die Joab vor der ammonitischen Stadt schlug und die wenige Verse später schlicht „Rehob“ heißen. Die Kundschafter waren zuvor „bis gen Rehob, da man gen Hamath geht“ gezogen, wohl derselbe Ort, und Hadadeser, König von Zoba, „der Sohn Rehobs“, mag ein Prinz dieses Hauses gewesen sein; die Texte sagen es nicht."
    - "Das ist fast alles. Sein Sitz wurde nie gefunden: Manche setzen ihn in die südliche Bekaa im Libanon, an der Straße nach Zoba und Hamat; andere ins obere Hulatal nahe Dan selbst, nach Hunin auf den Hügeln darüber, nach Tel Dan oder nach Banias. Nichts wurde unter seinem Namen ausgegraben, und seine spätere Geschichte, nachdem Damaskus es aufgenommen hatte, ist unbekannt. Die Gegend umfasst heute die Bezirke Marjayoun und West-Bekaa im Libanon und das obere Jordantal um Dan und Banias."
  fr:
    - "Beth-Rehob était un pays araméen et un petit royaume au nord de la Galilée, dans la région entre le mont Hermon et le Liban. La Bible ne le fixe que par Dan : quand les Danites prirent Laïsch, la ville n’avait pas de secours, car « elle était éloignée de Sidon… : elle était dans la vallée qui s’étend vers Beth-Rehob ». Un siècle ou deux plus tard, les Ammonites, en guerre contre David, « firent enrôler à leur solde vingt mille hommes de pied chez les Syriens de Beth-Rehob et chez les Syriens de Tsoba », qui furent mis en déroute par Joab devant la ville ammonite et sont appelés simplement « Rehob » quelques versets plus loin. Les espions étaient allés auparavant « jusqu’à Rehob, sur le chemin de Hamath », probablement le même lieu, et Hadadézer, roi de Tsoba, « fils de Rehob », fut peut-être un prince de cette maison ; les textes ne le disent pas."
    - "C’est presque tout. Son siège n’a jamais été trouvé : certains le placent dans la Bekaa méridionale, au Liban, sur la route de Tsoba et de Hamath ; d’autres dans la haute vallée de la Houla près de Dan même, à Hunin sur les collines au-dessus, à Tel Dan ou à Banias. Rien n’a été fouillé sous son nom, et son histoire ultérieure, après son absorption par Damas, est inconnue. La région est aujourd’hui celle des districts de Marjayoun et de la Bekaa-Ouest au Liban et de la haute vallée du Jourdain autour de Dan et de Banias."
  it:
    - "Bet-Recob era una terra e un piccolo regno arameo a nord della Galilea, nel paese tra il monte Ermon e il Libano. La Bibbia lo fissa solo per mezzo di Dan: quando i Daniti presero Lais, la città non ebbe alcun soccorritore, «perch’era lontana da Sidon [...]. Essa era nella valle che si estende verso Beth-Rehob». Un secolo o due dopo gli Ammoniti, in guerra con Davide, «mandarono a prendere al loro soldo ventimila fanti dei Siri di Beth-Rehob e dei Siri di Tsoba», che furono sbaragliati da Ioab davanti alla città ammonita e sono chiamati semplicemente «Rehob» pochi versetti dopo. Gli esploratori erano andati prima «fino a Rehob, sulla via di Hamath», probabilmente lo stesso luogo, e Adadezer, re di Zoba, «figliuolo di Rehob», può essere stato un principe di questa casa; i testi non lo dicono."
    - "Questo è quasi tutto. La sua sede non è mai stata trovata: alcuni la pongono nella valle meridionale della Beqaa in Libano, sulla strada per Zoba e Camat; altri nell’alta valle di Hula presso la stessa Dan, a Hunin sulle colline sopra, a Tel Dan o a Banias. Nulla è stato scavato con il suo nome, e la sua storia posteriore, dopo che fu assorbita da Damasco, è ignota. La regione è oggi costituita dai distretti libanesi di Marjayoun e della Beqaa occidentale e dall’alta valle del Giordano intorno a Dan e Banias."
  pl:
    - "Bet-Rechob było aramejską krainą i małym królestwem na północ od Galilei, w kraju między górą Hermon a Libanem. Biblia umiejscawia je tylko przez Dan: gdy Danici zdobyli Lajisz, miasto nie miało pomocnika, „albowiem byli daleko od Sydonu … a to miasto leżało w dolinie, która jest w Betrohob”. Stulecie lub dwa później Ammonici, w wojnie z Dawidem, „posłali ciż synowie Ammonowi, i najęli za pieniądze Syryjczyka z domu Rechob, i Syryjczyka w Soba, dwadzieścia tysięcy pieszych”, których Joab rozgromił przed miastem Ammonitów i których kilka wersetów dalej nazywa się po prostu „Rechob”. Zwiadowcy poszli wcześniej „aż do Rochob, którędy chodzą do Emat”, prawdopodobnie w tym samym miejscu, a Hadadezer, król Soby, „syna Rochobowego”, mógł być księciem tego rodu; teksty tego nie mówią."
    - "To prawie wszystko. Jego siedziby nigdy nie odnaleziono: jedni umieszczają je w południowej dolinie Bekaa w Libanie, przy drodze do Soby i Chamat; inni w górnej dolinie Hula koło samego Dan, w Hunin na wzgórzach powyżej, w Tel Dan lub w Banias. Nic nie wykopano pod jego nazwą, a jego późniejsze dzieje, po wchłonięciu przez Damaszek, są nieznane. Region to dziś dystrykty Marjayoun i Bekaa Zachodnia w Libanie oraz górna dolina Jordanu wokół Dan i Banias."
  nl:
    - "Beth-Rechob was een Arameeës land en klein koninkrijk ten noorden van Galilea, in het gebied tussen de Hermon en de Libanon. De Bijbel bepaalt het alleen via Dan: toen de Danieten Lais innamen, had de stad geen helper, “want zij was verre van Sidon ... en zij lag in het dal, dat bij Beth-Rechob is”. Een of twee eeuwen later “zonden” de Ammonieten, in oorlog met David, “heen, en huurden van de Syriers van Beth-Rechob, en van de Syriers van Zoba, twintig duizend voetvolks”, die door Joab voor de Ammonitische stad werden verslagen en enkele verzen verder eenvoudig “Rechob” heten. De verspieders waren eerder gegaan “tot Rechob toe, waar men gaat naar Hamath”, waarschijnlijk dezelfde plaats, en Hadad-ezer, koning van Soba, “den zoon van Rechob”, kan een vorst van dit huis zijn geweest; de teksten zeggen het niet."
    - "Dat is bijna alles. Haar zetel is nooit gevonden: sommigen plaatsen haar in de zuidelijke Beqaavallei van Libanon, aan de weg naar Soba en Hamat; anderen in de bovenste Hulavallei bij Dan zelf, bij Hunin op de heuvels erboven, bij Tel Dan of bij Banias. Niets is onder haar naam opgegraven, en haar latere geschiedenis, nadat zij door Damascus was opgenomen, is onbekend. De streek is nu de districten Marjayoun en West-Beqaa in Libanon en de bovenste Jordaanvallei rond Dan en Banias."
  cs:
    - "Bét-rechob byla aramejská země a malé království severně od Galileje, v zemi mezi horou Chermon a Libanonem. Bible je určuje jen podle Danu: když Danovci dobyli Lajiš, město nemělo pomocníka, „nebo daleko byl Sidon, aniž měli spříznění s kterými lidmi. Město pak bylo v údolí, kteréž jest v Betrohob“. O století či dvě později Amónovci ve válce s Davidem „najali ze mzdy z Syrie z domu Rohob, a z Syrie Soba dvadcet tisíců pěších“, kteří byli Joábem rozprášeni před amónským městem a o několik veršů dál se jim říká prostě „Rohob“. Zvědové dříve prohlédli zemi „až do Rohob, kudy se jde do Emat“, pravděpodobně na totéž místo, a Hadadezer, král Sóby, „syn Rohobův“, mohl být knížetem tohoto rodu; texty to neříkají."
    - "To je téměř vše. Jeho sídlo nebylo nikdy nalezeno: někteří je kladou do jižního údolí Bikáa v Libanonu, na cestě do Sóby a Chamatu; jiní do horního údolí Chula poblíž samotného Danu, u Hunin na pahorcích nad ním, u Tel Dan nebo u Banías. Nic nebylo vykopáno pod jeho jménem a jeho pozdější dějiny, poté co je pohltil Damašek, jsou neznámé. Oblast je dnes okresy Marjayoun a Západní Bikáa v Libanonu a horní Jordánské údolí kolem Danu a Banías."
