# Overview article (ADR 0007). Mainstream facts only; an Aramaean land and kingdom whose seat is unknown; the Beqaa and the Huleh are given as the rival locations; the link with Hadadezer son of Rehob is given as a possibility.
id: beth-rehob
place: ad44b24
title:
  en: "Beth-rehob"
  ru: "Беф-Рехов"
  uk: "Бет-Рехов"
  es: "Bet-rehob"
  pt: "Bete-Reobe"
