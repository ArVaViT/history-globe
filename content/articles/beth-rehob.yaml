body:
  en:
    - "Beth-rehob was an Aramaean land and small kingdom north of Galilee, in the country between Mount Hermon and the Lebanon. The Bible fixes it only by Dan: when the Danites took Laish, the city had no helper, “because it was far from Zidon … and it was in the valley that lieth by Beth-rehob”. A century or two later the Ammonites, at war with David, “sent and hired the Syrians of Beth-rehob, and the Syrians of Zoba, twenty thousand footmen”, who were routed by Joab at Rabbah and are called simply “Rehob” a few verses on. The spies had earlier gone “unto Rehob, as men come to Hamath”, probably the same place, and Hadadezer, king of Zobah, “the son of Rehob”, may have been a prince of this house; the texts do not say."
    - "That is nearly all. Its seat has never been found: some put it in the southern Beqaa valley of Lebanon, on the road to Zobah and Hamath; others in the upper Huleh valley near Dan itself, at Hunin on the hills above, at Tel Dan, or at Banias. Nothing has been excavated under its name, and its later history, after it was absorbed by Damascus, is unknown. The region is today the Marjayoun and West Beqaa districts of Lebanon and the upper Jordan valley around Dan and Banias."
  ru:
    - "Беф-Рехов — арамейская земля и небольшое царство к северу от Галилеи, в краю между Ермоном и Ливаном. Библия привязывает его только к Дану: когда Дановы сыны взяли Лаис, помочь городу было некому, «потому что он был отдален от Сидона … Город сей находился в долине, что близ Беф-Рехова». Веком-двумя позже Аммонитяне, воевавшие с Давидом, послали «нанять Сирийцев из Беф-Рехова и Сирийцев Сувы двадцать тысяч пеших», которых Иоав разбил у Раввы и которые несколькими стихами дальше зовутся просто «Рехов». Соглядатаи раньше доходили до Рехова на пути в Емаф, вероятно, того же места, а Адраазар, сын Рехова, царь Сувский, мог быть князем этого дома; тексты этого не говорят."
    - "Это почти всё. Его столицу так и не нашли: одни помещают её в южной долине Бекаа в Ливане, на дороге к Суве и Емафу; другие — в верхней долине Хула у самого Дана, в Хунине на холмах над ней, в Тель-Дане или в Баниасе. Ничего под этим именем не копали, а его позднейшая история, после поглощения Дамаском, неизвестна. Сегодня это районы Марджаюн и Западная Бекаа в Ливане и верховья Иордана около Дана и Баниаса."
  uk:
    - "Бет-Рехов був арамейським краєм і невеликим царством на північ від Галілеї, у країні між горою Хермон і Ліваном. Біблія фіксує його лише через Дан: коли данити взяли Лаіш, місто не мало помічника, бо його мешканці «жили далеко від Сидону ... Місто се находилось на долинї, не далеко Бет-Рехова». Століття-два потому аммонітяни, воюючи з Давидом, «послали найняти Сирийцїв Бет-Рехобських і Сирийцїв Собських, двайцять тисяч пішого війська», які були розбиті Йоавом біля Равви й через кілька віршів названі просто «Рехобські». Розвідники раніше дійшли «до Регобу, як ійти до Гамату», імовірно, до того самого місця, а Адраазар, цар Суви, «Рехобенка», міг бути князем цього дому; тексти цього не кажуть."
    - "Це майже все. Його осередок так і не знайдено: одні ставлять його в південній долині Бекаа в Лівані, на дорозі до Суви та Хамату; інші — у верхній долині Хула біля самого Дану, у Хуніні на пагорбах над ним, у Тель-Дані або в Баніясі. Ніщо не розкопано під його ім'ям, а його пізніша історія, після поглинання Дамаском, невідома. Цей край нині — округи Маржаюн і Західна Бекаа в Лівані та верхня Йорданська долина навколо Дану і Баніясу."
  es:
    - "Bet-rehob era una tierra aramea y pequeño reino al norte de Galilea, en el país entre el monte Hermón y el Líbano. La Biblia la fija solo por Dan: cuando los danitas tomaron Lais, la ciudad no tenía quien la defendiera, «porque estaban lejos de Sidón, ... Y la ciudad estaba en el valle que hay en Beth-rehob». Uno o dos siglos después los amonitas, en guerra con David, «enviaron los hijos de Ammón y tomaron á sueldo á los Siros de la casa de Rehob, y á los Siros de Soba, veinte mil hombres de á pie», que fueron derrotados por Joab en Rabá y se llaman simplemente «Rehob» unos versículos más adelante. Los espías habían llegado antes «hasta Rehob, entrando en Emath», probablemente al mismo lugar, y Hadad-ezer, rey de Soba, «hijo de Rehob», pudo ser un príncipe de esta casa; los textos no lo dicen."
    - "Eso es casi todo. Su sede nunca ha sido hallada: algunos la sitúan en el valle meridional de la Becá, en el Líbano, en el camino a Soba y Hamat; otros en el alto valle de Huleh cerca de la propia Dan, en Hunin, en las colinas de arriba, en Tel Dan o en Banias. Nada ha sido excavado bajo su nombre, y se ignora su historia posterior, tras ser absorbida por Damasco. La región es hoy los distritos de Marjayoun y de la Becá Occidental, en el Líbano, y el alto valle del Jordán en torno a Dan y Banias."
  pt:
    - "Bete-Reobe era uma terra e pequeno reino arameu ao norte da Galileia, no país entre o monte Hermom e o Líbano. A Bíblia a fixa só por Dã: quando os danitas tomaram Laís, a cidade não teve quem a livrasse, “porque a cidade ficava longe de Sidom … ela se localizava no vale que fica perto de Bete-Reobe”. Um ou dois séculos depois, os amonitas, em guerra com Davi, “mandaram contratar os sírios de Bete-Reobe e os sírios de Zobá, vinte mil soldados de infantaria”, que foram derrotados por Joabe em Rabá e poucos versículos adiante são chamados simplesmente “Reobe”. Os espias haviam ido antes “até Reobe, à entrada de Hamate”, provavelmente o mesmo lugar, e Hadadezer, rei de Zobá, “filho de Reobe”, pode ter sido um príncipe desta casa; os textos não o dizem."
    - "Isso é quase tudo. Sua sede nunca foi achada: alguns a põem no sul do vale da Beqaa, no Líbano, na estrada para Zobá e Hamate; outros no alto vale de Hula, perto da própria Dã, em Hunin, nas colinas acima, em Tel Dan ou em Banias. Nada foi escavado sob o seu nome, e sua história posterior, depois de absorvida por Damasco, é desconhecida. A região é hoje os distritos de Marjayoun e Beqaa Ocidental, no Líbano, e o alto vale do Jordão em torno de Dã e Banias."
  de:
    - "Bet-Rehob war ein aramäisches Land und kleines Königreich nördlich von Galiläa, im Land zwischen dem Hermon und dem Libanon. Die Bibel verortet es nur durch Dan: Als die Daniter Lais nahmen, hatte die Stadt keinen Helfer: „Und war niemand, der sie errettete; denn sie lag fern von Sidon, und sie hatten mit den Leuten nichts zu schaffen; und sie lag im Grunde, welcher an Beth-Rehob liegt.“ Ein bis zwei Jahrhunderte später, im Krieg mit David, heißt es von den Ammonitern: „sandten hin und dingten die Syrer des Hauses Rehob und die Syrer zu Zoba, zwanzigtausend Mann Fußvolk“, die Joab bei Rabba schlug und die wenige Verse später schlicht „Rehob“ heißen. Die Kundschafter waren zuvor „bis gen Rehob, da man gen Hamath geht“ gezogen, wohl derselbe Ort, und Hadadeser, König von Zoba, „der Sohn Rehobs“, mag ein Prinz dieses Hauses gewesen sein; die Texte sagen es nicht."
    - "Das ist fast alles. Sein Sitz wurde nie gefunden: Manche setzen ihn in die südliche Bekaa im Libanon, an der Straße nach Zoba und Hamat; andere ins obere Hulatal nahe Dan selbst, nach Hunin auf den Hügeln darüber, nach Tel Dan oder nach Banias. Nichts wurde unter seinem Namen ausgegraben, und seine spätere Geschichte, nachdem Damaskus es aufgenommen hatte, ist unbekannt. Die Gegend umfasst heute die Bezirke Marjayoun und West-Bekaa im Libanon und das obere Jordantal um Dan und Banias."
  fr:
    - "Beth-Rehob était un pays araméen et un petit royaume au nord de la Galilée, dans la région entre le mont Hermon et le Liban. La Bible ne le fixe que par Dan : quand les Danites prirent Laïsch, la ville n’avait pas de secours, car « elle était éloignée de Sidon… : elle était dans la vallée qui s’étend vers Beth-Rehob ». Un siècle ou deux plus tard, les Ammonites, en guerre contre David, « firent enrôler à leur solde vingt mille hommes de pied chez les Syriens de Beth-Rehob et chez les Syriens de Tsoba », qui furent mis en déroute par Joab à Rabba et sont appelés simplement « Rehob » quelques versets plus loin. Les espions étaient allés auparavant « jusqu’à Rehob, sur le chemin de Hamath », probablement le même lieu, et Hadadézer, roi de Tsoba, « fils de Rehob », fut peut-être un prince de cette maison ; les textes ne le disent pas."
    - "C’est presque tout. Son siège n’a jamais été trouvé : certains le placent dans la Bekaa méridionale, au Liban, sur la route de Tsoba et de Hamath ; d’autres dans la haute vallée de la Houla près de Dan même, à Hunin sur les collines au-dessus, à Tel Dan ou à Banias. Rien n’a été fouillé sous son nom, et son histoire ultérieure, après son absorption par Damas, est inconnue. La région est aujourd’hui celle des districts de Marjayoun et de la Bekaa-Ouest au Liban et de la haute vallée du Jourdain autour de Dan et de Banias."
