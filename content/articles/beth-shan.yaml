body:
  en:
    - "Beth-shan stands on a high mound, Tel Beth-Shean, where the Jezreel Valley comes down past Mount Gilboa to the Jordan Valley; the Roman and Byzantine city of Scythopolis spread out at its foot. The mound was settled by the fifth millennium BC. Thutmose III named Beth-shan in his list of Canaanite towns at Karnak in the fifteenth century BC, and in an Amarna letter Abdi-Heba of Jerusalem complains that the men of Gath had a garrison in Beth-shan. The University of Pennsylvania, digging here in 1921–1933, found basalt stelae of Seti I and Ramesses II from the time when Egypt held the town; one tells how Seti I sent an army division to Beth-shan when the ruler of a nearby town tried to seize it."
    - "Beth-shan was assigned to Manasseh, but the tribe did not drive out its Canaanites, whose chariots of iron the children of Joseph feared. After Saul and his sons fell on Mount Gilboa, the Philistines put his armour in the house of Ashtaroth and fastened his body to the wall of Beth-shan; the men of Jabesh-gilead went all night and took the bodies down, and David later took the bones from them. Under Solomon the town belonged to the district of Baana, and Pharaoh Shishak listed it at Karnak among the towns of his campaign in the late tenth century BC. The Iron Age town ended in fire in the eighth century BC, usually tied to the Assyrian conquest of 732 BC."
    - "In the Hellenistic age the place became a Greek city, Nysa-Scythopolis; a Seleucid town on the neighbouring hill of Tell Iztabba was founded under Antiochus IV. Pliny explains the name Scythopolis by a colony of Scythians, but its origin is disputed. According to 2 Maccabees, the Jews of Scythopolis testified that its people had treated them kindly, and Judas and his men thanked them and went on to Jerusalem. About 107 BC the city was betrayed to the forces of John Hyrcanus. Pompey freed it from Jewish rule in 63 BC, Gabinius rebuilt it, and it was counted among the cities of the Decapolis; Josephus calls it the largest of them."
    - "When the war with Rome broke out in AD 66, the Greeks of Scythopolis turned on the Jews who had fought on their side and, Josephus says, killed more than 13,000 of them. In AD 67 Vespasian gathered his legions there before marching on Tiberias. The Roman city had colonnaded streets, a theatre and baths. Eusebius calls it a famous city of Palestine, and by the early fifth century it was the chief city of the province of Second Palestine."
  ru:
    - "Беф-Сан стоит на высоком холме Тель-Бейт-Шеан, там, где Изреельская долина спускается мимо горы Гелвуй к долине Иордана; у его подножия раскинулся римский и византийский город Скифополь. Холм был заселён уже в V тысячелетии до н. э. Тутмос III назвал Беф-Сан в своём списке ханаанских городов в Карнаке в XV веке до н. э., а в одном из амарнских писем Абди-Хеба из Иерусалима жалуется, что люди Гата держат гарнизон в Беф-Сане. Пенсильванский университет, копавший здесь в 1921–1933 гг., нашёл базальтовые стелы Сети I и Рамсеса II того времени, когда городом владел Египет; одна из них рассказывает, как Сети I послал войско к Беф-Сану, когда правитель соседнего города пытался его захватить."
    - "Беф-Сан достался Манассии, но колено не выгнало его хананеев, чьих железных колесниц боялись сыны Иосифа. Когда Саул и его сыновья пали на горе Гелвуй, филистимляне положили его оружие в капище Астарты, а тело повесили на стене Беф-Сана; жители Иависа Галаадского шли всю ночь и сняли тела, а позже Давид взял у них кости. При Соломоне город входил в округ Вааны, а фараон Сусаким в конце X века до н. э. перечислил его в Карнаке среди городов своего похода. Город железного века погиб в огне в VIII веке до н. э.; обычно это связывают с ассирийским завоеванием 732 г. до н. э."
    - "В эллинистическую эпоху здесь возник греческий город Ниса-Скифополь; селевкидский город на соседнем холме Телль-Изтабба был основан при Антиохе IV. Плиний объясняет имя Скифополь поселением скифов, но его происхождение спорно. По Второй книге Маккавейской, иудеи Скифополя засвидетельствовали, что его жители обходились с ними дружелюбно, и Иуда со своими людьми поблагодарил их и пошёл дальше в Иерусалим. Около 107 г. до н. э. город был предан войскам Иоанна Гиркана. Помпей освободил его от власти иудеев в 63 г. до н. э., Габиний отстроил, и его причисляли к городам Десятиградия; Иосиф Флавий называет его самым большим из них."
    - "Когда в 66 г. н. э. началась война с Римом, греки Скифополя обратились против иудеев, сражавшихся на их стороне, и, по словам Иосифа Флавия, перебили более 13 000 человек. В 67 г. н. э. Веспасиан собрал здесь свои легионы перед походом на Тивериаду. В римском городе были улицы-колоннады, театр и бани. Евсевий называет его знаменитым городом Палестины, а к началу V века он был главным городом провинции Вторая Палестина."
  uk:
    - "Бет-Шеан стоїть на високому пагорбі, Тель-Бет-Шеан, де Їзреельська долина спадає повз гору Гільбоа до Йорданської долини; римське й візантійське місто Скіфополь розкинулося біля його підніжжя. Пагорб був заселений ще в V тисячолітті до н. е. Тутмос III назвав Бет-Шеан у своєму переліку ханаанських міст у Карнаку в XV столітті до н. е., а в одному з листів з Амарни Абді-Хеба Єрусалимський скаржиться, що люди Гату мали гарнізон у Бет-Шеані. Пенсільванський університет, ведучи тут розкопки у 1921–1933 рр., знайшов базальтові стели Сеті I і Рамсеса II з часу, коли Єгипет тримав місто; одна розповідає, як Сеті I послав дивізію війська до Бет-Шеана, коли правитель сусіднього міста спробував його захопити."
    - "Бет-Шеан було віддано Манасії, але плем'я не вигнало його ханаанців, чиїх залізних колісниць боялися сини Йосипа. Після того як Саул та його сини полягли на горі Гільбоа, филистимляни поклали його зброю в храмі Аштарот, а його тіло прибили до муру Бет-Шеана; мужі Явіса Гілеадського йшли всю ніч і зняли тіла, а Давид пізніше забрав кості від них. За Соломона місто належало до округу Ваани, і фараон Сусакім перелічив його в Карнаку серед міст свого походу наприкінці X століття до н. е. Місто залізної доби скінчилося в полум'ї у VIII столітті до н. е., що зазвичай пов'язують з ассирійським завоюванням 732 р. до н. е."
    - "В елліністичну добу місце стало грецьким містом Ніса-Скіфополь; селевкідське місто на сусідньому пагорбі Телль-Іцтабба було засноване за Антіоха IV. Пліній пояснює назву Скіфополь колонією скіфів, але її походження спірне. За Другою книгою Маккавеїв, юдеї Скіфополя засвідчили, що його мешканці ставилися до них по-доброму, і Юда з його людьми подякували їм і пішли далі до Єрусалима. Близько 107 р. до н. е. місто було зраджене військам Івана Гіркана. Помпей звільнив його від юдейської влади в 63 р. до н. е., Габіній відбудував його, і воно належало до міст Десятимістя; Йосиф Флавій називає його найбільшим з них."
    - "Коли в 66 р. н. е. вибухнула війна з Римом, греки Скіфополя напали на юдеїв, які воювали на їхньому боці, і, каже Йосиф Флавій, убили понад 13 000 з них. У 67 р. н. е. Веспасіан зібрав там свої легіони перед походом на Тіверіаду. Римське місто мало вулиці з колонадами, театр і лазні. Євсевій називає його славним містом Палестини, а на початку V століття воно було головним містом провінції Друга Палестина."
  es:
    - "Bet-seán se alza sobre un alto montículo, Tel Beth-Shean, donde el valle de Jezreel desciende pasado el monte Gilboa hasta el valle del Jordán; la ciudad romana y bizantina de Escitópolis se extendió a sus pies. El montículo estaba habitado en el quinto milenio a. C. Tutmosis III nombró Bet-seán en su lista de ciudades cananeas en Karnak, en el siglo XV a. C., y en una carta de Amarna Abdi-Heba de Jerusalén se queja de que los hombres de Gat tenían una guarnición en Bet-seán. La Universidad de Pensilvania, que excavó aquí en 1921–1933, halló estelas de basalto de Seti I y Ramsés II de la época en que Egipto poseía la ciudad; una cuenta cómo Seti I envió una división del ejército a Bet-seán cuando el gobernante de una ciudad cercana intentó apoderarse de ella."
    - "Bet-seán fue asignada a Manasés, pero la tribu no expulsó a sus cananeos, cuyos carros de hierro temían los hijos de José. Cuando Saúl y sus hijos cayeron en el monte Gilboa, los filisteos pusieron su armadura en la casa de Astarot y sujetaron su cuerpo a la muralla de Bet-seán; los hombres de Jabes de Galaad caminaron toda la noche y bajaron los cuerpos, y David tomó más tarde los huesos de ellos. Bajo Salomón la ciudad pertenecía al distrito de Baana, y el faraón Sisac la enumeró en Karnak entre las ciudades de su campaña a finales del siglo X a. C. La ciudad de la edad del Hierro terminó en un incendio en el siglo VIII a. C., que suele vincularse a la conquista asiria de 732 a. C."
    - "En la época helenística el lugar se convirtió en una ciudad griega, Nisa-Escitópolis; una ciudad seléucida en la vecina colina de Tell Iztabba fue fundada bajo Antíoco IV. Plinio explica el nombre Escitópolis por una colonia de escitas, pero su origen se discute. Según 2 Macabeos, los judíos de Escitópolis testificaron que sus habitantes los habían tratado con amabilidad, y Judas y sus hombres les dieron las gracias y siguieron hacia Jerusalén. Hacia 107 a. C. la ciudad fue entregada a las fuerzas de Juan Hircano. Pompeyo la liberó del dominio judío en 63 a. C., Gabinio la reconstruyó, y se contó entre las ciudades de la Decápolis; Josefo la llama la mayor de ellas."
    - "Cuando estalló la guerra con Roma en 66 d. C., los griegos de Escitópolis se volvieron contra los judíos que habían combatido a su lado y, según Josefo, mataron a más de 13 000 de ellos. En 67 d. C. Vespasiano reunió allí sus legiones antes de marchar sobre Tiberias. La ciudad romana tenía calles con columnatas, un teatro y baños. Eusebio la llama una ciudad famosa de Palestina, y a principios del siglo V era la ciudad principal de la provincia de Palestina Segunda."
  pt:
    - "Bete-Seã ergue-se num alto montículo, Tel Beth-Shean, onde o vale de Jezreel desce, passando pelo monte Gilboa, ao vale do Jordão; a cidade romana e bizantina de Citópolis se estendia ao seu pé. O montículo foi povoado já no quinto milênio a.C. Tutmés III nomeou Bete-Seã em sua lista de cidades cananeias em Carnaque, no século XV a.C., e numa carta de Amarna Abdi-Heba de Jerusalém se queixa de que os homens de Gate tinham uma guarnição em Bete-Seã. A Universidade da Pensilvânia, escavando aqui em 1921–1933, achou estelas de basalto de Seti I e Ramsés II do tempo em que o Egito mantinha a cidade; uma conta como Seti I enviou uma divisão do exército a Bete-Seã quando o governante de uma cidade vizinha tentou tomá-la."
    - "Bete-Seã foi atribuída a Manassés, mas a tribo não expulsou seus cananeus, cujos carros de ferro os filhos de José temiam. Depois que Saul e seus filhos caíram no monte Gilboa, os filisteus puseram sua armadura no templo de Astarote e prenderam seu corpo ao muro de Bete-Seã; os homens de Jabes-Gileade caminharam a noite toda e retiraram os corpos, e Davi depois recolheu deles os ossos. Sob Salomão a cidade pertencia ao distrito de Baaná, e o faraó Sisaque a listou em Carnaque entre as cidades de sua campanha no fim do século X a.C. A cidade da Idade do Ferro acabou em fogo no século VIII a.C., geralmente ligado à conquista assíria de 732 a.C."
    - "Na época helenística o lugar tornou-se uma cidade grega, Nisa-Citópolis; uma cidade selêucida na colina vizinha de Tell Iztabba foi fundada sob Antíoco IV. Plínio explica o nome Citópolis por uma colônia de citas, mas sua origem é discutida. Segundo 2 Macabeus, os judeus de Citópolis testemunharam que seu povo os tratara com bondade, e Judas e seus homens agradeceram e seguiram para Jerusalém. Por volta de 107 a.C. a cidade foi traída para as forças de João Hircano. Pompeu a libertou do domínio judaico em 63 a.C., Gabínio a reconstruiu, e foi contada entre as cidades da Decápolis; Josefo a chama a maior delas."
    - "Quando a guerra com Roma irrompeu em 66 d.C., os gregos de Citópolis se voltaram contra os judeus que haviam lutado a seu lado e, diz Josefo, mataram mais de 13.000 deles. Em 67 d.C., Vespasiano reuniu ali suas legiões antes de marchar sobre Tiberíades. A cidade romana tinha ruas com colunatas, um teatro e banhos. Eusébio a chama cidade famosa da Palestina, e no início do século V era a principal cidade da província da Palestina Segunda."
  de:
    - "Bet-Schean liegt auf einem hohen Hügel, Tel Bet Schean, wo das Jesreeltal am Gilboa vorbei ins Jordantal abfällt; die römische und byzantinische Stadt Skythopolis breitete sich an seinem Fuß aus. Der Hügel war seit dem 5. Jahrtausend v. Chr. besiedelt. Thutmosis III. nannte Bet-Schean im 15. Jahrhundert v. Chr. in seiner Liste kanaanäischer Städte in Karnak, und in einem Amarna-Brief klagt Abdi-Heba von Jerusalem, die Männer von Gat hätten in Bet-Schean eine Besatzung. Die University of Pennsylvania, die hier 1921–1933 grub, fand Basaltstelen Sethos' I. und Ramses' II. aus der Zeit, als Ägypten die Stadt hielt; eine erzählt, wie Sethos I. eine Heeresabteilung nach Bet-Schean schickte, als der Herrscher einer nahen Stadt versuchte, sie an sich zu reißen."
    - "Bet-Schean wurde Manasse zugewiesen, doch der Stamm vertrieb seine Kanaaniter nicht, deren eiserne Wagen die Kinder Josef fürchteten. Nachdem Saul und seine Söhne auf dem Gilboa gefallen waren, legten die Philister seine Rüstung in das Haus der Astarot und hefteten seinen Leichnam an die Mauer von Bet-Schean; die Männer von Jabesch in Gilead gingen die ganze Nacht und nahmen die Leichname ab, und David holte später die Gebeine von ihnen. Unter Salomo gehörte die Stadt zum Bezirk Baanas, und Pharao Schischak führte sie in Karnak unter den Städten seines Feldzugs im späten 10. Jahrhundert v. Chr. auf. Die eisenzeitliche Stadt endete im 8. Jahrhundert v. Chr. im Feuer, gewöhnlich mit der assyrischen Eroberung von 732 v. Chr. verbunden."
    - "In hellenistischer Zeit wurde der Ort eine griechische Stadt, Nysa-Skythopolis; eine seleukidische Stadt auf dem benachbarten Hügel Tell Iztabba wurde unter Antiochos IV. gegründet. Plinius erklärt den Namen Skythopolis durch eine Kolonie von Skythen, doch sein Ursprung ist umstritten. Nach dem 2. Makkabäerbuch bezeugten die Juden von Skythopolis, dass ihre Bürger sie freundlich behandelt hatten, und Judas und seine Männer dankten ihnen und zogen weiter nach Jerusalem. Um 107 v. Chr. wurde die Stadt den Truppen des Johannes Hyrkanos verraten. Pompeius befreite sie 63 v. Chr. von jüdischer Herrschaft, Gabinius baute sie wieder auf, und sie zählte zu den Städten der Dekapolis; Josephus nennt sie die größte von ihnen."
    - "Als der Krieg mit Rom 66 n. Chr. ausbrach, wandten sich die Griechen von Skythopolis gegen die Juden, die auf ihrer Seite gekämpft hatten, und töteten, wie Josephus sagt, mehr als 13 000 von ihnen. 67 n. Chr. sammelte Vespasian seine Legionen dort, ehe er gegen Tiberias marschierte. Die römische Stadt hatte Säulenstraßen, ein Theater und Bäder. Eusebius nennt sie eine berühmte Stadt Palästinas, und im frühen 5. Jahrhundert war sie die Hauptstadt der Provinz Palaestina Secunda."
  fr:
    - "Beth-Schean se dresse sur un haut tertre, Tel Beth-Shean, là où la vallée de Jizreel descend, au pied du mont Guilboa, vers la vallée du Jourdain ; la ville romaine et byzantine de Scythopolis s’étendait à son pied. Le tertre fut peuplé dès le Ve millénaire av. J.-C. Thoutmosis III nomma Beth-Schean dans sa liste de villes cananéennes à Karnak au XVe siècle av. J.-C., et dans une lettre d’Amarna Abdi-Khéba de Jérusalem se plaint que les hommes de Gath avaient une garnison à Beth-Schean. L’Université de Pennsylvanie, fouillant ici en 1921-1933, trouva des stèles de basalte de Séthi Ier et de Ramsès II de l’époque où l’Égypte tenait la ville ; l’une raconte comment Séthi Ier envoya une division à Beth-Schean quand le souverain d’une ville voisine tenta de s’en emparer."
    - "Beth-Schean fut attribuée à Manassé, mais la tribu ne chassa pas ses Cananéens, dont les chars de fer effrayaient les enfants de Joseph. Après la chute de Saül et de ses fils sur le mont Guilboa, les Philistins mirent son armure dans la maison d’Aschtaroth et fixèrent son corps au mur de Beth-Schean ; les hommes de Jabès en Galaad marchèrent toute la nuit et descendirent les corps, et David reprit plus tard leurs ossements. Sous Salomon, la ville appartenait au district de Baana, et le pharaon Schischak la porta sur sa liste de Karnak parmi les villes de sa campagne de la fin du Xe siècle av. J.-C. La ville de l’âge du Fer périt par le feu au VIIIe siècle av. J.-C., d’ordinaire rapporté à la conquête assyrienne de 732 av. J.-C."
    - "À l’époque hellénistique, le lieu devint une cité grecque, Nysa-Scythopolis ; une ville séleucide sur la colline voisine de Tell Iztabba fut fondée sous Antiochos IV. Pline explique le nom de Scythopolis par une colonie de Scythes, mais son origine est discutée. Selon 2 Maccabées, les Juifs de Scythopolis attestèrent que ses habitants les avaient traités avec bienveillance, et Judas et ses hommes les remercièrent et poursuivirent vers Jérusalem. Vers 107 av. J.-C., la ville fut livrée aux forces de Jean Hyrcan. Pompée l’affranchit de la domination juive en 63 av. J.-C., Gabinius la rebâtit, et elle fut comptée parmi les villes de la Décapole ; Josèphe la dit la plus grande d’entre elles."
    - "Quand la guerre contre Rome éclata en 66 apr. J.-C., les Grecs de Scythopolis se retournèrent contre les Juifs qui avaient combattu à leurs côtés et, dit Josèphe, en tuèrent plus de 13 000. En 67 apr. J.-C., Vespasien y rassembla ses légions avant de marcher sur Tibériade. La ville romaine avait des rues à colonnades, un théâtre et des bains. Eusèbe l’appelle une ville célèbre de Palestine, et au début du Ve siècle elle était la principale ville de la province de Seconde Palestine."
  it:
    - "Beth-Shean sorge su un alto tell, Tel Beth-Shean, dove la valle di Izreel scende oltre il monte Gelboe verso la valle del Giordano; la città romana e bizantina di Scitopoli si estendeva ai suoi piedi. Il tell era abitato dal V millennio a.C. Tutmosi III nominò Beth-Shean nel suo elenco di città cananee a Karnak nel XV secolo a.C., e in una lettera di Amarna Abdi-Heba di Gerusalemme si lamenta che gli uomini di Gat avevano una guarnigione a Beth-Shean. L’Università della Pennsylvania, scavando qui nel 1921–1933, trovò stele di basalto di Seti I e Ramesse II del tempo in cui l’Egitto teneva la città; una racconta come Seti I mandò una divisione dell’esercito a Beth-Shean quando il sovrano di una città vicina tentò di impadronirsene."
    - "Beth-Shean fu assegnata a Manasse, ma la tribù non scacciò i suoi Cananei, di cui i figli di Giuseppe temevano i carri di ferro. Dopo che Saul e i suoi figli caddero sul monte Gelboe, i Filistei posero le sue armi nel tempio di Astarte e appesero il suo cadavere alle mura di Beth-Shean; gli uomini di Iabes di Galaad camminarono tutta la notte e tolsero i corpi, e Davide in seguito ne prese le ossa. Sotto Salomone la città apparteneva al distretto di Baana, e il faraone Sisak la elencò a Karnak fra le città della sua campagna alla fine del X secolo a.C. La città dell’età del Ferro finì nel fuoco nell’VIII secolo a.C., di solito legato alla conquista assira del 732 a.C."
    - "In età ellenistica il luogo divenne una città greca, Nisa-Scitopoli; una città seleucide sulla vicina collina di Tell Iztabba fu fondata sotto Antioco IV. Plinio spiega il nome Scitopoli con una colonia di Sciti, ma la sua origine è discussa. Secondo 2 Maccabei, i Giudei di Scitopoli testimoniarono che la sua gente li aveva trattati con bontà, e Giuda e i suoi uomini li ringraziarono e proseguirono per Gerusalemme. Intorno al 107 a.C. la città fu tradita alle forze di Giovanni Ircano. Pompeo la liberò dal dominio giudaico nel 63 a.C., Gabinio la ricostruì, e fu contata fra le città della Decapoli; Flavio Giuseppe la chiama la maggiore di esse."
    - "Quando scoppiò la guerra con Roma nel 66 d.C., i Greci di Scitopoli si volsero contro i Giudei che avevano combattuto dalla loro parte e, dice Flavio Giuseppe, ne uccisero più di 13.000. Nel 67 d.C. Vespasiano vi radunò le sue legioni prima di marciare su Tiberiade. La città romana aveva vie con colonnati, un teatro e terme. Eusebio la chiama una celebre città della Palestina, e all’inizio del V secolo era la città principale della provincia di Palestina Seconda."
  pl:
    - "Bet-Szean stoi na wysokim tellu, Tel Bet-Szean, gdzie Dolina Jezreel schodzi obok góry Gilboa do Doliny Jordanu; rzymskie i bizantyjskie miasto Scytopolis rozciągało się u jego stóp. Tell był zasiedlony już w V tysiącleciu p.n.e. Totmes III wymienił Bet-Szean w swym wykazie kananejskich miast w Karnaku w XV wieku p.n.e., a w liście z Amarna Abdi-Heba z Jerozolimy skarży się, że ludzie z Gat mieli garnizon w Bet-Szean. Uniwersytet Pensylwanii, kopiąc tu w latach 1921–1933, znalazł bazaltowe stele Setiego I i Ramzesa II z czasów, gdy Egipt trzymał miasto; jedna opowiada, jak Seti I wysłał dywizję wojska do Bet-Szean, gdy władca pobliskiego miasta próbował je zająć."
    - "Bet-Szean przydzielono Manassesowi, lecz pokolenie nie wypędziło jego Kananejczyków, których żelaznych wozów obawiali się synowie Józefa. Gdy Saul i jego synowie polegli na górze Gilboa, Filistyni złożyli jego zbroję w domu Asztarot i przybili jego ciało do muru Bet-Szean; mężowie z Jabesz-Gilead szli całą noc i zdjęli ciała, a Dawid później odebrał od nich kości. Za Salomona miasto należało do okręgu Baany, a faraon Sziszak wpisał je w Karnaku wśród miast swej kampanii u schyłku X wieku p.n.e. Miasto z epoki żelaza zakończyło się pożarem w VIII wieku p.n.e., zwykle wiązanym z asyryjskim podbojem z 732 r. p.n.e."
    - "W epoce hellenistycznej miejsce stało się miastem greckim, Nysa-Scytopolis; seleucydzkie miasto na sąsiednim wzgórzu Tell Iztabba założono za Antiocha IV. Pliniusz wyjaśnia nazwę Scytopolis kolonią Scytów, lecz jej pochodzenie jest sporne. Według 2 Księgi Machabejskiej Żydzi ze Scytopolis zaświadczyli, że jego mieszkańcy traktowali ich życzliwie, a Juda i jego ludzie podziękowali im i poszli dalej do Jerozolimy. Około 107 r. p.n.e. miasto zdradzono wojskom Jana Hirkana. Pompejusz uwolnił je spod żydowskiej władzy w 63 r. p.n.e., Gabiniusz je odbudował i zaliczano je do miast Dekapolu; Józef Flawiusz nazywa je największym z nich."
    - "Gdy w 66 r. n.e. wybuchła wojna z Rzymem, Grecy Scytopolis zwrócili się przeciw Żydom, którzy walczyli po ich stronie, i, jak mówi Józef Flawiusz, zabili ponad 13 000 z nich. W 67 r. n.e. Wespazjan zebrał tam swe legiony przed marszem na Tyberiadę. Miasto rzymskie miało ulice z kolumnadami, teatr i łaźnie. Euzebiusz nazywa je sławnym miastem Palestyny, a na początku V wieku było głównym miastem prowincji Palestyna II."
  nl:
    - "Beth-Sean ligt op een hoge heuvel, Tel Beth-Shean, waar de vallei van Jizreël langs de Gilboa naar de Jordaanvallei afdaalt; de Romeinse en Byzantijnse stad Scythopolis breidde zich aan zijn voet uit. De heuvel werd in het vijfde millennium v.Chr. bewoond. Thoetmosis III noemde Beth-Sean in zijn lijst van Kanaänitische steden te Karnak in de vijftiende eeuw v.Chr., en in een Amarnabrief klaagt Abdi-Heba van Jeruzalem dat de mannen van Gat een garnizoen in Beth-Sean hadden. De Universiteit van Pennsylvania vond bij haar opgravingen in 1921–1933 basalten stèles van Seti I en Ramses II uit de tijd dat Egypte de stad hield; een vertelt hoe Seti I een legerdivisie naar Beth-Sean zond toen de heerser van een nabije stad haar probeerde te grijpen."
    - "Beth-Sean werd aan Manasse toegewezen, maar de stam verdreef zijn Kanaänieten niet, wier ijzeren wagens de kinderen van Jozef vreesden. Nadat Saul en zijn zonen op de Gilboa waren gevallen, legden de Filistijnen zijn wapenrusting in het huis van Astarot en bevestigden zijn lichaam aan de muur van Beth-Sean; de mannen van Jabes in Gilead gingen de hele nacht en namen de lichamen af, en David haalde later de beenderen bij hen. Onder Salomo behoorde de stad tot het district van Baäna, en Farao Sisak noemde haar te Karnak onder de steden van zijn veldtocht in de late tiende eeuw v.Chr. De ijzertijdstad eindigde in vuur in de achtste eeuw v.Chr., gewoonlijk verbonden met de Assyrische verovering van 732 v.Chr."
    - "In de hellenistische tijd werd de plaats een Griekse stad, Nysa-Scythopolis; een Seleucidische stad op de naburige heuvel Tell Iztabba werd onder Antiochus IV gesticht. Plinius verklaart de naam Scythopolis uit een kolonie van Scythen, maar de oorsprong is omstreden. Volgens 2 Makkabeeën getuigden de Joden van Scythopolis dat haar bewoners hen vriendelijk hadden behandeld, en Judas en zijn mannen bedankten hen en gingen verder naar Jeruzalem. Omstreeks 107 v.Chr. werd de stad aan de troepen van Johannes Hyrcanus verraden. Pompeius bevrijdde haar in 63 v.Chr. van Joodse heerschappij, Gabinius herbouwde haar, en zij werd gerekend tot de steden van de Dekapolis; Josephus noemt haar de grootste ervan."
    - "Toen de oorlog met Rome in 66 n.Chr. uitbrak, keerden de Grieken van Scythopolis zich tegen de Joden die aan hun zijde hadden gevochten en doodden, zegt Josephus, meer dan 13.000 van hen. In 67 n.Chr. verzamelde Vespasianus er zijn legioenen voordat hij naar Tiberias optrok. De Romeinse stad had straten met zuilengalerijen, een theater en baden. Eusebius noemt haar een beroemde stad van Palestina, en in het begin van de vijfde eeuw was zij de hoofdstad van de provincie Palaestina Secunda."
  cs:
    - "Bét-šan stojí na vysokém pahorku Tel Bét-še'an, kde Jizreelské údolí sestupuje kolem Gilboi do Jordánského údolí; římské a byzantské město Skythopolis se rozkládalo u jeho paty. Pahorek byl osídlen již v 5. tisíciletí př. n. l. Thutmosis III. jmenoval Bét-šan ve svém seznamu kenaanských měst v Karnaku v 15. století př. n. l. a v jednom amarnském listě si Abdi-Heba z Jeruzaléma stěžuje, že muži z Gatu měli v Bét-šanu posádku. Pensylvánská univerzita, která zde kopala v letech 1921–1933, našla čedičové stély Setiho I. a Ramesse II. z doby, kdy Egypt město držel; jedna vypráví, jak Seti I. poslal do Bét-šanu divizi vojska, když se vládce nedalekého města pokusil Bét-šanu zmocnit."
    - "Bét-šan byl přidělen Manasesovi, ale kmen nevyhnal jeho Kanaánce, jejichž železných vozů se synové Josefovi báli. Poté, co Saul a jeho synové padli na hoře Gilboa, Pelištejci vložili jeho zbroj do domu Aštarót a připevnili jeho tělo ke zdi Bét-šanu; muži z Jabeše gileadského šli celou noc a těla sňali a David později vzal od nich kosti. Za Šalomouna patřilo město k okresu Baanovu a faraon Šíšak je uvedl v Karnaku mezi městy svého tažení koncem 10. století př. n. l. Město doby železné skončilo požárem v 8. století př. n. l., obvykle spojovaným s asyrským dobytím roku 732 př. n. l."
    - "V helénistické době se místo stalo řeckým městem, Nysa-Skythopolis; seleukovské město na sousedním pahorku Tell Iztabba bylo založeno za Antiocha IV. Plinius vysvětluje jméno Skythopolis kolonií Skythů, ale jeho původ je sporný. Podle 2. knihy Makabejské svědčili Židé ze Skythopole, že s nimi jeho lid zacházel laskavě, a Juda a jeho muži jim poděkovali a šli dál do Jeruzaléma. Kolem roku 107 př. n. l. bylo město zrazeno vojsku Jana Hyrkána. Pompeius je osvobodil od židovské vlády roku 63 př. n. l., Gabinius je přestavěl a počítalo se mezi města Dekapole; Josephus Flavius je nazývá největším z nich."
    - "Když roku 66 n. l. vypukla válka s Římem, Řekové ze Skythopole se obrátili proti Židům, kteří bojovali na jejich straně, a podle Josepha Flavia jich zabili přes 13 000. Roku 67 n. l. tam Vespasianus shromáždil své legie, než pochodoval na Tiberias. Římské město mělo ulice se sloupořadími, divadlo a lázně. Eusebios je nazývá slavným městem Palestiny a počátkem 5. století bylo hlavním městem provincie Druhá Palestina."
  sv:
    - "Bet-Shean ligger på en hög kulle, Tel Beth-Shean, där Jisreeldalen löper ner förbi berget Gilboa till Jordandalen; den romerska och bysantinska staden Skythopolis bredde ut sig vid dess fot. Kullen var bebodd redan under femte årtusendet f.Kr. Thutmosis III nämnde Bet-Shean i sin förteckning över kananeiska städer i Karnak på 1400-talet f.Kr., och i ett Amarnabrev klagar Avdi-Heba av Jerusalem över att männen från Gat hade en garnison i Bet-Shean. University of Pennsylvania, som grävde här 1921–1933, fann basaltstelar av Seti I och Ramses II från den tid då Egypten höll staden; en av dem berättar hur Seti I sände en arméavdelning till Bet-Shean när härskaren i en närbelägen stad försökte lägga beslag på den."
    - "Bet-Shean tilldelades Manasse, men stammen fördrev inte kananéerna, vars stridsvagnar av järn Josefs barn fruktade. Sedan Saul och hans söner fallit på berget Gilboa lade filistéerna hans vapen i Astartetemplet och hängde upp hans kropp på Bet-Sheans mur; männen från Javesh i Gilead gick hela natten och tog ner kropparna, och David hämtade senare benen från dem. Under Salomo hörde staden till Baanas distrikt, och farao Shishak förtecknade den i Karnak bland städerna under sitt fälttåg i slutet av 900-talet f.Kr. Järnålderns stad gick under i eld på 700-talet f.Kr., vanligen knutet till den assyriska erövringen 732 f.Kr."
    - "Under hellenismen blev platsen en grekisk stad, Nysa-Skythopolis; en seleukidisk stad på den närliggande höjden Tell Iztabba grundades under Antiochos IV. Plinius förklarar namnet Skythopolis med en koloni av skyter, men dess ursprung är omtvistat. Enligt Andra Mackabeerboken vittnade judarna i Skythopolis om att stadens invånare hade behandlat dem vänligt, och Judas och hans män tackade dem och drog vidare till Jerusalem. Omkring 107 f.Kr. förråddes staden till Johannes Hyrkanos trupper. Pompejus befriade den från judiskt välde 63 f.Kr., Gabinius byggde upp den på nytt, och den räknades till städerna i Dekapolis; Josefus kallar den den största av dem."
    - "När kriget mot Rom bröt ut år 66 e.Kr. vände sig grekerna i Skythopolis mot de judar som hade kämpat på deras sida och dödade, säger Josefus, över 13 000 av dem. År 67 e.Kr. samlade Vespasianus sina legioner där innan han tågade mot Tiberias. Den romerska staden hade gator med kolonnader, en teater och bad. Eusebios kallar den en berömd stad i Palestina, och i början av 400-talet var den huvudstad i provinsen Palaestina Secunda."
  nb:
    - "Bet-Sjean ligger på en høy tell, Tel Beth-Shean, der Jisreel-dalen går ned forbi Gilboa til Jordandalen; den romerske og bysantinske byen Skytopolis bredte seg ut ved foten av den. Haugen var bosatt allerede i det femte årtusen f.Kr. Tutmosis III nevnte Bet-Sjean i sin liste over kanaanittiske byer i Karnak på 1400-tallet f.Kr., og i et Amarna-brev klager Abdi-Heba av Jerusalem over at mennene fra Gat hadde en garnison i Bet-Sjean. University of Pennsylvania, som gravde her i 1921–1933, fant basaltstelaer av Seti I og Ramses II fra den tiden da Egypt holdt byen; en av dem forteller hvordan Seti I sendte en hærdivisjon til Bet-Sjean da herskeren i en by i nærheten forsøkte å ta den."
    - "Bet-Sjean ble tildelt Manasse, men stammen drev ikke ut kanaanittene, hvis jernvogner Josefs barn fryktet. Etter at Saul og hans sønner var falt på Gilboa, la filistrene hans våpen i Astartetemplet og hengte kroppen hans opp på muren i Bet-Sjean; mennene fra Jabesj-Gilead gikk hele natten og tok likene ned, og David hentet senere beinene fra dem. Under Salomo hørte byen til Baanas distrikt, og farao Sjisjak førte den opp i Karnak blant byene på sitt felttog sent på 900-tallet f.Kr. Jernalderbyen endte i brann på 700-tallet f.Kr., vanligvis knyttet til den assyriske erobringen i 732 f.Kr."
    - "I hellenistisk tid ble stedet en gresk by, Nysa-Skytopolis; en seleukidisk by på den nærliggende høyden Tell Iztabba ble grunnlagt under Antiokos IV. Plinius forklarer navnet Skytopolis med en koloni av skytere, men opprinnelsen er omstridt. Ifølge 2. Makkabeerbok vitnet jødene i Skytopolis om at byens folk hadde behandlet dem vennlig, og Judas og hans menn takket dem og dro videre til Jerusalem. Omkring 107 f.Kr. ble byen forrådt til Johannes Hyrkanos' styrker. Pompeius løste den fra jødisk herredømme i 63 f.Kr., Gabinius gjenoppbygde den, og den ble regnet blant byene i Dekapolis; Josefus kaller den den største av dem."
    - "Da krigen mot Roma brøt ut i 66 e.Kr., vendte grekerne i Skytopolis seg mot jødene som hadde kjempet på deres side og drepte, ifølge Josefus, mer enn 13 000 av dem. I 67 e.Kr. samlet Vespasian sine legioner der før han marsjerte mot Tiberias. Den romerske byen hadde gater med søylegang, et teater og bad. Eusebius kaller den en berømt by i Palestina, og tidlig på 400-tallet var den hovedbyen i provinsen Palaestina Secunda."
  tl:
    - "Ang Beth-san ay nakatayo sa isang mataas na tel, ang Tel Beth-Shean, kung saan ang Libis ng Jezreel ay bumababa sa tabi ng Bundok Gilboa tungo sa Libis ng Jordan; ang lungsod ng Scythopolis noong panahong Romano at Bizantino ay lumaganap sa paanan nito. Tinirhan ang tel noong ika-5 milenyo BK. Pinangalanan ni Thutmose III ang Beth-san sa kaniyang talaan ng mga bayang Cananeo sa Karnak noong ika-15 siglo BK, at sa isang liham sa Amarna ay dumaraing si Abdi-Heba ng Jerusalem na ang mga lalaki ng Gath ay may bantay-sundalo sa Beth-san. Ang Pamantasan ng Pennsylvania, na humukay rito noong 1921–1933, ay nakatagpo ng mga basaltong estela nina Seti I at Ramses II mula sa panahong hawak ng Egipto ang bayan; isa ang naglalahad kung paano nagpadala si Seti I ng isang dibisyon ng hukbo sa Beth-san nang tangkaing agawin ito ng pinuno ng kalapit na bayan."
    - "Ang Beth-san ay itinakda sa Manases, ngunit hindi pinalayas ng lipi ang mga Cananeo roon, na ang mga karwaheng bakal ay kinatakutan ng mga anak ni Jose. Nang mabuwal si Saul at ang kaniyang mga anak sa Bundok Gilboa, inilagay ng mga Filisteo ang kaniyang baluti sa bahay ni Astarot at ibinitin ang kaniyang bangkay sa pader ng Beth-san; magdamag na naglakad ang mga lalaki ng Jabes-galaad at ibinaba ang mga bangkay, at kinuha ni David pagkatapos ang mga buto mula sa kanila. Sa ilalim ni Salomon, ang bayan ay kabilang sa distrito ni Baana, at itinala ito ni Faraon Sisac sa Karnak sa mga bayan ng kaniyang paglusob noong huling bahagi ng ika-10 siglo BK. Ang bayan ng Panahon ng Bakal ay nagwakas sa apoy noong ika-8 siglo BK, na karaniwang iniuugnay sa pananakop ng Asiria noong 732 BK."
    - "Noong panahong Helenistiko, ang pook ay naging lungsod Griyego, ang Nysa-Scythopolis; isang bayang Seleucida sa kalapit na burol ng Tell Iztabba ang itinatag sa ilalim ni Antiochus IV. Ipinaliliwanag ni Plinio ang pangalang Scythopolis sa pamamagitan ng kolonya ng mga Scita, ngunit pinagtatalunan ang pinagmulan nito. Ayon sa 2 Macabeo, nagpatotoo ang mga Judio ng Scythopolis na mabuti ang pakikitungo sa kanila ng mga taga-roon, at nagpasalamat sa kanila sina Judas at ang kaniyang mga tauhan at nagpatuloy sa Jerusalem. Noong mga 107 BK, ipinagkanulo ang lungsod sa mga puwersa ni Juan Hyrcano. Pinalaya ito ni Pompeyo mula sa pamamahalang Judio noong 63 BK, muling itinayo ito ni Gabinio, at ibinilang ito sa mga lungsod ng Decapolis; tinatawag ito ni Josefo na pinakamalaki sa mga ito."
    - "Nang sumiklab ang digmaan sa Roma noong 66 AD, bumaling ang mga Griyego ng Scythopolis laban sa mga Judiong nakipaglaban sa kanilang panig at, ayon kay Josefo, pinatay ang mahigit 13,000 sa mga ito. Noong 67 AD, tinipon ni Vespasiano ang kaniyang mga legiyon doon bago magmartsa patungong Tiberias. Ang lungsod na Romano ay may mga lansangang may hanay ng haligi, isang dulaan, at mga paliguan. Tinatawag ito ni Eusebio na bantog na lungsod ng Palestina, at pagsapit ng maagang ika-5 siglo ito ang pangunahing lungsod ng lalawigan ng Ikalawang Palestina."
  da:
    - "Bet-Sjan ligger på en høj banke, Tel Bet-Sjean, hvor Jizre'el-dalen kommer ned forbi Gilboa-bjerget til Jordandalen; det romerske og byzantinske Skythopolis bredte sig ud ved dens fod. Banken var bosat allerede i det femte årtusinde f.Kr. Thutmosis 3. nævnte Bet-Sjan i sin liste over kanaanæiske byer i Karnak i 1400-tallet f.Kr., og i et Amarna-brev klager Abdi-Heba af Jerusalem over, at mændene fra Gat havde en garnison i Bet-Sjan. University of Pennsylvania, som gravede her i 1921–1933, fandt basaltstelaer af Seti 1. og Ramses 2. fra den tid, da Egypten holdt byen; på den ene fortælles det, hvordan Seti 1. sendte en hærafdeling til Bet-Sjan, da herskeren over en nærliggende by forsøgte at tage den."
    - "Bet-Sjan blev tildelt Manasse, men stammen fordrev ikke dens kanaanæere, hvis jernvogne Josefs børn frygtede. Efter at Saul og hans sønner var faldet på Gilboa-bjerget, lagde filisterne hans våben i Asjtarots hus og hængte hans lig op på Bet-Sjans mur; mændene fra Jabesj i Gilead gik hele natten og tog ligene ned, og David hentede senere benene fra dem. Under Salomo hørte byen til Baanas distrikt, og farao Sjisjak opførte den i Karnak blandt de byer, han indtog på sit felttog i slutningen af 900-tallet f.Kr. Jernalderbyen endte i ild i 700-tallet f.Kr., sædvanligvis sat i forbindelse med assyrernes erobring i 732 f.Kr."
    - "I den hellenistiske tid blev stedet en græsk by, Nysa-Skythopolis; en seleukidisk by på den nærliggende banke Tell Iztabba blev grundlagt under Antiochos 4. Plinius forklarer navnet Skythopolis med en koloni af skytere, men dets oprindelse er omstridt. Ifølge 2 Makkabæerbog vidnede jøderne i Skythopolis om, at byens indbyggere havde behandlet dem venligt, og Judas og hans mænd takkede dem og drog videre til Jerusalem. Omkring 107 f.Kr. blev byen forrådt til Johannes Hyrkans styrker. Pompejus befriede den fra jødisk herredømme i 63 f.Kr., Gabinius genopbyggede den, og den regnedes blandt Dekapolis' byer; Josefus kalder den den største af dem."
    - "Da krigen med Rom brød ud i 66 e.Kr., vendte grækerne i Skythopolis sig mod de jøder, der havde kæmpet på deres side, og dræbte, siger Josefus, mere end 13.000 af dem. I 67 e.Kr. samlede Vespasian sine legioner dér, inden han marcherede mod Tiberias. Den romerske by havde søjlegader, et teater og bade. Eusebius kalder den en berømt by i Palæstina, og i begyndelsen af 400-tallet var den hovedby i provinsen Palæstina Secunda."
