# Overview article (ADR 0007). Mainstream facts only; disputed datings and identifications are named as such; Egyptian reigns are given by century only.
id: beth-shan
place: a2a8df0
title:
  en: "Beth-shan"
  ru: "Беф-Сан"
  uk: "Бет-Шеан"
  es: "Bet-seán"
  pt: "Bete-Seã"
  de: "Bet-Schean"
  fr: "Beth-Schean"
  it: "Beth-Shean"
  pl: "Bet-Szean"
  nl: "Beth-Sean"
