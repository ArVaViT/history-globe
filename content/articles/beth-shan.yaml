# Overview article (ADR 0007). Mainstream facts only; disputed datings and identifications are named as such; Egyptian reigns are given by century only.
id: beth-shan
place: a2a8df0
title:
  en: "Beth-shan"
  ru: "Беф-Сан"
body:
  en:
    - "Beth-shan stands on a high mound, Tel Beth-Shean, where the Jezreel Valley comes down past Mount Gilboa to the Jordan Valley; the Roman and Byzantine city of Scythopolis spread out at its foot. The mound was settled by the fifth millennium BC. Thutmose III named Beth-shan in his list of Canaanite towns at Karnak in the fifteenth century BC, and in an Amarna letter Abdi-Heba of Jerusalem complains that the men of Gath had a garrison in Beth-shan. The University of Pennsylvania, digging here in 1921–1933, found basalt stelae of Seti I and Ramesses II from the time when Egypt held the town; one tells how Seti I sent an army division to Beth-shan when the ruler of a nearby town tried to seize it."
    - "Beth-shan was assigned to Manasseh, but the tribe did not drive out its Canaanites, whose chariots of iron the children of Joseph feared. After Saul and his sons fell on Mount Gilboa, the Philistines put his armour in the house of Ashtaroth and fastened his body to the wall of Beth-shan; the men of Jabesh-gilead went all night and took the bodies down, and David later took the bones from them. Under Solomon the town belonged to the district of Baana, and Pharaoh Shishak listed it at Karnak among the towns of his campaign in the late tenth century BC. The Iron Age town ended in fire in the eighth century BC, usually tied to the Assyrian conquest of 732 BC."
    - "In the Hellenistic age the place became a Greek city, Nysa-Scythopolis; a Seleucid town on the neighbouring hill of Tell Iztabba was founded under Antiochus IV. Pliny explains the name Scythopolis by a colony of Scythians, but its origin is disputed. According to 2 Maccabees, the Jews of Scythopolis testified that its people had treated them kindly, and Judas and his men thanked them and went on to Jerusalem. About 107 BC the city was betrayed to the forces of John Hyrcanus. Pompey freed it from Jewish rule in 63 BC, Gabinius rebuilt it, and it was counted among the cities of the Decapolis; Josephus calls it the largest of them."
    - "When the war with Rome broke out in AD 66, the Greeks of Scythopolis turned on the Jews who had fought on their side and, Josephus says, killed more than 13,000 of them. In AD 67 Vespasian gathered his legions there before marching on Tiberias. The Roman city had colonnaded streets, a theatre and baths. Eusebius calls it a famous city of Palestine, and by the early fifth century it was the chief city of the province of Second Palestine."
  ru:
    - "Беф-Сан стоит на высоком холме Тель-Бейт-Шеан, там, где Изреельская долина спускается мимо горы Гелвуй к долине Иордана; у его подножия раскинулся римский и византийский город Скифополь. Холм был заселён уже в V тысячелетии до н. э. Тутмос III назвал Беф-Сан в своём списке ханаанских городов в Карнаке в XV веке до н. э., а в одном из амарнских писем Абди-Хеба из Иерусалима жалуется, что люди Гата держат гарнизон в Беф-Сане. Пенсильванский университет, копавший здесь в 1921–1933 гг., нашёл базальтовые стелы Сети I и Рамсеса II того времени, когда городом владел Египет; одна из них рассказывает, как Сети I послал войско к Беф-Сану, когда правитель соседнего города пытался его захватить."
    - "Беф-Сан достался Манассии, но колено не выгнало его хананеев, чьих железных колесниц боялись сыны Иосифа. Когда Саул и его сыновья пали на горе Гелвуй, филистимляне положили его оружие в капище Астарты, а тело повесили на стене Беф-Сана; жители Иависа Галаадского шли всю ночь и сняли тела, а позже Давид взял у них кости. При Соломоне город входил в округ Вааны, а фараон Сусаким в конце X века до н. э. перечислил его в Карнаке среди городов своего похода. Город железного века погиб в огне в VIII веке до н. э.; обычно это связывают с ассирийским завоеванием 732 г. до н. э."
    - "В эллинистическую эпоху здесь возник греческий город Ниса-Скифополь; селевкидский город на соседнем холме Телль-Изтабба был основан при Антиохе IV. Плиний объясняет имя Скифополь поселением скифов, но его происхождение спорно. По Второй книге Маккавейской, иудеи Скифополя засвидетельствовали, что его жители обходились с ними дружелюбно, и Иуда со своими людьми поблагодарил их и пошёл дальше в Иерусалим. Около 107 г. до н. э. город был предан войскам Иоанна Гиркана. Помпей освободил его от власти иудеев в 63 г. до н. э., Габиний отстроил, и его причисляли к городам Десятиградия; Иосиф Флавий называет его самым большим из них."
    - "Когда в 66 г. н. э. началась война с Римом, греки Скифополя обратились против иудеев, сражавшихся на их стороне, и, по словам Иосифа Флавия, перебили более 13 000 человек. В 67 г. н. э. Веспасиан собрал здесь свои легионы перед походом на Тивериаду. В римском городе были улицы-колоннады, театр и бани. Евсевий называет его знаменитым городом Палестины, а к началу V века он был главным городом провинции Вторая Палестина."
