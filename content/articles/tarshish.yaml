# Overview article (ADR 0007). Mainstream facts only; the location of Tarshish is given as disputed, with Tartessos as the view of most scholars.
id: tarshish
place: a5f43dd
title:
  en: "Tarshish"
  ru: "Фарсис"
  uk: "Тарсис"
  es: "Tarsis"
  pt: "Társis"
  de: "Tarsis"
  fr: "Tarsis"
body:
  en:
    - "Tarshish is the far western end of the biblical world: a land reached by sea, the source of silver, iron, tin and lead, and the name of the great sea-going vessels, the “ships of Tarshish”. Where it lay is disputed. Most scholars place it at Tartessos, the kingdom at the mouth of the Guadalquivir in south-western Spain, rich in silver, which Herodotus describes and with which the Phoenicians traded from Gadir (Cádiz). Others propose Sardinia, where a Phoenician inscription of the ninth or eighth century BC, the Nora Stone, may name Tarshish; Carthage, Tarsus in Cilicia and Cyprus have also been suggested. An inscription of Esarhaddon (680–669 BC) says that all the kings in the midst of the sea, from Cyprus and Ionia as far as Tarsisi, bowed at his feet and paid him tribute."
    - "In the Table of Nations Tarshish is a son of Javan, the Greeks. Solomon's “navy of Tharshish” sailed with Hiram's ships and “once in three years came the navy of Tharshish, bringing gold, and silver, ivory, and apes, and peacocks”; Jehoshaphat's ships were wrecked at Ezion-geber on the Red Sea before they could sail, and since Kings says they were bound for Ophir and Chronicles for Tarshish, a “ship of Tarshish” may simply have meant a large merchantman. Ezekiel names Tarshish as Tyre's merchant “with silver, iron, tin, and lead”; Jeremiah knows “silver spread into plates” brought from Tarshish; Isaiah bids its ships howl at the fall of Tyre and sees them bringing Zion's sons home; Psalm 72 has “the kings of Tarshish and of the isles” bring presents."
    - "Jonah, sent east to Nineveh, “rose up to flee unto Tarshish” and found at Joppa a ship bound there, the end of the earth in the opposite direction. The Septuagint mostly transliterates the name but in places renders it as Carthage or simply “the sea”; Josephus took it for Tarsus. Tartessos disappears from history in the sixth century BC, but the Phoenician silver trade went on from Gadir, and the mines of the Río Tinto near Huelva were worked into Roman times and again in the nineteenth and twentieth centuries. The Phoenician and Tartessian sites around Huelva and Cádiz are the richest archaeological witness to the trade."
  ru:
    - "Фарсис — крайний запад библейского мира: земля, куда ходили морем, откуда везли серебро, железо, олово и свинец, и имя больших морских судов — «кораблей Фарсисских». Где он лежал, спорно. Большинство учёных помещают его в Тартесс, богатое серебром царство в устье Гвадалквивира на юго-западе Испании, которое описывает Геродот и с которым финикийцы торговали из Гадира (Кадиса). Другие предлагают Сардинию, где финикийская надпись IX или VIII века до н. э., стела из Норы, возможно, называет Фарсис; предлагали также Карфаген, Тарс в Киликии и Кипр. Надпись Асархаддона (680–669 гг. до н. э.) говорит, что все цари посреди моря, от Кипра и Ионии до Тарсиси, склонились к его ногам и платили ему дань."
    - "В родословии народов Фарсис — сын Иавана, то есть греков. Соломонов «Фарсисский корабль» ходил вместе с кораблём Хирама, и «в три года раз приходил Фарсисский корабль, привозивший золото и серебро, и слоновую кость, и обезьян, и павлинов»; корабли Иосафата разбились в Ецион-Гавере на Красном море, не успев выйти, и поскольку книга Царств отправляет их в Офир, а Паралипоменон — в Фарсис, «корабль Фарсисский» мог значить просто большое торговое судно. Иезекииль называет Фарсис торговцем Тира, платившим «серебром, железом, свинцом и оловом»; Иеремия знает «разбитое в листы серебро», привезённое из Фарсиса; Исаия велит его кораблям рыдать о падении Тира и видит, как они везут домой сынов Сиона; в псалме «цари Фарсиса и островов поднесут ему дань»."
    - "Иона, посланный на восток в Ниневию, встал, «чтобы бежать в Фарсис», и нашёл в Иоппии корабль туда — на край земли в противоположную сторону. Септуагинта чаще всего передаёт имя буквами, но местами пишет «Карфаген» или просто «море»; Иосиф Флавий принимал его за Тарс. Тартесс исчезает из истории в VI веке до н. э., но финикийская торговля серебром продолжалась из Гадира, а рудники Рио-Тинто близ Уэльвы разрабатывали и в римское время, и снова в XIX–XX веках. Финикийские и тартессийские памятники вокруг Уэльвы и Кадиса — самое богатое археологическое свидетельство этой торговли."
  uk:
    - "Тарсис — це далекий західний край біблійного світу: земля, до якої добираються морем, джерело срібла, заліза, олова й свинцю, а також назва великих морехідних суден, «Тарсійських кораблів». Де він лежав, спірно. Більшість учених розміщують його в Тартессі, царстві в гирлі Гвадалквівіру на південному заході Іспанії, багатому на срібло, яке описує Геродот і з яким фінікійці торгували з Гадіру (Кадіс). Інші пропонують Сардинію, де фінікійський напис IX чи VIII ст. до н. е., камінь з Нори, можливо, називає Тарсис; пропонували також Карфаген, Тарс у Кілікії та Кіпр. Напис Асархаддона (680–669 рр. до н. е.) каже, що всі царі посеред моря, від Кіпру й Іонії аж до Тарсісі, схилилися до його ніг і заплатили йому данину."
    - "У Таблиці народів Тарсис — син Явана, тобто греків. «Тарсійські кораблї» Соломона плавали разом з кораблями Хірама, і «що три роки приходили Тарсійські кораблї й привозили золото, слонову кість і обізян і пави»; кораблі Йосафата розбилися в Еціон-Гевері на Червоному морі, не встигши відплисти, а що Книга Царів каже, що вони йшли до Офіру, а Хроніки — до Тарсису, то «Тарсійський корабель» міг означати просто великий торговий корабель. Єзекіїль називає Тарсис торговим партнером Тіру, що привозить срібло, залізо, олово й свинець; Єремія знає «Розплескане в листки срібло, привезене з Тарсису»; Ісая велить його кораблям ридати над падінням Тіру й бачить, як вони перевозять синів Сіону додому; Псалом 72 каже: «Царі Тарзийські, і з островів, принесуть дарунки»."
    - "Йона, посланий на схід до Ніневії, «устав, щоб утїкати від Господа в Тарсис» і знайшов в Яффі корабель, що йшов туди, — кінець землі в протилежному напрямку. Септуагінта здебільшого транслітерує назву, але подекуди передає її як Карфаген чи просто «море»; Йосиф Флавій вважав її Тарсом. Тартесс зникає з історії в VI ст. до н. е., але фінікійська торгівля сріблом із Гадіру тривала, а копальні Ріо-Тінто поблизу Уельви розробляли до римських часів і знову в XIX–XX століттях. Фінікійські й тартеські пам’ятки навколо Уельви та Кадіса — найбагатше археологічне свідчення цієї торгівлі."
  es:
    - "Tarsis es el extremo occidental lejano del mundo bíblico: una tierra a la que se llega por mar, fuente de plata, hierro, estaño y plomo, y el nombre de las grandes embarcaciones de altura, las «naves de Tarsis». Se discute dónde estaba. La mayoría de los estudiosos la sitúan en Tartessos, el reino de la desembocadura del Guadalquivir, en el suroeste de España, rico en plata, que describe Heródoto y con el que comerciaban los fenicios desde Gadir (Cádiz). Otros proponen Cerdeña, donde una inscripción fenicia del siglo IX o VIII a. C., la estela de Nora, puede nombrar Tarsis; también se han sugerido Cartago, Tarso de Cilicia y Chipre. Una inscripción de Esar-hadón (680–669 a. C.) dice que todos los reyes en medio del mar, desde Chipre y Jonia hasta Tarsisi, se postraron a sus pies y le pagaron tributo."
    - "En la Tabla de las Naciones, Tarsis es hijo de Javán, los griegos. La «flota de Tharsis» de Salomón navegaba con las naves de Hiram y «una vez en cada tres años venía la flota de Tharsis, y traía oro, plata, marfil, simios y pavos»; las naves de Josafat se rompieron en Ezión-geber, en el Mar Rojo, antes de poder zarpar, y como Reyes dice que iban a Ofir y Crónicas que a Tarsis, las «naves de Tarsis» pueden haber designado simplemente grandes mercantes. Ezequiel nombra a Tarsis como mercader de Tiro «en plata, hierro, estaño, y plomo»; Jeremías conoce la «plata extendida» traída de Tarsis; Isaías manda aullar a sus naves ante la caída de Tiro y las ve traer a los hijos de Sion a casa; el Salmo 72 hace que «los reyes de Tharsis y de las islas» traigan presentes."
    - "Jonás, enviado al este, a Nínive, «se levantó para huir … á Tarsis» y halló en Jope una nave que partía para allá, el fin de la tierra en la dirección opuesta. La Septuaginta en su mayor parte transcribe el nombre, pero en algunos lugares lo traduce como Cartago o simplemente «el mar»; Josefo lo tomó por Tarso. Tartessos desaparece de la historia en el siglo VI a. C., pero el comercio fenicio de la plata continuó desde Gadir, y las minas de Río Tinto, cerca de Huelva, se explotaron hasta época romana y de nuevo en los siglos XIX y XX. Los sitios fenicios y tartesios en torno a Huelva y Cádiz son el testimonio arqueológico más rico de ese comercio."
  pt:
    - "Társis é o extremo ocidental do mundo bíblico: uma terra alcançada por mar, fonte de prata, ferro, estanho e chumbo, e o nome dos grandes navios de alto-mar, os “navios de Társis”. Onde ficava é discutido. A maioria dos estudiosos a situa em Tartessos, o reino na foz do Guadalquivir, no sudoeste da Espanha, rico em prata, que Heródoto descreve e com o qual os fenícios comerciavam desde Gadir (Cádis). Outros propõem a Sardenha, onde uma inscrição fenícia do século IX ou VIII a.C., a Pedra de Nora, pode nomear Társis; Cartago, Tarso, na Cilícia, e Chipre também foram sugeridas. Uma inscrição de Esar-Hadom (680–669 a.C.) diz que todos os reis no meio do mar, de Chipre e da Jônia até Tarsisi, se curvaram a seus pés e lhe pagaram tributo."
    - "Na Tabela das Nações, Társis é filho de Javã, os gregos. A “frota de navios de Társis” de Salomão navegava com os navios de Hirão, e “Uma vez a cada três anos a frota de Társis vinha trazendo ouro, prata, marfim, macacos e pavões”; os navios de Josafá naufragaram em Eziom-Geber, no Mar Vermelho, antes de zarpar, e como Reis diz que iam a Ofir e Crônicas a Társis, um “navio de Társis” pode ter significado simplesmente um grande mercante. Ezequiel nomeia Társis como mercadora de Tiro, que trocava “prata, ferro, estanho e chumbo”; Jeremias conhece a “prata batida em placas” trazida de Társis; Isaías manda seus navios lamentarem a queda de Tiro e os vê trazendo de volta os filhos de Sião; o Salmo 72 faz “os reis de Társis e das ilhas” trazerem tributos."
    - "Jonas, enviado a leste, a Nínive, “se levantou para fugir da presença do SENHOR para Társis” e achou em Jope um navio que ia para lá, o fim da terra na direção oposta. A Septuaginta na maior parte translitera o nome, mas em alguns trechos o traduz por Cartago ou simplesmente “o mar”; Josefo a tomou por Tarso. Tartessos desaparece da história no século VI a.C., mas o comércio fenício da prata continuou a partir de Gadir, e as minas do Río Tinto, perto de Huelva, foram exploradas até a época romana e de novo nos séculos XIX e XX. Os sítios fenícios e tartéssicos em torno de Huelva e Cádis são o testemunho arqueológico mais rico desse comércio."
  de:
    - "Tarsis ist das ferne westliche Ende der biblischen Welt: ein Land, das man zur See erreichte, Quelle von Silber, Eisen, Zinn und Blei, und der Name der großen Hochseeschiffe, der „Tharsisschiffe“. Wo es lag, ist umstritten. Die meisten Forscher setzen es mit Tartessos gleich, dem Königreich an der Mündung des Guadalquivir im Südwesten Spaniens, reich an Silber, das Herodot beschreibt und mit dem die Phönizier von Gadir (Cádiz) aus Handel trieben. Andere schlagen Sardinien vor, wo eine phönizische Inschrift des neunten oder achten Jahrhunderts v. Chr., der Nora-Stein, Tarsis nennen könnte; auch Karthago, Tarsus in Kilikien und Zypern wurden vorgeschlagen. Eine Inschrift Asarhaddons (680–669 v. Chr.) sagt, alle Könige inmitten des Meeres, von Zypern und Ionien bis Tarsisi, hätten sich ihm zu Füßen geworfen und Tribut gezahlt."
    - "In der Völkertafel ist Tarsis ein Sohn Jawans, der Griechen. Salomos Tarsis-Flotte fuhr mit Hirams Schiffen, und „die Meerschiffe des Königs … kamen in drei Jahren einmal und brachten Gold, Silber, Elfenbein, Affen und Pfauen“; Josaphats Schiffe scheiterten bei Ezjon-Geber am Roten Meer, ehe sie auslaufen konnten, und da sie nach den Königen für Ofir und nach der Chronik für Tarsis bestimmt waren, kann ein Tarsisschiff schlicht einen großen Frachter bedeutet haben. Hesekiel nennt Tarsis den Händler von Tyrus mit „Silber, Eisen, Zinn und Blei“; Jeremia kennt „Silbernes Blech“ aus Tarsis; Jesaja heißt seine Schiffe heulen beim Fall von Tyrus und sieht sie Zions Söhne heimbringen; Psalm 72 lässt „die Könige zu Tharsis und auf den Inseln“ Geschenke bringen."
    - "Jona, nach Osten nach Ninive gesandt, „machte sich auf und floh vor dem HERRN und wollte gen Tharsis“ und fand in Joppe ein Schiff dorthin, das Ende der Erde in der entgegengesetzten Richtung. Die Septuaginta transliteriert den Namen meist, gibt ihn aber an Stellen mit Karthago oder einfach mit „das Meer“ wieder; Josephus hielt ihn für Tarsus. Tartessos verschwindet im sechsten Jahrhundert v. Chr. aus der Geschichte, doch der phönizische Silberhandel ging von Gadir aus weiter, und die Minen des Río Tinto bei Huelva wurden bis in die Römerzeit und erneut im neunzehnten und zwanzigsten Jahrhundert abgebaut. Die phönizischen und tartessischen Stätten um Huelva und Cádiz sind der reichste archäologische Zeuge dieses Handels."
  fr:
    - "Tarsis est l’extrême ouest du monde biblique : pays atteint par mer, source d’argent, de fer, d’étain et de plomb, et nom des grands navires hauturiers, les « navires de Tarsis ». Sa localisation est discutée. La plupart des spécialistes la placent à Tartessos, le royaume de l’embouchure du Guadalquivir, dans le sud-ouest de l’Espagne, riche en argent, que décrit Hérodote et avec lequel les Phéniciens commerçaient depuis Gadir (Cadix). D’autres proposent la Sardaigne, où une inscription phénicienne du IXe ou VIIIe siècle av. J.-C., la pierre de Nora, nomme peut-être Tarsis ; Carthage, Tarse de Cilicie et Chypre ont aussi été suggérées. Une inscription d’Esar-Haddon (680-669 av. J.-C.) dit que tous les rois du milieu de la mer, de Chypre et de l’Ionie jusqu’à Tarsisi, s’inclinèrent à ses pieds et lui payèrent tribut."
    - "Dans la Table des nations, Tarsis est un fils de Javan, les Grecs. La flotte de Tarsis de Salomon naviguait avec les navires de Hiram : « tous les trois ans arrivaient les navires de Tarsis, apportant de l’or et de l’argent, de l’ivoire, des singes et des paons » ; les navires de Josaphat furent brisés à Etsjon-Guéber, sur la mer Rouge, avant de pouvoir partir, et comme les Rois les disent destinés à Ophir et les Chroniques à Tarsis, un « navire de Tarsis » pouvait désigner simplement un grand cargo. Ézéchiel nomme Tarsis comme le marchand de Tyr « d’argent, de fer, d’étain et de plomb » ; Jérémie connaît les « lames d’argent » apportées de Tarsis ; Ésaïe somme ses navires de se lamenter sur la chute de Tyr et les voit ramener les fils de Sion ; le psaume 72 fait apporter des présents par « les rois de Tarsis et des îles »."
    - "Jonas, envoyé à l’est vers Ninive, « se leva pour s’enfuir à Tarsis » et trouva à Joppé un navire qui y allait, le bout de la terre dans la direction opposée. La Septante translittère le plus souvent le nom, mais le rend par endroits par Carthage ou simplement « la mer » ; Josèphe l’identifiait à Tarse. Tartessos disparaît de l’histoire au VIe siècle av. J.-C., mais le commerce phénicien de l’argent se poursuivit depuis Gadir, et les mines du Río Tinto près de Huelva furent exploitées jusqu’à l’époque romaine, puis de nouveau aux XIXe et XXe siècles. Les sites phéniciens et tartessiens autour de Huelva et de Cadix sont le plus riche témoin archéologique de ce commerce."
