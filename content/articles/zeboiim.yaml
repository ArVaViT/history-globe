body:
  en:
    - "Zeboiim was one of the cities of the plain, the five towns of the Jordan valley by the Dead Sea that Genesis names together: Sodom, Gomorrah, Admah, Zeboiim and Bela, which is Zoar. The border of the Canaanites ran “unto Sodom, and Gomorrah, and Admah, and Zeboim, even unto Lasha”. In the war of the four kings Shemeber king of Zeboiim marched out with his neighbours and “joined battle with them in the vale of Siddim”, “which is the salt sea”, and the kings of Sodom and Gomorrah fell into the slime pits as they fled."
    - "The story of the overthrow names only Sodom and Gomorrah, but the Law remembers all four, and Hosea names Admah and Zeboim. Moses warned that the land of a faithless Israel would become brimstone and salt, “like the overthrow of Sodom, and Gomorrah, Admah, and Zeboim, which the LORD overthrew in his anger”, and Hosea gives God's reluctance its most tender words: “how shall I make thee as Admah? how shall I set thee as Zeboim? mine heart is turned within me”. The Synodal Bible spells the name Tsevoim in Genesis 10 and Sevoim elsewhere. A valley of Zeboim near Michmash and a town of that name in Benjamin after the exile are different places."
    - "No site is known. Those who put the cities at the southern end of the Dead Sea point to the Early Bronze Age towns and cemeteries on its south-eastern shore, surveyed together in 1973: Bab edh-Dhra, Numeira, Safi, Feifa and Khanazir, five sites for five cities, though only the first two proved to be walled towns of that age; Feifa and Khanazir have been suggested for Zeboiim, and those who put the cities north of the sea, in the plain opposite Jericho, have suggested Tall Mustah, but nothing ties any of them to the name. Josephus and Strabo still spoke of the burnt land of Sodom beside the lake, and Eusebius knew nothing more. Today the southern basin of the Dead Sea has largely dried into the evaporation pans of the potash works, and the south-eastern shore is the Ghor es-Safi in Jordan."
  ru:
    - "Севоим был одним из городов долины, пяти городов Иорданской равнины у Мёртвого моря, которые книга Бытия называет вместе: Содом, Гоморра, Адма, Севоим и Бела, она же Сигор. Пределы Хананеев шли «к Содому, Гоморре, Адме и Цевоиму до Лаши». В войне четырёх царей Шемевер, царь Севоимский, выступил вместе с соседями, и они «вступили в сражение с ними в долине Сиддим», «где ныне море Соленое», а цари Содомский и Гоморрский, обратившись в бегство, упали в смоляные ямы."
    - "Рассказ о гибели называет только Содом и Гоморру, но Закон помнит все четыре города, а Осия называет Адму и Севоим. Моисей предупреждал, что земля неверного Израиля станет серой и солью, «как по истреблении Содома, Гоморры, Адмы и Севоима, которые ниспроверг Господь во гневе Своем», а Осия даёт нежеланию Бога самые нежные слова: «Поступлю ли с тобою, как с Адамом, сделаю ли тебе, что Севоиму? Повернулось во Мне сердце Мое». Синодальный перевод пишет Цевоим в десятой главе Бытия и Севоим в остальных местах. Долина Цевоим близ Михмаса и город того же имени в уделе Вениамина после плена — другие места."
    - "Место неизвестно. Те, кто помещает города у южного конца Мёртвого моря, указывают на города и кладбища раннего бронзового века, на его юго-восточном берегу, обследованные вместе в 1973 году, — Баб-эд-Дра, Нумейра, Сафи, Фейфа и Ханазир, пять мест для пяти городов, хотя городами со стенами того времени оказались лишь первые два; для Севоима предлагали Фейфу и Ханазир, а те, кто ищет города к северу от моря, на равнине против Иерихона, предлагали Телль-Мустах, но ничто не связывает ни одно из этих мест с этим именем. Иосиф Флавий и Страбон ещё говорили о выжженной земле Содома у озера, а Евсевий не знал ничего больше. Сегодня южная котловина Мёртвого моря почти высохла, превратившись в испарительные бассейны калийных заводов, а юго-восточный берег — это Гор-эс-Сафи в Иордании."
  uk:
    - "Цевоїм був одним із міст рівнини, п’яти міст долини Йордану біля Мертвого моря, які Книга Буття називає разом: Содом, Гоморра, Адма, Цевоїм і Бела, тобто Сігор. Межа ханаанян ішла «до Содому і Гоморри й Адами й Зевоіму аж до Лаши». У війні чотирьох царів Шемевер, цар Цевоїму, вийшов із сусідами й «постали проти них на Сиддим-долинї», «се єсть теперенькі Море Солоне», а царі Содому й Гоморри попадали в ями, втікаючи."
    - "Розповідь про руйнування називає лише Содом і Гоморру, але Закон пам’ятає всі чотири, а Осія називає Адму і Цевоїм. Мойсей застерігав, що земля невірного Ізраїлю стане сіркою й сіллю, «як западня Содома і Гомора, Адама і Зебоїм, що перевернув їх Господь у гнїву свому і в досадї своїй», а Осія дає Божій неохоті найніжніші слова: «Чи зроблю з тобою те, що з Адамою, чи вчиню тобі те саме, що Севоїмові? Обернулось бо в менї серце моє». Синодальний переклад пише ім’я Цевоїм у Бутті 10 і Севоїм в інших місцях. Долина Цевоїм біля Міхмаса і місто з такою назвою у Веніяміні після вигнання — інші місця."
    - "Місце невідоме. Ті, хто ставить міста на південному краю Мертвого моря, вказують на міста й цвинтарі ранньої бронзової доби на його південно-східному березі, обстежені разом у 1973 році: Баб-ед-Дра, Нумейра, Сафі, Фейфа і Ханазір, п’ять місць для п’яти міст, хоч лише перші два виявилися муруваними містами тієї доби; для Цевоїма пропонували Фейфу і Ханазір, а ті, хто ставить міста на північ від моря, на рівнині навпроти Єрихона, пропонували Телль-Мустах, але ніщо не пов’язує жодне з них із цією назвою. Йосиф Флавій і Страбон ще говорили про випалену землю Содому біля озера, а Євсевій не знав нічого більше. Нині південний басейн Мертвого моря значною мірою висох у випарні ванни калійних заводів, а південно-східний берег — Гор-ес-Сафі в Йорданії."
  es:
    - "Zeboim fue una de las ciudades de la llanura, las cinco ciudades del valle del Jordán junto al mar Muerto que el Génesis nombra juntas: Sodoma, Gomorra, Adma, Zeboim y Bela, que es Zoar. La frontera de los cananeos iba «hasta entrar en Sodoma y Gomorra, Adma, y Zeboim hasta Lasa». En la guerra de los cuatro reyes, Semeber, rey de Zeboim, salió con sus vecinos y «ordenaron contra ellos batalla en el valle de Siddim», «que es el mar salado», y los reyes de Sodoma y Gomorra cayeron en los pozos de betún al huir."
    - "El relato de la destrucción nombra solo a Sodoma y Gomorra, pero la Ley recuerda a las cuatro, y Oseas nombra a Adma y Zeboim. Moisés advirtió que la tierra de un Israel infiel se convertiría en azufre y sal, «como en la subversión de Sodoma y de Gomorra, de Adma y de Seboim, que Jehová subvirtió en su furor y en su ira», y Oseas da a la reticencia de Dios sus palabras más tiernas: «¿cómo podré yo hacerte como Adma, ni ponerte como á Zeboim? Mi corazón se revuelve dentro de mí». La Biblia sinodal escribe el nombre Tsevoim en Génesis 10 y Sevoim en los demás lugares. Un valle de Zeboim cerca de Micmas y una ciudad de ese nombre en Benjamín tras el exilio son lugares distintos."
    - "No se conoce ningún emplazamiento. Quienes sitúan las ciudades en el extremo sur del mar Muerto señalan las ciudades y cementerios del Bronce Antiguo en su orilla sureste, prospectados conjuntamente en 1973: Bab edh-Dhra, Numeira, Safi, Feifa y Khanazir, cinco sitios para cinco ciudades, aunque solo los dos primeros resultaron ser ciudades amuralladas de esa época; para Zeboim se han propuesto Feifa y Khanazir, y quienes sitúan las ciudades al norte del mar, en la llanura frente a Jericó, han propuesto Tall Mustah, pero nada vincula a ninguno de ellos con el nombre. Josefo y Estrabón aún hablaban de la tierra quemada de Sodoma junto al lago, y Eusebio no sabía nada más. Hoy la cuenca meridional del mar Muerto se ha secado en gran parte en las balsas de evaporación de las plantas de potasa, y la orilla sureste es el Ghor es-Safi, en Jordania."
  pt:
    - "Zeboim foi uma das cidades da planície, as cinco cidades do vale do Jordão junto ao Mar Morto que Gênesis nomeia juntas: Sodoma, Gomorra, Admá, Zeboim e Belá, que é Zoar. A fronteira dos cananeus ia “na direção de Sodoma, Gomorra, Admá e Zeboim — até Lasa”. Na guerra dos quatro reis, Semeber, rei de Zeboim, saiu com seus vizinhos e “se colocaram em ordem de batalha contra eles no vale de Sidim”, “também chamado de Mar Salgado”, e os reis de Sodoma e Gomorra caíram nos poços de betume ao fugir."
    - "A história da destruição nomeia apenas Sodoma e Gomorra, mas a Lei lembra as quatro, e Oseias nomeia Admá e Zeboim. Moisés advertiu que a terra de um Israel infiel se tornaria enxofre e sal, “como a destruição de Sodoma, Gomorra, Admá e Zeboim, que o SENHOR destruiu na sua ira e no seu furor”, e Oseias dá à relutância de Deus suas palavras mais ternas: “Como posso torná-lo como Admá? Como posso torná-lo como Zeboim? Meu coração se revolve dentro de mim”. A Bíblia Sinodal grafa o nome Tsevoim em Gênesis 10 e Sevoim nos outros lugares. Um vale de Zeboim perto de Micmás e uma cidade desse nome em Benjamim depois do exílio são lugares diferentes."
    - "Nenhum sítio é conhecido. Os que põem as cidades na extremidade sul do Mar Morto apontam as cidades e cemitérios da Idade do Bronze Antigo na margem sudeste, prospectados juntos em 1973: Bab edh-Dhra, Numeira, Safi, Feifa e Khanazir, cinco sítios para cinco cidades, embora só os dois primeiros se revelassem cidades muradas dessa época; para Zeboim foram propostos Feifa e Khanazir, e os que põem as cidades ao norte do mar, na planície em frente a Jericó, propuseram Tall Mustah, mas nada liga nenhum deles ao nome. Josefo e Estrabão ainda falavam da terra queimada de Sodoma junto ao lago, e Eusébio nada mais sabia. Hoje a bacia sul do Mar Morto secou em grande parte em tanques de evaporação das fábricas de potássio, e a margem sudeste é o Ghor es-Safi, na Jordânia."
  de:
    - "Zeboim war eine der Städte der Ebene, der fünf Städte des Jordantals am Toten Meer, die die Genesis zusammen nennt: Sodom, Gomorra, Adma, Zeboim und Bela, das ist Zoar. Die Grenze der Kanaaniter verlief „bis man kommt gen Sodom, Gomorra, Adama, Zeboim und bis gen Lasa“. Im Krieg der vier Könige zog Schemeber, König von Zeboim, mit seinen Nachbarn aus: „und rüsteten sich, zu streiten im Tal Siddim“, „wo nun das Salzmeer ist“, und die Könige von Sodom und Gomorra fielen auf der Flucht in die Erdharzgruben."
    - "Die Erzählung vom Untergang nennt nur Sodom und Gomorra, doch das Gesetz erinnert an alle vier, und Hosea nennt Adama und Zeboim. Mose warnte, das Land eines treulosen Israels werde zu Schwefel und Salz, „gleich wie Sodom und Gomorra, Adama und Zeboim umgekehrt sind, die der HERR in seinem Zorn und Grimm umgekehrt hat“, und Hosea gibt Gottes Zögern seine zärtlichsten Worte: „Soll ich nicht billig ein Adama aus dir machen und dich wie Zeboim zurichten? Aber mein Herz ist andern Sinnes“. Die Synodalbibel schreibt den Namen in Genesis 10 Zewoim und sonst Sewoim. Ein Tal Zeboim bei Michmas und eine Stadt dieses Namens in Benjamin nach dem Exil sind andere Orte."
    - "Keine Stätte ist bekannt. Wer die Städte am Südende des Toten Meeres ansetzt, verweist auf die frühbronzezeitlichen Städte und Friedhöfe an seinem Südostufer, 1973 gemeinsam vermessen: Bab edh-Dhra, Numeira, Safi, Feifa und Khanazir, fünf Stätten für fünf Städte, obwohl sich nur die ersten beiden als ummauerte Städte jener Zeit erwiesen; für Zeboim wurden Feifa und Khanazir vorgeschlagen, und wer die Städte nördlich des Meeres in der Ebene gegenüber von Jericho ansetzt, hat Tall Mustah vorgeschlagen, doch nichts verbindet eine dieser Stätten mit dem Namen. Josephus und Strabon sprachen noch vom verbrannten Land Sodoms am See, und Eusebius wusste nichts weiter. Heute ist das südliche Becken des Toten Meeres weitgehend zu den Verdunstungsbecken der Kaliwerke ausgetrocknet, und das Südostufer ist der Ghor es-Safi in Jordanien."
  fr:
    - "Tseboïm était l’une des villes de la plaine, les cinq villes de la vallée du Jourdain près de la mer Morte que la Genèse nomme ensemble : Sodome, Gomorrhe, Adma, Tseboïm et Béla, qui est Tsoar. La frontière des Cananéens allait « du côté de Sodome, de Gomorrhe, d’Adma et de Tseboïm, jusqu’à Léscha ». Dans la guerre des quatre rois, Schémeéber, roi de Tseboïm, sortit avec ses voisins, et ils « se rangèrent en bataille contre eux, dans la vallée de Siddim », « qui est la mer Salée », et les rois de Sodome et de Gomorrhe tombèrent dans les puits de bitume en fuyant."
    - "Le récit de la destruction ne nomme que Sodome et Gomorrhe, mais la Loi se souvient des quatre, et Osée nomme Adma et Tseboïm. Moïse avertit que le pays d’un Israël infidèle deviendrait soufre et sel, « comme au bouleversement de Sodome, de Gomorrhe, d’Adma et de Tseboïm, que l’Éternel détruisit dans sa colère », et Osée donne à la répugnance de Dieu ses mots les plus tendres : « Te traiterai-je comme Adma ? Te rendrai-je semblable à Tseboïm ? Mon cœur s’agite au-dedans de moi ». La Bible synodale écrit le nom Tsevoim en Genèse 10 et Sevoim ailleurs. Une vallée de Tseboïm près de Micmasch et une ville de ce nom en Benjamin après l’exil sont d’autres lieux."
    - "Aucun site n’est connu. Ceux qui placent les villes à l’extrémité sud de la mer Morte désignent les villes et nécropoles du bronze ancien de sa rive sud-est, prospectées ensemble en 1973 : Bab edh-Dhra, Numeira, Safi, Feifa et Khanazir, cinq sites pour cinq villes, bien que seuls les deux premiers se soient révélés des villes fortifiées de cette époque ; Feifa et Khanazir ont été proposés pour Tseboïm, et ceux qui placent les villes au nord de la mer, dans la plaine en face de Jéricho, ont proposé Tall Mustah, mais rien ne rattache aucun d’eux au nom. Josèphe et Strabon parlaient encore de la terre brûlée de Sodome près du lac, et Eusèbe n’en savait pas plus. Aujourd’hui, le bassin sud de la mer Morte s’est en grande partie asséché en bassins d’évaporation des usines de potasse, et la rive sud-est est le Ghor es-Safi, en Jordanie."
  pl:
    - "Seboim było jednym z miast równiny, pięciu miast doliny Jordanu nad Morzem Martwym, które Księga Rodzaju wymienia razem: Sodomy, Gomory, Adma, Seboim i Beli, czyli Soaru. Granica Kananejczyków biegła „aż wnijdziesz do Sodomy i Gomorry, i Adamy, i Seboima, aż do Lazy”. W wojnie czterech królów Szemeber, król Seboim, wyruszył ze swymi sąsiadami i „uszykowali się ku bitwie przeciwko im w dolinie Syddym”, „ta jest teraz morzem słonem”, a królowie Sodomy i Gomory wpadli do dołów iłowatych, uciekając."
    - "Opowieść o zagładzie wymienia tylko Sodomę i Gomorę, ale Prawo pamięta wszystkie cztery, a Ozeasz wymienia Admę i Seboim. Mojżesz ostrzegał, że ziemia niewiernego Izraela stanie się siarką i solą, „na kształt podwrócenia Sodomy i Gomorry, Adamy i Seboim, które podwrócił Pan w gniewie swym”, a Ozeasz nadaje niechęci Boga najczulsze słowa: „jakożbym cię podał jako Adamę i położył jako Seboim? Ale się obróciło we mnie serce moje”. Biblia synodalna zapisuje tę nazwę jako Cewoim w Rdz 10 i Sewoim gdzie indziej. Dolina Seboim koło Mikmas i miasto o tej nazwie w Beniaminie po wygnaniu to inne miejsca."
    - "Żadne stanowisko nie jest znane. Ci, którzy umieszczają miasta na południowym krańcu Morza Martwego, wskazują na miasta i cmentarzyska z wczesnej epoki brązu na jego południowo-wschodnim brzegu, zbadane razem w 1973 roku: Bab ed-Dra, Numajra, Safi, Fejfa i Chanazir, pięć stanowisk dla pięciu miast, choć tylko pierwsze dwa okazały się miastami otoczonymi murem z tej epoki; dla Seboim proponowano Fejfę i Chanazir, a ci, którzy umieszczają miasta na północ od morza, na równinie naprzeciw Jerycha, proponowali Tall Mustah, ale nic nie wiąże żadnego z nich z tą nazwą. Józef Flawiusz i Strabon wciąż mówili o spalonej ziemi Sodomy nad jeziorem, a Euzebiusz nie wiedział nic więcej. Dziś południowy basen Morza Martwego w dużej mierze wysechł w baseny odparowujące zakładów potażu, a południowo-wschodni brzeg to Ghor es-Safi w Jordanii."
  it:
    - "Zeboim era una delle città della piana, le cinque città della valle del Giordano presso il Mar Morto che la Genesi nomina insieme: Sodoma, Gomorra, Adma, Zeboim e Bela, cioè Soar. Il confine dei Cananei correva «in direzione di Sodoma, Gomorra, Adma e Tseboim, fino a Lesha». Nella guerra dei quattro re Semeber re di Zeboim uscì con i vicini e «si schierarono in battaglia contro quelli, nella valle di Siddim», «ch’è il Mar salato», e i re di Sodoma e Gomorra caddero nei pozzi di bitume mentre fuggivano."
    - "Il racconto della distruzione nomina solo Sodoma e Gomorra, ma la Legge le ricorda tutte e quattro, e Osea nomina Adma e Tseboim. Mosè avvertì che il paese di un Israele infedele sarebbe diventato zolfo e sale, «come dopo la ruina di Sodoma, di Gomorra, di Adma e di Tseboim che l’Eterno distrusse nella sua ira e nel suo furore», e Osea dà alla riluttanza di Dio le sue parole più tenere: «a renderti simile ad Adma? a ridurti allo stato di Tseboim? Il mio cuore si commuove tutto dentro di me». La Bibbia sinodale scrive il nome Tsevoim in Genesi 10 e Sevoim altrove. Una valle di Zeboim presso Micmas e una città con quel nome in Beniamino dopo l’esilio sono luoghi diversi."
    - "Nessun sito è noto. Chi pone le città all’estremità meridionale del Mar Morto indica le città e i cimiteri dell’età del Bronzo Antico sulla sua riva sud-orientale, esplorati insieme nel 1973: Bab edh-Dhra, Numeira, Safi, Feifa e Khanazir, cinque siti per cinque città, benché solo i primi due si rivelassero città murate di quell’epoca; per Zeboim sono stati proposti Feifa e Khanazir, e chi pone le città a nord del mare, nella piana di fronte a Gerico, ha proposto Tall Mustah, ma nulla lega alcuno di essi al nome. Giuseppe Flavio e Strabone parlavano ancora della terra bruciata di Sodoma accanto al lago, ed Eusebio non sapeva altro. Oggi il bacino meridionale del Mar Morto si è in gran parte prosciugato nelle vasche degli stabilimenti di potassa, e la riva sud-orientale è il Ghor es-Safi in Giordania."
  nl:
    - "Zeboïm was een van de steden van de vlakte, de vijf steden van de Jordaanvallei bij de Dode Zee die Genesis samen noemt: Sodom, Gomorra, Adma, Zeboïm en Bela, dat is Zoar. De grens van de Kanaänieten liep “daar gij gaat naar Sodom en Gomorra, en Adama, en Zoboim, tot Lasa toe”. In de oorlog van de vier koningen trok Semeber, koning van Zeboïm, met zijn buren uit en “zij stelden tegen hen slagorden in het dal Siddim”, “dat is de Zoutzee”, en de koningen van Sodom en Gomorra vielen in de lijmputten toen zij vluchtten."
    - "Het verhaal van de ondergang noemt alleen Sodom en Gomorra, maar de Wet herinnert alle vier, en Hosea noemt Adma en Zeboïm. Mozes waarschuwde dat het land van een ontrouw Israël zwavel en zout zou worden, “gelijk de omkering van Sodom en Gomorra, Adama en Zeboim, die de HEERE heeft omgekeerd in Zijn toorn en in Zijn grimmigheid”, en Hosea geeft Gods tegenzin zijn teerste woorden: “Hoe zou Ik u maken als Adama, u stellen als Zeboim? Mijn hart is in Mij omgekeerd”. De Synodale Bijbel spelt de naam Tsevoim in Genesis 10 en Sevoim elders. Een dal van Zeboïm bij Michmas en een stad van die naam in Benjamin na de ballingschap zijn andere plaatsen."
    - "Geen plaats is bekend. Zij die de steden aan het zuidelijke einde van de Dode Zee plaatsen, wijzen op de steden en begraafplaatsen uit de Vroege Bronstijd aan de zuidoostelijke oever, in 1973 gezamenlijk onderzocht: Bab edh-Dhra, Numeira, Safi, Feifa en Khanazir, vijf plaatsen voor vijf steden, hoewel alleen de eerste twee ommuurde steden uit die tijd bleken; voor Zeboïm zijn Feifa en Khanazir voorgesteld, en zij die de steden ten noorden van de zee plaatsen, in de vlakte tegenover Jericho, hebben Tall Mustah voorgesteld, maar niets verbindt een van hen met de naam. Flavius Josephus en Strabo spraken nog van het verbrande land van Sodom langs het meer, en Eusebius wist niets meer. Tegenwoordig is het zuidelijke bekken van de Dode Zee grotendeels opgedroogd tot de verdampingsbekkens van de potasfabrieken, en de zuidoostelijke oever is de Ghor es-Safi in Jordanië."
  cs:
    - "Cebóím bylo jedním z měst roviny, pěti měst Jordánského údolí u Mrtvého moře, která Genesis jmenuje společně: Sodoma, Gomora, Adma, Cebóím a Bela, což je Soar. Hranice Kanaánců šla „k Sodomě a Gomoře, a Adama a Seboim až do Lázy“. Ve válce čtyř králů vytáhl Šemeber, král Cebóímu, se sousedy a „sšikovali se proti nim k bitvě v údolí Siddim“, „to jest již moře solné“, a králové Sodomy a Gomory padli při útěku do jam s bitumenem."
    - "Vyprávění o zkáze jmenuje jen Sodomu a Gomoru, ale Zákon si pamatuje všechna čtyři a Ozeáš jmenuje Admu a Cebóím. Mojžíš varoval, že země nevěrného Izraele se stane sírou a solí, „rovně jako na místě, kdež jest podvrácena Sodoma a Gomora, Adama a Seboim, kteréž podvrátil Hospodin v hněvě svém“, a Ozeáš dává Božímu zdráhání jeho nejněžnější slova: „Kterak bych tě položil jako Adamu, podvrátil jako Seboim? Zkormouceno jest ve mně srdce mé“. Synodální překlad píše jméno Cevoim v Genesis 10 a Sevoim jinde. Údolí Cebóim u Michmasu a město téhož jména v Benjamínovi po exilu jsou jiná místa."
    - "Žádné místo není známo. Ti, kdo kladou města na jižní konec Mrtvého moře, ukazují na města a pohřebiště rané doby bronzové na jeho jihovýchodním břehu, společně prozkoumaná roku 1973: Báb edh-Dhrá, Numejra, Sáfí, Fajfa a Chanazír, pět lokalit pro pět měst, ač jen první dvě se ukázaly být opevněnými městy té doby; pro Cebóím byly navrženy Fajfa a Chanazír, a ti, kdo kladou města na sever od moře, do roviny naproti Jerichu, navrhli Tall Mustah, ale žádnou z nich se jménem nic nespojuje. Josephus a Strabón ještě mluvili o spálené zemi Sodomy u jezera a Eusebius nevěděl nic víc. Dnes jižní pánev Mrtvého moře z velké části vyschla v odpařovací nádrže potašových závodů a jihovýchodní břeh je Ghór es-Sáfí v Jordánsku."
  sv:
    - "Sevojim var en av slättstäderna, de fem städerna i Jordandalen vid Döda havet som Första Moseboken nämner tillsammans: Sodom, Gomorra, Adma, Sevojim och Bela, som är Soar. Kanaaneernas gräns gick ”fram emot Sodom, Gomorra, Adma och Seboim ända till Lesa”. I de fyra kungarnas krig tågade Shemever, kung av Sevojim, ut med sina grannar och ”ställde upp sig i Siddimsdalen till strid mot dem”, ”där Salthavet nu är”, och kungarna av Sodom och Gomorra föll i jordbecksgroparna när de flydde."
    - "Berättelsen om undergången nämner bara Sodom och Gomorra, men Lagen minns alla fyra, och Hosea nämner Adma och Sevojim. Mose varnade för att ett trolöst Israels land skulle bli svavel och salt, ”såsom det blev, när Sodom och Gomorra, Adma och Seboim omstörtades, då HERREN i sin vrede och harm omstörtade dem”, och Hosea ger Guds motvilja dess ömmaste ord: ”Icke kan jag giva dig till pris såsom Adma och låta det gå dig såsom Seboim? Mitt hjärta vänder sig i mig”. Den synodala bibeln stavar namnet Tsevoim i 1 Mos 10 och Sevoim på andra ställen. Sevojimdalen nära Mikmas och en stad med det namnet i Benjamin efter exilen är andra platser."
    - "Ingen plats är känd. De som förlägger städerna till Döda havets södra ände pekar på den tidiga bronsålderns städer och gravplatser på dess sydöstra strand, undersökta tillsammans 1973: Bab edh-Dhra, Numeira, Safi, Feifa och Khanazir, fem platser för fem städer, fast bara de två första visade sig vara befästa städer från den tiden; Feifa och Khanazir har föreslagits för Sevojim, och de som förlägger städerna norr om havet, på slätten mitt emot Jeriko, har föreslagit Tall Mustah, men ingenting knyter någon av dem till namnet. Josefus och Strabon talade fortfarande om Sodoms brända land vid sjön, och Eusebios visste inget mer. I dag har Döda havets södra bassäng till stor del torkat ut till kaliverkens förångningsdammar, och sydöstra stranden är Ghor es-Safi i Jordanien."
  nb:
    - "Sebojim var en av slettebyene, de fem byene i Jordandalen ved Dødehavet som Første Mosebok nevner sammen: Sodoma, Gomorra, Adma, Sebojim og Bela, som er Soar. Kana'anittenes grense gikk «bortimot Sodoma og Gomorra og Adma og Sebo'im like til Lesa». I krigen mellom de fire kongene rykket Sjemeber, konge i Sebojim, ut med naboene sine og «stilte sig i fylkning mot dem i Siddim-dalen», «der hvor Salthavet nu er», og kongene i Sodoma og Gomorra falt i jordbekgrubene da de flyktet."
    - "Beretningen om ødeleggelsen nevner bare Sodoma og Gomorra, men Loven husker alle fire, og Hosea nevner Adma og Sebojim. Moses advarte om at landet til et troløst Israel ville bli svovel og salt, «en ødeleggelse som Sodomas og Gomorras, Admas og Sebo'ims, dengang Herren ødela dem i sin vrede og harme», og Hosea gir Guds motvilje dens ømmeste ord: «Hvorledes skal jeg kunne gi dig op som Adma, gjøre med dig som med Sebo'im? Mitt hjerte vender sig i mig». Synodalbibelen skriver navnet Tsevoim i Første Mosebok 10 og Sevoim ellers. En dal Sebojim nær Mikmas og en by med det navnet i Benjamin etter eksilet er andre steder."
    - "Intet sted er kjent. De som plasserer byene i den sørlige enden av Dødehavet, peker på byene og gravplassene fra tidlig bronsealder på den sørøstlige bredden, kartlagt sammen i 1973: Bab edh-Dhra, Numeira, Safi, Feifa og Khanazir, fem steder for fem byer, selv om bare de to første viste seg å være ummurte byer fra den tiden; Feifa og Khanazir er foreslått for Sebojim, og de som plasserer byene nord for havet, på sletten overfor Jeriko, har foreslått Tall Mustah, men ingenting knytter noen av dem til navnet. Josefus og Strabon talte fortsatt om det brente landet Sodoma ved innsjøen, og Eusebius visste ikke mer. I dag har det sørlige bassenget i Dødehavet stort sett tørket ut til fordampningsbassengene til kaliverkene, og den sørøstlige bredden er Ghor es-Safi i Jordan."
  tl:
    - "Ang Zeboim ay isa sa mga lunsod ng kapatagan, ang limang bayan ng libis ng Jordan sa tabi ng Dagat na Patay na magkakasamang pinangalanan ng Genesis: Sodoma, Gomorra, Adma, Zeboim at Bela, na siyang Zoar. Ang hangganan ng mga Cananeo ay “kung patungo sa Sodoma at Gomorra, at Adma, at Zeboim hanggang Lasa”. Sa digmaan ng apat na hari, si Shemeber, hari ng Zeboim, ay lumabas kasama ng mga kapitbahay niya at “humanay ng pakikipagbaka laban sa kanila sa libis ng Siddim”, “na siyang Dagat na Alat”, at nahulog sa mga hukay ng betun ang mga hari ng Sodoma at Gomorra habang tumatakas."
    - "Sodoma at Gomorra lamang ang pinangalanan ng kuwento ng pagbagsak, ngunit naaalala ng Kautusan ang apat, at pinangalanan ni Oseas ang Adma at Zeboim. Nagbabala si Moises na ang lupain ng walang pananampalatayang Israel ay magiging asupre at asin, “na gaya ng nangyari sa pagkagiba ng Sodoma at Gomorra, Adma at Seboim, na giniba ng Panginoon sa kaniyang kagalitan”, at ibinibigay ni Oseas ang pinakamalambing na salita sa pag-aatubili ng Diyos: “paanong gagawin kitang parang Adma? paanong ilalagay kitang parang Zeboim? ang aking puso ay nabagbag sa loob ko”. Isinusulat ng Bibliyang Synodal ang pangalan na Tsevoim sa Genesis 10 at Sevoim sa iba. Ang libis ng Zeboim malapit sa Michmas at isang bayan ng gayong pangalan sa Benjamin pagkatapos ng pagkatapon ay ibang mga lugar."
    - "Walang kilalang pook. Ang naglalagay ng mga lunsod sa timugang dulo ng Dagat na Patay ay tumuturo sa mga bayan at sementeryo ng Maagang Panahong Tanso sa timog-silangang baybayin, na sabay na nasarbey noong 1973: Bab edh-Dhra, Numeira, Safi, Feifa at Khanazir, limang pook para sa limang lunsod, bagaman ang unang dalawa lamang ang bayang may pader ng panahong iyon; iminungkahi ang Feifa at Khanazir para sa Zeboim, at ang naglalagay ng mga lunsod sa hilaga ng dagat, sa kapatagan sa tapat ng Jerico, ay nagmungkahi ng Tall Mustah, ngunit walang kaugnay sa pangalan. Nagsalita pa sina Josefo at Estrabon tungkol sa nasunog na lupain ng Sodoma sa tabi ng lawa, at wala nang nalaman si Eusebio. Ngayon ang timugang palanggana ng Dagat na Patay ay higit nang natuyo bilang mga lawa ng pagsingaw ng pagawaan ng potasa, at ang timog-silangang baybayin ay ang Ghor es-Safi sa Jordan."
  da:
    - "Sebojim var en af sletteegnens byer, de fem byer i Jordandalen ved Dødehavet, som Første Mosebog nævner sammen: Sodoma, Gomorra, Adma, Sebojim og Bela, som er Soar. Kana'anitternes grænse løb »henimod Sodoma og Gomorra, Adma og Zeboim indtil Lasa«. I de fire kongers krig drog Sjemeber, konge af Sebojim, ud med sine naboer og »rustede sig mod dem til Strid udi Siddims Dal«, »det er Salthavet«, og kongerne af Sodoma og Gomorra faldt i jordbegsgruberne, da de flygtede."
    - "Beretningen om undergangen nævner kun Sodoma og Gomorra, men Loven husker alle fire, og Hoseas nævner Adma og Sebojim. Moses advarede om, at landet ville blive svovl og salt hos et troløst Israel, »ligesom Sodoma og Gomorra, Adma og Zeboim bleve omkastede, hvilke Herren omkastede i sin Vrede og i sin Hastighed«, og Hoseas giver Guds modvilje dens ømmeste ord: »hvorledes skal jeg kunne gøre ved dig som ved Adma, behandle dig som Zeboim? mit Hjerte har vendt sig i mig«. Synodalbibelen staver navnet Tsevoim i 1 Mos 10 og Sevoim andre steder. En dal Sebojim nær Mikmas og en by af det navn i Benjamin efter eksilet er andre steder."
    - "Intet sted er kendt. Dem, der placerer byerne i den sydlige ende af Dødehavet, peger på byerne og gravpladserne fra tidlig bronzealder på dets sydøstlige bred, undersøgt sammen i 1973: Bab edh-Dhra, Numeira, Safi, Feifa og Khanazir, fem steder til fem byer, selv om kun de to første viste sig at være befæstede byer fra den tid; Feifa og Khanazir er blevet foreslået for Sebojim, og dem, der placerer byerne nord for havet, i sletten over for Jeriko, har foreslået Tall Mustah, men intet binder nogen af dem til navnet. Josefus og Strabon talte stadig om Sodomas brændte land ved søen, og Eusebios vidste intet mere. I dag er Dødehavets sydlige bassin for en stor del tørret ud til kaliværkernes fordampningsbassiner, og den sydøstlige bred er Ghor es-Safi i Jordan."
  sr:
    - "Севоим је био један од градова у равници, пет градова у долини Јордана код Мртвог мора које Постање именује заједно: Содом, Гомор, Адама, Севоим и Вела, која је Сигор. Граница Хананејаца ишла је „идући на Содом и Гомор и Адаму и Севојим па до Даса“. У рату четири цара Симовор, цар севоимски, кренуо је са суседима и „изађоше на њих у долину сидимску“, „која је сада слано море“, а цареви Содома и Гомора пали су у јаме смоле док су бежали."
    - "Прича о уништењу именује само Содом и Гомор, али Закон памти сва четири, а Осија именује Адаму и Севоим. Мојсије је упозорио да ће земља невернога Израиља постати сумпор и со, „као где је пропао Содом и Гомор, Адама и Севојим, које затре Господ у гневу свом“, а Осија даје Божјем оклевању његове најнежније речи: „Како да учиним од тебе као од Адаме? Да те обратим да будеш као Севојим? Устрептало је срце моје у мени“. Руска синодална Библија пише име Цевоим у Постању 10, а Севоим другде. Долина Севоим код Михмаса и град тог имена у Венијамину после изгнанства друга су места."
    - "Налазиште није познато. Они који градове смештају на јужни крај Мртвог мора указују на градове и гробља из раног бронзаног доба на његовој југоисточној обали, заједно истражене 1973: Баб ед Драа, Нумејра, Сафи, Фејфа и Ханазир, пет налазишта за пет градова, мада су се само прва два показала као утврђени градови тог доба; за Севоим су предлагани Фејфа и Ханазир, а они који градове смештају северно од мора, у равницу наспрам Јерихона, предложили су Тал Мустах, али ништа не веже ниједно од њих за име. Јосиф Флавије и Страбон још су говорили о спаљеној земљи Содома крај језера, а Јевсевије није знао ништа више. Данас је јужни басен Мртвог мора великим делом исушен у испаривачке базене рудника поташе, а југоисточна обала је Гор ес Сафи у Јордану."
  hu:
    - "Cebóim a síkság városainak egyike volt, a Holt-tenger melletti Jordán-völgy öt városa közül, amelyeket a Teremtés könyve együtt nevez meg: Sodoma, Gomora, Admá, Cebóim és Béla, azaz Cóár. A kánaániták határa futott „Sodoma, Gomora, Ádmáh, és Czeboim felé menve Lésáig”. A négy király háborújában Semeber, Cebóim királya, szomszédaival kivonult és „megütközének azokkal a Sziddim völgyében”, „ez a Sóstenger”, és Sodoma és Gomora királyai menekülés közben a szurokgödrökbe estek."
    - "A pusztulás története csak Sodomát és Gomorát nevezi meg, de a Törvény mind a négyet emlegeti, és Hóseás megnevezi Admát és Cebóimot. Mózes figyelmeztetett, hogy a hűtlen Izráel földje kénkő és só lesz, „olyan, mint Sodomának, Gomorának, Ádmának és Czeboimnak elsülyesztett helye, a melyeket elsülyesztett az Úr haragjában és búsulásában”, és Hóseás a legszelídebb szavakat adja Isten vonakodásának: „Miként adnálak oda, mint Admát, tennélek olyanná, a milyen Seboim?! Megesett bennem az én szívem”. Az orosz szinodális Biblia a nevet az 1Móz 10-ben Cevoimnak, máshol Sevoimnak írja. A Mikmás melletti Cebóim-völgy és az azonos nevű város Benjámin területén a száműzetés után más helyek."
    - "Helye nem ismert. Akik a városokat a Holt-tenger déli végén keresik, a délkeleti partján lévő korai bronzkori városokra és temetőkre mutatnak, amelyeket 1973-ban együtt mértek fel: Báb edh-Dhra, Numejra, Szafi, Fejfa és Hanazir, öt lelőhely öt városhoz, bár csak az első kettő bizonyult akkori fallal körülvett városnak; Fejfát és Hanazirt Cebóimnak javasolták, akik pedig a városokat a tengertől északra, a Jerikóval szembeni síkságon teszik, a Tall Musztáhot javasolták, de semmi sem köti egyiket sem a névhez. Josephus és Sztrabón még a tó melletti Sodoma megégett földjéről beszélt, Eusebius pedig többet nem tudott. Ma a Holt-tenger déli medencéje nagyrészt kálisó-művek elpárologtató medencéivé száradt, a délkeleti part pedig a jordániai Gór esz-Szafi."
  fi:
    - "Seboim oli yksi tasangon kaupungeista, viidestä Kuolleenmeren Jordanin laaksossa olevasta kaupungista, jotka Ensimmäinen Mooseksen kirja mainitsee yhdessä: Sodoma, Gomorra, Adma, Seboim ja Bela eli Soar. Kanaanilaisten raja ulottui ”Sodomaan, Gomorraan, Admaan ja Seboimiin päin aina Lesaan asti”. Neljän kuninkaan sodassa Seboimin kuningas Semeber lähti naapureineen, ja nämä ”asettuivat Siddimin laaksossa sotarintaan heitä vastaan”, ”jossa Suolameri nyt on”, ja Sodoman ja Gomorran kuninkaat putosivat maapihkakuoppiin paetessaan."
    - "Tuhon kertomus nimeää vain Sodoman ja Gomorran, mutta laki muistaa kaikki neljä, ja Hoosea mainitsee Adman ja Seboimin. Mooses varoitti, että uskottoman Israelin maasta tulisi tulikiveä ja suolaa, ”niinkuin oli silloin, kun Sodoma ja Gomorra, Adma ja Seboim hävitettiin, kun Herra vihassaan ja kiivastuksessaan ne hävitti”, ja Hoosea antaa Jumalan epäröinnille sen hellimmät sanat: ”Kuinka jättäisin sinut niinkuin Adman, tekisin sinulle niinkuin Seboimille? Minun sydämeni kääntyy”. Venäjän synodaalinen Raamattu kirjoittaa nimen Tsevoim 1. Mooseksen kirjan 10. luvussa ja Sevoim muualla. Seboimin laakso Mikmaan lähellä ja samanniminen kaupunki Benjaminissa pakkosiirtolaisuuden jälkeen ovat eri paikkoja."
    - "Paikkaa ei tunneta. Ne, jotka sijoittavat kaupungit Kuolleenmeren eteläpäähän, viittaavat sen kaakkoisrannan varhaispronssikauden kaupunkeihin ja hautausmaihin, jotka kartoitettiin yhdessä 1973: Bab edh-Dhra, Numeira, Safi, Feifa ja Khanazir, viisi paikkaa viidelle kaupungille, vaikka vain kaksi ensimmäistä osoittautui sen ajan muurikaupungeiksi; Feifaa ja Khanaziria on ehdotettu Seboimiksi, ja ne, jotka sijoittavat kaupungit meren pohjoispuolelle, Jerikon vastapäiselle tasangolle, ovat ehdottaneet Tall Mustahia, mutta mikään ei yhdistä yhtäkään nimeen. Josefus ja Strabon puhuivat yhä Sodoman poltetusta maasta järven rannalla, eikä Eusebios tiennyt enempää. Nykyisin Kuolleenmeren eteläallas on suurelta osin kuivunut potaskatehtaiden haihdutusaltaiksi, ja kaakkoisranta on Ghor es-Safi Jordaniassa."
  vi:
    - "Xê-bô-im là một trong các thành của đồng bằng, năm thị trấn của thung lũng Giô-đanh bên Biển Chết mà Sáng Thế Ký nêu cùng nhau: Sô-đôm, Gô-mô-rơ, Át-ma, Xê-bô-im và Bê-la, tức là Xoa. Biên giới người Ca-na-an chạy “về hướng Sô-đôm, Gô-mô-rơ, Át-ma và Sê-bô-im, chạy đến Lê-sa”. Trong cuộc chiến của bốn vua, Sê-mê-bê vua Xê-bô-im cùng các láng giềng “xuất trận và dàn binh đóng tại trũng Si-điêm”, “bây giờ là biển muối”, và các vua Sô-đôm và Gô-mô-rơ sa xuống hố nhựa khi chạy trốn."
    - "Câu chuyện về sự hủy diệt chỉ nêu Sô-đôm và Gô-mô-rơ, nhưng Luật pháp nhớ cả bốn, và Ô-sê nêu Át-ma và Sê-bô-im. Môi-se cảnh báo rằng xứ của một Y-sơ-ra-ên bất trung sẽ thành diêm và muối, “giống như sự hủy hoại của Sô-đôm và Gô-mô-rơ, Át-ma và Sê-bô-im bị Đức Giê-hô-va phá diệt trong cơn thạnh nộ Ngài”, và Ô-sê cho sự miễn cưỡng của Đức Chúa Trời những lời dịu dàng nhất: “Thể nào ta sẽ đãi ngươi được như Át-ma, hay là làm cho ngươi như Sê-bô-im? Lòng ta rung động trong ta”. Bản Synodal viết tên là Tsevoim trong Sáng Thế Ký 10 và Sevoim ở nơi khác. Một trũng Sê-bô-im gần Mích-ma và một thị trấn cùng tên ở Bên-gia-min sau cuộc lưu đày là những nơi khác."
    - "Không biết địa điểm. Những người đặt các thành ở đầu nam Biển Chết chỉ vào các thị trấn và nghĩa địa thời đồ đồng sớm trên bờ đông nam, được khảo sát cùng nhau năm 1973: Bab edh-Dhra, Numeira, Safi, Feifa và Khanazir, năm di chỉ cho năm thành, dù chỉ hai nơi đầu hóa ra là thị trấn có tường bao thời ấy; Feifa và Khanazir đã được đề nghị cho Xê-bô-im, và những người đặt các thành ở phía bắc biển, trong đồng bằng đối diện Giê-ri-cô, đã đề nghị Tall Mustah, nhưng không gì gắn nơi nào với tên. Josephus và Strabon vẫn nói về đất cháy của Sô-đôm bên hồ, và Eusebius không biết gì thêm. Ngày nay lưu vực nam Biển Chết phần lớn đã khô thành các ao bay hơi của nhà máy kali, và bờ đông nam là Ghor es-Safi ở Jordan."
  ro:
    - "Țeboim era una dintre cetățile câmpiei, cele cinci orașe din valea Iordanului de lângă Marea Moartă pe care Geneza le numește împreună: Sodoma, Gomora, Adma, Țeboim și Bela, care este Țoar. Hotarul canaaniților mergea „până la Sodoma și Gomora și Adama și Sevoin până la Dasa”. În războiul celor patru regi, Șemeber, regele Țeboimului, a ieșit cu vecinii lui și „ș’au tocmit tabăra spre bătaie în valea cea sărată”, „care acum este marea sărilor”, iar regii Sodomei și Gomorei au căzut în gropile de smoală în fuga lor."
    - "Povestea nimicirii numește doar Sodoma și Gomora, dar Legea le amintește pe toate patru, iar Osea numește Adma și Țeboim. Moise a avertizat că țara unui Israel necredincios va deveni pucioasă și sare, „în ce chip s’au surpat Sodoma și Gomora, Adama și Sevoimul, pre care le-au surpat Domnul întru iuțimea și întru mâniea sa”, iar Osea dă ezitării lui Dumnezeu cele mai tandre cuvinte: cum te-aș face ca Adma, cum te-aș pune ca Țeboim, inima mea se răsucește în mine. Biblia sinodală rusă scrie numele Țevoim în Geneza 10 și Sevoim în alte locuri. O vale a Țeboimului lângă Micmaș și o cetate cu acest nume în Beniamin după exil sunt locuri diferite."
    - "Nu se cunoaște niciun loc. Cei care pun cetățile la capătul sudic al Mării Moarte arată spre orașele și necropolele din epoca bronzului timpuriu de pe țărmul sud-estic, cercetate împreună în 1973: Bab edh-Dhra, Numeira, Safi, Feifa și Khanazir, cinci situri pentru cinci cetăți, deși numai primele două s-au dovedit orașe cu ziduri din acea epocă; Feifa și Khanazir au fost sugerate pentru Țeboim, iar cei care pun cetățile la nord de mare, în câmpia din fața Ierihonului, au sugerat Tall Mustah, dar nimic nu leagă niciunul de nume. Iosif Flaviu și Strabon vorbeau încă despre țara arsă a Sodomei de lângă lac, iar Eusebiu nu mai știa nimic. Astăzi bazinul sudic al Mării Moarte s-a uscat în mare parte în bazinele de evaporare ale uzinelor de potasiu, iar țărmul sud-estic este Ghor es-Safi din Iordania."
  bg:
    - "Севоим бил един от градовете на околността — петте града в Йорданската долина край Мъртво море, които Битие назовава заедно: Содом, Гомор, Адма, Севоим и Бела, която е Сигор. Границата на ханаанците минавала „в Содом, и Гомор, и Адма, и Цевоим, до Лаша“. Във войната на четиримата царе Шемевер, царят на Севоим, излязъл заедно със съседите си и те „опълчиха се на бой против тях в дола Сидим“, „който е сега Солено Море“, а царете на Содом и Гомор паднали в смолните кладенци, докато бягали."
    - "Разказът за унищожението назовава само Содом и Гомор, но Законът помни и четирите, а Осия назовава Адма и Севоим. Мойсей предупредил, че земята на един неверен Израил ще стане жупел и сол, „според съсипването на Содом и Гомор, и Адма, и Севоим които съсипа Господ в гнева си“, а Осия облича Божието колебание в най-нежните му думи: „Как да те направя като Адма? Как да те туря като Севоим? Сърдцето ми се обърна вътре в мене“. Руската Синодална Библия пише името Цевоим в Бит. 10 и Севоим другаде. Долината Севоим близо до Михмас и едноименен град във Вениамин след изгнанието са други места."
    - "Място не е известно. Онези, които поставят градовете в южния край на Мъртво море, сочат селищата и некрополите от ранната бронзова епоха по югоизточния му бряг, проучени заедно през 1973 г.: Баб ед-Дра, Нумейра, Сафи, Фейфа и Ханазир — пет обекта за пет града, макар само първите два да се оказали укрепени градове от тази епоха; за Севоим са предлагани Фейфа и Ханазир, а онези, които поставят градовете северно от морето, в равнината срещу Йерихон, предлагат Тал Мустах, но нищо не свързва никое от тях с името. Йосиф Флавий и Страбон още говорели за изгорялата земя на Содом край езерото, а Евсевий не знаел нищо повече. Днес южният басейн на Мъртво море до голяма степен е пресъхнал в изпарителните басейни на калиевите заводи, а югоизточният бряг е Гор ес-Сафи в Йордания."
