# Overview article (ADR 0007). Mainstream facts only; the cities of the plain are unlocated, and the southern and northern theories are given without choosing.
id: zeboiim
place: abfbfb9
title:
  en: "Zeboiim"
  ru: "Севоим"
body:
  en:
    - "Zeboiim was one of the cities of the plain, the five towns of the Jordan valley by the Dead Sea that Genesis names together: Sodom, Gomorrah, Admah, Zeboiim and Bela, which is Zoar. The border of the Canaanites ran “unto Sodom, and Gomorrah, and Admah, and Zeboim, even unto Lasha”. In the war of the four kings Shemeber king of Zeboiim marched out with his neighbours and “joined battle with them in the vale of Siddim”, “which is the salt sea”, and the kings of Sodom and Gomorrah fell into the slime pits as they fled."
    - "The story of the overthrow names only Sodom and Gomorrah, but the Law and the prophets remember all four. Moses warned that the land of a faithless Israel would become brimstone and salt, “like the overthrow of Sodom, and Gomorrah, Admah, and Zeboim, which the LORD overthrew in his anger”, and Hosea gives God's reluctance its most tender words: “how shall I make thee as Admah? how shall I set thee as Zeboim? mine heart is turned within me”. The Synodal Bible spells the name Tsevoim in Genesis 10 and Sevoim elsewhere. A valley of Zeboim near Michmash and a town of that name in Benjamin after the exile are different places."
    - "No site is known. Those who put the cities at the southern end of the Dead Sea point to the Early Bronze Age towns and cemeteries on its south-eastern shore, surveyed together in 1973: Bab edh-Dhra, Numeira, Safi, Feifa and Khanazir, five sites for five cities, though only the first two proved to be walled towns and none has been tied to Zeboiim in particular; those who put them north of the sea, in the plain opposite Jericho, have none for it either. Josephus and Strabo still spoke of the burnt land of Sodom beside the lake, and Eusebius knew nothing more. Today the southern basin of the Dead Sea has largely dried into the evaporation pans of the potash works, and the south-eastern shore is the Ghor es-Safi in Jordan."
  ru:
    - "Севоим был одним из городов долины, пяти городов Иорданской равнины у Мёртвого моря, которые книга Бытия называет вместе: Содом, Гоморра, Адма, Севоим и Бела, она же Сигор. Пределы Хананеев шли «к Содому, Гоморре, Адме и Цевоиму до Лаши». В войне четырёх царей Шемевер, царь Севоимский, выступил вместе с соседями, и они «вступили в сражение с ними в долине Сиддим», «где ныне море Соленое», а цари Содомский и Гоморрский, обратившись в бегство, упали в смоляные ямы."
    - "Рассказ о гибели называет только Содом и Гоморру, но Закон и пророки помнят все четыре города. Моисей предупреждал, что земля неверного Израиля станет серой и солью, «как по истреблении Содома, Гоморры, Адмы и Севоима, которые ниспроверг Господь во гневе Своем», а Осия даёт нежеланию Бога самые нежные слова: «Поступлю ли с тобою, как с Адамом, сделаю ли тебе, что Севоиму? Повернулось во Мне сердце Мое». Синодальный перевод пишет Цевоим в десятой главе Бытия и Севоим в остальных местах. Долина Цевоим близ Михмаса и город того же имени в уделе Вениамина после плена — другие места."
    - "Место неизвестно. Те, кто помещает города у южного конца Мёртвого моря, указывают на города и кладбища раннего бронзового века, на его юго-восточном берегу, обследованные вместе в 1973 году, — Баб-эд-Дра, Нумейра, Сафи, Фейфа и Ханазир, пять мест для пяти городов, хотя городами со стенами оказались лишь первые два и ни одно не связано именно с Севоимом; нет его и у тех, кто ищет города к северу от моря, на равнине против Иерихона. Иосиф Флавий и Страбон ещё говорили о выжженной земле Содома у озера, а Евсевий не знал ничего больше. Сегодня южная котловина Мёртвого моря почти высохла, превратившись в испарительные бассейны калийных заводов, а юго-восточный берег — это Гор-эс-Сафи в Иордании."
