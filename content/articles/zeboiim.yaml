# Overview article (ADR 0007). Mainstream facts only; the cities of the plain are unlocated, and the southern and northern theories are given without choosing.
id: zeboiim
place: abfbfb9
title:
  en: "Zeboiim"
  ru: "Севоим"
  uk: "Цевоїм"
  es: "Zeboim"
  pt: "Zeboim"
  de: "Zeboim"
  fr: "Tseboïm"
body:
  en:
    - "Zeboiim was one of the cities of the plain, the five towns of the Jordan valley by the Dead Sea that Genesis names together: Sodom, Gomorrah, Admah, Zeboiim and Bela, which is Zoar. The border of the Canaanites ran “unto Sodom, and Gomorrah, and Admah, and Zeboim, even unto Lasha”. In the war of the four kings Shemeber king of Zeboiim marched out with his neighbours and “joined battle with them in the vale of Siddim”, “which is the salt sea”, and the kings of Sodom and Gomorrah fell into the slime pits as they fled."
    - "The story of the overthrow names only Sodom and Gomorrah, but the Law and the prophets remember all four. Moses warned that the land of a faithless Israel would become brimstone and salt, “like the overthrow of Sodom, and Gomorrah, Admah, and Zeboim, which the LORD overthrew in his anger”, and Hosea gives God's reluctance its most tender words: “how shall I make thee as Admah? how shall I set thee as Zeboim? mine heart is turned within me”. The Synodal Bible spells the name Tsevoim in Genesis 10 and Sevoim elsewhere. A valley of Zeboim near Michmash and a town of that name in Benjamin after the exile are different places."
    - "No site is known. Those who put the cities at the southern end of the Dead Sea point to the Early Bronze Age towns and cemeteries on its south-eastern shore, surveyed together in 1973: Bab edh-Dhra, Numeira, Safi, Feifa and Khanazir, five sites for five cities, though only the first two proved to be walled towns and none has been tied to Zeboiim in particular; those who put them north of the sea, in the plain opposite Jericho, have none for it either. Josephus and Strabo still spoke of the burnt land of Sodom beside the lake, and Eusebius knew nothing more. Today the southern basin of the Dead Sea has largely dried into the evaporation pans of the potash works, and the south-eastern shore is the Ghor es-Safi in Jordan."
  ru:
    - "Севоим был одним из городов долины, пяти городов Иорданской равнины у Мёртвого моря, которые книга Бытия называет вместе: Содом, Гоморра, Адма, Севоим и Бела, она же Сигор. Пределы Хананеев шли «к Содому, Гоморре, Адме и Цевоиму до Лаши». В войне четырёх царей Шемевер, царь Севоимский, выступил вместе с соседями, и они «вступили в сражение с ними в долине Сиддим», «где ныне море Соленое», а цари Содомский и Гоморрский, обратившись в бегство, упали в смоляные ямы."
    - "Рассказ о гибели называет только Содом и Гоморру, но Закон и пророки помнят все четыре города. Моисей предупреждал, что земля неверного Израиля станет серой и солью, «как по истреблении Содома, Гоморры, Адмы и Севоима, которые ниспроверг Господь во гневе Своем», а Осия даёт нежеланию Бога самые нежные слова: «Поступлю ли с тобою, как с Адамом, сделаю ли тебе, что Севоиму? Повернулось во Мне сердце Мое». Синодальный перевод пишет Цевоим в десятой главе Бытия и Севоим в остальных местах. Долина Цевоим близ Михмаса и город того же имени в уделе Вениамина после плена — другие места."
    - "Место неизвестно. Те, кто помещает города у южного конца Мёртвого моря, указывают на города и кладбища раннего бронзового века, на его юго-восточном берегу, обследованные вместе в 1973 году, — Баб-эд-Дра, Нумейра, Сафи, Фейфа и Ханазир, пять мест для пяти городов, хотя городами со стенами оказались лишь первые два и ни одно не связано именно с Севоимом; нет его и у тех, кто ищет города к северу от моря, на равнине против Иерихона. Иосиф Флавий и Страбон ещё говорили о выжженной земле Содома у озера, а Евсевий не знал ничего больше. Сегодня южная котловина Мёртвого моря почти высохла, превратившись в испарительные бассейны калийных заводов, а юго-восточный берег — это Гор-эс-Сафи в Иордании."
  uk:
    - "Цевоїм був одним із міст рівнини, п’яти міст долини Йордану біля Мертвого моря, які Книга Буття називає разом: Содом, Гоморра, Адма, Цевоїм і Бела, тобто Сігор. Межа ханаанян ішла «до Содому і Гоморри й Адами й Зевоіму аж до Лаши». У війні чотирьох царів Шемевер, цар Цевоїму, вийшов із сусідами й «постали проти них на Сиддим-долинї», «се єсть теперенькі Море Солоне», а царі Содому й Гоморри попадали в ями, втікаючи."
    - "Розповідь про руйнування називає лише Содом і Гоморру, але Закон і пророки пам’ятають усі чотири. Мойсей застерігав, що земля невірного Ізраїлю стане сіркою й сіллю, «як западня Содома і Гомора, Адама і Зебоїм, що перевернув їх Господь у гнїву свому і в досадї своїй», а Осія дає Божій неохоті найніжніші слова: «Чи зроблю з тобою те, що з Адамою, чи вчиню тобі те саме, що Севоїмові? Обернулось бо в менї серце моє». Синодальний переклад пише ім’я Цевоїм у Бутті 10 і Севоїм в інших місцях. Долина Цевоїм біля Міхмаса і місто з такою назвою у Веніяміні після вигнання — інші місця."
    - "Місце невідоме. Ті, хто ставить міста на південному краю Мертвого моря, вказують на міста й цвинтарі ранньої бронзової доби на його південно-східному березі, обстежені разом у 1973 році: Баб-ед-Дра, Нумейра, Сафі, Фейфа і Ханазір, п’ять місць для п’яти міст, хоч лише перші два виявилися муруваними містами і жодне не пов’язане саме з Цевоїмом; ті, хто ставить їх на північ від моря, на рівнині навпроти Єрихона, не мають жодного для нього. Йосиф Флавій і Страбон ще говорили про випалену землю Содому біля озера, а Євсевій не знав нічого більше. Нині південний басейн Мертвого моря значною мірою висох у випарні ванни калійних заводів, а південно-східний берег — Гор-ес-Сафі в Йорданії."
  es:
    - "Zeboim fue una de las ciudades de la llanura, las cinco ciudades del valle del Jordán junto al mar Muerto que el Génesis nombra juntas: Sodoma, Gomorra, Adma, Zeboim y Bela, que es Zoar. La frontera de los cananeos iba «hasta entrar en Sodoma y Gomorra, Adma, y Zeboim hasta Lasa». En la guerra de los cuatro reyes, Semeber, rey de Zeboim, salió con sus vecinos y «ordenaron contra ellos batalla en el valle de Siddim», «que es el mar salado», y los reyes de Sodoma y Gomorra cayeron en los pozos de betún al huir."
    - "El relato de la destrucción nombra solo a Sodoma y Gomorra, pero la Ley y los profetas recuerdan a las cuatro. Moisés advirtió que la tierra de un Israel infiel se convertiría en azufre y sal, «como en la subversión de Sodoma y de Gomorra, de Adma y de Seboim, que Jehová subvirtió en su furor y en su ira», y Oseas da a la reticencia de Dios sus palabras más tiernas: «¿cómo podré yo hacerte como Adma, ni ponerte como á Zeboim? Mi corazón se revuelve dentro de mí». La Biblia sinodal escribe el nombre Tsevoim en Génesis 10 y Sevoim en los demás lugares. Un valle de Zeboim cerca de Micmas y una ciudad de ese nombre en Benjamín tras el exilio son lugares distintos."
    - "No se conoce ningún emplazamiento. Quienes sitúan las ciudades en el extremo sur del mar Muerto señalan las ciudades y cementerios del Bronce Antiguo en su orilla sureste, prospectados conjuntamente en 1973: Bab edh-Dhra, Numeira, Safi, Feifa y Khanazir, cinco sitios para cinco ciudades, aunque solo los dos primeros resultaron ser ciudades amuralladas y ninguno se ha vinculado con Zeboim en particular; quienes las sitúan al norte del mar, en la llanura frente a Jericó, tampoco tienen ninguno para ella. Josefo y Estrabón aún hablaban de la tierra quemada de Sodoma junto al lago, y Eusebio no sabía nada más. Hoy la cuenca meridional del mar Muerto se ha secado en gran parte en las balsas de evaporación de las plantas de potasa, y la orilla sureste es el Ghor es-Safi, en Jordania."
  pt:
    - "Zeboim foi uma das cidades da planície, as cinco cidades do vale do Jordão junto ao Mar Morto que Gênesis nomeia juntas: Sodoma, Gomorra, Admá, Zeboim e Belá, que é Zoar. A fronteira dos cananeus ia “na direção de Sodoma, Gomorra, Admá e Zeboim — até Lasa”. Na guerra dos quatro reis, Semeber, rei de Zeboim, saiu com seus vizinhos e “se colocaram em ordem de batalha contra eles no vale de Sidim”, “também chamado de Mar Salgado”, e os reis de Sodoma e Gomorra caíram nos poços de betume ao fugir."
    - "A história da destruição nomeia apenas Sodoma e Gomorra, mas a Lei e os profetas lembram as quatro. Moisés advertiu que a terra de um Israel infiel se tornaria enxofre e sal, “como a destruição de Sodoma, Gomorra, Admá e Zeboim, que o SENHOR destruiu na sua ira e no seu furor”, e Oseias dá à relutância de Deus suas palavras mais ternas: “Como posso torná-lo como Admá? Como posso torná-lo como Zeboim? Meu coração se revolve dentro de mim”. A Bíblia Sinodal grafa o nome Tsevoim em Gênesis 10 e Sevoim nos outros lugares. Um vale de Zeboim perto de Micmás e uma cidade desse nome em Benjamim depois do exílio são lugares diferentes."
    - "Nenhum sítio é conhecido. Os que põem as cidades na extremidade sul do Mar Morto apontam as cidades e cemitérios da Idade do Bronze Antigo na margem sudeste, prospectados juntos em 1973: Bab edh-Dhra, Numeira, Safi, Feifa e Khanazir, cinco sítios para cinco cidades, embora só os dois primeiros se revelassem cidades muradas e nenhum tenha sido ligado a Zeboim em particular; os que as põem ao norte do mar, na planície em frente a Jericó, também não têm nenhum. Josefo e Estrabão ainda falavam da terra queimada de Sodoma junto ao lago, e Eusébio nada mais sabia. Hoje a bacia sul do Mar Morto secou em grande parte em tanques de evaporação das fábricas de potássio, e a margem sudeste é o Ghor es-Safi, na Jordânia."
  de:
    - "Zeboim war eine der Städte der Ebene, der fünf Städte des Jordantals am Toten Meer, die die Genesis zusammen nennt: Sodom, Gomorra, Adma, Zeboim und Bela, das ist Zoar. Die Grenze der Kanaaniter verlief „bis man kommt gen Sodom, Gomorra, Adama, Zeboim und bis gen Lasa“. Im Krieg der vier Könige zog Schemeber, König von Zeboim, mit seinen Nachbarn aus: „und rüsteten sich, zu streiten im Tal Siddim“, „wo nun das Salzmeer ist“, und die Könige von Sodom und Gomorra fielen auf der Flucht in die Erdharzgruben."
    - "Die Erzählung vom Untergang nennt nur Sodom und Gomorra, doch Gesetz und Propheten erinnern an alle vier. Mose warnte, das Land eines treulosen Israels werde zu Schwefel und Salz, „gleich wie Sodom und Gomorra, Adama und Zeboim umgekehrt sind, die der HERR in seinem Zorn und Grimm umgekehrt hat“, und Hosea gibt Gottes Zögern seine zärtlichsten Worte: „Soll ich nicht billig ein Adama aus dir machen und dich wie Zeboim zurichten? Aber mein Herz ist andern Sinnes“. Die Synodalbibel schreibt den Namen in Genesis 10 Zewoim und sonst Sewoim. Ein Tal Zeboim bei Michmas und eine Stadt dieses Namens in Benjamin nach dem Exil sind andere Orte."
    - "Keine Stätte ist bekannt. Wer die Städte am Südende des Toten Meeres ansetzt, verweist auf die frühbronzezeitlichen Städte und Friedhöfe an seinem Südostufer, 1973 gemeinsam vermessen: Bab edh-Dhra, Numeira, Safi, Feifa und Khanazir, fünf Stätten für fünf Städte, obwohl sich nur die ersten beiden als ummauerte Städte erwiesen und keine im Besonderen mit Zeboim verbunden wurde; wer sie nördlich des Meeres in der Ebene gegenüber von Jericho ansetzt, hat auch dafür keine. Josephus und Strabon sprachen noch vom verbrannten Land Sodoms am See, und Eusebius wusste nichts weiter. Heute ist das südliche Becken des Toten Meeres weitgehend zu den Verdunstungsbecken der Kaliwerke ausgetrocknet, und das Südostufer ist der Ghor es-Safi in Jordanien."
  fr:
    - "Tseboïm était l’une des villes de la plaine, les cinq villes de la vallée du Jourdain près de la mer Morte que la Genèse nomme ensemble : Sodome, Gomorrhe, Adma, Tseboïm et Béla, qui est Tsoar. La frontière des Cananéens allait « du côté de Sodome, de Gomorrhe, d’Adma et de Tseboïm, jusqu’à Léscha ». Dans la guerre des quatre rois, Schémeéber, roi de Tseboïm, sortit avec ses voisins, et ils « se rangèrent en bataille contre eux, dans la vallée de Siddim », « qui est la mer Salée », et les rois de Sodome et de Gomorrhe tombèrent dans les puits de bitume en fuyant."
    - "Le récit de la destruction ne nomme que Sodome et Gomorrhe, mais la Loi et les prophètes se souviennent des quatre. Moïse avertit que le pays d’un Israël infidèle deviendrait soufre et sel, « comme au bouleversement de Sodome, de Gomorrhe, d’Adma et de Tseboïm, que l’Éternel détruisit dans sa colère », et Osée donne à la répugnance de Dieu ses mots les plus tendres : « Te traiterai-je comme Adma ? Te rendrai-je semblable à Tseboïm ? Mon cœur s’agite au-dedans de moi ». La Bible synodale écrit le nom Tsevoim en Genèse 10 et Sevoim ailleurs. Une vallée de Tseboïm près de Micmasch et une ville de ce nom en Benjamin après l’exil sont d’autres lieux."
    - "Aucun site n’est connu. Ceux qui placent les villes à l’extrémité sud de la mer Morte désignent les villes et nécropoles du bronze ancien de sa rive sud-est, prospectées ensemble en 1973 : Bab edh-Dhra, Numeira, Safi, Feifa et Khanazir, cinq sites pour cinq villes, bien que seuls les deux premiers se soient révélés des villes fortifiées et qu’aucun n’ait été rattaché à Tseboïm en particulier ; ceux qui les placent au nord de la mer, dans la plaine en face de Jéricho, n’en ont pas non plus. Josèphe et Strabon parlaient encore de la terre brûlée de Sodome près du lac, et Eusèbe n’en savait pas plus. Aujourd’hui, le bassin sud de la mer Morte s’est en grande partie asséché en bassins d’évaporation des usines de potasse, et la rive sud-est est le Ghor es-Safi, en Jordanie."
