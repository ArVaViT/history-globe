body:
  en:
    - "Gimzo was a town on the edge of the lowland of Judah, south-east of Lod. It appears once, among the towns the Philistines took in the reign of Ahaz: “The Philistines also had invaded the cities of the low country, and of the south of Judah, and had taken Beth-shemesh, and Ajalon, and Gederoth, and Shocho with the villages thereof, and Timnah with the villages thereof, Gimzo also and the villages thereof: and they dwelt there.” It is identified with Jimzu, an Arab village about three miles south-east of Lod (Lydda), which kept the name."
    - "In the first and early second centuries AD Gimzo was the home of the sage Nahum of Gimzo, under whom Rabbi Akiva studied; the Talmud says he answered every misfortune with “this too is for the good”, gam zu le-tovah, and explains his by-name by this saying. Edward Robinson, passing in 1838, found Jimzu a rather large village on a rise, with many underground stores for grain, and recognised in it the Gimzo of Chronicles. Israeli forces took the village in July 1948 and all its people left; the moshav Gimzo was founded on its land in 1950."
  ru:
    - "Гимзо — город на краю низменности Иудеи, к юго-востоку от Лода. Он упомянут однажды, среди городов, которые филистимляне взяли в царствование Ахаза: «Филистимляне рассыпались по городам низменного края и юга Иудеи и взяли Вефсамис и Аиалон, и Гедероф и Сохо и зависящие от него города, и Фимну и зависящие от нее города, и Гимзо и зависящие от него города, и поселились там». Его отождествляют с Джимзу, арабской деревней примерно в пяти километрах к юго-востоку от Лода (Лидды), сохранившей имя."
    - "В I — начале II в. н. э. в Гимзо жил мудрец Нахум из Гимзо, у которого учился рабби Акива; Талмуд рассказывает, что на всякую беду он отвечал: «и это к добру» (гам зу ле-това), и этим объясняет его прозвище. Эдвард Робинсон, проезжавший здесь в 1838 г., нашёл Джимзу довольно большим селением на возвышенности с множеством подземных хранилищ для зерна и узнал в нём Гимзо Паралипоменона. В июле 1948 г. деревню заняли израильские войска, и все её жители ушли; в 1950 г. на её земле был основан мошав Гимзо."
  uk:
    - "Гімзо було містом на краю юдейської низовини, на південний схід від Лода. Воно з'являється один раз, серед міст, які филистимляни взяли за царювання Ахаза: «Та й Филистії понабігали були в міста на низинах і в південний край Юдеї і взяли Бетсамис і Аялон, і Гедерот, і Сохо та залежні від його міста, й Тимну з залежними від неї містами, і Гимзо та залежні від його міста, та й оселились там». Його ототожнюють з Джімзу, арабським селом приблизно за три милі на південний схід від Лода (Лідди), яке зберегло назву."
    - "У I — на початку II ст. н. е. Гімзо було рідним містом мудреця Наума з Гімзо, у якого вчився рабин Аківа; Талмуд каже, що на кожне нещастя він відповідав «і це на добре», gam zu le-tovah, і пояснює його прізвисько цим висловом. Едвард Робінсон, проходячи там 1838 р., знайшов Джімзу доволі великим селом на узвишші, з багатьма підземними коморами для зерна, і впізнав у ньому Гімзо Хронік. Ізраїльські сили взяли село в липні 1948 р., і всі його мешканці пішли; на його землі 1950 р. заснували мошав Гімзо."
  es:
    - "Gimzo era una ciudad en el borde de la llanura de Judá, al sureste de Lida. Aparece una vez, entre las ciudades que tomaron los filisteos en el reinado de Acaz: «los Filisteos se habían derramado por las ciudades de la llanura, y al mediodía de Judá, y habían tomado á Beth-semes, á Ajalón, Gederoth, y Sochô con sus aldeas, Timna también con sus aldeas, y Gimzo con sus aldeas; y habitaban en ellas». Se identifica con Jimzu, una aldea árabe a unas tres millas al sureste de Lida (Lydda), que conservó el nombre."
    - "En el siglo I y comienzos del II d. C. Gimzo fue la patria del sabio Nahum de Gimzo, bajo quien estudió rabí Akiva; el Talmud dice que respondía a toda desgracia con «esto también es para bien», gam zu le-tovah, y explica su sobrenombre por ese dicho. Edward Robinson, al pasar en 1838, halló Jimzu como una aldea bastante grande sobre una loma, con muchos depósitos subterráneos para el grano, y reconoció en ella la Gimzo de Crónicas. Las fuerzas israelíes tomaron la aldea en julio de 1948 y todos sus habitantes se marcharon; el moshav Gimzo se fundó en sus tierras en 1950."
  pt:
    - "Gimzo era uma cidade na borda da planície de Judá, a sudeste de Lida. Aparece uma só vez, entre as cidades que os filisteus tomaram no reinado de Acaz: “Os filisteus também haviam invadido as cidades da planície e do Sul de Judá, e haviam tomado Bete-Semes, Aijalom, Gederote, Socó com as suas aldeias, Timna com as suas aldeias, e também Ginzo com as suas aldeias; e passaram a habitar ali.” É identificada com Jimzu, uma aldeia árabe cerca de três milhas a sudeste de Lida (Lydda), que conservou o nome."
    - "No século I e início do século II d.C., Gimzo foi a terra do sábio Naum de Gimzo, sob quem estudou o rabino Akiva; o Talmude diz que ele respondia a toda desgraça com “isto também é para o bem”, gam zu le-tovah, e explica seu cognome por essa frase. Edward Robinson, passando em 1838, achou Jimzu uma aldeia bastante grande sobre uma elevação, com muitos depósitos subterrâneos de grãos, e reconheceu nela a Gimzo de Crônicas. As forças israelenses tomaram a aldeia em julho de 1948 e todo o seu povo partiu; o moshav Gimzo foi fundado em suas terras em 1950."
  de:
    - "Gimso war eine Stadt am Rand des Tieflands von Juda, südöstlich von Lod. Es erscheint einmal, unter den Städten, die die Philister zur Zeit des Ahas einnahmen: Sie fielen in die Städte „in der Aue und dem Mittagslande Juda's“ ein und gewannen „Beth-Semes, Ajalon, Gederoth und Socho mit ihren Ortschaften“; die King-James-Bibel nennt außerdem Timna und Gimso mit ihren Dörfern. Es wird mit Dschimsu gleichgesetzt, einem arabischen Dorf etwa drei Meilen südöstlich von Lod (Lydda), das den Namen bewahrte."
    - "Im ersten und frühen zweiten Jahrhundert n. Chr. war Gimso die Heimat des Weisen Nahum von Gimso, bei dem Rabbi Akiba studierte; der Talmud sagt, er habe jedes Unglück mit „auch dies ist zum Guten“, gam su le-tova, beantwortet, und erklärt seinen Beinamen mit diesem Spruch. Edward Robinson fand Dschimsu 1838 beim Vorüberziehen als ziemlich großes Dorf auf einer Anhöhe mit vielen unterirdischen Getreidespeichern und erkannte darin das Gimso der Chronik. Israelische Truppen nahmen das Dorf im Juli 1948 ein, und alle seine Bewohner gingen fort; der Moschaw Gimso wurde 1950 auf seinem Land gegründet."
  fr:
    - "Guimzo était une ville à la lisière de la plaine de Juda, au sud-est de Lydde. Elle apparaît une fois, parmi les villes prises par les Philistins sous le règne d’Achaz : « Les Philistins firent une invasion dans les villes de la plaine et du midi de Juda ; ils prirent Beth-Schémesch, Ajalon, Guedéroth, Soco et les villes de son ressort, Thimna et les villes de son ressort, Guimzo et les villes de son ressort, et ils s’y établirent. » On l’identifie avec Jimzu, village arabe à environ trois milles au sud-est de Lydde (Lod), qui a gardé le nom."
    - "Aux Ier et début du IIe siècle apr. J.-C., Guimzo fut la patrie du sage Nahum de Guimzo, sous qui rabbi Akiva étudia ; le Talmud dit qu’il répondait à tout malheur par « cela aussi est pour le bien », gam zu le-tovah, et explique son surnom par cette parole. Edward Robinson, de passage en 1838, trouva Jimzu assez grand village sur une hauteur, avec de nombreux magasins souterrains à grain, et y reconnut le Guimzo des Chroniques. Les forces israéliennes prirent le village en juillet 1948 et tous ses habitants partirent ; le moshav Guimzo fut fondé sur ses terres en 1950."
  it:
    - "Gimzo era una città al margine della pianura di Giuda, a sud-est di Lidda. Compare una sola volta, tra le città prese dai Filistei sotto il regno di Acaz: «I Filistei pure aveano invaso le città della pianura e del mezzogiorno di Giuda, e avean preso Beth-Scemesh, Ajalon, Ghederoth, Soco e le città che ne dipendevano, Timnah e le città che ne dipendevano, Ghimzo e le città che ne dipendevano, e vi s’erano stabiliti». È identificata con Jimzu, un villaggio arabo a circa tre miglia a sud-est di Lidda, che ne conservò il nome."
    - "Nel I e all’inizio del II secolo d.C. Gimzo fu la patria del saggio Naum di Gimzo, presso il quale studiò rabbi Akiva; il Talmud dice che rispondeva a ogni sventura con «anche questo è per il bene», gam zu le-tovah, e spiega con questo detto il suo soprannome. Edward Robinson, passando nel 1838, trovò Jimzu un villaggio piuttosto grande su un rialzo, con molti depositi sotterranei per il grano, e vi riconobbe la Gimzo delle Cronache. Le forze israeliane presero il villaggio nel luglio 1948 e tutti i suoi abitanti partirono; il moshav di Gimzo fu fondato sulle sue terre nel 1950."
  nl:
    - "Gimzo was een stad aan de rand van de laagte van Juda, ten zuidoosten van Lydda. Zij komt eenmaal voor, onder de steden die de Filistijnen innamen in de regering van Achaz: “de Filistijnen in de steden der laagte en het zuiden van Juda ingevallen, en hadden ingenomen Beth-Semes, en Ajalon, en Gederoth, en Socho en haar onderhorige plaatsen, en Timna en haar onderhorige plaatsen, en Gimzo en haar onderhorige plaatsen; en zij woonden aldaar.” Zij wordt vereenzelvigd met Jimzu, een Arabisch dorp ongeveer drie mijl ten zuidoosten van Lydda, dat de naam bewaarde."
    - "In de eerste en vroege tweede eeuw n.Chr. was Gimzo de woonplaats van de wijze Nahum van Gimzo, bij wie rabbi Akiva studeerde; de Talmoed zegt dat hij elke tegenspoed beantwoordde met “ook dit is ten goede”, gam zu le-tovah, en verklaart zijn bijnaam met dit gezegde. Edward Robinson, die in 1838 langskwam, vond Jimzu een tamelijk groot dorp op een verhoging, met veel ondergrondse graanopslagplaatsen, en herkende erin het Gimzo van Kronieken. Israëlische troepen namen het dorp in juli 1948 in en alle bewoners vertrokken; de moshav Gimzo werd in 1950 op zijn land gesticht."
  pl:
    - "Gimzo było miastem na skraju nizin Judy, na południowy wschód od Lod. Pojawia się raz, wśród miast zajętych przez Filistynów za panowania Achaza: „Nadto i Filistynowie wtargnęli do miast w równinach, i na południe do Judy, a wzięli Betsemes, i Ajalon, i Gaderot, i Sokot i wsi jego, i Tamne i wsi jego, i Gimzo i wsi jego, a mieszkali w nich”. Utożsamia się je z Dżimzu, arabską wsią około trzech mil na południowy wschód od Lod (Lydda), która zachowała nazwę."
    - "W I i na początku II w. n.e. Gimzo było domem mędrca Nahuma z Gimzo, u którego uczył się rabbi Akiwa; Talmud mówi, że na każde nieszczęście odpowiadał: „i to jest na dobre”, gam zu le-tova, i tym powiedzeniem wyjaśnia jego przydomek. Edward Robinson, przejeżdżając w 1838 roku, zastał Dżimzu jako dość dużą wieś na wzniesieniu, z licznymi podziemnymi magazynami zboża, i rozpoznał w niej Gimzo z Kronik. Siły izraelskie zajęły wieś w lipcu 1948 roku i wszyscy jej mieszkańcy ją opuścili; moszaw Gimzo założono na jej ziemi w 1950 roku."
  cs:
    - "Gimzó bylo město na okraji judské nížiny, jihovýchodně od Lodu. Objevuje se jednou, mezi městy, která Pelištejci dobyli za vlády Achaze: „Nadto i Filistinští učinili vpád do měst, na rovinách k straně polední Judstva, a vzali Betsemes a Aialon, a Gederot a Socho i vsi jeho, a Tamna i vsi jeho, a Gimzo i vsi jeho, a bydlili v nich.“ Ztotožňuje se s Džimzú, arabskou vesnicí asi tři míle jihovýchodně od Lodu (Lyddy), která jméno zachovala."
    - "V prvním a na počátku druhého století n. l. bylo Gimzó domovem mudrce Nachuma z Gimzó, u něhož studoval rabi Akiva; Talmud říká, že na každé neštěstí odpovídal „i to je k dobrému“, gam zu le-tovah, a tímto rčením vysvětluje jeho přídomek. Edward Robinson, který tudy procházel roku 1838, shledal Džimzú poměrně velkou vesnicí na návrší s mnoha podzemními sklady na obilí a poznal v ní Gimzó z Paralipomena. Izraelské síly vesnici dobyly v červenci 1948 a všichni její obyvatelé odešli; na její půdě byl roku 1950 založen mošav Gimzo."
  sv:
    - "Gimso var en stad i kanten av Judas lågland, sydost om Lod. Den förekommer en gång, bland de städer som filistéerna tog under Achas regering: ”Och filistéerna hade fallit in i städerna i Juda lågland och sydland och hade intagit Bet-Semes, Ajalon och Gederot, så ock Soko med underlydande orter, Timna med underlydande orter och Gimso med underlydande orter, och hade bosatt sig i dem.” Den identifieras med Jimzu, en arabisk by omkring tre engelska mil sydost om Lod (Lydda), som bevarade namnet."
    - "Under första och början av andra århundradet e.Kr. var Gimso hemort för den vise Nahum från Gimso, hos vilken rabbi Akiva studerade; Talmud säger att han svarade på varje olycka med ”också detta är till det goda”, gam zu le-tovah, och förklarar hans binamn med detta ordstäv. Edward Robinson, som passerade 1838, fann Jimzu vara en ganska stor by på en höjd, med många underjordiska förråd för säd, och kände igen den som Krönikebokens Gimso. Israeliska styrkor intog byn i juli 1948 och alla dess invånare lämnade den; moshaven Gimzo grundades på dess mark 1950."
  nb:
    - "Gimso var en by i utkanten av Judas lavland, sørøst for Lod. Den nevnes én gang, blant byene filistrene tok under Ahas: filistrene «falt inn i byene i Juda, både i lavlandet og i sydlandet, og inntok Bet-Semes og Ajalon og Gederot, likeledes Soko med tilhørende småbyer og Timna med tilhørende småbyer og Gimso med tilhørende småbyer og bosatte sig der.» Den identifiseres med Jimzu, en arabisk landsby omtrent tre engelske mil sørøst for Lod (Lydda), som bevarte navnet."
    - "I det første og tidlige andre århundre e.Kr. var Gimso hjemstedet til vismannen Nahum fra Gimso, som rabbi Akiva studerte under; Talmud sier at han svarte på hver ulykke med «også dette er til det gode», gam zu le-tovah, og forklarer tilnavnet hans med dette ordtaket. Edward Robinson, som kom forbi i 1838, fant Jimzu som en ganske stor landsby på en høyde, med mange underjordiske lagre for korn, og gjenkjente i den Gimso i Krønikebøkene. Israelske styrker inntok landsbyen i juli 1948, og alle innbyggerne dro; moshaven Gimso ble grunnlagt på dens land i 1950."
  tl:
    - "Ang Gimzo ay isang bayan sa gilid ng mababang lupain ng Juda, sa timog-silangan ng Lod. Minsan lamang itong lumilitaw, sa mga bayang sinakop ng mga Filisteo sa paghahari ni Achaz: “Nilusob naman ng mga Filisteo ang mga bayan ng mababang lupain, at ang Timugan ng Juda, at sinakop ang Beth-semes, at ang Ajalon, at ang Gederoth, at ang Socho pati ang mga nayon niyaon, at ang Timna pati ang mga nayon niyaon, ang Gimzo man at ang mga nayon niyaon: at sila'y nagsitahan doon.” Itinutumbas ito sa Jimzu, isang nayong Arabe mga tatlong milya sa timog-silangan ng Lod (Lydda), na nagpanatili ng pangalan."
    - "Noong una at unang bahagi ng ikalawang siglo AD, ang Gimzo ang tahanan ng pantas na si Nahum ng Gimzo, na pinag-aralan ni Rabbi Akiva; sinasabi ng Talmud na sinasagot niya ang bawat kasawian ng “ito rin ay para sa ikabubuti”, gam zu le-tovah, at ipinaliliwanag nito ang kaniyang palayaw. Si Edward Robinson, na dumaan noong 1838, ay nakakita sa Jimzu ng isang malaking nayon sa isang taas, na may maraming imbakan ng butil sa ilalim ng lupa, at kinilala rito ang Gimzo ng Mga Cronica. Sinakop ng mga puwersang Israeli ang nayon noong Hulyo 1948 at lahat ng tao rito ay umalis; itinatag ang moshav na Gimzo sa lupain nito noong 1950."
