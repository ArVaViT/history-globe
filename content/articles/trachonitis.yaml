# Overview article (ADR 0007). Trachonitis = the Lajat lava field is certain; Herod's dealings follow Josephus (Whiston's divisions).
id: trachonitis
place: a85a60a
title:
  en: "Trachonitis"
  ru: "Трахонитская область"
  de: "Trachonitis"
  fr: "Trachonite"
  pt: "Traconites"
  it: "Traconitide"
  nl: "Trachonitis"
  pl: "Trachonitida"
