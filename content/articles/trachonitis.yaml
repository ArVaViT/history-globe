body:
  en:
    - "Trachonitis, the “rough country”, is the Lajat (al-Leja) of southern Syria, the largest lava field of the region, some 900 square kilometres of broken basalt about 50 km south-east of Damascus, between the Hauran plain and the Jebel al-Druze. Strabo speaks of the two Trachones above Damascus and, towards the land of the Arabians and Ituraeans, of mountains hard to pass with deep caves, in a country from which raids were made on Damascus until the Romans broke up the band of robbers under Zenodorus."
    - "Luke dates the start of John the Baptist's preaching to the year when “his brother Philip” was “tetrarch of Ituraea and of the region of Trachonitis”, the only mention of the land in the Bible. Herod the Great had left it to Philip with Gaulonitis, Batanea and Paneas."
    - "Josephus describes the Trachonites as men without cities or fields, living in caves with their cattle and plundering the country of Damascus, abetted by the tetrarch Zenodorus. Augustus took the land from him and gave it to Herod to put down the robbers; when they rose again, Herod settled three thousand Idumaeans in Trachonitis, and he planted Zamaris, a Jew from Babylonia, with his mounted archers at Bathyra in neighbouring Batanea as a guard against them. Under Roman rule towns of dark basalt grew up in and around the Lajat, among them Zorava (Izra) and Philippopolis (Shahba); the Lajat has been a UNESCO biosphere reserve since 2009."
  ru:
    - "Трахонитская область, «каменистая страна», — это Леджа (Ладжа) на юге Сирии, крупнейшее лавовое поле края, около 900 кв. км изломанного базальта примерно в 50 км к юго-востоку от Дамаска, между равниной Хауран и Джебель-Друз. Страбон говорит о двух Трахонах над Дамаском и о труднопроходимых горах с глубокими пещерами в сторону земли арабов и итурейцев, откуда совершались набеги на Дамаск, пока римляне не разгромили разбойничью шайку Зенодора."
    - "Лука датирует начало проповеди Иоанна Крестителя годом, когда «Филипп, брат его», был «четвертовластником в Итурее и Трахонитской области»; это единственное упоминание этой земли в Библии. Ирод Великий оставил её Филиппу вместе с Гавланитидой, Батанеей и Панеадой."
    - "Иосиф Флавий описывает трахонитов как людей без городов и полей, живших в пещерах со своим скотом и грабивших Дамасскую область при попустительстве четвертовластника Зенодора. Август отнял у него эту землю и отдал Ироду, чтобы тот усмирил разбойников; когда они восстали снова, Ирод поселил в Трахонитиде три тысячи идумеев, а в соседней Батанее, в Вафире, посадил Замариса, иудея из Вавилонии, с его конными лучниками для защиты от них. При римлянах в Ледже и вокруг неё выросли города из тёмного базальта, среди них Зорава (Эзраа) и Филиппополь (Шахба); с 2009 г. Леджа — биосферный заповедник ЮНЕСКО."
  de:
    - "Trachonitis, das „rauhe Land“, ist der Ledscha (al-Leja) im Süden Syriens, das größte Lavafeld der Region, etwa 900 Quadratkilometer zerklüfteten Basalts rund 50 km südöstlich von Damaskus, zwischen der Hauran-Ebene und dem Dschebel ad-Duruz. Strabon spricht von den zwei Trachones oberhalb von Damaskus und, gegen das Land der Araber und Ituräer hin, von schwer passierbaren Bergen mit tiefen Höhlen, in einem Land, von dem aus Raubzüge gegen Damaskus unternommen wurden, bis die Römer die Räuberbande unter Zenodoros zerschlugen."
    - "Lukas datiert den Beginn der Predigt Johannes des Täufers auf das Jahr, in dem „sein Bruder Philippus ein Vierfürst in Ituräa und in der Gegend Trachonitis“ war, die einzige Erwähnung des Landes in der Bibel. Herodes der Große hatte es Philippus zusammen mit Gaulanitis, Batanäa und Paneas hinterlassen."
    - "Josephus beschreibt die Trachoniten als Männer ohne Städte und Felder, die mit ihrem Vieh in Höhlen lebten und das Land von Damaskus plünderten, begünstigt vom Tetrarchen Zenodoros. Augustus nahm ihm das Land und gab es Herodes, um die Räuber zu unterdrücken; als sie sich erneut erhoben, siedelte Herodes dreitausend Idumäer in Trachonitis an und setzte Zamaris, einen Juden aus Babylonien, mit seinen berittenen Bogenschützen in Bathyra im benachbarten Batanäa als Wache gegen sie. Unter römischer Herrschaft entstanden in und um den Ledscha Städte aus dunklem Basalt, darunter Zorava (Izra) und Philippopolis (Schahba); der Ledscha ist seit 2009 ein UNESCO-Biosphärenreservat."
  fr:
    - "La Trachonite, le « pays rude », est le Lajat (al-Leja) du sud de la Syrie, le plus grand champ de lave de la région, quelque 900 kilomètres carrés de basalte brisé à environ 50 km au sud-est de Damas, entre la plaine du Havran et le Djebel al-Druze. Strabon parle des deux Trachons au-dessus de Damas et, vers le pays des Arabes et des Ituréens, de montagnes difficiles à franchir, aux cavernes profondes, dans un pays d’où l’on faisait des razzias sur Damas jusqu’à ce que les Romains dispersent la bande de brigands de Zénodore."
    - "Luc date le début de la prédication de Jean-Baptiste de l’année où « son frère Philippe » était « tétrarque de l’Iturée et du territoire de la Trachonite », seule mention du pays dans la Bible. Hérode le Grand l’avait laissée à Philippe avec la Gaulanitide, la Batanée et Panéas."
    - "Josèphe décrit les Trachonites comme des hommes sans villes ni champs, vivant dans des cavernes avec leur bétail et pillant le pays de Damas, soutenus par le tétrarque Zénodore. Auguste lui ôta le pays et le donna à Hérode pour réprimer les brigands ; quand ils se soulevèrent de nouveau, Hérode établit trois mille Iduméens en Trachonite, et il installa Zamaris, un Juif de Babylonie, avec ses archers à cheval à Bathyra, dans la Batanée voisine, pour les tenir en respect. Sous la domination romaine, des villes de basalte sombre s’élevèrent dans le Lajat et autour, dont Zorava (Izra) et Philippopolis (Shahba) ; le Lajat est réserve de biosphère de l’UNESCO depuis 2009."
  pt:
    - "Traconites, a “região áspera”, é o Lajat (al-Leja) do sul da Síria, o maior campo de lava da região, cerca de 900 quilômetros quadrados de basalto fragmentado a cerca de 50 km a sudeste de Damasco, entre a planície do Haurã e o Jebel al-Druze. Estrabão fala dos dois Traconas acima de Damasco e, em direção à terra dos árabes e itureus, de montanhas difíceis de atravessar, com cavernas profundas, num país de onde se faziam incursões contra Damasco até que os romanos desfizeram o bando de salteadores sob Zenodoro."
    - "Lucas data o início da pregação de João Batista ao ano em que “seu irmão Filipe” era “tetrarca da região da Itureia e Traconites”, a única menção da terra na Bíblia. Herodes, o Grande, a havia deixado a Filipe com a Gaulanítide, a Batanéia e Paneias."
    - "Josefo descreve os traconitas como homens sem cidades nem campos, que viviam em cavernas com seu gado e pilhavam o território de Damasco, apoiados pelo tetrarca Zenodoro. Augusto tirou-lhe a terra e a deu a Herodes para reprimir os salteadores; quando eles se levantaram de novo, Herodes estabeleceu três mil idumeus na Traconites e instalou Zamaris, um judeu da Babilônia, com seus arqueiros montados, em Batira, na vizinha Batanéia, como guarda contra eles. Sob o domínio romano, surgiram cidades de basalto escuro dentro e ao redor do Lajat, entre elas Zorava (Izra) e Filipópolis (Shahba); o Lajat é reserva da biosfera da UNESCO desde 2009."
  it:
    - "La Traconitide, il «paese aspro», è il Lajat (al-Leja) della Siria meridionale, il più grande campo di lava della regione, circa 900 chilometri quadrati di basalto spezzato a circa 50 km a sud-est di Damasco, tra la pianura dell’Auran e il Gebel Druso. Strabone parla dei due Trachones sopra Damasco e, verso il paese degli Arabi e degli Iturei, di montagne di difficile passaggio con profonde grotte, in un paese da cui si compivano incursioni su Damasco finché i Romani non sciolsero la banda di predoni di Zenodoro."
    - "Luca data l’inizio della predicazione di Giovanni Battista all’anno in cui «Filippo, suo fratello» era «tetrarca dell’Iturea e della Traconitide», l’unica menzione del paese nella Bibbia. Erode il Grande l’aveva lasciata a Filippo insieme a Gaulanitide, Batanea e Paneade."
    - "Giuseppe Flavio descrive i Traconiti come uomini senza città né campi, che vivevano nelle grotte con il bestiame e saccheggiavano il paese di Damasco, favoriti dal tetrarca Zenodoro. Augusto glielo tolse e lo diede a Erode perché reprimesse i predoni; quando essi si sollevarono di nuovo, Erode stanziò tremila Idumei in Traconitide, e collocò Zamaris, un ebreo di Babilonia, con i suoi arcieri a cavallo a Batira, nella vicina Batanea, a difesa contro di loro. Sotto il dominio romano sorsero in e intorno al Lajat città di basalto scuro, tra cui Zorava (Izra) e Filippopoli (Shahba); il Lajat è riserva della biosfera dell’UNESCO dal 2009."
  nl:
    - "Trachonitis, het ‘ruwe land’, is de Lajat (al-Leja) van het zuiden van Syrië, het grootste lavaveld van de streek, ongeveer 900 vierkante kilometer gebroken basalt zo'n 50 km ten zuidoosten van Damascus, tussen de Hauranvlakte en de Jebel al-Druze. Strabo spreekt van de twee Trachones boven Damascus en, in de richting van het land van de Arabieren en Itureeërs, van moeilijk begaanbare bergen met diepe grotten, in een land van waaruit Damascus werd overvallen tot de Romeinen de roversbende onder Zenodorus uiteendreven."
    - "Lukas dateert het begin van de prediking van Johannes de Doper naar het jaar waarin “Filippus, zijn broeder” “een viervorst over Iturea en over het land Trachonitis” was, de enige vermelding van het land in de Bijbel. Herodes de Grote had het met Gaulonitis, Batanea en Paneas aan Filippus nagelaten."
    - "Josephus beschrijft de Trachonieten als mannen zonder steden of akkers, die met hun vee in grotten woonden en het land van Damascus plunderden, gesteund door de tetrarch Zenodorus. Augustus nam het land van hem af en gaf het aan Herodes om de rovers te bedwingen; toen zij opnieuw opstonden, vestigde Herodes drieduizend Idumeeërs in Trachonitis, en hij plaatste Zamaris, een Jood uit Babylonië, met zijn bereden boogschutters te Bathyra in het naburige Batanea als bewaking tegen hen. Onder Romeins bestuur ontstonden in en rond de Lajat steden van donker basalt, onder meer Zorava (Izra) en Philippopolis (Shahba); de Lajat is sinds 2009 een biosfeerreservaat van UNESCO."
  pl:
    - "Trachonitida, „szorstka kraina”, to Lidża (al-Lidża) w południowej Syrii, największe pole lawowe regionu, około 900 kilometrów kwadratowych połamanego bazaltu, około 50 km na południowy wschód od Damaszku, między równiną Hauran a Dżabal ad-Druz. Strabon mówi o dwóch Trachonach nad Damaszkiem oraz, ku ziemi Arabów i Iturejczyków, o górach trudnych do przejścia, z głębokimi jaskiniami, w kraju, z którego urządzano napady na Damaszek, aż Rzymianie rozbili bandę zbójców pod wodzą Zenodora."
    - "Łukasz datuje początek nauczania Jana Chrzciciela na rok, gdy „Filip, brat jego” był „Tetrarchą Iturejskim i krainy Trachonickiej”, i jest to jedyna wzmianka o tej krainie w Biblii. Herod Wielki zostawił ją Filipowi wraz z Gaulanitydą, Batanea i Paneas."
    - "Józef Flawiusz opisuje Trachonitów jako ludzi bez miast i pól, mieszkających w jaskiniach wraz z bydłem i łupiących kraj Damaszku, z poparciem tetrarchy Zenodora. August odebrał mu ziemię i dał ją Herodowi, by poskromił zbójców; gdy powstali znowu, Herod osiedlił w Trachonitidzie trzy tysiące Idumejczyków, a Zamarisa, Żyda z Babilonii, z jego konnymi łucznikami osadził w Batyrze w sąsiedniej Batanea jako straż przeciw nim. Pod panowaniem rzymskim wokół Lidży i w niej wyrosły miasta z ciemnego bazaltu, między innymi Zorawa (Izra) i Filippopolis (Szahba); Lidża jest od 2009 roku rezerwatem biosfery UNESCO."
  uk:
    - "Трахонітська область, «нерівна країна», — це Ляджа (аль-Леджа) на півдні Сирії, найбільше лавове поле регіону, близько 900 квадратних кілометрів потрісканого базальту приблизно за 50 км на південний схід від Дамаска, між рівниною Хавран і Джебель-Друз. Страбон згадує двох Трахонів над Дамаском і, в бік землі арабів та ітурейців, гори, важкі для проходу, з глибокими печерами, у краї, з якого робили напади на Дамаск, аж поки римляни не розбили ватагу розбійників на чолі із Зенодором."
    - "Лука датує початок проповіді Івана Христителя роком, коли, за його словами, «Филип же, брат його, четверовластником в Ітуреї і Трахонській землї»; це єдина згадка про цю країну в Біблії. Ірод Великий заповів її Пилипові разом із Гавланітидою, Батанеєю та Паніадою."
    - "Йосиф Флавій описує трахонітян як людей без міст і полів, що живуть у печерах зі своєю худобою й грабують дамаську округу, а тетрарх Зенодор їм потурав. Август відібрав землю в нього й віддав Іродові, щоб приборкати розбійників; коли вони знову повстали, Ірод оселив у Трахонітській області три тисячі ідумеян, а в сусідній Батанеї посадив у Батирі як заслін проти них Замариса, юдея з Вавилонії, з його кінними лучниками. За римського панування в Ляджі та навколо неї виросли міста з темного базальту, серед них Зорава (Ізра) і Філіппополь (Шахба); Ляджа від 2009 р. є біосферним заповідником ЮНЕСКО."
  cs:
    - "Trachonitida, „drsná země“, je Lajá (al-Lédža) v jižní Sýrii, největší lávové pole oblasti, asi 900 čtverečních kilometrů rozbitého čediče asi 50 km jihovýchodně od Damašku, mezi planinou Havran a Džabal ad-Durúz. Strabón mluví o dvou Trachonech nad Damaškem a o horách těžko schůdných s hlubokými jeskyněmi směrem k zemi Arabů a Iturejců, v zemi, z níž se podnikaly nájezdy na Damašek, dokud Římané nerozbili tlupu lupičů pod Zenodorem."
    - "Lukáš datuje počátek kázání Jana Křtitele do roku, kdy byl jeho bratr Filip „čtvrtákem Iturejské a Trachonitidské krajiny“, což je jediná zmínka o této zemi v Bibli. Herodes Veliký ji odkázal Filipovi spolu s Gaulanitidou, Batanaiou a Paneadem."
    - "Josephus Flavius popisuje Trachonity jako lidi bez měst a polí, žijící s dobytkem v jeskyních a plundrující zemi Damašku, s podporou tetrarchy Zenodora. Augustus mu zemi vzal a dal ji Herodovi, aby lupiče potlačil; když povstali znovu, usadil Herodes v Trachonitidě tři tisíce Idumejců a Zamarida, Žida z Babylonie, s jeho jízdními lučištníky usadil v Bathyře v sousední Batanaii jako stráž proti nim. Za římské vlády vyrostla v Lajá a kolem ní města z tmavého čediče, mezi nimi Zorava (Izra') a Filippopolis (Šahba); Lajá je od roku 2009 biosférickou rezervací UNESCO."
  es:
    - "Traconite, el «país escabroso», es el Lajat (al-Leja) del sur de Siria, el mayor campo de lava de la región, unos 900 kilómetros cuadrados de basalto quebrado a unos 50 km al sureste de Damasco, entre la llanura del Haurán y el Yebel al-Druz. Estrabón habla de los dos Tracones sobre Damasco y, hacia el país de los árabes y los itureos, de montañas difíciles de cruzar con hondas cuevas, en un país desde el cual se hacían incursiones contra Damasco hasta que los romanos desbarataron la banda de ladrones bajo Zenodoro."
    - "Lucas fecha el comienzo de la predicación de Juan el Bautista en el año en que «su hermano Felipe» era «tetrarca de Iturea y de la provincia de Traconite», única mención de la tierra en la Biblia. Herodes el Grande se la había dejado a Felipe con Gaulanítide, Batanea y Paneas."
    - "Josefo describe a los traconitas como hombres sin ciudades ni campos, que vivían en cuevas con su ganado y saqueaban el país de Damasco, con el apoyo del tetrarca Zenodoro. Augusto le quitó la tierra y se la dio a Herodes para acabar con los ladrones; cuando estos se alzaron de nuevo, Herodes estableció tres mil idumeos en Traconite, y puso a Zamaris, un judío de Babilonia, con sus arqueros a caballo en Batira, en la vecina Batanea, como guardia contra ellos. Bajo el dominio romano surgieron dentro y en torno al Lajat ciudades de basalto oscuro, entre ellas Zorava (Izra) y Filipópolis (Shahba); el Lajat es reserva de la biosfera de la UNESCO desde 2009."
  sv:
    - "Trachonitis, ”det ojämna landet”, är Lajat (al-Leja) i södra Syrien, regionens största lavafält, omkring 900 kvadratkilometer söndersprucket basalt omkring 50 km sydost om Damaskus, mellan Hauranslätten och Jabal al-Duruz. Strabon talar om de två Trachonerna ovanför Damaskus och, mot arabernas och itureernas land, om berg som är svåra att ta sig över med djupa grottor, i ett land varifrån räder gjordes mot Damaskus tills romarna splittrade rövarbandet under Zenodoros."
    - "Lukas daterar början av Johannes döparens förkunnelse till det år då ”hans broder Filippus” var ”landsfurste i Itureen och Trakonitis-landet”, den enda omnämningen av landet i Bibeln. Herodes den store hade lämnat det åt Filippos tillsammans med Gaulanitis, Batanea och Paneas."
    - "Josefus beskriver trachoniterna som män utan städer eller åkrar, som bodde i grottor med sin boskap och plundrade Damaskus land, med stöd av tetrarken Zenodoros. Augustus tog landet från honom och gav det åt Herodes för att kuva rövarna; när de reste sig igen bosatte Herodes tretusen idumeer i Trachonitis, och han satte Zamaris, en jude från Babylonien, med sina berittna bågskyttar i Bathyra i grannlandet Batanea som vakt mot dem. Under romerskt välde växte städer av mörk basalt upp i och kring Lajat, bland dem Zorava (Izra) och Philippopolis (Shahba); Lajat har varit ett Unesco-biosfärområde sedan 2009."
scripture:
  - Luke.3.1
sources:
  - "Strabo, Geography 16.2.20 (the two Trachones above Damascus; caves and robbers)"
  - "Josephus, Jewish Antiquities 15.10.1 = Niese 15.342–348 (Zenodorus; the cave-dwelling Trachonites; the land given to Herod), 16.9.2 = 16.285 (three thousand Idumaeans), 17.2.1–3 = 17.23–31 (Zamaris at Bathyra in Batanea), 17.8.1 = 17.189 (Gaulonitis, Trachonitis, Batanea and Paneas to Philip) (Whiston's divisions = Niese sections)"
  - "Wikipedia, 'Lajat' (with its references: extent, Roman towns, UNESCO biosphere reserve 2009)"
status: checked
