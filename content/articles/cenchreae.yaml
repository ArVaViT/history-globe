# Overview article (ADR 0007). Mainstream facts only; the date of the earthquake that sank the harbour buildings is given only as the later fourth century AD.
id: cenchreae
place: aa31dd3
title:
  en: "Cenchreae"
  ru: "Кенхреи"
body:
  en:
    - "Cenchreae was the eastern harbour of Corinth, on the Saronic Gulf where the village of Kechries stands today. Strabo puts it about seventy stadia from the city and says it served the trade from Asia, while Lechaeum, Corinth's harbour on the other sea, served the trade from Italy. Pausanias tells that the harbours were named after Leches and Cenchrias, said to be children of Poseidon."
    - "In the Peloponnesian War Corinth kept troops and ships here. In 425 BC, when the Athenians landed on Corinthian territory, the Corinthians left half their force at Cenchreae, and in 412 BC the Peloponnesian ships for the war in Ionia sailed from it. After Corinth was refounded as a Roman colony in 44 BC, the port flourished. Pausanias, in the second century AD, saw a temple of Aphrodite, a bronze Poseidon on the mole and, at the other end of the harbour, sanctuaries of Asclepius and of Isis. Apuleius, in his novel the Metamorphoses, sets at Cenchreae the spring festival of Isis, when her priests dedicate a newly built ship at the opening of the sailing season."
    - 'When Paul left Corinth after his long stay, he sailed for Syria with Priscilla and Aquila, "having shorn his head in Cenchrea: for he had a vow". In his letter to the Romans, probably written from Corinth, he commends to them Phebe, "a servant of the church which is at Cenchrea", and asks them to receive her and help her; she had been a helper of many, and of Paul himself.'
    - "American excavations of the 1960s under Robert Scranton uncovered warehouses, fish tanks and, in the now submerged southern part of the harbour, a complex that the excavators took to be the sanctuary of Isis named by Pausanias. In it lay crates of panels of coloured glass, still packed, which sank when an earthquake struck in the later fourth century AD. A Christian basilica was later built at the southern end of the harbour, and the port remained in use into the seventh century."
  ru:
    - "Кенхреи — восточная гавань Коринфа на Сароническом заливе, там, где сегодня стоит деревня Кехриес. Страбон помещает её примерно в семидесяти стадиях от города и говорит, что она служила для торговли с Асией, а Лехей, гавань Коринфа на другом море, — для торговли с Италией. Павсаний рассказывает, что гавани названы по Лехею и Кенхрию, которых считали детьми Посейдона."
    - "В Пелопоннесскую войну Коринф держал здесь войска и корабли. В 425 г. до н. э., когда афиняне высадились на коринфской земле, коринфяне оставили в Кенхреях половину своих сил, а в 412 г. до н. э. отсюда вышли пелопоннесские корабли на войну в Ионии. После того как в 44 г. до н. э. Коринф был заново основан как римская колония, порт процветал. Павсаний во II веке н. э. видел здесь храм Афродиты, бронзового Посейдона на молу и на другом конце гавани святилища Асклепия и Исиды. Апулей в романе «Метаморфозы» помещает в Кенхреи весенний праздник Исиды, когда её жрецы посвящают богине новый корабль в начале мореходного сезона."
    - "Покидая Коринф после долгого пребывания, Павел отплыл в Сирию с Акилой и Прискиллой, «остригши голову в Кенхреях, по обету». В Послании к Римлянам, вероятно написанном в Коринфе, он представляет им Фиву, «диакониссу церкви Кенхрейской», и просит принять её и помочь ей: она была помощницею многим и ему самому."
    - "Американские раскопки 1960-х гг. под руководством Роберта Скрэнтона открыли склады, садки для рыбы и в ныне затопленной южной части гавани комплекс, в котором раскопщики увидели святилище Исиды, упомянутое Павсанием. В нём лежали ящики с ещё не распакованными панелями из цветного стекла, ушедшие под воду при землетрясении во второй половине IV века н. э. Позже у южного края гавани была построена христианская базилика, а порт действовал до VII века."
