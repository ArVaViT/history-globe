# Overview article (ADR 0007). Mainstream facts only; the date of the earthquake that sank the harbour buildings is given only as the later fourth century AD.
id: cenchreae
place: aa31dd3
title:
  en: "Cenchreae"
  ru: "Кенхреи"
  uk: "Кенхреї"
  es: "Cencrea"
  pt: "Cencreia"
  de: "Kenchreä"
  fr: "Cenchrées"
  it: "Cencre"
  pl: "Kenchrea"
  nl: "Kenchreeën"
  cs: "Kenchreje"
  sv: "Kenchreai"
body:
  en:
    - "Cenchreae was the eastern harbour of Corinth, on the Saronic Gulf where the village of Kechries stands today. Strabo puts it about seventy stadia from the city and says it served the trade from Asia, while Lechaeum, Corinth's harbour on the other sea, served the trade from Italy. Pausanias tells that the harbours were named after Leches and Cenchrias, said to be children of Poseidon."
    - "In the Peloponnesian War Corinth kept troops and ships here. In 425 BC, when the Athenians landed on Corinthian territory, the Corinthians left half their force at Cenchreae, and in 412 BC the Peloponnesian ships for the war in Ionia sailed from it. After Corinth was refounded as a Roman colony in 44 BC, the port flourished. Pausanias, in the second century AD, saw a temple of Aphrodite, a bronze Poseidon on the mole and, at the other end of the harbour, sanctuaries of Asclepius and of Isis. Apuleius, in his novel the Metamorphoses, sets at Cenchreae the spring festival of Isis, when her priests dedicate a newly built ship at the opening of the sailing season."
    - 'When Paul left Corinth after his long stay, he sailed for Syria with Priscilla and Aquila, "having shorn his head in Cenchrea: for he had a vow". In his letter to the Romans, probably written from Corinth, he commends to them Phebe, "a servant of the church which is at Cenchrea", and asks them to receive her and help her; she had been a helper of many, and of Paul himself.'
    - "American excavations of the 1960s under Robert Scranton uncovered warehouses, fish tanks and, in the now submerged southern part of the harbour, a complex that the excavators took to be the sanctuary of Isis named by Pausanias. In it lay crates of panels of coloured glass, still packed, which sank when an earthquake struck in the later fourth century AD. A Christian basilica was later built at the southern end of the harbour, and the port remained in use into the seventh century."
  ru:
    - "Кенхреи — восточная гавань Коринфа на Сароническом заливе, там, где сегодня стоит деревня Кехриес. Страбон помещает её примерно в семидесяти стадиях от города и говорит, что она служила для торговли с Асией, а Лехей, гавань Коринфа на другом море, — для торговли с Италией. Павсаний рассказывает, что гавани названы по Лехею и Кенхрию, которых считали детьми Посейдона."
    - "В Пелопоннесскую войну Коринф держал здесь войска и корабли. В 425 г. до н. э., когда афиняне высадились на коринфской земле, коринфяне оставили в Кенхреях половину своих сил, а в 412 г. до н. э. отсюда вышли пелопоннесские корабли на войну в Ионии. После того как в 44 г. до н. э. Коринф был заново основан как римская колония, порт процветал. Павсаний во II веке н. э. видел здесь храм Афродиты, бронзового Посейдона на молу и на другом конце гавани святилища Асклепия и Исиды. Апулей в романе «Метаморфозы» помещает в Кенхреи весенний праздник Исиды, когда её жрецы посвящают богине новый корабль в начале мореходного сезона."
    - "Покидая Коринф после долгого пребывания, Павел отплыл в Сирию с Акилой и Прискиллой, «остригши голову в Кенхреях, по обету». В Послании к Римлянам, вероятно написанном в Коринфе, он представляет им Фиву, «диакониссу церкви Кенхрейской», и просит принять её и помочь ей: она была помощницею многим и ему самому."
    - "Американские раскопки 1960-х гг. под руководством Роберта Скрэнтона открыли склады, садки для рыбы и в ныне затопленной южной части гавани комплекс, в котором раскопщики увидели святилище Исиды, упомянутое Павсанием. В нём лежали ящики с ещё не распакованными панелями из цветного стекла, ушедшие под воду при землетрясении во второй половине IV века н. э. Позже у южного края гавани была построена христианская базилика, а порт действовал до VII века."
  uk:
    - "Кенхреї були східною гаванню Коринта, на Сароніській затоці, де сьогодні стоїть село Кехріс. Страбон ставить її приблизно за сімдесят стадій від міста й каже, що вона обслуговувала торгівлю з Азією, тоді як Лехей, гавань Коринта на іншому морі, обслуговував торгівлю з Італією. Павсаній розповідає, що гавані були названі на честь Лехеса та Кенхрія, нібито дітей Посейдона."
    - "Під час Пелопоннеської війни Коринт тримав тут війська й кораблі. У 425 р. до н. е., коли афіняни висадилися на коринфській території, коринфяни залишили половину своїх сил у Кенхреях, а в 412 р. до н. е. звідти відпливли пелопоннеські кораблі для війни в Іонії. Після того як Коринт було заново засновано як римську колонію в 44 р. до н. е., порт процвітав. Павсаній у II ст. н. е. бачив храм Афродіти, бронзового Посейдона на молі та, на другому краї гавані, святилища Асклепія та Ісіди. Апулей у своєму романі «Метаморфози» поміщає в Кенхреях весняне свято Ісіди, коли її жерці присвячують щойно збудований корабель на відкритті сезону плавання."
    - "Коли Павло покинув Коринт після довгого перебування, він поплив до Сирії з Прискиллою та Акилою, «остригши голову в Кинхреях; бо зробив був обітницю». У листі до римлян, імовірно написаному з Коринта, він рекомендує їм Фиву, «сестру нашу, служительку церкви, що в Кенхреях», і просить прийняти її та допомагати їй; вона була заступницею багатьом і самому Павлові."
    - "Американські розкопки 1960-х рр. під керівництвом Роберта Скрентона відкрили склади, рибні басейни й, у нині затопленій південній частині гавані, комплекс, який розкопувачі вважали святилищем Ісіди, названим Павсанієм. У ньому лежали ящики з панелями з кольорового скла, ще запаковані, які затонули, коли наприкінці IV ст. н. е. стався землетрус. Християнську базиліку було згодом збудовано на південному краї гавані, а порт лишався в ужитку до VII ст."
  es:
    - "Cencrea era el puerto oriental de Corinto, en el golfo Sarónico, donde se levanta hoy la aldea de Kechries. Estrabón lo sitúa a unos setenta estadios de la ciudad y dice que servía al comercio procedente de Asia, mientras que Lequeo, el puerto de Corinto en el otro mar, servía al comercio de Italia. Pausanias cuenta que los puertos recibieron su nombre de Leques y Cencrias, que se decía eran hijos de Poseidón."
    - "En la guerra del Peloponeso, Corinto mantuvo aquí tropas y naves. En el 425 a. C., cuando los atenienses desembarcaron en territorio corintio, los corintios dejaron la mitad de sus fuerzas en Cencrea, y en el 412 a. C. las naves peloponesias destinadas a la guerra en Jonia zarparon de ella. Después de que Corinto fuera refundada como colonia romana en el 44 a. C., el puerto prosperó. Pausanias, en el siglo II d. C., vio un templo de Afrodita, un Poseidón de bronce en el malecón y, en el otro extremo del puerto, santuarios de Asclepio y de Isis. Apuleyo, en su novela las Metamorfosis, sitúa en Cencrea la fiesta primaveral de Isis, en la que sus sacerdotes consagran una nave recién construida a la apertura de la temporada de navegación."
    - "Cuando Pablo salió de Corinto tras su larga estancia, navegó a Siria con Priscila y Aquila, «habiéndose trasquilado la cabeza en Cencreas, porque tenía voto». En su carta a los Romanos, escrita probablemente desde Corinto, les recomienda a Febe, «diaconisa de la iglesia que está en Cencreas», y les pide que la reciban y la ayuden; ella había ayudado a muchos, y al propio Pablo."
    - "Las excavaciones estadounidenses de la década de 1960, dirigidas por Robert Scranton, sacaron a la luz almacenes, viveros de peces y, en la parte sur del puerto, hoy sumergida, un complejo que los excavadores tomaron por el santuario de Isis mencionado por Pausanias. En él había cajas de paneles de vidrio de colores, todavía embalados, que se hundieron cuando un terremoto sacudió la zona a finales del siglo IV d. C. Más tarde se construyó una basílica cristiana en el extremo sur del puerto, y este siguió en uso hasta el siglo VII."
  pt:
    - "Cencreia era o porto oriental de Corinto, no Golfo Sarônico, onde hoje fica a aldeia de Kechries. Estrabão a situa a cerca de setenta estádios da cidade e diz que ela servia ao comércio vindo da Ásia, enquanto Lecaio, o porto de Corinto no outro mar, servia ao comércio vindo da Itália. Pausânias conta que os portos receberam o nome de Leques e Cencrias, que se dizia serem filhos de Posêidon."
    - "Na Guerra do Peloponeso, Corinto mantinha ali tropas e navios. Em 425 a.C., quando os atenienses desembarcaram em território coríntio, os coríntios deixaram metade de suas forças em Cencreia, e em 412 a.C. os navios peloponésios destinados à guerra na Jônia zarparam dali. Depois que Corinto foi refundada como colônia romana, em 44 a.C., o porto prosperou. Pausânias, no século II d.C., viu ali um templo de Afrodite, um Posêidon de bronze no molhe e, na outra extremidade do porto, santuários de Asclépio e de Ísis. Apuleio, em seu romance Metamorfoses, situa em Cencreia a festa de primavera de Ísis, quando seus sacerdotes consagram um navio recém-construído na abertura da temporada de navegação."
    - "Quando Paulo deixou Corinto depois de sua longa estada, navegou para a Síria com Priscila e Áquila; “Ele raspou a cabeça em Cencreia, pois tinha feito um voto.” Em sua carta aos Romanos, provavelmente escrita de Corinto, ele recomenda a eles Febe, “serva da igreja que está em Cencreia”, e pede que a recebam e a ajudem; ela havia sido auxiliadora de muitos, e do próprio Paulo."
    - "Escavações americanas da década de 1960, sob Robert Scranton, trouxeram à luz armazéns, tanques de peixe e, na parte sul do porto, hoje submersa, um complexo que os escavadores tomaram pelo santuário de Ísis nomeado por Pausânias. Nele havia caixas de painéis de vidro colorido, ainda embalados, que afundaram quando um terremoto atingiu o lugar no fim do século IV d.C. Uma basílica cristã foi depois construída na extremidade sul do porto, e o porto continuou em uso até o século VII."
  de:
    - "Kenchreä war der östliche Hafen von Korinth am Saronischen Golf, dort, wo heute das Dorf Kechries steht. Strabon setzt ihn etwa siebzig Stadien von der Stadt entfernt an und sagt, er bediente den Handel mit Asien, während Lechaion, Korinths Hafen am anderen Meer, den Handel mit Italien bediente. Pausanias erzählt, die Häfen seien nach Leches und Kenchrias benannt, die Kinder des Poseidon gewesen sein sollen."
    - "Im Peloponnesischen Krieg hielt Korinth hier Truppen und Schiffe. Als die Athener 425 v. Chr. auf korinthischem Gebiet landeten, ließen die Korinther die Hälfte ihrer Streitmacht in Kenchreä zurück, und 412 v. Chr. segelten die peloponnesischen Schiffe für den Krieg in Ionien von dort ab. Nachdem Korinth 44 v. Chr. als römische Kolonie neu gegründet worden war, blühte der Hafen. Pausanias sah im 2. Jahrhundert n. Chr. einen Tempel der Aphrodite, einen bronzenen Poseidon auf der Mole und am anderen Ende des Hafens Heiligtümer des Asklepios und der Isis. Apuleius lässt in seinem Roman, den Metamorphosen, das Frühlingsfest der Isis in Kenchreä spielen, bei dem ihre Priester zu Beginn der Schifffahrtssaison ein neu gebautes Schiff weihen."
    - "Als Paulus nach seinem langen Aufenthalt Korinth verließ, segelte er mit Priscilla und Aquila nach Syrien, nachdem er „sein Haupt zu Kenchreä“ geschoren hatte, „denn er hatte ein Gelübde“. In seinem Brief an die Römer, wahrscheinlich in Korinth geschrieben, empfiehlt er ihnen Phöbe, „welche ist im Dienste der Gemeinde zu Kenchreä“, und bittet sie, sie aufzunehmen und ihr zu helfen; sie war vielen eine Helferin gewesen, auch Paulus selbst."
    - "Amerikanische Ausgrabungen der 1960er Jahre unter Robert Scranton legten Lagerhäuser, Fischbecken und im heute überfluteten Südteil des Hafens einen Komplex frei, den die Ausgräber für das von Pausanias genannte Heiligtum der Isis hielten. In ihm lagen noch verpackte Kisten mit Tafeln aus farbigem Glas, die versanken, als im späteren 4. Jahrhundert n. Chr. ein Erdbeben das Gebiet traf. Am Südende des Hafens wurde später eine christliche Basilika gebaut, und der Hafen blieb bis ins 7. Jahrhundert in Gebrauch."
  fr:
    - "Cenchrées était le port oriental de Corinthe, sur le golfe Saronique, là où se trouve aujourd’hui le village de Kechries. Strabon la met à environ soixante-dix stades de la ville et dit qu’elle servait au commerce venu d’Asie, tandis que Léchaion, le port de Corinthe sur l’autre mer, servait à celui d’Italie. Pausanias rapporte que les ports furent nommés d’après Léchès et Cenchrias, dits enfants de Poséidon."
    - "Pendant la guerre du Péloponnèse, Corinthe y entretenait des troupes et des navires. En 425 av. J.-C., quand les Athéniens débarquèrent en territoire corinthien, les Corinthiens laissèrent la moitié de leurs forces à Cenchrées, et en 412 av. J.-C. les navires péloponnésiens destinés à la guerre en Ionie en appareillèrent. Après la refondation de Corinthe comme colonie romaine en 44 av. J.-C., le port prospéra. Pausanias, au IIe siècle apr. J.-C., y vit un temple d’Aphrodite, un Poséidon de bronze sur le môle et, à l’autre bout du port, des sanctuaires d’Asclépios et d’Isis. Apulée, dans son roman les Métamorphoses, situe à Cenchrées la fête de printemps d’Isis, où ses prêtres consacrent un navire neuf à l’ouverture de la saison de navigation."
    - "Quand Paul quitta Corinthe après son long séjour, il s’embarqua pour la Syrie avec Priscille et Aquilas, « après s’être fait raser la tête à Cenchrées, car il avait fait un vœu ». Dans sa lettre aux Romains, probablement écrite de Corinthe, il leur recommande Phœbé, « qui est diaconesse de l’Église de Cenchrées », et leur demande de la recevoir et de l’aider ; elle avait secouru beaucoup de gens, et Paul lui-même."
    - "Les fouilles américaines des années 1960 sous la direction de Robert Scranton ont mis au jour des entrepôts, des viviers et, dans la partie sud du port aujourd’hui immergée, un ensemble que les fouilleurs ont pris pour le sanctuaire d’Isis nommé par Pausanias. S’y trouvaient des caisses de panneaux de verre coloré, encore emballés, qui coulèrent lors d’un séisme dans la seconde moitié du IVe siècle apr. J.-C. Une basilique chrétienne fut plus tard bâtie à l’extrémité sud du port, et le port resta en usage jusqu’au VIIe siècle."
  it:
    - "Cencre era il porto orientale di Corinto, sul Golfo Saronico, dove oggi sorge il villaggio di Kechries. Strabone la pone a circa settanta stadi dalla città e dice che serviva ai traffici con l’Asia, mentre Lecheo, il porto di Corinto sull’altro mare, serviva a quelli con l’Italia. Pausania racconta che i porti presero nome da Leche e Cencria, ritenuti figli di Poseidone."
    - "Nella guerra del Peloponneso Corinto vi teneva truppe e navi. Nel 425 a.C., quando gli Ateniesi sbarcarono in territorio corinzio, i Corinzi lasciarono metà delle forze a Cencre, e nel 412 a.C. da lì salparono le navi peloponnesiache per la guerra in Ionia. Dopo la rifondazione di Corinto come colonia romana nel 44 a.C. il porto prosperò. Pausania, nel II secolo d.C., vi vide un tempio di Afrodite, un Poseidone di bronzo sul molo e, all’altra estremità del porto, santuari di Asclepio e di Iside. Apuleio, nel romanzo delle Metamorfosi, ambienta a Cencre la festa primaverile di Iside, quando i suoi sacerdoti dedicano una nave appena costruita all’apertura della stagione della navigazione."
    - "Quando Paolo lasciò Corinto dopo il lungo soggiorno, navigò verso la Siria con Priscilla e Aquila, «dopo essersi fatto tosare il capo a Cencrea, perché avea fatto un voto». Nella lettera ai Romani, probabilmente scritta da Corinto, raccomanda loro Febe, «diaconessa della chiesa di Cencrea», e chiede di riceverla e assisterla; ella aveva assistito molti, e Paolo stesso."
    - "Gli scavi americani degli anni 1960 sotto Robert Scranton portarono alla luce magazzini, vasche per pesci e, nella parte meridionale del porto, oggi sommersa, un complesso che gli scavatori ritennero il santuario di Iside nominato da Pausania. Vi si trovavano casse di pannelli di vetro colorato, ancora imballati, affondati quando un terremoto colpì il porto nella seconda metà del IV secolo d.C. Più tardi fu costruita una basilica cristiana all’estremità meridionale del porto, che restò in uso fino al VII secolo."
  pl:
    - "Kenchrea była wschodnim portem Koryntu, nad Zatoką Sarońską, tam gdzie dziś stoi wieś Kechries. Strabon umieszcza ją w odległości około siedemdziesięciu stadiów od miasta i mówi, że obsługiwała handel z Azją, podczas gdy Lechajon, port Koryntu nad drugim morzem, obsługiwał handel z Italią. Pauzaniasz opowiada, że porty nazwano od Lechesa i Kenchriasa, uchodzących za dzieci Posejdona."
    - "W wojnie peloponeskiej Korynt trzymał tu wojska i okręty. W 425 r. p.n.e., gdy Ateńczycy wylądowali na terytorium korynckim, Koryntczycy zostawili połowę sił w Kenchrei, a w 412 r. p.n.e. stąd wypłynęły okręty peloponeskie na wojnę w Jonii. Po ponownym założeniu Koryntu jako kolonii rzymskiej w 44 r. p.n.e. port rozkwitał. Pauzaniasz w II w. n.e. widział świątynię Afrodyty, spiżowego Posejdona na molo, a na drugim końcu portu sanktuaria Asklepiosa i Izydy. Apulejusz w powieści Metamorfozy umieszcza w Kenchrei wiosenne święto Izydy, gdy jej kapłani poświęcają nowo zbudowany okręt na otwarcie sezonu żeglugi."
    - "Gdy Paweł opuścił Korynt po długim pobycie, odpłynął do Syrii z Pryscyllą i Akwilą, „ogoliwszy głowę w Kienchreach: bo był uczynił ślub”. W liście do Rzymian, pisanym prawdopodobnie z Koryntu, poleca im Febę, która jest „służebnicą zboru Kienchreeńskiego”, i prosi, by ją przyjęli i jej pomogli; była pomocnicą wielu, także samego Pawła."
    - "Amerykańskie wykopaliska z lat sześćdziesiątych pod kierunkiem Roberta Scrantona odsłoniły magazyny, zbiorniki na ryby i w zatopionej dziś południowej części portu zespół, który badacze uznali za sanktuarium Izydy wymienione przez Pauzaniasza. Leżały w nim skrzynie z panelami z kolorowego szkła, wciąż zapakowane, które zatonęły, gdy w późnym IV w. n.e. nawiedziło to miejsce trzęsienie ziemi. Na południowym końcu portu zbudowano później chrześcijańską bazylikę, a port pozostał w użyciu do VII w."
  nl:
    - "Kenchreeën was de oostelijke haven van Korinthe, aan de Saronische Golf, waar nu het dorp Kechries staat. Strabo plaatst het op ongeveer zeventig stadiën van de stad en zegt dat het de handel uit Azië bediende, terwijl Lechaeum, Korinthes haven aan de andere zee, de handel uit Italië bediende. Pausanias vertelt dat de havens genoemd waren naar Leches en Kenchrias, die kinderen van Poseidon zouden zijn."
    - "In de Peloponnesische Oorlog hield Korinthe hier troepen en schepen. In 425 v.Chr., toen de Atheners op Korinthisch gebied landden, lieten de Korinthiërs de helft van hun strijdmacht bij Kenchreeën achter, en in 412 v.Chr. voeren de Peloponnesische schepen voor de oorlog in Ionië ervandaan. Nadat Korinthe in 44 v.Chr. als Romeinse kolonie was herbouwd, bloeide de haven. Pausanias zag in de 2e eeuw n.Chr. een tempel van Aphrodite, een bronzen Poseidon op de pier en, aan het andere einde van de haven, heiligdommen van Asclepius en van Isis. Apuleius laat in zijn roman de Metamorfosen het lentefeest van Isis bij Kenchreeën plaatsvinden, wanneer haar priesters een nieuw gebouwd schip wijden bij het begin van het vaarseizoen."
    - "Toen Paulus na zijn lange verblijf Korinthe verliet, voer hij met Priscilla en Aquila naar Syrië, “zijn hoofd te Kenchreën geschoren hebbende; want hij had een gelofte gedaan”. In zijn brief aan de Romeinen, waarschijnlijk vanuit Korinthe geschreven, beveelt hij hun Febe aan, “die een dienares is der Gemeente, die te Kenchreën is”, en vraagt hun haar te ontvangen en te helpen; zij was een hulp geweest voor velen, en voor Paulus zelf."
    - "Amerikaanse opgravingen in de jaren 1960 onder Robert Scranton legden pakhuizen en visbassins bloot en, in het nu verzonken zuidelijke deel van de haven, een complex dat de opgravers hielden voor het heiligdom van Isis dat Pausanias noemt. Daarin lagen kisten met panelen van gekleurd glas, nog ingepakt, die wegzonken toen een aardbeving plaatsvond in de latere vierde eeuw n.Chr. Aan het zuidelijke einde van de haven werd later een christelijke basiliek gebouwd, en de haven bleef tot in de zevende eeuw in gebruik."
  cs:
    - "Kenchreje byly východní přístav Korintu na Sarónském zálivu, kde dnes leží vesnice Kechries. Strabón je klade asi sedmdesát stadií od města a praví, že sloužily obchodu z Asie, zatímco Lechaion, korintský přístav na druhém moři, sloužil obchodu z Itálie. Pausaniás vypráví, že přístavy byly pojmenovány po Léchovi a Kenchriovi, o nichž se říkalo, že byli dětmi Poseidónovými."
    - "V peloponéské válce držel Korint v Kenchrejích vojsko a lodě. Roku 425 př. n. l., když se Athéňané vylodili na korintském území, nechali Korinťané v Kenchrejích polovinu svých sil a roku 412 př. n. l. z nich vyplula peloponéská loďstva k válce v Iónii. Po obnovení Korintu jako římské kolonie roku 44 př. n. l. přístav vzkvétal. Pausaniás ve 2. století n. l. viděl chrám Afrodíty, bronzového Poseidóna na molu a na druhém konci přístavu svatyně Asklépia a Isidy. Apuleius ve svém románu Proměny klade do Kenchrejí jarní slavnost Isidy, kdy její kněží zasvěcují nově postavenou loď na počátku plavební sezóny."
    - "Když Pavel po svém dlouhém pobytu opustil Korint, plavil se do Sýrie s Priscillou a Akvilou, „oholiv hlavu v Cenchreis; nebo byl učinil slib“. V listu Římanům, psaném pravděpodobně z Korintu, jim doporučuje Fébu, „služebnici církve Cenchrenské“, a žádá je, aby ji přijali a pomohli jí; byla pomocnicí mnohých i samého Pavla."
    - "Americké vykopávky 60. let pod vedením Roberta Scrantona odkryly sklady, rybí nádrže a v dnes potopené jižní části přístavu komplex, který vykopávači pokládali za svatyni Isidy jmenovanou Pausaniem. Ležely v něm bedny s panely z barevného skla, dosud zabalené, které se potopily při zemětřesení v pozdním 4. století n. l. Na jižním konci přístavu byla později postavena křesťanská bazilika a přístav zůstal v užívání do 7. století."
  sv:
    - "Kenchreai var Korinths östra hamn, vid Saroniska viken där byn Kechries ligger i dag. Strabon placerar den omkring sjuttio stadier från staden och säger att den tjänade handeln från Asien, medan Lechaion, Korinths hamn vid det andra havet, tjänade handeln från Italien. Pausanias berättar att hamnarna uppkallades efter Leches och Kenchrias, som sades vara barn till Poseidon."
    - "Under peloponnesiska kriget höll Korinth trupper och fartyg här. År 425 f.Kr., när atenarna landsteg på korintiskt område, lämnade korintierna halva sin styrka vid Kenchreai, och år 412 f.Kr. avseglade de peloponnesiska fartygen för kriget i Jonien från hamnen. Sedan Korinth grundats på nytt som romersk koloni 44 f.Kr. blomstrade hamnen. Pausanias såg på 100-talet e.Kr. ett tempel åt Afrodite, en bronsstaty av Poseidon på hamnpiren och, vid hamnens andra ände, helgedomar åt Asklepios och Isis. Apuleius förlägger i sin roman Metamorfoserna Isis vårfest till Kenchreai, då hennes präster invigde ett nybyggt fartyg vid seglationens början."
    - "När Paulus lämnade Korinth efter sin långa vistelse seglade han till Syrien med Priscilla och Aquila, ”sedan han i Kenkrea hade låtit raka sitt huvud”, ty han hade ett löfte. I brevet till romarna, som troligen skrevs i Korinth, anbefaller han åt dem Foibe, som är ”församlingstjänarinna i Kenkrea”, och ber dem ta emot henne och bistå henne; hon hade varit ett stöd för många, och jämväl för Paulus själv."
    - "Amerikanska utgrävningar på 1960-talet under Robert Scranton blottade magasin, fiskbassänger och, i hamnens nu sänkta södra del, ett komplex som utgrävarna höll för den Isishelgedom som Pausanias nämner. I den låg lådor med paneler av färgat glas, fortfarande förpackade, som sjönk när en jordbävning inträffade under senare 300-talet e.Kr. En kristen basilika byggdes senare vid hamnens södra ände, och hamnen förblev i bruk in på 600-talet."
