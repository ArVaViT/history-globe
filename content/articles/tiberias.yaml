body:
  en:
    - "Tiberias lies on the western shore of the Sea of Galilee, below steep hills, with hot springs at Hammath just to the south. Herod Antipas, tetrarch of Galilee, founded it about AD 20 and named it after the emperor Tiberius. Josephus says the site was cleared of tombs, so that observant Jews held it unclean; Antipas settled it with Galileans, newcomers, poor people and freed slaves, compelling some to come and giving others houses and land. Tiberias replaced Sepphoris as the leading city of Galilee."
    - "In the New Testament the city appears only in John: boats from Tiberias came near the place where the multitude had eaten bread, and John calls the lake the sea of Tiberias. The Gospels do not say that Jesus ever entered it."
    - "Nero gave Tiberias to King Agrippa II. When the revolt broke out in AD 66, a party led by Jesus son of Sapphias burned Antipas' palace, which was adorned with figures of living creatures. Josephus walled the city, but in 67 its elders went out to Vespasian, the gates were opened, and the Romans broke down part of the south wall to march in. After the war Tiberias became a centre of Jewish learning. The Talmud names it as the last seat of the Sanhedrin, and the Jerusalem Talmud took shape largely in its schools by about AD 400."
    - "At Hammath, excavations by Moshe Dothan in 1961–1963 uncovered a synagogue whose mosaic floor, usually dated to the fourth century, shows the zodiac around the sun god Helios, beside a Torah shrine and menorahs. Epiphanius tells of Joseph of Tiberias, a Jew of the city who became a Christian and received leave from Constantine to build churches in Jewish towns, and who tried to turn an unfinished temple of Hadrian in Tiberias into a church. Excavations led by Yizhar Hirschfeld from 1989 have uncovered parts of the Roman and Byzantine city."
  ru:
    - "Тивериада лежит на западном берегу моря Галилейского, под крутыми холмами; сразу к югу от неё — горячие источники Хаммата. Ирод Антипа, четвертовластник Галилеи, основал её около 20 г. н. э. и назвал в честь императора Тиверия. Иосиф Флавий пишет, что для города пришлось убрать гробницы, и потому благочестивые иудеи считали его нечистым; Антипа заселил его галилеянами, пришельцами, бедняками и вольноотпущенниками, одних принуждая переселиться, другим давая дома и землю. Тивериада сменила Сепфорис как главный город Галилеи."
    - "В Новом Завете город упоминается только у Иоанна: из Тивериады пришли лодки близко к тому месту, где народ ел хлеб, и Иоанн называет озеро морем Тивериадским. Евангелия не говорят, что Иисус когда-либо входил в него."
    - "Нерон отдал Тивериаду царю Агриппе II. Когда в 66 г. н. э. вспыхнуло восстание, сторонники Иисуса, сына Сапфии, сожгли дворец Антипы, украшенный изображениями живых существ. Иосиф Флавий обнёс город стеной, но в 67 г. его старейшины вышли к Веспасиану, ворота открыли, и римляне разрушили часть южной стены, чтобы войти. После войны Тивериада стала средоточием иудейской учёности. Талмуд называет её последним местопребыванием синедриона, а Иерусалимский Талмуд сложился в основном в её школах к 400 г. н. э."
    - "В Хаммате раскопки Моше Дотана в 1961–1963 гг. открыли синагогу, мозаичный пол которой, обычно датируемый IV веком, изображает зодиак вокруг бога солнца Гелиоса, рядом с ковчегом Торы и семисвечниками. Епифаний рассказывает об Иосифе Тивериадском, иудее этого города, который стал христианином, получил от Константина позволение строить церкви в иудейских городах и пытался обратить в церковь недостроенный храм Адриана в Тивериаде. Раскопки под руководством Ицхара Хиршфельда с 1989 г. открыли части римского и византийского города."
  uk:
    - "Тіверіада лежить на західному березі Галілейського моря, під крутими пагорбами, з гарячими джерелами в Хаматі трохи на південь. Ірод Антипа, тетрарх Галілеї, заснував її близько 20 року н. е. і назвав на честь імператора Тиверія. Йосиф Флавій каже, що місце було очищене від гробниць, тож благочестиві юдеї вважали його нечистим; Антипа заселив його галілеянами, прибульцями, бідняками й відпущениками, одних примушуючи прийти, а іншим даючи будинки й землю. Тіверіада замінила Сепфоріс як головне місто Галілеї."
    - "У Новому Заповіті місто з’являється лише в Івана: човни з Тіверіади підпливли до місця, де народ їв хліб, а Іван називає озеро морем Тіверіадським. Євангелія не кажуть, що Ісус коли-небудь входив у нього."
    - "Нерон віддав Тіверіаду цареві Агриппі II. Коли в 66 році н. е. спалахнуло повстання, гурт на чолі з Ісусом, сином Сапфії, спалив палац Антипи, оздоблений зображеннями живих істот. Йосиф Флавій обніс місто муром, але 67 року його старійшини вийшли до Веспасіана, ворота відчинили, і римляни зруйнували частину південної стіни, щоб увійти. Після війни Тіверіада стала осередком юдейської науки. Талмуд називає її останнім місцем Синедріону, а Єрусалимський Талмуд склався значною мірою в її школах приблизно до 400 року н. е."
    - "У Хаматі розкопки Моше Дотана 1961–1963 років виявили синагогу з мозаїчною підлогою, яку зазвичай датують IV століттям, із зодіаком навколо бога сонця Геліоса поруч із кивотом Тори й менорами. Єпіфаній розповідає про Йосипа з Тіверіади, юдея цього міста, що став християнином і дістав від Костянтина дозвіл будувати церкви в юдейських містах і який намагався перетворити недобудований храм Адріана в Тіверіаді на церкву. Розкопки під керівництвом Іцхара Гіршфельда з 1989 року відкрили частини римського й візантійського міста."
  es:
    - "Tiberias se encuentra en la orilla occidental del Mar de Galilea, al pie de empinadas colinas, con aguas termales en Hamat, justo al sur. Herodes Antipas, tetrarca de Galilea, la fundó hacia el 20 d. C. y le dio el nombre del emperador Tiberio. Josefo dice que el lugar fue despejado de tumbas, de modo que los judíos observantes lo tenían por impuro; Antipas lo pobló con galileos, recién llegados, pobres y esclavos liberados, obligando a algunos a venir y dando a otros casas y tierras. Tiberias sustituyó a Séforis como la principal ciudad de Galilea."
    - "En el Nuevo Testamento la ciudad aparece solo en Juan: unas barcas de Tiberias llegaron cerca del lugar donde la multitud había comido pan, y Juan llama al lago mar de Tiberias. Los Evangelios no dicen que Jesús entrara nunca en ella."
    - "Nerón dio Tiberias al rey Agripa II. Cuando estalló la revuelta en el 66 d. C., un grupo dirigido por Jesús hijo de Safías incendió el palacio de Antipas, adornado con figuras de seres vivos. Josefo amuralló la ciudad, pero en 67 sus ancianos salieron al encuentro de Vespasiano, se abrieron las puertas y los romanos derribaron parte de la muralla sur para entrar. Después de la guerra, Tiberias se convirtió en un centro del saber judío. El Talmud la nombra como la última sede del Sanedrín, y el Talmud de Jerusalén tomó forma en gran parte en sus escuelas hacia el 400 d. C."
    - "En Hamat, las excavaciones de Moshe Dothan en 1961–1963 sacaron a la luz una sinagoga cuyo suelo de mosaico, fechado habitualmente en el siglo IV, muestra el zodiaco en torno al dios solar Helios, junto a un arca de la Torá y menorás. Epifanio cuenta de José de Tiberias, un judío de la ciudad que se hizo cristiano y recibió licencia de Constantino para construir iglesias en ciudades judías, y que intentó convertir en iglesia un templo inacabado de Adriano en Tiberias. Las excavaciones dirigidas por Yizhar Hirschfeld desde 1989 han sacado a la luz partes de la ciudad romana y bizantina."
  pt:
    - "Tiberíades fica na margem ocidental do Mar da Galileia, abaixo de colinas íngremes, com fontes termais em Hamate, logo ao sul. Herodes Antipas, tetrarca da Galileia, a fundou por volta de 20 d.C. e lhe deu o nome do imperador Tibério. Josefo diz que o terreno foi limpo de sepulcros, de modo que os judeus observantes o consideravam impuro; Antipas a povoou com galileus, recém-chegados, pobres e escravos libertos, forçando alguns a vir e dando a outros casas e terras. Tiberíades substituiu Séforis como principal cidade da Galileia."
    - "No Novo Testamento a cidade aparece só em João: barcos de Tiberíades chegaram perto do lugar onde a multidão comera pão, e João chama o lago de mar de Tiberíades. Os Evangelhos não dizem que Jesus alguma vez entrou nela."
    - "Nero deu Tiberíades ao rei Agripa II. Quando a revolta estourou em 66 d.C., um partido liderado por Jesus, filho de Safias, queimou o palácio de Antipas, adornado com figuras de seres vivos. Josefo murou a cidade, mas em 67 seus anciãos foram ao encontro de Vespasiano, as portas foram abertas, e os romanos derrubaram parte da muralha sul para entrar. Depois da guerra, Tiberíades tornou-se centro do saber judaico. O Talmude a nomeia como a última sede do Sinédrio, e o Talmude de Jerusalém tomou forma em grande parte em suas escolas por volta de 400 d.C."
    - "Em Hamate, escavações de Moshe Dothan em 1961–1963 revelaram uma sinagoga cujo piso de mosaico, geralmente datado do século IV, mostra o zodíaco em torno do deus-sol Hélio, ao lado de um nicho da Torá e de menorás. Epifânio conta de José de Tiberíades, judeu da cidade que se tornou cristão e recebeu licença de Constantino para construir igrejas em cidades judaicas, e que tentou transformar em igreja um templo inacabado de Adriano em Tiberíades. Escavações dirigidas por Yizhar Hirschfeld desde 1989 revelaram partes da cidade romana e bizantina."
  de:
    - "Tiberias liegt am Westufer des Sees Genezareth unter steilen Hügeln, mit heißen Quellen bei Hammat unmittelbar südlich. Herodes Antipas, Tetrarch von Galiläa, gründete es um 20 n. Chr. und benannte es nach Kaiser Tiberius. Josephus sagt, der Platz sei von Gräbern geräumt worden, sodass fromme Juden ihn für unrein hielten; Antipas besiedelte ihn mit Galiläern, Zugezogenen, Armen und Freigelassenen, zwang manche zum Kommen und gab anderen Häuser und Land. Tiberias löste Sepphoris als führende Stadt Galiläas ab."
    - "Im Neuen Testament erscheint die Stadt nur bei Johannes: Boote aus Tiberias kamen nahe an den Ort, wo die Menge Brot gegessen hatte, und Johannes nennt den See das Meer von Tiberias. Die Evangelien sagen nicht, dass Jesus sie je betrat."
    - "Nero schenkte Tiberias König Agrippa II. Als 66 n. Chr. der Aufstand ausbrach, verbrannte eine Gruppe unter Jesus, dem Sohn des Sapphias, den Palast des Antipas, der mit Bildern lebender Wesen geschmückt war. Josephus ummauerte die Stadt, doch 67 gingen ihre Ältesten zu Vespasian hinaus, die Tore wurden geöffnet, und die Römer rissen einen Teil der Südmauer ein, um einzuziehen. Nach dem Krieg wurde Tiberias ein Zentrum jüdischer Gelehrsamkeit. Der Talmud nennt es den letzten Sitz des Sanhedrins, und der Jerusalemer Talmud entstand bis etwa 400 n. Chr. weitgehend in seinen Schulen."
    - "In Hammat legten Grabungen von Moshe Dotan 1961–1963 eine Synagoge frei, deren Mosaikboden, meist ins vierte Jahrhundert datiert, den Tierkreis um den Sonnengott Helios zeigt, neben einem Toraschrein und Menorot. Epiphanius erzählt von Josef von Tiberias, einem Juden der Stadt, der Christ wurde und von Konstantin die Erlaubnis erhielt, in jüdischen Städten Kirchen zu bauen, und der einen unvollendeten Tempel Hadrians in Tiberias in eine Kirche verwandeln wollte. Grabungen unter Yizhar Hirschfeld seit 1989 haben Teile der römischen und byzantinischen Stadt freigelegt."
  fr:
    - "Tibériade s’étend sur la rive occidentale de la mer de Galilée, au pied de collines escarpées, avec les sources chaudes de Hammath juste au sud. Hérode Antipas, tétrarque de Galilée, la fonda vers 20 apr. J.-C. et la nomma d’après l’empereur Tibère. Selon Josèphe, le site fut débarrassé de ses tombes, si bien que les Juifs observants le tenaient pour impur ; Antipas la peupla de Galiléens, de nouveaux venus, de pauvres et d’esclaves affranchis, contraignant certains à venir et donnant à d’autres maisons et terres. Tibériade remplaça Sepphoris comme principale ville de Galilée."
    - "Dans le Nouveau Testament, la ville n’apparaît que chez Jean : des barques de Tibériade abordèrent près du lieu où la foule avait mangé le pain, et Jean appelle le lac mer de Tibériade. Les Évangiles ne disent pas que Jésus y soit jamais entré."
    - "Néron donna Tibériade au roi Agrippa II. Quand la révolte éclata en 66 apr. J.-C., un parti mené par Jésus fils de Sapphias incendia le palais d’Antipas, orné de figures d’êtres vivants. Josèphe fortifia la ville, mais en 67 ses anciens allèrent trouver Vespasien, les portes s’ouvrirent, et les Romains abattirent une partie du mur sud pour entrer. Après la guerre, Tibériade devint un centre du savoir juif. Le Talmud la nomme dernier siège du Sanhédrin, et le Talmud de Jérusalem prit forme en grande partie dans ses écoles vers 400 apr. J.-C."
    - "À Hammath, les fouilles de Moshe Dothan en 1961-1963 dégagèrent une synagogue dont le pavement de mosaïque, d’ordinaire daté du IVe siècle, montre le zodiaque autour du dieu-soleil Hélios, près d’une niche de la Torah et de ménorot. Épiphane raconte l’histoire de Joseph de Tibériade, un Juif de la ville devenu chrétien, qui obtint de Constantin l’autorisation de bâtir des églises dans les villes juives et tenta de transformer en église un temple inachevé d’Hadrien à Tibériade. Les fouilles dirigées par Yizhar Hirschfeld depuis 1989 ont mis au jour des parties de la ville romaine et byzantine."
  pl:
    - "Tyberiada leży nad zachodnim brzegiem Jeziora Galilejskiego, pod stromymi wzgórzami, z gorącymi źródłami w Chammat tuż na południe. Herod Antypas, tetrarcha Galilei, założył ją około 20 roku n.e. i nazwał od cesarza Tyberiusza. Józef Flawiusz pisze, że miejsce oczyszczono z grobów, tak że pobożni Żydzi uważali je za nieczyste; Antypas zasiedlił je Galilejczykami, przybyszami, ubogimi i wyzwoleńcami, jednych zmuszając do przybycia, innym dając domy i ziemię. Tyberiada zastąpiła Sefforis jako główne miasto Galilei."
    - "W Nowym Testamencie miasto pojawia się tylko u Jana: łodzie z Tyberiady przypłynęły w pobliże miejsca, gdzie tłum jadł chleb, a Jan nazywa jezioro jeziorem Tyberiadzkim. Ewangelie nie mówią, by Jezus kiedykolwiek do niej wszedł."
    - "Neron dał Tyberiadę królowi Agryppie II. Gdy w 66 roku n.e. wybuchło powstanie, grupa pod wodzą Jezusa, syna Sapfiasza, spaliła pałac Antypasa, ozdobiony wyobrażeniami istot żywych. Józef Flawiusz obwarował miasto murem, ale w 67 roku jego starsi wyszli do Wespazjana, bramy otwarto, a Rzymianie zburzyli część południowego muru, by wmaszerować. Po wojnie Tyberiada stała się ośrodkiem żydowskiej nauki. Talmud wymienia ją jako ostatnią siedzibę Sanhedrynu, a Talmud jerozolimski powstał w dużej mierze w jej szkołach około 400 roku n.e."
    - "W Chammat wykopaliska Moszego Dotana z lat 1961–1963 odsłoniły synagogę, której mozaikowa posadzka, zwykle datowana na IV wiek, przedstawia zodiak wokół boga słońca Heliosa, obok szafy na Torę i menor. Epifaniusz opowiada o Józefie z Tyberiady, Żydzie z tego miasta, który został chrześcijaninem i otrzymał od Konstantyna zezwolenie na budowę kościołów w miastach żydowskich, i który próbował przerobić na kościół niedokończoną świątynię Hadriana w Tyberiadzie. Wykopaliska prowadzone przez Jizhara Hirschfelda od 1989 roku odsłoniły części miasta rzymskiego i bizantyjskiego."
  it:
    - "Tiberiade sorge sulla riva occidentale del lago di Tiberiade, sotto ripide colline, con sorgenti calde a Cammat poco a sud. Erode Antipa, tetrarca della Galilea, la fondò verso il 20 d.C. e la chiamò così in onore dell’imperatore Tiberio. Giuseppe Flavio dice che il sito fu liberato dalle tombe, per cui gli Ebrei osservanti lo ritenevano impuro; Antipa vi stabilì Galilei, nuovi venuti, poveri e schiavi liberati, costringendo alcuni a venire e dando ad altri case e terre. Tiberiade sostituì Sefforis come città principale della Galilea."
    - "Nel Nuovo Testamento la città compare solo in Giovanni: barche da Tiberiade giunsero presso il luogo dove la moltitudine aveva mangiato il pane, e Giovanni chiama il lago mare di Tiberiade. I Vangeli non dicono che Gesù vi sia mai entrato."
    - "Nerone diede Tiberiade al re Agrippa II. Quando scoppiò la rivolta nel 66 d.C., un gruppo guidato da Gesù figlio di Safia incendiò il palazzo di Antipa, adorno di figure di esseri viventi. Giuseppe Flavio cinse la città di mura, ma nel 67 i suoi anziani andarono incontro a Vespasiano, le porte furono aperte, e i Romani abbatterono parte del muro meridionale per entrare. Dopo la guerra Tiberiade divenne un centro di studio ebraico. Il Talmud la nomina come ultima sede del Sinedrio, e il Talmud di Gerusalemme prese forma in gran parte nelle sue scuole entro il 400 d.C. circa."
    - "A Cammat, gli scavi di Moshe Dothan del 1961–1963 portarono alla luce una sinagoga il cui pavimento a mosaico, di solito datato al IV secolo, mostra lo zodiaco attorno al dio sole Helios, accanto a un’arca della Torah e a menorot. Epifanio racconta di Giuseppe di Tiberiade, un Ebreo della città che si fece cristiano e ottenne da Costantino il permesso di costruire chiese nelle città ebraiche, e che tentò di trasformare in chiesa un tempio incompiuto di Adriano a Tiberiade. Gli scavi diretti da Yizhar Hirschfeld dal 1989 hanno portato alla luce parti della città romana e bizantina."
  nl:
    - "Tiberias ligt aan de westoever van het Meer van Galilea, onder steile heuvels, met warme bronnen bij Chammat even naar het zuiden. Herodes Antipas, tetrarch van Galilea, stichtte het omstreeks 20 n.Chr. en noemde het naar keizer Tiberius. Flavius Josephus zegt dat de plek van graven werd ontruimd, zodat vrome Joden haar onrein hielden; Antipas bevolkte de stad met Galileeërs, nieuwkomers, armen en vrijgelaten slaven, waarbij hij sommigen dwong te komen en anderen huizen en land gaf. Tiberias nam de plaats van Sepforis als voornaamste stad van Galilea over."
    - "In het Nieuwe Testament komt de stad alleen voor in Johannes: boten uit Tiberias kwamen bij de plaats waar de menigte brood had gegeten, en Johannes noemt het meer “de zee van Tiberias”. De evangeliën zeggen niet dat Jezus er ooit binnenging."
    - "Nero schonk Tiberias aan koning Agrippa II. Toen in 66 n.Chr. de opstand uitbrak, stak een groep onder leiding van Jezus, zoon van Sapphias, het paleis van Antipas in brand, dat was versierd met afbeeldingen van levende wezens. Flavius Josephus ommuurde de stad, maar in 67 gingen haar oudsten naar Vespasianus, werden de poorten geopend, en braken de Romeinen een deel van de zuidmuur af om binnen te trekken. Na de oorlog werd Tiberias een centrum van Joodse geleerdheid. De Talmoed noemt het de laatste zetel van het Sanhedrin, en de Jeruzalemse Talmoed kwam grotendeels in zijn scholen tot stand, omstreeks 400 n.Chr."
    - "Bij Chammat legden opgravingen van Moshe Dothan in 1961–1963 een synagoge bloot waarvan de mozaïekvloer, gewoonlijk in de vierde eeuw gedateerd, de dierenriem rond de zonnegod Helios toont, naast een Torahschrijn en menora’s. Epiphanius vertelt over Jozef van Tiberias, een Jood uit de stad die christen werd en van Constantijn verlof kreeg om kerken te bouwen in Joodse steden, en die probeerde een onvoltooide tempel van Hadrianus in Tiberias tot een kerk om te vormen. Opgravingen onder leiding van Yizhar Hirschfeld sinds 1989 hebben delen van de Romeinse en Byzantijnse stad blootgelegd."
  cs:
    - "Tiberias leží na západním břehu Galilejského jezera, pod strmými kopci, s horkými prameny v Chamatu těsně na jih. Herodes Antipas, tetrarcha Galileje, ji založil kolem roku 20 n. l. a pojmenoval po císaři Tiberiovi. Josephus říká, že místo bylo vyčištěno od hrobů, takže je zbožní Židé pokládali za nečisté; Antipas je osídlil Galilejci, přistěhovalci, chudými a propuštěnými otroky, některé k příchodu nutil a jiným dával domy a půdu. Tiberias nahradila Sepforis jako přední město Galileje."
    - "V Novém zákoně se město objevuje jen u Jana: lodi z Tiberias přirazily blízko místa, kde zástup jedl chléb, a Jan nazývá jezero mořem Tiberiadským. Evangelia neříkají, že by do ní Ježíš kdy vstoupil."
    - "Nero dal Tiberias králi Agrippovi II. Když roku 66 n. l. vypuklo povstání, skupina vedená Ježíšem, synem Sapfiášovým, vypálila Antipův palác, který byl ozdoben podobami živých tvorů. Josephus město opevnil, ale roku 67 vyšli jeho starší k Vespasianovi, brány byly otevřeny a Římané strhli část jižní hradby, aby vešli. Po válce se Tiberias stala střediskem židovské učenosti. Talmud ji jmenuje jako poslední sídlo sanhedrinu a Jeruzalémský talmud vznikl z velké části v jejích školách do roku 400 n. l."
    - "V Chamatu odkryly vykopávky Moše Dótana v letech 1961–1963 synagogu, jejíž mozaiková podlaha, obvykle datovaná do 4. století, ukazuje zvěrokruh kolem boha slunce Hélia vedle schránky na Tóru a menor. Epifanios vypráví o Josefu z Tiberias, Židu z města, který se stal křesťanem a od Konstantina dostal povolení stavět kostely v židovských městech a který se pokusil přeměnit nedokončený Hadrianův chrám v Tiberias na kostel. Vykopávky vedené Jicharem Hirschfeldem od roku 1989 odkryly části římského a byzantského města."
  sv:
    - "Tiberias ligger på västra stranden av Galileiska sjön, nedanför branta berg, med heta källor vid Hammat strax söderut. Herodes Antipas, tetrark av Galileen, grundade staden omkring 20 e.Kr. och uppkallade den efter kejsar Tiberius. Josefus säger att platsen rensades från gravar, så att toratrogna judar höll den för oren; Antipas bosatte där galileer, inflyttade, fattiga och frigivna slavar, tvingade några att komma och gav andra hus och mark. Tiberias ersatte Sefforis som Galileens ledande stad."
    - "I Nya testamentet förekommer staden bara hos Johannes: båtar från Tiberias kom nära platsen där skaran hade ätit bröd, och Johannes kallar sjön Tiberiassjön. Evangelierna säger inte att Jesus någonsin gick in i staden."
    - "Nero gav Tiberias åt kung Agrippa II. När upproret bröt ut år 66 e.Kr. brände en grupp under ledning av Jesus, Sapphias' son, Antipas' palats, som var prytt med bilder av levande varelser. Josefus lät mura in staden, men år 67 gick dess äldste ut till Vespasianus, portarna öppnades, och romarna rev en del av södra muren för att marschera in. Efter kriget blev Tiberias ett centrum för judisk lärdom. Talmud nämner den som Sanhedrins sista säte, och Jerusalemtalmud tog form till stor del i dess skolor omkring år 400 e.Kr."
    - "Vid Hammat frilade Moshe Dothans utgrävningar 1961–1963 en synagoga vars mosaikgolv, vanligen daterat till 300-talet, visar zodiaken runt solguden Helios, bredvid ett toraskrin och menorot. Epifanios berättar om Josef av Tiberias, en jude från staden som blev kristen och fick tillstånd av Konstantin att bygga kyrkor i judiska städer, och som försökte göra ett ofullbordat tempel av Hadrianus i Tiberias till kyrka. Utgrävningar under ledning av Yizhar Hirschfeld från 1989 har frilagt delar av den romerska och bysantinska staden."
  nb:
    - "Tiberias ligger på vestbredden av Galileasjøen, under bratte høyder, med varme kilder ved Hammat rett mot sør. Herodes Antipas, tetrark av Galilea, grunnla den omkring 20 e.Kr. og oppkalte den etter keiser Tiberius. Josefus sier at stedet var ryddet for graver, slik at lovtro jøder regnet det som urent; Antipas bosatte det med galileere, innflyttere, fattige og frigitte slaver, tvang noen til å komme og ga andre hus og jord. Tiberias avløste Sepforis som den ledende byen i Galilea."
    - "I Det nye testamente forekommer byen bare hos Johannes: båter fra Tiberias kom nær stedet der folkemengden hadde spist brød, og Johannes kaller innsjøen Tiberias-sjøen. Evangeliene sier ikke at Jesus noen gang gikk inn i den."
    - "Nero ga Tiberias til kong Agrippa II. Da opprøret brøt ut i 66 e.Kr., brente en gruppe ledet av Jesus, Sapphias' sønn, Antipas' palass, som var utsmykket med bilder av levende skapninger. Josefus murte byen, men i 67 gikk de eldste ut til Vespasian, portene ble åpnet, og romerne brøt ned en del av sørmuren for å marsjere inn. Etter krigen ble Tiberias et sentrum for jødisk lærdom. Talmud nevner den som Sanhedrinets siste sete, og Jerusalem-talmud tok i stor grad form i skolene der omkring 400 e.Kr."
    - "Ved Hammat avdekket utgravninger ledet av Moshe Dothan i 1961–1963 en synagoge med et mosaikkgulv, vanligvis datert til 300-tallet, som viser dyrekretsen rundt solguden Helios, ved siden av et toraskrin og menoraer. Epifanios forteller om Josef av Tiberias, en jøde i byen som ble kristen og fikk tillatelse av Konstantin til å bygge kirker i jødiske byer, og som forsøkte å gjøre et uferdig tempel av Hadrian i Tiberias om til en kirke. Utgravninger ledet av Yizhar Hirschfeld fra 1989 har avdekket deler av den romerske og bysantinske byen."
  tl:
    - "Ang Tiberias ay nasa kanlurang baybayin ng Dagat ng Galilea, sa ilalim ng matatarik na burol, na may mga mainit na bukal sa Hamath sa timog lamang nito. Itinatag ito ni Herodes Antipas, tetrarka ng Galilea, noong mga 20 AD at ipinangalan sa emperador na si Tiberio. Sinasabi ni Josefo na nilinis ang pook mula sa mga libingan, kaya itinuring itong marumi ng mga masugid na Judio; pinatira roon ni Antipas ang mga Galileo, mga bagong dating, mahihirap at pinalayang alipin, at pinilit ang ilan na pumunta at binigyan ang iba ng bahay at lupa. Pinalitan ng Tiberias ang Sepphoris bilang pangunahing lunsod ng Galilea."
    - "Sa Bagong Tipan, lumilitaw lamang ang lunsod sa Juan: ang mga bangka mula sa Tiberias ay lumapit sa lugar kung saan kumain ng tinapay ang karamihan, at tinatawag ni Juan ang lawa na dagat ng Tiberias. Hindi sinasabi ng mga Ebanghelyo na pumasok dito si Jesus."
    - "Ibinigay ni Nero ang Tiberias kay Haring Agripa II. Nang sumiklab ang paghihimagsik noong 66 AD, sinunog ng isang pangkat sa pamumuno ni Jesus na anak ni Sapphias ang palasyo ni Antipas, na pinalamutian ng mga larawan ng nabubuhay na nilalang. Pinaderan ni Josefo ang lunsod, ngunit noong 67 ay lumabas ang mga matanda nito kay Vespasiano, binuksan ang mga pintuan, at sinira ng mga Romano ang bahagi ng timugang pader upang pumasok. Pagkatapos ng digmaan, naging sentro ng pag-aaral ng mga Judio ang Tiberias. Pinangangalanan ito ng Talmud na huling luklukan ng Sanhedrin, at ang Talmud ng Jerusalem ay nabuo higit sa lahat sa mga paaralan nito noong mga 400 AD."
    - "Sa Hamath, ang mga paghuhukay ni Moshe Dothan noong 1961–1963 ay naglantad ng sinagoga na ang sahig na mosaiko, karaniwang pinepetsahan noong ika-4 na siglo, ay nagpapakita ng zodiac sa palibot ng diyos-araw na si Helios, sa tabi ng dambana ng Torah at mga menorah. Isinasalaysay ni Epifanio si Jose ng Tiberias, isang Judio ng lunsod na naging Kristiyano at tumanggap ng pahintulot kay Constantino na magtayo ng mga simbahan sa mga bayang Judio, at sinubukang gawing simbahan ang di-natapos na templo ni Hadriano sa Tiberias. Ang mga paghuhukay sa pamumuno ni Yizhar Hirschfeld mula 1989 ay naglantad ng mga bahagi ng lunsod na Romano at Bizantino."
  da:
    - "Tiberias ligger på Genesaret Søs vestlige bred, neden for stejle bakker, med varme kilder ved Hammat lige syd for. Herodes Antipas, tetrark af Galilæa, grundlagde den omkring 20 e.Kr. og opkaldte den efter kejser Tiberius. Josephus siger, at stedet blev ryddet for grave, så at nidkære jøder holdt det for urent; Antipas bosatte det med galilæere, tilflyttere, fattige og frigivne slaver, idet han tvang nogle til at komme og gav andre huse og jord. Tiberias afløste Sepforis som Galilæas førende by."
    - "I Det Nye Testamente optræder byen kun hos Johannes: både fra Tiberias kom nær det sted, hvor skaren havde spist brød, og Johannes kalder søen Tiberias' sø. Evangelierne siger ikke, at Jesus nogensinde gik ind i byen."
    - "Nero gav Tiberias til kong Agrippa 2. Da oprøret brød ud i 66 e.Kr., brændte et parti under ledelse af Jesus, søn af Sapphias, Antipas' palads, som var smykket med billeder af levende væsener. Josephus befæstede byen med mur, men i 67 gik dens ældste ud til Vespasian, portene blev åbnet, og romerne brød en del af sydmuren ned for at marchere ind. Efter krigen blev Tiberias et centrum for jødisk lærdom. Talmud nævner den som Sanhedrinets sidste sæde, og Jerusalemtalmud tog form i vid udstrækning i dens skoler omkring 400 e.Kr."
    - "Ved Hammat blottede Moshe Dothans udgravninger i 1961–1963 en synagoge, hvis mosaikgulv, sædvanligvis dateret til 300-tallet, viser dyrekredsen omkring solguden Helios, ved siden af et Tora-skrin og menoraer. Epifanios fortæller om Josef af Tiberias, en jøde fra byen, der blev kristen og fik lov af Konstantin til at bygge kirker i jødiske byer, og som forsøgte at forvandle et ufærdigt tempel af Hadrian i Tiberias til en kirke. Udgravninger ledet af Yizhar Hirschfeld fra 1989 har blottet dele af den romerske og byzantinske by."
