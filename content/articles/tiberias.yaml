# Overview article (ADR 0007). Mainstream facts only; the founding is given as about AD 20, as usual.
id: tiberias
place: ac9adc9
title:
  en: "Tiberias"
  ru: "Тивериада"
  uk: "Тіверіада"
  es: "Tiberias"
  pt: "Tiberíades"
  de: "Tiberias"
  fr: "Tibériade"
  pl: "Tyberiada"
  it: "Tiberiade"
  nl: "Tiberias"
