# Overview article (ADR 0007). Mainstream facts only; the founding is given as about AD 20, as usual.
id: tiberias
place: ac9adc9
title:
  en: "Tiberias"
  ru: "Тивериада"
  uk: "Тіверіада"
  es: "Tiberias"
  pt: "Tiberíades"
  de: "Tiberias"
  fr: "Tibériade"
body:
  en:
    - "Tiberias lies on the western shore of the Sea of Galilee, below steep hills, with hot springs at Hammath just to the south. Herod Antipas, tetrarch of Galilee, founded it about AD 20 and named it after the emperor Tiberius. Josephus says the site was cleared of tombs, so that observant Jews held it unclean; Antipas settled it with Galileans, newcomers, poor people and freed slaves, compelling some to come and giving others houses and land. Tiberias replaced Sepphoris as the leading city of Galilee."
    - "In the New Testament the city appears only in John: boats from Tiberias came near the place where the multitude had eaten bread, and John calls the lake the sea of Tiberias. The Gospels do not say that Jesus ever entered it."
    - "Nero gave Tiberias to King Agrippa II. When the revolt broke out in AD 66, a party led by Jesus son of Sapphias burned Antipas' palace, which was adorned with figures of living creatures. Josephus walled the city, but in 67 its elders went out to Vespasian, the gates were opened, and the Romans broke down part of the south wall to march in. After the war Tiberias became a centre of Jewish learning. The Talmud names it as the last seat of the Sanhedrin, and the Jerusalem Talmud took shape largely in its schools by about AD 400."
    - "At Hammath, excavations by Moshe Dothan in 1961–1963 uncovered a synagogue whose mosaic floor, usually dated to the fourth century, shows the zodiac around the sun god Helios, beside a Torah shrine and menorahs. Epiphanius tells of Joseph of Tiberias, a Jew of the city who became a Christian and received leave from Constantine to build churches in Jewish towns, and who tried to turn an unfinished temple of Hadrian in Tiberias into a church. Excavations led by Yizhar Hirschfeld from 1989 have uncovered parts of the Roman and Byzantine city."
  ru:
    - "Тивериада лежит на западном берегу моря Галилейского, под крутыми холмами; сразу к югу от неё — горячие источники Хаммата. Ирод Антипа, четвертовластник Галилеи, основал её около 20 г. н. э. и назвал в честь императора Тиверия. Иосиф Флавий пишет, что для города пришлось убрать гробницы, и потому благочестивые иудеи считали его нечистым; Антипа заселил его галилеянами, пришельцами, бедняками и вольноотпущенниками, одних принуждая переселиться, другим давая дома и землю. Тивериада сменила Сепфорис как главный город Галилеи."
    - "В Новом Завете город упоминается только у Иоанна: из Тивериады пришли лодки близко к тому месту, где народ ел хлеб, и Иоанн называет озеро морем Тивериадским. Евангелия не говорят, что Иисус когда-либо входил в него."
    - "Нерон отдал Тивериаду царю Агриппе II. Когда в 66 г. н. э. вспыхнуло восстание, сторонники Иисуса, сына Сапфии, сожгли дворец Антипы, украшенный изображениями живых существ. Иосиф Флавий обнёс город стеной, но в 67 г. его старейшины вышли к Веспасиану, ворота открыли, и римляне разрушили часть южной стены, чтобы войти. После войны Тивериада стала средоточием иудейской учёности. Талмуд называет её последним местопребыванием синедриона, а Иерусалимский Талмуд сложился в основном в её школах к 400 г. н. э."
    - "В Хаммате раскопки Моше Дотана в 1961–1963 гг. открыли синагогу, мозаичный пол которой, обычно датируемый IV веком, изображает зодиак вокруг бога солнца Гелиоса, рядом с ковчегом Торы и семисвечниками. Епифаний рассказывает об Иосифе Тивериадском, иудее этого города, который стал христианином, получил от Константина позволение строить церкви в иудейских городах и пытался обратить в церковь недостроенный храм Адриана в Тивериаде. Раскопки под руководством Ицхара Хиршфельда с 1989 г. открыли части римского и византийского города."
  uk:
    - "Тіверіада лежить на західному березі Галілейського моря, під крутими пагорбами, з гарячими джерелами в Хаматі трохи на південь. Ірод Антипа, тетрарх Галілеї, заснував її близько 20 року н. е. і назвав на честь імператора Тиверія. Йосиф Флавій каже, що місце було очищене від гробниць, тож благочестиві юдеї вважали його нечистим; Антипа заселив його галілеянами, прибульцями, бідняками й відпущениками, одних примушуючи прийти, а іншим даючи будинки й землю. Тіверіада замінила Сепфоріс як головне місто Галілеї."
    - "У Новому Заповіті місто з’являється лише в Івана: човни з Тіверіади підпливли до місця, де народ їв хліб, а Іван називає озеро морем Тіверіадським. Євангелія не кажуть, що Ісус коли-небудь входив у нього."
    - "Нерон віддав Тіверіаду цареві Агриппі II. Коли в 66 році н. е. спалахнуло повстання, гурт на чолі з Ісусом, сином Сапфії, спалив палац Антипи, оздоблений зображеннями живих істот. Йосиф Флавій обніс місто муром, але 67 року його старійшини вийшли до Веспасіана, ворота відчинили, і римляни зруйнували частину південної стіни, щоб увійти. Після війни Тіверіада стала осередком юдейської науки. Талмуд називає її останнім місцем Синедріону, а Єрусалимський Талмуд склався значною мірою в її школах приблизно до 400 року н. е."
    - "У Хаматі розкопки Моше Дотана 1961–1963 років виявили синагогу з мозаїчною підлогою, яку зазвичай датують IV століттям, із зодіаком навколо бога сонця Геліоса поруч із кивотом Тори й менорами. Єпіфаній розповідає про Йосипа з Тіверіади, юдея цього міста, що став християнином і дістав від Костянтина дозвіл будувати церкви в юдейських містах і який намагався перетворити недобудований храм Адріана в Тіверіаді на церкву. Розкопки під керівництвом Іцхара Гіршфельда з 1989 року відкрили частини римського й візантійського міста."
  es:
    - "Tiberias se encuentra en la orilla occidental del Mar de Galilea, al pie de empinadas colinas, con aguas termales en Hamat, justo al sur. Herodes Antipas, tetrarca de Galilea, la fundó hacia el 20 d. C. y le dio el nombre del emperador Tiberio. Josefo dice que el lugar fue despejado de tumbas, de modo que los judíos observantes lo tenían por impuro; Antipas lo pobló con galileos, recién llegados, pobres y esclavos liberados, obligando a algunos a venir y dando a otros casas y tierras. Tiberias sustituyó a Séforis como la principal ciudad de Galilea."
    - "En el Nuevo Testamento la ciudad aparece solo en Juan: unas barcas de Tiberias llegaron cerca del lugar donde la multitud había comido pan, y Juan llama al lago mar de Tiberias. Los Evangelios no dicen que Jesús entrara nunca en ella."
    - "Nerón dio Tiberias al rey Agripa II. Cuando estalló la revuelta en el 66 d. C., un grupo dirigido por Jesús hijo de Safías incendió el palacio de Antipas, adornado con figuras de seres vivos. Josefo amuralló la ciudad, pero en 67 sus ancianos salieron al encuentro de Vespasiano, se abrieron las puertas y los romanos derribaron parte de la muralla sur para entrar. Después de la guerra, Tiberias se convirtió en un centro del saber judío. El Talmud la nombra como la última sede del Sanedrín, y el Talmud de Jerusalén tomó forma en gran parte en sus escuelas hacia el 400 d. C."
    - "En Hamat, las excavaciones de Moshe Dothan en 1961–1963 sacaron a la luz una sinagoga cuyo suelo de mosaico, fechado habitualmente en el siglo IV, muestra el zodiaco en torno al dios solar Helios, junto a un arca de la Torá y menorás. Epifanio cuenta de José de Tiberias, un judío de la ciudad que se hizo cristiano y recibió licencia de Constantino para construir iglesias en ciudades judías, y que intentó convertir en iglesia un templo inacabado de Adriano en Tiberias. Las excavaciones dirigidas por Yizhar Hirschfeld desde 1989 han sacado a la luz partes de la ciudad romana y bizantina."
  pt:
    - "Tiberíades fica na margem ocidental do Mar da Galileia, abaixo de colinas íngremes, com fontes termais em Hamate, logo ao sul. Herodes Antipas, tetrarca da Galileia, a fundou por volta de 20 d.C. e lhe deu o nome do imperador Tibério. Josefo diz que o terreno foi limpo de sepulcros, de modo que os judeus observantes o consideravam impuro; Antipas a povoou com galileus, recém-chegados, pobres e escravos libertos, forçando alguns a vir e dando a outros casas e terras. Tiberíades substituiu Séforis como principal cidade da Galileia."
    - "No Novo Testamento a cidade aparece só em João: barcos de Tiberíades chegaram perto do lugar onde a multidão comera pão, e João chama o lago de mar de Tiberíades. Os Evangelhos não dizem que Jesus alguma vez entrou nela."
    - "Nero deu Tiberíades ao rei Agripa II. Quando a revolta estourou em 66 d.C., um partido liderado por Jesus, filho de Safias, queimou o palácio de Antipas, adornado com figuras de seres vivos. Josefo murou a cidade, mas em 67 seus anciãos foram ao encontro de Vespasiano, as portas foram abertas, e os romanos derrubaram parte da muralha sul para entrar. Depois da guerra, Tiberíades tornou-se centro do saber judaico. O Talmude a nomeia como a última sede do Sinédrio, e o Talmude de Jerusalém tomou forma em grande parte em suas escolas por volta de 400 d.C."
    - "Em Hamate, escavações de Moshe Dothan em 1961–1963 revelaram uma sinagoga cujo piso de mosaico, geralmente datado do século IV, mostra o zodíaco em torno do deus-sol Hélio, ao lado de um nicho da Torá e de menorás. Epifânio conta de José de Tiberíades, judeu da cidade que se tornou cristão e recebeu licença de Constantino para construir igrejas em cidades judaicas, e que tentou transformar em igreja um templo inacabado de Adriano em Tiberíades. Escavações dirigidas por Yizhar Hirschfeld desde 1989 revelaram partes da cidade romana e bizantina."
  de:
    - "Tiberias liegt am Westufer des Sees Genezareth unter steilen Hügeln, mit heißen Quellen bei Hammat unmittelbar südlich. Herodes Antipas, Tetrarch von Galiläa, gründete es um 20 n. Chr. und benannte es nach Kaiser Tiberius. Josephus sagt, der Platz sei von Gräbern geräumt worden, sodass fromme Juden ihn für unrein hielten; Antipas besiedelte ihn mit Galiläern, Zugezogenen, Armen und Freigelassenen, zwang manche zum Kommen und gab anderen Häuser und Land. Tiberias löste Sepphoris als führende Stadt Galiläas ab."
    - "Im Neuen Testament erscheint die Stadt nur bei Johannes: Boote aus Tiberias kamen nahe an den Ort, wo die Menge Brot gegessen hatte, und Johannes nennt den See das Meer von Tiberias. Die Evangelien sagen nicht, dass Jesus sie je betrat."
    - "Nero schenkte Tiberias König Agrippa II. Als 66 n. Chr. der Aufstand ausbrach, verbrannte eine Gruppe unter Jesus, dem Sohn des Sapphias, den Palast des Antipas, der mit Bildern lebender Wesen geschmückt war. Josephus ummauerte die Stadt, doch 67 gingen ihre Ältesten zu Vespasian hinaus, die Tore wurden geöffnet, und die Römer rissen einen Teil der Südmauer ein, um einzuziehen. Nach dem Krieg wurde Tiberias ein Zentrum jüdischer Gelehrsamkeit. Der Talmud nennt es den letzten Sitz des Sanhedrins, und der Jerusalemer Talmud entstand bis etwa 400 n. Chr. weitgehend in seinen Schulen."
    - "In Hammat legten Grabungen von Moshe Dotan 1961–1963 eine Synagoge frei, deren Mosaikboden, meist ins vierte Jahrhundert datiert, den Tierkreis um den Sonnengott Helios zeigt, neben einem Toraschrein und Menorot. Epiphanius erzählt von Josef von Tiberias, einem Juden der Stadt, der Christ wurde und von Konstantin die Erlaubnis erhielt, in jüdischen Städten Kirchen zu bauen, und der einen unvollendeten Tempel Hadrians in Tiberias in eine Kirche verwandeln wollte. Grabungen unter Yizhar Hirschfeld seit 1989 haben Teile der römischen und byzantinischen Stadt freigelegt."
  fr:
    - "Tibériade s’étend sur la rive occidentale de la mer de Galilée, au pied de collines escarpées, avec les sources chaudes de Hammath juste au sud. Hérode Antipas, tétrarque de Galilée, la fonda vers 20 apr. J.-C. et la nomma d’après l’empereur Tibère. Selon Josèphe, le site fut débarrassé de ses tombes, si bien que les Juifs observants le tenaient pour impur ; Antipas la peupla de Galiléens, de nouveaux venus, de pauvres et d’esclaves affranchis, contraignant certains à venir et donnant à d’autres maisons et terres. Tibériade remplaça Sepphoris comme principale ville de Galilée."
    - "Dans le Nouveau Testament, la ville n’apparaît que chez Jean : des barques de Tibériade abordèrent près du lieu où la foule avait mangé le pain, et Jean appelle le lac mer de Tibériade. Les Évangiles ne disent pas que Jésus y soit jamais entré."
    - "Néron donna Tibériade au roi Agrippa II. Quand la révolte éclata en 66 apr. J.-C., un parti mené par Jésus fils de Sapphias incendia le palais d’Antipas, orné de figures d’êtres vivants. Josèphe fortifia la ville, mais en 67 ses anciens allèrent trouver Vespasien, les portes s’ouvrirent, et les Romains abattirent une partie du mur sud pour entrer. Après la guerre, Tibériade devint un centre du savoir juif. Le Talmud la nomme dernier siège du Sanhédrin, et le Talmud de Jérusalem prit forme en grande partie dans ses écoles vers 400 apr. J.-C."
    - "À Hammath, les fouilles de Moshe Dothan en 1961-1963 dégagèrent une synagogue dont le pavement de mosaïque, d’ordinaire daté du IVe siècle, montre le zodiaque autour du dieu-soleil Hélios, près d’une niche de la Torah et de ménorot. Épiphane raconte l’histoire de Joseph de Tibériade, un Juif de la ville devenu chrétien, qui obtint de Constantin l’autorisation de bâtir des églises dans les villes juives et tenta de transformer en église un temple inachevé d’Hadrien à Tibériade. Les fouilles dirigées par Yizhar Hirschfeld depuis 1989 ont mis au jour des parties de la ville romaine et byzantine."
