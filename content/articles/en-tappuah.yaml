# Overview article (ADR 0007). Mainstream facts only; a minor place: tied to Tappuah (usually Sheikh Abu Zarad), and the spring itself is unidentified; Ein et-Tuta is given as a proposal.
id: en-tappuah
place: ad6b2b7
title:
  en: "En-tappuah"
  ru: "Ен-Таппуах"
body:
  en:
    - "En-tappuah, “spring of the apple” or “of Tappuah”, is named once, on the border between Manasseh and Ephraim: “the coast of Manasseh was from Asher to Michmethah, that lieth before Shechem; and the border went along on the right hand unto the inhabitants of En-tappuah.” The next verse explains the oddity of the line: “Manasseh had the land of Tappuah: but Tappuah on the border of Manasseh belonged to the children of Ephraim”, and from there the border went down to the brook Kanah. En-tappuah is thus the spring of the town of Tappuah, perhaps the one whose king Joshua had defeated, or the town itself under a fuller name."
    - "Little more can be said. Tappuah is usually placed at Sheikh Abu Zarad, a hill near Yasuf about 13 km south of Shechem, by the Tappuah junction of today's road map; the spring that gave it its name has not been identified, though Ein et-Tuta just to the north-east has been proposed. The map's point therefore stands on Tappuah itself. The area lies in the northern West Bank, between Nablus and Ramallah."
  ru:
    - "Ен-Таппуах, «яблочный источник» или «источник Таппуаха», назван один раз, на границе Манассии и Ефрема: «Предел сынов Манассии идет от Асира к Михмефафу, который против Сихема; отсюда предел идет направо к жителям Ен-Таппуаха». Следующий стих объясняет странность линии: «Земля Таппуах досталась Манассии, а город Таппуах у предела Манассиина — сынам Ефремовым», и оттуда предел спускался к потоку Кане. Ен-Таппуах, таким образом, — источник города Таппуаха, быть может того, чьего царя разбил Иисус Навин, или сам город под более полным именем."
    - "Больше сказать почти нечего. Таппуах обычно помещают на Шейх-Абу-Зараде, холме у селения Ясуф примерно в 13 км к югу от Сихема, у нынешней развязки Таппуах; источник, давший ему имя, не найден, хотя предлагали Айн-эт-Туту чуть к северо-востоку. Поэтому точка на карте стоит на самом Таппуахе. Эта местность лежит на севере Западного берега, между Наблусом и Рамаллой."
scripture:
  - Josh.17.7-Josh.17.9
  - Josh.16.8
  - Josh.12.17
sources:
