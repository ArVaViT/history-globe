body:
  en:
    - "En-tappuah, “spring of the apple” or “of Tappuah”, is named once, on the border between Manasseh and Ephraim: “the coast of Manasseh was from Asher to Michmethah, that lieth before Shechem; and the border went along on the right hand unto the inhabitants of En-tappuah.” The next verse explains the oddity of the line: “Manasseh had the land of Tappuah: but Tappuah on the border of Manasseh belonged to the children of Ephraim”, and from there the border went down to the brook Kanah. En-tappuah is thus the spring of the town of Tappuah, perhaps the one whose king Joshua had defeated, or the town itself under a fuller name."
    - "Little more can be said. Tappuah is usually placed at Sheikh Abu Zarad, a hill near Yasuf about 13 km south of Shechem, by the Tappuah junction of today's road map; the spring that gave it its name has not been identified, though Ein et-Tuta just to the north-east has been proposed. The map's point therefore stands on Tappuah itself. The area lies in the northern West Bank, between Nablus and Ramallah."
  ru:
    - "Ен-Таппуах, «яблочный источник» или «источник Таппуаха», назван один раз, на границе Манассии и Ефрема: «Предел сынов Манассии идет от Асира к Михмефафу, который против Сихема; отсюда предел идет направо к жителям Ен-Таппуаха». Следующий стих объясняет странность линии: «Земля Таппуах досталась Манассии, а город Таппуах у предела Манассиина — сынам Ефремовым», и оттуда предел спускался к потоку Кане. Ен-Таппуах, таким образом, — источник города Таппуаха, быть может того, чьего царя разбил Иисус Навин, или сам город под более полным именем."
    - "Больше сказать почти нечего. Таппуах обычно помещают на Шейх-Абу-Зараде, холме у селения Ясуф примерно в 13 км к югу от Сихема, у нынешней развязки Таппуах; источник, давший ему имя, не найден, хотя предлагали Айн-эт-Туту чуть к северо-востоку. Поэтому точка на карте стоит на самом Таппуахе. Эта местность лежит на севере Западного берега, между Наблусом и Рамаллой."
  uk:
    - "Ен-Таппуах, «джерело яблука» або «Таппуаха», названий один раз, на межі між Манасією та Єфремом: «Ійшла ж гряниця Манассієва від Асира на Михметат, на схід сонця від Сихему; потім тягнулась гряниця праворуч до осадників Ен-Таппуахських». Наступний вірш пояснює дивність лінії: «Земля ж Таппуах дісталась Манассії, а місто Таппуах на самій гряницї Манассїєвій допавсь Ефраїміям», і звідти межа спускалася до потоку Кана. Ен-Таппуах, отже, — джерело міста Таппуах, можливо, того, чийого царя переміг Ісус Навин, або саме місто під повнішою назвою."
    - "Більше сказати майже нічого. Таппуах зазвичай розташовують у Шейх-Абу-Зараді, на пагорбі поблизу Ясуфа приблизно за 13 км на південь від Сихема, біля розв'язки Таппуах сучасної дорожньої мапи; джерело, яке дало йому назву, не ототожнене, хоча пропонували Ейн-ет-Туту просто на північний схід. Тому точка на мапі стоїть на самому Таппуаху. Околиця лежить на півночі Західного берега, між Наблусом і Рамаллою."
  es:
    - "En-tapúa, «fuente de la manzana» o «de Tapúa», se nombra una sola vez, en la frontera entre Manasés y Efraín: «Y fué el término de Manasés desde Aser hasta Michmetat, la cual está delante de Sichêm; y va este término á la mano derecha, á los que habitan en Tappua» (la Reina-Valera lee aquí solo «Tappua», sin «En-»). El versículo siguiente explica lo singular de la línea: «Y la tierra de Tappua fué de Manasés; pero Tappua, que está junto al término de Manasés, es de los hijos de Ephraim», y desde allí la frontera descendía al arroyo de Caná. En-tapúa es, pues, la fuente de la ciudad de Tapúa, quizá aquella cuyo rey Josué había derrotado, o la propia ciudad con un nombre más completo."
    - "Poco más puede decirse. Tapúa suele situarse en Sheikh Abu Zarad, una colina cerca de Yasuf, a unos 13 km al sur de Siquem, junto al cruce de Tapúa del mapa de carreteras actual; la fuente que le dio nombre no ha sido identificada, aunque se ha propuesto Ein et-Tuta, justo al nordeste. El punto del mapa se asienta, por tanto, en la propia Tapúa. La zona se halla en el norte de Cisjordania, entre Nablus y Ramala."
  pt:
    - "En-Tapua, “fonte da maçã” ou “de Tapua”, é nomeada uma só vez, na fronteira entre Manassés e Efraim: “A fronteira de Manassés ia de Aser até Micmetate, que está diante de Siquém. A fronteira seguia para a direita, até os habitantes de En-Tapua.” O versículo seguinte explica a singularidade do traçado: “A terra de Tapua pertencia a Manassés; mas Tapua, na fronteira de Manassés, pertencia aos filhos de Efraim”, e dali a fronteira descia ao ribeiro de Caná. En-Tapua é, assim, a fonte da cidade de Tapua, talvez aquela cujo rei Josué derrotara, ou a própria cidade sob um nome mais completo."
    - "Pouco mais se pode dizer. Tapua é geralmente situada em Sheikh Abu Zarad, uma colina perto de Yasuf, a cerca de 13 km ao sul de Siquém, junto ao entroncamento de Tapua do mapa rodoviário atual; a fonte que lhe deu o nome não foi identificada, embora Ein et-Tuta, logo a nordeste, tenha sido proposta. O ponto do mapa fica, portanto, na própria Tapua. A área fica no norte da Cisjordânia, entre Nablus e Ramallah."
  de:
    - "En-Tappuach, „Quelle des Apfels“ oder „des Tappuach“, wird einmal genannt, an der Grenze zwischen Manasse und Ephraim: „Und die Grenze Manasses war von Asser gen Michmethath, das vor Sichem liegt, und reicht zur Rechten an die von En-Thappuah.“ Der nächste Vers erklärt die Eigenheit der Linie: „denn das Land Thappuah ward dem Manasse; aber Thappuah an der Grenze Manasses ward den Kindern Ephraim“, und von dort stieg die Grenze zum Bach Kana hinab. En-Tappuach ist also die Quelle der Stadt Tappuach, vielleicht derjenigen, deren König Josua besiegt hatte, oder die Stadt selbst unter einem volleren Namen."
    - "Mehr lässt sich kaum sagen. Tappuach wird gewöhnlich bei Scheich Abu Zarad angesetzt, einem Hügel nahe Yasuf etwa 13 km südlich von Sichem, an der Tappuach-Kreuzung der heutigen Straßenkarte; die Quelle, die ihm den Namen gab, ist nicht identifiziert, obwohl Ein et-Tuta unmittelbar nordöstlich davon vorgeschlagen wurde. Der Punkt der Karte steht daher auf Tappuach selbst. Das Gebiet liegt im nördlichen Westjordanland, zwischen Nablus und Ramallah."
  fr:
    - "En-Tappuach, « source de la pomme » ou « de Tappuach », n’est nommée qu’une fois, sur la frontière entre Manassé et Éphraïm : « La limite de Manassé s’étendait d’Aser à Micmethath, qui est près de Sichem, et allait à Jamin vers les habitants d’En-Tappuach. » Le verset suivant explique l’étrangeté de la ligne : « Le pays de Tappuach était aux fils de Manassé, mais Tappuach sur la frontière de Manassé était aux fils d’Éphraïm », et de là la frontière descendait vers le torrent de Kana. En-Tappuach est donc la source de la ville de Tappuach, peut-être celle dont Josué avait vaincu le roi, ou la ville elle-même sous un nom plus complet."
    - "On ne peut guère en dire plus. Tappuach est généralement placée à Sheikh Abu Zarad, colline près de Yasuf à environ 13 km au sud de Sichem, au carrefour de Tappuach de la carte routière actuelle ; la source qui lui donna son nom n’a pas été identifiée, bien que Ein et-Tuta, juste au nord-est, ait été proposée. Le point de la carte se tient donc sur Tappuach elle-même. La région se trouve dans le nord de la Cisjordanie, entre Naplouse et Ramallah."
  it:
    - "En-Tappuach, «sorgente della mela» o «di Tappuach», è nominata una sola volta, sul confine fra Manasse ed Efraim: «Il confine di Manasse si estendeva da Ascer a Micmetath ch’è dirimpetto a Sichem, e andava a man destra verso gli abitanti di En-Tappuah.» Il versetto seguente spiega la stranezza della linea: «Il paese di Tappuah appartenne a Manasse; ma Tappuah sul confine di Manasse appartenne ai figliuoli di Efraim», e da lì il confine scendeva al torrente di Cana. En-Tappuach è dunque la sorgente della città di Tappuach, forse quella il cui re Giosuè aveva sconfitto, o la città stessa con un nome più completo."
    - "Non si può dire molto di più. Tappuach si colloca di solito a Sheikh Abu Zarad, una collina presso Yasuf a circa 13 km a sud di Sichem, presso lo svincolo di Tappuach dell’odierna carta stradale; la sorgente che le diede il nome non è stata identificata, benché sia stata proposta Ein et-Tuta, poco a nord-est. Il punto sulla mappa sta dunque su Tappuach stessa. L’area si trova nella Cisgiordania settentrionale, fra Nablus e Ramallah."
  pl:
    - "En-Tappuach, „źródło jabłka” lub „Tappuach”, jest wymienione raz, na granicy między Manassesem a Efraimem: „I była granica Manasesowa od Aser do Machmatat, które jest przeciwko Sychem, a idzie granica ta po prawej stronie do mieszkających w En Tafua.” Następny werset wyjaśnia osobliwość tej linii: „Manasesowa była ziemia Tafua; ale Tafua przy granicy Manasesowej była synów Efraimowych”, a stamtąd granica schodziła do potoku Kana. En-Tappuach jest więc źródłem miasta Tappuach, być może tego, którego króla pokonał Jozue, albo samym miastem pod pełniejszą nazwą."
    - "Niewiele więcej można powiedzieć. Tappuach umieszcza się zwykle w Szejch Abu Zarad, na wzgórzu koło Jasuf, około 13 km na południe od Sychem, przy skrzyżowaniu Tappuach dzisiejszej mapy drogowej; źródło, które dało mu nazwę, nie zostało zidentyfikowane, choć proponowano Ejn et-Tuta tuż na północny wschód. Punkt na mapie stoi więc na samym Tappuach. Okolica leży w północnej części Zachodniego Brzegu, między Nablusem a Ramallah."
  nl:
    - "En-Tappuach, “bron van de appel” of “van Tappuach”, wordt eenmaal genoemd, op de grens tussen Manasse en Efraïm: “de landpale van Manasse was van Aser af tot Michmetath, die voor aan Sichem is; en deze landpale gaat ter rechterhand tot aan de inwoners van En-Tappuah.” Het volgende vers verklaart het zonderlinge van de lijn: “Manasse had wel het land van Tappuah, maar Tappuah zelve, aan de landpale van Manasse, hadden de kinderen van Efraim”, en vandaar daalde de grens naar de beek Kana. En-Tappuach is dus de bron van de stad Tappuach, misschien die wier koning Jozua had verslagen, of de stad zelf onder een vollere naam."
    - "Veel meer is er niet te zeggen. Tappuach wordt gewoonlijk geplaatst bij Sheikh Abu Zarad, een heuvel bij Yasuf zo'n 13 km ten zuiden van Sichem, bij het Tappuach-kruispunt van de huidige wegenkaart; de bron die haar de naam gaf is niet geïdentificeerd, al is Ein et-Tuta even ten noordoosten voorgesteld. Het punt op de kaart staat daarom op Tappuach zelf. De streek ligt in het noorden van de Westelijke Jordaanoever, tussen Nablus en Ramallah."
  cs:
    - "Én-tapúach, „pramen jablka“ neboli „Tapúachu“, je jmenován jednou, na hranici mezi Manasesem a Efrajimem: „A byla meze Manassesova od Asser, Michmetat, jenž jest před Sichem, a táhne se na pravou stranu k obyvatelům Entafue.“ Následující verš vysvětluje zvláštnost té čáry: „Manassesova zajisté byla země Tafue, ale Tafue podlé pomezí Manassesova jest synů Efraimových“ a odtud šla hranice dolů k potoku Kána. Én-tapúach je tedy pramen města Tapúach, snad toho, jehož krále Jozue porazil, nebo samo město pod plnějším jménem."
    - "Víc říci nelze. Tapúach se obvykle klade do Sheikh Abu Zarad, pahorku u Yasufu asi 13 km jižně od Šekemu, u křižovatky Tappuah dnešní silniční mapy; pramen, který mu dal jméno, nebyl určen, ač byl navržen Ein et-Tuta hned na severovýchodě. Bod mapy tedy stojí na samém Tapúachu. Oblast leží v severní části Západního břehu, mezi Nábulusem a Ramalláhem."
  sv:
    - "En-Tappuach, ”äppelkällan” eller ”Tappuachs källa”, nämns en gång, vid gränsen mellan Manasse och Efraim: ”Och Manasse fick sin gräns bestämd sålunda: Den gick från Aser till Mikmetat, som ligger gent emot Sikem; därefter gick gränsen åt höger, till En-Tappuas inbyggare.” Nästa vers förklarar linjens egendomlighet: ”Tappuas land tillföll nämligen Manasse, men själva Tappua, inemot Manasse gräns, tillföll Efraims barn”, och därifrån gick gränsen ner till Kanabäcken. En-Tappuach är alltså källan till staden Tappuach, kanske den vars kung Josua hade besegrat, eller själva staden under ett fylligare namn."
    - "Mycket mer kan inte sägas. Tappuach placeras vanligen vid Sheikh Abu Zarad, en kulle nära Yasuf omkring 13 km söder om Shekem, vid Tappuach-korsningen på dagens vägkarta; källan som gav det dess namn har inte identifierats, fastän Ein et-Tuta strax nordost därom har föreslagits. Kartans punkt står därför på själva Tappuach. Trakten ligger i norra Västbanken, mellan Nablus och Ramallah."
  nb:
    - "En-Tappuah, «eplets kilde» eller «Tappuahs kilde», er nevnt én gang, på grensen mellom Manasse og Efraim: «Og Manasses grense gikk fra Aser til Mikmetat, som ligger midt imot Sikem; så tok grensen til høire til En-Tappuah-bygden.» Det neste verset forklarer linjens eiendommelighet: «Manasse fikk Tappuah-landet, men Tappuah selv på grensen av Manasse tilfalt Efra'ims barn», og derfra gikk grensen ned til Kana-bekken. En-Tappuah er altså kilden til byen Tappuah, kanskje den hvis konge Josva hadde beseiret, eller selve byen under et fyldigere navn."
    - "Mer kan ikke sies. Tappuah plasseres vanligvis ved Sheikh Abu Zarad, en høyde nær Yasuf omtrent 13 km sør for Sikem, ved Tappuah-krysset på dagens veikart; kilden som gav den navn, er ikke identifisert, selv om Ein et-Tuta like nordøst for den er foreslått. Kartets punkt står derfor på selve Tappuah. Området ligger på nordlige Vestbredden, mellom Nablus og Ramallah."
  tl:
    - "Ang En-tappua, “bukal ng mansanas” o “ng Tappua”, ay binabanggit nang minsan, sa hangganan ng Manases at Ephraim: “ang hangganan ng Manases ay mula sa Aser hanggang sa Michmetat, na nasa tapat ng Sichem; at ang hangganan ay patuloy sa kanan, hanggang sa mga taga En-tappua.” Ipinaliliwanag ng sumusunod na talata ang kakaiba ng guhit: “Ang lupain ng Tappua ay ukol sa Manases: nguni't ang Tappua sa hangganan ng Manases ay ukol sa mga anak ni Ephraim”, at mula roon ay bumaba ang hangganan sa batis ng Cana. Kaya ang En-tappua ang bukal ng bayan ng Tappua, marahil ang bayang tinalo ni Josue ang hari, o ang bayan mismo sa mas buong pangalan."
    - "Wala nang higit na masasabi. Karaniwang inilalagay ang Tappua sa Sheikh Abu Zarad, isang burol malapit sa Yasuf mga 13 km sa timog ng Sichem, sa sangandaan ng Tappuah ng mapa ng daan ngayon; hindi natukoy ang bukal na nagbigay ng pangalan nito, bagaman iminungkahi ang Ein et-Tuta sa hilagang-silangan lamang. Kaya nakatayo ang punto ng mapa sa Tappua mismo. Ang lugar ay nasa hilagang West Bank, sa pagitan ng Nablus at Ramallah."
  da:
    - "En-Tappua, »æblets kilde« eller »Tappuas kilde«, nævnes én gang, på grænsen mellem Manasse og Efraim: »Manasse Landemærke var fra Aser til Mikmethath, som ligger lige for Sikem; og Landemærket gaar ud paa den højre Side til Indbyggerne i En-Thappua.« Det næste vers forklarer linjens mærkværdighed: »Thappua Land hørte Manasse til; men Thappua ved Manasse Landemærke hørte Efraims Børn til«, og derfra gik grænsen ned til bækken Kana. En-Tappua er således kilden hørende til byen Tappua, måske den, hvis konge Josva havde besejret, eller selve byen under et fyldigere navn."
    - "Mere kan næsten ikke siges. Tappua placeres sædvanligvis ved Sheikh Abu Zarad, en bakke nær Yasuf cirka 13 km syd for Sikem, ved Tappuah-krydset på nutidens vejkort; den kilde, der gav den dens navn, er ikke identificeret, selv om Ein et-Tuta lige mod nordøst er blevet foreslået. Kortets punkt står derfor på selve Tappua. Området ligger i den nordlige del af Vestbredden, mellem Nablus og Ramallah."
  sr:
    - "Ен-Тафуја, „извор јабуке“ или „Тафује“, помиње се једном, на граници између Манасије и Јефрема: „А међа Манасијина беше од Асира к Михмети, која је према Сихему, потом иде та међа надесно к становницима ен-тафујским“. Следећи стих објашњава необичност линије: „А Манасијина је земља тафујска, али Тафуја на међи Манасијиној припада синовима Јефремовим“, а одатле је међа силазила на поток Кану. Ен-Тафуја је тако извор града Тафује, можда оног чијег је цара Исус Навин победио, или сам град под пунијим именом."
    - "Више се мало шта може рећи. Тафуја се обично смешта у Шеик Абу Зарад, брдо код Јасуфа око 13 км јужно од Сихема, на раскршћу Тафуја данашње путне карте; извор који јој је дао име није утврђен, мада је предложен Ејн ет Тута одмах североисточно. Тачка на карти зато стоји на самој Тафуји. Област лежи у северном делу Западне обале, између Наблуса и Рамале."
  hu:
    - "Én-Tappúah, „az alma forrása” vagy „Tappúah forrása”, egyszer van megnevezve, Manassé és Efraim határán: „A Manassé határa pedig Ásertől Mikmetháth felé vala, a mely Sikem előtt van. És méne a határ jobbkéz felé, Én-Tappuahnak lakói felé.” A következő vers megmagyarázza a vonal furcsaságát: „Manasséé volt Tappuah földe, de Tappuah a Manassé határa felé az Efraim fiaié vala”, onnan pedig a határ a Kána patakjáig ment le. Én-Tappúah tehát Tappúah városának forrása, talán azé, amelynek királyát Józsué legyőzte, vagy maga a város hosszabb néven."
    - "Többet nemigen lehet mondani. Tappúahot rendszerint Sheikh Abu Zaradnál keresik, a Yasuf közelében fekvő dombon, Sikemtől mintegy 13 km-re délre, a mai úttérkép Tappúah-csomópontjánál; a nevet adó forrást nem azonosították, bár a tőle északkeletre fekvő Ein et-Tutát javasolták. A térkép pontja ezért magán Tappúahon áll. A terület Ciszjordánia északi részén fekszik, Nablusz és Ramallah között."
  fi:
    - "En-Tappua, ”omenan lähde” tai ”Tappuan lähde”, mainitaan kerran, Manassen ja Efraimin rajalla: ”Manassen raja kulkee Asserista Mikmetatiin, joka on Sikemin itäpuolella; sitten raja menee oikealle Een-Tappuahin asukkaiden tienoille.” Seuraava jae selittää rajan omituisuuden: ”Tappuahin maa joutui Manasselle, mutta Tappuah, Manassen rajalla, efraimilaisille”, ja sieltä raja laskeutui Kanan puroon. En-Tappua on siten Tappuan kaupungin lähde, ehkä sen, jonka kuninkaan Joosua oli voittanut, tai itse kaupunki täydellisemmällä nimellä."
    - "Enempää ei voida sanoa. Tappua sijoitetaan yleensä Sheikh Abu Zaradiin, kukkulalle Yasufin lähellä noin 13 km Sikemistä etelään, nykyisen tiekartan Tappuan risteyksen luona; lähdettä, josta se sai nimensä, ei ole tunnistettu, vaikka Ein et-Tutaa aivan koillispuolella on ehdotettu. Kartan piste seisoo siis itse Tappuan kohdalla. Alue sijaitsee Länsirannan pohjoisosassa Nablusin ja Ramallahin välissä."
  vi:
    - "Ên-Tháp-bu-ách, “suối của quả táo” hoặc “của Tháp-bu-ách”, được nêu tên một lần, trên ranh giới giữa Ma-na-se và Ép-ra-im: “Giới hạn của Ma-na-se từ A-se đến Mít-mê-thát đối ngang Si-chem, rồi chạy đến Gia-min về lối dân Ên-Tháp-bu-ách.” Câu kế tiếp giải thích chỗ lạ của đường ranh: “Xứ Tháp-bu-ách thuộc về Ma-na-se; nhưng thành Tháp-bu-ách gần bờ cõi Ma-na-se, thì thuộc về người Ép-ra-im”, và từ đó ranh giới đi xuống khe Ca-na. Như vậy Ên-Tháp-bu-ách là suối của thành Tháp-bu-ách, có lẽ là thành mà Giô-suê đã đánh bại vua của nó, hoặc chính thành dưới một tên đầy đủ hơn."
    - "Không thể nói thêm nhiều. Tháp-bu-ách thường được đặt tại Sheikh Abu Zarad, một ngọn đồi gần Yasuf cách Si-chem khoảng 13 km về phía nam, cạnh ngã ba Tappuah trên bản đồ đường hiện nay; suối đã đặt tên cho nó chưa được xác định, dù Ein et-Tuta ngay phía đông bắc đã được đề nghị. Vì vậy điểm trên bản đồ đặt tại chính Tháp-bu-ách. Vùng này nằm ở bắc Bờ Tây, giữa Nablus và Ramallah."
  ro:
    - "En-Tapuah, „izvorul mărului” sau „al Tapuahului”, este numit o singură dată, la hotarul dintre Manase și Efraim: „au fost hotarele fiilor lui Manasì dela Asir Matot Dilanat, care este înaintea feții fiilor lui Sihem, și merg spre hotarele lui Iamin și Iasiv, la fântâna lui Taftot”. Versetul următor lămurește ciudățenia liniei: „lui Manasì s’a fost venit pământul Tapfu, care este la hotarele lui Manasì a fiilor lui Efraim”, iar de acolo hotarul cobora la pârâul Cana. En-Tapuah este deci izvorul cetății Tapuah, poate a celei al cărei rege fusese învins de Iosua, sau chiar cetatea sub un nume mai întreg."
    - "Nu se poate spune mult mai mult. Tapuah este așezată de obicei la Sheikh Abu Zarad, un deal lângă Yasuf, la circa 13 km sud de Sihem, la răscrucea Tappuah de pe harta de azi a drumurilor; izvorul care i-a dat numele nu a fost identificat, deși a fost propus Ein et-Tuta, chiar la nord-est. Punctul de pe hartă stă deci pe Tapuah însăși. Zona se află în nordul Cisiordaniei, între Nablus și Ramallah."
  bg:
    - "Ен-Тапуах, „изворът на ябълката“ или „на Тапуах“, е назован веднъж, на границата между Манасия и Ефрем: „И пределът на Манасия беше от Асир до Михметат, който е срещу Сихем; и простираше се пределът надясно до жителите на Ентапфуя.“ Следващият стих обяснява странността на линията: „Манасия имаше земята Тапфуя; а Тапфуя над Манасиевия предел принадлежеше на Ефремовите синове“, и оттам границата слизала до потока Кана. Ен-Тапуах е, следователно, изворът на град Тапуах, може би онзи, чийто цар Иисус Навин разбил, или самият град под по-пълно име."
    - "Малко повече може да се каже. Тапуах обикновено се поставя в Шейх Абу Зарад, хълм близо до Ясуф на около 13 км южно от Сихем, при разклона Тапуах на днешната пътна карта; изворът, който му дал името, не е отъждествен, макар че е предлаган Аин ет-Тута точно на североизток. Затова точката на картата стои на самия Тапуах. Областта лежи в северната част на Западния бряг, между Наблус и Рамала."
