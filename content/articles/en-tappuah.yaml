# Overview article (ADR 0007). Mainstream facts only; a minor place: tied to Tappuah (usually Sheikh Abu Zarad), and the spring itself is unidentified; Ein et-Tuta is given as a proposal.
id: en-tappuah
place: ad6b2b7
title:
  en: "En-tappuah"
  ru: "Ен-Таппуах"
  uk: "Ен-Таппуах"
  es: "En-tapúa"
  pt: "En-Tapua"
  de: "En-Tappuach"
  fr: "En-Tappuach"
body:
  en:
    - "En-tappuah, “spring of the apple” or “of Tappuah”, is named once, on the border between Manasseh and Ephraim: “the coast of Manasseh was from Asher to Michmethah, that lieth before Shechem; and the border went along on the right hand unto the inhabitants of En-tappuah.” The next verse explains the oddity of the line: “Manasseh had the land of Tappuah: but Tappuah on the border of Manasseh belonged to the children of Ephraim”, and from there the border went down to the brook Kanah. En-tappuah is thus the spring of the town of Tappuah, perhaps the one whose king Joshua had defeated, or the town itself under a fuller name."
    - "Little more can be said. Tappuah is usually placed at Sheikh Abu Zarad, a hill near Yasuf about 13 km south of Shechem, by the Tappuah junction of today's road map; the spring that gave it its name has not been identified, though Ein et-Tuta just to the north-east has been proposed. The map's point therefore stands on Tappuah itself. The area lies in the northern West Bank, between Nablus and Ramallah."
  ru:
    - "Ен-Таппуах, «яблочный источник» или «источник Таппуаха», назван один раз, на границе Манассии и Ефрема: «Предел сынов Манассии идет от Асира к Михмефафу, который против Сихема; отсюда предел идет направо к жителям Ен-Таппуаха». Следующий стих объясняет странность линии: «Земля Таппуах досталась Манассии, а город Таппуах у предела Манассиина — сынам Ефремовым», и оттуда предел спускался к потоку Кане. Ен-Таппуах, таким образом, — источник города Таппуаха, быть может того, чьего царя разбил Иисус Навин, или сам город под более полным именем."
    - "Больше сказать почти нечего. Таппуах обычно помещают на Шейх-Абу-Зараде, холме у селения Ясуф примерно в 13 км к югу от Сихема, у нынешней развязки Таппуах; источник, давший ему имя, не найден, хотя предлагали Айн-эт-Туту чуть к северо-востоку. Поэтому точка на карте стоит на самом Таппуахе. Эта местность лежит на севере Западного берега, между Наблусом и Рамаллой."
  uk:
    - "Ен-Таппуах, «джерело яблука» або «Таппуаха», названий один раз, на межі між Манасією та Єфремом: «Ійшла ж гряниця Манассієва від Асира на Михметат, на схід сонця від Сихему; потім тягнулась гряниця праворуч до осадників Ен-Таппуахських». Наступний вірш пояснює дивність лінії: «Земля ж Таппуах дісталась Манассії, а місто Таппуах на самій гряницї Манассїєвій допавсь Ефраїміям», і звідти межа спускалася до потоку Кана. Ен-Таппуах, отже, — джерело міста Таппуах, можливо, того, чийого царя переміг Ісус Навин, або саме місто під повнішою назвою."
    - "Більше сказати майже нічого. Таппуах зазвичай розташовують у Шейх-Абу-Зараді, на пагорбі поблизу Ясуфа приблизно за 13 км на південь від Сихема, біля розв'язки Таппуах сучасної дорожньої мапи; джерело, яке дало йому назву, не ототожнене, хоча пропонували Ейн-ет-Туту просто на північний схід. Тому точка на мапі стоїть на самому Таппуаху. Околиця лежить на півночі Західного берега, між Наблусом і Рамаллою."
  es:
    - "En-tapúa, «fuente de la manzana» o «de Tapúa», se nombra una sola vez, en la frontera entre Manasés y Efraín: «Y fué el término de Manasés desde Aser hasta Michmetat, la cual está delante de Sichêm; y va este término á la mano derecha, á los que habitan en Tappua» (la Reina-Valera lee aquí solo «Tappua», sin «En-»). El versículo siguiente explica lo singular de la línea: «Y la tierra de Tappua fué de Manasés; pero Tappua, que está junto al término de Manasés, es de los hijos de Ephraim», y desde allí la frontera descendía al arroyo de Caná. En-tapúa es, pues, la fuente de la ciudad de Tapúa, quizá aquella cuyo rey Josué había derrotado, o la propia ciudad con un nombre más completo."
    - "Poco más puede decirse. Tapúa suele situarse en Sheikh Abu Zarad, una colina cerca de Yasuf, a unos 13 km al sur de Siquem, junto al cruce de Tapúa del mapa de carreteras actual; la fuente que le dio nombre no ha sido identificada, aunque se ha propuesto Ein et-Tuta, justo al nordeste. El punto del mapa se asienta, por tanto, en la propia Tapúa. La zona se halla en el norte de Cisjordania, entre Nablus y Ramala."
  pt:
    - "En-Tapua, “fonte da maçã” ou “de Tapua”, é nomeada uma só vez, na fronteira entre Manassés e Efraim: “A fronteira de Manassés ia de Aser até Micmetate, que está diante de Siquém. A fronteira seguia para a direita, até os habitantes de En-Tapua.” O versículo seguinte explica a singularidade do traçado: “A terra de Tapua pertencia a Manassés; mas Tapua, na fronteira de Manassés, pertencia aos filhos de Efraim”, e dali a fronteira descia ao ribeiro de Caná. En-Tapua é, assim, a fonte da cidade de Tapua, talvez aquela cujo rei Josué derrotara, ou a própria cidade sob um nome mais completo."
    - "Pouco mais se pode dizer. Tapua é geralmente situada em Sheikh Abu Zarad, uma colina perto de Yasuf, a cerca de 13 km ao sul de Siquém, junto ao entroncamento de Tapua do mapa rodoviário atual; a fonte que lhe deu o nome não foi identificada, embora Ein et-Tuta, logo a nordeste, tenha sido proposta. O ponto do mapa fica, portanto, na própria Tapua. A área fica no norte da Cisjordânia, entre Nablus e Ramallah."
  de:
    - "En-Tappuach, „Quelle des Apfels“ oder „des Tappuach“, wird einmal genannt, an der Grenze zwischen Manasse und Ephraim: „Und die Grenze Manasses war von Asser gen Michmethath, das vor Sichem liegt, und reicht zur Rechten an die von En-Thappuah.“ Der nächste Vers erklärt die Eigenheit der Linie: „denn das Land Thappuah ward dem Manasse; aber Thappuah an der Grenze Manasses ward den Kindern Ephraim“, und von dort stieg die Grenze zum Bach Kana hinab. En-Tappuach ist also die Quelle der Stadt Tappuach, vielleicht derjenigen, deren König Josua besiegt hatte, oder die Stadt selbst unter einem volleren Namen."
    - "Mehr lässt sich kaum sagen. Tappuach wird gewöhnlich bei Scheich Abu Zarad angesetzt, einem Hügel nahe Yasuf etwa 13 km südlich von Sichem, an der Tappuach-Kreuzung der heutigen Straßenkarte; die Quelle, die ihm den Namen gab, ist nicht identifiziert, obwohl Ein et-Tuta unmittelbar nordöstlich davon vorgeschlagen wurde. Der Punkt der Karte steht daher auf Tappuach selbst. Das Gebiet liegt im nördlichen Westjordanland, zwischen Nablus und Ramallah."
  fr:
    - "En-Tappuach, « source de la pomme » ou « de Tappuach », n’est nommée qu’une fois, sur la frontière entre Manassé et Éphraïm : « La limite de Manassé s’étendait d’Aser à Micmethath, qui est près de Sichem, et allait à Jamin vers les habitants d’En-Tappuach. » Le verset suivant explique l’étrangeté de la ligne : « Le pays de Tappuach était aux fils de Manassé, mais Tappuach sur la frontière de Manassé était aux fils d’Éphraïm », et de là la frontière descendait vers le torrent de Kana. En-Tappuach est donc la source de la ville de Tappuach, peut-être celle dont Josué avait vaincu le roi, ou la ville elle-même sous un nom plus complet."
    - "On ne peut guère en dire plus. Tappuach est généralement placée à Sheikh Abu Zarad, colline près de Yasuf à environ 13 km au sud de Sichem, au carrefour de Tappuach de la carte routière actuelle ; la source qui lui donna son nom n’a pas été identifiée, bien que Ein et-Tuta, juste au nord-est, ait été proposée. Le point de la carte se tient donc sur Tappuach elle-même. La région se trouve dans le nord de la Cisjordanie, entre Naplouse et Ramallah."
scripture:
  - Josh.17.7-Josh.17.9
  - Josh.16.8
  - Josh.12.17
sources:
