# Overview article (ADR 0007). Mainstream facts only; a minor place: tied to Tappuah (usually Sheikh Abu Zarad), and the spring itself is unidentified; Ein et-Tuta is given as a proposal.
id: en-tappuah
place: ad6b2b7
