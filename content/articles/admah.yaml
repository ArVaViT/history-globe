body:
  en:
    - "Admah was one of the cities of the plain, named with Sodom, Gomorrah and Zeboiim in the Table of Nations as the limit of the Canaanites' border and in the war of the four kings, when Shinab king of Admah marched out with his neighbours and they “joined battle with them in the vale of Siddim”. The story of the overthrow in Genesis 19 names only Sodom and Gomorrah, but Moses' warning lists all four, “Sodom, and Gomorrah, Admah, and Zeboim, which the LORD overthrew in his anger”, and Hosea makes Admah the measure of God's reluctance to punish: “how shall I make thee as Admah? how shall I set thee as Zeboim? mine heart is turned within me”. The Synodal Bible there reads Adam."
    - "No site is known, and the map shows the rival guesses. The southern theory puts the cities at the south-eastern end of the Dead Sea, where a survey in 1973 added four Early Bronze Age sites, Numeira, Safi, Feifa and Khanazir, to the known town of Bab edh-Dhra; Feifa and Khanazir, the two southernmost, were proposed for Admah and Zeboiim, but excavation showed them to be cemeteries, Feifa's walled enclosure an Iron Age fort built over the graves, rather than towns, and the whole scheme is doubted. The northern theory looks to the plain north of the Dead Sea, around Tall el-Hammam and Tall Nimrin, and a few have thought of Adam, the town by the Jordan where the waters stood when Israel crossed. Josephus and Strabo knew only the burnt land about Sodom, and Eusebius only lists Admah among the five cities destroyed with it."
    - "Nothing else is told of Admah. The south-eastern shore is today the Ghor es-Safi in Jordan, with potash works and the shrinking southern basin of the sea; the northern plain is the farmland of the Jordan Valley opposite Jericho."
  ru:
    - "Адма была одним из городов долины и названа вместе с Содомом, Гоморрой и Севоимом в родословии народов как предел Хананеев и в войне четырёх царей, когда Шинав, царь Адмы, вышел с соседями и они «вступили в сражение с ними в долине Сиддим». Рассказ о гибели в 19-й главе Бытия называет только Содом и Гоморру, но предостережение Моисея перечисляет все четыре — «Содома, Гоморры, Адмы и Севоима, которые ниспроверг Господь во гневе Своем», — а Осия делает Адму мерой нежелания Бога карать: «Поступлю ли с тобою, как с Адамом, сделаю ли тебе, что Севоиму? Повернулось во Мне сердце Мое». Синодальный перевод читает здесь «Адам»."
    - "Место неизвестно, и на карте показаны соперничающие догадки. Южная теория помещает города у юго-восточного конца Мёртвого моря, где обследование 1973 года добавило к уже известному городу Баб-эд-Дра ещё четыре памятника раннего бронзового века — Нумейру, Сафи, Фейфу и Ханазир; Фейфу и Ханазир, два самых южных, предлагали для Адмы и Севоима, но раскопки показали, что это кладбища, а обнесённая стеной ограда в Фейфе — крепость железного века поверх могил, а не города, и вся схема вызывает сомнения. Северная теория смотрит на равнину к северу от Мёртвого моря, вокруг Талль-эль-Хаммама и Талль-Нимрина, а немногие думали об Адаме, городе у Иордана, где остановились воды при переходе Израиля. Иосиф Флавий и Страбон знали только выжженную землю вокруг Содома, а Евсевий лишь называет Адму среди пяти городов, погибших вместе с ним."
    - "Больше об Адме ничего не рассказано. Юго-восточный берег сегодня — Гор-эс-Сафи в Иордании с калийными заводами и усыхающей южной котловиной моря; северная равнина — поля Иорданской долины против Иерихона."
  uk:
    - "Адма була одним із міст рівнини, названим разом із Содомом, Гоморрою та Цевоїмом у Таблиці народів як межа кордону ханаанців і у війні чотирьох царів, коли Шінав, цар Адми, виступив зі своїми сусідами, і вони «постали проти них на Сиддим-долинї». Оповідь про руйнування в Буття 19 називає лише Содом і Гоморру, але застереження Мойсея перелічує всіх чотирьох: «як западня Содома і Гомора, Адама і Зебоїм, що перевернув їх Господь у гнїву свому», а Осія робить Адму мірилом Божої неохоти карати: «Чи зроблю з тобою те, що з Адамою, чи вчиню тобі те саме, що Севоїмові? Обернулось бо в менї серце моє». Синодальний переклад читає там «Адам»."
    - "Місця невідомі, і мапа показує суперечливі здогади. Південна теорія розміщує міста на південно-східному краю Мертвого моря, де розвідка 1973 року додала чотири поселення ранньої бронзової доби — Нумейра, Сафі, Фейфа і Ханазір — до відомого міста Баб-еж-Жра; Фейфу та Ханазір, найпівденніші, пропонували для Адми та Цевоїма, але розкопки показали, що це радше цвинтарі (мурований загон Фейфи — залізнодобовий форт, збудований над могилами), ніж міста, і вся схема викликає сумнів. Північна теорія шукає на рівнині на північ від Мертвого моря, довкола Талль-ель-Хаммама та Талль-Німріна, а деякі думали про Адам, місто біля Йордану, де зупинилися води, коли Ізраїль переходив. Йосиф Флавій і Страбон знали лише спалену землю довкола Содому, а Євсевій лише перелічує Адму серед п'яти міст, знищених разом із ним."
    - "Більше про Адму нічого не відомо. Південно-східний берег нині — Гор-ес-Сафі в Йорданії з поташними заводами та меншаючим південним басейном моря; північна рівнина — це рілля Йорданської долини навпроти Єрихону."
  es:
    - "Adma era una de las ciudades de la llanura, nombrada con Sodoma, Gomorra y Zeboim en la Tabla de las Naciones como límite de la frontera de los cananeos y en la guerra de los cuatro reyes, cuando Sinab, rey de Adma, salió con sus vecinos y «ordenaron contra ellos batalla en el valle de Siddim». El relato de la destrucción en Génesis 19 nombra solo a Sodoma y Gomorra, pero la advertencia de Moisés enumera las cuatro, «de Sodoma y de Gomorra, de Adma y de Seboim, que Jehová subvirtió en su furor», y Oseas hace de Adma la medida de la reticencia de Dios a castigar: «¿cómo podré yo hacerte como Adma, ni ponerte como á Zeboim? Mi corazón se revuelve dentro de mí». La Biblia sinodal lee ahí Adam."
    - "Se ignora el sitio; el mapa muestra las conjeturas rivales. La meridional sitúa las ciudades en el extremo sudeste del mar Muerto, donde una prospección en 1973 añadió cuatro sitios de la Edad del Bronce Antiguo, Numeira, Safi, Feifa y Khanazir, a la ya conocida ciudad de Bab edh-Dhra; Feifa y Khanazir, las más meridionales, fueron propuestas para Adma y Zeboim, pero la excavación mostró que eran cementerios, y el recinto amurallado de Feifa un fuerte de la edad del Hierro sobre las tumbas, no ciudades; todo el esquema se pone en duda. La septentrional mira a la llanura al norte del mar Muerto, en torno a Tall el-Hammam y Tall Nimrin, y unos pocos han pensado en Adam, la ciudad junto al Jordán donde se detuvieron las aguas al cruzar Israel. Josefo y Estrabón conocían solo la tierra quemada en torno a Sodoma, y Eusebio solo enumera Adma entre las cinco ciudades destruidas con ella."
    - "Nada más se cuenta de Adma. La orilla sudoriental es hoy el Ghor es-Safi, en Jordania, con explotaciones de potasa y la cuenca meridional del mar, cada vez más reducida; la llanura septentrional son las tierras de labranza del valle del Jordán frente a Jericó."
  pt:
    - "Admá era uma das cidades da planície, nomeada com Sodoma, Gomorra e Zeboim na Tabela das Nações como limite dos cananeus e na guerra dos quatro reis, quando Sinabe, rei de Admá, saiu com os vizinhos e eles “se colocaram em ordem de batalha contra eles no vale de Sidim”. Gênesis 19 nomeia só Sodoma e Gomorra, mas a advertência de Moisés lista as quatro, “Sodoma, Gomorra, Admá e Zeboim, que o SENHOR destruiu na sua ira”, e Oseias faz de Admá a medida da relutância de Deus em castigar: “Como posso torná-lo como Admá? Como posso torná-lo como Zeboim? Meu coração se revolve dentro de mim”. A Bíblia sinodal russa lê ali Adã."
    - "Não se conhece o sítio, e o mapa mostra as conjeturas rivais. A teoria meridional põe as cidades na extremidade sudeste do mar Morto, onde um levantamento de 1973 acrescentou quatro sítios da Idade do Bronze Antigo, Numeira, Safi, Feifa e Khanazir, à cidade de Bab edh-Dhra; Feifa e Khanazir foram propostos para Admá e Zeboim, mas a escavação mostrou que eram necrópoles, e não cidades, o recinto murado de Feifa sendo um forte da Idade do Ferro construído sobre as sepulturas, e todo o esquema é posto em dúvida. A teoria setentrional olha para a planície ao norte do mar Morto, ao redor de Tall el-Hammam e Tall Nimrin, e alguns pensaram em Adã, a cidade junto ao Jordão onde as águas pararam quando Israel atravessou. Josefo e Estrabão conheciam apenas a terra queimada em torno de Sodoma, e Eusébio apenas lista Admá entre as cinco cidades destruídas com ela."
    - "Nada mais se conta de Admá. A margem sudeste é hoje o Ghor es-Safi, na Jordânia, com minas de potassa e a bacia meridional do mar, cada vez menor; a planície setentrional é a terra agrícola do vale do Jordão defronte de Jericó."
  de:
    - "Adma war eine der Städte der Ebene, in der Völkertafel mit Sodom, Gomorra und Zeboim als Grenzpunkt des Gebiets der Kanaanäer genannt und im Krieg der vier Könige, als Schinab, der König von Adma, mit seinen Nachbarn auszog und sie sich „rüsteten, zu streiten im Tal Siddim“. Die Geschichte von der Zerstörung in 1. Mose 19 nennt nur Sodom und Gomorra, aber die Mahnung des Mose zählt alle vier auf, „Sodom und Gomorra, Adama und Zeboim“, „die der HERR in seinem Zorn und Grimm umgekehrt hat“, und Hosea macht Adma zum Maß der Zurückhaltung Gottes beim Strafen: „Soll ich nicht billig ein Adama aus dir machen und dich wie Zeboim zurichten? Aber mein Herz ist andern Sinnes“. Die Synodalbibel liest dort Adam."
    - "Kein Ort ist bekannt, und die Karte zeigt die konkurrierenden Vermutungen. Die südliche Theorie sucht die Städte am Südostende des Toten Meeres, wo ein Survey 1973 vier Stätten der Frühbronzezeit, Numeira, Safi, Feifa und Chanazir, zur bekannten Stadt Bab edh-Dhra hinzufügte; Feifa und Chanazir, die beiden südlichsten, wurden für Adma und Zeboim vorgeschlagen, doch die Grabung zeigte, dass es Friedhöfe waren, Feifas ummauerte Anlage ein über den Gräbern erbautes eisenzeitliches Fort, keine Städte, das ganze Schema ist zweifelhaft. Die nördliche Theorie blickt auf die Ebene nördlich des Toten Meeres um Tall el-Hammam und Tall Nimrin, und einige dachten an Adam, die Stadt am Jordan, bei der das Wasser stand, als Israel hindurchzog. Josephus und Strabon kannten nur das verbrannte Land um Sodom, und Eusebius führt Adma nur unter den fünf mit ihm zerstörten Städten auf."
    - "Sonst wird von Adma nichts erzählt. Das südöstliche Ufer ist heute der Ghor es-Safi in Jordanien, mit Kaliwerken und dem schrumpfenden Südbecken des Meeres; die nördliche Ebene ist das Ackerland des Jordantals gegenüber von Jericho."
  fr:
    - "Adma était l’une des villes de la plaine, nommée avec Sodome, Gomorrhe et Tseboïm dans la Table des nations comme limite de la frontière cananéenne, et dans la guerre des quatre rois, quand Schineab, roi d’Adma, sortit avec ses voisins et qu’ils « se rangèrent en bataille contre eux, dans la vallée de Siddim ». Le récit de la destruction en Genèse 19 ne nomme que Sodome et Gomorrhe, mais l’avertissement de Moïse énumère les quatre : « Sodome, de Gomorrhe, d’Adma et de Tseboïm, que l’Éternel détruisit dans sa colère », et Osée fait d’Adma la mesure de la répugnance de Dieu à punir : « Te traiterai-je comme Adma ? Te rendrai-je semblable à Tseboïm ? Mon cœur s’agite au-dedans de moi ». La Bible synodale lit ici Adam."
    - "Aucun site n’est connu, et la carte montre les hypothèses rivales. La thèse méridionale place les villes à l’extrémité sud-est de la mer Morte, où une prospection de 1973 a ajouté quatre sites du Bronze ancien, Numeira, Safi, Feifa et Khanazir, à la ville connue de Bab edh-Dhra ; Feifa et Khanazir, les plus méridionaux, furent proposés pour Adma et Tseboïm, mais les fouilles y ont montré des cimetières et non des villes, l’enclos muré de Feifa étant un fort de l’âge du Fer bâti sur des tombes, et tout le schéma est douteux. La thèse du nord regarde la plaine au nord de la mer Morte, autour de Tall el-Hammam et de Tall Nimrin, et d’autres ont songé à Adam, la ville du Jourdain où les eaux s’arrêtèrent au passage d’Israël. Josèphe et Strabon ne connaissaient que la terre brûlée autour de Sodome, et Eusèbe range seulement Adma parmi les cinq villes détruites avec elle."
    - "On ne dit rien d’autre d’Adma. La rive sud-est est aujourd’hui le Ghor es-Safi, en Jordanie, avec ses usines de potasse et le bassin sud, en recul, de la mer ; la plaine du nord est la campagne agricole de la vallée du Jourdain, en face de Jéricho."
  it:
    - "Adma era una delle città della pianura, nominata con Sodoma, Gomorra e Zeboim nella Tavola delle nazioni come limite del confine dei Cananei e nella guerra dei quattro re, quando Sinab re di Adma uscì con i suoi vicini ed essi «si schierarono in battaglia contro quelli, nella valle di Siddim». Il racconto della distruzione in Genesi 19 nomina soltanto Sodoma e Gomorra, ma l’ammonimento di Mosè le elenca tutte e quattro, «di Sodoma, di Gomorra, di Adma e di Tseboim che l’Eterno distrusse nella sua ira», e Osea fa di Adma la misura della riluttanza di Dio a punire: «a renderti simile ad Adma? a ridurti allo stato di Tseboim? Il mio cuore si commuove tutto dentro di me». La Bibbia sinodale qui legge Adam."
    - "Il sito è ignoto, e la carta mostra le ipotesi rivali. La teoria meridionale pone le città all’estremità sud-orientale del Mar Morto, dove un’indagine del 1973 ha aggiunto quattro siti del Bronzo Antico, Numeira, Safi, Feifa e Khanazir, alla città nota di Bab edh-Dhra; Feifa e Khanazir, i più meridionali, furono proposti per Adma e Zeboim, ma lo scavo li ha mostrati necropoli anziché città, con il recinto murato di Feifa un forte dell’età del Ferro costruito sulle tombe, e l’intero schema è dubbio. La teoria settentrionale guarda alla piana a nord del Mar Morto, intorno a Tall el-Hammam e Tall Nimrin, e alcuni hanno pensato ad Adam, la città presso il Giordano dove le acque si fermarono quando Israele lo attraversò. Flavio Giuseppe e Strabone conoscevano solo la terra bruciata intorno a Sodoma, ed Eusebio elenca soltanto Adma fra le cinque città distrutte con essa."
    - "Nient’altro si racconta di Adma. La riva sud-orientale è oggi il Ghor es-Safi in Giordania, con stabilimenti di potassa e il bacino meridionale del mare che si restringe; la piana settentrionale è la terra coltivata della valle del Giordano di fronte a Gerico."
  pl:
    - "Adma była jednym z miast równiny, wymienionym z Sodomą, Gomorą i Seboim w Tablicy Ludów jako kres granicy Kananejczyków oraz w wojnie czterech królów, gdy Szynab, król Admy, wyruszył z sąsiadami i „uszykowali się ku bitwie przeciwko im w dolinie Syddym”. Opowieść o zagładzie w Rdz 19 wymienia tylko Sodomę i Gomorę, lecz ostrzeżenie Mojżesza wylicza wszystkie cztery: „Sodomy i Gomorry, Adamy i Seboim, które podwrócił Pan w gniewie swym”, a Ozeasz czyni z Admy miarę Bożej niechęci do karania: „jakożbym cię podał jako Adamę i położył jako Seboim? Ale się obróciło we mnie serce moje”. Biblia synodalna czyta tam Adam."
    - "Miejsce nie jest znane, a mapa pokazuje rywalizujące przypuszczenia. Teoria południowa umieszcza miasta na południowo-wschodnim krańcu Morza Martwego, gdzie badania z 1973 roku dodały cztery stanowiska z wczesnej epoki brązu, Numeira, Safi, Feifa i Khanazir, do znanego Bab edh-Dhra; Feifę i Khanazir, najdalej na południe, proponowano dla Admy i Seboim, lecz wykopaliska wykazały, że to cmentarzyska, a nie miasta (obwarowanie Feify to fort z epoki żelaza zbudowany nad grobami), i cały schemat budzi wątpliwości. Teoria północna szuka równiny na północ od Morza Martwego, wokół Tall el-Hammam i Tall Nimrin, a niektórzy myśleli o Adamie, mieście nad Jordanem, gdzie stanęły wody, gdy Izrael się przeprawiał. Józef Flawiusz i Strabon znali tylko spaloną ziemię wokół Sodomy, a Euzebiusz tylko wymienia Admę wśród pięciu miast zniszczonych razem z nią."
    - "Nic więcej o Admie nie powiedziano. Wybrzeże południowo-wschodnie to dziś Ghor es-Safi w Jordanii, z zakładami potasu i kurczącą się południową niecką morza; północna równina to pola Doliny Jordanu naprzeciw Jerycha."
  nl:
    - "Adma was een van de steden van de vlakte, genoemd met Sodom, Gomorra en Zeboïm in de Volkerentafel als grens van het gebied der Kanaänieten en in de oorlog van de vier koningen, toen Sinab, de koning van Adma, met zijn buren uittrok en zij “stelden tegen hen slagorden in het dal Siddim”. Het verhaal van de omkering in Genesis 19 noemt alleen Sodom en Gomorra, maar Mozes’ waarschuwing noemt alle vier: “Sodom en Gomorra, Adama en Zeboim, die de HEERE heeft omgekeerd in Zijn toorn”, en Hosea maakt van Adma de maat van Gods tegenzin om te straffen: “Hoe zou Ik u maken als Adama, u stellen als Zeboim? Mijn hart is in Mij omgekeerd”. De Synodale Bijbel leest daar Adam."
    - "Er is geen plaats bekend, en de kaart toont de rivaliserende gissingen. De zuidelijke theorie plaatst ze aan het zuidoostelijke uiteinde van de Dode Zee, waar een verkenning in 1973 aan het bekende Bab edh-Dhra vier plaatsen uit de vroege bronstijd toevoegde, Numeira, Safi, Feifa en Khanazir; Feifa en Khanazir, de twee zuidelijkste, werden voorgesteld voor Adma en Zeboïm, maar opgravingen toonden begraafplaatsen, geen steden, Feifa’s ommuurde terrein een ijzertijdfort over de graven, en het hele schema wordt betwijfeld. De noordelijke theorie zoekt in de vlakte ten noorden van de Dode Zee, rond Tall el-Hammam en Tall Nimrin, en enkelen dachten aan Adam, de stad aan de Jordaan waar het water bleef staan bij Israëls oversteek. Josephus en Strabo kenden alleen het verbrande land rond Sodom, en Eusebius somt Adma slechts op onder de vijf steden die met Sodom vergingen."
    - "Verder wordt er niets van Adma verteld. De zuidoostelijke oever is tegenwoordig de Ghor es-Safi in Jordanië, met potasfabrieken en het krimpende zuidelijke bekken van de zee; de noordelijke vlakte is het akkerland van de Jordaanvallei tegenover Jericho."
  cs:
    - "Adma bylo jedno z měst pláně, jmenované se Sodomou, Gomorou a Cebóím v Tabulce národů jako mez kenaanského území a ve válce čtyř králů, kdy Šinab, král Admy, vytáhl se svými sousedy a ti „sšikovali se proti nim k bitvě v údolí Siddim“. Vyprávění o zkáze v Genesis 19 jmenuje jen Sodomu a Gomoru, ale Mojžíšovo varování vyjmenovává všechna čtyři: „Sodoma a Gomora, Adama a Seboim, kteréž podvrátil Hospodin v hněvě svém“, a Ozeáš činí z Admy měřítko Božího zdráhání trestat: „Kterak bych tě položil jako Adamu, podvrátil jako Seboim? Zkormouceno jest ve mně srdce mé.“ Synodální bible zde čte Adam."
    - "Místo není známo a mapa ukazuje soupeřící dohady. Jižní teorie klade města na jihovýchodní konec Mrtvého moře, kde průzkum v roce 1973 přidal ke známému městu Bab edh-Dhra čtyři lokality z rané doby bronzové, Numeira, Safi, Feifa a Khanazir; Feifa a Khanazir, dvě nejjižnější, byly navrženy pro Admu a Cebóím, ale vykopávky ukázaly, že jde spíše o pohřebiště než o města, přičemž opevněný areál Feify je pevnůstka z doby železné postavená nad hroby, a celé schéma je zpochybňováno. Severní teorie hledí na pláň severně od Mrtvého moře, kolem Tall el-Hammam a Tall Nimrin, a někteří pomýšleli na Adam, město u Jordánu, kde se zastavily vody, když Izrael přecházel. Josephus Flavius a Strabón znali jen spálenou zemi kolem Sodomy a Eusebios Admu pouze uvádí mezi pěti městy zničenými spolu s ní."
    - "O Admě se nevypráví nic dalšího. Jihovýchodní břeh je dnes Ghor es-Safi v Jordánsku se závody na potaš a se zmenšující se jižní pánví moře; severní pláň je zemědělská půda Jordánského údolí naproti Jerichu."
