# Overview article (ADR 0007). Mainstream facts only; Kerak is given as the usual identification with the dissent noted; the Crusader dates follow William of Tyre.
id: kir-hareseth
place: ab55371
title:
  en: "Kir-hareseth"
  ru: "Кирхарешет"
  uk: "Кір-Харешет"
  es: "Kir-hareset"
  pt: "Quir-Haresete"
  de: "Kir-Heres"
  fr: "Kir-Haréseth"
body:
  en:
    - "Kir-hareseth, also Kir-heres and Kir of Moab, was the fortress city of southern Moab, and is all but certainly Kerak in Jordan: a town on a steep spur over 900 m above sea level, cut off by valleys on three sides, some 15 km east of the Dead Sea and south of the Arnon. The Aramaic Targum renders Kir of Moab as Kerakka of Moab, the Madaba mosaic map of the sixth century labels the walled city Charachmoba, and the name lives on in Kerak. A few have questioned the identification: B. C. Jones argued that the Targum evidence does not bear it out and looked for the city north of the Arnon; most still hold to Kerak."
    - "The city appears in the war of Jehoram of Israel, Jehoshaphat and the king of Edom against Mesha, about 850 BC. The allies ravaged Moab until “only in Kir-haraseth left they the stones thereof; howbeit the slingers went about it, and smote it”; the king of Moab tried to break through to the king of Edom, failed, and “took his eldest son that should have reigned in his stead, and offered him for a burnt offering upon the wall”, and the besiegers withdrew. Mesha's own stele, found at Dibon, does not mention the siege. Isaiah's oracle on Moab mourns “the foundations of Kir-hareseth” and says, “my bowels shall sound like an harp for Moab, and mine inward parts for Kir-haresh”, and Jeremiah repeats it: “mine heart shall mourn for the men of Kir-heres”."
    - "Under the Nabataeans and Rome Charachmoba was a city of the province of Arabia and later a bishopric. In 1142 the Crusader Pagan the Butler built the great castle of Kerak, Crac des Moabites, that still crowns the spur; Reynald of Châtillon held it, Saladin besieged it in 1183 and 1184, and it surrendered in 1188. Al-Karak today is the capital of the Karak governorate, with the castle and a museum in it, and the ruins of the Iron Age city, if they survive, lie under the modern town."
  ru:
    - "Кирхарешет, он же Кирхарес и Кир-Моав, был городом-крепостью южного Моава и почти наверняка — Керак в Иордании: город на крутом отроге на высоте более 900 м над уровнем моря, отрезанный долинами с трёх сторон, километрах в пятнадцати к востоку от Мёртвого моря и к югу от Арнона. Арамейский Таргум передаёт Кир-Моав как Керакка Моавитская, мозаичная карта в Мадабе VI века подписывает обнесённый стеной город Харахмова, и имя живёт в названии Керак. Немногие оспаривали отождествление: Б. К. Джонс доказывал, что свидетельство Таргума его не подтверждает, и искал город к северу от Арнона; большинство по-прежнему держится Керака."
    - "Город появляется в войне Иорама Израильского, Иосафата и царя Едомского против Месы около 850 г. до н. э. Союзники опустошали Моав, «так что оставались только каменья в Кир-Харешете. И обступили его пращники и разрушили его»; царь Моавитский попытался пробиться к царю Едомскому, не смог и «взял он сына своего первенца, которому следовало царствовать вместо него, и вознес его во всесожжение на стене», и осаждавшие отступили. Собственная стела Меши, найденная в Дивоне, об осаде не говорит. Пророчество Исаии о Моаве стенает «о твердынях Кирхарешета» и говорит: «внутренность моя стонет о Моаве, как гусли, и сердце мое — о Кирхарешете», а Иеремия повторяет его: «будут воздыхать о мужах Кирхареса»."
    - "При набатеях и Риме Харахмова была городом провинции Аравия, а позже епископией. В 1142 году крестоносец Пайен Виночерпий построил большой замок Керак, Крак Моавитский, который до сих пор венчает отрог; им владел Рено Шатильонский, Саладин осаждал его в 1183 и 1184 годах, и в 1188-м замок сдался. Эль-Карак сегодня — центр провинции Карак, с замком и музеем в нём, а развалины города железного века, если они уцелели, лежат под современным городом."
  uk:
    - "Кір-Харешет, також Кір-Херес і Кір Моавський, був містом-фортецею південного Моаву і майже напевно є Кераком в Йорданії: місто на крутому відрозі понад 900 м над рівнем моря, відрізаному долинами з трьох боків, приблизно за 15 км на схід від Мертвого моря й на південь від Арнону. Арамейський Таргум передає Кір Моавський як Керакка Моавська, мозаїчна мапа з Мадаби VI ст. підписує мурове місто як Харакмоба, а назва живе далі в Кераку. Дехто ставив ототожнення під сумнів: Б. К. Джонс стверджував, що свідчення Таргума його не підтверджують, і шукав місто на північ від Арнону; більшість досі тримається Керака."
    - "Місто з’являється у війні Йорама Ізраїльського, Йосафата й царя Едому проти Меші близько 850 р. до н. е. Союзники спустошували Моав, аж «так що тільки каміннє осталось в Кир-Харешетї. А пращовики обступили та й зруйнували його»; цар Моаву намагався прорватися до царя Едому, але марно, і «взяв він свого перворідня, що мав царювати після його, та й принїс його у всепаленнє на мурі», і облягачі відступили. Власна стела Меші, знайдена в Дівоні, про облогу не згадує. Пророцтво Ісаї про Моав ридає «по твердинях Кирхарешета» і каже: «Тим аж стогне утроба в мене над Моабом, мов гуслі жалібні, і серце моє над Кирхарешетом», а Єремія повторює: «плаче серце моє по осадниках Кирхареських»."
    - "За набатеїв і Риму Харакмоба була містом провінції Аравії, а згодом єпископською кафедрою. У 1142 р. хрестоносець Пайєн Кравчий збудував великий замок Керак, Крак-де-Моабіт, що й нині вінчає відріг; Рено де Шатійон володів ним, Салах-ад-Дін облягав його 1183 і 1184 рр., а в 1188 р. він здався. Аль-Карак сьогодні — столиця мухафази Карак, із замком і музеєм, а руїни міста залізної доби, якщо вони збереглися, лежать під сучасним містом."
  es:
    - "Kir-hareset, llamada también Kir-heres y Kir de Moab, era la ciudad fortaleza del sur de Moab, y es casi con toda certeza Kerak, en Jordania: una ciudad sobre un espolón escarpado a más de 900 m sobre el nivel del mar, aislada por valles en tres de sus lados, a unos 15 km al este del mar Muerto y al sur del Arnón. El Targum arameo traduce Kir de Moab como Kerakka de Moab, el mapa-mosaico de Madaba del siglo VI rotula la ciudad amurallada como Charachmoba, y el nombre sigue vivo en Kerak. Unos pocos han cuestionado la identificación: B. C. Jones sostuvo que el testimonio del Targum no la respalda y buscó la ciudad al norte del Arnón; la mayoría sigue aceptando Kerak."
    - "La ciudad aparece en la guerra de Joram de Israel, Josafat y el rey de Edom contra Mesa, hacia 850 a. C. Los aliados devastaron Moab hasta que «en Kir-hareseth solamente dejaron sus piedras; porque los honderos la cercaron, y la hirieron»; el rey de Moab intentó abrirse paso hasta el rey de Edom, fracasó, y «arrebató á su primogénito que había de reinar en su lugar, y sacrificóle en holocausto sobre el muro», y los sitiadores se retiraron. La estela del propio Mesa, hallada en Dibón, no menciona el asedio. El oráculo de Isaías sobre Moab lamenta «los fundamentos de Kir-hareseth» y dice: «mis entrañas sonarán como arpa acerca de Moab, y mi interior en orden á Kir-hareseth», y Jeremías lo repite: «resonará mi corazón á modo de flautas por los hombres de Kir-heres»."
    - "Bajo los nabateos y Roma, Charachmoba fue una ciudad de la provincia de Arabia y después sede episcopal. En 1142 el cruzado Payen el Copero levantó el gran castillo de Kerak, el Crac des Moabites, que aún corona el espolón; lo tuvo Reinaldo de Châtillon, Saladino lo asedió en 1183 y 1184, y se rindió en 1188. Al-Karak es hoy la capital de la gobernación de Karak, con el castillo y un museo, y las ruinas de la ciudad de la Edad del Hierro, si se conservan, yacen bajo la ciudad moderna."
  pt:
    - "Quir-Haresete, também Quir-Heres e Quir de Moabe, era a cidade-fortaleza do sul de Moabe e é quase certamente Kerak, na Jordânia: uma cidade num espigão íngreme a mais de 900 m acima do nível do mar, isolada por vales em três lados, a uns 15 km a leste do mar Morto e ao sul do Arnom. O Targum aramaico traduz Quir de Moabe por Kerakka de Moabe, o mapa-mosaico de Madaba, do século VI, designa a cidade murada como Charachmoba, e o nome sobrevive em Kerak. Poucos questionaram a identificação: B. C. Jones argumentou que a evidência do Targum não a sustenta e procurou a cidade ao norte do Arnom; a maioria ainda se atém a Kerak."
    - "A cidade aparece na guerra de Jeorão de Israel, Josafá e o rei de Edom contra Mesa, por volta de 850 a.C. Os aliados devastaram Moabe “até que em Quir-Haresete só restaram as suas pedras; contudo, os homens armados com fundas a cercaram e a atacaram”; o rei de Moabe tentou abrir caminho até o rei de Edom, não conseguiu e “pegou seu filho mais velho, que reinaria em seu lugar, e o ofereceu como holocausto sobre a muralha”, e os sitiantes se retiraram. A própria estela de Mesa, encontrada em Dibom, não menciona o cerco. O oráculo de Isaías sobre Moabe lamenta as fundações de Quir-Haresete e diz: “o meu coração soa como uma harpa por Moabe, e o meu íntimo por Quir-Heres”, e Jeremias o repete: “o meu coração geme como flautas pelos homens de Quir-Heres.”"
    - "Sob os nabateus e Roma, Charachmoba foi uma cidade da província da Arábia e depois sede de bispado. Em 1142, o cruzado Pagano, o Copeiro, construiu o grande castelo de Kerak, o Crac des Moabites, que ainda coroa o espigão; Reinaldo de Châtillon o manteve, Saladino o sitiou em 1183 e 1184, e ele se rendeu em 1188. Al-Karak é hoje a capital da província de Karak, com o castelo e um museu, e as ruínas da cidade da Idade do Ferro, se sobrevivem, jazem sob a cidade moderna."
  de:
    - "Kir-Heres, auch Kir-Hareseth und Kir in Moab, war die Festungsstadt des südlichen Moab und ist so gut wie sicher Kerak in Jordanien: eine Stadt auf einem steilen Sporn über 900 m über dem Meer, von Tälern auf drei Seiten abgeschnitten, etwa 15 km östlich des Toten Meeres und südlich des Arnon. Der aramäische Targum gibt Kir in Moab als Kerakka von Moab wieder, die Mosaikkarte von Madaba aus dem 6. Jahrhundert beschriftet die ummauerte Stadt als Charachmoba, und der Name lebt in Kerak fort. Einige haben die Gleichsetzung bezweifelt: B. C. Jones meinte, der Targum-Befund trage sie nicht, und suchte die Stadt nördlich des Arnon; die meisten halten an Kerak fest."
    - "Die Stadt erscheint im Krieg Jorams von Israel, Josaphats und des Königs von Edom gegen Mesa, um 850 v. Chr. Die Verbündeten verwüsteten Moab, „bis daß nur die Steine von Kir-Hareseth übrigblieben; und es umgaben die Stadt die Schleuderer und warfen auf sie“; der König von Moab versuchte, zum König von Edom durchzubrechen, scheiterte und „nahm seinen ersten Sohn, der an seiner Statt sollte König werden, und opferte ihn zum Brandopfer auf der Mauer“, und die Belagerer zogen ab. Mesas eigene Stele, in Dibon gefunden, erwähnt die Belagerung nicht. Jesajas Spruch über Moab klagt über „die Grundfesten der Stadt Kir-Hareseth“ und sagt: „Darum rauscht mein Herz über Moab wie eine Harfe und mein Inwendiges über Kir-Heres“; Jeremia wiederholt es: „über die Leute zu Kir-Heres seufzt mein Herz wie Flöten“."
    - "Unter den Nabatäern und Rom war Charachmoba eine Stadt der Provinz Arabien und später ein Bischofssitz. 1142 baute der Kreuzritter Pagan der Mundschenk die große Burg von Kerak, Crac des Moabites, die den Sporn noch heute krönt; Rainald von Châtillon hielt sie, Saladin belagerte sie 1183 und 1184, und 1188 ergab sie sich. Al-Karak ist heute Hauptstadt des Gouvernements Karak, mit der Burg und einem Museum darin, und die Ruinen der eisenzeitlichen Stadt liegen, falls sie erhalten sind, unter der heutigen Stadt."
  fr:
    - "Kir-Haréseth, aussi Kir-Hérès et Kir-Moab, était la ville-forteresse du sud de Moab, et c’est presque certainement Kerak, en Jordanie : une ville sur un éperon abrupt à plus de 900 m d’altitude, isolée par des vallées sur trois côtés, à quelque 15 km à l’est de la mer Morte et au sud de l’Arnon. Le Targoum araméen rend Kir-Moab par Kerakka de Moab, la carte-mosaïque de Madaba du VIe siècle désigne la ville fortifiée sous le nom de Charachmoba, et le nom survit dans Kerak. Quelques-uns ont mis l’identification en doute : B. C. Jones a soutenu que le témoignage du Targoum ne la confirme pas et a cherché la ville au nord de l’Arnon ; la plupart s’en tiennent à Kerak."
    - "La ville apparaît dans la guerre de Joram d’Israël, de Josaphat et du roi d’Édom contre Mescha, vers 850 av. J.-C. Les alliés ravagèrent Moab, et « les frondeurs enveloppèrent et battirent Kir-Haréseth, dont on ne laissa que les pierres » ; le roi de Moab tenta de se frayer un passage jusqu’au roi d’Édom, échoua, puis « prit alors son fils premier-né, qui devait régner à sa place, et il l’offrit en holocauste sur la muraille », et les assiégeants se retirèrent. La stèle de Mescha elle-même, trouvée à Dibon, ne mentionne pas le siège. L’oracle d’Ésaïe sur Moab pleure « les ruines de Kir-Haréseth » et dit : « mes entrailles frémissent sur Moab, comme une harpe, et mon cœur sur Kir-Harès » ; Jérémie le reprend : « mon cœur gémit comme une flûte … sur les gens de Kir-Hérès »."
    - "Sous les Nabatéens et Rome, Charachmoba fut une ville de la province d’Arabie, puis un évêché. En 1142, le croisé Pagan le Bouteiller bâtit le grand château de Kerak, le Crac des Moabites, qui couronne encore l’éperon ; Renaud de Châtillon le tint, Saladin l’assiégea en 1183 et 1184, et il se rendit en 1188. Al-Karak est aujourd’hui le chef-lieu du gouvernorat de Karak, avec le château et un musée, et les ruines de la ville de l’âge du Fer, si elles subsistent, gisent sous la ville moderne."
