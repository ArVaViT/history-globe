# Overview article (ADR 0007). Mainstream facts only; a minor place: the location is disputed and the map's candidates are given without choosing one.
id: beth-arabah
place: a3f8916
title:
  en: "Beth-arabah"
  ru: "Беф-Арава"
  uk: "Бет-Арава"
  es: "Bet-araba"
  pt: "Bete-Arabá"
  de: "Bet-Araba"
