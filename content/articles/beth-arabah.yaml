body:
  en:
    - "Beth-arabah, “house of the Arabah”, was a small town in the Jordan valley near the north end of the Dead Sea, on the border between Judah and Benjamin. It appears only in the lists of Joshua. The northern border of Judah “went up to Beth-hogla, and passed along by the north of Beth-arabah; and the border went up to the stone of Bohan the son of Reuben”, so the town lay on the Judah side; Benjamin's border, described in the other direction, probably passes it too: the Hebrew of that verse has only “the Arabah”, which is usually taken as a slip for Beth-arabah. Judah's wilderness district counts six towns, “Beth-arabah, Middin, and Secacah, and Nibshan, and the city of Salt, and En-gedi”, yet the town is also listed among the towns of Benjamin with Zemaraim and Bethel; perhaps the lists were drawn up at different times."
    - "The site is disputed, and the map keeps the candidates. Most scholars favour Ain el-Gharabeh, a spring south-east of Jericho near the lower course of Wadi Qelt, where the name seems to survive; others have suggested Rujm el-Bahr, a mound on the north shore of the Dead Sea that served as an anchorage in Hasmonean and Herodian times, or Tell Muhalhal nearby. None has been excavated as Beth-arabah. The companions of the town in Judah's list, Middin, Secacah and Nibshan, are usually sought at the Iron Age forts of the Buqei'a, the valley behind Qumran, which Cross and Milik explored in the 1950s."
    - "The ground today is farmland far below sea level, by the Jordanian border south of Jericho, between the baptism sites on the river and the hotels of the northern Dead Sea shore; the spring and the mounds are easy to miss."
  ru:
    - "Беф-Арава, «дом Аравы», — городок в долине Иордана близ северной оконечности Мёртвого моря, на границе Иуды и Вениамина. Он встречается только в списках книги Иисуса Навина. Северный предел Иуды «восходит к Беф-Хогле и проходит с северной стороны к Беф-Араве, и идет предел вверх до камня Богана, сына Рувимова», так что город лежал на стороне Иуды; граница Вениамина, описанная в обратном направлении, вероятно, тоже проходит мимо него: в еврейском тексте того стиха стоит лишь «Арава» (в Синодальном переводе — «равнины»), что обычно считают опиской вместо Беф-Аравы. Пустынный округ Иуды насчитывает шесть городов: «Беф-Арава, Миддин и Секаха, Нившан, Ир-Мелах и Ен-Геди», но город назван и среди городов Вениамина с Цемараимом и Вефилем; возможно, списки составлялись в разное время."
    - "Место спорно, и карта хранит кандидатов. Большинство учёных предпочитают Айн-эль-Гарабе, источник к юго-востоку от Иерихона у нижнего течения Вади-Кельт, где, по-видимому, уцелело имя; другие предлагали Руджм-эль-Бахр, холм на северном берегу Мёртвого моря, служивший пристанью в хасмонейское и иродианское время, или Телль-Мухальхаль поблизости. Ни одно из них не раскопано как Беф-Арава. Соседей города по списку Иуды — Миддин, Секаху и Нившан — обычно ищут в крепостях железного века в Букейе, долине за Кумраном, которую Кросс и Милик обследовали в 1950-х годах."
    - "Эта земля сегодня — пашни намного ниже уровня моря, у иорданской границы к югу от Иерихона, между местами крещения на реке и гостиницами северного берега Мёртвого моря; источник и холмы легко не заметить."
  uk:
    - "Бет-Арава, «дім Арави», було невеликим містом у Йорданській долині біля північного краю Мертвого моря, на межі між Юдою і Веніяміном. Воно з'являється лише в переліках книги Ісуса Навина. Північний кордон Юди «підіймається гряниця вгору на Бет-Гоглу і йде на північ від Бет-Араби; далїй тягнеться гряниця вгору до Боганового Каменя, Рубененкового», тож місто лежало на боці Юди; кордон Веніяміна, описаний у протилежному напрямку, ймовірно, також проходить повз нього: у єврейському тексті цього вірша стоїть лише «Арава», що зазвичай вважають опискою замість Бет-Арави. Пустельний округ Юди налічує шість міст: «Бет-Арава, Миддин, Секаха, Нибсан та Солоний город та Енгеди», але місто також названо серед міст Веніяміна разом із Цемараїмом та Бет-Елом; можливо, переліки складалися в різний час."
    - "Місце спірне, і мапа зберігає кандидатів. Більшість учених віддають перевагу Айн-ель-Гарабе, джерелу на південний схід від Єрихону біля нижньої течії вадію Кельт, де назва, схоже, збереглася; інші пропонували Руджм-ель-Бахр, пагорб на північному березі Мертвого моря, що слугував якірною стоянкою в хасмонейську й іродіанську добу, або Телль-Мухальхаль поблизу. Жодне не розкопували як Бет-Араву. Супутників міста в переліку Юди, Міддін, Секаху та Нівшан, зазвичай шукають у залізнодобових фортах Букеї, долини позаду Кумрану, яку досліджували Кросс і Мілік у 1950-х роках."
    - "Нині ця місцевість — рілля значно нижче рівня моря, біля йорданського кордону на південь від Єрихону, між місцями хрещення на річці та готелями північного берега Мертвого моря; джерело і пагорби легко пропустити."
  es:
    - "Bet-araba, «casa del Arabá», era una pequeña ciudad del valle del Jordán cerca del extremo norte del mar Muerto, en la frontera entre Judá y Benjamín. Aparece solo en las listas de Josué. La frontera septentrional de Judá «sube ... por Beth-hogla, y pasa del norte á Beth-araba, y de aquí sube este término á la piedra de Bohán, hijo de Rubén», de modo que la ciudad estaba del lado de Judá; la frontera de Benjamín, descrita en sentido inverso, probablemente también pasa por ella: el hebreo de ese versículo solo tiene «el Arabá», que suele tomarse por un error de copista en lugar de Bet-araba. El distrito del desierto de Judá cuenta seis ciudades, «Beth-araba, Middín, y Sechâchâ, Y Nibsan, y la ciudad de la sal, y Engedi», y sin embargo la ciudad figura también entre las ciudades de Benjamín con Zemaraim y Betel; quizá las listas fueron redactadas en épocas distintas."
    - "El sitio se discute, y el mapa conserva los candidatos. La mayoría de los estudiosos prefieren Ain el-Gharabeh, un manantial al sudeste de Jericó cerca del curso bajo del uadi Qelt, donde el nombre parece sobrevivir; otros han sugerido Rujm el-Bahr, un montículo en la orilla norte del mar Muerto que sirvió de fondeadero en época asmonea y herodiana, o Tell Muhalhal, cercano. Ninguno ha sido excavado como Bet-araba. Los compañeros de la ciudad en la lista de Judá, Medín, Secaca y Nibsán, se buscan por lo común en los fuertes de la edad del Hierro de la Buqei'a, el valle tras Qumrán, que Cross y Milik exploraron en la década de 1950."
    - "El terreno es hoy tierra de labranza muy por debajo del nivel del mar, junto a la frontera jordana al sur de Jericó, entre los lugares del bautismo en el río y los hoteles de la orilla septentrional del mar Muerto; el manantial y los montículos son fáciles de pasar por alto."
  pt:
    - "Bete-Arabá, “casa da Arabá”, era uma pequena cidade no vale do Jordão, perto do extremo norte do mar Morto, na fronteira entre Judá e Benjamim. Aparece apenas nas listas de Josué. A fronteira norte de Judá “subia a Bete-Hogla e passava pelo norte de Bete-Arabá; e a fronteira subia até a pedra de Boã, filho de Rúben”, de modo que a cidade ficava do lado de Judá; a fronteira de Benjamim, descrita em sentido contrário, provavelmente também passa por ela: o hebraico desse versículo traz apenas “a Arabá”, o que costuma ser tomado como lapso de copista por Bete-Arabá. O distrito do deserto de Judá conta seis cidades, “Bete-Arabá, Midim, Secaca, Nibsã, a Cidade do Sal e En-Gedi”, e contudo a cidade consta também entre as de Benjamim com Zemaraim e Betel; talvez as listas tenham sido compostas em épocas diferentes."
    - "O sítio é discutido, e o mapa guarda os candidatos. A maioria dos estudiosos prefere Ain el-Gharabeh, uma fonte a sudeste de Jericó, perto do curso inferior do uádi Qelt, onde o nome parece sobreviver; outros sugeriram Rujm el-Bahr, um montículo na margem norte do mar Morto que serviu de ancoradouro nos tempos hasmoneu e herodiano, ou Tell Muhalhal, nas proximidades. Nenhum foi escavado como Bete-Arabá. As companheiras da cidade na lista de Judá, Midim, Secaca e Nibsã, costumam ser procuradas nos fortes da Idade do Ferro da Buqei'a, o vale atrás de Qumran, que Cross e Milik exploraram na década de 1950."
    - "O terreno é hoje terra agrícola muito abaixo do nível do mar, junto à fronteira com a Jordânia ao sul de Jericó, entre os locais de batismo no rio e os hotéis da margem norte do mar Morto; a fonte e os montículos passam facilmente despercebidos."
  de:
    - "Bet-Araba, „Haus der Araba“, war eine kleine Stadt im Jordantal nahe dem Nordende des Toten Meeres, an der Grenze zwischen Juda und Benjamin. Sie erscheint nur in den Listen Josuas. Judas Nordgrenze „geht herauf gen Beth-Hogla und zieht sich mitternachtswärts von Beth-Araba und kommt herauf zum Stein Bohans, des Sohnes Rubens“, die Stadt lag also auf der Seite Judas; Benjamins Grenze, in der Gegenrichtung beschrieben, führt wahrscheinlich auch an ihr vorbei: Im Hebräischen jenes Verses steht nur „die Araba“, was meist als Schreibversehen für Bet-Araba gilt. Judas Wüstenbezirk zählt sechs Städte: „In der Wüste aber war Beth-Araba, Middin, Sechacha, Nibsan und die Salzstadt und Engedi“, doch steht die Stadt auch unter den Städten Benjamins mit Zemarajim und Bethel; vielleicht wurden die Listen zu verschiedenen Zeiten verfasst."
    - "Die Stätte ist umstritten, und die Karte hält die Kandidaten fest. Die meisten Gelehrten bevorzugen Ain el-Gharabe, eine Quelle südöstlich von Jericho nahe dem Unterlauf des Wadi Qelt, wo der Name zu überleben scheint; andere haben Rudschm el-Bahr vorgeschlagen, einen Hügel am Nordufer des Toten Meeres, der in hasmonäischer und herodianischer Zeit als Ankerplatz diente, oder das nahe Tell Muhallal. Keiner wurde als Bet-Araba ausgegraben. Die Gefährten der Stadt in Judas Liste, Middin, Sechacha und Nibschan, sucht man gewöhnlich bei den eisenzeitlichen Festungen der Buqe'a, des Tals hinter Qumran, die Cross und Milik in den 1950er Jahren erkundeten."
    - "Das Gelände ist heute Ackerland weit unter dem Meeresspiegel, an der jordanischen Grenze südlich von Jericho, zwischen den Taufstätten am Fluss und den Hotels am Nordufer des Toten Meeres; die Quelle und die Hügel sind leicht zu übersehen."
  fr:
    - "Beth-Araba, « maison de l’Araba », était une petite ville de la vallée du Jourdain près de l’extrémité nord de la mer Morte, à la frontière entre Juda et Benjamin. Elle n’apparaît que dans les listes de Josué. La frontière nord de Juda « montait vers Beth-Hogla, passait au nord de Beth-Araba, et s’élevait jusqu’à la pierre de Bohan, fils de Ruben », si bien que la ville était du côté de Juda ; la frontière de Benjamin, décrite en sens inverse, la longe probablement aussi : l’hébreu de ce verset porte seulement « l’Araba », qu’on tient d’ordinaire pour une erreur de copiste au lieu de Beth-Araba. Le district du désert de Juda compte six villes, « Beth-Araba, Middin, Secaca, Nibschan, Ir-Hammélach, et En-Guédi », mais la ville est aussi comptée parmi celles de Benjamin avec Tsemaraïm et Béthel ; peut-être les listes furent-elles dressées à des époques différentes."
    - "Le site est discuté, et la carte garde les candidats. La plupart des savants préfèrent Ain el-Gharabeh, source au sud-est de Jéricho près du cours inférieur du Wadi Qelt, où le nom semble survivre ; d’autres ont proposé Rujm el-Bahr, tertre sur la rive nord de la mer Morte qui servait de mouillage aux époques hasmonéenne et hérodienne, ou Tell Muhalhal tout près. Aucun n’a été fouillé comme Beth-Araba. Les compagnes de la ville dans la liste de Juda, Middin, Secaca et Nibschan, sont d’ordinaire cherchées aux forts de l’âge du Fer de la Buqei’a, la vallée derrière Qumrân, explorés par Cross et Milik dans les années 1950."
    - "Le terrain est aujourd’hui une terre cultivée bien au-dessous du niveau de la mer, près de la frontière jordanienne au sud de Jéricho, entre les sites du baptême sur le fleuve et les hôtels de la rive nord de la mer Morte ; la source et les tertres sont faciles à manquer."
  it:
    - "Bet-Araba, «casa dell’Araba», era una piccola città nella valle del Giordano presso l’estremità settentrionale del Mar Morto, sul confine tra Giuda e Beniamino. Compare soltanto negli elenchi di Giosuè. Il confine settentrionale di Giuda «saliva verso Beth-Hogla, passava al nord di Beth-Araba, saliva fino al sasso di Bohan figliuolo di Ruben», così la città stava dal lato di Giuda; il confine di Beniamino, descritto nell’altra direzione, probabilmente la passa anch’esso: l’ebraico di quel versetto ha solo «Arabah», che di solito si considera una svista per Bet-Araba. Il distretto del deserto di Giuda conta sei città, «Beth-Araba, Middin, Secacah, Nibshan, Ir-Hammelah e Enghedi», eppure la città è elencata anche fra le città di Beniamino con Zemaraim e Betel; forse gli elenchi furono redatti in tempi diversi."
    - "Il sito è discusso, e la carta conserva i candidati. La maggior parte degli studiosi preferisce Ain el-Gharabeh, una sorgente a sud-est di Gerico presso il corso inferiore dello Wadi Qelt, dove il nome pare sopravvivere; altri hanno suggerito Rujm el-Bahr, un tell sulla riva settentrionale del Mar Morto che servì da ancoraggio in epoca asmonea ed erodiana, o Tell Muhalhal vicino. Nessuno è stato scavato come Bet-Araba. Le compagne della città nell’elenco di Giuda, Middin, Secacà e Nibsan, sono di solito cercate nei forti dell’età del Ferro della Buqei‘a, la valle dietro Qumran, che Cross e Milik esplorarono negli anni Cinquanta."
    - "Il terreno è oggi terra coltivata molto al di sotto del livello del mare, presso il confine giordano a sud di Gerico, tra i luoghi del battesimo sul fiume e gli alberghi della riva settentrionale del Mar Morto; la sorgente e i tell si trascurano facilmente."
  pl:
    - "Bet-Araba, „dom Araby”, było małym miastem w Dolinie Jordanu koło północnego krańca Morza Martwego, na granicy między Judą a Beniaminem. Pojawia się tylko w wykazach Jozuego. O północnej granicy Judy mówi tekst: „ciągnie się ta granica do Betaglu, i bieży od północy aż do Betaraba; a stamtąd idzie ta granica aż do kamienia Boen, syna Rubenowego”, więc miasto leżało po stronie Judy; granica Beniamina, opisana w drugą stronę, prawdopodobnie też je mija: hebrajski tekst tego wersetu ma tylko „Araba”, co zwykle uważa się za pomyłkę kopisty zamiast Bet-Araba. Okręg pustynny Judy liczy sześć miast: „Bet Araba, Meddyn, i Sechacha; I Nebsan, i miasto Soli, i Engaddy”, a jednak miasto figuruje też wśród miast Beniamina z Semaraim i Betel; być może wykazy sporządzono w różnych czasach."
    - "Miejsce jest sporne, a mapa zachowuje kandydatów. Większość uczonych wybiera Ain el-Gharabeh, źródło na południowy wschód od Jerycha koło dolnego biegu Wadi Qelt, gdzie nazwa zdaje się przetrwać; inni sugerowali Rujm el-Bahr, kopiec na północnym brzegu Morza Martwego, który służył jako kotwicowisko w czasach hasmonejskich i herodiańskich, albo pobliski Tell Muhalhal. Żaden nie był wykopywany jako Bet-Araba. Towarzyszy miasta na wykazie Judy, Middin, Sekaka i Niwszan, szuka się zwykle w fortach epoki żelaza w Buqei'a, dolinie za Qumran, którą Cross i Milik badali w latach 50."
    - "Teren to dziś pola uprawne położone głęboko poniżej poziomu morza, przy granicy jordańskiej na południe od Jerycha, między miejscami chrztu nad rzeką a hotelami północnego brzegu Morza Martwego; źródło i kopce łatwo przeoczyć."
  nl:
    - "Beth-Araba, “huis van de Araba”, was een kleine stad in de Jordaanvallei nabij het noordeinde van de Dode Zee, op de grens tussen Juda en Benjamin. Het verschijnt alleen in de lijsten van Jozua. De noordgrens van Juda “zal opgaan tot Beth-hogla, en zal doorgaan van het noorden naar Beth-araba; en deze landpale zal opgaan tot den steen van Bohan, den zoon van Ruben”, dus de stad lag aan de kant van Juda; Benjamins grens, in de andere richting beschreven, passeert haar waarschijnlijk ook: het Hebreeuws van dat vers heeft alleen “de Araba”, wat gewoonlijk als verschrijving voor Beth-Araba wordt opgevat. Juda’s woestijndistrict telt zes steden, “In de woestijn: Beth-araba, Middin en Sechacha, en Nibsan, en de Zoutstad, en Engedi”, maar de stad staat ook onder de steden van Benjamin met Zemaraïm en Bethel; misschien werden de lijsten op verschillende tijden opgesteld."
    - "De plaats is omstreden, en de kaart bewaart de kandidaten. De meeste geleerden verkiezen Ain el-Gharabeh, een bron ten zuidoosten van Jericho nabij de benedenloop van de Wadi Qelt, waar de naam lijkt voort te leven; anderen hebben Rujm el-Bahr voorgesteld, een heuvel aan de noordoever van de Dode Zee die in Hasmonese en Herodiaanse tijd als ankerplaats diende, of Tell Muhalhal in de buurt. Geen is opgegraven als Beth-Araba. De gezellen van de stad in Juda’s lijst, Middin, Sekaka en Nibsan, worden gewoonlijk gezocht bij de ijzertijdforten van de Buqei’a, de vallei achter Qumran, die Cross en Milik in de jaren vijftig verkenden."
    - "Het terrein is nu akkerland ver onder de zeespiegel, bij de Jordaanse grens ten zuiden van Jericho, tussen de doopplaatsen aan de rivier en de hotels aan de noordkust van de Dode Zee; de bron en de heuvels zijn gemakkelijk te missen."
  cs:
    - "Bét-araba, „dům Araby“, bylo malé město v Jordánském údolí poblíž severního konce Mrtvého moře, na hranici mezi Judou a Benjamínem. Objevuje se jen v seznamech Jozue. Severní hranice Judy „jde meze ta do Betogla, a táhne se od půlnoci do Betaraba; a odtud přichází k kameni Bohana syna Rubenova“, takže město leželo na straně Judově; hranice Benjamínova, popsaná opačným směrem, je pravděpodobně míjí také: hebrejština onoho verše má jen „Araba“, což se obvykle pokládá za písařskou chybu místo Bét-araba. Judská pouštní oblast počítá šest měst, „Betaraba, Middin a Sechacha; A Nibsam, a město solné, a Engadi“, a přesto je město uvedeno i mezi městy Benjamínovými s Cemarajimem a Bét-elem: „A Betaraba, Semaraim a Bethel“; snad byly seznamy sestavovány v různých dobách."
    - "Místo je sporné a mapa uchovává kandidáty. Většina badatelů dává přednost Ain el-Gharabeh, prameni jihovýchodně od Jericha poblíž dolního toku Wadi Qelt, kde se zdá, že jméno přežívá; jiní navrhli Rujm el-Bahr, pahorek na severním břehu Mrtvého moře, který sloužil jako kotviště v hasmoneovské a herodovské době, nebo nedaleký Tell Muhalhal. Žádné z nich nebylo vykopáno jako Bét-araba. Společníci města v seznamu Judy, Middín, Sekaka a Nibšan, se obvykle hledají v pevnostech doby železné v Buqei'a, údolí za Kumránem, které Cross a Milik prozkoumali v 50. letech 20. století."
    - "Země je dnes zemědělskou půdou hluboko pod úrovní moře, u jordánské hranice jižně od Jericha, mezi křestními místy na řece a hotely severního břehu Mrtvého moře; pramen a pahorky se snadno přehlédnou."
  sv:
    - "Bet-Arava, ”Aravas hus”, var en liten stad i Jordandalen nära Döda havets norra ände, på gränsen mellan Juda och Benjamin. Den förekommer bara i Josuas förteckningar. Judas norra gräns: ”Därifrån drog sig gränsen upp mot Bet-Hogla och gick fram norr om Bet-Haaraba; vidare drog sig gränsen upp till Bohans, Rubens sons, sten”, så staden låg på Judas sida; Benjamins gräns, beskriven i andra riktningen, passerar den sannolikt också: den hebreiska texten i den versen har bara ”Arava”, vilket vanligen tas för ett fel för Bet-Arava. Judas öknendistrikt räknar sex städer, ”Bet-Haaraba, Middin, Sekaka, Nibsan, Ir-Hammela och En-Gedi”, men staden är också upptagen bland Benjamins städer med Semarajim och Betel; kanske upprättades förteckningarna vid olika tider."
    - "Platsen är omstridd, och kartan behåller kandidaterna. De flesta forskare föredrar Ajin el-Gharabeh, en källa sydost om Jeriko nära Wadi Qelts nedre lopp, där namnet tycks leva kvar; andra har föreslagit Rujm el-Bahr, en kulle på Döda havets norra strand som tjänade som ankarplats under hasmoneisk och herodiansk tid, eller Tell Muhalhal i närheten. Ingen har grävts ut som Bet-Arava. Stadens följeslagare i Judas förteckning, Middin, Sekaka och Nivshan, söks vanligen vid järnåldersfästena i Buqei'a, dalen bakom Qumran, som Cross och Milik utforskade på 1950-talet."
    - "Marken är i dag jordbruksmark långt under havsytan, vid den jordanska gränsen söder om Jeriko, mellan dopplatserna vid floden och hotellen på Döda havets norra strand; källan och kullarna är lätta att missa."
  nb:
    - "Bet-Araba, «Aravas hus», var en liten by i Jordandalen nær nordenden av Dødehavet, på grensen mellom Juda og Benjamin. Den forekommer bare i listene i Josva. Judas nordgrense: «Derfra drog den sig op til Bet-Hogla og videre i nord for Bet-Ha'araba, op til den sten som har navn efter Bohan, Rubens sønn», så byen lå på Judas side; Benjamins grense, beskrevet i motsatt retning, passerer den trolig også: den hebraiske teksten i det verset har bare «Arava», som vanligvis tas for en feil for Bet-Araba. Judas ørkendistrikt regner seks byer, «Bet-Ha'araba, Middin og Sekaka og Hannibsan og Ir-Hammelah og En-Gedi», men byen står også blant Benjamins byer med Semarajim og Betel; kanskje ble listene satt opp til ulike tider."
    - "Stedet er omstridt, og kartet beholder kandidatene. De fleste forskere foretrekker Ajin el-Gharabeh, en kilde sørøst for Jeriko nær nedre løp av Wadi Qelt, der navnet synes å ha overlevd; andre har foreslått Rujm el-Bahr, en tell på nordbredden av Dødehavet som tjente som ankerplass i hasmoneisk og herodiansk tid, eller Tell Muhalhal i nærheten. Ingen er gravd ut som Bet-Araba. Byens følgesvenner i Judas liste, Middin, Sekaka og Nibsjan, søkes vanligvis ved jernalderfortene i Buqei'a, dalen bak Qumran, som Cross og Milik utforsket på 1950-tallet."
    - "Stedet er i dag jordbruksland langt under havnivå, ved den jordanske grensen sør for Jeriko, mellom dåpsstedene ved elven og hotellene på nordre Dødehavskyst; kilden og haugene er lette å overse."
  tl:
    - "Ang Beth-araba, “bahay ng Araba”, ay maliit na bayan sa libis ng Jordan malapit sa hilagang dulo ng Dagat na Patay, sa hangganan ng Juda at Benjamin. Lumilitaw lamang ito sa mga talaan ni Josue. Ang hilagang hangganan ng Juda ay “pasampa sa Beth-hogla, at patuloy sa hilagaan ng Beth-araba; at ang hangganan ay pasampa sa bato ni Bohan na anak ni Ruben”, kaya nasa panig ng Juda ang bayan; ang hangganan ng Benjamin, na inilarawan sa kabilang direksiyon, ay marahil dumaraan din dito: “Araba” lamang ang nasa Hebreo ng talatang iyon, na karaniwang itinuturing na pagkakamali para sa Beth-araba. Anim na bayan ang distrito ng ilang ng Juda, “Beth-araba, Middin, at Sechacha; At Nibsan, at ang Bayan ng Asin, at En-gedi”, ngunit nakalista rin ang bayan sa mga bayan ng Benjamin kasama ng Samaraim at Beth-el; marahil iginuhit ang mga talaan sa magkaibang panahon."
    - "Pinagtatalunan ang lugar, at iniingatan ng mapa ang mga kandidato. Karamihan ng iskolar ay pumapanig sa Ain el-Gharabeh, bukal sa timog-silangan ng Jerico malapit sa ibabang daloy ng Wadi Qelt, kung saan tila nananatili ang pangalan; iminungkahi ng iba ang Rujm el-Bahr, burol sa hilagang baybayin ng Dagat na Patay na naging angklahan noong panahong Hasmoneo at Herodiano, o ang Tell Muhalhal sa malapit. Wala sa mga ito ang nahukay bilang Beth-araba. Ang mga kasama ng bayan sa talaan ng Juda, Middin, Sechacha at Nibsan, ay karaniwang hinahanap sa mga kuta ng Panahon ng Bakal sa Buqei'a, ang libis sa likod ng Qumran, na ginalugad nina Cross at Milik noong dekada 1950."
    - "Ang lupa ngayon ay bukirin na malayong mas mababa sa antas ng dagat, sa tabi ng hangganan ng Jordan sa timog ng Jerico, sa pagitan ng mga lugar ng bautismo sa ilog at mga hotel ng hilagang baybayin ng Dagat na Patay; madaling makaligtaan ang bukal at ang mga burol."
  da:
    - "Bet-Araba, »Arabas hus«, var en lille by i Jordandalen nær Det Døde Havs nordende, på grænsen mellem Juda og Benjamin. Den optræder kun i Josvas lister. Judas nordgrænse »gaar op til Beth-Hogla og gaar igennem Norden om Beth-Araba, og Landemærket gaar saa op til Bohans, Rubens Søns, Sten«, så byen lå på Judas side; Benjamins grænse, beskrevet i den anden retning, passerer den sandsynligvis også: den hebraiske tekst i det vers har kun »Araba«, hvilket sædvanligvis tages for en fejl for Bet-Araba. Judas ørkendistrikt tæller seks byer, »Beth-Araba, Middin og Sekaka og Nibsan og Ir-Melak og En-Gedi«, men byen er også opført blandt Benjamins byer med Semarajim og Betel; måske blev listerne udarbejdet på forskellige tidspunkter."
    - "Stedet er omstridt, og kortet beholder kandidaterne. De fleste forskere foretrækker Ain el-Gharabeh, en kilde sydøst for Jeriko nær Wadi Qelts nedre løb, hvor navnet synes at leve; andre har foreslået Rujm el-Bahr, en høj på Det Døde Havs nordkyst, der tjente som ankerplads i hasmonæisk og herodiansk tid, eller Tell Muhalhal i nærheden. Ingen er udgravet som Bet-Araba. Byens ledsagere i Judas liste, Middin, Sekaka og Nibsjan, søges sædvanligvis ved jernalderfortene i Buqei'a, dalen bag Qumran, som Cross og Milik udforskede i 1950'erne."
    - "Terrænet er i dag agerjord langt under havets overflade, ved den jordanske grænse syd for Jeriko, mellem dåbsstederne ved floden og hotellerne på Det Døde Havs nordkyst; kilden og højene er lette at overse."
  sr:
    - "Вет-Арава, „дом Араве“, био је мали град у долини Јордана близу северног краја Мртвог мора, на међи између Јуде и Венијамина. Јавља се само у списковима Исуса Навина. О северној међи Јуде стоји: „иде та међа на Вет-Оглу, и пружа се од севера до Вет-Араве; и одатле иде та међа на камен Воана сина Рувимовог“, па је град лежао на јудејској страни; Венијаминова међа, описана у другом смеру, вероватно га такође пролази: хебрејски тог стиха има само „Арава“, што се обично узима за омашку за Вет-Араву. Јудин пустињски округ броји шест градова, „Вет-Арава, Мидин и Сехаха, и Нивсан, и град соли, и Енгадија“, а ипак је град наведен и међу градовима Венијаминовим са Семарајимом и Ветиљем; можда су спискови састављени у различита времена."
    - "Налазиште је спорно, а карта чува кандидате. Већина научника даје предност Аин ел-Гарабеу, извору југоисточно од Јерихона близу доњег тока Вади Келта, где као да је име сачувано; други су предлагали Рујм ел-Бахр, хумку на северној обали Мртвог мора која је служила као сидриште у хасмонејско и иродовско доба, или оближњи Тел Мухалхал. Ниједан није ископаван као Вет-Арава. Сапутнике града у Јудином списку, Мидин, Сехаху и Нивсан, обично траже у тврђавама гвозденог доба Букеје, долине иза Кумрана, коју су Крос и Милик истраживали педесетих година."
    - "Тло је данас обрадива земља далеко испод нивоа мора, поред јорданске границе јужно од Јерихона, између места крштења на реци и хотела северне обале Мртвог мора; извор и хумке лако је превидети."
