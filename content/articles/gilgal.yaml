# Overview article (ADR 0007). Mainstream facts only; the site is unidentified and named as such.
# The place is Joshua's Gilgal near Jericho; the Gilgal of 2 Kings 2:1 (a6399b3) is only mentioned.
id: gilgal
place: ab94aea
title:
  en: "Gilgal"
  ru: "Галгал"
  uk: "Гілгал"
  es: "Gilgal"
  pt: "Gilgal"
  de: "Gilgal"
  fr: "Guilgal"
  pl: "Gilgal"
  it: "Gàlgala"
  nl: "Gilgal"
  cs: "Gilgal"
body:
  en:
    - 'Gilgal was the first camp of Israel west of the Jordan, set by the Book of Joshua "in the east border of Jericho". The name is usually taken to mean a circle, perhaps of stones. Its site has not been found. Proposals in the plain between Jericho and the Jordan include Khirbet el-Mefjir, where the map places it, and Khirbet en-Nitla, dug in 1950; neither has settled the question. Other places in the Bible bear the same name, and the Gilgal from which Elijah and Elisha set out is often sought in the hills near Bethel.'
    - 'Here, according to Joshua, the people set up twelve stones taken from the bed of the Jordan, the men born in the wilderness were circumcised, and the LORD said, "This day have I rolled away the reproach of Egypt from off you"; the Bible links the name to this rolling away. Israel kept the Passover at Gilgal, and the manna ceased. The camp remained there during the conquest: the Gibeonites came to it to make a league, and Caleb asked Joshua there for his inheritance. Josephus explains the name as "liberty".'
    - 'In the time of the judges the angel of the LORD came up from Gilgal to Bochim, and Ehud turned back "from the quarries that were by Gilgal" before he killed Eglon. Samuel went in circuit to Bethel, Gilgal and Mizpeh to judge Israel. At Gilgal the people made Saul king before the LORD; there Saul offered the burnt offering without waiting for Samuel, and there Samuel hewed Agag in pieces. Judah came to Gilgal to bring David back over the Jordan after Absalom''s revolt.'
    - 'In the eighth century BC Hosea and Amos condemned the sacrifices of Gilgal: "All their wickedness is in Gilgal". The place was still remembered in Roman times. Josephus puts Israel''s first camp fifty furlongs on from the Jordan and ten from Jericho. In the early fourth century Eusebius knew it as a deserted place held sacred by the people of the region, and wrote that the stones brought up from the Jordan were shown at the second mile from Jericho.'
  ru:
    - "Галгал — первый стан Израиля на западном берегу Иордана; книга Иисуса Навина помещает его «на восточной стороне Иерихона». Имя обычно понимают как «круг», возможно, из камней. Место его не найдено. На равнине между Иерихоном и Иорданом предлагали Хирбет эль-Мефджир, где его помещает карта, и Хирбет эн-Нитлу, где копали в 1950 г.; ни то ни другое не решило вопроса. В Библии есть и другие места с тем же именем, а Галгал, из которого вышли Илия и Елисей, часто ищут в горах близ Вефиля."
    - "По книге Иисуса Навина, здесь народ поставил двенадцать камней, взятых со дна Иордана, родившиеся в пустыне были обрезаны, и Господь сказал: «ныне Я снял с вас посрамление Египетское»; Библия связывает имя места с этим снятием. В Галгале Израиль совершил Пасху, и манна перестала падать. Стан оставался здесь во время завоевания: сюда пришли гаваонитяне заключить союз, и здесь Халев просил у Иисуса своего удела. Иосиф Флавий толкует имя как «свобода»."
    - "Во времена судей Ангел Господень пришёл из Галгала в Бохим, а Аод возвратился «от истуканов, которые в Галгале», прежде чем убить Еглона. Самуил обходил Вефиль, Галгал и Массифу и судил Израиля. В Галгале народ поставил Саула царём пред Господом; здесь Саул принёс всесожжение, не дождавшись Самуила, и здесь Самуил разрубил Агага. Иудеи пришли в Галгал, чтобы перевезти Давида через Иордан после восстания Авессалома."
    - "В VIII веке до н. э. Осия и Амос обличали жертвы Галгала: «Все зло их в Галгале». Место помнили и в римское время. Иосиф Флавий помещает первый стан Израиля в пятидесяти стадиях от Иордана и в десяти от Иерихона. В начале IV века Евсевий знал его как пустое место, почитаемое жителями округи как святое, и писал, что камни, вынесенные из Иордана, показывают у второй мили от Иерихона."
  uk:
    - "Гілгал був першим табором Ізраїлю на захід від Йордану, розташованим, за Книгою Ісуса Навина, «на східній сторонї від Ерихону». Назву зазвичай розуміють як «коло», можливо, з каменів. Місце не знайдено. Запропоновані варіанти на рівнині між Єрихоном і Йорданом — Хірбет-ель-Мефджір, де його позначає карта, та Хірбет-ен-Нітла, розкопана 1950 року; жоден не розв’язав питання. Інші місця в Біблії мають ту саму назву, а Гілгал, звідки вирушили Ілля й Єлисей, часто шукають у пагорбах поблизу Бет-Ела."
    - "Тут, за Книгою Ісуса Навина, народ поставив дванадцять каменів, узятих із русла Йордану, були обрізані люди, народжені в пустелі, і Господь сказав: «Сьогоднї зняв я з вас сором Египецький»; Біблія пов’язує назву з цим скочуванням. Ізраїль святкував у Гілгалі Пасху, і манна припинилася. Табір лишався там під час завоювання: гаваонці прийшли до нього укласти союз, і Калеб там попросив у Ісуса Навина свій уділ. Йосиф Флавій пояснює назву як «свобода»."
    - "За часів суддів ангел Господній піднявся з Гілгала до Бохіма, а Егуд повернувся «до виструганих ідолів у Галгалї», перш ніж убити Еглона. Самуїл щороку обходив Бет-Ел, Гілгал і Міцпе, щоб судити Ізраїль. У Гілгалі народ поставив Саула царем перед Господом; там Саул приніс всепалення, не дочекавшись Самуїла, і там Самуїл розрубав Агага на шматки. Юда прийшов до Гілгала, щоб повернути Давида через Йордан після повстання Авесалома."
    - "У VIII ст. до н. е. Осія й Амос осуджували жертви Гілгала: «Усе зло їх постало в Галгалї». Це місце пам’ятали й за римських часів. Йосиф Флавій розміщує перший табір Ізраїлю за п’ятдесят стадій від Йордану й за десять від Єрихона. На початку IV ст. Євсевій знав його як безлюдне місце, шановане як святе мешканцями краю, і писав, що каміння, винесене з Йордану, показували на другій милі від Єрихона."
  es:
    - "Gilgal fue el primer campamento de Israel al oeste del Jordán, situado por el libro de Josué «al lado oriental de Jericó». El nombre suele entenderse como «círculo», quizá de piedras. Su emplazamiento no se ha hallado. Entre las propuestas en la llanura entre Jericó y el Jordán figuran Khirbet el-Mefjir, donde lo sitúa el mapa, y Khirbet en-Nitla, excavada en 1950; ninguna ha resuelto la cuestión. Otros lugares de la Biblia llevan el mismo nombre, y el Gilgal de donde partieron Elías y Eliseo se busca a menudo en las colinas cerca de Betel."
    - "Aquí, según Josué, el pueblo levantó doce piedras tomadas del lecho del Jordán, los hombres nacidos en el desierto fueron circuncidados, y el Señor dijo: «Hoy he quitado de vosotros el oprobio de Egipto»; la Biblia vincula el nombre con este quitar. Israel celebró la Pascua en Gilgal, y el maná cesó. El campamento permaneció allí durante la conquista: los gabaonitas acudieron a él para hacer alianza, y Caleb pidió allí a Josué su heredad. Josefo explica el nombre como «libertad»."
    - "En tiempos de los jueces el ángel del Señor subió de Gilgal a Boquim, y Aod se volvió «desde los ídolos que están en Gilgal» antes de matar a Eglón. Samuel iba cada año en circuito a Betel, Gilgal y Mizpa para juzgar a Israel. En Gilgal el pueblo hizo rey a Saúl delante del Señor; allí Saúl ofreció el holocausto sin esperar a Samuel, y allí Samuel cortó en pedazos a Agag. Judá acudió a Gilgal para hacer pasar de nuevo el Jordán a David tras la rebelión de Absalón."
    - "En el siglo VIII a. C. Oseas y Amós condenaron los sacrificios de Gilgal: «Toda la maldad de ellos fué en Gilgal». El lugar seguía recordándose en tiempos romanos. Josefo sitúa el primer campamento de Israel a cincuenta estadios del Jordán y diez de Jericó. A comienzos del siglo IV Eusebio lo conocía como un lugar desierto tenido por sagrado entre los habitantes de la región, y escribió que las piedras sacadas del Jordán se mostraban a dos millas de Jericó."
  pt:
    - "Gilgal foi o primeiro acampamento de Israel a oeste do Jordão, situado pelo livro de Josué “na fronteira leste de Jericó”. O nome é usualmente tomado como significando um círculo, talvez de pedras. Seu sítio não foi encontrado. As propostas na planície entre Jericó e o Jordão incluem Khirbet el-Mefjir, onde o mapa o coloca, e Khirbet en-Nitla, escavada em 1950; nenhuma resolveu a questão. Outros lugares na Bíblia têm o mesmo nome, e o Gilgal de onde partiram Elias e Eliseu é muitas vezes procurado nas colinas perto de Betel."
    - "Aqui, segundo Josué, o povo erigiu doze pedras tiradas do leito do Jordão, os homens nascidos no deserto foram circuncidados, e o SENHOR disse: “Hoje eu removi de vocês o opróbrio do Egito”; a Bíblia liga o nome a esse remover. Israel celebrou a Páscoa em Gilgal, e o maná cessou. O acampamento permaneceu ali durante a conquista: os gibeonitas foram a ele para fazer uma aliança, e Calebe pediu ali a Josué a sua herança. Josefo explica o nome como “liberdade”."
    - "No tempo dos juízes, o anjo do SENHOR subiu de Gilgal a Boquim, e Eúde voltou “dos ídolos de pedra que estavam perto de Gilgal” antes de matar Eglom. Samuel fazia um circuito por Betel, Gilgal e Mispá para julgar Israel. Em Gilgal o povo fez Saul rei perante o SENHOR; ali Saul ofereceu o holocausto sem esperar por Samuel, e ali Samuel despedaçou Agague. Judá foi a Gilgal para trazer Davi de volta através do Jordão depois da revolta de Absalão."
    - "No século VIII a.C., Oseias e Amós condenaram os sacrifícios de Gilgal: “Toda a maldade deles está em Gilgal”. O lugar ainda era lembrado em tempos romanos. Josefo põe o primeiro acampamento de Israel a cinquenta estádios do Jordão e dez de Jericó. No início do século IV, Eusébio o conheceu como um lugar deserto tido por sagrado pelo povo da região, e escreveu que as pedras trazidas do Jordão eram mostradas na segunda milha a partir de Jericó."
  de:
    - "Gilgal war das erste Lager Israels westlich des Jordan, vom Buch Josua „gegen Morgen vor der Stadt Jericho“ angesetzt. Der Name wird gewöhnlich als Kreis gedeutet, vielleicht aus Steinen. Seine Stätte ist nicht gefunden. Vorgeschlagen werden in der Ebene zwischen Jericho und dem Jordan Chirbet el-Mefdschir, wo die Karte es ansetzt, und Chirbet en-Nitla, 1950 ausgegraben; keine hat die Frage entschieden. Andere Orte in der Bibel tragen denselben Namen, und das Gilgal, von dem Elia und Elisa aufbrachen, wird oft im Bergland bei Bethel gesucht."
    - "Hier stellte das Volk nach Josua zwölf Steine aus dem Jordanbett auf, wurden die in der Wüste geborenen Männer beschnitten, und der HERR sprach: „Heute habe ich die Schande Ägyptens von euch gewendet“; die Bibel verbindet den Namen mit diesem Abwälzen. Israel feierte in Gilgal das Passa, und das Manna hörte auf. Das Lager blieb während der Eroberung dort: Die Gibeoniter kamen hierher, um einen Bund zu schließen, und Kaleb bat Josua dort um sein Erbteil. Josephus erklärt den Namen als „Freiheit“."
    - "In der Richterzeit kam der Engel des HERRN von Gilgal hinauf nach Bochim, und Ehud kehrte um „von den Götzen zu Gilgal“, bevor er Eglon tötete. Samuel zog „jährlich umher zu Beth-El und Gilgal und Mizpa“, um Israel zu richten. In Gilgal machte das Volk Saul vor dem HERRN zum König; dort brachte Saul das Brandopfer dar, ohne auf Samuel zu warten, und dort hieb Samuel Agag in Stücke. Juda kam nach Gilgal, um David nach Absaloms Aufstand über den Jordan zurückzuführen."
    - "Im 8. Jahrhundert v. Chr. verurteilten Hosea und Amos die Opfer von Gilgal: „Alle ihre Bosheit geschieht zu Gilgal“. Der Ort war in römischer Zeit noch in Erinnerung. Josephus setzt Israels erstes Lager fünfzig Stadien vom Jordan und zehn von Jericho an. Im frühen 4. Jahrhundert kannte Eusebius es als verödeten Ort, den die Bewohner der Gegend für heilig hielten, und schrieb, die aus dem Jordan heraufgebrachten Steine würden an der zweiten Meile von Jericho gezeigt."
  fr:
    - "Guilgal fut le premier camp d’Israël à l’ouest du Jourdain, placé par le livre de Josué « à l’extrémité orientale de Jéricho ». Le nom est d’ordinaire compris comme un cercle, peut-être de pierres. Son site n’a pas été trouvé. Les propositions dans la plaine entre Jéricho et le Jourdain comprennent Khirbet el-Mefjir, où la carte le place, et Khirbet en-Nitla, fouillé en 1950 ; ni l’un ni l’autre n’a réglé la question. D’autres lieux de la Bible portent le même nom, et le Guilgal d’où partirent Élie et Élisée est souvent cherché dans les collines près de Béthel."
    - "Ici, selon Josué, le peuple dressa douze pierres prises dans le lit du Jourdain, les hommes nés dans le désert furent circoncis, et l’Éternel dit : « Aujourd’hui, j’ai roulé de dessus vous l’opprobre de l’Égypte » ; la Bible rattache le nom à ce roulement. Israël célébra la Pâque à Guilgal, et la manne cessa. Le camp y demeura pendant la conquête : les Gabaonites y vinrent faire alliance, et Caleb y demanda son héritage à Josué. Josèphe explique le nom comme « liberté »."
    - "Du temps des juges, l’envoyé de l’Éternel monta de Guilgal à Bokim, et Éhud rebroussa chemin « depuis les carrières près de Guilgal » avant de tuer Églon. Samuel faisait chaque année le tour de Béthel, de Guilgal et de Mitspé pour juger Israël. À Guilgal, le peuple établit Saül roi devant l’Éternel ; là, Saül offrit l’holocauste sans attendre Samuel, et là Samuel mit Agag en pièces. Juda se rendit à Guilgal pour ramener David par-delà le Jourdain après la révolte d’Absalom."
    - "Au VIIIe siècle av. J.-C., Osée et Amos condamnèrent les sacrifices de Guilgal : « Toute leur méchanceté se montre à Guilgal ». Le lieu était encore connu à l’époque romaine. Josèphe place le premier camp d’Israël à cinquante stades du Jourdain et à dix de Jéricho. Au début du IVe siècle, Eusèbe le connaissait comme un lieu désert tenu pour sacré par les gens de la région, et écrivit qu’on y montrait, au deuxième mille de Jéricho, les pierres remontées du Jourdain."
  pl:
    - "Gilgal było pierwszym obozem Izraela na zachód od Jordanu, umieszczonym w Księdze Jozuego „ku stronie wschodniej Jerycha”. Nazwę rozumie się zwykle jako krąg, może kamieni. Jego położenia nie odnaleziono. Proponowane miejsca na równinie między Jerychem a Jordanem to Chirbet el-Mefdżir, gdzie umieszcza je mapa, i Chirbet en-Nitla, badana w 1950 r.; żadne nie rozstrzygnęło sprawy. Inne miejsca w Biblii noszą tę samą nazwę, a Gilgal, skąd wyruszyli Eliasz i Elizeusz, szuka się często w górach koło Betel."
    - "Tu, według Księgi Jozuego, lud postawił dwanaście kamieni wziętych z łożyska Jordanu, obrzezano mężczyzn urodzonych na pustyni, a Pan powiedział: „Dzisiajm zdjął pohańbienie Egipskie z was”; Biblia wiąże nazwę z tym zdjęciem. Izrael obchodził w Gilgal Paschę i manna ustała. Obóz pozostał tam w czasie podboju: Gibeonici przyszli doń zawrzeć przymierze, a Kaleb prosił tam Jozuego o swoje dziedzictwo. Józef Flawiusz tłumaczy nazwę jako „wolność”."
    - "W czasach sędziów anioł Pański wyszedł z Gilgal do Bochim, a Ehud zawrócił „do gór kamiennych, które były w Galgal”, zanim zabił Eglona. Samuel objeżdżał Betel, Gilgal i Mispę, aby sądzić Izraela. W Gilgal lud ustanowił Saula królem przed Panem; tam Saul złożył całopalenie, nie czekając na Samuela, i tam Samuel rozsiekał Agaga. Juda przyszedł do Gilgal, aby sprowadzić Dawida z powrotem przez Jordan po buncie Absaloma."
    - "W VIII w. p.n.e. Ozeasz i Amos potępiali ofiary w Gilgal: „Wszystka złość ich jest w Galgal”. Miejsce pamiętano jeszcze w czasach rzymskich. Józef Flawiusz umieszcza pierwszy obóz Izraela pięćdziesiąt stadiów od Jordanu i dziesięć od Jerycha. Na początku IV w. Euzebiusz znał je jako miejsce opuszczone, uważane za święte przez mieszkańców okolicy, i pisał, że kamienie przyniesione z Jordanu pokazywano na drugiej mili od Jerycha."
  it:
    - "Gàlgala fu il primo accampamento d’Israele a ovest del Giordano, posto dal libro di Giosuè «all’estremità orientale di Gerico». Il nome è di solito inteso nel senso di cerchio, forse di pietre. Il suo sito non è stato trovato. Le proposte nella piana fra Gerico e il Giordano comprendono Khirbet el-Mefjir, dove la mappa la colloca, e Khirbet en-Nitla, scavata nel 1950; nessuna ha risolto la questione. Altri luoghi della Bibbia portano lo stesso nome, e la Gàlgala da cui partirono Elia ed Eliseo è spesso cercata sulle colline presso Betel."
    - "Qui, secondo Giosuè, il popolo innalzò dodici pietre prese dal letto del Giordano, gli uomini nati nel deserto furono circoncisi, e il Signore disse: «Oggi vi ho tolto di dosso il vituperio dell’Egitto»; la Bibbia collega il nome a questo togliere via. Israele celebrò la Pasqua a Gàlgala, e la manna cessò. L’accampamento vi rimase durante la conquista: i Gabaoniti vi giunsero per stringere un’alleanza, e Caleb vi chiese a Giosuè la sua eredità. Giuseppe Flavio spiega il nome come «libertà»."
    - "Al tempo dei giudici l’angelo del Signore salì da Gàlgala a Bochim, ed Eud tornò indietro «alla cava di pietre ch’è presso a Ghilgal» prima di uccidere Eglon. Samuele faceva il giro di Betel, Gàlgala e Mizpa per giudicare Israele. A Gàlgala il popolo fece re Saul davanti al Signore; là Saul offrì l’olocausto senza attendere Samuele, e là Samuele squartò Agag. Giuda venne a Gàlgala per riportare Davide al di là del Giordano dopo la rivolta di Assalonne."
    - "Nell’VIII secolo a.C. Osea e Amos condannarono i sacrifici di Gàlgala: «Tutta la loro malvagità è a Ghilgal». Il luogo era ancora ricordato in età romana. Giuseppe Flavio pone il primo accampamento d’Israele a cinquanta stadi dal Giordano e a dieci da Gerico. All’inizio del IV secolo Eusebio la conosceva come un luogo deserto ritenuto sacro dagli abitanti della regione, e scrisse che le pietre portate dal Giordano si mostravano al secondo miglio da Gerico."
  nl:
    - "Gilgal was het eerste kamp van Israël ten westen van de Jordaan, door het boek Jozua gelegd “aan het oosteinde van Jericho”. De naam wordt gewoonlijk opgevat als een kring, misschien van stenen. De plaats is niet gevonden. Voorgesteld zijn in de vlakte tussen Jericho en de Jordaan onder meer Khirbet el-Mefjir, waar de kaart haar plaatst, en Khirbet en-Nitla, in 1950 opgegraven; geen van beide heeft de kwestie beslist. Andere plaatsen in de Bijbel dragen dezelfde naam, en het Gilgal waar Elia en Elisa vertrokken, wordt vaak in de heuvels bij Bethel gezocht."
    - "Hier richtte het volk volgens Jozua twaalf stenen op die uit de bedding van de Jordaan waren genomen, werden de in de woestijn geboren mannen besneden, en zei de HEER: “Heden heb Ik den smaad van Egypte van ulieden afgewenteld”; de Bijbel verbindt de naam met dit afwentelen. Israël hield het pascha te Gilgal, en het manna hield op. Het kamp bleef er tijdens de verovering: de Gibeonieten kwamen er om een verbond te sluiten, en Kaleb vroeg er Jozua om zijn erfdeel. Josephus verklaart de naam als “vrijheid”."
    - "In de tijd van de richters kwam de engel van de HEER op van Gilgal naar Bochim, en Ehud keerde terug “van de gesneden beelden, die bij Gilgal waren” voordat hij Eglon doodde. Samuël trok rond naar Bethel, Gilgal en Mizpa om Israël te richten. Te Gilgal maakte het volk Saul koning voor het aangezicht van de HEER; daar bracht Saul het brandoffer zonder op Samuël te wachten, en daar hieuw Samuël Agag in stukken. Juda kwam naar Gilgal om David na Absaloms opstand over de Jordaan terug te brengen."
    - "In de 8e eeuw v.Chr. veroordeelden Hosea en Amos de offers van Gilgal: “Al hun boosheid is te Gilgal”. De plaats werd in Romeinse tijd nog herinnerd. Josephus legt het eerste kamp van Israël vijftig stadiën voorbij de Jordaan en tien van Jericho. In het begin van de 4e eeuw kende Eusebius het als een verlaten plaats die door de bevolking van de streek heilig werd gehouden, en hij schreef dat de uit de Jordaan opgebrachte stenen bij de tweede mijl van Jericho werden getoond."
  cs:
    - "Gilgal byl první tábor Izraele západně od Jordánu, který Kniha Jozue klade „k straně východní Jericha“. Jméno se obvykle vykládá jako kruh, snad z kamenů. Jeho poloha nebyla nalezena. Návrhy v rovině mezi Jerichem a Jordánem zahrnují Chirbet el-Mefjir, kam jej klade mapa, a Chirbet en-Nitla, vykopávaný roku 1950; ani jedno otázku nevyřešilo. Jiná místa v Bibli nesou stejné jméno a Gilgal, z něhož vyšli Elijáš a Elíša, se často hledá v pahorcích u Bét-elu."
    - "Zde podle Jozueho lid postavil dvanáct kamenů vzatých z koryta Jordánu, muži narození na poušti byli obřezáni a Hospodin řekl: „Dnes jsem odjal pohanění Egyptské od vás“; Bible spojuje jméno s tímto odvalením. Izrael slavil v Gilgalu Hod beránka a mana přestala. Tábor tam zůstal po dobu dobývání: přišli k němu Gibeonští uzavřít spojenectví a Káleb tam žádal Jozueho o své dědictví. Josephus vykládá jméno jako „svoboda“."
    - "V době soudců vystoupil anděl Hospodinův z Gilgalu do Bochim a Ehúd se obrátil „od lomů blízko Galgala“, než zabil Eglona. Samuel obcházel Bét-el, Gilgal a Micpu, aby soudil Izraele. V Gilgalu lid ustanovil Saula králem před Hospodinem; tam Saul obětoval zápalnou oběť, aniž čekal na Samuela, a tam Samuel rozsekal Agaga na kusy. Juda přišel do Gilgalu, aby přivedl Davida zpět přes Jordán po Abšalomově vzpouře."
    - "V 8. stol. př. n. l. Ozeáš a Amos odsuzovali oběti Gilgalu: „Vrch zlosti jejich jest v Galgala“. Místo bylo v římské době ještě připomínáno. Josephus klade první tábor Izraele padesát stadií od Jordánu a deset od Jericha. Na počátku 4. století Eusebios znal jej jako opuštěné místo, které lid kraje pokládal za svaté, a napsal, že kameny vynesené z Jordánu se ukazovaly ve druhé míli od Jericha."
