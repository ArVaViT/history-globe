# Overview article (ADR 0007). Jeshanah north of Bethel: Ain Sinia (Clermont-Ganneau, ISBE) and Burj el-Isaneh (OpenBible; the map's point) are named; the reading Jeshanah for "Shen" in 1 Sam 7:12 is given as the ISBE reports it; the link with Josephus' Isanas follows the ISBE.
