body:
  en:
    - "Jeshanah was a town of the southern hills of Ephraim, on the border between Judah and Israel. After his victory over Jeroboam, Abijah of Judah “took cities from him, Beth-el with the towns thereof, and Jeshanah with the towns thereof, and Ephrain with the towns thereof.” The International Standard Bible Encyclopedia noted that most scholars also read Jeshanah for the obscure “Shen” of 1 Samuel 7:12, where Samuel set up the stone Ebenezer “between Mizpeh and Shen”. Charles Clermont-Ganneau identified it with the spring and ruins of Ain Sinia, about 5 km north of Bethel; the map follows the nearby ruin of Burj el-Isaneh, which keeps the name."
    - "Josephus calls a village in the same region Isanas, probably the same place. There, in the winter of 38/37 BC, Herod defeated Pappus, the general of the Hasmonean king Antigonus; Herod's men pursued the enemy into the houses, pulled down the roofs and stoned those crowded below, and Josephus says that no sight in the whole war was more terrible than the heaps of the dead. Both proposed sites lie today in the West Bank."
  ru:
    - "Иешана — город южных гор Ефрема, на границе между Иудеей и Израилем. После победы над Иеровоамом Авия Иудейский «взял у него города: Вефиль и зависящие от него города, и Иешану и зависящие от нее города, и Ефрон и зависящие от него города». Международная стандартная библейская энциклопедия отмечала, что большинство учёных читают Иешана и вместо неясного «Сен» в 1 Цар 7:12, где Самуил поставил камень Авен-Езер «между Массифою и между Сеном». Шарль Клермон-Ганно отождествил её с источником и развалинами Айн-Синья примерно в 5 км к северу от Вефиля; карта следует соседним развалинам Бурдж-эль-Исане, сохраняющим имя."
    - "Иосиф Флавий называет селение в той же местности Исанас — вероятно, то же место. Там зимой 38/37 г. до н. э. Ирод разбил Паппа, военачальника хасмонейского царя Антигона; воины Ирода преследовали врагов в домах, разбирали крыши и забрасывали камнями тех, кто теснился внизу, и Иосиф пишет, что во всей войне не было зрелища страшнее, чем груды мёртвых. Оба предполагаемых места находятся сегодня на Западном берегу."
  uk:
    - "Єшана була містом південних гір Єфрема, на межі між Юдою та Ізраїлем. Після перемоги над Єровоамом Авія Юдейський «забрав у його міста: Бетель із залежнїми від його містами, й Ешану та залежні від неї міста, й Ефрон із залежнїми від його містами». International Standard Bible Encyclopedia зазначила, що більшість учених читають Єшану й там, де в 1 Самуїла 7:12 стоїть незрозумілий «Сен»; Самуїл, за цією книгою, «взяв величезного каменя та й поставив його між Массифою і Сеном, і назвав його Авен-Езер». Шарль Клермон-Ганно ототожнив її з джерелом і руїнами Айн-Сінья, приблизно за 5 км на північ від Бет-Ела; мапа йде за сусідньою руїною Бурдж-ель-Ісане, що зберігає назву."
    - "Йосиф Флавій називає село в тому самому краї Ісанас, імовірно, те саме місце. Там узимку 38/37 р. до н. е. Ірод розбив Паппа, полководця хасмонейського царя Антігона; люди Ірода гнали ворога в будинки, зривали дахи й закидали камінням тих, хто скупчився внизу, і Йосиф Флавій каже, що за всю війну не було видовища страшнішого за купи мертвих. Обидва запропоновані місця лежать нині на Західному березі."
  es:
    - "Jesana era una ciudad de las colinas meridionales de Efraín, en la frontera entre Judá e Israel. Tras su victoria sobre Jeroboam, Abías de Judá «tomóle algunas ciudades, á Beth-el con sus aldeas, á Jesana con sus aldeas, y á Ephraim con sus aldeas». La International Standard Bible Encyclopedia observó que la mayoría de los estudiosos leen también Jesana en el oscuro «Sen» de 1 Samuel 7:12, donde Samuel levantó la piedra Ebenezer «entre Mizpa y Sen». Charles Clermont-Ganneau la identificó con el manantial y las ruinas de Ain Sinia, a unos 5 km al norte de Betel; el mapa sigue la cercana ruina de Burj el-Isaneh, que conserva el nombre."
    - "Josefo llama Isanas a una aldea de la misma región, probablemente el mismo lugar. Allí, en el invierno de 38/37 a. C., Herodes derrotó a Papo, general del rey asmoneo Antígono; los hombres de Herodes persiguieron al enemigo hasta las casas, derribaron los techos y apedrearon a los que se apiñaban debajo, y Josefo dice que ningún espectáculo de toda la guerra fue más terrible que los montones de muertos. Ambos lugares propuestos se hallan hoy en Cisjordania."
  pt:
    - "Jesana era uma cidade das colinas meridionais de Efraim, na fronteira entre Judá e Israel. Depois de sua vitória sobre Jeroboão, Abias de Judá o perseguiu e “tomou-lhe cidades: Betel com as suas aldeias, Jesana com as suas aldeias, e Efrom com as suas aldeias”. A International Standard Bible Encyclopedia observou que a maioria dos estudiosos lê também Jesana no obscuro “Sem” de 1 Samuel 7:12, onde Samuel colocou a pedra Ebenézer “entre Mispá e Sem”. Charles Clermont-Ganneau a identificou com a fonte e as ruínas de Ain Sinia, cerca de 5 km ao norte de Betel; o mapa segue a vizinha ruína de Burj el-Isaneh, que conserva o nome."
    - "Josefo chama de Isanas uma aldeia da mesma região, provavelmente o mesmo lugar. Ali, no inverno de 38/37 a.C., Herodes derrotou Pappus, general do rei hasmoneu Antígono; os homens de Herodes perseguiram o inimigo até as casas, derrubaram os tetos e apedrejaram os que estavam amontoados embaixo, e Josefo diz que nenhum espetáculo de toda a guerra foi mais terrível que os montes de mortos. Ambos os sítios propostos ficam hoje na Cisjordânia."
  de:
    - "Jeschana war eine Stadt der südlichen Hügel Ephraims, an der Grenze zwischen Juda und Israel. Nach seinem Sieg über Jerobeam gewann Abija von Juda ihm Städte ab: „Beth-El mit seinen Ortschaften, Jesana mit seinen Ortschaften und Ephron mit seinen Ortschaften“. Die International Standard Bible Encyclopedia vermerkte, dass die meisten Gelehrten Jeschana auch für das dunkle Sen von 1. Samuel 7,12 lesen, wo Samuel den Stein Eben-Ezer „zwischen Mizpa und Sen“ aufstellte. Charles Clermont-Ganneau setzte es mit der Quelle und den Ruinen von Ain Sinia gleich, etwa 5 km nördlich von Bethel; die Karte folgt der nahen Ruine Burdsch el-Isane, die den Namen bewahrt."
    - "Josephus nennt ein Dorf in derselben Gegend Isanas, wahrscheinlich denselben Ort. Dort besiegte Herodes im Winter 38/37 v. Chr. Pappus, den Feldherrn des hasmonäischen Königs Antigonos; Herodes' Männer verfolgten den Feind in die Häuser, rissen die Dächer ein und steinigten die unten Zusammengedrängten, und kein Anblick im ganzen Krieg, sagt Josephus, sei schrecklicher gewesen als die Haufen der Toten. Beide vorgeschlagenen Stätten liegen heute im Westjordanland."
  fr:
    - "Jeschana était une ville des collines méridionales d’Éphraïm, à la frontière entre Juda et Israël. Après sa victoire sur Jéroboam, Abija de Juda « lui prit des villes, Béthel et les villes de son ressort, Jeschana et les villes de son ressort, et Éphron et les villes de son ressort. » L’International Standard Bible Encyclopedia notait que la plupart des savants lisent aussi Jeschana pour l’obscur « Schen » de 1 Samuel 7:12, où Samuel plaça la pierre d’Ében-Ézer « entre Mitspa et Schen ». Charles Clermont-Ganneau l’identifia avec la source et les ruines d’Aïn Sinia, à environ 5 km au nord de Béthel ; la carte suit la ruine voisine de Burj el-Isaneh, qui garde le nom."
    - "Josèphe appelle Isanas un village de la même région, probablement le même lieu. C’est là qu’à l’hiver 38/37 av. J.-C. Hérode battit Pappus, général du roi hasmonéen Antigone ; les hommes d’Hérode poursuivirent l’ennemi jusque dans les maisons, abattirent les toits et lapidèrent ceux qui s’y entassaient, et Josèphe dit qu’aucun spectacle de toute la guerre ne fut plus terrible que les tas de morts. Les deux sites proposés se trouvent aujourd’hui en Cisjordanie."
  it:
    - "Iesana era una città delle colline meridionali di Efraim, al confine tra Giuda e Israele. Dopo la sua vittoria su Geroboamo, Abia di Giuda «gli prese delle città: Bethel e le città che ne dipendevano, Jeshana e le città che ne dipendevano, Efraim e le città che ne dipendevano». La International Standard Bible Encyclopedia osservava che la maggior parte degli studiosi legge Iesana anche al posto dell’oscuro «Scen» di 1 Samuele 7,12, dove Samuele eresse la pietra Eben-Ezer «tra Mitspa e Scen». Charles Clermont-Ganneau la identificò con la sorgente e le rovine di Ain Sinia, a circa 5 km a nord di Betel; la carta segue la vicina rovina di Burj el-Isaneh, che ne conserva il nome."
    - "Giuseppe Flavio chiama Isanas un villaggio della stessa regione, probabilmente lo stesso luogo. Là, nell’inverno del 38/37 a.C., Erode sconfisse Pappo, generale del re asmoneo Antigono; gli uomini di Erode inseguirono il nemico nelle case, abbatterono i tetti e lapidarono chi vi era ammassato sotto, e Giuseppe dice che nessuno spettacolo di tutta la guerra fu più terribile dei mucchi di morti. Entrambi i siti proposti si trovano oggi in Cisgiordania."
  nl:
    - "Jesana was een stad in de zuidelijke heuvels van Efraïm, op de grens tussen Juda en Israël. Na zijn overwinning op Jerobeam nam Abia “van hem de steden, Beth-El met haar onderhorige plaatsen, en Jesana met haar onderhorige plaatsen, en Efron met haar onderhorige plaatsen.” De International Standard Bible Encyclopedia merkte op dat de meeste geleerden Jesana ook lezen voor het duistere “Sen” van 1 Samuël 7:12, waar Samuël de steen Eben-Haëzer oprichtte “tussen Mizpa en tussen Sen”. Charles Clermont-Ganneau vereenzelvigde het met de bron en ruïnes van Ain Sinia, ongeveer 5 km ten noorden van Bethel; de kaart volgt de nabije ruïne Burj el-Isaneh, die de naam bewaart."
    - "Josephus noemt een dorp in dezelfde streek Isanas, waarschijnlijk dezelfde plaats. Daar versloeg Herodes in de winter van 38/37 v.Chr. Pappus, de veldheer van de Hasmonese koning Antigonus; Herodes' mannen achtervolgden de vijand tot in de huizen, braken de daken af en stenigden hen die daaronder opeengepakt zaten, en Josephus zegt dat geen aanblik in de hele oorlog verschrikkelijker was dan de hopen doden. Beide voorgestelde plaatsen liggen tegenwoordig op de Westelijke Jordaanoever."
  pl:
    - "Jeszana było miastem południowych wzgórz Efraima, na granicy między Judą a Izraelem. Po zwycięstwie nad Jeroboamem Abiasz z Judy, jak czytamy, „odjął mu miasta Betel i wsi jego, i Jesana i wsi jego, i Efron i wsi jego”. International Standard Bible Encyclopedia zauważyła, że większość uczonych czyta Jeszana także w niejasnym „Szen” z 1 Sm 7,12, gdzie Samuel postawił kamień Eben-Ezer „między Masfa a między Sen”. Charles Clermont-Ganneau utożsamił je ze źródłem i ruinami Ajn Sinija, około 5 km na północ od Betel; mapa idzie za pobliską ruiną Burdż al-Isane, która zachowuje nazwę."
    - "Józef Flawiusz nazywa wieś w tym samym regionie Isanas, prawdopodobnie to samo miejsce. Tam zimą 38/37 p.n.e. Herod pokonał Pappusa, wodza hasmonejskiego króla Antygonosa; ludzie Heroda ścigali wroga do domów, zrywali dachy i kamienowali stłoczonych poniżej, a Józef Flawiusz mówi, że w całej wojnie nie było straszniejszego widoku niż stosy zabitych. Oba proponowane stanowiska leżą dziś na Zachodnim Brzegu."
  cs:
    - "Ješana bylo město jižních efrajimských hor, na hranici mezi Judskem a Izraelem. Po svém vítězství nad Jarobeámem „vzal mu města, Bethel i vsi jeho, Jesana i vsi jeho, a Efron i vsi jeho“ judský Abija. International Standard Bible Encyclopedia poznamenala, že většina badatelů čte Ješanu také za nejasné „Sen“ z 1 Sam 7,12, kde Samuel postavil kámen Eben-ezer „mezi Masfa a mezi Sen“. Charles Clermont-Ganneau ji ztotožnil s pramenem a zříceninou Ajn Sinja, asi 5 km severně od Bét-elu; mapa sleduje blízkou zříceninu Burdž el-Isána, která jméno zachovala."
    - "Josephus Flavius nazývá vesnici v téže oblasti Isanas, pravděpodobně totéž místo. Tam Herodes v zimě 38/37 př. n. l. porazil Pappa, vojevůdce hasmonejského krále Antigona; Herodovi muži pronásledovali nepřítele do domů, strhávali střechy a kamenovali ty, kdo se dole tísnili, a Josephus říká, že v celé válce nebylo hrůznějšího pohledu než hromady mrtvých. Obě navrhovaná místa leží dnes na Západním břehu."
  sv:
    - "Jeshana var en stad i södra Efraims berg, på gränsen mellan Juda och Israel. Efter sin seger över Jerobeam ”tog” Avia av Juda ”ifrån honom några städer: Betel med underlydande orter, Jesana med underlydande orter och Efron med underlydande orter”. International Standard Bible Encyclopedia noterade att de flesta forskare också läser Jeshana för det obskyra ”Sen” i Första Samuelsboken 7:12, där Samuel reste stenen Even-Haeser ”mellan Mispa och Sen”. Charles Clermont-Ganneau identifierade den med källan och ruinerna i Ain Sinia, omkring 5 km norr om Betel; kartan följer den närbelägna ruinen Burj el-Isaneh, som bevarar namnet."
    - "Josefus kallar en by i samma trakt Isanas, sannolikt samma plats. Där besegrade Herodes vintern 38/37 f.Kr. Pappus, den hasmoneiske kungen Antigonos general; Herodes män förföljde fienden in i husen, rev ned taken och stenade de som trängdes därunder, och Josefus säger att ingen syn under hela kriget var förskräckligare än högarna av döda. Båda föreslagna platserna ligger i dag på Västbanken."
  nb:
    - "Jesjana var en by i de sørlige åsene i Efraim, på grensen mellom Juda og Israel. Etter sin seier over Jeroboam «tok» Abia av Juda «fra ham byene Betel med tilhørende småbyer og Jesana med tilhørende småbyer og Efron med tilhørende småbyer». International Standard Bible Encyclopedia bemerket at de fleste forskere også leser Jesjana for det obskure «Sen» i Første Samuelsbok 7,12, der Samuel satte opp steinen Eben-Eser «imellem Mispa og Sen». Charles Clermont-Ganneau identifiserte den med kilden og ruinene i Ain Sinia, omtrent 5 km nord for Betel; kartet følger den nærliggende ruinen Burj el-Isaneh, som bevarer navnet."
    - "Josefus kaller en landsby i samme område Isanas, trolig det samme stedet. Der beseiret Herodes vinteren 38/37 f.Kr. Pappos, generalen til den hasmoneiske kongen Antigonos; Herodes' menn forfulgte fienden inn i husene, rev ned takene og steinet dem som sto trengt nedenfor, og Josefus sier at intet syn i hele krigen var mer skrekkelig enn haugene av døde. Begge de foreslåtte stedene ligger i dag på Vestbredden."
  tl:
    - "Ang Jesana ay isang bayan sa timog na burol ng Ephraim, sa hangganan ng Juda at Israel. Pagkatapos ng tagumpay ni Abias ng Juda laban kay Jeroboam, “hinabol ni Abias si Jeroboam, at inagawan siya ng mga bayan, ang Beth-el pati ng mga nayon niyaon, at ang Jesana pati ng mga nayon niyaon at ang Ephron pati ng mga nayon niyaon.” Itinala ng International Standard Bible Encyclopedia na binabasa rin ng karamihan sa mga iskolar ang Jesana para sa malabong “Sen” ng 1 Samuel 7:12, kung saan itinayo ni Samuel ang batong Ebenezer “sa pagitan ng Mizpa at ng Sen”. Kinilala ito ni Charles Clermont-Ganneau sa bukal at mga guho ng Ain Sinia, mga 5 km sa hilaga ng Beth-el; sinusunod ng mapa ang kalapit na guho ng Burj el-Isaneh, na nagpapanatili ng pangalan."
    - "Tinatawag ni Josephus na Isanas ang isang nayon sa parehong rehiyon, marahil ang parehong lugar. Doon, sa taglamig ng 38/37 BK, tinalo ni Herodes si Pappus, ang heneral ng haring Hasmoneo na si Antigonus; hinabol ng mga tauhan ni Herodes ang kaaway sa mga bahay, ibinagsak ang mga bubong at binato ang mga siksikang nasa ibaba, at sinasabi ni Josephus na walang tanawin sa buong digmaan na mas kakila-kilabot kaysa sa mga bunton ng patay. Ang parehong iminungkahing lugar ay nasa West Bank ngayon."
  da:
    - "Jesjana var en by i Efraims sydlige bjerge, på grænsen mellem Juda og Israel. Efter sin sejr over Jeroboam forfulgte Abija af Juda ham og »tog Stæder fra ham, nemlig Bethel med dens tilhørende Byer og Jesana med dens tilhørende Byer og Efron med dens tilhørende Byer«. International Standard Bible Encyclopedia bemærkede, at de fleste forskere også læser Jesjana for det obskure »Sjen« i 1 Sam 7,12, hvor Samuel satte stenen Eben-Ezer op »imellem Mizpa og imellem Sen«. Charles Clermont-Ganneau identificerede den med kilden og ruinerne ved Ain Sinia, omkring 5 km nord for Betel; kortet følger den nærliggende ruin Burj el-Isaneh, som bevarer navnet."
    - "Josefus kalder en landsby i samme egn Isanas, sandsynligvis samme sted. Der besejrede Herodes i vinteren 38/37 f.Kr. Pappus, general for den hasmonæiske konge Antigonos; Herodes' mænd forfulgte fjenden ind i husene, rev tagene ned og stenede dem, der trængtes under dem, og Josefus siger, at intet syn i hele krigen var mere forfærdeligt end dyngerne af døde. Begge foreslåede steder ligger i dag på Vestbredden."
  sr:
    - "Јесана је била град јужних Јефремових брда, на граници између Јуде и Израиља. После победе над Јеровоамом, Авија Јудин „узе му градове Ветиљ и села његова, и Јесану и села њена, и Ефрон и села његова“. Међународна стандардна библијска енциклопедија забележила је да већина научника Јесану чита и за нејасни „Сен“ из 1. Сам 7,12, где је Самуило подигао камен Евен-Езер „између Миспе и Сена“. Шарл Клермон-Гано поистоветио ју је са извором и рушевинама Аин Синије, око 5 км северно од Ветиља; карта следи оближњу рушевину Бурџ ел-Исана, која чува име."
    - "Јосиф Флавије назива село у истом крају Исана, вероватно исто место. Тамо је, у зиму 38/37. п. н. е., Ирод победио Папу, војсковођу хасмонејског цара Антигона; Иродови људи гонили су непријатеља у куће, срушили кровове и каменовали оне који су се тискали испод, а Јосиф Флавије каже да у целом рату није било страшнијег призора од гомила мртвих. Оба предложена налазишта данас леже на Западној обали."
  hu:
    - "Jesána Efraim déli hegyeinek városa volt, Júda és Izráel határán. Jeroboám fölött aratott győzelme után Abija, Júda királya „elfoglala ő tőle egynéhány várost, Béthelt és annak faluit, Jésanát és annak faluit, s Efrávint és annak faluit.” A Nemzetközi Szabványos Bibliai Enciklopédia megjegyezte, hogy a legtöbb kutató Jesánát olvassa az 1Sám 7,12 homályos „Sén” helyén is, ahol Sámuel felállította az Ebenézer kövét „Mispa és Sén között”. Charles Clermont-Ganneau az Ain Szinija forrásával és romjaival azonosította, Bételtől mintegy 5 km-re északra; a térkép a közeli Burdzs el-Iszánét követi, amely megőrzi a nevet."
    - "Josephus az ugyanazon vidéken lévő falut Isanasnak nevezi, valószínűleg ugyanezt a helyet. Ott győzte le Heródes Kr. e. 38/37 telén Pappust, Antigonosz hasmóneus király hadvezérét; Heródes emberei az ellenséget házakig üldözték, lebontották a tetőket, és megkövezték az alattuk összezsúfolódottakat, és Josephus szerint a háború egész ideje alatt semmi sem volt szörnyűbb látvány a halottak halmainál. Mindkét javasolt hely ma Ciszjordániában fekszik."
  fi:
    - "Jesana oli kaupunki Efraimin eteläisillä kukkuloilla, Juudan ja Israelin rajalla. Voitettuaan Jerobeamin Juudan Abia ”valloitti häneltä muutamia kaupunkeja: Beetelin ja sen tytärkaupungit, Jesanan ja sen tytärkaupungit ja Efronin ja sen tytärkaupungit”. International Standard Bible Encyclopedia huomautti, että useimmat tutkijat lukevat Jesanan myös Ensimmäisen Samuelin kirjan 7:12 hämäräksi jäävän ”Senin” tilalle, jossa Samuel pystytti Eben-Eser-kiven ”Mispan ja Seenin välille”. Charles Clermont-Ganneau tunnisti sen Ain Sinian lähteeksi ja raunioiksi noin 5 km Betelistä pohjoiseen; kartta seuraa läheistä Burj el-Isanehin rauniota, joka säilyttää nimen."
    - "Josephus kutsuu samalla seudulla olevaa kylää nimellä Isanas, luultavasti samaksi paikaksi. Siellä talvella 38/37 eaa. Herodes voitti Pappuksen, hasmonealaisen kuningas Antigonoksen kenraalin; Herodeksen miehet ajoivat vihollista takaa taloihin, purkivat katot ja kivittivät alla ahtautuneita, ja Josephus sanoo, ettei koko sodassa ollut kauheampaa näkyä kuin kuolleiden kasat. Molemmat ehdotetut paikat sijaitsevat nykyään Länsirannalla."
  vi:
    - "Giê-sa-na là một thành ở các đồi phía nam Ép-ra-im, trên ranh giới giữa Giu-đa và Y-sơ-ra-ên. Sau chiến thắng Giê-rô-bô-am, A-bi-gia của Giu-đa “chiếm lấy những thành, là Bê-tên và các hương thôn nó; Giê-sa-na và các hương thôn nó; Ép-rôn và các hương thôn nó”. International Standard Bible Encyclopedia ghi rằng phần lớn học giả cũng đọc Giê-sa-na thay cho “Sen” mơ hồ trong 1 Sa-mu-ên 7:12, nơi Sa-mu-ên dựng hòn đá Ê-bên-Ê-xe “giữa khoảng Mích-ba và Sen”. Charles Clermont-Ganneau đồng nhất nó với suối và phế tích Ain Sinia, cách Bê-tên khoảng 5 km về phía bắc; bản đồ theo phế tích Burj el-Isaneh gần đó, vẫn giữ tên."
    - "Josephus gọi một làng trong cùng vùng là Isanas, có lẽ là cùng nơi. Tại đó, vào mùa đông năm 38/37 TCN, Hê-rốt đánh bại Pappus, tướng của vua Hasmonean Antigonus; người của Hê-rốt đuổi kẻ thù vào các nhà, phá mái và ném đá những người chen chúc bên dưới, và Josephus nói rằng không cảnh nào trong cả cuộc chiến khủng khiếp hơn những đống xác chết. Cả hai địa điểm đề nghị ngày nay nằm ở Bờ Tây."
  ro:
    - "Ieșana era un oraș din dealurile sudice ale lui Efraim, la hotarul dintre Iuda și Israel. După victoria asupra lui Ieroboam, Abia al lui Iuda „a luat dela el cetățile acestea: Vetilul și satele lui, Iesinà și satele ei și Efronul și satele lui”. International Standard Bible Encyclopedia nota că cei mai mulți cercetători citesc Ieșana și pentru obscurul Șen din 1 Samuel 7:12, unde Samuel a ridicat piatra Eben-Ezer „între Masifat și între Senon”. Charles Clermont-Ganneau l-a identificat cu izvorul și ruinele de la Ain Sinia, la circa 5 km spre nord de Betel; harta urmează ruina din apropiere Burj el-Isaneh, care păstrează numele."
    - "Iosif Flaviu numește Isanas un sat din aceeași regiune, probabil același loc. Acolo, în iarna anului 38/37 î.Hr., Irod l-a învins pe Pappus, generalul regelui hasmoneu Antigonus; oamenii lui Irod au urmărit dușmanul în case, au dărâmat acoperișurile și i-au omorât cu pietre pe cei înghesuiți dedesubt, iar Iosif Flaviu spune că nicio priveliște din tot războiul nu a fost mai îngrozitoare decât grămezile de morți. Ambele locuri propuse se află astăzi în Cisiordania."
  bg:
    - "Йешана беше град в южните Ефремови хълмове, на границата между Юда и Израил. След победата си над Йеровоам Авия Юдейски „взе от него градове, Ветил и селата му, и Иесана и селата ѝ, и Ефрон и селата му“. The International Standard Bible Encyclopedia отбелязва, че повечето учени четат Йешана и вместо неясното „Сен“ в 1 Царе 7:12, където Самуил постави камъка Авен-Езер „между Масфа и Сен“. Шарл Клермон-Гано го отъждестви с извора и развалините на Айн Синия, на около 5 км северно от Ветил; картата следва близката развалина Бурдж ел-Исане, която пази името."
    - "Йосиф Флавий нарича едно село в същата област Исанас, вероятно същото място. Там през зимата на 38/37 г. пр.н.е. Ирод разби Пап, пълководеца на хасмонейския цар Антигон; хората на Ирод преследваха врага в къщите, събаряха покривите и убиваха с камъни струпаните отдолу, а Йосиф Флавий казва, че в цялата война нямало по-страшна гледка от купищата мъртви. И двете предложени места днес лежат на Западния бряг."
