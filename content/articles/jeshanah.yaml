body:
  en:
    - "Jeshanah was a town of the southern hills of Ephraim, on the border between Judah and Israel. After his victory over Jeroboam, Abijah of Judah “took cities from him, Beth-el with the towns thereof, and Jeshanah with the towns thereof, and Ephrain with the towns thereof.” The International Standard Bible Encyclopedia noted that most scholars also read Jeshanah for the obscure “Shen” of 1 Samuel 7:12, where Samuel set up the stone Ebenezer “between Mizpeh and Shen”. Charles Clermont-Ganneau identified it with the spring and ruins of Ain Sinia, about 5 km north of Bethel; the map follows the nearby hilltop ruin of Burj el-Isaneh, whose name some scholars take to preserve Josephus' Isanas."
    - "Josephus calls a village in the same region Isanas, probably the same place. There, in the winter of 38/37 BC, Herod defeated Pappus, the general of the Hasmonean king Antigonus; Herod's men pursued the enemy into the houses, pulled down the roofs and stoned those crowded below, and Josephus says that no sight in the whole war was more terrible than the heaps of the dead. Both proposed sites lie today in the West Bank."
    - "The name means “old”. That helps to explain the reading in 1 Samuel 7:12: where the Hebrew has Shen, the Greek Septuagint sets Samuel's stone between Mizpah and “the old one”, and the International Standard Bible Encyclopedia judged that its translators read the Hebrew word for old, which points back to Jeshanah. The Survey of Western Palestine described Ain Sinia as a village of evident antiquity in a valley of olive and fig terraces, with a good spring and some houses of very good masonry, commanding one of the ancient main roads to Jerusalem. Its party found a tomb with a Hebrew inscription there in 1872, and the surveyors judged that the name and position pointed to Jeshanah."
    - "The Survey of Western Palestine recorded the hilltop ruin as Burj el Lisaneh, “the tower of the tongue”, a name it took from the spur the ruin occupies. It found there the walls of a tower it judged to be of Crusader origin, built partly of older drafted stones, and the remains of a colonnaded building that was probably a church."
  ru:
    - "Иешана — город южных гор Ефрема, на границе между Иудеей и Израилем. После победы над Иеровоамом Авия Иудейский «взял у него города: Вефиль и зависящие от него города, и Иешану и зависящие от нее города, и Ефрон и зависящие от него города». Международная стандартная библейская энциклопедия отмечала, что большинство учёных читают Иешана и вместо неясного «Сен» в 1 Цар 7:12, где Самуил поставил камень Авен-Езер «между Массифою и между Сеном». Шарль Клермон-Ганно отождествил её с источником и развалинами Айн-Синья примерно в 5 км к северу от Вефиля; карта следует соседним развалинам на холме Бурдж-эль-Исане, в названии которых некоторые учёные видят Исанас Иосифа Флавия."
    - "Иосиф Флавий называет селение в той же местности Исанас — вероятно, то же место. Там зимой 38/37 г. до н. э. Ирод разбил Паппа, военачальника хасмонейского царя Антигона; воины Ирода преследовали врагов в домах, разбирали крыши и забрасывали камнями тех, кто теснился внизу, и Иосиф пишет, что во всей войне не было зрелища страшнее, чем груды мёртвых. Оба предполагаемых места находятся сегодня на Западном берегу."
    - "Имя значит «старая». Это помогает объяснить чтение в 1 Цар 7:12: там, где в еврейском тексте стоит Сен, греческая Септуагинта ставит камень Самуила между Массифой и «старой», и Международная стандартная библейская энциклопедия полагала, что переводчики прочли еврейское слово «старый», а оно указывает на Иешану. «Обзор Западной Палестины» описал Айн-Синью как селение явной древности в долине среди террас с маслинами и смоковницами, с хорошим источником и несколькими домами очень добротной кладки, господствующее над одной из древних главных дорог к Иерусалиму. Его отряд нашёл там в 1872 году гробницу с еврейской надписью, и исследователи сочли, что имя и положение места указывают на Иешану."
    - "«Обзор Западной Палестины» записал развалины на холме как Бурдж-эль-Лисане, «башня языка», взяв это название от отрога, который они занимают. Там были найдены стены башни, которую исследователи сочли постройкой крестоносцев, сложенной отчасти из более древних камней с обтёсанными краями, и остатки здания с колоннадой, вероятно церкви."
  uk:
    - "Єшана була містом південних гір Єфрема, на межі між Юдою та Ізраїлем. Після перемоги над Єровоамом Авія Юдейський «забрав у його міста: Бетель із залежнїми від його містами, й Ешану та залежні від неї міста, й Ефрон із залежнїми від його містами». International Standard Bible Encyclopedia зазначила, що більшість учених читають Єшану й там, де в 1 Самуїла 7:12 стоїть незрозумілий «Сен»; Самуїл, за цією книгою, «взяв величезного каменя та й поставив його між Массифою і Сеном, і назвав його Авен-Езер». Шарль Клермон-Ганно ототожнив її з джерелом і руїнами Айн-Сінья, приблизно за 5 км на північ від Бет-Ела; мапа йде за сусідньою руїною на пагорбі Бурдж-ель-Ісане, у назві якої деякі вчені бачать Ісанас Йосифа Флавія."
    - "Йосиф Флавій називає село в тому самому краї Ісанас, імовірно, те саме місце. Там узимку 38/37 р. до н. е. Ірод розбив Паппа, полководця хасмонейського царя Антігона; люди Ірода гнали ворога в будинки, зривали дахи й закидали камінням тих, хто скупчився внизу, і Йосиф Флавій каже, що за всю війну не було видовища страшнішого за купи мертвих. Обидва запропоновані місця лежать нині на Західному березі."
    - "Назва означає «стара». Це допомагає пояснити читання в 1 Самуїла 7:12: там, де в єврейському тексті стоїть Сен, грецька Септуагінта ставить камінь Самуїла між Массифою і «старою», і International Standard Bible Encyclopedia вважала, що перекладачі прочитали єврейське слово «старий», яке вказує на Єшану. «Survey of Western Palestine» описав Айн-Сінью як село явної давнини в долині серед терас з оливками й смоковницями, з добрим джерелом і кількома будинками дуже доброї кладки, що панує над однією з давніх головних доріг до Єрусалима. Його загін знайшов там 1872 року гробницю з єврейським написом, і дослідники визнали, що назва й положення вказують на Єшану."
    - "«Survey of Western Palestine» записав руїну на пагорбі як Бурдж-ель-Лісане, «вежа язика», узявши цю назву від відрогу, який займає руїна. Там знайшли стіни вежі, яку дослідники вважали спорудою хрестоносців, складеної частково з давніших каменів з обтесаними краями, і рештки будівлі з колонадою, імовірно церкви."
  es:
    - "Jesana era una ciudad de las colinas meridionales de Efraín, en la frontera entre Judá e Israel. Tras su victoria sobre Jeroboam, Abías de Judá «tomóle algunas ciudades, á Beth-el con sus aldeas, á Jesana con sus aldeas, y á Ephraim con sus aldeas». La International Standard Bible Encyclopedia observó que la mayoría de los estudiosos leen también Jesana en el oscuro «Sen» de 1 Samuel 7:12, donde Samuel levantó la piedra Ebenezer «entre Mizpa y Sen». Charles Clermont-Ganneau la identificó con el manantial y las ruinas de Ain Sinia, a unos 5 km al norte de Betel; el mapa sigue la cercana ruina de Burj el-Isaneh, en lo alto de una colina, cuyo nombre, según algunos estudiosos, conserva el Isanas de Josefo."
    - "Josefo llama Isanas a una aldea de la misma región, probablemente el mismo lugar. Allí, en el invierno de 38/37 a. C., Herodes derrotó a Papo, general del rey asmoneo Antígono; los hombres de Herodes persiguieron al enemigo hasta las casas, derribaron los techos y apedrearon a los que se apiñaban debajo, y Josefo dice que ningún espectáculo de toda la guerra fue más terrible que los montones de muertos. Ambos lugares propuestos se hallan hoy en Cisjordania."
    - "El nombre significa «vieja». Eso ayuda a explicar la lectura de 1 Samuel 7:12: donde el hebreo tiene Sen, la Septuaginta griega coloca la piedra de Samuel entre Mizpa y «la vieja», y la International Standard Bible Encyclopedia juzgó que sus traductores leyeron la palabra hebrea para viejo, que remite a Jesana. El Survey of Western Palestine describió Ain Sinia como una aldea de evidente antigüedad en un valle de terrazas de olivos e higueras, con un buen manantial y algunas casas de muy buena mampostería, que domina uno de los antiguos caminos principales hacia Jerusalén. Su equipo halló allí en 1872 una tumba con una inscripción hebrea, y los topógrafos juzgaron que el nombre y la posición apuntaban a Jesana."
    - "El Survey of Western Palestine registró la ruina de la colina como Burj el Lisaneh, «la torre de la lengua», nombre que tomó del espolón que ocupa la ruina. Halló allí los muros de una torre que juzgó de origen cruzado, construida en parte con piedras más antiguas de borde labrado, y los restos de un edificio con columnata que probablemente fue una iglesia."
  pt:
    - "Jesana era uma cidade das colinas meridionais de Efraim, na fronteira entre Judá e Israel. Depois de sua vitória sobre Jeroboão, Abias de Judá o perseguiu e “tomou-lhe cidades: Betel com as suas aldeias, Jesana com as suas aldeias, e Efrom com as suas aldeias”. A International Standard Bible Encyclopedia observou que a maioria dos estudiosos lê também Jesana no obscuro “Sem” de 1 Samuel 7:12, onde Samuel colocou a pedra Ebenézer “entre Mispá e Sem”. Charles Clermont-Ganneau a identificou com a fonte e as ruínas de Ain Sinia, cerca de 5 km ao norte de Betel; o mapa segue a vizinha ruína de Burj el-Isaneh, no alto de uma colina, cujo nome, segundo alguns estudiosos, conserva o Isanas de Josefo."
    - "Josefo chama de Isanas uma aldeia da mesma região, provavelmente o mesmo lugar. Ali, no inverno de 38/37 a.C., Herodes derrotou Pappus, general do rei hasmoneu Antígono; os homens de Herodes perseguiram o inimigo até as casas, derrubaram os tetos e apedrejaram os que estavam amontoados embaixo, e Josefo diz que nenhum espetáculo de toda a guerra foi mais terrível que os montes de mortos. Ambos os sítios propostos ficam hoje na Cisjordânia."
    - "O nome significa “velha”. Isso ajuda a explicar a leitura de 1 Samuel 7:12: onde o hebraico tem Sem, a Septuaginta grega põe a pedra de Samuel entre Mispá e “a velha”, e a International Standard Bible Encyclopedia julgou que os seus tradutores leram a palavra hebraica para velho, que remete a Jesana. O Survey of Western Palestine descreveu Ain Sinia como uma aldeia de evidente antiguidade num vale de socalcos de oliveiras e figueiras, com uma boa fonte e algumas casas de alvenaria muito boa, que domina uma das antigas estradas principais para Jerusalém. A sua equipe achou ali em 1872 um túmulo com uma inscrição hebraica, e os topógrafos julgaram que o nome e a posição apontavam para Jesana."
    - "O Survey of Western Palestine registrou a ruína da colina como Burj el Lisaneh, “a torre da língua”, nome que tirou do esporão que a ruína ocupa. Encontrou ali as muralhas de uma torre que julgou de origem cruzada, construída em parte com pedras mais antigas de bordas lavradas, e os restos de um edifício com colunata que era provavelmente uma igreja."
  de:
    - "Jeschana war eine Stadt der südlichen Hügel Ephraims, an der Grenze zwischen Juda und Israel. Nach seinem Sieg über Jerobeam gewann Abija von Juda ihm Städte ab: „Beth-El mit seinen Ortschaften, Jesana mit seinen Ortschaften und Ephron mit seinen Ortschaften“. Die International Standard Bible Encyclopedia vermerkte, dass die meisten Gelehrten Jeschana auch für das dunkle Sen von 1. Samuel 7,12 lesen, wo Samuel den Stein Eben-Ezer „zwischen Mizpa und Sen“ aufstellte. Charles Clermont-Ganneau setzte es mit der Quelle und den Ruinen von Ain Sinia gleich, etwa 5 km nördlich von Bethel; die Karte folgt der nahen Ruine Burdsch el-Isane auf einer Anhöhe, deren Name nach Ansicht mancher Gelehrter das Isanas des Josephus bewahrt."
    - "Josephus nennt ein Dorf in derselben Gegend Isanas, wahrscheinlich denselben Ort. Dort besiegte Herodes im Winter 38/37 v. Chr. Pappus, den Feldherrn des hasmonäischen Königs Antigonos; Herodes' Männer verfolgten den Feind in die Häuser, rissen die Dächer ein und steinigten die unten Zusammengedrängten, und kein Anblick im ganzen Krieg, sagt Josephus, sei schrecklicher gewesen als die Haufen der Toten. Beide vorgeschlagenen Stätten liegen heute im Westjordanland."
    - "Der Name bedeutet „alt“. Das hilft, die Lesart von 1. Samuel 7,12 zu erklären: Wo der hebräische Text Sen hat, stellt die griechische Septuaginta Samuels Stein zwischen Mizpa und „die Alte“, und die International Standard Bible Encyclopedia urteilte, ihre Übersetzer hätten das hebräische Wort für alt gelesen, das auf Jeschana zurückweist. Der Survey of Western Palestine beschrieb Ain Sinia als Dorf von offenkundigem Alter in einem Tal mit Oliven- und Feigenterrassen, mit einer guten Quelle und einigen Häusern aus sehr gutem Mauerwerk, das eine der alten Hauptstraßen nach Jerusalem beherrscht. Sein Trupp fand dort 1872 ein Grab mit hebräischer Inschrift, und die Vermesser urteilten, Name und Lage wiesen auf Jeschana."
    - "Der Survey of Western Palestine verzeichnete die Ruine auf der Anhöhe als Burj el Lisaneh, „der Turm der Zunge“, einen Namen, den er von dem Bergsporn ableitete, auf dem die Ruine liegt. Er fand dort die Mauern eines Turms, den er für ein Werk der Kreuzfahrer hielt, teils aus älteren Steinen mit Randschlag errichtet, und die Reste eines Säulenbaus, der wahrscheinlich eine Kirche war."
  fr:
    - "Jeschana était une ville des collines méridionales d’Éphraïm, à la frontière entre Juda et Israël. Après sa victoire sur Jéroboam, Abija de Juda « lui prit des villes, Béthel et les villes de son ressort, Jeschana et les villes de son ressort, et Éphron et les villes de son ressort. » L’International Standard Bible Encyclopedia notait que la plupart des savants lisent aussi Jeschana pour l’obscur « Schen » de 1 Samuel 7:12, où Samuel plaça la pierre d’Ében-Ézer « entre Mitspa et Schen ». Charles Clermont-Ganneau l’identifia avec la source et les ruines d’Aïn Sinia, à environ 5 km au nord de Béthel ; la carte suit la ruine voisine de Burj el-Isaneh, sur une hauteur, dont le nom, selon certains savants, garde l’Isanas de Josèphe."
    - "Josèphe appelle Isanas un village de la même région, probablement le même lieu. C’est là qu’à l’hiver 38/37 av. J.-C. Hérode battit Pappus, général du roi hasmonéen Antigone ; les hommes d’Hérode poursuivirent l’ennemi jusque dans les maisons, abattirent les toits et lapidèrent ceux qui s’y entassaient, et Josèphe dit qu’aucun spectacle de toute la guerre ne fut plus terrible que les tas de morts. Les deux sites proposés se trouvent aujourd’hui en Cisjordanie."
    - "Le nom signifie « vieille ». Cela aide à expliquer la leçon de 1 Samuel 7:12 : là où l’hébreu porte Schen, la Septante grecque place la pierre de Samuel entre Mitspa et « la vieille », et l’International Standard Bible Encyclopedia jugeait que ses traducteurs avaient lu le mot hébreu pour vieux, qui renvoie à Jeschana. Le Survey of Western Palestine décrivit Aïn Sinia comme un village d’une antiquité évidente dans une vallée de terrasses d’oliviers et de figuiers, avec une bonne source et quelques maisons d’une très bonne maçonnerie, commandant l’une des anciennes routes principales vers Jérusalem. Son équipe y trouva en 1872 un tombeau portant une inscription hébraïque, et les topographes jugèrent que le nom et la position désignaient Jeschana."
    - "Le Survey of Western Palestine enregistra la ruine de la hauteur sous le nom de Burj el Lisaneh, « la tour de la langue », nom qu’il tirait de l’éperon qu’occupe la ruine. Il y trouva les murs d’une tour qu’il jugea d’origine croisée, bâtie en partie de pierres plus anciennes à bords taillés, et les restes d’un édifice à colonnade qui était probablement une église."
  it:
    - "Iesana era una città delle colline meridionali di Efraim, al confine tra Giuda e Israele. Dopo la sua vittoria su Geroboamo, Abia di Giuda «gli prese delle città: Bethel e le città che ne dipendevano, Jeshana e le città che ne dipendevano, Efraim e le città che ne dipendevano». La International Standard Bible Encyclopedia osservava che la maggior parte degli studiosi legge Iesana anche al posto dell’oscuro «Scen» di 1 Samuele 7,12, dove Samuele eresse la pietra Eben-Ezer «tra Mitspa e Scen». Charles Clermont-Ganneau la identificò con la sorgente e le rovine di Ain Sinia, a circa 5 km a nord di Betel; la carta segue la vicina rovina di Burj el-Isaneh, su un’altura, il cui nome secondo alcuni studiosi conserva l’Isanas di Giuseppe Flavio."
    - "Giuseppe Flavio chiama Isanas un villaggio della stessa regione, probabilmente lo stesso luogo. Là, nell’inverno del 38/37 a.C., Erode sconfisse Pappo, generale del re asmoneo Antigono; gli uomini di Erode inseguirono il nemico nelle case, abbatterono i tetti e lapidarono chi vi era ammassato sotto, e Giuseppe dice che nessuno spettacolo di tutta la guerra fu più terribile dei mucchi di morti. Entrambi i siti proposti si trovano oggi in Cisgiordania."
    - "Il nome significa «vecchia». Ciò aiuta a spiegare la lezione di 1 Samuele 7,12: dove l’ebraico ha Scen, la Settanta greca pone la pietra di Samuele tra Mitspa e «la vecchia», e la International Standard Bible Encyclopedia giudicava che i suoi traduttori avessero letto la parola ebraica per vecchio, che rimanda a Iesana. Il Survey of Western Palestine descrisse Ain Sinia come un villaggio di evidente antichità in una valle di terrazze di ulivi e fichi, con una buona sorgente e alcune case di ottima muratura, che domina una delle antiche strade principali verso Gerusalemme. La sua squadra vi trovò nel 1872 una tomba con un’iscrizione ebraica, e i topografi giudicarono che il nome e la posizione indicassero Iesana."
    - "Il Survey of Western Palestine registrò la rovina dell’altura come Burj el Lisaneh, «la torre della lingua», nome che trasse dallo sperone occupato dalla rovina. Vi trovò le mura di una torre che giudicò di origine crociata, costruita in parte con pietre più antiche dal bordo lavorato, e i resti di un edificio colonnato che era probabilmente una chiesa."
  nl:
    - "Jesana was een stad in de zuidelijke heuvels van Efraïm, op de grens tussen Juda en Israël. Na zijn overwinning op Jerobeam nam Abia “van hem de steden, Beth-El met haar onderhorige plaatsen, en Jesana met haar onderhorige plaatsen, en Efron met haar onderhorige plaatsen.” De International Standard Bible Encyclopedia merkte op dat de meeste geleerden Jesana ook lezen voor het duistere “Sen” van 1 Samuël 7:12, waar Samuël de steen Eben-Haëzer oprichtte “tussen Mizpa en tussen Sen”. Charles Clermont-Ganneau vereenzelvigde het met de bron en ruïnes van Ain Sinia, ongeveer 5 km ten noorden van Bethel; de kaart volgt de nabije ruïne Burj el-Isaneh op een heuveltop, waarvan de naam volgens sommige geleerden het Isanas van Josephus bewaart."
    - "Josephus noemt een dorp in dezelfde streek Isanas, waarschijnlijk dezelfde plaats. Daar versloeg Herodes in de winter van 38/37 v.Chr. Pappus, de veldheer van de Hasmonese koning Antigonus; Herodes' mannen achtervolgden de vijand tot in de huizen, braken de daken af en stenigden hen die daaronder opeengepakt zaten, en Josephus zegt dat geen aanblik in de hele oorlog verschrikkelijker was dan de hopen doden. Beide voorgestelde plaatsen liggen tegenwoordig op de Westelijke Jordaanoever."
    - "De naam betekent “oud”. Dat helpt de lezing van 1 Samuël 7:12 te verklaren: waar het Hebreeuws Sen heeft, plaatst de Griekse Septuaginta Samuëls steen tussen Mizpa en “de oude”, en de International Standard Bible Encyclopedia oordeelde dat haar vertalers het Hebreeuwse woord voor oud lazen, dat terugwijst naar Jesana. De Survey of Western Palestine beschreef Ain Sinia als een dorp van duidelijke ouderdom in een dal met terrassen van olijf- en vijgenbomen, met een goede bron en enkele huizen van zeer goed metselwerk, dat een van de oude hoofdwegen naar Jeruzalem beheerst. Zijn ploeg vond er in 1872 een graf met een Hebreeuws opschrift, en de landmeters oordeelden dat naam en ligging op Jesana wezen."
    - "De Survey of Western Palestine noteerde de ruïne op de heuveltop als Burj el Lisaneh, “de toren van de tong”, een naam die hij ontleende aan de bergrug waarop de ruïne ligt. Hij vond er de muren van een toren die hij van kruisvaardersoorsprong achtte, deels gebouwd van oudere stenen met randslag, en de resten van een gebouw met zuilengang dat waarschijnlijk een kerk was."
  pl:
    - "Jeszana było miastem południowych wzgórz Efraima, na granicy między Judą a Izraelem. Po zwycięstwie nad Jeroboamem Abiasz z Judy, jak czytamy, „odjął mu miasta Betel i wsi jego, i Jesana i wsi jego, i Efron i wsi jego”. International Standard Bible Encyclopedia zauważyła, że większość uczonych czyta Jeszana także w niejasnym „Szen” z 1 Sm 7,12, gdzie Samuel postawił kamień Eben-Ezer „między Masfa a między Sen”. Charles Clermont-Ganneau utożsamił je ze źródłem i ruinami Ajn Sinija, około 5 km na północ od Betel; mapa idzie za pobliską ruiną Burdż al-Isane na szczycie wzgórza, w której nazwie niektórzy uczeni widzą Isanas Józefa Flawiusza."
    - "Józef Flawiusz nazywa wieś w tym samym regionie Isanas, prawdopodobnie to samo miejsce. Tam zimą 38/37 p.n.e. Herod pokonał Pappusa, wodza hasmonejskiego króla Antygonosa; ludzie Heroda ścigali wroga do domów, zrywali dachy i kamienowali stłoczonych poniżej, a Józef Flawiusz mówi, że w całej wojnie nie było straszniejszego widoku niż stosy zabitych. Oba proponowane stanowiska leżą dziś na Zachodnim Brzegu."
    - "Nazwa znaczy „stara”. To pomaga wyjaśnić lekcję 1 Sm 7,12: tam, gdzie tekst hebrajski ma Szen, grecka Septuaginta stawia kamień Samuela między Mispą a „starą”, a International Standard Bible Encyclopedia uznała, że jej tłumacze odczytali hebrajskie słowo oznaczające stary, które wskazuje na Jeszana. Survey of Western Palestine opisał Ajn Sinija jako wieś oczywistej starożytności w dolinie wśród tarasów oliwek i figowców, z dobrym źródłem i kilkoma domami z bardzo dobrego muru, panującą nad jedną z dawnych głównych dróg do Jerozolimy. Jego ekipa znalazła tam w 1872 roku grób z hebrajskim napisem, a topografowie uznali, że nazwa i położenie wskazują na Jeszana."
    - "Survey of Western Palestine zapisał ruinę na wzgórzu jako Burj el Lisaneh, „wieża języka”, biorąc tę nazwę od ostrogi, na której leży ruina. Znalazł tam mury wieży, którą uznał za dzieło krzyżowców, zbudowanej częściowo z dawniejszych kamieni z obrobionymi krawędziami, oraz resztki budowli z kolumnadą, prawdopodobnie kościoła."
  cs:
    - "Ješana bylo město jižních efrajimských hor, na hranici mezi Judskem a Izraelem. Po svém vítězství nad Jarobeámem „vzal mu města, Bethel i vsi jeho, Jesana i vsi jeho, a Efron i vsi jeho“ judský Abija. International Standard Bible Encyclopedia poznamenala, že většina badatelů čte Ješanu také za nejasné „Sen“ z 1 Sam 7,12, kde Samuel postavil kámen Eben-ezer „mezi Masfa a mezi Sen“. Charles Clermont-Ganneau ji ztotožnil s pramenem a zříceninou Ajn Sinja, asi 5 km severně od Bét-elu; mapa sleduje blízkou zříceninu Burdž el-Isána na vrcholu kopce, v jejímž jménu podle některých badatelů přežívá Isanas Josepha Flavia."
    - "Josephus Flavius nazývá vesnici v téže oblasti Isanas, pravděpodobně totéž místo. Tam Herodes v zimě 38/37 př. n. l. porazil Pappa, vojevůdce hasmonejského krále Antigona; Herodovi muži pronásledovali nepřítele do domů, strhávali střechy a kamenovali ty, kdo se dole tísnili, a Josephus říká, že v celé válce nebylo hrůznějšího pohledu než hromady mrtvých. Obě navrhovaná místa leží dnes na Západním břehu."
    - "Jméno znamená „stará“. To pomáhá vysvětlit čtení v 1 Sam 7,12: kde hebrejský text má Sen, řecká Septuaginta staví Samuelův kámen mezi Mispu a „starou“, a International Standard Bible Encyclopedia soudila, že její překladatelé četli hebrejské slovo pro starý, které ukazuje zpět k Ješaně. Survey of Western Palestine popsal Ajn Sinja jako vesnici zjevného stáří v údolí s terasami oliv a fíkovníků, s dobrým pramenem a několika domy z velmi dobrého zdiva, která ovládá jednu ze starých hlavních cest do Jeruzaléma. Jeho skupina tam roku 1872 nalezla hrob s hebrejským nápisem a zeměměřiči usoudili, že jméno i poloha ukazují na Ješanu."
    - "Survey of Western Palestine zaznamenal zříceninu na kopci jako Burj el Lisaneh, „věž jazyka“, jméno, které odvodil od ostrohu, na němž zřícenina leží. Našel tam zdi věže, kterou pokládal za křižáckou, postavené zčásti ze starších kamenů s lemovanými okraji, a zbytky stavby s kolonádou, která byla pravděpodobně kostelem."
  sv:
    - "Jeshana var en stad i södra Efraims berg, på gränsen mellan Juda och Israel. Efter sin seger över Jerobeam ”tog” Avia av Juda ”ifrån honom några städer: Betel med underlydande orter, Jesana med underlydande orter och Efron med underlydande orter”. International Standard Bible Encyclopedia noterade att de flesta forskare också läser Jeshana för det obskyra ”Sen” i Första Samuelsboken 7:12, där Samuel reste stenen Even-Haeser ”mellan Mispa och Sen”. Charles Clermont-Ganneau identifierade den med källan och ruinerna i Ain Sinia, omkring 5 km norr om Betel; kartan följer den närbelägna ruinen Burj el-Isaneh på en kulle, vars namn enligt en del forskare bevarar Josefus Isanas."
    - "Josefus kallar en by i samma trakt Isanas, sannolikt samma plats. Där besegrade Herodes vintern 38/37 f.Kr. Pappus, den hasmoneiske kungen Antigonos general; Herodes män förföljde fienden in i husen, rev ned taken och stenade de som trängdes därunder, och Josefus säger att ingen syn under hela kriget var förskräckligare än högarna av döda. Båda föreslagna platserna ligger i dag på Västbanken."
    - "Namnet betyder ”gammal”. Det hjälper till att förklara läsningen i Första Samuelsboken 7:12: där den hebreiska texten har Sen, ställer den grekiska Septuaginta Samuels sten mellan Mispa och ”den gamla”, och International Standard Bible Encyclopedia bedömde att dess översättare läste det hebreiska ordet för gammal, som pekar tillbaka på Jeshana. Survey of Western Palestine beskrev Ain Sinia som en by av uppenbar ålder i en dal med terrasser av oliv- och fikonträd, med en god källa och några hus av mycket gott murverk, som behärskar en av de gamla huvudvägarna till Jerusalem. Dess lag fann där 1872 en grav med hebreisk inskrift, och lantmätarna bedömde att namnet och läget pekade på Jeshana."
    - "Survey of Western Palestine upptecknade ruinen på kullen som Burj el Lisaneh, ”tungans torn”, ett namn som den hämtade från den bergsudde ruinen ligger på. Den fann där murarna av ett torn som den bedömde vara av korsfararursprung, byggt delvis av äldre stenar med kanthuggning, och resterna av en byggnad med kolonnad som troligen var en kyrka."
  nb:
    - "Jesjana var en by i de sørlige åsene i Efraim, på grensen mellom Juda og Israel. Etter sin seier over Jeroboam «tok» Abia av Juda «fra ham byene Betel med tilhørende småbyer og Jesana med tilhørende småbyer og Efron med tilhørende småbyer». International Standard Bible Encyclopedia bemerket at de fleste forskere også leser Jesjana for det obskure «Sen» i Første Samuelsbok 7,12, der Samuel satte opp steinen Eben-Eser «imellem Mispa og Sen». Charles Clermont-Ganneau identifiserte den med kilden og ruinene i Ain Sinia, omtrent 5 km nord for Betel; kartet følger den nærliggende ruinen Burj el-Isaneh på en høyde, hvis navn enkelte forskere mener bevarer Josefus' Isanas."
    - "Josefus kaller en landsby i samme område Isanas, trolig det samme stedet. Der beseiret Herodes vinteren 38/37 f.Kr. Pappos, generalen til den hasmoneiske kongen Antigonos; Herodes' menn forfulgte fienden inn i husene, rev ned takene og steinet dem som sto trengt nedenfor, og Josefus sier at intet syn i hele krigen var mer skrekkelig enn haugene av døde. Begge de foreslåtte stedene ligger i dag på Vestbredden."
    - "Navnet betyr «gammel». Det hjelper til å forklare lesemåten i Første Samuelsbok 7,12: der den hebraiske teksten har Sen, setter den greske Septuaginta Samuels stein mellom Mispa og «den gamle», og International Standard Bible Encyclopedia mente at oversetterne leste det hebraiske ordet for gammel, som peker tilbake på Jesjana. Survey of Western Palestine beskrev Ain Sinia som en landsby av åpenbar ælde i en dal med terrasser av oliven- og fikentrær, med en god kilde og noen hus av svært godt murverk, som behersker en av de gamle hovedveiene til Jerusalem. Laget fant der i 1872 en grav med hebraisk innskrift, og landmålerne mente at navnet og beliggenheten pekte mot Jesjana."
    - "Survey of Western Palestine registrerte ruinen på høyden som Burj el Lisaneh, «tungens tårn», et navn den hentet fra fjellutløperen ruinen ligger på. Den fant der murene av et tårn den mente var fra korsfarertiden, delvis bygd av eldre steiner med kanthugging, og restene av en bygning med søylerad som trolig var en kirke."
  tl:
    - "Ang Jesana ay isang bayan sa timog na burol ng Ephraim, sa hangganan ng Juda at Israel. Pagkatapos ng tagumpay ni Abias ng Juda laban kay Jeroboam, “hinabol ni Abias si Jeroboam, at inagawan siya ng mga bayan, ang Beth-el pati ng mga nayon niyaon, at ang Jesana pati ng mga nayon niyaon at ang Ephron pati ng mga nayon niyaon.” Itinala ng International Standard Bible Encyclopedia na binabasa rin ng karamihan sa mga iskolar ang Jesana para sa malabong “Sen” ng 1 Samuel 7:12, kung saan itinayo ni Samuel ang batong Ebenezer “sa pagitan ng Mizpa at ng Sen”. Kinilala ito ni Charles Clermont-Ganneau sa bukal at mga guho ng Ain Sinia, mga 5 km sa hilaga ng Beth-el; sinusunod ng mapa ang kalapit na guho sa tuktok ng burol, ang Burj el-Isaneh, na ang pangalan ay itinuturing ng ilang iskolar na nagpapanatili sa Isanas ni Josephus."
    - "Tinatawag ni Josephus na Isanas ang isang nayon sa parehong rehiyon, marahil ang parehong lugar. Doon, sa taglamig ng 38/37 BK, tinalo ni Herodes si Pappus, ang heneral ng haring Hasmoneo na si Antigonus; hinabol ng mga tauhan ni Herodes ang kaaway sa mga bahay, ibinagsak ang mga bubong at binato ang mga siksikang nasa ibaba, at sinasabi ni Josephus na walang tanawin sa buong digmaan na mas kakila-kilabot kaysa sa mga bunton ng patay. Ang parehong iminungkahing lugar ay nasa West Bank ngayon."
    - "Ang pangalan ay nangangahulugang “luma”. Nakatutulong ito upang ipaliwanag ang pagbasa sa 1 Samuel 7:12: kung saan Sen ang nasa Hebreo, inilalagay ng Griegong Septuaginta ang bato ni Samuel sa pagitan ng Mizpa at ng “luma”, at hinatulan ng International Standard Bible Encyclopedia na binasa ng mga tagasalin nito ang salitang Hebreo para sa luma, na tumuturo pabalik sa Jesana. Inilarawan ng Survey of Western Palestine ang Ain Sinia bilang isang nayong halatang sinauna sa isang lambak ng mga baitang ng olibo at igos, na may mabuting bukal at ilang bahay na napakahusay ang pagkakagawa, at nakatanaw sa isa sa mga sinaunang pangunahing daan patungong Jerusalem. Nakatagpo roon ang pangkat nito noong 1872 ng isang libingan na may inskripsiyong Hebreo, at hinatulan ng mga tagasukat na tumuturo sa Jesana ang pangalan at kinalalagyan."
    - "Itinala ng Survey of Western Palestine ang guho sa tuktok ng burol bilang Burj el Lisaneh, “ang tore ng dila”, isang pangalang hinango nito sa gulod na kinalalagyan ng guho. Natagpuan nito roon ang mga pader ng isang tore na hinatulan nitong mula sa panahon ng mga Krusado, na bahagyang itinayo sa mas lumang mga batong may tinabas na gilid, at ang mga labi ng isang gusaling may hanay ng mga haligi na marahil ay isang simbahan."
  da:
    - "Jesjana var en by i Efraims sydlige bjerge, på grænsen mellem Juda og Israel. Efter sin sejr over Jeroboam forfulgte Abija af Juda ham og »tog Stæder fra ham, nemlig Bethel med dens tilhørende Byer og Jesana med dens tilhørende Byer og Efron med dens tilhørende Byer«. International Standard Bible Encyclopedia bemærkede, at de fleste forskere også læser Jesjana for det obskure »Sjen« i 1 Sam 7,12, hvor Samuel satte stenen Eben-Ezer op »imellem Mizpa og imellem Sen«. Charles Clermont-Ganneau identificerede den med kilden og ruinerne ved Ain Sinia, omkring 5 km nord for Betel; kortet følger den nærliggende ruin Burj el-Isaneh på en bakketop, hvis navn nogle forskere mener bevarer Josefus' Isanas."
    - "Josefus kalder en landsby i samme egn Isanas, sandsynligvis samme sted. Der besejrede Herodes i vinteren 38/37 f.Kr. Pappus, general for den hasmonæiske konge Antigonos; Herodes' mænd forfulgte fjenden ind i husene, rev tagene ned og stenede dem, der trængtes under dem, og Josefus siger, at intet syn i hele krigen var mere forfærdeligt end dyngerne af døde. Begge foreslåede steder ligger i dag på Vestbredden."
    - "Navnet betyder »gammel«. Det hjælper til at forklare læsemåden i 1 Sam 7,12: hvor den hebraiske tekst har Sjen, sætter den græske Septuaginta Samuels sten mellem Mizpa og »den gamle«, og International Standard Bible Encyclopedia mente, at dens oversættere læste det hebraiske ord for gammel, som peger tilbage på Jesjana. Survey of Western Palestine beskrev Ain Sinia som en landsby af åbenbar ælde i en dal med terrasser af oliven- og figentræer, med en god kilde og nogle huse af meget godt murværk, der behersker en af de gamle hovedveje til Jerusalem. Holdet fandt dér i 1872 en grav med hebraisk indskrift, og landmålerne mente, at navnet og beliggenheden pegede på Jesjana."
    - "Survey of Western Palestine optegnede ruinen på bakketoppen som Burj el Lisaneh, »tungens tårn«, et navn den tog fra den bjergudløber, ruinen ligger på. Den fandt dér murene af et tårn, som den vurderede til at være af korsfareroprindelse, delvis bygget af ældre sten med kanthugning, og resterne af en bygning med søjlegang, som sandsynligvis var en kirke."
  sr:
    - "Јесана је била град јужних Јефремових брда, на граници између Јуде и Израиља. После победе над Јеровоамом, Авија Јудин „узе му градове Ветиљ и села његова, и Јесану и села њена, и Ефрон и села његова“. Међународна стандардна библијска енциклопедија забележила је да већина научника Јесану чита и за нејасни „Сен“ из 1. Сам 7,12, где је Самуило подигао камен Евен-Езер „између Миспе и Сена“. Шарл Клермон-Гано поистоветио ју је са извором и рушевинама Аин Синије, око 5 км северно од Ветиља; карта следи оближњу рушевину на брду Бурџ ел-Исана, у чијем имену неки научници виде Исану Јосифа Флавија."
    - "Јосиф Флавије назива село у истом крају Исана, вероватно исто место. Тамо је, у зиму 38/37. п. н. е., Ирод победио Папу, војсковођу хасмонејског цара Антигона; Иродови људи гонили су непријатеља у куће, срушили кровове и каменовали оне који су се тискали испод, а Јосиф Флавије каже да у целом рату није било страшнијег призора од гомила мртвих. Оба предложена налазишта данас леже на Западној обали."
    - "Име значи „стара“. То помаже да се објасни читање у 1. Сам 7,12: где хебрејски текст има Сен, грчка Септуагинта ставља Самуилов камен између Миспе и „старе“, а Међународна стандардна библијска енциклопедија сматрала је да су њени преводиоци прочитали хебрејску реч за стар, која упућује на Јесану. Истраживање Западне Палестине описало је Аин Синију као село очигледне старине у долини с терасама маслина и смокава, с добрим извором и неколико кућа од веома доброг зида, које влада једним од старих главних путева за Јерусалим. Његова екипа нашла је тамо 1872. гроб с хебрејским натписом, а премеравачи су закључили да име и положај указују на Јесану."
    - "Истраживање Западне Палестине забележило је рушевину на брду као Бурџ ел-Лисана, „кула језика“, по огранку брда на коме рушевина лежи. Нашло је тамо зидове куле коју је сматрало крсташком, грађене делом од старијег камена с обрађеним ивицама, и остатке грађевине с колонадом, која је вероватно била црква."
  hu:
    - "Jesána Efraim déli hegyeinek városa volt, Júda és Izráel határán. Jeroboám fölött aratott győzelme után Abija, Júda királya „elfoglala ő tőle egynéhány várost, Béthelt és annak faluit, Jésanát és annak faluit, s Efrávint és annak faluit.” A Nemzetközi Szabványos Bibliai Enciklopédia megjegyezte, hogy a legtöbb kutató Jesánát olvassa az 1Sám 7,12 homályos „Sén” helyén is, ahol Sámuel felállította az Ebenézer kövét „Mispa és Sén között”. Charles Clermont-Ganneau az Ain Szinija forrásával és romjaival azonosította, Bételtől mintegy 5 km-re északra; a térkép a közeli, dombtetőn álló Burdzs el-Iszáne romját követi, amelynek nevében egyes kutatók Josephus Isanasát látják."
    - "Josephus az ugyanazon vidéken lévő falut Isanasnak nevezi, valószínűleg ugyanezt a helyet. Ott győzte le Heródes Kr. e. 38/37 telén Pappust, Antigonosz hasmóneus király hadvezérét; Heródes emberei az ellenséget házakig üldözték, lebontották a tetőket, és megkövezték az alattuk összezsúfolódottakat, és Josephus szerint a háború egész ideje alatt semmi sem volt szörnyűbb látvány a halottak halmainál. Mindkét javasolt hely ma Ciszjordániában fekszik."
    - "A név jelentése „régi”. Ez segít megmagyarázni az 1Sám 7,12 olvasatát: ahol a héber szövegben Sén áll, a görög Septuaginta Sámuel kövét Mispa és „a régi” közé helyezi, a Nemzetközi Szabványos Bibliai Enciklopédia pedig úgy ítélte, hogy fordítói a régi jelentésű héber szót olvasták, amely Jesánára utal vissza. A Survey of Western Palestine Ain Sziniját nyilvánvalóan ősi faluként írta le egy olajfa- és fügeteraszos völgyben, jó forrással és néhány igen jó falazatú házzal, amely a Jeruzsálembe vezető egyik ősi főútvonal felett uralkodik. Csoportja 1872-ben héber feliratos sírt talált ott, és a felmérők úgy ítélték, hogy a név és a fekvés Jesánára mutat."
    - "A Survey of Western Palestine a dombtetői romot Burj el Lisaneh, azaz „a nyelv tornya” néven jegyezte fel, a nevet arról a hegyfokról véve, amelyen a rom áll. Egy torony falait találta ott, amelyet keresztes kori eredetűnek ítélt, és amely részben régebbi, szegélyezett faragású kövekből épült, továbbá egy oszlopos épület maradványait, amely valószínűleg templom volt."
  fi:
    - "Jesana oli kaupunki Efraimin eteläisillä kukkuloilla, Juudan ja Israelin rajalla. Voitettuaan Jerobeamin Juudan Abia ”valloitti häneltä muutamia kaupunkeja: Beetelin ja sen tytärkaupungit, Jesanan ja sen tytärkaupungit ja Efronin ja sen tytärkaupungit”. International Standard Bible Encyclopedia huomautti, että useimmat tutkijat lukevat Jesanan myös Ensimmäisen Samuelin kirjan 7:12 hämäräksi jäävän ”Senin” tilalle, jossa Samuel pystytti Eben-Eser-kiven ”Mispan ja Seenin välille”. Charles Clermont-Ganneau tunnisti sen Ain Sinian lähteeksi ja raunioiksi noin 5 km Betelistä pohjoiseen; kartta seuraa läheistä kukkulan laella olevaa Burj el-Isanehin rauniota, jonka nimessä jotkut tutkijat näkevät Josephuksen Isanasin."
    - "Josephus kutsuu samalla seudulla olevaa kylää nimellä Isanas, luultavasti samaksi paikaksi. Siellä talvella 38/37 eaa. Herodes voitti Pappuksen, hasmonealaisen kuningas Antigonoksen kenraalin; Herodeksen miehet ajoivat vihollista takaa taloihin, purkivat katot ja kivittivät alla ahtautuneita, ja Josephus sanoo, ettei koko sodassa ollut kauheampaa näkyä kuin kuolleiden kasat. Molemmat ehdotetut paikat sijaitsevat nykyään Länsirannalla."
    - "Nimi merkitsee ”vanhaa”. Se auttaa selittämään Ensimmäisen Samuelin kirjan 7:12 lukutavan: missä hepreassa on Sen, kreikkalainen Septuaginta asettaa Samuelin kiven Mispan ja ”vanhan” välille, ja International Standard Bible Encyclopedia katsoi, että sen kääntäjät lukivat heprean sanan vanha, joka viittaa takaisin Jesanaan. Survey of Western Palestine kuvasi Ain Sinian ilmeisen ikivanhaksi kyläksi oliivi- ja viikunaterassien laaksossa, jossa oli hyvä lähde ja muutamia hyvin muurattuja taloja ja joka hallitsee yhtä Jerusalemiin vievistä muinaisista pääteistä. Sen ryhmä löysi sieltä vuonna 1872 haudan, jossa oli heprealainen kirjoitus, ja kartoittajat katsoivat nimen ja sijainnin viittaavan Jesanaan."
    - "Survey of Western Palestine kirjasi kukkulan raunion nimellä Burj el Lisaneh, ”kielen torni”, ja otti nimen vuorenkielekkeestä, jolla raunio sijaitsee. Se löysi sieltä ristiretkeläisten rakentamaksi arvioimansa tornin muurit, osin vanhemmista reunahakatuista kivistä rakennetut, sekä pylväikköisen rakennuksen jäänteet; rakennus oli luultavasti kirkko."
  vi:
    - "Giê-sa-na là một thành ở các đồi phía nam Ép-ra-im, trên ranh giới giữa Giu-đa và Y-sơ-ra-ên. Sau chiến thắng Giê-rô-bô-am, A-bi-gia của Giu-đa “chiếm lấy những thành, là Bê-tên và các hương thôn nó; Giê-sa-na và các hương thôn nó; Ép-rôn và các hương thôn nó”. International Standard Bible Encyclopedia ghi rằng phần lớn học giả cũng đọc Giê-sa-na thay cho “Sen” mơ hồ trong 1 Sa-mu-ên 7:12, nơi Sa-mu-ên dựng hòn đá Ê-bên-Ê-xe “giữa khoảng Mích-ba và Sen”. Charles Clermont-Ganneau đồng nhất nó với suối và phế tích Ain Sinia, cách Bê-tên khoảng 5 km về phía bắc; bản đồ theo phế tích Burj el-Isaneh trên đỉnh đồi gần đó, mà theo một số học giả, tên gọi vẫn giữ lại tên Isanas của Josephus."
    - "Josephus gọi một làng trong cùng vùng là Isanas, có lẽ là cùng nơi. Tại đó, vào mùa đông năm 38/37 TCN, Hê-rốt đánh bại Pappus, tướng của vua Hasmonean Antigonus; người của Hê-rốt đuổi kẻ thù vào các nhà, phá mái và ném đá những người chen chúc bên dưới, và Josephus nói rằng không cảnh nào trong cả cuộc chiến khủng khiếp hơn những đống xác chết. Cả hai địa điểm đề nghị ngày nay nằm ở Bờ Tây."
    - "Tên này có nghĩa là “cũ”. Điều đó giúp giải thích cách đọc ở 1 Sa-mu-ên 7:12: chỗ bản Hê-bơ-rơ ghi Sen, Bản Bảy Mươi tiếng Hy Lạp đặt hòn đá của Sa-mu-ên giữa Mích-ba và “thành cũ”, và International Standard Bible Encyclopedia cho rằng các dịch giả đã đọc chữ Hê-bơ-rơ có nghĩa là cũ, vốn dẫn về Giê-sa-na. Survey of Western Palestine mô tả Ain Sinia là một làng rõ ràng cổ xưa trong một thung lũng có ruộng bậc thang trồng ô-liu và vả, với một suối tốt và vài ngôi nhà xây rất khéo, khống chế một trong những con đường chính cổ dẫn đến Giê-ru-sa-lem. Đoàn của họ tìm thấy ở đó năm 1872 một ngôi mộ có khắc chữ Hê-bơ-rơ, và các nhà khảo sát cho rằng tên và vị trí chỉ về Giê-sa-na."
    - "Survey of Western Palestine ghi phế tích trên đỉnh đồi là Burj el Lisaneh, “tháp của cái lưỡi”, một tên mà họ lấy từ mỏm núi nơi phế tích tọa lạc. Họ tìm thấy ở đó các bức tường của một tháp mà họ cho là có nguồn gốc từ thời Thập tự chinh, được xây một phần bằng những tảng đá cổ hơn có viền đẽo, và tàn tích của một công trình có hàng cột, có lẽ là một nhà thờ."
  ro:
    - "Ieșana era un oraș din dealurile sudice ale lui Efraim, la hotarul dintre Iuda și Israel. După victoria asupra lui Ieroboam, Abia al lui Iuda „a luat dela el cetățile acestea: Vetilul și satele lui, Iesinà și satele ei și Efronul și satele lui”. International Standard Bible Encyclopedia nota că cei mai mulți cercetători citesc Ieșana și pentru obscurul Șen din 1 Samuel 7:12, unde Samuel a ridicat piatra Eben-Ezer „între Masifat și între Senon”. Charles Clermont-Ganneau l-a identificat cu izvorul și ruinele de la Ain Sinia, la circa 5 km spre nord de Betel; harta urmează ruina din apropiere Burj el-Isaneh, de pe vârful unui deal, al cărei nume, după unii cercetători, păstrează Isanas-ul lui Iosif Flaviu."
    - "Iosif Flaviu numește Isanas un sat din aceeași regiune, probabil același loc. Acolo, în iarna anului 38/37 î.Hr., Irod l-a învins pe Pappus, generalul regelui hasmoneu Antigonus; oamenii lui Irod au urmărit dușmanul în case, au dărâmat acoperișurile și i-au omorât cu pietre pe cei înghesuiți dedesubt, iar Iosif Flaviu spune că nicio priveliște din tot războiul nu a fost mai îngrozitoare decât grămezile de morți. Ambele locuri propuse se află astăzi în Cisiordania."
    - "Numele înseamnă „veche”. Aceasta ajută la explicarea lecțiunii din 1 Samuel 7:12: unde textul ebraic are Șen, Septuaginta greacă așază piatra lui Samuel între Mițpa și „cea veche”, iar International Standard Bible Encyclopedia socotea că traducătorii ei au citit cuvântul ebraic pentru vechi, care trimite înapoi la Ieșana. Survey of Western Palestine a descris Ain Sinia ca pe un sat de o vechime evidentă, într-o vale cu terase de măslini și smochini, cu un izvor bun și câteva case de zidărie foarte bună, care domină unul dintre vechile drumuri principale spre Ierusalim. Echipa sa a găsit acolo în 1872 un mormânt cu o inscripție ebraică, iar topografii au socotit că numele și poziția indică Ieșana."
    - "Survey of Western Palestine a consemnat ruina de pe deal sub numele Burj el Lisaneh, „turnul limbii”, nume pe care l-a luat de la pintenul de deal pe care se află ruina. A găsit acolo zidurile unui turn pe care l-a socotit de origine cruciată, construit în parte din pietre mai vechi cu margini cioplite, și resturile unei clădiri cu colonadă, care era probabil o biserică."
  bg:
    - "Йешана беше град в южните Ефремови хълмове, на границата между Юда и Израил. След победата си над Йеровоам Авия Юдейски „взе от него градове, Ветил и селата му, и Иесана и селата ѝ, и Ефрон и селата му“. The International Standard Bible Encyclopedia отбелязва, че повечето учени четат Йешана и вместо неясното „Сен“ в 1 Царе 7:12, където Самуил постави камъка Авен-Езер „между Масфа и Сен“. Шарл Клермон-Гано го отъждестви с извора и развалините на Айн Синия, на около 5 км северно от Ветил; картата следва близката развалина на хълма Бурдж ел-Исане, в чието име някои учени виждат Исанас на Йосиф Флавий."
    - "Йосиф Флавий нарича едно село в същата област Исанас, вероятно същото място. Там през зимата на 38/37 г. пр.н.е. Ирод разби Пап, пълководеца на хасмонейския цар Антигон; хората на Ирод преследваха врага в къщите, събаряха покривите и убиваха с камъни струпаните отдолу, а Йосиф Флавий казва, че в цялата война нямало по-страшна гледка от купищата мъртви. И двете предложени места днес лежат на Западния бряг."
    - "Името означава „стара“. Това помага да се обясни четенето в 1 Царе 7:12: там, където в еврейския текст стои Сен, гръцката Септуагинта поставя камъка на Самуил между Масфа и „старата“, а The International Standard Bible Encyclopedia смята, че преводачите ѝ са прочели еврейската дума за стар, която сочи към Йешана. Проучването на Западна Палестина описва Айн Синия като село с явна древност в долина с тераси от маслини и смокини, с добър извор и няколко къщи от много добра зидария, което владее един от старите главни пътища към Йерусалим. Неговият отряд открива там през 1872 г. гроб с еврейски надпис, а топографите преценяват, че името и положението сочат към Йешана."
    - "Проучването на Западна Палестина записва развалината на хълма като Бурдж ел-Лисане, „кулата на езика“, име, взето от скалния нос, който развалината заема. Там то открива стените на кула, която смята за кръстоносна, изградена отчасти от по-стари камъни с обработени ръбове, и останките на сграда с колонада, вероятно църква."
