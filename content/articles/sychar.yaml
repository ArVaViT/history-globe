# Overview article (ADR 0007). Mainstream facts only; the site is disputed (Askar or Shechem at Tell Balata) and both are named; the date for Shechem's end follows the Shechem article.
id: sychar
place: a27b472 # the only Sychar record, drawn at Askar (lon/lat checked); 1 verse
title:
  en: "Sychar"
  ru: "Сихарь"
  uk: "Сихар"
  es: "Sicar"
  pt: "Sicar"
  de: "Sichar"
  fr: "Sychar"
body:
  en:
    - 'Sychar is the "city of Samaria" of John''s Gospel, "near to the parcel of ground that Jacob gave to his son Joseph", where Jacob''s well was. The well is still shown at the eastern foot of Mount Gerizim, where the pass between Gerizim and Ebal opens onto the plain, east of Nablus. Which town John meant is disputed. Many identify Sychar with the village of Askar on the lower slope of Mount Ebal, about a kilometre north of the well, where the map point stands; others hold that it is Shechem itself, the mound of Tell Balata, a few hundred metres from the well.'
    - "The case for Askar rests on early witnesses that keep the two places apart. Eusebius lists Sychar separately from Shechem, placing it before Neapolis by the field Jacob gave to Joseph. The Pilgrim of Bordeaux in 333 was shown Sichem at the foot of Gerizim, with the tomb of Joseph, and a mile from it a place called Sechar, from which the Samaritan woman came down to the well. The Mishnah names a valley of Ein Sokher, which some link with the same name. The case for Shechem rests on its nearness to the well and on Jerome, who held that the name should be read Shechem, not Sychar as many read it; against it, the old city at Tell Balata had been destroyed by John Hyrcanus about 107 BC."
    - 'In John''s account Jesus, wearied with the journey from Judaea to Galilee through Samaria, sat on the well about the sixth hour and asked a Samaritan woman for a drink. They spoke of living water and of worship; she said "Our fathers worshipped in this mountain", meaning Gerizim, where the Samaritan temple had stood. She went into the city, many Samaritans of that city believed, and at their request Jesus abode there two days.'
    - "In AD 72 Vespasian founded the city of Flavia Neapolis, today Nablus, a little to the west; Josephus says the local people called the place Mabartha. Eusebius notes that the place of Sychar was still shown. In 333 the Pilgrim of Bordeaux saw plane trees said to have been planted by Jacob and a bath fed from the well, and by the 380s a church had been built around the well on the side of Gerizim, where Paula stopped on her pilgrimage. That church was probably destroyed in one of the Samaritan revolts, of 484 or 529."
  ru:
    - "Сихарь — «город Самарийский» из Евангелия от Иоанна, «близ участка земли, данного Иаковом сыну своему Иосифу», где был колодезь Иаковлев. Колодец и теперь показывают у восточного подножия горы Гаризим, там, где проход между Гаризимом и Гевалом выходит на равнину, к востоку от Наблуса. О том, какой город имел в виду Иоанн, спорят. Многие отождествляют Сихарь с селением Аскар на нижнем склоне горы Гевал, примерно в километре к северу от колодца, — там стоит точка на карте; другие считают, что это сам Сихем, холм Телль-Балата в нескольких сотнях метров от колодца."
    - "В пользу Аскара говорят ранние свидетели, различающие эти два места. Евсевий называет Сихарь отдельно от Сихема и помещает его перед Неаполем, у поля, данного Иаковом Иосифу. Бордоскому паломнику в 333 г. показали Сихем у подножия Гаризима с гробницей Иосифа, а в миле от него — место под названием Сехар, откуда самарянка спускалась к колодцу. Мишна упоминает долину Эйн-Сохер, которую некоторые связывают с тем же именем. В пользу Сихема говорят его близость к колодцу и мнение Иеронима, считавшего, что читать надо «Сихем», а не «Сихарь», как читают многие; против — то, что старый город на Телль-Балате был разрушен Иоанном Гирканом около 107 г. до н. э."
    - "По рассказу Иоанна, Иисус, утомлённый дорогой из Иудеи в Галилею через Самарию, сел у колодезя около шестого часа и попросил у самарянки пить. Они говорили о воде живой и о поклонении; она сказала: «Отцы наши поклонялись на этой горе», имея в виду Гаризим, где прежде стоял храм самарян. Она пошла в город, многие самаряне из того города уверовали, и по их просьбе Иисус пробыл там два дня."
    - "В 72 г. н. э. Веспасиан основал немного к западу город Флавия Неаполь, нынешний Наблус; по словам Иосифа Флавия, местные жители называли это место Мабарта. Евсевий отмечает, что место Сихаря всё ещё показывают. В 333 г. Бордоский паломник видел платаны, будто бы посаженные Иаковом, и купальню, питаемую из колодца, а к 380-м гг. вокруг колодца на склоне Гаризима была построена церковь, где останавливалась в своём паломничестве Павла. Вероятно, эта церковь погибла во время одного из восстаний самарян — 484 или 529 г."
  uk:
    - "Сихар — це «город Самарянський» Євангелія від Івана, «поблизу хутора, що дав Яков Йосифу, синові своєму», де була криниця Якова. Криницю досі показують біля східного підніжжя гори Гарізім, де прохід між Гарізімом і Гевалом виходить на рівнину, на схід від Наблуса. Яке саме місто мав на увазі Іван, спірно. Багато хто ототожнює Сихар із селом Аскар на нижньому схилі гори Гевал, приблизно за кілометр на північ від криниці, де стоїть точка на мапі; інші вважають, що це сам Сихем, пагорб Телль-Балата за кілька сотень метрів від криниці."
    - "Доводи на користь Аскара спираються на ранні свідчення, які розрізняють ці два місця. Євсевій перелічує Сихар окремо від Сихема, розміщуючи його перед Неаполем біля поля, яке Яків дав Йосипові. Бордоському пілігриму в 333 році показали Сихем біля підніжжя Гарізіма з гробницею Йосипа, а за милю від нього — місце на ім’я Сехар, звідки самарянка зійшла до криниці. Мішна називає долину Ейн-Сохер, яку дехто пов’язує з тією самою назвою. Доводи на користь Сихема спираються на його близькість до криниці та на Ієроніма, який вважав, що назву слід читати Сихем, а не Сихар, як читають багато хто; проти цього — старе місто в Телль-Балаті було зруйноване Іоанном Гірканом близько 107 р. до н. е."
    - "За розповіддю Івана, Ісус, потомлений дорогою з Юдеї до Галілеї через Самарію, сидів на криниці близько шостої години і попросив самарянку дати напитися. Вони говорили про живу воду та про поклоніння; вона сказала: «Батьки наші на сїй горі покланялись», маючи на увазі Гарізім, де стояв самарянський храм. Вона пішла в місто, багато самарян з того міста увірувало, і на їхнє прохання Ісус «зіставсь там два днї»."
    - "У 72 р. н. е. Веспасіан заснував місто Флавія Неаполь, нинішній Наблус, трохи на захід; Йосиф Флавій каже, що місцеві називали це місце Мабарта. Євсевій зазначає, що місце Сихара ще показували. У 333 році Бордоський пілігрим бачив платани, які, як казали, посадив Яків, і купіль, що живилася від криниці, а до 380-х років навколо криниці на схилі Гарізіма збудували церкву, де зупинялася Павла під час свого паломництва. Ця церква, ймовірно, була зруйнована під час одного із самарянських повстань — 484 чи 529 року."
  es:
    - "Sicar es la «ciudad de Samaria» del Evangelio de Juan, «junto á la heredad que Jacob dió á José su hijo», donde estaba la fuente de Jacob. El pozo se sigue mostrando al pie oriental del monte Gerizim, donde el paso entre el Gerizim y el Ebal se abre a la llanura, al este de Nablus. Se discute a qué población se refería Juan. Muchos identifican Sicar con la aldea de Askar, en la ladera baja del monte Ebal, a un kilómetro al norte del pozo, donde está el punto del mapa; otros sostienen que es la propia Siquem, el montículo de Tell Balata, a unos cientos de metros del pozo."
    - "El argumento a favor de Askar descansa en testimonios antiguos que mantienen separados los dos lugares. Eusebio enumera Sicar aparte de Siquem, y la sitúa antes de Neápolis, junto al campo que Jacob dio a José. Al Peregrino de Burdeos, en 333, le mostraron Sichem al pie del Gerizim, con la tumba de José, y a una milla de ella un lugar llamado Sechar, de donde bajó la samaritana al pozo. La Misná nombra un valle de Ein Sokher, que algunos relacionan con el mismo nombre. El argumento a favor de Siquem descansa en su cercanía al pozo y en Jerónimo, que sostenía que el nombre debía leerse Siquem, no Sicar como muchos lo leían; en contra, la antigua ciudad de Tell Balata había sido destruida por Juan Hircano hacia 107 a. C."
    - "En el relato de Juan, Jesús, cansado del viaje de Judea a Galilea por Samaria, se sentó junto al pozo hacia la hora sexta y pidió de beber a una mujer samaritana. Hablaron del agua viva y de la adoración; ella dijo: «Nuestros padres adoraron en este monte», refiriéndose al Gerizim, donde se había alzado el templo samaritano. Ella fue a la ciudad, muchos samaritanos de aquella ciudad creyeron, y a petición suya Jesús se quedó allí dos días."
    - "En el año 72 d. C. Vespasiano fundó la ciudad de Flavia Neápolis, la actual Nablus, algo más al oeste; Josefo dice que los lugareños llamaban al sitio Mabartha. Eusebio anota que el lugar de Sicar aún se mostraba. En 333 el Peregrino de Burdeos vio plátanos que se decía plantados por Jacob y un baño alimentado por el pozo, y hacia los años 380 se había levantado una iglesia alrededor del pozo, en la ladera del Gerizim, donde se detuvo Paula en su peregrinación. Esa iglesia fue probablemente destruida en una de las rebeliones samaritanas, la de 484 o la de 529."
  pt:
    - "Sicar é a “cidade de Samaria” do Evangelho de João, “perto do terreno que Jacó deu a seu filho José”, onde ficava o poço de Jacó. O poço ainda é mostrado ao pé oriental do monte Gerizim, onde a passagem entre o Gerizim e o Ebal se abre para a planície, a leste de Nablus. Qual cidade João tinha em mente é discutido. Muitos identificam Sicar com a aldeia de Askar, na encosta baixa do monte Ebal, cerca de um quilômetro ao norte do poço, onde está o ponto do mapa; outros sustentam que é a própria Siquém, o monte de Tell Balata, a algumas centenas de metros do poço."
    - "O argumento por Askar se apoia em testemunhas antigas que mantêm os dois lugares separados. Eusébio lista Sicar separadamente de Siquém, situando-a antes de Neápolis, junto ao campo que Jacó deu a José. O Peregrino de Bordeaux, em 333, viu Sichem ao pé do Gerizim, com o túmulo de José, e a uma milha dela um lugar chamado Sechar, de onde a samaritana descia ao poço. A Mixná nomeia um vale de Ein Sokher, que alguns ligam ao mesmo nome. O argumento por Siquém se apoia em sua proximidade do poço e em Jerônimo, que sustentava que o nome devia ser lido Siquém, não Sicar como muitos liam; contra ele, a antiga cidade em Tell Balata havia sido destruída por João Hircano por volta de 107 a.C."
    - "No relato de João, Jesus, cansado da viagem da Judeia para a Galileia por Samaria, sentou-se no poço por volta da hora sexta e pediu de beber a uma samaritana. Falaram da água viva e da adoração; ela disse: “Nossos pais adoraram neste monte”, referindo-se ao Gerizim, onde estivera o templo samaritano. Ela foi à cidade, muitos samaritanos daquela cidade creram e, a pedido deles, Jesus ficou ali dois dias."
    - "Em 72 d.C., Vespasiano fundou a cidade de Flávia Neápolis, hoje Nablus, um pouco a oeste; Josefo diz que o povo local chamava o lugar Mabartha. Eusébio observa que o lugar de Sicar ainda era mostrado. Em 333 o Peregrino de Bordeaux viu plátanos que se diziam plantados por Jacó e um banho alimentado pelo poço, e na década de 380 já se havia construído uma igreja ao redor do poço, na encosta do Gerizim, onde Paula parou em sua peregrinação. Essa igreja foi provavelmente destruída numa das revoltas samaritanas, de 484 ou 529."
  de:
    - "Sichar ist die „Stadt Samarias“ des Johannesevangeliums, „nahe bei dem Feld, das Jakob seinem Sohn Joseph gab“, wo Jakobs Brunnen war. Der Brunnen wird noch heute am Ostfuß des Garizim gezeigt, wo sich der Pass zwischen Garizim und Ebal zur Ebene öffnet, östlich von Nablus. Welche Stadt Johannes meinte, ist umstritten. Viele setzen Sichar mit dem Dorf Askar am Unterhang des Ebal gleich, etwa einen Kilometer nördlich des Brunnens, wo der Kartenpunkt steht; andere halten es für Sichem selbst, den Hügel Tell Balata, wenige hundert Meter vom Brunnen entfernt."
    - "Für Askar sprechen frühe Zeugen, die beide Orte getrennt halten. Eusebius führt Sichar getrennt von Sichem auf und setzt es vor Neapolis beim Feld, das Jakob Josef gab. Dem Pilger von Bordeaux zeigte man 333 Sichem am Fuß des Garizim mit dem Grab Josefs und eine Meile davon einen Ort namens Sechar, von dem die Samariterin zum Brunnen herabgekommen sei. Die Mischna nennt ein Tal Ein Sokher, das manche mit demselben Namen verbinden. Für Sichem sprechen die Nähe zum Brunnen und Hieronymus, der meinte, der Name sei Sichem zu lesen, nicht Sichar, wie viele läsen; dagegen spricht, dass die alte Stadt auf dem Tell Balata um 107 v. Chr. von Johannes Hyrkanos zerstört worden war."
    - "Im Bericht des Johannes setzte sich Jesus, müde von der Reise von Judäa nach Galiläa durch Samarien, gegen die sechste Stunde auf den Brunnen und bat eine Samariterin um etwas zu trinken. Sie sprachen von lebendigem Wasser und von der Anbetung; sie sagte: „Unsere Väter haben auf diesem Berge angebetet“ und meinte den Garizim, wo der samaritische Tempel gestanden hatte. Sie ging in die Stadt, viele Samariter aus jener Stadt glaubten, und auf ihre Bitte blieb Jesus dort zwei Tage."
    - "Im Jahr 72 n. Chr. gründete Vespasian etwas weiter westlich die Stadt Flavia Neapolis, das heutige Nablus; Josephus sagt, die Einheimischen nannten den Ort Mabartha. Eusebius vermerkt, dass die Stätte von Sichar noch gezeigt wurde. 333 sah der Pilger von Bordeaux Platanen, die Jakob gepflanzt haben soll, und ein vom Brunnen gespeistes Bad, und in den 380er Jahren war um den Brunnen am Hang des Garizim eine Kirche gebaut worden, wo Paula auf ihrer Pilgerreise haltmachte. Diese Kirche wurde wahrscheinlich in einem der samaritischen Aufstände von 484 oder 529 zerstört."
  fr:
    - "Sychar est la « ville de Samarie » de l’Évangile de Jean, « près du champ que Jacob avait donné à Joseph, son fils », où se trouvait le puits de Jacob. Le puits est toujours montré au pied oriental du mont Garizim, là où le défilé entre Garizim et Ébal s’ouvre sur la plaine, à l’est de Naplouse. La ville que Jean avait en vue est discutée. Beaucoup identifient Sychar au village d’Askar, sur le bas de la pente du mont Ébal, à environ un kilomètre au nord du puits, où se trouve le point de la carte ; d’autres y voient Sichem même, le tertre de Tell Balata, à quelques centaines de mètres du puits."
    - "L’argument en faveur d’Askar repose sur d’anciens témoins qui distinguent les deux lieux. Eusèbe cite Sychar à part de Sichem, la plaçant avant Néapolis, près du champ que Jacob donna à Joseph. Le Pèlerin de Bordeaux, en 333, se vit montrer Sichem au pied du Garizim, avec le tombeau de Joseph, et à un mille de là un lieu appelé Sechar, d’où la Samaritaine descendait au puits. La Mishna nomme une vallée d’Ein Sokher, que certains rattachent au même nom. L’argument en faveur de Sichem repose sur sa proximité du puits et sur Jérôme, qui pensait qu’il fallait lire Sichem et non Sychar comme beaucoup le lisaient ; contre lui, la vieille ville de Tell Balata avait été détruite par Jean Hyrcan vers 107 av. J.-C."
    - "Dans le récit de Jean, Jésus, fatigué du voyage de Judée en Galilée par la Samarie, s’assit au bord du puits vers la sixième heure et demanda à boire à une Samaritaine. Ils parlèrent d’eau vive et d’adoration ; elle dit : « Nos pères ont adoré sur cette montagne », entendant le Garizim, où avait été le temple samaritain. Elle alla dans la ville, plusieurs Samaritains de cette ville crurent, et à leur demande Jésus y resta deux jours."
    - "En 72 apr. J.-C., Vespasien fonda la ville de Flavia Néapolis, l’actuelle Naplouse, un peu à l’ouest ; selon Josèphe, les gens du pays appelaient le lieu Mabartha. Eusèbe note que le site de Sychar était encore montré. En 333, le Pèlerin de Bordeaux vit des platanes qu’aurait plantés Jacob et un bain alimenté par le puits, et dès les années 380 une église avait été bâtie autour du puits, sur le flanc du Garizim, où Paula s’arrêta lors de son pèlerinage. Cette église fut probablement détruite lors d’une des révoltes samaritaines, en 484 ou en 529."
