body:
  en:
    - "Mount Seir is the mountain range of Edom, east of the Arabah, running from the gorge of the Zered (Wadi Hasa) south toward the Gulf of Aqaba: the Jebel esh-Shera of southern Jordan, a wall of sandstone and granite that rises from the Arabah to crests of 1,500 m and more, with the hidden valley of Petra in its western face. The name means something like “hairy”, a rough, bushy hill country, and Genesis plays on it with Esau, the hairy brother. Egyptian texts of the thirteenth and twelfth centuries BC know the Shasu nomads of Seir, and a letter from Jerusalem in the Amarna archive already names the land. A minority of scholars read Seir in some passages as hills west of the Arabah, south-west of the Dead Sea; most keep it in Edom."
    - "In Genesis the Horites live “in their mount Seir” when the eastern kings sweep through; then Esau settles there, “Thus dwelt Esau in mount Seir: Esau is Edom”, and his sons drive out the Horites. On the march from Kadesh Israel is told to pass the border of “your brethren the children of Esau, which dwell in Seir” without a fight, “because I have given mount Seir unto Esau for a possession”. In the blessing of Moses and the song of Deborah the LORD comes forth from Seir as he came from Sinai, and Balaam foretells that “Seir also shall be a possession for his enemies”."
    - "Under the kings Seir is another name for Edom. Five hundred Simeonites went to Mount Seir and killed the last of the Amalekites; in Jehoshaphat's day Ammon, Moab and “mount Seir” marched on Judah and destroyed one another; Amaziah slew ten thousand “children of Seir” in the Valley of Salt and brought their gods home to worship. Isaiah hears a voice calling “out of Seir, Watchman, what of the night?”, and Ezekiel sets his face against Mount Seir: “I will stretch out mine hand against thee, and I will make thee most desolate”. Archaeology shows the Edomite kingdom at its height in the eighth to sixth centuries BC, with its capital Bozrah (Buseirah) on the plateau, paying tribute to Assyria."
    - "After Edom came the Nabataeans, whose capital Petra lies in a basin of the range, and then Rome's province of Arabia. Today Mount Seir is the highland of the Jordanian governorates of Tafilah and Ma'an: Petra, a World Heritage Site since 1985, the Crusader castle of Shobak, the Dana nature reserve above the Arabah, and Jebel Harun, the traditional tomb of Aaron, the highest peak above Petra."
  ru:
    - "Гора Сеир — горная цепь Едома к востоку от Аравы, тянущаяся от ущелья Зареда (Вади-Хаса) на юг к заливу Акаба: Джебель-эш-Шера на юге Иордании, стена песчаника и гранита, поднимающаяся над Аравой до гребней в 1500 м и выше, со скрытой долиной Петры на западном склоне. Имя значит примерно «косматый», неровная, поросшая кустарником страна, и Книга Бытия обыгрывает его в рассказе о косматом Исаве. Египетские тексты XIII–XII веков до н. э. знают кочевников-шасу из Сеира, а письмо из Иерусалима в Амарнском архиве уже называет эту землю. Меньшинство учёных читает Сеир в некоторых местах как горы к западу от Аравы, юго-западнее Мёртвого моря; большинство оставляет его в Едоме."
    - "В Книге Бытия Хорреи живут «в горе их Сеире», когда через неё проходят восточные цари; затем здесь селится Исав, «Исав, он же Едом», и его сыновья изгоняют Хорреев. На пути от Кадеса Израилю велено пройти пределы «братьев ваших, сынов Исавовых, живущих на Сеире», не воюя, «потому что гору Сеир Я дал во владение Исаву». В благословении Моисея и в песни Деворы Господь открывается от Сеира, как пришёл от Синая, а Валаам предрекает: «Сеир будет под владением врагов своих»."
    - "При царях Сеир — другое имя Едома. Пятьсот человек из колена Симеонова пошли к горе Сеир и побили остаток Амаликитян; во дни Иосафата Аммонитяне, Моавитяне и обитатели горы Сеира вышли на Иудею и истребили друг друга; Амасия побил «сынов Сеира» десять тысяч на долине Соляной и принёс их богов к себе, чтобы им кланяться. Исаия слышит крик с Сеира: «сторож! сколько ночи?», а Иезекииль обращает лицо к горе Сеир: «простру на тебя руку Мою и сделаю тебя пустою и необитаемою». Археология показывает Едомское царство в расцвете в VIII–VI веках до н. э., со столицей Восорой (Бусейрой) на плато, платившее дань Ассирии."
    - "После Едома пришли Набатеи, чья столица Петра лежит в котловине этой цепи, а затем римская провинция Аравия. Сегодня гора Сеир — нагорье иорданских провинций Эт-Тафила и Маан: Петра, объект Всемирного наследия с 1985 года, крестоносный замок Шобак, заповедник Дана над Аравой и Джебель-Харун, традиционная гробница Аарона, высочайшая вершина над Петрой."
  uk:
    - "Гора Сеїр — гірський хребет Едому, на схід від Арави, що тягнеться від ущелини Заред (Ваді-Хаса) на південь до Акабської затоки: Джебель-еш-Шера південної Йорданії, стіна пісковику й граніту, що здіймається від Арави до гребенів понад 1500 м, із прихованою долиною Петри на її західному фасі. Назва означає щось на кшталт «волохата», груба кущиста гірська країна, і Книга Буття грає на ній з Ісавом, волохатим братом. Єгипетські тексти XIII–XII ст. до н. е. знають кочівників шасу з Сеїру, а лист з Єрусалима в амарнському архіві вже називає цю землю. Меншість учених у деяких місцях читає Сеїр як пагорби на захід від Арави, на південний захід від Мертвого моря; більшість залишає його в Едомі."
    - "У Книзі Буття хорити живуть «на їх Сеїр-горах», коли східні царі проходять краєм; потім Ісав оселяється там: «Осївся ж Езав на Сеїр горах; Езав, він же Едом», і його сини виганяють хоритів. На шляху з Кадеса Ізраїлю наказано пройти межу «братів ваших, синів Єзавових, що живуть на Сеїр-горах» без бою, «бо Сеїр-гори віддав я Езавові в державу». У благословенні Мойсея і пісні Дебори Господь виходить із Сеїру, як прийшов із Синаю, а Валаам провіщає: «Буде Едом із Сеїром у гіркій неволї»."
    - "За царів Сеїр — інша назва Едому. П’ятсот симеонян пішли на гору Сеїр і вбили останок амаликитян; за днів Йосафата Аммон, Моав і «горян з Сеїра» пішли на Юду й знищили один одного; Амасія вбив десять тисяч «синів Сеїру» в Соляній долині й приніс їхніх богів додому поклонятися. Ісая чує голос, що кличе «з Сеїру: Стороже! яка пора ночі?», а Єзекіїль звертає обличчя проти гори Сеїр: «простяг проти тебе руку мою й зроблю тебе безлюдною пустинею». Археологія показує едомське царство в розквіті у VIII–VI ст. до н. е., зі столицею Боцрою (Бусейра) на плато, що платить данину Ассирії."
    - "Після Едому прийшли набатеї, чия столиця Петра лежить у улоговині хребта, а потім римська провінція Аравія. Сьогодні Гора Сеїр — нагір’я йорданських мухафаз Тафіла і Маан: Петра, об’єкт Всесвітньої спадщини від 1985 р., замок хрестоносців Шобак, заповідник Дана над Арабою і Джебель-Гарун, традиційна гробниця Аарона, найвища вершина над Петрою."
  es:
    - "El monte Seir es la cordillera de Edom, al este del Arabá, que corre desde la garganta del Zered (Wadi Hasa) hacia el sur, en dirección al golfo de Aqaba: el Yebel esh-Shera del sur de Jordania, una muralla de arenisca y granito que se eleva desde el Arabá hasta crestas de 1500 m y más, con el escondido valle de Petra en su cara occidental. El nombre significa algo así como «velludo», una sierra áspera y poblada de matorral, y Génesis juega con él a propósito de Esaú, el hermano velludo. Textos egipcios de los siglos XIII y XII a. C. conocen a los nómadas shasu de Seir, y una carta de Jerusalén en el archivo de Amarna ya nombra la tierra. Una minoría de estudiosos lee Seir en algunos pasajes como las colinas al oeste del Arabá, al sudoeste del mar Muerto; la mayoría la mantiene en Edom."
    - "En Génesis los horeos viven «en el monte de Seir» cuando los reyes orientales arrasan la región; luego Esaú se establece allí, «Y Esaú habitó en el monte de Seir: Esaú es Edom», y sus hijos expulsan a los horeos. En la marcha desde Cades se manda a Israel pasar la frontera de «vuestros hermanos los hijos de Esaú, que habitan en Seir» sin combate, «porque yo he dado por heredad á Esaú el monte de Seir». En la bendición de Moisés y en el cántico de Débora, Jehová sale de Seir como vino del Sinaí, y Balaam predice que «será también tomada Seir por sus enemigos»."
    - "Bajo los reyes, Seir es otro nombre de Edom. Quinientos simeonitas fueron al monte Seir y mataron a los últimos amalecitas; en tiempos de Josafat, Amón, Moab y el «monte de Seir» marcharon contra Judá y se destruyeron unos a otros; Amasías mató a diez mil «hijos de Seir» en el valle de la Sal y trajo sus dioses a casa para adorarlos. Isaías oye una voz que llama: «Danme voces de Seir: Guarda, ¿qué de la noche?», y Ezequiel dirige su rostro contra el monte Seir: «extenderé mi mano contra ti, y te pondré en asolamiento y en soledad». La arqueología muestra el reino edomita en su apogeo en los siglos VIII a VI a. C., con su capital Bosra (Buseirah) en la meseta, pagando tributo a Asiria."
    - "Después de Edom vinieron los nabateos, cuya capital Petra se halla en una cuenca de la cordillera, y luego la provincia romana de Arabia. Hoy el monte Seir es la región alta de las gobernaciones jordanas de Tafilah y Ma'an: Petra, Patrimonio Mundial desde 1985, el castillo cruzado de Shobak, la reserva natural de Dana sobre el Arabá y el Yebel Harún, la tumba tradicional de Aarón, el pico más alto sobre Petra."
  pt:
    - "O monte Seir é a cordilheira de Edom, a leste da Arabá, que corre da garganta do Zerede (Wadi Hasa) para o sul rumo ao golfo de Aqaba: o Jebel esh-Shera do sul da Jordânia, um paredão de arenito e granito que se ergue da Arabá a cristas de 1.500 m e mais, com o oculto vale de Petra em sua face ocidental. O nome significa algo como “peludo”, uma região montanhosa áspera e cheia de mato, e Gênesis joga com ele em Esaú, o irmão peludo. Textos egípcios dos séculos XIII e XII a.C. conhecem os nômades Shasu de Seir, e uma carta de Jerusalém nos arquivos de Amarna já nomeia a terra. Uma minoria de estudiosos lê Seir em algumas passagens como colinas a oeste da Arabá, a sudoeste do mar Morto; a maioria a mantém em Edom."
    - "Em Gênesis, os horeus vivem “em seu monte Seir” quando os reis orientais passam; depois Esaú se estabelece ali, “Esaú habitou na região montanhosa de Seir. Esaú é Edom”, e seus filhos expulsam os horeus. Na marcha de Cades, Israel recebe ordem de passar pela fronteira de “seus irmãos, os filhos de Esaú, que habitam em Seir” sem combate, “porque eu dei o monte Seir a Esaú por possessão”. Na bênção de Moisés e no cântico de Débora o SENHOR sai de Seir como veio do Sinai, e Balaão prediz que “Seir, seu inimigo, também será uma possessão”."
    - "Sob os reis, Seir é outro nome de Edom. Quinhentos simeonitas foram ao monte Seir e mataram o remanescente dos amalequitas; nos dias de Josafá, Amom, Moabe e “monte Seir” marcharam contra Judá e destruíram uns aos outros; Amazias matou dez mil “filhos de Seir” no Vale do Sal e trouxe seus deuses para casa para adorá-los. Isaías ouve uma voz que clama “a mim de Seir: ‘Vigia, como está a noite?’”, e Ezequiel volta o rosto contra o monte Seir: “estenderei a minha mão contra você. Farei de você uma desolação e um espanto”. A arqueologia mostra o reino edomita em seu auge nos séculos VIII a VI a.C., com sua capital Bosra (Buseirah) no planalto, pagando tributo à Assíria."
    - "Depois de Edom vieram os nabateus, cuja capital Petra fica numa bacia da cordilheira, e depois a província romana da Arábia. Hoje o monte Seir é a região alta das províncias jordanianas de Tafilah e Ma'an: Petra, Patrimônio Mundial desde 1985, o castelo cruzado de Shobak, a reserva natural de Dana acima da Arabá e o Jebel Harun, o tradicional túmulo de Arão, o pico mais alto acima de Petra."
  de:
    - "Das Gebirge Seir ist das Gebirge Edoms, östlich der Araba, das sich von der Schlucht des Sered (Wadi Hasa) nach Süden zum Golf von Akaba zieht: der Jebel esh-Shera Südjordaniens, eine Wand aus Sandstein und Granit, die von der Araba auf Kämme von 1500 m und mehr ansteigt, mit dem verborgenen Tal von Petra in seiner Westflanke. Der Name bedeutet etwa „haarig“, ein raues, buschiges Hügelland, und die Genesis spielt damit auf Esau an, den haarigen Bruder. Ägyptische Texte des 13. und 12. Jahrhunderts v. Chr. kennen die Schasu-Nomaden von Seir, und ein Brief aus Jerusalem im Amarna-Archiv nennt das Land schon. Eine Minderheit von Gelehrten liest Seir an manchen Stellen als Hügel westlich der Araba, südwestlich des Toten Meeres; die meisten belassen es in Edom."
    - "In der Genesis wohnen die Horiter „auf dem Gebirge Seir“, als die östlichen Könige durchziehen; dann siedelt dort Esau: „Also wohnte Esau auf dem Gebirge Seir. Und Esau ist der Edom.“, und seine Söhne vertreiben die Horiter. Auf dem Marsch von Kadesch wird Israel gesagt: „ihr werdet durch das Land eurer Brüder, der Kinder Esau, ziehen, die zu Seir wohnen“, ohne Kampf, „denn das Gebirge Seir habe ich den Kindern Esau zu besitzen gegeben“. Im Segen des Mose und im Lied der Debora zieht der HERR aus Seir hervor wie vom Sinai, und Bileam kündigt an, „Seir wird seinen Feinden unterworfen sein“."
    - "Unter den Königen ist Seir ein anderer Name für Edom. Fünfhundert Simeoniter zogen zum Gebirge Seir und erschlugen die letzten Amalekiter; zur Zeit Josaphats zogen Ammon, Moab und „die auf dem Gebirge Seir“ gegen Juda und vernichteten einander; Amazja erschlug im Salztal „die Kinder von Seir zehntausend“ und brachte ihre Götter heim, um sie anzubeten. Jesaja hört einen Ruf „aus Seir: Hüter, ist die Nacht schier hin?“, und Hesekiel richtet sein Angesicht gegen das Gebirge Seir: „ich will an dich, du Berg Seir, und meine Hand wider dich ausstrecken und will dich gar wüst machen“. Die Archäologie zeigt das edomitische Königreich auf seinem Höhepunkt im 8. bis 6. Jahrhundert v. Chr., mit der Hauptstadt Bozra (Buseira) auf der Hochebene, tributpflichtig an Assyrien."
    - "Nach Edom kamen die Nabatäer, deren Hauptstadt Petra in einem Becken des Gebirges liegt, und dann die römische Provinz Arabien. Heute ist das Gebirge Seir das Hochland der jordanischen Gouvernements Tafila und Ma'an: Petra, seit 1985 Welterbe, die Kreuzfahrerburg Schobak, das Naturreservat Dana über der Araba und der Jebel Harun, das überlieferte Grab Aarons, der höchste Gipfel über Petra."
  fr:
    - "Le mont Séir est la chaîne montagneuse d’Édom, à l’est de l’Araba, qui court des gorges du Zéred (ouadi Hasa) vers le sud en direction du golfe d’Aqaba : le djebel ech-Chera du sud de la Jordanie, muraille de grès et de granit qui s’élève de l’Araba jusqu’à des crêtes de 1 500 m et plus, avec la vallée cachée de Pétra sur sa face occidentale. Le nom signifie quelque chose comme « velu », pays de collines rudes et broussailleuses, et la Genèse joue dessus avec Ésaü, le frère velu. Des textes égyptiens des XIIIe et XIIe siècles av. J.-C. connaissent les nomades Shasou de Séir, et une lettre de Jérusalem dans les archives d’Amarna nomme déjà le pays. Une minorité de savants lisent Séir, en certains passages, comme des collines à l’ouest de l’Araba, au sud-ouest de la mer Morte ; la plupart le gardent en Édom."
    - "Dans la Genèse, les Horiens vivent « dans leur montagne de Séir » quand les rois de l’est déferlent ; puis Ésaü s’y établit : « Ésaü s’établit dans la montagne de Séir. Ésaü, c’est Édom », et ses fils chassent les Horiens. Dans la marche depuis Qadesh, Israël reçoit l’ordre de passer sans combat la frontière de « vos frères, les enfants d’Ésaü, qui habitent en Séir », car « j’ai donné la montagne de Séir en propriété à Ésaü ». Dans la bénédiction de Moïse et le cantique de Débora, l’Éternel sort de Séir comme il vint du Sinaï, et Balaam prédit : « Il se rend maître de Séir, ses ennemis »."
    - "Sous les rois, Séir est un autre nom d’Édom. Cinq cents Siméonites allèrent à la montagne de Séir et tuèrent le reste des Amalécites ; du temps de Josaphat, Ammon, Moab et « ceux de la montagne de Séir » marchèrent sur Juda et s’entre-détruisirent ; Amatsia tua dix mille « fils de Séir » dans la vallée du Sel et rapporta leurs dieux pour les adorer. Ésaïe entend qu’« on me crie de Séir : Sentinelle, que dis-tu de la nuit ? », et Ézéchiel tourne sa face contre le mont Séir : « J’étends ma main sur toi, et je fais de toi une solitude et un désert ». L’archéologie montre le royaume édomite à son apogée aux VIIIe–VIe siècles av. J.-C., avec sa capitale Botsra (Buseirah) sur le plateau, payant tribut à l’Assyrie."
    - "Après Édom vinrent les Nabatéens, dont la capitale Pétra se trouve dans un bassin de la chaîne, puis la province romaine d’Arabie. Aujourd’hui, le mont Séir est le haut pays des gouvernorats jordaniens de Tafilah et de Ma’an : Pétra, site du patrimoine mondial depuis 1985, le château croisé de Shobak, la réserve naturelle de Dana au-dessus de l’Araba, et le djebel Haroun, tombe traditionnelle d’Aaron, plus haut sommet au-dessus de Pétra."
  it:
    - "Il Monte Seir è la catena montuosa di Edom, a est dell’Araba, che corre dalla gola dello Zered (Wadi Hasa) verso sud fino al Golfo di Aqaba: il Jebel esh-Shera della Giordania meridionale, un muro di arenaria e granito che si leva dall’Araba fino a creste di 1500 m e più, con la valle nascosta di Petra sulla sua facciata occidentale. Il nome significa qualcosa come «peloso», un paese collinoso aspro e cespuglioso, e la Genesi vi gioca con Esaù, il fratello peloso. I testi egizi del XIII e XII secolo a.C. conoscono i nomadi Shasu di Seir, e una lettera da Gerusalemme nell’archivio di Amarna già nomina la terra. Una minoranza di studiosi legge Seir in alcuni passi come colline a ovest dell’Araba, a sud-ovest del Mar Morto; i più la tengono in Edom."
    - "Nella Genesi i Corriti vivono «nella loro montagna di Seir» quando i re orientali la attraversano; poi vi si stabilisce Esaù, «Ed Esaù abitò sulla montagna di Seir, Esaù è Edom», e i suoi figli scacciano i Corriti. Nella marcia da Kades a Israele è detto di passare il confine «de’ figliuoli d’Esaù, vostri fratelli, che dimorano in Seir» senza combattere, «giacché ho dato il monte di Seir a Esaù, come sua proprietà». Nella benedizione di Mosè e nel cantico di Debora l’Eterno esce da Seir come venne dal Sinai, e Balaam predice che «s’impadronirà di Seir, suo nemico»."
    - "Sotto i re Seir è un altro nome di Edom. Cinquecento Simeoniti andarono al Monte Seir e uccisero gli ultimi Amalechiti; ai giorni di Giosafat Ammon, Moab e «quelli del monte Seir» marciarono su Giuda e si distrussero a vicenda; Amazia uccise diecimila «de’ figliuoli di Seir» nella Valle del Sale e portò a casa i loro dèi per adorarli. Isaia ode una voce che grida «da Seir: “Sentinella, a che punto è la notte?”», ed Ezechiele volge la faccia contro il Monte Seir: «Io stenderò la mia mano contro di te, e ti renderò una solitudine, un deserto». L’archeologia mostra il regno edomita al culmine tra l’VIII e il VI secolo a.C., con la capitale Bosra (Buseirah) sull’altopiano, tributaria dell’Assiria."
    - "Dopo Edom vennero i Nabatei, la cui capitale Petra giace in una conca della catena, e poi la provincia romana d’Arabia. Oggi il Monte Seir è l’altopiano dei governatorati giordani di Tafilah e Ma‘an: Petra, patrimonio mondiale dal 1985, il castello crociato di Shobak, la riserva naturale di Dana sopra l’Araba e il Jebel Harun, la tradizionale tomba di Aronne, la vetta più alta sopra Petra."
  pl:
    - "Góra Seir to pasmo górskie Edomu na wschód od Araby, biegnące od wąwozu Zaredu (Wadi Hasa) na południe ku Zatoce Akaba: Dżabal asz-Szera w południowej Jordanii, mur z piaskowca i granitu wznoszący się z Araby do grzbietów o wysokości 1500 m i więcej, z ukrytą doliną Petry w jego zachodniej ścianie. Nazwa znaczy coś jak „kosmata”, szorstki, krzaczasty kraj wzgórz, a Księga Rodzaju gra nią z Ezawem, kosmatym bratem. Teksty egipskie z XIII i XII w. p.n.e. znają koczowników Szasu z Seiru, a list z Jerozolimy w archiwum z Amarna już wymienia ten kraj. Mniejszość uczonych czyta Seir w niektórych miejscach jako wzgórza na zachód od Araby, na południowy zachód od Morza Martwego; większość zostawia je w Edomie."
    - "W Księdze Rodzaju Choryci mieszkają „na górze ich Seir”, gdy przechodzą wschodni królowie; potem osiada tam Ezaw, „I mieszkał Ezaw na górze Seir, a ten Ezaw jest Edom”, a jego synowie wypędzają Chorytów. W drodze z Kadesz Izraelowi każe się przejść granicę „braci waszej, synów Ezawowych, którzy mieszkają w Seir” bez walki, „gdyżem w osiadłość dał Ezawowi górę Seir”. W błogosławieństwie Mojżesza i pieśni Debory Pan wychodzi z Seiru, tak jak przyszedł z Synaju, a Balaam przepowiada, że „Seir będzie pod władzą nieprzyjaciół swoich”."
    - "Za królów Seir jest inną nazwą Edomu. Pięciuset Symeonitów poszło na górę Seir i wybiło ostatnich Amalekitów; za Jozafata Ammon, Moab i mieszkańcy „góry Seir” wyruszyli na Judę i wybili się nawzajem; Amazjasz zabił dziesięć tysięcy „synów Seir” w Dolinie Soli i przyniósł ich bogów do domu, by im oddawać cześć. Izajasz słyszy: „Woła na mię ktoś z Seiru: Hej, stróżu! co się stało w nocy?”, a Ezechiel obraca twarz przeciw górze Seir: „a wyciągnę rękę moję na cię, i podam cię na wielkie spustoszenie”. Archeologia ukazuje królestwo Edomu u szczytu w VIII–VI w. p.n.e., ze stolicą Bosrą (Buseira) na płaskowyżu, płacące daninę Asyrii."
    - "Po Edomie przyszli Nabatejczycy, których stolica Petra leży w kotlinie pasma, a potem rzymska prowincja Arabia. Dziś Góra Seir to wyżyna jordańskich muhafaz Tafila i Ma'an: Petra, miejsce światowego dziedzictwa od 1985 r., zamek krzyżowców Shobak, rezerwat przyrody Dana nad Arabą i Dżabal Harun, tradycyjny grób Aarona, najwyższy szczyt nad Petrą."
  nl:
    - "De berg Seïr is het gebergte van Edom, ten oosten van de Araba, dat zich uitstrekt van de kloof van de Zered (Wadi Hasa) naar het zuiden richting de Golf van Akaba: de Jebel esh-Shera van zuidelijk Jordanië, een muur van zandsteen en graniet die uit de Araba oprijst tot kammen van 1.500 m en meer, met de verborgen vallei van Petra in zijn westwand. De naam betekent zoiets als “harig”, een ruw, bosrijk heuvelland, en Genesis speelt erop met Ezau, de harige broer. Egyptische teksten uit de dertiende en twaalfde eeuw v.Chr. kennen de Shasu-nomaden van Seïr, en een brief uit Jeruzalem in het Amarna-archief noemt het land al. Een minderheid van geleerden leest Seïr in sommige passages als heuvels ten westen van de Araba, ten zuidwesten van de Dode Zee; de meesten houden het in Edom."
    - "In Genesis wonen de Horieten “op hun gebergte Seir” wanneer de oostelijke koningen erdoorheen trekken; daarna vestigt Ezau zich daar: “Derhalve woonde Ezau op het gebergte Seir. Ezau is Edom.”, en zijn zonen verdrijven de Horieten. Op de tocht van Kades krijgt Israël te horen zonder strijd langs de grens te trekken “aan de landpale uwer broederen, de kinderen van Ezau, die in Seir wonen”, “want Ik heb Ezau het gebergte Seir ter erfenis gegeven”. In de zegen van Mozes en het lied van Debora trekt de HEER uit Seïr, zoals Hij uit Sinaï kwam, en Bileam voorspelt dat “Seir zal zijn vijanden een erfelijke bezitting zijn”."
    - "Onder de koningen is Seïr een andere naam voor Edom. Vijfhonderd Simeonieten trokken naar de berg Seïr en doodden de laatste Amalekieten; in Josafats dagen trokken Ammon, Moab en die van “het gebergte Seir” tegen Juda op en vernietigden elkaar; Amazia versloeg tienduizend “kinderen van Seir” in het Zoutdal en bracht hun goden thuis om ze te aanbidden. Jesaja hoort een stem roepen “uit Seir: Wachter! wat is er van den nacht?”, en Ezechiël richt zijn gezicht tegen de berg Seïr: “Ik zal Mijn hand tegen u uitstrekken, en zal u stellen tot een verwoesting en een strik”. De archeologie toont het Edomitische koninkrijk op zijn hoogtepunt in de achtste tot zesde eeuw v.Chr., met zijn hoofdstad Bozra (Buseira) op het plateau, schatting betalend aan Assyrië."
    - "Na Edom kwamen de Nabateeërs, wier hoofdstad Petra in een kom van het gebergte ligt, en daarna de Romeinse provincie Arabië. Tegenwoordig is de berg Seïr het hoogland van de Jordaanse gouvernementen Tafilah en Ma'an: Petra, werelderfgoed sinds 1985, het kruisvaarderskasteel van Shobak, het natuurreservaat Dana boven de Araba, en de Jebel Harun, het traditionele graf van Aäron, de hoogste piek boven Petra."
  cs:
    - "Hora Seír je pohoří Edómu, východně od Araby, táhnoucí se od soutěsky Zeredu (Wádí Hasa) na jih k Akabskému zálivu: Jebel aš-Šera v jižním Jordánsku, zeď z pískovce a žuly, která vystupuje z Araby na hřebeny 1500 m a víc, se skrytým údolím Petry v západní stěně. Jméno znamená asi „chlupatý“, drsná, křovinatá pahorkatina, a Genesis si s ním hraje s Ezauem, chlupatým bratrem. Egyptské texty ze 13. a 12. století př. n. l. znají nomády Šasu ze Seíru a dopis z Jeruzaléma v amarnském archivu už zemi jmenuje. Menšina badatelů čte Seír v některých místech jako pahorky západně od Araby, jihozápadně od Mrtvého moře; většina jej ponechává v Edómu."
    - "V Genesis žijí Choreovci „na hoře jich Seir“, když východní králové táhnou krajem; pak se tam usadí Ezau, „protož bydlil Ezau na hoře Seir; Ezau pak ten jest Edom“, a jeho synové vyženou Choreovce. Na pochodu z Kádeše je Izraeli řečeno, aby bez boje prošel pomezím „bratří svých synů Ezau, kteříž bydlí v Seir“, „proto že v dědictví Ezau dal jsem horu Seir“. V Mojžíšově požehnání a v Debořině písni vychází Hospodin ze Seíru, jako přišel ze Sinaje, a Bileám předpovídá, že „Seir v vládařstí přijde nepřátelům svým“."
    - "Za králů je Seír jiné jméno pro Edóm. Pět set Simeonovců šlo na horu Seír a zabilo poslední z Amalekitů; za Jozafata táhli Amón, Moáb a obyvatelé hory Seír na Judu a vyhubili se navzájem; Amacjáš pobil deset tisíc „synů Seir“ v Solném údolí a přivezl si domů jejich bohy, aby je uctíval. Izajáš slyší „hlas z Seir: Strážný, co bylo v noci?“ a Ezechiel obrací tvář proti hoře Seír: „vztáhnu ruku svou na tebe, a obrátím tě v hroznou poušť“. Archeologie ukazuje edómské království na vrcholu v 8. až 6. století př. n. l., s hlavním městem Bosrou (Buseirah) na plošině, platící tribut Asýrii."
    - "Po Edómu přišli Nabatejci, jejichž hlavní město Petra leží v kotlině pohoří, a pak římská provincie Arábie. Dnes je hora Seír vysočina jordánských guvernorátů Tafíla a Ma'án: Petra, od roku 1985 památka světového dědictví, křižácký hrad Šobak, přírodní rezervace Dana nad Arabou a Jebel Harun, tradiční hrob Áronův, nejvyšší vrchol nad Petrou."
  sv:
    - "Seirs berg är Edoms bergskedja, öster om Arava, som löper från Seredklyftan (Wadi Hasa) söderut mot Akababukten: södra Jordaniens Jebel esh-Shera, en vägg av sandsten och granit som reser sig från Arava till krön på 1 500 m och mer, med Petras dolda dal i dess västra sida. Namnet betyder ungefär ”luden”, ett kuperat, buskigt bergsland, och Första Moseboken leker med det genom Esau, den håriga brodern. Egyptiska texter från 1200- och 1100-talen f.Kr. känner shasunomaderna i Seir, och ett brev från Jerusalem i Amarnaarkivet nämner redan landet. En minoritet av forskare läser Seir på vissa ställen som höjder väster om Arava, sydväst om Döda havet; de flesta håller det i Edom."
    - "I Första Moseboken bor horéerna ”på deras berg Seir” när de östliga konungarna drar fram; sedan bosätter sig Esau där: ”Och Esau bosatte sig i Seirs bergsbygd. Esau, det är densamme som Edom”, och hans söner fördriver horéerna. På marschen från Kadesh får Israel veta att de skall passera gränsen för ”edra bröder, Esaus barn, vilka bo i Seir” utan strid, ”eftersom jag redan har givit Seirs bergsbygd till besittning åt Esau”. I Moses välsignelse och Deboras sång går HERREN fram från Seir som han kom från Sinai, och Bileam förutsäger att Seir skall bli en besittning åt hans fiender."
    - "Under kungarna är Seir ett annat namn på Edom. Femhundra simeoniter gick till Seirs berg och dräpte de sista amalekiterna; på Josafats tid tågade Ammon, Moab och ”Seirs bergsbygd” mot Juda och förgjorde varandra; Amasja dräpte tio tusen ”Seirs barn” i Saltdalen och förde hem deras gudar för att dyrka dem. Jesaja hör en röst ropa ”från Seir: »Väktare, vad lider natten?»”, och Hesekiel vänder sitt ansikte mot Seirs berg: ”Se, jag skall komma över dig, du Seirs berg, och uträcka min hand mot dig och göra dig öde och tomt”. Arkeologin visar det edomitiska kungariket på sin höjdpunkt på 700- till 500-talen f.Kr., med huvudstaden Bosra (Buseirah) på platån, skattskyldigt till Assyrien."
    - "Efter Edom kom nabateerna, vars huvudstad Petra ligger i ett bäcken i kedjan, och sedan Roms provins Arabien. I dag är Seirs berg höglandet i de jordanska guvernementen Tafilah och Ma'an: Petra, världsarv sedan 1985, korsfararslottet Shobak, naturreservatet Dana ovanför Arava, och Jebel Harun, Arons traditionella grav, den högsta toppen ovanför Petra."
  nb:
    - "Seirfjellet er Edoms fjellkjede, øst for Arava, som løper fra kløften Sered (Wadi Hasa) sørover mot Akababukta: Jebel esh-Shera i det sørlige Jordan, en vegg av sandstein og granitt som stiger fra Arava til kammer på 1500 m og mer, med Petras skjulte dal i sin vestside. Navnet betyr noe i retning av «lodden», et ulendt, buskrikt åsland, og Første Mosebok leker med det i Esau, den lodne broren. Egyptiske tekster fra 1200- og 1100-tallet f.Kr. kjenner shasu-nomadene i Se'ir, og et brev fra Jerusalem i Amarna-arkivet nevner allerede landet. En minoritet av forskere leser Se'ir i noen avsnitt som åser vest for Arava, sørvest for Dødehavet; de fleste holder det i Edom."
    - "I Første Mosebok bor horittene «på deres fjell - Se'ir-fjellene» da de østlige kongene feier gjennom; så bosetter Esau seg der, «Så bosatte Esau sig i Se'ir-fjellene - Esau, det er den samme som Edom», og hans sønner driver ut horittene. På marsjen fra Kadesj får Israel beskjed om å passere grensen til «eders brødre Esaus barn, som bor i Se'ir» uten kamp, «for jeg har gitt Esau Se'ir-fjellene til eiendom». I Moses' velsignelse og Deboras sang drar Herren ut fra Se'ir slik han kom fra Sinai, og Bileam forutsier at «Se'ir, hans fiende, blir ham underlagt»."
    - "Under kongene er Se'ir et annet navn på Edom. Fem hundre simeonitter dro til Se'ir-fjellene og drepte resten av amalekittene; i Josjafats dager marsjerte Ammon, Moab og «folket fra Se'ir-fjellet» mot Juda og ødela hverandre; Amasja hugg ned «ti tusen mann av Se'irs barn» i Saltdalen og førte guddommene deres hjem for å tilbe dem. Jesaja hører en røst: «Til mig roper de fra Se'ir: Vekter! Hvor langt er det på natten?», og Esekiel vender sitt åsyn mot Seirfjellet: «jeg vil rekke ut min hånd mot dig og gjøre dig til en ørken, en ødemark». Arkeologien viser det edomittiske kongeriket på sitt høydepunkt på 700- til 500-tallet f.Kr., med hovedstaden Bosra (Buseirah) på høylandet, betalende tributt til Assyria."
    - "Etter Edom kom nabateerne, hvis hovedstad Petra ligger i en forsenkning i kjeden, og så Romas provins Arabia. I dag er Seirfjellet høylandet i de jordanske guvernementene Tafilah og Ma'an: Petra, verdensarvsted siden 1985, korsfarerslottet Shobak, naturreservatet Dana over Arava, og Jebel Harun, Arons tradisjonelle grav, den høyeste toppen over Petra."
  tl:
    - "Ang Bundok Seir ay ang hanay ng bundok ng Edom, sa silangan ng Araba, na tumatakbo mula sa bangin ng Zered (Wadi Hasa) patimog patungo sa Golpo ng Aqaba: ang Jebel esh-Shera ng timog Jordan, pader ng batong buhangin at granito na tumataas mula sa Araba hanggang sa mga tuktok na 1,500 m at higit pa, na may nakatagong libis ng Petra sa kanlurang mukha nito. Ang pangalan ay nangangahulugang “mabalahibo”, magaspang na maraming palumpong na maburol na lupain, at naglalaro rito ang Genesis kay Esau, ang mabalahibong kapatid. Kilala ng mga tekstong Egipcio noong ika-13 at ika-12 siglo BK ang mga nomadang Shasu ng Seir, at pinangalanan na ng isang liham mula sa Jerusalem sa arkibo ng Amarna ang lupain. Binabasa ng isang minorya ng iskolar ang Seir sa ilang talata bilang mga burol sa kanluran ng Araba, sa timog-kanluran ng Dagat na Patay; pinananatili ito ng karamihan sa Edom."
    - "Sa Genesis, nakatira ang mga Horeo “sa kanilang kabundukan ng Seir” nang lumusob ang mga hari sa silangan; pagkatapos ay nanirahan doon si Esau, “tumahan si Esau sa bundok ng Seir: si Esau ay siyang Edom”, at pinalayas ng kaniyang mga anak ang mga Horeo. Sa martsa mula sa Cades, sinabihan ang Israel na dumaan sa hangganan ng “inyong mga kapatid na mga anak ni Esau, na tumatahan sa Seir” nang walang labanan, sapagkat “ibinigay ko kay Esau, na pinakaari ang bundok ng Seir”. Sa pagpapala ni Moises at awit ni Debora, lumalabas ang Panginoon mula sa Seir gaya ng pagdating niya mula sa Sinai, at inihula ni Balaam na “Ang Seir man ay magiging pag-aari niya, na siyang dating kaniyang mga kaaway”."
    - "Sa ilalim ng mga hari, ang Seir ay ibang pangalan ng Edom. Limang daang Simeonita ang pumunta sa Bundok Seir at pinatay ang huli sa mga Amalecita; sa kapanahunan ni Josaphat, sinalakay ng Ammon, Moab at “bundok ng Seir” ang Juda at pinuksa ang isa't isa; pinatay ni Amasias ang sampung libong “mga anak ni Seir” sa Libis ng Asin at inuwi ang kanilang mga diyos upang sambahin. Naririnig ni Isaias ang tumatawag “mula sa Seir, Bantay, anong nangyari sa gabi?”, at itinitig ni Ezekiel ang kaniyang mukha sa Bundok Seir: “aking iniunat ang aking kamay laban sa iyo, at gagawin kitang sira at katigilan”. Ipinapakita ng arkeolohiya ang kahariang Edomita sa tugatog noong ika-8 hanggang ika-6 na siglo BK, na may kabiserang Bozra (Buseirah) sa talampas, na nagbabayad ng tributo sa Asiria."
    - "Pagkatapos ng Edom ay dumating ang mga Nabateo, na ang kabisera nilang Petra ay nasa palanggana ng hanay, at pagkatapos ay ang lalawigang Romano ng Arabia. Ang Bundok Seir ngayon ay ang kabundukan ng mga gobernorado ng Jordan na Tafilah at Ma'an: ang Petra, Pandaigdigang Pamanang Pook mula 1985, ang kastilyong Krusado ng Shobak, ang reserbang pangkalikasan ng Dana sa itaas ng Araba, at Jebel Harun, ang tradisyonal na libingan ni Aaron, ang pinakamataas na tuktok sa itaas ng Petra."
  da:
    - "Se'irs bjerg er Edoms bjergkæde, øst for Araba, der løber fra kløften ved Zered (Wadi Hasa) mod syd mod Akababugten: Jebel esh-Shera i det sydlige Jordan, en væg af sandsten og granit, der hæver sig fra Araba til kamme på 1.500 m og mere, med Petras skjulte dal i dens vestlige side. Navnet betyder noget i retning af »hårret«, et ujævnt, buskrigt bjergland, og Første Mosebog spiller på det med Esau, den hårede bror. Egyptiske tekster fra 1200- og 1100-tallet f.Kr. kender Shasu-nomaderne fra Se'ir, og et brev fra Jerusalem i Amarna-arkivet nævner allerede landet. En minoritet af forskere læser Se'ir i nogle passager som bakker vest for Araba, sydvest for Det Døde Hav; de fleste beholder det i Edom."
    - "I Første Mosebog bor horitterne »paa deres Bjerg Sejr«, da østens konger fejer igennem; derpå bosætter Esau sig dér: »Saa boede Esau paa det Bjerg Sejr; Esau, det er Edom«, og hans sønner fordriver horitterne. På march fra Kadesj får Israel besked om at passere grænsen for »eders Brødres, Esaus Børns, Landemærke, de som bo i Seir« uden kamp, »fordi jeg har givet Esau Seirs Bjerg til Ejendom«. I Moses' velsignelse og Deboras sang kommer Herren frem fra Se'ir, som han kom fra Sinaj, og Bileam forudsiger, at »Sejr, hans Fjende, skal være hans Ejendom«."
    - "Under kongerne er Se'ir et andet navn for Edom. Fem hundrede simeonitter drog til Se'irs bjerg og dræbte de sidste af amalekitterne; i Josafats dage marcherede Ammon, Moab og dem »fra Sejrs Bjerg« mod Juda og ødelagde hinanden; Amazja dræbte ti tusind »Sejrs Børn« i Saltdalen og bragte deres guder hjem for at tilbede dem. Esajas hører en røst, der råber til ham »fra Seir: Vægter, hvordan skrider Natten?«, og Ezekiel vender sit ansigt mod Se'irs bjerg: »jeg vil udrække min Haand imod dig og gøre dig til en Ødelæggelse og en Ørk«. Arkæologien viser Edoms kongerige på sit højdepunkt i 700- til 500-tallet f.Kr., med hovedstaden Bosra (Buseirah) på højsletten, betalende tribut til Assyrien."
    - "Efter Edom kom nabatæerne, hvis hovedstad Petra ligger i et bassin i kæden, og siden Roms provins Arabien. I dag er Se'irs bjerg højlandet i de jordanske guvernementer Tafilah og Ma'an: Petra, verdensarvssted siden 1985, korsfarerborgen Shobak, Dana-naturreservatet over Araba og Jebel Harun, Arons traditionelle grav, den højeste top over Petra."
  sr:
    - "Сеир је планински ланац Едома, источно од Араве, који се протеже од кланца Зареда (Вади Хаса) на југ према Акапском заливу: Џебел еш-Шера јужног Јордана, зид од пешчара и гранита који се диже из Араве до гребена од 1500 м и више, са скривеном долином Петре на западној страни. Име значи нешто као „длакав“, груба, шибљем обрасла брдовита земља, а Књига Постања се игра њиме с Исавом, длакавим братом. Египатски текстови XIII и XII века п. н. е. знају номаде Шасу из Сеира, а писмо из Јерусалима у амарнском архиву већ именује земљу. Мањина научника чита Сеир у неким одломцима као брда западно од Араве, југозападно од Мртвог мора; већина га задржава у Едому."
    - "У Књизи Постања Хореји живе „у планини њиховој Сиру“ када источни цареви пролазе; затим се ту настањује Исав, „И Исав живеше на планини Сиру Исав је Едом“, а његови синови истерују Хореје. На маршу од Кадиса Израиљу је речено да прође границу „браће своје, синова Исавових, који живе у Сиру“ без борбе, „јер сам дао Исаву гору Сир у наследство“. У Мојсијевом благослову и Девориној песми Господ излази из Сира као што је дошао са Синаја, а Валам прориче: „и Сира ће освојити непријатељи његови“."
    - "Под царевима Сеир је друго име за Едом. Пет стотина Симеунаца отишло је на гору Сеир и побило последње Амаличане; у Јосафатово доба Амон, Моав и они „из горе Сира“ кренули су на Јуду и уништили једни друге; Амасија је у Долини сланој побио десет хиљада „синова Сирових“ и донео њихове богове кући да им се клања. Исаија чује глас како зове: „Виче к мени неко са Сира: Стражару! Шта би ноћас?“, а Језекиљ окреће лице против горе Сеир: „И дигнућу руку своју на те, и опустећу те сасвим“. Археологија показује едомско краљевство на врхунцу у VIII–VI веку п. н. е., с престоницом Восором (Бусејра) на висоравни, које плаћа данак Асирији."
    - "После Едома дошли су Набатејци, чија престоница Петра лежи у котлини ланца, а затим римска провинција Арабија. Данас је Сеир висораван јорданских гувернората Тафила и Маан: Петра, место светске баштине од 1985, крсташки замак Шобак, природни резерват Дана изнад Араве и Џебел Харун, традиционални Аронов гроб, највиши врх изнад Петре."
  hu:
    - "A Széir-hegy Edom hegylánca az Arábá keleti oldalán, amely a Zéred szurdokától (Wadi Hasa) dél felé, az Akabai-öböl irányába húzódik: a dél-jordániai Jebel esh-Shera homokkőből és gránitból álló fal, amely az Arábából 1500 méteres és annál is magasabb gerincekig emelkedik, nyugati oldalában Petra rejtett völgyével. A név jelentése nagyjából „szőrös”, azaz kopár, bozótos dombvidék, és Mózes első könyve ezzel játszik, amikor Ézsauról, a szőrös testvérről szól. A Kr. e. 13. és 12. század egyiptomi szövegei ismerik a széiri sászu nomádokat, és az amarnai levéltár egy jeruzsálemi levele már megnevezi a földet. A kutatók egy kisebb része egyes szakaszokban Széirt az Arábától nyugatra, a Holt-tengertől délnyugatra fekvő dombvidéknek olvassa; a legtöbben Edomban helyezik el."
    - "Mózes első könyvében a hóriak „az ő hegyökön, a Seiren” élnek, amikor a keleti királyok végigvonulnak a vidéken; azután Ézsau telepedik le ott: „Letelepedék tehát Ézsaú a Széir hegyén. Ézsaú pedig az Edóm”, fiai pedig kiűzik a hóriakat. A Kádesből induló menetelés során Izráelnek azt mondják, hogy harc nélkül haladjon át „a ti atyátokfiainak, az Ézsaú fiainak határán, a kik Szeirben lakoznak”, „mert Ézsaúnak adtam a Szeir hegyét örökségül”. Mózes áldásában és Debóra énekében az Úr úgy jön elő Széirből, ahogyan a Sínairól jött, Bálám pedig megjövendöli, hogy „Szeir az ő ellensége is másnak birtoka lesz”."
    - "A királyok korában Széir Edom másik neve. Ötszáz simeonita a Széir-hegyre ment, és megölte az amálekiták utolsó maradékát; Jósafát napjaiban Ammon, Moáb és „a Seir hegyén lakozók” Júda ellen vonultak, és egymást pusztították el; Amácja a Sóvölgyben tízezer „Seir fiát” vert le, és isteneiket hazavitte, hogy imádja őket. Ézsaiás ezt hallja: „Seirből így kiáltnak hozzám: Vigyázó! meddig még az éjszaka, meddig még ez éj?”, Ezékiel pedig a Széir-hegy ellen fordítja arcát: „Ímé, én ellened megyek, Seir hegye, és kinyújtom kezemet reád, s teszlek pusztaságok pusztaságává”. A régészet az edomi királyságot virágkorában a Kr. e. 8–6. században mutatja, fővárosával, Boszrával (Buseirah) a fennsíkon, amely adót fizetett Asszíriának."
    - "Edom után a nabateusok jöttek, akiknek fővárosa, Petra a hegylánc egyik medencéjében fekszik, majd Róma Arábia provinciája. Ma a Széir-hegy a jordániai Tafilah és Ma'an kormányzóság hegyvidéke: Petra, amely 1985 óta világörökségi helyszín, a keresztesek Shobak-vára, az Arábá fölötti Dana természetvédelmi terület és a Jebel Harun, Áron hagyományos sírja, a Petra fölötti legmagasabb csúcs."
  fi:
    - "Seirvuori on Edomin vuorijono Araban itäpuolella. Se ulottuu Seredin rotkosta (Wadi Hasa) etelään kohti Akabanlahtea: se on Etelä-Jordanian Jebel esh-Shera, hiekkakivestä ja graniitista muodostunut muuri, joka kohoaa Arabasta 1 500 m:n ja sitä korkeammille harjanteille ja jonka läntisellä rinteellä on Petran kätketty laakso. Nimi merkitsee jotakuinkin ”karvaista”, karua ja pensaikkoista vuorimaata, ja 1. Mooseksen kirja leikittelee sillä Eesaun, karvaisen veljen, kohdalla. Egyptiläiset tekstit 1200- ja 1100-luvuilta eaa. tuntevat Seirin shasu-paimentolaiset, ja Amarnan arkiston kirje Jerusalemista mainitsee maan jo nimeltä. Vähemmistö tutkijoista lukee Seirin eräissä kohdissa Araban länsipuolisiksi, Kuolleenmeren lounaispuolella oleviksi kukkuloiksi; useimmat pitävät sen Edomissa."
    - "1. Mooseksen kirjassa hoorilaiset asuvat ”heidän vuoristossaan, Seirissä”, kun idän kuninkaat vyöryvät ohi; sitten Esau asettuu sinne: ”Ja Eesau asettui Seirin vuoristoon, Eesau, se on Edom”, ja hänen poikansa karkottavat hoorilaiset. Kadeksesta lähtevää Israelia käsketään kulkemaan taistelematta rajan ylitse ”Seirissä asuvien veljienne, Eesaun jälkeläisten” alueella, ”koska minä olen antanut Seirin vuoriston Eesaun omaksi”. Mooseksen siunauksessa ja Deboran laulussa Herra lähtee Seiristä niin kuin tuli Siinailta, ja Bileam ennustaa: ”Seir joutuu vihollistensa omaksi”."
    - "Kuninkaiden aikana Seir on toinen nimi Edomille. Viisisataa simeonilaista meni Seirvuorelle ja surmasi amalekilaisten viimeiset; Josafatin päivinä ammonilaiset, moabilaiset ja Seirin vuoriston asukkaat hyökkäsivät Juudaa vastaan ja tuhosivat toisensa; Amasja surmasi Suolalaaksossa ”seiriläisiä kymmenen tuhatta” ja toi heidän jumalansa kotiin kumartaakseen niitä. Jesaja kuulee huudon ”Seiristä: Vartija, mikä hetki yöstä on?”, ja Hesekiel kääntää kasvonsa Seirvuorta vastaan: ”ojennan käteni sinua vastaan ja teen sinut autioksi ja hävitetyksi”. Arkeologia osoittaa edomilaisen kuningaskunnan olleen huipussaan 700-luvulta 500-luvulle eaa.; sen pääkaupunki Bosra (Buseirah) oli ylätasangolla, ja se maksoi veroa Assyrialle."
    - "Edomin jälkeen tulivat nabatealaiset, joiden pääkaupunki Petra on vuorijonon altaassa, ja sitten Rooman Arabian provinssi. Nykyään Seirvuori on Jordanian Tafilahin ja Ma'anin kuvernementtien ylänkö: Petra, joka on ollut maailmanperintökohde vuodesta 1985, ristiretkeläisten Shobakin linna, Danan luonnonsuojelualue Araban yläpuolella ja Jebel Harun, Aaronin perinteinen hauta ja Petran yläpuolella kohoava korkein huippu."
  vi:
    - "Núi Sê-i-rơ là dãy núi của Ê-đôm, ở phía đông A-ra-ba, chạy từ hẻm núi Xê-rết (Wadi Hasa) về phía nam hướng tới vịnh Aqaba: tức Jebel esh-Shera ở miền nam Jordan, một bức tường sa thạch và đá granit nhô lên từ A-ra-ba tới những đỉnh cao từ 1.500 m trở lên, với thung lũng Petra ẩn mình ở sườn tây. Tên gọi có nghĩa đại khái là “nhiều lông”, một vùng đồi núi gồ ghề, rậm bụi, và sách Sáng Thế Ký chơi chữ với tên này qua Ê-sau, người anh nhiều lông. Các văn bản Ai Cập thế kỷ 13 và 12 TCN biết đến những người du mục Shasu của Sê-i-rơ, và một bức thư từ Giê-ru-sa-lem trong kho lưu trữ Amarna đã nhắc đến vùng đất này. Một thiểu số học giả đọc Sê-i-rơ ở một số đoạn là vùng đồi phía tây A-ra-ba, tây nam Biển Chết; đa số vẫn đặt nó ở Ê-đôm."
    - "Trong sách Sáng Thế Ký, người Hô-rít sống “tại núi Sê-i-rơ” khi các vua phương đông tràn qua; sau đó Ê-sau định cư ở đó: “Ê-sau, tức là Ê-đôm, ở trên núi Sê-i-rơ”, và các con trai ông đuổi người Hô-rít đi. Trên đường đi từ Ca-đe, dân Y-sơ-ra-ên được truyền phải đi qua địa phận của “anh em mình, tức là con cháu Ê-sau, ở tại Sê-i-rơ” mà không giao chiến, vì “Ta đã ban cho Ê-sau núi Sê-i-rơ làm sản nghiệp”. Trong lời chúc phước của Môi-se và bài ca của Đê-bô-ra, Đức Giê-hô-va từ Sê-i-rơ ra, như Ngài đã đến từ Si-na-i, còn Ba-la-am báo trước: “Sẽ được Sê-i-rơ, là kẻ thù nghịch mình, làm sản nghiệp”."
    - "Dưới thời các vua, Sê-i-rơ là một tên khác của Ê-đôm. Năm trăm người Si-mê-ôn tiến đến núi Sê-i-rơ và giết nốt những người A-ma-léc còn sót lại; vào đời Giô-sa-phát, dân Am-môn, dân Mô-áp và “những kẻ ở núi Sê-i-rơ” tiến đánh Giu-đa rồi tiêu diệt lẫn nhau; A-ma-xia đánh giết “một vạn người của dân Sê-i-rơ” ở Trũng Muối và đem các thần của họ về thờ. Ê-sai nghe tiếng kêu “từ Sê-i-rơ”: “Hỡi người canh, đêm thể nào?”, còn Ê-xê-chi-ên hướng mặt về núi Sê-i-rơ: “Ta sẽ giá tay nghịch cùng mầy, làm cho mầy ra hoang vu và gở lạ”. Khảo cổ học cho thấy vương quốc Ê-đôm đạt đến đỉnh cao vào các thế kỷ 8 đến 6 TCN, với kinh đô Bốt-ra (Buseirah) trên cao nguyên, nộp cống cho A-si-ri."
    - "Sau Ê-đôm là người Nabataea, có kinh đô Petra nằm trong một lòng chảo của dãy núi, rồi đến tỉnh A-ra-bi của La Mã. Ngày nay núi Sê-i-rơ là vùng cao nguyên của các tỉnh Tafilah và Ma'an của Jordan: Petra, di sản thế giới từ năm 1985, lâu đài Shobak của quân Thập tự chinh, khu bảo tồn thiên nhiên Dana phía trên A-ra-ba, và Jebel Harun, ngôi mộ truyền thống của A-rôn, đỉnh cao nhất phía trên Petra."
  ro:
    - "Muntele Seir este lanțul muntos al Edomului, la est de Araba, care se întinde de la cheile Zeredului (Wadi Hasa) spre sud, către Golful Aqaba: Jebel esh-Shera din sudul Iordaniei, un zid de gresie și granit care se ridică din Araba până la creste de 1500 m și mai mult, cu valea ascunsă a Petrei pe versantul vestic. Numele înseamnă aproximativ „păros”, o țară deluroasă aspră și acoperită de tufișuri, iar Geneza face un joc de cuvinte pe seama lui cu Esau, fratele păros. Texte egiptene din secolele al XIII-lea și al XII-lea î.Hr. îi cunosc pe nomazii șasu din Seir, iar o scrisoare de la Ierusalim din arhiva de la Amarna pomenește deja acest ținut. O minoritate de cercetători înțeleg Seirul, în unele pasaje, ca pe dealurile de la vest de Araba, la sud-vest de Marea Moartă; cei mai mulți îl păstrează în Edom."
    - "În Geneza, horiții locuiesc în munții Seir când regii din răsărit străbat țara; apoi Esau se stabilește acolo: „a lăcuit Isav în muntele Seir. Isav acesta este Edom”, iar fiii lui îi alungă pe horiți. În marșul de la Cades, Israelului i se spune să treacă fără luptă prin hotarele „fraților voștri, fiii lui Isav, carii lăcuesc în Siir”, „pentrucă moștenire am dat fiilor lui Isav muntele Siir”. În binecuvântarea lui Moise și în cântarea Deborei, Domnul vine din Seir, așa cum a venit de la Sinai, iar Balaam prevestește că Seir va fi și el stăpânirea dușmanilor lui."
    - "Sub regi, Seir este un alt nume pentru Edom. Cinci sute de simeoniți au mers la muntele Seir și i-au ucis pe ultimii amalechiți; pe vremea lui Iosafat, Amon, Moab și locuitorii muntelui Seir au pornit împotriva lui Iuda și s-au nimicit unii pe alții; Amația a bătut în Valea Sării „pre fiii lui Siir, zece mii” și a adus acasă zeii lor ca să li se închine. Isaia aude un glas care strigă din Seir, întrebând de străjer ce mai e din noapte, iar Ezechiel își întoarce fața împotriva muntelui Seir: „voiu întinde mâna mea preste tine, și te voiu dà pustiu”. Arheologia arată regatul edomit la apogeu în secolele al VIII-lea–al VI-lea î.Hr., cu capitala la Boțra (Buseirah), pe platou, plătind tribut Asiriei."
    - "După Edom au venit nabateenii, a căror capitală, Petra, se află într-o depresiune a lanțului, și apoi provincia romană Arabia. Astăzi muntele Seir este zona înaltă a guvernoratelor iordaniene Tafila și Ma'an: Petra, sit al Patrimoniului Mondial din 1985, castelul cruciat Shobak, rezervația naturală Dana de deasupra Arabei și Jebel Harun, mormântul tradițional al lui Aaron, cel mai înalt vârf de deasupra Petrei."
  bg:
    - "Планината Сеир е планинската верига на Едом на изток от Арава, която се простира от клисурата на Заред (Уади Хаса) на юг към залива Акаба: Джебел еш-Шера в Южна Йордания, стена от пясъчник и гранит, издигаща се над Арава до била от 1500 м и повече, със скритата долина на Петра в западния ѝ склон. Името означава нещо като „космат“ — сурова, обрасла с храсти планинска страна, и Битие обиграва това с Исав, косматия брат. Египетски текстове от XIII и XII в. пр.н.е. познават номадите шасу от Сеир, а едно писмо от Йерусалим в архива от Амарна вече назовава тази земя. Малцина учени разбират Сеир в някои пасажи като хълмовете на запад от Арава, югозападно от Мъртво море; повечето го оставят в Едом."
    - "В Битие хорейците живеят „в гората им Сиир“, когато източните царе минават през тази земя; после там се заселва Исав — „И насели се Исав на гората Сиир. Исав е Едом.“ — и синовете му прогонват хорейците. По пътя от Кадеш на Израил е заповядано да мине без бой през пределите на „братята си синовете Исавови, които живеят в Сиир“, „защото на Исава дадох гората Сиир в наследие“. В благословението на Мойсей и в песента на Девора Господ идва от Сеир, както е дошъл от Синай, а Валаам предрича, че „Сиир ще бъде притежание на враговете си“."
    - "При царете Сеир е друго име на Едом. Петстотин мъже от Симеоновото племе отишли в планината Сеир и избили остатъка от амаликитяните; в дните на Йосафат Амон, Моав и жителите на „гората Сиир“ тръгнали срещу Юда и се изтребили помежду си; Амасия поразил десет хиляди от „Сиировите синове“ в Солната долина и донесъл боговете им у дома, за да им се кланя. Исаия чува глас, който вика „от Сиир: Стражу, що ново за нощта?“, а Йезекиил обръща лицето си против планината Сеир: „ще простра ръката си против тебе, и ще те предам в опустошение и пустота“. Археологията показва Едомското царство в разцвета му през VIII–VI в. пр.н.е., със столица Восор (Бусейра) на платото, плащащо данък на Асирия."
    - "След Едом дошли набатейците, чиято столица Петра лежи в котловина на веригата, а после римската провинция Арабия. Днес планината Сеир е планинската област на йорданските губернаторства Тафила и Маан: Петра, обект на световното наследство от 1985 г., кръстоносната крепост Шобак, резерватът Дана над Арава и Джебел Харун — традиционният гроб на Аарон, най-високият връх над Петра."
