# Overview article (ADR 0007). Mainstream facts only; the view that some passages place Seir west of the Arabah is named as a minority one.
id: mount-seir
place: ae981db
title:
  en: "Mount Seir"
  ru: "Гора Сеир"
body:
  en:
    - "Mount Seir is the mountain range of Edom, east of the Arabah, running from the gorge of the Zered (Wadi Hasa) south toward the Gulf of Aqaba: the Jebel esh-Shera of southern Jordan, a wall of sandstone and granite that rises from the Arabah to crests of 1,500 m and more, with the hidden valley of Petra in its western face. The name means something like “hairy”, a rough, bushy hill country, and Genesis plays on it with Esau, the hairy brother. Egyptian texts of the thirteenth and twelfth centuries BC know the Shasu nomads of Seir, and a letter from Jerusalem in the Amarna archive already names the land. A minority of scholars read Seir in some passages as hills west of the Arabah, south-west of the Dead Sea; most keep it in Edom."
    - "In Genesis the Horites live “in their mount Seir” when the eastern kings sweep through; then Esau settles there, “Thus dwelt Esau in mount Seir: Esau is Edom”, and his sons drive out the Horites. On the march from Kadesh Israel is told to pass the border of “your brethren the children of Esau, which dwell in Seir” without a fight, “because I have given mount Seir unto Esau for a possession”. In the blessing of Moses and the song of Deborah the LORD comes forth from Seir as he came from Sinai, and Balaam foretells that “Seir also shall be a possession for his enemies”."
    - "Under the kings Seir is another name for Edom. Five hundred Simeonites went to Mount Seir and killed the last of the Amalekites; in Jehoshaphat's day Ammon, Moab and “mount Seir” marched on Judah and destroyed one another; Amaziah slew ten thousand “children of Seir” in the Valley of Salt and brought their gods home to worship. Isaiah hears a voice calling “out of Seir, Watchman, what of the night?”, and Ezekiel sets his face against Mount Seir: “I will stretch out mine hand against thee, and I will make thee most desolate”. Archaeology shows the Edomite kingdom at its height in the eighth to sixth centuries BC, with its capital Bozrah (Buseirah) on the plateau, paying tribute to Assyria."
    - "After Edom came the Nabataeans, whose capital Petra lies in a basin of the range, and then Rome's province of Arabia. Today Mount Seir is the highland of the Jordanian governorates of Tafilah and Ma'an: Petra, a World Heritage Site since 1985, the Crusader castle of Shobak, the Dana nature reserve above the Arabah, and Jebel Harun, the traditional tomb of Aaron, the highest peak above Petra."
  ru:
    - "Гора Сеир — горная цепь Едома к востоку от Аравы, тянущаяся от ущелья Зареда (Вади-Хаса) на юг к заливу Акаба: Джебель-эш-Шера на юге Иордании, стена песчаника и гранита, поднимающаяся над Аравой до гребней в 1500 м и выше, со скрытой долиной Петры на западном склоне. Имя значит примерно «косматый», неровная, поросшая кустарником страна, и Книга Бытия обыгрывает его в рассказе о косматом Исаве. Египетские тексты XIII–XII веков до н. э. знают кочевников-шасу из Сеира, а письмо из Иерусалима в Амарнском архиве уже называет эту землю. Меньшинство учёных читает Сеир в некоторых местах как горы к западу от Аравы, юго-западнее Мёртвого моря; большинство оставляет его в Едоме."
    - "В Книге Бытия Хорреи живут «в горе их Сеире», когда через неё проходят восточные цари; затем здесь селится Исав, «Исав, он же Едом», и его сыновья изгоняют Хорреев. На пути от Кадеса Израилю велено пройти пределы «братьев ваших, сынов Исавовых, живущих на Сеире», не воюя, «потому что гору Сеир Я дал во владение Исаву». В благословении Моисея и в песни Деворы Господь открывается от Сеира, как пришёл от Синая, а Валаам предрекает: «Сеир будет под владением врагов своих»."
    - "При царях Сеир — другое имя Едома. Пятьсот человек из колена Симеонова пошли к горе Сеир и побили остаток Амаликитян; во дни Иосафата Аммонитяне, Моавитяне и обитатели горы Сеира вышли на Иудею и истребили друг друга; Амасия побил «сынов Сеира» десять тысяч на долине Соляной и принёс их богов к себе, чтобы им кланяться. Исаия слышит крик с Сеира: «сторож! сколько ночи?», а Иезекииль обращает лицо к горе Сеир: «простру на тебя руку Мою и сделаю тебя пустою и необитаемою». Археология показывает Едомское царство в расцвете в VIII–VI веках до н. э., со столицей Восорой (Бусейрой) на плато, платившее дань Ассирии."
    - "После Едома пришли Набатеи, чья столица Петра лежит в котловине этой цепи, а затем римская провинция Аравия. Сегодня гора Сеир — нагорье иорданских провинций Эт-Тафила и Маан: Петра, объект Всемирного наследия с 1985 года, крестоносный замок Шобак, заповедник Дана над Аравой и Джебель-Харун, традиционная гробница Аарона, высочайшая вершина над Петрой."
