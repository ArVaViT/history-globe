body:
  en:
    - "Mamre is the place by Hebron where Abraham pitched his tent under the terebinths, or oaks, and built an altar. Genesis names it after Mamre the Amorite, Abraham's ally against the four kings, and makes it the home of the patriarchs: here the Lord appeared to Abraham “in the plains of Mamre” as he sat in the tent door, and three men were fed and promised Sarah a son; the cave of Machpelah, where Sarah, Abraham, Isaac, Rebekah, Leah and Jacob were buried, lay in the field “before Mamre: the same is Hebron”; and Jacob came home “unto Isaac his father unto Mamre, unto the city of Arbah, which is Hebron”."
    - "Since Herod's day the site shown has been Ramat el-Khalil, some 3-4 km north of Hebron, where an enclosure of great drafted stones, about 65 by 50 m, surrounds a well and the place of a tree; most scholars take the enclosure for Herod's work. Josephus knew a terebinth near Hebron said to be as old as the world. After the Bar Kokhba war, Jerome says, Hadrian sold Jewish captives at the market of the Terebinth here, and the enclosure was rebuilt in his reign. The emperor Constantine, told by his mother-in-law Eutropia that pagans sacrificed on the holy ground, ordered the idols burned and a basilica built, which Eusebius describes; Sozomen tells how Jews, pagans and Christians still met every summer at the fair of the terebinth, each honouring the place in their own way. The German excavations of 1926-28 uncovered the enclosure and Constantine's church."
    - "A rival tradition holds to the Oak of Abraham 2 km west of Hebron, a great Palestine oak bought by the Russian church in 1868, where the Holy Trinity monastery stands; the old trunk has looked dead since 1996 and fell in 2019, and shoots from it are tended beside it. Khirbet Nimreh nearby has also been proposed. Today Ramat el-Khalil lies among the houses of Hebron in the West Bank, a fenced ruin visited by few."
  ru:
    - "Мамре — место у Хеврона, где Авраам раскинул шатёр у дубравы и построил жертвенник. Книга Бытия называет его по имени Мамре Аморреянина, союзника Авраама против четырёх царей, и делает его домом патриархов: здесь Господь явился Аврааму «у дубравы Мамре», когда он сидел при входе в шатёр, и три мужа ели у него и обещали Сарре сына; пещера Махпела, где погребли Сарру, Авраама, Исаака, Ревекку, Лию и Иакова, лежала на поле «против Мамре, что ныне Хеврон»; и Иаков пришёл «к Исааку, отцу своему, ибо он был еще жив, в Мамре, в Кириаф-Арбу, то есть Хеврон»."
    - "Со времён Ирода это место показывают в Рамат-эль-Халиле, в 3–4 км к северу от Хеврона, где ограда из огромных тёсаных камней, около 65 на 50 м, окружает колодец и место дерева; большинство учёных считают ограду постройкой Ирода. Иосиф Флавий знал близ Хеврона теревинф, которому, говорили, столько же лет, сколько миру. После войны Бар-Кохбы, по словам Иеронима, Адриан продавал здесь, на рынке у Теревинфа, иудейских пленников, и при нём ограду отстроили заново. Император Константин, узнав от тёщи Евтропии, что язычники приносят жертвы на святой земле, велел сжечь идолов и построить базилику, которую описывает Евсевий; Созомен рассказывает, как Иудеи, язычники и христиане по-прежнему сходились каждое лето на ярмарку у теревинфа, и каждый чтил место по-своему. Немецкие раскопки 1926–1928 гг. открыли ограду и церковь Константина."
    - "Соперничающее предание держится Дуба Авраама в 2 км к западу от Хеврона — огромного палестинского дуба, купленного Русской церковью в 1868 г., где стоит монастырь Святой Троицы; старый ствол засох к 1996 г. и рухнул в 2019 г., а рядом выхаживают его побеги. Предлагали и соседний Хирбет-Нимре. Сегодня Рамат-эль-Халиль лежит среди домов Хеврона на Западном берегу — огороженная руина, которую посещают немногие."
  uk:
    - "Мамре — місце біля Хеврона, де Авраам поставив свій намет під теревінтами, або дубами, і збудував жертовник. Книга Буття називає його за Мамре Аморея, союзника Авраама проти чотирьох царів, і робить його домом патріархів: тут Господь явився Авраамові «коло дубравини Мамре», коли той сидів при дверях намету, і троє чоловіків були нагодовані й пообіцяли Саррі сина; печера Махпела, де поховані Сарра, Авраам, Ісаак, Ревека, Лія та Яків, лежала на полі «навпроти Мамрійщини. Се Геброн», а Яків повернувся «до Ізаака, отця свого, в Мамрійщину, в Киріят-Арбу, се Геброн»."
    - "Відколи за Ірода показують це місце, ним є Рамат-ель-Халіль, приблизно за 3–4 км на північ від Хеврона, де огорожа з великого обтесаного каміння, близько 65 на 50 м, оточує колодязь і місце дерева; більшість учених вважає огорожу роботою Ірода. Йосиф Флавій знав теревінт поблизу Хеврона, про який казали, що він такий старий, як світ. Після війни Бар-Кохби, каже Ієронім, Адріан продавав тут єврейських полонених на ринку Теревінта, і огорожу було перебудовано за його правління. Імператор Костянтин, якому його теща Евтропія розповіла, що язичники приносять жертви на святій землі, звелів спалити ідолів і збудувати базиліку, яку описує Євсевій; Созомен розповідає, як юдеї, язичники й християни ще щоліта зустрічалися на ярмарку теревінта, кожні шануючи місце по-своєму. Німецькі розкопки 1926–1928 рр. відкрили огорожу й церкву Костянтина."
    - "Конкурентна традиція тримається Дуба Авраама за 2 км на захід від Хеврона, великого палестинського дуба, купленого російською церквою 1868 р., де стоїть Свято-Троїцький монастир; старий стовбур виглядає мертвим від 1996 р. і впав 2019 р., а паростки від нього доглядають поруч. Пропонували також Хірбет-Німре поблизу. Сьогодні Рамат-ель-Халіль лежить серед будинків Хеврона на Західному березі — огороджена руїна, яку відвідує небагато людей."
  es:
    - "Mamre es el lugar junto a Hebrón donde Abraham plantó su tienda bajo los terebintos, o encinas, y edificó un altar. Génesis lo nombra por Mamre el amorreo, aliado de Abraham contra los cuatro reyes, y hace de él el hogar de los patriarcas: aquí el Señor se apareció a Abraham «en el valle de Mamre» cuando estaba sentado a la puerta de su tienda, y tres hombres fueron agasajados y prometieron un hijo a Sara; la cueva de Macpela, donde fueron sepultados Sara, Abraham, Isaac, Rebeca, Lea y Jacob, estaba en el campo «enfrente de Mamre, que es Hebrón»; y Jacob volvió a casa «á Isaac su padre á Mamre, á la ciudad de Arba, que es Hebrón»."
    - "Desde los días de Herodes, se muestra Ramat el-Khalil, a unos 3–4 km al norte de Hebrón, donde un recinto de grandes piedras con margen cincelado, de unos 65 por 50 m, rodea un pozo y el lugar de un árbol; la mayoría de los estudiosos lo atribuye a Herodes. Josefo conoció un terebinto cerca de Hebrón que se decía tan antiguo como el mundo. Tras la guerra de Bar Kojba, dice Jerónimo, Adriano vendió cautivos judíos en el mercado del Terebinto aquí, y el recinto se reconstruyó entonces. Constantino, informado por su suegra Eutropia de que los paganos sacrificaban allí, ordenó quemar los ídolos y construir una basílica, que describe Eusebio; Sozomeno cuenta que judíos, paganos y cristianos seguían reuniéndose cada verano en la feria del terebinto, honrando cada uno el lugar a su manera. Las excavaciones alemanas de 1926–28 hallaron el recinto y la iglesia de Constantino."
    - "Una tradición rival se atiene a la Encina de Abraham, a 2 km al oeste de Hebrón, un gran roble de Palestina comprado por la Iglesia rusa en 1868, donde se alza el monasterio de la Santa Trinidad; el viejo tronco parece muerto desde 1996 y cayó en 2019, y junto a él se cuidan los retoños. También se ha propuesto Khirbet Nimreh, cercano. Hoy Ramat el-Khalil se halla entre las casas de Hebrón, en Cisjordania, una ruina vallada que pocos visitan."
  pt:
    - "Manre é o lugar junto a Hebrom onde Abraão armou sua tenda sob os terebintos, ou carvalhos, e edificou um altar. Gênesis lhe dá o nome de Manre, o amorreu, aliado de Abraão contra os quatro reis, e faz dela a casa dos patriarcas: aqui o Senhor apareceu a Abraão “junto aos carvalhos de Manre”, quando ele estava sentado à porta da tenda, e três homens foram alimentados e prometeram a Sara um filho; a caverna de Macpela, onde foram sepultados Sara, Abraão, Isaque, Rebeca, Lia e Jacó, ficava no campo “em frente a Manre (isto é, Hebrom)”; e Jacó voltou para casa, “a Isaque, seu pai, em Manre, em Quiriate-Arba (que é Hebrom)”."
    - "Desde o tempo de Herodes, o sítio mostrado é Ramat el-Khalil, a uns 3–4 km ao norte de Hebrom, onde um recinto de grandes pedras emolduradas, de cerca de 65 por 50 m, cerca um poço e o lugar de uma árvore; a maioria o toma por obra de Herodes. Josefo conhecia um terebinto perto de Hebrom, tido por tão antigo quanto o mundo. Depois da guerra de Bar Kokhba, diz Jerônimo, Adriano vendeu cativos judeus no mercado do Terebinto aqui, e o recinto foi reconstruído em seu reinado. O imperador Constantino, informado por sua sogra Eutrópia de que pagãos sacrificavam no solo santo, mandou queimar os ídolos e erguer uma basílica, descrita por Eusébio; Sozômeno conta que judeus, pagãos e cristãos ainda se reuniam todo verão na feira do terebinto, cada qual honrando o lugar à sua maneira. As escavações alemãs de 1926–28 descobriram o recinto e a igreja de Constantino."
    - "Uma tradição rival se atém ao Carvalho de Abraão, a 2 km a oeste de Hebrom, um grande carvalho-palestino comprado pela igreja russa em 1868, onde se ergue o mosteiro da Santíssima Trindade; o velho tronco parece morto desde 1996 e caiu em 2019, e brotos dele são cuidados ao lado. Khirbet Nimreh, nas proximidades, também foi proposta. Hoje Ramat el-Khalil fica entre as casas de Hebrom, na Cisjordânia, uma ruína cercada visitada por poucos."
  de:
    - "Mamre ist der Ort bei Hebron, wo Abraham sein Zelt unter den Terebinthen oder Eichen aufschlug und einen Altar baute. Die Genesis benennt ihn nach Mamre, dem Amoriter, Abrahams Bundesgenossen gegen die vier Könige, und macht ihn zur Heimat der Erzväter: Hier heißt es: „Und der HERR erschien ihm im Hain Mamre, da saß er an der Tür seiner Hütte“, und drei Männer wurden bewirtet und verhießen Sara einen Sohn; die Höhle Machpela, wo Sara, Abraham, Isaak, Rebekka, Lea und Jakob begraben wurden, lag auf dem Feld „Mamre gegenüber, das ist Hebron“; und Jakob kam heim „zu seinem Vater Isaak gen Mamre zu Kirjat-Arba, das da heißt Hebron“."
    - "Seit der Zeit des Herodes wird Ramat el-Khalil gezeigt, 3–4 km nördlich von Hebron, wo eine Mauer aus großen Randschlagquadern, etwa 65 mal 50 m, einen Brunnen und die Stelle eines Baumes umschließt; die meisten Gelehrten halten sie für ein Werk des Herodes. Josephus kannte eine Terebinthe bei Hebron, angeblich so alt wie die Welt. Nach dem Bar-Kochba-Krieg, sagt Hieronymus, verkaufte Hadrian hier jüdische Gefangene auf dem Markt der Terebinthe, und unter ihm wurde die Mauer erneuert. Als seine Schwiegermutter Eutropia Konstantin berichtete, dass Heiden dort opferten, ließ er die Götzen verbrennen und eine Basilika bauen, die Eusebius beschreibt; nach Sozomenos trafen sich Juden, Heiden und Christen noch jeden Sommer auf dem Jahrmarkt der Terebinthe, jeder auf seine Weise ehrend. Die deutschen Ausgrabungen von 1926–28 legten die Mauer und Konstantins Kirche frei."
    - "Eine konkurrierende Überlieferung hält an der Abrahamseiche fest, 2 km westlich von Hebron, einer großen palästinensischen Eiche, die die russische Kirche 1868 kaufte und bei der das Dreifaltigkeitskloster steht; der alte Stamm wirkt seit 1996 tot und fiel 2019, und Triebe von ihm werden daneben gepflegt. Auch Khirbet Nimreh in der Nähe wurde vorgeschlagen. Heute liegt Ramat el-Khalil zwischen den Häusern von Hebron im Westjordanland, eine umzäunte Ruine, die wenige besuchen."
  fr:
    - "Mamré est le lieu près d’Hébron où Abraham dressa sa tente sous les térébinthes, ou chênes, et bâtit un autel. La Genèse le nomme d’après Mamré l’Amoréen, allié d’Abraham contre les quatre rois, et en fait la demeure des patriarches : ici l’Éternel apparut à Abraham « parmi les chênes de Mamré » alors qu’il était assis à l’entrée de sa tente, et trois hommes furent nourris et promirent un fils à Sara ; la caverne de Macpéla, où furent enterrés Sara, Abraham, Isaac, Rebecca, Léa et Jacob, se trouvait dans le champ « vis-à-vis de Mamré, qui est Hébron » ; et Jacob rentra « auprès d’Isaac, son père, à Mamré, à Kirjath-Arba, qui est Hébron »."
    - "Depuis Hérode, le site montré est Ramat el-Khalil, à 3–4 km au nord d’Hébron, où une enceinte de grands blocs à marges ciselées, d’environ 65 sur 50 m, entoure un puits et l’emplacement d’un arbre ; la plupart y voient une œuvre d’Hérode. Flavius Josèphe connaissait près d’Hébron un térébinthe dit aussi vieux que le monde. Après la guerre de Bar Kokhba, dit Jérôme, Hadrien vendit des captifs juifs au marché du Térébinthe ici même, et l’enceinte fut rebâtie sous son règne. Constantin, informé par sa belle-mère Eutropie que des païens sacrifiaient sur le lieu saint, fit brûler les idoles et bâtir une basilique, que décrit Eusèbe ; Sozomène raconte comment Juifs, païens et chrétiens se retrouvaient encore chaque été à la foire du térébinthe, chacun honorant le lieu à sa façon. Les fouilles allemandes de 1926–1928 ont dégagé l’enceinte et l’église de Constantin."
    - "Une tradition rivale tient pour le Chêne d’Abraham, à 2 km à l’ouest d’Hébron, grand chêne de Palestine acheté par l’Église russe en 1868, où se dresse le monastère de la Sainte-Trinité ; le vieux tronc paraît mort depuis 1996 et est tombé en 2019, et des rejets en sont soignés à côté. Khirbet Nimreh, tout près, a aussi été proposé. Aujourd’hui, Ramat el-Khalil se trouve parmi les maisons d’Hébron, en Cisjordanie, ruine clôturée peu visitée."
  it:
    - "Mamre è il luogo presso Ebron dove Abramo piantò la tenda sotto i terebinti, o querce, e costruì un altare. La Genesi lo nomina da Mamre l’Amoreo, alleato di Abramo contro i quattro re, e ne fa la dimora dei patriarchi: qui il Signore apparve ad Abramo «alle querce di Mamre» mentre sedeva all’ingresso della tenda, e tre uomini furono nutriti e promisero a Sara un figlio; la grotta di Macpela, dove furono sepolti Sara, Abramo, Isacco, Rebecca, Lia e Giacobbe, si trovava nel campo «dirimpetto a Mamre, che è Hebron»; e Giacobbe tornò «da Isacco suo padre a Mamre, a Kiriath-Arba, cioè Hebron»."
    - "Dai tempi di Erode il sito mostrato è Ramat el-Khalil, a circa 3-4 km a nord di Ebron, dove un recinto di grandi pietre a bugnato, di circa 65 per 50 m, circonda un pozzo e il luogo di un albero; i più lo ritengono opera di Erode. Giuseppe Flavio conosceva presso Ebron un terebinto detto antico quanto il mondo. Dopo la guerra di Bar Kokhba, dice Girolamo, Adriano vendette qui prigionieri ebrei al mercato del Terebinto, e il recinto fu ricostruito sotto il suo regno. Costantino, informato dalla suocera Eutropia che i pagani sacrificavano sul suolo santo, ordinò di bruciare gli idoli e di costruire una basilica, che Eusebio descrive; Sozomeno racconta che ebrei, pagani e cristiani si riunivano ancora ogni estate alla fiera del terebinto, ciascuno onorando il luogo a modo suo. Scavi tedeschi (1926–28) hanno messo in luce il recinto e la chiesa di Costantino."
    - "Una tradizione rivale si attiene alla Quercia di Abramo, a 2 km a ovest di Ebron, una grande quercia della Palestina acquistata dalla Chiesa russa nel 1868, dove sorge il monastero della Santissima Trinità; il vecchio tronco appare morto dal 1996 ed è caduto nel 2019, e i germogli che ne spuntano sono curati accanto ad esso. È stata proposta anche la vicina Khirbet Nimreh. Oggi Ramat el-Khalil giace tra le case di Ebron in Cisgiordania, una rovina recintata visitata da pochi."
  pl:
    - "Mamre to miejsce koło Hebronu, gdzie Abraham rozbił namiot pod terebintami, czyli dębami, i zbudował ołtarz. Księga Rodzaju nazywa je od Mamre Amorejczyka, sprzymierzeńca Abrahama przeciw czterem królom, i czyni je domem patriarchów: tu Pan ukazał się Abrahamowi „w równinie Mamre”, gdy siedział we drzwiach namiotu, a trzej mężowie zostali nakarmieni i obiecali Sarze syna; jaskinia Makpela, w której pochowano Sarę, Abrahama, Izaaka, Rebekę, Leę i Jakuba, leżała w polu „przeciwko Mamre, to jest Hebron”; a Jakub wrócił do domu „do Izaaka, ojca swego, do Mamre, do miasta Arba, to jest Hebron”."
    - "Od czasów Heroda pokazywanym miejscem jest Ramat el-Chalil, 3–4 km na północ od Hebronu, gdzie ogrodzenie z wielkich ciosanych kamieni, około 65 na 50 m, otacza studnię i miejsce drzewa; większość uczonych uważa to ogrodzenie za dzieło Heroda. Józef Flawiusz znał terebint koło Hebronu, o którym mówiono, że jest stary jak świat. Po wojnie Bar Kochby, mówi Hieronim, Hadrian sprzedawał tu żydowskich jeńców na targu pod Terebintem, a ogrodzenie odbudowano za jego panowania. Cesarz Konstantyn, któremu jego teściowa Eutropia powiedziała, że poganie składają ofiary na świętej ziemi, kazał spalić bożki i zbudować bazylikę, którą opisuje Euzebiusz; Sozomen opowiada, że Żydzi, poganie i chrześcijanie wciąż schodzili się co lata na jarmark terebintu, każdy czcząc to miejsce na swój sposób. Niemieckie wykopaliska z lat 1926–28 odsłoniły ogrodzenie i kościół Konstantyna."
    - "Rywalizująca tradycja trzyma się Dębu Abrahama 2 km na zachód od Hebronu, wielkiego palestyńskiego dębu kupionego przez Cerkiew rosyjską w 1868 r., gdzie stoi klasztor Świętej Trójcy; stary pień wygląda na martwy od 1996 r. i upadł w 2019 r., a pędy z niego pielęgnuje się obok. Proponowano też pobliskie Khirbet Nimreh. Dziś Ramat el-Chalil leży wśród domów Hebronu na Zachodnim Brzegu, ogrodzona ruina odwiedzana przez niewielu."
  nl:
    - "Mamre is de plaats bij Hebron waar Abraham zijn tent opsloeg onder de terebinten, of eiken, en een altaar bouwde. Genesis noemt haar naar Mamre de Amoriet, Abrahams bondgenoot tegen de vier koningen, en maakt haar tot het thuis van de aartsvaders: hier verscheen de HEER aan Abraham “aan de eikenbossen van Mamre” terwijl hij in de deur van de tent zat, en drie mannen kregen te eten en beloofden Sara een zoon; de grot van Machpela, waar Sara, Abraham, Isaak, Rebekka, Lea en Jakob werden begraven, lag in de akker “tegenover Mamre, hetwelk is Hebron”; en Jakob kwam thuis “tot Izak, zijn vader, in Mamre, te Kirjath-Arba, hetwelk is Hebron”."
    - "Sinds de tijd van Herodes is de getoonde plaats Ramat el-Khalil, zo'n 3-4 km ten noorden van Hebron, waar een omheining van grote bewerkte stenen, ongeveer 65 bij 50 m, een put en een boomplaats omsluit; de meesten schrijven haar aan Herodes toe. Josephus kende een terebint bij Hebron die zo oud als de wereld zou zijn. Na de Bar-Kochba-opstand verkocht Hadrianus hier, zegt Hiëronymus, joodse gevangenen op de markt van de Terebint; onder hem werd de omheining herbouwd. Constantijn, door zijn schoonmoeder Eutropia gewaarschuwd dat heidenen op de heilige grond offerden, liet de afgoden verbranden en een basiliek bouwen, die Eusebius beschrijft; Sozomenos meldt dat joden, heidenen en christenen elke zomer nog samenkwamen op de markt van de terebint, ieder op eigen wijze de plaats eerend. De Duitse opgravingen van 1926-28 legden de omheining en Constantijns kerk bloot."
    - "Een rivaliserende overlevering houdt vast aan de Eik van Abraham, 2 km ten westen van Hebron, een grote Palestijnse eik die de Russische kerk in 1868 kocht, waar het klooster van de Heilige Drie-eenheid staat; de oude stam lijkt sinds 1996 dood en viel in 2019, en scheuten ervan worden ernaast verzorgd. Ook Khirbet Nimreh in de buurt is voorgesteld. Tegenwoordig ligt Ramat el-Khalil tussen de huizen van Hebron op de Westoever, een omheinde ruïne die weinigen bezoeken."
  cs:
    - "Mamre je místo u Hebronu, kde Abraham rozbil stan pod terebinty neboli duby a vystavěl oltář. Genesis je jmenuje podle Amorejce Mamre, Abrahamova spojence proti čtyřem králům, a činí z něj domov patriarchů: zde se Hospodin Abrahamovi ukázal „v rovině Mamre“, když seděl u dveří stanu, a tři muži byli pohoštěni a zaslíbili Sáře syna; jeskyně Makpela, kde byli pohřbeni Sára, Abraham, Izák, Rebeka, Lea a Jákob, ležela na poli „proti Mamre, (to slove Hebron)“; a Jákob přišel domů „k Izákovi otci svému do Mamre, do města Arbe, jenž jest Hebron“."
    - "Od Herodových časů se ukazuje Ramat el-Khalil, asi 3–4 km severně od Hebronu, kde areál z velkých tesaných kamenů, asi 65 × 50 m, obklopuje studnu a místo stromu; většina badatelů pokládá areál za Herodovo dílo. Josephus znal terebint u Hebronu, o němž se říkalo, že je stár jako svět. Po povstání Bar Kochby, praví Jeroným, prodával Hadrianus židovské zajatce na trhu u Terebintu zde a areál byl za jeho vlády přestavěn. Císař Konstantin, jemuž tchyně Eutropia řekla, že pohané obětují na svaté půdě, nařídil spálit modly a postavit baziliku, kterou popisuje Eusebius; Sozomenos vypráví, jak se Židé, pohané a křesťané dosud každé léto scházeli na trhu u terebintu a každý místo uctíval po svém. Německé vykopávky v letech 1926–28 odkryly areál i Konstantinův kostel."
    - "Soupeřící tradice se drží Abrahamova dubu 2 km západně od Hebronu, velkého palestinského dubu, který roku 1868 koupila ruská církev a kde stojí klášter Svaté Trojice; starý kmen vypadá mrtvě od roku 1996 a roku 2019 padl a výhonky z něj se pěstují vedle. Navržen byl i nedaleký Khirbet Nimreh. Dnes leží Ramat el-Khalil mezi domy Hebronu na Západním břehu, oplocená zřícenina, kterou navštěvuje málo lidí."
  sv:
    - "Mamre är platsen vid Hebron där Abraham slog upp sitt tält under terebinterna, eller ekarna, och byggde ett altare. Första Moseboken uppkallar den efter amoreen Mamre, Abrahams bundsförvant mot de fyra konungarna, och gör den till patriarkernas hem: här uppenbarade sig Herren för Abraham ”vid Mamres terebintlund”, där han satt vid tältets ingång, och tre män fick mat och lovade Sara en son; grottan i Makpela, där Sara, Abraham, Isak, Rebecka, Lea och Jakob begrovs, låg på åkern ”gent emot Mamre, det är Hebron”; och Jakob kom hem ”till sin fader Isak i Mamre vid Kirjat-Arba, det är Hebron”."
    - "Sedan Herodes dagar har den visade platsen varit Ramat el-Khalil, omkring 3–4 km norr om Hebron, där en inhägnad av stora ramhuggna stenar, omkring 65 gånger 50 m, omger en brunn och platsen för ett träd; de flesta forskare håller inhägnaden för Herodes' verk. Josefus kände en terebint nära Hebron som sades vara lika gammal som världen. Efter Bar Kokhba-kriget sålde Hadrianus, säger Hieronymus, judiska fångar på terebintens marknad här, och inhägnaden byggdes om under hans regering. Kejsar Konstantin, som av sin svärmor Eutropia fick veta att hedningar offrade på den heliga marken, lät bränna avgudabilderna och bygga en basilika, som Eusebios beskriver; Sozomenos berättar hur judar, hedningar och kristna ännu varje sommar möttes på terebintens marknad, var och en på sitt sätt. De tyska utgrävningarna 1926–28 grävde fram inhägnaden och Konstantins kyrka."
    - "En rivaliserande tradition håller sig till Abrahams ek 2 km väster om Hebron, en stor palestinsk ek som köptes av den ryska kyrkan 1868, där Heliga treenighetens kloster står; den gamla stammen har sett död ut sedan 1996 och föll 2019, och skott från den vårdas bredvid. Khirbet Nimreh i närheten har också föreslagits. I dag ligger Ramat el-Khalil bland Hebrons hus på Västbanken, en inhägnad ruin som få besöker."
  nb:
    - "Mamre er stedet ved Hebron der Abraham slo opp teltet sitt under terebintene, eller eikene, og bygde et alter. Første Mosebok oppkaller det etter amoritten Mamre, Abrahams forbundsfelle mot de fire kongene, og gjør det til patriarkenes hjem: her åpenbarte Herren seg for Abraham «i Mamres terebinte-lund» mens han satt i teltdøren, og tre menn ble gitt mat og lovet Sara en sønn; Makpela-hulen, der Sara, Abraham, Isak, Rebekka, Lea og Jakob ble begravet, lå på marken «østenfor Mamre, det er Hebron»; og Jakob kom hjem «til sin far Isak i Mamre ved Kirjat-Arba, det er Hebron»."
    - "Siden Herodes' dager har stedet som vises, vært Ramat el-Khalil, omkring 3–4 km nord for Hebron, der en innhegning av store tilhugde steiner, omkring 65 ganger 50 m, omgir en brønn og stedet for et tre; de fleste forskere tar innhegningen for Herodes' verk. Josefus kjente en terebint nær Hebron som skulle være like gammel som verden. Etter Bar Kokhba-krigen, sier Hieronymus, solgte Hadrian jødiske fanger på Terebintens marked her, og innhegningen ble gjenoppbygd i hans regjeringstid. Keiser Konstantin, som ble fortalt av sin svigermor Eutropia at hedninger ofret på den hellige grunnen, lot avgudsbildene brenne og en basilika bygge, som Eusebius beskriver; Sozomenos forteller hvordan jøder, hedninger og kristne fortsatt hver sommer møttes på terebintens marked, og hver æret stedet på sin måte. De tyske utgravningene 1926–28 avdekket innhegningen og Konstantins kirke."
    - "En rivaliserende tradisjon holder seg til Abrahams eik 2 km vest for Hebron, en stor palestinsk eik kjøpt av den russiske kirken i 1868, hvor Den hellige treenighets kloster står; den gamle stammen har sett død ut siden 1996 og falt i 2019, og skudd fra den stelles ved siden av. Khirbet Nimreh i nærheten er også foreslått. I dag ligger Ramat el-Khalil blant husene i Hebron på Vestbredden, en inngjerdet ruin som få besøker."
  tl:
    - "Ang Mamre ay ang lugar sa tabi ng Hebron kung saan itinayo ni Abraham ang kaniyang tolda sa ilalim ng mga terebinto, o ensina, at nagtayo ng dambana. Pinangangalanan ito ng Genesis sa Mamre na Amorrheo, kakampi ni Abraham laban sa apat na hari, at ginagawa itong tahanan ng mga patriyarka: dito napakita ang Panginoon kay Abraham “sa mga punong encina ni Mamre” habang nakaupo siya sa pintuan ng tolda, at pinakain ang tatlong lalaki at ipinangako kay Sara ang isang anak; ang yungib ng Macpela, kung saan inilibing sina Sara, Abraham, Isaac, Rebeca, Lea at Jacob, ay nasa parang “sa tapat ng Mamre (na siyang Hebron)”; at umuwi si Jacob “kay Isaac na kaniyang ama, sa Mamre, sa Kiriat-arba (na siyang Hebron)”."
    - "Mula kay Herodes, itinuturo ang Ramat el-Khalil, 3–4 km hilaga ng Hebron: bakod ng malalaking batong hinasa, 65 sa 50 m, sa paligid ng balon at lugar ng puno; gawa raw ni Herodes sabi ng karamihan ng iskolar. Alam ni Josefo ang terebinto malapit sa Hebron, kasintanda raw ng daigdig. Pagkatapos ng digmaang Bar Kokhba, sabi ni Jeronimo, ipinagbili ni Adriano sa pamilihan ng Terebinto ang mga Judiong bihag; muling itinayo ang bakod sa paghahari niya. Sinabi ni Eutropia kay Emperador Constantino, manugang niya, na naghahandog ang mga pagano sa banal na lupa; iniutos nitong sunugin ang mga idolo at magtayo ng basilikang inilarawan ni Eusebio. Ayon kay Sozomeno, tuwing tag-araw ay nagtitipon pa rin sa perya ng terebinto ang mga Judio, pagano at Kristiyano, na may sariling pagpaparangal dito. Nahukay ng mga Aleman (1926–28) ang bakod at simbahan ni Constantino."
    - "Isang karibal na tradisyon ang kumakapit sa Ensina ni Abraham 2 km sa kanluran ng Hebron, isang malaking ensina ng Palestina na binili ng simbahang Ruso noong 1868, kung saan nakatayo ang monasteryo ng Banal na Trinidad; mukhang patay na ang lumang katawan ng puno mula 1996 at bumagsak noong 2019, at inaalagaan sa tabi nito ang mga usbong mula rito. Iminungkahi rin ang kalapit na Khirbet Nimreh. Ang Ramat el-Khalil ngayon ay nasa gitna ng mga bahay ng Hebron sa West Bank, isang guhong may bakod na kakaunti ang dumadalaw."
  da:
    - "Mamre er stedet ved Hebron, hvor Abraham slog sit telt op under terebinterne, eller egene, og byggede et alter. Første Mosebog opkalder det efter Mamre amoritten, Abrahams forbundsfælle mod de fire konger, og gør det til patriarkernes hjem: her åbenbarede Herren sig for Abraham »i Mamre Lund«, da han sad i teltdøren, og tre mænd blev beværtet og lovede Sara en søn; hulen Makpela, hvor Sara, Abraham, Isak, Rebekka, Lea og Jakob blev begravet, lå i marken »tværs over for Mamre, det er Hebron«; og Jakob kom til sin far: »til sin Fader Isak i Mamre, udi Kirjath-Arba, det er Hebron«."
    - "Siden Herodes' dage har det viste sted været Ramat el-Khalil, omkring 3–4 km nord for Hebron, hvor en indhegning af store tilhuggede sten, omkring 65 gange 50 m, omgiver en brønd og stedet for et træ; de fleste forskere tager indhegningen for Herodes' værk. Josefus kendte en terebint nær Hebron, der skulle være lige så gammel som verden. Efter Bar Kokhba-krigen solgte Hadrian, siger Hieronymus, jødiske fanger på terebintens marked her, og indhegningen blev genopbygget i hans regeringstid. Kejser Konstantin, der af sin svigermor Eutropia fik at vide, at hedninge ofrede på den hellige jord, befalede afguderne brændt og en basilika bygget, som Eusebios beskriver; Sozomenos fortæller, hvordan jøder, hedninge og kristne stadig mødtes hver sommer ved terebintens marked, hver på sin måde. De tyske udgravninger 1926–28 afdækkede indhegningen og Konstantins kirke."
    - "En rivaliserende tradition holder fast ved Abrahams Eg 2 km vest for Hebron, en stor palæstinensisk eg, købt af den russiske kirke i 1868, hvor Treenighedsklosteret ligger; den gamle stamme har set død ud siden 1996 og faldt i 2019, og skud fra den plejes ved siden af. Khirbet Nimreh i nærheden er også blevet foreslået. I dag ligger Ramat el-Khalil blandt Hebrons huse på Vestbredden, en indhegnet ruin, som få besøger."
  sr:
    - "Мамрија је место крај Хеврона где је Аврам разапео шатор под теребинтима, то јест храстовима, и подигао жртвеник. Књига Постања га назива по Мамрији Аморејину, Авраму савезнику против четири цара, и чини га домом патријараха: овде се Господ јавио Авраму „у равници мамријској“ док је седео на вратима шатора, а три човека била су угошћена и обећала Сари сина; пећина Макпела, где су сахрањени Сара, Аврам, Исак, Ревека, Лија и Јаков, лежала је на њиви „према Мамрији, а то је Хеврон“; а Јаков је дошао „к Исаку оцу свом у Мамрију у Киријат-Арву, које је Хеврон“."
    - "Од Иродовог доба показује се Рамат ел-Калил, око 3–4 км северно од Хеврона, где ограда од великих тесаника, око 65 са 50 м, окружује бунар и место дрвета; већина научника сматра да је ограда Иродово дело. Јосиф Флавије је знао теребинт код Хеврона за који се говорило да је стар колико и свет. После Бар Кохбиног рата, каже Јероним, Хадријан је овде на пијаци Теребинта продавао јеврејске заробљенике, и ограда је обновљена за његове владавине. Цар Константин, коме је његова ташта Евтропија рекла да многобошци приносе жртве на светом тлу, наредио је да се идоли спале и да се подигне базилика, коју описује Јевсевије; Созомен приповеда како су се Јевреји, многобошци и хришћани и даље сваког лета окупљали на сајму теребинта, свако на свој начин поштујући место. Немачка ископавања 1926–28. открила су ограду и Константинову цркву."
    - "Супарничко предање држи се Аврамовог храста 2 км западно од Хеврона, великог палестинског храста који је руска црква купила 1868, где стоји манастир Свете Тројице; старо стабло изгледа мртво од 1996. и пало је 2019, а изданци из њега негују се поред њега. Предложен је и оближњи Хирбет Нимра. Данас Рамат ел-Калил лежи међу кућама Хеврона на Западној обали, ограђена рушевина коју посећује мало људи."
  hu:
    - "Mamré a hebroni hely, ahol Ábrahám felverte sátrát a terebintusok, vagyis tölgyek alatt, és oltárt épített. A Teremtés könyve az emoreus Mamréról nevezi el, Ábrahám négy király elleni szövetségeséről, és a pátriárkák otthonává teszi: itt jelent meg az Úr Ábrahámnak „a Mamré tölgyesében”, amint a sátor ajtajában ült, itt vendégelt három férfit, akik fiút ígértek Sárának; a makpélai barlang, ahol Sárát, Ábrahámot, Izsákot, Rebekát, Leát és Jákóbot eltemették, a mezőben feküdt „Mamréval szemben. Ez Hebron a Kanaán földén”; és Jákób hazatért „Izsákhoz, az ő atyjához Mamréba, Kirját-Arbába, azaz Hebronba”."
    - "Heródes kora óta a hely a Hebrontól mintegy 3–4 km-re északra fekvő Ramat el-Khalil, ahol nagy, simított kövekből épült, mintegy 65×50 m-es fal veszi körül a kutat és egy fa helyét; a legtöbb tudós Heródes művének tartja. Josephus ismert egy hebroni terebintust, amelyről azt mondták, hogy a világgal egyidős. A Bar Kohba-háború után – mondja Hieronymus – Hadrianus itt, a Terebinta piacán adott el zsidó foglyokat, és uralkodása alatt építették újjá a kerítést. Konstantin császár, miután anyósa, Eutropia jelentette, hogy pogányok áldoznak a szent helyen, a bálványok elégetését és egy bazilika építését rendelte el, amelyet Eusebius leír; Szozomenosz elmeséli, hogy zsidók, pogányok és keresztények még minden nyáron összejöttek a terebintavásáron, ki-ki a maga módján tisztelve a helyet. Az 1926–28-as német ásatások feltárták a kerítést és Konstantin templomát."
    - "Egy vetélkedő hagyomány Ábrahám tölgyéhez ragaszkodik, Hebrontól 2 km-re nyugatra, egy nagy palesztin tölgyhöz, amelyet az orosz egyház 1868-ban megvásárolt, és ahol a Szentháromság-kolostor áll; az öreg törzs 1996 óta halottnak látszik, és 2019-ben ledőlt, hajtásait mellette gondozzák. A közeli Khirbet Nimreh is szóba jött. Ramat el-Khalil ma Hebron házai között fekszik Ciszjordániában, kevesek által látogatott, kerített rom."
  fi:
    - "Mamre on paikka Hebronin luona, jossa Abraham pystytti telttansa terebinttien eli tammien alle ja rakensi alttarin. Ensimmäinen Mooseksen kirja nimeää sen amorilaisen Mamren mukaan, Abrahamin liittolaisen neljää kuningasta vastaan, ja tekee siitä patriarkkojen kodin: täällä Herra ilmestyi Abrahamille ”Mamren tammistossa”, kun tämä istui teltan ovella, ja kolme miestä ruokittiin ja he lupasivat Saaralle pojan; Makpelan luola, johon Saara, Abraham, Iisak, Rebekka, Lea ja Jaakob haudattiin, oli pellolla ”itään päin Mamresta, se on Hebronista”; ja Jaakob tuli kotiin ”isänsä Iisakin luo Mamreen, Kirjat-Arbaan, se on Hebroniin”."
    - "Herodeksen ajoista lähtien näytetty paikka on ollut Ramat el-Khalil, noin 3–4 km Hebronista pohjoiseen, missä suurten reunalyödyistä kivistä rakennettu, noin 65 × 50 m:n aitaus ympäröi kaivoa ja puun paikkaa; useimmat katsovat sen Herodeksen työksi. Josephus tunsi Hebronin lähellä maailman ikäiseksi sanotun terebintin. Hieronymuksen mukaan Hadrianus myi Bar Kokhban sodan jälkeen täällä juutalaisvankeja Terebintin markkinoilla, ja aitaus rakennettiin uudelleen hänen aikanaan. Konstantinus, jolle anoppi Eutropia kertoi pakanoiden uhraavan pyhällä maalla, määräsi epäjumalat poltettaviksi ja basilikan rakennettavaksi, jonka Eusebios kuvaa; Sozomenos kertoo juutalaisten, pakanoiden ja kristittyjen kokoontuneen yhä joka kesä terebintin markkinoille, kukin omalla tavallaan paikkaa kunnioittaen. Saksalaiset kaivaukset 1926–28 paljastivat aitauksen ja Konstantinuksen kirkon."
    - "Kilpaileva perimätieto pitää kiinni Abrahamin tammesta 2 km Hebronista länteen, suuresta palestiinantammesta, jonka Venäjän kirkko osti vuonna 1868 ja jonka luona Pyhän Kolminaisuuden luostari sijaitsee; vanha runko on näyttänyt kuolleelta vuodesta 1996 ja kaatui vuonna 2019, ja sen versoja hoidetaan sen vieressä. Myös lähellä olevaa Khirbet Nimrehiä on ehdotettu. Nykyään Ramat el-Khalil sijaitsee Hebronin talojen keskellä Länsirannalla, aidattu rauniopaikka, jota harvat käyvät katsomassa."
  vi:
    - "Mam-rê là nơi gần Hếp-rôn mà Áp-ra-ham dựng lều dưới những cây terebinth, hay cây sồi, và lập một bàn thờ. Sáng thế ký đặt tên theo Mam-rê người A-mô-rít, đồng minh của Áp-ra-ham chống bốn vua, và coi đó là nhà của các tổ phụ: tại đây Đức Giê-hô-va hiện ra cùng Áp-ra-ham “nơi lùm cây dẻ bộp của Mam-rê” khi ông ngồi nơi cửa trại, và ba người được đãi ăn rồi hứa với Sa-ra một con trai; hang Mặc-bê-la, nơi Sa-ra, Áp-ra-ham, Y-sác, Rê-be-ca, Lê-a và Gia-cốp được chôn, nằm trong thửa ruộng “nằm ngang Mam-rê”; và Gia-cốp trở về nhà “đến cùng Y-sác, cha mình, ở Mam-rê, tại thành Ki-ri-át-A-ra-ba, tức là Hếp-rôn”."
    - "Từ thời Hê-rốt, địa điểm được chỉ là Ramat el-Khalil, cách Hếp-rôn khoảng 3–4 km về phía bắc, nơi một khu vây rào bằng những tảng đá xẻ lớn, khoảng 65 x 50 m, bao quanh một cái giếng và chỗ của một cái cây; phần lớn học giả coi khu vây là công trình của Hê-rốt. Josephus biết một cây terebinth gần Hếp-rôn được nói là cổ như thế giới. Sau cuộc chiến Bar Kokhba, Jerome nói, Hadrian bán các tù nhân Do Thái tại chợ Terebinth ở đây, và khu vây được xây lại dưới triều ông. Hoàng đế Constantine, được mẹ vợ Eutropia báo rằng người ngoại giáo tế lễ trên đất thánh, ra lệnh đốt các thần tượng và xây một đại thánh đường, mà Eusebius mô tả; Sozomen thuật rằng người Do Thái, ngoại giáo và Cơ Đốc vẫn họp mỗi mùa hè tại hội chợ cây terebinth, mỗi bên tôn kính nơi ấy theo cách của mình. Các cuộc khai quật của Đức năm 1926–28 phát lộ khu vây và nhà thờ của Constantine."
    - "Một truyền thống đối địch giữ Cây Sồi của Áp-ra-ham cách Hếp-rôn 2 km về phía tây, một cây sồi Palestine lớn được Giáo hội Nga mua năm 1868, nơi tu viện Chúa Ba Ngôi đứng; thân cây cũ trông như đã chết từ năm 1996 và đổ năm 2019, và các chồi từ đó được chăm sóc bên cạnh. Khirbet Nimreh gần đó cũng được đề nghị. Ngày nay Ramat el-Khalil nằm giữa các ngôi nhà của Hếp-rôn ở Bờ Tây, một di tích có hàng rào ít người đến thăm."
  ro:
    - "Mamre este locul de lângă Hebron unde Avraam și-a întins cortul sub terebinți, sau stejari, și a zidit un altar. Facerea îl numește după Mamre amoritul, aliatul lui Avraam împotriva celor patru regi, și îl face locuința patriarhilor: aici Domnul i s-a arătat lui Avraam „la stejarul lui Mamvrì” când ședea la ușa cortului, iar trei oameni au fost hrăniți și i-au făgăduit Sarei un fiu; peștera Macpela, unde au fost îngropați Sara, Avraam, Isaac, Rebeca, Lea și Iacov, se afla în câmpul „împreajma Mamvrei, aceasta este Hevron”; iar Iacov s-a întors acasă „la Isaac tatăl său la Mamvri în cetatea câmpului: acesta este Hevron”."
    - "Din vremea lui Irod, locul arătat este Ramat el-Khalil, la 3–4 km nord de Hebron, unde o incintă de blocuri mari fățuite, de circa 65 pe 50 m, înconjoară o fântână și locul unui copac; cei mai mulți cercetători o atribuie lui Irod. Iosif Flaviu cunoștea lângă Hebron un terebint despre care se spunea că e la fel de vechi ca lumea. După războiul lui Bar Kohba, spune Ieronim, Hadrian a vândut aici captivi iudei la târgul Terebintului, iar incinta a fost refăcută în domnia lui. Constantin, aflând de la soacra sa Eutropia că păgânii jertfeau pe pământul sfânt, a poruncit să fie arși idolii și să se zidească o bazilică, descrisă de Eusebiu; Sozomen povestește cum iudeii, păgânii și creștinii se adunau încă în fiecare vară la târgul terebintului, fiecare cinstind locul în felul lui. Săpăturile germane din 1926–28 au scos la lumină incinta și biserica lui Constantin."
    - "O tradiție rivală ține de Stejarul lui Avraam, la 2 km vest de Hebron, un mare stejar palestinian cumpărat de biserica rusă în 1868, unde se află mănăstirea Sfânta Treime; vechiul trunchi pare mort din 1996 și s-a prăbușit în 2019, iar lăstarii lui sunt îngrijiți alături. A fost propus și Khirbet Nimreh, din apropiere. Astăzi Ramat el-Khalil se află printre casele Hebronului din Cisiordania, o ruină îngrădită pe care o vizitează puțini."
  bg:
    - "Мамре е мястото край Хеврон, където Авраам разпънал шатъра си под теребинтите, или дъбовете, и издигнал олтар. Битие го назовава на Мамре аморееца, съюзника на Авраам срещу четиримата царе, и го прави дом на патриарсите: тук Господ се яви на Авраам „в Мамвриевите дъбове“, когато той седеше пред вратата на шатъра, и трима мъже бяха нагостени и обещаха на Сара син; пещерата Махпела, където бяха погребани Сара, Авраам, Исаак, Ревека, Лия и Яков, лежеше в нивата „пред Мамврий: той е Хеврон“; а Яков се върна у дома „при Исака отца си в Мамврий, в Кириат-арва, който е Хеврон“."
    - "От времето на Ирод показваното място е Рамат ел-Халил, на около 3–4 км северно от Хеврон, където ограда от големи дялани камъни, около 65 на 50 м, обгражда кладенец и мястото на дърво; повечето учени смятат оградата за дело на Ирод. Йосиф Флавий познава теребинт близо до Хеврон, за който се казвало, че е стар колкото света. След войната на Бар Кохба, казва Йероним, Адриан продавал юдейски пленници на пазара на Теребинта тук, а оградата била възстановена по негово време. Император Константин, уведомен от тъща си Евтропия, че езичници принасят жертви на святата земя, заповядал идолите да бъдат изгорени и да се построи базилика, която Евсевий описва; Созомен разказва как юдеи, езичници и християни още се срещали всяко лято на панаира на теребинта, всеки почитайки мястото по своему. Германските разкопки от 1926–1928 г. разкриват оградата и църквата на Константин."
    - "Съперничеща традиция се придържа към Дъба на Авраам на 2 км западно от Хеврон — голям палестински дъб, купен от Руската църква през 1868 г., където стои манастирът „Света Троица“; старият ствол изглежда мъртъв от 1996 г. и пада през 2019 г., а издънките от него се отглеждат до него. Предлаган е и близкият Хирбет Нимре. Днес Рамат ел-Халил лежи сред къщите на Хеврон на Западния бряг — оградена развалина, посещавана от малцина."
