# Overview article (ADR 0007). Mainstream facts only; the camp is placed on the desert edge of Moab by the Zered as the text says, the candidate sites given without choosing; nothing is claimed from excavation.
id: iye-abarim
place: a0574da
title:
  en: "Iye-abarim"
  ru: "Ийе-Аварим"
  uk: "Ійє-Аварім"
  es: "Ije-abarim"
  pt: "Ie-Abarim"
  de: "Ije-Abarim"
  fr: "Ijé-Abarim"
body:
  en:
    - "Iye-abarim, “the ruins of Abarim”, was a camp of Israel at the end of the wanderings, on the desert side of Moab. Numbers tells that the people “journeyed from Oboth, and pitched at Ije-abarim, in the wilderness which is before Moab, toward the sunrising”, and from there “removed, and pitched in the valley of Zared”; the list of stations has them “pitched in Ije-abarim, in the border of Moab”, then departing “from Iim”, a shortened form of the name, for Dibon-gad. The Synodal Bible writes Iye-Avarim in the story and Iym-Avarim and Iym in the list. The camp therefore lay on the eastern edge of the Moabite plateau, where Israel, having skirted Edom, turned north along the fringe of the desert, near the gorge of the Zered, the Wadi el-Hasa, that divides Moab from Edom. Abarim, “the regions beyond”, is the name of the mountains of Moab seen from the west."
    - "Which ruin is meant is unknown. The route along the desert edge is lined with Iron Age sites that Nelson Glueck surveyed in the 1930s, and the candidates on the map are among them: Khirbet el-Medeineh on the Wadi el-Hasa, Muhayy on the plateau to the east, and Khirbet Ai, with a wider guess within reach of the Abarim range. None has been excavated as Iye-abarim, and the name itself, “ruins”, suggests the Israelites camped by a place already deserted."
    - "The country is today the southern Karak governorate of Jordan, on the edge of the eastern desert, crossed by the Desert Highway from Amman to Aqaba; the Wadi el-Hasa, with its hot springs, runs below the sites toward the Dead Sea."
  ru:
    - "Ийе-Аварим, «развалины Аварима», был станом Израиля в конце странствий, с пустынной стороны Моава. Книга Чисел рассказывает, что сыны Израилевы «отправились из Овофа и остановились в Ийе-Авариме, в пустыне, что против Моава, к восходу солнца», а оттуда «отправились, и остановились на долине Заред»; в перечне станов они «расположились станом в Ийм-Авариме, на пределах Моава», а затем отправились «из Ийма», укороченной формы имени, в Дивон-Гад. Стан, значит, лежал на восточном краю Моавитского плато, где Израиль, обойдя Едом, повернул на север по кромке пустыни, близ ущелья Зареда, Вади-эль-Хаса, отделяющего Моав от Едома. Аварим, «земли за», — имя гор Моава, как их видят с запада."
    - "Какие развалины имеются в виду, неизвестно. Путь по краю пустыни усеян поселениями железного века, которые Нельсон Глюк обследовал в 1930-х годах, и кандидаты на карте — среди них: Хирбет-эль-Медейне на Вади-эль-Хаса, Мухай на плато к востоку и Хирбет-Аи, с более широкой догадкой в пределах хребта Аварим. Ни одно не раскапывали как Ийе-Аварим, а само имя, «развалины», подсказывает, что израильтяне стали у места, уже покинутого."
    - "Этот край сегодня — юг провинции Эль-Карак в Иордании, на краю восточной пустыни, через которую проходит Пустынное шоссе из Аммана в Акабу; Вади-эль-Хаса с горячими источниками бежит под этими местами к Мёртвому морю."
  uk:
    - "Ійє-Аварім, «руїни Аваріма», був станом Ізраїлю наприкінці блукань, на пустельному боці Моава. Книга Чисел розповідає, що народ «рушили дальше від Обота і стали табором в Іє-Абаримі у степу, що розкинувся перед Моабом на схід соньця», а звідти «рушили вони та й отаборились над потоком Серед»; перелік стоянок каже, що вони «отаборились у Ійм Абаримі, на границї Моаба», а потім рушили «з Ійма», скороченої форми назви, до Дівон-Гада. Синодальна Біблія пише Ійє-Аварім в оповіді та Ійм-Аварім та Ійм у переліку. Отже, стан лежав на східному краї моавського плато, де Ізраїль, обійшовши Едом, повернув на північ уздовж краю пустелі, поблизу ущелини Заред, Ваді-ель-Хаса, що відділяє Моав від Едому. Аварім, «країни по той бік», — назва гір Моава, побачених із заходу."
    - "Яка саме руїна мається на увазі, невідомо. Шлях уздовж краю пустелі вишиковано пам’ятками залізного віку, які Нельсон Глюк обстежив у 1930-х роках, і кандидати на карті серед них: Хірбет-ель-Медейне на Ваді-ель-Хаса, Мухайй на плато на сході та Хірбет-Аї, з ширшим припущенням у межах досяжності хребта Аварім. Жодного з них не розкопували як Ійє-Аварім, і сама назва, «руїни», наводить на думку, що ізраїльтяни отаборилися біля вже покинутого місця."
    - "Цей край нині — південна частина губернаторства Карак Йорданії, на краю східної пустелі, перетятий Пустельним шосе від Амману до Акаби; Ваді-ель-Хаса з її гарячими джерелами тече нижче пам’яток до Мертвого моря."
  es:
    - "Ije-abarim, «las ruinas de Abarim», fue un campamento de Israel al final de las peregrinaciones, en el lado desértico de Moab. Números cuenta que el pueblo partió de Obot y «asentaron en Ije-abarim, en el desierto que está delante de Moab, al nacimiento del sol», y de allí «asentaron en la arroyada de Zared»; la lista de estaciones los hace acampar «en Ije-abarim; en el término de Moab», y partir luego de Iim, forma abreviada del nombre, hacia Dibón-gad. La Biblia sinodal escribe Iye-Avarim en el relato e Iym-Avarim e Iym en la lista. El campamento estaba, por tanto, en el borde oriental de la meseta de Moab, donde Israel, tras bordear Edom, giró al norte por la orla del desierto, cerca de la garganta del Zered, el Wadi el-Hasa, que separa Moab de Edom. Abarim, «las regiones del otro lado», es el nombre de las montañas de Moab vistas desde el oeste."
    - "Se ignora qué ruina se quiere decir. La ruta por el borde del desierto está bordeada de yacimientos de la Edad del Hierro que Nelson Glueck prospectó en los años treinta, y los candidatos del mapa están entre ellos: Khirbet el-Medeineh, en el Wadi el-Hasa, Muhayy, en la meseta al este, y Khirbet Ai, con una conjetura más amplia al alcance de la cordillera de Abarim. Ninguno ha sido excavado como Ije-abarim, y el propio nombre, «ruinas», sugiere que los israelitas acamparon junto a un lugar ya abandonado."
    - "El país es hoy el sur de la gobernación de Karak, en Jordania, en el borde del desierto oriental, cruzado por la Carretera del Desierto de Amán a Áqaba; el Wadi el-Hasa, con sus fuentes termales, corre bajo los sitios hacia el mar Muerto."
  pt:
    - "Ie-Abarim, “as ruínas de Abarim”, foi um acampamento de Israel no fim das peregrinações, no lado do deserto de Moabe. Números conta que o povo “viajou de Obote e acampou em Ije-Abarim, no deserto que está defronte de Moabe, em direção ao nascer do sol”, e dali “viajaram e acamparam no vale de Zerede”; a lista de estações os faz “acampar em Ije-Abarim, na fronteira de Moabe”, e depois partir “de Ijim”, forma abreviada do nome, para Dibom-Gade. A Bíblia Sinodal escreve Iye-Avarim na narrativa e Iym-Avarim e Iym na lista. O acampamento ficava, portanto, na borda oriental do planalto moabita, onde Israel, tendo contornado Edom, virou para o norte ao longo da franja do deserto, perto da garganta do Zerede, o uádi el-Hasa, que separa Moabe de Edom. Abarim, “as regiões do outro lado”, é o nome das montanhas de Moabe vistas do oeste."
    - "Qual ruína se quer dizer é desconhecido. A rota ao longo da borda do deserto é ladeada de sítios da Idade do Ferro que Nelson Glueck prospectou na década de 1930, e os candidatos do mapa estão entre eles: Khirbet el-Medeineh, no uádi el-Hasa, Muhayy, no planalto a leste, e Khirbet Ai, com uma conjectura mais ampla ao alcance da cadeia de Abarim. Nenhum foi escavado como Ie-Abarim, e o próprio nome, “ruínas”, sugere que os israelitas acamparam junto a um lugar já deserto."
    - "A região é hoje o sul da província de Karak, na Jordânia, na orla do deserto oriental, cruzada pela Rodovia do Deserto de Amã a Aqaba; o uádi el-Hasa, com suas fontes termais, corre abaixo dos sítios rumo ao mar Morto."
  de:
    - "Ije-Abarim, „die Trümmer der Abarim“, war ein Lager Israels am Ende der Wanderung, auf der Wüstenseite Moabs. Das vierte Buch Mose berichtet: „Und von Oboth zogen sie aus und lagerten sich in Ije-Abarim, in der Wüste Moab, gegenüber gegen der Sonne Aufgang“, und von dort „zogen sie und lagerten sich am Bach Sered“; die Stationenliste lässt sie sich „in Ije-Abarim, in der Moabiter Gebiet“ lagern und dann „von Ijim“, einer verkürzten Form des Namens, nach Dibon-Gad aufbrechen. Die Synodalübersetzung schreibt Iye-Avarim in der Erzählung und Iym-Avarim und Iym in der Liste. Das Lager lag also am Ostrand der moabitischen Hochebene, wo Israel, nachdem es Edom umgangen hatte, am Wüstensaum nach Norden abbog, nahe der Schlucht des Sered, des Wadi el-Hasa, das Moab von Edom trennt. Abarim, „die Gegenden jenseits“, ist der Name der Berge Moabs, von Westen gesehen."
    - "Welche Ruine gemeint ist, ist unbekannt. Die Route am Wüstenrand ist von eisenzeitlichen Stätten gesäumt, die Nelson Glueck in den 1930er Jahren untersuchte, und die Kandidaten auf der Karte gehören dazu: Chirbet el-Medeine am Wadi el-Hasa, Muhaij auf der Hochebene weiter östlich und Chirbet Ai, mit einer weiter gefassten Vermutung in Reichweite des Abarim-Gebirges. Keine ist als Ije-Abarim ausgegraben, und der Name selbst, „Trümmer“, legt nahe, dass die Israeliten bei einem schon verlassenen Ort lagerten."
    - "Das Land ist heute das südliche Gouvernement Karak in Jordanien am Rand der östlichen Wüste, von der Wüstenstraße von Amman nach Akaba durchzogen; das Wadi el-Hasa mit seinen heißen Quellen läuft unterhalb der Stätten zum Toten Meer."
  fr:
    - "Ijé-Abarim, « les ruines d’Abarim », était un campement d’Israël à la fin des errances, du côté désertique de Moab. Les Nombres racontent : « Ils partirent d’Oboth et ils campèrent à Ijjé-Abarim, dans le désert qui est vis-à-vis de Moab, vers le soleil levant » ; puis « De là ils partirent, et ils campèrent dans la vallée de Zéred ». La liste des étapes les fait camper « à Ijjé-Abarim, sur la frontière de Moab », puis partir d’Iim, forme abrégée du nom, pour Dibon-Gad. La Bible synodale écrit Iye-Avarim dans le récit, et Iym-Avarim et Iym dans la liste. Le camp se trouvait donc au bord oriental du plateau moabite, là où Israël, après avoir contourné Édom, tourna vers le nord le long de la lisière du désert, près de la gorge du Zéred, l’oued el-Hasa, qui sépare Moab d’Édom. Abarim, « les régions d’au-delà », est le nom des montagnes de Moab vues de l’ouest."
    - "On ignore de quelle ruine il s’agit. La route le long de la lisière du désert est bordée de sites de l’âge du Fer que Nelson Glueck prospecta dans les années 1930, et les candidats de la carte sont parmi eux : Khirbet el-Medeineh sur l’oued el-Hasa, Muhayy sur le plateau à l’est, et Khirbet Ai, avec une conjecture plus large à portée de la chaîne d’Abarim. Aucun n’a été fouillé comme Ijé-Abarim, et le nom lui-même, « ruines », suggère que les Israélites campèrent près d’un lieu déjà abandonné."
    - "Le pays est aujourd’hui le sud du gouvernorat de Karak, en Jordanie, en bordure du désert oriental, traversé par la route du Désert d’Amman à Aqaba ; l’oued el-Hasa, avec ses sources chaudes, court en contrebas des sites vers la mer Morte."
