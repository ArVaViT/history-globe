body:
  en:
    - "Iye-abarim, “the ruins of Abarim”, was a camp of Israel at the end of the wanderings, on the desert side of Moab. Numbers tells that the people “journeyed from Oboth, and pitched at Ije-abarim, in the wilderness which is before Moab, toward the sunrising”, and from there “removed, and pitched in the valley of Zared”; the list of stations has them “pitched in Ije-abarim, in the border of Moab”, then departing “from Iim”, a shortened form of the name, for Dibon-gad. The Synodal Bible writes Iye-Avarim in the story and Iym-Avarim and Iym in the list. The camp probably lay on the eastern edge of the Moabite plateau, where Israel, having skirted Edom, turned north along the fringe of the desert, near the gorge of the Zered, the Wadi el-Hasa, that divides Moab from Edom. Abarim, “the regions beyond”, is the name of the mountains of Moab seen from the west."
    - "Which ruin is meant is unknown. The route along the desert edge is lined with Iron Age sites that Nelson Glueck surveyed in the 1930s, and two of the candidates on the map are among them: Khirbet el-Medeineh on the Wadi el-Hasa and Muhayy on the plateau to the east. A third, Khirbet Ai, lies instead on the western edge of the Karak plateau, and a wider guess puts the camp within reach of the Abarim range. None has been excavated as Iye-abarim, and the name itself, “ruins”, suggests the Israelites camped by a place already deserted."
    - "The country is today the southern Karak governorate of Jordan, on the edge of the eastern desert, crossed by the Desert Highway from Amman to Aqaba; the Wadi el-Hasa, with its hot springs, runs below the sites toward the Dead Sea."
  ru:
    - "Ийе-Аварим, «развалины Аварима», был станом Израиля в конце странствий, с пустынной стороны Моава. Книга Чисел рассказывает, что сыны Израилевы «отправились из Овофа и остановились в Ийе-Авариме, в пустыне, что против Моава, к восходу солнца», а оттуда «отправились, и остановились на долине Заред»; в перечне станов они «расположились станом в Ийм-Авариме, на пределах Моава», а затем отправились «из Ийма», укороченной формы имени, в Дивон-Гад. Стан, вероятно, лежал на восточном краю Моавитского плато, где Израиль, обойдя Едом, повернул на север по кромке пустыни, близ ущелья Зареда, Вади-эль-Хаса, отделяющего Моав от Едома. Аварим, «земли за», — имя гор Моава, как их видят с запада."
    - "Какие развалины имеются в виду, неизвестно. Путь по краю пустыни усеян поселениями железного века, которые Нельсон Глюк обследовал в 1930-х годах, и два кандидата на карте — среди них: Хирбет-эль-Медейне на Вади-эль-Хаса и Мухай на плато к востоку. Третий, Хирбет-Аи, лежит, напротив, на западном краю плато Эль-Карак, а более широкая догадка помещает стан в пределах хребта Аварим. Ни одно не раскапывали как Ийе-Аварим, а само имя, «развалины», подсказывает, что израильтяне стали у места, уже покинутого."
    - "Этот край сегодня — юг провинции Эль-Карак в Иордании, на краю восточной пустыни, через которую проходит Пустынное шоссе из Аммана в Акабу; Вади-эль-Хаса с горячими источниками бежит под этими местами к Мёртвому морю."
  uk:
    - "Ійє-Аварім, «руїни Аваріма», був станом Ізраїлю наприкінці блукань, на пустельному боці Моава. Книга Чисел розповідає, що народ «рушили дальше від Обота і стали табором в Іє-Абаримі у степу, що розкинувся перед Моабом на схід соньця», а звідти «рушили вони та й отаборились над потоком Серед»; перелік стоянок каже, що вони «отаборились у Ійм Абаримі, на границї Моаба», а потім рушили «з Ійма», скороченої форми назви, до Дівон-Гада. Синодальна Біблія пише Ійє-Аварім в оповіді та Ійм-Аварім та Ійм у переліку. Імовірно, стан лежав на східному краї моавського плато, де Ізраїль, обійшовши Едом, повернув на північ уздовж краю пустелі, поблизу ущелини Заред, Ваді-ель-Хаса, що відділяє Моав від Едому. Аварім, «країни по той бік», — назва гір Моава, побачених із заходу."
    - "Яка саме руїна мається на увазі, невідомо. Шлях уздовж краю пустелі вишиковано пам’ятками залізного віку, які Нельсон Глюк обстежив у 1930-х роках, і два кандидати на карті серед них: Хірбет-ель-Медейне на Ваді-ель-Хаса та Мухайй на плато на сході. Третій, Хірбет-Аї, лежить натомість на західному краї плато Карак, а ширше припущення ставить стан у межах досяжності хребта Аварім. Жодного з них не розкопували як Ійє-Аварім, і сама назва, «руїни», наводить на думку, що ізраїльтяни отаборилися біля вже покинутого місця."
    - "Цей край нині — південна частина губернаторства Карак Йорданії, на краю східної пустелі, перетятий Пустельним шосе від Амману до Акаби; Ваді-ель-Хаса з її гарячими джерелами тече нижче пам’яток до Мертвого моря."
  es:
    - "Ije-abarim, «las ruinas de Abarim», fue un campamento de Israel al final de las peregrinaciones, en el lado desértico de Moab. Números cuenta que el pueblo partió de Obot y «asentaron en Ije-abarim, en el desierto que está delante de Moab, al nacimiento del sol», y de allí «asentaron en la arroyada de Zared»; la lista de estaciones los hace acampar «en Ije-abarim; en el término de Moab», y partir luego de Iim, forma abreviada del nombre, hacia Dibón-gad. La Biblia sinodal escribe Iye-Avarim en el relato e Iym-Avarim e Iym en la lista. El campamento estaba probablemente en el borde oriental de la meseta de Moab, donde Israel, tras bordear Edom, giró al norte por la orla del desierto, cerca de la garganta del Zered, el Wadi el-Hasa, que separa Moab de Edom. Abarim, «las regiones del otro lado», es el nombre de las montañas de Moab vistas desde el oeste."
    - "Se ignora qué ruina se quiere decir. La ruta por el borde del desierto está bordeada de yacimientos de la Edad del Hierro que Nelson Glueck prospectó en los años treinta, y dos de los candidatos del mapa están entre ellos: Khirbet el-Medeineh, en el Wadi el-Hasa, y Muhayy, en la meseta al este. Un tercero, Khirbet Ai, se halla en cambio en el borde occidental de la meseta de Karak, y una conjetura más amplia sitúa el campamento al alcance de la cordillera de Abarim. Ninguno ha sido excavado como Ije-abarim, y el propio nombre, «ruinas», sugiere que los israelitas acamparon junto a un lugar ya abandonado."
    - "El país es hoy el sur de la gobernación de Karak, en Jordania, en el borde del desierto oriental, cruzado por la Carretera del Desierto de Amán a Áqaba; el Wadi el-Hasa, con sus fuentes termales, corre bajo los sitios hacia el mar Muerto."
  pt:
    - "Ie-Abarim, “as ruínas de Abarim”, foi um acampamento de Israel no fim das peregrinações, no lado do deserto de Moabe. Números conta que o povo “viajou de Obote e acampou em Ije-Abarim, no deserto que está defronte de Moabe, em direção ao nascer do sol”, e dali “viajaram e acamparam no vale de Zerede”; a lista de estações os faz “acampar em Ije-Abarim, na fronteira de Moabe”, e depois partir “de Ijim”, forma abreviada do nome, para Dibom-Gade. A Bíblia Sinodal escreve Iye-Avarim na narrativa e Iym-Avarim e Iym na lista. O acampamento ficava provavelmente na borda oriental do planalto moabita, onde Israel, tendo contornado Edom, virou para o norte ao longo da franja do deserto, perto da garganta do Zerede, o uádi el-Hasa, que separa Moabe de Edom. Abarim, “as regiões do outro lado”, é o nome das montanhas de Moabe vistas do oeste."
    - "Qual ruína se quer dizer é desconhecido. A rota ao longo da borda do deserto é ladeada de sítios da Idade do Ferro que Nelson Glueck prospectou na década de 1930, e dois dos candidatos do mapa estão entre eles: Khirbet el-Medeineh, no uádi el-Hasa, e Muhayy, no planalto a leste. Um terceiro, Khirbet Ai, fica em vez disso na borda ocidental do planalto de Karak, e uma conjectura mais ampla põe o acampamento ao alcance da cadeia de Abarim. Nenhum foi escavado como Ie-Abarim, e o próprio nome, “ruínas”, sugere que os israelitas acamparam junto a um lugar já deserto."
    - "A região é hoje o sul da província de Karak, na Jordânia, na orla do deserto oriental, cruzada pela Rodovia do Deserto de Amã a Aqaba; o uádi el-Hasa, com suas fontes termais, corre abaixo dos sítios rumo ao mar Morto."
  de:
    - "Ije-Abarim, „die Trümmer der Abarim“, war ein Lager Israels am Ende der Wanderung, auf der Wüstenseite Moabs. Das vierte Buch Mose berichtet: „Und von Oboth zogen sie aus und lagerten sich in Ije-Abarim, in der Wüste Moab, gegenüber gegen der Sonne Aufgang“, und von dort „zogen sie und lagerten sich am Bach Sered“; die Stationenliste lässt sie sich „in Ije-Abarim, in der Moabiter Gebiet“ lagern und dann „von Ijim“, einer verkürzten Form des Namens, nach Dibon-Gad aufbrechen. Die Synodalübersetzung schreibt Iye-Avarim in der Erzählung und Iym-Avarim und Iym in der Liste. Das Lager lag wahrscheinlich am Ostrand der moabitischen Hochebene, wo Israel, nachdem es Edom umgangen hatte, am Wüstensaum nach Norden abbog, nahe der Schlucht des Sered, des Wadi el-Hasa, das Moab von Edom trennt. Abarim, „die Gegenden jenseits“, ist der Name der Berge Moabs, von Westen gesehen."
    - "Welche Ruine gemeint ist, ist unbekannt. Die Route am Wüstenrand ist von eisenzeitlichen Stätten gesäumt, die Nelson Glueck in den 1930er Jahren untersuchte, und zwei der Kandidaten auf der Karte gehören dazu: Chirbet el-Medeine am Wadi el-Hasa und Muhaij auf der Hochebene weiter östlich. Ein dritter, Chirbet Ai, liegt dagegen am Westrand der Hochebene von Karak, und eine weiter gefasste Vermutung setzt das Lager in Reichweite des Abarim-Gebirges. Keine ist als Ije-Abarim ausgegraben, und der Name selbst, „Trümmer“, legt nahe, dass die Israeliten bei einem schon verlassenen Ort lagerten."
    - "Das Land ist heute das südliche Gouvernement Karak in Jordanien am Rand der östlichen Wüste, von der Wüstenstraße von Amman nach Akaba durchzogen; das Wadi el-Hasa mit seinen heißen Quellen läuft unterhalb der Stätten zum Toten Meer."
  fr:
    - "Ijé-Abarim, « les ruines d’Abarim », était un campement d’Israël à la fin des errances, du côté désertique de Moab. Les Nombres racontent : « Ils partirent d’Oboth et ils campèrent à Ijjé-Abarim, dans le désert qui est vis-à-vis de Moab, vers le soleil levant » ; puis « De là ils partirent, et ils campèrent dans la vallée de Zéred ». La liste des étapes les fait camper « à Ijjé-Abarim, sur la frontière de Moab », puis partir d’Iim, forme abrégée du nom, pour Dibon-Gad. La Bible synodale écrit Iye-Avarim dans le récit, et Iym-Avarim et Iym dans la liste. Le camp se trouvait probablement au bord oriental du plateau moabite, là où Israël, après avoir contourné Édom, tourna vers le nord le long de la lisière du désert, près de la gorge du Zéred, l’oued el-Hasa, qui sépare Moab d’Édom. Abarim, « les régions d’au-delà », est le nom des montagnes de Moab vues de l’ouest."
    - "On ignore de quelle ruine il s’agit. La route le long de la lisière du désert est bordée de sites de l’âge du Fer que Nelson Glueck prospecta dans les années 1930, et deux des candidats de la carte sont parmi eux : Khirbet el-Medeineh sur l’oued el-Hasa et Muhayy sur le plateau à l’est. Un troisième, Khirbet Ai, se trouve en revanche au bord occidental du plateau de Karak, et une conjecture plus large place le camp à portée de la chaîne d’Abarim. Aucun n’a été fouillé comme Ijé-Abarim, et le nom lui-même, « ruines », suggère que les Israélites campèrent près d’un lieu déjà abandonné."
    - "Le pays est aujourd’hui le sud du gouvernorat de Karak, en Jordanie, en bordure du désert oriental, traversé par la route du Désert d’Amman à Aqaba ; l’oued el-Hasa, avec ses sources chaudes, court en contrebas des sites vers la mer Morte."
  pl:
    - "Ije-Abarim, „ruiny Abarim”, było obozem Izraela pod koniec wędrówek, po pustynnej stronie Moabu. Księga Liczb opowiada: „A z Obot ruszywszy się położyli się obozem na pagórkach gór Habarym na puszczy, która jest przeciw Moabczykom od wschodu słońca”, a stamtąd „położyli się obozem nad potokiem Zered”; wykaz stacji ma: „położyli się obozem przy pagórkach Abarym, na granicy Moabskiej”, a potem wyruszyli „z Abarym”, skróconą formą nazwy, do Dibon-Gad. Biblia synodalna pisze Ije-Awarim w opowieści oraz Ijm-Awarim i Ijm w wykazie. Obóz leżał prawdopodobnie na wschodnim skraju płaskowyżu moabskiego, gdzie Izrael, obszedłszy Edom, skręcił na północ wzdłuż skraju pustyni, blisko wąwozu Zared, Wadi el-Chasa, który oddziela Moab od Edomu. Abarim, „regiony po drugiej stronie”, to nazwa gór Moabu widzianych od zachodu."
    - "Którą ruinę rozumieć, nie wiadomo. Trasa wzdłuż skraju pustyni jest usiana stanowiskami z epoki żelaza, które Nelson Glueck badał w latach trzydziestych, a dwaj z kandydatów na mapie są wśród nich: Chirbet el-Medejne nad Wadi el-Chasa i Muchajj na płaskowyżu na wschód. Trzeci, Chirbet Aj, leży natomiast na zachodnim skraju płaskowyżu Karak, a szerszy domysł umieszcza obóz w zasięgu pasma Abarim. Żaden nie był badany jako Ije-Abarim, a sama nazwa, „ruiny”, sugeruje, że Izraelici obozowali przy miejscu już opuszczonym."
    - "Kraj to dziś południowa prowincja Karak w Jordanii, na skraju wschodniej pustyni, przecięta Autostradą Pustynną z Ammanu do Akaby; Wadi el-Chasa z gorącymi źródłami biegnie poniżej stanowisk ku Morzu Martwemu."
  it:
    - "Iie-Abarim, «le rovine di Abarim», era un accampamento d’Israele alla fine delle peregrinazioni, sul lato desertico di Moab. I Numeri raccontano che il popolo, «partitisi da Oboth, si accamparono a Ije-Abarim nel deserto ch’è dirimpetto a Moab dal lato dove sorge il sole», e da lì «Di là si partirono e si accamparono nella valle di Zered»; l’elenco delle tappe li ha «a Ije-Abarim sui confini di Moab», poi in partenza «da Ijim», forma abbreviata del nome, per Dibon-Gad. La Bibbia sinodale scrive Iye-Avarim nel racconto e Iym-Avarim e Iym nell’elenco. L’accampamento si trovava probabilmente al margine orientale dell’altopiano moabita, dove Israele, aggirato Edom, si volse a nord lungo la fascia del deserto, presso la gola dello Zered, il Wadi el-Hasa, che divide Moab da Edom. Abarim, «le regioni al di là», è il nome dei monti di Moab visti da ovest."
    - "Quale rovina sia intesa è ignoto. Il percorso lungo il margine del deserto è punteggiato di siti dell’età del Ferro che Nelson Glueck ricognì negli anni Trenta, e due dei candidati sulla mappa sono fra questi: Khirbet el-Medeineh sul Wadi el-Hasa e Muhayy sull’altopiano a est. Un terzo, Khirbet Ai, si trova invece sul margine occidentale dell’altopiano di Karak, e una congettura più ampia pone l’accampamento a portata della catena di Abarim. Nessuno è stato scavato come Iie-Abarim, e il nome stesso, «rovine», suggerisce che gli Israeliti si accampassero presso un luogo già deserto."
    - "Il paese è oggi il governatorato giordano meridionale di Karak, al margine del deserto orientale, attraversato dalla Desert Highway da Amman ad Aqaba; il Wadi el-Hasa, con le sue sorgenti termali, scorre sotto i siti verso il Mar Morto."
  nl:
    - "Ijje-Abarim, “de ruïnes van Abarim”, was een legerplaats van Israël aan het eind van de omzwervingen, aan de woestijnkant van Moab. Numeri vertelt: “Daarna reisden zij van Oboth, en legerden zich aan de heuvelen van Abarim in de woestijn, die tegenover Moab is, tegen den opgang der zon”, en dan “bij de beek Zered”; de lijst van haltes heeft hen “aan de heuvelen van Abarim, in de landpale van Moab”, en laat hen dan vanuit Ijim, een verkorte vorm van de naam, naar Dibon-Gad vertrekken. De Synodale Bijbel schrijft Iye-Avarim in het verhaal en Iym-Avarim en Iym in de lijst. De legerplaats lag waarschijnlijk aan de oostrand van Moabs plateau, waar Israël, na Edom te hebben omzeild, noordwaarts boog langs de woestijnrand, bij de kloof van de Zered, de Wadi el-Hasa, die Moab van Edom scheidt. Abarim, “de streken aan de overkant”, is de naam van Moabs gebergte, van het westen gezien."
    - "Welke ruïne bedoeld is, is onbekend. De route langs de woestijnrand ligt vol plaatsen uit de IJzertijd die Nelson Glueck in de jaren dertig onderzocht, en twee van de kandidaten op de kaart behoren daartoe: Khirbet el-Medeineh aan de Wadi el-Hasa en Muhayy op het plateau in het oosten. Een derde, Khirbet Ai, ligt daarentegen aan de westrand van het plateau van Karak, en een bredere gok legt de legerplaats binnen bereik van het Abarimgebergte. Geen is als Ijje-Abarim opgegraven, en de naam zelf, “ruïnes”, doet vermoeden dat de Israëlieten kampeerden bij een reeds verlaten plaats."
    - "Het gebied is nu het zuidelijke gouvernement Karak van Jordanië, aan de rand van de oostelijke woestijn, doorkruist door de Woestijnweg van Amman naar Aqaba; de Wadi el-Hasa, met zijn warme bronnen, loopt onder de plaatsen door naar de Dode Zee."
  cs:
    - "Ijje-abarím, „zříceniny Abárímu“, byl tábor Izraele na konci putování, na pouštní straně Moábu. Numeri vypráví, že lid „hnuvše se z Obot, položili se při pahrbcích hor Abarim na poušti, kteráž jest naproti zemi Moábské k východu slunce“, a odtud „položili se v údolí Záred“; podle seznamu stanic „rozbili stany při pahrbcích hor Abarim, na pomezí Moábském“, pak odcházejí z Ijimu, zkrácené podoby jména, do Dibon-gadu. Synodální Bible píše Iye-Avarim ve vyprávění a Iym-Avarim a Iym v seznamu. Tábor pravděpodobně ležel na východním okraji moábské náhorní plošiny, kde Izrael, obešedše Edóm, zahnul na sever podél pouštního okraje, poblíž soutěsky Zeredu, Wádí el-Hasa, která odděluje Moáb od Edómu. Abárím, „kraje za“, je jméno pohoří Moábu viděného ze západu."
    - "Která zřícenina se míní, není známo. Cesta podél pouštního okraje je lemována sídlišti doby železné, která Nelson Glueck zkoumal ve 30. letech 20. století, a dva z kandidátů na mapě patří mezi ně: Chirbet el-Medeineh na Wádí el-Hasa a Muhayy na plošině na východě. Třetí, Chirbet Ai, leží naopak na západním okraji plošiny Karak a širší odhad klade tábor do dosahu pohoří Abárím. Žádný nebyl vykopáván jako Ijje-abarím a samo jméno, „zříceniny“, naznačuje, že Izraelité tábořili u místa již opuštěného."
    - "Kraj je dnes jižní gubernie Karak v Jordánsku, na okraji východní pouště, křížený Pouštní dálnicí z Ammánu do Akaby; Wádí el-Hasa s horkými prameny teče pod sídlišti k Mrtvému moři."
  sv:
    - "Ije-Haabarim, ”Abarims ruiner”, var ett läger för Israel i slutet av vandringen, på öknens sida av Moab. Fjärde Moseboken berättar att folket bröt upp från Ovot och ”lägrade sig vid Ije-Haabarim i öknen som ligger framför Moab, österut”, och att det därifrån bröt upp och ”lägrade sig i Sereds dal”; stationsförteckningen säger att de ”lägrade sig i Ije-Haabarim vid Moabs gräns”, och därefter bröt de upp ”från Ijim”, en förkortad form av namnet, till Dibon-Gad. Den ryska synodalbibeln skriver Iye-Avarim i berättelsen och Iym-Avarim och Iym i förteckningen. Lägret låg sannolikt på Moabplatåns östra kant, där Israel, efter att ha gått runt Edom, vände norrut längs ökenbrynet, nära klyftan Sered, Wadi el-Hasa, som skiljer Moab från Edom. Abarim, ”trakterna på andra sidan”, är namnet på Moabs berg sedda från väster."
    - "Vilken ruin som avses är okänt. Vägen längs ökenkanten kantas av järnåldersplatser som Nelson Glueck kartlade på 1930-talet, och två av kandidaterna på kartan är bland dem: Khirbet el-Medeineh vid Wadi el-Hasa och Muhayy på platån i öster. En tredje, Khirbet Ai, ligger i stället i västra kanten av Karakplatån, och en vidare gissning placerar lägret inom räckhåll för Abarimbergen. Ingen har grävts ut som Ije-Haabarim, och själva namnet, ”ruiner”, antyder att israeliterna slog läger vid en redan övergiven plats."
    - "Trakten är i dag södra Jordaniens guvernement Karak, i kanten av östra öknen, genomkorsad av Ökenvägen från Amman till Aqaba; Wadi el-Hasa, med sina heta källor, löper nedanför platserna mot Döda havet."
  nb:
    - "Ije-Abarim, «Abarims ruiner», var en leir for Israel mot slutten av vandringen, på ørkensiden av Moab. Fjerde Mosebok forteller at folket brøt opp «fra Obot og leiret sig ved Ije-Ha'abarim i ørkenen rett i øst for Moab», og derfra brøt de opp og «leiret sig i Sered-dalen»; stasjonslisten har at de «leiret sig i Ije-Ha'abarim ved Moabs grense», og så drog «fra Ijim», en forkortet form av navnet, til Dibon-Gad. Den synodale bibelen skriver Iye-Avarim i fortellingen og Iym-Avarim og Iym i listen. Leiren lå trolig i østkanten av det moabittiske platået, der Israel, etter å ha gått rundt Edom, svingte nordover langs ørkenens rand, nær juvet til Sered, Wadi el-Hasa, som skiller Moab fra Edom. Abarim, «landstrekningene hinsides», er navnet på Moabs fjell sett fra vest."
    - "Hvilken ruin som menes, er ukjent. Ruten langs ørkenkanten er kantet av jernalderssteder som Nelson Glueck kartla på 1930-tallet, og to av kandidatene på kartet er blant dem: Khirbet el-Medeineh ved Wadi el-Hasa og Muhayy på platået mot øst. En tredje, Khirbet Ai, ligger i stedet i vestkanten av Karak-platået, og en videre gjetning setter leiren innen rekkevidde av Abarim-fjellene. Ingen er gravd ut som Ije-Abarim, og selve navnet, «ruiner», antyder at israelittene slo leir ved et sted som allerede var forlatt."
    - "Landet er i dag det sørlige Karak-guvernementet i Jordan, i kanten av den østlige ørkenen, krysset av Ørkenveien fra Amman til Aqaba; Wadi el-Hasa, med sine varme kilder, løper under stedene mot Dødehavet."
  tl:
    - "Ang Ije-abarim, “mga guho ng Abarim”, ay kampo ng Israel sa dulo ng paglalagalag, sa panig ng disyerto ng Moab. Sabi ng Mga Bilang, “naglakbay mula sa Oboth, at humantong sa Ije-abarim sa ilang na nasa tapat ng Moab, sa dakong sinisikatan ng araw”, at mula roon “naglakbay sila, at humantong sa libis ng Zared”; sa talaan ng mga hantungan, “humantong sa Igeabarim, sa hangganan ng Moab”, at saka umalis mula sa Iim, pinaikling anyo ng pangalan, patungong Dibon-gad. Isinusulat ng Bibliyang Synodal na Iye-Avarim sa salaysay at Iym-Avarim at Iym sa talaan. Ang kampo ay marahil nasa silangang gilid ng talampas ng Moab, kung saan ang Israel, na lumibot sa Edom, ay lumiko sa hilaga sa gilid ng disyerto, malapit sa bangin ng Zared, ang Wadi el-Hasa, na naghihiwalay sa Moab at Edom. Ang Abarim, “ang mga rehiyon sa kabila”, ay mga bundok ng Moab na nakikita mula sa kanluran."
    - "Hindi alam kung aling guho ang tinutukoy. Ang ruta sa gilid ng disyerto ay may hanay ng mga lugar ng Panahon ng Bakal na sinuri ni Nelson Glueck noong dekada 1930, at dalawa sa mga kandidato sa mapa ay kabilang dito: ang Khirbet el-Medeineh sa Wadi el-Hasa at ang Muhayy sa talampas sa silangan. Ang ikatlo, ang Khirbet Ai, ay nasa halip sa kanlurang gilid ng talampas ng Karak, at ang mas malawak na hula ay naglalagay sa kampo sa abot ng hanay ng Abarim. Walang nahukay bilang Ije-abarim, at ang pangalan mismo, “mga guho”, ay nagmumungkahing nagkampo ang mga Israelita sa tabi ng lugar na nilisan na."
    - "Ang lupain ay ngayon ang timog na gobernadorado ng Karak ng Jordan, sa gilid ng silangang disyerto, na tinatawid ng Desert Highway mula Amman patungong Aqaba; ang Wadi el-Hasa, na may mainit na bukal, ay dumadaloy sa ibaba ng mga lugar patungo sa Dagat na Patay."
  da:
    - "Ijje-ha-Abarim, »Abarims ruiner«, var en lejr for Israel ved vandringernes slutning, på ørkensiden af Moab. Fjerde Mosebog fortæller, at folket »rejste fra Oboth, og de lejrede sig ved Abirams Høje i Ørken, som er lige foran Moab, mod Solens Opgang«; derefter hedder det: »Derfra rejste de og lejrede sig ved den Bæk Sered«. Stationslisten har dem »ved Abarims Høje, ved Moabiternes Landemærke« og lader dem derpå forlade »Højene«, en forkortet form af navnet, for Dibon-Gad. Den russiske synodalbibel skriver Ije-Avarim i fortællingen og Ijm-Avarim og Ijm i listen. Lejren lå sandsynligvis på Moab-plateauets østkant, hvor Israel, efter at have omgået Edom, drejede mod nord langs ørkenens rand, nær Zered-kløften, Wadi el-Hasa, der skiller Moab fra Edom. Abarim, »landene hinsides«, er navnet på Moabs bjerge set fra vest."
    - "Hvilken ruin der menes, er ukendt. Ruten langs ørkenranden er kantet med jernaldersteder, som Nelson Glueck kortlagde i 1930'erne, og to af kortets kandidater er blandt dem: Khirbet el-Medeineh ved Wadi el-Hasa og Muhayy på plateauet mod øst. En tredje, Khirbet Ai, ligger i stedet på den vestlige kant af Karak-plateauet, og et videre gæt placerer lejren inden for rækkevidde af Abarim-kæden. Ingen er udgravet som Ijje-ha-Abarim, og selve navnet, »ruiner«, antyder, at israelitterne slog lejr ved et sted, der allerede var forladt."
    - "Landet er i dag det sydlige Karak-guvernement i Jordan, i udkanten af den østlige ørken, krydset af Ørkenvejen fra Amman til Aqaba; Wadi el-Hasa, med sine varme kilder, løber under stederne mod Det Døde Hav."
  sr:
    - "Ије-Аварим, „рушевине Аварима“, био је логор Израиља на крају лутања, на пустињској страни Моава. Бројеви приповедају да „и из Овота отишавши стадоше у логор на брдима аваримским у пустињи која је према моавској с истока“, а оданде „стадоше у логор у долини Зареду“; списак станица има: „стадоше у логор на хумовима аваримским на међи моавској“, а затим одлазе из Ије, скраћеног облика имена, у Девон-Гад. Руски синодски превод пише Ије-Аварим у причи, а Иим-Аварим и Иим у списку. Логор је вероватно лежао на источном ободу моавске висоравни, где је Израиљ, пошто је обишао Едом, скренуо на север дуж ивице пустиње, близу клисуре Зареда, Вади ел-Хасе, која дели Моав од Едома. Аварим, „крајеви с оне стране“, име је планина Моава виђених са запада."
    - "Која је рушевина мишљена, непознато је. Пут дуж ивице пустиње обложен је налазиштима гвозденог доба која је Нелсон Глик истраживао тридесетих година 20. века, а два кандидата на карти су међу њима: Хирбет ел-Медејна на Вади ел-Хаси и Мухај на висоравни источно. Трећи, Хирбет Аи, лежи уместо тога на западном ободу висоравни Керака, а шира претпоставка ставља логор у домет венца Аварима. Ни једно није ископавано као Ије-Аварим, а само име, „рушевине“, указује да су Израиљци логоровали поред места већ напуштеног."
    - "Крај је данас јужни гувернорат Карак у Јордану, на ободу источне пустиње, који прелази Пустињски аутопут од Амана до Акабе; Вади ел-Хаса, са својим топлим изворима, тече испод налазишта према Мртвом мору."
  hu:
    - "Ijjé-Abárim, „Abárim romjai”, Izráel tábora volt a vándorlások végén, Moáb sivatagi oldalán. A Számok könyve szerint a nép „Obóthból is elindulának, és tábort ütének Hije-Abarimban, abban a pusztában, a mely Moáb előtt vala napkelet felől”, majd onnan „elindulának, és tábort ütének Zéred völgyében”; az állomásjegyzék szerint „tábort ütének Ijé-Abárimban, a Moáb határán”, majd „Ijé-Abárimból” indultak Dibon-Gádba (a King James Version itt rövidített alakot ad, „Iim”-et). A szinodális Biblia Ije-Avarim alakban írja az elbeszélésben, Ijm-Avarim és Ijm alakban a jegyzékben. A tábor valószínűleg a moábi fennsík keleti szélén feküdt, ahol Izráel, Edomot megkerülve, a sivatag peremén észak felé fordult, a Moábot Edomtól elválasztó Zéred, a Vádi el-Haszá szurdoka közelében. Abárim, „a túloldali vidékek”, a nyugatról látott moábi hegyek neve."
    - "Hogy melyik rom, nem ismert. A sivatag szélén húzódó út sok vaskori lelőhellyel szegélyezett, amelyeket Nelson Glueck az 1930-as években felmért, és a térkép két jelöltje közéjük tartozik: Hirbet el-Medejne a Vádi el-Haszán és Muhajj a keletre lévő fennsíkon. Egy harmadik, Hirbet Aj, a kerak-fennsík nyugati szélén fekszik, és egy tágabb tipp a tábort az Abárim-hegység elérhető közelébe helyezi. Egyiket sem ásták ki Ijjé-Abárimként, és maga a név, „romok”, azt sugallja, hogy az izraeliták már elhagyatott hely mellett táboroztak."
    - "A vidék ma Jordánia déli Karak kormányzósága, a keleti sivatag szélén, amelyen az Ammánból Akabába vezető Sivatagi Autópálya halad át; a Vádi el-Haszá forró forrásaival a lelőhelyek alatt fut a Holt-tenger felé."
  fi:
    - "Ijje-Abarim, ”Abarimin rauniot”, oli Israelin leiri vaelluksen lopulla Moabin autiomaanpuolella. Mooseksen neljäs kirja kertoo, että kansa ”lähti liikkeelle Oobotista ja leiriytyi Iije-Abarimiin siinä erämaassa, joka on Mooabista itään, auringon nousun puolella”, ja sieltä ”lähtivät liikkeelle ja leiriytyivät Seredin laaksoon”; asemaluettelossa he ”leiriytyivät Iije-Abarimiin Mooabin rajalle”, minkä jälkeen he lähtivät ”Iijimistä”, nimen lyhennetystä muodosta, Diibon-Gaadiin. Synodaalinen Raamattu kirjoittaa Iye-Avarim kertomuksessa ja Iym-Avarim ja Iym luettelossa. Leiri sijaitsi luultavasti Moabin ylätasangon itäreunalla, missä Israel, kierrettyään Edomin, kääntyi pohjoiseen aavikon reunaa pitkin, lähellä Seredin rotkoa, Wadi el-Hasaa, joka erottaa Moabin Edomista. Abarim, ”tuolla puolen olevat alueet”, on lännestä katsoen Moabin vuorten nimi."
    - "Mikä rauniokohde tarkoitetaan, on tuntematon. Aavikon reunaa seuraava reitti on täynnä rautakautisia paikkoja, joita Nelson Glueck kartoitti 1930-luvulla, ja kaksi kartan ehdokkaista on niiden joukossa: Khirbet el-Medeineh Wadi el-Hasalla ja Muhayy itäisellä ylätasangolla. Kolmas, Khirbet Ai, sijaitsee sen sijaan Karakin ylätasangon länsireunalla, ja laajempi arvaus sijoittaa leirin Abarim-vuorijonon ulottuville. Mitään ei ole kaivettu Ijje-Abarimina, ja nimi itse, ”rauniot”, viittaa siihen, että israelilaiset leiriytyivät jo autioituneen paikan viereen."
    - "Seutu on nykyään Jordanian eteläinen Karakin kuvernementti itäisen aavikon reunalla, jonka halki kulkee Ammanista Aqabaan johtava Aavikkotie; Wadi el-Hasa kuumine lähteineen virtaa paikkojen alapuolella kohti Kuollutta merta."
  vi:
    - "Y-giê A-ba-rim, “những đống đổ nát của A-ba-rim”, là một trại của Y-sơ-ra-ên ở cuối cuộc lang thang, phía sa mạc của Mô-áp. Dân Số Ký kể rằng dân “đi từ Ô-bốt và đóng trại tại Y-giê-A-ba-rim, tại đồng vắng, đối ngang Mô-áp về hướng mặt trời mọc”, và rồi “Họ đi từ đó đóng trại tại đèo Xê-rết”; bảng các chặng có họ đóng trại “tại Y-giê-A-ba-rim, trên bờ cõi Mô-áp”, rồi rời Y-dim, dạng rút gọn của tên, đến Đi-bôn-Gát. Bản Synodal viết Iye-Avarim trong câu chuyện và Iym-Avarim và Iym trong bảng. Trại có lẽ nằm ở rìa đông của cao nguyên Mô-áp, nơi Y-sơ-ra-ên, sau khi vòng qua Ê-đôm, quay lên phía bắc dọc rìa sa mạc, gần hẻm núi Xê-rết, Wadi el-Hasa, ngăn Mô-áp với Ê-đôm. A-ba-rim, “những vùng bên kia”, là tên các dãy núi Mô-áp nhìn từ phía tây."
    - "Không biết phế tích nào được nói đến. Tuyến dọc rìa sa mạc có nhiều địa điểm thời Đồ Sắt mà Nelson Glueck khảo sát vào thập niên 1930, và hai trong các ứng viên trên bản đồ nằm trong số đó: Khirbet el-Medeineh trên Wadi el-Hasa và Muhayy trên cao nguyên phía đông. Một ứng viên thứ ba, Khirbet Ai, nằm ở rìa tây cao nguyên Karak, và một phỏng đoán rộng hơn đặt trại trong tầm với của dãy A-ba-rim. Chưa nơi nào được khai quật như là Y-giê A-ba-rim, và chính tên, “đống đổ nát”, gợi rằng người Y-sơ-ra-ên cắm trại bên một nơi đã hoang vắng."
    - "Vùng này ngày nay là nam tỉnh Karak của Jordan, ở rìa sa mạc phía đông, có Quốc lộ Sa mạc từ Amman đến Aqaba đi qua; Wadi el-Hasa, với các suối nước nóng, chảy bên dưới các địa điểm về phía Biển Chết."
  ro:
    - "Ie-Abarim, „ruinele Abarimului”, era o tabără a lui Israel la sfârșitul rătăcirilor, pe partea de deșert a Moabului. Numeri spune că poporul „ridicându-se din Ovot, au tăbărît în Ahalghe, dincolo în pustia care este despre fața lui Moav, spre răsăritul soarelui”, iar de acolo „s’au sculat și au tăbărît în valea Zared”; lista popasurilor îi arată cum „au purces din Ovot și au tăbărît în Gai dincoace de hotarele lui Moav”, apoi plecând „din Gai” spre „Devonul lui Gad”. Biblia sinodală scrie numele Iye-Avarim în povestire și Iym-Avarim și Iym în listă. Tabăra se afla probabil pe marginea estică a podișului moabit, unde Israel, după ce ocolise Edomul, a cotit spre nord de-a lungul marginii deșertului, lângă defileul Zered, Wadi el-Hasa, care desparte Moabul de Edom. Abarim, „regiunile de dincolo”, este numele munților Moabului văzuți dinspre vest."
    - "Care ruină este vizată nu se știe. Traseul de-a lungul marginii deșertului este mărginit de situri din Epoca Fierului cercetate de Nelson Glueck în anii 1930, iar doi dintre candidații de pe hartă sunt printre ele: Khirbet el-Medeineh pe Wadi el-Hasa și Muhayy pe podișul de la est. Un al treilea, Khirbet Ai, se află în schimb la marginea vestică a podișului Karak, iar o presupunere mai largă așază tabăra în apropierea lanțului Abarim. Niciunul nu a fost săpat ca Ie-Abarim, iar numele însuși, „ruine”, sugerează că israeliții au tăbărât lângă un loc deja pustiu."
    - "Ținutul este astăzi sudul guvernoratului Karak din Iordania, la marginea deșertului estic, străbătut de Autostrada Deșertului de la Amman la Aqaba; Wadi el-Hasa, cu izvoarele sale termale, curge sub aceste locuri spre Marea Moartă."
  bg:
    - "Ийе-Аварим, „развалините на Аварим“, беше стан на Израил в края на странстванията, откъм пустинната страна на Моав. Числа разказва, че народът, „като се дигнаха от Овот, разположиха стан в Ие-Аварим, в пустинята която е към Моав, към изток на слънцето“, а после: „От там се дигнаха, и разположиха стан в долината Заред“; списъкът на спирките ги поставя „в Ие-аварим, в пределите на Моав“, а после потеглят „от Иим“, съкратена форма на името, за Дивон-Гад. Синодалната Библия пише Ийе-Аварим в разказа и Ийм-Аварим и Ийм в списъка. Станът вероятно е лежал на източния край на Моавското плато, където Израил, след като заобиколи Едом, зави на север по края на пустинята, близо до клисурата на Заред, Уади ел-Хаса, която разделя Моав от Едом. Аварим, „отвъдните области“, е името на Моавските планини, гледани от запад."
    - "Коя развалина се има предвид, не е известно. Пътят по края на пустинята е осеян със селища от желязната епоха, които Нелсън Глюк проучи през 1930-те години, и два от кандидатите на картата са сред тях: Хирбет ел-Медейне на Уади ел-Хаса и Мухай на платото на изток. Трети, Хирбет Ай, лежи обаче на западния край на платото Карак, а едно по-широко предположение поставя стана в близост до веригата Аварим. Никое не е разкопавано като Ийе-Аварим, а самото име, „развалини“, подсказва, че израилтяните са разположили стан при място, което вече е било запустяло."
    - "Земята днес е южната част на губернаторство Карак в Йордания, на края на източната пустиня, пресечена от Пустинната магистрала от Аман за Акаба; Уади ел-Хаса с горещите си извори тече под тези места към Мъртво море."
scripture:
  - Num.21.10-Num.21.12
  - Num.33.44-Num.33.45
sources:
