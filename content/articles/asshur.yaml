body:
  en:
    - "Asshur, the city of Ashur or Assur, stood on a spur of land on the west bank of the Tigris at Qal'at Sherqat in northern Iraq, about 100 km south of Mosul. It was the city of the god Ashur, who shared its name, and the land around it took the same name: Assyria. Its temple of Ishtar goes back to the third millennium BC. A German expedition of the Deutsche Orient-Gesellschaft, led mostly by Walter Andrae, excavated its temples, palaces and ziggurat from 1903 to 1914."
    - "In the early second millennium BC Ashur was a city-state of merchants who traded with Anatolia; thousands of their letters were found at Kültepe, ancient Kanesh. About 1800 BC Shamshi-Adad I made it part of a large kingdom in northern Mesopotamia, and from the fourteenth century it was the capital of a growing Assyrian state. After Ashurnasirpal II moved the court to Calah in the ninth century BC, Ashur remained the religious centre of the empire, and several kings were buried there."
    - 'In the Bible, Asshur is a son of Shem and the people and land of Assyria named after him; Genesis says that out of the land of Shinar "went forth Asshur, and builded Nineveh". Balaam foretells that Asshur will carry the Kenite away captive and that ships from Chittim will afflict Asshur; a psalm counts Assur among Israel''s enemies, and Ezekiel lists Asshur among the merchants who traded with Tyre. The city itself is not clearly named, though some read the Asshur of Ezekiel, listed among towns, as the city.'
    - "In 614 BC the Medes took and plundered Ashur, as the Babylonian Chronicle records; Nabopolassar arrived too late for the battle and made an alliance with Cyaxares by the city. The Cyrus Cylinder names Ashur among the sanctuaries to which Cyrus returned their gods. The city revived under the Parthians, when a governor built a new palace and the temple of Ashur was restored, but after the Sasanian Persians took it in the mid-third century AD (dates from about 240 to 257 are given) it was abandoned."
  ru:
    - "Ассур, город Ашшур, стоял на мысу у западного берега Тигра, у нынешнего Калъат-Шерката на севере Ирака, примерно в 100 км к югу от Мосула. Это был город бога Ашшура, носившего то же имя, и по ним была названа вся окрестная страна — Ассирия. Его храм Иштар восходит к III тысячелетию до н. э. Немецкая экспедиция Германского восточного общества, которую большей частью возглавлял Вальтер Андре, в 1903–1914 гг. раскопала его храмы, дворцы и зиккурат."
    - "В начале II тысячелетия до н. э. Ашшур был городом-государством купцов, торговавших с Анатолией; тысячи их писем найдены в Кюльтепе, древнем Канеше. Около 1800 г. до н. э. Шамши-Адад I включил его в большое царство на севере Месопотамии, а с XIV века до н. э. он был столицей крепнущего Ассирийского государства. После того как Ашшурнацирапал II в IX веке до н. э. перенёс двор в Калах, Ашшур оставался религиозным центром державы, и здесь были погребены несколько царей."
    - "В Библии Ассур — сын Сима, а также народ и земля Ассирии, названные по нему; книга Бытия говорит, что из земли Сеннаар «вышел Ассур и построил Ниневию». Валаам предрекает, что Ассур уведёт Кенеев в плен и что корабли от Киттима смирят Ассура; в псалме Ассур назван среди врагов Израиля, а Иезекииль называет Ассур среди тех, кто торговал с Тиром. Сам город в Библии ясно не назван, хотя Ассур у Иезекииля, стоящий в ряду городов, некоторые понимают именно как город."
    - "В 614 г. до н. э. мидяне взяли и разграбили Ашшур, как сообщает Вавилонская хроника; Набопаласар опоздал к битве и заключил у стен города союз с Киаксаром. Цилиндр Кира называет Ашшур среди святилищ, куда Кир вернул их богов. При парфянах город возродился: наместник построил новый дворец, а храм Ашшура был восстановлен; но после того как его в середине III века н. э. взяли персы-Сасаниды (называют даты от ок. 240 до 257 г.), город был покинут."
  uk:
    - "Ассур, місто Ашшур, або Ассур, стояв на виступі землі на західному березі Тигру в Кал'ат-Шергаті на півночі Іраку, приблизно за 100 км на південь від Мосула. Це було місто бога Ашшура, який ділив із ним ім'я, і край довкола нього взяв ту саму назву: Ассирія. Його храм Іштар сягає III тисячоліття до н. е. Німецька експедиція Німецького східного товариства, яку здебільшого очолював Вальтер Андре, розкопувала його храми, палаци й зікурат з 1903 до 1914 року."
    - "На початку II тисячоліття до н. е. Ашшур був містом-державою купців, які торгували з Анатолією; тисячі їхніх листів знайдено в Кюльтепе, давньому Каніші. Близько 1800 р. до н. е. Шамші-Адад I зробив його частиною великого царства в північній Месопотамії, а від XIV століття він був столицею зростаючої ассирійської держави. Після того як Ашшурнасірпал II у IX столітті до н. е. переніс двір до Калаху, Ашшур лишався релігійним центром імперії, і там поховали кількох царів."
    - "У Біблії Ассур — син Сіма, а народ і край Ассирії названо за ним; Буття каже, що з тієї землі Сеннаар «вийшов Ассур, та й збудовав Ниневу». Валаам пророкує, що Ассур поведе кеніта в неволю і що кораблі з Киттиму принизять Ассура; псалом зараховує Ассура до ворогів Ізраїлю, а Єзекіїль називає Ассура серед купців, що торгували з Тіром. Саме місто чітко не названо, хоч дехто читає Ассура в Єзекіїля, названого серед міст, як місто."
    - "У 614 р. до н. е. мідяни взяли й пограбували Ашшур, як записує Вавилонська хроніка; Набополасар прибув надто пізно до битви й уклав союз із Кіаксаром біля міста. Циліндр Кіра називає Ашшур серед святинь, яким Кір повернув їхніх богів. Місто відродилося за парфян, коли намісник збудував новий палац і храм Ашшура було відновлено, але після того як сасаніди взяли його в середині III століття н. е. (називають дати приблизно від 240 до 257 року), його покинули."
  es:
    - "Asur, la ciudad de Asur o Assur, se alzaba sobre un espolón de tierra en la orilla occidental del Tigris, en Qal'at Sherqat, en el norte de Irak, a unos 100 km al sur de Mosul. Era la ciudad del dios Asur, que compartía su nombre, y la tierra en torno a ella tomó el mismo nombre: Asiria. Su templo de Ishtar se remonta al tercer milenio a. C. Una expedición alemana de la Deutsche Orient-Gesellschaft, dirigida en su mayor parte por Walter Andrae, excavó sus templos, palacios y zigurat de 1903 a 1914."
    - "A principios del segundo milenio a. C. Asur era una ciudad-estado de mercaderes que comerciaban con Anatolia; miles de sus cartas fueron halladas en Kültepe, la antigua Kanesh. Hacia 1800 a. C. Shamshi-Adad I la hizo parte de un gran reino en el norte de Mesopotamia, y desde el siglo XIV fue la capital de un creciente estado asirio. Después de que Asurnasirpal II trasladara la corte a Cala en el siglo IX a. C., Asur siguió siendo el centro religioso del imperio, y varios reyes fueron enterrados allí."
    - "En la Biblia, Asur es un hijo de Sem y el pueblo y la tierra de Asiria llevan su nombre; el Génesis dice que de la tierra de Sinar «salió Assur, y edificó á Nínive». Balaam predice que Asur llevará cautivo al cineo y que naves de la costa de Quitim afligirán a Asur; un salmo cuenta a Asur entre los enemigos de Israel, y Ezequiel enumera a Asur entre los mercaderes que comerciaban con Tiro. La ciudad misma no se nombra con claridad, aunque algunos leen el Asur de Ezequiel, enumerado entre ciudades, como la ciudad."
    - "En 614 a. C. los medos tomaron y saquearon Asur, como registra la Crónica babilónica; Nabopolasar llegó tarde para la batalla y selló una alianza con Ciáxares junto a la ciudad. El Cilindro de Ciro nombra Asur entre los santuarios a los que Ciro devolvió sus dioses. La ciudad revivió bajo los partos, cuando un gobernador construyó un nuevo palacio y se restauró el templo de Asur, pero después de que los persas sasánidas la tomaran a mediados del siglo III d. C. (se dan fechas de hacia 240 a 257) fue abandonada."
  pt:
    - "Assur, a cidade de Ashur ou Assur, erguia-se num esporão de terra na margem oeste do Tigre, em Qal'at Sherqat, no norte do Iraque, cerca de 100 km ao sul de Mossul. Era a cidade do deus Assur, que lhe partilhava o nome, e a terra em torno tomou o mesmo nome: Assíria. O seu templo de Ishtar remonta ao terceiro milênio a.C. Uma expedição alemã da Deutsche Orient-Gesellschaft, dirigida sobretudo por Walter Andrae, escavou seus templos, palácios e zigurate de 1903 a 1914."
    - "No início do segundo milênio a.C., Assur era uma cidade-Estado de mercadores que comerciavam com a Anatólia; milhares de cartas deles foram achadas em Kültepe, a antiga Kanesh. Por volta de 1800 a.C., Shamshi-Adad I fez dela parte de um grande reino no norte da Mesopotâmia, e a partir do século XIV foi a capital de um Estado assírio em crescimento. Depois que Assurnasirpal II transferiu a corte para Calá, no século IX a.C., Assur continuou sendo o centro religioso do império, e vários reis foram sepultados ali."
    - "Na Bíblia, Assur é um filho de Sem e o povo e a terra da Assíria que dele tomaram o nome; Gênesis diz que, da terra de Sinar, “Daquela terra ele foi para a Assíria e edificou Nínive”. Balaão prediz: “Caim será devastado, até que Assur o leve cativo”, e que “navios virão da costa de Quitim. Eles afligirão Assur”; um salmo conta a Assíria entre os inimigos de Israel, e Ezequiel lista “Assur e Quilmade” entre os comerciantes de Tiro. A cidade em si não é claramente nomeada, embora alguns leiam como a cidade o Assur de Ezequiel, listado entre cidades."
    - "Em 614 a.C. os medos tomaram e saquearam Assur, como registra a Crônica Babilônica; Nabopolassar chegou tarde demais para a batalha e firmou aliança com Ciaxares junto à cidade. O Cilindro de Ciro nomeia Assur entre os santuários a que Ciro devolveu os seus deuses. A cidade reviveu sob os partas, quando um governador construiu um novo palácio e o templo de Assur foi restaurado, mas depois que os persas sassânidas a tomaram em meados do século III d.C. (dão-se datas de cerca de 240 a 257) foi abandonada."
  de:
    - "Assur, die Stadt Aschschur oder Assur, lag auf einem Landsporn am Westufer des Tigris bei Qal'at Scherqat im Nordirak, etwa 100 km südlich von Mossul. Es war die Stadt des Gottes Aschschur, der ihren Namen teilte, und das Land ringsum nahm denselben Namen an: Assyrien. Sein Ischtartempel reicht bis ins 3. Jahrtausend v. Chr. zurück. Eine deutsche Expedition der Deutschen Orient-Gesellschaft, überwiegend unter Walter Andrae, grub von 1903 bis 1914 seine Tempel, Paläste und Zikkurat aus."
    - "Im frühen 2. Jahrtausend v. Chr. war Assur ein Stadtstaat von Kaufleuten, die mit Anatolien handelten; Tausende ihrer Briefe wurden in Kültepe gefunden, dem antiken Kanesch. Um 1800 v. Chr. machte Schamschi-Adad I. es zum Teil eines großen Königreichs in Nordmesopotamien, und seit dem 14. Jahrhundert war es die Hauptstadt eines wachsenden assyrischen Staates. Nachdem Assurnasirpal II. im 9. Jahrhundert v. Chr. den Hof nach Kalach verlegt hatte, blieb Assur das religiöse Zentrum des Reiches, und mehrere Könige wurden dort begraben."
    - "In der Bibel ist Assur ein Sohn Sems und das nach ihm benannte Volk und Land Assyrien; das erste Buch Mose sagt vom Land Schinar: „Von dem Land ist er gekommen nach Assur und baute Ninive“ (so Luther, der Nimrod als Subjekt versteht; nach der King-James-Bibel zog Assur selbst von dort aus und baute Ninive). Bileam sagt voraus, dass Assur die Keniter gefangen wegführen wird und dass Schiffe aus Kittim Assur bedrängen werden; ein Psalm zählt Assur zu Israels Feinden, und Hesekiel führt Assur unter den Kaufleuten auf, die mit Tyrus handelten. Die Stadt selbst wird nicht eindeutig genannt, doch lesen manche das Assur Hesekiels, unter Städten aufgeführt, als die Stadt."
    - "614 v. Chr. nahmen die Meder Assur ein und plünderten es, wie die Babylonische Chronik verzeichnet; Nabopolassar kam zu spät zur Schlacht und schloss bei der Stadt ein Bündnis mit Kyaxares. Der Kyros-Zylinder nennt Assur unter den Heiligtümern, denen Kyrus ihre Götter zurückgab. Die Stadt lebte unter den Parthern wieder auf, als ein Statthalter einen neuen Palast baute und der Tempel Aschschurs wiederhergestellt wurde, doch nachdem die sasanidischen Perser sie Mitte des 3. Jahrhunderts n. Chr. eingenommen hatten (Daten von etwa 240 bis 257 werden genannt), wurde sie aufgegeben."
  fr:
    - "Assur, la ville d’Ashur ou Assur, se dressait sur un éperon de la rive ouest du Tigre à Qal’at Sherqat, dans le nord de l’Irak, à environ 100 km au sud de Mossoul. C’était la ville du dieu Ashur, qui partageait son nom, et le pays alentour prit le même nom : Assyrie. Son temple d’Ishtar remonte au IIIe millénaire av. J.-C. Une expédition allemande de la Deutsche Orient-Gesellschaft, conduite surtout par Walter Andrae, fouilla ses temples, palais et ziggourat de 1903 à 1914."
    - "Au début du IIe millénaire av. J.-C., Ashur était une cité-État de marchands qui commerçaient avec l’Anatolie ; des milliers de leurs lettres furent trouvées à Kültepe, l’ancienne Kanesh. Vers 1800 av. J.-C., Shamshi-Adad Ier en fit une partie d’un grand royaume du nord de la Mésopotamie, et dès le XIVe siècle elle fut la capitale d’un État assyrien grandissant. Après qu’Assurnasirpal II eut transféré la cour à Calach au IXe siècle av. J.-C., Ashur resta le centre religieux de l’Empire, et plusieurs rois y furent enterrés."
    - "Dans la Bible, Assur est un fils de Sem, ainsi que le peuple et le pays d’Assyrie qui portent son nom ; la Genèse dit que du pays de Schinear « sortit Assur ; il bâtit Ninive ». Balaam prédit que l’Assyrien emmènera le Kénien captif et que des navires venus de Kittim humilieront l’Assyrien ; un psaume compte Assur parmi les ennemis d’Israël, et Ézéchiel range Assur parmi les marchands qui trafiquaient avec Tyr. La ville elle-même n’est pas clairement nommée, bien que certains lisent comme la ville l’Assur d’Ézéchiel, cité parmi des villes."
    - "En 614 av. J.-C., les Mèdes prirent et pillèrent Ashur, comme le consigne la Chronique babylonienne ; Nabopolassar arriva trop tard pour la bataille et conclut une alliance avec Cyaxare près de la ville. Le cylindre de Cyrus nomme Ashur parmi les sanctuaires dont Cyrus rendit les dieux. La ville renaquit sous les Parthes, quand un gouverneur y bâtit un nouveau palais et que le temple d’Ashur fut restauré, mais après que les Perses sassanides l’eurent prise au milieu du IIIe siècle apr. J.-C. (on donne des dates de 240 à 257 environ), elle fut abandonnée."
  it:
    - "Assur, la città di Ashur o Assur, sorgeva su uno sperone di terra sulla riva occidentale del Tigri a Qal‘at Sherqat, nell’Iraq settentrionale, a circa 100 km a sud di Mossul. Era la città del dio Ashur, che ne condivideva il nome, e la terra intorno ad essa prese lo stesso nome: Assiria. Il suo tempio di Ishtar risale al III millennio a.C. Una spedizione tedesca della Deutsche Orient-Gesellschaft, guidata per lo più da Walter Andrae, scavò i suoi templi, palazzi e ziggurat dal 1903 al 1914."
    - "All’inizio del II millennio a.C. Assur era una città-stato di mercanti che commerciavano con l’Anatolia; migliaia delle loro lettere furono trovate a Kültepe, l’antica Kanesh. Intorno al 1800 a.C. Shamshi-Adad I ne fece parte di un grande regno nella Mesopotamia settentrionale, e dal XIV secolo fu la capitale di uno stato assiro in crescita. Dopo che Assurnasirpal II trasferì la corte a Calach nel IX secolo a.C., Assur rimase il centro religioso dell’impero, e vi furono sepolti diversi re."
    - "Nella Bibbia, Assur è un figlio di Sem e il popolo e il paese dell’Assiria prendono nome da lui; la Genesi dice che dal paese di Sennaar «andò in Assiria ed edificò Ninive». Balaam predice che l’Assiro porterà il Keneo in cattività e che navi da Kittim umilieranno Assur; un salmo conta Assur fra i nemici d’Israele, ed Ezechiele elenca Assur fra i mercanti che trafficavano con Tiro. La città stessa non è nominata chiaramente, benché alcuni leggano l’Assur di Ezechiele, elencato fra le città, come la città."
    - "Nel 614 a.C. i Medi presero e saccheggiarono Assur, come registra la Cronaca babilonese; Nabopolassar arrivò troppo tardi per la battaglia e fece un’alleanza con Ciassare presso la città. Il Cilindro di Ciro nomina Assur fra i santuari a cui Ciro restituì i loro dèi. La città rinacque sotto i Parti, quando un governatore costruì un nuovo palazzo e il tempio di Assur fu restaurato, ma dopo che i Persiani sasanidi la presero a metà del III secolo d.C. (si danno date dal 240 al 257 circa) fu abbandonata."
  pl:
    - "Aszur, miasto Aszur czyli Assur, stało na cyplu lądu na zachodnim brzegu Tygrysu w Qal'at Sherqat w północnym Iraku, około 100 km na południe od Mosulu. Było miastem boga Aszura, który dzielił z nim nazwę, a otaczająca je ziemia przejęła tę samą nazwę: Asyria. Jego świątynia Isztar sięga III tysiąclecia p.n.e. Niemiecka wyprawa Deutsche Orient-Gesellschaft, prowadzona głównie przez Waltera Andrae, wykopywała jego świątynie, pałace i zigurat w latach 1903–1914."
    - "Na początku II tysiąclecia p.n.e. Aszur było miastem-państwem kupców, którzy handlowali z Anatolią; tysiące ich listów znaleziono w Kültepe, dawnym Kanesz. Około 1800 r. p.n.e. Szamszi-Adad I włączył je do wielkiego królestwa w północnej Mezopotamii, a od XIV wieku było stolicą rosnącego państwa asyryjskiego. Gdy Aszurnasirpal II przeniósł dwór do Kalach w IX wieku p.n.e., Aszur pozostało religijnym ośrodkiem imperium i pochowano tam kilku królów."
    - "W Biblii Aszur jest synem Sema oraz ludem i krajem Asyrii od niego nazwanymi; Księga Rodzaju mówi, że z ziemi Szinear „wyszedł Assur, i zbudował Niniwe”. Balaam przepowiada, że Aszur uprowadzi Kenitę w niewolę i że okręty z Kittim ucisną Aszur; psalm zalicza Assur do wrogów Izraela, a Ezechiel wymienia Aszur wśród kupców handlujących z Tyrem. Samo miasto nie jest wyraźnie nazwane, choć niektórzy czytają Aszur u Ezechiela, wymienione wśród miast, jako to miasto."
    - "W 614 r. p.n.e. Medowie zdobyli i złupili Aszur, jak zapisuje Kronika babilońska; Nabopolassar przybył za późno na bitwę i zawarł przymierze z Kyaksaresem przy mieście. Cylinder Cyrusa wymienia Aszur wśród sanktuariów, którym Cyrus zwrócił ich bogów. Miasto odrodziło się pod Partami, gdy namiestnik zbudował nowy pałac i odnowiono świątynię Aszura, lecz po zdobyciu go przez perskich Sasanidów w połowie III wieku n.e. (podaje się daty od około 240 do 257) zostało opuszczone."
  nl:
    - "Assur, de stad Ashur of Assur, lag op een landtong aan de westoever van de Tigris bij Qal’at Sherqat in Noord-Irak, zo’n 100 km ten zuiden van Mosul. Het was de stad van de god Assur, die haar naam deelde, en het land eromheen nam dezelfde naam aan: Assyrië. Haar Ishtartempel gaat terug tot het derde millennium v.Chr. Een Duitse expeditie van de Deutsche Orient-Gesellschaft, grotendeels onder leiding van Walter Andrae, groef van 1903 tot 1914 haar tempels, paleizen en ziggoerat op."
    - "In het begin van het tweede millennium v.Chr. was Assur een stadstaat van kooplieden die met Anatolië handelden; duizenden van hun brieven werden gevonden te Kültepe, het oude Kanesh. Omstreeks 1800 v.Chr. maakte Sjamsji-Adad I haar deel van een groot koninkrijk in Noord-Mesopotamië, en vanaf de veertiende eeuw was zij de hoofdstad van een groeiende Assyrische staat. Nadat Assurnasirpal II in de negende eeuw v.Chr. het hof naar Kalach verplaatste, bleef Assur het religieuze centrum van het rijk, en verscheidene koningen werden er begraven."
    - "In de Bijbel is Assur een zoon van Sem en het volk en land van Assyrië dat naar hem is genoemd; Genesis zegt dat uit het land Sinear “is Assur uitgegaan, en heeft gebouwd Nineve”. Bileam voorspelt dat Assur de Keniet gevankelijk zal wegvoeren en dat schepen uit Chittim Assur zullen verdrukken; een psalm telt Assur onder Israëls vijanden, en Ezechiël rekent Assur onder de kooplieden die op Tyrus handelden. De stad zelf wordt niet duidelijk genoemd, al lezen sommigen de Assur van Ezechiël, genoemd onder steden, als de stad."
    - "In 614 v.Chr. namen de Meden Assur in en plunderden het, zoals de Babylonische kroniek vermeldt; Nabopolassar kwam te laat voor de slag en sloot bij de stad een bondgenootschap met Kyaxares. De Cyruscilinder noemt Assur onder de heiligdommen waarheen Cyrus hun goden teruggaf. De stad bloeide onder de Parthen weer op, toen een gouverneur er een nieuw paleis bouwde en de tempel van Assur werd hersteld, maar nadat de Sassanidische Perzen haar in het midden van de derde eeuw n.Chr. innamen (data van omstreeks 240 tot 257 worden genoemd), werd zij verlaten."
  cs:
    - "Aššúr, město Ašur neboli Assur, stál na výběžku země na západním břehu Tigridu v Qal'at Sherqat v severním Iráku, asi 100 km jižně od Mosulu. Bylo městem boha Ašura, který s ním sdílel jméno, a země kolem převzala totéž jméno: Asýrie. Jeho chrám Ištar sahá až do 3. tisíciletí př. n. l. Německá expedice Deutsche Orient-Gesellschaft, vedená většinou Walterem Andraem, vykopávala jeho chrámy, paláce a zikkurat v letech 1903 až 1914."
    - "Na počátku 2. tisíciletí př. n. l. byl Ašur městským státem obchodníků, kteří obchodovali s Anatolií; tisíce jejich dopisů bylo nalezeno v Kültepe, starověkém Kaneši. Kolem roku 1800 př. n. l. učinil Šamší-Adad I. Ašur součástí velkého království v severní Mezopotámii a od 14. století byl hlavním městem rostoucího asyrského státu. Poté, co Aššurnasirpal II. v 9. století př. n. l. přesunul dvůr do Kalachu, zůstal Ašur náboženským středem říše a bylo tam pohřbeno několik králů."
    - "V Bibli je Aššúr synem Šémovým a lidem a zemí Asýrie, pojmenovanými podle něj; Genesis praví, že ze země Šineár „Z země té vyšel do Assur, kdežto vystavěl Ninive“. Bileám předpovídá, že „Assur zajatého jej povede“ a že „bárky z země Citim připlynou a ssouží Assyrské“; žalm počítá Assur mezi nepřátele Izraele a Ezechiel uvádí Aššúr mezi kupci, kteří obchodovali s Týrem. Město samo není jasně jmenováno, ač někteří čtou Aššúr u Ezechiela, uvedený mezi městy, jako město."
    - "Roku 614 př. n. l. dobyli Médové Ašur a vyplenili jej, jak zaznamenává babylonská kronika; Nabopolassar přišel k bitvě pozdě a uzavřel u města spojenectví s Kyaxarem. Kýrův válec jmenuje Ašur mezi svatyněmi, kam Kýros vrátil jejich bohy. Město ožilo za Parthů, kdy správce postavil nový palác a chrám Ašura byl obnoven, ale poté, co je v polovině 3. století n. l. dobyli sásánovští Peršané (udávají se data od asi 240 do 257), bylo opuštěno."
  sv:
    - "Assur, staden Assur, låg på en landtunga på västra stranden av Tigris vid Qal'at Sherqat i norra Irak, omkring 100 km söder om Mosul. Det var guden Assurs stad, som delade dess namn, och landet runt den fick samma namn: Assyrien. Dess Ishtartempel går tillbaka till tredje årtusendet f.Kr. En tysk expedition från Deutsche Orient-Gesellschaft, mestadels ledd av Walter Andrae, grävde ut dess tempel, palats och ziggurat 1903–1914."
    - "Under det tidiga andra årtusendet f.Kr. var Assur en stadsstat av köpmän som handlade med Anatolien; tusentals av deras brev hittades vid Kültepe, det antika Kanesh. Omkring 1800 f.Kr. gjorde Shamshi-Adad I den till en del av ett stort rike i norra Mesopotamien, och från 1300-talet var den huvudstad i en växande assyrisk stat. Sedan Assurnasirpal II flyttat hovet till Kalach på 800-talet f.Kr. förblev Assur imperiets religiösa centrum, och flera kungar begravdes där."
    - "I Bibeln är Assur en son till Sem och folket och landet Assyrien är uppkallat efter honom; Första Mosebok säger att från Shinars land drog Assur ut och byggde Nineve. Bileam förutsäger att Assur ska föra kainiten bort i fångenskap och att skepp från Kittim ska tukta Assur; en psalm räknar Assur bland Israels fiender, och Hesekiel räknar Assur bland de köpmän som handlade med Tyros. Själva staden nämns inte tydligt, fastän några läser Hesekiels Assur, upptaget bland städer, som staden."
    - "År 614 f.Kr. intog och plundrade mederna Assur, som den babyloniska krönikan berättar; Nabopolassar kom för sent till striden och slöt ett förbund med Kyaxares vid staden. Kyroscylindern nämner Assur bland de helgedomar vars gudar Kyros lät föra tillbaka. Staden återupplivades under parterna, då en ståthållare byggde ett nytt palats och Assurs tempel restaurerades, men sedan sasaniderna intagit den i mitten av 200-talet e.Kr. (olika datum från omkring 240 till 257 anges) övergavs den."
