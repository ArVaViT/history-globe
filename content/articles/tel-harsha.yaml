# Overview article (ADR 0007). Mainstream facts only; a Babylonian place of the exiles, unlocated; placed by the app near Nippur on the evidence of the Judean settlements there.
id: tel-harsha
place: a0c97c0
title:
  en: "Tel-harsha"
  ru: "Тел-Харша"
  uk: "Тель-Харша"
  es: "Tel-harsa"
  pt: "Tel-Harsa"
  de: "Tel-Harscha"
  fr: "Tel-Harscha"
body:
  en:
    - "Tel-harsha (Tel-harsa in Ezra, Tel-haresha in Nehemiah) was one of the places in Babylonia from which a group of returning exiles came who could not prove their descent: “these were they which went up from Tel-melah, Tel-harsa, Cherub, Addan, and Immer: but they could not shew their father's house, and their seed, whether they were of Israel”. The same list stands in both books. Tel, like Akkadian tilu, means a mound of ruins; the meaning of the second part is uncertain, and the name probably described a resettled ruin mound, of the kind on which the Babylonians planted deportees."
    - "That is all that is known. The town has not been found in cuneiform texts with certainty and cannot be located. Babylonian documents show Judeans settled in the countryside around Nippur in the sixth and fifth centuries BC, in the business records of the Murashu family and the tablets from Al-Yahudu, “the town of Judah”, and on that ground the map places Tel-harsha only roughly, within about 50 km of Nippur in central Iraq."
  ru:
    - "Тел-Харша — одно из мест в Вавилонии, откуда вышла группа возвращавшихся изгнанников, не сумевших доказать своё происхождение: «И вот вышедшие из Тел-Мелаха, Тел-Харши, Херуб-Аддан-Иммера, которые не могли показать о поколении своем и о племени своем от Израиля ли они». Тот же список стоит в книгах Ездры и Неемии. «Тел», как и аккадское тилу, означает холм развалин; значение второй части неясно, и имя, вероятно, описывало заново заселённый холм развалин — на таких вавилоняне и селили переселенцев."
    - "Больше ничего не известно. В клинописных текстах этот город с уверенностью не найден, и указать его место нельзя. Вавилонские документы показывают иудеев, поселённых в сельской округе Ниппура в VI–V веках до н. э., — в деловых записях дома Мурашу и в табличках из Аль-Яхуду, «города Иудеи», и на этом основании на карте Тел-Харша помещена лишь приблизительно, в пределах около 50 км от Ниппура в центральном Ираке."
  uk:
    - "Тель-Харша (Тель-Харса в Ездри, Тель-Хареша в Неємії) була одним із місць у Вавилонії, звідки походила група повернених вигнанців, які не могли довести свого походження: «ось ті, що вийшли з Телмелаха, Телхарші, Херув-Аддона та Іммера, але вони не могли вказати на дім батьків своїх і на племя своє, чи вони від Ізраїля». Той самий перелік стоїть в обох книгах. Тель, як і аккадське tilu, означає пагорб руїн; значення другої частини невизначене, і назва, ймовірно, описувала заселений наново пагорб руїн, подібний до тих, на яких вавилоняни саджали депортованих."
    - "Це все, що відомо. Місто не виявлено в клинописних текстах із певністю, і його не можна розмістити. Вавилонські документи показують юдеїв, поселених у сільській місцевості навколо Ніппура в VI–V ст. до н. е., у ділових записах родини Мурашу та в табличках з Аль-Яхуду, «міста Юди», і на цій підставі мапа позначає Тель-Харшу лише приблизно, в межах близько 50 км від Ніппура в центральному Іраку."
  es:
    - "Tel-harsa (Tel-haresa en Nehemías) fue uno de los lugares de Babilonia de donde procedía un grupo de desterrados que volvían y que no podían probar su ascendencia: «estos fueron los que subieron de Tel-mela, Tel-harsa, Chêrub, Addan, é Immer, los cuales no pudieron mostrar la casa de sus padres, ni su linaje, si eran de Israel». La misma lista figura en ambos libros. Tel, como el acadio tilu, significa un montículo de ruinas; el sentido de la segunda parte es incierto, y el nombre describía probablemente un montículo de ruinas repoblado, del tipo de aquellos en los que los babilonios asentaban a los deportados."
    - "Eso es todo lo que se sabe. La ciudad no se ha encontrado con certeza en textos cuneiformes y no puede localizarse. Los documentos babilónicos muestran judeos asentados en el campo en torno a Nippur en los siglos VI y V a. C., en los registros comerciales de la familia Murashu y en las tablillas de Al-Yahudu, «la ciudad de Judá», y por ello el mapa sitúa Tel-harsa solo de forma aproximada, a unos 50 km de Nippur, en el centro de Irak."
  pt:
    - "Tel-Harsa (Tel-Harsa em Esdras, Tel-Haresa em Neemias na King James) foi um dos lugares da Babilônia de onde veio um grupo de exilados que voltavam e não podiam provar sua ascendência: “Estes foram os que subiram de Tel-Melá, Tel-Harsa, Querube, Adã e Imer; mas eles não puderam provar as casas de seus pais e sua descendência, se eles eram de Israel”. A mesma lista consta nos dois livros. Tel, como o acádio tilu, significa um monte de ruínas; o sentido da segunda parte é incerto, e o nome provavelmente descrevia um monte de ruínas repovoado, do tipo em que os babilônios assentavam deportados."
    - "Isso é tudo o que se sabe. A cidade não foi encontrada com certeza em textos cuneiformes e não pode ser localizada. Documentos babilônicos mostram judeus assentados no campo em torno de Nippur nos séculos VI e V a.C., nos registros comerciais da família Murashu e nas tabuinhas de Al-Yahudu, “a cidade de Judá”, e por isso o mapa situa Tel-Harsa apenas aproximadamente, a cerca de 50 km de Nippur, no centro do Iraque."
  de:
    - "Tel-Harscha (Tel-Harsa bei Esra, Tel-Haresha bei Nehemia) war einer der Orte in Babylonien, aus denen eine Gruppe heimkehrender Exilierter kam, die ihre Abstammung nicht nachweisen konnten: „Und diese zogen auch mit herauf von Thel-Melah, Thel-Harsa, Cherub, Addon und Immer, aber sie konnten nicht anzeigen ihr Vaterhaus noch ihr Geschlecht, ob sie aus Israel wären“. Dieselbe Liste steht in beiden Büchern. Tel bedeutet wie akkadisch tilu einen Trümmerhügel; die Bedeutung des zweiten Teils ist ungewiss, und der Name bezeichnete wohl einen wiederbesiedelten Ruinenhügel, wie ihn die Babylonier mit Deportierten besiedelten."
    - "Mehr ist nicht bekannt. Die Stadt ist in Keilschrifttexten nicht sicher gefunden worden und lässt sich nicht lokalisieren. Babylonische Dokumente zeigen Judäer, die im sechsten und fünften Jahrhundert v. Chr. auf dem Land um Nippur angesiedelt waren, in den Geschäftsunterlagen der Familie Murashu und den Tafeln aus Al-Yahudu, „der Stadt Judas“, und deshalb setzt die Karte Tel-Harscha nur ungefähr an, innerhalb von etwa 50 km um Nippur im Zentralirak."
  fr:
    - "Tel-Harscha (Tel-Harsa chez Esdras, Tel-Haresha chez Néhémie) était l’un des lieux de Babylonie d’où venait un groupe d’exilés de retour qui ne pouvaient prouver leur ascendance : « Voici ceux qui partirent de Thel-Mélach, de Thel-Harscha, de Kerub-Addon, et d’Immer, et qui ne purent pas faire connaître leur maison paternelle et leur race, pour prouver qu’ils étaient d’Israël ». La même liste figure dans les deux livres. Tel, comme l’akkadien tilu, désigne un tertre de ruines ; le sens de la seconde partie est incertain, et le nom décrivait probablement un tertre de ruines repeuplé, du genre de ceux où les Babyloniens installaient des déportés."
    - "C’est tout ce que l’on sait. La ville n’a pas été retrouvée avec certitude dans les textes cunéiformes et ne peut être localisée. Des documents babyloniens montrent des Judéens installés dans la campagne autour de Nippur aux VIe et Ve siècles av. J.-C., dans les archives d’affaires de la famille Murashu et les tablettes d’Al-Yahudu, « la ville de Juda » ; pour cette raison, la carte place Tel-Harscha de façon approximative, à moins de 50 km de Nippur, dans le centre de l’Irak."
