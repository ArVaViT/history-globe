body:
  en:
    - "Tel-harsha (Tel-harsa in Ezra, Tel-haresha in Nehemiah) was one of the places in Babylonia from which a group of returning exiles came who could not prove their descent: “these were they which went up from Tel-melah, Tel-harsa, Cherub, Addan, and Immer: but they could not shew their father's house, and their seed, whether they were of Israel”. The same list stands in both books. Tel, like Akkadian tilu, means a mound of ruins; the meaning of the second part is uncertain, and the name probably described a resettled ruin mound, of the kind on which the Babylonians planted deportees."
    - "That is all that is known. The town has not been found in cuneiform texts with certainty and cannot be located. Babylonian documents show Judeans settled in the countryside around Nippur in the sixth and fifth centuries BC, in the business records of the Murashu family of Nippur and probably in the tablets from Al-Yahudu, “the town of Judah”, whose exact site is unknown, and on that ground the map places Tel-harsha only roughly, within about 50 km of Nippur in central Iraq."
  ru:
    - "Тел-Харша — одно из мест в Вавилонии, откуда вышла группа возвращавшихся изгнанников, не сумевших доказать своё происхождение: «И вот вышедшие из Тел-Мелаха, Тел-Харши, Херуб-Аддан-Иммера, которые не могли показать о поколении своем и о племени своем от Израиля ли они». Тот же список стоит в книгах Ездры и Неемии. «Тел», как и аккадское тилу, означает холм развалин; значение второй части неясно, и имя, вероятно, описывало заново заселённый холм развалин — на таких вавилоняне и селили переселенцев."
    - "Больше ничего не известно. В клинописных текстах этот город с уверенностью не найден, и указать его место нельзя. Вавилонские документы показывают иудеев, поселённых в сельской округе Ниппура в VI–V веках до н. э., — в деловых записях ниппурского дома Мурашу и, вероятно, в табличках из Аль-Яхуду, «города Иудеи», точное место которого неизвестно, и на этом основании на карте Тел-Харша помещена лишь приблизительно, в пределах около 50 км от Ниппура в центральном Ираке."
  uk:
    - "Тель-Харша (Тель-Харса в Ездри, Тель-Хареша в Неємії) була одним із місць у Вавилонії, звідки походила група повернених вигнанців, які не могли довести свого походження: «ось ті, що вийшли з Телмелаха, Телхарші, Херув-Аддона та Іммера, але вони не могли вказати на дім батьків своїх і на племя своє, чи вони від Ізраїля». Той самий перелік стоїть в обох книгах. Тель, як і аккадське tilu, означає пагорб руїн; значення другої частини невизначене, і назва, ймовірно, описувала заселений наново пагорб руїн, подібний до тих, на яких вавилоняни саджали депортованих."
    - "Це все, що відомо. Місто не виявлено в клинописних текстах із певністю, і його не можна розмістити. Вавилонські документи показують юдеїв, поселених у сільській місцевості навколо Ніппура в VI–V ст. до н. е., у ділових записах ніппурської родини Мурашу та, ймовірно, в табличках з Аль-Яхуду, «міста Юди», точне місце якого невідоме, і на цій підставі мапа позначає Тель-Харшу лише приблизно, в межах близько 50 км від Ніппура в центральному Іраку."
  es:
    - "Tel-harsa (Tel-haresa en Nehemías) fue uno de los lugares de Babilonia de donde procedía un grupo de desterrados que volvían y que no podían probar su ascendencia: «estos fueron los que subieron de Tel-mela, Tel-harsa, Chêrub, Addan, é Immer, los cuales no pudieron mostrar la casa de sus padres, ni su linaje, si eran de Israel». La misma lista figura en ambos libros. Tel, como el acadio tilu, significa un montículo de ruinas; el sentido de la segunda parte es incierto, y el nombre describía probablemente un montículo de ruinas repoblado, del tipo de aquellos en los que los babilonios asentaban a los deportados."
    - "Eso es todo lo que se sabe. La ciudad no se ha encontrado con certeza en textos cuneiformes y no puede localizarse. Los documentos babilónicos muestran judeos asentados en el campo en torno a Nippur en los siglos VI y V a. C., en los registros comerciales de la familia Murashu de Nippur y probablemente en las tablillas de Al-Yahudu, «la ciudad de Judá», cuyo emplazamiento exacto se desconoce, y por ello el mapa sitúa Tel-harsa solo de forma aproximada, a unos 50 km de Nippur, en el centro de Irak."
  pt:
    - "Tel-Harsa (Tel-Harsa em Esdras, Tel-Haresa em Neemias na King James) foi um dos lugares da Babilônia de onde veio um grupo de exilados que voltavam e não podiam provar sua ascendência: “Estes foram os que subiram de Tel-Melá, Tel-Harsa, Querube, Adã e Imer; mas eles não puderam provar as casas de seus pais e sua descendência, se eles eram de Israel”. A mesma lista consta nos dois livros. Tel, como o acádio tilu, significa um monte de ruínas; o sentido da segunda parte é incerto, e o nome provavelmente descrevia um monte de ruínas repovoado, do tipo em que os babilônios assentavam deportados."
    - "Isso é tudo o que se sabe. A cidade não foi encontrada com certeza em textos cuneiformes e não pode ser localizada. Documentos babilônicos mostram judeus assentados no campo em torno de Nippur nos séculos VI e V a.C., nos registros comerciais da família Murashu de Nippur e provavelmente nas tabuinhas de Al-Yahudu, “a cidade de Judá”, cujo local exato é desconhecido, e por isso o mapa situa Tel-Harsa apenas aproximadamente, a cerca de 50 km de Nippur, no centro do Iraque."
  de:
    - "Tel-Harscha (Tel-Harsa bei Esra, Tel-Haresha bei Nehemia) war einer der Orte in Babylonien, aus denen eine Gruppe heimkehrender Exilierter kam, die ihre Abstammung nicht nachweisen konnten: „Und diese zogen auch mit herauf von Thel-Melah, Thel-Harsa, Cherub, Addon und Immer, aber sie konnten nicht anzeigen ihr Vaterhaus noch ihr Geschlecht, ob sie aus Israel wären“. Dieselbe Liste steht in beiden Büchern. Tel bedeutet wie akkadisch tilu einen Trümmerhügel; die Bedeutung des zweiten Teils ist ungewiss, und der Name bezeichnete wohl einen wiederbesiedelten Ruinenhügel, wie ihn die Babylonier mit Deportierten besiedelten."
    - "Mehr ist nicht bekannt. Die Stadt ist in Keilschrifttexten nicht sicher gefunden worden und lässt sich nicht lokalisieren. Babylonische Dokumente zeigen Judäer, die im sechsten und fünften Jahrhundert v. Chr. auf dem Land um Nippur angesiedelt waren, in den Geschäftsunterlagen der Familie Murashu aus Nippur und wahrscheinlich in den Tafeln aus Al-Yahudu, „der Stadt Judas“, deren genaue Lage unbekannt ist, und deshalb setzt die Karte Tel-Harscha nur ungefähr an, innerhalb von etwa 50 km um Nippur im Zentralirak."
  fr:
    - "Tel-Harscha (Tel-Harsa chez Esdras, Tel-Haresha chez Néhémie) était l’un des lieux de Babylonie d’où venait un groupe d’exilés de retour qui ne pouvaient prouver leur ascendance : « Voici ceux qui partirent de Thel-Mélach, de Thel-Harscha, de Kerub-Addon, et d’Immer, et qui ne purent pas faire connaître leur maison paternelle et leur race, pour prouver qu’ils étaient d’Israël ». La même liste figure dans les deux livres. Tel, comme l’akkadien tilu, désigne un tertre de ruines ; le sens de la seconde partie est incertain, et le nom décrivait probablement un tertre de ruines repeuplé, du genre de ceux où les Babyloniens installaient des déportés."
    - "C’est tout ce que l’on sait. La ville n’a pas été retrouvée avec certitude dans les textes cunéiformes et ne peut être localisée. Des documents babyloniens montrent des Judéens installés dans la campagne autour de Nippur aux VIe et Ve siècles av. J.-C., dans les archives d’affaires de la famille Murashu de Nippur et probablement dans les tablettes d’Al-Yahudu, « la ville de Juda », dont le site exact est inconnu ; pour cette raison, la carte place Tel-Harscha de façon approximative, à moins de 50 km de Nippur, dans le centre de l’Irak."
  pl:
    - "Tel-Charsza (Tel-Charsa w Księdze Ezdrasza, Tel-Charesza w Księdze Nehemiasza) było jednym z miejsc w Babilonii, skąd przybyła grupa wracających wygnańców, którzy nie mogli udowodnić swego pochodzenia: „A cić są, którzy wyszli z Telmelachu i z Telcharsa: Cherub, Addan, i Immer: ale nie mogli okazać domu ojców swoich i nasienia swego, jeźli z Izraela byli”. Ta sama lista występuje w obu księgach. Tel, jak akadyjskie tilu, znaczy kopiec ruin; znaczenie drugiej części jest niepewne, a nazwa prawdopodobnie opisywała ponownie zasiedlony kopiec ruin, na jakich Babilończycy osadzali deportowanych."
    - "To wszystko, co wiadomo. Miasta nie znaleziono z pewnością w tekstach klinowych i nie da się go umiejscowić. Dokumenty babilońskie pokazują Judejczyków osiedlonych na wsi wokół Nippur w VI i V wieku p.n.e., w archiwach handlowych rodziny Murasu z Nippur i prawdopodobnie na tabliczkach z Al-Jahudu, „miasta Judy”, którego dokładne położenie jest nieznane, i z tego powodu mapa umieszcza Tel-Charszę tylko z grubsza, w odległości około 50 km od Nippur w środkowym Iraku."
  it:
    - "Tel-Carsa (Tel-Harsha nella Riveduta, in Esdra e in Neemia; Tel-harsa e Tel-haresha nella King James Version) era uno dei luoghi della Babilonia da cui veniva un gruppo di esuli ritornati che non potevano provare la propria discendenza: «Ed ecco quelli che tornarono da Tel-Melah, da Tel-Harsha, da Kerub-Addan, da Immer, e che non poterono indicare la loro casa patriarcale e la loro discendenza per provare ch’erano d’Israele». Lo stesso elenco compare in entrambi i libri. Tel, come l’accadico tilu, significa un tumulo di rovine; il significato della seconda parte è incerto, e il nome descriveva probabilmente un tumulo di rovine ripopolato, del tipo in cui i Babilonesi insediavano i deportati."
    - "Questo è tutto ciò che si sa. La città non è stata trovata con certezza nei testi cuneiformi e non può essere localizzata. I documenti babilonesi mostrano Giudei stabiliti nella campagna attorno a Nippur nel VI e V secolo a.C., nei registri d’affari della famiglia Murashu di Nippur e probabilmente nelle tavolette di Al-Yahudu, «la città di Giuda», il cui sito esatto è sconosciuto, e su tale base la mappa colloca Tel-Carsa solo approssimativamente, entro circa 50 km da Nippur, nell’Iraq centrale."
  nl:
    - "Tel-Charsa (in Ezra Tel-harsa, in Nehemia Thel-harsa) was een van de plaatsen in Babylonië waar een groep terugkerende ballingen vandaan kwam die hun afstamming niet konden bewijzen: “Dezen togen ook op van Tel-melah, Tel-harsa, Cherub, Addan en Immer; doch zij konden hunner vaderen huis en hun zaad niet bewijzen, of zij uit Israël waren”. Dezelfde lijst staat in beide boeken. Tel betekent, zoals het Akkadische tilu, een puinheuvel; de betekenis van het tweede deel is onzeker, en de naam beschreef waarschijnlijk een opnieuw bewoonde puinheuvel, van het soort waarop de Babyloniërs weggevoerden vestigden."
    - "Dat is alles wat bekend is. De stad is niet met zekerheid in spijkerschriftteksten gevonden en kan niet worden gelokaliseerd. Babylonische documenten tonen dat Judeeërs zich in de zesde en vijfde eeuw v.Chr. vestigden op het platteland rond Nippur, in de bedrijfsarchieven van de familie Murashu uit Nippur en waarschijnlijk in de tabletten uit Al-Yahudu, “de stad van Juda”, waarvan de precieze ligging onbekend is, en op die grond plaatst de kaart Tel-Charsa slechts bij benadering, binnen ongeveer 50 km van Nippur in Centraal-Irak."
  cs:
    - "Tel-charša (Tel-charsa u Ezdráše, Tel-chareša u Nehemjáše) byla jedním z míst v Babylonii, odkud pocházela skupina navrátivších se vyhnanců, kteří nemohli doložit svůj původ: „Tito také byli, kteříž šli z Telmelach, Telcharsa, Cherub, Addan a Immer, ale nemohli ukázati domu otců svých a semene svého, že by z Izraele byli“. Stejný seznam stojí v obou knihách. Tel, jako akkadské tilu, znamená pahorek ze zřícenin; význam druhé části je nejistý a jméno pravděpodobně popisovalo znovuosídlený pahorek zřícenin, jaké Babyloňané osazovali deportovanými."
    - "To je vše, co se ví. Město nebylo s jistotou nalezeno v klínopisných textech a nelze je lokalizovat. Babylónské dokumenty ukazují Judejce usazené na venkově kolem Nippuru v 6. a 5. stol. př. n. l., v obchodních záznamech nippurské rodiny Murašú a pravděpodobně v tabulkách z Al-Jáhudu, „města Judy“, jehož přesná poloha není známa, a na tomto základě mapa klade Tel-charšu jen přibližně, do vzdálenosti asi 50 km od Nippuru ve středním Iráku."
  sv:
    - "Tel-Harsha (i King James-översättningen Tel-harsa i Esra och Tel-haresha i Nehemja) var en av platserna i Babylonien varifrån en grupp återvändande landsflyktiga kom som inte kunde bevisa sin härkomst: ”dessa voro de som drogo åstad från Tel-Mela, Tel-Harsa, Kerub, Addan och Immer, men som icke kunde uppgiva sina familjer och sin släkt och huruvida de voro av Israel”. Samma förteckning står i båda böckerna. Tel betyder, liksom akkadiskans tilu, en ruinkulle; betydelsen av den andra delen är osäker, och namnet beskrev sannolikt en återbosatt ruinkulle, av det slag där babylonierna placerade bortförda."
    - "Det är allt som är känt. Staden har inte säkert hittats i kilskriftstexter och kan inte lokaliseras. Babyloniska dokument visar judar bosatta på landsbygden kring Nippur på 500- och 400-talen f.Kr., i släkten Murashus affärsarkiv från Nippur och sannolikt i tavlorna från Al-Yahudu, ”Judas stad”, vars exakta läge är okänt, och på den grunden placerar kartan Tel-Harsha bara ungefärligt, inom omkring 50 km från Nippur i centrala Irak."
  nb:
    - "Tel-Harsja (Tel-Harsa i Esra, Tel-Haresja i Nehemja) var ett av stedene i Babylonia som en gruppe hjemvendte eksilerte kom fra, og som ikke kunne bevise sin avstamning: «dette var de som drog hjem fra Tel-Melah, Tel-Harsa, Kerub, Addan og Immer, men ikke kunde opgi sin familie og sin ætt, eller om de var av Israel». Den samme listen står i begge bøkene. Tel, som akkadisk tilu, betyr en ruinhaug; betydningen av den andre delen er usikker, og navnet beskrev trolig en på nytt bosatt ruinhaug, av den typen babylonerne plasserte deporterte på."
    - "Det er alt som er kjent. Byen er ikke sikkert funnet i kileskrifttekster og kan ikke lokaliseres. Babylonske dokumenter viser judeere bosatt på landsbygda rundt Nippur på 500- og 400-tallet f.Kr., i forretningsarkivet til Murashu-familien i Nippur og trolig i tavlene fra Al-Yahudu, «Judas by», hvis nøyaktige beliggenhet er ukjent, og på det grunnlaget plasserer kartet Tel-Harsja bare omtrentlig, innenfor omkring 50 km fra Nippur i det sentrale Irak."
  tl:
    - "Ang Tel-harsa (Tel-harsha o Tel-haresha sa ibang mga salin, Telharsa sa Nehemias) ay isa sa mga lugar sa Babilonia kung saan nanggaling ang isang pangkat ng mga bumabalik na ipinatapon na hindi makapagpatunay ng kanilang angkan: “At ang mga ito ang nagsiahon mula sa Tel-mela, Tel-harsa, Cherub, Addan, at Immer: nguni't hindi nila naipakilala ang mga sangbahayan ng kanilang mga magulang, at ang kanilang binhi kung sila'y taga Israel”. Pareho ang talaan sa dalawang aklat. Ang tel, gaya ng Akkadian na tilu, ay nangangahulugang burol ng guho; hindi tiyak ang kahulugan ng ikalawang bahagi, at malamang inilalarawan ng pangalan ang muling tinirhang burol ng guho, ng uri na pinagtataniman ng mga taga-Babilonia ng mga itinapon."
    - "Iyan lamang ang nalalaman. Ang bayan ay hindi tiyak na natagpuan sa mga tekstong kuneiporme at hindi matukoy. Ipinakikita ng mga dokumentong Babilonyo ang mga Judiong nanirahan sa kanayunan sa paligid ng Nippur noong ika-6 at ika-5 siglo BK, sa mga talaang pangnegosyo ng pamilya Murashu ng Nippur at marahil sa mga tableta mula sa Al-Yahudu, “ang bayan ng Juda”, na hindi alam ang eksaktong pook, at dahil dito ay inilalagay lamang ng mapa ang Tel-harsa nang tinatayang, sa loob ng humigit-kumulang 50 km mula sa Nippur sa gitnang Iraq."
  da:
    - "Tel-Harsja (Tel-Harsa i Ezra, Tel-Haresja i Nehemias) var et af stederne i Babylonien, hvorfra en gruppe hjemvendte eksilerede kom, som ikke kunne bevise deres afstamning: »disse ere de som droge op fra Thel-Mela, Thel-Harsa, Kerub, Addan og Immer; men de kunde ikke angive deres Fædres Hus og deres Slægt, om de vare af Israel«. Den samme liste står i begge bøger. Tel betyder ligesom akkadisk tilu en ruinhøj; betydningen af anden del er uvis, og navnet beskrev sandsynligvis en genbosat ruinhøj af den slags, hvorpå babylonierne bosatte deporterede."
    - "Det er alt, hvad der vides. Byen er ikke med sikkerhed fundet i kileskrifttekster og kan ikke lokaliseres. Babylonske dokumenter viser judæere bosat på landet omkring Nippur i 500- og 400-tallet f.Kr., i Murashu-familiens forretningsoptegnelser fra Nippur og sandsynligvis i tavlerne fra Al-Yahudu, »Judas by«, hvis nøjagtige sted er ukendt, og på dette grundlag placerer kortet Tel-Harsja kun nogenlunde, inden for omkring 50 km fra Nippur i det centrale Irak."
  sr:
    - "Тел-Харса (у Јездри и Немији Тел-Ариса) била је једно од места у Вавилонији одакле је дошла група повратника из изгнанства који нису могли доказати своје порекло: „И ови пођоше из Тел-Мелеха и Тел-Арисе, Херув, Адан и Имир, али не могоше показати отачки дом свој и семе своје, еда ли су од Израиља“. Исти списак стоји у обе књиге. Тел, као акадско тилу, значи хум рушевина; значење другог дела је несигурно, а име је вероватно описивало поново насељен рушевински хум, какве су Вавилонци користили за насељавање одведених."
    - "То је све што се зна. Град није са сигурношћу нађен у клинастим текстовима и не може се сместити. Вавилонски документи показују Јудејце насељене на селу око Нипура у 6. и 5. веку п. н. е., у пословним записима породице Мурашу из Нипура и вероватно у плочицама из Ал-Јахудуа, „града Јуде“, чије је тачно налазиште непознато, и на тој основи карта Тел-Харсу смешта само приближно, у оквиру око 50 км од Нипура у средишњем Ираку."
  hu:
    - "Tél-Harsa (Ezsdrásnál Tél-Harsa, Nehémiásnál Tél-Harésa) egyike volt azoknak a babilóniai helyeknek, ahonnan hazatérő számkivetettek egy csoportja érkezett, amely nem tudta igazolni származását: „ezek, a kik feljövének Tél-Melahból, Tél-Harsából, Kerub-Addán-Immérből, de nem mondhatták meg családjukat és eredetüket, hogy Izráel közül valók-é”. Ugyanez a lista áll mindkét könyvben. A tél, akárcsak az akkád tilu, romhalmot jelent; a név második felének jelentése bizonytalan, és a név valószínűleg újratelepített romhalmot jelölt, amilyenekre a babilóniaiak a deportáltakat telepítették."
    - "Ez minden, amit tudunk. A várost ékírásos szövegekben nem találták meg biztosan, és helye nem határozható meg. Babilóniai okiratok a Kr. e. 6. és 5. században Nippur környékének vidékén megtelepedett júdeaiakat mutatnak, a nippuri Murasú család üzleti feljegyzéseiben és valószínűleg az Al-Jahudu, „Júda városa” tábláin, amelynek pontos helye ismeretlen, és ezért a térkép Tél-Harsát csak hozzávetőlegesen helyezi el, Nippurtól mintegy 50 km-en belül, Irak közepén."
  fi:
    - "Tel-Harsa (Esran kirjassa Tel-Harsa, Nehemian kirjassa Tel-Haresa) oli yksi Babylonian paikoista, joista tuli palanneiden pakkosiirtolaisten ryhmä, joka ei voinut todistaa polveutumistaan: ”Nämä olivat ne, jotka lähtivät Teel-Melahista, Teel-Harsasta, Kerub-Addanista ja Immeristä, voimatta ilmoittaa perhekuntaansa ja syntyperäänsä, olivatko israelilaisia”. Sama luettelo on molemmissa kirjoissa. Tel merkitsee, kuten akkadin tilu, raunioröykkiötä; toisen osan merkitys on epävarma, ja nimi kuvasi luultavasti uudelleenasutettua raunioröykkiötä, sellaista, jolle babylonialaiset sijoittivat karkotettuja."
    - "Siinä kaikki, mitä tiedetään. Kaupunkia ei ole löydetty nuolenpäätekstien joukosta varmasti, eikä sitä voida paikantaa. Babylonialaiset asiakirjat osoittavat juudalaisten asettuneen Nippurin ympäristön maaseudulle 500- ja 400-luvuilla eaa., Nippurin Murashu-suvun liikekirjanpidossa ja luultavasti Al-Yahudun, ”Juudan kaupungin”, jonka tarkka sijainti on tuntematon, tauluissa, ja siksi kartta sijoittaa Tel-Harsan vain likimääräisesti, noin 50 km:n säteelle Nippurista Keski-Irakissa."
  vi:
    - "Tên-Ha-sa (Tel-harsa trong Ê-xơ-ra, Tel-haresha trong Nê-hê-mi) là một trong những nơi ở Ba-by-lôn mà từ đó một nhóm người lưu đày trở về không chứng minh được gia hệ của mình: “Nầy là những người ở Tên-Mê-la. Tên-Hạt-sa, Kê-rúp-A-đan, và Y-mê trở lên, không thể nói rõ gia tộc và phổ hệ mình, đặng chỉ rằng mình thuộc về dòng dõi Y-sơ-ra-ên hay chăng”. Cùng danh sách ấy có trong cả hai sách. Tel, như tilu trong tiếng Akkad, nghĩa là gò tàn tích; nghĩa của phần thứ hai không chắc chắn, và tên này có lẽ mô tả một gò tàn tích được tái định cư, loại gò mà người Ba-by-lôn đưa những người bị đày đến ở."
    - "Chỉ biết có vậy. Thị trấn chưa chắc chắn được tìm thấy trong các văn bản hình nêm và không thể xác định vị trí. Các tài liệu Ba-by-lôn cho thấy người Giu-đa định cư ở nông thôn quanh Nippur vào thế kỷ 6 và 5 TCN, trong các ghi chép thương mại của gia tộc Murashu ở Nippur và có lẽ trong các bảng chữ từ Al-Yahudu, “thành của Giu-đa”, mà địa điểm chính xác không rõ, và vì căn cứ đó bản đồ chỉ đặt Tên-Ha-sa đại khái, trong vòng khoảng 50 km quanh Nippur ở trung Iraq."
  ro:
    - "Tel-Harșa (Tel-Harsa în Ezra, Tel-Hareșa în Neemia) era unul dintre locurile din Babilonia de unde a venit un grup de exilați întorși care nu își puteau dovedi descendența: „Și cei cari s’au suit dela Telmeleh, Telarisa, Heruv, Idan, Emir, și n’au putut să spue casa lor părintească și neamul lor, și dacă sunt din Israil”. Aceeași listă se află în ambele cărți. Tel, ca akkadianul tilu, înseamnă o movilă de ruine; sensul celei de-a doua părți este nesigur, iar numele descria probabil o movilă de ruine repopulată, de felul celor pe care babilonienii îi așezau pe deportați."
    - "Atât se știe. Orașul nu a fost găsit cu certitudine în textele cuneiforme și nu poate fi localizat. Documentele babiloniene arată iudei așezați în zona rurală din jurul Nippurului în secolele al VI-lea și al V-lea î.Hr., în arhivele de afaceri ale familiei Murashu din Nippur și probabil în tăblițele din Al-Yahudu, „cetatea lui Iuda”, al cărei loc exact nu se cunoaște, și din acest motiv harta așază Tel-Harșa doar aproximativ, pe o rază de circa 50 km de Nippur, în centrul Irakului."
  bg:
    - "Тел-Харша (Тел-Харса в Ездра, Тел-Хареша в Неемия) било едно от местата във Вавилония, откъдето дошла група завърнали се изгнаници, които не могли да докажат произхода си: „А тези бяха възлезлите от Тел-мелах, Тел-ариса, Херув, Адан, и Емир; и не могоха да покажат дома на отечествието си и семето си, да ли бяха от Израиля“. Същият списък стои и в двете книги. Тел, както акадското tilu, означава могила от развалини; значението на втората част е несигурно и името вероятно описвало повторно заселена могила от развалини, каквито вавилонците заселвали с депортирани."
    - "Това е всичко, което се знае. Градът не е намерен със сигурност в клинописни текстове и не може да бъде локализиран. Вавилонски документи показват юдеи, заселени в селските области около Нипур през VI и V в. пр.н.е. — в деловите записи на семейство Мурашу от Нипур и вероятно в плочките от Ал-Яхуду, „градът на Юда“, чието точно място е неизвестно, и на това основание картата поставя Тел-Харша само приблизително, в рамките на около 50 км от Нипур в Централен Ирак."
