body:
  en:
    - "The City of Salt, Hebrew Ir ha-Melah, was one of the six towns of Judah's wilderness district on the western shore of the Dead Sea: “And Nibshan, and the city of Salt, and En-gedi; six cities with their villages.” It is named only here; the King James Version translates the name, while the Russian Synodal Bible keeps it as Ir-Melah. Its site is not certain, but its place in the list, just before En-gedi, points to the shore north of En-gedi."
    - "Martin Noth, Roland de Vaux, and Frank Moore Cross with Józef Milik identified it with the Iron Age settlement beneath the later buildings of Khirbet Qumran, where de Vaux, excavating in 1951–1956, found walls of the eighth to seventh centuries BC, a deep round cistern and a royal seal impression on a jar handle; the map follows this. Hanan Eshel argued instead that Qumran was Secacah of the same list; other proposals for the City of Salt include En et-Turaba and Masad Gozal. Qumran lies today in the West Bank, near the north-western shore of the Dead Sea."
  ru:
    - "Ир-Мелах, «город соли», — один из шести городов пустынного округа Иуды на западном берегу Мёртвого моря: «Нившан, Ир-Мелах и Ен-Геди: шесть городов с их селами». Он назван только здесь; Синодальный перевод сохраняет еврейское имя, а английская Библия короля Якова переводит его как «город Соли». Его место не установлено, но положение в списке, непосредственно перед Ен-Геди, указывает на берег к северу от Ен-Геди."
    - "Мартин Нот, Ролан де Во, а также Фрэнк Мур Кросс и Юзеф Милик отождествляли его с поселением железного века под позднейшими постройками Хирбет-Кумрана, где де Во, раскапывавший его в 1951–1956 гг., нашёл стены VIII–VII вв. до н. э., глубокую круглую цистерну и оттиск царской печати на ручке кувшина; карта следует этому. Ханан Эшель, напротив, считал Кумран Секахой из того же списка; для Ир-Мелаха предлагались также Эн-эт-Тураба и Мецад-Гозаль. Кумран находится сегодня на Западном берегу, у северо-западного берега Мёртвого моря."
  cs:
    - "Město soli, hebrejsky Ir ha-Melach, bylo jedno ze šesti měst judského pouštního okresu na západním břehu Mrtvého moře: „A Nibsam, a město solné, a Engadi, měst šest i vsi jejich.“ Je jmenováno jen zde; Bible krále Jakuba jméno překládá, zatímco ruská synodální Bible je ponechává jako Ir-Melach. Jeho poloha není jistá, ale jeho místo v seznamu, těsně před En-gedi, ukazuje na břeh severně od En-gedi."
    - "Martin Noth, Roland de Vaux a Frank Moore Cross s Józefem Milikem je ztotožnili se sídlištěm doby železné pod pozdějšími stavbami Chirbet Kumrán, kde de Vaux při vykopávkách v letech 1951–1956 nalezl zdi z osmého až sedmého století př. n. l., hlubokou kulatou cisternu a otisk královské pečeti na uchu džbánu; mapa tento názor sleduje. Chanan Eshel naopak tvrdil, že Kumrán byl Sekaka téhož seznamu; jiné návrhy pro Město soli zahrnují En et-Turaba a Masad Gozal. Kumrán leží dnes na Západním břehu, poblíž severozápadního břehu Mrtvého moře."
  uk:
    - "Ір-Мелах, «Місто Солі», івритом Ір га-Мелах, було одним із шести міст пустельного округу Юди на західному березі Мертвого моря: «Нибсан та Солоний город та Енгеди — шість хородів з їх селами». Воно назване лише тут; Біблія короля Якова перекладає назву, а російська Синодальна Біблія зберігає її як Ір-Мелах. Його місце непевне, але місце в переліку, просто перед Ен-Геді, вказує на берег на північ від Ен-Геді."
    - "Мартін Нот, Роланд де Во, а також Френк Мур Кросс із Юзефом Міліком ототожнили його з поселенням залізної доби під пізнішими спорудами Хірбет-Кумрана, де де Во, розкопуючи в 1951–1956 рр., знайшов мури VIII–VII ст. до н. е., глибоку круглу цистерну й відбиток царської печатки на ручці глека; мапа йде за цим. Ханан Ешель натомість доводив, що Кумран — це Секаха з того самого переліку; інші пропозиції щодо Ір-Мелаха включають Ен-ет-Тураба та Масад-Гозаль. Кумран лежить нині на Західному березі, поблизу північно-західного берега Мертвого моря."
  pl:
    - "Miasto Soli, hebrajskie Ir ha-Melach, było jednym z sześciu miast okręgu pustynnego Judy na zachodnim brzegu Morza Martwego: „I Nebsan, i miasto Soli, i Engaddy, miast sześć, i wsi ich”. Jest wymienione tylko tu; Biblia Króla Jakuba tłumaczy nazwę, podczas gdy rosyjska Biblia synodalna zachowuje ją jako Ir-Melach. Jego położenie nie jest pewne, ale miejsce na liście, tuż przed En-Gedi, wskazuje na brzeg na północ od En-Gedi."
    - "Martin Noth, Roland de Vaux oraz Frank Moore Cross z Józefem Milikiem utożsamili je z osadą z epoki żelaza pod późniejszymi budowlami Chirbet Qumran, gdzie de Vaux, prowadząc wykopaliska w latach 1951-1956, znalazł mury z VIII-VII w. p.n.e., głęboką okrągłą cysternę i odcisk pieczęci królewskiej na uchu dzbana; mapa idzie za tym. Hanan Eshel dowodził natomiast, że Qumran to Sekaka z tej samej listy; inne propozycje dla Miasta Soli to En et-Turaba i Masad Gozal. Qumran leży dziś na Zachodnim Brzegu, blisko północno-zachodniego brzegu Morza Martwego."
  es:
    - "La Ciudad de la Sal, en hebreo Ir ha-Melah, fue una de las seis ciudades del distrito desértico de Judá en la orilla occidental del mar Muerto: «Y Nibsan, y la ciudad de la sal, y Engedi; seis ciudades con sus aldeas». Solo se nombra aquí; la versión King James traduce el nombre, mientras que la Biblia sinodal rusa lo conserva como Ir-Melah. Su emplazamiento no es seguro, pero su lugar en la lista, justo antes de Engadi, apunta a la orilla al norte de Engadi."
    - "Martin Noth, Roland de Vaux, y Frank Moore Cross con Józef Milik la identificaron con el asentamiento de la edad del Hierro bajo los edificios posteriores de Khirbet Qumrán, donde de Vaux, que excavó en 1951–1956, halló muros de los siglos VIII–VII a. C., una honda cisterna redonda y una impronta de sello real en el asa de una jarra; el mapa lo sigue. Hanan Eshel sostuvo en cambio que Qumrán era la Secaca de la misma lista; otras propuestas para la Ciudad de la Sal son En et-Turaba y Masad Gozal. Qumrán se encuentra hoy en Cisjordania, cerca de la orilla noroccidental del mar Muerto."
  pt:
    - "A Cidade do Sal, em hebraico Ir ha-Melah, era uma das seis cidades do distrito do deserto de Judá, na margem ocidental do mar Morto: “Nibsã, a Cidade do Sal e En-Gedi; seis cidades com as suas aldeias.” É nomeada somente aqui; a Versão King James traduz o nome, enquanto a Bíblia sinodal russa o conserva como Ir-Melah. Seu sítio não é certo, mas seu lugar na lista, logo antes de En-Gedi, aponta para a margem ao norte de En-Gedi."
    - "Martin Noth, Roland de Vaux e Frank Moore Cross com Józef Milik a identificaram com o povoado da Idade do Ferro sob os edifícios posteriores de Khirbet Qumran, onde de Vaux, escavando em 1951–1956, encontrou muros dos séculos VIII a VII a.C., uma cisterna redonda e profunda e uma impressão de selo real numa alça de jarra; o mapa segue isso. Hanan Eshel argumentou, em vez disso, que Qumran era Secacá, da mesma lista; outras propostas para a Cidade do Sal incluem En et-Turaba e Masad Gozal. Qumran fica hoje na Cisjordânia, perto da margem noroeste do mar Morto."
  de:
    - "Die Salzstadt, hebräisch Ir ha-Melach, war eine der sechs Städte des Wüstenbezirks Judas am Westufer des Toten Meeres: „Nibsan und die Salzstadt und Engedi. Das sind sechs Städte und ihre Dörfer.“ Sie wird nur hier genannt; die King-James-Bibel übersetzt den Namen, die russische Synodalbibel behält ihn als Ir-Melach bei. Ihre Lage ist nicht sicher, aber ihre Stelle in der Liste, unmittelbar vor Engedi, weist auf das Ufer nördlich von Engedi."
    - "Martin Noth, Roland de Vaux sowie Frank Moore Cross mit Józef Milik setzten sie mit der eisenzeitlichen Siedlung unter den späteren Bauten von Chirbet Qumran gleich, wo de Vaux bei Grabungen 1951–1956 Mauern des achten bis siebten Jahrhunderts v. Chr., eine tiefe runde Zisterne und einen königlichen Siegelabdruck auf einem Krughenkel fand; die Karte folgt dem. Hanan Eshel vertrat dagegen, Qumran sei Sechacha derselben Liste; andere Vorschläge für die Salzstadt sind En et-Turaba und Masad Gozal. Qumran liegt heute im Westjordanland, nahe dem nordwestlichen Ufer des Toten Meeres."
  fr:
    - "La Ville du Sel, en hébreu Ir ha-Melah, était l’une des six villes du district du désert de Juda sur la rive occidentale de la mer Morte : « Nibschan, Ir-Hammélach, et En-Guédi ; six villes, et leurs villages. » Elle n’est nommée qu’ici ; la version du roi Jacques traduit le nom (city of Salt), tandis que Louis Segond (Ir-Hammélach) et la Bible synodale russe (Ir-Melah) le gardent comme nom propre. Son site n’est pas certain, mais sa place dans la liste, juste avant En-Guédi, désigne la rive au nord d’En-Guédi."
    - "Martin Noth, Roland de Vaux, et Frank Moore Cross avec Józef Milik l’identifièrent avec l’établissement de l’âge du Fer sous les bâtiments postérieurs de Khirbet Qumrân, où de Vaux, fouillant en 1951–1956, trouva des murs des VIIIe–VIIe siècles av. J.-C., une profonde citerne ronde et une empreinte de sceau royal sur une anse de jarre ; la carte suit cet avis. Hanan Eshel soutint plutôt que Qumrân était Secaca de la même liste ; d’autres propositions pour la Ville du Sel comprennent En et-Turaba et Masad Gozal. Qumrân se trouve aujourd’hui en Cisjordanie, près de la rive nord-ouest de la mer Morte."
  it:
    - "La Città del Sale, in ebraico Ir ha-Melah, era una delle sei città del distretto desertico di Giuda sulla riva occidentale del Mar Morto: «Nibshan, Ir-Hammelah e Enghedi: sei città e i loro villaggi». È nominata solo qui; la King James Version traduce il nome, mentre la Bibbia sinodale russa lo conserva come Ir-Melah. Il suo sito non è certo, ma la sua posizione nell’elenco, subito prima di En-Ghedi, rimanda alla riva a nord di En-Ghedi."
    - "Martin Noth, Roland de Vaux e Frank Moore Cross con Józef Milik la identificarono con l’insediamento dell’età del Ferro sotto i successivi edifici di Khirbet Qumran, dove de Vaux, scavando nel 1951–1956, trovò mura dell’VIII–VII secolo a.C., una profonda cisterna rotonda e un’impronta di sigillo regio su un’ansa di giara; la carta segue questa ipotesi. Hanan Eshel sostenne invece che Qumran fosse Secacà dello stesso elenco; altre proposte per la Città del Sale comprendono En et-Turaba e Masad Gozal. Qumran si trova oggi in Cisgiordania, vicino alla riva nord-occidentale del Mar Morto."
  nl:
    - "De Zoutstad, Hebreeuws Ir ha-Melah, was een van de zes steden van Juda's woestijndistrict aan de westoever van de Dode Zee: “En Nibsan, en de Zoutstad, en Engedi; zes steden en haar dorpen.” Zij wordt alleen hier genoemd; de King James Version vertaalt de naam, terwijl de Russische Synodale Bijbel hem als Ir-Melah houdt. De ligging is niet zeker, maar haar plaats in de lijst, vlak vóór Engedi, wijst op de oever ten noorden van Engedi."
    - "Martin Noth, Roland de Vaux, en Frank Moore Cross met Józef Milik vereenzelvigden haar met de nederzetting uit de ijzertijd onder de latere gebouwen van Khirbet Qumran, waar De Vaux, die in 1951–1956 groef, muren uit de achtste tot zevende eeuw v.Chr., een diepe ronde cisterne en een koninklijke zegelafdruk op een kruikhengsel vond; de kaart volgt dit. Hanan Eshel betoogde daarentegen dat Qumran het Sekaka uit dezelfde lijst was; andere voorstellen voor de Zoutstad zijn En et-Turaba en Masad Gozal. Qumran ligt tegenwoordig op de Westelijke Jordaanoever, bij de noordwestkust van de Dode Zee."
  sv:
    - "Ir-Hammelach, hebreiska Ir ha-Melah, var en av de sex städerna i Judas ökendistrikt vid Döda havets västra strand: ”Nibsan, Ir-Hammela och En-Gedi – sex städer med sina byar.” Den nämns bara här; King James-bibeln översätter namnet (”the city of Salt”), medan den ryska synodala bibeln behåller det som Ir-Melah. Dess läge är inte säkert, men dess plats i förteckningen, strax före En-Gedi, pekar på stranden norr om En-Gedi."
    - "Martin Noth, Roland de Vaux och Frank Moore Cross med Józef Milik identifierade den med järnåldersbebyggelsen under de senare byggnaderna vid Khirbet Qumran, där de Vaux, som grävde 1951–1956, fann murar från 700- och 600-talen f.Kr., en djup rund cistern och ett kungligt sigillavtryck på ett kärlhandtag; kartan följer detta. Hanan Eshel hävdade i stället att Qumran var Sekaka i samma förteckning; andra förslag för Ir-Hammelach är En et-Turaba och Masad Gozal. Qumran ligger i dag på Västbanken, nära Döda havets nordvästra strand."
  nb:
    - "Saltbyen, hebraisk Ir ha-Melah, var en av de seks byene i Judas ørkendistrikt på vestsiden av Dødehavet: «og Hannibsan og Ir-Hammelah og En-Gedi – seks byer med tilhørende landsbyer.» Den er nevnt bare her; King James-oversettelsen oversetter navnet, mens den russiske synodale bibelen beholder det som Ir-Melah. Dens beliggenhet er ikke sikker, men plassen i listen, like før En-Gedi, peker mot stranden nord for En-Gedi."
    - "Martin Noth, Roland de Vaux og Frank Moore Cross sammen med Józef Milik identifiserte den med jernalderbosetningen under de senere bygningene i Khirbet Qumran, der de Vaux, som gravde i 1951–1956, fant murer fra 700- til 600-tallet f.Kr., en dyp rund sisterne og et kongelig segltrykk på et krukkehåndtak; kartet følger dette. Hanan Eshel hevdet i stedet at Qumran var Sekaka fra samme liste; andre forslag for Saltbyen omfatter En et-Turaba og Masad Gozal. Qumran ligger i dag på Vestbredden, nær den nordvestlige stranden av Dødehavet."
  tl:
    - "Ang Bayan ng Asin, sa Hebreo na Ir ha-Melah, ay isa sa anim na bayan ng distrito ng ilang ng Juda sa kanlurang baybayin ng Dagat na Patay: “At Nibsan, at ang Bayan ng Asin, at En-gedi: anim na bayan pati ng mga nayon ng mga yaon.” Dito lamang ito binabanggit; isinasalin ng King James Version ang pangalan, samantalang iniingatan ito ng Bibliyang Sinodal ng Russia bilang Ir-Melah. Hindi tiyak ang pook nito, ngunit ang puwesto nito sa talaan, bago mismo ang En-gedi, ay tumuturo sa baybayin sa hilaga ng En-gedi."
    - "Kinilala ito nina Martin Noth, Roland de Vaux, at Frank Moore Cross kasama si Józef Milik sa pamayanan ng Panahon ng Bakal sa ilalim ng mga huling gusali ng Khirbet Qumran, kung saan natagpuan ni de Vaux, na humukay noong 1951–1956, ang mga pader noong ika-8 hanggang ika-7 siglo BK, isang malalim na bilog na imbakan ng tubig at isang maharlikang tatak sa hawakan ng banga; sinusunod ito ng mapa. Nangatwiran si Hanan Eshel na ang Qumran ay ang Sechacha ng gayunding talaan; kabilang sa iba pang mungkahi para sa Bayan ng Asin ang En et-Turaba at Masad Gozal. Ang Qumran ay nasa West Bank ngayon, malapit sa hilagang-kanlurang baybayin ng Dagat na Patay."
  da:
    - "Saltbyen, hebraisk Ir ha-Melah, var en af de seks byer i Judas ørkendistrikt ved Det Døde Havs vestkyst: »og Nibsan og Ir-Melak og En-Gedi; seks Stæder og deres Landsbyer«. Den nævnes kun her; King James-oversættelsen oversætter navnet, mens den russiske synodalbibel bevarer det som Ir-Melah. Dens sted er ikke sikkert, men dens plads i listen, lige før En-Gedi, peger på kysten nord for En-Gedi."
    - "Martin Noth, Roland de Vaux og Frank Moore Cross med Józef Milik identificerede den med jernalderbebyggelsen under de senere bygninger i Khirbet Qumran, hvor de Vaux, som udgravede i 1951–1956, fandt mure fra 700- til 600-tallet f.Kr., en dyb, rund cisterne og et kongeligt seglaftryk på et krukkehåndtag; kortet følger dette. Hanan Eshel hævdede i stedet, at Qumran var Sekaka på samme liste; andre forslag til Saltbyen omfatter En et-Turaba og Masad Gozal. Qumran ligger i dag på Vestbredden, nær Det Døde Havs nordvestlige kyst."
  sr:
    - "Град соли, хебрејски Ир ха-Мелах, био је један од шест градова јудејског пустињског округа на западној обали Мртвог мора: „и Нивсан, и град соли, и Енгадија; шест градова са селима својим“. Помиње се само овде; превод Краља Џејмса име преводи, а руска Синодална Библија га задржава као Ир-Мелах. Његово место није извесно, али његов положај на списку, одмах пре Енгадије, упућује на обалу северно од Енгадије."
    - "Мартин Нот, Роланд де Во, и Френк Мур Крос са Јожефом Миликом поистоветили су га са насељем из гвозденог доба испод каснијих зграда Хирбет Кумрана, где је де Во, ископавајући 1951–1956, нашао зидове из 8. до 7. века п. н. е., дубоку округлу цистерну и отисак краљевског печата на дршци посуде; карта то следи. Ханан Ешел је уместо тога тврдио да је Кумран Сехаха с истог списка; остали предлози за Град соли су Ен ет Тураба и Масад Гозал. Кумран данас лежи на Западној обали, близу северозападне обале Мртвог мора."
  hu:
    - "Sóváros, héberül Ir ha-Melah, a Holt-tenger nyugati partján fekvő júdai pusztai körzet hat városának egyike volt: „Nibsán, Ir-Melah és Én-Gedi. Hat város és ezeknek falui.” Csak itt van megnevezve; a King James-fordítás lefordítja a nevet, az orosz Szinodális Biblia pedig Ir-Melahként őrzi meg. Helye nem biztos, de a jegyzékben elfoglalt helye, közvetlenül Én-Gedi előtt, az Én-Geditől északra fekvő partra mutat."
    - "Martin Noth, Roland de Vaux, valamint Frank Moore Cross Józef Milikkel a későbbi khirbet qumráni épületek alatti vaskori településsel azonosította, ahol de Vaux az 1951–1956-os ásatásokon a Kr. e. 8–7. századi falakat, mély kerek ciszternát és kancsófülön királyi pecsétlenyomatot talált; a térkép ezt követi. Hanan Eshel ehelyett azt javasolta, hogy Qumran ugyanennek a jegyzéknek Szekákája volt; a Sóvárosra tett más javaslatok közé tartozik az En et-Turaba és a Masad Gozal. Qumran ma Ciszjordániában fekszik, a Holt-tenger északnyugati partja közelében."
  fi:
    - "Suolakaupunki, hepreaksi Ir ha-Melah, oli yksi kuudesta Juudan erämaapiirin kaupungista Kuolleenmeren länsirannalla: ”Nibsan, Iir-Melah ja Een-Gedi — kuusi kaupunkia kylineen.” Se mainitaan vain tässä; King James -käännös kääntää nimen, kun taas venäläinen synodaalikäännös säilyttää sen muodossa Ir-Melah. Sen sijainti ei ole varma, mutta sen paikka luettelossa juuri ennen En-Gediä viittaa En-Gedistä pohjoiseen olevaan rantaan."
    - "Martin Noth, Roland de Vaux sekä Frank Moore Cross ja Józef Milik tunnistivat sen rautakautiseksi asutukseksi Khirbet Qumranin myöhempien rakennusten alla, missä de Vaux kaivoi vuosina 1951–1956 ja löysi 700- ja 600-luvun eaa. muureja, syvän pyöreän vesisäiliön ja kuninkaallisen sinetinpainauman ruukun kahvassa; kartta seuraa tätä. Hanan Eshel esitti sen sijaan, että Qumran olisi saman luettelon Sekaka; muita ehdotuksia Suolakaupungiksi ovat En et-Turaba ja Masad Gozal. Qumran sijaitsee nykyisin Länsirannalla, Kuolleenmeren luoteisrannan lähellä."
  vi:
    - "Thành Muối, tiếng Hê-bơ-rơ Ir ha-Melah, là một trong sáu thành của khu vực đồng vắng của Giu-đa trên bờ tây Biển Chết: “Níp-san, Yết-Ha-mê-lách, và Ên-ghê-đi: hết thảy sáu thành với các làng của nó.” Nó chỉ được nêu tên ở đây; Bản King James dịch tên này, còn Kinh Thánh Synodal của Nga giữ nó là Ir-Melah. Vị trí của nó không chắc chắn, nhưng chỗ của nó trong bảng, ngay trước Ên-ghê-đi, chỉ về bờ biển phía bắc Ên-ghê-đi."
    - "Martin Noth, Roland de Vaux, và Frank Moore Cross cùng với Józef Milik đồng nhất nó với khu định cư thời đồ sắt bên dưới các công trình muộn hơn của Khirbet Qumran, nơi de Vaux, khai quật năm 1951–1956, tìm thấy các bức tường thế kỷ 8 đến 7 TCN, một bể chứa tròn sâu và một dấu ấn con dấu hoàng gia trên quai bình; bản đồ theo cách này. Hanan Eshel thì lập luận rằng Qumran là Sê-ca-ca trong cùng bảng; các đề nghị khác cho Thành Muối gồm En et-Turaba và Masad Gozal. Ngày nay Qumran nằm ở Bờ Tây, gần bờ tây bắc Biển Chết."
  ro:
    - "Cetatea Sării, în ebraică Ir ha-Melah, era una dintre cele șase cetăți ale districtului pustiei lui Iuda, pe malul de vest al Mării Moarte: Nibșan, Cetatea Sării și En-Ghedi, șase cetăți cu satele lor. Este numită numai aici; King James Version traduce numele, în timp ce Biblia sinodală rusă îl păstrează ca Ir-Melah. Locul ei nu este sigur, dar poziția în listă, chiar înainte de En-Ghedi, arată spre țărmul de la nord de En-Ghedi."
    - "Martin Noth, Roland de Vaux și Frank Moore Cross împreună cu Józef Milik au identificat-o cu așezarea din epoca fierului de sub clădirile mai târzii de la Khirbet Qumran, unde de Vaux, săpând în 1951–1956, a găsit ziduri din secolele al VIII-lea–al VII-lea î.Hr., o cisternă rotundă adâncă și o amprentă de sigiliu regal pe un mâner de vas; harta urmează această părere. Hanan Eshel a susținut în schimb că Qumran era Secaca din aceeași listă; alte propuneri pentru Cetatea Sării includ En et-Turaba și Masad Gozal. Qumranul se află astăzi în Cisiordania, aproape de malul nord-vestic al Mării Moarte."
  bg:
    - "Градът на солта, на иврит Ир ха-Мелах, бил един от шестте града в пустинния окръг на Юда на западния бряг на Мъртво море: „и Нивсан, и Градът на Солта, и Енгади, градове шест, и селата им“. Той е назован само тук; Библията на крал Джеймс превежда името, а руският Синодален превод го запазва като Ир-Мелах. Мястото му не е сигурно, но положението му в списъка, точно преди Енгади, сочи брега северно от Енгади."
    - "Мартин Нот, Ролан дьо Во, както и Франк Мур Крос заедно с Юзеф Милик го отъждествяват със селището от желязната епоха под по-късните сгради на Хирбет Кумран, където дьо Во, разкопавайки през 1951–1956 г., открил стени от VIII–VII в. пр.н.е., дълбока кръгла цистерна и отпечатък от царски печат върху дръжка на делва; картата следва това. Ханан Ешел обаче твърди, че Кумран е Сека от същия списък; други предложения за Града на солта са Ен ет-Тураба и Масад Гозал. Кумран лежи днес на Западния бряг, близо до северозападния бряг на Мъртво море."
