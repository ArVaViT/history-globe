# Overview article (ADR 0007). The City of Salt is placed at Qumran's Iron Age settlement by Noth, de Vaux and Cross & Milik (the map's point); Eshel's view that Qumran is Secacah and the other proposals (En et-Turaba, Masad Gozal) are noted (see secacah.yaml).
