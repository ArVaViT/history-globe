body:
  en:
    - "Arvad was a Phoenician city on a small rocky island about 3 km off the coast of northern Syria, opposite Tartus; the Greeks called it Aradus. The table of nations counts “the Arvadite” among the sons of Canaan. The island was crowded and had no room for farms, so its people lived from the sea, and Ezekiel, in his lament over Tyre pictured as a great ship, gives them their place on board and on the walls: “The inhabitants of Zidon and Arvad were thy mariners”, and “The men of Arvad with thine army were upon thy walls round about”. Those two verses are the whole of the Bible's notice. Outside it Arvad is well known: it appears as Arwada in the Amarna letters, a king of Arvad sent 200 men against Shalmaneser III at Qarqar in 853 BC, and later kings paid tribute to Assyria. Strabo describes houses of many storeys and fresh water drawn from a spring on the sea floor."
    - "The city kept its own coinage under the Persians and Seleucids and flourished as Aradus in Roman times. In the Middle Ages it was the last foothold of the Crusaders on the Levantine coast, held by the Templars until 1302. Today Arwad is the only inhabited island of Syria, a town of fishermen and boat-builders with a fortress and stretches of its ancient sea wall."
  ru:
    - "Арвад — финикийский город на небольшом скалистом острове примерно в 3 км от берега северной Сирии, напротив Тартуса; греки звали его Арад. Родословие народов числит Арвадея среди сыновей Ханаана. Остров был тесен и не имел места для полей, поэтому его жители кормились морем, и Иезекииль в плаче о Тире, изображённом как большой корабль, отводит им место на борту и на стенах: «Жители Сидона и Арвада были у тебя гребцами» и «Сыны Арвада с собственным твоим войском стояли кругом на стенах твоих». Эти два стиха — всё, что говорит о нём Библия. За её пределами Арвад хорошо известен: он упоминается как Арвада в амарнских письмах, царь Арвада послал 200 воинов против Салманасара III при Каркаре в 853 г. до н. э., а позднейшие цари платили дань Ассирии. Страбон описывает многоэтажные дома и пресную воду, которую черпали из источника на морском дне."
    - "При персах и Селевкидах город чеканил собственную монету и процветал как Арад в римское время. В Средние века он был последней опорой крестоносцев на левантийском берегу и оставался за тамплиерами до 1302 года. Сегодня Арвад — единственный обитаемый остров Сирии, городок рыбаков и корабельщиков с крепостью и остатками древней морской стены."
  uk:
    - "Арвад був фінікійським містом на невеликому скелястому острові приблизно за 3 км від узбережжя північної Сирії, навпроти Тартуса; греки називали його Арад. Таблиця народів зараховує «Арвадїй» до синів Ханаану. Острів був тісний і не мав місця для полів, тож його мешканці жили з моря, і Єзекіїль у плачі над Тіром, змальованим великим кораблем, дає їм місце на борту й на мурах: «Осадники Сидонські й Арвадські служили в тебе гребцями» та «Арвадські й власьні військові твої люде стояли навкруги по мурах твоїх». Ці два вірші — вся згадка Біблії. Поза нею Арвад добре відомий: він з'являється як Арвада в листах з Амарни, цар Арвада виставив 200 воїнів проти Салманассара III при Каркарі в 853 р. до н. е., а пізніші царі платили данину Ассирії. Страбон описує багатоповерхові будинки та прісну воду, яку черпали з джерела на морському дні."
    - "Місто зберігало власну карбовану монету за персів і Селевкідів і процвітало як Арад у римські часи. У Середньовіччі це був останній опорний пункт хрестоносців на левантійському узбережжі, який тримали тамплієри до 1302 року. Нині Арвад — єдиний населений острів Сирії, містечко рибалок і корабелів із фортецею та відтинками давнього морського муру."
  es:
    - "Arvad era una ciudad fenicia en una pequeña isla rocosa a unos 3 km de la costa del norte sirio, frente a Tartús; los griegos la llamaban Arado. La tabla de las naciones cuenta a «el Aradio» entre los hijos de Canaán. La isla, abarrotada y sin espacio para cultivos, hacía vivir a sus habitantes del mar, y Ezequiel, en su lamento sobre Tiro, como un gran barco, les da su lugar a bordo y en las murallas: «Los moradores de Sidón y de Arvad fueron tus remeros», y «Y los hijos de Arvad con tu ejército estuvieron sobre tus muros alrededor». Esos dos versículos son toda la mención bíblica. Fuera de la Biblia es bien conocida: aparece como Arwada en las cartas de Amarna, un rey de Arvad envió 200 hombres contra Salmanasar III en Qarqar en 853 a. C., y otros reyes pagaron tributo a Asiria. Estrabón describe casas de muchos pisos y agua dulce de un manantial en el fondo del mar."
    - "La ciudad conservó su propia acuñación bajo los persas y los seléucidas y floreció como Arado en época romana. En la Edad Media fue el último punto de apoyo de los cruzados en la costa del Levante, en poder de los templarios hasta 1302. Hoy Arwad es la única isla habitada de Siria, una ciudad de pescadores y constructores de barcos con una fortaleza y tramos de su antigua muralla marina."
  pt:
    - "Arvade era uma cidade fenícia numa pequena ilha rochosa a cerca de 3 km da costa do norte da Síria, defronte de Tartus; os gregos a chamavam Arado. A tabela das nações conta “os arvadeus” entre os filhos de Canaã. A ilha era apinhada e sem espaço para lavouras, por isso seu povo vivia do mar, e Ezequiel, em seu lamento sobre Tiro, vista como um grande navio, lhes dá lugar a bordo e nos muros: “Os habitantes de Sidom e Arvade eram os seus remadores”, e “Os homens de Arvade com o seu exército estavam sobre os seus muros ao redor”. Esses dois versículos são todo o registro bíblico. Fora dela Arvade é bem conhecida: aparece como Arwada nas cartas de Amarna, um rei de Arvade enviou 200 homens contra Salmaneser III em Qarqar em 853 a.C., e reis posteriores pagaram tributo à Assíria. Estrabão descreve casas de muitos andares e água doce tirada de uma fonte no fundo do mar."
    - "A cidade manteve moeda própria sob persas e selêucidas e floresceu como Arado em tempos romanos. Na Idade Média foi o último ponto de apoio dos cruzados na costa do Levante, mantido pelos templários até 1302. Hoje Arwad é a única ilha habitada da Síria, uma cidade de pescadores e construtores de barcos, com uma fortaleza e trechos de sua antiga muralha marítima."
  de:
    - "Arwad war eine phönizische Stadt auf einer kleinen felsigen Insel etwa 3 km vor der Küste Nordsyriens, gegenüber Tartus; die Griechen nannten es Aradus. Die Völkertafel zählt „den Arvaditer“ unter die Söhne Kanaans. Die dicht bebaute Insel hatte keinen Raum für Äcker, so lebten die Bewohner vom Meer, und Hesekiel weist ihnen in seiner Klage über Tyrus, als großes Schiff gezeichnet, Platz an Bord und auf den Mauern zu: „Die von Sidon und Arvad waren deine Ruderknechte“ und „Die von Arvad waren unter deinem Heer rings um die Mauern“. Diese zwei Verse sind die ganze Erwähnung der Bibel. Sonst ist Arwad gut bekannt: Es erscheint als Arwada in den Amarna-Briefen, ein König von Arwad schickte 853 v. Chr. 200 Mann gegen Salmanassar III. bei Qarqar, spätere Könige zahlten Assyrien Tribut. Strabon beschreibt vielstöckige Häuser und Wasser aus einer Quelle am Meeresgrund."
    - "Die Stadt behielt unter Persern und Seleukiden eigene Münzen und blühte als Aradus in römischer Zeit. Im Mittelalter war sie der letzte Stützpunkt der Kreuzfahrer an der levantinischen Küste, bis 1302 von den Templern gehalten. Heute ist Arwad die einzige bewohnte Insel Syriens, eine Stadt von Fischern und Bootsbauern mit einer Festung und Abschnitten ihrer antiken Seemauer."
  fr:
    - "Arvad était une ville phénicienne sur une petite île rocheuse à 3 km de la côte nord de la Syrie, face à Tartous ; les Grecs l’appelaient Arados. La table des nations compte « les Arvadiens » parmi les fils de Canaan. Faute de place pour des champs sur l’île encombrée, ses habitants vivaient de la mer, et Ézéchiel, lamentant Tyr figurée en grand navire, les place à bord et sur les murs : « Les habitants de Sidon et d’Arvad étaient tes rameurs », et « Les enfants d’Arvad et tes guerriers garnissaient tes murs ». Ces deux versets sont toute la mention biblique. Hors d’elle, Arvad est bien attestée : elle paraît sous le nom d’Arwada dans les lettres d’Amarna, un roi d’Arvad envoya 200 hommes contre Salmanasar III à Qarqar en 853 av. J.-C., et d’autres rois payèrent tribut à l’Assyrie. Strabon décrit des maisons à étages et de l’eau douce puisée à une source sous-marine."
    - "La ville garda sa propre monnaie sous les Perses et les Séleucides et prospéra comme Arados à l’époque romaine. Au Moyen Âge, elle fut le dernier point d’appui des croisés sur la côte du Levant, tenu par les Templiers jusqu’en 1302. Aujourd’hui Arwad est la seule île habitée de Syrie, bourg de pêcheurs et de constructeurs de bateaux avec une forteresse et des tronçons de son ancien mur de mer."
  it:
    - "Arvad era una città fenicia su una piccola isola rocciosa a circa 3 km dalla costa della Siria settentrionale, di fronte a Tartus; i Greci la chiamavano Arado. La tavola delle nazioni conta «gli Arvadei» fra i figli di Canaan. L’isola, affollata e senza spazio per campi, faceva vivere la gente del mare, ed Ezechiele, nel lamento su Tiro come grande nave, assegna loro il posto a bordo e sulle mura: «Gli abitanti di Sidon e d’Arvad sono i tuoi rematori», e «I figliuoli d’Arvad e il tuo esercito guarniscono d’ogn’intorno le tue mura». I due versetti sono tutto ciò che la Bibbia dice. Fuori di essa Arvad è ben nota: compare come Arwada nelle lettere di Amarna, un suo re mandò 200 uomini contro Salmanàssar III a Qarqar nell’853 a.C., e re successivi pagarono tributo all’Assiria. Strabone descrive case a molti piani e acqua dolce attinta da una sorgente sottomarina."
    - "La città ebbe moneta propria sotto i Persiani e i Seleucidi e fiorì come Arado in epoca romana. Nel Medioevo fu l’ultimo punto d’appoggio dei crociati sulla costa levantina, tenuto dai Templari fino al 1302. Oggi Arwad è l’unica isola abitata della Siria, una città di pescatori e costruttori di barche con una fortezza e tratti dell’antica muraglia sul mare."
  pl:
    - "Arwad było fenickim miastem na małej skalistej wyspie około 3 km od wybrzeża północnej Syrii, naprzeciw Tartusu; Grecy nazywali je Aradus. Tablica Ludów zalicza „Arwadytę” do synów Kanaana. Wyspa była ciasna i nie miała miejsca na pola, więc jej mieszkańcy żyli z morza, a Ezechiel w lamencie nad Tyrem przedstawionym jako wielki okręt daje im miejsce na pokładzie i na murach: „Obywatele Sydonu, i Arwadczycy bywali żeglarzami twymi” oraz „Synowie Arwad z wojskiem twojem na murach twoich w około”. Te dwa wersety to cała wzmianka Biblii. Poza nią Arwad jest dobrze znane: występuje jako Arwada w listach z Amarna, król Arwadu wysłał 200 ludzi przeciw Salmanasarowi III pod Qarqar w 853 r. p.n.e., a późniejsi królowie płacili daninę Asyrii. Strabon opisuje domy o wielu piętrach i słodką wodę czerpaną ze źródła na dnie morza."
    - "Miasto zachowało własną monetę pod panowaniem Persów i Seleucydów i kwitło jako Aradus w czasach rzymskich. W średniowieczu było ostatnim przyczółkiem krzyżowców na wybrzeżu Lewantu, trzymanym przez templariuszy do 1302 roku. Dziś Arwad to jedyna zamieszkana wyspa Syrii, miasteczko rybaków i szkutników z twierdzą i odcinkami dawnego muru morskiego."
  nl:
    - "Arwad was een Fenicische stad op een klein rotseiland zo’n 3 km voor de kust van Noord-Syrië, tegenover Tartus; de Grieken noemden het Aradus. De volkerentafel telt “den Arvadiet” onder de zonen van Kanaän. Het eiland was vol en had geen ruimte voor akkers, dus de bewoners leefden van de zee, en Ezechiël, in zijn klaagzang over Tyrus als een groot schip, geeft hun hun plaats aan boord en op de muren: “De inwoners van Sidon en Arvad waren uw roeiers”, en “De kinderen van Arvad en uw heir waren rondom op uw muren”. Die twee verzen zijn de hele vermelding in de Bijbel. Daarbuiten is Arwad goed bekend: het verschijnt als Arwada in de Amarnabrieven, een koning van Arwad zond 200 man tegen Salmaneser III bij Qarqar in 853 v.Chr., en latere koningen betaalden schatting aan Assyrië. Strabo beschrijft huizen van vele verdiepingen en zoet water uit een bron op de zeebodem."
    - "De stad had onder de Perzen en Seleuciden een eigen munt en bloeide als Aradus in de Romeinse tijd. In de middeleeuwen was het het laatste steunpunt van de kruisvaarders aan de kust van de Levant, door de tempeliers gehouden tot 1302. Tegenwoordig is Arwad het enige bewoonde eiland van Syrië, een stadje van vissers en bootbouwers met een vesting en stukken van de oude zeemuur."
  cs:
    - "Arvad bylo fénické město na malém skalnatém ostrově asi 3 km od pobřeží severní Sýrie, naproti Tartúsu; Řekové je nazývali Arados. Tabulka národů počítá mezi syny Kanaánovy „Aradia“. Ostrov byl přelidněný a nebylo na něm místo pro políčka, a tak jeho obyvatelé žili z moře, a Ezechiel jim v nářku nad Týrem, vyobrazeným jako velká loď, určuje místo na palubě i na hradbách: „Obyvatelé Sidonští i Arvadští bývali plavci tvoji“ a „Arvadští s vojskem tvým na zdech tvých vůkol“. Tyto dva verše jsou celým biblickým záznamem. Mimo ni je Arvad dobře znám: v Amarnských listech se objevuje jako Arwada, král Arvadu vyslal roku 853 př. n. l. u Qarqaru 200 mužů proti Salmanasarovi III. a pozdější králové platili tribut Asýrii. Strabón popisuje domy o mnoha podlažích a sladkou vodu čerpanou z pramene na mořském dně."
    - "Město si za Peršanů a Seleukovců uchovalo vlastní ražbu mincí a vzkvétalo jako Arados v římské době. Ve středověku bylo poslední oporou křižáků na levantském pobřeží, drženou templáři do roku 1302. Dnes je Arwad jediným obydleným ostrovem Sýrie, městem rybářů a stavitelů lodí s pevností a úseky starověké mořské hradby."
