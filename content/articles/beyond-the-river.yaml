# Overview article (ADR 0007). Mainstream facts only; the Persian satrapy follows the cuneiform evidence for Tattenai and the division from Babylon.
id: beyond-the-river
place: a88310a
title:
  en: "Beyond the River"
  ru: "Заречье"
  uk: "Заріччя"
  es: "Más allá del Río"
  pt: "Além do Rio"
  de: "Jenseits des Stroms"
  fr: "Au-delà du fleuve"
  it: "Oltre il Fiume"
  pl: "Zarzecze"
  nl: "Over de Rivier"
  cs: "Zaříčí"
body:
  en:
    - "Beyond the River is not a city but a province: in Aramaic Abar-Nahara, in Akkadian Eber-Nari, “across the river”, the lands west of the Euphrates as seen from Mesopotamia. Assyrian scribes used the phrase for Syria and Palestine; the Persians made it an official name. Under Darius I the whole stretch from Babylon to the Egyptian border was one satrapy, “Babylon and Across-the-River”, still so in 486 BC; under Xerxes, probably after the Babylonian revolts of 484 and 482, the western part became a province of its own, running from the Euphrates to the frontier of Egypt and including Syria, Phoenicia, Palestine and Cyprus. Herodotus counts the same lands as the fifth tax district, paying 350 talents a year. Its governors are known from cuneiform tablets: Tattenai, who questioned the Jews in Jerusalem, is named as governor of Across-the-River in a Babylonian text of 502 BC."
    - "In Ezra the name belongs to the enemies of Jerusalem. The officials of Samaria and “the rest that are on this side the river” wrote to Artaxerxes that if the city were rebuilt “thou shalt have no portion on this side the river”; the king stopped the work. When the Temple was being built under Darius, “Tatnai, governor on this side the river”, came and asked who had authorised it; the king's answer, after the decree of Cyrus was found at Ecbatana, was “be ye far from thence”, and the governor “did speedily” as he was told. Artaxerxes later ordered “all the treasurers which are beyond the river” to supply Ezra and told Ezra to appoint judges for “all the people that are beyond the river” who knew the law of his God."
    - "Nehemiah asked the same king for letters “to the governors beyond the river, that they may convey me over till I come into Judah”, and delivered them with an escort of horsemen. In the list of those who repaired the wall, the men of Gibeon and Mizpah worked “unto the throne of the governor on this side the river”, which suggests that the governor had a seat in Jerusalem. The same phrase is used from the other bank: Solomon ruled “all the region on this side the river, from Tiphsah even to Azzah”, and Joshua reminded Israel that their fathers had served other gods “on the other side of the flood”."
    - "After Alexander the province was broken up, and the name went out of use; the Seleucids spoke of Coele-Syria and Phoenicia. The region it covered is today Syria, Lebanon, Israel, the Palestinian territories, Jordan and Cyprus."
  ru:
    - "Заречье — не город, а провинция: по-арамейски Авар-Нахара, по-аккадски Эбер-Нари, «по ту сторону реки», земли к западу от Евфрата, если смотреть из Месопотамии. Ассирийские писцы называли так Сирию и Палестину, а Персы сделали это слово официальным именем. При Дарии I вся полоса от Вавилона до границы Египта была одной сатрапией — «Вавилон и Заречье», и так было ещё в 486 г. до н. э.; при Ксерксе, вероятно после вавилонских восстаний 484 и 482 гг., западная часть стала отдельной провинцией от Евфрата до рубежей Египта, включая Сирию, Финикию, Палестину и Кипр. Геродот описывает ту же территорию как пятый податной округ державы, плативший 350 талантов в год. Её наместники известны по клинописным табличкам: Фафнай, допрашивавший Иудеев в Иерусалиме, назван заречным областеначальником в вавилонском тексте 502 г. до н. э."
    - "В книге Ездры это имя принадлежит врагам Иерусалима. Чиновники Самарии и народов, поселённых «в прочих городах за рекою», написали Артаксерксу, что если город будет достроен, то «не будет у тебя владения за рекою»; царь остановил работы. Когда при Дарии строился Храм, пришёл «Фафнай, заречный областеначальник» и спросил, кто разрешил строить; ответ царя, после того как в Екбатане нашли указ Кира, был «удалитесь оттуда», и наместник, «как повелел царь Дарий, так в точности» и сделал. Позже Артаксеркс велел «всем сокровищехранителям, которые за рекою», снабжать Ездру и поручил Ездре поставить судей, «чтоб они судили весь народ за рекою», знающий закон его Бога."
    - "Неемия просил у того же царя письма «к заречным областеначальникам, чтоб они давали мне пропуск, доколе я не дойду до Иудеи», и вручил их под охраной всадников. В списке чинивших стену жители Гаваона и Мицфы названы «подвластными заречному областеначальнику», и это наводит на мысль, что у наместника было место в Иерусалиме. То же выражение звучит и с другого берега: Соломон владычествовал «над всею землею по эту сторону реки, от Типсаха до Газы», а Иисус Навин напоминал Израилю, что их отцы служили иным богам «за рекою»."
    - "После Александра провинцию раздробили, и имя вышло из употребления; Селевкиды говорили о Келесирии и Финикии. Земли, которые она охватывала, — это сегодня Сирия, Ливан, Израиль, палестинские территории, Иордания и Кипр."
  uk:
    - "Заріччя — це не місто, а провінція: арамейською Абар-Нахара, акадською Ебер-Нарі, «по той бік річки», тобто землі на захід від Євфрату, якими вони виглядали з Месопотамії. Ассирійські писарі вживали цей вислів для Сирії та Палестини; перси зробили його офіційною назвою. За Дарія I весь простір від Вавилона до єгипетського кордону був однією сатрапією, «Вавилон і Заріччя», і ще такою в 486 р. до н. е.; за Ксеркса, імовірно після вавилонських повстань 484 і 482 рр., західна частина стала окремою провінцією, що тягнулася від Євфрату до межі Єгипту й охоплювала Сирію, Фінікію, Палестину та Кіпр. Геродот зараховує ті самі землі до п'ятого податкового округу, що платив 350 талантів на рік. Її намісників знаємо з клинописних табличок: Фафнай, який допитував юдеїв у Єрусалимі, названий намісником Заріччя у вавилонському тексті 502 р. до н. е."
    - "У Книзі Ездри ця назва належить ворогам Єрусалима. Урядовці Самарії та решта тих, хто жив «по инших містах на заріччі», написали Артаксерксові, що коли місто буде відбудоване, то «не буде в тебе держави за рікою»; цар зупинив роботу. Коли за Дарія будували храм, прийшов Фафнай, «князь зарічний», і спитав, хто дозволив це робити; відповідь царя, після того як указ Кіра знайшли в Екбатані, була: «уступітесь звідтіля», і намісник швидко зробив, як йому наказали. Артаксеркс пізніше наказав «усїм скарбівничим, що за рікою» постачати Ездру й велів Ездрі настановити суддів, щоб вони судили «ввесь народ за рікою», тих, хто знає закон його Бога."
    - "Неемія попросив у того самого царя листи «до зарічних начальників краєвих, щоб давали менї пропуст, доки я не дійду до Юдеї», і вручив їх, прибувши з охороною вершників. У списку тих, хто ремонтував мур, гаваонці й міцпійці працювали аж до престолу намісника Заріччя, а це дає підстави думати, що в Єрусалимі намісник мав резиденцію. Той самий вислів уживають і з протилежного берега: Соломон панував «над усією землею по тім боцї ріки, від Типсаха до Гази», а Ісус Навин нагадав Ізраїлеві, що їхні предки служили іншим богам «по тім боцї Евфрату»."
    - "Після Александра провінцію було розбито, і назва вийшла з ужитку; Селевкіди говорили про Келесирію та Фінікію. Область, яку вона охоплювала, — це сьогодні Сирія, Ліван, Ізраїль, палестинські території, Йорданія та Кіпр."
  es:
    - "Más allá del Río no es ciudad sino provincia: en arameo Abar-Nahara, en acadio Eber-Nari, «al otro lado del río», las tierras al oeste del Éufrates vistas desde Mesopotamia. Los escribas asirios la usaron para Siria y Palestina; los persas, como nombre oficial. Bajo Darío I todo el territorio entre Babilonia y Egipto formaba una satrapía, «Babilonia y Más allá del Río», aún así en el 486 a. C.; bajo Jerjes, probablemente tras las revueltas babilónicas del 484 y el 482, la parte occidental pasó a ser provincia propia, del Éufrates a la frontera de Egipto, con Siria, Fenicia, Palestina y Chipre. Heródoto cuenta esas tierras como el quinto distrito tributario, que pagaba 350 talentos anuales. Sus gobernadores constan en tablillas cuneiformes: Tatnai, que interrogó a los judíos en Jerusalén, figura como gobernador de Más allá del Río en un texto babilónico del 502 a. C."
    - "En Esdras el nombre pertenece a los enemigos de Jerusalén. Los funcionarios de Samaria y «los demás de la otra parte del río» escribieron a Artajerjes que, si la ciudad era reedificada, «la parte allá del río no será tuya»; el rey detuvo la obra. Cuando se construía el Templo bajo Darío, «Tatnai, capitán de la parte allá del río», fue a preguntar quién lo había autorizado; la respuesta del rey, tras hallarse el decreto de Ciro en Ecbatana, fue «apartaos de ahí», y el gobernador hizo «prestamente» lo que se le ordenó. Más tarde Artajerjes mandó «á todos los tesoreros que están al otro lado del río» que proveyeran a Esdras, y ordenó a Esdras que pusiera jueces para «todo el pueblo que está del otro lado del río» que conociera la ley de su Dios."
    - "Nehemías pidió al mismo rey cartas «para los gobernadores de la otra parte del río, que me franqueen el paso hasta que llegue á Judá», y las entregó con una escolta de jinetes. En la lista de quienes repararon el muro, los hombres de Gabaón y de Mizpa trabajaron «por la silla del gobernador de la otra parte del río», lo que sugiere que el gobernador tenía una sede en Jerusalén. La misma expresión se usa desde la otra orilla: Salomón señoreaba «en toda la región que estaba de la otra parte del río, desde Tiphsa hasta Gaza», y Josué recordó a Israel que sus padres habían servido a otros dioses «de esotra parte del río»."
    - "Tras Alejandro, la provincia se fragmentó y el nombre cayó en desuso; los seléucidas hablaban de Celesiria y Fenicia. La región que abarcaba es hoy Siria, el Líbano, Israel, los territorios palestinos, Jordania y Chipre."
  pt:
    - "Além do Rio não é uma cidade, mas uma província: em aramaico Abar-Nahara, em acádico Eber-Nari, “do outro lado do rio”, as terras a oeste do Eufrates, vistas da Mesopotâmia. Os assírios a usavam para a Síria e a Palestina; os persas a tornaram nome oficial. Sob Dario I, toda a extensão da Babilônia até a fronteira do Egito formava uma só satrapia, “Babilônia e Além do Rio”, ainda assim em 486 a.C.; sob Xerxes, provavelmente após as revoltas babilônicas de 484 e 482, a parte ocidental tornou-se uma província separada, que ia do Eufrates à fronteira do Egito e incluía a Síria, a Fenícia, a Palestina e Chipre. Heródoto as conta como o quinto distrito tributário, com 350 talentos por ano. Seus governadores são conhecidos por tabuinhas cuneiformes: Tatenai, que interrogou os judeus em Jerusalém, é nomeado governador de Além do Rio num texto babilônico de 502 a.C."
    - "Em Esdras, o nome pertence aos inimigos de Jerusalém. Os oficiais de Samaria e “o restante da região além do Rio” escreveram a Artaxerxes que, se a cidade fosse reconstruída, “você não terá nenhuma posse além do Rio”; o rei suspendeu a obra. Quando o Templo era construído sob Dario, “Tatenai, o governador do outro lado do Rio”, veio e perguntou quem o havia autorizado; a resposta do rei, depois de achado o decreto de Ciro em Ecbatana, foi que ficassem “longe de lá”, e o governador agiu “com toda a diligência”, como lhe foi ordenado. Artaxerxes ordenou mais tarde a “todos os tesoureiros que estão do outro lado do Rio” que fornecessem o necessário a Esdras, e mandou Esdras nomear juízes para “todo o povo que está do outro lado do Rio” e que conhecia a lei do seu Deus."
    - "Neemias pediu ao mesmo rei cartas “para os governadores do outro lado do Rio, para que me deixem passar até que eu chegue a Judá”, e as entregou com uma escolta de cavaleiros. Na lista dos que repararam o muro, os homens de Gibeão e de Mispá repararam “a residência do governador do outro lado do Rio”, o que sugere que o governador tinha uma sede em Jerusalém. A mesma expressão é usada a partir da outra margem: Salomão dominava “tudo deste lado do Rio, desde Tifsa até Gaza”, e Josué lembrou a Israel que seus antepassados haviam servido a outros deuses “além do Rio”."
    - "Depois de Alexandre, a província foi desmembrada, e o nome caiu em desuso; os selêucidas falavam de Celessíria e Fenícia. A região que ela cobria é hoje a Síria, o Líbano, Israel, os territórios palestinos, a Jordânia e Chipre."
  de:
    - "Jenseits des Stroms ist keine Stadt, sondern eine Provinz: aramäisch Abar-Nahara, akkadisch Eber-Nari, „jenseits des Flusses“, die Länder westlich des Euphrat aus mesopotamischer Sicht. Assyrische Schreiber gebrauchten sie für Syrien und Palästina, die Perser als amtlichen Namen. Unter Darius I. bildete alles von Babylon bis zur ägyptischen Grenze eine Satrapie, „Babylon und Jenseits des Stroms“, noch 486 v. Chr.; unter Xerxes, wohl nach den babylonischen Aufständen von 484 und 482, wurde der Westteil eine eigene Provinz vom Euphrat bis Ägypten mit Syrien, Phönizien, Palästina und Zypern. Herodot zählt dieselben Länder als fünften Steuerbezirk mit 350 Talenten jährlich. Statthalter sind aus Keilschrifttafeln bekannt: Tattenai, der die Juden in Jerusalem befragte, steht 502 v. Chr. in einem babylonischen Text als Statthalter von Jenseits des Stroms."
    - "Im Buch Esra gehört der Name den Feinden Jerusalems. Die Beamten Samarias und „die andern … diesseits des Wassers“ schrieben an Artaxerxes, wenn die Stadt gebaut und ihre Mauern gemacht würden, „so wirst du vor ihr nichts behalten diesseits des Wassers“; der König ließ das Werk einstellen. Als der Tempel unter Darius gebaut wurde, kam „Thathnai, der Landpfleger diesseits des Wassers“, und fragte, wer es erlaubt habe; die Antwort des Königs, nachdem das Dekret des Kyrus in Ekbatana gefunden worden war, lautete: „So haltet euch nun fern von ihnen“, und der Statthalter tat, wie ihm gesagt war, mit Eifer. Artaxerxes befahl später „den Schatzmeistern jenseit des Wassers“, Esra zu versorgen, und trug Esra auf, für „alles Volk … das jenseit des Wassers ist“, soweit es das Gesetz seines Gottes kannte, Richter einzusetzen."
    - "Nehemia bat denselben König um Briefe „an die Landpfleger jenseit des Wassers, daß sie mich hinübergeleiten, bis ich komme nach Juda“, und übergab sie mit einem Geleit von Reitern. In der Liste derer, die die Mauer ausbesserten, arbeiteten die Männer von Gibeon und Mizpa „am Stuhl des Landpflegers diesseit des Wassers“, was darauf hindeutet, dass der Statthalter einen Sitz in Jerusalem hatte. Dieselbe Wendung wird vom anderen Ufer aus gebraucht: Salomo herrschte „im ganzen Lande diesseit des Stromes, von Tiphsah bis gen Gaza“, und Josua erinnerte Israel daran, dass seine Väter „jenseit des Stroms“ anderen Göttern gedient hatten."
    - "Nach Alexander wurde die Provinz aufgeteilt, und der Name kam außer Gebrauch; die Seleukiden sprachen von Koilesyrien und Phönizien. Das Gebiet, das sie umfasste, bilden heute Syrien, der Libanon, Israel, die palästinensischen Gebiete, Jordanien und Zypern."
  fr:
    - "Au-delà du fleuve n’est pas une ville mais une province : araméen Abar-Nahara, akkadien Eber-Nari, « de l’autre côté du fleuve », les terres à l’ouest de l’Euphrate vues de Mésopotamie. Les scribes assyriens l’employaient pour la Syrie et la Palestine ; les Perses en firent un nom officiel. Sous Darius Ier, tout l’espace de Babylone à l’Égypte formait une seule satrapie, « Babylone et Au-delà du fleuve », encore en 486 av. J.-C. ; sous Xerxès, probablement après les révoltes de Babylone en 484 et 482, la partie ouest devint une province à part, de l’Euphrate à l’Égypte, avec la Syrie, la Phénicie, la Palestine et Chypre. Hérodote en fait le cinquième district fiscal (350 talents par an). Des tablettes cunéiformes nomment ses gouverneurs : Thathnaï, qui interrogea les Juifs à Jérusalem, est dit gouverneur d’Au-delà-du-fleuve dans un texte babylonien de 502 av. J.-C."
    - "Dans Esdras, le nom appartient aux ennemis de Jérusalem. Les fonctionnaires de Samarie et des autres lieux de ce côté du fleuve écrivirent à Artaxerxès que, si la ville était rebâtie, « tu n’auras plus de possession de ce côté du fleuve » ; le roi fit arrêter les travaux. Quand le Temple se bâtissait sous Darius, « Thathnaï, gouverneur de ce côté du fleuve » vint demander qui l’avait autorisé ; la réponse du roi, après la découverte du décret de Cyrus à Ecbatane, fut « tenez-vous loin de ce lieu », et le gouverneur se conforma ponctuellement à l’ordre reçu. Artaxerxès ordonna plus tard à « tous les trésoriers de l’autre côté du fleuve » de pourvoir Esdras et lui dit d’établir des juges pour « tout le peuple de l’autre côté du fleuve » qui connaissait la loi de son Dieu."
    - "Néhémie demanda au même roi « des lettres pour les gouverneurs de l’autre côté du fleuve, afin qu’ils me laissent passer et entrer en Juda », et les remit avec une escorte de cavaliers. Dans la liste de ceux qui réparèrent la muraille, les hommes de Gabaon et de Mitspa travaillèrent, « ressortissant au siège du gouverneur de ce côté du fleuve », ce qui laisse penser que le gouverneur avait un siège à Jérusalem. La même expression est employée depuis l’autre rive : Salomon dominait sur « tout le pays de l’autre côté du fleuve, depuis Thiphsach jusqu’à Gaza », et Josué rappela à Israël que leurs pères avaient servi d’autres dieux « de l’autre côté du fleuve »."
    - "Après Alexandre, la province fut démembrée et le nom tomba en désuétude ; les Séleucides parlaient de Cœlé-Syrie et de Phénicie. La région qu’elle couvrait correspond aujourd’hui à la Syrie, au Liban, à Israël, aux territoires palestiniens, à la Jordanie et à Chypre."
  it:
    - "Oltre il Fiume non è una città ma una provincia: in aramaico Abar-Nahara, in accadico Eber-Nari, «al di là del fiume», le terre a ovest dell’Eufrate viste dalla Mesopotamia. Gli scribi assiri la usavano per Siria e Palestina; i Persiani ne fecero un nome ufficiale. Sotto Dario I l’intera distesa da Babilonia al confine egiziano costituiva un’unica satrapia, «Babilonia e Oltre il Fiume», ancora nel 486 a.C.; sotto Serse, forse dopo le rivolte babilonesi del 484 e del 482, la parte occidentale divenne provincia a sé, dall’Eufrate alla frontiera d’Egitto, con Siria, Fenicia, Palestina e Cipro. Erodoto conta le stesse terre come quinto distretto fiscale, che pagava 350 talenti l’anno. Dei governatori parlano tavolette cuneiformi: Tattenai, che interrogò i Giudei a Gerusalemme, figura come governatore di Oltre il Fiume in un testo babilonese del 502 a.C."
    - "In Esdra il nome appartiene ai nemici di Gerusalemme. I funzionari di Samaria e «gli altri che stanno di là dal fiume» scrissero ad Artaserse che, se la città fosse stata ricostruita, «tu non avrai più possessi da questo lato del fiume»; il re fece sospendere i lavori. Quando il Tempio veniva costruito sotto Dario, «Tattenai, governatore d’oltre il fiume» venne a chiedere chi lo avesse autorizzato; la risposta del re, dopo che il decreto di Ciro fu trovato a Ecbatana, fu «statevene lontani da quel luogo», e il governatore e i suoi colleghi «eseguirono puntualmente» gli ordini ricevuti. Artaserse ordinò poi «a tutti i tesorieri d’oltre il fiume» di provvedere a Esdra e disse a Esdra di stabilire giudici per «tutto il popolo d’oltre il fiume» che conoscesse la legge del suo Dio."
    - "Neemia chiese allo stesso re delle lettere «per i governatori d’oltre il fiume affinché mi lascino passare ed entrare in Giuda», e le consegnò con una scorta di cavalieri. Nell’elenco di quelli che riparavano le mura, gli uomini di Gabaon e di Mizpa, «che dipendevano dalla sede del governatore d’oltre il fiume», lavorarono alle riparazioni, il che suggerisce che il governatore avesse una sede a Gerusalemme. La stessa espressione è usata dall’altra sponda: Salomone dominava su «tutto il paese di qua dal fiume, da Tifsa fino a Gaza», e Giosuè ricordò a Israele che i loro padri avevano servito altri dèi «di là dal fiume»."
    - "Dopo Alessandro la provincia fu smembrata e il nome cadde in disuso; i Seleucidi parlavano di Celesiria e Fenicia. La regione che comprendeva è oggi la Siria, il Libano, Israele, i territori palestinesi, la Giordania e Cipro."
  pl:
    - "Zarzecze to nie miasto, lecz prowincja: po aramejsku Abar-Nahara, po akadyjsku Eber-Nari, „za rzeką”, czyli ziemie na zachód od Eufratu widziane z Mezopotamii. Skrybowie asyryjscy używali tego wyrażenia na określenie Syrii i Palestyny; Persowie uczynili z niego nazwę urzędową. Za Dariusza I cały obszar od Babilonu do granicy egipskiej stanowił jedną satrapię, „Babilon i Zarzecze”, jeszcze w 486 r. p.n.e.; za Kserksesa, prawdopodobnie po powstaniach babilońskich z 484 i 482 r., część zachodnia stała się odrębną prowincją, od Eufratu do granicy Egiptu, obejmującą Syrię, Fenicję, Palestynę i Cypr. Herodot zalicza te same ziemie do piątego okręgu podatkowego, płacącego 350 talentów rocznie. Jej namiestnicy są znani z tabliczek klinowych: Tatnaj, który wypytywał Żydów w Jerozolimie, figuruje jako namiestnik Zarzecza w tekście babilońskim z 502 r. p.n.e."
    - "W Księdze Ezdrasza nazwa ta należy do wrogów Jerozolimy. Urzędnicy Samarii i „inni, którzy byli za rzeką” pisali do Artakserksesa, że jeśli miasto zostanie odbudowane, „ta część za rzeką nie będzie twoja”; król wstrzymał prace. Gdy za Dariusza budowano świątynię, przyszedł „Tattenaj, starosta za rzeką”, i zapytał, kto na to pozwolił; odpowiedź króla, po znalezieniu dekretu Cyrusa w Ekbatanie, brzmiała „ustąpcie stamtąd”, a starosta uczynił, jak mu rozkazano, „bez omieszkania”. Artakserkses rozkazał później „wszystkim podskarbim, którzyście za rzeką”, aby zaopatrzyli Ezdrasza, i polecił Ezdraszowi ustanowić sędziów, aby sądzili „wszystek lud, który jest za rzeką”, czyli wszystkich znających prawo jego Boga."
    - "Nehemiasz poprosił tego samego króla o listy „do starostów za rzeką, aby mię przeprowadzili, ażbym przyszedł do ziemi Judzkiej”, i doręczył je z eskortą jezdnych. W wykazie tych, którzy naprawiali mur, mężowie z Gibeonu i Mispy pracowali „aż do stolicy książęcej, z tej strony rzeki”, co sugeruje, że namiestnik miał siedzibę w Jerozolimie. Tego samego wyrażenia używa się z drugiego brzegu: Salomon panował „wszędy z tej strony rzeki od Tasfa aż do Gazy”, a Jozue przypomniał Izraelowi, że jego ojcowie służyli innym bogom „za rzeką”."
    - "Po Aleksandrze prowincję rozbito i nazwa wyszła z użycia; Seleucydzi mówili o Celesyrii i Fenicji. Obszar, który obejmowała, to dziś Syria, Liban, Izrael, terytoria palestyńskie, Jordania i Cypr."
  nl:
    - "Over de Rivier is geen stad maar een provincie: in het Aramees Abar-Nahara, in het Akkadisch Eber-Nari, “aan gene zijde van de rivier”, de landen ten westen van de Eufraat gezien vanuit Mesopotamië. Assyrische schrijvers bedoelden ermee Syrië en Palestina; de Perzen maakten het een officiële naam. Onder Darius I vormde het hele gebied van Babylon tot de Egyptische grens één satrapie, “Babylon en Over-de-Rivier”, nog in 486 v.Chr.; onder Xerxes, waarschijnlijk na de Babylonische opstanden van 484 en 482, werd het westen een eigen provincie van de Eufraat tot de grens van Egypte, met Syrië, Fenicië, Palestina en Cyprus. Herodotus rekent ze tot het vijfde belastingdistrict (350 talenten per jaar). Gouverneurs kent men uit spijkerschrift: Tattenai, die de Joden in Jeruzalem ondervroeg, heet in een Babylonische tekst van 502 v.Chr. gouverneur van Over-de-Rivier."
    - "In Ezra behoort de naam toe aan de vijanden van Jeruzalem. De ambtenaren van Samaria en “de overigen, aan deze zijde der rivier” schreven aan Artaxerxes dat als de stad werd herbouwd “gij daardoor geen deel zult hebben aan deze zijde der rivier”; de koning liet het werk stilleggen. Toen onder Darius de tempel werd gebouwd, kwam “Thathnai, de landvoogd aan deze zijde der rivier” vragen wie dat had toegestaan; het antwoord van de koning, nadat het besluit van Cyrus in Ekbatana was gevonden, was “weest verre van daar”, en de landvoogd deed “spoediglijk alzo”, zoals hem was opgedragen. Artaxerxes beval later “alle schatmeesters, die aan gene zijde der rivier zijt” Ezra te voorzien, en droeg Ezra op rechters aan te stellen voor “al het volk … dat aan gene zijde der rivier is” en dat de wet van zijn God kende."
    - "Nehemia vroeg dezelfde koning om brieven “aan de landvoogden aan gene zijde der rivier, dat zij mij overgeleiden, totdat ik in Juda zal gekomen zijn”, en overhandigde ze met een escorte van ruiters. In de lijst van hen die de muur herstelden, werkten de mannen van Gibeon en Mizpa “tot aan den stoel des landvoogds aan deze zijde der rivier”, wat erop wijst dat de gouverneur een zetel in Jeruzalem had. Dezelfde uitdrukking wordt vanaf de andere oever gebruikt: Salomo had heerschappij over “al wat op deze zijde der rivier was van Thifsah tot aan Gaza”, en Jozua herinnerde Israël eraan dat hun vaders andere goden hadden gediend “over gene zijde der rivier”."
    - "Na Alexander werd de provincie opgebroken en raakte de naam in onbruik; de Seleuciden spraken van Coele-Syrië en Fenicië. Het gebied dat zij omvatte is tegenwoordig Syrië, Libanon, Israël, de Palestijnse gebieden, Jordanië en Cyprus."
  cs:
    - "Zaříčí není město, ale provincie: aramejsky Abar-Nahara, akkadsky Eber-Nari, „za řekou“, tedy země západně od Eufratu, jak je viděli z Mezopotámie. Asyrští písaři užívali tohoto výrazu pro Sýrii a Palestinu; Peršané z něj učinili úřední název. Za Dareia I. tvořil celý pás od Babylóna k egyptské hranici jedinou satrapii, „Babylón a Zaříčí“, tak ještě roku 486 př. n. l.; za Xerxa, pravděpodobně po babylónských povstáních let 484 a 482, se západní část stala samostatnou provincií sahající od Eufratu k hranici Egypta a zahrnující Sýrii, Fénicii, Palestinu a Kypr. Hérodotos počítá tytéž země jako pátý daňový okres platící 350 talentů ročně. Jeho správci jsou známi z klínopisných tabulek: Tatnaj, který vyslýchal Židy v Jeruzalémě, je jmenován jako správce Zaříčí v babylónském textu z roku 502 př. n. l."
    - "V knize Ezdrášově patří tento název nepřátelům Jeruzaléma. Úředníci Samaří a „jiní za řekou“ napsali Artaxerxovi, že bude-li město vystaveno, „vládařství za řekou míti nebudeš“; král práce zastavil. Když se za Dareia stavěl chrám, přišel „Tattenai, vývoda za řekou“ a ptal se, kdo to povolil; králova odpověď, poté co byl v Ekbatanech nalezen Kýrův výnos, zněla „ustupte odtud“ a správce učinil, jak mu bylo řečeno, „bez meškání“. Artaxerxes později nařídil „všechněm výběrčím, kteříž jste za řekou“, aby Ezdráše zásobovali, a Ezdrášovi uložil ustanovit soudce pro „všecken lid, jenž jest za řekou“, kdo znají zákon jeho Boha."
    - "Nehemjáš požádal téhož krále o listy „k vývodám za řekou, aby mne provedli, až bych přišel do Judstva“, a odevzdal je s doprovodem jezdců. V seznamu těch, kdo opravovali zeď, pracovali muži z Gibeonu a Micpy „až k stolici knížecí z této strany řeky“, což nasvědčuje tomu, že měl správce v Jeruzalémě sídlo. Stejný obrat se užívá i z druhého břehu: Šalomoun panoval „s této strany řeky od Tipsach až do Gázy“ a Jozue připomněl Izraeli, že jeho otcové sloužili cizím bohům „za řekou“."
    - "Po Alexandrovi byla provincie rozdělena a název vyšel z užívání; Seleukovci mluvili o Koilé Sýrii a Fénicii. Oblast, kterou zahrnovala, je dnes Sýrie, Libanon, Izrael, palestinská území, Jordánsko a Kypr."
