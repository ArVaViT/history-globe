body:
  en:
    - "The Gihon is the second of the four rivers that flowed out of Eden: “And the name of the second river is Gihon: the same is it that compasseth the whole land of Ethiopia.” The Hebrew has Cush, which the King James Version renders as Ethiopia and the Russian Synodal Bible keeps as Cush. The same name belongs to the spring below the City of David in Jerusalem, a different place; the river of Eden is named only here."
    - "Because Cush usually means the land south of Egypt, Josephus identified the Gihon with the Nile, and Ethiopian tradition sees it in the Abay, the Blue Nile. Juris Zarins, placing Eden at the head of the Persian Gulf, took the Gihon for the Karun in south-western Iran and Cush for the land of the Kassites. Medieval Muslim geographers called the Amu Darya of Central Asia the Jayhun, a form of the name Gihon, and some later writers identified it with the river of Eden. None of these identifications can be proved."
  ru:
    - "Гихон — вторая из четырёх рек, выходивших из Эдема: «Имя второй реки Гихон (Геон): она обтекает всю землю Куш». В еврейском тексте стоит Куш; английская Библия короля Якова передаёт это как Эфиопия, а Синодальный перевод сохраняет Куш. То же имя носит источник под Городом Давида в Иерусалиме — другое место; река Эдема названа только здесь."
    - "Поскольку Куш обычно означает землю к югу от Египта, Иосиф Флавий отождествил Гихон с Нилом, а эфиопское предание видит его в Аббае, Голубом Ниле. Юрис Заринс, помещавший Эдем у вершины Персидского залива, считал Гихон рекой Карун на юго-западе Ирана, а Куш — землёй касситов. Средневековые мусульманские географы называли Амударью в Средней Азии Джейхуном — формой имени Гихон, и некоторые позднейшие авторы отождествляли её с рекой Эдема. Ни одно из этих отождествлений нельзя доказать."
  uk:
    - "Гіхон — друга з чотирьох річок, що витікали з Едену: «А друга річка зветься Гигон; ся обтекає всю Куш землю». Єврейський текст має Куш, який Біблія короля Якова передає як Ефіопія, а російська Синодальна Біблія зберігає як Куш. Таку саму назву має джерело під Містом Давида в Єрусалимі, інше місце; едемська річка названа лише тут."
    - "Оскільки Куш зазвичай означає землю на південь від Єгипту, Йосиф Флавій ототожнював Гіхон з Нілом, а ефіопська традиція бачить його в Абаї, Блакитному Нілі. Джуріс Зарінс, розміщуючи Еден у верхів'ї Перської затоки, вважав Гіхон Каруном на південному заході Ірану, а Куш — країною касітів. Середньовічні мусульманські географи називали Амудар'ю Середньої Азії Джайхун, формою назви Гіхон, і деякі пізніші автори ототожнювали її з річкою Едену. Жодне з цих ототожнень не можна довести."
  es:
    - "El Gihón es el segundo de los cuatro ríos que salían del Edén: «El nombre del segundo río es Gihón: éste es el que rodea toda la tierra de Etiopía». El hebreo tiene Cus, que la versión King James traduce Etiopía y la Biblia sinodal rusa conserva como Cus. El mismo nombre corresponde al manantial bajo la Ciudad de David, en Jerusalén, que es otro lugar; el río del Edén se nombra solo aquí."
    - "Como Cus suele significar la tierra al sur de Egipto, Josefo identificó el Gihón con el Nilo, y la tradición etíope lo ve en el Abay, el Nilo Azul. Juris Zarins, que sitúa el Edén en la cabecera del golfo Pérsico, tomó el Gihón por el Karun, en el suroeste de Irán, y Cus por el país de los casitas. Los geógrafos musulmanes medievales llamaron Jayhun, forma del nombre Gihón, al Amu Daria de Asia Central, y algunos autores posteriores lo identificaron con el río del Edén. Ninguna de estas identificaciones puede probarse."
  pt:
    - "O Giom é o segundo dos quatro rios que saíam do Éden: “O nome do segundo rio é Giom. É o mesmo rio que flui por toda a terra de Cuxe.” O hebraico traz Cuxe, que a Versão King James traduz por Etiópia e a Bíblia sinodal russa conserva como Cuxe. O mesmo nome pertence à nascente abaixo da Cidade de Davi, em Jerusalém, um lugar diferente; o rio do Éden é nomeado somente aqui."
    - "Como Cuxe costuma significar a terra ao sul do Egito, Josefo identificou o Giom com o Nilo, e a tradição etíope o vê no Abay, o Nilo Azul. Juris Zarins, situando o Éden na cabeceira do golfo Pérsico, tomou o Giom pelo Karun, no sudoeste do Irã, e Cuxe pela terra dos cassitas. Geógrafos muçulmanos medievais chamavam de Jayhun, forma do nome Giom, o Amu Dária da Ásia Central, e alguns autores posteriores o identificaram com o rio do Éden. Nenhuma dessas identificações pode ser provada."
  de:
    - "Der Gihon ist der zweite der vier Flüsse, die aus Eden hinausflossen: „Das andere Wasser heißt Gihon“, es umfließt das ganze Land Kusch. Das Hebräische hat Kusch, das die King-James-Bibel mit Ethiopia wiedergibt und die russische Synodalbibel als Kusch beibehält. Denselben Namen trägt die Quelle unterhalb der Davidsstadt in Jerusalem, ein anderer Ort; der Fluss Edens wird nur hier genannt."
    - "Weil Kusch gewöhnlich das Land südlich von Ägypten bedeutet, setzte Josephus den Gihon mit dem Nil gleich, und die äthiopische Überlieferung sieht ihn im Abay, dem Blauen Nil. Juris Zarins, der Eden am Kopf des Persischen Golfs ansetzte, hielt den Gihon für den Karun im Südwesten Irans und Kusch für das Land der Kassiten. Mittelalterliche muslimische Geographen nannten den Amu Darja Zentralasiens den Dschaihun, eine Form des Namens Gihon, und manche spätere Autoren setzten ihn mit dem Fluss Edens gleich. Keine dieser Gleichsetzungen lässt sich beweisen."
  fr:
    - "Le Guihon est le deuxième des quatre fleuves qui sortaient d’Éden : « Le nom du second fleuve est Guihon ; c’est celui qui entoure tout le pays de Cusch. » L’hébreu porte Cush, que la version du roi Jacques rend par Éthiopie et que Louis Segond et la Bible synodale russe gardent sous la forme Cusch. Le même nom appartient à la source au pied de la cité de David à Jérusalem, lieu différent ; le fleuve d’Éden n’est nommé qu’ici."
    - "Comme Cush désigne d’ordinaire le pays au sud de l’Égypte, Josèphe identifia le Guihon au Nil, et la tradition éthiopienne le voit dans l’Abay, le Nil Bleu. Juris Zarins, plaçant Éden à la tête du golfe Persique, tint le Guihon pour le Karoun, dans le sud-ouest de l’Iran, et Cush pour le pays des Kassites. Les géographes musulmans médiévaux appelèrent Jayhun l’Amou-Daria d’Asie centrale, forme du nom Guihon, et certains auteurs plus tardifs l’identifièrent avec le fleuve d’Éden. Aucune de ces identifications ne peut être prouvée."
  it:
    - "Il Ghicon è il secondo dei quattro fiumi che uscivano dall’Eden: «Il nome del secondo fiume è Ghihon, ed è quello che circonda tutto il paese di Cush». La King James Version rende l’ebraico Cush come Etiopia, mentre la Bibbia sinodale russa lo conserva come Cush. Lo stesso nome appartiene alla sorgente sotto la Città di Davide a Gerusalemme, un luogo diverso; il fiume dell’Eden è nominato solo qui."
    - "Poiché Cush significa di solito la terra a sud dell’Egitto, Giuseppe Flavio identificò il Ghicon con il Nilo, e la tradizione etiope lo vede nell’Abay, il Nilo Azzurro. Juris Zarins, collocando l’Eden all’estremità del Golfo Persico, ritenne il Ghicon il Karun nell’Iran sud-occidentale e Cush la terra dei Cassiti. I geografi musulmani medievali chiamarono Jayhun l’Amu Darya dell’Asia centrale, una forma del nome Ghicon, e alcuni scrittori posteriori lo identificarono con il fiume dell’Eden. Nessuna di queste identificazioni può essere provata."
  nl:
    - "De Gihon is de tweede van de vier rivieren die uit Eden stroomden: “En de naam der tweede rivier is Gihon; deze is het, die het ganse land Cusch omloopt.” Het Hebreeuws heeft Kus, dat de King James Version weergeeft als Ethiopia en de Russische Synodale Bijbel als Kus laat staan. Dezelfde naam draagt de bron onder de Stad van David in Jeruzalem, een andere plaats; de rivier van Eden wordt alleen hier genoemd."
    - "Omdat Kus gewoonlijk het land ten zuiden van Egypte betekent, vereenzelvigde Josephus de Gihon met de Nijl, en de Ethiopische overlevering ziet haar in de Abay, de Blauwe Nijl. Juris Zarins, die Eden aan het hoofd van de Perzische Golf plaatste, hield de Gihon voor de Karun in het zuidwesten van Iran en Kus voor het land van de Kassieten. Middeleeuwse moslimgeografen noemden de Amoe Darja van Centraal-Azië de Jayhun, een vorm van de naam Gihon, en sommige latere schrijvers vereenzelvigden die met de rivier van Eden. Geen van deze identificaties is te bewijzen."
  pl:
    - "Gichon jest drugą z czterech rzek, które wypływały z Edenu; według Księgi Rodzaju okrąża ona całą ziemię Etiopii, czyli Kusz. Hebrajski ma Kusz, co Biblia Króla Jakuba oddaje jako Etiopię, a rosyjska Biblia synodalna zachowuje jako Kusz. Tę samą nazwę nosi źródło poniżej Miasta Dawida w Jerozolimie, miejsce zupełnie inne; rzeka z Edenu jest wymieniona tylko tu."
    - "Ponieważ Kusz oznacza zwykle ziemię na południe od Egiptu, Józef Flawiusz utożsamił Gichon z Nilem, a tradycja etiopska widzi je w Abaj, Nilu Błękitnym. Juris Zarins, umieszczając Eden u wierzchołka Zatoki Perskiej, uznał Gichon za Karun w południowo-zachodnim Iranie, a Kusz za ziemię Kasytów. Średniowieczni geografowie muzułmańscy nazywali Amu-darię Azji Środkowej Dżajhun, formą nazwy Gichon, a niektórzy późniejsi autorzy utożsamiali ją z rzeką Edenu. Żadnego z tych utożsamień nie można udowodnić."
  cs:
    - "Gichón je druhá ze čtyř řek, které vytékaly z Edenu: „Jméno pak druhé řeky Gihon, ta obchází všecku zemi Chus.“ Hebrejština má Kúš, což Bible krále Jakuba překládá jako Etiopie a ruská synodální Bible ponechává jako Kúš. Totéž jméno nese pramen pod Městem Davidovým v Jeruzalémě, jiné místo; edenská řeka je jmenována jen zde."
    - "Protože Kúš obvykle znamená zemi jižně od Egypta, ztotožnil Josephus Flavius Gichón s Nilem a etiopská tradice v něm vidí Abbaj, Modrý Nil. Juris Zarins, který klade Eden do nejzazšího cípu Perského zálivu, pokládal Gichón za Karún v jihozápadním Íránu a Kúš za zemi Kassitů. Středověcí muslimští zeměpisci nazývali Amudarju ve Střední Asii Džajhún, podobou jména Gichón, a někteří pozdější autoři ji ztotožnili s řekou Edenu. Žádné z těchto ztotožnění nelze dokázat."
  sv:
    - "Gihon är den andra av de fyra floderna som flöt ut från Eden: ”Den andra floden heter Gihon; det är den som flyter omkring hela landet Kus.” Hebreiskan har Kush, som King James-bibeln återger som Etiopien och den ryska synodalbibeln behåller som Kush. Samma namn bär källan nedanför Davids stad i Jerusalem, en annan plats; Edens flod nämns bara här."
    - "Eftersom Kush oftast betyder landet söder om Egypten identifierade Josefus Gihon med Nilen, och den etiopiska traditionen ser den i Abay, Blå Nilen. Juris Zarins, som förlade Eden vid Persiska vikens inre del, tog Gihon för Karun i sydvästra Iran och Kush för kassiternas land. Medeltida muslimska geografer kallade Amu-Darja i Centralasien Jayhun, en form av namnet Gihon, och några senare skribenter identifierade den med Edens flod. Ingen av dessa identifieringar kan bevisas."
  nb:
    - "Gihon er den andre av de fire elvene som rant ut fra Eden: «Den annen elv heter Gihon; det er den som løper omkring hele landet Kus.» Det hebraiske har Kusj, som King James-oversettelsen gjengir som Etiopia og den russiske synodalbibelen beholder som Kusj. Det samme navnet tilhører kilden under Davidsbyen i Jerusalem, et annet sted; Edens elv er bare nevnt her."
    - "Fordi Kusj vanligvis betyr landet sør for Egypt, identifiserte Josefus Gihon med Nilen, og den etiopiske tradisjonen ser den i Abay, Den blå Nilen. Juris Zarins, som plasserer Eden ved Persiabuktas indre ende, tok Gihon for Karun i sørvestlige Iran og Kusj for kassittenes land. Middelalderens muslimske geografer kalte Amu-Darja i Sentral-Asia for Jayhun, en form av navnet Gihon, og noen senere forfattere identifiserte den med Edens elv. Ingen av disse identifikasjonene kan bevises."
  tl:
    - "Ang Gihon ang ikalawa sa apat na ilog na umaagos mula sa Eden: “At ang pangalan ng ikalawang ilog ay Gihon; na siyang lumiligid sa buong lupain ng Cush.” Cush ang nasa Hebreo, na isinasalin ng King James Version na Ethiopia at pinapanatili ng Bibliyang Sinodal na Cush. Ang parehong pangalan ay taglay ng bukal sa ibaba ng Bayan ni David sa Jerusalem, na ibang lugar; ang ilog ng Eden ay pinangalanan lamang dito."
    - "Dahil karaniwang tumutukoy ang Cush sa lupain sa timog ng Egipto, itinumbas ni Josephus ang Gihon sa Nilo, at nakikita ito ng tradisyong Etiope sa Abay, ang Asul na Nilo. Si Juris Zarins, na naglalagay sa Eden sa dulo ng Golpo ng Persia, ay itinuring ang Gihon na Karun sa timog-kanlurang Iran at ang Cush na lupain ng mga Kassite. Tinawag ng mga heograpong Muslim noong Gitnang Panahon ang Amu Darya ng Gitnang Asya na Jayhun, isang anyo ng pangalang Gihon, at itinumbas ito ng ilang kalaunang manunulat sa ilog ng Eden. Wala sa mga pagkakakilanlang ito ang mapapatunayan."
  da:
    - "Gihon er den anden af de fire floder, der udgik fra Eden: »Og den anden Flods Navn er Gihon, hvilken løber om det ganske Land Kus.« Det hebraiske har Kusj, som King James-oversættelsen gengiver som Etiopien, og den russiske synodalbibel bevarer som Kusj. Det samme navn bærer kilden under Davidsbyen i Jerusalem, et andet sted; Edens flod nævnes kun her."
    - "Fordi Kusj sædvanligvis betyder landet syd for Egypten, identificerede Josefus Gihon med Nilen, og den etiopiske tradition ser den i Abay, Den Blå Nil. Juris Zarins, der placerede Eden inderst i Den Persiske Golf, antog, at Gihon var Karun i det sydvestlige Iran og Kusj kassitternes land. Middelalderlige muslimske geografer kaldte Amu Darya i Centralasien for Jayhun, en form af navnet Gihon, og nogle senere forfattere identificerede den med Edens flod. Ingen af disse identifikationer kan bevises."
  sr:
    - "Гион је друга од четири реке које су истицале из Едена: „А другој је реци име Геон, она тече око целе земље хуске.“ Хебрејски има Хус, што превод краља Џејмса даје као Етиопију, а руски синодски превод чува као Хус. Исто име носи извор испод Давидовог града у Јерусалиму, друго место; река Едена именује се само овде."
    - "Пошто Хус обично значи земљу јужно од Египта, Јосиф Флавије је поистоветио Гион с Нилом, а етиопско предање види га у Абају, Плавом Нилу. Јурис Зарињс, смештајући Еден на врх Персијског залива, узео је Гион за Карун у југозападном Ирану, а Хус за земљу Касита. Средњовековни муслимански географи називали су Аму Дарју у Средњој Азији Џејхун, облик имена Гион, а неки каснији писци поистоветили су је с реком Едена. Ниједно од ових поистовећења не може се доказати."
  hu:
    - "A Gihon az Édenből kiinduló négy folyó közül a második: „A második folyóvíz neve pedig Gihon; ez az, a mely megkerüli az egész Khús földét.” A héberben Kús áll, amelyet a King James Version Etiópiának ad vissza, a szinodális orosz Biblia pedig Kúsnak hagy. Ugyanezt a nevet viseli a jeruzsálemi Dávid városa alatti forrás, amely más hely; Éden folyóját csak itt nevezik meg."
    - "Mivel Kús rendszerint az Egyiptomtól délre fekvő földet jelenti, Josephus a Gihont a Nílussal azonosította, az etióp hagyomány pedig az Abayban, a Kék-Nílusban látja. Juris Zarins, aki Édent a Perzsa-öböl csúcsára helyezte, a Gihont a délnyugat-iráni Karunnal, Kúst pedig a kasszitok földjével azonosította. A középkori muszlim földrajztudósok a közép-ázsiai Amu-darját Dzsajhunnak nevezték, a Gihon név egyik alakjának, és egyes későbbi írók azonosították Éden folyójával. E azonosítások egyike sem bizonyítható."
  fi:
    - "Gihon on toinen niistä neljästä joesta, jotka virtasivat Eedenistä: ”Toisen virran nimi on Giihon; se kiertää koko Kuusin maan.” Heprea sanoo Kus, jonka King James -käännös kääntää Etiopiaksi ja venäläinen synodaalinen Raamattu säilyttää muodossa Kus. Sama nimi on lähteellä Daavidin kaupungin alapuolella Jerusalemissa, mikä on eri paikka; Eedenin joki mainitaan vain tässä."
    - "Koska Kus tarkoittaa yleensä Egyptin eteläpuolista maata, Josephus tunnisti Gihonin Niiliksi, ja etiopialainen perinne näkee sen Abayssa, Siniseksi Niiliksi kutsutussa joessa. Juris Zarins, joka sijoitti Eedenin Persianlahden pohjukkaan, piti Gihonia Karunina Lounais-Iranissa ja Kusta kassilaisten maana. Keskiaikaiset muslimimaantieteilijät kutsuivat Keski-Aasian Amudarjaa nimellä Jayhun, nimen Gihon muoto, ja jotkut myöhemmät kirjoittajat tunnistivat sen Eedenin joeksi. Mitään näistä tunnistuksista ei voi todistaa."
  vi:
    - "Ghi-hôn là con sông thứ hai trong bốn con sông chảy ra từ Ê-đen: “Tên sông thứ nhì là Ghi-hôn, chảy quanh xứ Cu-sơ”. Tiếng Hê-bơ-rơ có Cút, mà bản King James dịch là Ethiopia (Ê-thi-ô-bi) và bản Synodal Nga giữ là Cush. Cùng tên ấy còn thuộc về con suối dưới Thành Đa-vít ở Giê-ru-sa-lem, một nơi khác; con sông Ê-đen chỉ được nêu tên ở đây."
    - "Vì Cút thường chỉ xứ phía nam Ê-díp-tô, Josephus đồng nhất Ghi-hôn với sông Ni-lơ, và truyền thống Ê-thi-ô-bi thấy nó ở sông Abay, sông Ni-lơ Xanh. Juris Zarins, đặt Ê-đen ở đầu vịnh Ba Tư, coi Ghi-hôn là sông Karun ở tây nam Iran và Cút là xứ của người Kassite. Các nhà địa lý Hồi giáo thời trung cổ gọi sông Amu Darya của Trung Á là Jayhun, một dạng của tên Ghi-hôn, và một số tác giả về sau đồng nhất nó với sông Ê-đen. Không đồng nhất nào trong số này có thể chứng minh."
  ro:
    - "Ghihonul este al doilea dintre cele patru râuri care ieșeau din Eden: „numele rîului celui de al doilea Gheon: acesta încunjură tot pământul Etiopiei”. Textul ebraic are Cuș, pe care Versiunea King James îl redă prin Etiopia, iar Biblia sinodală rusă îl păstrează ca Cuș. Același nume îl poartă izvorul de sub Cetatea lui David din Ierusalim, un alt loc; râul din Eden este numit doar aici."
    - "Fiindcă Cuș înseamnă de obicei țara de la sud de Egipt, Iosif Flaviu a identificat Ghihonul cu Nilul, iar tradiția etiopiană îl vede în Abay, Nilul Albastru. Juris Zarins, care așază Edenul la capul Golfului Persic, a luat Ghihonul drept Karun din sud-vestul Iranului și Cuș drept țara cașiților. Geografii musulmani medievali numeau Jayhun râul Amu Daria din Asia Centrală, o formă a numelui Ghihon, iar unii scriitori de mai târziu l-au identificat cu râul din Eden. Niciuna dintre aceste identificări nu poate fi dovedită."
  bg:
    - "Гион е втората от четирите реки, които излизаха от Едем: „И името на втората река Гион: тя е която обикаля всичката Хуска земя.“ Еврейският текст има Куш, което King James Version предава като Етиопия, а руската Синодална Библия запазва като Куш. Същото име носи изворът под Давидовия град в Йерусалим, друго място; реката на Едем се споменава само тук."
    - "Понеже Куш обикновено означава земята на юг от Египет, Йосиф Флавий отъждествява Гион с Нил, а етиопската традиция го вижда в Абай, Сини Нил. Юрис Заринс, който поставя Едем в северния край на Персийския залив, приема Гион за Карун в Югозападен Иран, а Куш — за земята на касите. Средновековните мюсюлмански географи наричаха Амударя в Средна Азия Джайхун — форма на името Гион, и някои по-късни автори я отъждествяваха с реката на Едем. Нито едно от тези отъждествявания не може да бъде доказано."
scripture:
