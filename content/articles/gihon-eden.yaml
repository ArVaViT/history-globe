# Overview article (ADR 0007). The Gihon of Eden is unidentified: the Nile (Josephus; Ethiopian tradition, the Blue Nile; the map's point), the Karun (Zarins, with Cush as the Kassites) and the Amu Darya (Islamic Jayhun) are shown without choosing. Not the spring of Jerusalem (gihon.yaml).
id: gihon-eden
place: a71d79b
title:
  en: "Gihon of Eden"
  ru: "Гихон Эдемский"
  uk: "Гіхон Едемський"
  es: "Gihón del Edén"
  pt: "Giom do Éden"
  de: "Gihon in Eden"
  fr: "Guihon (Éden)"
  it: "Ghicon dell’Eden"
  nl: "Gihon van Eden"
  pl: "Gichon z Edenu"
  cs: "Gichón z Edenu"
  sv: "Edens Gihon"
  nb: "Gihon i Eden"
  tl: "Gihon ng Eden"
  da: "Gihon i Eden"
  sr: "Гион Еденски"
  hu: "Éden Gihonja"
