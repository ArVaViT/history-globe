body:
  en:
    - "Gihon is the spring of Jerusalem, in the Kidron valley at the foot of the eastern ridge on which the City of David stood. It is the only perennial source of water near the city, and the city was built where it was because of it. The spring is a karst siphon: it gushes in bursts several times a day, and its name means “the gusher”. The Gihon of Genesis, one of the four rivers of Eden, is a different river of the same name. In the Synodal Bible the spring is Gion in Kings and Geon in Chronicles."
    - "Here Solomon was made king. While Adonijah feasted at En-rogel farther down the valley, David ordered Zadok and Nathan to “cause Solomon my son to ride upon mine own mule, and bring him down to Gihon”, and they “anointed him king in Gihon: and they are come up from thence rejoicing, so that the city rang again”. The spring lay outside the wall and was the city's weak point. Facing Sennacherib, Hezekiah “stopped the upper watercourse of Gihon, and brought it straight down to the west side of the city of David”: the tunnel of 533 m cut through the rock to the pool of Siloam, whose name recalls “the waters of Shiloah that go softly” of Isaiah, and where Jesus later sent the blind man to wash. The book of Kings sums it up, “how he made a pool, and a conduit, and brought water into the city”. Manasseh then built an outer wall “on the west side of Gihon, in the valley”."
    - "Charles Warren found in 1867 the shaft and passages that lead down to the spring from inside the city, and in 1880 a boy wading through the tunnel found the Siloam inscription, in which Hezekiah's workmen tell how the two gangs met in the rock; it is now in Istanbul. Excavations by Ronny Reich and Eli Shukron from 1995 uncovered a massive Spring Tower and walls guarding the source, which they assigned to the Middle Bronze Age; radiocarbon dates published in 2017 suggest that part of the tower was built as late as the end of the ninth century BC, and the dating is still debated. Today the spring lies in the City of David archaeological park in Silwan, in East Jerusalem, and visitors wade through Hezekiah's tunnel from Gihon to Siloam."
  ru:
    - "Гион — источник Иерусалима, в Кедронской долине у подножия восточного гребня, на котором стоял город Давидов. Это единственный постоянный источник воды близ города, и город был построен именно здесь из-за него. Источник — карстовый сифон: он бьёт толчками несколько раз в день, и имя его значит «бьющий». Гихон (Геон) книги Бытия, одна из четырёх рек Едема, — другая река с тем же именем. В Синодальном переводе источник зовётся Гион в книгах Царств и Геон в Паралипоменон."
    - "Здесь был поставлен на царство Соломон. Пока Адония пировал у Ен-Рогела ниже по долине, Давид велел Садоку и Нафану: «посадите Соломона, сына моего, на мула моего, и сведите его к Гиону», и они «помазали его Садок священник и Нафан пророк в царя в Гионе, и оттуда отправились с радостью, и пришел в движение город». Источник лежал за стеной и был слабым местом города. Перед лицом Сеннахирима Езекия «запер верхний проток вод Геона и провел их вниз к западной стороне города Давидова»: туннель длиной 533 м, пробитый в скале к Силоамской купели, чьё имя перекликается с «водами Силоама, текущими тихо» у Исаии, и куда Иисус позднее послал слепого умыться. Книга Царств подводит итог: «он сделал пруд и водопровод и провел воду в город». Затем Манассия построил внешнюю стену «на западной стороне Геона, по лощине»."
    - "Чарльз Уоррен в 1867 году нашёл шахту и ходы, ведущие к источнику изнутри города, а в 1880 году мальчик, пробиравшийся по туннелю, нашёл Силоамскую надпись, в которой рабочие Езекии рассказывают, как две артели встретились в скале; теперь она в Стамбуле. Раскопки Ронни Райха и Эли Шукрона с 1995 года открыли мощную Башню источника и стены, охранявшие его, отнесённые ими к среднему бронзовому веку; радиоуглеродные даты, опубликованные в 2017 году, говорят, что часть башни могла быть построена лишь в конце IX века до н. э.; спор о датировке продолжается. Сегодня источник лежит в археологическом парке «Город Давида» в Силуане, в Восточном Иерусалиме, и посетители проходят вброд по туннелю Езекии от Гиона до Силоама."
  uk:
    - "Гіхон — джерело Єрусалима в долині Кедрон біля підніжжя східного хребта, на якому стояло Місто Давида. Це єдине постійне джерело води поблизу міста, і місто було збудоване там, де воно є, саме через нього. Джерело — карстовий сифон: воно б’є поштовхами кілька разів на день, і його назва означає «той, що б’є». Гіхон із Книги Буття, одна з чотирьох річок Едену, — інша річка з тією самою назвою. У Синодальній Біблії джерело зветься Гіон у Книгах Царів і Геон у Хроніках."
    - "Тут Соломона було зроблено царем. Поки Адонія бенкетував біля Ен-Рогела далі вздовж долини, Давид наказав Садокові й Натанові: «посадїть сина мого Соломона на мого мула й везїть його в Гіон», і вони «помазали його ... в Гіонї на царя; і пійшли звідти з веселими сьпівами, і зворушився ввесь город». Джерело лежало поза муром і було слабким місцем міста. Перед Сінаххерібом Єзекія «загатив верхню течію води Геона й провів її на низ до західнього боку міста Давидового»: тунель довжиною 533 м, прорубаний у скелі до купелі Сілоам, чия назва нагадує «тихі води Силоамські» Ісаї, і куди пізніше Ісус послав сліпого вмитися. Книга Царів підсумовує: «як він зробив став і водопровід, і провів у город воду». Потім Манасія збудував зовнішній мур «на західньому боцї Геона, долиною»."
    - "Чарлз Воррен 1867 року знайшов шахту й ходи, що ведуть до джерела зсередини міста, а 1880 року хлопчик, який брів тунелем, знайшов Сілоамський напис, у якому робітники Єзекії розповідають, як дві групи зустрілися в скелі; він нині в Стамбулі. Розкопки Ронні Райха й Елі Шукрона від 1995 року відкрили масивну вежу над джерелом і мури, що охороняли витік, які вони віднесли до доби середньої бронзи; радіовуглецеві дати, опубліковані 2017 року, дозволяють припускати, що частину вежі збудовано аж наприкінці IX ст. до н. е., і датування досі оспорюється. Сьогодні джерело лежить в археологічному парку Міста Давида в Сільвані, у Східному Єрусалимі, і відвідувачі проходять бродом тунелем Єзекії від Гіхона до Сілоама."
  es:
    - "Gihón es la fuente de Jerusalén, en el valle del Cedrón, al pie de la loma oriental sobre la que se alzaba la Ciudad de David. Es el único manantial perenne cercano a la ciudad, y la ciudad se edificó donde está gracias a él. La fuente es un sifón kárstico: brota a borbotones varias veces al día, y su nombre significa «el que brota». El Gihón del Génesis, uno de los cuatro ríos del Edén, es un río distinto del mismo nombre. En la Biblia sinodal la fuente es Gion en Reyes y Geon en Crónicas."
    - "Aquí fue proclamado rey Salomón. Mientras Adonías banqueteaba en En-rogel, valle abajo, David ordenó a Sadoc y Natán: «haced subir á Salomón mi hijo en mi mula, y llevadlo á Gihón», y ellos «lo han ungido en Gihón por rey: y de allá han subido con alegrías, y la ciudad está llena de estruendo». La fuente, fuera del muro, era el punto débil de la ciudad. Frente a Senaquerib, Ezequías «tapó los manaderos de las aguas de Gihón la de arriba, y encaminólas abajo al occidente de la ciudad de David»: el túnel de 533 m en la roca hasta el estanque de Siloé, cuyo nombre recuerda «las aguas de Siloé, que corren mansamente» de Isaías, y donde Jesús envió al ciego a lavarse. Reyes lo resume: «cómo hizo el estanque, y el conducto, y metió las aguas en la ciudad». Manasés edificó luego un muro exterior «de afuera de la ciudad de David, al occidente de Gihón, en el valle»."
    - "Charles Warren halló en 1867 el pozo y los pasadizos que bajan a la fuente desde el interior de la ciudad, y en 1880 un muchacho que vadeaba el túnel encontró la inscripción de Siloé, en la que los obreros de Ezequías cuentan cómo se encontraron las dos cuadrillas en la roca; hoy está en Estambul. Las excavaciones de Ronny Reich y Eli Shukron desde 1995 sacaron a la luz una enorme Torre de la Fuente y muros que guardaban el manantial, que atribuyeron a la Edad del Bronce Medio; las dataciones por radiocarbono publicadas en 2017 sugieren que parte de la torre se construyó tan tarde como a fines del siglo IX a. C., y la datación sigue discutida. Hoy la fuente se encuentra en el parque arqueológico de la Ciudad de David, en Silwan, en Jerusalén Oriental, y los visitantes vadean el túnel de Ezequías desde Gihón hasta Siloé."
  pt:
    - "Giom é a fonte de Jerusalém, no vale do Cedrom, ao pé da crista oriental em que se erguia a Cidade de Davi. É a única fonte perene de água perto da cidade, e a cidade foi edificada onde está por causa dela. A fonte é um sifão cárstico: jorra em jatos várias vezes ao dia, e o seu nome significa “a que jorra”. O Giom de Gênesis, um dos quatro rios do Éden, é um rio diferente do mesmo nome. Na Bíblia Sinodal a fonte é Gion em Reis e Geon em Crônicas."
    - "Aqui Salomão foi feito rei. Enquanto Adonias banqueteava em En-Rogel, mais abaixo no vale, Davi ordenou a Zadoque e Natã que “façam o meu filho Salomão montar na minha própria mula, e levem-no para baixo, a Giom”, e eles “ungiram rei em Giom. De lá eles subiram se alegrando, de modo que a cidade está em alvoroço”. A fonte ficava fora da muralha e era o ponto fraco da cidade. Diante de Senaqueribe, Ezequias “tapou a fonte superior das águas de Giom, e as trouxe diretamente para o lado oeste da cidade de Davi”: o túnel de 533 m aberto na rocha até o tanque de Siloé, cujo nome lembra “as águas de Siloé, que fluem mansamente” de Isaías, e onde Jesus mais tarde mandou o cego se lavar. O livro de Reis resume: “como ele fez o tanque e o aqueduto, e trouxe água para a cidade”. Manassés construiu então um muro externo “no lado oeste de Giom, no vale”."
    - "Charles Warren achou em 1867 o poço e as passagens que descem à fonte desde o interior da cidade, e em 1880 um menino que vadeava o túnel achou a inscrição de Siloé, na qual os operários de Ezequias contam como as duas turmas se encontraram na rocha; ela está hoje em Istambul. As escavações de Ronny Reich e Eli Shukron desde 1995 revelaram uma maciça Torre da Fonte e muralhas que guardavam a nascente, que eles atribuíram ao Bronze Médio; datações por radiocarbono publicadas em 2017 sugerem que parte da torre foi construída só no fim do século IX a.C., e a datação ainda é debatida. Hoje a fonte fica no parque arqueológico da Cidade de Davi, em Silwan, em Jerusalém Oriental, e os visitantes vadeiam o túnel de Ezequias de Giom a Siloé."
  de:
    - "Gihon ist die Quelle Jerusalems, im Kidrontal am Fuß des Osthügels, auf dem die Stadt Davids stand. Sie ist die einzige ganzjährig fließende Wasserquelle bei der Stadt, und die Stadt wurde ihretwegen dort gebaut. Die Quelle ist ein Karstheber: Sie schießt mehrmals täglich stoßweise hervor, und ihr Name bedeutet „die Hervorbrechende“. Der Gihon des ersten Buches Mose, einer der vier Ströme Edens, ist ein anderer Fluss desselben Namens. In der Synodalübersetzung heißt die Quelle in den Königsbüchern Gion und in der Chronik Geon."
    - "Hier wurde Salomo König. Während Adonija weiter unten im Tal bei En-Rogel feierte, befahl David Zadok und Nathan: „setzet meinen Sohn Salomo auf mein Maultier und führet ihn hinab gen Gihon“; sie haben „ihn gesalbt zum König zu Gihon, und sind von da heraufgezogen mit Freuden, daß die Stadt voll Getümmels ist“. Die Quelle lag außerhalb der Mauer und war die Schwachstelle der Stadt. Gegen Sanherib war es Hiskia, der „die obere Wasserquelle in Gihon zudeckte und leitete sie hinunter abendwärts von der Stadt Davids“: der 533 m lange Felstunnel zum Teich Siloah, dessen Name an das „Wasser zu Siloah, das stille geht“ bei Jesaja erinnert und wohin Jesus später den Blinden zum Waschen schickte. Die Königsbücher fassen zusammen: „der Teich und die Wasserleitung, durch die er Wasser in die Stadt geleitet hat“. Manasse baute dann eine Außenmauer „abendswärts an Gihon im Tal“."
    - "Charles Warren fand 1867 den Schacht und die Gänge, die von innerhalb der Stadt zur Quelle hinabführen, und 1880 stieß ein Junge, der durch den Tunnel watete, auf die Siloah-Inschrift, in der Hiskias Arbeiter erzählen, wie sich die beiden Trupps im Fels trafen; sie befindet sich heute in Istanbul. Grabungen von Ronny Reich und Eli Schukron ab 1995 legten einen mächtigen Quellturm und Mauern frei, die die Quelle schützten und die sie der Mittelbronzezeit zuwiesen; 2017 veröffentlichte Radiokarbondaten legen nahe, dass ein Teil des Turms erst Ende des 9. Jahrhunderts v. Chr. gebaut wurde, und die Datierung ist weiter umstritten. Heute liegt die Quelle im archäologischen Park der Davidstadt in Silwan, in Ostjerusalem, und Besucher waten durch Hiskias Tunnel von Gihon nach Siloah."
  fr:
    - "Guihon est la source de Jérusalem, dans la vallée du Cédron, au pied de la crête orientale sur laquelle s’élevait la Cité de David. C’est la seule source pérenne près de la ville, qui fut bâtie là à cause d’elle. La source est un siphon karstique : elle jaillit par à-coups plusieurs fois par jour, et son nom signifie « le jaillissant ». Le Guihon de la Genèse, l’un des quatre fleuves d’Éden, est un autre fleuve du même nom. Dans la Bible synodale, la source est Gion dans les Rois et Geon dans les Chroniques."
    - "Salomon y fut fait roi. Pendant qu’Adonija festoyait à En-Roguel, plus bas dans la vallée, David ordonna à Tsadok et à Nathan : « faites monter Salomon, mon fils, sur ma mule, et faites-le descendre à Guihon » ; et ils « l’ont oint pour roi à Guihon. De là ils sont remontés en se livrant à la joie, et la ville a été émue ». Hors du mur, la source était le point faible de la ville. Face à Sanchérib, Ézéchias « boucha l’issue supérieure des eaux de Guihon, et les conduisit en bas vers l’occident de la cité de David » : le tunnel de 533 m creusé dans le roc jusqu’au réservoir de Siloé, dont le nom rappelle les « eaux de Siloé qui coulent doucement » d’Ésaïe, et où Jésus enverra l’aveugle se laver. Les Rois résument : « comment il fit l’étang et l’aqueduc, et amena les eaux dans la ville ». Manassé bâtit ensuite un mur extérieur « à l’occident, vers Guihon dans la vallée »."
    - "Charles Warren découvrit en 1867 le puits et les passages qui mènent à la source depuis l’intérieur de la ville, et en 1880 un garçon qui pataugeait dans le tunnel trouva l’inscription de Siloé, où les ouvriers d’Ézéchias racontent comment les deux équipes se rejoignirent dans le roc ; elle est aujourd’hui à Istanbul. Les fouilles de Ronny Reich et d’Eli Shukron, à partir de 1995, dégagèrent une imposante tour de la Source et des murs gardant la source, qu’ils attribuèrent au Bronze moyen ; des datations au radiocarbone publiées en 2017 suggèrent qu’une partie de la tour fut bâtie aussi tard qu’à la fin du IXe siècle av. J.-C., et la datation reste débattue. Aujourd’hui, la source se trouve dans le parc archéologique de la Cité de David à Silwan, à Jérusalem-Est, et les visiteurs parcourent à gué le tunnel d’Ézéchias, de Guihon à Siloé."
  pl:
    - "Gichon to źródło Jerozolimy w dolinie Cedronu u stóp wschodniego grzbietu, na którym stało Miasto Dawida. Jest to jedyne stałe źródło wody w pobliżu miasta i miasto zbudowano tam, gdzie jest, z jego powodu. Źródło jest syfonem krasowym: tryska rzutami kilka razy dziennie, a jego nazwa znaczy „tryskające”. Gichon z Księgi Rodzaju, jedna z czterech rzek Edenu, to inna rzeka o tej samej nazwie. W Biblii synodalnej źródło to Gion w Księgach Królewskich i Geon w Księgach Kronik."
    - "Tu Salomon został ukoronowany na króla. Gdy Adoniasz ucztował w En-Rogel dalej w dolinie, Dawid kazał Sadokowi i Natanowi: „wsadźcie Salomona, syna mego, na mulicę moję, i prowadźcie go do Gihonu”, a oni „pomazali go ... za króla w Gihonie, i szli stamtąd weseląc się, tak, że zadrżało miasto”. Źródło leżało poza murem i było słabym punktem miasta. W obliczu Sennacheryba Ezechiasz „zatkał źródło wód w Gichonie wyższe, a przywiódł je dołem na zachód słońca ku miastu Dawidowemu”: tunel o długości 533 m wykuty w skale do sadzawki Siloe, której nazwa przywołuje „wody Syloe, które cicho płyną” u Izajasza, i gdzie Jezus posłał później niewidomego, by się umył. Księgi Królewskie podsumowują: „jako uczynił sadzawkę, i rury, którymi przywiódł wodę do miasta”. Manasses zbudował następnie zewnętrzny mur „ku zachodniej stronie Gichonu potoku”."
    - "Charles Warren znalazł w 1867 r. szyb i przejścia prowadzące do źródła z wnętrza miasta, a w 1880 r. chłopiec brodzący w tunelu znalazł napis z Siloe, w którym robotnicy Ezechiasza opowiadają, jak dwie grupy spotkały się w skale; znajduje się on dziś w Stambule. Wykopaliska Ronny'ego Reicha i Eliego Szukrona od 1995 r. odsłoniły masywną Wieżę Źródlaną i mury strzegące źródła, które przypisali środkowej epoce brązu; daty radiowęglowe opublikowane w 2017 r. sugerują, że część wieży zbudowano dopiero pod koniec IX w. p.n.e., a datowanie jest nadal sporne. Dziś źródło leży w parku archeologicznym Miasta Dawida w Silwanie, we Wschodniej Jerozolimie, a zwiedzający brodzą tunelem Ezechiasza od Gichonu do Siloe."
  it:
    - "Ghicon è la sorgente di Gerusalemme, nella valle del Cedron ai piedi della dorsale orientale su cui sorgeva la Città di Davide. È l’unica fonte perenne d’acqua presso la città, e la città fu costruita dove sorge a causa sua. La sorgente è un sifone carsico: sgorga a getti più volte al giorno, e il suo nome significa «lo sgorgante». Il Ghicon della Genesi, uno dei quattro fiumi dell’Eden, è un fiume diverso con lo stesso nome. Nella Bibbia sinodale la sorgente è Gion nei Re e Geon nelle Cronache."
    - "Qui Salomone fu fatto re. Mentre Adonia banchettava a En-Roghel più a valle, Davide ordinò a Zadok e a Natan di «far montare Salomone mio figliuolo sulla mia mula, e menarlo giù a Ghihon», ed essi «l’hanno unto re a Ghihon, e di là son risaliti abbandonandosi alla gioia, e la città n’è tutta sossopra». La sorgente, fuori delle mura, era il punto debole della città. Di fronte a Sennacherib, Ezechia «turò la sorgente superiore delle acque di Ghihon, che condusse giù direttamente, dal lato occidentale della città di Davide»: il tunnel di 533 m scavato nella roccia fino alla vasca di Siloe, il cui nome richiama «le acque di Siloe che corrono placidamente» di Isaia, e dove Gesù mandò poi il cieco a lavarsi. Il libro dei Re: «com’egli fece il serbatoio e l’acquedotto e condusse le acque nella città». Manasse costruì poi un muro «a occidente, verso Ghihon nella valle»."
    - "Charles Warren trovò nel 1867 il pozzo e i passaggi che dall’interno della città scendono alla sorgente, e nel 1880 un ragazzo che guadava il tunnel trovò l’iscrizione di Siloe, in cui gli operai di Ezechia raccontano come le due squadre si incontrarono nella roccia; è oggi a Istanbul. Gli scavi di Ronny Reich ed Eli Shukron dal 1995 hanno portato alla luce una massiccia Torre della Sorgente e mura a protezione della fonte, che essi attribuirono al Bronzo Medio; datazioni al radiocarbonio pubblicate nel 2017 suggeriscono che parte della torre sia stata costruita solo alla fine del IX secolo a.C., e la datazione è ancora discussa. Oggi la sorgente si trova nel parco archeologico della Città di Davide a Silwan, a Gerusalemme Est, e i visitatori guadano il tunnel di Ezechia da Ghicon a Siloe."
  nl:
    - "Gihon is de bron van Jeruzalem, in het Kidrondal aan de voet van de oostelijke bergrug waarop de Stad van David lag. Het is de enige bron met jaarrond water bij de stad, en de stad werd er om die reden gebouwd. De bron is een karstsifon: zij spuit enkele malen per dag stootsgewijs op, en haar naam betekent “de opwellende”. De Gihon van Genesis, een van de vier rivieren van Eden, is een andere rivier met dezelfde naam. In de Synodale Bijbel heet de bron Gion in Koningen en Geon in Kronieken."
    - "Hier werd Salomo koning. Terwijl Adonia feestte bij En-Rogel, verderop, droeg David Sadok en Natan op: “doet mijn zoon Salomo rijden op de muilezelin, die voor mij is; en voert hem af naar Gihon”, en zij hebben hem “in Gihon tot koning gezalfd, en zijn van daar blijde opgetogen, zodat de stad in roer is”. De bron lag buiten de muur, het zwakke punt der stad. Tegenover Sanherib “stopte” Chizkia “den opperuitgang der wateren van Gihon, en leidde ze recht af beneden naar het westen der stad Davids”: de rotstunnel van 533 m naar de vijver van Siloam, waarvan de naam doet denken aan “de wateren van Siloa, die zachtjes gaan” bij Jesaja, en waarheen Jezus later de blinde zond om zich te wassen. Koningen vat samen: “hoe hij den vijver en den watergang gemaakt heeft, en water in de stad gebracht heeft”. Manasse bouwde een buitenmuur “aan de westzijde van Gihon in het dal”."
    - "Charles Warren vond in 1867 de schacht en gangen die vanuit de stad naar de bron leiden, en in 1880 vond een jongen die door de tunnel waadde het Siloam-opschrift, waarin Chizkia’s werklieden vertellen hoe de twee ploegen elkaar in de rots ontmoetten; het bevindt zich nu in Istanboel. Opgravingen van Ronny Reich en Eli Shukron vanaf 1995 legden een massieve Bronnentoren en muren rond de bron bloot, die zij in de Midden-Bronstijd plaatsten; in 2017 gepubliceerde koolstofdateringen suggereren dat een deel van de toren pas aan het eind van de 9e eeuw v.Chr. is gebouwd, en de datering is nog omstreden. Nu ligt de bron in het archeologische park Stad van David in Silwan, in Oost-Jeruzalem, en waden bezoekers door Chizkia’s tunnel van Gihon naar Siloam."
  cs:
    - "Gichón je jeruzalémský pramen, v údolí Kidronu na úpatí východního hřebene, na němž stálo Město Davidovo. Je to jediný stálý zdroj vody poblíž města a město bylo postaveno tam, kde je, kvůli němu. Pramen je krasový sifon: vyvěrá v několika dávkách denně a jeho jméno znamená „tryskající“. Gichón z Genesis, jedna ze čtyř řek Edenu, je jiná řeka téhož jména. V synodální Bibli je pramen Gion v Královských a Geon v Letopisech."
    - "Zde byl Šalomoun učiněn králem. Zatímco Adonijáš hodoval u Én-rógelu dále v údolí, David nařídil Sádokovi a Nátanovi: „Vsaďte Šalomouna syna mého na mezkyni mou, a veďte ji k Gihonu“, a oni „pomazali jej … za krále u Gihonu, a vstupovali odtud s radostí, tak že hlučelo město“. Pramen ležel mimo hradbu a byl slabým místem města. Tváří v tvář Senacheribovi Chizkijáš „zasypal tok vody Gihonu hořejší, a přímo vedl jej dolů k západní straně města Davidova“: tunel dlouhý 533 m proražený skálou k rybníku Siloe, jehož jméno se pojí s „vodami Siloe tiše tekoucími“ u Izajáše, a kam Ježíš později poslal slepého umýt se. Kniha Královská to shrnuje: „kterak udělal rybník, a vodu po trubách uvedl do města“. Manases pak vystavěl vnější hradbu „k západní straně Gihonu potoku“."
    - "Charles Warren nalezl roku 1867 šachtu a chodby vedoucí k prameni zevnitř města a roku 1880 našel chlapec brodící se tunelem Siloamský nápis, v němž Chizkijášovi dělníci vypravují, jak se obě skupiny setkaly ve skále; dnes je v Istanbulu. Vykopávky Ronnyho Reicha a Élího Šukrona od roku 1995 odkryly mohutnou Věž nad pramenem a hradby chránící zdroj, které přiřadili ke střední době bronzové; radiokarbonová data zveřejněná roku 2017 naznačují, že část věže byla postavena až koncem 9. stol. př. n. l., a datování je stále sporné. Dnes pramen leží v archeologickém parku Města Davidova v Silwánu, ve východním Jeruzalémě, a návštěvníci procházejí vodou Chizkijášovým tunelem z Gichónu do Siloe."
  sv:
    - "Gihon är Jerusalems källa, i Kidrondalen vid foten av den östra åsen där Davids stad låg. Det är den enda ständiga vattenkällan nära staden, och staden byggdes där den ligger på grund av den. Källan är en karstsifon: den sprutar fram i stötar flera gånger om dagen, och dess namn betyder ”den framsprudlande”. Gihon i Första Moseboken, en av Edens fyra floder, är en annan flod med samma namn. I den ryska synodalbibeln är källan Gion i Kungaboken och Geon i Krönikeboken."
    - "Här blev Salomo kung. Medan Adonia gästade vid En-Rogel längre ned i dalen befallde David Sadok och Natan: ”sätten min son Salomo på min egen mulåsna och fören honom med till Gihon”, och det heter: ”hava prästen Sadok och profeten Natan i Gihon smort honom till konung, och sedan hava de dragit upp därifrån under jubel, och hela staden har kommit i rörelse”. Källan låg utanför muren och var stadens svaga punkt. Inför Sanherib var det Hiskia som ”täppte till Gihonsvattnets övre källa och ledde vattnet nedåt, väster om Davids stad”: tunneln på 533 m genom berget till Siloadammen, vars namn erinrar om ”Siloas vatten, som flyter så stilla” hos Jesaja, och dit Jesus senare sände den blinde att tvätta sig. Kungaboken sammanfattar det: ”huru han anlade dammen och vattenledningen och ledde vatten in i staden”. Manasse byggde sedan en yttre mur ”västerut mot Gihon i dalen”."
    - "Charles Warren fann 1867 schaktet och gångarna som leder ned till källan inifrån staden, och 1880 fann en pojke som vadade genom tunneln Siloainskriften, där Hiskias arbetare berättar hur de två lagen möttes i berget; den finns nu i Istanbul. Utgrävningar av Ronny Reich och Eli Shukron från 1995 frilade ett massivt Källtorn och murar som skyddade källan, vilka de förde till mellanbronsåldern; kol-14-dateringar publicerade 2017 antyder att en del av tornet byggdes så sent som i slutet av 800-talet f.Kr., och dateringen är fortfarande omdebatterad. I dag ligger källan i den arkeologiska parken Davids stad i Silwan i Östra Jerusalem, och besökare vadar genom Hiskias tunnel från Gihon till Siloa."
  nb:
    - "Gihon er Jerusalems kilde, i Kedrondalen ved foten av den østlige ryggen som Davidsbyen sto på. Den er den eneste varige vannkilden nær byen, og byen ble bygd der den ble på grunn av den. Kilden er en karstsifon: den bryter fram i støt flere ganger om dagen, og navnet betyr «sprutkilden». Gihon i Første Mosebok, en av Edens fire elver, er en annen elv med samme navn. I den synodale bibelen er kilden Gion i Kongebøkene og Geon i Krønikebøkene."
    - "Her ble Salomo gjort til konge. Mens Adonja holdt fest ved En-Rogel lenger nede i dalen, påla David Sadok og Natan å «la min sønn Salomo ride på mitt eget muldyr og før ham ned til Gihon», og de «salvet ham til konge i Gihon, og så drog de op derfra i glede, og hele byen er i et røre». Kilden lå utenfor muren og var byens svake punkt. Overfor Sankerib gjorde Hiskia dette: han «tilstoppet det øvre utløp av Gihonvannet og ledet det ned vestenfor Davids stad»: tunnelen på 533 m hugget gjennom fjellet til Siloa-dammen, hvis navn minner om «Siloahs vann, de som rinner så stilt» hos Jesaja, og hvor Jesus senere sendte den blinde for å vaske seg. Kongebøkene oppsummerer det: «hvorledes han gjorde dammen og vannledningen og førte vannet inn i byen». Manasse bygde så en ytre mur «vestenfor Gihon i dalen»."
    - "Charles Warren fant i 1867 sjakten og gangene som fører ned til kilden fra innsiden av byen, og i 1880 fant en gutt som vadet gjennom tunnelen Siloa-innskriften, der Hiskias arbeidere forteller hvordan de to lagene møttes i fjellet; den er nå i Istanbul. Utgravninger av Ronny Reich og Eli Shukron fra 1995 avdekket et massivt Kildetårn og murer som vokter kilden, som de tilskrev mellombronsealder; radiokarbondateringer publisert i 2017 tyder på at deler av tårnet ble bygd så sent som ved slutten av 800-tallet f.Kr., og dateringen er fortsatt omdiskutert. I dag ligger kilden i den arkeologiske parken i Davidsbyen i Silwan, i Øst-Jerusalem, og besøkende vader gjennom Hiskias tunnel fra Gihon til Siloa."
  tl:
    - "Ang Gihon ang bukal ng Jerusalem, sa libis ng Cedron sa paanan ng silangang tagaytay kung saan nakatayo ang Bayan ni David. Ito ang tanging pangmatagalang pinagkukunan ng tubig malapit sa lungsod, at itinayo ang lungsod sa lugar na iyon dahil dito. Ang bukal ay karst na sifon: bumubulwak ito nang paputok ilang beses sa isang araw, at ang pangalan nito ay nangangahulugang “ang bumubulwak”. Ang Gihon ng Genesis, isa sa apat na ilog ng Eden, ay ibang ilog na may kaparehong pangalan. Sa Bibliyang Sinodal, ang bukal ay Gion sa Mga Hari at Geon sa Mga Cronica."
    - "Dito ginawang hari si Salomon. Nang magpista si Adonia sa En-rogel, iniutos ni David kina Sadoc at Nathan: “pasakayin ninyo ang aking anak na si Salomon sa aking sariling mula, at ilusong ninyo siya sa Gihon”, at “siya'y pinapaging hari na pinahiran ng langis … sa Gihon: at sila'y nagsiahong galak mula roon, na anopa't ang bayan ay umalingawngaw uli”. Nasa labas ng pader ang bukal—kahinaan ng lungsod. Laban kay Sennacherib, si Ezechias ay “nagpatigil ng pinakamataas na bukal ng tubig sa Gihon, at ibinabang tuloy sa dakong kalunuran ng bayan ni David”: ang lagusang 533 m sa Siloe, na nagpapaalala sa “tubig ng Siloe na nagsisiagos na marahan” ni Isaias, kung saan pinaghugas ni Jesus ang bulag. Sa Mga Hari: “kung paano niyang ginawa ang tipunan ng tubig, at ang padaluyan, at nagdala ng tubig sa bayan”. Nagtayo si Manases ng pader “sa dakong kalunuran ng Gihon, sa libis”."
    - "Natuklasan ni Charles Warren noong 1867 ang poso at mga daanang humahantong pababa sa bukal mula sa loob ng lungsod, at noong 1880 isang batang lumusong sa lagusan ang nakakita sa inskripsiyon ng Siloe, kung saan isinasalaysay ng mga manggagawa ni Ezechias kung paano nagkita ang dalawang pangkat sa bato; nasa Istanbul ito ngayon. Ang mga paghuhukay nina Ronny Reich at Eli Shukron mula 1995 ay naglantad ng malaking Tore ng Bukal at mga pader na nagbabantay sa pinagmulan, na iniuugnay nila sa Gitnang Panahong Tanso; iminumungkahi ng mga petsang radiocarbon na inilathala noong 2017 na itinayo ang bahagi ng tore noong katapusan pa ng ika-9 na siglo BK, at pinagtatalunan pa ang pagpepetsa. Ngayon, ang bukal ay nasa arkeolohikong liwasan ng Bayan ni David sa Silwan, sa Silangang Jerusalem, at lumulusong ang mga bisita sa lagusan ni Ezechias mula Gihon patungong Siloe."
