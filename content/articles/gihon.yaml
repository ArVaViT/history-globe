# Overview article (ADR 0007). Mainstream facts only; the dating of the Spring Tower is noted as revised; this is the spring of Jerusalem, not the river of Eden.
id: gihon
place: a2a303c
title:
  en: "Gihon"
  ru: "Гион"
  uk: "Гіхон"
  es: "Gihón"
  pt: "Giom"
  de: "Gihon"
  fr: "Guihon"
body:
  en:
    - "Gihon is the spring of Jerusalem, in the Kidron valley at the foot of the eastern ridge on which the City of David stood. It is the only perennial source of water near the city, and the city was built where it was because of it. The spring is a karst siphon: it gushes in bursts several times a day, and its name means “the gusher”. The Gihon of Genesis, one of the four rivers of Eden, is a different river of the same name. In the Synodal Bible the spring is Gion in Kings and Geon in Chronicles."
    - "Here Solomon was made king. While Adonijah feasted at En-rogel farther down the valley, David ordered Zadok and Nathan to “cause Solomon my son to ride upon mine own mule, and bring him down to Gihon”, and they “anointed him king in Gihon: and they are come up from thence rejoicing, so that the city rang again”. The spring lay outside the wall and was the city's weak point. Facing Sennacherib, Hezekiah “stopped the upper watercourse of Gihon, and brought it straight down to the west side of the city of David”: the tunnel of 533 m cut through the rock to the pool of Siloam, “the waters of Shiloah that go softly” of Isaiah, where Jesus later sent the blind man to wash. The book of Kings sums it up, “how he made a pool, and a conduit, and brought water into the city”. Manasseh then built an outer wall “on the west side of Gihon, in the valley”, taking the spring inside."
    - "Charles Warren found in 1867 the shaft and passages that lead down to the spring from inside the city, and in 1880 a boy wading through the tunnel found the Siloam inscription, in which Hezekiah's workmen tell how the two gangs met in the rock; it is now in Istanbul. Excavations by Ronny Reich and Eli Shukron from 1995 uncovered a massive Spring Tower and walls guarding the source, which they assigned to the Middle Bronze Age; radiocarbon dates published in 2017 suggest that part of the tower was built as late as the end of the ninth century BC, and the dating is still debated. Today the spring lies in the City of David archaeological park in Silwan, in East Jerusalem, and visitors wade through Hezekiah's tunnel from Gihon to Siloam."
  ru:
    - "Гион — источник Иерусалима, в Кедронской долине у подножия восточного гребня, на котором стоял город Давидов. Это единственный постоянный источник воды близ города, и город был построен именно здесь из-за него. Источник — карстовый сифон: он бьёт толчками несколько раз в день, и имя его значит «бьющий». Гихон (Геон) книги Бытия, одна из четырёх рек Едема, — другая река с тем же именем. В Синодальном переводе источник зовётся Гион в книгах Царств и Геон в Паралипоменон."
    - "Здесь был поставлен на царство Соломон. Пока Адония пировал у Ен-Рогела ниже по долине, Давид велел Садоку и Нафану: «посадите Соломона, сына моего, на мула моего, и сведите его к Гиону», и они «помазали его Садок священник и Нафан пророк в царя в Гионе, и оттуда отправились с радостью, и пришел в движение город». Источник лежал за стеной и был слабым местом города. Перед лицом Сеннахирима Езекия «запер верхний проток вод Геона и провел их вниз к западной стороне города Давидова»: туннель длиной 533 м, пробитый в скале к Силоамской купели, чьи воды Исаия зовёт «водами Силоама, текущими тихо» и куда Иисус позднее послал слепого умыться. Книга Царств подводит итог: «он сделал пруд и водопровод и провел воду в город». Затем Манассия построил внешнюю стену «на западной стороне Геона, по лощине», взяв источник внутрь."
    - "Чарльз Уоррен в 1867 году нашёл шахту и ходы, ведущие к источнику изнутри города, а в 1880 году мальчик, пробиравшийся по туннелю, нашёл Силоамскую надпись, в которой рабочие Езекии рассказывают, как две артели встретились в скале; теперь она в Стамбуле. Раскопки Ронни Райха и Эли Шукрона с 1995 года открыли мощную Башню источника и стены, охранявшие его, отнесённые ими к среднему бронзовому веку; радиоуглеродные даты, опубликованные в 2017 году, говорят, что часть башни могла быть построена лишь в конце IX века до н. э.; спор о датировке продолжается. Сегодня источник лежит в археологическом парке «Город Давида» в Силуане, в Восточном Иерусалиме, и посетители проходят вброд по туннелю Езекии от Гиона до Силоама."
  uk:
    - "Гіхон — джерело Єрусалима в долині Кедрон біля підніжжя східного хребта, на якому стояло Місто Давида. Це єдине постійне джерело води поблизу міста, і місто було збудоване там, де воно є, саме через нього. Джерело — карстовий сифон: воно б’є поштовхами кілька разів на день, і його назва означає «той, що б’є». Гіхон із Книги Буття, одна з чотирьох річок Едену, — інша річка з тією самою назвою. У Синодальній Біблії джерело зветься Гіон у Книгах Царів і Геон у Хроніках."
    - "Тут Соломона було зроблено царем. Поки Адонія бенкетував біля Ен-Рогела далі вздовж долини, Давид наказав Садокові й Натанові: «посадїть сина мого Соломона на мого мула й везїть його в Гіон», і вони «помазали його ... в Гіонї на царя; і пійшли звідти з веселими сьпівами, і зворушився ввесь город». Джерело лежало поза муром і було слабким місцем міста. Перед Сінаххерібом Єзекія «загатив верхню течію води Геона й провів її на низ до західнього боку міста Давидового»: тунель довжиною 533 м, прорубаний у скелі до купелі Сілоам, до «тихих вод Силоамських» Ісаї, куди пізніше Ісус послав сліпого вмитися. Книга Царів підсумовує: «як він зробив став і водопровід, і провів у город воду». Потім Манасія збудував зовнішній мур «на західньому боцї Геона, долиною», узявши джерело всередину."
    - "Чарлз Воррен 1867 року знайшов шахту й ходи, що ведуть до джерела зсередини міста, а 1880 року хлопчик, який брів тунелем, знайшов Сілоамський напис, у якому робітники Єзекії розповідають, як дві групи зустрілися в скелі; він нині в Стамбулі. Розкопки Ронні Райха й Елі Шукрона від 1995 року відкрили масивну вежу над джерелом і мури, що охороняли витік, які вони віднесли до доби середньої бронзи; радіовуглецеві дати, опубліковані 2017 року, дозволяють припускати, що частину вежі збудовано аж наприкінці IX ст. до н. е., і датування досі оспорюється. Сьогодні джерело лежить в археологічному парку Міста Давида в Сільвані, у Східному Єрусалимі, і відвідувачі проходять бродом тунелем Єзекії від Гіхона до Сілоама."
  es:
    - "Gihón es la fuente de Jerusalén, en el valle del Cedrón, al pie de la loma oriental sobre la que se alzaba la Ciudad de David. Es el único manantial perenne cercano a la ciudad, y la ciudad se edificó donde está gracias a él. La fuente es un sifón kárstico: brota a borbotones varias veces al día, y su nombre significa «el que brota». El Gihón del Génesis, uno de los cuatro ríos del Edén, es un río distinto del mismo nombre. En la Biblia sinodal la fuente es Gion en Reyes y Geon en Crónicas."
    - "Aquí fue proclamado rey Salomón. Mientras Adonías banqueteaba en En-rogel, valle abajo, David ordenó a Sadoc y Natán: «haced subir á Salomón mi hijo en mi mula, y llevadlo á Gihón», y ellos «lo han ungido en Gihón por rey: y de allá han subido con alegrías, y la ciudad está llena de estruendo». La fuente, fuera del muro, era el punto débil de la ciudad. Frente a Senaquerib, Ezequías «tapó los manaderos de las aguas de Gihón la de arriba, y encaminólas abajo al occidente de la ciudad de David»: el túnel de 533 m en la roca hasta el estanque de Siloé, «las aguas de Siloé, que corren mansamente» de Isaías, donde Jesús envió al ciego a lavarse. Reyes lo resume: «cómo hizo el estanque, y el conducto, y metió las aguas en la ciudad». Manasés edificó luego un muro exterior «de afuera de la ciudad de David, al occidente de Gihón, en el valle», que dejó la fuente dentro."
    - "Charles Warren halló en 1867 el pozo y los pasadizos que bajan a la fuente desde el interior de la ciudad, y en 1880 un muchacho que vadeaba el túnel encontró la inscripción de Siloé, en la que los obreros de Ezequías cuentan cómo se encontraron las dos cuadrillas en la roca; hoy está en Estambul. Las excavaciones de Ronny Reich y Eli Shukron desde 1995 sacaron a la luz una enorme Torre de la Fuente y muros que guardaban el manantial, que atribuyeron a la Edad del Bronce Medio; las dataciones por radiocarbono publicadas en 2017 sugieren que parte de la torre se construyó tan tarde como a fines del siglo IX a. C., y la datación sigue discutida. Hoy la fuente se encuentra en el parque arqueológico de la Ciudad de David, en Silwan, en Jerusalén Oriental, y los visitantes vadean el túnel de Ezequías desde Gihón hasta Siloé."
  pt:
    - "Giom é a fonte de Jerusalém, no vale do Cedrom, ao pé da crista oriental em que se erguia a Cidade de Davi. É a única fonte perene de água perto da cidade, e a cidade foi edificada onde está por causa dela. A fonte é um sifão cárstico: jorra em jatos várias vezes ao dia, e o seu nome significa “a que jorra”. O Giom de Gênesis, um dos quatro rios do Éden, é um rio diferente do mesmo nome. Na Bíblia Sinodal a fonte é Gion em Reis e Geon em Crônicas."
    - "Aqui Salomão foi feito rei. Enquanto Adonias banqueteava em En-Rogel, mais abaixo no vale, Davi ordenou a Zadoque e Natã que “façam o meu filho Salomão montar na minha própria mula, e levem-no para baixo, a Giom”, e eles “ungiram rei em Giom. De lá eles subiram se alegrando, de modo que a cidade está em alvoroço”. A fonte ficava fora da muralha e era o ponto fraco da cidade. Diante de Senaqueribe, Ezequias “tapou a fonte superior das águas de Giom, e as trouxe diretamente para o lado oeste da cidade de Davi”: o túnel de 533 m aberto na rocha até o tanque de Siloé, “as águas de Siloé, que fluem mansamente” de Isaías, onde Jesus mais tarde mandou o cego se lavar. O livro de Reis resume: “como ele fez o tanque e o aqueduto, e trouxe água para a cidade”. Manassés construiu então um muro externo “no lado oeste de Giom, no vale”, trazendo a fonte para dentro."
    - "Charles Warren achou em 1867 o poço e as passagens que descem à fonte desde o interior da cidade, e em 1880 um menino que vadeava o túnel achou a inscrição de Siloé, na qual os operários de Ezequias contam como as duas turmas se encontraram na rocha; ela está hoje em Istambul. As escavações de Ronny Reich e Eli Shukron desde 1995 revelaram uma maciça Torre da Fonte e muralhas que guardavam a nascente, que eles atribuíram ao Bronze Médio; datações por radiocarbono publicadas em 2017 sugerem que parte da torre foi construída só no fim do século IX a.C., e a datação ainda é debatida. Hoje a fonte fica no parque arqueológico da Cidade de Davi, em Silwan, em Jerusalém Oriental, e os visitantes vadeiam o túnel de Ezequias de Giom a Siloé."
  de:
    - "Gihon ist die Quelle Jerusalems, im Kidrontal am Fuß des Osthügels, auf dem die Stadt Davids stand. Sie ist die einzige ganzjährig fließende Wasserquelle bei der Stadt, und die Stadt wurde ihretwegen dort gebaut. Die Quelle ist ein Karstheber: Sie schießt mehrmals täglich stoßweise hervor, und ihr Name bedeutet „die Hervorbrechende“. Der Gihon des ersten Buches Mose, einer der vier Ströme Edens, ist ein anderer Fluss desselben Namens. In der Synodalübersetzung heißt die Quelle in den Königsbüchern Gion und in der Chronik Geon."
    - "Hier wurde Salomo König. Während Adonija weiter unten im Tal bei En-Rogel feierte, befahl David Zadok und Nathan: „setzet meinen Sohn Salomo auf mein Maultier und führet ihn hinab gen Gihon“; sie haben „ihn gesalbt zum König zu Gihon, und sind von da heraufgezogen mit Freuden, daß die Stadt voll Getümmels ist“. Die Quelle lag außerhalb der Mauer und war die Schwachstelle der Stadt. Gegen Sanherib war es Hiskia, der „die obere Wasserquelle in Gihon zudeckte und leitete sie hinunter abendwärts von der Stadt Davids“: der 533 m lange Felstunnel zum Teich Siloah, dem „Wasser zu Siloah, das stille geht“ bei Jesaja, wohin Jesus später den Blinden zum Waschen schickte. Die Königsbücher fassen zusammen: „der Teich und die Wasserleitung, durch die er Wasser in die Stadt geleitet hat“. Manasse baute dann eine Außenmauer „abendswärts an Gihon im Tal“, die die Quelle einschloss."
    - "Charles Warren fand 1867 den Schacht und die Gänge, die von innerhalb der Stadt zur Quelle hinabführen, und 1880 stieß ein Junge, der durch den Tunnel watete, auf die Siloah-Inschrift, in der Hiskias Arbeiter erzählen, wie sich die beiden Trupps im Fels trafen; sie befindet sich heute in Istanbul. Grabungen von Ronny Reich und Eli Schukron ab 1995 legten einen mächtigen Quellturm und Mauern frei, die die Quelle schützten und die sie der Mittelbronzezeit zuwiesen; 2017 veröffentlichte Radiokarbondaten legen nahe, dass ein Teil des Turms erst Ende des 9. Jahrhunderts v. Chr. gebaut wurde, und die Datierung ist weiter umstritten. Heute liegt die Quelle im archäologischen Park der Davidstadt in Silwan, in Ostjerusalem, und Besucher waten durch Hiskias Tunnel von Gihon nach Siloah."
  fr:
    - "Guihon est la source de Jérusalem, dans la vallée du Cédron, au pied de la crête orientale sur laquelle s’élevait la Cité de David. C’est la seule source pérenne près de la ville, qui fut bâtie là à cause d’elle. La source est un siphon karstique : elle jaillit par à-coups plusieurs fois par jour, et son nom signifie « le jaillissant ». Le Guihon de la Genèse, l’un des quatre fleuves d’Éden, est un autre fleuve du même nom. Dans la Bible synodale, la source est Gion dans les Rois et Geon dans les Chroniques."
    - "Salomon y fut fait roi. Pendant qu’Adonija festoyait à En-Roguel, plus bas dans la vallée, David ordonna à Tsadok et à Nathan : « faites monter Salomon, mon fils, sur ma mule, et faites-le descendre à Guihon » ; et ils « l’ont oint pour roi à Guihon. De là ils sont remontés en se livrant à la joie, et la ville a été émue ». Hors du mur, la source était le point faible de la ville. Face à Sanchérib, Ézéchias « boucha l’issue supérieure des eaux de Guihon, et les conduisit en bas vers l’occident de la cité de David » : le tunnel de 533 m creusé dans le roc jusqu’au réservoir de Siloé, les « eaux de Siloé qui coulent doucement » d’Ésaïe, où Jésus enverra l’aveugle se laver. Les Rois résument : « comment il fit l’étang et l’aqueduc, et amena les eaux dans la ville ». Manassé bâtit ensuite un mur extérieur « à l’occident, vers Guihon dans la vallée », englobant la source."
    - "Charles Warren découvrit en 1867 le puits et les passages qui mènent à la source depuis l’intérieur de la ville, et en 1880 un garçon qui pataugeait dans le tunnel trouva l’inscription de Siloé, où les ouvriers d’Ézéchias racontent comment les deux équipes se rejoignirent dans le roc ; elle est aujourd’hui à Istanbul. Les fouilles de Ronny Reich et d’Eli Shukron, à partir de 1995, dégagèrent une imposante tour de la Source et des murs gardant la source, qu’ils attribuèrent au Bronze moyen ; des datations au radiocarbone publiées en 2017 suggèrent qu’une partie de la tour fut bâtie aussi tard qu’à la fin du IXe siècle av. J.-C., et la datation reste débattue. Aujourd’hui, la source se trouve dans le parc archéologique de la Cité de David à Silwan, à Jérusalem-Est, et les visiteurs parcourent à gué le tunnel d’Ézéchias, de Guihon à Siloé."
