body:
  en:
    - "Ur lay in the far south of Mesopotamia, at the mound of Tell el-Muqayyar, 16 km south-west of modern Nasiriyah. In antiquity it stood on the Euphrates near the head of the Gulf; the river and the coast have since moved away. It was settled already in the Ubaid period, the prehistoric age of southern Mesopotamia, and became one of the great Sumerian cities, sacred to the moon god Nanna. Leonard Woolley's excavations of 1922–1934 uncovered the Royal Cemetery of the mid-third millennium BC, with its gold, lyres and the so-called Standard of Ur."
    - "Its height was the Third Dynasty of Ur (c. 2112–2004 BC in the middle chronology). Ur-Nammu and his son Shulgi ruled Sumer and Akkad from here, and Ur-Nammu built the ziggurat whose lower stages still stand. About 2004 BC the Elamites took the city and carried off its last king, Ibbi-Sin, a disaster mourned in the Lament for Sumer and Ur. Ur recovered and lived on as a temple city under later Babylonian kings."
    - "Genesis says that Terah set out with Abram from Ur of the Chaldees to go to Canaan and settled at Haran; Nehemiah and Stephen's speech in Acts recall the departure. Most scholars identify this Ur with Tell el-Muqayyar, but the identification is debated: an old tradition points to Urfa in northern Mesopotamia, and some scholars have argued for an Ur in the north, nearer Haran."
    - "In the sixth century BC Nebuchadnezzar and Nabonidus rebuilt Ur's temples. Nabonidus restored the ziggurat and made his daughter high priestess of the moon god, and his inscribed cylinders from the ziggurat name his son Belshazzar. After the Persian conquest the city declined, perhaps as the Euphrates shifted its course, and it was abandoned in the Persian period, long before the end of antiquity."
  ru:
    - "Ур лежал на крайнем юге Месопотамии, на холме Телль-эль-Мукайяр, в 16 км к юго-западу от нынешней Насирии. В древности он стоял на Евфрате, недалеко от вершины Персидского залива; с тех пор и река, и берег отступили. Здесь жили уже в убейдский период, доисторическую эпоху юга Месопотамии, а затем Ур стал одним из великих шумерских городов, городом бога луны Нанны. Раскопки Леонарда Вулли в 1922–1934 гг. открыли Царское кладбище середины III тысячелетия до н. э. с его золотом, лирами и так называемым Штандартом из Ура."
    - "Вершиной его истории стала III династия Ура (ок. 2112–2004 гг. до н. э. по средней хронологии). Ур-Намму и его сын Шульги правили отсюда Шумером и Аккадом, а Ур-Намму построил зиккурат, нижние ярусы которого стоят до сих пор. Около 2004 г. до н. э. эламиты взяли город и увели его последнего царя Ибби-Сина; об этой беде скорбит «Плач о гибели Шумера и Ура». Ур оправился и продолжал жить как храмовый город при позднейших вавилонских царях."
    - "Книга Бытия говорит, что Фарра вышел с Аврамом из Ура Халдейского, чтобы идти в землю Ханаанскую, и поселился в Харране; об этом исходе вспоминают Неемия и речь Стефана в Деяниях. Большинство учёных отождествляют этот Ур с Телль-эль-Мукайяром, но отождествление спорно: давнее предание указывает на Урфу в северной Месопотамии, а некоторые исследователи предлагали искать Ур на севере, ближе к Харрану."
    - "В VI веке до н. э. Навуходоносор и Набонид отстроили храмы Ура. Набонид восстановил зиккурат и поставил свою дочь верховной жрицей бога луны, а его надписи на цилиндрах из зиккурата называют его сына Валтасара. После персидского завоевания город пришёл в упадок, возможно, потому, что Евфрат изменил русло, и ещё в персидское время был покинут — задолго до конца античности."
  uk:
    - "Ур лежав на крайньому півдні Месопотамії, на пагорбі Телль-ель-Мукайяр, за 16 км на південний захід від сучасної Насірії. У давнину він стояв на Євфраті біля верхів’я затоки; ріка й узбережжя відтоді відійшли. Його заселили вже в убайдську добу, доісторичну епоху південної Месопотамії, і він став одним із великих шумерських міст, присвячених богу місяця Нанні. Розкопки Леонарда Вуллі 1922–1934 років відкрили Царський цвинтар середини III тис. до н. е. із золотом, лірами і так званим Штандартом з Ура."
    - "Його розквітом була Третя династія Ура (бл. 2112–2004 рр. до н. е. за середньою хронологією). Ур-Намму та його син Шульгі правили Шумером і Аккадом звідси, а Ур-Намму збудував зикурат, нижні яруси якого стоять і досі. Близько 2004 р. до н. е. еламіти взяли місто і вивезли його останнього царя Ібі-Сіна, катастрофу, оплакану в «Плачі за Шумером і Уром». Ур оговтався і жив далі як храмове місто за пізніших вавилонських царів."
    - "Книга Буття каже, що Тара вирушив з Аврамом з Ура Халдейського, щоб іти в Ханаан, і оселився в Харані; Неемія і промова Стефана в Діях згадують цей вихід. Більшість учених ототожнюють цей Ур із Телль-ель-Мукайяром, але ототожнення дискутується: давня традиція вказує на Урфу в північній Месопотамії, а деякі вчені доводили, що Ур був на півночі, ближче до Харана."
    - "У VI ст. до н. е. Навуходоносор і Набонід відбудували храми Ура. Набонід відновив зикурат і зробив свою доньку верховною жрицею бога місяця, а його циліндри з написами із зикурата називають його сина Валтасара. Після перського завоювання місто занепало, можливо, коли Євфрат змінив русло, і було покинуте в перську добу, задовго до кінця давнини."
  es:
    - "Ur estaba en el extremo sur de Mesopotamia, en el montículo de Tell el-Muqayyar, a 16 km al suroeste de la actual Nasiriyah. En la Antigüedad se alzaba junto al Éufrates, cerca de la cabecera del Golfo; el río y la costa se han alejado desde entonces. Estaba ya habitada en el período de Ubaid, la edad prehistórica del sur de Mesopotamia, y llegó a ser una de las grandes ciudades sumerias, consagrada al dios lunar Nanna. Las excavaciones de Leonard Woolley de 1922–1934 sacaron a la luz el Cementerio Real de mediados del tercer milenio a. C., con su oro, sus liras y el llamado Estandarte de Ur."
    - "Su apogeo fue la tercera dinastía de Ur (h. 2112–2004 a. C. en la cronología media). Ur-Nammu y su hijo Shulgi gobernaron desde aquí Sumer y Acad, y Ur-Nammu construyó el zigurat cuyos pisos inferiores aún se mantienen en pie. Hacia 2004 a. C. los elamitas tomaron la ciudad y se llevaron a su último rey, Ibbi-Sin, un desastre lamentado en el Lamento por Sumer y Ur. Ur se recuperó y siguió existiendo como ciudad de templos bajo reyes babilonios posteriores."
    - "El Génesis dice que Taré salió con Abram de Ur de los Caldeos para ir a Canaán y se estableció en Harán; Nehemías y el discurso de Esteban en los Hechos recuerdan la partida. La mayoría de los estudiosos identifican esta Ur con Tell el-Muqayyar, pero la identificación se debate: una antigua tradición señala Urfa, en el norte de Mesopotamia, y algunos estudiosos han defendido una Ur en el norte, más cercana a Harán."
    - "En el siglo VI a. C. Nabucodonosor y Nabonido reconstruyeron los templos de Ur. Nabonido restauró el zigurat e hizo a su hija suma sacerdotisa del dios lunar, y sus cilindros inscritos del zigurat nombran a su hijo Belsasar. Tras la conquista persa la ciudad declinó, quizá al cambiar el Éufrates de curso, y fue abandonada en el período persa, mucho antes del final de la Antigüedad."
  pt:
    - "Ur ficava no extremo sul da Mesopotâmia, no monte de Tell el-Muqayyar, 16 km a sudoeste da atual Nasiriyah. Na Antiguidade, erguia-se no Eufrates, perto da cabeceira do Golfo; o rio e a costa desde então se afastaram. Já era habitada no período de Ubaid, a era pré-histórica do sul da Mesopotâmia, e tornou-se uma das grandes cidades sumérias, consagrada ao deus-lua Nanna. As escavações de Leonard Woolley, em 1922–1934, revelaram o Cemitério Real de meados do terceiro milênio a.C., com seu ouro, liras e o chamado Estandarte de Ur."
    - "Seu apogeu foi a Terceira Dinastia de Ur (c. 2112–2004 a.C. na cronologia média). Ur-Nammu e seu filho Shulgi governaram Suméria e Acádia daqui, e Ur-Nammu construiu o zigurate cujos níveis inferiores ainda estão de pé. Por volta de 2004 a.C., os elamitas tomaram a cidade e levaram seu último rei, Ibbi-Sin, desastre pranteado no Lamento por Sumer e Ur. Ur se recuperou e continuou como cidade de templos sob reis babilônicos posteriores."
    - "Gênesis diz que Terá partiu com Abrão de Ur dos caldeus rumo a Canaã e se estabeleceu em Harã; Neemias e o discurso de Estêvão em Atos recordam a partida. A maioria dos estudiosos identifica essa Ur com Tell el-Muqayyar, mas a identificação é debatida: uma antiga tradição aponta Urfa, no norte da Mesopotâmia, e alguns estudiosos defenderam uma Ur no norte, mais perto de Harã."
    - "No século VI a.C., Nabucodonosor e Nabonido reconstruíram os templos de Ur. Nabonido restaurou o zigurate e fez de sua filha sumo sacerdotisa do deus-lua, e seus cilindros inscritos do zigurate nomeiam seu filho Belsazar. Depois da conquista persa, a cidade declinou, talvez quando o Eufrates mudou de curso, e foi abandonada no período persa, muito antes do fim da Antiguidade."
  de:
    - "Ur lag im äußersten Süden Mesopotamiens, am Hügel Tell el-Muqayyar, 16 km südwestlich des heutigen Nasiriyya. In der Antike stand es am Euphrat nahe dem Kopf des Golfs; Fluss und Küste haben sich seither entfernt. Es war schon in der Ubaid-Zeit besiedelt, dem vorgeschichtlichen Zeitalter Südmesopotamiens, und wurde eine der großen sumerischen Städte, dem Mondgott Nanna heilig. Leonard Woolleys Grabungen 1922–1934 legten den Königsfriedhof der Mitte des dritten Jahrtausends v. Chr. mit seinem Gold, den Leiern und der sogenannten Standarte von Ur frei."
    - "Seinen Höhepunkt erlebte es unter der Dritten Dynastie von Ur (ca. 2112–2004 v. Chr. nach der mittleren Chronologie). Ur-Nammu und sein Sohn Schulgi herrschten von hier über Sumer und Akkad, und Ur-Nammu baute die Zikkurat, deren untere Stufen noch stehen. Um 2004 v. Chr. nahmen die Elamiter die Stadt und führten ihren letzten König Ibbi-Sin fort, eine Katastrophe, die die Klage um Sumer und Ur beklagt. Ur erholte sich und lebte als Tempelstadt unter späteren babylonischen Königen fort."
    - "Die Genesis sagt, dass Terach mit Abram von Ur in Chaldäa auszog, um nach Kanaan zu gehen, und sich in Haran niederließ; Nehemia und die Rede des Stephanus in der Apostelgeschichte erinnern an den Aufbruch. Die meisten Forscher setzen dieses Ur mit Tell el-Muqayyar gleich, doch ist die Gleichsetzung umstritten: Eine alte Überlieferung weist auf Urfa in Nordmesopotamien, und manche Gelehrte haben für ein Ur im Norden, näher bei Haran, argumentiert."
    - "Im sechsten Jahrhundert v. Chr. bauten Nebukadnezar und Nabonid die Tempel von Ur wieder auf. Nabonid stellte die Zikkurat wieder her und machte seine Tochter zur Hohepriesterin des Mondgottes, und seine beschrifteten Zylinder aus der Zikkurat nennen seinen Sohn Belsazar. Nach der persischen Eroberung verfiel die Stadt, vielleicht weil der Euphrat seinen Lauf verlagerte, und wurde in der Perserzeit aufgegeben, lange vor dem Ende der Antike."
  fr:
    - "Ur se trouvait à l’extrême sud de la Mésopotamie, sur le tertre de Tell el-Muqayyar, à 16 km au sud-ouest de l’actuelle Nassiriya. Dans l’Antiquité, elle se dressait sur l’Euphrate près du fond du golfe ; le fleuve et la côte s’en sont depuis éloignés. Elle était déjà habitée à la période d’Obeïd, l’âge préhistorique de la Mésopotamie du sud, et devint l’une des grandes cités sumériennes, consacrée au dieu-lune Nanna. Les fouilles de Leonard Woolley en 1922-1934 dégagèrent le cimetière royal du milieu du IIIe millénaire av. J.-C., avec son or, ses lyres et le prétendu Étendard d’Ur."
    - "Son apogée fut la troisième dynastie d’Ur (vers 2112-2004 av. J.-C. selon la chronologie moyenne). Ur-Nammu et son fils Shulgi régnèrent d’ici sur Sumer et Akkad, et Ur-Nammu bâtit la ziggurat dont les étages inférieurs subsistent. Vers 2004 av. J.-C., les Élamites prirent la ville et emmenèrent son dernier roi, Ibbi-Sîn, désastre pleuré dans la Lamentation sur Sumer et Ur. Ur se releva et subsista comme ville-temple sous les rois babyloniens ultérieurs."
    - "La Genèse dit que Térach partit avec Abram d’Ur en Chaldée pour aller en Canaan et s’établit à Haran ; Néhémie et le discours d’Étienne dans les Actes rappellent ce départ. La plupart des spécialistes identifient cette Ur à Tell el-Muqayyar, mais l’identification est débattue : une vieille tradition désigne Urfa, dans le nord de la Mésopotamie, et certains ont plaidé pour une Ur du nord, plus proche de Haran."
    - "Au VIe siècle av. J.-C., Nebucadnetsar et Nabonide rebâtirent les temples d’Ur. Nabonide restaura la ziggurat et fit de sa fille la grande prêtresse du dieu-lune, et ses cylindres inscrits de la ziggurat nomment son fils Belschatsar. Après la conquête perse, la ville déclina, peut-être quand l’Euphrate changea de cours, et fut abandonnée à l’époque perse, bien avant la fin de l’Antiquité."
  pl:
    - "Ur leżało na dalekim południu Mezopotamii, na kopcu Tell al-Mukajjar, 16 km na południowy zachód od dzisiejszej An-Nasirijji. W starożytności stało nad Eufratem blisko północnego krańca Zatoki Perskiej; rzeka i wybrzeże od tamtej pory się oddaliły. Zasiedlono je już w okresie Ubajd, prehistorycznej epoce południowej Mezopotamii, i stało się jednym z wielkich miast sumeryjskich, poświęconym bogu księżyca Nannie. Wykopaliska Leonarda Woolleya z lat 1922–1934 odsłoniły Cmentarz Królewski z połowy III tysiąclecia p.n.e., ze złotem, lirami i tak zwaną Standartą z Ur."
    - "Jego szczytem była III dynastia z Ur (ok. 2112–2004 p.n.e. według chronologii średniej). Ur-Nammu i jego syn Szulgi władali stąd Sumerem i Akadem, a Ur-Nammu zbudował zigurat, którego niższe poziomy wciąż stoją. Około 2004 roku p.n.e. Elamici zdobyli miasto i uprowadzili jego ostatniego króla, Ibbi-Sina, klęskę opłakiwaną w Lamencie nad Sumerem i Ur. Ur podniosło się i żyło dalej jako miasto świątynne za późniejszych królów babilońskich."
    - "Księga Rodzaju mówi, że Terach wyruszył z Abramem z Ur Chaldejskiego, by iść do Kanaanu, i osiadł w Charanie; Nehemiasz i przemówienie Szczepana w Dziejach Apostolskich przypominają to wyjście. Większość badaczy utożsamia to Ur z Tell al-Mukajjar, ale utożsamienie jest sporne: dawna tradycja wskazuje na Urfę w północnej Mezopotamii, a niektórzy uczeni dowodzili Ur na północy, bliżej Charanu."
    - "W VI wieku p.n.e. Nabuchodonozor i Nabonid odbudowali świątynie Ur. Nabonid odnowił zigurat i uczynił swą córkę najwyższą kapłanką boga księżyca, a jego cylindry z napisami z zigguratu wymieniają jego syna Belszassara. Po podboju perskim miasto podupadło, być może gdy Eufrat zmienił bieg, i opuszczono je w okresie perskim, na długo przed końcem starożytności."
  it:
    - "Ur sorgeva nell’estremo sud della Mesopotamia, nel tell di Tell el-Muqayyar, 16 km a sud-ovest dell’odierna Nasiriyah. Nell’antichità si trovava sull’Eufrate presso la testa del Golfo; il fiume e la costa si sono poi allontanati. Era abitata già nel periodo di Ubaid, l’età preistorica della Mesopotamia meridionale, e divenne una delle grandi città sumere, sacra al dio lunare Nanna. Gli scavi di Leonard Woolley del 1922–1934 portarono alla luce il Cimitero Reale della metà del III millennio a.C., con i suoi ori, le sue lire e il cosiddetto Stendardo di Ur."
    - "La sua epoca più alta fu la Terza dinastia di Ur (2112–2004 a.C. circa nella cronologia media). Ur-Nammu e suo figlio Shulgi governarono da qui Sumer e Akkad, e Ur-Nammu costruì la ziggurat i cui piani inferiori sono ancora in piedi. Verso il 2004 a.C. gli Elamiti presero la città e portarono via il suo ultimo re, Ibbi-Sin, una catastrofe pianta nel Lamento per Sumer e Ur. Ur si riprese e sopravvisse come città di templi sotto i re babilonesi successivi."
    - "La Genesi dice che Terach partì con Abram da Ur dei Caldei per andare in Canaan e si stabilì a Carran; Neemia e il discorso di Stefano negli Atti ricordano la partenza. La maggior parte degli studiosi identifica questa Ur con Tell el-Muqayyar, ma l’identificazione è discussa: un’antica tradizione indica Urfa nella Mesopotamia settentrionale, e alcuni studiosi hanno sostenuto un’Ur nel nord, più vicina a Carran."
    - "Nel VI secolo a.C. Nabucodonosor e Nabonedo ricostruirono i templi di Ur. Nabonedo restaurò la ziggurat e fece della figlia la somma sacerdotessa del dio lunare, e i suoi cilindri iscritti dalla ziggurat nominano suo figlio Baldassarre. Dopo la conquista persiana la città decadde, forse perché l’Eufrate mutò corso, e fu abbandonata in epoca persiana, ben prima della fine dell’antichità."
  nl:
    - "Ur lag in het uiterste zuiden van Mesopotamië, bij de heuvel Tell el-Muqayyar, 16 km ten zuidwesten van het huidige Nasiriyah. In de oudheid lag het aan de Eufraat bij het binnenste uiteinde van de Golf; de rivier en de kust zijn sindsdien weggetrokken. Het werd al in de Ubaid-periode bewoond, het prehistorische tijdperk van zuidelijk Mesopotamië, en werd een van de grote Sumerische steden, gewijd aan de maangod Nanna. De opgravingen van Leonard Woolley in 1922–1934 legden de Koninklijke Begraafplaats uit het midden van het derde millennium v.Chr. bloot, met haar goud, lieren en de zogenaamde Standaard van Ur."
    - "Zijn hoogtepunt was de Derde dynastie van Ur (ca. 2112–2004 v.Chr. in de middenchronologie). Ur-Nammu en zijn zoon Sulgi regeerden van hieruit over Soemer en Akkad, en Ur-Nammu bouwde de ziggoerat waarvan de onderste terrassen nog staan. Omstreeks 2004 v.Chr. namen de Elamieten de stad in en voerden haar laatste koning, Ibbi-Sin, weg, een ramp die in de Klaagzang over Soemer en Ur wordt betreurd. Ur herstelde zich en bleef bestaan als tempelstad onder latere Babylonische koningen."
    - "Genesis zegt dat Terach met Abram uit Ur der Chaldeeën vertrok om naar Kanaän te gaan en zich in Haran vestigde; Nehemia en de rede van Stefanus in Handelingen herinneren aan het vertrek. De meeste geleerden vereenzelvigen dit Ur met Tell el-Muqayyar, maar de gelijkstelling wordt betwist: een oude overlevering wijst naar Urfa in het noorden van Mesopotamië, en sommige geleerden hebben gepleit voor een Ur in het noorden, dichter bij Haran."
    - "In de zesde eeuw v.Chr. herbouwden Nebukadnessar en Nabonidus de tempels van Ur. Nabonidus herstelde de ziggoerat en maakte zijn dochter hogepriesteres van de maangod, en zijn beschreven cilinders uit de ziggoerat noemen zijn zoon Belsazar. Na de Perzische verovering ging de stad achteruit, misschien doordat de Eufraat van loop veranderde, en ze werd in de Perzische tijd verlaten, lang voor het einde van de oudheid."
  cs:
    - "Ur ležel na dalekém jihu Mezopotámie, na pahorku Tell el-Muqajjar, 16 km jihozápadně od dnešní Násiríje. Ve starověku stál na Eufratu poblíž nejzazšího konce zálivu; řeka i pobřeží se od té doby vzdálily. Byl osídlen už v období Ubajd, pravěkém věku jižní Mezopotámie, a stal se jedním z velkých sumerských měst, zasvěceným bohu měsíce Nannovi. Vykopávky Leonarda Woolleyho v letech 1922–1934 odkryly Královskou nekropoli z poloviny 3. tisíciletí př. n. l. se zlatem, lyrami a takzvanou Standartou z Uru."
    - "Jeho vrcholem byla Třetí dynastie z Uru (asi 2112–2004 př. n. l. podle střední chronologie). Ur-Nammu a jeho syn Šulgi odtud vládli Sumeru a Akkadu a Ur-Nammu postavil zikkurat, jehož spodní stupně dosud stojí. Kolem roku 2004 př. n. l. Élamité město dobyli a odvedli jeho posledního krále Ibbi-Sina, pohromu oplakávanou v Nářku nad Sumerem a Urem. Ur se zotavil a žil dál jako chrámové město pod pozdějšími babylónskými králi."
    - "Genesis říká, že Terach vyšel s Abramem z Uru Kaldejských, aby šel do Kanaánu, a usadil se v Cháranu; Nehemjáš a Štěpánova řeč ve Skutcích si odchod připomínají. Většina učenců ztotožňuje tento Ur s Tell el-Muqajjar, ale ztotožnění je sporné: stará tradice ukazuje na Urfu v severní Mezopotámii a někteří učenci hájili Ur na severu, blíže Cháranu."
    - "V 6. století př. n. l. Nebukadnesar a Nabonid znovu vystavěli chrámy Uru. Nabonid obnovil zikkurat a učinil svou dceru velekněžkou boha měsíce a jeho nápisové válce ze zikkuratu jmenují jeho syna Belšasara. Po perském dobytí město upadalo, snad když Eufrat změnil tok, a bylo opuštěno v perském období, dlouho před koncem antiky."
  sv:
    - "Ur låg längst i söder i Mesopotamien, vid kullen Tell el-Muqayyar, 16 km sydväst om nutidens Nasiriyah. I antiken låg det vid Eufrat nära vikens inre del; floden och kusten har sedan flyttat sig bort. Det var bebott redan under Ubaidperioden, södra Mesopotamiens förhistoriska tidsålder, och blev en av de stora sumeriska städerna, helgad åt månguden Nanna. Leonard Woolleys utgrävningar 1922–1934 frilade den kungliga begravningsplatsen från mitten av tredje årtusendet f.Kr., med dess guld, lyror och den så kallade Urstandarden."
    - "Dess höjdpunkt var Urs tredje dynasti (ca 2112–2004 f.Kr. i mellankronologin). Ur-Nammu och hans son Shulgi styrde Sumer och Akkad härifrån, och Ur-Nammu byggde zigguraten vars nedre våningar fortfarande står. Omkring 2004 f.Kr. intog elamiterna staden och förde bort dess siste kung, Ibbi-Sin, en katastrof som begråts i Klagosången över Sumer och Ur. Ur återhämtade sig och levde vidare som tempelstad under senare babyloniska kungar."
    - "Första Moseboken säger att Tera drog ut med Abram från Ur i Kaldeen för att fara till Kanaan och bosatte sig i Harran; Nehemja och Stefanos' tal i Apostlagärningarna erinrar om uppbrottet. De flesta forskare identifierar detta Ur med Tell el-Muqayyar, men identifieringen är omdebatterad: en gammal tradition pekar på Urfa i norra Mesopotamien, och några forskare har argumenterat för ett Ur i norr, närmare Harran."
    - "På 500-talet f.Kr. byggde Nebukadnessar och Nabonid upp Urs tempel. Nabonid återställde zigguraten och gjorde sin dotter till överstepräst för månguden, och hans inskrivna cylindrar från zigguraten nämner hans son Belshassar. Efter den persiska erövringen förföll staden, kanske när Eufrat ändrade sitt lopp, och den övergavs under persertiden, långt före antikens slut."
  nb:
    - "Ur lå helt sør i Mesopotamia, ved haugen Tell el-Muqayyar, 16 km sørvest for dagens Nasiriyah. I antikken sto den ved Eufrat nær innerste del av Persiabukta; elven og kysten har siden flyttet seg bort. Den var bosatt allerede i Ubaid-perioden, den forhistoriske tiden i det sørlige Mesopotamia, og ble en av de store sumeriske byene, viet til månegudden Nanna. Leonard Woolleys utgravninger i 1922–1934 avdekket den kongelige gravplassen fra midten av 3. årtusen f.Kr., med gull, lyrer og den såkalte Ur-standarden."
    - "Høydepunktet var Tredje dynasti i Ur (ca. 2112–2004 f.Kr. i mellomkronologien). Ur-Nammu og sønnen Sjulgi styrte Sumer og Akkad herfra, og Ur-Nammu bygde zigguraten, hvis nedre trinn fortsatt står. Omkring 2004 f.Kr. inntok elamittene byen og førte bort den siste kongen, Ibbi-Sin, en katastrofe som ble sørget over i klagesangen over Sumer og Ur. Ur kom seg og levde videre som en tempelby under senere babylonske konger."
    - "Første Mosebok sier at Tarah dro ut med Abram fra Ur i Kaldea for å dra til Kanaan og bosatte seg i Harran; Nehemja og Stefanus' tale i Apostlenes gjerninger minnes utreisen. De fleste forskere identifiserer denne Ur med Tell el-Muqayyar, men identifikasjonen er omdiskutert: en gammel tradisjon peker på Urfa i nordlige Mesopotamia, og noen forskere har hevdet en Ur i nord, nærmere Harran."
    - "På 500-tallet f.Kr. gjenreiste Nebukadnesar og Nabonid Urs templer. Nabonid restaurerte zigguraten og gjorde datteren sin til yppersteprestinne for månegudden, og hans innskrevne sylindre fra zigguraten nevner sønnen Belsasar. Etter den persiske erobringen sank byen hen, kanskje fordi Eufrat flyttet løpet sitt, og den ble forlatt i persisk tid, lenge før antikkens slutt."
  tl:
    - "Ang Ur ay nasa dulong timog ng Mesopotamia, sa burol ng Tell el-Muqayyar, 16 km sa timog-kanluran ng makabagong Nasiriyah. Noong sinaunang panahon, nakatayo ito sa Eufrates malapit sa dulo ng golpo; lumayo na mula roon ang ilog at baybayin. Tinirhan na ito noong panahon ng Ubaid, ang prehistorikong panahon ng timugang Mesopotamia, at naging isa sa mga dakilang lunsod ng Sumer, banal sa diyos-buwan na si Nanna. Ang mga paghuhukay ni Leonard Woolley noong 1922–1934 ay naglantad ng Maharlikang Sementeryo ng kalagitnaan ng ikatlong milenyo BK, na may ginto, mga lira at ang tinatawag na Pamantayan ng Ur."
    - "Ang tugatog nito ay ang Ikatlong Dinastiya ng Ur (c. 2112–2004 BK sa gitnang kronolohiya). Dito namahala sa Sumer at Akkad sina Ur-Nammu at ang anak niyang si Shulgi, at itinayo ni Ur-Nammu ang ziggurat na ang ibabang mga antas ay nakatayo pa. Noong mga 2004 BK, sinakop ng mga Elamita ang lunsod at dinala ang huling hari nito, si Ibbi-Sin, isang sakunang inaawit sa Panambitan para sa Sumer at Ur. Nakabawi ang Ur at nagpatuloy bilang lunsod ng templo sa ilalim ng mga huling haring Babilonyo."
    - "Sinasabi ng Genesis na lumabas si Thare kasama ni Abram mula sa Ur ng mga Caldeo patungong Canaan at nanirahan sa Haran; inaalala ng Nehemias at ng talumpati ni Esteban sa Mga Gawa ang pag-alis. Karamihan ng iskolar ay kumikilala sa Ur na ito sa Tell el-Muqayyar, ngunit pinagtatalunan ang pagkakakilanlan: tinuturo ng sinaunang tradisyon ang Urfa sa hilagang Mesopotamia, at may mga iskolar na nagtataguyod ng isang Ur sa hilaga, mas malapit sa Haran."
    - "Noong ika-6 na siglo BK, itinayong muli nina Nabucodonosor at Nabonido ang mga templo ng Ur. Ibinalik ni Nabonido ang ziggurat at ginawang mataas na saserdotisa ng diyos-buwan ang kaniyang anak na babae, at ang kaniyang mga silindrong may inskripsiyon mula sa ziggurat ay pinangangalanan ang anak niyang si Belsasar. Pagkaraan ng pananakop ng Persiya, humina ang lunsod, marahil nang lumipat ang daloy ng Eufrates, at iniwan ito sa panahong Persiyano, matagal bago ang wakas ng antigüedad."
