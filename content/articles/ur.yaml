# Overview article (ADR 0007). Mainstream facts only; Mesopotamian dates follow the middle chronology.
# The identification of Abraham's Ur with Tell el-Muqayyar is the usual one but debated; said so.
id: ur
place: a6cf75c
title:
  en: "Ur"
  ru: "Ур"
  uk: "Ур"
  es: "Ur"
  pt: "Ur"
  de: "Ur"
  fr: "Ur"
body:
  en:
    - "Ur lay in the far south of Mesopotamia, at the mound of Tell el-Muqayyar, 16 km south-west of modern Nasiriyah. In antiquity it stood on the Euphrates near the head of the Gulf; the river and the coast have since moved away. It was settled already in the Ubaid period, the prehistoric age of southern Mesopotamia, and became one of the great Sumerian cities, sacred to the moon god Nanna. Leonard Woolley's excavations of 1922–1934 uncovered the Royal Cemetery of the mid-third millennium BC, with its gold, lyres and the so-called Standard of Ur."
    - "Its height was the Third Dynasty of Ur (c. 2112–2004 BC in the middle chronology). Ur-Nammu and his son Shulgi ruled Sumer and Akkad from here, and Ur-Nammu built the ziggurat whose lower stages still stand. About 2004 BC the Elamites took the city and carried off its last king, Ibbi-Sin, a disaster mourned in the Lament for Sumer and Ur. Ur recovered and lived on as a temple city under later Babylonian kings."
    - "Genesis says that Terah set out with Abram from Ur of the Chaldees to go to Canaan and settled at Haran; Nehemiah and Stephen's speech in Acts recall the departure. Most scholars identify this Ur with Tell el-Muqayyar, but the identification is debated: an old tradition points to Urfa in northern Mesopotamia, and some scholars have argued for an Ur in the north, nearer Haran."
    - "In the sixth century BC Nebuchadnezzar and Nabonidus rebuilt Ur's temples. Nabonidus restored the ziggurat and made his daughter high priestess of the moon god, and his inscribed cylinders from the ziggurat name his son Belshazzar. After the Persian conquest the city declined, perhaps as the Euphrates shifted its course, and it was abandoned in the Persian period, long before the end of antiquity."
  ru:
    - "Ур лежал на крайнем юге Месопотамии, на холме Телль-эль-Мукайяр, в 16 км к юго-западу от нынешней Насирии. В древности он стоял на Евфрате, недалеко от вершины Персидского залива; с тех пор и река, и берег отступили. Здесь жили уже в убейдский период, доисторическую эпоху юга Месопотамии, а затем Ур стал одним из великих шумерских городов, городом бога луны Нанны. Раскопки Леонарда Вулли в 1922–1934 гг. открыли Царское кладбище середины III тысячелетия до н. э. с его золотом, лирами и так называемым Штандартом из Ура."
    - "Вершиной его истории стала III династия Ура (ок. 2112–2004 гг. до н. э. по средней хронологии). Ур-Намму и его сын Шульги правили отсюда Шумером и Аккадом, а Ур-Намму построил зиккурат, нижние ярусы которого стоят до сих пор. Около 2004 г. до н. э. эламиты взяли город и увели его последнего царя Ибби-Сина; об этой беде скорбит «Плач о гибели Шумера и Ура». Ур оправился и продолжал жить как храмовый город при позднейших вавилонских царях."
    - "Книга Бытия говорит, что Фарра вышел с Аврамом из Ура Халдейского, чтобы идти в землю Ханаанскую, и поселился в Харране; об этом исходе вспоминают Неемия и речь Стефана в Деяниях. Большинство учёных отождествляют этот Ур с Телль-эль-Мукайяром, но отождествление спорно: давнее предание указывает на Урфу в северной Месопотамии, а некоторые исследователи предлагали искать Ур на севере, ближе к Харрану."
    - "В VI веке до н. э. Навуходоносор и Набонид отстроили храмы Ура. Набонид восстановил зиккурат и поставил свою дочь верховной жрицей бога луны, а его надписи на цилиндрах из зиккурата называют его сына Валтасара. После персидского завоевания город пришёл в упадок, возможно, потому, что Евфрат изменил русло, и ещё в персидское время был покинут — задолго до конца античности."
  uk:
    - "Ур лежав на крайньому півдні Месопотамії, на пагорбі Телль-ель-Мукайяр, за 16 км на південний захід від сучасної Насірії. У давнину він стояв на Євфраті біля верхів’я затоки; ріка й узбережжя відтоді відійшли. Його заселили вже в убайдську добу, доісторичну епоху південної Месопотамії, і він став одним із великих шумерських міст, присвячених богу місяця Нанні. Розкопки Леонарда Вуллі 1922–1934 років відкрили Царський цвинтар середини III тис. до н. е. із золотом, лірами і так званим Штандартом з Ура."
    - "Його розквітом була Третя династія Ура (бл. 2112–2004 рр. до н. е. за середньою хронологією). Ур-Намму та його син Шульгі правили Шумером і Аккадом звідси, а Ур-Намму збудував зикурат, нижні яруси якого стоять і досі. Близько 2004 р. до н. е. еламіти взяли місто і вивезли його останнього царя Ібі-Сіна, катастрофу, оплакану в «Плачі за Шумером і Уром». Ур оговтався і жив далі як храмове місто за пізніших вавилонських царів."
    - "Книга Буття каже, що Тара вирушив з Аврамом з Ура Халдейського, щоб іти в Ханаан, і оселився в Харані; Неемія і промова Стефана в Діях згадують цей вихід. Більшість учених ототожнюють цей Ур із Телль-ель-Мукайяром, але ототожнення дискутується: давня традиція вказує на Урфу в північній Месопотамії, а деякі вчені доводили, що Ур був на півночі, ближче до Харана."
    - "У VI ст. до н. е. Навуходоносор і Набонід відбудували храми Ура. Набонід відновив зикурат і зробив свою доньку верховною жрицею бога місяця, а його циліндри з написами із зикурата називають його сина Валтасара. Після перського завоювання місто занепало, можливо, коли Євфрат змінив русло, і було покинуте в перську добу, задовго до кінця давнини."
  es:
    - "Ur estaba en el extremo sur de Mesopotamia, en el montículo de Tell el-Muqayyar, a 16 km al suroeste de la actual Nasiriyah. En la Antigüedad se alzaba junto al Éufrates, cerca de la cabecera del Golfo; el río y la costa se han alejado desde entonces. Estaba ya habitada en el período de Ubaid, la edad prehistórica del sur de Mesopotamia, y llegó a ser una de las grandes ciudades sumerias, consagrada al dios lunar Nanna. Las excavaciones de Leonard Woolley de 1922–1934 sacaron a la luz el Cementerio Real de mediados del tercer milenio a. C., con su oro, sus liras y el llamado Estandarte de Ur."
    - "Su apogeo fue la tercera dinastía de Ur (h. 2112–2004 a. C. en la cronología media). Ur-Nammu y su hijo Shulgi gobernaron desde aquí Sumer y Acad, y Ur-Nammu construyó el zigurat cuyos pisos inferiores aún se mantienen en pie. Hacia 2004 a. C. los elamitas tomaron la ciudad y se llevaron a su último rey, Ibbi-Sin, un desastre lamentado en el Lamento por Sumer y Ur. Ur se recuperó y siguió existiendo como ciudad de templos bajo reyes babilonios posteriores."
    - "El Génesis dice que Taré salió con Abram de Ur de los Caldeos para ir a Canaán y se estableció en Harán; Nehemías y el discurso de Esteban en los Hechos recuerdan la partida. La mayoría de los estudiosos identifican esta Ur con Tell el-Muqayyar, pero la identificación se debate: una antigua tradición señala Urfa, en el norte de Mesopotamia, y algunos estudiosos han defendido una Ur en el norte, más cercana a Harán."
    - "En el siglo VI a. C. Nabucodonosor y Nabonido reconstruyeron los templos de Ur. Nabonido restauró el zigurat e hizo a su hija suma sacerdotisa del dios lunar, y sus cilindros inscritos del zigurat nombran a su hijo Belsasar. Tras la conquista persa la ciudad declinó, quizá al cambiar el Éufrates de curso, y fue abandonada en el período persa, mucho antes del final de la Antigüedad."
  pt:
    - "Ur ficava no extremo sul da Mesopotâmia, no monte de Tell el-Muqayyar, 16 km a sudoeste da atual Nasiriyah. Na Antiguidade, erguia-se no Eufrates, perto da cabeceira do Golfo; o rio e a costa desde então se afastaram. Já era habitada no período de Ubaid, a era pré-histórica do sul da Mesopotâmia, e tornou-se uma das grandes cidades sumérias, consagrada ao deus-lua Nanna. As escavações de Leonard Woolley, em 1922–1934, revelaram o Cemitério Real de meados do terceiro milênio a.C., com seu ouro, liras e o chamado Estandarte de Ur."
    - "Seu apogeu foi a Terceira Dinastia de Ur (c. 2112–2004 a.C. na cronologia média). Ur-Nammu e seu filho Shulgi governaram Suméria e Acádia daqui, e Ur-Nammu construiu o zigurate cujos níveis inferiores ainda estão de pé. Por volta de 2004 a.C., os elamitas tomaram a cidade e levaram seu último rei, Ibbi-Sin, desastre pranteado no Lamento por Sumer e Ur. Ur se recuperou e continuou como cidade de templos sob reis babilônicos posteriores."
    - "Gênesis diz que Terá partiu com Abrão de Ur dos caldeus rumo a Canaã e se estabeleceu em Harã; Neemias e o discurso de Estêvão em Atos recordam a partida. A maioria dos estudiosos identifica essa Ur com Tell el-Muqayyar, mas a identificação é debatida: uma antiga tradição aponta Urfa, no norte da Mesopotâmia, e alguns estudiosos defenderam uma Ur no norte, mais perto de Harã."
    - "No século VI a.C., Nabucodonosor e Nabonido reconstruíram os templos de Ur. Nabonido restaurou o zigurate e fez de sua filha sumo sacerdotisa do deus-lua, e seus cilindros inscritos do zigurate nomeiam seu filho Belsazar. Depois da conquista persa, a cidade declinou, talvez quando o Eufrates mudou de curso, e foi abandonada no período persa, muito antes do fim da Antiguidade."
  de:
    - "Ur lag im äußersten Süden Mesopotamiens, am Hügel Tell el-Muqayyar, 16 km südwestlich des heutigen Nasiriyya. In der Antike stand es am Euphrat nahe dem Kopf des Golfs; Fluss und Küste haben sich seither entfernt. Es war schon in der Ubaid-Zeit besiedelt, dem vorgeschichtlichen Zeitalter Südmesopotamiens, und wurde eine der großen sumerischen Städte, dem Mondgott Nanna heilig. Leonard Woolleys Grabungen 1922–1934 legten den Königsfriedhof der Mitte des dritten Jahrtausends v. Chr. mit seinem Gold, den Leiern und der sogenannten Standarte von Ur frei."
    - "Seinen Höhepunkt erlebte es unter der Dritten Dynastie von Ur (ca. 2112–2004 v. Chr. nach der mittleren Chronologie). Ur-Nammu und sein Sohn Schulgi herrschten von hier über Sumer und Akkad, und Ur-Nammu baute die Zikkurat, deren untere Stufen noch stehen. Um 2004 v. Chr. nahmen die Elamiter die Stadt und führten ihren letzten König Ibbi-Sin fort, eine Katastrophe, die die Klage um Sumer und Ur beklagt. Ur erholte sich und lebte als Tempelstadt unter späteren babylonischen Königen fort."
    - "Die Genesis sagt, dass Terach mit Abram von Ur in Chaldäa auszog, um nach Kanaan zu gehen, und sich in Haran niederließ; Nehemia und die Rede des Stephanus in der Apostelgeschichte erinnern an den Aufbruch. Die meisten Forscher setzen dieses Ur mit Tell el-Muqayyar gleich, doch ist die Gleichsetzung umstritten: Eine alte Überlieferung weist auf Urfa in Nordmesopotamien, und manche Gelehrte haben für ein Ur im Norden, näher bei Haran, argumentiert."
    - "Im sechsten Jahrhundert v. Chr. bauten Nebukadnezar und Nabonid die Tempel von Ur wieder auf. Nabonid stellte die Zikkurat wieder her und machte seine Tochter zur Hohepriesterin des Mondgottes, und seine beschrifteten Zylinder aus der Zikkurat nennen seinen Sohn Belsazar. Nach der persischen Eroberung verfiel die Stadt, vielleicht weil der Euphrat seinen Lauf verlagerte, und wurde in der Perserzeit aufgegeben, lange vor dem Ende der Antike."
  fr:
    - "Ur se trouvait à l’extrême sud de la Mésopotamie, sur le tertre de Tell el-Muqayyar, à 16 km au sud-ouest de l’actuelle Nassiriya. Dans l’Antiquité, elle se dressait sur l’Euphrate près du fond du golfe ; le fleuve et la côte s’en sont depuis éloignés. Elle était déjà habitée à la période d’Obeïd, l’âge préhistorique de la Mésopotamie du sud, et devint l’une des grandes cités sumériennes, consacrée au dieu-lune Nanna. Les fouilles de Leonard Woolley en 1922-1934 dégagèrent le cimetière royal du milieu du IIIe millénaire av. J.-C., avec son or, ses lyres et le prétendu Étendard d’Ur."
    - "Son apogée fut la troisième dynastie d’Ur (vers 2112-2004 av. J.-C. selon la chronologie moyenne). Ur-Nammu et son fils Shulgi régnèrent d’ici sur Sumer et Akkad, et Ur-Nammu bâtit la ziggurat dont les étages inférieurs subsistent. Vers 2004 av. J.-C., les Élamites prirent la ville et emmenèrent son dernier roi, Ibbi-Sîn, désastre pleuré dans la Lamentation sur Sumer et Ur. Ur se releva et subsista comme ville-temple sous les rois babyloniens ultérieurs."
    - "La Genèse dit que Térach partit avec Abram d’Ur en Chaldée pour aller en Canaan et s’établit à Haran ; Néhémie et le discours d’Étienne dans les Actes rappellent ce départ. La plupart des spécialistes identifient cette Ur à Tell el-Muqayyar, mais l’identification est débattue : une vieille tradition désigne Urfa, dans le nord de la Mésopotamie, et certains ont plaidé pour une Ur du nord, plus proche de Haran."
    - "Au VIe siècle av. J.-C., Nebucadnetsar et Nabonide rebâtirent les temples d’Ur. Nabonide restaura la ziggurat et fit de sa fille la grande prêtresse du dieu-lune, et ses cylindres inscrits de la ziggurat nomment son fils Belschatsar. Après la conquête perse, la ville déclina, peut-être quand l’Euphrate changea de cours, et fut abandonnée à l’époque perse, bien avant la fin de l’Antiquité."
