# Overview article (ADR 0007). Mainstream facts only; the course of Saul's last battle follows 1 Samuel 28-31.
id: mount-gilboa
place: acf57c5
title:
  en: "Mount Gilboa"
  ru: "Гора Гелвуй"
  uk: "Гора Гільбоа"
  es: "Monte Gilboa"
  pt: "Monte Gilboa"
  de: "Gilboa"
  fr: "Mont Guilboa"
  it: "Monte Gelboe"
  pl: "Góra Gilboa"
  nl: "Gilboa"
  cs: "Gilboa"
  sv: "Gilboa"
body:
  en:
    - "Mount Gilboa is a ridge about 18 km long on the south-eastern edge of the valley of Jezreel, rising to 536 m above the sea at its highest peak and falling steeply on the north-east towards Beth-shan and the Jordan. The spring of Harod, where Gideon camped against Midian, lies at its north-western foot, and Jezreel stood on a spur at its north-western end; the valley between it and the hill of Moreh, with Shunem at Moreh's foot, was the battlefield of Saul's last day. Its Arabic name, Jebel Fuqu'a, is shared with the village of Faqqua on its southern slopes; Eusebius knew a village Gelbus six miles from Scythopolis (Beth-shan)."
    - "The Philistines gathered at Shunem, “and Saul gathered all Israel together, and they pitched in Gilboa”; that night he went to the woman of Endor. In the battle “the men of Israel fled from before the Philistines, and fell down slain in mount Gilboa”; Jonathan, Abinadab and Malchi-shua were killed, and Saul, wounded by the archers, “took a sword, and fell upon it”. The Philistines hung the bodies on the wall of Beth-shan, and the men of Jabesh-gilead took them down by night. David's lament curses the place: “Ye mountains of Gilboa, let there be no dew, neither let there be rain, upon you, nor fields of offerings: for there the shield of the mighty is vilely cast away, the shield of Saul”. Later David brought the bones of Saul and Jonathan from Jabesh and buried them in the tomb of Kish."
    - "Gilboa lies today mostly in Israel, its southern slopes reaching into the West Bank. Its slopes were planted with forest in the twentieth century, and in spring they bear the Gilboa iris, a dark purple flower that grows only here and in the hills of eastern Samaria. A scenic road runs along the crest, and the spring of Harod at its foot is a national park."
  ru:
    - "Гора Гелвуй — хребет длиной около 18 км на юго-восточном краю долины Изреельской, поднимающийся до 536 м над морем в высшей точке и круто обрывающийся на северо-востоке к Беф-Сану и Иордану. У северо-западного подножия лежит источник Харод, где Гедеон стоял против Мадианитян, а на отроге у северо-западного конца стоял Изреель; долина между Гелвуем и холмом Море, с Сонамом у подножия Море, стала полем последнего дня Саула. Арабское имя, Джебель-Фукуа, у него общее с деревней Факкуа на южных склонах; Евсевий знал селение Гелвус в шести милях от Скифополя (Беф-Сана)."
    - "Филистимляне стали станом в Сонаме, «собрал и Саул весь народ Израильский, и стали станом на Гелвуе»; той ночью он пошёл к женщине в Аэндор. В битве «побежали мужи Израильские от Филистимлян и пали пораженные на горе Гелвуе»; были убиты Ионафан, Аминадав и Малхисуа, а Саул, изранённый стрелками, «взял меч свой и пал на него». Филистимляне повесили тела на стене Беф-Сана, и жители Иависа Галаадского сняли их ночью. Плач Давида проклинает место: «Горы Гелвуйские! да не сойдет ни роса, ни дождь на вас, и да не будет на вас полей с плодами, ибо там повержен щит сильных, щит Саула». Позже Давид перенёс кости Саула и Ионафана из Иависа и похоронил их во гробе Киса."
    - "Сегодня Гелвуй лежит в основном в Израиле, а его южные склоны уходят на Западный берег. В XX веке его склоны засадили лесом, а весной на них цветёт гелвуйский ирис — тёмно-пурпурный цветок, растущий только здесь и в горах восточной Самарии. По гребню идёт живописная дорога, а источник Харод у подножия — национальный парк."
  uk:
    - "Гора Гільбоа — хребет завдовжки близько 18 км на південно-східному краю Їзреельської долини, що здіймається на 536 м над морем на найвищій вершині й круто спадає на північний схід до Бет-Шеана й Йордану. Джерело Харод, де Гедеон отаборився проти Мадіама, лежить біля її північно-західного підніжжя, а Їзреель стояв на відрозі на її північно-західному краї; долина між нею й пагорбом Море, із Сунемом біля підніжжя Море, була полем битви останнього дня Саула. Її арабська назва, Джебель-Фукуа, поділяється із селом Факуа на її південних схилах; Євсевій знав село Гелбус за шість миль від Скіфополя (Бет-Шеан)."
    - "Філістимляни зібралися в Сунемі, «Скликав же і Саул усього Ізраїля та й став табором на Гелбуї»; тієї ночі він пішов до ендорської чарівниці. У битві «повтїкали мужі Ізраїльські перед Филистіями й полягли побиті на горі Гелбуї»; Йонатан, Авінадав і Мелхісуй були вбиті, а Саул, поранений стрільцями, «ухопив меча та й кинувсь на його». Філістимляни повісили тіла на мурі Бет-Шеана, і мужі Явіса Гілеадського зняли їх уночі. Плач Давида проклинає це місце: «Ви ж гори, Гелвуйські, щоб на вас не впало нї дощу на ваші ниви, нї роси на поле, бо там покинений щит сильних, щит Саулів». Пізніше Давид приніс кістки Саула й Йонатана з Явіса й поховав їх у гробниці Кіша: «в отецькому Кисовому гробі»."
    - "Гільбоа лежить сьогодні здебільшого в Ізраїлі, її південні схили сягають Західного берега. У XX ст. її схили засадили лісом, і навесні на них цвіте іріс Гільбоа, темно-пурпурова квітка, що росте лише тут і в пагорбах східної Самарії. Мальовнича дорога йде вздовж гребеня, а джерело Харод біля підніжжя — національний парк."
  es:
    - "El monte Gilboa es una cresta de unos 18 km de largo en el borde sudoriental del valle de Jezreel, que se eleva hasta 536 m sobre el nivel del mar en su pico más alto y cae abruptamente por el nordeste hacia Bet-seán y el Jordán. La fuente de Harod, donde Gedeón acampó contra Madián, está en su pie noroccidental, y Jezreel se alzaba sobre un espolón en su extremo noroccidental; el valle entre él y la colina de Moré, con Sunem al pie de Moré, fue el campo de batalla del último día de Saúl. Su nombre árabe, Yebel Fuqu'a, lo comparte con la aldea de Faqqua en sus laderas meridionales; Eusebio conoció una aldea Gelbus a seis millas de Escitópolis (Bet-seán)."
    - "Los filisteos se reunieron en Sunem, «y Saúl juntó á todo Israel, y asentaron campo en Gilboa»; aquella noche fue a la mujer de Endor. En la batalla «los de Israel huyeron delante de los Filisteos, y cayeron muertos en el monte de Gilboa»; Jonatán, Abinadab y Malquisúa murieron, y Saúl, herido por los flecheros, «tomó [...] la espada, y echóse sobre ella». Los filisteos colgaron los cuerpos en el muro de Bet-seán, y los hombres de Jabes de Galaad los bajaron de noche. El lamento de David maldice el lugar: «Montes de Gilboa, ni rocío ni lluvia caiga sobre vosotros, ni seáis tierras de ofrendas; porque allí fué desechado el escudo de los valientes, el escudo de Saúl». Más tarde David hizo traer de Jabes los huesos de Saúl y de Jonatán y los sepultó en la tumba de Cis."
    - "Hoy el Gilboa se halla sobre todo en Israel, y sus laderas meridionales se adentran en Cisjordania. Sus laderas fueron repobladas de bosque en el siglo XX, y en primavera dan el lirio del Gilboa, una flor púrpura oscura que crece solo aquí y en las colinas del este de Samaria. Una carretera panorámica recorre la cresta, y la fuente de Harod, a su pie, es un parque nacional."
  pt:
    - "O monte Gilboa é uma crista de cerca de 18 km de comprimento na borda sudeste do vale de Jezreel, elevando-se a 536 m acima do mar em seu pico mais alto e descendo abruptamente a nordeste rumo a Bete-Seã e ao Jordão. A fonte de Harode, onde Gideão acampou contra Midiã, fica em seu sopé noroeste, e Jezreel erguia-se num esporão em sua extremidade noroeste; o vale entre ele e a colina de Moré, com Suném ao pé de Moré, foi o campo de batalha do último dia de Saul. Seu nome árabe, Jebel Fuqu'a, é compartilhado com a aldeia de Faqqua em suas encostas meridionais; Eusébio conhecia uma aldeia Gelbus a seis milhas de Citópolis (Bete-Seã)."
    - "Os filisteus se reuniram em Suném, e “Saul reuniu todo o Israel, e eles acamparam em Gilboa”; naquela noite foi à mulher de Endor. Na batalha, “os homens de Israel fugiram de diante dos filisteus, e caíram mortos no monte Gilboa”; Jônatas, Abinadabe e Malquisua foram mortos, e Saul, ferido pelos arqueiros, “pegou sua própria espada e lançou-se sobre ela”. Os filisteus penduraram os corpos no muro de Bete-Seã, e os homens de Jabes-Gileade os tiraram de noite. O lamento de Davi amaldiçoa o lugar: “Ó montes de Gilboa, que não haja orvalho nem chuva sobre vocês, nem campos de ofertas; pois ali o escudo dos valentes foi profanado e jogado fora, o escudo de Saul”. Mais tarde Davi trouxe os ossos de Saul e Jônatas de Jabes e os sepultou no túmulo de Quis."
    - "Gilboa fica hoje em sua maior parte em Israel, com as encostas meridionais alcançando a Cisjordânia. Suas encostas foram plantadas de floresta no século XX, e na primavera dão a íris de Gilboa, uma flor púrpura escura que cresce só aqui e nas colinas do leste de Samaria. Uma estrada panorâmica corre ao longo da crista, e a fonte de Harode, ao seu pé, é um parque nacional."
  de:
    - "Der Gilboa ist ein etwa 18 km langer Höhenzug am Südostrand der Jesreelebene, der an seinem höchsten Gipfel 536 m über dem Meer erreicht und im Nordosten steil zu Bet-Schean und dem Jordan abfällt. Die Quelle Harod, wo Gideon gegen Midian lagerte, liegt an seinem nordwestlichen Fuß, und Jesreel stand auf einem Sporn an seinem nordwestlichen Ende; das Tal zwischen ihm und dem Hügel More mit Schunem am Fuß des More war das Schlachtfeld von Sauls letztem Tag. Seinen arabischen Namen, Jebel Fuqu'a, teilt er mit dem Dorf Faqqua an seinen Südhängen; Eusebius kannte ein Dorf Gelbus sechs Meilen von Skythopolis (Bet-Schean)."
    - "Die Philister sammelten sich bei Schunem; dann „versammelte Saul auch das ganze Israel, und sie lagerten sich zu Gilboa“; in jener Nacht ging er zur Frau von En-Dor. In der Schlacht, heißt es, „die Männer Israels flohen vor den Philistern und fielen erschlagen auf dem Gebirge Gilboa“; Jonatan, Abinadab und Malkischua wurden getötet, und Saul, von den Schützen verwundet, „nahm das Schwert und fiel hinein“. Die Philister hängten die Leichen an die Mauer von Bet-Schean, und die Männer von Jabesch in Gilead nahmen sie nachts herab. Davids Klage verflucht den Ort: „Ihr Berge zu Gilboa, es müsse weder tauen noch regnen auf euch noch Äcker sein, davon Hebopfer kommen; denn daselbst ist den Helden ihr Schild abgeschlagen, der Schild Sauls“. Später brachte David die Gebeine Sauls und Jonatans aus Jabes und begrub sie im Grab des Kis."
    - "Der Gilboa liegt heute überwiegend in Israel, seine Südhänge reichen ins Westjordanland. Seine Hänge wurden im 20. Jahrhundert aufgeforstet, und im Frühjahr tragen sie die Gilboa-Iris, eine dunkelpurpurne Blume, die nur hier und in den Hügeln des östlichen Samaria wächst. Eine Panoramastraße führt über den Kamm, und die Quelle Harod an seinem Fuß ist ein Nationalpark."
  fr:
    - "Le mont Guilboa est une crête d’environ 18 km de long sur le bord sud-est de la vallée de Jizreel, s’élevant à 536 m au-dessus de la mer à son plus haut sommet et descendant à pic au nord-est vers Beth-Schean et le Jourdain. La source de Harod, où Gédéon campa contre Madian, se trouve à son pied nord-ouest, et Jizreel se dressait sur un éperon à son extrémité nord-ouest ; la vallée entre lui et la colline de Moré, avec Sunem au pied de Moré, fut le champ de bataille du dernier jour de Saül. Son nom arabe, djebel Fuqu’a, est partagé avec le village de Faqqua sur ses pentes sud ; Eusèbe connaissait un village Gelbus à six milles de Scythopolis (Beth-Schean)."
    - "Les Philistins se rassemblèrent à Sunem, « Saül rassembla tout Israël, et ils campèrent à Guilboa » ; cette nuit-là il alla chez la femme d’Endor. Dans la bataille, « les hommes d’Israël prirent la fuite devant les Philistins et tombèrent morts sur la montagne de Guilboa » ; Jonathan, Abinadab et Malki-Schua furent tués, et Saül, blessé par les archers, « prit son épée, et se jeta dessus ». Les Philistins pendirent les corps au mur de Beth-Schean, et les hommes de Jabès en Galaad les descendirent de nuit. La complainte de David maudit le lieu : « Montagnes de Guilboa ! Qu’il n’y ait sur vous ni rosée ni pluie, ni champs qui donnent des prémices pour les offrandes ! Car là ont été jetés les boucliers des héros, le bouclier de Saül ». Plus tard David rapporta les os de Saül et de Jonathan de Jabès et les enterra dans le sépulcre de Kis."
    - "Le Guilboa se trouve aujourd’hui surtout en Israël, ses pentes sud s’étendant en Cisjordanie. Ses pentes furent plantées de forêt au XXe siècle, et au printemps elles portent l’iris du Guilboa, fleur pourpre foncé qui ne pousse qu’ici et dans les collines de l’est de la Samarie. Une route panoramique longe la crête, et la source de Harod, à son pied, est un parc national."
  it:
    - "Il Monte Gelboe è una dorsale lunga circa 18 km sul margine sud-orientale della valle di Izreel, che raggiunge 536 m sul mare alla vetta più alta e cade ripida a nord-est verso Beth-Shean e il Giordano. La sorgente di Carod, dove Gedeone si accampò contro Madian, giace al suo piede nord-occidentale, e Izreel sorgeva su uno sperone alla sua estremità nord-occidentale; la valle tra esso e il colle di Morè, con Sunem ai piedi del Morè, fu il campo di battaglia dell’ultimo giorno di Saul. Il suo nome arabo, Jebel Fuqu‘a, è condiviso con il villaggio di Faqqua sui pendii meridionali; Eusebio conosceva un villaggio Gelbus a sei miglia da Scitopoli (Beth-Shean)."
    - "I Filistei si radunarono a Sunem, e «Saul parimente radunò tutto Israele, e si accamparono a Ghilboa»; quella notte andò dalla donna di Endor. Nella battaglia «gl’Israeliti fuggirono dinanzi ai Filistei, e caddero morti in gran numero sul monte Ghilboa»; Gionata, Abinadab e Malkisua furono uccisi, e Saul, ferito dagli arcieri, «prese la propria spada e vi si gettò sopra». I Filistei appesero i corpi alle mura di Beth-Shean, e gli uomini di Iabes di Galaad li tolsero di notte. Il lamento di Davide maledice il luogo: «O monti di Ghilboa, su voi non cada più né rugiada né pioggia, né più vi siano campi da offerte; poiché là fu gettato via lo scudo de’ prodi, lo scudo di Saul». Più tardi Davide portò le ossa di Saul e di Gionata da Iabes e le seppellì nel «sepolcro di Kis»."
    - "Il Gelboe si trova oggi per lo più in Israele, con i pendii meridionali che entrano in Cisgiordania. I suoi pendii furono rimboschiti nel Novecento, e in primavera fioriscono l’iris del Gelboe, un fiore viola scuro che cresce solo qui e sulle colline della Samaria orientale. Una strada panoramica corre lungo la cresta, e la sorgente di Carod ai suoi piedi è un parco nazionale."
  pl:
    - "Góra Gilboa to grzbiet długi na około 18 km na południowo-wschodnim skraju doliny Jizreel, wznoszący się do 536 m n.p.m. na najwyższym szczycie i stromo opadający na północnym wschodzie ku Bet-Szean i Jordanowi. Źródło Charod, gdzie Gedeon obozował przeciw Madianowi, leży u jego północno-zachodniej stopy, a Jizreel stało na ostrodze na jego północno-zachodnim końcu; dolina między nim a wzgórzem More, z Szunem u stóp More, była polem bitwy ostatniego dnia Saula. Jego arabska nazwa, Dżabal Fuqu'a, jest wspólna z wsią Faqqua na jego południowych zboczach; Euzebiusz znał wieś Gelbus sześć mil od Scytopolis (Bet-Szean)."
    - "Filistyni zebrali się w Szunem, a „zebrał też Saul wszystkiego Izraela, a położył się obozem w Gielboe”; tej nocy poszedł do kobiety z Endor. W bitwie „uciekli mężowie Izraelscy przed Filistynami, a polegli zranieni na górze Gielboe”; Jonatan, Abinadab i Malkiszua zginęli, a Saul, raniony przez łuczników, „porwał miecz i upadł nań”. Filistyni zawiesili ciała na murze Bet-Szean, a mężowie z Jabesz-Gilead zdjęli je nocą. Lament Dawida przeklina to miejsce: „O góry Gielboe! ani rosa, ani deszcz niech nie upada na was, i niech tam nie będą pola urodzajne; albowiem tam porzucona jest tarcz mocarzów, tarcz Saulowa, jakoby nie był pomazany olejem”. Później Dawid przeniósł kości Saula i Jonatana z Jabesz i pochował je w grobie Kisza."
    - "Gilboa leży dziś głównie w Izraelu, a jego południowe zbocza sięgają Zachodniego Brzegu. Jego zbocza obsadzono lasem w XX w., a wiosną kwitnie na nich irys Gilboa, ciemnofioletowy kwiat rosnący tylko tu i we wzgórzach wschodniej Samarii. Droga widokowa biegnie wzdłuż grzbietu, a źródło Charod u jego stóp jest parkiem narodowym."
  nl:
    - "De Gilboa is een rug van zo'n 18 km lang aan de zuidoostrand van de vallei van Jizreël, die op zijn hoogste top 536 m boven zee reikt en aan de noordoostkant steil afvalt naar Beth-Sean en de Jordaan. De bron van Charod, waar Gideon kampeerde tegen Midian, ligt aan zijn noordwestelijke voet, en Jizreël stond op een uitloper aan zijn noordwestelijke einde; het dal tussen hem en de heuvel More, met Sunem aan de voet van de More, was het slagveld van Sauls laatste dag. Zijn Arabische naam, Jebel Fuqu'a, is gedeeld met het dorp Faqqua op zijn zuidhellingen; Eusebius kende een dorp Gelbus op zes mijl van Scythopolis (Beth-Sean)."
    - "De Filistijnen verzamelden zich bij Sunem, “en Saul vergaderde gans Israël, en zij legerden zich op Gilboa”; die nacht ging hij naar de vrouw van Endor. In de slag “vloden de mannen Israëls voor het aangezicht der Filistijnen, en vielen verslagen op het gebergte Gilboa”; Jonatan, Abinadab en Malchi-Sua werden gedood, en Saul, door de boogschutters gewond: “Toen nam Saul het zwaard, en viel daarin”. De Filistijnen hingen de lichamen aan de muur van Beth-Sean, en de mannen van Jabes in Gilead namen ze 's nachts af. Davids klaagzang vervloekt de plaats: “Gij, bergen van Gilboa, noch dauw noch regen moet zijn op u, noch velden der hefofferen; want aldaar is der helden schild smadelijk weggeworpen, het schild van Saul”. Later bracht David de beenderen van Saul en Jonatan uit Jabes en begroef ze in het graf van Kis."
    - "De Gilboa ligt tegenwoordig grotendeels in Israël, met zijn zuidhellingen tot in de Westoever. Zijn hellingen werden in de twintigste eeuw met bos beplant, en in de lente dragen ze de Gilboa-iris, een donkerpaarse bloem die alleen hier en in de heuvels van Oost-Samaria groeit. Een schilderachtige weg loopt langs de kam, en de bron van Charod aan zijn voet is een nationaal park."
  cs:
    - "Gilboa je hřbet dlouhý asi 18 km na jihovýchodním okraji Jizreelského údolí, vystupující na nejvyšším vrcholu do 536 m nad mořem a příkře klesající na severovýchod k Bét-šanu a Jordánu. Pramen Charod, kde se Gedeon utábořil proti Midjánu, leží při jeho severozápadním úpatí a Jizreel stál na výběžku na jeho severozápadním konci; údolí mezi ním a pahorkem Móre, se Šúnemem na úpatí Móre, bylo bojištěm Saulova posledního dne. Jeho arabské jméno, Jebel Fuqu'a, sdílí vesnice Faqqua na jeho jižních svazích; Eusebius znal vesnici Gelbus šest mil od Skythopole (Bét-šanu)."
    - "Pelištejci se shromáždili u Šúnemu; „shromáždil i Saul všeho Izraele, a položili se v Gelboe“; té noci šel k ženě z Endoru. V bitvě „muži pak Izraelští utíkali před Filistinskými a padli, zbiti jsouce na hoře Gelboe“; Jonatan, Abinadab a Malkišua byli zabiti a Saul, raněný střelci: „pochytiv Saul meč, nalehl na něj“. Pelištejci pověsili těla na zeď Bét-šanu a muži z Jabeše gileadského je v noci sňali. Davidův nářek místo proklíná: „Ó hory Gelboe, ani rosa, ani déšť nespadej na vás, ani tu buď pole úrodné; nebo tam jest povržen štít udatných, štít Saulův, jako by nebyl pomazán olejem“. Později David přinesl kosti Saulovy a Jonatanovy z Jabeše a pochoval je v hrobě Kíšově."
    - "Gilboa leží dnes většinou v Izraeli, jeho jižní svahy zasahují na Západní břeh. Jeho svahy byly ve 20. století osázeny lesem a na jaře nesou gilboaskou kosatku, tmavě purpurový květ, který roste jen zde a v pahorcích východního Samaří. Podél hřebene vede scénická silnice a pramen Charod u jeho úpatí je národním parkem."
  sv:
    - "Gilboa är en rygg omkring 18 km lång vid sydöstra kanten av Jisreeldalen, 536 m över havet vid sin högsta topp och stupande brant i nordost mot Bet-Shean och Jordan. Källan Harod, där Gideon lägrade sig mot Midjan, ligger vid dess nordvästra fot, och Jisreel låg på en utlöpare vid dess nordvästra ände; dalen mellan Gilboa och höjden More, med Shunem vid Mores fot, var slagfältet för Sauls sista dag. Dess arabiska namn, Jebel Fuqu'a, delas med byn Faqqua på dess södra sluttningar; Eusebios kände en by Gelbus sex romerska mil från Skytopolis (Bet-Shean)."
    - "Filistéerna samlade sig vid Shunem, och ”Då församlade ock Saul hela Israel, och de lägrade sig vid Gilboa”; den natten gick han till kvinnan i Endor. I striden ”Israels män flydde för filistéerna och föllo slagna på berget Gilboa”; Jonatan, Avinadav och Malki-Shua dräptes, och Saul, sårad av bågskyttarna: ”Då tog Saul själv svärdet och störtade sig därpå”. Filistéerna hängde kropparna på Bet-Sheans mur, och männen i Javesh-Gilead tog ned dem om natten. Davids klagosång förbannar platsen: ”I Gilboa berg, på eder må ej falla dagg eller regn, ej ses offergärdsskördar. Ty hjältarnas sköld blev där till smälek, Sauls sköld”. Senare förde David Sauls och Jonatans ben från Javesh och begrov dem i Kishs grav."
    - "Gilboa ligger i dag mest i Israel, med södra sluttningarna nående in på Västbanken. Dess sluttningar planterades med skog på 1900-talet, och om våren bär de Gilboairisen, en mörkt purpurfärgad blomma som bara växer här och i bergen i östra Samaria. En naturskön väg löper längs kammen, och källan Harod vid dess fot är en nationalpark."
