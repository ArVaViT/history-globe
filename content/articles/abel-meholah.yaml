# Overview article (ADR 0007). Mainstream facts only; the site is not proved and the app's candidates are named without choosing; the Synodal spelling varies between books, which the text notes.
id: abel-meholah
place: a5a1bdd
title:
  en: "Abel-meholah"
  ru: "Авел-Мехола"
  uk: "Авел-Мехола"
  es: "Abel-mehola"
  pt: "Abel-Meolá"
  de: "Abel-Mehola"
  fr: "Abel-Mehola"
  it: "Abel-Mecolà"
  pl: "Abel-Mechola"
  nl: "Abel-Mehola"
  cs: "Ábel-mechola"
body:
  en:
    - "Abel-meholah, “meadow of the dance”, was a town in the Jordan valley south of Beth-shean, the home of the prophet Elisha. Eusebius knew it as Bethmaela, a village in the Aulon ten Roman miles south of Scythopolis, and most scholars seek it on that stretch of the west bank: the usual choice is Tell Abu Sus by the river some 15 km south of Beth-shean, with Tell el-Hilu and Ras el-Kharube near by as alternatives; Tell el-Hamme and Tall al-Meqbarah have also been named, and Nelson Glueck looked across the river to Tell el-Maqlub in the Wadi Yabis, which others take for Jabesh-gilead. None has been excavated to the point of proof."
    - "The town first appears in Gideon's victory: when the three hundred blew their trumpets, the Midianite host “fled to Beth-shittah in Zererath, and to the border of Abel-meholah, unto Tabbath”, down the valley towards the Jordan fords. In Solomon's provinces Baana son of Ahilud held Taanach, Megiddo and all Beth-shean “from Beth-shean to Abel-meholah, even unto the place that is beyond Jokneam”. Adriel the Meholathite, to whom Saul gave his daughter Merab instead of David, was presumably from here."
    - "Above all, at Horeb Elijah was told, “Elisha the son of Shaphat of Abel-meholah shalt thou anoint to be prophet in thy room”; he found him ploughing with twelve yoke of oxen and cast his mantle on him, and Elisha killed a yoke, feasted the people and followed him. The Synodal Bible spells the name three ways. The west bank of the Jordan here is today farmland of the Beth-shean valley along the Israeli-Jordanian border, with the river itself in its closed border strip; the candidate mounds stand among the fields."
  ru:
    - "Авел-Мехола, «луг пляски», — город в долине Иордана к югу от Беф-Сана, родина пророка Елисея. Евсевий знал его как Бефмаелу, селение в Авлоне в десяти римских милях к югу от Скифополя, и большинство учёных ищут его на этом отрезке западного берега: обычный выбор — Телль-Абу-Сус у реки примерно в 15 км к югу от Беф-Сана, рядом Телль-эль-Хилу и Рас-эль-Харубе как замены; назывались также Телль-эль-Хамме и Телль-аль-Мекбара, а Нельсон Глюк смотрел за реку, на Телль-эль-Маклуб в Вади-Ябис, который другие считают Иависом Галаадским. Ни один из них не раскопан настолько, чтобы это доказать."
    - "Впервые город появляется в победе Гедеона: когда триста человек затрубили, ополчение Мадианитян бежало «до Бефшитты к Царере, до предела Авелмехолы, близ Табафы», вниз по долине к бродам Иордана. В областях Соломона Ваана, сын Ахилуда, держал Фаанах, Мегиддо и весь Беф-Сан «от Беф-Сана до Абел-Мехола, и даже за Иокмеам». Адриэл из Мехолы, за которого Саул выдал дочь Мерову вместо Давида, был, надо думать, отсюда."
    - "Главное же — на Хориве Илии было сказано: «Елисея же, сына Сафатова, из Авел-Мехолы, помажь в пророка вместо себя»; он нашёл его пашущим на двенадцати парах волов и бросил на него милоть, и Елисей заколол пару волов, угостил народ и пошёл за ним. Синодальный перевод пишет имя тремя способами. Западный берег Иордана здесь — сегодня поля долины Беф-Сана вдоль израильско-иорданской границы, а сама река идёт в закрытой пограничной полосе; холмы-кандидаты стоят среди полей."
  uk:
    - "Авел-Мехола, «луг танцю», було містом у Йорданській долині на південь від Бет-Шеану, батьківщиною пророка Єлисея. Євсевій знав його як Бетмаелу, село в Авлоні за десять римських миль на південь від Скіфополя, і більшість учених шукають його саме на цьому відтинку західного берега: звичайний вибір — Тель-Абу-Сус біля річки приблизно за 15 км на південь від Бет-Шеану, а Тель-ель-Хілу та Рас-ель-Харубе поблизу є запасними варіантами; називали також Тель-ель-Хамме та Талль-аль-Мекбару, а Нельсон Глюк дивився через річку на Тель-ель-Маклюб у Ваді-Ябіс, який інші вважають Явісом Гілеадським. Жоден із них не розкопано настільки, щоб це було доведено."
    - "Місто вперше з'являється в перемозі Гедеона: коли триста чоловіків засурмили в сурми, мідіянський табір «побігло до Бетситта на Цереру, до берега Абелмеголи під Табатом», униз долиною до бродів Йордану. У округах Соломона Ваана, син Ахілуда, держав Таанах, Мегіддо й увесь Бет-Шеан «від Бет-Сану до Абел-Мехола аж за Йокмеам». Адріел Мехолатянин, якому Саул віддав дочку Мерав замість Давида, ймовірно, походив звідси: «Адріелеві з Мехоли»."
    - "Понад усе, на Хориві Елії було сказано: «Елисея Сафатенка, з Абел-Мехоли, помаж в пророка намість себе»; він знайшов його, коли той орав дванадцятьма парами волів, і накинув на нього свій плащ, а Єлисей заколов пару волів, учтував людей і пішов за ним. Синодальний переклад пише цю назву трьома способами. Західний берег Йордану тут нині — рілля долини Бет-Шеану вздовж ізраїльсько-йорданського кордону, а сама річка лежить у закритій прикордонній смузі; пагорби-кандидати стоять серед полів."
  es:
    - "Abel-mehola, «prado de la danza», era una ciudad del valle del Jordán, al sur de Bet-seán, patria del profeta Eliseo. Eusebio la conocía como Bethmaela, una aldea del Aulón a diez millas romanas al sur de Escitópolis, y la mayoría de los estudiosos la buscan en ese tramo de la orilla occidental: la opción habitual es Tell Abu Sus, junto al río, unos 15 km al sur de Bet-seán, con Tell el-Hilu y Ras el-Kharube cerca como alternativas; también se han propuesto Tell el-Hamme y Tall al-Meqbarah, y Nelson Glueck miró al otro lado del río, a Tell el-Maqlub, en el uadi Yabis, que otros identifican con Jabes de Galaad. Ninguno ha sido excavado hasta el punto de obtener una prueba."
    - "La ciudad aparece por primera vez en la victoria de Gedeón: cuando los trescientos tocaron las trompetas, el ejército de Madián «huyó hasta Beth-sitta, hacia Cerera, y hasta el término de Abel-mehola en Tabbat», valle abajo hacia los vados del Jordán. En las provincias de Salomón, Baana hijo de Ahilud tenía Taanac, Meguido y toda Bet-seán, «desde Beth-san hasta Abel-mehola, y hasta la otra parte de Jocmeam». Adriel el meholatita, a quien Saúl dio a su hija Merab en lugar de David, era presumiblemente de aquí."
    - "Sobre todo, en el Horeb se dijo a Elías: «á Eliseo hijo de Saphat, de Abelmehula, ungirás para que sea profeta en lugar de ti»; lo encontró arando con doce yuntas de bueyes y echó sobre él su manto, y Eliseo mató una yunta, dio de comer al pueblo y lo siguió. La Biblia sinodal escribe el nombre de tres maneras. La orilla occidental del Jordán es hoy aquí tierra de cultivo del valle de Bet-seán, a lo largo de la frontera entre Israel y Jordania, con el propio río dentro de su franja fronteriza cerrada; los montículos candidatos se alzan entre los campos."
  pt:
    - "Abel-Meolá, “prado da dança”, era uma cidade no vale do Jordão, ao sul de Bete-Seã, terra do profeta Eliseu. Eusébio a conhecia como Betmaela, uma aldeia no Aulon, a dez milhas romanas ao sul de Citópolis, e a maioria dos estudiosos a procura nesse trecho da margem ocidental: a escolha habitual é Tell Abu Sus, junto ao rio, cerca de 15 km ao sul de Bete-Seã, com Tell el-Hilu e Ras el-Kharube nas proximidades como alternativas; também foram citados Tell el-Hamme e Tall al-Meqbarah, e Nelson Glueck olhou para o outro lado do rio, para Tell el-Maqlub, no uádi Yabis, que outros tomam por Jabes-Gileade. Nenhum foi escavado a ponto de se obter prova."
    - "A cidade aparece primeiro na vitória de Gideão: quando os trezentos tocaram as trombetas, o exército de Midiã “fugiu até Bete-Sita, em direção a Zererá, até a fronteira de Abel-Meolá, perto de Tabate”, vale abaixo, rumo aos vaus do Jordão. Nas províncias de Salomão, Baaná, filho de Ailude, tinha Taanaque, Megido e toda Bete-Seã, “desde Bete-Seã até Abel-Meolá, até além de Jocmeão”. Adriel, o meolatita, a quem Saul deu a filha Merabe em lugar de Davi, era presumivelmente daqui."
    - "Acima de tudo, em Horebe disseram a Elias: “unja Eliseu, filho de Safate, de Abel-Meolá, para ser profeta em seu lugar”; ele o encontrou arando com doze juntas de bois e lançou o seu manto sobre ele, e Eliseu matou uma junta, deu de comer ao povo e o seguiu. A Bíblia sinodal russa grafa o nome de três modos. A margem ocidental do Jordão aqui é hoje terra agrícola do vale de Bete-Seã, ao longo da fronteira entre Israel e a Jordânia, com o próprio rio em sua faixa de fronteira fechada; os montículos candidatos ficam entre os campos."
  de:
    - "Abel-Mehola, „Wiese des Tanzes“, war eine Stadt im Jordantal südlich von Bet-Schean, die Heimat des Propheten Elisa. Eusebius kannte sie als Bethmaela, ein Dorf im Aulon, zehn römische Meilen südlich von Skythopolis, und die meisten Gelehrten suchen sie an diesem Abschnitt des Westufers: gewöhnlich wählt man Tell Abu Sus am Fluss, etwa 15 km südlich von Bet-Schean, mit Tell el-Hilu und Ras el-Charube in der Nähe als Alternativen; auch Tell el-Hamme und Tall al-Meqbara wurden genannt, und Nelson Glueck blickte über den Fluss hinüber nach Tell el-Maqlub im Wadi Jabis, den andere für Jabesch in Gilead halten. Keiner dieser Orte wurde so weit ausgegraben, dass es zum Beweis reichte."
    - "Zuerst erscheint die Stadt in Gideons Sieg: Als die dreihundert Mann die Posaunen bliesen, floh das midianitische Heer „bis Beth-Sitta gen Zereda, bis an die Grenze von Abel-Mehola bei Tabbath“, das Tal hinab zu den Furten des Jordan. In Salomos Verwaltungsbezirken hatte Baana, der Sohn Ahiluds, Taanach, Megiddo und ganz Bet-Schean inne, „von Beth-Sean bis an Abel-Mehola, bis jenseit Jokmeams“. Adriël, der Meholatiter, dem Saul seine Tochter Merab statt David gab, stammte vermutlich von hier."
    - "Vor allem aber wurde Elia am Horeb gesagt: „Elisa, den Sohn Saphats, von Abel-Mehola, zum Propheten an deiner Statt“ solle er salben; er fand ihn beim Pflügen mit zwölf Joch Rindern und warf seinen Mantel auf ihn, und Elisa schlachtete ein Joch, bewirtete das Volk und folgte ihm. Die Synodalbibel schreibt den Namen auf drei Weisen. Das Westufer des Jordan ist hier heute Ackerland des Bet-Schean-Tals an der israelisch-jordanischen Grenze, der Fluss selbst liegt in seinem gesperrten Grenzstreifen; die in Frage kommenden Hügel stehen zwischen den Feldern."
  fr:
    - "Abel-Mehola, « prairie de la danse », était une ville de la vallée du Jourdain, au sud de Beth-Schean, patrie du prophète Élisée. Eusèbe la connaissait comme Béthmaéla, village de l’Aulon à dix milles romains au sud de Scythopolis, et la plupart des savants la cherchent sur ce tronçon de la rive occidentale : le choix habituel est Tell Abu Sus, près du fleuve, à quelque 15 km au sud de Beth-Schean, avec Tell el-Hilu et Ras el-Kharube tout près comme variantes ; Tell el-Hamme et Tall al-Meqbarah ont aussi été proposés, et Nelson Glueck regardait de l’autre côté du fleuve, vers Tell el-Maqlub, dans le Wadi Yabis, que d’autres tiennent pour Jabès en Galaad. Aucun n’a été fouillé jusqu’à la preuve."
    - "La ville apparaît d’abord dans la victoire de Gédéon : quand les trois cents sonnèrent de la trompette, le camp de Madian « s’enfuit jusqu’à Beth-Schitta vers Tseréra, jusqu’au bord d’Abel-Mehola près de Tabbath », vers les gués du Jourdain en descendant la vallée. Dans les districts de Salomon, Baana, fils d’Achilud, avait Thaanac, Meguiddo et tout Beth-Schean « depuis Beth-Schean jusqu’à Abel-Mehola, jusqu’au-delà de Jokmeam ». Adriel, de Mehola, à qui Saül donna sa fille Mérab au lieu de David, était sans doute d’ici."
    - "Surtout, à l’Horeb, Élie reçut cet ordre : « tu oindras Élisée, fils de Schaphath, d’Abel-Mehola, pour prophète à ta place » ; il le trouva labourant avec douze paires de bœufs et jeta sur lui son manteau, et Élisée offrit en sacrifice une paire de bœufs, donna un festin au peuple et le suivit. La Bible synodale orthographie le nom de trois façons. La rive occidentale du Jourdain est aujourd’hui ici une terre agricole de la vallée de Beth-Schean, le long de la frontière israélo-jordanienne, le fleuve lui-même étant dans sa bande frontalière fermée ; les tertres candidats se dressent parmi les champs."
  it:
    - "Abel-Mecolà, «prato della danza», era una città nella valle del Giordano a sud di Beth-Shean, patria del profeta Eliseo. Eusebio la conosceva come Bethmaela, un villaggio nell’Aulon a dieci miglia romane a sud di Scitopoli, e la maggior parte degli studiosi la cerca su quel tratto della riva occidentale: la scelta abituale è Tell Abu Sus, presso il fiume, a circa 15 km a sud di Beth-Shean, con Tell el-Hilu e Ras el-Kharube vicini come alternative; sono stati proposti anche Tell el-Hamme e Tall al-Meqbarah, e Nelson Glueck guardò oltre il fiume, a Tell el-Maqlub nello Wadi Yabis, che altri ritengono Iabes di Galaad. Nessuno è stato scavato fino alla prova."
    - "La città compare per la prima volta nella vittoria di Gedeone: quando i trecento suonarono le trombe, l’esercito di Madian «fuggì fino a Beth-Scittah, verso Tserera, sino all’orlo d’Abel-Meholah presso Tabbath», giù per la valle verso i guadi del Giordano. Nelle province di Salomone Baana figlio di Achilud teneva Taanach, Meghiddo e tutta Beth-Shean, «da Beth-Scean ad Abel-Mehola, e fino al di là di Iokmeam». Adriel di Mecolà, al quale Saul diede in moglie la figlia Merab invece che a Davide, era presumibilmente di qui."
    - "Soprattutto, all’Oreb a Elia fu detto: «ungerai Eliseo, figliuolo di Shafat da Abel-Mehola, come profeta, in luogo tuo»; lo trovò che arava con dodici paia di buoi e gli gettò addosso il suo mantello, ed Eliseo uccise un paio di buoi, banchettò con il popolo e lo seguì. La Bibbia sinodale scrive il nome in tre modi. La riva occidentale del Giordano è qui oggi terreno agricolo della valle di Beth-Shean lungo il confine israelo-giordano, con il fiume stesso nella sua fascia di confine chiusa; i tell candidati sorgono tra i campi."
  pl:
    - "Abel-Mechola, „łąka tańca”, było miastem w Dolinie Jordanu na południe od Bet-Szean, rodzinnym miastem proroka Elizeusza. Euzebiusz znał je jako Bethmaela, wieś w Aulonie, dziesięć mil rzymskich na południe od Scytopolis, i większość uczonych szuka go na tym odcinku zachodniego brzegu: zwykle wybiera się Tell Abu Sus nad rzeką, około 15 km na południe od Bet-Szean, a alternatywą są pobliskie Tell el-Hilu i Ras el-Kharube; wymieniano też Tell el-Hamme i Tall al-Meqbarah, a Nelson Glueck spoglądał za rzekę na Tell el-Maqlub w Wadi Yabis, który inni uważają za Jabesz-Gilead. Żadnego nie wykopano na tyle, by dowieść."
    - "Miasto pojawia się po raz pierwszy w zwycięstwie Gedeona: gdy trzystu zadęło w trąby, wojsko Madianitów uciekło „aż do Betseta w Sererat, aż do granicy Abelmehola w Tabbat”, w dół doliny ku brodom Jordanu. W okręgach Salomona Baana, syn Achiluda, trzymał Taanak, Megiddo i całe Bet-Szean „od Betsan aż do Abelmehola, aż za Jekmaam”. Adriel z Mechola, któremu Saul dał córkę Merab zamiast Dawidowi, pochodził zapewne stąd."
    - "Przede wszystkim na Horebie Eliaszowi powiedziano: „Elizeusza, syna Safatowego, z Abelmechola, pomażesz za proroka miasto siebie”; zastał go orzącego dwunastoma jarzmami wołów i rzucił na niego swój płaszcz, a Elizeusz zabił jedno jarzmo, urządził ucztę ludowi i poszedł za nim. Biblia synodalna zapisuje to imię na trzy sposoby. Zachodni brzeg Jordanu jest tu dziś ziemią uprawną Doliny Bet-Szean wzdłuż granicy izraelsko-jordańskiej, a sama rzeka leży w zamkniętym pasie granicznym; proponowane telle stoją wśród pól."
  nl:
    - "Abel-Mehola, “weide van de dans”, was een stad in de Jordaanvallei ten zuiden van Beth-Sean, de woonplaats van de profeet Elisa. Eusebius kende haar als Bethmaela, een dorp in de Aulon, tien Romeinse mijlen ten zuiden van Scythopolis, en de meeste geleerden zoeken haar op dat stuk van de westoever: de gebruikelijke keuze is Tell Abu Sus aan de rivier, zo’n 15 km ten zuiden van Beth-Sean, met Tell el-Hilu en Ras el-Kharube in de buurt als alternatieven; ook Tell el-Hamme en Tall al-Meqbarah zijn genoemd, en Nelson Glueck zocht aan de overkant van de rivier, bij Tell el-Maqlub in de Wadi Yabis, dat anderen voor Jabes in Gilead houden. Geen ervan is zo ver opgegraven dat het bewijs levert."
    - "De stad verschijnt voor het eerst in Gideons overwinning: toen de driehonderd met de bazuinen bliezen, “vluchtte” het Midianitische leger “tot Beth-Sitta toe naar Tseredath, tot aan de grens van Abel-Mehola, boven Tabbath”, door de vallei naar de Jordaanvoorden. In Salomo’s districten had Baäna, de zoon van Achilud, Taänach, Megiddo en heel Beth-Sean, “van Beth-Sean aan tot Abel-Mehola, tot op gene zijde van Jokmeam”. Adriël, de Meholathiet, aan wie Saul zijn dochter Merab gaf in plaats van aan David, kwam vermoedelijk van hier."
    - "Bovenal werd Elia bij de Horeb gezegd: “Elisa, den zoon van Safat, van Abel-mehola, zult gij tot profeet zalven in uw plaats”; hij trof hem aan terwijl hij met twaalf span ossen ploegde en wierp zijn mantel over hem heen, waarna Elisa een span slachtte, het volk onthaalde en hem volgde. De Synodale Bijbel spelt de naam op drie manieren. De westoever van de Jordaan is hier tegenwoordig landbouwgrond van de vallei van Beth-Sean langs de Israëlisch-Jordaanse grens, met de rivier zelf in haar afgesloten grensstrook; de kandidaat-heuvels staan tussen de akkers."
  cs:
    - "Ábel-mechola, „louka tance“, bylo město v Jordánském údolí jižně od Bét-šeanu, domov proroka Elíši. Eusebios je znal jako Bethmaela, vesnici v Aulónu deset římských mil jižně od Skythopole, a většina badatelů je hledá na tomto úseku západního břehu: obvyklou volbou je Tell Abu Sus u řeky asi 15 km jižně od Bét-šeanu, přičemž Tell el-Hilu a Ras el-Kharube nedaleko jsou alternativami; jmenovány byly také Tell el-Hamme a Tall al-Meqbarah a Nelson Glueck hleděl přes řeku k Tell el-Maqlub ve vádí Jábis, který jiní pokládají za Jabeš gileadský. Žádné z těchto míst nebylo prozkoumáno natolik, aby bylo možné je prokázat."
    - "Město se poprvé objevuje při Gedeonově vítězství: když těch tři sta mužů troubilo na trouby, utíkalo midjánské vojsko „až k Betseta do Zererat, a až ku pomezí Abelmehula u Tebat“, dolů údolím k jordánským brodům. V Šalomounových správních okrscích držel Baana, syn Achiludův, Taanach, Megido a celý Bét-šean, „od Betsan až do Abelmehula a až za Jekmaam“. Adriel Mecholatský, jemuž Saul místo Davida dal za ženu svou dceru Merab, pocházel zřejmě odsud."
    - "Především však bylo Elijášovi na Chorebu řečeno: „Elizea syna Safatova z Abelmehula pomažeš za proroka místo sebe“; nalezl ho, an oře s dvanácti spřeženími volů, a uvrhl na něj svůj plášť, a Elíša zabil pár volů, pohostil lid a šel za ním. Synodální bible píše toto jméno třemi způsoby. Západní břeh Jordánu je zde dnes zemědělskou půdou Bét-šeanského údolí podél izraelsko-jordánské hranice, přičemž samotná řeka leží v uzavřeném pohraničním pásu; navrhované pahorky stojí mezi poli."
scripture:
