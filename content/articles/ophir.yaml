body:
  en:
    - "Ophir is the land of gold in the Old Testament, reached by ship from Ezion-geber at the head of the Gulf of Aqaba. Where it lay has never been settled. The table of nations puts Ophir among the sons of Joktan, between Sheba and Havilah, which points to Arabia, and many scholars look for it on the south-western coast of the peninsula, in the Yemen, or across the straits on the African shore, the Punt of Egyptian voyages. Others have sent Solomon's ships farther: Josephus placed Ophir in India, and later writers named Sri Lanka, Goa and Sofala in Mozambique."
    - "The Spaniards who found the Solomon Islands in 1568 named them in the hope that they had found Ophir, and Karl Mauch in 1871 took the ruins of Great Zimbabwe for Ophir. No inscription names the land. An eighth-century ostracon from Tell Qasile near Tel Aviv, however, reads “gold of Ophir to Beth-horon, thirty shekels”, so, if the ostracon is genuine, as most hold, the phrase was a merchant's term for a known kind of gold."
    - "Kings tells how Hiram of Tyre sent sailors “that had knowledge of the sea” to man Solomon's fleet at Ezion-geber: “they came to Ophir, and fetched from thence gold, four hundred and twenty talents” (Chronicles says 450), and with the gold “great plenty of almug trees, and precious stones”, from which the king made pillars for the Temple and harps for the singers. A century later Jehoshaphat “made ships of Tharshish to go to Ophir for gold: but they went not; for the ships were broken at Ezion-geber”."
    - "Elsewhere the name is a byword for the finest gold. David gave for the Temple “three thousand talents of gold, of the gold of Ophir”; Job's friend tells him to lay up “the gold of Ophir as the stones of the brooks”, and wisdom “cannot be valued with the gold of Ophir”; the king's bride in Psalm 45 stands at his right hand “in gold of Ophir”; and Isaiah says the Lord will make a man more precious “than the golden wedge of Ophir”. The map marks south-western Arabia as the likeliest region and shows the other candidates beside it."
  ru:
    - "Офир — страна золота в Ветхом Завете, куда плавали на кораблях из Ецион-Гавера в вершине залива Акаба. Где она лежала, так и не установлено. Таблица народов помещает Офира среди сыновей Иоктана, между Шевой и Хавилой, а это указывает на Аравию, и многие учёные ищут его на юго-западном побережье полуострова, в Йемене, или за проливом на африканском берегу, в Пунте египетских плаваний. Другие отправляли корабли Соломона дальше: Иосиф Флавий помещал Офир в Индии, а позднейшие авторы называли Шри-Ланку, Гоа и Софалу в Мозамбике."
    - "Испанцы, открывшие в 1568 г. Соломоновы острова, назвали их так в надежде, что нашли Офир, а Карл Маух в 1871 г. принял руины Большого Зимбабве за Офир. Ни одна надпись не называет эту страну. Однако остракон VIII века до н. э. из Телль-Касиле близ Тель-Авива гласит: «золото Офира для Беф-Орона, тридцать сиклей», — значит, если остракон подлинный, как считает большинство, выражение было купеческим обозначением известного сорта золота."
    - "Третья книга Царств рассказывает, как Хирам Тирский прислал на флот Соломона в Ецион-Гавере «корабельщиков, знающих море»: «и отправились они в Офир, и взяли оттуда золота четыреста двадцать талантов» (по Паралипоменон — четыреста пятьдесят), а вместе с золотом «великое множество красного дерева и драгоценных камней», из которых царь сделал перила для Храма и гусли для певцов. Веком позже Иосафат «сделал корабли на море, чтобы ходить в Офир за золотом; но они не дошли, ибо разбились в Ецион-Гавере»."
    - "В других местах это имя — синоним лучшего золота. Давид дал на Храм «три тысячи талантов золота, золота Офирского»; друг Иова советует ему вменять «в камни потоков — золото Офирское», а о мудрости сказано: «не оценивается она золотом Офирским»; невеста царя в 44-м псалме стоит одесную его «в Офирском золоте»; Исаия говорит, что Господь сделает мужей «дороже золота Офирского». На карте юго-западная Аравия отмечена как самая вероятная область, а рядом показаны другие варианты."
  uk:
    - "Офір — країна золота в Старому Заповіті, куди плавали кораблями з Еціон-Гевера на вершині Акабської затоки. Де вона лежала, так і не з’ясовано. Таблиця народів ставить Офіра серед синів Йоктана, між Шевою та Хавілою, що вказує на Аравію, і багато вчених шукають його на південно-західному узбережжі півострова, в Ємені, або за протокою на африканському березі, у Пунті єгипетських плавань. Інші відправляли кораблі Соломона далі: Йосиф Флавій розташовував Офір в Індії, а пізніші автори називали Шрі-Ланку, Гоа та Софалу в Мозамбіку."
    - "Іспанці, які 1568 року відкрили Соломонові острови, назвали їх так у надії, що знайшли Офір, а Карл Маух 1871 року прийняв руїни Великого Зімбабве за Офір. Жоден напис не називає цієї країни. Проте острак VIII ст. до н. е. з Телль-Касіле поблизу Тель-Авіва читається: «золото Офіру для Бет-Хорона, тридцять шекелів», тож, якщо острак справжній, як вважає більшість, цей вислів був купецьким терміном для відомого сорту золота."
    - "У Царів розповідається, як Хірам Тірський послав моряків, «що з морем обізнані були», на Соломонів флот в Еціон-Гевері: «прибули вони в Офир, і взяли звідти золота чотириста й двайцять талантів» (Хроніки кажуть 450), а разом із золотом — «велике множество червоного дерева й благородного каміння» (так Куліш передає «альмуг»), з якого цар зробив колони для Храму й арфи для співаків. Століттям пізніше Йосафат «побудував був і кораблї на морі, щоб ходити в Офир і привозити золото; та вони не дійшли, бо порозбивались ув Езійон-Габері»."
    - "В інших місцях це ім’я є синонімом найкращого золота. Давид дав на Храм «Три тисячі талантів золота, золота Офирського»; приятель Йова обіцяє йому золото Офіру «проміж каміннєм», а мудрість: «Не в цїнї вона з золотом Офирським»; наречена царя в Псалмі 45 стоїть праворуч від нього «в золотї Офирському»; а в Ісаї Господь обіцяє, що люди будуть «дорожші над золото Офирське». Мапа позначає південно-західну Аравію як найімовірніший регіон і показує поряд інші кандидатури."
  es:
    - "Ofir es la tierra del oro en el Antiguo Testamento, a la que se llegaba por mar desde Ezión-geber, en el extremo del golfo de Aqaba. Dónde estaba nunca se ha resuelto. La tabla de las naciones sitúa a Ofir entre los hijos de Joctán, entre Seba y Havila, lo que apunta a Arabia, y muchos estudiosos la buscan en la costa suroccidental de la península, en Yemen, o al otro lado del estrecho, en la costa africana, el Punt de los viajes egipcios. Otros han enviado más lejos las naves de Salomón: Josefo situó Ofir en la India, y escritores posteriores nombraron Sri Lanka, Goa y Sofala en Mozambique."
    - "Los españoles que encontraron las islas Salomón en 1568 les dieron ese nombre con la esperanza de haber hallado Ofir, y Karl Mauch en 1871 tomó las ruinas del Gran Zimbabue por Ofir. Ninguna inscripción nombra la tierra. Un óstracon del siglo VIII de Tell Qasile, cerca de Tel Aviv, lee sin embargo «oro de Ofir para Bet-horón, treinta siclos», de modo que, si el óstracon es auténtico, como la mayoría sostiene, la expresión era un término de comerciante para una clase conocida de oro."
    - "Reyes cuenta cómo Hiram de Tiro envió marineros «diestros en la mar» para tripular la flota de Salomón en Ezión-geber: «fueron á Ophir, y tomaron de allí oro, cuatrocientos y veinte talentos» (Crónicas dice 450), y con el oro «muy mucha madera de brasil, y piedras preciosas», con las que el rey hizo balaustres para el templo y arpas para los cantores. Un siglo después, «Había Josaphat hecho navíos en Tharsis, los cuales habían de ir á Ophir por oro; mas no fueron, porque se rompieron en Ezion-geber»."
    - "En otros pasajes el nombre es sinónimo del oro más fino. David dio para el templo «tres mil talentos de oro, de oro de Ophir»; el amigo de Job le dice que ponga «como piedras de arroyos oro de Ophir», y la sabiduría «No puede ser apreciada con oro de Ophir»; la reina del Salmo 45 está a la diestra del rey «con oro de Ophir»; e Isaías dice que el Señor hará al hombre más precioso «más que el oro de Ophir». El mapa señala la Arabia suroccidental como la región más probable y muestra a su lado los demás candidatos."
  pt:
    - "Ofir é a terra do ouro no Antigo Testamento, alcançada por navio a partir de Eziom-Geber, na cabeça do golfo de Aqaba. Onde ficava nunca foi decidido. A Tábua das Nações põe Ofir entre os filhos de Joctã, entre Sabá e Havilá, o que aponta para a Arábia, e muitos estudiosos a procuram na costa sudoeste da península, no Iêmen, ou do outro lado do estreito, na costa africana, o Punte das viagens egípcias. Outros enviaram os navios de Salomão mais longe: Josefo situou Ofir na Índia, e autores posteriores citaram o Sri Lanka, Goa e Sofala, em Moçambique."
    - "Os espanhóis que encontraram as Ilhas Salomão em 1568 lhes deram esse nome na esperança de terem achado Ofir, e Karl Mauch, em 1871, tomou as ruínas do Grande Zimbábue por Ofir. Nenhuma inscrição nomeia a terra. Um óstraco do século VIII de Tell Qasile, perto de Tel Aviv, porém, diz “ouro de Ofir para Bete-Horom, trinta siclos”; assim, se o óstraco é autêntico, como a maioria sustenta, a expressão era um termo de comerciante para um tipo conhecido de ouro."
    - "Reis conta como Hirão de Tiro enviou marinheiros “que tinham conhecimento do mar” para tripular a frota de Salomão em Eziom-Geber: “Eles foram a Ofir, e buscaram de lá ouro, quatrocentos e vinte talentos” (Crônicas diz 450), e com o ouro “grandes quantidades de árvores de almogue e pedras preciosas”, com as quais o rei fez pilares para o Templo e harpas para os cantores. Um século depois, Josafá “construiu navios de Társis para irem a Ofir em busca de ouro, mas eles não foram, pois os navios naufragaram em Eziom-Geber”."
    - "Em outros lugares o nome é sinônimo do ouro mais fino. Davi deu para o Templo “três mil talentos de ouro, do ouro de Ofir”; o amigo de Jó lhe diz que ponha “o ouro de Ofir entre as pedras dos ribeiros”, e a sabedoria “não pode ser avaliada com o ouro de Ofir”; a noiva do rei no Salmo 45 está à sua direita “com ouro de Ofir”; e Isaías diz que o Senhor tornará o homem mais raro “do que o ouro puro de Ofir”. O mapa marca o sudoeste da Arábia como a região mais provável e mostra os outros candidatos ao lado."
  de:
    - "Ofir ist im Alten Testament das Goldland, das man mit dem Schiff von Ezjon-Geber am Kopf des Golfs von Akaba aus erreichte. Wo es lag, ist nie geklärt worden. Die Völkertafel stellt Ofir unter die Söhne Joktans, zwischen Scheba und Hawila, was auf Arabien weist, und viele Gelehrte suchen es an der südwestlichen Küste der Halbinsel, im Jemen, oder jenseits der Meerenge an der afrikanischen Küste, im Punt der ägyptischen Seefahrten. Andere haben Salomos Schiffe weiter geschickt: Josephus setzte Ofir nach Indien, spätere Autoren nannten Sri Lanka, Goa und Sofala in Mosambik."
    - "Die Spanier, die 1568 die Salomonen fanden, benannten sie in der Hoffnung, Ofir gefunden zu haben, und Karl Mauch hielt 1871 die Ruinen von Groß-Simbabwe für Ofir. Keine Inschrift nennt das Land. Ein Ostrakon des 8. Jahrhunderts aus Tell Qasile bei Tel Aviv liest jedoch „Gold von Ofir für Bet-Horon, dreißig Schekel“; wenn das Ostrakon echt ist, wie die meisten annehmen, war die Wendung ein Kaufmannsausdruck für eine bekannte Goldsorte."
    - "Das Buch der Könige erzählt, wie Hiram von Tyrus Seeleute, die „auf dem Meer erfahren waren“, zur Flotte Salomos nach Ezjon-Geber sandte: „sie kamen gen Ophir und holten daselbst vierhundertzwanzig Zentner Gold“ (die Chronik sagt 450), und mit dem Gold „sehr viel Sandelholz und Edelgestein“, woraus der König Pfeiler für den Tempel und Harfen für die Sänger machen ließ. Ein Jahrhundert später: „Josaphat hatte Schiffe lassen machen aufs Meer, die nach Ophir gehen sollten, Gold zu holen. Aber sie gingen nicht; denn sie wurden zerbrochen zu Ezeon-Geber“."
    - "Sonst ist der Name ein Inbegriff feinsten Goldes. David gab für den Tempel „dreitausend Zentner Gold von Ophir“; Hiobs Freund rät ihm: „wirf in den Staub dein Gold und zu den Steinen der Bäche das Ophirgold“, und die Weisheit: „Es gilt ihr nicht gleich ophirisch Gold“; die Braut des Königs in Psalm 45 steht zu seiner Rechten in Ophirgold; und Jesaja sagt, ein Mensch werde „werter denn Goldes Stücke aus Ophir“ sein. Die Karte kennzeichnet Südwestarabien als wahrscheinlichste Region und zeigt die anderen Kandidaten daneben."
  fr:
    - "Ophir est le pays de l’or dans l’Ancien Testament, atteint par bateau depuis Étsjon-Guéber, à la tête du golfe d’Aqaba. On n’a jamais établi où il se trouvait. Le tableau des nations place Ophir parmi les fils de Joktan, entre Schéba et Havila, ce qui oriente vers l’Arabie, et bien des spécialistes le cherchent sur la côte sud-ouest de la péninsule, au Yémen, ou de l’autre côté du détroit sur le rivage africain, le Pount des voyages égyptiens. D’autres ont envoyé les navires de Salomon plus loin : Flavius Josèphe plaça Ophir en Inde, et des auteurs plus tardifs nommèrent Sri Lanka, Goa et Sofala au Mozambique."
    - "Les Espagnols qui découvrirent les îles Salomon en 1568 leur donnèrent ce nom dans l’espoir d’avoir trouvé Ophir, et Karl Mauch prit en 1871 les ruines du Grand Zimbabwe pour Ophir. Aucune inscription ne nomme le pays. Un ostracon du VIIIe siècle de Tell Qasile, près de Tel-Aviv, porte cependant « or d’Ophir pour Beth-Horon : trente sicles » ; si l’ostracon est authentique, comme la plupart le tiennent, l’expression était un terme de marchand pour une sorte d’or connue."
    - "Les Rois racontent qu’Hiram de Tyr envoya des matelots « connaissant la mer » pour armer la flotte de Salomon à Étsjon-Guéber : « Ils allèrent à Ophir, et ils y prirent de l’or, quatre cent vingt talents » (les Chroniques disent 450), et avec l’or « une grande quantité de bois de sandal et des pierres précieuses », dont le roi fit des balustrades pour le Temple et des harpes pour les chantres. Un siècle plus tard, Josaphat « construisit des navires de Tarsis pour aller à Ophir chercher de l’or ; mais il n’y alla point, parce que les navires se brisèrent à Étsjon-Guéber »."
    - "Ailleurs le nom est synonyme de l’or le plus fin. David donna pour le Temple « trois mille talents d’or, d’or d’Ophir » ; l’ami de Job lui dit de jeter « l’or d’Ophir parmi les cailloux des torrents », et la sagesse « ne se pèse pas contre l’or d’Ophir » ; la reine du Psaume 45 se tient à la droite du roi, « parée d’or d’Ophir » ; et Ésaïe dit que le Seigneur rendra les hommes « plus rares que l’or d’Ophir ». La carte marque l’Arabie du sud-ouest comme la région la plus probable et montre les autres candidats à côté."
  it:
    - "Ofir è la terra dell’oro nell’Antico Testamento, raggiunta per nave da Ezion-Gheber, in fondo al Golfo di Aqaba. Dove si trovasse non è mai stato stabilito. La tavola delle nazioni pone Ofir tra i figli di Ioktan, tra Saba e Avila, il che rimanda all’Arabia, e molti studiosi la cercano sulla costa sud-occidentale della penisola, nello Yemen, o al di là dello stretto sulla riva africana, il Punt dei viaggi egizi. Altri hanno spinto più lontano le navi di Salomone: Giuseppe Flavio collocò Ofir in India, e scrittori posteriori nominarono lo Sri Lanka, Goa e Sofala in Mozambico."
    - "Gli Spagnoli che scoprirono le Isole Salomone nel 1568 le chiamarono così nella speranza di aver trovato Ofir, e Karl Mauch nel 1871 prese le rovine del Grande Zimbabwe per Ofir. Nessuna iscrizione nomina la terra. Un ostracon dell’VIII secolo da Tell Qasile presso Tel Aviv, tuttavia, riporta «oro di Ofir per Bet-Oron, trenta sicli», per cui, se l’ostracon è autentico, come i più ritengono, l’espressione era un termine mercantile per un tipo noto di oro."
    - "I Re raccontano come Chiram di Tiro mandò marinai «che conoscevano il mare» a equipaggiare la flotta di Salomone a Ezion-Gheber: «Essi andarono ad Ofir, vi presero dell’oro, quattrocentoventi talenti» (le Cronache dicono 450), e con l’oro «legno di sandalo in grandissima quantità, e delle pietre preziose», dai quali il re fece balaustrate per il Tempio e cetre per i cantori. Un secolo dopo Giosafat «costruì delle navi di Tarsis per andare a Ofir in cerca d’oro; ma poi non andò, perché le navi naufragarono a Etsion-Gheber»."
    - "Altrove il nome è sinonimo dell’oro più fine. Davide diede per il Tempio «tremila talenti d’oro, d’oro d’Ofir»; l’amico di Giobbe gli dice di gettare «l’oro nella polvere e l’oro d’Ophir tra i ciottoli del fiume», e la sapienza «non la si acquista con l’oro di Ofir»; la sposa del re nel Salmo 45 sta alla sua destra «adorna d’oro d’Ophir»; e Isaia dice che il Signore renderà gli uomini «più rari dell’oro d’Ofir». La mappa segna l’Arabia sud-occidentale come la regione più probabile e mostra accanto gli altri candidati."
  pl:
    - "Ofir to w Starym Testamencie kraina złota, do której płynęło się statkiem z Esjon-Geber u wierzchołka Zatoki Akaba. Gdzie leżała, nigdy nie rozstrzygnięto. Tablica narodów umieszcza Ofir wśród synów Joktana, między Szebą a Chawilą, co wskazuje na Arabię, i wielu uczonych szuka go na południowo-zachodnim wybrzeżu półwyspu, w Jemenie, albo za cieśniną na brzegu afrykańskim, w Puncie egipskich wypraw. Inni posyłali okręty Salomona dalej: Józef Flawiusz umieścił Ofir w Indiach, a późniejsi pisarze wymieniali Sri Lankę, Goa i Sofalę w Mozambiku."
    - "Hiszpanie, którzy w 1568 roku odkryli Wyspy Salomona, nazwali je w nadziei, że znaleźli Ofir, a Karl Mauch w 1871 roku wziął ruiny Wielkiego Zimbabwe za Ofir. Żaden napis nie wymienia tej krainy. Jednak ostrakon z VIII wieku z Tell Qasile koło Tel Awiwu brzmi: „złoto z Ofir dla Bet-Choron, trzydzieści szekli”, więc jeśli ostrakon jest autentyczny, jak sądzi większość, wyrażenie było kupieckim określeniem znanego gatunku złota."
    - "Księgi Królewskie opowiadają, jak Hiram z Tyru posłał na okręty „sługi swe, żeglarze świadome morza”, by obsadzili flotę Salomona w Esjon-Geber: „przypłynąwszy do Ofir, wzięli stamtąd złota cztery sta i dwadzieścia talentów” (Kroniki podają 450), a wraz ze złotem przyniesiono z Ofir „drzewa almugimowego bardzo wiele i kamienia drogiego”, z których król uczynił filary dla Świątyni i harfy dla śpiewaków. Wiek później: „I nasprawiał Jozafat okrętów na morze, aby chodziły do Ofir po złoto. Ale nie doszły; bo się rozbiły one okręty w Asyjon Gaber”."
    - "Gdzie indziej nazwa jest synonimem najczystszego złota. Dawid dał na Świątynię „trzy tysiące talentów złota, złota z Ofir”; przyjaciel Hioba mówi mu: „Tedy nakładziesz po ziemi wybornego złota; a złota z Ofir, jako kamienia z potoku”, a o mądrości: „Nie może być oszacowana za złoto Ofir”; w Psalmie 45 „stanęła małżonka po prawicy twojej w kosztownem złocie z Ofir”; a Izajasz mówi, że Pan uczyni człowieka droższym: „Męża droższym uczynię nad szczere złoto, a człowieka nad złoto z Ofir”. Mapa zaznacza południowo-zachodnią Arabię jako najbardziej prawdopodobny region i pokazuje obok innych kandydatów."
  cs:
    - "Ofír je ve Starém zákoně zemí zlata, k níž se plulo z Ecjon-gebera na konci Akabského zálivu. Kde ležela, nebylo nikdy rozhodnuto. Tabulka národů klade Ofír mezi syny Joktanovy, mezi Šebu a Chavílu, což ukazuje do Arábie, a mnozí učenci ji hledají na jihozápadním pobřeží poloostrova, v Jemenu, nebo přes úžinu na africkém břehu, v Puntu egyptských plaveb. Jiní poslali Šalomounovy lodě dál: Josephus umístil Ofír do Indie a pozdější spisovatelé jmenovali Srí Lanku, Goa a Sofalu v Mosambiku."
    - "Španělé, kteří roku 1568 objevili Šalomounovy ostrovy, je tak pojmenovali v naději, že našli Ofír, a Karl Mauch roku 1871 pokládal ruiny Velkého Zimbabwe za Ofír. Žádný nápis zemi nejmenuje. Ostrakon z 8. století z Tell Kasile u Tel Avivu však uvádí „zlato z Ofíru pro Bét-choron, třicet šekelů“, takže pokud je ostrakon pravý, jak většina soudí, byl tento výraz obchodnickým označením známého druhu zlata."
    - "Knihy Královské vypravují, že Chíram Týrský poslal na Šalomounovu flotilu v Ecjon-geberu námořníky, „plavce umělé na moři“: „Kteříž přeplavivše se do Ofir, nabrali tam zlata čtyři sta a dvadceti centnéřů“ (Kroniky praví 450) a se zlatem „dříví almugim velmi mnoho i kamení drahého“, z něhož král učinil sloupy pro Chrám a harfy pro zpěváky. O století později Jozafat „nadělal ... lodí mořských, aby jeli do Ofir pro zlato. Ale nejeli, nebo polámaly se lodí v Aziongaber“."
    - "Jinde je jméno synonymem nejjemnějšího zlata. David dal na Chrám „tři tisíce centnéřů zlata, zlata z Ofir“; Jobův přítel mu radí složit „zlata z Ofir“ místo kamení potočního a o moudrosti se praví, že „Nemůže býti ceněna za zlato z Ofir“; královská nevěsta v žalmu 45 stojí po jeho pravici ve zlatě z Ofíru; a Izajáš praví, že Hospodin učiní člověka vzácnějším „nad zlato z Ofir“. Mapa vyznačuje jako nejpravděpodobnější oblast jihozápadní Arábii a ukazuje vedle ní ostatní kandidáty."
  nl:
    - "Ofir is in het Oude Testament het land van het goud, per schip bereikt vanuit Ezeon-Geber aan het uiteinde van de Golf van Akaba. Waar het lag, is nooit beslist. De volkerentafel plaatst Ofir onder de zonen van Joktan, tussen Seba en Havila, wat op Arabië wijst, en veel geleerden zoeken het aan de zuidwestkust van het schiereiland, in Jemen, of aan de overkant van de zeestraat aan de Afrikaanse kust, het Poent van de Egyptische tochten. Anderen hebben Salomo’s schepen verder gestuurd: Josephus plaatste Ofir in Indië, en latere schrijvers noemden Sri Lanka, Goa en Sofala in Mozambique."
    - "De Spanjaarden die in 1568 de Salomonseilanden vonden, gaven ze die naam in de hoop Ofir te hebben gevonden, en Karl Mauch hield in 1871 de ruïnes van Groot-Zimbabwe voor Ofir. Geen opschrift noemt het land. Een ostracon uit de 8e eeuw van Tell Qasile bij Tel Aviv leest echter “goud van Ofir voor Beth-Horon, dertig sjekel”, zodat de uitdrukking, als het ostracon echt is, zoals de meesten menen, een koopmansterm was voor een bekende soort goud."
    - "Koningen vertelt hoe Hiram van Tyrus matrozen, “kenners van de zee”, zond om Salomo’s vloot bij Ezeon-Geber te bemannen: “zij kwamen te Ofir, en haalden van daar aan goud, vierhonderd en twintig talenten” (Kronieken zegt 450), en met het goud “zeer veel almuggimhout en kostelijk gesteente”, waarvan de koning zuilen voor de tempel maakte en harpen voor de zangers. Een eeuw later: “En Josafat maakte schepen van Tharsis, om naar Ofir te gaan om goud; maar zij gingen niet, want de schepen werden gebroken te Ezeon-Geber”."
    - "Elders is de naam een spreekwoord voor het fijnste goud. David gaf voor de tempel “drie duizend talenten gouds, van het goud van Ofir”; Jobs vriend zegt hem “het goud van Ofir bij den rotssteen der beken” neer te leggen, en de wijsheid “kan niet geschat worden tegen fijn goud van Ofir”; de bruid van de koning in Psalm 45 staat aan zijn rechterhand “in het fijnste goud van Ofir”; en Jesaja zegt dat de Heer een man dierbaarder zal maken “dan fijn goud van Ofir”. De kaart wijst Zuidwest-Arabië aan als het waarschijnlijkste gebied en toont de andere kandidaten ernaast."
  sv:
    - "Ofir är guldlandet i Gamla testamentet, som nåddes med skepp från Esjon-Geber vid Akababuktens spets. Var det låg har aldrig avgjorts. Folkens tabell placerar Ofir bland Joktans söner, mellan Saba och Havila, vilket pekar mot Arabien, och många forskare söker det på halvöns sydvästra kust, i Jemen, eller tvärs över sundet på den afrikanska stranden, Punt i de egyptiska färderna. Andra har sänt Salomos skepp längre: Josefus förlade Ofir till Indien, och senare författare nämnde Sri Lanka, Goa och Sofala i Moçambique."
    - "Spanjorerna som fann Salomonöarna 1568 gav dem namn i hopp om att ha funnit Ofir, och Karl Mauch tog 1871 ruinerna av Stora Zimbabwe för Ofir. Ingen inskription nämner landet. En ostrakon från 700-talet från Tell Qasile nära Tel Aviv lyder emellertid ”Ofirguld till Bet-Horon, trettio shekel”, så, om ostrakonet är äkta, vilket de flesta anser, var uttrycket en handelsterm för en känd sorts guld."
    - "Kungaboken berättar hur Hiram av Tyros sände ”sjökunnigt skeppsmanskap” för att bemanna Salomos flotta i Esjon-Geber: ”De foro till Ofir och hämtade därifrån guld, fyra hundra tjugu talenter” (Krönikeböckerna anger 450), och tillsammans med guldet ”almugträ i stor myckenhet, ävensom ädla stenar”, av vilka kungen lät göra pelare till templet och harpor åt sångarna. Ett århundrade senare var det Josafat som ”hade låtit bygga Tarsis-skepp, som skulle gå till Ofir för att hämta guld; men de kommo aldrig åstad, ty de ledo skeppsbrott vid Esjon-Geber”."
    - "På andra ställen är namnet ett begrepp för det finaste guldet. David gav till templet ”tre tusen talenter guld, guld från Ofir”; hos Jobs vän är det ”Ofirs-guldet ibland bäckens stenar”, och visheten ”väges icke upp med guld från Ofir”; kungens brud i Psalm 45 står vid hans högra sida ”i guld från Ofir”; och Jesaja säger att Herren ska göra en människa ”mer sällsynt än guld från Ofir”. Kartan markerar sydvästra Arabien som den sannolikaste regionen och visar de andra kandidaterna bredvid."
  nb:
    - "Ofir er gulllandet i Det gamle testamente, nådd med skip fra Esjon-Geber innerst i Aqababukta. Hvor det lå, er aldri blitt avgjort. Folkeslagstabellen setter Ofir blant Joktans sønner, mellom Sjeba og Havila, noe som peker mot Arabia, og mange forskere søker det på halvøyas sørvestlige kyst, i Jemen, eller på den afrikanske kysten på den andre siden av stredet, egypternes Punt. Andre har sendt Salomos skip lenger: Josefus plasserte Ofir i India, og senere forfattere nevnte Sri Lanka, Goa og Sofala i Mosambik."
    - "Spanjolene som fant Salomonøyene i 1568 ga dem navn i håp om at de hadde funnet Ofir, og Karl Mauch tok i 1871 ruinene av Great Zimbabwe for Ofir. Ingen inskripsjon nevner landet. Et ostrakon fra 700-tallet f.Kr. fra Tell Qasile nær Tel Aviv lyder imidlertid «gull fra Ofir til Bet-Horon, tretti sekel», så hvis ostrakonet er ekte, som de fleste mener, var uttrykket en kjøpmannsbetegnelse for en kjent gulltype."
    - "Kongebøkene forteller at Hiram av Tyros sendte sjøfolk, «sjøvant mannskap», til å bemanne Salomos flåte i Esjon-Geber: «De kom til Ofir og hentet gull derfra, fire hundre og tyve talenter» (Krønikebøkene sier 450), og sammen med gullet «sandeltre i stor mengde og dyre stener», som kongen gjorde støtter av til tempelet og harper til sangerne. Et århundre senere hadde Josjafat «ti Tarsis-skib som skulde gå til Ofir efter gull; men de kom ikke avsted, for nogen av skibene forliste ved Esjon-Geber»."
    - "Ellers er navnet et ordtak for det fineste gull. David ga til tempelet «tre tusen talenter gull, gull fra Ofir»; Jobs venn sier at han skal kaste «ditt Ofir-gull blandt bekkenes stener», og visdommen «opveies ikke med Ofirs gull»; kongens brud i Salme 45 står ved hans høyre hånd «i gull fra Ofir»; og Jesaja sier at Herren skal gjøre mennesker «sjeldnere enn gull fra Ofir». Kartet markerer det sørvestlige Arabia som den mest sannsynlige regionen og viser de andre kandidatene ved siden av."
  tl:
    - "Ang Ophir ay ang lupain ng ginto sa Lumang Tipan, na inaabot sa pamamagitan ng barko mula sa Esion-geber sa dulo ng Golpo ng Aqaba. Hindi kailanman nalutas kung saan ito matatagpuan. Inilalagay ng talaan ng mga bansa ang Ophir sa mga anak ni Joctan, sa pagitan ng Seba at Havila, na tumutukoy sa Arabia, at maraming iskolar ang naghahanap nito sa timog-kanlurang baybayin ng tangway, sa Yemen, o sa kabila ng makipot na dagat sa baybaying Aprikano, ang Punt ng mga paglalakbay ng mga Egipcio. Ipinadala naman ng iba ang mga barko ni Salomon nang mas malayo: inilagay ni Josephus ang Ophir sa India, at pinangalanan ng mga huling manunulat ang Sri Lanka, Goa at Sofala sa Mozambique."
    - "Pinangalanan ng mga Kastila na nakatuklas sa Mga Pulo ng Solomon noong 1568 ang mga ito sa pag-asang natagpuan nila ang Ophir, at noong 1871 ay inakala ni Karl Mauch na ang mga guho ng Great Zimbabwe ay ang Ophir. Walang inskripsiyong nagngangalan sa lupain. Gayunman, isang ostrakon mula sa ika-8 na siglo mula sa Tell Qasile malapit sa Tel Aviv ay bumabasa ng “ginto ng Ophir para sa Beth-horon, tatlumpung siklo”, kaya, kung tunay ang ostrakon, gaya ng pinaniniwalaan ng karamihan, ang pariralang iyon ay termino ng mangangalakal para sa isang kilalang uri ng ginto."
    - "Isinasalaysay ng Mga Hari kung paano nagsugo si Hiram ng Tiro ng mga magdadagat na “bihasa sa dagat” upang tauhan ang hukbong-dagat ni Salomon sa Esion-geber: “sila'y nagsiparoon sa Ophir at nagsikuha mula roon ng ginto, na apat na raan at dalawang pung talento” (450 ang sinasabi ng Mga Cronica), at kasama ng ginto ay “saganang kahoy na almug at mga mahalagang bato”, na ginawa ng hari na mga haligi para sa Templo at mga alpa para sa mga mang-aawit. Makalipas ang isang siglo, si Josaphat ay “gumawa ng mga sasakyang dagat sa Tharsis, upang pumaroon sa Ophir dahil sa ginto: nguni't hindi sila nagsiparoon; sapagka't ang mga sasakyan ay nangasira sa Ezion-geber”."
    - "Sa ibang lugar, ang pangalan ay kasingkahulugan ng pinakamainam na ginto. Nagbigay si David para sa Templo ng “tatlong libong talentong ginto, na ginto sa Ophir”; sinasabi ng kaibigan ni Job na ilagay niya ang “ginto ng Ophir sa gitna ng mga bato ng mga batis”, at ang karunungan ay “Hindi mahahalagahan ng ginto sa Ophir”; ang nobya ng hari sa Awit 45 ay nakatayo sa kanan niya “na may ginto sa Ophir”; at sinasabi ni Isaias na gagawin ng Panginoon na mas mahalaga ang isang tao “higit kay sa dalisay na ginto ng Ophir”. Minamarkahan ng mapa ang timog-kanlurang Arabia bilang pinakamalamang na rehiyon at ipinapakita ang ibang mga kandidato sa tabi nito."
  da:
    - "Ofir er guldlandet i Det Gamle Testamente, nået til søs fra Esjon-Geber ved enden af Aqababugten. Hvor det lå, er aldrig afgjort. Folketavlen sætter Ofir blandt Joktans sønner, mellem Sjeba og Havila, hvilket peger på Arabien, og mange forskere søger det på halvøens sydvestlige kyst, i Yemen, eller på den afrikanske kyst over sundet, de egyptiske rejsers Punt. Andre har sendt Salomos skibe længere: Josefus placerede Ofir i Indien, og senere forfattere nævnte Sri Lanka, Goa og Sofala i Mozambique."
    - "Spanierne, der fandt Salomonøerne i 1568, gav dem navn i håb om, at de havde fundet Ofir, og Karl Mauch tog i 1871 ruinerne af Great Zimbabwe for Ofir. Ingen indskrift nævner landet. En ostrakon fra 700-tallet f.Kr. fra Tell Qasile nær Tel Aviv læser dog »Ofirs guld til Bet-Horon, 30 sekel«, så, hvis ostrakonen er ægte, som de fleste mener, var udtrykket en købmandsbetegnelse for en kendt slags guld."
    - "Kongebøgerne fortæller, hvordan Hiram af Tyrus sendte sømænd, »forfarne til Søs«, for at bemande Salomos flåde i Esjon-Geber: »De kom til Ofir og hentede derfra fire Hundrede og tyve Centner Guld« (Krønikebøgerne siger 450), og med guldet »saare meget Hebentræ og kostbare Stene«, hvoraf kongen lod gøre piller til templet og harper til sangerne. Et århundrede senere: »Josafat havde ti Tharsisskibe, som skulde drage til Ofir efter Guld; men de droge ikke derhen, thi Skibene bleve sønderslagne i Ezion-Geber«."
    - "Andre steder er navnet et ord for det fineste guld. David gav til templet »Tre Tusinde Centner Guld«, guld fra Ofir; Jobs ven siger til ham, at han skal kaste »Ofirs Guld blandt Bækkens Stene«, og visdommen »kan ikke opvejes med Guld fra Ofir«; kongens brud i Salme 45 står ved hans højre hånd »i Guld fra Ofir«; og Esajas siger, at Herren vil gøre et menneske »sjældnere end Guld fra Ofir«. Kortet markerer det sydvestlige Arabien som den sandsynligste egn og viser de andre kandidater ved siden af."
