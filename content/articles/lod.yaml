body:
  en:
    - "Lod, called Lydda in Greek, lies in the coastal plain about 18 km south-east of Joppa, where the plain meets the foothills of Judaea. People lived here as early as the sixth millennium BC, and in the Early Bronze Age it was an important settlement. Lod is usually recognised in the list of Canaanite towns that Thutmose III of Egypt had carved at Karnak in the fifteenth century BC."
    - "Chronicles names Shamed of Benjamin as the builder of Ono and Lod, and after the exile 725 people of Lod, Hadid and Ono returned from Babylon (721 in Nehemiah's list). In the Hellenistic age Lydda belonged to the district of Samaria until about 145 BC, when the Seleucid king Demetrius II gave it, with two neighbouring districts, to Judaea. In 43 BC Cassius, raising money after Caesar's murder, sold its people into slavery; Mark Antony soon ordered the Jews who had been sold to be set free."
    - "Peter came down to the saints at Lydda and healed Aeneas, who had kept his bed eight years, and all who lived at Lydda and Saron turned to the Lord. Because Lydda was near Joppa, the disciples there sent for Peter when Tabitha died. In AD 66 Cestius Gallus, the governor of Syria, found the town empty, its people gone up to Jerusalem for the feast of tabernacles, and burnt it; two years later it was in Vespasian's hands."
    - "After AD 70 Lydda was a centre of Jewish learning, where rabbis such as Eliezer ben Hyrcanus and Tarfon taught. About AD 200 Septimius Severus made it a Roman city named Diospolis, and in the fourth century Eusebius used Diospolis as a landmark for many villages. In December 415 a synod of fourteen bishops met here and acquitted the monk Pelagius; Augustine wrote a treatise on its proceedings. Christian tradition later placed the tomb of St George at Lydda."
  ru:
    - "Лидда, по-еврейски Лод, лежит на прибрежной равнине, примерно в 18 км к юго-востоку от Иоппии, там, где равнина переходит в предгорья Иудеи. Люди жили здесь уже в VI тысячелетии до н. э., а в раннем бронзовом веке это было крупное поселение. Лод обычно узнают в списке ханаанских городов, который египетский фараон Тутмос III велел высечь в Карнаке в XV веке до н. э."
    - "Книга Паралипоменон называет Шемера из колена Вениаминова строителем Оно и Лода, а после плена из Вавилона вернулись семьсот двадцать пять уроженцев Лидды, Хадида и Оно (в списке Неемии — семьсот двадцать один). В эллинистическую эпоху Лидда относилась к области Самарии, пока около 145 г. до н. э. селевкидский царь Деметрий II не передал её вместе с двумя соседними округами Иудее. В 43 г. до н. э. Кассий, собиравший деньги после убийства Цезаря, продал её жителей в рабство; вскоре Марк Антоний велел освободить проданных иудеев."
    - "Пётр пришёл к святым, живущим в Лидде, и исцелил Энея, который восемь лет лежал в постели, и все, живущие в Лидде и в Сароне, обратились к Господу. Так как Лидда была близ Иоппии, тамошние ученики послали за Петром, когда умерла Тавифа. В 66 г. н. э. наместник Сирии Цестий Галл нашёл город пустым — жители ушли в Иерусалим на праздник Кущей — и сжёг его; через два года город был в руках Веспасиана."
    - "После 70 г. н. э. Лидда была средоточием иудейской учёности: здесь учили такие раввины, как Элиэзер бен Гиркан и Тарфон. Около 200 г. н. э. Септимий Север сделал её римским городом под именем Диосполь, а в IV веке Евсевий указывал по Диосполю расположение многих селений. В декабре 415 г. здесь собрался собор четырнадцати епископов, который оправдал монаха Пелагия; Августин написал трактат о его деяниях. Позднее христианское предание поместило в Лидде гробницу святого Георгия."
  uk:
    - "Лод, грецькою Лідда, лежить на прибережній рівнині приблизно за 18 км на південний схід від Яффи, там, де рівнина сходиться з передгір’ям Юдеї. Люди жили тут уже в VI тисячолітті до н. е., а в ранню бронзову добу це було важливе поселення. Лод зазвичай упізнають у переліку ханаанських міст, які Тутмос III Єгипетський звелів вирізьбити в Карнаку в XV ст. до н. е."
    - "Книга Хронік називає Шемера з Веніяміна будівничим Оно та Лода, а після полону 725 людей із Лода, Хадіда й Оно повернулися з Вавилону (721 у переліку Неемії). В елліністичну добу Лідда належала до округу Самарії приблизно до 145 р. до н. е., коли селевкідський цар Димитрій II віддав її разом з двома сусідніми округами Юдеї. У 43 р. до н. е. Кассій, збираючи гроші після вбивства Цезаря, продав її мешканців у рабство; Марк Антоній незабаром наказав звільнити євреїв, яких було продано."
    - "Петро прийшов до святих у Лідді й оздоровив Енея, який вісім років лежав у ліжку, і всі, хто жив у Лідді та в Сароні, навернулися до Господа. Оскільки Лідда була близько до Яффи, учні там послали по Петра, коли померла Тавіта. У 66 р. н. е. Цестій Галл, намісник Сирії, знайшов місто порожнім, бо його мешканці пішли до Єрусалима на свято кучок, і спалив його; через два роки воно було в руках Веспасіана."
    - "Після 70 р. н. е. Лідда була осередком єврейської науки, де вчили такі рабини, як Еліезер бен Гіркан і Тарфон. Близько 200 р. н. е. Септимій Север зробив її римським містом під назвою Діосполь, а в IV ст. Євсевій використовував Діосполь як орієнтир для багатьох сіл. У грудні 415 р. тут зібрався синод чотирнадцяти єпископів, який виправдав ченця Пелагія; Августин написав трактат про його діяння. Християнська традиція пізніше помістила в Лідді гробницю святого Юрія."
  es:
    - "Lod, llamada Lida en griego, se encuentra en la llanura costera, a unos 18 km al sudeste de Jope, donde la llanura se encuentra con las estribaciones de Judea. Hubo gente viviendo aquí ya en el sexto milenio a. C., y en la Edad del Bronce Antiguo fue un asentamiento importante. Lod se reconoce habitualmente en la lista de ciudades cananeas que Tutmosis III de Egipto hizo grabar en Karnak en el siglo XV a. C."
    - "Crónicas nombra a Semed, de Benjamín, como constructor de Ono y Lod, y después del destierro regresaron de Babilonia 725 personas de Lod, Hadid y Ono (721 en la lista de Nehemías). En la época helenística Lida perteneció al distrito de Samaria hasta cerca de 145 a. C., cuando el rey seléucida Demetrio II la entregó a Judea, junto con otros dos distritos vecinos. En 43 a. C., Casio, que reunía dinero tras el asesinato de César, vendió a su gente como esclava; Marco Antonio ordenó pronto que se liberara a los judíos que habían sido vendidos."
    - "Pedro bajó a los santos que habitaban en Lida y sanó a Eneas, que llevaba ocho años en cama, y todos los que vivían en Lida y Sarón se convirtieron al Señor. Como Lida estaba cerca de Jope, los discípulos de allí mandaron llamar a Pedro cuando murió Tabita. En el año 66 d. C., Cestio Galo, gobernador de Siria, halló la ciudad vacía, pues su gente había subido a Jerusalén para la fiesta de los tabernáculos, y la incendió; dos años después estaba en manos de Vespasiano."
    - "Después del año 70 d. C. Lida fue un centro de estudio judío, donde enseñaron rabinos como Eliezer ben Hircano y Tarfón. Hacia el año 200 d. C. Septimio Severo la convirtió en una ciudad romana con el nombre de Diospolis, y en el siglo IV Eusebio usó Diospolis como punto de referencia para muchas aldeas. En diciembre de 415 se reunió aquí un sínodo de catorce obispos que absolvió al monje Pelagio; Agustín escribió un tratado sobre sus actas. La tradición cristiana situó más tarde en Lida la tumba de san Jorge."
  pt:
    - "Lode, chamada Lida em grego, fica na planície costeira, a cerca de 18 km a sudeste de Jope, onde a planície encontra os contrafortes da Judeia. Povos viveram aqui já no sexto milênio a.C., e na Idade do Bronze Antigo era um importante povoado. Lode é geralmente reconhecida na lista de cidades cananeias que Tutmés III do Egito mandou gravar em Karnak no século XV a.C."
    - "As Crônicas nomeiam Semede, de Benjamim, como construtor de Ono e Lode, e depois do exílio 725 pessoas de Lode, Hadide e Ono voltaram da Babilônia (721 na lista de Neemias). Na época helenística, Lida pertenceu ao distrito de Samaria até cerca de 145 a.C., quando o rei selêucida Demétrio II a deu, com dois distritos vizinhos, à Judeia. Em 43 a.C. Cássio, levantando dinheiro depois do assassinato de César, vendeu seu povo como escravo; Marco Antônio logo ordenou que os judeus vendidos fossem libertados."
    - "Pedro desceu aos santos em Lida e curou Enéias, que estava acamado havia oito anos, e todos os que viviam em Lida e Sarona se converteram ao Senhor. Como Lida ficava perto de Jope, os discípulos de lá mandaram chamar Pedro quando Tabita morreu. Em 66 d.C. Céstio Galo, governador da Síria, encontrou a cidade vazia, seu povo tendo subido a Jerusalém para a festa dos Tabernáculos, e a queimou; dois anos depois ela estava nas mãos de Vespasiano."
    - "Depois de 70 d.C., Lida foi um centro de estudos judaicos, onde ensinaram rabinos como Eliézer ben Hircano e Tarfon. Por volta de 200 d.C., Sétimo Severo fez dela uma cidade romana chamada Diópolis, e no século IV Eusébio usou Diópolis como ponto de referência para muitas aldeias. Em dezembro de 415 reuniu-se aqui um sínodo de catorze bispos que absolveu o monge Pelágio; Agostinho escreveu um tratado sobre seus atos. A tradição cristã situou depois em Lida o túmulo de São Jorge."
  de:
    - "Lod, griechisch Lydda, liegt in der Küstenebene etwa 18 km südöstlich von Joppe, wo die Ebene auf das Vorland Judäas trifft. Schon im 6. Jahrtausend v. Chr. lebten hier Menschen, und in der Frühbronzezeit war es eine bedeutende Siedlung. Lod wird gewöhnlich in der Liste kanaanäischer Städte erkannt, die Thutmosis III. von Ägypten im 15. Jahrhundert v. Chr. in Karnak einmeißeln ließ."
    - "Die Chronik nennt Schemed aus Benjamin als Erbauer von Ono und Lod, und nach dem Exil kehrten 725 Menschen aus Lod, Hadid und Ono aus Babylon zurück (721 in der Liste Nehemias). In hellenistischer Zeit gehörte Lydda bis etwa 145 v. Chr. zum Bezirk Samaria, als der seleukidische König Demetrius II. es mit zwei Nachbarbezirken Judäa gab. 43 v. Chr. verkaufte Cassius, der nach Caesars Ermordung Geld auftrieb, seine Einwohner in die Sklaverei; Marcus Antonius ließ bald darauf die verkauften Juden freilassen."
    - "Petrus kam zu den Heiligen in Lydda und heilte Äneas, der acht Jahre auf dem Bett gelegen hatte, und alle, die in Lydda und Scharon wohnten, bekehrten sich zum Herrn. Weil Lydda nahe bei Joppe lag, ließen die Jünger dort Petrus holen, als Tabita starb. Im Jahr 66 n. Chr. fand Cestius Gallus, der Statthalter Syriens, die Stadt leer, ihre Einwohner zum Laubhüttenfest nach Jerusalem hinaufgezogen, und brannte sie nieder; zwei Jahre später war sie in Vespasians Hand."
    - "Nach 70 n. Chr. war Lydda ein Zentrum jüdischer Gelehrsamkeit, wo Rabbinen wie Elieser ben Hyrkanos und Tarphon lehrten. Um 200 n. Chr. machte Septimius Severus es zu einer römischen Stadt namens Diospolis, und im 4. Jahrhundert diente Diospolis Eusebius als Orientierungspunkt für viele Dörfer. Im Dezember 415 tagte hier eine Synode von vierzehn Bischöfen und sprach den Mönch Pelagius frei; Augustinus schrieb eine Abhandlung über ihre Verhandlungen. Die christliche Überlieferung verlegte später das Grab des heiligen Georg nach Lydda."
  fr:
    - "Lod, appelée Lydda en grec, se trouve dans la plaine côtière à environ 18 km au sud-est de Joppé, là où la plaine rencontre les contreforts de la Judée. Des gens y vivaient dès le VIe millénaire av. J.-C., et à l’âge du Bronze ancien elle était un établissement important. On reconnaît d’ordinaire Lod dans la liste de villes cananéennes que Thoutmosis III d’Égypte fit graver à Karnak au XVe siècle av. J.-C."
    - "Les Chroniques nomment Schémer, de Benjamin, comme le bâtisseur d’Ono et de Lod, et après l’exil 725 habitants de Lod, de Hadid et d’Ono revinrent de Babylone (721 dans la liste de Néhémie). À l’époque hellénistique, Lydda appartenait au district de Samarie jusque vers 145 av. J.-C., quand le roi séleucide Démétrius II la donna, avec deux districts voisins, à la Judée. En 43 av. J.-C., Cassius, qui levait de l’argent après le meurtre de César, vendit ses habitants comme esclaves ; Marc Antoine ordonna bientôt de libérer les Juifs qui avaient été vendus."
    - "Pierre descendit vers les saints de Lydda et guérit Énée, qui gardait le lit depuis huit ans, et tous les habitants de Lydda et du Saron se convertirent au Seigneur. Comme Lydda était près de Joppé, les disciples de cette ville envoyèrent chercher Pierre quand Tabitha mourut. En 66 apr. J.-C., Cestius Gallus, gouverneur de Syrie, trouva la ville vide, ses habitants étant montés à Jérusalem pour la fête des tentes, et la brûla ; deux ans plus tard, elle était aux mains de Vespasien."
    - "Après 70 apr. J.-C., Lydda fut un centre du savoir juif, où enseignèrent des rabbins comme Éliézer ben Hyrcanos et Tarfon. Vers 200 apr. J.-C., Septime Sévère en fit une ville romaine nommée Diospolis, et au IVe siècle Eusèbe prit Diospolis comme repère pour de nombreux villages. En décembre 415, un synode de quatorze évêques s’y réunit et acquitta le moine Pélage ; Augustin écrivit un traité sur ses actes. La tradition chrétienne plaça plus tard à Lydda le tombeau de saint Georges."
  it:
    - "Lod, in greco Lidda, sorge nella pianura costiera a circa 18 km a sud-est di Giaffa, dove la pianura incontra le pendici della Giudea. Vi si abitava già nel VI millennio a.C., e nell’età del Bronzo antico era un insediamento importante. Lod è di solito riconosciuta nell’elenco delle città cananee che Tutmosi III d’Egitto fece scolpire a Karnak nel XV secolo a.C."
    - "Le Cronache nominano Semed di Beniamino come costruttore di Ono e di Lod, e dopo l’esilio 725 abitanti di Lod, Adid e Ono tornarono da Babilonia (721 nell’elenco di Neemia). In età ellenistica Lidda appartenne al distretto di Samaria fino al 145 a.C. circa, quando il re seleucide Demetrio II la diede alla Giudea, con due distretti vicini. Nel 43 a.C. Cassio, raccogliendo denaro dopo l’assassinio di Cesare, vendette i suoi abitanti come schiavi; Marco Antonio ordinò presto che gli ebrei venduti fossero liberati."
    - "Pietro scese dai santi di Lidda e guarì Enea, che era rimasto a letto otto anni, e tutti gli abitanti di Lidda e di Saròn si convertirono al Signore. Poiché Lidda era vicina a Giaffa, i discepoli di là mandarono a chiamare Pietro quando Tabita morì. Nel 66 d.C. Cestio Gallo, governatore della Siria, trovò la città vuota, i suoi abitanti saliti a Gerusalemme per la festa delle Capanne, e la bruciò; due anni dopo era nelle mani di Vespasiano."
    - "Dopo il 70 d.C. Lidda fu un centro di studi ebraici, dove insegnarono rabbini come Eliezer ben Ircano e Tarfon. Verso il 200 d.C. Settimio Severo ne fece una città romana di nome Diospoli, e nel IV secolo Eusebio usò Diospoli come punto di riferimento per molti villaggi. Nel dicembre del 415 un sinodo di quattordici vescovi si riunì qui e assolse il monaco Pelagio; Agostino scrisse un trattato sui suoi atti. La tradizione cristiana collocò più tardi a Lidda la tomba di san Giorgio."
  pl:
    - "Lod, po grecku Lydda, leży na równinie nadmorskiej około 18 km na południowy wschód od Jafy, tam gdzie równina styka się z podgórzem Judei. Ludzie mieszkali tu już w VI tysiącleciu p.n.e., a we wczesnej epoce brązu była to ważna osada. Lod rozpoznaje się zwykle na liście kananejskich miast, które Totmes III Egipski kazał wykuć w Karnaku w XV w. p.n.e."
    - "Księga Kronik wymienia Szemeda z Beniamina jako budowniczego Ono i Lod, a po niewoli 725 mieszkańców Lod, Chadid i Ono wróciło z Babilonu (721 na liście Nehemiasza). W epoce hellenistycznej Lydda należała do okręgu Samarii aż do około 145 r. p.n.e., gdy król seleucydzki Demetriusz II oddał ją wraz z dwoma sąsiednimi okręgami Judei. W 43 r. p.n.e. Kasjusz, zbierając pieniądze po zabójstwie Cezara, sprzedał jej mieszkańców w niewolę; Marek Antoniusz wkrótce nakazał uwolnić sprzedanych Żydów."
    - "Piotr zszedł do świętych w Lyddzie i uzdrowił Eneasza, który przez osiem lat leżał w łóżku, a wszyscy mieszkańcy Lyddy i Saronu nawrócili się do Pana. Ponieważ Lydda leżała blisko Jafy, uczniowie stamtąd posłali po Piotra, gdy umarła Tabita. W 66 r. n.e. Cestiusz Gallus, namiestnik Syrii, zastał miasto puste, jego mieszkańcy poszli do Jerozolimy na święto namiotów, i spalił je; dwa lata później było w rękach Wespazjana."
    - "Po 70 r. n.e. Lydda była ośrodkiem żydowskiej nauki, gdzie nauczali rabbi tacy jak Eliezer ben Hyrkanos i Tarfon. Około 200 r. n.e. Septymiusz Sewer uczynił z niej rzymskie miasto o nazwie Diospolis, a w IV w. Euzebiusz używał Diospolis jako punktu orientacyjnego dla wielu wsi. W grudniu 415 r. synod czternastu biskupów zebrał się tu i uniewinnił mnicha Pelagiusza; Augustyn napisał traktat o jego obradach. Tradycja chrześcijańska umieściła później w Lyddzie grób św. Jerzego."
  nl:
    - "Lod, in het Grieks Lydda genoemd, ligt in de kustvlakte zo'n 18 km ten zuidoosten van Joppe, waar de vlakte de uitlopers van Judea ontmoet. Er woonden hier al mensen in het zesde millennium v.Chr., en in de vroege bronstijd was het een belangrijke nederzetting. Lod wordt meestal herkend in de lijst van Kanaänitische steden die Thoetmosis III van Egypte in de vijftiende eeuw v.Chr. in Karnak liet beitelen."
    - "Kronieken noemt Semed van Benjamin als bouwer van Ono en Lod, en na de ballingschap keerden 725 mensen van Lod, Chadid en Ono uit Babylon terug (721 in de lijst van Nehemia). In de hellenistische tijd behoorde Lydda tot het district Samaria tot omstreeks 145 v.Chr., toen de Seleucidische koning Demetrius II het met twee naburige districten aan Judea gaf. In 43 v.Chr. verkocht Cassius, die geld bijeenbracht na de moord op Caesar, zijn bevolking als slaven; Marcus Antonius beval spoedig de verkochte joden vrij te laten."
    - "Petrus kwam af naar de heiligen te Lydda en genas Aeneas, die acht jaar zijn bed had gehouden, en allen die in Lydda en Saron woonden, bekeerden zich tot de Heer. Omdat Lydda dicht bij Joppe lag, lieten de discipelen daar Petrus halen toen Tabita stierf. In 66 n.Chr. vond Cestius Gallus, de gouverneur van Syrië, de stad leeg, haar bewoners opgetrokken naar Jeruzalem voor het loofhuttenfeest, en verbrandde haar; twee jaar later was ze in handen van Vespasianus."
    - "Na 70 n.Chr. was Lydda een centrum van joodse geleerdheid, waar rabbi's als Eliëzer ben Hyrkanos en Tarfon onderwezen. Omstreeks 200 n.Chr. maakte Septimius Severus er een Romeinse stad van met de naam Diospolis, en in de vierde eeuw gebruikte Eusebius Diospolis als oriëntatiepunt voor vele dorpen. In december 415 kwam hier een synode van veertien bisschoppen bijeen die de monnik Pelagius vrijsprak; Augustinus schreef een traktaat over de handelingen ervan. De christelijke overlevering plaatste later het graf van de heilige Joris in Lydda."
  cs:
    - "Lod, řecky Lydda, leží v pobřežní rovině asi 18 km jihovýchodně od Joppe, kde se rovina setkává s podhůřím Judska. Lidé tu žili už v 6. tisíciletí př. n. l. a ve starší době bronzové to bylo důležité sídlo. Lod bývá poznáván v seznamu kanaánských měst, který nechal Thutmose III. Egyptský vytesat v Karnaku v 15. století př. n. l."
    - "Kroniky jmenují Šemeda z Benjamína jako stavitele Onó a Lodu a po exilu se z Babylóna vrátilo 725 lidí z Lodu, Chadídu a Onó (721 v Nehemjášově seznamu). V helénistické době patřila Lydda k okresu Samaří, až asi roku 145 př. n. l. ji seleukovský král Démétrios II. dal s dvěma sousedními okresy Judsku. Roku 43 př. n. l. Cassius, který sháněl peníze po Caesarově vraždě, prodal její obyvatele do otroctví; Marcus Antonius brzy nařídil, aby byli prodaní Židé propuštěni."
    - "Petr přišel k svatým v Lyddě a uzdravil Ainéa, který ležel osm let na loži, a všichni, kdo bydleli v Lyddě a v Šaronu, se obrátili k Pánu. Protože Lydda byla blízko Joppe, poslali odtud učedníci pro Petra, když zemřela Tabita. Roku 66 n. l. nalezl Cestius Gallus, správce Sýrie, město prázdné, jeho obyvatelé vystoupili do Jeruzaléma na svátek stánků, a vypálil je; o dva roky později bylo v rukou Vespasiana."
    - "Po roce 70 n. l. byla Lydda střediskem židovské učenosti, kde učili rabíni jako Eliezer ben Hyrkanos a Tarfon. Kolem roku 200 z ní Septimius Severus učinil římské město jménem Diospolis a ve 4. století užíval Eusebius Diospolis jako orientační bod pro mnoho vesnic. V prosinci 415 se zde sešel synod čtrnácti biskupů a zprostil mnicha Pelagia viny; Augustin napsal o jeho jednání spis. Křesťanská tradice později umístila do Lyddy hrob svatého Jiří."
  sv:
    - "Lod, på grekiska Lydda, ligger på kustslätten omkring 18 km sydost om Joppe, där slätten möter Judeens förberg. Människor bodde här redan under sjätte årtusendet f.Kr., och under tidiga bronsåldern var det en betydande bosättning. Lod känns vanligen igen i förteckningen över kanaaneiska städer som Thutmosis III av Egypten lät rista i Karnak på 1400-talet f.Kr."
    - "Krönikeböckerna nämner Shemed av Benjamin som byggare av Ono och Lod, och efter exilen återvände 725 personer från Lod, Hadid och Ono från Babylon (721 i Nehemjas förteckning). Under hellenistisk tid hörde Lydda till distriktet Samaria till omkring 145 f.Kr., då den seleukidiske kungen Demetrios II gav det, med två angränsande distrikt, till Judeen. År 43 f.Kr. sålde Cassius, som skaffade pengar efter Caesars mord, dess invånare som slavar; Marcus Antonius befallde snart att de judar som sålts skulle friges."
    - "Petrus kom ned till de heliga i Lydda och botade Aineas, som legat till sängs i åtta år, och alla som bodde i Lydda och Saron vände sig till Herren. Eftersom Lydda låg nära Joppe sände lärjungarna där efter Petrus när Tabita dog. År 66 e.Kr. fann Cestius Gallus, Syriens ståthållare, staden tom, dess folk uppe i Jerusalem för lövhyddefesten, och brände den; två år senare var den i Vespasianus' händer."
    - "Efter år 70 e.Kr. var Lydda ett centrum för judisk lärdom, där rabbiner som Elieser ben Hyrkanos och Tarfon undervisade. Omkring år 200 gjorde Septimius Severus det till en romersk stad med namnet Diospolis, och på 300-talet använde Eusebios Diospolis som landmärke för många byar. I december 415 sammanträdde här en synod med fjorton biskopar som frikände munken Pelagius; Augustinus skrev en avhandling om dess förhandlingar. Kristen tradition förlade senare Sankt Georgs grav till Lydda."
  nb:
    - "Lod, på gresk Lydda, ligger på kystsletten omkring 18 km sørøst for Jaffa, der sletten møter forbergene i Judea. Folk bodde her allerede i det sjette årtusen f.Kr., og i tidlig bronsealder var det en viktig bosetning. Lod gjenkjennes vanligvis i listen over kanaanittiske byer som Thutmosis III av Egypt lot hugge i Karnak på 1400-tallet f.Kr."
    - "Krønikebøkene nevner Sjemed av Benjamin som byggeren av Ono og Lod, og etter eksilet vendte 725 mennesker fra Lod, Hadid og Ono tilbake fra Babylon (721 i Nehemjas liste). I den hellenistiske tiden hørte Lydda til distriktet Samaria til omkring 145 f.Kr., da den seleukidiske kongen Demetrios II ga den, med to nabodistrikter, til Judea. I 43 f.Kr. solgte Cassius, som skaffet penger etter Cæsars drap, innbyggerne som slaver; Marcus Antonius ga snart ordre om at jødene som var solgt, skulle settes fri."
    - "Peter kom ned til de hellige i Lydda og helbredet Æneas, som hadde ligget åtte år til sengs, og alle som bodde i Lydda og Saron, omvendte seg til Herren. Fordi Lydda lå nær Jaffa, sendte disiplene der bud etter Peter da Tabita døde. I 66 e.Kr. fant Cestius Gallus, guvernør i Syria, byen tom, innbyggerne var dratt opp til Jerusalem for løvhyttefesten, og brente den; to år senere var den i Vespasians hender."
    - "Etter 70 e.Kr. var Lydda et sentrum for jødisk lærdom, der rabbinere som Elieser ben Hyrkanos og Tarfon underviste. Omkring 200 e.Kr. gjorde Septimius Severus den til en romersk by med navnet Diospolis, og på 300-tallet brukte Eusebius Diospolis som referansepunkt for mange landsbyer. I desember 415 møttes en synode med fjorten biskoper her og frikjente munken Pelagius; Augustin skrev en avhandling om forhandlingene. Kristen tradisjon plasserte senere Sankt Georgs grav i Lydda."
  tl:
    - "Ang Lod, na tinatawag na Lidda sa Griyego, ay nasa kapatagang baybayin mga 18 km sa timog-silangan ng Joppa, kung saan nagtatagpo ang kapatagan at ang paanan ng mga burol ng Judea. Naninirahan na ang mga tao rito noong ika-6 na milenyo BK, at noong Maagang Panahon ng Tanso ay mahalagang pamayanan ito. Karaniwang kinikilala ang Lod sa talaan ng mga bayang Cananeo na ipinaukit ni Thutmose III ng Egipto sa Karnak noong ika-15 siglo BK."
    - "Pinangangalanan ng Mga Cronica si Semed ng Benjamin bilang tagapagtayo ng Ono at Lod, at pagkatapos ng pagkatapon, 725 tao ng Lod, Hadid at Ono ang bumalik mula sa Babilonia (721 sa talaan ni Nehemias). Noong panahong Helenistiko, ang Lidda ay kabilang sa distrito ng Samaria hanggang mga 145 BK, nang ibigay ito ng haring Seleucida na si Demetrio II, kasama ng dalawang kalapit na distrito, sa Judea. Noong 43 BK, ipinagbili ni Casio ang mga tao nito sa pagkaalipin habang nangangalap ng salapi pagkatapos ng pagpatay kay Cesar; hindi nagtagal ay iniutos ni Marco Antonio na palayain ang mga Judiong naipagbili."
    - "Bumaba si Pedro sa mga banal sa Lidda at pinagaling si Eneas, na nakaratay nang walong taon, at lahat ng nanirahan sa Lidda at Saron ay bumaling sa Panginoon. Dahil malapit ang Lidda sa Joppa, ipinatawag ng mga alagad doon si Pedro nang mamatay si Tabita. Noong 66 AD, nasumpungan ni Cestius Gallus, gobernador ng Siria, na walang laman ang bayan, ang mga tao ay umakyat sa Jerusalem para sa Pista ng mga Tabernakulo, at sinunog ito; makalipas ang dalawang taon ay nasa kamay ito ni Vespasiano."
    - "Pagkatapos ng 70 AD, ang Lidda ay sentro ng pag-aaral ng mga Judio, kung saan nagturo ang mga rabbi gaya nina Eliezer ben Hircano at Tarfon. Mga 200 AD, ginawa ito ni Septimio Severo na lungsod Romano na pinangalanang Diospolis, at noong ika-4 na siglo ginamit ni Eusebio ang Diospolis na palatandaan ng maraming nayon. Noong Disyembre 415, nagtipon dito ang sinodo ng labing-apat na obispo at pinawalang-sala ang monghe na si Pelagio; sumulat si Agustin ng tratado tungkol sa mga paglilitis nito. Kalaunan ay inilagay ng tradisyong Kristiyano ang libingan ni San Jorge sa Lidda."
  da:
    - "Lod, på græsk kaldet Lydda, ligger på kystsletten omkring 18 km sydøst for Joppe, hvor sletten møder Judæas forbjerge. Mennesker boede her allerede i 6. årtusinde f.Kr., og i tidlig bronzealder var det en vigtig bebyggelse. Lod genkendes sædvanligvis i listen over kana'anæiske byer, som Thutmosis III af Egypten lod udhugge i Karnak i 1400-tallet f.Kr."
    - "Krønikebøgerne nævner Sjemed af Benjamin som bygger af Ono og Lod, og efter eksilet vendte 725 mennesker fra Lod, Hadid og Ono tilbage fra Babylon (721 i Nehemias' liste). I den hellenistiske tid hørte Lydda til Samarias distrikt indtil omkring 145 f.Kr., da den seleukidiske konge Demetrius 2. gav den, med to nabodistrikter, til Judæa. I 43 f.Kr. solgte Cassius, der skaffede penge efter Cæsars mord, dens folk som slaver; Marcus Antonius befalede snart de solgte jøder frigivet."
    - "Peter kom ned til de hellige i Lydda og helbredte Æneas, der havde ligget til sengs i otte år, og alle, der boede i Lydda og Saron, vendte sig til Herren. Fordi Lydda lå nær Joppe, sendte disciplene dér bud efter Peter, da Tabita døde. I 66 e.Kr. fandt Cestius Gallus, guvernør i Syrien, byen tom, dens folk draget op til Jerusalem til løvhyttefesten, og brændte den; to år senere var den i Vespasians hænder."
    - "Efter 70 e.Kr. var Lydda et centrum for jødisk lærdom, hvor rabbinere som Eliezer ben Hyrkanos og Tarfon underviste. Omkring 200 e.Kr. gjorde Septimius Severus den til en romersk by ved navn Diospolis, og i 300-tallet brugte Eusebios Diospolis som pejlemærke for mange landsbyer. I december 415 samledes en synode af fjorten biskopper her og frikendte munken Pelagius; Augustin skrev en afhandling om dens forhandlinger. Kristen tradition placerede senere Sankt Georgs grav i Lydda."
  sr:
    - "Лод, на грчком Лида, лежи у приобалној равници око 18 км југоисточно од Јопе, где се равница сусреће с подножјем јудејских брда. Људи су овде живели још у VI миленијуму п. н. е., а у раном бронзаном добу био је важно насеље. Лод се обично препознаје у списку ханаанских градова које је египатски Тутмос III дао уклесати у Карнаку у XV веку п. н. е."
    - "Дневници именују Самеда из Венијамина као градитеља Она и Лода, а после изгнанства се из Вавилона вратило 725 људи из Лода, Хадида и Она (721 по Немијином списку). У хеленистичко доба Лида је припадала самаријском округу до око 145. п. н. е., када ју је селеукидски цар Димитрије II с два суседна округа дао Јудеји. Године 43. п. н. е. Касије, скупљајући новац после Цезарове смрти, продао је њене становнике у ропство; Марко Антоније је убрзо наредио да се продати Јевреји ослободе."
    - "Петар је сишао светима у Лиду и исцелио Енеју, који је осам година лежао у постељи, и сви који су живели у Лиди и Сарону обратили су се Господу. Пошто је Лида била близу Јопе, ученици тамо послали су по Петра када је умрла Тавита. Године 66. н. е. Цестије Гал, намесник Сирије, нашао је град празан, његови житељи отишли су у Јерусалим на празник сеница, и спалио га је; две године касније био је у Веспазијановим рукама."
    - "После 70. н. е. Лида је била средиште јеврејске учености, где су поучавали рабини као што су Елијезер бен Хиркан и Тарфон. Око 200. н. е. Септимије Север начинио ју је римским градом под именом Диосполис, а у IV веку Јевсевије је Диосполис употребљавао као оријентир за многа села. У децембру 415. овде је заседао синод од четрнаест епископа и ослободио монаха Пелагија; Августин је написао расправу о његовом току. Хришћанско предање је касније сместило гроб Светог Ђорђа у Лиду."
  hu:
    - "Lód, görögül Lidda, a tengerparti síkságon fekszik, Joppétól mintegy 18 km-re délkeletre, ahol a síkság a júdeai dombvidékhez ér. Már a Kr. e. 6. évezredben éltek itt emberek, a korai bronzkorban pedig fontos település volt. Lódot rendszerint felismerik III. Thotmesz egyiptomi király karnaki, Kr. e. 15. századi kánaáni városlistájában."
    - "A Krónikák Szamedet, Benjámin fiát nevezi Ónó és Lód építőjének, és a száműzetés után Lód, Hadid és Ónó 725 embere tért vissza Babilonból (Nehémiás jegyzékében 721). A hellénisztikus korban Lidda Szamária kerületéhez tartozott Kr. e. 145 körülig, amikor a szeleukida II. Démétriusz két szomszédos kerülettel együtt Júdeának adta. Kr. e. 43-ban Cassius, Caesar meggyilkolása után pénzt szerezve, rabszolgának adta el lakóit; Marcus Antonius hamarosan elrendelte az eladott zsidók szabadon bocsátását."
    - "Péter lement a szentekhez Liddába, és meggyógyította Éneást, aki nyolc éve feküdt ágyban, és mindenki, aki Liddában és Sáronban lakott, az Úrhoz tért. Mivel Lidda Joppé közelében volt, az ottani tanítványok Péterért küldtek, amikor Tabita meghalt. Kr. u. 66-ban Cestius Gallus, Szíria helytartója, üresen találta a várost, lakói a sátoros ünnepre Jeruzsálembe mentek fel, és felégette; két évvel később Vespasianus kezén volt."
    - "Kr. u. 70 után Lidda a zsidó tudomány központja volt, ahol olyan rabbik tanítottak, mint Eliézer ben Hürkánosz és Tarfon. Kr. u. 200 körül Septimius Severus római várossá tette Diospolis néven, és a 4. században Eusebius sok falu viszonyítási pontjaként használta Diospolist. 415 decemberében itt ült össze tizennégy püspök zsinata, és felmentette Pelagius szerzetest; Augustinus értekezést írt a tárgyalásról. A keresztény hagyomány később Szent György sírját Liddába helyezte."
  fi:
    - "Lod, kreikaksi Lydda, sijaitsee rannikon tasangolla noin 18 km Joppesta kaakkoon, missä tasanko kohtaa Juudean juurikukkulat. Täällä asuttiin jo 6. vuosituhannella eaa., ja varhaispronssikaudella se oli tärkeä asutuskeskus. Lod tunnistetaan yleensä Egyptin Tuthmosis III:n Karnakiin 1400-luvulla eaa. veistämien kanaanilaisten kaupunkien luettelosta."
    - "Aikakirjat mainitsevat benjaminilaisen Semedin Oonon ja Loodin rakentajana, ja pakkosiirtolaisuuden jälkeen Babylonista palasi 725 Lodin, Hadidin ja Oonon asukasta (721 Nehemian luettelossa). Hellenistisenä aikana Lydda kuului Samarian piiriin noin vuoteen 145 eaa., jolloin seleukidikuningas Demetrios II antoi sen kahden naapuripiirin kanssa Juudealle. Vuonna 43 eaa. Cassius, kerätessään rahaa Caesarin murhan jälkeen, myi sen asukkaat orjiksi; Markus Antonius määräsi pian myytyjen juutalaisten vapautettavaksi."
    - "Pietari tuli alas Lyddan pyhien luo ja paransi Aineaan, joka oli maannut vuoteessa kahdeksan vuotta, ja kaikki Lyddan ja Saronin asukkaat kääntyivät Herran puoleen. Koska Lydda oli lähellä Joppea, sikäläiset opetuslapset kutsuivat Pietarin, kun Tabita kuoli. Vuonna 66 jaa. Cestius Gallus, Syyrian käskynhaltija, löysi kaupungin tyhjänä, sen asukkaat lähteneinä Jerusalemiin lehtimajanjuhlalle, ja poltti sen; kaksi vuotta myöhemmin se oli Vespasianuksen käsissä."
    - "Vuoden 70 jaa. jälkeen Lydda oli juutalaisen oppineisuuden keskus, jossa opettivat rabbit kuten Elieser ben Hyrkanos ja Tarfon. Noin vuonna 200 jaa. Septimius Severus teki siitä roomalaisen kaupungin nimeltä Diospolis, ja 300-luvulla Eusebios käytti Diospolista maamerkkinä monille kylille. Joulukuussa 415 neljäntoista piispan synodi kokoontui täällä ja vapautti munkki Pelagiuksen; Augustinus kirjoitti sen käsittelystä tutkielman. Kristillinen perinne sijoitti myöhemmin Pyhän Yrjön haudan Lyddaan."
  vi:
    - "Lod, tiếng Hy Lạp gọi là Lydda (Ly-đa), nằm trên đồng bằng duyên hải cách Giốp-bê khoảng 18 km về phía đông nam, nơi đồng bằng gặp chân đồi Giu-đê. Người ta đã sống ở đây từ thiên niên kỷ thứ 6 TCN, và vào thời Đồ Đồng Sớm nó là một khu định cư quan trọng. Lod thường được nhận ra trong danh sách các thành Ca-na-an mà Thutmose III của Ai Cập cho khắc ở Karnak vào thế kỷ 15 TCN."
    - "Sách Sử ký nêu Sê-mết của Bên-gia-min là người xây Ô-nô và Lod, và sau thời lưu đày, 725 người của Lod, Ha-đít và Ô-nô trở về từ Ba-by-lôn (721 trong danh sách của Nê-hê-mi). Trong thời Hy Lạp hóa, Lydda thuộc vùng Sa-ma-ri cho đến khoảng năm 145 TCN, khi vua Seleucid Đê-mê-triu II ban nó cùng hai vùng lân cận cho Giu-đê. Năm 43 TCN, Cassius, đang gom tiền sau vụ ám sát Caesar, bán dân thành làm nô lệ; Mark Antony chẳng bao lâu ra lệnh trả tự do cho những người Do Thái đã bị bán."
    - "Phi-e-rơ xuống thăm các thánh đồ ở Ly-đa và chữa lành Ê-nê, người đã nằm liệt giường tám năm, và hết thảy dân ở Ly-đa và Sa-rôn trở về cùng Chúa. Vì Ly-đa gần Giốp-bê, các môn đồ ở đó sai mời Phi-e-rơ khi Ta-bi-tha chết. Năm 66, Cestius Gallus, tổng đốc Sy-ri, thấy thành trống vắng, dân đã lên Giê-ru-sa-lem dự lễ Lều Tạm, và đốt nó; hai năm sau thành nằm trong tay Vespasian."
    - "Sau năm 70, Ly-đa là một trung tâm học vấn Do Thái, nơi các rabbi như Ê-li-ê-xe ben Hyrcanus và Tarfon giảng dạy. Khoảng năm 200, Septimius Severus biến nó thành một thành La Mã tên Diospolis, và vào thế kỷ 4, Eusebius dùng Diospolis làm mốc cho nhiều làng. Tháng 12 năm 415, một thượng hội đồng gồm mười bốn giám mục họp ở đây và tha bổng tu sĩ Pelagius; Augustine viết một luận thuyết về diễn biến của nó. Truyền thống Cơ Đốc về sau đặt mộ Thánh George ở Ly-đa."
  ro:
    - "Lod, numit Lida în greacă, se află în câmpia de coastă, la circa 18 km sud-est de Iafo, acolo unde câmpia întâlnește poalele dealurilor Iudeii. Oamenii au locuit aici încă din mileniul al VI-lea î.Hr., iar în epoca bronzului timpuriu a fost o așezare importantă. Lod este recunoscut de obicei în lista cetăților canaanite pe care Tutmes al III-lea al Egiptului a pus-o să fie sculptată la Karnak în secolul al XV-lea î.Hr."
    - "Cronicile îl numesc pe Șemed din Beniamin drept ziditorul Onoului și al Lidei, iar după exil s-au întors din Babilon 725 de oameni din Lod, Hadid și Ono (721 în lista lui Neemia). În epoca elenistică Lida a aparținut districtului Samariei până pe la 145 î.Hr., când regele seleucid Dimitrie al II-lea a dat-o, cu două districte vecine, Iudeii. În 43 î.Hr., Cassius, strângând bani după uciderea lui Cezar, i-a vândut locuitorii în sclavie; Marcu Antoniu a poruncit curând ca iudeii vânduți să fie eliberați."
    - "Petru s-a coborât la sfinții din Lida și l-a vindecat pe Enea, care zăcuse în pat opt ani, iar toți cei ce locuiau în Lida și în Șaron s-au întors la Domnul. Fiindcă Lida era aproape de Iafo, ucenicii de acolo l-au chemat pe Petru când a murit Tabita. În 66 d.Hr., Cestius Gallus, guvernatorul Siriei, a găsit orașul gol, locuitorii lui urcaseră la Ierusalim pentru sărbătoarea corturilor, și l-a ars; doi ani mai târziu era în mâinile lui Vespasian."
    - "După 70 d.Hr., Lida a fost un centru de învățătură iudaică, unde au predat rabini precum Eliezer ben Hyrcanus și Tarfon. Pe la 200 d.Hr., Septimius Sever a făcut din ea un oraș roman numit Diospolis, iar în secolul al IV-lea Eusebiu a folosit Diospolis ca reper pentru multe sate. În decembrie 415, aici s-a întrunit un sinod de paisprezece episcopi, care l-a achitat pe monahul Pelagiu; Augustin a scris un tratat despre dezbaterile lui. Tradiția creștină a așezat mai târziu mormântul Sfântului Gheorghe la Lida."
  bg:
    - "Лод, наричан на гръцки Лида, се намира в крайбрежната равнина на около 18 км югоизточно от Яфа, където равнината се среща с подножието на Юдейските планини. Тук са живели хора още през VI хилядолетие пр.н.е., а през ранната бронзова епоха това е било важно селище. Лида обикновено се разпознава в списъка на ханаанските градове, който Тутмос III Египетски наредил да бъде издълбан в Карнак през XV в. пр.н.е."
    - "Летописи назовават Шемед от Вениамин като строител на Оно и Лида, а след изгнанието 725 души от Лида, Хадид и Оно се завърнали от Вавилон (721 в списъка на Неемия). През елинистическата епоха Лида принадлежала към окръга на Самария до около 145 г. пр.н.е., когато селевкидският цар Деметрий II я дал, заедно с два съседни окръга, на Юдея. През 43 г. пр.н.е. Касий, който събирал пари след убийството на Цезар, продал жителите ѝ в робство; Марк Антоний скоро наредил продадените юдеи да бъдат освободени."
    - "Петър слезе при светиите в Лида и изцели Еней, който осем години лежеше на легло, и всички, които живееха в Лида и Сарон, се обърнаха към Господа. Понеже Лида беше близо до Яфа, учениците там изпратиха да повикат Петър, когато умря Тавита. През 66 г. н.е. Цестий Гал, управителят на Сирия, намерил града празен — жителите му били отишли в Йерусалим за празника Шатри — и го изгорил; две години по-късно той бил в ръцете на Веспасиан."
    - "След 70 г. н.е. Лида е център на юдейската ученост, където преподавали равини като Елиезер бен Хиркан и Тарфон. Около 200 г. н.е. Септимий Север я превръща в римски град с името Диосполис, а през IV в. Евсевий използва Диосполис като ориентир за много села. През декември 415 г. тук заседава синод от четиринадесет епископи, който оправдава монаха Пелагий; Августин написва трактат за деянията му. Християнската традиция по-късно поставя в Лида гроба на свети Георги."
