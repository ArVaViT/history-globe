body:
  en:
    - "Eglon was a Canaanite royal city of the Shephelah, the lowland between the hills of Judah and the Philistine plain, in the country between Lachish and Hebron. It appears only in the book of Joshua. Debir, king of Eglon, was one of the five Amorite kings whom Adoni-zedek of Jerusalem summoned against Gibeon; after the rout at Beth-horon the five hid in the cave at Makkedah and were put to death. Joshua then “passed unto Eglon, and all Israel with him”, took the city “on that day” and destroyed it “according to all that he had done to Lachish”, and went up from Eglon to Hebron. Its king stands in the list of thirty-one, and the town is counted in the Shephelah district of Judah with Lachish and Bozkath. The Moabite king Eglon of Judges merely shares the name."
    - "Eusebius confused Eglon with Adullam and placed it ten miles east of Eleutheropolis; that identification is no longer held. In 1890 Flinders Petrie dug Tell el-Hesi, on the western edge of the Shephelah, taking it for Lachish, and after Lachish was fixed at Tell ed-Duweir many scholars, Albright among them, called Hesi Eglon. Most now prefer Tel Eton (Tell Aitun), a large mound on the eastern edge of the lowland south-east of Lachish, which better fits Joshua's march from Lachish to Eglon and on up to Hebron. Excavations there by Bar-Ilan University since 2006 have found a Canaanite town of the Late Bronze Age and a large Judahite city of the eighth century BC with a fine residence, destroyed in the Assyrian invasion of 701. Tell Beit Mirsim and Tel Nagila have been proposed as well, with less support."
    - "Today Tel Eton rises among fields at the foot of the Hebron hills, about 11 km south-east of Lachish, and Tell el-Hesi stands over Nahal Shikma at the edge of the western Negev; neither is marked for visitors as the biblical city."
  ru:
    - "Еглон — ханаанский царский город Шефелы, низменности между горами Иудеи и Филистимской равниной, в краю между Лахисом и Хевроном. Он упоминается только в книге Иисуса Навина. Девир, царь Еглонский, был одним из пяти царей Аморрейских, которых Адониседек Иерусалимский созвал против Гаваона; после разгрома у Беф-Орона пятеро укрылись в пещере в Македе и были преданы смерти. Затем Иисус пошёл «из Лахиса к Еглону», взял город «в тот же день» и поразил его, «как поступил с Лахисом», и из Еглона поднялся к Хеврону. Его царь стоит в списке тридцати одного, а город числится в округе Шефелы колена Иудина вместе с Лахисом и Воцкафом. Моавитский царь Еглон из книги Судей лишь носит то же имя."
    - "Евсевий смешал Еглон с Одолламом и поместил его в десяти милях к востоку от Элевтерополя; это отождествление больше не держится. В 1890 году Флиндерс Питри копал Телль-эль-Хаси на западном краю Шефелы, приняв его за Лахис, а когда Лахис был закреплён за Телль-эд-Дувейром, многие учёные, в том числе Олбрайт, назвали Хаси Еглоном. Большинство теперь предпочитает Тель-Этон (Телль-Айтун), большой холм на восточном краю низменности к юго-востоку от Лахиса, который лучше подходит к маршруту Иисуса Навина от Лахиса к Еглону и дальше вверх к Хеврону. Раскопки Университета Бар-Илан, идущие там с 2006 года, открыли ханаанский город позднего бронзового века и крупный иудейский город VIII века до н. э. с богатой резиденцией, разрушенный в ассирийское нашествие 701 года. Предлагали также Телль-Бейт-Мирсим и Тель-Нагилу, но с меньшей поддержкой."
    - "Сегодня Тель-Этон поднимается среди полей у подножия Хевронских гор, примерно в 11 км к юго-востоку от Лахиса, а Телль-эль-Хаси стоит над руслом Нахаль-Шикма на краю западного Негева; ни один из них не обозначен для посетителей как библейский город."
  uk:
    - "Еглон був ханаанським царським містом Шефели, низовини між горами Юди та филистимською рівниною, в краї між Лахішем і Хевроном. Він з'являється лише в Книзі Ісуса Навина. Девір, цар Еглону, був одним з п'яти аморійських царів, яких Адоніседек Єрусалимський покликав проти Гаваона; після розгрому біля Бет-Хорона п'ятеро сховалися в печері в Македі й були страчені. Тоді Ісус Навин «двинув … з усїм Ізраїлем від Лахиса на Еглон», узяв місто «того ж дня» і знищив його, «так само як росправивсь із Лахисом», і пішов від Еглону на Хеврон. Його цар стоїть у переліку тридцяти одного, а місто зараховане до округу Шефели Юди разом із Лахішем і Боцкатом. Моавський цар Еглон з Книги Суддів лише має те саме ім'я."
    - "Євсевій сплутав Еглон з Одоламом і розмістив його за десять миль на схід від Елевтерополя; цього ототожнення більше не дотримуються. У 1890 р. Фліндерс Петрі розкопував Телль-ель-Хесі на західному краї Шефели, вважаючи його Лахішем, а після того, як Лахіш був зафіксований у Телль-ед-Дувейрі, багато вчених, серед них Олбрайт, назвали Хесі Еглоном. Більшість тепер віддає перевагу Телль-Етону (Телль-Айтун), великому горбу на східному краї низовини на південний схід від Лахіша, що краще пасує до походу Ісуса Навина від Лахіша до Еглону й далі вгору до Хеврона. Розкопки там Університету Бар-Ілан від 2006 р. знайшли ханаанське місто пізньої бронзи та велике юдейське місто VIII ст. до н. е. з чудовою резиденцією, зруйноване під час ассирійського вторгнення 701 р. Телль-Бейт-Мірсім і Телль-Нагілу також пропонували, з меншою підтримкою."
    - "Сьогодні Телль-Етон здіймається серед полів біля підніжжя Хевронських гір, приблизно за 11 км на південний схід від Лахіша, а Телль-ель-Хесі стоїть над Нахаль-Шікмою на краю західного Негеву; жодне з них не позначене для відвідувачів як біблійне місто."
  es:
    - "Eglón era una ciudad real cananea de la Sefelá, la tierra baja entre las colinas de Judá y la llanura filistea, en la región entre Laquis y Hebrón. Aparece solo en el libro de Josué. Debir, rey de Eglón, fue uno de los cinco reyes amorreos a quienes Adonisedec de Jerusalén convocó contra Gabaón; tras la derrota en Bet-horón, los cinco se escondieron en la cueva de Maceda y fueron ejecutados. Josué «pasó [...] y todo Israel con él, á Eglón», tomó la ciudad «el mismo día» y la destruyó «como había hecho en Lachîs», y subió de Eglón a Hebrón. Su rey figura en la lista de los treinta y uno, y la ciudad se cuenta en el distrito de la Sefelá de Judá con Laquis y Boscat. El rey moabita Eglón de Jueces solo comparte el nombre."
    - "Eusebio confundió Eglón con Adulam y la situó a diez millas al este de Eleuterópolis; esa identificación ya no se sostiene. En 1890 Flinders Petrie excavó Tell el-Hesi, en el borde occidental de la Sefelá, tomándolo por Laquis, y después de que Laquis fuera fijada en Tell ed-Duweir muchos estudiosos, Albright entre ellos, llamaron a Hesi Eglón. La mayoría prefiere hoy Tel Eton (Tell Aitun), un gran montículo en el borde oriental de la llanura, al sudeste de Laquis, que encaja mejor con la marcha de Josué de Laquis a Eglón y de allí a Hebrón. Las excavaciones de la Universidad Bar-Ilan desde 2006 han hallado una ciudad cananea de la Edad del Bronce Tardío y una gran ciudad judaíta del siglo VIII a. C. con una espléndida residencia, destruida en la invasión asiria del 701. También se han propuesto Tell Beit Mirsim y Tel Nagila, con menos apoyo."
    - "Hoy Tel Eton se alza entre campos al pie de las colinas de Hebrón, a unos 11 km al sudeste de Laquis, y Tell el-Hesi se levanta sobre el Nahal Shikma, en el borde del Néguev occidental; ninguno está señalado para los visitantes como la ciudad bíblica."
  pt:
    - "Eglom era uma cidade real cananeia da Sefelá, a baixada entre as montanhas de Judá e a planície filisteia, na região entre Laquis e Hebrom. Aparece apenas no livro de Josué. Debir, rei de Eglom, foi um dos cinco reis amorreus que Adoni-Zedeque de Jerusalém convocou contra Gibeão; depois da derrota em Bete-Horom, os cinco se esconderam na caverna de Maquedá e foram mortos. Josué então “passou de Laquis, e todo o Israel com ele, para Eglom”, tomou a cidade “naquele dia” e a destruiu “de acordo com tudo o que havia feito a Laquis”, e subiu de Eglom a Hebrom. Seu rei consta na lista dos trinta e um, e a cidade é contada no distrito da Sefelá de Judá com Laquis e Bozcate. O rei moabita Eglom de Juízes apenas compartilha o nome."
    - "Eusébio confundiu Eglom com Adulão e a situou a dez milhas a leste de Eleuterópolis; essa identificação já não se sustenta. Em 1890, Flinders Petrie escavou Tell el-Hesi, na borda ocidental da Sefelá, tomando-a por Laquis, e depois que Laquis foi fixada em Tell ed-Duweir muitos estudiosos, entre eles Albright, chamaram Hesi de Eglom. A maioria prefere agora Tel Eton (Tell Aitun), um grande monte na borda oriental da baixada, a sudeste de Laquis, que se ajusta melhor à marcha de Josué de Laquis a Eglom e dali a Hebrom. As escavações da Universidade Bar-Ilan desde 2006 acharam ali uma cidade cananeia do Bronze Tardio e uma grande cidade judaíta do século VIII a.C. com uma residência esplêndida, destruída na invasão assíria de 701. Tell Beit Mirsim e Tel Nagila também foram propostas, com menos apoio."
    - "Hoje Tel Eton se ergue entre campos ao pé das montanhas de Hebrom, a cerca de 11 km a sudeste de Laquis, e Tell el-Hesi fica sobre o Nahal Shikma, na orla do Neguebe ocidental; nenhuma das duas é assinalada aos visitantes como a cidade bíblica."
  de:
    - "Eglon war eine kanaanäische Königsstadt der Schefela, des Tieflands zwischen dem Bergland Judas und der philistäischen Ebene, im Gebiet zwischen Lachisch und Hebron. Sie erscheint nur im Buch Josua. Debir, der König von Eglon, war einer der fünf amoritischen Könige, die Adoni-Zedek von Jerusalem gegen Gibeon aufbot; nach der Niederlage bei Bet-Horon versteckten sich die fünf in der Höhle bei Makkeda und wurden hingerichtet. Josua „zog von Lachis samt dem ganzen Israel gen Eglon“, nahm die Stadt „desselben Tages“ ein und vernichtete sie „allerdinge wie er Lachis getan hatte“, und zog von Eglon hinauf nach Hebron. Ihr König steht in der Liste der einunddreißig, und die Stadt wird im Schefela-Bezirk Judas mit Lachisch und Bozkat gezählt. Der moabitische König Eglon im Richterbuch teilt nur den Namen."
    - "Eusebius verwechselte Eglon mit Adullam und setzte es zehn Meilen östlich von Eleutheropolis an; das gilt nicht mehr. 1890 grub Flinders Petrie Tell el-Hesi am Westrand der Schefela aus und hielt es für Lachisch; nachdem Lachisch in Tell ed-Duweir festgelegt war, nannten viele Gelehrte, darunter Albright, Hesi Eglon. Die meisten bevorzugen heute Tel Eton (Tell Aitun), einen großen Hügel am Ostrand des Tieflands südöstlich von Lachisch, der besser zu Josuas Marsch von Lachisch nach Eglon und hinauf nach Hebron passt. Ausgrabungen der Bar-Ilan-Universität seit 2006 fanden dort eine kanaanäische Stadt der Späten Bronzezeit und eine große judäische Stadt des 8. Jahrhunderts v. Chr. mit prächtiger Residenz, 701 in der assyrischen Invasion zerstört. Tell Beit Mirsim und Tel Nagila wurden ebenfalls vorgeschlagen, mit weniger Rückhalt."
    - "Heute erhebt sich Tel Eton zwischen Feldern am Fuß des Hebron-Berglandes, etwa 11 km südöstlich von Lachisch, und Tell el-Hesi steht über dem Nahal Schikma am Rand des westlichen Negev; keiner von beiden ist für Besucher als die biblische Stadt ausgeschildert."
  fr:
    - "Églon était une ville royale cananéenne de la Shéphéla, le bas pays entre les montagnes de Juda et la plaine philistine, dans la région entre Lakis et Hébron. Elle n’apparaît que dans le livre de Josué. Debir, roi d’Églon, était l’un des cinq rois amoréens qu’Adoni-Tsédek de Jérusalem convoqua contre Gabaon ; après la déroute de Beth-Horon, les cinq se cachèrent dans la grotte de Makkéda et furent mis à mort. Alors « Josué, et tout Israël avec lui, passa de Lakis à Églon » ; il prit la ville « le même jour » et la détruisit « comme il avait traité Lakis », puis monta d’Églon à Hébron. Son roi figure dans la liste des trente et un, et la ville est comptée dans le district de la Shéphéla de Juda avec Lakis et Botskath. Le roi moabite Églon des Juges ne fait que partager le nom."
    - "Eusèbe confondit Églon avec Adullam et la plaça à dix milles à l’est d’Éleuthéropolis ; cette identification n’est plus retenue. En 1890, Flinders Petrie fouilla Tell el-Hesi, au bord occidental de la Shéphéla, le prenant pour Lakis, et après que Lakis eut été fixée à Tell ed-Duweir, de nombreux spécialistes, dont Albright, appelèrent Hesi Églon. La plupart préfèrent aujourd’hui Tel Eton (Tell Aitun), grand tertre au bord oriental du bas pays, au sud-est de Lakis, qui convient mieux à la marche de Josué de Lakis à Églon puis jusqu’à Hébron. Les fouilles de l’Université Bar-Ilan depuis 2006 y ont trouvé une ville cananéenne de l’âge du Bronze récent et une grande ville judéenne du VIIIe siècle av. J.-C. avec une belle résidence, détruite lors de l’invasion assyrienne de 701. Tell Beit Mirsim et Tel Nagila ont aussi été proposés, avec moins de soutien."
    - "Aujourd’hui, Tel Eton s’élève parmi les champs au pied des monts d’Hébron, à environ 11 km au sud-est de Lakis, et Tell el-Hesi domine le Nahal Shikma, en bordure du Négev occidental ; ni l’un ni l’autre n’est signalé aux visiteurs comme la ville biblique."
  it:
    - "Eglon era una città regale cananea della Sefela, la pianura fra le alture di Giuda e la pianura filistea, nel territorio fra Lachis ed Ebron. Compare solo nel libro di Giosuè. Debir, re di Eglon, era uno dei cinque re amorrei che Adoni-Sedek di Gerusalemme chiamò contro Gabaon; dopo la rotta a Bet-Oron i cinque si nascosero nella grotta di Makkeda e furono messi a morte. Giosuè allora «con tutto Israele passò da Lakis ad Eglon», prese la città «quel medesimo giorno» e la distrusse «esattamente come avea fatto a Lakis», e salì da Eglon a Ebron. Il suo re figura nell’elenco dei trentuno, e la città è contata nel distretto della Sefela di Giuda con Lachis e Boscat. Il re moabita Eglon dei Giudici ne condivide soltanto il nome."
    - "Eusebio confuse Eglon con Adullam e la collocò a dieci miglia a est di Eleuteropoli; quell’identificazione non è più sostenuta. Nel 1890 Flinders Petrie scavò Tell el-Hesi, sul margine occidentale della Sefela, ritenendola Lachis, e dopo che Lachis fu fissata a Tell ed-Duweir molti studiosi, fra cui Albright, chiamarono Hesi Eglon. Oggi i più preferiscono Tel Eton (Tell Aitun), un grande tell al margine orientale della pianura a sud-est di Lachis, che si accorda meglio con la marcia di Giosuè da Lachis a Eglon e poi su fino a Ebron. Gli scavi dell’Università Bar-Ilan dal 2006 vi hanno trovato una città cananea della tarda età del Bronzo e una grande città giudaita dell’VIII secolo a.C. con una bella residenza, distrutta nell’invasione assira del 701. Sono stati proposti anche Tell Beit Mirsim e Tel Nagila, con minore sostegno."
    - "Oggi Tel Eton sorge tra i campi ai piedi delle colline di Ebron, a circa 11 km a sud-est di Lachis, e Tell el-Hesi si leva sul Nahal Shikma al margine del Negheb occidentale; nessuno dei due è segnalato ai visitatori come la città biblica."
  pl:
    - "Eglon było kananejskim miastem królewskim w Szefeli, nizinie między wzgórzami Judy a równiną filistyńską, w kraju między Lakisz a Hebronem. Pojawia się tylko w Księdze Jozuego. Debir, król Eglon, był jednym z pięciu królów amorytańskich, których Adoni-Sedek z Jerozolimy wezwał przeciw Gibeonowi; po klęsce pod Bet-Choron pięciu ukryło się w jaskini w Makkeda i zostało straconych. Potem, jak czytamy, „ciągnął Jozue, i wszystek Izrael z nim, z Lachys do Eglon”, wziął miasto „onegoż dnia” i zniszczył je, „tak właśnie jako uczynił Lachys”, po czym ruszył z Eglon do Hebronu. Jego król figuruje na liście trzydziestu jeden, a miasto liczy się w okręgu Szefeli Judy z Lakisz i Boskat. Moabicki król Eglon z Księgi Sędziów tylko dzieli to imię."
    - "Euzebiusz pomylił Eglon z Adullam i umieścił je dziesięć mil na wschód od Eleuteropolis; tego utożsamienia już się nie podtrzymuje. W 1890 r. Flinders Petrie prowadził wykopaliska w Tell el-Chesi, na zachodnim skraju Szefeli, biorąc je za Lakisz, a gdy Lakisz ustalono w Tell ed-Duwejr, wielu uczonych, w tym Albright, nazwało Chesi Eglon. Większość woli dziś Tel Eton (Tell Ajtun), duży kopiec na wschodnim skraju niziny na południowy wschód od Lakisz, który lepiej pasuje do marszu Jozuego z Lakisz do Eglon i dalej w górę do Hebronu. Wykopaliska tam prowadzone przez Uniwersytet Bar-Ilan od 2006 r. odsłoniły kananejskie miasto z późnej epoki brązu i duże judzkie miasto z VIII w. p.n.e. z wytworną rezydencją, zniszczone podczas najazdu asyryjskiego w 701 r. Tell Bajt Mirsim i Tel Nagila również proponowano, z mniejszym poparciem."
    - "Dziś Tel Eton wznosi się wśród pól u podnóża wzgórz Hebronu, około 11 km na południowy wschód od Lakisz, a Tell el-Chesi stoi nad Nachal Szikma na skraju zachodniego Negewu; żadne z nich nie jest oznaczone dla zwiedzających jako biblijne miasto."
  nl:
    - "Eglon was een Kanaänitische koningsstad van de Sefela, het laagland tussen het bergland van Juda en de Filistijnse vlakte, in het gebied tussen Lachis en Hebron. Zij komt alleen voor in het boek Jozua. Debir, koning van Eglon, was een van de vijf Amorietische koningen die Adoni-Zedek van Jeruzalem tegen Gibeon opriep; na de nederlaag bij Beth-Horon verborgen de vijf zich in de grot te Makkeda en werden gedood. Jozua “trok voort van Lachis naar Eglon, en gans Israël met hem”, nam de stad in “ten zelven dage” en verwoestte haar “naar alles, wat hij aan Lachis gedaan had”, en trok van Eglon op naar Hebron. Haar koning staat in de lijst van eenendertig, en de stad wordt gerekend tot het district van Juda in de Sefela met Lachis en Bozkat. De Moabitische koning Eglon uit Richteren deelt alleen de naam."
    - "Eusebius verwarde Eglon met Adullam en plaatste het tien mijl ten oosten van Eleutheropolis; die identificatie wordt niet meer gehouden. In 1890 groef Flinders Petrie Tell el-Hesi aan de westrand van de Sefela, dat hij voor Lachis hield, en nadat Lachis bij Tell ed-Duweir was vastgesteld, noemden velen, onder wie Albright, Hesi Eglon. De meesten geven nu de voorkeur aan Tel Eton (Tell Aitun), een grote heuvel aan de oostrand van het laagland ten zuidoosten van Lachis, die beter past bij Jozua's tocht van Lachis naar Eglon en verder op naar Hebron. Opgravingen daar door de Bar-Ilan-universiteit sinds 2006 vonden een Kanaänitische stad uit de Late Bronstijd en een grote stad van Juda uit de achtste eeuw v.Chr. met een fraaie residentie, verwoest bij de Assyrische inval van 701. Tell Beit Mirsim en Tel Nagila zijn ook voorgesteld, met minder steun."
    - "Tegenwoordig verheft Tel Eton zich tussen akkers aan de voet van het Hebronse bergland, zo'n 11 km ten zuidoosten van Lachis, en Tell el-Hesi staat boven de Nachal Shikma aan de rand van de westelijke Negev; geen van beide is voor bezoekers als de bijbelse stad aangeduid."
  cs:
    - "Eglon bylo kanaánské královské město v Šefele, nížině mezi judskými horami a pelištejskou rovinou, v kraji mezi Lachišem a Hebronem. Objevuje se jen v Knize Jozue. Debír, král Eglonu, byl jedním z pěti amorejských králů, které Adonicedek Jeruzalémský svolal proti Gibeonu; po porážce u Bét-choronu se těch pět ukrylo v jeskyni v Makedě a bylo popraveno. O Jozuovi se pak praví: „Táhl potom Jozue a všecken Izrael s ním z Lachis do Eglon“; dobyl město „toho dne“ a zničil je „rovně tak, jakž učinili Lachis“, a vystoupil z Eglonu do Hebronu. Jeho král stojí v seznamu jedenatřiceti a město se počítá k šefelskému okresu Judy s Lachišem a Bockatem. Moábský král Eglon z Knihy soudců s ním sdílí jen jméno."
    - "Eusebios zaměnil Eglon s Adulamem a umístil jej deset mil východně od Eleutheropole; toto ztotožnění se již neuznává. Roku 1890 vykopával Flinders Petrie Tell el-Hesi na západním okraji Šefely, pokládaje jej za Lachiš, a když byl Lachiš určen v Tell ed-Duweir, mnozí badatelé, mezi nimi Albright, nazývali Hesi Eglonem. Většina dnes dává přednost Tel Eton (Tell Aitun), velkému pahorku na východním okraji nížiny jihovýchodně od Lachiše, který lépe odpovídá Jozuovu pochodu z Lachiše do Eglonu a dál vzhůru do Hebronu. Vykopávky tam provádí od roku 2006 Univerzita Bar-Ilan a nalezly kanaánské město z pozdní doby bronzové a velké judské město z 8. století př. n. l. s krásnou rezidencí, zničené při asyrském vpádu roku 701. Navrženy byly také Tell Beit Mirsim a Tel Nagila, s menší podporou."
    - "Dnes se Tel Eton tyčí mezi poli na úpatí hebronských hor, asi 11 km jihovýchodně od Lachiše, a Tell el-Hesi stojí nad Nahal Shikma na okraji západního Negevu; ani jedno není pro návštěvníky označeno jako biblické město."
  sv:
    - "Eglon var en kananeisk kungsstad i Shefela, låglandet mellan Judas berg och filisteerslätten, i trakten mellan Lakish och Hebron. Den förekommer bara i Josuas bok. Devir, kung i Eglon, var en av de fem amoreiska kungar som Adoni-Sedek av Jerusalem kallade samman mot Gibeon; efter nederlaget vid Bet-Horon gömde sig de fem i grottan vid Mackeda och dödades. Josua ”drog … med hela Israel till Eglon”, intog staden ”samma dag” och gav den till spillo ”alldeles såsom han hade gjort med Lakis”, och drog från Eglon upp till Hebron. Dess kung står i listan över trettioen, och staden räknas i Judas Shefela-distrikt med Lakish och Boskat. Den moabitiske kungen Eglon i Domarboken delar bara namnet."
    - "Eusebios förväxlade Eglon med Adullam och placerade det tio romerska mil öster om Eleutheropolis; den identifieringen hålls inte längre. År 1890 grävde Flinders Petrie Tell el-Hesi, vid västra kanten av Shefela, och höll det för Lakish, och sedan Lakish fastlagts vid Tell ed-Duweir kallade många forskare, Albright bland dem, Hesi för Eglon. De flesta föredrar nu Tel Eton (Tell Aitun), en stor kulle vid låglandets östra kant sydost om Lakish, som bättre passar Josuas marsch från Lakish till Eglon och vidare upp till Hebron. Utgrävningar där av Bar-Ilan-universitetet sedan 2006 har funnit en kananeisk stad från sen bronsålder och en stor judeisk stad från 700-talet f.Kr. med en fin bostad, förstörd i den assyriska invasionen 701. Tell Beit Mirsim och Tel Nagila har också föreslagits, med mindre stöd."
    - "I dag reser sig Tel Eton bland åkrar vid foten av Hebronbergen, omkring 11 km sydost om Lakish, och Tell el-Hesi ligger över Nahal Shikma vid västra Negevs kant; ingen av dem är markerad för besökare som den bibliska staden."
  nb:
    - "Eglon var en kanaanittisk kongeby i Sjefela, lavlandet mellom Judas åser og filistersletten, i landet mellom Lakisj og Hebron. Den forekommer bare i Josvas bok. Debir, konge av Eglon, var en av de fem amorittiske kongene som Adoni-Sedek av Jerusalem kalte sammen mot Gibeon; etter nederlaget ved Bet-Horon skjulte de fem seg i hulen ved Makkeda og ble drept. Så «drog Josva med hele Israel til Eglon», inntok byen «samme dag» og ødela den «aldeles som han hadde gjort med Lakis», og drog fra Eglon opp til Hebron. Dens konge står i listen over de trettien, og byen er regnet i Judas Sjefela-distrikt sammen med Lakisj og Boskat. Moabittkongen Eglon i Dommerboken deler bare navnet."
    - "Eusebius forvekslet Eglon med Adullam og plasserte den ti romerske mil øst for Eleutheropolis; denne identifiseringen holdes ikke lenger. I 1890 gravde Flinders Petrie ut Tell el-Hesi, i vestkanten av Sjefela, i den tro at det var Lakisj, og etter at Lakisj var fastlagt til Tell ed-Duweir, kalte mange forskere, Albright blant dem, Hesi for Eglon. De fleste foretrekker nå Tel Eton (Tell Aitun), en stor haug i østkanten av lavlandet sørøst for Lakisj, som bedre passer Josvas marsj fra Lakisj til Eglon og videre opp til Hebron. Utgravninger der av Bar-Ilan-universitetet siden 2006 har funnet en kanaanittisk by fra senbronsealderen og en stor judeisk by fra 700-tallet f.Kr. med en fin residens, ødelagt i den assyriske invasjonen i 701. Tell Beit Mirsim og Tel Nagila er også foreslått, med mindre støtte."
    - "I dag reiser Tel Eton seg blant åkrene ved foten av Hebron-åsene, omtrent 11 km sørøst for Lakisj, og Tell el-Hesi står over Nahal Shikma i kanten av det vestlige Negev; ingen av dem er merket for besøkende som den bibelske byen."
  tl:
    - "Ang Eglon ay isang maharlikang lungsod ng mga Cananeo sa Sephela, ang mababang lupain sa pagitan ng mga burol ng Juda at ng kapatagang Filisteo, sa lupain sa pagitan ng Lachis at Hebron. Lumilitaw lamang ito sa Aklat ni Josue. Si Debir, hari ng Eglon, ay isa sa limang haring Amorreo na tinawag ni Adoni-sedec ng Jerusalem laban sa Gabaon; pagkatapos ng pagkatalo sa Beth-horon, nagtago ang lima sa yungib sa Maceda at pinatay. Pagkatapos ay “dumaan si Josue mula sa Lachis, at ang buong Israel na kasama niya, hanggang sa Eglon”, sinakop ang lungsod “nang araw na yaon” at winasak ito “ayon sa lahat niyang ginawa sa Lachis”, at umahon mula sa Eglon patungong Hebron. Nasa talaan ng tatlumpu't isa ang hari nito, at ibinibilang ang bayan sa distrito ng Sephela ng Juda kasama ang Lachis at Boscat. Ang haring Moabita na si Eglon sa Mga Hukom ay nakikibahagi lamang sa pangalan."
    - "Pinagkamalan ni Eusebio ang Eglon na Adullam at inilagay sampung milya sa silangan ng Eleutheropolis; hindi na ito pinanghahawakan. Noong 1890, hinukay ni Flinders Petrie ang Tell el-Hesi, sa kanlurang gilid ng Sephela, na inakalang Lachis, at nang matukoy ang Lachis sa Tell ed-Duweir, tinawag ng maraming iskolar, kabilang si Albright, na Eglon ang Hesi. Karamihan ngayon ay pumipili sa Tel Eton (Tell Aitun), isang malaking tel sa silangang gilid ng mababang lupain sa timog-silangan ng Lachis, na mas tugma sa martsa ni Josue mula Lachis patungong Eglon at pataas sa Hebron. Ang paghuhukay doon ng Pamantasan ng Bar-Ilan mula 2006 ay nakatagpo ng bayang Cananeo ng Huling Panahon ng Tanso at malaking lungsod ng Juda noong ika-8 siglo BK na may magandang tirahan, na nawasak ng Asiria noong 701. Iminungkahi rin ang Tell Beit Mirsim at Tel Nagila, mas kaunti ang suporta."
    - "Ngayon, ang Tel Eton ay umaangat sa gitna ng mga bukid sa paanan ng mga burol ng Hebron, mga 11 km sa timog-silangan ng Lachis, at ang Tell el-Hesi ay nakatayo sa ibabaw ng Nahal Shikma sa gilid ng kanlurang Negev; wala sa dalawa ang minamarkahan para sa mga bisita bilang lungsod ng Bibliya."
