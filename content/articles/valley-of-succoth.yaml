body:
  en:
    - "The valley of Succoth is named in a divine oracle preserved in two psalms: “God hath spoken in his holiness; I will rejoice, I will divide Shechem, and mete out the valley of Succoth.” Shechem west of the Jordan and Succoth east of it stand for the two halves of the land that God measures out as its owner; the oracle goes on to claim Gilead, Manasseh, Ephraim and Judah and to humble Moab, Edom and Philistia. In the Synodal Bible these are Psalms 59 and 107."
    - "Succoth was a town of Gad in the Jordan valley near the Jabbok, where Jacob built booths for his cattle and whose princes refused Gideon bread; it is usually, though not certainly, identified with Tell Deir Alla, a mound excavated by Leiden University since 1960 and famous for its plaster inscription about Balaam son of Beor. The valley of Succoth, then, is the stretch of the Jordan's eastern plain, the Ghor, around the lower Jabbok (Zarqa), well watered and in antiquity dotted with towns, where Solomon's temple vessels were cast “in the clay ground between Succoth and Zarthan”. Beyond the psalm the name is not used. Today it is farmland of the central Jordan valley in Jordan, around the village of Deir Alla."
  ru:
    - "Долина Сокхоф названа в Божьем изречении, сохранённом в двух псалмах: «восторжествую, разделю Сихем и долину Сокхоф размерю». Сихем к западу от Иордана и Сокхоф к востоку от него означают две половины земли, которую Бог отмеряет как её владелец; дальше изречение заявляет права на Галаад, Манассию, Ефрема и Иуду и смиряет Моава, Едома и Филистимскую землю. В Синодальной Библии это псалмы 59 и 107."
    - "Сокхоф был городом Гада в долине Иордана близ Иавока, где Иаков сделал шалаши для скота и чьи князья отказали Гедеону в хлебе; его обычно, хотя и не наверняка, отождествляют с Телль-Дейр-Аллой, холмом, который Лейденский университет раскапывает с 1960 года и который знаменит штукатурной надписью о Валааме, сыне Веоровом. Долина Сокхоф, стало быть, — участок восточной равнины Иордана, Гора, вокруг нижнего Иавока (Зарки), обильный водой и в древности усеянный городами, где царь выливал храмовую утварь Соломона «в глинистой земле, в окрестности Иордана, между Сокхофом и Цартаном». Кроме псалма, это имя нигде не употребляется. Сегодня это поля центральной части Иорданской долины в Иордании вокруг селения Дейр-Алла."
  uk:
    - "Долина Сокхот названа в божому пророцтві, збереженому у двох псалмах: «Бог сказав у сьвятостї своїй: возрадуюся і роздїлю Сихему, і розміряю долину Сукот». Сихем на захід від Йордану і Сокхот на схід від нього стоять за дві половини краю, які Бог розмірює як його власник; пророцтво далі заявляє права на Гілеад, Манасію, Єфрем і Юду й обіцяє упокорити Моав, Едом і Філістію. У Синодальному перекладі це Псалми 59 і 107."
    - "Сокхот був містом Гада в долині Йордану поблизу Яббока, де Яків збудував шатра для своєї худоби і чиї городські голови відмовили Гедеонові в хлібі; його зазвичай, хоч і не напевно, ототожнюють із Телль-Дейр-Аллою, пагорбом, який Лейденський університет розкопує з 1960 року і який славний штукатурним написом про Валаама, сина Веора. Отже, долина Сокхот — це смуга східної рівнини Йордану, Гор, навколо нижнього Яббока (Зарка), добре зрошена й у давнину всіяна містами, де відлили храмові посудини Соломона «у формах із глинковатої землї, між Сукхотом і Сартаном». Поза псалмом назва не вживається. Нині це рілля центральної долини Йордану в Йорданії, навколо села Дейр-Алла."
  es:
    - "El valle de Sucot se nombra en un oráculo divino conservado en dos salmos: «Dios pronunció por su santuario; yo me alegraré; partiré á Sichêm, y mediré el valle de Succoth». Siquem, al oeste del Jordán, y Sucot, al este, representan las dos mitades de la tierra que Dios mide como su dueño; el oráculo sigue reclamando Galaad, Manasés, Efraín y Judá y humillando a Moab, Edom y Filistea. En la Biblia sinodal son los Salmos 59 y 107."
    - "Sucot era una ciudad de Gad en el valle del Jordán, cerca del Jaboc, donde Jacob construyó cabañas para su ganado y cuyos principales negaron pan a Gedeón; suele identificarse, aunque no con certeza, con Tell Deir Alla, un montículo excavado por la Universidad de Leiden desde 1960 y famoso por su inscripción en yeso sobre Balaam hijo de Beor. El valle de Sucot es, pues, el tramo de la llanura oriental del Jordán, el Ghor, en torno al bajo Jaboc (Zarqa), bien regado y en la Antigüedad salpicado de ciudades, donde se fundieron los utensilios del templo de Salomón «en tierra arcillosa, entre Succoth y Sarthán». Fuera del salmo el nombre no se usa. Hoy son tierras de cultivo del valle central del Jordán, en Jordania, en torno a la aldea de Deir Alla."
  pt:
    - "O vale de Sucote é nomeado num oráculo divino conservado em dois salmos: “Deus falou do seu santuário: ‘Eu triunfarei. Dividirei Siquém, e medirei o vale de Sucote.’” Siquém a oeste do Jordão e Sucote a leste dele representam as duas metades da terra que Deus mede como seu dono; o oráculo prossegue reclamando Gileade, Manassés, Efraim e Judá e humilhando Moabe, Edom e a Filístia. Na Bíblia Sinodal são os Salmos 59 e 107."
    - "Sucote era uma cidade de Gade no vale do Jordão, perto do Jaboque, onde Jacó construiu abrigos para o gado e cujos líderes recusaram pão a Gideão; costuma ser, embora não com certeza, identificada com Tell Deir Alla, monte escavado pela Universidade de Leiden desde 1960 e famoso por sua inscrição em reboco sobre Balaão, filho de Beor. O vale de Sucote é, pois, o trecho da planície oriental do Jordão, o Ghor, em torno do baixo Jaboque (Zarqa), bem irrigado e na Antiguidade pontilhado de cidades, onde os utensílios do templo de Salomão foram fundidos “na terra argilosa entre Sucote e Zaretã”. Fora do salmo, o nome não é usado. Hoje são terras de cultivo do vale central do Jordão, na Jordânia, em torno da aldeia de Deir Alla."
  de:
    - "Das Sukkottal wird in einem göttlichen Spruch genannt, den zwei Psalmen bewahren: „Gott redete in seinem Heiligtum, des bin ich froh, und will teilen Sichem und abmessen das Tal Sukkoth.“ Sichem westlich des Jordans und Sukkot östlich davon stehen für die beiden Hälften des Landes, die Gott als sein Eigentümer vermisst; der Spruch beansprucht weiter Gilead, Manasse, Ephraim und Juda und demütigt Moab, Edom und Philistäa. In der Synodalbibel sind dies die Psalmen 59 und 107."
    - "Sukkot war eine Stadt Gads im Jordantal nahe dem Jabbok, wo Jakob Hütten für sein Vieh baute und deren Oberste Gideon Brot verweigerten; sie wird meist, aber nicht sicher, mit Tell Deir Alla gleichgesetzt, einem Hügel, den die Universität Leiden seit 1960 ausgräbt und der durch seine Putzinschrift über Bileam, den Sohn Beors, berühmt ist. Das Sukkottal ist also der Streifen der östlichen Jordanebene, des Ghor, um den unteren Jabbok (Zarqa), gut bewässert und in der Antike mit Städten übersät, wo Salomos Tempelgefäße „in dicker Erde, zwischen Sukkoth und Zarthan“ gegossen wurden. Über den Psalm hinaus wird der Name nicht gebraucht. Heute ist es Ackerland im zentralen Jordantal in Jordanien um das Dorf Deir Alla."
  fr:
    - "La vallée de Succoth est nommée dans un oracle divin conservé dans deux psaumes : « Dieu a dit dans sa sainteté : Je triompherai, je partagerai Sichem, je mesurerai la vallée de Succoth. » Sichem à l’ouest du Jourdain et Succoth à l’est représentent les deux moitiés du pays que Dieu mesure en propriétaire ; l’oracle revendique ensuite Galaad, Manassé, Éphraïm et Juda et humilie Moab, Édom et la Philistie. Dans la Bible synodale, ce sont les psaumes 59 et 107."
    - "Succoth était une ville de Gad dans la vallée du Jourdain près du Jabbok, où Jacob bâtit des cabanes pour ses troupeaux et dont les chefs refusèrent du pain à Gédéon ; on l’identifie d’ordinaire, sans certitude, à Tell Deir Alla, tertre fouillé par l’université de Leyde depuis 1960 et célèbre pour son inscription sur enduit concernant Balaam fils de Beor. La vallée de Succoth est donc le tronçon de la plaine orientale du Jourdain, le Ghor, autour du cours inférieur du Jabbok (Zarqa), bien arrosé et, dans l’Antiquité, semé de villes, où les ustensiles du temple de Salomon furent fondus « dans un sol argileux, entre Succoth et Tsarthan ». Hors du psaume, le nom n’est pas employé. Ce sont aujourd’hui des terres cultivées de la vallée centrale du Jourdain, en Jordanie, autour du village de Deir Alla."
  pl:
    - "Dolina Sukkot jest wymieniona w boskiej wyroczni zachowanej w dwóch psalmach: „Bóg ci mówił w świętobliwości swojej; przeto się rozweselę, rozdzielę Sychem, i dolinę Sukkotską pomierzę.” Sychem na zachód od Jordanu i Sukkot na wschód od niego oznaczają dwie połowy kraju, które Bóg odmierza jako jego właściciel; wyrocznia idzie dalej, rościąc sobie Gilead, Manasses, Efraim i Judę oraz upokarzając Moab, Edom i Filisteę. W Biblii synodalnej są to Psalmy 59 i 107."
    - "Sukkot było miastem Gada w dolinie Jordanu koło Jabboku, gdzie Jakub zbudował szałasy dla bydła i którego przedniejsi odmówili Gedeonowi chleba; utożsamia się je zwykle, choć nie z pewnością, z Tell Deir Alla, kopcem badanym przez Uniwersytet w Lejdzie od 1960 roku i słynnym z tynkowej inskrypcji o Balaamie, synu Beora. Dolina Sukkot jest więc odcinkiem wschodniej równiny Jordanu, Ghor, wokół dolnego Jabboku (Zarka), dobrze nawodnionym i w starożytności usianym miastami, gdzie naczynia świątyni Salomona odlewano „w iłowatej ziemi, między Sochotem i między Sartanem”. Poza psalmem nazwa nie jest używana. Dziś są to pola uprawne środkowej doliny Jordanu w Jordanii, wokół wsi Deir Alla."
  it:
    - "La valle di Succot è nominata in un oracolo divino conservato in due salmi: «Iddio ha parlato nella sua santità: Io trionferò, spartirò Sichem e misurerò la valle di Succot». Sichem a ovest del Giordano e Succot a est di esso rappresentano le due metà del paese che Dio misura come suo padrone; l’oracolo prosegue rivendicando Galaad, Manasse, Efraim e Giuda e umiliando Moab, Edom e la Filistea. Nella Bibbia sinodale questi sono i Salmi 59 e 107."
    - "Succot era una città di Gad nella valle del Giordano presso lo Iabbok, dove Giacobbe costruì capanne per il suo bestiame e i cui capi rifiutarono il pane a Gedeone; è di solito, ma non con certezza, identificata con Tell Deir Alla, un tell scavato dall’Università di Leida dal 1960 e famoso per la sua iscrizione su intonaco riguardante Balaam figlio di Beor. La valle di Succot è dunque il tratto della piana orientale del Giordano, il Ghor, attorno al corso inferiore dello Iabbok (Zarqa), ben irrigato e in antico punteggiato di città, dove i vasi del tempio di Salomone furono fusi «in un suolo argilloso, fra Succoth e Tsarthan». Oltre il salmo il nome non è usato. Oggi è terra agricola della valle centrale del Giordano in Giordania, attorno al villaggio di Deir Alla."
  nl:
    - "Het dal van Sukkot wordt genoemd in een goddelijk godsspraakwoord dat in twee psalmen is bewaard: “God heeft gesproken in Zijn heiligdom; dies zal ik van vreugde opspringen; ik zal Sichem delen, en het dal van Sukkoth zal ik afmeten.” Sichem ten westen van de Jordaan en Sukkot ten oosten ervan staan voor de twee helften van het land die God als eigenaar uitmeet; het godsspraakwoord gaat verder met Gilead, Manasse, Efraïm en Juda op te eisen en Moab, Edom en Filistea te vernederen. In de Synodale Bijbel zijn dit Psalm 59 en 107."
    - "Sukkot was een stad van Gad in de Jordaanvallei bij de Jabbok, waar Jakob hutten voor zijn vee bouwde en wier oversten Gideon brood weigerden; ze wordt gewoonlijk, maar niet met zekerheid, vereenzelvigd met Tell Deir Alla, een heuvel die sinds 1960 door de Universiteit Leiden wordt opgegraven en beroemd is om zijn pleisteropschrift over Bileam, zoon van Beor. Het dal van Sukkot is dan het stuk van de oostelijke Jordaanvlakte, de Ghor, rond de benedenloop van de Jabbok (Zarqa), goed bewaterd en in de oudheid bezaaid met steden, waar de tempelvoorwerpen van Salomo werden gegoten “in dichte aarde, tussen Sukkoth en tussen Zarthan”. Buiten de psalm wordt de naam niet gebruikt. Tegenwoordig is het landbouwgrond in de centrale Jordaanvallei in Jordanië, rond het dorp Deir Alla."
  cs:
    - "Sukotské údolí je jmenováno v božím výroku zachovaném ve dvou žalmech: „Bůh mluvil skrze svatost svou, veseliti se budu, budu děliti Sichem, a údolí Sochot rozměřím.“ Šekem západně od Jordánu a Sukot východně od něj představují dvě poloviny země, kterou Bůh odměřuje jako její vlastník; výrok pokračuje nárokem na Gilead, Manases, Efrajim a Judu a poníženími Moábu, Edómu a Pelištie. V synodálním překladu jsou to žalmy 59 a 107."
    - "Sukot byl město Gádovo v Jordánském údolí poblíž Jaboku, kde Jákob postavil boudy pro svůj dobytek a jehož knížata odepřela Gedeonovi chléb; bývá, i když ne jistě, ztotožňován s Tell Dér Alla, pahorkem vykopávaným Leidenskou univerzitou od roku 1960 a proslulým omítkovým nápisem o Bileámovi, synu Beórově. Sukotské údolí je tedy pás východní jordánské roviny, Ghór, kolem dolního Jaboku (Zarká), dobře zavlažený a ve starověku posetý městy, kde byly Šalomounovy chrámové nádoby odlity „v jilovaté zemi, mezi Sochot a Sartan“. Mimo žalm se jméno nepoužívá. Dnes je to zemědělská půda středního Jordánského údolí v Jordánsku, kolem vesnice Dér Alla."
  sv:
    - "Suckotdalen nämns i ett gudomligt orakel som bevarats i två psalmer: ”Gud har talat i sin helgedom: ’Jag skall triumfera, jag skall utskifta Sikem och skall avmäta Suckots dal.’” Shekem väster om Jordan och Suckot öster om den står för landets två halvor som Gud mäter upp som dess ägare; oraklet fortsätter med att göra anspråk på Gilead, Manasse, Efraim och Juda och att förödmjuka Moab, Edom och Filisteen. I den synodala bibeln är dessa Psalm 59 och 107."
    - "Suckot var en stad i Gad i Jordandalen nära Jabbok, där Jakob byggde hyddor åt sin boskap och vars furstar vägrade Gideon bröd; det identifieras vanligen, fast inte med säkerhet, med Tell Deir Alla, en kulle som Leidens universitet har grävt ut sedan 1960 och som är berömd för sin putsinskrift om Bileam, Beors son. Suckotdalen är då den sträcka av Jordans östra slätt, Ghor, kring nedre Jabbok (Zarqa), välbevattnad och i antiken full av städer, där Salomos tempelkärl göts ”i lerformar, mellan Suckot och Saretan”. Utanför psalmen används inte namnet. I dag är det jordbruksmark i centrala Jordandalen i Jordanien, kring byn Deir Alla."
  nb:
    - "Sukkot-dalen er nevnt i et guddommelig utsagn bevart i to salmer: «Gud har talt i sin hellighet. Jeg vil fryde mig; jeg vil utskifte Sikem og opmåle Sukkots dal.» Sikem vest for Jordan og Sukkot øst for den står for de to halvdelene av landet som Gud måler opp som sin eier; utsagnet fortsetter med å kreve Gilead, Manasse, Efraim og Juda og med å ydmyke Moab, Edom og Filistea. I synodalbibelen er dette Salme 59 og 107."
    - "Sukkot var en by i Gad i Jordandalen nær Jabbok, der Jakob bygde løvhytter til buskapen sin og hvis høvdinger nektet Gideon brød; den identifiseres vanligvis, men ikke med sikkerhet, med Tell Deir Alla, en haug utgravd av universitetet i Leiden siden 1960 og berømt for sin gipsinnskrift om Bileam, Beors sønn. Sukkot-dalen er da strekningen av Jordans østlige slette, Ghor, rundt nedre Jabbok (Zarqa), vannrik og i antikken full av byer, der Salomos tempelkar ble støpt «i lerjorden mellem Sukkot og Sartan». Utover salmen brukes ikke navnet. I dag er det jordbruksland i den sentrale Jordandalen i Jordan, rundt landsbyen Deir Alla."
  tl:
    - "Ang libis ng Succoth ay pinangalanan sa isang orakulo ng Diyos na iniingatan sa dalawang awit: “Nagsalita ang Dios sa kaniyang kabanalan; ako'y magsasaya: aking hahatiin ang Sichem, at aking susukatin ang libis ng Succoth.” Ang Sichem sa kanluran ng Jordan at ang Succoth sa silangan nito ay kumakatawan sa dalawang kalahati ng lupain na sinusukat ng Diyos bilang may-ari; nagpapatuloy ang orakulo na angkinin ang Gilead, Manases, Ephraim at Juda at pababain ang Moab, Edom at Filistia. Sa Bibliyang Synodal ang mga ito ay Awit 59 at 107."
    - "Ang Succoth ay bayan ng Gad sa libis ng Jordan malapit sa Jaboc, kung saan nagtayo si Jacob ng mga balag para sa kaniyang baka at ang mga pinuno nito ay tumanggi kay Gedeon ng tinapay; karaniwan, bagaman hindi tiyak, itong kinikilala sa Tell Deir Alla, burol na hinukay ng Pamantasan ng Leiden mula 1960 at bantog sa inskripsiyong plaster tungkol kay Balaam na anak ni Beor. Kaya ang libis ng Succoth ay ang kahabaan ng silangang kapatagan ng Jordan, ang Ghor, sa paligid ng ibabang Jaboc (Zarqa), mayaman sa tubig at noong sinaunang panahon ay may kalat na mga bayan, kung saan binubo ang mga sisidlan ng templo ni Salomon “sa malagkit na lupa na nasa pagitan ng Succoth at ng Sarthan”. Sa labas ng awit, hindi ginagamit ang pangalan. Ngayon ito ay bukirin ng gitnang libis ng Jordan sa Jordan, sa paligid ng nayon ng Deir Alla."
  da:
    - "Sukkots dal nævnes i et guddommeligt orakel bevaret i to salmer: »Gud har talt i sin Helligdom, jeg vil fryde mig; jeg vil uddele Sikem og opmaale Sukots Dal.« Sikem vest for Jordan og Sukkot øst for den står for de to halvdele af landet, som Gud udmåler som dets ejer; oraklet fortsætter med at gøre krav på Gilead, Manasse, Efraim og Juda og at fornedre Moab, Edom og Filistæa. I Synodalbibelen er det Salme 59 og 107."
    - "Sukkot var en by i Gad i Jordandalen nær Jabbok, hvor Jakob byggede hytter til sit kvæg, og hvis fyrster nægtede Gideon brød; den identificeres sædvanligvis, dog ikke med sikkerhed, med Tell Deir Alla, en tell, som Leiden Universitet har udgravet siden 1960, og som er berømt for sin pudsindskrift om Bileam, Beors søn. Sukkots dal er altså den strækning af Jordans østlige slette, Ghor, omkring den nedre Jabbok (Zarqa), godt vandet og i oldtiden spækket med byer, hvor Salomos tempelkar blev støbt »i den faste Jord, imellem Sukot og Zarthan«. Ud over salmen bruges navnet ikke. I dag er det landbrugsland i den centrale Jordandal i Jordan, omkring landsbyen Deir Alla."
  sr:
    - "Долина Сокот именује се у божанском пророштву сачуваном у два псалма: „Бог рече у светињи својој: Веселићу се, разделићу Сихем, и долину Сокот размерићу.“ Сихем западно од Јордана и Сокот источно од њега стоје за две половине земље које Бог одмерава као њен власник; пророштво даље полаже право на Галад, Манасију, Јефрем и Јуду и понижава Моав, Едом и Филистеју. У руској синодалној Библији то су псалми 59 и 107."
    - "Сокот је био град Гадов у долини Јордана близу Јавока, где је Јаков саградио колибе за своју стоку и чији су кнезови одбили Гедеону хлеб; обично, мада не сигурно, поистовећује се с Тел Дер Алом, хумом који ископава Универзитет у Лајдену од 1960. и који је познат по малтерисаном натпису о Валаму сину Веоровом. Долина Сокот је, дакле, део источне јорданске равнице, Гора, око доњег Јавока (Зарка), добро натопљен и у антици посејан градовима, где су Соломунови храмски судови саливени „у земљи иловачи између Сохота и Сартана“. Изван псалма име се не употребљава. Данас је то обрадива земља средње долине Јордана у Јордану, око села Дер Ала."
  hu:
    - "A Szukkót-völgyet egy isteni jövendölés nevezi meg, amely két zsoltárban maradt fenn: „Az ő szent helyén mondotta Isten: Örvendezek, kiosztom Sikemet és kimérem a Szukkót völgyét.” A Jordántól nyugatra lévő Sikem és a tőle keletre lévő Szukkót az ország két felét jelöli, amelyet Isten tulajdonosként kimér; a jövendölés folytatódik azzal, hogy Gileádot, Manassét, Efraimot és Júdát magáénak vallja, és megalázza Moábot, Edomot és a Filiszteusok földjét. Az orosz szinodális Bibliában ezek a 59. és 107. zsoltár."
    - "Szukkót Gád városa volt a Jordán-völgyben a Jabbók közelében, ahol Jákób hajlékokat épített barmainak, és amelynek vezetői megtagadták Gedeontól a kenyeret; általában, bár nem biztosan, a Tell Dejr Allával azonosítják, a Leideni Egyetem által 1960 óta ásatott halommal, amely Bálámról, Beór fiáról szóló vakolatfeliratáról híres. A Szukkót-völgy tehát a Jordán keleti síkságának, a Górnak a szakasza az alsó Jabbók (Zarká) körül, jó vizű és az ókorban városokkal tarkított, ahol Salamon templomának edényeit öntötték „az agyagos földben, Sukhót és Sártán között”. A zsoltáron túl a nevet nem használják. Ma a jordániai középső Jordán-völgy földje, Dejr Alla falu körül."
  fi:
    - "Sukkotin laakso mainitaan jumalallisessa ennustuksessa, joka on säilynyt kahdessa psalmissa: ”Jumala on puhunut pyhäkössänsä! Minä riemuitsen, minä jaan Sikemin ja mittaan Sukkotin laakson.” Jordanin länsipuolella oleva Sikem ja sen itäpuolella oleva Sukkot edustavat maan kahta puoliskoa, jotka Jumala mittaa omistajanaan; ennustus jatkuu vaatimalla Gileadia, Manassea, Efraimia ja Juudaa ja nöyryyttämällä Moabin, Edomin ja Filistean. Venäjän synodaalisessa Raamatussa nämä ovat psalmit 59 ja 107."
    - "Sukkot oli Gadin kaupunki Jordanin laaksossa Jabbokin lähellä, missä Jaakob rakensi tarhoja karjalleen ja jonka päämiehet kieltäytyivät antamasta Gideonille leipää; se tunnistetaan yleensä, joskaan ei varmasti, Tell Deir Allaksi, Leidenin yliopiston vuodesta 1960 kaivamaksi kumpareeksi, joka on kuuluisa rappauskirjoituksestaan Bileamista, Beorin pojasta. Sukkotin laakso on siis Jordanin itäisen tasangon, Ghorin, osa alemman Jabbokin (Zarqa) ympärillä, hyvin kasteltu ja antiikissa kaupunkien täplittämä, missä Salomon temppelin astiat valettiin: ”Jordanin lakeudella kuningas ne valatti savimuotteihin, Sukkotin ja Saaretanin välillä”. Psalmin lisäksi nimeä ei käytetä. Nykyisin se on Jordanian keskisen Jordanin laakson viljelysmaata Deir Allan kylän ympärillä."
  vi:
    - "Trũng Su-cốt được nêu trong một lời sấm của Đức Chúa Trời được giữ trong hai thi thiên: “Đức Chúa Trời đã phán trong sự thánh Ngài rằng: Ta sẽ hớn hở, Ta sẽ chia Si-chem và đo trũng Su-cốt.” Si-chem phía tây Giô-đanh và Su-cốt phía đông tượng trưng cho hai nửa của xứ mà Đức Chúa Trời đo ra như chủ nhân; lời sấm tiếp tục đòi Ga-la-át, Ma-na-se, Ép-ra-im và Giu-đa và hạ Mô-áp, Ê-đôm và Đất Phi-li-tin. Trong bản Synodal đó là Thi thiên 59 và 107."
    - "Su-cốt là một thị trấn của Gát trong thung lũng Giô-đanh gần Gia-bốc, nơi Gia-cốp dựng lều cho bầy gia súc và nơi các quan trưởng từ chối bánh cho Ghê-đê-ôn; nó thường, dù không chắc chắn, được đồng nhất với Tell Deir Alla, một gò Đại học Leiden khai quật từ năm 1960 và nổi tiếng với bia ký vữa về Ba-la-am con Bê-ô. Vậy trũng Su-cốt là dải đồng bằng phía đông của Giô-đanh, Ghor, quanh hạ lưu Gia-bốc (Zarqa), nhiều nước và thời cổ rải rác các thị trấn, nơi các khí dụng đền thờ của Sa-lô-môn được đúc “trong một nơi đất sét, giữa Su-cốt, và Sát-than”. Ngoài thi thiên, tên không được dùng. Ngày nay đó là đất canh tác của thung lũng Giô-đanh trung tâm ở Jordan, quanh làng Deir Alla."
  ro:
    - "Valea Sucot este numită într-un oracol divin păstrat în doi psalmi: Dumnezeu a vorbit în sfințenia Sa; se va bucura, va împărți Sihemul și va măsura valea Sucotului. Sihemul de la vest de Iordan și Sucotul de la est de el reprezintă cele două jumătăți ale țării pe care Dumnezeu le măsoară ca stăpân al ei; oracolul continuă revendicând Galaadul, Manase, Efraim și Iuda și umilind Moabul, Edomul și Filistia. În Biblia sinodală rusă aceștia sunt Psalmii 59 și 107."
    - "Sucot era o cetate a lui Gad în valea Iordanului, lângă Iaboc, unde Iacov a zidit colibe pentru vitele sale și ale cărei căpetenii l-au refuzat pe Ghedeon când a cerut pâine; este identificată de obicei, deși nu cu certitudine, cu Tell Deir Alla, o movilă săpată de Universitatea din Leiden din 1960 și vestită pentru inscripția pe tencuială despre Balaam, fiul lui Beor. Valea Sucotului este, deci, porțiunea din câmpia estică a Iordanului, Ghor, din jurul cursului inferior al Iabocului (Zarqa), bine udată și în antichitate presărată cu orașe, unde vasele templului lui Solomon au fost turnate „în pământ cleios între Sokhot și între Saridata”. Dincolo de psalm numele nu este folosit. Astăzi este teren agricol din valea centrală a Iordanului, în Iordania, în jurul satului Deir Alla."
  bg:
    - "Долината Сокхот се споменава в едно Божие слово, запазено в два псалма: „Бог говори в светилището си: Ще тържествувам: ще разделя Сихем, И дола Сокхот ще размеря“. Сихем западно от Йордан и Сокхот източно от него означават двете половини на земята, които Бог премерва като неин стопанин; словото продължава, като претендира за Галаад, Манасия, Ефрем и Юда и смирява Моав, Едом и Филистия. В руската Синодална Библия това са Псалми 59 и 107."
    - "Сокхот бил град на Гад в Йорданската долина близо до Явок, където Яков направил колиби за добитъка си и чиито началници отказали хляб на Гедеон; той обикновено, макар и не със сигурност, се отъждествява с Тел Дейр Ала — могила, разкопавана от Лайденския университет от 1960 г. насам и прочута с надписа върху мазилка за Валаам, син на Веор. Следователно долината Сокхот е участъкът от източната равнина на Йордан, Гор, около долното течение на Явок (Зарка), добре напояван и в древността осеян с градове, където съдовете за Соломоновия храм били излети „в земя глинена, между Сокхот и Царетан“. Извън псалма името не се употребява. Днес това е земеделска земя в централната част на Йорданската долина в Йордания, около село Дейр Ала."
