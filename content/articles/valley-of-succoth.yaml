  nl: "Dal van Sukkot"
  cs: "Sukotské údolí"
body:
  en:
    - "The valley of Succoth is named in a divine oracle preserved in two psalms: “God hath spoken in his holiness; I will rejoice, I will divide Shechem, and mete out the valley of Succoth.” Shechem west of the Jordan and Succoth east of it stand for the two halves of the land that God measures out as its owner; the oracle goes on to claim Gilead, Manasseh, Ephraim and Judah and to humble Moab, Edom and Philistia. In the Synodal Bible these are Psalms 59 and 107."
    - "Succoth was a town of Gad in the Jordan valley near the Jabbok, where Jacob built booths for his cattle and whose elders refused Gideon bread; it is usually, though not certainly, identified with Tell Deir Alla, a mound excavated by Leiden University since 1960 and famous for its plaster inscription about Balaam son of Beor. The valley of Succoth, then, is the stretch of the Jordan's eastern plain, the Ghor, around the lower Jabbok (Zarqa), well watered and in antiquity dotted with towns, where Solomon's temple vessels were cast “in the clay ground between Succoth and Zarthan”. Beyond the psalm the name is not used. Today it is farmland of the central Jordan valley in Jordan, around the village of Deir Alla."
  ru:
    - "Долина Сокхоф названа в Божьем изречении, сохранённом в двух псалмах: «восторжествую, разделю Сихем и долину Сокхоф размерю». Сихем к западу от Иордана и Сокхоф к востоку от него означают две половины земли, которую Бог отмеряет как её владелец; дальше изречение заявляет права на Галаад, Манассию, Ефрема и Иуду и смиряет Моава, Едома и Филистимскую землю. В Синодальной Библии это псалмы 59 и 107."
    - "Сокхоф был городом Гада в долине Иордана близ Иавока, где Иаков сделал шалаши для скота и чьи старейшины отказали Гедеону в хлебе; его обычно, хотя и не наверняка, отождествляют с Телль-Дейр-Аллой, холмом, который Лейденский университет раскапывает с 1960 года и который знаменит штукатурной надписью о Валааме, сыне Веоровом. Долина Сокхоф, стало быть, — участок восточной равнины Иордана, Гора, вокруг нижнего Иавока (Зарки), обильный водой и в древности усеянный городами, где царь выливал храмовую утварь Соломона «в глинистой земле, в окрестности Иордана, между Сокхофом и Цартаном». Кроме псалма, это имя нигде не употребляется. Сегодня это поля центральной части Иорданской долины в Иордании вокруг селения Дейр-Алла."
  uk:
    - "Долина Сокхот названа в божому пророцтві, збереженому у двох псалмах: «Бог сказав у сьвятостї своїй: возрадуюся і роздїлю Сихему, і розміряю долину Сукот». Сихем на захід від Йордану і Сокхот на схід від нього стоять за дві половини краю, які Бог розмірює як його власник; пророцтво далі заявляє права на Гілеад, Манасію, Єфрем і Юду й обіцяє упокорити Моав, Едом і Філістію. У Синодальному перекладі це Псалми 59 і 107."
    - "Сокхот був містом Гада в долині Йордану поблизу Яббока, де Яків збудував шатра для своєї худоби і чиї старійшини відмовили Гедеонові в хлібі; його зазвичай, хоч і не напевно, ототожнюють із Телль-Дейр-Аллою, пагорбом, який Лейденський університет розкопує з 1960 року і який славний штукатурним написом про Валаама, сина Веора. Отже, долина Сокхот — це смуга східної рівнини Йордану, Гор, навколо нижнього Яббока (Зарка), добре зрошена й у давнину всіяна містами, де відлили храмові посудини Соломона «у формах із глинковатої землї, між Сукхотом і Сартаном». Поза псалмом назва не вживається. Нині це рілля центральної долини Йордану в Йорданії, навколо села Дейр-Алла."
  es:
    - "El valle de Sucot se nombra en un oráculo divino conservado en dos salmos: «Dios pronunció por su santuario; yo me alegraré; partiré á Sichêm, y mediré el valle de Succoth». Siquem, al oeste del Jordán, y Sucot, al este, representan las dos mitades de la tierra que Dios mide como su dueño; el oráculo sigue reclamando Galaad, Manasés, Efraín y Judá y humillando a Moab, Edom y Filistea. En la Biblia sinodal son los Salmos 59 y 107."
    - "Sucot era una ciudad de Gad en el valle del Jordán, cerca del Jaboc, donde Jacob construyó cabañas para su ganado y cuyos ancianos negaron pan a Gedeón; suele identificarse, aunque no con certeza, con Tell Deir Alla, un montículo excavado por la Universidad de Leiden desde 1960 y famoso por su inscripción en yeso sobre Balaam hijo de Beor. El valle de Sucot es, pues, el tramo de la llanura oriental del Jordán, el Ghor, en torno al bajo Jaboc (Zarqa), bien regado y en la Antigüedad salpicado de ciudades, donde se fundieron los utensilios del templo de Salomón «en tierra arcillosa, entre Succoth y Sarthán». Fuera del salmo el nombre no se usa. Hoy son tierras de cultivo del valle central del Jordán, en Jordania, en torno a la aldea de Deir Alla."
  pt:
    - "O vale de Sucote é nomeado num oráculo divino conservado em dois salmos: “Deus falou do seu santuário: ‘Eu triunfarei. Dividirei Siquém, e medirei o vale de Sucote.’” Siquém a oeste do Jordão e Sucote a leste dele representam as duas metades da terra que Deus mede como seu dono; o oráculo prossegue reclamando Gileade, Manassés, Efraim e Judá e humilhando Moabe, Edom e a Filístia. Na Bíblia Sinodal são os Salmos 59 e 107."
    - "Sucote era uma cidade de Gade no vale do Jordão, perto do Jaboque, onde Jacó construiu abrigos para o gado e cujos anciãos recusaram pão a Gideão; costuma ser, embora não com certeza, identificada com Tell Deir Alla, monte escavado pela Universidade de Leiden desde 1960 e famoso por sua inscrição em reboco sobre Balaão, filho de Beor. O vale de Sucote é, pois, o trecho da planície oriental do Jordão, o Ghor, em torno do baixo Jaboque (Zarqa), bem irrigado e na Antiguidade pontilhado de cidades, onde os utensílios do templo de Salomão foram fundidos “na terra argilosa entre Sucote e Zaretã”. Fora do salmo, o nome não é usado. Hoje são terras de cultivo do vale central do Jordão, na Jordânia, em torno da aldeia de Deir Alla."
  de:
    - "Das Sukkottal wird in einem göttlichen Spruch genannt, den zwei Psalmen bewahren: „Gott redete in seinem Heiligtum, des bin ich froh, und will teilen Sichem und abmessen das Tal Sukkoth.“ Sichem westlich des Jordans und Sukkot östlich davon stehen für die beiden Hälften des Landes, die Gott als sein Eigentümer vermisst; der Spruch beansprucht weiter Gilead, Manasse, Ephraim und Juda und demütigt Moab, Edom und Philistäa. In der Synodalbibel sind dies die Psalmen 59 und 107."
    - "Sukkot war eine Stadt Gads im Jordantal nahe dem Jabbok, wo Jakob Hütten für sein Vieh baute und deren Älteste Gideon Brot verweigerten; sie wird meist, aber nicht sicher, mit Tell Deir Alla gleichgesetzt, einem Hügel, den die Universität Leiden seit 1960 ausgräbt und der durch seine Putzinschrift über Bileam, den Sohn Beors, berühmt ist. Das Sukkottal ist also der Streifen der östlichen Jordanebene, des Ghor, um den unteren Jabbok (Zarqa), gut bewässert und in der Antike mit Städten übersät, wo Salomos Tempelgefäße „in dicker Erde, zwischen Sukkoth und Zarthan“ gegossen wurden. Über den Psalm hinaus wird der Name nicht gebraucht. Heute ist es Ackerland im zentralen Jordantal in Jordanien um das Dorf Deir Alla."
  fr:
    - "La vallée de Succoth est nommée dans un oracle divin conservé dans deux psaumes : « Dieu a dit dans sa sainteté : Je triompherai, je partagerai Sichem, je mesurerai la vallée de Succoth. » Sichem à l’ouest du Jourdain et Succoth à l’est représentent les deux moitiés du pays que Dieu mesure en propriétaire ; l’oracle revendique ensuite Galaad, Manassé, Éphraïm et Juda et humilie Moab, Édom et la Philistie. Dans la Bible synodale, ce sont les psaumes 59 et 107."
    - "Succoth était une ville de Gad dans la vallée du Jourdain près du Jabbok, où Jacob bâtit des cabanes pour ses troupeaux et dont les anciens refusèrent du pain à Gédéon ; on l’identifie d’ordinaire, sans certitude, à Tell Deir Alla, tertre fouillé par l’université de Leyde depuis 1960 et célèbre pour son inscription sur enduit concernant Balaam fils de Beor. La vallée de Succoth est donc le tronçon de la plaine orientale du Jourdain, le Ghor, autour du cours inférieur du Jabbok (Zarqa), bien arrosé et, dans l’Antiquité, semé de villes, où les ustensiles du temple de Salomon furent fondus « dans un sol argileux, entre Succoth et Tsarthan ». Hors du psaume, le nom n’est pas employé. Ce sont aujourd’hui des terres cultivées de la vallée centrale du Jourdain, en Jordanie, autour du village de Deir Alla."
  pl:
    - "Dolina Sukkot jest wymieniona w boskiej wyroczni zachowanej w dwóch psalmach: „Bóg ci mówił w świętobliwości swojej; przeto się rozweselę, rozdzielę Sychem, i dolinę Sukkotską pomierzę.” Sychem na zachód od Jordanu i Sukkot na wschód od niego oznaczają dwie połowy kraju, które Bóg odmierza jako jego właściciel; wyrocznia idzie dalej, rościąc sobie Gilead, Manasses, Efraim i Judę oraz upokarzając Moab, Edom i Filisteę. W Biblii synodalnej są to Psalmy 59 i 107."
    - "Sukkot było miastem Gada w dolinie Jordanu koło Jabboku, gdzie Jakub zbudował szałasy dla bydła i którego starsi odmówili Gedeonowi chleba; utożsamia się je zwykle, choć nie z pewnością, z Tell Deir Alla, kopcem badanym przez Uniwersytet w Lejdzie od 1960 roku i słynnym z tynkowej inskrypcji o Balaamie, synu Beora. Dolina Sukkot jest więc odcinkiem wschodniej równiny Jordanu, Ghor, wokół dolnego Jabboku (Zarka), dobrze nawodnionym i w starożytności usianym miastami, gdzie naczynia świątyni Salomona odlewano „w iłowatej ziemi, między Sochotem i między Sartanem”. Poza psalmem nazwa nie jest używana. Dziś są to pola uprawne środkowej doliny Jordanu w Jordanii, wokół wsi Deir Alla."
  it:
    - "La valle di Succot è nominata in un oracolo divino conservato in due salmi: «Iddio ha parlato nella sua santità: Io trionferò, spartirò Sichem e misurerò la valle di Succot». Sichem a ovest del Giordano e Succot a est di esso rappresentano le due metà del paese che Dio misura come suo padrone; l’oracolo prosegue rivendicando Galaad, Manasse, Efraim e Giuda e umiliando Moab, Edom e la Filistea. Nella Bibbia sinodale questi sono i Salmi 59 e 107."
    - "Succot era una città di Gad nella valle del Giordano presso lo Iabbok, dove Giacobbe costruì capanne per il suo bestiame e i cui anziani rifiutarono il pane a Gedeone; è di solito, ma non con certezza, identificata con Tell Deir Alla, un tell scavato dall’Università di Leida dal 1960 e famoso per la sua iscrizione su intonaco riguardante Balaam figlio di Beor. La valle di Succot è dunque il tratto della piana orientale del Giordano, il Ghor, attorno al corso inferiore dello Iabbok (Zarqa), ben irrigato e in antico punteggiato di città, dove i vasi del tempio di Salomone furono fusi «in un suolo argilloso, fra Succoth e Tsarthan». Oltre il salmo il nome non è usato. Oggi è terra agricola della valle centrale del Giordano in Giordania, attorno al villaggio di Deir Alla."
  nl:
    - "Het dal van Sukkot wordt genoemd in een goddelijk godsspraakwoord dat in twee psalmen is bewaard: “God heeft gesproken in Zijn heiligdom; dies zal ik van vreugde opspringen; ik zal Sichem delen, en het dal van Sukkoth zal ik afmeten.” Sichem ten westen van de Jordaan en Sukkot ten oosten ervan staan voor de twee helften van het land die God als eigenaar uitmeet; het godsspraakwoord gaat verder met Gilead, Manasse, Efraïm en Juda op te eisen en Moab, Edom en Filistea te vernederen. In de Synodale Bijbel zijn dit Psalm 59 en 107."
    - "Sukkot was een stad van Gad in de Jordaanvallei bij de Jabbok, waar Jakob hutten voor zijn vee bouwde en wier oudsten Gideon brood weigerden; ze wordt gewoonlijk, maar niet met zekerheid, vereenzelvigd met Tell Deir Alla, een heuvel die sinds 1960 door de Universiteit Leiden wordt opgegraven en beroemd is om zijn pleisteropschrift over Bileam, zoon van Beor. Het dal van Sukkot is dan het stuk van de oostelijke Jordaanvlakte, de Ghor, rond de benedenloop van de Jabbok (Zarqa), goed bewaterd en in de oudheid bezaaid met steden, waar de tempelvoorwerpen van Salomo werden gegoten “in dichte aarde, tussen Sukkoth en tussen Zarthan”. Buiten de psalm wordt de naam niet gebruikt. Tegenwoordig is het landbouwgrond in de centrale Jordaanvallei in Jordanië, rond het dorp Deir Alla."
  cs:
    - "Sukotské údolí je jmenováno v božím výroku zachovaném ve dvou žalmech: „Bůh mluvil skrze svatost svou, veseliti se budu, budu děliti Sichem, a údolí Sochot rozměřím.“ Šekem západně od Jordánu a Sukot východně od něj představují dvě poloviny země, kterou Bůh odměřuje jako její vlastník; výrok pokračuje nárokem na Gilead, Manases, Efrajim a Judu a poníženími Moábu, Edómu a Pelištie. V synodálním překladu jsou to žalmy 59 a 107."
    - "Sukot byl město Gádovo v Jordánském údolí poblíž Jaboku, kde Jákob postavil boudy pro svůj dobytek a jehož starší odepřeli Gedeonovi chléb; bývá, i když ne jistě, ztotožňován s Tell Dér Alla, pahorkem vykopávaným Leidenskou univerzitou od roku 1960 a proslulým omítkovým nápisem o Bileámovi, synu Beórově. Sukotské údolí je tedy pás východní jordánské roviny, Ghór, kolem dolního Jaboku (Zarká), dobře zavlažený a ve starověku posetý městy, kde byly Šalomounovy chrámové nádoby odlity „v jilovaté zemi, mezi Sochot a Sartan“. Mimo žalm se jméno nepoužívá. Dnes je to zemědělská půda středního Jordánského údolí v Jordánsku, kolem vesnice Dér Alla."
