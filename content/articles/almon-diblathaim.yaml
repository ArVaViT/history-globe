# Overview article (ADR 0007). Mainstream facts only; a station of the itinerary usually equated with Beth-diblathaim, which is said to be likely, not certain; no site is chosen.
id: almon-diblathaim
place: aeb052c
title:
  en: "Almon-diblathaim"
  ru: "Алмон-Дивлафаим"
  uk: "Алмон-Дівлатаїм"
  es: "Almón-diblataim"
  pt: "Almom-Diblataim"
  de: "Almon-Diblatajim"
  fr: "Almon-Diblathaïm"
body:
  en:
    - "Almon-diblathaim is one of the last stations of Israel's wanderings, known only from the itinerary of Numbers 33: “they removed from Dibon-gad, and encamped in Almon-diblathaim. And they removed from Almon-diblathaim, and pitched in the mountains of Abarim, before Nebo”. It lay, then, on the Moabite plateau between Dibon and Mount Nebo, a day's march from each. It is usually taken to be the Beth-diblathaim on which Jeremiah pronounces judgement with Dibon and Nebo, and which Mesha, king of Moab, in the ninth century BC counts among the towns he built; the second part of the name means “the two fig-cakes”, and may describe twin hills."
    - "No site is settled. The ruins proposed lie between Dhiban and Madaba in Jordan, among them the two mounds of Deleilat el-Gharbiyeh and Deleilat esh-Sharqiyeh and Khirbet el-Qureiye; nothing found at any of them names the place, and the choice rests on their position alone. That is all that is known of the place."
  ru:
    - "Алмон-Дивлафаим — один из последних станов странствий Израиля, известный только по перечню в 33-й главе книги Чисел: «И отправились из Дивон-Гада и расположились станом в Алмон-Дивлафаиме. И отправились из Алмон-Дивлафаима и расположились станом на горах Аваримских пред Нево». Значит, он лежал на моавитском плато между Дивоном и горой Нево, в дневном переходе от каждого. Его обычно считают тем Бет-Дивлафаимом, которому Иеремия возвещает суд вместе с Дивоном и Нево и который Меса, царь Моавитский, в IX веке до н. э. числит среди построенных им городов; вторая часть имени значит «две смоквенные лепёшки» и, возможно, описывает два холма-близнеца."
    - "Место не установлено. Предлагаемые развалины лежат между Дибаном и Мадабой в Иордании, среди них два холма Дулейлат-эль-Гарбийе и Дулейлат-эш-Шаркийя и Хирбет-эль-Курейе; ничто найденное ни на одном из них не называет места, и выбор держится лишь на их положении. Это всё, что известно об этом месте."
  uk:
    - "Алмон-Дівлатаїм — одна з останніх стоянок мандрівки Ізраїлю, відома лише з переліку станів у Числах 33: «рушили з Дибон-Гаду та й отаборились в Алмон Диблатаїмі. І рушили з Алмон-Диблатаїма та й отаборились під Абарим горами на проти Небо». Отже, він лежав на Моавському плато між Дівоном і горою Нево, за день дороги від кожного. Його зазвичай ототожнюють з Бет-Дівлатаїмом, на який Єремія виголошує присуд разом із Дівоном і Нево («на Дибон і на Нево й на Бет-Дивлатаїм») і який цар Моаба Меша в IX столітті до н. е. зараховує до міст, що їх збудував; друга частина назви означає «два фігові коржі» і може описувати двійню пагорбів."
    - "Місце не встановлено. Запропоновані руїни лежать між Дібаном і Мадабою в Йорданії, серед них два пагорби Делейлат-ель-Гарбійє і Делейлат-еш-Шаркійє та Хірбет-ель-Курейє; ніщо знайдене в жодному з них не називає місця, і вибір спирається лише на розташування. Це все, що відомо про це місце."
  es:
    - "Almón-diblataim es una de las últimas estaciones de las peregrinaciones de Israel, conocida solo por el itinerario de Números 33: «partidos de Dibon-gad, asentaron en Almon-diblathaim. Y partidos de Almon-diblathaim, asentaron en los montes de Abarim, delante de Nebo». Se hallaba, pues, en la meseta de Moab, entre Dibón y el monte Nebo, a una jornada de marcha de cada uno. Suele tomarse por la Bet-diblataim sobre la que Jeremías pronuncia juicio junto con Dibón y Nebo, y que Mesa, rey de Moab, cuenta en el siglo IX a. C. entre las ciudades que construyó; la segunda parte del nombre significa «las dos tortas de higos» y puede describir dos colinas gemelas."
    - "Ningún sitio está establecido. Las ruinas propuestas se hallan entre Dhiban y Madaba, en Jordania, entre ellas los dos montículos de Deleilat el-Gharbiyeh y Deleilat esh-Sharqiyeh y Khirbet el-Qureiye; nada hallado en ninguno de ellos nombra el lugar, y la elección descansa solo en su posición. Eso es todo lo que se sabe del lugar."
  pt:
    - "Almom-Diblataim é uma das últimas estações das peregrinações de Israel, conhecida apenas pelo itinerário de Números 33: “Partiram de Dibom-Gade e acamparam em Almom-Diblataim. Partiram de Almom-Diblataim e acamparam nas montanhas de Abarim, diante de Nebo”. Ficava, pois, no planalto de Moabe, entre Dibom e o monte Nebo, a um dia de marcha de cada um. É geralmente tomada pela Bete-Diblataim sobre a qual Jeremias pronuncia juízo com Dibom e Nebo, e que Mesa, rei de Moabe, no século IX a.C., conta entre as cidades que construiu; a segunda parte do nome significa “os dois bolos de figos” e pode descrever colinas gêmeas."
    - "Nenhum sítio está assentado. As ruínas propostas ficam entre Dhiban e Madaba, na Jordânia, entre elas os dois montículos de Deleilat el-Gharbiyeh e Deleilat esh-Sharqiyeh e Khirbet el-Qureiye; nada encontrado em nenhum deles nomeia o lugar, e a escolha se apoia apenas na posição. Isso é tudo o que se sabe do lugar."
  de:
    - "Almon-Diblatajim ist eine der letzten Stationen der Wanderung Israels, nur aus dem Wegverzeichnis von 4. Mose 33 bekannt: „Von Dibon-Gad zogen sie aus und lagerten sich in Almon-Diblathaim. Von Almon-Diblathaim zogen sie aus und lagerten sich in dem Gebirge Abarim vor dem Nebo.“ Es lag also auf dem moabitischen Hochplateau zwischen Dibon und dem Berg Nebo, einen Tagesmarsch von jedem entfernt. Man hält es gewöhnlich für das Bet-Diblatajim, über das Jeremia zusammen mit Dibon und Nebo das Gericht ausspricht und das Mesa, der König von Moab, im 9. Jahrhundert v. Chr. unter den von ihm gebauten Städten aufzählt; der zweite Teil des Namens bedeutet „die beiden Feigenkuchen“ und kann Zwillingshügel beschreiben."
    - "Keine Stätte ist gesichert. Die vorgeschlagenen Ruinen liegen zwischen Dhiban und Madaba in Jordanien, darunter die beiden Hügel Deleilat el-Gharbiyeh und Deleilat esh-Sharqiyeh sowie Chirbet el-Qureiye; nichts, was an einem von ihnen gefunden wurde, nennt den Ort, und die Wahl beruht allein auf ihrer Lage. Das ist alles, was über den Ort bekannt ist."
  fr:
    - "Almon-Diblathaïm est l’une des dernières étapes des pérégrinations d’Israël, connue seulement par l’itinéraire de Nombres 33 : « Ils partirent de Dibon-Gad, et campèrent à Almon-Diblathaïm. Ils partirent d’Almon-Diblathaïm, et campèrent aux montagnes d’Abarim, devant Nebo ». Elle se trouvait donc sur le plateau moabite entre Dibon et le mont Nebo, à une journée de marche de chacun. On la tient d’ordinaire pour le Beth-Diblathaïm que Jérémie frappe de jugement avec Dibon et Nebo, et que Mescha, roi de Moab, compte au IXe siècle av. J.-C. parmi les villes qu’il a bâties ; la seconde partie du nom signifie « les deux gâteaux de figues » et peut décrire deux collines jumelles."
    - "Aucun site n’est établi. Les ruines proposées se trouvent entre Dhiban et Madaba, en Jordanie, notamment les deux tertres de Deleilat el-Gharbiyeh et de Deleilat esh-Sharqiyeh et Khirbet el-Qureiye ; rien de ce qu’on y a trouvé ne nomme le lieu, et le choix repose sur la seule position. C’est tout ce que l’on sait du lieu."
scripture:
  - Num.33.46-Num.33.47
  - Jer.48.22
