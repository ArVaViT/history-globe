# Overview article (ADR 0007). Mainstream facts only; a station of the itinerary usually equated with Beth-diblathaim, which is said to be likely, not certain; no site is chosen.
id: almon-diblathaim
place: aeb052c
title:
  en: "Almon-diblathaim"
  ru: "Алмон-Дивлафаим"
body:
  en:
    - "Almon-diblathaim is one of the last stations of Israel's wanderings, known only from the itinerary of Numbers 33: “they removed from Dibon-gad, and encamped in Almon-diblathaim. And they removed from Almon-diblathaim, and pitched in the mountains of Abarim, before Nebo”. It lay, then, on the Moabite plateau between Dibon and Mount Nebo, a day's march from each. It is usually taken to be the Beth-diblathaim on which Jeremiah pronounces judgement with Dibon and Nebo, and which Mesha, king of Moab, in the ninth century BC counts among the towns he built; the second part of the name means “the two fig-cakes”, and may describe twin hills."
    - "No site is settled. The ruins proposed lie between Dhiban and Madaba in Jordan, among them the two mounds of Deleilat el-Gharbiyeh and Deleilat esh-Sharqiyeh and Khirbet el-Qureiye; nothing found at any of them names the place, and the choice rests on their position alone. That is all that is known of the place."
  ru:
    - "Алмон-Дивлафаим — один из последних станов странствий Израиля, известный только по перечню в 33-й главе книги Чисел: «И отправились из Дивон-Гада и расположились станом в Алмон-Дивлафаиме. И отправились из Алмон-Дивлафаима и расположились станом на горах Аваримских пред Нево». Значит, он лежал на моавитском плато между Дивоном и горой Нево, в дневном переходе от каждого. Его обычно считают тем Бет-Дивлафаимом, которому Иеремия возвещает суд вместе с Дивоном и Нево и который Меса, царь Моавитский, в IX веке до н. э. числит среди построенных им городов; вторая часть имени значит «две смоквенные лепёшки» и, возможно, описывает два холма-близнеца."
    - "Место не установлено. Предлагаемые развалины лежат между Дибаном и Мадабой в Иордании, среди них два холма Дулейлат-эль-Гарбийе и Дулейлат-эш-Шаркийя и Хирбет-эль-Курейе; ничто найденное ни на одном из них не называет места, и выбор держится лишь на их положении. Это всё, что известно об этом месте."
scripture:
  - Num.33.46-Num.33.47
  - Jer.48.22
sources:
  - "The Mesha Stele (KAI 181), line 30 (Beth-diblathaim); translation by K. A. D. Smelik in W. W. Hallo and K. L. Younger (eds.), The Context of Scripture, vol. 2 (2000)"
  - "G. I. Davies, The Way of the Wilderness: A Geographical Study of the Wilderness Itineraries in the Old Testament (1979)"
  - "B. MacDonald, 'East of the Jordan': Territories and Sites of the Hebrew Scriptures (2000)"
