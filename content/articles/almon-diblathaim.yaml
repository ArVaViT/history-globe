body:
  en:
    - "Almon-diblathaim is one of the last stations of Israel's wanderings, known only from the itinerary of Numbers 33: “they removed from Dibon-gad, and encamped in Almon-diblathaim. And they removed from Almon-diblathaim, and pitched in the mountains of Abarim, before Nebo”. It lay, then, on the Moabite plateau between Dibon and Mount Nebo. It is usually taken to be the Beth-diblathaim on which Jeremiah pronounces judgement with Dibon and Nebo, and which Mesha, king of Moab, in the ninth century BC counts among the towns he built; the second part of the name means “the two fig-cakes”, and may describe twin hills."
    - "No site is settled. The ruins proposed lie on the plateau south and west of Madaba in Jordan, among them the two mounds of Deleilat el-Gharbiyeh and Deleilat esh-Sharqiyeh and Khirbet el-Qureiye; nothing found at any of them names the place, and the choice rests on their position alone. That is all that is known of the place."
  ru:
    - "Алмон-Дивлафаим — один из последних станов странствий Израиля, известный только по перечню в 33-й главе книги Чисел: «И отправились из Дивон-Гада и расположились станом в Алмон-Дивлафаиме. И отправились из Алмон-Дивлафаима и расположились станом на горах Аваримских пред Нево». Значит, он лежал на моавитском плато между Дивоном и горой Нево. Его обычно считают тем Бет-Дивлафаимом, которому Иеремия возвещает суд вместе с Дивоном и Нево и который Меса, царь Моавитский, в IX веке до н. э. числит среди построенных им городов; вторая часть имени значит «две смоквенные лепёшки» и, возможно, описывает два холма-близнеца."
    - "Место не установлено. Предлагаемые развалины лежат на плато к югу и западу от Мадабы в Иордании, среди них два холма Дулейлат-эль-Гарбийе и Дулейлат-эш-Шаркийя и Хирбет-эль-Курейе; ничто найденное ни на одном из них не называет места, и выбор держится лишь на их положении. Это всё, что известно об этом месте."
  uk:
    - "Алмон-Дівлатаїм — одна з останніх стоянок мандрівки Ізраїлю, відома лише з переліку станів у Числах 33: «рушили з Дибон-Гаду та й отаборились в Алмон Диблатаїмі. І рушили з Алмон-Диблатаїма та й отаборились під Абарим горами на проти Небо». Отже, він лежав на Моавському плато між Дівоном і горою Нево. Його зазвичай ототожнюють з Бет-Дівлатаїмом, на який Єремія виголошує присуд разом із Дівоном і Нево («на Дибон і на Нево й на Бет-Дивлатаїм») і який цар Моаба Меша в IX столітті до н. е. зараховує до міст, що їх збудував; друга частина назви означає «два фігові коржі» і може описувати двійню пагорбів."
    - "Місце не встановлено. Запропоновані руїни лежать на плато на південь і захід від Мадаби в Йорданії, серед них два пагорби Делейлат-ель-Гарбійє і Делейлат-еш-Шаркійє та Хірбет-ель-Курейє; ніщо знайдене в жодному з них не називає місця, і вибір спирається лише на розташування. Це все, що відомо про це місце."
  es:
    - "Almón-diblataim es una de las últimas estaciones de las peregrinaciones de Israel, conocida solo por el itinerario de Números 33: «partidos de Dibon-gad, asentaron en Almon-diblathaim. Y partidos de Almon-diblathaim, asentaron en los montes de Abarim, delante de Nebo». Se hallaba, pues, en la meseta de Moab, entre Dibón y el monte Nebo. Suele tomarse por la Bet-diblataim sobre la que Jeremías pronuncia juicio junto con Dibón y Nebo, y que Mesa, rey de Moab, cuenta en el siglo IX a. C. entre las ciudades que construyó; la segunda parte del nombre significa «las dos tortas de higos» y puede describir dos colinas gemelas."
    - "Ningún sitio está establecido. Las ruinas propuestas se hallan en la meseta al sur y al oeste de Madaba, en Jordania, entre ellas los dos montículos de Deleilat el-Gharbiyeh y Deleilat esh-Sharqiyeh y Khirbet el-Qureiye; nada hallado en ninguno de ellos nombra el lugar, y la elección descansa solo en su posición. Eso es todo lo que se sabe del lugar."
  pt:
    - "Almom-Diblataim é uma das últimas estações das peregrinações de Israel, conhecida apenas pelo itinerário de Números 33: “Partiram de Dibom-Gade e acamparam em Almom-Diblataim. Partiram de Almom-Diblataim e acamparam nas montanhas de Abarim, diante de Nebo”. Ficava, pois, no planalto de Moabe, entre Dibom e o monte Nebo. É geralmente tomada pela Bete-Diblataim sobre a qual Jeremias pronuncia juízo com Dibom e Nebo, e que Mesa, rei de Moabe, no século IX a.C., conta entre as cidades que construiu; a segunda parte do nome significa “os dois bolos de figos” e pode descrever colinas gêmeas."
    - "Nenhum sítio está assentado. As ruínas propostas ficam no planalto ao sul e a oeste de Madaba, na Jordânia, entre elas os dois montículos de Deleilat el-Gharbiyeh e Deleilat esh-Sharqiyeh e Khirbet el-Qureiye; nada encontrado em nenhum deles nomeia o lugar, e a escolha se apoia apenas na posição. Isso é tudo o que se sabe do lugar."
  de:
    - "Almon-Diblatajim ist eine der letzten Stationen der Wanderung Israels, nur aus dem Wegverzeichnis von 4. Mose 33 bekannt: „Von Dibon-Gad zogen sie aus und lagerten sich in Almon-Diblathaim. Von Almon-Diblathaim zogen sie aus und lagerten sich in dem Gebirge Abarim vor dem Nebo.“ Es lag also auf dem moabitischen Hochplateau zwischen Dibon und dem Berg Nebo. Man hält es gewöhnlich für das Bet-Diblatajim, über das Jeremia zusammen mit Dibon und Nebo das Gericht ausspricht und das Mesa, der König von Moab, im 9. Jahrhundert v. Chr. unter den von ihm gebauten Städten aufzählt; der zweite Teil des Namens bedeutet „die beiden Feigenkuchen“ und kann Zwillingshügel beschreiben."
    - "Keine Stätte ist gesichert. Die vorgeschlagenen Ruinen liegen auf dem Plateau südlich und westlich von Madaba in Jordanien, darunter die beiden Hügel Deleilat el-Gharbiyeh und Deleilat esh-Sharqiyeh sowie Chirbet el-Qureiye; nichts, was an einem von ihnen gefunden wurde, nennt den Ort, und die Wahl beruht allein auf ihrer Lage. Das ist alles, was über den Ort bekannt ist."
  fr:
    - "Almon-Diblathaïm est l’une des dernières étapes des pérégrinations d’Israël, connue seulement par l’itinéraire de Nombres 33 : « Ils partirent de Dibon-Gad, et campèrent à Almon-Diblathaïm. Ils partirent d’Almon-Diblathaïm, et campèrent aux montagnes d’Abarim, devant Nebo ». Elle se trouvait donc sur le plateau moabite entre Dibon et le mont Nebo. On la tient d’ordinaire pour le Beth-Diblathaïm que Jérémie frappe de jugement avec Dibon et Nebo, et que Mescha, roi de Moab, compte au IXe siècle av. J.-C. parmi les villes qu’il a bâties ; la seconde partie du nom signifie « les deux gâteaux de figues » et peut décrire deux collines jumelles."
    - "Aucun site n’est établi. Les ruines proposées se trouvent sur le plateau au sud et à l’ouest de Madaba, en Jordanie, notamment les deux tertres de Deleilat el-Gharbiyeh et de Deleilat esh-Sharqiyeh et Khirbet el-Qureiye ; rien de ce qu’on y a trouvé ne nomme le lieu, et le choix repose sur la seule position. C’est tout ce que l’on sait du lieu."
  it:
    - "Almon-Diblataim è una delle ultime tappe del cammino d’Israele, nota soltanto dall’itinerario di Numeri 33: «Partirono da Dibon-Gad e si accamparono a Almon-Diblathaim. Partirono da Almon-Diblathaim e si accamparono ai monti d’Abarim dirimpetto a Nebo». Sorgeva dunque sull’altopiano moabita tra Dibon e il monte Nebo. È di solito identificata con la Bet-Diblataim su cui Geremia pronuncia il giudizio insieme a Dibon e Nebo, e che Mesa, re di Moab, nel IX secolo a.C. conta fra le città da lui costruite; la seconda parte del nome significa «le due schiacciate di fichi», e può descrivere due colline gemelle."
    - "Nessun sito è stabilito. Le rovine proposte si trovano sull’altopiano a sud e a ovest di Madaba in Giordania, fra cui i due tell di Deleilat el-Gharbiyeh e Deleilat esh-Sharqiyeh e Khirbet el-Qureiye; nulla di ciò che è stato trovato in alcuno di essi nomina il luogo, e la scelta poggia soltanto sulla loro posizione. Questo è tutto ciò che si sa del luogo."
  pl:
    - "Almon-Diblataim to jedna z ostatnich stacji wędrówki Izraela, znana tylko z wykazu w Lb 33: „A ruszywszy się z Dybon Gat, położyli się obozem w Helmon Dyblataim. A ruszywszy się z Helmon Dyblataim, położyli się obozem na górach Abarym, przeciwko Nebo”. Leżało więc na wyżynie Moabu między Dibonem a górą Nebo. Utożsamia się je zwykle z Bet-Diblataim, na które Jeremiasz wygłasza wyrok razem z Dibonem i Nebo i które Mesza, król Moabu, w IX wieku p.n.e. zalicza do miast przez siebie zbudowanych; druga część nazwy oznacza „dwa placki figowe” i może opisywać bliźniacze wzgórza."
    - "Żadne miejsce nie jest ustalone. Proponowane ruiny leżą na płaskowyżu na południe i zachód od Madaby w Jordanii, wśród nich dwa telle, Deleilat el-Gharbiyeh i Deleilat esh-Sharqiyeh, oraz Chirbet el-Qureiye; nic znalezionego w żadnym z nich nie podaje nazwy miejsca, a wybór opiera się wyłącznie na położeniu. To wszystko, co o tym miejscu wiadomo."
  nl:
    - "Almon-Diblataïm is een van de laatste standplaatsen van Israëls omzwervingen, alleen bekend uit het reisverslag van Numeri 33: “En zij verreisden van Dibon-Gad, en legerden zich in Almon-Diblathaim. En zij verreisden van Almon-Diblathaim, en legerden zich in de bergen Abarim, tegen Nebo.” Het lag dus op het Moabitische plateau tussen Dibon en de berg Nebo. Het wordt gewoonlijk gelijkgesteld met het Beth-Diblataïm waarover Jeremia het oordeel uitspreekt samen met Dibon en Nebo, en dat Mesa, de koning van Moab, in de negende eeuw v.Chr. rekent tot de steden die hij bouwde; het tweede deel van de naam betekent “de twee vijgenkoeken” en kan twee heuvels beschrijven."
    - "Geen plaats staat vast. De voorgestelde ruïnes liggen op het plateau ten zuiden en westen van Madaba in Jordanië, onder andere de twee heuvels Deleilat el-Gharbiyeh en Deleilat esh-Sharqiyeh en Khirbet el-Qureiye; niets wat op een van hen is gevonden, noemt de plaats, en de keuze berust alleen op hun ligging. Meer is over de plaats niet bekend."
  cs:
    - "Almon-diblataim je jedna z posledních stanic putování Izraele, známá jen z itineráře v Numeri 33: „Z Dibongad hnuvše se, položili se v Helmondeblataim. A když se hnuli z Helmondeblataim, položili se na horách Abarim proti Nébo.“ Leželo tedy na moábské planině mezi Dibonem a horou Nebo. Obvykle se pokládá za Bét-diblatajim, nad nímž Jeremjáš vynáší soud spolu s Dibonem a Nebem a které Meša, král Moábu, v 9. století př. n. l. počítá mezi města, jež vystavěl; druhá část jména znamená „dva fíkové koláče“ a může popisovat dvojici pahorků."
    - "Žádné místo není jisté. Navržené zříceniny leží na planině jižně a západně od Madaby v Jordánsku, mezi nimi dva pahorky Deleilat el-Gharbiyeh a Deleilat esh-Sharqiyeh a Chirbet el-Qureiye; nic, co se na kterémkoli z nich našlo, místo nejmenuje, a výběr se opírá jen o jejich polohu. To je vše, co o místě víme."
  sv:
    - "Almon-Diblatajim är en av de sista stationerna på Israels vandring, känd bara från vandringsförteckningen i Fjärde Mosebok 33: ”bröto upp från Dibon-Gad och lägrade sig i Almon-Diblataima. Och de bröto upp från Almon-Diblataima och lägrade sig vid Abarimbergen, framför Nebo”. Den låg alltså på moabiternas platå mellan Dibon och Nebo. Den antas vanligen vara det Bet-Divlatajim över vilket Jeremia uttalar dom tillsammans med Dibon och Nebo, och som Mesha, Moabs kung, på 800-talet f.Kr. räknar bland de städer han byggde; namnets andra del betyder ”de två fikonkakorna” och kan beskriva tvillingkullar."
    - "Ingen plats är avgjord. De föreslagna ruinerna ligger på platån söder och väster om Madaba i Jordanien, bland dem de två kullarna Deleilat el-Gharbiyeh och Deleilat esh-Sharqiyeh samt Khirbet el-Qureiye; inget som funnits vid någon av dem nämner platsen, och valet vilar enbart på deras läge. Det är allt som är känt om platsen."
  nb:
    - "Almon-Diblatajim er en av de siste stasjonene på Israels vandring, bare kjent fra reiseruten i 4. Mosebok 33: «Og de drog fra Dibon-Gad og leiret sig i Almon-Diblataima. Og de drog fra Almon-Diblataima og leiret sig ved Abarim-fjellene, foran Nebo». Den lå altså på Moabs høyslette mellom Dibon og Nebo. Den regnes vanligvis for Bet-Diblatajim, som Jeremia kunngjør dom over sammen med Dibon og Nebo: «over Dibon og over Nebo og over Bet-Diblata'im», og som Mesa, konge av Moab, på 800-tallet f.Kr. regner blant byene han bygde; den andre delen av navnet betyr «de to fikenkakene» og kan beskrive tvillinghauger."
    - "Ingen lokalitet er avgjort. Ruinene som er foreslått, ligger på høysletten sør og vest for Madaba i Jordan, blant dem de to haugene Deleilat el-Gharbiyeh og Deleilat esh-Sharqiyeh og Khirbet el-Qureiye; ingenting funnet ved noen av dem nevner stedet, og valget hviler på beliggenheten alene. Det er alt som er kjent om stedet."
  tl:
    - "Ang Almon-diblathaim ay isa sa mga huling himpilan ng mga paglalakbay ng Israel, na kilala lamang mula sa talaan ng paglalakbay sa Mga Bilang 33: “At sila'y naglakbay mula sa Dibon-gad, at humantong sa Almon-diblathaim. At sila'y naglakbay mula sa Almon-diblathaim, at humantong sa mga bundok ng Abarim, sa harap ng Nebo.” Kaya ito ay nasa talampas ng Moab sa pagitan ng Dibon at Bundok Nebo. Karaniwang itinuturing itong Beth-diblathaim na hinahatulan ni Jeremias kasama ng Dibon at Nebo, at na ibinibilang ni Mesa, hari ng Moab, noong ika-9 na siglo BK sa mga bayang itinayo niya; ang ikalawang bahagi ng pangalan ay nangangahulugang “ang dalawang binilong igos”, at maaaring naglalarawan ng kambal na burol."
    - "Walang tiyak na lugar. Ang mga iminungkahing guho ay nasa talampas sa timog at kanluran ng Madaba sa Jordan, kabilang ang dalawang burol ng Deleilat el-Gharbiyeh at Deleilat esh-Sharqiyeh at ang Khirbet el-Qureiye; walang natagpuan sa alinman sa mga ito na nagpapangalan sa lugar, at ang pagpili ay nakasalig lamang sa kinalalagyan. Iyan lamang ang nalalaman tungkol sa lugar."
  da:
    - "Almon-Diblatajim er en af de sidste stationer på Israels vandring, kendt alene fra rejseberetningen i 4 Mosebog 33: »de rejste fra Dibon-Gad, og de lejrede sig i Almon-Diblathaim. Og de rejste fra Almon-Diblathaim, og de lejrede sig ved Abarims Bjerge, foran Nebo«. Det lå altså på Moabs højslette mellem Dibon og Nebo. Det regnes sædvanligvis for det Bet-Diblatajim, som Jeremias udtaler dom over sammen med Dibon og Nebo, og som Mesja, Moabs konge, i 800-tallet f.Kr. tæller blandt de byer, han byggede; navnets anden del betyder »de to figenkager« og kan beskrive tvillingebakker."
    - "Intet sted er afgjort. De foreslåede ruiner ligger på højsletten syd og vest for Madaba i Jordan, blandt dem de to tells Deleilat el-Gharbiyeh og Deleilat esh-Sharqiyeh og Khirbet el-Qureiye; intet fundet ved nogen af dem nævner stedet, og valget hviler på deres beliggenhed alene. Det er alt, hvad man ved om stedet."
  sr:
    - "Гелмон-Девлатаим је једна од последњих станица Израиљевог лутања, позната само из путописа у Књизи Бројева 33: „А из Девон-Гада отишавши стадоше у логор у Гелмон-Девлатаиму. А из Гелмон-Девлатаима отишавши стадоше у логор у планинама аваримским према Нававу.“ Лежао је, дакле, на моавској висоравни између Девона и горе Нево. Обично се узима да је то Вет-Девлатајим над којим Јеремија изриче суд заједно с Девоном и Невоном, и који Миса, цар Моава, у 9. веку п. н. е. убраја међу градове које је саградио; други део имена значи „два колача од смокава“ и може описивати двоструке брегове."
    - "Ниједно налазиште није утврђено. Предложене рушевине леже на висоравни јужно и западно од Мадабе у Јордану, међу њима две хумке Делејлат ел-Гарбија и Делејлат еш-Шаркија и Хирбет ел-Курејје; ништа нађено ни на једном од њих не именује место, а избор се ослања само на њихов положај. То је све што се о том месту зна."
  hu:
    - "Almon-Diblatajim Izráel vándorlásának egyik utolsó állomása, amelyet csak a Számok 33 útvonallistájából ismerünk: „És elindulának Dibon-Gádból, és tábort ütének Almon-Diblathaimban. És elindulának Almon-Diblathaimból, és tábort ütének az Abarim hegységnél, Nébó ellenében.” A moábi fennsíkon feküdt tehát, Dibon és a Nébó-hegy között. Általában azonosnak tartják Bét-Diblatajimmal, amely felett Jeremiás Dibonnal és Nébóval együtt ítéletet mond, és amelyet Mésa, Moáb királya a Kr. e. 9. században az általa épített városok között említ; a név második része, „a két fügepogácsa”, ikerdombokat írhat le."
    - "Lelőhely nem eldöntött. A javasolt romok a fennsíkon fekszenek, a jordániai Mádabától délre és nyugatra, köztük a Deleilat el-Gharbiyeh és a Deleilat esh-Sharqiyeh két halma, valamint a Khirbet el-Qureiye; egyiken sem találtak semmit, ami megnevezné a helyet, a választás kizárólag fekvésükre épül. A helyről ennyi ismert."
  fi:
    - "Almon-Diblataim on yksi Israelin vaelluksen viimeisistä leiripaikoista, joka tunnetaan vain 4. Mooseksen kirjan luvun 33 matkaluettelosta: ”Ja he lähtivät Diibon-Gaadista ja leiriytyivät Almon-Diblataimiin. Ja he lähtivät Almon-Diblataimista ja leiriytyivät Abarimin vuoristoon vastapäätä Neboa.” Se sijaitsi siis Moabin ylängöllä Dibonin ja Nebovuoren välillä. Sen katsotaan yleensä olevan Bet-Diblataim, jonka yli Jeremia lausuu tuomion Dibonin ja Nebon kanssa ja jonka Mesa, Moabin kuningas, 800-luvulla eaa. lukee rakentamiensa kaupunkien joukkoon; nimen jälkimmäinen osa tarkoittaa ”kahta viikunakakkua” ja voi kuvata kaksoiskukkulaa."
    - "Paikkaa ei ole varmistettu. Ehdotetut rauniot sijaitsevat Madabasta etelään ja länteen ylängöllä Jordaniassa, muun muassa kaksi kumpua Deleilat el-Gharbiyeh ja Deleilat esh-Sharqiyeh sekä Khirbet el-Qureiye; mikään niistä löydetty ei nimeä paikkaa, ja valinta perustuu pelkästään niiden sijaintiin. Siinä on kaikki, mitä paikasta tiedetään."
  vi:
    - "Anh-môn-Đíp-la-tha-im là một trong những trạm dừng cuối cùng trong cuộc lang thang của dân Y-sơ-ra-ên, chỉ được biết qua bản lộ trình trong Dân Số Ký 33: “Đi từ Đi-bôn-Gát và đóng trại tại Anh-môn-Đíp-la-tha-im. Kế ấy, đi từ Anh-môn-Đíp-la-tha-im và đóng trại tại núi A-ba-rim trước Nê-bô”. Như vậy nó nằm trên cao nguyên Mô-áp giữa Đi-bôn và núi Nê-bô. Nó thường được cho là Bết-Đíp-la-tha-im mà Giê-rê-mi tuyên án cùng với Đi-bôn và Nê-bô, và mà Mê-sa, vua Mô-áp, vào thế kỷ 9 TCN kể trong số các thành ông xây; phần thứ hai của tên có nghĩa là “hai bánh trái vả”, và có thể mô tả hai ngọn đồi song đôi."
    - "Chưa có địa điểm nào được xác định. Các tàn tích được đề xuất nằm trên cao nguyên phía nam và phía tây Madaba ở Gióc-đa-ni, trong đó có hai gò Deleilat el-Gharbiyeh và Deleilat esh-Sharqiyeh cùng Khirbet el-Qureiye; không có gì tìm thấy ở nơi nào trong số đó nêu tên địa điểm, và sự lựa chọn chỉ dựa vào vị trí. Đó là tất cả những gì được biết về nơi này."
  ro:
    - "Almon-Diblataim este una dintre ultimele stații ale rătăcirilor lui Israel, cunoscută doar din itinerarul din Numeri 33: „Și au purces din Devonul lui Gad, și au tăbărît în Ghelmon Devlatem. Și au purces din Ghelmon Devlatem, și au tăbărît la munții Avarim împreajma Navavului”. Se afla, așadar, pe platoul moabit, între Dibon și muntele Nebo. Este socotit de obicei același cu Bet-Diblataim, asupra căruia Ieremia rostește judecata alături de Dibon și Nebo și pe care Meșa, regele Moabului, îl numără în secolul al IX-lea î.Hr. printre cetățile construite de el; a doua parte a numelui înseamnă „cele două turte de smochine” și poate descrie două dealuri gemene."
    - "Niciun loc nu este stabilit. Ruinele propuse se află pe platoul de la sud și vest de Madaba, în Iordania, între ele cele două movile Deleilat el-Gharbiyeh și Deleilat esh-Sharqiyeh și Khirbet el-Qureiye; nimic găsit la vreuna dintre ele nu numește locul, iar alegerea se sprijină doar pe poziția lor. Aceasta este tot ce se știe despre acest loc."
  bg:
    - "Алмон-Дивлатаим е един от последните станове на странстванията на Израил, известен само от маршрута в Числа 33: „И като се дигнаха от Девон-гад разположиха стан в Алмон-дивлатаим. И като се дигнаха от Алмон-дивлатаим разположиха стан на горите Аварим, срещу Нево.“ Лежал е, значи, на моавското плато между Дивон и планината Нево. Обикновено се смята за Бет-Дивлатаим, над когото Йеремия произнася присъда заедно с Дивон и Нево и който Меша, цар на Моав, през IX в. пр.н.е. причислява към градовете, които построил; втората част на името означава „двете смокинови питки“ и може да описва близнашки хълмове."
    - "Никое място не е установено. Предложените развалини лежат на платото южно и западно от Мадаба в Йордания, между които двете могили Делейлат ел-Гарбие и Делейлат еш-Шаркие и Хирбет ел-Курейе; нищо намерено на тях не назовава мястото и изборът се опира единствено на положението им. Това е всичко, което се знае за мястото."
