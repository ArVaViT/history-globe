body:
  en:
    - "Nob, “the city of the priests”, stood within sight of Jerusalem on its northern side. Isaiah's Assyrian, marching down from Michmash through Geba, Gallim and Anathoth, halts at Nob and shakes his hand “against the mount of the daughter of Zion, the hill of Jerusalem”, and Nehemiah lists Nob between Anathoth and Ananiah among the villages of Benjamin. The site has not been found. The commonest guess is Ras el-Mesharif on Mount Scopus, from which the city first comes into view on the road from the north; Ras Umm et-Tala and Ras Tumeim on the same ridge, the village of Isawiya below it, Qu'meh further north and French Hill have also been proposed."
    - "In Saul's day the priests of Eli's house served at Nob, where the ephod was kept and the shewbread was set before the LORD. Here David, fleeing Saul alone, came to Ahimelech; the priest gave him “hallowed bread: for there was no bread there but the shewbread”, and “the sword of Goliath the Philistine... wrapped in a cloth behind the ephod”. Doeg the Edomite saw it and told Saul, who summoned “all his father's house, the priests that were in Nob”; when the king's guards would not touch them, Doeg “slew on that day fourscore and five persons that did wear a linen ephod”, and “Nob, the city of the priests, smote he with the edge of the sword, both men and women, children and sucklings”. Only Abiathar escaped to David. Jesus recalled the episode when his disciples were accused of breaking the sabbath: David “entered into the house of God, and did eat the shewbread”."
    - "After the exile Nob appears only in Nehemiah's list of Benjaminite villages. Since the site is unknown, nothing of the sanctuary has been found. The ridge of Mount Scopus today carries the Hebrew University and the Hadassah hospital, with Isawiya on its eastern slope and French Hill to the north."
  ru:
    - "Номва, «город священников», стояла в виду Иерусалима с северной стороны. Об ассирийце у Исаии, спускающемся от Михмаса через Геву, Галим и Анафоф, сказано: «Еще день простоит он в Нове; грозит рукою своею горе Сиону, холму Иерусалимскому», а Неемия называет Нов (так у Исаии и Неемии зовётся Номва) между Анафофом и Ананией среди селений Вениамина. Место не найдено. Чаще всего называют Рас-эль-Мешариф на горе Скопус, откуда город впервые открывается путнику с севера; предлагали и Рас-Умм-эт-Талу и Рас-Тумейм на том же гребне, деревню Исавию под ним, Кумэ дальше к северу и Френч-Хилл."
    - "Во дни Саула священники дома Илия служили в Номве, где хранился ефод и пред Господом лежали хлебы предложения. Сюда пришёл Давид, один бежавший от Саула, к Ахимелеху; священник дал ему «священного хлеба; ибо не было у него хлеба, кроме хлебов предложения», и «меч Голиафа Филистимлянина... завернутый в одежду, позади ефода». Доик Идумеянин видел это и донёс Саулу, который призвал «весь дом отца его, священников, что в Номве»; когда царские слуги не подняли на них руки, Доик «умертвил в тот день восемьдесят пять мужей, носивших льняной ефод», «и Номву, город священников, поразил мечом; и мужчин и женщин, и юношей и младенцев». Спасся к Давиду один Авиафар. Иисус напомнил этот случай, когда учеников обвинили в нарушении субботы: Давид «вошел в дом Божий и ел хлебы предложения»."
    - "После плена Номва упоминается лишь в списке вениамитских селений у Неемии. Поскольку место неизвестно, от святилища ничего не найдено. На гребне горы Скопус сегодня стоят Еврейский университет и больница Хадасса, на восточном склоне — Исавия, к северу — Френч-Хилл."
  uk:
    - "Ноб, «сьвященниче місто», стояв на виду від Єрусалима з його північного боку. Ассирієць у Ісаї, що йде вниз від Міхмаса через Гебу, Галлім і Анатот, зупиняється в Нобі та погрожує рукою «Сионові, узгіррю Ерусалимському», а Неемія перелічує Ноб між Анатотом і Ананією серед сіл Веніяміна. Місце не знайдено. Найпоширеніше припущення — Рас-ель-Мешаріф на горі Скопус, з якої на дорозі з півночі вперше відкривається вид на місто; пропонували також Рас-Умм-ет-Тала й Рас-Тумейм на тому самому хребті, село Ісавія під ним, Кумех далі на північ і Французький пагорб."
    - "За днів Саула священики дому Ілія служили в Нобі, де зберігався ефод і де перед Господом клали показні хліби. Сюди Давид, утікаючи сам від Саула, прийшов до Ахімелеха; священик дав йому «сьвященного хлїба, не було бо иншого хлїба, як показний хлїб», а також «меч Филистія Голіята ... обгорнутий одежею, позад ефода». Едомитянин Доік побачив це й сказав Саулові, який покликав «усю його родину, і сьвященників, що були в Номві»; коли царські охоронці не захотіли їх торкнутися, Доік «завдав смерть вісїмдесятьом і пятьом, що носили лняне оплїччє», і «Номву, сьвященниче місто, вигубив мечем, і чоловіків і жінок, і хлопят і немовлят». Лише Авіятар утік до Давида. Ісус згадав цей епізод, коли учнів обвинувачували в порушенні суботи: Давид «увійшов до Божого дому, та поїв хлїби показнї»."
    - "Після вигнання Ноб з'являється лише в Неемієвому списку веніяминових сіл. Оскільки місце невідоме, нічого зі святилища не знайдено. Хребет гори Скопус сьогодні несе Єврейський університет і лікарню «Гадасса», з Ісавією на східному схилі та Французьким пагорбом на півночі."
  es:
    - "Nob, «ciudad de los sacerdotes», estaba a la vista de Jerusalén, por su lado norte. El asirio de Isaías, que baja marchando desde Micmas por Geba, Galim y Anatot, se detiene en Nob y agita su mano «al monte de la hija de Sión, al collado de Jerusalem», y Nehemías enumera Nob entre Anatot y Ananías entre las aldeas de Benjamín. No se ha hallado el lugar. La conjetura más común es Ras el-Mesharif, en el monte Scopus, desde donde la ciudad aparece por primera vez a la vista en el camino del norte; también se han propuesto Ras Umm et-Tala y Ras Tumeim en la misma cresta, la aldea de Isawiya debajo de ella, Qu'meh más al norte y la Colina Francesa."
    - "En tiempos de Saúl los sacerdotes de la casa de Elí servían en Nob, con el efod y los panes de la proposición delante de Jehová. Aquí vino David, huyendo solo de Saúl, a Ahimelec; el sacerdote le dio «el pan sagrado, porque allí no había otro pan que los panes de la proposición», y «la espada de Goliath el Filisteo … envuelta en un velo detrás del ephod». Doeg el edomita lo vio y lo contó a Saúl, que llamó a «toda la casa de su padre, los sacerdotes que estaban en Nob»; cuando los guardias del rey no quisieron tocarlos, Doeg «mató en aquel día ochenta y cinco varones que vestían ephod de lino», y «á Nob, ciudad de los sacerdotes, puso á cuchillo: así á hombres como á mujeres, niños y mamantes». Solo Abiatar escapó a David. Jesús lo recordó cuando acusaron a sus discípulos de quebrantar el sábado: David «entró en la casa de Dios, y comió los panes de la proposición»."
    - "Después del exilio Nob aparece solo en la lista de aldeas benjaminitas de Nehemías. Como el lugar se desconoce, no se ha hallado nada del santuario. La cresta del monte Scopus alberga hoy la Universidad Hebrea y el hospital Hadassah, con Isawiya en su ladera oriental y la Colina Francesa al norte."
  pt:
    - "Nobe, “a cidade dos sacerdotes”, ficava à vista de Jerusalém, ao norte dela. O assírio de Isaías, descendo de Micmás por Geba, Galim e Anatote, faz uma parada em Nobe e sacode a mão “contra o monte da filha de Sião, a colina de Jerusalém”, e Neemias lista Nobe entre Anatote e Ananias nas aldeias de Benjamim. O local não foi encontrado. A hipótese mais comum é Ras el-Mesharif, no Monte Scopus, de onde a cidade surge pela primeira vez à vista na estrada do norte; Ras Umm et-Tala e Ras Tumeim, na mesma crista, a aldeia de Isawiya abaixo dela, Qu'meh mais ao norte e a Colina Francesa também foram propostas."
    - "No tempo de Saul, os sacerdotes da casa de Eli serviam em Nobe, onde ficavam o éfode e os pães da proposição diante do SENHOR. Ali Davi, fugindo sozinho de Saul, chegou a Aimeleque; o sacerdote lhe deu “o pão sagrado; pois não havia outro pão ali senão os pães da proposição” e “a espada de Golias, o filisteu, … embrulhada num pano atrás do éfode”. Doegue, o edomita, contou a Saul, que chamou “toda a casa de seu pai, os sacerdotes que estavam em Nobe”; como os guardas do rei não quiseram tocá-los, Doegue “naquele dia matou oitenta e cinco homens que vestiam o éfode de linho” e “feriu Nobe, a cidade dos sacerdotes, ao fio da espada — tanto homens como mulheres, crianças e recém-nascidos”. Só Abiatar escapou para junto de Davi. Jesus lembrou o episódio quando seus discípulos foram acusados de violar o sábado: Davi “entrou na casa de Deus e comeu os pães da proposição”."
    - "Depois do exílio, Nobe aparece só na lista de Neemias das aldeias de Benjamim. Como o local é desconhecido, nada do santuário foi encontrado. A crista do Monte Scopus abriga hoje a Universidade Hebraica e o hospital Hadassa, com Isawiya na encosta leste e a Colina Francesa ao norte."
  de:
    - "Nob, „die Stadt der Priester“, stand in Sichtweite von Jerusalem auf dessen Nordseite. Jesajas Assyrer, der von Michmas über Geba, Gallim und Anatot heranzieht, macht in Nob halt und schwingt seine Hand „wider den Berg der Tochter Zion, wider den Hügel Jerusalems“, und Nehemia führt Nob zwischen Anatot und Ananja unter den Dörfern Benjamins auf. Die Stätte ist nicht gefunden. Am häufigsten vermutet man Ras el-Mescharif auf dem Skopusberg, von dem aus die Stadt auf der Straße von Norden zuerst in Sicht kommt; auch Ras Umm et-Tala und Ras Tumeim auf demselben Höhenzug, das Dorf Isawiya darunter, Qu'meh weiter nördlich und French Hill wurden vorgeschlagen."
    - "Zu Sauls Zeit dienten die Priester aus Elis Haus in Nob, wo der Efod und die Schaubrote vor dem HERRN lagen. Hierher floh David zu Ahimelech; der Priester gab ihm „von dem heiligen Brot, weil kein anderes da war denn die Schaubrote“, und „das Schwert des Philisters Goliath … gewickelt in einen Mantel hinter dem Leibrock“. Doeg, der Edomiter, sah es und meldete es Saul, der „seines Vaters ganzes Haus, die Priester, die zu Nobe waren“ rufen ließ; als die Wachen sie nicht anrühren wollten, „erschlug [Doeg] die Priester, daß des Tages starben fünfundachtzig Männer, die leinene Leibröcke trugen“, und „die Stadt der Priester, Nobe, schlug er mit der Schärfe des Schwerts, Mann und Weib, Kinder und Säuglinge“. Nur Abjatar entkam zu David. Jesus erinnerte daran, als man seine Jünger des Sabbatbruchs beschuldigte: David „in das Gotteshaus ging und aß die Schaubrote“."
    - "Nach dem Exil erscheint Nob nur noch in Nehemias Liste benjaminitischer Dörfer. Da die Stätte unbekannt ist, wurde nichts vom Heiligtum gefunden. Der Höhenzug des Skopusbergs trägt heute die Hebräische Universität und das Hadassah-Krankenhaus, mit Isawiya am Osthang und French Hill im Norden."
  fr:
    - "Nob, « ville sacerdotale », se dressait au nord, en vue de Jérusalem. L’Assyrien d’Ésaïe, qui descend de Micmasch par Guéba, Gallim et Anathoth, fait halte à Nob et menace de sa main « la montagne de la fille de Sion, la colline de Jérusalem », et Néhémie cite Nob entre Anathoth et Hanania parmi les villages de Benjamin. Le site n’a pas été trouvé. L’hypothèse la plus courante est Ras el-Mesharif, sur le mont Scopus, d’où la ville apparaît d’abord sur la route du nord ; Ras Umm et-Tala et Ras Tumeim sur la même crête, le village d’Isawiya au-dessous, Qu’meh plus au nord et French Hill ont aussi été proposés."
    - "Sous Saül, les prêtres de la maison d’Éli servaient à Nob, avec l’éphod et les pains de proposition devant l’Éternel. David, fuyant Saül, y vint seul chez Achimélec, qui lui donna « du pain consacré, car il n’y avait là d’autre pain que du pain de proposition », et « l’épée de Goliath, le Philistin … enveloppée dans un drap, derrière l’éphod ». Doëg l’Édomite le vit et le dit à Saül, qui manda « toute la maison de son père, les sacrificateurs qui étaient à Nob » ; les gardes s’y refusant, Doëg « fit mourir en ce jour quatre-vingt-cinq hommes portant l’éphod de lin », et à Nob, « ville sacerdotale », « hommes et femmes, enfants et nourrissons … tombèrent sous le tranchant de l’épée ». Seul Abiathar rejoignit David. Jésus le rappela lorsqu’on accusa ses disciples de violer le sabbat : David « entra dans la maison de Dieu, et mangea les pains de proposition »."
    - "Après l’exil, Nob n’apparaît que dans la liste des villages de Benjamin chez Néhémie. Le site étant inconnu, rien du sanctuaire n’a été trouvé. La crête du mont Scopus porte aujourd’hui l’Université hébraïque et l’hôpital Hadassah, avec Isawiya sur son versant oriental et French Hill au nord."
  it:
    - "Nob, «la città de’ sacerdoti», sorgeva in vista di Gerusalemme, sul suo lato settentrionale. L’Assiro di Isaia, che scende da Micmas per Gheba, Gallim e Anatòt, si ferma a Nob e agita il pugno «contro il monte della figlia di Sion, contro la collina di Gerusalemme», e Neemia elenca Nob tra Anatòt e Anania fra i villaggi di Beniamino. Il sito non è stato trovato. L’ipotesi più comune è Ras el-Mesharif sul Monte Scopus, da cui la città compare per la prima volta alla vista sulla strada da nord; sono stati proposti anche Ras Umm et-Tala e Ras Tumeim sulla stessa dorsale, il villaggio di Isawiya sotto di essa, Qu’meh più a nord e French Hill."
    - "Ai tempi di Saul vi servivano i sacerdoti della casa di Eli, con l’efod e i pani di presentazione davanti al Signore. Qui Davide, solo e in fuga da Saul, venne da Achimelech, che gli diede del «pane consacrato perché non v’era quivi altro pane tranne quello della presentazione» e «la spada di Goliath, il Filisteo … involta in un panno dietro all’efod». L’edomita Doeg vide e riferì a Saul, che convocò «tutta la famiglia del padre di lui, … i sacerdoti ch’erano a Nob»; poiché le guardie rifiutarono, Doeg «uccise in quel giorno ottantacinque persone che portavano l’efod di lino», e fu messa a fil di spada anche «Nob, la città de’ sacerdoti, uomini, donne, fanciulli, bambini di latte». Solo Abiatar scampò, presso Davide. Gesù lo richiamò quando i discepoli furono accusati di violare il sabato: Davide «entrò nella casa di Dio e mangiò i pani di presentazione»."
    - "Dopo l’esilio Nob compare solo nell’elenco neemiano dei villaggi beniaminiti. Poiché il sito è ignoto, del santuario non è stato trovato nulla. La dorsale del Monte Scopus ospita oggi l’Università Ebraica e l’ospedale Hadassah, con Isawiya sul versante orientale e French Hill a nord."
  pl:
    - "Nob, „miasto kapłańskie”, leżało w zasięgu wzroku od Jerozolimy, po jej północnej stronie. Asyryjczyk Izajasza, maszerując z Mikmas przez Gebę, Gallim i Anatot, zatrzymuje się w Nob i „pogrozi ręką swą górze córki Syońskiej, i pagórkowi Jeruzalemskiemu”, a Nehemiasz wymienia Nob między Anatot a Ananiaszem wśród wsi Beniamina. Miejsca nie odnaleziono. Najczęstsze przypuszczenie to Ras el-Mesharif na Górze Skopus, skąd miasto po raz pierwszy ukazuje się na drodze z północy; proponowano też Ras Umm et-Tala i Ras Tumeim na tym samym grzbiecie, wieś Isawija poniżej niego, Qu'meh dalej na północ i French Hill."
    - "Za Saula kapłani z domu Heliego służyli w Nob, gdzie przechowywano efod i kładziono przed Panem chleby pokładne. Tu przyszedł Dawid, uciekając sam przed Saulem, do Achimeleka; kapłan dał mu „chleby poświęcone; albowiem nie było tam chleba, tylko chleby pokładne” oraz „Miecz Golijata Filistyńczyka… oto jest uwiniony w sukno za efodem”. Widział to Doeg Edomita i doniósł Saulowi, który posłał, „aby przyzwano Achimelecha… i wszystkiego domu ojca jego kapłanów, którzy byli w Nobe”; gdy królewska straż nie chciała ich tknąć, Doeg „zabił onegoż dnia ośmdziesiąt i pięć mężów, którzy nosili efod lniane”, a „Nobe też miasto kapłańskie wysiekł ostrzem miecza, od męża aż do niewiasty, od małego aż do ssącego”. Uszedł tylko Abiatar, do Dawida. Jezus przypomniał to zdarzenie, gdy oskarżono uczniów o łamanie szabatu: Dawid „wszedł do domu Bożego, i chleby pokładne jadł”."
    - "Po wygnaniu Nob pojawia się tylko na liście wsi beniaminitów u Nehemiasza. Ponieważ miejsce jest nieznane, nie znaleziono nic z sanktuarium. Grzbiet Góry Skopus nosi dziś Uniwersytet Hebrajski i szpital Hadassah, z Isawiją na wschodnim zboczu i French Hill na północy."
  cs:
    - "Nob, „město kněžské“, stálo na dohled Jeruzaléma na jeho severní straně. Izajášův Asyřan, táhnoucí z Michmasu přes Gebu, Galim a Anatót, se zastaví v Nobe a pohrozí rukou „hoře dcery Sionské, pahrbku Jeruzalémskému“; Nehemjáš uvádí Nob mezi Anatótem a Ananjášem mezi vesnicemi Benjamínovými. Místo nebylo nalezeno. Nejběžnější domněnka je Ras el-Mešaref na hoře Scopus, odkud se město poprvé objeví na cestě od severu; navrhovány byly i Ras Umm et-Tala a Ras Tumeim na témž hřebeni, vesnice Isávíja pod ním, Qu'meh dále na sever a French Hill."
    - "Za Saula sloužili v Nobe kněží z domu Élí, kde byl uložen efod a před Hospodinem se kladly chleby předložení. Sem přišel David, prchající sám před Saulem, k Achimelekovi; kněz mu dal „chleby svaté; nebo nebylo tam chleba, jediné chlebové předložení“ a „Meč Goliáše Filistinského, … ten jest zde obvinutý v roucho za efodem“. Edomský Doeg to viděl a řekl Saulovi, který povolal „vší čeledi otce jeho, totiž kněží, kteříž byli v Nobe“; když se královi strážci kněží nechtěli dotknout, Doeg „zbil toho dne osmdesáte a pět mužů, kteříž nosili efod lněný“ a „Nobe také město kněžské vyhubil ostrostí meče, od muže až do ženy, od malého až do požívajícího prsí“. Jen Abjatar unikl k Davidovi. Ježíš tu událost připomněl, když byli jeho učedníci obviněni z porušení soboty: David „všel do domu Božího a chleby posvátné jedl“."
    - "Po exilu se Nob objevuje jen v Nehemjášově seznamu benjamínských vesnic. Protože místo není známo, nic ze svatyně nalezeno nebylo. Hřeben hory Scopus nese dnes Hebrejskou univerzitu a nemocnici Hadasa, s Isávíjí na východním svahu a French Hill na severu."
  nl:
    - "Nob, “de stad dezer priesters”, lag in het zicht van Jeruzalem, aan de noordkant. Jesaja’s Assyriër, die vanaf Michmas via Geba, Gallim en Anatot afdaalt, houdt halt bij Nob en beweegt zijn hand “tegen den berg der dochter van Sion, den heuvel van Jeruzalem”, en Nehemia noemt Nob tussen Anatot en Ananja onder de dorpen van Benjamin. De plaats is niet gevonden. De meest gangbare gok is Ras el-Mesharif op de Scopusberg, vanwaar de stad op de weg uit het noorden voor het eerst in zicht komt; Ras Umm et-Tala en Ras Tumeim op dezelfde rug, het dorp Isawiya eronder, Qu’meh verder noordelijk en French Hill zijn ook voorgesteld."
    - "In Sauls dagen dienden de priesters van Eli’s huis te Nob, waar de efod hing en de toonbroden voor de HEER lagen. David kwam daar, op de vlucht voor Saul, bij Achimelech; de priester gaf hem “dat heilige brood, dewijl er geen brood was dan de toonbroden”, en “het zwaard van Goliath, den Filistijn ... gewonden in een kleed, achter den efod”. Doëg de Edomiet meldde het Saul, die “zijns vaders ganse huis, de priesters, die te Nob waren” riep; toen de wachters weigerden, “doodde” Doëg “te dien dage vijf en tachtig mannen, die den linnen lijfrok droegen”, en “Hij sloeg ook Nob, de stad dezer priesters, met de scherpte des zwaards, van den man tot de vrouw, van de kinderen tot de zuigelingen”. Alleen Abjatar ontkwam naar David. Jezus noemde het toen zijn discipelen van sabbatsbreuk werden beschuldigd: “hoe hij gegaan is in het huis Gods, en de toonbroden gegeten heeft”."
    - "Na de ballingschap komt Nob alleen voor in Nehemia’s lijst van Benjaminitische dorpen. Omdat de plaats onbekend is, is er niets van het heiligdom gevonden. De rug van de Scopusberg draagt tegenwoordig de Hebreeuwse Universiteit en het Hadassah-ziekenhuis, met Isawiya op de oosthelling en French Hill in het noorden."
