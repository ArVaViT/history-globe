# Overview article (ADR 0007). Mainstream facts only; the site is unknown and the candidates on the ridge north of Jerusalem are given without choosing one.
id: nob
place: afdda14
title:
  en: "Nob"
  ru: "Номва"
  uk: "Ноб"
  es: "Nob"
  pt: "Nobe"
  de: "Nob"
  fr: "Nob"
body:
  en:
    - "Nob, “the city of the priests”, stood within sight of Jerusalem on its northern side. Isaiah's Assyrian, marching down from Michmash through Geba, Anathoth and Gallim, halts at Nob and shakes his hand “against the mount of the daughter of Zion, the hill of Jerusalem”, and Nehemiah lists Nob between Anathoth and Ananiah among the villages of Benjamin. The site has not been found. The commonest guess is Ras el-Mesharif on Mount Scopus, from which the city first comes into view on the road from the north; Ras Umm et-Tala and Ras Tumeim on the same ridge, the village of Isawiya below it, Qu'meh further north and French Hill have also been proposed."
    - "In Saul's day the priests of Eli's house served at Nob, where the ephod was kept and the shewbread was set before the LORD. Here David, fleeing Saul alone, came to Ahimelech; the priest gave him “hallowed bread: for there was no bread there but the shewbread”, and “the sword of Goliath the Philistine... wrapped in a cloth behind the ephod”. Doeg the Edomite saw it and told Saul, who summoned “all his father's house, the priests that were in Nob”; when the king's guards would not touch them, Doeg “slew on that day fourscore and five persons that did wear a linen ephod”, and “Nob, the city of the priests, smote he with the edge of the sword, both men and women, children and sucklings”. Only Abiathar escaped to David. Jesus recalled the episode when his disciples were accused of breaking the sabbath: David “entered into the house of God, and did eat the shewbread”."
    - "After the exile Nob appears only in Nehemiah's list of Benjaminite villages. Since the site is unknown, nothing of the sanctuary has been found. The ridge of Mount Scopus today carries the Hebrew University and the Hadassah hospital, with Isawiya on its eastern slope and French Hill to the north."
  ru:
    - "Номва, «город священников», стояла в виду Иерусалима с северной стороны. Об ассирийце у Исаии, спускающемся от Михмаса через Геву, Анафоф и Галим, сказано: «Еще день простоит он в Нове; грозит рукою своею горе Сиону, холму Иерусалимскому», а Неемия называет Нов (так у Исаии и Неемии зовётся Номва) между Анафофом и Ананией среди селений Вениамина. Место не найдено. Чаще всего называют Рас-эль-Мешариф на горе Скопус, откуда город впервые открывается путнику с севера; предлагали и Рас-Умм-эт-Талу и Рас-Тумейм на том же гребне, деревню Исавию под ним, Кумэ дальше к северу и Френч-Хилл."
    - "Во дни Саула священники дома Илия служили в Номве, где хранился ефод и пред Господом лежали хлебы предложения. Сюда пришёл Давид, один бежавший от Саула, к Ахимелеху; священник дал ему «священного хлеба; ибо не было у него хлеба, кроме хлебов предложения», и «меч Голиафа Филистимлянина... завернутый в одежду, позади ефода». Доик Идумеянин видел это и донёс Саулу, который призвал «весь дом отца его, священников, что в Номве»; когда царские слуги не подняли на них руки, Доик «умертвил в тот день восемьдесят пять мужей, носивших льняной ефод», «и Номву, город священников, поразил мечом; и мужчин и женщин, и юношей и младенцев». Спасся к Давиду один Авиафар. Иисус напомнил этот случай, когда учеников обвинили в нарушении субботы: Давид «вошел в дом Божий и ел хлебы предложения»."
    - "После плена Номва упоминается лишь в списке вениамитских селений у Неемии. Поскольку место неизвестно, от святилища ничего не найдено. На гребне горы Скопус сегодня стоят Еврейский университет и больница Хадасса, на восточном склоне — Исавия, к северу — Френч-Хилл."
  uk:
    - "Ноб, «сьвященниче місто», стояв на виду від Єрусалима з його північного боку. Ассирієць у Ісаї, що йде вниз від Міхмаса через Гебу, Анатот і Галлім, зупиняється в Нобі та погрожує рукою «Сионові, узгіррю Ерусалимському», а Неемія перелічує Ноб між Анатотом і Ананією серед сіл Веніяміна. Місце не знайдено. Найпоширеніше припущення — Рас-ель-Мешаріф на горі Скопус, з якої на дорозі з півночі вперше відкривається вид на місто; пропонували також Рас-Умм-ет-Тала й Рас-Тумейм на тому самому хребті, село Ісавія під ним, Кумех далі на північ і Французький пагорб."
    - "За днів Саула священики дому Ілія служили в Нобі, де зберігався ефод і де перед Господом клали показні хліби. Сюди Давид, утікаючи сам від Саула, прийшов до Ахімелеха; священик дав йому «сьвященного хлїба, не було бо иншого хлїба, як показний хлїб», а також «меч Филистія Голіята ... обгорнутий одежею, позад ефода». Едомитянин Доік побачив це й сказав Саулові, який покликав «усю його родину, і сьвященників, що були в Номві»; коли царські охоронці не захотіли їх торкнутися, Доік «завдав смерть вісїмдесятьом і пятьом, що носили лняне оплїччє», і «Номву, сьвященниче місто, вигубив мечем, і чоловіків і жінок, і хлопят і немовлят». Лише Авіятар утік до Давида. Ісус згадав цей епізод, коли учнів обвинувачували в порушенні суботи: Давид «увійшов до Божого дому, та поїв хлїби показнї»."
    - "Після вигнання Ноб з'являється лише в Неемієвому списку веніяминових сіл. Оскільки місце невідоме, нічого зі святилища не знайдено. Хребет гори Скопус сьогодні несе Єврейський університет і лікарню «Гадасса», з Ісавією на східному схилі та Французьким пагорбом на півночі."
  es:
    - "Nob, «ciudad de los sacerdotes», estaba a la vista de Jerusalén, por su lado norte. El asirio de Isaías, que baja marchando desde Micmas por Geba, Anatot y Galim, se detiene en Nob y agita su mano «al monte de la hija de Sión, al collado de Jerusalem», y Nehemías enumera Nob entre Anatot y Ananías entre las aldeas de Benjamín. No se ha hallado el lugar. La conjetura más común es Ras el-Mesharif, en el monte Scopus, desde donde la ciudad aparece por primera vez a la vista en el camino del norte; también se han propuesto Ras Umm et-Tala y Ras Tumeim en la misma cresta, la aldea de Isawiya debajo de ella, Qu'meh más al norte y la Colina Francesa."
    - "En tiempos de Saúl los sacerdotes de la casa de Elí servían en Nob, con el efod y los panes de la proposición delante de Jehová. Aquí vino David, huyendo solo de Saúl, a Ahimelec; el sacerdote le dio «el pan sagrado, porque allí no había otro pan que los panes de la proposición», y «la espada de Goliath el Filisteo … envuelta en un velo detrás del ephod». Doeg el edomita lo vio y lo contó a Saúl, que llamó a «toda la casa de su padre, los sacerdotes que estaban en Nob»; cuando los guardias del rey no quisieron tocarlos, Doeg «mató en aquel día ochenta y cinco varones que vestían ephod de lino», y «á Nob, ciudad de los sacerdotes, puso á cuchillo: así á hombres como á mujeres, niños y mamantes». Solo Abiatar escapó a David. Jesús lo recordó cuando acusaron a sus discípulos de quebrantar el sábado: David «entró en la casa de Dios, y comió los panes de la proposición»."
    - "Después del exilio Nob aparece solo en la lista de aldeas benjaminitas de Nehemías. Como el lugar se desconoce, no se ha hallado nada del santuario. La cresta del monte Scopus alberga hoy la Universidad Hebrea y el hospital Hadassah, con Isawiya en su ladera oriental y la Colina Francesa al norte."
  pt:
    - "Nobe, “a cidade dos sacerdotes”, ficava à vista de Jerusalém, ao norte dela. O assírio de Isaías, descendo de Micmás por Geba, Anatote e Galim, faz uma parada em Nobe e sacode a mão “contra o monte da filha de Sião, a colina de Jerusalém”, e Neemias lista Nobe entre Anatote e Ananias nas aldeias de Benjamim. O local não foi encontrado. A hipótese mais comum é Ras el-Mesharif, no Monte Scopus, de onde a cidade surge pela primeira vez à vista na estrada do norte; Ras Umm et-Tala e Ras Tumeim, na mesma crista, a aldeia de Isawiya abaixo dela, Qu'meh mais ao norte e a Colina Francesa também foram propostas."
    - "No tempo de Saul, os sacerdotes da casa de Eli serviam em Nobe, onde ficavam o éfode e os pães da proposição diante do SENHOR. Ali Davi, fugindo sozinho de Saul, chegou a Aimeleque; o sacerdote lhe deu “o pão sagrado; pois não havia outro pão ali senão os pães da proposição” e “a espada de Golias, o filisteu, … embrulhada num pano atrás do éfode”. Doegue, o edomita, contou a Saul, que chamou “toda a casa de seu pai, os sacerdotes que estavam em Nobe”; como os guardas do rei não quiseram tocá-los, Doegue “naquele dia matou oitenta e cinco homens que vestiam o éfode de linho” e “feriu Nobe, a cidade dos sacerdotes, ao fio da espada — tanto homens como mulheres, crianças e recém-nascidos”. Só Abiatar escapou para junto de Davi. Jesus lembrou o episódio quando seus discípulos foram acusados de violar o sábado: Davi “entrou na casa de Deus e comeu os pães da proposição”."
    - "Depois do exílio, Nobe aparece só na lista de Neemias das aldeias de Benjamim. Como o local é desconhecido, nada do santuário foi encontrado. A crista do Monte Scopus abriga hoje a Universidade Hebraica e o hospital Hadassa, com Isawiya na encosta leste e a Colina Francesa ao norte."
  de:
    - "Nob, „die Stadt der Priester“, stand in Sichtweite von Jerusalem auf dessen Nordseite. Jesajas Assyrer, der von Michmas über Geba, Anatot und Gallim heranzieht, macht in Nob halt und schwingt seine Hand „wider den Berg der Tochter Zion, wider den Hügel Jerusalems“, und Nehemia führt Nob zwischen Anatot und Ananja unter den Dörfern Benjamins auf. Die Stätte ist nicht gefunden. Am häufigsten vermutet man Ras el-Mescharif auf dem Skopusberg, von dem aus die Stadt auf der Straße von Norden zuerst in Sicht kommt; auch Ras Umm et-Tala und Ras Tumeim auf demselben Höhenzug, das Dorf Isawiya darunter, Qu'meh weiter nördlich und French Hill wurden vorgeschlagen."
    - "Zu Sauls Zeit dienten die Priester aus Elis Haus in Nob, wo der Efod und die Schaubrote vor dem HERRN lagen. Hierher floh David zu Ahimelech; der Priester gab ihm „von dem heiligen Brot, weil kein anderes da war denn die Schaubrote“, und „das Schwert des Philisters Goliath … gewickelt in einen Mantel hinter dem Leibrock“. Doeg, der Edomiter, sah es und meldete es Saul, der „seines Vaters ganzes Haus, die Priester, die zu Nobe waren“ rufen ließ; als die Wachen sie nicht anrühren wollten, „erschlug [Doeg] die Priester, daß des Tages starben fünfundachtzig Männer, die leinene Leibröcke trugen“, und „die Stadt der Priester, Nobe, schlug er mit der Schärfe des Schwerts, Mann und Weib, Kinder und Säuglinge“. Nur Abjatar entkam zu David. Jesus erinnerte daran, als man seine Jünger des Sabbatbruchs beschuldigte: David „in das Gotteshaus ging und aß die Schaubrote“."
    - "Nach dem Exil erscheint Nob nur noch in Nehemias Liste benjaminitischer Dörfer. Da die Stätte unbekannt ist, wurde nichts vom Heiligtum gefunden. Der Höhenzug des Skopusbergs trägt heute die Hebräische Universität und das Hadassah-Krankenhaus, mit Isawiya am Osthang und French Hill im Norden."
  fr:
    - "Nob, « ville sacerdotale », se dressait au nord, en vue de Jérusalem. L’Assyrien d’Ésaïe, qui descend de Micmasch par Guéba, Anathoth et Gallim, fait halte à Nob et menace de sa main « la montagne de la fille de Sion, la colline de Jérusalem », et Néhémie cite Nob entre Anathoth et Hanania parmi les villages de Benjamin. Le site n’a pas été trouvé. L’hypothèse la plus courante est Ras el-Mesharif, sur le mont Scopus, d’où la ville apparaît d’abord sur la route du nord ; Ras Umm et-Tala et Ras Tumeim sur la même crête, le village d’Isawiya au-dessous, Qu’meh plus au nord et French Hill ont aussi été proposés."
    - "Sous Saül, les prêtres de la maison d’Éli servaient à Nob, avec l’éphod et les pains de proposition devant l’Éternel. David, fuyant Saül, y vint seul chez Achimélec, qui lui donna « du pain consacré, car il n’y avait là d’autre pain que du pain de proposition », et « l’épée de Goliath, le Philistin … enveloppée dans un drap, derrière l’éphod ». Doëg l’Édomite le vit et le dit à Saül, qui manda « toute la maison de son père, les sacrificateurs qui étaient à Nob » ; les gardes s’y refusant, Doëg « fit mourir en ce jour quatre-vingt-cinq hommes portant l’éphod de lin », et à Nob, « ville sacerdotale », « hommes et femmes, enfants et nourrissons … tombèrent sous le tranchant de l’épée ». Seul Abiathar rejoignit David. Jésus le rappela lorsqu’on accusa ses disciples de violer le sabbat : David « entra dans la maison de Dieu, et mangea les pains de proposition »."
    - "Après l’exil, Nob n’apparaît que dans la liste des villages de Benjamin chez Néhémie. Le site étant inconnu, rien du sanctuaire n’a été trouvé. La crête du mont Scopus porte aujourd’hui l’Université hébraïque et l’hôpital Hadassah, avec Isawiya sur son versant oriental et French Hill au nord."
