# Overview article (ADR 0007). Mainstream facts only; the southern basin is given as the usual view and the northern alternative is named; the events of Genesis 14 are not dated.
id: valley-of-siddim
place: a4a5cce
title:
  en: "Valley of Siddim"
  ru: "Сиддим"
  uk: "Долина Сиддим"
  es: "Valle de Sidim"
  pt: "Vale de Sidim"
  de: "Siddimtal"
  fr: "Vallée de Siddim"
  pl: "Dolina Siddim"
  it: "Valle di Siddim"
  nl: "Dal van Siddim"
  cs: "Siddimské údolí"
body:
  en:
    - "The vale of Siddim is the battlefield of Genesis 14, “which is the salt sea”: the writer explains that the valley of his story lay where the Dead Sea was in his own day. Most readers have therefore sought it in the shallow southern basin of the sea, south of the Lisan peninsula, which was only a few metres deep and is known from geological study to have been dry land in some periods and flooded in others. The “slimepits” of the valley fit the place: the Dead Sea was famous in antiquity for the lumps of bitumen that rose from its bed, Josephus calls it Lake Asphaltitis, and Diodorus describes the Nabateans harvesting the asphalt from rafts and selling it to Egypt. The meaning of the name Siddim is unknown. Those who put Sodom north of the Dead Sea, at Tall el-Hammam, look for the valley there instead; the question is tied to that of the cities."
    - "“All these were joined together in the vale of Siddim, which is the salt sea.” Four kings from the east, led by Chedorlaomer of Elam, had held the cities of the plain for twelve years; in the fourteenth they came back, sweeping down the east of the Jordan and round by the south, and “there went out the king of Sodom, and the king of Gomorrah, and the king of Admah, and the king of Zeboiim, and the king of Bela (the same is Zoar;) and they joined battle with them in the vale of Siddim”. The five lost: “the vale of Siddim was full of slimepits; and the kings of Sodom and Gomorrah fled, and fell there; and they that remained fled to the mountain”. The victors took the goods of Sodom and Gomorrah and Lot with them, and Abram pursued them to Dan and beyond Damascus, brought Lot back, and met Melchizedek on his return. The valley is never mentioned again."
    - "The southern basin today has dried out as the sea has fallen, and is largely occupied by the evaporation ponds of the potash works of Israel and Jordan; Mount Sodom, a ridge of rock salt, stands on its western shore."
  ru:
    - "Долина Сиддим — поле битвы 14-й главы Бытия, «где ныне море Соленое»: рассказчик поясняет, что долина его повествования лежала там, где в его дни было Мёртвое море. Поэтому большинство читателей искали её в мелком южном бассейне моря, южнее полуострова Лисан, глубина которого была всего несколько метров и который, как показали геологи, в одни эпохи был сушей, в другие — заливался водой. «Смоляные ямы» долины подходят к месту: Мёртвое море славилось в древности кусками битума, всплывавшими со дна, Иосиф Флавий зовёт его Асфальтовым озером, а Диодор описывает, как набатеи собирали асфальт с плотов и продавали в Египет. Значение имени Сиддим неизвестно. Те, кто помещает Содом к северу от Мёртвого моря, в Талль-эль-Хаммаме, ищут долину там; вопрос связан с вопросом о городах."
    - "«Все сии соединились в долине Сиддим, где ныне море Соленое». Четыре царя с востока во главе с Кедорлаомером Еламским двенадцать лет держали города долины; на четырнадцатый они вернулись, пройдя восточнее Иордана и обогнув с юга, «и вышли царь Содомский, царь Гоморрский, царь Адмы, царь Севоимский и царь Белы, которая есть Сигор; и вступили в сражение с ними в долине Сиддим». Пятеро проиграли: «В долине же Сиддим было много смоляных ям. И цари Содомский и Гоморрский, обратившись в бегство, упали в них, а остальные убежали в горы». Победители увели имущество Содома и Гоморры и Лота с ними, а Аврам гнался за ними до Дана и за Дамаск, вернул Лота и на обратном пути встретил Мелхиседека. Больше долина не упоминается."
    - "Южный бассейн сегодня обсох с падением уровня моря и по большей части занят испарительными прудами калийных заводов Израиля и Иордании; на его западном берегу стоит гора Содом — гряда каменной соли."
  uk:
    - "Долина Сиддим — поле битви Буття 14, «се єсть теперенькі Море Солоне»: автор пояснює, що долина його розповіді лежала там, де в його день було Мертве море. Тому більшість читачів шукали її в мілкому південному басейні моря, на південь від півострова Лісан, який був завглибшки лише кілька метрів і, як відомо з геологічних досліджень, у деякі періоди був сушею, а в інші затоплений. Ями, якими була повна долина, пасують до місця: Мертве море в давнину славилося грудками бітуму, що піднімалися з його дна, Йосиф Флавій називає його Асфальтовим озером, а Діодор описує набатеїв, що збирають асфальт з плотів і продають його до Єгипту. Значення назви Сиддим невідоме. Ті, хто ставить Содом на північ від Мертвого моря, в Телль-ель-Хаммамі, шукають долину там; питання пов’язане з питанням міст."
    - "«Всї вони змовились ізійтись на Сиддим-долинї, се єсть теперенькі Море Солоне». Чотири царі зі сходу, на чолі з Кедорлаомером Еламським, дванадцять років тримали міста рівнини; на чотирнадцятому вони повернулися, прокотившись на схід від Йордану й навколо з півдня, і «Вийшов же царь Содомський, і царь Гоморський, і царь Адмейський, і царь Зебоїмський, і царь Белїйський чи Сигорський, та й постали проти них на Сиддим-долинї». П’ятеро програли: «На Сиддим же долинї та було багацько ям. І побігли царі Содомський та Гоморський та й попадали туди, а ті, що зістались, побігли в гори». Переможці забрали добро Содому й Гоморри і Лота з ним, а Аврам погнався за ними до Дана й далі за Дамаск, повернув Лота й зустрів Мелхиседека на зворотному шляху. Долина більше не згадується."
    - "Південний басейн нині висох, коли море впало, і здебільшого зайнятий випарними ставками калійних заводів Ізраїлю та Йорданії; гора Содом, гряда кам’яної солі, стоїть на його західному березі."
  es:
    - "El valle de Sidim es el campo de batalla de Génesis 14, «que es el mar salado»: el autor explica que el valle de su relato estaba donde se hallaba el mar Muerto en su tiempo. La mayoría de los lectores lo busca, por tanto, en la poco profunda cuenca meridional del mar, al sur de la península de Lisan, de solo unos pocos metros de profundidad, que según el estudio geológico fue tierra seca en unos períodos e inundada en otros. Los «pozos de betún» del valle encajan con el lugar: el mar Muerto era famoso en la Antigüedad por los trozos de betún que subían de su lecho, Josefo lo llama lago Asfaltites, y Diodoro describe a los nabateos recogiendo el asfalto desde balsas y vendiéndolo a Egipto. Se desconoce el significado del nombre Sidim. Quienes sitúan Sodoma al norte del mar Muerto, en Tall el-Hammam, buscan allí el valle; la cuestión está ligada a la de las ciudades."
    - "«Todos estos se juntaron en el valle de Siddim, que es el mar salado». Cuatro reyes del este, encabezados por Quedorlaomer de Elam, habían dominado las ciudades de la llanura durante doce años; en el decimocuarto volvieron, barriendo el este del Jordán y rodeando por el sur, y «salió el rey de Sodoma, y el rey de Gomorra, y el rey de Adma, y el rey de Zeboim, y el rey de Bela, que es Zoar, y ordenaron contra ellos batalla en el valle de Siddim». Los cinco perdieron: «el valle de Siddim estaba lleno de pozos de betún: y huyeron el rey de Sodoma y el de Gomorra, y cayeron allí; y los demás huyeron al monte». Los vencedores se llevaron los bienes de Sodoma y Gomorra y a Lot, y Abram los persiguió hasta Dan y más allá de Damasco, trajo de vuelta a Lot y se encontró con Melquisedec a su regreso. El valle no se menciona de nuevo."
    - "La cuenca meridional se ha secado hoy al descender el mar, y está ocupada en gran parte por las balsas de evaporación de las plantas de potasa de Israel y Jordania; el monte Sodoma, una cresta de sal gema, se alza en su orilla occidental."
  pt:
    - "O vale de Sidim é o campo de batalha de Gênesis 14, “também chamado de Mar Salgado”: o autor explica que o vale de sua história ficava onde, em seu próprio tempo, estava o Mar Morto. A maioria dos leitores o procurou, portanto, na rasa bacia sul do mar, ao sul da península de Lisan, que tinha apenas alguns metros de profundidade e se sabe, por estudos geológicos, ter sido terra seca em alguns períodos e inundada em outros. Os “poços de betume” do vale combinam com o lugar: o Mar Morto era famoso na Antiguidade pelos blocos de betume que subiam de seu leito, Josefo o chama de lago Asfaltites, e Diodoro descreve os nabateus colhendo o asfalto de balsas e vendendo-o ao Egito. O sentido do nome Sidim é desconhecido. Os que põem Sodoma ao norte do Mar Morto, em Tall el-Hammam, procuram ali o vale; a questão está ligada à das cidades."
    - "“Todos estes se juntaram no vale de Sidim (também chamado de Mar Salgado).” Quatro reis do leste, liderados por Quedorlaomer de Elão, dominavam as cidades da planície havia doze anos; no décimo quarto voltaram, varrendo o leste do Jordão e contornando pelo sul, e “O rei de Sodoma, o rei de Gomorra, o rei de Admá, o rei de Zeboim e o rei de Belá (também chamada Zoar) saíram; e se colocaram em ordem de batalha contra eles no vale de Sidim”. Os cinco perderam: “o vale de Sidim era cheio de poços de betume; e os reis de Sodoma e de Gomorra fugiram, e alguns caíram ali. Os que restaram fugiram para os montes”. Os vencedores levaram os bens de Sodoma e Gomorra e Ló, e Abrão os perseguiu até Dã e além de Damasco, trouxe Ló de volta e encontrou Melquisedeque ao regressar. O vale nunca mais é mencionado."
    - "A bacia sul hoje secou com a queda do mar e é ocupada em grande parte pelos tanques de evaporação das fábricas de potássio de Israel e da Jordânia; o Monte Sodoma, uma serra de sal-gema, ergue-se em sua margem ocidental."
  de:
    - "Das Siddimtal ist das Schlachtfeld von Genesis 14, „wo nun das Salzmeer ist“: Der Verfasser erklärt, dass das Tal seiner Erzählung dort lag, wo zu seiner Zeit das Tote Meer war. Die meisten Leser haben es daher im flachen südlichen Becken des Meeres gesucht, südlich der Lisan-Halbinsel, das nur wenige Meter tief war und geologisch in manchen Perioden als trockenes Land, in anderen als überflutet bekannt ist. Die „Erdharzgruben“ des Tals passen zu dem Ort: Das Tote Meer war in der Antike berühmt für die Bitumenklumpen, die von seinem Grund aufstiegen, Josephus nennt es den Asphaltsee, und Diodor beschreibt, wie die Nabatäer Asphalt von Flößen aus einsammelten und nach Ägypten verkauften. Die Bedeutung des Namens Siddim ist unbekannt. Wer Sodom nördlich des Toten Meeres bei Tall el-Hammam ansetzt, sucht das Tal stattdessen dort; die Frage hängt an der der Städte."
    - "„Diese kamen alle zusammen in das Tal Siddim, wo nun das Salzmeer ist.“ Vier Könige aus dem Osten, angeführt von Kedorlaomer von Elam, hatten die Städte der Ebene zwölf Jahre beherrscht; im vierzehnten kamen sie zurück, fegten östlich des Jordans herab und im Süden herum, und „da zogen aus der König von Sodom, der König von Gomorra, der König von Adama, der König von Zeboim und der König von Bela, das Zoar heißt, und rüsteten sich, zu streiten im Tal Siddim“. Die fünf verloren: „Das Tal Siddim aber hatte viel Erdharzgruben; und die Könige von Sodom und Gomorra wurden in die Flucht geschlagen und fielen da hinein, und was übrig blieb, floh auf das Gebirge“. Die Sieger nahmen die Habe von Sodom und Gomorra und Lot mit, und Abram jagte ihnen bis Dan und über Damaskus hinaus nach, brachte Lot zurück und traf bei der Rückkehr Melchisedek. Das Tal wird nie wieder erwähnt."
    - "Das südliche Becken ist heute ausgetrocknet, da das Meer gesunken ist, und wird großenteils von den Verdunstungsbecken der Kaliwerke Israels und Jordaniens eingenommen; der Berg Sodom, ein Kamm aus Steinsalz, steht an seinem Westufer."
  fr:
    - "La vallée de Siddim est le champ de bataille de Genèse 14, « qui est la mer Salée » : l’auteur explique que la vallée de son récit se trouvait là où était la mer Morte de son temps. La plupart des lecteurs l’ont donc cherchée dans le bassin sud de la mer, au sud de la péninsule de la Lisan, profond de quelques mètres seulement et que la géologie montre tantôt à sec, tantôt inondé. Les « puits de bitume » de la vallée conviennent au lieu : la mer Morte était célèbre dans l’Antiquité pour les blocs de bitume qui montaient de son fond, Josèphe l’appelle lac Asphaltite, et Diodore décrit les Nabatéens récoltant l’asphalte depuis des radeaux et le vendant à l’Égypte. Le sens du nom Siddim est inconnu. Ceux qui placent Sodome au nord de la mer Morte, à Tall el-Hammam, y cherchent plutôt la vallée ; la question est liée à celle des villes."
    - "« Ces derniers s’assemblèrent tous dans la vallée de Siddim, qui est la mer Salée. » Quatre rois de l’est, conduits par Kedorlaomer d’Élam, tenaient les villes de la plaine depuis douze ans ; la quatorzième année, ils revinrent, balayant l’est du Jourdain puis le sud, et « s’avancèrent le roi de Sodome, le roi de Gomorrhe, le roi d’Adma, le roi de Tseboïm, et le roi de Béla, qui est Tsoar ; et ils se rangèrent en bataille contre eux, dans la vallée de Siddim ». Les cinq perdirent : « La vallée de Siddim était couverte de puits de bitume ; le roi de Sodome et celui de Gomorrhe prirent la fuite, et y tombèrent ; le reste s’enfuit vers la montagne ». Les vainqueurs emportèrent les biens de Sodome et de Gomorrhe et Lot avec eux, et Abram les poursuivit jusqu’à Dan et au-delà de Damas, ramena Lot et rencontra Melchisédek à son retour. Elle n’est plus mentionnée."
    - "Le bassin sud est aujourd’hui asséché avec la baisse de la mer et en grande partie occupé par les bassins d’évaporation des usines de potasse d’Israël et de Jordanie ; le mont Sodome, crête de sel gemme, se dresse sur sa rive ouest."
  pl:
    - "Dolina Siddim jest polem bitwy z Rdz 14, „ta jest teraz morzem słonem”: autor wyjaśnia, że dolina jego opowieści leżała tam, gdzie w jego czasach było Morze Martwe. Większość czytelników szukała więc jej w płytkim południowym basenie morza, na południe od półwyspu Lisan, który miał zaledwie kilka metrów głębokości i jak wiadomo z badań geologicznych bywał w niektórych okresach lądem, a w innych zalany. W dolinie, jak czytamy, „było wiele studzien iłowatych”, i to pasuje do miejsca: Morze Martwe słynęło w starożytności z brył bitumu wynurzających się z jego dna, Józef Flawiusz nazywa je Jeziorem Asfaltowym, a Diodor opisuje Nabatejczyków zbierających asfalt z tratw i sprzedających go do Egiptu. Znaczenie nazwy Siddim jest nieznane. Ci, którzy umieszczają Sodomę na północ od Morza Martwego, w Tall el-Hammam, szukają doliny tam; sprawa jest związana z kwestią miast."
    - "„Wszyscy ci zaciągnęli się w dolinę Syddym, ta jest teraz morzem słonem.” Czterej królowie ze wschodu, na czele z Kedorlaomerem z Elamu, trzymali miasta równiny przez dwanaście lat; w czternastym wrócili, przetaczając się przez wschód od Jordanu i wokół od południa, a „Tedy wyciągnął król Sodomski, i król Gomorski, i król Adamacki, i król Zeboimski, i król Belamski, to jest Zoarski, i uszykowali się ku bitwie przeciwko im w dolinie Syddym”. Pięciu przegrało: „A w onej dolinie Syddym, było wiele studzien iłowatych; i uciekali król Sodomski i Gomorski, a polegli tam, a którzy zostali, na górę uciekli”. Zwycięzcy zabrali dobra Sodomy i Gomory oraz Lota, a Abram ścigał ich aż do Dan i za Damaszek, sprowadził Lota z powrotem i spotkał Melchizedeka po powrocie. Dolina nie jest nigdy wspomniana ponownie."
    - "Południowy basen jest dziś wysuszony, gdy morze opadło, i w dużej mierze zajęty przez baseny odparowujące zakładów potażu Izraela i Jordanii; Góra Sodoma, grzbiet soli kamiennej, stoi na jego zachodnim brzegu."
  it:
    - "La valle di Siddim è il campo di battaglia di Genesi 14, «ch’è il Mar salato»: lo scrittore spiega che la valle del suo racconto si trovava dove ai suoi giorni era il Mar Morto. La maggior parte dei lettori l’ha dunque cercata nel basso bacino meridionale del mare, a sud della penisola di Lisan, profondo solo pochi metri e noto dagli studi geologici per essere stato terraferma in alcuni periodi e sommerso in altri. I «pozzi di bitume» della valle si adattano al luogo: il Mar Morto era famoso nell’antichità per i blocchi di bitume che salivano dal fondo, Giuseppe Flavio lo chiama lago Asfaltite, e Diodoro descrive i Nabatei che raccoglievano l’asfalto da zattere e lo vendevano all’Egitto. Il significato del nome Siddim è ignoto. Chi pone Sodoma a nord del Mar Morto, a Tall el-Hammam, cerca lì la valle; la questione è legata a quella delle città."
    - "«Tutti questi ultimi si radunarono nella valle di Siddim, ch’è il Mar salato.» Quattro re dell’oriente, guidati da Chedorlaomer di Elam, avevano tenuto le città della piana per dodici anni; nel quattordicesimo tornarono, scendendo a est del Giordano e girando da sud, e «il re di Sodoma, il re di Gomorra, il re di Adma, il re di Tseboim e il re di Bela, che è Tsoar, uscirono e si schierarono in battaglia contro quelli, nella valle di Siddim». I cinque persero: «la valle di Siddim era piena di pozzi di bitume; e i re di Sodoma e di Gomorra si dettero alla fuga e vi caddero dentro; quelli che scamparono fuggirono al monte». I vincitori presero con sé i beni di Sodoma e Gomorra e Lot, e Abram li inseguì fino a Dan e oltre Damasco, riportò Lot e incontrò Melchisedek al ritorno. La valle non è più menzionata."
    - "Il bacino meridionale si è oggi prosciugato con l’abbassarsi del mare ed è in gran parte occupato dalle vasche di evaporazione degli stabilimenti di potassa di Israele e di Giordania; il Monte Sodoma, un crinale di salgemma, sorge sulla sua riva occidentale."
  nl:
    - "Het dal van Siddim is het slagveld van Genesis 14, “dat is de Zoutzee”: de schrijver verklaart dat het dal van zijn verhaal lag waar in zijn eigen tijd de Dode Zee was. De meeste lezers hebben het daarom gezocht in het ondiepe zuidelijke bekken van de zee, ten zuiden van het schiereiland Lisan, dat slechts enkele meters diep was en volgens geologisch onderzoek soms droog land en soms overstroomd. De “lijmputten” van het dal passen bij de plek: de Dode Zee was in de oudheid beroemd om de brokken bitumen die van haar bodem opstegen, Flavius Josephus noemt haar het Asfaltmeer, en Diodorus beschrijft hoe de Nabateeërs het asfalt vanaf vlotten oogstten en aan Egypte verkochten. De betekenis van de naam Siddim is onbekend. Wie Sodom ten noorden van de Dode Zee plaatst, bij Tall el-Hammam, zoekt het dal daar; de vraag hangt samen met die van de steden."
    - "“Deze allen voegden zich samen in het dal Siddim, dat is de Zoutzee.” Vier koningen uit het oosten, aangevoerd door Kedorlaomer van Elam, hielden de steden van de vlakte twaalf jaar; in het veertiende kwamen zij terug, trokken ten oosten van de Jordaan naar beneden en om het zuiden heen, en “toog de koning van Sodom uit, en de koning van Gomorra, en de koning van Adama, en de koning van Zeboim, en de koning van Bela, dat is Zoar; en zij stelden tegen hen slagorden in het dal Siddim”. De vijf verloren: “Het dal nu van Siddim was vol lijmputten; en de koningen van Sodom en Gomorra vluchtten, en vielen aldaar; en de overgeblevenen vluchtten naar het gebergte”. De overwinnaars namen de goederen van Sodom en Gomorra en Lot mee, en Abram achtervolgde hen tot Dan en voorbij Damascus, bracht Lot terug en ontmoette op de terugweg Melchizedek. Het dal wordt verder niet genoemd."
    - "Het zuidelijke bekken is tegenwoordig drooggevallen doordat de zee is gezakt en wordt grotendeels ingenomen door de verdampingsvijvers van de potasfabrieken van Israël en Jordanië; de Sodomberg, een rug van steenzout, staat aan de westoever."
  cs:
    - "Siddimské údolí je bojiště z Genesis 14, o němž se praví: „to jest již moře solné“: pisatel vysvětluje, že údolí jeho příběhu leželo tam, kde bylo Mrtvé moře za jeho dnů. Většina čtenářů je proto hledala v mělké jižní pánvi moře, jižně od poloostrova Lisán, která byla hluboká jen několik metrů a z geologických studií je známo, že byla v některých obdobích souší a v jiných zaplavena. K místu se hodí, že v údolí „bylo mnoho studnic klejovatých“: Mrtvé moře bylo ve starověku proslulé hrudami bitumenu, které se zvedaly z jeho dna, Josephus je nazývá jezero Asfaltitis a Diodóros popisuje Nabatejce, jak sbírají asfalt z vorů a prodávají jej do Egypta. Význam jména Siddim není znám. Ti, kdo kladou Sodomu na sever od Mrtvého moře, do Tall el-Hammámu, hledají údolí tam; otázka je spjata s otázkou měst."
    - "„Všickni tito sjeli se do údolí Siddim, to jest již moře solné.“ Čtyři králové z východu, vedení Kedorlaomerem z Élamu, drželi města roviny dvanáct let; ve čtrnáctém se vrátili, přehnali se východně od Jordánu a dokola z jihu, a „vytáhl král Sodomský, a král Gomorský, a král Adamatský, a král Seboimský, a král Bélamský, to jest Ségorský, a sšikovali se proti nim k bitvě v údolí Siddim“. Pět králů prohrálo: „V údolí pak Siddim bylo mnoho studnic klejovatých. I utíkajíce král Sodomský a Gomorský, padli tam; a kteří pozůstali, utekli na hory“. Vítězové vzali zboží Sodomy a Gomory i Lota s sebou a Abram je pronásledoval k Danu a za Damašek, přivedl Lota zpět a při návratu se setkal s Melchisedekem. Údolí se už nikdy nezmiňuje."
    - "Jižní pánev dnes vyschla, jak moře kleslo, a z velké části ji zabírají odpařovací nádrže potašových závodů Izraele a Jordánska; Har Sedom (Hora Sodom), hřbet kamenné soli, stojí na jejím západním břehu."
