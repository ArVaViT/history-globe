body:
  en:
    - "The wilderness of Paran is the great desert between the mountain of Sinai and the hill country of Canaan: the bare limestone plateau of the central Sinai peninsula, and in the usual view the Negeb highlands as well, with Kadesh-barnea on its north-eastern edge. Deuteronomy calls the way through it “all that great and terrible wilderness”. In Genesis the four kings swept the Horites of Seir “unto El-paran, which is by the wilderness”, and Ishmael, sent away by Abraham, “dwelt in the wilderness of Paran: and his mother took him a wife out of the land of Egypt”."
    - "Israel crossed Paran after Sinai: they set out from the wilderness of Sinai, “and the cloud rested in the wilderness of Paran”; they camped there after Hazeroth, and from it Moses sent the twelve spies into Canaan, who after forty days came back “unto the wilderness of Paran, to Kadesh”. The people's refusal to go up condemned the generation to the desert. Deuteronomy opens with Moses speaking to Israel “between Paran, and Tophel, and Laban, and Hazeroth”, and in the blessing of Moses the LORD “shined forth from mount Paran”; Habakkuk too sings that “God came from Teman, and the Holy One from mount Paran”. Which mountain is meant is unknown. After Samuel's death David “went down to the wilderness of Paran”, where the Greek Bible reads Maon, and Hadad the Edomite, fleeing Joab, passed through Paran, took men from it and went down to Egypt."
    - "The name lived on at the oasis of Feiran in south-western Sinai, where the Byzantine town of Pharan had its bishop, while Eusebius put a city Pharan beside the desert of the Saracens, three days' journey east of Aila; most scholars, however, put the biblical wilderness farther north and east, on the Tih plateau and in the Negeb. Today the plateau belongs to Egypt and the Negeb highlands to Israel, where Nahal Paran, a wadi some 150 km long, carries the old name to the Arabah."
  ru:
    - "Пустыня Фаран — великая пустыня между горой Синай и нагорьем Ханаана: голое известняковое плато середины Синайского полуострова, а по обычному мнению и нагорье Негева, с Кадес-Варни на его северо-восточном краю. Второзаконие говорит о пути «по всей этой великой и страшной пустыне». В книге Бытия четыре царя гнали Хорреев Сеира «до Эл-Фарана, что при пустыне», а Измаил, отосланный Авраамом, «жил в пустыне Фаран; и мать его взяла ему жену из земли Египетской»."
    - "Израиль прошёл Фаран после Синая: они двинулись из пустыни Синайской, «и остановилось облако в пустыне Фаран»; там они стали станом после Асирофа, и оттуда Моисей послал двенадцать соглядатаев в Ханаан, которые через сорок дней вернулись «в пустыню Фаран, в Кадес». Отказ народа идти обрёк это поколение на пустыню. Второзаконие открывается речью Моисея к Израилю «между Фараном и Тофелом, и Лаваном, и Асирофом», а в благословении Моисея Господь «воссиял от горы Фарана»; и Аввакум поёт: «Бог от Фемана грядет, и Святый — от горы Фаран». Какая гора имеется в виду, неизвестно. После смерти Самуила Давид «сошел к пустыне Фаран», где греческая Библия читает Маон, а Адер Идумеянин, спасаясь от Иоава, прошёл через Фаран, взял оттуда людей и сошёл в Египет."
    - "Имя сохранилось в оазисе Фейран на юго-западе Синая, где византийский город Фаран имел своего епископа, тогда как Евсевий помещал город Фаран у пустыни сарацин, в трёх днях пути к востоку от Аилы; большинство учёных, однако, помещают библейскую пустыню дальше к северу и востоку, на плато Эт-Тих и в Негеве. Сегодня плато принадлежит Египту, а нагорье Негева — Израилю, где Нахаль-Паран, вади длиной около 150 км, несёт древнее имя к Араве."
  uk:
    - "Пустеля Паран — велика пустеля між горою Синай і нагір’ям Ханаану: голе вапнякове плато середини Синайського півострова, а за звичайною думкою й нагір’я Негеву, з Кадесом на його північно-східному краю. Повторення Закону каже, що шлях ішов «усїм оцїм великим і страшним степом». У Бутті четверо царів гнали хорреїв Сеіру «до Ель-Парана», що біля пустелі, а Ізмаїл, відісланий Авраамом, «оселивсь у Фаран-степу, і взяла йому мати його жінку із землї Египецької»."
    - "Ізраїль перейшов Паран після Синаю: вони рушили з Синайської пустелі, «і спустилась хмара в Паран-степу»; вони стали там табором після Хацерота, і звідти Мойсей послав дванадцять розвідників до Ханаану, які за сорок днів повернулися «у Паран степу, до Кадесу». Відмова народу йти вгору прирекла те покоління на пустелю. Повторення Закону відкривається промовою Мойсея до Ізраїля «між Параном і Тофельом і Лабаном і Газеротом», а в благословенні Мойсея Господь «засіяв із Паран гори»; Авакум також співає: «прийшов був Бог від Теману, Сьвятий — від Паран-гори». Яка саме це гора, невідомо. Після смерті Самуїла Давид «пійшов у пустиню Фаран», де грецька Біблія читає Маон, а Хадад Едомітянин, утікаючи від Йоава, пройшов через Паран, узяв звідти людей і пішов до Єгипту."
    - "Назва збереглася в оазі Фейран на південному заході Синаю, де візантійське місто Фаран мало свого єпископа, тоді як Євсевій ставив місто Фаран біля пустелі сарацинів, за три дні подорожі на схід від Аїли; проте більшість учених розміщують біблійну пустелю північніше й східніше, на плато Ет-Тіх і в Негеві. Нині плато належить Єгипту, а нагір’я Негеву — Ізраїлю, де Нахаль-Паран, ваді завдовжки близько 150 км, несе давню назву до Арави."
  es:
    - "El desierto de Parán es el gran desierto entre el monte Sinaí y la región montañosa de Canaán: la meseta caliza desnuda del centro de la península del Sinaí y, según la opinión habitual, también las tierras altas del Néguev, con Cades-barnea en su borde nororiental. El Deuteronomio llama al camino que lo atraviesa «todo aquel grande y terrible desierto». En el Génesis los cuatro reyes batieron a los horeos de Seir «hasta la llanura de Parán, que está junto al desierto», e Ismael, despedido por Abraham, «habitó en el desierto de Parán; y su madre le tomó mujer de la tierra de Egipto»."
    - "Israel cruzó Parán después del Sinaí: partieron del desierto de Sinaí, «y paró la nube en el desierto de Parán»; acamparon allí después de Haserot, y desde allí Moisés envió a los doce espías a Canaán, que al cabo de cuarenta días volvieron «en el desierto de Parán, en Cades». La negativa del pueblo a subir condenó a la generación al desierto. El Deuteronomio comienza con Moisés hablando a Israel «entre Parán, y Thopel, y Labán, y Haseroth», y en la bendición de Moisés el Señor «resplandeció del monte de Parán»; también Habacuc canta que «Dios vendrá de Temán, y el Santo del monte de Parán». Se ignora qué monte se quiere decir. Tras la muerte de Samuel, David «se fué al desierto de Parán», donde la Biblia griega lee Maón, y Hadad el edomita, huyendo de Joab, pasó por Parán, tomó hombres de allí y bajó a Egipto."
    - "El nombre sobrevivió en el oasis de Feiran, en el suroeste del Sinaí, donde la ciudad bizantina de Farán tuvo su obispo, mientras que Eusebio puso una ciudad Farán junto al desierto de los sarracenos, a tres días de camino al este de Aila; sin embargo, la mayoría de los estudiosos sitúa el desierto bíblico más al norte y al este, en la meseta de Tih y en el Néguev. Hoy la meseta pertenece a Egipto y las tierras altas del Néguev a Israel, donde el Najal Parán, un uadi de unos 150 km de longitud, lleva el antiguo nombre hasta el Arabá."
  pt:
    - "O deserto de Parã é o grande deserto entre o monte Sinai e a região montanhosa de Canaã: o árido planalto calcário do centro da península do Sinai e, na visão habitual, também as terras altas do Neguebe, com Cades-Barneia em sua borda nordeste. O Deuteronômio chama o caminho por ele de “todo aquele grande e terrível deserto”. No Gênesis os quatro reis varreram os horeus de Seir “até El-Parã, que fica junto ao deserto”, e Ismael, mandado embora por Abraão, “viveu no deserto de Parã. Sua mãe conseguiu uma esposa para ele da terra do Egito”."
    - "Israel atravessou Parã depois do Sinai: partiu do deserto do Sinai, “e a nuvem pousou no deserto de Parã”; acampou ali depois de Hazerote, e dali Moisés enviou os doze espias a Canaã, que depois de quarenta dias voltaram “no deserto de Parã, em Cades”. A recusa do povo em subir condenou a geração ao deserto. O Deuteronômio começa com Moisés falando a Israel “entre Parã, Tofel, Labã, Hazerote”, e na bênção de Moisés o SENHOR “resplandeceu do monte Parã”; Habacuque também canta: “Deus veio de Temã, o Santo, do monte Parã”. Que monte é esse, ignora-se. Depois da morte de Samuel, Davi “desceu para o deserto de Parã”, onde a Bíblia grega lê Maom, e Hadade, o edomita, fugindo de Joabe, passou por Parã, tomou homens dali e desceu ao Egito."
    - "O nome sobreviveu no oásis de Feiran, no sudoeste do Sinai, onde a cidade bizantina de Farã teve seu bispo, enquanto Eusébio punha uma cidade Farã junto ao deserto dos sarracenos, a três dias de viagem a leste de Aila; a maioria dos estudiosos, porém, põe o deserto bíblico mais ao norte e a leste, no planalto de Tih e no Neguebe. Hoje o planalto pertence ao Egito e as terras altas do Neguebe a Israel, onde o Nahal Parã, um uádi de cerca de 150 km, leva o antigo nome até a Arabá."
  de:
    - "Die Wüste Paran ist die große Wüste zwischen dem Berg Sinai und dem Bergland Kanaans: die kahle Kalksteinhochfläche der mittleren Sinai-Halbinsel und nach üblicher Ansicht auch das Hochland des Negev, mit Kadesch-Barnea an ihrem nordöstlichen Rand. Das Deuteronomium nennt den Weg durch sie „die ganze Wüste, die groß und grausam ist“. In der Genesis schlugen die vier Könige die Horiter auf dem Gebirge Seir „bis El-Pharan, welches an die Wüste stößt“, und Ismael, von Abraham fortgeschickt, „wohnte in der Wüste Pharan, und seine Mutter nahm ihm ein Weib aus Ägyptenland“."
    - "Israel durchzog Paran nach dem Sinai: Sie brachen auf aus der Wüste Sinai, „und die Wolke blieb in der Wüste Pharan“; sie lagerten dort nach Hazerot, und von dort sandte Mose zwölf Kundschafter nach Kanaan, die nach vierzig Tagen zurückkamen „in die Wüste Pharan gen Kades“. Die Weigerung des Volkes verurteilte die Generation zur Wüste. Das Deuteronomium beginnt mit Moses Rede an Israel „zwischen Pharan und Tophel“, Laban, Hazerot und Disahab, und im Segen des Mose heißt es vom Herrn: „er ist hervorgebrochen von dem Berge Pharan“; auch Habakuk singt: „Gott kam vom Mittag und der Heilige vom Gebirge Pharan“. Welcher Berg gemeint ist, ist unbekannt. Nach Samuels Tod „machte sich [David] auf und zog hinab in die Wüste Pharan“, wo die griechische Bibel Maon liest, und Hadad der Edomiter zog auf der Flucht vor Joab durch Paran, nahm Leute mit und ging nach Ägypten hinab."
    - "Der Name lebte in der Oase Feiran im Südwesten des Sinai fort, wo die byzantinische Stadt Pharan einen Bischof hatte, während Eusebius eine Stadt Pharan neben der Wüste der Sarazenen setzte, drei Tagereisen östlich von Aila; die meisten Gelehrten suchen die biblische Wüste jedoch weiter nördlich und östlich, auf dem Tih-Plateau und im Negev. Heute gehört das Plateau zu Ägypten und das Hochland des Negev zu Israel, wo der Nahal Paran, ein etwa 150 km langes Wadi, den alten Namen bis zur Araba trägt."
  fr:
    - "Le désert de Paran est le grand désert entre la montagne du Sinaï et les collines de Canaan : le plateau calcaire nu du centre de la péninsule du Sinaï, et, selon l’opinion courante, aussi les hautes terres du Négev, avec Kadès-Barnéa à son bord nord-est. Le Deutéronome appelle le chemin qui le traverse « ce grand et affreux désert ». Dans la Genèse, les quatre rois battirent les Horiens de Séir « jusqu’au chêne de Paran, qui est près du désert », et Ismaël, renvoyé par Abraham, « habita dans le désert de Paran, et sa mère lui prit une femme du pays d’Égypte »."
    - "Israël traversa Paran après le Sinaï : ils partirent du désert du Sinaï, « la nuée s’arrêta dans le désert de Paran » ; ils y campèrent après Hatséroth, et c’est de là que Moïse envoya en Canaan les douze explorateurs, qui revinrent au bout de quarante jours « à Kadès dans le désert de Paran ». Le refus du peuple de monter condamna la génération au désert. Le Deutéronome s’ouvre sur Moïse parlant à Israël « entre Paran, Tophel, Laban, Hatséroth », et dans la bénédiction de Moïse l’Éternel « a resplendi de la montagne de Paran » ; Habacuc chante aussi : « Dieu vient de Théman, le Saint vient de la montagne de Paran ». On ignore de quelle montagne il s’agit. Après la mort de Samuel, David « descendit au désert de Paran », où la Bible grecque lit Maon, et Hadad l’Édomite, fuyant Joab, traversa Paran, y prit des hommes et descendit en Égypte."
    - "Le nom survécut à l’oasis de Feiran, dans le sud-ouest du Sinaï, où la ville byzantine de Pharan eut son évêque, tandis qu’Eusèbe plaçait une ville de Pharan près du désert des Sarrasins, à trois jours de marche à l’est d’Aïla ; la plupart des spécialistes mettent pourtant le désert biblique plus au nord et à l’est, sur le plateau de Tih et dans le Négev. Aujourd’hui, le plateau appartient à l’Égypte et les hautes terres du Négev à Israël, où le Nahal Paran, un oued long d’environ 150 km, porte l’ancien nom jusqu’à l’Araba."
  it:
    - "Il deserto di Paran è il grande deserto tra il monte Sinai e la regione montuosa di Canaan: l’altopiano calcareo spoglio della penisola del Sinai centrale e, secondo l’opinione comune, anche gli altopiani del Negheb, con Kades-Barnea sul suo margine nord-orientale. Il Deuteronomio chiama la via che lo attraversa «tutto quel grande e spaventevole deserto». Nella Genesi i quattro re sconfissero gli Horei di Seir «fino a El-Paran, che è presso al deserto», e Ismaele, mandato via da Abramo, «dimorò nel deserto di Paran, e sua madre gli prese per moglie una donna del paese d’Egitto»."
    - "Israele attraversò Paran dopo il Sinai: partì dal deserto del Sinai, «e la nuvola si fermò nel deserto di Paran»; vi si accampò dopo Cazerot, e da lì Mosè mandò i dodici esploratori in Canaan, che dopo quaranta giorni tornarono «nel deserto di Paran, a Kades». Il rifiuto del popolo di salire condannò la generazione al deserto. Il Deuteronomio si apre con Mosè che parla a Israele «fra Paran, Tofel, Laban, Hatseroth», e nella benedizione di Mosè il Signore «ha fatto splendere la sua luce dal monte di Paran»; anche Abacuc canta: «Iddio viene da Teman, e il santo viene dal monte di Paran». Quale monte sia inteso è ignoto. Dopo la morte di Samuele Davide «scese verso il deserto di Paran», dove la Bibbia greca legge Maon, e Adad l’Edomita, in fuga da Ioab, passò per Paran, ne prese degli uomini e scese in Egitto."
    - "Il nome sopravvisse nell’oasi di Feiran nel Sinai sud-occidentale, dove la città bizantina di Pharan ebbe il suo vescovo, mentre Eusebio pose una città Pharan accanto al deserto dei Saraceni, a tre giorni di cammino a est di Aila; la maggior parte degli studiosi, tuttavia, colloca il deserto biblico più a nord e a est, sull’altopiano di Tih e nel Negheb. Oggi l’altopiano appartiene all’Egitto e gli altopiani del Negheb a Israele, dove il Nahal Paran, un uadi lungo circa 150 km, porta l’antico nome fino all’Araba."
  pl:
    - "Pustynia Paran to wielka pustynia między górą Synaj a górzystą krainą Kanaanu: nagi wapienny płaskowyż środkowego Synaju, a według zwykłego poglądu także wyżyny Negewu, z Kadesz-Barneą na jej północno-wschodnim skraju. Księga Powtórzonego Prawa nazywa drogę przez nią „wszystkę onę pustynią wielką i straszną”. W Księdze Rodzaju czterej królowie pobili Horytów z Seiru „aż do równiny Paran, która jest przy puszczy”, a Izmael, odesłany przez Abrahama, „mieszkał na puszczy Faran; i wzięła mu matka jego żonę z ziemi Egipskiej”."
    - "Izrael przeszedł przez Paran po Synaju: wyruszył z pustyni Synaj, „a stanął obłok na puszczy Faran”; obozowali tam po Chasserot, a stąd Mojżesz wysłał dwunastu zwiadowców do Kanaanu, którzy po czterdziestu dniach wrócili „na puszczą Faran, która jest w Kades”. Odmowa wejścia skazała to pokolenie na pustynię. Księga Powtórzonego Prawa zaczyna się od przemowy Mojżesza do Izraela „między Faran, i między Tofel, i Laban, i Haserot”, a w błogosławieństwie Mojżesza Pan „objaśnił się z góry Faran”; także Habakuk śpiewa: „Bóg szedł od południa, a Święty z góry Faran”. Która to góra, nie wiadomo. Po śmierci Samuela Dawid „poszedł na puszczę Faran”, gdzie Biblia grecka czyta Maon, a Hadad Edomita, uciekając przed Joabem, przeszedł przez Paran, wziął z niego ludzi i zszedł do Egiptu."
    - "Nazwa przetrwała w oazie Feiran w południowo-zachodnim Synaju, gdzie bizantyński Faran miał swego biskupa, podczas gdy Euzebiusz umieścił miasto Faran obok pustyni Saracenów, o trzy dni drogi na wschód od Ajli; większość uczonych umieszcza jednak biblijną pustynię dalej na północ i wschód, na płaskowyżu Et-Tih i w Negewie. Dziś płaskowyż należy do Egiptu, a wyżyny Negewu do Izraela, gdzie Nachal Paran, wadi długie na około 150 km, niesie dawną nazwę do Araby."
  cs:
    - "Poušť Páran je velká poušť mezi horou Sinaj a pahorkatinou Kanaánu: holá vápencová plošina středního Sinajského poloostrova a podle obvyklého pohledu i Negevská vysočina, s Kádeš-barnea na severovýchodním okraji. Deuteronomium nazývá cestu jí „všecku poušť tuto velikou a hroznou“. V Genesis čtyři králové vyhnali Horejské ze Seíru „až k rovině Fáran, kteráž leží nad pouští“ a o Jišmaelovi, odeslaném Abrahamem, se praví: „Bydlil ... na poušti Fáran; i vzala mu matka jeho ženu z země Egyptské“."
    - "Izrael přešel Páran po Sinaji: vytáhli z pouště Sinaj, „a zastavil se oblak na poušti Fáran“; tábořili tam po Chacerótu a odtud Mojžíš poslal dvanáct vyzvědačů do Kanaánu, kteří se po čtyřiceti dnech vrátili a přišli k Mojžíšovi „na poušti Fáran v Kádes“. Odmítnutí lidu vystoupit odsoudilo pokolení k poušti. Deuteronomium začíná Mojžíšovou řečí k Izraeli „mezi Fáran a Tofel a Lában a Hazerot“ a v Mojžíšově požehnání Hospodin „zastkvěl se s hory Fáran“; i Abakuk zpívá: „Když se Bůh bral od poledne, a Svatý s hory Fáran“. Která hora se myslí, není známo. Po Samuelově smrti „David vstav, šel na poušť Fáran“, kde řecká Bible čte Maon, a Hadad Edomský, prchající před Joábem, prošel Páranem, vzal si z něj muže a sestoupil do Egypta."
    - "Jméno žilo dál v oáze Fejrán v jihozápadním Sinaji, kde měl byzantský Faran svého biskupa, zatímco Eusebius kladl město Faran vedle pouště Saracénů, tři dny cesty východně od Aily; většina učenců však klade biblickou poušť dále na sever a východ, na plošinu Tíh a do Negevu. Dnes plošina patří Egyptu a negevská vysočina Izraeli, kde Nachal Paran, vádí dlouhé asi 150 km, nese staré jméno až k Arabě."
  nl:
    - "De woestijn van Paran is de grote woestijn tussen de berg Sinaï en het bergland van Kanaän: het kale kalksteenplateau van het centrale Sinaïschiereiland en, volgens de gangbare opvatting, ook het Negevhoogland, met Kades-Barnea aan de noordoostrand. Deuteronomium noemt de weg erdoor “die gans grote en vreselijke woestijn”. In Genesis veegden de vier koningen de Chorieten van Seïr uit “tot aan het effen veld van Paran, hetwelk aan de woestijn is”, en Ismaël, door Abraham weggezonden, “woonde in de woestijn Paran; en zijn moeder nam hem een vrouw uit Egypteland”."
    - "Israël trok na de Sinaï door Paran: het brak op uit de woestijn Sinaï, “en de wolk bleef in de woestijn Paran”; het legerde zich daar na Hazerot, en vandaaruit zond Mozes de twaalf verspieders naar Kanaän, die na veertig dagen terugkwamen “in de woestijn van Paran, naar Kades”. De weigering van het volk om op te trekken veroordeelde de generatie tot de woestijn. Deuteronomium opent met Mozes die tot Israël spreekt “tussen Paran en tussen Tofel, en Laban, en Hazeroth”, en in de zegen van Mozes “is” de HEER “blinkende verschenen van het gebergte Paran”; ook Habakuk zingt: “God kwam van Theman, en de Heilige van den berg Paran”. Welke berg bedoeld is, is onbekend. Na Samuëls dood “toog” David “af naar de woestijn Paran”, waar de Griekse Bijbel Maön leest, en Hadad de Edomiet, op de vlucht voor Joab, trok door Paran, nam er mannen mee en ging naar Egypte."
    - "De naam leefde voort bij de oase Feiran in het zuidwesten van de Sinaï, waar de Byzantijnse stad Pharan haar bisschop had, terwijl Eusebius een stad Pharan plaatste naast de woestijn van de Saracenen, drie dagreizen oostelijk van Aila; de meeste geleerden plaatsen de bijbelse woestijn echter verder noordelijk en oostelijk, op het Tih-plateau en in de Negev. Tegenwoordig behoort het plateau tot Egypte en het Negevhoogland tot Israël, waar Nachal Paran, een wadi van zo’n 150 km lengte, de oude naam naar de Araba draagt."
  sv:
    - "Parans öken är den stora öknen mellan Sinaiberget och Kanaans bergsbygd: den kala kalkstensplatån i centrala Sinaihalvön, och enligt den vanliga uppfattningen även Negevhöglandet, med Kadesh-Barnea på dess nordöstra kant. Femte Mosebok beskriver färden genom den som ”hela den stora och fruktansvärda öken”. I Första Mosebok drev de fyra kungarna horéerna på Seir ”ända till El-Paran vid öknen”, och Ismael, bortsänd av Abraham, ”bodde i öknen Paran; och hans moder tog en hustru åt honom från Egyptens land”."
    - "Israel korsade Paran efter Sinai: de bröt upp från Sinais öken, och ”molnskyn stannade i öknen Paran”; de slog läger där efter Haserot, och därifrån sände Mose de tolv spejarna in i Kanaan, som efter fyrtio dagar vände tillbaka till Mose och menigheten ”i öknen Paran, i Kades”. Folkets vägran att gå upp dömde generationen till öknen. Femte Mosebok öppnar med att Mose talar till Israel ”mellan Paran och Tofel, Laban, Haserot”, och i Moses välsignelse heter det att man ”kom fram i glans från berget Paran”; Habackuk sjunger likaså: ”Gud kommer från Teman, den helige från berget Paran”. Vilket berg som avses är okänt. Efter Samuels död ”David stod upp och drog ned till öknen Paran”, där den grekiska bibeln har Maon, och edomiten Hadad, som flydde Joav, passerade genom Paran, tog män därifrån och gick ned till Egypten."
    - "Namnet levde kvar vid oasen Feiran i sydvästra Sinai, där den bysantinska staden Pharan hade sin biskop, medan Eusebios placerade en stad Pharan intill saracenernas öken, tre dagsresor öster om Aila; de flesta forskare placerar dock den bibliska öknen längre norrut och österut, på Tih-platån och i Negev. I dag tillhör platån Egypten och Negevhöglandet Israel, där Nahal Paran, en wadi på omkring 150 km, för det gamla namnet ned till Arava."
  nb:
    - "Parans ørken er den store ørkenen mellom Sinai-fjellet og Kanaans fjellland: det nakne kalksteinsplatået i det sentrale Sinai, og etter den vanlige oppfatning også Negev-høylandet, med Kadesj-Barnea i nordøstkanten. 5. Mosebok kaller veien gjennom den «hele den store og forferdelige ørken». I 1. Mosebok feide de fire kongene over horittene i Se'ir «like til El-Paran ved utkanten av ørkenen», og Ismael, sendt bort av Abraham, «bosatte sig i ørkenen Paran, og hans mor tok en hustru til ham fra Egypten»."
    - "Israel krysset Paran etter Sinai: de brøt opp fra Sinai ørken, «og skyen lot sig ned i ørkenen Paran»; de slo leir der etter Haserot, og derfra sendte Moses de tolv spionene til Kanaan, som etter førti dager kom tilbake «i ørkenen Paran, i Kades». Folkets nektelse av å dra opp dømte den generasjonen til ørkenen. 5. Mosebok åpner med at Moses taler til Israel «mellem Paran og Tofel og Laban og Haserot», og i Moses' velsignelse «strålte» Herren «frem fra Parans fjell»; også Habakkuk synger: «Gud kommer fra Teman, den Hellige fra Paran-fjellet». Hvilket fjell som menes, er ukjent. Etter Samuels død «drog [David] ned til ørkenen Paran», der den greske bibelen har Maon, og edomitten Hadad, på flukt fra Joab, dro gjennom Paran, tok med seg menn derfra og dro ned til Egypt."
    - "Navnet levde videre ved oasen Feiran i sørvestlige Sinai, der den bysantinske byen Pharan hadde sin biskop, mens Eusebius satte en by Pharan ved saracenernes ørken, tre dagsreiser øst for Aila; de fleste forskere plasserer likevel den bibelske ørkenen lenger nord og øst, på Tih-platået og i Negev. I dag tilhører platået Egypt og Negev-høylandet Israel, der Nahal Paran, en wadi på omtrent 150 km, fører det gamle navnet til Arava."
  tl:
    - "Ang ilang ng Paran ang malaking disyerto sa pagitan ng bundok ng Sinai at ng maburol na lupain ng Canaan: ang hubad na talampas na apog sa gitna ng tangway ng Sinai, at sa karaniwang pananaw pati ang mataas na lupain ng Negeb, kasama ang Cades-barnea sa hilagang-silangang gilid nito. Tinatawag ng Deuteronomio ang daan sa pamamagitan nito na “buong malawak at kakilakilabot na ilang”. Sa Genesis, nilusob ng apat na hari ang mga Horeo sa Seir “hanggang Elparan na nasa tabi ng ilang”, at si Ismael, na pinaalis ni Abraham, ay “nanahan sa ilang ng Paran: at ikinuha siya ng kaniyang ina ng asawa sa lupain ng Egipto”."
    - "Tinawid ng Israel ang Paran pagkatapos ng Sinai: umalis sila sa ilang ng Sinai, “at ang ulap ay tumahan sa ilang ng Paran”; nagkampo roon pagkatapos ng Haseroth, at doon isinugo ni Moises ang 12 tiktik sa Canaan, na bumalik pagkaraan ng 40 araw “sa ilang ng Paran, sa Cades”. Dahil sa pagtangging umakyat, hinatulan sa disyerto ang henerasyon. Nagsisimula ang Deuteronomio sa pagsasalita ni Moises sa Israel “sa pagitan ng Paran, at ng Thopel, at ng Laban, at ng Haseroth”; sa basbas niya, ang Panginoon ay “lumiwanag mula sa bundok ng Paran”; umaawit din si Habacuc, “Ang Dios ay nanggaling mula sa Tema, At ang Banal ay mula sa bundok ng Paran”. Di alam kung aling bundok. Pagkamatay ni Samuel, si David ay “lumusong sa ilang ng Paran”, na Maon sa Bibliyang Griyego; si Adad na Edomita, tumatakas kay Joab, ay dumaan sa Paran, kumuha roon ng tao at bumaba sa Egipto."
    - "Nanatili ang pangalan sa oasis ng Feiran sa timog-kanlurang Sinai, kung saan ang bayang Bisantino ng Pharan ay may sariling obispo, samantalang inilagay ni Eusebio ang isang lungsod na Pharan sa tabi ng disyerto ng mga Saraceno, tatlong araw na paglalakbay sa silangan ng Aila; gayunman, inilalagay ng karamihan sa mga iskolar ang ilang sa Bibliya nang mas hilaga at silangan, sa talampas ng Tih at sa Negeb. Ngayon ang talampas ay pag-aari ng Egipto at ang mataas na lupain ng Negeb ay ng Israel, kung saan ang Nahal Paran, isang wadi na mga 150 km ang haba, ay nagdadala ng lumang pangalan hanggang sa Araba."
