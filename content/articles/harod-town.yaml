# Overview article (ADR 0007). Mainstream facts only; Harod is known only as the home of two of David's heroes; the two proposals (a site near Jerusalem, the spring of Harod in the Jezreel valley) are given without choosing.
id: harod-town
place: afd8b40
title:
  en: "Harod, home of the Harodites"
  ru: "Харод, родина Хародитян"
  uk: "Харод, батьківщина хародян"
  es: "Harod, patria de los harodeos"
  pt: "Harode, terra dos haroditas"
  de: "Harod, Heimat der Haroditer"
  fr: "Harod, patrie des Harodites"
  pl: "Charod, miasto Charodczyków"
  it: "Carod, patria dei Caroditi"
  nl: "Charod, woonplaats van de Charodieten"
  cs: "Charod, domov Charodských"
  sv: "Harod, haroditernas hemort"
  nb: "Harod, haroditternes hjemsted"
  tl: "Harod, tahanan ng mga Harodita"
  da: "Harod, haroditternes hjemby"
  sr: "Харод, завичај Харођана"
  hu: "Harod, a haródiak otthona"
  fi: "Harod, harodilaisten kotipaikka"
  vi: "Ha-rốt, quê của người Ha-rốt"
  ro: "Harod, patria haroditilor"
  bg: "Харод, родина на хародците"
body:
  en:
    - "Harod is known only through the men called after it. In the list of David's mighty men two of the thirty stand side by side: “Shammah the Harodite, Elika the Harodite”. The parallel list in Chronicles has “Shammoth the Harorite”, a one-letter difference in Hebrew that most scholars explain as a copyist's slip for Harodite; Elika is missing there. The Bible never names the town itself, and nothing is told of either man beyond his place in the list."
    - "Where Harod was is unknown. Since several of David's heroes came from the villages around Bethlehem and Jerusalem, some look for it in Judah, and the map follows the proposal of Khirbet el-Harazan, a ruin south-east of Jerusalem; others connect the Harodites with the spring of Harod in the Jezreel valley, where Gideon camped before his night attack on Midian. Neither view rests on more than the name, and no excavation has settled it."
  ru:
    - "Харод известен только по людям, названным по нему. В списке храбрых Давида двое из тридцати стоят рядом: «Шамма Хародитянин, Елика Хародитянин». Параллельный список Паралипоменон даёт «Шамма Гародитянин», а в еврейском тексте там стоит имя, отличающееся одной буквой, что большинство исследователей объясняет ошибкой переписчика; Елики там нет. Сам город Библия не называет ни разу, и ни о ком из этих двоих ничего не рассказано, кроме места в списке."
    - "Где был Харод, неизвестно. Поскольку несколько храбрых Давида происходили из селений вокруг Вифлеема и Иерусалима, одни ищут его в Иудее, и карта следует предположению о Хирбет-эль-Харазане, развалинах к юго-востоку от Иерусалима; другие связывают Хародитян с источником Харод в Изреельской долине, у которого стоял станом Гедеон перед ночным нападением на Мадианитян. Ни одно мнение не опирается ни на что, кроме имени, и раскопки вопроса не решили."
  uk:
    - "Харод відомий лише через людей, названих за ним. У переліку Давидових лицарів двоє з тридцяти стоять поряд: «Самма з Хароду, Елика з Хароду». Паралельний перелік у Хроніках має Шаммота Гарорянина — різницю в одну літеру в давньоєврейській, яку більшість дослідників пояснює помилкою переписувача замість Хародянина; Еліки там немає. Біблія ніколи не називає самого міста, і про жодного з цих людей нічого не розповідається, окрім його місця в переліку."
    - "Де був Харод, невідомо. Оскільки кілька Давидових героїв походили з сіл довкола Вифлеєма та Єрусалима, дехто шукає його в Юді, і карта йде за пропозицією Хірбет-ель-Харазан, руїни на південний схід від Єрусалима; інші пов’язують хародян із джерелом Харод у долині Їзреель, де Гедеон отаборився перед нічним нападом на Мадіам. Жоден погляд не спирається на більше, ніж назва, і жодні розкопки не вирішили питання."
  es:
    - "Harod se conoce solo por los hombres que llevan su nombre. En la lista de los valientes de David dos de los treinta figuran juntos: «Samma de Harodi, Elica de Harodi». La lista paralela de Crónicas tiene «Samoth de Arori», una diferencia de una letra en hebreo que la mayoría de los estudiosos explican como un desliz de copista por harodita; Elica falta allí. La Biblia nunca nombra la población misma, y nada se cuenta de ninguno de los dos hombres fuera de su lugar en la lista."
    - "Dónde estuvo Harod se ignora. Como varios héroes de David procedían de las aldeas de alrededor de Belén y Jerusalén, algunos la buscan en Judá, y el mapa sigue la propuesta de Khirbet el-Harazan, una ruina al sudeste de Jerusalén; otros relacionan a los harodeos con la fuente de Harod en el valle de Jezreel, donde Gedeón acampó antes de su ataque nocturno contra Madián. Ninguna de las dos opiniones se apoya en más que el nombre, y ninguna excavación lo ha resuelto."
  pt:
    - "Harode só é conhecida pelos homens que dela receberam o nome. Na lista dos valentes de Davi, dois dos trinta estão lado a lado: “Samá, o harodita, Elica, o harodita”. A lista paralela de Crônicas tem “Samote, o harorita”, diferença de uma letra no hebraico que a maioria dos estudiosos explica como lapso de copista por harodita; Elica falta ali. A Bíblia nunca nomeia a própria cidade, e nada se conta de nenhum dos dois homens além de seu lugar na lista."
    - "Onde ficava Harode é desconhecido. Como vários heróis de Davi vinham das aldeias em torno de Belém e Jerusalém, alguns a procuram em Judá, e o mapa segue a proposta de Khirbet el-Harazan, uma ruína a sudeste de Jerusalém; outros ligam os haroditas à fonte de Harode no vale de Jezreel, onde Gideão acampou antes de seu ataque noturno a Midiã. Nenhuma das visões repousa em mais do que o nome, e nenhuma escavação resolveu a questão."
  de:
    - "Harod ist nur durch die nach ihm benannten Männer bekannt. In der Liste von Davids Helden stehen zwei der Dreißig nebeneinander: „Samma, der Haroditer; Elika, der Haroditer“. Die Parallelliste der Chronik hat „Sammoth, der Haroriter“, ein Ein-Buchstaben-Unterschied im Hebräischen, den die meisten Forscher als Abschreibfehler für Haroditer erklären; Elika fehlt dort. Die Bibel nennt die Stadt selbst nie, und von beiden Männern wird nichts erzählt außer ihrem Platz in der Liste."
    - "Wo Harod lag, ist unbekannt. Da mehrere von Davids Helden aus den Dörfern um Bethlehem und Jerusalem stammten, suchen manche es in Juda, und die Karte folgt dem Vorschlag Chirbet el-Harazan, einer Ruine südöstlich von Jerusalem; andere verbinden die Haroditer mit der Quelle Harod im Jesreeltal, wo Gideon vor seinem nächtlichen Angriff auf Midian lagerte. Keine der Ansichten beruht auf mehr als dem Namen, und keine Grabung hat entschieden."
  fr:
    - "Harod n’est connue que par les hommes qui en portent le nom. Dans la liste des vaillants de David, deux des trente se tiennent côte à côte : « Schamma, de Harod. Élika, de Harod. » La liste parallèle des Chroniques porte « Schammoth, d’Haror », une différence d’une lettre en hébreu que la plupart des spécialistes expliquent par une erreur de copiste pour Harodite ; Élika y manque. La Bible ne nomme jamais la ville elle-même, et l’on ne dit rien de l’un ni de l’autre homme au-delà de sa place dans la liste."
    - "On ignore où se trouvait Harod. Plusieurs héros de David venant des villages autour de Bethléem et de Jérusalem, certains la cherchent en Juda, et la carte suit la proposition de Khirbet el-Harazan, une ruine au sud-est de Jérusalem ; d’autres rattachent les Harodites à la source de Harod dans la vallée de Jizreel, où Gédéon campa avant son attaque nocturne contre Madian. Aucune de ces vues ne repose sur plus que le nom, et aucune fouille n’a tranché."
  pl:
    - "Charod znany jest tylko przez mężów od niego nazwanych. W wykazie bohaterów Dawida dwaj z trzydziestu stoją obok siebie: „Samma Harodczyk; Elika Harodczyk”. Odpowiedni wykaz w Księgach Kronik ma Szamota Harorytę, różnicę jednej litery w hebrajskim, którą większość uczonych tłumaczy jako pomyłkę kopisty zamiast Charodczyka; Eliki tam brak. Biblia nigdy nie wymienia samego miasta, a o żadnym z obu mężów nie mówi się nic poza jego miejscem w wykazie."
    - "Gdzie leżał Charod, nie wiadomo. Ponieważ kilku bohaterów Dawida pochodziło z wsi wokół Betlejem i Jerozolimy, niektórzy szukają go w Judzie, a mapa idzie za propozycją Chirbet el-Charazan, ruiny na południowy wschód od Jerozolimy; inni łączą Charodczyków ze źródłem Charod w dolinie Jizreel, gdzie Gedeon obozował przed nocnym atakiem na Madian. Żaden z poglądów nie opiera się na niczym więcej niż nazwa, a żadne wykopaliska nie rozstrzygnęły sprawy."
  it:
    - "Carod è nota solo attraverso gli uomini che da essa prendono il nome. Nell’elenco dei prodi di Davide due dei trenta stanno fianco a fianco: «Shamma da Harod; Elika da Harod». L’elenco parallelo delle Cronache ha «Shammoth da Haror», una differenza di una lettera in ebraico che la maggior parte degli studiosi spiega come svista di un copista per Carodita; Elika vi manca. La Bibbia non nomina mai la città stessa, e nulla si dice dei due uomini oltre al loro posto nell’elenco."
    - "Dove fosse Carod è ignoto. Poiché parecchi eroi di Davide venivano dai villaggi attorno a Betlemme e a Gerusalemme, alcuni la cercano in Giuda, e la mappa segue la proposta di Khirbet el-Harazan, una rovina a sud-est di Gerusalemme; altri collegano i Caroditi con la sorgente di Carod nella valle di Izreel, dove Gedeone si accampò prima del suo attacco notturno contro Madian. Nessuna delle due opinioni poggia su più del nome, e nessuno scavo ha deciso."
  nl:
    - "Charod is alleen bekend door de mannen die ernaar zijn genoemd. In de lijst van Davids helden staan twee van de dertig naast elkaar: “Samma, de Harodiet; Elika, de Harodiet”. De parallelle lijst in Kronieken heeft in het Hebreeuws Sammoth de Harorite, een verschil van één letter dat de meeste geleerden verklaren als een schrijffout voor Harodiet; Elika ontbreekt daar. De Bijbel noemt de stad zelf nooit, en over beide mannen wordt niets verteld buiten hun plaats in de lijst."
    - "Waar Charod lag, is onbekend. Omdat verscheidene helden van David uit de dorpen rond Bethlehem en Jeruzalem kwamen, zoeken sommigen het in Juda, en de kaart volgt het voorstel Khirbet el-Harazan, een ruïne ten zuidoosten van Jeruzalem; anderen verbinden de Charodieten met de bron van Charod in de vlakte van Jizreël, waar Gideon zijn kamp opsloeg vóór zijn nachtelijke aanval op Midian. Geen van beide opvattingen berust op meer dan de naam, en geen opgraving heeft de kwestie beslist."
  cs:
    - "Charod je znám jen z mužů, kteří se po něm nazývají. V seznamu Davidových hrdinů stojí dva z třiceti vedle sebe: „Samma Charodský, Elika Charodský“. Paralelní seznam v Letopisech má Šamota Charorského, což je rozdíl jediného písmene v hebrejštině, který většina učenců vysvětluje jako opisovačský přepis za Charodského; Elika tam chybí. Bible samo město nejmenuje a o žádném z obou mužů se nevypráví nic mimo jejich místo v seznamu."
    - "Kde Charod byl, není známo. Protože několik Davidových hrdinů pocházelo z vesnic kolem Betléma a Jeruzaléma, někteří je hledají v Judsku a mapa následuje návrh Chirbet el-Charazan, zříceniny jihovýchodně od Jeruzaléma; jiní spojují Charodské s pramenem Charod v Jizreelském údolí, kde se Gedeon utábořil před nočním útokem na Midján. Ani jeden pohled se neopírá o víc než jméno a žádné vykopávky věc nerozhodly."
  sv:
    - "Harod är känt bara genom männen som kallas efter det. I förteckningen över Davids hjältar står två av de trettio bredvid varandra: ”haroditen Samma; haroditen Elika”. Parallellförteckningen i Krönikeboken har ”haroriten Sammot”, en skillnad på en bokstav i hebreiskan som de flesta forskare förklarar som en avskrivares misstag för harodit; Elika saknas där. Bibeln nämner aldrig själva staden, och inget berättas om någon av männen utöver deras plats i förteckningen."
    - "Var Harod låg är okänt. Eftersom flera av Davids hjältar kom från byarna kring Betlehem och Jerusalem söker några det i Juda, och kartan följer förslaget Khirbet el-Harazan, en ruin sydost om Jerusalem; andra förbinder haroditerna med Harods källa i Jisreeldalen, där Gideon slog läger före sitt nattliga angrepp på Midjan. Ingen av uppfattningarna vilar på mer än namnet, och ingen utgrävning har avgjort saken."
  nb:
    - "Harod er bare kjent gjennom mennene oppkalt etter det. I listen over Davids helter står to av de tretti side om side: «haroditten Samma; haroditten Elika». Den parallelle listen i Krønikebøkene har «haroritten Sammot», en forskjell på én bokstav i hebraisk som de fleste forskere forklarer som en avskrivers feil for haroditt; Elika mangler der. Bibelen nevner aldri selve byen, og ingenting fortelles om noen av mennene utover deres plass i listen."
    - "Hvor Harod lå, er ukjent. Siden flere av Davids helter kom fra landsbyene rundt Betlehem og Jerusalem, leter noen etter det i Juda, og kartet følger forslaget om Khirbet el-Harazan, en ruin sørøst for Jerusalem; andre knytter haroditterne til Harod-kilden i Jisreel-dalen, hvor Gideon slo leir før sitt nattlige angrep på Midjan. Ingen av synene hviler på mer enn navnet, og ingen utgravning har avgjort saken."
  tl:
    - "Ang Harod ay kilala lamang sa pamamagitan ng mga lalaking ipinangalan dito. Sa talaan ng mga makapangyarihang lalaki ni David, dalawa sa tatlumpu ang magkatabi: “Samma na Harodita, si Elica na Harodita”. Ang katapat na talaan sa Mga Cronica ay may “Samoth na Arorita”, isang pagkakaiba ng isang titik sa Hebreo na ipinaliliwanag ng karamihan sa mga iskolar bilang pagkakamali ng tagakopya para sa Harodita; wala roon si Elica. Hindi kailanman pinangangalanan ng Biblia ang bayan mismo, at walang isinasalaysay tungkol sa alinman sa dalawa maliban sa kanilang lugar sa talaan."
    - "Hindi alam kung saan naroon ang Harod. Yamang ilan sa mga bayani ni David ay nagmula sa mga nayon sa palibot ng Bethlehem at Jerusalem, hinahanap ito ng ilan sa Juda, at sinusunod ng mapa ang mungkahi ng Khirbet el-Harazan, isang guho sa timog-silangan ng Jerusalem; iniuugnay ng iba ang mga Harodita sa bukal ng Harod sa libis ng Jezreel, kung saan nagkampo si Gedeon bago ang kaniyang pagsalakay sa gabi sa Midian. Wala sa dalawang pananaw ang nakasalig sa higit pa sa pangalan, at walang paghuhukay na nakalutas."
  da:
    - "Harod kendes kun gennem mændene, der er opkaldt efter det. I listen over Davids helte står to af de tredive side om side: »Haroditeren Samma; Haroditeren Elika«. Parallellisten i Krønikebøgerne har »Sammoth, Haroriten«, en forskel på ét bogstav på hebraisk, som de fleste forskere forklarer som en afskrivers fejl for haroditer; Elika mangler der. Bibelen nævner aldrig selve byen, og intet fortælles om nogen af de to mænd ud over deres plads i listen."
    - "Hvor Harod lå, er ukendt. Da flere af Davids helte kom fra landsbyerne omkring Betlehem og Jerusalem, søger nogle det i Juda, og kortet følger forslaget Khirbet el-Harazan, en ruin sydøst for Jerusalem; andre forbinder haroditterne med Harods kilde i Jizre'el-dalen, hvor Gideon lejrede sig før sit natlige angreb på Midjan. Ingen af opfattelserne hviler på mere end navnet, og ingen udgravning har afgjort det."
  sr:
    - "Харод је познат само по људима названим по њему. У списку Давидових јунака двојица од тридесеторице стоје један поред другог: „Сама Арођанин, Елика Арођанин“. Паралелни списак у Летописима има „Самот Арорарин“, разлику једног слова у хебрејском коју већина научника објашњава као писареву омашку уместо Харођанин; Елика ту недостаје. Библија никад не именује сам град и о обојици људи не прича се ништа осим њиховог места на списку."
    - "Где је Харод био, непознато је. Пошто је неколико Давидових јунака било из села око Витлејема и Јерусалима, неки га траже у Јуди, а карта следи предлог Хирбет ел-Харазана, рушевине југоисточно од Јерусалима; други повезују Харођане с извором Харод у долини Језраела, где је Гедеон логоровао пре ноћног напада на Мадијам. Ни једно гледиште не почива на више од имена и ни једно ископавање није решило питање."
  hu:
    - "Harod csak a róla elnevezett férfiakon át ismert. Dávid vitézeinek jegyzékében a harminc közül kettő áll egymás mellett: „Haród városbeli Samma; azon Haródból való Elika”. A Krónikák párhuzamos jegyzéke „Haróritból való Sammót”-ot említ, ami a héberben egyetlen betű eltérés, amelyet a legtöbb kutató a „haródi” másolói elírásaként magyaráz; Elika ott hiányzik. A Biblia magát a várost sosem nevezi meg, és egyik férfiról sem mond többet jegyzékbeli helyénél."
    - "Hogy hol volt Harod, ismeretlen. Mivel Dávid több hőse a Betlehem és Jeruzsálem körüli falvakból jött, egyesek Júdában keresik, és a térkép Hirbet el-Harazan javaslatát követi, egy romot Jeruzsálemtől délkeletre; mások a haródiakat a Jezréel-völgyi Harod forrásához kötik, ahol Gedeon táborozott a Midián elleni éjszakai támadása előtt. Egyik nézet sem áll többön a néven, és ásatás nem döntötte el."
  fi:
    - "Harod tunnetaan vain sen mukaan nimettyjen miesten kautta. Daavidin sankarien luettelossa kolmestakymmenestä kaksi seisoo rinnakkain: ”harodilainen Samma; harodilainen Elika”. Aikakirjojen rinnakkaisluettelossa on ”harorilainen Sammot”, heprean yhden kirjaimen ero, jonka useimmat tutkijat selittävät kopioijan lipsahdukseksi harodilaisen tilalla; Elika puuttuu sieltä. Raamattu ei koskaan nimeä itse kaupunkia, eikä kummastakaan miehestä kerrota muuta kuin heidän paikkansa luettelossa."
    - "Missä Harod sijaitsi, ei tiedetä. Koska useat Daavidin sankareista tulivat Betlehemin ja Jerusalemin ympäristön kylistä, jotkut etsivät sitä Juudasta, ja kartta seuraa ehdotusta Khirbet el-Harazanista, rauniosta Jerusalemista kaakkoon; toiset yhdistävät harodilaiset Harodin lähteeseen Jisreelin laaksossa, jossa Gideon leiriytyi ennen yöllistä hyökkäystään Midiania vastaan. Kumpikaan näkemys ei perustu muuhun kuin nimeen, eikä mikään kaivaus ole ratkaissut asiaa."
  vi:
    - "Ha-rốt chỉ được biết qua những người mang tên theo nó. Trong bảng các dũng sĩ của Đa-vít, hai người trong ba mươi đứng cạnh nhau: “Sa-ma ở Ha-rốt, Ê-li-ca ở Ha-rốt”. Bảng song song trong sách Sử Ký có “Sa-mốt, người Ha-rôn”, khác một chữ cái trong tiếng Hê-bơ-rơ mà phần lớn học giả giải thích là người sao chép chép nhầm từ Ha-rốt; Ê-li-ca vắng mặt ở đó. Kinh Thánh không bao giờ nêu tên thành, và không kể gì về hai người ngoài vị trí của họ trong bảng."
    - "Ha-rốt ở đâu thì không biết. Vì nhiều dũng sĩ của Đa-vít đến từ các làng quanh Bết-lê-hem và Giê-ru-sa-lem, có người tìm ở Giu-đa, và bản đồ theo đề nghị Khirbet el-Harazan, một phế tích phía đông nam Giê-ru-sa-lem; những người khác nối người Ha-rốt với suối Ha-rốt trong thung lũng Gít-rê-ên, nơi Ghê-đê-ôn đóng trại trước cuộc tấn công ban đêm vào Ma-đi-an. Cả hai quan điểm đều không dựa vào gì hơn cái tên, và không cuộc khai quật nào giải quyết được."
  ro:
    - "Harod este cunoscut doar prin oamenii numiți după el. În lista viteazilor lui David, doi dintre cei treizeci stau alături: Șama haroditul și Elica haroditul. Lista paralelă din Cronici are „Samaot al lui Arori”, o deosebire de o literă în ebraică pe care cei mai mulți cercetători o explică drept o greșeală de copist pentru haroditul; Elica lipsește acolo. Biblia nu numește niciodată orașul însuși și nu spune nimic despre vreunul dintre cei doi bărbați în afară de locul lui în listă."
    - "Unde se afla Harod este necunoscut. Fiindcă mai mulți dintre eroii lui David veneau din satele din jurul Betleemului și Ierusalimului, unii îl caută în Iuda, iar harta urmează propunerea Khirbet el-Harazan, o ruină la sud-est de Ierusalim; alții îi leagă pe haroditi de izvorul Harod din valea Izreelului, unde a tăbărât Ghedeon înainte de atacul său de noapte împotriva Madianului. Niciuna dintre păreri nu se sprijină pe mai mult decât numele, iar nicio săpătură nu a lămurit chestiunea."
  bg:
    - "Харод е известен само чрез мъжете, наречени на него. В списъка на храбреците на Давид двама от тридесетте стоят един до друг: „Сама Ародецът; Елика Ародецът“. Успоредният списък в Летописи има „Самот Арорецът“ — разлика от една буква в еврейския текст, която повечето учени обясняват като грешка на преписвач вместо „хародец“; Елика там липсва. Библията никога не назовава самия град и за никой от двамата не се разказва нищо извън мястото му в списъка."
    - "Къде е бил Харод, не е известно. Понеже няколко от храбреците на Давид идваха от селата около Витлеем и Йерусалим, някои го търсят в Юдея и картата следва предложението за Хирбет ел-Харазан, развалина югоизточно от Йерусалим; други свързват хародците с извора Харод в Изреелската долина, където Гедеон разположи стан преди нощното си нападение срещу Мадиам. Нито едното мнение не почива на нещо повече от името и никакви разкопки не са решили въпроса."
