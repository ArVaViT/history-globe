# Overview article (ADR 0007). Mainstream facts only; Harod is known only as the home of two of David's heroes; the two proposals (a site near Jerusalem, the spring of Harod in the Jezreel valley) are given without choosing.
id: harod-town
place: afd8b40
title:
  en: "Harod, home of the Harodites"
  ru: "Харод, родина Хародитян"
  uk: "Харод, батьківщина хародян"
  es: "Harod, patria de los harodeos"
  pt: "Harode, terra dos haroditas"
  de: "Harod, Heimat der Haroditer"
  fr: "Harod, patrie des Harodites"
body:
  en:
    - "Harod is known only through the men called after it. In the list of David's mighty men two of the thirty stand side by side: “Shammah the Harodite, Elika the Harodite”. The parallel list in Chronicles has “Shammoth the Harorite”, a one-letter difference in Hebrew that most scholars explain as a copyist's slip for Harodite; Elika is missing there. The Bible never names the town itself, and nothing is told of either man beyond his place in the list."
    - "Where Harod was is unknown. Since several of David's heroes came from the villages around Bethlehem and Jerusalem, some look for it in Judah, and the map follows the proposal of Khirbet el-Harazan, a ruin south-east of Jerusalem; others connect the Harodites with the spring of Harod in the Jezreel valley, where Gideon camped before his night attack on Midian. Neither view rests on more than the name, and no excavation has settled it."
  ru:
    - "Харод известен только по людям, названным по нему. В списке храбрых Давида двое из тридцати стоят рядом: «Шамма Хародитянин, Елика Хародитянин». Параллельный список Паралипоменон даёт «Шамма Гародитянин», а в еврейском тексте там стоит имя, отличающееся одной буквой, что большинство исследователей объясняет ошибкой переписчика; Елики там нет. Сам город Библия не называет ни разу, и ни о ком из этих двоих ничего не рассказано, кроме места в списке."
    - "Где был Харод, неизвестно. Поскольку несколько храбрых Давида происходили из селений вокруг Вифлеема и Иерусалима, одни ищут его в Иудее, и карта следует предположению о Хирбет-эль-Харазане, развалинах к юго-востоку от Иерусалима; другие связывают Хародитян с источником Харод в Изреельской долине, у которого стоял станом Гедеон перед ночным нападением на Мадианитян. Ни одно мнение не опирается ни на что, кроме имени, и раскопки вопроса не решили."
  uk:
    - "Харод відомий лише через людей, названих за ним. У переліку Давидових лицарів двоє з тридцяти стоять поряд: «Самма з Хароду, Елика з Хароду». Паралельний перелік у Хроніках має Шаммота Гарорянина — різницю в одну літеру в давньоєврейській, яку більшість дослідників пояснює помилкою переписувача замість Хародянина; Еліки там немає. Біблія ніколи не називає самого міста, і про жодного з цих людей нічого не розповідається, окрім його місця в переліку."
    - "Де був Харод, невідомо. Оскільки кілька Давидових героїв походили з сіл довкола Вифлеєма та Єрусалима, дехто шукає його в Юді, і карта йде за пропозицією Хірбет-ель-Харазан, руїни на південний схід від Єрусалима; інші пов’язують хародян із джерелом Харод у долині Їзреель, де Гедеон отаборився перед нічним нападом на Мадіам. Жоден погляд не спирається на більше, ніж назва, і жодні розкопки не вирішили питання."
  es:
    - "Harod se conoce solo por los hombres que llevan su nombre. En la lista de los valientes de David dos de los treinta figuran juntos: «Samma de Harodi, Elica de Harodi». La lista paralela de Crónicas tiene «Samoth de Arori», una diferencia de una letra en hebreo que la mayoría de los estudiosos explican como un desliz de copista por harodita; Elica falta allí. La Biblia nunca nombra la población misma, y nada se cuenta de ninguno de los dos hombres fuera de su lugar en la lista."
    - "Dónde estuvo Harod se ignora. Como varios héroes de David procedían de las aldeas de alrededor de Belén y Jerusalén, algunos la buscan en Judá, y el mapa sigue la propuesta de Khirbet el-Harazan, una ruina al sudeste de Jerusalén; otros relacionan a los harodeos con la fuente de Harod en el valle de Jezreel, donde Gedeón acampó antes de su ataque nocturno contra Madián. Ninguna de las dos opiniones se apoya en más que el nombre, y ninguna excavación lo ha resuelto."
  pt:
    - "Harode só é conhecida pelos homens que dela receberam o nome. Na lista dos valentes de Davi, dois dos trinta estão lado a lado: “Samá, o harodita, Elica, o harodita”. A lista paralela de Crônicas tem “Samote, o harorita”, diferença de uma letra no hebraico que a maioria dos estudiosos explica como lapso de copista por harodita; Elica falta ali. A Bíblia nunca nomeia a própria cidade, e nada se conta de nenhum dos dois homens além de seu lugar na lista."
    - "Onde ficava Harode é desconhecido. Como vários heróis de Davi vinham das aldeias em torno de Belém e Jerusalém, alguns a procuram em Judá, e o mapa segue a proposta de Khirbet el-Harazan, uma ruína a sudeste de Jerusalém; outros ligam os haroditas à fonte de Harode no vale de Jezreel, onde Gideão acampou antes de seu ataque noturno a Midiã. Nenhuma das visões repousa em mais do que o nome, e nenhuma escavação resolveu a questão."
  de:
    - "Harod ist nur durch die nach ihm benannten Männer bekannt. In der Liste von Davids Helden stehen zwei der Dreißig nebeneinander: „Samma, der Haroditer; Elika, der Haroditer“. Die Parallelliste der Chronik hat „Sammoth, der Haroriter“, ein Ein-Buchstaben-Unterschied im Hebräischen, den die meisten Forscher als Abschreibfehler für Haroditer erklären; Elika fehlt dort. Die Bibel nennt die Stadt selbst nie, und von beiden Männern wird nichts erzählt außer ihrem Platz in der Liste."
    - "Wo Harod lag, ist unbekannt. Da mehrere von Davids Helden aus den Dörfern um Bethlehem und Jerusalem stammten, suchen manche es in Juda, und die Karte folgt dem Vorschlag Chirbet el-Harazan, einer Ruine südöstlich von Jerusalem; andere verbinden die Haroditer mit der Quelle Harod im Jesreeltal, wo Gideon vor seinem nächtlichen Angriff auf Midian lagerte. Keine der Ansichten beruht auf mehr als dem Namen, und keine Grabung hat entschieden."
  fr:
    - "Harod n’est connue que par les hommes qui en portent le nom. Dans la liste des vaillants de David, deux des trente se tiennent côte à côte : « Schamma, de Harod. Élika, de Harod. » La liste parallèle des Chroniques porte « Schammoth, d’Haror », une différence d’une lettre en hébreu que la plupart des spécialistes expliquent par une erreur de copiste pour Harodite ; Élika y manque. La Bible ne nomme jamais la ville elle-même, et l’on ne dit rien de l’un ni de l’autre homme au-delà de sa place dans la liste."
    - "On ignore où se trouvait Harod. Plusieurs héros de David venant des villages autour de Bethléem et de Jérusalem, certains la cherchent en Juda, et la carte suit la proposition de Khirbet el-Harazan, une ruine au sud-est de Jérusalem ; d’autres rattachent les Harodites à la source de Harod dans la vallée de Jizreel, où Gédéon campa avant son attaque nocturne contre Madian. Aucune de ces vues ne repose sur plus que le nom, et aucune fouille n’a tranché."
