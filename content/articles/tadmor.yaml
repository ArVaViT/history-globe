# Overview article (ADR 0007). Mainstream facts only; Tadmor of Chronicles is Palmyra; whether 1 Kings 9:18 originally meant Tamar in the south is disputed and both readings are given.
id: tadmor
place: ad797fe
title:
  en: "Tadmor"
  ru: "Фадмор"
  uk: "Тадмор"
  es: "Tadmor"
  pt: "Tadmor"
  de: "Tadmor"
  fr: "Thadmor"
  it: "Tadmor"
