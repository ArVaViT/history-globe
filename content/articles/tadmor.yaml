body:
  en:
    - "Tadmor is the oasis the Greeks and Romans called Palmyra, in the Syrian desert about 215 km north-east of Damascus, where the Efqa spring made a halt possible on the route between the Euphrates and the west. The old name is the older one: tablets from Mari in the eighteenth century BC already name Tadmer, and about 1100 BC Tiglath-pileser I of Assyria wrote that he defeated the Aramaeans at Tadmar in the land of Amurru. Josephus says that Solomon built the city and called it Tadmor, “and that is the name it is still called by at this day among the Syrians, but the Greeks name it Palmyra”."
    - "Chronicles counts it among Solomon's works in the north: “And he built Tadmor in the wilderness, and all the store cities, which he built in Hamath.” The parallel in 1 Kings 9:18 has “Baalath, and Tadmor in the wilderness, in the land”; there the written Hebrew text has Tamar and the reading tradition Tadmor, and the King James and Synodal versions follow Tadmor. Since Kings lists the town beside southern places, many scholars take Kings to mean Tamar in the south of Judah and see Tadmor as the Chronicler's reading; others, following Josephus, take Solomon's city in both books to be Palmyra."
    - "Palmyra's great age came in the first three centuries AD as a caravan city between Rome and Parthia: the temple of Bel was dedicated in AD 32, and in the third century Odaenathus and his widow Zenobia made it the centre of a short-lived empire, until Aurelian took the city in 272 and destroyed it after a revolt in 273. The ruins were inscribed on the UNESCO World Heritage List in 1980; in 2015 the Islamic State group blew up the temple of Baalshamin and the sanctuary of the temple of Bel. Beside the ruins stands the Syrian town of Tadmur, which keeps the ancient name."
  ru:
    - "Фадмор — оазис, который греки и римляне называли Пальмирой, в Сирийской пустыне примерно в 215 км к северо-востоку от Дамаска, где источник Эфка позволял сделать стоянку на пути между Евфратом и западом. Местное имя — более древнее: таблички из Мари XVIII в. до н. э. уже называют Тадмер, а ок. 1100 г. до н. э. ассирийский царь Тиглатпаласар I писал, что разбил арамеев у Тадмара в стране Амурру. Иосиф Флавий сообщает, что Соломон построил город и назвал его Фадмор; так его до сих пор зовут сирийцы, а греки называют Пальмирой."
    - "Паралипоменон относит его к делам Соломона на севере: «И построил он Фадмор в пустыне, и все города для запасов, какие основал в Емафе». Параллель в 3 Царств 9:18 — «и Ваалаф и Фадмор в пустыне»; там в писаном еврейском тексте стоит Тамар, а по чтению — Тадмор, и Синодальный перевод, как и английская Библия короля Якова, следует чтению Фадмор. Поскольку в Книге Царств город стоит рядом с южными местами, многие учёные считают, что там имелась в виду иудейская Тамара на юге, а Фадмор — прочтение летописца; другие, вслед за Иосифом Флавием, видят в городе Соломона в обеих книгах Пальмиру."
    - "Расцвет Пальмиры пришёлся на первые три века н. э., когда она была караванным городом между Римом и Парфией: храм Бела освящён в 32 г. н. э., а в III в. Оденат и его вдова Зенобия сделали её центром недолгой державы, пока Аврелиан не взял город в 272 г. и не разрушил его после восстания в 273 г. Руины в 1980 г. внесены в список Всемирного наследия ЮНЕСКО; в 2015 г. группировка «Исламское государство» взорвала храм Баалшамина и святилище храма Бела. Рядом с руинами стоит сирийский город Тадмур, сохранивший древнее имя."
  uk:
    - "Тадмор — оаза, яку греки й римляни називали Пальмірою, у Сирійській пустелі приблизно за 215 км на північний схід від Дамаска, де джерело Ефка давало змогу зупинитися на шляху між Євфратом і заходом. Давня назва — найстаріша: таблички з Марі XVIII ст. до н. е. вже називають Тадмер, а близько 1100 р. до н. е. ассирійський Тіглатпаласар I писав, що розбив арамеїв у Тадмарі в землі Амурру. Йосиф Флавій каже, що Соломон збудував місто й назвав його Тадмор, «і це ім'я воно й досі носить серед сирійців, а греки називають його Пальмірою»."
    - "Хроніки зараховують його до північних будов Соломона: «І збудував він Тадмор в пустинї, і всї міста про запаси, які позакладав в Ематї». У паралельному місці, 1 Царів 9:18, є «Баалам і Тадмор… в пустинї»; там писаний єврейський текст має Тамар, а традиція читання — Тадмор, і Біблія короля Якова та Синодальна Біблія йдуть за Тадмором. Оскільки Книга Царів згадує місто поряд із південними місцями, багато вчених вважають, що там ідеться про Тамар на півдні Юдеї, а Тадмор — прочитання Літописця; інші, услід за Йосифом Флавієм, вважають місто Соломона в обох книгах Пальмірою."
    - "Розквіт Пальміри припав на перші три століття н. е., коли вона була караванним містом між Римом і Парфією: храм Бела освятили 32 р. н. е., а в III ст. Оденат і його вдова Зенобія зробили її центром недовговічної імперії, аж доки Авреліан 272 р. не взяв місто й не зруйнував його після повстання 273 р. Руїни внесено до Списку всесвітньої спадщини ЮНЕСКО 1980 р.; 2015 р. угруповання «Ісламська держава» підірвало храм Баалшаміна та святилище храму Бела. Поряд із руїнами стоїть сирійське місто Тадмур, що зберігає давню назву."
  es:
    - "Tadmor es el oasis que griegos y romanos llamaron Palmira, en el desierto de Siria, unos 215 km al noreste de Damasco, donde el manantial de Efqa hacía posible una parada en la ruta entre el Éufrates y el occidente. El nombre antiguo es el más antiguo: tablillas de Mari del siglo XVIII a. C. ya nombran Tadmer, y hacia 1100 a. C. Tiglat-pileser I de Asiria escribió que derrotó a los arameos en Tadmar, en la tierra de Amurru. Josefo dice que Salomón edificó la ciudad y la llamó Tadmor, «y ese es el nombre con que todavía hoy se la llama entre los sirios, pero los griegos la llaman Palmira»."
    - "Crónicas la cuenta entre las obras de Salomón en el norte: «Y edificó á Tadmor en el desierto, y todas las ciudades de municiones que edificó en Hamath». El paralelo de 1 Reyes 9:18 tiene «Y á Baalath, y á Tadmor en tierra del desierto»; allí el texto hebreo escrito tiene Tamar y la tradición de lectura Tadmor, y las versiones King James y sinodal siguen Tadmor. Como Reyes enumera la ciudad junto a lugares del sur, muchos estudiosos entienden que Reyes se refiere a Tamar, en el sur de Judá, y ven Tadmor como la lectura del cronista; otros, siguiendo a Josefo, toman la ciudad de Salomón en ambos libros por Palmira."
    - "La gran época de Palmira llegó en los tres primeros siglos d. C. como ciudad caravanera entre Roma y Partia: el templo de Bel fue dedicado en 32 d. C., y en el siglo III Odenato y su viuda Zenobia hicieron de ella el centro de un imperio efímero, hasta que Aureliano tomó la ciudad en 272 y la destruyó tras una revuelta en 273. Las ruinas fueron inscritas en la lista del Patrimonio Mundial de la UNESCO en 1980; en 2015 el grupo Estado Islámico voló el templo de Baalshamin y el santuario del templo de Bel. Junto a las ruinas se alza la ciudad siria de Tadmur, que conserva el nombre antiguo."
  pt:
    - "Tadmor é o oásis que gregos e romanos chamavam Palmira, no deserto da Síria, a cerca de 215 km a nordeste de Damasco, onde a nascente de Efqa tornava possível uma parada na rota entre o Eufrates e o oeste. O nome antigo é o mais velho: tabuinhas de Mari do século XVIII a.C. já mencionam Tadmer, e por volta de 1100 a.C. Tiglate-Pileser I da Assíria escreveu que derrotou os arameus em Tadmar, na terra de Amurru. Josefo diz que Salomão construiu a cidade e a chamou Tadmor, “e esse é o nome pelo qual ainda hoje é chamada entre os sírios, mas os gregos a chamam Palmira”."
    - "Crônicas a conta entre as obras de Salomão no norte: “Ele edificou Tadmor no deserto, e todas as cidades-armazém, que ele edificou em Hamate.” O paralelo em 1 Reis 9:18 menciona Baalate e, no deserto, Tamar na Bíblia em português, que segue o texto hebraico escrito; a tradição de leitura traz Tadmor, e as versões King James e sinodal seguem Tadmor. Como Reis lista a cidade ao lado de lugares do sul, muitos estudiosos entendem que Reis se refere a Tamar, no sul de Judá, e veem Tadmor como a leitura do Cronista; outros, seguindo Josefo, tomam a cidade de Salomão em ambos os livros por Palmira."
    - "A grande época de Palmira veio nos três primeiros séculos d.C. como cidade caravaneira entre Roma e a Pártia: o templo de Bel foi dedicado em 32 d.C., e no século III Odenato e sua viúva Zenóbia fizeram dela o centro de um império efêmero, até que Aureliano tomou a cidade em 272 e a destruiu depois de uma revolta em 273. As ruínas foram inscritas na Lista do Patrimônio Mundial da UNESCO em 1980; em 2015 o grupo Estado Islâmico explodiu o templo de Baal Shamin e o santuário do templo de Bel. Ao lado das ruínas fica a cidade síria de Tadmur, que conserva o nome antigo."
  de:
    - "Tadmor ist die Oase, die die Griechen und Römer Palmyra nannten, in der syrischen Wüste etwa 215 km nordöstlich von Damaskus, wo die Quelle Efqa einen Halt auf der Route zwischen dem Euphrat und dem Westen möglich machte. Der alte Name ist der ältere: Tafeln aus Mari im achtzehnten Jahrhundert v. Chr. nennen schon Tadmer, und um 1100 v. Chr. schrieb Tiglat-Pileser I. von Assyrien, er habe die Aramäer bei Tadmar im Land Amurru besiegt. Josephus sagt, Salomo habe die Stadt erbaut und Tadmor genannt, „und das ist der Name, den sie noch heute bei den Syrern trägt, die Griechen aber nennen sie Palmyra“."
    - "Die Chronik zählt sie zu Salomos Bauten im Norden: „und baute Thadmor in der Wüste und alle Kornstädte, die er baute in Hamath“. Die Parallelstelle 1. Könige 9,18 hat „Baalath und Thamar in der Wüste im Lande“; dort hat der geschriebene hebräische Text Tamar und die Lesetradition Tadmor, und die King-James-Bibel und die Synodalübersetzung folgen Tadmor. Da das Buch der Könige die Stadt neben südlichen Orten aufführt, nehmen viele Gelehrte an, es meine Tamar im Süden Judas, und sehen in Tadmor die Lesart des Chronisten; andere halten im Anschluss an Josephus Salomos Stadt in beiden Büchern für Palmyra."
    - "Palmyras große Zeit kam in den ersten drei Jahrhunderten n. Chr. als Karawanenstadt zwischen Rom und Parthien: Der Tempel des Bel wurde 32 n. Chr. geweiht, und im dritten Jahrhundert machten Odainat und seine Witwe Zenobia sie zum Zentrum eines kurzlebigen Reiches, bis Aurelian die Stadt 272 einnahm und nach einem Aufstand 273 zerstörte. Die Ruinen wurden 1980 in die UNESCO-Welterbeliste eingetragen; 2015 sprengte die Gruppe Islamischer Staat den Tempel des Baalschamin und das Heiligtum des Bel-Tempels. Neben den Ruinen liegt die syrische Stadt Tadmur, die den antiken Namen bewahrt."
  fr:
    - "Thadmor est l’oasis que les Grecs et les Romains appelaient Palmyre, dans le désert de Syrie, à quelque 215 km au nord-est de Damas, où la source d’Efqa rendait possible une halte sur la route entre l’Euphrate et l’Occident. Le nom ancien est le plus ancien : des tablettes de Mari du XVIIIe siècle av. J.-C. nomment déjà Tadmer, et vers 1100 av. J.-C. Tiglath-Piléser Ier d’Assyrie écrivit avoir vaincu les Araméens à Tadmar, dans le pays d’Amurru. Josèphe dit que Salomon bâtit la ville et l’appela Thadmor, « et c’est le nom qu’elle porte encore aujourd’hui chez les Syriens, mais les Grecs la nomment Palmyre »."
    - "Les Chroniques la comptent parmi les ouvrages de Salomon dans le nord : « Il bâtit Thadmor au désert, et toutes les villes servant de magasins en Hamath. » Le passage parallèle de 1 Rois 9:18 porte « Baalath, et Thadmor, au désert dans le pays » ; là, le texte hébreu écrit porte Tamar et la tradition de lecture Thadmor, et la Bible du roi Jacques et la Bible synodale suivent Thadmor. Comme les Rois énumèrent la ville parmi des lieux du sud, beaucoup d’exégètes comprennent que les Rois désignent Tamar, dans le sud de Juda, et voient dans Thadmor la leçon du Chroniqueur ; d’autres, à la suite de Josèphe, tiennent la ville de Salomon, dans les deux livres, pour Palmyre."
    - "Le grand âge de Palmyre vint aux trois premiers siècles de notre ère, comme cité caravanière entre Rome et les Parthes : le temple de Bel fut consacré en 32 apr. J.-C., et au IIIe siècle Odénat et sa veuve Zénobie en firent le centre d’un empire éphémère, jusqu’à ce qu’Aurélien prenne la ville en 272 et la détruise après une révolte en 273. Les ruines furent inscrites sur la Liste du patrimoine mondial de l’UNESCO en 1980 ; en 2015, le groupe État islamique fit sauter le temple de Baalshamin et le sanctuaire du temple de Bel. À côté des ruines se dresse la ville syrienne de Tadmur, qui garde le nom antique."
  it:
    - "Tadmor è l’oasi che Greci e Romani chiamavano Palmira, nel deserto siriano a circa 215 km a nord-est di Damasco, dove la sorgente di Efqa rendeva possibile una sosta sulla via tra l’Eufrate e l’occidente. Il nome antico è il più antico: tavolette di Mari del XVIII secolo a.C. nominano già Tadmer, e verso il 1100 a.C. Tiglat-Pileser I d’Assiria scrisse di aver sconfitto gli Aramei a Tadmar nel paese di Amurru. Giuseppe Flavio dice che Salomone costruì la città e la chiamò Tadmor, «e questo è il nome con cui ancora oggi la chiamano i Siri, mentre i Greci la chiamano Palmira»."
    - "Le Cronache la annoverano tra le opere di Salomone nel nord: «E ricostruì Tadmor nella parte deserta del paese, e tutte le città di rifornimento in Hamath». Il passo parallelo di 1 Re 9,18 ha «Baalath e Tadmor nella parte deserta del paese»; qui il testo ebraico scritto ha Tamar e la tradizione di lettura Tadmor, e le versioni King James e sinodale seguono Tadmor. Poiché il libro dei Re elenca la città accanto a località meridionali, molti studiosi ritengono che i Re intendano Tamar nel sud di Giuda e vedono in Tadmor la lettura del Cronista; altri, seguendo Giuseppe Flavio, ritengono che la città di Salomone in entrambi i libri sia Palmira."
    - "La grande età di Palmira venne nei primi tre secoli d.C. come città carovaniera tra Roma e la Partia: il tempio di Bel fu dedicato nel 32 d.C., e nel III secolo Odenato e la sua vedova Zenobia ne fecero il centro di un impero di breve durata, finché Aureliano prese la città nel 272 e la distrusse dopo una rivolta nel 273. Le rovine furono iscritte nella lista del patrimonio mondiale dell’UNESCO nel 1980; nel 2015 il gruppo Stato islamico fece saltare il tempio di Baalshamin e il santuario del tempio di Bel. Accanto alle rovine sorge la città siriana di Tadmur, che conserva il nome antico."
  nl:
    - "Tadmor is de oase die de Grieken en Romeinen Palmyra noemden, in de Syrische woestijn ongeveer 215 km ten noordoosten van Damascus, waar de bron Efqa een halte mogelijk maakte op de route tussen de Eufraat en het westen. De oude naam is de oudere: tabletten uit Mari uit de achttiende eeuw v.Chr. noemen al Tadmer, en omstreeks 1100 v.Chr. schreef Tiglat-Pileser I van Assyrië dat hij de Arameeërs bij Tadmar in het land Amurru versloeg. Josephus zegt dat Salomo de stad bouwde en haar Tadmor noemde, “en dat is de naam waarmee zij tot op de dag van vandaag onder de Syriërs heet, maar de Grieken noemen haar Palmyra”."
    - "Kronieken rekent haar tot Salomo's werken in het noorden: “Hij bouwde ook Thadmor in de woestijn, en al de schatsteden, die hij bouwde in Hamath.” De parallel in 1 Koningen 9:18 noemt Baälat en Tadmor in de woestijn in het land; daar heeft de geschreven Hebreeuwse tekst Tamar en de leestraditie Tadmor, en de King James Version en de Synodale Bijbel volgen Tadmor. Omdat Koningen de stad naast zuidelijke plaatsen noemt, menen veel geleerden dat Koningen Tamar in het zuiden van Juda bedoelt en zien zij Tadmor als de lezing van de Kroniekschrijver; anderen nemen met Josephus aan dat Salomo's stad in beide boeken Palmyra is."
    - "Palmyra's grote tijd kwam in de eerste drie eeuwen n.Chr. als karavaanstad tussen Rome en Parthië: de tempel van Bel werd in 32 n.Chr. ingewijd, en in de derde eeuw maakten Odaenathus en zijn weduwe Zenobia haar tot het centrum van een kortstondig rijk, tot Aurelianus de stad in 272 innam en haar na een opstand in 273 verwoestte. De ruïnes werden in 1980 op de werelderfgoedlijst van UNESCO geplaatst; in 2015 liet de groep Islamitische Staat de tempel van Baalshamin en het heiligdom van de tempel van Bel opblazen. Naast de ruïnes ligt de Syrische stad Tadmur, die de oude naam bewaart."
  pl:
    - "Tadmor to oaza, którą Grecy i Rzymianie nazywali Palmyrą, na pustyni syryjskiej około 215 km na północny wschód od Damaszku, gdzie źródło Efka umożliwiało postój na szlaku między Eufratem a Zachodem. Stara nazwa jest starsza: tabliczki z Mari z XVIII w. p.n.e. wymieniają już Tadmer, a około 1100 p.n.e. Tiglat-Pileser I z Asyrii zapisał, że pokonał Aramejczyków w Tadmar w kraju Amurru. Józef Flawiusz mówi, że Salomon zbudował miasto i nazwał je Tadmor, „a tak nazywa się ono do dziś wśród Syryjczyków, Grecy zaś zwą je Palmyrą”."
    - "Kroniki zaliczają je do dzieł Salomona na północy: „Pobudował też Tadmor na puszczy, i wszystkie miasta, w których miał składy, pobudował w Emat”. Paralelny fragment 1 Krl 9,18 ma „Baalat i Tadmor na puszczy w tejże ziemi”; w tym miejscu zapisany tekst hebrajski ma Tamar, a tradycja czytania Tadmor, i przekłady: Króla Jakuba oraz synodalny idą za Tadmor. Ponieważ Księgi Królewskie wymieniają miasto obok miejscowości południowych, wielu uczonych sądzi, że Księgi Królewskie mają na myśli Tamar na południu Judy, a Tadmor uważa za odczytanie Kronikarza; inni, idąc za Józefem Flawiuszem, uważają, że miasto Salomona w obu księgach to Palmyra."
    - "Wielki rozkwit Palmyry przypadł na pierwsze trzy wieki n.e. jako miasta karawan między Rzymem a Partią: świątynię Bela poświęcono w 32 r. n.e., a w III wieku Odenat i jego wdowa Zenobia uczynili z niej ośrodek krótkotrwałego imperium, aż Aurelian zajął miasto w 272 roku i zniszczył je po buncie w 273. Ruiny wpisano na listę światowego dziedzictwa UNESCO w 1980 roku; w 2015 roku Państwo Islamskie wysadziło świątynię Baalszamina i sanktuarium świątyni Bela. Obok ruin leży syryjskie miasto Tadmur, które zachowuje starożytną nazwę."
  cs:
    - "Tadmor je oáza, kterou Řekové a Římané nazývali Palmýra, v syrské poušti asi 215 km severovýchodně od Damašku, kde pramen Efka umožňoval zastávku na cestě mezi Eufratem a západem. Staré jméno je jméno starší: tabulky z Mari z osmnáctého století př. n. l. už jmenují Tadmer a kolem roku 1100 př. n. l. napsal Tiglatpilesar I. Asyrský, že porazil Aramejce v Tadmaru v zemi Amurru. Josephus Flavius říká, že Šalomoun město vystavěl a nazval je Tadmor, „a tak se mu dodnes říká u Syřanů, ale Řekové je nazývají Palmýra“."
    - "Paralipomenon ho počítá mezi Šalomounova díla na severu: „I ustavěl Tadmor na poušti, a všecka města skladů vystavěl v Emat.“ Souběžné místo v 1. Královské 9,18 má „Baalat a Tadmor na poušti v též zemi“; tam hebrejský psaný text má Tamar a tradice čtení Tadmor a Bible krále Jakuba i synodální překlad následují Tadmor. Protože Královské uvádějí město vedle jižních míst, mnozí badatelé míní, že Královské mají na mysli Tamar na jihu Judska, a Tadmor pokládají za čtení Paralipomena; jiní podle Josepha pokládají Šalomounovo město v obou knihách za Palmýru."
    - "Velký věk Palmýry nastal v prvních třech stoletích n. l. jako karavanního města mezi Římem a Parthií: chrám Bélův byl zasvěcen roku 32 n. l. a ve třetím století z ní Odainathos a jeho vdova Zenobie učinili středisko krátce trvající říše, až Aurelianus město roku 272 dobyl a po povstání roku 273 zničil. Zříceniny byly zapsány na seznam světového dědictví UNESCO roku 1980; roku 2015 vyhodila skupina Islámský stát do povětří chrám Baalšamin a svatyni chrámu Bélova. Vedle zřícenin stojí syrské město Tadmur, které si starověké jméno zachovalo."
  sv:
    - "Tadmor är oasen som greker och romare kallade Palmyra, i den syriska öknen omkring 215 km nordost om Damaskus, där källan Efqa gjorde ett uppehåll möjligt på vägen mellan Eufrat och västern. Det gamla namnet är det äldre: tavlor från Mari på 1700-talet f.Kr. nämner redan Tadmer, och omkring 1100 f.Kr. skrev Tiglat-Pileser I av Assyrien att han besegrade arameerna vid Tadmar i Amurru. Josefus säger att Salomo byggde staden och kallade den Tadmor, ”och det är det namn som den ännu i dag bär bland syrierna, medan grekerna kallar den Palmyra”."
    - "Krönikeboken räknar den bland Salomos verk i norr: ”Och han byggde upp Tadmor i öknen och alla de förrådsstäder som i Hamat äro byggda av honom.” Parallellstället i 1 Kung 9:18 har ”Baalat och Tamar i öknen där i landet”; där har den skrivna hebreiska texten Tamar och läsetraditionen Tadmor, och King James- och den synodala bibeln följer Tadmor. Eftersom Kungaboken räknar upp staden bland sydliga platser menar många forskare att Kungaboken avser Tamar i södra Juda och ser Tadmor som Krönikebokens läsning; andra, som följer Josefus, menar att Salomos stad i båda böckerna är Palmyra."
    - "Palmyras storhetstid kom under de tre första århundradena e.Kr. som karavanstad mellan Rom och Parthien: Bels tempel invigdes år 32 e.Kr., och på 200-talet gjorde Odaenathus och hans änka Zenobia den till centrum för ett kortlivat rike, tills Aurelianus intog staden 272 och förstörde den efter ett uppror 273. Ruinerna skrevs in på Unescos världsarvslista 1980; 2015 sprängde Islamiska staten Baalshamins tempel och helgedomen i Bels tempel. Bredvid ruinerna ligger den syriska staden Tadmur, som bevarar det antika namnet."
  nb:
    - "Tadmor er oasen som grekerne og romerne kalte Palmyra, i den syriske ørkenen omkring 215 km nordøst for Damaskus, der Efqa-kilden gjorde et opphold mulig på ruten mellom Eufrat og vest. Det gamle navnet er det eldste: tavler fra Mari på 1700-tallet f.Kr. nevner allerede Tadmer, og omkring 1100 f.Kr. skrev Tiglat-Pileser I av Assyria at han slo arameerne ved Tadmar i landet Amurru. Josefus sier at Salomo bygde byen og kalte den Tadmor, «og det er navnet den fortsatt kalles med i dag blant syrerne, men grekerne kaller den Palmyra»."
    - "Krønikebøkene regner den blant Salomos byggverk i nord: «Han bygget også op Tadmor i ørkenen og alle de oplagsbyer han har bygget i Hamat». Parallellstedet i 1 Kong 9,18 har «og Ba'alat og Tadmor i ørkenen der i landet»; der har den skrevne hebraiske teksten Tamar og lesetradisjonen Tadmor, og King James-oversettelsen og synodalbibelen følger Tadmor. Siden Kongebøkene oppfører byen ved siden av sørlige steder, mener mange forskere at Kongebøkene mener Tamar i den sørlige delen av Juda og ser Tadmor som kronikerens lesemåte; andre, i tråd med Josefus, mener at Salomos by i begge bøker er Palmyra."
    - "Palmyras storhetstid kom i de tre første århundrene e.Kr. som karavaneby mellom Roma og Partia: Bel-tempelet ble viet i 32 e.Kr., og på 200-tallet gjorde Odenathos og enken hans Zenobia den til sentrum for et kortvarig rike, til Aurelian inntok byen i 272 og ødela den etter et opprør i 273. Ruinene ble tatt opp på UNESCOs verdensarvliste i 1980; i 2015 sprengte gruppen Den islamske stat Baalshamin-tempelet og helligdommen i Bel-tempelet. Ved siden av ruinene ligger den syriske byen Tadmur, som bevarer det gamle navnet."
  tl:
    - "Ang Tadmor ay ang oasis na tinawag ng mga Griego at Romano na Palmyra, sa disyerto ng Siria mga 215 km sa hilagang-silangan ng Damasco, kung saan ang bukal ng Efqa ang nagpahintulot ng paghinto sa ruta sa pagitan ng Eufrates at ng kanluran. Ang lumang pangalan ang mas matanda: ang mga tableta mula sa Mari noong ika-18 siglo BK ay nagpapangalan na ng Tadmer, at noong mga 1100 BK isinulat ni Tiglath-pileser I ng Asiria na tinalo niya ang mga Arameo sa Tadmar sa lupain ng Amurru. Sinasabi ni Josefo na itinayo ni Salomon ang lunsod at tinawag itong Tadmor, “at iyon pa rin ang pangalang itinatawag dito hanggang ngayon ng mga Siriano, ngunit tinatawag itong Palmyra ng mga Griego”."
    - "Binibilang ito ng Mga Cronica sa mga gawa ni Salomon sa hilaga: “At kaniyang itinayo ang Tadmor sa ilang, at lahat na bayan na imbakan na kaniyang itinayo sa Hamath.” Ang kahalintulad sa 1 Mga Hari 9:18 ay may “Baalath, at ang Tamar sa ilang, sa lupain”; doon ang nakasulat na tekstong Hebreo ay may Tamar at ang tradisyon ng pagbasa ay Tadmor, at sinusunod ng mga salin ng King James at Synodal ang Tadmor. Yamang itinatala ng Mga Hari ang bayan sa tabi ng mga lugar sa timog, maraming iskolar ang naniniwalang ang Mga Hari ay tumutukoy sa Tamar sa timog ng Juda at itinuturing ang Tadmor na pagbasa ng Tagapagtala; ang iba, na sumusunod kay Josefo, ay naniniwalang ang lunsod ni Salomon sa dalawang aklat ay ang Palmyra."
    - "Ang dakilang kapanahunan ng Palmyra ay dumating sa unang tatlong siglo AD bilang lunsod ng mga caravan sa pagitan ng Roma at Parthia: ang templo ni Bel ay itinalaga noong 32 AD, at noong ikatlong siglo ay ginawa ito nina Odaenathus at ng kaniyang balo na si Zenobia na sentro ng isang panandaliang imperyo, hanggang sakupin ni Aureliano ang lunsod noong 272 at wasakin ito pagkatapos ng paghihimagsik noong 273. Ang mga guho ay isinama sa Talaan ng Pamanang Pandaigdig ng UNESCO noong 1980; noong 2015, pinasabog ng pangkat na Islamic State ang templo ni Baalshamin at ang santuwaryo ng templo ni Bel. Sa tabi ng mga guho ay nakatayo ang bayang Siriano ng Tadmur, na nagpapanatili ng sinaunang pangalan."
  da:
    - "Tadmor er oasen, som grækerne og romerne kaldte Palmyra, i den syriske ørken omkring 215 km nordøst for Damaskus, hvor Efqa-kilden gjorde et ophold muligt på ruten mellem Eufrat og vest. Det gamle navn er det ældste: tavler fra Mari i 1700-tallet f.Kr. nævner allerede Tadmer, og omkring 1100 f.Kr. skrev Tiglat-Pileser 1. af Assyrien, at han havde besejret arameerne ved Tadmar i Amurru-landet. Josefus siger, at Salomo byggede byen og kaldte den Tadmor, »og det er det navn, hvormed den stadig kaldes den dag i dag blandt syrerne, men grækerne kalder den Palmyra«."
    - "Krønikebøgerne regner den blandt Salomos værker i nord: »Han byggede og Thadmor i Ørken og alle de Forraadsstæder, som han byggede i Hamath.« Parallelstedet i 1 Kong 9,18 har »og Baalath og Thadmor i Ørken udi Landet«; dér har den skrevne hebraiske tekst Tamar og læsetraditionen Tadmor, og King James-oversættelsen og Synodalbibelen følger Tadmor. Da Kongebøgerne opfører byen ved siden af sydlige steder, tager mange forskere Kongebøgerne til at mene Tamar i det sydlige Juda og ser Tadmor som Krønikeskriverens læsning; andre tager i tråd med Josefus Salomos by i begge bøger for at være Palmyra."
    - "Palmyras storhedstid kom i de første tre århundreder e.Kr. som karavaneby mellem Rom og Parthien: Bel-templet blev indviet i 32 e.Kr., og i 200-tallet gjorde Odaenathus og hans enke Zenobia den til centrum for et kortvarigt rige, indtil Aurelian indtog byen i 272 og ødelagde den efter et oprør i 273. Ruinerne blev optaget på UNESCOs verdensarvsliste i 1980; i 2015 sprængte gruppen Islamisk Stat Baalshamin-templet og helligdommen i Bels tempel i luften. Ved siden af ruinerne ligger den syriske by Tadmur, som har bevaret det gamle navn."
  sr:
    - "Тадмор је оаза коју су Грци и Римљани звали Палмира, у сиријској пустињи око 215 км североисточно од Дамаска, где је извор Афка омогућавао одмор на путу између Еуфрата и запада. Старо име је старије: плочице из Марија из 18. века п. н. е. већ именују Тадмер, а око 1100. п. н. е. асирски цар Теглат-Феласар I писао је да је победио Арамејце код Тадмара у земљи Амуру. Јосиф Флавије каже да је Соломун сазидао град и назвао га Тадмор, „и то је име које и данас носи међу Сиријцима, а Грци га зову Палмира“."
    - "Летописи га убрајају у Соломунове радове на северу: „И сазида Тадмор у пустињи и све градове за житнице сазида у Емату“. Паралела у 1. Цар 9,18 има „Валат и Тадмор у пустињи у земљи“; ту писани хебрејски текст има Тамар, а традиција читања Тадмор, а Верзија краља Јакова и руска синодална Библија следе Тадмор. Пошто Цареви наводе град уз јужна места, многи научници сматрају да Цареви мисле на Тамару на југу Јуде, а Тадмор виде као читање Летописца; други, следећи Јосифа Флавија, мисле да је Соломонов град у обе књиге Палмира."
    - "Велико доба Палмире дошло је у прва три века н. е. као карванског града између Рима и Партије: храм Бела посвећен је 32. н. е., а у 3. веку Оденат и његова удовица Зенобија учинили су је средиштем краткотрајног царства, све док Аурелијан није заузео град 272. и разорио га после побуне 273. Рушевине су уписане на УНЕСКО-ву листу светске баштине 1980; 2015. је група Исламске државе дигла у ваздух храм Баалшамина и светилиште храма Бела. Уз рушевине стоји сиријски град Тадмур, који чува старо име."
  hu:
    - "Tadmor az az oázis, amelyet a görögök és a rómaiak Palmürának neveztek, a szíriai sivatagban, Damaszkusztól mintegy 215 km-re északkeletre, ahol az Efka-forrás lehetővé tette a pihenőt az Eufrátesz és a nyugat közötti úton. A régi név a régebbi: a Kr. e. 18. századi mári táblák már megnevezik Tadmert, és Kr. e. 1100 körül I. Tiglat-Pileszer asszír király azt írta, hogy Amurru földjén, Tadmarnál legyőzte az arámiakat. Josephus szerint Salamon építette a várost, és Tadmornak nevezte, „és ez a név ma is használatos a szírek között, a görögök pedig Palmürának nevezik”."
    - "A Krónikák Salamon északi építkezései közé számítja: „megépíté Tádmort a pusztában, és minden kincstartó városokat, a melyeket Hámátban épített.” A párhuzamos hely, az 1Kir 9,18 „Bahalátot és Thadmort a pusztában, azon a földön” említi; ott az írott héber szöveg Tamart, az olvasási hagyomány Tadmort ad, a King James-fordítás és a szinodális fordítás pedig Tadmort követi. Mivel a Királyok könyve a várost déli helyek mellett sorolja fel, sok tudós szerint a Királyok Tamart jelent Júda déli részén, és Tadmort a Krónikák szerzőjének olvasatának tartja; mások Josephust követve mindkét könyvben Salamon városát Palmürának tartják."
    - "Palmüra nagy kora a Kr. u. első három évszázad volt, mint Róma és Pártia közötti karavánváros: Bel temploma Kr. u. 32-ben nyert felszentelést, a 3. században Odaenathus és özvegye, Zénóbia rövid életű birodalom központjává tette, míg Aurelianus 272-ben be nem vette a várost, és egy lázadás után 273-ban el nem pusztította. A romokat 1980-ban felvették az UNESCO Világörökség listájára; 2015-ben az Iszlám Állam csoport felrobbantotta a Baalsamin templomát és a Bel-templom szentélyét. A romok mellett áll Tadmur szíriai városa, amely megőrizte az ókori nevet."
  fi:
    - "Tadmor on keidas, jota kreikkalaiset ja roomalaiset kutsuivat Palmyraksi, Syyrian aavikolla noin 215 km Damaskoksesta koilliseen, missä Efqan lähde teki pysähdyksen mahdolliseksi Eufratin ja lännen välisellä reitillä. Vanha nimi on vanhempi: Marin 1700-luvun eaa. taulut mainitsevat jo Tadmerin, ja noin 1100 eaa. Assyrian Tiglat-Pileser I kirjoitti voittaneensa aramilaiset Tadmarissa Amurrun maassa. Josefus sanoo, että Salomo rakensi kaupungin ja antoi sille nimen Tadmor, ”ja se on nimi, jolla syyrialaiset sitä yhä tänäkin päivänä kutsuvat, mutta kreikkalaiset nimittävät sitä Palmyraksi”."
    - "Aikakirjat lukevat sen Salomon pohjoisiin rakennustöihin: ”Hän linnoitti myös Tadmorin erämaassa ja kaikki varastokaupungit, jotka hän oli rakentanut Hamatiin.” Rinnakkaiskohdassa 1. Kuninkaiden kirjan 9:18 on ”Baalatin ja Taamarin sen maan erämaassa”; siinä kirjoitettu heprealainen teksti lukee Tamar ja lukutraditio Tadmor, ja King Jamesin ja synodaalinen käännös seuraavat Tadmoria. Koska Kuninkaiden kirja luettelee kaupungin eteläisten paikkojen rinnalla, monet tutkijat katsovat sen tarkoittavan Juudan eteläosan Tamaria ja pitävät Tadmoria Aikakirjojen kirjoittajan lukutapana; toiset Josefusta seuraten pitävät Salomon kaupunkia molemmissa kirjoissa Palmyrana."
    - "Palmyran suuri aika koitti jaa. ensimmäisinä kolmena vuosisatana karavaanikaupunkina Rooman ja Partian välillä: Belin temppeli vihittiin vuonna 32 jaa., ja 200-luvulla Odaenathus ja hänen leskensä Zenobia tekivät siitä lyhytikäisen valtakunnan keskuksen, kunnes Aurelianus valtasi kaupungin vuonna 272 ja tuhosi sen kapinan jälkeen vuonna 273. Rauniot merkittiin Unescon maailmanperintöluetteloon 1980; vuonna 2015 Islamilainen valtio -ryhmä räjäytti Baalshaminin temppelin ja Belin temppelin pyhäkön. Raunioiden vieressä on syyrialainen Tadmurin kaupunki, joka säilyttää muinaisen nimen."
  vi:
    - "Tát-mốt là ốc đảo mà người Hy Lạp và La Mã gọi là Palmyra, trong sa mạc Sy-ri cách Đa-mách khoảng 215 km về phía đông bắc, nơi suối Efqa làm cho việc dừng chân khả thi trên tuyến giữa sông Ơ-phơ-rát và phương tây. Tên cũ là tên xưa hơn: các bảng đất sét ở Mari thế kỷ 18 TCN đã nêu Tadmer, và khoảng năm 1100 TCN Tiếc-la-Phi-lê-se I của A-si-ri viết rằng ông đã đánh bại người A-ram tại Tadmar trong xứ Amurru. Josephus nói rằng Sa-lô-môn đã xây thành và gọi là Tát-mốt, “và đó là tên mà cho đến ngày nay người Sy-ri vẫn gọi nó, còn người Hy Lạp gọi nó là Palmyra”."
    - "Sách Sử Ký kể nó trong các công trình của Sa-lô-môn ở phương bắc: “Người xây thành Tát-mốt trong đồng vắng, và xây các thành dùng làm kho tàng tại xứ Ha-mát.” Câu song song trong 1 Các Vua 9:18 có “Ba-lát, và Tát-mốt, tại trong đất rừng của xứ”; ở đó bản văn Hê-bơ-rơ viết là Ta-ma còn truyền thống đọc là Tát-mốt, và các bản King James và Synodal theo Tát-mốt. Vì sách Các Vua kể thị trấn bên cạnh những nơi ở phía nam, nhiều học giả cho rằng Các Vua muốn nói Ta-ma ở nam Giu-đa và coi Tát-mốt là cách đọc của người viết Sử Ký; người khác, theo Josephus, cho rằng thành của Sa-lô-môn trong cả hai sách là Palmyra."
    - "Thời cực thịnh của Palmyra đến trong ba thế kỷ đầu Công nguyên như một thành lữ hành giữa Rô-ma và Parthia: đền Bel được cung hiến năm 32, và vào thế kỷ 3 Odaenathus cùng người vợ góa Zenobia biến nó thành trung tâm của một đế quốc ngắn ngủi, cho đến khi Aurelian chiếm thành năm 272 và phá hủy nó sau một cuộc nổi dậy năm 273. Tàn tích được ghi vào danh sách Di sản Thế giới của UNESCO năm 1980; năm 2015 nhóm Nhà nước Hồi giáo đánh bom đền Baalshamin và khu thánh của đền Bel. Bên cạnh tàn tích là thị trấn Tadmur của Sy-ri, còn giữ tên cổ."
  ro:
    - "Tadmor este oaza pe care grecii și romanii o numeau Palmira, în deșertul sirian, la circa 215 km nord-est de Damasc, unde izvorul Efqa făcea posibil un popas pe drumul dintre Eufrat și vest. Numele vechi este cel mai vechi: tăblițele de la Mari din secolul al XVIII-lea î.Hr. pomenesc deja Tadmer, iar pe la 1100 î.Hr. Tiglat-Pileser I al Asiriei a scris că i-a învins pe arameeni la Tadmar, în țara Amurru. Iosif Flaviu spune că Solomon a zidit cetatea și a numit-o Tadmor, „și acesta este numele cu care i se spune și astăzi la sirieni, dar grecii îi spun Palmira”."
    - "Cronicile o numără printre lucrările lui Solomon din nord: „Și a zidit Toedmorul în pustie și toate cetățile tari, care le-a zidit în Imat.” Paralela din 1 Regi 9:18 are „Valaadul și Tamorul în pustie”; acolo textul ebraic scris are Tamar, iar tradiția de citire Tadmor, iar versiunile King James și sinodală rusă urmează Tadmor. Fiindcă Regii o enumeră alături de locuri din sud, mulți cercetători socotesc că Regii înțeleg Tamar din sudul lui Iuda și văd în Tadmor citirea Cronicarului; alții, urmându-l pe Iosif Flaviu, socotesc că cetatea lui Solomon din ambele cărți este Palmira."
    - "Marea epocă a Palmirei a venit în primele trei secole d.Hr., ca oraș de caravane între Roma și Partia: templul lui Bel a fost sfințit în anul 32 d.Hr., iar în secolul al III-lea Odenat și văduva lui Zenobia au făcut din ea centrul unui imperiu efemer, până când Aurelian a luat cetatea în 272 și a distrus-o după o răscoală în 273. Ruinele au fost înscrise pe Lista Patrimoniului Mondial UNESCO în 1980; în 2015, gruparea Statul Islamic a aruncat în aer templul lui Baalșamin și sanctuarul templului lui Bel. Lângă ruine se află orașul sirian Tadmur, care păstrează numele antic."
  bg:
    - "Тадмор е оазисът, който гърците и римляните наричали Палмира, в Сирийската пустиня на около 215 км североизточно от Дамаск, където изворът Ефка правел възможна спирката по пътя между Ефрат и запада. Името Тадмор е по-старото: плочки от Мари от XVIII в. пр.н.е. вече назовават Тадмер, а около 1100 г. пр.н.е. асирийският цар Теглатфеласар I писал, че разбил арамейците при Тадмар в земята Амуру. Йосиф Флавий казва, че Соломон съградил града и го нарекъл Тадмор, „и с това име и до днес го наричат сирийците, а гърците го наричат Палмира“."
    - "Летописите го броят сред делата на Соломон на север: „И съгради Тадмор в пустинята, и всичките градове на житниците които съгради в Емат.“ Успоредното място в 3 Царе 9:18 гласи „и Ваалат, и Тадмор в пустинята на земята“; там писаният еврейски текст има Тамар, а традицията на четене — Тадмор, и King James Version и Синодалният превод следват Тадмор. Тъй като Царе изброява града до южни места, много учени смятат, че Царе има предвид Тамар в южната част на Юда, и виждат в Тадмор четенето на Летописеца; други, следвайки Йосиф Флавий, приемат, че Соломоновият град и в двете книги е Палмира."
    - "Великата епоха на Палмира настъпила през първите три века от н.е., когато била керванен град между Рим и Партия: храмът на Бел бил осветен през 32 г. н.е., а през III в. Оденат и вдовицата му Зенобия я превърнали в център на краткотрайна империя, докато Аврелиан не превзел града през 272 г. и не го разрушил след въстание през 273 г. Руините са вписани в Списъка на световното наследство на ЮНЕСКО през 1980 г.; през 2015 г. групировката „Ислямска държава“ взривила храма на Баалшамин и светилището на храма на Бел. До руините се намира сирийският град Тадмур, който пази древното име."
