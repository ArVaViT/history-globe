body:
  en:
    - "Addon (Addan in Ezra) is a place in Babylonia named in the list of those who returned to Judah with Zerubbabel: “these were they which went up also from Tel-melah, Tel-haresha, Cherub, Addon, and Immer: but they could not shew their father's house, nor their seed, whether they were of Israel”. Ezra's copy of the list has the same line. These were five settlements of exiles from which came families, and some priests, who could not prove their descent and were kept from the priesthood until a priest with Urim and Thummim should decide. The Synodal Bible runs the names together, as Cherub-Addan-Immer in Ezra and Cherub-Addon in Nehemiah."
    - "The Greek versions spell the names in their own ways. The Septuagint gives them in Ezra as Thelmeleth, Thelaresa, Charoub, Edan and Emmer, and in Nehemiah it has Heron where the Hebrew has Addon. First Esdras, which retells the same return, turned the names into men: in Brenton's translation the people came up from Thermeleth and Thelersas, with Charaathalan leading them, and Aalar. The International Standard Bible Encyclopedia judges this most probably a corruption of Cherub, Addan and Immer. It also links the name Addan in some way with the god Addu."
    - "Where Addon lay is unknown. The two names in Tel, “mound”, suggest new villages on old ruins; Cherub, Addon and Immer may be names of men after whom settlements were called, as Immer is a priestly family. Cuneiform tablets of the sixth and fifth centuries BC, among them the Al-Yahudu texts and the Murashu archive from Nippur, show Judean exiles settled in villages of their own in central Babylonia; none of the places named in them has been matched with Addon, and nothing more can be said."
  ru:
    - "Аддон (в книге Ездры — Аддан) — место в Вавилонии, названное в списке вернувшихся в Иудею с Зоровавелем: «И вот вышедшие из Тел-Мелаха, Тел-Харши, Херув-Аддона и Иммера; но они не могли показать о поколении своем и о племени своем, от Израиля ли они». Список у Ездры содержит ту же строку. Это пять поселений изгнанников, откуда пришли семьи и несколько священников, не сумевшие доказать своё происхождение; их отстранили от священства, пока не восстанет священник с уримом и туммимом. Синодальный перевод сливает имена: у Ездры — Херуб-Аддан-Иммер, у Неемии — Херув-Аддон."
    - "Греческие переводы передают эти имена по-своему. Септуагинта даёт их в книге Ездры как Фелмелеф, Фелариса, Харув, Идан и Еммир, а в книге Неемии на месте Аддона у неё стоит Ирон. Греческая Вторая книга Ездры, пересказывающая то же возвращение, превратила названия в людей: в английском переводе Брентона народ пришёл из Фермелефа и Фелерсы во главе с Хараафаланом, и Аалар. Международная стандартная библейская энциклопедия считает это, скорее всего, порчей текста на месте Херува, Аддана и Иммера. Она же связывает имя Аддан с именем бога Адду."
    - "Где лежал Аддон, неизвестно. Два названия со словом «тел», «холм», говорят о новых селениях на старых развалинах; Херув, Аддон и Иммер могут быть именами людей, по которым назвали поселения, — Иммер и есть священнический род. Клинописные таблички VI–V веков до н. э., среди них тексты Аль-Яхуду и архив Мурашу из Ниппура, показывают иудейских изгнанников в собственных селениях в средней Вавилонии; ни одно из названных там мест не отождествлено с Аддоном, и больше сказать нечего."
  uk:
    - "Аддон (Аддан у Ездри) — місце у Вавилонії, назване в переліку тих, що повернулися до Юди із Зоровавелем: «А ось ті, що вийшли з Телмелаха, Телхарші, Херув-Аддона та Іммера, але вони не могли вказати на дім батьків своїх і на племя своє, чи вони від Ізраїля». Ездрина копія переліку має той самий рядок. Це були п'ять поселень вигнанців, звідки прийшли родини, серед них і священничі, які не могли довести свого походження й були відсторонені від священства, доки священник з Уримом і Туммімом не вирішить. Синодальний переклад зливає імена: у Ездри — Херуб-Аддан-Іммер, у Неемії — Херув-Аддон."
    - "Грецькі переклади передають ці імена по-своєму. Септуагінта подає їх у Книзі Ездри як Телмелет, Телареса, Харув, Едан і Еммер, а в Книзі Неемії на місці Аддона має Ерон. Перша (грецька) книга Ездри, що переказує те саме повернення, перетворила назви на людей: в англійському перекладі Брентона народ вийшов з Термелета й Телерси на чолі з Харааталаном, і Аалар. International Standard Bible Encyclopedia вважає це, найімовірніше, псуванням тексту на місці Херува, Аддана та Іммера. Вона ж пов’язує ім’я Аддан з ім’ям бога Адду."
    - "Де лежав Аддон, невідомо. Дві назви з Тель, «пагорб», наводять на думку про нові села на давніх руїнах; Херув, Аддон та Іммер можуть бути іменами людей, на честь яких назвали поселення, як Іммер — священничий рід. Клинописні таблички VI–V століть до н. е., серед них тексти з Аль-Яхуду та архів Мурашу з Ніппура, показують юдейських вигнанців, оселених у власних селах у центральному Вавилоні; жодне з названих у них місць не зіставлено з Аддоном, і більше сказати нічого."
  es:
    - "Adón (Addán en Esdras) es un lugar de Babilonia mencionado en la lista de quienes regresaron a Judá con Zorobabel: «estos son los que subieron de Telmelah, Tel-harsa, Chêrub, Addón, é Immer, los cuales no pudieron mostrar la casa de sus padres, ni su linaje, si eran de Israel». La copia de la lista en Esdras tiene la misma línea. Eran cinco asentamientos de exiliados de los que procedían familias, y algunos sacerdotes, que no podían probar su ascendencia y fueron excluidos del sacerdocio hasta que un sacerdote con Urim y Tumim decidiera. La Biblia sinodal junta los nombres, como Querub-Addán-Imer en Esdras y Querub-Adón en Nehemías."
    - "Las versiones griegas escriben los nombres a su manera. La Septuaginta los da en Esdras como Thelmeleth, Thelaresa, Charoub, Edan y Emmer, y en Nehemías tiene Heron donde el hebreo tiene Adón. El primer libro de Esdras, que vuelve a contar el mismo regreso, convirtió los nombres en hombres: en la traducción de Brenton el pueblo subió de Thermeleth y Thelersas, con Charaathalan al frente, y Aalar. La International Standard Bible Encyclopedia juzga esto muy probablemente una corrupción de Querub, Addán e Imer. También relaciona de algún modo el nombre Addán con el dios Addu."
    - "Se ignora dónde estuvo Adón. Los dos nombres que empiezan por Tel, «montículo», sugieren aldeas nuevas sobre ruinas antiguas; Querub, Adón e Imer pueden ser nombres de hombres de quienes tomaron el nombre los asentamientos, como Imer es una familia sacerdotal. Las tablillas cuneiformes de los siglos VI y V a. C., entre ellas los textos de Al-Yahudu y el archivo de Murashu de Nippur, muestran a exiliados judeos asentados en aldeas propias en el centro de Babilonia; ninguno de los lugares citados en ellas ha podido relacionarse con Adón, y nada más puede decirse."
  pt:
    - "Adom (Adã em Esdras) é um lugar na Babilônia citado na lista dos que voltaram a Judá com Zorobabel: “Estes foram os que subiram de Tel-Melá, Tel-Harsa, Querube, Adom e Imer; mas não puderam provar as casas de seus pais, nem sua descendência, se eram de Israel”. A cópia da lista em Esdras traz a mesma linha. Eram cinco povoados de exilados de onde vieram famílias, e alguns sacerdotes, que não puderam provar a sua ascendência e foram afastados do sacerdócio até que um sacerdote com Urim e Tumim decidisse. A Bíblia sinodal russa junta os nomes, como Querube-Adã-Imer em Esdras e Querube-Adom em Neemias."
    - "As versões gregas grafam os nomes à sua maneira. A Septuaginta os dá em Esdras como Thelmeleth, Thelaresa, Charoub, Edan e Emmer, e em Neemias tem Heron onde o hebraico tem Adom. Primeiro Esdras, que reconta o mesmo regresso, transformou os nomes em homens: na tradução de Brenton o povo subiu de Thermeleth e Thelersas, com Charaathalan à frente, e Aalar. A International Standard Bible Encyclopedia julga isso muito provavelmente uma corrupção de Querube, Adã e Imer. Também liga de algum modo o nome Adã ao deus Addu."
    - "Não se sabe onde ficava Adom. Os dois nomes em Tel, “montículo”, sugerem aldeias novas sobre velhas ruínas; Querube, Adom e Imer podem ser nomes de homens que deram nome a povoados, como Imer é uma família sacerdotal. Tabuinhas cuneiformes dos séculos VI e V a.C., entre elas os textos de Al-Yahudu e o arquivo de Murashu, de Nipur, mostram exilados judeus instalados em aldeias próprias na Babilônia central; nenhum dos lugares nelas citados foi associado a Adom, e nada mais se pode dizer."
  de:
    - "Addon (Addan in Esra) ist ein Ort in Babylonien, genannt in der Liste derer, die mit Serubbabel nach Juda zurückkehrten: „Und diese zogen auch mit herauf von Thel-Melah, Thel-Harsa, Cherub, Addon und Immer, aber sie konnten nicht anzeigen ihr Vaterhaus noch ihr Geschlecht, ob sie aus Israel wären“. Die Abschrift der Liste bei Esra hat dieselbe Zeile. Es waren fünf Siedlungen von Verbannten, aus denen Familien und einige Priester kamen, die ihre Abstammung nicht belegen konnten und vom Priesterdienst ausgeschlossen blieben, bis ein Priester mit Urim und Tummim entscheiden würde. Die Synodalbibel zieht die Namen zusammen, als Kerub-Addan-Immer in Esra und Kerub-Addon in Nehemia."
    - "Die griechischen Fassungen schreiben die Namen auf ihre eigene Weise. Die Septuaginta gibt sie in Esra als Thelmeleth, Thelaresa, Charoub, Edan und Emmer wieder, und in Nehemia hat sie Heron, wo der hebräische Text Addon hat. Das Erste Buch Esdras, das dieselbe Rückkehr nacherzählt, machte aus den Namen Männer: In Brentons Übersetzung zog das Volk aus Thermeleth und Thelersas herauf, mit Charaathalan an der Spitze, und Aalar. Die International Standard Bible Encyclopedia hält dies höchstwahrscheinlich für eine Verderbnis von Kerub, Addan und Immer. Sie bringt den Namen Addan auch auf irgendeine Weise mit dem Gott Addu in Verbindung."
    - "Wo Addon lag, ist unbekannt. Die beiden mit Tel, „Hügel“, gebildeten Namen lassen auf neue Dörfer auf alten Ruinen schließen; Kerub, Addon und Immer können Namen von Männern sein, nach denen Siedlungen benannt wurden, wie Immer eine Priesterfamilie ist. Keilschrifttafeln des 6. und 5. Jahrhunderts v. Chr., darunter die Al-Yahudu-Texte und das Murašu-Archiv aus Nippur, zeigen judäische Verbannte in eigenen Dörfern in Mittelbabylonien; keiner der dort genannten Orte konnte mit Addon gleichgesetzt werden, und mehr lässt sich nicht sagen."
  fr:
    - "Addon (Addan dans Esdras) est un lieu de Babylonie nommé dans la liste de ceux qui revinrent en Juda avec Zorobabel : « Voici ceux qui partirent de Thel-Mélach, de Thel-Harscha, de Kerub-Addon, et d’Immer, et qui ne purent pas faire connaître leur maison paternelle et leur race, pour prouver qu’ils étaient d’Israël ». La version de la liste donnée par Esdras a la même ligne. C’étaient cinq localités d’exilés d’où venaient des familles, et quelques prêtres, qui ne purent prouver leur ascendance et furent écartés de la prêtrise jusqu’à ce qu’un prêtre muni de l’Urim et du Thummim tranche. La Bible synodale réunit les noms, en Cherub-Addan-Immer dans Esdras et Cherub-Addon dans Néhémie. Louis Segond les réunit de même (Kerub-Addan, Kerub-Addon), d’où les quatre noms de la citation."
    - "Les versions grecques écrivent les noms à leur manière. La Septante les donne dans Esdras sous la forme Thelmeleth, Thelaresa, Charoub, Edan et Emmer, et dans Néhémie elle a Heron là où l’hébreu a Addon. 1 Esdras, qui raconte de nouveau le même retour, a fait des noms des hommes : dans la traduction de Brenton, le peuple monta de Thermeleth et de Thelersas, avec Charaathalan à sa tête, et Aalar. L’International Standard Bible Encyclopedia y voit très probablement une corruption de Kérub, Addan et Immer. Elle rattache aussi d’une manière ou d’une autre le nom d’Addan au dieu Addu."
    - "On ignore où se trouvait Addon. Les deux noms en Tel, « tertre », évoquent de nouveaux villages bâtis sur d’anciennes ruines ; Kérub, Addon et Immer peuvent être des noms d’hommes dont les localités ont pris le nom, Immer étant une famille sacerdotale. Des tablettes cunéiformes des VIe et Ve siècles av. J.-C., dont les textes d’Al-Yahudu et les archives de Murashu à Nippur, montrent des exilés judéens établis dans des villages à eux au centre de la Babylonie ; aucun des lieux qui y sont cités n’a été rapproché d’Addon, et l’on ne peut rien dire de plus."
  it:
    - "Addon (Addan in Esdra) è un luogo della Babilonia nominato nell’elenco di quanti tornarono in Giuda con Zorobabele: «Ed ecco quelli che tornarono da Tel-Melah, da Tel-Harsha, da Kerub-Addon e da Immer, e che non avean potuto stabilire la loro genealogia patriarcale per dimostrare ch’erano Israeliti». La copia dell’elenco in Esdra ha la stessa riga. Erano cinque insediamenti di esuli da cui vennero famiglie, e alcuni sacerdoti, che non poterono provare la propria discendenza e furono esclusi dal sacerdozio finché un sacerdote con l’Urim e il Tummim non avesse deciso. La Bibbia sinodale unisce i nomi, come Cherub-Addan-Immer in Esdra e Cherub-Addon in Neemia."
    - "Le versioni greche scrivono i nomi a modo loro. La Settanta li dà in Esdra come Thelmeleth, Thelaresa, Charoub, Edan ed Emmer, e in Neemia ha Heron dove l’ebraico ha Addon. Il Primo libro di Esdra, che racconta di nuovo lo stesso ritorno, ha trasformato i nomi in uomini: nella traduzione di Brenton il popolo salì da Thermeleth e Thelersas, con Charaathalan alla guida, e Aalar. La International Standard Bible Encyclopedia vi vede molto probabilmente una corruzione di Cherub, Addan e Immer. Collega anche in qualche modo il nome Addan al dio Addu."
    - "Dove sorgesse Addon è ignoto. I due nomi in Tel, «tell», suggeriscono nuovi villaggi su antiche rovine; Cherub, Addon e Immer possono essere nomi di uomini da cui gli insediamenti presero il nome, come Immer è una famiglia sacerdotale. Tavolette cuneiformi del VI e V secolo a.C., fra cui i testi di Al-Yahudu e l’archivio di Murashu da Nippur, mostrano esuli giudei stabiliti in villaggi propri nella Babilonia centrale; nessuno dei luoghi in esse nominati è stato messo in corrispondenza con Addon, e nulla di più si può dire."
  pl:
    - "Addon (Addan u Ezdrasza) to miejsce w Babilonii wymienione w wykazie tych, którzy wrócili do Judy z Zorobabelem: „A cić są, którzy wyszli z Telmelachu i z Telcharsa: Cherub, Addan, i Immer: ale nie mogli okazać domu ojców swoich i nasienia swego, jeźli z Izraela byli”. Kopia wykazu u Ezdrasza ma ten sam wiersz. Było to pięć osiedli wygnańców, z których pochodziły rody i niektórzy kapłani, nie mogący wykazać swego pochodzenia i odsunięci od kapłaństwa, dopóki kapłan z Urim i Tummim nie rozstrzygnie. Biblia synodalna zlewa te nazwy w jedno, jako Cherub-Addan-Immer u Ezdrasza i Cherub-Addon u Nehemiasza."
    - "Przekłady greckie zapisują te nazwy po swojemu. Septuaginta podaje je u Ezdrasza jako Thelmeleth, Thelaresa, Charoub, Edan i Emmer, a u Nehemiasza ma Heron tam, gdzie tekst hebrajski ma Addon. Apokryficzna Pierwsza Księga Ezdrasza, która opowiada na nowo ten sam powrót, zrobiła z nazw ludzi: w przekładzie Brentona lud wyszedł z Thermeleth i Thelersas, a prowadził go Charaathalan, i Aalar. International Standard Bible Encyclopedia uważa to najpewniej za zepsucie tekstu w miejscu Cherub, Addan i Immer. Łączy też w jakiś sposób nazwę Addan z bogiem Addu."
    - "Gdzie leżał Addon, nie wiadomo. Dwie nazwy z Tel, „kopiec”, sugerują nowe wsie na dawnych ruinach; Cherub, Addon i Immer mogą być imionami ludzi, od których nazwano osiedla, jak Immer jest rodem kapłańskim. Tabliczki klinowe z VI i V wieku p.n.e., wśród nich teksty Al-Yahudu i archiwum Murashu z Nippur, pokazują wygnańców judzkich osiedlonych we własnych wsiach w środkowej Babilonii; żadnego z wymienionych w nich miejsc nie utożsamiono z Addonem i nic więcej nie można powiedzieć."
  nl:
    - "Addon (Addan in Ezra) is een plaats in Babylonië die wordt genoemd in de lijst van hen die met Zerubbabel naar Juda terugkeerden: “Ook togen dezen op van Thel-melah, Thel-harsa, Cherub, Addon en Immer; maar zij konden hunner vaderen huis, en hun zaad niet tonen, of zij uit Israel waren”. Het exemplaar van de lijst in Ezra heeft dezelfde regel. Dit waren vijf nederzettingen van ballingen, waaruit families kwamen, onder wie priesters, die hun afstamming niet konden bewijzen en van het priesterschap werden uitgesloten tot een priester met Urim en Thummim zou beslissen. De Synodale Bijbel laat de namen samenvloeien, als Cherub-Addan-Immer in Ezra en Cherub-Addon in Nehemia."
    - "De Griekse vertalingen schrijven de namen op hun eigen manier. De Septuaginta geeft ze in Ezra als Thelmeleth, Thelaresa, Charoub, Edan en Emmer, en in Nehemia heeft zij Heron waar het Hebreeuws Addon heeft. Eerste Esdras, dat dezelfde terugkeer opnieuw vertelt, maakte van de namen mannen: in de vertaling van Brenton trok het volk op uit Thermeleth en Thelersas, met Charaathalan aan het hoofd, en Aalar. De International Standard Bible Encyclopedia houdt dit zeer waarschijnlijk voor een verbastering van Cherub, Addan en Immer. Zij brengt de naam Addan ook op de een of andere manier in verband met de god Addu."
    - "Waar Addon lag, is onbekend. De twee namen met Tel, “heuvel”, wijzen op nieuwe dorpen op oude ruïnes; Cherub, Addon en Immer kunnen namen zijn van mannen naar wie nederzettingen werden genoemd, zoals Immer een priesterlijk geslacht is. Spijkerschrifttabletten uit de zesde en vijfde eeuw v.Chr., onder andere de Al-Yahudu-teksten en het Murashu-archief uit Nippur, tonen dat Judese ballingen in Midden-Babylonië in eigen dorpen woonden; geen van de daarin genoemde plaatsen is met Addon gelijkgesteld, en meer valt er niet te zeggen."
  cs:
    - "Addon (v Ezdrášovi Addan) je místo v Babylonii jmenované v seznamu těch, kdo se se Zerubábelem vrátili do Judy: „Tito také byli, kteříž vyšli z Telmelach a Telcharsa: Cherub, Addon a Immer. Ale nemohli prokázati rodu otců svých a semene svého, že by z Izraele byli.“ Ezdrášův opis seznamu má stejný řádek. Bylo to pět osad vyhnanců, z nichž pocházely rodiny, mezi nimi někteří kněží, kteří nemohli prokázat svůj původ a byli drženi stranou od kněžství, dokud nerozhodne kněz s urim a tumim. Synodální bible jména spojuje dohromady, jako Cherub-Addan-Immer u Ezdráše a Cherub-Addon u Nehemjáše."
    - "Řecké překlady zapisují jména po svém. Septuaginta je u Ezdráše uvádí jako Thelmeleth, Thelaresa, Charoub, Edan a Emmer a u Nehemjáše má Heron tam, kde hebrejský text má Addon. První Ezdráš, který znovu vypráví týž návrat, udělal ze jmen muže: v Brentonově překladu lid vyšel z Thermeleth a Thelersas, v čele s Charaathalanem, a Aalar. International Standard Bible Encyclopedia to pokládá nejspíše za porušení textu na místě jmen Kerúb, Addan a Imer. Jméno Addan také nějak spojuje s bohem Addu."
    - "Kde Addon ležel, není známo. Dvě jména s Tel, „pahorek“, napovídají nové vesnice na starých zříceninách; Kerúb, Addon a Imer mohou být jména mužů, podle nichž byly osady pojmenovány, neboť Imer je kněžský rod. Klínopisné tabulky 6. a 5. století př. n. l., mezi nimi texty z Al-Yahudu a archiv Murašû z Nippuru, ukazují judské vyhnance usazené ve vlastních vesnicích ve střední Babylonii; žádné z míst v nich jmenovaných nebylo ztotožněno s Addonem a víc říci nelze."
  sv:
    - "Addon (Addan hos Esra) är en ort i Babylonien som nämns i förteckningen över dem som återvände till Juda med Serubbabel: ”dessa voro de som drogo åstad från Tel-Mela, Tel-Harsa, Kerub, Addon och Immer, men som icke kunde uppgiva sina familjer och sin släkt, och huruvida de voro av Israel”. Esras version av förteckningen har samma rad. Det var fem bosättningar av landsflyktiga, varifrån det kom släkter, och en del präster, som inte kunde styrka sin härstamning och hölls borta från prästämbetet tills en präst med urim och tummim skulle avgöra saken. Synodalbibeln slår ihop namnen, som Cherub-Addan-Immer hos Esra och Cherub-Addon hos Nehemja."
    - "De grekiska översättningarna skriver namnen på sitt eget sätt. Septuaginta återger dem hos Esra som Thelmeleth, Thelaresa, Charoub, Edan och Emmer, och hos Nehemja har den Heron där den hebreiska texten har Addon. Första Esdrasboken, som återberättar samma hemkomst, gjorde namnen till män: i Brentons översättning drog folket upp från Thermeleth och Thelersas, med Charaathalan som ledare, och Aalar. International Standard Bible Encyclopedia håller detta för mycket troligt en förvanskning av Keruv, Addan och Immer. Den knyter också på något sätt namnet Addan till guden Addu."
    - "Var Addon låg är okänt. De två namnen på Tel, ”kulle”, tyder på nya byar på gamla ruiner; Keruv, Addon och Immer kan vara namn på män efter vilka bosättningar kallades, så som Immer är en prästsläkt. Kilskriftstavlor från 500- och 400-talen f.Kr., bland dem Al-Yahudu-texterna och Murashu-arkivet från Nippur, visar att judeiska landsflyktingar bodde i egna byar i mellersta Babylonien; ingen av de orter som nämns i dem har kunnat knytas till Addon, och mer kan inte sägas."
  nb:
    - "Addon (Addan i Esra) er et sted i Babylonia som nevnes i listen over dem som vendte tilbake til Juda med Serubabel: «Og dette er de som drog hjem fra Tel-Melah, Tel-Harsa, Kerub, Addon og Immer, men ikke kunde opgi sin familie og sin ætt, om de var av Israel». Esras versjon av listen har den samme linjen. Dette var fem bosetninger av eksilfolk, og derfra kom slekter, og noen prester, som ikke kunne bevise sin avstamning og ble holdt borte fra prestetjenesten til en prest med urim og tummim kunne avgjøre saken. Synodalbibelen slår navnene sammen, som Cherub-Addan-Immer i Esra og Cherub-Addon i Nehemja."
    - "De greske oversettelsene skriver navnene på sin egen måte. Septuaginta gjengir dem i Esra som Thelmeleth, Thelaresa, Charoub, Edan og Emmer, og i Nehemja har den Heron der den hebraiske teksten har Addon. Første Esdrasbok, som gjenforteller den samme hjemkomsten, gjorde navnene til menn: i Brentons oversettelse drog folket opp fra Thermeleth og Thelersas, med Charaathalan som leder, og Aalar. International Standard Bible Encyclopedia regner dette som svært sannsynlig en forvanskning av Kerub, Addan og Immer. Den knytter også på et vis navnet Addan til guden Addu."
    - "Hvor Addon lå, er ukjent. De to navnene på Tel, «haug», tyder på nye landsbyer på gamle ruiner; Kerub, Addon og Immer kan være navn på menn som bosetningene ble oppkalt etter, slik Immer er en prestelig slekt. Kileskrifttavler fra 500- og 400-tallet f.Kr., blant dem Al-Yahudu-tekstene og Murashu-arkivet fra Nippur, viser judeiske eksilfolk bosatt i egne landsbyer i det sentrale Babylonia; ingen av stedene som nevnes der, er blitt knyttet til Addon, og mer kan ikke sies."
  tl:
    - "Ang Addon (Addan sa Ezra) ay isang lugar sa Babilonia na pinangalanan sa talaan ng mga bumalik sa Juda kasama ni Zorobabel: “ang mga ito ang nagsiahon mula sa Telmelah, Telharsa, Cherub, Addon, at Immer: nguni't hindi nila naipakilala ang mga sangbahayan ng kanilang mga magulang, o ang kanilang binhi man kung mga taga Israel”. Ganito rin ang linya sa kopya ng talaan sa Ezra. Ito ang limang pamayanan ng mga destiyerong pinagmulan ng mga pamilya, at ng ilang saserdote, na hindi makapagpatunay ng kanilang lahi at pinigilan sa pagkasaserdote hanggang sa magpasiya ang isang saserdoteng may Urim at Thummim. Pinagdudugtong ng Sinodal na Biblia ang mga pangalan, bilang Cherub-Addan-Immer sa Ezra at Cherub-Addon sa Nehemias."
    - "Isinusulat ng mga saling Griego ang mga pangalan sa sarili nilang paraan. Ibinibigay ito ng Septuaginta sa Ezra bilang Thelmeleth, Thelaresa, Charoub, Edan at Emmer, at sa Nehemias ay Heron ang nasa lugar ng Addon ng Hebreo. Ginawang mga tao ng Unang Esdras, na muling nagsasalaysay ng parehong pagbabalik, ang mga pangalan: sa salin ni Brenton, umahon ang bayan mula sa Thermeleth at Thelersas, na pinangungunahan ni Charaathalan, at si Aalar. Itinuturing ito ng International Standard Bible Encyclopedia na malamang na sira ng teksto mula sa Cherub, Addan at Immer. Iniuugnay rin nito sa paanuman ang pangalang Addan sa diyos na si Addu."
    - "Hindi alam kung nasaan ang Addon. Ang dalawang pangalang may Tel, “burol”, ay nagmumungkahi ng mga bagong nayon sa ibabaw ng lumang guho; ang Cherub, Addon at Immer ay maaaring mga pangalan ng mga taong pinagngalanan ng mga pamayanan, gaya ng Immer na isang pamilya ng mga saserdote. Ipinakikita ng mga tabletang cuneiform ng ika-6 at ika-5 siglo BK, kabilang ang mga tekstong Al-Yahudu at ang arkibo ng Murashu mula sa Nippur, na nanirahan ang mga destiyerong Judeano sa sarili nilang mga nayon sa gitnang Babilonia; wala sa mga lugar na pinangalanan doon ang naitugma sa Addon, at wala nang iba pang masasabi."
  da:
    - "Addon (Addan i Ezra) er et sted i Babylonien, der nævnes i fortegnelsen over dem, som vendte tilbage til Juda med Zerubbabel: »Og disse vare de, som droge op af Thel-Mela, Thel-Harsa, Kerub, Addon og Immer, men ikke kunde opgive deres Fædres Hus eller deres Slægt, om de vare af Israel«. Ezras version af listen har den samme linje. Det var fem bosættelser af landflygtige, hvorfra der kom slægter, og nogle præster, som ikke kunne bevise deres afstamning og blev holdt fra præstedømmet, indtil en præst med Urim og Tummim skulle afgøre sagen. Synodalbibelen smelter navnene sammen, som Kerub-Addan-Immer i Ezra og Kerub-Addon i Nehemias."
    - "De græske oversættelser skriver navnene på deres egen måde. Septuaginta gengiver dem i Ezra som Thelmeleth, Thelaresa, Charoub, Edan og Emmer, og i Nehemias har den Heron, hvor den hebraiske tekst har Addon. Første Esdrasbog, som genfortæller den samme hjemkomst, gjorde navnene til mænd: i Brentons oversættelse drog folket op fra Thermeleth og Thelersas, med Charaathalan som leder, og Aalar. International Standard Bible Encyclopedia anser dette for højst sandsynligt en forvanskning af Kerub, Addan og Immer. Den knytter også på en eller anden måde navnet Addan til guden Addu."
    - "Hvor Addon lå, er ukendt. De to navne på Tel, »tell«, tyder på nye landsbyer på gamle ruiner; Kerub, Addon og Immer kan være navne på mænd, efter hvem bosættelser blev kaldt, ligesom Immer er en præsteslægt. Kileskrifttavler fra 500- og 400-tallet f.Kr., blandt dem Al-Yahudu-tekstene og Murasju-arkivet fra Nippur, viser judæiske landflygtige bosat i egne landsbyer i det centrale Babylonien; ingen af de steder, der nævnes i dem, er blevet knyttet til Addon, og mere kan ikke siges."
  sr:
    - "Адон (Адан у Књизи Јездриној) јесте место у Вавилонији наведено у списку оних који су се с Зоровавељем вратили у Јуду: „ови дођоше из Тел-Мелеха и Тел-Арисе, Херув, Адон и Имир, али не могаше показати отачки дом свој и семе своје, еда ли су од Израиља“. Исти ред има и Јездрин препис списка. То је било пет насеља прогнаника из којих су потекле породице, и неки свештеници, који нису могли доказати своје порекло и били су одвојени од свештенства док не настане свештеник с Уримом и Тумимом. Синодална Библија спаја имена, као Херув-Аддан-Иммер у Књизи Јездриној и Херув-Аддон у Књизи Немијиној."
    - "Грчки преводи пишу имена на свој начин. Септуагинта их у Књизи Јездриној даје као Телмелет, Телареса, Харув, Едан и Емер, а у Књизи Немијиној има Ерон где хебрејски текст има Адон. Прва Ездрина књига, која поново приповеда исти повратак, претворила је имена у људе: у Брентоновом преводу народ је дошао из Термелета и Телерсе, предвођен Харааталаном, и Аалар. International Standard Bible Encyclopedia то сматра највероватније искварењем текста на месту Херува, Адана и Имира. Она такође на неки начин повезује име Адан с богом Адуом."
    - "Где је Адон лежао, непознато је. Два имена са Тел, „хумка“, наговештавају нова села на старим рушевинама; Херув, Адон и Имир могу бити имена људи по којима су насеља названа, јер је Имир свештеничка породица. Клинописне плочице из 6. и 5. века п. н. е., међу њима текстови из Ал-Јахуда и архив Мурашу из Нипура, показују да су јудејски прогнаници живели у властитим селима у средњој Вавилонији; ниједно место из њих није упоређено са Адоном и више се ништа не може рећи."
  hu:
    - "Addón (Ezsdrásnál Addán) Babilóniában fekvő hely, amelyet a Zerubbábellel Júdába visszatérők jegyzéke említ: „És ezek, a kik feljövének Tel-Melahból, Tel-Harsából, Kerub-Addán-Immérből, de nem mondhatták meg családjukat és eredetüket, hogy Izráelből valók-é?” Ezsdrás könyvének változata a jegyzékben ugyanezt a sort tartalmazza. Ez öt száműzött-település volt, amelyekből olyan családok – és néhány pap – érkeztek, akik nem tudták igazolni származásukat, és addig kizárták őket a papságból, amíg pap nem dönt az Urimmal és Tummimmal. A szinodális Biblia egybeírja a neveket: Ezsdrásnál Kerub-Addán-Immér, Nehémiásnál Kerub-Addon."
    - "A görög fordítások a maguk módján írják a neveket. A Szeptuaginta Ezsdrásnál Thelmeleth, Thelaresa, Charoub, Edan és Emmer alakban adja őket, Nehémiásnál pedig Heron áll ott, ahol a héber szövegben Addón. Az első Ezsdrás-könyv, amely ugyanezt a hazatérést beszéli el újra, embereket csinált a nevekből: Brenton fordításában a nép Thermelethből és Thelersasból jött fel, Charaathalan vezetésével, és Aalar. Az International Standard Bible Encyclopedia ezt nagy valószínűséggel Kerub, Addán és Immér nevének szövegromlásának tartja. Az Addán nevet valamiképpen Addu istennel is kapcsolatba hozza."
    - "Hogy Addón hol feküdt, nem ismert. A két Tel- (halom) kezdetű név arra utal, hogy régi romokon új falvak keletkeztek; Kerub, Addón és Immér olyan férfiak nevei is lehetnek, akikről a településeket elnevezték, amint Immér is egy papi család. A Kr. e. 6. és 5. századi ékírásos táblák, köztük az Al-Yahudu-szövegek és a nippuri Murashu-levéltár azt mutatják, hogy a júdai száműzöttek Közép-Babilónia saját falvaiban telepedtek le; az ezekben megnevezett helyek közül egyet sem azonosítottak Addónnal, és többet nem lehet mondani."
  fi:
    - "Addon (Esran kirjassa Addan) on Babyloniassa sijaitseva paikka, joka mainitaan luettelossa niistä, jotka palasivat Juudaan Serubbabelin mukana: ”Nämä ovat ne, jotka lähtivät Teel-Melahista, Teel-Harsasta, Kerub-Addonista ja Immeristä, voimatta ilmoittaa perhekuntaansa ja syntyperäänsä, olivatko israelilaisia”. Esran kirjan jäljennöksessä luettelosta on sama rivi. Nämä olivat viisi pakkosiirtolaisten asutusta, joista tuli sukuja ja joitakin pappeja, jotka eivät voineet todistaa polveutumistaan ja jotka suljettiin pappeudesta, kunnes pappi, jolla on urim ja tummim, ratkaisisi asian. Synodaalinen Raamattu liittää nimet yhteen: Kerub-Addan-Immer Esran kirjassa ja Kerub-Addon Nehemian kirjassa."
    - "Kreikkalaiset käännökset kirjoittavat nimet omalla tavallaan. Septuaginta antaa ne Esran kirjassa muodoissa Thelmeleth, Thelaresa, Charoub, Edan ja Emmer, ja Nehemian kirjassa sillä on Heron siinä, missä heprealaisessa tekstissä on Addon. Ensimmäinen Esra, joka kertoo saman paluun uudelleen, teki nimistä miehiä: Brentonin käännöksessä kansa tuli Thermelethista ja Thelersasista Charaathalanin johtamana, ja Aalar. International Standard Bible Encyclopedia pitää tätä hyvin todennäköisesti tekstin turmeltumana nimistä Kerub, Addan ja Immer. Se myös liittää nimen Addan jollakin tavoin Addu-jumalaan."
    - "Missä Addon sijaitsi, ei tiedetä. Kaksi Tel-alkuista nimeä, ”kumpu”, viittaa uusiin kyliin vanhojen raunioiden päällä; Kerub, Addon ja Immer voivat olla miesten nimiä, joiden mukaan asutukset nimettiin, kuten Immer on pappissuku. Nuolenpäätaulut 500- ja 400-luvuilta eaa., muun muassa Al-Yahudu-tekstit ja Nippurin Murashu-arkisto, osoittavat juudealaisten pakkosiirtolaisten asuneen omissa kylissään Keski-Babyloniassa; yhtäkään niissä mainittua paikkaa ei ole yhdistetty Addoniin, eikä enempää voi sanoa."
  vi:
    - "A-đôn (A-đan trong sách E-xơ-ra) là một nơi ở Ba-by-lôn được nêu trong danh sách những người trở về Giu-đa cùng Xô-rô-ba-bên: “Nầy là những người ở từ Tên-Mê-la, Tên-Hạt-sa, Kê-rúp, A-đôn, và từ Y-mê mà đi lên; nhưng chúng nó không thể chỉ ra nhà của tổ phụ mình và gốc gác của họ, hoặc thuộc về Y-sơ-ra-ên hay chăng”. Bản sao của danh sách trong sách E-xơ-ra có cùng dòng ấy. Đó là năm khu định cư của những người lưu đày, từ đó có những gia đình, và một số thầy tế lễ, không thể chứng minh dòng dõi và bị cấm làm chức tế lễ cho đến khi có thầy tế lễ cậy U-rim và Thu-mim quyết định. Kinh Thánh Synodal tiếng Nga viết liền các tên thành Kê-rúp-A-đan-Y-mê trong sách E-xơ-ra và Kê-rúp-A-đôn trong sách Nê-hê-mi."
    - "Các bản Hy Lạp viết những tên ấy theo cách riêng. Bản Bảy Mươi ghi chúng trong sách E-xơ-ra là Thelmeleth, Thelaresa, Charoub, Edan và Emmer, còn trong sách Nê-hê-mi thì có Heron ở chỗ bản Hê-bơ-rơ có A-đôn. Sách 1 Esdras, kể lại cùng cuộc hồi hương ấy, đã biến các tên thành người: trong bản dịch của Brenton, dân chúng đi lên từ Thermeleth và Thelersas, do Charaathalan dẫn đầu, và Aalar. International Standard Bible Encyclopedia cho rằng đây rất có thể là một chỗ văn bản bị hỏng từ Kê-rúp, A-đan và Y-mê. Sách ấy cũng liên hệ bằng cách nào đó tên A-đan với thần Addu."
    - "Không biết A-đôn nằm ở đâu. Hai tên bắt đầu bằng Tel, “gò”, gợi ý những làng mới trên các tàn tích cũ; Kê-rúp, A-đôn và Y-mê có thể là tên của những người mà các khu định cư được gọi theo, như Y-mê là một gia đình thầy tế lễ. Các bảng chữ hình nêm của thế kỷ 6 và 5 TCN, trong đó có các văn bản Al-Yahudu và kho lưu trữ Murashu từ Nippur, cho thấy những người Giu-đa lưu đày sống trong các làng riêng của họ ở miền trung Ba-by-lôn; chưa có nơi nào được nêu trong đó khớp với A-đôn, và không thể nói gì thêm."
  ro:
    - "Adon (Adan la Ezra) este un loc din Babilonia numit în lista celor întorși în Iuda cu Zorobabel: cei care s-au suit și ei din Tel-Melah, Tel-Harșa, Cherub, Adon și Imer, dar nu au putut dovedi casa lor părintească și neamul lor, dacă sunt din Israel. Copia lui Ezra a listei are același rând. Erau cinci așezări de exilați din care veneau familii, și unii preoți, care nu și-au putut dovedi descendența și au fost ținuți departe de preoție până când un preot cu Urim și Tumim avea să hotărască. Biblia sinodală rusă contopește numele, ca Cherub-Adan-Imer la Ezra și Cherub-Adon la Neemia."
    - "Versiunile grecești scriu numele în felul lor. Septuaginta le dă la Ezra ca Thelmeleth, Thelaresa, Charoub, Edan și Emmer, iar la Neemia are Heron acolo unde textul ebraic are Adon. Prima carte a lui Esdra, care repovestește aceeași întoarcere, a transformat numele în oameni: în traducerea lui Brenton poporul a urcat din Thermeleth și Thelersas, cu Charaathalan în frunte, și Aalar. International Standard Bible Encyclopedia socotește aceasta foarte probabil o stricare a textului de la Cherub, Adan și Imer. Ea leagă de asemenea, într-un fel, numele Adan de zeul Addu."
    - "Nu se știe unde se afla Adon. Cele două nume cu Tel, „movilă”, sugerează sate noi pe ruine vechi; Cherub, Adon și Imer pot fi nume de oameni după care au fost numite așezările, Imer fiind o familie preoțească. Tăblițe cuneiforme din secolele al VI-lea și al V-lea î.Hr., printre care textele din Al-Yahudu și arhiva Murașu din Nippur, arată exilați iudei așezați în sate proprii în Babilonia centrală; niciunul dintre locurile numite în ele nu a fost pus în legătură cu Adon și nu se mai poate spune nimic."
  bg:
    - "Адон (Адан в Ездра) е място във Вавилония, назовано в списъка на върналите се в Юда със Зоровавел: „А тези бяха възлезлите от Тел-мелах, Тел-ариса, Херув, Адон, и Емир; и не могоха да покажат дома на отечествието си и семето си дали бяха от Израил“. Преписът на списъка в Ездра има същия ред. Това били пет селища на изгнаници, от които дошли семейства и някои свещеници, които не можели да докажат произхода си и били отстранени от свещенството, докато свещеник с Урим и Тумим не отсъди. Синодалната Библия слива имената — Херув-Адан-Имер в Ездра и Херув-Адон в Неемия."
    - "Гръцките преводи пишат имената по свой начин. Септуагинта ги дава в Ездра като Телмелет, Телареса, Харув, Едан и Емер, а в Неемия има Ерон там, където еврейският текст има Адон. Първа Ездра, която преразказва същото завръщане, е превърнала имената в хора: в превода на Брентън народът излязъл от Термелет и Телерса, начело с Харааталан, и Аалар. „International Standard Bible Encyclopedia“ смята това най-вероятно за повреда на текста на мястото на Херув, Адан и Имер. Тя също така свързва по някакъв начин името Адан с бог Аду."
    - "Къде е лежал Адон, не се знае. Двете имена с Тел, „могила“, подсказват нови селища върху стари развалини; Херув, Адон и Имер може да са имена на мъже, по които са наречени селищата, както Имер е свещенически род. Клинописни плочки от VI и V в. пр.н.е., между които текстовете от Ал-Яхуду и архивът на Мурашу от Нипур, показват юдейски изгнаници, заселени в собствени села в централна Вавилония; нито едно от назованите в тях места не е съпоставено с Адон и нищо повече не може да се каже."
