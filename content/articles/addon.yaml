body:
  en:
    - "Addon (Addan in Ezra) is a place in Babylonia named in the list of those who returned to Judah with Zerubbabel: “these were they which went up also from Tel-melah, Tel-haresha, Cherub, Addon, and Immer: but they could not shew their father's house, nor their seed, whether they were of Israel”. Ezra's copy of the list has the same line. These were five settlements of exiles from which came families, and some priests, who could not prove their descent and were kept from the priesthood until a priest with Urim and Thummim should decide. The Synodal Bible runs the names together, as Cherub-Addan-Immer in Ezra and Cherub-Addon in Nehemiah."
    - "Where Addon lay is unknown. The two names in Tel, “mound”, suggest new villages on old ruins; Cherub, Addon and Immer may be names of men after whom settlements were called, as Immer is a priestly family. Cuneiform tablets of the sixth and fifth centuries BC, among them the Al-Yahudu texts and the Murashu archive from Nippur, show Judean exiles settled in villages of their own in central Babylonia; none of the places named in them has been matched with Addon, and nothing more can be said."
  ru:
    - "Аддон (в книге Ездры — Аддан) — место в Вавилонии, названное в списке вернувшихся в Иудею с Зоровавелем: «И вот вышедшие из Тел-Мелаха, Тел-Харши, Херув-Аддона и Иммера; но они не могли показать о поколении своем и о племени своем, от Израиля ли они». Список у Ездры содержит ту же строку. Это пять поселений изгнанников, откуда пришли семьи и несколько священников, не сумевшие доказать своё происхождение; их отстранили от священства, пока не восстанет священник с уримом и туммимом. Синодальный перевод сливает имена: у Ездры — Херуб-Аддан-Иммер, у Неемии — Херув-Аддон."
    - "Где лежал Аддон, неизвестно. Два названия со словом «тел», «холм», говорят о новых селениях на старых развалинах; Херув, Аддон и Иммер могут быть именами людей, по которым назвали поселения, — Иммер и есть священнический род. Клинописные таблички VI–V веков до н. э., среди них тексты Аль-Яхуду и архив Мурашу из Ниппура, показывают иудейских изгнанников в собственных селениях в средней Вавилонии; ни одно из названных там мест не отождествлено с Аддоном, и больше сказать нечего."
  uk:
    - "Аддон (Аддан у Ездри) — місце у Вавилонії, назване в переліку тих, що повернулися до Юди із Зоровавелем: «А ось ті, що вийшли з Телмелаха, Телхарші, Херув-Аддона та Іммера, але вони не могли вказати на дім батьків своїх і на племя своє, чи вони від Ізраїля». Ездрина копія переліку має той самий рядок. Це були п'ять поселень вигнанців, звідки прийшли родини, серед них і священничі, які не могли довести свого походження й були відсторонені від священства, доки священник з Уримом і Туммімом не вирішить. Синодальний переклад зливає імена: у Ездри — Херуб-Аддан-Іммер, у Неемії — Херув-Аддон."
    - "Де лежав Аддон, невідомо. Дві назви з Тель, «пагорб», наводять на думку про нові села на давніх руїнах; Херув, Аддон та Іммер можуть бути іменами людей, на честь яких назвали поселення, як Іммер — священничий рід. Клинописні таблички VI–V століть до н. е., серед них тексти з Аль-Яхуду та архів Мурашу з Ніппура, показують юдейських вигнанців, оселених у власних селах у центральному Вавилоні; жодне з названих у них місць не зіставлено з Аддоном, і більше сказати нічого."
  es:
    - "Adón (Addán en Esdras) es un lugar de Babilonia mencionado en la lista de quienes regresaron a Judá con Zorobabel: «estos son los que subieron de Telmelah, Tel-harsa, Chêrub, Addón, é Immer, los cuales no pudieron mostrar la casa de sus padres, ni su linaje, si eran de Israel». La copia de la lista en Esdras tiene la misma línea. Eran cinco asentamientos de exiliados de los que procedían familias, y algunos sacerdotes, que no podían probar su ascendencia y fueron excluidos del sacerdocio hasta que un sacerdote con Urim y Tumim decidiera. La Biblia sinodal junta los nombres, como Querub-Addán-Imer en Esdras y Querub-Adón en Nehemías."
    - "Se ignora dónde estuvo Adón. Los dos nombres que empiezan por Tel, «montículo», sugieren aldeas nuevas sobre ruinas antiguas; Querub, Adón e Imer pueden ser nombres de hombres de quienes tomaron el nombre los asentamientos, como Imer es una familia sacerdotal. Las tablillas cuneiformes de los siglos VI y V a. C., entre ellas los textos de Al-Yahudu y el archivo de Murashu de Nippur, muestran a exiliados judeos asentados en aldeas propias en el centro de Babilonia; ninguno de los lugares citados en ellas ha podido relacionarse con Adón, y nada más puede decirse."
  pt:
    - "Adom (Adã em Esdras) é um lugar na Babilônia citado na lista dos que voltaram a Judá com Zorobabel: “Estes foram os que subiram de Tel-Melá, Tel-Harsa, Querube, Adom e Imer; mas não puderam provar as casas de seus pais, nem sua descendência, se eram de Israel”. A cópia da lista em Esdras traz a mesma linha. Eram cinco povoados de exilados de onde vieram famílias, e alguns sacerdotes, que não puderam provar a sua ascendência e foram afastados do sacerdócio até que um sacerdote com Urim e Tumim decidisse. A Bíblia sinodal russa junta os nomes, como Querube-Adã-Imer em Esdras e Querube-Adom em Neemias."
    - "Não se sabe onde ficava Adom. Os dois nomes em Tel, “montículo”, sugerem aldeias novas sobre velhas ruínas; Querube, Adom e Imer podem ser nomes de homens que deram nome a povoados, como Imer é uma família sacerdotal. Tabuinhas cuneiformes dos séculos VI e V a.C., entre elas os textos de Al-Yahudu e o arquivo de Murashu, de Nipur, mostram exilados judeus instalados em aldeias próprias na Babilônia central; nenhum dos lugares nelas citados foi associado a Adom, e nada mais se pode dizer."
  de:
    - "Addon (Addan in Esra) ist ein Ort in Babylonien, genannt in der Liste derer, die mit Serubbabel nach Juda zurückkehrten: „Und diese zogen auch mit herauf von Thel-Melah, Thel-Harsa, Cherub, Addon und Immer, aber sie konnten nicht anzeigen ihr Vaterhaus noch ihr Geschlecht, ob sie aus Israel wären“. Die Abschrift der Liste bei Esra hat dieselbe Zeile. Es waren fünf Siedlungen von Verbannten, aus denen Familien und einige Priester kamen, die ihre Abstammung nicht belegen konnten und vom Priesterdienst ausgeschlossen blieben, bis ein Priester mit Urim und Tummim entscheiden würde. Die Synodalbibel zieht die Namen zusammen, als Kerub-Addan-Immer in Esra und Kerub-Addon in Nehemia."
    - "Wo Addon lag, ist unbekannt. Die beiden mit Tel, „Hügel“, gebildeten Namen lassen auf neue Dörfer auf alten Ruinen schließen; Kerub, Addon und Immer können Namen von Männern sein, nach denen Siedlungen benannt wurden, wie Immer eine Priesterfamilie ist. Keilschrifttafeln des 6. und 5. Jahrhunderts v. Chr., darunter die Al-Yahudu-Texte und das Murašu-Archiv aus Nippur, zeigen judäische Verbannte in eigenen Dörfern in Mittelbabylonien; keiner der dort genannten Orte konnte mit Addon gleichgesetzt werden, und mehr lässt sich nicht sagen."
  fr:
    - "Addon (Addan dans Esdras) est un lieu de Babylonie nommé dans la liste de ceux qui revinrent en Juda avec Zorobabel : « Voici ceux qui partirent de Thel-Mélach, de Thel-Harscha, de Kerub-Addon, et d’Immer, et qui ne purent pas faire connaître leur maison paternelle et leur race, pour prouver qu’ils étaient d’Israël ». La version de la liste donnée par Esdras a la même ligne. C’étaient cinq localités d’exilés d’où venaient des familles, et quelques prêtres, qui ne purent prouver leur ascendance et furent écartés de la prêtrise jusqu’à ce qu’un prêtre muni de l’Urim et du Thummim tranche. La Bible synodale réunit les noms, en Cherub-Addan-Immer dans Esdras et Cherub-Addon dans Néhémie. Louis Segond les réunit de même (Kerub-Addan, Kerub-Addon), d’où les quatre noms de la citation."
    - "On ignore où se trouvait Addon. Les deux noms en Tel, « tertre », évoquent de nouveaux villages bâtis sur d’anciennes ruines ; Kérub, Addon et Immer peuvent être des noms d’hommes dont les localités ont pris le nom, Immer étant une famille sacerdotale. Des tablettes cunéiformes des VIe et Ve siècles av. J.-C., dont les textes d’Al-Yahudu et les archives de Murashu à Nippur, montrent des exilés judéens établis dans des villages à eux au centre de la Babylonie ; aucun des lieux qui y sont cités n’a été rapproché d’Addon, et l’on ne peut rien dire de plus."
  it:
    - "Addon (Addan in Esdra) è un luogo della Babilonia nominato nell’elenco di quanti tornarono in Giuda con Zorobabele: «Ed ecco quelli che tornarono da Tel-Melah, da Tel-Harsha, da Kerub-Addon e da Immer, e che non avean potuto stabilire la loro genealogia patriarcale per dimostrare ch’erano Israeliti». La copia dell’elenco in Esdra ha la stessa riga. Erano cinque insediamenti di esuli da cui vennero famiglie, e alcuni sacerdoti, che non poterono provare la propria discendenza e furono esclusi dal sacerdozio finché un sacerdote con l’Urim e il Tummim non avesse deciso. La Bibbia sinodale unisce i nomi, come Cherub-Addan-Immer in Esdra e Cherub-Addon in Neemia."
    - "Dove sorgesse Addon è ignoto. I due nomi in Tel, «tell», suggeriscono nuovi villaggi su antiche rovine; Cherub, Addon e Immer possono essere nomi di uomini da cui gli insediamenti presero il nome, come Immer è una famiglia sacerdotale. Tavolette cuneiformi del VI e V secolo a.C., fra cui i testi di Al-Yahudu e l’archivio di Murashu da Nippur, mostrano esuli giudei stabiliti in villaggi propri nella Babilonia centrale; nessuno dei luoghi in esse nominati è stato messo in corrispondenza con Addon, e nulla di più si può dire."
  pl:
    - "Addon (Addan u Ezdrasza) to miejsce w Babilonii wymienione w wykazie tych, którzy wrócili do Judy z Zorobabelem: „A cić są, którzy wyszli z Telmelachu i z Telcharsa: Cherub, Addan, i Immer: ale nie mogli okazać domu ojców swoich i nasienia swego, jeźli z Izraela byli”. Kopia wykazu u Ezdrasza ma ten sam wiersz. Było to pięć osiedli wygnańców, z których pochodziły rody i niektórzy kapłani, nie mogący wykazać swego pochodzenia i odsunięci od kapłaństwa, dopóki kapłan z Urim i Tummim nie rozstrzygnie. Biblia synodalna zlewa te nazwy w jedno, jako Cherub-Addan-Immer u Ezdrasza i Cherub-Addon u Nehemiasza."
    - "Gdzie leżał Addon, nie wiadomo. Dwie nazwy z Tel, „kopiec”, sugerują nowe wsie na dawnych ruinach; Cherub, Addon i Immer mogą być imionami ludzi, od których nazwano osiedla, jak Immer jest rodem kapłańskim. Tabliczki klinowe z VI i V wieku p.n.e., wśród nich teksty Al-Yahudu i archiwum Murashu z Nippur, pokazują wygnańców judzkich osiedlonych we własnych wsiach w środkowej Babilonii; żadnego z wymienionych w nich miejsc nie utożsamiono z Addonem i nic więcej nie można powiedzieć."
  nl:
    - "Addon (Addan in Ezra) is een plaats in Babylonië die wordt genoemd in de lijst van hen die met Zerubbabel naar Juda terugkeerden: “Ook togen dezen op van Thel-melah, Thel-harsa, Cherub, Addon en Immer; maar zij konden hunner vaderen huis, en hun zaad niet tonen, of zij uit Israel waren”. Het exemplaar van de lijst in Ezra heeft dezelfde regel. Dit waren vijf nederzettingen van ballingen, waaruit families kwamen, onder wie priesters, die hun afstamming niet konden bewijzen en van het priesterschap werden uitgesloten tot een priester met Urim en Thummim zou beslissen. De Synodale Bijbel laat de namen samenvloeien, als Cherub-Addan-Immer in Ezra en Cherub-Addon in Nehemia."
    - "Waar Addon lag, is onbekend. De twee namen met Tel, “heuvel”, wijzen op nieuwe dorpen op oude ruïnes; Cherub, Addon en Immer kunnen namen zijn van mannen naar wie nederzettingen werden genoemd, zoals Immer een priesterlijk geslacht is. Spijkerschrifttabletten uit de zesde en vijfde eeuw v.Chr., onder andere de Al-Yahudu-teksten en het Murashu-archief uit Nippur, tonen dat Judese ballingen in Midden-Babylonië in eigen dorpen woonden; geen van de daarin genoemde plaatsen is met Addon gelijkgesteld, en meer valt er niet te zeggen."
  cs:
    - "Addon (v Ezdrášovi Addan) je místo v Babylonii jmenované v seznamu těch, kdo se se Zerubábelem vrátili do Judy: „Tito také byli, kteříž vyšli z Telmelach a Telcharsa: Cherub, Addon a Immer. Ale nemohli prokázati rodu otců svých a semene svého, že by z Izraele byli.“ Ezdrášův opis seznamu má stejný řádek. Bylo to pět osad vyhnanců, z nichž pocházely rodiny, mezi nimi někteří kněží, kteří nemohli prokázat svůj původ a byli drženi stranou od kněžství, dokud nerozhodne kněz s urim a tumim. Synodální bible jména spojuje dohromady, jako Cherub-Addan-Immer u Ezdráše a Cherub-Addon u Nehemjáše."
    - "Kde Addon ležel, není známo. Dvě jména s Tel, „pahorek“, napovídají nové vesnice na starých zříceninách; Kerúb, Addon a Imer mohou být jména mužů, podle nichž byly osady pojmenovány, neboť Imer je kněžský rod. Klínopisné tabulky 6. a 5. století př. n. l., mezi nimi texty z Al-Yahudu a archiv Murašû z Nippuru, ukazují judské vyhnance usazené ve vlastních vesnicích ve střední Babylonii; žádné z míst v nich jmenovaných nebylo ztotožněno s Addonem a víc říci nelze."
  sv:
    - "Addon (Addan hos Esra) är en ort i Babylonien som nämns i förteckningen över dem som återvände till Juda med Serubbabel: ”dessa voro de som drogo åstad från Tel-Mela, Tel-Harsa, Kerub, Addon och Immer, men som icke kunde uppgiva sina familjer och sin släkt, och huruvida de voro av Israel”. Esras version av förteckningen har samma rad. Det var fem bosättningar av landsflyktiga, varifrån det kom släkter, och en del präster, som inte kunde styrka sin härstamning och hölls borta från prästämbetet tills en präst med urim och tummim skulle avgöra saken. Synodalbibeln slår ihop namnen, som Cherub-Addan-Immer hos Esra och Cherub-Addon hos Nehemja."
    - "Var Addon låg är okänt. De två namnen på Tel, ”kulle”, tyder på nya byar på gamla ruiner; Keruv, Addon och Immer kan vara namn på män efter vilka bosättningar kallades, så som Immer är en prästsläkt. Kilskriftstavlor från 500- och 400-talen f.Kr., bland dem Al-Yahudu-texterna och Murashu-arkivet från Nippur, visar att judeiska landsflyktingar bodde i egna byar i mellersta Babylonien; ingen av de orter som nämns i dem har kunnat knytas till Addon, och mer kan inte sägas."
