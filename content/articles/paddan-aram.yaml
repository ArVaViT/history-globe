body:
  en:
    - "Paddan-aram is the name Genesis gives to the country around Haran in upper Mesopotamia, on the Balikh, a tributary of the Euphrates, where Abraham's kin stayed behind when he went on to Canaan. The Septuagint renders it “Mesopotamia of Syria” and the Synodal Bible simply “Mesopotamia”; elsewhere the Bible calls the same country Aram-naharaim, “Aram of the two rivers”, and the King James Version turns that too into Mesopotamia. Hosea speaks of “the country of Syria”, in Hebrew the field of Aram, which suggests that paddan meant “field” or, as in Akkadian, “road”. How far the region reached is unknown; on the map it is the same place as Aram-naharaim, or Haran itself, and a tell near Harran called Tell Feddan has been linked with the name. This article covers only the Padan-aram verses of Genesis; the other “Mesopotamia” of the Bible, Aram-naharaim, has its own article."
    - "Isaac took to wife Rebekah, “the daughter of Bethuel the Syrian of Padan-aram, the sister to Laban the Syrian”. He later told Jacob, “Arise, go to Padan-aram, to the house of Bethuel thy mother's father; and take thee a wife from thence of the daughters of Laban”. Jacob served Laban twenty years, fourteen of them for Leah and Rachel, and all his children but Benjamin were born “in Padan-aram”; then he gathered the cattle “which he had gotten in Padan-aram” and set out for Canaan. God appeared to him at Bethel “when he came out of Padan-aram” and named him Israel, and on the way Rachel died near Bethlehem, as Jacob remembered in Egypt. The old confession of Deuteronomy sums the story up: “A Syrian ready to perish was my father”."
    - "Haran was a real city of the Bronze Age, named in the archives of Mari and Ebla in the third and second millennia BC; it was a centre of the moon god Sin, whose temple the last king of Babylon, Nabonidus, rebuilt in the sixth century BC. Arameans settled the region late in the second millennium, which is why Genesis calls Laban “the Syrian”. Today Harran lies in Turkey's Şanlıurfa province near the Syrian border; among its ruins stand the minaret of the Great Mosque built by the caliph Marwan II in 744–750 and a medieval castle."
  ru:
    - "Месопотамия Синодального перевода в книге Бытия — это Паддан-Арам, страна вокруг Харрана в верхней Месопотамии, на Балихе, притоке Евфрата, где осталась родня Авраама, когда он пошёл дальше в Ханаан. Септуагинта передаёт имя как «Месопотамия Сирийская», Синодальная Библия — просто «Месопотамия»; в других местах Библия зовёт ту же страну Арам-Нахараим, «Арам двух рек», и Синодальный перевод называет её то «Месопотамией», то «Сирией Месопотамской». У Осии Иаков убежал «на поля Сирийские», по-еврейски — на поле Арама, и это подсказывает, что паддан значило «поле» или, как в аккадском, «дорога». Как далеко простиралась область, неизвестно; на карте это то же место, что Арам-Нахараим, или сам Харран, а с именем связывали и телль близ Харрана, Телль-Феддан. Здесь собраны только стихи Бытия, где стоит Паддан-Арам; другая «Месопотамия» Библии, Арам-Нахараим, описана в отдельной статье."
    - "Исаак взял в жёны Ревекку, «дочь Вафуила Арамеянина из Месопотамии, сестру Лавана Арамеянина». Позже он сказал Иакову: «встань, пойди в Месопотамию, в дом Вафуила, отца матери твоей, и возьми себе жену оттуда, из дочерей Лавана». Иаков двадцать лет служил Лавану, из них четырнадцать за Лию и Рахиль, и все его дети, кроме Вениамина, родились «в Месопотамии»; потом он собрал скот, «который он приобрел в Месопотамии», и пошёл в Ханаан. Бог явился ему в Лузе «по возвращении его из Месопотамии» и нарёк Израилем, а по дороге близ Вифлеема умерла Рахиль, о чём Иаков вспоминал в Египте. Древнее исповедание из Второзакония подводит итог: «отец мой был странствующий Арамеянин»."
    - "Харран — настоящий город бронзового века, названный в архивах Мари и Эблы в III–II тысячелетиях до н. э.; это был центр лунного бога Сина, чей храм в VI веке до н. э. отстроил последний царь Вавилона Набонид. Арамеи заселили область в конце II тысячелетия, потому Бытие и зовёт Лавана Арамеянином. Сегодня Харран лежит в турецкой провинции Шанлыурфа у сирийской границы; среди его развалин стоят минарет Большой мечети, построенной халифом Марваном II в 744–750 годах, и средневековая крепость."
  uk:
    - "Падан-Арам — назва, яку Буття дає країні навколо Харана у верхній Месопотамії, на Баліху, притоці Євфрату, де залишилася рідня Авраама, коли він пішов далі до Ханаану. Септуагінта передає її як «Месопотамія Сирійська», а Куліш подекуди просто як «Мезопотамія»; в інших місцях Біблія називає ту саму країну Сирією Месопотамською — Арам-Нагараїм, «Арам двох річок», — і переклад короля Якова теж робить із неї Месопотамію. Осія каже, що Яків утік «у землю Сирийську», по-єврейськи — на поле Арама, а це підказує, що паддан означало «поле» або, як в аккадській, «дорога». Як далеко простягався цей край, невідомо; на мапі це те саме місце, що й Арам-Нагараїм, або сам Харан, а з назвою пов’язували і тель поблизу Харана, званий Телль-Феддан. У цій статті йдеться лише про вірші Буття з Падан-Арамом; інша біблійна «Месопотамія» — Сирія Месопотамська (Арам-Нагараїм) — має власну статтю."
    - "Ісаак узяв за жінку Ревеку, «дочку Бетуїла, Арамянина з Мезопотамиї, сестру Лабана, Арамянина». Пізніше він сказав Якову: «Устань, та й одбіжи в Мезопотамію, в Падан-Арам, в господу Бетуїлову, в батьківщину матері твоєї, та й возьми собі звідти жену з дочок Лабанових». Яків служив Лавану двадцять років, із них чотирнадцять за Лію й Рахіль, і всі його діти, крім Веніямина, народилися «в Мезопотамії»; потім він зібрав худобу, «що здобув у Падам-Арамі», і вирушив до Ханаану. Бог з’явився йому в Бет-Елі, «як прийшов із Мезопотамиї», і дав йому ім’я Ізраїль, а дорогою Рахіль померла поблизу Вифлеєма, як Яків згадав у Єгипті. Давнє сповідання з Повторення Закону підсумовує цю історію: «Блукаючий Арамій був батько мій»."
    - "Харан був справжнім містом бронзової доби, згаданим в архівах Марі й Ебли в III і II тисячоліттях до н. е.; він був центром культу бога Місяця Сіна, храм якого в VI ст. до н. е. відбудував останній цар Вавилона Набонід. Арамеї оселилися в краї наприкінці II тисячоліття, тому Буття й називає Лавана «Арамянином». Нині Харан лежить у турецькій провінції Шанлиурфа поблизу сирійського кордону; серед його руїн стоять мінарет Великої мечеті, збудованої халіфом Марваном II у 744–750 роках, і середньовічна фортеця."
  es:
    - "Padan-aram es el nombre que el Génesis da a la región en torno a Harán, en la Alta Mesopotamia, junto al Balikh, afluente del Éufrates, donde se quedó la parentela de Abraham cuando siguió a Canaán. La Septuaginta lo traduce «Mesopotamia de Siria» y la Biblia sinodal simplemente «Mesopotamia»; en otros pasajes la Biblia llama a la misma región Aram-naharaim, «Aram de los dos ríos», y la King James también la vierte Mesopotamia. Oseas habla de la «tierra de Aram», en hebreo el campo de Aram, lo que sugiere que paddan significaba «campo» o, como en acadio, «camino». Se ignora hasta dónde llegaba; en el mapa es el mismo lugar que Aram-naharaim, o la propia Harán, y un tell cercano a Harrán, Tell Feddan, se ha vinculado con el nombre. Este artículo trata solo los versículos del Génesis sobre Padan-aram; el otro «Mesopotamia» bíblico, Aram-naharaim, tiene el suyo."
    - "Isaac tomó por mujer a Rebeca, «hija de Bethuel Arameo de Padan-aram, hermana de Labán Arameo». Más tarde dijo a Jacob: «Levántate, ve á Padan-aram, á casa de Bethuel, padre de tu madre, y toma allí mujer de las hijas de Labán». Jacob sirvió a Labán veinte años, catorce de ellos por Lea y Raquel, y todos sus hijos salvo Benjamín nacieron «en Padan-aram»; luego reunió el ganado «que había obtenido en Padan-aram» y partió hacia Canaán. Dios se le apareció en Betel «cuando se había vuelto de Padan-aram» y lo llamó Israel, y en el camino murió Raquel cerca de Belén, como Jacob recordó en Egipto. La antigua confesión del Deuteronomio resume la historia: «Un Siro á punto de perecer fué mi padre»."
    - "Harán fue una ciudad real de la Edad del Bronce, nombrada en los archivos de Mari y Ebla en los milenios III y II a. C.; fue un centro del dios lunar Sin, cuyo templo reconstruyó en el siglo VI a. C. Nabonido, el último rey de Babilonia. Los arameos se establecieron en la región a finales del segundo milenio, por lo que el Génesis llama a Labán «el arameo». Hoy Harrán se encuentra en la provincia turca de Şanlıurfa, cerca de la frontera siria; entre sus ruinas se alzan el minarete de la Gran Mezquita, construida por el califa Marwán II en 744–750, y un castillo medieval."
  pt:
    - "Padã-Arã é o nome que o Gênesis dá ao país em torno de Harã, no alto da Mesopotâmia, no Balikh, afluente do Eufrates, onde os parentes de Abraão ficaram quando ele seguiu para Canaã. A Septuaginta o traduz por “Mesopotâmia da Síria” e a Bíblia Sinodal simplesmente por “Mesopotâmia”; em outros lugares a Bíblia chama o mesmo país de Arã-Naaraim, “Arã dos dois rios”, e a King James também o converte em Mesopotâmia. Oseias fala da “terra de Arã”, em hebraico o campo de Arã, o que sugere que paddan significava “campo” ou, como em acádico, “caminho”. Até onde a região chegava é desconhecido; no mapa é o mesmo lugar que Arã-Naaraim, ou a própria Harã, e um tell perto de Harran, chamado Tell Feddan, foi ligado ao nome. Este artigo trata só dos versículos de Padã-Arã do Gênesis; a outra “Mesopotâmia” da Bíblia, Arã-Naaraim, tem artigo próprio."
    - "Isaque tomou por mulher Rebeca, “filha de Betuel, o arameu de Padã-Arã, irmã de Labão, o arameu”. Mais tarde disse a Jacó: “Levante-se, vá a Padã-Arã, à casa de Betuel, pai de sua mãe. Tome de lá uma esposa dentre as filhas de Labão”. Jacó serviu Labão vinte anos, catorze deles por Lia e Raquel, e todos os seus filhos, menos Benjamim, nasceram “em Padã-Arã”; depois reuniu o rebanho “que havia adquirido em Padã-Arã” e partiu para Canaã. Deus lhe apareceu em Betel “quando ele voltou de Padã-Arã” e o chamou Israel, e no caminho Raquel morreu perto de Belém, como Jacó recordou no Egito. A antiga confissão do Deuteronômio resume a história: “Meu pai era um arameu prestes a perecer”."
    - "Harã foi uma cidade real da Idade do Bronze, citada nos arquivos de Mari e Ebla no terceiro e no segundo milênio a.C.; foi um centro do deus-lua Sin, cujo templo o último rei da Babilônia, Nabonido, reconstruiu no século VI a.C. Os arameus se fixaram na região no fim do segundo milênio, razão por que o Gênesis chama Labão de “o arameu”. Hoje Harran fica na província turca de Şanlıurfa, perto da fronteira síria; entre suas ruínas estão o minarete da Grande Mesquita, construída pelo califa Maruã II em 744–750, e um castelo medieval."
  de:
    - "Paddan-Aram ist der Name, den die Genesis dem Land um Haran in Obermesopotamien am Balich, einem Nebenfluss des Euphrat, gibt, wo Abrahams Verwandte blieben, als er nach Kanaan weiterzog. Die Septuaginta gibt es mit „Mesopotamien Syriens“ wieder, die russische Synodalübersetzung schlicht mit „Mesopotamien“; dasselbe Land heißt sonst Aram-Naharajim, „Aram der zwei Ströme“, was die King-James-Bibel ebenfalls mit Mesopotamien übersetzt. Hosea spricht vom „Land Syrien“, hebräisch Feld Arams; paddan bedeutet demnach wohl „Feld“ oder, wie im Akkadischen, „Weg“. Wie weit die Region reichte, ist unbekannt; auf der Karte ist sie derselbe Ort wie Aram-Naharajim oder Haran selbst, und der Tell Feddan bei Harran wurde mit dem Namen verbunden. Dieser Artikel behandelt nur die Paddan-Aram-Verse der Genesis; das andere „Mesopotamien“ der Bibel, Aram-Naharajim, hat einen eigenen."
    - "Isaak nahm Rebekka zur Frau, „die Tochter Bethuels, des Syrers, von Mesopotamien, Labans, des Syrers Schwester“. Später sagte er Jakob: „mache dich auf und ziehe nach Mesopotamien zum Hause Bethuels, des Vaters deiner Mutter, und nimm dir ein Weib daselbst von den Töchtern Labans“. Jakob diente Laban zwanzig Jahre, vierzehn davon um Lea und Rahel, und alle seine Kinder außer Benjamin wurden ihm „in Mesopotamien“ geboren; dann sammelte er das Vieh, „die er zu Mesopotamien erworben hatte“, und brach nach Kanaan auf. Gott erschien ihm in Bethel, „nachdem er aus Mesopotamien gekommen war“, und nannte ihn Israel, und unterwegs starb Rahel bei Bethlehem, wie Jakob in Ägypten sich erinnerte. Das alte Bekenntnis des Deuteronomiums fasst die Geschichte zusammen: „Mein Vater war ein Syrer und nahe dem Umkommen“."
    - "Haran war eine wirkliche Stadt der Bronzezeit, in den Archiven von Mari und Ebla im 3. und 2. Jahrtausend v. Chr. genannt; es war ein Zentrum des Mondgottes Sin, dessen Tempel der letzte König von Babylon, Nabonid, im 6. Jahrhundert v. Chr. wiederaufbaute. Aramäer besiedelten die Region im späten 2. Jahrtausend, weshalb die Genesis Laban „den Syrer“ nennt. Heute liegt Harran in der türkischen Provinz Şanlıurfa nahe der syrischen Grenze; unter seinen Ruinen stehen das Minarett der Großen Moschee, vom Kalifen Marwan II. 744–750 erbaut, und eine mittelalterliche Burg."
  fr:
    - "Paddan-Aram est le nom que la Genèse donne au pays autour de Haran, en haute Mésopotamie, sur le Balikh, affluent de l’Euphrate, où la parenté d’Abraham resta quand il continua vers Canaan. La Septante le rend par « Mésopotamie de Syrie » et la Bible synodale russe simplement par « Mésopotamie » ; ailleurs la Bible appelle le même pays Aram-Naharaïm, « Aram des deux fleuves », que la King James Version rend aussi par Mésopotamie. Osée parle du « pays d’Aram », en hébreu le champ d’Aram, ce qui suggère que paddan signifiait « champ » ou, comme en akkadien, « route ». On ignore l’étendue de la région ; sur la carte, c’est le même lieu qu’Aram-Naharaïm, ou Haran elle-même, et un tell près de Harran appelé Tell Feddan a été rapproché du nom. Cet article ne traite que des versets de la Genèse sur Paddan-Aram ; l’autre « Mésopotamie » de la Bible, Aram-Naharaïm, a son article."
    - "Isaac prit pour femme Rebecca, « fille de Bethuel, l’Araméen, de Paddan-Aram, et sœur de Laban, l’Araméen ». Il dit plus tard à Jacob : « Lève-toi, va à Paddan-Aram, à la maison de Bethuel, père de ta mère, et prends-y une femme d’entre les filles de Laban ». Jacob servit Laban vingt ans, dont quatorze pour Léa et Rachel, et tous ses enfants sauf Benjamin naquirent « à Paddan-Aram » ; puis il rassembla le troupeau « qu’il avait acquis à Paddan-Aram » et partit pour Canaan. Dieu lui apparut à Béthel « après son retour de Paddan-Aram » et le nomma Israël, et en chemin Rachel mourut près de Bethléem, comme Jacob s’en souvint en Égypte. L’ancienne confession du Deutéronome résume l’histoire : « Mon père était un Araméen nomade »."
    - "Haran était une vraie ville de l’âge du Bronze, nommée dans les archives de Mari et d’Ébla aux IIIe et IIe millénaires av. J.-C. ; elle était un centre du dieu-lune Sin, dont le dernier roi de Babylone, Nabonide, rebâtit le temple au VIe siècle av. J.-C. Les Araméens occupèrent la région à la fin du IIe millénaire, d’où l’appellation de Laban « l’Araméen » dans la Genèse. Aujourd’hui, Harran se trouve dans la province turque de Şanlıurfa, près de la frontière syrienne ; parmi ses ruines se dressent le minaret de la Grande Mosquée bâtie par le calife Marwan II en 744–750 et un château médiéval."
  it:
    - "Paddan-Aram è il nome che la Genesi dà alla regione attorno a Carran nell’alta Mesopotamia, sul Balikh, affluente dell’Eufrate, dove i parenti di Abramo rimasero quando egli proseguì per Canaan. La Settanta la rende «Mesopotamia di Siria» e la Bibbia sinodale semplicemente «Mesopotamia»; altrove la Bibbia chiama la stessa regione Aram-Naharàim, «Aram dei due fiumi», e la King James Version rende in Mesopotamia anche questo. Osea parla della «pianura d’Aram», in ebraico il campo di Aram, il che suggerisce che paddan significasse «campo» o, come in accadico, «strada». Fin dove si estendesse è ignoto; sulla mappa è lo stesso luogo di Aram-Naharàim, o Carran stessa, e un tell presso Harran, Tell Feddan, è stato collegato al nome. Questo articolo tratta solo i versetti della Genesi su Paddan-Aram; l’altra «Mesopotamia» della Bibbia, Aram-Naharàim, ha un articolo a parte."
    - "Isacco prese in moglie Rebecca, «figliuola di Bethuel, l’Arameo di Paddan-Aram, e sorella di Labano, l’Arameo». Più tardi disse a Giacobbe: «Lèvati, vattene in Paddan-Aram, alla casa di Bethuel, padre di tua madre, e prenditi moglie di là, tra le figliuole di Labano». Giacobbe servì Labano venti anni, quattordici dei quali per Lia e Rachele, e tutti i suoi figli tranne Beniamino «nacquero in Paddan-Aram»; poi radunò il bestiame «che aveva acquistato in Paddan-Aram» e partì per Canaan. Dio gli apparve a Betel «quando questi veniva da Paddan-Aram» e lo chiamò Israele, e durante il viaggio Rachele morì presso Betlemme, come Giacobbe ricordò in Egitto. L’antica professione di fede del Deuteronomio riassume la storia: «Mio padre era un Arameo errante»."
    - "Carran fu una vera città dell’età del Bronzo, nominata negli archivi di Mari e di Ebla nel III e nel II millennio a.C.; era un centro del dio lunare Sin, il cui tempio fu ricostruito nel VI secolo a.C. da Nabonedo, l’ultimo re di Babilonia. Gli Aramei si stabilirono nella regione alla fine del II millennio, ed è per questo che la Genesi chiama Labano «l’Arameo». Oggi Harran si trova in Turchia, nella provincia di Şanlıurfa presso il confine siriano; tra le sue rovine sorgono il minareto della Grande Moschea costruita dal califfo Marwan II nel 744–750 e un castello medievale."
  pl:
    - "Paddan-Aram to nazwa, jaką Księga Rodzaju nadaje krainie wokół Charanu w górnej Mezopotamii, nad Balichem, dopływem Eufratu, gdzie krewni Abrahama zostali, gdy on poszedł dalej do Kanaanu. Septuaginta oddaje ją jako „Mezopotamia Syrii”, a Biblia synodalna po prostu „Mezopotamia”; gdzie indziej Biblia nazywa ten sam kraj Aram Naharaim, „Aram dwóch rzek”, a Biblia Króla Jakuba i to przekłada jako Mezopotamię. Ozeasz mówi o ucieczce Jakuba „z krainy Syryjskiej”, po hebrajsku polu Aramu, co sugeruje, że paddan znaczyło „pole” albo, jak w akadyjskim, „droga”. Jak daleko sięgał region, nie wiadomo; na mapie jest to to samo miejsce co Aram Naharaim albo sam Charan, a z nazwą wiązano tell koło Harranu zwany Tell Feddan. Artykuł obejmuje tylko wersety Księgi Rodzaju o Paddan-Aram; druga biblijna „Mezopotamia”, Aram Naharaim, ma osobny artykuł."
    - "Izaak pojął za żonę Rebekę, „córkę Batuela Syryjczyka, z krainy Syryjskiej, siostrę Labana, Syryjczyka”. Później rzekł do Jakuba: „Ale wstawszy idź do krainy Syryjskiej, do domu Batuela, ojca matki twojej, a weźmij sobie stamtąd żonę, z córek Labana”. Jakub służył Labanowi dwadzieścia lat, z czego czternaście za Leę i Rachelę, a wszystkie jego dzieci oprócz Beniamina urodziły się „w Padanie Syryjskim”; potem zebrał dobytek, „którego był nabył w krainie Syryjskiej”, i wyruszył do Kanaanu. Bóg ukazał mu się w Betel, „gdy się wracał z Padan Syryjskiego”, i nadał mu imię Izrael, a w drodze Rachela umarła koło Betlejem, jak Jakub wspominał w Egipcie. Dawne wyznanie z Księgi Powtórzonego Prawa podsumowuje tę historię: „Ojciec mój był ubogi Syryjczyk”."
    - "Charan było prawdziwym miastem epoki brązu, wymienianym w archiwach Mari i Ebli w III i II tysiącleciu p.n.e.; było ośrodkiem kultu boga księżyca Sin, którego świątynię odbudował w VI wieku p.n.e. ostatni król Babilonu, Nabonid. Aramejczycy osiedlili się w regionie pod koniec II tysiąclecia, dlatego Księga Rodzaju nazywa Labana Syryjczykiem. Dziś Harran leży w tureckiej prowincji Şanlıurfa koło granicy z Syrią; wśród jego ruin stoją minaret Wielkiego Meczetu zbudowanego przez kalifa Marwana II w latach 744–750 i średniowieczny zamek."
  cs:
    - "Padan-aram je jméno, jež Genesis dává kraji kolem Cháranu v horní Mezopotámii, na Balichu, přítoku Eufratu, kde zůstala Abrahamova rodina, když on šel dál do Kanaánu. Septuaginta překládá „Mezopotámie Syrská“ a synodální Bible prostě „Mezopotámie“; jinde Bible nazývá touž zemi Aram-naharajim, „Aram dvou řek“, a King James Version i to překládá jako Mesopotamia. Ozeáš mluví o „krajině Syrské“, hebrejsky o poli Aramově, což naznačuje, že padan znamenalo „pole“ nebo, jako v akkadštině, „cesta“. Jak daleko oblast sahala, není známo; na mapě je to totéž místo jako Aram-naharajim, nebo samo Cháran, a se jménem se spojuje tell u Harranu zvaný Tell Feddán. Tento článek se týká jen veršů o Padan-aram v Genesis; druhá biblická „Mezopotámie“, Aram-naharajim, má vlastní článek."
    - "Izák pojal za manželku Rebeku, „dceru Bathuele Syrského, z Pádan Syrské, sestru Lábana Syrského“. Později řekl Jákobovi: „Ale vstana, jdi do Pádan Syrské do domu Bathuele, otce matky své, a pojmi sobě odtud manželku ze dcer Lábana ujce svého.“ Jákob sloužil Labanovi dvacet let, z toho čtrnáct za Leu a Ráchel a všichni jeho synové kromě Benjamína se mu narodili „v Pádan Syrské“; pak sebral dobytek, „kteréhož nabyl v Pádan Syrské“, a vydal se do Kanaánu. Bůh se mu ukázal v Bét-elu, „když se navracoval z Pádan Syrské“, a nazval ho Izraelem, a cestou zemřela Ráchel u Betléma, jak si Jákob v Egyptě připomněl. Starý vyznávací text Deuteronomia příběh shrnuje: „Syrský chudý otec můj“."
    - "Cháran byl skutečným městem doby bronzové, zmíněným v archivech Mari a Ebly ve 3. a 2. tisíciletí př. n. l.; byl střediskem boha měsíce Sína, jehož chrám v 6. století př. n. l. znovu vystavěl poslední babylónský král Nabonid. Aramejci osídlili oblast koncem 2. tisíciletí, proto Genesis nazývá Labana „Syrským“. Dnes Harran leží v turecké provincii Šanliurfa u syrské hranice; mezi jeho zříceninami stojí minaret Velké mešity postavené kalifem Marvánem II. v letech 744–750 a středověký hrad."
  nl:
    - "Paddan-Aram is de naam die Genesis geeft aan het land rond Haran in Boven-Mesopotamië, aan de Balikh, een zijrivier van de Eufraat, waar Abrahams verwanten achterbleven toen hij naar Kanaän trok. De Septuaginta heeft “Mesopotamië van Syrië”, de Synodale Bijbel eenvoudig “Mesopotamië”; elders heet hetzelfde land Aram-Naharaïm, “Aram van de twee rivieren”, en ook de King James Version maakt daar Mesopotamië van. Hosea spreekt van “het veld van Syrië”, in het Hebreeuws het veld van Aram, wat doet vermoeden dat paddan “veld” betekende of, zoals in het Akkadisch, “weg”. Hoe ver het gebied reikte, is onbekend; op de kaart is het dezelfde plaats als Aram-Naharaïm, of Haran zelf; Tell Feddan, een tel bij Harran, is met de naam verbonden. Dit artikel behandelt alleen de Paddan-Aram-verzen van Genesis; het andere bijbelse “Mesopotamië”, Aram-Naharaïm, heeft een eigen artikel."
    - "Isaak nam Rebekka tot vrouw, “de dochter van Bethuel, den Syrier, uit Paddan-Aram, de zuster van Laban, den Syrier”. Later zei hij tot Jakob: “Maak u op, ga naar Paddan-Aram, ten huize van Bethuel, den vader uwer moeder, en neem u van daar een vrouw, van de dochteren van Laban”. Jakob diende Laban twintig jaar, waarvan veertien voor Lea en Rachel, en van al zijn kinderen behalve Benjamin heet het dat zij “geboren zijn in Paddan-Aram”; daarna verzamelde hij het vee “hetwelk hij in Paddan-Aram geworven had” en trok naar Kanaän. God verscheen hem te Bethel “als hij van Paddan-Aram gekomen was” en noemde hem Israël, en onderweg stierf Rachel bij Bethlehem, zoals Jakob in Egypte herinnerde. De oude belijdenis van Deuteronomium vat het verhaal samen: “Mijn vader was een bedorven Syrier”."
    - "Haran was een echte stad uit de bronstijd, genoemd in de archieven van Mari en Ebla in het 3e en 2e millennium v.Chr.; het was een centrum van de maangod Sin, wiens tempel de laatste koning van Babylon, Nabonidus, in de 6e eeuw v.Chr. herbouwde. Arameeërs vestigden zich aan het eind van het 2e millennium in het gebied, en daarom noemt Genesis Laban “den Syrier”. Tegenwoordig ligt Harran in de Turkse provincie Şanlıurfa bij de Syrische grens; tussen de ruïnes staan de minaret van de Grote Moskee, gebouwd door kalief Marwan II in 744–750, en een middeleeuws kasteel."
  sv:
    - "Paddan-Aram är namnet Första Mosebok ger åt landet kring Harran i övre Mesopotamien, vid Balikh, en biflod till Eufrat, där Abrahams släkt stannade kvar när han drog vidare till Kanaan. Septuaginta återger det som ”Syriens Mesopotamien” och den synodala bibeln enkelt som ”Mesopotamien”; på andra ställen kallar Bibeln samma land Aram-Naharajim, ”Aram för de två floderna”, och King James-översättningen gör också det till Mesopotamien. Hosea talar om ”Arams mark”, på hebreiska Arams fält, vilket antyder att paddan betydde ”fält” eller, som på akkadiska, ”väg”. Hur långt regionen sträckte sig är okänt; på kartan är det samma plats som Aram-Naharajim, eller Harran självt, och en tell nära Harran, Tell Feddan, har kopplats till namnet. Denna artikel behandlar endast Paddan-Aram-verserna i Första Mosebok; Bibelns andra ”Mesopotamien”, Aram-Naharajim, har en egen artikel."
    - "Isak tog till hustru Rebecka, ”dotter till araméen Betuel från Paddan-Aram och syster till araméen Laban”. Han sade senare till Jakob: ”stå upp och begiv dig till Paddan-Aram, till Betuels, din morfaders, hus, och tag dig en hustru därifrån, någon av Labans, din morbroders, döttrar”. Jakob tjänade Laban i tjugo år, fjorton av dem för Lea och Rakel, och alla hans barn utom Benjamin föddes ”i Paddan-Aram”; sedan samlade han boskapen ”som han hade förvärvat i Paddan-Aram” och gav sig av mot Kanaan. Gud uppenbarade sig för honom i Betel, ”när han hade kommit tillbaka från Paddan-Aram”, och gav honom namnet Israel, och på vägen dog Rakel nära Betlehem, som Jakob mindes i Egypten. Den gamla trosbekännelsen i Femte Mosebok sammanfattar berättelsen: ”Min fader var en hemlös aramé”."
    - "Harran var en verklig stad under bronsåldern, nämnd i arkiven från Mari och Ebla under det tredje och andra årtusendet f.Kr.; den var ett centrum för månguden Sin, vars tempel Babylons siste kung, Nabonid, återuppbyggde på 500-talet f.Kr. Araméerna bosatte sig i regionen sent under det andra årtusendet, vilket är varför Första Mosebok kallar Laban ”araméen”. I dag ligger Harran i Turkiets provins Şanlıurfa nära den syriska gränsen; bland ruinerna står minareten till Stora moskén, byggd av kalifen Marwan II 744–750, och en medeltida borg."
  nb:
    - "Paddan-Aram er navnet Første Mosebok gir på landet rundt Harran i øvre Mesopotamia, ved Balikh, en sideelv til Eufrat, der Abrahams slekt ble igjen da han dro videre til Kanaan. Septuaginta gjengir det «Mesopotamia i Syria» og den synodale bibelen bare «Mesopotamia»; ellers kaller Bibelen det samme landet Aram-Naharajim, «Aram ved de to elvene», og King James Version gjør også det til Mesopotamia. Hosea taler om «Arams land», på hebraisk Arams mark, noe som tyder på at paddan betydde «mark» eller, som på akkadisk, «vei». Hvor langt området rakte, er ukjent; på kartet er det samme sted som Aram-Naharajim, eller Harran selv, og en tell nær Harran kalt Tell Feddan er knyttet til navnet. Denne artikkelen dekker bare Padan-Aram-versene i Første Mosebok; Bibelens andre «Mesopotamia», Aram-Naharajim, har sin egen artikkel."
    - "Isak tok til hustru Rebekka, «datter til arameeren Betuel fra Mesopotamia og søster til arameeren Laban». Han sa senere til Jakob: «Gjør dig rede og dra til Mesopotamia, til din morfar Betuels hus, og hent dig en hustru derfra, en av din morbror Labans døtre!» Jakob tjente Laban i tyve år, fjorten av dem for Lea og Rakel, og alle hans barn unntatt Benjamin ble født «i Mesopotamia»; så samlet han buskapen «som han hadde lagt sig til i Mesopotamia» og drog mot Kanaan. Gud åpenbarte seg for ham i Betel «da han kom fra Mesopotamia» og ga ham navnet Israel, og på veien døde Rakel nær Betlehem, slik Jakob mintes i Egypt. Den gamle bekjennelsen i 5. Mosebok oppsummerer historien: «Min far var en omvankende araméer»."
    - "Harran var en virkelig by i bronsealderen, nevnt i arkivene fra Mari og Ebla i 3. og 2. årtusen f.Kr.; den var et senter for månegudens Sin, hvis tempel Babylons siste konge, Nabonid, gjenoppbygde på 500-tallet f.Kr. Araméerne slo seg ned i området sent i 2. årtusen, og derfor kaller Første Mosebok Laban «araméeren». I dag ligger Harran i Tyrkias provins Şanlıurfa nær den syriske grensen; blant ruinene står minareten til Den store moskeen, bygd av kalifen Marwan II i 744–750, og en middelalderborg."
  tl:
    - "Ang Padan-aram ay pangalang ibinibigay ng Genesis sa lupain sa palibot ng Haran sa itaas na Mesopotamia, sa Balikh, sanga ng Eufrates, kung saan nanatili ang kamag-anak ni Abraham nang pumunta siya sa Canaan. Isinasalin ito ng Septuagint na “Mesopotamia ng Siria” at ng Sinodal na “Mesopotamia” lamang; Aram-naharaim, “Aram ng dalawang ilog”, ang tawag ng Bibliya sa parehong lupain sa ibang lugar, na ginagawa ring Mesopotamia ng King James. Binabanggit ni Oseas ang “parang ng Aram”, na nagmumungkahing ang paddan ay “parang” o, gaya sa Akkadian, “daan”. Hindi alam ang lawak ng rehiyon; sa mapa, kapareho ito ng Aram-naharaim, o ng Haran mismo, at ang Tell Feddan, tell malapit sa Harran, ay iniugnay sa pangalan. Saklaw lamang nito ang mga talata ng Padan-aram sa Genesis; may sariling artikulo ang isa pang “Mesopotamia” ng Bibliya, ang Aram-naharaim."
    - "Pinakasalan ni Isaac si Rebeca, “anak ni Bethuel na taga Siria sa Padan-aram, kapatid na babae ni Laban na taga Siria”. Sinabi niya kalaunan kay Jacob, “Tumindig ka, pumaroon ka sa Padan-aram, sa bahay ni Bethuel, na ama ng iyong ina, at magasawa ka roon sa mga anak ni Laban”. Naglingkod si Jacob kay Laban nang 20 taon, 14 para kina Lea at Raquel, at lahat ng anak niya maliban kay Benjamin ay ipinanganak “sa Padan-aram”; pagkatapos ay tinipon niya ang mga hayop “na kaniyang napakinabang, na kaniyang tinipon, sa Padan-aram” at nagtungo sa Canaan. Napakita sa kaniya ang Dios sa Beth-el “nang siya'y manggaling sa Padan-aram” at pinangalanan siyang Israel, at namatay si Raquel sa daan malapit sa Bethlehem, gaya ng naalala ni Jacob sa Egipto. Binubuod ito ng sinaunang pagpapahayag ng Deuteronomio: “Isang taga Siria na kamunti nang mamatay ang aking ama”."
    - "Ang Haran ay isang tunay na lungsod ng Panahong Tanso, na pinangalanan sa mga arkibo ng Mari at Ebla noong ika-3 at ika-2 milenyo BK; ito ay sentro ng diyos ng buwan na si Sin, na ang templo ay muling itinayo ng huling hari ng Babilonia, si Nabonidus, noong ika-6 na siglo BK. Nanirahan ang mga Arameo sa rehiyon sa huling bahagi ng ika-2 milenyo, kaya tinatawag ng Genesis si Laban na “taga Siria”. Ngayon ang Harran ay nasa lalawigan ng Şanlıurfa ng Turkey malapit sa hangganan ng Siria; kabilang sa mga guho nito ang minarete ng Dakilang Moske na itinayo ni caliph Marwan II noong 744–750 at isang medyebal na kastilyo."
  da:
    - "Paddan-Aram er det navn, 1. Mosebog giver landet omkring Karan i det øvre Mesopotamien, ved Balikh, en biflod til Eufrat, hvor Abrahams slægtninge blev tilbage, da han drog videre til Kana'an. Septuaginta gengiver det »Mesopotamien i Syrien« og den synodale bibel blot »Mesopotamien«; andre steder kalder Bibelen det samme land Aram-Naharajim, »Aram med de to floder«, og King James-oversættelsen gør også det til Mesopotamien. Hoseas taler om »Arams Land«, på hebraisk Arams mark, hvilket antyder, at paddan betød »mark« eller, som på akkadisk, »vej«. Hvor langt egnen nåede, er ukendt; på kortet er den det samme sted som Aram-Naharajim eller selve Karan, og en tell nær Harran kaldet Tell Feddan er blevet knyttet til navnet. Denne artikel dækker kun Paddan-Aram-versene i 1. Mosebog; Bibelens andet »Mesopotamien«, Aram-Naharajim, har sin egen artikel."
    - "Isak tog Rebekka til hustru, »Bethuel den Syrers Datter, af Paddan-Aram, Laban den Syrers Søster«. Han sagde senere til Jakob: »staa op, gak til Paddan-Aram til Bethuel din Morfaders Hus, og tag dig derfra en Hustru af Laban din Morbroders Døtre«. Jakob tjente Laban i tyve år, fjorten af dem for Lea og Rakel, og alle hans børn undtagen Benjamin blev født »i Paddan-Aram«; så samlede han kvæget, »som han havde forhvervet i Paddan-Aram«, og drog mod Kana'an. Gud åbenbarede sig for ham i Betel, »da han kom fra Paddan-Aram«, og kaldte ham Israel, og på vejen døde Rakel nær Betlehem, som Jakob erindrede i Egypten. Den gamle bekendelse i 5. Mosebog opsummerer fortællingen: »Min Fader var en omvankende Syrer«."
    - "Karan var en virkelig by i bronzealderen, nævnt i arkiverne fra Mari og Ebla i 3. og 2. årtusinde f.Kr.; den var et centrum for månegudden Sin, hvis tempel Babylons sidste konge, Nabonid, genopbyggede i 500-tallet f.Kr. Aramæerne bosatte sig i egnen sent i 2. årtusinde, hvorfor 1. Mosebog kalder Laban »den Syrer«. I dag ligger Harran i Şanlıurfa-provinsen i Tyrkiet nær den syriske grænse; blandt ruinerne står minareten fra Den Store Moské, bygget af kalif Marwan 2. i 744–750, og en middelalderlig borg."
