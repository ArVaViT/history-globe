# Overview article (ADR 0007). Mainstream facts only; the meaning of the name and the extent of the region are given as uncertain. Covers only the Padan-aram verses of this record; Aram-naharaim and the wider Mesopotamia belong to the article mesopotamia.
id: paddan-aram
place: a8ec7ba
title:
