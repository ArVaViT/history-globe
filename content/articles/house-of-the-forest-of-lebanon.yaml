body:
  en:
    - "The House of the Forest of Lebanon was the largest building of Solomon's palace in Jerusalem, raised in the thirteen years he spent on “his own house” after the seven years of the Temple. Kings gives its measure: “the length thereof was an hundred cubits, and the breadth thereof fifty cubits, and the height thereof thirty cubits, upon four rows of cedar pillars, with cedar beams upon the pillars”, about 45 by 22 m, bigger in plan than the Temple itself. Its name came from those pillars, a forest of Lebanon cedar under one roof (the King James text counts “forty five pillars, fifteen in a row”, though the Hebrew may count side-chambers rather than pillars), lit by three rows of windows, where “light was against light”. Beside it stood the hall of pillars, the hall of the throne where the king judged, and his own house and that of Pharaoh's daughter."
    - "It was a hall of state and a treasury. Solomon “made three hundred shields of beaten gold; three pound of gold went to one shield: and the king put them in the house of the forest of Lebanon”, with two hundred larger targets of gold; “all the vessels of the house of the forest of Lebanon were of pure gold; none were of silver”. Shishak of Egypt carried off the shields of gold in Rehoboam's fifth year, and Rehoboam replaced them with bronze. Later it served as an armoury: when Jerusalem was threatened in Isaiah's day, “thou didst look in that day to the armour of the house of the forest”."
    - "Nothing of it has been found. The palace is usually placed south of the Temple, between the Temple Mount and the City of David, ground that was built over again and again; no remains of it have been identified. Scholars compare the hall with the pillared palaces of the Syrian and Hittite cities of the age, and the account in Kings, with Josephus' description, is all that remains."
  ru:
    - "Дом из Ливанского дерева — самая большая постройка дворца Соломона в Иерусалиме, возведённая за тринадцать лет, которые он потратил на «свой дом» после семи лет строительства Храма. Книга Царств даёт его размеры: «длиною во сто локтей, шириною в пятьдесят локтей, а вышиною в тридцать локтей, на четырех рядах кедровых столбов; и кедровые бревна положены были на столбах», около 45 на 22 м, то есть в плане больше самого Храма. Имя дому дали эти столбы — лес ливанского кедра под одной крышей (библейский текст говорит о бревнах «на сорока пяти столбах, по пятнадцати в ряд», хотя еврейский текст, возможно, считает боковые покои, а не столбы), освещённый тремя рядами окон, «окно против окна». Рядом стояли притвор из столбов, притвор с престолом, где царь судил, его собственный дом и дом дочери фараона."
    - "Это был парадный зал и сокровищница. Соломон сделал «триста меньших щитов из кованого золота, по три мины золота пошло на каждый щит; и поставил их царь в доме из Ливанского дерева», а с ними двести больших золотых щитов; «все сосуды в доме из Ливанского дерева были из чистого золота; из серебра ничего не было». Сусаким Египетский увёз золотые щиты на пятом году Ровоама, и Ровоам заменил их медными. Позже дом служил арсеналом: когда в дни Исаии Иерусалиму грозила война, «ты в тот день обращаешь взор на запас оружия в доме кедровом»."
    - "От него ничего не найдено. Дворец обычно помещают к югу от Храма, между Храмовой горой и городом Давида, — на земле, которую застраивали снова и снова; никаких его остатков не опознано. Учёные сравнивают зал с колонными дворцами сирийских и хеттских городов той эпохи, а рассказ книги Царств вместе с описанием Иосифа Флавия — всё, что осталось."
  uk:
    - "Дім із ліванського дерева був найбільшою спорудою палацу Соломона в Єрусалимі, зведеною за тринадцять років, які він витратив на «Свою ж палату» після семи років храму. Книга Царів дає його розміри: «сотню локот завдовжки, пятьдесять локот завширшки й трийцять локот заввишки, на чотирьох рядах кедрових стовпів, і кедрове бруссє на стовпах», приблизно 45 на 22 м, більший у плані за сам храм. Його назва пішла від цих стовпів, лісу ліванського кедра під одним дахом (біблійний текст говорить про бруссє «на сорока пятьох стовпах, по пятнайцять у кожному ряду», хоча єврейський текст, можливо, лічить бічні кімнати, а не стовпи), освітленого трьома рядами вікон, де було «вікно проти вікна». Поряд стояли зала стовпів, престольна зала, де цар судив, а також його власний дім і дім дочки фараона."
    - "Це була парадна зала і скарбниця. Соломон велів зробити двісті великих щитів із кованого золота і «триста меньших щитів із кованого золота; три секлі золота обернув на кожен щит, і повішав їх царь у кедровому дому»; «усе знаряддє в кедровому будинку було з чистого золота; нїчого не було з срібла». Сусакім Єгипетський забрав золоті щити п’ятого року Ровоама, і Ровоам замінив їх мідними. Пізніше він правив за збройову: коли за Ісаї Єрусалим опинився під загрозою, «а ти в той день озираєшся за оружними запасами в палатї кедровій»."
    - "Нічого з нього не знайдено. Палац зазвичай розміщують на південь від храму, між Храмовою горою та Містом Давида, на ґрунті, який забудовували знову й знову; жодних його решток не ототожнено. Дослідники порівнюють залу зі стовповими палацами сирійських і хетських міст того часу, і оповідь Книг Царів із описом Йосифа Флавія — все, що лишилося."
  es:
    - "La Casa del Bosque del Líbano fue el mayor edificio del palacio de Salomón en Jerusalén, levantado en los trece años que dedicó a «su propia casa» después de los siete años del Templo. Reyes da sus medidas: «la cual tenía cien codos de longitud, y cincuenta codos de anchura, y treinta codos de altura, sobre cuatro órdenes de columnas de cedro, con vigas de cedro sobre las columnas», unos 45 por 22 m, mayor en planta que el propio Templo. Su nombre procedía de esas columnas, un bosque de cedro del Líbano bajo un solo techo (el texto bíblico cuenta «cuarenta y cinco columnas: cada hilera tenía quince columnas», aunque el hebreo quizá cuente cámaras laterales y no columnas), iluminado por tres hileras de ventanas, donde había «una ventana contra la otra». A su lado estaban el pórtico de columnas, el pórtico del trono donde el rey juzgaba, y su propia casa y la de la hija del faraón."
    - "Era una sala de ceremonias y un tesoro. Salomón hizo «trescientos escudos de oro extendido, en cada uno de los cuales gastó tres libras de oro: y púsolos el rey en la casa del bosque del Líbano», con doscientos paveses mayores de oro; «toda la vajilla de la casa del bosque del Líbano era de oro fino: no había plata». Sisac de Egipto se llevó los escudos de oro en el quinto año de Roboam, y Roboam los sustituyó por otros de bronce. Más tarde sirvió de armería: cuando Jerusalén fue amenazada en tiempos de Isaías, «miraste en aquel día hacia la casa de armas del bosque»."
    - "No se ha hallado nada de ella. El palacio suele situarse al sur del Templo, entre el monte del Templo y la Ciudad de David, terreno que se edificó una y otra vez; no se han identificado restos. Los estudiosos comparan la sala con los palacios de columnas de las ciudades sirias e hititas de la época, y el relato de Reyes, con la descripción de Josefo, es todo lo que queda."
  pt:
    - "A Casa do Bosque do Líbano era o maior edifício do palácio de Salomão em Jerusalém, erguido nos treze anos que ele passou em “sua própria casa” depois dos sete anos do Templo. Reis dá sua medida: “Seu comprimento era de cem côvados, sua largura de cinquenta côvados, e sua altura de trinta côvados, sobre quatro fileiras de colunas de cedro, com vigas de cedro sobre as colunas”, cerca de 45 por 22 m, maior em planta que o próprio Templo. Seu nome vinha dessas colunas, uma floresta de cedro do Líbano sob um só teto (a King James conta quarenta e cinco colunas, quinze por fileira, embora o hebraico talvez conte câmaras laterais e não colunas), iluminada por três fileiras de janelas, onde “janela ficava de frente para janela”. Ao lado ficavam o pórtico das colunas, o pórtico do trono onde o rei julgava, e sua própria casa e a da filha do faraó."
    - "Era um salão de Estado e um tesouro. Salomão “fez trezentos escudos de ouro batido; três minas de ouro foram usadas para cada escudo; e o rei os colocou na Casa da Floresta do Líbano”, com duzentos escudos maiores de ouro; “todos os utensílios da Casa da Floresta do Líbano eram de ouro puro. Nenhum era de prata”. Sisaque do Egito levou os escudos de ouro no quinto ano de Roboão, e Roboão os substituiu por escudos de bronze. Mais tarde serviu de arsenal: quando Jerusalém foi ameaçada nos dias de Isaías, “vocês olharam naquele dia para as armaduras na casa da floresta”."
    - "Nada dela foi achado. O palácio é usualmente situado ao sul do Templo, entre o monte do Templo e a Cidade de Davi, terreno que foi edificado de novo repetidas vezes; nenhum resto dele foi identificado. Os estudiosos comparam o salão aos palácios de colunas das cidades sírias e hititas da época, e o relato de Reis, com a descrição de Josefo, é tudo o que resta."
  de:
    - "Das Libanonwaldhaus war das größte Gebäude von Salomos Palast in Jerusalem, errichtet in den dreizehn Jahren, die er nach den sieben Jahren des Tempels „an seinem Hause“ baute. Die Königsbücher geben sein Maß an: „hundert Ellen lang, fünfzig Ellen weit und dreißig Ellen hoch. Auf vier Reihen von zedernen Säulen“, etwa 45 mal 22 m, im Grundriss größer als der Tempel selbst. Sein Name kam von diesen Säulen, ein Wald aus Libanonzedern unter einem Dach (die King-James-Bibel zählt fünfundvierzig Säulen, je fünfzehn in einer Reihe, doch das Hebräische zählt vielleicht Seitenkammern statt Säulen), von drei Fensterreihen erhellt, wo „Fenster einander gegenüber dreimal“ waren. Daneben standen die Säulenhalle, die Thronhalle, wo der König richtete, und sein eigenes Haus und das der Tochter Pharaos."
    - "Es war Staatshalle und Schatzhaus. Salomo ließ „zweihundert Schilde vom besten Gold“ machen, „sechshundert Lot tat er zu einem Schild“, „und dreihundert Tartschen vom besten Gold, je drei Pfund Gold zu einer Tartsche. Und der König tat sie in das Haus am Wald Libanon“; „alle Gefäße im Hause vom Wald Libanon waren auch lauter Gold; denn das Silber achtete man zu den Zeiten Salomos für nichts“. Schischak von Ägypten trug die goldenen Schilde im fünften Jahr Rehabeams fort, und Rehabeam ersetzte sie durch bronzene. Später diente es als Zeughaus: Als Jerusalem zu Jesajas Zeit bedroht war, sah man „zu der Zeit nach Rüstungen im Hause des Waldes“."
    - "Nichts davon ist gefunden. Der Palast wird meist südlich des Tempels angesetzt, zwischen dem Tempelberg und der Stadt Davids, Gelände, das immer wieder überbaut wurde; keine Reste sind identifiziert. Die Forschung vergleicht den Saal mit den Säulenpalästen der syrischen und hethitischen Städte jener Zeit, und der Bericht der Königsbücher mit der Beschreibung des Josephus ist alles, was bleibt."
  fr:
    - "La maison de la forêt du Liban était le plus grand bâtiment du palais de Salomon à Jérusalem, élevé durant les treize ans qu’il consacra à « sa maison » après les sept ans du Temple. Les Rois en donnent la mesure : « longue de cent coudées, large de cinquante coudées, et haute de trente coudées. Elle reposait sur quatre rangées de colonnes de cèdre, et il y avait des poutres de cèdre sur les colonnes », environ 45 sur 22 m, plus vaste en plan que le Temple. Son nom venait de ces colonnes, une forêt de cèdre du Liban sous un seul toit (la King James compte quarante-cinq colonnes, quinze par rangée, mais l’hébreu désigne peut-être des chambres latérales), éclairée par trois rangées de fenêtres, où « les ouvertures étaient les unes vis-à-vis des autres ». À côté se trouvaient le portique des colonnes, le portique du trône où le roi jugeait, sa propre maison et celle de la fille de Pharaon."
    - "C’était une salle d’apparat et un trésor. Salomon fit « deux cents grands boucliers d’or battu » et « trois cents autres boucliers d’or battu, pour chacun desquels il employa trois mines d’or ; et le roi les mit dans la maison de la forêt du Liban » ; « toute la vaisselle de la maison de la forêt du Liban était d’or pur. Rien n’était d’argent. » Schischak d’Égypte emporta les boucliers d’or la cinquième année de Roboam, et Roboam les remplaça par des boucliers d’airain. Plus tard, elle servit d’arsenal : quand Jérusalem fut menacée du temps d’Ésaïe, « en ce jour tu visites les armures de la maison de la forêt »."
    - "Rien n’en a été retrouvé. Le palais est d’ordinaire placé au sud du Temple, entre le mont du Temple et la Cité de David, terrain reconstruit à maintes reprises ; aucun vestige n’en a été identifié. Les spécialistes comparent la salle aux palais à colonnes des villes syriennes et hittites de l’époque, et le récit des Rois, avec la description de Josèphe, est tout ce qui subsiste."
  pl:
    - "Dom Leśny Libanu był największym budynkiem pałacu Salomona w Jerozolimie, wzniesionym w trzynaście lat, które poświęcił na budowę „domu swego” po siedmiu latach Świątyni. Księgi Królewskie podają jego miary: „na sto łokci wdłuż, a na pięćdziesiąt łokci wszerz, a na trzydzieści łokci wzwyż, na czterech rzędach słupów cedrowych, a balki cedrowe leżały na onych słupach”, około 45 na 22 m, większy w rzucie niż sama Świątynia. Nazwę wziął od tych słupów, lasu cedrów libańskich pod jednym dachem (tekst biblijny mówi o balkach „na czterdziestu i pięciu słupach, których było w każdym rzędzie piętnaście”, choć hebrajski może liczyć komory boczne, a nie słupy), oświetlonego trzema rzędami okien, gdzie „okno przeciwko oknu”. Obok stały sala słupów, sala tronowa, gdzie król sądził, oraz jego własny dom i dom córki faraona."
    - "Była salą państwową i skarbcem. Salomon uczynił dwieście tarcz ze złota ciągnionego, a oprócz nich „trzy sta puklerzy ze złota ciągnionego, trzy grzywny złota odważył na każdy puklerz. I schował je król w domu lasu Libanowego”; „wszystkie naczynia domu lasu Libanowego były z szczerego złota; nic nie było ze srebra”. Sziszak z Egiptu zabrał złote tarcze w piątym roku Roboama, a Roboam zastąpił je brązowymi. Później służyła jako zbrojownia: gdy Jerozolimie zagrażano za dni Izajasza, „poglądałeś dnia onego na zbrojownię w domu lasu”."
    - "Nic z niej nie odnaleziono. Pałac umieszcza się zwykle na południe od Świątyni, między Wzgórzem Świątynnym a Miastem Dawida, na gruncie wielokrotnie zabudowywanym; nie zidentyfikowano jego szczątków. Uczeni porównują salę z pałacami z kolumnami w syryjskich i hetyckich miastach tej epoki, a relacja w Księgach Królewskich wraz z opisem Józefa Flawiusza to wszystko, co pozostało."
  it:
    - "Il Palazzo della Foresta del Libano era il maggiore edificio del palazzo di Salomone a Gerusalemme, innalzato nei tredici anni che egli dedicò a «la sua propria casa» dopo i sette anni del Tempio. I Re ne danno la misura: «di cento cubiti di lunghezza, di cinquanta di larghezza e di trenta d’altezza. Era basata su quattro ordini di colonne di cedro, sulle quali poggiava una travatura di cedro», circa 45 per 22 m, più grande in pianta del Tempio stesso. Il nome veniva da quelle colonne, una foresta di cedro del Libano sotto un solo tetto (la King James conta quarantacinque colonne, quindici per fila, ma l’ebraico forse conta camere laterali anziché colonne), illuminata da tre ordini di finestre che «si trovavano le une dirimpetto alle altre». Accanto stavano il portico di colonne, il portico del trono dove il re amministrava la giustizia, e la sua casa e quella della figlia del faraone."
    - "Era una sala di rappresentanza e un tesoro. Salomone fece fare «trecento scudi d’oro battuto più piccoli, per ognuno dei quali impiegò tre mine d’oro; e il re li mise nella casa della “Foresta del Libano”», con duecento scudi più grandi d’oro; «tutto il vasellame della casa della “Foresta del Libano” era d’oro puro. Nulla era d’argento». Sisak d’Egitto portò via gli scudi d’oro nel quinto anno di Roboamo, e Roboamo li sostituì con scudi di bronzo. In seguito servì da arsenale: quando Gerusalemme era minacciata ai giorni di Isaia, «in quel giorno, ecco che volgete lo sguardo all’arsenale del palazzo della Foresta»."
    - "Nulla di esso è stato trovato. Il palazzo è di solito collocato a sud del Tempio, fra il Monte del Tempio e la Città di Davide, terreno costruito più e più volte; non ne sono stati identificati resti. Gli studiosi confrontano la sala con i palazzi a colonne delle città siriane e ittite dell’epoca, e il racconto dei Re, con la descrizione di Giuseppe Flavio, è tutto ciò che resta."
  nl:
    - "Het Huis van het Libanonwoud was het grootste gebouw van Salomo’s paleis in Jeruzalem, opgetrokken in de dertien jaren die hij na de zeven jaren van de tempel aan “zijn huis” besteedde. Koningen geeft de maat: “van honderd ellen in zijn lengte, en vijftig ellen in zijn breedte, en dertig ellen in zijn hoogte, op vier rijen van cederen pilaren, en cederen balken op de pilaren”, ongeveer 45 bij 22 m, groter in plattegrond dan de tempel zelf. De naam kwam van die pilaren, een woud van Libanonceder onder één dak (de Bijbeltekst spreekt van ribben “die op vijf en veertig pilaren waren, vijftien in een rij”, al telt het Hebreeuws misschien zijkamers en geen pilaren), verlicht door drie rijen vensters, waar “het ene venster was over het andere venster”. Ernaast stonden de zuilenhal, de troonzaal waar de koning recht sprak, en zijn eigen huis en dat van Farao’s dochter."
    - "Het was een staatszaal en een schatkamer. Salomo maakte “driehonderd schilden van geslagen goud; drie pond gouds liet hij opwegen tot elk schild; en de koning leide ze in het huis des wouds van Libanon”, met tweehonderd grotere rondassen van goud; “alle vaten van het huis des wouds van Libanon waren van gesloten goud; geen zilver was er aan”. Sisak van Egypte nam de gouden schilden mee in Rehabeams vijfde jaar, en Rehabeam verving ze door koperen. Later diende het als wapenkamer: toen Jeruzalem in Jesaja’s dagen bedreigd werd, “zult gij zien naar de wapenen in het huis des wouds”."
    - "Er is niets van gevonden. Het paleis wordt gewoonlijk ten zuiden van de tempel geplaatst, tussen de Tempelberg en de Stad van David, grond die telkens opnieuw is bebouwd; geen resten ervan zijn geïdentificeerd. Geleerden vergelijken de zaal met de zuilenpaleizen van de Syrische en Hethitische steden van die tijd, en het verslag in Koningen, met Josephus’ beschrijving, is alles wat resteert."
  cs:
    - "Dům Libanonského lesa byl největší budovou Šalomounova paláce v Jeruzalémě, vztyčenou během třinácti let, která strávil na „dům svůj“ po sedmi letech chrámu. Královská podávají jeho míry: „sto loket zdélí a padesáte loket zšíří a třidceti loket zvýší na čtyřech řadích sloupů cedrových, a trámové cedroví byli na těch sloupích“, asi 45 na 22 m, půdorysem větší než sám chrám. Jeho jméno pochází z těch sloupů, lesa libanonského cedru pod jednou střechou (biblický text mluví o trámech „na čtyřidcíti pěti sloupích, po patnácti v každém řadu“, hebrejština však možná počítá boční komory, ne sloupy), osvětleného třemi řadami oken, kde bylo „okno proti oknu třmi řady“. Vedle něj stála sloupová síň, trůnní síň, kde král soudil, a jeho vlastní dům a dům faraonovy dcery."
    - "Byla to státní síň a pokladnice. Šalomoun nadělal „tři sta pavéz z taženého zlata, tři libry zlata dal na každou pavézu. I složil je král v domě lesu Libánského“, s dvěma sty větších štítů ze zlata; „všecky nádoby v domě lesu Libánského byly z zlata nejčistšího. Nic nebylo od stříbra“. Šíšak Egyptský odnesl zlaté štíty v pátém roce Rechabeámově a Rechabeám je nahradil bronzovými. Později sloužil jako zbrojnice: když Jeruzalému hrozilo nebezpečí za dnů Izajášových, „obrátilo jsi zřetel v ten den k zbrojné komoře“."
    - "Nic z něj nebylo nalezeno. Palác se obvykle klade jižně od chrámu, mezi Chrámovou horu a Město Davidovo, půdu, která byla znovu a znovu zastavěna; žádné jeho zbytky nebyly ztotožněny. Učenci srovnávají síň se sloupovými paláci syrských a chetitských měst té doby a zpráva v Královských s Josephovým popisem je vše, co zbylo."
  sv:
    - "Libanonskogshuset var den största byggnaden i Salomos palats i Jerusalem, rest under de tretton år han ägnade ”sitt eget hus” efter templets sju år. Kungaboken anger dess mått: ”hundra alnar långt, femtio alnar brett och trettio alnar högt, med fyra rader pelare av cederträ och med huggna bjälkar av cederträ ovanpå pelarna”, omkring 45 gånger 22 m, större i plan än templet självt. Namnet kom av pelarna, en skog av libanonceder under ett tak (King James-texten räknar fyrtiofem, ”femton i var rad”, fast hebreiskan kan räkna sidokamrar snarare än pelare), upplyst av tre rader fönster, där ”fönsteröppningarna sutto mitt emot varandra”. Bredvid stod pelarförhuset, tronförhuset där kungen skipade rätt, och hans eget hus och det för Faraos dotter."
    - "Det var en representationssal och en skattkammare. Salomo lät göra ”tre hundra mindre sköldar av uthamrat guld och använde till var sådan sköld tre minor guld; och konungen satte upp dem i Libanonskogshuset”, tillsammans med två hundra större sköldar av guld; ”alla kärl i Libanonskogshuset voro av fint guld; av silver fanns intet”. Shishak av Egypten förde bort guldsköldarna i Rehabeams femte år, och Rehabeam ersatte dem med brons. Senare tjänade det som vapenförråd: när Jerusalem hotades på Jesajas tid: ”Då skådade du bort efter vapnen i Skogshuset”."
    - "Intet av det har hittats. Palatset placeras vanligen söder om templet, mellan Tempelberget och Davids stad, mark som bebyggts om och om igen; inga lämningar av det har identifierats. Forskare jämför salen med de pelarpalats som fanns i de syriska och hettitiska städerna under tiden, och berättelsen i Kungaboken, tillsammans med Josefus beskrivning, är allt som finns kvar."
  nb:
    - "Libanonskogshuset var den største bygningen i Salomos palass i Jerusalem, reist i de tretten årene han brukte på «sitt eget hus» etter tempelets sju år. Kongebøkene gir målene: «hundre alen langt og femti alen bredt og tretti alen høit, på fire rader sederstolper og med sederbjelker ovenpå stolpene», omtrent 45 ganger 22 m, større i grunnplan enn selve tempelet. Navnet kom av disse stolpene, en skog av libanonseder under ett tak (King James-teksten teller fem og førti søyler, femten i hver rad, selv om det hebraiske kan telle sidekamre i stedet for søyler), belyst av tre rader vinduer, med «vindu mot vindu». Ved siden av sto søylehallen, tronhallen der kongen dømte, og hans eget hus og huset til Faraos datter."
    - "Det var en representasjonshall og et skattkammer. Salomo lot lage «tre hundre små skjold av uthamret gull - til hvert av disse skjold gikk det med tre miner gull - og kongen satte dem i Libanon-skoghuset», sammen med to hundre større skjold av gull; «alle karene i Libanon-skoghuset var av fint gull; der var intet av sølv». Sjisjak av Egypt førte bort gullskjoldene i Rehabeams femte år, og Rehabeam erstattet dem med bronse. Senere tjente det som våpenlager: da Jerusalem var truet i Jesajas dager, «du ser dig på den dag om efter rustningene i skoghuset»."
    - "Ingenting av det er funnet. Palasset plasseres vanligvis sør for tempelet, mellom Tempelberget og Davidsbyen, grunn som er bygd over igjen og igjen; ingen rester av det er identifisert. Forskere sammenlikner hallen med de søyleprydede palassene i de syriske og hettittiske byene fra tiden, og beretningen i Kongebøkene, med Josefus' beskrivelse, er alt som er igjen."
  tl:
    - "Ang Bahay sa Gubat ng Libano ang pinakamalaking gusali ng palasyo ni Salomon sa Jerusalem, itinayo sa labintatlong taon niya sa “kaniyang sariling bahay” matapos ang pitong taon ng Templo. Ayon sa Mga Hari: “ang haba'y isang daang siko, at ang luwang ay limang pung siko, at ang taas ay tatlong pung siko, sa apat na hanay na haliging sedro na may sikang na sedro sa ibabaw ng mga haligi”, mga 45 x 22 m, mas malaki sa Templo ang plano. Sa mga haligi galing ang pangalan nito, gubat ng sedrong Libano sa ilalim ng isang bubong (apatnapu't limang haligi, labinlima sa isang hanay, sa tekstong King James, bagaman maaaring silid sa tagiliran ang binibilang ng Hebreo), na may tatlong hanay ng bintana, “ang liwanag ng mga yaon ay nangagkakatapatan”. Katabi nito ang bulwagan ng mga haligi, ang bulwagan ng trono, hukuman ng hari, at ang bahay niya at ng anak ni Faraon."
    - "Ito ay bulwagan ng estado at taguan ng kayamanan. Si Salomon ay “gumawa ng tatlong daang ibang kalasag na pinukpok na ginto: tatlong librang ginto ang ginamit sa bawa't kalasag: at ipinaglalagay ng hari sa bahay na kahoy sa gubat ng Libano”, bukod sa dalawang daang mas malaking kalasag na ginto; “ang lahat na sisidlan sa bahay na kahoy sa gubat ng Libano ay taganas na ginto: walang pilak”. Kinuha ni Sisac ng Egipto ang mga kalasag na ginto sa ikalimang taon ni Roboam, at pinalitan ito ni Roboam ng tanso. Nang bandang huli ay nagsilbi itong armeriya: nang bantaan ang Jerusalem nang kapanahunan ni Isaias, “ikaw ay tumitig ng araw na yaon sa sakbat sa bahay na kahoy sa gubat”."
    - "Wala pang natagpuan nito. Karaniwang inilalagay ang palasyo sa timog ng Templo, sa pagitan ng Bundok ng Templo at ng Bayan ni David, lupaing paulit-ulit na tinayuan ng mga gusali; walang nakilalang labi nito. Inihahambing ng mga iskolar ang bulwagan sa mga palasyong may haligi ng mga lungsod na Sirio at Heteo noong panahong iyon, at ang salaysay sa Mga Hari, kasama ang paglalarawan ni Josefo, ang tanging natitira."
  da:
    - "Libanonskovhuset var den største bygning i Salomos palads i Jerusalem, rejst i de tretten år, han brugte på »sit eget Hus« efter templets syv år. Kongebogen giver dets mål: »hundrede Alen var dets Længde og halvtredsindstyve Alen dets Bredde og tredive Alen dets Højde, paa fire Rader Cedersøjler og udhugne Cederbjælker paa Søjlerne«, omkring 45 gange 22 m, større i grundplan end selve templet. Dets navn kom af de søjler, en skov af libanonceder under ét tag (King James-teksten tæller »fem og fyrretyve Søjler, femten i hver Rad«, skønt det hebraiske måske tæller sidekamre frem for søjler), oplyst af tre rækker vinduer: »Vindue over for Vindue tre Gange«. Ved siden af stod søjlehallen, tronhallen, hvor kongen dømte, og hans eget hus og huset til Faraos datter."
    - "Det var en statshal og et skatkammer. Salomo lod gøre »tre Hundrede smaa Skjolde af drevet Guld; tre Pund Guld lod han gaa paa hvert Skjold; og Kongen lagde dem i Libanons Skovhus«, med to hundrede større skjolde af guld; »alle Kar i Libanons Skovhus vare af fint Guld; der var intet Kar af Sølv«. Sjisjak af Egypten bortførte guldskjoldene i Rehabeams femte år, og Rehabeam erstattede dem med bronze. Senere tjente det som våbenkammer: da Jerusalem var truet i Esajas' dage, siges der: »du saa dig om paa den Dag efter Rustningen i Skovhuset«."
    - "Intet af det er fundet. Paladset placeres sædvanligvis syd for templet, mellem Tempelbjerget og Davidsbyen, grund der er blevet bebygget igen og igen; ingen rester af det er identificeret. Forskere sammenligner hallen med de søjlebårne paladser i de syriske og hetitiske byer fra tiden, og beretningen i Kongebøgerne, med Josefus' beskrivelse, er alt, hvad der er tilbage."
  sr:
    - "Дом од шуме ливанске био је највећа зграда Соломонове палате у Јерусалиму, подигнута у тринаест година које је провео зидајући „себи дом“ после седам година Храма. Цареви дају његову меру: „сто лаката дуг и педесет лаката широк и тридесет лаката висок, на четири реда ступова кедрових, с гредама кедровим сврх ступова“, око 45 са 22 м, већи у основи од самог Храма. Његово име потиче од тих ступова, шуме ливанског кедра под једним кровом (текст превода краља Џејмса броји „четрдесет и пет ступова, по петнаест у једном реду“, мада хебрејски можда броји бочне одаје, а не ступове), осветљене трима редовима прозора („један прозор беше према другом у три реда“). Поред њега стајали су трем од ступова, трем престола где је цар судио, и његова кућа и кућа Фараонове кћери."
    - "Била је то дворана за државне приредбе и ризница. Соломун је начинио „три стотине малих штитова од кованог злата, по три мине злата дајући на сваки штитић; и остави их цар у дому од шуме ливанске“, поред двеста већих златних штитова; „сви судови у дому од шуме ливанске беху од чистог злата; од сребра не беше ништа“. Сисак Египатски однео је златне штитове у петој години Ровоамовој, а Ровоам их је заменио бронзаним. Касније је служила као оружарница: кад је Јерусалим био угрожен у Исаијино доба, „погледао си у то време на оружје у кући шумској“."
    - "Од ње ништа није пронађено. Палата се обично смешта јужно од Храма, између Храмовне горе и Давидовог града, на тлу које је изнова и изнова грађено; ни један њен остатак није утврђен. Научници упоређују дворану са стубним палатама сиријских и хетитских градова тог доба, а извештај у Царевима, уз опис Јосифа Флавија, је све што је остало."
  hu:
    - "A Libanon-erdő-palota Salamon jeruzsálemi palotájának legnagyobb épülete volt, abban a tizenhárom évben emelték, amelyet a Templom hét éve után saját házára fordított: „a maga házát építé Salamon tizenhárom esztendeig”. A Királyok könyve megadja méretét: „melynek hossza száz sing vala, szélessége ötven sing, magassága harmincz sing; építé azt négy rend czédrusoszlopon és az oszlopokon czédrusgerendák valának”, mintegy 45 × 22 m, alaprajzban nagyobb magánál a Templomnál. Nevét ezekről az oszlopokról kapta, a libanoni cédrus egy tető alatti erdejéről (a szöveg „negyvenöt oszlopon, mindenik renden tizenöt” számol, bár a héber talán oldalkamrákat számol oszlopok helyett), amelyet három sor ablak világított meg, „egymással átellenben”. Mellette állt az oszlopcsarnok, a trónterem, ahol a király ítélkezett, valamint saját háza és a fáraó leányáé."
    - "Díszterem és kincstár volt. Salamon „háromszáz kerek paizst vert aranyból, három font aranyat ada mindenik paizsra: és azokat a király helyhezteté a Libánon erdő házába”, kétszáz nagyobb arany pajzzsal; „a Libánon erdő házának összes edényei tiszta aranyból; nem volt azok között semmi ezüst”. Sisak egyiptomi fáraó Roboám ötödik évében elvitte az arany pajzsokat, Roboám pedig bronzra cserélte őket. Később fegyvertárként szolgált: amikor Jeruzsálemet Ézsaiás napjaiban fenyegették, „tekintesz ama napon az erdő házának fegyverzetére”."
    - "Semmi sem maradt belőle. A palotát rendszerint a Templomtól délre helyezik, a Templom-hegy és Dávid városa közé, olyan földön, amelyet újra és újra beépítettek; maradványait nem azonosították. A kutatók a termet a kor szíriai és hettita városainak oszlopos palotáival vetik össze, és a Királyok könyvének beszámolója, Josephus leírásával, minden, ami megmaradt."
  fi:
    - "Libanonmetsätalo oli Salomon Jerusalemin palatsin suurin rakennus, pystytetty niinä kolmenatoista vuotena, jotka hän käytti ”omaa linnaansa” temppelin seitsemän vuoden jälkeen. Kuninkaiden kirja antaa sen mitat: ”sataa kyynärää pitkän, viittäkymmentä kyynärää leveän ja kolmeakymmentä kyynärää korkean, kolmen setripylväsrivin varaan, ja pylväiden päällä oli veistetyt setriansaat”, noin 45 × 22 m, pohjaltaan suurempi kuin itse temppeli. Sen nimi tuli noista pylväistä, Libanonin setrien metsästä saman katon alla (”pylväitä oli yhteensä neljäkymmentä viisi, viisitoista kussakin rivissä”, vaikka heprea voi laskea sivukammioita pylväiden sijaan), valaistuna kolmella ikkunarivillä, joissa ”valoaukot olivat vastakkain”. Sen vieressä seisoivat pylväshalli, valtaistuinsali, jossa kuningas tuomitsi, sekä hänen oma talonsa ja faraon tyttären talo."
    - "Se oli juhlasali ja aarrekammio. Salomo teetti ”pakotetusta kullasta kolmesataa pienempää kilpeä, ja käytti jokaiseen kilpeen kolme miinaa kultaa. Ja kuningas asetti ne Libanoninmetsä-taloon”, sekä kaksisataa suurempaa kultakilpeä; ”kaikki Libanoninmetsä-talon astiat olivat puhdasta kultaa. Hopeata ei siellä ollut”. Egyptin Sisak vei kultakilvet Rehabeamin viidentenä vuotena, ja Rehabeam korvasi ne pronssisilla. Myöhemmin se toimi asevarastona: kun Jerusalemia uhattiin Jesajan päivinä, ”sinä päivänä sinä loit katseesi Metsätalon asevarastoon”."
    - "Siitä ei ole löydetty mitään. Palatsi sijoitetaan yleensä temppelin eteläpuolelle, Temppelivuoren ja Daavidin kaupungin väliin, maahan, jonka päälle on rakennettu yhä uudelleen; sen jäänteitä ei ole tunnistettu. Tutkijat vertaavat salia ajan Syyrian ja heettiläiskaupunkien pylväspalatseihin, ja Kuninkaiden kirjan kertomus Josephuksen kuvauksen kanssa on kaikki, mitä jäljellä on."
  vi:
    - "Nhà Rừng Li-ban là công trình lớn nhất trong cung điện Sa-lô-môn ở Giê-ru-sa-lem, dựng trong mười ba năm ông dành cho “cung điện mình” sau bảy năm xây Đền thờ. Sách Các Vua cho kích thước: “bề dài một trăm thước, bề ngang năm mươi thước và bề cao ba mươi thước, đặt trên bốn hàng cột bằng gỗ bá hương có những xà ngang bằng gỗ bá hương để trên những cột”, khoảng 45 x 22 m, lớn hơn cả Đền thờ trên mặt bằng. Tên bắt nguồn từ những cột ấy, một rừng gỗ bá hương Li-ban dưới một mái (bản King James đếm “bốn mươi lăm cây, mười lăm cây mỗi dãy”, dù tiếng Hê-bơ-rơ có thể đếm các phòng bên chứ không phải cột), được chiếu sáng bởi ba dãy cửa sổ “đối ngang nhau”. Bên cạnh là hiên cột, hiên ngai nơi vua xét xử, cung của vua và cung của con gái Pha-ra-ôn."
    - "Đó là sảnh quốc lễ và kho báu. Sa-lô-môn “lại làm ba trăm cái khiên nhỏ, bằng vàng đánh giác, cứ mỗi cái dùng ba min vàng. Vua để các khiên ấy trong đền rừng Li-ban”, cùng hai trăm khiên lớn bằng vàng; “những khí dụng trong cung rừng Li-ban đều cũng bằng vàng ròng. Chẳng có chi là bằng bạc”. Si-sắc của Ê-díp-tô đem đi các khiên vàng vào năm thứ năm của Rô-bô-am, và Rô-bô-am thay bằng đồng. Về sau nơi này làm kho khí giới: khi Giê-ru-sa-lem bị đe dọa vào thời Ê-sai, “trong ngày đó ngươi trông về khí giới của nhà rừng”."
    - "Chưa tìm thấy gì của nó. Cung điện thường được đặt phía nam Đền thờ, giữa Núi Đền Thờ và Thành Đa-vít, vùng đất bị xây đi xây lại nhiều lần; không dấu tích nào của nó được xác định. Các học giả so sánh gian sảnh với các cung điện có cột của các thành Sy-ri và Hittite cùng thời, và lời thuật trong sách Các Vua, cùng mô tả của Josephus, là tất cả những gì còn lại."
  ro:
    - "Casa Pădurii Libanului era cea mai mare clădire a palatului lui Solomon din Ierusalim, ridicată în cei treisprezece ani pe care i-a petrecut zidind propria casă după cei șapte ani ai Templului. Regii dau dimensiunile ei: o sută de coți lungime, cincizeci lățime și treizeci înălțime, pe patru rânduri de stâlpi de cedru, cu grinzi de cedru pe stâlpi, circa 45 pe 22 m, mai mare în plan decât Templul însuși. Numele ei venea de la acei stâlpi, o pădure de cedru din Liban sub un singur acoperiș (textul King James numără patruzeci și cinci de stâlpi, cincisprezece într-un rând, deși ebraica poate număra încăperi laterale, nu stâlpi), luminată de trei rânduri de ferestre, unde lumina era față în față cu lumina. Alături se aflau sala stâlpilor, sala tronului unde judeca regele și casa lui proprie și a fiicei lui Faraon."
    - "Era o sală de ceremonie și o vistierie. Solomon a făcut „trei sute de paveze de aur bătute”, câte trei mine de aur pe scut, și „le-a pus împăratul în casa dumbrăvii Livanului”, împreună cu două sute de scuturi mai mari de aur; toate vasele Casei Pădurii Libanului erau de aur curat, nici unul de argint. Șișac al Egiptului a luat scuturile de aur în al cincilea an al lui Roboam, iar Roboam le-a înlocuit cu unele de bronz. Mai târziu a servit drept arsenal: când Ierusalimul era amenințat în zilele lui Isaia, în ziua aceea te uitai la armele din Casa Pădurii."
    - "Nu s-a găsit nimic din ea. Palatul este plasat de obicei la sud de Templu, între Muntele Templului și Cetatea lui David, un teren construit iar și iar; nu s-a identificat nicio rămășiță a lui. Cercetătorii compară sala cu palatele cu stâlpi ale orașelor siriene și hitite din epocă, iar relatarea din Regi, împreună cu descrierea lui Iosif Flaviu, este tot ce a rămas."
  bg:
    - "Домът от ливанско дърво беше най-голямата сграда в двореца на Соломон в Йерусалим, издигнат през тринадесетте години, които той посвети на „дома си“ след седемте години на Храма. Царе дава размерите му: „дължината му бе сто лакти, и ширината му петдесет лакти, и височината му тридесет лакти, на четири реда от кедрови стълпове, с кедрови греди върху стълповете“, около 45 на 22 м, по-голям по площ от самия Храм. Името му идва от тези стълпове — гора от ливански кедър под един покрив (текстът на King James брои „четиридесет и пет стълпа, по петнадесет в един ред“, макар еврейският текст може би да брои странични стаи, а не стълпове), осветена от три реда прозорци, където „срещаше се прозорец с прозорец“. До него стояха притворът от стълпове, притворът на престола, където царят съдеше, и неговият собствен дом и домът на дъщерята на фараона."
    - "Той беше зала за държавни церемонии и съкровищница. Соломон направи „триста щитчета от ковано злато: три литри злато се иждивяваха за всяко щитче; и тури ги царят в дома на Ливанската дъбрава“, заедно с двеста по-големи златни щита; „всичките съсъди в дома на Ливанската дъбрава от чисто злато: ни един от сребро“. Сусаким Египетски отнесе златните щитове в петата година на Ровоам, а Ровоам ги замени с медни. По-късно той служеше като оръжейна: когато Йерусалим беше застрашен в дните на Исаия, „в онзи ден си погледнал в оръжията на дъбравния дом“."
    - "Нищо от него не е открито. Дворецът обикновено се поставя на юг от Храма, между Храмовия хълм и Давидовия град, на земя, застроявана отново и отново; никакви негови останки не са идентифицирани. Учените сравняват залата с дворците със стълпове в сирийските и хетските градове от онази епоха, а разказът в Царе заедно с описанието на Йосиф Флавий е всичко, което е останало."
