# Overview article (ADR 0007). Mainstream facts only; nothing of the building has been found, and that is said.
id: house-of-the-forest-of-lebanon
place: a966bdf
title:
  en: "House of the Forest of Lebanon"
  ru: "Дом из Ливанского дерева"
  uk: "Дім із ліванського дерева"
  es: "Casa del Bosque del Líbano"
  pt: "Casa do Bosque do Líbano"
  de: "Libanonwaldhaus"
  fr: "Maison de la forêt du Liban"
body:
  en:
    - "The House of the Forest of Lebanon was the largest building of Solomon's palace in Jerusalem, raised in the thirteen years he spent on “his own house” after the seven years of the Temple. Kings gives its measure: “the length thereof was an hundred cubits, and the breadth thereof fifty cubits, and the height thereof thirty cubits, upon four rows of cedar pillars, with cedar beams upon the pillars”, about 45 by 22 m, bigger in plan than the Temple itself. Its name came from those pillars, forty-five of them in rows of fifteen, a forest of Lebanon cedar under one roof, lit by three rows of windows, where “light was against light”. Beside it stood the hall of pillars, the hall of the throne where the king judged, and his own house and that of Pharaoh's daughter."
    - "It was a hall of state and a treasury. Solomon “made three hundred shields of beaten gold; three pound of gold went to one shield: and the king put them in the house of the forest of Lebanon”, with two hundred larger targets of gold; “all the vessels of the house of the forest of Lebanon were of pure gold; none were of silver”. Shishak of Egypt carried off the shields of gold in Rehoboam's fifth year, and Rehoboam replaced them with bronze. Later it served as an armoury: when Jerusalem was threatened in Isaiah's day, “thou didst look in that day to the armour of the house of the forest”."
    - "Nothing of it has been found. The palace is usually placed south of the Temple, between the Temple Mount and the City of David, ground that was built over again and again; no remains of it have been identified. Scholars compare the hall with the pillared palaces of the Syrian and Hittite cities of the age, and the account in Kings, with Josephus' description, is all that remains."
  ru:
    - "Дом из Ливанского дерева — самая большая постройка дворца Соломона в Иерусалиме, возведённая за тринадцать лет, которые он потратил на «свой дом» после семи лет строительства Храма. Книга Царств даёт его размеры: «длиною во сто локтей, шириною в пятьдесят локтей, а вышиною в тридцать локтей, на четырех рядах кедровых столбов; и кедровые бревна положены были на столбах», около 45 на 22 м, то есть в плане больше самого Храма. Имя дому дали эти столбы, сорок пять, по пятнадцати в ряд, — лес ливанского кедра под одной крышей, освещённый тремя рядами окон, «окно против окна». Рядом стояли притвор из столбов, притвор с престолом, где царь судил, его собственный дом и дом дочери фараона."
    - "Это был парадный зал и сокровищница. Соломон сделал «триста меньших щитов из кованого золота, по три мины золота пошло на каждый щит; и поставил их царь в доме из Ливанского дерева», а с ними двести больших золотых щитов; «все сосуды в доме из Ливанского дерева были из чистого золота; из серебра ничего не было». Сусаким Египетский увёз золотые щиты на пятом году Ровоама, и Ровоам заменил их медными. Позже дом служил арсеналом: когда в дни Исаии Иерусалиму грозила война, «ты в тот день обращаешь взор на запас оружия в доме кедровом»."
    - "От него ничего не найдено. Дворец обычно помещают к югу от Храма, между Храмовой горой и городом Давида, — на земле, которую застраивали снова и снова; никаких его остатков не опознано. Учёные сравнивают зал с колонными дворцами сирийских и хеттских городов той эпохи, а рассказ книги Царств вместе с описанием Иосифа Флавия — всё, что осталось."
  uk:
    - "Дім із ліванського дерева був найбільшою спорудою палацу Соломона в Єрусалимі, зведеною за тринадцять років, які він витратив на «Свою ж палату» після семи років храму. Книга Царів дає його розміри: «сотню локот завдовжки, пятьдесять локот завширшки й трийцять локот заввишки, на чотирьох рядах кедрових стовпів, і кедрове бруссє на стовпах», приблизно 45 на 22 м, більший у плані за сам храм. Його назва пішла від цих стовпів, сорока п’яти, по п’ятнадцять у ряду, лісу ліванського кедра під одним дахом, освітленого трьома рядами вікон, де було «вікно проти вікна». Поряд стояли зала стовпів, престольна зала, де цар судив, а також його власний дім і дім дочки фараона."
    - "Це була парадна зала і скарбниця. Соломон велів зробити двісті великих щитів із кованого золота і «триста меньших щитів із кованого золота; три секлі золота обернув на кожен щит, і повішав їх царь у кедровому дому»; «усе знаряддє в кедровому будинку було з чистого золота; нїчого не було з срібла». Сусакім Єгипетський забрав золоті щити п’ятого року Ровоама, і Ровоам замінив їх мідними. Пізніше він правив за збройову: коли за Ісаї Єрусалим опинився під загрозою, «а ти в той день озираєшся за оружними запасами в палатї кедровій»."
    - "Нічого з нього не знайдено. Палац зазвичай розміщують на південь від храму, між Храмовою горою та Містом Давида, на ґрунті, який забудовували знову й знову; жодних його решток не ототожнено. Дослідники порівнюють залу зі стовповими палацами сирійських і хетських міст того часу, і оповідь Книг Царів із описом Йосифа Флавія — все, що лишилося."
  es:
    - "La Casa del Bosque del Líbano fue el mayor edificio del palacio de Salomón en Jerusalén, levantado en los trece años que dedicó a «su propia casa» después de los siete años del Templo. Reyes da sus medidas: «la cual tenía cien codos de longitud, y cincuenta codos de anchura, y treinta codos de altura, sobre cuatro órdenes de columnas de cedro, con vigas de cedro sobre las columnas», unos 45 por 22 m, mayor en planta que el propio Templo. Su nombre procedía de esas columnas, cuarenta y cinco en hileras de quince, un bosque de cedro del Líbano bajo un solo techo, iluminado por tres hileras de ventanas, donde había «una ventana contra la otra». A su lado estaban el pórtico de columnas, el pórtico del trono donde el rey juzgaba, y su propia casa y la de la hija del faraón."
    - "Era una sala de ceremonias y un tesoro. Salomón hizo «trescientos escudos de oro extendido, en cada uno de los cuales gastó tres libras de oro: y púsolos el rey en la casa del bosque del Líbano», con doscientos paveses mayores de oro; «toda la vajilla de la casa del bosque del Líbano era de oro fino: no había plata». Sisac de Egipto se llevó los escudos de oro en el quinto año de Roboam, y Roboam los sustituyó por otros de bronce. Más tarde sirvió de armería: cuando Jerusalén fue amenazada en tiempos de Isaías, «miraste en aquel día hacia la casa de armas del bosque»."
    - "No se ha hallado nada de ella. El palacio suele situarse al sur del Templo, entre el monte del Templo y la Ciudad de David, terreno que se edificó una y otra vez; no se han identificado restos. Los estudiosos comparan la sala con los palacios de columnas de las ciudades sirias e hititas de la época, y el relato de Reyes, con la descripción de Josefo, es todo lo que queda."
  pt:
    - "A Casa do Bosque do Líbano era o maior edifício do palácio de Salomão em Jerusalém, erguido nos treze anos que ele passou em “sua própria casa” depois dos sete anos do Templo. Reis dá sua medida: “Seu comprimento era de cem côvados, sua largura de cinquenta côvados, e sua altura de trinta côvados, sobre quatro fileiras de colunas de cedro, com vigas de cedro sobre as colunas”, cerca de 45 por 22 m, maior em planta que o próprio Templo. Seu nome vinha dessas colunas, quarenta e cinco delas em fileiras de quinze, uma floresta de cedro do Líbano sob um só teto, iluminada por três fileiras de janelas, onde “janela ficava de frente para janela”. Ao lado ficavam o pórtico das colunas, o pórtico do trono onde o rei julgava, e sua própria casa e a da filha do faraó."
    - "Era um salão de Estado e um tesouro. Salomão “fez trezentos escudos de ouro batido; três minas de ouro foram usadas para cada escudo; e o rei os colocou na Casa da Floresta do Líbano”, com duzentos escudos maiores de ouro; “todos os utensílios da Casa da Floresta do Líbano eram de ouro puro. Nenhum era de prata”. Sisaque do Egito levou os escudos de ouro no quinto ano de Roboão, e Roboão os substituiu por escudos de bronze. Mais tarde serviu de arsenal: quando Jerusalém foi ameaçada nos dias de Isaías, “vocês olharam naquele dia para as armaduras na casa da floresta”."
    - "Nada dela foi achado. O palácio é usualmente situado ao sul do Templo, entre o monte do Templo e a Cidade de Davi, terreno que foi edificado de novo repetidas vezes; nenhum resto dele foi identificado. Os estudiosos comparam o salão aos palácios de colunas das cidades sírias e hititas da época, e o relato de Reis, com a descrição de Josefo, é tudo o que resta."
  de:
    - "Das Libanonwaldhaus war das größte Gebäude von Salomos Palast in Jerusalem, errichtet in den dreizehn Jahren, die er nach den sieben Jahren des Tempels „an seinem Hause“ baute. Die Königsbücher geben sein Maß an: „hundert Ellen lang, fünfzig Ellen weit und dreißig Ellen hoch. Auf vier Reihen von zedernen Säulen“, etwa 45 mal 22 m, im Grundriss größer als der Tempel selbst. Sein Name kam von diesen Säulen, fünfundvierzig in Reihen zu fünfzehn, ein Wald aus Libanonzedern unter einem Dach, von drei Fensterreihen erhellt, wo „Fenster einander gegenüber dreimal“ waren. Daneben standen die Säulenhalle, die Thronhalle, wo der König richtete, und sein eigenes Haus und das der Tochter Pharaos."
    - "Es war Staatshalle und Schatzhaus. Salomo ließ „zweihundert Schilde vom besten Gold“ machen, „sechshundert Lot tat er zu einem Schild“, „und dreihundert Tartschen vom besten Gold, je drei Pfund Gold zu einer Tartsche. Und der König tat sie in das Haus am Wald Libanon“; „alle Gefäße im Hause vom Wald Libanon waren auch lauter Gold; denn das Silber achtete man zu den Zeiten Salomos für nichts“. Schischak von Ägypten trug die goldenen Schilde im fünften Jahr Rehabeams fort, und Rehabeam ersetzte sie durch bronzene. Später diente es als Zeughaus: Als Jerusalem zu Jesajas Zeit bedroht war, sah man „zu der Zeit nach Rüstungen im Hause des Waldes“."
    - "Nichts davon ist gefunden. Der Palast wird meist südlich des Tempels angesetzt, zwischen dem Tempelberg und der Stadt Davids, Gelände, das immer wieder überbaut wurde; keine Reste sind identifiziert. Die Forschung vergleicht den Saal mit den Säulenpalästen der syrischen und hethitischen Städte jener Zeit, und der Bericht der Königsbücher mit der Beschreibung des Josephus ist alles, was bleibt."
  fr:
    - "La maison de la forêt du Liban était le plus grand bâtiment du palais de Salomon à Jérusalem, élevé pendant les treize ans qu’il consacra à « sa maison » après les sept ans du Temple. Les Rois en donnent la mesure : « longue de cent coudées, large de cinquante coudées, et haute de trente coudées. Elle reposait sur quatre rangées de colonnes de cèdre, et il y avait des poutres de cèdre sur les colonnes », soit environ 45 sur 22 m, plus vaste en plan que le Temple lui-même. Son nom venait de ces colonnes, quarante-cinq en rangées de quinze, une forêt de cèdre du Liban sous un seul toit, éclairée par trois rangées de fenêtres, où « les ouvertures étaient les unes vis-à-vis des autres ». À côté se trouvaient le portique des colonnes, le portique du trône où le roi rendait la justice, et sa propre maison et celle de la fille de Pharaon."
    - "C’était une salle d’apparat et un trésor. Salomon fit « deux cents grands boucliers d’or battu » et « trois cents autres boucliers d’or battu, pour chacun desquels il employa trois mines d’or ; et le roi les mit dans la maison de la forêt du Liban » ; « toute la vaisselle de la maison de la forêt du Liban était d’or pur. Rien n’était d’argent. » Schischak d’Égypte emporta les boucliers d’or la cinquième année de Roboam, et Roboam les remplaça par des boucliers d’airain. Plus tard, elle servit d’arsenal : quand Jérusalem fut menacée du temps d’Ésaïe, « en ce jour tu visites les armures de la maison de la forêt »."
    - "Rien n’en a été retrouvé. Le palais est d’ordinaire placé au sud du Temple, entre le mont du Temple et la Cité de David, terrain reconstruit à maintes reprises ; aucun vestige n’en a été identifié. Les spécialistes comparent la salle aux palais à colonnes des villes syriennes et hittites de l’époque, et le récit des Rois, avec la description de Josèphe, est tout ce qui subsiste."
