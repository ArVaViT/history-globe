# Overview article (ADR 0007). Mainstream facts only; a minor place: placed near Lod by Nehemiah's list; the candidates on the map are given as proposals, and the possible identity with Gath of 1 Chronicles is left open.
id: gittaim
place: ab98f8c
title:
  en: "Gittaim"
  ru: "Гиффаим"
  uk: "Гіттаїм"
  es: "Gitaim"
  pt: "Gitaim"
  de: "Gittajim"
  fr: "Guitthaïm"
body:
  en:
    - "Gittaim, “two winepresses”, was a town to which the people of Beeroth fled. The note comes in the story of the murder of Ish-bosheth by Baanah and Rechab, sons of Rimmon the Beerothite, of Benjamin: “the Beerothites fled to Gittaim, and were sojourners there until this day.” Why they fled is not said; some link it with Saul's attack on the Gibeonites, to whose league Beeroth belonged. After the exile Gittaim appears again in the list of towns settled by Benjamin, between Ramah and Hadid, near Lod and Ono."
    - "That is all that is known. The company of Hadid and Lod puts Gittaim on the edge of the coastal plain, and Benjamin Mazar argued that some biblical mentions of a Gath, among them the Gath taken by Hazael, mean Gittaim, though most scholars have not followed him. The map's main candidate is Ras Abu Hamid near Ramla; Ramla itself, al-Burj and Gath-padalla in the Sharon have also been proposed. No inscription names the town, and none of these sites has been excavated as Gittaim."
  ru:
    - "Гиффаим, «два точила», — город, куда бежали жители Беерофа. Заметка стоит в рассказе об убийстве Иевосфея Бааной и Рихавом, сыновьями Реммона Беерофянина из Вениамина: «И убежали Беерофяне в Гиффаим и остались там пришельцами до сего дня». Почему они бежали, не сказано; некоторые связывают это с нападением Саула на Гаваонитян, к союзу которых принадлежал Беероф. После плена Гиффаим снова появляется в списке городов, заселённых Вениамином, между Рамой и Хадидом, близ Лидды и Оно."
    - "Больше ничего не известно. Соседство с Хадидом и Лиддой помещает Гиффаим на краю приморской равнины, и Беньямин Мазар доказывал, что некоторые библейские упоминания Гефа, среди них Геф, взятый Азаилом, означают Гиффаим, хотя большинство учёных за ним не последовало. Главный кандидат на карте — Рас-Абу-Хамид близ Рамлы; предлагали также саму Рамлу, Эль-Бурдж и Гат-Падаллу в Сароне. Ни одна надпись города не называет, и ни одно из этих мест не раскапывали как Гиффаим."
  uk:
    - "Гіттаїм, «дві давильні», було містом, куди втекли жителі Беерота. Ця примітка міститься в історії вбивства Ішбошета Бааною та Ріхавом, синами Реммона Бееротянина з Веніяминового коліна: «Бееротяне повтїкали в Гиттаїм, і держались там по сей день заволоками». Чому вони втекли, не сказано; дехто пов’язує це з нападом Саула на гаваонців, до союзу яких належав Беерот. Після вигнання Гіттаїм знову з’являється в переліку міст, які заселило Веніяминове коліно, між Рамою та Хадідом, поблизу Лідди й Оно."
    - "Це все, що відомо. Сусідство Хадіда й Лідди розташовує Гіттаїм на краю прибережної рівнини, а Веніямин Мазар доводив, що деякі біблійні згадки Гата, серед них Гат, узятий Азаїлом, означають Гіттаїм, хоча більшість дослідників за ним не пішла. Головний кандидат на карті — Рас-Абу-Хамід поблизу Рамли; пропонували також саму Рамлу, Аль-Бурдж і Гат-Падаллу на Шароні. Жоден напис не називає міста, і жодне з цих місць не розкопували як Гіттаїм."
  es:
    - "Gitaim, «dos lagares», era una población a la que huyeron los habitantes de Beerot. La noticia aparece en el relato del asesinato de Is-boset por Baana y Recab, hijos de Rimón el beerotita, de Benjamín: «Estos Beerothitas se habían huído á Gittaim, y habían sido peregrinos allí hasta entonces». No se dice por qué huyeron; algunos lo vinculan con el ataque de Saúl a los gabaonitas, a cuya alianza pertenecía Beerot. Después del destierro Gitaim aparece de nuevo en la lista de poblaciones habitadas por Benjamín, entre Ramá y Hadid, cerca de Lida y Ono."
    - "Eso es todo lo que se sabe. La vecindad de Hadid y Lida sitúa Gitaim en el borde de la llanura costera, y Benjamin Mazar sostuvo que algunas menciones bíblicas de un Gat, entre ellas la Gat tomada por Hazael, se refieren a Gitaim, aunque la mayoría de los estudiosos no lo han seguido. El principal candidato del mapa es Ras Abu Hamid, cerca de Ramla; también se han propuesto la propia Ramla, al-Burj y Gat-padala en el Sarón. Ninguna inscripción nombra la población, y ninguno de estos sitios ha sido excavado como Gitaim."
  pt:
    - "Gitaim, “dois lagares”, era uma cidade para a qual fugiram os habitantes de Beerote. A nota vem na história do assassinato de Is-Bosete por Baaná e Recabe, filhos de Rimom, o beerotita, de Benjamim: “os beerotitas fugiram para Gitaim, e têm vivido como estrangeiros ali até hoje”. Por que fugiram não é dito; alguns ligam isso ao ataque de Saul aos gibeonitas, à aliança dos quais Beerote pertencia. Depois do exílio, Gitaim aparece de novo na lista das cidades povoadas por Benjamim, entre Ramá e Hadide, perto de Lode e Ono."
    - "Isso é tudo o que se sabe. A vizinhança de Hadide e Lode situa Gitaim na orla da planície costeira, e Benjamin Mazar sustentou que algumas menções bíblicas a uma Gate, entre elas a Gate tomada por Hazael, designam Gitaim, embora a maioria dos estudiosos não o tenha seguido. O principal candidato do mapa é Ras Abu Hamid, perto de Ramla; a própria Ramla, al-Burj e Gate-Padala, em Sarom, também foram propostas. Nenhuma inscrição nomeia a cidade, e nenhum desses sítios foi escavado como Gitaim."
  de:
    - "Gittajim, „zwei Keltern“, war eine Stadt, in die die Leute von Beerot flohen. Die Notiz steht in der Geschichte von der Ermordung Isch-Boschets durch Baana und Rechab, die Söhne des Beerotiters Rimmon aus Benjamin: „die Beerothiter waren geflohen gen Gitthaim und wohnten daselbst gastweise bis auf den heutigen Tag“. Warum sie flohen, wird nicht gesagt; manche verbinden es mit Sauls Angriff auf die Gibeoniter, zu deren Bund Beerot gehörte. Nach dem Exil erscheint Gittajim erneut in der Liste der von Benjamin besiedelten Städte, zwischen Rama und Hadid, nahe Lod und Ono."
    - "Das ist alles, was bekannt ist. Die Nachbarschaft von Hadid und Lod setzt Gittajim an den Rand der Küstenebene, und Benjamin Mazar vertrat, einige biblische Erwähnungen eines Gat, darunter das von Hasaël eingenommene, meinten Gittajim, doch die meisten Forscher sind ihm nicht gefolgt. Der Hauptkandidat auf der Karte ist Ras Abu Hamid bei Ramla; auch Ramla selbst, al-Burdsch und Gat-Padalla im Scharon sind vorgeschlagen worden. Keine Inschrift nennt die Stadt, und keine dieser Stätten ist als Gittajim ausgegraben worden."
  fr:
    - "Guitthaïm, « deux pressoirs », était une ville où se réfugièrent les gens de Beéroth. La notice vient du récit du meurtre d’Isch-Boscheth par Baana et Récab, fils de Rimmon de Beéroth, de Benjamin : « les Beérothiens s’étaient enfuis à Guitthaïm, où ils ont habité jusqu’à ce jour. » On ne dit pas pourquoi ils fuirent ; certains y voient un lien avec l’attaque de Saül contre les Gabaonites, dans l’alliance desquels entrait Beéroth. Après l’exil, Guitthaïm reparaît dans la liste des villes occupées par Benjamin, entre Rama et Hadid, près de Lydde et d’Ono."
    - "C’est tout ce que l’on sait. Le voisinage de Hadid et de Lydde place Guitthaïm en bordure de la plaine côtière, et Benjamin Mazar soutenait que certaines mentions bibliques d’un Gath, dont le Gath pris par Hazaël, désignent Guitthaïm, bien que la plupart des spécialistes ne l’aient pas suivi. Le principal candidat de la carte est Ras Abu Hamid, près de Ramla ; Ramla elle-même, al-Burj et Gath-Padalla dans le Saron ont aussi été proposés. Aucune inscription ne nomme la ville, et aucun de ces sites n’a été fouillé comme étant Guitthaïm."
scripture:
  - 2Sam.4.2-2Sam.4.3
  - Neh.11.33
  - 2Kgs.12.17
sources:
