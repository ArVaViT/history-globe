body:
  en:
    - "Gittaim, “two winepresses”, was a town to which the people of Beeroth fled. The note comes in the story of the murder of Ish-bosheth by Baanah and Rechab, sons of Rimmon the Beerothite, of Benjamin: “the Beerothites fled to Gittaim, and were sojourners there until this day.” Why they fled is not said; some link it with Saul's attack on the Gibeonites, to whose league Beeroth belonged. After the exile Gittaim appears again in the list of towns settled by Benjamin, between Ramah and Hadid, near Lod and Ono."
    - "That is all that is known. The company of Hadid and Lod puts Gittaim on the edge of the coastal plain, and Benjamin Mazar argued that some biblical mentions of a Gath mean Gittaim, a view that remains debated. The map's main candidate is Ras Abu Hamid near Ramla; Ramla itself, al-Burj and Gath-padalla in the Sharon have also been proposed. No inscription names the town, and none of these sites has been excavated as Gittaim."
  ru:
    - "Гиффаим, «два точила», — город, куда бежали жители Беерофа. Заметка стоит в рассказе об убийстве Иевосфея Бааной и Рихавом, сыновьями Реммона Беерофянина из Вениамина: «И убежали Беерофяне в Гиффаим и остались там пришельцами до сего дня». Почему они бежали, не сказано; некоторые связывают это с нападением Саула на Гаваонитян, к союзу которых принадлежал Беероф. После плена Гиффаим снова появляется в списке городов, заселённых Вениамином, между Рамой и Хадидом, близ Лидды и Оно."
    - "Больше ничего не известно. Соседство с Хадидом и Лиддой помещает Гиффаим на краю приморской равнины, и Беньямин Мазар доказывал, что некоторые библейские упоминания Гефа означают Гиффаим, и этот взгляд остаётся спорным. Главный кандидат на карте — Рас-Абу-Хамид близ Рамлы; предлагали также саму Рамлу, Эль-Бурдж и Гат-Падаллу в Сароне. Ни одна надпись города не называет, и ни одно из этих мест не раскапывали как Гиффаим."
  uk:
    - "Гіттаїм, «дві давильні», було містом, куди втекли жителі Беерота. Ця примітка міститься в історії вбивства Ішбошета Бааною та Ріхавом, синами Реммона Бееротянина з Веніяминового коліна: «Бееротяне повтїкали в Гиттаїм, і держались там по сей день заволоками». Чому вони втекли, не сказано; дехто пов’язує це з нападом Саула на гаваонців, до союзу яких належав Беерот. Після вигнання Гіттаїм знову з’являється в переліку міст, які заселило Веніяминове коліно, між Рамою та Хадідом, поблизу Лідди й Оно."
    - "Це все, що відомо. Сусідство Хадіда й Лідди розташовує Гіттаїм на краю прибережної рівнини, а Веніямин Мазар доводив, що деякі біблійні згадки Гата означають Гіттаїм, і цей погляд досі дискусійний. Головний кандидат на карті — Рас-Абу-Хамід поблизу Рамли; пропонували також саму Рамлу, Аль-Бурдж і Гат-Падаллу на Шароні. Жоден напис не називає міста, і жодне з цих місць не розкопували як Гіттаїм."
  es:
    - "Gitaim, «dos lagares», era una población a la que huyeron los habitantes de Beerot. La noticia aparece en el relato del asesinato de Is-boset por Baana y Recab, hijos de Rimón el beerotita, de Benjamín: «Estos Beerothitas se habían huído á Gittaim, y habían sido peregrinos allí hasta entonces». No se dice por qué huyeron; algunos lo vinculan con el ataque de Saúl a los gabaonitas, a cuya alianza pertenecía Beerot. Después del destierro Gitaim aparece de nuevo en la lista de poblaciones habitadas por Benjamín, entre Ramá y Hadid, cerca de Lida y Ono."
    - "Eso es todo lo que se sabe. La vecindad de Hadid y Lida sitúa Gitaim en el borde de la llanura costera, y Benjamin Mazar sostuvo que algunas menciones bíblicas de un Gat se refieren a Gitaim, una opinión que sigue en debate. El principal candidato del mapa es Ras Abu Hamid, cerca de Ramla; también se han propuesto la propia Ramla, al-Burj y Gat-padala en el Sarón. Ninguna inscripción nombra la población, y ninguno de estos sitios ha sido excavado como Gitaim."
  pt:
    - "Gitaim, “dois lagares”, era uma cidade para a qual fugiram os habitantes de Beerote. A nota vem na história do assassinato de Is-Bosete por Baaná e Recabe, filhos de Rimom, o beerotita, de Benjamim: “os beerotitas fugiram para Gitaim, e têm vivido como estrangeiros ali até hoje”. Por que fugiram não é dito; alguns ligam isso ao ataque de Saul aos gibeonitas, à aliança dos quais Beerote pertencia. Depois do exílio, Gitaim aparece de novo na lista das cidades povoadas por Benjamim, entre Ramá e Hadide, perto de Lode e Ono."
    - "Isso é tudo o que se sabe. A vizinhança de Hadide e Lode situa Gitaim na orla da planície costeira, e Benjamin Mazar sustentou que algumas menções bíblicas a uma Gate designam Gitaim, opinião que continua em debate. O principal candidato do mapa é Ras Abu Hamid, perto de Ramla; a própria Ramla, al-Burj e Gate-Padala, em Sarom, também foram propostas. Nenhuma inscrição nomeia a cidade, e nenhum desses sítios foi escavado como Gitaim."
  de:
    - "Gittajim, „zwei Keltern“, war eine Stadt, in die die Leute von Beerot flohen. Die Notiz steht in der Geschichte von der Ermordung Isch-Boschets durch Baana und Rechab, die Söhne des Beerotiters Rimmon aus Benjamin: „die Beerothiter waren geflohen gen Gitthaim und wohnten daselbst gastweise bis auf den heutigen Tag“. Warum sie flohen, wird nicht gesagt; manche verbinden es mit Sauls Angriff auf die Gibeoniter, zu deren Bund Beerot gehörte. Nach dem Exil erscheint Gittajim erneut in der Liste der von Benjamin besiedelten Städte, zwischen Rama und Hadid, nahe Lod und Ono."
    - "Das ist alles, was bekannt ist. Die Nachbarschaft von Hadid und Lod setzt Gittajim an den Rand der Küstenebene, und Benjamin Mazar vertrat, einige biblische Erwähnungen eines Gat meinten Gittajim, eine Ansicht, die umstritten bleibt. Der Hauptkandidat auf der Karte ist Ras Abu Hamid bei Ramla; auch Ramla selbst, al-Burdsch und Gat-Padalla im Scharon sind vorgeschlagen worden. Keine Inschrift nennt die Stadt, und keine dieser Stätten ist als Gittajim ausgegraben worden."
  fr:
    - "Guitthaïm, « deux pressoirs », était une ville où se réfugièrent les gens de Beéroth. La notice vient du récit du meurtre d’Isch-Boscheth par Baana et Récab, fils de Rimmon de Beéroth, de Benjamin : « les Beérothiens s’étaient enfuis à Guitthaïm, où ils ont habité jusqu’à ce jour. » On ne dit pas pourquoi ils fuirent ; certains y voient un lien avec l’attaque de Saül contre les Gabaonites, dans l’alliance desquels entrait Beéroth. Après l’exil, Guitthaïm reparaît dans la liste des villes occupées par Benjamin, entre Rama et Hadid, près de Lydde et d’Ono."
    - "C’est tout ce que l’on sait. Le voisinage de Hadid et de Lydde place Guitthaïm en bordure de la plaine côtière, et Benjamin Mazar soutenait que certaines mentions bibliques d’un Gath désignent Guitthaïm, une opinion qui reste débattue. Le principal candidat de la carte est Ras Abu Hamid, près de Ramla ; Ramla elle-même, al-Burj et Gath-Padalla dans le Saron ont aussi été proposés. Aucune inscription ne nomme la ville, et aucun de ces sites n’a été fouillé comme étant Guitthaïm."
  pl:
    - "Gittaim, „dwie tłocznie”, było miastem, do którego uciekli mieszkańcy Beerot. Wzmianka pojawia się w opowieści o zabójstwie Isz-Boszeta przez Baanę i Rechaba, synów Rimmona z Beerot, z Beniamina: „Uciekli tedy Berotczykowie do Gietaim, i byli tam przychodniami aż do onego dnia”. Dlaczego uciekli, nie powiedziano; niektórzy wiążą to z napaścią Saula na Gibeonitów, do których przymierza należało Beerot. Po wygnaniu Gittaim pojawia się znowu w wykazie miast zasiedlonych przez Beniamina, między Ramą a Chadidem, blisko Lod i Ono."
    - "To wszystko, co wiadomo. Sąsiedztwo Chadidu i Lod umieszcza Gittaim na skraju nizin nadmorskich, a Benjamin Mazar dowodził, że niektóre biblijne wzmianki o Gat oznaczają Gittaim, co pozostaje przedmiotem sporu. Głównym kandydatem na mapie jest Ras Abu Hamid koło Ramli; proponowano też samą Ramlę, al-Burdż i Gat-Padallę na Szaronie. Żaden napis nie wymienia miasta, a żadne z tych stanowisk nie zostało wykopane jako Gittaim."
  it:
    - "Ghittaim, «due torchi», era una città in cui si rifugiarono gli abitanti di Beeròt. La nota compare nel racconto dell’uccisione di Is-Baal da parte di Baana e Recab, figli di Rimmon il Beerotita, di Beniamino: i Beerotiti si rifugiarono a Ghittaim, dove rimasero come forestieri «fino al dì d’oggi». Perché fuggirono non è detto; alcuni lo collegano all’attacco di Saul contro i Gabaoniti, alla cui alleanza Beeròt apparteneva. Dopo l’esilio Ghittaim compare di nuovo nell’elenco delle città abitate da Beniamino, fra Rama e Adid, presso Lidda e Ono."
    - "Questo è tutto ciò che si sa. La compagnia di Adid e Lidda pone Ghittaim al margine della pianura costiera, e Benjamin Mazar sostenne che alcune menzioni bibliche di una Gat indichino Ghittaim, un’opinione che resta dibattuta. Il candidato principale sulla mappa è Ras Abu Hamid presso Ramla; sono state proposte anche la stessa Ramla, al-Burj e Gat-Padalla nel Saròn. Nessuna iscrizione nomina la città, e nessuno di questi siti è stato scavato come Ghittaim."
  nl:
    - "Gittaïm, “twee persen”, was een stad waarheen de inwoners van Beërot vluchtten. De aantekening staat in het verhaal van de moord op Isboset door Baäna en Rekab, zonen van Rimmon de Beërotiet, uit Benjamin: “De Beerothieten waren gevloden naar Gitthaim, en waren aldaar vreemdelingen tot op dezen dag.” Waarom zij vluchtten, wordt niet gezegd; sommigen brengen het in verband met Sauls aanval op de Gibeonieten, tot wier verbond Beërot behoorde. Na de ballingschap komt Gittaïm opnieuw voor in de lijst van steden waar Benjamin zich vestigde, tussen Rama en Chadid, bij Lydda en Ono."
    - "Meer is er niet bekend. De buurplaatsen Chadid en Lydda plaatsen Gittaïm aan de rand van de kustvlakte, en Benjamin Mazar betoogde dat sommige bijbelse vermeldingen van een Gat Gittaïm bedoelen, een opvatting die omstreden blijft. De belangrijkste kandidaat op de kaart is Ras Abu Hamid bij Ramla; ook Ramla zelf, al-Burj en Gat-Padalla in de Saron zijn voorgesteld. Geen opschrift noemt de stad, en geen van deze plaatsen is als Gittaïm opgegraven."
  cs:
    - "Gitajim, „dva lisy“, bylo město, kam uprchli obyvatelé Beerótu. Poznámka přichází v příběhu o vraždě Íš-bošeta Baanou a Rekabem, syny Rimmona Beerótského z Benjamína: „Utekli pak byli Berotští do Gittaim, a byli tam pohostinu až do toho dne.“ Proč utekli, není řečeno; někteří to spojují se Saulovým útokem na Gibeonské, k jejichž spolku Beerót patřil. Po exilu se Gitajim objevuje znovu v seznamu měst osídlených Benjamínem, mezi Rámou a Chadídem, poblíž Lodu a Onó."
    - "To je vše, co je známo. Sousedství Chadídu a Lodu klade Gitajim na okraj pobřežní roviny a Benjamin Mazar tvrdil, že některé biblické zmínky o Gatu míní Gitajim, což zůstává sporné. Hlavním kandidátem na mapě je Ras Abu Hamid u Ramly; navrhovány byly také samotná Ramla, al-Burj a Gat-padalla v Šaronu. Žádný nápis město nejmenuje a žádné z těchto míst nebylo vykopáváno jako Gitajim."
  sv:
    - "Gittajim, ”två vinpressar”, var en stad dit invånarna i Beerot flydde. Notisen kommer i berättelsen om mordet på Ish-Boshet av Baana och Rekav, söner till Rimmon från Beerot, av Benjamin: ”beerotiterna flydde till Gittaim och bodde där sedan såsom främlingar, vilket de göra ännu i dag.” Varför de flydde sägs inte; några kopplar det till Sauls angrepp på gibeoniterna, vars förbund Beerot tillhörde. Efter exilen förekommer Gittajim åter i förteckningen över städer som benjaminiterna bosatte sig i, mellan Rama och Hadid, nära Lod och Ono."
    - "Det är allt som är känt. Att Hadid och Lod nämns tillsammans placerar Gittajim i kanten av kustslätten, och Benjamin Mazar hävdade att vissa bibliska omnämnanden av ett Gat avser Gittajim, en uppfattning som förblir omdebatterad. Kartans huvudkandidat är Ras Abu Hamid nära Ramla; Ramla självt, al-Burj och Gat-Padalla på Saronslätten har också föreslagits. Ingen inskrift nämner staden, och ingen av platserna har grävts ut som Gittajim."
  nb:
    - "Gittajim, «to vinpresser», var en by som folket fra Beerot flyktet til. Notisen står i fortellingen om drapet på Isjbosjet av Baana og Rekab, sønner av benjaminitten Rimmon fra Beerot: «be'erotittene var flyktet til Gitta'im, og der har de holdt til helt til denne dag.» Hvorfor de flyktet, sies ikke; noen knytter det til Sauls angrep på gibeonittene, til hvis pakt Beerot hørte. Etter eksilet dukker Gittajim opp igjen i listen over byer som Benjamin bosatte seg i, mellom Rama og Hadid, nær Lod og Ono."
    - "Det er alt som er kjent. Sammen med Hadid og Lod plasserer den Gittajim i utkanten av kystsletten, og Benjamin Mazar hevdet at noen bibelske omtaler av en Gat betyr Gittajim, et syn som fortsatt er omdiskutert. Kartets viktigste kandidat er Ras Abu Hamid ved Ramla; Ramla selv, al-Burj og Gat-Padalla i Sjaron er også foreslått. Ingen innskrift nevner byen, og ingen av disse stedene er utgravd som Gittajim."
  tl:
    - "Ang Githaim, “dalawang pisaan ng alak”, ay isang bayang pinagtakasan ng mga taga-Beeroth. Dumarating ang tala sa kuwento ng pagpatay kay Is-boseth nina Baana at Rechab, mga anak ni Rimmon na Beerothita, ng Benjamin: “ang mga Beerothita ay nagsitakas sa Githaim, at nangakipamayan doon hanggang sa araw na ito.” Hindi sinasabi kung bakit sila tumakas; iniuugnay ito ng ilan sa pag-atake ni Saul sa mga taga-Gabaon, na ang kasunduan ay kinabibilangan ng Beeroth. Pagkatapos ng pagkatapon, muling lumilitaw ang Githaim sa listahan ng mga bayang tinirhan ng Benjamin, sa pagitan ng Rama at Hadid, malapit sa Lod at Ono."
    - "Iyon lamang ang nalalaman. Inilalagay ng pagsasama ng Hadid at Lod ang Githaim sa gilid ng kapatagan sa baybayin, at ipinaglaban ni Benjamin Mazar na ang ilang pagbanggit sa Gath sa Biblia ay tumutukoy sa Githaim, isang pananaw na pinagtatalunan pa rin. Ang pangunahing kandidato ng mapa ay ang Ras Abu Hamid malapit sa Ramla; iminungkahi na rin ang Ramla mismo, al-Burj at Gath-padalla sa Saron. Walang inskripsiyong nagpapangalan sa bayan, at wala sa mga lugar na ito ang hinukay bilang Githaim."
  da:
    - "Gittajim, »to vinpresser«, var en by, hvortil folkene fra Be'erot flygtede. Noten kommer i fortællingen om mordet på Isj-Bosjet ved Baana og Rekab, sønner af beerotitten Rimmon, af Benjamin: »Beerothiterne vare flygtede til Gitthajim og vare der som fremmede indtil denne Dag.« Hvorfor de flygtede, siges ikke; nogle knytter det til Sauls angreb på gibeonitterne, til hvis forbund Be'erot hørte. Efter eksilet optræder Gittajim igen i listen over byer bosat af Benjamin, mellem Rama og Hadid, nær Lydda og Ono."
    - "Det er alt, hvad man ved. Naboskabet med Hadid og Lydda placerer Gittajim i udkanten af kystsletten, og Benjamin Mazar hævdede, at nogle bibelske omtaler af en Gat betyder Gittajim, et synspunkt der fortsat er omdiskuteret. Kortets hovedkandidat er Ras Abu Hamid nær Ramla; Ramla selv, al-Burj og Gat-Padalla i Saron er også blevet foreslået. Ingen indskrift nævner byen, og ingen af disse steder er udgravet som Gittajim."
  sr:
    - "Гитајим, „два точила“, био је град у који су побегли становници Вироте. Белешка долази у причи о убиству Исвостеја од Вана и Рихава, синова Римона Вироћанина из Венијаминовог племена: „Вироћани беху побегли у Гитајим, где осташе као дошљаци до данашњег дана.“ Зашто су побегли, не каже се; неки то повезују са Сауловим нападом на Гаваонце, чијем је савезу припадала Вирота. После изгнанства Гитајим се поново појављује у списку градова у којима су се населили Венијаминови, између Раме и Хадида, близу Лиде и Она."
    - "То је све што се зна. Присуство Хадида и Лиде ставља Гитајим на руб приобалне равнице, а Бењамин Мазар је тврдио да неки библијски помени Гата значе Гитајим, гледиште које остаје спорно. Главни кандидат на карти је Рас Абу Хамид код Рамле; предложени су и сама Рамла, Ел-Бурџ и Гат-Падала у Сарону. Ни један натпис не именује град и ни једно од ових налазишта није ископавано као Гитајим."
