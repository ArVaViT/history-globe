# Overview article (ADR 0007). Hobah "on the left hand of Damascus" (north of it) is unidentified; Hoba/Choba (ISBE), Jobar, and Calmet's Abila are shown, with the Genesis Apocryphon's reading Helbon. The Amarna "Upe" link is left out as unverified.
