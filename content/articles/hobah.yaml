body:
  en:
    - "Hobah is the point to which Abram pursued the eastern kings after rescuing Lot: “he divided himself against them, he and his servants, by night, and smote them, and pursued them unto Hobah, which is on the left hand of Damascus.” For someone facing east, as the Hebrew orients itself, the left hand is the north, and the Aramaic Targum Onkelos renders it so. It is named only here, and its site is unknown."
    - "The International Standard Bible Encyclopedia took it to be Hoba (Choba), some 60 miles north-west of Damascus, where the map sets it; Jobar, a village just outside the city with an old synagogue, was thought by some to stand on the site of Hobah, and Augustin Calmet suggested Abila of Lysanias in the Barada valley. The Genesis Apocryphon from Qumran, retelling the story in Aramaic, names the place Helbon, the wine country of Ezekiel north-west of Damascus, which agrees with the north in the Hebrew. No candidate has been tested by excavation."
  ru:
    - "Хова — место, до которого Аврам преследовал восточных царей, освободив Лота: «напал на них ночью, сам и рабы его, и поразил их, и преследовал их до Ховы, что по левую сторону Дамаска». Для того, кто обращён лицом к востоку, как ориентируется еврейский текст, левая сторона — это север, и так передаёт это место арамейский Таргум Онкелоса. Хова названа только здесь, и её место неизвестно."
    - "Международная стандартная библейская энциклопедия отождествляла её с Хобой примерно в 60 милях к северо-западу от Дамаска, где её и ставит карта; некоторые полагали, что на месте Ховы стоит Джобар — селение у самого города со старинной синагогой, а Огюстен Кальме предлагал Авилу Лисаниеву в долине Барады. Апокриф Бытия из Кумрана, пересказывающий эту историю по-арамейски, называет место Хелбоном — винодельческим краем Иезекииля к северо-западу от Дамаска, что согласуется с севером еврейского текста. Ни одно из предложений не проверено раскопками."
  uk:
    - "Хова — місце, до якого Аврам гнав східних царів, визволивши Лота: «І роздїливсь, він і його кметї, на купи, та й напав на їх у ночі і побив їх, і вганяв за ними аж до Хоби, що лежить на півнїч од Дамаска». В єврейському тексті стоїть «ліворуч від Дамаска»: для людини, зверненої на схід, як орієнтується єврейська мова, ліва рука — північ, і арамейський Таргум Онкелоса передає це саме так. Воно назване лише тут, і його місце невідоме."
    - "International Standard Bible Encyclopedia вважала його Хобою (Хоба), приблизно за 60 миль на північний захід від Дамаска, де його й ставить мапа; дехто думав, що Джобар, село відразу за містом зі старою синагогою, стоїть на місці Хови, а Огюстен Кальме припустив Абілу Лісанія в долині Баради. Апокриф Буття з Кумрана, переповідаючи історію арамейською, називає це місце Хелбон, винна країна Єзекіїля на північний захід від Дамаска, що узгоджується з північчю в єврейському тексті. Жодного кандидата не перевірено розкопками."
  es:
    - "Hoba es el punto hasta el que Abram persiguió a los reyes orientales tras rescatar a Lot: «Y derramóse sobre ellos de noche él y sus siervos, é hiriólos, y fuélos siguiendo hasta Hobah, que está á la izquierda de Damasco». Para quien mira al este, como se orienta el hebreo, la izquierda es el norte, y así lo traduce el Targum arameo de Onkelos. Solo se nombra aquí, y su emplazamiento se desconoce."
    - "La International Standard Bible Encyclopedia la tomó por Hoba (Choba), a unas 60 millas al noroeste de Damasco, donde la sitúa el mapa; algunos pensaron que Jobar, una aldea justo fuera de la ciudad con una antigua sinagoga, se alzaba en el sitio de Hoba, y Augustin Calmet sugirió Abila de Lisanias, en el valle del Barada. El Génesis Apócrifo de Qumrán, al relatar la historia en arameo, nombra el lugar Helbón, la región vinícola de Ezequiel al noroeste de Damasco, lo cual concuerda con el norte del hebreo. Ningún candidato ha sido sometido a excavación."
  pt:
    - "Hobá é o ponto até onde Abrão perseguiu os reis do oriente depois de resgatar Ló: “Ele dividiu as suas forças contra eles de noite, ele e os seus servos, e os derrotou, e os perseguiu até Hobá, que fica ao norte de Damasco.” O hebraico diz literalmente “à esquerda” de Damasco, como traduz a Versão King James; para quem olha para o leste, como o hebraico se orienta, a esquerda é o norte, e o Targum aramaico Onkelos o traduz assim. É nomeada somente aqui, e seu sítio é desconhecido."
    - "A International Standard Bible Encyclopedia a tomou por Hoba (Choba), cerca de 60 milhas a noroeste de Damasco, onde o mapa a coloca; Jobar, uma aldeia logo fora da cidade com uma antiga sinagoga, foi tida por alguns como o sítio de Hobá, e Augustin Calmet sugeriu Abila de Lisânias, no vale do Barada. O Gênesis Apócrifo de Qumran, ao recontar a história em aramaico, nomeia o lugar Helbom, a região vinícola de Ezequiel a noroeste de Damasco, o que concorda com o norte do hebraico. Nenhum candidato foi testado por escavação."
  de:
    - "Hoba ist der Punkt, bis zu dem Abram die östlichen Könige verfolgte, nachdem er Lot befreit hatte: Er „teilte sich, fiel des Nachts über sie mit seinen Knechten und schlug sie und jagte sie bis gen Hoba, das zur Linken der Stadt Damaskus liegt“. Für jemanden, der nach Osten blickt, wie sich das Hebräische orientiert, ist die linke Hand der Norden, und der aramäische Targum Onkelos gibt es so wieder. Es wird nur hier genannt, und seine Lage ist unbekannt."
    - "Die International Standard Bible Encyclopedia hielt es für Hoba (Choba), rund 60 Meilen nordwestlich von Damaskus, wo die Karte es einträgt; Dschobar, ein Dorf unmittelbar vor der Stadt mit einer alten Synagoge, wurde von manchen für die Stätte von Hoba gehalten, und Augustin Calmet schlug Abila des Lysanias im Baradatal vor. Das Genesis-Apokryphon aus Qumran, das die Geschichte aramäisch nacherzählt, nennt den Ort Helbon, das Weinland Hesekiels nordwestlich von Damaskus, was mit dem Norden im Hebräischen übereinstimmt. Kein Kandidat ist durch Grabung geprüft worden."
  fr:
    - "Choba (Hobah dans la version du roi Jacques) est le point jusqu’où Abram poursuivit les rois de l’orient après avoir sauvé Lot : « Il divisa sa troupe, pour les attaquer de nuit, lui et ses serviteurs ; il les battit, et les poursuivit jusqu’à Choba, qui est à la gauche de Damas. » Pour qui fait face à l’est, comme l’hébreu s’oriente, la gauche est le nord, et le Targum araméen d’Onkelos le rend ainsi. Elle n’est nommée qu’ici, et son site est inconnu."
    - "L’International Standard Bible Encyclopedia la tenait pour Hoba (Choba), à quelque 60 milles au nord-ouest de Damas, où la carte la place ; Jobar, village juste hors de la ville avec une ancienne synagogue, a été jugé par certains se trouver sur le site de Choba, et Augustin Calmet suggéra Abila de Lysanias dans la vallée du Barada. L’Apocryphe de la Genèse de Qumrân, qui reprend l’histoire en araméen, nomme le lieu Helbon, le pays du vin d’Ézéchiel au nord-ouest de Damas, ce qui s’accorde avec le nord de l’hébreu. Aucun candidat n’a été éprouvé par des fouilles."
  it:
    - "Coba è il punto fino al quale Abramo inseguì i re orientali dopo aver liberato Lot: «divisa la sua schiera per assalirli di notte, egli coi suoi servi li sconfisse e l’inseguì fino a Hobah, che è a sinistra di Damasco». Per chi guarda a oriente, come si orienta l’ebraico, la sinistra è il nord, e il Targum aramaico di Onkelos la rende così. È nominata solo qui e il suo sito è ignoto."
    - "La International Standard Bible Encyclopedia la ritenne Hoba (Choba), a circa 60 miglia a nord-ovest di Damasco, dove la pone la carta; Jobar, un villaggio appena fuori dalla città con un’antica sinagoga, fu ritenuto da alcuni sorgere sul sito di Coba, e Augustin Calmet suggerì Abila di Lisania nella valle del Barada. La Genesi apocrifa di Qumran, che racconta la storia in aramaico, chiama il luogo Chelbon, la terra del vino di Ezechiele a nord-ovest di Damasco, il che concorda con il nord dell’ebraico. Nessun candidato è stato verificato con scavi."
  nl:
    - "Choba is het punt tot waar Abram de oostelijke koningen achtervolgde nadat hij Lot had bevrijd: “En hij verdeelde zich tegen hen des nachts, hij en zijn knechten, en sloeg ze; en hij jaagde hen na tot Hoba toe, hetwelk is ter linkerhand van Damaskus.” Voor wie naar het oosten kijkt, zoals het Hebreeuws zich oriënteert, is de linkerhand het noorden, en de Aramese Targum Onkelos geeft het zo weer. Het wordt alleen hier genoemd, en de ligging is onbekend."
    - "De International Standard Bible Encyclopedia hield het voor Hoba (Choba), zo'n 60 mijl ten noordwesten van Damascus, waar de kaart het zet; Jobar, een dorp net buiten de stad met een oude synagoge, werd door sommigen op de plaats van Choba gedacht, en Augustin Calmet suggereerde Abila van Lysanias in de Baradavallei. De Genesis Apocryphon uit Qumran, die het verhaal in het Aramees navertelt, noemt de plaats Chelbon, het wijnland van Ezechiël ten noordwesten van Damascus, wat overeenstemt met het noorden in het Hebreeuws. Geen enkele kandidaat is door opgravingen getoetst."
  pl:
    - "Choba to punkt, do którego Abram ścigał wschodnich królów po uratowaniu Lota: „I rozdzieliwszy się przypadł na nie w nocy, sam i słudzy jego, i poraził je; i gonił je aż do Hoby, która leży po lewej stronie Damaszku”. Dla kogoś zwróconego na wschód, jak orientuje się hebrajski, lewa strona to północ, i tak oddaje to aramejski Targum Onkelosa. Jest wymieniona tylko tu, a jej położenie jest nieznane."
    - "International Standard Bible Encyclopedia uznała ją za Hobę (Chobę), około 60 mil na północny zachód od Damaszku, gdzie umieszcza ją mapa; Dżubar, wieś tuż za miastem ze starą synagogą, uważano za stojącą na miejscu Choby, a Augustin Calmet zasugerował Abilę Lizaniasza w dolinie Barady. Apokryf Księgi Rodzaju z Qumran, opowiadający historię po aramejsku, nazywa to miejsce Chelbon, krainą winną Ezechiela na północny zachód od Damaszku, co zgadza się z północą w tekście hebrajskim. Żadnej propozycji nie sprawdzono wykopaliskami."
  cs:
    - "Choba je bod, kam Abram pronásledoval východní krále po záchraně Lota: „A odděliv se, připadl na ně v noci, on i služebníci jeho, a porazil je; a stihal je až k Chobah, kteréž leží na levo Damašku.“ Pro toho, kdo hledí na východ, jak se hebrejština orientuje, je levá ruka sever, a aramejský targum Onkelos to tak vykládá. Je jmenována jen zde a její poloha není známa."
    - "International Standard Bible Encyclopedia ji pokládala za Hobu (Chobu), asi 60 mil severozápadně od Damašku, kam ji klade mapa; Džóbar, vesnice těsně za městem se starou synagogou, byl některými pokládán za místo Choby a Augustin Calmet navrhl Abilu Lysaniovu v údolí Barady. Genesis Apokryfon z Kumránu, který příběh vypráví aramejsky, jmenuje místo Chelbon, vinařskou zemi z Ezechiela severozápadně od Damašku, což souhlasí se severem v hebrejštině. Žádný kandidát nebyl ověřen vykopávkami."
  sv:
    - "Hova är punkten dit Abram förföljde de östliga kungarna efter att ha räddat Lot: ”Och han delade sitt folk och överföll dem så om natten med sina tjänare och slog dem, och förföljde dem sedan ända till Hoba, norr om Damaskus”. Hebreiskan har här vänster hand om Damaskus; för den som vänder sig mot öster, så som hebreiskan orienterar sig, är vänster hand norr, och det arameiska targum Onkelos återger det så. Den nämns bara här, och dess läge är okänt."
    - "International Standard Bible Encyclopedia tog den för Hoba (Choba), omkring 60 engelska mil nordväst om Damaskus, där kartan placerar den; Jobar, en by strax utanför staden med en gammal synagoga, ansågs av några ligga på Hovas plats, och Augustin Calmet föreslog Abila i Lysanias rike i Baradadalen. Genesis Apocryphon från Qumran, som återberättar historien på arameiska, nämner platsen Helbon, Hesekiels vinland nordväst om Damaskus, vilket stämmer med norr i hebreiskan. Ingen kandidat har prövats genom utgrävning."
  nb:
    - "Hoba er punktet Abram forfulgte de østlige kongene til etter å ha reddet Lot: «Der delte han sine folk og overfalt dem om natten og slo dem; og han forfulgte dem like til Hoba, som ligger i nord for Damaskus.» Hebraisk har «venstre hånd», og for en som vender mot øst, slik hebraisk orienterer seg, er venstre nord; slik gjengir også det arameiske Targum Onkelos det. Den nevnes bare her, og stedet er ukjent."
    - "International Standard Bible Encyclopedia tok den for å være Hoba (Choba), omtrent 60 engelske mil nordvest for Damaskus, der kartet setter den; Jobar, en landsby like utenfor byen med en gammel synagoge, ble av noen antatt å ligge på stedet for Hoba, og Augustin Calmet foreslo Abila i Lysanias' rike i Barada-dalen. Genesis-apokryfen fra Qumran, som gjenforteller historien på arameisk, kaller stedet Helbon, Esekiels vinland nordvest for Damaskus, noe som stemmer med nord i det hebraiske. Ingen kandidat er prøvd ved utgravning."
  tl:
    - "Ang Hobah ang hangganan ng paghabol ni Abram sa mga haring taga-silangan matapos niyang iligtas si Lot: “At sila'y nangagpangkatpangkat sa kinagabihan, laban sa kaaway, siya at ang kaniyang mga alipin, at kanilang sinaktan sila, at hinabol nila sila hanggang sa Hobah, na nasa kaliwa ng Damasco.” Para sa nakaharap sa silangan, gaya ng pag-oorient ng Hebreo sa sarili, ang kaliwa ay hilaga, at gayon ito isinasalin ng Targum Onkelos na Aramaiko. Dito lamang ito binabanggit, at hindi alam ang kinalalagyan nito."
    - "Inakala ng International Standard Bible Encyclopedia na ito ang Hoba (Choba), mga 60 milya sa hilagang-kanluran ng Damasco, kung saan ito inilalagay ng mapa; inakala ng ilan na ang Jobar, isang nayon sa labas lamang ng lungsod na may matandang sinagoga, ang kinatatayuan ng Hobah, at iminungkahi ni Augustin Calmet ang Abila ni Lisanias sa libis ng Barada. Pinangalanan ng Genesis Apocryphon mula sa Qumran, na isinasalaysay muli ang kuwento sa Aramaiko, ang lugar na Helbon, ang bansang alak ni Ezekiel sa hilagang-kanluran ng Damasco, na umaayon sa hilaga sa Hebreo. Walang kandidatong nasubok sa pamamagitan ng paghuhukay."
  da:
    - "Hoba er det punkt, til hvilket Abram forfulgte de østlige konger, efter at have reddet Lot: »Og han og hans Svende delte sig over dem om Natten og slog dem og forfulgte dem til Hoba, som ligger paa den venstre Side for Damaskus.« For en, der vender sig mod øst, som det hebraiske orienterer sig, er venstre side nord, og det aramæiske targum Onkelos gengiver det sådan. Den nævnes kun her, og dens sted er ukendt."
    - "International Standard Bible Encyclopedia tog den for Hoba (Choba), omkring 60 engelske mil nordvest for Damaskus, hvor kortet sætter den; Jobar, en landsby lige uden for byen med en gammel synagoge, blev af nogle antaget at ligge på Hobas sted, og Augustin Calmet foreslog Abila hos Lysanias i Barada-dalen. Genesis-apokryfen fra Qumran, der genfortæller historien på aramæisk, kalder stedet Helbon, Ezekiels vinland nordvest for Damaskus, hvilket stemmer med nord i det hebraiske. Ingen kandidat er prøvet ved udgravning."
  sr:
    - "Хова је тачка до које је Аврам гонио источне цареве пошто је спасао Лота: „Онде разделивши своје удари на њих ноћу са слугама својим, и разби их, и отера их до Ховала, који је на лево од Дамаска.“ За онога ко гледа на исток, како се хебрејски оријентише, лево је север, и тако га преводи арамејски Онкелосов таргум. Именује се само овде, а његово место је непознато."
    - "International Standard Bible Encyclopedia узела је да је то Хоба, око 60 миља северозападно од Дамаска, где га карта поставља; Џобар, село одмах изван града са старом синагогом, неки су сматрали да стоји на месту Хове, а Огистен Калме предложио је Авилу Лисанијеву у долини Барада. Апокриф Постања из Кумрана, препричавајући причу на арамејском, именује место Хелвон, винородни крај из Језекиља северозападно од Дамаска, што се слаже са севером у хебрејском. Ни један кандидат није проверен ископавањем."
  hu:
    - "Hóbá az a pont, ameddig Ábrám üldözte a keleti királyokat, miután kiszabadította Lótot: „csapatokra oszolván ellenök éjszaka ő és szolgái, megveré őket, és űzé őket mind Hóbáig, a mely Damaskustól balra esik.” Aki kelet felé fordul, ahogyan a héber tájékozódik, annak bal keze az észak, és az arámi Onkelosz-targum így is adja vissza. Csak itt szerepel, és helye ismeretlen."
    - "A Nemzetközi Szabványos Bibliai Enciklopédia Hobával (Chobával) azonosította, Damaszkusztól mintegy 60 mérföldre északnyugatra, ahová a térkép is teszi; Dzsubar, a városon kívüli falu régi zsinagógával, egyesek szerint Hóbá helyén áll, Augustin Calmet pedig a Barada-völgyi Lüszániász Ábilát javasolta. A qumráni Genezis Apokrifon, amely arámiul meséli újra a történetet, a helyet Helbónnak nevezi, Ezékiel borvidékének, Damaszkusztól északnyugatra, ami egyezik a héber északkal. Egyik jelöltet sem vizsgálták ásatással."
  fi:
    - "Hoba on kohta, johon Abram ajoi itäisiä kuninkaita takaa pelastettuaan Lootin: ”Ja hän jakoi väkensä ja hyökkäsi palvelijoineen yöllä vihollisten kimppuun ja voitti heidät ja ajoi heitä takaa aina Hoobaan saakka, joka on Damaskosta pohjoiseen.” Itään päin kääntyneelle, kuten heprea suuntautuu, vasen käsi on pohjoinen, ja aramealainen targum Onkelos kääntää sen niin. Se mainitaan vain tässä, eikä sen paikkaa tiedetä."
    - "International Standard Bible Encyclopedia piti sitä Hobana (Choba), noin 60 mailia Damaskoksesta luoteeseen, mihin kartta sen sijoittaa; Jobar, kylä aivan kaupungin ulkopuolella vanhoine synagogineen, oli joidenkin mielestä Hoban paikalla, ja Augustin Calmet ehdotti Lysanian Abilaa Baradan laaksossa. Qumranin Genesiksen apokryfi, joka kertoo tarinan uudelleen arameaksi, nimeää paikan Helboniksi, Hesekielin viinimaaksi Damaskoksesta luoteeseen, mikä sopii heprean pohjoiseen. Mitään ehdokasta ei ole testattu kaivauksin."
  vi:
    - "Hô-ba là điểm mà Áp-ram đuổi theo các vua phương đông sau khi cứu Lót: “Áp-ram chia bọn đầy tớ mình ra, thừa ban đêm xông hãm quân nghịch, đánh đuổi theo đến đất Hô-ba ở về phía tả Đa-mách”. Đối với người quay mặt về đông, như cách tiếng Hê-bơ-rơ định hướng, bên trái là phía bắc, và Targum A-ram Onkelos dịch như vậy. Nơi này chỉ được nêu ở đây, và địa điểm không được biết."
    - "International Standard Bible Encyclopedia coi đó là Hoba (Choba), cách Đa-mách khoảng 60 dặm về phía tây bắc, nơi bản đồ đặt thành; Jobar, một làng ngay ngoài thành phố có một hội đường cổ, được một số người cho là nằm trên địa điểm của Hô-ba, và Augustin Calmet đề nghị Abila của Ly-sa-ni-a trong thung lũng Barada. Ngoại thư Sáng Thế Ký từ Qumran, kể lại câu chuyện bằng tiếng A-ram, gọi nơi này là Hên-bôn, xứ rượu vang của Ê-xê-chi-ên ở tây bắc Đa-mách, điều này khớp với phương bắc trong tiếng Hê-bơ-rơ. Chưa ứng viên nào được kiểm nghiệm bằng khai quật."
  ro:
    - "Hoba este punctul până la care Avram i-a urmărit pe regii din răsărit după ce l-a salvat pe Lot: „Și au căzut asupra lor noaptea, el și slugile lui; și i-au lovit pre ei și i-au gonit până la Hoval, care este deastânga Damascului”. Pentru cineva cu fața spre est, cum se orientează ebraica, mâna stângă este nordul, iar Targumul aramaic Onkelos îl redă astfel. Este numit doar aici, iar locul lui este necunoscut."
    - "International Standard Bible Encyclopedia îl socotea Hoba (Choba), la circa 60 de mile spre nord-vest de Damasc, unde îl așază harta; Jobar, un sat chiar în afara orașului, cu o sinagogă veche, era socotit de unii a fi pe locul Hobei, iar Augustin Calmet a sugerat Abila lui Lisanias din valea Barada. Apocrifonul Genezei de la Qumran, povestind întâmplarea în aramaică, numește locul Helbon, ținutul viticol al lui Ezechiel la nord-vest de Damasc, ceea ce se potrivește cu nordul din textul ebraic. Niciun candidat nu a fost verificat prin săpături."
  bg:
    - "Хова е точката, до която Аврам преследва източните царе, след като освободи Лот: „И, като раздели своите си, нападна на тях нощя той и рабите му, порази ги и гони ги до Хова, която е отляво на Дамаск.“ За човек, обърнат на изток, както се ориентира еврейският текст, лявата страна е северът, и арамейският Таргум Онкелос го предава така. Тя се назовава само тук и мястото ѝ не е известно."
    - "The International Standard Bible Encyclopedia я смяташе за Хоба (Choba), на около 60 мили северозападно от Дамаск, където я поставя картата; някои смятаха, че Джобар, село точно извън града със стара синагога, стои на мястото на Хова, а Огюстен Калме предложи Авила на Лисаний в долината на Барада. Апокрифът на Битие от Кумран, преразказвайки историята на арамейски, назовава мястото Хелбон — винарската област на Йезекиил северозападно от Дамаск, което се съгласува със севера в еврейския текст. Нито един кандидат не е проверен с разкопки."
scripture:
  - Gen.14.15
sources:
