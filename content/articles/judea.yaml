# Overview article (ADR 0007). Mainstream facts only; the varying extent of Judea in different periods is noted; the dates of the governors are the usual ones.
id: judea
place: a149f13
title:
  en: "Judea"
  ru: "Иудея"
  uk: "Юдея"
