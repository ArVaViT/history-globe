body:
  en:
    - 'Judea is the Greek and Latin form of Judah, the name of the southern kingdom and then of the province around Jerusalem. Its core is the hill country from Bethel south to Hebron and Beersheba, about 1,000 m high at Hebron, with the wilderness of Judea falling east to the Dead Sea and the Shephelah sloping west to the Philistine plain; Luke speaks of the hill country of Judea. Under the Persians it was the small province of Yehud, "the province of Judea" of Ezra, with its own governors and coins; after the Maccabees it grew into the Hasmonean kingdom, and the Romans used the name both for the Jewish heartland and for the whole land they governed from Caesarea.'
    - 'Pompey took Jerusalem in 63 BC. Herod the Great, in whose days Jesus was born "in Bethlehem of Judaea", ruled from 37 to 4 BC; his son Archelaus "did reign in Judaea in the room of his father Herod", so Joseph turned aside into Galilee. In AD 6 Augustus deposed Archelaus and made Judea a Roman province under prefects, among them Pontius Pilate (26–36), whose name was found on a stone at Caesarea in 1961. Agrippa I was king from 41 to 44; after him procurators ruled until the revolt of 66, which ended with the destruction of Jerusalem in 70 and the fall of Masada.'
    - 'John the Baptist preached "in the wilderness of Judaea", and all the land of Judea went out to him. Jesus taught in Judea as in Galilee, though for a time "he would not walk in Jewry, because the Jews sought to kill him", and his disciples feared his return there. He was crucified under Pilate, and his last command sent witnesses to Jerusalem, to all Judea and Samaria, and to the uttermost part of the earth. After Stephen''s death the believers were scattered throughout the regions of Judea and Samaria; Paul was unknown by face to the churches of Judea, and Antioch sent them relief in a famine.'
    - "After the revolt of Bar Kokhba (132–135) Hadrian renamed the province Syria Palaestina and rebuilt Jerusalem as Aelia Capitolina. The Judean desert kept the caves where the Dead Sea Scrolls were hidden, found from 1947. Today the Judean hills are mostly in the West Bank, with Bethlehem and most of Hebron under Palestinian administration and Israeli military control, while the western slopes and the Judean lowland lie in Israel; Israel calls the area Judea and Samaria."
  ru:
    - "Иудея — греческая и латинская форма имени Иуды, название южного царства, а затем области вокруг Иерусалима. Её ядро — нагорье от Вефиля на юг до Хеврона и Вирсавии, у Хеврона около 1000 м высотой, с пустыней Иудейской, спускающейся на восток к Мёртвому морю, и Шефелой, сходящей на запад к Филистимской равнине; Лука говорит о «нагорной стране Иудейской». При Персах это была малая провинция Йехуд, Иудейская область книги Ездры, со своими правителями и монетами; после Маккавеев она выросла в Хасмонейское царство, а римляне называли Иудеей и собственно иудейский край, и всю землю, которой правили из Кесарии."
    - "Помпей взял Иерусалим в 63 г. до н. э. Ирод Великий, во дни которого Иисус родился «в Вифлееме Иудейском», правил с 37 по 4 г. до н. э.; его сын «Архелай царствует в Иудее вместо Ирода, отца своего», и потому Иосиф пошёл в пределы Галилейские. В 6 г. н. э. Август низложил Архелая и сделал Иудею римской провинцией под началом префектов, среди которых был Понтий Пилат (26–36 гг.); его имя нашли на камне в Кесарии в 1961 году. Агриппа I был царём с 41 по 44 г.; после него правили прокураторы вплоть до восстания 66 г., кончившегося разрушением Иерусалима в 70 г. и падением Масады."
    - "Иоанн Креститель проповедовал «в пустыне Иудейской», и к нему выходила «вся страна Иудейская». Иисус учил в Иудее, как и в Галилее, хотя одно время «по Иудее не хотел ходить, потому что Иудеи искали убить Его», и ученики боялись Его возвращения туда. Он был распят при Пилате, а последнее Его повеление послало свидетелей «в Иерусалиме, и во всей Иудее, и Самарии». После смерти Стефана верующие «рассеялись по разным местам Иудеи и Самарии»; Павел не был известен лично церквам Иудеи, а Антиохия послала им пособие в голод."
    - "После восстания Бар-Кохбы (132–135 гг.) Адриан переименовал провинцию в Сирию Палестинскую и отстроил Иерусалим как Элию Капитолину. Иудейская пустыня сохранила пещеры, где были спрятаны свитки Мёртвого моря, находимые с 1947 года. Сегодня Иудейские горы по большей части лежат на Западном берегу: Вифлеем и бо́льшая часть Хеврона — под палестинским управлением и израильским военным контролем, а западные склоны и Иудейская низменность — в Израиле; Израиль называет эту область Иудеей и Самарией."
  uk:
    - "Юдея — грецька й латинська форма Юди, назви південного царства, а потім провінції навколо Єрусалима. Її серцевина — гірська країна від Бет-Ела на південь до Хеврона й Беер-Шеви, приблизно 1000 м заввишки біля Хеврона, з Юдейською пустелею, що спадає на схід до Мертвого моря, та Шефелою, що схиляється на захід до філістимської рівнини; Лука говорить про підгір’я Юдейське. За персів це була мала провінція Єхуд, «Юдейська країна» Ездри, з власними намісниками й монетами; після Макавеїв вона виросла в Хасмонейське царство, а римляни вживали назву і для юдейського серця, і для всього краю, яким вони керували з Кесарії."
    - "Помпей узяв Єрусалим 63 р. до н. е. Ірод Великий, за днів якого Ісус народився «у Витлеємі Юдейському», правив з 37 по 4 р. до н. е.; його син Архелай, як сказано, «царює в Юдеї замість батька свого Ірода», тож Йосип звернув до Галілеї. 6 р. н. е. Август скинув Архелая й зробив Юдею римською провінцією під префектами, серед них Понтій Пилат (26–36), чиє ім’я знайдено на камені в Кесарії 1961 року. Агриппа I був царем з 41 по 44 рік; після нього правили прокуратори до повстання 66 року, що закінчилося зруйнуванням Єрусалима 70 року й падінням Масади."
    - "Іван Хреститель проповідував «в пустинї Юдейській», і вся Юдея виходила до нього. Ісус навчав у Юдеї так само, як у Галілеї, хоч деякий час «не хотїв бо по Юдеї ходити, що шукали Його Жиди вбити», і учні боялися Його повернення туди. Його розіп’яли за Пилата, і Його остання заповідь послала свідків до Єрусалима, до всієї Юдеї й Самарії та до краю землі. Після смерті Стефана віруючі розсіялися по землях Юдеї й Самарії; Павла не знали в обличчя церкви Юдеї, а Антіохія послала їм допомогу під час голоду."
    - "Після повстання Бар-Кохби (132–135) Адріан перейменував провінцію на Сирію Палестину й відбудував Єрусалим як Елію Капітоліну. Юдейська пустеля зберегла печери, де були заховані сувої Мертвого моря, знайдені від 1947 року. Сьогодні юдейські пагорби здебільшого на Західному березі, з Вифлеємом і більшою частиною Хеврона під палестинським управлінням та ізраїльським військовим контролем, тоді як західні схили й Юдейська низовина лежать в Ізраїлі; Ізраїль називає цю область Юдеєю та Самарією."
  es:
    - "Judea es la forma griega y latina de Judá, el nombre del reino del sur y luego de la provincia en torno a Jerusalén. Su núcleo es la región montañosa desde Betel al sur hasta Hebrón y Beerseba, de unos 1000 m de altura en Hebrón, con el desierto de Judea descendiendo al este hacia el mar Muerto y la Sefelá declinando al oeste hacia la llanura filistea; Lucas habla de la región montañosa de Judea. Bajo los persas fue la pequeña provincia de Yehud, «la provincia de Judea» de Esdras, con sus propios gobernadores y monedas; tras los macabeos creció hasta el reino asmoneo, y los romanos usaron el nombre tanto para el corazón judío como para toda la tierra que gobernaban desde Cesarea."
    - "Pompeyo tomó Jerusalén en el 63 a. C. Herodes el Grande, en cuyos días nació Jesús «en Bethlehem de Judea», reinó del 37 al 4 a. C.; su hijo Arquelao «reinaba en Judea en lugar de Herodes su padre», por lo que José se retiró a Galilea. En el 6 d. C. Augusto depuso a Arquelao e hizo de Judea una provincia romana bajo prefectos, entre ellos Poncio Pilato (26–36), cuyo nombre se halló en una piedra en Cesarea en 1961. Agripa I fue rey del 41 al 44; después gobernaron procuradores hasta la revuelta del 66, que acabó con la destrucción de Jerusalén en el 70 y la caída de Masada."
    - "Juan el Bautista predicó «en el desierto de Judea», y toda la tierra de Judea salía a él. Jesús enseñó en Judea como en Galilea, aunque durante un tiempo «no quería andar en Judea, porque los Judíos procuraban matarle», y sus discípulos temían su regreso allí. Fue crucificado bajo Pilato, y su último mandato envió testigos a Jerusalén, a toda Judea y Samaria, y hasta lo último de la tierra. Tras la muerte de Esteban los creyentes fueron esparcidos por las tierras de Judea y de Samaria; Pablo era desconocido de vista para las iglesias de Judea, y Antioquía les envió socorro en un hambre."
    - "Tras la revuelta de Bar Kojba (132–135) Adriano rebautizó la provincia como Siria Palestina y reconstruyó Jerusalén como Aelia Capitolina. El desierto de Judea guardó las cuevas donde se ocultaron los rollos del mar Muerto, hallados desde 1947. Hoy las colinas de Judea están sobre todo en Cisjordania, con Belén y la mayor parte de Hebrón bajo administración palestina y control militar israelí, mientras que las laderas occidentales y la tierra baja de Judea se hallan en Israel; Israel llama a la zona Judea y Samaria."
  pt:
    - "Judeia é a forma grega e latina de Judá, o nome do reino do sul e depois da província em torno de Jerusalém. Seu núcleo é a região montanhosa de Betel ao sul até Hebrom e Berseba, a cerca de 1.000 m de altitude em Hebrom, com o deserto da Judeia descendo a leste até o mar Morto e a Sefelá declinando a oeste rumo à planície filisteia; Lucas fala da região montanhosa da Judeia. Sob os persas era a pequena província de Yehud, a “província de Judá” de Esdras, com governadores e moedas próprios; depois dos macabeus cresceu até o reino asmoneu, e os romanos usaram o nome tanto para o coração judaico como para toda a terra que governavam desde Cesareia."
    - "Pompeu tomou Jerusalém em 63 a.C. Herodes, o Grande, em cujos dias Jesus nasceu “em Belém da Judeia”, governou de 37 a 4 a.C.; seu filho Arquelau “reinava na Judeia em lugar de seu pai, Herodes”, de modo que José se desviou para a Galileia. Em 6 d.C., Augusto depôs Arquelau e fez da Judeia uma província romana sob prefeitos, entre eles Pôncio Pilatos (26–36), cujo nome foi achado numa pedra em Cesareia em 1961. Agripa I foi rei de 41 a 44; depois dele governaram procuradores até a revolta de 66, que terminou com a destruição de Jerusalém em 70 e a queda de Massada."
    - "João Batista pregou “no deserto da Judeia”, e toda a terra da Judeia saiu a ele. Jesus ensinou na Judeia como na Galileia, embora por algum tempo “não queria andar pela Judeia, porque os judeus procuravam matá-lo”, e seus discípulos temiam seu regresso para lá. Foi crucificado sob Pilatos, e seu último mandato enviou testemunhas a Jerusalém, a toda a Judeia e Samaria e até os confins da terra. Depois da morte de Estêvão os crentes se dispersaram pelas regiões da Judeia e Samaria; Paulo era desconhecido de rosto às igrejas da Judeia, e Antioquia lhes enviou socorro numa fome."
    - "Depois da revolta de Bar Kokhba (132–135), Adriano rebatizou a província Síria Palestina e reconstruiu Jerusalém como Aelia Capitolina. O deserto da Judeia guardou as cavernas onde os Manuscritos do Mar Morto foram escondidos, achados a partir de 1947. Hoje as colinas da Judeia estão sobretudo na Cisjordânia, com Belém e a maior parte de Hebrom sob administração palestina e controle militar israelense, ao passo que as encostas ocidentais e a baixada da Judeia ficam em Israel; Israel chama a área Judeia e Samaria."
  de:
    - "Judäa ist die griechische und lateinische Form von Juda, dem Namen des Südreichs und dann der Provinz um Jerusalem. Sein Kern ist das Bergland von Bethel südwärts bis Hebron und Beerscheba, bei Hebron etwa 1000 m hoch, mit der Wüste Judäas, die nach Osten zum Toten Meer abfällt, und der Schefela, die nach Westen zur Philisterebene abfällt; Lukas spricht vom „jüdischen Gebirge“. Unter den Persern war es die kleine Provinz Jehud, bei Esra „das jüdische Land“, mit eigenen Statthaltern und Münzen; nach den Makkabäern wuchs es zum hasmonäischen Königreich, und die Römer gebrauchten den Namen sowohl für das jüdische Kernland als auch für das ganze Land, das sie von Caesarea aus verwalteten."
    - "Pompeius nahm Jerusalem 63 v. Chr. ein. Herodes der Große, in dessen Tagen Jesus „zu Bethlehem im jüdischen Lande“ geboren wurde, herrschte von 37 bis 4 v. Chr.; von seinem Sohn Archelaus heißt es, dass er „im jüdischen Lande König war anstatt seines Vaters Herodes“, sodass Josef nach Galiläa auswich. Im Jahr 6 n. Chr. setzte Augustus Archelaus ab und machte Judäa zur römischen Provinz unter Präfekten, darunter Pontius Pilatus (26–36), dessen Name 1961 auf einem Stein in Caesarea gefunden wurde. Agrippa I. war von 41 bis 44 König; nach ihm herrschten Prokuratoren bis zum Aufstand von 66, der mit der Zerstörung Jerusalems 70 und dem Fall von Masada endete."
    - "Johannes der Täufer predigte „in der Wüste des jüdischen Landes“, und das ganze jüdische Land ging zu ihm hinaus. Jesus lehrte in Judäa wie in Galiläa, obwohl er eine Zeit lang „nicht in Judäa umherziehen“ wollte, „darum daß ihm die Juden nach dem Leben stellten“, und seine Jünger fürchteten seine Rückkehr dorthin. Er wurde unter Pilatus gekreuzigt, und sein letzter Auftrag sandte Zeugen nach Jerusalem, in ganz Judäa und Samarien und bis ans Ende der Erde. Nach Stephanus' Tod zerstreuten sich die Gläubigen „in die Länder Judäa und Samarien“; Paulus war den christlichen Gemeinden in Judäa „unbekannt von Angesicht“, und Antiochia sandte ihnen in einer Hungersnot Hilfe."
    - "Nach dem Bar-Kochba-Aufstand (132–135) benannte Hadrian die Provinz in Syria Palaestina um und baute Jerusalem als Aelia Capitolina neu. Die Judäische Wüste bewahrte die Höhlen, in denen die Schriftrollen vom Toten Meer verborgen waren, gefunden seit 1947. Heute liegen die judäischen Berge größtenteils im Westjordanland, mit Bethlehem und dem größten Teil Hebrons unter palästinensischer Verwaltung und israelischer Militärkontrolle, während die Westhänge und das judäische Tiefland in Israel liegen; Israel nennt das Gebiet Judäa und Samaria."
  fr:
    - "Judée est la forme grecque et latine de Juda, nom du royaume du sud puis de la province autour de Jérusalem. Son cœur est la montagne de Béthel au sud jusqu’à Hébron et Beer-Schéba, haute d’environ 1 000 m à Hébron, avec le désert de Judée qui tombe vers l’est jusqu’à la mer Morte et la Shéphéla qui descend à l’ouest vers la plaine philistine ; Luc parle des montagnes de la Judée. Sous les Perses, c’était la petite province de Yehud, « la province de Juda » d’Esdras, avec ses gouverneurs et sa monnaie ; après les Maccabées, elle devint le royaume hasmonéen, et les Romains employèrent le nom tant pour le cœur juif que pour tout le pays qu’ils gouvernaient depuis Césarée."
    - "Pompée prit Jérusalem en 63 av. J.-C. Hérode le Grand, aux jours de qui Jésus naquit « à Bethléhem en Judée », régna de 37 à 4 av. J.-C. ; son fils « Archélaüs régnait sur la Judée à la place d’Hérode, son père », de sorte que Joseph se retira en Galilée. En 6 apr. J.-C., Auguste déposa Archélaüs et fit de la Judée une province romaine sous des préfets, dont Ponce Pilate (26–36), dont le nom fut trouvé sur une pierre à Césarée en 1961. Agrippa Ier fut roi de 41 à 44 ; après lui, des procurateurs gouvernèrent jusqu’à la révolte de 66, qui s’acheva par la destruction de Jérusalem en 70 et la chute de Massada."
    - "Jean-Baptiste prêchait « dans le désert de Judée », et tout le pays de Judée allait à lui. Jésus enseigna en Judée comme en Galilée, bien que pendant un temps, comme le dit Jean, « il ne voulait pas séjourner en Judée, parce que les Juifs cherchaient à le faire mourir », et ses disciples craignaient son retour là-bas. Il fut crucifié sous Pilate, et son dernier ordre envoya des témoins à Jérusalem, dans toute la Judée, dans la Samarie, et jusqu’aux extrémités de la terre. Après la mort d’Étienne, les croyants se dispersèrent dans les régions de la Judée et de la Samarie ; Paul était inconnu de visage aux Églises de Judée, et Antioche leur envoya des secours pendant une famine."
    - "Après la révolte de Bar Kokhba (132–135), Hadrien rebaptisa la province Syrie Palestine et rebâtit Jérusalem sous le nom d’Aelia Capitolina. Le désert de Judée garda les grottes où furent cachés les manuscrits de la mer Morte, trouvés à partir de 1947. Aujourd’hui, les collines de Judée sont pour l’essentiel en Cisjordanie, avec Bethléem et la majeure partie d’Hébron sous administration palestinienne et contrôle militaire israélien, tandis que les pentes occidentales et la plaine de Judée se trouvent en Israël ; Israël appelle la région Judée-Samarie."
  pl:
    - "Judea to grecka i łacińska forma Judy, nazwy królestwa południowego, a potem prowincji wokół Jerozolimy. Jej rdzeniem jest kraj górski od Betel na południe po Hebron i Beer-Szebę, o wysokości około 1000 m w Hebronie, z pustynią Judzką opadającą na wschód ku Morzu Martwemu i Szefelą schodzącą na zachód ku równinie filistyńskiej; Łukasz mówi o górach Judei. Za Persów była małą prowincją Jehud, jak mówi Ezdrasz: „do Judzkiej krainy”, z własnymi namiestnikami i monetami; po Machabeuszach wyrosła na królestwo hasmonejskie, a Rzymianie używali nazwy zarówno dla żydowskiego serca kraju, jak i dla całej ziemi, którą rządzili z Cezarei."
    - "Pompejusz zdobył Jerozolimę w 63 r. p.n.e. Herod Wielki, za którego dni Jezus narodził się „w Betlehemie Judzkiem”, panował od 37 do 4 r. p.n.e.; jego syn Archelaos „królował w Judzkiej ziemi na miejscu Heroda, ojca swego”, więc Józef zwrócił się ku Galilei. W 6 r. n.e. August złożył Archelaosa i uczynił Judeę rzymską prowincją pod prefektami, wśród nich Poncjuszem Piłatem (26–36), którego imię znaleziono na kamieniu w Cezarei w 1961 r. Agryppa I był królem od 41 do 44; po nim rządzili prokuratorzy aż do powstania w 66 r., które zakończyło się zburzeniem Jerozolimy w 70 r. i upadkiem Masady."
    - "Jan Chrzciciel głosił „na puszczy w ziemi Judzkiej”, a cała ziemia Judei wychodziła do niego. Jezus nauczał w Judei jak w Galilei, choć przez pewien czas „się nie chciał bawić w ziemi Judzkiej, przeto że Żydowie szukali, aby go zabili”, a jego uczniowie obawiali się jego powrotu tam. Został ukrzyżowany za Piłata, a jego ostatnie polecenie posyłało świadków do Jerozolimy, całej Judei i Samarii oraz po krańce ziemi. Po śmierci Szczepana wierzący rozproszyli się po krainach Judei i Samarii; Paweł nie był znany z twarzy kościołom Judei, a Antiochia przysłała im pomoc w czasie głodu."
    - "Po powstaniu Bar Kochby (132–135) Hadrian przemianował prowincję na Syria Palaestina i odbudował Jerozolimę jako Aelia Capitolina. Pustynia Judzka zachowała jaskinie, w których ukryto zwoje znad Morza Martwego, znalezione od 1947 r. Dziś wzgórza Judei leżą głównie na Zachodnim Brzegu, z Betlejem i większością Hebronu pod administracją palestyńską i izraelską kontrolą wojskową, podczas gdy zachodnie stoki i nizina judzka leżą w Izraelu; Izrael nazywa ten obszar Judeą i Samarią."
  it:
    - "La Giudea è la forma greca e latina di Giuda, il nome del regno meridionale e poi della provincia attorno a Gerusalemme. Il suo nucleo è la regione montuosa da Betel a sud fino a Ebron e Bersabea, alta circa 1000 m a Ebron, con il deserto di Giudea che scende a est verso il Mar Morto e la Sefela che degrada a ovest verso la pianura filistea; Luca parla della regione montuosa della Giudea. Sotto i Persiani fu la piccola provincia di Yehud, «la provincia di Giuda» di Esdra, con propri governatori e monete; dopo i Maccabei crebbe fino a diventare il regno asmoneo, e i Romani usarono il nome sia per il cuore giudaico sia per l’intero paese che governavano da Cesarea."
    - "Pompeo prese Gerusalemme nel 63 a.C. Erode il Grande, ai cui giorni Gesù nacque «in Betleem di Giudea», regnò dal 37 al 4 a.C.; dopo di lui, quando «in Giudea regnava Archelao invece d’Erode, suo padre», Giuseppe si ritirò in Galilea. Nel 6 d.C. Augusto depose Archelao e fece della Giudea una provincia romana sotto prefetti, fra cui Ponzio Pilato (26–36), il cui nome fu trovato su una pietra a Cesarea nel 1961. Agrippa I fu re dal 41 al 44; dopo di lui governarono procuratori fino alla rivolta del 66, che terminò con la distruzione di Gerusalemme nel 70 e la caduta di Masada."
    - "Giovanni Battista predicò «nel deserto della Giudea», e tutto il paese della Giudea accorreva a lui. Gesù insegnò in Giudea come in Galilea, benché per un tempo «non voleva andare attorno per la Giudea perché i Giudei cercavan d’ucciderlo», e i suoi discepoli temevano il suo ritorno là. Fu crocifisso sotto Pilato, e il suo ultimo comando mandò testimoni a Gerusalemme, in tutta la Giudea e Samaria, e fino all’estremità della terra. Dopo la morte di Stefano i credenti furono dispersi per le contrade della Giudea e della Samaria; Paolo era sconosciuto di persona alle chiese della Giudea, e Antiochia mandò loro un soccorso in una carestia."
    - "Dopo la rivolta di Bar Kokheba (132–135) Adriano ribattezzò la provincia Syria Palaestina e ricostruì Gerusalemme come Aelia Capitolina. Il deserto di Giudea conservò le grotte dove furono nascosti i Rotoli del Mar Morto, trovati dal 1947. Oggi i colli della Giudea sono per lo più in Cisgiordania, con Betlemme e la maggior parte di Ebron sotto amministrazione palestinese e controllo militare israeliano, mentre i pendii occidentali e la pianura giudaica si trovano in Israele; Israele chiama la zona Giudea e Samaria."
  nl:
    - "Judea is de Griekse en Latijnse vorm van Juda, de naam van het zuidelijke koninkrijk en daarna van de provincie rond Jeruzalem. De kern is het bergland van Bethel zuidwaarts tot Hebron en Berseba, ongeveer 1000 m hoog bij Hebron, met de woestijn van Judea die oostwaarts naar de Dode Zee afdaalt en de Sefela die westwaarts naar de Filistijnse vlakte aflopt; Lukas spreekt van het gebergte van Judea. Onder de Perzen was het de kleine provincie Yehud, “het landschap Juda” van Ezra, met eigen stadhouders en munten; na de Makkabeeën groeide het uit tot het Hasmoneïsche koninkrijk, en de Romeinen gebruikten de naam zowel voor het Joodse kerngebied als voor het hele land dat zij vanuit Caesarea bestuurden."
    - "Pompeius nam Jeruzalem in 63 v.Chr. Herodes de Grote, in wiens dagen Jezus werd geboren “te Bethlehem, gelegen in Judea”, regeerde van 37 tot 4 v.Chr.; zijn zoon Archelaüs volgde hem op; toen Jozef hoorde dat deze “in Judea koning was, in de plaats van zijn vader Herodes”, week hij uit naar Galilea. In 6 n.Chr. zette Augustus Archelaüs af en maakte Judea een Romeinse provincie onder prefecten, onder wie Pontius Pilatus (26–36), wiens naam in 1961 op een steen te Caesarea werd gevonden. Agrippa I was koning van 41 tot 44; daarna regeerden procuratoren tot de opstand van 66, die eindigde met de verwoesting van Jeruzalem in 70 en de val van Masada."
    - "Johannes de Doper predikte “in de woestijn van Judea”, en het hele land Judea ging naar hem uit. Jezus onderwees in Judea zoals in Galilea, al “wilde” Hij een tijd lang “in Judea niet wandelen, omdat de Joden Hem zochten te doden”, en zijn discipelen vreesden zijn terugkeer daarheen. Hij werd gekruisigd onder Pilatus, en zijn laatste opdracht zond getuigen naar Jeruzalem, naar heel Judea en Samaria, en tot aan het uiterste der aarde. Na Stefanus’ dood werden de gelovigen verstrooid door de landen van Judea en Samaria; Paulus was van aangezicht onbekend bij de gemeenten van Judea, en Antiochië zond hun hulp in een hongersnood."
    - "Na de opstand van Bar Kochba (132–135) gaf Hadrianus de provincie de naam Syria Palaestina en herbouwde Jeruzalem als Aelia Capitolina. De Judese woestijn bewaarde de grotten waar de Dode-Zeerollen verborgen lagen, gevonden vanaf 1947. Nu liggen de Judese heuvels grotendeels op de Westoever, met Bethlehem en het grootste deel van Hebron onder Palestijns bestuur en Israëlische militaire controle, terwijl de westelijke hellingen en het Judese laagland in Israël liggen; Israël noemt het gebied Judea en Samaria."
  cs:
    - "Judsko je řecká a latinská podoba Judy, jména jižního království a pak provincie kolem Jeruzaléma. Jeho jádrem je pahorkatina od Bét-elu na jih k Hebronu a Beer-šebě, v Hebronu vysoká asi 1 000 m, s judskou pouští klesající na východ k Mrtvému moři a Šefelou svažující se na západ k pelištejské rovině; Lukáš mluví o judské pahorkatině. Za Peršanů to byla malá provincie Jehud, „do Judské krajiny“ u Ezdráše, s vlastními správci a mincemi; po Makabejských vyrostla v hasmonejské království a Římané užívali jméno jak pro židovské jádro, tak pro celou zemi, kterou spravovali z Cesareje."
    - "Pompeius dobyl Jeruzalém roku 63 př. n. l. Herodes Veliký, za jehož dnů se Ježíš narodil „v Betlémě Judově“, vládl od roku 37 do 4 př. n. l.; jeho syn Archelaos „kraloval v Judstvu místo Herodesa otce svého“, takže se Josef obrátil do Galileje. Roku 6 n. l. Augustus Archelaa sesadil a učinil z Judska římskou provincii pod prefekty, mezi nimi Pontius Pilát (26–36), jehož jméno bylo nalezeno na kameni v Cesareji roku 1961. Agrippa I. byl králem od roku 41 do 44; po něm vládli prokurátoři až do povstání roku 66, které skončilo zničením Jeruzaléma roku 70 a pádem Masady."
    - "Jan Křtitel kázal „na poušti Judské“ a vyšla k němu celá judská země. Ježíš učil v Judsku jako v Galileji, ačkoli po nějaký čas „nechtěl býti v Judstvu, protože ho hledali Židé zabíti“, a jeho učedníci se báli jeho návratu tam. Byl ukřižován za Piláta a jeho poslední příkaz vyslal svědky do Jeruzaléma, do celého Judska a Samaří a až na konec země. Po Štěpánově smrti byli věřící rozptýleni po krajinách Judska a Samaří; Pavel byl církvím v Judsku tvářemi neznám a Antiochie jim poslala pomoc v hladomoru."
    - "Po povstání Bar Kochby (132–135) Hadrianus přejmenoval provincii na Syria Palaestina a přestavěl Jeruzalém jako Aelia Capitolina. Judská poušť uchovala jeskyně, kde byly ukryty svitky od Mrtvého moře, nalezené od roku 1947. Dnes jsou judské hory většinou na Západním břehu, s Betlémem a většinou Hebronu pod palestinskou správou a izraelskou vojenskou kontrolou, kdežto západní svahy a judská nížina leží v Izraeli; Izrael nazývá oblast Judea a Samaří."
  sv:
    - "Judeen är den grekiska och latinska formen av Juda, namnet på det södra riket och sedan på provinsen kring Jerusalem. Dess kärna är bergslandet från Betel söderut till Hebron och Beer Sheva, omkring 1 000 m högt vid Hebron, med Judeens öken som stupar österut mot Döda havet och Shefela som sluttar västerut mot filisteernas slätt; Lukas talar om Judeens bergsbygd. Under perserna var det den lilla provinsen Yehud, Esras ”judiska hövdingdömet”, med egna ståthållare och mynt; efter mackabeerna växte det till det hasmoneiska riket, och romarna använde namnet både för den judiska kärnbygden och för hela det land de styrde från Caesarea."
    - "Pompeius intog Jerusalem 63 f.Kr. Herodes den store, i vars dagar Jesus föddes ”i Betlehem i Judeen”, regerade 37–4 f.Kr.; hans son Archelaos, om vilken det heter att han ”regerade över Judeen; efter sin fader Herodes”, fick Josef att vika av till Galileen. År 6 e.Kr. avsatte Augustus Archelaos och gjorde Judeen till en romersk provins under prefekter, bland dem Pontius Pilatus (26–36), vars namn hittades på en sten i Caesarea 1961. Agrippa I var kung 41–44; efter honom styrde prokuratorer fram till upproret 66, som slutade med Jerusalems förstörelse år 70 och Masadas fall."
    - "Johannes döparen predikade ”i Judeens öken”, och hela Judeens land gick ut till honom. Jesus undervisade i Judeen liksom i Galileen, fastän det under en tid hette att ”i Judeen ville han icke vandra omkring, då nu judarna stodo efter att döda honom”, och hans lärjungar fruktade hans återkomst dit. Han korsfästes under Pilatus, och hans sista befallning sände vittnen till Jerusalem, till hela Judeen och Samaria och till jordens yttersta gräns. Efter Stefanos' död spreds de troende över Judeens och Samarias bygder; Paulus var till utseendet okänd för Judeens församlingar, och Antiochia sände dem hjälp under en hungersnöd."
    - "Efter Bar Kokhbas uppror (132–135) döpte Hadrianus om provinsen till Syria Palaestina och byggde upp Jerusalem som Aelia Capitolina. Judeiska öknen bevarade de grottor där Dödahavsrullarna gömdes, funna från 1947. I dag ligger Judeens berg mestadels på Västbanken, med Betlehem och större delen av Hebron under palestinsk administration och israelisk militär kontroll, medan de västra sluttningarna och det judeiska låglandet ligger i Israel; Israel kallar området Judeen och Samaria."
  nb:
    - "Judea er den greske og latinske formen av Juda, navnet på det sørlige riket og senere på provinsen rundt Jerusalem. Kjernen er fjellandet fra Betel sørover til Hebron og Beer-Sjeba, omkring 1000 m høyt ved Hebron, med Judeaørkenen som faller mot øst ned til Dødehavet og Sjefela som skråner mot vest ned til filisterslettene; Lukas taler om Judeas fjellbygder. Under perserne var den den lille provinsen Yehud, Esras «landskapet Juda», med egne guvernører og mynter; etter makkabeerne vokste den til det hasmoneiske kongeriket, og romerne brukte navnet både om det jødiske kjerneområdet og om hele landet de styrte fra Cæsarea."
    - "Pompeius inntok Jerusalem i 63 f.Kr. Herodes den store, i hvis dager Jesus ble født «i Betlehem i Judea», regjerte fra 37 til 4 f.Kr.; hans sønn Arkelaus var «konge i Judea efter sin far Herodes», så Josef vek av til Galilea. I 6 e.Kr. avsatte Augustus Arkelaus og gjorde Judea til en romersk provins under prefekter, blant dem Pontius Pilatus (26–36), hvis navn ble funnet på en stein i Cæsarea i 1961. Agrippa I var konge fra 41 til 44; etter ham styrte prokuratorer inntil opprøret i 66, som endte med Jerusalems ødeleggelse i 70 og Masadas fall."
    - "Døperen Johannes forkynte «i Judeas ørken», og hele Judea gikk ut til ham. Jesus underviste i Judea som i Galilea, selv om han en tid «vilde ikke gå omkring i Judea, fordi jødene stod ham efter livet», og disiplene fryktet at han skulle dra tilbake dit. Han ble korsfestet under Pilatus, og hans siste befaling sendte vitner til Jerusalem, til hele Judea og Samaria og til jordens ende. Etter Stefanus' død ble de troende spredt over Judeas og Samarias områder; Paulus var personlig ukjent for menighetene i Judea, og Antiokia sendte dem hjelp i en hungersnød."
    - "Etter Bar Kokhba-opprøret (132–135) omdøpte Hadrian provinsen til Syria Palaestina og gjenoppbygde Jerusalem som Aelia Capitolina. I Judeaørkenen ble hulene hvor Dødehavsrullene var skjult, bevart; de ble funnet fra 1947. I dag ligger Judeas åser for det meste på Vestbredden, med Betlehem og det meste av Hebron under palestinsk forvaltning og israelsk militær kontroll, mens de vestlige skråningene og det judeiske lavlandet ligger i Israel; Israel kaller området Judea og Samaria."
  tl:
    - "Ang Judea ay ang anyong Griyego at Latin ng Juda, ang pangalan ng katimugang kaharian at kalaunan ng lalawigan sa palibot ng Jerusalem. Ang ubod nito ay ang maburol na lupain mula Beth-el sa timog hanggang Hebron at Beer-seba, mga 1,000 m ang taas sa Hebron, na ang ilang ng Judea ay bumababa sa silangan hanggang sa Dagat na Patay at ang Sephela ay dumudulas sa kanluran tungo sa kapatagan ng mga Filisteo; binabanggit ni Lucas ang maburol na lupain ng Judea. Sa ilalim ng mga Persiano ito ang maliit na lalawigan ng Yehud, ang “lalawigan ng Juda” ni Ezra, na may sariling mga gobernador at salapi; pagkaraan ng mga Macabeo ay lumaki ito bilang kahariang Hasmoneo, at ginamit ng mga Romano ang pangalan para sa sentro ng mga Judio at sa buong lupaing pinamahalaan nila mula sa Cesarea."
    - "Sinakop ni Pompeyo ang Jerusalem noong 63 BK. Si Herodes na Dakila, na sa kaniyang mga araw ay ipinanganak si Jesus “sa Bet-lehem ng Judea”, ay namuno mula 37 hanggang 4 BK; ang anak niyang si Arquelao ay “naghahari sa Judea na kahalili ng kaniyang amang si Herodes”, kaya't lumihis si Jose patungong Galilea. Noong 6 AD, pinatalsik ni Augusto si Arquelao at ginawang lalawigang Romano ang Judea sa ilalim ng mga prepekto, kabilang si Poncio Pilato (26–36), na ang pangalan ay natagpuan sa isang bato sa Cesarea noong 1961. Si Agripa I ay hari mula 41 hanggang 44; pagkaraan niya ay namuno ang mga prokurador hanggang sa paghihimagsik noong 66, na nagwakas sa pagkawasak ng Jerusalem noong 70 at sa pagbagsak ng Masada."
    - "Si Juan Bautista ay nangaral “sa ilang ng Judea”, at lumabas sa kaniya ang buong lupain ng Judea. Nagturo si Jesus sa Judea gaya sa Galilea, bagaman sa isang panahon ay “ayaw siyang maglakad sa Judea, dahil sa pinagsisikapan ng mga Judio na siya'y patayin”, at ikinatakot ng kaniyang mga alagad ang kaniyang pagbabalik doon. Ipinako siya sa krus sa ilalim ni Pilato, at ang kaniyang huling utos ay nagsugo ng mga saksi sa Jerusalem, sa buong Judea at Samaria, at hanggang sa dulo ng lupa. Pagkamatay ni Esteban ay nagkawatak-watak ang mga mananampalataya sa mga lupain ng Judea at Samaria; si Pablo ay hindi kilala sa mukha ng mga iglesia ng Judea, at nagpadala ng saklolo ang Antioquia sa kanila noong taggutom."
    - "Pagkatapos ng paghihimagsik ni Bar Kokhba (132–135), pinalitan ni Adriano ang pangalan ng lalawigan at ginawang Siria Palestina, at muling itinayo ang Jerusalem bilang Aelia Capitolina. Iningatan ng disyerto ng Judea ang mga yungib kung saan itinago ang Mga Balumbon ng Dagat na Patay, na natagpuan mula 1947. Sa ngayon ang mga burol ng Judea ay karamihang nasa West Bank, na ang Bethlehem at karamihan ng Hebron ay nasa ilalim ng pamamahalang Palestino at kontrol militar ng Israel, samantalang ang mga kanlurang libis at ang mababang lupain ng Judea ay nasa Israel; tinatawag ng Israel ang lugar na Judea at Samaria."
  da:
    - "Judæa er den græske og latinske form af Juda, navnet på det sydlige kongerige og siden på provinsen omkring Jerusalem. Dens kerne er bjerglandet fra Betel mod syd til Hebron og Beersheba, omkring 1.000 m højt ved Hebron, med Judæas ørken, der falder mod øst til Det Døde Hav, og Sjefela, der skråner mod vest ned til filistersletten; Lukas taler om Judæas bjergegn. Under perserne var den den lille provins Yehud, »det Landskab Juda« hos Ezra, med egne guvernører og mønter; efter makkabæerne voksede den til det hasmonæiske kongedømme, og romerne brugte navnet både om det jødiske kerneland og om hele det land, de styrede fra Cæsarea."
    - "Pompejus indtog Jerusalem i 63 f.Kr. Herodes den Store, i hvis dage Jesus blev født »i Bethlehem i Judæa«, herskede fra 37 til 4 f.Kr.; hans søn »Arkelaus var Konge over Judæa i sin Fader Herodes's Sted«, så Josef vendte af til Galilæa. I 6 e.Kr. afsatte Augustus Arkelaus og gjorde Judæa til en romersk provins under prefekter, blandt dem Pontius Pilatus (26–36), hvis navn blev fundet på en sten i Cæsarea i 1961. Agrippa 1. var konge fra 41 til 44; efter ham herskede prokuratorer indtil oprøret i 66, der endte med Jerusalems ødelæggelse i 70 og Masadas fald."
    - "Johannes Døberen prædikede »i Judæas Ørken«, og hele Judæas land gik ud til ham. Jesus underviste i Judæa som i Galilæa, selv om der for en tid stod: »han vilde ikke vandre i Judæa, fordi Jøderne søgte at slaa ham ihjel«, og hans disciple frygtede hans tilbagevenden dertil. Han blev korsfæstet under Pilatus, og hans sidste befaling sendte vidner til Jerusalem, til hele Judæa og Samaria og til jordens yderste ende. Efter Stefanus' død blev de troende spredt over Judæas og Samarias egne; Paulus var personligt ukendt for Judæas menigheder, og Antiokia sendte dem hjælp under en hungersnød."
    - "Efter Bar Kokhba-oprøret (132–135) omdøbte Hadrian provinsen Syria Palaestina og genopbyggede Jerusalem som Aelia Capitolina. Den judæiske ørken gemte hulerne, hvor Dødehavsrullerne var skjult, fundet fra 1947. I dag ligger de judæiske bjerge for det meste på Vestbredden, med Betlehem og det meste af Hebron under palæstinensisk administration og israelsk militær kontrol, mens de vestlige skråninger og det judæiske lavland ligger i Israel; Israel kalder området Judæa og Samaria."
