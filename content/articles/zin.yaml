# Overview article (ADR 0007). Mainstream facts only; the Synodal Bible writes both Zin and Sin as "Син", which the text notes.
id: zin
place: a0b5c50
title:
  en: "Zin"
  ru: "Син"
  uk: "Цін"
  es: "Zin"
  pt: "Zim"
  de: "Zin"
  fr: "Tsin"
  pl: "Syn"
  it: "Zin"
  nl: "Zin"
  cs: "Cin"
body:
  en:
    - "The wilderness of Zin is the desert on Israel's southern border, between the wilderness of Paran to the south and the Negeb of Judah to the north, from the edge of Edom and the Arabah westward to Kadesh-barnea. It is not the wilderness of Sin near Sinai, where the manna first fell; the Hebrew names differ, though the Synodal Bible writes both as Sin. The spies went up “from the wilderness of Zin unto Rehob”; the southern border of the land ran “from the wilderness of Zin along by the coast of Edom”, over the ascent of Akrabbim and past Kadesh-barnea, and Judah's lot reached “to the border of Edom the wilderness of Zin southward”."
    - "Here, apparently in the fortieth year, “came the children of Israel, even the whole congregation, into the desert of Zin in the first month: and the people abode in Kadesh; and Miriam died there”. The water failed, the people quarrelled, and Moses struck the rock twice at the waters of Meribah; for that, the Lord later reminded him, “ye rebelled against my commandment in the desert of Zin”, and neither he nor Aaron would enter the land. The itinerary of Numbers lists the camp “in the wilderness of Zin, which is Kadesh” before Mount Hor, where Aaron died, and a psalm hears the voice of the Lord shake “the wilderness of Kadesh”."
    - "Kadesh is usually placed at Ein el-Qudeirat in northern Sinai, the richest spring of the region, where Rudolph Cohen excavated what he took to be three successive fortresses of the tenth to sixth centuries BC, the later ones Judahite outposts; their number, dates and builders are debated, and nothing earlier than the Iron Age has been found. The wilderness of Zin is thus the central Negev highlands and the plateau that drops into the Arabah. C. L. Woolley and T. E. Lawrence surveyed it for the Palestine Exploration Fund in 1914 and called their report The Wilderness of Zin, though its purpose was also a military map."
    - "Today this is the Negev of Israel: the craters of Makhtesh Ramon and the Great Makhtesh, the Nahal Zin canyon with the spring of Ein Avdat, the Nabataean city of Avdat, and Sde Boker, where David Ben-Gurion is buried above the gorge. Ein el-Qudeirat itself lies across the border in Egypt."
  ru:
    - "Пустыня Син (Цин) — пустыня на южной границе Израиля, между пустыней Фаран к югу и Негевом Иудиным к северу, от края Едома и Аравы на запад до Кадес-Варни. Это не пустыня Син близ Синая, где впервые выпала манна: еврейские имена различны, хотя Синодальный перевод пишет обе как Син. Соглядатаи прошли землю «от пустыни Син даже до Рехова»; южная граница земли шла «от пустыни Син, подле Едома», через возвышенность Акравим и мимо Кадес-Варни, а удел Иуды доходил до того, что «в смежности с Идумеею была пустыня Син, к югу»."
    - "Сюда, по-видимому в сороковой год, «пришли сыны Израилевы, все общество, в пустыню Син в первый месяц, и остановился народ в Кадесе, и умерла там Мариам». Вода иссякла, народ роптал, и Моисей дважды ударил в скалу при водах Меривы; за это, как позже напомнил ему Господь, «вы не послушались повеления Моего в пустыне Син», и ни он, ни Аарон не войдут в землю. Список станов в книге Чисел называет стан «в пустыне Син» перед горой Ор, где умер Аарон, а псалом слышит, как глас Господа потрясает «пустыню Кадес»."
    - "Кадес обычно помещают в Эйн-эль-Кудейрат на севере Синая, у самого обильного источника края, где Рудольф Коэн раскопал, как он считал, три сменявшие друг друга крепости X–VI веков до н. э., из которых поздние — иудейские форпосты; их число, даты и строители спорны, а ничего древнее железного века там не найдено. Пустыня Син, стало быть, — центральное нагорье Негева и плато, обрывающееся к Араве. Ч. Л. Вулли и Т. Э. Лоуренс обследовали его для Фонда исследования Палестины в 1914 году и назвали отчёт «Пустыня Син», хотя целью была и военная карта."
    - "Сегодня это израильский Негев: кратеры Махтеш-Рамон и Большой Махтеш, каньон Нахаль-Цин с источником Эйн-Авдат, набатейский город Авдат и Сде-Бокер, где над ущельем похоронен Давид Бен-Гурион. Сам Эйн-эль-Кудейрат лежит за границей, в Египте."
  uk:
    - "Пустеля Цін — пустеля на південному кордоні Ізраїлю, між пустелею Фаран на півдні та Негевом Юди на півночі, від краю Едому й Арави на захід до Кадес-Барнеа. Це не пустеля Сін біля Синаю, де вперше впала манна: староєврейські назви різняться, хоч Синодальний переклад пише обидві як Син. Розвідники пішли «розгледїли землю від Зин степу до Регобу»; південна межа краю йшла «від Зин степу, здовж Едома», через підйом Акравім і повз Кадес-Барнеа, а уділ Юди сягав «В межу з Ідумеєю був степ Син, від полудня»."
    - "Тут, мабуть на сороковому році, «прийшли сини Ізрайлеві цїлою громадою в степ Зин, первого місяця; і остановився народ в Кадесї; і вмерла там Миряма, і поховано її там». Води не стало, народ сварився, і Мойсей двічі вдарив скелю при водах Мерива; за це Господь згодом нагадав йому: «збунтувались ви проти слова мого в Зин степу», і ні він, ні Арон не ввійдуть у край. Перелік у Числах згадує табір: «отаборились у Зин степу, се Кадес» перед горою Гор, де помер Арон, а псалом чує, як голос Господній «трясе пустиню Кадейську»."
    - "Кадес зазвичай ставлять у Ейн-ель-Кудейраті на півночі Синаю, найбагатшому джерелі краю, де Рудольф Коен розкопав, як він вважав, три послідовні фортеці X–VI ст. до н. е., з яких пізніші — юдейські форпости; їхня кількість, дати й будівничі спірні, а нічого давнішого за залізну добу там не знайдено. Пустеля Цін, отже, — це центральне нагір’я Негеву та плато, що спадає в Араву. К. Л. Вуллі й Т. Е. Лоуренс обстежили її для Фонду дослідження Палестини 1914 року й назвали свій звіт «Пустеля Цін», хоч його метою була й військова мапа."
    - "Нині це Негев Ізраїлю: кратери Махтеш-Рамон і Великий Махтеш, каньйон Нахаль-Цін з джерелом Ейн-Авдат, набатейське місто Авдат і Сде-Бокер, де над ущелиною похований Давид Бен-Гуріон. Сам Ейн-ель-Кудейрат лежить за кордоном у Єгипті."
  es:
    - "El desierto de Zin es el desierto de la frontera meridional de Israel, entre el desierto de Parán, al sur, y el Néguev de Judá, al norte, desde el borde de Edom y el Arabá hacia el oeste hasta Cades-barnea. No es el desierto de Sin, cerca del Sinaí, donde cayó por primera vez el maná; los nombres hebreos difieren, aunque la Biblia sinodal escribe ambos como Sin. Los espías subieron «desde el desierto de Zin hasta Rehob»; la frontera sur de la tierra corría «desde el desierto de Zin hasta los términos de Edom», por la subida de Acrabim y pasando Cades-barnea, y la suerte de Judá llegaba «junto al término de Edom, del desierto de Zin al mediodía»."
    - "Aquí, al parecer en el año cuadragésimo, «llegaron los hijos de Israel, toda la congregación, al desierto de Zin, en el mes primero, y asentó el pueblo en Cades; y allí murió María». Faltó el agua, el pueblo riñó, y Moisés golpeó la peña dos veces en las aguas de Meriba; por eso, como el Señor le recordó más tarde, «fuisteis rebeldes á mi dicho en el desierto de Zin», y ni él ni Aarón entrarían en la tierra. El itinerario de Números enumera el campamento «en el desierto de Zin, que es Cades» antes del monte Hor, donde murió Aarón, y un salmo oye la voz del Señor hacer temblar «el desierto de Cades»."
    - "Cades suele situarse en Ein el-Qudeirat, en el norte del Sinaí, el manantial más rico de la región, donde Rudolph Cohen excavó lo que consideró tres fortalezas sucesivas de los siglos X al VI a. C., las posteriores puestos avanzados judaítas; su número, fechas y constructores se discuten, y nada anterior a la Edad del Hierro se ha hallado allí. El desierto de Zin es, pues, las tierras altas del Néguev central y la meseta que desciende al Arabá. C. L. Woolley y T. E. Lawrence lo prospectaron para el Fondo de Exploración de Palestina en 1914 y titularon su informe The Wilderness of Zin, aunque su propósito era también un mapa militar."
    - "Hoy es el Néguev de Israel: los cráteres de Makhtesh Ramon y del Gran Makhtesh, el cañón del Nahal Zin con el manantial de Ein Avdat, la ciudad nabatea de Avdat y Sde Boker, donde David Ben-Gurión está sepultado sobre la garganta. Ein el-Qudeirat se encuentra al otro lado de la frontera, en Egipto."
  pt:
    - "O deserto de Zim é o deserto na fronteira sul de Israel, entre o deserto de Parã, ao sul, e o Neguebe de Judá, ao norte, da orla de Edom e da Arabá para oeste até Cades-Barneia. Não é o deserto de Sim, perto do Sinai, onde o maná caiu pela primeira vez; os nomes hebraicos diferem, embora a Bíblia Sinodal escreva ambos como Sin. Os espias subiram e espiaram a terra “desde o deserto de Zim até Reobe”; a fronteira sul da terra corria “desde o deserto de Zim, ao longo da fronteira de Edom”, pela subida de Acrabim e passando por Cades-Barneia, e a sorte de Judá chegava “até a fronteira de Edom, até o deserto de Zim, ao sul”."
    - "Aqui, ao que parece no quadragésimo ano, “Os filhos de Israel, toda a congregação, chegaram ao deserto de Zim no primeiro mês. O povo ficou em Cades. Miriã morreu ali e ali foi sepultada”. A água faltou, o povo contendeu, e Moisés feriu a rocha duas vezes nas águas de Meribá; por isso, como o Senhor lhe lembrou depois, “você se rebelou contra a minha palavra no deserto de Zim”, e nem ele nem Arão entrariam na terra. O itinerário de Números lista o acampamento “em Cades, no deserto de Zim” antes do monte Hor, onde Arão morreu, e um salmo ouve a voz do Senhor sacudir “o deserto de Cades”."
    - "Cades costuma ser situada em Ein el-Qudeirat, no norte do Sinai, a mais rica fonte da região, onde Rudolph Cohen escavou o que julgou serem três fortalezas sucessivas dos séculos X a VI a.C., as posteriores postos avançados judaítas; seu número, datas e construtores são debatidos, e nada anterior à Idade do Ferro foi achado ali. O deserto de Zim é, portanto, as terras altas do Neguebe central e o planalto que desce à Arabá. C. L. Woolley e T. E. Lawrence o prospectaram para o Palestine Exploration Fund em 1914 e chamaram seu relatório The Wilderness of Zin, embora seu propósito fosse também um mapa militar."
    - "Hoje é o Neguebe de Israel: as crateras de Makhtesh Ramon e do Grande Makhtesh, o cânion do Nahal Zin com a fonte de Ein Avdat, a cidade nabateia de Avdat e Sde Boker, onde David Ben-Gurion está sepultado acima da garganta. O próprio Ein el-Qudeirat fica do outro lado da fronteira, no Egito."
  de:
    - "Die Wüste Zin ist die Wüste an Israels Südgrenze, zwischen der Wüste Paran im Süden und dem Negev Judas im Norden, vom Rand Edoms und der Araba westwärts bis Kadesch-Barnea. Sie ist nicht die Wüste Sin bei Sinai, wo das Manna zuerst fiel; die hebräischen Namen unterscheiden sich, obwohl die Synodalbibel beide Sin schreibt. Die Kundschafter erkundeten das Land „von der Wüste Zin bis gen Rehob“; die Südgrenze des Landes sollte anfangen „an der Wüste Zin bei Edom“, über die Steige Akrabbim und an Kadesch-Barnea vorbei verlaufen, und Judas Los lag „an der Grenze Edoms bei der Wüste Zin, mittagwärts“."
    - "Hier, offenbar im vierzigsten Jahr: „Und die Kinder Israel kamen mit der ganzen Gemeinde in die Wüste Zin im ersten Monat, und das Volk lag zu Kades. Und Mirjam starb daselbst und ward daselbst begraben.“ Das Wasser fehlte, das Volk haderte, und Mose schlug den Fels zweimal beim Wasser von Meriba; dafür hielt ihm der Herr später vor, dass „ihr meinem Wort ungehorsam gewesen seid in der Wüste Zin“, und weder er noch Aaron werde das Land betreten. Die Stationenliste in Numeri führt das Lager „in der Wüste Zin, das ist Kades“ vor dem Berg Hor auf, wo Aaron starb, und ein Psalm hört die Stimme des Herrn „die Wüste Kades“ erregen."
    - "Kadesch wird meist in Ein el-Qudeirat im nördlichen Sinai angesetzt, der reichsten Quelle der Gegend, wo Rudolph Cohen ausgrub, was er für drei aufeinanderfolgende Festungen des zehnten bis sechsten Jahrhunderts v. Chr. hielt, die späteren judäische Außenposten; ihre Zahl, Datierung und Erbauer sind umstritten, und nichts vor der Eisenzeit wurde dort gefunden. Die Wüste Zin ist somit das zentrale Negev-Hochland und die Hochebene, die in die Araba abfällt. C. L. Woolley und T. E. Lawrence vermaßen sie 1914 für den Palestine Exploration Fund und nannten ihren Bericht The Wilderness of Zin, obwohl sein Zweck auch eine Militärkarte war."
    - "Heute ist dies der Negev Israels: die Krater Makhtesh Ramon und der Große Makhtesh, die Schlucht Nahal Zin mit der Quelle Ein Avdat, die nabatäische Stadt Avdat und Sde Boker, wo David Ben-Gurion über der Schlucht begraben ist. Ein el-Qudeirat selbst liegt jenseits der Grenze in Ägypten."
  fr:
    - "Le désert de Tsin est le désert de la frontière sud d’Israël, entre le désert de Paran au sud et le Négev de Juda au nord, du bord d’Édom et de l’Araba vers l’ouest jusqu’à Kadès-Barnéa. Ce n’est pas le désert de Sin près du Sinaï, où la manne tomba d’abord : les noms hébreux diffèrent, bien que la Bible synodale écrive les deux Sin. Les espions explorèrent le pays « depuis le désert de Tsin jusqu’à Rehob » ; la frontière sud du pays commençait « au désert de Tsin près d’Édom », passait au sud de la montée d’Akrabbim et par Kadès-Barnéa, et le lot de Juda s’étendait « vers la frontière d’Édom, jusqu’au désert de Tsin, au midi »."
    - "Ici, apparemment la quarantième année, « toute l’assemblée des enfants d’Israël arriva dans le désert de Tsin le premier mois, et le peuple s’arrêta à Kadès. C’est là que mourut Marie » (Miriam). L’eau manqua, le peuple se querella, et Moïse frappa le rocher deux fois aux eaux de Meriba ; pour cela, l’Éternel le lui rappela plus tard : « vous avez été rebelles à mon ordre, dans le désert de Tsin », et ni lui ni Aaron n’entreraient dans le pays. L’itinéraire des Nombres cite le camp « dans le désert de Tsin : c’est Kadès » avant le mont Hor, où Aaron mourut, et un psaume entend la voix de l’Éternel faire trembler « le désert de Kadès »."
    - "Kadès est d’ordinaire placée à Ein el-Qudeirat, dans le nord du Sinaï, la plus riche source de la région, où Rudolph Cohen fouilla ce qu’il tenait pour trois forteresses successives des Xe-VIe siècles av. J.-C., les plus tardives étant des avant-postes judéens ; leur nombre, leurs dates et leurs bâtisseurs sont débattus, et rien d’antérieur à l’âge du Fer n’y a été trouvé. Le désert de Tsin est donc les hautes terres du centre du Néguev et le plateau qui descend dans l’Araba. C. L. Woolley et T. E. Lawrence l’explorèrent pour le Palestine Exploration Fund en 1914 et intitulèrent leur rapport The Wilderness of Zin, bien que son but ait aussi été une carte militaire."
    - "C’est aujourd’hui le Néguev d’Israël : les cratères de Makhtesh Ramon et du Grand Makhtesh, le canyon du Nahal Tsin avec la source d’Ein Avdat, la ville nabatéenne d’Avdat, et Sde Boker, où David Ben-Gourion est enterré au-dessus de la gorge. Ein el-Qudeirat se trouve de l’autre côté de la frontière, en Égypte."
  pl:
    - "Pustynia Syn to pustynia na południowej granicy Izraela, między pustynią Paran na południu a Negewem Judy na północy, od skraju Edomu i Araby na zachód do Kadesz-Barnea. Nie jest to pustynia Sin koło Synaju, gdzie po raz pierwszy spadła manna; hebrajskie nazwy się różnią, choć Biblia synodalna zapisuje obie jako Sin. Szpiedzy poszli „od puszczy Syn aż do Rochob”; południowa granica ziemi biegła „od puszczy Syn aż do granic Edomskich”, przez wzniesienie Akrabbim i obok Kadesz-Barnea, a dział Judy sięgał „przy granicach Edom, i przy puszczy Syn na południe od ostatecznej granicy południowej”."
    - "Tu, zapewne w czterdziestym roku, „I przyszło wszystko mnóstwo synów Izraelskich na puszczą Syn, miesiąca pierwszego; i mieszkał lud w Kades; gdzie umarła Maryja, i tamże jest pogrzebiona.” Zabrakło wody, lud się swarzył, a Mojżesz dwukrotnie uderzył w skałę przy wodach Meriby; za to Pan później mu przypomniał: „Przeto żeście byli odpornymi słowu mojemu na puszczy Syn”, i ani on, ani Aaron nie mieli wejść do kraju. Wykaz stacji w Księdze Liczb wymienia obóz „na puszczy Syn, która jest Kades” przed Górą Hor, gdzie umarł Aaron, a psalm słyszy, jak głos Pana wstrząsa pustynią Kadesz."
    - "Kadesz umieszcza się zwykle w Ejn el-Kudejrat w północnym Synaju, najbogatszym źródle regionu, gdzie Rudolph Cohen odkopał, jak sądził, trzy kolejne fortece z X–VI wieku p.n.e., z których późniejsze były judzkimi placówkami; ich liczba, datowanie i budowniczowie są sporne, a nic starszego niż epoka żelaza tam nie znaleziono. Pustynia Syn to więc centralne wyżyny Negewu i płaskowyż opadający w Arabę. C. L. Woolley i T. E. Lawrence badali ją dla Funduszu Badań Palestyny w 1914 roku i nazwali swój raport The Wilderness of Zin, choć jego celem była też mapa wojskowa."
    - "Dziś to izraelski Negew: kratery Machtesz Ramon i Wielki Machtesz, kanion Nachal Cin ze źródłem Ejn Awdat, nabatejskie miasto Awdat i Sede Boker, gdzie David Ben-Gurion jest pochowany nad wąwozem. Sam Ejn el-Kudejrat leży za granicą w Egipcie."
  it:
    - "Il deserto di Zin è il deserto sul confine meridionale d’Israele, fra il deserto di Paran a sud e il Negheb di Giuda a nord, dal margine di Edom e dall’Araba verso ovest fino a Kades-Barnea. Non è il deserto di Sin presso il Sinai, dove cadde per la prima volta la manna; i nomi ebraici differiscono, benché la Bibbia sinodale scriva entrambi Sin. Gli esploratori salirono «dal deserto di Tsin fino a Rehob»; il confine meridionale del paese «comincerà al deserto di Tsin, vicino a Edom», oltre la salita di Akrabbim e passando Kades-Barnea, e il lotto di Giuda arrivava «sino al confine di Edom, al deserto di Tsin verso sud»."
    - "Qui, a quanto pare nel quarantesimo anno, «tutta la raunanza dei figliuoli d’Israele arrivò al deserto di Tsin il primo mese, e il popolo si fermò a Kades. Quivi morì e fu sepolta Maria». L’acqua mancò, il popolo contese, e Mosè percosse il sasso due volte alle acque di Meriba; per questo il Signore più tardi gli ricordò: «vi ribellaste all’ordine che vi detti nel deserto di Tsin», e né lui né Aronne sarebbero entrati nel paese. L’itinerario dei Numeri elenca l’accampamento «nel deserto di Tsin, cioè a Kades» prima del Monte Or, dove morì Aronne, e un salmo sente la voce del Signore far tremare «il deserto di Cades»."
    - "Kades è di solito collocata a Ein el-Qudeirat nel Sinai settentrionale, la sorgente più ricca della regione, dove Rudolph Cohen scavò quelle che ritenne tre successive fortezze dal X al VI secolo a.C., le più tarde avamposti giudaiti; il loro numero, le date e i costruttori sono discussi, e nulla di anteriore all’età del Ferro vi è stato trovato. Il deserto di Zin è dunque l’altopiano centrale del Negheb e il pianoro che scende nell’Araba. C. L. Woolley e T. E. Lawrence lo esplorarono per il Palestine Exploration Fund nel 1914 e intitolarono il loro rapporto The Wilderness of Zin, benché il suo scopo fosse anche una carta militare."
    - "Oggi è il Negheb di Israele: i crateri di Makhtesh Ramon e del Grande Makhtesh, il canyon del Nahal Zin con la sorgente di Ein Avdat, la città nabatea di Avdat e Sde Boker, dove David Ben-Gurion è sepolto sopra la gola. Ein el-Qudeirat stessa si trova oltre il confine in Egitto."
  nl:
    - "De woestijn Zin is de woestijn aan Israëls zuidgrens, tussen de woestijn Paran in het zuiden en de Negev van Juda in het noorden, van de rand van Edom en de Araba naar het westen tot Kades-Barnea. Ze is niet de woestijn Sin bij Sinaï, waar het manna het eerst viel; de Hebreeuwse namen verschillen, al schrijft de Synodale Bijbel beide als Sin. De verspieders trokken op “van de woestijn Zin af tot Rechob toe”; de zuidgrens van het land liep “van de woestijn Zin, aan de zijden van Edom”, over de opgang van Akrabbim en langs Kades-Barnea, en het lot van Juda reikte “aan de landpale van Edom, de woestijn Zin, zuidwaarts”."
    - "Hier, kennelijk in het veertigste jaar: “Als de kinderen Israels, de ganse vergadering, in de woestijn Zin gekomen waren, in de eerste maand, zo bleef het volk te Kades. En Mirjam stierf aldaar”. Het water ontbrak, het volk twistte, en Mozes sloeg de rots tweemaal bij de wateren van Meriba; daarom hield de HEER hem later voor: “gijlieden Mijn mond wederspannig zijt geweest in de woestijn Zin”, en noch hij noch Aäron zou het land binnengaan. De reisroute in Numeri noemt het kamp “in de woestijn Zin, dat is Kades” vóór de berg Hor, waar Aäron stierf, en een psalm hoort de stem van de HEER “de woestijn Kades” doen beven."
    - "Kades wordt gewoonlijk geplaatst bij Ein el-Qudeirat in het noorden van de Sinaï, de rijkste bron van de streek, waar Rudolph Cohen opgroef wat hij hield voor drie opeenvolgende vestingen uit de tiende tot zesde eeuw v.Chr., de latere Judese voorposten; hun aantal, datering en bouwers zijn omstreden, en niets van vóór de ijzertijd is er gevonden. De woestijn Zin is dus het centrale hoogland van de Negev en het plateau dat afdaalt naar de Araba. C.L. Woolley en T.E. Lawrence onderzochten haar in 1914 voor de Palestine Exploration Fund en noemden hun verslag The Wilderness of Zin, hoewel het doel ook een militaire kaart was."
    - "Tegenwoordig is dit de Negev van Israël: de kraters Makhtesh Ramon en de Grote Makhtesh, de canyon van Nahal Zin met de bron Ein Avdat, de Nabateese stad Avdat, en Sde Boker, waar David Ben-Goerion boven de kloof begraven ligt. Ein el-Qudeirat zelf ligt over de grens in Egypte."
  cs:
    - "Poušť Cin je poušť na jižní hranici Izraele, mezi pouští Páran na jihu a Negevem Judy na severu, od okraje Edómu a Araby na západ ke Kádeš-barnea. Není to poušť Sín u Sinaje, kde poprvé padala mana; hebrejská jména se liší, třebaže synodální překlad píše obojí jako Sin. Zvědové šli „od pouště Tsin až do Rohob“; jižní hranice země byla: „Strana polední vaše bude poušť Tsin vedlé pomezí Edomských“, přes výstup Akrabím a kolem Kádeš-barnea, a los Judy sahal „při pomezí Edomském a poušti Tsin ku poledni“."
    - "Zde zřejmě ve čtyřicátém roce „přitáhlo všecko množství synů Izraelských na poušť Tsin, měsíce prvního; i pozůstal lid v Kádes, kdež umřela Maria, a tu jest pochována“. Voda došla, lid se hádal a Mojžíš udeřil dvakrát na skálu u vod Meriby; za to mu Hospodin později připomněl: „Poněvadž jste odporovali řeči mé na poušti Tsin“ a ani on, ani Áron nevstoupí do země. Itinerář v Numeri uvádí tábor „na poušti Tsin, jenž jest Kádes“ před horou Hor, kde zemřel Áron, a žalm slyší hlas Hospodinův, který „k bolesti přivodí poušť, k bolesti přivodí Hospodin poušť Kádes“."
    - "Kádeš se obvykle klade k Ajn el-Kudejrát v severním Sinaji, nejbohatšímu prameni oblasti, kde Rudolph Cohen vykopal to, co pokládal za tři po sobě jdoucí pevnosti z 10. až 6. stol. př. n. l., z nichž pozdější byly judskými předsunutými stanovišti; jejich počet, datace i stavitelé jsou sporné a nic staršího než doba železná se tam nenašlo. Poušť Cin je tedy středním Negevem s vrchovinou a plošinou, která klesá do Araby. C. L. Woolley a T. E. Lawrence ji prozkoumali pro Palestine Exploration Fund roku 1914 a svou zprávu nazvali The Wilderness of Zin, ačkoli jejím účelem byla i vojenská mapa."
    - "Dnes je to izraelský Negev: krátery Machteš Ramon a Velký Machteš, kaňon Nachal Cin s pramenem Ejn Avdat, nabatejské město Avdat a Sde Boker, kde je nad soutěskou pohřben David Ben Gurion. Samotný Ajn el-Kudejrát leží za hranicí v Egyptě."
