body:
  en:
    - "The brook, or valley, of Zered is the stream that Israel crossed on the way from Edom into Moab, and the Bible makes it a turning point in time. Moses recalls the command: “Now rise up, said I, and get you over the brook Zered. And we went over the brook Zered. And the space in which we came from Kadesh-barnea, until we were come over the brook Zered, was thirty and eight years; until all the generation of the men of war were wasted out from among the host, as the LORD sware unto them.” The itinerary in Numbers also notes that Israel “pitched in the valley of Zared”. Beyond these verses the Zered plays no part in the story."
    - "It is generally identified with the Wadi al-Hasa in Jordan, which cuts deep westward through the plateau and reaches the Dead Sea's southern plain near Safi, and which has long marked the line between the lands of Moab to the north and Edom to the south. Surveys of the wadi in 1979–1983 recorded sites from the Palaeolithic onward, but nothing that can be tied to the crossing. Today the valley forms the boundary between Jordan's Karak and Tafila governorates."
  ru:
    - "Долина Заред — поток, который Израиль перешёл на пути из Едома в Моав, и Библия делает этот переход рубежом во времени. Моисей вспоминает повеление: «итак встаньте и пройдите долину Заред. И прошли мы долину Заред. С тех пор, как мы пошли в Кадес-Варни и как прошли долину Заред, минуло тридцать восемь лет, и у нас перевелся из среды стана весь род ходящих на войну, как клялся им Господь Бог». Перечень стоянок в книге Чисел тоже отмечает, что израильтяне «остановились на долине Заред». Кроме этих стихов, Заред в повествовании не участвует."
    - "Его обычно отождествляют с Вади-эль-Хаса в Иордании, которая глубоко врезается на запад в плоскогорье и выходит к южной равнине Мёртвого моря у Сафи; она издавна разделяла земли Моава на севере и Едома на юге. Обследования вади в 1979–1983 годах отметили стоянки начиная с палеолита, но ничего, что можно связать с переходом Израиля. Сегодня долина служит границей между иорданскими мухафазами Карак и Тафила."
  uk:
    - "Потік, або долина, Заред — струмок, який Ізраїль перейшов на шляху з Едому в Моав, і Біблія робить його переломом у часі. Мойсей пригадує наказ: «Тепер вставайте і перебирайтесь через Серед-ріку. І перебріли ми Серед-ріку. А часу того, що йшли ми від Кадес-Барне, покіль перебріли Серед-ріку, минуло трийцять і вісїм років, аж поки ізник увесь рід боївників із табору, як поклявсь їм Господь». Перелік у Числах також зазначає, що Ізраїль «отаборились над потоком Серед». Поза цими віршами Заред не відіграє ролі в розповіді."
    - "Його зазвичай ототожнюють із Вади-ель-Хаса в Йорданії, що глибоко врізається на захід крізь плато й сягає південної рівнини Мертвого моря біля Сафі і здавна позначала межу між землями Моаву на півночі й Едому на півдні. Обстеження вади 1979–1983 років зафіксували місця від палеоліту, але нічого, що можна було б пов’язати з переходом. Нині долина становить межу між йорданськими провінціями Карак і Тафіла."
  es:
    - "El arroyo, o valle, de Zered es la corriente que Israel cruzó al pasar de Edom a Moab, y la Biblia lo convierte en un punto de inflexión en el tiempo. Moisés recuerda el mandato: «Levantaos ahora, y pasad el arroyo de Zered. Y pasamos el arroyo de Zered. Y los días que anduvimos de Cades-barnea hasta que pasamos el arroyo de Zered, fueron treinta y ocho años; hasta que se acabó toda la generación de los hombres de guerra de en medio del campo, como Jehová les había jurado». El itinerario de Números anota también que Israel «asentaron en la arroyada de Zared». Más allá de estos versículos el Zered no desempeña ningún papel en el relato."
    - "Se identifica generalmente con el Wadi al-Hasa, en Jordania, que corta profundamente la meseta hacia el oeste y llega a la llanura meridional del mar Muerto cerca de Safi, y que desde hace mucho marca la línea entre las tierras de Moab, al norte, y de Edom, al sur. Las prospecciones del wadi en 1979–1983 registraron sitios desde el Paleolítico en adelante, pero nada que pueda vincularse con el cruce. Hoy el valle forma la frontera entre las gobernaciones jordanas de Karak y Tafila."
  pt:
    - "O ribeiro, ou vale, de Zerede é o riacho que Israel atravessou no caminho de Edom a Moabe, e a Bíblia faz dele um ponto de virada no tempo. Moisés recorda a ordem: “Agora levantem-se e atravessem o ribeiro de Zerede. E nós atravessamos o ribeiro de Zerede. Os dias em que caminhamos desde Cades-Barneia até atravessarmos o ribeiro de Zerede foram trinta e oito anos, até que toda a geração dos homens de guerra fosse consumida do meio do acampamento, como o SENHOR lhes havia jurado.” O itinerário de Números nota também que Israel “acampou no vale de Zerede”. Além desses versículos, o Zerede não tem papel na história."
    - "É geralmente identificado com o Wadi al-Hasa, na Jordânia, que corta fundo para oeste o planalto e chega à planície sul do Mar Morto perto de Safi, e que há muito marca a linha entre as terras de Moabe, ao norte, e Edom, ao sul. Prospecções do uádi em 1979–1983 registraram sítios do Paleolítico em diante, mas nada que possa ser ligado à travessia. Hoje o vale forma a fronteira entre as províncias jordanianas de Karak e Tafila."
  de:
    - "Der Bach oder das Tal Sered ist der Wasserlauf, den Israel auf dem Weg von Edom nach Moab überquerte, und die Bibel macht ihn zu einem Wendepunkt der Zeit. Mose erinnert an den Befehl: „So macht euch nun auf und ziehet durch den Bach Sered! und wir zogen hindurch. Die Zeit aber, die wir von Kades-Barnea zogen, bis wir durch den Bach Sered kamen, war achtunddreißig Jahre, bis alle die Kriegsleute gestorben waren im Lager, wie der HERR ihnen geschworen hatte.“ Die Stationenliste in Numeri vermerkt auch: „Und von da zogen sie und lagerten sich am Bach Sered.“ Über diese Verse hinaus spielt der Sered in der Geschichte keine Rolle."
    - "Er wird meist mit dem Wadi al-Hasa in Jordanien gleichgesetzt, das sich tief nach Westen durch die Hochebene schneidet, die Südebene des Toten Meeres bei Safi erreicht und seit langem die Grenze zwischen den Ländern Moabs im Norden und Edoms im Süden markiert. Erkundungen des Wadis 1979–1983 verzeichneten Stätten von der Altsteinzeit an, aber nichts, was sich mit der Überquerung verbinden ließe. Heute bildet das Tal die Grenze zwischen den jordanischen Gouvernements Karak und Tafila."
  fr:
    - "Le torrent, ou la vallée, de Zéred est le cours d’eau qu’Israël franchit en allant d’Édom vers Moab, et la Bible en fait un tournant dans le temps. Moïse rappelle l’ordre : « Maintenant levez-vous, et passez le torrent de Zéred. Nous passâmes le torrent de Zéred. Le temps que durèrent nos marches de Kadès-Barnéa au passage du torrent de Zéred fut de trente-huit ans, jusqu’à ce que toute la génération des hommes de guerre eût disparu du milieu du camp, comme l’Éternel le leur avait juré. » L’itinéraire des Nombres note aussi qu’Israël campa « dans la vallée de Zéred ». Hors de ces versets, le Zéred ne joue aucun rôle dans le récit."
    - "On l’identifie généralement au Wadi al-Hasa, en Jordanie, qui entaille profondément le plateau vers l’ouest et atteint la plaine sud de la mer Morte près de Safi, et qui marque depuis longtemps la ligne entre les terres de Moab au nord et d’Édom au sud. Des prospections de l’oued en 1979-1983 ont relevé des sites à partir du paléolithique, mais rien qu’on puisse rattacher à la traversée. Aujourd’hui, la vallée forme la limite entre les gouvernorats jordaniens de Karak et de Tafila."
  pl:
    - "Potok, czyli dolina, Zared to strumień, który Izrael przekroczył w drodze z Edomu do Moabu, i Biblia czyni go punktem zwrotnym w czasie. Mojżesz przypomina rozkaz: „Wstańcież tedy, a przeprawcie się przez potok Zared; i przeprawiliśmy się przez potok Zared. A czasu, któregośmy chodzili od Kades Barne, ażeśmy się przeprawili przez potok Zared, było trzydzieści i osiem lat, aż wyginął wszystek on naród mężów walecznych z obozu, jako im był przysiągł Pan.” Wykaz stacji w Księdze Liczb notuje też, że Izraelici „położyli się obozem nad potokiem Zered”. Poza tymi wersetami Zared nie odgrywa roli w opowieści."
    - "Utożsamia się go zwykle z Wadi al-Hasa w Jordanii, które głęboko wcina się na zachód w płaskowyż i dociera do południowej równiny Morza Martwego koło Safi, i które od dawna wyznacza linię między ziemiami Moabu na północy a Edomu na południu. Badania wadi w latach 1979–1983 odnotowały stanowiska od paleolitu po późniejsze epoki, ale nic, co można by powiązać z przeprawą. Dziś dolina stanowi granicę między jordańskimi muhafazami Karak i Tafila."
  it:
    - "Il torrente, o valle, di Zered è il corso d’acqua che Israele attraversò nel cammino da Edom a Moab, e la Bibbia ne fa uno spartiacque nel tempo. Mosè ricorda il comando: «Ora levatevi, e passate il torrente di Zered. E noi passammo il torrente di Zered. Or il tempo che durarono le nostre marce, da Kades-Barnea al passaggio del torrente di Zered, fu di trentotto anni, finché tutta quella generazione degli uomini di guerra scomparve interamente dal campo, come l’Eterno l’avea loro giurato». L’itinerario dei Numeri nota anche che gl’Israeliti «si accamparono nella valle di Zered». Oltre questi versetti lo Zered non ha parte nel racconto."
    - "È generalmente identificato con il Wadi al-Hasa in Giordania, che taglia profondamente a ovest l’altopiano e raggiunge la piana meridionale del Mar Morto presso Safi, e che da lungo tempo segna il confine fra le terre di Moab a nord ed Edom a sud. Le ricognizioni dell’uadi nel 1979–1983 registrarono siti dal Paleolitico in poi, ma nulla che si possa legare all’attraversamento. Oggi la valle forma il confine fra i governatorati giordani di Karak e di Tafila."
  nl:
    - "De beek, of het dal, van Zered is de stroom die Israël overtrok op weg van Edom naar Moab, en de Bijbel maakt er een keerpunt in de tijd van. Mozes herinnert aan het bevel: “Nu, maakt u op, en trekt over de beek Zered. Alzo trokken wij over de beek Zered. De dagen nu, die wij gewandeld hebben van Kades-Barnea, totdat wij over de beek Zered getogen zijn, waren acht en dertig jaren; totdat het ganse geslacht der krijgslieden uit het midden der heirlegers verteerd was, gelijk de HEERE hun gezworen had.” De reisroute in Numeri noteert ook: “Van daar reisden zij, en legerden zich bij de beek Zered.” Buiten deze verzen speelt de Zered geen rol in het verhaal."
    - "Hij wordt algemeen vereenzelvigd met de Wadi al-Hasa in Jordanië, die diep naar het westen door het plateau snijdt en de zuidelijke vlakte van de Dode Zee bij Safi bereikt, en die al lang de lijn markeert tussen de landen van Moab in het noorden en Edom in het zuiden. Onderzoek van de wadi in 1979–1983 registreerde plaatsen vanaf het Paleolithicum, maar niets wat aan de oversteek kan worden gekoppeld. Tegenwoordig vormt het dal de grens tussen de Jordaanse gouvernementen Karak en Tafila."
  cs:
    - "Potok neboli údolí Zered je tok, který Izrael překročil na cestě z Edómu do Moábu, a Bible z něj činí zlom v čase. Mojžíš připomíná příkaz: „Nyní vstanouce, přejděte potok Záred. I přešli jsme potok Záred. Času pak, v němž jsme šli z Kádesbarne, až jsme přešli potok Záred, bylo let třidceti osm, dokavadž nebyl vyhlazen všecken věk mužů bojovných z prostřed stanů, jakož jim přisáhl Hospodin.“ Itinerář v Numeri také poznamenává, že Izraelci „položili se v údolí Záred“. Mimo tyto verše Zered v příběhu žádnou roli nehraje."
    - "Obecně je ztotožňován s Wádí al-Hasa v Jordánsku, které se hluboko zařezává na západ plošinou a dosahuje jižní roviny Mrtvého moře u Sáfí a od dávna značí hranici mezi zeměmi Moábu na severu a Edómu na jihu. Průzkumy vádí v letech 1979–1983 zaznamenaly lokality od paleolitu výše, ale nic, co by bylo možno spojit s přechodem. Dnes tvoří údolí hranici mezi jordánskými guvernoráty Karak a Tafíla."
  sv:
    - "Bäcken, eller dalen, Sered är strömmen som Israel gick över på vägen från Edom in i Moab, och Bibeln gör den till en vändpunkt i tiden. Mose erinrar om befallningen: ”Stån nu upp och gån över bäcken Sered. Så gingo vi då över bäcken Sered. Och den tid som åtgick för vår vandring från Kades-Barnea, till dess vi gingo över bäcken Sered. var trettioåtta år, och under denna tid förgicks hela den släktet, alla stridbara män i lägret, såsom Herren hade svurit att det skulle gå dem.” Färdvägen i Fjärde Mosebok noterar också att Israel ”lägrade sig i Sereds dal”. Utöver dessa verser spelar Sered ingen roll i berättelsen."
    - "Den identifieras allmänt med Wadi al-Hasa i Jordanien, som skär djupt västerut genom platån och når Döda havets södra slätt nära Safi, och som länge har markerat gränsen mellan Moabs land i norr och Edom i söder. Undersökningar av wadin 1979–1983 registrerade platser från paleolitikum och framåt, men inget som kan knytas till övergången. I dag utgör dalen gränsen mellan Jordaniens guvernement Karak och Tafila."
  nb:
    - "Sered-bekken, eller -dalen, er bekken Israel krysset på vei fra Edom inn i Moab, og Bibelen gjør den til et vendepunkt i tiden. Moses minner om befalingen: «Gjør eder nu rede og gå over Sered-bekken! Så gikk vi over Sered-bekken. Den tid vi var på vandring fra Kades-Barnea, til vi gikk over Sered-bekken, var åtte og tretti år, og da var hele den slekt – alle våbenføre menn – utdød av leiren, som Herren hadde svoret at det skulde gå dem.» Reiseruten i Fjerde Mosebok noterer også at Israel «leiret sig i Sered-dalen». Utover disse versene spiller Sered ingen rolle i fortellingen."
    - "Den identifiseres vanligvis med Wadi al-Hasa i Jordan, som skjærer dypt vestover gjennom platået og når Dødehavets sørlige slette nær Safi, og som lenge har markert linjen mellom Moabs land i nord og Edom i sør. Kartlegginger av wadien i 1979–1983 registrerte steder fra eldre steinalder og framover, men ingenting som kan knyttes til overgangen. I dag danner dalen grensen mellom Jordans guvernementer Karak og Tafila."
  tl:
    - "Ang batis, o libis, ng Zered ay ang sapang tinawid ng Israel sa daan mula Edom patungong Moab, at ginagawa itong sangandaan ng panahon ng Biblia. Inaalala ni Moises ang utos: “Ngayon, tumindig kayo, at tumawid kayo sa batis ng Zered. At tayo'y tumawid sa batis ng Zered. At ang mga araw na ating ipinaglakad mula sa Cades-barnea hanggang sa tayo'y nakarating sa batis ng Zered, ay tatlong pu't walong taon, hanggang sa ang buong lahi ng mga lalaking mangdidigma ay nalipol sa gitna ng kampamento, gaya ng isinumpa sa kanila ng Panginoon.” Itinatala rin ng itineraryo sa Bilang na ang Israel ay “humantong sa libis ng Zared”. Sa labas ng mga talatang ito, walang bahagi ang Zered sa kuwento."
    - "Karaniwan itong kinikilala sa Wadi al-Hasa sa Jordan, na malalim na humihiwa pakanluran sa talampas at umaabot sa timugang kapatagan ng Dagat na Patay malapit sa Safi, at matagal nang nagmamarka ng guhit sa pagitan ng mga lupain ng Moab sa hilaga at Edom sa timog. Itinala ng mga sarbey ng wadi noong 1979–1983 ang mga pook mula Paleolitiko pasulong, ngunit walang maiuugnay sa pagtawid. Ngayon ang libis ay hangganan ng mga lalawigan ng Karak at Tafila ng Jordan."
scripture:
  - Deut.2.13-Deut.2.14
  - Num.21.12
sources:
