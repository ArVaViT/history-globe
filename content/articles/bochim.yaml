# Overview article (ADR 0007). Mainstream facts only; the place of the angel's rebuke is unknown; its link with Bethel (Septuagint, Synodal) and with Allon-bachuth is given as conjecture.
id: bochim
place: a859268
title:
  en: "Bochim"
  ru: "Бохим"
  uk: "Бохім"
  es: "Boquim"
  pt: "Boquim"
  de: "Bochim"
  fr: "Bokim"
body:
  en:
    - "Bochim, “weepers”, is the place where the people of Israel wept after the conquest, and it is known only from that story. “And an angel of the LORD came up from Gilgal to Bochim”, reminded Israel that he had brought them out of Egypt and forbidden any league with the people of the land, and announced that because they had not obeyed, those nations would remain as thorns in their sides. “the people lifted up their voice, and wept. And they called the name of that place Bochim: and they sacrificed there unto the LORD.” The scene opens the book of Judges' account of Israel's falling away."
    - "Where it was is not said. The Greek Septuagint reads that the angel came “to the Weeping and to Bethel and to the house of Israel”, and the Synodal Bible follows it; on this reading Bochim was at or near Bethel, where the tribes later wept and sacrificed again before the LORD. Some also connect it with Allon-bachuth, “the oak of weeping”, below Bethel, where Rebekah's nurse Deborah was buried. Both are conjectures from the name and the story; no site or ruin preserves it, and the map places it at Bethel only for that reason."
  ru:
    - "Бохим, «плачущие», — место, где народ Израиля плакал после завоевания, и известно оно только по этому рассказу. «И пришел Ангел Господень из Галгала в Бохим», напомнил Израилю, что вывел его из Египта и запретил вступать в союз с жителями земли, и возвестил, что за непослушание эти народы останутся им петлёю. «народ поднял громкий вопль и заплакал». «От сего и называют то место Бохим. Там принесли они жертву Господу». Этой сценой книга Судей открывает рассказ об отступлении Израиля."
    - "Где оно было, не сказано. Греческая Септуагинта читает, что Ангел пришёл «к Плачу, и к Вефилю, и к дому Израилеву», и Синодальный перевод следует ей: «в Бохим и в Вефиль и к дому Израилеву»; при таком чтении Бохим был в Вефиле или рядом, где колена позже снова плакали и приносили жертвы пред Господом. Иные связывают его и с дубом плача ниже Вефиля, где погребли Девору, кормилицу Ревекки. Обе догадки исходят из имени и рассказа; ни место, ни развалины его не сохранили, и карта помещает его у Вефиля только по этой причине."
  uk:
    - "Бохім, «плакальники», — місце, де народ Ізраїлів плакав після завоювання, і відоме лише з тієї розповіді. «І зʼявивсь ангел Господень із Галгала в Бохим», нагадав Ізраїлеві, що вивів його з Єгипту й заборонив будь-який союз із народом землі, та оголосив, що, оскільки вони не послухалися, ті народи лишаться колючками в їхніх боках. «…почав нарід у голос плакати. … проложено тому врочищові призвіще: Бохим. І жертвували вони там Господеві». Ця сцена відкриває розповідь Книги Суддів про відпадіння Ізраїлю."
    - "Де це було, не сказано. Грецька Септуагінта читає, що ангел прийшов «до Плачу, і до Бет-Ела, і до дому Ізраїлевого», і Синодальна Біблія йде за нею; за цим прочитанням Бохім був у Бет-Елі чи поблизу, де племена згодом знову плакали й жертвували перед Господом. Дехто також пов'язує його з Аллон-Бакутом, «дубом голосїння», під Бет-Елом, де поховано Дебору, мамку Ревеки. Обидва припущення виведено з назви й оповіді; жодне місце чи руїни не зберегли її, і мапа розташовує його в Бет-Елі лише з цієї причини."
  es:
    - "Boquim, «los que lloran», es el lugar donde el pueblo de Israel lloró después de la conquista, y solo se conoce por ese relato. «El ángel de Jehová subió de Gilgal á Bochîm», recordó a Israel que los había sacado de Egipto y les había prohibido toda alianza con los moradores de la tierra, y anunció que, por no haber obedecido, aquellas naciones quedarían como azote para sus costados. «El pueblo lloró en alta voz. Y llamaron por nombre aquel lugar Bochîm: y sacrificaron allí á Jehová.» La escena abre el relato del libro de los Jueces sobre la apostasía de Israel."
    - "No se dice dónde estaba. La Septuaginta griega lee que el ángel subió «al Llanto, a Betel y a la casa de Israel», y la Biblia sinodal la sigue; según esta lectura, Boquim estaba en Betel o cerca de ella, donde las tribus lloraron y sacrificaron de nuevo más tarde ante el Señor. Algunos la relacionan también con Alón-bacut, «la encina del llanto», al pie de Betel, donde fue sepultada Débora, la nodriza de Rebeca. Ambas son conjeturas basadas en el nombre y en el relato; ningún sitio ni ruina lo conserva, y el mapa la sitúa en Betel solo por esa razón."
  pt:
    - "Boquim, “os que choram”, é o lugar onde o povo de Israel chorou depois da conquista, e só é conhecido por essa narrativa. “O anjo do SENHOR subiu de Gilgal a Boquim”, lembrou a Israel que o havia tirado do Egito e proibido qualquer aliança com os habitantes da terra, e anunciou que, por não terem obedecido, aquelas nações continuariam a ser espinhos nos seus flancos. Então “o povo levantou a voz e chorou. Deram àquele lugar o nome de Boquim, e ali sacrificaram ao SENHOR.” A cena abre o relato que o livro de Juízes faz do desvio de Israel."
    - "Onde ficava, não se diz. A Septuaginta grega lê que o anjo subiu ao Choro, a Betel e à casa de Israel, e a Bíblia Sinodal a segue; nessa leitura, Boquim ficava em Betel ou perto dela, onde as tribos mais tarde choraram e sacrificaram de novo diante do SENHOR. Alguns a ligam também a Alom-Bacute, “o carvalho do choro”, abaixo de Betel, onde foi sepultada Débora, a ama de Rebeca. Ambas são conjecturas a partir do nome e da narrativa; nenhum local ou ruína a preserva, e o mapa a situa em Betel somente por essa razão."
  de:
    - "Bochim, „die Weinenden“, ist der Ort, an dem das Volk Israel nach der Eroberung weinte, und er ist nur aus dieser Erzählung bekannt. „Es kam aber der Engel des HERRN herauf von Gilgal gen Bochim“, heißt es; er erinnerte Israel daran, dass er es aus Ägypten geführt hatte und dass jedes Bündnis mit den Bewohnern des Landes verboten war, und kündigte an, dass diese Völker, weil man nicht gehorcht hatte, als Dornen in ihren Seiten bleiben würden. Danach „hob das Volk seine Stimme auf und weinte, und hießen die Stätte Bochim und opferten daselbst dem HERRN“. Die Szene eröffnet im Buch der Richter den Bericht vom Abfall Israels."
    - "Wo es lag, wird nicht gesagt. Die griechische Septuaginta liest, der Engel sei zu den Weinenden und nach Bethel und zum Haus Israel gekommen, und die Synodalbibel folgt ihr; nach dieser Lesart lag Bochim bei oder nahe Bethel, wo die Stämme später erneut weinten und vor dem HERRN opferten. Manche bringen es auch mit Allon-Bachut in Verbindung, der „Klageeiche“ unterhalb von Bethel, wo Rebekkas Amme Debora begraben wurde. Beides sind Vermutungen aus dem Namen und der Erzählung; keine Stätte und keine Ruine bewahrt ihn, und die Karte setzt ihn nur deshalb nach Bethel."
  fr:
    - "Bokim, « les pleureurs », est le lieu où le peuple d’Israël pleura après la conquête, et il n’est connu que par ce récit. « Un envoyé de l’Éternel monta de Guilgal à Bokim » ; il rappela à Israël qu’il l’avait fait sortir d’Égypte et lui avait interdit toute alliance avec les habitants du pays, et annonça que, faute d’obéissance, ces nations resteraient comme des épines dans ses flancs. « Le peuple éleva la voix et pleura. Ils donnèrent à ce lieu le nom de Bokim, et ils y offrirent des sacrifices à l’Éternel. » La scène ouvre, dans le livre des Juges, le récit de la défection d’Israël."
    - "Le texte ne dit pas où il se trouvait. La Septante grecque lit que l’ange vint vers les Pleurs, vers Béthel et vers la maison d’Israël, et la Bible synodale la suit ; selon cette lecture, Bokim était à Béthel ou près de Béthel, où les tribus pleurèrent et sacrifièrent de nouveau devant l’Éternel. Certains le rattachent aussi à Allon-Bacuth, « le chêne des pleurs », au-dessous de Béthel, où fut enterrée Débora, la nourrice de Rebecca. Ce sont deux conjectures tirées du nom et du récit ; aucun site ni aucune ruine ne l’a conservé, et la carte le place à Béthel pour cette seule raison."
