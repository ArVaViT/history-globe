body:
  en:
    - "Meshech is a people of Asia Minor, named in the table of nations as a son of Japheth beside Tubal and Javan, and in the prophets always with Tubal. Most scholars identify it with the Mushki of the Assyrian records. Tiglath-pileser I met twenty thousand Mushki on the upper Tigris about 1115 BC; in the eighth century Sargon II fought “Mita of Mushki”, who is the Midas of Greek legend, king of Phrygia at Gordion on the Sangarius. Herodotus knew the Moschoi, with the Tibareni, as a people of the nineteenth satrapy near the Black Sea, armed with wooden helmets, and Josephus made them the Cappadocians of Mazaca. The name thus moved about Anatolia over the centuries, and the map places it around Gordion."
    - "Ezekiel's lament for Tyre lists “Javan, Tubal, and Meshech” among its merchants, who “traded the persons of men and vessels of brass”, slaves and bronze from the Anatolian highlands. In his vision of the underworld “there is Meshech, Tubal, and all her multitude”, uncircumcised warriors who “caused their terror in the land of the living”. Above all Meshech is the realm of Gog, “the land of Magog, the chief prince of Meshech and Tubal”, whose invasion from the far north God turns back. The Hebrew words rendered “chief prince” can also be read as “prince of Rosh”, which the Greek translators and the Synodal Bible did; the attempt to find Russia in that word is a modern idea that most scholars reject, since Rosh as a place is otherwise unknown and Ezekiel's Gog belongs with the peoples of Anatolia."
    - "The psalmist who sighs, “Woe is me, that I sojourn in Mesech, that I dwell in the tents of Kedar”, names Meshech and the Arabian Kedar together as the ends of the earth, far from Jerusalem. Gordion, the Phrygian capital, was dug by the University of Pennsylvania from 1950; the great tumulus there, long called the tomb of Midas, held a wooden chamber of about 740 BC with the burial of a king. The site, Yassıhöyük near Polatlı in Turkey, was inscribed by UNESCO in 2023."
  ru:
    - "Мешех — народ Малой Азии, названный в таблице народов сыном Иафета рядом с Фувалом и Иаваном, а у пророков всегда вместе с Фувалом. Большинство учёных отождествляют его с мушками ассирийских записей. Тиглатпаласар I встретил двадцать тысяч мушков на верхнем Тигре около 1115 г. до н. э.; в VIII веке Саргон II воевал с «Митой из Мушки» — это Мидас греческих преданий, царь Фригии в Гордионе на Сангарии. Геродот знал мосхов вместе с тибаренами как народ девятнадцатой сатрапии у Чёрного моря, в деревянных шлемах, а Иосиф Флавий считал их каппадокийцами из Мазаки. Имя, таким образом, веками кочевало по Анатолии; на карте оно помещено вокруг Гордиона."
    - "Плач Иезекииля о Тире называет среди его купцов Иавана, Фувала и Мешеха, которые выменивали товары «на души человеческие и медную посуду» — рабов и бронзу с анатолийских нагорий. В его видении преисподней «там Мешех и Фувал со всем множеством своим», необрезанные воины, которые «распространяли ужас на земле живых». Прежде всего Мешех — держава Гога «в земле Магог»: «Гог, князь Роша, Мешеха и Фувала», чьё нашествие с дальнего севера Бог обращает вспять. Еврейские слова, переведённые в Синодальной Библии как «князь Роша» вслед за греческими переводчиками, можно читать и как «верховного князя», как делают многие переводы; попытка увидеть в этом слове Россию — новая идея, которую большинство учёных отвергает: Рош как страна больше нигде не известен, а Гог Иезекииля стоит в ряду народов Анатолии."
    - "Псалмопевец, вздыхающий «горе мне, что я пребываю у Мосоха, живу у шатров Кидарских», называет Мешех и аравийский Кидар вместе как края земли, далёкие от Иерусалима. Гордион, столицу Фригии, с 1950 г. копал Пенсильванский университет; в огромном кургане, который долго звали гробницей Мидаса, нашли деревянную камеру около 740 г. до н. э. с погребением царя. Место, Яссыхююк близ Полатлы в Турции, внесено в список ЮНЕСКО в 2023 г."
  uk:
    - "Мешех — народ Малої Азії, названий у Таблиці народів сином Яфета поряд із Тувалом і Яваном, а у пророків завжди разом із Тувалом. Більшість учених ототожнює його з мушками ассирійських записів. Тіглатпаласар I зустрів двадцять тисяч мушків на верхньому Тигрі близько 1115 р. до н. е.; у VIII ст. Саргон II воював із «Мітою Мушкійським», який є Мідасом грецької легенди, царем Фрігії в Гордіоні на Сангарії. Геродот знав мосхів, разом із тибаренами, як народ дев’ятнадцятої сатрапії біля Чорного моря, озброєний дерев’яними шоломами, а Йосиф Флавій зробив їх каппадокійцями Мазаки. Отже, назва протягом століть пересувалася Анатолією, і мапа розміщує її навколо Гордіона."
    - "Плач Єзекіїля над Тиром називає «Яван, Тубал й Мешех, — се торговцї твої» серед її купців, що «міняли товари твої за душі людські (раби) й мідяний посуд» — рабів і бронзу з анатолійського нагір’я. У його баченні підземного світу «Там лежить Мешех, Тубал із усією громадою своєю» — необрізані воїни, які «завдавали страху всїм на землї живих». Понад усе Мешех — царство Гога, «в Магог-землї, проти князя Рошського, Мешехського й Тубалського», чий напад із далекої півночі Бог відверне. Староєврейські слова можна прочитати як «головний князь» або як «князь Роша»; так читають їх грецькі перекладачі, Синодальний переклад і сам Куліш; спроба знайти Росію в цьому слові — сучасна ідея, яку більшість учених відкидає, бо Рош як місце більше невідомий, а Гог Єзекіїля належить до народів Анатолії."
    - "Псалмоспівець, що зітхає: «Горе менї, що проживаю у Мосоха, перебуваю в шатрах Кедарських!», називає Мешех і арабський Кедар разом як краї землі, далекі від Єрусалима. Гордіон, фрігійську столицю, розкопував Пенсільванський університет від 1950 р.; великий курган там, давно званий гробницею Мідаса, містив дерев’яну камеру близько 740 р. до н. е. з похованням царя. Місце, Ясихююк поблизу Полатли в Туреччині, внесене ЮНЕСКО до списку 2023 р."
  es:
    - "Mesec es un pueblo de Asia Menor, nombrado en la tabla de las naciones como hijo de Jafet junto a Tubal y Javán, y en los profetas siempre con Tubal. La mayoría de los estudiosos lo identifican con los Mushki de los registros asirios. Tiglat-pileser I se enfrentó a veinte mil Mushki en el alto Tigris hacia 1115 a. C.; en el siglo VIII Sargón II combatió a «Mita de Mushki», que es el Midas de la leyenda griega, rey de Frigia en Gordio, a orillas del Sangario. Heródoto conoció a los moscos, con los tibarenos, como un pueblo de la satrapía decimonovena cerca del mar Negro, armado con cascos de madera, y Josefo los hizo los capadocios de Mazaca. El nombre se desplazó así por Anatolia a lo largo de los siglos, y el mapa lo sitúa en torno a Gordio."
    - "El lamento de Ezequiel sobre Tiro enumera «Grecia, Tubal, y Mesec» entre sus mercaderes, que comerciaban «con hombres y con vasos de metal», esclavos y bronce de las tierras altas de Anatolia. En su visión del mundo subterráneo, «Allí Mesech, y Tubal, y toda su multitud», guerreros incircuncisos que «habían dado su terror en la tierra de los vivientes». Sobre todo, Mesec es el reino de Gog, «en tierra de Magog, príncipe de la cabecera de Mesech y Tubal», cuya invasión desde el lejano norte Dios hace volver atrás. Las palabras hebreas traducidas «príncipe de la cabecera» pueden leerse también como «príncipe de Ros», como hicieron los traductores griegos y la Biblia sinodal; el intento de hallar Rusia en esa palabra es una idea moderna que la mayoría de los estudiosos rechaza, pues Ros como lugar es por lo demás desconocido y el Gog de Ezequiel pertenece a los pueblos de Anatolia."
    - "El salmista que suspira: «¡Ay de mí, que peregrino en Mesech, y habito entre las tiendas de Kedar!», nombra juntos a Mesec y al Cedar árabe como los confines de la tierra, lejos de Jerusalén. Gordio, la capital frigia, fue excavada por la Universidad de Pensilvania desde 1950; el gran túmulo de allí, llamado durante mucho tiempo la tumba de Midas, contenía una cámara de madera de hacia 740 a. C. con el entierro de un rey. El sitio, Yassıhöyük, cerca de Polatlı, en Turquía, fue inscrito por la UNESCO en 2023."
  pt:
    - "Meseque é um povo da Ásia Menor, nomeado na tabela das nações como filho de Jafé ao lado de Tubal e Javã, e nos profetas sempre com Tubal. A maioria dos estudiosos o identifica com os Mushki dos registros assírios. Tiglate-Pileser I encontrou vinte mil Mushki no alto Tigre por volta de 1115 a.C.; no século VIII Sargão II combateu “Mita de Mushki”, que é o Midas da lenda grega, rei da Frígia em Górdio, no Sangário. Heródoto conheceu os moscos, com os tibarenos, como povo da décima nona satrapia junto ao mar Negro, armados com capacetes de madeira, e Josefo os fez os capadócios de Mazaca. O nome, assim, deslocou-se pela Anatólia ao longo dos séculos, e o mapa o situa em torno de Górdio."
    - "O lamento de Ezequiel por Tiro lista “Javã, Tubal e Meseque” entre os seus comerciantes, que “trocavam vidas humanas e utensílios de bronze”, escravos e bronze das terras altas da Anatólia. Em sua visão do mundo inferior, “Lá estão Meseque, Tubal e toda a sua multidão”, guerreiros incircuncisos que “causaram o seu terror na terra dos viventes”. Acima de tudo, Meseque é o reino de Gogue, “da terra de Magogue, o príncipe de Rôs, Meseque e Tubal”, cuja invasão do extremo norte Deus faz recuar. As palavras hebraicas que a King James Version traduz por “principal príncipe” podem também ser lidas como “príncipe de Rôs”, como fizeram os tradutores gregos e a Bíblia Sinodal; a tentativa de achar a Rússia nessa palavra é ideia moderna que a maioria dos estudiosos rejeita, pois Rôs como lugar é de outro modo desconhecido e o Gogue de Ezequiel pertence aos povos da Anatólia."
    - "O salmista que suspira: “Ai de mim, que vivo em Meseque, que habito entre as tendas de Quedar!”, nomeia Meseque e a árabe Quedar juntas como os confins da terra, longe de Jerusalém. Górdio, a capital frígia, foi escavada pela Universidade da Pensilvânia desde 1950; o grande túmulo ali, há muito chamado túmulo de Midas, continha uma câmara de madeira de cerca de 740 a.C. com o sepultamento de um rei. O sítio, Yassıhöyük, perto de Polatlı, na Turquia, foi inscrito pela UNESCO em 2023."
  de:
    - "Meschech ist ein Volk Kleinasiens, in der Völkertafel als Sohn Jafets neben Tubal und Jawan genannt und bei den Propheten stets mit Tubal. Die meisten Gelehrten setzen es mit den Muschki der assyrischen Aufzeichnungen gleich. Tiglat-Pileser I. traf um 1115 v. Chr. am oberen Tigris auf zwanzigtausend Muschki; im 8. Jahrhundert kämpfte Sargon II. gegen „Mita von Muschki“, den Midas der griechischen Sage, König von Phrygien in Gordion am Sangarios. Herodot kannte die Moscher mit den Tibarenern als Volk der neunzehnten Satrapie nahe dem Schwarzen Meer, mit hölzernen Helmen bewaffnet, und Josephus machte sie zu den Kappadokiern von Mazaka. Der Name wanderte also im Lauf der Jahrhunderte durch Anatolien, und die Karte setzt ihn um Gordion."
    - "Hesekiels Klage über Tyrus führt „Javan, Thubal und Mesech“ unter den Händlern auf, die „leibeigene Leute und Geräte von Erz auf deine Märkte gebracht“ haben: Sklaven und Bronze aus dem anatolischen Hochland. In seiner Vision der Unterwelt „liegt Mesech und Thubal mit allem ihrem Haufen umher begraben“, unbeschnittene Krieger, „vor denen sich auch die ganze Welt fürchten mußte“. Vor allem aber ist Meschech das Reich Gogs, „der im Lande Magog ist und der oberste Fürst in Mesech und Thubal“, dessen Einfall aus dem Norden Gott abwehrt. Die hebräischen Worte für „oberster Fürst“ lassen sich auch als „Fürst von Rosch“ lesen, wie es die griechischen Übersetzer und die Synodalbibel taten; der Versuch, in diesem Wort Russland zu finden, ist ein moderner Einfall, von den meisten abgelehnt, da Rosch als Ort sonst unbekannt ist und Hesekiels Gog zu den Völkern Anatoliens gehört."
    - "Der Psalmist, der seufzt: „Wehe mir, daß ich ein Fremdling bin unter Mesech; ich muß wohnen unter den Hütten Kedars“, nennt Meschech und das arabische Kedar zusammen als die Enden der Erde, fern von Jerusalem. Gordion, die phrygische Hauptstadt, wird seit 1950 von der University of Pennsylvania ausgegraben; der große Grabhügel dort, lange Grab des Midas genannt, barg eine Holzkammer von etwa 740 v. Chr. mit der Bestattung eines Königs. Der Ort, Yassıhöyük bei Polatlı in der Türkei, wurde 2023 von der UNESCO eingetragen."
  fr:
    - "Méschec est un peuple d’Asie Mineure, nommé dans la table des nations comme fils de Japhet à côté de Tubal et de Javan, et chez les prophètes toujours avec Tubal. La plupart des savants l’identifient aux Mouchki des textes assyriens. Tiglath-Piléser Ier rencontra vingt mille Mouchki sur le haut Tigre vers 1115 av. J.-C. ; au VIIIe siècle, Sargon II combattit « Mita de Mouchki », qui est le Midas de la légende grecque, roi de Phrygie à Gordion sur le Sangarios. Hérodote connaissait les Moschiens, avec les Tibaréniens, comme un peuple de la dix-neuvième satrapie près de la mer Noire, armé de casques de bois, et Flavius Josèphe en fit les Cappadociens de Mazaca. Le nom a donc voyagé en Anatolie au cours des siècles, et la carte le place autour de Gordion."
    - "La complainte d’Ézéchiel sur Tyr cite parmi ses marchands « Javan, Tubal et Méschec », qui donnaient « des esclaves et des ustensiles d’airain », esclaves et bronze des hautes terres d’Anatolie. Dans sa vision du séjour des morts, « là sont Méschec, Tubal, et toute leur multitude », guerriers incirconcis qui « répandaient la terreur dans le pays des vivants ». Surtout, Méschec est le domaine de Gog, « au pays de Magog, vers le prince de Rosch, de Méschec et de Tubal », dont Dieu repousse l’invasion venue de l’extrême nord. Les mots hébreux que la version du roi Jacques rend par « chief prince » peuvent aussi se lire « prince de Rosch », ce que firent les traducteurs grecs et la Bible synodale ; chercher la Russie dans ce mot est une idée moderne que la plupart des savants rejettent, car Rosch comme lieu est autrement inconnu et le Gog d’Ézéchiel appartient aux peuples d’Anatolie."
    - "Le psalmiste qui soupire : « Malheureux que je suis de séjourner à Méschec, d’habiter parmi les tentes de Kédar ! » nomme ensemble Méschec et le Kédar arabe comme les bouts de la terre, loin de Jérusalem. Gordion, la capitale phrygienne, est fouillée par l’Université de Pennsylvanie depuis 1950 ; le grand tumulus, longtemps appelé tombe de Midas, abritait une chambre de bois d’environ 740 av. J.-C. avec la sépulture d’un roi. Le site, Yassıhöyük près de Polatlı, en Turquie, a été inscrit par l’UNESCO en 2023."
  it:
    - "Mesec è un popolo dell’Asia Minore, nominato nella tavola delle nazioni come figlio di Iafet accanto a Tubal e Iavan, e nei profeti sempre con Tubal. La maggior parte degli studiosi lo identifica con i Mushki dei documenti assiri. Tiglat-Pilèser I incontrò ventimila Mushki sull’alto Tigri verso il 1115 a.C.; nell’VIII secolo Sargon II combatté «Mita di Mushki», che è il Mida della leggenda greca, re di Frigia a Gordio sul Sangario. Erodoto conosceva i Moschi, con i Tibareni, come un popolo della diciannovesima satrapia presso il Mar Nero, armato di elmi di legno, e Giuseppe Flavio ne fece i Cappadoci di Mazaca. Il nome si spostò dunque nell’Anatolia nel corso dei secoli, e la mappa lo colloca intorno a Gordio."
    - "Il lamento di Ezechiele su Tiro elenca «Javan, Tubal e Mescec» tra i suoi mercanti, che «dànno anime umane e utensili di rame», schiavi e bronzo dagli altopiani anatolici. Nella sua visione degli inferi «Là è Mescec, Tubal e tutta la loro moltitudine», guerrieri incirconcisi che «spandevano il terrore sulla terra de’ viventi». Soprattutto Mesec è il regno di Gog, «Gog del paese di Magog, principe sovrano di Mescec e di Tubal», la cui invasione dall’estremo nord Dio respinge. Le parole ebraiche rese «principe sovrano» possono essere lette anche «principe di Rosh», come fecero i traduttori greci e la Bibbia sinodale; il tentativo di trovare la Russia in quella parola è un’idea moderna che la maggior parte degli studiosi respinge, poiché Rosh come luogo è altrimenti ignoto e il Gog di Ezechiele appartiene ai popoli dell’Anatolia."
    - "Il salmista che sospira: «Misero me che soggiorno in Mesec, e dimoro fra le tende di Kedar!» nomina insieme Mesec e il Kedar arabo come i confini della terra, lontano da Gerusalemme. Gordio, la capitale frigia, è stata scavata dall’Università della Pennsylvania dal 1950; il grande tumulo là, a lungo detto la tomba di Mida, conteneva una camera di legno del 740 a.C. circa con la sepoltura di un re. Il sito, Yassıhöyük presso Polatlı in Turchia, è stato iscritto dall’UNESCO nel 2023."
  pl:
    - "Meszek to lud Azji Mniejszej, wymieniony w tablicy narodów jako syn Jafeta obok Tubala i Jawana, a u proroków zawsze z Tubalem. Większość uczonych utożsamia go z Muszki z zapisów asyryjskich. Tiglat-Pileser I spotkał dwadzieścia tysięcy Muszki nad górnym Tygrysem około 1115 r. p.n.e.; w VIII w. Sargon II walczył z „Mitą z Muszki”, czyli Midasem z greckiej legendy, królem Frygii w Gordion nad Sangariosem. Herodot znał Moschów, razem z Tibarenami, jako lud dziewiętnastej satrapii nad Morzem Czarnym, uzbrojony w drewniane hełmy, a Józef Flawiusz uczynił z nich Kapadocjan z Mazaki. Nazwa wędrowała więc po Anatolii przez stulecia, a mapa umieszcza ją wokół Gordion."
    - "Lament Ezechiela nad Tyrem wymienia „Jawan, Tubal, i Mesech” wśród jego kupców, którzy „ludzi i naczynie miedziane dawali na zamianę tobie”, czyli niewolników i brąz z anatolijskich wyżyn. W jego widzeniu krainy umarłych „Tam Mesech, Tubal i wszystka zgraja jego”, nieobrzezani wojownicy, którzy „choć puszczali strach swój w ziemi żyjących”. Przede wszystkim Meszek jest państwem Goga, „w ziemi Magog, książęciu głównemu w Mesech i Tubal”, którego najazd z dalekiej północy Bóg odpiera. Hebrajskie słowa oddawane jako „książę główny” można też czytać jako „książę Rosz”, co uczynili greccy tłumacze i Biblia synodalna; próba znalezienia Rosji w tym słowie to pomysł nowożytny, który większość uczonych odrzuca, bo Rosz jako miejsce jest poza tym nieznane, a Gog Ezechiela należy do ludów Anatolii."
    - "Psalmista, który wzdycha: „Niestetyż mnie, żem tak długo gościem w Mesech, a mieszkam w namiotach Kedarskich”, wymienia Meszek i arabskiego Kedara razem jako krańce ziemi, daleko od Jerozolimy. Gordion, frygijską stolicę, wykopywał od 1950 r. Uniwersytet Pensylwanii; wielki tumulus, od dawna zwany grobem Midasa, krył drewnianą komorę z około 740 r. p.n.e. z pochówkiem króla. Stanowisko, Yassıhöyük koło Polatlı w Turcji, zostało wpisane przez UNESCO w 2023 r."
  nl:
    - "Mesech is een volk van Klein-Azië, in de volkerentafel genoemd als een zoon van Jafet naast Tubal en Javan, en bij de profeten steeds met Tubal. De meeste geleerden identificeren het met de Mushki van de Assyrische bronnen. Tiglat-Pileser I trof omstreeks 1115 v.Chr. twintigduizend Mushki aan de bovenloop van de Tigris; in de achtste eeuw streed Sargon II tegen “Mita van Mushki”, de Midas van de Griekse legende, koning van Frygië te Gordion aan de Sangarios. Herodotus kende de Moschoi, met de Tibareni, als een volk van de negentiende satrapie bij de Zwarte Zee, bewapend met houten helmen, en Josephus maakte hen tot de Cappadociërs van Mazaca. De naam verplaatste zich dus in de loop der eeuwen door Anatolië, en de kaart plaatst hem rond Gordion."
    - "Ezechiëls klaaglied over Tyrus: “Javan, Tubal en Mesech waren uw kooplieden; met mensenzielen en koperen vaten dreven zij onderlingen handel met u”, slaven en brons uit het Anatolische hoogland. In zijn visioen van de onderwereld: “Daar is Mesech, en Tubal, met haar ganse menigte”, onbesneden krijgers die “hun schrik gegeven hebben in het land der levenden”. Bovenal is Mesech het rijk van Gog, “het land van Magog, den hoofdvorst van Mesech en Tubal”, wiens inval uit het verre noorden God terugdrijft. De Hebreeuwse woorden die als “hoofdvorst” zijn vertaald, kunnen ook gelezen worden als “vorst van Rosj”, wat de Griekse vertalers en de Synodale Bijbel deden; de poging om Rusland in dat woord te vinden is een moderne gedachte die de meeste geleerden verwerpen, omdat Rosj als plaats verder onbekend is en Ezechiëls Gog bij de volken van Anatolië hoort."
    - "De psalmist die zucht: “O, wee mij, dat ik een vreemdeling ben in Mesech, dat ik in de tenten Kedars wone”, noemt Mesech en het Arabische Kedar samen als de einden van de aarde, ver van Jeruzalem. Gordion, de Frygische hoofdstad, werd vanaf 1950 door de Universiteit van Pennsylvania opgegraven; de grote tumulus daar, lang het graf van Midas genoemd, bevatte een houten kamer van omstreeks 740 v.Chr. met de begrafenis van een koning. De plaats, Yassıhöyük bij Polatlı in Turkije, werd in 2023 door UNESCO op de werelderfgoedlijst geplaatst."
  cs:
    - "Mešek je národ Malé Asie, jmenovaný v tabulce národů jako syn Jafetův vedle Túbala a Javana a u proroků vždy s Túbalem. Většina badatelů jej ztotožňuje s Mušky asyrských záznamů. Tiglatpilesar I. se asi roku 1115 př. n. l. setkal na horním Tigridu s dvaceti tisíci Mušků; v 8. století bojoval Sargon II. s „Mitou z Mušku“, jímž je řecký pověstný Midas, král Frygie v Gordiu na Sangariu. Hérodotos znal Moschy s Tibareny jako národ devatenácté satrapie u Černého moře, vyzbrojený dřevěnými přilbami, a Josephus z nich učinil Kappadočany z Mazaky. Jméno se tedy v Anatolii během staletí přesouvalo a mapa je klade kolem Gordia."
    - "Ezechielův nářek nad Týrem uvádí mezi jeho kupci „Javan, Tubal a Mešech“, kteří „lidi a nádobí měděné dávali za směnu tobě“, otroky a bronz z anatolské vysočiny. V jeho vidění podsvětí „Tam Mešech, Tubal i všecko množství jeho“, neobřezaní bojovníci, kteří „pouštívali strach svůj v zemi živých“. Především je Mešek říší Gogovou: „proti Gogovi, země Magog, knížeti a hlavě v Mešech a Tubal“, jehož vpád z dalekého severu Bůh odvrací. Hebrejská slova překládaná „kníže a hlava“ lze číst také „kníže Rošu“, jak čtou řečtí překladatelé a synodální Bible; pokus nalézt v tom slově Rusko je novověký nápad, který většina badatelů odmítá, protože Roš jako místo je jinak neznámé a Ezechielův Gog patří k národům Anatolie."
    - "Žalmista, který vzdychá: „Běda mně, že pohostinu býti musím v Mešech, a přebývati v saláších Cedarských“, jmenuje Mešek a arabský Kedar spolu jako konce země, daleko od Jeruzaléma. Gordion, frygické hlavní město, vykopávala Pensylvánská univerzita od roku 1950; velká mohyla tam, dlouho zvaná hrob Midasův, ukrývala dřevěnou komoru z asi roku 740 př. n. l. s pohřbem krále. Místo, Yassıhöyük u Polatlı v Turecku, bylo zapsáno UNESCO roku 2023."
  sv:
    - "Meshek är ett folk i Mindre Asien, nämnt i folkens tavla som en son till Jafet bredvid Tubal och Javan, och hos profeterna alltid med Tubal. De flesta forskare identifierar det med assyriska källors Mushki. Tiglat-Pileser I mötte tjugo tusen Mushki vid övre Tigris omkring 1115 f.Kr.; på 700-talet bekämpade Sargon II ”Mita av Mushki”, som är Midas i den grekiska legenden, kung av Frygien i Gordion vid Sangarios. Herodotos kände moscherna, med tibarenerna, som ett folk i den nittonde satrapin nära Svarta havet, beväpnade med trähjälmar, och Josefus gjorde dem till kappadokierna i Mazaka. Namnet vandrade alltså omkring i Anatolien under århundradena, och kartan placerar det kring Gordion."
    - "Hesekiels klagosång över Tyros förtecknar ”Javan, Tubal och Mesek” bland dess köpmän, som ”drevo köpenskap med dig; trälar och kopparkärl gåvo de dig i utbyte”, slavar och brons från Anatoliens högland. I hans syn av dödsriket ”Där ligger Mesek-Tubal med hela sin larmande hop”, oomskurna krigare som ”utbredde skräck omkring sig i de levandes land”. Framför allt är Meshek Gogs rike, ”Gog i Magogs land, mot hövdingen över Ros, Mesek och Tubal”, vars infall från den yttersta norden Gud slår tillbaka. De hebreiska orden för ”överste furste” kan också läsas ”furste av Rosh”, vilket de grekiska översättarna och Synodalbibeln gjorde; försöket att finna Ryssland i det ordet är en modern idé som de flesta forskare avvisar, eftersom Rosh som plats annars är okänd och Hesekiels Gog hör hemma bland Anatoliens folk."
    - "Psalmisten som suckar: ”Ve mig, att jag måste dväljas i Meseks land och bo ibland Kedars hyddor!” nämner Meshek och det arabiska Kedar tillsammans som jordens ändar, långt från Jerusalem. Gordion, den frygiska huvudstaden, grävdes ut av University of Pennsylvania från 1950; den stora gravhögen där, länge kallad Midas grav, rymde en träkammare från omkring 740 f.Kr. med en kungs gravläggning. Platsen, Yassıhöyük nära Polatlı i Turkiet, skrevs in av Unesco 2023."
  nb:
    - "Mesjek er et folk i Lilleasia, nevnt i folketavlen som en sønn av Jafet ved siden av Tubal og Javan, og hos profetene alltid sammen med Tubal. De fleste forskere identifiserer det med Mushki i de assyriske opptegnelsene. Tiglat-Pileser I møtte tjue tusen Mushki ved øvre Tigris omkring 1115 f.Kr.; på 700-tallet f.Kr. kjempet Sargon II mot «Mita av Mushki», som er Midas i den greske legenden, konge av Frygia i Gordion ved Sangarios. Herodot kjente moschoi, sammen med tibarenerne, som et folk i den nittende satrapien ved Svartehavet, bevæpnet med trehjelmer, og Josefus gjorde dem til kappadokerne i Mazaca. Navnet flyttet seg altså rundt i Anatolia gjennom århundrene, og kartet plasserer det omkring Gordion."
    - "Esekiels klagesang over Tyros oppfører «Javan, Tubal og Mesek» blant dens kremmere, som betalte «med mennesker og kobberkar», slaver og bronse fra det anatoliske høylandet. I hans syn om dødsriket «er Mesek-Tubal og hele hans larmende hop», uomskårne krigere som «hadde utbredt redsel for sig i de levendes land». Fremfor alt er Mesjek riket til Gog, «Gog i Magogs land, fyrsten over Ros, Mesek og Tubal», hvis innfall fra det fjerne nord Gud vender tilbake. De hebraiske ordene som King James-oversettelsen gjengir «øverste fyrste», kan også leses «fyrste over Rosj», slik de greske oversetterne og synodalbibelen gjorde; forsøket på å finne Russland i dette ordet er en moderne idé som de fleste forskere avviser, siden Rosj som stedsnavn ellers er ukjent og Esekiels Gog hører sammen med folkene i Anatolia."
    - "Salmisten som sukker: «Ve mig, at jeg lever som fremmed iblandt Mesek, at jeg bor ved Kedars telt!», nevner Mesjek og det arabiske Kedar sammen som jordens ender, langt fra Jerusalem. Gordion, den frygiske hovedstaden, ble gravd ut av University of Pennsylvania fra 1950; den store gravhaugen der, lenge kalt Midas' grav, rommet et trekammer fra omkring 740 f.Kr. med en konges gravlegging. Stedet, Yassıhöyük nær Polatlı i Tyrkia, ble oppført på UNESCOs verdensarvliste i 2023."
  tl:
    - "Ang Mesech ay bayan ng Asia Minor, na pinangalanan sa talaan ng mga bansa bilang anak ni Japhet kasama ng Tubal at Javan, at sa mga propeta ay laging kasama ng Tubal. Karamihan ng iskolar ay kumikilala rito sa Mushki ng mga talaang Asirio. Nakaharap ni Tiglath-pileser I ang dalawampung libong Mushki sa itaas na Tigris mga 1115 BK; noong ika-8 siglo, nakipaglaban si Sargon II kay “Mita ng Mushki”, na siyang Midas ng alamat na Griyego, hari ng Frigia sa Gordion sa Sangarius. Kilala ni Herodotus ang mga Moschoi, kasama ng mga Tibareni, bilang bayan ng ika-19 na satrapiya malapit sa Dagat Itim, na may sandatang helmet na kahoy, at ginawa silang mga Capadocio ng Mazaca ni Josefo. Kaya't lumipat-lipat sa Anatolia ang pangalan sa paglipas ng mga siglo, at inilalagay ito ng mapa sa palibot ng Gordion."
    - "Itinatala ng panaghoy ni Ezekiel sa Tiro ang “ang Javan, ang Tubal, at ang Mesec” sa mga mangangalakal nito, na “kinakalakal ang mga tao at ang mga sisidlang tanso”, alipin at tanso mula sa kabundukan ng Anatolia. Sa pangitain niya sa daigdig ng patay, “Nandoon ang Mesech, ang Tubal, at ang buo niyang karamihan”, mga mandirigmang di-tuli na “nakapagpangilabot sa lupain ng buhay”. Higit sa lahat, ang Mesech ang kaharian ni Gog, “sa lupain ng Magog, na prinsipe sa Ros, sa Mesech, at sa Tubal”, na pinaaatras ng Diyos sa paglusob mula sa malayong hilaga. Ang Hebreong isinaling “chief prince” ay mababasa ring “prinsipe ng Ros”, gaya ng mga tagasalin sa Griyego at ng Synodal Bible; makabagong ideya ang paghahanap sa Rusya rito, na tinatanggihan ng karamihan ng iskolar dahil di-kilala ang Ros bilang lugar at kabilang ang Gog ni Ezekiel sa mga bayan ng Anatolia."
    - "Ang mang-aawit na dumaraing, “Sa aba ko, na nakikipamayan sa Mesech, na tumatahan ako sa mga tolda sa Kedar!”, ay pinangangalanan ang Mesech at ang Arabeng Kedar nang magkasama bilang mga dulo ng daigdig, malayo sa Jerusalem. Ang Gordion, kabisera ng Frigia, ay hinukay ng University of Pennsylvania mula 1950; ang malaking tumulus doon, na matagal nang tinatawag na libingan ni Midas, ay may silid na kahoy mga 740 BK na may libing ng isang hari. Ang pook, ang Yassıhöyük malapit sa Polatlı sa Turkey, ay isinama ng UNESCO sa talaan noong 2023."
