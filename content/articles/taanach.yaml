body:
  en:
    - "Taanach was a Canaanite city on the southern edge of the Jezreel valley, 8 km south-east of Megiddo, where the road from the coast climbs into the hills of Samaria. The mound, Tell Ti'innik, with a Palestinian village of the same name at its foot, keeps the name. Thutmose III, marching on Megiddo in the fifteenth century BC, considered the road by Taanach before choosing the pass of Aruna; about a dozen cuneiform tablets of that century found on the mound, letters and lists in Akkadian, are among the oldest archives dug up in the land."
    - "Joshua counts “the king of Taanach” among the defeated, yet the city stayed Canaanite: Manasseh received it with Megiddo, Beth-shean, Dor and Ibleam, “but the Canaanites would dwell in that land”. The Song of Deborah sets the battle with Sisera here: “then fought the kings of Canaan in Taanach by the waters of Megiddo; they took no gain of money”. It became a Levitical city, and under Solomon Baana the son of Ahilud governed “Taanach and Megiddo” together. Pharaoh Shoshenq I (the biblical Shishak) lists Taanach among the towns he took about 925 BC, and the excavators linked a destruction of the tenth-century town with his campaign."
    - "The Austrian scholar Ernst Sellin dug the mound in 1902–1904 and found the tablets; Paul Lapp returned in 1963–1968 and uncovered, in a tenth-century context, the painted terracotta cult stand with lions, sphinxes, a tree between goats and a sun disc above a horse, now in the Israel Museum. Eusebius knew Taanach as a large village three miles from Legio. The village of Ti'innik lies in the Jenin governorate of the West Bank, close to the Green Line."
  ru:
    - "Фаанах был ханаанским городом на южной кромке Изреельской долины, в 8 км к юго-востоку от Мегиддо, там, где дорога с побережья поднимается в холмы Самарии. Холм Телль-Тианник с палестинской деревней того же имени у подножия хранит название. Тутмос III, идя на Мегиддо в XV веке до н. э., рассматривал дорогу через Фаанах, прежде чем выбрать проход Аруна; около дюжины клинописных табличек того века, найденных на холме, — письма и списки по-аккадски — один из древнейших архивов, раскопанных в этой земле."
    - "В списке побеждённых у Иисуса Навина стоит «один царь Фаанаха», но город остался ханаанским: Манассия получил его с Мегиддо, Беф-Саном, Дором и Ивлеамом, «и остались Хананеи жить в земле сей». Песнь Деворы помещает сюда битву с Сисарой: «тогда сразились цари Ханаанские в Фанаахе у вод Мегиддонских, но не получили нимало серебра». Он стал левитским городом, а при Соломоне Ваана, сын Ахилуда, управлял вместе «в Фаанахе и Мегиддо». Фараон Шешонк I (библейский Сусаким) перечисляет Фаанах среди городов, взятых им около 925 г. до н. э., и раскопщики связали с его походом разрушение города X века."
    - "Австрийский учёный Эрнст Зеллин копал холм в 1902–1904 годах и нашёл таблички; Пол Лапп вернулся сюда в 1963–1968 годах и нашёл в слое X века расписную глиняную культовую подставку со львами, сфинксами, деревом между козлами и солнечным диском над конём, ныне в Музее Израиля. Евсевий знал Фаанах как большое селение в трёх милях от Легиона. Деревня Тианник лежит в провинции Дженин на Западном берегу, близ «зелёной линии»."
  uk:
    - "Таанах був ханаанським містом на південному краю долини Їзреель, за 8 км на південний схід від Мегіддо, де дорога від узбережжя здіймається в пагорби Самарії. Назву зберігає пагорб Телль-Тіннік з палестинським селом того ж імені біля підніжжя. Тутмос III, рушаючи на Мегіддо в XV ст. до н. е., розглядав дорогу через Таанах, перш ніж обрав прохід Аруна; близько десятка клинописних табличок того століття, знайдених на пагорбі, — листи й переліки аккадською мовою — належать до найдавніших архівів, відкопаних у цій землі."
    - "Серед переможених Ісус Навин перелічує: «Царь Таанахський», проте місто лишилося ханаанським: Манасія дістала його разом з Мегіддо, Бет-Шеаном, Дором та Івлеамом, «так вдалось Канаанїям задержатись у сїй країнї». Пісня Дебори змальовує тут битву із Сісарою: «Повиходили до бою царі, царі Канаанські в Танаах у вод Мегидонських, та не здобули анї трохи срібла». Він став левітським містом, а за Соломона Ваана, син Ахілуда, керував «Таанах і Мегіддо» разом. Фараон Шешонк I (біблійний Сусакім) вносить Таанах до переліку міст, які він узяв близько 925 р. до н. е., і розкопувачі пов’язали руйнування міста X ст. до н. е. з його походом."
    - "Австрійський учений Ернст Селлін копав пагорб у 1902–1904 роках і знайшов таблички; Пол Лапп повернувся в 1963–1968 роках і відкрив у контексті X ст. до н. е. розписану теракотову культову підставку зі львами, сфінксами, деревом між козами та сонячним диском над конем, нині в Музеї Ізраїлю. Євсевій знав Таанах як велике село за три милі від Легіону. Село Тіннік лежить у провінції Дженін на Західному березі, поблизу Зеленої лінії."
  es:
    - "Taanac era una ciudad cananea en el borde sur del valle de Jezreel, a 8 km al sureste de Meguido, donde el camino de la costa sube a las colinas de Samaria. El montículo, Tell Ti'innik, con una aldea palestina del mismo nombre a sus pies, conserva el nombre. Tutmosis III, al marchar sobre Meguido en el siglo XV a. C., consideró el camino por Taanac antes de elegir el paso de Aruna; unas doce tablillas cuneiformes de ese siglo halladas en el montículo, cartas y listas en acadio, están entre los archivos más antiguos desenterrados en el país."
    - "Josué cuenta «el rey de Taanach» entre los derrotados, pero la ciudad siguió siendo cananea: Manasés la recibió con Meguido, Bet-seán, Dor e Ibleam, «mas el Cananeo quiso habitar en esta tierra». El Cántico de Débora sitúa aquí la batalla con Sísara: «entonces pelearon los reyes de Canaán en Taanac, junto á las aguas de Megiddo, mas no llevaron ganancia alguna de dinero». Llegó a ser ciudad levítica, y bajo Salomón Baana hijo de Ahilud gobernó juntas «Taanach y Megiddo». El faraón Sheshonq I (el Sisac bíblico) enumera Taanac entre las ciudades que tomó hacia 925 a. C., y los excavadores vincularon con su campaña una destrucción de la ciudad del siglo X a. C."
    - "El estudioso austriaco Ernst Sellin excavó el montículo en 1902–1904 y halló las tablillas; Paul Lapp volvió en 1963–1968 y sacó a la luz, en un contexto del siglo X a. C., el soporte de culto de terracota pintada con leones, esfinges, un árbol entre cabras y un disco solar sobre un caballo, hoy en el Museo de Israel. Eusebio conocía Taanac como una gran aldea a tres millas de Legio. La aldea de Ti'innik se encuentra en la gobernación de Yenín, en Cisjordania, cerca de la Línea Verde."
  pt:
    - "Taanaque era uma cidade cananeia na margem sul do vale de Jezreel, 8 km a sudeste de Megido, onde a estrada da costa sobe para as colinas de Samaria. O monte, Tell Ti'innik, com uma aldeia palestina de mesmo nome ao pé, conserva o nome. Tutmés III, ao marchar sobre Megido no século XV a.C., considerou o caminho por Taanaque antes de escolher a passagem de Aruna; cerca de uma dúzia de tabuinhas cuneiformes daquele século achadas no monte, cartas e listas em acádio, estão entre os arquivos mais antigos desenterrados na região."
    - "Josué conta “o rei de Taanaque” entre os derrotados, mas a cidade continuou cananeia: Manassés a recebeu com Megido, Bete-Seã, Dor e Ibleão, “mas os cananeus persistiram em habitar naquela terra”. O Cântico de Débora situa aqui a batalha com Sísera: “então os reis de Canaã lutaram em Taanaque, junto às águas de Megido. Não levaram nenhum despojo de prata”. Tornou-se cidade levítica e, sob Salomão, Baaná, filho de Ailude, governava juntos “Taanaque e Megido”. O faraó Sheshonq I (o Sisaque bíblico) lista Taanaque entre as cidades que tomou por volta de 925 a.C., e os escavadores ligaram uma destruição da cidade do século X a.C. à sua campanha."
    - "O estudioso austríaco Ernst Sellin escavou o monte em 1902–1904 e achou as tabuinhas; Paul Lapp voltou em 1963–1968 e descobriu, em contexto do século X a.C., o suporte cultual de terracota pintada com leões, esfinges, uma árvore entre cabras e um disco solar sobre um cavalo, hoje no Museu de Israel. Eusébio conhecia Taanaque como uma grande aldeia a três milhas de Legio. A aldeia de Ti'innik fica na província de Jenin, na Cisjordânia, perto da Linha Verde."
  de:
    - "Taanach war eine kanaanäische Stadt am Südrand der Jesreel-Ebene, 8 km südöstlich von Megiddo, wo die Straße von der Küste in die Hügel Samarias ansteigt. Der Hügel, Tell Ti'innik, bewahrt den Namen, mit einem palästinensischen Dorf gleichen Namens an seinem Fuß. Thutmosis III. erwog auf dem Marsch gegen Megiddo im fünfzehnten Jahrhundert v. Chr. den Weg über Taanach, ehe er den Aruna-Pass wählte; etwa ein Dutzend Keilschrifttafeln jenes Jahrhunderts, Briefe und Listen auf Akkadisch, die auf dem Hügel gefunden wurden, gehören zu den ältesten im Land ausgegrabenen Archiven."
    - "Unter den Besiegten, die Josua aufzählt, ist „der König zu Thaanach“, doch blieb die Stadt kanaanäisch: Manasse erhielt sie mit Megiddo, Bet-Schean, Dor und Jibleam, „und die Kanaaniter blieben wohnen im Land“. Das Debora-Lied verlegt die Schlacht mit Sisera hierher: „da stritten die Könige der Kanaaniter zu Thaanach am Wasser Megiddos; aber sie brachten keinen Gewinn davon“. Sie wurde Levitenstadt, und unter Salomo verwaltete „Baana, der Sohn Ahiluds, zu Thaanach und zu Megiddo“ beide zusammen. Pharao Schoschenk I. (der biblische Schischak) zählt Taanach unter den Städten auf, die er um 925 v. Chr. einnahm, und die Ausgräber brachten eine Zerstörung der Stadt des zehnten Jahrhunderts mit seinem Feldzug in Verbindung."
    - "Der österreichische Gelehrte Ernst Sellin grub den Hügel 1902–1904 aus und fand die Tafeln; Paul Lapp kehrte 1963–1968 zurück und legte, in einem Zusammenhang des zehnten Jahrhunderts, den bemalten Terrakotta-Kultständer mit Löwen, Sphingen, einem Baum zwischen Ziegenböcken und einer Sonnenscheibe über einem Pferd frei, der heute im Israel-Museum steht. Eusebius kannte Taanach als großes Dorf drei Meilen von Legio. Das Dorf Ti'innik liegt im Gouvernement Dschenin des Westjordanlands, nahe der Grünen Linie."
  fr:
    - "Thaanac était une ville cananéenne au bord sud de la vallée de Jizreel, à 8 km au sud-est de Meguiddo, là où la route de la côte monte vers les collines de Samarie. Le tertre, Tell Ti’innik, avec au pied un village palestinien du même nom, en garde le nom. Thoutmosis III, marchant sur Meguiddo au XVe siècle av. J.-C., envisagea la route par Thaanac avant de choisir le défilé d’Aruna ; une douzaine de tablettes cunéiformes de ce siècle trouvées sur le tertre, lettres et listes en akkadien, comptent parmi les plus anciennes archives mises au jour dans le pays."
    - "Josué compte « le roi de Taanac » parmi les vaincus, mais la ville resta cananéenne : Manassé la reçut avec Meguiddo, Beth-Schean, Dor et Jibleam, « et les Cananéens voulurent rester dans ce pays ». Le cantique de Débora y situe la bataille contre Sisera : « Alors combattirent les rois de Canaan, à Thaanac, aux eaux de Meguiddo ; ils ne remportèrent nul butin, nul argent ». Elle devint ville lévitique, et sous Salomon Baana, fils d’Achilud, gouvernait ensemble « Thaanac et Meguiddo ». Le pharaon Sheshonq Ier (le Schischak biblique) range Thaanac parmi les villes qu’il prit vers 925 av. J.-C., et les fouilleurs ont relié une destruction de la ville du Xe siècle à sa campagne."
    - "L’Autrichien Ernst Sellin fouilla le tertre en 1902-1904 et trouva les tablettes ; Paul Lapp y revint en 1963-1968 et dégagea, dans un contexte du Xe siècle, le support de culte en terre cuite peinte orné de lions, de sphinx, d’un arbre entre des chèvres et d’un disque solaire au-dessus d’un cheval, aujourd’hui au Musée d’Israël. Eusèbe connaissait Thaanac comme un grand village à trois milles de Legio. Le village de Ti’innik se trouve dans le gouvernorat de Jénine, en Cisjordanie, près de la Ligne verte."
