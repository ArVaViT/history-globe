body:
  en:
    - "Taanach was a Canaanite city on the southern edge of the Jezreel valley, 8 km south-east of Megiddo, where the road from the coast climbs into the hills of Samaria. The mound, Tell Ti'innik, with a Palestinian village of the same name at its foot, keeps the name. Thutmose III, marching on Megiddo in the fifteenth century BC, considered the road by Taanach before choosing the pass of Aruna; about a dozen cuneiform tablets of that century found on the mound, letters and lists in Akkadian, are among the oldest archives dug up in the land."
    - "Joshua counts “the king of Taanach” among the defeated, yet the city stayed Canaanite: Manasseh received it with Megiddo, Beth-shean, Dor and Ibleam, “but the Canaanites would dwell in that land”. The Song of Deborah sets the battle with Sisera here: “then fought the kings of Canaan in Taanach by the waters of Megiddo; they took no gain of money”. It became a Levitical city, and under Solomon Baana the son of Ahilud governed “Taanach and Megiddo” together. Pharaoh Shoshenq I (the biblical Shishak) lists Taanach among the towns he took about 925 BC, and the excavators linked a destruction of the tenth-century town with his campaign."
    - "Ernst Sellin, a German scholar then teaching in Vienna, dug the mound in 1902–1904 and found the tablets; Paul Lapp returned in 1963–1968 and uncovered, in a tenth-century context, the painted terracotta cult stand with lions, sphinxes, a tree between goats and a sun disc above a horse, now in the Israel Museum. Eusebius knew Taanach as a large village three miles from Legio. The village of Ti'innik lies in the Jenin governorate of the West Bank, close to the Green Line."
  ru:
    - "Фаанах был ханаанским городом на южной кромке Изреельской долины, в 8 км к юго-востоку от Мегиддо, там, где дорога с побережья поднимается в холмы Самарии. Холм Телль-Тианник с палестинской деревней того же имени у подножия хранит название. Тутмос III, идя на Мегиддо в XV веке до н. э., рассматривал дорогу через Фаанах, прежде чем выбрать проход Аруна; около дюжины клинописных табличек того века, найденных на холме, — письма и списки по-аккадски — один из древнейших архивов, раскопанных в этой земле."
    - "В списке побеждённых у Иисуса Навина стоит «один царь Фаанаха», но город остался ханаанским: Манассия получил его с Мегиддо, Беф-Саном, Дором и Ивлеамом, «и остались Хананеи жить в земле сей». Песнь Деворы помещает сюда битву с Сисарой: «тогда сразились цари Ханаанские в Фанаахе у вод Мегиддонских, но не получили нимало серебра». Он стал левитским городом, а при Соломоне Ваана, сын Ахилуда, управлял вместе «в Фаанахе и Мегиддо». Фараон Шешонк I (библейский Сусаким) перечисляет Фаанах среди городов, взятых им около 925 г. до н. э., и раскопщики связали с его походом разрушение города X века."
    - "Эрнст Зеллин, немецкий учёный, преподававший тогда в Вене, копал холм в 1902–1904 годах и нашёл таблички; Пол Лапп вернулся сюда в 1963–1968 годах и нашёл в слое X века расписную глиняную культовую подставку со львами, сфинксами, деревом между козлами и солнечным диском над конём, ныне в Музее Израиля. Евсевий знал Фаанах как большое селение в трёх милях от Легиона. Деревня Тианник лежит в провинции Дженин на Западном берегу, близ «зелёной линии»."
  uk:
    - "Таанах був ханаанським містом на південному краю долини Їзреель, за 8 км на південний схід від Мегіддо, де дорога від узбережжя здіймається в пагорби Самарії. Назву зберігає пагорб Телль-Тіннік з палестинським селом того ж імені біля підніжжя. Тутмос III, рушаючи на Мегіддо в XV ст. до н. е., розглядав дорогу через Таанах, перш ніж обрав прохід Аруна; близько десятка клинописних табличок того століття, знайдених на пагорбі, — листи й переліки аккадською мовою — належать до найдавніших архівів, відкопаних у цій землі."
    - "Серед переможених Ісус Навин перелічує: «Царь Таанахський», проте місто лишилося ханаанським: Манасія дістала його разом з Мегіддо, Бет-Шеаном, Дором та Івлеамом, «так вдалось Канаанїям задержатись у сїй країнї». Пісня Дебори змальовує тут битву із Сісарою: «Повиходили до бою царі, царі Канаанські в Танаах у вод Мегидонських, та не здобули анї трохи срібла». Він став левітським містом, а за Соломона Ваана, син Ахілуда, керував «Таанах і Мегіддо» разом. Фараон Шешонк I (біблійний Сусакім) вносить Таанах до переліку міст, які він узяв близько 925 р. до н. е., і розкопувачі пов’язали руйнування міста X ст. до н. е. з його походом."
    - "Ернст Селлін, німецький учений, який тоді викладав у Відні, копав пагорб у 1902–1904 роках і знайшов таблички; Пол Лапп повернувся в 1963–1968 роках і відкрив у контексті X ст. до н. е. розписану теракотову культову підставку зі львами, сфінксами, деревом між козами та сонячним диском над конем, нині в Музеї Ізраїлю. Євсевій знав Таанах як велике село за три милі від Легіону. Село Тіннік лежить у провінції Дженін на Західному березі, поблизу Зеленої лінії."
  es:
    - "Taanac era una ciudad cananea en el borde sur del valle de Jezreel, a 8 km al sureste de Meguido, donde el camino de la costa sube a las colinas de Samaria. El montículo, Tell Ti'innik, con una aldea palestina del mismo nombre a sus pies, conserva el nombre. Tutmosis III, al marchar sobre Meguido en el siglo XV a. C., consideró el camino por Taanac antes de elegir el paso de Aruna; unas doce tablillas cuneiformes de ese siglo halladas en el montículo, cartas y listas en acadio, están entre los archivos más antiguos desenterrados en el país."
    - "Josué cuenta «el rey de Taanach» entre los derrotados, pero la ciudad siguió siendo cananea: Manasés la recibió con Meguido, Bet-seán, Dor e Ibleam, «mas el Cananeo quiso habitar en esta tierra». El Cántico de Débora sitúa aquí la batalla con Sísara: «entonces pelearon los reyes de Canaán en Taanac, junto á las aguas de Megiddo, mas no llevaron ganancia alguna de dinero». Llegó a ser ciudad levítica, y bajo Salomón Baana hijo de Ahilud gobernó juntas «Taanach y Megiddo». El faraón Sheshonq I (el Sisac bíblico) enumera Taanac entre las ciudades que tomó hacia 925 a. C., y los excavadores vincularon con su campaña una destrucción de la ciudad del siglo X a. C."
    - "Ernst Sellin, estudioso alemán que enseñaba entonces en Viena, excavó el montículo en 1902–1904 y halló las tablillas; Paul Lapp volvió en 1963–1968 y sacó a la luz, en un contexto del siglo X a. C., el soporte de culto de terracota pintada con leones, esfinges, un árbol entre cabras y un disco solar sobre un caballo, hoy en el Museo de Israel. Eusebio conocía Taanac como una gran aldea a tres millas de Legio. La aldea de Ti'innik se encuentra en la gobernación de Yenín, en Cisjordania, cerca de la Línea Verde."
  pt:
    - "Taanaque era uma cidade cananeia na margem sul do vale de Jezreel, 8 km a sudeste de Megido, onde a estrada da costa sobe para as colinas de Samaria. O monte, Tell Ti'innik, com uma aldeia palestina de mesmo nome ao pé, conserva o nome. Tutmés III, ao marchar sobre Megido no século XV a.C., considerou o caminho por Taanaque antes de escolher a passagem de Aruna; cerca de uma dúzia de tabuinhas cuneiformes daquele século achadas no monte, cartas e listas em acádio, estão entre os arquivos mais antigos desenterrados na região."
    - "Josué conta “o rei de Taanaque” entre os derrotados, mas a cidade continuou cananeia: Manassés a recebeu com Megido, Bete-Seã, Dor e Ibleão, “mas os cananeus persistiram em habitar naquela terra”. O Cântico de Débora situa aqui a batalha com Sísera: “então os reis de Canaã lutaram em Taanaque, junto às águas de Megido. Não levaram nenhum despojo de prata”. Tornou-se cidade levítica e, sob Salomão, Baaná, filho de Ailude, governava juntos “Taanaque e Megido”. O faraó Sheshonq I (o Sisaque bíblico) lista Taanaque entre as cidades que tomou por volta de 925 a.C., e os escavadores ligaram uma destruição da cidade do século X a.C. à sua campanha."
    - "Ernst Sellin, estudioso alemão que então lecionava em Viena, escavou o monte em 1902–1904 e achou as tabuinhas; Paul Lapp voltou em 1963–1968 e descobriu, em contexto do século X a.C., o suporte cultual de terracota pintada com leões, esfinges, uma árvore entre cabras e um disco solar sobre um cavalo, hoje no Museu de Israel. Eusébio conhecia Taanaque como uma grande aldeia a três milhas de Legio. A aldeia de Ti'innik fica na província de Jenin, na Cisjordânia, perto da Linha Verde."
  de:
    - "Taanach war eine kanaanäische Stadt am Südrand der Jesreel-Ebene, 8 km südöstlich von Megiddo, wo die Straße von der Küste in die Hügel Samarias ansteigt. Der Hügel, Tell Ti'innik, bewahrt den Namen, mit einem palästinensischen Dorf gleichen Namens an seinem Fuß. Thutmosis III. erwog auf dem Marsch gegen Megiddo im fünfzehnten Jahrhundert v. Chr. den Weg über Taanach, ehe er den Aruna-Pass wählte; etwa ein Dutzend Keilschrifttafeln jenes Jahrhunderts, Briefe und Listen auf Akkadisch, die auf dem Hügel gefunden wurden, gehören zu den ältesten im Land ausgegrabenen Archiven."
    - "Unter den Besiegten, die Josua aufzählt, ist „der König zu Thaanach“, doch blieb die Stadt kanaanäisch: Manasse erhielt sie mit Megiddo, Bet-Schean, Dor und Jibleam, „und die Kanaaniter blieben wohnen im Land“. Das Debora-Lied verlegt die Schlacht mit Sisera hierher: „da stritten die Könige der Kanaaniter zu Thaanach am Wasser Megiddos; aber sie brachten keinen Gewinn davon“. Sie wurde Levitenstadt, und unter Salomo verwaltete „Baana, der Sohn Ahiluds, zu Thaanach und zu Megiddo“ beide zusammen. Pharao Schoschenk I. (der biblische Schischak) zählt Taanach unter den Städten auf, die er um 925 v. Chr. einnahm, und die Ausgräber brachten eine Zerstörung der Stadt des zehnten Jahrhunderts mit seinem Feldzug in Verbindung."
    - "Ernst Sellin, ein deutscher Gelehrter, der damals in Wien lehrte, grub den Hügel 1902–1904 aus und fand die Tafeln; Paul Lapp kehrte 1963–1968 zurück und legte, in einem Zusammenhang des zehnten Jahrhunderts, den bemalten Terrakotta-Kultständer mit Löwen, Sphingen, einem Baum zwischen Ziegenböcken und einer Sonnenscheibe über einem Pferd frei, der heute im Israel-Museum steht. Eusebius kannte Taanach als großes Dorf drei Meilen von Legio. Das Dorf Ti'innik liegt im Gouvernement Dschenin des Westjordanlands, nahe der Grünen Linie."
  fr:
    - "Thaanac était une ville cananéenne au bord sud de la vallée de Jizreel, à 8 km au sud-est de Meguiddo, là où la route de la côte monte vers les collines de Samarie. Le tertre, Tell Ti’innik, avec au pied un village palestinien du même nom, en garde le nom. Thoutmosis III, marchant sur Meguiddo au XVe siècle av. J.-C., envisagea la route par Thaanac avant de choisir le défilé d’Aruna ; une douzaine de tablettes cunéiformes de ce siècle trouvées sur le tertre, lettres et listes en akkadien, comptent parmi les plus anciennes archives mises au jour dans le pays."
    - "Josué compte « le roi de Taanac » parmi les vaincus, mais la ville resta cananéenne : Manassé la reçut avec Meguiddo, Beth-Schean, Dor et Jibleam, « et les Cananéens voulurent rester dans ce pays ». Le cantique de Débora y situe la bataille contre Sisera : « Alors combattirent les rois de Canaan, à Thaanac, aux eaux de Meguiddo ; ils ne remportèrent nul butin, nul argent ». Elle devint ville lévitique, et sous Salomon Baana, fils d’Achilud, gouvernait ensemble « Thaanac et Meguiddo ». Le pharaon Sheshonq Ier (le Schischak biblique) range Thaanac parmi les villes qu’il prit vers 925 av. J.-C., et les fouilleurs ont relié une destruction de la ville du Xe siècle à sa campagne."
    - "Ernst Sellin, savant allemand qui enseignait alors à Vienne, fouilla le tertre en 1902-1904 et trouva les tablettes ; Paul Lapp y revint en 1963-1968 et dégagea, dans un contexte du Xe siècle, le support de culte en terre cuite peinte orné de lions, de sphinx, d’un arbre entre des chèvres et d’un disque solaire au-dessus d’un cheval, aujourd’hui au Musée d’Israël. Eusèbe connaissait Thaanac comme un grand village à trois milles de Legio. Le village de Ti’innik se trouve dans le gouvernorat de Jénine, en Cisjordanie, près de la Ligne verte."
  pl:
    - "Taanak było miastem kanaanejskim na południowym skraju doliny Jizreel, 8 km na południowy wschód od Megiddo, gdzie droga znad wybrzeża wspina się na wzgórza Samarii. Kopiec, Tell Tiinnik, z palestyńską wsią o tej samej nazwie u stóp, zachowuje nazwę. Totmes III, maszerując na Megiddo w XV wieku p.n.e., rozważał drogę przez Taanak, zanim wybrał przełęcz Aruna; około tuzina glinianych tabliczek klinowych z tego stulecia, znalezionych na kopcu, listów i spisów w języku akadyjskim, należy do najstarszych archiwów odkopanych w tym kraju."
    - "Jozue wymienia wśród pokonanych: „Król Tenach jeden”, a jednak miasto pozostało kanaanejskie: Manasses otrzymał je z Megiddo, Bet-Szean, Dor i Jibleam, ale „począł Chananejczyk mieszkać w onej ziemi”. Pieśń Debory umieszcza tu bitwę z Sisarą: „na ten czas walczyli królowie Chananejscy w Tanach u wód Magieddo, jednak korzyści srebra nie odnieśli”. Stało się miastem lewitów, a za Salomona Baana, syn Achiluda, „trzymał Tanach i Magieddo” razem. Faraon Szoszenk I (biblijny Sziszak) wymienia Taanak wśród miast, które zdobył około 925 roku p.n.e., a odkrywcy powiązali zniszczenie miasta z X wieku z jego wyprawą."
    - "Ernst Sellin, niemiecki uczony wykładający wówczas w Wiedniu, kopał kopiec w latach 1902–1904 i znalazł tabliczki; Paul Lapp wrócił w latach 1963–1968 i odsłonił, w kontekście z X wieku, malowany terakotowy stojak kultowy z lwami, sfinksami, drzewem między kozłami i tarczą słoneczną nad koniem, obecnie w Muzeum Izraela. Euzebiusz znał Taanak jako dużą wieś w odległości trzech mil od Legio. Wieś Tiinnik leży w muhafazie Dżanin na Zachodnim Brzegu, blisko Zielonej Linii."
  it:
    - "Taanach era una città cananea sul margine meridionale della valle di Izreel, 8 km a sud-est di Meghiddo, dove la strada dalla costa sale sulle colline di Samaria. Il tell, Tell Ti’innik, con un villaggio palestinese dallo stesso nome ai suoi piedi, ne conserva il nome. Tutmosi III, marciando su Meghiddo nel XV secolo a.C., considerò la strada per Taanach prima di scegliere il passo di Aruna; una dozzina circa di tavolette cuneiformi di quel secolo trovate sul tell, lettere ed elenchi in accadico, sono fra gli archivi più antichi scavati nel paese."
    - "Giosuè annovera «il re di Taanac» fra gli sconfitti, eppure la città rimase cananea: Manasse la ricevette con Meghiddo, Beth-Scean, Dor e Ibleam, ma «i Cananei eran decisi a restare in quel paese». Il Cantico di Debora pone qui la battaglia con Sisara: «allora pugnarono i re di Canaan a Taanac, presso le acque di Meghiddo; non ne riportarono un pezzo d’argento». Divenne una città levitica, e sotto Salomone Baana figlio di Achilud governò insieme «Taanac, Meghiddo». Il faraone Sheshonq I (il biblico Sisak) elenca Taanach fra le città che prese verso il 925 a.C., e gli scavatori collegarono alla sua campagna una distruzione della città del X secolo."
    - "Ernst Sellin, studioso tedesco che allora insegnava a Vienna, scavò il tell nel 1902–1904 e trovò le tavolette; Paul Lapp tornò nel 1963–1968 e portò alla luce, in un contesto del X secolo, il sostegno cultuale di terracotta dipinta con leoni, sfingi, un albero fra capre e un disco solare sopra un cavallo, oggi al Museo d’Israele. Eusebio conosceva Taanach come un grande villaggio a tre miglia da Legio. Il villaggio di Ti’innik si trova nel governatorato di Jenin, in Cisgiordania, presso la Linea Verde."
  nl:
    - "Taänach was een Kanaänitische stad aan de zuidrand van de vallei van Jizreël, 8 km ten zuidoosten van Megiddo, waar de weg van de kust de heuvels van Samaria in klimt. De heuvel, Tell Ti’innik, met aan zijn voet een Palestijns dorp met dezelfde naam, behoudt de naam. Thoetmosis III, optrekkend naar Megiddo in de vijftiende eeuw v.Chr., overwoog de weg langs Taänach voordat hij de pas van Aruna koos; ongeveer een dozijn spijkerschrifttabletten uit die eeuw, gevonden op de heuvel, brieven en lijsten in het Akkadisch, behoren tot de oudste archieven die in het land zijn opgegraven."
    - "Jozua rekent “de koning van Taanach” onder de verslagenen, maar de stad bleef Kanaänitisch: Manasse ontving haar met Megiddo, Beth-Sean, Dor en Jibleam, “en de Kanaänieten wilden wonen in hetzelve land”. Het lied van Debora plaatst de strijd met Sisera hier: “toen streden de koningen van Kanaan, te Thaanach aan de wateren van Megiddo; zij brachten geen gewin des zilvers daarvan”. Het werd een Levietenstad, en onder Salomo bestuurde Baäna, de zoon van Achilud, “Taanach, en Megiddo” samen. Farao Sjosjenq I (de Bijbelse Sisak) noemt Taänach onder de steden die hij omstreeks 925 v.Chr. innam, en de opgravers brachten een verwoesting van de stad uit de 10e eeuw v.Chr. met zijn veldtocht in verband."
    - "Ernst Sellin, een Duitse geleerde die toen in Wenen doceerde, groef op de heuvel in 1902–1904 en vond de tabletten; Paul Lapp keerde terug in 1963–1968 en legde, in een context uit de 10e eeuw v.Chr., de beschilderde terracotta cultusstandaard bloot met leeuwen, sfinxen, een boom tussen geiten en een zonneschijf boven een paard, nu in het Israëlmuseum. Eusebius kende Taänach als een groot dorp op drie mijl van Legio. Het dorp Ti’innik ligt in het gouvernement Jenin van de Westelijke Jordaanoever, dicht bij de Groene Lijn."
  cs:
    - "Taanach bylo kanaánské město na jižním okraji Jizreelského údolí, 8 km jihovýchodně od Megida, kde silnice od pobřeží stoupá do samařských kopců. Pahorek Tell Ti'innik, s palestinskou vesnicí téhož jména na úpatí, zachovává jméno. Thutmose III., když v 15. stol. př. n. l. táhl na Megido, zvažoval cestu přes Taanach, než zvolil průsmyk Aruna; asi tucet klínopisných tabulek z onoho století nalezených na pahorku, dopisů a seznamů v akkadštině, patří k nejstarším archivům vykopaným v této zemi."
    - "Jozue počítá mezi poražené krále Taanachu, přesto zůstalo město kanaánské: Manases je obdržel s Megidem, Bét-šeanem, Dórem a Jibleamem, ale „i počal Kananejský svobodně bydliti v zemi té“. Píseň Debořina klade bitvu se Siserou sem: „tehdáž bojovali králové Kananejští v Tanach při vodách Mageddo, a však kořisti stříbra nevzali“. Stalo se městem levitským a za Šalomouna je společně spravoval Baana, syn Achilúdův: „Tanach a Mageddo“. Faraon Šošenk I. (biblický Šíšak) uvádí Taanach mezi městy, která dobyl kolem roku 925 př. n. l., a vykopávky spojily zničení města z 10. století s jeho tažením."
    - "Ernst Sellin, německý učenec tehdy vyučující ve Vídni, pahorek kopal v letech 1902–1904 a našel tabulky; Paul Lapp se vrátil v letech 1963–1968 a odkryl, v kontextu 10. století, malovaný terakotový kultovní stojan se lvy, sfingami, stromem mezi kozly a slunečním kotoučem nad koněm, nyní v Izraelském muzeu. Eusebius znal Taanach jako velkou vesnici tři míle od Legionu. Vesnice Ti'innik leží v guvernorátu Džanín na Západním břehu, blízko Zelené linie."
  sv:
    - "Taanak var en kananeisk stad vid södra kanten av Jisreeldalen, 8 km sydost om Megiddo, där vägen från kusten stiger upp i Samariens berg. Kullen, Tell Ti'innik, med en palestinsk by med samma namn vid foten, bevarar namnet. Thutmosis III, som tågade mot Megiddo på 1400-talet f.Kr., övervägde vägen förbi Taanak innan han valde passet Aruna; omkring ett dussin kilskriftstavlor från det århundradet som hittats på kullen, brev och förteckningar på akkadiska, hör till de äldsta arkiv som grävts fram i landet."
    - "Josua räknar ”konungen i Taanak” bland de besegrade, men staden förblev kananeisk: Manasse fick den tillsammans med Megiddo, Bet-Shean, Dor och Jivleam, ”utan kananéerna förmådde hålla sig kvar där i landet”. Deboras sång förlägger striden mot Sisera hit: ”då stridde Kanaans konungar vid Taanak, invid Megiddos vatten; men byte av silver vunno de icke”. Den blev en levitstad, och under Salomo styrde Baana, Achiluds son, ”Taanak och Megiddo” tillsammans. Farao Shoshenq I (Bibelns Shishak) räknar upp Taanak bland de städer han intog omkring 925 f.Kr., och utgrävarna förband en förstörelse av 900-talsstaden med hans fälttåg."
    - "Ernst Sellin, en tysk forskare som då undervisade i Wien, grävde kullen 1902–1904 och fann tavlorna; Paul Lapp återvände 1963–1968 och frilade, i ett sammanhang från 900-talet, kultstativet av målad terrakotta med lejon, sfinxer, ett träd mellan getter och en solskiva ovanför en häst, nu i Israelmuseet. Eusebios kände Taanak som en stor by tre romerska mil från Legio. Byn Ti'innik ligger i Jeninguvernementet på Västbanken, nära Gröna linjen."
  nb:
    - "Taanak var en kanaanittisk by i den sørlige kanten av Jisreeldalen, 8 km sørøst for Megiddo, der veien fra kysten stiger opp i Samarias åser. Haugen, Tell Ti'innik, med en palestinsk landsby med samme navn ved foten, bevarer navnet. Tutmosis III, som marsjerte mot Megiddo på 1400-tallet f.Kr., vurderte veien om Taanak før han valgte Aruna-passet; omkring et dusin kileskrifttavler fra det århundret funnet på haugen, brev og lister på akkadisk, er blant de eldste arkivene som er gravd fram i landet."
    - "Josva regner «kongen i Ta'anak» blant de slåtte, men byen forble kanaanittisk: Manasse fikk den sammen med Megiddo, Bet-Sjean, Dor og Jibleam, «og det lyktes kana'anittene å bli boende der i landet». Deboras sang setter slaget med Sisera hit: «dengang stred Kana'ans konger ved Ta'anak, ved Megiddos vann; hærfang av sølv fikk de ikke». Den ble en levittby, og under Salomo styrte Baana, Ahiluds sønn, «Ta'anak og Megiddo» sammen. Farao Sjosjenk I (bibelens Sjisjak) oppfører Taanak blant byene han inntok omkring 925 f.Kr., og utgraverne knyttet en ødeleggelse av byen fra 900-tallet til hans felttog."
    - "Ernst Sellin, en tysk forsker som da underviste i Wien, gravde i haugen i 1902–1904 og fant tavlene; Paul Lapp vendte tilbake i 1963–1968 og avdekket, i en sammenheng fra 900-tallet, det malte kultstativet av terrakotta med løver, sfinkser, et tre mellom geiter og en solskive over en hest, nå i Israel-museet. Eusebius kjente Taanak som en stor landsby tre romerske mil fra Legio. Landsbyen Ti'innik ligger i Jenin-guvernementet på Vestbredden, tett ved Den grønne linjen."
  tl:
    - "Ang Taanach ay isang lunsod ng mga Cananeo sa timugang gilid ng libis ng Jezreel, 8 km sa timog-silangan ng Megiddo, kung saan ang daan mula sa baybayin ay umaakyat sa mga burol ng Samaria. Ang burol, ang Tell Ti'innik, na may nayong Palestino na may gayon ding pangalan sa paanan nito, ang nagpapanatili ng pangalan. Pinag-isipan ni Thutmose III, na nagmamartsa sa Megiddo noong ika-15 siglo BK, ang daan sa pamamagitan ng Taanach bago piliin ang daanan ng Aruna; humigit-kumulang isang dosenang tabletang kuneiporme ng siglong iyon na natagpuan sa burol, mga liham at talaan sa Akkadian, ay kabilang sa pinakamatatandang archive na nahukay sa lupain."
    - "Binibilang ni Josue ang “hari sa Taanach” sa mga natalo, ngunit nanatiling Cananeo ang lunsod: tinanggap ito ni Manases kasama ng Megiddo, Beth-san, Dor at Ibleam, “kundi ang mga Cananeo ay nanahan sa lupaing yaon”. Itinatakda ng Awit ni Debora ang labanan kay Sisara rito: “Nang magkagayo'y nagsilaban ang mga hari ng Canaan, Sa Taanach na nasa tabi ng tubig sa Megiddo: Sila'y hindi nagdala ng mga pakinabang na salapi”. Naging lunsod ito ng mga Levita, at sa ilalim ni Salomon, si Baana na anak ni Ahilud ay namahala nang magkasama “sa Taanach, at sa Megiddo”. Itinatala ni Faraon Shoshenq I (ang Sisac ng Biblia) ang Taanach sa mga bayang sinakop niya noong mga 925 BK, at iniugnay ng mga naghukay ang pagkawasak ng bayan noong ika-10 siglo sa kaniyang kampanya."
    - "Hinukay ni Ernst Sellin, isang iskolar na Aleman na noo'y nagtuturo sa Vienna, ang burol noong 1902–1904 at natagpuan ang mga tableta; bumalik si Paul Lapp noong 1963–1968 at natuklasan, sa kontekstong ika-10 siglo, ang pininturahang terakotang tindig na pang-ritwal na may mga leon, sphinx, isang punong nasa pagitan ng mga kambing at isang disko ng araw sa itaas ng isang kabayo, na nasa Museo ng Israel ngayon. Kilala ni Eusebio ang Taanach bilang malaking nayon tatlong milya mula sa Legio. Ang nayon ng Ti'innik ay nasa lalawigan ng Jenin ng Kanlurang Pampang, malapit sa Berdeng Guhit."
  da:
    - "Ta'anak var en kana'anæisk by på den sydlige kant af Jizre'el-dalen, 8 km sydøst for Megiddo, hvor vejen fra kysten stiger op i Samarias bjerge. Tellen, Tell Ti'innik, med en palæstinensisk landsby af samme navn ved sin fod, har bevaret navnet. Thutmosis 3., der i 1400-tallet f.Kr. marcherede mod Megiddo, overvejede vejen forbi Ta'anak, før han valgte Aruna-passet; omkring et dusin kileskrifttavler fra det århundrede, fundet på tellen, breve og lister på akkadisk, er blandt de ældste arkiver, der er gravet frem i landet."
    - "Josva regner »Kongen af Thaanak« blandt de besejrede, men byen forblev kana'anæisk: Manasse fik den sammen med Megiddo, Bet-Sjan, Dor og Jible'am, »men Kananiten boede roligt i samme Land«. Deboras Sang placerer kampen mod Sisera her: »da strede Kanaans Konger udi Thaanak ved Megiddo Vand; de fik ingen Vinding af Sølv«. Den blev en levitisk by, og under Salomo styrede Baana, Akiluds søn, »Thaanak og Megiddo« sammen. Farao Shoshenq 1. (Bibelens Sjisjak) opregner Ta'anak blandt de byer, han tog omkring 925 f.Kr., og udgraverne knyttede en ødelæggelse af byen fra 900-tallet til hans felttog."
    - "Ernst Sellin, en tysk forsker, der dengang underviste i Wien, udgravede tellen i 1902–1904 og fandt tavlerne; Paul Lapp vendte tilbage i 1963–1968 og blottede i en sammenhæng fra 900-tallet f.Kr. det malede kultstativ af terrakotta med løver, sfinkser, et træ mellem bukke og en solskive over en hest, nu i Israel Museum. Eusebios kendte Ta'anak som en stor landsby tre romerske mil fra Legio. Landsbyen Ti'innik ligger i Jenin-guvernementet på Vestbredden, tæt på Den Grønne Linje."
  sr:
    - "Танах је био ханански град на јужном ободу Језраелске долине, 8 км југоисточно од Мегида, где се пут с обале пење у брда Самарије. Хум, Тел Тиник, с палестинским селом истог имена у подножју, чува име. Тутмос III, марширајући на Мегидо у 15. веку п. н. е., разматрао је пут преко Танаха пре него што је изабрао превој Аруна; десетак клинастих плочица из тог века нађених на хуму, писама и спискова на акадском, спада међу најстарије архиве откопане у земљи."
    - "Исус међу побеђене убраја цара танашког, а ипак је град остао ханански: Манасија га је добио с Мегидом, Вет-Саном, Дором и Ивлеамом, „Хананеји стадоше живети у тој земљи“. Песма Деворина смешта битку са Сисаром овде: „бише се цареви ханански у Танаху на води мегидској; али ни мрве сребра не добише“. Постао је левитски град, а за Соломуна је Вана, син Ахилудов, био заједно „над Танахом и Мегидоном“. Фараон Шошенк I (библијски Сисак) наводи Танах међу градовима које је заузео око 925. п. н. е., а ископавачи су повезали разарање града из 10. века с његовим походом."
    - "Ернст Зелин, немачки научник који је тада предавао у Бечу, копао је хум 1902–1904. и нашао плочице; Пол Лап вратио се 1963–1968. и открио, у контексту 10. века, осликано теракотно култно постоље са лавовима, сфингама, дрветом међу јарцима и сунчаним диском изнад коња, данас у Музеју Израела. Јевсевије је знао Танах као велико село три миље од Легија. Село Тиник лежи у гувернорату Џенин на Западној обали, близу Зелене линије."
  hu:
    - "Taanak kánaáni város volt a Jezréel-völgy déli szélén, Megiddótól 8 km-re délkeletre, ahol a tengerparti út a szamáriai dombok közé emelkedik. A Tell Ti'innik nevű halom, lábánál az azonos nevű palesztin faluval, megőrizte a nevet. III. Thotmesz, Megiddo felé vonulva a Kr. e. 15. században fontolóra vette a Taanakon át vezető utat, mielőtt az Aruna-hágót választotta; a halmon talált mintegy tucatnyi, ugyanebből a századból származó ékírásos tábla, akkád nyelvű levelek és jegyzékek, az országban kiásott legrégebbi levéltárak közé tartozik."
    - "Józsué „Taanáknak királya”-ként a legyőzöttek közé számítja, a város mégis kánaáni maradt: Manassé megkapta Megiddóval, Bét-Seánnal, Dórral és Jibleámmal együtt, „és sikerült a Kananeusnak ott maradni azon a földön”. Debóra éneke ide helyezi a Sisera elleni csatát: „Akkor harczoltak a Kanaán királyai Taanaknál, Megiddó vizénél; De egy darab ezüstöt sem vettenek.” Léviták városa lett, és Salamon alatt Baana, Ahilud fia „Taanákot és Megiddót” együtt kormányozta. I. Sosenk fáraó (a bibliai Sisak) Taanakot a Kr. e. 925 körül elfoglalt városok között sorolja fel, és az ásatók a 10. századi város pusztulását az ő hadjáratával hozták összefüggésbe."
    - "Ernst Sellin, a Bécsben akkor tanító német tudós 1902–1904 között ásta a halmot, és megtalálta a táblákat; Paul Lapp 1963–1968 között tért vissza, és egy 10. századi környezetben feltárta a festett terrakotta kultuszállványt oroszlánokkal, szfinxekkel, kecskék között álló fával és ló fölött napkoronggal, amely ma az Izraeli Múzeumban van. Eusebius Taanakot nagy falunak ismerte, három mérföldre Legiótól. Ti'innik falu a ciszjordániai Dzsenín kormányzóságban fekszik, a Zöld Vonal közelében."
  fi:
    - "Taanak oli kanaanilainen kaupunki Jisreelin laakson eteläreunalla, 8 km Megiddosta kaakkoon, missä rannikolta tuleva tie nousee Samarian vuorille. Kumpare, Tell Ti'innik, jonka juurella on samanniminen palestiinalaiskylä, säilyttää nimen. Tuthmosis III, marssiessaan Megiddoa vastaan 1400-luvulla eaa., harkitsi Taanakin kautta kulkevaa tietä ennen kuin valitsi Arunan solan; kumpareelta löydetyt noin tusina saman vuosisadan nuolenpäätauluja, akkadinkielisiä kirjeitä ja luetteloita, kuuluvat maan vanhimpiin kaivettuihin arkistoihin."
    - "Joosuan voitettujen luettelossa on ”Taanakin kuningas”, mutta kaupunki jäi kanaanilaiseksi: Manasse sai sen Megiddon, Beet-Seanin, Doorin ja Jibleamin kanssa, ”vaan kanaanilaisten onnistui jäädä asumaan siihen maahan”. Deboran laulu sijoittaa taistelun Siseraa vastaan tänne: ”silloin taistelivat Kanaanin kuninkaat Taanakissa, Megiddon vesien varsilla; mutta hopeata he eivät saaneet saaliiksensa”. Siitä tuli leeviläiskaupunki, ja Salomon aikana Baana, Ahiludin poika, hallitsi ”Taanakissa ja Megiddossa” yhdessä. Farao Sheshonq I (Raamatun Sisak) luettelee Taanakin valloittamiensa kaupunkien joukkoon noin 925 eaa., ja kaivajat yhdistivät 900-luvun kaupungin tuhon hänen sotaretkeensä."
    - "Ernst Sellin, tuolloin Wienissä opettanut saksalainen tutkija, kaivoi kumpareen vuosina 1902–1904 ja löysi taulut; Paul Lapp palasi vuosina 1963–1968 ja paljasti 900-luvun yhteydestä maalatun terrakottaisen kulttitelineen, jossa on leijonia, sfinksejä, puu vuohien välissä ja auringonkiekko hevosen yläpuolella; se on nyt Israel-museossa. Eusebios tunsi Taanakin suurena kylänä kolmen mailin päässä Legiosta. Ti'innikin kylä sijaitsee Länsirannan Jeninin kuvernementissa lähellä vihreää linjaa."
  vi:
    - "Tha-a-nác là một thành Ca-na-an ở rìa nam thung lũng Gít-rê-ên, cách Mê-ghi-đô 8 km về phía đông nam, nơi con đường từ bờ biển leo lên các đồi Sa-ma-ri. Gò Tell Ti'innik, với một làng Palestine cùng tên dưới chân, còn giữ tên cũ. Thutmose III, khi tiến về Mê-ghi-đô vào thế kỷ 15 TCN, đã cân nhắc con đường qua Tha-a-nác trước khi chọn đèo Aruna; khoảng một chục bảng chữ hình nêm của thế kỷ ấy tìm thấy trên gò, gồm thư từ và danh sách bằng tiếng Akkad, thuộc về những văn khố cổ nhất được đào lên trong xứ."
    - "Giô-suê kể “vua Tha-a-nác” trong số những vua bị đánh bại, nhưng thành vẫn là của người Ca-na-an: Ma-na-se nhận nó cùng Mê-ghi-đô, Bết-Sê-an, Đô-rơ và Gíp-lê-am, nhưng “dân Ca-na-an quyết định ở trong xứ ấy”. Bài ca Đê-bô-ra đặt trận đánh với Si-sê-ra ở đây: “các vua Ca-na-an chiến tranh tại Tha-a-nác, tại nước Mê-ghi-đô; song chẳng cướp lấy được tiền bạc!” Nó trở thành thành của người Lê-vi, và dưới thời Sa-lô-môn, Ba-a-na con A-hi-lút cai trị “Tha-a-nác và Mê-ghi-đô” cùng nhau. Pha-ra-ôn Shoshenq I (Si-sắc trong Kinh Thánh) liệt kê Tha-a-nác trong các thành ông chiếm khoảng năm 925 TCN, và các nhà khai quật gắn một cuộc phá hủy của thị trấn thế kỷ 10 với chiến dịch của ông."
    - "Ernst Sellin, một học giả Đức khi ấy dạy ở Vienna, khai quật gò năm 1902–1904 và tìm thấy các bảng chữ; Paul Lapp trở lại năm 1963–1968 và phát lộ, trong bối cảnh thế kỷ 10, cái bệ thờ bằng đất nung vẽ màu với sư tử, nhân sư, một cái cây giữa các con dê và một đĩa mặt trời trên con ngựa, nay ở Bảo tàng Israel. Eusebius biết Tha-a-nác là một làng lớn cách Legio ba dặm. Làng Ti'innik nằm trong tỉnh Jenin của Bờ Tây, gần Lằn ranh Xanh."
  ro:
    - "Taanac era o cetate canaanită la marginea sudică a Văii Izreel, la 8 km sud-est de Meghido, unde drumul dinspre coastă urcă în dealurile Samariei. Movila, Tell Ti'innik, cu un sat palestinian cu același nume la poalele ei, păstrează numele. Tutmes al III-lea, mărșăluind spre Meghido în secolul al XV-lea î.Hr., a luat în calcul drumul prin Taanac înainte de a alege trecătoarea Aruna; circa o duzină de tăblițe cuneiforme din acel secol, găsite pe movilă, scrisori și liste în akkadiană, se numără printre cele mai vechi arhive scoase la lumină în țară."
    - "Iosua îl numără pe regele Taanacului printre cei învinși, dar cetatea a rămas canaanită: Manase a primit-o împreună cu Meghido, Bet-Șean, Dor și Ibleam, dar canaaniții au stăruit să locuiască în țara aceea. Cântarea Deborei așază aici lupta cu Sisera: atunci au luptat regii Canaanului la Taanac, lângă apele Meghidoului, și nu au luat niciun câștig de argint. A devenit cetate levitică, iar sub Solomon, Baana, fiul lui Ahilud, ținea împreună „Etaanahul și Maghedonul”. Faraonul Șoșenq I (Șișac din Biblie) enumeră Taanac printre orașele pe care le-a luat pe la 925 î.Hr., iar arheologii au legat o distrugere a orașului din secolul al X-lea de campania lui."
    - "Ernst Sellin, un cercetător german care preda atunci la Viena, a săpat movila în 1902–1904 și a găsit tăblițele; Paul Lapp s-a întors în 1963–1968 și a scos la iveală, într-un context din secolul al X-lea, suportul de cult din teracotă pictată, cu lei, sfincși, un copac între capre și un disc solar deasupra unui cal, aflat acum în Muzeul Israelului. Eusebiu cunoștea Taanac ca pe un sat mare, la trei mile de Legio. Satul Ti'innik se află în guvernoratul Jenin din Cisiordania, aproape de Linia Verde."
  bg:
    - "Танах бил ханаански град на южния край на Изреелската долина, на 8 км югоизточно от Мегидо, където пътят от крайбрежието се изкачва в Самарийските хълмове. Могилата Тел Тиинник, с палестинско село със същото име в подножието ѝ, пази името. Тутмос III, настъпвайки към Мегидо през XV в. пр.н.е., обмислял пътя през Танах, преди да избере прохода Аруна; около дузина клинописни плочки от този век, намерени на могилата — писма и списъци на акадски, — са сред най-старите архиви, открити в страната."
    - "Книгата Иисус Навин брои „Таанахский цар“ сред победените, но градът останал ханаански: Манасия го получил заедно с Мегидо, Бет-Сан, Дор и Ивлеам, „но Ханаанците се решиха да живеят в онова място“. Песента на Девора поставя тук битката със Сисара: „Тогаз ратуваха Ханаанските царе В Таанах близу при водите на Магедон: Корист от сребро не взеха“. Градът станал левитски, а при Соломон Ваана, синът на Ахилуд, управлявал заедно „Танах и Магедон“. Фараон Шешонк I (библейският Сусаким) изброява Танах сред градовете, които превзел около 925 г. пр.н.е., а разкопвачите свързали едно разрушение на града от X в. с неговия поход."
    - "Ернст Зелин, германски учен, който тогава преподавал във Виена, разкопал могилата през 1902–1904 г. и намерил плочките; Пол Лап се върнал през 1963–1968 г. и открил, в контекст от X в., рисуваната теракотена култова поставка с лъвове, сфинксове, дърво между кози и слънчев диск над кон, която днес е в Израелския музей. Евсевий познавал Танах като голямо село на три мили от Легио. Село Тиинник лежи в губернаторство Дженин на Западния бряг, близо до Зелената линия."
