body:
  en:
    - "Ibleam was a Canaanite town at the southern edge of the valley of Jezreel, where the road from the valley climbs south through the hills toward Dothan and Samaria. It is identified with Khirbet Belameh, a mound on the southern outskirts of Jenin, whose name keeps the old one; Egyptian lists of Thutmose III in the fifteenth century BC already record it. Joshua assigns it to Manasseh, with Beth-shean, Dor, Endor, Taanach and Megiddo, the string of strong towns along the valley, but Manasseh did not drive out their inhabitants, “but the Canaanites would dwell in that land”. The Levitical city Bileam, given to the Kohathites out of Manasseh, is the same place, and the Gath-rimmon of the parallel list in Joshua is probably a copyist's slip for it."
    - "Two kings met their end at or near Ibleam. When Jehu rode to Jezreel and killed Joram, Ahaziah of Judah fled by the garden house; Jehu's men struck him “at the going up to Gur, which is by Ibleam. And he fled to Megiddo, and died there”. Nearly ninety years later Zechariah son of Jeroboam II was murdered by Shallum after six months on the throne, “before the people” in the Hebrew text, but “in Ibleam” in a Greek manuscript tradition that many scholars follow, since the strange Hebrew phrase looks like the place name."
    - "Gottlieb Schumacher described the first 30 m of the rock-cut water tunnel of Khirbet Belameh in 1910; Palestinian and Dutch archaeologists under Hamdan Taha cleared about 115 m of it in 1996–1997, a high passage with rock-cut steps leading down to the spring at the foot of the hill, a system like those of Megiddo and Hazor and probably of the Iron Age, though the date rests on inference. The site lies at the south entrance of Jenin in the West Bank."
  ru:
    - "Ивлеам — ханаанский город на южном краю долины Изреельской, где дорога из долины поднимается на юг через горы к Дофану и Самарии. Его отождествляют с Хирбет-Бельаме, холмом на южной окраине Дженина, имя которого хранит древнее; египетские списки Тутмоса III в XV веке до н. э. уже его называют. Иисус Навин отдаёт его Манассии вместе с Беф-Саном, Дором, Ен-Дором, Фаанахом и Мегиддоном — цепью крепких городов вдоль долины, но Манассия не выгнал их жителей, «и остались Хананеи жить в земле сей». Левитский город Билеам, отданный Каафовым сынам от Манассии, — то же место, а Гаф-Риммон в параллельном списке у Иисуса Навина, вероятно, описка переписчика вместо него."
    - "Двое царей нашли конец у Ивлеама или близ него. Когда Ииуй примчался в Изреель и убил Иорама, Охозия Иудейский побежал по дороге к дому, что в саду; люди Ииуя поразили его «на возвышенности Гур, что при Ивлеаме. И побежал он в Мегиддон, и умер там». Почти девяносто лет спустя Захарию, сына Иеровоама II, после шести месяцев на престоле убил Селлум — «пред народом» по еврейскому тексту, но «в Ивлеаме» по греческой рукописной традиции, которой следуют многие учёные, ведь странный еврейский оборот похож на имя места."
    - "Готлиб Шумахер в 1910 году описал первые 30 м высеченного в скале водного туннеля Хирбет-Бельаме; палестинские и нидерландские археологи во главе с Хамданом Таха расчистили в 1996–1997 годах около 115 м — высокий ход с вырубленными ступенями, ведущий вниз к источнику у подножия холма, сооружение вроде водопроводов Мегиддона и Асора, вероятно железного века, хотя дата выведена косвенно. Место лежит у южного въезда в Дженин на Западном берегу."
  uk:
    - "Івлеам був ханаанським містом на південному краю долини Їзреель, де дорога з долини здіймається на південь пагорбами до Дофана і Самарії. Його ототожнюють із Хірбет-Беламию, городищем на південній околиці Дженіна, чия назва зберігає давню; єгипетські переліки Тутмоса III XV ст. до н. е. вже записують його. Книга Ісуса Навина призначає його Манасії, разом з Бет-Шеаном, Дором, Ендором, Таанахом і Мегіддо, низкою міцних міст уздовж долини, але Манасія не вигнала їхніх мешканців, «Так і вдалось Канаанїям зістатись на житлї в цїй країнї». Левітське місто Білеам, дане каафітам з Манасії, — те саме місце, а Гат-Риммон паралельного переліку в Книзі Ісуса Навина, імовірно, помилка переписувача замість нього."
    - "Двоє царів знайшли кінець в Івлеамі або поблизу. Коли Єгу поскакав до Їзреелю й убив Йорама, Охозія Юдейський утік до садового будинку; люди Єгу вразили його: «І пострілили його на узгіррю Гур, коло Іблеаму. І втїк він у Мегиддо та й сконав там». Майже дев’яносто років потому Захарію, сина Єровоама II, убив Шаллум після шести місяців на троні «перед народом» у давньоєврейському тексті, але «в Івлеамі» в грецькій рукописній традиції, за якою йде багато дослідників, бо дивна давньоєврейська фраза схожа на назву місця."
    - "Готліб Шумахер описав перші 30 м висіченого в скелі водного тунелю Хірбет-Белами 1910 року; палестинські та нідерландські археологи під керівництвом Хамдана Тахи розчистили близько 115 м його в 1996–1997 роках, високий хід із висіченими в скелі сходинками, що ведуть вниз до джерела біля підніжжя пагорба, система, подібна до систем Мегіддо й Гацору і, ймовірно, залізного віку, хоч датування спирається на висновок. Місце лежить на південному вході до Дженіна на Західному березі."
  es:
    - "Ibleam era una población cananea en el borde sur del valle de Jezreel, donde el camino del valle sube hacia el sur por las colinas en dirección a Dotán y Samaria. Se identifica con Khirbet Belameh, un montículo en las afueras meridionales de Yenín, cuyo nombre conserva el antiguo; las listas egipcias de Tutmosis III, en el siglo XV a. C., ya la registran. Josué la asigna a Manasés, con Bet-seán, Dor, Endor, Taanac y Meguido, la serie de ciudades fuertes a lo largo del valle, pero Manasés no expulsó a sus habitantes, «mas el Cananeo quiso habitar en esta tierra». La ciudad levítica Bileam, dada a los coatitas de la parte de Manasés, es el mismo lugar, y el Gat-rimón de la lista paralela de Josué es probablemente un desliz de copista por ella."
    - "Dos reyes hallaron su fin en Ibleam o cerca de ella. Cuando Jehú cabalgó hasta Jezreel y mató a Joram, Ocozías de Judá huyó por la casa del huerto; los hombres de Jehú lo hirieron «á la subida de Gur, junto á Ibleam. Y él huyó á Megiddo, y murió allí». Casi noventa años después Zacarías, hijo de Jeroboam II, fue asesinado por Salum tras seis meses en el trono, «en presencia de su pueblo» según el texto hebreo, pero «en Ibleam» en una tradición manuscrita griega que muchos estudiosos siguen, pues la extraña frase hebrea parece el nombre del lugar."
    - "Gottlieb Schumacher describió en 1910 los primeros 30 m del túnel de agua excavado en la roca de Khirbet Belameh; arqueólogos palestinos y neerlandeses bajo Hamdan Taha despejaron unos 115 m en 1996–1997, un pasaje alto con escalones tallados en la roca que bajan hasta el manantial al pie de la colina, un sistema como los de Meguido y Hazor y probablemente de la Edad del Hierro, aunque la fecha se apoya en una inferencia. El sitio se halla en la entrada sur de Yenín, en Cisjordania."
  pt:
    - "Ibleão era uma cidade cananeia na borda sul do vale de Jezreel, onde a estrada do vale sobe para o sul pelas colinas em direção a Dotã e Samaria. É identificada com Khirbet Belameh, um monte nos arredores meridionais de Jenin, cujo nome guarda o antigo; listas egípcias de Tutmés III no século XV a.C. já a registram. Josué a atribui a Manassés, com Bete-Seã, Dor, En-Dor, Taanaque e Megido, a série de cidades fortes ao longo do vale, mas Manassés não expulsou seus habitantes, “mas os cananeus persistiram em habitar naquela terra”. A cidade levítica Bileão, dada aos coatitas da parte de Manassés, é o mesmo lugar, e a Gate-Rimom da lista paralela de Josué é provavelmente um lapso de copista por ela."
    - "Dois reis encontraram o fim em Ibleão ou perto dela. Quando Jeú cavalgou até Jezreel e matou Jorão, Acazias de Judá fugiu pela casa do jardim; os homens de Jeú o atingiram “na subida de Gur, que fica perto de Ibleão. Ele fugiu para Megido e morreu lá”. Quase noventa anos depois, Zacarias, filho de Jeroboão II, foi assassinado por Salum depois de seis meses no trono, “diante do povo” no texto hebraico, mas “em Ibleão” numa tradição manuscrita grega que muitos estudiosos seguem, pois a estranha expressão hebraica parece o nome do lugar."
    - "Gottlieb Schumacher descreveu em 1910 os primeiros 30 m do túnel de água escavado na rocha de Khirbet Belameh; arqueólogos palestinos e holandeses sob Hamdan Taha desobstruíram cerca de 115 m dele em 1996–1997, uma passagem alta com degraus talhados na rocha que descem até a fonte ao pé da colina, sistema como os de Megido e Hazor e provavelmente da Idade do Ferro, embora a data repouse em inferência. O sítio fica na entrada sul de Jenin, na Cisjordânia."
  de:
    - "Jibleam war eine kanaanitische Stadt am Südrand des Jesreeltals, wo die Straße vom Tal durch die Hügel nach Süden Richtung Dotan und Samaria ansteigt. Es wird mit Chirbet Belame gleichgesetzt, einem Hügel am Südrand von Dschenin, dessen Name den alten bewahrt; ägyptische Listen Thutmosis' III. aus dem 15. Jahrhundert v. Chr. verzeichnen es schon. Josua weist es Manasse zu, mit Bet-Schean, Dor, En-Dor, Taanach und Megiddo, der Kette fester Städte am Tal, doch Manasse vertrieb deren Bewohner nicht, „und die Kanaaniter blieben wohnen im Land“. Die Levitenstadt Bileam, den Kehatitern aus Manasse gegeben, ist derselbe Ort, und das Gat-Rimmon der Parallelliste bei Josua ist wahrscheinlich ein Abschreibfehler dafür."
    - "Zwei Könige fanden bei oder nahe Jibleam ihr Ende. Als Jehu nach Jesreel fuhr und Joram tötete, floh Ahasja von Juda zum Gartenhaus; Jehus Männer schlugen ihn „auf der Höhe Gur, die bei Jibleam liegt. Und er floh gen Megiddo und starb daselbst“. Fast neunzig Jahre später wurde Sacharja, der Sohn Jerobeams II., nach sechs Monaten auf dem Thron von Schallum ermordet, „vor dem Volk“ im hebräischen Text, aber „in Jibleam“ in einer griechischen Handschriftentradition, der viele Forscher folgen, da die seltsame hebräische Wendung wie der Ortsname aussieht."
    - "Gottlieb Schumacher beschrieb 1910 die ersten 30 m des in den Fels gehauenen Wassertunnels von Chirbet Belame; palästinensische und niederländische Archäologen unter Hamdan Taha legten 1996–1997 etwa 115 m davon frei, einen hohen Gang mit in den Fels gehauenen Stufen, die zur Quelle am Fuß des Hügels hinabführen, eine Anlage wie die von Megiddo und Hazor und wahrscheinlich eisenzeitlich, wobei die Datierung auf Schlussfolgerung beruht. Die Stätte liegt am südlichen Eingang von Dschenin im Westjordanland."
  fr:
    - "Jibleam était une ville cananéenne au bord sud de la vallée de Jizreel, là où la route de la vallée monte vers le sud à travers les collines en direction de Dothan et de Samarie. On l’identifie à Khirbet Belameh, un tertre à la périphérie sud de Jénine, dont le nom garde l’ancien ; les listes égyptiennes de Thoutmosis III au XVe siècle av. J.-C. la mentionnent déjà. Josué l’attribue à Manassé, avec Beth-Schean, Dor, En-Dor, Thaanac et Meguiddo, la chaîne de villes fortes le long de la vallée, mais Manassé ne chassa pas leurs habitants, « et les Cananéens voulurent rester dans ce pays ». La ville lévitique Bileam, donnée aux Kehathites sur le territoire de Manassé, est le même lieu, et le Gath-Rimmon de la liste parallèle de Josué est probablement une erreur de copiste pour elle."
    - "Deux rois trouvèrent leur fin à Jibleam ou près d’elle. Quand Jéhu chevaucha vers Jizreel et tua Joram, Achazia de Juda s’enfuit par le chemin de la maison du jardin ; les hommes de Jéhu le frappèrent : « on le frappa à la montée de Gur, près de Jibleam. Il se réfugia à Meguiddo, et il y mourut ». Près de quatre-vingt-dix ans plus tard, Zacharie, fils de Jéroboam II, fut assassiné par Schallum après six mois de règne, « devant le peuple » dans le texte hébreu, mais « à Jibleam » dans une tradition manuscrite grecque que beaucoup de spécialistes suivent, puisque l’étrange expression hébraïque ressemble au nom de lieu."
    - "Gottlieb Schumacher décrivit les 30 premiers mètres du tunnel d’eau taillé dans le roc de Khirbet Belameh en 1910 ; des archéologues palestiniens et néerlandais sous Hamdan Taha en dégagèrent environ 115 m en 1996–1997, un haut passage à marches taillées dans le roc descendant à la source au pied de la colline, système semblable à ceux de Meguiddo et de Hatsor et probablement de l’âge du Fer, bien que la date repose sur l’inférence. Le site se trouve à l’entrée sud de Jénine, en Cisjordanie."
  pl:
    - "Jibleam było kananejskim miastem na południowym skraju doliny Jizreel, gdzie droga z doliny wspina się na południe przez wzgórza ku Dotan i Samarii. Utożsamia się je z Chirbet Belame, pagórkiem na południowych peryferiach Dżeninu, którego nazwa zachowuje dawną; egipskie wykazy Totmesa III z XV w. p.n.e. już je zapisują. Jozue przydziela je Manassesowi, z Bet-Szean, Dor, Endor, Taanak i Megiddo, ciągiem silnych miast wzdłuż doliny, lecz Manasses nie wypędził ich mieszkańców, bo „począł Chananejczyk mieszkać w onej ziemi”. Miasto lewickie Bileam, oddane Kehatytom z Manassesa, to to samo miejsce, a Gat-Rimmon z odpowiedniego wykazu u Jozuego jest prawdopodobnie pomyłką kopisty zamiast niego."
    - "Dwaj królowie znaleźli koniec w Jibleam lub w jego pobliżu. Gdy Jehu jechał do Jizreel i zabił Jorama, Ochozjasz z Judy uciekał do domu ogrodowego; ludzie Jehu zranili go „na wstąpie Guru, który jest podle Jeblaam. A uciekł do Magieddy, i tam umarł”. Prawie dziewięćdziesiąt lat później Zachariasz, syn Jeroboama II, został zamordowany przez Szalluma po sześciu miesiącach na tronie, „przed ludem” w tekście hebrajskim, lecz „w Jibleam” w greckiej tradycji rękopiśmiennej, za którą idzie wielu uczonych, ponieważ dziwne hebrajskie wyrażenie wygląda na nazwę miejsca."
    - "Gottlieb Schumacher opisał pierwsze 30 m wykutego w skale tunelu wodnego Chirbet Belame w 1910 r.; archeolodzy palestyńscy i holenderscy pod kierunkiem Hamdana Tahy odsłonili około 115 m w latach 1996–1997, wysoki korytarz z wykutymi w skale stopniami prowadzący w dół do źródła u stóp wzgórza, układ podobny do tych w Megiddo i Chasorze, prawdopodobnie z epoki żelaza, choć datowanie opiera się na wnioskowaniu. Stanowisko leży przy południowym wjeździe do Dżeninu na Zachodnim Brzegu."
  it:
    - "Ibleam era una città cananea al margine meridionale della valle di Izreel, dove la strada dalla valle sale a sud tra le colline verso Dotan e Samaria. È identificata con Khirbet Belameh, un tell alla periferia meridionale di Jenin, il cui nome conserva quello antico; gli elenchi egizi di Tutmosi III nel XV secolo a.C. già la registrano. Giosuè la assegna a Manasse, con Bet-Scean, Dor, En-Dor, Taanac e Meghiddo, la serie di città forti lungo la valle, ma Manasse non cacciò i loro abitanti, «essendo i Cananei decisi a restare in quel paese». La città levitica Bileam, data ai Keatiti da Manasse, è lo stesso luogo, e la Gat-Rimmon dell’elenco parallelo in Giosuè è probabilmente un errore di un copista per essa."
    - "Due re trovarono la fine a Ibleam o presso di essa. Quando Ieu cavalcò verso Izreel e uccise Ioram, Acazia di Giuda fuggì per la strada della casa del giardino; gli uomini di Ieu lo colpirono «alla salita di Gur, ch’è vicino a Ibleam. E Achazia fuggì a Meghiddo, e quivi morì». Quasi novant’anni dopo Zaccaria figlio di Geroboamo II fu assassinato da Sallum dopo sei mesi di regno, «in presenza del popolo» nel testo ebraico, ma «a Ibleam» in una tradizione manoscritta greca che molti studiosi seguono, poiché la strana frase ebraica somiglia al nome del luogo."
    - "Gottlieb Schumacher descrisse nel 1910 i primi 30 m del tunnel idrico scavato nella roccia di Khirbet Belameh; archeologi palestinesi e olandesi sotto Hamdan Taha ne liberarono circa 115 m nel 1996–1997, un alto passaggio con gradini scavati nella roccia che scendono alla sorgente ai piedi della collina, un sistema come quelli di Meghiddo e di Asor e probabilmente dell’età del Ferro, benché la data poggi su inferenze. Il sito si trova all’ingresso meridionale di Jenin in Cisgiordania."
  nl:
    - "Jibleam was een Kanaänitische stad aan de zuidrand van de vallei van Jizreël, waar de weg uit de vallei zuidwaarts door de heuvels omhoog klimt richting Dotan en Samaria. Zij wordt vereenzelvigd met Khirbet Belameh, een heuvel aan de zuidelijke rand van Jenin, wiens naam de oude bewaart; Egyptische lijsten van Thoetmosis III uit de 15e eeuw v.Chr. vermelden haar al. Jozua wijst haar toe aan Manasse, met Beth-Sean, Dor, En-Dor, Taänach en Megiddo, de reeks sterke steden langs de vallei, maar Manasse verdreef hun inwoners niet, “en de Kanaanieten wilden wonen in hetzelve land”. De Levietenstad Bileam, uit Manasse aan de Kehatieten gegeven, is dezelfde plaats, en het Gat-Rimmon van de parallelle lijst in Jozua is waarschijnlijk een schrijffout van een kopiist voor Bileam."
    - "Twee koningen vonden hun einde bij of nabij Jibleam. Toen Jehu naar Jizreël reed en Joram doodde, vluchtte Achazia van Juda via het tuinhuis; Jehu’s mannen sloegen hem “aan den opgang naar Gur, die bij Jibleam is; en hij vlood naar Megiddo, en stierf aldaar”. Bijna negentig jaar later werd Zacharia, zoon van Jerobeam II, na zes maanden op de troon door Sallum vermoord, “voor het volk” in de Hebreeuwse tekst, maar “in Jibleam” in een Griekse handschriftenlijn die veel geleerden volgen, omdat de vreemde Hebreeuwse uitdrukking op de plaatsnaam lijkt."
    - "Gottlieb Schumacher beschreef in 1910 de eerste 30 m van de in de rots uitgehouwen watertunnel van Khirbet Belameh; Palestijnse en Nederlandse archeologen onder Hamdan Taha ruimden in 1996–1997 ongeveer 115 m ervan op, een hoge gang met in de rots uitgehouwen treden naar de bron aan de voet van de heuvel, een systeem als dat van Megiddo en Hazor en waarschijnlijk uit de IJzertijd, al berust de datering op gevolgtrekking. De plaats ligt aan de zuidingang van Jenin op de Westoever."
  cs:
    - "Jibleam bylo kanaánské město na jižním okraji Jizreelského údolí, kde cesta z údolí stoupá na jih horami k Dótanu a Samaří. Ztotožňuje se s Chirbet Belameh, pahorkem na jižním okraji Džanínu, jehož jméno zachovává staré; egyptské seznamy Thutmose III. z 15. stol. př. n. l. je již zaznamenávají. Jozue je přiděluje Manasesovi, s Bét-šeanem, Dórem, Endórem, Taanachem a Megidem, řadou silných měst podél údolí, ale Manases jejich obyvatele nevyhnal, „i počal Kananejský svobodně bydliti v zemi té“. Levitské město Bileam, dané Kehatovcům z Manasesova území, je totéž místo a Gat-rimmon z paralelního seznamu v Jozue je pravděpodobně opisovačský přepis za něj."
    - "Dva králové našli konec u Jibleamu nebo poblíž něj. Když Jehú jel do Jizreelu a zabil Jorama, Achazjáš Judský prchal kolem zahradního domu; Jehúovi muži jej ranili, „když vyjížděl k Guru, kteréž jest podlé Jibleam. I utekl do Mageddo a tam umřel“. Téměř devadesát let později byl Zacharjáš, syn Jarobeámův II., po šesti měsících vlády zavražděn Šalumem, v hebrejském textu „před lidem“, ale v řecké rukopisné tradici, kterou mnozí učenci následují, „v Jibleamu“, protože podivná hebrejská fráze vypadá jako místní jméno."
    - "Gottlieb Schumacher popsal roku 1910 prvních 30 m ve skále vytesaného vodního tunelu Chirbet Belameh; palestinští a nizozemští archeologové pod vedením Hamdana Tahy vyčistili v letech 1996–1997 asi 115 m z něj, vysokou chodbu s ve skále vytesanými schody vedoucími dolů k prameni na úpatí pahorku, systém jako v Megidu a Chacoru a pravděpodobně z doby železné, ačkoli datování se opírá o úsudek. Místo leží na jižním vstupu do Džanínu na Západním břehu."
  sv:
    - "Jivleam var en kananeisk stad vid södra kanten av Jisreeldalen, där vägen från dalen klättrar söderut genom bergen mot Dotan och Samaria. Den identifieras med Khirbet Belameh, en kulle i södra utkanten av Jenin, vars namn bevarar det gamla; egyptiska förteckningar av Tutmosis III på 1400-talet f.Kr. upptar den redan. Josua tilldelar den Manasse, med Bet-Shean, Dor, En-Dor, Taanak och Megiddo, raden av starka städer längs dalen, men Manasse fördrev inte deras invånare, ”utan kananéerna förmådde hålla sig kvar där i landet”. Levitstaden Bileam, given åt kehatiterna ur Manasse, är samma plats, och Gat-Rimmon i parallellförteckningen hos Josua är sannolikt en avskrivares misstag för den."
    - "Två kungar mötte sitt slut vid eller nära Jivleam. När Jehu red till Jisreel och dödade Joram flydde Achasja av Juda förbi Trädgårdshuset; Jehus män slog honom ”på Gurhöjden vid Jibleam; men han flydde vidare till Megiddo och dog där”. Nästan nittio år senare mördades Sakarja, Jerobeam II:s son, av Shallum efter sex månader på tronen, ”i folkets åsyn” i den hebreiska texten, men ”i Jivleam” i en grekisk handskriftstradition som många forskare följer, eftersom den märkliga hebreiska frasen ser ut som ortnamnet."
    - "Gottlieb Schumacher beskrev de första 30 m av den berghuggna vattentunneln i Khirbet Belameh 1910; palestinska och nederländska arkeologer under Hamdan Taha rensade omkring 115 m av den 1996–1997, en hög gång med berghuggna trappsteg som leder ned till källan vid kullens fot, ett system likt dem i Megiddo och Hasor och sannolikt från järnåldern, fast dateringen vilar på slutledning. Platsen ligger vid södra ingången till Jenin på Västbanken."
  nb:
    - "Jibleam var en kanaanittisk by i sørkanten av Jisreel-dalen, der veien fra dalen stiger sørover gjennom åsene mot Dotan og Samaria. Den identifiseres med Khirbet Belameh, en haug i sørkanten av Jenin, hvis navn bevarer det gamle; egyptiske lister fra Thutmosis 3. på 1400-tallet f.Kr. oppfører den allerede. Josva tildeler den til Manasse, sammen med Bet-Sjean, Dor, En-Dor, Taanak og Megiddo, rekken av sterke byer langs dalen, men Manasses barn «maktet ikke å innta disse byer, og det lyktes kana'anittene å bli boende der i landet». Levittbyen Bileam, gitt til kehatittene av Manasse, er det samme stedet, og Gat-Rimmon i den parallelle listen hos Josva er trolig en avskrivers feil for den."
    - "To konger fant sin ende ved eller nær Jibleam. Da Jehu red til Jisreel og drepte Joram, flyktet Ahasja av Juda ved havehuset; Jehus menn slo ham ned «i hans vogn i Gur-kleven ved Jibleam, og han flyktet til Megiddo og døde der». Nesten nitti år senere ble Sakarja, Jeroboam 2.s sønn, myrdet av Sjallum etter seks måneder på tronen, «i folkets påsyn» i den hebraiske teksten, men i Jibleam i en gresk håndskrifttradisjon som mange forskere følger, siden den merkelige hebraiske frasen ligner stedsnavnet."
    - "Gottlieb Schumacher beskrev de første 30 m av den fjellhuggede vanntunnelen i Khirbet Belameh i 1910; palestinske og nederlandske arkeologer under Hamdan Taha frilegte omtrent 115 m av den i 1996–1997, en høy gang med fjellhuggede trinn som fører ned til kilden ved foten av høyden, et system som de i Megiddo og Hasor og trolig fra jernalderen, selv om dateringen hviler på slutning. Stedet ligger ved sørinngangen til Jenin på Vestbredden."
  tl:
    - "Ang Ibleam ay isang bayang Cananeo sa timog na gilid ng libis ng Jezreel, kung saan umaakyat ang daan mula sa libis patimog sa mga burol patungong Dotan at Samaria. Itinutugma ito sa Khirbet Belameh, isang burol sa timog na labas ng Jenin, na nagtataglay ng lumang pangalan; nakatala na ito sa mga talaang Egipcio ni Thutmose III noong ika-15 siglo BK. Itinatalaga ito ni Josue sa Manases, kasama ang Beth-sean, Dor, En-dor, Taanach at Megiddo, ang hanay ng matitibay na bayan sa tabi ng libis, ngunit hindi napalayas ng Manases ang mga naninirahan, “kundi ang mga Cananeo ay nanahan sa lupaing yaon”. Ang bayang Levita na Bilam, na ibinigay sa mga Coatita mula sa Manases, ay iisang lugar, at ang Gath-rimmon ng kahambing na talaan sa Josue ay marahil kamalian ng tagakopya para rito."
    - "Dalawang hari ang nagwakas sa Ibleam o malapit dito. Nang sumakay si Jehu patungong Jezreel at patayin si Joram, tumakas si Ochozias ng Juda sa daan ng bahay sa halamanan; sinaktan siya ng mga tauhan ni Jehu “sa ahunan sa Gur, na nasa siping ng Ibleam. At siya'y tumakas na napatungo sa Megiddo, at namatay roon”. Halos siyamnapung taon pagkaraan, pinatay ni Sallum si Zacharias na anak ni Jeroboam II matapos ang anim na buwan sa trono, “sa harap ng bayan” ayon sa tekstong Hebreo, ngunit “sa Ibleam” sa isang tradisyon ng manuskritong Griyego na sinusunod ng maraming iskolar, yamang ang kakaibang pariralang Hebreo ay tila pangalan ng lugar."
    - "Inilarawan ni Gottlieb Schumacher ang unang 30 m ng lagusang tubig na tinabas sa bato ng Khirbet Belameh noong 1910; nilinis ng mga arkeologong Palestino at Olandes sa ilalim ni Hamdan Taha ang mga 115 m nito noong 1996–1997, isang mataas na daanan na may mga baitang na tinabas sa bato pababa sa bukal sa paanan ng burol, isang sistemang gaya ng sa Megiddo at Hasor at marahil ng Panahong Bakal, bagaman nakasalig sa hinuha ang petsa. Ang lugar ay nasa timog na pasukan ng Jenin sa West Bank."
  da:
    - "Jible'am var en kana'anæisk by i den sydlige udkant af Jizre'el-dalen, hvor vejen fra dalen stiger mod syd gennem bjergene mod Dotan og Samaria. Den identificeres med Khirbet Belameh, en høj i den sydlige udkant af Jenin, hvis navn bevarer det gamle; egyptiske lister fra Thutmose III i 1400-tallet f.Kr. registrerer den allerede. Josva tildeler den Manasse, sammen med Bet-Sjan, Dor, En-Dor, Ta'anak og Megiddo, rækken af stærke byer langs dalen, men Manasse fordrev ikke deres indbyggere, »men Kananiten boede roligt i samme Land«. Den levitiske by Bil'am, givet til kehatitterne af Manasse, er det samme sted, og Gat-Rimmon i den parallelle liste hos Josva er sandsynligvis en afskrivers fejl for den."
    - "To konger mødte deres ende ved eller nær Jible'am. Da Jehu red til Jizre'el og dræbte Joram, flygtede Akazja af Juda ad havehuset; Jehus mænd ramte ham »ved Opgangen til Gur, der ligger ved Jibleam; og han flyede til Megiddo og døde der«. Næsten halvfems år senere blev Zakarias, søn af Jeroboam II, myrdet af Sjallum efter seks måneder på tronen, »i Folkets Paasyn« i den hebraiske tekst, men »i Jible'am« i en græsk håndskrifttradition, som mange forskere følger, da den mærkelige hebraiske vending ligner stednavnet."
    - "Gottlieb Schumacher beskrev de første 30 m af Khirbet Belamehs klippehuggede vandtunnel i 1910; palæstinensiske og hollandske arkæologer under Hamdan Taha ryddede omkring 115 m af den i 1996–1997, en høj gang med klippehuggede trin, der fører ned til kilden ved bakkens fod, et system som dem i Megiddo og Hazor og sandsynligvis fra jernalderen, skønt dateringen hviler på slutninger. Stedet ligger ved sydindgangen til Jenin på Vestbredden."
  sr:
    - "Ивлеам је био ханански град на јужном ободу долине Језраела, где се пут из долине пење на југ кроз брда према Дотаиму и Самарији. Поистовећује се с Хирбет Беламеом, хумком на јужном ободу Џенина, чије име чува старо; египатски списци Тутмеса III из петнаестог века п. н. е. већ га бележе. Исус га додељује Манасији, са Вет-Саном, Дором, Ендором, Танахом и Мегидом, низом јаких градова уз долину, али Манасија није истерала њихове становнике, „и Хананеји стадоше живети у тој земљи“. Левитски град Вилеам, дат Катовцима из Манасије, је исто место, а Гат-Римон паралелног списка у Исусу вероватно је писарева омашка за њега."
    - "Два цара нашла су свој крај код Ивлеама или близу њега. Кад је Јуј појахао у Језраел и убио Јорама, Охозија Јудин побегао је к дому у врту; Јујеви људи „ранише га на брду Гуру, које је код Ивлеама. И утече у Мегидон, и онде умре“. Скоро деведесет година касније Захарија, Јеровоамов син, убијен је од Салума после шест месеци на престолу, „пред народом“ по хебрејском тексту, али „у Ивлеаму“ у традицији грчких рукописа коју многи научници следе, јер необична хебрејска фраза изгледа као име места."
    - "Готлиб Шумахер описао је првих 30 м у стени исклесаног воденог тунела Хирбет Беламеа 1910; палестински и холандски археолози под Хамданом Тахом очистили су око 115 м тунела 1996–1997, висок пролаз са степеницама урезаним у стену које воде доле до извора у подножју брда, систем као они у Мегиду и Асору, вероватно из гвозденог доба, мада датовање почива на закључку. Налазиште лежи на јужном улазу у Џенин на Западној обали."
  hu:
    - "Jibleám kánaáni város volt a Jezréel-völgy déli szélén, ahol a völgyből az út dél felé emelkedik a dombokon át Dótán és Szamária felé. Hirbet Belamával azonosítják, egy halommal Dzsenín déli peremén, amelynek neve megőrzi a régit; III. Thutmószisz Kr. e. 15. századi egyiptomi jegyzékei már említik. Józsué Manassénak adja Bét-Seánnal, Dórral, Endórral, Taanakkal és Megiddóval, a völgy menti erős városok sorával, de Manassé nem űzte ki lakóikat, mert „a Kananeusnak tetszett ott lakni azon a földön”. A Kehát lévitáinak Manassé területéből adott Bileám lévita város ugyanaz a hely, a Józsué párhuzamos jegyzékében szereplő Gát-Rimmón pedig valószínűleg másolói elírás helyette."
    - "Két király vesztette életét Jibleámnál vagy közelében. Amikor Jéhu Jezréelbe lovagolt, és megölte Jórámot, Ahazja, Júda királya a kerti ház mellett menekült; Jéhu emberei „megsebesíték őt a Gúr hágójánál, a mely Jibleám mellett van; és ő Megiddóba menekülvén, ott meghalt”. Majdnem kilencven évvel később II. Jeroboám fia, Zakariás hat hónapi uralkodás után Sallum kezétől halt meg, a héber szövegben „a nép szeme láttára”, ám egy görög kéziratos hagyományban Jibleámban, amelyet sok kutató követ, mivel a különös héber kifejezés helynévnek látszik."
    - "Gottlieb Schumacher 1910-ben leírta a Hirbet Belama sziklába vájt víz alagútjának első 30 m-ét; Hamdan Taha vezetésével palesztin és holland régészek 1996–1997-ben mintegy 115 m-ét kitisztították, magas folyosót sziklába vájt lépcsőkkel, amelyek a domb lábánál lévő forráshoz vezetnek, a Megiddóéhoz és Hácóréhoz hasonló rendszert, valószínűleg a vaskorból, bár a keltezés következtetésen alapul. A lelőhely Dzsenín déli bejáratánál van Ciszjordániában."
  fi:
    - "Jibleam oli kanaanilainen kaupunki Jisreelin laakson eteläreunalla, missä laaksosta lähtevä tie nousee etelään kukkuloiden halki kohti Dotania ja Samariaa. Se tunnistetaan Khirbet Belamehiksi, kummuksi Jeninin eteläisillä laitamilla, jonka nimi säilyttää vanhan; Tuthmosis III:n egyptiläiset luettelot 1400-luvulla eaa. kirjaavat sen jo. Joosua antaa sen Manasselle Bet-Seanin, Dorin, Endorin, Taanakin ja Megiddon kanssa, laakson varrella olevien vahvojen kaupunkien ketju, mutta Manasse ei karkottanut niiden asukkaita, ”vaan kanaanilaisten onnistui jäädä asumaan siihen maahan”. Leeviläiskaupunki Bileam, kehatilaisille Manassesta annettu, on sama paikka, ja Joosuan rinnakkaisluettelon Gat-Rimmon on luultavasti kopioijan lipsahdus sen tilalla."
    - "Kaksi kuningasta kohtasi loppunsa Jibleamissa tai sen lähellä. Kun Jehu ratsasti Jisreeliin ja tappoi Joramin, Juudan Ahasja pakeni puutarhatalon ohi; Jehun miehet löivät hänet ”Guurin solassa, joka on Jibleamin luona; mutta hän pakeni Megiddoon ja kuoli siellä”. Lähes yhdeksänkymmentä vuotta myöhemmin Jerobeam II:n poika Sakarja murhattiin Sallumin toimesta kuuden kuukauden valtakauden jälkeen ”kansan nähden” heprealaisessa tekstissä, mutta ”Jibleamissa” kreikkalaisessa käsikirjoitusperinteessä, jota monet tutkijat seuraavat, sillä outo heprealainen ilmaus näyttää paikannimeltä."
    - "Gottlieb Schumacher kuvasi Khirbet Belamehin kallioon hakatun vesitunnelin ensimmäiset 30 m vuonna 1910; palestiinalaiset ja hollantilaiset arkeologit Hamdan Tahan johdolla puhdistivat siitä noin 115 m vuosina 1996–1997, korkean käytävän kallioon hakattuine portaineen, jotka johtavat kukkulan juurella olevalle lähteelle, järjestelmän kuten Megiddon ja Hasorin ja luultavasti rautakautisen, vaikka ajoitus perustuu päätelmiin. Paikka sijaitsee Jeninin eteläsisäänkäynnillä Länsirannalla."
  vi:
    - "Gíp-lê-am là một thành Ca-na-an ở rìa nam thung lũng Gít-rê-ên, nơi con đường từ thung lũng leo về phía nam qua các đồi hướng Đô-than và Sa-ma-ri. Thành được đồng nhất với Khirbet Belameh, một gò ở ngoại ô phía nam Jenin, có tên giữ lại tên cũ; các bảng liệt kê của Thutmose III vào thế kỷ 15 TCN đã ghi thành. Giô-suê giao thành cho Ma-na-se, cùng Bết-Sê-an, Đô-rơ, Ên-Đô-rơ, Tha-a-nác và Mê-ghi-đô, chuỗi các thành vững chắc dọc thung lũng, nhưng Ma-na-se không đuổi được cư dân, “vì dân Ca-na-an quyết định ở trong xứ ấy”. Bi-lê-am, thành của người Lê-vi ban cho dòng Kê-hát từ Ma-na-se, là cùng một nơi, và Gát-Rim-môn trong bảng song song của sách Giô-suê có lẽ là sự chép nhầm của người sao chép thay cho nó."
    - "Hai vua gặp kết cuộc tại hoặc gần Gíp-lê-am. Khi Giê-hu cưỡi xe đến Gít-rê-ên và giết Giô-ram, A-cha-xia của Giu-đa chạy trốn qua lầu vườn; người của Giê-hu đánh ông: “Họ bèn hãm đánh người, tại nơi dốc Gu-rơ, gần Gíp-lê-am. Đoạn, A-cha-xia trốn đến Mê-ghi-đô, và chết tại đó”. Gần chín mươi năm sau, Xa-cha-ri con Giê-rô-bô-am II bị Sa-lum giết sau sáu tháng trị vì, “đánh giết người tại trước mặt dân sự” trong bản Hê-bơ-rơ, nhưng “tại Gíp-lê-am” trong một truyền thống bản thảo Hy Lạp mà nhiều học giả theo, vì cụm Hê-bơ-rơ lạ có vẻ là địa danh."
    - "Gottlieb Schumacher mô tả 30 m đầu của đường hầm nước đục trong đá ở Khirbet Belameh năm 1910; các nhà khảo cổ Palestine và Hà Lan dưới Hamdan Taha đã dọn khoảng 115 m của nó năm 1996–1997, một lối đi cao với các bậc đục trong đá dẫn xuống con suối ở chân đồi, một hệ thống giống như của Mê-ghi-đô và Hát-so và có lẽ thuộc thời Đồ Sắt, dù niên đại dựa vào suy luận. Địa điểm nằm ở cửa nam Jenin ở Bờ Tây."
  ro:
    - "Ibleam era un oraș canaanit la marginea de sud a văii Izreelului, unde drumul din vale urcă spre sud prin dealuri către Dotan și Samaria. Este identificat cu Khirbet Belameh, o movilă la periferia sudică a Jeninului, al cărei nume păstrează numele vechi; listele egiptene ale lui Tutmes al III-lea din secolul al XV-lea î.Hr. îl consemnează deja. Iosua îl atribuie lui Manase, împreună cu Bet-Șean, Dor, Endor, Taanac și Meghido, șirul de orașe puternice de-a lungul văii, dar Manase nu le-a izgonit locuitorii, căci canaaniții voiau să rămână în acel ținut. Orașul levitic Bileam, dat chehatiților din Manase, este același loc, iar Gat-Rimon din lista paralelă din Iosua este probabil o greșeală de copist pentru el."
    - "Doi regi și-au aflat sfârșitul la Ibleam sau lângă el. Când Iehu a mers la Izreel și l-a ucis pe Ioram, Ahazia al lui Iuda a fugit pe lângă casa grădinii; oamenii lui Iehu l-au lovit „în car când se duceà la Gai, care este lângă Ievlam, și a fugit în Maghedò, și a murit acolo”. Aproape nouăzeci de ani mai târziu, Zaharia, fiul lui Ieroboam al II-lea, a fost ucis de Șalum după șase luni de domnie, „înaintea poporului” în textul ebraic, dar „în Ibleam” într-o tradiție de manuscrise grecești pe care mulți cercetători o urmează, fiindcă ciudata expresie ebraică seamănă cu numele locului."
    - "Gottlieb Schumacher a descris în 1910 primii 30 m ai tunelului de apă săpat în stâncă din Khirbet Belameh; arheologi palestinieni și olandezi sub conducerea lui Hamdan Taha au curățat aproximativ 115 m din el în 1996–1997, un pasaj înalt cu trepte tăiate în stâncă care coboară la izvorul de la poalele dealului, un sistem asemănător celor din Meghido și Hațor și probabil din Epoca Fierului, deși data se sprijină pe deducție. Locul se află la intrarea de sud în Jenin, în Cisiordania."
  bg:
    - "Ивлеам беше ханаански град на южния край на Изреелската долина, където пътят от долината се изкачва на юг през хълмовете към Дотан и Самария. Отъждествява се с Хирбет Беламе, могила в южните покрайнини на Дженин, чието име пази старото; египетските списъци на Тутмос III от XV в. пр.н.е. вече го записват. Книгата на Иисус Навин го отрежда на Манасия заедно с Бет-Шеан, Дор, Ендор, Танах и Мегидо — веригата силни градове покрай долината, но Манасия не изгони жителите им, „но Ханаанците се решиха да живеят в онова място“. Левитският град Билеам, даден на каатовците от Манасия, е същото място, а Гат-Римон от успоредния списък в книгата на Иисус Навин вероятно е грешка на преписвач вместо него."
    - "Двама царе намериха смъртта си при Ивлеам или близо до него. Когато Йеху препусна към Изреел и уби Йорам, Охозия Юдейски побягна покрай градинската къща; мъжете на Йеху го поразиха „в изхода на Гур, близу до Ивлеам; и побягна в Магедон, и умря там“. Почти деветдесет години по-късно Захария, синът на Йеровоам II, беше убит от Шалум след шест месеца на престола — „пред людете“ според еврейския текст, но „в Ивлеам“ според една гръцка ръкописна традиция, която много учени следват, понеже странният еврейски израз прилича на името на мястото."
    - "Готлиб Шумахер описа първите 30 м от изсечения в скалата воден тунел на Хирбет Беламе през 1910 г.; палестински и нидерландски археолози под ръководството на Хамдан Таха разчистиха около 115 м от него през 1996–1997 г. — висок проход с изсечени в скалата стъпала, водещ надолу към извора в подножието на хълма, система като тези в Мегидо и Хацор и вероятно от желязната епоха, макар датата да почива на заключения. Мястото лежи при южния вход на Дженин на Западния бряг."
