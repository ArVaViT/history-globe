# Overview article (ADR 0007). Mainstream facts only; the reading “in Ibleam” in 2 Kings 15:10 is reported as the Greek variant many scholars accept; Khirbet Belameh is the accepted site.
id: ibleam
place: a878d66
title:
  en: "Ibleam"
  ru: "Ивлеам"
  uk: "Івлеам"
  es: "Ibleam"
  pt: "Ibleão"
