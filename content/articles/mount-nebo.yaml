body:
  en:
    - "Mount Nebo is the height on the western edge of the Moabite plateau, opposite Jericho, from which Moses saw the promised land before he died. The Bible names it only twice. God tells Moses, “Get thee up into this mountain Abarim, unto mount Nebo, which is in the land of Moab, that is over against Jericho; and behold the land of Canaan”; and at the end of Deuteronomy “Moses went up from the plains of Moab unto the mountain of Nebo, to the top of Pisgah”, was shown the land “unto Dan” and died there. Nebo is one summit of the Abarim range; how it relates to Pisgah is not certain, and the two names are usually taken for the ridge and its top."
    - "The mountain is generally placed at Jebel Neba and its western spur Ras Siyagha, about 9 km north-west of Madaba, where the map point stands; the name survives there, and Eusebius put Nabau six miles west of Heshbon. The map also marks Jebel Osha near es-Salt, farther north in Gilead, as a much less likely candidate. Pilgrims came to Siyagha by the fourth century: Egeria found a church and monks there. The Franciscans have excavated its Byzantine basilica and mosaics since 1933, and the Memorial of Moses on the summit is today one of the best-known sites of Jordan."
  ru:
    - "Гора Нево — высота на западном краю Моавитского плато против Иерихона, откуда Моисей перед смертью видел обетованную землю. По имени Библия называет её лишь дважды. Бог говорит Моисею: «взойди на сию гору Аварим, на гору Нево, которая в земле Моавитской, против Иерихона, и посмотри на землю Ханаанскую»; а в конце Второзакония «взошел Моисей с равнин Моавитских на гору Нево, на вершину Фасги», увидел землю «до самого Дана» и там умер. Нево — одна из вершин хребта Аварим; как она соотносится с Фасгой, точно не известно, и оба имени обычно понимают как хребет и его вершину."
    - "Гору обычно помещают на Джебель-Неба и его западный выступ Рас-Сияга, примерно в 9 км к северо-западу от Мадабы, где стоит точка на карте; имя там сохранилось, и Евсевий помещал Навав в шести милях к западу от Есевона. На карте отмечена и Джебель-Оша близ Эс-Салта, севернее, в Галааде, как гораздо менее вероятный вариант. Паломники приходили на Сиягу уже в IV веке: Эгерия застала там церковь и монахов. Францисканцы с 1933 года раскапывают здешнюю византийскую базилику с мозаиками, и Мемориал Моисея на вершине сегодня — одно из самых известных мест Иордании."
  uk:
    - "Гора Нево — висота на західному краю моавитського плато, навпроти Єрихону, звідки Мойсей побачив обіцяну землю перед смертю. Біблія називає її лише двічі. Бог каже Мойсею: «Вийди на сї гори Абарим, на гору Небо, що в землї Моабській, проти Єрихону, і подивись на Канаан землю»; а наприкінці Повторення Закону «І зійшов Мойсей з Моабового поділля на Небо гору, на верх Пизги, що проти Єрихону», йому показано землю «до Дану», і він помер там. Нево — одна вершина хребта Аварім; як вона співвідноситься з Фасгою, непевно, і дві назви зазвичай розуміють як хребет і його вершину."
    - "Гору загалом розміщують у Джебель-Неба та її західному відрозі Рас-Сіягга, приблизно за 9 км на північний захід від Мадаби, де стоїть точка мапи; там зберігається назва, а Євсевій розмістив Набау за шість миль на захід від Гесбона. Мапа також позначає Джебель-Оша біля ес-Сальта, далі на північ у Гілеаді, як значно менш імовірного кандидата. Прочани приходили до Сіягги вже в IV ст.: Егерія знайшла там церкву й ченців. Францисканці розкопують її візантійську базиліку й мозаїки від 1933 р., а Меморіал Мойсея на вершині — нині одне з найвідоміших місць Йорданії."
  es:
    - "El monte Nebo es la altura del borde occidental de la meseta de Moab, frente a Jericó, desde la que Moisés vio la tierra prometida antes de morir. La Biblia lo nombra solo dos veces. Dios dice a Moisés: «Sube á este monte de Abarim, al monte Nebo, que está en la tierra de Moab, que está en derecho de Jericó, y mira la tierra de Canaán»; y al final de Deuteronomio, «subió Moisés de los campos de Moab al monte de Nebo, á la cumbre de Pisga», se le mostró la tierra «hasta Dan» y murió allí. El Nebo es una cumbre de la cordillera de Abarim; cómo se relaciona con Pisga no es seguro, y los dos nombres suelen tomarse por la cresta y su cima."
    - "La montaña se sitúa generalmente en el Yebel Neba y su espolón occidental Ras Siyagha, a unos 9 km al noroeste de Madaba, donde está el punto del mapa; el nombre sobrevive allí, y Eusebio puso Nabau a seis millas al oeste de Hesbón. El mapa marca también el Yebel Osha, cerca de es-Salt, más al norte en Galaad, como candidato mucho menos probable. Los peregrinos llegaban a Siyagha ya en el siglo IV: Egeria halló allí una iglesia y monjes. Los franciscanos excavan su basílica bizantina y sus mosaicos desde 1933, y el Memorial de Moisés en la cumbre es hoy uno de los sitios más conocidos de Jordania."
  pt:
    - "O monte Nebo é a altura na borda ocidental do planalto moabita, defronte de Jericó, de onde Moisés viu a terra prometida antes de morrer. A Bíblia o nomeia apenas duas vezes. Deus diz a Moisés: “Suba a esta montanha de Abarim, ao Monte Nebo, que está na terra de Moabe, em frente a Jericó; e veja a terra de Canaã”; e no fim de Deuteronômio “Moisés subiu das campinas de Moabe ao monte Nebo, ao topo de Pisga”, foi-lhe mostrada a terra “até Dã” e morreu ali. O Nebo é um cume da cordilheira de Abarim; como se relaciona com Pisga não é certo, e os dois nomes costumam ser tomados pela crista e seu topo."
    - "A montanha é geralmente situada no Jebel Neba e seu esporão ocidental Ras Siyagha, a cerca de 9 km a noroeste de Madaba, onde está o ponto do mapa; o nome sobrevive ali, e Eusébio pôs Nabau a seis milhas a oeste de Hesbom. O mapa marca também o Jebel Osha, perto de es-Salt, mais ao norte em Gileade, como candidato bem menos provável. Peregrinos vinham a Siyagha já no século IV: Egéria achou ali uma igreja e monges. Os franciscanos escavam sua basílica bizantina e mosaicos desde 1933, e o Memorial de Moisés no cume é hoje um dos sítios mais conhecidos da Jordânia."
  de:
    - "Der Nebo ist die Anhöhe am Westrand der moabitischen Hochebene, gegenüber Jericho, von der Mose das verheißene Land sah, ehe er starb. Die Bibel nennt ihn nur zweimal. Gott sagt zu Mose: „Gehe auf das Gebirge Abarim, auf den Berg Nebo, der da liegt im Moabiterland, gegenüber Jericho, und schaue das Land Kanaan“; und am Ende des 5. Buches Mose: „Und Mose ging von dem Gefilde der Moabiter auf den Berg Nebo, auf die Spitze des Gebirges Pisga, gegenüber Jericho“, ihm wurde das Land gezeigt „bis gen Dan“, und er starb dort. Der Nebo ist ein Gipfel des Abarim-Gebirges; wie er sich zum Pisga verhält, ist nicht sicher, und die beiden Namen gelten meist für den Rücken und seine Spitze."
    - "Der Berg wird allgemein am Jebel Neba und seinem westlichen Ausläufer Ras Siyagha angesetzt, etwa 9 km nordwestlich von Madaba, wo der Punkt der Karte steht; dort lebt der Name fort, und Eusebius setzte Nabau sechs Meilen westlich von Heschbon an. Die Karte zeigt auch den Jebel Osha bei es-Salt, weiter nördlich in Gilead, als viel weniger wahrscheinlichen Kandidaten. Pilger kamen im 4. Jahrhundert nach Siyagha: Egeria fand dort eine Kirche und Mönche. Die Franziskaner graben seit 1933 seine byzantinische Basilika und Mosaiken aus, und das Mose-Denkmal auf dem Gipfel ist heute eine der bekanntesten Stätten Jordaniens."
  fr:
    - "Le mont Nebo est la hauteur au bord occidental du plateau moabite, en face de Jéricho, d’où Moïse vit la terre promise avant de mourir. La Bible ne le nomme que deux fois. Dieu dit à Moïse : « Monte sur cette montagne d’Abarim, sur le mont Nebo, au pays de Moab, vis-à-vis de Jéricho ; et regarde le pays de Canaan » ; et à la fin du Deutéronome « Moïse monta des plaines de Moab sur le mont Nebo, au sommet du Pisga », se vit montrer le pays « Galaad jusqu’à Dan » et mourut là. Le Nebo est un sommet de la chaîne des Abarim ; son rapport avec le Pisga n’est pas certain, et les deux noms sont d’ordinaire pris pour la crête et son sommet."
    - "On place généralement la montagne au djebel Neba et à son éperon occidental Ras Siyagha, à environ 9 km au nord-ouest de Madaba, où se trouve le point de la carte ; le nom y survit, et Eusèbe plaçait Nabau à six milles à l’ouest de Hesbon. La carte marque aussi le djebel Osha près d’es-Salt, plus au nord en Galaad, comme candidat bien moins probable. Des pèlerins venaient à Siyagha dès le IVe siècle : Égérie y trouva une église et des moines. Les franciscains en fouillent la basilique byzantine et les mosaïques depuis 1933, et le Mémorial de Moïse au sommet est aujourd’hui l’un des sites les plus connus de Jordanie."
  it:
    - "Il Monte Nebo è l’altura sul margine occidentale dell’altopiano moabita, di fronte a Gerico, da cui Mosè vide la terra promessa prima di morire. La Bibbia lo nomina solo due volte. Dio dice a Mosè: «Sali su questo monte di Abarim, sul monte Nebo, ch’è nel paese di Moab, di faccia a Gerico, e mira il paese di Canaan»; e alla fine del Deuteronomio «Mosè salì dalle pianure di Moab sul Monte Nebo, in vetta al Pisga», gli fu mostrata la terra «fino a Dan» e morì là. Il Nebo è una cima della catena degli Abarim; come si rapporti al Pisga non è certo, e i due nomi sono di solito intesi come la dorsale e la sua cima."
    - "Il monte è generalmente posto al Jebel Neba e al suo sperone occidentale Ras Siyagha, a circa 9 km a nord-ovest di Màdaba, dove si trova il punto della mappa; il nome vi sopravvive, ed Eusebio poneva Nabau a sei miglia a ovest di Chesbon. La mappa segna anche il Jebel Osha presso es-Salt, più a nord in Galaad, come candidato molto meno probabile. I pellegrini giungevano a Siyagha già nel IV secolo: Egeria vi trovò una chiesa e dei monaci. I Francescani scavano dal 1933 la sua basilica bizantina e i suoi mosaici, e il Memoriale di Mosè sulla cima è oggi uno dei siti più noti della Giordania."
  pl:
    - "Góra Nebo to wzniesienie na zachodnim skraju płaskowyżu Moabu, naprzeciw Jerycha, z którego Mojżesz ujrzał ziemię obiecaną, zanim umarł. Biblia wymienia ją tylko dwa razy. Bóg mówi Mojżeszowi: „Wstąp na tę górę Abarym, na górę Nebo, która jest w ziemi Moabskiej przeciw Jerychu, a oglądaj ziemię Chananejską”; a na końcu Księgi Powtórzonego Prawa „wstąpił Mojżesz z onych równin Moabskich na górę Nebo, na wierzch pagórka”, ukazano mu ziemię „aż do Dan” i tam umarł. Nebo to jeden ze szczytów pasma Abarim; jak odnosi się do Pisgi, nie jest pewne, a obie nazwy zwykle bierze się za grzbiet i jego szczyt."
    - "Górę umieszcza się zwykle w Dżabal Neba i jej zachodniej ostrodze Ras Siyagha, około 9 km na północny zachód od Madaby, gdzie stoi punkt mapy; nazwa tam przetrwała, a Euzebiusz umieszczał Nabau sześć mil na zachód od Cheszbonu. Mapa zaznacza też Dżabal Osha koło es-Salt, dalej na północ w Gileadzie, jako kandydata znacznie mniej prawdopodobnego. Pielgrzymi przybywali do Siyaghi już w IV w.: Egeria znalazła tam kościół i mnichów. Franciszkanie wykopują jej bizantyjską bazylikę i mozaiki od 1933 r., a Memoriał Mojżesza na szczycie jest dziś jednym z najlepiej znanych miejsc Jordanii."
  nl:
    - "De Nebo is de hoogte aan de westrand van het Moabitische plateau, tegenover Jericho, vanwaar Mozes het beloofde land zag voor hij stierf. De Bijbel noemt hem maar twee keer. God zegt tot Mozes: “Klim op den berg Abarim (deze is de berg Nebo, die in het land van Moab is, die tegenover Jericho is), en zie het land Kanaan”; en aan het eind van Deuteronomium “Toen ging Mozes op uit de vlakke velden van Moab, naar den berg Nebo, op de hoogten van Pisga”, kreeg het land te zien, “Gilead tot Dan toe”, en stierf daar. Nebo is één top van het Abarimgebergte; hoe hij zich tot de Pisga verhoudt is niet zeker, en de twee namen worden gewoonlijk opgevat als de rug en zijn top."
    - "De berg wordt algemeen geplaatst bij de Jebel Neba en zijn westelijke uitloper Ras Siyagha, zo'n 9 km ten noordwesten van Madaba, waar het punt van de kaart staat; de naam leeft daar voort, en Eusebius plaatste Nabau zes mijl ten westen van Chesbon. De kaart toont ook de Jebel Osha bij es-Salt, verder noordelijk in Gilead, als veel minder waarschijnlijke kandidaat. Pelgrims kwamen al in de vierde eeuw naar Siyagha: Egeria vond er een kerk en monniken. De Franciscanen graven sinds 1933 de Byzantijnse basiliek en mozaïeken op, en het Gedenkteken van Mozes op de top is tegenwoordig een van de bekendste plaatsen van Jordanië."
  cs:
    - "Hora Nebo je výšina na západním okraji moábské náhorní roviny, naproti Jerichu, z níž Mojžíš před smrtí spatřil zaslíbenou zemi. Bible ji jmenuje jen dvakrát. Bůh říká Mojžíšovi: „Vstup na horu tuto Abarim, na vrch Nébo, kteráž jest v zemi Moábské naproti Jerichu, a spatř zemi Kananejskou“; a na konci Deuteronomia „vstoupil Mojžíš z rovin Moábských na horu Nébo, na vrch hory, kteráž jest proti Jerichu“, byla mu ukázána země „až do Dan“ a tam zemřel. Nebo je jeden vrchol pohoří Abárím; jak se vztahuje k Pisze, není jisté, a obě jména se obvykle berou za hřbet a jeho vrchol."
    - "Hora se obecně klade na Jebel Neba a jeho západní ostroh Ras Siyagha, asi 9 km severozápadně od Madaby, kde stojí bod mapy; jméno tam přežívá a Eusebius kladl Nabau šest mil západně od Chešbónu. Mapa uvádí také Jebel Osha u es-Saltu, dále na sever v Gileadu, jako mnohem méně pravděpodobného kandidáta. Poutníci přicházeli do Siyaghy už ve 4. století: Egerie tam nalezla kostel a mnichy. Františkáni vykopávají její byzantskou baziliku a mozaiky od roku 1933 a Mojžíšův památník na vrcholu je dnes jedním z nejznámějších míst Jordánska."
  sv:
    - "Berget Nebo är höjden vid den moabitiska platåns västra kant, mitt emot Jeriko, varifrån Mose såg det utlovade landet innan han dog. Bibeln nämner det bara två gånger. Gud säger till Mose: ”Stig upp här på Abarimberget, på berget Nebo i Moabs land, gent emot Jeriko, så skall du få se Kanaans land”; och i slutet av Femte Mosebok gick Mose ”från Moabs hedar upp på berget Nebo, på toppen av Pisga, gent emot Jeriko”, fick se landet ”ända till Dan” och dog där. Nebo är en topp i Abarimkedjan; hur det förhåller sig till Pisga är inte säkert, och de två namnen tas vanligen för åsen och dess topp."
    - "Berget förläggs vanligen till Jebel Neba och dess västra utlöpare Ras Siyagha, omkring 9 km nordväst om Madaba, där kartans punkt står; namnet lever kvar där, och Eusebios förlade Nabau sex romerska mil väster om Heshbon. Kartan markerar också Jebel Osha nära es-Salt, längre norrut i Gilead, som en mycket mindre sannolik kandidat. Pilgrimer kom till Siyagha redan på 300-talet: Egeria fann en kyrka och munkar där. Franciskanerna har grävt ut dess bysantinska basilika och mosaiker sedan 1933, och Moses minnesmärke på toppen är i dag en av Jordaniens mest kända platser."
  nb:
    - "Nebo er høyden på vestkanten av det moabittiske høylandet, midt imot Jeriko, hvorfra Moses så det lovte landet før han døde. Bibelen nevner den bare to ganger. Gud sier til Moses: «Gå op på Abarim-fjellet her, på Nebo-fjellet i Moabs land midt imot Jeriko, og se ut over Kana'ans land»; og på slutten av Femte Mosebok: «Så gikk Moses fra Moabs ødemarker op på Nebo-fjellet, på Pisgas topp, som ligger midt imot Jeriko», fikk se landet «like til Dan» og døde der. Nebo er én topp i Abarim-kjeden; hvordan den forholder seg til Pisga, er ikke sikkert, og de to navnene regnes vanligvis for ryggen og dens topp."
    - "Fjellet plasseres vanligvis ved Jebel Neba og dens vestlige utløper Ras Siyagha, omkring 9 km nordvest for Madaba, der kartets punkt står; navnet lever videre der, og Eusebius plasserte Nabau seks romerske mil vest for Hesjbon. Kartet markerer også Jebel Osha nær es-Salt, lenger nord i Gilead, som en langt mindre sannsynlig kandidat. Pilegrimer kom til Siyagha allerede på 300-tallet: Egeria fant en kirke og munker der. Fransiskanerne har gravd ut dens bysantinske basilika og mosaikker siden 1933, og Moses-minnesmerket på toppen er i dag et av Jordans mest kjente steder."
  tl:
    - "Ang Bundok Nebo ay ang kataasan sa kanlurang gilid ng talampas ng Moab, sa tapat ng Jerico, kung saan nakita ni Moises ang ipinangakong lupain bago siya mamatay. Dalawang beses lamang itong pinangalanan ng Biblia. Sinabi ng Diyos kay Moises, “Sumampa ka sa bundok na ito ng Abarim, sa bundok ng Nebo na nasa lupain ng Moab, na nasa tapat ng Jerico; at masdan mo ang lupain ng Canaan”; at sa wakas ng Deuteronomio, “sumampa si Moises mula sa mga kapatagan ng Moab sa bundok ng Nebo, sa taluktok ng Pisga”, ipinakita ang lupain “hanggang sa Dan” at namatay doon. Ang Nebo ay isang tuktok ng hanay ng Abarim; hindi tiyak ang kaugnayan nito sa Pisga, at ang dalawang pangalan ay karaniwang itinuturing na tagaytay at tuktok nito."
    - "Ang bundok ay karaniwang inilalagay sa Jebel Neba at sa kanlurang sanga nitong Ras Siyagha, mga 9 km sa hilagang-kanluran ng Madaba, kung saan nakatayo ang punto ng mapa; nananatili roon ang pangalan, at inilagay ni Eusebio ang Nabau anim na milya sa kanluran ng Hesbon. Minamarkahan din ng mapa ang Jebel Osha malapit sa es-Salt, mas hilaga sa Gilead, bilang mas di-malamang na kandidato. Dumating ang mga peregrino sa Siyagha pagsapit ng ika-4 na siglo: nakita ni Egeria roon ang simbahan at mga monghe. Hinuhukay ng mga Franciscano ang basilikang Bizantino at mga mosaiko nito mula 1933, at ang Alaala ni Moises sa tuktok ay isa sa pinakakilalang pook ng Jordan ngayon."
  da:
    - "Nebo er højen på den vestlige kant af den moabitiske højslette, over for Jeriko, hvorfra Moses så det forjættede land, før han døde. Bibelen nævner det kun to gange. Gud siger til Moses: »Gak op paa dette Abarims Bjerg, paa Nebo Bjerg, som er i Moabs Land, som er lige for Jeriko, og bese det Land Kanaan«; og i slutningen af Femte Mosebog: »Mose gik op fra Moabs slette Marker paa Nebo Bjerg, paa Pisgas Top«, blev vist landet »indtil Dan« og døde dér. Nebo er en top af Abarim-kæden; hvordan det forholder sig til Pisga, er ikke sikkert, og de to navne tages sædvanligvis for højderyggen og dens top."
    - "Bjerget placeres sædvanligvis ved Jebel Neba og dets vestlige udløber Ras Siyagha, omkring 9 km nordvest for Madaba, hvor kortets punkt står; navnet overlever dér, og Eusebios placerede Nabau seks romerske mil vest for Hesjbon. Kortet markerer også Jebel Osha nær es-Salt, længere mod nord i Gilead, som en langt mindre sandsynlig kandidat. Pilgrimme kom til Siyagha i 300-tallet: Egeria fandt en kirke og munke dér. Franciskanerne har udgravet dens byzantinske basilika og mosaikker siden 1933, og Moses-mindesmærket på toppen er i dag et af Jordans mest kendte steder."
  sr:
    - "Нево је узвишица на западном рубу моавске висоравни, насупрот Јерихону, са које је Мојсије видео обећану земљу пре смрти. Библија га именује само двапут. Бог каже Мојсију: „Изиђи на ову гору аваримску, на гору Навав, која је у земљи моавској према Јерихону, и види земљу хананску“; а на крају Поновљеног закона „Тада изиђе Мојсије из поља моавског на гору Нава, на врх Фазге, која је према Јерихону“, показана му је земља „до Дана“ и тамо је умро. Нево је један врх ланца Аварим; како се односи према Фазги, није сигурно, и та два имена обично се узимају за гребен и његов врх."
    - "Планина се обично смешта на Џебел Неба и њен западни огранак Рас Сијагу, око 9 км северозападно од Мадабе, где стоји тачка на мапи; име тамо живи, а Јевсевије је сместио Набау шест миља западно од Есевона. Мапа означава и Џебел Ошу крај ес-Салта, даље на северу у Галаду, као много мање вероватног кандидата. Ходочасници су долазили у Сијагу већ у IV веку: Егерија је тамо нашла цркву и монахе. Францишканци ископавају њену византијску базилику и мозаике од 1933, а Меморијал Мојсија на врху данас је једно од најпознатијих места Јордана."
  hu:
    - "A Nébó-hegy a moábi fennsík nyugati szélén álló magaslat, Jerikóval szemben, ahonnan Mózes halála előtt látta az ígéret földjét. A Biblia csak kétszer nevezi meg. Isten így szól Mózeshez: „Menj fel ebbe az Abarim hegységbe, a Nébó hegyére, a mely Moáb földén van és pedig Jérikhóval átellenben; és nézd meg a Kanaán földét”; és Mózes ötödik könyvének végén: „És felméne Mózes a Moáb mezőségéről a Nébó hegyére, a Piszga tetejére”, megmutatták neki a földet „Dánig”, és ott halt meg. A Nébó az Abárim-hegylánc egyik csúcsa; hogy a Piszgához hogyan viszonyul, nem biztos, és a két nevet rendszerint a gerincnek és csúcsának tartják."
    - "A hegyet általában a Jebel Nebán és nyugati nyúlványán, a Ras Siyaghán helyezik el, Madabától mintegy 9 km-re északnyugatra, ahol a térkép pontja áll; a név ott maradt meg, és Eusebius Nabaut hat mérföldre nyugatra helyezte Hesbontól. A térkép a Jebel Oshát is jelöli es-Salt mellett, északabbra Gileádban, sokkal kevésbé valószínű jelöltként. A zarándokok a 4. századra eljutottak Siyaghába: Egeria templomot és szerzeteseket talált ott. A ferencesek 1933 óta ásták ki bizánci bazilikáját és mozaikjait, a csúcson álló Mózes-emlékmű pedig ma Jordánia egyik legismertebb helye."
  fi:
    - "Nebovuori on Moabin ylängön länsireunan korkeus Jerikoa vastapäätä, jolta Mooses näki luvatun maan ennen kuolemaansa. Raamattu nimeää sen vain kahdesti. Jumala sanoo Moosekselle: ”Nouse tänne Abarimin vuoristoon, Nebon vuorelle, joka on Mooabin maassa vastapäätä Jerikoa, ja katsele Kanaanin maata”; ja Viidennen Mooseksen kirjan lopussa ”Mooses nousi Mooabin arolta Nebon vuorelle, Pisgan huipulle”, hänelle näytettiin maa ”Daaniin asti” ja hän kuoli siellä. Nebo on yksi Abarimin vuoriston huipuista; miten se liittyy Pisgaan, ei ole varmaa, ja kaksi nimeä katsotaan yleensä harjanteeksi ja sen huipuksi."
    - "Vuori sijoitetaan yleensä Jebel Neballe ja sen läntiselle ulokkeelle Ras Siyaghalle, noin 9 km Madabasta luoteeseen, mihin kartan piste on asetettu; nimi säilyy siellä, ja Eusebios sijoitti Nabaun kuuden mailin päähän Hesbonista länteen. Kartta merkitsee myös Jebel Oshan es-Saltin lähellä, kauempana pohjoisessa Gileadissa, paljon epätodennäköisempänä ehdokkaana. Pyhiinvaeltajat tulivat Siyaghaan jo 300-luvulla: Egeria löysi sieltä kirkon ja munkkeja. Fransiskaanit ovat kaivaneet sen bysanttilaista basilikaa ja mosaiikkeja vuodesta 1933, ja huipulla oleva Mooseksen muistomerkki on nykyään yksi Jordanian tunnetuimmista kohteista."
  vi:
    - "Núi Nê-bô là đỉnh cao ở rìa tây cao nguyên Mô-áp, đối ngang Giê-ri-cô, từ đó Môi-se thấy xứ hứa trước khi qua đời. Kinh Thánh chỉ nêu nó hai lần. Đức Chúa Trời bảo Môi-se: “Hãy đi lên núi A-ba-rim, trên đỉnh Nê-bô, ở trong xứ Mô-áp, đối ngang Giê-ri-cô; rồi nhìn xứ Ca-na-an”; và cuối sách Phục truyền, “Môi-se từ đồng bằng Mô-áp lên trên núi Nê-bô, nơi đỉnh Phích-ga, đối ngang Giê-ri-cô”, được cho xem xứ “từ Ga-la-át chí Đan” và qua đời ở đó. Nê-bô là một đỉnh của dãy A-ba-rim; nó liên hệ với Phích-ga thế nào không chắc chắn, và hai tên thường được coi là sống núi và đỉnh của nó."
    - "Ngọn núi thường được đặt tại Jebel Neba và mỏm tây Ras Siyagha, cách Madaba khoảng 9 km về phía tây bắc, nơi điểm bản đồ đứng; tên còn lại ở đó, và Eusebius đặt Nabau cách Hết-bôn sáu dặm về phía tây. Bản đồ cũng đánh dấu Jebel Osha gần es-Salt, xa hơn về phía bắc ở Ga-la-át, như một ứng viên kém khả dĩ hơn nhiều. Người hành hương đến Siyagha từ thế kỷ 4: Egeria thấy một nhà thờ và các tu sĩ ở đó. Dòng Phanxicô khai quật thánh đường Byzantine và các bức khảm từ năm 1933, và Đài tưởng niệm Môi-se trên đỉnh nay là một trong những địa điểm nổi tiếng nhất của Gióc-đa-ni."
  ro:
    - "Muntele Nebo este înălțimea de la marginea vestică a podișului Moabului, în fața Ierihonului, de unde Moise a văzut țara făgăduită înainte de a muri. Biblia îl numește numai de două ori. Dumnezeu îi spune lui Moise să se suie pe acest munte Abarim, pe muntele Nebo, care este în țara Moabului, în fața Ierihonului, și să privească țara Canaanului; iar la sfârșitul Deuteronomului „s’a suit Moisì dela Aravotul lui Moav în muntele Navan în vârful lui Fasga”, i s-a arătat țara „până la Dan” și a murit acolo. Nebo este un vârf al lanțului Abarim; cum se leagă de Pisga nu este sigur, iar cele două nume sunt socotite de obicei creasta și vârful ei."
    - "Muntele este plasat în general la Jebel Neba și pintenul lui vestic Ras Siyagha, la circa 9 km nord-vest de Madaba, unde se află punctul de pe hartă; numele se păstrează acolo, iar Eusebiu așeza Nabau la șase mile vest de Hesbon. Harta marchează și Jebel Osha, lângă es-Salt, mai la nord în Galaad, drept candidat mult mai puțin probabil. Pelerinii veneau la Siyagha încă din secolul al IV-lea: Egeria a găsit acolo o biserică și călugări. Franciscanii au excavat din 1933 bazilica ei bizantină și mozaicurile, iar Memorialul lui Moise de pe culme este astăzi unul dintre cele mai cunoscute situri ale Iordaniei."
  bg:
    - "Планината Нево е височината на западния край на Моавското плато, срещу Йерихон, от която Мойсей видя обетованата земя, преди да умре. Библията я назовава само два пъти. Бог казва на Мойсей: „Възлез на тая гора Аварим, гората Нево, която е в Моавовата земя срещу Иерихон, и виж земята Ханаан“; а в края на Второзаконие „възлезе Мойсей от Моавовите полета на гората Нево, на върха Фасга“, видя земята „дори до Дан“ и умря там. Нево е един от върховете на веригата Аварим; как се отнася към Фасга, не е сигурно, и двете имена обикновено се разбират като рида и неговия връх."
    - "Планината обикновено се поставя в Джебел Неба и западния му рид Рас Сияга, на около 9 км северозападно от Мадаба, където е точката на картата; името е оцеляло там, а Евсевий поставя Набау на шест мили западно от Есевон. Картата отбелязва също Джебел Оша близо до ес-Салт, по-на север в Галаад, като много по-малко вероятен кандидат. Поклонници идвали в Сияга още през IV в.: Егерия намира там църква и монаси. Францисканците разкопават византийската базилика и мозайките ѝ от 1933 г., а Мемориалът на Мойсей на върха днес е едно от най-известните места в Йордания."
