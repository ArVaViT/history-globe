# Overview article (ADR 0007). Mainstream facts only; a mountain known by name from two verses; the town of Nebo and Pisgah have their own articles; the second candidate on the map is named as such.
id: mount-nebo
place: aefaa2d
title:
  en: "Mount Nebo"
  ru: "Гора Нево"
  uk: "Гора Нево"
  es: "Monte Nebo"
  pt: "Monte Nebo"
  de: "Nebo"
  fr: "Mont Nebo"
body:
  en:
    - "Mount Nebo is the height on the western edge of the Moabite plateau, opposite Jericho, from which Moses saw the promised land before he died. The Bible names it only twice. God tells Moses, “Get thee up into this mountain Abarim, unto mount Nebo, which is in the land of Moab, that is over against Jericho; and behold the land of Canaan”; and at the end of Deuteronomy “Moses went up from the plains of Moab unto the mountain of Nebo, to the top of Pisgah”, was shown the land “unto Dan” and died there. Nebo is one summit of the Abarim range; how it relates to Pisgah is not certain, and the two names are usually taken for the ridge and its top."
    - "The mountain is generally placed at Jebel Neba and its western spur Ras Siyagha, about 9 km north-west of Madaba, where the map point stands; the name survives there, and Eusebius put Nabau six miles west of Heshbon. The map also marks Jebel Osha near es-Salt, farther north in Gilead, as a much less likely candidate. Pilgrims came to Siyagha by the fourth century: Egeria found a church and monks there. The Franciscans have excavated its Byzantine basilica and mosaics since 1933, and the Memorial of Moses on the summit is today one of the best-known sites of Jordan."
  ru:
    - "Гора Нево — высота на западном краю Моавитского плато против Иерихона, откуда Моисей перед смертью видел обетованную землю. По имени Библия называет её лишь дважды. Бог говорит Моисею: «взойди на сию гору Аварим, на гору Нево, которая в земле Моавитской, против Иерихона, и посмотри на землю Ханаанскую»; а в конце Второзакония «взошел Моисей с равнин Моавитских на гору Нево, на вершину Фасги», увидел землю «до самого Дана» и там умер. Нево — одна из вершин хребта Аварим; как она соотносится с Фасгой, точно не известно, и оба имени обычно понимают как хребет и его вершину."
    - "Гору обычно помещают на Джебель-Неба и его западный выступ Рас-Сияга, примерно в 9 км к северо-западу от Мадабы, где стоит точка на карте; имя там сохранилось, и Евсевий помещал Навав в шести милях к западу от Есевона. На карте отмечена и Джебель-Оша близ Эс-Салта, севернее, в Галааде, как гораздо менее вероятный вариант. Паломники приходили на Сиягу уже в IV веке: Эгерия застала там церковь и монахов. Францисканцы с 1933 года раскапывают здешнюю византийскую базилику с мозаиками, и Мемориал Моисея на вершине сегодня — одно из самых известных мест Иордании."
  uk:
    - "Гора Нево — висота на західному краю моавитського плато, навпроти Єрихону, звідки Мойсей побачив обіцяну землю перед смертю. Біблія називає її лише двічі. Бог каже Мойсею: «Вийди на сї гори Абарим, на гору Небо, що в землї Моабській, проти Єрихону, і подивись на Канаан землю»; а наприкінці Повторення Закону «І зійшов Мойсей з Моабового поділля на Небо гору, на верх Пизги, що проти Єрихону», йому показано землю «до Дану», і він помер там. Нево — одна вершина хребта Аварім; як вона співвідноситься з Фасгою, непевно, і дві назви зазвичай розуміють як хребет і його вершину."
    - "Гору загалом розміщують у Джебель-Неба та її західному відрозі Рас-Сіягга, приблизно за 9 км на північний захід від Мадаби, де стоїть точка мапи; там зберігається назва, а Євсевій розмістив Набау за шість миль на захід від Гесбона. Мапа також позначає Джебель-Оша біля ес-Сальта, далі на північ у Гілеаді, як значно менш імовірного кандидата. Прочани приходили до Сіягги вже в IV ст.: Егерія знайшла там церкву й ченців. Францисканці розкопують її візантійську базиліку й мозаїки від 1933 р., а Меморіал Мойсея на вершині — нині одне з найвідоміших місць Йорданії."
  es:
    - "El monte Nebo es la altura del borde occidental de la meseta de Moab, frente a Jericó, desde la que Moisés vio la tierra prometida antes de morir. La Biblia lo nombra solo dos veces. Dios dice a Moisés: «Sube á este monte de Abarim, al monte Nebo, que está en la tierra de Moab, que está en derecho de Jericó, y mira la tierra de Canaán»; y al final de Deuteronomio, «subió Moisés de los campos de Moab al monte de Nebo, á la cumbre de Pisga», se le mostró la tierra «hasta Dan» y murió allí. El Nebo es una cumbre de la cordillera de Abarim; cómo se relaciona con Pisga no es seguro, y los dos nombres suelen tomarse por la cresta y su cima."
    - "La montaña se sitúa generalmente en el Yebel Neba y su espolón occidental Ras Siyagha, a unos 9 km al noroeste de Madaba, donde está el punto del mapa; el nombre sobrevive allí, y Eusebio puso Nabau a seis millas al oeste de Hesbón. El mapa marca también el Yebel Osha, cerca de es-Salt, más al norte en Galaad, como candidato mucho menos probable. Los peregrinos llegaban a Siyagha ya en el siglo IV: Egeria halló allí una iglesia y monjes. Los franciscanos excavan su basílica bizantina y sus mosaicos desde 1933, y el Memorial de Moisés en la cumbre es hoy uno de los sitios más conocidos de Jordania."
  pt:
    - "O monte Nebo é a altura na borda ocidental do planalto moabita, defronte de Jericó, de onde Moisés viu a terra prometida antes de morrer. A Bíblia o nomeia apenas duas vezes. Deus diz a Moisés: “Suba a esta montanha de Abarim, ao Monte Nebo, que está na terra de Moabe, em frente a Jericó; e veja a terra de Canaã”; e no fim de Deuteronômio “Moisés subiu das campinas de Moabe ao monte Nebo, ao topo de Pisga”, foi-lhe mostrada a terra “até Dã” e morreu ali. O Nebo é um cume da cordilheira de Abarim; como se relaciona com Pisga não é certo, e os dois nomes costumam ser tomados pela crista e seu topo."
    - "A montanha é geralmente situada no Jebel Neba e seu esporão ocidental Ras Siyagha, a cerca de 9 km a noroeste de Madaba, onde está o ponto do mapa; o nome sobrevive ali, e Eusébio pôs Nabau a seis milhas a oeste de Hesbom. O mapa marca também o Jebel Osha, perto de es-Salt, mais ao norte em Gileade, como candidato bem menos provável. Peregrinos vinham a Siyagha já no século IV: Egéria achou ali uma igreja e monges. Os franciscanos escavam sua basílica bizantina e mosaicos desde 1933, e o Memorial de Moisés no cume é hoje um dos sítios mais conhecidos da Jordânia."
  de:
    - "Der Nebo ist die Anhöhe am Westrand der moabitischen Hochebene, gegenüber Jericho, von der Mose das verheißene Land sah, ehe er starb. Die Bibel nennt ihn nur zweimal. Gott sagt zu Mose: „Gehe auf das Gebirge Abarim, auf den Berg Nebo, der da liegt im Moabiterland, gegenüber Jericho, und schaue das Land Kanaan“; und am Ende des 5. Buches Mose: „Und Mose ging von dem Gefilde der Moabiter auf den Berg Nebo, auf die Spitze des Gebirges Pisga, gegenüber Jericho“, ihm wurde das Land gezeigt „bis gen Dan“, und er starb dort. Der Nebo ist ein Gipfel des Abarim-Gebirges; wie er sich zum Pisga verhält, ist nicht sicher, und die beiden Namen gelten meist für den Rücken und seine Spitze."
    - "Der Berg wird allgemein am Jebel Neba und seinem westlichen Ausläufer Ras Siyagha angesetzt, etwa 9 km nordwestlich von Madaba, wo der Punkt der Karte steht; dort lebt der Name fort, und Eusebius setzte Nabau sechs Meilen westlich von Heschbon an. Die Karte zeigt auch den Jebel Osha bei es-Salt, weiter nördlich in Gilead, als viel weniger wahrscheinlichen Kandidaten. Pilger kamen im 4. Jahrhundert nach Siyagha: Egeria fand dort eine Kirche und Mönche. Die Franziskaner graben seit 1933 seine byzantinische Basilika und Mosaiken aus, und das Mose-Denkmal auf dem Gipfel ist heute eine der bekanntesten Stätten Jordaniens."
  fr:
    - "Le mont Nebo est la hauteur au bord occidental du plateau moabite, en face de Jéricho, d’où Moïse vit la terre promise avant de mourir. La Bible ne le nomme que deux fois. Dieu dit à Moïse : « Monte sur cette montagne d’Abarim, sur le mont Nebo, au pays de Moab, vis-à-vis de Jéricho ; et regarde le pays de Canaan » ; et à la fin du Deutéronome « Moïse monta des plaines de Moab sur le mont Nebo, au sommet du Pisga », se vit montrer le pays « Galaad jusqu’à Dan » et mourut là. Le Nebo est un sommet de la chaîne des Abarim ; son rapport avec le Pisga n’est pas certain, et les deux noms sont d’ordinaire pris pour la crête et son sommet."
    - "On place généralement la montagne au djebel Neba et à son éperon occidental Ras Siyagha, à environ 9 km au nord-ouest de Madaba, où se trouve le point de la carte ; le nom y survit, et Eusèbe plaçait Nabau à six milles à l’ouest de Hesbon. La carte marque aussi le djebel Osha près d’es-Salt, plus au nord en Galaad, comme candidat bien moins probable. Des pèlerins venaient à Siyagha dès le IVe siècle : Égérie y trouva une église et des moines. Les franciscains en fouillent la basilique byzantine et les mosaïques depuis 1933, et le Mémorial de Moïse au sommet est aujourd’hui l’un des sites les plus connus de Jordanie."
scripture:
