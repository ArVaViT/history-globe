  - "G. W. Bowersock, Roman Arabia (1983)"
  - "M. Hengel and A. M. Schwemer, Paul between Damascus and Antioch: The Unknown Years (1997)"
  - "J. Murphy-O'Connor, Paul: A Critical Life (1996)"
