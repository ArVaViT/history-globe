# Overview article (ADR 0007). Mainstream facts only; this is the Arabia of Paul's letters, the Nabataean kingdom, not the Arabia of the Old Testament; what Paul did there is left open, as he leaves it.
id: arabia-galatians
place: a0f4ea8
title:
  en: "Arabia in Galatians"
  ru: "Аравия в Послании к Галатам"
  uk: "Аравія в Посланні до галатів"
  es: "Arabia en Gálatas"
  pt: "Arábia em Gálatas"
  de: "Arabien im Galaterbrief"
  fr: "L’Arabie dans l’épître aux Galates"
  it: "Arabia in Galati"
  pl: "Arabia w Liście do Galatów"
  nl: "Arabië in Galaten"
  cs: "Arábie v Listu Galatským"
  sv: "Arabien i Galaterbrevet"
  nb: "Arabia i Galaterbrevet"
  tl: "Arabia sa Mga Taga-Galacia"
  da: "Arabien i Galaterbrevet"
  sr: "Арабија у Посланици Галатима"
  hu: "Arábia a Galatákhoz írt levélben"
  fi: "Arabia Galatalaiskirjeessä"
  vi: "A-ra-bi trong thư Ga-la-ti"
  ro: "Arabia din Epistola către Galateni"
  bg: "Арабия в Посланието към галатяните"
body:
  en:
    - "The Arabia of Paul's letter to the Galatians is the Arabia of the Roman world: the kingdom of the Nabataeans south and east of Judaea, with its capital at Petra, which under Aretas IV (9 BC to AD 40) reached from the edge of Damascus to the Red Sea. After his conversion, Paul says, “neither went I up to Jerusalem to them which were apostles before me; but I went into Arabia, and returned again unto Damascus”; and in 2 Corinthians he adds that the governor under King Aretas guarded Damascus to seize him. Taken together the notices suggest that he spent his time in Nabataean country and made enemies there. Whether he preached or withdrew to think, and for how long of the three years before he went up to Jerusalem, he does not say. In the fourth chapter he uses the name in its other sense, for the peninsula of Sinai: “this Agar is mount Sinai in Arabia”."
    - "In AD 106 Trajan annexed the Nabataean kingdom as the province of Arabia, with its seat at Bostra, and later writers called the region Arabia Petraea after its old capital. The land is today southern Jordan, the Negev and Sinai, and the north-west of Saudi Arabia. The Arabia of the Old Testament, the home of the nomads and incense traders, is another entry."
  ru:
    - "Аравия Послания к Галатам — это Аравия римского мира: царство Набатеев к югу и востоку от Иудеи со столицей в Петре, которое при Арете IV (9 г. до н. э. — 40 г. н. э.) простиралось от окрестностей Дамаска до Красного моря. После своего обращения, говорит Павел, он «не пошел в Иерусалим к предшествовавшим мне Апостолам, а пошел в Аравию и опять возвратился в Дамаск», а во Втором послании к Коринфянам добавляет, что правитель царя Ареты стерёг Дамаск, чтобы схватить его. Вместе эти известия говорят, что он провёл это время в набатейской земле и нажил там врагов. Проповедовал ли он или удалился размышлять и сколько из трёх лет до прихода в Иерусалим там пробыл, он не говорит. В четвёртой главе он берёт имя в другом смысле, для Синайского полуострова: «Агарь означает гору Синай в Аравии»."
    - "В 106 г. н. э. Траян присоединил Набатейское царство как провинцию Аравия с центром в Бостре, и поздние писатели звали эту область Каменистой Аравией по её старой столице. Эта земля сегодня — юг Иордании, Негев и Синай, северо-запад Саудовской Аравии. Аравия Ветхого Завета, родина кочевников и торговцев благовониями, — отдельная статья."
  uk:
    - "Аравія в листі Павла до галатів — це Аравія римського світу: царство набатеїв на південь і схід від Юдеї зі столицею в Петрі, що за Арети IV (9 р. до н. е. – 40 р. н. е.) сягало від краю Дамаска до Червоного моря. Після навернення, каже Павло, він «анї не вийшов у Єрусалим до тих, що були апостолами перш мене, а пійшов у Аравию, та й знов вернувсь у Дамаск»; а в Другому посланні до коринтян додає, що намісник царя Арети стеріг Дамаск, щоб його піймати. Взяті разом, ці згадки наводять на думку, що він провів час у набатейському краї й нажив там ворогів. Чи він проповідував, чи усамітнився для роздумів, і як довго з трьох років до того, як піти до Єрусалима, він не каже. У четвертому розділі він вживає назву в іншому значенні, для Синайського півострова: «Агара, се Синай, гора в Аравиї»."
    - "У 106 р. н. е. Траян анексував Набатейське царство як провінцію Аравія з резиденцією в Бострі, а пізніші автори називали цей край Аравією Петрейською за його давньою столицею. Ця земля нині — південна Йорданія, Негев і Синай та північний захід Саудівської Аравії. Аравія Старого Завіту, батьківщина кочовиків і торговців пахощами, — окремий запис."
  es:
    - "La Arabia de la carta de Pablo a los Gálatas es la Arabia del mundo romano: el reino de los nabateos al sur y al este de Judea, con su capital en Petra, que bajo Aretas IV (9 a. C. a 40 d. C.) se extendía desde las afueras de Damasco hasta el mar Rojo. Tras su conversión, dice Pablo, «Ni fuí á Jerusalem á los que eran apóstoles antes que yo; sino que me fuí á la Arabia, y volví de nuevo á Damasco»; y en 2 Corintios añade que el gobernador bajo el rey Aretas guardaba Damasco para prenderlo. En conjunto, los datos sugieren que pasó su tiempo en tierra nabatea y se hizo enemigos allí. Si predicó o se retiró a meditar, y durante cuánto de los tres años antes de subir a Jerusalén, no lo dice. En el capítulo cuarto usa el nombre en su otro sentido, para la península del Sinaí: «Agar ó Sinaí es un monte de Arabia»."
    - "En 106 d. C. Trajano anexionó el reino nabateo como la provincia de Arabia, con sede en Bosra, y escritores posteriores llamaron a la región Arabia Pétrea por su antigua capital. La tierra es hoy el sur de Jordania, el Néguev y el Sinaí, y el noroeste de Arabia Saudita. La Arabia del Antiguo Testamento, patria de los nómadas y de los traficantes de incienso, es otra entrada."
  pt:
    - "A Arábia da carta de Paulo aos Gálatas é a Arábia do mundo romano: o reino dos nabateus, ao sul e a leste da Judeia, com capital em Petra, que sob Aretas IV (9 a.C. a 40 d.C.) ia das portas de Damasco ao mar Vermelho. Depois da conversão, diz Paulo, “nem subi a Jerusalém para os que já eram apóstolos antes de mim, mas parti para a Arábia. Depois, retornei a Damasco”; e em 2 Coríntios acrescenta que “o governador sob o rei Aretas guardava a cidade de Damasco, desejando me prender”. Juntas, as notícias sugerem que ele passou o tempo em terra nabateia e ali fez inimigos. Se pregou ou se retirou para pensar, e por quanto dos três anos antes de subir a Jerusalém, ele não diz. No capítulo quarto usa o nome em seu outro sentido, para a península do Sinai: “esta Agar é o monte Sinai, na Arábia”."
    - "Em 106 d.C. Trajano anexou o reino nabateu como a província da Arábia, com sede em Bostra, e escritores posteriores chamaram a região de Arábia Pétrea, por causa de sua antiga capital. A terra é hoje o sul da Jordânia, o Neguev e o Sinai, e o noroeste da Arábia Saudita. A Arábia do Antigo Testamento, terra de nômades e comerciantes de incenso, é outro verbete."
  de:
    - "Das Arabien in Paulus' Brief an die Galater ist das der römischen Welt: das Königreich der Nabatäer südlich und östlich von Judäa mit der Hauptstadt Petra, das unter Aretas IV. (9 v. Chr. bis 40 n. Chr.) vom Rand von Damaskus bis zum Roten Meer reichte. Nach der Bekehrung, sagt Paulus, „kam“ er „auch nicht gen Jerusalem zu denen, die vor mir Apostel waren, sondern zog hin nach Arabien und kam wiederum gen Damaskus“; im Zweiten Korintherbrief fügt er hinzu, der Statthalter des Königs Aretas habe Damaskus bewachen lassen, um ihn zu ergreifen. Zusammen deuten die Angaben darauf, dass er im Nabatäerland weilte und sich Feinde machte. Ob er predigte oder nachdachte und wie lange in den drei Jahren vor seinem Gang nach Jerusalem, sagt er nicht. Im vierten Kapitel gebraucht er den Namen in anderem Sinn, für die Halbinsel Sinai: „Hagar heißt in Arabien der Berg Sinai“."
    - "106 n. Chr. annektierte Trajan das Königreich der Nabatäer als Provinz Arabien mit Sitz in Bostra, und spätere Autoren nannten die Gegend nach ihrer alten Hauptstadt Arabia Petraea. Das Land ist heute Südjordanien, der Negev und der Sinai sowie der Nordwesten Saudi-Arabiens. Das Arabien des Alten Testaments, die Heimat der Nomaden und Weihrauchhändler, ist ein anderer Eintrag."
  fr:
    - "L’Arabie de l’épître de Paul aux Galates est l’Arabie du monde romain : le royaume des Nabatéens au sud et à l’est de la Judée, avec Pétra pour capitale, qui sous Arétas IV (9 av. J.-C. à 40 apr. J.-C.) s’étendait de la lisière de Damas à la mer Rouge. Après sa conversion, dit Paul, « je ne montai point à Jérusalem vers ceux qui furent apôtres avant moi, mais je partis pour l’Arabie. Puis je revins encore à Damas » ; et dans 2 Corinthiens il ajoute que le gouverneur du roi Arétas gardait Damas pour le saisir. Ensemble, ces notices suggèrent qu’il passa du temps en pays nabatéen et s’y fit des ennemis. S’il y prêcha ou s’il se retira pour réfléchir, et pendant combien des trois ans qui précédèrent sa montée à Jérusalem, il ne le dit pas. Au chapitre quatre, il emploie le nom dans son autre sens, pour la péninsule du Sinaï : « Agar, c’est le mont Sinaï en Arabie »."
    - "En 106 apr. J.-C., Trajan annexa le royaume nabatéen en province d’Arabie, avec Bostra pour siège, et des auteurs tardifs appelèrent la région Arabie pétrée d’après son ancienne capitale. Le pays est aujourd’hui le sud de la Jordanie, le Négev, le Sinaï et le nord-ouest de l’Arabie saoudite. L’Arabie de l’Ancien Testament, patrie des nomades et des marchands d’encens, fait l’objet d’une autre notice."
  it:
    - "L’Arabia della lettera di Paolo ai Galati è l’Arabia del mondo romano: il regno dei Nabatei a sud e a est della Giudea, con capitale a Petra, che sotto Areta IV (dal 9 a.C. al 40 d.C.) si estendeva dai margini di Damasco al Mar Rosso. Dopo la sua conversione, dice Paolo, «non salii a Gerusalemme da quelli che erano stati apostoli prima di me, ma subito me ne andai in Arabia; quindi tornai di nuovo a Damasco»; e in 2 Corinzi aggiunge che il governatore del re Areta teneva guardie a Damasco per prenderlo. Presi insieme, i riferimenti suggeriscono che egli trascorse del tempo in territorio nabateo e vi si fece dei nemici. Se vi predicò o si ritirò a riflettere, e per quanta parte dei tre anni prima di salire a Gerusalemme, non lo dice. Nel quarto capitolo usa il nome nell’altro senso, per la penisola del Sinai: «Agar è il monte Sinai in Arabia»."
    - "Nel 106 d.C. Traiano annesse il regno nabateo come provincia d’Arabia, con sede a Bostra, e scrittori posteriori chiamarono la regione Arabia Petraea dalla sua antica capitale. La terra è oggi la Giordania meridionale, il Negheb e il Sinai, e il nord-ovest dell’Arabia Saudita. L’Arabia dell’Antico Testamento, patria dei nomadi e dei mercanti d’incenso, è un’altra voce."
  pl:
    - "Arabia z listu Pawła do Galatów to Arabia świata rzymskiego: królestwo Nabatejczyków na południe i wschód od Judei, ze stolicą w Petrze, które za Aretasa IV (9 r. p.n.e.–40 r. n.e.) sięgało od skraju Damaszku do Morza Czerwonego. Po nawróceniu, mówi Paweł, „Anim się wrócił do Jeruzalemu, do tych, którzy przede mną byli Apostołami, alem szedł do Arabii i wróciłem się zasię do Damaszku”; a w 2 Liście do Koryntian dodaje, że namiestnik króla Aretasa strzegł Damaszku, by go pojmać. Razem wzięte te wzmianki sugerują, że spędził czas w kraju nabatejskim i zyskał tam wrogów. Czy głosił, czy wycofał się, by myśleć, i jak długo w ciągu trzech lat przed udaniem się do Jerozolimy, nie mówi. W rozdziale czwartym używa nazwy w innym znaczeniu, dla półwyspu Synaj: „Albowiem Agar jest góra Synaj w Arabii”."
    - "W 106 r. n.e. Trajan włączył królestwo Nabatejczyków jako prowincję Arabię, z siedzibą w Bostrze, a późniejsi pisarze nazywali region Arabią Petrejską od dawnej stolicy. Kraj ten to dziś południowa Jordania, Negew i Synaj oraz północny zachód Arabii Saudyjskiej. Arabia Starego Testamentu, ojczyzna koczowników i handlarzy kadzidłem, to inne hasło."
  nl:
    - "Het Arabië van Paulus’ brief aan de Galaten is het Arabië van de Romeinse wereld: het koninkrijk van de Nabateeërs ten zuiden en oosten van Judea, met Petra als hoofdstad, dat onder Aretas IV (9 v.Chr.–40 n.Chr.) van de rand van Damascus tot de Rode Zee reikte. Na zijn bekering, zegt Paulus, ging hij niet naar Jeruzalem “tot degenen, die voor mij apostelen waren; maar ik ging henen naar Arabië, en keerde wederom naar Damaskus”; en in 2 Korintiërs voegt hij toe dat de landvoogd van koning Aretas Damascus bewaakte om hem te grijpen. Samen suggereren zij dat hij in Nabateeërland verbleef en er vijanden maakte. Of hij predikte of zich terugtrok om te peinzen, en hoe lang van de drie jaren vóór zijn opgang naar Jeruzalem, zegt hij niet. In hoofdstuk 4 gebruikt hij de naam in zijn andere zin, voor het Sinaïschiereiland: “dit, namelijk Agar, is Sina, een berg in Arabië”."
    - "In 106 n.Chr. annexeerde Trajanus het Nabateese koninkrijk als de provincie Arabië, met zetel te Bostra, en latere schrijvers noemden de streek Arabia Petraea naar haar oude hoofdstad. Het land is tegenwoordig Zuid-Jordanië, de Negev en de Sinaï, en het noordwesten van Saoedi-Arabië. Het Arabië van het Oude Testament, de woonplaats van nomaden en wierookhandelaren, is een ander lemma."
  cs:
    - "Arábie z Pavlova listu Galatským je Arábie římského světa: království Nabatejců jižně a východně od Judska s hlavním městem v Petře, které za Aretase IV. (9 př. n. l. až 40 n. l.) sahalo od okraje Damašku k Rudému moři. Po svém obrácení, praví Pavel, „Aniž jsem se vrátil do Jeruzaléma k těm, jenž prve byli apoštolé nežli já, ale šel jsem do Arabie, přišel jsem pak zase do Damašku“; a ve 2. listu Korintským dodává, že správce krále Aretase hlídal Damašek, aby ho zajal. Dohromady tyto zmínky napovídají, že trávil čas v nabatejské zemi a udělal si tam nepřátele. Zda kázal, nebo se stáhl, aby přemýšlel, a po jak dlouhou dobu z oněch tří let, než šel do Jeruzaléma, neříká. Ve čtvrté kapitole užívá jméno v jeho druhém smyslu, pro poloostrov Sinaj: „Agar zajisté jest hora Sinai v Arabii“."
    - "V roce 106 n. l. Traianus připojil nabatejské království jako provincii Arábii se sídlem v Bostře a pozdější spisovatelé nazývali oblast Arabia Petraea podle jejího starého hlavního města. Země je dnes jižním Jordánskem, Negevem a Sinají a severozápadem Saúdské Arábie. Arábie Starého zákona, domov nomádů a obchodníků s kadidlem, je jiné heslo."
  sv:
    - "Arabien i Paulus’ brev till galaterna är den romerska världens Arabien: nabateernas kungarike söder och öster om Judeen, med huvudstad i Petra, som under Aretas IV (9 f.Kr. till 40 e.Kr.) nådde från utkanten av Damaskus till Röda havet. Efter sin omvändelse, säger Paulus, ”ej heller for jag upp till Jerusalem, till dem som före mig voro apostlar. I stället for jag bort till Arabien och vände så åter tillbaka till Damaskus”; och i Andra Korinthierbrevet tillägger han att kung Aretas’ ståthållare bevakade Damaskus för att gripa honom. Uppgifterna antyder att han vistades i nabateiskt land och gjorde sig fiender där. Om han predikade eller drog sig tillbaka för att tänka, och hur länge av de tre åren före uppgången till Jerusalem, säger han inte. I kapitel 4 använder han namnet i dess andra betydelse, för Sinaihalvön: ”Berget Sina kallas nämligen i Arabien för Agar”."
    - "År 106 e.Kr. annekterade Trajanus det nabateiska riket som provinsen Arabien, med säte i Bostra, och senare författare kallade trakten Arabia Petraea efter dess gamla huvudstad. Landet är i dag södra Jordanien, Negev och Sinai samt nordvästra Saudiarabien. Gamla testamentets Arabien, nomadernas och rökelsehandlarnas hemtrakt, är en annan artikel."
  nb:
    - "Arabia i Paulus' brev til galaterne er den romerske verdens Arabia: Nabateerriket sør og øst for Judea, med hovedstad i Petra, som under Aretas IV (9 f.Kr. til 40 e.Kr.) rakk fra kanten av Damaskus til Rødehavet. Etter omvendelsen, sier Paulus: «heller ikke drog jeg op til Jerusalem til dem som var apostler før mig; men jeg drog straks bort til Arabia og vendte tilbake til Damaskus»; og i 2. Korinterbrev føyer han til at landshøvdingen under kong Aretas holdt vakt om Damaskus for å gripe ham. Til sammen antyder meldingene at han tilbrakte tiden i nabateisk land og fikk fiender der. Om han forkynte eller trakk seg tilbake for å tenke, og hvor lenge av de tre årene før han dro opp til Jerusalem, sier han ikke. I fjerde kapittel bruker han navnet i dets andre betydning, om Sinai-halvøya: «Hagar er berget Sinai i Arabia»."
    - "I 106 e.Kr. annekterte Trajan det nabateiske riket som provinsen Arabia, med sete i Bostra, og senere forfattere kalte regionen Arabia Petraea etter den gamle hovedstaden. Landet er i dag Sør-Jordan, Negev og Sinai og nordvestlige Saudi-Arabia. Det gammeltestamentlige Arabia, hjemlandet til nomadene og røkelseshandlerne, er en annen artikkel."
  tl:
    - "Ang Arabia ng liham ni Pablo sa mga taga-Galacia ay ang Arabia ng mundong Romano: ang kaharian ng mga Nabateo sa timog at silangan ng Judea, kabisera ang Petra, na sa ilalim ni Aretas IV (9 BK–40 AD) ay umabot mula sa gilid ng Damasco hanggang Dagat na Pula. Pagkatapos ng pagbabalik-loob, sabi ni Pablo, “Ni inahon ko man sa Jerusalem silang mga apostol na nangauna sa akin: kundi sa Arabia ako naparoon; at muling nagbalik ako sa Damasco”; sa 2 Corinto, binantayan ng gobernador ni Haring Aretas ang Damasco upang hulihin siya. Ipinahihiwatig ng mga ito na nanatili siya sa lupain ng mga Nabateo at nagkaroon ng kaaway doon. Kung nangaral siya o umurong upang magnilay, at gaano katagal sa tatlong taon bago umahon sa Jerusalem, hindi niya sinasabi. Sa ikaapat na kabanata, ginagamit niya ang pangalan sa ibang kahulugan, para sa tangway ng Sinai: “Ang Agar ngang ito ay bundok ng Sinai sa Arabia”."
    - "Noong 106 AD, isinanib ni Trajano ang kaharian ng mga Nabateo bilang lalawigan ng Arabia, na may luklukan sa Bostra, at tinawag ng mga kalaunang manunulat ang rehiyon na Arabia Petraea sa ngalan ng dating kabisera nito. Ang lupain ay timog na Jordan, Negev at Sinai, at hilagang-kanluran ng Saudi Arabia ngayon. Ang Arabia ng Lumang Tipan, ang tahanan ng mga lagalag at mangangalakal ng kamanyang, ay ibang artikulo."
  da:
    - "Arabien i Paulus' brev til galaterne er den romerske verdens Arabien: nabatæernes kongerige syd og øst for Judæa, med hovedstad i Petra, som under Aretas 4. (9 f.Kr. til 40 e.Kr.) nåede fra Damaskus' rand til Det Røde Hav. Efter sin omvendelse, siger Paulus, at han »drog heller ikke op til Jerusalem, til dem, som før mig vare Apostle, men jeg drog bort til Arabien og vendte atter tilbage til Damaskus«; og i 2 Korinterbrev tilføjer han, at kong Aretas' statholder holdt Damaskus bevogtet for at gribe ham. Samlet tyder notitserne på, at han tilbragte sin tid i nabatæisk land og skabte sig fjender dér. Om han prædikede eller trak sig tilbage for at tænke, og hvor længe af de tre år, før han drog op til Jerusalem, siger han ikke. I fjerde kapitel bruger han navnet i dets anden betydning, om Sinaihalvøen: »Hagar er Sinai Bjerg i Arabien«."
    - "I 106 e.Kr. annekterede Trajan det nabatæiske kongerige som provinsen Arabien, med sæde i Bostra, og senere forfattere kaldte egnen Arabia Petraea efter dens gamle hovedstad. Landet er i dag det sydlige Jordan, Negev og Sinai og det nordvestlige Saudi-Arabien. Det Gamle Testamentes Arabien, hjemsted for nomader og virakhandlere, er et andet opslag."
  sr:
    - "Арабија из Павловог писма Галатима јесте Арабија римског света: краљевство Набатејаца јужно и источно од Јудеје, с престоницом у Петри, које је под Аретом IV (од 9. п. н. е. до 40. н. е.) допирало од ивице Дамаска до Црвеног мора. После свог обраћења, каже Павле, „нити изиђох у Јерусалим к старијим апостолима од себе него отидох у арапску, и опет се вратих у Дамаск“; а у 2. Коринћанима додаје да је кнез под царем Аретом чувао Дамаск да га ухвати. Узета заједно, та сведочанства наговештавају да је своје време провео у набатејској земљи и ту стекао непријатеље. Да ли је проповедао или се повукао да размишља, и колико од три године пре него што је отишао у Јерусалим, не каже. У четвртој глави користи име у другом смислу, за полуострво Синај: „Агар значи Синај гора у арапској“."
    - "Године 106. н. е. Трајан је анектирао набатејско краљевство као провинцију Арабију, са седиштем у Бостри, а каснији писци назвали су област Арабија Петреја по њеној старој престоници. Земља је данас јужни Јордан, Негев и Синај, и северозапад Саудијске Арабије. Арабија Старог завета, дом номада и трговаца тамјаном, јесте други чланак."
  hu:
    - "A Galatákhoz írt levél Arábiája a római világ Arábiája: a nabateusok királysága Júdeától délre és keletre, fővárosával, Petrával, amely IV. Aréta alatt (Kr. e. 9 – Kr. u. 40) Damaszkusz széléig és a Vörös-tengerig terjedt. Megtérése után, ahogy Pál írja: „Sem nem mentem Jeruzsálembe az előttem való apostolokhoz, hanem elmentem Arábiába, és ismét visszatértem Damaskusba”; a 2Korintusi levélben hozzáteszi, hogy Aréta király helytartója őrzette Damaszkuszt, hogy elfogja. A feljegyzések együtt arra utalnak, hogy a nabateus földön töltötte az idejét, és ott ellenségeket szerzett. Hogy prédikált-e, vagy visszavonult gondolkodni, és a Jeruzsálembe való felmenetele előtti három évből mennyi ideig, nem mondja. A negyedik fejezetben a nevet másik értelmében használja, a Sínai-félszigetre: „Hágár a Sinai hegy Arábiában”."
    - "Kr. u. 106-ban Traianus a nabateus királyságot Arábia provinciaként annektálta, székhelye Boszra volt, a későbbi szerzők pedig a régi fővárosa után Arabia Petraeának nevezték a vidéket. A terület ma Dél-Jordánia, a Negev és a Sínai, valamint Szaúd-Arábia északnyugati része. Az Ószövetség Arábiája, a nomádok és tömjénkereskedők hazája, külön címszó."
  fi:
    - "Paavalin galatalaiskirjeen Arabia on Rooman maailman Arabia: nabatealaisten kuningaskunta Juudeasta etelään ja itään, pääkaupunkinaan Petra, joka Aretas IV:n aikana (9 eaa.–40 jaa.) ulottui Damaskoksen reunalta Punaisellemerelle. Käännyttyään Paavali kertoo: ”enkä lähtenyt ylös Jerusalemiin niiden luo, jotka ennen minua olivat apostoleja, vaan menin pois Arabiaan ja palasin taas takaisin Damaskoon”; ja 2. Korinttilaiskirjeessä hän lisää, että kuningas Aretaan alainen käskynhaltija vartioi Damaskosta ottaakseen hänet kiinni. Yhdessä ne viittaavat siihen, että hän oleskeli nabatealaisten maassa ja sai siellä vihamiehiä. Saarnasiko hän vai vetäytyikö hän ajattelemaan, ja kuinka kauan niistä kolmesta vuodesta ennen Jerusalemiin menoa, hän ei kerro. Neljännessä luvussa hän käyttää nimeä toisessa merkityksessä, Siinain niemimaasta: ”Haagar on Siinain vuori Arabiassa”."
    - "Vuonna 106 jaa. Trajanus liitti nabatealaisten kuningaskunnan itseensä Arabian provinssina, jonka hallintokeskus oli Bostra, ja myöhemmät kirjoittajat kutsuivat aluetta vanhan pääkaupungin mukaan nimellä Arabia Petraea. Maa on nykyisin eteläistä Jordaniaa, Negeviä, Siinain niemimaata ja Saudi-Arabian luoteisosaa. Vanhan testamentin Arabia, paimentolaisten ja suitsukekauppiaiden koti, on oma merkintänsä."
  vi:
    - "A-ra-bi trong thư Phao-lô gửi người Ga-la-ti là A-ra-bi của thế giới La Mã: vương quốc của người Nabataea ở phía nam và phía đông Giu-đê, với kinh đô tại Petra, dưới thời A-rê-ta IV (9 TCN đến năm 40) trải từ rìa Đa-mách đến Biển Đỏ. Sau khi trở lại đạo, Phao-lô nói: “Tôi cũng không lên thành Giê-ru-sa-lem, đến cùng những người đã làm sứ đồ trước tôi, song tôi đi qua xứ A-ra-bi; sau rồi trở về thành Đa-mách”; và trong 2 Cô-rinh-tô ông nói thêm rằng quan tổng đốc dưới quyền vua A-rê-ta canh giữ Đa-mách để bắt ông. Gộp lại, các ghi chú cho thấy ông đã ở trong xứ Nabataea và gây thù chuốc oán tại đó. Ông đã rao giảng hay lui về suy nghĩ, và trong bao lâu của ba năm trước khi ông lên Giê-ru-sa-lem, thì ông không nói. Trong chương bốn, ông dùng tên này theo nghĩa khác, chỉ bán đảo Si-na-i: “A-ga, ấy là núi Si-na-i, trong xứ A-ra-bi”."
    - "Năm 106, Trajanus sáp nhập vương quốc Nabataea thành tỉnh A-ra-bi, với trụ sở tại Bostra, và các tác giả về sau gọi vùng này là Arabia Petraea theo tên kinh đô cũ. Vùng đất ngày nay là miền nam Gióc-đa-ni, Nê-ghép và Sinai, cùng tây bắc Ả Rập Xê Út. A-ra-bi của Cựu Ước, quê hương của dân du mục và thương nhân hương liệu, là một mục khác."
  ro:
    - "Arabia din epistola lui Pavel către Galateni este Arabia lumii romane: regatul nabateenilor la sud și la est de Iudeea, cu capitala la Petra, care sub Areta al IV-lea (9 î.Hr.–40 d.Hr.) se întindea de la marginea Damascului până la Marea Roșie. După convertirea sa, spune Pavel: „Nici m’am suit în Ierusalim către apostolii cei mai înainte de mine, ci m’am dus în Arabia, și iarăș m’am întors la Damasc”; iar în 2 Corinteni adaugă că dregătorul regelui Areta păzea Damascul ca să-l prindă. Luate împreună, aceste știri sugerează că și-a petrecut timpul în ținutul nabateenilor și că și-a făcut acolo dușmani. Dacă a predicat sau s-a retras să mediteze, și cât din cei trei ani de dinainte de a se sui la Ierusalim a durat șederea, nu spune. În capitolul al patrulea folosește numele în celălalt sens, pentru peninsula Sinai: „Agar, muntele Sinai este, în Arabia”."
    - "În 106 d.Hr., Traian a anexat regatul nabateean ca provincie Arabia, cu reședința la Bostra, iar scriitorii de mai târziu au numit regiunea Arabia Petraea, după vechea ei capitală. Ținutul este astăzi sudul Iordaniei, Neghevul și Sinaiul, precum și nord-vestul Arabiei Saudite. Arabia din Vechiul Testament, patria nomazilor și a negustorilor de tămâie, este o altă intrare."
  bg:
    - "Арабия от писмото на Павел до галатяните е Арабия на римския свят: царството на набатейците на юг и изток от Юдея, със столица Петра, което при Арета IV (9 г. пр.н.е. до 40 г. н.е.) стигало от края на Дамаск до Червено море. След обръщането си, казва Павел, „нито възлезох в Ерусалим при апостолите които беха преди мене, но отидох в Арабия, и пак се върнах в Дамаск“; а във Второто послание към коринтяни добавя, че управителят при цар Арета пазел Дамаск, за да го улови. Взети заедно, сведенията подсказват, че той прекарал времето си в набатейска земя и си създал врагове там. Дали е проповядвал, или се е оттеглил да размишлява, и колко от трите години преди да възлезе в Йерусалим, той не казва. В четвърта глава използва името в другия му смисъл — за Синайския полуостров: „Агар е гората Синай в Арабия“."
    - "През 106 г. н.е. Траян анексирал набатейското царство като провинция Арабия със седалище в Босра, а по-късните писатели наричали областта Арабия Петрея по старата ѝ столица. Земята е днес южна Йордания, Негев и Синай и северозападът на Саудитска Арабия. Арабия от Стария завет, родината на номадите и търговците на тамян, е друга статия."
