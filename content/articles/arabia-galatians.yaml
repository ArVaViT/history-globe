# Overview article (ADR 0007). Mainstream facts only; this is the Arabia of Paul's letters, the Nabataean kingdom, not the Arabia of the Old Testament; what Paul did there is left open, as he leaves it.
id: arabia-galatians
place: a0f4ea8
title:
  en: "Arabia in Galatians"
  ru: "Аравия в Послании к Галатам"
  uk: "Аравія в Посланні до галатів"
  es: "Arabia en Gálatas"
  pt: "Arábia em Gálatas"
  de: "Arabien im Galaterbrief"
  fr: "L’Arabie dans l’épître aux Galates"
body:
  en:
    - "The Arabia of Paul's letter to the Galatians is the Arabia of the Roman world: the kingdom of the Nabataeans south and east of Judaea, with its capital at Petra, which under Aretas IV (9 BC to AD 40) reached from the edge of Damascus to the Red Sea. After his conversion, Paul says, “neither went I up to Jerusalem to them which were apostles before me; but I went into Arabia, and returned again unto Damascus”; and in 2 Corinthians he adds that the governor under King Aretas guarded Damascus to seize him. Taken together the notices suggest that he spent his time in Nabataean country and made enemies there. Whether he preached or withdrew to think, and for how long of the three years before he went up to Jerusalem, he does not say. In the fourth chapter he uses the name in its other sense, for the peninsula of Sinai: “this Agar is mount Sinai in Arabia”."
    - "In AD 106 Trajan annexed the Nabataean kingdom as the province of Arabia, with its seat at Bostra, and later writers called the region Arabia Petraea after its old capital. The land is today southern Jordan, the Negev and Sinai, and the north-west of Saudi Arabia. The Arabia of the Old Testament, the home of the nomads and incense traders, is another entry."
  ru:
    - "Аравия Послания к Галатам — это Аравия римского мира: царство Набатеев к югу и востоку от Иудеи со столицей в Петре, которое при Арете IV (9 г. до н. э. — 40 г. н. э.) простиралось от окрестностей Дамаска до Красного моря. После своего обращения, говорит Павел, он «не пошел в Иерусалим к предшествовавшим мне Апостолам, а пошел в Аравию и опять возвратился в Дамаск», а во Втором послании к Коринфянам добавляет, что правитель царя Ареты стерёг Дамаск, чтобы схватить его. Вместе эти известия говорят, что он провёл это время в набатейской земле и нажил там врагов. Проповедовал ли он или удалился размышлять и сколько из трёх лет до прихода в Иерусалим там пробыл, он не говорит. В четвёртой главе он берёт имя в другом смысле, для Синайского полуострова: «Агарь означает гору Синай в Аравии»."
    - "В 106 г. н. э. Траян присоединил Набатейское царство как провинцию Аравия с центром в Бостре, и поздние писатели звали эту область Каменистой Аравией по её старой столице. Эта земля сегодня — юг Иордании, Негев и Синай, северо-запад Саудовской Аравии. Аравия Ветхого Завета, родина кочевников и торговцев благовониями, — отдельная статья."
  uk:
    - "Аравія в листі Павла до галатів — це Аравія римського світу: царство набатеїв на південь і схід від Юдеї зі столицею в Петрі, що за Арети IV (9 р. до н. е. – 40 р. н. е.) сягало від краю Дамаска до Червоного моря. Після навернення, каже Павло, він «анї не вийшов у Єрусалим до тих, що були апостолами перш мене, а пійшов у Аравию, та й знов вернувсь у Дамаск»; а в Другому посланні до коринтян додає, що намісник царя Арети стеріг Дамаск, щоб його піймати. Взяті разом, ці згадки наводять на думку, що він провів час у набатейському краї й нажив там ворогів. Чи він проповідував, чи усамітнився для роздумів, і як довго з трьох років до того, як піти до Єрусалима, він не каже. У четвертому розділі він вживає назву в іншому значенні, для Синайського півострова: «Агара, се Синай, гора в Аравиї»."
    - "У 106 р. н. е. Траян анексував Набатейське царство як провінцію Аравія з резиденцією в Бострі, а пізніші автори називали цей край Аравією Петрейською за його давньою столицею. Ця земля нині — південна Йорданія, Негев і Синай та північний захід Саудівської Аравії. Аравія Старого Завіту, батьківщина кочовиків і торговців пахощами, — окремий запис."
  es:
    - "La Arabia de la carta de Pablo a los Gálatas es la Arabia del mundo romano: el reino de los nabateos al sur y al este de Judea, con su capital en Petra, que bajo Aretas IV (9 a. C. a 40 d. C.) se extendía desde las afueras de Damasco hasta el mar Rojo. Tras su conversión, dice Pablo, «Ni fuí á Jerusalem á los que eran apóstoles antes que yo; sino que me fuí á la Arabia, y volví de nuevo á Damasco»; y en 2 Corintios añade que el gobernador bajo el rey Aretas guardaba Damasco para prenderlo. En conjunto, los datos sugieren que pasó su tiempo en tierra nabatea y se hizo enemigos allí. Si predicó o se retiró a meditar, y durante cuánto de los tres años antes de subir a Jerusalén, no lo dice. En el capítulo cuarto usa el nombre en su otro sentido, para la península del Sinaí: «Agar ó Sinaí es un monte de Arabia»."
    - "En 106 d. C. Trajano anexionó el reino nabateo como la provincia de Arabia, con sede en Bosra, y escritores posteriores llamaron a la región Arabia Pétrea por su antigua capital. La tierra es hoy el sur de Jordania, el Néguev y el Sinaí, y el noroeste de Arabia Saudita. La Arabia del Antiguo Testamento, patria de los nómadas y de los traficantes de incienso, es otra entrada."
  pt:
    - "A Arábia da carta de Paulo aos Gálatas é a Arábia do mundo romano: o reino dos nabateus, ao sul e a leste da Judeia, com capital em Petra, que sob Aretas IV (9 a.C. a 40 d.C.) ia das portas de Damasco ao mar Vermelho. Depois da conversão, diz Paulo, “nem subi a Jerusalém para os que já eram apóstolos antes de mim, mas parti para a Arábia. Depois, retornei a Damasco”; e em 2 Coríntios acrescenta que “o governador sob o rei Aretas guardava a cidade de Damasco, desejando me prender”. Juntas, as notícias sugerem que ele passou o tempo em terra nabateia e ali fez inimigos. Se pregou ou se retirou para pensar, e por quanto dos três anos antes de subir a Jerusalém, ele não diz. No capítulo quarto usa o nome em seu outro sentido, para a península do Sinai: “esta Agar é o monte Sinai, na Arábia”."
    - "Em 106 d.C. Trajano anexou o reino nabateu como a província da Arábia, com sede em Bostra, e escritores posteriores chamaram a região de Arábia Pétrea, por causa de sua antiga capital. A terra é hoje o sul da Jordânia, o Neguev e o Sinai, e o noroeste da Arábia Saudita. A Arábia do Antigo Testamento, terra de nômades e comerciantes de incenso, é outro verbete."
  de:
    - "Das Arabien in Paulus' Brief an die Galater ist das der römischen Welt: das Königreich der Nabatäer südlich und östlich von Judäa mit der Hauptstadt Petra, das unter Aretas IV. (9 v. Chr. bis 40 n. Chr.) vom Rand von Damaskus bis zum Roten Meer reichte. Nach der Bekehrung, sagt Paulus, „kam“ er „auch nicht gen Jerusalem zu denen, die vor mir Apostel waren, sondern zog hin nach Arabien und kam wiederum gen Damaskus“; im Zweiten Korintherbrief fügt er hinzu, der Statthalter des Königs Aretas habe Damaskus bewachen lassen, um ihn zu ergreifen. Zusammen deuten die Angaben darauf, dass er im Nabatäerland weilte und sich Feinde machte. Ob er predigte oder nachdachte und wie lange in den drei Jahren vor seinem Gang nach Jerusalem, sagt er nicht. Im vierten Kapitel gebraucht er den Namen in anderem Sinn, für die Halbinsel Sinai: „Hagar heißt in Arabien der Berg Sinai“."
    - "106 n. Chr. annektierte Trajan das Königreich der Nabatäer als Provinz Arabien mit Sitz in Bostra, und spätere Autoren nannten die Gegend nach ihrer alten Hauptstadt Arabia Petraea. Das Land ist heute Südjordanien, der Negev und der Sinai sowie der Nordwesten Saudi-Arabiens. Das Arabien des Alten Testaments, die Heimat der Nomaden und Weihrauchhändler, ist ein anderer Eintrag."
  fr:
    - "L’Arabie de l’épître de Paul aux Galates est l’Arabie du monde romain : le royaume des Nabatéens au sud et à l’est de la Judée, avec Pétra pour capitale, qui sous Arétas IV (9 av. J.-C. à 40 apr. J.-C.) s’étendait de la lisière de Damas à la mer Rouge. Après sa conversion, dit Paul, « je ne montai point à Jérusalem vers ceux qui furent apôtres avant moi, mais je partis pour l’Arabie. Puis je revins encore à Damas » ; et dans 2 Corinthiens il ajoute que le gouverneur du roi Arétas gardait Damas pour le saisir. Ensemble, ces notices suggèrent qu’il passa du temps en pays nabatéen et s’y fit des ennemis. S’il y prêcha ou s’il se retira pour réfléchir, et pendant combien des trois ans qui précédèrent sa montée à Jérusalem, il ne le dit pas. Au chapitre quatre, il emploie le nom dans son autre sens, pour la péninsule du Sinaï : « Agar, c’est le mont Sinaï en Arabie »."
    - "En 106 apr. J.-C., Trajan annexa le royaume nabatéen en province d’Arabie, avec Bostra pour siège, et des auteurs tardifs appelèrent la région Arabie pétrée d’après son ancienne capitale. Le pays est aujourd’hui le sud de la Jordanie, le Négev, le Sinaï et le nord-ouest de l’Arabie saoudite. L’Arabie de l’Ancien Testament, patrie des nomades et des marchands d’encens, fait l’objet d’une autre notice."
scripture:
  - Gal.1.17
  - Gal.4.25
  - 2Cor.11.32
sources:
