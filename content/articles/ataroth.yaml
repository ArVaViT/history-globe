body:
  en:
    - "Ataroth was a town on the plateau east of the Dead Sea, between Medeba and Dibon. It heads the list of the towns of the good grazing land that Gad and Reuben asked of Moses, “Ataroth, and Dibon, and Jazer, and Nimrah, and Heshbon”, and the Gadites rebuilt it: “the children of Gad built Dibon, and Ataroth, and Aroer”. The Bible says no more of it, and it is not the Ataroth named on the border of Ephraim."
    - "Its later fate is told by the other side. On the stele he set up at Dibon in the ninth century BC, Mesha, king of Moab, says that the men of Gad had lived in the land of Ataroth from of old and that the king of Israel had built Ataroth for himself; Mesha took the town, killed its people for his god Chemosh, carried off an object of the town (the phrase is obscure) and settled men of other places there. The town is Khirbet Ataruz, on a ridge below Jebel Attarus, where excavations led by Chang-Ho Ji since 2000 have uncovered an Iron Age sanctuary with altars, cult stands and figurines, and an altar inscribed in Moabite. The ruins lie today in the Madaba governorate of Jordan, not far from the hill fortress of Machaerus."
  ru:
    - "Атароф — город на плато к востоку от Мёртвого моря, между Медевой и Дивоном. Он открывает список городов доброй пастбищной земли, о которой сыны Гада и Рувима просили Моисея: «Атароф и Дивон, и Иазер, и Нимра, и Есевон», и сыны Гадовы отстроили его: «И построили сыны Гадовы Дивон и Атароф, и Ароер». Больше Библия о нём ничего не говорит, и это не тот Атароф, что назван на границе Ефрема."
    - "О дальнейшей судьбе города рассказывает другая сторона. На стеле, поставленной в Дивоне в IX веке до н. э., Меса, царь Моавитский, пишет, что люди Гада издревле жили в земле Атарофа и что царь Израильский построил Атароф для себя; Меса взял город, истребил жителей ради своего бога Хамоса, унёс оттуда некий предмет (выражение неясно) и поселил там людей из других мест. Город — это Хирбет-Атаруз на гребне под горой Джебель-Аттарус, где раскопки под руководством Чан Хо Чжи с 2000 года открыли святилище железного века с жертвенниками, культовыми подставками и статуэтками и жертвенник с моавитской надписью. Развалины лежат сегодня в мухафазе Мадаба в Иордании, недалеко от горной крепости Махерон."
  uk:
    - "Атарот було містом на плато на схід від Мертвого моря, між Мадабою і Дівоном. Він очолює перелік міст доброго пасовиська, якого Гад і Рувим просили в Мойсея: «Атарот та Дибон та Язер та Нимра та Гесбон», і гадіти його відбудували: «побудували сини Гадові: Дибон да Атарот та Ароер». Біблія більше про нього нічого не каже, і це не той Атарот, названий на кордоні Єфрема."
    - "Про його подальшу долю розповідає інша сторона. На стелі, яку він поставив у Дівоні в IX столітті до н. е., Меша, цар Моава, каже, що мужі Гада здавна жили в землі Атароту і що цар Ізраїлю збудував Атарот для себе; Меша взяв місто, вбив його людей для свого бога Хемоша, забрав якийсь предмет міста (вираз неясний) і оселив там людей з інших місць. Місто — Хірбет-Атаруз, на хребті під Джебель-Аттарусом, де розкопки під керівництвом Чан-Хо Джі від 2000 року виявили святилище залізної доби з жертовниками, культовими підставками та фігурками, а також жертовник із моавитським написом. Руїни лежать нині в мухафазі Мадаба в Йорданії, неподалік від пагорбової фортеці Махерон."
  es:
    - "Atarot era una ciudad de la meseta al este del mar Muerto, entre Medeba y Dibón. Encabeza la lista de las ciudades de la buena tierra de pastos que Gad y Rubén pidieron a Moisés, «Ataroth, y Dibón, y Jazer, y Nimra, y Hesbón», y los gaditas la reconstruyeron: «Y los hijos de Gad edificaron á Dibón, y á Ataroth, y á Aroer». La Biblia no dice más de ella, y no es la Atarot nombrada en la frontera de Efraín."
    - "Su suerte posterior la cuenta la otra parte. En la estela que erigió en Dibón en el siglo IX a. C., Mesa, rey de Moab, dice que los hombres de Gad habían vivido desde antiguo en la tierra de Atarot y que el rey de Israel había construido Atarot para sí; Mesa tomó la ciudad, mató a su pueblo para su dios Quemós, se llevó un objeto de la ciudad (la frase es oscura) y asentó allí a hombres de otros lugares. La ciudad es Khirbet Ataruz, en una cresta bajo el Jebel Attarus, donde las excavaciones dirigidas por Chang-Ho Ji desde 2000 han sacado a la luz un santuario de la edad del Hierro con altares, soportes de culto y figurillas, y un altar con inscripción en moabita. Las ruinas se encuentran hoy en la gobernación de Madaba, en Jordania, no lejos de la fortaleza en la colina de Maqueronte."
  pt:
    - "Atarote era uma cidade no planalto a leste do mar Morto, entre Medeba e Dibom. Encabeça a lista das cidades da boa terra de pastagem que Gade e Rúben pediram a Moisés, “Atarote, Dibom, Jazer, Ninra, Hesbom”, e os gaditas a reconstruíram: “Os filhos de Gade construíram Dibom, Atarote, Aroer”. A Bíblia nada mais diz dela, e não é a Atarote nomeada na fronteira de Efraim."
    - "Seu destino posterior é contado pelo outro lado. Na estela que ergueu em Dibom no século IX a.C., Mesa, rei de Moabe, diz que os homens de Gade viviam desde sempre na terra de Atarote e que o rei de Israel construíra Atarote para si; Mesa tomou a cidade, matou seu povo para o seu deus Quemós, levou um objeto da cidade (a expressão é obscura) e instalou ali homens de outros lugares. A cidade é Khirbet Ataruz, numa crista abaixo do Jebel Attarus, onde escavações dirigidas por Chang-Ho Ji desde 2000 trouxeram à luz um santuário da Idade do Ferro com altares, suportes de culto e figurinhas, e um altar com inscrição em moabita. As ruínas ficam hoje na província de Madaba, na Jordânia, não longe da fortaleza de colina de Maqueronte."
  de:
    - "Atarot war eine Stadt auf dem Plateau östlich des Toten Meeres, zwischen Medeba und Dibon. Sie steht an der Spitze der Liste der Städte des guten Weidelands, das Gad und Ruben von Mose erbaten, „Ataroth, Dibon, Jaser, Nimra, Hesbon“, und die Gaditer bauten sie wieder auf: „Da bauten die Kinder Gad Dibon, Ataroth, Aroer“. Mehr sagt die Bibel nicht von ihr, und sie ist nicht das Atarot, das an der Grenze Ephraims genannt wird."
    - "Ihr späteres Schicksal erzählt die andere Seite. Auf der Stele, die er im 9. Jahrhundert v. Chr. in Dibon aufstellte, sagt Mesa, der König von Moab, die Männer von Gad hätten von alters her im Land Atarot gewohnt, und der König von Israel habe Atarot für sich gebaut; Mesa nahm die Stadt, tötete ihr Volk für seinen Gott Kemosch, führte einen Gegenstand der Stadt fort (der Ausdruck ist dunkel) und siedelte Männer von anderen Orten dort an. Die Stadt ist Chirbet Ataruz, auf einem Rücken unterhalb des Dschebel Attarus, wo Grabungen unter Leitung von Chang-Ho Ji seit 2000 ein eisenzeitliches Heiligtum mit Altären, Kultständern und Figuren sowie einen Altar mit moabitischer Inschrift freigelegt haben. Die Ruinen liegen heute im Gouvernement Madaba in Jordanien, nicht weit von der Bergfestung Machärus."
  fr:
    - "Atharoth était une ville du plateau à l’est de la mer Morte, entre Médeba et Dibon. Elle ouvre la liste des villes du bon pays de pâturage que Gad et Ruben demandèrent à Moïse, « Atharoth, Dibon, Jaezer, Nimra, Hesbon », et les Gadites la rebâtirent : « Les fils de Gad bâtirent Dibon, Atharoth, Aroër ». La Bible n’en dit pas plus, et ce n’est pas l’Atharoth nommée à la frontière d’Éphraïm."
    - "Son sort ultérieur est raconté par l’autre camp. Sur la stèle qu’il dressa à Dibon au IXe siècle av. J.-C., Mescha, roi de Moab, dit que les hommes de Gad habitaient le pays d’Atharoth depuis toujours et que le roi d’Israël s’y était bâti Atharoth ; Mescha prit la ville, tua son peuple pour son dieu Kemosch, emporta un objet de la ville (l’expression est obscure) et y établit des hommes d’autres lieux. La ville est Khirbet Ataruz, sur une crête au-dessous du Jebel Attarus, où des fouilles dirigées par Chang-Ho Ji depuis 2000 ont mis au jour un sanctuaire de l’âge du Fer avec autels, supports de culte et figurines, et un autel portant une inscription en moabite. Les ruines se trouvent aujourd’hui dans le gouvernorat de Madaba, en Jordanie, non loin de la forteresse de Machéronte."
  it:
    - "Atarot era una città sull’altopiano a est del Mar Morto, tra Màdaba e Dibon. Apre l’elenco delle città della buona terra da pascolo che Gad e Ruben chiesero a Mosè, «Ataroth, Dibon, Iazer, Nimrah, Heshbon», e i Gaditi la ricostruirono: «E i figliuoli di Gad edificarono Dibon, Ataroth, Aroer». La Bibbia non ne dice altro, e non è l’Atarot nominata sul confine di Efraim."
    - "La sua sorte posteriore è raccontata dall’altra parte. Sulla stele che eresse a Dibon nel IX secolo a.C., Mesa, re di Moab, dice che gli uomini di Gad abitavano da sempre nella terra di Atarot e che il re d’Israele aveva costruito Atarot per sé; Mesa prese la città, uccise la sua gente per il suo dio Camos, portò via un oggetto della città (l’espressione è oscura) e vi stabilì uomini di altri luoghi. La città è Khirbet Ataruz, su una cresta sotto il Jebel Attarus, dove gli scavi condotti da Chang-Ho Ji dal 2000 hanno portato alla luce un santuario dell’età del Ferro con altari, supporti cultuali e figurine, e un altare con iscrizione moabita. Le rovine si trovano oggi nel governatorato di Madaba in Giordania, non lontano dalla fortezza collinare di Macheronte."
  pl:
    - "Atarot było miastem na wyżynie na wschód od Morza Martwego, między Medebą a Dibonem. Otwiera wykaz miast dobrej ziemi pastwiskowej, o którą Gad i Ruben prosili Mojżesza: „Ataret i Dybon, i Jazer, i Nemra, i Hesebon”, a Gadyci je odbudowali: „I pobudowali synowie Gadowi Dybon, i Atarot, i Aroer”. Biblia nie mówi o nim więcej i nie jest to Atarot wymienione na granicy Efraima."
    - "Jego późniejsze losy opowiada druga strona. Na steli wzniesionej w Dibonie w IX wieku p.n.e. Mesza, król Moabu, mówi, że mężowie Gada od dawna mieszkali w ziemi Atarot i że król Izraela zbudował Atarot dla siebie; Mesza zdobył miasto, zabił jego mieszkańców dla swego boga Kemosza, uprowadził przedmiot miasta (wyrażenie jest niejasne) i osiedlił tam ludzi z innych miejsc. Miastem jest Chirbet Ataruz na grzbiecie pod Dżabal Attarus, gdzie wykopaliska prowadzone od 2000 roku przez Chang-Ho Ji odsłoniły sanktuarium z epoki żelaza z ołtarzami, stojakami kultowymi i figurkami oraz ołtarz z napisem moabickim. Ruiny leżą dziś w muhafazie Madaba w Jordanii, niedaleko górskiej twierdzy Macheront."
  nl:
    - "Atarot was een stad op het plateau ten oosten van de Dode Zee, tussen Medeba en Dibon. Het staat bovenaan de lijst van de steden van het goede weideland dat Gad en Ruben aan Mozes vroegen, “Ataroth, en Dibon, en Jaezer, en Nimra, en Hesbon”, en de Gadieten herbouwden het: “de kinderen van Gad bouwden Dibon, en Ataroth, en Aroer”. De Bijbel zegt er niets meer over, en het is niet het Atarot dat aan de grens van Efraïm wordt genoemd."
    - "Haar latere lot wordt door de andere partij verteld. Op de stèle die hij in de negende eeuw v.Chr. te Dibon oprichtte, zegt Mesa, koning van Moab, dat de mannen van Gad van oudsher in het land Atarot hadden gewoond en dat de koning van Israël Atarot voor zich had gebouwd; Mesa nam de stad, doodde haar bevolking voor zijn god Kemos, voerde een voorwerp van de stad weg (de uitdrukking is duister) en vestigde er mannen van andere plaatsen. De stad is Khirbet Ataruz, op een bergrug onder de Jebel Attarus, waar opgravingen onder Chang-Ho Ji sinds 2000 een ijzertijdheiligdom met altaren, cultusstandaards en beeldjes blootlegden, en een altaar met een Moabitisch opschrift. De ruïnes liggen nu in het gouvernement Madaba van Jordanië, niet ver van de bergvesting Machaerus."
  cs:
    - "Atarót bylo město na planině východně od Mrtvého moře, mezi Medebou a Dibonem. Stojí v čele seznamu měst dobré pastvinné země, kterou Gád a Rúben žádali od Mojžíše, „Atarot a Dibon, a Jazer a Nemra, Ezebon“, a Gádovci je přestavěli: „vzdělali synové Gád, Dibon, Atarot a Aroer“. Bible o něm víc neříká a není to Atarót jmenovaný na hranici Efrajimově."
    - "Jeho pozdější osud vypráví druhá strana. Na stéle, kterou vztyčil v Dibonu v 9. století př. n. l., Meša, král Moábu, praví, že muži Gádovi žili v zemi Atarót od pradávna a že izraelský král si Atarót vybudoval; Meša město dobyl, jeho lid pobil pro svého boha Kemoše, odvlekl předmět města (výraz je nejasný) a usadil tam muže z jiných míst. Město je Chirbet Ataruz, na hřebeni pod Jebel Attarus, kde vykopávky vedené Chang-Ho Ji od roku 2000 odkryly svatyni z doby železné s oltáři, kultovními podstavci a figurkami a oltář s nápisem v moábštině. Zříceniny leží dnes v guvernorátu Madaba v Jordánsku, nedaleko pahorkové pevnosti Machairús."
  sv:
    - "Atarot var en stad på platån öster om Döda havet, mellan Medeba och Dibon. Den står först i förteckningen över städerna i det goda betesland som Gad och Ruben bad Mose om, ”Atarot, Dibon, Jaeser, Nimra, Hesbon”, och gaditerna byggde upp den: ”Och Gads barn byggde upp Dibon, Atarot, Aroer”. Bibeln säger inget mer om den, och det är inte det Atarot som nämns på Efraims gräns."
    - "Dess senare öde berättas av den andra sidan. På stelen han reste i Dibon på 800-talet f.Kr. säger Mesha, Moabs kung, att Gads män hade bott i Atarots land sedan gammalt och att Israels kung hade byggt Atarot åt sig; Mesha intog staden, dräpte dess folk åt sin gud Kemosh, förde bort ett föremål från staden (uttrycket är dunkelt) och bosatte män från andra platser där. Staden är Khirbet Ataruz, på en ås nedanför Jebel Attarus, där utgrävningar under ledning av Chang-Ho Ji sedan 2000 har blottlagt en järnåldershelgedom med altaren, kultstativ och figurer, och ett altare med moabitisk inskrift. Ruinerna ligger i dag i Jordaniens guvernement Madaba, inte långt från bergsfästningen Machairos."
  nb:
    - "Atarot var en by på høysletten øst for Dødehavet, mellom Medeba og Dibon. Den står først i listen over byene i det gode beitelandet som Gad og Ruben ba Moses om, «Atarot og Dibon og Jaser og Nimra og Hesbon», og gadittene bygde den opp igjen: «Gads barn bygget op igjen Dibon og Atarot og Aroer». Bibelen sier ikke mer om den, og den er ikke Atarot ved grensen til Efraim."
    - "Dens senere skjebne fortelles av den andre siden. På steleen han reiste i Dibon på 800-tallet f.Kr. sier Mesa, konge av Moab, at gadittene hadde bodd i Atarots land fra gammelt av og at Israels konge hadde bygd Atarot for seg selv; Mesa tok byen, drepte folket der for guden sin Kamos, førte bort en gjenstand fra byen (uttrykket er uklart) og bosatte menn fra andre steder der. Byen er Khirbet Ataruz, på en rygg under Jebel Attarus, der utgravninger ledet av Chang-Ho Ji siden 2000 har avdekket en helligdom fra jernalderen med altre, kultstativer og figurer, og et alter med moabittisk innskrift. Ruinene ligger i dag i Madaba-guvernementet i Jordan, ikke langt fra høydefestningen Makaerus."
  tl:
    - "Ang Ataroth ay bayan sa talampas sa silangan ng Dagat na Patay, sa pagitan ng Medeba at Dibon. Nangunguna ito sa talaan ng mga bayan ng mabuting pastulan na hiniling nina Gad at Ruben kay Moises, “Ang Ataroth, at ang Dibon, at ang Jazer, at ang Nimra, at ang Hesbon”, at itinayong muli ito ng mga Gadita: “itinayo ng mga anak ni Gad ang Dibon, at ang Ataroth, at ang Aroer”. Wala nang sinasabi ang Biblia tungkol dito, at hindi ito ang Ataroth na pinangalanan sa hangganan ng Ephraim."
    - "Ang kalaunang kapalaran nito ay isinalaysay ng kabilang panig. Sa estelang itinayo niya sa Dibon noong ika-9 na siglo BK, sinabi ni Mesa, hari ng Moab, na ang mga lalaki ng Gad ay nanirahan sa lupain ng Ataroth mula pa noong una at na itinayo ng hari ng Israel ang Ataroth para sa sarili; kinuha ni Mesa ang bayan, pinatay ang mga tao nito para sa kaniyang diyos na si Chemos, dinala ang isang bagay ng bayan (malabo ang parirala) at nagpatira roon ng mga tao mula sa ibang lugar. Ang bayan ay ang Khirbet Ataruz, sa tagaytay sa ibaba ng Jebel Attarus, kung saan ang mga paghuhukay na pinamunuan ni Chang-Ho Ji mula 2000 ay nakatuklas ng santuwaryo ng Panahon ng Bakal na may mga altar, tindig-sambahan at pigurin, at isang altar na may inskripsiyon sa Moabita. Ang mga guho ay nasa Gobernorado ng Madaba ng Jordan ngayon, hindi kalayuan sa kutang-burol ng Macaero."
  da:
    - "Atarot var en by på højsletten øst for Det Døde Hav, mellem Medeba og Dibon. Den står først i listen over byerne i det gode græsningsland, som Gad og Ruben bad Moses om, »Atharoth og Dibon og Jaeser og Nimra og Hesbon«, og gaditterne genopbyggede den: »Saa byggede Gads Børn Dibon og Ataroth og Aroer«. Bibelen siger intet mere om den, og den er ikke det Atarot, der nævnes på Efraims grænse."
    - "Dens senere skæbne fortælles af den anden side. På stelen, han rejste i Dibon i 800-tallet f.Kr., siger Mesja, Moabs konge, at Gads mænd fra ældgammel tid havde boet i Atarots land, og at Israels konge havde bygget Atarot til sig selv; Mesja indtog byen, dræbte dens folk for sin gud Kemosj, bortførte en genstand fra byen (udtrykket er uklart) og bosatte folk fra andre steder dér. Byen er Khirbet Ataruz, på en højderyg under Jebel Attarus, hvor udgravninger under Chang-Ho Ji siden 2000 har afdækket en jernaldershelligdom med altre, kultstandere og figurer og et alter med moabitisk indskrift. Ruinerne ligger i dag i Madaba-guvernementet i Jordan, ikke langt fra bjergfæstningen Machaerus."
  sr:
    - "Атарот је био град на висоравни источно од Мртвог мора, између Медеве и Девона. Предводи списак градова добре пашњачке земље коју су Гад и Рувим тражили од Мојсија, „Атарот и Девон и Јазир и Намра и Есевон“, а Гадовци су га обновили: „И саградише синови Гадови Девон и Атарот и Ароир“. Библија о њему не каже више, а није исти као Атарот именован на међи Јефремовој."
    - "Његову каснију судбину прича друга страна. На стели коју је подигао у Девону у 9. веку п. н. е. Миса, цар Моава, каже да су људи Гадови одвајкада живели у земљи Атарот и да је цар Израиља сазидао Атарот за себе; Миса је заузео град, побио његов народ за свог бога Хемоса, однео један предмет града (израз је нејасан) и населио људе из других места. Град је Хирбет Атаруз, на гребену испод Џебел Атаруса, где су ископавања под вођством Чанг-Хо Џија од 2000. открила светилиште гвозденог доба са олтарима, култним постољима и фигуринама, и олтар са моавским натписом. Рушевине данас леже у гувернорату Мадаба у Јордану, недалеко од брдске тврђаве Макер."
  hu:
    - "Atarót a Holt-tengertől keletre fekvő fennsíkon álló város volt Médeba és Dibon között. Ő nyitja a jó legelőföld városainak jegyzékét, amelyet Gád és Rúben Mózestől kért: „Atárót, Díbon, Jázér, Nimra, Hesbon”, a gáditák pedig újjáépítették: „És megépíték a Gád fiai Dibont, Ataróthot, Aroért”. A Biblia többet nem mond róla, és nem azonos az Efraim határán említett Atarót nevű hellyel."
    - "Későbbi sorsát a másik oldal meséli el. A dibóni sztélén, amelyet a Kr. e. 9. században állított, Mésa, Moáb királya azt mondja, hogy Gád emberei régtől fogva Atarót földjén laktak, és Izráel királya építette fel magának Atarótot; Mésa elfoglalta a várost, népét megölte istene, Kámos számára, elvitt a városból egy tárgyat (a kifejezés homályos), és más helyekről való embereket telepített oda. A város a Khirbet Ataruz, a Jebel Attarus alatti gerincen, ahol Chang-Ho Ji vezetésével 2000 óta folyó ásatások vaskori szentélyt tártak fel oltárokkal, kultuszállványokkal és szobrocskákkal, valamint egy moábi nyelven feliratos oltárt. A romok ma Jordánia Mádabai kormányzóságában fekszenek, nem messze a Makhairosz hegyi erődtől."
  fi:
    - "Atarot oli kaupunki Kuolleenmeren itäpuolisella ylängöllä Medeban ja Dibonin välissä. Se on ensimmäisenä luettelossa hyvän laidunmaan kaupungeista, joita Gad ja Ruuben pyysivät Moosekselta: ”Atarot, Diibon, Jaeser, Nimra, Hesbon”, ja gadilaiset rakensivat sen: ”gaadilaiset rakensivat Diibonin, Atarotin, Aroerin”. Raamattu ei kerro siitä muuta, eikä se ole Efraimin rajalla mainittu Atarot."
    - "Sen myöhemmän kohtalon kertoo toinen osapuoli. 800-luvulla eaa. Dibonissa pystyttämässään steelassa Mesa, Moabin kuningas, sanoo, että Gadin miehet olivat asuneet Atarotin maassa muinaisista ajoista ja että Israelin kuningas oli rakentanut Atarotin itselleen; Mesa valtasi kaupungin, tappoi sen väen jumalalleen Kemosille, vei pois kaupungin esineen (ilmaus on hämärä) ja asutti sinne miehiä muualta. Kaupunki on Khirbet Ataruz, harjanteella Jebel Attaruksen alapuolella, missä Chang-Ho Ji johtamat kaivaukset vuodesta 2000 ovat paljastaneet rautakautisen pyhäkön, jossa oli alttareita, kulttijalustoja ja patsaita, sekä moabiksi kirjoitetun alttarin. Rauniot sijaitsevat nykyisin Jordanian Madaban kuvernementissa, ei kaukana Machaeruksen kukkulalinnoituksesta."
  vi:
    - "A-ta-rốt là một thành trên cao nguyên phía đông Biển Chết, giữa Mê-đê-ba và Đi-bôn. Nó đứng đầu danh sách các thành của vùng đồng cỏ tốt mà Gát và Ru-bên xin Môi-se, “A-ta-rốt, Đi-bôn, Gia-ê-xe, Nim-ra, Hết-bôn”, và người Gát xây lại nó: “Con cháu Gát bèn xây cất Đi-bôn, A-ta-rốt, A-rô-e”. Kinh Thánh không nói thêm về nó, và nó không phải A-ta-rốt được nêu trên ranh giới của Ép-ra-im."
    - "Số phận về sau của nó được kể từ phía bên kia. Trên tấm bia dựng tại Đi-bôn vào thế kỷ 9 TCN, Mê-sa, vua Mô-áp, nói rằng người Gát đã ở trong đất A-ta-rốt từ xưa và vua Y-sơ-ra-ên đã xây A-ta-rốt cho mình; Mê-sa chiếm thành, giết dân nó cho thần Kê-mốt của ông, đem đi một vật của thành (cụm từ này mờ nghĩa) và đưa người từ nơi khác đến ở. Thành là Khirbet Ataruz, trên một sườn núi dưới Jebel Attarus, nơi các cuộc khai quật do Chang-Ho Ji dẫn đầu từ năm 2000 đã phát lộ một thánh địa thời Đồ Sắt với các bàn thờ, giá cúng và tượng nhỏ, cùng một bàn thờ có khắc chữ Mô-áp. Tàn tích ngày nay nằm trong tỉnh Madaba của Gióc-đa-ni, không xa pháo đài trên đồi Machaerus."
  ro:
    - "Atarot era o cetate pe platoul de la est de Marea Moartă, între Medeba și Dibon. Deschide lista cetăților din ținutul bun de pășune pe care Gad și Ruben l-au cerut de la Moise, Atarot, Dibon, Iazer, Nimra și Hesbon, iar gadiții au reconstruit-o: „Și au zidit fiii lui Gad Devonul și Atarotul și Aroirul”. Biblia nu mai spune nimic despre ea, și nu este Atarotul numit pe hotarul lui Efraim."
    - "Soarta ei ulterioară este povestită de cealaltă parte. Pe stela pe care a ridicat-o la Dibon în secolul al IX-lea î.Hr., Meșa, regele Moabului, spune că oamenii din Gad locuiseră din vechime în țara Atarot și că regele lui Israel își zidise Atarotul pentru sine; Meșa a luat cetatea, i-a ucis oamenii pentru zeul său Chemoș, a dus un obiect al cetății (expresia este obscură) și a așezat acolo oameni din alte locuri. Cetatea este Khirbet Ataruz, pe o creastă sub Jebel Attarus, unde săpăturile conduse de Chang-Ho Ji din anul 2000 au scos la iveală un sanctuar din epoca fierului cu altare, suporturi de cult și figurine și un altar cu inscripție în moabită. Ruinele se află astăzi în guvernoratul Madaba din Iordania, nu departe de fortăreața de pe deal de la Macherus."
  bg:
    - "Атарот бил град на платото на изток от Мъртво море, между Медева и Дивон. Той води списъка на градовете на добрата пасищна земя, която Гад и Рувим поискали от Мойсей, „Атарот, и Девон, и Язир, и Нимра, и Есевон“, а гадците го възстановили: „Гадовите синове съградиха Девон, и Атарот, и Ароир“. Библията не казва нищо повече за него и той не е Атарот, назован на границата на Ефрем."
    - "По-късната му съдба се разказва от другата страна. На стелата, която поставил в Дивон през IX в. пр.н.е., Меша, цар на Моав, казва, че гадците живеели от древност в земята на Атарот и че израилският цар бил построил Атарот за себе си; Меша взел града, избил народа му за бога си Хамос, отнесъл предмет на града (изразът е неясен) и заселил там мъже от други места. Градът е Хирбет Атаруз, на хребет под Джебел Атарус, където разкопки, водени от Чан-Хо Джи от 2000 г., откриха светилище от желязната епоха с олтари, култови стойки и фигурки и олтар с надпис на моавски. Развалините лежат днес в мухафазата Мадаба в Йордания, недалеч от хълмовата крепост Махерус."
