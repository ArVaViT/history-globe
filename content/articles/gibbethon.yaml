body:
  en:
    - "Gibbethon was a town on the edge of the Philistine plain, in the lot of Dan near Ekron and Gezer, which Joshua lists with Eltekeh and Baalath and assigns to the Levites of Kohath. Its site is disputed: the map's candidates are Tell Melat (Tel Malot), a mound about 5 km west of Gezer, Ras Abu Hamid near Ramla, Aqir, and Qibya in the hills to the north-east. The Synodal Bible spells the name Гиввефон in Joshua and Гавафон in Kings."
    - "Around 900 BC Gibbethon was held by the Philistines, and twice the army of Israel lay before it when its king was killed at home. Nadab son of Jeroboam “and all Israel laid siege to Gibbethon”, and Baasha “smote him at Gibbethon, which belonged to the Philistines” in the third year of Asa, about 909 BC. A generation later, “in the twenty and seventh year of Asa”, about 885 BC, “the people were encamped against Gibbethon” when Zimri murdered Elah in Tirzah; the army in the camp “made Omri, the captain of the host, king over Israel that day”, and “Omri went up from Gibbethon, and all Israel with him, and they besieged Tirzah”. So the dynasty of Omri began under the walls of this town."
    - "Gibbethon appears once more outside the Bible: among the towns of his western campaigns whose capture Sargon II of Assyria had carved on the walls of his palace at Khorsabad is a city labelled Gabbutunu. Today the candidate mounds lie among the fields and towns between Rehovot, Ramla and Gezer in central Israel, and the Philistine border town is known only from these few lines."
  ru:
    - "Гавафон был городом на краю Филистимской равнины, в уделе Дана близ Екрона и Газера; Иисус Навин перечисляет его вместе с Елтеке и Ваалафом и отдаёт левитам из рода Каафа. Место его спорно: кандидаты на карте — Телль-Мелат (Тель-Малот), холм примерно в 5 км к западу от Газера, Рас-Абу-Хамид близ Рамлы, Акир и Кибия в холмах к северо-востоку. Синодальный перевод пишет имя как Гиввефон в книге Иисуса Навина и как Гавафон в книгах Царств."
    - "Около 900 г. до н. э. Гавафон держали Филистимляне, и дважды войско Израиля стояло под ним, когда дома убивали царя. Нават, сын Иеровоама, «и все Израильтяне осаждали Гавафон», и Вааса убил его «при Гавафоне Филистимском» в третий год Асы, около 909 г. до н. э. Поколение спустя, «в двадцать седьмой год Асы», около 885 г. до н. э., «народ осаждал Гавафон Филистимский», когда Замврий умертвил Илу в Фирце; войско в стане воцарило «Амврия, военачальника, над Израилем в тот же день», и «отступили Амврий и все Израильтяне с ним от Гавафона и осадили Фирцу». Так династия Амврия началась под стенами этого города."
    - "Ещё раз Гавафон появляется вне Библии: среди городов его западных походов, взятие которых Саргон II Ассирийский велел высечь на стенах своего дворца в Хорсабаде, есть город с подписью Габбутуну. Сегодня холмы-кандидаты лежат среди полей и городков между Реховотом, Рамлой и Газером в центре Израиля, а филистимский пограничный город известен только по этим немногим строкам."
  uk:
    - "Гіббетон був містом на краю філістимської рівнини, в уділі Дана поблизу Екрона й Гезера, яке Ісус Навин перелічує разом з Елтеке й Ваалатом і призначає левітам з роду Кааф. Його місце спірне: кандидати на карті — Телль-Мелат (Тель-Малот), городище приблизно за 5 км на захід від Гезера, Рас-Абу-Хамід поблизу Рамли, Акір і Кібья в пагорбах на північному сході. Синодальна Біблія пише цю назву Гиввефон у Книзі Ісуса Навина й Гавафон у Книгах Царів."
    - "Близько 900 р. до н. е. Гіббетон тримали філістимляни, і двічі військо Ізраїлю стояло перед ним, коли вдома вбивали його царя. Надав, син Єровоама, «і всї Ізрайлитяне облягали Геббетон», і Вааса «вбив його в Геббетонї Филистійському» на третій рік Аси, близько 909 р. до н. е. Через покоління, «у двайцять семому роцї Асиному», близько 885 р. до н. е., «військо облягало Геббетон Филистійський», коли Зімрі вбив Елу в Тірці; і тоді «таки того ж дня в таборі увесь Ізраїль зробив царем Амбрія, що гетьманував над Ізраїлем», і «відступили Амбрій з усїм Ізраїлем від Геббетону, та й обложили Тирсу». Так династія Омрі почалася під мурами цього міста."
    - "Гіббетон з’являється ще раз поза Біблією: серед міст його західних походів, здобуття яких Саргон II Ассирійський наказав вирізьбити на стінах свого палацу в Хорсабаді, є місто з підписом Габбутуну. Сьогодні кандидати-городища лежать серед полів і міст між Реховотом, Рамлою та Гезером у центральному Ізраїлі, а філістимське прикордонне місто відоме лише з цих кількох рядків."
  es:
    - "Gibetón era una población en el borde de la llanura filistea, en la suerte de Dan, cerca de Ecrón y Gezer, que Josué enumera con Elteque y Baalat y asigna a los levitas de Coat. Su emplazamiento es discutido: los candidatos del mapa son Tell Melat (Tel Malot), un montículo a unos 5 km al oeste de Gezer, Ras Abu Hamid, cerca de Ramla, Aqir, y Qibya, en las colinas del nordeste. La Biblia sinodal escribe el nombre Гиввефон en Josué y Гавафон en Reyes."
    - "Hacia el 900 a. C. Gibetón estaba en manos de los filisteos, y dos veces el ejército de Israel acampó ante ella cuando su rey fue muerto en su propio país. Nadab hijo de Jeroboam y todo Israel «tenían cercado á Gibbethón», y Baasa lo mató: «é hiriólo Baasa en Gibbethón, que era de los Filisteos», en el tercer año de Asa, hacia el 909 a. C. Una generación después, «en el año veintisiete de Asa rey de Judá», hacia el 885 a. C., «el pueblo había asentado campo sobre Gibbethón» cuando Zimri asesinó a Ela en Tirsa; el ejército del campamento «levantó el mismo día por rey sobre Israel á Omri, general del ejército», y «subió Omri de Gibbethón, y con él todo Israel, y cercaron á Thirsa». Así la dinastía de Omri comenzó bajo los muros de esta población."
    - "Gibetón aparece una vez más fuera de la Biblia: entre las ciudades de sus campañas occidentales cuya captura Sargón II de Asiria hizo esculpir en las paredes de su palacio de Jorsabad figura una ciudad rotulada Gabbutunu. Hoy los montículos candidatos se hallan entre los campos y las ciudades que van de Rehovot a Ramla y Gezer, en el centro de Israel, y la población fronteriza filistea solo se conoce por estas pocas líneas."
  pt:
    - "Gibetom era uma cidade na orla da planície filisteia, na porção de Dã, perto de Ecrom e Gezer, que Josué lista com Elteque e Baalate e atribui aos levitas de Coate. Seu sítio é disputado: os candidatos do mapa são Tell Melat (Tel Malot), um monte a cerca de 5 km a oeste de Gezer, Ras Abu Hamid, perto de Ramla, Aqir, e Qibya, nas colinas a nordeste. A Bíblia Sinodal escreve o nome Гиввефон em Josué e Гавафон em Reis."
    - "Por volta de 900 a.C., Gibetom estava em poder dos filisteus, e duas vezes o exército de Israel esteve diante dela quando seu rei foi morto em casa. Nadabe, filho de Jeroboão, e “todo o Israel estavam cercando Gibetom”, e Baasa “o atacou em Gibetom, que pertencia aos filisteus” no terceiro ano de Asa, por volta de 909 a.C. Uma geração depois, “no vigésimo sétimo ano de Asa”, por volta de 885 a.C., “o povo estava acampado contra Gibetom” quando Zinri matou Elá em Tirza; o exército no acampamento “fez de Onri, o capitão do exército, rei sobre Israel naquele dia”, e “Onri subiu de Gibetom, e todo o Israel com ele, e cercaram Tirza”. Assim a dinastia de Onri começou sob os muros desta cidade."
    - "Gibetom aparece mais uma vez fora da Bíblia: entre as cidades de suas campanhas ocidentais cuja captura Sargão II da Assíria mandou gravar nas paredes de seu palácio em Corsabade há uma cidade chamada Gabbutunu. Hoje os montes candidatos ficam entre campos e cidades entre Rehovot, Ramla e Gezer, no centro de Israel, e a cidade fronteiriça filisteia é conhecida apenas por estas poucas linhas."
  de:
    - "Gibbeton war eine Stadt am Rand der Philisterebene, im Los Dans bei Ekron und Geser, die Josua mit Elteke und Baalat aufführt und den Leviten von Kehat zuweist. Ihre Lage ist umstritten: Die Kandidaten auf der Karte sind Tell Melat (Tel Malot), ein Hügel etwa 5 km westlich von Geser, Ras Abu Hamid bei Ramla, Aqir und Qibya im Bergland im Nordosten. Die Synodalübersetzung schreibt den Namen bei Josua Гиввефон und in den Königsbüchern Гавафон."
    - "Um 900 v. Chr. war Gibbeton in der Hand der Philister, und zweimal lag das Heer Israels davor, als sein König zu Hause getötet wurde. „Nadab und das ganze Israel belagerten Gibbethon“, und Baesa „erschlug ihn zu Gibbethon, welches den Philistern gehört“, im dritten Jahr Asas, um 909 v. Chr. Eine Generation später, „im siebenundzwanzigsten Jahr Asas“, um 885 v. Chr., wiederholte sich das: „Und das Volk lag vor Gibbethon der Philister“, als Simri in Tirza Ela ermordete; das Heer im Lager „machte das ganze Israel desselben Tages Omri, den Feldhauptmann, zum König über Israel im Lager“, und „Omri zog herauf und das ganze Israel mit ihm von Gibbethon und belagerten Thirza“. So begann die Dynastie Omris unter den Mauern dieser Stadt."
    - "Gibbeton erscheint noch einmal außerhalb der Bibel: Unter den Städten seiner Westfeldzüge, deren Einnahme Sargon II. von Assyrien an die Wände seines Palastes in Chorsabad meißeln ließ, ist eine Stadt mit der Beischrift Gabbutunu. Heute liegen die Kandidatenhügel zwischen Feldern und Städten zwischen Rechovot, Ramla und Geser in Zentralisrael, und die philistäische Grenzstadt ist nur aus diesen wenigen Zeilen bekannt."
  fr:
    - "Guibbethon était une ville en bordure de la plaine philistine, dans le lot de Dan, près d’Ékron et de Guézer, que Josué énumère avec Eltheké et Baalath et attribue aux Lévites de Kehath. Son emplacement est discuté : les candidats de la carte sont Tell Melat (Tel Malot), un tertre à environ 5 km à l’ouest de Guézer, Ras Abu Hamid près de Ramla, Aqir, et Qibya dans les collines au nord-est. La Bible synodale écrit le nom Гиввефон dans Josué et Гавафон dans les Rois."
    - "Vers 900 av. J.-C., Guibbethon était aux mains des Philistins, et à deux reprises l’armée d’Israël campa devant elle quand son roi fut tué chez lui. Nadab, fils de Jéroboam : « Nadab et tout Israël assiégeaient Guibbethon », et Baescha « le tua à Guibbethon, qui appartenait aux Philistins », la troisième année d’Asa, vers 909 av. J.-C. Une génération plus tard, « la vingt-septième année d’Asa », vers 885 av. J.-C., « le peuple campait contre Guibbethon » quand Zimri assassina Éla à Thirtsa ; ce jour-là, l’armée du camp « établit dans le camp pour roi d’Israël Omri, chef de l’armée », et « Omri et tout Israël avec lui partirent de Guibbethon, et ils assiégèrent Thirtsa ». Ainsi la dynastie d’Omri commença sous les murs de cette ville."
    - "Guibbethon apparaît une fois encore hors de la Bible : parmi les villes de ses campagnes occidentales dont Sargon II d’Assyrie fit graver la prise sur les murs de son palais de Khorsabad figure une cité désignée Gabbutunu. Aujourd’hui, les tertres candidats se trouvent parmi les champs et les villes entre Rehovot, Ramla et Guézer, dans le centre d’Israël, et la ville frontière philistine n’est connue que par ces quelques lignes."
  pl:
    - "Gibbeton było miastem na skraju równiny filistyńskiej, w dziale Dana koło Ekronu i Gezer, które Jozue wymienia z Elteke i Baalat i przydziela lewitom z rodu Kehata. Jego położenie jest sporne: kandydaci na mapie to Tell Melat (Tel Malot), pagórek około 5 km na zachód od Gezer, Ras Abu Hamid koło Ramli, Akir i Kibja we wzgórzach na północnym wschodzie. Biblia synodalna pisze nazwę Гиввефон w Księdze Jozuego i Гавафон w Księgach Królewskich."
    - "Około 900 r. p.n.e. Gibbeton było w rękach Filistynów i dwukrotnie wojsko Izraela stało pod nim, gdy w kraju zabito jego króla. Nadab, syn Jeroboama, „ze wszystkim Izraelem obległ był Giebbeton”, a o Baaszy czytamy: „poraził go Baaza u Giebbeton, które było Filistyńskie”, „roku trzeciego Azy”, około 909 r. p.n.e. Pokolenie później, „roku dwudziestego i siódmego Azy”, około 885 r. p.n.e., „lud obozem leżał u Giebbeton”, gdy Zimri zabił Elę w Tirsie; żołnierze w obozie „postanowili królem Amrego, który był hetmanem na wojskiem Izraelskiem onegoż dnia w obozie”, a „odciągnął Amry i wszystek Izrael z nim od Giebbeton, a oblegli Tersę”. Tak dynastia Omrego zaczęła się pod murami tego miasta."
    - "Gibbeton pojawia się jeszcze raz poza Biblią: wśród miast jego wypraw zachodnich, których zdobycie Sargon II z Asyrii kazał wykuć na ścianach swego pałacu w Chorsabadzie, jest miasto opisane jako Gabbutunu. Dziś pagórki-kandydaci leżą wśród pól i miast między Rechowotem, Ramlą i Gezer w środkowym Izraelu, a filistyńskie miasto graniczne znane jest tylko z tych kilku wierszy."
  it:
    - "Ghibbeton era una città al margine della pianura filistea, nel lotto di Dan presso Ekron e Ghezer, che Giosuè elenca con Elteche e Baalat e assegna ai Leviti di Keat. Il suo sito è controverso: i candidati sulla mappa sono Tell Melat (Tel Malot), un tell circa 5 km a ovest di Ghezer, Ras Abu Hamid presso Ramla, Aqir e Qibya sulle colline a nord-est. La Bibbia sinodale scrive il nome Гиввефон in Giosuè e Гавафон nei Re."
    - "Intorno al 900 a.C. Ghibbeton era in mano ai Filistei, e due volte l’esercito d’Israele vi stette davanti mentre il suo re veniva ucciso in patria. Nadab, figlio di Geroboamo, e tutto Israele «assediavano Ghibbethon», e Baasa «lo uccise a Ghibbethon, che apparteneva ai Filistei» nel terzo anno di Asa, verso il 909 a.C. Una generazione dopo, «l’anno ventisettesimo di Asa», verso l’885 a.C., «il popolo era accampato contro Ghibbethon» quando Zimri uccise Ela a Tirza; l’esercito nell’accampamento «fece re d’Israele Omri, capo dell’esercito», e «Omri con tutto Israele salì da Ghibbethon e assediò Tirtsa». Così la dinastia di Omri ebbe inizio sotto le mura di questa città."
    - "Ghibbeton compare ancora una volta fuori della Bibbia: fra le città delle sue campagne occidentali la cui presa Sargon II d’Assiria fece scolpire sulle pareti del suo palazzo a Khorsabad vi è una città indicata come Gabbutunu. Oggi i tell candidati si trovano fra i campi e le città tra Rehovot, Ramla e Ghezer, nel centro di Israele, e la città di confine filistea è nota solo da queste poche righe."
  nl:
    - "Gibbeton was een stad aan de rand van de Filistijnse vlakte, in het lot van Dan bij Ekron en Gezer, die Jozua noemt met Eltekeh en Baälat en toewijst aan de Levieten van Kehat. De ligging is omstreden: de kandidaten op de kaart zijn Tell Melat (Tel Malot), een heuvel ongeveer 5 km ten westen van Gezer, Ras Abu Hamid bij Ramla, Aqir en Qibya in het bergland ten noordoosten. De Synodale Bijbel schrijft de naam Гиввефон in Jozua en Гавафон in Koningen."
    - "Rond 900 v.Chr. was Gibbeton in Filistijnse handen, en tweemaal lag het leger van Israël ervoor toen zijn koning thuis werd gedood. Nadab, de zoon van Jerobeam, “en gans Israel Gibbethon belegerden”, en Baësa “sloeg hem te Gibbethon, hetwelk der Filistijnen is” in het derde jaar van Asa, omstreeks 909 v.Chr. Een generatie later, “in het zeven en twintigste jaar van Asa”, omstreeks 885 v.Chr., vermoordde Zimri Ela in Tirza; er staat: “het volk had zich gelegerd tegen Gibbethon”. Daar, in het kamp, “maakte het ganse Israel ten zelfden dage Omri, den krijgsoverste, koning over Israel, in het leger”, en “Omri toog op, en gans Israel met hem van Gibbethon, en belegerde Thirza”. Zo begon de dynastie van Omri onder de muren van deze stad."
    - "Gibbeton komt nog eenmaal voor buiten de Bijbel: onder de steden van zijn westelijke veldtochten, waarvan Sargon II van Assyrië de inname op de wanden van zijn paleis te Khorsabad liet uitbeitelen, staat een stad met het opschrift Gabbutunu. Nu liggen de kandidaat-heuvels tussen de akkers en steden van Rehovot, Ramla en Gezer in Midden-Israël, en de Filistijnse grensstad is alleen uit deze paar regels bekend."
  cs:
    - "Gibeton bylo město na okraji pelištejské roviny, v losu Danově poblíž Ekronu a Gezeru, které Jozue uvádí s Eltekem a Báalatem a přiděluje levitům Kehatovým. Jeho poloha je sporná: kandidáty na mapě jsou Tell Melat (Tel Malot), pahorek asi 5 km západně od Gezeru, Ras Abu Hamid u Ramly, Aqir a Qibya v pahorcích na severovýchodě. Synodální Bible píše jméno Гиввефон v Jozue a Гавафон v Královských."
    - "Kolem roku 900 př. n. l. drželi Gibeton Pelištejci a dvakrát před ním leželo izraelské vojsko, když byl doma zabit jeho král. Nádab, syn Jarobeámův, a „všickni Izraelští oblehli byli Gebbeton“ a tam jej Baeša zabil: „porazil ho Báza u Gebbeton, kteréž bylo Filistinských“, ve třetím roce Asy, asi 909 př. n. l. O generaci později, „Léta dvadcátého sedmého Azy“, asi 885 př. n. l., „lid vojenský ležel proti Gebbeton Filistinských“, když Zimrí zavraždil Élu v Tirse; vojsko v táboře „ustanovili sobě krále Amri, hejtmana nad vojskem Izraelským toho času v vojště“ a „Protož táhl Amri a s ním všecken Izrael od Gebbeton, a oblehli Tersu“. Dynastie Omríova tak začala pod hradbami tohoto města."
    - "Gibeton se objevuje ještě jednou mimo Bibli: mezi městy jeho západních tažení, jejichž dobytí nechal Sargon II. Asyrský vytesat na stěny svého paláce v Chorsábádu, je město označené Gabbutunu. Dnes kandidátské pahorky leží mezi poli a městy mezi Rechovotem, Ramlou a Gezerem ve středním Izraeli a pelištejské pohraniční město je známo jen z těchto několika řádků."
