body:
  en:
    - "Edrei was one of the two royal cities of Og, king of Bashan, with Ashtaroth; it is Daraa in southern Syria, near the Jordanian border, where the upper tributaries of the Yarmuk run through the basalt plain of the Hauran. When Israel “turned and went up by the way of Bashan”, “Og the king of Bashan went out against them, he, and all his people, to the battle at Edrei”, and was destroyed with his sons and his people, the last “of the remnant of giants”, whose iron bedstead was kept at Rabbah. Moses retold the battle in Deuteronomy, and Joshua gave Ashtaroth and Edrei, “cities of the kingdom of Og in Bashan”, to the half-tribe of Manasseh."
    - "Outside the Bible the town is first clearly seen in Roman times as Adraa, a city of the province of Arabia that struck its own coins and had a bishop by the fourth century; Eusebius calls it a famous city of Arabia, twenty-four miles from Bostra. Some read its name in the Egyptian town list of Thutmose III, but that is uncertain. Gottlieb Schumacher, who surveyed the Hauran in the 1880s, described under Deraa an underground town of streets and chambers cut in the rock, of unknown date; Roman and Byzantine remains lie among the modern houses, and the mound has never been excavated in a way that would show the Bronze Age city of Og."
    - "Daraa became a junction of the Hejaz railway early in the twentieth century and is now the capital of a Syrian governorate, with about 100,000 people before 2011, when the protests that began the Syrian war broke out there."
  ru:
    - "Едреи был одним из двух царских городов Ога, царя Васанского, вместе с Астарофом; это Дараа на юге Сирии, близ иорданской границы, где верхние притоки Ярмука текут по базальтовой равнине Хаурана. Когда Израильтяне «поворотили и пошли к Васану», «выступил против них Ог, царь Васанский, сам и весь народ его, на сражение к Едреи» и был истреблён с сыновьями и народом — последний из Рефаимов, чей железный одр хранился в Равве. Моисей пересказал битву во Второзаконии, а Иисус Навин отдал Астароф и Едреи, «царственные города Ога Васанского», полуколену Манассиину."
    - "Вне Библии город впервые ясно виден в римское время как Адраа, город провинции Аравия, чеканивший собственную монету и имевший епископа к IV веку; Евсевий называет его знаменитым городом Аравии в двадцати четырёх милях от Бостры. Некоторые читают его имя в египетском списке городов Тутмоса III, но это неясно. Готлиб Шумахер, обследовавший Хауран в 1880-х, описал под Дараа подземный город из улиц и комнат, вырубленных в скале, неизвестного времени; римские и византийские остатки лежат среди современных домов, а холм никогда не раскапывали так, чтобы увидеть город Ога бронзового века."
    - "В начале XX века Дараа стала узловой станцией Хиджазской железной дороги, а сейчас это столица сирийской провинции, где до 2011 года жило около 100 тысяч человек; в том году здесь начались протесты, с которых пошла сирийская война."
  uk:
    - "Едреї було одним з двох царських міст Ога, царя Башану, з Аштаротом; це Дераа на півдні Сирії, поблизу йорданського кордону, де верхні притоки Ярмуку течуть базальтовою рівниною Хавран. Коли ізраїльтяни: «повернули вони і пійшли шляхом до Базану», «вийшов Ог, царь Базанський, проти них з усїм людом своїм воювати з ними коло Едреї» і був знищений з синами та народом, останній «від останнїх Рефаїв-велетнїв», чиє залізне ложе зберігалося в Равві. Мойсей переказав битву в Повторенні Закону, а Ісус Навин віддав Аштарот і Едреї, «головні городи в царстві Ога, царя Базанського», півколіну Манасії."
    - "Поза Біблією місто вперше виразно бачимо в римські часи як Адраа, місто провінції Аравія, що карбувало власні монети й мало єпископа до IV ст.; Євсевій називає його славним містом Аравії, за двадцять чотири милі від Бостри. Дехто читає його назву в єгипетському списку міст Тутмоса III, але це непевно. Готліб Шумахер, який обстежував Хавран у 1880-х рр., описав під Дераа підземне місто з вулиць і кімнат, висічених у скелі, невідомої дати; римські та візантійські рештки лежать серед сучасних будинків, а горб ніколи не розкопувався так, щоб показати місто бронзової доби Ога."
    - "Дераа стало вузлом Хіджазької залізниці на початку XX ст. і нині є столицею сирійської мухафази, з близько 100 000 мешканців до 2011 р., коли там вибухнули протести, з яких почалася сирійська війна."
  es:
    - "Edrei era una de las dos ciudades reales de Og, rey de Basán, junto con Astarot; es Daraa, en el sur de Siria, cerca de la frontera con Jordania, donde los afluentes superiores del Yarmuk atraviesan la llanura de basalto del Haurán. Cuando los israelitas «volvieron, y subieron camino de Basán», «salió contra ellos Og rey de Basán, él y todo su pueblo, para pelear en Edrei», y fue destruido con sus hijos y su pueblo, el último «de los gigantes que quedaron», cuya cama de hierro se guardaba en Rabá. Moisés volvió a contar la batalla en el Deuteronomio, y Josué dio Astarot y Edrei, «ciudades del reino de Og en Basán», a la media tribu de Manasés."
    - "Fuera de la Biblia, la ciudad se ve con claridad por primera vez en época romana como Adraa, una ciudad de la provincia de Arabia que acuñaba moneda propia y tenía obispo en el siglo IV; Eusebio la llama una ciudad famosa de Arabia, a veinticuatro millas de Bostra. Algunos leen su nombre en la lista de ciudades egipcias de Tutmosis III, pero es incierto. Gottlieb Schumacher, que prospectó el Haurán en la década de 1880, describió bajo Deraa una ciudad subterránea de calles y cámaras excavadas en la roca, de fecha desconocida; restos romanos y bizantinos yacen entre las casas modernas, y el montículo nunca ha sido excavado de un modo que muestre la ciudad de la Edad del Bronce de Og."
    - "Daraa se convirtió en un nudo del ferrocarril del Hiyaz a comienzos del siglo XX y es hoy la capital de una gobernación siria, con unos 100 000 habitantes antes de 2011, cuando estallaron allí las protestas que iniciaron la guerra siria."
  pt:
    - "Edrei era uma das duas cidades reais de Ogue, rei de Basã, com Astarote; é Daraa, no sul da Síria, perto da fronteira jordaniana, onde os afluentes superiores do Yarmuk atravessam a planície basáltica do Haurã. Quando os israelitas “se viraram e subiram pelo caminho de Basã”, “Ogue, o rei de Basã, saiu contra eles, ele e todo o seu povo, para a batalha em Edrei”, e foi destruído com seus filhos e seu povo, o último “do remanescente dos refains”, cujo leito de ferro era guardado em Rabá. Moisés recontou a batalha no Deuteronômio, e Josué deu Astarote e Edrei, “as cidades do reino de Ogue em Basã”, à meia tribo de Manassés."
    - "Fora da Bíblia, a cidade é vista claramente pela primeira vez em época romana como Adraa, cidade da província da Arábia que cunhava moedas próprias e tinha bispo no século IV; Eusébio a chama de cidade famosa da Arábia, a vinte e quatro milhas de Bostra. Alguns leem seu nome na lista egípcia de cidades de Tutmés III, mas isso é incerto. Gottlieb Schumacher, que fez o levantamento do Haurã na década de 1880, descreveu sob Deraa uma cidade subterrânea de ruas e câmaras abertas na rocha, de data desconhecida; restos romanos e bizantinos jazem entre as casas modernas, e o monte nunca foi escavado de modo a revelar a cidade de Ogue da Idade do Bronze."
    - "Daraa tornou-se um entroncamento da ferrovia do Hejaz no início do século XX e é hoje capital de uma província síria, com cerca de 100.000 habitantes antes de 2011, quando ali eclodiram os protestos que deram início à guerra síria."
  de:
    - "Edrei war neben Astarot eine der beiden Königsstädte des Og, des Königs von Baschan; es ist Daraa in Südsyrien nahe der jordanischen Grenze, wo die oberen Zuflüsse des Jarmuk durch die Basaltebene des Hauran fließen. Als Israel sich wandte und hinaufzog, heißt es: „und wandten sich und zogen hinauf den Weg nach Basan. Da zog aus, ihnen entgegen, Og, der König von Basan, mit allem seinem Volk, zu streiten in Edrei“; er wurde mit seinen Söhnen und seinem Volk vernichtet, als der Letzte, der „noch übrig war von den Riesen“ und dessen eisernes Bett in Rabba aufbewahrt wurde. Mose erzählte die Schlacht im Deuteronomium neu, und Josua gab Astarot und Edrei, „die Städte des Königreichs Ogs von Basan“, dem halben Stamm Manasse."
    - "Außerhalb der Bibel ist die Stadt zuerst in römischer Zeit deutlich als Adraa zu sehen, eine Stadt der Provinz Arabien, die eigene Münzen prägte und im 4. Jahrhundert einen Bischof hatte; Eusebius nennt sie eine berühmte Stadt Arabiens, vierundzwanzig Meilen von Bostra. Manche lesen ihren Namen in der ägyptischen Städteliste Thutmosis’ III., doch ist das unsicher. Gottlieb Schumacher, der den Hauran in den 1880er Jahren vermaß, beschrieb unter Deraa eine unterirdische Stadt aus in den Fels gehauenen Straßen und Kammern, von unbekanntem Alter; römische und byzantinische Reste liegen zwischen den modernen Häusern, und der Hügel ist nie so ausgegraben worden, dass er die bronzezeitliche Stadt des Og zeigen würde."
    - "Daraa wurde Anfang des 20. Jahrhunderts ein Knotenpunkt der Hedschasbahn und ist heute Hauptstadt eines syrischen Gouvernements, mit etwa 100 000 Einwohnern vor 2011, als dort die Proteste ausbrachen, mit denen der syrische Krieg begann."
  fr:
    - "Édréi était l’une des deux villes royales d’Og, roi de Basan, avec Aschtaroth ; c’est Daraa, dans le sud de la Syrie, près de la frontière jordanienne, là où les affluents supérieurs du Yarmouk traversent la plaine de basalte du Havran. Quand les Israélites « changèrent ensuite de direction, et montèrent par le chemin de Basan », « Og, roi de Basan, sortit à leur rencontre, avec tout son peuple, pour les combattre à Édréï », et il fut détruit avec ses fils et son peuple, lui qui était « resté seul de la race des Rephaïm » et dont le lit de fer était gardé à Rabba. Moïse raconta de nouveau la bataille dans le Deutéronome, et Josué donna Aschtaroth et Édréi, « villes du royaume d’Og en Basan », à la demi-tribu de Manassé."
    - "Hors de la Bible, la ville apparaît clairement pour la première fois à l’époque romaine sous le nom d’Adraa, cité de la province d’Arabie qui frappait ses propres monnaies et avait un évêque dès le IVe siècle ; Eusèbe l’appelle une ville célèbre d’Arabie, à vingt-quatre milles de Bostra. Certains lisent son nom dans la liste égyptienne de villes de Thoutmosis III, mais c’est incertain. Gottlieb Schumacher, qui explora le Havran dans les années 1880, décrivit sous Deraa une ville souterraine de rues et de chambres taillées dans le roc, de date inconnue ; des vestiges romains et byzantins gisent parmi les maisons modernes, et le tertre n’a jamais été fouillé de façon à révéler la ville de l’âge du Bronze d’Og."
    - "Daraa devint un nœud du chemin de fer du Hedjaz au début du XXe siècle et est aujourd’hui le chef-lieu d’un gouvernorat syrien, avec environ 100 000 habitants avant 2011, quand les manifestations qui déclenchèrent la guerre de Syrie y éclatèrent."
  it:
    - "Edrei era una delle due città regali di Og, re di Basan, insieme ad Astarot; è Daraa, nella Siria meridionale, presso il confine giordano, dove gli affluenti superiori dello Yarmuk attraversano la pianura basaltica dell’Auran. Quando gli Israeliti si volsero e «risalirono il paese in direzione di Bashan», «Og, re di Bashan, uscì contro loro con tutta la sua gente per dar loro battaglia a Edrei», e fu distrutto con i suoi figli e il suo popolo, ultimo «rimasto solo della stirpe dei Refaim», il cui letto di ferro era conservato a Rabba. Mosè rievocò la battaglia nel Deuteronomio, e Giosuè diede Astarot ed Edrei, «città del regno di Og in Basan», alla mezza tribù di Manasse."
    - "Fuori dalla Bibbia la città compare chiaramente per la prima volta in epoca romana come Adraa, città della provincia d’Arabia che batteva moneta propria e aveva un vescovo nel IV secolo; Eusebio la chiama una città famosa d’Arabia, a ventiquattro miglia da Bostra. Alcuni leggono il suo nome nell’elenco egizio delle città di Tutmosi III, ma è incerto. Gottlieb Schumacher, che esplorò l’Auran negli anni 1880, descrisse sotto Deraa una città sotterranea di strade e camere scavate nella roccia, di data ignota; resti romani e bizantini giacciono fra le case moderne, e il tell non è mai stato scavato in modo da mostrare la città dell’età del Bronzo di Og."
    - "Daraa divenne uno snodo della ferrovia dell’Hegiaz all’inizio del XX secolo ed è ora il capoluogo di un governatorato siriano, con circa 100.000 abitanti prima del 2011, quando vi scoppiarono le proteste che diedero inizio alla guerra siriana."
  pl:
    - "Edrei było jednym z dwóch miast królewskich Oga, króla Baszanu, obok Asztarot; jest to Dara w południowej Syrii, blisko granicy jordańskiej, gdzie górne dopływy Jarmuku biegną przez bazaltową równinę Hauranu. Gdy Izrael „obróciwszy się szli ku Basan”, „wyciągnął Og, król Basański, przeciwko nim, sam i wszystek lud jego, aby z nimi stoczył bitwę w Edrej”, i został zniszczony wraz z synami i ludem, ostatni, który „pozostał był z olbrzymów”, którego żelazne łoże przechowywano w Rabbie. Mojżesz opowiedział tę bitwę na nowo w Księdze Powtórzonego Prawa, a Jozue dał Asztarot i Edrei, „miasta królestwa Ogowego w Basan”, połowie pokolenia Manassesa."
    - "Poza Biblią miasto widać wyraźnie dopiero w czasach rzymskich jako Adraa, miasto prowincji Arabii, które biło własne monety i miało biskupa w IV w.; Euzebiusz nazywa je sławnym miastem Arabii, odległym o dwadzieścia cztery mile od Bostry. Niektórzy odczytują jego nazwę na egipskiej liście miast Totmesa III, ale jest to niepewne. Gottlieb Schumacher, który badał Hauran w latach osiemdziesiątych XIX w., opisał pod Darą podziemne miasto ulic i komór wykutych w skale, o nieznanej dacie; rzymskie i bizantyjskie pozostałości leżą wśród współczesnych domów, a kopca nigdy nie badano wykopaliskami w sposób, który ukazałby brązowe miasto Oga."
    - "Dara stała się węzłem kolei hidżaskiej na początku XX w. i jest dziś stolicą syryjskiej muhafazy, z około 100 000 mieszkańców przed 2011 r., kiedy to wybuchły tam protesty, od których zaczęła się wojna w Syrii."
  nl:
    - "Edrei was een van de twee koningssteden van Og, koning van Basan, naast Astarot; het is Daraa in Zuid-Syrië, bij de Jordaanse grens, waar de bovenlopen van de Jarmoek door de basaltvlakte van de Hauran stromen. Toen Israël optrok: “Toen wendden zij zich en trokken op den weg van Basan; en Og, de koning van Basan, ging uit hun tegemoet, hij en al zijn volk, tot den strijd, en Edrei”, en werd met zijn zonen en volk vernietigd, de laatste “van de overigen der reuzen”, wiens ijzeren bedstede te Rabba werd bewaard. Mozes vertelde de strijd opnieuw in Deuteronomium, en Jozua gaf Astarot en Edrei, “steden des koninkrijks van Og in Bazan”, aan de halve stam Manasse."
    - "Buiten de Bijbel is de stad voor het eerst duidelijk te zien in de Romeinse tijd als Adraa, een stad van de provincie Arabië die eigen munten sloeg en in de vierde eeuw een bisschop had; Eusebius noemt haar een beroemde stad van Arabië, vierentwintig mijl van Bostra. Sommigen lezen haar naam in de Egyptische stedenlijst van Thoetmosis III, maar dat is onzeker. Gottlieb Schumacher, die in de jaren 1880 de Hauran onderzocht, beschreef onder Deraa een ondergrondse stad van straten en kamers in de rots, van onbekende datering; Romeinse en Byzantijnse resten liggen tussen de moderne huizen, en de heuvel is nooit zo opgegraven dat de Bronstijdstad van Og zichtbaar werd."
    - "Daraa werd begin twintigste eeuw een knooppunt van de Hidzjazspoorweg en is nu de hoofdstad van een Syrisch gouvernement, met ongeveer 100.000 inwoners vóór 2011, toen daar de protesten uitbraken waarmee de Syrische oorlog begon."
  cs:
    - "Edrej bylo jedno ze dvou královských měst Oga, krále Bášanu, spolu s Aštarótem; je to Daraa v jižní Sýrii, poblíž jordánské hranice, kde horní přítoky Jarmúku protékají čedičovou rovinou Havranu. O Izraeli se praví: „Obrátivše se pak, táhli cestou k Bázan. I vytáhl Og, král Bázan, proti nim, on i všecken lid jeho, aby bojoval v Edrei“; Og byl zničen se svými syny a lidem, poslední, který „z jiných obrů byl pozůstal“, jehož železné lůže se uchovávalo v Rabbě. Mojžíš tu bitvu převyprávěl v Deuteronomiu a Jozue dal Aštarót a Edrej, „města království Oga v Bázan“, polovině kmene Manasesova."
    - "Mimo Bibli je město poprvé jasně vidět v římské době jako Adraa, město provincie Arábie, které razilo vlastní mince a mělo ve 4. století biskupa; Eusebios je nazývá slavným městem Arábie, čtyřiadvacet mil od Bostry. Někteří čtou jeho jméno v egyptském seznamu měst Thutmosise III., ale to je nejisté. Gottlieb Schumacher, který zkoumal Havran v 80. letech 19. století, popsal pod Deraa podzemní město ulic a komor vytesaných do skály, neznámého stáří; římské a byzantské zbytky leží mezi moderními domy a pahorek nebyl nikdy vykopán způsobem, který by ukázal bronzové město Ogovo."
    - "Daraa se na počátku 20. století stala uzlem hidžázské železnice a je nyní hlavním městem syrského guvernorátu s asi 100 000 obyvateli před rokem 2011, kdy se tam rozhořely protesty, jimiž začala syrská válka."
  sv:
    - "Edrei var en av de två kungsstäderna hos Og, kung av Bashan, tillsammans med Ashtarot; det är Daraa i södra Syrien, nära den jordanska gränsen, där Yarmuks övre bifloder rinner genom Hauranslättens basalt. När Israel ”drogo upp åt Basan till”, hände det att ”Og, konungen i Basan, drog med allt sitt folk ut till strid mot dem, till Edrei”, och han förgjordes med sina söner och sitt folk, den siste ”som fanns kvar av de sista rafaéerna”, vars järnsäng förvarades i Rabba. Mose återberättade striden i Femte Mosebok, och Josua gav ”Astarot och Edrei, Ogs huvudstäder i Basan” åt Manasses halva stam."
    - "Utanför Bibeln syns staden först tydligt under romersk tid som Adraa, en stad i provinsen Arabien som slog egna mynt och hade en biskop på 300-talet; Eusebios kallar den en berömd stad i Arabien, tjugofyra romerska mil från Bostra. Några läser dess namn i Thutmosis III:s egyptiska stadsförteckning, men det är osäkert. Gottlieb Schumacher, som inventerade Hauran på 1880-talet, beskrev under Deraa en underjordisk stad av gator och rum uthuggna i berget, av okänd datering; romerska och bysantinska lämningar ligger bland de moderna husen, och kullen har aldrig grävts ut på ett sätt som skulle visa Ogs bronsålderstad."
    - "Daraa blev en knutpunkt på Hejazbanan i början av 1900-talet och är nu huvudstad i ett syriskt guvernement, med omkring 100 000 invånare före 2011, då protesterna som inledde Syrienkriget bröt ut där."
  nb:
    - "Edrei var en av de to kongebyene til Og, kongen i Basan, sammen med Asjtarot; det er Daraa i Sør-Syria, nær den jordanske grensen, der de øvre tilløpene til Yarmuk renner gjennom basaltsletten i Havran. Da Israel vendte seg «til en annen kant og drog opover til Basan», «Og, kongen i Basan, drog ut mot dem til Edre'i med alt sitt folk for å stride mot dem», og ble tilintetgjort med sine sønner og sitt folk, den siste «som var tilbake av refa'ittene», hvis jernseng ble oppbevart i Rabba. Moses fortalte slaget på nytt i 5. Mosebok, og Josva gav Asjtarot og Edrei, «byer i det rike som hadde tilhørt Og i Basan», til Manasses halve stamme."
    - "Utenfor Bibelen ses byen første gang tydelig i romertiden som Adraa, en by i provinsen Arabia som preget egne mynter og hadde en biskop på 300-tallet; Eusebius kaller den en berømt by i Arabia, tjuefire romerske mil fra Bostra. Noen leser dens navn i den egyptiske bylisten til Tutmosis III, men det er usikkert. Gottlieb Schumacher, som kartla Havran på 1880-tallet, beskrev under Deraa en underjordisk by av gater og kamre hugget i fjellet, av ukjent alder; romerske og bysantinske rester ligger blant de moderne husene, og haugen er aldri gravd ut på en måte som ville vise Ogs bronsealderby."
    - "Daraa ble et knutepunkt på Hijaz-banen tidlig på 1900-tallet og er nå hovedstad i et syrisk guvernement, med omtrent 100 000 mennesker før 2011, da protestene som startet den syriske krigen, brøt ut der."
  tl:
    - "Ang Edrei ay isa sa dalawang maharlikang lungsod ni Og, hari ng Basan, kasama ng Astarot; ito ang Daraa sa katimugang Siria, malapit sa hangganan ng Jordan, kung saan dumaraan ang mga itaas na sanga ng Yarmuk sa kapatagang basalto ng Hauran. Nang ang Israel ay “lumiko at umahon sa daan ng Basan”, “si Og na hari sa Basan ay lumabas laban sa kanila, siya at ang buong bayan niya, upang makipagbaka sa Edrei”, at nilipol kasama ng kaniyang mga anak at bayan, ang huli sa “nalalabi sa natira sa mga Rephaim”, na ang higaang bakal ay iningatan sa Rabba. Muling isinalaysay ni Moises ang labanan sa Deuteronomio, at ibinigay ni Josue ang Astarot at Edrei, “mga bayan ng kaharian ni Og sa Basan”, sa kalahating lipi ni Manases."
    - "Sa labas ng Bibliya, unang malinaw na nakikita ang bayan noong panahong Romano bilang Adraa, lungsod ng lalawigan ng Arabia na nagbarya ng sarili at may obispo noong ika-4 na siglo; tinatawag ito ni Eusebio na bantog na lungsod ng Arabia, dalawampu't apat na milya mula sa Bostra. Binabasa ng ilan ang pangalan nito sa talaan ng bayang Egipcio ni Thutmose III, ngunit hindi tiyak iyon. Si Gottlieb Schumacher, na nagsurbey sa Hauran noong dekada 1880, ay naglarawan sa ilalim ng Deraa ng isang lungsod sa ilalim ng lupa ng mga kalye at silid na tinabas sa bato, hindi alam ang petsa; ang mga labing Romano at Bizantino ay nasa gitna ng mga makabagong bahay, at hindi kailanman nahukay ang tel sa paraang magpapakita ng lungsod ng Panahon ng Tanso ni Og."
    - "Naging sangandaan ng riles ng Hejaz ang Daraa sa simula ng ika-20 siglo at ngayon ay kabisera ng gobernadurya ng Siria, na may mga 100,000 katao bago ang 2011, nang sumiklab doon ang mga protestang nagsimula ng digmaang Siryo."
  da:
    - "Edre'i var en af kong Ogs af Basan to kongebyer, sammen med Asjtarot; det er Daraa i det sydlige Syrien, nær den jordanske grænse, hvor Yarmuks øvre bifloder løber gennem Haurans basaltslette. Da Israels folk »vendte sig og droge op ad Vejen til Basan«, »drog Og, Kongen af Basan, ud imod dem, han og alt hans Folk til Strid, til Edrei«, og blev tilintetgjort sammen med sine sønner og sit folk, den sidste »af de overblevne Kæmper«, hvis jernseng blev opbevaret i Rabba. Moses genfortalte slaget i 5 Mosebog, og Josva gav Asjtarot og Edre'i, »Ogs Riges Stæder i Basan«, til Manasses halvstamme."
    - "Uden for Bibelen ses byen første gang tydeligt i romersk tid som Adraa, en by i provinsen Arabien, der prægede sine egne mønter og havde en biskop i 300-tallet; Eusebios kalder den en berømt by i Arabien, fireogtyve romerske mil fra Bostra. Nogle læser dens navn i Thutmosis 3.s egyptiske byliste, men det er usikkert. Gottlieb Schumacher, der undersøgte Hauran i 1880'erne, beskrev under Deraa en underjordisk by af gader og kamre hugget i klippen, af ukendt dato; romerske og byzantinske rester ligger blandt de moderne huse, og højen er aldrig blevet udgravet på en måde, der kunne vise Ogs bronzealderby."
    - "Daraa blev et knudepunkt på Hejaz-banen tidligt i 1900-tallet og er nu hovedstad i et syrisk guvernement, med cirka 100.000 indbyggere før 2011, da protesterne, der indledte den syriske krig, brød ud dér."
  sr:
    - "Едрајин је био један од два краљевска града Ога, цара васанског, с Астаротом; то је Дараа у јужној Сирији, близу јорданске границе, где горње притоке Јармука теку кроз базалтну равницу Аврана. Када се Израиљ окренуо ка Васану, „изиђе Ог, цар васански пред њих, он и сав народ његов на бој у Едрајин“, и био је уништен са својим синовима и народом, последњи који је „остао од дивова“, чији се гвоздени одар чувао у Рави. Мојсије је препричао битку у Поновљеном закону, а Исус Навин је дао Астарот и Едрајин, „градови царства Оговог у Васану“, полуплемену Манасијином."
    - "Изван Библије град се први пут јасно види у римско доба као Адраа, град провинције Арабије који је ковао свој новац и до 4. века имао епископа; Јевсевије га назива знаменитим градом Арабије, двадесет четири миље од Бостре. Неки читају његово име у египатском списку градова Тутмеса III, али то је неизвесно. Готлиб Шумахер, који је истраживао Авран 1880-их, описао је под Дераом подземни град улица и просторија уклесаних у стену, непознатог датума; римски и византијски остаци леже међу савременим кућама, а хумка никада није ископана на начин који би показао бронзанодопски град Огов."
    - "Дараа је почетком 20. века постала чвориште Хиџаске железнице, а сада је главни град сиријског гувернората, са око 100.000 становника пре 2011, када су тамо избили протести који су започели сиријски рат."
  hu:
    - "Edrei Óg, Básán királya két királyi városának egyike volt Astaróttal együtt; ez a dél-szíriai Dará, a jordániai határ közelében, ahol a Jarmúk felső mellékfolyói a Hauran bazaltsíkságán haladnak. Amikor Izráel „megfordulának, és felmenének a Básánba vivő úton”, „kijöve Og, Básán királya ő ellenök, ő és egész népe, hogy megütközzenek Hedreiben”, és fiaival és népével együtt elpusztult, az utolsó „az óriások maradéka közül”, akinek vaságyát Rabbában őrizték. Mózes ötödik könyve újra elmondja a csatát, Józsué pedig Astarótot és Edreit, „Óg országának városait Básánban”, Manassé fél törzsének adta."
    - "A Bibliától függetlenül a város először a római korban látszik tisztán, Adraa néven, Arábia tartomány városaként, amely saját érméket vert, és a 4. századra püspöke volt; Eusebius Arábia híres városának nevezi, Bosztrától huszonnégy mérföldre. Egyesek III. Thotmesz egyiptomi városjegyzékében olvassák a nevét, de ez bizonytalan. Gottlieb Schumacher, aki az 1880-as években felmérte a Haurant, Dará alatt sziklába vájt, utcákból és kamrákból álló földalatti várost írt le, ismeretlen korból; római és bizánci maradványok vannak a modern házak között, a halmot pedig soha nem ásták úgy, hogy az Óg bronzkori városát megmutatná."
    - "Dará a 20. század elején a Hidzsáz-vasút csomópontja lett, és ma szíriai kormányzóság székhelye, 2011 előtt mintegy 100 000 lakossal, amikor itt törtek ki a szíriai háborút elindító tüntetések."
  fi:
    - "Edrei oli toinen Oogin, Baasanin kuninkaan, kahdesta kuninkaankaupungista Astarotin ohella; se on Daraa Etelä-Syyriassa, lähellä Jordanian rajaa, missä Jarmukin ylemmät sivujoet kulkevat Hauranin basalttitasangon läpi. Kun israelilaiset ”kääntyivät toisaalle ja kulkivat Baasanin tietä”, ”lähti Oog, Baasanin kuningas, heitä vastaan, hän ja kaikki hänen väkensä, Edreihin taistelemaan”, ja hänet tuhottiin poikineen ja kansoineen, viimeisenä niistä, joita sanotaan ”yksin enää jäljellä viimeisistä refalaisista”; hänen rautasänkyään säilytettiin Rabbassa. Mooses kertoi taistelun uudelleen 5. Mooseksen kirjassa, ja Joosua antoi Manassen puolikkaalle heimolle ”Astarot ja Edrei, Oogin valtakunnan pääkaupungit Baasanissa”."
    - "Raamatun ulkopuolella kaupunki nähdään selvästi ensi kerran roomalaisaikana nimellä Adraa, Arabian provinssin kaupunkina, joka löi omia kolikoitaan ja jolla oli piispa 300-luvulle mennessä; Eusebios kutsuu sitä Arabian kuuluisaksi kaupungiksi, kahdenkymmenenneljän mailin päässä Bostrasta. Jotkut lukevat sen nimen Tutmosis III:n egyptiläisessä kaupunkiluettelossa, mutta se on epävarmaa. Gottlieb Schumacher, joka kartoitti Hauranin 1880-luvulla, kuvasi Deraan alla maanalaisen kaupungin, jonka kadut ja huoneet oli hakattu kallioon, tuntemattomalta ajalta; roomalaisia ja bysanttilaisia jäännöksiä on nykyisten talojen joukossa, eikä kumparetta ole kaivettu tavalla, joka osoittaisi Oogin pronssikautisen kaupungin."
    - "Daraasta tuli Hejazin rautatien risteys 1900-luvun alussa, ja se on nyt Syyrian kuvernementin pääkaupunki, jossa oli noin 100 000 asukasta ennen vuotta 2011, jolloin Syyrian sodan käynnistäneet mielenosoitukset puhkesivat siellä."
  vi:
    - "Ết-rê-i là một trong hai thành vua của Óc, vua Ba-san, cùng với Ách-ta-rốt; đó là Daraa ở nam Sy-ri, gần biên giới Jordan, nơi các nhánh thượng nguồn của sông Yarmuk chảy qua đồng bằng bazan Ha-vơ-ran. Khi Y-sơ-ra-ên “trở lại đi lên về hướng Ba-san”, “Óc, vua Ba-san, và cả dân sự người đi ra đón đặng chiến trận tại Ết-rê-i”, và bị tiêu diệt cùng các con trai và dân mình, ông là “một người còn sót của dân Rê-pha-im”, chiếc giường sắt của ông được giữ ở Ráp-ba. Môi-se kể lại trận đánh trong sách Phục truyền Luật lệ Ký, và Giô-suê ban Ách-ta-rốt và Ết-rê-i, “hai thành về nước Óc tại Ba-san”, cho nửa chi phái Ma-na-se."
    - "Ngoài Kinh Thánh, thành lần đầu được thấy rõ vào thời La Mã với tên Adraa, một thành của tỉnh A-ra-bi đúc tiền riêng và có giám mục vào thế kỷ 4; Eusebius gọi nó là một thành nổi tiếng của A-ra-bi, cách Bostra hai mươi bốn dặm. Một số người đọc tên nó trong bảng thành Ai Cập của Thutmose III, nhưng điều đó không chắc chắn. Gottlieb Schumacher, người khảo sát Ha-vơ-ran vào những năm 1880, mô tả dưới Deraa một thành ngầm gồm đường phố và phòng đục trong đá, không rõ niên đại; di tích La Mã và Byzantine nằm giữa các ngôi nhà hiện đại, và gò chưa bao giờ được khai quật theo cách có thể cho thấy thành thời đồ đồng của Óc."
    - "Daraa trở thành một nút của đường sắt Hejaz đầu thế kỷ 20 và nay là thủ phủ của một tỉnh Sy-ri, với khoảng 100.000 dân trước năm 2011, khi các cuộc biểu tình mở đầu cuộc chiến Sy-ri nổ ra ở đó."
  ro:
    - "Edrei era una dintre cele două cetăți regale ale lui Og, regele Basanului, alături de Astarot; este Daraa din sudul Siriei, aproape de granița cu Iordania, unde afluenții de sus ai Yarmukului străbat câmpia de bazalt a Hauranului. Când Israel „întorcându-se s’a suit pre calea cea către Vasan”, „a ieșit Og împăratul Vasanului înaintea lor, și tot poporul lui la războiu în Edrain”, și a fost nimicit cu fiii și cu poporul lui, ultimul care „a rămas dela Rafain”, al cărui pat de fier era păstrat la Raba. Moise a povestit din nou lupta în Deuteronom, iar Iosua a dat Astarot și Edrei, „cetățile împărăției lui Og în Vasan”, jumătății de trib a lui Manase."
    - "În afara Bibliei, cetatea este văzută limpede întâi în vremea romană ca Adraa, un oraș al provinciei Arabia care bătea monede proprii și avea episcop în secolul al IV-lea; Eusebiu o numește un oraș vestit al Arabiei, la douăzeci și patru de mile de Bostra. Unii citesc numele ei în lista de cetăți egiptene a lui Tutmes al III-lea, dar este nesigur. Gottlieb Schumacher, care a cercetat Hauranul în anii 1880, a descris sub Deraa un oraș subteran de străzi și încăperi tăiate în stâncă, de dată necunoscută; rămășițe romane și bizantine se află printre casele moderne, iar movila nu a fost niciodată săpată într-un fel care să arate cetatea din epoca bronzului a lui Og."
    - "Daraa a devenit o răscruce a căii ferate Hejaz la începutul secolului al XX-lea și este acum capitala unui guvernorat sirian, cu circa 100 000 de locuitori înainte de 2011, când au izbucnit acolo protestele care au început războiul din Siria."
  bg:
    - "Едреи бил един от двата царски града на Ог, цар на Васан, заедно с Астарот; това е Дараа в Южна Сирия, близо до йорданската граница, където горните притоци на Ярмук текат през базалтовата равнина на Хауран. Когато Израил „възлязоха по пътя към Васан“, „Ог Васанският цар излезе насреща им, той и всичките му люде, на бран в Едраи“, и бил унищожен заедно със синовете и народа си — последният „от остатъка на исполините“, чийто железен одър се пазел в Рава. Мойсей преразказал битката във Второзаконие, а Иисус Навин дал Астарот и Едреи, „градове на Оговото царство във Васан“, на половината от племето на Манасия."
    - "Извън Библията градът ясно се вижда за първи път в римско време като Адраа, град в провинция Арабия, който сечал собствени монети и имал епископ към IV в.; Евсевий го нарича прочут град на Арабия, на двадесет и четири мили от Бостра. Някои четат името му в египетския списък на градове на Тутмос III, но това е несигурно. Готлиб Шумахер, който проучвал Хауран през 80-те години на XIX в., описал под Дераа подземен град от улици и помещения, изсечени в скалата, с неизвестна дата; римски и византийски останки лежат сред съвременните къщи, а могилата никога не е разкопавана така, че да покаже града на Ог от бронзовата епоха."
    - "Дараа станала възлова гара на Хиджазката железница в началото на XX в. и днес е столица на сирийска губерния, с около 100 000 души преди 2011 г., когато там избухнаха протестите, с които започна войната в Сирия."
