body:
  en:
    - "Mount Esau is the name the prophet Obadiah gives to the mountains of Edom, the range east of the Arabah that the rest of the Bible calls Mount Seir, where “Esau is Edom” had settled. The name appears only in his short book, four times. Edom is the people “that dwellest in the clefts of the rock, whose habitation is high”, proud of its wise men and of the warriors of Teman; the LORD will “destroy the wise men out of Edom, and understanding out of the mount of Esau”, and every man of the mountain will be cut off. The charge against Edom is that in the day Jerusalem fell it stood aside, looked on, and joined the plunder: “cast lots upon Jerusalem, even thou wast as one of them”. Most scholars date the book after the fall of Jerusalem in 586 BC, though the date is debated."
    - "The book ends with reversal. The men of Judah's Negeb, they “of the south”, “shall possess the mount of Esau”, and “saviours shall come up on mount Zion to judge the mount of Esau; and the kingdom shall be the LORD’s”. History moved in that direction: in the sixth and fifth centuries the Edomite kingdom with its capital Bozrah collapsed, Edomites drifted west into the south of Judah, which became Idumaea, and the Nabataeans took the mountain and made Petra in its heart."
    - "Today Mount Esau is the highland of southern Jordan around Tafilah, Shobak and Petra, which the Mount Seir article describes."
  ru:
    - "Гора Исава — имя, которое пророк Авдий даёт горам Едома, хребту к востоку от Аравы, который остальная Библия зовёт горой Сеир, где поселился «Исав, он же Едом». Имя встречается только в его короткой книге, четыре раза. Едом — народ, что живёт «в расселинах скал, на возвышенном месте», гордый своими мудрецами и воинами Фемана; Господь истребит «мудрых в Едоме и благоразумных на горе Исава», и все на горе будут истреблены. Обвинение Едому в том, что в день падения Иерусалима он стоял в стороне, смотрел и присоединился к грабежу: «бросали жребий о Иерусалиме, ты был как один из них». Большинство учёных датирует книгу временем после падения Иерусалима в 586 г. до н. э., хотя дата спорна."
    - "Книга кончается переменой судьбы. Жители юга Иуды, «которые к югу», завладеют «горою Исава», и «придут спасители на гору Сион, чтобы судить гору Исава, и будет царство Господа». История пошла в эту сторону: в VI–V веках Едомское царство со столицей Восорой рухнуло, Едомляне перетекли на запад, на юг Иудеи, ставший Идумеей, а гору заняли Набатеи и построили в её сердце Петру."
    - "Сегодня гора Исава — нагорье южной Иордании вокруг Эт-Тафилы, Шобака и Петры, о котором рассказывает статья о горе Сеир."
  uk:
    - "Гора Ісава — ім’я, яким пророк Овадія називає гори Едому, хребет на схід від Арави, який решта Біблії зве горою Сеїр, де оселився «Езав, він же Едом». Ім’я з’являється лише в його короткій книзі, чотири рази. Едом — народ, про який сказано: «ти бо живеш у провалах між скелями на високих місцях», гордий своїми мудрими й воїнами Темана; Господь «я вигублю мудрих у Едомі, і розумних із гір Езавових», і кожен чоловік гори буде вигублений. Звинувачення проти Едому в тому, що в день падіння Єрусалима він стояв осторонь, дивився й долучився до грабунку: «про Ерусалим метали жереб, був і ти одним ізміж них». Більшість учених датує книгу після падіння Єрусалима 586 р. до н. е., хоча дату оспорюють."
    - "Книга закінчується оберненням. Мужі Негеву Юди, ті «з півдня», «Полудняне одержять гору Езавову», і «прийдуть вибавителї на Сион-гору, щоб осудити гору Езавову, — і настане царство Господнє». Історія рухалася в цьому напрямку: у VI–V ст. едомське царство зі столицею Боцрою розпалося, едомити перемістилися на захід на південь Юди, що стала Ідумеєю, а набатеї взяли гору й зробили Петру в її серці."
    - "Сьогодні Гора Ісава — нагір’я південної Йорданії навколо Тафіли, Шобака й Петри, яке описує стаття про гору Сеїр."
  es:
    - "Monte de Esaú es el nombre que el profeta Abdías da a las montañas de Edom, la cordillera al este del Arabá que el resto de la Biblia llama monte Seir, donde se había establecido «Esaú es Edom». El nombre aparece solo en su breve libro, cuatro veces. Edom es el pueblo «que moras en las hendiduras de las peñas, en tu altísima morada», orgulloso de sus sabios y de los guerreros de Temán; Jehová hará perecer «los sabios de Edom, y la prudencia del monte de Esaú», y todo hombre de la montaña será talado. El cargo contra Edom es que el día en que cayó Jerusalén se quedó a un lado, miró y se unió al saqueo: «echaban suertes sobre Jerusalem, tú también eras como uno de ellos». La mayoría de los estudiosos fechan el libro después de la caída de Jerusalén en 586 a. C., aunque la fecha se discute."
    - "El libro termina con una inversión. Los hombres del Néguev de Judá, «los del mediodía», «poseerán el monte de Esaú», y «vendrán salvadores al monte de Sión para juzgar al monte de Esaú; y el reino será de Jehová». La historia se movió en esa dirección: en los siglos VI y V el reino edomita, con su capital Bosra, se derrumbó, los edomitas se desplazaron hacia el oeste, al sur de Judá, que se convirtió en Idumea, y los nabateos tomaron la montaña e hicieron de Petra su corazón."
    - "Hoy el monte de Esaú es la región alta del sur de Jordania en torno a Tafilah, Shobak y Petra, que describe el artículo del monte Seir."
  pt:
    - "O monte de Esaú é o nome que o profeta Obadias dá às montanhas de Edom, a cordilheira a leste da Arabá que o resto da Bíblia chama monte Seir, onde “Esaú é Edom” se estabelecera. O nome aparece apenas em seu breve livro, quatro vezes. Edom é o povo “que habita nas fendas da rocha, cuja habitação é alta”, orgulhoso de seus sábios e dos guerreiros de Temã; o SENHOR vai “destruir os sábios de Edom, e o entendimento do monte de Esaú”, e todo homem da montanha será exterminado. A acusação contra Edom é que, no dia em que Jerusalém caiu, ficou de lado, observou e participou do saque: “lançaram sortes sobre Jerusalém, você mesmo era como um deles”. A maioria dos estudiosos data o livro depois da queda de Jerusalém em 586 a.C., embora a data seja debatida."
    - "O livro termina com a reviravolta. Os homens do Neguebe de Judá, “Os do Sul”, “possuirão o monte de Esaú”, e “Salvadores subirão ao monte Sião para julgar os montes de Esaú, e o reino será do SENHOR”. A história caminhou nessa direção: nos séculos VI e V o reino edomita, com sua capital Bosra, ruiu, os edomitas foram migrando para o oeste, para o sul de Judá, que se tornou a Iduméia, e os nabateus tomaram a montanha e fizeram Petra em seu coração."
    - "Hoje o monte de Esaú é a região alta do sul da Jordânia em torno de Tafilah, Shobak e Petra, que o verbete do monte Seir descreve."
  de:
    - "Das Gebirge Esau ist der Name, den der Prophet Obadja den Bergen Edoms gibt, dem Höhenzug östlich der Araba, den die übrige Bibel Gebirge Seir nennt, wo sich Esau niedergelassen hatte: „Und Esau ist der Edom.“ Der Name erscheint nur in seinem kurzen Buch, viermal. Edom ist das Volk, zu dem es heißt: „weil du in der Felsen Klüften wohnst, in deinen hohen Schlössern“, stolz auf seine Weisen und die Krieger von Teman; der HERR wird „die Weisen zu Edom zunichte machen und die Klugheit auf dem Gebirge Esau“, und jeder Mann des Gebirges wird ausgerottet. Der Vorwurf gegen Edom lautet, dass es am Tag von Jerusalems Fall beiseitestand, zusah und an der Plünderung teilnahm: „über Jerusalem das Los warfen, da warst du gleich wie deren einer“. Die meisten Gelehrten datieren das Buch nach dem Fall Jerusalems 586 v. Chr., doch das Datum ist umstritten."
    - "Das Buch endet mit der Umkehrung. Die Männer aus Judas Negev, „die gegen Mittag“, werden, wie es heißt, „das Gebirge Esau“ besitzen, und „es werden Heilande heraufkommen auf den Berg Zion, das Gebirge Esau zu richten; und das Königreich wird des HERRN sein“. Die Geschichte bewegte sich in diese Richtung: Im 6. und 5. Jahrhundert brach das edomitische Königreich mit seiner Hauptstadt Bozra zusammen, Edomiter wanderten nach Westen in den Süden Judas, der Idumäa wurde, und die Nabatäer nahmen das Gebirge und machten Petra in seinem Herzen."
    - "Heute ist das Gebirge Esau das Hochland Südjordaniens um Tafila, Schobak und Petra, das der Artikel über das Gebirge Seir beschreibt."
  fr:
    - "Le mont d’Ésaü est le nom que le prophète Abdias donne aux montagnes d’Édom, la chaîne à l’est de l’Araba que le reste de la Bible appelle mont Séir, où s’était établi « Ésaü, c’est Édom ». Le nom n’apparaît que dans son court livre, quatre fois. Édom est le peuple qui habite « le creux des rochers » et s’assied « sur les hauteurs », fier de ses sages et des guerriers de Théman ; l’Éternel dit qu’il fera disparaître « d’Édom les sages, et de la montagne d’Ésaü l’intelligence », et tout homme de la montagne sera retranché. Le grief contre Édom est que, le jour de la chute de Jérusalem, il se tint à l’écart, regarda et se joignit au pillage : des étrangers « jetaient le sort sur Jérusalem, toi aussi tu étais comme l’un d’eux ». La plupart des savants datent le livre d’après la chute de Jérusalem en 586 av. J.-C., bien que la date soit débattue."
    - "Le livre s’achève par un renversement. Les hommes du Négev de Juda, ceux « du midi », « posséderont la montagne d’Ésaü », et « des libérateurs monteront sur la montagne de Sion, pour juger la montagne d’Ésaü ; et à l’Éternel appartiendra le règne ». L’histoire alla dans ce sens : aux VIe et Ve siècles, le royaume édomite et sa capitale Botsra s’effondrèrent, des Édomites dérivèrent vers l’ouest dans le sud de Juda, qui devint l’Idumée, et les Nabatéens prirent la montagne et firent de Pétra son cœur."
    - "Aujourd’hui, le mont d’Ésaü est le haut pays du sud de la Jordanie autour de Tafilah, de Shobak et de Pétra, que décrit l’article sur le mont Séir."
  it:
    - "Monte di Esaù è il nome che il profeta Abdia dà ai monti di Edom, la catena a est dell’Araba che il resto della Bibbia chiama Monte Seir, dove «Esaù è Edom» si era stabilito. Il nome compare solo nel suo breve libro, quattro volte. Edom è il popolo «che abiti fra le spaccature delle rocce, che son l’alta tua dimora», fiero dei suoi savi e dei guerrieri di Teman; l’Eterno dice: «io farò sparire da Edom i savi e dal monte d’Esaù il discernimento», e ogni uomo del monte sarà sterminato. L’accusa contro Edom è che nel giorno della caduta di Gerusalemme stette in disparte, guardò e si unì al saccheggio: «gettavan le sorti su Gerusalemme, anche tu eri come uno di loro». La maggior parte degli studiosi data il libro dopo la caduta di Gerusalemme nel 586 a.C., benché la data sia discussa."
    - "Il libro si chiude con un rovesciamento. Gli uomini del Negheb di Giuda, «Quelli del mezzogiorno», «possederanno il monte d’Esaù», e «dei liberatori saliranno sul monte Sion per giudicare il monte d’Esaù; e il regno sarà dell’Eterno». La storia andò in quella direzione: nel VI e V secolo il regno edomita con la capitale Bosra crollò, gli Edomiti migrarono a ovest nel sud di Giuda, che divenne Idumea, e i Nabatei presero il monte e fecero Petra nel suo cuore."
    - "Oggi il Monte di Esaù è l’altopiano della Giordania meridionale intorno a Tafilah, Shobak e Petra, descritto nella scheda sul Monte Seir."
  pl:
    - "Góra Ezawa to nazwa, jaką prorok Abdiasz nadaje górom Edomu, pasmu na wschód od Araby, które reszta Biblii nazywa górą Seir, gdzie osiadł Ezaw, „ten Ezaw jest Edom”. Nazwa występuje tylko w jego krótkiej księdze, cztery razy. Edom to lud, o którym mowa: „który mieszkasz w rozpadlinach skalnych, w wysokiem mieszkaniu twojem”, dumny ze swych mędrców i wojowników Temanu; Pan zapowiada retorycznym pytaniem: „Izali dnia onego, mówi Pan, nie wytracę mędrców z Edom, a roztropnych z góry Ezawa?”, i każdy mąż góry zostanie wycięty. Zarzut wobec Edomu brzmi, że w dniu upadku Jerozolimy stał z boku, patrzył i przyłączył się do grabieży: „a o Jeruzalem los miotali, tyś też był jako jeden z nich”. Większość uczonych datuje księgę po upadku Jerozolimy w 586 r. p.n.e., choć data jest dyskutowana."
    - "Księga kończy się odwróceniem. Mężowie z Negewu Judy, ci z południa, „odziedziczą krainę południową z górą Ezawa”, a „wstąpią wybawiciele na górę Syon, aby sądzili górę Ezawa; a tak będzie królestwo samego Pana”. Dzieje poszły w tym kierunku: w VI i V w. królestwo Edomu ze stolicą Bosrą upadło, Edomici dryfowali na zachód do południowej Judy, która stała się Idumeą, a Nabatejczycy zajęli górę i uczynili Petrę w jej sercu."
    - "Dziś Góra Ezawa to wyżyna południowej Jordanii wokół Tafili, Szobaku i Petry, którą opisuje artykuł o górze Seir."
  nl:
    - "Het Gebergte van Ezau is de naam die de profeet Obadja geeft aan de bergen van Edom, de bergketen ten oosten van de Araba die de rest van de Bijbel de berg Seïr noemt, waar “Ezau is Edom” zich had gevestigd. De naam komt alleen in zijn korte boek voor, vier keer. Edom is het volk “die daar woont in de kloven der steenrotsen, in zijn hoge woning”, trots op zijn wijzen en op de krijgers van Teman; de HEER zal “de wijzen uit Edom, en het verstand uit Ezau's gebergte” doen vergaan, en elke man van de berg wordt uitgeroeid. De beschuldiging tegen Edom is dat het op de dag dat Jeruzalem viel terzijde stond, toekeek en meedeed aan de plundering: “over Jeruzalem het lot wierpen, waart gij ook als een van hen”. De meeste geleerden dateren het boek na de val van Jeruzalem in 586 v.Chr., al wordt de datering betwist."
    - "Het boek eindigt met een omkering. De mannen van Juda's Negev, “die van het zuiden”, zullen “Ezau's gebergte … erfelijk bezitten”, en “er zullen heilanden op den berg Sions opkomen, om Ezau's gebergte te richten; en het koninkrijk zal des HEEREN zijn”. De geschiedenis ging die kant op: in de zesde en vijfde eeuw stortte het Edomitische koninkrijk met zijn hoofdstad Bozra in, trokken Edomieten naar het westen het zuiden van Juda in, dat Idumea werd, en namen de Nabateeërs de berg en maakten Petra in zijn hart."
    - "Tegenwoordig is het Gebergte van Ezau het hoogland van zuidelijk Jordanië rond Tafilah, Shobak en Petra, dat het lemma over Seïr beschrijft."
  cs:
    - "Hora Ezau je jméno, které prorok Obadjáš dává horám Edómu, pásmu východně od Araby, které zbytek Bible nazývá horou Seír, kde se usadil Ezau: „Ezau pak ten jest Edom“. Jméno se objevuje jen v jeho krátké knize, čtyřikrát. Edóm je lid, „kterýž bydlíš v rozsedlinách skalních, v převysokém obydlí svém“, pyšný na své mudrce a bojovníky z Témánu; Hospodin se ptá: „nevyhladím moudrých z země Idumejské, a rozumných s hory Ezau?“, a každý muž z hory bude vyťat. Obvinění proti Edómu je, že v den pádu Jeruzaléma stál stranou, přihlížel a přidal se k plenění: „o Jeruzalém metali losy, ty jsi také byl jako jeden z nich“. Většina badatelů datuje knihu po pádu Jeruzaléma roku 586 př. n. l., ačkoli datum je sporné."
    - "Kniha končí obratem. Muži z judského Negevu, ti z jihu, „děditi budou v krajině polední s horou Ezau“, a „vstoupí vysvoboditelé na horu Sion, aby soudili horu Ezau, a tak bude Hospodinovo království“. Dějiny se tím směrem ubíraly: v 6. a 5. století edómské království s hlavním městem Bosrou zaniklo, Edómci se přesouvali na západ do jihu Judy, který se stal Idumeí, a Nabatejci převzali horu a učinili Petru v jejím srdci."
    - "Dnes je hora Ezau vysočina jižního Jordánska kolem Tafíly, Šobaku a Petry, kterou popisuje článek o hoře Seír."
  sv:
    - "Esaus berg är det namn profeten Obadja ger Edoms berg, kedjan öster om Arava som resten av Bibeln kallar Seirs berg, där ”Esau, det är densamme som Edom” hade bosatt sig. Namnet förekommer bara i hans korta bok, fyra gånger. Edom är folket som ”sitter ibland bergsklyftorna i den höga boning”, stolt över sina visa män och Temans krigare; HERREN skall ”förgöra de vise i Edom och allt förstånd på Esaus berg”, och varje man på berget skall utrotas. Anklagelsen mot Edom är att det den dag Jerusalem föll stod vid sidan, såg på och deltog i plundringen: ”kastade lott om Jerusalem, då var ju ock du såsom en av dem”. De flesta forskare daterar boken till tiden efter Jerusalems fall 586 f.Kr., fastän dateringen är omdebatterad."
    - "Boken slutar med omvändning. Männen från Judas Negev, ”Sydlandets folk”, ”skall taga Esaus berg i besittning”, och ”frälsare skola draga upp på Sions berg till att döma Esaus berg. Och så skall riket vara HERRENS”. Historien rörde sig åt det hållet: på 500- och 400-talen kollapsade det edomitiska kungariket med huvudstaden Bosra, edomiter drev västerut in i södra Juda, som blev Idumeen, och nabateerna tog berget och gjorde Petra i dess hjärta."
    - "I dag är Esaus berg södra Jordaniens högland kring Tafilah, Shobak och Petra, som artikeln om Seirs berg beskriver."
  nb:
    - "Esaus fjell er navnet profeten Obadja gir Edoms fjell, åskjeden øst for Arava som resten av Bibelen kaller Seirfjellet, der «Esau, det er den samme som Edom» hadde bosatt seg. Navnet forekommer bare i hans korte bok, fire ganger. Edom er folket «du som bor i fjellkløfter, i din høie bolig», stolt av sine vismenn og Temans krigere; Herren vil «gjøre ende på alle vismenn i Edom og all forstand på Esaus berg», og hver mann på fjellet skal utryddes. Anklagen mot Edom er at det den dagen Jerusalem falt sto til side, så på og deltok i plyndringen: «kastet lodd om Jerusalem, da var også du som en av dem». De fleste forskere daterer boken etter Jerusalems fall i 586 f.Kr., selv om dateringen er omdiskutert."
    - "Boken ender med en omvending. Mennene fra Judas Negev, de «som bor i sydlandet», «skal ta Esaus berg i eie», og «frelsere skal dra op på Sions berg og dømme Esaus berg, og riket skal høre Herren til». Historien gikk i den retningen: på 500- og 400-tallet f.Kr. falt det edomittiske kongeriket med hovedstaden Bosra sammen, edomitter drev vestover inn i det sørlige Juda, som ble Idumea, og nabateerne tok fjellet og gjorde Petra til sitt hjerte."
    - "I dag er Esaus fjell høylandet i det sørlige Jordan omkring Tafilah, Shobak og Petra, som artikkelen om Seirfjellet beskriver."
  tl:
    - "Ang Bundok Esau ay pangalang ibinibigay ng propetang si Obadias sa mga bundok ng Edom, ang hanay sa silangan ng Araba na tinatawag ng nalalabing Biblia na Bundok Seir, kung saan tumahan “si Esau ay siyang Edom”. Lumilitaw lamang ang pangalan sa kaniyang maikling aklat, nang apat na beses. Ang Edom ay bayang “tumatahan sa mga bitak ng bato, na ang tahanan ay matayog”, mapagmalaki sa mga pantas nito at sa mga mandirigma ng Teman; “lilipulin … ang mga pantas na tao sa Edom, at papawiin ang unawa sa bundok ng Esau”, at lahat ng lalaki ng bundok ay lilipulin. Ang paratang laban sa Edom ay na nang araw na bumagsak ang Jerusalem ay tumayo ito sa tabi, nanood at sumali sa pagnanakaw: “pagsapalaran ang Jerusalem, ikaw man ay naging gaya ng isa sa kanila”. Karamihan ng iskolar ay nagpepetsa sa aklat pagkatapos ng pagbagsak ng Jerusalem noong 586 BK, bagaman pinagtatalunan ang petsa."
    - "Nagtatapos ang aklat sa pagbaligtad. Ang mga taga-Negeb ng Juda, silang “sa Timugan”, ay “mangagaari ng bundok ng Esau”, at “ang mga tagapagligtas ay magsisisampa sa bundok ng Sion upang hatulan ang bundok ng Esau; at ang kaharian ay magiging sa Panginoon”. Ganoon ang takbo ng kasaysayan: noong ika-6 at ika-5 siglo, bumagsak ang kahariang Edomita na may kabiserang Bozra, lumipat pakanluran ang mga Edomita sa timog ng Juda, na naging Idumea, at kinuha ng mga Nabateo ang bundok at itinayo ang Petra sa puso nito."
    - "Ang Bundok Esau ngayon ay ang kabundukan ng timog Jordan sa palibot ng Tafilah, Shobak at Petra, na inilalarawan ng artikulo tungkol sa Bundok Seir."
  da:
    - "Esaus Bjerg er det navn, profeten Obadja giver Edoms bjerge, kæden øst for Araba, som resten af Bibelen kalder Se'irs bjerg, hvor »Esau, det er Edom« havde bosat sig. Navnet optræder kun i hans korte bog, fire gange. Edom er folket, hvortil det siges: »du, som bor i Klippekløfter, i din høje Bolig«, stolt af sine vise og af Temans krigere; Herren vil »lade de vise forsvinde fra Edom og Forstand fra Esaus Bjerg«, og enhver mand på bjerget skal udryddes. Anklagen mod Edom er, at det på den dag, da Jerusalem faldt, stod på sidelinjen, så til og tog del i plyndringen: »kastede Lod over Jerusalem, har ogsaa du været som en af dem«. De fleste forskere dater bogen efter Jerusalems fald i 586 f.Kr., selv om dateringen er omdiskuteret."
    - "Bogen ender med omvending. Judas Negevs mænd, de »i Sydlandet«, »skulle eje Esaus Bjerg«, og »Frelsere skulle drage op paa Zions Bjerg for at dømme Esaus Bjerg; og Riget skal høre Herren til«. Historien bevægede sig i den retning: i 500- og 400-tallet brød Edoms kongerige med hovedstaden Bosra sammen, edomitter drev mod vest ind i det sydlige Juda, som blev Idumæa, og nabatæerne tog bjerget og gjorde Petra i dets hjerte."
    - "I dag er Esaus Bjerg højlandet i det sydlige Jordan omkring Tafilah, Shobak og Petra, som artiklen om Se'irs bjerg beskriver."
  sr:
    - "Гора Исавова је име које пророк Овадија даје планинама Едома, ланцу источно од Араве који остатак Библије зове Сеир, где се настанио Исав: „Исав је Едом“. Име се јавља само у његовој краткој књизи, четири пута. Едом је народ „који живиш у раселинама каменим, у високом стану свом“, поносан на своје мудраце и на ратнике Темана; Господ пита: „нећу ли погубити мудре у земљи едемској и разумне у гори Исавовој?“, и сваки човек са горе биће истребљен. Оптужба против Едома је да је у дан када је Јерусалим пао стајао по страни, гледао и придружио се плену: „бацаху жреб за Јерусалим, беше и ти као који од њих“. Већина научника датира књигу после пада Јерусалима 586. п. н. е., мада је датум спорен."
    - "Књига завршава преокретом. Људи из Негева Јудиног, они на југу, наследиће гору Исавову: „И наследиће југ, гору Исавову“, и „И избавитељи ће изаћи на гору Сион да суде гори Исавовој, и царство ће бити Господње.“ Историја се кретала у том правцу: у VI и V веку едомско краљевство с престоницом Восор се распало, Едомци су се селили на запад у југ Јуде, који је постао Идумеја, а Набатејци су узели гору и начинили Петру у њеном срцу."
    - "Данас је Гора Исавова висораван јужног Јордана око Тафиле, Шобака и Петре, коју описује чланак о гори Сеир."
  hu:
    - "Ézsau hegye az a név, amelyet Abdiás próféta Edom hegyeinek ad, az Arábától keletre húzódó hegylánc, amelyet a Biblia többi része Széir-hegynek nevez, ahol letelepedett az, aki „Ézsaú pedig az Edóm”. A név csak az ő rövid könyvében fordul elő, négyszer. Edom az a nép, „ki szikla-hasadékokban lakozol, kinek lakóhelye magasan van”, büszke bölcseire és Témán harcosaira; az Úr „nem vesztem-é ki a bölcseket Edomból, és az értelmet az Ézsau hegyéről?!”, és a hegy minden férfiát kiirtják. Edom ellen az a vád, hogy Jeruzsálem bukásának napján félreállt, nézte, és részt vett a fosztogatásban: „Jeruzsálemre sorsot vetettek: olyan voltál te is, mint bármelyik közülök”. A legtöbb tudós a könyvet Jeruzsálem Kr. e. 586-os bukása utánra keltezi, bár az időpont vitatott."
    - "A könyv a fordulattal végződik. Júda Negevének férfiai, „A déliek örökség szerint bírják az Ézsau hegyét”, és „a Sion hegyére szabadítók mennek fel, hogy megítéljék az Ézsau hegyét; és az Úré lesz a királyság”. A történelem ebbe az irányba mozdult: a Kr. e. 6–5. században a Boszra fővárosú edomi királyság összeomlott, az edomiták nyugatra, Júda déli részére szivárogtak, amely Idumea lett, a nabateusok pedig elfoglalták a hegyet, és szívében megalkották Petrát."
    - "Ma Ézsau hegye Dél-Jordánia felföldje Tafilah, Shobak és Petra körül, amelyet a Széir-hegyről szóló cikk ír le."
  fi:
    - "Esaun vuori on nimi, jonka profeetta Obadja antaa Edomin vuorille, Araban itäpuoliselle vuoristolle, jota muu Raamattu kutsuu Seirvuoreksi ja johon ”Eesau, se on Edom” oli asettunut. Nimi esiintyy vain hänen lyhyessä kirjassaan, neljästi. Edom on kansa, ”joka asut kallionrotkoissa, istut korkealla”, ylpeä viisaistaan ja Teemanin sotureista; Herra sanoo: ”minä lopetan viisaat Edomista ja taidon Eesaun vuorelta”, ja vuoren jokainen mies hävitetään. Syytös Edomia vastaan on, että Jerusalemin kaatumispäivänä se seisoi sivussa, katsoi ja liittyi ryöstöön: ”heittivät Jerusalemista arpaa, olit myöskin sinä niinkuin yksi heistä”. Useimmat tutkijat ajoittavat kirjan Jerusalemin kukistumisen, 586 eaa., jälkeen, vaikka ajoitus on kiistanalainen."
    - "Kirja päättyy käänteeseen. Juudan Negevin miehet, ne ”Etelämaan”, ”ottavat perinnöksensä Etelämaan ynnä Eesaun vuoren”, ja ”Pelastajat nousevat Siionin vuorelle tuomitsemaan Eesaun vuorta. Ja kuninkuus on oleva Herran.” Historia kulki siihen suuntaan: 500- ja 400-luvuilla Edomin kuningaskunta pääkaupunkinaan Bosra romahti, edomilaiset ajautuivat länteen Juudan eteläosaan, josta tuli Idumea, ja nabatealaiset valtasivat vuoren ja tekivät sen sydämeen Petran."
    - "Nykyään Esaun vuori on Etelä-Jordanian ylänkö Tafilahin, Shobakin ja Petran ympärillä, jonka Seirvuori-artikkeli kuvaa."
  vi:
    - "Núi Ê-sau là tên nhà tiên tri Áp-đia đặt cho các núi của Ê-đôm, dãy phía đông A-ra-ba mà phần còn lại của Kinh Thánh gọi là núi Sê-i-rơ, nơi “Ê-sau, tức là Ê-đôm” đã định cư. Tên chỉ xuất hiện trong sách ngắn của ông, bốn lần. Ê-đôm là dân “ở trong khe vầng đá, trong nơi cao”, kiêu hãnh về người khôn và chiến sĩ của Thê-man; Đức Giê-hô-va sẽ “diệt những kẻ khôn khỏi xứ Ê-đôm, và những người thông sáng khỏi núi Ê-sau”, và mọi người trên núi sẽ bị dứt. Lời buộc tội Ê-đôm là trong ngày Giê-ru-sa-lem sụp đổ nó đứng bên kia, nhìn xem, và dự phần cướp bóc: “bắt thăm trên thành Giê-ru-sa-lem, thì trong ngày ấy ngươi đứng bên kia, ngươi cũng như một người trong chúng nó”. Phần lớn học giả định niên đại sách sau sự sụp đổ Giê-ru-sa-lem năm 586 TCN, dù niên đại còn tranh luận."
    - "Sách kết thúc bằng sự đảo ngược. Người Nê-ghép của Giu-đa, “những người ở phương nam”, “sẽ được núi của Ê-sau”, và “Sẽ có các kẻ giải cứu lên trên núi Si-ôn đặng phán xét núi Ê-sau; còn nước thì sẽ thuộc về Đức Giê-hô-va”. Lịch sử đi theo hướng ấy: trong thế kỷ 6 và 5 vương quốc Ê-đôm với thủ đô Bốt-ra sụp đổ, người Ê-đôm trôi về tây vào nam Giu-đa, vùng về sau trở thành Y-đu-mê, và người Nabataea chiếm núi và lập Petra ở trung tâm."
    - "Ngày nay núi Ê-sau là cao nguyên nam Gióc-đa-ni quanh Tafilah, Shobak và Petra, được bài về núi Sê-i-rơ mô tả."
  ro:
    - "Muntele lui Esau este numele pe care proorocul Obadia îl dă munților Edomului, lanțul de la est de Araba pe care restul Bibliei îl numește Muntele Seir, unde se așezase „Isav acesta este Edom”. Numele apare numai în scurta lui carte, de patru ori. Edom este poporul căruia i se adresează: „cel ce lăcuești în găurile pietrelor, cel ce înalți lăcașul tău”, mândru de înțelepții lui și de războinicii din Teman; Domnul zice: „pierde-voiu înțelepții din Idumeia, și înțelegerea din muntele lui Isav”, și orice om al muntelui va fi nimicit. Învinuirea adusă Edomului este că în ziua căderii Ierusalimului a stat deoparte, s-a uitat și s-a alăturat jafului: „au aruncat sorți pentru Ierusalim, și tu erai ca unul dintr’înșii”. Cei mai mulți cercetători datează cartea după căderea Ierusalimului în 586 î.Hr., deși data este disputată."
    - "Cartea se încheie cu o răsturnare. Despre oamenii din Neghevul lui Iuda, cei din sud, se spune: „vor moștenì cei din Naghev muntele lui Isav”, iar „se vor suì mântuiți din muntele Sionului, ca să izbândească asupra muntelui lui Isav, și va fì a Domnului împărăția”. Istoria a mers în acea direcție: în secolele al VI-lea și al V-lea regatul edomit cu capitala Boțra s-a prăbușit, edomiții au migrat spre vest în sudul lui Iuda, care a devenit Idumeea, iar nabateenii au luat muntele și au făcut Petra în inima lui."
    - "Astăzi Muntele lui Esau este înălțimea din sudul Iordaniei din jurul Tafilei, Shobakului și Petrei, pe care o descrie articolul despre Muntele Seir."
  bg:
    - "Планината на Исав е името, което пророк Овадия дава на планините на Едом — веригата на изток от Арава, която останалата част от Библията нарича Планината Сеир, където се беше заселил Исав („Исав е Едом“). Името се появява само в краткото му писание, четири пъти. Към Едом, горд с мъдреците си и с воините на Теман, се казва: „Тебе който живееш в разселините на канарите, Тебе на когото жилището е високо“; Господ ще „погуби… мъдрите от Едом И благоразумието от гората на Исава“ и всеки мъж от планината ще бъде изтребен. Обвинението срещу Едом е, че в деня, когато падна Йерусалим, той стоеше настрана, гледаше и се присъедини към плячкосването: „хвърлиха жребие вьрх Ерусалим, Беше и ти като един от тях“. Повечето учени датират книгата след падането на Йерусалим през 586 г. пр.н.е., макар че датата е спорна."
    - "Книгата завършва с обрат. Мъжете от Негев на Юда, „южните“, „ще наследят Исавовата гора“, и „ще възлязат избавители на гората Сион За да съдят гората Исавова; И царството ще е Господне“. Историята тръгнала в тази посока: през VI и V в. едомското царство със столица Восор рухнало, едомци се преселили на запад в южната част на Юда, която станала Идумея, а набатейците завзели планината и в сърцето ѝ създали Петра."
    - "Днес Планината на Исав е планинската област на Южна Йордания около Тафила, Шобак и Петра, описана в статията за Планината Сеир."
