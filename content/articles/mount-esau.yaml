# Overview article (ADR 0007). Mainstream facts only; the date of Obadiah is given as the usual one and called debated; the fuller history of the range is in the Mount Seir article.
id: mount-esau
place: a8e843f
title:
  en: "Mount Esau"
  ru: "Гора Исава"
  uk: "Гора Ісава"
  es: "Monte de Esaú"
  pt: "Monte de Esaú"
  de: "Gebirge Esau"
  fr: "Mont d’Ésaü"
  it: "Monte di Esaù"
  pl: "Góra Ezawa"
