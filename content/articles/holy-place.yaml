# Overview article (ADR 0007). Mainstream facts only; the position of the hall on the Temple Mount is named as disputed; Josephus and 1 Maccabees are followed for the Second Temple.
id: holy-place
place: ab60a74
title:
  en: "Holy Place"
  ru: "Святилище"
  uk: "Святилище"
  es: "Lugar Santo"
  pt: "Lugar Santo"
  de: "Das Heilige"
  fr: "Lieu saint"
  pl: "Miejsce Święte"
  it: "Luogo Santo"
  nl: "Het Heilige"
  cs: "Svatyně"
  sv: "Det heliga"
  nb: "Det hellige"
  tl: "Dakong Banal"
  da: "Det Hellige"
body:
  en:
    - "The Holy Place is the main hall of the sanctuary, the room between the porch and the Holy of Holies. In the tabernacle it was the first of two chambers, divided from the inner one by the veil: “the vail shall divide unto you between the holy place and the most holy”. It held the table of the showbread on the north, the lampstand on the south and the golden altar of incense before the veil. In Solomon's Temple the same hall, the hekal, was forty cubits long, twenty wide and thirty high, panelled with cedar and overlaid with gold, with ten lampstands, “five on the right side, and five on the left, before the oracle”; the Bible usually calls the whole building “the house” and this room “the temple”."
    - "Ordinary priests served here every day, trimming the lamps and burning incense morning and evening, and set out fresh bread each sabbath; only the high priest went beyond the veil, once a year. When the ark was brought in, the ends of its staves “were seen out in the holy place before the oracle”, and as the priests came out “the cloud filled the house of the LORD”. Hezekiah had the Levites carry “the filthiness out of the holy place” after Ahaz had shut the doors and put out the lamps. Ezekiel's visionary temple keeps the plan, with chambers where the priests leave “their garments wherein they minister; for they are holy”."
    - "The Second Temple and Herod's rebuilding kept the arrangement. Josephus describes the hall with its great golden doors and Babylonian tapestry, and inside it the lampstand, the table and the altar of incense; Antiochus IV carried these off in 169 BC, Judas Maccabeus made new ones, and Pompey, who entered in 63 BC, touched nothing. Here Zacharias, whose “lot was to burn incense”, saw the angel while the people waited outside. Jesus warned of “the abomination of desolation, spoken of by Daniel the prophet, stand in the holy place”. The Epistle to the Hebrews names the first tent “the sanctuary” and the second “the Holiest of all”, and sees in the high priest's one yearly entrance a figure of Christ, who “entered in once into the holy place, having obtained eternal redemption for us”."
    - "After Titus burned the Temple in AD 70 the lampstand and the table were carried in his triumph at Rome, as the relief on the Arch of Titus shows. Where the hall stood on the Temple Mount is disputed: most place the Temple with its inner shrine at the rock under the Dome of the Rock, some further north or south, and nothing of it can be seen or dug today."
  ru:
    - "Святилище — главный зал святого дома, помещение между притвором и Святым святых. В скинии это была первая из двух частей, отделённая от внутренней завесой: «и будет завеса отделять вам святилище от Святаго-святых». Здесь стояли стол хлебов предложения с северной стороны, светильник с южной и золотой жертвенник курения перед завесой. В храме Соломона тот же зал, хекал, имел сорок локтей в длину, двадцать в ширину и тридцать в высоту, был обшит кедром и обложен золотом, и в нём стояли десять светильников — «пять по правую сторону и пять по левую сторону, пред задним отделением храма»; Библия обычно называет всё здание «домом», а эту комнату — «храмом»."
    - "Здесь ежедневно служили обычные священники: поправляли лампады, воскуряли утром и вечером, каждую субботу выкладывали свежие хлебы; за завесу входил только первосвященник, раз в год. Когда внесли ковчег, «головки шестов видны были из святилища пред давиром», а когда священники вышли, «облако наполнило дом Господень». Езекия велел левитам выбросить «нечистоту из святилища» после того, как при Ахазе двери заперли и светильники погасили. Храм видения Иезекииля сохраняет тот же план, с комнатами, где священники должны оставить одежды, «в которых служили, ибо они священны»."
    - "Второй храм и перестройка Ирода сохранили то же устройство. Иосиф Флавий описывает зал с огромными золочёными дверями и вавилонской завесой, а внутри — светильник, стол и жертвенник курения; Антиох IV унёс их в 169 г. до н. э., Иуда Маккавей сделал новые, а Помпей, вошедший сюда в 63 г. до н. э., ничего не тронул. Здесь Захарии, которому по жребию досталось «войти в храм Господень для каждения», явился Ангел, пока народ ждал снаружи. Иисус предупреждал: когда увидите «мерзость запустения, реченную через пророка Даниила, стоящую на святом месте». Послание к Евреям называет первую скинию «святое», а вторую — «святое святых», и видит в единственном годовом входе первосвященника образ Христа, Который «однажды вошел во святилище и приобрел вечное искупление»."
    - "После того как Тит сжёг храм в 70 г. н. э., светильник и стол пронесли в его триумфе в Риме, как показывает рельеф на арке Тита. Где стоял зал на Храмовой горе, спорно: большинство помещает храм с его внутренним святилищем у скалы под Куполом Скалы, некоторые — севернее или южнее, и сегодня от него нельзя ни увидеть, ни раскопать ничего."
  uk:
    - "Святилище — головна зала храму, приміщення між притвором і Святим святих. У скинії воно було першою з двох палат, відділеною від внутрішньої завісою: «І буде роздїляти завіса вам сьвятиню від пресьвятої сьвятинї». У ньому стояли стіл хлібів предложення на півночі, світильник на півдні та золотий жертовник для кадила перед завісою. У храмі Соломона та сама зала, гекал, мала сорок ліктів завдовжки, двадцять завширшки й тридцять заввишки, була обшита кедром і вкрита золотом, з десятьма світильниками, «пять праворуч, а пять лїворуч перед заднїм простором сьвятинї»; Біблія зазвичай називає всю будівлю «домом», а цю залу — «храмом»."
    - "Звичайні священики служили тут щодня, обрізуючи лампи й запалюючи кадило вранці й увечері, і виставляли свіжий хліб кожної суботи; лише первосвященник заходив за завісу, раз на рік. Коли ковчег внесли, кінці його держаків «можна було бачити з сьвятинї», а коли священики виходили, «сповнила хмара храмину Господню». Єзекія звелів левітам «викиньте нечисть із сьвятинї» після того, як Ахаз замкнув двері й погасив лампи. Храм у видінні Єзекіїля зберігає цей план, з палатами, де священики залишають «одїжі своєї, що в нїй служили; вона бо сьвята»."
    - "Другий храм і відбудова Ірода зберегли цей розподіл. Йосиф Флавій описує залу з її великими золотими дверима й вавилонською завісою, а всередині неї — світильник, стіл і жертовник для кадила; Антіох IV забрав їх 169 р. до н. е., Юда Макавей зробив нові, а Помпей, який ввійшов 63 р. до н. е., не торкнувся нічого. Тут Захарія, про якого сказано: «довелось йому кадити», побачив ангела, поки народ чекав надворі. Ісус застерігав: «гидоту спустїння, що сказав Даниїл пророк, стоячу на місцї сьвятому». Послання до євреїв називає першу скинію «Сьвята», а другу — «Сьвятая Сьвятих» і бачить в однократному щорічному вході первосвященника образ Христа, який «увійшов раз у сьвятиню, знайшовши вічне відкупленнє»."
    - "Після того як Тит спалив храм 70 р. н. е., світильник і стіл несли в його тріумфі в Римі, як показує рельєф на Арці Тита. Де стояла зала на Храмовій горі, оспорюють: більшість розміщує храм із його внутрішньою святинею біля скелі під Куполом Скелі, дехто далі на північ чи південь, і нічого з неї сьогодні не можна побачити чи розкопати."
  es:
    - "El Lugar Santo es la sala principal del santuario, la estancia entre el pórtico y el Santo de los Santos. En el tabernáculo era la primera de dos cámaras, separada de la interior por el velo: «aquel velo os hará separación entre el lugar santo y el santísimo». Contenía la mesa de los panes de la proposición al norte, el candelabro al sur y el altar de oro del incienso ante el velo. En el Templo de Salomón la misma sala, el hekal, medía cuarenta codos de largo, veinte de ancho y treinta de alto, revestida de cedro y recubierta de oro, con diez candelabros, «Y cinco candeleros de oro purísimo á la mano derecha, y otros cinco á la izquierda, delante del oráculo»; la Biblia suele llamar a todo el edificio «la casa» y a esta sala «el templo»."
    - "Los sacerdotes comunes servían aquí cada día, despabilando las lámparas y quemando incienso por la mañana y por la tarde, y colocaban pan nuevo cada sábado; solo el sumo sacerdote pasaba más allá del velo, una vez al año. Cuando se introdujo el arca, las cabezas de sus varas «se dejaban ver desde el santuario delante del oráculo», y al salir los sacerdotes «la nube hinchió la casa de Jehová». Ezequías hizo que los levitas sacaran «del santuario la inmundicia» después de que Acaz cerrara las puertas y apagara las lámparas. El templo visionario de Ezequiel conserva el plano, con cámaras donde los sacerdotes dejan «sus vestimentas con que ministrarán, porque son santas»."
    - "El Segundo Templo y la reconstrucción de Herodes mantuvieron la disposición. Josefo describe la sala con sus grandes puertas de oro y su tapiz babilónico, y dentro de ella el candelabro, la mesa y el altar del incienso; Antíoco IV se llevó estos objetos en el 169 a. C., Judas Macabeo hizo otros nuevos, y Pompeyo, que entró en el 63 a. C., no tocó nada. Aquí Zacarías, a quien «salió en suerte á poner el incienso», vio al ángel mientras el pueblo esperaba fuera. Jesús advirtió de «la abominación del asolamiento, que fué dicha por Daniel profeta, que estará en el lugar santo». La Epístola a los Hebreos llama a la primera tienda «el Santuario» y a la segunda «el Lugar Santísimo», y ve en la única entrada anual del sumo sacerdote una figura de Cristo, que «entró una sola vez en el santuario, habiendo obtenido eterna redención»."
    - "Después de que Tito incendiara el Templo en el 70 d. C., el candelabro y la mesa fueron llevados en su triunfo en Roma, como muestra el relieve del Arco de Tito. Dónde estuvo la sala en el monte del Templo es discutido: la mayoría sitúa el Templo con su santuario interior en la roca bajo la Cúpula de la Roca, algunos más al norte o al sur, y hoy nada de él puede verse ni excavarse."
  pt:
    - "O Lugar Santo é o salão principal do santuário, a sala entre o pórtico e o Santo dos Santos. No tabernáculo era a primeira de duas câmaras, separada da interior pelo véu: “O véu separará para você o Lugar Santo do Santíssimo Lugar”. Continha a mesa dos pães da proposição ao norte, o candelabro ao sul e o altar de ouro do incenso diante do véu. No Templo de Salomão, o mesmo salão, o hekal, tinha quarenta côvados de comprimento, vinte de largura e trinta de altura, revestido de cedro e recoberto de ouro, com dez candelabros, “cinco do lado direito e cinco do lado esquerdo, em frente ao santuário interior”; a Bíblia costuma chamar todo o edifício “a casa” e esta sala “o templo”."
    - "Sacerdotes comuns serviam aqui todos os dias, aparando as lâmpadas e queimando incenso de manhã e à tarde, e dispunham pão fresco cada sábado; só o sumo sacerdote passava além do véu, uma vez por ano. Quando a arca foi trazida, as pontas das varas “podiam ser vistas do Lugar Santo, diante do santuário interior”, e quando os sacerdotes saíram “a nuvem encheu a casa do SENHOR”. Ezequias fez os levitas tirarem “a impureza do lugar santo” depois que Acaz fechara as portas e apagara as lâmpadas. O templo visionário de Ezequiel conserva a planta, com câmaras onde os sacerdotes deixam “as suas vestes com as quais ministram; pois elas são santas”."
    - "O Segundo Templo e a reconstrução de Herodes conservaram a disposição. Josefo descreve o salão com suas grandes portas de ouro e tapeçaria babilônica, e dentro dele o candelabro, a mesa e o altar do incenso; Antíoco IV os levou em 169 a.C., Judas Macabeu fez novos, e Pompeu, que entrou em 63 a.C., nada tocou. Aqui Zacarias, a quem “coube por sorte entrar no templo do Senhor e queimar incenso”, viu o anjo enquanto o povo esperava fora. Jesus advertiu sobre “a abominação da desolação, da qual falou o profeta Daniel, instalada no lugar santo”. A Epístola aos Hebreus chama a primeira tenda de “Lugar Santo” e a segunda de “Santo dos Santos”, e vê na única entrada anual do sumo sacerdote uma figura de Cristo, que “entrou no Lugar Santo de uma vez por todas, tendo obtido eterna redenção”."
    - "Depois que Tito queimou o Templo em 70 d.C., o candelabro e a mesa foram levados em seu triunfo em Roma, como mostra o relevo do Arco de Tito. Onde o salão ficava no monte do Templo é disputado: a maioria situa o Templo com seu santuário interior na rocha sob o Domo da Rocha, alguns mais ao norte ou ao sul, e nada dele pode ser visto ou escavado hoje."
  de:
    - "Das Heilige ist der Hauptsaal des Heiligtums, der Raum zwischen der Vorhalle und dem Allerheiligsten. In der Stiftshütte war es die erste von zwei Kammern, vom inneren Raum durch den Vorhang getrennt: „daß er euch eine Scheidewand sei zwischen dem Heiligen und dem Allerheiligsten“. Es barg den Tisch der Schaubrote im Norden, den Leuchter im Süden und den goldenen Räucheraltar vor dem Vorhang. In Salomos Tempel war derselbe Saal, das Hekal, vierzig Ellen lang, zwanzig breit und dreißig hoch, mit Zedernholz getäfelt und mit Gold überzogen, mit zehn Leuchtern, „fünf Leuchter zur rechten Hand und fünf Leuchter zur Linken vor dem Chor“; die Bibel nennt das ganze Gebäude gewöhnlich „das Haus“ und diesen Raum „der Tempel“."
    - "Gewöhnliche Priester dienten hier täglich, putzten die Lampen und verbrannten morgens und abends Räucherwerk und legten jeden Sabbat frisches Brot aus; nur der Hohepriester ging einmal im Jahr hinter den Vorhang. Als die Lade hereingebracht wurde, waren ihre Stangen so lang, „daß ihre Knäufe gesehen wurden in dem Heiligtum vor dem Chor“, und als die Priester herausgingen, „erfüllte die Wolke das Haus des HERRN“. Hiskia ließ die Leviten „den Unflat aus dem Heiligtum“ tragen, nachdem Ahas die Türen verschlossen und die Lampen ausgelöscht hatte. Hesekiels Tempelvision behält den Plan bei, mit Kammern, in denen die Priester „ihre Kleider, darin sie gedient haben“, ablegen, „denn sie sind heilig“."
    - "Der Zweite Tempel und Herodes' Neubau behielten die Anordnung bei. Josephus beschreibt den Saal mit seinen großen goldenen Türen und dem babylonischen Teppich und darin Leuchter, Tisch und Räucheraltar; Antiochos IV. trug diese 169 v. Chr. fort, Judas Makkabäus ließ neue machen, und Pompeius, der 63 v. Chr. eintrat, rührte nichts an. Hier sah Zacharias, den das Los traf, „daß er räuchern sollte“, den Engel, während das Volk draußen wartete. Jesus sagte: „Wenn ihr nun sehen werdet den Greuel der Verwüstung (davon gesagt ist durch den Propheten Daniel), daß er steht an der heiligen Stätte“. Der Hebräerbrief nennt das erste Zelt „das Heilige“ und das zweite „das Allerheiligste“ und sieht im einmaligen jährlichen Eintritt des Hohepriesters ein Bild Christi, der „einmal in das Heilige eingegangen“ ist „und hat eine ewige Erlösung erfunden“."
    - "Nachdem Titus den Tempel im Jahr 70 n. Chr. verbrannt hatte, wurden Leuchter und Tisch in seinem Triumphzug in Rom mitgeführt, wie das Relief am Titusbogen zeigt. Wo der Saal auf dem Tempelberg stand, ist umstritten: Die meisten setzen den Tempel mit seinem inneren Schrein am Felsen unter dem Felsendom an, manche weiter nördlich oder südlich, und nichts davon ist heute zu sehen oder zu graben."
  fr:
    - "Le Lieu saint est la grande salle du sanctuaire, la pièce entre le portique et le Saint des saints. Dans le tabernacle, c’était la première de deux chambres, séparée de l’intérieure par le voile : « le voile vous servira de séparation entre le lieu saint et le lieu très saint ». Elle contenait la table des pains de proposition au nord, le chandelier au sud et l’autel d’or des parfums devant le voile. Dans le temple de Salomon, la même salle, le hékal, avait quarante coudées de long, vingt de large et trente de haut, lambrissée de cèdre et plaquée d’or, avec dix chandeliers, « cinq à droite et cinq à gauche, devant le sanctuaire » ; la Bible appelle d’ordinaire tout l’édifice « la maison » et cette salle « le temple »."
    - "Les prêtres ordinaires y servaient chaque jour, soignant les lampes et brûlant l’encens matin et soir, et disposaient du pain frais chaque sabbat ; seul le grand prêtre allait au-delà du voile, une fois par an. Quand l’arche fut introduite, les extrémités de ses barres « se voyaient du lieu saint devant le sanctuaire », et quand les prêtres sortirent, « la nuée remplit la maison de l’Éternel ». Ézéchias ordonna aux Lévites de mettre « ce qui est impur hors du sanctuaire » après qu’Achaz avait fermé les portes et éteint les lampes. Le temple visionnaire d’Ézéchiel garde le plan, avec des chambres où les prêtres déposent « les vêtements avec lesquels ils font le service, car ces vêtements sont saints »."
    - "Le Second Temple et celui d’Hérode gardèrent la disposition. Josèphe décrit la salle avec ses grandes portes d’or et sa tapisserie babylonienne, et à l’intérieur le chandelier, la table et l’autel des parfums ; Antiochus IV les emporta en 169 av. J.-C., Judas Maccabée en fit de nouveaux, et Pompée, qui y entra en 63 av. J.-C., ne toucha à rien. Zacharie, désigné par le sort « à entrer dans le temple du Seigneur pour offrir le parfum », vit l’ange pendant que le peuple attendait dehors. Jésus avertit de « l’abomination de la désolation, dont a parlé le prophète Daniel, établie en lieu saint ». L’épître aux Hébreux nomme la première tente « le lieu saint » et la seconde « le saint des saints », et voit dans l’entrée annuelle du grand prêtre une figure du Christ, qui « est entré une fois pour toutes dans le lieu très saint », ayant « obtenu une rédemption éternelle »."
    - "Après que Titus eut brûlé le Temple en 70 apr. J.-C., le chandelier et la table furent portés dans son triomphe à Rome, comme le montre le relief de l’arc de Titus. L’emplacement de la salle sur le mont du Temple est débattu : la plupart situent le Temple avec son sanctuaire intérieur au rocher sous le Dôme du Rocher, certains plus au nord ou au sud, et rien n’en peut être vu ni fouillé aujourd’hui."
  pl:
    - "Miejsce Święte to główna sala sanktuarium, pomieszczenie między przedsionkiem a Miejscem Najświętszym. W przybytku było pierwszą z dwóch komór, oddzieloną od wewnętrznej zasłoną: „dzielić wam będzie ta zasłona świątnicę od świątnicy najświętszej”. Mieściło stół chlebów pokładnych od północy, świecznik od południa i złoty ołtarz kadzenia przed zasłoną. W Świątyni Salomona ta sama sala, hekal, miała czterdzieści łokci długości, dwadzieścia szerokości i trzydzieści wysokości, wyłożona cedrem i pokryta złotem, z dziesięcioma świecznikami, „pięć lichtarzy po prawej stronie, a pięć po lewej stronie przed świątnicą”; Biblia zwykle nazywa cały budynek „domem”, a tę salę „świątynią”."
    - "Zwykli kapłani służyli tu codziennie, przycinając lampy i paląc kadzidło rano i wieczorem, i kładąc świeże chleby co szabat; tylko arcykapłan wchodził za zasłonę, raz w roku. Gdy wniesiono arkę, „widać było końce ich w świątnicy na przodku świątnicy świętych”, a gdy kapłani wychodzili, „obłok napełnił dom Pański”. Ezechiasz kazał Lewitom wynieść „plugastwa z świątnicy” po tym, jak Achaz zamknął drzwi i pogasił lampy. Wizyjna świątynia Ezechiela zachowuje ten plan, z komnatami, gdzie kapłani zostawiają „odzienia swoje, w których służyli (bo święte jest)”."
    - "Druga Świątynia i przebudowa Heroda zachowały ten układ. Józef Flawiusz opisuje salę z wielkimi złotymi drzwiami i babilońską tkaniną, a w niej świecznik, stół i ołtarz kadzenia; Antioch IV zabrał je w 169 r. p.n.e., Juda Machabeusz sporządził nowe, a Pompejusz, który wszedł w 63 r. p.n.e., niczego nie ruszył. Tu Zachariasz, któremu „przypadł nań los, aby kadził”, ujrzał anioła, gdy lud czekał na zewnątrz. Jezus ostrzegł: „gdy ujrzycie obrzydliwość spustoszenia, opowiedzianą przez Danijela proroka, stojącą na miejscu świętem”. List do Hebrajczyków nazywa pierwszy przybytek „świątnicą”, a drugi „świątnicą najświętszą” i widzi w jednorazowym corocznym wejściu arcykapłana obraz Chrystusa, który „wszedł raz do świątnicy, znalazłszy wieczne odkupienie”."
    - "Po spaleniu Świątyni przez Tytusa w 70 r. n.e. świecznik i stół niesiono w jego triumfie w Rzymie, jak pokazuje relief na Łuku Tytusa. Gdzie sala stała na Wzgórzu Świątynnym, jest sporne: większość umieszcza Świątynię z jej wewnętrznym sanktuarium przy skale pod Kopułą na Skale, niektórzy dalej na północ lub południe, a nic z niej nie można dziś zobaczyć ani wykopać."
  it:
    - "Il Luogo Santo è la sala principale del santuario, il vano fra il portico e il Santo dei Santi. Nel tabernacolo era la prima delle due stanze, separata da quella interna dal velo: «quel velo sarà per voi la separazione del luogo santo dal santissimo». Conteneva la tavola dei pani della presentazione a nord, il candelabro a sud e l’altare d’oro dell’incenso davanti al velo. Nel Tempio di Salomone la stessa sala, lo hekal, era lunga quaranta cubiti, larga venti e alta trenta, rivestita di cedro e ricoperta d’oro, con dieci candelabri, «cinque a destra e cinque a sinistra, davanti al santuario»; la Bibbia chiama di solito l’intero edificio «la casa» e questa sala «il tempio»."
    - "I sacerdoti comuni vi prestavano servizio ogni giorno, rifornendo le lampade e bruciando incenso mattina e sera, e disponevano pane fresco ogni sabato; solo il sommo sacerdote andava oltre il velo, una volta l’anno. Quando l’arca fu introdotta, le estremità delle sue stanghe «si vedevano dal luogo santo, davanti al santuario», e mentre i sacerdoti uscivano «la nuvola riempì la casa dell’Eterno». Ezechia ordinò ai Leviti di portare «fuori dal santuario ogni immondezza» dopo che Acaz aveva chiuso le porte e spento le lampade. Il tempio visionario di Ezechiele conserva la pianta, con stanze dove i sacerdoti lasciano «i paramenti coi quali fanno il servizio, perché questi paramenti sono santi»."
    - "Il Secondo Tempio e la ricostruzione di Erode mantennero la disposizione. Giuseppe Flavio descrive la sala con le sue grandi porte d’oro e l’arazzo babilonese, e all’interno il candelabro, la tavola e l’altare dell’incenso; Antioco IV li portò via nel 169 a.C., Giuda Maccabeo ne fece di nuovi, e Pompeo, che entrò nel 63 a.C., non toccò nulla. Qui Zaccaria, cui «toccò a sorte» di offrire il profumo, vide l’angelo mentre il popolo attendeva fuori. Gesù ammonì sull’«abominazione della desolazione, della quale ha parlato il profeta Daniele, posta in luogo santo». La Lettera agli Ebrei chiama la prima tenda «il Luogo santo» e la seconda «il Luogo santissimo», e vede nell’unico ingresso annuale del sommo sacerdote una figura di Cristo, che «è entrato una volta per sempre nel santuario, avendo acquistata una redenzione eterna»."
    - "Dopo che Tito bruciò il Tempio nel 70 d.C., il candelabro e la tavola furono portati nel suo trionfo a Roma, come mostra il rilievo dell’Arco di Tito. Dove sorgesse la sala sul Monte del Tempio è discusso: i più pongono il Tempio con il suo santuario interno sulla roccia sotto la Cupola della Roccia, alcuni più a nord o a sud, e nulla di esso si può oggi vedere o scavare."
  nl:
    - "Het Heilige is de hoofdzaal van het heiligdom, de ruimte tussen het voorhuis en het Heilige der Heiligen. In de tabernakel was het de eerste van twee vertrekken, gescheiden van het binnenste door de voorhang: “deze voorhang zal ulieden een scheiding maken tussen het heilige, en tussen het heilige der heiligen”. Het bevatte de tafel van de toonbroden aan de noordkant, de kandelaar aan de zuidkant en het gouden altaar van het reukwerk vóór de voorhang. In Salomo’s tempel was dezelfde zaal, de hekal, veertig ellen lang, twintig breed en dertig hoog, met cederhout bekleed en met goud overtrokken, met tien kandelaren, “vijf aan de rechterhand, en vijf aan de linkerhand, voor de aanspraakplaats”; de Bijbel noemt het hele gebouw meestal “het huis” en deze zaal “de tempel”."
    - "Gewone priesters dienden hier elke dag, verzorgden de lampen en brandden ’s ochtends en ’s avonds reukwerk, en legden elke sabbat verse broden neer; alleen de hogepriester ging, eenmaal per jaar, achter de voorhang. Toen de ark binnengebracht werd, “gezien werden” de hoofden van de handbomen “uit het heiligdom voor aan de aanspraakplaats”, en toen de priesters uit het heilige uitgingen, geschiedde het “dat een wolk het huis des HEEREN vervulde”. Chizkia gebood de Levieten: “brengt de onreinigheid uit van het heiligdom”, nadat Achaz de deuren had gesloten en de lampen had uitgeblust. Ezechiëls visioenentempel behoudt het plan, met kamers waar de priesters “hun klederen henenleggen, in dewelke zij gediend hebben, want die zijn een heiligheid”."
    - "De Tweede Tempel en Herodes’ herbouw behielden de indeling. Josephus beschrijft de zaal met haar grote gouden deuren en Babylonisch tapijt, en daarin de kandelaar, de tafel en het reukaltaar; Antiochus IV nam deze in 169 v.Chr. mee, Judas Makkabeüs liet nieuwe maken, en Pompeius, die in 63 v.Chr. binnentrad, roerde niets aan. Hier zag Zacharias, wie het “te lote was gevallen, dat hij zoude ingaan in den tempel des Heeren om te reukofferen”, de engel terwijl het volk buiten wachtte. Jezus sprak van “den gruwel der verwoesting, waarvan gesproken is door Daniel, den profeet, staande in de heilige plaats”. De brief aan de Hebreeën noemt de eerste tent “het heilige” en de tweede “het heilige der heiligen”, en ziet in de jaarlijkse ingang van de hogepriester een beeld van Christus, die “eenmaal ingegaan in het heiligdom, een eeuwige verlossing teweeggebracht” heeft."
    - "Nadat Titus de tempel in 70 n.Chr. had verbrand, werden de kandelaar en de tafel in zijn triomftocht te Rome meegevoerd, zoals het reliëf op de Boog van Titus laat zien. Waar de zaal op de Tempelberg stond, is omstreden: de meesten plaatsen de tempel met zijn binnenste heiligdom bij de rots onder de Rotskoepel, sommigen verder naar het noorden of zuiden, en er is nu niets van te zien of op te graven."
  cs:
    - "Svatyně je hlavní síň svatostánku, místnost mezi předsíní a Nejsvětější svatyní. Ve stánku byla první ze dvou komor, oddělená od vnitřní oponou: „a oddělovati vám bude ta opona svatyni od svatyně svatých“. Obsahovala stůl s chleby předložení na severu, svícen na jihu a zlatý kadidlový oltář před oponou. V Šalomounově chrámu měla táž síň, hekal, čtyřicet loket na délku, dvacet na šířku a třicet na výšku, byla obložena cedrem a pokryta zlatem, s deseti svícny, „pět na pravé a pět na levé straně před svatyní svatých“; Bible obvykle nazývá celou stavbu „domem“ a tuto místnost „chrámem“."
    - "Obyčejní kněží zde sloužili každý den, upravovali lampy a pálili kadidlo ráno a večer a každou sobotu vykládali čerstvé chleby; jen velekněz vcházel za oponu, jednou za rok. Když byla vnesena truhla, koncové jejích tyčí „v svatyni k předku svatyně svatých“ byly vidět, a když kněží vycházeli, „oblak naplnil dům Hospodinův“. Chizkijáš nechal levity vynést „nečistotu z svatyně“, poté co Achaz zavřel dveře a zhasil lampy. Ezechielův vizionářský chrám zachovává plán, s komorami, kde kněží nechávají „roucha svého, v němž přisluhovali; nebo svaté jest“."
    - "Druhý chrám a Herodova přestavba uspořádání zachovaly. Josephus popisuje síň s velkými zlatými dveřmi a babylonskou oponou a uvnitř svícen, stůl a kadidlový oltář; Antiochos IV. je odvezl roku 169 př. n. l., Juda Makabejský zhotovil nové a Pompeius, který vstoupil roku 63 př. n. l., se ničeho nedotkl. Zde Zachariáš, jemuž „los naň přišel, aby položil zápal“, spatřil anděla, zatímco lid čekal venku. Ježíš řekl, že uvidí „ohavnost zpuštění, předpověděnou od Daniele proroka, ana stojí na místě svatém“. List Židům nazývá první stan „svatyně“ a druhý „svatyně svatých“ a vidí v jediném ročním vstupu velekněze obraz Krista, který „všel jednou do svatyně, věčné vykoupení nalezl“."
    - "Poté co Titus roku 70 n. l. chrám spálil, byly svícen a stůl neseny v jeho triumfu v Římě, jak ukazuje reliéf na Titově oblouku. Kde síň na Chrámové hoře stála, je sporné: většina klade chrám s vnitřní svatyní na skálu pod Skalním dómem, někteří dále na sever nebo na jih, a z něj nelze dnes nic vidět ani vykopat."
  sv:
    - "Det heliga är helgedomens huvudsal, rummet mellan förhallen och det allraheligaste. I tabernaklet var det det första av två rum, skilt från det inre av förlåten: ”så skall förlåten för eder vara en skiljevägg mellan det heliga och det allraheligaste”. Där stod skådebrödsbordet i norr, ljusstaken i söder och det gyllene rökelsealtaret framför förlåten. I Salomos tempel var samma sal, hekal, fyrtio alnar lång, tjugo bred och trettio hög, klädd med cederträ och överdragen med guld, med tio ljusstakar, ”fem på högra sidan och fem på vänstra framför koret”; Bibeln kallar vanligen hela byggnaden ”huset” och detta rum ”tempelsalen”."
    - "Vanliga präster tjänstgjorde här varje dag, skötte lamporna och brände rökelse morgon och kväll, och lade fram nytt bröd varje sabbat; bara översteprästen gick bortom förlåten, en gång om året. När arken fördes in kunde stängernas ändar ses ”från helgedomen framför koret”, och när prästerna gick ut ”uppfyllde molnskyn HERRENS hus”. Hiskia manade leviterna att ”skaffen orenheten ut ur helgedomen” sedan Achas hade stängt dörrarna och släckt lamporna. Hesekiels synrika tempel behåller planen, med kamrar där prästerna lämnar ”de kläder i vilka de hava gjort tjänst, ty dessa äro heliga”."
    - "Andra templet och Herodes ombyggnad behöll anordningen. Josefus beskriver salen med dess stora gyllene dörrar och babyloniska tapet, och inuti den ljusstaken, bordet och rökelsealtaret; Antiochos IV förde bort dessa 169 f.Kr., Judas mackabeen lät göra nya, och Pompeius, som gick in 63 f.Kr., rörde ingenting. Här såg Sackarias ängeln medan folket väntade utanför; det var lotten som lät honom ”gå in i Herrens tempel och tända rökelsen”. Jesus varnade för ”förödelsens styggelse, om vilken är talat genom profeten Daniel, stå på helig plats”. Hebreerbrevet kallar det första tältet ”det heliga” och det andra ”det allraheligaste”, och ser i översteprästens enda årliga inträde en bild av Kristus, som ”gick ... en gång för alla in i det allraheligaste och vann en evig förlossning”."
    - "Sedan Titus bränt templet år 70 e.Kr. fördes ljusstaken och bordet i hans triumf i Rom, som reliefen på Titusbågen visar. Var salen stod på Tempelberget är omstritt: de flesta placerar templet med dess inre helgedom vid klippan under Klippdomen, några längre norrut eller söderut, och intet av den kan ses eller grävas fram i dag."
  nb:
    - "Det hellige er helligdommens hovedhall, rommet mellom forhallen og Det aller helligste. I tabernaklet var det det første av to rom, skilt fra det indre av forhenget: «forhenget skal være for eder en skillevegg mellem det Hellige og det Aller-helligste». Det rommet bordet med skuebrødene i nord, lysestaken i sør og det gullbelagte røkelsesalteret foran forhenget. I Salomos tempel var den samme hallen, hekal, førti alen lang, tjue bred og tretti høy, kledd med seder og overtrukket med gull, med ti lysestaker, «fem på høire og fem på venstre side - foran koret»; Bibelen kaller vanligvis hele bygningen «huset», og om hallen sies «det Hellige foran koret»."
    - "Vanlige prester tjenestegjorde her hver dag, stelte lampene og brente røkelse morgen og kveld, og la fram nytt brød hver sabbat; bare øverstepresten gikk innenfor forhenget, én gang i året. Da arken ble båret inn, «Stengene var så lange at deres ender kunde sees fra det Hellige foran koret, men ikke utenfor», og da prestene gikk ut, «fylte skyen Herrens hus». Hiskia lot levittene få «urenheten ut av helligdommen» etter at Ahas hadde stengt dørene og slukket lampene. Esekiels visjonære tempel beholder planen, med rom der prestene legger igjen «de klær som de gjør tjeneste i; for de er hellige»."
    - "Det andre tempelet og Herodes' ombygging beholdt ordningen. Josefus beskriver hallen med dens store gulldører og babylonske teppe, og inni den lysestaken, bordet og røkelsesalteret; Antiokos 4. førte disse bort i 169 f.Kr., Judas Makkabeus lagde nye, og Pompeius, som gikk inn i 63 f.Kr., rørte ingenting. Her så Sakarias, som det «tilfalt å gå inn i Herrens tempel og ofre røkelse», engelen mens folket ventet utenfor. Jesus advarte om «ødeleggelsens vederstyggelighet, som profeten Daniel har talt om, stå på hellig grunn». Hebreerbrevet kaller det første teltet «det Hellige» og det andre «det Aller-helligste», og ser i øversteprestens ene årlige inngang et bilde på Kristus, som gikk «en gang inn i helligdommen og fant en evig forløsning»."
    - "Etter at Titus brente tempelet i 70 e.Kr. ble lysestaken og bordet båret i hans triumftog i Roma, slik relieffet på Titusbuen viser. Hvor hallen sto på Tempelberget, er omstridt: de fleste plasserer tempelet med dets indre helligdom ved klippen under Klippedomen, noen lenger nord eller sør, og ingenting av det kan sees eller graves ut i dag."
  tl:
    - "Ang Dakong Banal ang pangunahing bulwagan ng santuwaryo, ang silid sa pagitan ng portiko at ng Kabanalbanalang Dako. Sa tabernakulo ito ang una sa dalawang silid, na hinihiwalay sa panloob ng lambong: “paghihiwalayin sa inyo ng lambong ang dakong banal at ang kabanalbanalang dako”. Naroon ang dulang ng tinapay na handog sa hilaga, ang kandelero sa timog at ang gintong dambana ng kamangyan sa harap ng lambong. Sa Templo ni Salomon ang gayunding bulwagan, ang hekal, ay apatnapung siko ang haba, dalawampu ang luwang at tatlumpu ang taas, nilagyan ng sedro ang mga dingding at binalutan ng ginto, na may sampung kandelero, “lima sa dakong kanan, at lima sa kaliwa sa harap ng sanggunian”; karaniwang tinatawag ng Biblia ang buong gusali na “ang bahay” at ang silid na ito na “ang templo”."
    - "Araw-araw na naglilingkod dito ang karaniwang mga saserdote, nag-aayos ng mga ilawan at nagsusunog ng kamangyan umaga at hapon, at naglalagay ng bagong tinapay tuwing sabbath; ang pangulong saserdote lamang ang pumapasok sa kabila ng lambong, minsan sa isang taon. Nang ipasok ang kaban, ang mga dulo ng mga pingga nito ay “nakikita mula sa dakong banal sa harap ng sanggunian”, at nang magsilabas ang mga saserdote, “napuno ng ulap ang bahay ng Panginoon”. Ipinalabas ni Ezechias sa mga Levita “ang dumi mula sa dakong banal” matapos isara ni Achaz ang mga pinto at patayin ang mga ilawan. Pinananatili ng templo sa pangitain ni Ezekiel ang plano, na may mga silid kung saan iniiwan ng mga saserdote “ang kanilang mga kasuutan na kanilang ipinangangasiwa; sapagka't mga banal”."
    - "Pinanatili ito ng Ikalawang Templo at ng Templo ni Herodes. Ayon kay Josefo, may malalaking gintong pinto at tapiseryang Babilonyo ang bulwagan, at sa loob ang kandelero, dulang at dambana ng kamangyan; kinuha ang mga ito ni Antiochus IV noong 169 BK, pinalitan ni Judas Macabeo, at hindi ginalaw ni Pompeyo, na pumasok noong 63 BK. Dito nakita ni Zacharias, na “naging palad niya ang pumasok sa templo ng Panginoon at magsunog ng kamangyan”, ang anghel habang nasa labas ang bayan. Binalaan ni Jesus ukol sa “kasuklamsuklam na paninira, na sinalita sa pamamagitan ng propeta Daniel, na natatayo sa dakong banal”. Tinatawag ng Sulat sa mga Hebreo na “Dakong Banal” ang unang tabernakulo at “Dakong Kabanalbanalan” ang ikalawa, at larawan ni Cristo ang taunang pagpasok ng pangulong saserdote, na “pumasok na minsan magpakailan man sa dakong banal, na kinamtan ang walang hanggang katubusan”."
    - "Matapos sunugin ni Tito ang Templo noong 70 AD, dinala sa kaniyang tagumpay sa Roma ang kandelero at ang dulang, gaya ng ipinakikita ng relief sa Arko ni Tito. Pinagtatalunan kung saan nakatayo ang bulwagan sa Bundok ng Templo: karamihan ay naglalagay sa Templo kasama ang panloob nitong dambana sa bato sa ilalim ng Dome of the Rock, ang ilan ay mas hilaga o mas timog, at wala nang makikita o mahuhukay nito ngayon."
  da:
    - "Det Hellige er helligdommens hovedhal, rummet mellem forhallen og Det Allerhelligste. I tabernaklet var det det første af to rum, adskilt fra det indre af forhænget: »Forhænget skal skille for eder imellem det hellige og imellem det allerhelligste«. Det rummede skuebrødsbordet mod nord, lysestagen mod syd og det gyldne røgelsesalter foran forhænget. I Salomos tempel var den samme hal, hekal, fyrre alen lang, tyve bred og tredive høj, beklædt med cedertræ og overtrukket med guld, med ti lysestager, »de fem Lysestager paa den højre Side og de fem paa den venstre Side lige for Koret«; Bibelen kalder sædvanligvis hele bygningen »huset« og dette rum »templet«."
    - "Almindelige præster gjorde tjeneste her hver dag, trimmede lamperne og brændte røgelse morgen og aften, og lagde frisk brød frem hver sabbat; kun ypperstepræsten gik ud over forhænget, én gang om året. Da arken blev bragt ind, »Stængernes Knapper saas fra det hellige lige for Koret«, og da præsterne gik ud, »fyldte Skyen Herrens Hus«. Hizkija bød leviterne: »bringer Urenheden bort fra Helligdommen!«, efter at Akaz havde lukket dørene og slukket lamperne. Ezekiels visionære tempel bevarer planen, med celler, hvor præsterne efterlader »deres Klæder, i hvilke de gjøre Tjeneste, thi disse ere hellige«."
    - "Andet Tempel og Herodes' genopbygning bevarede ordningen. Josefus beskriver hallen med dens store gyldne døre og babylonske tæppe, og inden i den lysestagen, bordet og røgelsesalteret; Antiochos IV førte dem bort i 169 f.Kr., Judas Makkabæus lod gøre nye, og Pompejus, der trådte ind i 63 f.Kr., rørte intet. Her så Zakarias, som det tilfaldt »efter Præstetjenestens Sædvane at gaa ind i Herrens Tempel og bringe Røgelseofferet«, englen, mens folket ventede udenfor. Jesus advarede om »Ødelæggelsens Vederstyggelighed, hvorom der er talt ved Profeten Daniel, staa paa hellig Grund«. Hebræerbrevet kalder det første telt »det hellige« og det andet »det allerhelligste« og ser i ypperstepræstens ene årlige indtræden et billede på Kristus, som gik »een Gang for alle ind i Helligdommen og vandt en evig Forløsning«."
    - "Efter at Titus brændte templet i 70 e.Kr. blev lysestagen og bordet båret i hans triumftog i Rom, som relieffet på Titusbuen viser. Hvor hallen stod på Tempelbjerget, er omstridt: de fleste placerer templet med dets indre helligdom ved klippen under Klippedomen, nogle længere mod nord eller syd, og intet af det kan ses eller graves i dag."
