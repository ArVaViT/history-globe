# Overview article (ADR 0007). Mainstream facts only; Crete is given as the usual identification, with the alternatives named.
id: caphtor
place: a329990
title:
  en: "Caphtor"
  ru: "Кафтор"
  uk: "Кафтор"
  es: "Caftor"
  pt: "Caftor"
  de: "Kaftor"
  fr: "Caphtor"
body:
  en:
    - "Caphtor is the land from which the Philistines came. Amos has the LORD ask whether he did not bring up “the Philistines from Caphtor, and the Syrians from Kir” as he brought Israel out of Egypt; Jeremiah calls the Philistines “the remnant of the country of Caphtor”, where the Hebrew word is “island” or “coastland”; Deuteronomy records that “the Caphtorims, which came forth out of Caphtor” destroyed the Avims who lived as far as Gaza and settled in their place; and the table of nations lists the Caphtorim among the descendants of Mizraim, Egypt, beside the Casluhim “out of whom came Philistim”."
    - "Most scholars identify Caphtor with Crete. Egyptian texts call the island Keftiu: envoys of Keftiu bearing Aegean vessels are painted in Theban tombs of the fifteenth century BC, and a list of Amenhotep III at Kom el-Hetan names Knossos, Phaistos and Kydonia. The letters of Mari in the eighteenth century BC and the texts of Ugarit know Kaptara as a land across the sea. The Septuagint and the Targums, however, rendered Caphtor as Cappadocia, and scholars have argued for Cilicia (G. A. Wainwright), Cyprus (J. Strange), the Aegean islands or Karpathos; the map shows these as candidates. What is certain is the Aegean origin of the Philistines: they appear among the Sea Peoples whom Rameses III fought about 1175 BC in the reliefs of Medinet Habu, and the earliest pottery of their cities is a local version of Mycenaean ware. The Cherethites, “Cretans”, of David's guard point the same way."
    - "Crete is today the largest island of Greece, with the Minoan palaces of Knossos, Phaistos and Malia and the museum at Heraklion; the article on Crete follows the island into the New Testament."
  ru:
    - "Кафтор — земля, из которой вышли Филистимляне. У Амоса Господь спрашивает, не Он ли вывел Филистимлян из Кафтора и Арамлян из Кира, как вывел Израиль из Египта; Иеремия зовёт Филистимлян «остаток острова Кафтора»; Второзаконие записывает, что «Кафторимы, исшедшие из Кафтора», истребили Аввеев, живших до самой Газы, и поселились на их месте; а таблица народов называет Кафторима среди потомков Мицраима, Египта, рядом с Каслухимом, «откуда вышли Филистимляне»."
    - "Большинство учёных отождествляет Кафтор с Критом. Египетские тексты зовут остров Кефтиу: посланцы Кефтиу с эгейскими сосудами написаны в фиванских гробницах XV века до н. э., а список Аменхотепа III в Ком-эль-Хеттане называет Кносс, Фест и Кидонию. Письма Мари XVIII века до н. э. и тексты Угарита знают Каптару как землю за морем. Однако Септуагинта и Таргумы передали Кафтор как Каппадокию, а учёные доказывали Киликию (Дж. А. Уэйнрайт), Кипр (Й. Странге), острова Эгейского моря или Карпатос; на карте они показаны как кандидаты. Несомненно эгейское происхождение Филистимлян: они стоят среди народов моря, с которыми Рамсес III сражался около 1175 г. до н. э. на рельефах Мединет-Абу, а древнейшая керамика их городов — местный вариант микенской. На то же указывают Хелефеи, «критяне», из стражи Давида."
    - "Крит сегодня — крупнейший остров Греции, с минойскими дворцами Кносса, Феста и Малии и музеем в Ираклионе; статья о Крите ведёт остров дальше, в Новый Завет."
  uk:
    - "Кафтор — земля, звідки прийшли филистимляни. Амос змушує Господа запитати, чи не вивів Він «Филистіїв із Кафтору, а Араміїв — із Киру», так само, як вивів Ізраїль із Єгипту; Єремія називає филистимлян «останок острова Кафтора», де єврейське слово означає «острів» або «узбережжя»; Повторення Закону повідомляє, що «Кафторими, що, вийшовши з Кафтора» знищили авимів, які жили аж до Гази, і оселилися на їхньому місці; а таблиця народів перелічує кафторимів серед нащадків Міцраїма, Єгипту, поряд із каслугимами, «від котрих пійшли Филистимцї»."
    - "Більшість учених ототожнює Кафтор із Критом. Єгипетські тексти називають острів Кефтіу: посли Кефтіу з егейськими посудинами зображені на фресках фіванських гробниць XV ст. до н. е., а список Аменхотепа III у Ком-ель-Хетані називає Кносс, Фест і Кідонію. Листи з Марі XVIII ст. до н. е. та тексти з Угариту знають Каптару як землю за морем. Проте Септуагінта і таргуми передали Кафтор як Каппадокію, а вчені обстоювали Кілікію (Дж. А. Вейнрайт), Кіпр (Дж. Стрейндж), егейські острови або Карпатос; мапа показує їх як кандидатів. Певним є егейське походження филистимлян: вони з'являються серед Народів моря, з якими Рамсес III воював близько 1175 р. до н. е., на рельєфах Мединет-Абу, а найдавніша кераміка їхніх міст — місцевий варіант мікенського посуду. Керетяни, «критяни», з Давидової варти вказують у той самий бік."
    - "Крит — сьогодні найбільший острів Еллади, з мінойськими палацами Кносса, Феста й Малії та музеєм в Іракліоні; стаття про Крит веде острів до Нового Заповіту."
  es:
    - "Caftor es la tierra de la que vinieron los filisteos. Amós hace preguntar al Señor si no hizo subir «á los Palestinos de Caphtor, y de Chîr á los Arameos» como hizo salir a Israel de Egipto; Jeremías llama a los filisteos «el resto de la isla de Caphtor», donde la palabra hebrea es «isla» o «costa»; Deuteronomio registra que «los Caftoreos que salieron de Caftor» destruyeron a los aveos que habitaban hasta Gaza y se establecieron en su lugar; y la tabla de las naciones enumera a los caftoreos entre los descendientes de Mizraim, Egipto, junto a los casluitas «de donde salieron los Filisteos»."
    - "La mayoría de los estudiosos identifican Caftor con Creta. Los textos egipcios llaman a la isla Keftiu: enviados de Keftiu con vasijas egeas pintados en tumbas tebanas del siglo XV a. C., y una lista de Amenhotep III en Kom el-Hetan nombra Cnosos, Festos y Cidonia. Las cartas de Mari del siglo XVIII a. C. y los textos de Ugarit conocen Kaptara como tierra al otro lado del mar. La Septuaginta y los targumes, sin embargo, tradujeron Caftor como Capadocia, y se defiende también Cilicia (G. A. Wainwright), Chipre (J. Strange), las islas del Egeo o Cárpatos; el mapa las muestra. Seguro es el origen egeo de los filisteos: aparecen entre los Pueblos del Mar que combatió Ramesés III hacia el 1175 a. C. en los relieves de Medinet Habu, y la cerámica más antigua de sus ciudades es versión local de la micénica. Los cereteos, «cretenses», de la guardia de David apuntan igual."
    - "Creta es hoy la mayor isla de Grecia, con los palacios minoicos de Cnosos, Festos y Malia y el museo de Heraclión; el artículo sobre Creta sigue a la isla hasta el Nuevo Testamento."
  pt:
    - "Caftor é a terra de onde vieram os filisteus. Em Amós, o SENHOR pergunta se não fez subir “os filisteus de Caftor, e os sírios de Quir”, como fez Israel sair do Egito; Jeremias chama os filisteus de “o remanescente da ilha de Caftor”, onde a palavra hebraica significa “ilha” ou “costa”; o Deuteronômio registra que “os caftoreus, que saíram de Caftor” destruíram os aveus que habitavam até Gaza e se estabeleceram no lugar deles; e a tábua das nações lista os caftorins entre os descendentes de Mizraim, o Egito, ao lado dos casluins, “dos quais descenderam os filisteus”."
    - "A maioria dos estudiosos identifica Caftor com Creta. Os textos egípcios chamam a ilha Keftiu: enviados de Keftiu com vasos egeus aparecem pintados em tumbas tebanas do século XV a.C., e uma lista de Amenhotep III em Kom el-Hetan nomeia Cnossos, Festos e Cidônia. As cartas de Mari, do século XVIII a.C., e os textos de Ugarit conhecem Kaptara como uma terra do outro lado do mar. A Septuaginta e os Targuns, porém, traduziram Caftor por Capadócia, e estudiosos defenderam a Cilícia (G. A. Wainwright), Chipre (J. Strange), as ilhas do Egeu ou Cárpatos; o mapa os mostra como candidatos. Certa é a origem egeia dos filisteus: aparecem entre os Povos do Mar que Ramessés III combateu por volta de 1175 a.C. nos relevos de Medinet Habu, e a cerâmica mais antiga de suas cidades é versão local da micênica. Os quereteus, “cretenses”, da guarda de Davi apontam na mesma direção."
    - "Creta é hoje a maior ilha da Grécia, com os palácios minoicos de Cnossos, Festos e Malia e o museu de Heraclião; o artigo sobre Creta acompanha a ilha até o Novo Testamento."
  de:
    - "Kaftor ist das Land, aus dem die Philister kamen. Bei Amos lässt der HERR fragen, ob er nicht „die Philister aus Kaphthor und die Syrer aus Kir“ geführt habe, wie er Israel aus Ägypten führte; Jeremia nennt die Philister „das übrige … aus der Insel Kaphthor“, wo das hebräische Wort „Insel“ oder „Küstenland“ bedeutet; das Deuteronomium berichtet: „Und die Kaphthoriter zogen aus Kaphthor und vertilgten die Avviter, die in Dörfern wohnten bis gen Gaza, und wohnten an ihrer Statt daselbst“; und die Völkertafel führt die Kaftoriter unter den Nachkommen Mizraims, also Ägyptens, auf, neben den Kasluhitern, „von dannen sind gekommen die Philister“."
    - "Die meisten Gelehrten setzen Kaftor mit Kreta gleich. Ägyptische Texte nennen die Insel Keftiu: Gesandte aus Keftiu mit ägäischen Gefäßen sind in thebanischen Gräbern des 15. Jahrhunderts v. Chr. gemalt, und eine Liste Amenophis’ III. in Kom el-Hetan nennt Knossos, Phaistos und Kydonia. Mari-Briefe (18. Jahrhundert v. Chr.) und Ugarit-Texte kennen Kaptara als Land jenseits des Meeres. Septuaginta und Targumim setzten dafür Kappadokien, und Gelehrte vertraten Kilikien (G. A. Wainwright), Zypern (J. Strange), die ägäischen Inseln oder Karpathos; die Karte führt sie als Kandidaten. Sicher ist ihr ägäischer Ursprung: Sie zählen zu den Seevölkern, gegen die Ramses III. um 1175 v. Chr. kämpfte (Reliefs von Medinet Habu), und die älteste Keramik ihrer Städte ist lokal gefertigte mykenische Ware. Die Kereter, „Kreter“, von Davids Leibwache weisen in dieselbe Richtung."
    - "Kreta ist heute die größte Insel Griechenlands, mit den minoischen Palästen von Knossos, Phaistos und Malia und dem Museum in Heraklion; der Artikel über Kreta verfolgt die Insel bis ins Neue Testament."
  fr:
    - "Caphtor est le pays d’où venaient les Philistins. Amos fait demander à l’Éternel s’il n’a pas fait sortir Israël d’Égypte comme « les Philistins de Caphtor et les Syriens de Kir » ; Jérémie appelle les Philistins « les restes de l’île de Caphtor », le mot hébreu signifiant « île » ou « pays côtier » ; le Deutéronome rapporte que « les Caphtorim, sortis de Caphtor » détruisirent les Avviens, qui habitaient jusqu’à Gaza, et s’établirent à leur place ; et la table des peuples range les Caphtorim parmi les descendants de Mitsraïm, l’Égypte, à côté des Casluhim, « d’où sont sortis les Philistins »."
    - "Caphtor est le plus souvent identifiée à la Crète. Les textes égyptiens appellent l’île Keftiu : des envoyés de Keftiu aux vases égéens figurent dans des tombes thébaines du XVe siècle av. J.-C., et une liste d’Amenhotep III à Kom el-Hetan nomme Cnossos, Phaistos et Kydonia. Les lettres de Mari (XVIIIe siècle av. J.-C.) et d’Ougarit connaissent Kaptara comme pays d’outre-mer. La Septante et les targoums traduisirent pourtant Caphtor par Cappadoce, et l’on a proposé la Cilicie (G. A. Wainwright), Chypre (J. Strange), les îles égéennes ou Karpathos ; la carte les retient. Certaine est l’origine égéenne des Philistins : ils figurent parmi les Peuples de la mer que Ramsès III combattit vers 1175 av. J.-C. (reliefs de Médinet Habou), et leur plus ancienne poterie est une copie locale de la céramique mycénienne. Les Kéréthiens, « Crétois », de la garde de David concordent."
    - "La Crète est aujourd’hui la plus grande île de Grèce, avec les palais minoens de Cnossos, de Phaistos et de Malia et le musée d’Héraklion ; l’article sur la Crète suit l’île jusque dans le Nouveau Testament."
