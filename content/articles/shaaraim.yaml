body:
  en:
    - "Shaaraim, “two gates”, was a town of Judah in the Shephelah, listed in the first district of the lowland with Socoh, Azekah, Adithaim and Gederah, and it marks the line of the Philistine rout after David killed Goliath in the valley of Elah: “the wounded of the Philistines fell down by the way to Shaaraim, even unto Gath, and unto Ekron”. A Shaaraim among the towns of Simeon in the far south is a different place. The two passages agree that it lay near the valley of Elah, on the road west toward Gath."
    - "Three sites compete. The older candidate is Khirbet es-Sira, a ruin north-east of Azekah. In 2008 the excavators of Khirbet Qeiyafa, a fortified hilltop town of the late eleventh or tenth century BC on the north side of the valley of Elah opposite Socoh, proposed that it was Shaaraim because its casemate wall has two gates, which is rare; others answered that the second gate is not certain, that the town may have been Canaanite or Philistine rather than Judahite, or that another biblical name fits it better, and the question is open. The map shows Khirbet es-Sira, Khirbet Qeiyafa and the Simeonite Shaaraim as candidates. Khirbet Qeiyafa, excavated from 2007 to 2013, is now an archaeological site in the Judean foothills of Israel beside the Elah valley."
  ru:
    - "Шаараим, «двое ворот», — город Иудеи в Шефеле, перечисленный в первом округе низменности вместе с Сохо, Азекой, Адифаимом и Гедерой; по нему проходит линия бегства филистимлян после того, как Давид убил Голиафа в долине Дуба: «падали поражаемые Филистимляне по дороге Шааримской до Гефа и до Аккарона». Шаараим среди городов Симеона на дальнем юге — другое место. Оба отрывка сходятся в том, что город лежал близ долины Дуба, на дороге на запад к Гефу."
    - "Соперничают три места. Старший кандидат — Хирбет-эс-Сира, руины к северо-востоку от Азеки. В 2008 году исследователи Хирбет-Кейафы — укреплённого городка конца XI или X века до н. э. на холме у северного края долины Дуба напротив Сохо — предположили, что это и есть Шаараим, потому что в его казематной стене двое ворот, что редкость; им возражали, что вторые ворота не бесспорны, что город мог быть ханаанским или филистимским, а не иудейским, или что ему больше подходит другое библейское имя, и вопрос остаётся открытым. На карте кандидатами показаны Хирбет-эс-Сира, Хирбет-Кейафа и симеонов Шаараим. Хирбет-Кейафа, раскопанная в 2007–2013 годах, — ныне археологический памятник в предгорьях Иудеи в Израиле у долины Дуба."
  uk:
    - "Шаараїм, «двоє воріт», був містом Юди в Шефелі, названим у першому окрузі низовини разом із Сохо, Азекою, Адітаїмом і Гедерою, і він позначає лінію розгрому филистимлян після того, як Давид убив Голіата в Долині дуба: «падали побивані Филистії по дорозї Шааримській, до Гета й до Аккарону». Шаараїм серед міст Симеона на далекому півдні — інше місце. Обидва уривки сходяться в тому, що він лежав біля Долини дуба, на дорозі на захід до Гата."
    - "Змагаються три місця. Давніший кандидат — Хірбет-ес-Сіра, руїна на північний схід від Азеки. У 2008 р. розкопувачі Хірбет-Кейяфи, укріпленого міста на вершині пагорба наприкінці XI або в X ст. до н. е. на північній стороні Долини дуба навпроти Сохо, запропонували, що це Шаараїм, бо його казематна стіна має двоє воріт, що рідко трапляється; інші відповіли, що друга брама непевна, що місто могло бути ханаанським чи филистимським, а не юдейським, або що йому краще пасує інша біблійна назва, і питання лишається відкритим. Карта показує Хірбет-ес-Сіру, Хірбет-Кейяфу та симеонівський Шаараїм як кандидатів. Хірбет-Кейяфа, розкопувана з 2007 до 2013 р., нині є археологічним пам'ятником в юдейських передгір'ях Ізраїля біля долини Ела."
  es:
    - "Saaraim, «dos puertas», era una ciudad de Judá en la Sefelá, enumerada en el primer distrito de las tierras bajas con Soco, Azeca, Adhitaim y Gedera, y marca la línea de la derrota filistea después de que David matara a Goliat en el valle de Ela: «Y cayeron heridos de los Filisteos por el camino de Saraim, hasta Gath y Ecrón». Un Saaraim entre las ciudades de Simeón en el extremo sur es un lugar distinto. Ambos pasajes coinciden en que estaba cerca del valle de Ela, en el camino hacia el oeste, hacia Gat."
    - "Compiten tres lugares. El candidato más antiguo es Khirbet es-Sira, unas ruinas al noreste de Azeca. En 2008 los excavadores de Khirbet Qeiyafa, una ciudad fortificada en una cima de finales del siglo XI o del X a. C. en el lado norte del valle de Ela, frente a Soco, propusieron que era Saaraim porque su muralla de casamatas tiene dos puertas, lo que es raro; otros respondieron que la segunda puerta no es segura, que la ciudad pudo ser cananea o filistea más que judaíta, o que otro nombre bíblico le conviene mejor, y la cuestión está abierta. El mapa muestra Khirbet es-Sira, Khirbet Qeiyafa y el Saaraim simeonita como candidatos. Khirbet Qeiyafa, excavada de 2007 a 2013, es hoy un yacimiento arqueológico en las estribaciones de Judea, en Israel, junto al valle de Ela."
  pt:
    - "Saaraim, “dois portões”, era uma cidade de Judá na Sefelá, listada no primeiro distrito da planície com Socó, Azeca, Aditaim e Gedera, e marca a linha da debandada filisteia depois que Davi matou Golias no vale de Elá: “Os filisteus mortos ficaram caídos pelo caminho de Saaraim, até Gate e Ecrom”. Uma Saaraim entre as cidades de Simeão, no extremo sul, é outro lugar. As duas passagens concordam em que ficava perto do vale de Elá, na estrada para oeste em direção a Gate."
    - "Três locais disputam. O candidato mais antigo é Khirbet es-Sira, uma ruína a nordeste de Azeca. Em 2008 os escavadores de Khirbet Qeiyafa, cidade fortificada no alto de uma colina, do fim do século XI ou X a.C., no lado norte do vale de Elá, defronte de Socó, propuseram que fosse Saaraim porque sua muralha casamata tem dois portões, o que é raro; outros responderam que o segundo portão não é certo, que a cidade pode ter sido cananeia ou filisteia e não judaíta, ou que outro nome bíblico lhe convém melhor, e a questão está aberta. O mapa mostra Khirbet es-Sira, Khirbet Qeiyafa e a Saaraim simeonita como candidatas. Khirbet Qeiyafa, escavada de 2007 a 2013, é hoje um sítio arqueológico nas colinas da Judeia, em Israel, junto ao vale de Elá."
  de:
    - "Schaaraim, „zwei Tore“, war eine Stadt Judas in der Schefela, im ersten Bezirk des Tieflands mit Socho, Aseka, Adithajim und Gedera aufgeführt, und markiert die Linie der philistäischen Flucht, nachdem David Goliat im Tal Ela erschlagen hatte: „Und die Philister fielen erschlagen auf dem Wege zu den Toren bis gen Gath und gen Ekron“. Ein Schaaraim unter den Städten Simeons im äußersten Süden ist ein anderer Ort. Die beiden Stellen stimmen überein, dass es nahe dem Tal Ela lag, an der Straße nach Westen Richtung Gat."
    - "Drei Stätten konkurrieren. Der ältere Kandidat ist Chirbet es-Sira, eine Ruine nordöstlich von Aseka. Im Jahr 2008 schlugen die Ausgräber von Chirbet Qeijafa, einer befestigten Hügelstadt des späten 11. oder 10. Jahrhunderts v. Chr. an der Nordseite des Tals Ela gegenüber von Socho, vor, es sei Schaaraim, weil ihre Kasemattenmauer zwei Tore hat, was selten ist; andere entgegneten, das zweite Tor sei nicht sicher, die Stadt könne kanaanäisch oder philistäisch statt judäisch gewesen sein, oder ein anderer biblischer Name passe besser, und die Frage ist offen. Die Karte zeigt Chirbet es-Sira, Chirbet Qeijafa und das simeonitische Schaaraim als Kandidaten. Chirbet Qeijafa, von 2007 bis 2013 ausgegraben, ist heute eine archäologische Stätte im judäischen Vorland Israels neben dem Elatal."
  fr:
    - "Schaaraïm, « deux portes », était une ville de Juda dans la Shéphéla, citée dans le premier district de la plaine avec Soco, Azéka, Adithaïm et Guédéra, et elle marque la ligne de la déroute philistine après que David eut tué Goliath dans la vallée d’Éla : « Les Philistins blessés à mort tombèrent dans le chemin de Schaaraïm jusqu’à Gath et jusqu’à Ékron ». Une Schaaraïm parmi les villes de Siméon dans l’extrême sud est un autre lieu. Les deux passages s’accordent à la situer près de la vallée d’Éla, sur la route de l’ouest vers Gath."
    - "Trois sites se disputent. Le candidat le plus ancien est Khirbet es-Sira, une ruine au nord-est d’Azéka. En 2008, les fouilleurs de Khirbet Qeiyafa, ville fortifiée sur une colline de la fin du XIe ou du Xe siècle av. J.-C., au nord de la vallée d’Éla en face de Soco, proposèrent que ce fût Schaaraïm parce que son mur à casemates a deux portes, ce qui est rare ; d’autres répondirent que la seconde porte n’est pas sûre, que la ville pouvait être cananéenne ou philistine plutôt que judéenne, ou qu’un autre nom biblique lui convient mieux, et la question est ouverte. La carte montre Khirbet es-Sira, Khirbet Qeiyafa et la Schaaraïm de Siméon comme candidats. Khirbet Qeiyafa, fouillée de 2007 à 2013, est aujourd’hui un site archéologique des contreforts de Judée, en Israël, à côté de la vallée d’Éla."
  it:
    - "Saaraim, «due porte», era una città di Giuda nella Sefela, elencata nel primo distretto della pianura con Soco, Azeka, Aditaim e Gedera, e segna la linea della rotta filistea dopo che Davide uccise Golia nella valle di Ela: «I Filistei feriti a morte caddero sulla via di Shaaraim, fino a Gath e fino ad Ekron». Una Saaraim tra le città di Simeone nell’estremo sud è un luogo diverso. I due passi concordano che si trovasse vicino alla valle di Ela, sulla strada verso ovest in direzione di Gat."
    - "Tre siti si contendono il nome. Il candidato più antico è Khirbet es-Sira, una rovina a nord-est di Azeka. Nel 2008 gli scavatori di Khirbet Qeiyafa, una città fortificata su un’altura della fine dell’XI o del X secolo a.C. sul lato nord della valle di Ela di fronte a Soco, proposero che fosse Saaraim perché le sue mura a casematte hanno due porte, il che è raro; altri hanno risposto che la seconda porta non è certa, che la città può essere stata cananea o filistea piuttosto che giudaita, o che un altro nome biblico le si adatta meglio, e la questione è aperta. La mappa mostra Khirbet es-Sira, Khirbet Qeiyafa e la Saaraim di Simeone come candidati. Khirbet Qeiyafa, scavata dal 2007 al 2013, è oggi un sito archeologico nelle pendici della Giudea in Israele, accanto alla valle di Ela."
  pl:
    - "Szaaraim, „dwie bramy”, było miastem Judy w Szefeli, wymienionym w pierwszym okręgu niziny z Soko, Azeką, Adytaim i Gedera, i wyznacza linię klęski Filistynów po zabiciu Goliata w dolinie Ela: „padali ranni Filistynowie po drodze Saraim aż do Get i aż do Akkaronu”. Szaaraim wśród miast Symeona na dalekim południu to inne miejsce. Oba fragmenty zgadzają się, że leżało blisko doliny Ela, na drodze na zachód ku Gat."
    - "Trzy stanowiska rywalizują. Starszym kandydatem jest Chirbet es-Sira, ruina na północny wschód od Azeki. W 2008 roku badacze Chirbet Qejafa, obwarowanego miasta na wzgórzu z końca XI lub X wieku p.n.e. po północnej stronie doliny Ela naprzeciw Soko, zaproponowali, że to Szaaraim, ponieważ jego mur kazamatowy ma dwie bramy, co jest rzadkie; inni odpowiedzieli, że druga brama nie jest pewna, że miasto mogło być kananejskie lub filistyńskie, a nie judzkie, albo że lepiej pasuje do niego inna biblijna nazwa, i pytanie pozostaje otwarte. Mapa pokazuje Chirbet es-Sira, Chirbet Qejafa i symeonickie Szaaraim jako kandydatów. Chirbet Qejafa, badane w latach 2007–2013, jest dziś stanowiskiem archeologicznym w judzkim podgórzu w Izraelu, obok doliny Ela."
  cs:
    - "Šaarajim, „dvě brány“, bylo město Judy v Šefele, uvedené v prvním okrese nížiny se Sókó, Azekou, Aditajimem a Gederou, a označuje linii pelištejského útěku poté, co David zabil Goliáše v údolí Éla: „I padali, raněni jsouce, Filistinští po cestě k Saraim, až do Gát a až do Akaron“. Šaarajim mezi městy Simeonovými na dalekém jihu je jiné místo. Obě pasáže se shodují, že leželo poblíž údolí Éla, na cestě na západ ke Gatu."
    - "Soupeří tři místa. Starším kandidátem je Chirbet es-Síra, ruina severovýchodně od Azeky. Roku 2008 vykopávači Chirbet Qejafa, opevněného města na pahorku z pozdního 11. či 10. století př. n. l. na severní straně údolí Éla naproti Sókó, navrhli, že jde o Šaarajim, protože jeho kazematová hradba má dvě brány, což je vzácné; jiní odpověděli, že druhá brána není jistá, že město mohlo být spíše kenaanské či pelištejské než judské, nebo že mu lépe vyhovuje jiné biblické jméno, a otázka je otevřená. Mapa ukazuje jako kandidáty Chirbet es-Síra, Chirbet Qejafa a simeonské Šaarajim. Chirbet Qejafa, kopaná v letech 2007 až 2013, je dnes archeologická lokalita v judském podhůří Izraele vedle údolí Éla."
  nl:
    - "Saäraïm, “twee poorten”, was een stad van Juda in de Sefela, vermeld in het eerste district van het laagland met Socho, Azeka, Adithaïm en Gedera, en het markeert de lijn van de Filistijnse vlucht nadat David Goliat in de vallei van Ela had gedood: “de verwonden der Filistijnen vielen op den weg van Saaraim, en tot aan Gath, en tot aan Ekron”. Een Saäraïm onder de steden van Simeon in het uiterste zuiden is een andere plaats. De twee passages zijn het erover eens dat het dicht bij de vallei van Ela lag, aan de weg naar het westen richting Gat."
    - "Drie plaatsen strijden erom. De oudere kandidaat is Khirbet es-Sira, een ruïne ten noordoosten van Azeka. In 2008 stelden de opgravers van Khirbet Qeiyafa, een versterkte heuveltop-stad uit de late 11e of 10e eeuw v.Chr. aan de noordkant van de vallei van Ela tegenover Socho, voor dat het Saäraïm was, omdat haar kazemattenmuur twee poorten heeft, wat zeldzaam is; anderen antwoordden dat de tweede poort niet zeker is, dat de stad Kanaänitisch of Filistijns in plaats van Judees kan zijn geweest, of dat een andere bijbelse naam beter past, en de kwestie is open. De kaart toont Khirbet es-Sira, Khirbet Qeiyafa en het Saäraïm van Simeon als kandidaten. Khirbet Qeiyafa, opgegraven van 2007 tot 2013, is nu een archeologische plaats in de Judese voorheuvels van Israël naast de vallei van Ela."
  sv:
    - "Shaarajim, ”två portar”, var en stad i Juda i Shefela, förtecknad i låglandets första distrikt med Soko, Aseka, Aditajim och Gedera, och den markerar linjen för filistéernas flykt efter att David dödat Goljat i Elaldalen: ”filistéer föllo och lågo slagna på vägen till Saaraim, och sedan ända till Gat och ända till Ekron”. Ett Shaarajim bland Simeons städer längst i söder är en annan plats. De två ställena är överens om att det låg nära Elaldalen, på vägen västerut mot Gat."
    - "Tre platser tävlar. Den äldre kandidaten är Khirbet es-Sira, en ruin nordost om Aseka. År 2008 föreslog utgrävarna av Khirbet Qeiyafa, en befäst kullstad från slutet av 1000-talet eller 900-talet f.Kr. på norra sidan av Elaldalen mitt emot Soko, att det var Shaarajim eftersom dess kasemattmur har två portar, vilket är ovanligt; andra svarade att den andra porten inte är säker, att staden kan ha varit kananeisk eller filisteisk snarare än judeisk, eller att ett annat bibliskt namn passar den bättre, och frågan är öppen. Kartan visar Khirbet es-Sira, Khirbet Qeiyafa och det simeonitiska Shaarajim som kandidater. Khirbet Qeiyafa, utgrävd 2007 till 2013, är nu en arkeologisk plats i Judeiska förbergen i Israel bredvid Elaldalen."
  nb:
    - "Sjaarajim, «to porter», var en by i Juda i Sjefela, oppført i det første distriktet i lavlandet sammen med Soko, Aseka, Aditajim og Gedera, og den markerer linjen for filisternes flukt etter at David drepte Goliat i Ela-dalen: «det lå falne filistrer på veien til Sa'ara'im og helt frem til Gat og til Ekron». Et Sjaarajim blant Simeons byer langt i sør er et annet sted. De to tekstene er enige om at det lå nær Ela-dalen, på veien vest mot Gat."
    - "Tre steder konkurrerer. Den eldre kandidaten er Khirbet es-Sira, en ruin nordøst for Aseka. I 2008 foreslo utgraverne av Khirbet Qeiyafa, en befestet høydeby fra sent på 1000-tallet eller på 900-tallet f.Kr. på nordsiden av Ela-dalen overfor Soko, at det var Sjaarajim fordi kasemattmuren har to porter, noe som er sjeldent; andre svarte at den andre porten ikke er sikker, at byen kan ha vært kanaanittisk eller filistersk snarere enn judeisk, eller at et annet bibelsk navn passer bedre, og spørsmålet er åpent. Kartet viser Khirbet es-Sira, Khirbet Qeiyafa og Simeons Sjaarajim som kandidater. Khirbet Qeiyafa, utgravd fra 2007 til 2013, er nå et arkeologisk sted i de judeiske forbakkene i Israel ved Ela-dalen."
  tl:
    - "Ang Saaraim, “dalawang pintuang-bayan”, ay bayan ng Juda sa Sephela, nakalista sa unang distrito ng mababang lupain kasama ng Socho, Azeca, Adithaim at Gedera, at ito ang nagmamarka sa linya ng pagkatalo ng mga Filisteo matapos patayin ni David si Goliath sa libis ng Ela: “ang mga sugatan sa mga Filisteo ay nabuwal sa daang patungo sa Saraim, hanggang sa Gath, at sa Ecron”. Ang isang Saaraim sa mga bayan ni Simeon sa dulong timog ay ibang lugar. Sumasang-ayon ang dalawang talata na nasa malapit ito sa libis ng Ela, sa daang pakanluran patungong Gath."
    - "Tatlong lugar ang nagpapaligsahan. Ang mas lumang kandidato ay ang Khirbet es-Sira, isang guho sa hilagang-silangan ng Azeca. Noong 2008, iminungkahi ng mga naghukay ng Khirbet Qeiyafa, isang bayang may kuta sa burol noong huling bahagi ng ika-11 o ika-10 siglo BK sa hilagang panig ng libis ng Ela sa tapat ng Socho, na ito ang Saaraim sapagkat ang pader nitong casemate ay may dalawang pintuang-bayan, na bihira; sumagot ang iba na hindi tiyak ang ikalawang pintuan, na ang bayan ay maaaring Cananeo o Filisteo sa halip na Judahita, o na mas akma rito ang ibang pangalan sa Bibliya, at bukás ang tanong. Ipinapakita ng mapa ang Khirbet es-Sira, Khirbet Qeiyafa at ang Saaraim ni Simeon bilang mga kandidato. Ang Khirbet Qeiyafa, hinukay mula 2007 hanggang 2013, ay isa na ngayong lugar arkeolohikal sa paanan ng Judea sa Israel sa tabi ng libis ng Ela."
  da:
    - "Sja'arajim, »to porte«, var en by i Juda i Sjefela, opregnet i lavlandets første distrikt sammen med Soko, Azeka, Aditajim og Gedera, og den markerer linjen for filistrenes flugt, efter at David havde dræbt Goliat i Ela-dalen: »Filisterne, som bleve ihjelslagne, faldt paa Vejen til Saarajim og indtil Gath og indtil Ekron«. Et Sja'arajim blandt Simeons byer i det yderste syd er et andet sted. De to steder er enige om, at det lå nær Ela-dalen, på vejen mod vest til Gat."
    - "Tre steder konkurrerer. Den ældre kandidat er Khirbet es-Sira, en ruin nordøst for Azeka. I 2008 foreslog udgraverne af Khirbet Qeiyafa, en befæstet bakkeby fra slutningen af 1000-tallet eller 900-tallet f.Kr. på nordsiden af Ela-dalen over for Soko, at det var Sja'arajim, fordi dens kasematmur har to porte, hvilket er sjældent; andre svarede, at den anden port ikke er sikker, at byen kan have været kana'anæisk eller filistæisk snarere end judæisk, eller at et andet bibelsk navn passer bedre, og spørgsmålet er åbent. Kortet viser Khirbet es-Sira, Khirbet Qeiyafa og Simeons Sja'arajim som kandidater. Khirbet Qeiyafa, udgravet fra 2007 til 2013, er nu et arkæologisk sted i Judæas forbjerge i Israel ved siden af Ela-dalen."
  sr:
    - "Сараим, „двоја врата“, био је град Јудин у Сефели, наведен у првом округу низије с Сохотом, Азиком, Адитајимом и Гедиром, и означава линију филистејског бекства пошто је Давид убио Голијата у долини Ила: „падаше побијени Филистеји по путу сарајимском до Гата и до Акарона“. Сараим међу градовима Симеуновим на далеком југу је друго место. Оба одломка се слажу да је лежао близу долине Ила, на путу на запад према Гату."
    - "Три налазишта се надмећу. Старији кандидат је Хирбет ес-Сира, рушевина североисточно од Азике. Године 2008. ископавачи Хирбет Кејафе, утврђеног града на врху брда из касног 11. или 10. века п. н. е. на северној страни долине Ила насупрот Сохоту, предложили су да је то Сараим јер његов касематни зид има двоје врата, што је ретко; други су одговорили да друга капија није сигурна, да је град могао бити ханаански или филистејски а не јудејски, или да му боље одговара друго библијско име, и питање је отворено. Карта приказује Хирбет ес-Сиру, Хирбет Кејафу и симеунски Сараим као кандидате. Хирбет Кејафа, ископавана од 2007. до 2013, сада је археолошко налазиште у јудејском подгорју Израела поред долине Ила."
