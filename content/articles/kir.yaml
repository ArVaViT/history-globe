# Overview article (ADR 0007). Mainstream facts only; the site is unknown and the article says so; the candidates are given without choosing.
id: kir
place: ab92800
title:
  en: "Kir"
  ru: "Кир"
  uk: "Кір"
  es: "Kir"
  pt: "Quir"
  de: "Kir"
  fr: "Kir"
body:
  en:
    - "Kir is a land or city of the Aramaeans whose site nobody knows. The Bible names it four times, three of them in connection with Syria. Amos says the LORD brought “the Syrians from Kir” as he brought Israel out of Egypt and the Philistines from Caphtor; the same prophet threatens that “the people of Syria shall go into captivity unto Kir”. The threat came true in 732 BC: when Ahaz of Judah bought the help of Tiglath-pileser III against Rezin of Damascus, the Assyrian king took Damascus, “carried the people of it captive to Kir, and slew Rezin”. Isaiah, foreseeing an army before Jerusalem, says that “Elam bare the quiver” and “Kir uncovered the shield”, as if the men of Kir were serving as Assyrian troops."
    - "The Hebrew word qir means “wall”, which has not helped to find the place. The Greek translators did not know it: in Amos 9:7 they wrote that the Syrians came “from the pit”, and Jerome's Latin Bible turned the name into Cyrene. Tiglath-pileser's own inscriptions for the campaign against Damascus are broken and do not say where he sent the captives. Since Isaiah pairs Kir with Elam, many look for it in the east, on the Assyrian border with Elam, and the first candidate on the map is Der (modern Badrah) beyond the Tigris; others have proposed the land of Koa named by Ezekiel, the Amuk valley or Emar (Tell Meskene) on the Euphrates in the old Aramaean country, Elam itself, or, following an old guess from the name of the river Cyrus, the valley of the Kura in the Caucasus. None of these rests on more than a resemblance of names, and the question is open."
    - "Nothing of Kir can be visited, because nothing has been identified. What the four verses do show is the Assyrian practice of deporting a conquered people far from home, which Israel itself would meet ten years later when Samaria fell."
  ru:
    - "Кир — земля или город Арамеев, местоположение которого никому не известно. Библия называет его четыре раза, из них трижды в связи с Сирией. Амос говорит, что Господь вывел Арамлян «из Кира», как вывел Израиля из Египта, а Филистимлян из Кафтора; тот же пророк грозит, что «пойдет народ Арамейский в плен в Кир». Угроза исполнилась в 732 г. до н. э.: когда Ахаз Иудейский купил помощь Феглаффелласара III против Рецина Дамасского, царь Ассирийский взял Дамаск, «переселил жителей его в Кир, а Рецина умертвил». Исаия, провидя войско под Иерусалимом, говорит: «Елам несет колчан», а «Кир обнажает щит», словно люди из Кира служили в ассирийских отрядах."
    - "Еврейское слово «кир» значит «стена», и это не помогло найти место. Греческие переводчики его не знали: в Амосе 9:7 они написали, что Арамляне пришли «из рва», а латинская Библия Иеронима превратила имя в Кирену. Собственные надписи Феглаффелласара о походе на Дамаск разбиты и не говорят, куда он отправил пленных. Поскольку Исаия ставит Кир рядом с Еламом, многие ищут его на востоке, на ассирийской границе с Еламом, и первый кандидат на карте — Дер (нынешняя Бадра) за Тигром; другие предлагали землю Коа, названную Иезекиилем, долину Амик или Емар (Телль-Мескене) на Евфрате в старой арамейской стране, сам Елам или, по старой догадке от имени реки Кир (Кура), её долину на Кавказе. Ни одно из этих предложений не держится ни на чём, кроме сходства имён, и вопрос открыт."
    - "Посетить Кир нельзя, потому что ничего не найдено. Зато четыре стиха показывают ассирийский обычай переселять покорённый народ далеко от дома, с которым сам Израиль столкнётся десять лет спустя, при падении Самарии."
  uk:
    - "Кір — країна або місто арамеїв, місце якого ніхто не знає. Біблія називає його чотири рази, з них три — у зв’язку з Сирією. Амос каже, що Господь вивів «а Араміїв — із Киру», як вивів Ізраїля з Єгипту, а філістимлян з Кафтору; той самий пророк грозить, що «ввесь люд Арамійський пійде в полонь у Кирену». Загроза справдилася 732 р. до н. е.: коли Ахаз Юдейський купив допомогу Тіглатпаласара III проти Ріцина Дамаського, ассирійський цар узяв Дамаск, «одвів осадників його в Кир, а Резина вбив». Ісая, бачачи військо перед Єрусалимом, каже: «Несе Елам сагайдак» і «Кир щитом заблищав», наче люди Киру служили ассирійськими воїнами."
    - "Староєврейське слово кір означає «мур», що не допомогло знайти це місце. Грецькі перекладачі його не знали: в Амоса 9:7 вони написали, що сирійці прийшли «з ями», а латинська Біблія Ієроніма перетворила назву на Кирену. Власні написи Тіглатпаласара про похід на Дамаск пошкоджені й не кажуть, куди він послав полонених. Оскільки Ісая ставить Кір поруч з Еламом, багато хто шукає його на сході, на ассирійському кордоні з Еламом, і першим кандидатом на мапі є Дер (сучасна Бадра) за Тигром; інші пропонували країну Коа, названу Єзекіїлем, долину Амук або Емар (Телль-Мескене) на Євфраті в давній арамейській країні, сам Елам або, за давньою здогадкою з назви ріки Кір, долину Кури на Кавказі. Жодна з цих пропозицій не спирається на більше, ніж схожість назв, і питання відкрите."
    - "З Киру нічого не можна відвідати, бо нічого не ототожнено. Те, що ці чотири вірші таки показують, — це ассирійська практика переселяти підкорений народ далеко від дому, з якою сам Ізраїль зіткнувся десять років потому, коли впала Самарія."
  es:
    - "Kir es una tierra o ciudad de los arameos cuyo emplazamiento nadie conoce. La Biblia la nombra cuatro veces, tres de ellas en relación con Siria. Amós dice que Jehová hizo subir a Israel de Egipto, a los filisteos de Caftor y «de Chîr á los Arameos»; el mismo profeta amenaza con que «el pueblo de Aram será trasportado á Chîr». La amenaza se cumplió en 732 a. C.: cuando Acaz de Judá compró la ayuda de Tiglat-pileser III contra Rezín de Damasco, el rey asirio tomó Damasco, «trasportó los moradores á Kir, y mató á Resín». Isaías, al prever un ejército ante Jerusalén, dice que «Elam tomó aljaba» y que «Chîr descubrió escudo», como si los hombres de Kir sirvieran de tropas asirias."
    - "La palabra hebrea qir significa «muro», lo que no ayuda a hallar el lugar. Los traductores griegos no lo conocían: en Amós 9:7 escribieron que los sirios vinieron «de la fosa», y la Biblia latina de Jerónimo convirtió el nombre en Cirene. Las inscripciones de Tiglat-pileser sobre la campaña contra Damasco están rotas y no dicen adónde envió a los cautivos. Como Isaías empareja Kir con Elam, muchos la buscan en el este, en la frontera asiria con Elam, y el primer candidato del mapa es Der (la actual Badrah), al otro lado del Tigris; otros proponen la tierra de Coa nombrada por Ezequiel, el valle del Amuq o Emar (Tell Meskene), en el Éufrates, en el antiguo país arameo, la propia Elam o, por una vieja conjetura basada en el nombre del río Ciro, el valle del Kura, en el Cáucaso. Ninguna se apoya en más que un parecido de nombres, y la cuestión sigue abierta."
    - "De Kir no se puede visitar nada, porque nada ha sido identificado. Lo que sí muestran los cuatro versículos es la práctica asiria de deportar a un pueblo conquistado lejos de su hogar, que el propio Israel conocería diez años después, cuando cayó Samaria."
  pt:
    - "Quir é uma terra ou cidade dos arameus cujo sítio ninguém conhece. A Bíblia a nomeia quatro vezes, três delas em ligação com a Síria. Amós diz que o SENHOR trouxe “os sírios de Quir” como fez Israel subir do Egito e os filisteus de Caftor; o mesmo profeta ameaça que “o povo da Síria irá em cativeiro para Quir”. A ameaça se cumpriu em 732 a.C.: quando Acaz de Judá comprou a ajuda de Tiglate-Pileser III contra Rezim de Damasco, o rei assírio tomou Damasco, “levou seu povo cativo para Quir, e matou Rezim”. Isaías, prevendo um exército diante de Jerusalém, diz que “Elão pegou a sua aljava” e “Quir descobriu o escudo”, como se os homens de Quir servissem como tropas assírias."
    - "A palavra hebraica qir significa “muro”, o que não ajudou a achar o lugar. Os tradutores gregos não a conheciam: em Amós 9:7 escreveram que os sírios vieram “da cova”, e a Bíblia latina de Jerônimo converteu o nome em Cirene. As próprias inscrições de Tiglate-Pileser sobre a campanha contra Damasco estão quebradas e não dizem para onde enviou os cativos. Como Isaías põe Quir ao lado de Elão, muitos a procuram no leste, na fronteira assíria com Elão, e o primeiro candidato no mapa é Der (a atual Badra), além do Tigre; outros propuseram a terra de Coa, citada por Ezequiel, o vale de Amuq ou Emar (Tell Meskene), no Eufrates, na antiga terra dos arameus, o próprio Elão ou, seguindo uma antiga conjectura a partir do nome do rio Ciro, o vale do Kura, no Cáucaso. Nenhuma dessas hipóteses repousa em mais do que a semelhança dos nomes, e a questão está em aberto."
    - "Nada de Quir pode ser visitado, porque nada foi identificado. O que os quatro versículos mostram é a prática assíria de deportar um povo conquistado para longe de casa, a qual o próprio Israel enfrentaria dez anos depois, quando Samaria caiu."
  de:
    - "Kir ist ein Land oder eine Stadt der Aramäer, deren Lage niemand kennt. Die Bibel nennt es viermal, dreimal im Zusammenhang mit Syrien. Nach Amos hat der HERR, wie er Israel aus Ägypten und die Philister aus Kaftor führte, auch „die Syrer aus Kir“ geführt; derselbe Prophet droht, „das Volk in Syrien soll gen Kir weggeführt werden“. Die Drohung erfüllte sich 732 v. Chr.: Als Ahas von Juda sich die Hilfe Tiglat-Pilesers III. gegen Rezin von Damaskus erkaufte, gewann der assyrische König Damaskus, „führte es weg gen Kir und tötete Rezin“. Jesaja, der ein Heer vor Jerusalem voraussieht, sagt: „Elam fährt daher mit Köcher“ und „Kir glänzt daher mit Schilden“, als dienten die Männer von Kir als assyrische Truppen."
    - "Das hebräische Wort qir bedeutet „Mauer“, was bei der Suche nach dem Ort nicht geholfen hat. Die griechischen Übersetzer kannten es nicht: In Amos 9,7 schrieben sie, die Syrer kämen aus der Grube, und die lateinische Bibel des Hieronymus machte den Namen zu Kyrene. Tiglat-Pilesers eigene Inschriften zum Feldzug gegen Damaskus sind zerbrochen und sagen nicht, wohin er die Gefangenen schickte. Da Jesaja Kir mit Elam paart, sucht man es vielfach im Osten, an der assyrischen Grenze zu Elam; der erste Kandidat auf der Karte ist Der (heute Badrah) jenseits des Tigris. Andere schlugen das von Hesekiel genannte Land Koa, das Amuk-Tal oder Emar (Tell Meskene) am Euphrat, Elam selbst oder, einer alten Vermutung nach dem Flussnamen Kyros folgend, das Tal der Kura im Kaukasus vor. Nichts davon beruht auf mehr als einer Namensähnlichkeit; die Frage ist offen."
    - "Von Kir lässt sich nichts besuchen, weil nichts bestimmt wurde. Was die vier Verse zeigen, ist die assyrische Praxis, ein besiegtes Volk weit von der Heimat zu deportieren, der Israel selbst zehn Jahre später begegnen sollte, als Samaria fiel."
  fr:
    - "Kir est un pays ou une ville des Araméens dont nul ne connaît l’emplacement. La Bible le nomme quatre fois, dont trois à propos de la Syrie. Amos dit que l’Éternel a fait sortir « les Syriens de Kir » comme il a fait sortir Israël d’Égypte et les Philistins de Caphtor ; le même prophète menace : « le peuple de Syrie sera mené captif à Kir ». La menace s’accomplit en 732 av. J.-C. : lorsque Achaz de Juda acheta l’aide de Tiglath-Piléser III contre Retsin de Damas, le roi d’Assyrie prit Damas, « emmena les habitants en captivité à Kir, et fit mourir Retsin ». Ésaïe, prévoyant une armée devant Jérusalem, dit qu’« Élam porte le carquois » et que « Kir met à nu le bouclier », comme si les hommes de Kir servaient dans les troupes assyriennes."
    - "Le mot hébreu qir signifie « mur », ce qui n’aide guère à trouver le lieu. Les traducteurs grecs ne le connaissaient pas : en Amos 9:7, ils ont écrit que les Syriens venaient de la fosse, et la Bible latine de Jérôme en a fait Cyrène. Les inscriptions de Tiglath-Piléser sur la campagne contre Damas sont brisées et ne disent pas où il envoya les captifs. Ésaïe associant Kir à Élam, beaucoup le cherchent à l’est, à la frontière assyrienne avec Élam, et le premier candidat sur la carte est Der (l’actuelle Badrah), au-delà du Tigre ; d’autres proposent le pays de Koa nommé par Ézéchiel, la plaine de l’Amouq ou Émar (Tell Meskéné) sur l’Euphrate, dans l’ancien pays araméen, l’Élam lui-même ou, selon une vieille conjecture fondée sur le nom du fleuve Cyrus, la vallée de la Koura dans le Caucase. Aucune ne repose sur plus qu’une ressemblance de noms ; la question reste ouverte."
    - "Rien de Kir ne peut se visiter, car rien n’a été identifié. Ce que montrent en revanche les quatre versets, c’est la pratique assyrienne de déporter un peuple vaincu loin de chez lui, qu’Israël allait connaître lui-même dix ans plus tard à la chute de Samarie."
