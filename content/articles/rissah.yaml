# Overview article (ADR 0007). Mainstream facts only; a wilderness station known only from the itinerary of Numbers 33; nothing is known of it, and the article says so.
id: rissah
place: af04ad9
title:
  en: "Rissah"
  ru: "Рисса"
body:
  en:
    - "Rissah is a camp of Israel in the wilderness named only in the itinerary of Numbers 33, between Libnah and Kehelathah: “And they removed from Libnah, and pitched at Rissah. And they journeyed from Rissah, and pitched in Kehelathah.” Like its neighbours in the list, it appears nowhere else in the Bible, and nothing is told of what happened there."
    - "Its site is unknown. The map gives two proposals: Sharma, on the Red Sea coast of north-western Arabia, where those who place Sinai in Midian draw the route, and Kuntillet el-Jerafi in the eastern Sinai near the Negev border, on the more usual line of the march. Neither has more than the route to support it."
  ru:
    - "Рисса — стан Израиля в пустыне, названный только в перечне 33-й главы книги Чисел, между Ливной и Кегелафой: «И отправились из Ливны и расположились станом в Риссе. И отправились из Риссы и расположились станом в Кегелафе». Как и соседние станы перечня, она больше нигде в Библии не упоминается, и ничего о том, что там произошло, не сказано."
    - "Местоположение неизвестно. На карте даны два предположения: Шарма на побережье Красного моря на северо-западе Аравии, где проводят путь те, кто помещает Синай в Мадиаме, и Кунтилет-эль-Джерафи на востоке Синая у границы Негева, на более привычной линии похода. Ни у одного нет иной опоры, кроме самого маршрута."
scripture:
  - Num.33.21-Num.33.22
sources:
  - "G. I. Davies, The Way of the Wilderness: A Geographical Study of the Wilderness Itineraries in the Old Testament (1979)"
  - "B. A. Levine, Numbers 21-36 (Anchor Bible, 2000)"
  - "M. Noth, Numbers: A Commentary (Old Testament Library, 1968)"
