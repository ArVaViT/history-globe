body:
  en:
    - "Rissah is a camp of Israel in the wilderness named only in the itinerary of Numbers 33, between Libnah and Kehelathah: “And they removed from Libnah, and pitched at Rissah. And they journeyed from Rissah, and pitched in Kehelathah.” Like its neighbours in the list, it appears nowhere else in the Bible, and nothing is told of what happened there."
    - "Its site is unknown. The map gives two proposals: Sharma, on the Red Sea coast of north-western Arabia, where those who place Sinai in Midian draw the route, and Kuntillet el-Jerafi in the eastern Sinai near the Negev border, on the more usual line of the march. Neither has more than the route to support it."
  ru:
    - "Рисса — стан Израиля в пустыне, названный только в перечне 33-й главы книги Чисел, между Ливной и Кегелафой: «И отправились из Ливны и расположились станом в Риссе. И отправились из Риссы и расположились станом в Кегелафе». Как и соседние станы перечня, она больше нигде в Библии не упоминается, и ничего о том, что там произошло, не сказано."
    - "Местоположение неизвестно. На карте даны два предположения: Шарма на побережье Красного моря на северо-западе Аравии, где проводят путь те, кто помещает Синай в Мадиаме, и Кунтилет-эль-Джерафи на востоке Синая у границы Негева, на более привычной линии похода. Ни у одного нет иной опоры, кроме самого маршрута."
  uk:
    - "Рісса — табір Ізраїлю в пустині, згаданий лише в маршруті Чисел 33, між Лівною та Кегелатою: «І рушили з Либни та отаборились у Риссї. І рушили з Рисси та й отаборились у Кегелатї.» Як і її сусіди в переліку, вона більше ніде в Біблії не з’являється, і про те, що там сталося, нічого не сказано."
    - "Її розташування невідоме. Карта подає дві пропозиції: Шарма на узбережжі Червоного моря північно-західної Аравії, де креслять маршрут ті, хто поміщає Синай у Мадіамі, та Кунтіллет-ель-Джерафі на сході Синаю біля кордону Негева, на звичнішій лінії походу. Жодна з них не має, окрім маршруту, нічого, що її підтримувало б."
  es:
    - "Rissa es un campamento de Israel en el desierto nombrado solo en el itinerario de Números 33, entre Libna y Ceelata: «Y partidos de Libna, asentaron en Rissa. Y partidos de Rissa, asentaron en Ceelatha». Como sus vecinos en la lista, no aparece en ningún otro lugar de la Biblia, y no se cuenta nada de lo que allí sucedió."
    - "Su emplazamiento se desconoce. El mapa da dos propuestas: Sharma, en la costa del mar Rojo del noroeste de Arabia, por donde trazan la ruta quienes sitúan el Sinaí en Madián, y Kuntillet el-Jerafi, en el Sinaí oriental cerca de la frontera del Néguev, en la línea más habitual de la marcha. Ninguna tiene más apoyo que la ruta."
  pt:
    - "Rissa é um acampamento de Israel no deserto citado apenas no itinerário de Números 33, entre Libna e Queelata: “Partiram de Libna e acamparam em Rissa. Partiram de Rissa e acamparam em Queelata.” Como suas vizinhas na lista, não aparece em nenhum outro lugar da Bíblia, e nada se conta do que ali aconteceu."
    - "Seu local é desconhecido. O mapa dá duas propostas: Sharma, na costa do Mar Vermelho do noroeste da Arábia, onde os que situam o Sinai em Midiã traçam a rota, e Kuntillet el-Jerafi, no leste do Sinai, perto da fronteira do Neguebe, na linha mais habitual da marcha. Nenhuma tem mais que a rota em seu favor."
  de:
    - "Rissa ist ein Lager Israels in der Wüste, nur in der Stationenliste von Numeri 33 zwischen Libna und Kehelata genannt: „Von Libna zogen sie aus und lagerten sich in Rissa. Von Rissa zogen sie aus und lagerten sich in Kehelatha.“ Wie seine Nachbarn in der Liste kommt es sonst nirgends in der Bibel vor, und nichts wird darüber erzählt, was dort geschah."
    - "Seine Lage ist unbekannt. Die Karte nennt zwei Vorschläge: Scharma an der Rotmeerküste im Nordwesten Arabiens, wo jene die Route ziehen, die den Sinai in Midian ansetzen, und Kuntillet el-Jerafi im östlichen Sinai an der Grenze zum Negev, auf der üblicheren Marschlinie. Keiner hat mehr als die Route als Stütze."
  fr:
    - "Rissa est un campement d’Israël dans le désert, nommé seulement dans l’itinéraire de Nombres 33, entre Libna et Kehélatha : « Ils partirent de Libna, et campèrent à Rissa. Ils partirent de Rissa, et campèrent à Kehélatha. » Comme ses voisins de la liste, elle n’apparaît nulle part ailleurs dans la Bible, et rien n’est dit de ce qui s’y passa."
    - "Son site est inconnu. La carte donne deux propositions : Sharma, sur la côte de la mer Rouge du nord-ouest de l’Arabie, où ceux qui placent le Sinaï en Madian tracent la route, et Kuntillet el-Jerafi dans l’est du Sinaï près de la frontière du Négev, sur le tracé plus habituel de la marche. Ni l’une ni l’autre n’a plus que la route pour appui."
  it:
    - "Rissa è un accampamento di Israele nel deserto nominato solo nell’itinerario di Numeri 33, tra Libna e Keelata: «Partirono da Libna e si accamparono a Rissa. Partirono da Rissa e si accamparono a Kehelatha.» Come i suoi vicini nell’elenco, non compare in nessun altro punto della Bibbia, e nulla si dice di ciò che vi accadde."
    - "Il suo sito è ignoto. La mappa dà due proposte: Sharma, sulla costa del Mar Rosso dell’Arabia nord-occidentale, dove tracciano il percorso coloro che pongono il Sinai in Madian, e Kuntillet el-Jerafi nel Sinai orientale presso il confine del Negev, sulla linea più consueta della marcia. Nessuna delle due ha altro a sostegno che il percorso."
  pl:
    - "Rissa to obóz Izraela na pustyni, wymieniony tylko w itinerarium z Lb 33, między Libną a Kehelatą: „A ruszywszy się z Lebna, położyli się obozem w Ressa. A ruszywszy się z Ressa, położyli się obozem w Kieelata”. Podobnie jak sąsiednie miejsca na liście, nie występuje nigdzie indziej w Biblii i nic nie mówi się o tym, co się tam wydarzyło."
    - "Jego położenie jest nieznane. Mapa podaje dwie propozycje: Szarma, na wybrzeżu Morza Czerwonego w północno-zachodniej Arabii, gdzie rysują trasę ci, którzy umieszczają Synaj w Madianie, oraz Kuntillet el-Dżerafi we wschodnim Synaju przy granicy z Negewem, na zwykłej linii marszu. Żadna nie ma poza trasą nic na swoje poparcie."
  cs:
    - "Rissa je tábor Izraele na poušti jmenovaný jen v itineráři Numeri 33, mezi Libnou a Kehelatou: „A hnuvše se z Lebna, položili se v Ressa. A hnuvše se z Ressa, položili se v Cehelot.“ Jako její sousedé v seznamu se nikde jinde v Bibli neobjevuje a o tom, co se tam stalo, se nic neříká."
    - "Její poloha je neznámá. Mapa podává dva návrhy: Šarmu na pobřeží Rudého moře v severozápadní Arábii, kde trasu kreslí ti, kdo kladou Sinaj do Midjánu, a Kuntillet el-Jerafi ve východním Sinaji u hranice s Negevem, na obvyklejší linii pochodu. Žádné nemá víc než trasu na podporu."
  nl:
    - "Rissa is een kamp van Israël in de woestijn dat alleen in de reisroute van Numeri 33 wordt genoemd, tussen Libna en Kehelata: “En zij verreisden van Libna, en legerden zich in Rissa. En zij verreisden van Rissa, en legerden zich in Kehelatha.” Net als zijn buren in de lijst komt het nergens anders in de Bijbel voor, en er wordt niets verteld over wat daar gebeurde."
    - "De ligging is onbekend. De kaart geeft twee voorstellen: Sharma, aan de kust van de Rode Zee in het noordwesten van Arabië, waar wie de Sinaï in Midian plaatsen de route tekenen, en Kuntillet el-Jerafi in de oostelijke Sinaï bij de grens met de Negev, op de gebruikelijker lijn van de tocht. Geen van beide heeft meer dan de route om op te steunen."
  sv:
    - "Rissa är ett av Israels läger i öknen, nämnt endast i vandringsförteckningen i 4 Mos 33, mellan Livna och Kehelata: ”Och de bröto upp från Libna och lägrade sig i Rissa. Och de bröto upp från Rissa och lägrade sig i Kehelata.” Liksom sina grannar i förteckningen förekommer det ingen annanstans i Bibeln, och ingenting berättas om vad som hände där."
    - "Dess läge är okänt. Kartan ger två förslag: Sharma, vid Sävhavets kust i nordvästra Arabien, där de som placerar Sinai i Midjan drar färdvägen, och Kuntillet el-Jerafi i östra Sinai nära Negevgränsen, på marschens vanligare linje. Ingetdera har mer än färdvägen att stödja sig på."
scripture:
  - Num.33.21-Num.33.22
sources:
