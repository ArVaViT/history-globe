body:
  en:
    - "“The South” here is the homeland of “the queen of the south”, whom Jesus set against his own generation: she “shall rise up in the judgment with this generation, and shall condemn it: for she came from the uttermost parts of the earth to hear the wisdom of Solomon; and, behold, a greater than Solomon is here.” Matthew and Luke give the saying in almost the same words. She is the queen of Sheba who, in the book of Kings, came to Jerusalem with spices, gold and precious stones to test Solomon with hard questions, and the map accordingly places the South at Sheba."
    - "The Gospels add nothing about the land itself; “the south” and “the uttermost parts of the earth” simply mark it as remote. Most scholars locate Sheba in south-western Arabia, the kingdom of Saba with its capital at Marib in today's Yemen, rich from the incense trade, though its inscriptions name no queen of Solomon's time. Josephus called her queen of Egypt and Ethiopia, and Ethiopian tradition, in the Kebra Nagast, makes her the mother of Menelik, the first king of its royal line. Nothing beyond these traditions is known of her or of her realm in the tenth century BC."
  ru:
    - "«Юг» здесь — родина царицы, которую Иисус противопоставил своему поколению: «Царица южная восстанет на суд с родом сим и осудит его, ибо она приходила от пределов земли послушать мудрости Соломоновой; и вот, здесь больше Соломона». Матфей и Лука передают эти слова почти одинаково. Это царица Савская, которая, по книге Царств, пришла в Иерусалим с благовониями, золотом и драгоценными камнями, чтобы испытать Соломона загадками, и поэтому на карте Юг помещён в Савской земле."
    - "О самой стране Евангелия ничего не добавляют: слова «южная» и «от пределов земли» лишь говорят о её отдалённости. Большинство учёных помещают Саву на юго-западе Аравии — это царство Саба со столицей в Марибе на территории нынешнего Йемена, богатевшее на торговле благовониями, хотя его надписи не называют никакой царицы времён Соломона. Иосиф Флавий называл её царицей Египта и Эфиопии, а эфиопское предание в «Кебра Нагаст» делает её матерью Менелика, первого царя своей династии. Кроме этих преданий о ней и её царстве в X веке до н. э. ничего не известно."
  uk:
    - "«Південь» тут — батьківщина «Полуденної цариці», яку Ісус протиставив власному поколінню: вона «встане на суд із кодлом сим та й осудить його: бо прийшла з найдальших країн землї слухати премудростї Соломонової; а ось тут більший од Соломона». Матвій і Лука подають це слово майже однаковими словами. Це цариця Шеви, що в Книзі Царів прибула до Єрусалима з пахощами, золотом і дорогоцінним камінням випробувати Соломона важкими загадками, і мапа відповідно розміщує Південь у Шеві."
    - "Євангелія нічого не додають про саму землю; «південь» і «найдальші країни землі» лише вказують на її віддаленість. Більшість учених розміщують Шеву на південному заході Аравії, у царстві Саба зі столицею в Марібі на території сучасного Ємену, багатому завдяки торгівлі пахощами, хоч його написи не називають жодної цариці часів Соломона. Йосиф Флавій називав її царицею Єгипту й Ефіопії, а ефіопська традиція в «Кебра Нагаст» робить її матір’ю Менеліка, першого царя її династії. Понад ці перекази про неї та її царство в X ст. до н. е. нічого не відомо."
  es:
    - "«El Sur» es aquí la patria de «la reina del Austro», a quien Jesús contrapuso a su propia generación: ella «se levantará en el juicio con esta generación, y la condenará; porque vino de los fines de la tierra para oir la sabiduría de Salomón: y he aquí más que Salomón en este lugar». Mateo y Lucas dan el dicho casi con las mismas palabras. Es la reina de Seba que, en el libro de los Reyes, vino a Jerusalén con especias, oro y piedras preciosas para poner a prueba a Salomón con preguntas difíciles, y por eso el mapa sitúa el Sur en Seba."
    - "Los Evangelios no añaden nada sobre la tierra misma; «el Austro» y «los fines de la tierra» solo la señalan como remota. La mayoría de los estudiosos sitúan Seba en el suroeste de Arabia, el reino de Saba con su capital en Marib, en el actual Yemen, rico por el comercio del incienso, aunque sus inscripciones no nombran a ninguna reina de la época de Salomón. Josefo la llamó reina de Egipto y de Etiopía, y la tradición etíope, en el Kebra Nagast, la hace madre de Menelik, el primer rey de su linaje real. Fuera de estas tradiciones, nada se sabe de ella ni de su reino en el siglo X a. C."
  pt:
    - "“O Sul”, aqui, é a pátria da “rainha do Sul”, a quem Jesus contrapôs a sua própria geração: ela “se levantará no juízo com esta geração e a condenará, pois ela veio dos confins da terra para ouvir a sabedoria de Salomão; e eis que está aqui quem é maior do que Salomão”. Mateus e Lucas dão o dito quase com as mesmas palavras. Ela é a rainha de Sabá que, no livro dos Reis, veio a Jerusalém com especiarias, ouro e pedras preciosas para pôr Salomão à prova com perguntas difíceis, e por isso o mapa situa o Sul em Sabá."
    - "Os Evangelhos nada acrescentam sobre a terra em si; “o Sul” e “os confins da terra” apenas a marcam como distante. A maioria dos estudiosos situa Sabá no sudoeste da Arábia, o reino de Sabá com capital em Marib, no atual Iêmen, enriquecido pelo comércio de incenso, embora suas inscrições não nomeiem nenhuma rainha do tempo de Salomão. Josefo a chamou de rainha do Egito e da Etiópia, e a tradição etíope, no Kebra Nagast, faz dela a mãe de Menelique, o primeiro rei de sua linhagem real. Nada além dessas tradições se sabe dela ou de seu reino no século X a.C."
  de:
    - "„Der Süden“ ist hier die Heimat der „Königin von Mittag“, die Jesus seinem eigenen Geschlecht gegenüberstellte: Sie „wird auftreten am Jüngsten Gericht mit diesem Geschlecht und wird es verdammen; denn sie kam vom Ende der Erde, Salomons Weisheit zu hören. Und siehe, hier ist mehr denn Salomo.“ Matthäus und Lukas überliefern das Wort fast gleichlautend. Sie ist die Königin von Scheba, die nach dem ersten Buch der Könige mit Spezereien, Gold und Edelsteinen nach Jerusalem kam, um Salomo mit schwierigen Fragen zu prüfen, und die Karte setzt den Süden dementsprechend nach Scheba."
    - "Die Evangelien sagen nichts weiter über das Land selbst; „Mittag“ und „vom Ende der Erde“ bezeichnen es lediglich als fern. Die meisten Forscher verorten Scheba im Südwesten Arabiens, im Königreich Saba mit der Hauptstadt Marib im heutigen Jemen, reich durch den Weihrauchhandel, obwohl seine Inschriften keine Königin aus Salomos Zeit nennen. Josephus nannte sie Königin von Ägypten und Äthiopien, und die äthiopische Überlieferung macht sie im Kebra Nagast zur Mutter Meneliks, des ersten Königs ihrer Herrscherlinie. Über diese Überlieferungen hinaus ist von ihr und ihrem Reich im zehnten Jahrhundert v. Chr. nichts bekannt."
  fr:
    - "« Le Midi » désigne ici le pays d’origine de « la reine du Midi », que Jésus opposa à sa propre génération : elle « se lèvera, au jour du jugement, avec cette génération et la condamnera, parce qu’elle vint des extrémités de la terre pour entendre la sagesse de Salomon ; et voici, il y a ici plus que Salomon ». Matthieu et Luc rapportent la parole presque dans les mêmes termes. C’est la reine de Séba qui, dans le livre des Rois, vint à Jérusalem avec des aromates, de l’or et des pierres précieuses pour éprouver Salomon par des énigmes, et la carte place donc le Midi à Séba."
    - "Les Évangiles n’ajoutent rien sur le pays lui-même ; « le Midi » et « les extrémités de la terre » le marquent simplement comme lointain. La plupart des spécialistes situent Séba dans le sud-ouest de l’Arabie, le royaume de Saba, avec sa capitale Marib dans l’actuel Yémen, enrichi par le commerce de l’encens, bien que ses inscriptions ne nomment aucune reine du temps de Salomon. Josèphe l’appelait reine d’Égypte et d’Éthiopie, et la tradition éthiopienne, dans le Kebra Nagast, en fait la mère de Ménélik, premier roi de sa lignée royale. On ne sait rien de plus d’elle ni de son royaume au Xe siècle av. J.-C. en dehors de ces traditions."
  pl:
    - "„Południe” jest tu ojczyzną królowej, którą Jezus przeciwstawił własnemu pokoleniu: „Królowa z południa stanie na sądzie z tym rodzajem, i potępi go; iż przyszła od krajów ziemi, aby słuchała mądrości Salomonowej; a oto tu więcej niżeli Salomon.” Mateusz i Łukasz podają to powiedzenie niemal tymi samymi słowami. Jest to królowa Szeby, która w Księdze Królewskiej przybyła do Jerozolimy z wonnościami, złotem i drogimi kamieniami, by wystawić Salomona na próbę trudnymi pytaniami, i dlatego mapa umieszcza Południe w Szebie."
    - "Ewangelie nic nie dodają o samej krainie; „południe” i „kraje ziemi” po prostu oznaczają jej odległość. Większość badaczy umieszcza Szebę w południowo-zachodniej Arabii, w królestwie Saby ze stolicą w Marib w dzisiejszym Jemenie, bogatym dzięki handlowi kadzidłem, choć jego inskrypcje nie wymieniają żadnej królowej z czasów Salomona. Józef Flawiusz nazywał ją królową Egiptu i Etiopii, a tradycja etiopska w Kebra Nagast czyni ją matką Menelika, pierwszego króla jej dynastii. Poza tymi tradycjami nie wiadomo nic o niej ani o jej państwie w X wieku p.n.e."
  it:
    - "«Il Mezzodì» è qui la patria della «regina del Mezzodì», che Gesù contrappose alla sua generazione: ella «risusciterà nel giudizio con questa generazione e la condannerà; perché ella venne dalle estremità della terra per udir la sapienza di Salomone; ed ecco qui v’è più che Salomone!» Matteo e Luca riportano il detto quasi con le stesse parole. È la regina di Saba che, nel libro dei Re, venne a Gerusalemme con aromi, oro e pietre preziose per mettere alla prova Salomone con domande difficili, e la mappa colloca di conseguenza il Mezzodì a Saba."
    - "I Vangeli non aggiungono nulla sulla terra in sé; «il Mezzodì» e «le estremità della terra» la indicano semplicemente come remota. La maggior parte degli studiosi colloca Saba nell’Arabia sud-occidentale, il regno di Saba con capitale a Marib, nell’odierno Yemen, ricco per il commercio dell’incenso, benché le sue iscrizioni non nominino alcuna regina del tempo di Salomone. Giuseppe Flavio la chiamò regina d’Egitto e d’Etiopia, e la tradizione etiope, nel Kebra Nagast, ne fa la madre di Menelik, primo re della sua dinastia. Oltre a queste tradizioni non si sa nulla di lei né del suo regno nel X secolo a.C."
  nl:
    - "“Het Zuiden” is hier het thuisland van “de koningin van het zuiden”, die Jezus tegenover zijn eigen generatie stelde: zij “zal opstaan in het oordeel met dit geslacht, en hetzelve veroordelen; want zij is gekomen van het einde der aarde, om te horen, de wijsheid van Salomo; en ziet, meer dan Salomo is hier!” Mattheüs en Lukas geven de uitspraak in bijna dezelfde woorden. Zij is de koningin van Seba die, volgens het boek Koningen, met specerijen, goud en kostbaar gesteente naar Jeruzalem kwam om Salomo met moeilijke vragen op de proef te stellen, en de kaart plaatst het Zuiden dan ook bij Seba."
    - "De evangeliën voegen niets toe over het land zelf; “het zuiden” en “het einde der aarde” markeren het eenvoudig als ver weg. De meeste geleerden plaatsen Seba in het zuidwesten van Arabië, het koninkrijk Saba met zijn hoofdstad Marib in het huidige Jemen, rijk door de wierookhandel, al noemen de opschriften daar geen koningin uit de tijd van Salomo. Flavius Josephus noemde haar koningin van Egypte en Ethiopië, en de Ethiopische overlevering maakt haar in de Kebra Nagast de moeder van Menelik, de eerste koning van zijn koningshuis. Buiten deze overleveringen is niets van haar of van haar rijk in de 10e eeuw v.Chr. bekend."
  cs:
    - "„Jih“ je zde vlastí královny od poledne, kterou Ježíš postavil proti svému pokolení: „Královna od poledne povstane k soudu s pokolením tímto, a odsoudí je; nebo přijela od končin země, aby slyšela moudrost Šalomounovu, a aj, víceť jest tuto nežli Šalomoun.“ Matouš a Lukáš uvádějí výrok téměř týmiž slovy. Je to královna ze Šeby, která v Knize králů přijela do Jeruzaléma s vonnými věcmi, zlatem a drahými kameny, aby Šalomouna zkoušela těžkými otázkami, a mapa proto klade Jih do Šeby."
    - "Evangelia o samotné zemi nic nepřidávají; „od poledne“ a „od končin země“ ji prostě označují jako vzdálenou. Většina učenců klade Šebu do jihozápadní Arábie, do království Saba s hlavním městem Maribem v dnešním Jemenu, zbohatlého obchodem s kadidlem, třebaže jeho nápisy žádnou královnu z doby Šalomounovy nejmenují. Josephus ji nazval královnou Egypta a Etiopie a etiopská tradice v Kebra Nagast z ní činí matku Menelika, prvního krále svého královského rodu. Nic víc než tyto tradice o ní ani o její říši v 10. stol. př. n. l. není známo."
  sv:
    - "”Söderlandet” är här hemlandet för ”drottningen av Söderlandet”, som Jesus ställde mot sin egen generation: hon ”skall vid domen träda fram tillsammans med detta släkte och bliva det till dom. Ty hon kom från jordens ända för att höra Salomos visdom; och se, här är vad som är mer än Salomo.” Matteus och Lukas ger ordet nästan likalydande. Hon är drottningen av Saba som, i Första Kungaboken, kom till Jerusalem med kryddor, guld och ädla stenar för att sätta Salomo på prov med svåra frågor, och kartan förlägger därför Söderlandet till Saba."
    - "Evangelierna tillägger ingenting om själva landet; ”Söderlandet” och ”jordens ända” markerar bara att det är avlägset. De flesta forskare förlägger Saba till sydvästra Arabien, riket Saba med huvudstad i Marib i nuvarande Jemen, rikt genom handeln med rökelse, fast dess inskrifter inte nämner någon drottning från Salomos tid. Josefus kallade henne drottning av Egypten och Etiopien, och den etiopiska traditionen, i Kebra Nagast, gör henne till mor åt Menelik, den förste kungen i dess kungalinje. Utöver dessa traditioner är ingenting känt om henne eller hennes rike på 900-talet f.Kr."
  nb:
    - "«Syden» er her hjemlandet til «dronningen fra Syden», som Jesus stilte opp mot sin egen generasjon: hun «skal stå op på dommens dag sammen med denne slekt og fordømme den; for hun kom fra jordens ytterste ende for å høre Salomos visdom, og se, her er mere enn Salomo». Matteus og Lukas gir ordet med nesten de samme ordene. Hun er dronningen av Saba som i Kongebøkene kom til Jerusalem med krydderier, gull og edelstener for å sette Salomo på prøve med vanskelige spørsmål, og kartet plasserer derfor Syden i Sjeba."
    - "Evangeliene tilføyer ingenting om selve landet; «Syden» og «jordens ytterste ende» markerer det bare som fjernt. De fleste forskere plasserer Sjeba i det sørvestlige Arabia, kongeriket Saba med hovedstaden Marib i dagens Jemen, rikt på virakhandelen, selv om innskriftene dets ikke nevner noen dronning fra Salomos tid. Josefus kalte henne dronning av Egypt og Etiopia, og den etiopiske tradisjonen, i Kebra Nagast, gjør henne til mor til Menelik, den første kongen i dens kongeslekt. Utover disse tradisjonene er ingenting kjent om henne eller riket hennes på 900-tallet f.Kr."
  tl:
    - "Ang “Timugan” dito ay ang tinubuang lupain ng “reina ng timugan”, na itinapat ni Jesus sa sarili niyang salinlahi: “Magbabangon sa paghuhukom ang reina ng timugan na kasama ng lahing ito, at ito'y hahatulan: sapagka't siya'y nanggaling sa mga wakas ng lupa upang pakinggan ang karunungan ni Salomon; at narito, dito'y may isang lalong dakila kay sa kay Salomon.” Ibinibigay nina Mateo at Lucas ang kasabihan sa halos magkatulad na mga salita. Siya ang reina ng Seba na, sa aklat ng Mga Hari, ay pumunta sa Jerusalem na may dalang mga espesya, ginto at mahahalagang bato upang subukin si Salomon ng mahihirap na tanong, at alinsunod dito ay inilalagay ng mapa ang Timugan sa Seba."
    - "Walang idinaragdag ang mga Ebanghelyo tungkol sa lupain mismo; ang “timugan” at ang “mga wakas ng lupa” ay nagmamarka lamang na ito ay malayo. Karamihan ng mga iskolar ay naglalagay ng Seba sa timog-kanluran ng Arabia, ang kaharian ng Saba na may kabisera sa Marib sa Yemen ngayon, mayaman mula sa kalakalan ng insenso, bagaman ang mga inskripsiyon nito ay hindi nagpapangalan ng reina noong panahon ni Salomon. Tinawag siya ni Josefo na reina ng Egipto at Etiopia, at ang tradisyong Etiope, sa Kebra Nagast, ay ginagawa siyang ina ni Menelik, ang unang hari ng maharlikang angkan nito. Walang nalalaman lampas sa mga tradisyong ito tungkol sa kaniya o sa kaniyang kaharian noong ika-10 siglo BK."
  da:
    - "»Sydlandet« er her hjemstavnen for »Sydens Dronning«, som Jesus stillede over for sin egen slægt: hun »skal oprejses ved Dommen sammen med denne Slægt og fordømme den; thi hun kom fra Jordens Grænser for at høre Salomons Visdom; og se, her er mere end Salomon.« Mattæus og Lukas giver ordet næsten med de samme ord. Hun er dronningen af Sjeba, som ifølge Kongebøgerne kom til Jerusalem med krydderier, guld og ædelstene for at prøve Salomo med svære spørgsmål, og kortet placerer derfor Sydlandet i Sjeba."
    - "Evangelierne føjer intet til om selve landet; »Syden« og »Jordens Grænser« markerer det blot som fjernt. De fleste forskere placerer Sjeba i det sydvestlige Arabien, kongeriget Saba med hovedstad i Marib i nutidens Yemen, rigt af røgelseshandelen, selv om dets indskrifter ikke nævner nogen dronning fra Salomos tid. Josephus kaldte hende dronning af Egypten og Etiopien, og den etiopiske tradition gør hende i Kebra Nagast til mor til Menelik, den første konge i landets kongeslægt. Intet ud over disse traditioner kendes om hende eller om hendes rige i 900-tallet f.Kr."
  sr:
    - "„Југ“ је овде постојбина „царице јужне“, коју је Исус супротставио свом нараштају: она „изићи ће на суд с родом овим, и осудиће га; јер она дође с краја земље да слуша премудрост Соломунову: а гле, овде је већи од Соломуна.“ Матеј и Лука дају изреку скоро истим речима. То је царица од Саве која је, у књизи о царевима, дошла у Јерусалим с мирисима, златом и драгим камењем да искуша Соломуна тешким питањима, и зато карта смешта Југ у Саву."
    - "Јеванђеља не додају ништа о самој земљи; „јужна“ и „крај земље“ само означавају да је далека. Већина научника смешта Саву у југозападну Арабију, краљевство Саба са престоницом Мариб у данашњем Јемену, богато од трговине тамјаном, мада његови натписи не именују ниједну царицу из Соломоновог доба. Јосиф Флавије ју је звао царицом Египта и Етиопије, а етиопска традиција, у Кебра Нагасту, чини је мајком Менелика, првог цара своје владарске лозе. Ништа осим ових предања није познато о њој ни о њеној држави у 10. веку п. н. е."
scripture:
  - Matt.12.42
  - Luke.11.31
  - 1Kgs.10.1-1Kgs.10.2
sources:
