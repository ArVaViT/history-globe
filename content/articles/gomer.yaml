body:
  en:
    - "Gomer is generally identified with the people the Assyrians called Gimirraya and the Greeks Kimmerioi, the Cimmerians: horse-riding nomads from the steppes north of the Caucasus and the Black Sea who broke into the Near East at the end of the eighth century BC. The table of nations names Gomer first among the sons of Japheth and father of Ashkenaz, Riphath and Togarmah. In Ezekiel's vision of Gog the northern host includes “Gomer, and all his bands; the house of Togarmah of the north quarters”. Medieval Armenian tradition gave Gomer's name to Cappadocia, called Gamirk in Armenian."
    - "The Cimmerians first appear in reports sent to Sargon II in 714 BC, telling of a defeat they inflicted on Urartu. Under Esarhaddon most of them moved west into Anatolia. About 644 BC, under their king Lygdamis (Dugdamme in Assyrian texts), they sacked Sardis, all but its citadel, and Gyges of Lydia was killed. Herodotus says they took Sardis in the reign of Gyges' son Ardys and that Alyattes of Lydia drove them out of Asia; by about 635 BC their power was broken by Scythians and Lydians."
  ru:
    - "Гомера обычно отождествляют с народом, который ассирийцы называли гимирраи, а греки киммерийцами: это конные кочевники степей к северу от Кавказа и Чёрного моря, ворвавшиеся на Ближний Восток в конце VIII в. до н. э. Родословие народов называет Гомера первым из сыновей Иафета и отцом Аскеназа, Рифата и Фогармы. В видении Иезекииля о Гоге в северное войско входят «Гомера со всеми отрядами его, дом Фогарма, от пределов севера». Средневековое армянское предание перенесло имя Гомера на Каппадокию, по-армянски Гамирк."
    - "Киммерийцы впервые появляются в донесениях Саргону II в 714 г. до н. э., сообщающих о поражении, которое они нанесли Урарту. При Асархаддоне большая их часть ушла на запад, в Анатолию. Ок. 644 г. до н. э. под началом своего царя Лигдамиса (Дугдамме ассирийских текстов) они разорили Сарды, кроме акрополя, и лидийский царь Гиг был убит. Геродот пишет, что они взяли Сарды при сыне Гига Ардисе и что лидийский царь Алиатт изгнал их из Азии; ок. 635 г. до н. э. их сила была сломлена скифами и лидийцами."
  uk:
    - "Гомера зазвичай ототожнюють із народом, якого ассирійці називали Гіміррая, а греки — кіммерійцями: кочівниками-вершниками зі степів на північ від Кавказу та Чорного моря, які вдерлися на Близький Схід наприкінці VIII ст. до н. е. Таблиця народів називає Гомера першим серед синів Яфета й батьком Аскеназа, Ріфата й Фогарми. У видінні Єзекіїля про Гога серед північного війська названо: «Гомера й усю ватагу його, дом Тогармів із ватагами його від північних гряниць». Середньовічна вірменська традиція дала ім'я Гомера Каппадокії, яку вірменською називали Гамірк."
    - "Кіммерійці вперше з'являються у звітах, надісланих Саргонові II 714 р. до н. е., що розповідають про поразку, якої вони завдали Урарту. За Асархаддона більшість із них перейшла на захід, в Анатолію. Близько 644 р. до н. е. під проводом свого царя Лігдаміса (Дугдамме в ассирійських текстах) вони пограбували Сарди, крім цитаделі, і Гіг Лідійський був убитий. Геродот каже, що вони взяли Сарди за царювання Гігового сина Ардіса й що Аліатт Лідійський вигнав їх з Азії; близько 635 р. до н. е. їхню міць зламали скіфи та лідійці."
  es:
    - "Gomer se identifica por lo general con el pueblo que los asirios llamaban Gimirraya y los griegos Kimmerioi, los cimerios: nómadas jinetes de las estepas al norte del Cáucaso y del mar Negro que irrumpieron en el Próximo Oriente a fines del siglo VIII a. C. La tabla de las naciones nombra a Gomer el primero entre los hijos de Jafet y padre de Askenaz, Rifat y Togarma. En la visión de Gog en Ezequiel, la hueste del norte incluye a «Gomer, y todas sus compañías; la casa de Togarma, á los lados del norte». La tradición armenia medieval dio el nombre de Gomer a Capadocia, llamada Gamirk en armenio."
    - "Los cimerios aparecen por primera vez en informes enviados a Sargón II en 714 a. C., que cuentan una derrota que infligieron a Urartu. Bajo Esar-hadón la mayoría se desplazó al oeste, a Anatolia. Hacia 644 a. C., bajo su rey Ligdamis (Dugdamme en los textos asirios), saquearon Sardis, salvo su ciudadela, y murió Giges de Lidia. Heródoto dice que tomaron Sardis en el reinado de Ardis, hijo de Giges, y que Aliates de Lidia los expulsó de Asia; hacia 635 a. C. su poder estaba quebrado por escitas y lidios."
  de:
    - "Gomer wird allgemein mit dem Volk gleichgesetzt, das die Assyrer Gimirraja und die Griechen Kimmerier nannten: berittene Nomaden aus den Steppen nördlich des Kaukasus und des Schwarzen Meeres, die am Ende des achten Jahrhunderts v. Chr. in den Vorderen Orient einbrachen. Die Völkertafel nennt Gomer als Ersten unter den Söhnen Jafets und als Vater von Aschkenas, Rifat und Togarma. In Hesekiels Gog-Vision gehört zum Heer aus dem Norden: „Gomer und all sein Heer samt dem Hause Thogarma, so gegen Mitternacht liegt, mit all seinem Heer“. Die mittelalterliche armenische Überlieferung gab Gomers Namen Kappadokien, auf Armenisch Gamirk."
    - "Die Kimmerier erscheinen erstmals in Berichten an Sargon II. aus dem Jahr 714 v. Chr., die von einer Niederlage erzählen, die sie Urartu beibrachten. Unter Asarhaddon zog die Mehrzahl von ihnen nach Westen nach Anatolien. Um 644 v. Chr. plünderten sie unter ihrem König Lygdamis (assyrisch Dugdamme) Sardes, bis auf die Burg, und Gyges von Lydien wurde getötet. Herodot sagt, sie hätten Sardes unter Ardys, dem Sohn des Gyges, genommen und Alyattes von Lydien habe sie aus Asien vertrieben; um 635 v. Chr. war ihre Macht von Skythen und Lydern gebrochen."
  fr:
    - "On identifie généralement Gomer avec le peuple que les Assyriens appelaient Gimirraya et les Grecs Kimmerioi, les Cimmériens : nomades cavaliers des steppes au nord du Caucase et de la mer Noire qui firent irruption au Proche-Orient à la fin du VIIIe siècle av. J.-C. La table des nations nomme Gomer en premier parmi les fils de Japhet et père d’Aschkenaz, de Riphat et de Togarma. Dans la vision d’Ézéchiel sur Gog, l’armée du nord comprend « Gomer et toutes ses troupes, la maison de Togarma, à l’extrémité du septentrion ». La tradition arménienne médiévale donna le nom de Gomer à la Cappadoce, appelée Gamirk en arménien."
    - "Les Cimmériens apparaissent pour la première fois dans des rapports envoyés à Sargon II en 714 av. J.-C., qui racontent une défaite qu’ils infligèrent à l’Urartu. Sous Esar-Haddon, la plupart d’entre eux passèrent à l’ouest, en Anatolie. Vers 644 av. J.-C., sous leur roi Lygdamis (Dougdammé dans les textes assyriens), ils pillèrent Sardes, sauf sa citadelle, et Gygès de Lydie fut tué. Hérodote dit qu’ils prirent Sardes sous le règne d’Ardys, fils de Gygès, et qu’Alyatte de Lydie les chassa d’Asie ; vers 635 av. J.-C., leur puissance fut brisée par les Scythes et les Lydiens."
  pt:
    - "Gômer é geralmente identificado com o povo que os assírios chamavam Gimirraya e os gregos Kimmerioi, os cimérios: nômades a cavalo das estepes ao norte do Cáucaso e do mar Negro que irromperam no Oriente Próximo no final do século VIII a.C. A tabela das nações nomeia Gômer em primeiro lugar entre os filhos de Jafé e pai de Asquenaz, Rifate e Togarma. Na visão de Ezequiel sobre Gogue, o exército do norte inclui “Gômer e todas as suas hordas; a casa de Togarma, nos confins do norte”. A tradição armênia medieval deu o nome de Gômer à Capadócia, chamada Gamirk em armênio."
    - "Os cimérios aparecem pela primeira vez em relatórios enviados a Sargão II em 714 a.C., que contam uma derrota que infligiram a Urartu. Sob Esar-Hadom, a maioria deles se mudou para o oeste, para a Anatólia. Por volta de 644 a.C., sob seu rei Lígdamis (Dugdamme nos textos assírios), saquearam Sardes, exceto a cidadela, e Giges da Lídia foi morto. Heródoto diz que tomaram Sardes no reinado de Árdis, filho de Giges, e que Aliates da Lídia os expulsou da Ásia; por volta de 635 a.C. seu poder foi quebrado por citas e lídios."
  it:
    - "Gomer è identificato in genere con il popolo che gli Assiri chiamavano Gimirraya e i Greci Kimmerioi, i Cimmeri: nomadi a cavallo delle steppe a nord del Caucaso e del Mar Nero che irruppero nel Vicino Oriente alla fine dell’VIII secolo a.C. La tavola dei popoli nomina Gomer per primo tra i figli di Iafet e padre di Aschenàz, Rifat e Togarma. Nella visione di Ezechiele su Gog l’esercito del nord comprende «Gomer e tutte le sue schiere, la casa di Togarma dell’estremità del settentrione». La tradizione armena medievale diede il nome di Gomer alla Cappadocia, chiamata Gamirk in armeno."
    - "I Cimmeri compaiono per la prima volta nei rapporti inviati a Sargon II nel 714 a.C., che riferiscono di una sconfitta da loro inflitta a Urartu. Sotto Assaraddon la maggior parte di essi si spostò a ovest, in Anatolia. Verso il 644 a.C., sotto il loro re Licdami (Dugdamme nei testi assiri), saccheggiarono Sardi, tranne la cittadella, e Gige di Lidia fu ucciso. Erodoto dice che presero Sardi sotto il regno di Ardi, figlio di Gige, e che Aliatte di Lidia li scacciò dall’Asia; verso il 635 a.C. la loro potenza fu spezzata da Sciti e Lidi."
  nl:
    - "Gomer wordt algemeen vereenzelvigd met het volk dat de Assyriërs Gimirraya en de Grieken Kimmerioi noemden, de Cimmeriërs: paardrijdende nomaden van de steppen ten noorden van de Kaukasus en de Zwarte Zee die aan het einde van de achtste eeuw v.Chr. het Nabije Oosten binnenvielen. De volkerentafel noemt Gomer als eerste onder de zonen van Jafet en vader van Askenaz, Rifat en Togarma. In Ezechiëls visioen van Gog omvat het noordelijke leger “Gomer en al zijn benden, en het huis van Togarma, aan de zijden van het noorden”. De middeleeuwse Armeense overlevering gaf Gomers naam aan Cappadocië, in het Armeens Gamirk genoemd."
    - "De Cimmeriërs verschijnen voor het eerst in berichten aan Sargon II in 714 v.Chr., die vertellen van een nederlaag die zij Urartu toebrachten. Onder Esarhaddon trokken de meesten van hen westwaarts naar Anatolië. Omstreeks 644 v.Chr. plunderden zij onder hun koning Lygdamis (in Assyrische teksten Dugdamme) Sardes, op de burcht na, en Gyges van Lydië werd gedood. Herodotus zegt dat zij Sardes innamen onder Ardys, de zoon van Gyges, en dat Alyattes van Lydië hen uit Azië verdreef; omstreeks 635 v.Chr. was hun macht door Scythen en Lydiërs gebroken."
  pl:
    - "Gomer utożsamia się zwykle z ludem, który Asyryjczycy nazywali Gimirraja, a Grecy Kimmerioi, czyli Cymeryjczykami: konnymi koczownikami ze stepów na północ od Kaukazu i Morza Czarnego, którzy wdarli się na Bliski Wschód pod koniec VIII w. p.n.e. Tablica narodów wymienia Gomera jako pierwszego z synów Jafeta i ojca Aszkenaza, Rifata i Togarmy. W wizji Ezechiela o Gogu północne wojsko obejmuje „Gomer i wszystkie hufy jego, dom Togormy mieszkającego w stronach północnych”. Średniowieczna tradycja ormiańska nadała imię Gomera Kapadocji, zwanej po ormiańsku Gamirk."
    - "Cymeryjczycy pojawiają się po raz pierwszy w raportach przesyłanych Sargonowi II w 714 p.n.e., donoszących o klęsce, jaką zadali Urartu. Za Asarhaddona większość z nich przeniosła się na zachód, do Anatolii. Około 644 p.n.e., pod wodzą króla Lygdamisa (w tekstach asyryjskich Dugdamme), złupili Sardes, z wyjątkiem cytadeli, a Gyges z Lidii zginął. Herodot mówi, że zdobyli Sardes za panowania syna Gygesa, Ardysa, i że Alyattes z Lidii wypędził ich z Azji; około 635 p.n.e. ich potęgę złamali Scytowie i Lidyjczycy."
  cs:
    - "Gomer se obecně ztotožňuje s lidem, který Asyřané nazývali Gimirraja a Řekové Kimmerioi, tedy s Kimmeřany: jízdními kočovníky ze stepí severně od Kavkazu a Černého moře, kteří vtrhli na Blízký východ koncem osmého století př. n. l. Tabulka národů jmenuje Gomera jako prvního z synů Jafetových a otce Aškenaze, Rífata a Togarmy. Ve vidění Ezechielově o Gogovi zahrnuje severní vojsko „Gomera i všecky houfy jeho, dům Togarmy od stran půlnočních“. Středověká arménská tradice dala Gomerovo jméno Kappadokii, arménsky zvané Gamirk."
    - "Kimmeřané se poprvé objevují ve zprávách zaslaných Sargonovi II. roku 714 př. n. l., které vypráví o porážce, již způsobili Urartu. Za Asarhadóna se většina z nich přesunula na západ do Anatolie. Kolem roku 644 př. n. l. pod svým králem Lygdamem (v asyrských textech Dugdamme) vyplenili Sardy, vyjma citadely, a lýdský Gýgés byl zabit. Hérodotos říká, že dobyli Sardy za vlády Gýgova syna Ardya a že je z Asie vyhnal lýdský Alyattés; asi do roku 635 př. n. l. byla jejich moc zlomena Skythy a Lýdy."
  sv:
    - "Gomer identifieras allmänt med folket som assyrierna kallade Gimirraya och grekerna Kimmerioi, kimmerierna: ryttarnomader från stäppen norr om Kaukasus och Svarta havet som bröt in i Främre Orienten i slutet av 700-talet f.Kr. Folkens tavla nämner Gomer först bland Jafets söner och som far till Ashkenas, Rifat och Togarma. I Hesekiels syn om Gog ingår i den nordliga hären ”Gomer och alla dess härskaror, Togarmas folk ifrån den yttersta norden”. Medeltida armenisk tradition gav Gomers namn åt Kappadokien, på armeniska kallat Gamirk."
    - "Kimmerierna dyker först upp i rapporter till Sargon II år 714 f.Kr., som berättar om ett nederlag de tillfogade Urartu. Under Esarhaddon flyttade de flesta av dem västerut till Anatolien. Omkring 644 f.Kr., under sin kung Lygdamis (Dugdamme i assyriska texter), plundrade de Sardes, allt utom citadellet, och Gyges av Lydien dödades. Herodotos säger att de intog Sardes under Gyges son Ardys regering och att Alyattes av Lydien drev dem ut ur Asien; omkring 635 f.Kr. var deras makt bruten av skyter och lydier."
  nb:
    - "Gomer identifiseres vanligvis med folket assyrerne kalte Gimirraya og grekerne Kimmerioi, kimmerierne: hesteridende nomader fra steppene nord for Kaukasus og Svartehavet som brøt inn i Midtøsten mot slutten av 700-tallet f.Kr. Folkeslagstabellen nevner Gomer først blant Jafets sønner og som far til Asjkenas, Rifat og Togarma. I Esekiels syn om Gog omfatter den nordlige hæren «Gomer og alle dets skarer, Togarma-folket i det ytterste Norden». Middelalderens armenske tradisjon ga Gomers navn til Kappadokia, kalt Gamirk på armensk."
    - "Kimmerierne dukker først opp i rapporter sendt til Sargon 2. i 714 f.Kr., som forteller om et nederlag de påførte Urartu. Under Asarhaddon flyttet de fleste av dem vestover til Anatolia. Omkring 644 f.Kr., under sin konge Lygdamis (Dugdamme i assyriske tekster), plyndret de Sardes, alt unntatt citadellet, og Gyges av Lydia ble drept. Herodot sier at de inntok Sardes i regjeringstiden til Gyges' sønn Ardys og at Alyattes av Lydia drev dem ut av Asia; omkring 635 f.Kr. var deres makt brutt av skyterne og lydierne."
  tl:
    - "Ang Gomer ay karaniwang tinutukoy sa mga taong tinawag ng mga Asirio na Gimirraya at ng mga Griyego na Kimmerioi, ang mga Cimmerian: mga nomadang nangangabayo mula sa mga estepa sa hilaga ng Caucasus at ng Dagat Itim na sumugod sa Malapit na Silangan sa katapusan ng ika-8 siglo BK. Pinangangalanan ng talaan ng mga bansa ang Gomer na una sa mga anak ni Japhet at ama nina Aschenaz, Rifat at Togarma. Sa pangitain ni Ezekiel tungkol kay Gog, kabilang sa hukbo ng hilaga ang “Gomer at ang lahat niyang mga pulutong; ang sangbahayan ni Togarma sa mga pinakahuling bahagi ng hilagaan”. Ibinigay ng tradisyong Armenio noong Edad Medya ang pangalan ni Gomer sa Capadocia, na tinatawag na Gamirk sa Armenio."
    - "Unang lumilitaw ang mga Cimmerian sa mga ulat na ipinadala kay Sargon II noong 714 BK, na nagsasalaysay ng pagkatalong ibinigay nila sa Urartu. Sa ilalim ni Esar-hadon, karamihan sa kanila ay lumipat sa kanluran patungong Anatolia. Mga 644 BK, sa ilalim ng kanilang haring si Lygdamis (Dugdamme sa mga tekstong Asirio), sinamsam nila ang Sardis, maliban sa kuta nito, at napatay si Gyges ng Lidia. Sinasabi ni Herodotus na sinakop nila ang Sardis sa paghahari ni Ardys, anak ni Gyges, at na pinalayas sila ni Alyattes ng Lidia mula sa Asia; pagsapit ng mga 635 BK nasira ang kanilang kapangyarihan ng mga Scythian at Lidiano."
  da:
    - "Gomer identificeres almindeligvis med det folk, assyrerne kaldte Gimirraya og grækerne Kimmerioi, kimmerierne: hesteridende nomader fra steppen nord for Kaukasus og Sortehavet, som brød ind i Nærorienten i slutningen af 700-tallet f.Kr. Folketavlen nævner Gomer først blandt Jafets sønner og som far til Asjkenaz, Rifat og Togarma. I Ezekiels syn om Gog omfatter nordens hær »Gomer og alle hans Hære, Thogarmas Hus i det yderste Nord«. Middelalderlig armensk tradition gav Gomers navn til Kappadokien, på armensk kaldet Gamirk."
    - "Kimmerierne dukker første gang op i rapporter sendt til Sargon II i 714 f.Kr. om et nederlag, de påførte Urartu. Under Esarhaddon drog de fleste af dem vestpå ind i Anatolien. Omkring 644 f.Kr. plyndrede de under deres konge Lygdamis (Dugdamme i assyriske tekster) Sardes på nær citadellet, og Gyges af Lydien blev dræbt. Herodot siger, at de indtog Sardes under Gyges' søn Ardys, og at Alyattes af Lydien drev dem ud af Asien; omkring 635 f.Kr. var deres magt brudt af skyterne og lydierne."
  sr:
    - "Гомер се обично поистовећује с народом који су Асирци звали Гимираја, а Грци Кимерији, Кимерци: коњички номади са степа северно од Кавказа и Црног мора који су упали на Блиски исток крајем осмог века п. н. е. Табела народа именује Гомера први међу Јафетовим синовима и оца Асхенаса, Рифата и Тогарме. У Језекиљевој визији Гога северна војска обухвата „Гомера и све чете његове, дом Тогармин са северног краја“. Средњовековно јерменско предање дало је Гомерово име Кападокији, на јерменском званој Гамирк."
    - "Кимерци се први пут појављују у извештајима упућеним Саргону II 714. п. н. е., који говоре о поразу који су нанели Урарту. Под Есарадоном већина њих се преселила на запад у Анатолију. Око 644. п. н. е., под својим царем Лигдамисом (Дугдаме у асирским текстовима), опљачкали су Сард, све осим његове цитаделе, и Гиг Лидијски је погинуо. Херодот каже да су узели Сард за владавине Гиговог сина Ардиса и да их је Алијат Лидијски отерао из Азије; око 635. п. н. е. њихову моћ су сломили Скити и Лиђани."
