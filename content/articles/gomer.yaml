# Overview article (ADR 0007). Gomer = the Cimmerians (Assyrian Gimirri) is the generally accepted identification; Anatolian dates follow the Assyrian sources (Gyges' death about 644 BC after Spalinger 1978; Parker allows any date shortly after 650).
