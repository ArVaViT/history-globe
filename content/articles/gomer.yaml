body:
  en:
    - "Gomer is generally identified with the people the Assyrians called Gimirraya and the Greeks Kimmerioi, the Cimmerians: horse-riding nomads from the steppes north of the Caucasus and the Black Sea who broke into the Near East at the end of the eighth century BC. The table of nations names Gomer first among the sons of Japheth and father of Ashkenaz, Riphath and Togarmah. In Ezekiel's vision of Gog the northern host includes “Gomer, and all his bands; the house of Togarmah of the north quarters”. Medieval Armenian tradition gave Gomer's name to Cappadocia, called Gamirk in Armenian."
    - "The Cimmerians first appear in reports sent to Sargon II in 714 BC, telling of a defeat they inflicted on Urartu. Under Esarhaddon most of them moved west into Anatolia. About 644 BC, under their king Lygdamis (Dugdamme in Assyrian texts), they sacked Sardis, all but its citadel, and Gyges of Lydia was killed. Herodotus says they took Sardis in the reign of Gyges' son Ardys and that Alyattes of Lydia drove them out of Asia; by about 635 BC their power was broken by Scythians and Lydians."
    - "Greek writers kept the name of the Cimmerians. The Odyssey places a people of that name by the stream of Ocean, wrapped in mist and cloud, where the sun never shines on them. Herodotus says that the Scythians drove the Cimmerians out of their country north of the Black Sea, that they fled into Asia along the coast and settled on the peninsula where the Greek city of Sinope later stood, and that Scythia in his day still had Cimmerian forts, a Cimmerian ferry and a strait called the Cimmerian Bosporus. Josephus wrote that Gomer founded the people whom the Greeks of his time called Galatians, and who were once called Gomerites. The Babylonian Talmud identifies Gomer with Germamya, a name the Jewish Encyclopedia reads either as the Cimmerians or as Germany."
  ru:
    - "Гомера обычно отождествляют с народом, который ассирийцы называли гимирраи, а греки киммерийцами: это конные кочевники степей к северу от Кавказа и Чёрного моря, ворвавшиеся на Ближний Восток в конце VIII в. до н. э. Родословие народов называет Гомера первым из сыновей Иафета и отцом Аскеназа, Рифата и Фогармы. В видении Иезекииля о Гоге в северное войско входят «Гомера со всеми отрядами его, дом Фогарма, от пределов севера». Средневековое армянское предание перенесло имя Гомера на Каппадокию, по-армянски Гамирк."
    - "Киммерийцы впервые появляются в донесениях Саргону II в 714 г. до н. э., сообщающих о поражении, которое они нанесли Урарту. При Асархаддоне большая их часть ушла на запад, в Анатолию. Ок. 644 г. до н. э. под началом своего царя Лигдамиса (Дугдамме ассирийских текстов) они разорили Сарды, кроме акрополя, и лидийский царь Гиг был убит. Геродот пишет, что они взяли Сарды при сыне Гига Ардисе и что лидийский царь Алиатт изгнал их из Азии; ок. 635 г. до н. э. их сила была сломлена скифами и лидийцами."
    - "Греческие писатели сохранили имя киммерийцев. «Одиссея» помещает народ с этим именем у течения Океана, окутанный мглой и облаками, где на него никогда не светит солнце. Геродот пишет, что скифы изгнали киммерийцев из их страны к северу от Чёрного моря, что те бежали в Азию вдоль побережья и поселились на полуострове, где позднее стоял греческий город Синопа, и что в Скифии в его время ещё были киммерийские укрепления, киммерийская переправа и пролив, называемый Киммерийским Боспором. Иосиф Флавий писал, что Гомер стал родоначальником народа, который греки его времени называли галатами, а прежде звали гомерянами. Вавилонский Талмуд отождествляет Гомера с Гермамьей — именем, которое Еврейская энциклопедия читает либо как киммерийцев, либо как Германию."
  uk:
    - "Гомера зазвичай ототожнюють із народом, якого ассирійці називали Гіміррая, а греки — кіммерійцями: кочівниками-вершниками зі степів на північ від Кавказу та Чорного моря, які вдерлися на Близький Схід наприкінці VIII ст. до н. е. Таблиця народів називає Гомера першим серед синів Яфета й батьком Аскеназа, Ріфата й Фогарми. У видінні Єзекіїля про Гога серед північного війська названо: «Гомера й усю ватагу його, дом Тогармів із ватагами його від північних гряниць». Середньовічна вірменська традиція дала ім'я Гомера Каппадокії, яку вірменською називали Гамірк."
    - "Кіммерійці вперше з'являються у звітах, надісланих Саргонові II 714 р. до н. е., що розповідають про поразку, якої вони завдали Урарту. За Асархаддона більшість із них перейшла на захід, в Анатолію. Близько 644 р. до н. е. під проводом свого царя Лігдаміса (Дугдамме в ассирійських текстах) вони пограбували Сарди, крім цитаделі, і Гіг Лідійський був убитий. Геродот каже, що вони взяли Сарди за царювання Гігового сина Ардіса й що Аліатт Лідійський вигнав їх з Азії; близько 635 р. до н. е. їхню міць зламали скіфи та лідійці."
    - "Грецькі письменники зберегли ім'я кіммерійців. «Одіссея» поміщає народ із цим ім'ям біля течії Океану, оповитий імлою та хмарами, де на нього ніколи не світить сонце. Геродот пише, що скіфи вигнали кіммерійців з їхньої країни на північ від Чорного моря, що ті втекли в Азію вздовж узбережжя й оселилися на півострові, де згодом постало грецьке місто Сінопа, і що в Скіфії за його часів ще були кіммерійські укріплення, кіммерійська переправа та протока, звана Кіммерійським Боспором. Йосип Флавій писав, що Гомер започаткував народ, який греки його часу називали галатами, а колись звали гомерянами. Вавилонський Талмуд ототожнює Гомера з Гермамією — назвою, яку Jewish Encyclopedia читає або як кіммерійців, або як Германію."
  es:
    - "Gomer se identifica por lo general con el pueblo que los asirios llamaban Gimirraya y los griegos Kimmerioi, los cimerios: nómadas jinetes de las estepas al norte del Cáucaso y del mar Negro que irrumpieron en el Próximo Oriente a fines del siglo VIII a. C. La tabla de las naciones nombra a Gomer el primero entre los hijos de Jafet y padre de Askenaz, Rifat y Togarma. En la visión de Gog en Ezequiel, la hueste del norte incluye a «Gomer, y todas sus compañías; la casa de Togarma, á los lados del norte». La tradición armenia medieval dio el nombre de Gomer a Capadocia, llamada Gamirk en armenio."
    - "Los cimerios aparecen por primera vez en informes enviados a Sargón II en 714 a. C., que cuentan una derrota que infligieron a Urartu. Bajo Esar-hadón la mayoría se desplazó al oeste, a Anatolia. Hacia 644 a. C., bajo su rey Ligdamis (Dugdamme en los textos asirios), saquearon Sardis, salvo su ciudadela, y murió Giges de Lidia. Heródoto dice que tomaron Sardis en el reinado de Ardis, hijo de Giges, y que Aliates de Lidia los expulsó de Asia; hacia 635 a. C. su poder estaba quebrado por escitas y lidios."
    - "Los escritores griegos conservaron el nombre de los cimerios. La Odisea sitúa a un pueblo de ese nombre junto a la corriente del Océano, envuelto en niebla y nubes, donde el sol nunca lo alumbra. Heródoto dice que los escitas expulsaron a los cimerios de su país al norte del mar Negro, que estos huyeron a Asia a lo largo de la costa y se asentaron en la península donde más tarde se alzó la ciudad griega de Sinope, y que en su tiempo Escitia conservaba aún fortalezas cimerias, un paso cimerio y un estrecho llamado Bósforo Cimerio. Josefo escribió que Gomer fundó el pueblo al que los griegos de su tiempo llamaban gálatas, y que antes se llamaba gomeritas. El Talmud de Babilonia identifica a Gomer con Germamya, nombre que la Jewish Encyclopedia lee como los cimerios o como Germania."
  de:
    - "Gomer wird allgemein mit dem Volk gleichgesetzt, das die Assyrer Gimirraja und die Griechen Kimmerier nannten: berittene Nomaden aus den Steppen nördlich des Kaukasus und des Schwarzen Meeres, die am Ende des achten Jahrhunderts v. Chr. in den Vorderen Orient einbrachen. Die Völkertafel nennt Gomer als Ersten unter den Söhnen Jafets und als Vater von Aschkenas, Rifat und Togarma. In Hesekiels Gog-Vision gehört zum Heer aus dem Norden: „Gomer und all sein Heer samt dem Hause Thogarma, so gegen Mitternacht liegt, mit all seinem Heer“. Die mittelalterliche armenische Überlieferung gab Gomers Namen Kappadokien, auf Armenisch Gamirk."
    - "Die Kimmerier erscheinen erstmals in Berichten an Sargon II. aus dem Jahr 714 v. Chr., die von einer Niederlage erzählen, die sie Urartu beibrachten. Unter Asarhaddon zog die Mehrzahl von ihnen nach Westen nach Anatolien. Um 644 v. Chr. plünderten sie unter ihrem König Lygdamis (assyrisch Dugdamme) Sardes, bis auf die Burg, und Gyges von Lydien wurde getötet. Herodot sagt, sie hätten Sardes unter Ardys, dem Sohn des Gyges, genommen und Alyattes von Lydien habe sie aus Asien vertrieben; um 635 v. Chr. war ihre Macht von Skythen und Lydern gebrochen."
    - "Griechische Schriftsteller bewahrten den Namen der Kimmerier. Die Odyssee setzt ein Volk dieses Namens an die Strömung des Okeanos, in Nebel und Wolken gehüllt, wo die Sonne nie auf sie scheint. Herodot sagt, die Skythen hätten die Kimmerier aus ihrem Land nördlich des Schwarzen Meeres vertrieben, diese seien an der Küste entlang nach Asien geflohen und hätten sich auf der Halbinsel niedergelassen, auf der später die griechische Stadt Sinope stand, und Skythien habe zu seiner Zeit noch kimmerische Festungen, eine kimmerische Fähre und eine Meerenge namens Kimmerischer Bosporus. Josephus schrieb, Gomer habe das Volk begründet, das die Griechen seiner Zeit Galater nannten und das einst Gomeriter hieß. Der Babylonische Talmud setzt Gomer mit Germamja gleich, einem Namen, den die Jewish Encyclopedia entweder als die Kimmerier oder als Germanien liest."
  fr:
    - "On identifie généralement Gomer avec le peuple que les Assyriens appelaient Gimirraya et les Grecs Kimmerioi, les Cimmériens : nomades cavaliers des steppes au nord du Caucase et de la mer Noire qui firent irruption au Proche-Orient à la fin du VIIIe siècle av. J.-C. La table des nations nomme Gomer en premier parmi les fils de Japhet et père d’Aschkenaz, de Riphat et de Togarma. Dans la vision d’Ézéchiel sur Gog, l’armée du nord comprend « Gomer et toutes ses troupes, la maison de Togarma, à l’extrémité du septentrion ». La tradition arménienne médiévale donna le nom de Gomer à la Cappadoce, appelée Gamirk en arménien."
    - "Les Cimmériens apparaissent pour la première fois dans des rapports envoyés à Sargon II en 714 av. J.-C., qui racontent une défaite qu’ils infligèrent à l’Urartu. Sous Esar-Haddon, la plupart d’entre eux passèrent à l’ouest, en Anatolie. Vers 644 av. J.-C., sous leur roi Lygdamis (Dougdammé dans les textes assyriens), ils pillèrent Sardes, sauf sa citadelle, et Gygès de Lydie fut tué. Hérodote dit qu’ils prirent Sardes sous le règne d’Ardys, fils de Gygès, et qu’Alyatte de Lydie les chassa d’Asie ; vers 635 av. J.-C., leur puissance fut brisée par les Scythes et les Lydiens."
    - "Les écrivains grecs ont gardé le nom des Cimmériens. L’Odyssée place un peuple de ce nom au bord du cours de l’Océan, enveloppé de brume et de nuées, là où le soleil ne luit jamais sur lui. Hérodote dit que les Scythes chassèrent les Cimmériens de leur pays au nord de la mer Noire, que ceux-ci s’enfuirent en Asie le long de la côte et s’établirent sur la péninsule où se dressa plus tard la cité grecque de Sinope, et que la Scythie gardait encore de son temps des forts cimmériens, un passage cimmérien et un détroit appelé le Bosphore cimmérien. Josèphe écrit que Gomer fonda le peuple que les Grecs de son temps appelaient Galates, et qu’on appelait autrefois Gomérites. Le Talmud de Babylone identifie Gomer à Germamya, nom que la Jewish Encyclopedia lit soit comme les Cimmériens, soit comme la Germanie."
  pt:
    - "Gômer é geralmente identificado com o povo que os assírios chamavam Gimirraya e os gregos Kimmerioi, os cimérios: nômades a cavalo das estepes ao norte do Cáucaso e do mar Negro que irromperam no Oriente Próximo no final do século VIII a.C. A tabela das nações nomeia Gômer em primeiro lugar entre os filhos de Jafé e pai de Asquenaz, Rifate e Togarma. Na visão de Ezequiel sobre Gogue, o exército do norte inclui “Gômer e todas as suas hordas; a casa de Togarma, nos confins do norte”. A tradição armênia medieval deu o nome de Gômer à Capadócia, chamada Gamirk em armênio."
    - "Os cimérios aparecem pela primeira vez em relatórios enviados a Sargão II em 714 a.C., que contam uma derrota que infligiram a Urartu. Sob Esar-Hadom, a maioria deles se mudou para o oeste, para a Anatólia. Por volta de 644 a.C., sob seu rei Lígdamis (Dugdamme nos textos assírios), saquearam Sardes, exceto a cidadela, e Giges da Lídia foi morto. Heródoto diz que tomaram Sardes no reinado de Árdis, filho de Giges, e que Aliates da Lídia os expulsou da Ásia; por volta de 635 a.C. seu poder foi quebrado por citas e lídios."
    - "Os escritores gregos conservaram o nome dos cimérios. A Odisseia situa um povo com esse nome junto à corrente do Oceano, envolto em névoa e nuvens, onde o sol nunca o ilumina. Heródoto diz que os citas expulsaram os cimérios de sua terra ao norte do mar Negro, que eles fugiram para a Ásia ao longo da costa e se estabeleceram na península onde mais tarde se ergueu a cidade grega de Sínope, e que em seu tempo a Cítia ainda tinha fortificações cimérias, uma travessia ciméria e um estreito chamado Bósforo Cimério. Josefo escreveu que Gômer fundou o povo que os gregos de seu tempo chamavam gálatas, outrora chamados gomeritas. O Talmude Babilônico identifica Gômer com Germamya, nome que a Jewish Encyclopedia lê como os cimérios ou como a Germânia."
  it:
    - "Gomer è identificato in genere con il popolo che gli Assiri chiamavano Gimirraya e i Greci Kimmerioi, i Cimmeri: nomadi a cavallo delle steppe a nord del Caucaso e del Mar Nero che irruppero nel Vicino Oriente alla fine dell’VIII secolo a.C. La tavola dei popoli nomina Gomer per primo tra i figli di Iafet e padre di Aschenàz, Rifat e Togarma. Nella visione di Ezechiele su Gog l’esercito del nord comprende «Gomer e tutte le sue schiere, la casa di Togarma dell’estremità del settentrione». La tradizione armena medievale diede il nome di Gomer alla Cappadocia, chiamata Gamirk in armeno."
    - "I Cimmeri compaiono per la prima volta nei rapporti inviati a Sargon II nel 714 a.C., che riferiscono di una sconfitta da loro inflitta a Urartu. Sotto Assaraddon la maggior parte di essi si spostò a ovest, in Anatolia. Verso il 644 a.C., sotto il loro re Licdami (Dugdamme nei testi assiri), saccheggiarono Sardi, tranne la cittadella, e Gige di Lidia fu ucciso. Erodoto dice che presero Sardi sotto il regno di Ardi, figlio di Gige, e che Aliatte di Lidia li scacciò dall’Asia; verso il 635 a.C. la loro potenza fu spezzata da Sciti e Lidi."
    - "Gli scrittori greci conservarono il nome dei Cimmeri. L’Odissea pone un popolo con questo nome presso la corrente di Oceano, avvolto di nebbia e di nubi, dove il sole non lo illumina mai. Erodoto dice che gli Sciti cacciarono i Cimmeri dal loro paese a nord del Mar Nero, che essi fuggirono in Asia lungo la costa e si stabilirono sulla penisola dove poi sorse la città greca di Sinope, e che ai suoi tempi la Scizia conservava ancora fortezze cimmerie, un traghetto cimmerio e uno stretto chiamato Bosforo Cimmerio. Giuseppe Flavio scrisse che Gomer fondò il popolo che i Greci del suo tempo chiamavano Galati, e che un tempo si chiamava Gomeriti. Il Talmud babilonese identifica Gomer con Germamya, nome che la Jewish Encyclopedia legge come i Cimmeri oppure come la Germania."
  nl:
    - "Gomer wordt algemeen vereenzelvigd met het volk dat de Assyriërs Gimirraya en de Grieken Kimmerioi noemden, de Cimmeriërs: paardrijdende nomaden van de steppen ten noorden van de Kaukasus en de Zwarte Zee die aan het einde van de achtste eeuw v.Chr. het Nabije Oosten binnenvielen. De volkerentafel noemt Gomer als eerste onder de zonen van Jafet en vader van Askenaz, Rifat en Togarma. In Ezechiëls visioen van Gog omvat het noordelijke leger “Gomer en al zijn benden, en het huis van Togarma, aan de zijden van het noorden”. De middeleeuwse Armeense overlevering gaf Gomers naam aan Cappadocië, in het Armeens Gamirk genoemd."
    - "De Cimmeriërs verschijnen voor het eerst in berichten aan Sargon II in 714 v.Chr., die vertellen van een nederlaag die zij Urartu toebrachten. Onder Esarhaddon trokken de meesten van hen westwaarts naar Anatolië. Omstreeks 644 v.Chr. plunderden zij onder hun koning Lygdamis (in Assyrische teksten Dugdamme) Sardes, op de burcht na, en Gyges van Lydië werd gedood. Herodotus zegt dat zij Sardes innamen onder Ardys, de zoon van Gyges, en dat Alyattes van Lydië hen uit Azië verdreef; omstreeks 635 v.Chr. was hun macht door Scythen en Lydiërs gebroken."
    - "Griekse schrijvers bewaarden de naam van de Cimmeriërs. De Odyssee plaatst een volk met die naam aan de stroom van Oceanus, gehuld in nevel en wolken, waar de zon nooit op hen schijnt. Herodotus zegt dat de Scythen de Cimmeriërs uit hun land ten noorden van de Zwarte Zee verdreven, dat zij langs de kust naar Azië vluchtten en zich vestigden op het schiereiland waar later de Griekse stad Sinope stond, en dat Scythië in zijn tijd nog Cimmerische vestingen, een Cimmerisch veer en een zeestraat met de naam Cimmerische Bosporus had. Josephus schreef dat Gomer het volk stichtte dat de Grieken van zijn tijd Galaten noemden en dat eens Gomerieten heette. De Babylonische Talmoed stelt Gomer gelijk met Germamya, een naam die de Jewish Encyclopedia leest als de Cimmeriërs of als Germanië."
  pl:
    - "Gomer utożsamia się zwykle z ludem, który Asyryjczycy nazywali Gimirraja, a Grecy Kimmerioi, czyli Cymeryjczykami: konnymi koczownikami ze stepów na północ od Kaukazu i Morza Czarnego, którzy wdarli się na Bliski Wschód pod koniec VIII w. p.n.e. Tablica narodów wymienia Gomera jako pierwszego z synów Jafeta i ojca Aszkenaza, Rifata i Togarmy. W wizji Ezechiela o Gogu północne wojsko obejmuje „Gomer i wszystkie hufy jego, dom Togormy mieszkającego w stronach północnych”. Średniowieczna tradycja ormiańska nadała imię Gomera Kapadocji, zwanej po ormiańsku Gamirk."
    - "Cymeryjczycy pojawiają się po raz pierwszy w raportach przesyłanych Sargonowi II w 714 p.n.e., donoszących o klęsce, jaką zadali Urartu. Za Asarhaddona większość z nich przeniosła się na zachód, do Anatolii. Około 644 p.n.e., pod wodzą króla Lygdamisa (w tekstach asyryjskich Dugdamme), złupili Sardes, z wyjątkiem cytadeli, a Gyges z Lidii zginął. Herodot mówi, że zdobyli Sardes za panowania syna Gygesa, Ardysa, i że Alyattes z Lidii wypędził ich z Azji; około 635 p.n.e. ich potęgę złamali Scytowie i Lidyjczycy."
    - "Pisarze greccy zachowali imię Cymeryjczyków. Odyseja umieszcza lud o tym imieniu nad nurtem Okeanosu, spowity mgłą i chmurami, gdzie nigdy nie świeci mu słońce. Herodot mówi, że Scytowie wypędzili Cymeryjczyków z ich kraju na północ od Morza Czarnego, że ci uciekli wzdłuż wybrzeża do Azji i osiedlili się na półwyspie, na którym później stanęło greckie miasto Synopa, i że w jego czasach Scytia miała jeszcze cymeryjskie umocnienia, cymeryjską przeprawę i cieśninę zwaną Bosforem Cymeryjskim. Józef Flawiusz pisał, że Gomer dał początek ludowi, który Grecy jego czasów nazywali Galatami, a niegdyś zwano go Gomerytami. Talmud babiloński utożsamia Gomera z Germamią, nazwą, którą Jewish Encyclopedia odczytuje jako Cymeryjczyków albo jako Germanię."
  cs:
    - "Gomer se obecně ztotožňuje s lidem, který Asyřané nazývali Gimirraja a Řekové Kimmerioi, tedy s Kimmeřany: jízdními kočovníky ze stepí severně od Kavkazu a Černého moře, kteří vtrhli na Blízký východ koncem osmého století př. n. l. Tabulka národů jmenuje Gomera jako prvního z synů Jafetových a otce Aškenaze, Rífata a Togarmy. Ve vidění Ezechielově o Gogovi zahrnuje severní vojsko „Gomera i všecky houfy jeho, dům Togarmy od stran půlnočních“. Středověká arménská tradice dala Gomerovo jméno Kappadokii, arménsky zvané Gamirk."
    - "Kimmeřané se poprvé objevují ve zprávách zaslaných Sargonovi II. roku 714 př. n. l., které vypráví o porážce, již způsobili Urartu. Za Asarhadóna se většina z nich přesunula na západ do Anatolie. Kolem roku 644 př. n. l. pod svým králem Lygdamem (v asyrských textech Dugdamme) vyplenili Sardy, vyjma citadely, a lýdský Gýgés byl zabit. Hérodotos říká, že dobyli Sardy za vlády Gýgova syna Ardya a že je z Asie vyhnal lýdský Alyattés; asi do roku 635 př. n. l. byla jejich moc zlomena Skythy a Lýdy."
    - "Řečtí spisovatelé uchovali jméno Kimmeřanů. Odysseia klade lid tohoto jména k proudu Ókeanu, zahalený mlhou a mraky, kde mu slunce nikdy nesvítí. Hérodotos říká, že Skythové vyhnali Kimmeřany z jejich země severně od Černého moře, že ti uprchli podél pobřeží do Asie a usadili se na poloostrově, kde později stálo řecké město Sinópé, a že ve Skythii byly za jeho dnů ještě kimmerské pevnosti, kimmerský přívoz a průliv zvaný Kimmerský Bospor. Josefus napsal, že Gomer založil lid, kterému Řekové jeho doby říkali Galaté a který se kdysi nazýval Gomeřané. Babylonský talmud ztotožňuje Gomera s Germamjou, jménem, které Jewish Encyclopedia čte buď jako Kimmeřany, nebo jako Germánii."
  sv:
    - "Gomer identifieras allmänt med folket som assyrierna kallade Gimirraya och grekerna Kimmerioi, kimmerierna: ryttarnomader från stäppen norr om Kaukasus och Svarta havet som bröt in i Främre Orienten i slutet av 700-talet f.Kr. Folkens tavla nämner Gomer först bland Jafets söner och som far till Ashkenas, Rifat och Togarma. I Hesekiels syn om Gog ingår i den nordliga hären ”Gomer och alla dess härskaror, Togarmas folk ifrån den yttersta norden”. Medeltida armenisk tradition gav Gomers namn åt Kappadokien, på armeniska kallat Gamirk."
    - "Kimmerierna dyker först upp i rapporter till Sargon II år 714 f.Kr., som berättar om ett nederlag de tillfogade Urartu. Under Esarhaddon flyttade de flesta av dem västerut till Anatolien. Omkring 644 f.Kr., under sin kung Lygdamis (Dugdamme i assyriska texter), plundrade de Sardes, allt utom citadellet, och Gyges av Lydien dödades. Herodotos säger att de intog Sardes under Gyges son Ardys regering och att Alyattes av Lydien drev dem ut ur Asien; omkring 635 f.Kr. var deras makt bruten av skyter och lydier."
    - "Grekiska författare bevarade kimmeriernas namn. Odysséen placerar ett folk med det namnet vid Okeanos ström, höljt i dimma och moln, där solen aldrig lyser på dem. Herodotos säger att skyterna drev kimmerierna ut ur deras land norr om Svarta havet, att de flydde längs kusten till Asien och slog sig ner på den halvö där den grekiska staden Sinope senare låg, och att Skytien på hans tid ännu hade kimmeriska befästningar, en kimmerisk färja och ett sund som kallades Kimmeriska Bosporen. Josefus skrev att Gomer grundade det folk som grekerna på hans tid kallade galater och som en gång kallades gomeriter. Babyloniska talmud likställer Gomer med Germamya, ett namn som Jewish Encyclopedia läser antingen som kimmerierna eller som Germanien."
  nb:
    - "Gomer identifiseres vanligvis med folket assyrerne kalte Gimirraya og grekerne Kimmerioi, kimmerierne: hesteridende nomader fra steppene nord for Kaukasus og Svartehavet som brøt inn i Midtøsten mot slutten av 700-tallet f.Kr. Folkeslagstabellen nevner Gomer først blant Jafets sønner og som far til Asjkenas, Rifat og Togarma. I Esekiels syn om Gog omfatter den nordlige hæren «Gomer og alle dets skarer, Togarma-folket i det ytterste Norden». Middelalderens armenske tradisjon ga Gomers navn til Kappadokia, kalt Gamirk på armensk."
    - "Kimmerierne dukker først opp i rapporter sendt til Sargon 2. i 714 f.Kr., som forteller om et nederlag de påførte Urartu. Under Asarhaddon flyttet de fleste av dem vestover til Anatolia. Omkring 644 f.Kr., under sin konge Lygdamis (Dugdamme i assyriske tekster), plyndret de Sardes, alt unntatt citadellet, og Gyges av Lydia ble drept. Herodot sier at de inntok Sardes i regjeringstiden til Gyges' sønn Ardys og at Alyattes av Lydia drev dem ut av Asia; omkring 635 f.Kr. var deres makt brutt av skyterne og lydierne."
    - "Greske forfattere tok vare på kimmeriernes navn. Odysseen plasserer et folk med det navnet ved Okeanos' strøm, innhyllet i tåke og skyer, der solen aldri skinner på dem. Herodot sier at skyterne drev kimmerierne ut av landet deres nord for Svartehavet, at de flyktet langs kysten til Asia og slo seg ned på halvøya der den greske byen Sinope senere lå, og at Skytia på hans tid ennå hadde kimmeriske festninger, en kimmerisk ferje og et sund som ble kalt Den kimmeriske Bosporos. Josefus skrev at Gomer grunnla folket som grekerne på hans tid kalte galatere, og som en gang ble kalt gomeritter. Den babylonske Talmud setter Gomer likt med Germamya, et navn som Jewish Encyclopedia leser enten som kimmerierne eller som Germania."
  tl:
    - "Ang Gomer ay karaniwang tinutukoy sa mga taong tinawag ng mga Asirio na Gimirraya at ng mga Griyego na Kimmerioi, ang mga Cimmerian: mga nomadang nangangabayo mula sa mga estepa sa hilaga ng Caucasus at ng Dagat Itim na sumugod sa Malapit na Silangan sa katapusan ng ika-8 siglo BK. Pinangangalanan ng talaan ng mga bansa ang Gomer na una sa mga anak ni Japhet at ama nina Aschenaz, Rifat at Togarma. Sa pangitain ni Ezekiel tungkol kay Gog, kabilang sa hukbo ng hilaga ang “Gomer at ang lahat niyang mga pulutong; ang sangbahayan ni Togarma sa mga pinakahuling bahagi ng hilagaan”. Ibinigay ng tradisyong Armenio noong Edad Medya ang pangalan ni Gomer sa Capadocia, na tinatawag na Gamirk sa Armenio."
    - "Unang lumilitaw ang mga Cimmerian sa mga ulat na ipinadala kay Sargon II noong 714 BK, na nagsasalaysay ng pagkatalong ibinigay nila sa Urartu. Sa ilalim ni Esar-hadon, karamihan sa kanila ay lumipat sa kanluran patungong Anatolia. Mga 644 BK, sa ilalim ng kanilang haring si Lygdamis (Dugdamme sa mga tekstong Asirio), sinamsam nila ang Sardis, maliban sa kuta nito, at napatay si Gyges ng Lidia. Sinasabi ni Herodotus na sinakop nila ang Sardis sa paghahari ni Ardys, anak ni Gyges, at na pinalayas sila ni Alyattes ng Lidia mula sa Asia; pagsapit ng mga 635 BK nasira ang kanilang kapangyarihan ng mga Scythian at Lidiano."
    - "Iningatan ng mga manunulat na Griyego ang pangalan ng mga Cimmerian. Inilalagay ng Odisea ang isang bayang may ganitong pangalan sa tabi ng agos ng Karagatan, nababalot ng ulap at ambon, kung saan hindi sila kailanman sinisikatan ng araw. Sinasabi ni Herodotus na pinalayas ng mga Scythian ang mga Cimmerian mula sa kanilang lupain sa hilaga ng Dagat na Itim, na tumakas sila sa Asia sa kahabaan ng baybayin at nanirahan sa tangway kung saan nang maglaon ay tumayo ang lungsod na Griyego ng Sinope, at na sa kaniyang panahon ay may mga kutang Cimmerian pa sa Scythia, isang tawirang Cimmerian at ang kipot na Bosporong Cimmerian. Isinulat ni Josephus na itinatag ni Gomer ang bayang tinawag ng mga Griyego noong panahon niya na mga Galata, dating mga Gomerita. Iniuugnay ng Talmud ng Babilonia si Gomer sa Germamya, pangalang binabasa ng Jewish Encyclopedia bilang mga Cimmerian o bilang Germania."
  da:
    - "Gomer identificeres almindeligvis med det folk, assyrerne kaldte Gimirraya og grækerne Kimmerioi, kimmerierne: hesteridende nomader fra steppen nord for Kaukasus og Sortehavet, som brød ind i Nærorienten i slutningen af 700-tallet f.Kr. Folketavlen nævner Gomer først blandt Jafets sønner og som far til Asjkenaz, Rifat og Togarma. I Ezekiels syn om Gog omfatter nordens hær »Gomer og alle hans Hære, Thogarmas Hus i det yderste Nord«. Middelalderlig armensk tradition gav Gomers navn til Kappadokien, på armensk kaldet Gamirk."
    - "Kimmerierne dukker første gang op i rapporter sendt til Sargon II i 714 f.Kr. om et nederlag, de påførte Urartu. Under Esarhaddon drog de fleste af dem vestpå ind i Anatolien. Omkring 644 f.Kr. plyndrede de under deres konge Lygdamis (Dugdamme i assyriske tekster) Sardes på nær citadellet, og Gyges af Lydien blev dræbt. Herodot siger, at de indtog Sardes under Gyges' søn Ardys, og at Alyattes af Lydien drev dem ud af Asien; omkring 635 f.Kr. var deres magt brudt af skyterne og lydierne."
    - "Græske forfattere bevarede kimmeriernes navn. Odysseen anbringer et folk af det navn ved Okeanos' strøm, hyllet i tåge og skyer, hvor solen aldrig skinner på dem. Herodot siger, at skyterne drev kimmerierne ud af deres land nord for Sortehavet, at de flygtede langs kysten til Asien og slog sig ned på den halvø, hvor den græske by Sinope senere lå, og at Skythien på hans tid endnu havde kimmeriske fæstninger, en kimmerisk færge og et stræde kaldet Den Kimmeriske Bosporus. Josefus skrev, at Gomer grundlagde det folk, som grækerne på hans tid kaldte galatere, og som engang blev kaldt gomeritter. Den babyloniske Talmud sidestiller Gomer med Germamya, et navn som Jewish Encyclopedia læser enten som kimmerierne eller som Germanien."
  sr:
    - "Гомер се обично поистовећује с народом који су Асирци звали Гимираја, а Грци Кимерији, Кимерци: коњички номади са степа северно од Кавказа и Црног мора који су упали на Блиски исток крајем осмог века п. н. е. Табела народа именује Гомера као првог међу Јафетовим синовима и као оца Асхенаса, Рифата и Тогарме. У Језекиљевој визији Гога северна војска обухвата „Гомера и све чете његове, дом Тогармин са северног краја“. Средњовековно јерменско предање дало је Гомерово име Кападокији, на јерменском званој Гамирк."
    - "Кимерци се први пут појављују у извештајима упућеним Саргону II 714. п. н. е., који говоре о поразу који су нанели Урарту. Под Есарадоном већина њих се преселила на запад у Анатолију. Око 644. п. н. е., под својим царем Лигдамисом (Дугдаме у асирским текстовима), опљачкали су Сард, све осим његове цитаделе, и Гиг Лидијски је погинуо. Херодот каже да су узели Сард за владавине Гиговог сина Ардиса и да их је Алијат Лидијски отерао из Азије; око 635. п. н. е. њихову моћ су сломили Скити и Лиђани."
    - "Грчки писци сачували су име Кимераца. Одисеја смешта народ тог имена крај тока Океана, обавијен маглом и облацима, где га сунце никад не обасјава. Херодот каже да су Скити протерали Кимерце из њихове земље северно од Црног мора, да су ови побегли дуж обале у Азију и населили се на полуострву где је касније стајао грчки град Синопа, и да је Скитија у његово време још имала кимерске утврде, кимерски прелаз и мореуз назван Кимерски Босфор. Јосиф Флавије је писао да је Гомер основао народ који су Грци његовог доба звали Галатима, а који се некада звао Гомерци. Вавилонски талмуд поистовећује Гомера с Гермамијом, именом које Јеврејска енциклопедија чита или као Кимерце или као Германију."
  hu:
    - "Gómert általában azzal a néppel azonosítják, amelyet az asszírok gimirrajának, a görögök kimmeriosznak neveztek, vagyis a kimmerekkel: a Kaukázustól és a Fekete-tengertől északra fekvő sztyeppék lovas nomádjaival, akik a Kr. e. 8. század végén törtek be a Közel-Keletre. A népek táblázata Gómert említi először Jáfet fiai közt, Askenáz, Rifát és Tógarma atyjaként. Ezékiel Góg-látomásában az északi sereghez tartozik „Gómer és minden serege, Tógarma háza messze északról minden seregével”. A középkori örmény hagyomány Gómer nevét Kappadókiának adta, amelyet örményül Gamirknak hívnak."
    - "A kimmerek először a Kr. e. 714-ben II. Szargonnak küldött jelentésekben tűnnek fel, amelyek az Urartun elszenvedett vereségükről szólnak. Asszarhaddon alatt többségük nyugatra, Anatóliába vonult. Kr. e. 644 körül királyuk, Lügdamisz (az asszír szövegekben Dugdamme) alatt kifosztották Szárdiszt, a fellegvár kivételével, és Gügész lüdiai király elesett. Hérodotosz szerint Szárdiszt Gügész fia, Ardüsz idején foglalták el, és a lüdiai Alüattész űzte ki őket Ázsiából; Kr. e. 635 körül hatalmukat a szkíták és a lüdiaiak megtörték."
    - "A görög írók megőrizték a kimmerek nevét. Az Odüsszeia egy ilyen nevű népet az Ókeanosz árja mellé helyez, ködbe és felhőbe burkolva, ahol soha nem süt rájuk a nap. Hérodotosz szerint a szkíták kiűzték a kimmereket a Fekete-tengertől északra fekvő földjükről, ők pedig a part mentén Ázsiába menekültek, és azon a félszigeten telepedtek le, ahol később Szinópé görög városa állt; Szkítiában az ő idejében még voltak kimmer erődök, kimmer rév és egy Kimmer Boszporosznak nevezett szoros. Josephus azt írta, hogy Gómer alapította azt a népet, amelyet kora görögjei galatáknak neveztek, egykor pedig gómeritáknak hívtak. A Babilóniai Talmud Gómert Germamjával azonosítja; ezt a nevet a Jewish Encyclopedia vagy a kimmerekként, vagy Germániaként olvassa."
  fi:
    - "Gomer tunnistetaan yleensä kansaksi, jota assyrialaiset kutsuivat nimellä Gimirraya ja kreikkalaiset nimellä Kimmerioi, kimmerit: hevosella ratsastavat paimentolaiset Kaukasuksen ja Mustanmeren pohjoispuolisilta aroilta, jotka tunkeutuivat Lähi-itään 700-luvun eaa. lopulla. Kansojen taulu nimeää Gomerin ensimmäisenä Jafetin pojista ja Askenasin, Rifatin ja Togarman isänä. Hesekielin Gog-näyssä pohjoiseen joukkoon kuuluvat ”Goomer ja kaikki sen sotalaumat, Toogarman heimo pohjan periltä”. Keskiaikainen armenialainen perinne antoi Gomerin nimen Kappadokialle, armeniaksi Gamirk."
    - "Kimmerit esiintyvät ensimmäisen kerran Sargon II:lle vuonna 714 eaa. lähetetyissä raporteissa, jotka kertovat heidän Urartulle aiheuttamastaan tappiosta. Esarhaddonin aikana useimmat heistä siirtyivät länteen Anatoliaan. Noin vuonna 644 eaa. heidän kuninkaansa Lygdamiksen (assyrialaisissa teksteissä Dugdamme) johdolla he ryöstivät Sardeksen, lukuun ottamatta sen kaupunkilinnaa, ja Lyydian Gyges kaatui. Herodotos sanoo heidän vallanneen Sardeksen Gygesin pojan Ardyksen hallituskaudella ja että Lyydian Alyattes ajoi heidät pois Aasiasta; noin vuoteen 635 eaa. mennessä skyyttalaiset ja lyydialaiset olivat murtaneet heidän valtansa."
    - "Kreikkalaiset kirjailijat säilyttivät kimmerien nimen. Odysseia sijoittaa tämännimisen kansan Okeanoksen virran äärelle, sumun ja pilvien verhoamaksi, missä aurinko ei koskaan paista heille. Herodotos kertoo, että skyyttalaiset ajoivat kimmerit pois heidän maastaan Mustanmeren pohjoispuolelta, että nämä pakenivat rannikkoa pitkin Aasiaan ja asettuivat niemimaalle, jolle kreikkalainen Sinopen kaupunki myöhemmin rakennettiin, ja että Skytiassa oli hänen aikanaan yhä kimmerien linnoituksia, kimmerien lautta ja salmi nimeltä Kimmerien Bosporos. Josephus kirjoitti, että Gomer perusti kansan, jota hänen aikansa kreikkalaiset kutsuivat galatalaisiksi ja jota aiemmin kutsuttiin gomerilaisiksi. Babylonialainen talmud samastaa Gomerin Germamyaan, nimeen, jonka Jewish Encyclopedia lukee joko kimmereiksi tai Germaniaksi."
  vi:
    - "Gô-me thường được đồng nhất với dân mà người A-si-ri gọi là Gimirraya và người Hy Lạp gọi là Kimmerioi, tức người Cimmeria: những dân du mục cưỡi ngựa từ thảo nguyên phía bắc Caucasus và Biển Đen đã tràn vào Cận Đông vào cuối thế kỷ 8 TCN. Bảng các dân tộc nêu Gô-me đầu tiên trong các con trai của Gia-phết và là cha của Ách-kê-na, Ri-phát và Tô-ga-ma. Trong khải tượng của Ê-xê-chi-ên về Gót, đạo quân phương bắc gồm “Gô-me và hết thảy quân đội nó, nhà Tô-ga-ma ở phía cực bắc với hết thảy bè đảng nó”. Truyền thống Armenia thời trung cổ đặt tên Gô-me cho Cáp-ba-đốc, mà tiếng Armenia gọi là Gamirk."
    - "Người Cimmeria lần đầu xuất hiện trong các báo cáo gửi cho Sargon II năm 714 TCN, kể về một thất bại họ gây ra cho Urartu. Dưới thời Ê-sạt-ha-đôn, phần lớn họ di chuyển về phía tây vào Anatolia. Khoảng năm 644 TCN, dưới vua Lygdamis (Dugdamme trong các văn bản A-si-ri), họ cướp phá Sạt-đe, trừ thành lũy, và Gyges của Ly-đi bị giết. Herodotus nói họ chiếm Sạt-đe dưới triều Ardys, con của Gyges, và rằng Alyattes của Ly-đi đã đánh đuổi họ khỏi A-si; đến khoảng năm 635 TCN quyền lực của họ bị người Scythia và người Ly-đi bẻ gãy."
    - "Các tác giả Hy Lạp vẫn giữ tên người Cimmeria. Sử thi Odyssey đặt một dân mang tên ấy bên dòng Đại Dương, bị sương mù và mây bao phủ, nơi mặt trời không bao giờ chiếu đến. Herodotus nói rằng người Scythia đã đuổi người Cimmeria khỏi xứ của họ ở phía bắc Biển Đen, rằng họ chạy dọc bờ biển sang châu Á và định cư trên bán đảo nơi sau này có thành Sinope của người Hy Lạp, và vào thời ông xứ Scythia vẫn còn những đồn lũy Cimmeria, một bến đò Cimmeria và một eo biển gọi là Bosporus Cimmeria. Josephus viết rằng Gô-me là tổ phụ của dân mà người Hy Lạp thời ông gọi là người Ga-la-ti, xưa kia gọi là người Gô-me. Talmud Ba-by-lôn đồng nhất Gô-me với Germamya, một tên mà Jewish Encyclopedia đọc là người Cimmeria hoặc là xứ Germania."
  ro:
    - "Gomer este identificat în general cu poporul pe care asirienii îl numeau Gimirraya și grecii Kimmerioi, cimerienii: nomazi călare din stepele de la nord de Caucaz și de Marea Neagră, care au pătruns în Orientul Apropiat la sfârșitul secolului al VIII-lea î.Hr. Tabelul popoarelor îl numește pe Gomer întâi printre fiii lui Iafet și tată al lui Așchenaz, Rifat și Togarma. În viziunea lui Ezechiel despre Gog, oastea de la nord include „Gamer și toți cei dimprejurul lui, casa lui Torgamà dela marginea miezului nopții”. Tradiția armeană medievală a dat numele lui Gomer Capadociei, numită în armeană Gamirk."
    - "Cimerienii apar întâia oară în rapoartele trimise lui Sargon al II-lea în 714 î.Hr., care vorbesc despre o înfrângere pe care au dat-o Urartului. Sub Esar-Hadon, cei mai mulți s-au mutat spre vest, în Anatolia. În jurul anului 644 î.Hr., sub regele lor Lygdamis (Dugdamme în textele asiriene), au jefuit Sardes, cu excepția citadelei, și Gyges al Lidiei a fost ucis. Herodot spune că au luat Sardes în domnia lui Ardys, fiul lui Gyges, și că Aliate al Lidiei i-a izgonit din Asia; în jurul anului 635 î.Hr., puterea lor a fost frântă de sciți și de lidieni."
    - "Scriitorii greci au păstrat numele cimerienilor. Odiseea așază un popor cu acest nume lângă curgerea Oceanului, învăluit în ceață și nori, unde soarele nu strălucește niciodată asupra lui. Herodot spune că sciții i-au alungat pe cimerieni din țara lor de la nord de Marea Neagră, că aceștia au fugit în Asia de-a lungul coastei și s-au așezat în peninsula unde mai târziu s-a ridicat orașul grecesc Sinope, și că pe vremea lui Sciția mai avea fortificații cimeriene, un loc de trecere cimerian și o strâmtoare numită Bosforul Cimerian. Josephus a scris că Gomer a întemeiat poporul pe care grecii din vremea lui îl numeau galateni și care se chema odinioară gomeriți. Talmudul babilonian îl identifică pe Gomer cu Germamya, nume pe care Jewish Encyclopedia îl citește fie ca cimerienii, fie ca Germania."
  bg:
    - "Гомер общо се отъждествява с народа, който асирийците наричаха гимираи, а гърците — кимерийци: конни номади от степите на север от Кавказ и Черно море, които нахлуха в Близкия изток в края на VIII в. пр.н.е. Родословието на народите назовава Гомер пръв сред синовете на Яфет и баща на Аскеназ, Рифат и Тогарма. Във видението на Йезекиил за Гог северното войнство включва „Гомера и всичките му пълкове, дома на Тогарма, от последните страни на север“. Средновековната арменска традиция даде името на Гомер на Кападокия, наричана на арменски Гамирк."
    - "Кимерийците се появяват за първи път в донесения, изпратени до Саргон II през 714 г. пр.н.е., които разказват за поражение, нанесено от тях на Урарту. При Асархадон повечето от тях се преместиха на запад в Анатолия. Около 644 г. пр.н.е., при своя цар Лигдамис (Дугдаме в асирийските текстове), те разграбиха Сарди, с изключение на цитаделата, и Гигес Лидийски беше убит. Херодот казва, че те превзели Сарди при царуването на сина на Гигес, Ардис, и че Алиат Лидийски ги прогонил от Азия; към около 635 г. пр.н.е. силата им беше сломена от скитите и лидийците."
    - "Гръцките писатели запазили името на кимерийците. „Одисея“ поставя народ с това име край течението на Океан, обвит в мъгла и облаци, където слънцето никога не го огрява. Херодот казва, че скитите прогонили кимерийците от тяхната земя на север от Черно море, че те избягали в Азия покрай брега и се заселили на полуострова, където по-късно стоял гръцкият град Синопа, и че в Скития по негово време още имало кимерийски укрепления, кимерийски превоз и проток, наречен Кимерийски Босфор. Йосиф Флавий писал, че Гомер основал народа, който гърците по негово време наричали галати, а някога се наричал гомерийци. Вавилонският Талмуд отъждествява Гомер с Гермамия — име, което „Еврейската енциклопедия“ чете или като кимерийците, или като Германия."
