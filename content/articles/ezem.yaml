body:
  en:
    - "Ezem is a town of the Negeb known only from lists. Joshua's roll of the southernmost towns of Judah, toward the border of Edom, has “Baalah, and Iim, and Azem”, as the Authorised Version spells it; the same towns reappear in the lot of Simeon, which lay inside Judah's inheritance, as “Hazar-shual, and Balah, and Azem”; and the Chronicler's list of the settlements of Simeon has the family living “at Bilhah, and at Ezem, and at Tolad”. The Hebrew name means “bone”, and perhaps “strength”; it tells nothing of the site, and no story, king or prophet is tied to it."
    - "Where it stood is not settled. The lists put it in the Beersheba basin among the towns of Simeon, after Balah and before Eltolad. One proposal is Umm el-Azam, a ruin some 20 km south-south-east of Beersheba whose Arabic name keeps the consonants of the Hebrew; the other candidate, which the map's record prefers, is Khirbet Asan on the northern edge of modern Beersheba. Neither has been excavated with Ezem in view, and the choice rests on the names and on the order of the lists."
    - "Nothing later is known: Eusebius lists Asema among the towns of Judah by name alone, without saying where it was. Both candidate sites lie today in Israel's northern Negev, in the farmland and Bedouin townships around Beersheba."
  ru:
    - "Ацем — город Негева, известный только по спискам. Перечень самых южных городов Иуды, у границы Едома, в книге Иисуса Навина называет «Ваала, Иим и Ацем»; те же города повторяются в уделе Симеона, лежавшем внутри удела Иуды, как «Хацар-Шуал, Вала и Ацем»; а в перечне поселений Симеона у летописца этот род живёт «в Билге, в Ецеме, в Фоладе». Еврейское имя значит «кость», возможно «крепость»; о месте оно ничего не говорит, и ни одной истории, царя или пророка с ним не связано."
    - "Где он стоял, не решено. Списки ставят его в котловине Вирсавии среди городов Симеона, после Валы и перед Елтоладом. Одно из предложений — Умм-эль-Азам, развалины примерно в 20 км к юго-юго-востоку от Беэр-Шевы, чьё арабское имя сохраняет согласные еврейского; другой кандидат, которому отдаёт предпочтение запись на карте, — Хирбет-Асан на северной окраине нынешней Беэр-Шевы. Ни одно из мест не раскапывали ради Ацема, и выбор держится на именах и на порядке списков."
    - "Ничего позднейшего не известно: Евсевий перечисляет Асему среди городов Иуды только по имени, не говоря, где она была. Оба места лежат сегодня в северном Негеве Израиля, среди полей и бедуинских посёлков вокруг Беэр-Шевы."
  uk:
    - "Ацем — місто Негеву, відоме лише зі списків. Реєстр найпівденніших міст Юди в Ісуса Навина, до межі Едому, має «Баала, Ім і Ацем», як це пишеться в Авторизованому перекладі; ті самі міста знову з'являються в уділі Симеона, що лежав усередині Юдиного, як «Газар-Шуал, Вала й Азем»; а літописний список поселень Симеона має рід, що жив «В Билзї, в Еземі, в Толадї». Єврейська назва означає «кістка», а може, «сила»; вона нічого не каже про місце, і жодна історія, цар чи пророк не пов'язані з нею."
    - "Де воно стояло, не встановлено. Списки ставлять його в басейні Беер-Шеви серед міст Симеона, після Вали й перед Елтоладом. Одна з пропозицій — Умм-ель-Аззам, руїни приблизно за 20 км на південь-південний схід від Беер-Шеви, чия арабська назва зберігає приголосні єврейської; інший кандидат, якому віддає перевагу запис мапи, — Хірбет-Асан на північному краї сучасної Беер-Шеви. Жодне не розкопувалося з думкою про Ацем, і вибір спирається на назви та порядок списків."
    - "Пізнішого нічого не відомо: Євсевій перелічує Асему серед міст Юди лише за назвою, не кажучи, де вона була. Обидва місця-кандидати лежать сьогодні в північному Негеві Ізраїлю, в рільничій окрузі й бедуїнських поселеннях навколо Беер-Шеви."
  es:
    - "Ezem es una ciudad del Néguev conocida solo por listas. El registro de Josué de las ciudades más meridionales de Judá, hacia la frontera de Edom, tiene «Baala, é Iim, y Esem» (Azem, en la Versión Autorizada); las mismas ciudades reaparecen en la suerte de Simeón, que estaba dentro de la heredad de Judá, como «Hasar-sual, Bala, y Esem»; y la lista del cronista de los asentamientos de Simeón tiene a la familia viviendo «en Bala, y en Esem, y en Tholad». El nombre hebreo significa «hueso», y quizá «fuerza»; no dice nada del sitio, y ningún relato, rey o profeta se vincula con ella."
    - "Dónde estaba no está establecido. Las listas la sitúan en la cuenca de Beerseba entre las ciudades de Simeón, después de Bala y antes de Eltolad. Una propuesta es Umm el-Azam, una ruina a unos 20 km al sur-sudeste de Beerseba cuyo nombre árabe conserva las consonantes del hebreo; el otro candidato, que el registro del mapa prefiere, es Khirbet Asan, en el borde norte de la actual Beerseba. Ninguno ha sido excavado con Ezem en mente, y la elección se apoya en los nombres y en el orden de las listas."
    - "No se sabe nada posterior: Eusebio enumera Asema entre las ciudades de Judá solo por el nombre, sin decir dónde estaba. Ambos sitios candidatos se hallan hoy en el norte del Néguev israelí, en las tierras de labor y los poblados beduinos en torno a Beerseba."
  pt:
    - "Azém é uma cidade do Neguebe conhecida apenas por listas. O rol de Josué das cidades mais meridionais de Judá, em direção à fronteira de Edom, tem “Baalá, Iim, Ezem”; as mesmas cidades reaparecem no lote de Simeão, que ficava dentro da herança de Judá, como “Hazar-Sual, Balá, Ezém”; e a lista do cronista dos povoados de Simeão tem a família vivendo “em Bila, em Ezem, em Tolade”. O nome hebraico significa “osso” e talvez “força”; nada diz do local, e nenhuma história, rei ou profeta está ligado a ela."
    - "Onde ficava não está estabelecido. As listas a põem na bacia de Berseba entre as cidades de Simeão, depois de Balá e antes de Eltolade. Uma proposta é Umm el-Azam, uma ruína a cerca de 20 km a su-sudeste de Berseba, cujo nome árabe conserva as consoantes do hebraico; o outro candidato, que o registro do mapa prefere, é Khirbet Asan, no limite norte da moderna Berseba. Nenhum foi escavado tendo Azém em vista, e a escolha repousa nos nomes e na ordem das listas."
    - "Nada mais tardio é conhecido: Eusébio lista Asema entre as cidades de Judá só pelo nome, sem dizer onde ficava. Os dois locais candidatos ficam hoje no norte do Neguebe israelense, nas terras de lavoura e nos povoados beduínos em torno de Berseba."
  de:
    - "Ezem ist eine Stadt des Negev, nur aus Listen bekannt. Josuas Verzeichnis der südlichsten Städte Judas, zur Grenze Edoms hin, hat „Baala, Ijim, Ezem“ (in der Authorised Version Azem geschrieben); dieselben Städte erscheinen im Los Simeons, das innerhalb von Judas Erbteil lag, als „Hazar-Sual, Bala, Ezem“; und die Liste der Siedlungen Simeons beim Chronisten nennt als Wohnorte der Familie „Bilha, Ezem, Tholad“. Der hebräische Name bedeutet „Knochen“ und vielleicht „Stärke“; er sagt nichts über den Ort, und keine Geschichte, kein König und kein Prophet ist mit ihm verbunden."
    - "Wo er stand, ist nicht entschieden. Die Listen setzen ihn in das Becken von Beerscheba unter die Städte Simeons, nach Baala und vor Eltolad. Ein Vorschlag ist Umm el-Azam, eine Ruine etwa 20 km südsüdöstlich von Beerscheba, deren arabischer Name die Konsonanten des hebräischen bewahrt; der andere Kandidat, den die Aufzeichnung der Karte bevorzugt, ist Khirbet Asan am Nordrand des modernen Beerscheba. Keiner ist im Hinblick auf Ezem ausgegraben, und die Wahl beruht auf den Namen und auf der Reihenfolge der Listen."
    - "Nichts Späteres ist bekannt: Eusebius führt Asema unter den Städten Judas nur dem Namen nach auf, ohne zu sagen, wo es lag. Beide Kandidatenorte liegen heute im nördlichen Negev Israels, im Ackerland und in den Beduinenorten um Beerscheba."
  fr:
    - "Atsem est une ville du Négev connue seulement par des listes. La liste de Josué des villes les plus méridionales de Juda, vers la frontière d’Édom, porte « Baala, Ijjim, Atsem » (Azem dans la version autorisée anglaise) ; les mêmes villes reparaissent dans le lot de Siméon, qui se trouvait à l’intérieur de l’héritage de Juda, sous la forme « Hatsar-Schual, Bala, Atsem » ; et la liste du Chroniqueur des établissements de Siméon fait habiter la famille « à Bilha, à Étsem, à Tholad ». Le nom hébreu signifie « os », et peut-être « force » ; il ne dit rien du site, et aucun récit, roi ou prophète ne s’y rattache."
    - "Son emplacement n’est pas fixé. Les listes la placent dans le bassin de Beer-Schéba parmi les villes de Siméon, après Bala et avant Eltholad. Une proposition est Umm el-Azam, ruine à quelque 20 km au sud-sud-est de Beer-Schéba dont le nom arabe garde les consonnes de l’hébreu ; l’autre candidat, que préfère la notice de la carte, est Khirbet Asan, au bord nord de l’actuelle Beer-Schéba. Aucun n’a été fouillé en vue d’Atsem, et le choix repose sur les noms et sur l’ordre des listes."
    - "On ne sait rien de plus tardif : Eusèbe cite Asema parmi les villes de Juda par le seul nom, sans dire où elle se trouvait. Les deux sites candidats se trouvent aujourd’hui dans le nord du Négev israélien, dans les terres agricoles et les bourgs bédouins autour de Beer-Schéba."
  it:
    - "Esem è una città del Negheb nota solo da elenchi. L’elenco di Giosuè delle città più meridionali di Giuda, verso il confine di Edom, ha «Baala, Tim, Atsen» (Azem nell’Authorised Version); le stesse città ricompaiono nella sorte di Simeone, che stava dentro l’eredità di Giuda, come «Hatsar-Shual, Bala, Atsem»; e l’elenco del Cronista degli insediamenti di Simeone ha la famiglia che abita «a Bilha, ad Etsem, a Tolad». Il nome ebraico significa «osso», e forse «forza»; non dice nulla del sito, e nessuna storia, re o profeta è legato ad esso."
    - "Dove sorgesse non è stabilito. Gli elenchi la pongono nel bacino di Bersabea fra le città di Simeone, dopo Bala e prima di Eltolad. Una proposta è Umm el-Azam, una rovina a circa 20 km a sud-sud-est di Bersabea il cui nome arabo conserva le consonanti dell’ebraico; l’altro candidato, che il registro della mappa preferisce, è Khirbet Asan al margine settentrionale dell’odierna Bersabea. Nessuno dei due è stato scavato in funzione di Esem, e la scelta poggia sui nomi e sull’ordine degli elenchi."
    - "Nulla di più tardo è noto: Eusebio elenca Asema fra le città di Giuda con il solo nome, senza dire dove fosse. Entrambi i siti candidati si trovano oggi nel Negev settentrionale israeliano, nella campagna e nei centri beduini attorno a Bersabea."
  pl:
    - "Esem to miasto Negewu znane tylko z wykazów. Wykaz najdalej na południe położonych miast Judy w stronę granicy Edomu u Jozuego ma „Baala, i Ijim, i Esem” (w zapisie Authorised Version: Azem); te same miasta wracają w losie Symeona, który leżał w obrębie dziedzictwa Judy, jako „I Hasersual, i Bala, i Asem”; a wykaz osad Symeona u Kronikarza ma ród mieszkający „I w Bela, i w Asem, i w Etolad”. Hebrajska nazwa znaczy „kość”, a może „siła”; nic nie mówi o miejscu, a żadna opowieść, król ani prorok nie są z nim związani."
    - "Gdzie stało, nie jest ustalone. Wykazy umieszczają je w basenie Beer-Szeby wśród miast Symeona, po Bala i przed Eltolad. Jedna z propozycji to Umm el-Azam, ruina około 20 km na południowy południowy wschód od Beer-Szeby, której arabska nazwa zachowuje spółgłoski hebrajskiej; drugi kandydat, któremu daje pierwszeństwo mapa, to Chirbet Asan na północnym skraju dzisiejszej Beer-Szeby. Żadne nie było badane wykopaliskami z myślą o Esem, a wybór opiera się na nazwach i kolejności wykazów."
    - "Nic późniejszego nie jest znane: Euzebiusz wymienia Asema wśród miast Judy samą nazwą, nie mówiąc, gdzie leżało. Oba kandydujące miejsca leżą dziś w północnym Negewie Izraela, wśród pól uprawnych i beduińskich miasteczek wokół Beer-Szeby."
  nl:
    - "Ezem is een stad van de Negev die alleen uit lijsten bekend is. Jozua's lijst van de zuidelijkste steden van Juda, richting de grens van Edom, heeft “Baala, en Ijim, en Azem”, zoals de Authorised Version de naam daar spelt; dezelfde steden keren terug in het lot van Simeon, dat binnen Juda's erfdeel lag, als “Hazar-Sual, en Bala, en Azem”; en de lijst van de woonplaatsen van Simeon in Kronieken heeft het geslacht wonend “te Bilha, en te Ezem, en te Tholad”. De Hebreeuwse naam betekent “bot”, en misschien “kracht”; hij zegt niets over de plaats, en geen verhaal, koning of profeet is eraan verbonden."
    - "Waar het stond, is niet vastgesteld. De lijsten plaatsen het in het bekken van Berseba onder de steden van Simeon, na Bala en vóór Eltolad. Eén voorstel is Umm el-Azam, een ruïne zo'n 20 km zuidzuidoost van Berseba wier Arabische naam de medeklinkers van de Hebreeuwse bewaart; de andere kandidaat, die het overzicht bij de kaart verkiest, is Khirbet Asan aan de noordrand van het moderne Berseba. Geen van beide is met Ezem in het oog opgegraven, en de keuze berust op de namen en op de volgorde van de lijsten."
    - "Niets later is bekend: Eusebius noemt Asema onder de steden van Juda alleen bij naam, zonder te zeggen waar het lag. Beide kandidaatplaatsen liggen nu in Israëls noordelijke Negev, in het akkerland en de bedoeïenengemeenten rond Berseba."
  cs:
    - "Ecem je město v Negevu známé jen ze seznamů. Jozuův soupis nejjižnějších měst Judy, směrem k hranici Edómu, má „Bála a Im, a Esem“ (Authorised Version píše Azem); tatáž města se vracejí v losu Simeonově, který ležel uvnitř dědictví Judova, jako „Azarsual a Bala, též Esem“; a Letopisecův seznam simeonských sídel má rod bydlící „v Bála, v Esem a v Tolad“. Hebrejské jméno znamená „kost“ a snad „síla“; o místě nic neříká a žádný příběh, král ani prorok se k němu neváže."
    - "Kde stál, není rozhodnuto. Seznamy jej kladou do povodí Beer-šeby mezi města Simeonova, za Balu a před Eltolad. Jeden z návrhů je Umm el-Azam, zřícenina asi 20 km jihojihovýchodně od Beer-šeby, jejíž arabské jméno zachovává souhlásky hebrejského; druhý kandidát, který záznam mapy upřednostňuje, je Khirbet Asan na severním okraji dnešní Beer-šeby. Ani jeden nebyl vykopán s Ecemem na mysli a volba spočívá na jménech a na pořadí seznamů."
    - "Nic pozdějšího není známo: Eusebios uvádí Asemu mezi městy Judy jen jménem, aniž by řekl, kde byla. Obě kandidátská místa leží dnes v severním izraelském Negevu, na obdělávané půdě a v beduínských městečkách kolem Beer-šeby."
  sv:
    - "Esem är en stad i Negev som bara är känd från förteckningar. Josuas förteckning över Judas sydligaste städer, mot Edoms gräns, har ”Baala, Ijim, Esem” (Azem i Authorised Version); samma städer återkommer i Simeons lott, som låg inom Judas arvedel, som ”Hasar-Sual, Bala, Esem”; och krönikeskrivarens förteckning över Simeons bosättningar låter släkten bo ”i Bilha, i Esem och i Tolad”. Det hebreiska namnet betyder ”ben” och kanske ”styrka”; det säger inget om platsen, och ingen berättelse, kung eller profet är knuten till den."
    - "Var den låg är inte avgjort. Förteckningarna placerar den i bäckenet vid Beer Sheva bland Simeons städer, efter Bala och före Eltolad. Ett förslag är Umm el-Azam, en ruin omkring 20 km sydsydost om Beer Sheva vars arabiska namn bevarar den hebreiska formens konsonanter; den andra kandidaten, som kartans uppgift föredrar, är Khirbet Asan i norra utkanten av dagens Beer Sheva. Ingen av platserna har grävts ut med tanke på Esem, och valet vilar på namnen och på förteckningarnas ordning."
    - "Inget senare är känt: Eusebios för upp Asema bland Judas städer enbart med namn, utan att säga var den låg. Båda kandidatplatserna ligger i dag i norra Negev i Israel, bland åkrar och beduinorter runt Beer Sheva."
  nb:
    - "Esem er en by i Negev som bare er kjent fra lister. Josvas liste over Judas sørligste byer, mot grensen til Edom, har «Ba'ala og Ijim og Esem» (Azem i Authorised Version); de samme byene dukker opp igjen i Simeons lodd, som lå inne i Judas arvelodd, som «Hasar-Sual og Bala og Esem»; og krønikerens liste over Simeons bosteder har ætten boende «i Bilha og i Esem og i Tolad». Det hebraiske navnet betyr «bein», og kanskje «styrke»; det sier ingenting om stedet, og ingen fortelling, konge eller profet er knyttet til det."
    - "Hvor den lå, er ikke avgjort. Listene plasserer den i Beer-Sjeba-bassenget blant Simeons byer, etter Bala og før Eltolad. Ett forslag er Umm el-Azam, en ruin omtrent 20 km sør-sørøst for Beer-Sjeba, hvis arabiske navn bevarer konsonantene i det hebraiske; den andre kandidaten, som kartets oppføring foretrekker, er Khirbet Asan i nordkanten av dagens Beer-Sjeba. Ingen av dem er utgravd med tanke på Esem, og valget hviler på navnene og på rekkefølgen i listene."
    - "Ingenting senere er kjent: Eusebius oppfører Asema blant Judas byer bare med navn, uten å si hvor den lå. Begge kandidatstedene ligger i dag i det nordlige Negev i Israel, i jordbruksland og beduinbyer rundt Beer-Sjeba."
  tl:
    - "Ang Esem ay isang bayan sa Negeb na kilala lamang mula sa mga talaan. Sa talaan ni Josue ng pinakatimugang mga bayan ng Juda, sa dako ng hangganan ng Edom, nakasaad ang “Baala, at Iim, at Esem”, ayon sa baybay ng Ang Biblia; muling lumilitaw ang mga bayang ito sa bahagi ng Simeon, na nasa loob ng mana ng Juda, bilang “Hasar-sual, at Bala, at Esem”; at sa talaan ng Mananalaysay ng mga paninirahan ng Simeon, ang angkan ay nakatira “sa Bala, at sa Esem, at sa Tholad”. Ang pangalang Hebreo ay nangangahulugang “buto”, at marahil “lakas”; wala itong sinasabi tungkol sa lugar, at walang kuwento, hari o propeta na nakatali rito."
    - "Hindi pa tiyak kung saan ito nakatayo. Inilalagay ito ng mga talaan sa lambak ng Beer-seba sa gitna ng mga bayan ng Simeon, pagkatapos ng Bala at bago ang Eltolad. Isang mungkahi ang Umm el-Azam, isang guho na mga 20 km sa timog-timog-silangan ng Beer-seba na ang pangalang Arabe ay may mga katinig ng Hebreo; ang isa pang kandidato, na higit na pinipili ng tala ng mapa, ay ang Khirbet Asan sa hilagang gilid ng makabagong Beer-seba. Wala sa dalawa ang nahukay na may layuning hanapin ang Esem, at ang pagpili ay nakasalalay sa mga pangalan at sa pagkakasunud-sunod ng mga talaan."
    - "Wala nang nalalaman tungkol dito sa mga sumunod na panahon: itinatala ni Eusebio ang Asema sa mga bayan ng Juda sa pangalan lamang, nang hindi sinasabi kung saan ito naroon. Ang parehong pook na kandidato ay nasa hilagang Negev ng Israel ngayon, sa mga bukirin at mga bayan ng mga Bedouin sa palibot ng Beer-seba."
  da:
    - "Esem er en by i Negev, som kun er kendt fra lister. Josvas fortegnelse over Judas sydligste byer, mod Edoms grænse, har »Baala og Jim og Ezem« (Azem i den engelske Authorised Version); de samme byer dukker op igen i Simeons lod, som lå inde i Judas arv, som »Hazar-Sual og Bala og Ezem«; og Krønikebogens liste over Simeons bosættelser lader slægten bo »i Bilha og i Ezem og i Tholad«. Det hebraiske navn betyder »knogle« og måske »styrke«; det siger intet om stedet, og ingen fortælling, konge eller profet knytter sig til det."
    - "Hvor byen lå, er ikke afgjort. Listerne placerer den i Beersheba-bækkenet blandt Simeons byer, efter Bala og før Eltolad. Et forslag er Umm el-Azam, en ruin omkring 20 km syd-sydøst for Beersheba, hvis arabiske navn bevarer det hebraiskes konsonanter; den anden kandidat, som kortets registrering foretrækker, er Khirbet Asan i udkanten af det nuværende Beersheba mod nord. Ingen af dem er udgravet med henblik på Esem, og valget hviler på navnene og på rækkefølgen i listerne."
    - "Intet senere er kendt: Eusebios opregner Asema blandt Judas byer kun ved navn uden at sige, hvor den lå. Begge kandidater ligger i dag i Israels nordlige Negev, i agerlandet og beduinbyerne omkring Beersheba."
  sr:
    - "Ацем је град у Негеву познат само из списака. Исусов списак најјужнијих јудејских градова, према међи Едома, има „Вала и Им и Асем“ (у енглеском Ауторизованом преводу: Азем); исти градови понављају се у Симеуновом жребу, који је лежао унутар Јудиног наследства, као „Асар-Суал и Вала и Асем“, а Летописац у списку Симеунових насеља каже да се тај род настанио „у Вали и у Асему и у Толаду“. Хебрејско име значи „кост“, а можда и „снага“; о месту не казује ништа и с њим није повезана ни једна прича, ни цар ни пророк."
    - "Где је стајао, није утврђено. Спискови га стављају у вирсавејску котлину међу Симеунове градове, после Вале а пре Елтолада. Један предлог је Ум ел-Азам, рушевина око 20 км јужно-југоисточно од Вирсавеје чије арапско име чува сугласнике хебрејског; други кандидат, коме даје предност запис на карти, јесте Хирбет Асан на северном ободу данашње Вирсавеје. Ни једно ни друго место није ископавано с мишљу на Ацем, а избор почива на именима и на редоследу у списковима."
    - "Ништа касније није познато: Јевсевије набраја Асему међу јудејским градовима само по имену, не казујући где је била. Оба кандидата данас леже у северном Негеву у Израилу, међу њивама и бедуинским насељима око Вирсавеје."
  hu:
    - "Écem a Negev egyik városa, amelyet csak névsorokból ismerünk. Józsué könyvében Júda legdélibb városainak jegyzéke, az edomi határ felé, ezt tartalmazza: „Baála, Ijjim és Eczem” (az Authorised Version írásmódja szerint: Azem); ugyanezek a városok Simeon sorsában is feltűnnek, amely Júda örökségén belül feküdt: „Haczar-Sual, Bála és Eczem”; a Krónikák szerzőjének Simeon településeiről szóló jegyzéke pedig úgy mondja, hogy a nemzetség „Bilhában, Eczemben és Toládban” lakott. A héber név jelentése „csont”, talán „erő”; a helyről semmit sem árul el, és nem kötődik hozzá történet, király vagy próféta."
    - "Hogy hol állt, az nem eldöntött. A jegyzékek a Beérseba-medencébe helyezik, Simeon városai közé, Bala után és Eltolád előtt. Az egyik javaslat Umm el-Azam, egy romhely mintegy 20 km-re dél-délkeletre Beérsebától, amelynek arab neve megőrzi a héber név mássalhangzóit; a másik jelölt, amelyet a térkép adatlapja előnyben részesít, Hirbet Aszan a mai Beérseba északi szélén. Egyiket sem Écem szem előtt tartásával ásták ki, és a választás a neveken és a jegyzékek sorrendjén múlik."
    - "Későbbről semmi sem ismeretes: Eusebius a júdai városok között említi Aszémát, pusztán névvel, anélkül hogy megmondaná, hol állt. Mindkét jelölt hely ma Izrael északi Negevjében fekszik, a Beérseba körüli szántóföldek és beduin települések között."
  fi:
    - "Esem on Negevin kaupunki, joka tunnetaan vain luetteloista. Joosuan kirjan luettelo Juudan eteläisimmistä kaupungeista Edomin rajan suunnassa mainitsee ”Baala, Ijjim, Esem” (Authorised Versionissa Azem); samat kaupungit esiintyvät uudelleen Simeonin arvassa, joka oli Juudan perintöosan sisällä: ”Hasar-Suual, Baala, Esem”; ja Aikakirjojen kirjoittajan luettelossa Simeonin asuinsijoista suku asuu ”Bilhassa, Esemissä ja Tooladissa”. Heprealainen nimi merkitsee ”luuta” ja ehkä ”voimaa”; se ei kerro paikasta mitään, eikä mikään kertomus, kuningas tai profeetta liity siihen."
    - "Missä se sijaitsi, ei ole ratkaistu. Luettelot sijoittavat sen Beerseban altaaseen Simeonin kaupunkien joukkoon, Balan jälkeen ja ennen Eltoladia. Yksi ehdotus on Umm el-Azam, raunio noin 20 km Beersebasta etelä-kaakkoon, jonka arabialainen nimi säilyttää heprean konsonantit; toinen ehdokas, jota kartan merkintä pitää parempana, on Khirbet Asan nykyisen Beerseban pohjoisreunalla. Kumpaakaan ei ole kaivettu Esemiä silmällä pitäen, ja valinta perustuu nimiin ja luetteloiden järjestykseen."
    - "Myöhemmästä ei tiedetä mitään: Eusebios luettelee Asemaan Juudan kaupunkien joukossa pelkällä nimellä kertomatta, missä se oli. Molemmat ehdokaspaikat sijaitsevat nykyään Israelin pohjoisessa Negevissä, Beersebaa ympäröivillä viljelysmailla ja beduiiniasutuksissa."
  vi:
    - "Ê-xem là một thành ở Nê-ghép chỉ được biết qua các bảng liệt kê. Danh sách của Giô-suê về các thành ở cực nam Giu-đa, về phía ranh Ê-đôm, có “Ba-la, Y-dim, Ê-xem” (Azem trong bản Authorised Version); chính các thành ấy lại xuất hiện trong phần bắt thăm của Si-mê-ôn, nằm trong sản nghiệp của Giu-đa, là “Hát-sa-Su-anh, Ba-la, Ê-xem”; còn bảng kê các nơi định cư của Si-mê-ôn trong sách Sử Ký cho biết gia tộc này ở “tại Bi-la, tại Ê-xem, và tại Tô-lát”. Tên Hê-bơ-rơ có nghĩa là “xương”, và có lẽ cả “sức mạnh”; tên ấy chẳng cho biết gì về địa điểm, và không có câu chuyện, vua hay nhà tiên tri nào gắn với nơi này."
    - "Thành nằm ở đâu vẫn chưa ngã ngũ. Các bảng kê đặt thành trong lưu vực Bê-e-Sê-ba giữa các thành của Si-mê-ôn, sau Ba-la và trước Ên-thô-lát. Một đề nghị là Umm el-Azam, một phế tích cách Bê-e-Sê-ba khoảng 20 km về hướng nam-đông nam, có tên Ả Rập giữ lại các phụ âm của tên Hê-bơ-rơ; ứng viên kia, được hồ sơ của bản đồ ưu tiên, là Khirbet Asan ở rìa bắc của Bê-e-Sê-ba hiện đại. Cả hai nơi đều chưa được khai quật với mục đích tìm Ê-xem, và việc chọn lựa dựa vào các tên gọi và thứ tự trong các bảng kê."
    - "Không còn gì về sau được biết: Eusebius liệt kê Asema trong số các thành của Giu-đa chỉ bằng tên, không nói thành ở đâu. Ngày nay cả hai địa điểm ứng viên đều nằm ở miền bắc Negev của Israel, trong các vùng đất canh tác và các thị trấn Bedouin quanh Bê-e-Sê-ba."
  ro:
    - "Ețem este un oraș din Neghev cunoscut doar din liste. Lista lui Iosua a celor mai sudice orașe ale lui Iuda, înspre hotarul Edomului, are Baala, Iim și Azem, în grafia Versiunii Autorizate; aceleași orașe reapar în sorțul lui Simeon, care se afla în moștenirea lui Iuda, ca „Asersual, Vola, Iason”; iar lista cronicarului cu așezările lui Simeon arată că familia locuia „În Valaa, în Aisem și în Tolad”. Numele ebraic înseamnă „os” și, poate, „putere”; el nu spune nimic despre loc, iar nicio poveste, niciun rege și niciun profet nu sunt legați de el."
    - "Locul unde se afla nu este stabilit. Listele îl așază în bazinul Beer-Șeba, printre orașele lui Simeon, după Bala și înainte de Eltolad. O propunere este Umm el-Azam, o ruină la circa 20 km spre sud-sud-est de Beer-Șeba, al cărei nume arab păstrează consoanele celui ebraic; celălalt candidat, preferat de înregistrarea de pe hartă, este Khirbet Asan, la marginea de nord a Beer-Șebei de azi. Niciunul nu a fost săpat având în vedere Ețemul, iar alegerea se sprijină pe nume și pe ordinea listelor."
    - "Nu se cunoaște nimic mai târziu: Eusebiu enumeră Asema printre orașele lui Iuda doar cu numele, fără să spună unde se afla. Ambele locuri candidate se află astăzi în nordul Neghevului israelian, în ținuturile agricole și în așezările beduine din jurul Beer-Șebei."
  bg:
    - "Ацем е град в Негев, известен само от списъци. Списъкът на Иисус Навин с най-южните градове на Юда, към границата на Едом, има „Ваала, и Иим, и Асем“, както е изписан в Цариградската Библия; същите градове се появяват отново в дела на Симеон, който лежеше вътре в наследството на Юда, като „Асар-суал, и Вала, и Асем“; а списъкът на Летописеца със селищата на Симеон поставя рода „във Вала, и в Есем, и в Толад“. Еврейското име означава „кост“, а може би и „сила“; то не казва нищо за мястото и с него не е свързан нито разказ, нито цар, нито пророк."
    - "Местоположението му не е установено. Списъците го поставят в котловината на Вирсавия сред градовете на Симеон, след Вала и преди Елтолад. Едно предположение е Ум ел-Азам, развалини на около 20 км юг-югоизточно от Вирсавия, чието арабско име пази съгласните на еврейското; другият кандидат, предпочитан в записа на картата, е Хирбет Асан на северния край на днешна Вирсавия. Нито едно от двете места не е разкопавано с оглед на Ацем и изборът почива на имената и на реда в списъците."
    - "Нищо по-късно не е известно: Евсевий изброява Асема сред градовете на Юда само по име, без да казва къде се е намирал. И двете възможни места лежат днес в северния Негев в Израел, сред обработваемите земи и бедуинските селища около Вирсавия."
