body:
  en:
    - "Memphis lay on the west bank of the Nile about 20 km south of modern Cairo, near the point where the river opens into the delta; its ruins are at the village of Mit Rahina. Herodotus heard that Min, the first king of Egypt, founded it after damming the Nile and built there the temple of Ptah, whom the Greeks called Hephaestus. Memphis was the capital of the united kingdom from about 3000 BC, and the kings of the Old Kingdom were buried on the desert edge nearby, in the pyramids of Saqqara, among them Djoser's step pyramid, and of Giza and Dahshur."
    - "Even when the kings of later ages ruled from Thebes, Memphis remained a royal residence and the chief city of Lower Egypt. In 671 BC the Assyrian king Esarhaddon took it from the Kushite king Taharqa, the Tirhakah of the Bible, within half a day by Esarhaddon's own account, and Ashurbanipal recovered it a few years later. In 525 BC Cambyses of Persia besieged and took the city after his victory at Pelusium."
    - "In the Hebrew Bible the city is called Noph, and in Hosea Moph, which the KJV renders Memphis. Isaiah says that the princes of Noph are deceived, and Hosea that Memphis shall bury the Israelites who flee to Egypt. Jeremiah lists Noph among the places where Jews lived in Egypt after the fall of Jerusalem and foretold that Noph shall be waste and desolate; Ezekiel, that God would cause the images to cease out of Noph."
    - "Alexander the Great came to Memphis in 332 BC and sacrificed to Apis, the sacred bull kept there. The Ptolemies made Alexandria their capital, but Ptolemy V was crowned at Memphis, and the Rosetta Stone carries a decree issued there by the assembled priests in 196 BC. Strabo still found Memphis large and populous, second only to Alexandria, though its palaces lay in ruins. In the Roman and Christian centuries the city declined, and much of its stone was later carried off to build medieval Cairo."
  ru:
    - "Мемфис лежал на западном берегу Нила примерно в 20 км к югу от нынешнего Каира, там, где река расходится в дельту; его руины находятся у деревни Мит-Рахина. Геродот слышал, что его основал Мин, первый царь Египта, перегородив Нил плотиной, и построил там храм Птаха, которого греки называли Гефестом. С ок. 3000 г. до н. э. Мемфис был столицей объединённого царства, а цари Древнего царства погребены рядом, на краю пустыни, в пирамидах Саккары, среди них ступенчатая пирамида Джосера, а также Гизы и Дахшура."
    - "Даже когда цари позднейших эпох правили из Фив, Мемфис оставался царской резиденцией и главным городом Нижнего Египта. В 671 г. до н. э. ассирийский царь Асардан отнял его у кушитского царя Тиргака, которого упоминает и Библия, — по собственным словам Асардана, за полдня, — а через несколько лет его снова взял Ашшурбанапал. В 525 г. до н. э. персидский царь Камбис после победы при Пелусии осадил и взял город."
    - "В еврейском тексте Библии город называется Ноф, а у Осии — Моф; Синодальный перевод передаёт это имя то как Ноф, то как Мемфис. Исаия говорит, что обманулись князья Мемфисские, а Осия — что Мемфис похоронит израильтян, бежавших в Египет. Иеремия называет Ноф среди мест, где после падения Иерусалима жили Иудеи в Египте, и предрекает, что Ноф будет опустошен, разорен; Иезекииль — что Бог уничтожит лжебогов в Мемфисе."
    - "Александр Македонский пришёл в Мемфис в 332 г. до н. э. и принёс жертву Апису, священному быку, которого здесь содержали. Птолемеи сделали столицей Александрию, но Птолемей V короновался в Мемфисе, а Розеттский камень несёт декрет, изданный здесь собранием жрецов в 196 г. до н. э. Страбон ещё застал Мемфис большим и многолюдным, вторым после Александрии, хотя его дворцы лежали в развалинах. В римские и христианские века город пришёл в упадок, а позже его камни растащили на постройки средневекового Каира."
  uk:
    - "Мемфіс лежав на західному березі Нілу приблизно за 20 км на південь від сучасного Каїра, поблизу місця, де ріка розкривається в дельту; його руїни — біля села Міт-Рахіна. Геродот чув, що Мін, перший цар Єгипту, заснував його, загатавши Ніл, і збудував там храм Птаха, якого греки називали Гефестом. Мемфіс був столицею об’єднаного царства від близько 3000 р. до н. е., а царів Давнього царства ховали на краю пустелі поруч, у пірамідах Саккари, серед них ступінчастої піраміди Джосера, а також Гізи та Дахшура."
    - "Навіть коли царі пізніших віків правили з Фів, Мемфіс залишався царською резиденцією й головним містом Нижнього Єгипту. У 671 р. до н. е. ассирійський цар Асархаддон узяв його в кушитського царя Тахарки, біблійного Тирхаки, за пів дня, за власним оповіданням Асархаддона, а Ашшурбаніпал повернув його кілька років потому. У 525 р. до н. е. Камбіз Перський облягав і взяв місто після перемоги при Пелусії."
    - "У староєврейській Біблії місто зветься Ноф, а в Осії Моф, що Біблія короля Якова передає як Мемфіс. Ісая каже, що князі Нофа ошукані, а Осія — що Мемфіс поховає ізраїльтян, які втікають до Єгипту. Єремія зараховує Ноф до місць, де жили юдеї в Єгипті після падіння Єрусалима, і провістив, що Ноф стане пусткою й руїною; Єзекіїль — що Бог змусить ідолів зникнути з Нофа."
    - "Александр Великий прийшов до Мемфіса 332 р. до н. е. і приніс жертву Апісові, священному бику, що тримали там. Птолемеї зробили столицею Александрію, але Птолемея V коронували в Мемфісі, а Розеттський камінь несе указ, виданий там зібраними жерцями 196 р. до н. е. Страбон ще знаходив Мемфіс великим і людним, другим після Александрії, хоча його палаци лежали в руїнах. У римські й християнські століття місто занепало, і значну частину його каменю пізніше вивезли на будівництво середньовічного Каїра."
  es:
    - "Menfis se hallaba en la orilla occidental del Nilo, a unos 20 km al sur del actual El Cairo, cerca del punto donde el río se abre en el delta; sus ruinas están en la aldea de Mit Rahina. Heródoto oyó que Min, el primer rey de Egipto, la fundó tras represar el Nilo y construyó allí el templo de Ptah, a quien los griegos llamaban Hefesto. Menfis fue la capital del reino unido desde alrededor de 3000 a. C., y los reyes del Reino Antiguo fueron enterrados en el borde del desierto cercano, en las pirámides de Saqqara, entre ellas la pirámide escalonada de Djoser, y de Guiza y Dahshur."
    - "Aun cuando los reyes de épocas posteriores gobernaron desde Tebas, Menfis siguió siendo residencia real y ciudad principal del Bajo Egipto. En 671 a. C. el rey asirio Esar-hadón se la tomó al rey kushita Taharqa, el Tirhaca de la Biblia, en medio día según el propio relato de Esar-hadón, y Asurbanipal la recuperó unos años después. En 525 a. C. Cambises de Persia sitió y tomó la ciudad tras su victoria en Pelusio."
    - "En la Biblia hebrea la ciudad se llama Nof, y en Oseas Mof, que la versión del rey Jacobo traduce Menfis. Isaías dice que los príncipes de Nof están engañados, y Oseas que Menfis enterrará a los israelitas que huyan a Egipto. Jeremías enumera Nof entre los lugares donde vivían judíos en Egipto tras la caída de Jerusalén y predijo que Nof sería «por yermo» y asolada; Ezequiel, que Dios haría cesar los ídolos de Nof."
    - "Alejandro Magno llegó a Menfis en 332 a. C. y ofreció sacrificios a Apis, el toro sagrado que se guardaba allí. Los Ptolomeos hicieron de Alejandría su capital, pero Ptolomeo V fue coronado en Menfis, y la Piedra de Rosetta lleva un decreto emitido allí por los sacerdotes reunidos en 196 a. C. Estrabón aún encontró Menfis grande y populosa, solo superada por Alejandría, aunque sus palacios yacían en ruinas. En los siglos romanos y cristianos la ciudad decayó, y gran parte de su piedra fue llevada después para construir El Cairo medieval."
  pt:
    - "Mênfis ficava na margem oeste do Nilo, a cerca de 20 km ao sul do Cairo moderno, perto do ponto em que o rio se abre no delta; suas ruínas estão na aldeia de Mit Rahina. Heródoto ouviu que Min, o primeiro rei do Egito, a fundou depois de represar o Nilo e ali construiu o templo de Ptá, a quem os gregos chamavam Hefesto. Mênfis foi a capital do reino unido desde cerca de 3000 a.C., e os reis do Antigo Império foram sepultados na orla do deserto próxima, nas pirâmides de Saqqara, entre elas a pirâmide escalonada de Djoser, e de Gizé e Dahshur."
    - "Mesmo quando os reis de épocas posteriores governaram de Tebas, Mênfis permaneceu residência real e a principal cidade do Baixo Egito. Em 671 a.C. o rei assírio Esar-Hadom a tomou do rei cuxita Taharqa, o Tiraca da Bíblia, em meio dia segundo o relato do próprio Esar-Hadom, e Assurbanípal a recuperou poucos anos depois. Em 525 a.C. Cambises da Pérsia sitiou e tomou a cidade depois de sua vitória em Pelúsio."
    - "Na Bíblia hebraica a cidade se chama Nof, e em Oseias Mof, que a King James Version traduz Mênfis. Isaías diz que os príncipes de Nof estão enganados, e Oseias que Mênfis sepultará os israelitas que fogem para o Egito. Jeremias lista Nof entre os lugares onde viviam judeus no Egito depois da queda de Jerusalém e predisse que Nof será devastada e desolada; Ezequiel, que Deus faria cessar as imagens de Nof."
    - "Alexandre Magno veio a Mênfis em 332 a.C. e sacrificou a Ápis, o touro sagrado ali mantido. Os Ptolomeus fizeram de Alexandria sua capital, mas Ptolomeu V foi coroado em Mênfis, e a Pedra de Roseta traz um decreto ali emitido pelos sacerdotes reunidos em 196 a.C. Estrabão ainda achou Mênfis grande e populosa, perdendo apenas para Alexandria, embora seus palácios jazessem em ruínas. Nos séculos romanos e cristãos a cidade declinou, e muito de sua pedra foi depois levado para construir o Cairo medieval."
  de:
    - "Memphis lag am Westufer des Nils etwa 20 km südlich des heutigen Kairo, nahe dem Punkt, wo sich der Fluss zum Delta öffnet; seine Ruinen liegen beim Dorf Mit Rahina. Herodot hörte, Min, der erste König Ägyptens, habe es gegründet, nachdem er den Nil eingedämmt hatte, und dort den Tempel des Ptah erbaut, den die Griechen Hephaistos nannten. Memphis war ab etwa 3000 v. Chr. die Hauptstadt des geeinten Reiches, und die Könige des Alten Reiches wurden am Wüstenrand in der Nähe bestattet, in den Pyramiden von Sakkara, darunter Djosers Stufenpyramide, und von Gizeh und Dahschur."
    - "Auch als die Könige späterer Zeiten von Theben aus herrschten, blieb Memphis königliche Residenz und Hauptstadt Unterägyptens. 671 v. Chr. nahm der assyrische König Asarhaddon es dem kuschitischen König Taharqa, dem Tirhaka der Bibel, nach eigener Angabe Asarhaddons innerhalb eines halben Tages, und Assurbanipal gewann es einige Jahre später zurück. 525 v. Chr. belagerte und nahm Kambyses von Persien die Stadt nach seinem Sieg bei Pelusium."
    - "In der hebräischen Bibel heißt die Stadt Noph, bei Hosea Moph, was die King-James-Version mit Memphis wiedergibt. Jesaja sagt, die Fürsten von Noph seien betrogen, und Hosea, Memphis werde die nach Ägypten geflohenen Israeliten begraben. Jeremia führt Noph unter den Orten auf, wo Juden nach dem Fall Jerusalems in Ägypten lebten, und kündigte an, Noph werde wüst und verbrannt werden; Hesekiel, Gott werde die Götzen in Noph ausrotten."
    - "Alexander der Große kam 332 v. Chr. nach Memphis und opferte dem Apis, dem heiligen Stier, der dort gehalten wurde. Die Ptolemäer machten Alexandria zu ihrer Hauptstadt, doch Ptolemaios V. wurde in Memphis gekrönt, und der Stein von Rosette trägt ein Dekret, das die versammelten Priester dort 196 v. Chr. erließen. Strabon fand Memphis noch groß und bevölkert, nach Alexandria die zweite Stadt, obwohl seine Paläste in Ruinen lagen. In römischer und christlicher Zeit verfiel die Stadt, und viel von ihrem Stein wurde später zum Bau des mittelalterlichen Kairo abtransportiert."
  fr:
    - "Memphis se trouvait sur la rive ouest du Nil, à environ 20 km au sud du Caire moderne, près de l’endroit où le fleuve s’ouvre sur le delta ; ses ruines sont au village de Mit Rahina. Hérodote apprit que Min, premier roi d’Égypte, la fonda après avoir endigué le Nil et y bâtit le temple de Ptah, que les Grecs appelaient Héphaïstos. Memphis fut la capitale du royaume unifié à partir d’environ 3000 av. J.-C., et les rois de l’Ancien Empire furent enterrés tout près, en bordure du désert, dans les pyramides de Saqqarah, dont la pyramide à degrés de Djéser, et de Gizeh et de Dahchour."
    - "Même quand les rois des époques suivantes gouvernèrent depuis Thèbes, Memphis demeura une résidence royale et la principale ville de la Basse-Égypte. En 671 av. J.-C., le roi assyrien Esar-Haddon la prit au roi koushite Taharqa, le Tirhaka de la Bible, en une demi-journée selon le récit d’Esar-Haddon lui-même, et Assurbanipal la reprit quelques années plus tard. En 525 av. J.-C., Cambyse de Perse assiégea et prit la ville après sa victoire à Péluse."
    - "Dans la Bible hébraïque, la ville s’appelle Noph, et chez Osée Moph, que la version du roi Jacques rend par Memphis. Ésaïe dit que les princes de Noph sont dans l’illusion, et Osée que Memphis enterrera les Israélites qui fuient en Égypte. Jérémie range Noph parmi les lieux où des Juifs vivaient en Égypte après la chute de Jérusalem et prédit que Noph deviendra un désert, ravagée ; Ézéchiel, que Dieu ferait disparaître de Noph les vains simulacres."
    - "Alexandre le Grand vint à Memphis en 332 av. J.-C. et sacrifia à Apis, le taureau sacré qui y était gardé. Les Ptolémées firent d’Alexandrie leur capitale, mais Ptolémée V fut couronné à Memphis, et la pierre de Rosette porte un décret émis là par l’assemblée des prêtres en 196 av. J.-C. Strabon trouvait encore Memphis grande et peuplée, seconde seulement après Alexandrie, bien que ses palais fussent en ruines. Aux siècles romains et chrétiens, la ville déclina, et une grande partie de ses pierres fut plus tard emportée pour bâtir le Caire médiéval."
  it:
    - "Menfi sorgeva sulla riva occidentale del Nilo, a circa 20 km a sud dell’odierno Cairo, vicino al punto in cui il fiume si apre nel delta; le sue rovine sono presso il villaggio di Mit Rahina. Erodoto udì che Min, il primo re d’Egitto, la fondò dopo aver arginato il Nilo e vi costruì il tempio di Ptah, che i Greci chiamavano Efesto. Menfi fu la capitale del regno unito dal 3000 a.C. circa, e i re dell’Antico Regno furono sepolti sul margine del deserto vicino, nelle piramidi di Saqqara, tra cui la piramide a gradoni di Gioser, e di Giza e Dahshur."
    - "Anche quando i re delle età successive governarono da Tebe, Menfi rimase residenza reale e città principale del Basso Egitto. Nel 671 a.C. il re assiro Assaraddon la prese al re cuscita Taharqa, il Tiraka della Bibbia, in mezza giornata secondo il resoconto dello stesso Assaraddon, e Assurbanipal la riconquistò pochi anni dopo. Nel 525 a.C. Cambise di Persia assediò e prese la città dopo la sua vittoria a Pelusio."
    - "Nella Bibbia ebraica la città è chiamata Nof, e in Osea Mof, che la King James Version rende Menfi. Isaia dice che i principi di Nof si ingannano, e Osea che Menfi seppellirà gli Israeliti che fuggono in Egitto. Geremia elenca Nof tra i luoghi dove vivevano ebrei in Egitto dopo la caduta di Gerusalemme e predisse che Nof sarebbe stata devastata e deserta; Ezechiele, che Dio avrebbe fatto sparire gli idoli da Nof."
    - "Alessandro Magno venne a Menfi nel 332 a.C. e sacrificò ad Api, il toro sacro che vi era custodito. I Tolomei fecero di Alessandria la loro capitale, ma Tolomeo V fu incoronato a Menfi, e la Stele di Rosetta reca un decreto emanato qui dai sacerdoti riuniti nel 196 a.C. Strabone trovava ancora Menfi grande e popolosa, seconda solo ad Alessandria, benché i suoi palazzi giacessero in rovina. Nei secoli romani e cristiani la città decadde, e gran parte delle sue pietre fu poi portata via per costruire il Cairo medievale."
  pl:
    - "Memfis leżało na zachodnim brzegu Nilu około 20 km na południe od dzisiejszego Kairu, blisko miejsca, gdzie rzeka rozwiera się w deltę; jego ruiny znajdują się przy wsi Mit Rahina. Herodot słyszał, że Min, pierwszy król Egiptu, założył je po spiętrzeniu Nilu i zbudował tam świątynię Ptaha, zwanego przez Greków Hefajstosem. Memfis było stolicą zjednoczonego królestwa od około 3000 r. p.n.e., a królowie Starego Państwa byli chowani na skraju pustyni w pobliżu, w piramidach Sakkary, wśród nich w piramidzie schodkowej Dżesera, oraz w Gizie i Dahszurze."
    - "Nawet gdy królowie późniejszych epok rządzili z Teb, Memfis pozostało rezydencją królewską i głównym miastem Dolnego Egiptu. W 671 r. p.n.e. król asyryjski Asarhaddon zabrał je kuszyckiemu królowi Taharce, biblijnemu Tirhace, w ciągu pół dnia według własnej relacji Asarhaddona, a Aszurbanipal odzyskał je kilka lat później. W 525 r. p.n.e. Kambyzes Perski oblegał i zdobył miasto po zwycięstwie pod Peluzjum."
    - "W Biblii hebrajskiej miasto nazywa się Nof, a u Ozeasza Mof, co Biblia Króla Jakuba oddaje jako Memphis. Izajasz mówi, że książęta Nof są zwiedzeni, a Ozeasz, że Memfis pogrzebie Izraelitów uciekających do Egiptu. Jeremiasz wylicza Nof wśród miejsc, gdzie Żydzi mieszkali w Egipcie po upadku Jerozolimy, i zapowiedział, że Nof będzie spustoszone i opustoszałe; Ezechiel, że Bóg sprawi, iż bałwany znikną z Nof."
    - "Aleksander Wielki przybył do Memfis w 332 r. p.n.e. i złożył ofiarę Apisowi, świętemu bykowi tam utrzymywanemu. Ptolemeusze uczynili swą stolicą Aleksandrię, ale Ptolemeusz V został koronowany w Memfis, a Kamień z Rosetty nosi dekret wydany tam przez zgromadzonych kapłanów w 196 r. p.n.e. Strabon wciąż znajdował Memfis wielkie i ludne, ustępujące tylko Aleksandrii, choć jego pałace leżały w ruinie. W wiekach rzymskich i chrześcijańskich miasto podupadło, a znaczną część jego kamienia wywieziono później do budowy średniowiecznego Kairu."
  nl:
    - "Memfis lag aan de westoever van de Nijl, zo'n 20 km ten zuiden van het moderne Caïro, bij het punt waar de rivier zich in de delta opent; haar ruïnes liggen bij het dorp Mit Rahina. Herodotus hoorde dat Min, de eerste koning van Egypte, haar stichtte nadat hij de Nijl had afgedamd en er de tempel van Ptah bouwde, die de Grieken Hefaistos noemden. Memfis was vanaf omstreeks 3000 v.Chr. de hoofdstad van het verenigde koninkrijk, en de koningen van het Oude Rijk werden vlakbij aan de woestijnrand begraven, in de piramiden van Sakkara, onder meer Djosers trappenpiramide, en van Gizeh en Dasjoer."
    - "Zelfs toen de koningen van latere tijden vanuit Thebe regeerden, bleef Memfis een koninklijke residentie en de hoofdstad van Neder-Egypte. In 671 v.Chr. nam de Assyrische koning Esarhaddon haar in op de Koesjitische koning Taharqa, de Tirhaka van de Bijbel, binnen een halve dag volgens Esarhaddons eigen verslag, en Assurbanipal heroverde haar enkele jaren later. In 525 v.Chr. belegerde en nam Cambyses van Perzië de stad in na zijn overwinning bij Pelusium."
    - "In de Hebreeuwse Bijbel heet de stad Nof, en bij Hosea Mof, wat de King James Version als Memphis weergeeft. Jesaja zegt dat de vorsten van Nof bedrogen zijn, en Hosea dat Memfis de Israëlieten zal begraven die naar Egypte vluchten. Jeremia noemt Nof onder de plaatsen waar joden in Egypte woonden na de val van Jeruzalem en voorspelde dat Nof woest en verlaten zou zijn; Ezechiël, dat God de afgodsbeelden uit Nof zou doen ophouden."
    - "Alexander de Grote kwam in 332 v.Chr. naar Memfis en offerde aan Apis, de heilige stier die daar werd gehouden. De Ptolemaeën maakten Alexandrië hun hoofdstad, maar Ptolemaeus V werd in Memfis gekroond, en de Steen van Rosette draagt een besluit dat daar in 196 v.Chr. door de verzamelde priesters werd uitgevaardigd. Strabo vond Memfis nog groot en volkrijk, alleen Alexandrië voorbij, hoewel haar paleizen in puin lagen. In de Romeinse en christelijke eeuwen raakte de stad in verval, en veel van haar steen werd later weggevoerd om het middeleeuwse Caïro te bouwen."
  cs:
    - "Memfis ležela na západním břehu Nilu asi 20 km jižně od dnešní Káhiry, poblíž místa, kde se řeka otevírá do delty; její zříceniny jsou u vesnice Mit Rahina. Hérodotos slyšel, že ji založil Min, první král Egypta, poté co přehradil Nil, a postavil tam chrám Ptahův, jejž Řekové nazývali Héfaistos. Memfis byla hlavním městem sjednoceného království od asi roku 3000 př. n. l. a králové Staré říše byli pohřbíváni na okraji pouště poblíž, v pyramidách v Sakkáře, mezi nimi Džoserova stupňovitá pyramida, a v Gíze a Dahšúru."
    - "I když králové pozdějších věků vládli z Théb, zůstala Memfis královskou rezidencí a hlavním městem Dolního Egypta. Roku 671 př. n. l. ji asyrský král Asarhadón vzal kúšitskému králi Taharqovi, biblickému Tirhakovi, podle Asarhadónova vlastního líčení za půl dne, a Aššurbanipal ji o několik let později znovu získal. Roku 525 př. n. l. město oblehl a dobyl Kambýsés Perský po svém vítězství u Pelúsia."
    - "V hebrejské Bibli se město jmenuje Nof a u Ozeáše Mof, které anglická Bible krále Jakuba překládá jako Memphis. Izajáš praví, že knížata Nofu jsou oklamána, a Ozeáš, že Memfis pohřbí Izraelce, kteří prchají do Egypta. Jeremjáš uvádí Nof mezi místa, kde žili Židé v Egyptě po pádu Jeruzaléma, a předpověděl, že Nof bude pustý a zpustošený; Ezechiel, že Bůh způsobí, aby modly z Nofu zmizely."
    - "Alexandr Veliký přišel do Memfidy roku 332 př. n. l. a obětoval Apisovi, posvátnému býkovi tam chovanému. Ptolemaiovci učinili hlavním městem Alexandrii, ale Ptolemaios V. byl korunován v Memfidě a Rosettská deska nese dekret vydaný tam shromážděnými kněžími roku 196 př. n. l. Strabón ještě shledal Memfidu velkou a lidnatou, druhou po Alexandrii, ač její paláce ležely v troskách. V římských a křesťanských staletích město upadalo a velká část jeho kamene byla později odvezena na stavbu středověké Káhiry."
  sv:
    - "Memfis låg på Nilens västra strand omkring 20 km söder om dagens Kairo, nära den punkt där floden öppnar sig i deltat; dess ruiner ligger vid byn Mit Rahina. Herodotos fick höra att Min, Egyptens förste kung, grundade den efter att ha dämt upp Nilen och byggde där Ptahs tempel, som grekerna kallade Hefaistos. Memfis var huvudstad i det enade riket från omkring 3000 f.Kr., och Gamla rikets kungar begravdes vid ökenkanten i närheten, i pyramiderna i Saqqara, bland dem Djosers trappstegspyramid, och i Giza och Dahshur."
    - "Även när senare tiders kungar styrde från Thebe förblev Memfis kungligt residens och Nedre Egyptens främsta stad. År 671 f.Kr. tog den assyriske kungen Esarhaddon den från den kushitiske kungen Taharqa, Bibelns Tirhaka, inom en halv dag enligt Esarhaddons egen uppgift, och Assurbanipal återvann den några år senare. År 525 f.Kr. belägrade och intog Kambyses av Persien staden efter sin seger vid Pelusium."
    - "I den hebreiska Bibeln heter staden Nof, och hos Hosea Mof, som King James Version återger med Memphis. Jesaja säger att Nofs furstar är bedragna, och Hosea att Mof skall begrava de israeliter som flyr till Egypten. Jeremia förtecknar Nof bland de platser där judar bodde i Egypten efter Jerusalems fall och förutsade att Nof skall bli ödelagt och öde; Hesekiel, att Gud skulle göra slut på avgudarna i Nof."
    - "Alexander den store kom till Memfis 332 f.Kr. och offrade åt Apis, den heliga tjuren som hölls där. Ptolemaierna gjorde Alexandria till sin huvudstad, men Ptolemaios V kröntes i Memfis, och Rosettastenen bär ett beslut utfärdat där av de församlade prästerna år 196 f.Kr. Strabon fann ännu Memfis stort och folkrikt, näst efter Alexandria, fastän dess palats låg i ruiner. Under romersk och kristen tid föll staden i förfall, och mycket av dess sten fördes senare bort för att bygga det medeltida Kairo."
  nb:
    - "Memfis lå på vestbredden av Nilen omkring 20 km sør for moderne Kairo, nær stedet der elven åpner seg i deltaet; ruinene ligger ved landsbyen Mit Rahina. Herodot hørte at Min, Egypts første konge, grunnla den etter å ha demmet opp Nilen og bygde der Ptahs tempel, som grekerne kalte Hefaistos. Memfis var hovedstad i det forente riket fra omkring 3000 f.Kr., og kongene i det gamle riket ble gravlagt i ørkenkanten like ved, i pyramidene i Saqqara, blant dem Djosers trinnpyramide, og i Giza og Dahshur."
    - "Selv da senere tiders konger styrte fra Teben, forble Memfis en kongelig residens og hovedbyen i Nedre Egypt. I 671 f.Kr. tok den assyriske kongen Asarhaddon den fra den kusjittiske kongen Taharqa, Bibelens Tirhaka, innen en halv dag etter Asarhaddons egen beretning, og Assurbanipal vant den tilbake noen år senere. I 525 f.Kr. beleiret og tok Kambyses av Persia byen etter seieren ved Pelusium."
    - "I den hebraiske Bibelen kalles byen Nof, og hos Hosea Mof, som King James-oversettelsen gjengir Memphis. Jesaja sier at Nofs fyrster er narret, og Hosea at Memfis skal begrave israelittene som flykter til Egypt. Jeremia oppfører Nof blant stedene der jøder bodde i Egypt etter Jerusalems fall og forutsa at Nof skal bli øde og ødelagt; Esekiel, at Gud ville la avgudsbildene opphøre i Nof."
    - "Aleksander den store kom til Memfis i 332 f.Kr. og ofret til Apis, den hellige oksen som ble holdt der. Ptolemeerne gjorde Aleksandria til sin hovedstad, men Ptolemaios V ble kronet i Memfis, og Rosettasteinen bærer en forordning utstedt der av de forsamlede prestene i 196 f.Kr. Strabon fant fortsatt Memfis stor og folkerik, nest etter Aleksandria, selv om dens palasser lå i ruiner. I romersk og kristen tid sank byen hen, og mye av steinen ble senere ført bort for å bygge middelalderens Kairo."
  tl:
    - "Ang Memfis ay nasa kanlurang pampang ng Nilo mga 20 km sa timog ng makabagong Cairo, malapit sa punto kung saan bumubukas ang ilog sa delta; ang mga guho nito ay nasa nayon ng Mit Rahina. Narinig ni Herodotus na itinatag ito ni Min, ang unang hari ng Egipto, matapos harangan ang Nilo, at itinayo roon ang templo ni Ptah, na tinawag ng mga Griyego na Hephaestus. Ang Memfis ang kabisera ng nagkakaisang kaharian mula mga 3000 BK, at inilibing ang mga hari ng Lumang Kaharian sa gilid ng disyerto sa malapit, sa mga piramide ng Saqqara, kabilang ang hagdang piramide ni Djoser, at ng Giza at Dahshur."
    - "Kahit na namuno ang mga hari ng kalaunang panahon mula sa Thebes, nanatiling tirahan ng hari at pangunahing lungsod ng Mababang Egipto ang Memfis. Noong 671 BK, kinuha ito ng haring Asirio na si Esar-hadon mula sa haring Kushita na si Taharqa, ang Thiraca ng Biblia, sa loob ng kalahating araw ayon sa sariling salaysay ni Esar-hadon, at binawi ito ni Ashurbanipal pagkaraan ng ilang taon. Noong 525 BK, kinubkob at sinakop ni Cambises ng Persia ang lungsod pagkatapos ng kaniyang tagumpay sa Pelusium."
    - "Sa Bibliyang Hebreo ang lungsod ay tinatawag na Noph, at sa Oseas na Moph, na isinasalin ng KJV na Memphis. Sinasabi ni Isaias na dinaya ang mga prinsipe ng Noph, at ni Oseas na ililibing ng Memfis ang mga Israelitang tatakas sa Egipto. Itinatala ni Jeremias ang Noph sa mga lugar na tinirahan ng mga Judio sa Egipto pagkatapos ng pagbagsak ng Jerusalem at inihulang magiging wasak at sira ang Noph; si Ezekiel, na patitigilin ng Diyos ang mga diyus-diyosan sa Noph."
    - "Dumating si Alejandro Magno sa Memfis noong 332 BK at naghandog kay Apis, ang sagradong toro na iningatan doon. Ginawang kabisera ng mga Ptolemeo ang Alejandria, ngunit si Ptolemeo V ay kinoronahan sa Memfis, at dala ng Bato ng Rosetta ang isang dekretong inilabas doon ng natipong mga saserdote noong 196 BK. Nakita pa ni Estrabon na malaki at makapal ang populasyon ng Memfis, pangalawa lamang sa Alejandria, bagaman wasak ang mga palasyo nito. Sa mga siglong Romano at Kristiyano, bumaba ang lungsod, at karamihan ng bato nito ay kalaunang dinala upang itayo ang medyebal na Cairo."
  da:
    - "Memfis lå på Nilens vestbred omkring 20 km syd for nutidens Kairo, nær det sted, hvor floden åbner sig til deltaet; dens ruiner ligger ved landsbyen Mit Rahina. Herodot hørte, at Min, Egyptens første konge, grundlagde den efter at have inddæmmet Nilen og byggede dér Ptahs tempel, som grækerne kaldte Hefaistos. Memfis var det forenede riges hovedstad fra omkring 3000 f.Kr., og Det Gamle Riges konger blev begravet i ørkenkanten i nærheden, i pyramiderne i Saqqara, blandt dem Djosers trinpyramide, og i Giza og Dahshur."
    - "Selv da senere tiders konger herskede fra Theben, forblev Memfis en kongelig residens og Nedre Egyptens hovedstad. I 671 f.Kr. tog den assyriske konge Esarhaddon den fra den kusjitiske konge Taharqa, Bibelens Tirhaka, inden for en halv dag efter Esarhaddons egen beretning, og Assurbanipal generobrede den få år senere. I 525 f.Kr. belejrede og indtog Kambyses af Persien byen efter sin sejr ved Pelusium."
    - "I den hebraiske bibel kaldes byen Nof, og hos Hoseas Mof, som King James-oversættelsen gengiver Memfis. Esajas siger, at Nofs fyrster er bedragne, og Hoseas, at Memfis skal begrave de israelitter, der flygter til Egypten. Jeremias opregner Nof blandt de steder, hvor jøder boede i Egypten efter Jerusalems fald, og forudsagde, at Nof skal blive øde og ødelagt; Ezekiel, at Gud ville lade billederne ophøre i Nof."
    - "Alexander den Store kom til Memfis i 332 f.Kr. og ofrede til Apis, den hellige tyr, der blev holdt dér. Ptolemæerne gjorde Alexandria til deres hovedstad, men Ptolemaios 5. blev kronet i Memfis, og Rosettastenen bærer et dekret udstedt dér af de forsamlede præster i 196 f.Kr. Strabon fandt stadig Memfis stor og folkerig, næstefter Alexandria, selv om dens paladser lå i ruiner. I de romerske og kristne århundreder gik byen tilbage, og meget af dens sten blev senere ført bort for at bygge middelalderens Kairo."
