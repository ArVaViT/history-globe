body:
  en:
    - "Rogelim was a town in Gilead, east of the Jordan, known only as the home of Barzillai the Gileadite. When David fled from Absalom to Mahanaim, “Barzillai the Gileadite of Rogelim” was one of the three men who brought beds, wheat, barley, beans, honey and cheese for the king and his hungry followers; and when David returned, Barzillai, “a very aged man, even fourscore years old”, “came down from Rogelim” to see him across the Jordan, declined the offer of a place at court and went home. The name is usually explained from the Hebrew word for a fuller, one who treads cloth, as if “the fullers' place”; the book gives no clue to its position beyond its lying in Gilead and the hint that one came “down” from it to the Jordan."
    - "No ancient writer locates Rogelim and no excavation has found it. Two neighbouring sites in the hills of northern Jordan, a few kilometres west of Irbid, have been proposed on the strength of their names: Zaharet, and the nearby Tell Barsina, whose name has been heard as an echo of Barzillai; the map shows both. The identification remains a guess. The surrounding country, the northern Gilead, is today the Irbid governorate of Jordan."
  ru:
    - "Роглим — город в Галааде, за Иорданом, известный лишь как родина Верзеллия Галаадитянина. Когда Давид бежал от Авессалома в Маханаим, «Верзеллий Галаадитянин из Роглима» был одним из троих, кто принёс царю и его голодным спутникам постели, пшеницу, ячмень, бобы, мёд и сыр; а когда Давид возвращался, Верзеллий, который «был очень стар, лет восьмидесяти», «пришел из Роглима» проводить его через Иордан, отказался от места при дворе и вернулся домой. Имя обычно выводят из еврейского слова «валяльщик» — тот, кто топчет ткань, — что-то вроде «место валяльщиков»; о положении города книга не говорит ничего, кроме того, что он лежал в Галааде."
    - "Ни один древний автор не указывает, где был Роглим, и раскопки его не нашли. По созвучию имён предложены два соседних места в холмах северной Иордании, в нескольких километрах к западу от Ирбида: Захарет и рядом с ним Телль-Барсина, в названии которого слышат отголосок имени Верзеллия; на карте показаны оба. Отождествление остаётся догадкой. Окрестная страна, северный Галаад, — это сегодня провинция Ирбид в Иордании."
  uk:
    - "Рогелім був містом у Гілеаді, на схід від Йордану, відомим лише як батьківщина Верзеллія Гілеадянина. Коли Давид утікав від Авесалома до Маханаїма, «Берзеллїй Галаадїй з Роглиму» був одним із трьох чоловіків, що принесли царю та його голодним супутникам постелі, пшеницю, ячмінь, боби, мед і сир; а коли Давид повертався, Верзеллій, «дуже старий чоловік, лїт вісїмдесятьох», прийшов із Рогеліма, щоб провести царя через Йордан, відмовився від місця при дворі й вернувся додому. Назву зазвичай виводять з івритського слова, що означає сукновала, того, хто топче сукно, начебто «місце сукновалів»; книга не дає жодної вказівки на його розташування, крім того, що воно було в Гілеаді, і натяку, що від нього йшли до Йордану вниз."
    - "Жоден давній автор не вказує, де лежав Рогелім, і жодні розкопки його не виявили. За збігом назв запропоновано два сусідні місця в горах північної Йорданії, за кілька кілометрів на захід від Ірбіда: Захарет і поблизу Телль-Барсіна, чию назву почули як відлуння імені Верзеллія; карта показує обидва. Ототожнення лишається здогадом. Навколишній край, північний Гілеад, нині належить до мухафази Ірбід у Йорданії."
  es:
    - "Rogelim era una ciudad de Galaad, al este del Jordán, conocida solo como patria de Barzilai el galaadita. Cuando David huyó de Absalón a Mahanaim, «Barzillai Galaadita de Rogelim» fue uno de los tres hombres que llevaron camas, trigo, cebada, habas, miel y quesos para el rey y sus hambrientos seguidores; y cuando David regresó, Barzilai, «muy viejo, de ochenta años», «descendió de Rogelim» para acompañarlo al otro lado del Jordán, rehusó la oferta de un lugar en la corte y volvió a su casa. El nombre suele explicarse por la palabra hebrea para el batanero, el que pisa el paño, como «el lugar de los bataneros»; el libro no da ninguna pista de su posición más allá de que está en Galaad y de la indicación de que se bajaba «de» ella al Jordán."
    - "Ningún escritor antiguo localiza Rogelim y ninguna excavación la ha hallado. Se han propuesto dos lugares vecinos en las colinas del norte de Jordania, a pocos kilómetros al oeste de Irbid, por sus nombres: Zaharet y la cercana Tell Barsina, cuyo nombre se ha oído como eco de Barzilai; el mapa muestra ambos. La identificación sigue siendo una conjetura. La región circundante, el norte de Galaad, es hoy la gobernación jordana de Irbid."
  pt:
    - "Rogelim era uma cidade de Gileade, a leste do Jordão, conhecida apenas como a terra de Barzilai, o gileadita. Quando Davi fugiu de Absalão para Maanaim, “Barzilai, o gileadita, de Rogelim” foi um dos três homens que trouxeram camas, trigo, cevada, feijão, mel e queijos para o rei e seus famintos seguidores; e quando Davi voltou, Barzilai, “um homem muito velho, de oitenta anos de idade”, “desceu de Rogelim” para acompanhá-lo na travessia do Jordão, recusou a oferta de um lugar na corte e voltou para casa. O nome costuma ser explicado pela palavra hebraica para pisoeiro, aquele que pisa tecidos, como “o lugar dos pisoeiros”; o livro não dá pista de sua posição além de ficar em Gileade e da indicação de que dali se descia ao Jordão."
    - "Nenhum autor antigo localiza Rogelim e nenhuma escavação a encontrou. Dois locais vizinhos nas colinas do norte da Jordânia, a poucos quilômetros a oeste de Irbid, foram propostos com base em seus nomes: Zaharet e a vizinha Tell Barsina, cujo nome foi ouvido como eco de Barzilai; o mapa mostra ambos. A identificação continua um palpite. A região em volta, o norte de Gileade, é hoje a província de Irbid, na Jordânia."
  de:
    - "Rogelim war eine Stadt in Gilead, östlich des Jordan, nur als Heimat Barsillais, des Gileaditers, bekannt. Als David vor Absalom nach Mahanajim floh, war „Barsillai, ein Gileaditer von Roglim“ einer der drei Männer, die Betten, Weizen, Gerste, Bohnen, Honig und Käse für den König und seine hungrigen Begleiter brachten; und als David zurückkehrte, „kam herab von Roglim“ Barsillai, der „sehr alt, wohl achtzig Jahre“ zählte, um ihn über den Jordan zu geleiten, lehnte das Angebot eines Platzes am Hof ab und ging heim. Der Name wird meist vom hebräischen Wort für einen Walker erklärt, einen, der Tuch tritt, gleichsam „Ort der Walker“; das Buch gibt keinen Hinweis auf seine Lage außer dass es in Gilead lag und dass man von dort „herab“ zum Jordan kam."
    - "Kein antiker Autor verortet Rogelim, und keine Grabung hat es gefunden. Zwei benachbarte Stätten im Bergland Nordjordaniens, wenige Kilometer westlich von Irbid, wurden wegen ihrer Namen vorgeschlagen: Zaharet und das nahe Tell Barsina, dessen Name als Anklang an Barsillai gehört wurde; die Karte zeigt beide. Die Gleichsetzung bleibt eine Vermutung. Das umliegende Land, das nördliche Gilead, ist heute das jordanische Gouvernement Irbid."
  fr:
    - "Roguelim était une ville de Galaad, à l’est du Jourdain, connue seulement comme la patrie de Barzillaï le Galaadite. Quand David s’enfuit devant Absalom à Mahanaïm, « Barzillaï, le Galaadite, de Roguelim » fut l’un des trois hommes qui apportèrent lits, froment, orge, fèves, miel et fromages au roi et à ses compagnons affamés ; et quand David revint, Barzillaï, « très vieux, âgé de quatre-vingts ans », « descendit de Roguelim » pour l’accompagner au-delà du Jourdain, déclina l’offre d’une place à la cour et rentra chez lui. Le nom s’explique d’ordinaire par le mot hébreu pour un foulon, celui qui foule le drap, comme « le lieu des foulons » ; le livre ne donne aucun indice sur sa position, sinon qu’elle est en Galaad et que l’on « descendait » de là vers le Jourdain."
    - "Aucun auteur ancien ne situe Roguelim et aucune fouille ne l’a trouvée. Deux sites voisins dans les collines du nord de la Jordanie, à quelques kilomètres à l’ouest d’Irbid, ont été proposés d’après leurs noms : Zaharet, et le proche Tell Barsina, dont le nom a été entendu comme un écho de Barzillaï ; la carte montre les deux. L’identification reste une conjecture. Le pays alentour, le nord de Galaad, est aujourd’hui le gouvernorat d’Irbid, en Jordanie."
  it:
    - "Roghelim era una città di Galaad, a est del Giordano, nota solo come patria di Barzillai il Galaadita. Quando Davide fuggì da Assalonne a Maanaim, «Barzillai, il Galaadita di Roghelim» fu uno dei tre uomini che portarono letti, grano, orzo, fave, miele e formaggi per il re e per i suoi affamati seguaci; e quando Davide tornò, Barzillai, «molto vecchio; aveva ottant’anni», «scese da Roghelim» per accompagnarlo al di là del Giordano, rifiutò l’offerta di un posto a corte e tornò a casa. Il nome è di solito spiegato dalla parola ebraica per il follatore, colui che pesta i panni, come «il luogo dei follatori»; il libro non dà indizi sulla sua posizione oltre al trovarsi in Galaad e all’accenno che da essa si «scendeva» al Giordano."
    - "Nessuno scrittore antico localizza Roghelim e nessuno scavo l’ha trovata. Due siti vicini sulle colline della Giordania settentrionale, qualche chilometro a ovest di Irbid, sono stati proposti in base ai loro nomi: Zaharet e la vicina Tell Barsina, il cui nome è stato inteso come un’eco di Barzillai; la mappa mostra entrambi. L’identificazione resta un’ipotesi. Il territorio circostante, il Galaad settentrionale, è oggi il governatorato giordano di Irbid."
  pl:
    - "Rogelim było miastem w Gileadzie, na wschód od Jordanu, znanym tylko jako dom Barzillaja Gileadczyka. Gdy Dawid uciekał przed Absalomem do Mahanaim, „Barsylaj Galaadczyk z Rogielim” był jednym z trzech mężów, którzy przynieśli łóżka, pszenicę, jęczmień, bób, miód i sery dla króla i jego głodnych towarzyszy; a gdy Dawid wracał, Barzillaj, „bardzo stary, mając osiemdziesiąt lat”, „wyszedłszy z Rogielim”, przeprowadził go przez Jordan, odmówił miejsca na dworze i wrócił do domu. Nazwę zwykle wyjaśnia się od hebrajskiego słowa oznaczającego folusznika, tego, który depcze sukno, jakby „miejsce foluszników”; księga nie daje wskazówki co do jego położenia poza tym, że leżało w Gileadzie, i sugestii, że z niego schodziło się nad Jordan."
    - "Żaden dawny pisarz nie lokalizuje Rogelim i żadne wykopaliska go nie znalazły. Dwa sąsiednie stanowiska we wzgórzach północnej Jordanii, kilka kilometrów na zachód od Irbidu, zaproponowano na podstawie ich nazw: Zaharet i pobliski Tell Barsina, którego nazwę słyszano jako echo Barzillaja; mapa pokazuje oba. Utożsamienie pozostaje domysłem. Otaczający kraj, północny Gilead, to dziś muhafaza Irbid w Jordanii."
  cs:
    - "Rógelim bylo město v Gileadu, východně od Jordánu, známé jen jako domov Barzilaje Gileadského. Když David utekl před Abšalomem do Machanajim, „Barzillai Galádský z Rogelim“ byl jedním ze tří mužů, kteří přinesli lůžka, pšenici, ječmen, bob, med a sýry pro krále a jeho hladové průvodce; a když se David vracel, Barzilaj, „velmi starý, maje osmdesáte let“, „vyšel z Rogelim“, aby jej přepravil přes Jordán, odmítl nabídku místa u dvora a vrátil se domů. Jméno se obvykle vykládá z hebrejského slova pro valchaře, toho, kdo šlape sukno, jako „místo valchářů“; kniha nedává o jeho poloze nic víc než že leželo v Gileadu a náznak, že se z něj k Jordánu sestupovalo."
    - "Žádný starověký spisovatel Rógelim nelokalizuje a žádné vykopávky jej nenašly. Na základě jmen byla navržena dvě sousední místa v pahorcích severního Jordánska, několik kilometrů západně od Irbidu: Zacharet a nedaleký Tell Barsina, jehož jméno se slyšelo jako ozvěna Barzilaje; mapa ukazuje obě. Ztotožnění zůstává dohadem. Okolní krajina, severní Gilead, je dnes jordánský guvernorát Irbid."
  nl:
    - "Rogelim was een stad in Gilead, ten oosten van de Jordaan, alleen bekend als de woonplaats van Barzillai de Gileadiet. Toen David voor Absalom naar Machanaïm vluchtte, was “Barzillai, de Gileadiet, van Rogelim” een van de drie mannen die bedden, tarwe, gerst, bonen, honing en kaas brachten voor de koning en zijn hongerige gevolg; en toen David terugkeerde, “kwam” Barzillai, “zeer oud, een man van tachtig jaren”, “ook af van Rogelim” om hem over de Jordaan te geleiden, sloeg het aanbod van een plaats aan het hof af en ging naar huis. De naam wordt meestal verklaard uit het Hebreeuwse woord voor een voller, wie doek treedt, alsof het “de plaats van de vollers” is; het boek geeft geen aanwijzing over de ligging behalve dat ze in Gilead lag en de wenk dat men er “af” kwam naar de Jordaan."
    - "Geen antieke schrijver plaatst Rogelim en geen opgraving heeft het gevonden. Twee naburige plaatsen in de heuvels van Noord-Jordanië, enkele kilometers ten westen van Irbid, zijn voorgesteld op grond van hun namen: Zaharet, en het nabije Tell Barsina, wier naam is gehoord als een echo van Barzillai; de kaart toont beide. De identificatie blijft een gok. Het omliggende land, het noordelijke Gilead, is tegenwoordig het gouvernement Irbid van Jordanië."
  sv:
    - "Rogelim var en stad i Gilead, öster om Jordan, känd bara som hemort för gileaditen Barsillaj. När David flydde från Absalom till Mahanajim var ”Barsillai, en gileadit från Rogelim” en av de tre män som förde sängar, vete, korn, bönor, honung och ost åt kungen och hans hungriga följe; och när David vände tillbaka var Barsillaj, ”mycket gammal: åttio år”, som ”farit ned från Rogelim” för att ledsaga honom över Jordan, avböjde erbjudandet om en plats vid hovet och gick hem. Namnet förklaras vanligen av det hebreiska ordet för en valkare, den som trampar tyg, som om det vore ”valkarnas plats”; boken ger ingen ledtråd till dess läge utöver att det låg i Gilead och antydan att man kom ”ned” från det till Jordan."
    - "Ingen antik författare lokaliserar Rogelim och ingen utgrävning har funnit det. Två närliggande platser i bergen i norra Jordanien, några kilometer väster om Irbid, har föreslagits på grund av sina namn: Zaharet och närliggande Tell Barsina, vars namn har hörts som ett eko av Barsillaj; kartan visar båda. Identifikationen förblir en gissning. Det omgivande landet, norra Gilead, är i dag guvernementet Irbid i Jordanien."
  nb:
    - "Rogelim var en by i Gilead, øst for Jordan, kjent bare som hjemstedet til gileaditten Barsillai. Da David flyktet fra Absalom til Mahanajim, var «gileaditten Barsillai fra Rogelim» en av de tre mennene som brakte senger, hvete, bygg, bønner, honning og ost til kongen og hans sultne følge; og da David vendte tilbake, var Barsillai, «meget gammel, åtti år», «kommet ned fra Rogelim» for å følge ham over Jordan, avslo tilbudet om en plass ved hoffet og dro hjem. Navnet forklares vanligvis ut fra det hebraiske ordet for en valker, en som tråkker klede, som «valkernes sted»; boken gir ingen anvisning på beliggenheten utover at den lå i Gilead og antydningen om at man kom «ned» fra den til Jordan."
    - "Ingen gammel forfatter plasserer Rogelim, og ingen utgravning har funnet det. To nabosteder i åsene i nordlige Jordan, noen få kilometer vest for Irbid, er foreslått på grunn av navnene: Zaharet, og nærliggende Tell Barsina, hvis navn er hørt som et ekko av Barsillai; kartet viser begge. Identifikasjonen er fortsatt et gjett. Landet omkring, nordlige Gilead, er i dag guvernementet Irbid i Jordan."
  tl:
    - "Ang Rogelim ay bayan sa Gilead, silangan ng Jordan, na kilala lamang bilang tahanan ni Barzillai na taga-Gilead. Nang tumakas si David kay Absalom patungong Mahanaim, si “Barzillai na Galaadita na taga Rogelim” ay isa sa tatlong lalaking nagdala ng mga higaan, trigo, sebada, bitsuwelas, pulot at keso para sa hari at sa mga gutom niyang tagasunod; at nang bumalik si David, si Barzillai, “lalaking matanda nang totoo, na may walong pung taon”, ay “lumusong mula sa Rogelim” upang ihatid siya sa kabila ng Jordan, tumanggi sa alok ng lugar sa korte at umuwi. Karaniwang ipinaliliwanag ang pangalan mula sa salitang Hebreo para sa tagapaglinis ng tela, ang yumuyurak sa tela, na tila “lugar ng mga tagapaglinis ng tela”; walang palatandaan ang aklat sa posisyon nito maliban sa nasa Gilead ito at may “bumababa” mula rito patungong Jordan."
    - "Walang sinaunang manunulat na naglalagay sa Rogelim at walang paghuhukay na nakatagpo nito. Dalawang karatig na lugar sa mga burol ng hilagang Jordan, ilang kilometro sa kanluran ng Irbid, ang iminungkahi batay sa kanilang mga pangalan: ang Zaharet, at ang karatig na Tell Barsina, na ang pangalan ay narinig na alingawngaw ni Barzillai; ipinapakita ng mapa ang dalawa. Hula pa rin ang pagkilala. Ang nakapalibot na lupain, ang hilagang Gilead, ay ang gobernorato ng Irbid ng Jordan ngayon."
  da:
    - "Rogelim var en by i Gilead, øst for Jordan, kendt kun som hjemsted for gileaditten Barzillaj. Da David flygtede fra Absalon til Mahanajim, var »Gileaditeren Barsillaj fra Roglim« en af de tre mænd, der bragte senge, hvede, byg, bønner, honning og ost til kongen og hans sultne følge; og da David vendte tilbage, hedder det: »Gileaditeren Barsillaj kom ned fra Roglim« for at følge ham over Jordan; han var »saare gammel, firsindstyve Aar gammel«, afslog tilbuddet om en plads ved hoffet og gik hjem. Navnet forklares sædvanligvis af det hebraiske ord for en valker, en der træder klæde, som »valkernes sted«; bogen giver ingen anvisning på dets beliggenhed ud over, at det lå i Gilead, og antydningen af, at man kom »ned« fra det til Jordan."
    - "Ingen gammel forfatter placerer Rogelim, og ingen udgravning har fundet det. To nabosteder i bjergene i det nordlige Jordan, få kilometer vest for Irbid, er foreslået på grund af deres navne: Zaharet og den nærliggende Tell Barsina, hvis navn er blevet hørt som et ekko af Barzillaj; kortet viser begge. Identifikationen forbliver et gæt. Egnen omkring, det nordlige Gilead, er i dag Irbid-guvernementet i Jordan."
  sr:
    - "Рогелим је био град у Галаду, источно од Јордана, познат само као завичај Варзелаја Галађанина. Кад је Давид бежао од Авесалома у Маханајим, „Варзелај од Галада из Рогелима“ био је један од тројице људи који су донели постеље, пшеницу, јечам, боб, мед и сир за цара и његове гладне следбенике; а кад се Давид вратио, Варзелај, „врло стар, беше му осамдесет година“, „дође из Рогелима“ да га испрати преко Јордана, одбио је понуду места на двору и вратио се кући. Име се обично објашњава од хебрејске речи за ваљара, онога који гази сукно, као „место ваљара“; књига не даје трага о његовом положају осим да лежи у Галаду и наговештаја да се из њега „силазило“ на Јордан."
    - "Ниједан стари писац не смешта Рогелим и ниједно ископавање га није нашло. Два суседна налазишта у брдима северног Јордана, неколико километара западно од Ирбида, предложена су на основу својих имена: Захарет и оближњи Тел Барсина, чије је име схваћено као одјек Варзелаја; карта приказује оба. Поистовећење остаје нагађање. Околна земља, северни Галад, данас је гувернорат Ирбид у Јордану."
scripture:
  - 2Sam.17.27-2Sam.17.29
  - 2Sam.19.31-2Sam.19.39
sources:
  - "N. Glueck, Explorations in Eastern Palestine IV (Annual of the American Schools of Oriental Research 25–28, 1951)"
  - "S. Mittmann, Beiträge zur Siedlungs- und Territorialgeschichte des nördlichen Ostjordanlandes (1970)"
  - "F.-M. Abel, Géographie de la Palestine, vol. 2 (1938)"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. and enl. ed., 1979)"
