# Overview article (ADR 0007). Mainstream facts only; a minor place: the two proposed sites rest on their names, nothing is excavated, and this is said.
id: rogelim
place: a7d0e71
title:
  en: "Rogelim"
  ru: "Роглим"
body:
  en:
    - "Rogelim was a town in Gilead, east of the Jordan, known only as the home of Barzillai the Gileadite. When David fled from Absalom to Mahanaim, “Barzillai the Gileadite of Rogelim” was one of the three men who brought beds, wheat, barley, beans, honey and cheese for the king and his hungry followers; and when David returned, Barzillai, “a very aged man, even fourscore years old”, “came down from Rogelim” to see him across the Jordan, declined the offer of a place at court and went home. The name is usually explained from the Hebrew word for a fuller, one who treads cloth, as if “the fullers' place”; the book gives no clue to its position beyond its lying in Gilead and the hint that one came “down” from it to the Jordan."
    - "No ancient writer locates Rogelim and no excavation has found it. Two neighbouring sites in the hills of northern Jordan, a few kilometres west of Irbid, have been proposed on the strength of their names: Zaharet, and the nearby Tell Barsina, whose name has been heard as an echo of Barzillai; the map shows both. Neither has been dug, and the identification remains a guess. The surrounding country, the northern Gilead, is today the Irbid governorate of Jordan."
  ru:
    - "Роглим — город в Галааде, за Иорданом, известный лишь как родина Верзеллия Галаадитянина. Когда Давид бежал от Авессалома в Маханаим, «Верзеллий Галаадитянин из Роглима» был одним из троих, кто принёс царю и его голодным спутникам постели, пшеницу, ячмень, бобы, мёд и сыр; а когда Давид возвращался, Верзеллий, который «был очень стар, лет восьмидесяти», «пришел из Роглима» проводить его через Иордан, отказался от места при дворе и вернулся домой. Имя обычно выводят из еврейского слова «валяльщик» — тот, кто топчет ткань, — что-то вроде «место валяльщиков»; о положении города книга не говорит ничего, кроме того, что он лежал в Галааде."
    - "Ни один древний автор не указывает, где был Роглим, и раскопки его не нашли. По созвучию имён предложены два соседних места в холмах северной Иордании, в нескольких километрах к западу от Ирбида: Захарет и рядом с ним Телль-Барсина, в названии которого слышат отголосок имени Верзеллия; на карте показаны оба. Ни одно не раскопано, и отождествление остаётся догадкой. Окрестная страна, северный Галаад, — это сегодня провинция Ирбид в Иордании."
scripture:
