# Overview article (ADR 0007). Mainstream facts only; a minor place: the two proposed sites rest on their names, nothing is excavated, and this is said.
id: rogelim
place: a7d0e71
title:
  en: "Rogelim"
  ru: "Роглим"
  uk: "Рогелім"
  es: "Rogelim"
  pt: "Rogelim"
  de: "Rogelim"
  fr: "Roguelim"
body:
  en:
    - "Rogelim was a town in Gilead, east of the Jordan, known only as the home of Barzillai the Gileadite. When David fled from Absalom to Mahanaim, “Barzillai the Gileadite of Rogelim” was one of the three men who brought beds, wheat, barley, beans, honey and cheese for the king and his hungry followers; and when David returned, Barzillai, “a very aged man, even fourscore years old”, “came down from Rogelim” to see him across the Jordan, declined the offer of a place at court and went home. The name is usually explained from the Hebrew word for a fuller, one who treads cloth, as if “the fullers' place”; the book gives no clue to its position beyond its lying in Gilead and the hint that one came “down” from it to the Jordan."
    - "No ancient writer locates Rogelim and no excavation has found it. Two neighbouring sites in the hills of northern Jordan, a few kilometres west of Irbid, have been proposed on the strength of their names: Zaharet, and the nearby Tell Barsina, whose name has been heard as an echo of Barzillai; the map shows both. Neither has been dug, and the identification remains a guess. The surrounding country, the northern Gilead, is today the Irbid governorate of Jordan."
  ru:
    - "Роглим — город в Галааде, за Иорданом, известный лишь как родина Верзеллия Галаадитянина. Когда Давид бежал от Авессалома в Маханаим, «Верзеллий Галаадитянин из Роглима» был одним из троих, кто принёс царю и его голодным спутникам постели, пшеницу, ячмень, бобы, мёд и сыр; а когда Давид возвращался, Верзеллий, который «был очень стар, лет восьмидесяти», «пришел из Роглима» проводить его через Иордан, отказался от места при дворе и вернулся домой. Имя обычно выводят из еврейского слова «валяльщик» — тот, кто топчет ткань, — что-то вроде «место валяльщиков»; о положении города книга не говорит ничего, кроме того, что он лежал в Галааде."
    - "Ни один древний автор не указывает, где был Роглим, и раскопки его не нашли. По созвучию имён предложены два соседних места в холмах северной Иордании, в нескольких километрах к западу от Ирбида: Захарет и рядом с ним Телль-Барсина, в названии которого слышат отголосок имени Верзеллия; на карте показаны оба. Ни одно не раскопано, и отождествление остаётся догадкой. Окрестная страна, северный Галаад, — это сегодня провинция Ирбид в Иордании."
  uk:
    - "Рогелім був містом у Гілеаді, на схід від Йордану, відомим лише як батьківщина Верзеллія Гілеадянина. Коли Давид утікав від Авесалома до Маханаїма, «Берзеллїй Галаадїй з Роглиму» був одним із трьох чоловіків, що принесли царю та його голодним супутникам постелі, пшеницю, ячмінь, боби, мед і сир; а коли Давид повертався, Верзеллій, «дуже старий чоловік, лїт вісїмдесятьох», прийшов із Рогеліма, щоб провести царя через Йордан, відмовився від місця при дворі й вернувся додому. Назву зазвичай виводять з івритського слова, що означає сукновала, того, хто топче сукно, начебто «місце сукновалів»; книга не дає жодної вказівки на його розташування, крім того, що воно було в Гілеаді, і натяку, що від нього йшли до Йордану вниз."
    - "Жоден давній автор не вказує, де лежав Рогелім, і жодні розкопки його не виявили. За збігом назв запропоновано два сусідні місця в горах північної Йорданії, за кілька кілометрів на захід від Ірбіда: Захарет і поблизу Телль-Барсіна, чию назву почули як відлуння імені Верзеллія; карта показує обидва. Жодне з них не розкопане, і ототожнення лишається здогадом. Навколишній край, північний Гілеад, нині належить до мухафази Ірбід у Йорданії."
  es:
    - "Rogelim era una ciudad de Galaad, al este del Jordán, conocida solo como patria de Barzilai el galaadita. Cuando David huyó de Absalón a Mahanaim, «Barzillai Galaadita de Rogelim» fue uno de los tres hombres que llevaron camas, trigo, cebada, habas, miel y quesos para el rey y sus hambrientos seguidores; y cuando David regresó, Barzilai, «muy viejo, de ochenta años», «descendió de Rogelim» para acompañarlo al otro lado del Jordán, rehusó la oferta de un lugar en la corte y volvió a su casa. El nombre suele explicarse por la palabra hebrea para el batanero, el que pisa el paño, como «el lugar de los bataneros»; el libro no da ninguna pista de su posición más allá de que está en Galaad y de la indicación de que se bajaba «de» ella al Jordán."
    - "Ningún escritor antiguo localiza Rogelim y ninguna excavación la ha hallado. Se han propuesto dos lugares vecinos en las colinas del norte de Jordania, a pocos kilómetros al oeste de Irbid, por sus nombres: Zaharet y la cercana Tell Barsina, cuyo nombre se ha oído como eco de Barzilai; el mapa muestra ambos. Ninguno ha sido excavado, y la identificación sigue siendo una conjetura. La región circundante, el norte de Galaad, es hoy la gobernación jordana de Irbid."
  pt:
    - "Rogelim era uma cidade de Gileade, a leste do Jordão, conhecida apenas como a terra de Barzilai, o gileadita. Quando Davi fugiu de Absalão para Maanaim, “Barzilai, o gileadita, de Rogelim” foi um dos três homens que trouxeram camas, trigo, cevada, feijão, mel e queijos para o rei e seus famintos seguidores; e quando Davi voltou, Barzilai, “um homem muito velho, de oitenta anos de idade”, “desceu de Rogelim” para acompanhá-lo na travessia do Jordão, recusou a oferta de um lugar na corte e voltou para casa. O nome costuma ser explicado pela palavra hebraica para pisoeiro, aquele que pisa tecidos, como “o lugar dos pisoeiros”; o livro não dá pista de sua posição além de ficar em Gileade e da indicação de que dali se descia ao Jordão."
    - "Nenhum autor antigo localiza Rogelim e nenhuma escavação a encontrou. Dois locais vizinhos nas colinas do norte da Jordânia, a poucos quilômetros a oeste de Irbid, foram propostos com base em seus nomes: Zaharet e a vizinha Tell Barsina, cujo nome foi ouvido como eco de Barzilai; o mapa mostra ambos. Nenhum foi escavado, e a identificação continua um palpite. A região em volta, o norte de Gileade, é hoje a província de Irbid, na Jordânia."
  de:
    - "Rogelim war eine Stadt in Gilead, östlich des Jordan, nur als Heimat Barsillais, des Gileaditers, bekannt. Als David vor Absalom nach Mahanajim floh, war „Barsillai, ein Gileaditer von Roglim“ einer der drei Männer, die Betten, Weizen, Gerste, Bohnen, Honig und Käse für den König und seine hungrigen Begleiter brachten; und als David zurückkehrte, „kam herab von Roglim“ Barsillai, der „sehr alt, wohl achtzig Jahre“ zählte, um ihn über den Jordan zu geleiten, lehnte das Angebot eines Platzes am Hof ab und ging heim. Der Name wird meist vom hebräischen Wort für einen Walker erklärt, einen, der Tuch tritt, gleichsam „Ort der Walker“; das Buch gibt keinen Hinweis auf seine Lage außer dass es in Gilead lag und dass man von dort „herab“ zum Jordan kam."
    - "Kein antiker Autor verortet Rogelim, und keine Grabung hat es gefunden. Zwei benachbarte Stätten im Bergland Nordjordaniens, wenige Kilometer westlich von Irbid, wurden wegen ihrer Namen vorgeschlagen: Zaharet und das nahe Tell Barsina, dessen Name als Anklang an Barsillai gehört wurde; die Karte zeigt beide. Keine ist ausgegraben, und die Gleichsetzung bleibt eine Vermutung. Das umliegende Land, das nördliche Gilead, ist heute das jordanische Gouvernement Irbid."
  fr:
    - "Roguelim était une ville de Galaad, à l’est du Jourdain, connue seulement comme la patrie de Barzillaï le Galaadite. Quand David s’enfuit devant Absalom à Mahanaïm, « Barzillaï, le Galaadite, de Roguelim » fut l’un des trois hommes qui apportèrent lits, froment, orge, fèves, miel et fromages au roi et à ses compagnons affamés ; et quand David revint, Barzillaï, « très vieux, âgé de quatre-vingts ans », « descendit de Roguelim » pour l’accompagner au-delà du Jourdain, déclina l’offre d’une place à la cour et rentra chez lui. Le nom s’explique d’ordinaire par le mot hébreu pour un foulon, celui qui foule le drap, comme « le lieu des foulons » ; le livre ne donne aucun indice sur sa position, sinon qu’elle est en Galaad et que l’on « descendait » de là vers le Jourdain."
    - "Aucun auteur ancien ne situe Roguelim et aucune fouille ne l’a trouvée. Deux sites voisins dans les collines du nord de la Jordanie, à quelques kilomètres à l’ouest d’Irbid, ont été proposés d’après leurs noms : Zaharet, et le proche Tell Barsina, dont le nom a été entendu comme un écho de Barzillaï ; la carte montre les deux. Ni l’un ni l’autre n’a été fouillé, et l’identification reste une conjecture. Le pays alentour, le nord de Galaad, est aujourd’hui le gouvernorat d’Irbid, en Jordanie."
scripture:
