body:
  en:
    - "Dalmatia, named after the Illyrian people of the Delmatae, is the coastland and mountain hinterland on the eastern shore of the Adriatic. Rome fought the Delmatae from the second century BC and brought them to heel under Octavian in the 30s BC; the region formed part of Illyricum. After the great Illyrian revolt of AD 6–9, led by two chiefs both named Bato, which took Tiberius three years to put down, Illyricum was in time divided, and its southern part became the province of Dalmatia, reaching from Istria to the borders of Macedonia and inland across the Dinaric mountains. Its capital was Salona, near modern Split."
    - "In his last letter, written from prison, Paul tells Timothy how his companions have scattered: “For Demas hath forsaken me, having loved this present world, and is departed unto Thessalonica; Crescens to Galatia, Titus unto Dalmatia.” Titus had earlier been left in Crete to set the churches there in order. Writing to the Romans some years before, Paul had said that he had preached the gospel “round about unto Illyricum”, the wider region to which Dalmatia belonged."
    - "Salona grew into one of the great cities of the Adriatic. Diocletian, a Dalmatian by birth, built a fortified palace a few kilometres away at Spalatum and lived there after he gave up the throne in 305. Today Dalmatia is the coastal region of Croatia, with Zadar, Split and Dubrovnik; the ruins of Salona lie at Solin, and Diocletian's palace forms the heart of the old town of Split, inscribed on the UNESCO World Heritage List in 1979."
  ru:
    - "Далматия, названная по иллирийскому народу далматов, — это побережье и горная глубинка на восточном берегу Адриатики. Рим воевал с далматами со II в. до н. э. и усмирил их при Октавиане в 30-х гг. до н. э.; край входил в Иллирик. После большого иллирийского восстания 6–9 гг. н. э. во главе с двумя вождями, которых обоих звали Батон, — Тиберию понадобилось три года, чтобы его подавить, — Иллирик со временем был разделён, и его южная часть стала провинцией Далматия, протянувшейся от Истрии до границ Македонии и вглубь, через Динарские горы. Её столицей была Салона близ нынешнего Сплита."
    - "В последнем письме, написанном в узах, Павел рассказывает Тимофею, как рассеялись его спутники: «Ибо Димас оставил меня, возлюбив нынешний век, и пошел в Фессалонику, Крискент в Галатию, Тит в Далматию». Тита он прежде оставил на Крите, чтобы тот устроил тамошние церкви. В Послании к Римлянам, за несколько лет до того, Павел писал, что благовествование Христово распространено им «от Иерусалима и окрестности до Иллирика» — более широкого края, к которому принадлежала Далматия."
    - "Салона выросла в один из крупнейших городов Адриатики. Диоклетиан, далматинец по рождению, построил в нескольких километрах от неё укреплённый дворец в Спалате и жил там, отрёкшись от власти в 305 г. Сегодня Далматия — приморская область Хорватии с Задаром, Сплитом и Дубровником; руины Салоны лежат в Солине, а дворец Диоклетиана составляет сердце старого Сплита, внесённого в 1979 г. в список Всемирного наследия ЮНЕСКО."
  uk:
    - "Далмація, названа за іллірійським народом делматів, — це узбережжя й гірський внутрішній край на східному березі Адріатики. Рим воював з делматами від II ст. до н. е. і приборкав їх за Октавіана в 30-х рр. до н. е.; область входила до Іллірика. Після великого іллірійського повстання 6–9 рр. н. е., яким керували двоє ватажків, обидва на ймення Бато, і яке Тиверій придушував три роки, Іллірик із часом поділили, а його південна частина стала провінцією Далмація, що сягала від Істрії до кордонів Македонії та вглиб суходолу через Динарські гори. Її столицею була Салона, поблизу сучасного Спліта."
    - "У своєму останньому листі, написаному з в'язниці, Павло розповідає Тимофієві, як розійшлися його супутники: «Димас бо мене покинув, полюбивши нинїшнїй вік, та й пійшов у Солунь; Крискент в Галатию, Тит в Далматию». Тита раніше залишили на Криті впорядкувати тамтешні церкви. Пишучи до римлян кількома роками раніше, Павло сказав, що сповнив благовістя «і кругом аж до Ілирика», ширшого краю, до якого належала Далмація."
    - "Салона виросла в одне з великих міст Адріатики. Діоклетіан, далматинець за народженням, збудував укріплений палац за кілька кілометрів звідти, в Спалатумі, і жив у ньому після зречення престолу 305 р. Нині Далмація — приморський регіон Хорватії зі Задаром, Сплітом і Дубровником; руїни Салони лежать у Солині, а палац Діоклетіана становить серце старого міста Спліт, внесеного до Списку всесвітньої спадщини ЮНЕСКО 1979 р."
  es:
    - "Dalmacia, que debe su nombre al pueblo ilirio de los dálmatas, es la costa y el interior montañoso de la orilla oriental del Adriático. Roma combatió a los dálmatas desde el siglo II a. C. y los sometió bajo Octavio en los años 30 a. C.; la región formaba parte de Iliria. Tras la gran rebelión ilírica de 6–9 d. C., dirigida por dos jefes llamados ambos Bato, que Tiberio tardó tres años en sofocar, Iliria fue dividida con el tiempo, y su parte meridional se convirtió en la provincia de Dalmacia, que se extendía de Istria a las fronteras de Macedonia y tierra adentro a través de los Alpes Dináricos. Su capital era Salona, cerca de la actual Split."
    - "En su última carta, escrita desde la cárcel, Pablo cuenta a Timoteo cómo se han dispersado sus compañeros: «Porque Demas me ha desamparado, amando este siglo, y se ha ido á Tesalónica; Crescente á Galacia, Tito á Dalmacia». Tito había sido dejado antes en Creta para poner en orden las iglesias de allí. Escribiendo a los romanos años antes, Pablo había dicho que había predicado el evangelio «por los alrededores hasta Ilírico», la región más amplia a la que pertenecía Dalmacia."
    - "Salona llegó a ser una de las grandes ciudades del Adriático. Diocleciano, dálmata de nacimiento, construyó un palacio fortificado a pocos kilómetros, en Spalatum, y vivió allí tras abdicar en 305. Hoy Dalmacia es la región costera de Croacia, con Zadar, Split y Dubrovnik; las ruinas de Salona se hallan en Solin, y el palacio de Diocleciano forma el corazón del casco antiguo de Split, inscrito en la lista del Patrimonio Mundial de la UNESCO en 1979."
  pt:
    - "A Dalmácia, assim chamada pelo povo ilírio dos delmatas, é a região litorânea e o interior montanhoso da costa oriental do Adriático. Roma combateu os delmatas a partir do século II a.C. e os dobrou sob Otaviano nos anos 30 a.C.; a região fazia parte do Ilírico. Depois da grande revolta ilíria de 6–9 d.C., liderada por dois chefes ambos chamados Bato, que custou a Tibério três anos para sufocar, o Ilírico foi com o tempo dividido, e sua parte sul tornou-se a província da Dalmácia, que ia da Ístria às fronteiras da Macedônia e, para o interior, atravessava os Alpes Dináricos. Sua capital era Salona, perto da atual Split."
    - "Em sua última carta, escrita na prisão, Paulo conta a Timóteo como seus companheiros se dispersaram: “pois Demas me abandonou, tendo amado este mundo presente, e foi para Tessalônica; Crescente para a Galácia; e Tito para a Dalmácia”. Tito fora deixado antes em Creta para pôr em ordem as igrejas dali. Escrevendo aos romanos alguns anos antes, Paulo dissera que havia pregado o evangelho “desde Jerusalém e as regiões vizinhas até o Ilírico”, a região mais ampla a que a Dalmácia pertencia."
    - "Salona cresceu até ser uma das grandes cidades do Adriático. Diocleciano, dálmata de nascimento, construiu um palácio fortificado a poucos quilômetros dali, em Spalatum, e viveu nele depois de abdicar do trono em 305. Hoje a Dalmácia é a região costeira da Croácia, com Zadar, Split e Dubrovnik; as ruínas de Salona ficam em Solin, e o palácio de Diocleciano forma o coração da cidade velha de Split, inscrita na Lista do Patrimônio Mundial da UNESCO em 1979."
  de:
    - "Dalmatien, nach dem illyrischen Volk der Delmaten benannt, ist das Küstenland und gebirgige Hinterland am Ostufer der Adria. Rom bekämpfte die Delmaten seit dem zweiten Jahrhundert v. Chr. und zwang sie in den 30er Jahren v. Chr. unter Octavian nieder; die Region gehörte zu Illyrien. Nach dem großen illyrischen Aufstand der Jahre 6–9 n. Chr. unter zwei Anführern namens Bato, den Tiberius in drei Jahren niederwarf, wurde Illyrien mit der Zeit geteilt, und sein südlicher Teil wurde die Provinz Dalmatien, die von Istrien bis an die Grenzen Mazedoniens und landeinwärts über das Dinarische Gebirge reichte. Ihre Hauptstadt war Salona, nahe dem heutigen Split."
    - "In seinem letzten Brief, aus dem Gefängnis geschrieben, erzählt Paulus Timotheus, wie sich seine Gefährten zerstreut haben: „Denn Demas hat mich verlassen und hat diese Welt liebgewonnen und ist gen Thessalonich gezogen, Kreszens nach Galatien, Titus nach Dalmatien.“ Titus war früher in Kreta zurückgelassen worden, um die dortigen Gemeinden zu ordnen. Als er einige Jahre zuvor an die Römer schrieb, hatte Paulus gesagt, er habe von Jerusalem an „und umher bis Illyrien“ das Evangelium verkündigt, die weitere Region, zu der Dalmatien gehörte."
    - "Salona wuchs zu einer der großen Städte der Adria heran. Diokletian, gebürtiger Dalmatiner, baute einige Kilometer entfernt in Spalatum einen befestigten Palast und lebte dort, nachdem er 305 den Thron aufgegeben hatte. Heute ist Dalmatien die Küstenregion Kroatiens mit Zadar, Split und Dubrovnik; die Ruinen von Salona liegen bei Solin, und Diokletians Palast bildet das Herz der Altstadt von Split, die 1979 in die UNESCO-Welterbeliste eingetragen wurde."
  fr:
    - "La Dalmatie, qui doit son nom au peuple illyrien des Delmates, est le littoral et l’arrière-pays montagneux de la rive orientale de l’Adriatique. Rome combattit les Delmates dès le IIe siècle av. J.-C. et les soumit sous Octavien dans les années 30 av. J.-C. ; la région faisait partie de l’Illyricum. Après la grande révolte illyrienne de 6–9 apr. J.-C., menée par deux chefs portant tous deux le nom de Bato, et que Tibère mit trois ans à réprimer, l’Illyricum fut à terme divisé, et sa partie sud devint la province de Dalmatie, qui s’étendait de l’Istrie aux confins de la Macédoine et, vers l’intérieur, à travers les monts Dinariques. Sa capitale était Salone, près de l’actuelle Split."
    - "Dans sa dernière lettre, écrite de prison, Paul dit à Timothée comment ses compagnons se sont dispersés : « car Démas m’a abandonné, par amour pour le siècle présent, et il est parti pour Thessalonique ; Crescens est allé en Galatie, Tite en Dalmatie. » Tite avait été laissé auparavant en Crète pour y mettre en ordre les Églises. Écrivant aux Romains quelques années plus tôt, Paul avait dit qu’il avait répandu l’Évangile dans « les pays voisins jusqu’en Illyrie », la vaste région à laquelle appartenait la Dalmatie."
    - "Salone devint l’une des grandes villes de l’Adriatique. Dioclétien, Dalmate de naissance, fit bâtir un palais fortifié à quelques kilomètres de là, à Spalatum, et y vécut après avoir abdiqué en 305. Aujourd’hui, la Dalmatie est la région côtière de la Croatie, avec Zadar, Split et Dubrovnik ; les ruines de Salone se trouvent à Solin, et le palais de Dioclétien forme le cœur de la vieille ville de Split, inscrite sur la Liste du patrimoine mondial de l’UNESCO en 1979."
  it:
    - "La Dalmazia, che prende nome dal popolo illirico dei Delmati, è la regione costiera e montuosa dell’entroterra sulla sponda orientale dell’Adriatico. Roma combatté i Delmati dal II secolo a.C. e li domò sotto Ottaviano negli anni 30 a.C.; la regione faceva parte dell’Illirico. Dopo la grande rivolta illirica del 6–9 d.C., guidata da due capi di nome Bato, che Tiberio impiegò tre anni a domare, l’Illirico fu col tempo diviso, e la sua parte meridionale divenne la provincia di Dalmazia, che si estendeva dall’Istria ai confini della Macedonia e all’interno attraverso le Alpi Dinariche. La sua capitale era Salona, presso l’odierna Spalato."
    - "Nella sua ultima lettera, scritta dal carcere, Paolo racconta a Timoteo come i suoi compagni si sono dispersi: «poiché Dema, avendo amato il presente secolo, mi ha lasciato e se n’è andato a Tessalonica. Crescente è andato in Galazia, Tito in Dalmazia». Tito era stato lasciato in precedenza a Creta per mettere in ordine le chiese di quell’isola. Scrivendo ai Romani alcuni anni prima, Paolo aveva detto di aver predicato il Vangelo «da Gerusalemme e dai luoghi intorno fino all’Illiria», la regione più ampia a cui apparteneva la Dalmazia."
    - "Salona crebbe fino a diventare una delle grandi città dell’Adriatico. Diocleziano, dalmata di nascita, costruì un palazzo fortificato a pochi chilometri di distanza, a Spalatum, e vi visse dopo aver lasciato il trono nel 305. Oggi la Dalmazia è la regione costiera della Croazia, con Zara, Spalato e Dubrovnik; le rovine di Salona si trovano a Solin, e il palazzo di Diocleziano forma il cuore della città vecchia di Spalato, iscritta nella lista del patrimonio mondiale dell’UNESCO nel 1979."
  nl:
    - "Dalmatië, genoemd naar het Illyrische volk van de Delmatae, is het kustland en bergachterland aan de oostkust van de Adriatische Zee. Rome voerde vanaf de tweede eeuw v.Chr. oorlog tegen de Delmatae en bracht hen in de jaren 30 v.Chr. onder Octavianus tot onderwerping; de streek maakte deel uit van Illyricum. Na de grote Illyrische opstand van 6–9 n.Chr., geleid door twee aanvoerders die beiden Bato heetten en die Tiberius drie jaar kostte om neer te slaan, werd Illyricum na verloop van tijd verdeeld, en het zuidelijke deel werd de provincie Dalmatië, die zich van Istrië tot de grenzen van Macedonië en landinwaarts over het Dinarisch gebergte uitstrekte. De hoofdstad was Salona, bij het moderne Split."
    - "In zijn laatste brief, geschreven vanuit de gevangenis, vertelt Paulus aan Timoteüs hoe zijn metgezellen zijn uiteengegaan: “Want Demas heeft mij verlaten, hebbende de tegenwoordige wereld liefgekregen, en is naar Thessalonica gereisd; Krescens naar Galatië, Titus naar Dalmatië.” Titus was eerder op Kreta achtergelaten om de gemeenten daar te ordenen. Enkele jaren eerder had Paulus aan de Romeinen geschreven dat hij het evangelie had verkondigd “rondom, tot Illyrikum toe”, de ruimere streek waartoe Dalmatië behoorde."
    - "Salona groeide uit tot een van de grote steden van de Adriatische Zee. Diocletianus, van geboorte een Dalmatiër, liet enkele kilometers verderop bij Spalatum een versterkt paleis bouwen en woonde daar nadat hij in 305 afstand van de troon had gedaan. Tegenwoordig is Dalmatië de kuststreek van Kroatië, met Zadar, Split en Dubrovnik; de ruïnes van Salona liggen bij Solin, en het paleis van Diocletianus vormt het hart van de oude stad van Split, in 1979 op de werelderfgoedlijst van UNESCO geplaatst."
  pl:
    - "Dalmacja, nazwana od iliryjskiego ludu Delmatów, to nadmorskie pasmo i górskie zaplecze na wschodnim brzegu Adriatyku. Rzym walczył z Delmatami od II w. p.n.e. i ujarzmił ich pod wodzą Oktawiana w latach 30. p.n.e.; region wchodził w skład Illiryku. Po wielkim powstaniu iliryjskim z lat 6-9 n.e., prowadzonym przez dwóch wodzów o imieniu Bato, które Tyberiusz tłumił przez trzy lata, Illiryk został z czasem podzielony, a jego część południowa stała się prowincją Dalmacji, sięgającą od Istrii po granice Macedonii i w głąb lądu poprzez Góry Dynarskie. Jej stolicą była Salona, koło dzisiejszego Splitu."
    - "W swoim ostatnim liście, pisanym z więzienia, Paweł pisze Tymoteuszowi, jak rozproszyli się jego towarzysze: „Albowiem Demas mię opuścił, umiłowawszy ten świat, i poszedł do Tesaloniki, Krescens do Galacyi, Tytus do Dalmacyi”. Tytus został wcześniej zostawiony na Krecie, by uporządkować tamtejsze kościoły. Pisząc do Rzymian kilka lat wcześniej, Paweł powiedział, że napełnił ewangelią „od Jeruzalemu i okolicznych krain aż do Iliryku”, szerszego regionu, do którego należała Dalmacja."
    - "Salona rozwinęła się w jedno z wielkich miast Adriatyku. Dioklecjan, z pochodzenia Dalmatyńczyk, zbudował kilka kilometrów dalej, w Spalatum, obronny pałac i zamieszkał w nim po abdykacji w 305 roku. Dziś Dalmacja jest nadmorskim regionem Chorwacji, z Zadarem, Splitem i Dubrownikiem; ruiny Salony leżą w Solinie, a pałac Dioklecjana stanowi serce starego miasta Split, wpisanego na listę światowego dziedzictwa UNESCO w 1979 roku."
  cs:
    - "Dalmácie, pojmenovaná podle ilyrského kmene Delmatů, je pobřeží a horské zázemí na východním břehu Jaderského moře. Řím s Delmaty bojoval od druhého století př. n. l. a v 30. letech př. n. l. je pod Octavianem zkrotil; oblast tvořila část Illyrika. Po velkém ilyrském povstání v letech 6–9 n. l., vedeném dvěma náčelníky, oběma jménem Bato, jež Tiberiovi trvalo tři roky potlačit, bylo Illyrikum časem rozděleno a jeho jižní část se stala provincií Dalmácií, sahající od Istrie k hranicím Makedonie a ve vnitrozemí přes Dinárské hory. Jejím hlavním městem byla Salona, poblíž dnešního Splitu."
    - "V svém posledním listu, psaném z vězení, líčí Pavel Timoteovi, jak se jeho společníci rozptýlili: „Nebo Démas mne opustil, zamilovav tento svět, a šel do Tessaloniky, Krescens do Galacie, Titus do Dalmacie.“ Titus byl dříve zanechán na Krétě, aby tam uspořádal církve. V listu Římanům, psaném před několika lety, Pavel řekl, že hlásal evangelium „vůkol až k Ilyrické zemi“, širší oblasti, k níž Dalmácie patřila."
    - "Salona vyrostla v jedno z velkých měst Jadranu. Diocletianus, rodem Dalmatin, vystavěl několik kilometrů od ní v Spalatu opevněný palác a žil v něm po abdikaci roku 305. Dnes je Dalmácie pobřežní oblastí Chorvatska se Zadarem, Splitem a Dubrovníkem; zříceniny Salony leží v Solinu a Diocletianův palác tvoří srdce starého města Splitu, zapsaného na seznam světového dědictví UNESCO roku 1979."
  sv:
    - "Dalmatien, uppkallat efter det illyriska folket delmaterna, är kustlandet och bergslandet innanför på Adriatiska havets östra kust. Rom bekämpade delmaterna från 100-talet f.Kr. och tvingade dem på knä under Octavianus på 30-talet f.Kr.; regionen ingick i Illyrien. Efter det stora illyriska upproret år 6–9 e.Kr., lett av två hövdingar som båda hette Bato, och som tog Tiberius tre år att slå ner, delades Illyrien så småningom, och dess södra del blev provinsen Dalmatien, som sträckte sig från Istrien till Makedoniens gränser och inåt landet över Dinariska bergen. Dess huvudstad var Salona, nära nuvarande Split."
    - "I sitt sista brev, skrivet från fängelse, berättar Paulus för Timoteus hur hans följeslagare har skingrats: ”Ty av kärlek till denna tidsålders väsende har Demas övergivit mig och har begivit sig till Tessalonika; Krescens har begivit sig till Galatien och Titus till Dalmatien.” Titus hade tidigare lämnats kvar på Kreta för att ordna församlingarna där. I brevet till romarna, några år tidigare, hade Paulus sagt att han förkunnat evangelium ”runt omkring ända till Illyrien”, den vidare region som Dalmatien tillhörde."
    - "Salona växte till en av Adriatiska havets stora städer. Diocletianus, dalmatier till börden, lät bygga ett befäst palats några kilometer bort i Spalatum och bodde där efter att han avstått från tronen 305. I dag är Dalmatien Kroatiens kustregion, med Zadar, Split och Dubrovnik; Salonas ruiner ligger i Solin, och Diocletianus palats utgör hjärtat av Splits gamla stad, som skrevs in på Unescos världsarvslista 1979."
  nb:
    - "Dalmatia, oppkalt etter det illyriske folket delmatene, er kystlandet og fjellbaklandet på den østlige bredden av Adriaterhavet. Roma kjempet mot delmatene fra 100-tallet f.Kr. og tvang dem i kne under Octavian i 30-årene f.Kr.; regionen utgjorde en del av Illyria. Etter det store illyriske opprøret i 6–9 e.Kr., ledet av to høvdinger som begge het Bato, og som tok Tiberius tre år å slå ned, ble Illyria med tiden delt, og dens sørlige del ble provinsen Dalmatia, fra Istria til grensene mot Makedonia og innover over de dinariske fjellene. Hovedstaden var Salona, nær dagens Split."
    - "I sitt siste brev, skrevet fra fengsel, forteller Paulus Timoteus hvordan hans følgesvenner har spredt seg: «For Demas forlot mig, fordi han fikk kjærlighet til den nuværende verden, og drog til Tessalonika, Kreskens til Galatia, Titus til Dalmatia». Titus var tidligere blitt latt igjen på Kreta for å sette menighetene der i rette skikk. I brevet til romerne noen år før hadde Paulus sagt at han hadde kunngjort evangeliet «rundt omkring like til Illyria», den videre regionen som Dalmatia hørte til."
    - "Salona vokste til en av Adriaterhavets store byer. Diokletian, dalmatier av fødsel, bygde et befestet palass noen kilometer unna i Spalatum og bodde der etter at han gav fra seg tronen i 305. I dag er Dalmatia kystregionen i Kroatia, med Zadar, Split og Dubrovnik; ruinene av Salona ligger i Solin, og Diokletians palass utgjør hjertet av gamlebyen i Split, skrevet inn på UNESCOs verdensarvliste i 1979."
  tl:
    - "Ang Dalmacia, na ipinangalan sa bayang Ilirio ng mga Delmata, ay ang baybayin at maburol na loob ng silangang pampang ng Adriatico. Nilabanan ng Roma ang mga Delmata mula sa ika-2 siglo BK at napasuko sila sa ilalim ni Octavio noong dekada 30 BK; ang rehiyon ay bahagi ng Ilirico. Pagkatapos ng dakilang paghihimagsik ng mga Ilirio noong 6–9 AD, na pinamunuan ng dalawang pinunong parehong Bato at tumagal ng tatlong taon bago sugpuin ni Tiberio, nahati sa paglipas ng panahon ang Ilirico, at ang timog na bahagi nito ay naging lalawigan ng Dalmacia, na umaabot mula Istria hanggang sa mga hangganan ng Macedonia at papasok sa lupain sa kabila ng mga bundok ng Dinaric. Ang kabisera nito ay Salona, malapit sa makabagong Split."
    - "Sa kaniyang huling liham, na isinulat mula sa bilangguan, sinasabi ni Pablo kay Timoteo kung paano nagkahiwa-hiwalay ang kaniyang mga kasama: “ako'y pinabayaan ni Demas, palibhasa'y iniibig niya ang sanglibutang ito, at napasa Tesalonica; si Crescente ay napasa Galacia, at si Tito ay sa Dalmacia.” Naiwan noon si Tito sa Creta upang ayusin ang mga iglesia roon. Sa pagsulat sa mga taga-Roma ilang taon bago nito, sinabi ni Pablo na ipinangaral niya ang ebanghelyo “sa palibotlibot hanggang sa Ilirico”, ang mas malawak na rehiyon na kinabibilangan ng Dalmacia."
    - "Lumago ang Salona bilang isa sa mga dakilang lungsod ng Adriatico. Si Diocleciano, Dalmata sa kapanganakan, ay nagtayo ng nakukutaang palasyo ilang kilometro ang layo sa Spalatum at tumira roon pagkatapos bitiwan ang trono noong 305. Ang Dalmacia ngayon ay ang rehiyong baybayin ng Croatia, na may Zadar, Split at Dubrovnik; ang mga guho ng Salona ay nasa Solin, at ang palasyo ni Diocleciano ang puso ng lumang bayan ng Split, na inilista sa UNESCO World Heritage List noong 1979."
  da:
    - "Dalmatien, opkaldt efter det illyriske folk delmaterne, er kystlandet og bjerg-baglandet på Adriaterhavets østlige kyst. Rom kæmpede mod delmaterne fra 100-tallet f.Kr. og tvang dem i knæ under Octavian i 30'erne f.Kr.; området udgjorde en del af Illyrien. Efter det store illyriske oprør i 6–9 e.Kr., ledet af to høvdinge begge ved navn Bato, som det tog Tiberius tre år at nedkæmpe, blev Illyrien med tiden delt, og dets sydlige del blev provinsen Dalmatien, fra Istrien til Makedoniens grænser og ind i landet over de Dinariske Alper. Dens hovedstad var Salona, nær nutidens Split."
    - "I sit sidste brev, skrevet fra fængsel, fortæller Paulus Timotheus, hvordan hans ledsagere har spredt sig: Demas »forlod mig, fordi han fik Kærlighed til den nærværende Verden, og drog til Thessalonika; Kreskens drog til Galatien, Titus til Dalmatien«. Titus var tidligere blevet efterladt på Kreta for at bringe kirkerne dér i orden. Da Paulus nogle år tidligere skrev til romerne, havde han sagt, at han havde forkyndt evangeliet »trindt omkring indtil Illyrien«, den videre egn, som Dalmatien hørte til."
    - "Salona voksede til en af Adriaterhavets store byer. Diokletian, dalmatiner af fødsel, byggede et befæstet palads nogle få kilometer derfra ved Spalatum og boede dér, efter at han havde frasagt sig tronen i 305. I dag er Dalmatien kystregionen i Kroatien, med Zadar, Split og Dubrovnik; Salonas ruiner ligger ved Solin, og Diokletians palads udgør hjertet af Splits gamle bydel, optaget på UNESCOs verdensarvsliste i 1979."
  sr:
    - "Далмација, названа по илирском народу Делмата, јесте приобални појас и планинско залеђе на источној обали Јадрана. Рим је ратовао с Делматима од 2. века п. н. е. и покорио их под Октавијаном 30-их година п. н. е.; област је била део Илирика. После великог илирског устанка 6–9. н. е., под вођством двојице вођа, обојице по имену Бато, који је Тиверију требало три године да угуши, Илирик је с временом подељен, а његов јужни део постао је провинција Далмација, која се простирала од Истре до граница Македоније и у унутрашњост преко Динарских планина. Њена престоница била је Салона, близу данашњег Сплита."
    - "У својој последњој посланици, писаној из затвора, Павле јавља Тимотију како су се његови сапутници разишли: „јер ме Димас остави, омилевши му садашњи свет, и отиде у Солун; Крискент у Галатију, Тит у Далмацију“. Тит је раније био остављен на Криту да доведе у ред тамошње цркве. Пишући Римљанима неколико година раније, Павле је рекао да је јеванђеље проповедао „наоколо тја до Илирика“, ширег краја коме је Далмација припадала."
    - "Салона је израсла у један од великих градова Јадрана. Диоклецијан, Далматинац по рођењу, подигао је утврђену палату неколико километара даље у Спалатуму и ту живео пошто се одрекао престола 305. Данас је Далмација приобални крај Хрватске, са Задром, Сплитом и Дубровником; рушевине Салоне леже у Солину, а Диоклецијанова палата чини срце старог града Сплита, уписаног на Унескову листу светске баштине 1979."
  hu:
    - "Dalmácia, nevét az illír delmata népről kapta, az Adriai-tenger keleti partján fekvő tengerpart és hegyes hátország. Róma a Kr. e. 2. századtól harcolt a delmatákkal, és Octavianus alatt a Kr. e. 30-as években leigázta őket; a vidék Illirikum része volt. A Kr. u. 6–9-es nagy illír felkelés után, amelyet két Bato nevű törzsfő vezetett, és Tiberiusnak három évig tartott leverni, Illirikumot idővel felosztották, és déli részéből Dalmácia tartomány lett, Isztriától Macedónia határáig, és befelé a Dinári-hegységen át. Fővárosa Szalona volt, a mai Split közelében."
    - "Utolsó levelében, amelyet a börtönből írt, Pál elmondja Timóteusnak, hogyan szóródtak szét társai: „Mert Démás engem elhagyott, e jelen való világhoz ragaszkodván, és elment Thessalónikába: Kresczens Galátziába, Titus Dalmátziába.” Titusz korábban Krétában maradt, hogy rendbe hozza az ottani egyházakat. A Rómaiaknak néhány évvel korábban írva Pál azt mondta, hogy az evangéliumot „Jeruzsálemtől és környékétől fogva Illyriáig” hirdette, abban a tágabb vidékben, amelyhez Dalmácia tartozott."
    - "Szalona az Adria egyik nagy városává nőtt. Diocletianus, aki dalmáciai születésű volt, néhány kilométerre, Spalatumban erődített palotát építtetett, és ott élt, miután 305-ben lemondott a trónról. Ma Dalmácia Horvátország tengerparti vidéke Zadarral, Splittel és Dubrovnikkal; Szalona romjai Solinban vannak, Diocletianus palotája pedig Split óvárosának szívét alkotja, amelyet 1979-ben vettek fel az UNESCO világörökségi listájára."
  fi:
    - "Dalmatia, nimetty illyrialaisen delmataikansan mukaan, on Adrianmeren itärannan rannikkomaa ja vuoristoinen sisämaa. Rooma taisteli delmateja vastaan 100-luvulta eaa. ja alisti heidät Octavianuksen johdolla 30-luvulla eaa.; alue kuului Illyrikumiin. Suuren illyrialaiskapinan jälkeen vuosina 6–9 jaa., jota johti kaksi Bato-nimistä päällikköä ja jonka tukahduttaminen vei Tiberiukselta kolme vuotta, Illyrikum jaettiin aikanaan, ja sen eteläosasta tuli Dalmatian provinssi, joka ulottui Istriasta Makedonian rajoille ja sisämaahan Dinaaristen vuorten yli. Sen pääkaupunki oli Salona, lähellä nykyistä Splitiä."
    - "Viimeisessä kirjeessään, vankilasta kirjoitetussa, Paavali kertoo Timoteukselle, kuinka hänen toverinsa ovat hajaantuneet: ”Sillä tähän nykyiseen maailmaan rakastuneena jätti minut Deemas ja matkusti Tessalonikaan, Kreskes meni Galatiaan ja Tiitus Dalmatiaan.” Titus oli aiemmin jätetty Kreetaan järjestämään sikäläisiä seurakuntia. Kirjoittaessaan roomalaisille joitakin vuosia aiemmin Paavali oli sanonut julistaneensa evankeliumia ”Jerusalemista ja sen ympäristöstä alkaen Illyrikoniin saakka”, laajemmalle alueelle, johon Dalmatia kuului."
    - "Salonasta kasvoi yksi Adrianmeren suurista kaupungeista. Diocletianus, syntyjään dalmatialainen, rakensi linnoitetun palatsin muutaman kilometrin päähän Spalatumiin ja asui siellä luovuttuaan valtaistuimesta vuonna 305. Nykyisin Dalmatia on Kroatian rannikkoseutu, jossa ovat Zadar, Split ja Dubrovnik; Salonan rauniot sijaitsevat Solinissa, ja Diocletianuksen palatsi muodostaa Splitin vanhankaupungin sydämen, joka merkittiin UNESCOn maailmanperintöluetteloon vuonna 1979."
  vi:
    - "Đa-ma-ti, đặt tên theo dân Illyria Delmatae, là vùng ven biển và vùng núi phía sau trên bờ đông biển Adriatic. Rô-ma giao chiến với người Delmatae từ thế kỷ 2 TCN và khuất phục họ dưới thời Octavianus vào những năm 30 TCN; vùng này là một phần của I-ly-ri. Sau cuộc nổi dậy lớn của Illyria năm 6–9, do hai thủ lĩnh cùng tên Bato dẫn đầu, mà Ti-be-rơ mất ba năm để dẹp, I-ly-ri dần được chia ra, và phần phía nam của nó trở thành tỉnh Đa-ma-ti, chạy từ Istria đến biên giới Ma-xê-đoan và vào nội địa qua dãy Dinaric. Thủ phủ của nó là Salona, gần Split ngày nay."
    - "Trong bức thư cuối cùng, viết từ trong tù, Phao-lô cho Ti-mô-thê biết các bạn đồng hành của ông đã tản đi đâu: “vì Đê-ma đã lìa bỏ ta rồi, tại người ham hố đời nầy, và đã đi qua thành Tê-sa-lô-ni-ca. … Tít thì đi xứ Đa-ma-ti rồi.” Tít trước đó đã được để lại ở Cơ-rết để sắp đặt các hội thánh ở đó. Khi viết cho người Rô-ma vài năm trước, Phao-lô đã nói rằng ông đã rao giảng Phúc Âm “từ thành Giê-ru-sa-lem và các miền xung quanh cho đến xứ I-ly-ri”, vùng rộng hơn mà Đa-ma-ti thuộc về."
    - "Salona phát triển thành một trong những thành phố lớn của vùng Adriatic. Diocletianus, sinh ra là người Dalmatia, xây một cung điện kiên cố cách đó vài kilômét tại Spalatum và sống ở đó sau khi thoái vị năm 305. Ngày nay Đa-ma-ti là vùng ven biển của Croatia, với Zadar, Split và Dubrovnik; phế tích Salona nằm ở Solin, và cung điện của Diocletianus là trái tim của khu phố cổ Split, được ghi vào Danh sách Di sản Thế giới của UNESCO năm 1979."
  ro:
    - "Dalmația, numită după poporul ilir al delmaților, este țărmul și ținutul muntos din spatele lui, de pe malul estic al Adriaticii. Roma s-a luptat cu delmații din secolul al II-lea î.Hr. și i-a supus sub Octavian în anii 30 î.Hr.; regiunea făcea parte din Iliria. După marea răscoală ilirică din anii 6–9 d.Hr., condusă de două căpetenii numite amândouă Bato, pentru a cărei înăbușire Tiberiu a avut nevoie de trei ani, Iliria a fost în cele din urmă împărțită, iar partea ei de sud a devenit provincia Dalmația, care se întindea din Istria până la hotarele Macedoniei și în interior peste munții Dinarici. Capitala ei era Salona, lângă Splitul de azi."
    - "În ultima sa epistolă, scrisă din închisoare, Pavel îi spune lui Timotei cum s-au risipit tovarășii săi: „Că Dimas m’a lăsat, iubind veacul de acum, și s’a dus în Tesalonic; Crisc în Galatia, Tit în Dalmația”. Tit fusese lăsat mai înainte în Creta ca să așeze acolo bisericile. Scriind cu câțiva ani mai devreme romanilor, Pavel spusese că a propovăduit Evanghelia „împrejur până la Iliric”, regiunea mai largă din care făcea parte Dalmația."
    - "Salona a crescut până a devenit unul dintre marile orașe ale Adriaticii. Dioclețian, dalmat de neam, a zidit un palat întărit la câțiva kilometri, la Spalatum, și a locuit acolo după ce a părăsit tronul în 305. Astăzi Dalmația este regiunea de coastă a Croației, cu Zadar, Split și Dubrovnik; ruinele Salonei se află la Solin, iar palatul lui Dioclețian formează inima orașului vechi Split, înscris pe Lista patrimoniului mondial UNESCO în 1979."
  bg:
    - "Далмация, наречена на илирийския народ далмати, е крайбрежието и планинската вътрешност на източния бряг на Адриатика. Рим воювал с далматите от II в. пр.н.е. и ги покорил при Октавиан през 30-те години пр.н.е.; областта била част от Илирик. След голямото илирийско въстание от 6–9 г. н.е., водено от двама вождове, и двамата на име Батон, което отнело на Тиберий три години да потуши, Илирик с времето бил разделен и южната му част станала провинция Далмация, простираща се от Истрия до границите на Македония и навътре през Динарските планини. Столицата ѝ била Салона, близо до днешния Сплит."
    - "В последното си писмо, писано от затвора, Павел разказва на Тимотей как спътниците му са се разпръснали: „Димас ме остави, понеже възлюби сегашния свет, и отиде в Солун, Крискент в Галатия, а Тит в Далмация“. Тит по-рано бил оставен в Крит да уреди църквите там. Пишейки до римляните няколко години по-рано, Павел казал, че е проповядвал благовестието „от Ерусалим и наоколо даже до Илирик“, по-широката област, към която принадлежала Далмация."
    - "Салона израснала в един от големите градове на Адриатика. Диоклетиан, далматинец по рождение, построил укрепен дворец на няколко километра оттам, в Спалатум, и живял там, след като се отказал от престола през 305 г. Днес Далмация е крайбрежната област на Хърватия, със Задар, Сплит и Дубровник; руините на Салона лежат в Солин, а дворецът на Диоклетиан е сърцето на стария град на Сплит, вписан в списъка на световното наследство на ЮНЕСКО през 1979 г."
scripture:
  - 2Tim.4.10
  - Titus.1.5
  - Rom.15.19
