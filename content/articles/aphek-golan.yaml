# Overview article (ADR 0007). Mainstream facts only; the Aphek east of the Sea of Galilee (1 Kings 20, 2 Kings 13), not the Aphek of the Sharon; the three candidates on the map are named without choosing.
id: aphek-golan
place: a6fc60d
title:
