# Overview article (ADR 0007). Mainstream facts only; the Aphek east of the Sea of Galilee (1 Kings 20, 2 Kings 13), not the Aphek of the Sharon; the three candidates on the map are named without choosing.
id: aphek-golan
place: a6fc60d
title:
  en: "Aphek"
  ru: "Афек"
  uk: "Афек"
  es: "Afec"
  pt: "Afeque"
  de: "Afek"
  fr: "Aphek"
body:
  en:
    - "This Aphek, one of several towns of the name, lay east of the Sea of Galilee on the road from Damascus down to the Jordan valley. In the reign of Ahab, a year after a first defeat in the hills of Samaria, Ben-hadad of Aram “numbered the Syrians, and went up to Aphek, to fight against Israel”, his servants having told him that Israel's gods were “gods of the hills” and would fail in the plain. A man of God answered that the Lord would give the whole host into Ahab's hand. After seven days facing each other Israel won, “the rest fled to Aphek, into the city; and there a wall fell upon twenty and seven thousand”. Ben-hadad, hiding in an inner chamber, surrendered and was let go under a treaty."
    - "Some fifty years later the dying Elisha had King Joash shoot an arrow out of a window eastward: “thou shalt smite the Syrians in Aphek, till thou have consumed them”. Joash then beat Aram three times and took back Israel's cities. Eusebius knew an Apheka, a large village near Hippos, which fits this region."
    - "The name lives on in Fiq, a village on the Golan plateau above the lake, the second site on the map; but Fiq has yielded little from the Iron Age, so many look instead to Tel Ein Gev on the eastern shore, the first site, where excavations in 1961 and later have found a fortified Iron Age town of about the tenth to eighth centuries BC. Tel Soreg in the valley between them is a third option. Fiq was abandoned in 1967; Kibbutz Afik now stands nearby, and Kibbutz Ein Gev beside the mound."
  ru:
    - "Этот Афек — один из нескольких городов с таким именем — лежал к востоку от Галилейского моря, на дороге из Дамаска в долину Иордана. При Ахаве, через год после первого поражения в горах Самарии, «Венадад собрал Сириян и выступил к Афеку, чтобы сразиться с Израилем»: слуги сказали ему, что «Бог их есть Бог гор, а не Бог долин», и на равнине Израиль не устоит. Человек Божий ответил, что Господь предаст всё полчище в руку Ахава. Семь дней войска стояли друг против друга, и Израиль победил; «остальные убежали в город Афек; там упала стена на остальных двадцать семь тысяч человек». Венадад, прятавшийся во внутренних комнатах, сдался и был отпущен по договору."
    - "Лет через пятьдесят умирающий Елисей велел царю Иоасу выстрелить из окна на восток: «и ты поразишь Сириян в Афеке вконец». Затем Иоас трижды разбил Сирию и вернул города Израилевы. Евсевий знал Афеку — большое селение у Гиппоса, что подходит к этой области."
    - "Имя сохранилось в Фике, деревне на Голанском плато над озером, — втором месте на карте; но в Фике почти не найдено железного века, и многие ищут Афек в Тель-Эйн-Геве на восточном берегу, первом месте, где раскопки 1961 года и позднейшие открыли укреплённый город железного века, примерно X–VIII веков до н. э. Тель-Сорег в долине между ними — третий вариант. Фик опустел в 1967 году; рядом стоит теперь кибуц Афик, а у холма — кибуц Эйн-Гев."
  uk:
    - "Цей Афек, одне з кількох міст з такою назвою, лежав на схід від Галілейського моря на дорозі з Дамаска вниз до Йорданської долини. За царювання Ахава, через рік після першої поразки в пагорбах Самарії, Бен-Гадад Арамський вирушив у похід: «зібрав Бенадад Сирийцїв та й двинув під Афек на війну проти Ізраїля». Його слуги сказали йому, що Ізраїлів Бог — «се бог гір» і зазнає невдачі на рівнині. Чоловік Божий відповів, що Господь віддасть усе військо в руки Ахавові. Після семи днів стояння один проти одного Ізраїль переміг: «Що ж позоставалось, повтїкали в город Афеку. Там же обваливсь мур на остальнїх двайцять і сїм тисячей чоловіка». Бен-Гадад, що сховався у внутрішній кімнаті, здався й був відпущений за угодою."
    - "Приблизно через п'ятдесят років умираючий Єлисей наказав цареві Йоасові стрілити стрілу з вікна на схід: «ти звоюєш Сирийцїв ув Афецї так, що їх у нїщо обернеш». Потім Йоас тричі розбив Арам і повернув ізраїльські міста. Євсевій знав Афеку, велике село поблизу Гіппоса, що відповідає цій місцевості."
    - "Назва живе у Фіку, селі на Голанському плато над озером, другому місці на мапі; але Фік дав мало з залізної доби, тож багато хто шукає натомість Тель-Ейн-Гев на східному березі, перше місце, де розкопки 1961 року та пізніші виявили укріплене місто залізної доби приблизно X–VIII століть до н. е. Тель-Сорег у долині між ними — третій варіант. Фік покинули в 1967 році; кібуц Афік стоїть тепер неподалік, а кібуц Ейн-Гев — біля пагорба."
  es:
    - "Este Afec, uno de varios lugares con ese nombre, se hallaba al este del mar de Galilea, en el camino que baja de Damasco al valle del Jordán. En el reinado de Acab, un año después de una primera derrota en las colinas de Samaria, Ben-adad de Aram «reconoció los Siros, y vino á Aphec á pelear contra Israel», pues sus siervos le habían dicho que los dioses de Israel eran «dioses de los montes» y fallarían en la llanura. Un varón de Dios respondió que Jehová entregaría todo el ejército en manos de Acab. Tras siete días frente a frente, Israel venció: «Los demás huyeron á Aphec, á la ciudad: y el muro cayó sobre veinte y siete mil hombres». Ben-adad, escondido en una cámara interior, se rindió y fue dejado ir mediante un tratado."
    - "Unos cincuenta años después, Eliseo moribundo hizo que el rey Joás disparara una flecha hacia el oriente desde una ventana: «herirás á los Siros en Aphec, hasta consumirlos». Joás derrotó entonces a Aram tres veces y recuperó las ciudades de Israel. Eusebio conocía una Apheka, una aldea grande cerca de Hipos, lo que encaja con esta región."
    - "El nombre pervive en Fiq, una aldea de la meseta del Golán sobre el lago, el segundo sitio del mapa; pero Fiq ha dado poco de la edad del Hierro, por lo que muchos miran más bien a Tel Ein Gev, en la orilla oriental, el primer sitio, donde las excavaciones de 1961 y posteriores han hallado una ciudad fortificada de la edad del Hierro, de entre los siglos X y VIII a. C. aproximadamente. Tel Soreg, en el valle entre ambos, es una tercera opción. Fiq fue abandonada en 1967; el kibutz Afik se alza ahora cerca, y el kibutz Ein Gev junto al montículo."
  pt:
    - "Esta Afeque, uma das várias cidades de mesmo nome, ficava a leste do mar da Galileia, na estrada que desce de Damasco ao vale do Jordão. No reinado de Acabe, um ano depois de uma primeira derrota nas colinas de Samaria, Ben-Hadade de Arã “reuniu os sírios e subiu a Afeca para lutar contra Israel”, tendo-lhe dito os seus servos que o deus de Israel era “um deus dos montes” e fracassaria na planície. Um homem de Deus respondeu que o SENHOR entregaria todo o exército nas mãos de Acabe. Depois de sete dias frente a frente, Israel venceu, “o restante fugiu para Afeca, para dentro da cidade; e a muralha caiu sobre vinte e sete mil homens que haviam sobrado”. Ben-Hadade, escondido num quarto interior, rendeu-se e foi libertado mediante um tratado."
    - "Cerca de cinquenta anos depois, o moribundo Eliseu mandou o rei Joás atirar uma flecha para o leste, por uma janela: “você ferirá os sírios em Afeca até consumi-los”. Joás venceu então Arã três vezes e recuperou as cidades de Israel. Eusébio conheceu uma Apheka, uma grande aldeia perto de Hipos, o que combina com esta região."
    - "O nome sobrevive em Fiq, uma aldeia no planalto de Golã acima do lago, o segundo sítio do mapa; mas Fiq rendeu pouco da Idade do Ferro, e por isso muitos olham antes para Tel Ein Gev, na margem oriental, o primeiro sítio, onde escavações em 1961 e depois acharam uma cidade fortificada da Idade do Ferro, de cerca dos séculos X a VIII a.C. Tel Soreg, no vale entre os dois, é uma terceira opção. Fiq foi abandonada em 1967; o quibutz Afik fica agora perto, e o quibutz Ein Gev ao lado do montículo."
  de:
    - "Dieses Afek, eine von mehreren Städten dieses Namens, lag östlich des Sees Genezareth an der Straße von Damaskus hinab ins Jordantal. Unter Ahab, ein Jahr nach einer ersten Niederlage im Bergland von Samaria, ordnete Ben-Hadad von Aram „die Syrer und zog herauf gen Aphek, wider Israel zu streiten“, nachdem seine Knechte ihm gesagt hatten, die Götter Israels seien „Berggötter“ und würden in der Ebene versagen. Ein Mann Gottes antwortete, der HERR werde das ganze Heer in Ahabs Hand geben. Nachdem sie sieben Tage einander gegenübergestanden hatten, siegte Israel, „die übrigen flohen gen Aphek in die Stadt; und die Mauer fiel auf die übrigen siebenundzwanzigtausend Mann“. Ben-Hadad, in einer inneren Kammer versteckt, ergab sich und wurde durch einen Vertrag freigelassen."
    - "Etwa fünfzig Jahre später ließ der sterbende Elisa König Joas einen Pfeil aus einem Fenster nach Osten schießen: „du wirst die Syrer schlagen zu Aphek, bis sie aufgerieben sind“. Joas schlug Aram darauf dreimal und gewann Israels Städte zurück. Eusebius kannte ein Apheka, ein großes Dorf bei Hippos, was zu dieser Gegend passt."
    - "Der Name lebt in Fiq fort, einem Dorf auf dem Golanplateau über dem See, der zweiten Stätte auf der Karte; doch Fiq hat aus der Eisenzeit wenig ergeben, so dass viele stattdessen an Tel Ein Gev am Ostufer denken, die erste Stätte, wo Grabungen seit 1961 eine befestigte Stadt der Eisenzeit aus etwa dem 10. bis 8. Jahrhundert v. Chr. fanden. Tel Soreg im Tal dazwischen ist eine dritte Möglichkeit. Fiq wurde 1967 verlassen; der Kibbuz Afik steht jetzt in der Nähe und der Kibbuz Ein Gev neben dem Hügel."
  fr:
    - "Cette Aphek, l’une des villes de ce nom, se trouvait à l’est de la mer de Galilée, sur la route qui descend de Damas à la vallée du Jourdain. Sous le règne d’Achab, un an après une première défaite dans les collines de Samarie, Ben-Hadad d’Aram « passa les Syriens en revue, et monta vers Aphek pour combattre Israël », ses serviteurs lui ayant dit que le dieu des Israélites était « un dieu de montagnes » et faillirait dans la plaine. Un homme de Dieu répondit que l’Éternel livrerait toute la multitude entre les mains d’Achab. Après sept jours face à face, Israël l’emporta : « Le reste s’enfuit à la ville d’Aphek, et la muraille tomba sur vingt-sept mille hommes qui restaient. » Ben-Hadad, caché dans une chambre intérieure, se rendit et fut relâché par un traité."
    - "Une cinquantaine d’années plus tard, Élisée mourant fit tirer au roi Joas une flèche par une fenêtre vers l’orient : « tu battras les Syriens à Aphek jusqu’à leur extermination ». Joas battit alors Aram trois fois et reprit les villes d’Israël. Eusèbe connaissait une Apheka, grand village près d’Hippos, ce qui convient à cette région."
    - "Le nom survit à Fiq, village du plateau du Golan au-dessus du lac, deuxième site de la carte ; mais Fiq a livré peu de chose de l’âge du Fer, et beaucoup regardent plutôt Tel Ein Gev, sur la rive orientale, premier site, où des fouilles en 1961 et après ont mis au jour une ville fortifiée de l’âge du Fer, du Xe au VIIIe siècle av. J.-C. environ. Tel Soreg, dans la vallée entre les deux, est une troisième option. Fiq fut abandonné en 1967 ; le kibboutz Afik se trouve maintenant près de là, et le kibboutz Ein Gev à côté du tertre."
