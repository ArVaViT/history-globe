body:
  en:
    - "Shittim, “the acacias”, in full Abel-shittim, was the last camp of Israel before the Jordan, in the plains of Moab opposite Jericho, where the list of stations has the people pitched “from Beth-jesimoth even unto Abel-shittim”. Here, while Balaam was blessing them from the heights, “Israel abode in Shittim, and the people began to commit whoredom with the daughters of Moab”, and the plague of Baal-peor followed. From Shittim Joshua “sent out ... two men to spy secretly”, who lodged with Rahab in Jericho; then “they removed from Shittim, and came to Jordan” and lodged there before the crossing. Micah sums up the whole passage in a phrase, “from Shittim unto Gilgal”. Joel's “valley of Shittim”, watered by a fountain from the temple, may be a dry wadi near Jerusalem rather than this place; in Hosea 5:2 some read the name where the older versions do not."
    - "Josephus knew the camp as the place where the town of Abila stood in his day, sixty stadia from the Jordan among palm trees; Eusebius lists Abelsattim in the desert on the side of Moab. Two mounds at the mouth of the Wadi Kefrein compete for the site. Tall el-Hammam, the map's first choice, is a very large mound with a walled city of the Bronze Age and later occupation; it has been excavated since 2005 by a team under Steven Collins, whose claim that it is Sodom most scholars reject. Tall Kafrayn, about 3 km to the north-west, is a smaller mound long preferred as Abel-shittim. Nelson Glueck's survey of the 1930s favoured Hammam; no inscription has settled it, and acacias still grow in the wadi."
    - "The plain today is Jordanian farmland south of the town of South Shuna, with banana groves and irrigated fields, a few kilometres from the baptism site on the Jordan and the north shore of the Dead Sea."
  ru:
    - "Ситтим, «акации», полностью Аве-Ситтим, был последним станом Израиля перед Иорданом, на равнинах Моавитских против Иерихона, где перечень станов располагает народ «от Беф-Иешимофа до Аве-Ситтима». Здесь, пока Валаам благословлял их с высот, «жил Израиль в Ситтиме, и начал народ блудодействовать с дочерями Моава», и за этим пришло поражение Ваал-Фегора. Из Ситтима Иисус Навин послал «двух соглядатаев тайно», которые остановились у Раав в Иерихоне; затем «двинулись они от Ситтима и пришли к Иордану» и ночевали там перед переходом. Михей вмещает весь этот путь в одну фразу: «от Ситтима до Галгал». Долина Ситтим у Иоиля, которую напояет источник из дома Господня, может быть сухим вади близ Иерусалима, а не этим местом; в Ос. 5:2 некоторые читают это имя там, где старые переводы его не видят."
    - "Иосиф Флавий знал стан как место, где в его дни стоял город Авила, в шестидесяти стадиях от Иордана среди пальм; Евсевий называет Авелсаттим в пустыне со стороны Моава. За место спорят два холма у устья Вади-Кефрейн. Телль-эль-Хаммам, первый выбор на карте, — очень большой холм с обнесённым стеной городом бронзового века и позднейшими слоями; его с 2005 года раскапывает экспедиция Стивена Коллинза, чьё утверждение, что это Содом, большинство учёных отвергает. Телль-Кафрейн примерно в 3 км к северо-западу — холм поменьше, который долго предпочитали как Аве-Ситтим. Обследование Нельсона Глюка в 1930-х склонялось к Хаммаму; ни одна надпись вопроса не решила, а акации в вади растут до сих пор."
    - "Равнина сегодня — иорданские сельские земли к югу от города Южная Шуна, с банановыми рощами и орошаемыми полями, в нескольких километрах от места крещения на Иордане и северного берега Мёртвого моря."
  uk:
    - "Ситтім, «акації», повністю Аве-Ситтім, був останнім табором Ізраїлю перед Йорданом, на рівнинах Моава навпроти Єрихону, де в переліку стоянок народ отаборився «від Бет-Єзімотя до Абель-Ситтима». Тут, поки Валаам благословляв їх з висот, «жив Ізраїль у Ситтимі, і став блудувати люд із дочками Моабовими», а за цим настала чума Ваал-Пеора. Звідти Ісус Навин «послав із Ситтима два чоловіки на розглядини потай»; ці двоє зупинилися в Рахави в Єрихоні; потім «рушили вони дальше з Ситтима та й прийшли до Йорданї» і заночували там перед переправою. Міха підсумовує весь уривок фразою «від Ситтиму до Галгалу». Долина Ситтім у Йоїла, зрошувана джерелом із храму, може бути сухим ваді поблизу Єрусалима, а не цим місцем; в Осії 5:2 дехто читає це ім'я там, де давніші переклади його не мають."
    - "Йосип Флавій знав табір як місце, де за його часів стояло місто Авіла, за шістдесят стадіїв від Йордану серед пальм; Євсевій наводить Авелсаттім у пустелі з боку Моава. Два кургани біля гирла ваді Кефрейн змагаються за це місце. Телль-ель-Хаммам, перший вибір карти, — дуже великий курган із обнесеним мурами містом бронзового віку та пізнішим заселенням; з 2005 року його розкопує команда під керівництвом Стівена Коллінза, чию тезу, що це Содом, більшість учених відхиляє. Телль-Кафрайн, приблизно за 3 км на північний захід, — менший курган, якому давно віддавали перевагу як Аве-Ситтіму. Обстеження Нельсона Глюка 1930-х років схилялося до Хаммама; жоден напис питання не вирішив, а акації й досі ростуть у ваді."
    - "Рівнина сьогодні — йорданська рілля на південь від міста Південна Шуна, з банановими гаями та зрошуваними полями, за кілька кілометрів від місця хрещення на Йордані та північного берега Мертвого моря."
  es:
    - "Sitim, «las acacias», en forma completa Abel-sitim, fue el último campamento de Israel antes del Jordán, en las llanuras de Moab frente a Jericó, donde la lista de estaciones hace asentar al pueblo «desde Beth-jesimoth hasta Abel-sitim». Aquí, mientras Balaam los bendecía desde las alturas, «reposó Israel en Sittim, y el pueblo empezó á fornicar con las hijas de Moab», y siguió la plaga de Baal-peor. Josué «envió desde Sittim dos espías secretamente», que se hospedaron con Rahab en Jericó; luego «partieron de Sittim, y vinieron hasta el Jordán» y se alojaron allí antes del cruce. Miqueas resume todo el pasaje en una frase, «desde Sittim hasta Gilgal». El «valle de Sittim» de Joel, regado por una fuente del templo, puede ser un uadi seco cerca de Jerusalén más que este lugar; en Oseas 5:2 algunos leen el nombre donde las versiones antiguas no lo tienen."
    - "Josefo conocía el campamento como el lugar donde se alzaba en su tiempo la ciudad de Abila, a sesenta estadios del Jordán entre palmeras; Eusebio enumera Abelsattim en el desierto, en el lado de Moab. Dos montículos en la desembocadura del Wadi Kefrein compiten por el lugar. Tall el-Hammam, la primera opción del mapa, es un montículo muy grande con una ciudad amurallada de la Edad del Bronce y ocupación posterior; ha sido excavado desde 2005 por un equipo dirigido por Steven Collins, cuya afirmación de que es Sodoma la mayoría de los estudiosos rechaza. Tall Kafrayn, a unos 3 km al noroeste, es un montículo menor, preferido durante mucho tiempo como Abel-sitim. La prospección de Nelson Glueck en la década de 1930 favoreció Hammam; ninguna inscripción lo ha resuelto, y las acacias siguen creciendo en el uadi."
    - "La llanura es hoy tierra de labor jordana al sur de la ciudad de Shuna del Sur, con plataneras y campos de regadío, a pocos kilómetros del lugar del bautismo en el Jordán y de la orilla norte del mar Muerto."
  pt:
    - "Sitim, “as acácias”, em forma completa Abel-Sitim, foi o último acampamento de Israel antes do Jordão, nas planícies de Moabe defronte de Jericó, onde a lista das estações tem o povo acampado “desde Bete-Jesimote até Abel-Sitim”. Aqui, enquanto Balaão os abençoava das alturas, “Israel permaneceu em Sitim; e o povo começou a se prostituir com as filhas de Moabe”, e seguiu-se a praga de Baal-Peor. De Sitim Josué “enviou secretamente ... dois homens como espiões”, que se hospedaram com Raabe em Jericó; depois “eles partiram de Sitim e chegaram ao Jordão” e acamparam ali antes da travessia. Miqueias resume toda a passagem numa frase, “desde Sitim até Gilgal”. O “vale de Sitim” de Joel, regado por uma fonte do templo, pode ser um uádi seco perto de Jerusalém e não este lugar; em Oseias 5:2 alguns leem o nome onde as versões antigas não o têm."
    - "Josefo conhecia o acampamento como o lugar onde ficava em seu tempo a cidade de Abila, a sessenta estádios do Jordão entre palmeiras; Eusébio lista Abelsatim no deserto, do lado de Moabe. Dois montes na foz do Wadi Kefrein disputam o local. Tall el-Hammam, a primeira escolha do mapa, é um monte muito grande com uma cidade murada da Idade do Bronze e ocupação posterior; é escavado desde 2005 por uma equipe sob Steven Collins, cuja afirmação de que é Sodoma a maioria dos estudiosos rejeita. Tall Kafrayn, a cerca de 3 km a noroeste, é um monte menor há muito preferido como Abel-Sitim. A prospecção de Nelson Glueck na década de 1930 preferiu Hammam; nenhuma inscrição resolveu, e acácias ainda crescem no uádi."
    - "A planície é hoje terra agrícola jordaniana ao sul da cidade de South Shuna, com bananais e campos irrigados, a poucos quilômetros do local do batismo no Jordão e da margem norte do Mar Morto."
  de:
    - "Schittim, „die Akazien“, vollständig Abel-Schittim, war Israels letztes Lager vor dem Jordan, in den Steppen Moabs gegenüber von Jericho, wo die Stationenliste das Volk lagern lässt „von Beth-Jesimoth an bis an Abel-Sittim“. Hier heißt es, während Bileam es von den Höhen aus segnete: „Und Israel wohnte in Sittim. Und das Volk hob an zu huren mit der Moabiter Töchtern“; darauf folgte die Plage von Baal-Peor. Von Schittim hatte Josua „zwei Kundschafter heimlich ausgesandt“, die bei Rahab in Jericho einkehrten; dann heißt es: „sie zogen aus Sittim und kamen an den Jordan“, und sie blieben dort vor dem Übergang. Micha fasst die Passage zusammen: „von Sittim an bis gen Gilgal“. Joels „Tal Schittim“, von einer Quelle aus dem Tempel bewässert, mag ein trockenes Wadi bei Jerusalem statt dieses Ortes sein; in Hosea 5,2 lesen manche den Namen, wo die älteren Übersetzungen ihn nicht haben."
    - "Josephus kannte das Lager als den Ort, an dem zu seiner Zeit die Stadt Abila stand, sechzig Stadien vom Jordan zwischen Palmen; Eusebius führt Abelsattim in der Wüste auf der Seite Moabs auf. Zwei Hügel an der Mündung des Wadi Kafrain konkurrieren um die Stätte. Tall el-Hammam, die erste Wahl der Karte, ist ein sehr großer Hügel mit einer ummauerten Stadt der Bronzezeit und späterer Besiedlung; er wird seit 2005 von einem Team unter Steven Collins ausgegraben, dessen Behauptung, es sei Sodom, die meisten Gelehrten ablehnen. Tall Kafrain, etwa 3 km nordwestlich, ist ein kleinerer Hügel, der lange als Abel-Schittim bevorzugt wurde. Nelson Gluecks Survey der 1930er Jahre favorisierte Hammam; keine Inschrift hat es entschieden, und im Wadi wachsen noch Akazien."
    - "Die Ebene ist heute jordanisches Ackerland südlich der Stadt Süd-Schuna, mit Bananenhainen und bewässerten Feldern, wenige Kilometer von der Taufstelle am Jordan und dem Nordufer des Toten Meeres."
  fr:
    - "Sittim, « les acacias », ou Abel-Sittim, fut le dernier campement d’Israël avant le Jourdain, dans les plaines de Moab face à Jéricho, où la liste des étapes fait camper le peuple « depuis Beth-Jeschimoth jusqu’à Abel-Sittim ». Ici, tandis que Balaam les bénissait des hauteurs, « Israël demeurait à Sittim ; et le peuple commença à se livrer à la débauche avec les filles de Moab », puis vint la plaie de Baal-Peor. De Sittim, Josué « fit partir secrètement » deux espions, qui logèrent chez Rahab à Jéricho ; puis il « partit de Sittim avec tous les enfants d’Israël. Ils arrivèrent au Jourdain » et y passèrent la nuit. Michée résume le passage d’un mot, « De Sittim à Guilgal ». La « vallée de Sittim » de Joël, arrosée par une source du temple, est peut-être un oued sec près de Jérusalem ; en Osée 5:2, certains lisent le nom là où les versions anciennes ne l’ont pas."
    - "Flavius Josèphe connaissait le camp comme le lieu où se trouvait de son temps la ville d’Abila, à soixante stades du Jourdain parmi les palmiers ; Eusèbe cite Abelsattim dans le désert du côté de Moab. Deux tertres à l’embouchure du Wadi Kefrein se disputent le site. Tall el-Hammam, premier choix de la carte, est un très grand tertre avec une ville fortifiée de l’âge du Bronze et une occupation postérieure ; il est fouillé depuis 2005 par une équipe dirigée par Steven Collins, dont la thèse qu’il s’agit de Sodome est rejetée par la plupart des spécialistes. Tall Kafrayn, à environ 3 km au nord-ouest, est un tertre plus petit longtemps préféré pour Abel-Sittim. La prospection de Nelson Glueck, dans les années 1930, favorisa Hammam ; aucune inscription n’a tranché, et des acacias poussent encore dans l’oued."
    - "La plaine est aujourd’hui une terre agricole jordanienne au sud de la ville de Shounah du Sud, avec bananeraies et champs irrigués, à quelques kilomètres du site du baptême sur le Jourdain et de la rive nord de la mer Morte."
  it:
    - "Sittim, «le acacie», per intero Abel-Sittim, fu l’ultimo accampamento di Israele prima del Giordano, nelle pianure di Moab di fronte a Gerico, dove l’elenco delle tappe fa accampare il popolo «da Beth-Jescimoth fino ad Abel-Sittim». Qui, mentre Balaam li benediceva dalle alture, «Israele era stanziato a Sittim, e il popolo cominciò a darsi alla impurità con le figliuole di Moab», e seguì la piaga di Baal-Peor. Giosuè «mandò segretamente da Sittim due spie», che alloggiarono presso Raab a Gerico; poi Giosuè «partì da Sittim. Essi arrivarono al Giordano» e vi alloggiarono prima dell’attraversamento. Michea riassume il passo in una frase, «da Sittim a Ghilgal». La «valle di Sittim» di Gioele, irrigata da una fonte dal tempio, può essere un uadi secco presso Gerusalemme più che questo luogo; in Osea 5,2 alcuni leggono il nome dove le versioni più antiche non lo hanno."
    - "Giuseppe Flavio conosceva il campo come il luogo dove ai suoi tempi sorgeva la città di Abila, a sessanta stadi dal Giordano tra le palme; Eusebio elenca Abelsattim nel deserto sul lato di Moab. Due tell alla foce del Wadi Kefrein si contendono il sito. Tall el-Hammam, la prima scelta della mappa, è un tell molto grande con una città fortificata dell’età del Bronzo e occupazione successiva; è scavato dal 2005 da una squadra guidata da Steven Collins, la cui tesi che sia Sodoma è respinta dalla maggior parte degli studiosi. Tall Kafrayn, circa 3 km a nord-ovest, è un tell più piccolo a lungo preferito come Abel-Sittim. La ricognizione di Nelson Glueck degli anni 1930 favorì Hammam; nessuna iscrizione ha risolto la questione, e le acacie crescono ancora nell’uadi."
    - "La pianura è oggi terreno agricolo giordano a sud della città di Shuna meridionale, con banani e campi irrigui, a pochi chilometri dal sito del battesimo sul Giordano e dalla riva settentrionale del Mar Morto."
  pl:
    - "Szittim, „akacje”, w pełnej formie Abel-Szittim, było ostatnim obozem Izraela przed Jordanem, na równinach Moabu naprzeciw Jerycha, gdzie lista stacji mówi, że lud obozował „od Betiesymot aż do Abelsytym”. Tu, gdy Balaam błogosławił ich ze szczytów, „mieszkał Izrael w Syttim, począł lud cudzołożyć z córkami Moabskiemi”, i nastąpiła plaga Baal-Peor. Z Szittim „posłał Jozue, syn Nunów, z Syttim dwóch szpiegów potajemnie”, którzy zatrzymali się u Rachab w Jerychu; potem „ruszyli się z Syttim, a przyszli aż do Jordanu” i tam nocowali przed przeprawą. Mika podsumowuje cały fragment słowami „od Syttym aż do Galgal”. „Dolina Szittim” u Joela, do której płynie źródło z domu Pańskiego, „które obleje dolinę Syttym”, może być suchym wadi koło Jerozolimy, a nie tym miejscem; w Oz 5,2 niektórzy czytają to imię tam, gdzie dawne przekłady go nie mają."
    - "Józef Flawiusz znał obóz jako miejsce, gdzie w jego czasach stało miasto Abila, sześćdziesiąt stadiów od Jordanu wśród palm; Euzebiusz wymienia Abelsattim na pustyni po stronie Moabu. O to miejsce rywalizują dwa kopce u ujścia Wadi Kafrajn. Tall el-Hammam, pierwszy wybór mapy, jest bardzo wielkim kopcem z obwarowanym miastem z epoki brązu i późniejszym osadnictwem; od 2005 roku bada je zespół pod kierunkiem Stevena Collinsa, którego twierdzenie, że to Sodoma, większość uczonych odrzuca. Tall Kafrajn, około 3 km na północny zachód, to mniejszy kopiec, od dawna preferowany jako Abel-Szittim. Badania powierzchniowe Nelsona Gluecka z lat trzydziestych XX wieku opowiadały się za Hammam; żaden napis nie rozstrzygnął sprawy, a akacje wciąż rosną w wadi."
    - "Równina to dziś jordańskie pola uprawne na południe od miasta Południowa Szuna, z gajami bananowymi i polami nawadnianymi, kilka kilometrów od miejsca chrztu nad Jordanem i północnego brzegu Morza Martwego."
  cs:
    - "Šitim, „akácie“, plným jménem Ábel-šitim, byl poslední tábor Izraele před Jordánem, v moábských pláních naproti Jerichu, kde seznam stanovišť klade lid „od Betsimot až do Abelsetim“. Zde, zatímco je Bileám z výšin žehnal, „když pobyl Izrael v Setim, počal lid smilniti s dcerami Moábskými“, a následovala rána Báal-peóru. Ze Šitimu vyslal Jozue „z Setim dva muže špehéře tajně“, kteří se ubytovali u Rachab v Jerichu; pak „hnuvše se z Setim, přišli až k Jordánu“ a před přechodem tam přenocovali. Micheáš shrnuje celý průběh jedním výrazem, „od Setim až do Galgala“. Joelovo „údolé Setim“, zavlažené pramenem z chrámu, může být suché vádí poblíž Jeruzaléma spíše než toto místo; v Ozeáši 5,2 někteří čtou jméno tam, kde je starší verze nemají."
    - "Josephus znal tábor jako místo, kde za jeho dnů stálo město Abila, šedesát stadií od Jordánu mezi palmami; Eusebius uvádí Abelsattim v poušti na straně Moábu. O místo soupeří dva pahorky u ústí Vádí Kafrajn. Tall el-Hammám, první volba mapy, je velmi velký pahorek s opevněným městem doby bronzové a pozdějším osídlením; od roku 2005 jej kope tým pod vedením Stevena Collinse, jehož tvrzení, že je to Sodoma, většina učenců odmítá. Tall Kafrajn, asi 3 km na severozápad, je menší pahorek dlouho preferovaný jako Ábel-šitim. Průzkum Nelsona Glueckea ve 30. letech upřednostnil Hammám; žádný nápis věc nerozhodl a akácie ve vádí dosud rostou."
    - "Rovina je dnes jordánská zemědělská půda jižně od města Jižní Šúna, s banánovníkovými háji a zavlažovanými poli, několik kilometrů od místa křtu na Jordánu a od severního břehu Mrtvého moře."
  nl:
    - "Sittim, “de acacia’s”, voluit Abel-Sittim, was het laatste kamp van Israël vóór de Jordaan, in de vlakten van Moab tegenover Jericho, waar de lijst van verblijfplaatsen het volk laat kamperen “van Beth-Jesimoth, tot aan Abel-Sittim”. Hier, terwijl Bileam hen vanaf de hoogten zegende, “Israel verbleef te Sittim, en het volk begon te hoereren met de dochteren der Moabieten”, en de plaag van Baäl-Peor volgde. Vanuit Sittim had Jozua “twee mannen, die heimelijk verspieden zouden, gezonden”, die bij Rachab in Jericho logeerden; daarna “reisden van Sittim, en kwamen tot aan de Jordaan” en overnachtten daar vóór de oversteek. Micha vat alles samen: “van Sittim af tot Gilgal toe”. Joëls “dal van Sittim”, bewaterd door een bron uit de tempel, kan een droge wadi bij Jeruzalem zijn, niet deze plaats; in Hosea 5:2 lezen sommigen de naam waar de oudere versies hem niet hebben."
    - "Josephus kende het kamp als de plaats waar in zijn dagen de stad Abila stond, zestig stadiën van de Jordaan tussen de palmen; Eusebius noemt Abelsattim in de woestijn aan de kant van Moab. Twee heuvels aan de monding van de Wadi Kefrein dingen naar de plaats. Tall el-Hammam, de eerste keuze van de kaart, is een zeer grote heuvel met een ommuurde stad uit de bronstijd en latere bewoning; hij wordt sinds 2005 opgegraven door een team onder Steven Collins, wiens bewering dat het Sodom is door de meeste geleerden wordt verworpen. Tall Kafrayn, zo’n 3 km naar het noordwesten, is een kleinere heuvel die lang de voorkeur kreeg als Abel-Sittim. Nelson Gluecks onderzoek van de jaren 1930 gaf de voorkeur aan Hammam; geen opschrift heeft het beslecht, en acacia’s groeien nog in de wadi."
    - "De vlakte is tegenwoordig Jordaans landbouwgebied ten zuiden van de stad Zuid-Shuna, met bananenplantages en bevloeide velden, enkele kilometers van de doopplaats aan de Jordaan en de noordoever van de Dode Zee."
  sv:
    - "Shittim, ”akaciorna”, fullständigt Avel-Hashittim, var Israels sista läger före Jordan, på Moabs hedar mitt emot Jeriko, där stationsförteckningen låter folket slå läger ”från Bet-Hajesimot ända till Abel-Hassitim”. Här, medan Bileam välsignade dem från höjderna, hände detta: ”Medan Israel uppehöll sig i Sittim, begynte folket bedriva otukt med Moabs döttrar”, och pesten vid Baal-Peor följde. Från Shittim ”sände” Josua ”hemligen ut två spejare”, som tog in hos Rachav i Jeriko; därefter ”bröt” de ”upp från Sittim och kom till Jordan” och övernattade där före övergången. Mika sammanfattar hela avsnittet i en vändning, ”mellan Sittim och Gilgal”. Joels ”Akaciedalen”, som vattnas av en källa från templet, kan vara ett torrt vadi nära Jerusalem snarare än denna plats; i Hos 5:2 läser några namnet där de äldre översättningarna inte gör det."
    - "Josefus kände lägret som den plats där staden Abila låg på hans tid, sextio stadier från Jordan bland palmer; Eusebios upptar Abelsattim i öknen på Moabs sida. Två kullar vid mynningen av Wadi Kefrein tävlar om platsen. Tall el-Hammam, kartans förstaval, är en mycket stor tell med en befäst stad från bronsåldern och senare bosättning; den har grävts ut sedan 2005 av ett team under Steven Collins, vars påstående att den är Sodom de flesta forskare avvisar. Tall Kafrayn, omkring 3 km åt nordväst, är en mindre tell som länge föredragits som Avel-Hashittim. Nelson Gluecks undersökning på 1930-talet föredrog Hammam; ingen inskription har avgjort saken, och akacior växer fortfarande i wadin."
    - "Slätten är i dag jordansk jordbruksbygd söder om staden Södra Shuna, med bananlundar och bevattnade fält, några kilometer från dopplatsen vid Jordan och Döda havets norra strand."
  nb:
    - "Sjittim, «akasiene», i full form Abel-Sittim, var Israels siste leir før Jordan, på Moabs sletter midt for Jeriko, der stasjonslisten lar folket slå leir «fra Bet-Hajesimot til Abel-Hassittim». Her, mens Bileam velsignet dem fra høydene, gikk det slik: «Mens Israel opholdt sig i Sittim, begynte folket å drive utukt med Moabs døtre», og Baal-Peor-plagen fulgte. Josva «sendte hemmelig to speidere fra Sittim», som tok inn hos Rahab i Jeriko; deretter «stod Josva tidlig op og tok ut fra Sittim med alle Israels barn og kom til Jordan» og ble der før overgangen. Mika sammenfatter hele fortellingen i én frase: «fra Sittim til Gilgal». Joels «Sittims dal», vannet av en kilde fra Herrens hus, kan være en tørr wadi nær Jerusalem snarere enn dette stedet; i Hos 5,2 leser noen navnet der de eldre oversettelsene ikke gjør det."
    - "Josefus kjente leiren som stedet der byen Abila lå på hans tid, seksti stadier fra Jordan blant palmetrær; Eusebius oppfører Abelsattim i ørkenen på Moabs side. To hauger ved munningen av Wadi Kefrein konkurrerer om stedet. Tall el-Hammam, kartets førstevalg, er en meget stor haug med en ummuret by fra bronsealderen og senere bosetning; den har vært utgravd siden 2005 av et lag under Steven Collins, hvis påstand om at den er Sodoma de fleste forskere avviser. Tall Kafrayn, omkring 3 km mot nordvest, er en mindre haug som lenge ble foretrukket som Abel-Sittim. Nelson Gluecks kartlegging på 1930-tallet favoriserte Hammam; ingen innskrift har avgjort saken, og akasier vokser fortsatt i wadien."
    - "Sletten er i dag jordansk jordbruksland sør for byen Sør-Shuna, med bananlunder og vanningsjorder, noen få kilometer fra dåpsstedet ved Jordan og den nordlige bredden av Dødehavet."
  tl:
    - "Ang Sittim, “ang mga akasya”, na buong tawag ay Abel-sitim, ang huling kampo ng Israel bago ang Jordan, sa kapatagan ng Moab sa tapat ng Jerico; ayon sa talaan ng himpilan, humantong sila “mula sa Beth-jesimoth hanggang sa Abel-sitim”. Dito, habang binabasbasan sila ni Balaam mula sa kaitaasan, “ang Israel ay tumahan sa Sittim, at ang bayan ay nagpasimulang magkasala ng pakikiapid sa mga anak na babae ng Moab”, at sumunod ang salot ng Baal-peor. Mula Sittim ay “nagsugong lihim” si Josue ng “dalawang lalake na pinakatiktik”, na tumuloy kay Rahab sa Jerico; “umalis sa Sittim at napasa Jordan” sila at tumigil doon bago tumawid. Binubuod ito ni Mikas: “mula sa Sittem hanggang sa Gilgal”. Ang “libis ng Sittim” ni Joel, na dinidilig ng bukal ng templo, ay maaaring tuyong wadi sa may Jerusalem at hindi ito; sa Oseas 5:2, nababasa ito ng ilan kahit wala sa mga lumang salin."
    - "Kilala ni Josefo ang kampamento bilang lugar na kinatatayuan ng bayan ng Abila sa kaniyang kapanahunan, animnapung estadio mula sa Jordan sa gitna ng mga puno ng palma; itinatala ni Eusebio ang Abelsattim sa ilang sa panig ng Moab. Dalawang burol sa bukana ng Wadi Kefrein ang nag-aagawan sa lugar. Ang Tall el-Hammam, ang unang pinili ng mapa, ay isang napakalaking burol na may lunsod na may pader noong Panahong Tanso at may pananahanan pagkaraan; hinukay ito mula noong 2005 ng isang pangkat sa ilalim ni Steven Collins, na ang pag-aangking ito ang Sodoma ay tinatanggihan ng karamihan ng mga iskolar. Ang Tall Kafrayn, mga 3 km sa hilagang-kanluran, ay isang mas maliit na burol na matagal nang itinuturing na Abel-sitim. Pinaboran ng sarbey ni Nelson Glueck noong dekada 1930 ang Hammam; walang inskripsiyong nakapagpasya rito, at tumutubo pa rin ang mga akasya sa wadi."
    - "Ang kapatagan ngayon ay lupang sakahan ng Jordan sa timog ng bayan ng South Shuna, na may mga taniman ng saging at mga bukid na may patubig, ilang kilometro mula sa pook ng bautismo sa Jordan at sa hilagang baybayin ng Dagat na Patay."
  da:
    - "Sjittim, »akacierne«, i fuld form Abel-Sjittim, var Israels sidste lejr før Jordan, i Moabs Sletter over for Jeriko, hvor stationslisten lader folket slå lejr »fra Beth-Jesimoth til Abel Sittim«. Her, mens Bileam velsignede dem fra højderne, hedder det: »Israel boede i Sittim, og Folket begyndte at bedrive Hor med Moabiternes Døtre«, og pesten ved Ba'al-Peor fulgte. Fra Sjittim Josva »sendte hemmelig to Mænd som Spejdere«, der tog ind hos Rahab i Jeriko; derefter: »de rejste fra Sittim og kom til Jordanen« og overnattede dér inden overgangen. Mika sammenfatter hele forløbet i en vending: »fra Sittim indtil Gilgal«. Joels »Sittims Dal«, som en kilde fra templet vander, kan være en tør wadi nær Jerusalem snarere end dette sted; i Hos 5,2 læser nogle navnet, hvor de ældre oversættelser ikke gør."
    - "Josefus kendte lejren som det sted, hvor byen Abila lå i hans tid, tres stadier fra Jordan blandt palmetræer; Eusebios opfører Abelsattim i ørkenen på Moabs side. To tells ved mundingen af Wadi Kefrein konkurrerer om stedet. Tall el-Hammam, kortets førstevalg, er en meget stor tell med en befæstet by fra bronzealderen og senere bebyggelse; den er blevet udgravet siden 2005 af et hold under Steven Collins, hvis påstand om, at den er Sodoma, de fleste forskere afviser. Tall Kafrayn, omkring 3 km mod nordvest, er en mindre tell, som længe er blevet foretrukket som Abel-Sjittim. Nelson Gluecks survey i 1930'erne talte for Hammam; ingen indskrift har afgjort sagen, og der vokser stadig akacier i wadien."
    - "Sletten er i dag jordansk landbrugsland syd for byen South Shuna, med bananlunde og kunstvandede marker, få kilometer fra dåbsstedet ved Jordan og Dødehavets nordkyst."
  sr:
    - "Ситим, „багремови“, у пуном облику Вел-Сатим, био је последњи логор Израиља пред Јорданом, у равницама моавским према Јерихону, где се у списку станица каже да је народ логоровао „од Есимота до Вел-Сатима“. Овде, док их је Валам благосиљао с висина, „живљаше Израиљ у Ситиму, и народ стаде чинити прељубу са кћерима моавским“, а затим је уследила пошаст Велфегора. Исус „посла из Ситима потајно две уходе“, које су одселе код Раве у Јерихону; затим, каже књига, „кретоше се од Ситима и дођоше до Јордана“ и онде су преноћили пре прелаза. Миха све то сажима: „од Ситима до Галгала“. Јоилова долина Ситим, коју натапа извор из храма, можда је сува долина код Јерусалима, а не ово место; у Ос 5,2 неки читају то име где га старији преводи немају."
    - "Јосиф Флавије је знао логор као место где је у његово доба стајао град Авила, шездесет стадија од Јордана међу палмама; Јевсевије наводи Авелсатим у пустињи на страни моавској. За налазиште се надмећу два хума на ушћу вадија Кефрејн. Тал ел Хамам, први избор карте, врло је велик хум с утврђеним градом из бронзаног доба и каснијим насељавањем; од 2005. га ископава екипа под вођством Стивена Колинса, чију тврдњу да је то Содом већина научника одбацује. Тал Кафрајн, око 3 км северозападно, мањи је хум који се дуго сматрао за Вел-Сатим. Истраживање Нелсона Глика из 1930-их приклањало се Хамаму; ниједан натпис није решио спор, а багрем и даље расте у вадију."
    - "Равница је данас јорданско пољопривредно земљиште јужно од града Јужна Шуна, са банановим плантажама и наводњаваним пољима, на неколико километара од места крштења на Јордану и северне обале Мртвог мора."
  hu:
    - "Sittim, „az akácok”, teljes nevén Ábel-Sittim, Izráel utolsó tábora volt a Jordán előtt, Moáb síkságán, Jerikóval szemben, ahol az állomások jegyzéke szerint a nép „Beth-Hajjesimóthtól Abel-Hassittimig” táborozott. Itt, míg Bálám a magaslatokról megáldotta őket, „Sittimben lakozik vala Izráel, kezde a nép paráználkodni Moáb leányaival”, és a Baál-Peór-i csapás következett. Sittimből küldött Józsué „titkon két férfiút kémekül”, akik Ráhábnál szálltak meg Jerikóban; majd „elindulának Sittimből, és eljutának a Jordánhoz”, és ott háltak az átkelés előtt. Mikeás az egész történetet egy kifejezésben foglalja össze: „Sittimtől fogva Gilgálig”. Jóelnél a templomból fakadó forrás „megöntözi a Sittimnek völgyét”, amely talán egy Jeruzsálem közelében lévő száraz medret jelent, nem ezt a helyet; Hós 5,2-ben egyesek ott olvassák a nevet, ahol a régebbi fordítások nem."
    - "Josephus a tábort azon a helyen ismerte, ahol az ő idejében Ábila városa állt a Jordántól hatvan stadionnyira pálmák között; Eusebius Abelsattimot a sivatagban, Moáb oldalán sorolja fel. A hely címére két domb pályázik a Vádi Kefrén torkolatánál. A Tall el-Hammám, a térkép első választása, igen nagy domb bronzkori fallal körülvett várossal és későbbi megtelepedéssel; 2005 óta Steven Collins csapata ásatja, akinek az az állítását, hogy ez Sodoma, a legtöbb tudós elutasítja. A Tall Kafrájn, mintegy 3 km-re északnyugatra, kisebb domb, amelyet sokáig előnyben részesítettek Ábel-Sittimként. Nelson Glueck 1930-as évekbeli felmérése a Hammámot részesítette előnyben; felirat nem döntötte el a kérdést, és akácok ma is nőnek a völgyben."
    - "A síkság ma jordániai termőföld Dél-Súna városától délre, banánligetekkel és öntözött földekkel, néhány kilométerre a Jordán menti keresztelkedési helytől és a Holt-tenger északi partjától."
  fi:
    - "Sittim, ”akasiat”, kokonaisuudessaan Abel-Sittim, oli Israelin viimeinen leiripaikka ennen Jordania Mooabin tasangoilla Jerikoa vastapäätä; asemaluettelon mukaan kansan leiri ulottui ”Beet-Jesimotista aina Aabel-Sittimiin asti”. Täällä, kun Bileam siunasi heitä kukkuloilta, ”Israel asettui Sittimiin. Ja kansa rupesi irstailemaan Mooabin tyttärien kanssa”, ja sitä seurasi Baal-Peorin vitsaus. Täältä Joosua ”lähetti salaa Sittimistä kaksi vakoojaa”, jotka yöpyivät Jerikossa Rahabin luona; sitten he ”lähtivät liikkeelle Sittimistä ja tulivat Jordanille” ja yöpyivät siellä ennen ylitystä. Miika tiivistää koko kulun sanontaan: ”Sittimistä lähtien Gilgaliin asti”. Joelin Sittimin laakso, jota temppelistä lähtevä lähde kastelee, voi olla kuiva wadi Jerusalemin lähellä eikä tämä paikka; Hoos. 5:2:ssa jotkut lukevat nimen sinne, missä vanhemmat käännökset eivät sitä lue."
    - "Josefus tunsi leiripaikan paikkana, jossa hänen aikanaan sijaitsi Abilan kaupunki, kuudenkymmenen stadionin päässä Jordanista palmujen keskellä; Eusebios luettelee Abelsattimin erämaassa Moabin puolella. Kaksi kumparetta Wadi Kefreinin suulla kilpailee paikasta. Tall el-Hammam, kartan ensimmäinen valinta, on hyvin suuri kumpare, jossa on pronssikauden muurein ympäröity kaupunki ja myöhempää asutusta; sitä on kaivanut vuodesta 2005 Steven Collinsin johtama ryhmä, jonka väitteen, että se on Sodoma, useimmat tutkijat hylkäävät. Tall Kafrayn, noin 3 km luoteeseen, on pienempi kumpare, jota on pitkään pidetty parempana Abel-Sittimin paikkana. Nelson Gluecken 1930-luvun kartoitus puolsi Hammamia; mikään kirjoitus ei ole ratkaissut asiaa, ja akasioita kasvaa wadissa yhä."
    - "Tasanko on nykyisin Jordanian viljelysmaata Etelä-Shunan kaupungin eteläpuolella, banaaniviljelmineen ja kasteltuine peltoineen, muutaman kilometrin päässä Jordanin kastepaikasta ja Kuolleenmeren pohjoisrannasta."
  vi:
    - "Si-tim, “những cây cơ-sia”, đầy đủ là A-bên-Si-tim, là nơi đóng trại cuối cùng của Y-sơ-ra-ên trước sông Giô-đanh, trong đồng bằng Mô-áp đối ngang Giê-ri-cô, nơi danh sách các chặng ghi dân sự đóng trại “từ Bết-Giê-si-mốt chi A-bên-Si-tim”. Tại đây, trong khi Ba-la-am chúc phước cho họ từ các nơi cao, “dân Y-sơ-ra-ên ở tại Si-tim, khởi thông dâm cùng những con gái Mô-áp”, rồi tai vạ Ba-anh-Phê-ô xảy đến. Từ Si-tim, Giô-suê “mật sai hai người do thám”, họ ngụ nhà Ra-háp ở Giê-ri-cô; rồi ông “ở Si-tim đi cùng hết thảy dân Y-sơ-ra-ên, đến mé sông Giô-đanh” và ngủ đêm tại đó trước khi qua sông. Mi-chê tóm cả đoạn này trong một cụm từ: “từ Si-tim đến Ghinh-ganh”. “Trũng Si-tim” của Giô-ên, được tưới bởi một cái suối ra từ đền, có thể là một lòng suối khô gần Giê-ru-sa-lem hơn là nơi này; ở Ô-sê 5:2 một số người đọc ra tên này ở chỗ các bản cũ không có."
    - "Josephus biết trại này là nơi mà thời ông có thị trấn Abila, cách sông Giô-đanh sáu mươi stadia giữa những cây chà là; Eusebius nêu Abelsattim trong hoang mạc về phía Mô-áp. Hai gò ở cửa Wadi Kefrein tranh nhau địa điểm này. Tall el-Hammam, lựa chọn đầu của bản đồ, là một gò rất lớn với một thành có tường bao thời đồ đồng và các tầng cư trú về sau; từ năm 2005 một nhóm do Steven Collins dẫn đầu khai quật nơi này, và lời ông cho rằng đó là Sô-đôm bị đa số học giả bác bỏ. Tall Kafrayn, cách khoảng 3 km về phía tây bắc, là một gò nhỏ hơn từ lâu được ưa chuộng làm A-bên-Si-tim. Cuộc khảo sát của Nelson Glueck vào thập niên 1930 thiên về Hammam; chưa có bia ký nào giải quyết được, và cây cơ-sia vẫn mọc trong wadi."
    - "Ngày nay đồng bằng này là đất canh tác của Jordan, phía nam thị trấn South Shuna, với các vườn chuối và ruộng tưới, cách nơi báp-têm trên sông Giô-đanh và bờ bắc Biển Chết vài km."
  ro:
    - "Sitim, „salcâmii”, cu numele întreg Abel-Sitim, a fost ultima tabără a lui Israel înainte de Iordan, în câmpiile Moabului, în fața Ierihonului, unde lista popasurilor arată poporul tăbărând „la Iordan între Esimot până la Velsa”. Aici, în timp ce Balaam îl binecuvânta de pe înălțimi, „a poposit Israil în Satin, și s’a spurcat poporul curvind cu fetele lui Moav”, și a urmat ciuma de la Baal-Peor. Din Sitim, Iosua a trimis „doi tineri să iscodească”, care au găzduit la Rahab în Ierihon; apoi Iosua „a purces din Sattin și a venit până la Iordan”, iar poporul a tăbărât acolo înainte de trecere. Mica rezumă tot pasajul într-o expresie, „dela Shini până la Galgal”. Valea Sitimului din Ioel, udată de un izvor ieșit din templu, poate fi mai degrabă un uadi secat de lângă Ierusalim decât acest loc; în Osea 5:2 unii citesc numele acolo unde versiunile mai vechi nu îl au."
    - "Iosif Flaviu cunoștea tabăra ca loc unde se afla în vremea lui orașul Abila, la șaizeci de stadii de Iordan, printre palmieri; Eusebiu pomenește Abelsattim în pustie, pe latura Moabului. Două movile de la gura Wadi Kefrein se dispută locul. Tall el-Hammam, prima alegere a hărții, este o movilă foarte mare, cu un oraș înconjurat de ziduri din epoca bronzului și locuire ulterioară; a fost săpată din 2005 de o echipă condusă de Steven Collins, a cărui afirmație că ar fi Sodoma este respinsă de cei mai mulți cercetători. Tall Kafrayn, la circa 3 km spre nord-vest, este o movilă mai mică, preferată multă vreme pentru Abel-Sitim. Cercetarea de suprafață a lui Nelson Glueck din anii 1930 a înclinat spre Hammam; nicio inscripție nu a hotărât chestiunea, iar salcâmii cresc și astăzi în uadi."
    - "Câmpia este astăzi teren agricol iordanian la sud de orașul Shuna de Sud, cu plantații de banani și câmpuri irigate, la câțiva kilometri de locul botezului de pe Iordan și de malul nordic al Mării Moarte."
  bg:
    - "Ситим, „акациите“, с пълното име Авел-Ситим, бил последният стан на Израил преди Йордан, на Моавските полета срещу Йерихон, където списъкът на стоянките поставя народа разположен „от Ветие-симот до Авел-ситтим“. Тук, докато Валаам ги благославял от височините, „остана Израил в Ситтим; и почнаха людете да блудствуват с Моавските дъщери“, и последвал моровият бич заради Ваал-Фегор. От Ситим Иисус Навин „проводи … двама человеци да съгледат тайно“, които отседнали у Раав в Йерихон; после „дигнаха се от Ситим, и дойдоха до Йордан“ и пренощували там преди преминаването. Миха обобщава целия преход с един израз: „От Ситим до Галгал“. „Ситимския дол“ у Йоил, напояван от извор из Господния дом, може да е сухо уади близо до Йерусалим, а не това място; в Ос. 5:2 някои четат името там, където по-старите преводи не го четат."
    - "Йосиф Флавий познавал стана като мястото, където по негово време се намирал град Авила, на шестдесет стадия от Йордан сред палми; Евсевий посочва Абелсатим в пустинята откъм Моав. За мястото се съревновават две могили в устието на Уади Кефрейн. Тал ел-Хамам, първият избор на картата, е много голяма могила с укрепен град от бронзовата епоха и по-късно обитаване; разкопава се от 2005 г. от екип под ръководството на Стивън Колинс, чието твърдение, че това е Содом, повечето учени отхвърлят. Тал Кафрейн, на около 3 км северозападно, е по-малка могила, дълго предпочитана за Авел-Ситим. Проучването на Нелсън Глюк през 1930-те години предпочитало Хамам; никакъв надпис не е решил въпроса, а в уадито и днес растат акации."
    - "Днес равнината е йорданска земеделска земя южно от град Южна Шуна, с бананови насаждения и напоявани полета, на няколко километра от мястото на кръщението на Йордан и от северния бряг на Мъртво море."
