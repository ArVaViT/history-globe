body:
  en:
    - "Nicopolis, the “city of victory”, was founded by Octavian, the future Augustus, on the northern promontory at the mouth of the Ambracian Gulf in Epirus, where his army had camped before he defeated Antony and Cleopatra at Actium in 31 BC. Strabo says Augustus gathered into it the people left in the ruined cities of the region and that it grew daily; Octavian also renewed the Actian games in honour of Apollo on a grander scale. Its ruins lie about 5 km north of modern Preveza in north-western Greece, with a museum nearby."
    - "Writing to Titus in Crete, Paul asks him: “be diligent to come unto me to Nicopolis: for I have determined there to winter.” Several cities bore the name, in Thrace, Cilicia and Judaea among others, and the old subscription to the letter in the King James Version speaks of “Nicopolis of Macedonia”; but most interpreters, as the International Standard Bible Encyclopedia, take Paul to mean the city in Epirus, the chief city of that province."
    - "After Domitian banished the philosophers from Rome, about AD 93–95, the Stoic Epictetus settled at Nicopolis and taught there for the rest of his life; his pupil Arrian wrote down his Discourses. Under Diocletian the city became the capital of the province of Old Epirus. The Vandals took it in 474, and Justinian repaired its walls."
  ru:
    - "Никополь, «город победы», основал Октавиан, будущий Август, на северном мысу у входа в Амбракийский залив в Эпире, где стояло лагерем его войско перед победой над Антонием и Клеопатрой при Акции в 31 г. до н. э. Страбон пишет, что Август собрал в него жителей, уцелевших в разорённых городах края, и что город рос с каждым днём; Октавиан возобновил и с большим размахом Актийские игры в честь Аполлона. Его руины лежат примерно в 5 км к северу от нынешней Превезы на северо-западе Греции, рядом — музей."
    - "Апостол пишет Титу на Крит: «поспеши придти ко мне в Никополь, ибо я положил там провести зиму». Городов с этим именем было несколько, в том числе во Фракии, Киликии и Иудее, а старая приписка к посланию в английской Библии короля Якова говорит о «Никополе Македонском»; но большинство толкователей, как и Международная стандартная библейская энциклопедия, понимают здесь город в Эпире, главный город этой провинции."
    - "Когда около 93–95 гг. н. э. Домициан изгнал философов из Рима, стоик Эпиктет поселился в Никополе и учил там до конца жизни; его ученик Арриан записал его «Беседы». При Диоклетиане город стал столицей провинции Старый Эпир. В 474 г. его захватили вандалы, а Юстиниан восстановил его стены."
  uk:
    - "Нікополь, «місто перемоги», заснував Октавіан, майбутній Август, на північному мисі при вході в Амбракійську затоку в Епірі, де стояв табором його військо перед тим, як він переміг Антонія й Клеопатру при Акції 31 р. до н. е. Страбон каже, що Август зібрав у нього людей зі зруйнованих міст області і що воно росло щодня; Октавіан також відновив Актійські ігри на честь Аполлона у більших розмірах. Його руїни лежать приблизно за 5 км на північ від сучасної Превези на північному заході Греції, з музеєм поблизу."
    - "Пишучи Титові на Крит, Павло просить його: «постарайсь прийти до мене в Никополь: там бо надумавсь я зазимувати». Кілька міст носили цю назву, у Фракії, Кілікії та Юдеї серед інших, і давній підпис до послання в Біблії короля Якова говорить про «Нікополь Македонський»; але більшість тлумачів, як-от International Standard Bible Encyclopedia, вважають, що Павло має на увазі місто в Епірі, головне місто тієї провінції."
    - "Після того як Доміціан вигнав філософів з Рима, близько 93–95 рр. н. е., стоїк Епіктет оселився в Нікополі й викладав там до кінця життя; його учень Арріан записав його «Бесіди». За Діоклетіана місто стало столицею провінції Старий Епір. Вандали взяли його 474 р., а Юстиніан відремонтував його мури."
  es:
    - "Nicópolis, la «ciudad de la victoria», fue fundada por Octavio, el futuro Augusto, en el promontorio septentrional de la boca del golfo de Ambracia, en el Epiro, donde había acampado su ejército antes de derrotar a Antonio y Cleopatra en Accio en 31 a. C. Estrabón dice que Augusto reunió en ella a la gente que quedaba en las ciudades arruinadas de la región y que crecía cada día; Octavio renovó además los juegos Actios en honor de Apolo con mayor grandeza. Sus ruinas se hallan a unos 5 km al norte de la actual Preveza, en el noroeste de Grecia, con un museo cerca."
    - "Escribiendo a Tito en Creta, Pablo le pide: «procura venir á mí, á Nicópolis: porque allí he determinado invernar». Varias ciudades llevaron ese nombre, en Tracia, Cilicia y Judea entre otras, y la antigua suscripción de la carta en la versión King James habla de «Nicópolis de Macedonia»; pero la mayoría de los intérpretes, como la International Standard Bible Encyclopedia, entienden que Pablo se refiere a la ciudad del Epiro, la principal de esa provincia."
    - "Después de que Domiciano desterrara a los filósofos de Roma, hacia 93–95 d. C., el estoico Epicteto se estableció en Nicópolis y enseñó allí el resto de su vida; su discípulo Arriano puso por escrito sus Disertaciones. Bajo Diocleciano la ciudad se convirtió en la capital de la provincia del Epiro Antiguo. Los vándalos la tomaron en 474, y Justiniano reparó sus murallas."
  de:
    - "Nikopolis, die „Stadt des Sieges“, wurde von Octavian, dem späteren Augustus, auf dem nördlichen Vorgebirge an der Mündung des Ambrakischen Golfs in Epirus gegründet, wo sein Heer gelagert hatte, bevor er 31 v. Chr. bei Actium Antonius und Kleopatra besiegte. Strabon sagt, Augustus habe die in den zerstörten Städten der Gegend übrig gebliebenen Menschen in ihr gesammelt und sie wachse täglich; Octavian erneuerte auch die Aktischen Spiele zu Ehren Apollons in größerem Maßstab. Ihre Ruinen liegen etwa 5 km nördlich des heutigen Preveza im Nordwesten Griechenlands, mit einem Museum in der Nähe."
    - "Im Brief an Titus auf Kreta bittet Paulus ihn: „so komm eilend zu mir gen Nikopolis; denn daselbst habe ich beschlossen den Winter zu bleiben“. Mehrere Städte trugen den Namen, unter anderen in Thrakien, Kilikien und Judäa, und die alte Unterschrift des Briefes in der King-James-Bibel spricht von Nikopolis in Mazedonien; doch die meisten Ausleger, so die International Standard Bible Encyclopedia, nehmen an, Paulus meine die Stadt in Epirus, die Hauptstadt dieser Provinz."
    - "Nachdem Domitian um 93–95 n. Chr. die Philosophen aus Rom verbannt hatte, ließ sich der Stoiker Epiktet in Nikopolis nieder und lehrte dort bis ans Ende seines Lebens; sein Schüler Arrian schrieb seine Gespräche auf. Unter Diokletian wurde die Stadt Hauptstadt der Provinz Alt-Epirus. Die Vandalen nahmen sie 474, und Justinian besserte ihre Mauern aus."
  fr:
    - "Nicopolis, la « ville de la victoire », fut fondée par Octavien, le futur Auguste, sur le promontoire nord à l’entrée du golfe d’Ambracie, en Épire, là où son armée avait campé avant qu’il batte Antoine et Cléopâtre à Actium en 31 av. J.-C. Strabon dit qu’Auguste y rassembla les gens restés dans les villes ruinées de la région et qu’elle croissait chaque jour ; Octavien renouvela aussi les jeux d’Actium en l’honneur d’Apollon, sur une plus grande échelle. Ses ruines se trouvent à environ 5 km au nord de l’actuelle Préveza, dans le nord-ouest de la Grèce, avec un musée à proximité."
    - "Écrivant à Tite en Crète, Paul lui demande : « hâte-toi de venir me rejoindre à Nicopolis ; car c’est là que j’ai résolu de passer l’hiver. » Plusieurs villes portaient ce nom, en Thrace, en Cilicie et en Judée entre autres, et l’ancienne souscription de la lettre dans la version du roi Jacques parle de « Nicopolis de Macédoine » ; mais la plupart des interprètes, comme l’International Standard Bible Encyclopedia, tiennent que Paul songe à la ville d’Épire, la principale de cette province."
    - "Après que Domitien eut banni les philosophes de Rome, vers 93–95 apr. J.-C., le stoïcien Épictète s’établit à Nicopolis et y enseigna le reste de sa vie ; son disciple Arrien mit par écrit ses Entretiens. Sous Dioclétien, la ville devint la capitale de la province d’Épire ancienne. Les Vandales la prirent en 474, et Justinien répara ses murs."
  pt:
    - "Nicópolis, a “cidade da vitória”, foi fundada por Otaviano, o futuro Augusto, no promontório norte na foz do golfo de Ambrácia, no Épiro, onde seu exército havia acampado antes de ele derrotar Antônio e Cleópatra em Áccio em 31 a.C. Estrabão diz que Augusto reuniu nela o povo que restava nas cidades arruinadas da região e que ela crescia a cada dia; Otaviano também renovou os jogos áccios em honra de Apolo em escala mais grandiosa. Suas ruínas ficam cerca de 5 km ao norte da atual Prévesa, no noroeste da Grécia, com um museu nas proximidades."
    - "Escrevendo a Tito em Creta, Paulo lhe pede: “esforce-se para vir ao meu encontro em Nicópolis, pois decidi passar o inverno ali”. Várias cidades tinham esse nome, na Trácia, na Cilícia e na Judeia, entre outras, e a antiga subscrição da carta na Versão King James fala de Nicópolis da Macedônia; mas a maioria dos intérpretes, como a International Standard Bible Encyclopedia, entende que Paulo se refere à cidade do Épiro, a principal daquela província."
    - "Depois que Domiciano baniu os filósofos de Roma, por volta de 93–95 d.C., o estoico Epicteto se estabeleceu em Nicópolis e ali ensinou pelo resto da vida; seu discípulo Arriano escreveu seus Discursos. Sob Diocleciano a cidade tornou-se a capital da província do Antigo Épiro. Os vândalos a tomaram em 474, e Justiniano reparou suas muralhas."
  it:
    - "Nicopoli, la «città della vittoria», fu fondata da Ottaviano, il futuro Augusto, sul promontorio settentrionale alla foce del golfo di Ambracia in Epiro, dove il suo esercito si era accampato prima di sconfiggere Antonio e Cleopatra ad Azio nel 31 a.C. Strabone dice che Augusto vi raccolse la popolazione rimasta nelle città in rovina della regione e che cresceva ogni giorno; Ottaviano rinnovò inoltre i giochi aziaci in onore di Apollo su scala più grandiosa. Le sue rovine si trovano a circa 5 km a nord dell’odierna Preveza, nella Grecia nord-occidentale, con un museo nelle vicinanze."
    - "Scrivendo a Tito a Creta, Paolo gli chiede: «studiati di venir da me a Nicopoli, perché ho deciso di passar quivi l’inverno». Diverse città portavano il nome, in Tracia, Cilicia e Giudea tra le altre, e l’antica sottoscrizione della lettera nella King James Version parla di «Nicopoli di Macedonia»; ma la maggior parte degli interpreti, come la International Standard Bible Encyclopedia, ritiene che Paolo intenda la città dell’Epiro, il centro principale di quella provincia."
    - "Dopo che Domiziano bandì i filosofi da Roma, verso il 93–95 d.C., lo stoico Epitteto si stabilì a Nicopoli e vi insegnò per il resto della vita; il suo allievo Arriano mise per iscritto i suoi Discorsi. Sotto Diocleziano la città divenne la capitale della provincia di Epiro Vecchio. I Vandali la presero nel 474, e Giustiniano ne riparò le mura."
  nl:
    - "Nicopolis, de ‘stad van de overwinning’, werd gesticht door Octavianus, de latere Augustus, op de noordelijke landtong bij de monding van de Ambracische Golf in Epirus, waar zijn leger had gekampeerd voordat hij in 31 v.Chr. Antonius en Cleopatra bij Actium versloeg. Strabo zegt dat Augustus de mensen die in de verwoeste steden van de streek waren overgebleven erin bijeenbracht en dat het dagelijks groeide; Octavianus vernieuwde ook de Actische spelen ter ere van Apollo op grotere schaal. De ruïnes liggen ongeveer 5 km ten noorden van het moderne Preveza in het noordwesten van Griekenland, met een museum in de buurt."
    - "Schrijvend aan Titus op Kreta vraagt Paulus hem: “zo benaarstig u tot mij te komen te Nikopolis; want aldaar heb ik voorgenomen te overwinteren.” Meerdere steden droegen de naam, onder meer in Thracië, Cilicië en Judea, en het oude onderschrift bij de brief in de King James Version spreekt van “Nicopolis van Macedonië”; maar de meeste uitleggers, zoals de International Standard Bible Encyclopedia, menen dat Paulus de stad in Epirus bedoelt, de hoofdstad van die provincie."
    - "Nadat Domitianus de filosofen uit Rome had verbannen, omstreeks 93–95 n.Chr., vestigde de stoïcijn Epictetus zich te Nicopolis en onderwees daar de rest van zijn leven; zijn leerling Arrianus schreef zijn Gesprekken op. Onder Diocletianus werd de stad de hoofdstad van de provincie Epirus Vetus. De Vandalen namen haar in 474 in, en Justinianus herstelde haar muren."
  pl:
    - "Nikopolis, „miasto zwycięstwa”, zostało założone przez Oktawiana, przyszłego Augusta, na północnym cyplu u ujścia Zatoki Ambrakijskiej w Epirze, gdzie jego armia obozowała, zanim w 31 p.n.e. pokonał Antoniusza i Kleopatrę pod Akcjum. Strabon mówi, że August zgromadził w nim ludność pozostałą w zrujnowanych miastach regionu i że rosło z dnia na dzień; Oktawian odnowił też w większym stylu igrzyska akcjańskie ku czci Apolla. Jego ruiny leżą około 5 km na północ od dzisiejszej Prevezy w północno-zachodniej Grecji, z muzeum w pobliżu."
    - "Pisząc do Tytusa na Krecie, Paweł prosi go: „staraj się, abyś do mnie przyszedł do Nikopolim; bom tam postanowił zimować”. Kilka miast nosiło tę nazwę, między innymi w Tracji, Cylicji i Judei, a dawna dopiska pod listem w Biblii Króla Jakuba mówi o Nikopolis w Macedonii; lecz większość interpretatorów, jak International Standard Bible Encyclopedia, uważa, że Paweł ma na myśli miasto w Epirze, główne miasto tej prowincji."
    - "Gdy Domicjan wygnał filozofów z Rzymu, około 93-95 r. n.e., stoik Epiktet osiadł w Nikopolis i nauczał tam do końca życia; jego uczeń Arrian spisał jego Rozmowy. Za Dioklecjana miasto stało się stolicą prowincji Epir Stary. Wandalowie zdobyli je w 474 roku, a Justynian naprawił jego mury."
  cs:
    - "Nikopolis, „město vítězství“, založil Octavianus, pozdější Augustus, na severním výběžku u ústí Ambrakijského zálivu v Épeiru, kde se utábořilo jeho vojsko, než roku 31 př. n. l. u Aktia porazil Antonia a Kleopatru. Strabón říká, že Augustus do něj shromáždil lid zbylý ve zničených městech kraje a že denně rostlo; Octavianus také v něm obnovil aktijské hry ke cti Apollóna ve větším měřítku. Jeho zříceniny leží asi 5 km severně od dnešní Prevezy v severozápadním Řecku, nedaleko stojí muzeum."
    - "Pavel píše Titovi na Krétě: „snaž se přijíti ke mně do Nikopolim; neb jsem umínil tu přes zimu pobýti.“ Jméno neslo několik měst, mimo jiné v Thrákii, Kilikii a Judsku, a starý dodatek k listu v Bibli krále Jakuba mluví o „Nikopoli v Makedonii“; ale většina vykladačů, například International Standard Bible Encyclopedia, míní, že Pavel myslí město v Épeiru, hlavní město té provincie."
    - "Poté, co Domitianus vypověděl filozofy z Říma, asi v letech 93–95 n. l., usadil se stoik Epiktétos v Nikopoli a učil tam do konce života; jeho žák Arrianos zapsal jeho Rozpravy. Za Diocletiana se město stalo hlavním městem provincie Starý Épeiros. Vandalové je dobyli roku 474 a Justinianus opravil jeho hradby."
  sv:
    - "Nikopolis, ”segerstaden”, grundades av Octavianus, den blivande Augustus, på den norra udden vid mynningen av Ambrakiska viken i Epiros, där hans här hade slagit läger innan han besegrade Antonius och Kleopatra vid Actium 31 f.Kr. Strabon säger att Augustus samlade i staden de människor som blivit kvar i regionens ödelagda städer och att den växte dagligen; Octavianus förnyade också de aktiska spelen till Apollons ära i större skala. Dess ruiner ligger cirka 5 km norr om nuvarande Preveza i nordvästra Grekland, med ett museum i närheten."
    - "I brevet till Titus på Kreta ber Paulus honom: ”låt dig då angeläget vara att komma till mig i Nikopolis, ty jag har beslutit att stanna där över vintern.” Flera städer bar namnet, bland annat i Thrakien, Kilikien och Judeen, och den gamla efterskriften till brevet i King James-översättningen talar om ”Nicopolis of Macedonia”; men de flesta tolkare, som International Standard Bible Encyclopedia, anser att Paulus menar staden i Epiros, provinsens huvudstad."
    - "Sedan Domitianus förvisat filosoferna från Rom, omkring 93–95 e.Kr., bosatte sig stoikern Epiktetos i Nikopolis och undervisade där resten av sitt liv; hans elev Arrianos skrev ned hans Samtal. Under Diocletianus blev staden huvudstad i provinsen Gamla Epiros. Vandalerna intog den 474, och Justinianus reparerade dess murar."
  nb:
    - "Nikopolis, «seierens by», ble grunnlagt av Oktavian, den senere Augustus, på den nordlige odden ved innløpet til Ambrakiabukta i Epirus, der hæren hans hadde slått leir før han beseiret Antonius og Kleopatra ved Aktium i 31 f.Kr. Strabon sier at Augustus samlet i den folket som var igjen i byene i området som lå i ruiner, og at den vokste dag for dag; Oktavian fornyet også de aktiske lekene til ære for Apollon i større stil. Ruinene ligger omtrent 5 km nord for dagens Preveza i det nordvestlige Hellas, med et museum i nærheten."
    - "I brevet til Titus på Kreta ber Paulus ham: «gjør dig umak for å komme til mig i Nikopolis; for der har jeg tenkt å bli vinteren over.» Flere byer bar navnet, blant annet i Thrakia, Kilikia og Judea, og den gamle underskriften til brevet i King James Version taler om «Nikopolis i Makedonia»; men de fleste tolkere, som International Standard Bible Encyclopedia, mener at Paulus sikter til byen i Epirus, provinsens hovedby."
    - "Etter at Domitian forviste filosofene fra Roma, omkring 93–95 e.Kr., slo stoikeren Epiktet seg ned i Nikopolis og underviste der resten av livet; hans elev Arrian skrev ned Samtalene hans. Under Diokletian ble byen hovedstad i provinsen Gamle Epirus. Vandalene inntok den i 474, og Justinian reparerte murene."
  tl:
    - "Ang Nicopolis, ang “lungsod ng tagumpay”, ay itinatag ni Octavian, ang magiging Augusto, sa hilagang tangos ng lupa sa bunganga ng Golpo ng Ambracia sa Epirus, kung saan nagkampo ang kaniyang hukbo bago niya talunin sina Antonio at Cleopatra sa Actium noong 31 BK. Sinasabi ni Strabo na tinipon ni Augusto dito ang mga taong naiwan sa mga wasak na lungsod ng rehiyon at na lumago ito araw-araw; pinanibago rin ni Octavian sa mas engrandeng paraan ang Palarong Actian bilang parangal kay Apollo. Ang mga guho nito ay mga 5 km sa hilaga ng makabagong Preveza sa hilagang-kanlurang Grecia, na may museo sa malapit."
    - "Sa pagsulat kay Tito sa Creta, hinihiling ni Pablo sa kaniya: “magsikap kang pumarini sa akin sa Nicopolis: sapagka't pinasiyahan kong doon matira sa taginaw.” Maraming lungsod ang may ganitong pangalan, sa Tracia, Cilicia at Judea bukod sa iba, at binabanggit ng lumang sulat-pangwakas ng liham sa King James Version ang “Nicopolis of Macedonia”; ngunit karamihan sa mga tagapagpaliwanag, gaya ng International Standard Bible Encyclopedia, ay nagsasabing ang tinutukoy ni Pablo ay ang lungsod sa Epirus, ang pangunahing lungsod ng lalawigang iyon."
    - "Matapos paalisin ni Domiciano ang mga pilosopo sa Roma, bandang AD 93–95, ang Estoikong si Epicteto ay tumira sa Nicopolis at nagturo roon sa nalalabi niyang buhay; isinulat ng kaniyang mag-aaral na si Arriano ang kaniyang mga Discourses. Sa ilalim ni Diocleciano, ang lungsod ay naging kabisera ng lalawigan ng Lumang Epirus. Kinuha ito ng mga Vandalo noong 474, at kinumpuni ni Justiniano ang mga pader nito."
  da:
    - "Nikopolis, »sejrens by«, blev grundlagt af Oktavian, den kommende Augustus, på den nordlige halvø ved udmundingen af den ambrakiske bugt i Epirus, hvor hans hær havde slået lejr, før han besejrede Antonius og Kleopatra ved Actium i 31 f.Kr. Strabon siger, at Augustus samlede i den de mennesker, der var tilbage i regionens ødelagte byer, og at den voksede dag for dag; Oktavian fornyede også de aktiske lege til ære for Apollon i større stil. Dens ruiner ligger omkring 5 km nord for nutidens Preveza i det nordvestlige Grækenland, med et museum i nærheden."
    - "I sit brev til Titus på Kreta skriver Paulus: »gør dig Flid for at komme til mig i Nikopolis; thi der har jeg besluttet at overvintre.« Flere byer bar navnet, blandt andet i Thrakien, Kilikien og Judæa, og den gamle underskrift på brevet i King James-oversættelsen taler om »Nicopolis of Macedonia«; men de fleste fortolkere, som International Standard Bible Encyclopedia, tager Paulus til at mene byen i Epirus, den provinsens hovedby."
    - "Efter at Domitian forviste filosofferne fra Rom, omkring 93–95 e.Kr., slog stoikeren Epiktet sig ned i Nikopolis og underviste dér resten af sit liv; hans elev Arrian nedskrev hans Samtaler. Under Diokletian blev byen hovedstad i provinsen Gamle Epirus. Vandalerne indtog den i 474, og Justinian udbedrede dens mure."
scripture:
  - Titus.1.5
  - Titus.3.12
sources:
  - "Strabo, Geography 7.7.5–6 (Nicopolis founded by Augustus after Actium; the people of the ruined cities settled in it; its numbers increasing daily; the Actian games made more honoured by Caesar)"
