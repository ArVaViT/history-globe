  sv: "Jerusalem"
body:
  en:
    - "Jerusalem lies in the hills of Judah, on the watershed between the Mediterranean and the Dead Sea. People lived beside its spring, the Gihon, from the Early Bronze Age, and Egyptian texts of the second millennium BC already name the city; in the fourteenth century BC its ruler Abdi-Heba wrote to Pharaoh in the Amarna letters. In the Bible it is the city of the Jebusites that David takes and makes his capital, the City of David."
    - "Solomon built the Temple on the hill to the north. Under the kings of Judah the city grew westward. Before Sennacherib's campaign of 701 BC, which both the Assyrian annals and the Bible record, Hezekiah, the Bible says, brought the water of the Gihon into the city through a tunnel, and Jerusalem was not taken. In 587 or 586 BC (the year is disputed) Nebuchadnezzar's army burned the city and the Temple."
    - "Exiles returned under Cyrus in 538 BC; the Second Temple was finished about 516 BC and Nehemiah rebuilt the walls in 445 BC. After Alexander the city passed to the Ptolemies and then the Seleucids, and the Maccabees rededicated the Temple in 164 BC. Herod the Great rebuilt the Temple on a vast platform: this is the Jerusalem of the Gospels and of the first church in Acts."
    - "In AD 70 the army of Titus destroyed the city and the Temple. Hadrian refounded it as the Roman colony of Aelia Capitolina; Cassius Dio makes the foundation a cause of Bar Kokhba's revolt (132-135), while Eusebius places it after the revolt, so the order is disputed. Under Constantine it became a Christian city of pilgrimage, and the Church of the Holy Sepulchre was dedicated in 335."
  ru:
    - "Иерусалим стоит в горах Иудеи, на водоразделе между Средиземным и Мёртвым морем. У его источника Гиона люди жили уже в раннем бронзовом веке, а египетские тексты II тысячелетия до н. э. называют город по имени; в XIV веке до н. э. его правитель Абди-Хеба писал фараону в Амарнских письмах. В Библии это город иевусеев, который Давид берёт и делает своей столицей, городом Давидовым."
    - "Соломон построил Храм на холме к северу. При царях Иудеи город разросся на запад. Перед походом Сеннахирима 701 г. до н. э., о котором рассказывают и ассирийские анналы, и Библия, Езекия, по Библии, провёл воду Гиона в город по тоннелю, и Иерусалим не был взят. В 587 или 586 г. до н. э. (год спорный) войско Навуходоносора сожгло город и Храм."
    - "Изгнанники вернулись при Кире в 538 г. до н. э.; Второй храм был закончен около 516 г. до н. э., а Неемия восстановил стены в 445 г. до н. э. После Александра город перешёл к Птолемеям, затем к Селевкидам, а Маккавеи вновь освятили Храм в 164 г. до н. э. Ирод Великий перестроил Храм на огромной платформе: это Иерусалим Евангелий и первой церкви в Деяниях."
    - "В 70 г. н. э. войско Тита разрушило город и Храм. Адриан основал на его месте римскую колонию Элию Капитолину; по Диону Кассию, это основание стало одной из причин восстания Бар-Кохбы (132–135), а Евсевий относит его ко времени после восстания, так что порядок событий спорен. При Константине Иерусалим стал христианским городом паломничества, а в 335 г. был освящён храм Гроба Господня."
  uk:
    - "Єрусалим лежить у пагорбах Юди, на вододілі між Середземним і Мертвим морями. Люди жили біля його джерела, Гіхон, від раннього бронзового віку, і єгипетські тексти II тисячоліття до н. е. вже називають місто; у XIV ст. до н. е. його правитель Абді-Хеба писав фараонові в амарнських листах. У Біблії це місто євусеїв, яке Давид бере й робить своєю столицею, Містом Давида."
    - "Соломон збудував храм на пагорбі на півночі. За царів Юди місто розросталося на захід. Перед походом Сінаххеріба 701 р. до н. е., який записують і ассирійські аннали, і Біблія, Єзекія, як каже Біблія, провів воду Гіхона в місто тунелем, і Єрусалим не було взято. 587 або 586 р. до н. е. (рік оспорюється) військо Навуходоносора спалило місто і храм."
    - "Вигнанці повернулися за Кіра 538 р. до н. е.; Другий храм було закінчено близько 516 р. до н. е., а Неемія відбудував мури 445 р. до н. е. Після Александра місто перейшло до Птолемеїв, потім до Селевкідів, і Макавеї посвятили храм наново 164 р. до н. е. Ірод Великий відбудував храм на величезній платформі: це Єрусалим Євангелій і першої церкви в Діях."
    - "70 р. н. е. військо Тита зруйнувало місто і храм. Адріан заснував його наново як римську колонію Елія Капітоліна; Кассій Діон робить це заснування причиною повстання Бар-Кохби (132–135), тоді як Євсевій ставить його після повстання, тож порядок оспорюється. За Костянтина воно стало християнським містом прощі, і Церкву Гробу Господнього було освячено 335 року."
  es:
    - "Jerusalén se halla en las colinas de Judá, en la línea divisoria de aguas entre el Mediterráneo y el mar Muerto. La gente vivió junto a su manantial, el Gihón, desde la Edad del Bronce Antiguo, y textos egipcios del segundo milenio a. C. ya nombran la ciudad; en el siglo XIV a. C. su gobernante Abdi-Heba escribió al faraón en las cartas de Amarna. En la Biblia es la ciudad de los jebuseos que David toma y hace su capital, la Ciudad de David."
    - "Salomón construyó el Templo en la colina del norte. Bajo los reyes de Judá la ciudad creció hacia el oeste. Antes de la campaña de Senaquerib del 701 a. C., que registran tanto los anales asirios como la Biblia, Ezequías, dice la Biblia, llevó el agua del Gihón a la ciudad por un túnel, y Jerusalén no fue tomada. En el 587 o 586 a. C. (el año se discute) el ejército de Nabucodonosor incendió la ciudad y el Templo."
    - "Los desterrados volvieron bajo Ciro en el 538 a. C.; el Segundo Templo se terminó hacia el 516 a. C. y Nehemías reconstruyó los muros en el 445 a. C. Después de Alejandro la ciudad pasó a los Ptolomeos y luego a los seléucidas, y los macabeos rededicaron el Templo en el 164 a. C. Herodes el Grande reconstruyó el Templo sobre una vasta plataforma: esta es la Jerusalén de los Evangelios y de la primera Iglesia en Hechos."
    - "En el 70 d. C. el ejército de Tito destruyó la ciudad y el Templo. Adriano la refundó como la colonia romana de Aelia Capitolina; Dión Casio hace de la fundación una causa de la revuelta de Bar Kojba (132-135), mientras que Eusebio la sitúa después de la revuelta, de modo que el orden se discute. Bajo Constantino se convirtió en una ciudad cristiana de peregrinación, y la Iglesia del Santo Sepulcro fue dedicada en el 335."
  pt:
    - "Jerusalém fica nas colinas de Judá, no divisor de águas entre o Mediterrâneo e o mar Morto. Viveu-se junto à sua fonte, o Giom, desde a Idade do Bronze Antigo, e textos egípcios do segundo milênio a.C. já nomeiam a cidade; no século XIV a.C. seu governante Abdi-Heba escreveu ao faraó nas cartas de Amarna. Na Bíblia é a cidade dos jebuseus que Davi toma e faz sua capital, a Cidade de Davi."
    - "Salomão construiu o Templo na colina ao norte. Sob os reis de Judá a cidade cresceu para oeste. Antes da campanha de Senaqueribe de 701 a.C., que tanto os anais assírios como a Bíblia registram, Ezequias, diz a Bíblia, trouxe a água do Giom para dentro da cidade por um túnel, e Jerusalém não foi tomada. Em 587 ou 586 a.C. (o ano é disputado) o exército de Nabucodonosor queimou a cidade e o Templo."
    - "Os exilados voltaram sob Ciro em 538 a.C.; o Segundo Templo foi concluído por volta de 516 a.C. e Neemias reconstruiu as muralhas em 445 a.C. Depois de Alexandre, a cidade passou aos Ptolomeus e depois aos selêucidas, e os macabeus reconsagraram o Templo em 164 a.C. Herodes, o Grande, reconstruiu o Templo sobre uma vasta plataforma: esta é a Jerusalém dos Evangelhos e da primeira igreja em Atos."
    - "Em 70 d.C. o exército de Tito destruiu a cidade e o Templo. Adriano a refundou como a colônia romana de Aelia Capitolina; Dio Cássio faz da fundação uma causa da revolta de Bar Kokhba (132-135), ao passo que Eusébio a põe depois da revolta, de modo que a ordem é disputada. Sob Constantino tornou-se uma cidade cristã de peregrinação, e a Igreja do Santo Sepulcro foi dedicada em 335."
  de:
    - "Jerusalem liegt im Bergland Judas, auf der Wasserscheide zwischen Mittelmeer und Totem Meer. Menschen lebten seit der Frühbronzezeit an seiner Quelle, dem Gihon, und ägyptische Texte des 2. Jahrtausends v. Chr. nennen die Stadt schon; im 14. Jahrhundert v. Chr. schrieb ihr Herrscher Abdi-Heba in den Amarnabriefen an den Pharao. In der Bibel ist es die Stadt der Jebusiter, die David einnimmt und zu seiner Hauptstadt macht, der Stadt Davids."
    - "Salomo baute den Tempel auf dem Hügel im Norden. Unter den Königen von Juda wuchs die Stadt nach Westen. Vor Sanheribs Feldzug von 701 v. Chr., den sowohl die assyrischen Annalen als auch die Bibel bezeugen, leitete Hiskia nach der Bibel das Wasser des Gihon durch einen Tunnel in die Stadt, und Jerusalem wurde nicht eingenommen. 587 oder 586 v. Chr. (das Jahr ist umstritten) verbrannte Nebukadnezars Heer die Stadt und den Tempel."
    - "Unter Kyrus kehrten 538 v. Chr. Verbannte zurück; der Zweite Tempel wurde um 516 v. Chr. vollendet, und Nehemia baute 445 v. Chr. die Mauern wieder auf. Nach Alexander fiel die Stadt an die Ptolemäer und dann an die Seleukiden, und die Makkabäer weihten den Tempel 164 v. Chr. neu. Herodes der Große baute den Tempel auf einer riesigen Plattform neu: Dies ist das Jerusalem der Evangelien und der ersten Gemeinde in der Apostelgeschichte."
    - "Im Jahr 70 n. Chr. zerstörte das Heer des Titus die Stadt und den Tempel. Hadrian gründete sie als römische Kolonie Aelia Capitolina neu; Cassius Dio macht die Gründung zu einer Ursache des Bar-Kochba-Aufstands (132–135), während Eusebius sie nach dem Aufstand ansetzt, sodass die Reihenfolge umstritten ist. Unter Konstantin wurde sie zur christlichen Pilgerstadt, und die Grabeskirche wurde 335 geweiht."
  fr:
    - "Jérusalem se trouve dans les collines de Juda, sur la ligne de partage des eaux entre la Méditerranée et la mer Morte. On vécut près de sa source, le Guihon, dès le Bronze ancien, et des textes égyptiens du IIe millénaire av. J.-C. nomment déjà la ville ; au XIVe siècle av. J.-C., son souverain Abdi-Heba écrivit au pharaon dans les lettres d’Amarna. Dans la Bible, c’est la ville des Jébusiens que David prend et dont il fait sa capitale, la Cité de David."
    - "Salomon bâtit le Temple sur la colline au nord. Sous les rois de Juda, la ville s’étendit vers l’ouest. Avant la campagne de Sanchérib de 701 av. J.-C., que consignent les annales assyriennes comme la Bible, Ézéchias, dit la Bible, fit entrer l’eau du Guihon dans la ville par un tunnel, et Jérusalem ne fut pas prise. En 587 ou 586 av. J.-C. (l’année est débattue), l’armée de Nebucadnetsar brûla la ville et le Temple."
    - "Les exilés revinrent sous Cyrus en 538 av. J.-C. ; le Second Temple fut achevé vers 516 av. J.-C. et Néhémie rebâtit les murs en 445 av. J.-C. Après Alexandre, la ville passa aux Ptolémées puis aux Séleucides, et les Maccabées reconsacrèrent le Temple en 164 av. J.-C. Hérode le Grand rebâtit le Temple sur une vaste plate-forme : c’est la Jérusalem des Évangiles et de la première Église des Actes."
    - "En 70 apr. J.-C., l’armée de Titus détruisit la ville et le Temple. Hadrien la refonda comme colonie romaine d’Aelia Capitolina ; Dion Cassius fait de cette fondation une cause de la révolte de Bar Kokhba (132-135), tandis qu’Eusèbe la place après la révolte, de sorte que l’ordre est débattu. Sous Constantin, elle devint une ville chrétienne de pèlerinage, et l’église du Saint-Sépulcre fut dédiée en 335."
  pl:
    - "Jerozolima leży we wzgórzach Judy, na wododziale między Morzem Śródziemnym a Morzem Martwym. Ludzie mieszkali przy jej źródle, Gichon, od wczesnej epoki brązu, a egipskie teksty z II tysiąclecia p.n.e. już wymieniają miasto; w XIV w. p.n.e. jego władca Abdi-Heba pisał do faraona w listach z Amarna. W Biblii jest to miasto Jebusytów, które Dawid zdobywa i czyni swoją stolicą, Miastem Dawida."
    - "Salomon zbudował Świątynię na wzgórzu na północy. Za królów Judy miasto rozrosło się na zachód. Przed wyprawą Sennacheryba w 701 r. p.n.e., którą odnotowują zarówno roczniki asyryjskie, jak i Biblia, Ezechiasz, jak mówi Biblia, wprowadził wodę Gichonu do miasta tunelem, a Jerozolima nie została zdobyta. W 587 lub 586 r. p.n.e. (rok jest sporny) armia Nabuchodonozora spaliła miasto i Świątynię."
    - "Wygnańcy wrócili za Cyrusa w 538 r. p.n.e.; Druga Świątynia została ukończona około 516 r. p.n.e., a Nehemiasz odbudował mury w 445 r. p.n.e. Po Aleksandrze miasto przeszło do Ptolemeuszy, a potem Seleucydów, a Machabeusze poświęcili Świątynię na nowo w 164 r. p.n.e. Herod Wielki odbudował Świątynię na ogromnej platformie: to Jerozolima Ewangelii i pierwszego Kościoła w Dziejach Apostolskich."
    - "W 70 r. n.e. armia Tytusa zburzyła miasto i Świątynię. Hadrian założył je na nowo jako rzymską kolonię Aelia Capitolina; Kasjusz Dion czyni założenie przyczyną powstania Bar Kochby (132–135), podczas gdy Euzebiusz umieszcza je po powstaniu, więc kolejność jest sporna. Za Konstantyna stało się chrześcijańskim miastem pielgrzymek, a Bazylikę Grobu Pańskiego poświęcono w 335 r."
  it:
    - "Gerusalemme si trova sui monti di Giuda, sullo spartiacque fra il Mediterraneo e il Mar Morto. Si viveva presso la sua sorgente, il Ghicon, fin dal Bronzo Antico, e testi egizi del II millennio a.C. nominano già la città; nel XIV secolo a.C. il suo sovrano Abdi-Heba scrisse al faraone nelle lettere di Amarna. Nella Bibbia è la città dei Gebusei che Davide prende e fa sua capitale, la Città di Davide."
    - "Salomone costruì il Tempio sul colle a nord. Sotto i re di Giuda la città crebbe verso ovest. Prima della campagna di Sennacherib del 701 a.C., che sia gli annali assiri sia la Bibbia registrano, Ezechia, dice la Bibbia, portò l’acqua del Ghicon nella città attraverso un tunnel, e Gerusalemme non fu presa. Nel 587 o 586 a.C. (l’anno è discusso) l’esercito di Nabucodonosor bruciò la città e il Tempio."
    - "Gli esuli tornarono sotto Ciro nel 538 a.C.; il Secondo Tempio fu finito verso il 516 a.C. e Neemia ricostruì le mura nel 445 a.C. Dopo Alessandro la città passò ai Tolomei e poi ai Seleucidi, e i Maccabei riconsacrarono il Tempio nel 164 a.C. Erode il Grande ricostruì il Tempio su un’enorme piattaforma: questa è la Gerusalemme dei Vangeli e della prima Chiesa negli Atti."
    - "Nel 70 d.C. l’esercito di Tito distrusse la città e il Tempio. Adriano la rifondò come colonia romana di Aelia Capitolina; Cassio Dione fa della fondazione una causa della rivolta di Bar Kokheba (132-135), mentre Eusebio la pone dopo la rivolta, così l’ordine è discusso. Sotto Costantino divenne una città cristiana di pellegrinaggio, e la Chiesa del Santo Sepolcro fu dedicata nel 335."
  nl:
    - "Jeruzalem ligt in het bergland van Juda, op de waterscheiding tussen de Middellandse Zee en de Dode Zee. Mensen woonden bij zijn bron, de Gihon, sinds de Vroege Bronstijd, en Egyptische teksten uit het 2e millennium v.Chr. noemen de stad al; in de 14e eeuw v.Chr. schreef haar vorst Abdi-Heba in de brieven van Amarna aan de farao. In de Bijbel is het de stad van de Jebusieten die David inneemt en tot zijn hoofdstad maakt, de Stad van David."
    - "Salomo bouwde de tempel op de heuvel in het noorden. Onder de koningen van Juda groeide de stad naar het westen. Vóór Sanheribs veldtocht van 701 v.Chr., die zowel de Assyrische annalen als de Bijbel vermelden, bracht Chizkia, zegt de Bijbel, het water van de Gihon door een tunnel de stad in, en Jeruzalem werd niet ingenomen. In 587 of 586 v.Chr. (het jaar wordt betwist) verbrandde Nebukadnessars leger de stad en de tempel."
    - "Ballingen keerden terug onder Cyrus in 538 v.Chr.; de Tweede Tempel werd omstreeks 516 v.Chr. voltooid en Nehemia herbouwde de muren in 445 v.Chr. Na Alexander kwam de stad aan de Ptolemaeën en daarna de Seleuciden, en de Makkabeeën wijdden de tempel in 164 v.Chr. opnieuw in. Herodes de Grote herbouwde de tempel op een enorm platform: dit is het Jeruzalem van de evangeliën en van de eerste gemeente in Handelingen."
    - "In 70 n.Chr. vernietigde het leger van Titus de stad en de tempel. Hadrianus stichtte haar opnieuw als de Romeinse kolonie Aelia Capitolina; Cassius Dio maakt van de stichting een oorzaak van Bar Kochba’s opstand (132-135), terwijl Eusebius haar na de opstand plaatst, zodat de volgorde omstreden is. Onder Constantijn werd het een christelijke bedevaartsstad, en de Heilig-Grafkerk werd in 335 ingewijd."
  cs:
    - "Jeruzalém leží v judských horách, na rozvodí mezi Středozemním a Mrtvým mořem. Lidé žili u jeho pramene, Gichónu, od rané doby bronzové a egyptské texty 2. tisíciletí př. n. l. město již jmenují; ve 14. stol. př. n. l. psal jeho vládce Abdi-Heba faraonovi v amarnských dopisech. V Bibli je to město Jebuzejských, které David dobyl a učinil svým hlavním městem, Městem Davidovým."
    - "Šalomoun vystavěl chrám na pahorku na severu. Za judských králů město rostlo na západ. Před Senacheribovým tažením roku 701 př. n. l., které zaznamenávají asyrské anály i Bible, Chizkijáš, praví Bible, přivedl vodu z Gichónu do města tunelem a Jeruzalém nebyl dobyt. Roku 587 nebo 586 př. n. l. (rok je sporný) vojsko Nebukadnesarovo město i chrám spálilo."
    - "Vyhnanci se vrátili za Kýra roku 538 př. n. l.; Druhý chrám byl dokončen asi roku 516 př. n. l. a Nehemjáš vystavěl hradby roku 445 př. n. l. Po Alexandrovi město připadlo Ptolemaiovcům a pak Seleukovcům a Makabejští chrám znovu vysvětili roku 164 př. n. l. Herodes Veliký přestavěl chrám na obrovské plošině: to je Jeruzalém evangelií a první církve ve Skutcích."
    - "Roku 70 n. l. vojsko Titovo zničilo město i chrám. Hadrianus je znovu založil jako římskou kolonii Aelia Capitolina; Cassius Dio činí ze založení příčinu Bar Kochbova povstání (132–135), kdežto Eusebios je klade po povstání, takže pořadí je sporné. Za Konstantina se stalo křesťanským poutním městem a Chrám Božího hrobu byl vysvěcen roku 335."
  sv:
    - "Jerusalem ligger i Judas berg, på vattendelaren mellan Medelhavet och Döda havet. Människor bodde vid dess källa, Gihon, från tidig bronsålder, och egyptiska texter från andra årtusendet f.Kr. nämner redan staden; på 1300-talet f.Kr. skrev dess härskare Avdi-Heba till farao i Amarnabreven. I Bibeln är det jebuséernas stad som David intar och gör till sin huvudstad, Davids stad."
    - "Salomo byggde templet på kullen i norr. Under Judas kungar växte staden västerut. Före Sanheribs fälttåg år 701 f.Kr., som både de assyriska annalerna och Bibeln berättar om, ledde Hiskia, enligt Bibeln, vattnet från Gihon in i staden genom en tunnel, och Jerusalem intogs inte. År 587 eller 586 f.Kr. (året är omstritt) brände Nebukadnessars armé staden och templet."
    - "De landsflyktiga återvände under Kyros år 538 f.Kr.; andra templet blev färdigt omkring 516 f.Kr. och Nehemja byggde upp murarna år 445 f.Kr. Efter Alexander gick staden till ptolemaierna och sedan seleukiderna, och mackabeerna återinvigde templet år 164 f.Kr. Herodes den store byggde om templet på en väldig plattform: detta är evangeliernas Jerusalem och den första församlingens i Apostlagärningarna."
    - "År 70 e.Kr. förstörde Titus armé staden och templet. Hadrianus grundade den på nytt som den romerska kolonin Aelia Capitolina; Cassius Dio gör grundandet till en orsak till Bar Kokhba-upproret (132–135), medan Eusebios placerar det efter upproret, så ordningen är omstridd. Under Konstantin blev den en kristen pilgrimsstad, och Heliga gravens kyrka invigdes år 335."
