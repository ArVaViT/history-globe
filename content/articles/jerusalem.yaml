# Overview article (ADR 0007). Mainstream facts only; disputed datings are named as such.
id: jerusalem
place: a15257a
title:
  en: "Jerusalem"
  ru: "Иерусалим"
  uk: "Єрусалим"
  es: "Jerusalén"
  pt: "Jerusalém"
  de: "Jerusalem"
  fr: "Jérusalem"
  pl: "Jerozolima"
  it: "Gerusalemme"
  nl: "Jeruzalem"
