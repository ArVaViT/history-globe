# Overview article (ADR 0007). Mainstream facts only; present-day figures for the lake are approximate and change from year to year.
id: salt-sea
place: abed304
title:
  en: "Salt Sea"
  ru: "Соленое море"
  uk: "Солоне море"
  es: "Mar Salado"
  pt: "Mar Salgado"
  de: "Salzmeer"
  fr: "Mer Salée"
  it: "Mar Salato"
  pl: "Morze Słone"
  cs: "Slané moře"
  nl: "Zoutzee"
  sv: "Döda havet"
  nb: "Saltsjøen"
  tl: "Dagat na Alat"
  da: "Salthavet"
  sr: "Слано море"
body:
  en:
    - "The Salt Sea of the Bible is the Dead Sea, the lake into which the Jordan flows and from which nothing flows out. Its surface, more than 430 m below the level of the Mediterranean, is the lowest point on land. The water is about ten times saltier than the ocean: no fish live in it, and a swimmer cannot sink. The Bible also calls it the sea of the plain (the Arabah) and the east sea; Greek and Roman writers knew it as the Asphalt Lake, from the lumps of bitumen that rose from its bed, and the name Dead Sea appears in Pausanias in the second century AD. Arabs call it the Sea of Lot."
    - "Genesis first names it when four kings fought five “in the vale of Siddim, which is the salt sea”, full of slimepits of bitumen; Sodom and Gomorrah lay on its plain, and Lot's wife “became a pillar of salt”. In the Law and Joshua the sea is a border: the south border of the land was to be “the outmost coast of the salt sea eastward”, the Jordan's waters flowing down to it “failed, and were cut off” when Israel crossed, and the east border of Judah “was the salt sea, even unto the end of Jordan”. Jeroboam II restored Israel's border “unto the sea of the plain”. The prophets look for its healing: Ezekiel sees a river from the Temple go down into the sea, so that “the waters shall be healed” and fishers stand “from En-gedi even unto En-eglaim”, and Zechariah's living waters flow “toward the former sea”."
    - "The shores carry much history. David hid at En-gedi; Herod built his palaces on Masada, where the last rebels against Rome died in AD 73 or 74; at Qumran, in caves above the north-west shore, the Dead Sea Scrolls were found from 1947. Josephus describes the lake's bitter water and floating bitumen, and tells how Vespasian had men thrown in bound to see whether they would sink. Diodorus says local Arabs gathered the bitumen and sold it in Egypt for embalming. The sixth-century Madaba mosaic map shows two boats on it."
    - "Today the lake is shared by Israel, the West Bank and Jordan. With the Jordan's water diverted and potash works evaporating the shallow southern basin, the surface has been falling by about a metre a year; the Lisan peninsula has become a land bridge, and thousands of sinkholes open along the retreating shore. Where the cities of the plain stood is not known: Early Bronze Age towns at Bab edh-Dhra and Numeira on the south-eastern shore are often named, and a site farther north, Tall el-Hammam, has also been proposed."
  ru:
    - "Соленое море Библии — это Мёртвое море, озеро, в которое впадает Иордан и из которого ничего не вытекает. Его поверхность, более чем на 430 м ниже уровня Средиземного моря, — самая низкая точка суши. Вода примерно в десять раз солонее океанской, так что рыба в ней не живёт, а пловец не может утонуть. Библия зовёт его также морем равнины (Аравы) и морем восточным; греческие и римские авторы знали его как Асфальтовое озеро — по кускам битума, всплывавшим со дна, а имя Мёртвое море встречается у Павсания во II веке н. э. Арабы называют его морем Лота."
    - "Книга Бытия впервые называет его, когда четыре царя сразились с пятью «в долине Сиддим, где ныне море Соленое», полной смоляных ям; на его равнине лежали Содом и Гоморра, а жена Лота «стала соляным столпом». В Законе и у Иисуса Навина это море — граница: южный предел земли шёл «от конца Соленого моря с востока», вода Иордана, текущая к нему, «ушла и иссякла», когда Израиль переходил реку, а пределом Иуды к востоку было «все море Соленое, до устья Иордана». Иеровоам II восстановил пределы Израиля «до моря пустыни». Пророки ждут его исцеления: Иезекииль видит поток из Храма, который войдёт в море, «и воды его сделаются здоровыми», и рыболовов «от Ен-Гадди до Эглаима», а у Захарии живые воды текут «к морю восточному»."
    - "Берега полны истории. Давид скрывался в Ен-Гадди; Ирод построил дворцы на Масаде, где в 73 или 74 г. н. э. погибли последние повстанцы против Рима; в Кумране, в пещерах над северо-западным берегом, с 1947 г. находили свитки Мёртвого моря. Иосиф Флавий описывает горькую воду и плавающий битум и рассказывает, как Веспасиан велел бросить в озеро связанных людей, чтобы проверить, утонут ли они. Диодор пишет, что здешние арабы собирали битум и продавали его в Египет для бальзамирования. Мозаичная карта из Мадабы VI века показывает две лодки, плывущие по морю."
    - "Сегодня озеро делят Израиль, Западный берег и Иордания. С тех пор как воду Иордана отвели, а калийные заводы выпаривают мелкую южную котловину, уровень падает примерно на метр в год; полуостров Лисан стал перешейком, а вдоль отступающего берега открываются тысячи провалов. Где стояли города равнины, неизвестно: часто называют города раннего бронзового века Баб-эд-Дра и Нумейру на юго-восточном берегу, а также предлагали место севернее — Талль-эль-Хаммам."
  uk:
    - "Солоне море Біблії — це Мертве море, озеро, в яке впадає Йордан і з якого нічого не витікає. Його поверхня, понад 430 м нижче рівня Середземного моря, є найнижчою точкою суходолу. Вода приблизно в десять разів солоніша за океанську: риби в ній не живуть, а плавець не може потонути. Біблія називає його також морем рівнини (Арави) і східним морем; грецькі й римські автори знали його як Асфальтове озеро, від грудок бітуму, що здіймалися з його дна, а назва Мертве море з'являється в Павсанія у II ст. н. е. Араби називають його морем Лота."
    - "Буття вперше згадує його, коли чотири царі билися з п'ятьма «на Сиддим-долинї, се єсть теперенькі Море Солоне», повній бітумних ям; Содом і Гоморра лежали на його рівнині, а дружина Лота «обернулась у стовна соляного». У Законі й у книзі Ісуса Навина море є межею: південна межа землі мала йти «від краю Соляного моря на схід соньця», води Йордану, що стікали до нього, «стекла зовсїм», коли Ізраїль переходив, а східна межа Юди була «Солоне море, аж до вʼустя Йорданї». Єровоам II відновив межі Ізраїля «аж до Степового моря». Пророки чекають його оздоровлення: Єзекіїль бачить річку, що тече від храму в море, так що «зробляться води його здоровими» і рибалки стоять «від Енгадди до Еглайму», а живі води Захарії течуть «у море на всхід»."
    - "Береги несуть багато історії. Давид переховувався в Ен-Геді; Ірод збудував свої палаци на Масаді, де 73 або 74 р. н. е. загинули останні повстанці проти Рима; у Кумрані, в печерах над північно-західним берегом, з 1947 р. знайдено сувої Мертвого моря. Йосиф Флавій описує гірку воду озера й плаваючий бітум і розповідає, як Веспасіан звелів кинути в нього зв'язаних людей, щоб побачити, чи потонуть вони. Діодор каже, що місцеві араби збирали бітум і продавали його в Єгипті для бальзамування. Мадабська мозаїчна карта VI ст. показує на ньому два човни."
    - "Нині озеро ділять Ізраїль, Західний берег і Йорданія. Через відведення води Йордану та калійні підприємства, що випаровують мілку південну улоговину, поверхня опускається приблизно на метр на рік; півострів Лісан став сухопутним мостом, а вздовж берега, що відступає, відкриваються тисячі провалів. Де стояли міста рівнини, невідомо: часто називають міста раннього бронзового віку Баб-ед-Дра і Нумейра на південно-східному березі, а також запропоновано місце далі на північ, Телль-ель-Хаммам."
  es:
    - "El Mar Salado de la Biblia es el mar Muerto, el lago en el que desemboca el Jordán y del que no sale nada. Su superficie, a más de 430 m por debajo del nivel del Mediterráneo, es el punto más bajo en tierra firme. El agua es unas diez veces más salada que la del océano: no vive en ella ningún pez, y un nadador no puede hundirse. La Biblia lo llama también mar de la llanura (el Arabá) y mar oriental; los escritores griegos y romanos lo conocían como el lago Asfaltites, por los terrones de betún que subían de su lecho, y el nombre de mar Muerto aparece en Pausanias en el siglo II d. C. Los árabes lo llaman el Mar de Lot."
    - "El Génesis lo nombra por primera vez cuando cuatro reyes lucharon contra cinco «en el valle de Siddim, que es el mar salado», lleno de «pozos de betún»; Sodoma y Gomorra estaban en su llanura, y la mujer de Lot «se volvió estatua de sal». En la Ley y en Josué el mar es una frontera: el límite sur del país había de ser «al extremo del mar salado hacia el oriente», las aguas del Jordán que descendían hasta él «se acabaron y fueron partidas» cuando Israel cruzó, y el límite oriental de Judá «es el mar Salado hasta el fin del Jordán». Jeroboam II restituyó los términos de Israel «hasta la mar de la llanura». Los profetas esperan su sanación: Ezequiel ve un río del templo bajar al mar, de modo que «recibirán sanidad las aguas» y los pescadores estarán «desde En-gadi hasta En-eglaim», y las aguas vivas de Zacarías corren «hacia la mar oriental»."
    - "Las orillas guardan mucha historia. David se ocultó en Engadi; Herodes construyó sus palacios en Masada, donde murieron los últimos rebeldes contra Roma en 73 o 74 d. C.; en Qumrán, en cuevas sobre la orilla noroeste, se hallaron desde 1947 los Rollos del mar Muerto. Josefo describe el agua amarga del lago y el betún flotante, y cuenta cómo Vespasiano hizo arrojar a hombres atados para ver si se hundían. Diodoro dice que los árabes de la zona recogían el betún y lo vendían en Egipto para el embalsamamiento. El mapa de mosaico de Madaba, del siglo VI, muestra dos barcas en él."
    - "Hoy el lago es compartido por Israel, Cisjordania y Jordania. Con el agua del Jordán desviada y las plantas de potasa evaporando la cuenca meridional poco profunda, la superficie ha ido bajando cerca de un metro al año; la península de Lisán se ha convertido en un puente de tierra, y miles de dolinas se abren a lo largo de la orilla en retirada. Dónde estaban las ciudades de la llanura no se sabe: suelen nombrarse las ciudades del Bronce Antiguo de Bab edh-Dhra y Numeira en la orilla suroriental, y también se ha propuesto un lugar más al norte, Tall el-Hammam."
  pt:
    - "O Mar Salgado da Bíblia é o Mar Morto, o lago em que o Jordão deságua e do qual nada sai. Sua superfície, a mais de 430 m abaixo do nível do Mediterrâneo, é o ponto mais baixo em terra. A água é cerca de dez vezes mais salgada que a do oceano: nenhum peixe vive nela, e um nadador não afunda. A Bíblia também o chama mar da planície (a Arabá) e mar oriental; escritores gregos e romanos o conheciam como Lago Asfaltites, pelos blocos de betume que subiam de seu leito, e o nome Mar Morto aparece em Pausânias no século II d.C. Os árabes o chamam Mar de Ló."
    - "O Gênesis o nomeia pela primeira vez quando quatro reis lutaram contra cinco “no vale de Sidim (também chamado de Mar Salgado)”, cheio de poços de betume; Sodoma e Gomorra ficavam em sua planície, e a mulher de Ló “tornou-se uma estátua de sal”. Na Lei e em Josué o mar é uma fronteira: a fronteira sul da terra seria “a extremidade do Mar Salgado, para o leste”, as águas do Jordão que desciam até ele “foram totalmente cortadas” quando Israel atravessou, e a fronteira leste de Judá “era o Mar Salgado, até a foz do Jordão”. Jeroboão II restaurou a fronteira de Israel “até o mar da Arabá”. Os profetas esperam sua cura: Ezequiel vê um rio sair do Templo e descer ao mar, de modo que “as águas serão curadas” e pescadores estarão ali “Desde En-Gedi até En-Eglaim”, e as águas vivas de Zacarias correm “para o mar oriental”."
    - "As margens carregam muita história. Davi se escondeu em En-Gedi; Herodes construiu seus palácios em Massada, onde os últimos rebeldes contra Roma morreram em 73 ou 74 d.C.; em Qumran, em cavernas acima da margem noroeste, os Manuscritos do Mar Morto foram achados a partir de 1947. Josefo descreve a água amarga do lago e o betume flutuante, e conta como Vespasiano mandou lançar homens atados para ver se afundariam. Diodoro diz que árabes locais colhiam o betume e o vendiam no Egito para o embalsamamento. O mapa-mosaico de Madaba, do século VI, mostra dois barcos nele."
    - "Hoje o lago é partilhado por Israel, Cisjordânia e Jordânia. Com a água do Jordão desviada e as fábricas de potassa evaporando a bacia sul, rasa, a superfície vem baixando cerca de um metro por ano; a península de Lisan virou uma ponte de terra, e milhares de dolinas se abrem ao longo da margem que recua. Onde ficavam as cidades da planície não se sabe: cidades do Bronze Antigo em Bab edh-Dhra e Numeira, na margem sudeste, são muitas vezes citadas, e um local mais ao norte, Tall el-Hammam, também foi proposto."
  de:
    - "Das Salzmeer der Bibel ist das Tote Meer, der See, in den der Jordan mündet und aus dem nichts abfließt. Seine Oberfläche, mehr als 430 m unter dem Spiegel des Mittelmeers, ist der tiefste Punkt auf dem Land. Das Wasser ist etwa zehnmal salziger als der Ozean: Kein Fisch lebt darin, und ein Schwimmer kann nicht untergehen. Die Bibel nennt es auch das Meer der Ebene (der Araba) und das östliche Meer; griechische und römische Autoren kannten es als Asphaltsee, nach den Erdpechklumpen, die vom Grund aufstiegen, und der Name Totes Meer erscheint bei Pausanias im 2. Jahrhundert n. Chr. Die Araber nennen es das Meer Lots."
    - "Die Genesis nennt es zuerst beim Kampf von vier Königen gegen fünf, die „in das Tal Siddim, wo nun das Salzmeer ist“ kamen, voller Erdpechgruben; Sodom und Gomorra lagen in seiner Ebene, und Lots Frau „ward zur Salzsäule“. In Gesetz und Josua ist das Meer eine Grenze: Die Südgrenze sollte „vom Ende des Salzmeeres, das gegen Morgen liegt“ verlaufen, das Wasser des Jordan, das hinunterlief, „zum Salzmeer, das nahm ab und verfloß“, als Israel hindurchzog, und die Ostgrenze Judas „ist das Salzmeer bis an des Jordans Ende“. Jerobeam II. stellte Israels Gebiet wieder her „bis an das Meer, das im blachen Felde liegt“. Die Propheten erwarten seine Heilung: Hesekiel sieht einen Strom vom Tempel ins Meer fließen, sodass „desselben Wasser gesund werden“ und Fischer stehen „von Engedi bis zu En-Eglaim“, und Sacharjas lebendige Wasser fließen „die Hälfte zum Meer gegen Morgen“."
    - "Die Ufer tragen viel Geschichte. David versteckte sich in En-Gedi; Herodes baute seine Paläste auf Masada, wo die letzten Aufständischen gegen Rom 73 oder 74 n. Chr. starben; in Qumran, in Höhlen über dem Nordwestufer, wurden ab 1947 die Schriftrollen vom Toten Meer gefunden. Josephus beschreibt das bittere Wasser des Sees und das schwimmende Erdpech und erzählt, wie Vespasian gefesselte Männer hineinwerfen ließ, um zu sehen, ob sie sinken würden. Diodor sagt, ortsansässige Araber hätten das Erdpech gesammelt und in Ägypten für die Einbalsamierung verkauft. Die Madaba-Mosaikkarte des 6. Jahrhunderts zeigt zwei Boote darauf."
    - "Heute teilen sich Israel, das Westjordanland und Jordanien den See. Da das Wasser des Jordan abgeleitet wird und Kaliwerke das flache Südbecken verdunsten lassen, sinkt der Spiegel um etwa einen Meter im Jahr; die Lisan-Halbinsel ist zur Landbrücke geworden, und Tausende Erdfälle öffnen sich am zurückweichenden Ufer. Wo die Städte der Ebene standen, ist unbekannt: Oft genannt werden frühbronzezeitliche Städte bei Bab edh-Dhra und Numeira am Südostufer, vorgeschlagen wurde auch Tall el-Hammam weiter nördlich."
  fr:
    - "La mer Salée de la Bible est la mer Morte, le lac où se jette le Jourdain et d’où rien ne sort. Sa surface, à plus de 430 m sous le niveau de la Méditerranée, est le point le plus bas des terres émergées. L’eau est environ dix fois plus salée que celle de l’océan : aucun poisson n’y vit, et un nageur ne peut y couler. La Bible l’appelle aussi mer de la plaine (l’Araba) et mer orientale ; les auteurs grecs et romains la connaissaient comme le lac Asphaltite, d’après les blocs de bitume qui montaient de son fond, et le nom de mer Morte paraît chez Pausanias au IIe siècle apr. J.-C. Les Arabes l’appellent mer de Lot."
    - "La Genèse la nomme d’abord quand quatre rois en combattirent cinq « dans la vallée de Siddim, qui est la mer Salée », couverte de puits de bitume ; Sodome et Gomorrhe étaient dans sa plaine, et la femme de Lot « devint une statue de sel ». Dans la Loi et chez Josué, la mer est une frontière : la limite sud devait partir de « l’extrémité de la mer Salée, vers l’orient », les eaux du Jourdain qui y descendaient « furent complètement coupées » quand Israël passa, et la limite orientale de Juda « était la mer Salée jusqu’à l’embouchure du Jourdain ». Jéroboam II rétablit la frontière « jusqu’à la mer de la plaine ». Les prophètes attendent sa guérison : Ézéchiel voit un fleuve du Temple descendre dans la mer, dont « les eaux … deviendront saines », et des pêcheurs « depuis En-Guédi jusqu’à En-Églaïm » ; les eaux vives de Zacharie coulent « vers la mer orientale »."
    - "Les rivages portent beaucoup d’histoire. David se cacha à En-Guédi ; Hérode bâtit ses palais à Massada, où les derniers rebelles contre Rome moururent en 73 ou 74 apr. J.-C. ; à Qumrân, dans des grottes au-dessus de la rive nord-ouest, les manuscrits de la mer Morte furent trouvés à partir de 1947. Flavius Josèphe décrit l’eau amère du lac et le bitume flottant, et raconte comment Vespasien fit jeter des hommes liés pour voir s’ils couleraient. Diodore dit que des Arabes de la région recueillaient le bitume et le vendaient en Égypte pour l’embaumement. La carte de mosaïque de Madaba, du VIe siècle, y montre deux barques."
    - "Aujourd’hui, le lac est partagé entre Israël, la Cisjordanie et la Jordanie. Les eaux du Jourdain étant détournées et des usines de potasse faisant évaporer le bassin sud peu profond, la surface baisse d’environ un mètre par an ; la péninsule du Lisan est devenue un pont de terre, et des milliers de dolines s’ouvrent le long du rivage qui recule. On ignore où se trouvaient les villes de la plaine : des villes du Bronze ancien à Bab edh-Dhra et Numeira, sur la rive sud-est, sont souvent citées, et un site plus au nord, Tall el-Hammam, a aussi été proposé."
  it:
    - "Il Mar Salato della Bibbia è il Mar Morto, il lago in cui sfocia il Giordano e dal quale non esce nulla. La sua superficie, più di 430 m sotto il livello del Mediterraneo, è il punto più basso sulla terraferma. L’acqua è circa dieci volte più salata dell’oceano: non vi vivono pesci e un nuotatore non può affondare. La Bibbia lo chiama anche mare della pianura (l’Araba) e mare orientale; gli scrittori greci e romani lo conoscevano come Lago Asfaltite, dai blocchi di bitume che salivano dal suo fondo, e il nome Mar Morto compare in Pausania nel II secolo d.C. Gli Arabi lo chiamano Mare di Lot."
    - "La Genesi lo nomina quando quattro re combatterono contro cinque «nella valle di Siddim, ch’è il Mar salato», piena di pozzi di bitume; Sodoma e Gomorra stavano nella sua pianura, e la moglie di Lot «diventò una statua di sale». Nella Legge e in Giosuè il mare è un confine: il limite meridionale doveva partire «dalla estremità del mar Salato, verso oriente», le acque del Giordano che vi scendevano «furono interamente separate da esse» quando Israele attraversò, e il confine orientale di Giuda era «il mar Salato, sino alla foce del Giordano». Geroboamo II ristabilì i confini d’Israele «al mare della pianura». I profeti ne attendono la guarigione: Ezechiele vede un fiume uscire dal Tempio e scendere nel mare, così che «le acque del mare saran rese sane» e pescatori stiano «da En-ghedi fino ad En-eglaim», e le acque vive di Zaccaria vanno «verso il mare orientale»."
    - "Le rive portano molta storia. Davide si nascose a En-Ghedi; Erode costruì i suoi palazzi a Masada, dove gli ultimi ribelli contro Roma morirono nel 73 o 74 d.C.; a Qumran, nelle grotte sopra la riva nord-occidentale, dal 1947 furono trovati i Rotoli del Mar Morto. Giuseppe Flavio descrive l’acqua amara del lago e il bitume galleggiante, e racconta come Vespasiano fece gettare uomini legati per vedere se sarebbero affondati. Diodoro dice che gli Arabi del luogo raccoglievano il bitume e lo vendevano in Egitto per l’imbalsamazione. La mappa musiva di Madaba del VI secolo vi mostra due barche."
    - "Oggi il lago è condiviso da Israele, Cisgiordania e Giordania. Con l’acqua del Giordano deviata e le saline di potassio che fanno evaporare il bacino meridionale poco profondo, la superficie scende di circa un metro l’anno; la penisola di Lisan è diventata un ponte di terra, e migliaia di voragini si aprono lungo la riva in ritirata. Dove sorgessero le città della pianura non si sa: si nominano spesso le città dell’età del Bronzo Antico di Bab edh-Dhra e Numeira sulla riva sud-orientale, ed è stato proposto anche un sito più a nord, Tall el-Hammam."
  pl:
    - "Morze Słone Biblii to Morze Martwe, jezioro, do którego wpada Jordan i z którego nic nie wypływa. Jego powierzchnia, ponad 430 m poniżej poziomu Morza Śródziemnego, jest najniższym punktem na lądzie. Woda jest około dziesięć razy bardziej słona niż w oceanie: nie żyją w niej ryby, a pływak nie może zatonąć. Biblia nazywa je też morzem Araby i morzem wschodnim; pisarze greccy i rzymscy znali je jako Jezioro Asfaltowe, od brył bitumu wynurzających się z dna, a nazwa Morze Martwe pojawia się u Pauzaniasza w II wieku n.e. Arabowie nazywają je Morzem Lota."
    - "Księga Rodzaju wymienia je po raz pierwszy, gdy czterej królowie walczyli z pięcioma „w dolinę Syddym, ta jest teraz morzem słonem”, pełną dołów z bitumem; Sodoma i Gomora leżały na jego równinie, a żona Lota „obróciła się w słup solny”. W Prawie i u Jozuego morze jest granicą: południowa granica kraju miała iść „od brzegu morza słonego na wschód słońca”, wody Jordanu płynące ku niemu, gdy Izrael przechodził, „zginęły i ustały”, a wschodnia granica Judy „jest morze słone aż do końca Jordanu”. Jeroboam II przywrócił granicę Izraela „aż do morza pustego”. Prorocy oczekują jego uzdrowienia: Ezechiel widzi rzekę od Świątyni schodzącą do morza, tak że „uzdrowione bywają wody” i rybacy staną „od Engaddy aż do zdroju Eglaim”, a żywe wody Zachariasza płyną „do morza na wschód słońca”."
    - "Brzegi niosą wiele historii. Dawid ukrywał się w En-Gedi; Herod zbudował swoje pałace na Masadzie, gdzie ostatni buntownicy przeciw Rzymowi zginęli w 73 lub 74 roku n.e.; w Qumran, w jaskiniach nad północno-zachodnim brzegiem, od 1947 roku znaleziono Zwoje znad Morza Martwego. Józef Flawiusz opisuje gorzką wodę jeziora i pływający bitum i opowiada, jak Wespazjan kazał wrzucić do niego związanych ludzi, by zobaczyć, czy zatoną. Diodor mówi, że miejscowi Arabowie zbierali bitum i sprzedawali go w Egipcie do balsamowania. Mozaikowa mapa z Madaby z VI wieku pokazuje na nim dwie łodzie."
    - "Dziś jezioro dzielą Izrael, Zachodni Brzeg i Jordania. Wobec odprowadzania wody Jordanu i zakładów potażu odparowujących płytką południową nieckę powierzchnia obniża się o około metr rocznie; półwysep Lisan stał się mostem lądowym, a wzdłuż cofającego się brzegu otwierają się tysiące zapadlisk. Gdzie stały miasta równiny, nie wiadomo: często wymienia się miasta z wczesnej epoki brązu w Bab ed-Dhra i Numejra na południowo-wschodnim brzegu, a proponowano też stanowisko dalej na północ, Tall el-Hammam."
  cs:
    - "Slané moře Bible je Mrtvé moře, jezero, do něhož Jordán vtéká a z něhož nic nevytéká. Jeho hladina, více než 430 m pod úrovní Středozemního moře, je nejnižším bodem na souši. Voda je asi desetkrát slanější než oceán: nežijí v ní ryby a plavec se nepotopí. Bible je nazývá také mořem Araby a východním mořem; řečtí a římští spisovatelé je znali jako Asfaltové jezero podle hrud asfaltu, které vystupovaly z jeho dna, a jméno Mrtvé moře se objevuje u Pausania ve 2. století n. l. Arabové mu říkají Lotovo moře."
    - "Genesis je poprvé jmenuje, když čtyři králové bojovali s pěti „v údolí Siddim, to jest již moře solné“, plném asfaltových jam; Sodoma a Gomora ležely na jeho rovině a Lotova žena „obrácena jest v sloup solný“. V Zákoně a v Jozuovi je moře hranicí: jižní hranice země měla být „od břehu moře slaného k východu“, vody Jordánu tekoucí k němu „sešly a sběhly“, když Izrael přecházel, a východní hranice Judy „jest moře slané, až k kraji Jordánu“. Jarobeám II. obnovil hranici Izraele „až k moři pustému“. Proroci hledí k jeho uzdravení: Ezechiel vidí řeku z Chrámu, jak sestupuje do moře, takže „opraví se vody“, a rybáři se postaví „od Engadi až do studnice Eglaim“, a Zacharjášovy živé vody tečou „k moři východnímu“."
    - "Břehy nesou mnoho dějin. David se ukrýval v En-gedi; Herodes vystavěl své paláce na Masadě, kde poslední rebelové proti Římu zemřeli roku 73 nebo 74 n. l.; v Kumránu, v jeskyních nad severozápadním břehem, byly od roku 1947 nalezeny svitky od Mrtvého moře. Josephus popisuje hořkou vodu jezera a plovoucí asfalt a vypráví, jak Vespasianus dal svázané muže hodit do vody, aby viděl, zda se potopí. Diodóros praví, že místní Arabové asfalt sbírali a prodávali v Egyptě k balzamování. Madabská mozaiková mapa z 6. století na něm ukazuje dvě lodě."
    - "Dnes jezero sdílejí Izrael, Západní břeh a Jordánsko. S odkloněnou vodou Jordánu a potašovými závody vypařujícími mělkou jižní pánev klesá hladina asi o metr ročně; poloostrov Lisan se stal pozemním mostem a podél ustupujícího břehu se otevírají tisíce propadlin. Kde stála města roviny, není známo: často se jmenují města rané doby bronzové Báb ad-Dhrá a Numejra na jihovýchodním břehu a navrženo bylo i místo dále na sever, Tall el-Hammám."
  nl:
    - "De Zoutzee van de Bijbel is de Dode Zee, het meer waarin de Jordaan uitmondt en waaruit niets wegstroomt. Het oppervlak, ruim 430 m onder het niveau van de Middellandse Zee, is het laagste punt op het land. Het water is ongeveer tien keer zouter dan de oceaan: er leeft geen vis in, en een zwemmer kan niet zinken. De Bijbel noemt het ook de zee van het vlakke veld (de Araba) en de oostzee; Griekse en Romeinse schrijvers kenden het als het Asfaltmeer, naar de brokken bitumen die van de bodem opstegen, en de naam Dode Zee komt bij Pausanias in de 2e eeuw n.Chr. voor. Arabieren noemen het de Zee van Lot."
    - "Genesis noemt het eerst wanneer vier koningen tegen vijf vochten “in het dal Siddim, dat is de Zoutzee”, vol lijmputten van bitumen; Sodom en Gomorra lagen op zijn vlakte, en Lots vrouw “werd een zoutpilaar”. In de Wet en bij Jozua is de zee een grens: de zuidgrens van het land zou zijn “het einde der Zoutzee tegen het oosten”, de wateren van de Jordaan die erheen stroomden “vergingen, zij werden afgesneden” toen Israël overtrok, en de oostgrens van Juda zou “de Zoutzee zijn, tot aan het uiterste van de Jordaan”. Jerobeam II herstelde Israëls grens “tot aan de zee van het vlakke veld”. De profeten zien uit naar haar genezing: Ezechiël ziet een rivier uit de tempel naar de zee afdalen: “in de zee uitgebracht zijnde, zo worden de wateren gezond”, en vissers staan “van En-gedi aan tot En-eglaim toe”, en Zacharia’s levende wateren vloeien “naar de oostzee”."
    - "De oevers dragen veel geschiedenis. David verborg zich te En-Gedi; Herodes bouwde zijn paleizen op Masada, waar de laatste rebellen tegen Rome in 73 of 74 n.Chr. stierven; te Qumran, in grotten boven de noordwestoever, werden vanaf 1947 de Dode Zee-rollen gevonden. Josephus beschrijft het bittere water van het meer en het drijvende bitumen, en vertelt hoe Vespasianus mannen geboeid erin liet gooien om te zien of ze zouden zinken. Diodorus zegt dat plaatselijke Arabieren het bitumen verzamelden en in Egypte verkochten voor het balsemen. De Madaba-mozaïekkaart uit de 6e eeuw toont er twee boten op."
    - "Tegenwoordig wordt het meer gedeeld door Israël, de Westelijke Jordaanoever en Jordanië. Nu het water van de Jordaan wordt omgeleid en potasfabrieken het ondiepe zuidelijke bekken laten verdampen, daalt het oppervlak ongeveer een meter per jaar; het schiereiland Lisan is een landbrug geworden, en duizenden sinkholes openen zich langs de terugwijkende oever. Waar de steden van de vlakte stonden, is niet bekend: steden uit de vroege bronstijd bij Bab edh-Dhra en Numeira aan de zuidoostoever worden vaak genoemd, en een plaats verder noordelijk, Tall el-Hammam, is ook voorgesteld."
  sv:
    - "Salthavet i Bibeln är Döda havet, sjön som Jordan rinner ut i och som ingenting rinner ut ur. Dess yta, mer än 430 m under Medelhavets nivå, är den lägsta punkten på land. Vattnet är ungefär tio gånger saltare än oceanen: inga fiskar lever i det, och en simmare kan inte sjunka. Bibeln kallar det också havet i slätten (Arava) och östra havet; grekiska och romerska författare kände det som Asfaltsjön, efter de klumpar av bitumen som steg från dess botten, och namnet Döda havet förekommer hos Pausanias på 100-talet e.Kr. Araber kallar det Lots hav."
    - "Första Mosebok nämner det första gången när fyra kungar stred mot fem i Siddimsdalen, ”där Salthavet nu är”, full av jordbecksgropar; Sodom och Gomorra låg på dess slätt, och när Lots hustru såg sig tillbaka, ”då blev hon en saltstod”. I lagen och Josua är havet en gräns: landets södra gräns skulle ”i öster begynna vid ändan av Salthavet”, det vatten från Jordan som flöt ned till det ”blev sålunda helt och hållet avskuret” när Israel gick över, och om Judas östra gräns heter det: ”Gränsen i öster var Salthavet ända till Jordans utlopp”. Jerobeam II återvann Israels gräns ”ända till Hedmarkshavet”. Profeterna väntar dess läkedom: Hesekiel ser en flod från templet gå ned i havet, och ”så bliver vattnet där sunt”, och fiskare ska stå ”från En-Gedi ända till En-Eglaim”, och Sakarjas levande vatten flyter ”mot Östra havet”."
    - "Stränderna bär mycket historia. David gömde sig vid En-Gedi; Herodes byggde sina palats på Masada, där de sista rebellerna mot Rom dog år 73 eller 74 e.Kr.; vid Qumran, i grottor ovanför nordvästra stranden, hittades Dödahavsrullarna från 1947. Josefus beskriver sjöns bittra vatten och flytande bitumen och berättar hur Vespasianus lät kasta bundna män i för att se om de skulle sjunka. Diodoros säger att lokala araber samlade bitumen och sålde den i Egypten för balsamering. Madabamosaikkartan från 500-talet visar två båtar på den."
    - "I dag delas sjön av Israel, Västbanken och Jordanien. Med Jordans vatten avlett och kaliumverk som avdunstar det grunda södra bäckenet sjunker ytan med omkring en meter om året; Lisanhalvön har blivit en landbrygga, och tusentals sjunkhål öppnar sig längs den tillbakadragande stranden. Var slättens städer låg är inte känt: tidigbronsåldersstäder vid Bab edh-Dhra och Numeira på sydöstra stranden nämns ofta, och en plats längre norrut, Tall el-Hammam, har också föreslagits."
  nb:
    - "Bibelens Saltsjø er Dødehavet, innsjøen som Jordan renner inn i og som ingenting renner ut av. Overflaten, mer enn 430 m under Middelhavets nivå, er det laveste punktet på land. Vannet er omtrent ti ganger saltere enn havet: ingen fisk lever i det, og en svømmer kan ikke synke. Bibelen kaller det også havet på sletten (Arava) og østhavet; greske og romerske forfattere kjente det som Asfaltsjøen, etter klumpene av bitumen som steg fra bunnen, og navnet Dødehavet forekommer hos Pausanias på 100-tallet e.Kr. Araberne kaller det Lots hav."
    - "1. Mosebok nevner det først da fire konger kjempet mot fem i «Siddim-dalen, der hvor Salthavet nu er», full av gjørmegroper av bitumen; Sodoma og Gomorra lå på sletten, og Lots hustru «blev [...] til en saltstøtte». I loven og Josva er havet en grense: landets sørgrense skulle begynne «ved enden av Salthavet» i øst, Jordans vann som rant ned til det «løp helt bort» da Israel krysset, og Judas østgrense «var Salthavet inntil Jordans utløp». Jeroboam II gjenvant Israels grense «like til Ødemarks-havet». Profetene ser fram til at det helbredes: Esekiel ser en elv fra tempelet gå ned i havet, slik at «vannet der [blir] sundt» og fiskere står «fra En-Gedi til En-Egla'im», og Sakarjas levende vann strømmer «til havet i øst»."
    - "Strandene bærer mye historie. David skjulte seg i En-Gedi; Herodes bygde palassene sine på Masada, der de siste opprørerne mot Roma døde i 73 eller 74 e.Kr.; ved Qumran, i huler over nordvestkysten, ble Dødehavsrullene funnet fra 1947. Josefus beskriver innsjøens bitre vann og flytende bitumen og forteller hvordan Vespasian lot menn kaste i bundet for å se om de ville synke. Diodoros sier at lokale arabere samlet bitumenet og solgte det i Egypt til balsamering. Madaba-mosaikkartet fra 500-tallet viser to båter på det."
    - "I dag deles innsjøen av Israel, Vestbredden og Jordan. Med Jordans vann avledet og pottaskeverk som fordamper det grunne sørlige bassenget, har overflaten sunket omtrent en meter i året; Lisan-halvøya er blitt en landbro, og tusenvis av synkehull åpner seg langs den trekkende kysten. Hvor slettens byer lå, er ikke kjent: tidligbronsealderbyene ved Bab edh-Dhra og Numeira på sørøstkysten nevnes ofte, og et sted lenger nord, Tall el-Hammam, er også foreslått."
  tl:
    - "Ang Dagat na Alat ng Bibliya ay ang Dagat na Patay, ang lawang pinag-aagusan ng Jordan at walang inaagusan palabas. Ang ibabaw nito, higit sa 430 m sa ibaba ng antas ng Mediteraneo, ang pinakamababang punto sa lupa. Mga sampung beses na mas maalat ang tubig kaysa sa karagatan: walang isdang nabubuhay rito, at hindi lulubog ang manlalangoy. Tinatawag din ito ng Bibliya na dagat ng kapatagan (ang Araba) at ang silangang dagat; kilala ito ng mga manunulat na Griyego at Romano bilang Lawa ng Aspalto, mula sa mga bukol ng bitumen na umaangat mula sa ilalim nito, at lumilitaw ang pangalang Dagat na Patay kay Pausanias noong ika-2 siglo AD. Tinatawag ito ng mga Arabe na Dagat ni Lot."
    - "Unang binanggit ito ng Genesis sa labanan ng apat na hari at lima “sa libis ng Siddim (na siyang Dagat na Alat)”, na puno ng hukay ng bitumen; sa kapatagan nito ang Sodoma at Gomorra, at ang asawa ni Lot ay “naging haliging asin”. Hangganan ito sa Kautusan at Josue: ang timog na hangganan ay “mula sa dulo ng Dagat na Alat sa dakong silanganan”, ang tubig ng Jordan ay “lubos na nahawi” nang tumawid ang Israel, at ang silangang hangganan ng Juda ay “ang Dagat na Alat, hanggang sa katapusan ng Jordan”. Ibinalik ni Jeroboam II ang hangganan ng Israel “hanggang sa dagat ng Araba”. Inaasahan ng mga propeta ang paggaling nito: nakita ni Ezekiel ang ilog ng Templo pababa sa dagat, kaya “ang tubig ay mapagagaling” at nakatayo ang mangingisda “mula sa En-gedi hanggang sa En-eglaim”, at dumadaloy ang buhay na tubig ni Zacarias “sa dakong dagat silanganan”."
    - "Maraming kasaysayan ang nasa mga baybayin. Nagtago si David sa En-gedi; itinayo ni Herodes ang kaniyang mga palasyo sa Masada, kung saan namatay ang mga huling rebelde laban sa Roma noong AD 73 o 74; sa Qumran, sa mga yungib sa itaas ng hilagang-kanlurang baybayin, natagpuan ang Mga Balumbon ng Dagat na Patay mula 1947. Inilalarawan ni Josephus ang mapait na tubig ng lawa at lumulutang na bitumen, at isinasalaysay kung paano ipinatapon ni Vespasiano ang mga taong nakagapos upang makita kung lulubog sila. Sinasabi ni Diodoro na kinukuha ng mga lokal na Arabe ang bitumen at ibinebenta ito sa Egipto para sa pag-eembalsamo. Ipinakikita ng mapa ng mosaiko ng Madaba noong ika-6 na siglo ang dalawang bangka rito."
    - "Ngayon, pinagsasaluhan ng Israel, West Bank at Jordan ang lawa. Dahil inilihis ang tubig ng Jordan at pinasingaw ng mga gawaan ng potash ang mababaw na timog na palanggana, bumababa ang ibabaw nang mga isang metro bawat taon; naging tulay na lupa ang tangway ng Lisan, at libu-libong sinkhole ang bumubukas sa tabi ng umuurong na baybayin. Hindi alam kung saan nakatayo ang mga lungsod ng kapatagan: madalas pangalanan ang mga bayan ng Maagang Panahong Tanso sa Bab edh-Dhra at Numeira sa timog-silangang baybayin, at iminungkahi rin ang isang lugar na mas hilaga, ang Tall el-Hammam."
  da:
    - "Bibelens Salthav er Det Døde Hav, søen som Jordan løber ud i, og hvorfra intet løber ud. Dets overflade, mere end 430 m under Middelhavets niveau, er det laveste punkt på land. Vandet er omkring ti gange saltere end oceanet: ingen fisk lever i det, og en svømmer kan ikke synke. Bibelen kalder det også havet ved sletten (Araba) og det østre hav; græske og romerske forfattere kendte det som Asfaltsøen, efter klumperne af bitumen, der steg op fra bunden, og navnet Det Døde Hav optræder hos Pausanias i 100-tallet e.Kr. Araberne kalder det Lots Hav."
    - "1. Mosebog nævner det først, da fire konger kæmpede mod fem »i Siddims Dal, det er Salthavet«, fuld af bitumengruber; Sodoma og Gomorra lå på dets slette, og Lots hustru »blev en Saltstøtte«. I loven og Josvabogen er havet en grænse: landets sydgrænse skulle være »fra Enden af Salthavet imod Østen«, Jordans vand, der løb ned til det, »blev aldeles afskaaret«, da Israel krydsede, og Judas østgrænse »er Salthavet indtil Jordanens Udløb«. Jeroboam 2. genoprettede Israels grænse »indtil Havet ved den slette Mark«. Profeterne ser frem til dets helbredelse: Ezekiel ser en flod fra templet løbe ned i havet, så at »naar det er ført ud i Havet, da blive Vandene friske«, og fiskere stå »fra En-Gedi og indtil En-Eglaim«, og Zakarias' levende vande flyder »til Havet imod Østen«."
    - "Kysterne bærer meget historie. David skjulte sig i En-Gedi; Herodes byggede sine paladser på Masada, hvor de sidste oprørere mod Rom døde i 73 eller 74 e.Kr.; i Qumran, i huler over den nordvestlige kyst, blev Dødehavsrullerne fundet fra 1947. Josefus beskriver søens bitre vand og flydende bitumen og fortæller, hvordan Vespasian lod bundne mænd kaste i for at se, om de ville synke. Diodoros siger, at lokale arabere samlede bitumen og solgte det i Egypten til balsamering. Madaba-mosaikkortet fra 500-tallet viser to både på det."
    - "I dag deles søen af Israel, Vestbredden og Jordan. Med Jordans vand ledt bort og kaliværker, der fordamper det lavvandede sydlige bassin, falder overfladen med omkring en meter om året; Lisan-halvøen er blevet en landbro, og tusindvis af jordfaldshuller åbner sig langs den vigende kyst. Hvor sletternes byer lå, er ikke kendt: byer fra tidlig bronzealder ved Bab edh-Dhra og Numeira på den sydøstlige kyst nævnes ofte, og et sted længere mod nord, Tall el-Hammam, er også blevet foreslået."
  sr:
    - "Слано море Библије је Мртво море, језеро у које тече Јордан и из кога ништа не истиче. Његова површина, више од 430 м испод нивоа Средоземног мора, најнижа је тачка на копну. Вода је око десет пута слања од океана: у њој не живи ниједна риба, а пливач не може потонути. Библија га зове и морем равнице (Арава) и источним морем; грчки и римски писци знали су га као Асфалтно језеро, по грудвама битумена које су се дизале с његовог дна, а име Мртво море јавља се код Паусаније у 2. веку н. е. Арапи га зову Лотово море."
    - "Постање га први пут именује кад су четири цара ратовала с пет „у долини сидимској која је сада слано море“, пуној јама смоле; Содом и Гомор лежали су на његовој равници, а Лотова жена „поста слан камен“. У Закону и код Исуса Навина море је граница: јужна међа земље имала је бити „од брега сланог мора на исток“, воде Јордана што су текле доле к њему „отече сасвим“ кад је Израиљ прешао, а источна међа Јуде била је „слано море до краја Јордана“. Јеровоам II повратио је међе Израиљеве „до мора уз поље“. Пророци очекују његово исцељење: Језекиљ види реку из Храма како силази у море, па „његова ће вода постати здрава“, а рибари стоје „од Енгада до Ен-еглаима“, и Захаријине живе воде теку „к источном мору“."
    - "Обале носе много историје. Давид се скривао у Енгаду; Ирод је подигао своје палате на Масади, где су последњи побуњеници против Рима умрли 73. или 74. н. е.; у Кумрану, у пећинама изнад северозападне обале, Кумрански свици су нађени од 1947. Јосиф Флавије описује горку воду језера и битумен што плута, и приповеда како је Веспазијан дао да се људи свезани бацају у њега да види хоће ли потонути. Диодор каже да су мештани Арапи скупљали битумен и продавали га у Египту за балзамовање. Мадабска мозаичка карта из 6. века приказује на њему два чамца."
    - "Данас језеро деле Израел, Западна обала и Јордан. Откако је вода Јордана скренута, а творнице поташе испаравају плитки јужни базен, површина пада око метар годишње; полуострво Лисан постало је копнени мост, а хиљаде вртача отвара се дуж повлачеће обале. Где су стајали градови равнице, не зна се: често се наводе градови раног бронзаног доба у Баб ед-Дра и Нумејри на југоисточној обали, а предложено је и налазиште даље на север, Тал ел-Хамам."
