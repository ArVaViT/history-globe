# Overview article (ADR 0007). Mainstream facts only; Sadad is the usual identification, the alternative that follows a southern line for the border is named, and neither is presented as certain.
id: zedad
place: aab92ca
title:
  en: "Zedad"
  ru: "Цедад"
  uk: "Цедад"
  es: "Sedad"
  pt: "Zedade"
  de: "Zedad"
  fr: "Tsedad"
body:
  en:
    - "Zedad is a point on the ideal northern border of the promised land, named twice and only as a landmark. In Numbers the Lord tells Moses: “From mount Hor ye shall point out your border unto the entrance of Hamath; and the goings forth of the border shall be to Zedad”, and the line runs on to Ziphron and Hazar-enan. Ezekiel's vision of the restored land repeats the northern border “from the great sea, the way of Hethlon, as men go to Zedad”. Nothing is said of the place itself, and no event in the Bible happens there."
    - "Most scholars identify Zedad with Sadad, a village on the edge of the Syrian desert between Homs and Damascus, whose name matches well; this places the border far to the north, beyond Lebo-hamath. Those who draw the northern border farther south, through the Beqaa and the hills north of Dan, have suggested Khirbet Serada near Marjayoun in southern Lebanon instead. Which is right depends on how the whole border is drawn. Sadad today is an old Syriac Christian town that suffered badly in the Syrian civil war."
  ru:
    - "Цедад — точка на идеальной северной границе обетованной земли; он назван дважды и только как примета. В книге Чисел Господь говорит Моисею: «от горы Ор проведите к Емафу, и будут выступы границы к Цедаду», а дальше линия идёт к Цифрону и Гацар-Енану. Видение Иезекииля о восстановленной земле повторяет северную границу: «начиная от великого моря, через Хетлон, по дороге в Цедад». О самом месте не сказано ничего, и никакие события Библии там не происходят."
    - "Большинство учёных отождествляют Цедад с Сададом, селением на краю Сирийской пустыни между Хомсом и Дамаском, имя которого хорошо совпадает; тогда граница проходит далеко на севере, за Лево-Емафом. Те, кто проводит северную границу южнее, через долину Бекаа и холмы к северу от Дана, предлагали вместо него Хирбет-Сераду близ Марджаюна на юге Ливана. Что верно, зависит от того, как проводить всю границу. Садад сегодня — старый сирийский христианский городок, сильно пострадавший в гражданской войне в Сирии."
  uk:
    - "Цедад — точка на ідеальній північній межі обіцяного краю, названа двічі й лише як орієнтир. У Числах Господь каже Мойсеєві: «від Гор гори проведете її як раз до Гамата, і буде гряничнїй виступ до Зедаду», і лінія йде далі до Цифрона й Гацар-Енана. Видіння Єзекіїля про відновлений край повторює північну межу «починаючи од великого моря, через Хетлон, по дорозї в Зедад». Про саме місце нічого не сказано, і жодна біблійна подія там не відбувається."
    - "Більшість учених ототожнюють Цедад із Сададом, селом на краю сирійської пустелі між Хомсом і Дамаском, чия назва добре збігається; це ставить межу далеко на північ, за Вхід у Хамат. Ті, хто проводить північну межу далі на південь, крізь Бекаа і пагорби на північ від Дана, пропонували натомість Хірбет-Сераду біля Мардж-Аюна на півдні Лівану. Що правильне, залежить від того, як проведено всю межу. Садад нині — давнє сирійське християнське місто, що тяжко постраждало в сирійській громадянській війні."
  es:
    - "Sedad es un punto de la frontera septentrional ideal de la tierra prometida, nombrado dos veces y solo como hito. En Números el Señor dice a Moisés: «Del monte de Hor señalaréis á la entrada de Hamath, y serán las salidas de aquel término á Sedad», y la línea sigue hasta Zifrón y Hazar-enán. La visión de Ezequiel de la tierra restaurada repite la frontera norte «desde la gran mar, camino de Hethlon viniendo á Sedad». No se dice nada del lugar mismo, y ningún suceso de la Biblia ocurre allí."
    - "La mayoría de los estudiosos identifican Sedad con Sadad, una aldea en el borde del desierto sirio entre Homs y Damasco, cuyo nombre coincide bien; esto sitúa la frontera muy al norte, más allá de la Entrada de Hamat. Quienes trazan la frontera norte más al sur, por la Beqaa y las colinas al norte de Dan, han sugerido en cambio Khirbet Serada, cerca de Marjayoun, en el sur del Líbano. Cuál es la correcta depende de cómo se trace toda la frontera. Sadad es hoy una antigua ciudad cristiana siríaca que sufrió gravemente en la guerra civil siria."
  pt:
    - "Zedade é um ponto da fronteira norte ideal da terra prometida, nomeado duas vezes e apenas como marco. Em Números o Senhor diz a Moisés: “Do monte Hor vocês marcarão até a entrada de Hamate; e a fronteira passará por Zedade”, e a linha segue para Zifrom e Hazar-Enã. A visão de Ezequiel sobre a terra restaurada repete a fronteira norte “desde o Mar Grande, pelo caminho de Hetlom, até a entrada de Zedade”. Nada se diz do lugar em si, e nenhum acontecimento bíblico se passa ali."
    - "A maioria dos estudiosos identifica Zedade com Sadad, uma aldeia na orla do deserto sírio entre Homs e Damasco, cujo nome combina bem; isso põe a fronteira muito ao norte, além de Lebo-Hamate. Os que traçam a fronteira norte mais ao sul, pela Beqaa e pelas colinas ao norte de Dã, sugeriram em vez disso Khirbet Serada, perto de Marjayoun, no sul do Líbano. Qual está certa depende de como se traça toda a fronteira. Sadad é hoje uma antiga cidade cristã siríaca que sofreu muito na guerra civil síria."
  de:
    - "Zedad ist ein Punkt an der idealen Nordgrenze des verheißenen Landes, zweimal genannt und nur als Orientierungspunkt. Im Buch Numeri sagt der Herr zu Mose: „und von dem Berg Hor messen, bis man kommt gen Hamath, das der Ausgang der Grenze sei gen Zedad“, und die Linie läuft weiter nach Zifron und Hazar-Enan. Hesekiels Vision des wiederhergestellten Landes wiederholt die Nordgrenze „von dem großen Meer an des Weges nach Hethlon gen Zedad“. Über den Ort selbst wird nichts gesagt, und kein Ereignis der Bibel geschieht dort."
    - "Die meisten Forscher setzen Zedad mit Sadad gleich, einem Dorf am Rand der syrischen Wüste zwischen Homs und Damaskus, dessen Name gut passt; das legt die Grenze weit nach Norden, jenseits von Lebo-Hamat. Wer die Nordgrenze weiter südlich durch die Beqaa und die Hügel nördlich von Dan zieht, hat stattdessen Khirbet Serada bei Marjayoun im Südlibanon vorgeschlagen. Was richtig ist, hängt davon ab, wie die ganze Grenze gezogen wird. Sadad ist heute eine alte syrisch-christliche Stadt, die im syrischen Bürgerkrieg schwer gelitten hat."
  fr:
    - "Tsedad est un point de la frontière nord idéale de la terre promise, nommé deux fois et seulement comme repère. Dans les Nombres, l’Éternel dit à Moïse : « depuis la montagne de Hor, vous la ferez passer par Hamath, et arriver à Tsedad », et la ligne se poursuit par Tsiphron et Hatsar-Énan. La vision d’Ézéchiel du pays restauré répète la frontière nord « depuis la grande mer, le chemin de Hethlon jusqu’à Tsedad ». Rien n’est dit du lieu lui-même, et aucun événement de la Bible n’y a lieu."
    - "La plupart des spécialistes identifient Tsedad à Sadad, village au bord du désert syrien entre Homs et Damas, dont le nom correspond bien ; cela place la frontière loin au nord, au-delà de l’Entrée de Hamath. Ceux qui tracent la frontière nord plus au sud, par la Beqaa et les collines au nord de Dan, ont plutôt proposé Khirbet Serada près de Marjayoun, dans le sud du Liban. La bonne réponse dépend du tracé de toute la frontière. Sadad est aujourd’hui une vieille ville chrétienne syriaque qui a gravement souffert de la guerre civile syrienne."
