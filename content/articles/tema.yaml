body:
  en:
    - "Tema is Tayma, a great oasis in the north-west of Arabia, some 400 km south-east of the head of the Gulf of Aqaba, where the caravan road from South Arabia to Mesopotamia and Syria met the way across to the Red Sea coast. In Genesis Tema is one of the twelve sons of Ishmael, that is, an Arab tribe, and the oasis was its seat. A Saudi-German expedition has excavated there since 2004 and traced settlement back at least to the third millennium BC; a walled oasis town stood there in the Bronze Age, during the second millennium BC, and its long enclosure wall still runs across the plain."
    - "Assyrian and Babylonian records know the place. Tiglath-pileser III lists Tema among the Arab peoples that sent him gold, silver, camels and spices as tribute in the 730s BC. Nabonidus, the last king of Babylon, left Babylon to his son Belshazzar and lived at Tema for ten years, from about 553 to 543 BC, as his Harran stela and the Babylonian chronicle record; fragments of a stela with his name and image have been found at Tayma itself, and a prayer of Nabonidus among the Dead Sea Scrolls remembers his years there. An Aramaic stela of the Persian period from Tayma, now in the Louvre, records the founding of a new god's cult in the town."
    - "The Bible sees Tema from the road. Job compares his friends to a wadi that dries up: “The troops of Tema looked, the companies of Sheba waited for them”. Isaiah's oracle on Arabia calls to the oasis to meet the refugees of a war in the desert: “The inhabitants of the land of Tema brought water to him that was thirsty, they prevented with their bread him that fled”. Jeremiah hands the cup of wrath to “Dedan, and Tema, and Buz”. Eliphaz the Temanite in Job comes from Teman in Edom, another place."
    - "Tayma today is a town of the Tabuk region of Saudi Arabia. The ancient well Bir Haddaj, the old walls and the excavated quarters lie within and beside it, and the finds are shown in the town's museum."
  ru:
    - "Фема — это Тайма, большой оазис на северо-западе Аравии, примерно в 400 км к юго-востоку от вершины залива Акаба, где караванная дорога из Южной Аравии в Месопотамию и Сирию встречалась с путём к берегу Красного моря. В Бытии Фема — один из двенадцати сыновей Измаила, то есть арабское племя, и оазис был его средоточием. Саудовско-германская экспедиция ведёт здесь раскопки с 2004 года и проследила поселение по меньшей мере до III тысячелетия до н. э.; в бронзовом веке, во II тысячелетии до н. э., здесь стоял обнесённый стеной город оазиса, и его длинная стена до сих пор тянется по равнине."
    - "Ассирийские и вавилонские записи знают это место. Тиглатпаласар III называет Фему среди арабских народов, что присылали ему в 730-х гг. до н. э. дань золотом, серебром, верблюдами и благовониями. Набонид, последний царь Вавилона, оставил Вавилон сыну Валтасару и десять лет, примерно с 553 по 543 г. до н. э., жил в Феме, как сообщают его стела из Харрана и вавилонская хроника; в самой Тайме найдены обломки стелы с его именем и изображением, а молитва Набонида среди свитков Мёртвого моря помнит его годы там. Арамейская стела персидского времени из Таймы, ныне в Лувре, сообщает об учреждении в городе культа нового бога."
    - "Библия видит Фему с дороги. Иов сравнивает друзей с пересыхающим потоком: «смотрят на них дороги Фемайские, надеются на них пути Савейские». Пророчество Исаии об Аравии зовёт оазис навстречу беглецам войны в пустыне: «Живущие в земле Фемайской! несите воды навстречу жаждущим; с хлебом встречайте бегущих». Иеремия перечисляет среди пьющих чашу гнева «Дедана, и Фему, и Буза». Елифаз Феманитянин в книге Иова — из Фемана в Едоме, это другое место."
    - "Тайма сегодня — город в провинции Табук в Саудовской Аравии. Древний колодец Бир-Хаддадж, старые стены и раскопанные кварталы лежат в нём и рядом с ним, а находки показывают в городском музее."
  uk:
    - "Тема — це Тайма, велика оаза на північному заході Аравії, приблизно за 400 км на південний схід від верхів’я Акабської затоки, де караванна дорога з Південної Аравії до Месопотамії та Сирії сходилася з шляхом до узбережжя Червоного моря. У Книзі Буття Тема — один із дванадцяти синів Ізмаїла, тобто арабське плем’я, і оаза була його осередком. Саудівсько-німецька експедиція веде там розкопки з 2004 року й простежила поселення щонайменше до III тис. до н. е.; мурований оазисний город стояв там у бронзову добу, у II тис. до н. е., і його довга огорожа й досі тягнеться рівниною."
    - "Ассірійські й вавилонські записи знають це місце. Тіглатпаласар III перелічує Тему серед арабських народів, які надсилали йому в 730-х роках до н. е. золото, срібло, верблюдів і прянощі як данину. Набонід, останній цар Вавилона, залишив Вавилон синові Валтасару і жив у Темі десять років, приблизно з 553 до 543 р. до н. е., як свідчать його Харранська стела й Вавилонська хроніка; уламки стели з його іменем і зображенням знайдено в самій Таймі, а молитва Набоніда серед сувоїв Мертвого моря пам’ятає його роки там. Арамейська стела перського часу з Таймі, нині в Луврі, згадує заснування в місті культу нового бога."
    - "Біблія бачить Тему з дороги. Йов порівнює своїх друзів з потоком, що висихає: «Дивляться, де вони, дороги Темайські; надїються на них дороги Савейські». Пророцтво Ісаї про Аравію закликає оазу зустріти біженців війни в пустелі: «Осадники країни Темайської! несїть води назустріч умлїваючим од спраги; стрічайте хлїбом утїкаючих». Єремія передає чашу гніву: «В Деданї, Темі й Бузї». Еліфаз теманянин у Йова походить із Темана в Едомі, іншого місця."
    - "Тайма нині — містечко в районі Табук у Саудівській Аравії. Давній колодязь Бір-Хаддадж, старі мури й розкопані квартали лежать у ньому та поряд, а знахідки показують у міському музеї."
  es:
    - "Tema es Tayma, un gran oasis del noroeste de Arabia, a unos 400 km al sureste de la cabecera del golfo de Aqaba, donde el camino de caravanas de Arabia del Sur a Mesopotamia y Siria se encontraba con la ruta que cruzaba hacia la costa del Mar Rojo. En el Génesis, Tema es uno de los doce hijos de Ismael, es decir, una tribu árabe, y el oasis era su sede. Una expedición saudí-alemana excava allí desde 2004 y ha rastreado el asentamiento al menos hasta el tercer milenio a. C.; una ciudad de oasis amurallada existía allí en la Edad del Bronce, durante el segundo milenio a. C., y su larga muralla de cerco aún cruza la llanura."
    - "Los registros asirios y babilónicos conocen el lugar. Tiglat-pileser III enumera Tema entre los pueblos árabes que le enviaron como tributo oro, plata, camellos y especias en los años 730 a. C. Nabonido, el último rey de Babilonia, dejó Babilonia a su hijo Belsasar y vivió en Tema diez años, de hacia 553 a 543 a. C., como registran su estela de Harán y la crónica babilónica; en la propia Tayma se han hallado fragmentos de una estela con su nombre e imagen, y una oración de Nabonido entre los manuscritos del mar Muerto recuerda sus años allí. Una estela aramea del período persa procedente de Tayma, hoy en el Louvre, registra la fundación del culto de un nuevo dios en la ciudad."
    - "La Biblia ve Tema desde el camino. Job compara a sus amigos con un torrente que se seca: «Miraron los caminantes de Temán, los caminantes de Saba esperaron en ellas». El oráculo de Isaías sobre Arabia llama al oasis a salir al encuentro de los refugiados de una guerra en el desierto: «llevadle aguas, moradores de tierra de Tema, socorred con su pan al que huye». Jeremías entrega la copa de la ira a «Dedán, y Tema, y Buz». Elifaz el temanita, en Job, procede de Temán, en Edom, otro lugar."
    - "Tayma es hoy una población de la región de Tabuk, en Arabia Saudí. El antiguo pozo Bir Haddaj, las antiguas murallas y los barrios excavados se encuentran dentro y junto a ella, y los hallazgos se exhiben en el museo de la ciudad."
  pt:
    - "Temá é Tayma, um grande oásis no noroeste da Arábia, a uns 400 km a sudeste da cabeceira do golfo de Aqaba, onde a rota de caravanas da Arábia do Sul à Mesopotâmia e à Síria encontrava o caminho para a costa do Mar Vermelho. Em Gênesis, Temá é um dos doze filhos de Ismael, isto é, uma tribo árabe, e o oásis era sua sede. Uma expedição saudita-alemã escava ali desde 2004 e rastreou o povoamento pelo menos até o terceiro milênio a.C.; uma cidade-oásis murada existia ali na Idade do Bronze, durante o segundo milênio a.C., e sua longa muralha ainda atravessa a planície."
    - "Registros assírios e babilônicos conhecem o lugar. Tiglate-Pileser III lista Temá entre os povos árabes que lhe enviaram ouro, prata, camelos e especiarias como tributo na década de 730 a.C. Nabonido, último rei da Babilônia, deixou a Babilônia a seu filho Belsazar e viveu em Temá por dez anos, de cerca de 553 a 543 a.C., como registram sua estela de Harã e a crônica babilônica; fragmentos de uma estela com seu nome e imagem foram achados na própria Tayma, e uma oração de Nabonido entre os Manuscritos do Mar Morto recorda os anos ali. Uma estela aramaica do período persa, de Tayma, hoje no Louvre, registra a fundação do culto de um novo deus na cidade."
    - "A Bíblia vê Temá da estrada. Jó compara seus amigos a um uádi que seca: “As caravanas de Tema olharam. As companhias de Sabá esperaram por eles”. O oráculo de Isaías sobre a Arábia chama o oásis a ir ao encontro dos refugiados de uma guerra no deserto: “Eles trouxeram água para aquele que estava com sede. Os habitantes da terra de Tema foram ao encontro dos fugitivos com seu pão”. Jeremias entrega o cálice da ira a “Dedã, Tema, Buz”. Elifaz, o temanita de Jó, vem de Temã, em Edom, outro lugar."
    - "Tayma é hoje uma cidade da região de Tabuk, na Arábia Saudita. O antigo poço Bir Haddaj, as velhas muralhas e os bairros escavados ficam dentro e ao lado dela, e os achados são mostrados no museu da cidade."
  de:
    - "Tema ist Tayma, eine große Oase im Nordwesten Arabiens, etwa 400 km südöstlich des Kopfes des Golfs von Akaba, wo die Karawanenstraße von Südarabien nach Mesopotamien und Syrien auf den Weg zur Küste des Roten Meeres traf. In der Genesis ist Tema einer der zwölf Söhne Ismaels, also ein arabischer Stamm, und die Oase war sein Sitz. Eine saudisch-deutsche Expedition gräbt dort seit 2004 und hat die Besiedlung mindestens bis ins dritte Jahrtausend v. Chr. zurückverfolgt; in der Bronzezeit, im zweiten Jahrtausend v. Chr., stand dort eine ummauerte Oasenstadt, und ihre lange Umfassungsmauer zieht sich noch über die Ebene."
    - "Assyrische und babylonische Quellen kennen den Ort. Tiglat-Pileser III. führt Tema unter den arabischen Völkern auf, die ihm in den 730er Jahren v. Chr. Gold, Silber, Kamele und Gewürze als Tribut sandten. Nabonid, der letzte König von Babylon, überließ Babylon seinem Sohn Belsazar und lebte von etwa 553 bis 543 v. Chr. zehn Jahre in Tema, wie seine Harran-Stele und die babylonische Chronik berichten; in Tayma selbst wurden Fragmente einer Stele mit seinem Namen und Bild gefunden, und ein Gebet des Nabonid unter den Schriftrollen vom Toten Meer erinnert an seine Jahre dort. Eine aramäische Stele der Perserzeit aus Tayma, heute im Louvre, berichtet von der Einführung des Kultes eines neuen Gottes in der Stadt."
    - "Die Bibel sieht Tema von der Straße aus. Hiob vergleicht seine Freunde mit einem Wadi, das austrocknet: „die Reisezüge von Thema blicken ihnen nach, die Karawanen von Saba hofften auf sie“. Jesajas Ausspruch über Arabien ruft der Oase zu, den Flüchtlingen eines Krieges in der Wüste zu begegnen: „Bringet den Durstigen Wasser entgegen, die ihr wohnet im Lande Thema; bietet Brot den Flüchtigen“. Jeremia reicht den Becher des Zorns „denen von Dedan, denen von Thema, denen von Bus“. Eliphas der Temaniter bei Hiob stammt aus Teman in Edom, einem anderen Ort."
    - "Tayma ist heute eine Stadt in der Region Tabuk in Saudi-Arabien. Der antike Brunnen Bir Haddaj, die alten Mauern und die ausgegrabenen Viertel liegen in und neben ihr, und die Funde werden im Museum der Stadt gezeigt."
  fr:
    - "Théma est Tayma, grande oasis du nord-ouest de l’Arabie, à quelque 400 km au sud-est de l’extrémité du golfe d’Aqaba, où la route caravanière de l’Arabie du Sud vers la Mésopotamie et la Syrie rencontrait la voie vers la côte de la mer Rouge. Dans la Genèse, Théma est l’un des douze fils d’Ismaël, c’est-à-dire une tribu arabe, et l’oasis était son siège. Une expédition saoudo-allemande y fouille depuis 2004 et a retracé l’occupation au moins jusqu’au IIIe millénaire av. J.-C. ; une ville d’oasis fortifiée s’y dressait à l’âge du Bronze, au IIe millénaire av. J.-C., et sa longue enceinte traverse encore la plaine."
    - "Les annales assyriennes et babyloniennes connaissent le lieu. Tiglath-Piléser III cite Théma parmi les peuples arabes qui lui envoyèrent en tribut or, argent, chameaux et aromates dans les années 730 av. J.-C. Nabonide, dernier roi de Babylone, laissa Babylone à son fils Belschatsar et vécut à Théma dix ans, d’environ 553 à 543 av. J.-C., comme le consignent sa stèle de Harran et la chronique babylonienne ; des fragments d’une stèle à son nom et à son image ont été trouvés à Tayma même, et une prière de Nabonide parmi les manuscrits de la mer Morte garde le souvenir de ses années là-bas. Une stèle araméenne de l’époque perse trouvée à Tayma, aujourd’hui au Louvre, consigne la fondation du culte d’un nouveau dieu dans la ville."
    - "La Bible voit Théma depuis la route. Job compare ses amis à un torrent qui s’assèche : « Les caravanes de Théma fixent le regard, les voyageurs de Séba sont pleins d’espoir ». L’oracle d’Ésaïe sur l’Arabie appelle l’oasis à aller à la rencontre des réfugiés d’une guerre dans le désert : « Portez de l’eau à ceux qui ont soif ; les habitants du pays de Théma portent du pain aux fugitifs ». Jérémie tend la coupe de la colère « à Dedan, à Théma, à Buz ». Éliphaz le Thémanite, dans Job, vient de Théman, en Édom, un autre lieu."
    - "Tayma est aujourd’hui une ville de la région de Tabouk, en Arabie saoudite. Le puits antique Bir Haddaj, les anciens remparts et les quartiers fouillés se trouvent dans la ville et à côté, et les trouvailles sont présentées au musée de la ville."
  pl:
    - "Tema to Tajma, wielka oaza w północno-zachodniej Arabii, około 400 km na południowy wschód od północnego krańca Zatoki Akaba, gdzie droga karawan z Arabii Południowej do Mezopotamii i Syrii spotykała się z drogą przez pustynię na wybrzeże Morza Czerwonego. W Księdze Rodzaju Tema jest jednym z dwunastu synów Izmaela, czyli plemieniem arabskim, a oaza była jego siedzibą. Saudyjsko-niemiecka wyprawa kopie tam od 2004 roku i wyśledziła osadnictwo co najmniej do III tysiąclecia p.n.e.; w epoce brązu, w II tysiącleciu p.n.e., stało tam otoczone murem miasto oazowe, a jego długi mur obronny wciąż biegnie przez równinę."
    - "Miejsce znają źródła asyryjskie i babilońskie. Tiglat-Pileser III wymienia Temę wśród ludów arabskich, które w latach trzydziestych VIII wieku p.n.e. przysłały mu w daninie złoto, srebro, wielbłądy i korzenie. Nabonid, ostatni król Babilonu, zostawił Babilon synowi Belszassarowi i mieszkał w Temie przez dziesięć lat, od około 553 do 543 roku p.n.e., jak zapisują jego stela z Charanu i kronika babilońska; fragmenty steli z jego imieniem i wizerunkiem znaleziono w samej Tajmie, a modlitwa Nabonida wśród zwojów znad Morza Martwego pamięta jego lata tam. Aramejska stela z okresu perskiego z Tajmy, obecnie w Luwrze, zapisuje ustanowienie w mieście kultu nowego boga."
    - "Biblia patrzy na Temę z drogi. Hiob porównuje swych przyjaciół do wadi, które wysycha: „Podróżni ludzie z krainy Teman obaczyli je; a którzy szli do Seba, mieli w nich nadzieję”. Wyrocznia Izajasza o Arabii wzywa oazę, by wyszła naprzeciw uchodźców wojny na pustyni: „Niech zabieżą pragnącemu, niosąc wodę obywatele ziemi Temańskiej; z chlebem jego niech wynijdą przeciw uciekającemu”. Jeremiasz każe pić z kielicha gniewu: „Dedana i Temę, i Buzę”. Elifaz z Temanu w Księdze Hioba pochodzi z Temanu w Edomie, innego miejsca."
    - "Tajma jest dziś miastem regionu Tabuk w Arabii Saudyjskiej. Starożytna studnia Bir Haddadż, dawne mury i odkopane dzielnice leżą w jej obrębie i obok niej, a znaleziska pokazuje miejskie muzeum."
  it:
    - "Tema è Tayma, una grande oasi nell’Arabia nord-occidentale, circa 400 km a sud-est del fondo del golfo di Aqaba, dove la strada carovaniera dall’Arabia meridionale alla Mesopotamia e alla Siria incontrava la via verso la costa del Mar Rosso. Nella Genesi Tema è uno dei dodici figli di Ismaele, cioè una tribù araba, e l’oasi ne era la sede. Una spedizione saudita-tedesca vi scava dal 2004 e ha fatto risalire l’insediamento almeno al III millennio a.C.; nell’età del Bronzo, durante il II millennio a.C., vi sorgeva una città di oasi fortificata, e la sua lunga cinta muraria attraversa ancora la piana."
    - "I documenti assiri e babilonesi conoscono il luogo. Tiglat-Pilèser III elenca Tema fra i popoli arabi che gli inviarono come tributo oro, argento, cammelli e spezie negli anni 730 a.C. Nabonedo, ultimo re di Babilonia, lasciò Babilonia al figlio Baldassarre e visse a Tema per dieci anni, dal 553 al 543 a.C. circa, come registrano la sua stele di Carran e la cronaca babilonese; frammenti di una stele con il suo nome e la sua immagine sono stati trovati a Tayma stessa, e una preghiera di Nabonedo fra i Rotoli del Mar Morto ricorda i suoi anni là. Una stele aramaica di epoca persiana proveniente da Tayma, oggi al Louvre, registra la fondazione del culto di un nuovo dio nella città."
    - "La Bibbia vede Tema dalla strada. Giobbe paragona i suoi amici a un torrente che si prosciuga: «Le carovane di Tema li cercavan collo sguardo, i viandanti di Sceba ci contavan su». L’oracolo di Isaia sull’Arabia chiama l’oasi a venire incontro ai profughi di una guerra nel deserto: «Venite incontro all’assetato con dell’acqua, o abitanti del paese di Tema; recate del pane ai fuggiaschi». Geremia porge la coppa dell’ira «a Dedan, a Tema, a Buz». Elifaz il Temanita, in Giobbe, viene da Teman in Edom, un altro luogo."
    - "Tayma è oggi una città della regione di Tabuk, in Arabia Saudita. L’antico pozzo Bir Haddaj, le vecchie mura e i quartieri scavati si trovano dentro e accanto ad essa, e i reperti sono esposti nel museo della città."
  nl:
    - "Tema is Tayma, een grote oase in het noordwesten van Arabië, zo’n 400 km ten zuidoosten van de top van de Golf van Akaba, waar de karavaanweg van Zuid-Arabië naar Mesopotamië en Syrië samenkwam met de weg naar de kust van de Rode Zee. In Genesis is Tema een van de twaalf zonen van Ismaël, dat wil zeggen een Arabische stam, en de oase was haar zetel. Een Saoedisch-Duitse expeditie graaft er sinds 2004 en heeft de bewoning teruggevoerd tot minstens het derde millennium v.Chr.; in de bronstijd, in het tweede millennium v.Chr., stond er een ommuurde oasestad, en haar lange omheiningsmuur loopt nog steeds over de vlakte."
    - "Assyrische en Babylonische bronnen kennen de plaats. Tiglat-Pileser III noemt Tema onder de Arabische volken die hem in de jaren 730 v.Chr. goud, zilver, kamelen en specerijen als schatting zonden. Nabonidus, de laatste koning van Babylon, liet Babylon aan zijn zoon Belsazar over en woonde tien jaar in Tema, van omstreeks 553 tot 543 v.Chr., zoals zijn Harran-stèle en de Babylonische kroniek vermelden; fragmenten van een stèle met zijn naam en beeltenis zijn in Tayma zelf gevonden, en een gebed van Nabonidus onder de Dode Zee-rollen herinnert aan zijn jaren daar. Een Aramese stèle uit de Perzische tijd uit Tayma, nu in het Louvre, vermeldt de invoering van de eredienst van een nieuwe god in de stad."
    - "De Bijbel ziet Tema vanaf de weg. Job vergelijkt zijn vrienden met een wadi die opdroogt: “De reizigers van Thema zien ze, de wandelaars van Scheba wachten op haar”. Het godsspraakwoord van Jesaja over Arabië roept de oase op de vluchtelingen van een oorlog in de woestijn tegemoet te treden: “Komt den dorstige tegemoet met water; de inwoners des lands van Thema zijn den vluchtende met zijn brood bejegend”. Jeremia reikt de beker van de gramschap aan “Dedan, en Thema, en Buz”. Elifaz de Temaniet in Job komt uit Teman in Edom, een andere plaats."
    - "Tayma is tegenwoordig een stad in de regio Tabuk in Saoedi-Arabië. De antieke put Bir Haddaj, de oude muren en de opgegraven wijken liggen in en naast de stad, en de vondsten worden getoond in het museum van de stad."
  cs:
    - "Téma je Tajmá, velká oáza v severozápadní Arábii, asi 400 km jihovýchodně od nejzazšího konce Akabského zálivu, kde se karavanní cesta z jižní Arábie do Mezopotámie a Sýrie setkávala s cestou k pobřeží Rudého moře. V Genesis je Téma jedním z dvanácti synů Jišmaelových, tedy arabský kmen, a oáza byla jeho sídlem. Saúdsko-německá expedice tam kope od roku 2004 a vystopovala osídlení nejméně do 3. tisíciletí př. n. l.; v době bronzové, ve 2. tisíciletí př. n. l., tam stálo opevněné oázové město a jeho dlouhá obvodová zeď se dosud táhne přes pláň."
    - "Asyrské a babylónské záznamy toto místo znají. Tiglatpilesar III. uvádí Tému mezi arabskými národy, které mu ve 30. letech 8. stol. př. n. l. posílaly zlato, stříbro, velbloudy a koření jako tribut. Nabonid, poslední babylónský král, nechal Babylón synu Belšasarovi a žil deset let v Témě, od zhruba 553 do 543 př. n. l., jak zaznamenávají jeho stéla z Cháranu a babylónská kronika; úlomky stély s jeho jménem a podobou byly nalezeny v samé Tajmě a modlitba Nabonidova mezi svitky od Mrtvého moře připomíná jeho tamní léta. Aramejská stéla z perského období z Tajmy, nyní v Louvru, zaznamenává zavedení kultu nového boha ve městě."
    - "Bible vidí Téma z cesty. Job přirovnává své přátele k vádí, které vysychá: „houfové jdoucích z Tema, zástupové Sabejských, jenž naději měli v nich“. Izajášovo proroctví o Arábii volá na oázu, aby vyšla vstříc uprchlíkům z války na poušti: „Obyvatelé země Tema nechať vynesou vody vstříc žíznivému; s chlebem jeho nechať vyjdou proti utíkajícímu“. Jeremjáš napájí pohárem hněvu „Dedana a Temu, a Buzu“. Elifaz Témánský v Jobovi pochází z Témánu v Edómu, což je jiné místo."
    - "Tajmá je dnes město v oblasti Tabúk v Saúdské Arábii. Starověká studna Bír Haddáj, staré hradby a vykopané čtvrti leží uvnitř a vedle něj a nálezy jsou vystaveny v městském muzeu."
  sv:
    - "Tema är Tayma, en stor oas i nordvästra Arabien, omkring 400 km sydost om Aqababuktens inre del, där karavanvägen från Sydarabien till Mesopotamien och Syrien mötte vägen över till Röda havets kust. I Första Moseboken är Tema en av Ismaels tolv söner, det vill säga en arabisk stam, och oasen var dess säte. En saudisk-tysk expedition har grävt där sedan 2004 och följt bosättningen tillbaka åtminstone till tredje årtusendet f.Kr.; en befäst oasstad fanns där under bronsåldern, under andra årtusendet f.Kr., och dess långa ringmur löper fortfarande över slätten."
    - "Assyriska och babyloniska källor känner platsen. Tiglat-Pileser III räknar upp Tema bland de arabiska folk som sände honom guld, silver, kameler och kryddor som tribut på 730-talet f.Kr. Nabonid, Babylons siste kung, lämnade Babylon åt sin son Belshassar och bodde i Tema i tio år, från omkring 553 till 543 f.Kr., som hans Harranstele och den babyloniska krönikan uppger; fragment av en stele med hans namn och bild har hittats i själva Tayma, och en bön av Nabonid bland Dödahavsrullarna minns hans år där. En arameisk stele från persertiden från Tayma, nu i Louvren, berättar om införandet av en ny guds kult i staden."
    - "Bibeln ser Tema från vägen. Job jämför sina vänner med ett vadi som torkar ut: ”Temas vägfarande skådade dithän, Sabas köpmanståg hoppades på dem”. Jesajas utsaga om Arabien kallar på oasen att möta flyktingarna från ett krig i öknen: ”Må man komma emot de törstande och giva dem vatten. Ja, inbyggarna i Temas land gå de flyktande till mötes med bröd.” Jeremia räcker vredens bägare åt ”Dedan, Tema, Bus”. Elifas, temaniten, i Job kommer från Teman i Edom, en annan plats."
    - "Tayma är i dag en stad i regionen Tabuk i Saudiarabien. Den gamla brunnen Bir Haddaj, de gamla murarna och de utgrävda kvarteren ligger inom och bredvid den, och fynden visas i stadens museum."
  nb:
    - "Tema er Tayma, en stor oase i nordvestlige Arabia, omkring 400 km sørøst for innerste del av Aqababukta, der karavaneveien fra Sør-Arabia til Mesopotamia og Syria møtte veien over til kysten av Rødehavet. I Første Mosebok er Tema en av Ismaels tolv sønner, det vil si en arabisk stamme, og oasen var dens sete. En saudisk-tysk ekspedisjon har gravd der siden 2004 og har sporet bosetningen tilbake til minst 3. årtusen f.Kr.; en ummuret oaseby sto der i bronsealderen, i 2. årtusen f.Kr., og den lange ringmuren løper fortsatt over sletten."
    - "Assyriske og babylonske kilder kjenner stedet. Tiglat-Pileser III oppfører Tema blant de arabiske folkene som sendte ham gull, sølv, kameler og krydder som tributt i 730-årene f.Kr. Nabonid, Babylons siste konge, forlot Babylon til sønnen Belsasar og bodde i Tema i ti år, fra omkring 553 til 543 f.Kr., slik Harran-stelen hans og den babylonske krønike forteller; fragmenter av en stele med hans navn og bilde er funnet i selve Tayma, og en bønn av Nabonid blant Dødehavsrullene minnes årene hans der. En arameisk stele fra persisk tid fra Tayma, nå i Louvre, forteller om innføringen av kulten for en ny gud i byen."
    - "Bibelen ser Tema fra veien. Job sammenligner vennene sine med en wadi som tørker ut: «Temas karavaner speidet efter dem, Sjebas reisefølger satte sitt håp til dem». Jesajas utsagn mot Arabia roper på oasen om å møte flyktningene fra en krig i ørkenen: «Ut til de tørste fører de vann; de som bor i Temas land, kommer de flyktende i møte med brød». Jeremia rekker vredens beger til «Dedan og Tema og Bus». Elifas fra Teman i Job kommer fra Teman i Edom, et annet sted."
    - "Tayma er i dag en by i Tabuk-regionen i Saudi-Arabia. Den gamle brønnen Bir Haddaj, de gamle murene og de utgravde kvarterene ligger i og ved byen, og funnene vises i byens museum."
  tl:
    - "Ang Tema ay ang Tayma, isang dakilang oasis sa hilagang-kanluran ng Arabia, mga 400 km sa timog-silangan ng dulo ng Golpo ng Aqaba, kung saan nagtagpo ang daan ng mga caravan mula sa Timog Arabia patungong Mesopotamia at Siria at ang daan patungo sa baybayin ng Dagat na Pula. Sa Genesis, ang Tema ay isa sa labindalawang anak ni Ismael, iyon ay, isang tribong Arabe, at ang oasis ang luklukan nito. Ang ekspedisyong Saudi-Aleman ay naghuhukay roon mula 2004 at nasubaybayan ang paninirahan hanggang kahit ikatlong milenyo BK; may bayang oasis na may pader doon noong Panahong Tanso, noong ikalawang milenyo BK, at ang mahabang pader na nakapalibot dito ay tumatawid pa rin sa kapatagan."
    - "Kilala ng mga talaang Asirio at Babilonyo ang lugar. Itinatala ni Tiglath-pileser III ang Tema sa mga bayang Arabe na nagpadala sa kaniya ng ginto, pilak, kamelyo at espesya bilang buwis noong dekada 730 BK. Si Nabonido, ang huling hari ng Babilonia, ay iniwan ang Babilonia sa anak niyang si Belsasar at tumira sa Tema sa loob ng sampung taon, mula mga 553 hanggang 543 BK, ayon sa kaniyang estela ng Harran at sa salaysay ng Babilonia; may mga piraso ng estela na may pangalan at larawan niya na natagpuan sa Tayma mismo, at inaalala ng isang panalangin ni Nabonido sa Mga Balumbon sa Dagat na Patay ang kaniyang mga taon doon. Isang estelang Arameo ng panahong Persiyano mula sa Tayma, na nasa Louvre ngayon, ay nagtatala ng pagtatatag ng kulto ng isang bagong diyos sa bayan."
    - "Nakikita ng Biblia ang Tema mula sa daan. Inihahambing ni Job ang kaniyang mga kaibigan sa isang wadi na natutuyo: “Minasdan ng mga pulutong na mula sa Tema, hinintay ang mga yaon ng mga pulutong na mula sa Seba.” Tinatawag ng orakulo ni Isaias tungkol sa Arabia ang oasis upang salubungin ang mga takas ng isang digmaan sa disyerto: “Ang nauuhaw ay dinadalhan nila ng tubig; sinalubong ng mga nananahan sa lupain ng Tema na may kanilang tinapay ang mga bihag.” Iniaabot ni Jeremias ang saro ng poot kay “Dedan, at ang Tema, at ang Buz”. Si Eliphaz na Temanita sa Job ay mula sa Teman sa Edom, ibang lugar."
    - "Ang Tayma ngayon ay bayan ng rehiyon ng Tabuk ng Saudi Arabia. Ang sinaunang balong Bir Haddaj, ang mga lumang pader at ang mga hinukay na purok ay nasa loob at sa tabi nito, at ang mga natagpuan ay ipinakikita sa museo ng bayan."
  da:
    - "Tema er Tayma, en stor oase i det nordvestlige Arabien, omkring 400 km sydøst for Aqababugtens inderste ende, hvor karavanevejen fra Sydarabien til Mesopotamien og Syrien mødte vejen over til Det Røde Havs kyst. I Første Mosebog er Tema en af Ismaels tolv sønner, det vil sige en arabisk stamme, og oasen var dens sæde. En saudisk-tysk ekspedition har udgravet der siden 2004 og har fulgt bosættelsen tilbage til mindst 3. årtusinde f.Kr.; en befæstet oaseby stod der i bronzealderen, i 2. årtusinde f.Kr., og dens lange omgivelsesmur løber stadig hen over sletten."
    - "Assyriske og babylonske optegnelser kender stedet. Tiglat-Pileser 3. opregner Tema blandt de arabiske folk, der sendte ham guld, sølv, kameler og krydderier som tribut i 730'erne f.Kr. Nabonid, Babylons sidste konge, forlod Babylon til sin søn Belsazar og boede i Tema i ti år, fra omkring 553 til 543 f.Kr., som hans Karan-stele og den babylonske krønike beretter; brudstykker af en stele med hans navn og billede er fundet i Tayma selv, og en bøn af Nabonid blandt Dødehavsrullerne husker hans år dér. En arameisk stele fra den persiske tid fra Tayma, nu i Louvre, beretter om indstiftelsen af en ny guds kult i byen."
    - "Bibelen ser Tema fra vejen. Job sammenligner sine venner med en wadi, der tørrer ud: »Rejsetog fra Thema skuede hen efter dem, vejfarende fra Seba satte Lid til dem«. Esajas' udsagn om Arabien kalder på oasen for at møde flygtningene fra en krig i ørkenen: »De komme den tørstige i Møde med Vand; Indbyggerne i Themas Land møde den flygtende med Brød«. Jeremias rækker vredens bæger til »Dedan og Thema og Bus«. Elifaz temaniten i Job kommer fra Teman i Edom, et andet sted."
    - "Tayma er i dag en by i Tabuk-regionen i Saudi-Arabien. Den gamle brønd Bir Haddaj, de gamle mure og de udgravede kvarterer ligger i og ved den, og fundene vises i byens museum."
  sr:
    - "Тема је Тејма, велика оаза на северозападу Арабије, неких 400 км југоисточно од дна Акапског залива, где се караванским путем из Јужне Арабије за Месопотамију и Сирију сретао пут ка обали Црвеног мора. У Постању је Тема један од дванаест синова Исмаилових, то јест арапско племе, а оаза је била његово седиште. Саудијско-немачка експедиција ископава онде од 2004. и пратила је насељеност уназад најмање до 3. миленијума п. н. е.; утврђен оазни град стајао је онде у бронзаном добу, током 2. миленијума п. н. е., а његов дугачки одбрамбени зид и данас прелази равницу."
    - "Асирски и вавилонски записи знају то место. Теглат-Феласар III наводи Тему међу арапским народима који су му у 730-им п. н. е. слали злато, сребро, камиле и зачине као данак. Набонид, последњи цар Вавилона, оставио је Вавилон сину Валтасару и живео у Теми десет година, од око 553. до 543. п. н. е., како бележе његова Харанска стела и вавилонска хроника; фрагменти стеле с његовим именом и ликом нађени су у самој Тејми, а молитва Набонидова међу кумранским свицима памти његове године онде. Арамејска стела из персијског доба из Тејме, сада у Лувру, бележи оснивање култа новог бога у граду."
    - "Библија гледа Тему с пута. Јов своје пријатеље пореди с вадијем који пресуши: „Путници из Теме погледаху, који иђаху у Севу уздаху се у њих“. Исаијина пророчка изрека о Арабији позива оазу да сретне избеглице једног рата у пустињи: „Изнесите воде пред жедне, који живите у земљи Теми, сретните с хлебом бегунца“. Јеремија међу онима којима даје чашу гнева набраја „Дедана и Тему и Вуза“. Елифас Теманац у Јову долази из Темана у Едому, другог места."
    - "Тејма је данас град у области Табук у Саудијској Арабији. Древни бунар Бир Хадађ, стари зидови и ископане четврти леже унутар и поред њега, а налази су изложени у градском музеју."
