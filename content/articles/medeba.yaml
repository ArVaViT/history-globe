# Overview article (ADR 0007). Mainstream facts only; the Mesha Stele is dated by its usual mid-ninth-century reckoning.
id: medeba
place: af4f21c
title:
  en: "Medeba"
  ru: "Медева"
  uk: "Мадаба"
  es: "Medeba"
  pt: "Medeba"
  de: "Medeba"
  fr: "Médeba"
body:
  en:
    - "Medeba, now Madaba in Jordan, stands on the plateau 30 km south-west of Amman, and the tableland around it is “the plain of Medeba” of Joshua, the Mishor between Heshbon and Dibon. The old song about Sihon says his Amorites “laid them waste even unto Nophah, which reacheth unto Medeba”; Joshua assigned the plain to Reuben. When the Ammonites hired Aramean chariots against David, they “came and pitched before Medeba”, and Joab beat them there."
    - "Mesha's stele says that Omri, king of Israel, had taken the land of Medeba and Israel lived in it in his days and half his son's, forty years, until Chemosh restored it in Mesha's time; so Isaiah's oracle has Moab howling “over Nebo, and over Medeba”. In 1 Maccabees the sons of Jambri of Medeba kidnapped and killed John, brother of Jonathan Maccabee, and were ambushed at a wedding; John Hyrcanus took Medeba after a six-month siege about 128 BC, and his grandson Hyrcanus II promised to return it to the Nabataean king Aretas. From AD 106 it belonged to the Roman province of Arabia, struck coins and became a Christian city with a bishop."
    - "Madaba's fame is its mosaics. In 1884 the Christian Arabs who resettled the abandoned town from Kerak found, under the floor of a church they were rebuilding, the mosaic map of the Holy Land made about 560–565, with Jerusalem drawn street by street; it was published in 1897 and is still in the church of Saint George. Dozens of other pavements of the sixth and seventh centuries, in the church of the Virgin, the Hippolytus Hall and the church of the Apostles, have made Madaba “the city of mosaics”. Excavation on the tell by Timothy Harrison's team has reached Iron Age fortifications under the Roman street."
    - "Today Madaba is the capital of a governorate of about 200,000 people, with a large Christian community, an archaeological park and a school of mosaics, a few kilometres from Mount Nebo."
  ru:
    - "Медева, ныне Мадаба в Иордании, стоит на плато в 30 км к юго-западу от Аммана, а плоскогорье вокруг неё — «равнина Медева» книги Иисуса Навина, Мишор между Есевоном и Дивоном. Древняя песнь о Сигоне говорит, что его Аморреи опустошили землю «до Нофы, которая близ Медевы»; Иисус Навин отдал равнину Рувиму. Когда Аммонитяне наняли арамейские колесницы против Давида, те «пришли и расположились станом пред Медевою», и Иоав разбил их там."
    - "Стела Меши говорит, что Амврий, царь Израильский, взял землю Медевы и Израиль жил в ней в его дни и половину дней его сына, сорок лет, пока Хамос не вернул её во дни Месы; потому в пророчестве Исаии «Моав рыдает над Нево и Медевою». В Первой книге Маккавейской сыны Иамврия из Медевы похитили и убили Иоанна, брата Ионафана Маккавея, и попали в засаду на свадьбе; Иоанн Гиркан взял Медеву после шестимесячной осады около 128 г. до н. э., а его внук Гиркан II обещал вернуть её набатейскому царю Арете. С 106 г. н. э. она принадлежала римской провинции Аравия, чеканила монету и стала христианским городом с епископом."
    - "Слава Мадабы — её мозаики. В 1884 году арабы-христиане, заселившие покинутый город из Керака, нашли под полом церкви, которую перестраивали, мозаичную карту Святой земли, сделанную около 560–565 годов, с Иерусалимом, нарисованным улица за улицей; её издали в 1897 году, и она до сих пор в церкви святого Георгия. Десятки других полов VI–VII веков, в церкви Богородицы, зале Ипполита и церкви Апостолов, сделали Мадабу «городом мозаик». Раскопки на холме под руководством Тимоти Харрисона дошли до укреплений железного века под римской улицей."
    - "Сегодня Мадаба — столица провинции примерно на 200 тысяч жителей, с большой христианской общиной, археологическим парком и школой мозаики, в нескольких километрах от горы Нево."
  uk:
    - "Мадаба, давня Медева, нині Мадаба в Йорданії, стоїть на плато за 30 км на південний захід від Амана, а плоскогір’я навколо неї — це «все подїллє Медева» Ісуса Навина, Мішор між Гесбоном і Дівоном. Давня пісня про Сігона каже, що його аморії «від Нофи огнем спалили села до Медеби»; Ісус Навин віддав рівнину Рувимові. Коли аммонійці найняли арамейські колесниці проти Давида, вони «прийшли й стали станом перед Медевою», і Йоав розбив їх там."
    - "Стела Меші каже, що Омрі, цар Ізраїлю, захопив землю Медеви, і Ізраїль жив у ній за його днів і половини днів його сина, сорок років, доки Хемош не повернув її за часів Меші; тому пророцтво Ісаї змальовує Моав, що ридає «над Набою й Медевою». У Першій книзі Макавеїв сини Ямбрі з Медеви схопили й убили Іоанна, брата Йонатана Макавея, і були підстережені на весіллі; Іоанн Гіркан узяв Медеву після шестимісячної облоги близько 128 р. до н. е., а його онук Гіркан II обіцяв повернути її набатейському цареві Ареті. Від 106 р. н. е. вона належала до римської провінції Аравія, карбувала монети і стала християнським містом з єпископом."
    - "Слава Мадаби — її мозаїки. 1884 р. християни-араби, що знову заселили покинуте місто з Керака, знайшли під підлогою церкви, яку відбудовували, мозаїчну мапу Святої землі, виготовлену близько 560–565 рр., з Єрусалимом, намальованим вулиця за вулицею; її опублікували 1897 р., і вона досі в церкві святого Юрія. Десятки інших підлог VI–VII ст., у церкві Діви Марії, залі Іполіта та церкві Апостолів, зробили Мадабу «містом мозаїк». Розкопки на теллі групи Тімоті Гаррісона дійшли до укріплень залізної доби під римською вулицею."
    - "Сьогодні Мадаба — столиця мухафази з приблизно 200 000 мешканців, із великою християнською громадою, археологічним парком і школою мозаїки, за кілька кілометрів від гори Нево."
  es:
    - "Medeba, hoy Madaba en Jordania, se alza en la meseta a 30 km al sudoeste de Amán, y la tierra alta que la rodea es «la campiña de Medeba» de Josué, el Mishor entre Hesbón y Dibón. La antigua canción sobre Sehón y sus amorreos dice: «devastamos el reino de ellos [...] y destruimos hasta Nopha y Medeba»; Josué asignó la llanura a Rubén. Cuando los amonitas contrataron carros arameos contra David, «vinieron y asentaron su campo delante de Medeba», y Joab los derrotó allí."
    - "La estela de Mesa dice que Omri, rey de Israel, había tomado la tierra de Medeba e Israel vivió en ella en sus días y la mitad de los de su hijo, cuarenta años, hasta que Quemós la devolvió en tiempos de Mesa; por eso el oráculo de Isaías hace aullar a Moab «sobre Nebo y sobre Medeba». En 1 Macabeos, los hijos de Jambri, de Medeba, secuestraron y mataron a Juan, hermano de Jonatán Macabeo, y fueron emboscados en una boda; Juan Hircano tomó Medeba tras un asedio de seis meses hacia 128 a. C., y su nieto Hircano II prometió devolverla al rey nabateo Aretas. Desde 106 d. C. perteneció a la provincia romana de Arabia, acuñó moneda y se convirtió en una ciudad cristiana con obispo."
    - "La fama de Madaba son sus mosaicos. En 1884, los árabes cristianos que repoblaron la ciudad abandonada desde Kerak hallaron, bajo el suelo de una iglesia que reconstruían, el mapa-mosaico de Tierra Santa realizado hacia 560–565, con Jerusalén dibujada calle por calle; fue publicado en 1897 y sigue en la iglesia de San Jorge. Docenas de otros pavimentos de los siglos VI y VII, en la iglesia de la Virgen, la Sala de Hipólito y la iglesia de los Apóstoles, han hecho de Madaba «la ciudad de los mosaicos». La excavación en el tell por el equipo de Timothy Harrison ha alcanzado fortificaciones de la Edad del Hierro bajo la calle romana."
    - "Hoy Madaba es la capital de una gobernación de unos 200 000 habitantes, con una gran comunidad cristiana, un parque arqueológico y una escuela de mosaicos, a pocos kilómetros del monte Nebo."
  pt:
    - "Medeba, hoje Madaba, na Jordânia, ergue-se no planalto a 30 km a sudoeste de Amã, e a terra alta ao redor é “a planície de Medeba” de Josué, o Mishor entre Hesbom e Dibom. O velho cântico sobre Seom diz: “Nós devastamos até Nofá, que se estende até Medeba”; Josué atribuiu a planície a Rúben. Quando os amonitas contrataram carros arameus contra Davi, “vieram e acamparam perto de Medeba”, e Joabe os derrotou ali."
    - "A estela de Mesa diz que Onri, rei de Israel, tomara a terra de Medeba e que Israel habitou nela em seus dias e na metade dos de seu filho, quarenta anos, até que Camos a restituiu no tempo de Mesa; assim, o oráculo de Isaías faz Moabe lamentar “sobre Nebo e sobre Medeba”. Em 1 Macabeus, os filhos de Jambri, de Medeba, sequestraram e mataram João, irmão de Jônatas Macabeu, e foram emboscados num casamento; João Hircano tomou Medeba depois de um cerco de seis meses por volta de 128 a.C., e seu neto Hircano II prometeu devolvê-la ao rei nabateu Aretas. Desde 106 d.C. pertenceu à província romana da Arábia, cunhou moedas e tornou-se cidade cristã com um bispo."
    - "A fama de Madaba são seus mosaicos. Em 1884, os árabes cristãos que repovoaram a cidade abandonada, vindos de Kerak, encontraram sob o piso de uma igreja que reconstruíam o mapa-mosaico da Terra Santa feito por volta de 560–565, com Jerusalém desenhada rua por rua; foi publicado em 1897 e ainda está na igreja de São Jorge. Dezenas de outros pavimentos dos séculos VI e VII, na igreja da Virgem, no Salão de Hipólito e na igreja dos Apóstolos, fizeram de Madaba “a cidade dos mosaicos”. A escavação no tell pela equipe de Timothy Harrison alcançou fortificações da Idade do Ferro sob a rua romana."
    - "Hoje Madaba é a capital de uma província de cerca de 200.000 habitantes, com uma grande comunidade cristã, um parque arqueológico e uma escola de mosaicos, a poucos quilômetros do monte Nebo."
  de:
    - "Medeba, heute Madaba in Jordanien, liegt auf der Hochebene 30 km südwestlich von Amman, und das Hochland ringsum ist bei Josua „die ganze Ebene Medeba“, der Mischor zwischen Heschbon und Dibon. Das alte Lied über Sihon sagt: „sie ist verstört bis gen Nophah, die da langt bis gen Medeba“; Josua wies die Ebene Ruben zu. Als die Ammoniter aramäische Wagen gegen David dingten, hieß es: „die kamen und lagerten sich vor Medeba“, und Joab schlug sie dort."
    - "Mesas Stele sagt, dass Omri, König von Israel, das Land Medeba genommen hatte und Israel darin zu seiner Zeit und der Hälfte der Zeit seines Sohnes wohnte, vierzig Jahre, bis Kemosch es zu Mesas Zeit zurückgab; so heißt es im Spruch Jesajas, Moab werde „heulen über Nebo und Medeba“. Im 1. Makkabäerbuch entführten und töteten die Söhne Jambris aus Medeba Johannes, den Bruder Jonatans, des Makkabäers, und wurden bei einer Hochzeit überfallen; Johannes Hyrkanos nahm Medeba nach sechsmonatiger Belagerung um 128 v. Chr. ein, und sein Enkel Hyrkanos II. versprach, es dem Nabatäerkönig Aretas zurückzugeben. Ab 106 n. Chr. gehörte es zur römischen Provinz Arabien, prägte Münzen und wurde eine christliche Stadt mit einem Bischof."
    - "Madabas Ruhm sind seine Mosaiken. 1884 fanden die christlichen Araber, die die verlassene Stadt aus Kerak neu besiedelten, unter dem Boden einer Kirche, die sie wieder aufbauten, die Mosaikkarte des Heiligen Landes aus der Zeit um 560–565, mit Jerusalem Straße für Straße gezeichnet; sie wurde 1897 veröffentlicht und befindet sich noch in der Georgskirche. Dutzende weitere Pavimente des 6. und 7. Jahrhunderts in der Jungfrauenkirche, der Hippolytos-Halle und der Apostelkirche haben Madaba zur „Stadt der Mosaiken“ gemacht. Grabungen auf dem Tell durch Timothy Harrisons Team haben unter der römischen Straße eisenzeitliche Befestigungen erreicht."
    - "Heute ist Madaba Hauptstadt eines Gouvernements mit etwa 200.000 Menschen, mit einer großen christlichen Gemeinde, einem archäologischen Park und einer Mosaikschule, wenige Kilometer vom Berg Nebo."
  fr:
    - "Médeba, aujourd’hui Madaba en Jordanie, se dresse sur le plateau à 30 km au sud-ouest d’Amman, et le haut pays qui l’entoure est « toute la plaine de Médeba » de Josué, le Mishor entre Hesbon et Dibon. Le vieux chant sur Sihon dit que ses Amoréens dévastèrent le pays « jusqu’à Nophach, jusqu’à Médeba » ; Josué attribua la plaine à Ruben. Quand les Ammonites engagèrent des chars araméens contre David, ils « vinrent camper devant Médeba », et Joab les y battit."
    - "La stèle de Mescha dit qu’Omri, roi d’Israël, avait pris le pays de Médeba et qu’Israël y vécut de son temps et pendant la moitié de celui de son fils, quarante ans, jusqu’à ce que Kemosch le restituât au temps de Mescha ; ainsi, dans l’oracle d’Ésaïe, Moab se lamente « sur Nebo et sur Médeba ». Dans 1 Maccabées, les fils de Jambri de Médeba enlevèrent et tuèrent Jean, frère de Jonathan Maccabée, et furent pris en embuscade lors d’un mariage ; Jean Hyrcan prit Médeba après un siège de six mois vers 128 av. J.-C., et son petit-fils Hyrcan II promit de la rendre au roi nabatéen Arétas. À partir de 106 apr. J.-C., elle appartint à la province romaine d’Arabie, frappa monnaie et devint une ville chrétienne avec un évêque."
    - "La célébrité de Madaba tient à ses mosaïques. En 1884, les Arabes chrétiens qui repeuplèrent la ville abandonnée en venant de Kerak trouvèrent, sous le sol d’une église qu’ils reconstruisaient, la carte-mosaïque de la Terre sainte réalisée vers 560–565, avec Jérusalem dessinée rue par rue ; publiée en 1897, elle se trouve toujours dans l’église Saint-Georges. Des dizaines d’autres pavements des VIe et VIIe siècles, dans l’église de la Vierge, la salle d’Hippolyte et l’église des Apôtres, ont fait de Madaba « la ville des mosaïques ». Les fouilles du tell par l’équipe de Timothy Harrison ont atteint des fortifications de l’âge du Fer sous la rue romaine."
    - "Aujourd’hui, Madaba est le chef-lieu d’un gouvernorat d’environ 200 000 habitants, avec une importante communauté chrétienne, un parc archéologique et une école de mosaïque, à quelques kilomètres du mont Nebo."
