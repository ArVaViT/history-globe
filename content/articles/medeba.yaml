body:
  en:
    - "Medeba, now Madaba in Jordan, stands on the plateau 30 km south-west of Amman, and the tableland around it is “the plain of Medeba” of Joshua, the Mishor between Heshbon and Dibon. The old song of Heshbon in Numbers ends, “we have laid them waste even unto Nophah, which reacheth unto Medeba”; Joshua assigned the plain to Reuben. When the Ammonites hired Aramean chariots against David, they “came and pitched before Medeba”, and Joab put them to flight."
    - "Mesha's stele says that Omri, king of Israel, had taken the land of Medeba and Israel lived in it in his days and half his son's, forty years, until Chemosh restored it in Mesha's time; so Isaiah's oracle has Moab howling “over Nebo, and over Medeba”. In 1 Maccabees the sons of Jambri of Medeba kidnapped and killed John, brother of Jonathan Maccabee, and were ambushed at a wedding; John Hyrcanus took Medeba after a six-month siege about 128 BC, and his grandson Hyrcanus II promised to return it to the Nabataean king Aretas. From AD 106 it belonged to the Roman province of Arabia, struck coins and became a Christian city with a bishop."
    - "Madaba's fame is its mosaics. In 1884 the Christian Arabs who resettled the abandoned town from Kerak found, under the floor of a church they were rebuilding, the mosaic map of the Holy Land, made in the sixth century after 542, with Jerusalem drawn street by street; it was published in 1897 and is still in the church of Saint George. Dozens of other pavements of the sixth and seventh centuries, in the church of the Virgin, the Hippolytus Hall and the church of the Apostles, have made Madaba “the city of mosaics”. Excavation on the tell by Timothy Harrison's team has uncovered a monumental pre-classical fortification wall and Iron Age houses."
    - "Today Madaba is the capital of a governorate of about 200,000 people, with a large Christian community, an archaeological park and a school of mosaics, a few kilometres from Mount Nebo."
  ru:
    - "Медева, ныне Мадаба в Иордании, стоит на плато в 30 км к юго-западу от Аммана, а плоскогорье вокруг неё — «равнина Медева» книги Иисуса Навина, Мишор между Есевоном и Дивоном. Древняя песнь о Есевоне в книге Чисел кончается словами: «мы опустошили их до Нофы, которая близ Медевы»; Иисус Навин отдал равнину Рувиму. Когда Аммонитяне наняли арамейские колесницы против Давида, те «пришли и расположились станом пред Медевою», и Иоав обратил их в бегство."
    - "Стела Меши говорит, что Амврий, царь Израильский, взял землю Медевы и Израиль жил в ней в его дни и половину дней его сына, сорок лет, пока Хамос не вернул её во дни Месы; потому в пророчестве Исаии «Моав рыдает над Нево и Медевою». В Первой книге Маккавейской сыны Иамврия из Медевы похитили и убили Иоанна, брата Ионафана Маккавея, и попали в засаду на свадьбе; Иоанн Гиркан взял Медеву после шестимесячной осады около 128 г. до н. э., а его внук Гиркан II обещал вернуть её набатейскому царю Арете. С 106 г. н. э. она принадлежала римской провинции Аравия, чеканила монету и стала христианским городом с епископом."
    - "Слава Мадабы — её мозаики. В 1884 году арабы-христиане, заселившие покинутый город из Керака, нашли под полом церкви, которую перестраивали, мозаичную карту Святой земли, сделанную в VI веке после 542 года, с Иерусалимом, нарисованным улица за улицей; её издали в 1897 году, и она до сих пор в церкви святого Георгия. Десятки других полов VI–VII веков, в церкви Богородицы, зале Ипполита и церкви Апостолов, сделали Мадабу «городом мозаик». Раскопки на холме под руководством Тимоти Харрисона открыли монументальную доклассическую крепостную стену и дома железного века."
    - "Сегодня Мадаба — столица провинции примерно на 200 тысяч жителей, с большой христианской общиной, археологическим парком и школой мозаики, в нескольких километрах от горы Нево."
  uk:
    - "Мадаба, давня Медева, нині Мадаба в Йорданії, стоїть на плато за 30 км на південний захід від Амана, а плоскогір’я навколо неї — це «все подїллє Медева» Ісуса Навина, Мішор між Гесбоном і Дівоном. Давня пісня про Гесбон у Книзі Чисел закінчується словами: «від Нофи огнем спалили села до Медеби»; Ісус Навин віддав рівнину Рувимові. Коли аммонійці найняли арамейські колесниці проти Давида, вони «прийшли й стали станом перед Медевою», і Йоав обернув їх на втечу."
    - "Стела Меші каже, що Омрі, цар Ізраїлю, захопив землю Медеви, і Ізраїль жив у ній за його днів і половини днів його сина, сорок років, доки Хемош не повернув її за часів Меші; тому пророцтво Ісаї змальовує Моав, що ридає «над Набою й Медевою». У Першій книзі Макавеїв сини Ямбрі з Медеви схопили й убили Іоанна, брата Йонатана Макавея, і були підстережені на весіллі; Іоанн Гіркан узяв Медеву після шестимісячної облоги близько 128 р. до н. е., а його онук Гіркан II обіцяв повернути її набатейському цареві Ареті. Від 106 р. н. е. вона належала до римської провінції Аравія, карбувала монети і стала християнським містом з єпископом."
    - "Слава Мадаби — її мозаїки. 1884 р. християни-араби, що знову заселили покинуте місто з Керака, знайшли під підлогою церкви, яку відбудовували, мозаїчну мапу Святої землі, виготовлену в VI ст. після 542 р., з Єрусалимом, намальованим вулиця за вулицею; її опублікували 1897 р., і вона досі в церкві святого Юрія. Десятки інших підлог VI–VII ст., у церкві Діви Марії, залі Іполіта та церкві Апостолів, зробили Мадабу «містом мозаїк». Розкопки на теллі групи Тімоті Гаррісона відкрили монументальний докласичний оборонний мур і будинки залізної доби."
    - "Сьогодні Мадаба — столиця мухафази з приблизно 200 000 мешканців, із великою християнською громадою, археологічним парком і школою мозаїки, за кілька кілометрів від гори Нево."
  es:
    - "Medeba, hoy Madaba en Jordania, se alza en la meseta a 30 km al sudoeste de Amán, y la tierra alta que la rodea es «la campiña de Medeba» de Josué, el Mishor entre Hesbón y Dibón. La antigua canción de Hesbón en Números termina: «y destruimos hasta Nopha y Medeba»; Josué asignó la llanura a Rubén. Cuando los amonitas contrataron carros arameos contra David, «vinieron y asentaron su campo delante de Medeba», y Joab los puso en fuga."
    - "La estela de Mesa dice que Omri, rey de Israel, había tomado la tierra de Medeba e Israel vivió en ella en sus días y la mitad de los de su hijo, cuarenta años, hasta que Quemós la devolvió en tiempos de Mesa; por eso el oráculo de Isaías hace aullar a Moab «sobre Nebo y sobre Medeba». En 1 Macabeos, los hijos de Jambri, de Medeba, secuestraron y mataron a Juan, hermano de Jonatán Macabeo, y fueron emboscados en una boda; Juan Hircano tomó Medeba tras un asedio de seis meses hacia 128 a. C., y su nieto Hircano II prometió devolverla al rey nabateo Aretas. Desde 106 d. C. perteneció a la provincia romana de Arabia, acuñó moneda y se convirtió en una ciudad cristiana con obispo."
    - "La fama de Madaba son sus mosaicos. En 1884, los árabes cristianos que repoblaron la ciudad abandonada desde Kerak hallaron, bajo el suelo de una iglesia que reconstruían, el mapa-mosaico de Tierra Santa realizado en el siglo VI después de 542, con Jerusalén dibujada calle por calle; fue publicado en 1897 y sigue en la iglesia de San Jorge. Docenas de otros pavimentos de los siglos VI y VII, en la iglesia de la Virgen, la Sala de Hipólito y la iglesia de los Apóstoles, han hecho de Madaba «la ciudad de los mosaicos». La excavación en el tell por el equipo de Timothy Harrison ha descubierto una muralla monumental preclásica y casas de la Edad del Hierro."
    - "Hoy Madaba es la capital de una gobernación de unos 200 000 habitantes, con una gran comunidad cristiana, un parque arqueológico y una escuela de mosaicos, a pocos kilómetros del monte Nebo."
  pt:
    - "Medeba, hoje Madaba, na Jordânia, ergue-se no planalto a 30 km a sudoeste de Amã, e a terra alta ao redor é “a planície de Medeba” de Josué, o Mishor entre Hesbom e Dibom. O velho cântico de Hesbom em Números termina: “Nós devastamos até Nofá, que se estende até Medeba”; Josué atribuiu a planície a Rúben. Quando os amonitas contrataram carros arameus contra Davi, “vieram e acamparam perto de Medeba”, e Joabe os pôs em fuga."
    - "A estela de Mesa diz que Onri, rei de Israel, tomara a terra de Medeba e que Israel habitou nela em seus dias e na metade dos de seu filho, quarenta anos, até que Camos a restituiu no tempo de Mesa; assim, o oráculo de Isaías faz Moabe lamentar “sobre Nebo e sobre Medeba”. Em 1 Macabeus, os filhos de Jambri, de Medeba, sequestraram e mataram João, irmão de Jônatas Macabeu, e foram emboscados num casamento; João Hircano tomou Medeba depois de um cerco de seis meses por volta de 128 a.C., e seu neto Hircano II prometeu devolvê-la ao rei nabateu Aretas. Desde 106 d.C. pertenceu à província romana da Arábia, cunhou moedas e tornou-se cidade cristã com um bispo."
    - "A fama de Madaba são seus mosaicos. Em 1884, os árabes cristãos que repovoaram a cidade abandonada, vindos de Kerak, encontraram sob o piso de uma igreja que reconstruíam o mapa-mosaico da Terra Santa feito no século VI depois de 542, com Jerusalém desenhada rua por rua; foi publicado em 1897 e ainda está na igreja de São Jorge. Dezenas de outros pavimentos dos séculos VI e VII, na igreja da Virgem, no Salão de Hipólito e na igreja dos Apóstolos, fizeram de Madaba “a cidade dos mosaicos”. A escavação no tell pela equipe de Timothy Harrison descobriu uma muralha monumental pré-clássica e casas da Idade do Ferro."
    - "Hoje Madaba é a capital de uma província de cerca de 200.000 habitantes, com uma grande comunidade cristã, um parque arqueológico e uma escola de mosaicos, a poucos quilômetros do monte Nebo."
  de:
    - "Medeba, heute Madaba in Jordanien, liegt auf der Hochebene 30 km südwestlich von Amman, und das Hochland ringsum ist bei Josua „die ganze Ebene Medeba“, der Mischor zwischen Heschbon und Dibon. Das alte Lied von Heschbon im vierten Buch Mose endet: „sie ist verstört bis gen Nophah, die da langt bis gen Medeba“; Josua wies die Ebene Ruben zu. Als die Ammoniter aramäische Wagen gegen David dingten, hieß es: „die kamen und lagerten sich vor Medeba“, und Joab schlug sie in die Flucht."
    - "Mesas Stele sagt, dass Omri, König von Israel, das Land Medeba genommen hatte und Israel darin zu seiner Zeit und der Hälfte der Zeit seines Sohnes wohnte, vierzig Jahre, bis Kemosch es zu Mesas Zeit zurückgab; so heißt es im Spruch Jesajas, Moab werde „heulen über Nebo und Medeba“. Im 1. Makkabäerbuch entführten und töteten die Söhne Jambris aus Medeba Johannes, den Bruder Jonatans, des Makkabäers, und wurden bei einer Hochzeit überfallen; Johannes Hyrkanos nahm Medeba nach sechsmonatiger Belagerung um 128 v. Chr. ein, und sein Enkel Hyrkanos II. versprach, es dem Nabatäerkönig Aretas zurückzugeben. Ab 106 n. Chr. gehörte es zur römischen Provinz Arabien, prägte Münzen und wurde eine christliche Stadt mit einem Bischof."
    - "Madabas Ruhm sind seine Mosaiken. 1884 fanden die christlichen Araber, die die verlassene Stadt aus Kerak neu besiedelten, unter dem Boden einer Kirche, die sie wieder aufbauten, die Mosaikkarte des Heiligen Landes, entstanden im 6. Jahrhundert nach 542, mit Jerusalem Straße für Straße gezeichnet; sie wurde 1897 veröffentlicht und befindet sich noch in der Georgskirche. Dutzende weitere Pavimente des 6. und 7. Jahrhunderts in der Jungfrauenkirche, der Hippolytos-Halle und der Apostelkirche haben Madaba zur „Stadt der Mosaiken“ gemacht. Grabungen auf dem Tell durch Timothy Harrisons Team haben eine monumentale vorklassische Befestigungsmauer und eisenzeitliche Häuser freigelegt."
    - "Heute ist Madaba Hauptstadt eines Gouvernements mit etwa 200.000 Menschen, mit einer großen christlichen Gemeinde, einem archäologischen Park und einer Mosaikschule, wenige Kilometer vom Berg Nebo."
  fr:
    - "Médeba, aujourd’hui Madaba en Jordanie, se dresse sur le plateau à 30 km au sud-ouest d’Amman, et le haut pays qui l’entoure est « toute la plaine de Médeba » de Josué, le Mishor entre Hesbon et Dibon. Le vieux chant de Hesbon dans les Nombres s’achève ainsi : « Nous avons étendu nos ravages jusqu’à Nophach, Jusqu’à Médeba » ; Josué attribua la plaine à Ruben. Quand les Ammonites engagèrent des chars araméens contre David, ils « vinrent camper devant Médeba », et Joab les mit en fuite."
    - "La stèle de Mescha dit qu’Omri, roi d’Israël, avait pris le pays de Médeba et qu’Israël y vécut de son temps et pendant la moitié de celui de son fils, quarante ans, jusqu’à ce que Kemosch le restituât au temps de Mescha ; ainsi, dans l’oracle d’Ésaïe, Moab se lamente « sur Nebo et sur Médeba ». Dans 1 Maccabées, les fils de Jambri de Médeba enlevèrent et tuèrent Jean, frère de Jonathan Maccabée, et furent pris en embuscade lors d’un mariage ; Jean Hyrcan prit Médeba après un siège de six mois vers 128 av. J.-C., et son petit-fils Hyrcan II promit de la rendre au roi nabatéen Arétas. À partir de 106 apr. J.-C., elle appartint à la province romaine d’Arabie, frappa monnaie et devint une ville chrétienne avec un évêque."
    - "La célébrité de Madaba tient à ses mosaïques. En 1884, les Arabes chrétiens qui repeuplèrent la ville abandonnée en venant de Kerak trouvèrent, sous le sol d’une église qu’ils reconstruisaient, la carte-mosaïque de la Terre sainte réalisée au VIe siècle après 542, avec Jérusalem dessinée rue par rue ; publiée en 1897, elle se trouve toujours dans l’église Saint-Georges. Des dizaines d’autres pavements des VIe et VIIe siècles, dans l’église de la Vierge, la salle d’Hippolyte et l’église des Apôtres, ont fait de Madaba « la ville des mosaïques ». Les fouilles du tell par l’équipe de Timothy Harrison ont mis au jour un rempart monumental préclassique et des maisons de l’âge du Fer."
    - "Aujourd’hui, Madaba est le chef-lieu d’un gouvernorat d’environ 200 000 habitants, avec une importante communauté chrétienne, un parc archéologique et une école de mosaïque, à quelques kilomètres du mont Nebo."
  it:
    - "Medeba, oggi Màdaba in Giordania, sorge sull’altopiano a 30 km a sud-ovest di Amman, e il tavolato intorno ad essa è «tutto l’altipiano di Medeba» di Giosuè, il Mishor tra Chesbon e Dibon. L’antico canto di Chesbon nei Numeri si chiude così: «Abbiam tutto devastato fino a Nofah, il fuoco è giunto fino a Medeba»; Giosuè assegnò l’altopiano a Ruben. Quando gli Ammoniti presero al soldo carri aramei contro Davide, «vennero ad accamparsi dirimpetto a Medeba», e Ioab li mise in fuga."
    - "La stele di Mesa dice che Omri, re d’Israele, aveva preso la terra di Màdaba e che Israele vi abitò ai suoi giorni e per metà dei giorni di suo figlio, quarant’anni, finché Chemosh la restituì al tempo di Mesa; così l’oracolo di Isaia fa urlare Moab «su Nebo e su Medeba». Nel primo libro dei Maccabei i figli di Iambri di Màdaba rapirono e uccisero Giovanni, fratello di Gionata Maccabeo, e furono assaliti in un’imboscata a un matrimonio; Giovanni Ircano prese Màdaba dopo un assedio di sei mesi verso il 128 a.C., e suo nipote Ircano II promise di restituirla al re nabateo Areta. Dal 106 d.C. appartenne alla provincia romana d’Arabia, batté moneta e divenne una città cristiana con un vescovo."
    - "La fama di Màdaba sono i suoi mosaici. Nel 1884 i cristiani arabi che ripopolarono la città abbandonata venendo da Kerak trovarono, sotto il pavimento di una chiesa che stavano ricostruendo, la mappa musiva della Terra Santa realizzata nel VI secolo dopo il 542, con Gerusalemme disegnata strada per strada; fu pubblicata nel 1897 e si trova ancora nella chiesa di San Giorgio. Decine di altri pavimenti dei secoli VI e VII, nella chiesa della Vergine, nella Sala di Ippolito e nella chiesa degli Apostoli, hanno fatto di Màdaba «la città dei mosaici». Lo scavo sul tell della squadra di Timothy Harrison ha portato alla luce un monumentale muro di fortificazione preclassico e case dell’età del Ferro."
    - "Oggi Màdaba è il capoluogo di un governatorato di circa 200.000 abitanti, con una grande comunità cristiana, un parco archeologico e una scuola di mosaico, a pochi chilometri dal Monte Nebo."
  pl:
    - "Medeba, dziś Madaba w Jordanii, leży na płaskowyżu 30 km na południowy zachód od Ammanu, a otaczająca ją wyżyna to Mishor między Cheszbonem a Dibonem, u Jozuego „wszystkę równinę Medeba aż do Dybon”. Stara pieśń o Cheszbonie w Księdze Liczb kończy się słowami: „poburzyliśmy je aż do Nofe, które idzie aż do Medady”; Jozue przydzielił równinę Rubenowi. Gdy Ammonici najęli aramejskie rydwany przeciw Dawidowi, „położyli się obozem przeciw Medeba”, a Joab zmusił ich do ucieczki."
    - "Stela Meszy mówi, że Omri, król Izraela, zajął ziemię Medeby i Izrael mieszkał w niej za jego dni i za połowy dni jego syna, czterdzieści lat, aż Kemosz przywrócił ją za czasów Meszy; tak wyrocznia Izajasza każe Moabowi zawodzić „nad Nebo, i nad Medebą”. W 1 Księdze Machabejskiej synowie Jambriego z Medeby porwali i zabili Jana, brata Jonatana Machabeusza, i zostali zaskoczeni w zasadzce na weselu; Jan Hyrkan zdobył Medebę po sześciomiesięcznym oblężeniu około 128 r. p.n.e., a jego wnuk Hyrkan II obiecał zwrócić ją królowi Nabatejczyków Aretasowi. Od 106 r. n.e. należała do rzymskiej prowincji Arabia, biła monety i stała się chrześcijańskim miastem z biskupem."
    - "Sławą Madaby są jej mozaiki. W 1884 r. chrześcijańscy Arabowie, którzy zasiedlili opuszczone miasto z Keraku, znaleźli pod posadzką odbudowywanego kościoła mozaikową mapę Ziemi Świętej wykonaną w VI wieku po 542 roku, z Jerozolimą narysowaną ulica po ulicy; opublikowano ją w 1897 r. i wciąż znajduje się w kościele św. Jerzego. Dziesiątki innych posadzek z VI i VII w., w kościele Dziewicy, Sali Hipolita i kościele Apostołów, uczyniły Madabę „miastem mozaik”. Wykopaliska na tellu prowadzone przez zespół Timothy'ego Harrisona odsłoniły monumentalny przedklasyczny mur obronny i domy z epoki żelaza."
    - "Dziś Madaba jest stolicą muhafazy liczącej około 200 000 mieszkańców, z dużą wspólnotą chrześcijańską, parkiem archeologicznym i szkołą mozaik, kilka kilometrów od góry Nebo."
  nl:
    - "Medeba, nu Madaba in Jordanië, ligt op het plateau 30 km ten zuidwesten van Amman, en het hoogland eromheen is “het vlakke land van Medeba” van Jozua, de Mishor tussen Chesbon en Dibon. Het oude lied van Chesbon in Numeri eindigt: “wij hebben hen verwoest tot Nofat toe, welke tot Medeba toe reikt”; Jozua gaf de vlakte aan Ruben. Toen de Ammonieten Arameese wagens tegen David huurden, “kwamen en legerden zich voor Medeba”, en Joab sloeg hen op de vlucht."
    - "Mesa's stèle zegt dat Omri, koning van Israël, het land van Medeba had ingenomen en dat Israël er in zijn dagen en de helft van die van zijn zoon woonde, veertig jaar, tot Kemos het in Mesa's tijd herstelde; zo staat in Jesaja's godsspraak: “over Nebo en over Medeba zal Moab huilen”. In 1 Makkabeeën ontvoerden en doodden de zonen van Jambri van Medeba Johannes, de broer van Jonatan Makkabeüs, en werden bij een bruiloft in een hinderlaag gelokt; Johannes Hyrcanus nam Medeba in na een beleg van zes maanden omstreeks 128 v.Chr., en zijn kleinzoon Hyrcanus II beloofde het terug te geven aan de Nabatese koning Aretas. Vanaf 106 n.Chr. behoorde het tot de Romeinse provincie Arabië, sloeg munten en werd een christelijke stad met een bisschop."
    - "Madaba's roem zijn zijn mozaïeken. In 1884 vonden de christelijke Arabieren die de verlaten stad vanuit Kerak opnieuw bevolkten, onder de vloer van een kerk die zij herbouwden, de mozaïekkaart van het Heilige Land uit de zesde eeuw, van na 542, met Jeruzalem straat voor straat getekend; ze werd in 1897 gepubliceerd en ligt nog steeds in de kerk van Sint-Joris. Tientallen andere vloeren uit de zesde en zevende eeuw, in de kerk van de Maagd, de Hippolytuszaal en de kerk van de Apostelen, hebben van Madaba “de stad van de mozaïeken” gemaakt. Opgraving op de tell door het team van Timothy Harrison heeft een monumentale voorklassieke vestingmuur en huizen uit de IJzertijd blootgelegd."
    - "Tegenwoordig is Madaba de hoofdstad van een gouvernement van ongeveer 200.000 mensen, met een grote christelijke gemeenschap, een archeologisch park en een mozaïekschool, enkele kilometers van de berg Nebo."
  cs:
    - "Medeba, dnes Madaba v Jordánsku, leží na náhorní rovině 30 km jihozápadně od Ammánu a okolní tabulová země je Jozuovo Mišor mezi Chešbónem a Dibonem, „všecky roviny Medaba“. Stará píseň o Chešbónu v Numeri končí: „vyhladili jsme je až do Nofe, kteréž jest až k Medaba“; Jozue přidělil rovinu Rúbenovi. Když Amónci najali aramejské vozy proti Davidovi, „položili se s vojskem naproti Medaba“ a Joáb je zahnal na útěk."
    - "Mešova stéla praví, že Omrí, král Izraele, zabral zemi Medeby a Izrael v ní bydlil za jeho dnů a za polovinu dnů jeho syna, čtyřicet let, dokud ji Kemoš nevrátil za Mešových časů; proto Izajášovo proroctví nechá Moáb kvílet „nad Nébo a nad Medaba“. V První knize Makabejských synové Jambriho z Medeby unesli a zabili Jana, bratra Jonatana Makabejského, a byli přepadeni na svatbě; Jan Hyrkanos dobyl Medebu po šestiměsíčním obléhání kolem roku 128 př. n. l. a jeho vnuk Hyrkanos II. slíbil vrátit ji nabatejskému králi Aretovi. Od roku 106 n. l. patřila k římské provincii Arábie, razila mince a stala se křesťanským městem s biskupem."
    - "Slávou Madaby jsou její mozaiky. V roce 1884 našli křesťanští Arabové, kteří opuštěné město znovu osídlili z Keraku, pod podlahou kostela, který přestavovali, mozaikovou mapu Svaté země z 6. století, z doby po roce 542, s Jeruzalémem vykresleným ulici po ulici; byla zveřejněna roku 1897 a dosud je v kostele svatého Jiří. Desítky dalších dlažeb ze 6. a 7. století, v kostele Panny Marie, v Hippolytově sále a v kostele Apoštolů, učinily z Madaby „město mozaik“. Vykopávky na tellu týmu Timothy Harrisona odkryly monumentální předklasickou opevňovací zeď a domy z doby železné."
    - "Dnes je Madaba hlavním městem guvernorátu s asi 200 000 obyvateli, s velkou křesťanskou obcí, archeologickým parkem a školou mozaik, několik kilometrů od hory Nebo."
  sv:
    - "Medeba, nu Madaba i Jordanien, ligger på platån 30 km sydväst om Amman, och högslätten omkring den är Josuas ”Medebaslätten”, Mishor mellan Heshbon och Dibon. Den gamla sången om Heshbon i Fjärde Mosebok slutar: ”vi härjade ända till Nofa, Nofa, som når till Medeba”; Josua tilldelade slätten åt Ruben. När ammoniterna lejde arameiska vagnar mot David ”kommo och lägrade sig” de ”framför Medeba”, och Joav slog dem på flykt."
    - "Meshas stele säger att Omri, Israels kung, hade tagit Medebas land och att Israel bodde i det under hans dagar och hälften av hans sons, fyrtio år, tills Kemosh gav det åter på Meshas tid; därför heter det i Jesajas utsaga: ”uppe i Nebo och Medeba jämrar sig Moab”. I Första Mackabeerboken bortrövade och dödade Jambris söner från Medeba Johannes, bror till Jonatan Mackabeus, och blev överfallna vid ett bröllop; Johannes Hyrkanos intog Medeba efter en sex månader lång belägring omkring 128 f.Kr., och hans sonson Hyrkanos II lovade att återlämna den till den nabateiske kungen Aretas. Från år 106 e.Kr. tillhörde den den romerska provinsen Arabien, präglade mynt och blev en kristen stad med biskop."
    - "Madabas berömmelse är dess mosaiker. År 1884 fann de kristna araber som bosatte om den övergivna staden från Kerak, under golvet i en kyrka de byggde om, mosaikkartan över Det heliga landet, gjord på 500-talet efter 542, med Jerusalem ritat gata för gata; den publicerades 1897 och finns kvar i Sankt Georgs kyrka. Dussintals andra golv från 500- och 600-talen, i Jungfrukyrkan, Hippolytossalen och Apostlakyrkan, har gjort Madaba till ”mosaikernas stad”. Utgrävning på tellen av Timothy Harrisons lag har fört fram en monumental försvarsmur från förklassisk tid och hus från järnåldern."
    - "I dag är Madaba huvudort i ett guvernement med omkring 200 000 invånare, med en stor kristen gemenskap, en arkeologisk park och en mosaikskola, några kilometer från berget Nebo."
  nb:
    - "Medeba, nå Madaba i Jordan, ligger på høylandet 30 km sørvest for Amman, og høylandet omkring er «hele sletten ved Medba» hos Josva, Mishor mellom Hesjbon og Dibon. Den gamle sangen om Hesjbon i Fjerde Mosebok ender: «vi herjet til Nofah, med ild helt til Medba»; Josva tildelte sletten til Ruben. Da ammonittene leide arameiske vogner mot David, «kom og leiret sig foran Medba», og Joab slo dem på flukt."
    - "Mesas stele sier at Omri, konge av Israel, hadde tatt Medebas land og at Israel bodde i det i hans dager og halvparten av hans sønns, førti år, til Kemosj gjenopprettet det i Mesas tid; slik lar Jesajas orakel Moab hyle «på Nebo og på Medeba». I 1. Makkabeerbok bortførte og drepte Jambris sønner fra Medeba Johannes, bror til Jonatan Makkabeus, og ble overfalt i et bryllup; Johannes Hyrkan inntok Medeba etter en seks måneders beleiring omkring 128 f.Kr., og hans sønnesønn Hyrkan II lovet å gi den tilbake til den nabateiske kongen Aretas. Fra 106 e.Kr. hørte den til den romerske provinsen Arabia, preget mynter og ble en kristen by med biskop."
    - "Madabas berømmelse er dens mosaikker. I 1884 fant de kristne araberne som fra Kerak bosatte den forlatte byen på nytt, under gulvet i en kirke de bygde opp igjen, mosaikkartet over Det hellige land, laget på 500-tallet etter 542, med Jerusalem tegnet gate for gate; det ble utgitt i 1897 og er fortsatt i Sankt Georgs kirke. Dusinvis av andre gulv fra 500- og 600-tallet, i Jomfru Marias kirke, Hippolytos-salen og Apostlenes kirke, har gjort Madaba til «mosaikkenes by». Utgravninger på tellen av Timothy Harrisons lag har avdekket en monumental førklassisk festningsmur og hus fra jernalderen."
    - "I dag er Madaba hovedstad i et guvernement på omkring 200 000 mennesker, med et stort kristent samfunn, en arkeologisk park og en mosaikkskole, noen få kilometer fra Nebo."
  tl:
    - "Ang Medeba, na Madaba na ngayon sa Jordan, ay nakatayo sa talampas 30 km sa timog-kanluran ng Amman, at ang kapatagang mataas sa palibot nito ang “kapatagan ng Medeba” ni Josue, ang Mishor sa pagitan ng Hesbon at Dibon. Nagtatapos ang lumang awit ng Hesbon sa Mga Bilang: “aming iniwasak hanggang Nopha, Na umaabot hanggang Medeba”; itinalaga ni Josue ang kapatagan sa Ruben. Nang umupa ang mga Ammonita ng mga karong Arameo laban kay David, sila ay “pumaroon at humantong sa harap ng Medeba”, at pinatakas sila ni Joab."
    - "Sinasabi ng estela ni Mesa na kinuha ni Omri, hari ng Israel, ang lupain ng Medeba at nanirahan doon ang Israel sa kaniyang mga araw at sa kalahati ng sa kaniyang anak, apatnapung taon, hanggang ibalik ito ni Chemos sa panahon ni Mesa; kaya ang orakulo ni Isaias ay may Moab na “umaangal sa Nebo, at sa Medeba”. Sa 1 Macabeo, dinukot at pinatay ng mga anak ni Jambri ng Medeba si Juan, kapatid ni Jonathan Macabeo, at tinambangan sa isang kasalan; sinakop ni Juan Hircano ang Medeba pagkaraan ng anim na buwang pagkubkob mga 128 BK, at ipinangako ng kaniyang apo na si Hircano II na ibabalik ito sa haring Nabateo na si Aretas. Mula 106 AD ay kabilang ito sa lalawigang Romano ng Arabia, nagpalabas ng mga barya at naging lungsod Kristiyano na may obispo."
    - "Ang katanyagan ng Madaba ay ang mga mosaiko nito. Noong 1884, ang mga Arabeng Kristiyano na nanirahang muli sa iniwang bayan mula sa Kerak ay nakatagpo, sa ilalim ng sahig ng isang simbahang itinatayo nilang muli, ng mapang mosaiko ng Banal na Lupain, na ginawa noong ika-6 na siglo pagkatapos ng 542, na ang Jerusalem ay iginuhit nang kalye-kalye; nalathala ito noong 1897 at nasa simbahan pa rin ni San Jorge. Dose-dosenang ibang sahig ng ika-6 at ika-7 siglo, sa simbahan ng Birhen, sa Bulwagan ni Hippolytus at sa simbahan ng mga Apostol, ang gumawa sa Madaba na “ang lungsod ng mga mosaiko”. Ang paghuhukay sa tell ng pangkat ni Timothy Harrison ay nakatuklas ng isang monumental na pader-kuta bago ang panahong klasiko at mga bahay ng Panahon ng Bakal."
    - "Ang Madaba ngayon ay kabisera ng isang governorate na may mga 200,000 tao, na may malaking pamayanang Kristiyano, isang liwasang arkeolohikal at isang paaralan ng mosaiko, ilang kilometro mula sa Bundok Nebo."
  da:
    - "Medeba, nu Madaba i Jordan, ligger på højsletten 30 km sydvest for Amman, og højsletten omkring den er Josvas »jævne Land ved Medba«, Mishor mellem Hesjbon og Dibon. Den gamle sang om Hesjbon i Fjerde Mosebog slutter: »vi have lagt dem øde indtil Nofa, som naar indtil Medba«; Josva tildelte sletten Ruben. Da ammonitterne lejede aramæiske vogne mod David, og de »kom og lejrede sig lige for Medba«, slog Joab dem på flugt."
    - "Mesjas stele siger, at Omri, Israels konge, havde taget Medebas land, og at Israel boede i det i hans dage og halvdelen af hans søns, fyrre år, indtil Kemosj gav det tilbage i Mesjas tid; så i Esajas' udsagn hyler Moab »paa Nebo og paa Medba«. I 1. Makkabæerbog bortførte og dræbte Jambris sønner fra Medeba Johannes, Jonatan Makkabæus' bror, og blev overfaldet i et bryllup; Johannes Hyrkanos indtog Medeba efter en seks måneders belejring omkring 128 f.Kr., og hans barnebarn Hyrkanos 2. lovede at give den tilbage til den nabatæiske konge Aretas. Fra 106 e.Kr. hørte den til den romerske provins Arabien, prægede mønter og blev en kristen by med en biskop."
    - "Madabas berømmelse er dens mosaikker. I 1884 fandt de kristne arabere, der genbosatte den forladte by fra Kerak, under gulvet i en kirke, de ombyggede, mosaikkortet over Det Hellige Land, lavet i 500-tallet efter 542, med Jerusalem tegnet gade for gade; det blev udgivet i 1897 og befinder sig stadig i Sankt Georgs kirke. Snesevis af andre gulve fra 500- og 600-tallet, i Jomfruens kirke, Hippolytos-salen og Apostlenes kirke, har gjort Madaba til »mosaikkernes by«. Udgravning på tellen af Timothy Harrisons hold har afdækket en monumental førklassisk befæstningsmur og huse fra jernalderen."
    - "I dag er Madaba hovedstad i et guvernement med omkring 200.000 indbyggere, med et stort kristent samfund, en arkæologisk park og en mosaikskole, få kilometer fra Nebo-bjerget."
  sr:
    - "Медева, данас Мадаба у Јордану, стоји на висоравни 30 км југозападно од Амана, а висораван око ње је Мишор између Есевона и Девона, који Исус Навин описује речима „сву равницу медевску до Девона“. Стара песма о Есевону у Књизи Бројева завршава се: „потрсмо их до Нофе, која допире до Медеве“; Исус Навин је равницу доделио Рувиму. Када су Амонци најмили арамејска кола против Давида, „дођоше и стадоше у логор према Медеви“, а Јоав их је обратио у бекство."
    - "Мисина стела каже да је Амрије, цар Израиља, узео земљу Медеве и да је Израиљ у њој живео за његових дана и пола дана његовог сина, четрдесет година, док је Хамос није вратио у Мисино доба; зато Исаијино пророштво каже: „Моав ће ридати за Невоном и за Медевом“. У Првој књизи о Макавејима синови Јамбријеви из Медеве отели су и убили Јована, брата Јонатана Макавеја, и били су нападнути у заседи на свадби; Јован Хиркан заузео је Медеву после шестомесечне опсаде око 128. п. н. е., а његов унук Хиркан II обећао је да ће је вратити набатејском краљу Арети. Од 106. н. е. припадала је римској провинцији Арабији, ковала је новац и постала хришћански град са епископом."
    - "Слава Мадабе су њени мозаици. Године 1884. хришћански Арапи који су из Керака поново населили напуштени град нашли су, испод пода цркве коју су обнављали, мозаичку мапу Свете земље, направљену у VI веку после 542, с Јерусалимом нацртаним улицу по улицу; објављена је 1897. и још је у цркви Светог Ђорђа. Десетине других подова из VI и VII века, у цркви Богородице, Дворани Иполита и цркви Апостола, учиниле су Мадабу „градом мозаика“. Ископавања екипе Тимотија Харисона на хумци открила су монументални предкласични одбрамбени зид и куће гвозденог доба."
    - "Данас је Мадаба средиште гувернората с око 200.000 људи, са великом хришћанском заједницом, археолошким парком и школом мозаика, неколико километара од Нева."
