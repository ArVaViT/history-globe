# Overview article (ADR 0007). Mainstream facts only; Kadesh is placed at Tell el-Qudeirat, as usual, and the identification is named as not certain; no date is given for the wilderness years (the fifteenth and the thirteenth century BC are both held), and the gap between them and the Iron Age remains is named neutrally.
id: kadesh-barnea
place: ac2cef0 # Kadesh-barnea record at Tell el-Qudeirat (lon/lat checked); 24 verses
title:
  en: "Kadesh-barnea"
  ru: "Кадес"
  uk: "Кадес-Барнеа"
  es: "Cades-barnea"
  pt: "Cades-Barneia"
  de: "Kadesch-Barnea"
  fr: "Kadès-Barnéa"
  pl: "Kadesz-Barnea"
  it: "Kades-Barnea"
  nl: "Kades-Barnea"
  cs: "Kádeš-barnea"
  sv: "Kadesh-Barnea"
  nb: "Kadesj-Barnea"
body:
  en:
    - "Kadesh, also called Kadesh-barnea, was an oasis on the southern edge of Canaan, where the Negev meets the Sinai desert. Most scholars identify it with Ain el-Qudeirat, the richest spring of northern Sinai, and the mound beside it, Tell el-Qudeirat, in today's Egypt, about 75 km south-southwest of Beersheba. The identification is not certain: nineteenth-century explorers had pointed to another spring, Ain Qedeis, which keeps the old name; Qudeirat won favour in the twentieth century, after Leonard Woolley and T. E. Lawrence surveyed the area in 1914."
    - "Genesis calls it En-mishpat, the spring of judgment, where the kings who came with Chedorlaomer smote the Amalekites, and says that Abraham dwelt between Kadesh and Shur. In Numbers and Deuteronomy it is Israel's chief station in the wilderness. From Kadesh Moses sent the spies to search the land, Caleb among them; here Miriam died and was buried; here the people strove for water, and the water was called Meribah; and from here Moses sent messengers to the king of Edom before moving on to Mount Hor. Deuteronomy counts thirty-eight years from Kadesh-barnea to the brook Zered. Numbers and Joshua make Kadesh-barnea a point on the southern border of the land and of Judah."
    - "Moshe Dothan dug at the tell in 1956 and Rudolph Cohen in 1976–1982. They found Iron Age remains: in Cohen's reading an oval fortress of the tenth century BC and rectangular forts of the eighth to early sixth, with Hebrew ostraca; others see first an open settlement and then a single fort built in the later eighth century and destroyed about 600 BC. No remains older than about the twelfth century BC have been found at the tell, and nothing from the fifteenth or the thirteenth century BC, the dates usually given for the wilderness years. Some take this as a problem for the identification or for the narrative; others answer that a camp in the desert would leave no trace, or that Kadesh meant the whole group of springs."
    - "After the fort fell, people lived at the site in the Persian period, probably until the fourth century BC. Ancient tradition looked for Kadesh elsewhere. Josephus says that Miriam was buried on a mountain called Sin before Israel came near Petra, and in the fourth century AD Eusebius placed Kadesh-barnea in the desert that reaches to Petra, where the tomb of Miriam was still shown."
  ru:
    - "Кадес, или Кадес-Варни, был оазисом на южном краю Ханаана, там, где Негев переходит в Синайскую пустыню. Большинство учёных отождествляют его с Айн-эль-Кудейрат, самым обильным источником северного Синая, и холмом рядом с ним — Телль-эль-Кудейрат, на территории нынешнего Египта, примерно в 75 км к юго-юго-западу от Вирсавии. Отождествление не бесспорно: исследователи XIX века указывали на другой источник, Айн-Кдейс, сохранивший древнее имя; предпочтение Кудейрату стали отдавать в XX веке, после того как в 1914 г. эти места обследовали Леонард Вулли и Т. Э. Лоуренс."
    - "Книга Бытия называет его источником Мишпат, где цари, пришедшие с Кедорлаомером, поразили Амаликитян, и говорит, что Авраам жил между Кадесом и Суром. В книгах Чисел и Второзакония это главная стоянка Израиля в пустыне. Из Кадеса Моисей посылал соглядатаев осмотреть землю, и среди них Халева; здесь умерла и была погребена Мариам; здесь народ вошёл в распрю из-за воды, и вода названа водой Меривы; отсюда Моисей отправил послов к царю Едомскому, прежде чем двинуться к горе Ор. Второзаконие насчитывает тридцать восемь лет от Кадес-Варни до долины Заред. Книги Чисел и Иисуса Навина делают Кадес-Варни точкой южной границы земли и удела Иудина."
    - "Моше Дотан копал на холме в 1956 г., Рудольф Коэн — в 1976–1982 гг. Они нашли остатки железного века: по толкованию Коэна, овальную крепость X века до н. э. и прямоугольные крепости VIII — начала VI века, а также древнееврейские остраконы; другие видят сначала открытое поселение, а затем одну крепость, построенную во второй половине VIII века и разрушенную около 600 г. до н. э. Остатков древнее примерно XII века до н. э. на холме не найдено, в том числе ничего от XV или XIII века до н. э., к которым обычно относят странствие в пустыне. Одни видят в этом трудность для отождествления или для повествования, другие отвечают, что стан в пустыне не оставил бы следов или что Кадесом называлась вся группа источников."
    - "После падения крепости здесь жили в персидское время, вероятно, до IV века до н. э. Древнее предание искало Кадес в другом месте. Иосиф Флавий пишет, что Мариам погребли на горе, называемой Син, прежде чем Израиль подошёл к Петре, а Евсевий в IV веке н. э. помещал Кадес-Варни в пустыне, простирающейся до Петры, где ещё показывали гробницу Мариам."
  uk:
    - "Кадеш, званий також Кадес-Барнеа, був оазою на південному краї Ханаану, де Негев зустрічається з пустелею Синай. Більшість дослідників ототожнюють його з Айн-ель-Кудейрат, найбагатшим джерелом північного Синаю, та городищем поряд, Телль-ель-Кудейрат, у сучасному Єгипті, приблизно за 75 км на південь-південний захід від Беер-Шеви. Ототожнення не певне: дослідники XIX ст. вказували на інше джерело, Айн-Кадіс, що зберігає стару назву; Кудейрат здобув прихильність у XX ст., після того як Леонард Вуллі й Т. Е. Лоуренс обстежили цю місцевість 1914 року."
    - "Книга Буття називає його Ен-Мишпат, джерело суду, де царі, що прийшли з Кедорлаомером, розбили амаликитян, і каже, що Авраам жив «між Кадесом і Суром». У Числах і Повторенні Закону це головний стан Ізраїлю в пустелі. З Кадеша Мойсей послав розвідників оглянути землю, серед них Калеба; тут померла і була похована Міріам; тут народ сварився за воду, і воду назвали Мерива; і звідси Мойсей послав посланців до царя Едому, перш ніж рушити далі до гори Гор. Повторення Закону лічить тридцять вісім років від Кадес-Барнеа до потоку Заред. Числа й Книга Ісуса Навина роблять Кадес-Барнеа точкою південної межі краю та Юди."
    - "Моше Дотан копав на городищі 1956 року, а Рудольф Коген — у 1976–1982 роках. Вони знайшли рештки залізного віку: за прочитанням Когена, овальну фортецю X ст. до н. е. й прямокутні форти від VIII до початку VI ст., з давньоєврейськими остраками; інші бачать спершу відкрите поселення, а потім єдиний форт, збудований наприкінці VIII ст. й зруйнований близько 600 р. до н. е. Рештків давніших за XII ст. до н. е. на городищі не знайдено, і нічого з XV чи XIII ст. до н. е., дат, які зазвичай дають для років пустелі. Дехто сприймає це як проблему для ототожнення або для оповіді; інші відповідають, що табір у пустелі не залишив би сліду, або що Кадеш означав усю групу джерел."
    - "Після падіння форту люди жили на місці в перську добу, ймовірно, до IV ст. до н. е. Давня традиція шукала Кадеш деінде. Йосиф Флавій каже, що Міріам була похована на горі, званій Сін, перш ніж Ізраїль наблизився до Петри, а в IV ст. н. е. Євсевій розмістив Кадес-Барнеа в пустелі, що сягає Петри, де ще показували гробницю Міріам."
  es:
    - "Cades, llamada también Cades-barnea, era un oasis en el borde meridional de Canaán, donde el Néguev se encuentra con el desierto del Sinaí. La mayoría de los estudiosos la identifican con Ain el-Qudeirat, el manantial más rico del norte del Sinaí, y el montículo junto a él, Tell el-Qudeirat, en el actual Egipto, a unos 75 km al sudsudoeste de Beerseba. La identificación no es segura: los exploradores del siglo XIX habían señalado otro manantial, Ain Qedeis, que conserva el nombre antiguo; Qudeirat ganó favor en el siglo XX, después de que Leonard Woolley y T. E. Lawrence prospectaran la zona en 1914."
    - "El Génesis la llama En-mispat, la fuente del juicio, donde los reyes que vinieron con Quedorlaomer derrotaron a los amalecitas, y dice que Abraham habitó entre Cades y Shur. En Números y Deuteronomio es la principal estación de Israel en el desierto. Desde Cades envió Moisés a los espías a reconocer la tierra, entre ellos Caleb; aquí murió María y fue sepultada; aquí el pueblo contendió por agua, y el agua fue llamada Meriba; y desde aquí envió Moisés mensajeros al rey de Edom antes de partir hacia el monte Hor. El Deuteronomio cuenta treinta y ocho años desde Cades-barnea hasta el arroyo de Zered. Números y Josué hacen de Cades-barnea un punto de la frontera sur del país y de Judá."
    - "Moshe Dothan excavó en el tell en 1956 y Rudolph Cohen en 1976–1982. Hallaron restos de la Edad del Hierro: en la lectura de Cohen una fortaleza oval del siglo X a. C. y fuertes rectangulares de los siglos VIII a comienzos del VI, con óstraca hebreos; otros ven primero un asentamiento abierto y luego un único fuerte construido a fines del siglo VIII y destruido hacia el 600 a. C. No se han hallado en el tell restos anteriores al siglo XII a. C. aproximadamente, ni nada del siglo XV o del XIII a. C., las fechas que suelen darse para los años del desierto. Algunos lo toman como un problema para la identificación o para el relato; otros responden que un campamento en el desierto no dejaría rastro, o que Cades designaba todo el grupo de manantiales."
    - "Tras la caída del fuerte, hubo gente viviendo en el sitio en el período persa, probablemente hasta el siglo IV a. C. La tradición antigua buscaba Cades en otro lugar. Josefo dice que María fue sepultada en un monte llamado Sin antes de que Israel se acercara a Petra, y en el siglo IV d. C. Eusebio situó Cades-barnea en el desierto que llega hasta Petra, donde todavía se mostraba la tumba de María."
  pt:
    - "Cades, também chamada Cades-Barneia, era um oásis no limite sul de Canaã, onde o Neguebe encontra o deserto do Sinai. A maioria dos estudiosos a identifica com Ain el-Qudeirat, a mais rica fonte do norte do Sinai, e o monte ao lado, Tell el-Qudeirat, no atual Egito, a cerca de 75 km a su-sudoeste de Berseba. A identificação não é certa: exploradores do século XIX apontaram outra fonte, Ain Qedeis, que guarda o antigo nome; Qudeirat ganhou favor no século XX, depois que Leonard Woolley e T. E. Lawrence prospectaram a área em 1914."
    - "Gênesis a chama En-Mispate, a fonte do julgamento, onde os reis que vieram com Quedorlaomer feriram os amalequitas, e diz que Abraão habitou entre Cades e Sur. Em Números e Deuteronômio é a principal estação de Israel no deserto. De Cades Moisés enviou os espiões para explorar a terra, Calebe entre eles; aqui Miriã morreu e foi sepultada; aqui o povo disputou por água, e a água foi chamada Meribá; e daqui Moisés enviou mensageiros ao rei de Edom antes de seguir para o monte Hor. Deuteronômio conta trinta e oito anos de Cades-Barneia até o ribeiro de Zerede. Números e Josué fazem de Cades-Barneia um ponto na fronteira sul da terra e de Judá."
    - "Moshe Dothan escavou o tell em 1956 e Rudolph Cohen em 1976–1982. Acharam restos da Idade do Ferro: na leitura de Cohen, uma fortaleza oval do século X a.C. e fortes retangulares do VIII ao início do VI, com óstracos hebraicos; outros veem primeiro um povoado aberto e depois um único forte construído no fim do século VIII e destruído por volta de 600 a.C. Nenhum resto anterior ao século XII a.C. foi achado no tell, e nada do século XV ou XIII a.C., as datas usualmente dadas para os anos no deserto. Alguns tomam isso como problema para a identificação ou para a narrativa; outros respondem que um acampamento no deserto não deixaria vestígio, ou que Cades designava todo o grupo de fontes."
    - "Depois que o forte caiu, viveu-se no sítio no período persa, provavelmente até o século IV a.C. A tradição antiga procurava Cades em outro lugar. Josefo diz que Miriã foi sepultada num monte chamado Sin antes de Israel chegar perto de Petra, e no século IV d.C. Eusébio situou Cades-Barneia no deserto que chega a Petra, onde o túmulo de Miriã ainda era mostrado."
  de:
    - "Kadesch, auch Kadesch-Barnea genannt, war eine Oase am Südrand Kanaans, wo der Negev auf die Wüste Sinai trifft. Die meisten Forscher setzen es mit Ain el-Qudeirat gleich, der reichsten Quelle des nördlichen Sinai, und dem Hügel daneben, Tell el-Qudeirat, im heutigen Ägypten, etwa 75 km süd-südwestlich von Beerscheba. Die Gleichsetzung ist nicht sicher: Forscher des 19. Jahrhunderts hatten auf eine andere Quelle verwiesen, Ain Qedeis, die den alten Namen bewahrt; Qudeirat fand im 20. Jahrhundert Zustimmung, nachdem Leonard Woolley und T. E. Lawrence das Gebiet 1914 vermessen hatten."
    - "Das erste Buch Mose nennt es En-Mischpat, die Quelle des Gerichts, wo die Könige, die mit Kedorlaomer kamen, die Amalekiter schlugen, und sagt, Abraham habe zwischen Kadesch und Schur gewohnt. Im vierten und fünften Buch Mose ist es Israels wichtigste Station in der Wüste. Von Kadesch sandte Mose die Kundschafter aus, das Land zu erkunden, Kaleb unter ihnen; hier starb Mirjam und wurde begraben; hier haderte das Volk um Wasser, und das Wasser hieß Meriba; und von hier sandte Mose Boten zum König von Edom, ehe er zum Berg Hor weiterzog. Das fünfte Buch Mose zählt achtunddreißig Jahre von Kadesch-Barnea bis zum Bach Sered. Das vierte Buch Mose und Josua machen Kadesch-Barnea zu einem Punkt auf der Südgrenze des Landes und Judas."
    - "Moshe Dotan grub 1956 am Tell und Rudolph Cohen 1976–1982. Sie fanden eisenzeitliche Reste: nach Cohens Deutung eine ovale Festung des 10. Jahrhunderts v. Chr. und rechteckige Festungen des 8. bis frühen 6. mit hebräischen Ostraka; andere sehen zuerst eine offene Siedlung und dann eine einzige im späteren 8. Jahrhundert gebaute und um 600 v. Chr. zerstörte Festung. Reste, die älter wären als etwa das 12. Jahrhundert v. Chr., wurden am Tell nicht gefunden, und nichts aus dem 15. oder 13. Jahrhundert v. Chr., den Daten, die gewöhnlich für die Wüstenjahre genannt werden. Manche sehen darin ein Problem für die Gleichsetzung oder für die Erzählung; andere antworten, ein Lager in der Wüste hinterlasse keine Spur, oder Kadesch habe die ganze Gruppe der Quellen gemeint."
    - "Nach dem Fall der Festung lebten Menschen in persischer Zeit an der Stätte, vermutlich bis ins 4. Jahrhundert v. Chr. Die antike Überlieferung suchte Kadesch anderswo. Josephus sagt, Mirjam sei auf einem Berg namens Sin begraben worden, ehe Israel in die Nähe von Petra kam, und im 4. Jahrhundert n. Chr. setzte Eusebius Kadesch-Barnea in die Wüste, die bis Petra reicht, wo man noch das Grab der Mirjam zeigte."
  fr:
    - "Qadesh, appelée aussi Kadès-Barnéa, était une oasis au bord méridional de Canaan, là où le Négev rencontre le désert du Sinaï. La plupart des spécialistes l’identifient à Aïn el-Qudeirat, la plus riche source du nord du Sinaï, et au tertre voisin, Tell el-Qudeirat, dans l’Égypte actuelle, à environ 75 km au sud-sud-ouest de Beer-Schéba. L’identification n’est pas certaine : des explorateurs du XIXe siècle avaient désigné une autre source, Aïn Qedeis, qui garde l’ancien nom ; Qudeirat l’emporta au XXe siècle, après que Leonard Woolley et T. E. Lawrence eurent prospecté la région en 1914."
    - "La Genèse l’appelle En-Mischpath, la source du jugement, où les rois venus avec Kedorlaomer battirent les Amalécites, et dit qu’Abraham habita entre Kadès et Schur. Dans les Nombres et le Deutéronome, c’est la principale étape d’Israël dans le désert. De Qadesh, Moïse envoya les espions explorer le pays, Caleb parmi eux ; ici Miriam mourut et fut enterrée ; ici le peuple se querella pour l’eau, et l’eau fut appelée Meriba ; et d’ici Moïse envoya des messagers au roi d’Édom avant de partir pour le mont Hor. Le Deutéronome compte trente-huit ans de Kadès-Barnéa au torrent de Zéred. Les Nombres et Josué font de Kadès-Barnéa un point de la frontière sud du pays et de Juda."
    - "Moshe Dothan fouilla le tell en 1956 et Rudolph Cohen en 1976–1982. Ils trouvèrent des vestiges de l’âge du Fer : dans la lecture de Cohen, une forteresse ovale du Xe siècle av. J.-C. et des forts rectangulaires du VIIIe au début du VIe, avec des ostraca hébreux ; d’autres voient d’abord une implantation ouverte, puis un seul fort bâti à la fin du VIIIe siècle et détruit vers 600 av. J.-C. Aucun vestige antérieur au XIIe siècle av. J.-C. environ n’a été trouvé sur le tell, et rien du XVe ni du XIIIe siècle av. J.-C., dates habituellement données pour les années du désert. Certains y voient un problème pour l’identification ou pour le récit ; d’autres répondent qu’un camp dans le désert ne laisserait aucune trace, ou que Qadesh désignait tout le groupe de sources."
    - "Après la chute du fort, on vécut sur le site à l’époque perse, probablement jusqu’au IVe siècle av. J.-C. La tradition antique cherchait Qadesh ailleurs. Josèphe dit que Miriam fut enterrée sur une montagne appelée Sin avant qu’Israël n’approche de Pétra, et au IVe siècle apr. J.-C., Eusèbe plaça Kadès-Barnéa dans le désert qui s’étend jusqu’à Pétra, où l’on montrait encore le tombeau de Miriam."
  pl:
    - "Kadesz, zwane też Kadesz-Barnea, było oazą na południowym skraju Kanaanu, gdzie Negew styka się z pustynią Synaj. Większość uczonych utożsamia je z Ajn el-Kudejrat, najbogatszym źródłem północnego Synaju, i z pagórkiem obok niego, Tell el-Kudejrat, w dzisiejszym Egipcie, około 75 km na południe-południowy zachód od Beer-Szeby. Utożsamienie nie jest pewne: dziewiętnastowieczni badacze wskazywali inne źródło, Ajn Kedejs, które zachowuje dawną nazwę; Kudejrat zyskało uznanie w XX w., po tym, jak Leonard Woolley i T. E. Lawrence zbadali okolicę w 1914 r."
    - "Księga Rodzaju nazywa je En-Miszpat, źródłem sądu, gdzie królowie, którzy przybyli z Kedorlaomerem, pobili Amalekitów, i mówi, że Abraham mieszkał między Kadesz a Szur. W Księdze Liczb i Powtórzonego Prawa jest główną stacją Izraela na pustyni. Z Kadesz Mojżesz wysłał zwiadowców, by zbadali kraj, wśród nich Kaleba; tu umarła i została pochowana Miriam; tu lud spierał się o wodę, a wodę nazwano Meriba; i stąd Mojżesz wysłał posłów do króla Edomu, zanim ruszył do góry Hor. Księga Powtórzonego Prawa liczy trzydzieści osiem lat od Kadesz-Barnea do potoku Zared. Księga Liczb i Księga Jozuego czynią Kadesz-Barnea punktem południowej granicy kraju i Judy."
    - "Mosze Dotan prowadził wykopaliska na tellu w 1956 r., a Rudolph Cohen w latach 1976–1982. Znaleźli szczątki z epoki żelaza: w odczytaniu Cohena owalną twierdzę z X w. p.n.e. i prostokątne forty z VIII do początku VI w., z hebrajskimi ostrakami; inni widzą najpierw otwartą osadę, a potem pojedynczy fort zbudowany w późniejszym VIII w. i zniszczony około 600 r. p.n.e. Na tellu nie znaleziono szczątków starszych niż około XII w. p.n.e. ani niczego z XV czy XIII w. p.n.e., dat zwykle podawanych dla lat pustyni. Niektórzy biorą to za problem dla utożsamienia lub dla opowieści; inni odpowiadają, że obóz na pustyni nie zostawiłby śladu albo że Kadesz oznaczało całą grupę źródeł."
    - "Po upadku fortu ludzie mieszkali na stanowisku w okresie perskim, prawdopodobnie do IV w. p.n.e. Tradycja starożytna szukała Kadesz gdzie indziej. Józef Flawiusz mówi, że Miriam pochowano na górze zwanej Sin, zanim Izrael zbliżył się do Petry, a w IV w. n.e. Euzebiusz umieścił Kadesz-Barnea na pustyni sięgającej Petry, gdzie nadal pokazywano grób Miriam."
  it:
    - "Kades, detta anche Kades-Barnea, era un’oasi al margine meridionale di Canaan, dove il Negheb incontra il deserto del Sinai. La maggior parte degli studiosi la identifica con Ain el-Qudeirat, la più ricca sorgente del Sinai settentrionale, e con il tell accanto, Tell el-Qudeirat, nell’Egitto odierno, circa 75 km a sud-sud-ovest di Bersabea. L’identificazione non è certa: gli esploratori dell’Ottocento avevano indicato un’altra sorgente, Ain Qedeis, che conserva l’antico nome; Qudeirat prevalse nel Novecento, dopo che Leonard Woolley e T. E. Lawrence ricognirono la zona nel 1914."
    - "La Genesi la chiama En-Mishpat, la sorgente del giudizio, dove i re venuti con Chedorlaomer batterono gli Amalechiti, e dice che Abramo dimorò fra Kades e Sur. Nei Numeri e nel Deuteronomio è la principale tappa d’Israele nel deserto. Da Kades Mosè mandò gli esploratori a perlustrare il paese, fra cui Caleb; qui morì e fu sepolta Maria; qui il popolo contese per l’acqua, e l’acqua fu chiamata Meriba; e da qui Mosè mandò messaggeri al re di Edom prima di proseguire verso il Monte Or. Il Deuteronomio conta trentotto anni da Kades-Barnea al torrente Zered. I Numeri e Giosuè fanno di Kades-Barnea un punto del confine meridionale del paese e di Giuda."
    - "Moshe Dothan scavò il tell nel 1956 e Rudolph Cohen nel 1976–1982. Trovarono resti dell’età del Ferro: nella lettura di Cohen una fortezza ovale del X secolo a.C. e forti rettangolari dall’VIII all’inizio del VI, con ostraca ebraici; altri vedono dapprima un insediamento aperto e poi un solo forte costruito nel tardo VIII secolo e distrutto verso il 600 a.C. Sul tell non sono stati trovati resti anteriori al XII secolo a.C. circa, e nulla del XV o del XIII secolo a.C., le date di solito date per gli anni del deserto. Alcuni lo ritengono un problema per l’identificazione o per il racconto; altri rispondono che un accampamento nel deserto non lascerebbe tracce, o che Kades indicava l’intero gruppo di sorgenti."
    - "Dopo la caduta del forte, il sito fu abitato in epoca persiana, probabilmente fino al IV secolo a.C. La tradizione antica cercava Kades altrove. Giuseppe Flavio dice che Maria fu sepolta su un monte chiamato Sin prima che Israele si avvicinasse a Petra, e nel IV secolo d.C. Eusebio collocò Kades-Barnea nel deserto che giunge a Petra, dove si mostrava ancora la tomba di Maria."
  nl:
    - "Kades, ook Kades-Barnea genoemd, was een oase aan de zuidrand van Kanaän, waar de Negev de Sinaïwoestijn ontmoet. De meeste geleerden vereenzelvigen het met Ain el-Qudeirat, de rijkste bron van noordelijk Sinaï, en de heuvel ernaast, Tell el-Qudeirat, in het huidige Egypte, ongeveer 75 km zuidzuidwestelijk van Berseba. De identificatie is niet zeker: ontdekkingsreizigers uit de 19e eeuw wezen op een andere bron, Ain Qedeis, die de oude naam bewaart; Qudeirat kreeg in de 20e eeuw de voorkeur, nadat Leonard Woolley en T. E. Lawrence het gebied in 1914 in kaart brachten."
    - "Genesis noemt het En-Mispat, de bron van het oordeel, waar de koningen die met Kedorlaomer kwamen de Amalekieten sloegen, en zegt dat Abraham woonde tussen Kades en Sur. In Numeri en Deuteronomium is het Israëls belangrijkste halte in de woestijn. Vanuit Kades zond Mozes de verspieders om het land te onderzoeken, onder wie Kaleb; hier stierf Mirjam en werd begraven; hier twistte het volk om water, en het water heette Meriba; en vanuit Kades zond Mozes boden naar de koning van Edom voordat hij verder trok naar de berg Hor. Deuteronomium telt achtendertig jaar van Kades-Barnea tot de beek Zered. Numeri en Jozua maken Kades-Barnea een punt op de zuidgrens van het land en van Juda."
    - "Moshe Dothan groef op de tell in 1956 en Rudolph Cohen in 1976–1982. Zij vonden resten uit de IJzertijd: in Cohens lezing een ovaal fort uit de 10e eeuw v.Chr. en rechthoekige forten uit de 8e tot vroege 6e eeuw, met Hebreeuwse ostraka; anderen zien eerst een open nederzetting en daarna één fort, gebouwd in de latere 8e eeuw en omstreeks 600 v.Chr. verwoest. Op de tell zijn geen resten ouder dan ongeveer de 12e eeuw v.Chr. gevonden, en niets uit de 15e of 13e eeuw v.Chr., de data die gewoonlijk voor de woestijnjaren worden gegeven. Sommigen zien dit als een probleem voor de identificatie of voor het verhaal; anderen antwoorden dat een kamp in de woestijn geen sporen zou nalaten, of dat Kades de hele groep bronnen betekende."
    - "Nadat het fort viel, woonde men op de plaats in de Perzische tijd, waarschijnlijk tot de 4e eeuw v.Chr. De oude overlevering zocht Kades elders. Josephus zegt dat Mirjam werd begraven op een berg genaamd Sin voordat Israël bij Petra kwam, en in de 4e eeuw n.Chr. plaatste Eusebius Kades-Barnea in de woestijn die tot Petra reikt, waar het graf van Mirjam nog werd getoond."
  cs:
    - "Kádeš, zvaný též Kádeš-barnea, byla oáza na jižním okraji Kanaánu, kde se Negev setkává se Sinajskou pouští. Většina učenců ji ztotožňuje s Ajn el-Qudejrát, nejbohatším pramenem severního Sinaje, a s pahorkem vedle něj, Tell el-Qudejrát, v dnešním Egyptě, asi 75 km jihojihozápadně od Beer-šeby. Ztotožnění není jisté: badatelé 19. století poukazovali na jiný pramen, Ajn Qedís, který zachovává staré jméno; Qudejrát získal přízeň ve 20. století, poté co oblast roku 1914 prozkoumali Leonard Woolley a T. E. Lawrence."
    - "Genesis ji nazývá En-mišpat, pramen soudu, kde králové, kteří přišli s Kedorlaomerem, porazili Amalechitské, a praví, že Abraham přebýval mezi Kádešem a Šurem. V Numeri a Deuteronomiu je hlavní stanicí Izraele na poušti. Z Kádeše Mojžíš poslal zvědy prozkoumat zemi, mezi nimi Káleba; zde zemřela a byla pohřbena Mirjam; zde se lid hádal o vodu a voda byla nazvána Meriba; a odtud Mojžíš poslal posly k edómskému králi, než se vydal k hoře Hor. Deuteronomium počítá třicet osm let od Kádeš-barnea k potoku Zered. Numeri a Jozue činí z Kádeš-barnea bod na jižní hranici země a Judy."
    - "Moše Dótan kopal na tellu roku 1956 a Rudolph Cohen v letech 1976–1982. Nalezli zbytky doby železné: podle Cohenova čtení oválnou pevnost z 10. stol. př. n. l. a obdélníkové pevnůstky z 8. až počátku 6. století, s hebrejskými ostraky; jiní vidí nejprve otevřené sídliště a pak jedinou pevnost postavenou v pozdním 8. století a zničenou kolem roku 600 př. n. l. Na tellu nebyly nalezeny žádné pozůstatky starší než asi 12. stol. př. n. l. a nic z 15. nebo 13. století př. n. l., dat obvykle udávaných pro léta na poušti. Někteří to berou jako problém pro ztotožnění nebo pro vyprávění; jiní odpovídají, že tábor na poušti by nezanechal stopu, nebo že Kádeš znamenal celou skupinu pramenů."
    - "Po pádu pevnosti lidé na místě žili v perském období, pravděpodobně do 4. stol. př. n. l. Starověká tradice hledala Kádeš jinde. Josephus praví, že Mirjam byla pohřbena na hoře zvané Sin, než Izrael přišel poblíž Petry, a ve 4. století n. l. Eusebios klade Kádeš-barnea do pouště sahající k Petře, kde se hrob Mirjam dosud ukazoval."
  sv:
    - "Kadesh, även kallad Kadesh-Barnea, var en oas i Kanaans södra utkant, där Negev möter Sinaiöknen. De flesta forskare identifierar den med Ain el-Qudeirat, norra Sinais rikaste källa, och kullen intill den, Tell el-Qudeirat, i dagens Egypten, omkring 75 km sydsydväst om Beer Sheva. Identifieringen är inte säker: upptäcktsresande på 1800-talet hade pekat på en annan källa, Ain Qedeis, som bevarar det gamla namnet; Qudeirat vann företräde på 1900-talet, sedan Leonard Woolley och T. E. Lawrence kartlagt området 1914."
    - "Första Moseboken kallar den En-Mishpat, domens källa, där de konungar som kom med Kedorlaomer slog amalekiterna, och säger att Abraham bodde mellan Kadesh och Shur. I Fjärde och Femte Mosebok är den Israels främsta station i öknen. Från Kadesh sände Mose ut spejarna för att utforska landet, Kalev bland dem; här dog Mirjam och begrovs; här tvistade folket om vatten, och vattnet kallades Meriva; och härifrån sände Mose bud till Edoms konung innan han drog vidare till berget Hor. Femte Mosebok räknar trettioåtta år från Kadesh-Barnea till bäcken Sered. Fjärde Mosebok och Josua gör Kadesh-Barnea till en punkt på landets och Judas södra gräns."
    - "Moshe Dothan grävde vid tellen 1956 och Rudolph Cohen 1976–1982. De fann lämningar från järnåldern: enligt Cohens tolkning en oval fästning från 900-talet f.Kr. och rektangulära fort från 700-talet till början av 500-talet f.Kr., med hebreiska ostraka; andra ser först en öppen bosättning och sedan ett enda fort, byggt under senare delen av 700-talet och förstört omkring 600 f.Kr. Inga lämningar äldre än omkring 1100-talet f.Kr. har påträffats vid tellen, och inget från 1400- eller 1200-talet f.Kr., de dateringar som vanligen anges för öknens år. Vissa ser detta som ett problem för identifieringen eller för berättelsen; andra svarar att ett läger i öknen inte skulle lämna något spår, eller att Kadesh avsåg hela gruppen av källor."
    - "Sedan fortet fallit bodde människor på platsen under den persiska tiden, sannolikt fram till 300-talet f.Kr. Den antika traditionen sökte Kadesh på annat håll. Josefus säger att Mirjam begrovs på ett berg som kallades Sin innan Israel kom nära Petra, och på 300-talet e.Kr. förlade Eusebios Kadesh-Barnea till den öken som sträcker sig till Petra, där Mirjams grav ännu visades."
  nb:
    - "Kadesj, også kalt Kadesj-Barnea, var en oase på den sørlige kanten av Kanaan, der Negev møter Sinai-ørkenen. De fleste forskere identifiserer den med Ain el-Qudeirat, Nord-Sinais rikeste kilde, og haugen ved siden av, Tell el-Qudeirat, i dagens Egypt, omkring 75 km sør-sørvest for Beer-Sjeba. Identifikasjonen er ikke sikker: oppdagelsesreisende på 1800-tallet pekte på en annen kilde, Ain Qedeis, som har beholdt det gamle navnet; Qudeirat vant gehør på 1900-tallet, etter at Leonard Woolley og T. E. Lawrence kartla området i 1914."
    - "Første Mosebok kaller den En-Mishpat, rettens kilde, der kongene som kom med Kedorlaomer, slo amalekittene, og sier at Abraham bodde mellom Kadesj og Sjur. I Fjerde og Femte Mosebok er den Israels viktigste stasjon i ørkenen. Fra Kadesj sendte Moses speiderne for å utforske landet, blant dem Kaleb; her døde Mirjam og ble begravet; her kivdes folket om vann, og vannet ble kalt Meriba; og herfra sendte Moses bud til kongen av Edom før han drog videre til Hor-fjellet. Femte Mosebok regner åtte og tretti år fra Kadesj-Barnea til Sered-bekken. Fjerde Mosebok og Josva gjør Kadesj-Barnea til et punkt på den sørlige grensen til landet og til Juda."
    - "Moshe Dothan gravde på tellen i 1956 og Rudolph Cohen i 1976–1982. De fant levninger fra jernalderen: i Cohens tolkning en oval festning fra 900-tallet f.Kr. og rektangulære festninger fra 700-tallet til tidlig på 500-tallet f.Kr., med hebraiske ostraka; andre ser først en åpen bosetning og deretter ett enkelt fort bygget i siste del av 700-tallet og ødelagt omkring 600 f.Kr. Ingen levninger eldre enn omkring 1100-tallet f.Kr. er funnet på tellen, og ingenting fra 1400-tallet eller 1200-tallet f.Kr., tidene som vanligvis oppgis for ørkenårene. Noen tar dette som et problem for identifikasjonen eller for fortellingen; andre svarer at en leir i ørkenen ikke ville etterlate spor, eller at Kadesj betegnet hele gruppen av kilder."
    - "Etter at fortet falt, bodde folk på stedet i persertiden, trolig til 300-tallet f.Kr. Den gamle tradisjonen lette etter Kadesj andre steder. Josefus sier at Mirjam ble begravet på et fjell kalt Sin før Israel kom nær Petra, og på 300-tallet e.Kr. plasserte Eusebius Kadesj-Barnea i ørkenen som strekker seg til Petra, der Mirjams grav fortsatt ble vist."
