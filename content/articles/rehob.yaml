body:
  en:
    - "Rehob, “broad place”, was a town of the tribe of Asher in the plain behind Acco, in the north-west of the land. Asher's list in Joshua names a Rehob twice, once near Sidon and once with Ummah and Aphek at the end, “twenty and two cities with their villages”; whether these are two towns or one listed twice is argued, and the map keeps them apart. This Rehob, with its pasture lands, was one of the four towns Asher gave to the Levites of the family of Gershon. The book of Judges adds the only other fact: “Neither did Asher drive out the inhabitants of Accho”, nor those of Sidon, Ahlab, Achzib, Helbah, Aphik and Rehob, so the Canaanites stayed and Asher lived among them."
    - "Other Rehobs must not be confused with it: the Rehob at the entrance of Hamath that the spies reached, Beth-rehob of the Aramaeans near Dan, and the great Rehob south of Beth-shean, now Tel Rehov. For Asher's town the usual proposal is Tell el-Bir el-Gharbi, now Tel Bira, a mound 8 km east of Acco at the edge of the plain with remains from the Bronze and Iron Ages; Khirbet Da'uk, closer to the city, is the other candidate on the map, and some would make this Rehob one with the Rehob near Sidon. No inscription names the site."
    - "Today the mound of Tel Bira stands by the Ahihud junction on the road from Acco into the Galilee, among the fields of the Acco plain."
  ru:
    - "Рехов, «широкое место», — город колена Асирова на равнине за Акко, на северо-западе страны. Список Асира у Иисуса Навина называет Рехов дважды: раз близ Сидона и раз с Уммой и Афеком в самом конце, «двадцать два города с селами их»; два ли это города или один, названный дважды, спорят, и на карте они разделены. Этот Рехов с предместьями был одним из четырёх городов, которые Асир отдал левитам из рода Гирсона. Книга Судей прибавляет единственный другой факт: «И Асир не изгнал жителей Акко», ни жителей Сидона, Ахлава, Ахзива, Хелвы, Афека и Рехова, так что Хананеи остались, и Асир жил среди них."
    - "Его не надо путать с другими Реховами: Реховом у входа в Емаф, до которого дошли соглядатаи, арамейским Беф-Реховом близ Дана и большим Реховом к югу от Беф-Сана, нынешним Тель-Реховом. Для города Асира обычно предлагают Телль-эль-Бир-эль-Гарби, нынешний Тель-Бира, холм в 8 км к востоку от Акко на краю равнины с остатками бронзового и железного веков; Хирбет-Даук ближе к городу — другой кандидат на карте, а некоторые объединяют этот Рехов с Реховом близ Сидона. Надписи с именем места нет."
    - "Сегодня холм Тель-Бира стоит у развязки Ахихуд на дороге из Акко в Галилею, среди полей долины Акко."
  uk:
    - "Рехов, «широке місце», було містом коліна Асіра на рівнині за Акко, на північному заході краю. У переліку Асіра в книзі Ісуса Навина Рехов названо двічі: один раз поблизу Сідона, а вдруге з Уммою й Афеком наприкінці, «двайцять і два городи з їх селами»; чи це два міста, чи одне, згадане двічі, — предмет суперечки, і карта тримає їх окремо. Цей Рехов з його пасовищами був одним із чотирьох міст, які Асір віддав левітам роду Гершома. Книга Суддів додає єдиний інший факт: «І Ассер не повиганяв осадників Акковських», як і мешканців Сідона, Ахлава, Ахзіва, Хелви, Афека й Рехова, тож ханаанці лишилися, а Асір жив серед них."
    - "З ним не слід плутати інші Рехови: Рехов при вході до Хамата, куди дійшли розвідники, Бет-Рехов арамеїв поблизу Дана та великий Рехов на південь від Бет-Шеана, нині Тель-Рехов. Для міста Асіра зазвичай пропонують Телль-ель-Бір-ель-Ґарбі, нині Тель-Біра, курган за 8 км на схід від Акко на краю рівнини із залишками бронзової та залізної доби; Хірбет-Дау’ук, ближче до міста, — другий кандидат на карті, а дехто ототожнив би цей Рехов із Реховом поблизу Сідона. Жоден напис не називає це місце."
    - "Сьогодні курган Тель-Біра стоїть біля розв’язки Ахіхуд на дорозі з Акко до Галілеї, серед полів рівнини Акко."
  es:
    - "Rehob, «lugar ancho», era una ciudad de la tribu de Aser en la llanura detrás de Aco, en el noroeste del país. La lista de Aser en Josué nombra un Rehob dos veces, una cerca de Sidón y otra con Uma y Afec al final, «veinte y dos ciudades con sus aldeas»; si son dos ciudades o una sola enumerada dos veces se discute, y el mapa las mantiene separadas. Este Rehob, con sus tierras de pasto, fue una de las cuatro ciudades que Aser dio a los levitas de la familia de Gersón. El libro de Jueces añade el único otro dato: «Tampoco Aser echó á los que habitaban en Achô», ni a los de Sidón, Ahlab, Aczib, Helba, Afec y Rehob, de modo que los cananeos se quedaron y Aser vivió entre ellos."
    - "No hay que confundirlo con otros Rehob: el Rehob a la entrada de Hamat al que llegaron los espías, Bet-rehob de los arameos cerca de Dan, y el gran Rehob al sur de Bet-seán, hoy Tel Rehov. Para la ciudad de Aser la propuesta habitual es Tell el-Bir el-Gharbi, hoy Tel Bira, un montículo a 8 km al este de Aco, en el borde de la llanura, con restos de las Edades del Bronce y del Hierro; Khirbet Da'uk, más cercana a la ciudad, es el otro candidato del mapa, y algunos harían de este Rehob uno solo con el Rehob cercano a Sidón. Ninguna inscripción nombra el lugar."
    - "Hoy el montículo de Tel Bira se alza junto al cruce de Ahihud, en el camino de Aco a Galilea, entre los campos de la llanura de Aco."
  pt:
    - "Reobe, “lugar largo”, era uma cidade da tribo de Aser na planície atrás de Aco, no noroeste da terra. A lista de Aser em Josué nomeia uma Reobe duas vezes, uma perto de Sidom e outra com Uma e Afeque no fim, “vinte e duas cidades com as suas aldeias”; se são duas cidades ou uma só listada duas vezes, discute-se, e o mapa as mantém separadas. Esta Reobe, com suas pastagens, foi uma das quatro cidades que Aser deu aos levitas da família de Gérson. O livro de Juízes acrescenta o único outro fato: “Aser não expulsou os habitantes de Aco”, nem os de Sidom, Alabe, Aczibe, Helba, Afeque e Reobe, de modo que os cananeus ficaram e Aser viveu entre eles."
    - "Outras Reobes não devem ser confundidas com ela: a Reobe à entrada de Hamate que os espias alcançaram, Bete-Reobe dos arameus perto de Dã, e a grande Reobe ao sul de Bete-Seã, hoje Tel Rehov. Para a cidade de Aser a proposta habitual é Tell el-Bir el-Gharbi, hoje Tel Bira, um monte a 8 km a leste de Aco, na orla da planície, com restos das Idades do Bronze e do Ferro; Khirbet Da'uk, mais perto da cidade, é o outro candidato do mapa, e alguns fariam desta Reobe uma só com a Reobe perto de Sidom. Nenhuma inscrição nomeia o local."
    - "Hoje o monte de Tel Bira fica junto ao cruzamento de Ahihud, na estrada de Aco para a Galileia, entre os campos da planície de Aco."
  de:
    - "Rehob, „weiter Platz“, war eine Stadt des Stammes Asser in der Ebene hinter Akko, im Nordwesten des Landes. Assers Liste bei Josua nennt zweimal ein Rehob, einmal nahe Sidon und einmal mit Umma und Afek am Schluss, „Zweiundzwanzig Städte und ihre Dörfer“; ob das zwei Städte oder eine zweimal genannte sind, ist umstritten, und die Karte hält sie getrennt. Dieses Rehob mit seinen Weideplätzen war eine der vier Städte, die Asser den Leviten aus dem Geschlecht Gerschon gab. Das Buch der Richter fügt die einzige weitere Tatsache hinzu: „Asser vertrieb die Einwohner zu Akko nicht“, noch die von Sidon, Achlab, Achsib, Helba, Afek und Rehob, sodass die Kanaaniter blieben und Asser unter ihnen lebte."
    - "Andere Rehobs sind nicht mit ihm zu verwechseln: das Rehob am Eingang von Hamat, das die Kundschafter erreichten, Bet-Rehob der Aramäer nahe Dan und das große Rehob südlich von Bet-Schean, heute Tel Rehov. Für Assers Stadt lautet der übliche Vorschlag Tell el-Bir el-Gharbi, heute Tel Bira, ein Hügel 8 km östlich von Akko am Rand der Ebene mit Resten aus der Bronze- und Eisenzeit; Chirbet Da'uk, näher an der Stadt, ist der andere Kandidat auf der Karte, und manche würden dieses Rehob mit dem Rehob nahe Sidon gleichsetzen. Keine Inschrift nennt die Stätte."
    - "Heute steht der Hügel Tel Bira an der Kreuzung Ahihud auf der Straße von Akko nach Galiläa, zwischen den Feldern der Akko-Ebene."
  fr:
    - "Rehob, « lieu spacieux », était une ville de la tribu d’Aser dans la plaine derrière Acco, au nord-ouest du pays. La liste d’Aser chez Josué nomme un Rehob deux fois, l’une près de Sidon et l’autre avec Umma et Aphek à la fin, « Vingt-deux villes, et leurs villages » ; s’agit-il de deux villes ou d’une seule citée deux fois, on en discute, et la carte les garde distinctes. Ce Rehob, avec ses pâturages, fut l’une des quatre villes qu’Aser donna aux Lévites de la famille de Guerschon. Le livre des Juges ajoute le seul autre fait : « Aser ne chassa point les habitants d’Acco », ni ceux de Sidon, d’Achlal, d’Aczib, de Helba, d’Aphik et de Rehob, de sorte que les Cananéens restèrent et qu’Aser habita parmi eux."
    - "Il ne faut pas le confondre avec d’autres Rehob : le Rehob à l’entrée de Hamath que les explorateurs atteignirent, Beth-Rehob des Araméens près de Dan, et le grand Rehob au sud de Beth-Schean, aujourd’hui Tel Rehov. Pour la ville d’Aser, la proposition courante est Tell el-Bir el-Gharbi, aujourd’hui Tel Bira, tertre à 8 km à l’est d’Acco au bord de la plaine, avec des vestiges des âges du Bronze et du Fer ; Khirbet Da‘uk, plus près de la ville, est l’autre candidat de la carte, et certains feraient de ce Rehob le même que le Rehob près de Sidon. Aucune inscription ne nomme le site."
    - "Aujourd’hui, le tertre de Tel Bira se dresse près du carrefour d’Ahihud, sur la route d’Acco vers la Galilée, parmi les champs de la plaine d’Acco."
  it:
    - "Recob, «luogo ampio», era una città della tribù di Aser nella pianura dietro Acco, nel nord-ovest del paese. L’elenco di Aser in Giosuè nomina un Recob due volte, una presso Sidone e una con Umma e Afek alla fine, «ventidue città e i loro villaggi»; se siano due città o una elencata due volte è discusso, e la mappa le tiene distinte. Questo Recob, con i suoi pascoli, era una delle quattro città che Aser diede ai Leviti della famiglia di Gherson. Il libro dei Giudici aggiunge l’unico altro dato: «Ascer non cacciò gli abitanti di Acco», né quelli di Sidone, Acleb, Aczib, Chelba, Afek e Recob, così i Cananei rimasero e Aser abitò in mezzo a loro."
    - "Non vanno confusi con esso altri Recob: quello all’ingresso di Camat che gli esploratori raggiunsero, Bet-Recob degli Aramei presso Dan, e il grande Recob a sud di Bet-Sean, oggi Tel Rehov. Per la città di Aser la proposta abituale è Tell el-Bir el-Gharbi, oggi Tel Bira, un tell 8 km a est di Acco al margine della pianura con resti dell’età del Bronzo e del Ferro; Khirbet Da’uk, più vicina alla città, è l’altro candidato sulla mappa, e alcuni farebbero di questo Recob una cosa sola con il Recob presso Sidone. Nessuna iscrizione nomina il sito."
    - "Oggi il tell di Tel Bira sorge presso lo svincolo di Ahihud sulla strada da Acco alla Galilea, tra i campi della pianura di Acco."
  pl:
    - "Rechob, „szerokie miejsce”, było miastem pokolenia Aszera na równinie za Akko, w północno-zachodniej części kraju. Lista Aszera w Księdze Jozuego wymienia Rechob dwa razy, raz koło Sydonu i raz z Umma i Afek na końcu, „miast dwadzieścia i dwa, i wsi ich”; czy są to dwa miasta, czy jedno wymienione dwukrotnie, jest przedmiotem sporu, a mapa trzyma je osobno. Ten Rechob, z pastwiskami, był jednym z czterech miast, które Aszer oddał lewitom z rodu Gerszona. Księga Sędziów dodaje jedyny inny fakt: „Aser też nie wypędził mieszkających w Acho, i mieszkających w Sydonie, i w Ahalab, i w Achsyb, i w Helba, i w Afek, i w Rohob”, więc Kananejczycy pozostali i Aszer mieszkał wśród nich."
    - "Nie należy mylić go z innymi Rechobami: Rechobem u wejścia do Chamat, do którego dotarli zwiadowcy, Bet-Rechob Aramejczyków koło Dan i wielkim Rechobem na południe od Bet-Szean, dziś Tel Rechow. Dla miasta Aszera zwykle proponuje się Tell el-Bir el-Gharbi, dziś Tel Bira, kopiec 8 km na wschód od Akko na skraju równiny, z pozostałościami z epoki brązu i żelaza; Chirbet Da'uk, bliżej miasta, jest drugim kandydatem na mapie, a niektórzy uczyniliby ten Rechob jednym z Rechobem koło Sydonu. Żaden napis nie wymienia tego miejsca."
    - "Dziś kopiec Tel Bira stoi przy skrzyżowaniu Achihud na drodze z Akko do Galilei, wśród pól równiny Akko."
  cs:
    - "Rechob, „široké místo“, bylo město pokolení Ašer na rovině za Akkem, na severozápadě země. Ašerův seznam v Jozuovi jmenuje Rechob dvakrát, jednou poblíž Sidónu a jednou s Umou a Afekem na konci, „měst dvamecítma i vsi jejich“; zda jde o dvě města, nebo o jedno uvedené dvakrát, je předmětem sporu a mapa je ponechává oddělená. Tento Rechob s pastvinami byl jedním ze čtyř měst, která Ašer dal levitům z rodu Geršonova. Kniha Soudců dodává jediný další fakt: „Asser také nevyhnal obyvatelů Acho“, ani Sidónu, Achlabu, Achzívu, Chelby, Afeku a Rechobu, takže Kenaanští zůstali a Ašer žil mezi nimi."
    - "S ním nelze zaměňovat jiné Rechoby: Rechob u vchodu do Chamatu, kam došli vyzvědači, aramejský Bét-rechob poblíž Danu a velký Rechob jižně od Bét-šeanu, dnešní Tel Rechov. Pro ašerské město je obvyklým návrhem Tell el-Bir el-Garbí, dnes Tel Bira, pahorek 8 km východně od Akka na okraji roviny se zbytky z doby bronzové a železné; Chirbet Da'úk, blíže k městu, je druhým kandidátem na mapě a někteří by tento Rechob ztotožnili s Rechobem poblíž Sidónu. Žádný nápis lokalitu nejmenuje."
    - "Dnes stojí pahorek Tel Bira u křižovatky Achihud na silnici z Akka do Galileje, mezi poli akkské roviny."
  nl:
    - "Rechob, “wijde plaats”, was een stad van de stam Aser in de vlakte achter Akko, in het noordwesten van het land. Asers lijst in Jozua noemt tweemaal een Rechob, eenmaal bij Sidon en eenmaal met Umma en Afek aan het eind, “twee en twintig steden en haar dorpen”; of dit twee steden zijn of één die tweemaal is vermeld, wordt betwist, en de kaart houdt ze gescheiden. Dit Rechob, met zijn weidegronden, was een van de vier steden die Aser aan de Levieten van het geslacht Gerson gaf. Het boek Richteren voegt het enige andere feit toe: “Aser verdreef de inwoners van Acco niet”, noch die van Sidon, Achlab, Achsib, Chelba, Afik en Rechob, zodat de Kanaänieten bleven en Aser onder hen woonde."
    - "Andere Rechobs moeten er niet mee verward worden: het Rechob bij de ingang van Hamat dat de verspieders bereikten, Beth-Rechob van de Arameeërs bij Dan, en het grote Rechob ten zuiden van Beth-Sean, nu Tel Rechov. Voor Asers stad is het gebruikelijke voorstel Tell el-Bir el-Gharbi, nu Tel Bira, een heuvel 8 km ten oosten van Akko aan de rand van de vlakte met resten uit de brons- en ijzertijd; Khirbet Da’uk, dichter bij de stad, is de andere kandidaat op de kaart, en sommigen zouden dit Rechob één maken met het Rechob bij Sidon. Geen opschrift noemt de plaats."
    - "Tegenwoordig staat de heuvel Tel Bira bij de Achihud-kruising aan de weg van Akko naar Galilea, tussen de akkers van de vlakte van Akko."
  sv:
    - "Rehov, ”bred plats”, var en stad i Ashers stam på slätten bakom Acko, i landets nordväst. Ashers förteckning hos Josua nämner ett Rehov två gånger, en gång nära Sidon och en gång med Umma och Afek i slutet, ”tjugutvå städer med deras byar”; om dessa är två städer eller en som förtecknats två gånger diskuteras, och kartan håller isär dem. Detta Rehov, med sina betesmarker, var en av de fyra städer Asher gav åt leviterna av Gershons släkt. Domarboken tillför det enda andra som är känt: ”Aser fördrev icke invånarna i Acko”, och inte heller dem i Sidon, Achlav, Aksiv, Helba, Afik och Rehov, så att kananéerna blev kvar och Asher bodde bland dem."
    - "Andra Rehov får inte förväxlas med det: Rehov vid ingången till Hamat som spejarna nådde, arameernas Bet-Rehov nära Dan, och det stora Rehov söder om Bet-Shean, nu Tel Rehov. För Ashers stad är det vanliga förslaget Tell el-Bir el-Gharbi, nu Tel Bira, en kulle 8 km öster om Acko i slättens kant med lämningar från brons- och järnåldern; Khirbet Da'uk, närmare staden, är den andra kandidaten på kartan, och somliga skulle göra detta Rehov till ett med Rehov nära Sidon. Ingen inskription nämner platsen."
    - "I dag står Tel Bira vid Achihud-korsningen på vägen från Acko in i Galileen, bland fälten på Ackoslätten."
  nb:
    - "Rehob, «vid plass», var en by i Asjers stamme i sletten bak Akko, i landets nordvest. Asjers liste i Josva nevner et Rehob to ganger, én gang nær Sidon og én gang sammen med Umma og Afek på slutten, «i alt to og tyve byer med tilhørende landsbyer»; om dette er to byer eller én som er oppført to ganger, er det strid om, og kartet holder dem fra hverandre. Dette Rehob, med sine beitemarker, var en av de fire byene Asjer ga til levittene av Gersjons slekt. Dommernes bok legger til det eneste andre faktum: «Aser drev ikke bort innbyggerne i Akko», og heller ikke dem i Sidon, Ahlab, Aksib, Helba, Afik og Rehob, så kanaaneerne ble boende og Asjer bodde blant dem."
    - "Andre Rehob må ikke forveksles med det: Rehob ved inngangen til Hamat som spionene nådde, Bet-Rehob hos arameerne nær Dan, og det store Rehob sør for Bet-Sjean, nå Tel Rehov. For Asjers by er det vanlige forslaget Tell el-Bir el-Gharbi, nå Tel Bira, en haug 8 km øst for Akko i kanten av sletten med levninger fra bronse- og jernalderen; Khirbet Da'uk, nærmere byen, er den andre kandidaten på kartet, og noen vil gjøre dette Rehob til ett med Rehob nær Sidon. Ingen inskripsjon navngir stedet."
    - "I dag ligger haugen Tel Bira ved Ahihud-krysset på veien fra Akko inn i Galilea, blant åkrene på Akko-sletten."
  tl:
    - "Ang Rehob, “maluwang na dako”, ay isang bayan ng lipi ni Aser sa kapatagan sa likod ng Acho, sa hilagang-kanluran ng lupain. Dalawang beses pinangalanan ang Rehob sa listahan ni Aser sa Josue, minsan malapit sa Sidon at minsan kasama ng Umma at Aphec sa wakas, “dalawang pu't dalawang bayan pati ng mga nayon ng mga yaon”; pinagtatalunan kung dalawang bayan ito o iisang nakalista nang dalawang beses, at pinaghihiwalay ito ng mapa. Ang Rehob na ito, kasama ang mga pastulan nito, ay isa sa apat na bayang ibinigay ni Aser sa mga Levita ng angkan ni Gerson. Idinaragdag ng aklat ng Mga Hukom ang tanging iba pang katotohanan: “Hindi pinalayas ng Aser ang mga taga Acho, ni ang mga taga Sidon, ni ang taga Ahlab, ni ang taga Achzib, ni ang taga Helba, ni ang taga Aphec, ni ang taga Rehob”, kaya nanatili ang mga Cananeo at nanirahan ang Aser sa gitna nila."
    - "Hindi dapat ikalito rito ang ibang mga Rehob: ang Rehob sa pasukan ng Hamath na narating ng mga tiktik, ang Bethrehob ng mga Arameo malapit sa Dan, at ang malaking Rehob sa timog ng Beth-shean, ang Tel Rehov ngayon. Para sa bayan ni Aser, ang karaniwang mungkahi ay ang Tell el-Bir el-Gharbi, na Tel Bira ngayon, isang burol na 8 km sa silangan ng Acho sa gilid ng kapatagan na may mga labi mula sa Panahong Tanso at Bakal; ang Khirbet Da'uk, mas malapit sa lungsod, ang isa pang kandidato sa mapa, at nais ng ilang gawing iisa ang Rehob na ito at ang Rehob malapit sa Sidon. Walang inskripsiyong nagngangalan sa lugar."
    - "Sa ngayon, ang burol ng Tel Bira ay nasa tabi ng sangandaan ng Ahihud sa daan mula sa Acho patungong Galilea, sa gitna ng mga bukid ng kapatagan ng Acho."
  da:
    - "Rehob, »bred plads«, var en by i Asers stamme på sletten bag Akko, i landets nordvest. Asers liste i Josvabogen nævner et Rehob to gange, én gang nær Sidon og én gang med Umma og Afek til sidst, »to og tyve Stæder og deres Landsbyer«; om disse er to byer eller én opregnet to gange, er omstridt, og kortet holder dem adskilt. Dette Rehob, med sine græsgange, var en af de fire byer, Aser gav til leviterne af Gersjons slægt. Dommerbogen tilføjer det eneste andet faktum: »Aser fordrev ikke Indbyggerne i Akko«, ej heller dem i Sidon, Ahlab, Akzib, Helba, Afik og Rehob, så kana'anæerne blev, og Aser boede iblandt dem."
    - "Andre Rehob'er må ikke forveksles med det: Rehob ved indgangen til Hamat, som spejderne nåede, aramæernes Bet-Rehob nær Dan og det store Rehob syd for Bet-San, nu Tel Rehov. For Asers by er det sædvanlige forslag Tell el-Bir el-Gharbi, nu Tel Bira, en høj 8 km øst for Akko i slettens kant med rester fra bronze- og jernalderen; Khirbet Da'uk, nærmere byen, er den anden kandidat på kortet, og nogle ville gøre dette Rehob til ét med Rehob nær Sidon. Ingen indskrift nævner stedet."
    - "I dag ligger Tel Bira ved Akihud-krydset på vejen fra Akko ind i Galilæa, blandt markerne på Akko-sletten."
  sr:
    - "Реов, „широко место“, био је град племена Асировог у равници иза Акоа, на северозападу земље. Списак Асировог племена код Исуса Навина двапут именује Реов, једном код Сидона, и једном са Амом и Афеком на крају, „двадесет и два града са селима својим“; да ли су то два града или један наведен двапут, спорно је, а карта их држи одвојено. Овај Реов, са својим пашњацима, био је један од четири града које је Асир дао левитима Гирсоновог рода. Књига о Судијама додаје једину другу чињеницу: „Асир не изагна становнике из Акона“, ни оне из Сидона, Алава, Ахзива, Хелве, Афика и Реова, тако да су Хананеји остали, а Асир је живео међу њима."
    - "Други Реови не смеју се мешати с њим: Реов на уласку у Емат до кога су стигле уходе, Вет-Реов Арамејаца близу Дана и велики Реов јужно од Вет-Сана, данашњи Тел Рехов. За Асиров град уобичајени предлог је Тел ел-Бир ел-Гарби, данас Тел Бира, хумка 8 км источно од Акоа на ободу равнице са остацима из бронзаног и гвозденог доба; Хирбет Дауук, ближе граду, други је кандидат на карти, а неки би овај Реов изједначили с Реовом код Сидона. Ниједан натпис не именује налазиште."
    - "Данас хумка Тел Бира стоји код раскрснице Ахијуд на путу од Акоа у Галилеју, међу пољима равнице Ако."
  hu:
    - "Rehób, „tágas hely”, Áser törzsének városa volt az Akkó mögötti síkságon, az ország északnyugati részén. Áser Józsué-beli jegyzéke kétszer említ egy Rehóbot, egyszer Szidón közelében, egyszer Ummával és Áfekkel a végén, „Huszonkét város és ezeknek falui”; hogy két városról van-e szó vagy egyről kétszer felsorolva, arról vitatkoznak, és a térkép külön tartja őket. Ez a Rehób legelőivel együtt egyike volt annak a négy városnak, amelyet Áser Gérsón családjának levitáinak adott. A Bírák könyve hozzáteszi az egyetlen másik tényt: „Áser sem űzte el sem Akkó, sem Sidon, sem Akhláb, sem Akzib, sem Helba, sem Afik, sem Rehob lakóit”, így a kánaániak maradtak, és Áser közöttük élt."
    - "Nem szabad összetéveszteni más Rehóbokkal: azzal a Rehóbbal, amely a Hamát bejáratánál volt, amelyet a kémek elértek, az arámok Bét-Rehóbjával Dán közelében, és a Bét-Seántól délre fekvő nagy Rehóbbal, a mai Tel Rehovval. Áser városára a szokásos javaslat a Tell el-Bir el-Gharbi, a mai Tel Bira, egy halom Akkótól 8 km-re keletre a síkság szélén, bronz- és vaskori maradványokkal; a Khirbet Da'uk, közelebb a városhoz, a térkép másik jelöltje, és vannak, akik ezt a Rehóbot a Szidón melletti Rehóbbal egynek tartanák. Felirat nem nevezi meg a helyet."
    - "Ma a Tel Bira halma az Akkóból Galileába vezető út Ahihud-csomópontjánál áll, az akkói síkság mezői között."
  fi:
    - "Rehob, ”leveä paikka”, oli Asserin heimon kaupunki Akkon takaisella tasangolla maan luoteisosassa. Asserin luettelo Joosuan kirjassa mainitsee Rehobin kahdesti, kerran Sidonin lähellä ja kerran Umman ja Afekin kanssa lopussa, ”kaksikymmentä kaksi kaupunkia kylineen”; onko nämä kaksi kaupunkia vai yksi kahdesti luetteloitu, kiistellään, ja kartta pitää ne erillään. Tämä Rehob laidunmaineen oli yksi neljästä kaupungista, jotka Asser antoi Gersonin suvun leeviläisille. Tuomarien kirja lisää ainoan muun tiedon: ”Asser ei karkoittanut Akkon asukkaita” eikä Sidonin, Ahlabin, Aksibin, Helban, Afekin ja Rehobin asukkaita, joten kanaanilaiset jäivät ja Asser asui heidän keskellään."
    - "Muita Rehobeja ei pidä sekoittaa siihen: Hamatin sisäänkäynnillä oleva Rehob, jonne vakoojat ulottuivat, aramilaisten Bet-Rehob Danin lähellä ja Bet-Seanin eteläpuolinen suuri Rehob, nykyinen Tel Rehov. Asserin kaupungille tavallinen ehdotus on Tell el-Bir el-Gharbi, nykyinen Tel Bira, kumpu 8 km Akkosta itään tasangon reunalla, jossa on jäännöksiä pronssi- ja rautakaudelta; Khirbet Da'uk, lähempänä kaupunkia, on kartan toinen ehdokas, ja jotkut yhdistäisivät tämän Rehobin Sidonin lähellä olevaan Rehobiin. Mikään kirjoitus ei nimeä paikkaa."
    - "Nykyään Tel Biran kumpu seisoo Ahihudin risteyksen vieressä Akkosta Galileaan johtavan tien varrella Akkon tasangon peltojen keskellä."
  vi:
    - "Rê-hốp, “nơi rộng”, là một thành của chi phái A-se trong đồng bằng sau A-cô, ở tây bắc của xứ. Danh sách của A-se trong sách Giô-suê nêu một Rê-hốp hai lần, một lần gần Si-đôn và một lần cùng U-ma và A-phéc ở cuối danh sách, tổng cộng hai mươi hai thành cùng các làng của chúng; đó là hai thành hay một thành được liệt kê hai lần còn tranh cãi, và bản đồ giữ chúng riêng ra. Rê-hốp này, cùng đồng cỏ của nó, là một trong bốn thành A-se nhường cho người Lê-vi thuộc họ Ghẹt-sôn. Sách Các Quan Xét thêm một sự kiện duy nhất khác: “Người A-se cũng chẳng đuổi dân ở A-cô”, cũng như dân ở Si-đôn, Ách-láp, Ạc-xíp, Hên-ba, A-phéc và Rê-hốp, nên người Ca-na-an ở lại và A-se sống giữa họ."
    - "Không nên lẫn nó với các Rê-hốp khác: Rê-hốp ở lối vào Ha-mát mà các người do thám đến, Bết-Rê-hóp của người A-ram gần Đan, và Rê-hốp lớn phía nam Bết-Sê-an, nay là Tel Rehov. Đối với thành của A-se, đề xuất thông thường là Tell el-Bir el-Gharbi, nay là Tel Bira, một gò cách A-cô 8 km về phía đông ở rìa đồng bằng với di tích từ Thời đại Đồ Đồng và Đồ Sắt; Khirbet Da'uk, gần thành hơn, là ứng viên còn lại trên bản đồ, và một số người coi Rê-hốp này là một với Rê-hốp gần Si-đôn. Không bia ký nào nêu tên địa điểm."
    - "Ngày nay gò Tel Bira đứng cạnh ngã tư A-hi-hút trên con đường từ A-cô vào Ga-li-lê, giữa các cánh đồng của đồng bằng A-cô."
  ro:
    - "Rehob, „loc larg”, era o cetate a seminției lui Așer, în câmpia din spatele Acoului, în nord-vestul țării. Lista lui Așer din Iosua numește un Rehob de două ori, o dată lângă Sidon și o dată împreună cu Uma și Afec, la sfârșit, „cetăți douăzeci și două și satele lor”; dacă sunt două cetăți sau una înșirată de două ori se dezbate, iar harta le ține separate. Acest Rehob, cu pășunile lui, a fost una dintre cele patru cetăți date de Așer leviților din familia lui Gherșon. Cartea Judecătorilor adaugă singurul alt fapt: Așer nu i-a alungat pe locuitorii Acoului, nici pe cei din Sidon, Ahlab, Aczib, Helba, Afec și Rehob, așa că canaaniții au rămas, iar Așer a trăit printre ei."
    - "Alți Rehob nu trebuie confundați cu el: Rehobul de la intrarea în Hamat la care au ajuns iscoadele, Bet-Rehob al arameilor de lângă Dan și marele Rehob de la sud de Bet-Șean, acum Tel Rehov. Pentru cetatea lui Așer, propunerea obișnuită este Tell el-Bir el-Gharbi, acum Tel Bira, o movilă la 8 km est de Aco, la marginea câmpiei, cu rămășițe din Epoca bronzului și a fierului; Khirbet Da'uk, mai aproape de oraș, este celălalt candidat de pe hartă, iar unii ar face din acest Rehob una cu Rehobul de lângă Sidon. Nicio inscripție nu numește locul."
    - "Astăzi movila Tel Bira se află lângă intersecția Ahihud de pe drumul de la Aco spre Galileea, printre ogoarele câmpiei Acoului."
  bg:
    - "Рехов, „широко място“, бил град на племето Асир в равнината зад Акон, в северозападната част на страната. Списъкът на Асир у Иисус Навин назовава Рехов два пъти — веднъж близо до Сидон и веднъж с Ума и Афек накрая, „градове двадесет и два, и селата им“; дали това са два града, или един, изброен два пъти, е спорно, и картата ги държи отделно. Този Рехов с пасищата си бил един от четирите града, които Асир дал на левитите от рода на Гирсон. Книгата Съдии добавя единствения друг факт: „Нито Асир изгони жителите на Акхо“, нито тези на Сидон, Ахлав, Ахзив, Хелва, Афек и Рехов, така че ханаанците останали и Асир живял сред тях."
    - "Не бива да се бърка с други Рехови: Рехов при входа на Емат, до който стигнали съгледвачите, арамейския Бет-Рехов близо до Дан и големия Рехов на юг от Бет-Шеан, днес Тел Рехов. За града на Асир обичайното предложение е Тел ел-Бир ел-Гарби, днес Тел Бира — могила на 8 км източно от Акон на края на равнината, с останки от бронзовата и желязната епоха; Хирбет Даук, по-близо до града, е другият кандидат на картата, а някои биха отъждествили този Рехов с Рехов край Сидон. Никакъв надпис не назовава мястото."
    - "Днес могилата Тел Бира се издига при кръстовището Ахихуд по пътя от Акон към Галилея, сред нивите на Аконската равнина."
