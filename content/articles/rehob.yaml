# Overview article (ADR 0007). Mainstream facts only; a minor place: the site is disputed, the other Rehobs are kept apart, and the article says how little is known.
id: rehob
place: ab71288
title:
  en: "Rehob"
  ru: "Рехов"
  uk: "Рехов"
  es: "Rehob"
  pt: "Reobe"
  de: "Rehob"
  fr: "Rehob"
body:
  en:
    - "Rehob, “broad place”, was a town of the tribe of Asher in the plain behind Acco, in the north-west of the land. Asher's list in Joshua names a Rehob twice, once near Sidon and once with Ummah and Aphek at the end, “twenty and two cities with their villages”; whether these are two towns or one listed twice is argued, and the map keeps them apart. This Rehob, with its pasture lands, was one of the four towns Asher gave to the Levites of the family of Gershon. The book of Judges adds the only other fact: “Neither did Asher drive out the inhabitants of Accho”, nor those of Sidon, Ahlab, Achzib, Helbah, Aphik and Rehob, so the Canaanites stayed and Asher lived among them."
    - "Other Rehobs must not be confused with it: the Rehob at the entrance of Hamath that the spies reached, Beth-rehob of the Aramaeans near Dan, and the great Rehob south of Beth-shean, now Tel Rehov. For Asher's town the usual proposal is Tell el-Bir el-Gharbi, now Tel Bira, a mound 8 km east of Acco at the edge of the plain with remains from the Bronze and Iron Ages; Khirbet Da'uk, closer to the city, is the other candidate on the map, and some would make this Rehob one with the Rehob near Sidon. No inscription names the site."
    - "Today the mound of Tel Bira stands by the Ahihud junction on the road from Acco into the Galilee, among the fields of the Acco plain."
  ru:
    - "Рехов, «широкое место», — город колена Асирова на равнине за Акко, на северо-западе страны. Список Асира у Иисуса Навина называет Рехов дважды: раз близ Сидона и раз с Уммой и Афеком в самом конце, «двадцать два города с селами их»; два ли это города или один, названный дважды, спорят, и на карте они разделены. Этот Рехов с предместьями был одним из четырёх городов, которые Асир отдал левитам из рода Гирсона. Книга Судей прибавляет единственный другой факт: «И Асир не изгнал жителей Акко», ни жителей Сидона, Ахлава, Ахзива, Хелвы, Афека и Рехова, так что Хананеи остались, и Асир жил среди них."
    - "Его не надо путать с другими Реховами: Реховом у входа в Емаф, до которого дошли соглядатаи, арамейским Беф-Реховом близ Дана и большим Реховом к югу от Беф-Сана, нынешним Тель-Реховом. Для города Асира обычно предлагают Телль-эль-Бир-эль-Гарби, нынешний Тель-Бира, холм в 8 км к востоку от Акко на краю равнины с остатками бронзового и железного веков; Хирбет-Даук ближе к городу — другой кандидат на карте, а некоторые объединяют этот Рехов с Реховом близ Сидона. Надписи с именем места нет."
    - "Сегодня холм Тель-Бира стоит у развязки Ахихуд на дороге из Акко в Галилею, среди полей долины Акко."
  uk:
    - "Рехов, «широке місце», було містом коліна Асіра на рівнині за Акко, на північному заході краю. У переліку Асіра в книзі Ісуса Навина Рехов названо двічі: один раз поблизу Сідона, а вдруге з Уммою й Афеком наприкінці, «двайцять і два городи з їх селами»; чи це два міста, чи одне, згадане двічі, — предмет суперечки, і карта тримає їх окремо. Цей Рехов з його пасовищами був одним із чотирьох міст, які Асір віддав левітам роду Гершома. Книга Суддів додає єдиний інший факт: «І Ассер не повиганяв осадників Акковських», як і мешканців Сідона, Ахлава, Ахзіва, Хелви, Афека й Рехова, тож ханаанці лишилися, а Асір жив серед них."
    - "З ним не слід плутати інші Рехови: Рехов при вході до Хамата, куди дійшли розвідники, Бет-Рехов арамеїв поблизу Дана та великий Рехов на південь від Бет-Шеана, нині Тель-Рехов. Для міста Асіра зазвичай пропонують Телль-ель-Бір-ель-Ґарбі, нині Тель-Біра, курган за 8 км на схід від Акко на краю рівнини із залишками бронзової та залізної доби; Хірбет-Дау’ук, ближче до міста, — другий кандидат на карті, а дехто ототожнив би цей Рехов із Реховом поблизу Сідона. Жоден напис не називає це місце."
    - "Сьогодні курган Тель-Біра стоїть біля розв’язки Ахіхуд на дорозі з Акко до Галілеї, серед полів рівнини Акко."
  es:
    - "Rehob, «lugar ancho», era una ciudad de la tribu de Aser en la llanura detrás de Aco, en el noroeste del país. La lista de Aser en Josué nombra un Rehob dos veces, una cerca de Sidón y otra con Uma y Afec al final, «veinte y dos ciudades con sus aldeas»; si son dos ciudades o una sola enumerada dos veces se discute, y el mapa las mantiene separadas. Este Rehob, con sus tierras de pasto, fue una de las cuatro ciudades que Aser dio a los levitas de la familia de Gersón. El libro de Jueces añade el único otro dato: «Tampoco Aser echó á los que habitaban en Achô», ni a los de Sidón, Ahlab, Aczib, Helba, Afec y Rehob, de modo que los cananeos se quedaron y Aser vivió entre ellos."
    - "No hay que confundirlo con otros Rehob: el Rehob a la entrada de Hamat al que llegaron los espías, Bet-rehob de los arameos cerca de Dan, y el gran Rehob al sur de Bet-seán, hoy Tel Rehov. Para la ciudad de Aser la propuesta habitual es Tell el-Bir el-Gharbi, hoy Tel Bira, un montículo a 8 km al este de Aco, en el borde de la llanura, con restos de las Edades del Bronce y del Hierro; Khirbet Da'uk, más cercana a la ciudad, es el otro candidato del mapa, y algunos harían de este Rehob uno solo con el Rehob cercano a Sidón. Ninguna inscripción nombra el lugar."
    - "Hoy el montículo de Tel Bira se alza junto al cruce de Ahihud, en el camino de Aco a Galilea, entre los campos de la llanura de Aco."
  pt:
    - "Reobe, “lugar largo”, era uma cidade da tribo de Aser na planície atrás de Aco, no noroeste da terra. A lista de Aser em Josué nomeia uma Reobe duas vezes, uma perto de Sidom e outra com Uma e Afeque no fim, “vinte e duas cidades com as suas aldeias”; se são duas cidades ou uma só listada duas vezes, discute-se, e o mapa as mantém separadas. Esta Reobe, com suas pastagens, foi uma das quatro cidades que Aser deu aos levitas da família de Gérson. O livro de Juízes acrescenta o único outro fato: “Aser não expulsou os habitantes de Aco”, nem os de Sidom, Alabe, Aczibe, Helba, Afeque e Reobe, de modo que os cananeus ficaram e Aser viveu entre eles."
    - "Outras Reobes não devem ser confundidas com ela: a Reobe à entrada de Hamate que os espias alcançaram, Bete-Reobe dos arameus perto de Dã, e a grande Reobe ao sul de Bete-Seã, hoje Tel Rehov. Para a cidade de Aser a proposta habitual é Tell el-Bir el-Gharbi, hoje Tel Bira, um monte a 8 km a leste de Aco, na orla da planície, com restos das Idades do Bronze e do Ferro; Khirbet Da'uk, mais perto da cidade, é o outro candidato do mapa, e alguns fariam desta Reobe uma só com a Reobe perto de Sidom. Nenhuma inscrição nomeia o local."
    - "Hoje o monte de Tel Bira fica junto ao cruzamento de Ahihud, na estrada de Aco para a Galileia, entre os campos da planície de Aco."
  de:
    - "Rehob, „weiter Platz“, war eine Stadt des Stammes Asser in der Ebene hinter Akko, im Nordwesten des Landes. Assers Liste bei Josua nennt zweimal ein Rehob, einmal nahe Sidon und einmal mit Umma und Afek am Schluss, „Zweiundzwanzig Städte und ihre Dörfer“; ob das zwei Städte oder eine zweimal genannte sind, ist umstritten, und die Karte hält sie getrennt. Dieses Rehob mit seinen Weideplätzen war eine der vier Städte, die Asser den Leviten aus dem Geschlecht Gerschon gab. Das Buch der Richter fügt die einzige weitere Tatsache hinzu: „Asser vertrieb die Einwohner zu Akko nicht“, noch die von Sidon, Achlab, Achsib, Helba, Afek und Rehob, sodass die Kanaaniter blieben und Asser unter ihnen lebte."
    - "Andere Rehobs sind nicht mit ihm zu verwechseln: das Rehob am Eingang von Hamat, das die Kundschafter erreichten, Bet-Rehob der Aramäer nahe Dan und das große Rehob südlich von Bet-Schean, heute Tel Rehov. Für Assers Stadt lautet der übliche Vorschlag Tell el-Bir el-Gharbi, heute Tel Bira, ein Hügel 8 km östlich von Akko am Rand der Ebene mit Resten aus der Bronze- und Eisenzeit; Chirbet Da'uk, näher an der Stadt, ist der andere Kandidat auf der Karte, und manche würden dieses Rehob mit dem Rehob nahe Sidon gleichsetzen. Keine Inschrift nennt die Stätte."
    - "Heute steht der Hügel Tel Bira an der Kreuzung Ahihud auf der Straße von Akko nach Galiläa, zwischen den Feldern der Akko-Ebene."
  fr:
    - "Rehob, « lieu spacieux », était une ville de la tribu d’Aser dans la plaine derrière Acco, au nord-ouest du pays. La liste d’Aser chez Josué nomme un Rehob deux fois, l’une près de Sidon et l’autre avec Umma et Aphek à la fin, « Vingt-deux villes, et leurs villages » ; s’agit-il de deux villes ou d’une seule citée deux fois, on en discute, et la carte les garde distinctes. Ce Rehob, avec ses pâturages, fut l’une des quatre villes qu’Aser donna aux Lévites de la famille de Guerschon. Le livre des Juges ajoute le seul autre fait : « Aser ne chassa point les habitants d’Acco », ni ceux de Sidon, d’Achlal, d’Aczib, de Helba, d’Aphik et de Rehob, de sorte que les Cananéens restèrent et qu’Aser habita parmi eux."
    - "Il ne faut pas le confondre avec d’autres Rehob : le Rehob à l’entrée de Hamath que les explorateurs atteignirent, Beth-Rehob des Araméens près de Dan, et le grand Rehob au sud de Beth-Schean, aujourd’hui Tel Rehov. Pour la ville d’Aser, la proposition courante est Tell el-Bir el-Gharbi, aujourd’hui Tel Bira, tertre à 8 km à l’est d’Acco au bord de la plaine, avec des vestiges des âges du Bronze et du Fer ; Khirbet Da‘uk, plus près de la ville, est l’autre candidat de la carte, et certains feraient de ce Rehob le même que le Rehob près de Sidon. Aucune inscription ne nomme le site."
    - "Aujourd’hui, le tertre de Tel Bira se dresse près du carrefour d’Ahihud, sur la route d’Acco vers la Galilée, parmi les champs de la plaine d’Acco."
