# Overview article (ADR 0007). Mainstream facts only; this is Achzib of Judah, not the Phoenician harbour; the identification with Tell el-Beida is said to rest on the lists, not on finds.
id: achzib-judah
place: a2270e4
title:
  en: "Achzib in Judah"
  ru: "Ахзив в Иудее"
  uk: "Ахзів у Юдеї"
  es: "Aczib en Judá"
  pt: "Aczibe em Judá"
  de: "Achsib in Juda"
  fr: "Aczib en Juda"
  it: "Aczib in Giuda"
  pl: "Akzib w Judzie"
  nl: "Achzib in Juda"
  cs: "Achzív v Judsku"
  sv: "Aksiv i Juda"
