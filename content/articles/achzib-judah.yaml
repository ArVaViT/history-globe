body:
  en:
    - "There were two towns called Achzib. The better known was a Phoenician harbour on the coast of Galilee; this one lay in the Shephelah, the low hills of Judah, where Joshua lists it in one district with “Keilah, and Achzib, and Mareshah”. It is generally taken to be the Chezib where Judah's wife bore his son Shelah, and the Chozeba of the genealogy of Judah. The usual identification is Tell el-Beida (Horvat Lavnin), a mound between Adullam and Mareshah; it fits the lists, but the site has not been excavated and nothing found there names the town."
    - "Micah plays on the name, which sounds like the Hebrew for a lie, in his lament over the towns of the Shephelah: “the houses of Achzib shall be a lie to the kings of Israel”. The Synodal Bible renders the name there as Akhzi-Bev. With that the record ends. The mound lies today in Israel south-west of Jerusalem, in the countryside of Adullam."
  ru:
    - "Городов по имени Ахзив было два. Более известный был финикийской гаванью на берегу Галилеи; этот лежал в Шефеле, низких холмах Иудеи, где книга Иисуса Навина числит его в одном округе: «Кеила, Ахзив и Мареша». Его обычно считают тем Хезивом, где жена Иуды родила ему сына Шелу, и Хозевой из родословия Иуды. Принятое отождествление — Телль-эль-Бейда (Хорват-Лавнин), холм между Одолламом и Марешей; оно согласуется со списками, но раскопок там не было, и ничто найденное не называет города."
    - "Михей обыгрывает имя, созвучное еврейскому слову «обман», в плаче о городах Шефелы: «селения Ахзи-Бева будут обманом для царей Израилевых» — так передаёт имя Синодальный перевод. На этом запись кончается. Холм лежит сегодня в Израиле к юго-западу от Иерусалима, в окрестностях Одоллама."
  uk:
    - "Було два міста з назвою Ахзів. Відоміший був фінікійською гаванню на узбережжі Галілеї; цей лежав у Шефелі, низьких пагорбах Юди, де Ісус Навин зараховує його до одного округу з «Кеілою, Ахсибом та Марешею». Його загалом ототожнюють із Хезівом, де дружина Юди народила йому сина Салу, і з Хозевою з родоводу Юди. Звичайне ототожнення — Телль-ель-Бейда (Хорват-Лавнін), пагорб між Одоламом і Марешею; воно відповідає переліку, але місце не розкопували, і ніщо знайдене там не називає міста."
    - "Міха обігрує назву, що звучить як єврейське слово «обман», у плачі над містами Шефели: «люде ж Ахзивські будуть оманом царям Ізраїльським». Синодальний переклад передає там назву як Ахзі-Бев. На цьому запис закінчується. Пагорб лежить нині в Ізраїлі на південний захід від Єрусалима, в околицях Одолама."
  es:
    - "Hubo dos ciudades llamadas Aczib. La más conocida era un puerto fenicio en la costa de Galilea; esta se hallaba en la Sefelá, las colinas bajas de Judá, donde Josué la enumera en un mismo distrito con «Ceila, y Achzib, y Maresa». Se suele identificar con el Quezib donde la esposa de Judá dio a luz a su hijo Sela, y con el Cozeba de la genealogía de Judá. La identificación habitual es Tell el-Beida (Horvat Lavnin), un montículo entre Adulam y Maresa; encaja con las listas, pero el sitio no ha sido excavado y nada de lo hallado allí nombra la ciudad."
    - "Miqueas juega con el nombre, que suena como la palabra hebrea para mentira, en su lamento por las ciudades de la Sefelá: «las casas de Achzib serán en mentira á los reyes de Israel». La Biblia sinodal da ahí el nombre como Akhzi-Bev. Con eso termina el registro. Hoy el montículo se halla en Israel, al sudoeste de Jerusalén, en la campiña de Adulam."
  pt:
    - "Havia duas cidades chamadas Aczibe. A mais conhecida era um porto fenício na costa da Galileia; esta ficava na Sefelá, as colinas baixas de Judá, onde Josué a lista num mesmo distrito com “Queila, Aczibe e Maressa”. É geralmente tomada pela Quezibe onde a mulher de Judá deu à luz o seu filho Selá, e pela Cozeba da genealogia de Judá. A identificação habitual é Tell el-Beida (Horvat Lavnin), um montículo entre Adulão e Maressa; ajusta-se às listas, mas o sítio não foi escavado e nada do que ali se achou nomeia a cidade."
    - "Miqueias joga com o nome, que soa como a palavra hebraica para mentira, em seu lamento sobre as cidades da Sefelá: “As casas de Aczibe serão um engano para os reis de Israel”. A Bíblia sinodal russa traduz ali o nome como Akhzi-Bev. Com isso termina o registro. O montículo fica hoje em Israel, a sudoeste de Jerusalém, na região rural de Adulão."
  de:
    - "Es gab zwei Städte namens Achsib. Die bekanntere war ein phönizischer Hafen an der Küste Galiläas; diese hier lag in der Schefela, dem Hügelland Judas, wo Josua sie im selben Bezirk aufführt mit „Kegila, Achsib, Maresa“. Man hält sie allgemein für das Kesib, wo die Frau Judas ihm seinen Sohn Schela gebar, und für das Koseba im Geschlechtsregister Judas. Üblich ist die Gleichsetzung mit Tell el-Beida (Chorbat Lavnin), einem Hügel zwischen Adullam und Maresa; sie passt zu den Listen, aber der Ort wurde nicht ausgegraben, und kein Fund dort nennt den Namen der Stadt."
    - "Micha spielt in seiner Klage über die Städte der Schefela mit dem Namen, der an das hebräische Wort für Lüge anklingt: „Mit der Stadt Achsib wird's den Königen Israels fehlgehen.“ Die Synodalbibel gibt den Namen dort als Akhzi-Bev wieder. Damit endet die Überlieferung. Der Hügel liegt heute in Israel südwestlich von Jerusalem, im Umland von Adullam."
  fr:
    - "Il y eut deux villes nommées Aczib. La mieux connue était un port phénicien de la côte de Galilée ; celle-ci se trouvait dans la Shéphéla, les basses collines de Juda, où Josué la range dans un même district avec « Keïla, Aczib, et Maréscha ». On la tient généralement pour le Czib où l’épouse de Juda enfanta son fils Schéla, et pour le Cozéba de la généalogie de Juda. L’identification habituelle est Tell el-Beida (Horvat Lavnin), tertre situé entre Adullam et Maréscha ; elle s’accorde avec les listes, mais le site n’a pas été fouillé et rien de ce qu’on y a trouvé ne nomme la ville."
    - "Michée joue sur le nom, qui sonne comme le mot hébreu pour le mensonge, dans sa lamentation sur les villes de la Shéphéla : « Les maisons d’Aczib seront une source trompeuse pour les rois d’Israël ». La Bible synodale rend ici le nom par Akhzi-Bev. Là s’arrête le dossier. Le tertre se trouve aujourd’hui en Israël, au sud-ouest de Jérusalem, dans la campagne d’Adullam."
  it:
    - "Esistevano due città chiamate Aczib. La più nota era un porto fenicio sulla costa della Galilea; questa sorgeva nella Sefela, le basse colline di Giuda, dove Giosuè la elenca in un unico distretto con «Keila, Aczib e Maresha». Si ritiene in genere che sia la Chezib dove la moglie di Giuda partorì il figlio Sela, e la Cozeba della genealogia di Giuda. L’identificazione abituale è Tell el-Beida (Horvat Lavnin), un tell tra Adullam e Maresa; si accorda con gli elenchi, ma il sito non è stato scavato e nulla di ciò che vi si è trovato nomina la città."
    - "Michea gioca sul nome, che suona come la parola ebraica per menzogna, nel suo lamento sulle città della Sefela: «le case d’Aczib saranno una cosa ingannevole per i re d’Israele». La Bibbia sinodale rende lì il nome come Akhzi-Bev. Qui la documentazione termina. Il tell si trova oggi in Israele a sud-ovest di Gerusalemme, nella campagna di Adullam."
  pl:
    - "Były dwa miasta o nazwie Akzib. Lepiej znany był fenicki port na wybrzeżu Galilei; ten leżał w Szefeli, niskich wzgórzach Judy, gdzie Jozue wymienia je w jednym okręgu z „Ceila, i Achzyb, i Maresa”. Zwykle uważa się je za Kezib, gdzie żona Judy urodziła mu syna Szelę, i za Kozebę z rodowodu Judy. Zwykle utożsamia się je z Tell el-Beida (Horvat Lavnin), tellem między Adullam a Maresą; pasuje do wykazów, lecz miejsce nie było wykopywane i nic tam znalezionego nie podaje nazwy miasta."
    - "Mika bawi się tą nazwą, brzmiącą jak hebrajskie słowo oznaczające kłamstwo, w lamencie nad miastami Szefeli: „domy Achzyb na oszukanie będą królom Izraelskim”. Biblia synodalna oddaje tam tę nazwę jako Achzi-Bew. Na tym zapis się kończy. Tell leży dziś w Izraelu na południowy zachód od Jerozolimy, na wsi Adullam."
  nl:
    - "Er waren twee steden met de naam Achzib. De bekendste was een Fenicische haven aan de kust van Galilea; deze lag in de Sefela, het lage heuvelland van Juda, waar Jozua haar in één district opsomt met “Kehila, en Achzib, en Mareza”. Algemeen wordt zij gehouden voor het Chezib waar de vrouw van Juda zijn zoon Sela baarde, en voor het Chozeba uit het geslachtsregister van Juda. De gebruikelijke identificatie is Tell el-Beida (Horvat Lavnin), een heuvel tussen Adullam en Maresa; dat past bij de lijsten, maar de plaats is niet opgegraven en niets wat er is gevonden, noemt de stad."
    - "Micha speelt met de naam, die klinkt als het Hebreeuwse woord voor een leugen, in zijn klaagzang over de steden van de Sefela: “de huizen van Achzib zullen den koningen van Israel tot een leugen zijn”. De Synodale Bijbel geeft de naam daar weer als Achzi-Bev. Daarmee eindigt het bericht. De heuvel ligt tegenwoordig in Israël, ten zuidwesten van Jeruzalem, in het landschap van Adullam."
  cs:
    - "Existovala dvě města jménem Achzív. Známější byl fénický přístav na pobřeží Galileje; toto leželo v Šefele, nízkých pahorcích Judy, kde je Jozue uvádí v jednom okrsku s „Ceila, Achzib a Maresa“. Obecně se pokládá za Kezib, kde Judova žena porodila jeho syna Šelu, a za Chozebu z rodokmenu Judova. Obvyklým ztotožněním je Tell el-Beida (Chorvat Lavnin), pahorek mezi Adulamem a Marešou; odpovídá seznamům, ale místo nebylo vykopáno a nic, co se tam našlo, město nejmenuje."
    - "Micheáš si pohrává s jménem, které zní jako hebrejské slovo pro lež, ve svém nářku nad městy Šefely: „domové Achzib zklamají krále Izraelské“. Synodální bible vykládá tamní jméno jako Achzi-Bev. Tím záznam končí. Pahorek leží dnes v Izraeli jihozápadně od Jeruzaléma, na venkově Adulamu."
  sv:
    - "Det fanns två städer som hette Aksiv. Den bättre kända var en fenicisk hamn vid Galileens kust; denna låg i Shefela, Judas låga kullar, där Josua räknar upp den i samma distrikt som ”Kegila, Aksib och Maresa”. Den anses vanligen vara det Kesiv där Judas hustru födde hans son Shela, och det Koseba som nämns i Judas släkttavla. Den vanliga identifieringen är Tell el-Beida (Horvat Lavnin), en kulle mellan Adullam och Maresha; den passar förteckningarna, men platsen har inte grävts ut och inget som hittats där nämner staden."
    - "Mika leker med namnet, som låter som det hebreiska ordet för lögn, i sin klagan över Shefelas städer: ”Husen i Aksib hava för Israels konungar blivit såsom en försinande bäck” (King James-översättningen har ”a lie”, ”en lögn”). Synodalbibeln återger namnet där som Akhzi-Bev. Därmed upphör uppgifterna. Kullen ligger i dag i Israel sydväst om Jerusalem, i Adullams landsbygd."
  nb:
    - "Det fantes to byer som het Aksib. Den best kjente var en fønikisk havn på kysten av Galilea; denne lå i Sjefela, de lave åsene i Juda, der Josva oppfører den i samme distrikt som «Ke'ila og Aksib og Maresa». Den regnes vanligvis for det Kesib der Judas hustru fødte hans sønn Sjela, og for Koseba i Judas slektsregister. Den vanlige identifiseringen er Tell el-Beida (Horvat Lavnin), en tell mellom Adullam og Maresja; den passer med listene, men stedet er ikke gravd ut, og ingenting funnet der nevner byens navn."
    - "Mika leker med navnet, som lyder som det hebraiske ordet for en løgn, i sin klage over byene i Sjefela: «husene i Aksib blir som en sviktende bekk for Israels konger». Synodalbibelen gjengir navnet der som Akhzi-Bev. Dermed ender beretningen. Tellen ligger i dag i Israel sørvest for Jerusalem, i landskapet rundt Adullam."
  tl:
    - "Dalawang bayan ang tinatawag na Achzib. Ang mas kilala ay isang pantalang Fenicio sa baybayin ng Galilea; ang isang ito ay nasa Sephela, ang mabababang burol ng Juda, kung saan inililista ito ni Josue sa iisang distrito kasama ng “Ceila, at Achzib, at Maresa”. Karaniwang itinuturing na ito ang Chezib kung saan ipinanganak ng asawa ni Juda ang kaniyang anak na si Selah, at ang Chozeba ng talaan ng lahi ni Juda. Ang karaniwang pagtukoy ay ang Tell el-Beida (Horvat Lavnin), isang burol sa pagitan ng Adullam at Maresa; angkop ito sa mga talaan, ngunit hindi pa nahuhukay ang lugar at walang natagpuan doon na nagpapangalan sa bayan."
    - "Nilalaro ni Mikas ang pangalan, na kahawig ng tunog ng salitang Hebreo para sa kasinungalingan, sa kaniyang panaghoy sa mga bayan ng Sephela: “ang mga bahay sa Achzib ay magiging karayaang bagay sa mga hari sa Israel”. Ginagawa ng Sinodal na Biblia ang pangalan doon bilang Akhzi-Bev. Doon nagtatapos ang tala. Ang burol ay nasa Israel ngayon sa timog-kanluran ng Jerusalem, sa kabukiran ng Adullam."
  da:
    - "Der var to byer ved navn Akzib. Den bedst kendte var en fønikisk havn ved Galilæas kyst; denne lå i Sjefela, Judas lave bakker, hvor Josva opregner den i ét distrikt med »Keila og Aksib og Maresa«. Den regnes almindeligvis for det Kezib, hvor Judas hustru fødte hans søn Sjela, og for Koseba i Judas slægtsregister. Den sædvanlige identifikation er Tell el-Beida (Horvat Lavnin), en tell mellem Adullam og Maresja; den passer til listerne, men stedet er ikke udgravet, og intet fundet dér nævner byen ved navn."
    - "Mika spiller på navnet, der lyder som det hebraiske ord for en løgn, i sin klage over Sjefelas byer: »Aksibs Huse skulle blive et svigtende Vandløb for Israels Konger«. Synodalbibelen gengiver dér navnet som Akhzi-Bev. Dermed ender overleveringen. Tellen ligger i dag i Israel sydvest for Jerusalem, i landskabet omkring Adullam."
  sr:
    - "Постојала су два града по имену Ахзив. Познатији је био фенички пристан на обали Галилеје; овај је лежао у Сефели, ниским брдима Јуде, где га Исус Навин наводи у истом округу с „Кеила и Ахзив и Мариса“. Обично се сматра да је то Хасви где је Јудина жена родила његовог сина Салу и Хозева из Јудиног родослова. Уобичајено поистовећивање је Тел ел-Беида (Хорват Лавнин), хумка између Одолама и Мариса; одговара списковима, али налазиште није ископавано и ништа што је ту нађено не именује град."
    - "Миха игра именом, које звучи као хебрејска реч за лаж, у свом нарицању над градовима Сефеле: „домови ахсивски превариће цареве Израиљеве“. Синодална Библија ту име преноси као Ахзи-Бев. Тиме се запис завршава. Хумка данас лежи у Израелу југозападно од Јерусалима, у околини Одолама."
  hu:
    - "Két Akzib nevű város volt. A jobban ismert föníciai kikötő volt Galilea partján; ez a Sefélában, Júda alacsony dombvidékén feküdt, ahol Józsué ugyanabban a kerületben sorolja fel: „Keila, Akzib és Marésa”. Általában azonosnak tartják azzal a Kezibbel, ahol Júda felesége megszülte fiát, Sélát, és a júdai nemzetségtábla Kozebájával. A szokásos azonosítás a Tell el-Beida (Horvat Lavnin), egy halom Adullám és Maresa között; megfelel a jegyzékeknek, de a helyet nem ásták ki, és semmi, amit ott találtak, nem nevezi meg a várost."
    - "Mikeás a névvel játszik, amely a héber „hazugság” szóra hasonlít, a sefélai városok felett mondott siralmában: „Akzib házai megcsalják Izráel királyait”. A szinodális Biblia itt a nevet Akhzi-Bev alakban adja. Ezzel a feljegyzés véget ér. A halom ma Izráelben fekszik, Jeruzsálemtől délnyugatra, Adullám vidékén."
  fi:
    - "Aksib-nimisiä kaupunkeja oli kaksi. Tunnetumpi oli foinikialainen satama Galilean rannikolla; tämä sijaitsi Sefelassa, Juudan matalilla kukkuloilla, missä Joosua luettelee sen samaan piiriin: ”Kegila, Aksib ja Maaresa”. Sen katsotaan yleensä olevan Kesib, jossa Juudan vaimo synnytti hänen poikansa Selan, ja Juudan sukuluettelon Koseba. Tavallinen samaistus on Tell el-Beida (Horvat Lavnin), kumpu Adullamin ja Maresan välillä; se sopii luetteloihin, mutta paikkaa ei ole kaivettu, eikä sieltä ole löytynyt mitään, mikä nimeäisi kaupungin."
    - "Miika leikittelee nimellä, joka kuulostaa heprean valheen sanalta, valituksessaan Sefelan kaupungeista: ”Aksibin talot tulevat olemaan pettymys Israelin kuninkaille”. Synodaalinen Raamattu kääntää nimen siellä muodossa Akhzi-Bev. Tähän tieto päättyy. Kumpu sijaitsee nykyisin Israelissa Jerusalemista lounaaseen, Adullamin maaseudulla."
  vi:
    - "Có hai thành mang tên Ạc-xíp. Thành được biết đến nhiều hơn là một cảng của người Phê-ni-xi trên bờ biển Ga-li-lê; thành này nằm ở Sê-phê-la, vùng đồi thấp của Giu-đa, nơi Giô-suê liệt kê nó trong cùng một quận với “Kê-i-la, Ạc-xíp, và Ma-rê-sa”. Nói chung người ta cho đó là Kê-xíp, nơi vợ của Giu-đa sinh con trai ông là Sê-la, và là Cô-xê-ba trong gia phả của Giu-đa. Sự đồng nhất thông thường là Tell el-Beida (Horvat Lavnin), một gò giữa A-đu-lam và Ma-rê-sa; nó khớp với các danh sách, nhưng địa điểm chưa được khai quật và không có gì tìm thấy ở đó nêu tên thành."
    - "Mi-chê chơi chữ với tên này, vốn nghe giống từ Hê-bơ-rơ chỉ sự dối trá, trong lời than khóc của ông về các thành ở Sê-phê-la: “Các nhà của Ạc-xíp sẽ lừa dối các vua Y-sơ-ra-ên”. Kinh Thánh Synodal tiếng Nga dịch tên này ở đó là Akhzi-Bev. Ghi chép chấm dứt tại đó. Gò này ngày nay nằm ở Israel, phía tây nam Giê-ru-sa-lem, trong vùng quê A-đu-lam."
  ro:
    - "Au existat două cetăți numite Aczib. Cea mai cunoscută era un port fenician pe coasta Galileii; aceasta se afla în Șefela, dealurile joase ale lui Iuda, unde Iosua o înșiră într-un singur district alături de Cheila și Mareșa. Este socotită în general Chezibul în care soția lui Iuda i-a născut fiul Șela și Chozeba din genealogia lui Iuda. Identificarea obișnuită este Tell el-Beida (Horvat Lavnin), un tell între Adulam și Mareșa; se potrivește listelor, dar locul nu a fost excavat și nimic din ce s-a găsit acolo nu numește cetatea."
    - "Mica face un joc de cuvinte cu numele, care sună ca termenul ebraic pentru minciună, în plângerea sa asupra cetăților din Șefela: casele Aczibului vor fi o amăgire pentru regii lui Israel. Biblia sinodală rusă redă acolo numele ca Ahzi-Bev. Aici se oprește mărturia. Tellul se află astăzi în Israel, la sud-vest de Ierusalim, în ținutul Adulamului."
  bg:
    - "Имало два града на име Ахзив. По-известният бил финикийско пристанище на брега на Галилея; този лежал в Шефела, ниските хълмове на Юда, където Иисус Навин го изброява в един окръг: „и Кеила, и Ахзив, и Мариса“. Обикновено се смята за Хезив, където жената на Юда родила сина му Сала, и за Хозива от родословието на Юда. Обичайното отъждествяване е Тел ел-Бейда (Хорват Лавнин), могила между Одолам и Мареша; тя отговаря на списъците, но мястото не е разкопавано и нищо намерено там не назовава града."
    - "Миха играе с името, което звучи като еврейската дума за лъжа, в оплакването си над градовете на Шефела: „Домовете на Ахзив ще излъжат Израилевите царе“. Синодалната Библия предава името там като Ахзи-Бев. С това записът свършва. Могилата лежи днес в Израил югозападно от Йерусалим, в околностите на Одолам."
