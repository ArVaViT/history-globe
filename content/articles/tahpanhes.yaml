# Overview article (ADR 0007). Mainstream facts only; Egyptian dates follow I. Shaw (ed.), The Oxford History of Ancient Egypt.
id: tahpanhes
place: adb008c
title:
  en: "Tahpanhes"
  ru: "Тафнис"
  uk: "Тафніс"
  es: "Tafnes"
  pt: "Tafnes"
  de: "Tachpanhes"
  fr: "Tachpanès"
  pl: "Tachpanches"
  it: "Tafni"
  nl: "Tachpanhes"
  cs: "Tachpanchés"
body:
  en:
    - "Tahpanhes, which the Greeks called Daphnae of Pelusium, is the mound of Tell Defenneh on the eastern edge of the Nile delta, close to the modern Suez Canal. It stood on the road from Egypt to Syria and Palestine. Herodotus says that Psammetichus, that is Psamtik I (664–610 BC), stationed a garrison at Daphnae against the Arabians and Assyrians, and that in his own day the Persians still kept an outpost there."
    - "Flinders Petrie excavated the site in 1886. In the fort he found foundation deposits of Psamtik I, and so much Greek pottery, made by Greeks, that he judged the garrison and much of the town to have been Greek. The Bedouin called the ruin Qasr Bint el-Yehudi, the palace of the Jew's daughter. Petrie took a brick platform before the fort for the place at the entry of Pharaoh's house where Jeremiah was told to hide the stones, a link that cannot be proved."
    - 'Jeremiah tells Israel that "the children of Noph and Tahapanes have broken the crown of thy head". After Gedaliah was murdered, Johanan the son of Kareah and the captains led the remnant of Judah down to Egypt against Jeremiah''s word, taking the prophet and Baruch with them, and they came to Tahpanhes. There Jeremiah was told to hide great stones in the clay at the entry of Pharaoh''s house and to foretell that Nebuchadrezzar would set his throne upon them. Jews lived at Tahpanhes afterwards, and Ezekiel foretold that there also the day shall be darkened.'
    - "Josephus says that Nebuchadnezzar later fell upon Egypt and carried the Jews he found there to Babylon. Petrie concluded that Greek wares stopped coming early in the reign of Amasis, who made Naucratis the one port for Greek trade, and that an Egyptian and then a Persian garrison held the fort. In Ptolemaic times only a small settlement remained, and of the Roman period he found little more than scattered glass."
  ru:
    - "Тафнис, который греки называли Дафнами Пелусийскими, — это холм Телль-Дефенне на восточном краю дельты Нила, близ нынешнего Суэцкого канала. Он стоял на дороге из Египта в Сирию и Палестину. Геродот пишет, что Псамметих I (664–610 гг. до н. э.) поставил в Дафнах стражу против арабов и ассирийцев и что ещё в его время персы держали там заставу."
    - "Флиндерс Питри раскопал это место в 1886 г. В крепости он нашёл закладные приношения Псамметиха I и столько греческой керамики, сделанной греками, что счёл гарнизон и большую часть города греческими. Бедуины называли развалины Каср-Бинт-эль-Яхуди — дворец дочери иудея. Площадку из кирпича перед крепостью Питри принял за то место при входе в дом фараона, где Иеремии было велено скрыть камни, но доказать эту связь нельзя."
    - "Иеремия говорит Израилю: «сыновья Мемфиса и Тафны объели темя твое». После убийства Годолии Иоанан, сын Карея, и военные начальники вопреки слову Иеремии увели остаток Иудеев в Египет, взяв с собой пророка и Варуха, и дошли до Тафниса. Там Иеремии было велено скрыть большие камни в смятой глине при входе в дом фараона и предречь, что Навуходоносор поставит на них свой престол. Иудеи и потом жили в Тафнисе, а Иезекииль предрекал, что и в Тафнисе померкнет день."
    - "Иосиф Флавий пишет, что позднее Навуходоносор напал на Египет и увёл найденных там иудеев в Вавилон. Питри заключил, что греческая посуда перестала поступать сюда в начале царствования Амасиса, который сделал Навкратис единственной гаванью для греческой торговли, и что крепость держали сначала египетский, а затем персидский гарнизон. В птолемеевское время здесь оставалось лишь небольшое поселение, а от римской эпохи он нашёл немногим больше разрозненных осколков стекла."
  uk:
    - "Тафніс, який греки називали Дафнами Пелусійськими, — це пагорб Телль-Дефенне на східному краю дельти Нілу, поблизу сучасного Суецького каналу. Він стояв на дорозі з Єгипту до Сирії та Палестини. Геродот каже, що Псамметіх, тобто Псамтік I (664–610 рр. до н. е.), розмістив у Дафнах гарнізон проти арабів і ассірійців і що за його часу персів там ще тримали заставу."
    - "Фліндерс Петрі розкопував місце 1886 року. У фортеці він знайшов закладні дари Псамтіка I і стільки грецької кераміки, виготовленої греками, що визнав гарнізон і значну частину міста грецькими. Бедуїни називали руїну Каср-Бінт-ель-Єгуді, палац дочки єврея. Петрі вважав цегляну платформу перед фортецею місцем при вході в палати фараона, де Єремії було велено сховати каміння, — зв’язок, який довести не можна."
    - "Єремія каже Ізраїлеві, що «сини Мемфиса й Тафни пообгризали аж тїмя у тебе». Після вбивства Гедалії Йоханан, син Карея, та воєначальники повели рештки Юди до Єгипту всупереч слову Єремії, взявши з собою пророка й Варуха, і вони дійшли до Тафніса. Там Єремії було велено сховати велике каміння в глині при вході в палати фараона й провістити, що Навуходоносор поставить на ньому свій престол. Юдеї жили в Тафнісі й потім, а Єзекіїль передрік, що й там потемніє день."
    - "Йосиф Флавій каже, що Навуходоносор згодом напав на Єгипет і відвів до Вавилона юдеїв, яких там знайшов. Петрі дійшов висновку, що грецькі вироби припинили надходити на початку правління Амасіса, який зробив Навкратіс єдиним портом грецької торгівлі, і що фортецею володів спершу єгипетський, а потім перський гарнізон. У птолемеївські часи лишилося тільки мале поселення, а від римської доби він знайшов небагато більше, ніж розсіяне скло."
  es:
    - "Tafnes, que los griegos llamaban Dafne de Pelusio, es el montículo de Tell Defenneh, en el borde oriental del delta del Nilo, cerca del actual canal de Suez. Se hallaba en el camino de Egipto a Siria y Palestina. Heródoto dice que Psamético, es decir, Psamtik I (664–610 a. C.), estableció una guarnición en Dafne contra los árabes y los asirios, y que en su tiempo los persas aún mantenían allí un puesto."
    - "Flinders Petrie excavó el sitio en 1886. En el fuerte halló depósitos de fundación de Psamtik I y tanta cerámica griega, fabricada por griegos, que juzgó que la guarnición y buena parte de la ciudad habían sido griegas. Los beduinos llamaban a la ruina Qasr Bint el-Yehudi, el palacio de la hija del judío. Petrie tomó una plataforma de ladrillo delante del fuerte por el lugar a la entrada de la casa del faraón donde a Jeremías se le mandó esconder las piedras, un vínculo que no puede demostrarse."
    - "Jeremías dice a Israel que «los hijos de Noph y de Taphnes te quebrantaron la mollera». Tras el asesinato de Gedalías, Johanán hijo de Carea y los capitanes llevaron al resto de Judá a Egipto contra la palabra de Jeremías, llevándose con ellos al profeta y a Baruc, y llegaron a Tafnes. Allí se mandó a Jeremías esconder grandes piedras en el barro a la entrada de la casa del faraón y anunciar que Nabucodonosor pondría su trono sobre ellas. Después hubo judíos en Tafnes, y Ezequiel anunció que también allí se oscurecería el día."
    - "Josefo dice que Nabucodonosor cayó más tarde sobre Egipto y llevó a Babilonia a los judíos que encontró allí. Petrie concluyó que los productos griegos dejaron de llegar a comienzos del reinado de Amasis, que hizo de Náucratis el único puerto del comercio griego, y que una guarnición egipcia y luego una persa ocuparon el fuerte. En época ptolemaica solo quedaba un pequeño asentamiento, y del período romano halló poco más que vidrio disperso."
  pt:
    - "Tafnes, que os gregos chamavam Dafne de Pelúsio, é o monte de Tell Defenneh, na orla oriental do delta do Nilo, perto do atual Canal de Suez. Ficava na estrada do Egito para a Síria e a Palestina. Heródoto diz que Psamético, isto é, Psamético I (664–610 a.C.), pôs uma guarnição em Dafne contra os árabes e assírios, e que em seu tempo os persas ainda mantinham ali um posto."
    - "Flinders Petrie escavou o sítio em 1886. No forte encontrou depósitos de fundação de Psamético I e tanta cerâmica grega, feita por gregos, que julgou que a guarnição e boa parte da cidade eram gregas. Os beduínos chamavam a ruína Qasr Bint el-Yehudi, o palácio da filha do judeu. Petrie tomou uma plataforma de tijolos diante do forte pelo lugar, à entrada da casa do Faraó, onde Jeremias recebeu ordem de esconder as pedras, ligação que não se pode provar."
    - "Jeremias diz a Israel que “Os filhos também de Mênfis e de Tafnes quebraram o alto da sua cabeça”. Depois que Gedalias foi assassinado, Joanã, filho de Careá, e os capitães levaram o remanescente de Judá ao Egito contra a palavra de Jeremias, levando consigo o profeta e Baruque, e chegaram a Tafnes. Ali Jeremias recebeu ordem de esconder grandes pedras no barro, à entrada da casa do Faraó, e de predizer que Nabucodonosor poria nelas o seu trono. Judeus viveram depois em Tafnes, e Ezequiel predisse que ali também o dia escureceria."
    - "Josefo diz que Nabucodonosor mais tarde caiu sobre o Egito e levou para a Babilônia os judeus que ali encontrou. Petrie concluiu que os artigos gregos deixaram de chegar no início do reinado de Amásis, que fez de Náucratis o único porto do comércio grego, e que uma guarnição egípcia e depois uma persa ocuparam o forte. Em época ptolomaica restou só um pequeno povoado, e do período romano ele achou pouco mais que vidro espalhado."
  de:
    - "Tachpanhes, das die Griechen Daphnae bei Pelusium nannten, ist der Hügel Tell Defenneh am Ostrand des Nildeltas, nahe beim heutigen Sueskanal. Es lag an der Straße von Ägypten nach Syrien und Palästina. Herodot sagt, Psammetich, das ist Psamtik I. (664–610 v. Chr.), habe in Daphnae eine Besatzung gegen die Araber und Assyrer stationiert, und zu seiner Zeit hätten die Perser dort noch einen Außenposten unterhalten."
    - "Flinders Petrie grub die Stätte 1886 aus. In der Festung fand er Gründungsdepots Psamtiks I. und so viel griechische Keramik, von Griechen gefertigt, dass er die Besatzung und einen großen Teil der Stadt für griechisch hielt. Die Beduinen nannten die Ruine Qasr Bint el-Yehudi, den Palast der Tochter des Juden. Petrie hielt eine Ziegelplattform vor der Festung für den Ort am Eingang des Hauses des Pharao, wo Jeremia die Steine verbergen sollte, eine Verbindung, die sich nicht beweisen lässt."
    - "Jeremia sagt Israel: „Dazu zerschlagen die von Noph und Thachpanhes dir den Kopf“. Nach der Ermordung Gedaljas führten Johanan, der Sohn Kareachs, und die Hauptleute den Rest Judas gegen Jeremias Wort nach Ägypten, nahmen den Propheten und Baruch mit und kamen nach Tachpanhes. Dort sollte Jeremia große Steine im Ton am Eingang des Hauses des Pharao verbergen und vorhersagen, dass Nebukadnezar seinen Thron darauf setzen werde. Juden lebten danach in Tachpanhes, und Hesekiel sagte voraus, dass auch dort der Tag sich verfinstern werde."
    - "Josephus sagt, Nebukadnezar sei später in Ägypten eingefallen und habe die dort gefundenen Juden nach Babylon geführt. Petrie schloss, dass die griechischen Waren früh unter Amasis ausblieben, der Naukratis zum einzigen Hafen des griechischen Handels machte, und dass dann eine ägyptische und danach eine persische Besatzung die Festung hielt. In ptolemäischer Zeit blieb nur eine kleine Siedlung, und aus der römischen Zeit fand er wenig mehr als verstreutes Glas."
  fr:
    - "Tachpanès, que les Grecs appelaient Daphné de Péluse, est le tertre de Tell Defenneh, au bord oriental du delta du Nil, près de l’actuel canal de Suez. Elle se trouvait sur la route d’Égypte vers la Syrie et la Palestine. Hérodote dit que Psammétique, c’est-à-dire Psammétique Ier (664-610 av. J.-C.), plaça une garnison à Daphné contre les Arabes et les Assyriens, et que de son temps les Perses y tenaient encore un poste."
    - "Flinders Petrie fouilla le site en 1886. Dans le fort, il trouva des dépôts de fondation de Psammétique Ier et tant de poterie grecque, fabriquée par des Grecs, qu’il jugea la garnison et une grande part de la ville grecques. Les Bédouins appelaient la ruine Qasr Bint el-Yehudi, le palais de la fille du Juif. Petrie prit une plate-forme de briques devant le fort pour le lieu, à l’entrée de la maison de Pharaon, où Jérémie reçut l’ordre de cacher les pierres, lien qui ne peut être prouvé."
    - "Jérémie dit à Israël que « les enfants de Noph et de Tachpanès te briseront le sommet de la tête ». Après le meurtre de Guedalia, Jochanan fils de Karéach et les chefs conduisirent le reste de Juda en Égypte contre la parole de Jérémie, emmenant avec eux le prophète et Baruc, et ils arrivèrent à Tachpanès. Jérémie y reçut l’ordre de cacher de grandes pierres dans l’argile à l’entrée de la maison de Pharaon et d’annoncer que Nebucadnetsar y placerait son trône. Des Juifs vécurent ensuite à Tachpanès, et Ézéchiel annonça que là aussi le jour s’obscurcirait."
    - "Josèphe dit que Nebucadnetsar tomba plus tard sur l’Égypte et emmena à Babylone les Juifs qu’il y trouva. Petrie conclut que les marchandises grecques cessèrent d’arriver au début du règne d’Amasis, qui fit de Naucratis l’unique port du commerce grec, et qu’une garnison égyptienne, puis perse, tint le fort. À l’époque ptolémaïque, il ne restait qu’un petit établissement, et de l’époque romaine il ne trouva guère que du verre épars."
  pl:
    - "Tachpanches, które Grecy nazywali Dafne pod Peluzjum, to kopiec Tell Defenne na wschodnim skraju delty Nilu, blisko dzisiejszego Kanału Sueskiego. Leżało przy drodze z Egiptu do Syrii i Palestyny. Herodot pisze, że Psametyk, czyli Psametyk I (664–610 p.n.e.), umieścił w Dafne załogę przeciw Arabom i Asyryjczykom oraz że w jego czasach Persowie nadal trzymali tam placówkę."
    - "Flinders Petrie prowadził wykopaliska na stanowisku w 1886 roku. W forcie znalazł depozyty fundacyjne Psametyka I i tak wiele greckiej ceramiki, wykonanej przez Greków, że uznał załogę i znaczną część miasta za greckie. Beduini nazywali ruinę Kasr Bint el-Jehudi, pałac córki Żyda. Petrie wziął ceglaną platformę przed fortem za miejsce przy wejściu do domu faraona, gdzie Jeremiaszowi kazano ukryć kamienie, ale tego powiązania nie da się udowodnić."
    - "Jeremiasz mówi Izraelowi, że „Synowie też Nof i Tachpanes wierzch głowy twojej zetrą”. Po zamordowaniu Gedaliasza Jochanan, syn Kareacha, i dowódcy poprowadzili resztę Judy do Egiptu wbrew słowu Jeremiasza, zabierając ze sobą proroka i Barucha, i przyszli do Tachpanches. Tam Jeremiaszowi kazano ukryć wielkie kamienie w glinie przy wejściu do domu faraona i zapowiedzieć, że Nabuchodonozor postawi na nich swój tron. Żydzi mieszkali potem w Tachpanches, a Ezechiel zapowiedział, że i tam zaćmi się dzień."
    - "Józef Flawiusz pisze, że Nabuchodonozor później napadł na Egipt i uprowadził do Babilonu Żydów, których tam zastał. Petrie doszedł do wniosku, że greckie wyroby przestały tu napływać na początku panowania Amazisa, który uczynił Naukratis jedynym portem handlu z Grekami, i że fort zajmowała najpierw załoga egipska, a potem perska. W czasach ptolemejskich została tylko mała osada, a z okresu rzymskiego znalazł niewiele więcej niż rozproszone szkło."
  it:
    - "Tafni, che i Greci chiamavano Dafne di Pelusio, è il tell di Tell Defenneh sul margine orientale del delta del Nilo, presso l’odierno canale di Suez. Sorgeva sulla strada dall’Egitto alla Siria e alla Palestina. Erodoto dice che Psammetico, cioè Psamtik I (664–610 a.C.), stanziò a Dafne una guarnigione contro gli Arabi e gli Assiri, e che ai suoi tempi i Persiani vi tenevano ancora un presidio."
    - "Flinders Petrie scavò il sito nel 1886. Nel forte trovò depositi di fondazione di Psamtik I, e tanta ceramica greca, fatta da Greci, da giudicare che la guarnigione e gran parte della città fossero greche. I beduini chiamavano la rovina Qasr Bint el-Yehudi, il palazzo della figlia dell’Ebreo. Petrie ritenne che una piattaforma di mattoni davanti al forte fosse il luogo all’ingresso della casa del Faraone dove Geremia ebbe ordine di nascondere le pietre, un legame che non si può provare."
    - "Geremia dice a Israele che «gli abitanti di Nof e di Tahpanes ti divorano il cranio». Dopo l’uccisione di Godolia, Ioanan figlio di Careà e i capi guidarono il resto di Giuda in Egitto contro la parola di Geremia, portando con sé il profeta e Baruc, e giunsero a Tafni. Qui Geremia ebbe ordine di nascondere grosse pietre nell’argilla all’ingresso della casa del Faraone e di annunciare che Nabucodonosor vi avrebbe posto il suo trono. Dopo di allora vissero Giudei a Tafni, ed Ezechiele predisse che anche lì il giorno si sarebbe oscurato."
    - "Giuseppe Flavio dice che Nabucodonosor piombò più tardi sull’Egitto e portò a Babilonia i Giudei che vi trovò. Petrie concluse che le merci greche cessarono di arrivare agli inizi del regno di Amasi, che fece di Naucrati l’unico porto del commercio greco, e che una guarnigione egiziana e poi persiana tenne il forte. In epoca tolemaica rimase solo un piccolo insediamento, e dell’epoca romana egli trovò poco più che frammenti di vetro sparsi."
  nl:
    - "Tachpanhes, door de Grieken Daphnae bij Pelusium genoemd, is de heuvel Tell Defenneh aan de oostrand van de Nijldelta, dicht bij het huidige Suezkanaal. Het lag aan de weg van Egypte naar Syrië en Palestina. Herodotus zegt dat Psammetichus, dat is Psamtik I (664–610 v.Chr.), in Daphnae een garnizoen legerde tegen de Arabieren en Assyriërs, en dat de Perzen er in zijn eigen tijd nog een buitenpost hadden."
    - "Flinders Petrie groef de plek op in 1886. In het fort vond hij funderingsdeposito’s van Psamtik I, en zoveel Grieks aardewerk, door Grieken gemaakt, dat hij het garnizoen en een groot deel van de stad voor Grieks hield. De bedoeïenen noemden de ruïne Qasr Bint el-Yehudi, het paleis van de dochter van de Jood. Petrie hield een baksteenplatform voor het fort voor de plaats bij de ingang van het huis van Farao waar Jeremia de stenen moest verbergen, een verband dat niet kan worden bewezen."
    - "Jeremia zegt tot Israël: “Ook hebben u de kinderen van Nof en Tachpanhes den schedel afgeweid”. Nadat Gedalja was vermoord, leidden Johanan, de zoon van Kareach, en de oversten het overblijfsel van Juda tegen het woord van Jeremia in naar Egypte, en namen de profeet en Baruch met zich mee, en zij kwamen te Tachpanhes. Daar kreeg Jeremia de opdracht grote stenen in de klei te verbergen bij de ingang van het huis van Farao en te voorspellen dat Nebukadnessar zijn troon erop zou zetten. Daarna woonden er Joden in Tachpanhes, en Ezechiël voorspelde dat ook daar de dag verduisterd zou worden."
    - "Flavius Josephus zegt dat Nebukadnessar later Egypte overviel en de Joden die hij daar aantrof naar Babylon voerde. Petrie concludeerde dat de Griekse waar vroeg in het bewind van Amasis ophield te komen, die Naukratis tot de enige haven voor de Griekse handel maakte, en dat een Egyptisch en daarna een Perzisch garnizoen het fort bezette. In de Ptolemeïsche tijd bleef er slechts een kleine nederzetting over, en uit de Romeinse periode vond hij weinig meer dan verspreid glas."
  cs:
    - "Tachpanchés, které Řekové nazývali Dafnai Pelúsijské, je pahorek Tell Defenne na východním okraji nilské delty, blízko dnešního Suezského průplavu. Stálo na cestě z Egypta do Sýrie a Palestiny. Hérodotos říká, že Psammétichos, tedy Psamtik I. (664–610 př. n. l.), umístil v Dafnai posádku proti Arabům a Asyřanům a že tam Peršané ještě za jeho dnů drželi stanoviště."
    - "Flinders Petrie lokalitu zkoumal v roce 1886. V pevnosti nalezl základové depozity Psamtika I. a tolik řecké keramiky, vyrobené Řeky, že usoudil, že posádka a velká část města byly řecké. Beduíni nazývali zříceninu Qasr Bint el-Jehudi, palác židovy dcery. Petrie pokládal cihlovou plošinu před pevností za místo u vchodu do faraonova domu, kde měl Jeremjáš ukrýt kameny, což nelze dokázat."
    - "Jeremjáš říká Izraeli: „Obyvatelé také Nof a Tachpanes pasou na vrchu hlavy tvé“. Poté, co byl zavražděn Gedaljáš, Jochanan, syn Kareův, a velitelé odvedli ostatek Judy do Egypta proti Jeremjášovu slovu, vzali s sebou proroka i Barucha a došli do Tachpanchésu. Tam měl Jeremjáš ukrýt velké kameny v hlíně u vchodu do faraonova domu a předpovědět, že na nich Nebukadnesar postaví svůj trůn. Židé pak v Tachpanchésu žili a Ezechiel předpověděl, že i tam se zatmí den."
    - "Josephus říká, že Nebukadnesar později vpadl do Egypta a Židy, které tam našel, odvedl do Babylóna. Petrie došel k závěru, že řecké zboží přestalo přicházet brzy za vlády Amásida, který učinil z Naukratis jediný přístav řeckého obchodu, a že pevnost držela egyptská a poté perská posádka. V ptolemaiovské době zbylo jen malé osídlení a z římského období našel sotva víc než roztroušené sklo."
