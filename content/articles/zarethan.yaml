body:
  en:
    - "Zarethan was a town in the Jordan valley, named three times and spelt three ways, and its site is disputed. The leading candidate is Tell es-Sa'idiyeh, a large double mound on the east side of the valley in Jordan, about 2 km from the river where the Wadi Kufrinjeh comes down from Gilead; Nelson Glueck proposed it in the 1940s, and the identification is widely used but unproved. Others have argued for Tell Umm Hamad near the mouth of the Jabbok, or for smaller mounds nearby. The texts pull in two directions: Joshua puts Zarethan beside Adam, the town at the Jabbok ford, while Kings sets Beth-shean, some 45 km north of Adam, “by Zartanah beneath Jezreel”, so that some think of two places, or of a district rather than a town."
    - "When Israel crossed the Jordan, “the waters which came down from above stood and rose up upon an heap very far from the city Adam, that is beside Zaretan”, while the water below ran off to the Dead Sea. Solomon's fifth district took in “Taanach and Megiddo, and all Beth-shean, which is by Zartanah beneath Jezreel”. The bronze pillars, the sea and the lavers of the Temple were cast near here: “In the plain of Jordan did the king cast them, in the clay ground between Succoth and Zarthan”, where Chronicles reads Zeredathah; the heavy clay of the valley floor served for the moulds."
    - "Tell es-Sa'idiyeh was excavated by James Pritchard in 1964–1967 and by Jonathan Tubb for the British Museum in 1985–1996. The lower mound held a town of the Late Bronze and early Iron Ages with a cemetery of the thirteenth and twelfth centuries BC whose burials show Egyptian customs, and a stone staircase on the north slope that led down to a spring. On the upper mound a well-planned town of the eighth century BC, with rows of houses, was destroyed late in that century, perhaps by the Assyrians, and a large building of the Persian period followed. The mound stands today in the farmland of the Jordan valley north of Deir Alla."
  ru:
    - "Цартан — город в долине Иордана, названный трижды и трижды по-разному написанный, и его место спорно. Главный кандидат — Телль-эс-Саидийе, большой двойной холм на восточной стороне долины в Иордании, километрах в двух от реки, где из Галаада спускается Вади-Куфринджа; Нельсон Глюк предложил его в 1940-х годах, и это отождествление широко принято, но не доказано. Другие доказывали, что это Телль-Умм-Хамад близ устья Иавока или меньшие холмы поблизости. Тексты тянут в разные стороны: книга Иисуса Навина ставит Цартан подле Адама, города у брода через Иавок, а книга Царств помещает Беф-Сан, километрах в 45 к северу от Адама, «близ Цартана ниже Иезрееля», так что иные думают о двух местах или об округе, а не о городе."
    - "Когда Израиль переходил Иордан, «вода, текущая сверху, остановилась и стала стеною на весьма большое расстояние, до города Адама, который подле Цартана», а вода ниже ушла к Мёртвому морю. Пятый округ Соломона включал Фаанах, Мегиддо и Беф-Сан, «что близ Цартана ниже Иезрееля». Медные столбы, море и умывальницы Храма отливали поблизости: «Царь выливал их в глинистой земле, в окрестности Иордана, между Сокхофом и Цартаном», где Паралипоменон читает Цереда; тяжёлая глина дна долины годилась для форм."
    - "Телль-эс-Саидийе раскапывали Джеймс Причард в 1964–1967 годах и Джонатан Табб для Британского музея в 1985–1996 годах. На нижнем холме был город позднего бронзового и раннего железного веков с кладбищем XIII–XII веков до н. э., погребения которого показывают египетские обычаи, и каменная лестница на северном склоне, что вела вниз к источнику. На верхнем холме хорошо распланированный город VIII века до н. э. с рядами домов был разрушен в конце того же века, возможно ассирийцами, а за ним последовало большое здание персидского времени. Холм стоит сегодня среди полей долины Иордана к северу от Дейр-Аллы."
  uk:
    - "Цартан був містом у долині Йордану, названим тричі й написаним трьома способами, і його місце оспорюється. Провідний кандидат — Телль-ес-Саїдія, великий подвійний пагорб на східному боці долини в Йорданії, приблизно за 2 км від річки, де Вади-Куфрінджа спускається з Гілеаду; Нельсон Глюк запропонував його в 1940-х роках, і ототожнення широко вживається, але не доведене. Інші відстоювали Телль-Умм-Хамад біля гирла Яббока або менші пагорби поблизу. Тексти тягнуть у два боки: Ісус Навин ставить Цартан поряд з Адамом, містом на бродах Яббока, тоді як Книга Царів ставить Бет-Шеан, приблизно за 45 км на північ від Адама, «що коло Сартана під Езреелем», тож дехто думає про два місця або про округу, а не про місто."
    - "Коли Ізраїль переходив Йордан, «Зупинилась тодї вода, що текла згори, і стояла як мур аж до міста Адаму, та аж до Сартана», а вода внизу стекла до Мертвого моря. П’ятий округ Соломона охоплював «Таанах і Мегіддо й увесь Бет-Сан, що коло Сартана під Езреелем». Мідні стовпи, море й умивальниці Храму були відлиті поблизу: «В Йорданському лузї велїв царь виливати їх, у формах із глинковатої землї, між Сукхотом і Сартаном», де Хроніки читають Зереда; важка глина долинного дна слугувала для форм."
    - "Телль-ес-Саїдію розкопував Джеймс Прітчард у 1964–1967 роках і Джонатан Табб для Британського музею в 1985–1996 роках. Нижній пагорб містив місто пізньої бронзової й ранньої залізної доби з цвинтарем XIII–XII ст. до н. е., чиї поховання показують єгипетські звичаї, та кам’яні сходи на північному схилі, що вели вниз до джерела. На верхньому пагорбі добре сплановане місто VIII ст. до н. е., з рядами будинків, було зруйноване наприкінці того століття, можливо, ассірійцями, і за ним настав великий будинок перської доби. Пагорб нині стоїть серед ріллі долини Йордану на північ від Дейр-Алли."
  es:
    - "Saretán era una ciudad del valle del Jordán, nombrada tres veces y escrita de tres maneras, y su emplazamiento se discute. El principal candidato es Tell es-Sa'idiyeh, un gran montículo doble en el lado este del valle, en Jordania, a unos 2 km del río, donde el Wadi Kufrinjeh baja de Galaad; Nelson Glueck lo propuso en la década de 1940, y la identificación es muy usada pero no está demostrada. Otros han defendido Tell Umm Hamad, cerca de la desembocadura del Jaboc, o montículos menores cercanos. Los textos tiran en dos direcciones: Josué sitúa Saretán junto a Adam, la ciudad del vado del Jaboc, mientras que Reyes pone Betsán, a unos 45 km al norte de Adam, «cerca de Zaretán, por bajo de Jezreel», por lo que algunos piensan en dos lugares, o en un distrito más que en una ciudad."
    - "Cuando Israel cruzó el Jordán, «Las aguas que venían de arriba, se pararon como en un montón bien lejos de la ciudad de Adam, que está al lado de Sarethan», mientras el agua de abajo corría hacia el mar Muerto. El quinto distrito de Salomón comprendía «Taanach y Megiddo, y en toda Beth-san, que es cerca de Zaretán, por bajo de Jezreel». Las columnas de bronce, el mar y las pilas del Templo se fundieron cerca de aquí: «Todo lo hizo fundir el rey en la llanura del Jordán, en tierra arcillosa, entre Succoth y Sarthán», donde Crónicas lee Seredat; la pesada arcilla del fondo del valle servía para los moldes."
    - "Tell es-Sa'idiyeh fue excavado por James Pritchard en 1964–1967 y por Jonathan Tubb para el Museo Británico en 1985–1996. El montículo inferior albergaba una ciudad del Bronce Final y de comienzos de la Edad del Hierro con un cementerio de los siglos XIII y XII a. C. cuyos enterramientos muestran costumbres egipcias, y una escalera de piedra en la ladera norte que bajaba a un manantial. En el montículo superior, una ciudad bien planificada del siglo VIII a. C., con hileras de casas, fue destruida a finales de ese siglo, quizá por los asirios, y siguió un gran edificio del período persa. El montículo se alza hoy en las tierras de cultivo del valle del Jordán, al norte de Deir Alla."
  pt:
    - "Zaretã era uma cidade no vale do Jordão, nomeada três vezes e grafada de três modos, e seu sítio é discutido. O principal candidato é Tell es-Sa'idiyeh, um grande monte duplo no lado leste do vale, na Jordânia, a cerca de 2 km do rio, onde o Wadi Kufrinjeh desce de Gileade; Nelson Glueck o propôs nos anos 1940, e a identificação é muito usada, mas não provada. Outros defenderam Tell Umm Hamad, perto da foz do Jaboque, ou montes menores nas proximidades. Os textos puxam em duas direções: Josué põe Zaretã ao lado de Adã, a cidade no vau do Jaboque, enquanto Reis situa Bete-Seã, uns 45 km ao norte de Adão, “ao lado de Zaretã, abaixo de Jezreel”, de modo que alguns pensam em dois lugares, ou num distrito e não numa cidade."
    - "Quando Israel atravessou o Jordão, “pararam e se ergueram em um só monte muito longe dali, em Adã, a cidade que fica ao lado de Zaretã”, as águas que desciam de cima, enquanto a de baixo escoou para o Mar Morto. O quinto distrito de Salomão abrangia “Taanaque e Megido, e em toda Bete-Seã, que fica ao lado de Zaretã, abaixo de Jezreel”. As colunas de bronze, o mar e as pias do Templo foram fundidos perto daqui: “O rei os fundiu na planície do Jordão, na terra argilosa entre Sucote e Zaretã”, onde Crônicas lê Zereda; a argila pesada do fundo do vale servia para os moldes."
    - "Tell es-Sa'idiyeh foi escavado por James Pritchard em 1964–1967 e por Jonathan Tubb, para o Museu Britânico, em 1985–1996. O monte inferior continha uma cidade do Bronze Final e do início da Idade do Ferro, com um cemitério dos séculos XIII e XII a.C. cujos sepultamentos mostram costumes egípcios, e uma escadaria de pedra na encosta norte que descia a uma fonte. No monte superior, uma cidade bem planejada do século VIII a.C., com fileiras de casas, foi destruída no fim desse século, talvez pelos assírios, e seguiu-se um grande edifício do período persa. O monte está hoje nas terras de cultivo do vale do Jordão, ao norte de Deir Alla."
  de:
    - "Zaretan war eine Stadt im Jordantal, dreimal genannt und auf drei Weisen geschrieben, und ihre Lage ist umstritten. Der führende Kandidat ist Tell es-Sa'idiyeh, ein großer Doppelhügel auf der Ostseite des Tals in Jordanien, etwa 2 km vom Fluss, wo das Wadi Kufrinjeh aus Gilead herabkommt; Nelson Glueck schlug ihn in den 1940er Jahren vor, und die Gleichsetzung ist weit verbreitet, aber unbewiesen. Andere haben für Tell Umm Hamad nahe der Mündung des Jabbok oder für kleinere Hügel in der Nähe argumentiert. Die Texte ziehen in zwei Richtungen: Josua setzt Zaretan neben Adam, die Stadt an der Jabbok-Furt, während die Königsbücher Bet-Schean, etwa 45 km nördlich von Adam, „neben Zarthan unter Jesreel“ ansetzen, sodass manche an zwei Orte denken oder an einen Bezirk statt einer Stadt."
    - "Als Israel den Jordan überquerte, „stand das Wasser, das von oben herniederkam, aufgerichtet auf einem Haufen, sehr ferne, bei der Stadt Adam, die zur Seite Zarthans liegt“, während das Wasser unten zum Toten Meer ablief. Salomos fünfter Bezirk reichte „zu Thaanach und zu Megiddo und über ganz Beth-Sean, welches liegt neben Zarthan unter Jesreel“. Die Bronzesäulen, das Meer und die Kessel des Tempels wurden hier in der Nähe gegossen: „In der Gegend am Jordan ließ sie der König gießen in dicker Erde, zwischen Sukkoth und Zarthan“, wo die Chronik Zaredatha liest; der schwere Ton des Talbodens diente für die Formen."
    - "Tell es-Sa'idiyeh wurde von James Pritchard 1964–1967 und von Jonathan Tubb für das British Museum 1985–1996 ausgegraben. Der untere Hügel barg eine Stadt der Spätbronze- und frühen Eisenzeit mit einem Friedhof des dreizehnten und zwölften Jahrhunderts v. Chr., dessen Bestattungen ägyptische Bräuche zeigen, und eine Steintreppe am Nordhang, die zu einer Quelle hinabführte. Auf dem oberen Hügel wurde eine wohlgeplante Stadt des achten Jahrhunderts v. Chr. mit Häuserreihen spät in jenem Jahrhundert zerstört, vielleicht von den Assyrern, und ein großes Gebäude der Perserzeit folgte. Der Hügel steht heute im Ackerland des Jordantals nördlich von Deir Alla."
  fr:
    - "Tsarthan était une ville de la vallée du Jourdain, nommée trois fois et écrite de trois façons, et son site est discuté. Le principal candidat est Tell es-Sa’idiyeh, grand tertre double sur le côté est de la vallée, en Jordanie, à environ 2 km du fleuve là où le Wadi Kufrinjeh descend de Galaad ; Nelson Glueck le proposa dans les années 1940, et l’identification est très répandue mais non prouvée. D’autres ont plaidé pour Tell Umm Hamad près de l’embouchure du Jabbok, ou pour de plus petits tertres voisins. Les textes tirent dans deux directions : Josué place Tsarthan à côté d’Adam, la ville du gué du Jabbok, tandis que les Rois situent Beth-Schean, à quelque 45 km au nord d’Adam, « près de Tsarthan au-dessous de Jizreel », si bien que certains pensent à deux lieux, ou à un district plutôt qu’à une ville."
    - "Quand Israël traversa le Jourdain, « les eaux qui descendent d’en haut s’arrêtèrent, et s’élevèrent en un monceau, à une très grande distance, près de la ville d’Adam, qui est à côté de Tsarthan », tandis que l’eau d’en bas s’écoulait vers la mer Morte. Le cinquième district de Salomon comprenait « Thaanac et Meguiddo, et tout Beth-Schean qui est près de Tsarthan au-dessous de Jizreel ». Les colonnes d’airain, la mer et les bassins du Temple furent fondus près de là : « Le roi les fit fondre dans la plaine du Jourdain dans un sol argileux, entre Succoth et Tsarthan », là où les Chroniques ont Tseréda ; l’argile épaisse du fond de la vallée servait aux moules."
    - "Tell es-Sa’idiyeh fut fouillé par James Pritchard en 1964-1967 et par Jonathan Tubb pour le British Museum en 1985-1996. Le tertre inférieur abritait une ville du bronze récent et du début de l’âge du fer avec un cimetière des XIIIe et XIIe siècles av. J.-C. dont les sépultures montrent des coutumes égyptiennes, et un escalier de pierre sur la pente nord qui descendait à une source. Sur le tertre supérieur, une ville bien planifiée du VIIIe siècle av. J.-C., avec des rangées de maisons, fut détruite tard dans ce siècle, peut-être par les Assyriens, et un grand bâtiment de l’époque perse suivit. Le tertre se dresse aujourd’hui dans les terres cultivées de la vallée du Jourdain au nord de Deir Alla."
  pl:
    - "Sartan było miastem w dolinie Jordanu, wymienionym trzykrotnie i zapisywanym na trzy sposoby, a jego położenie jest sporne. Głównym kandydatem jest Tell es-Saidijja, duży podwójny kopiec po wschodniej stronie doliny w Jordanii, około 2 km od rzeki, gdzie Wadi Kufrindża schodzi z Gileadu; Nelson Glueck zaproponował go w latach czterdziestych XX wieku, a utożsamienie jest szeroko używane, lecz nieudowodnione. Inni dowodzili Tell Umm Hammad blisko ujścia Jabboku albo mniejszych kopców w pobliżu. Teksty ciągną w dwie strony: Jozue umieszcza Sartan obok Adam, miasta przy brodzie Jabboku, podczas gdy Księgi Królewskie umieszczają Bet-Szean, około 45 km na północ od Adam, „podle Sartany pod Jezreelem”, tak że niektórzy myślą o dwóch miejscach albo o okręgu, a nie o mieście."
    - "Gdy Izrael przeprawiał się przez Jordan, „wody płynące z gór, a stanęły w jednej kupie bardzo daleko od Adama, miasta, które jest ku stronie Sartan”, podczas gdy woda poniżej spłynęła do Morza Martwego. Piąty okręg Salomona obejmował „Tanach i Magieddo, i wszystko Betsan, które jest podle Sartany pod Jezreelem”. Spiżowe kolumny, morze i misy Świątyni odlewano w pobliżu: „To odlewał król na równinie u Jordanu w iłowatej ziemi, między Sochotem i między Sartanem”, gdzie Księgi Kronik mają Seredata; ciężka glina dna doliny służyła do form."
    - "Tell es-Saidijja był badany przez Jamesa Pritcharda w latach 1964–1967 i przez Jonathana Tubba dla Muzeum Brytyjskiego w latach 1985–1996. Dolny kopiec mieścił miasto z późnej epoki brązu i wczesnej epoki żelaza z cmentarzem z XIII i XII wieku p.n.e., którego pochówki wykazują egipskie zwyczaje, oraz kamienne schody na północnym stoku, które prowadziły w dół do źródła. Na górnym kopcu dobrze zaplanowane miasto z VIII wieku p.n.e., z rzędami domów, zostało zniszczone pod koniec tego stulecia, być może przez Asyryjczyków, a po nim powstał duży budynek z okresu perskiego. Kopiec stoi dziś wśród pól doliny Jordanu na północ od Deir Alla."
  it:
    - "Sartan era una città nella valle del Giordano, nominata tre volte e scritta in tre modi, e il suo sito è discusso. Il candidato principale è Tell es-Sa’idiyeh, un grande doppio tell sul lato orientale della valle in Giordania, a circa 2 km dal fiume dove il Wadi Kufrinjeh scende da Galaad; Nelson Glueck lo propose negli anni 1940, e l’identificazione è molto usata ma non provata. Altri hanno sostenuto Tell Umm Hamad presso la foce dello Iabbok, o tell più piccoli nei dintorni. I testi tirano in due direzioni: Giosuè pone Sartan accanto ad Adam, la città al guado dello Iabbok, mentre i Re collocano Bet-Scean, circa 45 km a nord di Adam, «presso a Tsarthan, sotto Jizreel», per cui alcuni pensano a due luoghi, o a un distretto più che a una città."
    - "Quando Israele attraversò il Giordano, «le acque che scendevano d’insù si fermarono e si elevarono in un mucchio, a una grandissima distanza, fin presso la città di Adam che è allato di Tsartan», mentre l’acqua sotto scorreva via verso il Mar Morto. Il quinto distretto di Salomone comprendeva «Taanac, Meghiddo e tutto Beth-Scean, che è presso a Tsarthan, sotto Jizreel». Le colonne di bronzo, il mare e i bacili del Tempio furono fusi qui vicino: «Il re li fece fondere nella pianura del Giordano, in un suolo argilloso, fra Succoth e Tsarthan», dove le Cronache leggono Tsereda; la pesante argilla del fondovalle serviva per gli stampi."
    - "Tell es-Sa’idiyeh fu scavato da James Pritchard nel 1964–1967 e da Jonathan Tubb per il British Museum nel 1985–1996. Il tell inferiore conteneva una città del Bronzo Tardo e del primo Ferro con un cimitero del XIII e XII secolo a.C. le cui sepolture mostrano usi egizi, e una scalinata di pietra sul pendio nord che scendeva a una sorgente. Sul tell superiore una città ben pianificata dell’VIII secolo a.C., con file di case, fu distrutta alla fine di quel secolo, forse dagli Assiri, e seguì un grande edificio di epoca persiana. Il tell sorge oggi fra i campi della valle del Giordano a nord di Deir Alla."
  nl:
    - "Zaretan was een stad in de Jordaanvallei, driemaal genoemd en op drie manieren gespeld, en de ligging wordt betwist. De voornaamste kandidaat is Tell es-Sa’idiyeh, een grote dubbele heuvel aan de oostkant van de vallei in Jordanië, ongeveer 2 km van de rivier waar de Wadi Kufrinjeh uit Gilead afdaalt; Nelson Glueck stelde hem in de jaren 1940 voor, en de gelijkstelling wordt veel gebruikt maar is niet bewezen. Anderen hebben gepleit voor Tell Umm Hamad bij de monding van de Jabbok, of voor kleinere heuvels in de buurt. De teksten trekken twee kanten op: Jozua plaatst Zaretan naast Adam, de stad bij de Jabbok-voorde, terwijl Koningen Beth-Sean, zo’n 45 km ten noorden van Adam, “bij Zartana, beneden van Jizreel” plaatst, zodat sommigen aan twee plaatsen denken, of aan een district in plaats van een stad."
    - "Toen Israël de Jordaan overtrok, “stonden de wateren, die van boven afkwamen; zij rezen op een hoop, zeer verre van de stad Adam af, die ter zijde van Sarthan ligt”, terwijl het water beneden naar de Dode Zee afliep. Het vijfde district van Salomo omvatte “Taanach, en Megiddo, en het ganse Beth-Sean, hetwelk is bij Zartana, beneden van Jizreel”. De bronzen pilaren, de zee en de wasbekkens van de tempel werden hier in de buurt gegoten: “In de vlakte van de Jordaan goot ze de koning, in dichte aarde, tussen Sukkoth en tussen Zarthan”, waar Kronieken Zeredatha heeft; de zware klei van de valleibodem diende voor de mallen."
    - "Tell es-Sa’idiyeh werd opgegraven door James Pritchard in 1964–1967 en door Jonathan Tubb voor het British Museum in 1985–1996. De onderste heuvel bevatte een stad uit de Late Bronstijd en de vroege IJzertijd met een begraafplaats uit de dertiende en twaalfde eeuw v.Chr. waarvan de graven Egyptische gebruiken tonen, en een stenen trap op de noordhelling die naar een bron leidde. Op de bovenste heuvel werd een goed geplande stad uit de achtste eeuw v.Chr., met rijen huizen, laat in die eeuw verwoest, misschien door de Assyriërs, en daarna volgde een groot gebouw uit de Perzische tijd. De heuvel staat tegenwoordig in het landbouwgebied van de Jordaanvallei ten noorden van Deir Alla."
  cs:
    - "Caretan bylo město v Jordánském údolí, jmenované třikrát a psané třemi způsoby, a jeho poloha je sporná. Hlavním kandidátem je Tell es-Sa'ídíja, velký dvojitý pahorek na východní straně údolí v Jordánsku, asi 2 km od řeky, kde sestupuje Wádí Kufrindža z Gileadu; navrhl jej Nelson Glueck ve 40. letech 20. století a ztotožnění je široce užíváno, ale není prokázáno. Jiní hájili Tell Umm Hammád poblíž ústí Jaboku nebo menší pahorky poblíž. Texty táhnou dvěma směry: Jozue klade Caretan vedle Adamu, města na brodu Jaboku, zatímco Královská klade Bét-še'an, asi 45 km severně od Adamu, „vedlé Sartan pod Jezreelem“, takže někteří myslí na dvě místa, nebo spíše na oblast než na město."
    - "Když Izrael překročil Jordán, „zastavily vody, kteréž s hůry přicházely, a shrnuly se v hromadu jednu velmi daleko od Adam města, kteréž leží k straně Sartan“, zatímco voda dole odtekla do Mrtvého moře. Šalomounův pátý okres zahrnoval „Tanach a Mageddo, i všecken Betsan, kterýž jest vedlé Sartan pod Jezreelem“. Bronzové sloupy, moře a nádrže chrámu byly odlity poblíž: „na rovinách Jordánských slíval král v jilovaté zemi, mezi Sochot a Sartan“, kde Kroniky čtou Seredata; těžký jíl dna údolí sloužil na formy."
    - "Tell es-Sa'ídíja vykopávali James Pritchard v letech 1964–1967 a Jonathan Tubb pro Britské muzeum v letech 1985–1996. Dolní pahorek nesl město pozdní doby bronzové a rané doby železné s pohřebištěm z 13. a 12. stol. př. n. l., jehož pohřby ukazují egyptské zvyky, a kamenné schodiště na severním svahu, které vedlo dolů k prameni. Na horním pahorku bylo dobře plánované město z 8. stol. př. n. l. s řadami domů zničené koncem onoho století, snad Asyřany, a následovala velká budova perského období. Pahorek stojí dnes v zemědělské půdě Jordánského údolí severně od Dér Alla."
  sv:
    - "Saretan var en stad i Jordandalen, nämnd tre gånger och stavad på tre sätt, och dess läge är omstritt. Den främsta kandidaten är Tell es-Sa'idiyeh, en stor dubbelkulle på dalens östra sida i Jordanien, omkring 2 km från floden där Wadi Kufrinjeh kommer ner från Gilead; Nelson Glueck föreslog den på 1940-talet, och identifieringen används ofta men är obevisad. Andra har argumenterat för Tell Umm Hamad nära Jabboks mynning, eller för mindre kullar i närheten. Texterna drar åt två håll: Josua placerar Saretan bredvid Adam, staden vid Jabboks vadställe, medan Kungaboken sätter Bet-Shean, omkring 45 km norr om Adam, ”på sidan om Saretan, nedanför Jisreel”, så att några tänker på två platser, eller på ett distrikt snarare än en stad."
    - "När Israel gick över Jordan ”stannade det vatten som kom uppifrån, och blev stående såsom en samlad hög långt borta, uppe vid Adam, staden som ligger bredvid Saretan”, medan vattnet nedanför rann av till Döda havet. Salomos femte distrikt omfattade Taanak och Megiddo samt ”hela den del av Bet-Sean, som ligger på sidan om Saretan, nedanför Jisreel”. Bronspelarna, havet och kärlen till templet göts i närheten: ”På Jordanslätten lät konungen gjuta det i lerformar, mellan Suckot och Saretan”, där Krönikeboken har Sereda; dalbottnens tunga lera användes till formarna."
    - "Tell es-Sa'idiyeh grävdes ut av James Pritchard 1964–1967 och av Jonathan Tubb för British Museum 1985–1996. Den nedre kullen rymde en stad från senbronsåldern och tidiga järnåldern med en gravplats från 1200- och 1100-talen f.Kr. vars begravningar visar egyptiska sedvänjor, och en stentrappa på norra sluttningen som ledde ner till en källa. På den övre kullen förstördes en välplanerad stad från 700-talet f.Kr., med rader av hus, sent under det århundradet, kanske av assyrierna, och en stor byggnad från persertiden följde. Kullen står i dag i jordbruksmarken i Jordandalen norr om Deir Alla."
