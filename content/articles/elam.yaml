body:
  en:
    - "Elam is the land east of the lower Tigris: the hot plain of Susa, today's Khuzestan in south-western Iran, and the Zagros highlands behind it around Anshan. Genesis lists Elam first among the sons of Shem, but the Elamite language is related to no other known tongue, and the Elamites were neighbours and rivals of Sumer and Babylon from the late fourth millennium BC. An Elamite raid ended the dynasty of Ur about 2004 BC, and about 1158 BC Shutruk-Nahhunte carried the stele of Hammurabi's laws and the victory stele of Naram-Sin to Susa, where French excavators found them in 1898 and 1901–02. Genesis names “Chedorlaomer king of Elam” as leader of the four kings who took Lot captive; the name is Elamite in form, but no such king is known from Elamite records."
    - "In the Assyrian age Elam backed the rebels of Babylon until Ashurbanipal destroyed Susa about 646 BC, boasting that he had carried off its gods and sown its ground with salt. Jeremiah's oracle, “in the beginning of the reign of Zedekiah”, foretold that the Lord would “break the bow of Elam”, scatter its people to the four winds and “set my throne in Elam”, yet “in the latter days” bring back its captivity; Ezekiel sees “Elam and all her multitude” among the slain in the pit, and Isaiah pictures its archers in the army against Judah: “Elam bare the quiver”. The Persians, who had settled in Anshan, took the old land over, and Cyrus called himself king of Anshan; Isaiah's cry “Go up, O Elam: besiege, O Media” belongs to the fall of Babylon in 539 BC."
    - "Under the Persians Susa was a royal residence, and Elamite one of the three languages of the Behistun inscription and of the palace accounts. Daniel saw his vision of the ram and the he goat “at Shushan in the palace, which is in the province of Elam” by the river Ulai, and Esther's story is set in Susa. Elamites and Susanchites are among the peoples settled in Samaria who wrote against Jerusalem under Artaxerxes, Isaiah numbers Elam among the lands from which the remnant will return, and “Elamites” are the third nation named among those who heard the apostles at Pentecost."
    - "Today Elam is the Iranian province of Khuzestan. The mounds of Susa, with the Apadana of Darius, and the ziggurat of Chogha Zanbil, built by Untash-Napirisha in the thirteenth century BC, are on the UNESCO list; a tomb of Daniel is venerated at Shush; and the oil fields of Ahvaz and Abadan made the plain a battlefield of the Iran–Iraq war of 1980–88."
  ru:
    - "Елам — земля к востоку от нижнего Тигра: жаркая равнина Суз, нынешний Хузестан на юго-западе Ирана, и горы Загроса за ней вокруг Аншана. Книга Бытия ставит Елама первым среди сыновей Сима, но эламский язык не родствен ни одному известному языку, а эламиты были соседями и соперниками Шумера и Вавилона с конца четвёртого тысячелетия до н. э. Набег эламитов положил конец династии Ура около 2004 г. до н. э., а около 1158 г. до н. э. Шутрук-Наххунте увёз в Сузы стелу с законами Хаммурапи и победную стелу Нарам-Суэна, где французские археологи нашли их в 1898 и 1901–1902 годах. Бытие называет «Кедорлаомера, царя Еламского» главой четырёх царей, уведших в плен Лота; имя по форме эламское, но такого царя эламские источники не знают."
    - "В ассирийскую эпоху Елам поддерживал мятежников Вавилона, пока Ашшурбанипал около 646 г. до н. э. не разрушил Сузы, похваляясь, что увёз их богов и засеял землю солью. Пророчество Иеремии, данное «в начале царствования Седекии», предрекало, что Господь сокрушит «лук Елама», развеет его народ по четырём ветрам и поставит «престол Мой в Еламе», но «в последние дни» возвратит его плен; Иезекииль видит «Елам со всем множеством своим» среди поражённых в преисподней, а Исаия рисует его лучников в войске против Иудеи: «Елам несет колчан». Персы, осевшие в Аншане, переняли древнюю землю, и Кир называл себя царём Аншана; возглас Исаии «восходи, Елам, осаждай, Мид!» относится к падению Вавилона в 539 г. до н. э."
    - "При персах Сузы были царской резиденцией, а эламский — одним из трёх языков Бехистунской надписи и дворцовых отчётов. Даниил видел видение об овне и козле «в Сузах, престольном городе в области Еламской», у реки Улая, и действие книги Есфирь происходит в Сузах. Еламитяне и Сусанцы — среди народов, поселённых в Самарии и писавших против Иерусалима при Артаксерксе; Исаия называет Елам среди земель, откуда вернётся остаток, а «Еламиты» — третий народ в перечне тех, кто слышал апостолов в день Пятидесятницы."
    - "Сегодня Елам — иранская провинция Хузестан. Холмы Суз с ападаной Дария и зиккурат Чога-Занбиль, построенный Унташ-Напиришей в XIII веке до н. э., внесены в список ЮНЕСКО; в Шуше почитают гробницу Даниила; а нефтяные поля Ахваза и Абадана сделали равнину полем битвы ирано-иракской войны 1980–1988 годов."
  uk:
    - "Елам — земля на схід від нижнього Тигру: гаряча рівнина Сузи, нинішній Хузестан на південному заході Ірану, і за нею високогір'я Загрос навколо Аншану. Книга Буття перелічує Елам першим серед синів Сима, але еламська мова не споріднена з жодною відомою мовою, і еламіти були сусідами та суперниками Шумеру й Вавилона від кінця IV тис. до н. е. Еламський набіг завершив династію Ура близько 2004 р. до н. е., а близько 1158 р. до н. е. Шутрук-Нахунте відвіз стелу законів Хаммурапі та переможну стелу Нарам-Сіна до Сузи, де французькі розкопувачі знайшли їх у 1898 та 1901–1902 рр. Книга Буття називає «Кедорлайомера, царя Еламського» ватажком чотирьох царів, які взяли Лота в полон; ім'я еламське за формою, але такого царя не знають еламські записи."
    - "В ассирійську добу Елам підтримував бунтарів Вавилона, доки Ашшурбаніпал не знищив Сузи близько 646 р. до н. е., хвалячись, що вивіз його богів і засіяв його землю сіллю. Оракул Єремії «у початку царювання Седекіїного» передає слова Господа: «Се я поламлю лука Еламіям», — його народ буде розвіяний на чотири вітри, і «поставлю мого престола в Еламі», а «У дальші ж часи» полонених буде повернуто; Єзекіїль бачить Елам «із усією силою своєю» серед убитих у ямі, а Ісая малює його лучників у війську проти Юди: «Несе Елам сагайдак». Перси, що оселилися в Аншані, перейняли давню землю, і Кір називав себе царем Аншану; вигук Ісаї «Приходи, Еламе; облягай, Миде!» належить до падіння Вавилона в 539 р. до н. е."
    - "Під персами Суза була царською резиденцією, а еламська — однією з трьох мов Бісутунського напису та палацових обліків. Даниїл побачив своє видіння барана й козла «в Сузах, престольному містї в краю Еламськім» біля ріки Улай, а історія Естер розгортається в Сузах. Еламіти й сусанці — серед народів, поселених у Самарії, що писали проти Єрусалима за Артаксеркса, Ісая зараховує Елам до земель, звідки повернеться останок, а «еламіти» — третій народ, названий серед тих, хто чув апостолів на П'ятдесятницю."
    - "Сьогодні Елам — це іранська провінція Хузестан. Пагорби Сузи з Ападаною Дарія та зіккурат Чога-Занбіль, збудований Унташ-Напірішею в XIII ст. до н. е., внесені до списку ЮНЕСКО; гробницю Даниїла вшановують у Шуші; а нафтові родовища Ахваза й Абадана зробили рівнину полем бою ірано-іракської війни 1980–1988 рр."
  es:
    - "Elam es la tierra al este del bajo Tigris: la cálida llanura de Susa, hoy el Juzestán, en el suroeste de Irán, y las tierras altas del Zagros tras ella, en torno a Anshan. El Génesis enumera a Elam el primero entre los hijos de Sem, pero la lengua elamita no está emparentada con ninguna otra conocida, y los elamitas fueron vecinos y rivales de Sumer y Babilonia desde finales del cuarto milenio a. C. Una incursión elamita puso fin a la dinastía de Ur hacia el 2004 a. C., y hacia el 1158 a. C. Shutruk-Nahhunte llevó a Susa la estela de las leyes de Hammurabi y la estela de victoria de Naram-Sin, donde excavadores franceses las hallaron en 1898 y 1901–02. El Génesis nombra a «Chêdorlaomer, rey de Elam» como jefe de los cuatro reyes que se llevaron cautivo a Lot; el nombre es elamita en su forma, pero ningún rey así es conocido por los registros elamitas."
    - "En la época asiria Elam respaldó a los rebeldes de Babilonia hasta que Asurbanipal destruyó Susa hacia el 646 a. C., jactándose de haberse llevado sus dioses y de haber sembrado su suelo de sal. El oráculo de Jeremías, «en el principio del reinado de Sedechîas rey de Judá», anunció que el Señor quebraría el arco de Elam, dispersaría a su pueblo a los cuatro vientos y pondría su silla en Elam, pero «en lo postrero de los días» haría volver su cautividad; Ezequiel ve a «Elam, y toda su multitud» entre los muertos en la fosa, e Isaías imagina a sus arqueros en el ejército contra Judá: «Y Elam tomó aljaba». Los persas, que se habían establecido en Anshan, se hicieron cargo de la antigua tierra, y Ciro se llamaba a sí mismo rey de Anshan; el llamado de Isaías a Elam y a Media para que suban y sitien pertenece a la caída de Babilonia en el 539 a. C."
    - "Bajo los persas Susa fue residencia real, y el elamita una de las tres lenguas de la inscripción de Behistún y de las cuentas de los palacios. Daniel tuvo su visión del carnero y el macho cabrío en Susa, en el palacio, en la provincia de Elam, junto al río Ulai, y la historia de Ester se sitúa en Susa. Elamitas y susanquitas figuran entre los pueblos asentados en Samaria que escribieron contra Jerusalén bajo Artajerjes, Isaías cuenta a Elam entre las tierras de las que regresará el remanente, y los «Elamitas» son la tercera nación nombrada entre quienes oyeron a los apóstoles en Pentecostés."
    - "Hoy Elam es la provincia iraní del Juzestán. Los montículos de Susa, con la Apadana de Darío, y el zigurat de Chogha Zanbil, construido por Untash-Napirisha en el siglo XIII a. C., figuran en la lista de la UNESCO; en Shush se venera una tumba de Daniel; y los campos petrolíferos de Ahvaz y Abadán hicieron de la llanura un campo de batalla de la guerra Irán-Irak de 1980–88."
  pt:
    - "Elão é a terra a leste do baixo Tigre: a quente planície de Susã, hoje o Cuzistão, no sudoeste do Irã, e as terras altas do Zagros por trás dela, em torno de Anshan. O Gênesis lista Elão em primeiro lugar entre os filhos de Sem, mas a língua elamita não se relaciona a nenhuma outra conhecida, e os elamitas foram vizinhos e rivais de Suméria e Babilônia desde o fim do quarto milênio a.C. Uma incursão elamita pôs fim à dinastia de Ur por volta de 2004 a.C., e por volta de 1158 a.C. Shutruk-Nahhunte levou a estela das leis de Hamurabi e a estela de vitória de Naram-Sin para Susã, onde escavadores franceses as acharam em 1898 e 1901–02. O Gênesis nomeia “Quedorlaomer, rei de Elão” como chefe dos quatro reis que levaram Ló cativo; o nome é elamita na forma, mas nenhum rei assim é conhecido pelos registros elamitas."
    - "Na época assíria, Elão apoiou os rebeldes da Babilônia até que Assurbanipal destruiu Susã por volta de 646 a.C., gabando-se de ter levado seus deuses e semeado seu solo com sal. O oráculo de Jeremias, dado “no início do reinado de Zedequias”, anunciou: “quebrarei o arco de Elão”, seu povo seria espalhado aos quatro ventos e “Estabelecerei meu trono em Elão”, mas “nos últimos dias” seu cativeiro seria revertido; Ezequiel vê “Elão e toda a sua multidão” entre os mortos na cova, e Isaías retrata seus arqueiros no exército contra Judá: “Elão pegou a sua aljava”. Os persas, que se haviam estabelecido em Anshan, tomaram a antiga terra, e Ciro se chamava rei de Anshan; o brado de Isaías “Suba, Elão; ataque!” pertence à queda da Babilônia em 539 a.C."
    - "Sob os persas, Susã foi residência real, e o elamita uma das três línguas da inscrição de Behistun e das contas do palácio. Daniel teve sua visão do carneiro e do bode “na cidadela de Susã, que fica na província de Elão”, junto ao rio Ulai, e a história de Ester se passa em Susã. Elamitas e susanquitas estão entre os povos fixados em Samaria que escreveram contra Jerusalém sob Artaxerxes, Isaías conta Elão entre as terras de onde o remanescente voltará, e os “elamitas” são a terceira nação nomeada entre os que ouviram os apóstolos em Pentecostes."
    - "Hoje Elão é a província iraniana do Cuzistão. Os montes de Susã, com a Apadana de Dario, e o zigurate de Chogha Zanbil, construído por Untash-Napirisha no século XIII a.C., estão na lista da UNESCO; um túmulo de Daniel é venerado em Shush; e os campos de petróleo de Ahvaz e Abadan fizeram da planície um campo de batalha da guerra Irã–Iraque de 1980–88."
  de:
    - "Elam ist das Land östlich des unteren Tigris: die heiße Ebene von Susa, das heutige Chuzestan im Südwesten Irans, und das Zagros-Hochland dahinter um Anschan. Die Genesis führt Elam als Ersten unter den Söhnen Sems auf, doch die elamische Sprache ist mit keiner anderen bekannten verwandt, und die Elamiter waren seit dem späten 4. Jahrtausend v. Chr. Nachbarn und Rivalen Sumers und Babylons. Ein elamischer Überfall beendete um 2004 v. Chr. die Dynastie von Ur, und um 1158 v. Chr. brachte Schutruk-Nahhunte die Stele mit Hammurapis Gesetzen und die Siegesstele des Naram-Sin nach Susa, wo französische Ausgräber sie 1898 und 1901–02 fanden. Die Genesis erzählt von den vier Königen, die Lot gefangen nahmen, mit „Kedor-Laomor, dem König von Elam“ als Anführer; der Name ist elamisch in der Form, doch ist aus elamischen Quellen kein solcher König bekannt."
    - "In der assyrischen Zeit unterstützte Elam die Rebellen Babylons, bis Assurbanipal um 646 v. Chr. Susa zerstörte und sich rühmte, seine Götter weggeführt und seinen Boden mit Salz besät zu haben. Jeremias Orakel „im Anfang des Königreichs Zedekias, des Königs in Juda“ kündigte an, der HERR werde „den Bogen Elams zerbrechen“, sein Volk in die vier Winde zerstreuen und sagen: „Meinen Stuhl will ich in Elam aufrichten“, doch „in der letzten Zeit“ sein Gefängnis wenden; Hesekiel sieht „Elam mit allem seinem Haufen“ unter den Erschlagenen in der Grube, und Jesaja zeigt seine Bogenschützen im Heer gegen Juda: „Elam fährt daher mit Köcher“. Die Perser, die sich in Anschan niedergelassen hatten, übernahmen das alte Land, und Kyrus nannte sich König von Anschan; Jesajas Ruf „Zieh herauf, Elam! belagere sie, Madai!“ gehört zum Fall Babylons 539 v. Chr."
    - "Unter den Persern war Susa Königsresidenz, und Elamisch war eine der drei Sprachen der Behistun-Inschrift und der Palastabrechnungen. Daniel sah seine Vision vom Widder und vom Ziegenbock „zu Schloß Susan im Lande Elam“ am Wasser Ulai, und die Geschichte Esters spielt in Susa. Elamiter und Susanchiter gehören zu den in Samaria angesiedelten Völkern, die unter Artaxerxes gegen Jerusalem schrieben, Jesaja zählt Elam zu den Ländern, aus denen der Rest heimkehren wird, und „Elamiter“ sind das dritte Volk, das unter denen genannt wird, die die Apostel an Pfingsten hörten."
    - "Heute ist Elam die iranische Provinz Chuzestan. Die Hügel von Susa mit der Apadana des Darius und das Ziggurat von Tschogha Zanbil, im 13. Jahrhundert v. Chr. von Untasch-Napirischa erbaut, stehen auf der UNESCO-Liste; ein Grab Daniels wird in Schusch verehrt; und die Ölfelder von Ahwas und Abadan machten die Ebene zum Schlachtfeld des Iran-Irak-Krieges von 1980–88."
  fr:
    - "L’Élam est le pays à l’est du bas Tigre : la plaine brûlante de Suse, aujourd’hui le Khouzestan, dans le sud-ouest de l’Iran, et les hautes terres du Zagros qui la bordent autour d’Anshan. La Genèse nomme Élam en premier parmi les fils de Sem, mais la langue élamite n’est apparentée à aucune autre langue connue, et les Élamites furent voisins et rivaux de Sumer et de Babylone dès la fin du IVe millénaire av. J.-C. Un raid élamite mit fin à la dynastie d’Ur vers 2004 av. J.-C., et vers 1158 av. J.-C. Shutruk-Nahhunte emporta à Suse la stèle des lois de Hammourabi et la stèle de victoire de Narâm-Sîn, que des fouilleurs français y trouvèrent en 1898 et 1901–1902. La Genèse nomme « Kedorlaomer, roi d’Élam » comme chef des quatre rois qui emmenèrent Lot captif ; le nom est de forme élamite, mais aucun roi de ce nom n’est connu par les sources élamites."
    - "À l’époque assyrienne, l’Élam soutint les rebelles de Babylone jusqu’à ce qu’Assurbanipal détruise Suse vers 646 av. J.-C., se vantant d’avoir emporté ses dieux et semé son sol de sel. L’oracle de Jérémie, « au commencement du règne de Sédécias », annonça la ruine : « je vais briser l’arc d’Élam », son peuple dispersé aux quatre vents, puis « Je placerai mon trône dans Élam » ; pourtant « dans la suite des temps » ses captifs seraient ramenés. Ézéchiel voit « Élam, avec toute sa multitude » parmi les morts de la fosse, et Ésaïe montre ses archers dans l’armée contre Juda : « Élam porte le carquois ». Les Perses, établis à Anshan, reprirent le vieux pays, et Cyrus se disait roi d’Anshan ; le cri d’Ésaïe « Monte, Élam ! Assiège, Médie ! » se rapporte à la chute de Babylone en 539 av. J.-C."
    - "Sous les Perses, Suse fut une résidence royale, et l’élamite l’une des trois langues de l’inscription de Behistun et des comptes du palais. Daniel eut sa vision du bélier et du bouc « à Suse, la capitale, dans la province d’Élam », près du fleuve d’Ulaï, et l’histoire d’Esther se déroule à Suse. Des gens de Suse et des Élamites figurent parmi les peuples installés en Samarie qui écrivirent contre Jérusalem sous Artaxerxès, Ésaïe compte Élam parmi les pays d’où reviendra le reste, et les « Élamites » sont la troisième nation nommée parmi ceux qui entendirent les apôtres à la Pentecôte."
    - "Aujourd’hui, l’Élam est la province iranienne du Khouzestan. Les tertres de Suse, avec l’Apadana de Darius, et la ziggourat de Tchogha Zanbil, bâtie par Untash-Napirisha au XIIIe siècle av. J.-C., figurent sur la liste de l’UNESCO ; un tombeau de Daniel est vénéré à Shush ; et les champs pétrolifères d’Ahvaz et d’Abadan firent de la plaine un champ de bataille de la guerre Iran-Irak de 1980–1988."
  it:
    - "Elam è la terra a est del basso Tigri: la calda pianura di Susa, oggi il Khuzestan nell’Iran sud-occidentale, e gli altipiani dello Zagros alle sue spalle attorno ad Anshan. La Genesi elenca Elam per primo fra i figli di Sem, ma la lingua elamita non è imparentata con nessun’altra lingua nota, e gli Elamiti furono vicini e rivali di Sumer e Babilonia dalla fine del IV millennio a.C. Un’incursione elamita pose fine alla dinastia di Ur intorno al 2004 a.C., e intorno al 1158 a.C. Shutruk-Nahhunte portò a Susa la stele delle leggi di Hammurabi e la stele della vittoria di Naram-Sin, dove gli scavatori francesi le trovarono nel 1898 e nel 1901–02. La Genesi nomina «Kedorlaomer re di Elam» come capo dei quattro re che fecero prigioniero Lot; il nome è elamita nella forma, ma nessun re simile è noto dalle fonti elamite."
    - "Nell’età assira Elam appoggiò i ribelli di Babilonia finché Assurbanipal distrusse Susa intorno al 646 a.C., vantandosi di aver portato via i suoi dèi e di aver cosparso di sale il suo suolo. L’oracolo di Geremia, «al principio del regno di Sedekia, re di Giuda», predisse che il Signore avrebbe spezzato «l’arco di Elam», disperso il suo popolo ai quattro venti e posto «il mio trono in Elam», ma «negli ultimi giorni» ne avrebbe fatto tornare la cattività; Ezechiele vede «Elam con tutta la sua moltitudine» fra gli uccisi nella fossa, e Isaia raffigura i suoi arcieri nell’esercito contro Giuda: «Elam porta il turcasso». I Persiani, stanziati ad Anshan, ereditarono l’antica terra, e Ciro si disse re di Anshan; il grido di Isaia «Sali, o Elam! Metti l’assedio o Media!» riguarda la caduta di Babilonia nel 539 a.C."
    - "Sotto i Persiani Susa fu una residenza reale, e l’elamita una delle tre lingue dell’iscrizione di Bisitun e dei conti dei palazzi. Daniele ebbe la sua visione dell’ariete e del capro «a Susan, la residenza reale, che è nella provincia di Elam», presso il fiume Ulai, e la storia di Ester è ambientata a Susa. Elamiti e Susanchiti sono fra i popoli insediati in Samaria che scrissero contro Gerusalemme sotto Artaserse, Isaia annovera Elam fra i paesi da cui il residuo tornerà, e gli «Elamiti» sono la terza nazione nominata fra quelli che udirono gli apostoli a Pentecoste."
    - "Oggi Elam è la provincia iraniana del Khuzestan. I tell di Susa, con l’Apadana di Dario, e la ziggurat di Chogha Zanbil, costruita da Untash-Napirisha nel XIII secolo a.C., sono nella lista UNESCO; una tomba di Daniele è venerata a Shush; e i campi petroliferi di Ahvaz e Abadan fecero della pianura un campo di battaglia della guerra Iran–Iraq del 1980–88."
  pl:
    - "Elam to kraj na wschód od dolnego Tygrysu: gorąca równina Suzy, dzisiejszy Chuzestan w południowo-zachodnim Iranie, oraz wyżyny Zagros za nią wokół Anszanu. Księga Rodzaju wymienia Elama jako pierwszego wśród synów Sema, lecz język elamicki nie jest spokrewniony z żadnym innym znanym językiem, a Elamici byli sąsiadami i rywalami Sumeru i Babilonu od końca IV tysiąclecia p.n.e. Elamicki najazd zakończył dynastię z Ur około 2004 r. p.n.e., a około 1158 r. p.n.e. Szutruk-Nachunte uwiózł do Suzy stelę praw Hammurabiego i stelę zwycięstwa Naram-Sina, gdzie odnaleźli je francuscy archeolodzy w 1898 i 1901–1902 r. Księga Rodzaju wymienia „Chodorlahomera, króla Elamskiego” jako wodza czterech królów, którzy uprowadzili Lota; imię jest elamickie w formie, lecz żaden taki król nie jest znany ze źródeł elamickich."
    - "W epoce asyryjskiej Elam wspierał buntowników Babilonu, aż Aszurbanipal zniszczył Suzę około 646 r. p.n.e., chełpiąc się, że uniósł jej bogów i obsiał jej ziemię solą. Wyrocznia Jeremiasza, wygłoszona „na początku królowania Sedekijasza”, zapowiedziała w imieniu Pana: „złamię łuk Elamczyków”; że rozproszy jego lud na cztery wiatry; że „postawię stolicę moję między Elamczykami”; lecz „w ostateczne dni” przywróci jego jeńców; Ezechiel widzi „Elam i wszystka zgraja jego” wśród poległych w dole, a Izajasz przedstawia jego łuczników w wojsku przeciw Judzie: „Elam też wziął sajdak”. Persowie, którzy osiedlili się w Anszanie, przejęli dawny kraj, a Cyrus nazywał siebie królem Anszanu; okrzyk Izajasza „Przyciągnijże, Elamie! Oblęż, Medzie!” należy do upadku Babilonu w 539 r. p.n.e."
    - "Pod Persami Suza była rezydencją królewską, a elamicki jednym z trzech języków inskrypcji behistuńskiej i rachunków pałacowych. Daniel ujrzał swoją wizję barana i kozła „w Susan, mieście głównem, które było w krainie Elam”, nad rzeką Ulaj, a opowieść o Esterze rozgrywa się w Suzie. Elamici i Suzanchici są wśród ludów osiedlonych w Samarii, które pisały przeciw Jerozolimie za Artakserksesa, Izajasz zalicza Elam wśród krain, z których powróci reszta, a „Elamici” są trzecim narodem wymienionym wśród tych, którzy słyszeli apostołów w Pięćdziesiątnicę."
    - "Dziś Elam to irańska prowincja Chuzestan. Wzgórza Suzy z Apadaną Dariusza i zigurat Czoga Zanbil, zbudowany przez Untasz-Napiriszię w XIII w. p.n.e., są na liście UNESCO; grób Daniela czci się w Szusz; a pola naftowe Ahwazu i Abadanu uczyniły z równiny pole bitwy wojny iracko-irańskiej z lat 1980–88."
  nl:
    - "Elam is het land ten oosten van de benedenloop van de Tigris: de hete vlakte van Susa, het huidige Khuzestan in zuidwest-Iran, en het Zagrosgebergte erachter rond Anshan. Genesis noemt Elam het eerst onder de zonen van Sem, maar de Elamitische taal is aan geen andere bekende taal verwant, en de Elamieten waren sinds het late vierde millennium v.Chr. buren en rivalen van Sumer en Babylon. Een Elamitische inval maakte omstreeks 2004 v.Chr. een einde aan de dynastie van Ur, en omstreeks 1158 v.Chr. voerde Shutruk-Nahhunte de stèle van Hammurabi's wetten en de overwinningsstèle van Naram-Sin naar Susa, waar Franse opgravers ze in 1898 en 1901–02 vonden. Genesis noemt “Kedor-Laomer, den koning van Elam” als leider van de vier koningen die Lot gevangennamen; de naam is Elamitisch van vorm, maar zo'n koning is uit Elamitische bronnen niet bekend."
    - "In de Assyrische tijd steunde Elam de opstandelingen van Babylon totdat Assurbanipal omstreeks 646 v.Chr. Susa verwoestte en pochte dat hij zijn goden had weggevoerd en zijn grond met zout had bezaaid. Jeremia's orakel, “in het begin des koninkrijks van Zedekia”, voorzei dat de HEER “Elams boog” zou verbreken, zijn volk naar de vier winden zou verstrooien en “Mijn troon in Elam stellen”, maar “in het laatste der dagen” zijn gevangenis zou wenden; Ezechiël ziet “Elam met haar ganse menigte” onder de verslagenen in de kuil, en Jesaja schildert zijn boogschutters in het leger tegen Juda: “Elam heeft den pijlkoker genomen”. De Perzen, die zich in Anshan hadden gevestigd, namen het oude land over, en Cyrus noemde zich koning van Anshan; Jesaja's roep “trek op, o Elam! beleger ze, o Media!” hoort bij de val van Babylon in 539 v.Chr."
    - "Onder de Perzen was Susa een koninklijke residentie, en het Elamitisch was een van de drie talen van de Behistun-inscriptie en van de paleisboekhouding. Daniël zag zijn visioen van de ram en de bok, toen hij “in den burg Susan was, welke in het landschap Elam is”, aan de rivier Ulai, en Esthers verhaal speelt in Susa. Elamieten en Susanchieten behoren tot de volken die in Samaria werden gevestigd en onder Artaxerxes tegen Jeruzalem schreven, Jesaja rekent Elam tot de landen waaruit het overblijfsel zal terugkeren, en “Elamieten” zijn het derde volk dat wordt genoemd onder hen die de apostelen met Pinksteren hoorden."
    - "Tegenwoordig is Elam de Iraanse provincie Khuzestan. De heuvels van Susa, met de Apadana van Darius, en de ziggoerat van Chogha Zanbil, in de dertiende eeuw v.Chr. gebouwd door Untash-Napirisha, staan op de UNESCO-lijst; een graf van Daniël wordt vereerd te Shush; en de olievelden van Ahvaz en Abadan maakten de vlakte tot slagveld van de Iraaks-Iraanse oorlog van 1980–88."
  cs:
    - "Élam je země východně od dolního Tigridu: horká pláň Sus, dnešní Chúzestán v jihozápadním Íránu, a zagroské vysočiny za ní kolem Anšanu. Genesis uvádí Élam jako prvního mezi syny Šémovými, ale elamština není příbuzná žádnému jinému známému jazyku a Élamité byli sousedy a soupeři Sumeru a Babylóna od konce 4. tisíciletí př. n. l. Elamský nájezd ukončil kolem roku 2004 př. n. l. dynastii z Uru a kolem roku 1158 př. n. l. odvezl Šutruk-Nachunte do Sus stélu Chammurapiho zákonů a vítěznou stélu Naram-Sina, kde je francouzští vykopávači nalezli v letech 1898 a 1901–02. Genesis jmenuje „Chedorlaomer král Elamitský“ jako vůdce čtyř králů, kteří zajali Lota; jméno je podle formy elamské, ale žádný takový král není z elamských záznamů znám."
    - "V asyrské době podporoval Élam babylónské rebely, dokud Aššurbanipal kolem roku 646 př. n. l. nezničil Sus a nechlubil se, že odvlekl jeho bohy a zasel jeho půdu solí. Jeremjášova věštba, „na počátku kralování Sedechiáše krále Judského“, předpověděla, že Hospodin „polámi lučiště Elamitských“, rozptýlí jejich lid do čtyř větrů a „postavím stolici svou mezi Elamitskými“, a přece „v posledních dnech“ přivede zpět jejich zajaté; Ezechiel vidí „Elam i všecko množství jeho“ mezi zabitými v jámě a Izajáš vykresluje jeho lučištníky ve vojsku proti Judsku: „Elam pochytil toul s vozy lidu vojenského“. Peršané, kteří se usadili v Anšanu, převzali starou zemi a Kýros se nazýval králem Anšanu; Izajášův výkřik „Přitáhniž Elame, Médský oblehni“ patří k pádu Babylóna roku 539 př. n. l."
    - "Za Peršanů byly Sus královskou rezidencí a elamština jedním ze tří jazyků nápisu z Bisotúnu a paláceových účtů. Daniel viděl své vidění berana a kozla „v Susan, na hradě, kterýž jest v krajině Elam“ u potoka Ulai a příběh Ester se odehrává v Susách. Élamité a Susanchejci jsou mezi národy usazenými v Samaří, kteří psali proti Jeruzalému za Artaxerxa; Izajáš počítá Élam mezi země, odkud se ostatek vrátí, a „Elamitští“ jsou třetím národem jmenovaným mezi těmi, kdo slyšeli apoštoly o Letnicích."
    - "Dnes je Élam íránská provincie Chúzestán. Pahorky Sus s Dareiovou apadánou a zikkurat Chogha Zanbil, postavený Untaš-Napirišou ve 13. století př. n. l., jsou na seznamu UNESCO; Danielova hrobka je uctívána v Shush; a ropná pole Ahvázu a Ábádánu učinila z pláně bojiště íránsko-irácké války v letech 1980–88."
