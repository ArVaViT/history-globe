body:
  en:
    - "Elam is the land east of the lower Tigris: the hot plain of Susa, today's Khuzestan in south-western Iran, and the Zagros highlands behind it around Anshan. Genesis lists Elam first among the sons of Shem, but the Elamite language is related to no other known tongue, and the Elamites were neighbours and rivals of Sumer and Babylon from the late fourth millennium BC. An Elamite raid ended the dynasty of Ur about 2004 BC, and about 1158 BC Shutruk-Nahhunte carried the victory stele of Naram-Sin and the stele of Hammurabi's laws to Susa, where French excavators found them in 1898 and 1901–02. Genesis names “Chedorlaomer king of Elam” as leader of the four kings who took Lot captive; the name is Elamite in form, but no such king is known from Elamite records."
    - "In the Assyrian age Elam backed the rebels of Babylon until Ashurbanipal destroyed Susa about 646 BC, boasting that he had carried off its gods and scattered salt over the districts of Elam. Jeremiah's oracle, “in the beginning of the reign of Zedekiah”, foretold that the Lord would “break the bow of Elam”, scatter its people to the four winds and “set my throne in Elam”, yet “in the latter days” bring back its captivity; Ezekiel sees “Elam and all her multitude” among the slain in the pit, and Isaiah pictures its archers in the army against Judah: “Elam bare the quiver”. The Persians, who had settled in Anshan, took the old land over, and Cyrus called himself king of Anshan; Isaiah's cry “Go up, O Elam: besiege, O Media” is usually read of the fall of Babylon in 539 BC."
    - "Under the Persians Susa was a royal residence, and Elamite one of the three languages of the Behistun inscription and of the palace accounts. Daniel saw his vision of the ram and the he goat “at Shushan in the palace, which is in the province of Elam” by the river Ulai, and Esther's story is set in Susa. Elamites and Susanchites are among the peoples settled in Samaria who wrote against Jerusalem under Artaxerxes, Isaiah numbers Elam among the lands from which the remnant will return, and “Elamites” are the third nation named among those who heard the apostles at Pentecost."
    - "Today the lowland of Elam is the Iranian province of Khuzestan. The mounds of Susa, with the Apadana of Darius, and the ziggurat of Chogha Zanbil, built by Untash-Napirisha in the thirteenth century BC, are on the UNESCO list; a tomb of Daniel is venerated at Shush; and the oil fields of Ahvaz and Abadan made the plain a battlefield of the Iran–Iraq war of 1980–88."
  ru:
    - "Елам — земля к востоку от нижнего Тигра: жаркая равнина Суз, нынешний Хузестан на юго-западе Ирана, и горы Загроса за ней вокруг Аншана. Книга Бытия ставит Елама первым среди сыновей Сима, но эламский язык не родствен ни одному известному языку, а эламиты были соседями и соперниками Шумера и Вавилона с конца четвёртого тысячелетия до н. э. Набег эламитов положил конец династии Ура около 2004 г. до н. э., а около 1158 г. до н. э. Шутрук-Наххунте увёз в Сузы победную стелу Нарам-Суэна и стелу с законами Хаммурапи, где французские археологи нашли их в 1898 и 1901–1902 годах. Бытие называет «Кедорлаомера, царя Еламского» главой четырёх царей, уведших в плен Лота; имя по форме эламское, но такого царя эламские источники не знают."
    - "В ассирийскую эпоху Елам поддерживал мятежников Вавилона, пока Ашшурбанипал около 646 г. до н. э. не разрушил Сузы, похваляясь, что увёз их богов и рассыпал соль по областям Елама. Пророчество Иеремии, данное «в начале царствования Седекии», предрекало, что Господь сокрушит «лук Елама», развеет его народ по четырём ветрам и поставит «престол Мой в Еламе», но «в последние дни» возвратит его плен; Иезекииль видит «Елам со всем множеством своим» среди поражённых в преисподней, а Исаия рисует его лучников в войске против Иудеи: «Елам несет колчан». Персы, осевшие в Аншане, переняли древнюю землю, и Кир называл себя царём Аншана; возглас Исаии «восходи, Елам, осаждай, Мид!» обычно относят к падению Вавилона в 539 г. до н. э."
    - "При персах Сузы были царской резиденцией, а эламский — одним из трёх языков Бехистунской надписи и дворцовых отчётов. Даниил видел видение об овне и козле «в Сузах, престольном городе в области Еламской», у реки Улая, и действие книги Есфирь происходит в Сузах. Еламитяне и Сусанцы — среди народов, поселённых в Самарии и писавших против Иерусалима при Артаксерксе; Исаия называет Елам среди земель, откуда вернётся остаток, а «Еламиты» — третий народ в перечне тех, кто слышал апостолов в день Пятидесятницы."
    - "Сегодня равнинный Елам — иранская провинция Хузестан. Холмы Суз с ападаной Дария и зиккурат Чога-Занбиль, построенный Унташ-Напиришей в XIII веке до н. э., внесены в список ЮНЕСКО; в Шуше почитают гробницу Даниила; а нефтяные поля Ахваза и Абадана сделали равнину полем битвы ирано-иракской войны 1980–1988 годов."
  uk:
    - "Елам — земля на схід від нижнього Тигру: гаряча рівнина Сузи, нинішній Хузестан на південному заході Ірану, і за нею високогір'я Загрос навколо Аншану. Книга Буття перелічує Елам першим серед синів Сима, але еламська мова не споріднена з жодною відомою мовою, і еламіти були сусідами та суперниками Шумеру й Вавилона від кінця IV тис. до н. е. Еламський набіг завершив династію Ура близько 2004 р. до н. е., а близько 1158 р. до н. е. Шутрук-Нахунте відвіз переможну стелу Нарам-Сіна та стелу законів Хаммурапі до Сузи, де французькі розкопувачі знайшли їх у 1898 та 1901–1902 рр. Книга Буття називає «Кедорлайомера, царя Еламського» ватажком чотирьох царів, які взяли Лота в полон; ім'я еламське за формою, але такого царя не знають еламські записи."
    - "В ассирійську добу Елам підтримував бунтарів Вавилона, доки Ашшурбаніпал не знищив Сузи близько 646 р. до н. е., хвалячись, що вивіз його богів і розсипав сіль по округах Еламу. Оракул Єремії «у початку царювання Седекіїного» передає слова Господа: «Се я поламлю лука Еламіям», — його народ буде розвіяний на чотири вітри, і «поставлю мого престола в Еламі», а «У дальші ж часи» полонених буде повернуто; Єзекіїль бачить Елам «із усією силою своєю» серед убитих у ямі, а Ісая малює його лучників у війську проти Юди: «Несе Елам сагайдак». Перси, що оселилися в Аншані, перейняли давню землю, і Кір називав себе царем Аншану; вигук Ісаї «Приходи, Еламе; облягай, Миде!» зазвичай відносять до падіння Вавилона в 539 р. до н. е."
    - "Під персами Суза була царською резиденцією, а еламська — однією з трьох мов Бісутунського напису та палацових обліків. Даниїл побачив своє видіння барана й козла «в Сузах, престольному містї в краю Еламськім» біля ріки Улай, а історія Естер розгортається в Сузах. Еламіти й сусанці — серед народів, поселених у Самарії, що писали проти Єрусалима за Артаксеркса, Ісая зараховує Елам до земель, звідки повернеться останок, а «еламіти» — третій народ, названий серед тих, хто чув апостолів на П'ятдесятницю."
    - "Сьогодні рівнинний Елам — це іранська провінція Хузестан. Пагорби Сузи з Ападаною Дарія та зіккурат Чога-Занбіль, збудований Унташ-Напірішею в XIII ст. до н. е., внесені до списку ЮНЕСКО; гробницю Даниїла вшановують у Шуші; а нафтові родовища Ахваза й Абадана зробили рівнину полем бою ірано-іракської війни 1980–1988 рр."
  es:
    - "Elam es la tierra al este del bajo Tigris: la cálida llanura de Susa, hoy el Juzestán, en el suroeste de Irán, y las tierras altas del Zagros tras ella, en torno a Anshan. El Génesis enumera a Elam el primero entre los hijos de Sem, pero la lengua elamita no está emparentada con ninguna otra conocida, y los elamitas fueron vecinos y rivales de Sumer y Babilonia desde finales del cuarto milenio a. C. Una incursión elamita puso fin a la dinastía de Ur hacia el 2004 a. C., y hacia el 1158 a. C. Shutruk-Nahhunte llevó a Susa la estela de victoria de Naram-Sin y la estela de las leyes de Hammurabi, donde excavadores franceses las hallaron en 1898 y 1901–02. El Génesis nombra a «Chêdorlaomer, rey de Elam» como jefe de los cuatro reyes que se llevaron cautivo a Lot; el nombre es elamita en su forma, pero ningún rey así es conocido por los registros elamitas."
    - "En la época asiria Elam respaldó a los rebeldes de Babilonia hasta que Asurbanipal destruyó Susa hacia el 646 a. C., jactándose de haberse llevado sus dioses y de haber esparcido sal por los distritos de Elam. El oráculo de Jeremías, «en el principio del reinado de Sedechîas rey de Judá», anunció que el Señor quebraría el arco de Elam, dispersaría a su pueblo a los cuatro vientos y pondría su silla en Elam, pero «en lo postrero de los días» haría volver su cautividad; Ezequiel ve a «Elam, y toda su multitud» entre los muertos en la fosa, e Isaías imagina a sus arqueros en el ejército contra Judá: «Y Elam tomó aljaba». Los persas, que se habían establecido en Anshan, se hicieron cargo de la antigua tierra, y Ciro se llamaba a sí mismo rey de Anshan; el llamado de Isaías a Elam y a Media para que suban y sitien suele referirse a la caída de Babilonia en el 539 a. C."
    - "Bajo los persas Susa fue residencia real, y el elamita una de las tres lenguas de la inscripción de Behistún y de las cuentas de los palacios. Daniel tuvo su visión del carnero y el macho cabrío en Susa, en el palacio, en la provincia de Elam, junto al río Ulai, y la historia de Ester se sitúa en Susa. Elamitas y susanquitas figuran entre los pueblos asentados en Samaria que escribieron contra Jerusalén bajo Artajerjes, Isaías cuenta a Elam entre las tierras de las que regresará el remanente, y los «Elamitas» son la tercera nación nombrada entre quienes oyeron a los apóstoles en Pentecostés."
    - "Hoy la llanura de Elam es la provincia iraní del Juzestán. Los montículos de Susa, con la Apadana de Darío, y el zigurat de Chogha Zanbil, construido por Untash-Napirisha en el siglo XIII a. C., figuran en la lista de la UNESCO; en Shush se venera una tumba de Daniel; y los campos petrolíferos de Ahvaz y Abadán hicieron de la llanura un campo de batalla de la guerra Irán-Irak de 1980–88."
  pt:
    - "Elão é a terra a leste do baixo Tigre: a quente planície de Susã, hoje o Cuzistão, no sudoeste do Irã, e as terras altas do Zagros por trás dela, em torno de Anshan. O Gênesis lista Elão em primeiro lugar entre os filhos de Sem, mas a língua elamita não se relaciona a nenhuma outra conhecida, e os elamitas foram vizinhos e rivais de Suméria e Babilônia desde o fim do quarto milênio a.C. Uma incursão elamita pôs fim à dinastia de Ur por volta de 2004 a.C., e por volta de 1158 a.C. Shutruk-Nahhunte levou a estela de vitória de Naram-Sin e a estela das leis de Hamurabi para Susã, onde escavadores franceses as acharam em 1898 e 1901–02. O Gênesis nomeia “Quedorlaomer, rei de Elão” como chefe dos quatro reis que levaram Ló cativo; o nome é elamita na forma, mas nenhum rei assim é conhecido pelos registros elamitas."
    - "Na época assíria, Elão apoiou os rebeldes da Babilônia até que Assurbanipal destruiu Susã por volta de 646 a.C., gabando-se de ter levado seus deuses e espalhado sal pelos distritos de Elão. O oráculo de Jeremias, dado “no início do reinado de Zedequias”, anunciou: “quebrarei o arco de Elão”, seu povo seria espalhado aos quatro ventos e “Estabelecerei meu trono em Elão”, mas “nos últimos dias” seu cativeiro seria revertido; Ezequiel vê “Elão e toda a sua multidão” entre os mortos na cova, e Isaías retrata seus arqueiros no exército contra Judá: “Elão pegou a sua aljava”. Os persas, que se haviam estabelecido em Anshan, tomaram a antiga terra, e Ciro se chamava rei de Anshan; o brado de Isaías “Suba, Elão; ataque!” costuma ser referido à queda da Babilônia em 539 a.C."
    - "Sob os persas, Susã foi residência real, e o elamita uma das três línguas da inscrição de Behistun e das contas do palácio. Daniel teve sua visão do carneiro e do bode “na cidadela de Susã, que fica na província de Elão”, junto ao rio Ulai, e a história de Ester se passa em Susã. Elamitas e susanquitas estão entre os povos fixados em Samaria que escreveram contra Jerusalém sob Artaxerxes, Isaías conta Elão entre as terras de onde o remanescente voltará, e os “elamitas” são a terceira nação nomeada entre os que ouviram os apóstolos em Pentecostes."
    - "Hoje a planície de Elão é a província iraniana do Cuzistão. Os montes de Susã, com a Apadana de Dario, e o zigurate de Chogha Zanbil, construído por Untash-Napirisha no século XIII a.C., estão na lista da UNESCO; um túmulo de Daniel é venerado em Shush; e os campos de petróleo de Ahvaz e Abadan fizeram da planície um campo de batalha da guerra Irã–Iraque de 1980–88."
  de:
    - "Elam ist das Land östlich des unteren Tigris: die heiße Ebene von Susa, das heutige Chuzestan im Südwesten Irans, und das Zagros-Hochland dahinter um Anschan. Die Genesis führt Elam als Ersten unter den Söhnen Sems auf, doch die elamische Sprache ist mit keiner anderen bekannten verwandt, und die Elamiter waren seit dem späten 4. Jahrtausend v. Chr. Nachbarn und Rivalen Sumers und Babylons. Ein elamischer Überfall beendete um 2004 v. Chr. die Dynastie von Ur, und um 1158 v. Chr. brachte Schutruk-Nahhunte die Siegesstele des Naram-Sin und die Stele mit Hammurapis Gesetzen nach Susa, wo französische Ausgräber sie 1898 und 1901–02 fanden. Die Genesis erzählt von den vier Königen, die Lot gefangen nahmen, mit „Kedor-Laomor, dem König von Elam“ als Anführer; der Name ist elamisch in der Form, doch ist aus elamischen Quellen kein solcher König bekannt."
    - "In der assyrischen Zeit unterstützte Elam die Rebellen Babylons, bis Assurbanipal um 646 v. Chr. Susa zerstörte und sich rühmte, seine Götter weggeführt und Salz über die Bezirke Elams gestreut zu haben. Jeremias Orakel „im Anfang des Königreichs Zedekias, des Königs in Juda“ kündigte an, der HERR werde „den Bogen Elams zerbrechen“, sein Volk in die vier Winde zerstreuen und sagen: „Meinen Stuhl will ich in Elam aufrichten“, doch „in der letzten Zeit“ sein Gefängnis wenden; Hesekiel sieht „Elam mit allem seinem Haufen“ unter den Erschlagenen in der Grube, und Jesaja zeigt seine Bogenschützen im Heer gegen Juda: „Elam fährt daher mit Köcher“. Die Perser, die sich in Anschan niedergelassen hatten, übernahmen das alte Land, und Kyrus nannte sich König von Anschan; Jesajas Ruf „Zieh herauf, Elam! belagere sie, Madai!“ wird meist auf den Fall Babylons 539 v. Chr. bezogen."
    - "Unter den Persern war Susa Königsresidenz, und Elamisch war eine der drei Sprachen der Behistun-Inschrift und der Palastabrechnungen. Daniel sah seine Vision vom Widder und vom Ziegenbock „zu Schloß Susan im Lande Elam“ am Wasser Ulai, und die Geschichte Esters spielt in Susa. Elamiter und Susanchiter gehören zu den in Samaria angesiedelten Völkern, die unter Artaxerxes gegen Jerusalem schrieben, Jesaja zählt Elam zu den Ländern, aus denen der Rest heimkehren wird, und „Elamiter“ sind das dritte Volk, das unter denen genannt wird, die die Apostel an Pfingsten hörten."
    - "Heute ist das Tiefland von Elam die iranische Provinz Chuzestan. Die Hügel von Susa mit der Apadana des Darius und das Ziggurat von Tschogha Zanbil, im 13. Jahrhundert v. Chr. von Untasch-Napirischa erbaut, stehen auf der UNESCO-Liste; ein Grab Daniels wird in Schusch verehrt; und die Ölfelder von Ahwas und Abadan machten die Ebene zum Schlachtfeld des Iran-Irak-Krieges von 1980–88."
  fr:
    - "L’Élam est le pays à l’est du bas Tigre : la plaine brûlante de Suse, aujourd’hui le Khouzestan, dans le sud-ouest de l’Iran, et les hautes terres du Zagros qui la bordent autour d’Anshan. La Genèse nomme Élam en premier parmi les fils de Sem, mais la langue élamite n’est apparentée à aucune autre langue connue, et les Élamites furent voisins et rivaux de Sumer et de Babylone dès la fin du IVe millénaire av. J.-C. Un raid élamite mit fin à la dynastie d’Ur vers 2004 av. J.-C., et vers 1158 av. J.-C. Shutruk-Nahhunte emporta à Suse la stèle de victoire de Narâm-Sîn et la stèle des lois de Hammourabi, que des fouilleurs français y trouvèrent en 1898 et 1901–1902. La Genèse nomme « Kedorlaomer, roi d’Élam » comme chef des quatre rois qui emmenèrent Lot captif ; le nom est de forme élamite, mais aucun roi de ce nom n’est connu par les sources élamites."
    - "À l’époque assyrienne, l’Élam soutint les rebelles de Babylone jusqu’à ce qu’Assurbanipal détruise Suse vers 646 av. J.-C., se vantant d’avoir emporté ses dieux et répandu du sel sur les districts de l’Élam. L’oracle de Jérémie, « au commencement du règne de Sédécias », annonça la ruine : « je vais briser l’arc d’Élam », son peuple dispersé aux quatre vents, puis « Je placerai mon trône dans Élam » ; pourtant « dans la suite des temps » ses captifs seraient ramenés. Ézéchiel voit « Élam, avec toute sa multitude » parmi les morts de la fosse, et Ésaïe montre ses archers dans l’armée contre Juda : « Élam porte le carquois ». Les Perses, établis à Anshan, reprirent le vieux pays, et Cyrus se disait roi d’Anshan ; le cri d’Ésaïe « Monte, Élam ! Assiège, Médie ! » est généralement rapporté à la chute de Babylone en 539 av. J.-C."
    - "Sous les Perses, Suse fut une résidence royale, et l’élamite l’une des trois langues de l’inscription de Behistun et des comptes du palais. Daniel eut sa vision du bélier et du bouc « à Suse, la capitale, dans la province d’Élam », près du fleuve d’Ulaï, et l’histoire d’Esther se déroule à Suse. Des gens de Suse et des Élamites figurent parmi les peuples installés en Samarie qui écrivirent contre Jérusalem sous Artaxerxès, Ésaïe compte Élam parmi les pays d’où reviendra le reste, et les « Élamites » sont la troisième nation nommée parmi ceux qui entendirent les apôtres à la Pentecôte."
    - "Aujourd’hui, la plaine de l’Élam est la province iranienne du Khouzestan. Les tertres de Suse, avec l’Apadana de Darius, et la ziggourat de Tchogha Zanbil, bâtie par Untash-Napirisha au XIIIe siècle av. J.-C., figurent sur la liste de l’UNESCO ; un tombeau de Daniel est vénéré à Shush ; et les champs pétrolifères d’Ahvaz et d’Abadan firent de la plaine un champ de bataille de la guerre Iran-Irak de 1980–1988."
  it:
    - "Elam è la terra a est del basso Tigri: la calda pianura di Susa, oggi il Khuzestan nell’Iran sud-occidentale, e gli altipiani dello Zagros alle sue spalle attorno ad Anshan. La Genesi elenca Elam per primo fra i figli di Sem, ma la lingua elamita non è imparentata con nessun’altra lingua nota, e gli Elamiti furono vicini e rivali di Sumer e Babilonia dalla fine del IV millennio a.C. Un’incursione elamita pose fine alla dinastia di Ur intorno al 2004 a.C., e intorno al 1158 a.C. Shutruk-Nahhunte portò a Susa la stele della vittoria di Naram-Sin e la stele delle leggi di Hammurabi, dove gli scavatori francesi le trovarono nel 1898 e nel 1901–02. La Genesi nomina «Kedorlaomer re di Elam» come capo dei quattro re che fecero prigioniero Lot; il nome è elamita nella forma, ma nessun re simile è noto dalle fonti elamite."
    - "Nell’età assira Elam appoggiò i ribelli di Babilonia finché Assurbanipal distrusse Susa intorno al 646 a.C., vantandosi di aver portato via i suoi dèi e di aver sparso sale sui distretti di Elam. L’oracolo di Geremia, «al principio del regno di Sedekia, re di Giuda», predisse che il Signore avrebbe spezzato «l’arco di Elam», disperso il suo popolo ai quattro venti e posto «il mio trono in Elam», ma «negli ultimi giorni» ne avrebbe fatto tornare la cattività; Ezechiele vede «Elam con tutta la sua moltitudine» fra gli uccisi nella fossa, e Isaia raffigura i suoi arcieri nell’esercito contro Giuda: «Elam porta il turcasso». I Persiani, stanziati ad Anshan, ereditarono l’antica terra, e Ciro si disse re di Anshan; il grido di Isaia «Sali, o Elam! Metti l’assedio o Media!» è di solito riferito alla caduta di Babilonia nel 539 a.C."
    - "Sotto i Persiani Susa fu una residenza reale, e l’elamita una delle tre lingue dell’iscrizione di Bisitun e dei conti dei palazzi. Daniele ebbe la sua visione dell’ariete e del capro «a Susan, la residenza reale, che è nella provincia di Elam», presso il fiume Ulai, e la storia di Ester è ambientata a Susa. Elamiti e Susanchiti sono fra i popoli insediati in Samaria che scrissero contro Gerusalemme sotto Artaserse, Isaia annovera Elam fra i paesi da cui il residuo tornerà, e gli «Elamiti» sono la terza nazione nominata fra quelli che udirono gli apostoli a Pentecoste."
    - "Oggi la pianura di Elam è la provincia iraniana del Khuzestan. I tell di Susa, con l’Apadana di Dario, e la ziggurat di Chogha Zanbil, costruita da Untash-Napirisha nel XIII secolo a.C., sono nella lista UNESCO; una tomba di Daniele è venerata a Shush; e i campi petroliferi di Ahvaz e Abadan fecero della pianura un campo di battaglia della guerra Iran–Iraq del 1980–88."
  pl:
    - "Elam to kraj na wschód od dolnego Tygrysu: gorąca równina Suzy, dzisiejszy Chuzestan w południowo-zachodnim Iranie, oraz wyżyny Zagros za nią wokół Anszanu. Księga Rodzaju wymienia Elama jako pierwszego wśród synów Sema, lecz język elamicki nie jest spokrewniony z żadnym innym znanym językiem, a Elamici byli sąsiadami i rywalami Sumeru i Babilonu od końca IV tysiąclecia p.n.e. Elamicki najazd zakończył dynastię z Ur około 2004 r. p.n.e., a około 1158 r. p.n.e. Szutruk-Nachunte uwiózł do Suzy stelę zwycięstwa Naram-Sina i stelę praw Hammurabiego, gdzie odnaleźli je francuscy archeolodzy w 1898 i 1901–1902 r. Księga Rodzaju wymienia „Chodorlahomera, króla Elamskiego” jako wodza czterech królów, którzy uprowadzili Lota; imię jest elamickie w formie, lecz żaden taki król nie jest znany ze źródeł elamickich."
    - "W epoce asyryjskiej Elam wspierał buntowników Babilonu, aż Aszurbanipal zniszczył Suzę około 646 r. p.n.e., chełpiąc się, że uniósł jej bogów i rozsypał sól po okręgach Elamu. Wyrocznia Jeremiasza, wygłoszona „na początku królowania Sedekijasza”, zapowiedziała w imieniu Pana: „złamię łuk Elamczyków”; że rozproszy jego lud na cztery wiatry; że „postawię stolicę moję między Elamczykami”; lecz „w ostateczne dni” przywróci jego jeńców; Ezechiel widzi „Elam i wszystka zgraja jego” wśród poległych w dole, a Izajasz przedstawia jego łuczników w wojsku przeciw Judzie: „Elam też wziął sajdak”. Persowie, którzy osiedlili się w Anszanie, przejęli dawny kraj, a Cyrus nazywał siebie królem Anszanu; okrzyk Izajasza „Przyciągnijże, Elamie! Oblęż, Medzie!” odnosi się zwykle do upadku Babilonu w 539 r. p.n.e."
    - "Pod Persami Suza była rezydencją królewską, a elamicki jednym z trzech języków inskrypcji behistuńskiej i rachunków pałacowych. Daniel ujrzał swoją wizję barana i kozła „w Susan, mieście głównem, które było w krainie Elam”, nad rzeką Ulaj, a opowieść o Esterze rozgrywa się w Suzie. Elamici i Suzanchici są wśród ludów osiedlonych w Samarii, które pisały przeciw Jerozolimie za Artakserksesa, Izajasz zalicza Elam wśród krain, z których powróci reszta, a „Elamici” są trzecim narodem wymienionym wśród tych, którzy słyszeli apostołów w Pięćdziesiątnicę."
    - "Dziś nizinny Elam to irańska prowincja Chuzestan. Wzgórza Suzy z Apadaną Dariusza i zigurat Czoga Zanbil, zbudowany przez Untasz-Napiriszię w XIII w. p.n.e., są na liście UNESCO; grób Daniela czci się w Szusz; a pola naftowe Ahwazu i Abadanu uczyniły z równiny pole bitwy wojny iracko-irańskiej z lat 1980–88."
  nl:
    - "Elam is het land ten oosten van de benedenloop van de Tigris: de hete vlakte van Susa, het huidige Khuzestan in zuidwest-Iran, en het Zagrosgebergte erachter rond Anshan. Genesis noemt Elam het eerst onder de zonen van Sem, maar de Elamitische taal is aan geen andere bekende taal verwant, en de Elamieten waren sinds het late vierde millennium v.Chr. buren en rivalen van Sumer en Babylon. Een Elamitische inval maakte omstreeks 2004 v.Chr. een einde aan de dynastie van Ur, en omstreeks 1158 v.Chr. voerde Shutruk-Nahhunte de overwinningsstèle van Naram-Sin en de stèle van Hammurabi's wetten naar Susa, waar Franse opgravers ze in 1898 en 1901–02 vonden. Genesis noemt “Kedor-Laomer, den koning van Elam” als leider van de vier koningen die Lot gevangennamen; de naam is Elamitisch van vorm, maar zo'n koning is uit Elamitische bronnen niet bekend."
    - "In de Assyrische tijd steunde Elam de opstandelingen van Babylon totdat Assurbanipal omstreeks 646 v.Chr. Susa verwoestte en pochte dat hij zijn goden had weggevoerd en zout over de districten van Elam had gestrooid. Jeremia's orakel, “in het begin des koninkrijks van Zedekia”, voorzei dat de HEER “Elams boog” zou verbreken, zijn volk naar de vier winden zou verstrooien en “Mijn troon in Elam stellen”, maar “in het laatste der dagen” zijn gevangenis zou wenden; Ezechiël ziet “Elam met haar ganse menigte” onder de verslagenen in de kuil, en Jesaja schildert zijn boogschutters in het leger tegen Juda: “Elam heeft den pijlkoker genomen”. De Perzen, die zich in Anshan hadden gevestigd, namen het oude land over, en Cyrus noemde zich koning van Anshan; Jesaja's roep “trek op, o Elam! beleger ze, o Media!” wordt meestal betrokken op de val van Babylon in 539 v.Chr."
    - "Onder de Perzen was Susa een koninklijke residentie, en het Elamitisch was een van de drie talen van de Behistun-inscriptie en van de paleisboekhouding. Daniël zag zijn visioen van de ram en de bok, toen hij “in den burg Susan was, welke in het landschap Elam is”, aan de rivier Ulai, en Esthers verhaal speelt in Susa. Elamieten en Susanchieten behoren tot de volken die in Samaria werden gevestigd en onder Artaxerxes tegen Jeruzalem schreven, Jesaja rekent Elam tot de landen waaruit het overblijfsel zal terugkeren, en “Elamieten” zijn het derde volk dat wordt genoemd onder hen die de apostelen met Pinksteren hoorden."
    - "Tegenwoordig is het laagland van Elam de Iraanse provincie Khuzestan. De heuvels van Susa, met de Apadana van Darius, en de ziggoerat van Chogha Zanbil, in de dertiende eeuw v.Chr. gebouwd door Untash-Napirisha, staan op de UNESCO-lijst; een graf van Daniël wordt vereerd te Shush; en de olievelden van Ahvaz en Abadan maakten de vlakte tot slagveld van de Iraaks-Iraanse oorlog van 1980–88."
  cs:
    - "Élam je země východně od dolního Tigridu: horká pláň Sus, dnešní Chúzestán v jihozápadním Íránu, a zagroské vysočiny za ní kolem Anšanu. Genesis uvádí Élam jako prvního mezi syny Šémovými, ale elamština není příbuzná žádnému jinému známému jazyku a Élamité byli sousedy a soupeři Sumeru a Babylóna od konce 4. tisíciletí př. n. l. Elamský nájezd ukončil kolem roku 2004 př. n. l. dynastii z Uru a kolem roku 1158 př. n. l. odvezl Šutruk-Nachunte do Sus vítěznou stélu Naram-Sina a stélu Chammurapiho zákonů, kde je francouzští vykopávači nalezli v letech 1898 a 1901–02. Genesis jmenuje „Chedorlaomer král Elamitský“ jako vůdce čtyř králů, kteří zajali Lota; jméno je podle formy elamské, ale žádný takový král není z elamských záznamů znám."
    - "V asyrské době podporoval Élam babylónské rebely, dokud Aššurbanipal kolem roku 646 př. n. l. nezničil Sus a nechlubil se, že odvlekl jeho bohy a rozsypal sůl po krajích Élamu. Jeremjášova věštba, „na počátku kralování Sedechiáše krále Judského“, předpověděla, že Hospodin „polámi lučiště Elamitských“, rozptýlí jejich lid do čtyř větrů a „postavím stolici svou mezi Elamitskými“, a přece „v posledních dnech“ přivede zpět jejich zajaté; Ezechiel vidí „Elam i všecko množství jeho“ mezi zabitými v jámě a Izajáš vykresluje jeho lučištníky ve vojsku proti Judsku: „Elam pochytil toul s vozy lidu vojenského“. Peršané, kteří se usadili v Anšanu, převzali starou zemi a Kýros se nazýval králem Anšanu; Izajášův výkřik „Přitáhniž Elame, Médský oblehni“ se obvykle vztahuje k pádu Babylóna roku 539 př. n. l."
    - "Za Peršanů byly Sus královskou rezidencí a elamština jedním ze tří jazyků nápisu z Bisotúnu a paláceových účtů. Daniel viděl své vidění berana a kozla „v Susan, na hradě, kterýž jest v krajině Elam“ u potoka Ulai a příběh Ester se odehrává v Susách. Élamité a Susanchejci jsou mezi národy usazenými v Samaří, kteří psali proti Jeruzalému za Artaxerxa; Izajáš počítá Élam mezi země, odkud se ostatek vrátí, a „Elamitští“ jsou třetím národem jmenovaným mezi těmi, kdo slyšeli apoštoly o Letnicích."
    - "Dnes je élamská nížina íránská provincie Chúzestán. Pahorky Sus s Dareiovou apadánou a zikkurat Chogha Zanbil, postavený Untaš-Napirišou ve 13. století př. n. l., jsou na seznamu UNESCO; Danielova hrobka je uctívána v Shush; a ropná pole Ahvázu a Ábádánu učinila z pláně bojiště íránsko-irácké války v letech 1980–88."
  sv:
    - "Elam är landet öster om nedre Tigris: Susas heta slätt, dagens Khuzestan i sydvästra Iran, och Zagrosbergen bakom den kring Anshan. Första Mosebok förtecknar Elam först bland Sems söner, men elamitiskan är besläktad med inget annat känt språk, och elamiterna var grannar och rivaler till Sumer och Babylon från senare delen av fjärde årtusendet f.Kr. Ett elamitiskt plundringståg gjorde slut på Urs dynasti omkring 2004 f.Kr., och omkring 1158 f.Kr. förde Shutruk-Nahhunte Naram-Sins segerstele och stelen med Hammurabis lagar till Susa, där franska utgrävare fann dem 1898 och 1901–02. Första Mosebok nämner ”Kedorlaomer, konungen i Elam” som ledare för de fyra kungarna som tog Lot till fånga; namnet är elamitiskt till formen, men ingen sådan kung är känd från elamitiska källor."
    - "Under assyrisk tid stödde Elam Babylons upprorsmän tills Assurbanipal förstörde Susa omkring 646 f.Kr. och skröt med att han hade fört bort dess gudar och strött salt över Elams distrikt. Jeremias utsaga, given ”i begynnelsen av Sidkias, Juda konungs, regering”, förutsade att HERREN skulle ”bryta sönder Elams båge”, förströ dess folk åt fyra väderstreck och ”sätta upp min tron i Elam”, men ”i kommande dagar” upprätta Elam på nytt; Hesekiel ser ”Elam med hela sin larmande hop” bland de slagna i graven, och Jesaja målar dess bågskyttar i hären mot Juda: ”Elam hade fattat kogret”. Perserna, som bosatt sig i Anshan, tog det gamla landet över, och Kyros kallade sig kung av Anshan; Jesajas rop ”Drag upp, du Elam! Träng på, du Mediens folk!” läses vanligen om Babylons fall 539 f.Kr."
    - "Under perserna var Susa kunglig residensstad, och elamitiska ett av de tre språken i Behistuninskriften och i palatsets räkenskaper. Daniel såg sin syn om vädern och bocken ”i Susans borg i hövdingdömet Elam” vid floden Ulai, och Esters berättelse utspelas i Susa. Elamiter och susaniter finns bland de folk, bosatta i Samaria, som skrev mot Jerusalem under Artaxerxes, Jesaja räknar Elam bland länderna varifrån kvarlevan skall återvända, och ”elamiter” är det tredje folket som nämns bland dem som hörde apostlarna vid pingsten."
    - "I dag är Elams lågland den iranska provinsen Khuzestan. Susas kullar, med Dareios Apadana, och zigguraten Chogha Zanbil, byggd av Untash-Napirisha på 1200-talet f.Kr., finns på Unescos lista; en grav åt Daniel vördas i Shush; och oljefälten i Ahvaz och Abadan gjorde slätten till slagfält under Iran–Irak-kriget 1980–88."
  nb:
    - "Elam er landet øst for nedre Tigris: den varme sletten ved Susa, dagens Khuzestan i sørvestlige Iran, og Zagros-høylandet bak den rundt Anshan. 1. Mosebok fører Elam først opp blant Sems sønner, men det elamittiske språket er i slekt med ingen annen kjent tunge, og elamittene var naboer og rivaler av Sumer og Babylon fra slutten av det fjerde årtusen f.Kr. Et elamittisk togt gjorde slutt på dynastiet i Ur omkring 2004 f.Kr., og omkring 1158 f.Kr. førte Shutruk-Nahhunte seiersstelen til Naram-Sin og stelen med Hammurabis lover til Susa, der franske utgravere fant dem i 1898 og 1901–02. 1. Mosebok nevner «Kedorlaomer, kongen i Elam» som leder for de fire kongene som tok Lot til fange; navnet er elamittisk i form, men ingen slik konge er kjent fra elamittiske kilder."
    - "I den assyriske tiden støttet Elam opprørerne i Babylon til Assurbanipal ødela Susa omkring 646 f.Kr., og skrøt av at han hadde ført bort dets guder og strødd salt over Elams distrikter. Jeremias orakel, «i begynnelsen av Judas konge Sedekias' regjering», forutsa at Herren ville «knekke Elams bue», spre folket for de fire vinder og «sette min trone i Elam», men «i de siste dager» føre dets fangenskap til ende; Esekiel ser «Elam og hele hans larmende hop» blant de drepte i graven, og Jesaja skildrer dets bueskyttere i hæren mot Juda: «Elam bærer kogger». Perserne, som hadde bosatt seg i Anshan, overtok det gamle landet, og Kyros kalte seg konge av Anshan; Jesajas rop «Dra op, Elam! Treng på, Media!» leses vanligvis om Babylons fall i 539 f.Kr."
    - "Under perserne var Susa en kongelig residens, og elamittisk var ett av de tre språkene i Behistun-innskriften og i palassregnskapene. Daniel fikk sitt syn om væren og bukken «i borgen Susan i landskapet Elam» ved elven Ulai, og Esters fortelling er lagt til Susa. Elamitter og susankitter er blant folkene som var bosatt i Samaria og som skrev mot Jerusalem under Artaxerxes, Jesaja regner Elam blant landene som levningen skal vende tilbake fra, og «elamitter» er den tredje nasjonen som nevnes blant dem som hørte apostlene ved pinse."
    - "I dag er lavlandet Elam den iranske provinsen Khuzestan. Haugene i Susa, med Dareios' apadana, og ziguratten i Chogha Zanbil, bygd av Untash-Napirisha på 1200-tallet f.Kr., står på UNESCO-listen; en Daniel-grav æres i Shush; og oljefeltene i Ahvaz og Abadan gjorde sletten til slagmark i Iran–Irak-krigen 1980–88."
  tl:
    - "Ang Elam ay ang lupain sa silangan ng ibabang Tigris: ang mainit na kapatagan ng Susan, ang Khuzestan ngayon sa timog-kanlurang Iran, at ang mataas na lupain ng Zagros sa likod nito sa palibot ng Anshan. Inililista ng Genesis ang Elam na una sa mga anak ni Sem, ngunit walang kilalang wikang kaugnay ng wikang Elamita, at mga kapitbahay at karibal ng Sumer at Babilonia ang mga Elamita mula sa huling ika-4 na milenyo BK. Tinapos ng isang pagsalakay ng mga Elamita ang dinastiya ng Ur noong mga 2004 BK, at noong mga 1158 BK dinala ni Shutruk-Nahhunte sa Susan ang estela ng tagumpay ni Naram-Sin at ang estela ng mga batas ni Hammurabi, na natagpuan ng mga Pranses noong 1898 at 1901–02. Pinangangalanan ng Genesis si “Chedorlaomer hari sa Elam” bilang pinuno ng apat na haring bumihag kay Lot; Elamita ang anyo ng pangalan, ngunit walang gayong hari sa mga talaang Elamita."
    - "Sa panahon ng Asiria, kinampihan ng Elam ang mga rebelde ng Babilonia hanggang wasakin ni Ashurbanipal ang Susan noong mga 646 BK, na ipinagmalaki ang pagkuha sa mga diyos nito at paghahasik ng asin sa Elam. Inihula ng orakulo ni Jeremias, “sa pagpapasimula ng paghahari ni Sedechias na hari sa Juda”: “aking babaliin ang busog ng Elam”, ikakalat ang mga tao nito sa apat na hangin, “aking ilalagay ang aking luklukan sa Elam”, ngunit “sa mga huling araw” ay ibabalik ang pagkabihag nito; nakikita ni Ezekiel “ang Elam at ang buo niyang karamihan” sa mga napatay sa hukay, at ni Isaias ang mga mamamana nito laban sa Juda: “ang Elam ay may dalang lalagyan ng pana”. Pumalit ang mga Persiano mula sa Anshan, at hari ng Anshan ang tawag ni Ciro sa sarili; ang sigaw ni Isaias na “Umahon ka, Oh Elam; kumubkob ka, Oh Media” ay karaniwang binabasa bilang tungkol sa pagbagsak ng Babilonia noong 539 BK."
    - "Sa ilalim ng mga Persiano, tirahang maharlika ang Susan, at ang Elamita ay isa sa tatlong wika ng inskripsiyon sa Behistun at ng mga talaan ng palasyo. Nakita ni Daniel ang kaniyang pangitain ng tupa at kambing na lalaki “nasa Susan ako na palacio, na nasa lalawigan ng Elam” sa tabi ng ilog Ulai, at nakatakda sa Susan ang kuwento ni Esther. Ang mga Elamita at Susanchita ay kabilang sa mga bayang pinatira sa Samaria na sumulat laban sa Jerusalem sa ilalim ni Artajerjes, ibinibilang ni Isaias ang Elam sa mga lupaing pagbabalikan ng nalabi, at ang “mga Elamita” ang ikatlong bansang pinangalanan sa mga nakarinig sa mga apostol sa Pentecostes."
    - "Ang mababang lupain ng Elam ay ang lalawigan ng Khuzestan sa Iran ngayon. Nasa listahan ng UNESCO ang mga tel ng Susan, kasama ang Apadana ni Dario, at ang ziggurat ng Chogha Zanbil, na itinayo ni Untash-Napirisha noong ika-13 siglo BK; iginagalang sa Shush ang isang libingan ni Daniel; at ginawa ng mga larangan ng langis ng Ahvaz at Abadan na larangan ng labanan ang kapatagan sa digmaang Iran–Iraq noong 1980–88."
  da:
    - "Elam er landet øst for den nedre Tigris: Susas hede slette, nutidens Khuzestan i det sydvestlige Iran, og Zagros-højlandet bagved omkring Anshan. 1 Mosebog opregner Elam først blandt Sems sønner, men det elamitiske sprog er ikke i familie med noget andet kendt tungemål, og elamitterne var naboer og rivaler til Sumer og Babylon fra slutningen af 4. årtusinde f.Kr. Et elamitisk togt gjorde ende på Urs dynasti omkring 2004 f.Kr., og omkring 1158 f.Kr. førte Shutruk-Nahhunte Naram-Sins sejrsstele og stelen med Hammurabis love til Susa, hvor franske udgravere fandt dem i 1898 og 1901–02. 1 Mosebog nævner »Kedorlaomer Konge i Elam« som leder af de fire konger, der tog Lot til fange; navnet er elamitisk i formen, men ingen sådan konge kendes fra elamitiske optegnelser."
    - "I den assyriske tid støttede Elam Babylons oprørere, indtil Assurbanipal ødelagde Susa omkring 646 f.Kr. og pralede med, at han havde ført dets guder bort og strøet salt over Elams distrikter. Jeremias' orakel, »i Begyndelsen af Judas Konge Zedekias's Regering«, forudsagde Herrens ord: »jeg sønderbryder Elams Bue«; han ville sprede dets folk for de fire vinde og »sætte min Trone i Elam«, men »i de sidste Dage« føre dets fangenskab tilbage; Ezekiel ser »Elam og al dets Hob« blandt de dræbte i graven, og Esajas forestiller sig dets bueskytter i hæren mod Juda: »Elam bar Kogger«. Perserne, der havde bosat sig i Anshan, overtog det gamle land, og Kyros kaldte sig konge af Anshan; Esajas' råb »drag op, Elam! træng paa Madaj!« læses sædvanligvis om Babylons fald i 539 f.Kr."
    - "Under perserne var Susa kongelig residens, og elamitisk var ét af de tre sprog i Behistun-indskriften og i palads-regnskaberne. Daniel så sit syn om væderen og gedebukken »i Borgen Susan, i Landskabet Elam« ved floden Ulaj, og Esters fortælling er lagt til Susa. Elamitter og susankitter er blandt de folk, der blev bosat i Samaria og skrev imod Jerusalem under Artaxerxes, Esajas tæller Elam blandt de lande, hvorfra resten skal vende tilbage, og »Elamiter« er det tredje folk, der nævnes blandt dem, som hørte apostlene til pinse."
    - "I dag er Elams lavland den iranske provins Khuzestan. Susas høje, med Darius' Apadana, og ziggurratten i Chogha Zanbil, bygget af Untash-Napirisha i 1200-tallet f.Kr., står på UNESCO-listen; en grav for Daniel æres i Shush; og olieområderne ved Ahvaz og Abadan gjorde sletten til slagmark i krigen mellem Iran og Irak 1980–88."
  sr:
    - "Елам је земља источно од доњег Тигра: врела равница Сусе, данашњи Хузестан у југозападном Ирану, и загрошка висораван иза ње око Аншана. Постање набраја Елама први међу синовима Симовим, али еламски језик није у сродству ни с једним другим познатим језиком, а Еламци су били суседи и супарници Сумера и Вавилона од касног 4. миленијума п. н. е. Еламски напад окончао је династију Ура око 2004. п. н. е., а око 1158. п. н. е. Шутрук-Нахунте однео је победничку стелу Нарам-Сина и стелу Хамурапијевих закона у Сусу, где су их француски ископавачи нашли 1898. и 1901–02. Постање именује „Ходологомор цар еламски“ као вођу четири цара који су заробили Лота; име је по облику еламско, али ниједан такав краљ није познат из еламских записа."
    - "У асирско доба Елам је подржавао побуњенике Вавилона док Ашурбанипал није разорио Сусу око 646. п. н. е., хвалећи се да је однео њене богове и посуо со по областима Елама. Јеремијино пророчанство, „у почетку царовања Седекије цара Јудиног“, најавило је да ће Господ „сломити лук Еламу“, расејати његов народ на четири ветра и рећи: „наместићу престо свој у Еламу“, а „у последње време“ вратити његово ропство; Језекиљ види „Елам и све мноштво његово“ међу побијенима у јами, а Исаија слика његове стрелце у војсци против Јуде: „И Елам узе Тул“. Персијанци, који су се населили у Аншану, преузели су стару земљу, и Кир се називао краљем Аншана; Исаијин узвик „ходи, Еламе; опколи, Мидијо!“ обично се чита о паду Вавилона 539. п. н. е."
    - "Под Персијанцима Суса је била краљевска резиденција, а еламски један од три језика Бехистунског натписа и палатских рачуна. Данило је имао своје виђење овна и јарца „у Сусану у граду који је у земљи Еламу“ на реци Улај, а Јестирина прича смештена је у Сусу. Еламци и Сусанашани су међу народима насељеним у Самарији који су писали против Јерусалима под Артаксерксом, Исаија убраја Елам међу земље из којих ће се остатак вратити, а „Еламци“ су трећи народ наведен међу онима који су чули апостоле на Педесетници."
    - "Данас је низија Елама иранска покрајина Хузестан. Хумке Сусе, са Даријевом Ападаном, и зикурат Чога Занбил, који је у 13. веку п. н. е. саградио Унташ-Напириша, налазе се на Унесковој листи; Данилова гробница поштује се у Шушу; а нафтна поља Ахваза и Абадана учинила су равницу бојиштем иранско-ирачког рата 1980–88."
  hu:
    - "Élám az alsó Tigristől keletre fekvő föld: Susán forró síksága, a mai délnyugat-iráni Huzesztán, és mögötte a Zagrosz-hegység Anzan körüli fennsíkja. Mózes első könyve Élámot Szém fiai között említi először, de az elámi nyelv nincs rokonságban más ismert nyelvvel, és az elámiak a Kr. e. 4. évezred végétől Sumer és Babilon szomszédai és vetélytársai voltak. Egy elámi támadás vetett véget Ur dinasztiájának Kr. e. 2004 körül, és Kr. e. 1158 körül Sutruk-Nahhunte elvitte Susánba az akkádi Naram-Szín győzelmi sztéléjét és Hammurapi törvényeinek sztéléjét, ahol a francia ásatók 1898-ban és 1901–02-ben megtalálták őket. Mózes első könyve Khédorlaomert, a Lótot fogságba ejtő négy király vezérét „Élám királyának” nevezi; a név alakja elámi, de ilyen királyt elámi feljegyzésekből nem ismerünk."
    - "Az asszír korban Élám a babiloni lázadókat támogatta, amíg Assurbanipal Kr. e. 646 körül le nem rombolta Susánt, azzal kérkedve, hogy elvitte isteneit és sót szórt Élám körzeteire. Jeremiás jövendölése, amely „Sedékiásnak, a Júda királyának országlása kezdetén” hangzott el, az Úr szavával így szól: „eltöröm az Elám kézívét”, népét az égnek négy szelére szórja, és „az én székemet Elámba helyezem”, mégis „végezetre visszahozom Elámot a fogságból”; Ezékiel a gödörben megölt népek között látja: „Itt van Elám és egész sokasága”, Ézsaiás pedig íjászait a Júda elleni seregben ábrázolja: „Élám fölvette a tegezt”. A perzsák, akik Anzanban telepedtek meg, átvették a régi földet, és Círusz Anzan királyának nevezte magát; Ézsaiás felkiáltását, „Jőjj fel Élám, szálld meg Madai”, rendszerint Babilon Kr. e. 539-es eleste kapcsán olvassák."
    - "A perzsák alatt Susán királyi rezidencia volt, és az elámi nyelv a behisztuni felirat három nyelvének egyike és a palotai számadásoké. Dániel az Ulai folyó mellett látta a kos és a bak látomását, „Susán várában voltam, a mely Elám tartományában van”, és Eszter története Susánban játszódik. Elámiak és susánkeusok a Szamáriában megtelepített népek között voltak, akik Artaxerxész alatt Jeruzsálem ellen írtak, Ézsaiás Élámot azok közé az országok közé sorolja, ahonnan a maradék hazatér, és „elámiták” a harmadik nemzet azok között, akik a pünkösdkor hallották az apostolokat."
    - "Élám alföldje ma Huzesztán iráni tartomány. Susán halmai a Dárius-féle Apadánával és a Csogha Zanbil zikkurat, amelyet Untas-Napirisa épített a Kr. e. 13. században, az UNESCO listáján vannak; Dániel sírját tisztelik Shushban; az ahvázi és abadáni olajmezők pedig a síkságot az 1980–88-as iráni–iraki háború csatamezejévé tették."
  fi:
    - "Elam on Tigrisin alajuoksun itäpuolinen maa: Susan kuuma tasanko, nykyinen Khuzestan Lounais-Iranissa, ja sen takana Anshanin ympärillä olevat Zagrosin ylängöt. 1. Mooseksen kirja luettelee Elamin ensimmäisenä Semin pojista, mutta elamin kieli ei liity mihinkään muuhun tunnettuun kieleen, ja elamilaiset olivat Sumerin ja Babylonin naapureita ja kilpailijoita neljännen vuosituhannen lopulta eaa. Elamilainen hyökkäys päätti Urin dynastian noin vuonna 2004 eaa., ja noin 1158 eaa. Shutruk-Nahhunte vei Naram-Sinin voittosteelan ja Hammurabin lakisteelan Susaan, missä ranskalaiset kaivajat löysivät ne vuosina 1898 ja 1901–1902. 1. Mooseksen kirja nimeää ”Kedorlaomer Eelamin kuninkaana” neljän Lootin vangiksi ottaneen kuninkaan johtajaksi; nimi on muodoltaan elamilainen, mutta tällaista kuningasta ei tunneta elamilaisista lähteistä."
    - "Assyrian aikana Elam tuki Babylonin kapinallisia, kunnes Assurbanipal tuhosi Susan noin vuonna 646 eaa., kerskuen vieneensä sen jumalat ja levittäneensä suolaa Elamin alueille. Jeremian ennustus ”Sidkian hallituksen alussa” julisti: ”minä murran Eelamin jousen”, hajotti sen kansan neljälle tuulelle ja ”asetan valtaistuimeni Eelamiin”, mutta ”aikojen lopulla minä käännän Eelamin kohtalon”; Hesekiel näkee kuopassa surmattujen joukossa Eelamin ja ”koko hänen meluisa joukkonsa”, ja Jesaja kuvaa sen jousimiehiä Juudaa vastaan marssivassa armeijassa: ”Eelam nosti viinen”. Persialaiset, jotka olivat asettuneet Anshaniin, ottivat vanhan maan haltuunsa, ja Kyyros kutsui itseään Anshanin kuninkaaksi; Jesajan huuto ”Hyökkää, Eelam! Piiritä, Meedia!” luetaan yleensä Babylonin kukistumisesta vuonna 539 eaa."
    - "Persialaisten aikana Susa oli kuninkaallinen asuinpaikka, ja elamin kieli oli yksi Behistunin kirjoituksen ja palatsin tilien kolmesta kielestä. Daniel näki näkynsä oinaasta ja pukista ”Suusanin linnassa, Eelamin maakunnassa” Uulai-joen rannalla, ja Esterin kertomus sijoittuu Susaan. Elamilaiset ja suusanilaiset ovat Samariaan asutettujen kansojen joukossa, jotka kirjoittivat Jerusalemia vastaan Artahsastan aikana, Jesaja lukee Elamin niiden maiden joukkoon, joista jäännös palaa, ja ”elamilaiset” ovat kolmas kansa, joka mainitaan helluntaina apostoleja kuulleiden joukossa."
    - "Nykyisin Elamin alanko on Iranin Khuzestanin maakunta. Susan kumpareet Dareioksen Apadanoineen ja Untash-Napirishan 1200-luvulla eaa. rakentama Chogha Zanbilin ziggurat ovat UNESCOn luettelossa; Danielin hautaa kunnioitetaan Shushissa; ja Ahvazin ja Abadanin öljykentät tekivät tasangosta Iranin ja Irakin sodan 1980–88 taistelukentän."
  vi:
    - "Ê-lam là xứ phía đông hạ lưu Sông Hi-đê-ke: đồng bằng nóng của Su-xơ, nay là Khuzestan ở tây nam Iran, và cao nguyên Zagros phía sau quanh Anshan. Sách Sáng thế ký liệt kê Ê-lam đầu tiên trong số các con của Sem, nhưng tiếng Elam không liên quan đến thứ tiếng nào khác đã biết, và người Elam là láng giềng và đối thủ của Sumer và Ba-by-lôn từ cuối thiên niên kỷ 4 TCN. Một cuộc đột kích của người Elam chấm dứt triều đại Ur khoảng năm 2004 TCN, và khoảng năm 1158 TCN Shutruk-Nahhunte đem bia chiến thắng của Naram-Sin và bia luật của Hammurabi về Su-xơ, nơi các nhà khai quật Pháp tìm thấy chúng năm 1898 và 1901–02. Sách Sáng thế ký nêu tên “Kết-rô-Lao-me, vua Ê-lam” là thủ lĩnh của bốn vua đã bắt Lót làm tù binh; tên mang hình thức Elam, nhưng không biết vua nào như vậy trong các ghi chép Elam."
    - "Vào thời A-si-ri, Ê-lam ủng hộ những kẻ nổi loạn của Ba-by-lôn cho đến khi Ashurbanipal phá hủy Su-xơ khoảng năm 646 TCN, khoe rằng đã đem đi các thần của nó và rải muối trên các vùng của Ê-lam. Lời sấm của Giê-rê-mi, “Lúc Sê-đê-kia vua Giu-đa mới trị vì”, báo trước rằng Đức Giê-hô-va sẽ “bẻ cung của Ê-lam”, làm dân nó tản ra bốn phương gió và “đặt ngai ta trong Ê-lam”, nhưng “trong những ngày sau rốt” sẽ đem phu tù của nó về; Ê-xê-chi-ên thấy “Ê-lam với cả dân sự nó” trong số những người bị giết trong hầm, và Ê-sai hình dung các cung thủ của nó trong đạo quân nghịch cùng Giu-đa: “Ê-lam đeo giỏ tên”. Người Ba Tư, đã định cư ở Anshan, tiếp quản đất cũ, và Si-ru tự xưng là vua Anshan; tiếng kêu của Ê-sai “Hỡi người Ê-lam, hãy lên; Hỡi người Mê-đi, hãy vây đi!” thường được đọc là nói về sự sụp đổ của Ba-by-lôn năm 539 TCN."
    - "Dưới thời Ba Tư, Su-xơ là nơi ở của vua, và tiếng Elam là một trong ba thứ tiếng của bia ký Behistun và của sổ sách cung điện. Đa-ni-ên thấy khải tượng về con chiên đực và con dê đực “tại cung Su-sơ, về tỉnh Ê-lam” bên sông U-lai, và câu chuyện Ê-xơ-tê được đặt ở Su-xơ. Người Elam và người Su-san nằm trong số các dân định cư ở Sa-ma-ri đã viết thư nghịch cùng Giê-ru-sa-lem dưới thời Ạt-ta-xét-xe, Ê-sai kể Ê-lam trong số các xứ mà dân sót sẽ từ đó trở về, và “Ê-la-mít” là dân thứ ba được nêu tên trong những người nghe các sứ đồ ngày Lễ Ngũ Tuần."
    - "Ngày nay vùng đất thấp của Ê-lam là tỉnh Khuzestan của Iran. Các gò Su-xơ, với Apadana của Đa-ri-út, và ziggurat Chogha Zanbil, do Untash-Napirisha xây vào thế kỷ 13 TCN, nằm trong danh sách của UNESCO; một ngôi mộ của Đa-ni-ên được tôn kính tại Shush; và các mỏ dầu Ahvaz và Abadan biến đồng bằng thành chiến trường của cuộc chiến Iran–Iraq 1980–88."
  ro:
    - "Elam este țara de la est de Tigrul de jos: câmpia fierbinte a Susei, azi Khuzestan în sud-vestul Iranului, și înălțimile Zagros din spatele ei, în jurul Anșanului. Geneza îl înșiră pe Elam întâi printre fiii lui Sem, dar limba elamită nu este înrudită cu nicio altă limbă cunoscută, iar elamiții au fost vecini și rivali ai Sumerului și ai Babilonului de la sfârșitul mileniului al IV-lea î.Hr. Un atac elamit a pus capăt dinastiei din Ur pe la 2004 î.Hr., iar pe la 1158 î.Hr. Shutruk-Nahhunte a dus la Susa stela victoriei lui Naram-Sin și stela legilor lui Hammurabi, unde săpători francezi le-au găsit în 1898 și în 1901–02. Geneza îl numește pe „Hodologomor, împăratul Elamului” ca fruntaș al celor patru regi care l-au luat prizonier pe Lot; numele este elamit ca formă, dar niciun asemenea rege nu este cunoscut din înregistrările elamite."
    - "În epoca asiriană, Elamul i-a sprijinit pe răzvrătiții din Babilon, până când Așurbanipal a distrus Susa pe la 646 î.Hr., lăudându-se că i-a dus zeii și a presărat sare peste districtele Elamului. Oracolul lui Ieremia, la începutul domniei lui Zedechia, a prevestit că Domnul va frânge arcul Elamului, va risipi poporul lui la cele patru vânturi și își va pune tronul în Elam, dar în zilele de pe urmă va aduce înapoi robii lui; Ezechiel îl vede pe Elam și toată mulțimea lui printre cei uciși din groapă, iar Isaia își închipuie arcașii lui în oastea împotriva lui Iuda: „Elamitenii au luat tulbe”. Perșii, așezați în Anșan, au preluat vechea țară, iar Cir s-a numit rege al Anșanului; strigătul din Isaia către Elam să se urce și către Media să asedieze este citit de obicei despre căderea Babilonului în 539 î.Hr."
    - "Sub perși, Susa a fost reședință regală, iar elamita a fost una dintre cele trei limbi ale inscripției de la Behistun și ale socotelilor palatului. Daniel și-a avut vedenia berbecului și a țapului, spunând: „eram în Susa cetatea cea împărătească, care este în țara Elamului”, lângă râul Ulai, iar istorisirea Esterei se petrece la Susa. Elamiții și susanchiții se numără printre popoarele așezate în Samaria care au scris împotriva Ierusalimului sub Artaxerxe, Isaia numără Elamul printre țările din care se va întoarce rămășița, iar „Elamitenii” sunt al treilea neam numit printre cei care i-au auzit pe apostoli la Cincizecime."
    - "Astăzi țara joasă a Elamului este provincia iraniană Khuzestan. Movilele Susei, cu Apadana lui Darius, și ziguratul de la Chogha Zanbil, zidit de Untash-Napirisha în secolul al XIII-lea î.Hr., sunt pe lista UNESCO; un mormânt al lui Daniel este venerat la Shush; iar câmpurile petrolifere de la Ahvaz și Abadan au făcut din câmpie un câmp de luptă al războiului Iran–Irak din 1980–88."
  bg:
    - "Елам е земята източно от долното течение на Тигър: горещата равнина на Суза, днешният Хузестан в Югозападен Иран, и планините Загрос зад нея около Аншан. Битие изброява Елам пръв сред синовете на Сим, но еламският език не е сроден с никой друг известен език, а еламитите били съседи и съперници на Шумер и Вавилон от края на IV хил. пр.н.е. Еламски набег сложил край на династията на Ур около 2004 г. пр.н.е., а около 1158 г. пр.н.е. Шутрук-Нахунте отнесъл победната стела на Нарам-Син и стелата със законите на Хамурапи в Суза, където френски разкопвачи ги намерили през 1898 и 1901–1902 г. Битие назовава Кедорлаомер, „царя Еламскаго“, като водач на четиримата царе, които пленили Лот; името е еламско по форма, но такъв цар не е известен от еламските източници."
    - "През асирийската епоха Елам подкрепял бунтовниците на Вавилон, докато Ашурбанипал не разрушил Суза около 646 г. пр.н.е., хвалейки се, че отнесъл боговете ѝ и посипал със сол областите на Елам. Пророчеството на Йеремия, „в началото на царуването на Седекия“, предава думите на Господа: „ще счупя лъка на Елам“; Той ще разпръсне народа му на четирите ветрища — „И ще поставя престола си в Елам“ — но „в последните дни“ ще върне пленението му; Йезекиил вижда: „Там е Елам и всичкото му множество“ сред убитите в рова, а Исаия рисува стрелците му във войската срещу Юда: „Елам взе тула“. Персите, заселили се в Аншан, поели старата земя и Кир се наричал цар на Аншан; викът на Исаия „Възлез, Еламе: обсади, Мидийо“ обикновено се отнася към падането на Вавилон през 539 г. пр.н.е."
    - "При персите Суза била царска резиденция, а еламският — един от трите езика на Бехистунския надпис и на дворцовите сметки. Даниил видял видението си за овена и козела „в Суса столицата, която е в областта Елам“, при реката Улай, а историята на Естир се развива в Суза. Еламци и сузанци са сред народите, заселени в Самария, които писали срещу Йерусалим при Артаксеркс; Исаия брои Елам сред земите, от които остатъкът ще се върне, а „Еламити“ са третият народ, назован сред онези, които чули апостолите на Петдесетница."
    - "Днес низината на Елам е иранската провинция Хузестан. Могилите на Суза с ападаната на Дарий и зикуратът Чога Занбил, построен от Унташ-Напириша през XIII в. пр.н.е., са в списъка на ЮНЕСКО; в Шуш се почита гроб на Даниил, а нефтените полета на Ахваз и Абадан направиха равнината бойно поле във войната между Иран и Ирак през 1980–1988 г."
