body:
  en:
    - "Gederoth, “walls” or “sheepfolds”, was a town of the Shephelah of Judah, listed in Joshua in the district of Lachish and Eglon: “Gederoth, Beth-dagon, and Naamah, and Makkedah; sixteen cities with their villages”. It appears once more in the reign of Ahaz, in the late eighth century BC, when the Philistines “had invaded the cities of the low country, and of the south of Judah, and had taken Beth-shemesh, and Ajalon, and Gederoth, and Shocho”, with Timnah and Gimzo, “and they dwelt there”. That is all the Bible says of it."
    - "Where it stood is unknown. Its company in Joshua points to the western Shephelah, toward Lachish and the coastal plain; the towns of the Chronicles note lie farther north and east, along the Aijalon, Sorek and Elah valleys. Proposals include Tel Agra, Tell el-Meleiha and Khirbet Hamideh, and some take it as the same place as Gederah; the modern town of Gedera, founded in 1884 beside the Arab village of Qatra, was named after the biblical Gederah. None of the sites has produced the name, and the map's point marks a choice, not a finding."
  ru:
    - "Гедероф, «ограды» или «загоны», — город Шефелы Иуды, названный в книге Иисуса Навина в округе Лахиса и Еглона: «Гедероф, Беф-Дагон, Наема и Макед: шестнадцать городов с их селами». Он появляется ещё раз при Ахазе, в конце VIII века до н. э., когда «Филистимляне рассыпались по городам низменного края и юга Иудеи и взяли Вефсамис и Аиалон, и Гедероф и Сохо», а также Фимну и Гимзо, «и поселились там». Это всё, что говорит о нём Библия."
    - "Где он стоял, неизвестно. Соседи по списку Иисуса Навина указывают на западную Шефелу, в сторону Лахиса и приморской равнины; города из заметки Паралипоменона лежат севернее и восточнее, по долинам Аиалона, Сорека и дуба. Предлагали Тель-Агру, Телль-эль-Мелейху и Хирбет-Хамиду, а некоторые считают его тем же местом, что Гедера; современный город Гедера, основанный в 1884 году рядом с арабским селением Катра, назван по библейской Гедере. Ни одно место не дало имени, и точка на карте отмечает выбор, а не находку."
  uk:
    - "Гедерот, «мури» або «кошари», було містом юдейської Шефели, перерахованим у Книзі Ісуса Навина в окрузі Лахіша й Еглона: «Гедерот, Бет-Дагон, Наема, та Македа — шіснайцять міст з їх селами». Воно з’являється ще раз за царювання Ахаза, наприкінці VIII ст. до н. е., коли філістимляни «понабігали були в міста на низинах і в південний край Юдеї і взяли Бетсамис і Аялон, і Гедерот, і Сохо», а з ними Тимну й Гимзо, «та й оселились там». Це все, що Біблія говорить про нього."
    - "Де воно стояло, невідомо. Його сусіди в Книзі Ісуса Навина вказують на західну Шефелу, у бік Лахіша й прибережної рівнини; міста з примітки в Хроніках лежать далі на північ і схід, уздовж долин Аялона, Сорека й Ела. Пропонують Тель-Агра, Телль-ель-Мелейха та Хірбет-Хаміде, а дехто вважає його тим самим місцем, що й Гедера; сучасне місто Гедера, засноване 1884 року біля арабського села Катра, названо на честь біблійної Гедери. Жодне з місць не дало назви, і точка на карті позначає вибір, а не знахідку."
  es:
    - "Gederot, «muros» o «apriscos», era una población de la Sefelá de Judá, enumerada en Josué en el distrito de Laquis y Eglón: «Gederoh, Beth-dagón, y Naama, y Maceda; dieciséis ciudades con sus aldeas». Aparece una vez más en el reinado de Acaz, a fines del siglo VIII a. C., cuando los filisteos «se habían derramado por las ciudades de la llanura, y al mediodía de Judá, y habían tomado á Beth-semes, á Ajalón, Gederoth, y Sochô con sus aldeas», con Timna y Gimzo, «y habitaban en ellas». Eso es todo lo que la Biblia dice de ella."
    - "Dónde estuvo se ignora. Las poblaciones con las que figura en Josué apuntan a la Sefelá occidental, hacia Laquis y la llanura costera; las poblaciones de la nota de Crónicas se hallan más al norte y al este, a lo largo de los valles de Ajalón, Sorek y Ela. Entre las propuestas figuran Tel Agra, Tell el-Meleiha y Khirbet Hamideh, y algunos la toman por el mismo lugar que Gedera; la actual ciudad de Gedera, fundada en 1884 junto a la aldea árabe de Qatra, recibió su nombre de la Gedera bíblica. Ninguno de los sitios ha dado el nombre, y el punto del mapa señala una elección, no un hallazgo."
  pt:
    - "Gederote, “muros” ou “currais de ovelhas”, era uma cidade da Sefelá de Judá, listada em Josué no distrito de Laquis e Eglom: “Gederote, Bete-Dagom, Naamá e Maqueda; dezesseis cidades com as suas aldeias”. Aparece ainda uma vez no reinado de Acaz, no fim do século VIII a.C., quando os filisteus “haviam invadido as cidades da planície e do Sul de Judá, e haviam tomado Bete-Semes, Aijalom, Gederote, Socó com as suas aldeias”, com Timna e Gimzo, “e passaram a habitar ali”. Isso é tudo o que a Bíblia diz dela."
    - "Onde ficava é desconhecido. Os nomes que a cercam em Josué apontam para a Sefelá ocidental, na direção de Laquis e da planície costeira; as cidades da notícia de Crônicas ficam mais ao norte e a leste, ao longo dos vales de Aijalom, Soreque e Elá. As propostas incluem Tel Agra, Tell el-Meleiha e Khirbet Hamideh, e alguns a tomam como o mesmo lugar que Gedera; a cidade moderna de Gedera, fundada em 1884 junto à aldeia árabe de Qatra, recebeu o nome da Gedera bíblica. Nenhum dos sítios produziu o nome, e o ponto do mapa marca uma escolha, não uma descoberta."
  de:
    - "Gederot, „Mauern“ oder „Schafhürden“, war eine Stadt der Schefela Judas, bei Josua im Bezirk von Lachisch und Eglon aufgeführt: „Gederoth, Beth-Dagon, Naema, Makkeda. Das sind sechzehn Städte und ihre Dörfer.“ Noch einmal erscheint es unter Ahas, im späten 8. Jahrhundert v. Chr., als die Philister „in die Städte in der Aue und dem Mittagslande Juda's“ einfielen und „Beth-Semes, Ajalon, Gederoth und Socho“ gewannen, dazu Timna und Gimso, „und wohnten darin“. Mehr sagt die Bibel darüber nicht."
    - "Wo es lag, ist unbekannt. Seine Nachbarschaft bei Josua weist auf die westliche Schefela, Richtung Lachisch und Küstenebene; die Städte der Notiz der Chronik liegen weiter nördlich und östlich, entlang dem Ajalon-, Sorek- und Elatal. Vorgeschlagen werden Tel Agra, Tell el-Meleiha und Chirbet Hamide, und manche halten es für denselben Ort wie Gedera; die heutige Stadt Gedera, 1884 neben dem arabischen Dorf Katra gegründet, wurde nach dem biblischen Gedera benannt. Keine der Stätten hat den Namen geliefert, und der Punkt auf der Karte bezeichnet eine Wahl, keinen Befund."
  fr:
    - "Guedéroth, « murs » ou « parcs à moutons », était une ville de la Shéphéla de Juda, inscrite chez Josué dans le district de Lakis et d’Églon : « Guedéroth, Beth-Dagon, Naama, et Makkéda ; seize villes, et leurs villages ». Elle reparaît sous le règne d’Achaz, à la fin du VIIIe siècle av. J.-C., quand les Philistins « firent une invasion dans les villes de la plaine et du midi de Juda ; ils prirent Beth-Schémesch, Ajalon, Guedéroth, Soco et les villes de son ressort », avec Thimna et Guimzo, « et ils s’y établirent ». C’est tout ce que la Bible en dit."
    - "On ignore où elle se dressait. Son voisinage chez Josué oriente vers la Shéphéla occidentale, du côté de Lakis et de la plaine côtière ; les villes de la notice des Chroniques se trouvent plus au nord et à l’est, le long des vallées d’Ajalon, de Sorek et d’Éla. Parmi les propositions figurent Tel Agra, Tell el-Meleiha et Khirbet Hamideh, et certains y voient le même lieu que Guédéra ; la ville moderne de Gedera, fondée en 1884 près du village arabe de Qatra, a été nommée d’après la Guédéra biblique. Aucun de ces sites n’a livré le nom, et le point de la carte marque un choix, non une découverte."
  pl:
    - "Gederot, „mury” lub „owczarnie”, było miastem judzkiej Szefeli, wymienionym u Jozuego w okręgu Lakisz i Eglon: „Kiederot, Bet Dagon, i Naama, i Maceda, miast szesnaście, i wsi ich”. Pojawia się jeszcze raz za panowania Achaza, pod koniec VIII w. p.n.e., gdy Filistyni „wtargnęli do miast w równinach, i na południe do Judy, a wzięli Betsemes, i Ajalon, i Gaderot, i Sokot i wsi jego”, a także Timna i Gimzo, „a mieszkali w nich”. To wszystko, co Biblia o nim mówi."
    - "Gdzie leżało, nie wiadomo. Sąsiedztwo w Księdze Jozuego wskazuje zachodnią Szefelę, ku Lakisz i nizinie nadmorskiej; miasta z wzmianki w Księgach Kronik leżą dalej na północ i wschód, wzdłuż dolin Ajjalon, Sorek i Ela. Proponowano Tel Agra, Tell el-Meleiha i Chirbet Hamideh, a niektórzy uważają je za to samo miejsce co Gedera; współczesne miasto Gedera, założone w 1884 r. obok arabskiej wsi Katra, nazwano od biblijnej Gedery. Żadne ze stanowisk nie dostarczyło tej nazwy, a punkt na mapie oznacza wybór, nie ustalenie."
  it:
    - "Ghederòt, «mura» od «ovili», era una città della Sefela di Giuda, elencata in Giosuè nel distretto di Lachis ed Eglon: «Ghederoth, Beth-Dagon, Naama e Makkeda: sedici città e i loro villaggi». Compare ancora una volta sotto il regno di Acaz, alla fine dell’VIII secolo a.C., quando i Filistei «aveano invaso le città della pianura e del mezzogiorno di Giuda, e avean preso Beth-Scemesh, Ajalon, Ghederoth, Soco», con Timna e Ghimzo, «e vi s’erano stabiliti». Questo è tutto ciò che la Bibbia ne dice."
    - "Dove sorgesse è ignoto. La compagnia in cui compare in Giosuè rimanda alla Sefela occidentale, verso Lachis e la pianura costiera; le città della nota delle Cronache si trovano più a nord e a est, lungo le valli di Aialon, Sorek ed Ela. Le proposte comprendono Tel Agra, Tell el-Meleiha e Khirbet Hamideh, e alcuni la ritengono lo stesso luogo di Gedera; la città moderna di Gedera, fondata nel 1884 accanto al villaggio arabo di Qatra, prese il nome dalla Gedera biblica. Nessuno di questi siti ha restituito il nome, e il punto della mappa segna una scelta, non un ritrovamento."
  nl:
    - "Gederot, “muren” of “schaapskooien”, was een stad in de Sefela van Juda, die in Jozua wordt genoemd in het district van Lachis en Eglon: “Gederoth, Beth-Dagon, en Naama, en Makkeda; zestien steden en haar dorpen”. Zij komt nog één keer voor, onder Achaz, aan het eind van de 8e eeuw v.Chr., toen de Filistijnen “in de steden der laagte en het zuiden van Juda ingevallen” waren en “hadden ingenomen Beth-Semes, en Ajalon, en Gederoth, en Socho”, met Timna en Gimzo, “en zij woonden aldaar”. Meer zegt de Bijbel er niet over."
    - "Waar het lag, is onbekend. De buurplaatsen in Jozua wijzen op de westelijke Sefela, richting Lachis en de kustvlakte; de steden van de aantekening in Kronieken liggen verder naar het noorden en oosten, langs de dalen van Ajalon, Sorek en Ela. Voorgesteld zijn onder meer Tel Agra, Tell el-Meleiha en Khirbet Hamideh, en sommigen houden het voor dezelfde plaats als Gedera; de moderne stad Gedera, in 1884 gesticht naast het Arabische dorp Qatra, werd naar het bijbelse Gedera genoemd. Geen van deze plaatsen heeft de naam opgeleverd, en het punt op de kaart markeert een keuze, geen bevinding."
  cs:
    - "Gederót, „zdi“ nebo „ovčince“, bylo město judské Šefely, uvedené v Jozue v okrese Lachiše a Eglonu: „Gederot, Betdagon, a Naama, i Maceda, měst šestnáct a vsi jejich“. Objevuje se ještě jednou za vlády Achaze, na konci 8. stol. př. n. l., když Pelištejci „učinili vpád do měst, na rovinách k straně polední Judstva, a vzali Betsemes a Aialon, a Gederot a Socho i vsi jeho“, s Timnou a Gimzem, „a bydlili v nich“. To je vše, co o něm Bible říká."
    - "Kde stálo, není známo. Jeho okolí v Jozue ukazuje na západní Šefelu, k Lachiši a pobřežní rovině; města z poznámky Letopisů leží dále na sever a východ, podél údolí Ajalon, Sorek a Éla. Mezi návrhy jsou Tel Agra, Tell el-Meleiha a Chirbet Hamideh a někteří je pokládají za totéž místo jako Gedera; moderní město Gedera, založené roku 1884 vedle arabské vesnice Qatra, bylo pojmenováno podle biblické Gedery. Žádné z těchto míst jméno nepřineslo a bod na mapě označuje volbu, nikoli nález."
  sv:
    - "Gederot, ”murar” eller ”fårfållor”, var en stad i Judas Shefela, upptagen hos Josua i distriktet kring Lakish och Eglon: ”Gederot, Bet-Dagon, Naama och Mackeda – sexton städer med sina byar”. Den förekommer en gång till under Achas regering, sent på 700-talet f.Kr., då filistéerna ”hade fallit in i städerna i Juda lågland och sydland och hade intagit Bet-Semes, Ajalon och Gederot, så ock Soko”, med Timna och Gimso, ”och hade bosatt sig i dem”. Det är allt Bibeln säger om den."
    - "Var den låg är okänt. Dess omgivning hos Josua pekar på västra Shefela, mot Lakish och kustslätten; städerna i Krönikebokens notis ligger längre norrut och österut, längs Ajalon-, Sorek- och Elas dalar. Förslagen omfattar Tel Agra, Tell el-Meleiha och Khirbet Hamideh, och några tar den för samma plats som Gedera; den moderna staden Gedera, grundad 1884 vid den arabiska byn Qatra, uppkallades efter det bibliska Gedera. Ingen av platserna har gett namnet, och kartans punkt markerar ett val, inte ett fynd."
  nb:
    - "Gederot, «murer» eller «saukveer», var en by i Judas Sjefela, oppført hos Josva i distriktet rundt Lakisj og Eglon: «Gederot, Bet-Dagon og Na'ama og Makkeda - seksten byer med tilhørende landsbyer». Den dukker opp igjen under Ahas, sent på 700-tallet f.Kr., da filistrene «falt inn i byene i Juda, både i lavlandet og i sydlandet, og inntok Bet-Semes og Ajalon og Gederot, likeledes Soko», med Timna og Gimso, «og bosatte sig der». Det er alt Bibelen sier om den."
    - "Hvor den lå, er ukjent. Nabobyene i Josva peker mot den vestlige Sjefela, mot Lakisj og kystsletten; byene i notisen i Krønikebøkene ligger lenger nord og øst, langs dalene Ajalon, Sorek og Ela. Forslagene omfatter Tel Agra, Tell el-Meleiha og Khirbet Hamideh, og noen regner den for det samme stedet som Gedera; den moderne byen Gedera, grunnlagt i 1884 ved siden av den arabiske landsbyen Qatra, ble oppkalt etter bibelens Gedera. Ingen av stedene har gitt navnet, og kartets punkt markerer et valg, ikke et funn."
  tl:
    - "Ang Gederoth, “mga pader” o “mga kulungan ng tupa”, ay isang bayan ng Sephela ng Juda, na itinatala ni Josue sa distrito ng Lachis at Eglon: “Gederoth, at Beth-dagon, at Naama at Maceda: labing anim na bayan pati ng mga nayon ng mga yaon”. Lumilitaw ito muli sa paghahari ni Achaz, sa huling bahagi ng ika-8 siglo BK, nang nilusob ng mga “Filisteo ang mga bayan ng mababang lupain, at ang Timugan ng Juda, at sinakop ang Beth-semes, at ang Ajalon, at ang Gederoth, at ang Socho”, pati ang Timna at Gimzo, “at sila'y nagsitahan doon”. Iyan lamang ang sinasabi ng Biblia tungkol dito."
    - "Hindi alam kung saan ito nakatayo. Ang kasama nito sa Josue ay tumuturo sa kanlurang Sephela, patungong Lachis at kapatagan sa baybayin; ang mga bayan sa tala ng Mga Cronica ay mas hilaga at silangan, sa mga libis ng Ajalon, Sorek at Ela. Kabilang sa mga mungkahi ang Tel Agra, Tell el-Meleiha at Khirbet Hamideh, at itinuturing ng ilan na iisa ito at ang Gedera; ang makabagong bayan ng Gedera, itinatag noong 1884 sa tabi ng nayong Arabe ng Qatra, ay ipinangalan sa Gedera ng Biblia. Wala sa mga lugar ang nagbunga ng pangalan, at ang tuldok ng mapa ay nagmamarka ng isang pagpili, hindi ng isang natuklasan."
  da:
    - "Gederot, »mure« eller »fårefolde«, var en by i Judas Sjefela, opført hos Josva i Lakisj- og Eglon-distriktet: »Gederoth, Beth-Dagon og Naama og Makkeda; seksten Stæder og deres Landsbyer«. Den optræder endnu en gang under Akaz, sent i 700-tallet f.Kr., da filisterne var »faldne ind i Stæderne i Lavlandet og imod Sønden i Juda og havde indtaget Beth-Semes og Ajalon og Gederoth og Soko«, med Timna og Gimzo, »og de boede der«. Det er alt, hvad Bibelen siger om den."
    - "Hvor den lå, er ukendt. Dens naboer i Josvas liste peger mod den vestlige Sjefela, mod Lakisj og kystsletten; byerne i Krønikebogens notits ligger længere mod nord og øst, langs Ajjalon-, Sorek- og Ela-dalene. Forslagene omfatter Tel Agra, Tell el-Meleiha og Khirbet Hamideh, og nogle regner den for det samme sted som det bibelske Gedera; den moderne by Gedera, grundlagt i 1884 ved siden af den arabiske landsby Qatra, blev opkaldt efter det bibelske Gedera. Ingen af stederne har givet navnet, og kortets punkt markerer et valg, ikke et fund."
  sr:
    - "Гедирот, „зидови“ или „торови“, био је град јудејске Сефеле, наведен у Исусу Навину у крају Лахиса и Јеглона: „Гедирот, Вет-Дагон, и Нама и Макида; шеснаест градова са селима својим“. Појављује се још једном, у Ахазово доба, крајем осмог века п. н. е., када су Филистеји „ударише на градове по равни на јужном крају Јудином, и узеше Вет-Семес, и Ејалон и Гедирот и Сохот“, с Тамном и Гимзоном, „и населише се у њима“. То је све што Библија о њему казује."
    - "Где је стајао, непознато је. Његово друштво у Исусу Навину указује на западну Сефелу, према Лахису и приобалној равници; градови из белешке у Летописима леже даље на север и исток, уз долине Ајалона, Сорека и Иле. Предлози обухватају Тел Агру, Тел ел-Мелеиху и Хирбет Хамиду, а неки га узимају за исто место као Гедира; савремени град Гедера, основан 1884. поред арапског села Катра, добио је име по библијској Гедири. Ни једно налазиште није дало име, а тачка на карти означава избор, не налаз."
scripture:
  - Josh.15.37-Josh.15.41
  - 2Chr.28.16-2Chr.28.18
sources:
