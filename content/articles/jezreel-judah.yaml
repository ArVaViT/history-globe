# Overview article (ADR 0007). Mainstream facts only; this is Jezreel of Judah; the site is unknown, and the minority view that Ahinoam came from the northern Jezreel is noted.
id: jezreel-judah
place: ac644e9
title:
  en: "Jezreel in Judah"
  ru: "Изреель в Иудее"
  uk: "Їзреель в Юді"
  es: "Jezreel de Judá"
  pt: "Jezreel em Judá"
  de: "Jesreel in Juda"
  fr: "Jizreel en Juda"
  pl: "Jizreel w Judzie"
  it: "Izreel in Giuda"
  nl: "Jizreël in Juda"
  cs: "Jizreel v Judsku"
  sv: "Jisreel i Juda"
  nb: "Jisreel i Juda"
body:
  en:
    - "There were two Jezreels. The famous one lay in the north, below Mount Gilboa, the royal city of Ahab and Jezebel. This Jezreel was a small town in the hill country of Judah, which Joshua lists in one district with Maon, Carmel, Ziph and Juttah: “And Jezreel, and Jokdeam, and Zanoah”. The name means “God sows”."
    - "The town is remembered for one woman. While David was an outlaw in the wilderness of Judah, besides Abigail of Carmel, “David also took Ahinoam of Jezreel; and they were also both of them his wives”. Ahinoam the Jezreelitess went with him to Gath and to Ziklag, was carried off by the Amalekites and rescued, and came with him to Hebron, where she bore Amnon, David's firstborn. Since Carmel and Maon are her neighbours in the story, nearly all readers take her Jezreel to be this town of Judah, though a few have thought of the northern city."
    - "Nothing more is known of it. The Bible does not mention it again, no ancient writer locates it, and no modern site has been identified with confidence; it must have lain near Carmel and Maon, south of Hebron, in what is now the southern West Bank."
  ru:
    - "Изреелей было два. Знаменитый лежал на севере, под горой Гелвуй, — царский город Ахава и Иезавели. Этот Изреель был небольшим городом в нагорье Иудеи, который книга Иисуса Навина числит в одном округе с Маоном, Кармилом, Зифом и Ютой: «Изреель, Иокдам и Заноах». Имя значит «Бог сеет»."
    - "Город памятен одной женщиной. Пока Давид скрывался в пустыне Иудейской, кроме Авигеи из Кармила: «И Ахиноаму из Изрееля взял Давид, и обе они были его женами». Ахиноама Изреелитянка ушла с ним в Геф и в Секелаг, была уведена Амаликитянами и отбита, пришла с ним в Хеврон и там родила Амнона, первенца Давида. Поскольку её соседи в рассказе — Кармил и Маон, почти все читатели считают её Изреель этим иудейским городом, хотя некоторые думали о северном."
    - "Больше о нём ничего не известно. Библия его не упоминает, ни один древний автор его не помещает, и ни одно современное место не отождествлено с ним уверенно; он должен был лежать близ Кармила и Маона, к югу от Хеврона, на нынешнем юге Западного берега."
  uk:
    - "Було два Їзреелі. Славетний лежав на півночі, під горою Гільбоа, царське місто Ахава й Єзавелі. Цей Їзреель був малим містом у гірській країні Юди, яке Книга Ісуса Навина перелічує в одному окрузі з Маоном, Кармелем, Зіфом і Юттою: «Ізреель, Йокдам і Саноах». Назва означає «Бог сіє»."
    - "Місто пам’ятають через одну жінку. Коли Давид був ізгоєм у Юдейській пустелі, крім Авігеї з Кармеля «Ахиноаму взяв Давид із Езрееля, і були обідві жінками йому». Ахіноама з Їзреелю пішла з ним до Гата й Ціклага, була захоплена амаликитянами й врятована, і прийшла з ним до Хеврона, де народила Амнона, Давидового первістка. Оскільки Кармель і Маон — її сусіди в оповіді, майже всі читачі вважають її Їзреель цим містом Юди, хоча деякі думали про північне місто."
    - "Більше про нього нічого невідомо. Біблія не згадує його знову, жоден давній автор його не локалізує, і жодне сучасне місце не ототожнене з упевненістю; воно мало лежати поблизу Кармеля й Маона, на південь від Хеврона, на теперішньому півдні Західного берега."
  es:
    - "Hubo dos Jezreel. El famoso estaba en el norte, bajo el monte Gilboa, la ciudad real de Acab y Jezabel. Este Jezreel era una pequeña población de la región montañosa de Judá, que Josué enumera en un mismo distrito con Maón, Carmel, Zif y Jutá: «E Izreel, Jocdeam, y Zanoa». El nombre significa «Dios siembra»."
    - "La población se recuerda por una mujer. Mientras David era un proscrito en el desierto de Judá, además de Abigail de Carmel, «También tomó David á Ahinoam de Jezreel, y ambas á dos fueron sus mujeres». Ahinoam la jezreelita lo acompañó a Gat y a Siclag, fue llevada por los amalecitas y rescatada, y vino con él a Hebrón, donde dio a luz a Amnón, el primogénito de David. Como Carmel y Maón son sus vecinas en el relato, casi todos los lectores toman su Jezreel por esta población de Judá, aunque unos pocos han pensado en la ciudad del norte."
    - "No se sabe nada más de ella. La Biblia no la menciona de nuevo, ningún escritor antiguo la localiza, y ningún sitio moderno ha sido identificado con ella con seguridad; debió de hallarse cerca de Carmel y Maón, al sur de Hebrón, en lo que hoy es el sur de Cisjordania."
  pt:
    - "Houve duas Jezreel. A famosa ficava no norte, abaixo do monte Gilboa, a cidade real de Acabe e Jezabel. Esta Jezreel era uma pequena cidade na região montanhosa de Judá, que Josué lista num distrito com Maom, Carmelo, Zife e Jutá: “Jezreel, Jocdeão, Zanoa”. O nome significa “Deus semeia”."
    - "A cidade é lembrada por uma mulher. Enquanto Davi era fora da lei no deserto de Judá, além de Abigail do Carmelo, “Davi também tomou Ainoã, de Jezreel; e ambas se tornaram suas mulheres”. Ainoã, a jezreelita, foi com ele a Gate e Ziclague, foi levada pelos amalequitas e resgatada, e veio com ele a Hebrom, onde deu à luz Amnom, o primogênito de Davi. Como Carmelo e Maom são suas vizinhas na história, quase todos os leitores tomam a Jezreel dela por esta cidade de Judá, embora poucos tenham pensado na cidade do norte."
    - "Nada mais se sabe dela. A Bíblia não a menciona de novo, nenhum escritor antigo a localiza, e nenhum sítio moderno foi identificado com confiança; deve ter ficado perto de Carmelo e Maom, ao sul de Hebrom, no que é hoje o sul da Cisjordânia."
  de:
    - "Es gab zwei Jesreel. Das berühmte lag im Norden, unter dem Gilboa, die Königsstadt Ahabs und Isebels. Dieses Jesreel war eine kleine Stadt im Bergland Judas, die Josua in einem Bezirk mit Maon, Karmel, Sif und Juta aufführt: „Jesreel, Jokdeam, Sanoah“. Der Name bedeutet „Gott sät“."
    - "Die Stadt ist durch eine Frau in Erinnerung. Als David ein Gesetzloser in der Wüste Juda war, nahm er außer Abigajil von Karmel auch Ahinoam: „Auch hatte David Ahinoam von Jesreel genommen; und waren beide seine Weiber.“ Ahinoam, die Jesreelitin, ging mit ihm nach Gat und nach Ziklag, wurde von den Amalekitern verschleppt und gerettet und kam mit ihm nach Hebron, wo sie Amnon gebar, Davids Erstgeborenen. Da Karmel und Maon in der Geschichte ihre Nachbarn sind, halten fast alle Leser ihr Jesreel für diese Stadt Judas, obwohl einige an die nördliche Stadt gedacht haben."
    - "Mehr ist darüber nicht bekannt. Die Bibel erwähnt sie nicht noch einmal, kein antiker Schriftsteller verortet sie, und keine moderne Stätte ist mit Sicherheit identifiziert; sie muss nahe Karmel und Maon südlich von Hebron gelegen haben, im heutigen südlichen Westjordanland."
  fr:
    - "Il y avait deux Jizreel. La célèbre se trouvait dans le nord, au pied du mont Guilboa, ville royale d’Achab et de Jézabel. Celle-ci était une petite ville de la montagne de Juda, que Josué inscrit dans un même district avec Maon, Carmel, Ziph et Jutta : « Jizreel, Jokdeam, Zanoach ». Le nom signifie « Dieu sème »."
    - "La ville est connue par une seule femme. Pendant que David était hors-la-loi dans le désert de Juda, outre Abigaïl de Carmel, « David avait aussi pris Achinoam de Jizreel, et toutes les deux furent ses femmes ». Achinoam la Jizréelite alla avec lui à Gath et à Tsiklag, fut emmenée par les Amalécites puis délivrée, et vint avec lui à Hébron, où elle enfanta Amnon, premier-né de David. Comme Carmel et Maon sont ses voisines dans le récit, presque tous les lecteurs tiennent son Jizreel pour cette ville de Juda, bien que quelques-uns aient songé à la ville du nord."
    - "On ne sait rien de plus. La Bible ne la mentionne plus, aucun auteur antique ne la situe, et aucun site moderne n’a été identifié avec confiance ; elle devait se trouver près de Carmel et de Maon, au sud d’Hébron, dans l’actuel sud de la Cisjordanie."
  pl:
    - "Były dwa Jizreele. Sławny leżał na północy, pod górą Gilboa, miasto królewskie Achaba i Izebel. Ten Jizreel był małym miastem w górach Judy, które Jozue wymienia w jednym okręgu z Maonem, Karmelem, Zifem i Juttą: „I Jezrael, i Jukiedam, i Zanoe”. Nazwa znaczy „Bóg sieje”."
    - "Miasto pamięta się z powodu jednej kobiety. Gdy Dawid był banitą na pustyni Judzkiej, oprócz Abigail z Karmelu: „Ale i Achinoamę wziął Dawid z Jezreel, i były mu te dwie za żony”. Achinoam Jizreelitka poszła z nim do Gat i Siklag, została uprowadzona przez Amalekitów i uratowana, i przyszła z nim do Hebronu, gdzie urodziła Amnona, pierworodnego Dawida. Ponieważ w opowieści jej sąsiadami są Karmel i Maon, niemal wszyscy czytelnicy uważają jej Jizreel za to miasto Judy, choć kilku myślało o mieście północnym."
    - "Nic więcej o nim nie wiadomo. Biblia nie wspomina o nim więcej, żaden starożytny pisarz go nie umieszcza i żadnego współczesnego stanowiska nie utożsamiono z nim z pewnością; musiało leżeć blisko Karmelu i Maon, na południe od Hebronu, w dzisiejszym południowym Zachodnim Brzegu."
  it:
    - "Vi erano due Izreel. La più famosa sorgeva a nord, sotto il Monte Gelboe, la città regia di Acab e Gezabele. Questa Izreel era una piccola città sui monti di Giuda, che Giosuè elenca in un distretto con Maon, Carmelo, Zif e Iutta: «Iizreel, Iokdeam, Zanoah». Il nome significa «Dio semina»."
    - "La città è ricordata per una donna. Mentre Davide era un fuorilegge nel deserto di Giuda, oltre ad Abigail di Carmelo, «Davide sposò anche Ahinoam di Izreel, e ambedue furono sue mogli». Achinoam l’Izreelita andò con lui a Gat e a Siclag, fu portata via dagli Amalechiti e liberata, e venne con lui a Ebron, dove partorì Amnon, il primogenito di Davide. Poiché Carmelo e Maon sono i suoi vicini nel racconto, quasi tutti i lettori intendono la sua Izreel come questa città di Giuda, benché pochi abbiano pensato alla città del nord."
    - "Nulla di più si sa. La Bibbia non la menziona più, nessuno scrittore antico la localizza, e nessun sito moderno è stato identificato con sicurezza; doveva trovarsi presso Carmelo e Maon, a sud di Ebron, in quella che oggi è la Cisgiordania meridionale."
  nl:
    - "Er waren twee Jizreëls. Het beroemde lag in het noorden, onder de Gilboa, de koninklijke stad van Achab en Izebel. Dit Jizreël was een kleine stad in het bergland van Juda, die Jozua in één district noemt met Maön, Karmel, Zif en Juta: “En Jizreel, en Jokdeam, en Zanoah”. De naam betekent “God zaait”."
    - "De stad wordt herinnerd om één vrouw. Terwijl David vogelvrij was in de woestijn van Juda, trouwde hij naast Abigaïl van Karmel nog een vrouw: “Ook nam David Ahinoam van Jizreel; alzo waren ook die beiden hem tot vrouwen”. Achinoam de Jizreëlietische ging met hem naar Gat en Ziklag, werd door de Amalekieten weggevoerd en bevrijd, en kwam met hem naar Hebron, waar zij Amnon baarde, Davids eerstgeborene. Omdat Karmel en Maön in het verhaal haar buren zijn, houden bijna alle lezers haar Jizreël voor deze stad van Juda, al hebben enkelen aan de noordelijke stad gedacht."
    - "Verder is er niets over bekend. De Bijbel noemt haar niet meer, geen oude schrijver plaatst haar, en geen moderne plaats is met zekerheid met haar vereenzelvigd; zij moet bij Karmel en Maön hebben gelegen, ten zuiden van Hebron, in de huidige zuidelijke Westoever."
  cs:
    - "Byly dva Jizreely. Slavný ležel na severu, pod horou Gilboa, královské město Achaba a Jezábel. Tento Jizreel byl malé město v judské pahorkatině, které Jozue uvádí v jednom okrese s Maonem, Karmelem, Zífem a Jutou: „Jezreel a Jukadam, a Zanoe“. Jméno znamená „Bůh rozsévá“."
    - "Město je připomínáno kvůli jediné ženě. Zatímco byl David psancem na judské poušti, kromě Abigajil z Karmelu „Též i Achinoam pojal David z Jezreel, a byly i tyto dvě manželky jeho“. Achinoam Jizreelská šla s ním do Gatu a Siklagu, byla odvlečena Amalechitskými a zachráněna a přišla s ním do Hebronu, kde porodila Amnóna, Davidova prvorozeného. Protože Karmel a Maon jsou v příběhu její sousedé, téměř všichni čtenáři pokládají její Jizreel za toto judské město, ačkoli několik myslelo na severní město."
    - "Nic dalšího o něm není známo. Bible je znovu nezmiňuje, žádný starověký pisatel je nelokalizuje a žádné moderní místo nebylo s jistotou ztotožněno; muselo ležet poblíž Karmelu a Maonu, jižně od Hebronu, v dnešním jižním Západním břehu."
  sv:
    - "Det fanns två Jisreel. Det berömda låg i norr, nedanför Gilboa, Achavs och Isebels kungastad. Detta Jisreel var en liten stad i Judas bergsbygd, som Josua upptar i ett distrikt med Maon, Karmel, Sif och Jutta: ”Jisreel, Jokdeam och Sanoa”. Namnet betyder ”Gud sår”."
    - "Staden är ihågkommen för en kvinna. Medan David var fredlös i Judas öken tog han, förutom Avigajil från Karmel, också ”till hustru Ahinoam från Jisreel, så att dessa båda blevo hans hustrur”. Jisreelitiskan Achinoam följde honom till Gat och Siklag, fördes bort av amalekiterna och räddades, och kom med honom till Hebron, där hon födde Amnon, Davids förstfödde. Eftersom Karmel och Maon är hennes grannar i berättelsen tar nästan alla läsare hennes Jisreel för denna stad i Juda, fast några har tänkt på staden i norr."
    - "Inget mer är känt om den. Bibeln nämner den inte igen, ingen antik författare lokaliserar den, och ingen modern plats har identifierats med säkerhet; den måste ha legat nära Karmel och Maon, söder om Hebron, i dagens södra Västbanken."
  nb:
    - "Det fantes to Jisreel. Den berømte lå i nord, under Gilboa, kongebyen til Akab og Jesabel. Denne Jisreel var en liten by i Judas fjellland, som Josva oppfører i ett distrikt med Maon, Karmel, Sif og Jutta: «og Jisre'el og Jokdeam og Sanoah». Navnet betyr «Gud sår»."
    - "Byen huskes for én kvinne. Mens David var fredløs i Judas ørken, ved siden av Abigajil fra Karmel, «giftet David sig med Akinoam fra Jisre'el og de blev begge hans hustruer». Jisreelkvinnen Ahinoam fulgte ham til Gat og til Siklag, ble ført bort av amalekittene og reddet, og kom med ham til Hebron, der hun fødte Amnon, Davids førstefødte. Siden Karmel og Maon er hennes naboer i fortellingen, tar nesten alle lesere hennes Jisreel for å være denne byen i Juda, selv om noen få har tenkt på byen i nord."
    - "Ingenting mer er kjent om den. Bibelen nevner den ikke igjen, ingen antikk forfatter plasserer den, og ingen moderne lokalitet er identifisert med sikkerhet; den må ha ligget nær Karmel og Maon, sør for Hebron, i det som nå er det sørlige Vestbredden."
