# Overview article (ADR 0007). Mainstream facts only; the record is the Bethlehem of the judge Ibzan; both Bethlehems are given as candidates, Josephus' choice of Judah is noted, and the Galilean one is described.
id: bethlehem-ibzan
place: ab1a343
title:
  en: "Bethlehem of Ibzan"
  ru: "Вифлеем судьи Есевона"
  uk: "Вифлеєм Есевона"
  es: "Belén de Ibzán"
  pt: "Belém de Ibsã"
  de: "Bethlehem des Ibzan"
  fr: "Bethléem d’Ibtsan"
body:
  en:
    - "This Bethlehem is the home of one of the minor judges. “And after him Ibzan of Beth-lehem judged Israel. And he had thirty sons, and thirty daughters, whom he sent abroad, and took in thirty daughters from abroad for his sons. And he judged Israel seven years. Then died Ibzan, and was buried at Beth-lehem.” That is the whole record; the Synodal Bible calls him Esebon."
    - "There were two Bethlehems, and the text does not say which. The famous one is Bethlehem of Judah; the other is the Bethlehem of Zebulun in Joshua's list, in Lower Galilee. Josephus made Ibzan a man of the tribe of Judah and of Bethlehem, and that was long the common reading. Most modern commentators prefer Zebulun, because the book of Judges otherwise calls the southern town “Beth-lehem-judah” when it means it, and because Ibzan stands between Jephthah of Gilead and Elon the Zebulunite in a list of northern judges. The question cannot be settled, and the map shows both."
    - "The Galilean Bethlehem is Beit Lahm, about 10 km north-west of Nazareth, where excavations have found remains from the Iron Age to the Byzantine period, including a church. German Templers founded a colony there in 1906, and since 1948 it has been the moshav Beit Lehem HaGlilit, whose old stone houses survive."
  ru:
    - "Этот Вифлеем — родина одного из малых судей. «После него был судьею Израиля Есевон из Вифлеема. У него было тридцать сыновей, и тридцать дочерей отпустил он из дома в замужество, а тридцать дочерей взял со стороны за сыновей своих, и был судьею Израиля семь лет. И умер Есевон и погребен в Вифлееме». Это вся запись; в еврейском тексте судью зовут Ивцан."
    - "Вифлеемов было два, и текст не говорит, который имеется в виду. Знаменитый — Вифлеем Иудин; другой — Вифлеем Завулона из списка книги Иисуса Навина, в Нижней Галилее. Иосиф Флавий сделал Есевона человеком из колена Иудина и из Вифлеема, и долго это было обычным чтением. Большинство нынешних толкователей предпочитают Завулон, потому что книга Судей в других местах называет южный город Вифлеемом Иудейским, когда имеет в виду его, и потому что Есевон стоит между Иеффаем из Галаада и Елоном Завулонянином в ряду северных судей. Вопрос решить нельзя, и карта показывает оба места."
    - "Галилейский Вифлеем — Бейт-Лахм, примерно в 10 км к северо-западу от Назарета, где раскопки нашли остатки от железного века до византийского времени, включая церковь. Немецкие темплеры основали там колонию в 1906 году, а с 1948 года это мошав Бейт-Лехем-ха-Глилит, где сохранились старые каменные дома."
  uk:
    - "Цей Вифлеєм — батьківщина одного з малих суддів. «Після його був суддею Ізраїля Абезан із Бетлеєму. У сього було трийцять синів, а віддав він трийцятеро дочок на чужу сторону, і привів синам своїм трийцятеро дочок із чужої сторони, й судив Ізраїля сїм год. Потім умер Абезан, і поховано його в Бетлеємі». Це весь запис; Синодальний переклад називає його Есевоном."
    - "Було два Вифлеєми, і текст не каже, який саме. Знаменитий — Вифлеєм Юдин; другий — Вифлеєм Завулонів зі списку Ісуса Навина, в Нижній Галілеї. Йосиф Флавій зробив Есевона людиною з коліна Юди й з Вифлеєму, і довго це було загальноприйнятим прочитанням. Більшість сучасних коментаторів віддає перевагу Завулону, бо в Книзі Суддів південне місто, коли йдеться про нього, інакше зветься «Бетлеєм Юдейський», і бо Есевон стоїть між Єфтаєм Гілеадським і Елоном Завулонянином у переліку північних суддів. Це питання не можна розв'язати, і на мапі показано обидва."
    - "Галілейський Вифлеєм — це Бейт-Лахм, приблизно за 10 км на північний захід від Назарета, де розкопки виявили залишки від залізної доби до візантійського періоду, зокрема церкву. Німецькі темплери заснували тут колонію в 1906 р., а від 1948 р. це мошав Бейт-Лехем ха-Глілит, чиї старі кам'яні будинки збереглися."
  es:
    - "Este Belén es la patria de uno de los jueces menores. «Después de él juzgó á Israel Ibzán de Beth-lehem; el cual tuvo treinta hijos y treinta hijas, las cuales casó fuera, y tomó de fuera treinta hijas para sus hijos: y juzgó á Israel siete años. Y murió Ibzán, y fué sepultado en Beth-lehem.» Ese es todo el registro; la Biblia sinodal lo llama Esebón."
    - "Había dos Beléns, y el texto no dice cuál. El famoso es Belén de Judá; el otro es el Belén de Zabulón de la lista de Josué, en la Baja Galilea. Josefo hizo de Ibzán un hombre de la tribu de Judá y de Belén, y esa fue durante mucho tiempo la lectura común. La mayoría de los comentaristas modernos prefieren Zabulón, porque el libro de los Jueces, cuando se refiere a la ciudad del sur, la llama por lo demás «Beth-lehem de Judá», y porque Ibzán figura entre Jefté de Galaad y Elón el zabulonita en una lista de jueces del norte. La cuestión no puede resolverse, y el mapa muestra ambos."
    - "El Belén galileo es Beit Lahm, a unos 10 km al noroeste de Nazaret, donde las excavaciones han hallado restos que van de la Edad del Hierro al periodo bizantino, entre ellos una iglesia. Los templarios alemanes fundaron allí una colonia en 1906, y desde 1948 es el moshav Beit Lehem HaGlilit, cuyas antiguas casas de piedra se conservan."
  pt:
    - "Esta Belém é a terra de um dos juízes menores. “Depois dele, Ibsã, de Belém, julgou a Israel. Ele teve trinta filhos. Enviou suas trinta filhas para fora do seu clã, e trouxe de fora trinta moças para seus filhos. Ele julgou a Israel por sete anos. Ibsã morreu e foi sepultado em Belém.” Esse é todo o registro; a Bíblia Sinodal o chama de Esebon."
    - "Havia duas Beléns, e o texto não diz qual. A famosa é Belém de Judá; a outra é a Belém de Zebulom na lista de Josué, na Baixa Galileia. Josefo fez de Ibsã um homem da tribo de Judá e de Belém, e essa foi por muito tempo a leitura comum. A maioria dos comentaristas modernos prefere Zebulom, porque o livro de Juízes, quando quer dizer a cidade do sul, a chama “Belém de Judá”, e porque Ibsã aparece entre Jefté de Gileade e Elom, o zebulonita, numa lista de juízes do norte. A questão não pode ser resolvida, e o mapa mostra as duas."
    - "A Belém galileia é Beit Lahm, cerca de 10 km a noroeste de Nazaré, onde as escavações encontraram vestígios da Idade do Ferro ao período bizantino, entre eles uma igreja. Templários alemães fundaram ali uma colônia em 1906, e desde 1948 ela é o moshav Beit Lehem HaGlilit, cujas antigas casas de pedra subsistem."
  de:
    - "Dieses Bethlehem ist die Heimat eines der Kleinen Richter. „Nach diesem richtete Israel Ebzan von Bethlehem. Der hatte dreißig Söhne, und dreißig Töchter gab er hinaus, und dreißig Töchter nahm er von außen seinen Söhnen; er richtete Israel sieben Jahre und starb und ward begraben zu Bethlehem.“ Das ist der ganze Bericht; die Synodalbibel nennt ihn Esebon."
    - "Es gab zwei Orte namens Bethlehem, und der Text sagt nicht, welcher gemeint ist. Das berühmte ist Bethlehem in Juda; das andere ist das Bethlehem Sebulons in der Liste des Buches Josua, in Untergaliläa. Josephus machte Ibzan zu einem Mann aus dem Stamm Juda und aus Bethlehem, und das war lange die übliche Lesart. Die meisten heutigen Ausleger bevorzugen Sebulon, weil das Richterbuch die südliche Stadt sonst „Bethlehem-Juda“ nennt, wenn es sie meint, und weil Ibzan in einer Liste nördlicher Richter zwischen Jeftah von Gilead und Elon dem Sebuloniter steht. Die Frage lässt sich nicht entscheiden, und die Karte zeigt beide."
    - "Das galiläische Bethlehem ist Beit Lahm, etwa 10 km nordwestlich von Nazareth; Ausgrabungen haben dort Reste von der Eisenzeit bis in die byzantinische Zeit gefunden, darunter eine Kirche. Deutsche Templer gründeten dort 1906 eine Kolonie, und seit 1948 ist es der Moschaw Beit Lehem HaGlilit, dessen alte Steinhäuser erhalten sind."
  fr:
    - "Ce Bethléem est la patrie d’un des juges mineurs. « Après lui, Ibtsan de Bethléhem fut juge en Israël. Il eut trente fils, il maria trente filles au-dehors, et il fit venir pour ses fils trente filles du dehors. Il fut juge en Israël pendant sept ans ; puis Ibtsan mourut, et fut enterré à Bethléhem. » C’est tout ce que dit le récit ; la Bible synodale l’appelle Esebon."
    - "Il existait deux Bethléem, et le texte ne dit pas lequel. Le plus célèbre est Bethléem de Juda ; l’autre est le Bethléem de Zabulon dans la liste de Josué, en Basse Galilée. Josèphe fit d’Ibtsan un homme de la tribu de Juda et de Bethléem, ce qui fut longtemps la lecture courante. La plupart des commentateurs modernes préfèrent Zabulon, parce que le livre des Juges appelle d’ordinaire la ville du sud « Bethléhem de Juda » quand il la désigne, et parce qu’Ibtsan figure entre Jephté de Galaad et Élon le Zabulonite dans une liste de juges du nord. La question ne peut être tranchée, et la carte montre les deux."
    - "Le Bethléem de Galilée est Beit Lahm, à environ 10 km au nord-ouest de Nazareth, où les fouilles ont mis au jour des vestiges allant de l’âge du Fer à l’époque byzantine, dont une église. Des Templiers allemands y fondèrent une colonie en 1906, et depuis 1948 c’est le moshav Beit Lehem HaGlilit, dont les anciennes maisons de pierre subsistent."
scripture:
  - Judg.12.8-Judg.12.10
  - Josh.19.15
  - Judg.17.7
