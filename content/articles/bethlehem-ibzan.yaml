# Overview article (ADR 0007). Mainstream facts only; the record is the Bethlehem of the judge Ibzan; both Bethlehems are given as candidates, Josephus' choice of Judah is noted, and the Galilean one is described.
id: bethlehem-ibzan
place: ab1a343
title:
  en: "Bethlehem of Ibzan"
  ru: "Вифлеем судьи Есевона"
  uk: "Вифлеєм Есевона"
  es: "Belén de Ibzán"
  pt: "Belém de Ibsã"
  de: "Bethlehem des Ibzan"
  fr: "Bethléem d’Ibtsan"
  it: "Betlemme di Ibsan"
  pl: "Betlejem Ibsana"
  nl: "Bethlehem van Ibzan"
  cs: "Ibsanův Betlém"
  sv: "Ivsans Betlehem"
  nb: "Ibsans Betlehem"
  tl: "Bethlehem ni Ibzan"
  da: "Ibzans Betlehem"
  sr: "Витлејем Авесанов"
  hu: "Ibcán betlehemje"
  fi: "Ibsanin Betlehem"
  vi: "Bết-lê-hem của Íp-san"
  ro: "Betleemul lui Ibțan"
  bg: "Витлеем на Есевон"
body:
  en:
    - "This Bethlehem is the home of one of the minor judges. “And after him Ibzan of Beth-lehem judged Israel. And he had thirty sons, and thirty daughters, whom he sent abroad, and took in thirty daughters from abroad for his sons. And he judged Israel seven years. Then died Ibzan, and was buried at Beth-lehem.” That is the whole record; the Synodal Bible calls him Esebon."
    - "There were two Bethlehems, and the text does not say which. The famous one is Bethlehem of Judah; the other is the Bethlehem of Zebulun in Joshua's list, in Lower Galilee. Josephus made Ibzan a man of the tribe of Judah and of Bethlehem, and that was long the common reading. Most modern commentators prefer Zebulun, because the book of Judges otherwise calls the southern town “Beth-lehem-judah” when it means it, and because Ibzan stands between Jephthah of Gilead and Elon the Zebulunite in a list of northern judges. The question cannot be settled, and the map shows both."
    - "The Galilean Bethlehem is Beit Lahm, about 10 km north-west of Nazareth, where excavations have found ancient remains, including those of a church. German Templers founded a colony there in 1906, and since 1948 it has been the moshav Beit Lehem HaGlilit, whose old stone houses survive."
  ru:
    - "Этот Вифлеем — родина одного из малых судей. «После него был судьею Израиля Есевон из Вифлеема. У него было тридцать сыновей, и тридцать дочерей отпустил он из дома в замужество, а тридцать дочерей взял со стороны за сыновей своих, и был судьею Израиля семь лет. И умер Есевон и погребен в Вифлееме». Это вся запись; в еврейском тексте судью зовут Ивцан."
    - "Вифлеемов было два, и текст не говорит, который имеется в виду. Знаменитый — Вифлеем Иудин; другой — Вифлеем Завулона из списка книги Иисуса Навина, в Нижней Галилее. Иосиф Флавий сделал Есевона человеком из колена Иудина и из Вифлеема, и долго это было обычным чтением. Большинство нынешних толкователей предпочитают Завулон, потому что книга Судей в других местах называет южный город Вифлеемом Иудейским, когда имеет в виду его, и потому что Есевон стоит между Иеффаем из Галаада и Елоном Завулонянином в ряду северных судей. Вопрос решить нельзя, и карта показывает оба места."
    - "Галилейский Вифлеем — Бейт-Лахм, примерно в 10 км к северо-западу от Назарета, где раскопки нашли древние остатки, включая остатки церкви. Немецкие темплеры основали там колонию в 1906 году, а с 1948 года это мошав Бейт-Лехем-ха-Глилит, где сохранились старые каменные дома."
  uk:
    - "Цей Вифлеєм — батьківщина одного з малих суддів. «Після його був суддею Ізраїля Абезан із Бетлеєму. У сього було трийцять синів, а віддав він трийцятеро дочок на чужу сторону, і привів синам своїм трийцятеро дочок із чужої сторони, й судив Ізраїля сїм год. Потім умер Абезан, і поховано його в Бетлеємі». Це весь запис; Синодальний переклад називає його Есевоном."
    - "Було два Вифлеєми, і текст не каже, який саме. Знаменитий — Вифлеєм Юдин; другий — Вифлеєм Завулонів зі списку Ісуса Навина, в Нижній Галілеї. Йосиф Флавій зробив Есевона людиною з коліна Юди й з Вифлеєму, і довго це було загальноприйнятим прочитанням. Більшість сучасних коментаторів віддає перевагу Завулону, бо в Книзі Суддів південне місто, коли йдеться про нього, інакше зветься «Бетлеєм Юдейський», і бо Есевон стоїть між Єфтаєм Гілеадським і Елоном Завулонянином у переліку північних суддів. Це питання не можна розв'язати, і на мапі показано обидва."
    - "Галілейський Вифлеєм — це Бейт-Лахм, приблизно за 10 км на північний захід від Назарета, де розкопки виявили давні залишки, зокрема залишки церкви. Німецькі темплери заснували тут колонію в 1906 р., а від 1948 р. це мошав Бейт-Лехем ха-Глілит, чиї старі кам'яні будинки збереглися."
  es:
    - "Este Belén es la patria de uno de los jueces menores. «Después de él juzgó á Israel Ibzán de Beth-lehem; el cual tuvo treinta hijos y treinta hijas, las cuales casó fuera, y tomó de fuera treinta hijas para sus hijos: y juzgó á Israel siete años. Y murió Ibzán, y fué sepultado en Beth-lehem.» Ese es todo el registro; la Biblia sinodal lo llama Esebón."
    - "Había dos Beléns, y el texto no dice cuál. El famoso es Belén de Judá; el otro es el Belén de Zabulón de la lista de Josué, en la Baja Galilea. Josefo hizo de Ibzán un hombre de la tribu de Judá y de Belén, y esa fue durante mucho tiempo la lectura común. La mayoría de los comentaristas modernos prefieren Zabulón, porque el libro de los Jueces, cuando se refiere a la ciudad del sur, la llama por lo demás «Beth-lehem de Judá», y porque Ibzán figura entre Jefté de Galaad y Elón el zabulonita en una lista de jueces del norte. La cuestión no puede resolverse, y el mapa muestra ambos."
    - "El Belén galileo es Beit Lahm, a unos 10 km al noroeste de Nazaret, donde las excavaciones han hallado restos antiguos, entre ellos los de una iglesia. Los templarios alemanes fundaron allí una colonia en 1906, y desde 1948 es el moshav Beit Lehem HaGlilit, cuyas antiguas casas de piedra se conservan."
  pt:
    - "Esta Belém é a terra de um dos juízes menores. “Depois dele, Ibsã, de Belém, julgou a Israel. Ele teve trinta filhos. Enviou suas trinta filhas para fora do seu clã, e trouxe de fora trinta moças para seus filhos. Ele julgou a Israel por sete anos. Ibsã morreu e foi sepultado em Belém.” Esse é todo o registro; a Bíblia Sinodal o chama de Esebon."
    - "Havia duas Beléns, e o texto não diz qual. A famosa é Belém de Judá; a outra é a Belém de Zebulom na lista de Josué, na Baixa Galileia. Josefo fez de Ibsã um homem da tribo de Judá e de Belém, e essa foi por muito tempo a leitura comum. A maioria dos comentaristas modernos prefere Zebulom, porque o livro de Juízes, quando quer dizer a cidade do sul, a chama “Belém de Judá”, e porque Ibsã aparece entre Jefté de Gileade e Elom, o zebulonita, numa lista de juízes do norte. A questão não pode ser resolvida, e o mapa mostra as duas."
    - "A Belém galileia é Beit Lahm, cerca de 10 km a noroeste de Nazaré, onde as escavações encontraram vestígios antigos, entre eles os de uma igreja. Templários alemães fundaram ali uma colônia em 1906, e desde 1948 ela é o moshav Beit Lehem HaGlilit, cujas antigas casas de pedra subsistem."
  de:
    - "Dieses Bethlehem ist die Heimat eines der Kleinen Richter. „Nach diesem richtete Israel Ebzan von Bethlehem. Der hatte dreißig Söhne, und dreißig Töchter gab er hinaus, und dreißig Töchter nahm er von außen seinen Söhnen; er richtete Israel sieben Jahre und starb und ward begraben zu Bethlehem.“ Das ist der ganze Bericht; die Synodalbibel nennt ihn Esebon."
    - "Es gab zwei Orte namens Bethlehem, und der Text sagt nicht, welcher gemeint ist. Das berühmte ist Bethlehem in Juda; das andere ist das Bethlehem Sebulons in der Liste des Buches Josua, in Untergaliläa. Josephus machte Ibzan zu einem Mann aus dem Stamm Juda und aus Bethlehem, und das war lange die übliche Lesart. Die meisten heutigen Ausleger bevorzugen Sebulon, weil das Richterbuch die südliche Stadt sonst „Bethlehem-Juda“ nennt, wenn es sie meint, und weil Ibzan in einer Liste nördlicher Richter zwischen Jeftah von Gilead und Elon dem Sebuloniter steht. Die Frage lässt sich nicht entscheiden, und die Karte zeigt beide."
    - "Das galiläische Bethlehem ist Beit Lahm, etwa 10 km nordwestlich von Nazareth; Ausgrabungen haben dort antike Reste gefunden, darunter die einer Kirche. Deutsche Templer gründeten dort 1906 eine Kolonie, und seit 1948 ist es der Moschaw Beit Lehem HaGlilit, dessen alte Steinhäuser erhalten sind."
  fr:
    - "Ce Bethléem est la patrie d’un des juges mineurs. « Après lui, Ibtsan de Bethléhem fut juge en Israël. Il eut trente fils, il maria trente filles au-dehors, et il fit venir pour ses fils trente filles du dehors. Il fut juge en Israël pendant sept ans ; puis Ibtsan mourut, et fut enterré à Bethléhem. » C’est tout ce que dit le récit ; la Bible synodale l’appelle Esebon."
    - "Il existait deux Bethléem, et le texte ne dit pas lequel. Le plus célèbre est Bethléem de Juda ; l’autre est le Bethléem de Zabulon dans la liste de Josué, en Basse Galilée. Josèphe fit d’Ibtsan un homme de la tribu de Juda et de Bethléem, ce qui fut longtemps la lecture courante. La plupart des commentateurs modernes préfèrent Zabulon, parce que le livre des Juges appelle d’ordinaire la ville du sud « Bethléhem de Juda » quand il la désigne, et parce qu’Ibtsan figure entre Jephté de Galaad et Élon le Zabulonite dans une liste de juges du nord. La question ne peut être tranchée, et la carte montre les deux."
    - "Le Bethléem de Galilée est Beit Lahm, à environ 10 km au nord-ouest de Nazareth, où les fouilles ont mis au jour des vestiges anciens, dont ceux d’une église. Des Templiers allemands y fondèrent une colonie en 1906, et depuis 1948 c’est le moshav Beit Lehem HaGlilit, dont les anciennes maisons de pierre subsistent."
  it:
    - "Questa Betlemme è la patria di uno dei giudici minori. «Dopo di lui fu giudice d’Israele Ibtsan di Bethlehem, che ebbe trenta figliuoli, maritò fuori trenta figliuole, condusse di fuori trenta fanciulle per i suoi figliuoli. Fu giudice d’Israele per sette anni. Poi Ibtsan morì e fu sepolto a Bethlehem.» È tutta la notizia che abbiamo; la Bibbia sinodale lo chiama Esebon."
    - "Esistevano due Betlemme, e il testo non dice quale. La più famosa è Betlemme di Giuda; l’altra è la Betlemme di Zabulon dell’elenco di Giosuè, nella Bassa Galilea. Giuseppe Flavio fece di Ibsan un uomo della tribù di Giuda e di Betlemme, e questa fu a lungo la lettura comune. La maggior parte dei commentatori moderni preferisce Zabulon, perché il libro dei Giudici, quando intende la città meridionale, altrove la chiama «Bethlehem di Giuda», e perché Ibsan si trova tra Iefte di Galaad ed Elon lo Zabulonita in un elenco di giudici settentrionali. La questione non si può risolvere, e la mappa mostra entrambe."
    - "La Betlemme di Galilea è Beit Lahm, a circa 10 km a nord-ovest di Nazaret, dove gli scavi hanno trovato resti antichi, compresi quelli di una chiesa. I Templer tedeschi vi fondarono una colonia nel 1906, e dal 1948 vi sorge il moshav Beit Lehem HaGlilit, le cui antiche case di pietra si sono conservate."
  pl:
    - "To Betlejem jest miastem rodzinnym jednego z sędziów mniejszych. „Potem sądził po nim Izraela Abesan z Betlehem. A miał trzydzieści synów, i trzydzieści córek, które powydawał od siebie, trzydzieści żon przywiódł synom swoim zinąd, i sądził Izraela przez siedem lat. Umarł potem Abesan, i pogrzebion jest w Betlehem.” To cały zapis; Biblia synodalna nazywa go Esebonem."
    - "Były dwa Betlejem, a tekst nie mówi, o które chodzi. Sławne jest Betlejem judzkie; drugie to Betlejem Zabulona z listy Jozuego, w Dolnej Galilei. Józef Flawiusz uczynił Ibsana człowiekiem z pokolenia Judy i z Betlejem, i przez długi czas było to odczytanie powszechne. Większość współczesnych komentatorów woli Zabulona, ponieważ Księga Sędziów w innych miejscach nazywa południowe miasto „Betlehem Juda”, gdy je ma na myśli, a także dlatego, że Ibsan stoi między Jeftem z Gileadu a Elonem Zabulonitą na liście sędziów północnych. Sprawy tej nie da się rozstrzygnąć, a mapa pokazuje oba miejsca."
    - "Betlejem galilejskie to Bajt Lahm (Beit Lahm), około 10 km na północny zachód od Nazaretu, gdzie wykopaliska odsłoniły starożytne pozostałości, w tym pozostałości kościoła. Niemieccy templerzy założyli tam kolonię w 1906 r., a od 1948 r. jest to moszaw Bet Lechem ha-Galilit, którego stare kamienne domy się zachowały."
  nl:
    - "Dit Bethlehem is de woonplaats van een van de kleine richters. “En na hem richtte Israël Ebzan, van Bethlehem. En hij had dertig zonen; en hij zond dertig dochteren naar buiten, en bracht dertig dochteren van buiten in voor zijn zonen; en hij richtte Israël zeven jaren. Toen stierf Ebzan, en werd begraven te Bethlehem.” Dat is het hele verslag; de Synodale Bijbel noemt hem Esebon."
    - "Er waren twee plaatsen met de naam Bethlehem, en de tekst zegt niet welke bedoeld is. De beroemde is Bethlehem in Juda; de andere is het Bethlehem van Zebulon uit de lijst in Jozua, in Neder-Galilea. Flavius Josephus maakte Ibzan tot een man uit de stam Juda en uit Bethlehem, en dat was lang de gangbare lezing. De meeste moderne commentatoren geven de voorkeur aan Zebulon, omdat het boek Richteren de zuidelijke stad elders “Bethlehem-Juda” noemt wanneer die bedoeld is, en omdat Ibzan in een lijst van noordelijke richters staat tussen Jefta van Gilead en de Zebulonieter Elon. De kwestie valt niet te beslechten, en de kaart toont beide."
    - "Het Galilese Bethlehem is Beit Lahm, ongeveer 10 km ten noordwesten van Nazareth, waar opgravingen oude resten hebben gevonden, waaronder die van een kerk. Duitse tempeliers stichtten er in 1906 een kolonie, en sinds 1948 is het de moshav Beit Lehem HaGlilit, waarvan de oude stenen huizen bewaard zijn gebleven."
  cs:
    - "Tento Betlém je domovem jednoho z menších soudců. „Potom soudil po něm Izraele Abesam z Betléma. A měl třidceti synů a třidceti dcer, kteréž rozevdal od sebe, a třidceti žen přivedl od jinud synům svým. I soudil Izraele sedm let. A umřev Abesam, pochován jest v Betlémě.“ To je celý záznam; synodální Bible ho nazývá Esebon."
    - "Betlémy byly dva a text neříká, který je míněn. Slavný je Betlém judský; druhý je zebulunský Betlém ze Jozuova seznamu, v Dolní Galileji. Josephus učinil z Ibsana muže z kmene Juda a z Betléma a to bylo dlouho obvyklé čtení. Většina současných vykladačů dává přednost Zebulunu, protože Kniha soudců jinak jižní město, když je má na mysli, nazývá slovy „z Betléma Judova“ a protože Ibsan stojí v seznamu severních soudců mezi Jiftáchem Gileadským a Élonem Zebulunským. Otázku nelze rozhodnout a mapa ukazuje oba."
    - "Galilejský Betlém je Bajt Lahm, asi 10 km severozápadně od Nazareta, kde vykopávky odhalily starověké pozůstatky, včetně pozůstatků kostela. Němečtí templáři tam roku 1906 založili kolonii a od roku 1948 je tam mošav Bejt Lechem ha-Glilit, jehož staré kamenné domy se dochovaly."
  sv:
    - "Detta Betlehem är hemorten för en av de mindre domarna. ”Efter honom var Ibsan från Bet-Lehem domare i Israel. Han hade trettio söner, och trettio döttrar gifte han bort; han fick ock trettio döttrar genom att skaffa hustrur åt sina söner utifrån. Och han var domare i Israel i sju år. Sedan dog Ibsan och blev begraven i Bet-Lehem.” Det är hela berättelsen; den synodala bibeln kallar honom Esevon."
    - "Det fanns två Betlehem, och texten säger inte vilket. Det berömda är Betlehem i Juda; det andra är Sebulons Betlehem i Josuas förteckning, i nedre Galileen. Josefus gjorde Ivsan till en man av Juda stam och från Betlehem, och det var länge den gängse läsningen. De flesta moderna kommentatorer föredrar Sebulon, eftersom Domarboken annars kallar den södra staden ”Bet-Lehem i Juda” när den menar den, och eftersom Ivsan står mellan Jefta från Gilead och sebuloniten Elon i en förteckning över nordliga domare. Frågan kan inte avgöras, och kartan visar båda."
    - "Det galileiska Betlehem är Beit Lahm, omkring 10 km nordväst om Nasaret, där utgrävningar har funnit antika lämningar, bland dem lämningar av en kyrka. Tyska tempelsamfundet grundade en koloni där 1906, och sedan 1948 är det moshaven Beit Lehem HaGlilit, vars gamla stenhus finns kvar."
  nb:
    - "Dette Betlehem er hjemstedet til en av de mindre dommerne. «Efter ham var Ibsan fra Betlehem dommer i Israel. Han hadde tretti sønner; tretti døtre giftet han bort, og tretti døtre førte han hjem som hustruer for sine sønner; og han dømte Israel i syv år. Og Ibsan døde og blev begravet i Betlehem.» Det er hele beretningen; den synodale bibelen kaller ham Esebon."
    - "Det fantes to Betlehem, og teksten sier ikke hvilket. Det berømte er Betlehem i Juda; det andre er Sebulons Betlehem i Josvas liste, i Nedre Galilea. Josefus gjorde Ibsan til en mann av Judas stamme og fra Betlehem, og det var lenge den vanlige lesningen. De fleste moderne kommentatorer foretrekker Sebulon, fordi Dommerboken ellers kaller den sørlige byen «Betlehem i Juda» når den mener den, og fordi Ibsan står mellom gileaditten Jefta og sebulonitten Elon i en liste over nordlige dommere. Spørsmålet kan ikke avgjøres, og kartet viser begge."
    - "Det galileiske Betlehem er Beit Lahm, omtrent 10 km nordvest for Nasaret, der utgravninger har funnet eldgamle rester, blant dem rester av en kirke. Tyske templere grunnla en koloni der i 1906, og siden 1948 har det vært moshaven Beit Lehem HaGlilit, hvis gamle steinhus står igjen."
  tl:
    - "Ang Bethlehem na ito ang tahanan ng isa sa mga menor na hukom. “At pagkamatay niya, si Ibzan na taga Bethlehem ang naghukom sa Israel. At siya'y nagkaanak ng tatlong pung lalake, at ang tatlong pung anak na babae ay kaniyang ipinadala sa ibang bayan, at tatlong pung anak na babae ay kaniyang ipinasok mula sa ibang bayan para sa kaniyang mga anak na lalake. At naghukom siya sa Israel na pitong taon. At si Ibzan ay namatay, at inilibing sa Bethlehem.” Iyon na ang buong tala; tinatawag siyang Esebon ng Bibliyang Sinodal."
    - "May dalawang Bethlehem, at hindi sinasabi ng teksto kung alin. Ang bantog ay ang Bethlehem ng Juda; ang isa pa ay ang Bethlehem ng Zabulon sa talaan ni Josue, sa Mababang Galilea. Ginawa ni Josefo si Ibzan na lalaki ng lipi ni Juda at taga-Bethlehem, at iyon ang matagal na karaniwang pagbasa. Mas pinipili ng karamihan sa mga makabagong komentarista ang Zabulon, sapagkat sa ibang bahagi ay tinatawag ng Aklat ng Mga Hukom na “Bethlehem-juda” ang katimugang bayan kapag iyon ang ibig sabihin, at sapagkat si Ibzan ay nasa pagitan ni Jephte na taga-Gilead at ni Elon na Zabulonita sa isang talaan ng mga hukom sa hilaga. Hindi mapagpapasyahan ang tanong, at ipinapakita ng mapa ang dalawa."
    - "Ang Bethlehem sa Galilea ay ang Beit Lahm, mga 10 km sa hilagang-kanluran ng Nazaret, kung saan nakatagpo ang mga paghuhukay ng sinaunang labi, kabilang ang sa isang simbahan. Nagtatag ang mga Templer na Aleman ng kolonya roon noong 1906, at mula 1948 ito ay ang moshav na Beit Lehem HaGlilit, na ang matatandang bahay na bato ay nananatili."
  da:
    - "Denne Betlehem er hjemstedet for en af de mindre dommere. »Og efter ham dømte Ibzan af Bethlehem Israel. Og han havde tredive Sønner, og tredive Døtre udstyrede han og indførte tredive Døtre til sine Sønner udenfra; og han dømte Israel syv Aar. Og Ibzan døde og blev begraven i Bethlehem.« Det er hele beretningen; den russiske synodalbibel kalder ham Esebon."
    - "Der var to Betlehem, og teksten siger ikke hvilket. Det berømte er Judas Betlehem; det andet er Zebulons Betlehem på Josvas liste, i Nedre Galilæa. Josefus gjorde Ibzan til en mand af Judas stamme og fra Betlehem, og det var længe den gængse læsning. De fleste moderne kommentatorer foretrækker Zebulon, fordi Dommerbogen ellers kalder den sydlige by »Bethlehem i Juda«, når den mener den, og fordi Ibzan står mellem Jefta fra Gilead og zebuloniten Elon i en liste over nordlige dommere. Spørgsmålet kan ikke afgøres, og kortet viser begge."
    - "Galilæas Betlehem er Beit Lahm, cirka 10 km nordvest for Nazaret, hvor udgravninger har fundet oldtidsrester, blandt dem rester af en kirke. Tyske templere grundlagde en koloni dér i 1906, og siden 1948 har det været moshavet Beit Lehem HaGlilit, hvis gamle stenhuse stadig står."
  sr:
    - "Овај Витлејем је завичај једног од малих судија. „А после њега би судија Израиљу Авесан из Витлејема. И имаше тридесет синова и тридесет кћери, које разуда из куће, а тридесет девојака доведе синовима својим из других кућа; и би судија Израиљу седам година. И потом умре Авесан, и би погребен у Витлејему.“ То је цео запис; Синодална Библија га назива Есевон."
    - "Постојала су два Витлејема, а текст не каже који. Познати је Витлејем Јудин; други је Витлејем Завулонов у Исусовом списку, у Доњој Галилеји. Јосиф Флавије је Авесана учинио човеком из племена Јудиног и из Витлејема, и то је дуго било уобичајено тумачење. Већина савремених тумача даје предност Завулону, јер књига о Судијама иначе, када мисли на јужни град, каже „из Витлејема Јудиног“, и зато што Авесан стоји између Јефтаја Галађанина и Елона Завулоњанина у списку северних судија. Питање се не може решити, и карта приказује оба."
    - "Галилејски Витлејем је Бајт Лахм, око 10 км северозападно од Назарета, где су ископавања нашла старе остатке, међу њима остатке једне цркве. Немачки темплери основали су тамо колонију 1906, а од 1948. то је мошав Бајт Лехем ха-Глилит, чије су старе камене куће сачуване."
  hu:
    - "Ez a Betlehem az egyik kisbíró otthona. „És ítélé ő utána az Izráelt Ibsán, ki Bethlehemből való volt. Ennek harmincz fia volt és harmincz leányt házasított ki, és harmincz leányt hozott be kivül az ő fiainak, és itélé Izráelt hét esztendeig. És meghala Ibsán, és eltemetteték Bethlehemben.” Ennyi az egész feljegyzés; a Szinodális Biblia Esebonnak nevezi."
    - "Két Betlehem volt, és a szöveg nem mondja meg, melyik. A híres a júdai Betlehem; a másik a zebuloni Betlehem Józsué jegyzékében, Alsó-Galileában. Josephus Ibcánt Júda törzséhez tartozó betlehemi férfinak tette, és ez sokáig a közkeletű olvasat volt. A legtöbb mai kommentátor Zebulont részesíti előnyben, mert a Bírák könyve a déli várost egyébként Júda Betlehemének nevezi, ha azt érti, és mert Ibcán a gileádi Jefte és a zebuloni Elón között áll az északi bírák jegyzékében. A kérdés nem dönthető el, és a térkép mindkettőt mutatja."
    - "A galileai Betlehem Beit Lahm, Názárettől mintegy 10 km-re északnyugatra, ahol az ásatások ókori maradványokat, köztük egy templom maradványait is feltárták. Német templerek 1906-ban telepet alapítottak ott, 1948 óta pedig Beit Lehem HaGlilit mosávként ismert, amelynek régi kőházai fennmaradtak."
  fi:
    - "Tämä Betlehem on yhden vähäisen tuomarin kotikaupunki. ”Hänen jälkeensä oli Ibsan, Beetlehemistä, tuomarina Israelissa. Hänellä oli kolmekymmentä poikaa, ja hän naitti kolmekymmentä tytärtänsä muualle ja toi muualta kolmekymmentä tyttöä pojilleen vaimoiksi. Ja hän oli tuomarina Israelissa seitsemän vuotta. Sitten Ibsan kuoli, ja hänet haudattiin Beetlehemiin.” Siinä koko kertomus; venäläinen synodaalikäännös kutsuu häntä nimellä Esebon."
    - "Betlehemejä oli kaksi, eikä teksti kerro, kumpi. Kuuluisa on Juudan Betlehem; toinen on Joosuan luettelon Sebulonin Betlehem Ala-Galileassa. Josefus teki Ibsanista Juudan heimon miehen ja betlehemiläisen, ja se oli pitkään yleinen tulkinta. Useimmat nykyiset selittäjät pitävät parempana Sebulonia, koska Tuomarien kirja muuten kutsuu eteläistä kaupunkia nimellä ”Juudan Beetlehem”, kun sitä tarkoittaa, ja koska Ibsan on pohjoisten tuomarien luettelossa gileadilaisen Jeftan ja sebulonilaisen Elonin välissä. Kysymystä ei voida ratkaista, ja kartta näyttää molemmat."
    - "Galilean Betlehem on Beit Lahm, noin 10 km Nasaretista luoteeseen, missä kaivauksissa on löydetty muinaisia jäännöksiä, muun muassa kirkon. Saksalaiset templerit perustivat sinne siirtokunnan vuonna 1906, ja vuodesta 1948 se on ollut moshav Beit Lehem HaGlilit, jonka vanhat kivitalot ovat säilyneet."
  vi:
    - "Bết-lê-hem này là quê của một trong các quan xét nhỏ. “Sau người, có Iếp-san ở Bết-lê-hem làm quan xét trong Y-sơ-ra-ên. Người có ba mươi con trai và ba mươi con gái. Người gả các con gái ra ngoài nhà mình, và cưới ba mươi con gái ở ngoài làm vợ cho các con trai mình. Người làm quan xét trong Y-sơ-ra-ên được bảy năm. Đoạn, Iếp-san qua đời, được chôn ở Bết-lê-hem.” Đó là toàn bộ ghi chép; Kinh Thánh Synodal gọi ông là Esebon."
    - "Có hai Bết-lê-hem, và bản văn không nói là nơi nào. Nơi nổi tiếng là Bết-lê-hem của Giu-đa; nơi kia là Bết-lê-hem của Sa-bu-lôn trong bảng của Giô-suê, ở hạ Ga-li-lê. Josephus cho Íp-san là người thuộc chi phái Giu-đa và quê ở Bết-lê-hem, và đó từ lâu là cách đọc phổ biến. Phần lớn các nhà chú giải hiện đại ưa Sa-bu-lôn, vì sách Các Quan Xét ở những chỗ khác gọi thành phía nam là “Bết-lê-hem tại xứ Giu-đa” khi muốn chỉ nó, và vì Íp-san đứng giữa Giép-thê người Ga-la-át và Ê-lôn người Sa-bu-lôn trong một bảng các quan xét miền bắc. Vấn đề không thể giải quyết, và bản đồ hiển thị cả hai."
    - "Bết-lê-hem ở Ga-li-lê là Beit Lahm, cách Na-xa-rét khoảng 10 km về phía tây bắc, nơi các cuộc khai quật đã tìm thấy di tích cổ, trong đó có di tích của một nhà thờ. Người Templer Đức lập một khu định cư ở đó năm 1906, và từ năm 1948 nơi này là moshav Beit Lehem HaGlilit, nơi những ngôi nhà đá cũ vẫn còn tồn tại."
  ro:
    - "Acest Betleem este locul de obârșie al unuia dintre judecătorii mici. „Și după el a judecat pre Israil Avessan din Vitleem. Și s’a născut lui treizeci de feciori și treizeci de fete, pre care le-a măritat afară, și treizeci de fete de afară au adus femei feciorilor săi, și a judecat pre Israil șapte ani. Și a murit Avessan, și s’a îngropat în Vitleem.” Aceasta este toată însemnarea; Biblia sinodală rusă îl numește Esebon."
    - "Au existat două Betleeme, iar textul nu spune care. Cel vestit este Betleemul lui Iuda; celălalt este Betleemul lui Zabulon din lista lui Iosua, în Galileea de Jos. Iosif Flaviu l-a făcut pe Ibțan om din tribul lui Iuda și din Betleem, iar aceasta a fost multă vreme citirea obișnuită. Cei mai mulți comentatori moderni preferă Zabulon, pentru că, în rest, cartea Judecătorilor numește cetatea din sud „Vitleemul lui Iuda” când o are în vedere și pentru că Ibțan stă între Ieftae Galaaditul și Elon Zabulonitul într-o listă de judecători din nord. Întrebarea nu poate fi lămurită, iar harta le arată pe amândouă."
    - "Betleemul galilean este Beit Lahm, la circa 10 km nord-vest de Nazaret, unde săpăturile au găsit rămășițe străvechi, printre ele cele ale unei biserici. Templierii germani au întemeiat acolo o colonie în 1906, iar din 1948 este moșavul Beit Lehem HaGlilit, ale cărui case vechi de piatră se păstrează."
  bg:
    - "Този Витлеем е родното място на един от малките съдии. „А подир него стана съдия в Израил Ивцан от Витлеем. Той имаше тридесет синове, и тридесет дъщери които ожени на вън; и взе из вън тридесет чужди дъщери за синовете си. И съди Израиля седем години. И умря Ивцан, и погребе се в Витлеем.“ Това е целият запис; руската Синодална Библия го нарича Есевон (в Цариградската Библия той е Ивцан)."
    - "Имало два Витлеема и текстът не казва кой. Прочутият е Витлеем в Юда; другият е Витлеем на Завулон в списъка на книгата Иисус Навин, в Долна Галилея. Йосиф Флавий прави Есевон човек от племето на Юда и от Витлеем и това дълго било общоприетото четене. Повечето съвременни тълкуватели предпочитат Завулон, защото книга Съдии иначе нарича южния град „Витлеем Юдин“, когато има предвид него, и защото Есевон стои между Йефтай от Галаад и Елон Завулонеца в списък на северни съдии. Въпросът не може да бъде решен и картата показва и двете места."
    - "Галилейският Витлеем е Бейт Лахм, на около 10 км северозападно от Назарет, където разкопките откриха древни останки, сред тях и такива от църква. Германски темплери основали там колония през 1906 г., а от 1948 г. това е мошавът Бейт Лехем ха-Глилит, чиито стари каменни къщи са оцелели."
