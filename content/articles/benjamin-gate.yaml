# Overview article (ADR 0007). Mainstream facts only; the gate is unlocated; the distinction between the city gate and the “upper gate of Benjamin” at the Temple follows the usual reading and is said to be an inference.
id: benjamin-gate
place: ae04aa8
title:
  en: "Benjamin Gate"
  ru: "Ворота Вениаминовы"
  uk: "Веніяминові ворота"
  es: "Puerta de Benjamín"
  pt: "Porta de Benjamim"
  de: "Benjamintor"
  fr: "Porte de Benjamin"
body:
  en:
    - "The Benjamin Gate was a gate of Jerusalem in the last years of the kingdom of Judah, named for the road through it: north, into the territory of Benjamin, towards Anathoth, Gibeah and Ramah. Nothing of it has been found. Zechariah, listing the city from east to west, names it before “the first gate” and “the corner gate”, which puts it near the north-east, and many scholars take it to be the gate that Nehemiah later called the Sheep Gate, though others equate it with the Gate of Ephraim. Jeremiah also speaks of “the high gate of Benjamin, which was by the house of the LORD”; that seems to be a gate of the Temple courts on their north side, perhaps the upper gate that Jotham built, and not the city gate."
    - "All three scenes in Jeremiah belong to his sufferings. When the priest Pashur heard Jeremiah prophesy, he “smote Jeremiah the prophet, and put him in the stocks that were in the high gate of Benjamin”. During the siege, when the Babylonians had withdrawn for a time, Jeremiah set out for Benjamin, “and when he was in the gate of Benjamin, a captain of the ward was there, whose name was Irijah”, who seized him with the words “Thou fallest away to the Chaldeans”, and he was beaten and imprisoned. Later, when the princes had lowered him into the cistern, Ebed-melech the Ethiopian found the king “sitting in the gate of Benjamin”, in the gate where kings gave judgement, and won leave to pull him out."
    - "Zechariah's vision sets the gate at the edge of the restored city, which will stand “from Benjamin's gate unto the place of the first gate, unto the corner gate, and from the tower of Hananeel unto the king's winepresses”. Where the north wall of that Jerusalem ran is debated, and its gates are known only from the texts."
  ru:
    - "Ворота Вениаминовы — ворота Иерусалима последних лет Иудейского царства, названные по дороге через них: на север, в удел Вениамина, к Анафофу, Гиве и Раме. От них ничего не найдено. Захария, перечисляя город с востока на запад, называет их прежде «первых ворот» и «угловых ворот», что помещает их ближе к северо-востоку, и многие учёные считают их теми воротами, которые Неемия позже назвал Овечьими, а другие отождествляют с воротами Ефремовыми. Иеремия говорит ещё о колоде «у верхних ворот Вениаминовых при доме Господнем»; это, по-видимому, ворота храмовых дворов с северной стороны, быть может, верхние ворота, построенные Иоафамом, а не городские."
    - "Все три сцены у Иеремии связаны с его страданиями. Когда священник Пасхор услышал пророчество Иеремии, то, как сказано, «ударил Пасхор Иеремию пророка и посадил его в колоду, которая была у верхних ворот Вениаминовых при доме Господнем». Во время осады, когда Вавилоняне на время отошли, Иеремия пошёл в землю Вениаминову, и, «когда он был в воротах Вениаминовых, бывший там начальник стражи, по имени Иреия», задержал его со словами «ты хочешь перебежать к Халдеям?», и его били и посадили в темницу. Позже, когда князья спустили его в яму, Авдемелех Ефиоплянин нашёл царя, который «сидел тогда у ворот Вениаминовых», в воротах, где цари творили суд, и получил позволение вытащить пророка."
    - "Видение Захарии ставит ворота на краю восстановленного города, который населится «от ворот Вениаминовых до места первых ворот, до угловых ворот, и от башни Анамеила до царских точил». Где шла северная стена того Иерусалима, спорят, а её ворота известны только по текстам."
  uk:
    - "Веніяминові ворота були воротами Єрусалима в останні роки царства Юди, названими за дорогою крізь них: на північ, до землі Веніяміна, до Анатоту, Гіви та Рами. Від них нічого не знайдено. Захарія, перелічуючи місто зі сходу на захід, називає їх перед «місцем давних воріт» і «наріжними воротами», що ставить їх на північному сході, і багато вчених вважають їх тими воротами, які Неемія пізніше назвав Овечими, хоча інші ототожнюють їх з Єфремовими воротами. Єремія також говорить про «верхні ворота Беняминові у дому Господньому»; це, здається, ворота дворів Храму з їхнього північного боку, можливо, верхні ворота, які збудував Йотам, а не міська брама."
    - "Усі три сцени в Єремії належать до його страждань. Коли священник Пасхор почув пророцтво Єремії, «Ударив Пасхор пророка Еремію, та й посадив його в колоду, що була в верхніх воротях Беняминових у дому Господньому». Під час облоги, коли вавилоняни на якийсь час відступили, Єремія вирушив до землі Веніяміна, «Як же дойшов до Беняминової брами, старший сторож, на імя Іреїя Селемієнко, сина Аннїїного, зʼупинив пророка Еремію, кажучи: Ти хочеш перекинутись до Халдеїв?», і його побили та ув'язнили. Пізніше, коли князі спустили його в цистерну, Ебед-Мелех Ефіоп знайшов царя, що «седїв тодї у Беняминових воротах», у воротах, де царі чинили суд, і випросив дозвіл витягти його."
    - "Видіння Захарії ставить ворота на край відновленого міста, яке простягатиметься «од Беняминової брами до місця давних воріт, до наріжних воріт, і від Ананеїлової башти до царських тискарень». Де проходив північний мур того Єрусалима, дискутується, а його ворота відомі лише з текстів."
  es:
    - "La Puerta de Benjamín era una puerta de Jerusalén en los últimos años del reino de Judá, llamada así por el camino que pasaba por ella: al norte, hacia el territorio de Benjamín, en dirección a Anatot, Gabaa y Ramá. No se ha hallado nada de ella. Zacarías, al enumerar la ciudad de este a oeste, la nombra antes de «la puerta primera» y «la puerta de los rincones», lo que la sitúa cerca del nordeste, y muchos estudiosos la toman por la puerta que Nehemías llamó más tarde la Puerta de las Ovejas, aunque otros la equiparan con la Puerta de Efraín. Jeremías habla también de «la puerta de Benjamín en lo alto, la cual conducía á la casa de Jehová»; parece una puerta de los atrios del Templo por su lado norte, quizá la puerta superior que construyó Jotam, y no la puerta de la ciudad."
    - "Las tres escenas de Jeremías pertenecen a sus sufrimientos. Cuando el sacerdote Pashur oyó profetizar a Jeremías, «E hirió Pashur á Jeremías profeta, y púsole en el cepo que estaba á la puerta de Benjamín en lo alto». Durante el asedio, cuando los babilonios se habían retirado por un tiempo, Jeremías salió hacia Benjamín, «Y cuando fué á la puerta de Benjamín, estaba allí un prepósito que se llamaba Irías», que lo prendió diciendo: «Tú te retiras á los Caldeos», y fue azotado y encarcelado. Más tarde, cuando los príncipes lo habían bajado a la cisterna, Ebed-melec el etíope se presentó ante el rey, «sentado el rey á la puerta de Benjamín», la puerta donde los reyes dictaban sentencia, y obtuvo permiso para sacarlo."
    - "La visión de Zacarías sitúa la puerta en el borde de la ciudad restaurada, que se extenderá «desde la puerta de Benjamín hasta el lugar de la puerta primera, hasta la puerta de los rincones; y desde la torre de Hananeel hasta los lagares del rey». Se debate por dónde corría la muralla norte de esa Jerusalén, y sus puertas se conocen solo por los textos."
  pt:
    - "A Porta de Benjamim era uma porta de Jerusalém nos últimos anos do reino de Judá, assim chamada pela estrada que passava por ela: ao norte, para o território de Benjamim, rumo a Anatote, Gibeá e Ramá. Nada dela foi achado. Zacarias, listando a cidade de leste a oeste, nomeia-a antes da “primeira porta” e da “porta da esquina”, o que a põe perto do nordeste, e muitos estudiosos a tomam pela porta que Neemias chamou depois Porta das Ovelhas, embora outros a igualem à Porta de Efraim. Jeremias fala também da “porta superior de Benjamim, a qual ficava na casa do SENHOR”; parece uma porta dos pátios do Templo, no lado norte, talvez a porta superior que Jotão construiu, e não a porta da cidade."
    - "As três cenas em Jeremias pertencem a seus sofrimentos. Quando o sacerdote Pasur ouviu Jeremias profetizar, “espancou o profeta Jeremias e o colocou no tronco que estava na porta superior de Benjamim”. Durante o cerco, quando os babilônios se haviam retirado por algum tempo, Jeremias partiu para Benjamim, “Quando ele estava na porta de Benjamim, estava ali um capitão da guarda, cujo nome era Jerias”, que o prendeu dizendo: “Você está desertando para os caldeus!”, e ele foi espancado e encarcerado. Mais tarde, quando os príncipes o desceram à cisterna, Ebede-Meleque, o etíope, achou o rei “sentado na porta de Benjamim”, a porta onde os reis julgavam, e obteve licença para tirá-lo de lá."
    - "A visão de Zacarias põe a porta na borda da cidade restaurada, que se estenderá “desde a porta de Benjamim até o lugar da primeira porta, até a porta da esquina, e desde a torre de Hananel até os lagares do rei”. Por onde corria a muralha norte dessa Jerusalém é discutido, e suas portas só são conhecidas pelos textos."
  de:
    - "Das Benjamintor war ein Tor Jerusalems in den letzten Jahren des Königreichs Juda, benannt nach der Straße, die hindurchführte: nach Norden, ins Gebiet Benjamins, Richtung Anatot, Gibea und Rama. Nichts davon wurde gefunden. Sacharja, der die Stadt von Osten nach Westen aufzählt, nennt es vor „dem ersten Tor“ und „dem Ecktor“, was es in die Nähe des Nordostens setzt, und viele Gelehrte halten es für das Tor, das Nehemia später das Schaftor nannte, während andere es dem Ephraimtor gleichsetzen. Jeremia spricht auch vom „Obertor Benjamin, welches am Hause des HERRN ist“; das scheint ein Tor der Tempelvorhöfe auf ihrer Nordseite zu sein, vielleicht das obere Tor, das Jotam baute, und nicht das Stadttor."
    - "Alle drei Szenen bei Jeremia gehören zu seinen Leiden. Als der Priester Paschhur Jeremia weissagen hörte, „schlug er den Propheten Jeremia und legte ihn in den Stock unter dem Obertor Benjamin“. Während der Belagerung, als die Babylonier zeitweise abgezogen waren, wollte Jeremia nach Benjamin gehen: „Und da er unter das Tor Benjamin kam, da war einer bestellt zum Torhüter, mit Namen Jeria“, der ihn mit den Worten ergriff: „Du willst zu den Chaldäern fallen“, und er wurde geschlagen und eingekerkert. Später, als die Fürsten ihn in die Zisterne hinabgelassen hatten, fand Ebed-Melech der Äthiopier den König, der „im Tor Benjamin“ saß, im Tor, wo Könige Recht sprachen, und erwirkte die Erlaubnis, ihn herauszuziehen."
    - "Sacharjas Vision setzt das Tor an den Rand der wiederhergestellten Stadt, die stehen wird „vom Tor Benjamin bis an den Ort des ersten Tores, bis an das Ecktor, und vom Turm Hananeel bis an des Königs Kelter“. Wo die Nordmauer jenes Jerusalem verlief, ist umstritten, und seine Tore sind nur aus den Texten bekannt."
  fr:
    - "La Porte de Benjamin était une porte de Jérusalem durant les dernières années du royaume de Juda, nommée d’après la route qui la traversait : au nord, vers le territoire de Benjamin, en direction d’Anathoth, de Guibea et de Rama. Rien n’en a été retrouvé. Zacharie, énumérant la ville d’est en ouest, la nomme avant « la première porte » et « la porte des angles », ce qui la met vers le nord-est, et beaucoup de savants la tiennent pour la porte que Néhémie appela plus tard Porte des Brebis, bien que d’autres l’identifient à la Porte d’Éphraïm. Jérémie parle aussi de « la porte supérieure de Benjamin, dans la maison de l’Éternel » ; il semble s’agir d’une porte des cours du Temple côté nord, peut-être la porte supérieure que bâtit Jotham, et non de la porte de la ville."
    - "Les trois scènes de Jérémie appartiennent à ses souffrances. Quand le prêtre Paschhur entendit Jérémie prophétiser, il « frappa Jérémie, le prophète, et le mit dans la prison qui était à la porte supérieure de Benjamin, dans la maison de l’Éternel ». Pendant le siège, quand les Babyloniens s’étaient retirés un temps, Jérémie partit pour Benjamin, et « Lorsqu’il fut à la porte de Benjamin, le commandant de la garde, nommé Jireija, fils de Schélémia, fils de Hanania, se trouvait là », qui le saisit en disant : « Tu passes aux Chaldéens ! » ; il fut battu et emprisonné. Plus tard, quand les chefs l’eurent descendu dans la citerne, Ébed-Mélec l’Éthiopien trouva le roi « assis à la porte de Benjamin », la porte où les rois rendaient la justice, et obtint la permission de le retirer."
    - "La vision de Zacharie place la porte à la lisière de la ville restaurée, qui s’étendra « depuis la porte de Benjamin jusqu’au lieu de la première porte, jusqu’à la porte des angles, et depuis la tour de Hananeel jusqu’aux pressoirs du roi ». Où courait le mur nord de cette Jérusalem est discuté, et ses portes ne sont connues que par les textes."
