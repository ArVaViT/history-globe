# Overview article (ADR 0007). Mainstream facts only; the gate is unlocated; the distinction between the city gate and the “upper gate of Benjamin” at the Temple follows the usual reading and is said to be an inference.
id: benjamin-gate
place: ae04aa8
title:
  en: "Benjamin Gate"
  ru: "Ворота Вениаминовы"
  uk: "Веніяминові ворота"
  es: "Puerta de Benjamín"
  pt: "Porta de Benjamim"
  de: "Benjamintor"
  fr: "Porte de Benjamin"
  it: "Porta di Beniamino"
  pl: "Brama Beniaminowa"
  nl: "Benjaminpoort"
  cs: "Benjamínská brána"
  sv: "Benjaminporten"
  nb: "Benjaminporten"
body:
  en:
    - "The Benjamin Gate was a gate of Jerusalem in the last years of the kingdom of Judah, named for the road through it: north, into the territory of Benjamin, towards Anathoth, Gibeah and Ramah. Nothing of it has been found. Zechariah, apparently listing the city from east to west, names it before “the first gate” and “the corner gate”, which puts it near the north-east, and many scholars take it to be the gate that Nehemiah later called the Sheep Gate, though others equate it with the Gate of Ephraim. Jeremiah also speaks of “the high gate of Benjamin, which was by the house of the LORD”; that seems to be a gate of the Temple courts on their north side, perhaps the upper gate that Jotham built, and not the city gate."
    - "All three scenes in Jeremiah belong to his sufferings. When the priest Pashur heard Jeremiah prophesy, he “smote Jeremiah the prophet, and put him in the stocks that were in the high gate of Benjamin”. During the siege, when the Babylonians had withdrawn for a time, Jeremiah set out for Benjamin, “and when he was in the gate of Benjamin, a captain of the ward was there, whose name was Irijah”, who seized him with the words “Thou fallest away to the Chaldeans”, and he was beaten and imprisoned. Later, when the princes had lowered him into the cistern, Ebed-melech the Ethiopian found the king “sitting in the gate of Benjamin”, and won leave to pull him out."
    - "Zechariah's vision sets the gate at the edge of the restored city, which will stand “from Benjamin's gate unto the place of the first gate, unto the corner gate, and from the tower of Hananeel unto the king's winepresses”. Where the north wall of that Jerusalem ran is debated, and its gates are known only from the texts."
  ru:
    - "Ворота Вениаминовы — ворота Иерусалима последних лет Иудейского царства, названные по дороге через них: на север, в удел Вениамина, к Анафофу, Гиве и Раме. От них ничего не найдено. Захария, по-видимому перечисляя город с востока на запад, называет их прежде «первых ворот» и «угловых ворот», что помещает их ближе к северо-востоку, и многие учёные считают их теми воротами, которые Неемия позже назвал Овечьими, а другие отождествляют с воротами Ефремовыми. Иеремия говорит ещё о колоде «у верхних ворот Вениаминовых при доме Господнем»; это, по-видимому, ворота храмовых дворов с северной стороны, быть может, верхние ворота, построенные Иоафамом, а не городские."
    - "Все три сцены у Иеремии связаны с его страданиями. Когда священник Пасхор услышал пророчество Иеремии, то, как сказано, «ударил Пасхор Иеремию пророка и посадил его в колоду, которая была у верхних ворот Вениаминовых при доме Господнем». Во время осады, когда Вавилоняне на время отошли, Иеремия пошёл в землю Вениаминову, и, «когда он был в воротах Вениаминовых, бывший там начальник стражи, по имени Иреия», задержал его со словами «ты хочешь перебежать к Халдеям?», и его били и посадили в темницу. Позже, когда князья спустили его в яму, Авдемелех Ефиоплянин нашёл царя, который «сидел тогда у ворот Вениаминовых», и получил позволение вытащить пророка."
    - "Видение Захарии ставит ворота на краю восстановленного города, который населится «от ворот Вениаминовых до места первых ворот, до угловых ворот, и от башни Анамеила до царских точил». Где шла северная стена того Иерусалима, спорят, а её ворота известны только по текстам."
  uk:
    - "Веніяминові ворота були воротами Єрусалима в останні роки царства Юди, названими за дорогою крізь них: на північ, до землі Веніяміна, до Анатоту, Гіви та Рами. Від них нічого не знайдено. Захарія, перелічуючи, як видається, місто зі сходу на захід, називає їх перед «місцем давних воріт» і «наріжними воротами», що ставить їх на північному сході, і багато вчених вважають їх тими воротами, які Неемія пізніше назвав Овечими, хоча інші ототожнюють їх з Єфремовими воротами. Єремія також говорить про «верхні ворота Беняминові у дому Господньому»; це, здається, ворота дворів Храму з їхнього північного боку, можливо, верхні ворота, які збудував Йотам, а не міська брама."
    - "Усі три сцени в Єремії належать до його страждань. Коли священник Пасхор почув пророцтво Єремії, «Ударив Пасхор пророка Еремію, та й посадив його в колоду, що була в верхніх воротях Беняминових у дому Господньому». Під час облоги, коли вавилоняни на якийсь час відступили, Єремія вирушив до землі Веніяміна, «Як же дойшов до Беняминової брами, старший сторож, на імя Іреїя Селемієнко, сина Аннїїного, зʼупинив пророка Еремію, кажучи: Ти хочеш перекинутись до Халдеїв?», і його побили та ув'язнили. Пізніше, коли князі спустили його в цистерну, Ебед-Мелех Ефіоп знайшов царя, що «седїв тодї у Беняминових воротах», і випросив дозвіл витягти його."
    - "Видіння Захарії ставить ворота на край відновленого міста, яке простягатиметься «од Беняминової брами до місця давних воріт, до наріжних воріт, і від Ананеїлової башти до царських тискарень». Де проходив північний мур того Єрусалима, дискутується, а його ворота відомі лише з текстів."
  es:
    - "La Puerta de Benjamín era una puerta de Jerusalén en los últimos años del reino de Judá, llamada así por el camino que pasaba por ella: al norte, hacia el territorio de Benjamín, en dirección a Anatot, Gabaa y Ramá. No se ha hallado nada de ella. Zacarías, que al parecer enumera la ciudad de este a oeste, la nombra antes de «la puerta primera» y «la puerta de los rincones», lo que la sitúa cerca del nordeste, y muchos estudiosos la toman por la puerta que Nehemías llamó más tarde la Puerta de las Ovejas, aunque otros la equiparan con la Puerta de Efraín. Jeremías habla también de «la puerta de Benjamín en lo alto, la cual conducía á la casa de Jehová»; parece una puerta de los atrios del Templo por su lado norte, quizá la puerta superior que construyó Jotam, y no la puerta de la ciudad."
    - "Las tres escenas de Jeremías pertenecen a sus sufrimientos. Cuando el sacerdote Pashur oyó profetizar a Jeremías, «E hirió Pashur á Jeremías profeta, y púsole en el cepo que estaba á la puerta de Benjamín en lo alto». Durante el asedio, cuando los babilonios se habían retirado por un tiempo, Jeremías salió hacia Benjamín, «Y cuando fué á la puerta de Benjamín, estaba allí un prepósito que se llamaba Irías», que lo prendió diciendo: «Tú te retiras á los Caldeos», y fue azotado y encarcelado. Más tarde, cuando los príncipes lo habían bajado a la cisterna, Ebed-melec el etíope se presentó ante el rey, «sentado el rey á la puerta de Benjamín», y obtuvo permiso para sacarlo."
    - "La visión de Zacarías sitúa la puerta en el borde de la ciudad restaurada, que se extenderá «desde la puerta de Benjamín hasta el lugar de la puerta primera, hasta la puerta de los rincones; y desde la torre de Hananeel hasta los lagares del rey». Se debate por dónde corría la muralla norte de esa Jerusalén, y sus puertas se conocen solo por los textos."
  pt:
    - "A Porta de Benjamim era uma porta de Jerusalém nos últimos anos do reino de Judá, assim chamada pela estrada que passava por ela: ao norte, para o território de Benjamim, rumo a Anatote, Gibeá e Ramá. Nada dela foi achado. Zacarias, aparentemente listando a cidade de leste a oeste, nomeia-a antes da “primeira porta” e da “porta da esquina”, o que a põe perto do nordeste, e muitos estudiosos a tomam pela porta que Neemias chamou depois Porta das Ovelhas, embora outros a igualem à Porta de Efraim. Jeremias fala também da “porta superior de Benjamim, a qual ficava na casa do SENHOR”; parece uma porta dos pátios do Templo, no lado norte, talvez a porta superior que Jotão construiu, e não a porta da cidade."
    - "As três cenas em Jeremias pertencem a seus sofrimentos. Quando o sacerdote Pasur ouviu Jeremias profetizar, “espancou o profeta Jeremias e o colocou no tronco que estava na porta superior de Benjamim”. Durante o cerco, quando os babilônios se haviam retirado por algum tempo, Jeremias partiu para Benjamim, “Quando ele estava na porta de Benjamim, estava ali um capitão da guarda, cujo nome era Jerias”, que o prendeu dizendo: “Você está desertando para os caldeus!”, e ele foi espancado e encarcerado. Mais tarde, quando os príncipes o desceram à cisterna, Ebede-Meleque, o etíope, achou o rei “sentado na porta de Benjamim”, e obteve licença para tirá-lo de lá."
    - "A visão de Zacarias põe a porta na borda da cidade restaurada, que se estenderá “desde a porta de Benjamim até o lugar da primeira porta, até a porta da esquina, e desde a torre de Hananel até os lagares do rei”. Por onde corria a muralha norte dessa Jerusalém é discutido, e suas portas só são conhecidas pelos textos."
  de:
    - "Das Benjamintor war ein Tor Jerusalems in den letzten Jahren des Königreichs Juda, benannt nach der Straße, die hindurchführte: nach Norden, ins Gebiet Benjamins, Richtung Anatot, Gibea und Rama. Nichts davon wurde gefunden. Sacharja, der die Stadt offenbar von Osten nach Westen aufzählt, nennt es vor „dem ersten Tor“ und „dem Ecktor“, was es in die Nähe des Nordostens setzt, und viele Gelehrte halten es für das Tor, das Nehemia später das Schaftor nannte, während andere es dem Ephraimtor gleichsetzen. Jeremia spricht auch vom „Obertor Benjamin, welches am Hause des HERRN ist“; das scheint ein Tor der Tempelvorhöfe auf ihrer Nordseite zu sein, vielleicht das obere Tor, das Jotam baute, und nicht das Stadttor."
    - "Alle drei Szenen bei Jeremia gehören zu seinen Leiden. Als der Priester Paschhur Jeremia weissagen hörte, „schlug er den Propheten Jeremia und legte ihn in den Stock unter dem Obertor Benjamin“. Während der Belagerung, als die Babylonier zeitweise abgezogen waren, wollte Jeremia nach Benjamin gehen: „Und da er unter das Tor Benjamin kam, da war einer bestellt zum Torhüter, mit Namen Jeria“, der ihn mit den Worten ergriff: „Du willst zu den Chaldäern fallen“, und er wurde geschlagen und eingekerkert. Später, als die Fürsten ihn in die Zisterne hinabgelassen hatten, fand Ebed-Melech der Äthiopier den König, der „im Tor Benjamin“ saß, und erwirkte die Erlaubnis, ihn herauszuziehen."
    - "Sacharjas Vision setzt das Tor an den Rand der wiederhergestellten Stadt, die stehen wird „vom Tor Benjamin bis an den Ort des ersten Tores, bis an das Ecktor, und vom Turm Hananeel bis an des Königs Kelter“. Wo die Nordmauer jenes Jerusalem verlief, ist umstritten, und seine Tore sind nur aus den Texten bekannt."
  fr:
    - "La Porte de Benjamin était une porte de Jérusalem durant les dernières années du royaume de Juda, nommée d’après la route qui la traversait : au nord, vers le territoire de Benjamin, en direction d’Anathoth, de Guibea et de Rama. Rien n’en a été retrouvé. Zacharie, énumérant apparemment la ville d’est en ouest, la nomme avant « la première porte » et « la porte des angles », ce qui la met vers le nord-est, et beaucoup de savants la tiennent pour la porte que Néhémie appela plus tard Porte des Brebis, bien que d’autres l’identifient à la Porte d’Éphraïm. Jérémie parle aussi de « la porte supérieure de Benjamin, dans la maison de l’Éternel » ; il semble s’agir d’une porte des cours du Temple côté nord, peut-être la porte supérieure que bâtit Jotham, et non de la porte de la ville."
    - "Les trois scènes de Jérémie appartiennent à ses souffrances. Quand le prêtre Paschhur entendit Jérémie prophétiser, il « frappa Jérémie, le prophète, et le mit dans la prison qui était à la porte supérieure de Benjamin, dans la maison de l’Éternel ». Pendant le siège, quand les Babyloniens s’étaient retirés un temps, Jérémie partit pour Benjamin, et « Lorsqu’il fut à la porte de Benjamin, le commandant de la garde, nommé Jireija, fils de Schélémia, fils de Hanania, se trouvait là », qui le saisit en disant : « Tu passes aux Chaldéens ! » ; il fut battu et emprisonné. Plus tard, quand les chefs l’eurent descendu dans la citerne, Ébed-Mélec l’Éthiopien trouva le roi « assis à la porte de Benjamin », et obtint la permission de le retirer."
    - "La vision de Zacharie place la porte à la lisière de la ville restaurée, qui s’étendra « depuis la porte de Benjamin jusqu’au lieu de la première porte, jusqu’à la porte des angles, et depuis la tour de Hananeel jusqu’aux pressoirs du roi ». Où courait le mur nord de cette Jérusalem est discuté, et ses portes ne sont connues que par les textes."
  it:
    - "La Porta di Beniamino era una porta di Gerusalemme negli ultimi anni del regno di Giuda, così chiamata dalla strada che vi passava: a nord, nel territorio di Beniamino, verso Anatòt, Gabaa e Rama. Nulla di essa è stato trovato. Zaccaria, elencando a quanto pare la città da est a ovest, la nomina prima di «la prima porta» e «la porta degli angoli», il che la pone a nord-est, e molti studiosi la ritengono la porta che Neemia chiamò poi Porta delle Pecore, benché altri la identifichino con la Porta di Efraim. Geremia parla anche della «porta superiore di Beniamino, nella casa dell’Eterno»; questa sembra una porta dei cortili del Tempio sul loro lato nord, forse la porta superiore che Iotam costruì, e non la porta della città."
    - "Tutte e tre le scene in Geremia appartengono alle sue sofferenze. Quando il sacerdote Pashur udì Geremia profetizzare, «percosse il profeta Geremia, e lo mise nei ceppi nella prigione ch’era nella porta superiore di Beniamino». Durante l’assedio, quando i Babilonesi si erano ritirati per un tempo, Geremia partì per il paese di Beniamino, «Ma quando fu alla porta di Beniamino, c’era quivi un capitano della guardia, per nome Ireia», che lo arrestò dicendo: «Tu vai ad arrenderti ai Caldei», ed egli fu percosso e imprigionato. Più tardi, quando i capi lo avevano calato nella cisterna, Ebed-Melech l’etiope trovò il re «seduto alla porta di Beniamino», e ottenne il permesso di tirarlo su."
    - "La visione di Zaccaria pone la porta al margine della città restaurata, che si estenderà «dalla porta di Beniamino al luogo della prima porta, la porta degli angoli, e dalla torre di Hananeel agli strettoi del re». Dove corressero le mura settentrionali di quella Gerusalemme è discusso, e le sue porte sono note soltanto dai testi."
  pl:
    - "Brama Beniaminowa była bramą Jerozolimy w ostatnich latach królestwa Judy, nazwaną od drogi, która przez nią wiodła: na północ, na terytorium Beniamina, ku Anatot, Gibea i Rama. Nic z niej nie odnaleziono. Zachariasz, wyliczając miasto najwyraźniej ze wschodu na zachód, wymienia ją przed miejscem „bramy pierwszej” i „bramy węgielnej”, co umieszcza ją na północnym wschodzie, a wielu uczonych uważa ją za bramę, którą Nehemiasz nazwał później Bramą Owczą, choć inni utożsamiają ją z Bramą Efraima. Jeremiasz mówi też o miejscu, które „było najwyższe w bramie Benjaminowej, a ta była przy domu Pańskim”; wydaje się to bramą dziedzińców Świątyni po ich północnej stronie, może górną bramą, którą zbudował Jotam, a nie bramą miejską."
    - "Wszystkie trzy sceny u Jeremiasza należą do jego cierpień. Gdy kapłan Paszchur usłyszał Jeremiasza prorokującego, „ubił Fassur Jeremijasza proroka, i dał go do więzienia, które było najwyższe w bramie Benjaminowej”. Podczas oblężenia, gdy Babilończycy na pewien czas się wycofali, Jeremiasz wyruszył do Beniamina, „gdy już był w bramie Benjaminowej, był tam przełożony nad strażą, imieniem Jeryjasz”, który pojmał go słowami „Do Chaldejczyków ty uciekasz”, i został pobity i uwięziony. Później, gdy książęta spuścili go do cysterny, Ebed-Melek Etiopczyk znalazł króla, gdy ten „siedział w bramie Benjaminowej”, i uzyskał pozwolenie na wyciągnięcie go."
    - "Wizja Zachariasza ustawia bramę na skraju odnowionego miasta, które stanie „od bramy Benjaminowej aż do miejsca bramy pierwszej i aż do bramy węgielnej, a od wieży Chananeel aż do pras królewskich”. Gdzie biegł północny mur tej Jerozolimy, jest dyskutowane, a jej bramy są znane tylko z tekstów."
  nl:
    - "De Benjaminpoort was een poort van Jeruzalem in de laatste jaren van het koninkrijk Juda, genoemd naar de weg erdoor: noordwaarts, het gebied van Benjamin in, richting Anatot, Gibea en Rama. Niets ervan is gevonden. Zacharia, de stad kennelijk van oost naar west opsommend, noemt haar vóór “de eerste poort” en “de Hoekpoort”, wat haar in het noordoosten plaatst, en veel geleerden houden haar voor de poort die Nehemia later de Schaapspoort noemde, al stellen anderen haar gelijk met de Efraïmpoort. Jeremia spreekt ook over “de bovenste poort van Benjamin, die aan het huis des HEEREN is”; dat lijkt een poort van de tempelhoven aan hun noordkant, misschien de bovenpoort die Jotam bouwde, en niet de stadspoort."
    - "Alle drie de taferelen bij Jeremia horen bij zijn lijden. Toen de priester Pashur Jeremia hoorde profeteren, “sloeg Pashur den profeet Jeremia, en hij stelde hem in de gevangenis, dewelke is in de bovenste poort van Benjamin”. Tijdens het beleg, toen de Babyloniërs zich een tijd hadden teruggetrokken, wilde Jeremia naar Benjamin gaan, “Als hij in de poort van Benjamin was, zo was daar de wachtmeester, wiens naam was Jerija”, die hem greep met de woorden “Gij wilt tot de Chaldeen vallen!”, en hij werd geslagen en gevangengezet. Later, toen de vorsten hem in de put hadden laten zakken, vond Ebed-Melech de Ethiopiër de koning “zat in de poort van Benjamin”, en verkreeg verlof hem op te halen."
    - "Zacharia’s visioen plaatst de poort aan de rand van de herstelde stad, die zal staan “van de poort van Benjamin af, tot aan de plaats van de eerste poort, tot aan de Hoekpoort toe; en van den toren van Hananeel, tot aan des konings wijnbakken toe”. Waar de noordmuur van dat Jeruzalem liep, is omstreden, en zijn poorten zijn alleen uit de teksten bekend."
  cs:
    - "Benjamínská brána byla jednou z bran Jeruzaléma v posledních letech judského království, pojmenovaná podle cesty skrz ni: na sever, na území Benjamínovo, k Anatótu, Gibeji a Rámě. Nic z ní nebylo nalezeno. Zacharjáš, vyjmenovávající město zřejmě od východu k západu, ji jmenuje před První bránou a Úhlovou bránou, což ji klade na severovýchod, a mnozí badatelé ji pokládají za bránu, kterou Nehemjáš později nazval Ovčí branou, ač jiní ji ztotožňují s Efrajimskou branou. Jeremjáš mluví též o „bráně Beniaminově hořejší, kteráž byla při domě Hospodinově“; zdá se, že jde o bránu nádvoří chrámu na jeho severní straně, snad o horní bránu, kterou postavil Jotam, a ne o bránu městskou."
    - "Všechny tři scény u Jeremjáše patří k jeho utrpením. Když kněz Pašchur slyšel Jeremjáše prorokovat, „Ubil Paschur Jeremiáše proroka, a dal jej do vězení v bráně Beniaminově hořejší“. Za obležení, když se Babyloňané na čas stáhli, vyšel Jeremjáš do země Benjamínovy, „Když pak byl v bráně Beniaminské, byl tu hejtman nad stráží, jménem Jiriáš syn Selemiáše, syna Chananiášova“, který ho zadržel slovy „K Kaldejským ty ustupuješ“, a byl zbit a uvězněn. Později, když ho knížata spustila do cisterny, našel Eved-melek Etiopan krále, který „seděl v bráně Beniaminské“, a vyprosil si svolení ho vytáhnout."
    - "Zacharjášovo vidění klade bránu na okraj obnoveného města, které bude stát „od brány Beniaminovy až k místu brány první, a až k bráně úhlové, a od věže Chananeel až k presu královskému“. Kde vedla severní hradba onoho Jeruzaléma, je sporné, a jeho brány jsou známy jen z textů."
  sv:
    - "Benjaminporten var en port i Jerusalem under Judarikets sista år, uppkallad efter vägen genom den: norrut, in i Benjamins område, mot Anatot, Giva och Rama. Ingenting av den har hittats. Sakarja, som tycks räkna upp staden från öster till väster, nämner den före ”den förra porten” och ”Hörnporten”, vilket placerar den i nordost, och många forskare tar den för den port som Nehemja senare kallade Fårporten, medan andra likställer den med Efraimsporten. Jeremia talar också om ”Övre Benjaminsporten till HERRENS hus”; det tycks vara en port till tempelförgårdarna på deras norra sida, kanske den övre port som Jotam byggde, och inte stadsporten."
    - "Alla tre scenerna hos Jeremia hör till hans lidanden. När prästen Pashur hörde Jeremia profetera, ”lät han hudflänga profeten Jeremia och satte honom i stocken i Övre Benjaminsporten till HERRENS hus”. Under belägringen, när babylonierna för en tid hade dragit sig tillbaka, tänkte Jeremia lämna staden för Benjamin: ”När han då kom till Benjaminsporten, stod där såsom vakthavande en man vid namn Jiria”, som grep honom med orden ”Du vill gå över till kaldéerna”, och han slogs och fängslades. Senare, när furstarna hade sänkt ned honom i brunnen, fann Eved-Melek etiopiern att kungen ”uppehöll sig i Benjaminsporten” och fick lov att dra upp honom."
    - "Sakarjas syn placerar porten vid kanten av den återställda staden, som ska sträcka sig ”från Benjaminsporten ända till den plats där den förra porten stod, till Hörnporten och Hananeltornet och till de kungliga vinpressarna”. Var Jerusalems norra mur löpte är omdebatterat, och dess portar är bara kända från texterna."
  nb:
    - "Benjaminporten var en port i Jerusalem i de siste årene av kongeriket Juda, oppkalt etter veien gjennom den: nordover, inn i Benjamins område, mot Anatot, Gibea og Rama. Ingenting av den er funnet. Sakarja, som tilsynelatende oppregner byen fra øst til vest, nevner den før «den forrige port» og «Hjørneporten», noe som plasserer den i nordøst, og mange forskere tar den for porten som Nehemja senere kalte Saueporten, selv om andre setter den lik Efraimsporten. Jeremia taler også om «den øvre Benjamins-port i Herrens hus»; det synes å være en port i tempelforgårdene på nordsiden, kanskje den øvre porten Jotam bygde, og ikke byporten."
    - "Alle tre scenene i Jeremia hører til hans lidelser. Da presten Pasjhur hørte Jeremia profetere, «slo» han «profeten Jeremias og satte ham i stokken i den øvre Benjamins-port i Herrens hus». Under beleiringen, da babylonerne en tid hadde trukket seg tilbake, la Jeremia ut for å dra til Benjamin, «og da han var i Benjamin-porten, så stod der en høvedsmann for vakten ved navn Jerija», som grep ham med ordene «Du vil gå over til kaldeerne», og han ble slått og fengslet. Senere, da høvdingene hadde firt ham ned i brønnen, fant Ebed-Melek, etioperen, kongen der «kongen satt da i Benjamin-porten», og fikk lov til å dra ham opp."
    - "Sakarjas syn setter porten ved kanten av den gjenreiste byen, som skal stå «like fra Benjamin-porten til det sted hvor den forrige port var, til Hjørneporten, og fra Hananels tårn til kongens vinperser». Hvor nordmuren i det Jerusalem gikk, er omdiskutert, og portene er bare kjent fra tekstene."
