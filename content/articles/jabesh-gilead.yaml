body:
  en:
    - "Jabesh-gilead was a town of Gilead east of the Jordan. Its name is thought to survive in the Wadi el-Yabis, a stream that runs down to the Jordan Valley south of Pella. Many scholars place it at Tell el-Maqlub, higher up the wadi, where the map places it; others prefer Tell Abu al-Kharaz near the wadi's mouth, excavated by a Swedish expedition under Peter Fischer from 1989, which found fortified towns of the Bronze and Iron Ages. Both sites were inhabited in the Iron Age."
    - 'In the Book of Judges, after the war against Benjamin, Israel found that no one from Jabesh-gilead had come up to Mizpeh. The city was put to the sword, and four hundred virgins taken from it were given as wives to the surviving Benjamites. Later Nahash the Ammonite besieged Jabesh and offered a covenant only if he might "thrust out all your right eyes". Saul gathered the people at Bezek, came upon the Ammonites in the morning watch and scattered them. A longer form of the story in a Samuel scroll from Qumran, like Josephus, says that Nahash had already put out the right eyes of the Israelites beyond the Jordan.'
    - 'The men of Jabesh repaid Saul. When the Philistines fastened the bodies of Saul and his sons to the wall of Beth-shan after the battle on Gilboa, all the valiant men of Jabesh went all night, took them down, burned them at Jabesh, buried their bones "under a tree at Jabesh", and fasted seven days. David, newly anointed king over Judah, blessed them for this kindness. Later he took the bones of Saul and Jonathan from them and buried them in Zelah, in the land of Benjamin, in the sepulchre of Kish.'
    - "Josephus calls Jabesh the chief city of the Gileadites and says that the bodies were buried in a place called Aroura. In the early fourth century Eusebius knew Jabesh as a village beyond the Jordan, on the hills six miles from Pella on the road to Gerasa. Nothing more is known of its later history."
  ru:
    - "Иавис Галаадский — город Галаада на восточном берегу Иордана. Его имя, как полагают, сохранилось в названии Вади-эль-Ябис — потока, сбегающего в Иорданскую долину к югу от Пеллы. Многие учёные помещают его на Телль-эль-Маклубе, выше по долине, где его показывает карта; другие предпочитают Телль-Абу-эль-Хараз у выхода потока в долину, где с 1989 г. копала шведская экспедиция Петера Фишера и нашла укреплённые города бронзового и железного веков. Оба места были обитаемы в железном веке."
    - "В книге Судей после войны с Вениамином Израиль узнал, что из Иависа Галаадского никто не приходил в Массифу. Город поразили мечом, а четыреста взятых оттуда девиц отдали в жёны уцелевшим вениамитянам. Позже Наас Аммонитянин осадил Иавис и соглашался заключить союз лишь с тем, «чтобы выколоть у каждого из вас правый глаз». Саул собрал народ в Везеке, в утреннюю стражу напал на аммонитян и рассеял их. Более полный вариант рассказа в свитке Самуила из Кумрана, как и Иосиф Флавий, сообщает, что Наас уже выколол правые глаза израильтянам за Иорданом."
    - "Жители Иависа отплатили Саулу. Когда после битвы на Гелвуе филистимляне прибили тела Саула и его сыновей к стене Беф-Сана, все люди сильные из Иависа шли всю ночь, сняли их, сожгли в Иависе, погребли кости «под дубом в Иависе» и постились семь дней. Давид, только что помазанный на царство над домом Иудиным, благословил их за эту милость. Позже он взял у них кости Саула и Ионафана и похоронил их в Цела, в земле Вениаминовой, во гробе Киса."
    - "Иосиф Флавий называет Иавис главным городом галаадитян и говорит, что тела погребли в месте, называемом Арура. В начале IV века Евсевий знал Иавис как селение за Иорданом, в горах, в шести милях от Пеллы по дороге в Герасу. О дальнейшей его истории ничего не известно."
  uk:
    - "Явіс Гілеадський був містом Гілеаду на схід від Йордану. Вважають, що його назва зберігається у Ваді-ель-Явіс, потоці, що збігає до Йорданської долини на південь від Пелли. Багато дослідників розміщують його в Телль-ель-Макляб, вище по ваді, де його позначає карта; інші віддають перевагу Телль-Абу-ель-Харазу біля гирла вади, розкопаному шведською експедицією під керівництвом Петера Фішера від 1989 року, що знайшла укріплені міста бронзового та залізного віків. Обидва місця були заселені в залізному віці."
    - "У Книзі Суддів, після війни проти Веніямина, Ізраїль виявив, що ніхто з Явіса Гілеадського не прийшов до Міцпе. Місто було віддане мечеві, а чотириста дівчат, узятих із нього, віддали за дружин вцілілим веніяминцям. Пізніше Наас Аммонітянин облягав Явіс і запропонував союз лише за умови, що «виколов я кожному з вас праве око». Саул зібрав народ у Безеці, напав на аммонітян у ранню сторожу й розсіяв їх. Довша форма оповіді в сувої Самуїла з Кумрана, як і Йосиф Флавій, каже, що Наас уже виколов праві очі ізраїльтянам по той бік Йордану."
    - "Люди Явіса відплатили Саулові. Коли філістимляни прибили тіла Саула і його синів до муру Бет-Шеана після битви на Гілбоа, всі хоробрі люди Явіса йшли всю ніч, зняли їх, спалили в Явісі, поховали їхні кості «під дубом у Явисї» і постили сім днів. Давид, щойно помазаний царем над Юдою, благословив їх за цю доброту. Пізніше він забрав у них кості Саула та Йонатана й поховав їх у Селі, в землі Веніямина, в гробниці Кіша."
    - "Йосиф Флавій називає Явіс головним містом гілеадян і каже, що тіла було поховано в місці, званому Аруру. На початку IV ст. Євсевій знав Явіс як село по той бік Йордану, на пагорбах за шість миль від Пелли на дорозі до Гераси. Більше нічого про його пізнішу історію невідомо."
  es:
    - "Jabes de Galaad era una población de Galaad al este del Jordán. Se cree que su nombre sobrevive en el Wadi el-Yabis, un arroyo que baja al valle del Jordán al sur de Pella. Muchos estudiosos la sitúan en Tell el-Maqlub, más arriba del wadi, donde la pone el mapa; otros prefieren Tell Abu al-Kharaz, cerca de la desembocadura del wadi, excavado por una expedición sueca bajo Peter Fischer desde 1989, que halló ciudades fortificadas de las Edades del Bronce y del Hierro. Ambos sitios estuvieron habitados en la Edad del Hierro."
    - "En el libro de los Jueces, tras la guerra contra Benjamín, Israel descubrió que nadie de Jabes de Galaad había subido a Mizpa. La ciudad fue pasada a espada, y cuatrocientas doncellas tomadas de ella fueron dadas por esposas a los benjaminitas supervivientes. Más tarde Nahas el amonita sitió Jabes y ofreció una alianza solo si podía hacer que «á cada uno de todos vosotros saque el ojo derecho». Saúl reunió al pueblo en Bezec, cayó sobre los amonitas a la vela de la mañana y los dispersó. Una forma más larga del relato en un rollo de Samuel de Qumrán, como Josefo, dice que Nahas había sacado ya el ojo derecho a los israelitas del otro lado del Jordán."
    - "Los hombres de Jabes pagaron a Saúl. Cuando los filisteos clavaron los cuerpos de Saúl y de sus hijos en el muro de Bet-seán tras la batalla de Gilboa, todos los hombres valientes de Jabes anduvieron toda la noche, los bajaron, los quemaron en Jabes, sepultaron sus huesos «debajo de un árbol en Jabes» y ayunaron siete días. David, recién ungido rey de Judá, los bendijo por esta bondad. Más tarde tomó de ellos los huesos de Saúl y Jonatán y los sepultó en Sela, en tierra de Benjamín, en el sepulcro de Cis."
    - "Josefo llama a Jabes la ciudad principal de los galaaditas y dice que los cuerpos fueron enterrados en un lugar llamado Aroura. A comienzos del siglo IV Eusebio conocía Jabes como una aldea al otro lado del Jordán, en las colinas a seis millas de Pella, en el camino a Gerasa. No se sabe nada más de su historia posterior."
  pt:
    - "Jabes-Gileade era uma cidade de Gileade a leste do Jordão. Pensa-se que seu nome sobrevive no uádi el-Yabis, um riacho que desce ao vale do Jordão ao sul de Pela. Muitos estudiosos a situam em Tell el-Maqlub, mais acima no uádi, onde o mapa a coloca; outros preferem Tell Abu al-Kharaz, perto da foz do uádi, escavado por uma expedição sueca sob Peter Fischer desde 1989, que achou cidades fortificadas das Idades do Bronze e do Ferro. Ambos os sítios foram habitados na Idade do Ferro."
    - "No livro de Juízes, depois da guerra contra Benjamim, Israel descobriu que ninguém de Jabes-Gileade subira a Mispa. A cidade foi passada ao fio da espada, e quatrocentas virgens tomadas dela foram dadas por mulheres aos benjamitas sobreviventes. Mais tarde Naás, o amonita, sitiou Jabes e ofereceu um pacto apenas se pudesse “arrancar o olho direito de cada um de vocês”. Saul reuniu o povo em Bezeque, caiu sobre os amonitas na vigília da manhã e os dispersou. Uma forma mais longa da história num rolo de Samuel de Qumran, como Josefo, diz que Naás já havia furado o olho direito dos israelitas do outro lado do Jordão."
    - "Os homens de Jabes retribuíram a Saul. Quando os filisteus prenderam os corpos de Saul e de seus filhos ao muro de Bete-Seã depois da batalha em Gilboa, todos os homens valentes de Jabes caminharam a noite toda, tiraram-nos, queimaram-nos em Jabes, sepultaram seus ossos “debaixo da tamargueira em Jabes” e jejuaram sete dias. Davi, recém-ungido rei sobre Judá, abençoou-os por essa bondade. Mais tarde tomou deles os ossos de Saul e Jônatas e os sepultou em Zela, na terra de Benjamim, no sepulcro de Quis."
    - "Josefo chama Jabes a principal cidade dos gileaditas e diz que os corpos foram sepultados num lugar chamado Aroura. No início do século IV, Eusébio conheceu Jabes como uma aldeia além do Jordão, nas colinas a seis milhas de Pela, no caminho de Gerasa. Nada mais se sabe de sua história posterior."
  de:
    - "Jabesch in Gilead war eine Stadt Gileads östlich des Jordan. Sein Name soll im Wadi el-Jabis fortleben, einem Bach, der südlich von Pella ins Jordantal hinabläuft. Viele Forscher setzen es bei Tell el-Maqlub weiter oben im Wadi an, wo die Karte es ansetzt; andere bevorzugen Tell Abu al-Charaz nahe der Mündung des Wadi, ab 1989 von einer schwedischen Expedition unter Peter Fischer ausgegraben, die befestigte Städte der Bronze- und Eisenzeit fand. Beide Stätten waren in der Eisenzeit bewohnt."
    - "Im Buch der Richter stellte Israel nach dem Krieg gegen Benjamin fest, dass niemand aus Jabesch in Gilead nach Mizpe heraufgekommen war. Die Stadt wurde mit dem Schwert geschlagen, und vierhundert aus ihr genommene Jungfrauen wurden den überlebenden Benjaminitern zu Frauen gegeben. Später belagerte Nahas der Ammoniter Jabesch und bot einen Bund nur an, wenn er ihnen allen „das rechte Auge aussteche“. Saul versammelte das Volk bei Besek, überfiel die Ammoniter in der Morgenwache und zerstreute sie. Eine längere Fassung der Geschichte in einer Samuelrolle aus Qumran sagt wie Josephus, Nahas habe den Israeliten jenseits des Jordan schon die rechten Augen ausgestochen."
    - "Die Männer von Jabesch vergalten es Saul. Als die Philister die Leichname Sauls und seiner Söhne nach der Schlacht auf dem Gilboa an die Mauer von Bet-Schean hefteten, gingen alle streitbaren Männer von Jabesch die ganze Nacht, nahmen sie ab, verbrannten sie in Jabesch, „begruben“ ihre Gebeine „unter den Baum zu Jabes“ und fasteten sieben Tage. David, der eben zum König über Juda gesalbt war, segnete sie für diese Barmherzigkeit. Später ließ er sich die Gebeine Sauls und Jonatans von ihnen holen und begrub sie in Zela im Land Benjamin im Grab von Sauls Vater Kis."
    - "Josephus nennt Jabesch die Hauptstadt der Gileaditer und sagt, die Leichname seien an einem Ort namens Aroura bestattet worden. Im frühen 4. Jahrhundert kannte Eusebius Jabesch als Dorf jenseits des Jordan, auf den Hügeln sechs Meilen von Pella an der Straße nach Gerasa. Mehr ist von seiner späteren Geschichte nicht bekannt."
  fr:
    - "Jabès en Galaad était une ville de Galaad, à l’est du Jourdain. On pense que son nom survit dans l’oued el-Yabis, un cours d’eau qui descend vers la vallée du Jourdain au sud de Pella. Beaucoup de spécialistes la placent à Tell el-Maqlub, plus haut dans l’oued, où la carte la met ; d’autres préfèrent Tell Abu al-Kharaz près de l’embouchure de l’oued, fouillé par une expédition suédoise sous Peter Fischer depuis 1989, qui y a trouvé des villes fortifiées des âges du Bronze et du Fer. Les deux sites furent habités à l’âge du Fer."
    - "Dans le livre des Juges, après la guerre contre Benjamin, Israël constata que personne de Jabès en Galaad n’était monté à Mitspé. La ville fut passée au fil de l’épée, et quatre cents jeunes filles vierges qu’on y prit furent données pour femmes aux Benjamites survivants. Plus tard, Nachasch l’Ammonite assiégea Jabès et n’offrit une alliance qu’à la condition « que je vous crève à tous l’œil droit ». Saül rassembla le peuple à Bézek, tomba sur les Ammonites à la veille du matin et les dispersa. Une forme plus longue du récit dans un rouleau de Samuel de Qumrân, comme Josèphe, dit que Nachasch avait déjà crevé l’œil droit des Israélites d’au-delà du Jourdain."
    - "Les hommes de Jabès rendirent à Saül son bienfait. Quand les Philistins fixèrent les corps de Saül et de ses fils au mur de Beth-Schean après la bataille de Guilboa, tous les vaillants hommes de Jabès marchèrent toute la nuit, les descendirent, les brûlèrent à Jabès, enterrèrent leurs os « sous le tamaris à Jabès » et jeûnèrent sept jours. David, tout juste oint roi sur Juda, les bénit pour cette bienveillance. Plus tard, il reprit chez eux les os de Saül et de Jonathan et les enterra à Tséla, au pays de Benjamin, dans le sépulcre de Kis."
    - "Josèphe appelle Jabès la principale ville des Galaadites et dit que les corps furent ensevelis en un lieu nommé Aroura. Au début du IVe siècle, Eusèbe connaissait Jabès comme un village au-delà du Jourdain, sur les collines à six milles de Pella sur la route de Gérasa. On ne sait rien de plus de son histoire ultérieure."
  pl:
    - "Jabesz-Gilead było miastem Gileadu na wschód od Jordanu. Uważa się, że jego nazwa przetrwała w Wadi el-Jabis, strumieniu spływającym do Doliny Jordanu na południe od Pelli. Wielu uczonych umieszcza je w Tell el-Maklub, wyżej w wadi, gdzie umieszcza je mapa; inni wolą Tell Abu al-Charaz koło ujścia wadi, badany przez szwedzką ekspedycję pod kierunkiem Petera Fischera od 1989 r., która znalazła obwarowane miasta epoki brązu i żelaza. Oba stanowiska były zamieszkane w epoce żelaza."
    - "W Księdze Sędziów, po wojnie przeciw Beniaminowi, Izrael stwierdził, że nikt z Jabesz-Gilead nie przybył do Mispy. Miasto wybito mieczem, a czterysta dziewic z niego wzięto na żony dla ocalałych Beniaminitów. Później Nachasz Ammonita oblegał Jabesz i zaproponował przymierze tylko pod warunkiem: „wyłupię z was każdemu oko prawe”. Saul zebrał lud w Bezek, natarł na Ammonitów podczas porannej straży i rozproszył ich. Dłuższa wersja opowieści w zwoju Samuela z Qumran, podobnie jak Józef Flawiusz, mówi, że Nachasz już wyłupił prawe oczy Izraelitom za Jordanem."
    - "Mężowie z Jabesz odwdzięczyli się Saulowi. Gdy Filistyni przybili ciała Saula i jego synów do muru Bet-Szean po bitwie na Gilboa, wszyscy dzielni mężowie z Jabesz szli całą noc, zdjęli je, spalili w Jabesz, pogrzebali ich kości „pod drzewem w Jabes” i pościli siedem dni. Dawid, świeżo namaszczony na króla Judy, pobłogosławił ich za tę uprzejmość. Później odebrał od nich kości Saula i Jonatana i pochował je w Sela, w ziemi Beniamina, w grobie Kisza."
    - "Józef Flawiusz nazywa Jabesz głównym miastem Gileadczyków i mówi, że ciała pochowano w miejscu zwanym Aroura. Na początku IV w. Euzebiusz znał Jabesz jako wieś za Jordanem, na wzgórzach sześć mil od Pelli przy drodze do Gerasy. Nic więcej o jego późniejszych dziejach nie wiadomo."
  it:
    - "Iabes di Galaad era una città di Galaad a est del Giordano. Si pensa che il suo nome sopravviva nel Wadi el-Yabis, un torrente che scende alla valle del Giordano a sud di Pella. Molti studiosi la pongono a Tell el-Maqlub, più in alto lungo il wadi, dove la mappa la colloca; altri preferiscono Tell Abu al-Kharaz presso la foce del wadi, scavato da una spedizione svedese sotto Peter Fischer dal 1989, che trovò città fortificate dell’età del Bronzo e del Ferro. Entrambi i siti furono abitati nell’età del Ferro."
    - "Nel libro dei Giudici, dopo la guerra contro Beniamino, Israele scoprì che nessuno di Iabes di Galaad era salito a Mizpa. La città fu passata a fil di spada, e quattrocento fanciulle prese da essa furono date in mogli ai Beniaminiti superstiti. Più tardi Naas l’Ammonita assediò Iabes e offrì un’alleanza solo a condizione di poter cavare a tutti «l’occhio destro». Saul radunò il popolo a Bezec, piombò sugli Ammoniti sul far del mattino e li disperse. Una forma più lunga della storia in un rotolo di Samuele di Qumran, come Giuseppe Flavio, dice che Naas aveva già cavato l’occhio destro agli Israeliti al di là del Giordano."
    - "Gli uomini di Iabes ricambiarono Saul. Quando i Filistei fissarono i corpi di Saul e dei suoi figli al muro di Beth-Shean dopo la battaglia sul Ghilboa, tutti i valorosi di Iabes camminarono tutta la notte, li tolsero, li bruciarono a Iabes, seppellirono le loro ossa «sotto alla tamerice di Jabes» e digiunarono sette giorni. Davide, appena unto re di Giuda, li benedisse per questa benignità. Più tardi prese da loro le ossa di Saul e di Gionata e le seppellì a Zela, nel paese di Beniamino, nel sepolcro di Kis."
    - "Giuseppe Flavio chiama Iabes la città principale dei Galaaditi e dice che i corpi furono sepolti in un luogo chiamato Aroura. All’inizio del IV secolo Eusebio conosceva Iabes come un villaggio oltre il Giordano, sulle colline a sei miglia da Pella sulla strada per Gerasa. Nulla di più si sa della sua storia successiva."
  nl:
    - "Jabes in Gilead was een stad in Gilead ten oosten van de Jordaan. Haar naam zou voortleven in de Wadi el-Yabis, een beek die ten zuiden van Pella naar het Jordaandal stroomt. Veel geleerden plaatsen haar bij Tell el-Maqlub, hoger in de wadi, waar de kaart haar plaatst; anderen geven de voorkeur aan Tell Abu al-Kharaz bij de monding van de wadi, sinds 1989 opgegraven door een Zweedse expeditie onder Peter Fischer, die versterkte steden uit de Bronstijd en IJzertijd vond. Beide plaatsen waren in de IJzertijd bewoond."
    - "In het boek Richteren stelde Israël na de oorlog tegen Benjamin vast dat niemand van Jabes in Gilead naar Mizpa was gekomen. De stad werd met het zwaard geslagen, en vierhonderd maagden die eruit werden meegenomen, werden als vrouwen gegeven aan de overlevende Benjaminieten. Later belegerde Nachas de Ammoniet Jabes en bood een verbond aan, alleen als hij “u allen het rechteroog uitsteke”. Saul verzamelde het volk te Bezek, overviel de Ammonieten in de ochtendwake en verstrooide hen. Een uitgebreidere vorm van het verhaal in een Samuëlrol uit Qumran zegt, zoals Josephus, dat Nachas de Israëlieten aan de overkant van de Jordaan al het rechteroog had uitgestoken."
    - "De mannen van Jabes vergolden Saul. Toen de Filistijnen na de slag op de Gilboa de lichamen van Saul en zijn zonen aan de muur van Beth-Sean hadden vastgemaakt, gingen alle strijdbare mannen van Jabes de hele nacht, namen ze af, verbrandden ze te Jabes, begroeven hun beenderen “onder het geboomte te Jabes” en vastten zeven dagen. David, pas tot koning over Juda gezalfd, zegende hen voor deze weldadigheid. Later nam hij van hen de beenderen van Saul en Jonatan en begroef ze te Zela, in het land van Benjamin, in het graf van Kis."
    - "Josephus noemt Jabes de hoofdstad van de Gileadieten en zegt dat de lichamen begraven werden op een plaats genaamd Aroura. In het begin van de 4e eeuw kende Eusebius Jabes als een dorp aan de overkant van de Jordaan, op de heuvels zes mijl van Pella aan de weg naar Gerasa. Verder is van de latere geschiedenis niets bekend."
  cs:
    - "Jabeš gileadský bylo město v Gileadu východně od Jordánu. Jeho jméno se prý zachovalo ve Wádí el-Jabis, potoku, který stéká do Jordánského údolí jižně od Pelly. Mnozí učenci jej kladou do Tell el-Maqlub, výše po proudu wádí, kam jej klade mapa; jiní dávají přednost Tell Abu al-Kharaz u ústí wádí, vykopávanému švédskou expedicí pod vedením Petera Fischera od roku 1989, která nalezla opevněná města doby bronzové a železné. Obě místa byla obydlena v době železné."
    - "V Knize Soudců po válce proti Benjamínovi Izrael zjistil, že z Jabeše gileadského nikdo nepřišel do Micpy. Město bylo vyvražděno a čtyři sta panen z něj vzatých bylo dáno za ženy přeživším Benjamínovcům. Později Nachaš Amónský oblehl Jabeš a nabídl smlouvu, jen pokud „každému z vás vyloupím oko pravé“. Saul shromáždil lid v Bezeku, přepadl Amónce v ranní hlídce a rozptýlil je. Delší podoba příběhu ve svitku Samuele z Kumránu, podobně jako Josephus, praví, že Nachaš již vypíchl pravá oka Izraelcům za Jordánem."
    - "Muži z Jabeše Saulovi odplatili. Když Pelištejci přibili těla Saula a jeho synů na hradbu Bét-šanu po bitvě na Gilboa, všichni stateční muži z Jabeše šli celou noc, sňali je, spálili je v Jabeši, pochovali jejich kosti „pod stromem v Jábes“ a postili se sedm dní. David, čerstvě pomazaný král nad Judou, jim za tuto laskavost požehnal. Později od nich vzal kosti Saula a Jonatana a pochoval je v Sele v zemi Benjamínově, v hrobě Kíšově."
    - "Josephus nazývá Jabeš hlavním městem Gileadských a praví, že těla byla pohřbena na místě zvaném Aroura. Na počátku 4. století znal Eusebios Jabeš jako vesnici za Jordánem, v pahorcích šest mil od Pelly na cestě do Gerasy. Nic dalšího o jeho pozdějších dějinách není známo."
  sv:
    - "Javesh-Gilead var en stad i Gilead öster om Jordan. Dess namn tros leva kvar i Wadi el-Yabis, en å som rinner ned till Jordandalen söder om Pella. Många forskare förlägger den till Tell el-Maqlub, högre upp i wadin, där kartan placerar den; andra föredrar Tell Abu al-Kharaz nära wadins mynning, utgrävd av en svensk expedition under Peter Fischer från 1989, som fann befästa städer från brons- och järnåldern. Båda platserna var bebodda under järnåldern."
    - "I Domarboken fann Israel, efter kriget mot Benjamin, att ingen från Javesh-Gilead hade kommit upp till Mispe. Staden slogs med svärd, och fyrahundra jungfrur som togs från den gavs som hustrur åt de överlevande benjaminiterna. Senare belägrade ammoniten Nachash Javesh och bjöd förbund bara om han fick ”sticka ut högra ögat på eder alla”. Saul samlade folket i Besek, överföll ammoniterna under morgonväkten och skingrade dem. En längre form av berättelsen i en Samuelsrulle från Qumran, liksom Josefus, säger att Nachash redan hade stuckit ut högra ögat på israeliterna bortom Jordan."
    - "Männen i Javesh vedergällde Saul. När filistéerna hängde upp Sauls och hans söners kroppar på Bet-Sheans mur efter slaget på Gilboa gick alla stridbara män i Javesh hela natten, tog ned dem, brände dem i Javesh, begrov deras ben ”under tamarisken i Jabes” och fastade i sju dagar. David, nysmord till kung över Juda, välsignade dem för denna barmhärtighet. Senare hämtade han Sauls och Jonatans ben från dem och begrov dem i Sela, i Benjamins land, i Kis grav."
    - "Josefus kallar Javesh gileaditernas huvudstad och säger att kropparna begravdes på en plats som kallades Aroura. Tidigt på 300-talet kände Eusebios Javesh som en by bortom Jordan, på höjderna sex romerska mil från Pella på vägen till Gerasa. Inget mer är känt om dess senare historia."
  nb:
    - "Jabesj-Gilead var en by i Gilead øst for Jordan. Navnet antas å overleve i Wadi el-Yabis, en bekk som renner ned til Jordandalen sør for Pella. Mange forskere plasserer den ved Tell el-Maqlub, høyere oppe i wadien, der kartet plasserer den; andre foretrekker Tell Abu al-Kharaz nær wadiens munning, gravd ut av en svensk ekspedisjon under Peter Fischer fra 1989, som fant befestede byer fra bronse- og jernalder. Begge stedene var bebodd i jernalderen."
    - "I Dommerboken, etter krigen mot Benjamin, oppdaget Israel at ingen fra Jabesj-Gilead hadde kommet opp til Mispe. Byen ble slått med sverd, og fire hundre jomfruer tatt fra den ble gitt som hustruer til de overlevende benjaminittene. Senere kringsatte ammonitten Nahasj Jabesj og tilbød en pakt bare på det vilkår at «det høire øie stikkes ut på eder alle». Saul samlet folket i Besek, kom over ammonittene i morgenvakten og spredte dem. En lengre form av fortellingen i en Samuelsrull fra Qumran sier, som Josefus, at Nahasj allerede hadde stukket ut det høyre øyet på israelittene hinsides Jordan."
    - "Mennene i Jabesj gjengjeldte Saul. Da filistrene hang kroppene til Saul og hans sønner på muren i Bet-Sjean etter slaget på Gilboa, gikk alle de våpenføre mennene i Jabesj hele natten, tok dem ned, brente dem i Jabesj, begravde deres ben «under tamarisken i Jabes», og fastet i sju dager. David, nylig salvet til konge over Juda, velsignet dem for denne kjærligheten. Senere hentet han Sauls og Jonatans ben fra dem og begravde dem i Sela, i Benjamins land, i Kisjs grav."
    - "Josefus kaller Jabesj gileaditternes hovedby og sier at likene ble begravet på et sted kalt Aroura. Tidlig på 300-tallet kjente Eusebius Jabesj som en landsby hinsides Jordan, på åsene seks romerske mil fra Pella på veien til Gerasa. Ingenting mer er kjent om dens senere historie."
  tl:
    - "Ang Jabes-galaad ay isang bayan ng Gilead sa silangan ng Jordan. Iniisip na nananatili ang pangalan nito sa Wadi el-Yabis, isang batis na dumadaloy pababa sa Libis ng Jordan sa timog ng Pella. Inilalagay ito ng maraming iskolar sa Tell el-Maqlub, mas mataas sa wadi, kung saan ito inilalagay ng mapa; mas pinipili ng iba ang Tell Abu al-Kharaz malapit sa bukana ng wadi, na hinukay ng isang ekspedisyong Suweko sa ilalim ni Peter Fischer mula 1989, na nakatuklas ng mga nakukutaang bayan ng Panahon ng Tanso at Bakal. Parehong tinirhan ang dalawang lugar sa Panahon ng Bakal."
    - "Sa Aklat ng Mga Hukom, pagkatapos ng digmaan laban sa Benjamin, natuklasan ng Israel na walang dumating mula sa Jabes-galaad sa Mizpe. Ang lungsod ay pinatay sa talim ng tabak, at apat na raang dalaga na kinuha rito ay ibinigay na asawa sa natirang mga Benjaminita. Kalaunan ay kinubkob ni Naas na Ammonita ang Jabes at nag-alok ng tipan sa kondisyong “ang lahat ninyong kanang mata ay dukitin”. Tinipon ni Saul ang bayan sa Bezec, sinalakay ang mga Ammonita sa bantay sa umaga at pinangalat sila. Isang mas mahabang anyo ng kuwento sa isang balumbon ng Samuel mula sa Qumran, gaya ni Josephus, ang nagsasabing dinukit na ni Naas ang kanang mata ng mga Israelita sa kabila ng Jordan."
    - "Binayaran ng mga lalaki ng Jabes si Saul. Nang ibitin ng mga Filisteo ang mga bangkay ni Saul at ng kaniyang mga anak sa pader ng Beth-san pagkatapos ng labanan sa Gilboa, “lahat ng matapang na lalake ay bumangon at nagsilakad sa buong gabi”, kinuha sila, sinunog sa Jabes, “ibinaon ang kanilang mga buto sa ilalim ng isang puno ng tamarisko sa Jabes, at nagayuno silang pitong araw”. Pinagpala sila ni David, na bagong pinahiran ng langis na hari sa Juda, dahil sa kabaitang ito. Kalaunan ay kinuha niya sa kanila ang mga buto nina Saul at Jonathan at inilibing sa Zela, sa lupain ng Benjamin, sa libingan ni Cis."
    - "Tinatawag ni Josephus ang Jabes na pangunahing lungsod ng mga Galaadita at sinasabing inilibing ang mga bangkay sa isang lugar na tinatawag na Aroura. Sa simula ng ika-4 na siglo kilala ni Eusebio ang Jabes bilang nayon sa kabila ng Jordan, sa mga burol anim na milya mula sa Pella sa daan patungong Gerasa. Wala nang higit na nalalaman sa kalaunang kasaysayan nito."
