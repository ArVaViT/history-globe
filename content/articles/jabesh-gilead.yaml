# Overview article (ADR 0007). Mainstream facts only; the identification of the site is disputed.
id: jabesh-gilead
place: af92088
title:
  en: "Jabesh-gilead"
  ru: "Иавис Галаадский"
  uk: "Явіс Гілеадський"
  es: "Jabes de Galaad"
  pt: "Jabes-Gileade"
  de: "Jabesch in Gilead"
  fr: "Jabès en Galaad"
  pl: "Jabesz-Gilead"
  it: "Iabes di Galaad"
  nl: "Jabes in Gilead"
