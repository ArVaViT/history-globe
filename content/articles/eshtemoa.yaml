# Overview article (ADR 0007). Mainstream facts only; the identification with as-Samu is the accepted one; the date and meaning of the silver hoard are given as debated.
id: eshtemoa
place: ad68510
title:
  en: "Eshtemoa"
  ru: "Ештемо"
  uk: "Ештемоа"
  es: "Estemoa"
  pt: "Estemoa"
  de: "Eschtemoa"
  fr: "Eschthemoa"
  it: "Estemoa"
  pl: "Esztemoa"
