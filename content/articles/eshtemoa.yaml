body:
  en:
    - "Eshtemoa was a town in the southern hill country of Judah, identified since the nineteenth century with as-Samu, a large village about 14 km south of Hebron on the edge of the hills above the Negeb; the identification rests on the name, on Eusebius, who knew Esthemo as a large Jewish village in the Daroma, and on the remains found there. Joshua lists Eshtemoh with Anab and Anim in the hill district of Debir, and the town was given to the priests, the sons of Aaron, with Jattir, Hebron and Libnah. In the genealogy of Judah the name is borne by a man, “Ishbah the father of Eshtemoa”, and by “Eshtemoa the Maachathite”, the usual way the Chronicler records the founding clans of towns."
    - "Its one moment in the story is David's gift. When David came back to Ziklag with the spoil of the Amalekites, he sent part of it to the elders of Judah, “to his friends”, in the towns where he and his men had moved about during Saul's pursuit: Bethel, Ramoth of the south, Jattir, Aroer, Siphmoth, “and to them which were in Eshtemoa”, Hebron and others. Nothing more is said of the town in the Bible."
    - "In 1935–1936 L. A. Mayer and A. Reifenberg uncovered at as-Samu a synagogue of the fourth or fifth century AD, a broad hall with a niche for the Torah toward Jerusalem and a mosaic floor, later turned into a mosque; Ze'ev Yeivin dug there again in 1969–1970. Under the floor of a room built against the synagogue's north wall his team found, in a hollow in the bedrock, five Iron Age jugs holding some 28 kg of silver, two of them inked with the word “five”; Yeivin dated the jugs between the late tenth and the eighth century BC, so the tempting link with David's present is only a guess. As-Samu is today a Palestinian town in the Hebron governorate, and the synagogue stands in its centre."
  ru:
    - "Ештемо — город в южной части гор Иудиных, с XIX века отождествляемый с Ас-Саму, большим селением примерно в 14 км к югу от Хеврона, на краю гор над Негевом; отождествление опирается на имя, на Евсевия, который знал Естемо как большое иудейское селение в Дароме, и на найденные там остатки. Иисус Навин перечисляет Ештемо вместе с Анафом и Анимом в нагорном округе Давира, и город был отдан священникам, сынам Аароновым, вместе с Иаттиром, Хевроном и Ливной. В родословии Иуды имя носит человек — «Ишбаха, отца Ешфемои» — и Ешфемоа Маахатянин; так летописец обычно записывает роды, основавшие города."
    - "Единственный его миг в повествовании — подарок Давида. Вернувшись в Секелаг с добычей, взятой у Амаликитян, Давид послал часть её старейшинам Иудиным, «друзьям своим», в те города, где он и его люди скитались, пока их преследовал Саул: в Вефиль, в Рамоф южный, в Иаттир, в Ароер, в Шифмоф, «и в Естемоа», в Хеврон и другие. Больше о городе в Библии ничего не сказано."
    - "В 1935–1936 годах Л. А. Майер и А. Рейфенберг открыли в Ас-Саму синагогу IV–V века н. э. — широкий зал с нишей для Торы, обращённой к Иерусалиму, и мозаичным полом, позже обращённый в мечеть; Зеев Йейвин вёл там раскопки снова в 1969–1970 годах. Под полом комнаты, пристроенной к северной стене синагоги, его отряд нашёл в углублении скалы пять кувшинов железного века примерно с 28 кг серебра, на двух из них чернилами написано слово «пять»; Йейвин датировал кувшины временем от конца X до VIII века до н. э., так что заманчивая связь с подарком Давида остаётся лишь догадкой. Ас-Саму сегодня — палестинский город в мухафазе Хеврон, и синагога стоит в его центре."
  uk:
    - "Ештемоа було містом у південній гірській країні Юди, ототожненим від XIX ст. з ес-Саму, великим селом приблизно за 14 км на південь від Хеврона на краю гір над Негевом; ототожнення спирається на назву, на Євсевія, який знав Естемо як велике юдейське село в Дарамі, та на знайдені там рештки. Ісус Навин перелічує Ештемо з Анавом і Анімом в гірському окрузі Девіра, і місто було віддано священникам, синам Аарона, разом із Яттіром, Хевроном і Лівною. У родоводі Юди ім'я носить чоловік, «Ішбах, батько Ештемоїн», і «Ештемоа, з Махати» — звичайний спосіб, яким літописець записує родоначальні роди міст."
    - "Його єдина мить в історії — дар Давида. Коли Давид повернувся до Ціклагу з здобиччю від амаликитян, він послав частину її старійшинам Юди, «прихильним до його мужам», у міста, де він і його люди мандрували під час Саулового переслідування: Бет-Ел, Рамот південний, Яттір, Ароер, Шифмот, «і в Естемоа», Хеврон та інші. Більше Біблія про місто нічого не каже."
    - "У 1935–1936 рр. Л. А. Мейєр і А. Райфенберг відкрили в ес-Саму синагогу IV або V ст. н. е., широку залу з нішею для Тори в бік Єрусалима й мозаїчною підлогою, пізніше перетворену на мечеть; Зеев Єйвін копав там знову в 1969–1970 рр. Під підлогою кімнати, прибудованої до північної стіни синагоги, його група знайшла, в заглибині в скелі, п'ять глеків залізної доби з приблизно 28 кг срібла, на двох з яких чорнилом було написано слово «п'ять»; Єйвін датував глеки між кінцем X і VIII ст. до н. е., тож спокусливий зв'язок із Давидовим даром — лише припущення. Ес-Саму сьогодні — палестинське місто в провінції Хеврон, і синагога стоїть у його центрі."
  es:
    - "Estemoa era una ciudad de la región montañosa meridional de Judá, identificada desde el siglo XIX con as-Samu, una gran aldea a unos 14 km al sur de Hebrón, en el borde de las colinas sobre el Néguev; la identificación se apoya en el nombre, en Eusebio, que conocía Esthemo como una gran aldea judía en la Daroma, y en los restos hallados allí. Josué enumera Estemo con Anab y Anim en el distrito montañoso de Debir, y la ciudad fue dada a los sacerdotes, los hijos de Aarón, con Jatir, Hebrón y Libna. En la genealogía de Judá el nombre lo lleva un hombre, «Isba, padre de Esthemoa», y «Esthemoa de Maachâti», la manera habitual en que el cronista registra los clanes fundadores de las ciudades."
    - "Su único momento en la historia es el regalo de David. Cuando David volvió a Siclag con el botín de los amalecitas, envió parte de él a los ancianos de Judá, «sus amigos», en las ciudades por donde él y sus hombres habían andado durante la persecución de Saúl: Betel, Ramot del sur, Jatir, Aroer, Sifmot, «y á los que estaban en Esthemoa», Hebrón y otras. La Biblia no dice nada más de la ciudad."
    - "En 1935–1936 L. A. Mayer y A. Reifenberg sacaron a la luz en as-Samu una sinagoga del siglo IV o V d. C., una amplia sala con un nicho para la Torá orientado hacia Jerusalén y un suelo de mosaico, convertida más tarde en mezquita; Ze'ev Yeivin excavó allí de nuevo en 1969–1970. Bajo el suelo de una habitación construida contra el muro norte de la sinagoga, su equipo halló, en una cavidad de la roca madre, cinco jarras de la Edad del Hierro que contenían unos 28 kg de plata, dos de ellas marcadas con tinta con la palabra «cinco»; Yeivin fechó las jarras entre finales del siglo X y el VIII a. C., de modo que el tentador vínculo con el regalo de David es solo una conjetura. As-Samu es hoy una ciudad palestina de la gobernación de Hebrón, y la sinagoga se alza en su centro."
  pt:
    - "Estemoa era uma cidade nas montanhas do sul de Judá, identificada desde o século XIX com as-Samu, uma grande aldeia a cerca de 14 km ao sul de Hebrom, na borda das colinas acima do Neguebe; a identificação repousa no nome, em Eusébio, que conhecia Esthemo como uma grande aldeia judaica na Daroma, e nos vestígios achados ali. Josué lista Estemoa com Anabe e Anim no distrito montanhoso de Debir, e a cidade foi dada aos sacerdotes, filhos de Arão, com Jatir, Hebrom e Libna. Na genealogia de Judá o nome é portado por um homem, “Isbá, o pai de Estemoa”, e por “Estemoa, o maacatita”, o modo habitual de o cronista registrar os clãs fundadores das cidades."
    - "Seu único momento na narrativa é o presente de Davi. Quando Davi voltou a Ziclague com o despojo dos amalequitas, enviou parte dele aos anciãos de Judá, “seus amigos”, nas cidades por onde ele e seus homens haviam andado durante a perseguição de Saul: Betel, Ramote do Sul, Jatir, Aroer, Sifmote e Estemoa, Hebrom e outras. Nada mais se diz da cidade na Bíblia."
    - "Em 1935–1936, L. A. Mayer e A. Reifenberg descobriram em as-Samu uma sinagoga do século IV ou V d.C., um amplo salão com um nicho para a Torá voltado para Jerusalém e piso de mosaico, depois transformada em mesquita; Ze'ev Yeivin escavou ali de novo em 1969–1970. Sob o piso de um cômodo construído contra o muro norte da sinagoga, sua equipe achou, numa cavidade da rocha, cinco jarros da Idade do Ferro com cerca de 28 kg de prata, dois deles marcados a tinta com a palavra “cinco”; Yeivin datou os jarros entre o fim do século X e o VIII a.C., de modo que a tentadora ligação com o presente de Davi é só um palpite. As-Samu é hoje uma cidade palestina na província de Hebrom, e a sinagoga fica em seu centro."
  de:
    - "Eschtemoa war eine Stadt im südlichen Bergland von Juda, seit dem 19. Jahrhundert mit as-Samu gleichgesetzt, einem großen Dorf etwa 14 km südlich von Hebron am Rand des Berglandes oberhalb des Negev; die Gleichsetzung beruht auf dem Namen, auf Eusebius, der Esthemo als großes jüdisches Dorf in der Daroma kannte, und auf den dort gefundenen Resten. Josua führt Eschtemo mit Anab und Anim im Berg-Bezirk von Debir auf, und die Stadt wurde den Priestern, den Söhnen Aarons, mit Jattir, Hebron und Libna gegeben. In der Genealogie Judas wird der Name von einem Mann getragen, „Jesbah, den Vater Esthemoas“, und von „Esthemoa, der Maachathiter“, der üblichen Weise des Chronisten, die Gründerfamilien von Städten zu verzeichnen."
    - "Ihr einziger Moment in der Geschichte ist Davids Geschenk. Als David mit der Beute der Amalekiter nach Ziklag zurückkam, sandte er davon „den Ältesten in Juda, seinen Freunden“, in den Städten, in denen er und seine Männer sich während Sauls Verfolgung bewegt hatten: Bet-El, Ramot im Mittagsland, Jattir, Aroër, Schifmot, „denen zu Esthemoa“, Hebron und anderen. Mehr wird in der Bibel von der Stadt nicht gesagt."
    - "In den Jahren 1935–1936 legten L. A. Mayer und A. Reifenberg in as-Samu eine Synagoge des 4. oder 5. Jahrhunderts n. Chr. frei, einen breiten Saal mit einer Nische für die Tora in Richtung Jerusalem und einem Mosaikboden, später in eine Moschee umgewandelt; Ze’ev Yeivin grub dort 1969–1970 erneut. Unter dem Boden eines an die Nordwand der Synagoge angebauten Raumes fand sein Team in einer Vertiefung im Felsgrund fünf eisenzeitliche Krüge mit etwa 28 kg Silber, zwei davon mit dem Wort „fünf“ beschriftet; Yeivin datierte die Krüge zwischen das späte 10. und das 8. Jahrhundert v. Chr., sodass die verlockende Verbindung mit Davids Geschenk nur eine Vermutung ist. As-Samu ist heute eine palästinensische Stadt im Gouvernement Hebron, und die Synagoge steht in ihrem Zentrum."
  fr:
    - "Eschthemoa était une ville de la montagne méridionale de Juda, identifiée depuis le XIXe siècle à as-Samu, grand village à environ 14 km au sud d’Hébron, au bord des collines dominant le Négev ; l’identification repose sur le nom, sur Eusèbe, qui connaissait Esthemo comme un grand village juif dans le Daroma, et sur les vestiges qu’on y a trouvés. Josué cite Eschthemoa avec Anab et Anim dans le district montagneux de Debir, et la ville fut donnée aux prêtres, fils d’Aaron, avec Jatthir, Hébron et Libna. Dans la généalogie de Juda, le nom est porté par un homme, « Jischbach, père d’Eschthemoa », et par « Eschthemoa, le Maacathien », manière habituelle dont le Chroniqueur consigne les clans fondateurs des villes."
    - "Son seul moment dans le récit est le présent de David. Quand David revint à Tsiklag avec le butin des Amalécites, il en envoya une partie aux anciens de Juda, « à ses amis », dans les villes où lui et ses gens s’étaient déplacés pendant la poursuite de Saül : Béthel, Ramoth du Midi, Jatthir, Aroër, Siphmoth, « à ceux d’Eschthemoa », Hébron et d’autres. La Bible n’en dit rien de plus de la ville."
    - "En 1935–1936, L. A. Mayer et A. Reifenberg mirent au jour à as-Samu une synagogue du IVe ou Ve siècle apr. J.-C., vaste salle avec une niche pour la Torah vers Jérusalem et un sol de mosaïque, plus tard transformée en mosquée ; Ze’ev Yeivin y fouilla de nouveau en 1969–1970. Sous le sol d’une pièce adossée au mur nord de la synagogue, son équipe trouva, dans une cavité du roc, cinq jarres de l’âge du Fer contenant quelque 28 kg d’argent, dont deux portaient à l’encre le mot « cinq » ; Yeivin data les jarres entre la fin du Xe et le VIIIe siècle av. J.-C., si bien que le lien tentant avec le présent de David n’est qu’une conjecture. As-Samu est aujourd’hui une ville palestinienne du gouvernorat d’Hébron, et la synagogue se dresse en son centre."
  it:
    - "Estemoa era una città della regione collinare meridionale di Giuda, identificata dall’Ottocento con as-Samu, un grande villaggio a circa 14 km a sud di Ebron al margine delle colline sopra il Negheb; l’identificazione poggia sul nome, su Eusebio, che conosceva Esthemo come un grande villaggio ebraico nel Daroma, e sui resti trovati là. Giosuè elenca Estemo con Anab e Anim nel distretto collinare di Debir, e la città fu data ai sacerdoti, i figli di Aronne, con Iattir, Ebron e Libna. Nella genealogia di Giuda il nome è portato da un uomo, «Ishbah, padre di Eshtemoa», e da «Eshtemoa, il Maacatheo», il modo consueto con cui il Cronista registra i clan fondatori delle città."
    - "Il suo unico momento nella storia è il dono di Davide. Quando Davide tornò a Siclag con il bottino degli Amalekiti, ne mandò una parte agli anziani di Giuda, «suoi amici», nelle città in cui egli e i suoi uomini si erano mossi durante l’inseguimento di Saul: Betel, Ramot del sud, Iattir, Aroer, Sifmot, «a quelli d’Eshtemoa», Ebron e altre. Nulla più si dice della città nella Bibbia."
    - "Nel 1935–1936 L. A. Mayer e A. Reifenberg portarono alla luce ad as-Samu una sinagoga del IV o V secolo d.C., una sala ampia con una nicchia per la Torah verso Gerusalemme e un pavimento a mosaico, poi trasformata in moschea; Ze’ev Yeivin vi scavò di nuovo nel 1969–1970. Sotto il pavimento di una stanza costruita contro il muro nord della sinagoga la sua squadra trovò, in una cavità della roccia, cinque brocche dell’età del Ferro con circa 28 kg di argento, due delle quali segnate a inchiostro con la parola «cinque»; Yeivin datò le brocche fra la fine del X e l’VIII secolo a.C., sicché il suggestivo legame con il dono di Davide è solo un’ipotesi. As-Samu è oggi una città palestinese nel governatorato di Ebron, e la sinagoga sorge nel suo centro."
  pl:
    - "Esztemoa było miastem w południowym górskim kraju Judy, utożsamianym od XIX w. z as-Samu, dużą wsią około 14 km na południe od Hebronu na skraju wzgórz nad Negewem; utożsamienie opiera się na nazwie, na Euzebiuszu, który znał Esthemo jako dużą żydowską wieś w Daromie, i na znalezionych tam pozostałościach. Jozue wymienia Esztemoh z Anab i Anim w górskim okręgu Debir, a miasto dano kapłanom, synom Aarona, razem z Jattir, Hebronem i Libną. W rodowodzie Judy nazwę nosi człowiek: Isbach, ojciec Estemoa, i Estemoa Mahatczyk, zwykły sposób, w jaki Kronikarz zapisuje rody założycielskie miast."
    - "Jedyny moment tego miasta w opowieści to dar Dawida. Gdy Dawid wrócił do Siklag z łupem Amalekitów, posłał jego część starszym Judy, „przyjaciołom swym”, w miastach, w których on i jego ludzie przebywali podczas pościgu Saula: Betel, Ramot na południu, Jattir, Aroer, Sifmot, „i co byli w Estamo”, Hebron i innych. Biblia nie mówi o tym mieście nic więcej."
    - "W latach 1935–1936 L. A. Mayer i A. Reifenberg odsłonili w as-Samu synagogę z IV lub V w. n.e., szeroką halę z niszą na Torę zwróconą ku Jerozolimie i mozaikową posadzką, później zamienioną na meczet; Ze'ev Yeivin kopał tam ponownie w latach 1969–1970. Pod posadzką pomieszczenia przylegającego do północnej ściany synagogi jego zespół znalazł w zagłębieniu w skale pięć dzbanów z epoki żelaza zawierających około 28 kg srebra, z których dwa były opatrzone atramentem słowem „pięć”; Yeivin datował dzbany między koniec X a VIII w. p.n.e., więc nęcące powiązanie z darem Dawida jest tylko domysłem. As-Samu jest dziś palestyńskim miastem w muhafazie Hebron, a synagoga stoi w jego centrum."
  nl:
    - "Estemoa was een stad in het zuidelijke bergland van Juda, sinds de negentiende eeuw geïdentificeerd met as-Samu, een groot dorp zo'n 14 km ten zuiden van Hebron aan de rand van de heuvels boven de Negev; de identificatie berust op de naam, op Eusebius, die Esthemo kende als een groot Joods dorp in de Daroma, en op de daar gevonden resten. Jozua noemt Estemo met Anab en Anim in het heuveldistrict van Debir, en de stad werd aan de priesters, de zonen van Aäron, gegeven met Jattir, Hebron en Libna. In het geslachtsregister van Juda draagt een man de naam, “Isbah, den vader van Esthemoa”, en “Esthemoa, de Maachathiet”, de gebruikelijke manier waarop de Kroniekschrijver de stichtende clans van steden optekent."
    - "Haar ene moment in het verhaal is Davids geschenk. Toen David met de buit op de Amalekieten naar Ziklag terugkeerde, zond hij een deel naar de oudsten van Juda, “zijn vrienden”, in de steden waar hij en zijn mannen zich tijdens Sauls vervolging hadden bewogen: Bethel, Ramot in het zuiden, Jattir, Aroër, Sifmot, “en tot die te Esthemoa”, Hebron en andere. Verder zegt de Bijbel niets over de stad."
    - "In 1935–1936 legden L.A. Mayer en A. Reifenberg te as-Samu een synagoge uit de vierde of vijfde eeuw n.Chr. bloot, een brede zaal met een nis voor de Thora richting Jeruzalem en een mozaïekvloer, later tot moskee gemaakt; Ze'ev Yeivin groef er opnieuw in 1969–1970. Onder de vloer van een ruimte tegen de noordmuur van de synagoge vond zijn team, in een holte in de rots, vijf IJzertijdkruiken met zo'n 28 kg zilver, twee ervan met inkt beschreven met het woord “vijf”; Yeivin dateerde de kruiken tussen de late tiende en de achtste eeuw v.Chr., zodat het verleidelijke verband met Davids geschenk slechts een gok is. As-Samu is nu een Palestijnse stad in het gouvernement Hebron, en de synagoge staat in het centrum."
  cs:
    - "Eštemoa bylo město v jižních judských horách, od 19. století ztotožňované s as-Samu, velkou vesnicí asi 14 km jižně od Hebronu na okraji hor nad Negevem; ztotožnění spočívá na jménu, na Eusebiovi, který znal Esthemo jako velkou židovskou vesnici v Daróme, a na tamních zbytcích. Jozue uvádí Eštemoa s Anabem a Animem v horském okrese Debíru a město bylo dáno kněžím, synům Áronovým, s Jatirem, Hebronem a Libnou. V rodopise Judy nese jméno muž, jímž je „Jezba otce Estemo“, i „Estemo Maachatský“, obvyklý způsob, jímž Letopisec zaznamenává zakládající rody měst."
    - "Jeho jediný okamžik v příběhu je Davidův dar. Když se David vrátil do Siklagu s kořistí z Amalekovců, poslal její část starším Judy, „přátelům svým“, do měst, kde se on a jeho muži pohybovali za Saulova pronásledování: Bét-el, Rámot v Negevu, Jatir, Aroer, Sifmót, „a kteříž v Estemo“, Hebron a jiná. Nic víc se o městě v Bibli neříká."
    - "V letech 1935–1936 odkryli v as-Samu L. A. Mayer a A. Reifenberg synagogu ze 4. nebo 5. století n. l., širokou síň s výklenkem pro Tóru směrem k Jeruzalému a mozaikovou podlahou, později přeměněnou na mešitu; Ze'ev Yeivin tam kopal znovu v letech 1969–1970. Pod podlahou místnosti přistavěné k severní stěně synagogy našel jeho tým v prohlubni ve skále pět džbánů z doby železné obsahujících asi 28 kg stříbra, dva z nich označené inkoustem slovem „pět“; Yeivin je datoval mezi konec 10. a 8. století př. n. l., takže svůdné spojení s Davidovým darem je jen dohad. As-Samu je dnes palestinské město v hebronském guvernorátu a synagoga stojí v jeho středu."
