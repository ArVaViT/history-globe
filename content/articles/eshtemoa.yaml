# Overview article (ADR 0007). Mainstream facts only; the identification with as-Samu is the accepted one; the date and meaning of the silver hoard are given as debated.
id: eshtemoa
place: ad68510
title:
  en: "Eshtemoa"
  ru: "Ештемо"
body:
  en:
    - "Eshtemoa was a town in the southern hill country of Judah, identified since the nineteenth century with as-Samu, a large village about 14 km south of Hebron on the edge of the hills above the Negeb; the identification rests on the name, on Eusebius, who knew Esthemo as a large Jewish village in the Daroma, and on the remains found there. Joshua lists Eshtemoh with Anab and Anim in the hill district of Debir, and the town was given to the priests, the sons of Aaron, with Jattir, Hebron and Libnah. In the genealogy of Judah the name is borne by a man, “Ishbah the father of Eshtemoa”, and by “Eshtemoa the Maachathite”, the usual way the Chronicler records the founding clans of towns."
    - "Its one moment in the story is David's gift. When David came back to Ziklag with the spoil of the Amalekites, he sent part of it to the elders of Judah, “to his friends”, in the towns where he and his men had moved about during Saul's pursuit: Bethel, Ramoth of the south, Jattir, Aroer, Siphmoth, “and to them which were in Eshtemoa”, Hebron and others. Nothing more is said of the town in the Bible."
    - "In 1935–1936 L. A. Mayer and A. Reifenberg uncovered at as-Samu a synagogue of the fourth or fifth century AD, a broad hall with a niche for the Torah toward Jerusalem and a mosaic floor, later turned into a mosque; Ze'ev Yeivin dug there again in 1969–1970. Under the floor of a room built against the synagogue's north wall his team found, in a hollow in the bedrock, five Iron Age jugs holding some 28 kg of silver, two of them inked with the word “five”; Yeivin dated the jugs between the late tenth and the eighth century BC, and Raz Kletter and Etty Brand later argued for the eighth, so the tempting link with David's present is only a guess. As-Samu is today a Palestinian town in the Hebron governorate, and the synagogue stands in its centre."
  ru:
    - "Ештемо — город в южной части гор Иудиных, с XIX века отождествляемый с Ас-Саму, большим селением примерно в 14 км к югу от Хеврона, на краю гор над Негевом; отождествление опирается на имя, на Евсевия, который знал Естемо как большое иудейское селение в Дароме, и на найденные там остатки. Иисус Навин перечисляет Ештемо вместе с Анафом и Анимом в нагорном округе Давира, и город был отдан священникам, сынам Аароновым, вместе с Иаттиром, Хевроном и Ливной. В родословии Иуды имя носит человек — «Ишбаха, отца Ешфемои» — и Ешфемоа Маахатянин; так летописец обычно записывает роды, основавшие города."
    - "Единственный его миг в повествовании — подарок Давида. Вернувшись в Секелаг с добычей, взятой у Амаликитян, Давид послал часть её старейшинам Иудиным, «друзьям своим», в те города, где он и его люди скитались, пока их преследовал Саул: в Вефиль, в Рамоф южный, в Иаттир, в Ароер, в Шифмоф, «и в Естемоа», в Хеврон и другие. Больше о городе в Библии ничего не сказано."
    - "В 1935–1936 годах Л. А. Майер и А. Рейфенберг открыли в Ас-Саму синагогу IV–V века н. э. — широкий зал с нишей для Торы, обращённой к Иерусалиму, и мозаичным полом, позже обращённый в мечеть; Зеев Йейвин вёл там раскопки снова в 1969–1970 годах. Под полом комнаты, пристроенной к северной стене синагоги, его отряд нашёл в углублении скалы пять кувшинов железного века примерно с 28 кг серебра, на двух из них чернилами написано слово «пять»; Йейвин датировал кувшины временем от конца X до VIII века до н. э., а Раз Клеттер и Этти Бранд позже отнесли их к VIII веку, так что заманчивая связь с подарком Давида остаётся лишь догадкой. Ас-Саму сегодня — палестинский город в мухафазе Хеврон, и синагога стоит в его центре."
