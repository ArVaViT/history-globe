body:
  en:
    - "Tarsus lies in the plain of Cilicia in southern Turkey, about 20 km inland from the Mediterranean. In antiquity the cold, swift river Cydnus flowed through the middle of the city and into a lagoon near the coast that served as its harbour. The mound of Gözlükule, excavated by Hetty Goldman in the 1930s and 1940s, shows settlement from the Neolithic onward, and Hittite texts of the second millennium BC name the town Tarsa. In 401 BC Xenophon found it a large and prosperous city, the seat of the Cilician king Syennesis, who ruled under the Persians."
    - "Alexander the Great reached Tarsus in 333 BC and fell gravely ill there, by one account after bathing in the Cydnus. After the battle of Philippi, Mark Antony made Tarsus a free city exempt from taxes, and in 41 BC Cleopatra sailed up the Cydnus to meet him in her gilded barge. Strabo, writing under Augustus, says its people surpassed even Athens and Alexandria in their zeal for philosophy and learning; the Stoic Athenodorus, teacher of Augustus, governed the city on his return home."
    - 'Paul was born in Tarsus. He called himself "a Jew of Tarsus, a city in Cilicia, a citizen of no mean city", and said he was brought up in Jerusalem at the feet of Gamaliel. In Damascus the Lord sent Ananias to seek "Saul, of Tarsus". After his conversion the brethren sent Paul away to Tarsus, and he went into the regions of Syria and Cilicia until Barnabas came to Tarsus to seek him and brought him to Antioch. On a later journey Paul went through Syria and Cilicia, confirming the churches.'
    - "Under the empire Tarsus remained the leading city of Cilicia. When the emperor Julian died on his Persian campaign in 363, he was buried, as he had directed, in a suburb of Tarsus beside the road to the passes of the Taurus. Diodorus, its bishop from 378, who earlier at Antioch had guided John Chrysostom and Theodore of Mopsuestia in the ascetic life, upheld the Nicene faith at the Council of Constantinople in 381."
  ru:
    - "Тарс лежит на Киликийской равнине на юге Турции, примерно в 20 км от Средиземного моря. В древности холодная и быстрая река Кидн текла через середину города и впадала у побережья в лагуну, служившую ему гаванью. Холм Гёзлюкуле, который раскапывала Хетти Голдман в 1930–1940-х гг., хранит следы поселения начиная с неолита, а хеттские тексты II тысячелетия до н. э. называют город Тарса. В 401 г. до н. э. Ксенофонт застал его большим и процветающим городом, резиденцией киликийского царя Сиеннесия, правившего под властью персов."
    - "Александр Македонский дошёл до Тарса в 333 г. до н. э. и тяжело заболел здесь — по одному из рассказов, искупавшись в Кидне. После битвы при Филиппах Марк Антоний сделал Тарс свободным городом, освобождённым от податей, а в 41 г. до н. э. Клеопатра поднялась по Кидну на своей позолоченной ладье, чтобы встретиться с ним. Страбон, писавший при Августе, говорит, что жители Тарса в любви к философии и учёности превзошли даже Афины и Александрию; стоик Афинодор, учитель Августа, вернувшись на родину, управлял городом."
    - "Павел родился в Тарсе. Он называл себя «Иудеянин, Тарсянин, гражданин небезызвестного Киликийского города» и говорил, что воспитан в Иерусалиме при ногах Гамалиила. В Дамаске Господь послал Ананию спросить «Тарсянина, по имени Савла». После обращения братия препроводили Павла в Тарс, и он отошёл в страны Сирии и Киликии, пока Варнава не пришёл в Тарс искать его и не привёл в Антиохию. В одном из последующих путешествий Павел проходил Сирию и Киликию, утверждая церкви."
    - "При императорах Тарс оставался главным городом Киликии. Когда в 363 г. император Юлиан погиб в персидском походе, его, как он и велел, похоронили в предместье Тарса у дороги к проходам Тавра. Диодор, епископ Тарса с 378 г., который ещё в Антиохии наставлял в подвижнической жизни Иоанна Златоуста и Феодора Мопсуестийского, отстаивал никейскую веру на Константинопольском соборе 381 г."
  uk:
    - "Тарс лежить на кілікійській рівнині на півдні Туреччини, приблизно за 20 км углиб від Середземного моря. У давнину холодна й швидка річка Кидн текла посеред міста і впадала в лагуну поблизу узбережжя, яка правила йому за гавань. Пагорб Гьозлюкуле, розкопаний Хетті Голдмен у 1930–1940-х роках, показує поселення від неоліту, а хетські тексти II тис. до н. е. називають місто Тарса. У 401 р. до н. е. Ксенофонт застав його великим і заможним містом, резиденцією кілікійського царя Сієннесіса, що правив під владою персів."
    - "Александр Великий дійшов до Тарса 333 р. до н. е. і тяжко захворів там — за одним переказом, скупавшись у Кидні. Після битви під Філіппами Марк Антоній зробив Тарс вільним містом, звільненим від податків, а в 41 р. до н. е. Клеопатра припливла Кидном назустріч йому в позолоченій барці. Страбон, пишучи за Августа, каже, що його мешканці перевершували навіть Афіни й Александрію в завзятті до філософії та освіти; стоїк Афінодор, учитель Августа, правив містом після повернення додому."
    - "Павло народився в Тарсі. Він називав себе «Жидовин Тарсийський, славного города Киликиї житель» і казав, що виріс у Єрусалимі при ногах Гамаліїла. У Дамаску Господь послав Ананію шукати «Тарсянина, на ймя Савла». Після навернення брати вислали Павла в Тарс, і він пішов у краї Сирії та Кілікії, доки Варнава не прийшов у Тарс шукати його й не привів до Антіохії. Під час пізнішої подорожі Павло проходив Сирією й Кілікією, утверджуючи церкви."
    - "За імперії Тарс лишався провідним містом Кілікії. Коли імператор Юліан помер під час перського походу 363 року, його поховали, як він наказав, у передмісті Тарса біля дороги до проходів Тавра. Діодор, його єпископ з 378 року, який раніше в Антіохії наставляв Івана Золотоустого й Феодора Мопсуестійського в аскетичному житті, обстоював нікейську віру на Константинопольському соборі 381 року."
  es:
    - "Tarso se encuentra en la llanura de Cilicia, en el sur de Turquía, a unos 20 km tierra adentro desde el Mediterráneo. En la Antigüedad el frío y rápido río Cidno atravesaba el centro de la ciudad y desembocaba en una laguna cercana a la costa que servía de puerto. El montículo de Gözlükule, excavado por Hetty Goldman en las décadas de 1930 y 1940, muestra un asentamiento desde el Neolítico en adelante, y textos hititas del segundo milenio a. C. nombran la ciudad Tarsa. En 401 a. C. Jenofonte la halló grande y próspera, sede del rey cilicio Siénesis, que gobernaba bajo los persas."
    - "Alejandro Magno llegó a Tarso en 333 a. C. y enfermó gravemente allí, según un relato después de bañarse en el Cidno. Tras la batalla de Filipos, Marco Antonio hizo de Tarso una ciudad libre exenta de impuestos, y en 41 a. C. Cleopatra remontó el Cidno para encontrarse con él en su barcaza dorada. Estrabón, que escribía bajo Augusto, dice que sus habitantes superaban incluso a Atenas y Alejandría en celo por la filosofía y el saber; el estoico Atenodoro, maestro de Augusto, gobernó la ciudad a su regreso a casa."
    - "Pablo nació en Tarso. Se llamó a sí mismo «hombre Judío, ciudadano de Tarso, ciudad no obscura de Cilicia», y dijo que se crio en Jerusalén a los pies de Gamaliel. En Damasco el Señor envió a Ananías a buscar a «Saulo, de Tarso». Tras su conversión, los hermanos enviaron a Pablo a Tarso, y él fue a las regiones de Siria y Cilicia hasta que Bernabé llegó a Tarso a buscarlo y lo llevó a Antioquía. En un viaje posterior Pablo recorrió Siria y Cilicia confirmando a las iglesias."
    - "Bajo el Imperio, Tarso siguió siendo la principal ciudad de Cilicia. Cuando el emperador Juliano murió en su campaña persa en 363, fue sepultado, como había dispuesto, en un suburbio de Tarso junto al camino de los pasos del Tauro. Diodoro, su obispo desde 378, que antes en Antioquía había guiado a Juan Crisóstomo y a Teodoro de Mopsuestia en la vida ascética, defendió la fe nicena en el Concilio de Constantinopla de 381."
  pt:
    - "Tarso fica na planície da Cilícia, no sul da Turquia, a cerca de 20 km do Mediterrâneo. Na Antiguidade, o frio e veloz rio Cidno atravessava o meio da cidade e desaguava numa lagoa perto da costa que lhe servia de porto. O monte de Gözlükule, escavado por Hetty Goldman nas décadas de 1930 e 1940, mostra povoamento desde o Neolítico, e textos hititas do segundo milênio a.C. dão à cidade o nome de Tarsa. Em 401 a.C., Xenofonte a encontrou grande e próspera, sede do rei cilício Siénesis, que governava sob os persas."
    - "Alexandre, o Grande, chegou a Tarso em 333 a.C. e adoeceu gravemente ali, segundo um relato depois de banhar-se no Cidno. Depois da batalha de Filipos, Marco Antônio fez de Tarso uma cidade livre isenta de impostos, e em 41 a.C. Cleópatra subiu o Cidno em sua barcaça dourada para encontrá-lo. Estrabão, escrevendo sob Augusto, diz que seu povo superava até Atenas e Alexandria no zelo pela filosofia e pelo saber; o estoico Atenodoro, mestre de Augusto, governou a cidade ao voltar para casa."
    - "Paulo nasceu em Tarso. Ele se disse “um judeu de Tarso, na Cilícia, cidadão de uma cidade importante”, e afirmou ter sido criado em Jerusalém aos pés de Gamaliel. Em Damasco, o Senhor mandou Ananias procurar “Saulo, de Tarso”. Depois de sua conversão, os irmãos mandaram Paulo para Tarso, e ele foi às regiões da Síria e da Cilícia até que Barnabé veio a Tarso procurá-lo e o levou a Antioquia. Numa viagem posterior, Paulo percorreu a Síria e a Cilícia, confirmando as igrejas."
    - "Sob o império, Tarso continuou a principal cidade da Cilícia. Quando o imperador Juliano morreu em sua campanha persa, em 363, foi sepultado, como determinara, num subúrbio de Tarso, junto à estrada das passagens do Tauro. Diodoro, seu bispo desde 378, que antes, em Antioquia, havia guiado João Crisóstomo e Teodoro de Mopsuéstia na vida ascética, defendeu a fé nicena no Concílio de Constantinopla, em 381."
  de:
    - "Tarsus liegt in der Ebene von Kilikien in der Südtürkei, etwa 20 km landeinwärts vom Mittelmeer. In der Antike floss der kalte, reißende Kydnos mitten durch die Stadt in eine Lagune nahe der Küste, die ihr als Hafen diente. Der Hügel Gözlükule, in den 1930er und 1940er Jahren von Hetty Goldman ausgegraben, zeigt Besiedlung seit der Jungsteinzeit, und hethitische Texte des zweiten Jahrtausends v. Chr. nennen die Stadt Tarsa. 401 v. Chr. fand Xenophon sie als große, wohlhabende Stadt, Sitz des kilikischen Königs Syennesis, der unter den Persern herrschte."
    - "Alexander der Große erreichte Tarsus 333 v. Chr. und erkrankte dort schwer, nach einem Bericht nach einem Bad im Kydnos. Nach der Schlacht bei Philippi machte Markus Antonius Tarsus zur freien, steuerbefreiten Stadt, und 41 v. Chr. fuhr Kleopatra auf ihrer vergoldeten Barke den Kydnos hinauf, um ihn zu treffen. Strabon sagt unter Augustus, seine Bewohner übertrafen im Eifer für Philosophie und Bildung selbst Athen und Alexandria; der Stoiker Athenodoros, Lehrer des Augustus, regierte die Stadt nach seiner Heimkehr."
    - "Paulus wurde in Tarsus geboren. Er nannte sich „ein jüdischer Mann von Tarsus, ein Bürger einer namhaften Stadt in Zilizien“ und sagte, er sei in Jerusalem zu Füßen Gamaliëls erzogen worden. In Damaskus sandte der Herr Hananias, „nach einem namens Saul von Tarsus“ zu fragen. Nach seiner Bekehrung schickten die Brüder Paulus nach Tarsus, und er zog in die Gebiete von Syrien und Kilikien, bis Barnabas nach Tarsus kam, ihn zu suchen, und ihn nach Antiochia brachte. Auf einer späteren Reise zog Paulus durch Syrien und Kilikien und stärkte die Gemeinden."
    - "Unter dem Kaiserreich blieb Tarsus die führende Stadt Kilikiens. Als Kaiser Julian 363 auf seinem Perserfeldzug starb, wurde er, wie er verfügt hatte, in einem Vorort von Tarsus an der Straße zu den Pässen des Taurus beigesetzt. Diodor, ab 378 sein Bischof, der zuvor in Antiochia Johannes Chrysostomos und Theodor von Mopsuestia im asketischen Leben angeleitet hatte, verteidigte beim Konzil von Konstantinopel 381 den nicänischen Glauben."
  fr:
    - "Tarse se trouve dans la plaine de Cilicie, dans le sud de la Turquie, à environ 20 km à l’intérieur des terres depuis la Méditerranée. Dans l’Antiquité, le Cydnus, fleuve froid et rapide, traversait le milieu de la ville et se jetait dans une lagune proche de la côte qui lui servait de port. Le tertre de Gözlükule, fouillé par Hetty Goldman dans les années 1930 et 1940, montre une occupation dès le néolithique, et des textes hittites du IIe millénaire av. J.-C. nomment la ville Tarsa. En 401 av. J.-C., Xénophon la trouva grande et prospère, siège du roi cilicien Syennésis, qui régnait sous les Perses."
    - "Alexandre le Grand arriva à Tarse en 333 av. J.-C. et y tomba gravement malade, selon un récit après s’être baigné dans le Cydnus. Après la bataille de Philippes, Marc Antoine fit de Tarse une ville libre exemptée d’impôts, et en 41 av. J.-C. Cléopâtre remonta le Cydnus pour le rencontrer sur sa barque dorée. Strabon, écrivant sous Auguste, dit que ses habitants surpassaient même Athènes et Alexandrie par leur zèle pour la philosophie et le savoir ; le stoïcien Athénodore, maître d’Auguste, gouverna la ville à son retour chez lui."
    - "Paul naquit à Tarse. Il se disait « Juif, de Tarse en Cilicie, citoyen d’une ville qui n’est pas sans importance », et affirmait avoir été élevé à Jérusalem aux pieds de Gamaliel. À Damas, le Seigneur envoya Ananias chercher « Saul de Tarse ». Après sa conversion, les frères firent partir Paul pour Tarse, et il alla dans les contrées de Syrie et de Cilicie jusqu’à ce que Barnabas vienne à Tarse le chercher et l’amène à Antioche. Lors d’un voyage ultérieur, Paul parcourut la Syrie et la Cilicie en fortifiant les Églises."
    - "Sous l’Empire, Tarse resta la première ville de Cilicie. Quand l’empereur Julien mourut lors de sa campagne perse en 363, il fut enterré, comme il l’avait voulu, dans un faubourg de Tarse près de la route des passes du Taurus. Diodore, son évêque depuis 378, qui avait auparavant guidé à Antioche Jean Chrysostome et Théodore de Mopsueste dans la vie ascétique, défendit la foi de Nicée au concile de Constantinople en 381."
