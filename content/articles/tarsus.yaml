body:
  en:
    - "Tarsus lies in the plain of Cilicia in southern Turkey, about 15 km inland from the Mediterranean. In antiquity the cold, swift river Cydnus flowed through the middle of the city and into a lagoon near the coast that served as its harbour. The mound of Gözlükule, excavated by Hetty Goldman in the 1930s and 1940s, shows settlement from the Neolithic onward, and Hittite texts of the second millennium BC name the town Tarsa. In 401 BC Xenophon found it a large and prosperous city, the seat of the Cilician king Syennesis, who ruled under the Persians."
    - "Alexander the Great reached Tarsus in 333 BC and fell gravely ill there, by one account after bathing in the Cydnus. After the battle of Philippi, Mark Antony made Tarsus a free city exempt from taxes, and in 41 BC Cleopatra sailed up the Cydnus to meet him in her gilded barge. Strabo, writing under Augustus, says its people surpassed even Athens and Alexandria in their zeal for philosophy and learning; the Stoic Athenodorus, teacher of Augustus, governed the city on his return home."
    - 'Paul was born in Tarsus. He called himself "a Jew of Tarsus, a city in Cilicia, a citizen of no mean city", and said he was brought up in Jerusalem at the feet of Gamaliel. In Damascus the Lord sent Ananias to seek "Saul, of Tarsus". After his conversion the brethren sent Paul away to Tarsus, and he went into the regions of Syria and Cilicia until Barnabas came to Tarsus to seek him and brought him to Antioch. On a later journey Paul went through Syria and Cilicia, confirming the churches.'
    - "Under the empire Tarsus remained the leading city of Cilicia. When the emperor Julian died on his Persian campaign in 363, he was buried, as he had directed, in a suburb of Tarsus beside the road to the passes of the Taurus. Diodorus, its bishop from 378, who earlier at Antioch had guided John Chrysostom and Theodore of Mopsuestia in the ascetic life, upheld the Nicene faith at the Council of Constantinople in 381."
  ru:
    - "Тарс лежит на Киликийской равнине на юге Турции, примерно в 15 км от Средиземного моря. В древности холодная и быстрая река Кидн текла через середину города и впадала у побережья в лагуну, служившую ему гаванью. Холм Гёзлюкуле, который раскапывала Хетти Голдман в 1930–1940-х гг., хранит следы поселения начиная с неолита, а хеттские тексты II тысячелетия до н. э. называют город Тарса. В 401 г. до н. э. Ксенофонт застал его большим и процветающим городом, резиденцией киликийского царя Сиеннесия, правившего под властью персов."
    - "Александр Македонский дошёл до Тарса в 333 г. до н. э. и тяжело заболел здесь — по одному из рассказов, искупавшись в Кидне. После битвы при Филиппах Марк Антоний сделал Тарс свободным городом, освобождённым от податей, а в 41 г. до н. э. Клеопатра поднялась по Кидну на своей позолоченной ладье, чтобы встретиться с ним. Страбон, писавший при Августе, говорит, что жители Тарса в любви к философии и учёности превзошли даже Афины и Александрию; стоик Афинодор, учитель Августа, вернувшись на родину, управлял городом."
    - "Павел родился в Тарсе. Он называл себя «Иудеянин, Тарсянин, гражданин небезызвестного Киликийского города» и говорил, что воспитан в Иерусалиме при ногах Гамалиила. В Дамаске Господь послал Ананию спросить «Тарсянина, по имени Савла». После обращения братия препроводили Павла в Тарс, и он отошёл в страны Сирии и Киликии, пока Варнава не пришёл в Тарс искать его и не привёл в Антиохию. В одном из последующих путешествий Павел проходил Сирию и Киликию, утверждая церкви."
    - "При императорах Тарс оставался главным городом Киликии. Когда в 363 г. император Юлиан погиб в персидском походе, его, как он и велел, похоронили в предместье Тарса у дороги к проходам Тавра. Диодор, епископ Тарса с 378 г., который ещё в Антиохии наставлял в подвижнической жизни Иоанна Златоуста и Феодора Мопсуестийского, отстаивал никейскую веру на Константинопольском соборе 381 г."
  uk:
    - "Тарс лежить на кілікійській рівнині на півдні Туреччини, приблизно за 15 км углиб від Середземного моря. У давнину холодна й швидка річка Кидн текла посеред міста і впадала в лагуну поблизу узбережжя, яка правила йому за гавань. Пагорб Гьозлюкуле, розкопаний Хетті Голдмен у 1930–1940-х роках, показує поселення від неоліту, а хетські тексти II тис. до н. е. називають місто Тарса. У 401 р. до н. е. Ксенофонт застав його великим і заможним містом, резиденцією кілікійського царя Сієннесіса, що правив під владою персів."
    - "Александр Великий дійшов до Тарса 333 р. до н. е. і тяжко захворів там — за одним переказом, скупавшись у Кидні. Після битви під Філіппами Марк Антоній зробив Тарс вільним містом, звільненим від податків, а в 41 р. до н. е. Клеопатра припливла Кидном назустріч йому в позолоченій барці. Страбон, пишучи за Августа, каже, що його мешканці перевершували навіть Афіни й Александрію в завзятті до філософії та освіти; стоїк Афінодор, учитель Августа, правив містом після повернення додому."
    - "Павло народився в Тарсі. Він називав себе «Жидовин Тарсийський, славного города Киликиї житель» і казав, що виріс у Єрусалимі при ногах Гамаліїла. У Дамаску Господь послав Ананію шукати «Тарсянина, на ймя Савла». Після навернення брати вислали Павла в Тарс, і він пішов у краї Сирії та Кілікії, доки Варнава не прийшов у Тарс шукати його й не привів до Антіохії. Під час пізнішої подорожі Павло проходив Сирією й Кілікією, утверджуючи церкви."
    - "За імперії Тарс лишався провідним містом Кілікії. Коли імператор Юліан помер під час перського походу 363 року, його поховали, як він наказав, у передмісті Тарса біля дороги до проходів Тавра. Діодор, його єпископ з 378 року, який раніше в Антіохії наставляв Івана Золотоустого й Феодора Мопсуестійського в аскетичному житті, обстоював нікейську віру на Константинопольському соборі 381 року."
  es:
    - "Tarso se encuentra en la llanura de Cilicia, en el sur de Turquía, a unos 15 km tierra adentro desde el Mediterráneo. En la Antigüedad el frío y rápido río Cidno atravesaba el centro de la ciudad y desembocaba en una laguna cercana a la costa que servía de puerto. El montículo de Gözlükule, excavado por Hetty Goldman en las décadas de 1930 y 1940, muestra un asentamiento desde el Neolítico en adelante, y textos hititas del segundo milenio a. C. nombran la ciudad Tarsa. En 401 a. C. Jenofonte la halló grande y próspera, sede del rey cilicio Siénesis, que gobernaba bajo los persas."
    - "Alejandro Magno llegó a Tarso en 333 a. C. y enfermó gravemente allí, según un relato después de bañarse en el Cidno. Tras la batalla de Filipos, Marco Antonio hizo de Tarso una ciudad libre exenta de impuestos, y en 41 a. C. Cleopatra remontó el Cidno para encontrarse con él en su barcaza dorada. Estrabón, que escribía bajo Augusto, dice que sus habitantes superaban incluso a Atenas y Alejandría en celo por la filosofía y el saber; el estoico Atenodoro, maestro de Augusto, gobernó la ciudad a su regreso a casa."
    - "Pablo nació en Tarso. Se llamó a sí mismo «hombre Judío, ciudadano de Tarso, ciudad no obscura de Cilicia», y dijo que se crio en Jerusalén a los pies de Gamaliel. En Damasco el Señor envió a Ananías a buscar a «Saulo, de Tarso». Tras su conversión, los hermanos enviaron a Pablo a Tarso, y él fue a las regiones de Siria y Cilicia hasta que Bernabé llegó a Tarso a buscarlo y lo llevó a Antioquía. En un viaje posterior Pablo recorrió Siria y Cilicia confirmando a las iglesias."
    - "Bajo el Imperio, Tarso siguió siendo la principal ciudad de Cilicia. Cuando el emperador Juliano murió en su campaña persa en 363, fue sepultado, como había dispuesto, en un suburbio de Tarso junto al camino de los pasos del Tauro. Diodoro, su obispo desde 378, que antes en Antioquía había guiado a Juan Crisóstomo y a Teodoro de Mopsuestia en la vida ascética, defendió la fe nicena en el Concilio de Constantinopla de 381."
  pt:
    - "Tarso fica na planície da Cilícia, no sul da Turquia, a cerca de 15 km do Mediterrâneo. Na Antiguidade, o frio e veloz rio Cidno atravessava o meio da cidade e desaguava numa lagoa perto da costa que lhe servia de porto. O monte de Gözlükule, escavado por Hetty Goldman nas décadas de 1930 e 1940, mostra povoamento desde o Neolítico, e textos hititas do segundo milênio a.C. dão à cidade o nome de Tarsa. Em 401 a.C., Xenofonte a encontrou grande e próspera, sede do rei cilício Siénesis, que governava sob os persas."
    - "Alexandre, o Grande, chegou a Tarso em 333 a.C. e adoeceu gravemente ali, segundo um relato depois de banhar-se no Cidno. Depois da batalha de Filipos, Marco Antônio fez de Tarso uma cidade livre isenta de impostos, e em 41 a.C. Cleópatra subiu o Cidno em sua barcaça dourada para encontrá-lo. Estrabão, escrevendo sob Augusto, diz que seu povo superava até Atenas e Alexandria no zelo pela filosofia e pelo saber; o estoico Atenodoro, mestre de Augusto, governou a cidade ao voltar para casa."
    - "Paulo nasceu em Tarso. Ele se disse “um judeu de Tarso, na Cilícia, cidadão de uma cidade importante”, e afirmou ter sido criado em Jerusalém aos pés de Gamaliel. Em Damasco, o Senhor mandou Ananias procurar “Saulo, de Tarso”. Depois de sua conversão, os irmãos mandaram Paulo para Tarso, e ele foi às regiões da Síria e da Cilícia até que Barnabé veio a Tarso procurá-lo e o levou a Antioquia. Numa viagem posterior, Paulo percorreu a Síria e a Cilícia, confirmando as igrejas."
    - "Sob o império, Tarso continuou a principal cidade da Cilícia. Quando o imperador Juliano morreu em sua campanha persa, em 363, foi sepultado, como determinara, num subúrbio de Tarso, junto à estrada das passagens do Tauro. Diodoro, seu bispo desde 378, que antes, em Antioquia, havia guiado João Crisóstomo e Teodoro de Mopsuéstia na vida ascética, defendeu a fé nicena no Concílio de Constantinopla, em 381."
  de:
    - "Tarsus liegt in der Ebene von Kilikien in der Südtürkei, etwa 15 km landeinwärts vom Mittelmeer. In der Antike floss der kalte, reißende Kydnos mitten durch die Stadt in eine Lagune nahe der Küste, die ihr als Hafen diente. Der Hügel Gözlükule, in den 1930er und 1940er Jahren von Hetty Goldman ausgegraben, zeigt Besiedlung seit der Jungsteinzeit, und hethitische Texte des zweiten Jahrtausends v. Chr. nennen die Stadt Tarsa. 401 v. Chr. fand Xenophon sie als große, wohlhabende Stadt, Sitz des kilikischen Königs Syennesis, der unter den Persern herrschte."
    - "Alexander der Große erreichte Tarsus 333 v. Chr. und erkrankte dort schwer, nach einem Bericht nach einem Bad im Kydnos. Nach der Schlacht bei Philippi machte Markus Antonius Tarsus zur freien, steuerbefreiten Stadt, und 41 v. Chr. fuhr Kleopatra auf ihrer vergoldeten Barke den Kydnos hinauf, um ihn zu treffen. Strabon sagt unter Augustus, seine Bewohner übertrafen im Eifer für Philosophie und Bildung selbst Athen und Alexandria; der Stoiker Athenodoros, Lehrer des Augustus, regierte die Stadt nach seiner Heimkehr."
    - "Paulus wurde in Tarsus geboren. Er nannte sich „ein jüdischer Mann von Tarsus, ein Bürger einer namhaften Stadt in Zilizien“ und sagte, er sei in Jerusalem zu Füßen Gamaliëls erzogen worden. In Damaskus sandte der Herr Hananias, „nach einem namens Saul von Tarsus“ zu fragen. Nach seiner Bekehrung schickten die Brüder Paulus nach Tarsus, und er zog in die Gebiete von Syrien und Kilikien, bis Barnabas nach Tarsus kam, ihn zu suchen, und ihn nach Antiochia brachte. Auf einer späteren Reise zog Paulus durch Syrien und Kilikien und stärkte die Gemeinden."
    - "Unter dem Kaiserreich blieb Tarsus die führende Stadt Kilikiens. Als Kaiser Julian 363 auf seinem Perserfeldzug starb, wurde er, wie er verfügt hatte, in einem Vorort von Tarsus an der Straße zu den Pässen des Taurus beigesetzt. Diodor, ab 378 sein Bischof, der zuvor in Antiochia Johannes Chrysostomos und Theodor von Mopsuestia im asketischen Leben angeleitet hatte, verteidigte beim Konzil von Konstantinopel 381 den nicänischen Glauben."
  fr:
    - "Tarse se trouve dans la plaine de Cilicie, dans le sud de la Turquie, à environ 15 km à l’intérieur des terres depuis la Méditerranée. Dans l’Antiquité, le Cydnus, fleuve froid et rapide, traversait le milieu de la ville et se jetait dans une lagune proche de la côte qui lui servait de port. Le tertre de Gözlükule, fouillé par Hetty Goldman dans les années 1930 et 1940, montre une occupation dès le néolithique, et des textes hittites du IIe millénaire av. J.-C. nomment la ville Tarsa. En 401 av. J.-C., Xénophon la trouva grande et prospère, siège du roi cilicien Syennésis, qui régnait sous les Perses."
    - "Alexandre le Grand arriva à Tarse en 333 av. J.-C. et y tomba gravement malade, selon un récit après s’être baigné dans le Cydnus. Après la bataille de Philippes, Marc Antoine fit de Tarse une ville libre exemptée d’impôts, et en 41 av. J.-C. Cléopâtre remonta le Cydnus pour le rencontrer sur sa barque dorée. Strabon, écrivant sous Auguste, dit que ses habitants surpassaient même Athènes et Alexandrie par leur zèle pour la philosophie et le savoir ; le stoïcien Athénodore, maître d’Auguste, gouverna la ville à son retour chez lui."
    - "Paul naquit à Tarse. Il se disait « Juif, de Tarse en Cilicie, citoyen d’une ville qui n’est pas sans importance », et affirmait avoir été élevé à Jérusalem aux pieds de Gamaliel. À Damas, le Seigneur envoya Ananias chercher « Saul de Tarse ». Après sa conversion, les frères firent partir Paul pour Tarse, et il alla dans les contrées de Syrie et de Cilicie jusqu’à ce que Barnabas vienne à Tarse le chercher et l’amène à Antioche. Lors d’un voyage ultérieur, Paul parcourut la Syrie et la Cilicie en fortifiant les Églises."
    - "Sous l’Empire, Tarse resta la première ville de Cilicie. Quand l’empereur Julien mourut lors de sa campagne perse en 363, il fut enterré, comme il l’avait voulu, dans un faubourg de Tarse près de la route des passes du Taurus. Diodore, son évêque depuis 378, qui avait auparavant guidé à Antioche Jean Chrysostome et Théodore de Mopsueste dans la vie ascétique, défendit la foi de Nicée au concile de Constantinople en 381."
  pl:
    - "Tars leży na równinie Cylicji w południowej Turcji, około 15 km w głębi lądu od Morza Śródziemnego. W starożytności zimna, rwąca rzeka Kydnos płynęła przez środek miasta i wpadała do laguny blisko wybrzeża, która służyła jako port. Kopiec Gözlükule, badany przez Hetty Goldman w latach trzydziestych i czterdziestych XX wieku, wykazuje osadnictwo od neolitu, a teksty hetyckie z II tysiąclecia p.n.e. nazywają miasto Tarsa. W 401 roku p.n.e. Ksenofont zastał je jako wielkie i zamożne miasto, siedzibę cylicyjskiego króla Syennezisa, który rządził pod władzą Persów."
    - "Aleksander Wielki dotarł do Tarsu w 333 roku p.n.e. i ciężko tam zachorował, według jednej relacji po kąpieli w Kydnosie. Po bitwie pod Filippi Marek Antoniusz uczynił Tars wolnym miastem zwolnionym z podatków, a w 41 roku p.n.e. Kleopatra wpłynęła w górę Kydnosu, by się z nim spotkać na swojej złoconej barce. Strabon, pisząc za Augusta, mówi, że jego mieszkańcy prześcigali nawet Ateny i Aleksandrię w zapale do filozofii i nauki; stoik Atenodoros, nauczyciel Augusta, rządził miastem po powrocie do domu."
    - "Paweł urodził się w Tarsie. Nazwał siebie „człowiek Żyd Tarseńczyk, mieszczanin nie z podłego miasta w Cylicyi” i powiedział, że wychował się w Jerozolimie u stóp Gamaliela. W Damaszku Pan posłał Ananiasza, aby szukał „Saula imieniem Tarseńczyka”. Po jego nawróceniu bracia odesłali Pawła do Tarsu, a on poszedł w krainy Syrii i Cylicji, aż Barnaba przybył do Tarsu, by go szukać, i przyprowadził go do Antiochii. W późniejszej podróży Paweł przechodził Syrię i Cylicję, utwierdzając zbory."
    - "Za cesarstwa Tars pozostał głównym miastem Cylicji. Gdy cesarz Julian zmarł podczas wyprawy perskiej w 363 roku, został pochowany, zgodnie ze swoją wolą, na przedmieściu Tarsu przy drodze do przełęczy Taurusu. Diodor, jego biskup od 378 roku, który wcześniej w Antiochii prowadził Jana Chryzostoma i Teodora z Mopsuestii na drodze ascezy, bronił wiary nicejskiej na soborze konstantynopolitańskim w 381 roku."
  it:
    - "Tarso sorge nella piana di Cilicia, nella Turchia meridionale, a circa 15 km dal Mediterraneo. Nell’antichità il freddo e rapido fiume Cidno attraversava il centro della città e sfociava in una laguna vicino alla costa che serviva da porto. Il tell di Gözlükule, scavato da Hetty Goldman negli anni 1930 e 1940, mostra insediamento dal Neolitico in poi, e testi ittiti del II millennio a.C. chiamano la città Tarsa. Nel 401 a.C. Senofonte la trovò grande e prospera, sede del re cilicio Siennesi, che governava sotto i Persiani."
    - "Alessandro Magno giunse a Tarso nel 333 a.C. e vi si ammalò gravemente, secondo un racconto dopo essersi bagnato nel Cidno. Dopo la battaglia di Filippi, Marco Antonio fece di Tarso una città libera esente da tasse, e nel 41 a.C. Cleopatra risalì il Cidno per incontrarlo sulla sua barca dorata. Strabone, scrivendo sotto Augusto, dice che i suoi abitanti superavano perfino Atene e Alessandria nello zelo per la filosofia e il sapere; lo stoico Atenodoro, maestro di Augusto, governò la città al suo ritorno in patria."
    - "Paolo nacque a Tarso. Si definì «un Giudeo, di Tarso, cittadino di quella non oscura città di Cilicia», e disse di essere stato allevato a Gerusalemme ai piedi di Gamaliele. A Damasco il Signore mandò Anania a cercare «Saulo, da Tarso». Dopo la sua conversione i fratelli mandarono Paolo a Tarso, ed egli andò nelle regioni della Siria e della Cilicia finché Barnaba venne a Tarso a cercarlo e lo condusse ad Antiochia. In un viaggio successivo Paolo percorse la Siria e la Cilicia confermando le chiese."
    - "Sotto l’impero Tarso rimase la città principale della Cilicia. Quando l’imperatore Giuliano morì durante la campagna persiana del 363, fu sepolto, come aveva disposto, in un sobborgo di Tarso lungo la strada per i passi del Tauro. Diodoro, suo vescovo dal 378, che in precedenza ad Antiochia aveva guidato Giovanni Crisostomo e Teodoro di Mopsuestia nella vita ascetica, difese la fede nicena al Concilio di Costantinopoli del 381."
  nl:
    - "Tarsus ligt in de vlakte van Cilicië in het zuiden van Turkije, zo’n 15 km landinwaarts van de Middellandse Zee. In de oudheid stroomde de koude, snelle rivier de Cydnus midden door de stad en in een lagune bij de kust die als haven diende. De heuvel Gözlükule, in de jaren 1930 en 1940 opgegraven door Hetty Goldman, toont bewoning vanaf het Neolithicum, en Hettitische teksten uit het tweede millennium v.Chr. noemen de stad Tarsa. In 401 v.Chr. vond Xenophon haar een grote en welvarende stad, de zetel van de Cilicische koning Syennesis, die onder de Perzen regeerde."
    - "Alexander de Grote bereikte Tarsus in 333 v.Chr. en werd daar ernstig ziek, volgens een verslag na een bad in de Cydnus. Na de slag bij Filippi maakte Marcus Antonius Tarsus tot een vrije stad, vrijgesteld van belasting, en in 41 v.Chr. voer Cleopatra in haar verguld schip de Cydnus op om hem te ontmoeten. Strabo, die onder Augustus schreef, zegt dat de bewoners zelfs Athene en Alexandrië overtroffen in hun ijver voor filosofie en wetenschap; de stoïcijn Athenodorus, leermeester van Augustus, bestuurde de stad na zijn thuiskomst."
    - "Paulus werd in Tarsus geboren. Hij noemde zichzelf “een Joods man van Tarsen, een burger van geen onvermaarde stad in Cilicië”, en zei dat hij in Jeruzalem was opgevoed aan de voeten van Gamaliël. In Damascus zond de Heer Ananias om te vragen naar “Saulus, van Tarsen”. Na zijn bekering stuurden de broeders Paulus weg naar Tarsus, en hij ging naar de gewesten van Syrië en Cilicië totdat Barnabas naar Tarsus kwam om hem te zoeken en hem naar Antiochië bracht. Op een latere reis doorreisde Paulus Syrië en Cilicië en versterkte de gemeenten."
    - "Onder het keizerrijk bleef Tarsus de voornaamste stad van Cilicië. Toen keizer Julianus in 363 tijdens zijn Perzische veldtocht stierf, werd hij, zoals hij had bepaald, begraven in een voorstad van Tarsus naast de weg naar de passen van de Taurus. Diodorus, vanaf 378 de bisschop van de stad, die eerder in Antiochië Johannes Chrysostomus en Theodorus van Mopsuestia in het ascetische leven had geleid, verdedigde het geloof van Nicea op het Concilie van Constantinopel in 381."
  cs:
    - "Tarsos leží v pláni Kilikie v jižním Turecku, asi 15 km ve vnitrozemí od Středozemního moře. Ve starověku protékal středem města studený a rychlý Kydnos, který ústil do laguny poblíž pobřeží, jež sloužila jako přístav. Pahorek Gözlükule, vykopávaný Hetty Goldmanovou ve 30. a 40. letech 20. století, ukazuje osídlení od neolitu a chetitské texty z 2. tisíciletí př. n. l. nazývají město Tarsa. V roce 401 př. n. l. je Xenofón našel jako velké a prosperující město, sídlo kilického krále Syennesida, který vládl pod Peršany."
    - "Alexandr Veliký dorazil do Tarsu roku 333 př. n. l. a těžce tam onemocněl, podle jednoho vyprávění po koupeli v Kydnu. Po bitvě u Filip učinil Marcus Antonius z Tarsu svobodné město osvobozené od daní a roku 41 př. n. l. se k němu Kleopatra plavila po Kydnu v pozlacené bárce. Strabón, píšící za Augusta, říká, že její obyvatelé předčili i Atény a Alexandrii v horlivosti pro filosofii a vzdělanost; stoik Athénodóros, učitel Augustův, město spravoval po návratu domů."
    - "Pavel se narodil v Tarsu. Označil se slovy: „Jáť jsem člověk Žid Tarsenský, neposledního města Cilické země obyvatel“ a řekl, že byl vychován v Jeruzalémě u nohou Gamalielových. V Damašku poslal Pán Ananiáše, aby hledal „Saule, jménem Tarsenského“. Po jeho obrácení poslali bratři Pavla do Tarsu a on šel do končin Sýrie a Kilikie, dokud pro něj Barnabáš nepřišel do Tarsu a nepřivedl ho do Antiochie. Na pozdější cestě procházel Pavel Sýrií a Kilikií a utvrzoval církve."
    - "Za císařství zůstal Tarsos předním městem Kilikie. Když císař Julianus zemřel roku 363 při perském tažení, byl pohřben, jak sám nařídil, na předměstí Tarsu při silnici k průsmykům Tauru. Diodóros, jeho biskup od roku 378, který dříve v Antiochii vedl Jana Zlatoústého a Theodora z Mopsuestie k asketickému životu, hájil nicejskou víru na konstantinopolském koncilu roku 381."
  sv:
    - "Tarsos ligger på Kilikiens slätt i södra Turkiet, omkring 15 km inåt landet från Medelhavet. I antiken flöt den kalla, snabba floden Kydnos genom stadens mitt och ut i en lagun nära kusten som tjänade som dess hamn. Kullen Gözlükule, utgrävd av Hetty Goldman på 1930- och 1940-talen, visar bosättning från neolitikum och framåt, och hettitiska texter från andra årtusendet f.Kr. kallar staden Tarsa. År 401 f.Kr. fann Xenofon den som en stor och välmående stad, säte för den kilikiske kungen Syennesis, som styrde under perserna."
    - "Alexander den store nådde Tarsos 333 f.Kr. och insjuknade där svårt, enligt en uppgift efter ett bad i Kydnos. Efter slaget vid Filippi gjorde Marcus Antonius Tarsos till en fri stad befriad från skatt, och år 41 f.Kr. seglade Kleopatra upp för Kydnos för att möta honom i sin förgyllda barkass. Strabon, som skrev under Augustus, säger att dess invånare till och med överträffade Aten och Alexandria i nit för filosofi och lärdom; stoikern Athenodoros, Augustus' lärare, styrde staden vid sin hemkomst."
    - "Paulus föddes i Tarsos. Han kallade sig ”en judisk man från Tarsus, medborgare alltså i en betydande stad i Cilicien”, och sade att han var uppfostrad i Jerusalem vid Gamaliels fötter. I Damaskus sände Herren Ananias för att söka ”Saulus, från Tarsus”. Efter hans omvändelse sände bröderna Paulus till Tarsos, och han begav sig till trakterna i Syrien och Kilikien tills Barnabas kom till Tarsos för att söka honom och förde honom till Antiochia. På en senare resa drog Paulus genom Syrien och Kilikien och styrkte församlingarna."
    - "Under kejsartiden förblev Tarsos Kilikiens ledande stad. När kejsar Julianus dog på sitt persiska fälttåg 363 begravdes han, som han hade bestämt, i en förort till Tarsos vid vägen till passen i Taurus. Diodoros, dess biskop från 378, som tidigare i Antiochia hade lett Johannes Chrysostomos och Theodoros av Mopsuestia i det asketiska livet, försvarade den nicenska tron vid konciliet i Konstantinopel 381."
  nb:
    - "Tarsos ligger på Kilikia-sletten i det sørlige Tyrkia, omkring 15 km fra Middelhavet. I antikken rant den kalde, strie elven Kydnos gjennom midten av byen og ut i en lagune nær kysten som tjente som havn. Haugen Gözlükule, utgravd av Hetty Goldman på 1930- og 1940-tallet, viser bosetning fra yngre steinalder og framover, og hettittiske tekster fra 2. årtusen f.Kr. kaller byen Tarsa. I 401 f.Kr. fant Xenofon den som en stor og velstående by, sete for den kilikiske kongen Syennesis, som styrte under perserne."
    - "Aleksander den store nådde Tarsos i 333 f.Kr. og ble alvorlig syk der, etter én beretning etter å ha badet i Kydnos. Etter slaget ved Filippi gjorde Marcus Antonius Tarsos til en fri by fritatt for skatt, og i 41 f.Kr. seilte Kleopatra opp Kydnos for å møte ham i sin forgylte lekter. Strabon, som skrev under Augustus, sier at innbyggerne overgikk til og med Aten og Aleksandria i iver etter filosofi og lærdom; stoikeren Athenodoros, Augustus' lærer, styrte byen etter at han kom hjem."
    - "Paulus ble født i Tarsos. Han kalte seg selv «en jøde, fra Tarsus, borger av en ikke ukjent by i Kilikia», og sa at han var oppfostret i Jerusalem ved Gamaliels føtter. I Damaskus sendte Herren Ananias for å oppsøke «Saulus, fra Tarsus». Etter omvendelsen sendte brødrene Paulus bort til Tarsos, og han dro til Syrias og Kilikias bygder til Barnabas kom til Tarsos for å oppsøke ham og førte ham til Antiokia. På en senere reise drog Paulus gjennom Syria og Kilikia og styrket menighetene."
    - "Under keiserdømmet forble Tarsos den ledende byen i Kilikia. Da keiser Julian døde under sitt persiske felttog i 363, ble han gravlagt, slik han hadde bestemt, i en forstad til Tarsos ved veien til passene i Taurus. Diodoros, byens biskop fra 378, som tidligere i Antiokia hadde veiledet Johannes Krysostomos og Teodor av Mopsuestia i det asketiske liv, forsvarte den nikenske troen på konsilet i Konstantinopel i 381."
  tl:
    - "Ang Tarso ay nasa kapatagan ng Cilicia sa timog ng Turkey, mga 15 km sa loob ng lupain mula sa Mediteraneo. Noong sinaunang panahon, ang malamig at mabilis na ilog Cydnus ay dumaloy sa gitna ng lunsod at sa isang lagoon malapit sa baybayin na nagsilbing daungan nito. Ang burol ng Gözlükule, na hinukay ni Hetty Goldman noong dekada 1930 at 1940, ay nagpapakita ng paninirahan mula pa sa Neolitiko, at pinangangalanan ng mga tekstong Heteo noong ikalawang milenyo BK ang bayan na Tarsa. Noong 401 BK, natagpuan ito ni Xenophon na malaki at masaganang lunsod, ang luklukan ng haring Cilicio na si Syennesis, na namuno sa ilalim ng mga Persiyano."
    - "Dumating si Alejandro Magno sa Tarso noong 333 BK at nagkasakit nang malubha roon, ayon sa isang salaysay pagkatapos maligo sa Cydnus. Matapos ang labanan sa Filipos, ginawa ni Marco Antonio ang Tarso na malayang lunsod na hindi pinagbabayad ng buwis, at noong 41 BK ay naglayag si Cleopatra sa Cydnus upang salubungin siya sa kaniyang ginintuang barkong-bahay. Sinasabi ni Estrabon, na sumulat sa ilalim ni Augusto, na nahigitan ng mga tao nito maging ang Atenas at Alejandria sa sigasig sa pilosopiya at karunungan; ang Estoikong si Athenodorus, guro ni Augusto, ay namahala sa lunsod nang siya ay umuwi."
    - "Si Pablo ay isinilang sa Tarso. Tinawag niya ang sarili na “Judio, na taga Tarso sa Cilicia, isang mamamayan ng bayang hindi kakaunti ang kahalagahan”, at sinabing siya ay pinalaki sa Jerusalem sa paanan ni Gamaliel. Sa Damasco, isinugo ng Panginoon si Ananias upang hanapin si “Saulo, lalaking taga Tarso”. Pagkatapos ng kaniyang pagbabalik-loob, pinaalis ng mga kapatid si Pablo patungong Tarso, at pumunta siya sa mga rehiyon ng Siria at Cilicia hanggang sa dumating si Bernabe sa Tarso upang hanapin siya at dalhin siya sa Antioquia. Sa isang mas huling paglalakbay, dumaan si Pablo sa Siria at Cilicia, na pinatatatag ang mga iglesia."
    - "Sa ilalim ng imperyo, nanatiling pangunahing lunsod ng Cilicia ang Tarso. Nang mamatay ang emperador na si Julian sa kaniyang kampanyang Persiyano noong 363, inilibing siya, ayon sa kaniyang ipinag-utos, sa isang karatig ng Tarso sa tabi ng daan patungo sa mga daanan ng Taurus. Si Diodorus, ang obispo nito mula 378, na dating sa Antioquia ay gumabay kay Juan Crisostomo at Teodoro ng Mopsuestia sa buhay asetiko, ay nanindigan sa pananampalatayang Niceno sa Konseho ng Constantinople noong 381."
  da:
    - "Tarsus ligger på Kilikiens slette i det sydlige Tyrkiet, omkring 15 km fra Middelhavet. I oldtiden strømmede den kolde, hurtige flod Kydnos gennem midten af byen og ud i en lagune nær kysten, som tjente som dens havn. Tellen Gözlükule, udgravet af Hetty Goldman i 1930'erne og 1940'erne, viser bosættelse fra yngre stenalder og frem, og hittitiske tekster fra 2. årtusinde f.Kr. nævner byen Tarsa. I 401 f.Kr. fandt Xenofon den som en stor og velstående by, sæde for den kilikiske konge Syennesis, der herskede under perserne."
    - "Alexander den Store nåede Tarsus i 333 f.Kr. og blev alvorligt syg dér, ifølge en beretning efter et bad i Kydnos. Efter slaget ved Filippi gjorde Marcus Antonius Tarsus til en fri by fritaget for skat, og i 41 f.Kr. sejlede Kleopatra op ad Kydnos for at møde ham i sin forgyldte pragtbarge. Strabon, der skrev under Augustus, siger, at dens folk overgik selv Athen og Alexandria i iver for filosofi og lærdom; stoikeren Athenodoros, Augustus' lærer, styrede byen ved sin hjemkomst."
    - "Paulus blev født i Tarsus. Han kaldte sig »en jødisk Mand fra Tarsus, Borger i en ikke ubekendt By i Kilikien«, og sagde, at han var opdraget i Jerusalem ved Gamaliels fødder. I Damaskus sendte Herren Ananias for at opsøge »en ved Navn Saulus fra Tarsus«. Efter hans omvendelse sendte brødrene Paulus bort til Tarsus, og han drog til egnene i Syrien og Kilikien, indtil Barnabas kom til Tarsus for at søge ham og førte ham til Antiokia. På en senere rejse drog Paulus gennem Syrien og Kilikien og styrkede menighederne."
    - "Under kejserdømmet forblev Tarsus Kilikiens førende by. Da kejser Julian døde på sit persiske felttog i 363, blev han begravet, som han havde bestemt, i en forstad til Tarsus ved vejen til Taurus-passene. Diodoros, dens biskop fra 378, der tidligere i Antiokia havde ledet Johannes Chrysostomos og Theodor af Mopsuestia i det asketiske liv, forsvarede den nikænske tro på koncilet i Konstantinopel i 381."
  sr:
    - "Тарс лежи на равници Киликије у јужној Турској, око 15 км у унутрашњости од Средоземног мора. У старом веку хладна и брза река Кидн текла је кроз средину града и уливала се у лагуну близу обале која је служила као његова лука. Хум Гезлукуле, који је 1930-их и 1940-их ископавала Хети Голдман, показује насељеност од неолита надаље, а хетитски текстови из 2. миленијума п. н. е. зову град Тарса. Године 401. п. н. е. Ксенофонт га је нашао као велик и богат град, седиште киликијског цара Синезија, који је владао под Персијанцима."
    - "Александар Велики стигао је у Тарс 333. п. н. е. и тешко се разболео онде, по једном предању после купања у Кидну. После битке код Филипа, Марко Антоније учинио је Тарс слободним градом ослобођеним пореза, а 41. п. н. е. Клеопатра се уз Кидн попела у својој позлаћеној барки да га сретне. Страбон, пишући под Августом, каже да су његови становници у ревности за филозофију и учење надмашивали чак Атину и Александрију; стоик Атенодор, Августов учитељ, управљао је градом по повратку кући."
    - "Павле је рођен у Тарсу. Назвао је себе овако: „човек Јеврејин из Тарса, грађанин познатог града у Киликији“, и рекао је да је одрастао у Јерусалиму код ногу Гамалилових. У Дамаску је Господ послао Ананију да потражи „Савла Таршанина“. После његовог обраћења браћа су отпремила Павла у Тарс, а он је отишао у крајеве Сирије и Киликије све док Варнава није дошао у Тарс да га тражи и довео га у Антиохију. На каснијем путу Павле је прошао кроз Сирију и Киликију учвршћујући цркве."
    - "Под царством Тарс је остао водећи град Киликије. Када је цар Јулијан умро у свом персијском походу 363, сахрањен је, како је одредио, у предграђу Тарса уз пут према превојима Таурус. Диодор, његов епископ од 378, који је раније у Антиохији водио Јована Златоустог и Теодора Мопсуестијског у подвижничком животу, бранио је никејску веру на Цариградском сабору 381."
  hu:
    - "Tarzusz Kilikia síkságán fekszik Dél-Törökországban, a Földközi-tengertől mintegy 15 km-re a szárazföld belsejében. Az ókorban a hideg, sebes Kydnos folyó átfolyt a város közepén, és a part közelében lévő lagúnába ömlött, amely kikötőjéül szolgált. A Hetty Goldman által az 1930-as és 1940-es években ásatott Gözlükule halma újkőkor óta mutat megtelepedést, és a Kr. e. második évezredi hettita szövegek Tarsa néven említik a várost. Kr. e. 401-ben Xenophón nagy és gazdag városnak találta, a kilikiai király, Szüennészisz székhelyének, aki a perzsák alatt uralkodott."
    - "Nagy Sándor Kr. e. 333-ban érkezett Tarzuszba, és súlyosan megbetegedett ott, egyik leírás szerint a Kydnosban való fürdés után. A filippi csata után Marcus Antonius szabad várossá tette Tarzuszt, adómentességgel, és Kr. e. 41-ben Kleopátra aranyozott bárkáján felhajózott a Kydnoson, hogy találkozzon vele. Sztrabón, Augusztus alatt írva, azt mondja, hogy lakói a filozófia és tudomány iránti buzgalomban még Athént és Alexandriát is felülmúlták; a sztoikus Athénodórosz, Augusztus tanítója, hazatérése után kormányozta a várost."
    - "Pál Tarzuszban született. Magát „tárzusi zsidó ember”-nek nevezte, „Cziliczia nem ismeretlen városának polgára”, és azt mondta, Jeruzsálemben nevelkedett Gamáliel lábánál. Damaszkuszban az Úr Ananiást küldte, hogy keressen fel „egy Saulus nevű tárzusi embert”. Megtérése után a testvérek Tarzuszba küldték Pált, és ő Szíria és Kilikia vidékeire ment, míg Barnabás el nem jött Tarzuszba, hogy felkeresse, és Antiókhiába nem vitte. Egy későbbi úton Pál átjárta Szíriát és Kilikiát, erősítve a gyülekezeteket."
    - "A császárkorban Tarzusz Kilikia vezető városa maradt. Amikor Julianus császár 363-ban perzsa hadjáratán meghalt, a végrendelete szerint Tarzusz egyik külvárosában temették el, a Taurusz hágóihoz vezető út mellett. Diodórosz, a város püspöke 378-tól, aki korábban Antiókhiában az aszkétaéletben vezette Aranyszájú Szent Jánost és mopsuestiai Theodóroszt, a Nicaeai hitet védte a 381-es konstantinápolyi zsinaton."
  fi:
    - "Tarsos sijaitsee Kilikian tasangolla Etelä-Turkissa, noin 15 km sisämaassa Välimerestä. Antiikin aikana kylmä ja nopea Kydnos-joki virtasi kaupungin keskeltä rannikon lähellä olevaan laguuniin, joka toimi sen satamana. Gözlükulen kumpare, jota Hetty Goldman kaivoi 1930- ja 1940-luvuilla, osoittaa asutusta uudelta kivikaudelta lähtien, ja toisen vuosituhannen eaa. heettiläistekstit nimeävät kaupungin Tarsaksi. Vuonna 401 eaa. Ksenofon piti sitä suurena ja vauraana kaupunkina, Kilikian kuninkaan Syennesiksen kotipaikkana; hän hallitsi persialaisten alaisena."
    - "Aleksandros Suuri saapui Tarsokseen 333 eaa. ja sairastui siellä vakavasti, erään kertomuksen mukaan kylvettyään Kydnoksessa. Filippin taistelun jälkeen Marcus Antonius teki Tarsoksesta vapaan, verovapaan kaupungin, ja vuonna 41 eaa. Kleopatra purjehti Kydnosta ylös tapaamaan häntä kullatulla aluksellaan. Augustuksen aikana kirjoittanut Strabon sanoo sen asukkaiden ylittäneen jopa Ateenan ja Aleksandrian innostuksessaan filosofiaan ja oppiin; stoalainen Athenodoros, Augustuksen opettaja, hallitsi kaupunkia palattuaan kotiin."
    - "Paavali syntyi Tarsoksessa. Hän sanoi: ”Minä olen juutalainen mies, Tarson, tunnetun Kilikian kaupungin, kansalainen”, ja kertoi, että hänet oli kasvatettu Jerusalemissa Gamalielin jalkojen juuressa. Damaskoksessa Herra lähetti Ananiaan etsimään ”Saulus nimistä tarsolaista miestä”. Käännyttyään veljet lähettivät Paavalin Tarsokseen, ja hän meni Syyrian ja Kilikian seuduille, kunnes Barnabas tuli Tarsokseen etsimään häntä ja toi hänet Antiokiaan. Myöhemmällä matkalla Paavali kulki Syyrian ja Kilikian halki vahvistaen seurakuntia."
    - "Keisarikunnan aikana Tarsos säilyi Kilikian johtavana kaupunkina. Kun keisari Julianus kuoli Persian-sotaretkellään 363, hänet haudattiin hänen määräyksensä mukaan Tarsoksen esikaupunkiin Tauruksen solille johtavan tien varrelle. Diodoros, sen piispa vuodesta 378, joka oli aiemmin Antiokiassa ohjannut Johannes Kultasuuta ja Teodorosta Mopsuestialaista askeettiseen elämään, puolusti nikealaista uskoa Konstantinopolin kirkolliskokouksessa 381."
  vi:
    - "Tạt-sơ nằm trong đồng bằng Si-li-si ở miền nam Thổ Nhĩ Kỳ, cách Địa Trung Hải khoảng 15 km trong nội địa. Thời cổ, con sông Cydnus lạnh và xiết chảy qua giữa thành rồi đổ vào một đầm phá gần bờ biển làm hải cảng của nó. Gò Gözlükule, do Hetty Goldman khai quật trong thập niên 1930 và 1940, cho thấy cư trú từ thời đồ đá mới trở đi, và các văn bản Hittite của thiên niên kỷ 2 TCN gọi thị trấn là Tarsa. Năm 401 TCN, Xenophon thấy nó là một thành lớn và thịnh vượng, nơi ngự của vua Si-li-si là Syennesis, người cai trị dưới quyền Ba Tư."
    - "A-léc-xan-đơ Đại đế đến Tạt-sơ năm 333 TCN và bị bệnh nặng ở đó, theo một lời thuật là sau khi tắm trong sông Cydnus. Sau trận Phi-líp, Mark Antony biến Tạt-sơ thành thành tự do miễn thuế, và năm 41 TCN Cleopatra căng buồm đi lên sông Cydnus để gặp ông trên chiếc thuyền mạ vàng của bà. Strabon, viết dưới thời Au-gút-tơ, nói dân thành còn vượt cả A-thên và A-léc-xan-tri về lòng nhiệt thành với triết học và học vấn; nhà Khắc kỷ Athenodorus, thầy của Au-gút-tơ, cai trị thành khi trở về quê."
    - "Phao-lô sinh tại Tạt-sơ. Ông tự xưng là “người Giu-đa, vốn ở thành Tạt-sơ, công dân của một thành trong xứ Si-li-si tức là thành có danh tiếng”, và nói mình được nuôi tại Giê-ru-sa-lem dưới chân Ga-ma-li-ên. Ở Đa-mách, Chúa sai A-na-nia đi tìm “Sau-lơ, người Tạt-sơ”. Sau khi ông cải đạo, anh em sai Phao-lô đi Tạt-sơ, và ông đến các miền Sy-ri và Si-li-si cho đến khi Ba-na-ba đến Tạt-sơ tìm ông và đem ông về An-ti-ốt. Trong một chuyến đi sau, Phao-lô đi qua Sy-ri và Si-li-si để làm vững các hội thánh."
    - "Dưới đế quốc, Tạt-sơ vẫn là thành hàng đầu của Si-li-si. Khi hoàng đế Julian chết trong cuộc chinh phạt Ba Tư năm 363, ông được chôn, theo ý ông, ở một vùng ngoại ô Tạt-sơ bên đường đến các đèo Taurus. Diodorus, giám mục của nó từ năm 378, người trước đó ở An-ti-ốt đã hướng dẫn Giăng Chrysostom và Theodore ở Mopsuestia trong đời sống khổ hạnh, đã bênh vực đức tin Nicaea tại Công đồng Constantinople năm 381."
  ro:
    - "Tars se află în câmpia Ciliciei, în sudul Turciei, la circa 15 km în interior față de Mediterana. În antichitate, râul rece și iute Cydnos curgea prin mijlocul orașului și se vărsa într-o lagună de lângă coastă, care îi servea drept port. Movila Gözlükule, săpată de Hetty Goldman în anii 1930 și 1940, arată locuire începând din neolitic, iar textele hitite din mileniul al II-lea î.Hr. numesc orașul Tarsa. În 401 î.Hr., Xenofon l-a găsit un oraș mare și prosper, reședința regelui cilician Siennesis, care domnea sub perși."
    - "Alexandru cel Mare a ajuns la Tars în 333 î.Hr. și s-a îmbolnăvit grav acolo, potrivit unei relatări, în urma unei băi în Cydnos. După bătălia de la Filipi, Marcus Antonius a făcut din Tars un oraș liber, scutit de impozite, iar în 41 î.Hr. Cleopatra a urcat pe Cydnos cu barca ei aurită ca să-l întâlnească. Strabon, scriind sub Augustus, spune că locuitorii lui îi întreceau chiar și pe cei din Atena și Alexandria în râvna pentru filosofie și învățătură; stoicul Atenodor, profesorul lui Augustus, a condus orașul la întoarcerea acasă."
    - "Pavel s-a născut la Tars. S-a numit pe sine „om Iudeu din Tarsul Chilichiei, cetățean al unei cetăți, care nu este neînsemnată”, și a spus că a fost crescut la Ierusalim la picioarele lui Gamaliel. La Damasc, Domnul l-a trimis pe Anania să caute pe „Savlu anume, Tarsenean”. După convertirea lui, frații l-au trimis pe Pavel la Tars, iar el a mers în ținuturile Siriei și Ciliciei, până când Barnaba a venit la Tars să-l caute și l-a adus la Antiohia. Într-o călătorie ulterioară, Pavel a străbătut Siria și Cilicia, întărind bisericile."
    - "Sub imperiu, Tars a rămas cetatea de frunte a Ciliciei. Când împăratul Iulian a murit în campania sa persană din 363, a fost îngropat, după cum poruncise, într-un cartier din afara Tarsului, lângă drumul spre trecătorile Taurusului. Diodor, episcopul lui din 378, care mai înainte, la Antiohia, îi călăuzise pe Ioan Gură de Aur și pe Teodor din Mopsuestia în viața ascetică, a apărat credința niceeană la Sinodul de la Constantinopol din 381."
  bg:
    - "Тарс лежи в Киликийската равнина в Южна Турция, на около 15 км навътре от Средиземно море. В древността студената бърза река Кидн течала през средата на града и се вливала в лагуна близо до брега, която му служела за пристанище. Могилата Гьозлюкуле, разкопана от Хети Голдман през 1930-те и 1940-те години, показва заселване от неолита нататък, а хетски текстове от II хилядолетие пр.н.е. наричат града Тарса. През 401 г. пр.н.е. Ксенофонт го заварил голям и процъфтяващ град, седалище на киликийския цар Сиенесис, който управлявал под властта на персите."
    - "Александър Велики стигнал до Тарс през 333 г. пр.н.е. и там тежко се разболял, според един разказ след къпане в Кидн. След битката при Филипи Марк Антоний направил Тарс свободен град, освободен от данъци, а през 41 г. пр.н.е. Клеопатра се изкачила по Кидн с позлатената си ладия, за да се срещне с него. Страбон, който пише при Август, казва, че жителите му надминавали дори Атина и Александрия в усърдието си към философията и учеността; стоикът Атинодор, учител на Август, управлявал града след завръщането си у дома."
    - "Павел бил роден в Тарс. Той казвал за себе си: „Аз съм человек Юдеин от Тарс, гражданин на този знаменит град в Киликия“, и че бил възпитан в Йерусалим при нозете на Гамалиил. В Дамаск Господ изпратил Ананий да потърси „Савел, Тарсянин“. След обръщането му братята го изпратили в Тарс, а той отишъл в Сирийските и Киликийските страни, докато Варнава не дошъл в Тарс да го потърси и не го довел в Антиохия. При по-късно пътуване Павел минал през Сирия и Киликия, утвърждавайки църквите."
    - "При империята Тарс останал водещият град на Киликия. Когато император Юлиан умрял по време на персийския си поход през 363 г., бил погребан, както бил заповядал, в предградие на Тарс край пътя към проходите на Таврос. Диодор, епископ на града от 378 г., който по-рано в Антиохия бил наставлявал Йоан Златоуст и Теодор Мопсуестийски в аскетичния живот, отстоял никейската вяра на Константинополския събор през 381 г."
