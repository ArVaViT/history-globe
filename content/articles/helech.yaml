body:
  en:
    - "In Ezekiel's picture of Tyre as a splendid ship, its defenders are listed: “The men of Arvad with thine army were upon thy walls round about, and the Gammadims were in thy towers”. The Hebrew word rendered “thine army”, helek, can also be read as a place name, Helech, set beside Arvad as another people of the coast. The King James Version, the Russian Synodal Bible and the Greek Septuagint take it as “army”; the Revised Standard Version and several modern translations read Helech, and some, like the New Century Version, simply say Cilicia. J. Simons doubted that a place is meant."
    - "If it is a place, Helech is the Hilakku of Assyrian texts, a kingdom of the Taurus mountains in what the Greeks later called Rough Cilicia, whose name gave the whole region of Cilicia its name. Sargon II gave Hilakku to Ambaris, king of Tabal, and deported him to Assyria in 713 BC; Sennacherib put down a rising there in 696 BC, and Esarhaddon claimed to have conquered its rebels. Under the Babylonians the land was called Pirindu, and in 557 BC Neriglissar pursued its king Appuashu into his own land and took his capital, Ura. The land lies today in southern Turkey."
  ru:
    - "В картине Тира как великолепного корабля перечислены его защитники: «Сыны Арвада с собственным твоим войском стояли кругом на стенах твоих, и Гамадимы были на башнях твоих». Еврейское слово, переданное как «твоё войско», хелек, можно прочесть и как название места — Хелех, поставленный рядом с Арвадом как ещё один народ побережья. Английская Библия короля Якова, Синодальный перевод и греческая Септуагинта понимают его как «войско»; английский Revised Standard Version и ряд современных переводов читают Хелех, а некоторые, как New Century Version, прямо пишут «Киликия». Я. Симонс сомневался, что здесь имеется в виду место."
    - "Если это место, то Хелех — Хилакку ассирийских текстов, царство в горах Тавра, в той области, которую греки позже называли Горной Киликией; от его имени получила название и вся Киликия. Саргон II отдал Хилакку Амбарису, царю Табала, а в 713 г. до н. э. угнал его в Ассирию; Синаххериб подавил там восстание в 696 г. до н. э., а Асархаддон утверждал, что покорил его мятежников. При вавилонянах эта страна называлась Пиринду, и в 557 г. до н. э. Нериглиссар преследовал её царя Аппуашу в его собственной земле и взял его столицу Уру. Ныне эти земли на юге Турции."
  uk:
    - "У картині Тіра як розкішного корабля в Єзекіїля перелічено його оборонців: «Арвадські й власьні військові твої люде стояли навкруги по мурах твоїх, а силачі (Гамадими) — по баштах твоїх». Єврейське слово helek, яке Біблія короля Якова, російська Синодальна Біблія та грецька Септуагінта розуміють як «військо», можна читати й як назву місця, Хелех, поряд з Арвадом, як ще один народ узбережжя. Переглянутий стандартний переклад і кілька сучасних перекладів читають Хелех, а деякі, як-от New Century Version, просто кажуть Кілікія. Й. Сімонс сумнівався, що йдеться про місце."
    - "Якщо це місце, то Хелех — Хілакку ассирійських текстів, царство гір Тавра в тому, що греки пізніше назвали Гірською Кілікією, чия назва дала ім'я всій області Кілікії. Саргон II віддав Хілакку Амбарісові, цареві Табала, і вивіз його до Ассирії 713 р. до н. е.; Сінаххеріб придушив там повстання 696 р. до н. е., а Асархаддон заявляв, що підкорив її бунтівників. За вавилонян країну називали Пірінду, і 557 р. до н. е. Нергал-шар-узур переслідував її царя Аппуашу в його власній землі й узяв його столицю Уру. Країна лежить нині на півдні Туреччини."
  es:
    - "En la imagen de Ezequiel de Tiro como una espléndida nave se enumeran sus defensores: «Y los hijos de Arvad con tu ejército estuvieron sobre tus muros alrededor, y los Gammadeos en tus torres». La palabra hebrea traducida «tu ejército», helek, puede leerse también como nombre de lugar, Helec, puesto junto a Arvad como otro pueblo de la costa. La versión King James, la Biblia sinodal rusa y la Septuaginta griega lo toman por «ejército»; la Revised Standard Version y varias traducciones modernas leen Helec, y algunas, como la New Century Version, dicen simplemente Cilicia. J. Simons dudó de que se aludiera a un lugar."
    - "Si es un lugar, Helec es el Hilakku de los textos asirios, un reino de las montañas del Tauro en lo que los griegos llamaron después Cilicia Traquea, que dio su nombre a toda la región de Cilicia. Sargón II dio Hilakku a Ambaris, rey de Tabal, y lo deportó a Asiria en 713 a. C.; Senaquerib sofocó allí una rebelión en 696 a. C., y Esar-hadón afirmó haber conquistado a sus rebeldes. Bajo los babilonios la tierra se llamó Pirindu, y en 557 a. C. Neriglisar persiguió a su rey Appuashu hasta su propio país y tomó su capital, Ura. La tierra se halla hoy en el sur de Turquía."
  pt:
    - "Na imagem de Ezequiel de Tiro como um esplêndido navio, seus defensores são listados: “Os homens de Arvade com o seu exército estavam sobre os seus muros ao redor, e homens valentes estavam nas suas torres”. A palavra hebraica traduzida por “exército”, helek, também pode ser lida como nome de lugar, Helec, posta ao lado de Arvade como outro povo da costa. A Versão King James, a Bíblia sinodal russa e a Septuaginta grega a tomam por “exército”; a Revised Standard Version e várias traduções modernas leem Helec, e algumas, como a New Century Version, dizem simplesmente Cilícia. J. Simons duvidava de que se tratasse de um lugar."
    - "Se é um lugar, Helec é a Hilakku dos textos assírios, um reino das montanhas do Tauro no que os gregos chamaram depois de Cilícia Áspera, cujo nome deu nome a toda a região da Cilícia. Sargão II deu Hilakku a Ambaris, rei de Tabal, e o deportou para a Assíria em 713 a.C.; Senaqueribe sufocou ali uma revolta em 696 a.C., e Esar-Hadom afirmou ter conquistado seus rebeldes. Sob os babilônios a terra se chamava Pirindu, e em 557 a.C. Neriglissar perseguiu seu rei Appuashu até sua própria terra e tomou sua capital, Ura. A terra fica hoje no sul da Turquia."
  de:
    - "In Hesekiels Bild von Tyrus als prächtigem Schiff werden seine Verteidiger aufgezählt: „Die von Arvad waren unter deinem Heer rings um die Mauern und Wächter auf deinen Türmen“. Das hebräische Wort helek, in diesem Text mit „Heer“ wiedergegeben, kann auch als Ortsname gelesen werden, Helech, neben Arvad als ein weiteres Küstenvolk. Die King-James-Bibel, die russische Synodalbibel und die griechische Septuaginta fassen es als Heer auf; die Revised Standard Version und mehrere moderne Übersetzungen lesen Helech, und manche, wie die New Century Version, sagen schlicht Kilikien. J. Simons bezweifelte, dass ein Ort gemeint sei."
    - "Wenn es ein Ort ist, ist Helech das Hilakku der assyrischen Texte, ein Königreich im Taurusgebirge in dem, was die Griechen später das Rauhe Kilikien nannten, dessen Name der ganzen Region Kilikien ihren Namen gab. Sargon II. gab Hilakku dem Ambaris, König von Tabal, und deportierte ihn 713 v. Chr. nach Assyrien; Sanherib schlug dort 696 v. Chr. einen Aufstand nieder, und Asarhaddon rühmte sich, seine Aufrührer unterworfen zu haben. Unter den Babyloniern hieß das Land Pirindu, und 557 v. Chr. verfolgte Neriglissar seinen König Appuaschu in dessen eigenes Land und nahm seine Hauptstadt Ura. Das Land liegt heute in der Südtürkei."
  fr:
    - "Dans l’image qu’Ézéchiel donne de Tyr en navire magnifique, ses défenseurs sont énumérés : les hommes d’Arvad avec ton armée étaient sur tes murailles tout autour, et les Gammadim dans tes tours (version du roi Jacques). Le mot hébreu rendu par « ton armée », helek, peut aussi se lire comme un nom de lieu, Hélek, posé à côté d’Arvad comme un autre peuple de la côte. La version du roi Jacques, la Bible synodale russe et la Septante grecque y voient une « armée » ; la Revised Standard Version et plusieurs traductions modernes lisent Hélek, et certaines, comme la New Century Version, disent simplement Cilicie. J. Simons doutait qu’un lieu soit visé."
    - "Si c’est un lieu, Hélek est le Hilakku des textes assyriens, royaume des montagnes du Taurus dans ce que les Grecs appelèrent plus tard la Cilicie Trachée, dont le nom donna son nom à toute la région de Cilicie. Sargon II donna le Hilakku à Ambaris, roi de Tabal, et le déporta en Assyrie en 713 av. J.-C. ; Sanchérib y réprima un soulèvement en 696 av. J.-C., et Esar-Haddon prétendit avoir conquis ses rebelles. Sous les Babyloniens, le pays s’appelait Pirindu, et en 557 av. J.-C. Nériglissar poursuivit son roi Appuashu dans son propre pays et prit sa capitale, Ura. Le pays se trouve aujourd’hui dans le sud de la Turquie."
  it:
    - "Nel quadro di Ezechiele su Tiro come nave splendida sono elencati i suoi difensori: «I figliuoli d’Arvad e il tuo esercito guarniscono d’ogn’intorno le tue mura». La parola ebraica resa «il tuo esercito», helek, può anche essere letta come nome di luogo, Chelech, posto accanto ad Arvad come un altro popolo della costa. La King James Version, la Bibbia sinodale russa e la Settanta greca la intendono come «esercito»; la Revised Standard Version e varie traduzioni moderne leggono Chelech, e alcune, come la New Century Version, dicono semplicemente Cilicia. J. Simons dubitava che si intendesse un luogo."
    - "Se è un luogo, Chelech è l’Hilakku dei testi assiri, un regno dei monti del Tauro in quella che i Greci chiamarono poi Cilicia Aspra, il cui nome diede il nome a tutta la regione della Cilicia. Sargon II diede Hilakku ad Ambaris, re di Tabal, e lo deportò in Assiria nel 713 a.C.; Sennacherib represse una rivolta là nel 696 a.C., ed Assaraddon affermò di aver conquistato i suoi ribelli. Sotto i Babilonesi il paese si chiamava Pirindu, e nel 557 a.C. Neriglissar inseguì il suo re Appuashu nel suo stesso paese e prese la sua capitale, Ura. Il paese si trova oggi nella Turchia meridionale."
  nl:
    - "In Ezechiëls beeld van Tyrus als een prachtig schip worden zijn verdedigers opgesomd: “De kinderen van Arvad en uw heir waren rondom op uw muren, en de Gammadieten waren op uw torens”. Het Hebreeuwse woord dat met “uw heir” is weergegeven, helek, kan ook worden gelezen als een plaatsnaam, Chelech, naast Arwad gezet als een ander kustvolk. De King James Version, de Russische Synodale Bijbel en de Griekse Septuaginta vatten het op als “leger”; de Revised Standard Version en verscheidene moderne vertalingen lezen Chelech, en sommige, zoals de New Century Version, zeggen eenvoudig Cilicië. J. Simons betwijfelde dat een plaats bedoeld is."
    - "Als het een plaats is, is Chelech het Hilakku van Assyrische teksten, een koninkrijk in het Taurusgebergte in wat de Grieken later het Ruwe Cilicië noemden, wier naam de hele streek Cilicië haar naam gaf. Sargon II gaf Hilakku aan Ambaris, koning van Tabal, en voerde hem in 713 v.Chr. naar Assyrië weg; Sanherib sloeg er in 696 v.Chr. een opstand neer, en Esarhaddon beweerde de rebellen te hebben onderworpen. Onder de Babyloniërs heette het land Pirindu, en in 557 v.Chr. achtervolgde Neriglissar zijn koning Appuashu in zijn eigen land en nam zijn hoofdstad Ura in. Het land ligt tegenwoordig in het zuiden van Turkije."
  pl:
    - "W obrazie Tyru jako wspaniałego okrętu u Ezechiela wyliczeni są jego obrońcy: „Synowie Arwad z wojskiem twojem na murach twoich w około, także Gamadczycy na wieżach twoich bywali”. Hebrajskie słowo oddane jako „wojsko twoje”, helek, można też czytać jako nazwę miejscową, Chelech, postawioną obok Arwad jako inny lud wybrzeża. Biblia Króla Jakuba, rosyjska Biblia synodalna i grecka Septuaginta biorą je za „wojsko”; Revised Standard Version i kilka współczesnych przekładów czyta Chelech, a niektóre, jak New Century Version, mówią po prostu Cylicja. J. Simons wątpił, by chodziło o miejsce."
    - "Jeśli jest to miejsce, Chelech to Hilakku tekstów asyryjskich, królestwo w górach Taurusu w tym, co Grecy nazwali później Cylicją Górzystą, którego nazwa dała imię całemu regionowi Cylicji. Sargon II dał Hilakku Ambarisowi, królowi Tabalu, i deportował go do Asyrii w 713 p.n.e.; Sennacheryb stłumił tam powstanie w 696 p.n.e., a Asarhaddon twierdził, że podbił jego buntowników. Za Babilończyków kraj zwano Pirindu, a w 557 p.n.e. Neriglissar ścigał jego króla Appuaszu do jego własnej ziemi i zdobył jego stolicę Urę. Kraj leży dziś w południowej Turcji."
  cs:
    - "V Ezechielově obraze Týru jako nádherné lodi jsou vyjmenováni její obránci: „Arvadští s vojskem tvým na zdech tvých vůkol, též Gamadští na věžech tvých bývali“. Hebrejské slovo přeložené jako „vojsko tvé“, chel, lze číst i jako místní jméno, Chelek, postavené vedle Arvadu jako další lid pobřeží. Bible krále Jakuba, ruská synodální Bible i řecká Septuaginta je chápou jako „vojsko“; Revised Standard Version a několik moderních překladů čtou Chelek a některé, například New Century Version, prostě říkají Kilikie. J. Simons pochyboval, že je míněno místo."
    - "Je-li to místo, je Chelek asyrské Hilakku, království v pohoří Taurus v tom, co Řekové později nazývali Drsná Kilikie, jehož jméno dalo jméno celé oblasti Kilikie. Sargon II. dal Hilakku Ambarisovi, králi Tabalu, a deportoval ho do Asýrie roku 713 př. n. l.; Senacherib potlačil povstání tamtéž roku 696 př. n. l. a Asarhadón tvrdil, že dobyl jeho vzbouřence. Za Babyloňanů se země nazývala Pirindu a roku 557 př. n. l. pronásledoval Neriglissar jejího krále Appuašu do jeho vlastní země a dobyl jeho hlavní město Uru. Země leží dnes v jižním Turecku."
  sv:
    - "I Hesekiels bild av Tyros som ett praktfullt skepp räknas dess försvarare upp: ”Arvads söner stodo med din här runt om på dina murar, gamadéer hade sin plats i dina torn”. Det hebreiska ordet som återges ”din här”, helek, kan också läsas som ett ortnamn, Helek, satt bredvid Arvad som ännu ett folk på kusten. King James-bibeln, den ryska synodalbibeln och den grekiska Septuaginta tar det som ”här”; Revised Standard Version och flera moderna översättningar läser Helek, och några, såsom New Century Version, säger helt enkelt Kilikien. J. Simons betvivlade att en plats avses."
    - "Om det är en plats är Helek assyriska texters Hilakku, ett kungarike i Taurusbergen i vad grekerna senare kallade Bergiga Kilikien, vars namn gav hela regionen Kilikien dess namn. Sargon II gav Hilakku åt Ambaris, kung av Tabal, och deporterade honom till Assyrien 713 f.Kr.; Sanherib slog ned ett uppror där 696 f.Kr., och Esarhaddon hävdade sig ha erövrat dess rebeller. Under babylonierna kallades landet Pirindu, och 557 f.Kr. förföljde Neriglissar dess kung Appuashu in i hans eget land och intog hans huvudstad Ura. Landet ligger i dag i södra Turkiet."
  nb:
    - "I Esekiels bilde av Tyros som et praktfullt skip regnes forsvarerne opp: «Arvads sønner stod med din egen hær på dine murer rundt omkring og djerve menn på dine tårn». Det hebraiske ordet som gjengis «din egen hær», helek, kan også leses som et stedsnavn, Helek, satt ved siden av Arvad som et annet folk på kysten. King James-oversettelsen, den russiske synodalbibelen og den greske Septuaginta tar det som «hær»; Revised Standard Version og flere moderne oversettelser leser Helek, og noen, som New Century Version, sier rett og slett Kilikia. J. Simons tvilte på at et sted er ment."
    - "Hvis det er et sted, er Helek Hilakku i assyriske tekster, et kongedømme i Taurus-fjellene i det grekerne senere kalte Det ulendte Kilikia, hvis navn ga hele regionen Kilikia sitt navn. Sargon 2. ga Hilakku til Ambaris, konge av Tabal, og deporterte ham til Assyria i 713 f.Kr.; Sankerib slo ned et opprør der i 696 f.Kr., og Asarhaddon hevdet å ha erobret dets opprørere. Under babylonerne ble landet kalt Pirindu, og i 557 f.Kr. forfulgte Neriglissar dets konge Appuashu inn i hans eget land og tok hovedstaden Ura. Landet ligger i dag i det sørlige Tyrkia."
  tl:
    - "Sa larawan ni Ezekiel ng Tiro bilang isang marangyang barko, itinatala ang mga tagapagtanggol nito: “Ang mga lalake sa Arvad na kasama ng iyong hukbo ay nangasa ibabaw ng iyong mga kuta sa palibot, at ang mga matatapang ay nasa iyong mga moog”. Ang salitang Hebreo na isinalin na “hukbo”, helek, ay mababasa rin bilang pangalan ng lugar, Helech, na inilagay sa tabi ng Arvad bilang isa pang bayan ng baybayin. Ang King James Version, ang Bibliyang Synodal na Ruso at ang Septuagint na Griyego ay kumukuha nito bilang “hukbo”; ang Revised Standard Version at ilang makabagong salin ay nagbabasa ng Helech, at ang ilan, gaya ng New Century Version, ay simpleng nagsasabing Cilicia. Pinagdudahan ni J. Simons na lugar ang tinutukoy."
    - "Kung lugar ito, ang Helech ay ang Hilakku ng mga tekstong Asirio, isang kaharian ng mga bundok ng Taurus sa tinawag kalaunan ng mga Griyego na Magaspang na Cilicia, na ang pangalan ang nagbigay ng pangalan sa buong rehiyon ng Cilicia. Ibinigay ni Sargon II ang Hilakku kay Ambaris, hari ng Tabal, at itinapon siya sa Asiria noong 713 BK; sinupil ni Sennacherib ang isang pag-aalsa roon noong 696 BK, at inangkin ni Esar-hadon na nasakop ang mga rebelde nito. Sa ilalim ng mga Babilonio ang lupain ay tinawag na Pirindu, at noong 557 BK hinabol ni Neriglissar ang hari nitong si Appuashu sa kaniyang sariling lupain at sinakop ang kabisera nito, ang Ura. Ang lupain ay nasa timog Turkiya ngayon."
  da:
    - "I Ezekiels billede af Tyrus som et prægtigt skib opregnes dets forsvarere: »Arvads Børn og din Hær vare paa dine Mure trindt omkring, og tapre Mænd vare paa dine Taarne«. Det hebraiske ord, gengivet »din Hær«, helek, kan også læses som et stednavn, Helek, sat ved siden af Arvad som endnu et kystfolk. King James-oversættelsen, den russiske synodalbibel og den græske Septuaginta tager det som »hær«; Revised Standard Version og flere moderne oversættelser læser Helek, og nogle, som New Century Version, siger blot Kilikien. J. Simons betvivlede, at der menes et sted."
    - "Hvis det er et sted, er Helek Hilakku i assyriske tekster, et kongerige i Taurusbjergene i det, grækerne senere kaldte Det Barske Kilikien, hvis navn gav hele Kilikien-regionen dens navn. Sargon II gav Hilakku til Ambaris, konge af Tabal, og deporterede ham til Assyrien i 713 f.Kr.; Sankerib nedkæmpede et oprør der i 696 f.Kr., og Esarhaddon påstod at have erobret dets oprørere. Under babylonierne hed landet Pirindu, og i 557 f.Kr. forfulgte Neriglissar dets konge Appuashu ind i hans eget land og indtog hans hovedstad, Ura. Landet ligger i dag i det sydlige Tyrkiet."
  sr:
    - "У Језекиљевој слици Тира као раскошне лађе набрајају се његови браниоци: „Синови арвадски с твојом војском беху на зидовима твојим унаоколо, и Гамадеји беху у кулама твојим“. Хебрејска реч преведена као „твоја војска“, хелек, може се читати и као име места, Хелех, постављено уз Арвад као још један народ обале. Превод краља Џејмса, руски синодски превод и грчка Септуагинта узимају је као „војску“; Revised Standard Version и неколико савремених превода читају Хелех, а неки, као New Century Version, једноставно кажу Киликија. Ј. Симонс сумњао је да је место мишљено."
    - "Ако је место, Хелех је Хилаку асирских текстова, краљевство планина Таурус у ономе што су Грци касније звали Груба Киликија, чије је име дало име целој области Киликији. Саргон II дао је Хилаку Амбарису, цару Табала, и прогнао га у Асирију 713. п. н. е.; Сенахирим је угушио устанак тамо 696. п. н. е., а Есарадон је тврдио да је покорио њене бунџије. Под Вавилонцима земља се звала Пиринду, а 557. п. н. е. Нериглисар је гонио њеног цара Апуашуа у његову земљу и узео његову престоницу, Уру. Земља данас лежи у јужној Турској."
  hu:
    - "Ezékiel Tíruszt pompás hajóként ábrázoló képében felsorolja védőit: „Arvad fiai és sereged voltak kőfalaidon köröskörül, és kemény vitézek voltak tornyaidban”. A „sereged” szóval visszaadott héber szó, a helek, helynévként is olvasható, Helek, Arvád mellett a part egy másik népeként. A King James Version, a szinodális orosz Biblia és a görög Septuaginta seregnek veszi; a Revised Standard Version és több modern fordítás Helek-et olvas, egyesek, például a New Century Version, egyszerűen Kilikiát mondanak. J. Simons kétségbe vonta, hogy helyet értenek rajta."
    - "Ha helyről van szó, Helek az asszír szövegek Hilakkuja, a Taurusz hegyeinek királysága a görögök későbbi Sziklás-Kilikiájában, amelynek neve az egész Kilikia vidéknek adta a nevét. II. Szargon Hilakkut Ambarisznak, Tabal királyának adta, és Kr. e. 713-ban Asszíriába hurcolta; Szanhérib Kr. e. 696-ban leverte egy ottani felkelést, Asszarhaddon pedig azt állította, hogy meghódította lázadóit. A babiloniak alatt a földet Pirindunak nevezték, és Kr. e. 557-ben Neriglissar üldözni kezdte királyát, Appuasut a saját földjére, és elfoglalta fővárosát, Úrát. A föld ma Dél-Törökországban fekszik."
  fi:
    - "Hesekielin kuvassa Tyroksesta upeana laivana sen puolustajat luetellaan: ”Arvadilaiset ja muu sotajoukkosi olivat muureillasi yltympäri ja gammadilaiset torneissasi”. Heprean sana, joka on käännetty ”sotajoukkosi”, helek, voidaan lukea myös paikannimeksi, Helek, Arvadin rinnalle toiseksi rannikon kansaksi. King James -käännös, venäläinen synodaalinen Raamattu ja kreikkalainen Septuaginta pitävät sitä ”sotajoukkona”; Revised Standard Version ja useat nykyiset käännökset lukevat Helek, ja jotkut, kuten New Century Version, sanovat yksinkertaisesti Kilikia. J. Simons epäili, että paikkaa tarkoitetaan."
    - "Jos se on paikka, Helek on assyrialaisten tekstien Hilakku, Taurusvuorten kuningaskunta alueella, jota kreikkalaiset kutsuivat myöhemmin Vuoristo-Kilikiaksi ja jonka nimi antoi koko Kilikian alueelle sen nimen. Sargon II antoi Hilakun Tabalin kuninkaalle Ambarisille ja karkotti hänet Assyriaan vuonna 713 eaa.; Sanherib tukahdutti siellä kapinan vuonna 696 eaa., ja Esarhaddon väitti valloittaneensa sen kapinalliset. Babylonialaisten aikana maata kutsuttiin nimellä Pirindu, ja vuonna 557 eaa. Neriglissar ajoi sen kuningasta Appuashua takaa tämän omaan maahan ja valtasi sen pääkaupungin Uran. Maa on nykyään Etelä-Turkissa."
  vi:
    - "Trong bức tranh của Ê-xê-chi-ên về Ty-rơ như một chiếc tàu lộng lẫy, những người bảo vệ được liệt kê: “Những người A-vát cùng quân lính riêng của mầy đầy vách thành mầy, những người mạnh mẽ thì ở trên các tháp”. Từ Hê-bơ-rơ được dịch là “quân lính riêng của mầy”, helek, cũng có thể đọc là địa danh, Hê-lết, đặt cạnh A-vát như một dân khác của bờ biển. Bản King James, bản Synodal Nga và bản Bảy Mươi Hy Lạp coi là “quân đội”; Revised Standard Version và vài bản dịch hiện đại đọc là Hê-lết, và một số, như New Century Version, nói thẳng là Si-li-si. J. Simons nghi ngờ rằng ở đây có nói đến một địa danh."
    - "Nếu là địa danh, Hê-lết là Hilakku của các văn bản A-si-ri, một vương quốc ở dãy Taurus trong vùng mà người Hy Lạp về sau gọi là Si-li-si Gồ Ghề, và tên của vương quốc này đã trở thành tên của cả vùng Si-li-si. Sargon II ban Hilakku cho Ambaris, vua Tabal, và đày ông sang A-si-ri năm 713 TCN; San-chê-ríp dẹp một cuộc nổi dậy ở đó năm 696 TCN, và Ê-sạt-ha-đôn tuyên bố đã chinh phục những kẻ nổi loạn. Dưới thời Babylon, xứ này gọi là Pirindu, và năm 557 TCN Neriglissar đuổi vua Appuashu về tận xứ của vua ấy và chiếm thủ đô Ura. Xứ này ngày nay nằm ở nam Thổ Nhĩ Kỳ."
  ro:
    - "În imaginea lui Ezechiel despre Tir ca o corabie strălucitoare sunt enumerați apărătorii ei: „Fiii Aradiilor și puterea ta preste zidurile tale, împrejur în turnurile tale erau păzitori”. Cuvântul ebraic redat prin „puterea ta”, helek, poate fi citit și ca nume de loc, Helech, pus lângă Arvad ca alt popor de pe coastă. Versiunea King James, Biblia sinodală rusă și Septuaginta greacă îl iau drept „oaste”; Revised Standard Version și mai multe traduceri moderne citesc Helech, iar unele, ca New Century Version, spun pur și simplu Cilicia. J. Simons s-a îndoit că ar fi vorba de un loc."
    - "Dacă este un loc, Helech este Hilakku din textele asiriene, un regat al munților Taurus din ceea ce grecii au numit mai târziu Cilicia Aspră, al cărui nume a dat numele întregii regiuni Cilicia. Sargon al II-lea a dat Hilakku lui Ambaris, regele Tabalului, și l-a deportat în Asiria în 713 î.Hr.; Senaherib a înăbușit acolo o răscoală în 696 î.Hr., iar Esar-Hadon a pretins că i-a cucerit pe rebelii ei. Sub babilonieni, țara se numea Pirindu, iar în 557 î.Hr. Neriglisar l-a urmărit pe regele ei Appuașu pe propriul său teritoriu și i-a luat capitala, Ura. Țara se află astăzi în sudul Turciei."
  bg:
    - "В картината на Йезекиил за Тир като великолепен кораб са изброени защитниците му: „Арвадските мъже с воинството ти бяха на стените ти изоколо, и Гамадците на стълповете ти“. Еврейската дума, предадена като „воинството ти“, хелек, може да се прочете и като име на място, Хелех, поставено до Арвад като друг народ от крайбрежието. King James Version, руската Синодална Библия и гръцката Септуагинта я разбират като „войска“; Revised Standard Version и няколко съвременни превода четат Хелех, а някои, като New Century Version, казват направо Киликия. Й. Симонс се съмняваше, че се има предвид място."
    - "Ако е място, Хелех е Хилакку от асирийските текстове — царство в планината Тавър в онова, което гърците по-късно наричаха Планинска Киликия, чието име даде името на цялата област Киликия. Саргон II даде Хилакку на Амбарис, царя на Табал, и го изсели в Асирия през 713 г. пр.н.е.; Сенахирим потуши там въстание през 696 г. пр.н.е., а Асардан твърдеше, че е покорил бунтовниците му. При вавилонците земята се наричаше Пиринду, а през 557 г. пр.н.е. Нериглисар преследва царя ѝ Апуашу в собствената му земя и превзе столицата му, Ура. Земята днес е в Южна Турция."
