# Overview article (ADR 0007). Ezek 27:11: whether the Hebrew is the place Helech (= Assyrian Hilakku, Rough Cilicia; the map's point) or "thine army" (KJV, Synodal, LXX; Simons) is shown without choosing. Cilicia has its own article.
