# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the app's candidates are given without choosing one.
id: mount-hor-north
place: a62fa2d
title:
  en: "Mount Hor (northern border)"
  ru: "Гора Ор (северная граница)"
  uk: "Гора Гор (північний кордон)"
  es: "Monte Hor (frontera norte)"
  pt: "Monte Hor (fronteira norte)"
  de: "Berg Hor (Nordgrenze)"
  fr: "Mont Hor (frontière nord)"
  it: "Monte Or (confine settentrionale)"
  pl: "Góra Hor (granica północna)"
  nl: "Berg Hor (noordgrens)"
  cs: "Hora Hor (severní hranice)"
  sv: "Berget Hor (norra gränsen)"
  nb: "Hor-fjellet (nordgrensen)"
  tl: "Bundok Hor (hilagang hangganan)"
  da: "Hor (nordgrænsen)"
  sr: "Гора Ор (северна граница)"
body:
  en:
    - "This Mount Hor is not the mountain where Aaron died but a peak on the northern border of the promised land, as Moses was told to draw it: “And this shall be your north border: from the great sea ye shall point out for you mount Hor: From mount Hor ye shall point out your border unto the entrance of Hamath; and the goings forth of the border shall be to Zedad.” So the line ran from the Mediterranean inland by way of the mountain to Lebo-hamath, usually placed at Lebweh in the northern Beqaa, and Zedad, probably the town of Sadad in Syria. The Hebrew, hor ha-har, can be read as “the mountain of the mountain”, and these are the only two verses that name it. Ezekiel’s parallel description of the northern border does not mention it."
    - "Which mountain is meant is disputed. The map marks first Mount Hermon, the highest peak of the region; the Aramaic Targum Pseudo-Jonathan renders it Taurus Amanus, a range much further north, and the Talmud also draws the northern limit at that range; Jebel Akkar, the northern end of the Lebanon range above the Eleutherus valley, fits a border running inland towards Hamath; and Ras Shaqqa, the coastal headland south of Tripoli that the Greeks called Theouprosopon, would mark the starting point on the sea. None of these can be proved, and the border itself may describe an ideal rather than a frontier Israel ever held."
  ru:
    - "Эта гора Ор — не та, где умер Аарон, а вершина на северной границе обетованной земли, как велено было провести её Моисею: «к северу же будет у вас граница: от великого моря проведите ее к горе Ор, от горы Ор проведите к Емафу, и будут выступы границы к Цедаду». Значит, линия шла от Средиземного моря вглубь суши через эту гору к входу в Емаф, который обычно помещают в Лебве на севере долины Бекаа, и к Цедаду — вероятно, селению Садад в Сирии. Еврейское «ор ха-ар» можно понять как «гора горы», и называют её только эти два стиха. Иезекииль, описывая ту же северную границу, её не упоминает."
    - "Какая гора имеется в виду — спорно. На карте первой отмечена гора Ермон, высочайшая вершина края; арамейский Таргум Псевдо-Ионафана передаёт имя как Тавр Аманский — хребет гораздо севернее, и Талмуд тоже проводит северный предел по этому хребту; Джебель-Аккар, северный конец Ливанского хребта над долиной Элевфера, подходит к границе, идущей вглубь к Емафу; а Рас-Шакка, прибрежный мыс к югу от Триполи, который греки называли Феупросопон, отмечал бы начало линии на море. Ни одно из мест не доказано, и сама граница, возможно, описывает идеал, а не рубеж, которым Израиль когда-либо владел."
  uk:
    - "Ця Гора Гор — не гора, на якій помер Аарон, а вершина на північному кордоні обітованої землі, як Мойсею було сказано накреслити його: «А се буде вам гряницею на північ: Від Великого моря проведете її до Гор гори; від Гор гори проведете її як раз до Гамата, і буде гряничнїй виступ до Зедаду». Отже, лінія йшла від Середземного моря вглиб країни через гору до Входу в Хамат, зазвичай розміщеного в Лабве на півночі Бекаа, і Зедаду, імовірно міста Садад у Сирії. Староєврейське хор га-хар можна прочитати як «гора гори», і ці два вірші — єдині, що її називають. Паралельний опис північного кордону в Єзекіїля її не згадує."
    - "Яку гору мають на увазі, спірно. Мапа першою позначає гору Гермон, найвищу вершину краю; арамейський Таргум Псевдо-Йонатана передає її як Тавр Аманський (Taurus Amanus), хребет значно північніше, і Талмуд також проводить північну межу по тому хребту; Джебель-Аккар, північний кінець хребта Ліван над долиною Елевтера, пасує кордону, що йде вглиб країни до Хамату; а Рас-Шакка, прибережний мис на південь від Тріполі, який греки називали Теу-просопон, позначав би початок на морі. Нічого з цього не можна довести, і сам кордон може описувати ідеал, а не межу, яку Ізраїль коли-небудь тримав."
  es:
    - "Este monte Hor no es la montaña donde murió Aarón sino una cima de la frontera norte de la tierra prometida, tal como se mandó a Moisés trazarla: «Y el término del norte será este: desde la gran mar os señalaréis el monte de Hor; Del monte de Hor señalaréis á la entrada de Hamath, y serán las salidas de aquel término á Sedad». Así la línea iba desde el Mediterráneo tierra adentro por la montaña hasta la Entrada de Hamat (Lebo-hamat), que suele situarse en Lebweh, en el norte de la Bekaa, y Sedad, probablemente la ciudad de Sadad, en Siria. El hebreo, hor ha-har, puede leerse como «la montaña de la montaña», y estos son los únicos dos versículos que la nombran. La descripción paralela de la frontera norte en Ezequiel no la menciona."
    - "Se discute qué montaña es. El mapa marca en primer lugar el monte Hermón, el pico más alto de la región; el Targum arameo Pseudo-Jonatán la traduce Tauro Amano, una cordillera mucho más al norte, y el Talmud traza también el límite septentrional en esa cordillera; el Yebel Akkar, el extremo norte de la cordillera del Líbano sobre el valle del Eleutero, concuerda con una frontera que va tierra adentro hacia Hamat; y Ras Shaqqa, el cabo costero al sur de Trípoli que los griegos llamaban Theouprosopon, marcaría el punto de partida en el mar. Ninguna de estas opciones puede probarse, y la frontera misma puede describir un ideal más que una frontera que Israel haya poseído alguna vez."
  pt:
    - "Este monte Hor não é a montanha onde Arão morreu, mas um pico na fronteira norte da terra prometida, como Moisés recebeu ordem de traçá-la: “Esta será a sua fronteira norte: desde o mar Grande vocês marcarão para si o monte Hor. Do monte Hor vocês marcarão até a entrada de Hamate; e a fronteira passará por Zedade.” Assim a linha corria do Mediterrâneo para o interior, pela montanha, até Lebo-Hamate, geralmente situada em Lebweh, no norte da Beqaa, e Zedade, provavelmente a cidade de Sadad, na Síria. O hebraico, hor ha-har, pode ser lido como “a montanha da montanha”, e esses são os únicos dois versículos que a nomeiam. A descrição paralela de Ezequiel da fronteira norte não a menciona."
    - "Qual montanha se quer dizer é disputado. O mapa marca em primeiro lugar o monte Hermom, o pico mais alto da região; o Targum aramaico Pseudo-Jônatas a traduz por Tauro Amano, uma cordilheira muito mais ao norte, e o Talmude também traça o limite norte nessa cordilheira; o Jebel Akkar, a extremidade norte da cordilheira do Líbano acima do vale do Eleutero, combina com uma fronteira que corre para o interior rumo a Hamate; e Ras Shaqqa, o promontório costeiro ao sul de Trípoli que os gregos chamavam Theouprosopon, marcaria o ponto de partida no mar. Nada disso pode ser provado, e a própria fronteira pode descrever um ideal e não uma fronteira que Israel jamais tenha mantido."
  de:
    - "Dieser Berg Hor ist nicht der Berg, auf dem Aaron starb, sondern ein Gipfel an der Nordgrenze des verheißenen Landes, wie Mose sie ziehen sollte: „Die Grenze gegen Mitternacht soll diese sein: ihr sollt messen von dem großen Meer bis an den Berg Hor, und von dem Berg Hor messen, bis man kommt gen Hamath, das der Ausgang der Grenze sei gen Zedad“. Die Linie lief also vom Mittelmeer landeinwärts über den Berg nach Lebo-Hamat, meist bei Lebweh im nördlichen Bekaa angesetzt, und Zedad, wahrscheinlich der Stadt Sadad in Syrien. Das Hebräische, hor ha-har, lässt sich als „der Berg des Berges“ lesen, und dies sind die einzigen beiden Verse, die ihn nennen. Hesekiels Parallelbeschreibung der Nordgrenze erwähnt ihn nicht."
    - "Welcher Berg gemeint ist, ist umstritten. Die Karte zeigt zuerst den Hermon, den höchsten Gipfel der Region; der aramäische Targum Pseudo-Jonathan gibt ihn als Taurus Amanus wieder, ein weit nördlicheres Gebirge, und auch der Talmud zieht die Nordgrenze an diesem Gebirge; der Dschebel Akkar, das Nordende des Libanongebirges über dem Tal des Eleutheros, passt zu einer Grenze, die landeinwärts auf Hamat zuläuft; und Ras Shaqqa, die Küstenlandspitze südlich von Tripolis, die die Griechen Theouprosopon nannten, würde den Ausgangspunkt am Meer markieren. Nichts davon lässt sich beweisen, und die Grenze selbst mag ein Ideal beschreiben und keine Grenze, die Israel je hielt."
  fr:
    - "Ce mont Hor n’est pas la montagne où mourut Aaron mais un sommet de la frontière nord de la terre promise, telle que Moïse reçut l’ordre de la tracer : « Voici quelle sera votre limite septentrionale : à partir de la grande mer, vous la tracerez jusqu’à la montagne de Hor ; depuis la montagne de Hor, vous la ferez passer par Hamath, et arriver à Tsedad ». La ligne allait donc de la Méditerranée vers l’intérieur par la montagne jusqu’à Lebo-Hamath, d’ordinaire placée à Labweh dans le nord de la Bekaa, et à Tsedad, probablement la ville de Sadad en Syrie. L’hébreu, hor ha-har, peut se lire « la montagne de la montagne », et ce sont les deux seuls versets qui la nomment. La description parallèle de la frontière nord chez Ézéchiel ne la mentionne pas."
    - "On discute de la montagne visée. La carte marque d’abord le mont Hermon, plus haut sommet de la région ; le Targoum araméen du Pseudo-Jonathan la rend par Taurus Amanus, chaîne beaucoup plus au nord, et le Talmud trace aussi la limite nord à cette chaîne ; le djebel Akkar, extrémité nord de la chaîne du Liban au-dessus de la vallée de l’Éleuthère, convient à une frontière courant vers l’intérieur vers Hamath ; et Ras Shaqqa, le promontoire côtier au sud de Tripoli que les Grecs appelaient Théouprosopon, marquerait le point de départ sur la mer. Rien de cela ne peut être prouvé, et la frontière elle-même peut décrire un idéal plutôt qu’une limite qu’Israël ait jamais tenue."
  it:
    - "Questo Monte Or non è il monte dove morì Aronne ma una vetta sul confine settentrionale della terra promessa, come Mosè ricevette l’ordine di tracciarlo: «E questa sarà la vostra frontiera settentrionale: partendo dal mar grande, la traccerete fino al monte Hor; dal monte Hor la traccerete fin là dove s’entra in Hamath, e l’estremità della frontiera sarà a Tsedad». La linea correva dunque dal Mediterraneo verso l’interno attraverso il monte fino a Lebo-Camat, di solito posta a Lebweh nella Beqa‘ settentrionale, e a Zedad, probabilmente la città di Sadad in Siria. L’ebraico, hor ha-har, si può leggere «il monte del monte», e questi sono i soli due versetti che lo nominano. La descrizione parallela di Ezechiele del confine settentrionale non lo menziona."
    - "Quale monte sia inteso è discusso. La mappa segna per primo il Monte Ermon, la vetta più alta della regione; il Targum aramaico Pseudo-Jonathan lo rende Tauro Amano, una catena molto più a nord, e anche il Talmud traccia il limite settentrionale a quella catena; il Jebel Akkar, l’estremità settentrionale della catena del Libano sopra la valle dell’Eleutero, si accorda con un confine che corre verso l’interno verso Camat; e Ras Shaqqa, il promontorio costiero a sud di Tripoli che i Greci chiamavano Theouprosopon, segnerebbe il punto di partenza sul mare. Nessuna di queste ipotesi può essere provata, e il confine stesso può descrivere un ideale piuttosto che una frontiera mai tenuta da Israele."
  pl:
    - "Ta góra Hor nie jest górą, na której umarł Aaron, lecz szczytem na północnej granicy ziemi obiecanej, tak jak Mojżeszowi kazano ją wytyczyć: „To zaś wasza będzie granica północna; od morza wielkiego wymierzycie sobie do góry Hor. Potem od góry Hor wymierzycie granice, aż gdzie wchodzą do Hemat; a będą się kończyć granice aż do Sedada.” Linia biegła więc od Morza Śródziemnego w głąb lądu przez górę do Lebo-Chamat, zwykle umieszczonego w Lebweh w północnej Bice, i do Sedad, prawdopodobnie miasta Sadad w Syrii. Hebrajskie hor ha-har można czytać jako „góra góry”, a tylko te dwa wersety ją wymieniają. Równoległy opis północnej granicy u Ezechiela jej nie wspomina."
    - "Która to góra, jest sporne. Mapa zaznacza najpierw Hermon, najwyższy szczyt regionu; aramejski Targum Pseudo-Jonatana oddaje ją jako Taurus Amanus, pasmo o wiele dalej na północ, a Talmud też prowadzi północną granicę przy tym paśmie; Dżabal Akkar, północny kraniec pasma Libanu nad doliną Eleuteros, pasuje do granicy biegnącej w głąb lądu ku Chamatowi; a Ras Shaqqa, nadmorski przylądek na południe od Trypolisu, który Grecy zwali Teouprosopon, wyznaczałby punkt wyjścia na morzu. Żadnego z tych poglądów nie da się udowodnić, a sama granica może opisywać ideał, a nie granicę, którą Izrael kiedykolwiek posiadał."
  nl:
    - "Deze berg Hor is niet de berg waar Aäron stierf maar een piek aan de noordgrens van het beloofde land, zoals Mozes die moest trekken: “Voorts zal u de landpale van het noorden deze zijn: van de grote zee af zult gij u den berg Hor aftekenen. Van den berg Hor zult gij aftekenen tot daar men komt te Hamath; en de uitgangen dezer landpale zullen zijn naar Zedad.” De lijn liep dus van de Middellandse Zee landinwaarts langs de berg naar Lebo-Hamat, gewoonlijk geplaatst bij Lebweh in de noordelijke Bekaa, en Zedad, waarschijnlijk de stad Sadad in Syrië. Het Hebreeuwse hor ha-har kan worden gelezen als “de berg van de berg”, en dit zijn de enige twee verzen die hem noemen. Ezechiëls parallelle beschrijving van de noordgrens vermeldt hem niet."
    - "Welke berg bedoeld wordt, is omstreden. De kaart toont eerst de berg Hermon, de hoogste piek van de streek; de Aramese Targum Pseudo-Jonatan geeft hem weer als Taurus Amanus, een gebergte veel verder naar het noorden, en ook de Talmoed trekt de noordgrens bij dat gebergte; de Jebel Akkar, het noordelijke einde van het Libanongebergte boven het Eleutherusdal, past bij een grens die landinwaarts naar Hamat loopt; en Ras Shaqqa, de kaap ten zuiden van Tripoli die de Grieken Theouprosopon noemden, zou het beginpunt aan zee markeren. Niets hiervan kan worden bewezen, en de grens zelf beschrijft misschien een ideaal in plaats van een grens die Israël ooit bezat."
  cs:
    - "Tato hora Hor není hora, kde zemřel Áron, nýbrž vrchol na severní hranici zaslíbené země, jak ji měl Mojžíš vytyčit: „A pomezí půlnoční toto míti budete: Od moře velikého vyměříte sobě k hoře řečené Hor. Od hory Hor vyměříte sobě, až kde se vchází do Emat, a skonávati se bude pomezí to u Sedad.“ Čára tedy vedla od Středozemního moře do vnitrozemí přes horu k Lebo-chamatu, obvykle kladenému do Lebweh v severní Bekáe, a k Sedadu, pravděpodobně městu Sadad v Sýrii. Hebrejské hor ha-har lze číst jako „hora hory“ a tyto dva verše jsou jediná, která ji jmenují. Ezechielův paralelní popis severní hranice ji nezmiňuje."
    - "Která hora je míněna, je sporné. Mapa uvádí nejprve Hermon, nejvyšší vrchol oblasti; aramejský Targum Pseudo-Jonatan ji překládá Taurus Amanus, pohoří mnohem severněji, a Talmud také vede severní mez k tomuto pohoří; Jebel Akkar, severní konec libanonského pohoří nad údolím Eleutheru, odpovídá hranici vedoucí do vnitrozemí k Chamatu; a Ras Shaqqa, pobřežní mys jižně od Tripolisu, který Řekové nazývali Theouprosopon, by označoval výchozí bod na moři. Nic z toho nelze prokázat a hranice sama může popisovat ideál, spíše než hranici, kterou Izrael kdy držel."
  sv:
    - "Detta Hor är inte berget där Aron dog utan en topp på det utlovade landets norra gräns, så som Mose fick höra att den skulle dras: ”Och detta skall vara eder gräns i norr: Från Stora havet skolen I draga eder gränslinje fram vid berget Hor. Från berget Hor skolen I draga eder gränslinje dit där vägen går till Hamat, och gränsen skall gå ut vid Sedad.” Linjen löpte alltså från Medelhavet inåt land förbi berget till Lebo-Hamat, vanligen förlagt till Lebweh i norra Bekaa, och Sedad, sannolikt staden Sadad i Syrien. Det hebreiska hor ha-har kan läsas som ”berget av berget”, och dessa är de enda två verser som nämner det. Hesekiels parallella beskrivning av den norra gränsen nämner det inte."
    - "Vilket berg som avses är omstritt. Kartan markerar först Hermon, regionens högsta topp; den arameiska Targum Pseudo-Jonatan återger det Taurus Amanus, en bergskedja långt längre norrut, och Talmud drar också den norra gränsen vid den kedjan; Jebel Akkar, Libanonkedjans norra ände ovanför Eleutherosdalen, passar en gräns som löper inåt land mot Hamat; och Ras Shaqqa, udden vid kusten söder om Tripoli som grekerna kallade Theouprosopon, skulle markera utgångspunkten vid havet. Inget av detta kan bevisas, och själva gränsen kan beskriva ett ideal snarare än en gräns som Israel någonsin höll."
  nb:
    - "Dette Hor-fjellet er ikke fjellet der Aron døde, men en topp på det lovte landets nordgrense, slik Moses fikk beskjed om å trekke den: «Og dette skal være eders grense i nord: Fra det store hav skal I avmerke grenselinjen til fjellet Hor. Fra fjellet Hor skal I avmerke grensen dit hvor veien går til Hamat, og grensen skal gå ut ved Sedad.» Linjen gikk altså fra Middelhavet innover via fjellet til Lebo-Hamat, vanligvis plassert ved Lebweh i den nordlige Beqaa, og Sedad, trolig byen Sadad i Syria. Det hebraiske, hor ha-har, kan leses som «fjellets fjell», og dette er de eneste to versene som nevner det. Esekiels parallelle beskrivelse av nordgrensen nevner det ikke."
    - "Hvilket fjell som menes, er omstridt. Kartet markerer først Hermon, regionens høyeste topp; det arameiske Targum Pseudo-Jonatan gjengir det Taurus Amanus, en kjede langt lenger nord, og Talmud trekker også nordgrensen ved den kjeden; Jebel Akkar, den nordlige enden av Libanon-kjeden over Eleutherus-dalen, passer med en grense som løper innover mot Hamat; og Ras Shaqqa, odden ved kysten sør for Tripoli som grekerne kalte Theouprosopon, ville markere utgangspunktet ved havet. Ingen av disse kan bevises, og grensen selv kan beskrive et ideal snarere enn en grense Israel noen gang holdt."
  tl:
    - "Ang Bundok Hor na ito ay hindi ang bundok kung saan namatay si Aaron kundi isang tuktok sa hilagang hangganan ng ipinangakong lupain, gaya ng iniutos kay Moises na iguhit ito: “At ito ang magiging inyong hangganang hilagaan mula sa malaking dagat ay inyong gagawing palatandaan ang bundok ng Hor: Mula sa bundok ng Hor ay inyong gagawing palatandaan ang pasukan ng Hamath; at ang magiging mga labasan ng hangganan ay sa Sedad”. Kaya't ang guhit ay tumakbo mula sa Dagat Mediteraneo papaloob sa pamamagitan ng bundok hanggang sa Lebo-hamath, karaniwang inilalagay sa Lebweh sa hilagang Beqaa, at sa Sedad, marahil ang bayan ng Sadad sa Siria. Ang Hebreo, hor ha-har, ay mababasa bilang “bundok ng bundok”, at ito lamang ang dalawang talatang nagpapangalan dito. Hindi ito binabanggit ng kahawig na paglalarawan ni Ezekiel sa hilagang hangganan."
    - "Pinagtatalunan kung aling bundok ang tinutukoy. Unang minamarkahan ng mapa ang Bundok Hermon, ang pinakamataas na tuktok ng rehiyon; isinasalin ito ng Targum Pseudo-Jonathan na Aramaiko na Taurus Amanus, isang hanay na mas malayo sa hilaga, at iginuguhit din ng Talmud ang hilagang hangganan sa hanay na iyon; ang Jebel Akkar, ang hilagang dulo ng hanay ng Libano sa itaas ng libis ng Eleutherus, ay akma sa hangganang tumatakbo papaloob patungong Hamath; at ang Ras Shaqqa, ang tangos sa baybayin sa timog ng Tripoli na tinawag ng mga Griyego na Theouprosopon, ay magmamarka sa pasimula sa dagat. Walang mapatutunayan sa mga ito, at ang hangganan mismo ay maaaring naglalarawan ng huwaran kaysa hangganang hinawakan ng Israel kailanman."
  da:
    - "Dette Hor er ikke det bjerg, hvor Aron døde, men en top på det forjættede lands nordgrænse, sådan som Moses fik besked om at trække den: »Og dette skal være eder Landemærket mod Norden: I skulle sætte Grænsen for eder fra det store Hav til Bjerget Hor. Fra Bjerget Hor skulle I sætte Grænsen hen imod Hamath, og Landemærkets Udgang skal være til Zedad.« Linjen løb altså fra Middelhavet ind i landet over bjerget til Lebo-Hamat, sædvanligvis placeret ved Lebweh i det nordlige Beqaa, og Sedad, sandsynligvis byen Sadad i Syrien. Det hebraiske, hor ha-har, kan læses som »bjergets bjerg«, og disse er de eneste to vers, der nævner det. Ezekiels parallelle beskrivelse af nordgrænsen nævner det ikke."
    - "Hvilket bjerg der menes, er omstridt. Kortet markerer først Hermon, regionens højeste top; det aramæiske Targum Pseudo-Jonatan gengiver det Taurus Amanus, en kæde langt længere mod nord, og Talmud trækker også nordgrænsen ved den kæde; Jebel Akkar, den nordlige ende af Libanon-kæden over Eleutherus-dalen, passer til en grænse, der løber ind i landet mod Hamat; og Ras Shaqqa, det kystnære forbjerg syd for Tripoli, som grækerne kaldte Theouprosopon, ville markere udgangspunktet ved havet. Intet af dette kan bevises, og selve grænsen kan beskrive et ideal snarere end en grænse, Israel nogensinde holdt."
  sr:
    - "Ова гора Ор није планина на којој је умро Арон него врх на северној граници обећане земље, како је Мојсије био упућен да је повуче: „А северна међа ово да вам буде: од великог мора повуците себи међу до горе Ора; а од горе Ора повуците себи међу како се иде у Емат, и та међа нека иде на Седад“. Линија је дакле ишла од Средоземног мора у унутрашњост преко горе до Улаза у Емат, обично смештеног у Лабви у северној Бекаи, и Седада, вероватно града Садада у Сирији. Хебрејско хор ха-хар може се читати као „планина планине“, а то су једина два стиха која је именују. Језекиљев паралелни опис северне границе је не помиње."
    - "Која је гора у питању, спорно је. Мапа прво означава Хермон, највиши врх области; арамејски Таргум Псеудо-Јонатан преводи је као Аманус, ланац знатно северније, и Талмуд такође повлачи северну границу на том ланцу; Џебел Акар, северни крај ливанског ланца изнад долине Елевтера, одговара граници која иде у унутрашњост према Емату; а Рас Шака, приобални рт јужно од Триполија који су Грци звали Теупросопон, означавао би полазну тачку на мору. Ништа од тога се не може доказати, а граница сама можда описује идеал, а не границу коју је Израиљ икада држао."
