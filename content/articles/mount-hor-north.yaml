# Overview article (ADR 0007). Mainstream facts only; the site is disputed and the app's candidates are given without choosing one.
id: mount-hor-north
place: a62fa2d
title:
  en: "Mount Hor (northern border)"
  ru: "Гора Ор (северная граница)"
  uk: "Гора Гор (північний кордон)"
  es: "Monte Hor (frontera norte)"
  pt: "Monte Hor (fronteira norte)"
  de: "Berg Hor (Nordgrenze)"
  fr: "Mont Hor (frontière nord)"
body:
  en:
    - "This Mount Hor is not the mountain where Aaron died but a peak on the northern border of the promised land, as Moses was told to draw it: “And this shall be your north border: from the great sea ye shall point out for you mount Hor: From mount Hor ye shall point out your border unto the entrance of Hamath; and the goings forth of the border shall be to Zedad.” So the line ran from the Mediterranean inland by way of the mountain to Lebo-hamath, usually placed at Lebweh in the northern Beqaa, and Zedad, the town of Sadad in Syria. The Hebrew, hor ha-har, can be read as “the mountain of the mountain”, and these are the only two verses that name it. Ezekiel’s parallel description of the northern border does not mention it."
    - "Which mountain is meant is disputed. The map marks first Mount Hermon, the highest peak of the region; the Aramaic Targum Pseudo-Jonathan renders it Taurus Amanus, a range much further north, and the Talmud also draws the northern limit at that range; Jebel Akkar, the northern end of the Lebanon range above the Eleutherus valley, fits a border running inland towards Hamath; and Ras Shaqqa, the coastal headland south of Tripoli that the Greeks called Theouprosopon, would mark the starting point on the sea. None of these can be proved, and the border itself may describe an ideal rather than a frontier Israel ever held."
  ru:
    - "Эта гора Ор — не та, где умер Аарон, а вершина на северной границе обетованной земли, как велено было провести её Моисею: «к северу же будет у вас граница: от великого моря проведите ее к горе Ор, от горы Ор проведите к Емафу, и будут выступы границы к Цедаду». Значит, линия шла от Средиземного моря вглубь суши через эту гору к входу в Емаф, который обычно помещают в Лебве на севере долины Бекаа, и к Цедаду — селению Садад в Сирии. Еврейское «ор ха-ар» можно понять как «гора горы», и называют её только эти два стиха. Иезекииль, описывая ту же северную границу, её не упоминает."
    - "Какая гора имеется в виду — спорно. На карте первой отмечена гора Ермон, высочайшая вершина края; арамейский Таргум Псевдо-Ионафана передаёт имя как Тавр Аманский — хребет гораздо севернее, и Талмуд тоже проводит северный предел по этому хребту; Джебель-Аккар, северный конец Ливанского хребта над долиной Элевфера, подходит к границе, идущей вглубь к Емафу; а Рас-Шакка, прибрежный мыс к югу от Триполи, который греки называли Феупросопон, отмечал бы начало линии на море. Ни одно из мест не доказано, и сама граница, возможно, описывает идеал, а не рубеж, которым Израиль когда-либо владел."
  uk:
    - "Ця Гора Гор — не гора, на якій помер Аарон, а вершина на північному кордоні обітованої землі, як Мойсею було сказано накреслити його: «А се буде вам гряницею на північ: Від Великого моря проведете її до Гор гори; від Гор гори проведете її як раз до Гамата, і буде гряничнїй виступ до Зедаду». Отже, лінія йшла від Середземного моря вглиб країни через гору до Входу в Хамат, зазвичай розміщеного в Лабве на півночі Бекаа, і Зедаду, міста Садад у Сирії. Староєврейське хор га-хар можна прочитати як «гора гори», і ці два вірші — єдині, що її називають. Паралельний опис північного кордону в Єзекіїля її не згадує."
    - "Яку гору мають на увазі, спірно. Мапа першою позначає гору Гермон, найвищу вершину краю; арамейський Таргум Псевдо-Йонатана передає її як Тавр Аманський (Taurus Amanus), хребет значно північніше, і Талмуд також проводить північну межу по тому хребту; Джебель-Аккар, північний кінець хребта Ліван над долиною Елевтера, пасує кордону, що йде вглиб країни до Хамату; а Рас-Шакка, прибережний мис на південь від Тріполі, який греки називали Теу-просопон, позначав би початок на морі. Нічого з цього не можна довести, і сам кордон може описувати ідеал, а не межу, яку Ізраїль коли-небудь тримав."
  es:
    - "Este monte Hor no es la montaña donde murió Aarón sino una cima de la frontera norte de la tierra prometida, tal como se mandó a Moisés trazarla: «Y el término del norte será este: desde la gran mar os señalaréis el monte de Hor; Del monte de Hor señalaréis á la entrada de Hamath, y serán las salidas de aquel término á Sedad». Así la línea iba desde el Mediterráneo tierra adentro por la montaña hasta la Entrada de Hamat (Lebo-hamat), que suele situarse en Lebweh, en el norte de la Bekaa, y Sedad, la ciudad de Sadad, en Siria. El hebreo, hor ha-har, puede leerse como «la montaña de la montaña», y estos son los únicos dos versículos que la nombran. La descripción paralela de la frontera norte en Ezequiel no la menciona."
    - "Se discute qué montaña es. El mapa marca en primer lugar el monte Hermón, el pico más alto de la región; el Targum arameo Pseudo-Jonatán la traduce Tauro Amano, una cordillera mucho más al norte, y el Talmud traza también el límite septentrional en esa cordillera; el Yebel Akkar, el extremo norte de la cordillera del Líbano sobre el valle del Eleutero, concuerda con una frontera que va tierra adentro hacia Hamat; y Ras Shaqqa, el cabo costero al sur de Trípoli que los griegos llamaban Theouprosopon, marcaría el punto de partida en el mar. Ninguna de estas opciones puede probarse, y la frontera misma puede describir un ideal más que una frontera que Israel haya poseído alguna vez."
  pt:
    - "Este monte Hor não é a montanha onde Arão morreu, mas um pico na fronteira norte da terra prometida, como Moisés recebeu ordem de traçá-la: “Esta será a sua fronteira norte: desde o mar Grande vocês marcarão para si o monte Hor. Do monte Hor vocês marcarão até a entrada de Hamate; e a fronteira passará por Zedade.” Assim a linha corria do Mediterrâneo para o interior, pela montanha, até Lebo-Hamate, geralmente situada em Lebweh, no norte da Beqaa, e Zedade, a cidade de Sadad, na Síria. O hebraico, hor ha-har, pode ser lido como “a montanha da montanha”, e esses são os únicos dois versículos que a nomeiam. A descrição paralela de Ezequiel da fronteira norte não a menciona."
    - "Qual montanha se quer dizer é disputado. O mapa marca em primeiro lugar o monte Hermom, o pico mais alto da região; o Targum aramaico Pseudo-Jônatas a traduz por Tauro Amano, uma cordilheira muito mais ao norte, e o Talmude também traça o limite norte nessa cordilheira; o Jebel Akkar, a extremidade norte da cordilheira do Líbano acima do vale do Eleutero, combina com uma fronteira que corre para o interior rumo a Hamate; e Ras Shaqqa, o promontório costeiro ao sul de Trípoli que os gregos chamavam Theouprosopon, marcaria o ponto de partida no mar. Nada disso pode ser provado, e a própria fronteira pode descrever um ideal e não uma fronteira que Israel jamais tenha mantido."
  de:
    - "Dieser Berg Hor ist nicht der Berg, auf dem Aaron starb, sondern ein Gipfel an der Nordgrenze des verheißenen Landes, wie Mose sie ziehen sollte: „Die Grenze gegen Mitternacht soll diese sein: ihr sollt messen von dem großen Meer bis an den Berg Hor, und von dem Berg Hor messen, bis man kommt gen Hamath, das der Ausgang der Grenze sei gen Zedad“. Die Linie lief also vom Mittelmeer landeinwärts über den Berg nach Lebo-Hamat, meist bei Lebweh im nördlichen Bekaa angesetzt, und Zedad, der Stadt Sadad in Syrien. Das Hebräische, hor ha-har, lässt sich als „der Berg des Berges“ lesen, und dies sind die einzigen beiden Verse, die ihn nennen. Hesekiels Parallelbeschreibung der Nordgrenze erwähnt ihn nicht."
    - "Welcher Berg gemeint ist, ist umstritten. Die Karte zeigt zuerst den Hermon, den höchsten Gipfel der Region; der aramäische Targum Pseudo-Jonathan gibt ihn als Taurus Amanus wieder, ein weit nördlicheres Gebirge, und auch der Talmud zieht die Nordgrenze an diesem Gebirge; der Dschebel Akkar, das Nordende des Libanongebirges über dem Tal des Eleutheros, passt zu einer Grenze, die landeinwärts auf Hamat zuläuft; und Ras Shaqqa, die Küstenlandspitze südlich von Tripolis, die die Griechen Theouprosopon nannten, würde den Ausgangspunkt am Meer markieren. Nichts davon lässt sich beweisen, und die Grenze selbst mag ein Ideal beschreiben und keine Grenze, die Israel je hielt."
  fr:
    - "Ce mont Hor n’est pas la montagne où mourut Aaron mais un sommet de la frontière nord de la terre promise, telle que Moïse reçut l’ordre de la tracer : « Voici quelle sera votre limite septentrionale : à partir de la grande mer, vous la tracerez jusqu’à la montagne de Hor ; depuis la montagne de Hor, vous la ferez passer par Hamath, et arriver à Tsedad ». La ligne allait donc de la Méditerranée vers l’intérieur par la montagne jusqu’à Lebo-Hamath, d’ordinaire placée à Labweh dans le nord de la Bekaa, et à Tsedad, la ville de Sadad en Syrie. L’hébreu, hor ha-har, peut se lire « la montagne de la montagne », et ce sont les deux seuls versets qui la nomment. La description parallèle de la frontière nord chez Ézéchiel ne la mentionne pas."
    - "On discute de la montagne visée. La carte marque d’abord le mont Hermon, plus haut sommet de la région ; le Targoum araméen du Pseudo-Jonathan la rend par Taurus Amanus, chaîne beaucoup plus au nord, et le Talmud trace aussi la limite nord à cette chaîne ; le djebel Akkar, extrémité nord de la chaîne du Liban au-dessus de la vallée de l’Éleuthère, convient à une frontière courant vers l’intérieur vers Hamath ; et Ras Shaqqa, le promontoire côtier au sud de Tripoli que les Grecs appelaient Théouprosopon, marquerait le point de départ sur la mer. Rien de cela ne peut être prouvé, et la frontière elle-même peut décrire un idéal plutôt qu’une limite qu’Israël ait jamais tenue."
scripture:
  - Num.34.7-Num.34.9
  - Ezek.47.15-Ezek.47.17
sources:
  - "Targum Pseudo-Jonathan to Numbers 34.7-8"
  - "Babylonian Talmud, Gittin 8a"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
  - "B. A. Levine, Numbers 21-36 (Anchor Bible 4A, 2000)"
