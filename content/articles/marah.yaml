# Overview article (ADR 0007). Mainstream facts only; the site depends on the route of the exodus and is left open.
id: marah
place: ad3970d
title:
  en: "Marah"
  ru: "Мерра"
body:
  en:
    - "Marah, “bitterness”, was the first camp of Israel after the crossing of the sea, three days into the wilderness of Shur, a spring whose water could not be drunk. Where it was depends on where one puts the crossing, and no one knows that. Travellers who took the Israelites down the east shore of the Gulf of Suez fixed on Ain Hawarah, a brackish spring about 80 km south-east of Suez, which Burckhardt and Robinson described; others preferred the springs of Moses, Uyun Musa, a palm oasis 15 km south-east of Suez, or the well called Bir Mara near them; and those who lead the people past the Bitter Lakes have found Marah in that salt water. The app shows these four. Beyond the name, nothing on the ground marks the place."
    - "Exodus tells it briefly: “when they came to Marah, they could not drink of the waters of Marah, for they were bitter”. The people murmured, Moses cried to the Lord, “and the LORD shewed him a tree, which when he had cast into the waters, the waters were made sweet”. There God gave them “a statute and an ordinance” and the promise, “I am the LORD that healeth thee”. From Marah they went on to Elim, “where were twelve wells of water, and threescore and ten palm trees”, often placed at the Wadi Gharandel. The list of camps in Numbers repeats the stages: three days through the wilderness of Etham, Marah, Elim."
    - "Today the candidate springs lie on the Egyptian shore of the Gulf of Suez, along the road from the Suez tunnel south toward Abu Zenima; Uyun Musa is still an oasis of palms, and Ain Hawarah a small bitter pool in the desert."
  ru:
    - "Мерра, «горечь», — первый стан Израиля после перехода через море, в трёх днях пути по пустыне Сур, источник, воду которого нельзя было пить. Где он был, зависит от того, куда поместить переход, а этого никто не знает. Путешественники, ведшие Израильтян вдоль восточного берега Суэцкого залива, остановились на Айн-Хаваре, солоноватом источнике примерно в 80 км к юго-востоку от Суэца, который описали Буркхардт и Робинсон; другие предпочитали источники Моисея, Уюн-Муса, пальмовый оазис в 15 км к юго-востоку от Суэца, или колодец Бир-Мара рядом с ними; а те, кто ведёт народ мимо Горьких озёр, находили Мерру в их солёной воде. Приложение показывает эти четыре места. Кроме имени, ничто на земле места не отмечает."
    - "Книга Исход рассказывает коротко: «Пришли в Мерру — и не могли пить воды в Мерре, ибо она была горька». Народ возроптал, Моисей возопил к Господу, «и Господь показал ему дерево, и он бросил его в воду, и вода сделалась сладкою». Там Бог дал народу «устав и закон» и обещание: «Я Господь Бог твой, целитель твой». Из Мерры они пошли в Елим, где «было двенадцать источников воды и семьдесят финиковых дерев», — его часто помещают в Вади-Гарандель. Перечень станов в книге Чисел повторяет переходы: три дня пустынею Ефам, Мерра, Елим."
    - "Сегодня источники-кандидаты лежат на египетском берегу Суэцкого залива, вдоль дороги от Суэцкого тоннеля на юг к Абу-Зениме; Уюн-Муса и теперь оазис пальм, а Айн-Хавара — маленькая горькая лужа в пустыне."
scripture:
  - Exod.15.22-Exod.15.27
  - Num.33.8-Num.33.9
sources:
  - "J. L. Burckhardt, Travels in Syria and the Holy Land (1822)"
  - "E. Robinson, Biblical Researches in Palestine, Mount Sinai and Arabia Petraea (1841)"
  - "G. I. Davies, The Way of the Wilderness: A Geographical Study of the Wilderness Itineraries in the Old Testament (1979)"
  - "J. K. Hoffmeier, Ancient Israel in Sinai: The Evidence for the Authenticity of the Wilderness Tradition (2005)"
