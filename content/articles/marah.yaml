body:
  en:
    - "Marah, “bitterness”, was the first camp of Israel after the crossing of the sea, three days into the wilderness of Shur, a spring whose water could not be drunk. Where it was depends on where one puts the crossing, and no one knows that. Travellers who took the Israelites down the east shore of the Gulf of Suez fixed on Ain Hawarah, a brackish spring about 80 km south-east of Suez, which Burckhardt and Robinson described; others preferred the springs of Moses, Uyun Musa, a palm oasis 15 km south-east of Suez, or the well called Bir Mara near them; and those who lead the people past the Bitter Lakes have found Marah in that salt water. The map shows these four. Beyond the name, nothing on the ground marks the place."
    - "Exodus tells it briefly: “when they came to Marah, they could not drink of the waters of Marah, for they were bitter”. The people murmured, Moses cried to the Lord, “and the LORD shewed him a tree, which when he had cast into the waters, the waters were made sweet”. There God gave them “a statute and an ordinance” and the promise, “I am the LORD that healeth thee”. From Marah they went on to Elim, “where were twelve wells of water, and threescore and ten palm trees”, often placed at the Wadi Gharandel. The list of camps in Numbers repeats the stages: three days through the wilderness of Etham, Marah, Elim."
    - "Today the candidate springs lie on the Egyptian shore of the Gulf of Suez, along the road from the Suez tunnel south toward Abu Zenima; Uyun Musa is still an oasis of palms, and Ain Hawarah a small bitter pool in the desert."
  ru:
    - "Мерра, «горечь», — первый стан Израиля после перехода через море, в трёх днях пути по пустыне Сур, источник, воду которого нельзя было пить. Где он был, зависит от того, куда поместить переход, а этого никто не знает. Путешественники, ведшие Израильтян вдоль восточного берега Суэцкого залива, остановились на Айн-Хаваре, солоноватом источнике примерно в 80 км к юго-востоку от Суэца, который описали Буркхардт и Робинсон; другие предпочитали источники Моисея, Уюн-Муса, пальмовый оазис в 15 км к юго-востоку от Суэца, или колодец Бир-Мара рядом с ними; а те, кто ведёт народ мимо Горьких озёр, находили Мерру в их солёной воде. На карте показаны эти четыре места. Кроме имени, ничто на земле места не отмечает."
    - "Книга Исход рассказывает коротко: «Пришли в Мерру — и не могли пить воды в Мерре, ибо она была горька». Народ возроптал, Моисей возопил к Господу, «и Господь показал ему дерево, и он бросил его в воду, и вода сделалась сладкою». Там Бог дал народу «устав и закон» и обещание: «Я Господь Бог твой, целитель твой». Из Мерры они пошли в Елим, где «было двенадцать источников воды и семьдесят финиковых дерев», — его часто помещают в Вади-Гарандель. Перечень станов в книге Чисел повторяет переходы: три дня пустынею Ефам, Мерра, Елим."
    - "Сегодня источники-кандидаты лежат на египетском берегу Суэцкого залива, вдоль дороги от Суэцкого тоннеля на юг к Абу-Зениме; Уюн-Муса и теперь оазис пальм, а Айн-Хавара — маленькая горькая лужа в пустыне."
  uk:
    - "Мерра, «гіркота», була першим табором Ізраїлю після переходу моря, за три дні шляху в пустелі Сур, джерелом, води якого не можна було пити. Де вона була, залежить від того, де розміщують перехід, а цього ніхто не знає. Мандрівники, які вели ізраїльтян уздовж східного берега Суецької затоки, зупинилися на Айн-Хаварі, солонуватому джерелі приблизно за 80 км на південний схід від Суеца, яке описали Буркгардт і Робінсон; інші віддавали перевагу джерелам Мойсея, Уюн-Мусі, пальмовому оазису за 15 км на південний схід від Суеца, або криниці Бір-Мара поблизу них; а ті, хто веде народ повз Гіркі озера, знаходили Мерру в тій солоній воді. Мапа показує ці чотири. Крім назви, ніщо на місці не позначає цього місця."
    - "Книга Виходу розповідає про це стисло: «І прийшли в Меру, та не змогли пити води Мерської, бо гірка вона». Народ нарікав, Мойсей волав до Господа, «і вказав йому дерево Господь, і вкинув його він у воду, і прісною стала вода». Там Бог дав їм «установу й суд» і обітницю: «я бо Господь, Бог твій, що виздоровлює тебе». З Мерри вони пішли до Еліма, де було «дванайцять криниць і сїмдесять пальмових дерев», яке часто розміщують у ваді Гарандель. Перелік таборів у Книзі Чисел повторює ці етапи: три дні пустелею Етам, Мерра, Елім."
    - "Сьогодні джерела-кандидати лежать на єгипетському березі Суецької затоки, вздовж дороги від Суецького тунелю на південь до Абу-Зеніми; Уюн-Муса і досі пальмовий оазис, а Айн-Хавара — невеликий гіркий ставок у пустелі."
  es:
    - "Mara, «amargura», fue el primer campamento de Israel tras el cruce del mar, a tres días de camino en el desierto de Shur, un manantial cuya agua no se podía beber. Dónde estaba depende de dónde se sitúe el cruce, y nadie lo sabe. Los viajeros que llevaron a los israelitas por la orilla oriental del golfo de Suez se fijaron en Ain Hawarah, un manantial salobre a unos 80 km al sudeste de Suez, que describieron Burckhardt y Robinson; otros prefirieron los manantiales de Moisés, Uyun Musa, un oasis de palmeras a 15 km al sudeste de Suez, o el pozo llamado Bir Mara, cercano a ellos; y quienes llevan al pueblo por los Lagos Amargos han hallado Mara en esa agua salada. El mapa muestra estas cuatro. Más allá del nombre, nada sobre el terreno señala el lugar."
    - "Éxodo lo cuenta brevemente: «Y llegaron á Mara, y no pudieron beber las aguas de Mara, porque eran amargas». El pueblo murmuró, Moisés clamó a Jehová, «y Jehová le mostró un árbol, el cual metídolo que hubo dentro de las aguas, las aguas se endulzaron». Allí Dios les dio «estatutos y ordenanzas» y la promesa: «yo soy Jehová tu Sanador». De Mara siguieron a Elim, «donde había doce fuentes de aguas, y setenta palmas», a menudo situado en el Wadi Gharandel. La lista de campamentos de Números repite las etapas: tres días por el desierto de Etam, Mara, Elim."
    - "Hoy los manantiales candidatos se hallan en la orilla egipcia del golfo de Suez, a lo largo de la carretera que desde el túnel de Suez va hacia el sur en dirección a Abu Zenima; Uyun Musa sigue siendo un oasis de palmeras, y Ain Hawarah una pequeña charca amarga en el desierto."
  pt:
    - "Mara, “amargura”, foi o primeiro acampamento de Israel depois da travessia do mar, a três dias no deserto de Sur, uma fonte cuja água não se podia beber. Onde ficava depende de onde se situa a travessia, e ninguém sabe isso. Viajantes que levaram os israelitas pela margem leste do golfo de Suez fixaram-se em Ain Hawarah, uma fonte salobra a cerca de 80 km a sudeste de Suez, que Burckhardt e Robinson descreveram; outros preferiram as fontes de Moisés, Uyun Musa, um oásis de palmeiras a 15 km a sudeste de Suez, ou o poço chamado Bir Mara perto delas; e os que conduzem o povo ao largo dos Lagos Amargos encontraram Mara naquela água salgada. O mapa mostra esses quatro. Além do nome, nada no terreno assinala o lugar."
    - "Êxodo o conta brevemente: “Quando chegaram a Mara, não puderam beber das águas de Mara, porque eram amargas”. O povo murmurou, Moisés clamou ao Senhor, “O SENHOR lhe mostrou uma árvore, e ele a lançou nas águas, e as águas se tornaram doces”. Ali Deus lhes deu “um estatuto e uma ordenança” e a promessa: “eu sou o SENHOR que os cura”. De Mara foram para Elim, “onde havia doze fontes de água e setenta palmeiras”, muitas vezes situada no Wadi Gharandel. A lista de acampamentos em Números repete as etapas: três dias pelo deserto de Etã, Mara, Elim."
    - "Hoje as fontes candidatas ficam na margem egípcia do golfo de Suez, ao longo da estrada que vai do túnel de Suez para o sul, rumo a Abu Zenima; Uyun Musa ainda é um oásis de palmeiras, e Ain Hawarah, um pequeno poço amargo no deserto."
  de:
    - "Mara, „Bitterkeit“, war das erste Lager Israels nach der Überquerung des Meeres, drei Tage in der Wüste Schur, eine Quelle, deren Wasser man nicht trinken konnte. Wo es lag, hängt davon ab, wo man die Überquerung ansetzt, und das weiß niemand. Reisende, die die Israeliten die Ostküste des Golfs von Suez hinabführten, bestimmten Ain Hawarah, eine brackige Quelle etwa 80 km südöstlich von Suez, die Burckhardt und Robinson beschrieben; andere zogen die Mosesquellen vor, Uyun Musa, eine Palmenoase 15 km südöstlich von Suez, oder den nahen Brunnen Bir Mara; und wer das Volk an den Bitterseen vorbeiführt, fand Mara in diesem Salzwasser. Die Karte zeigt diese vier. Außer dem Namen kennzeichnet nichts am Boden den Ort."
    - "Das 2. Buch Mose erzählt es kurz: „Da kamen sie gen Mara; aber sie konnten das Wasser nicht trinken, denn es war sehr bitter.“ Das Volk murrte, Mose schrie zum HERRN, und „der HERR wies ihm einen Baum; den tat er ins Wasser, da ward es süß“. Dort stellte Gott ihnen „ein Gesetz und ein Recht“ und gab die Verheißung: „denn ich bin der HERR, dein Arzt“. Von Mara zogen sie nach Elim, „da waren zwölf Wasserbrunnen und siebzig Palmbäume“, oft am Wadi Gharandel angesetzt. Die Lagerliste in 4. Mose wiederholt die Stationen: drei Tagereisen durch die Wüste Etam, Mara, Elim."
    - "Heute liegen die Kandidatenquellen am ägyptischen Ufer des Golfs von Suez, an der Straße vom Suez-Tunnel nach Süden Richtung Abu Zenima; Uyun Musa ist noch immer eine Palmenoase, und Ain Hawarah ein kleiner bitterer Teich in der Wüste."
  fr:
    - "Mara, « amertume », fut le premier campement d’Israël après la traversée de la mer, à trois jours dans le désert de Schur, une source dont l’eau ne pouvait se boire. Où elle se trouvait dépend de l’endroit où l’on place la traversée, et nul ne le sait. Les voyageurs qui menèrent les Israélites le long de la rive orientale du golfe de Suez s’arrêtèrent à Aïn Hawarah, source saumâtre à environ 80 km au sud-est de Suez, que décrivirent Burckhardt et Robinson ; d’autres préférèrent les sources de Moïse, Uyun Musa, oasis de palmiers à 15 km au sud-est de Suez, ou le puits appelé Bir Mara près d’elles ; et ceux qui font passer le peuple par les lacs Amers ont trouvé Mara dans cette eau salée. La carte montre ces quatre. Hors le nom, rien sur le terrain ne marque le lieu."
    - "L’Exode le raconte brièvement : « Ils arrivèrent à Mara ; mais ils ne purent pas boire l’eau de Mara parce qu’elle était amère. » Le peuple murmura, Moïse cria à l’Éternel, et « l’Éternel lui indiqua un bois, qu’il jeta dans l’eau. Et l’eau devint douce ». Là Dieu leur donna « des lois et des ordonnances » et la promesse : « je suis l’Éternel, qui te guérit ». De Mara ils allèrent à Élim, « où il y avait douze sources d’eau et soixante-dix palmiers », souvent placée à l’ouadi Gharandel. La liste des campements des Nombres répète les étapes : trois jours dans le désert d’Étham, Mara, Élim."
    - "Aujourd’hui, les sources candidates se trouvent sur la rive égyptienne du golfe de Suez, le long de la route qui va du tunnel de Suez vers le sud en direction d’Abu Zenima ; Uyun Musa est encore une oasis de palmiers, et Aïn Hawarah un petit bassin amer dans le désert."
  it:
    - "Mara, «amarezza», fu il primo accampamento d’Israele dopo la traversata del mare, a tre giorni nel deserto di Sur, una sorgente la cui acqua non si poteva bere. Dove fosse dipende da dove si pone la traversata, e nessuno lo sa. I viaggiatori che condussero gli Israeliti lungo la riva orientale del Golfo di Suez si fissarono su Ain Hawarah, una sorgente salmastra a circa 80 km a sud-est di Suez, descritta da Burckhardt e Robinson; altri preferirono le sorgenti di Mosè, Uyun Musa, un’oasi di palme a 15 km a sud-est di Suez, o il pozzo detto Bir Mara vicino ad esse; e chi fa passare il popolo oltre i Laghi Amari ha trovato Mara in quell’acqua salata. La mappa mostra questi quattro. Oltre al nome, nulla sul terreno segna il luogo."
    - "L’Esodo lo racconta brevemente: «E quando giunsero a Mara, non poteron bevere le acque di Mara, perché erano amare». Il popolo mormorò, Mosè gridò all’Eterno, «e l’Eterno gli mostrò un legno ch’egli gettò nelle acque, e le acque divennero dolci». Là Dio diede loro «una legge e una prescrizione» e la promessa: «io sono l’Eterno che ti guarisco». Da Mara proseguirono verso Elim, «dov’erano dodici sorgenti d’acqua e settanta palme», spesso collocata nel Wadi Gharandel. L’elenco degli accampamenti in Numeri ripete le tappe: tre giorni nel deserto di Etam, Mara, Elim."
    - "Oggi le sorgenti candidate si trovano sulla riva egiziana del Golfo di Suez, lungo la strada che dal tunnel di Suez scende verso Abu Zenima; Uyun Musa è ancora un’oasi di palme, e Ain Hawarah una piccola pozza amara nel deserto."
  pl:
    - "Mara, „gorycz”, było pierwszym obozem Izraela po przejściu morza, trzy dni drogi w głąb pustyni Szur, źródłem, którego wody nie można było pić. Gdzie było, zależy od tego, gdzie się umieszcza przejście, a tego nikt nie wie. Podróżnicy, którzy prowadzili Izraelitów wzdłuż wschodniego brzegu Zatoki Sueskiej, wskazywali Ain Hawarah, słonawe źródło około 80 km na południowy wschód od Suezu, które opisali Burckhardt i Robinson; inni woleli Źródła Mojżesza, Uyun Musa, oazę palmową 15 km na południowy wschód od Suezu, albo studnię zwaną Bir Mara w ich pobliżu; a ci, którzy prowadzą lud obok Jezior Gorzkich, znaleźli Marę w tamtej słonej wodzie. Mapa pokazuje te cztery. Poza nazwą nic w terenie nie znaczy tego miejsca."
    - "Księga Wyjścia opowiada krótko: „A gdy przyszli do Mara, nie mogli pić wód z Mara, bo gorzkie były”. Lud szemrał, Mojżesz zawołał do Pana, i „ukazał mu Pan drzewo, które gdy wrzucił do wód, stały się słodkie wody”. Tam Bóg dał im „prawa i sądy” oraz obietnicę: „bom Ja Pan, który cię leczę”. Z Mary poszli do Elim, „gdzie było dwanaście źródeł wód, i siedmdziesiąt palm”, które często umieszcza się w Wadi Gharandel. Lista obozów w Księdze Liczb powtarza etapy: trzy dni przez pustynię Etam, Mara, Elim."
    - "Dziś kandydujące źródła leżą na egipskim brzegu Zatoki Sueskiej, wzdłuż drogi od tunelu sueskiego na południe w stronę Abu Zenimy; Uyun Musa wciąż jest oazą palm, a Ain Hawarah małym gorzkim stawem na pustyni."
  nl:
    - "Mara, “bitterheid”, was het eerste kamp van Israël na de oversteek van de zee, drie dagen ver in de woestijn van Sur, een bron waarvan het water niet te drinken was. Waar het lag, hangt af van waar men de oversteek plaatst, en dat weet niemand. Reizigers die de Israëlieten langs de oostoever van de Golf van Suez lieten trekken, kozen Ain Hawarah, een brakke bron zo'n 80 km ten zuidoosten van Suez, die Burckhardt en Robinson beschreven; anderen gaven de voorkeur aan de bronnen van Mozes, Uyun Musa, een palmoase 15 km ten zuidoosten van Suez, of de put die Bir Mara heet in hun buurt; en wie het volk langs de Bittermeren leidt, heeft Mara in dat zoute water gevonden. De kaart toont deze vier. Behalve de naam wijst niets ter plaatse de plek aan."
    - "Exodus vertelt het kort: “Toen kwamen zij te Mara; doch zij konden het water van Mara niet drinken, want het was bitter”. Het volk morde, Mozes riep tot de HEER, “en de HEERE wees hem een hout, dat wierp hij in dat water; toen werd het water zoet”. Daar gaf God hun “een inzetting en recht” en de belofte: “Ik ben de HEERE, uw Heelmeester!” Van Mara gingen zij verder naar Elim, “daar waren twaalf waterfonteinen, en zeventig palmbomen”, vaak geplaatst bij de Wadi Gharandel. De lijst van legerplaatsen in Numeri herhaalt de etappes: drie dagen door de woestijn van Etam, Mara, Elim."
    - "Tegenwoordig liggen de kandidaat-bronnen aan de Egyptische kust van de Golf van Suez, langs de weg van de Suez-tunnel zuidwaarts richting Abu Zenima; Uyun Musa is nog steeds een oase van palmen, en Ain Hawarah een kleine bittere poel in de woestijn."
  cs:
    - "Mára, „hořkost“, byla první tábor Izraele po přechodu moře, tři dny cesty na poušti Šur, pramen, jehož vodu nešlo pít. Kde stála, závisí na tom, kam se klade přechod, a to nikdo neví. Cestovatelé, kteří vedli Izraelity po východním břehu Suezského zálivu, určili Ain Hawarah, brakický pramen asi 80 km jihovýchodně od Suezu, který popsali Burckhardt a Robinson; jiní dávali přednost Mojžíšovým pramenům, Uyun Musa, palmové oáze 15 km jihovýchodně od Suezu, nebo studni zvané Bir Mara blízko nich; a ti, kdo vedou lid kolem Hořkých jezer, našli Máru v oné slané vodě. Mapa ukazuje tyto čtyři. Kromě jména nic na místě tuto polohu neoznačuje."
    - "Exodus to vypráví stručně: „A přišedše do Marah, nemohli píti vod z Marah, nebo byly hořké“. Lid reptal, Mojžíš volal k Hospodinu a „ukázal mu Hospodin dřevo, kteréž jakž uvrhl do vod, učiněny jsou sladké vody“. Tam jim Bůh vydal „práva a soudy“ a zaslíbení: „já jsem Hospodin, kterýž tě uzdravuji“. Z Máry šli do Élimu, „kdež bylo dvanácte studnic vod a sedmdesáte palm“, který se často klade k Wádí Gharandel. Seznam táborů v Numeri opakuje stanice: tři dny pouští Etam, Mára, Élim."
    - "Dnes kandidátské prameny leží na egyptském břehu Suezského zálivu, podél silnice od suezského tunelu na jih k Abu Zenimě; Uyun Musa je dosud palmová oáza a Ain Hawarah malé hořké jezírko v poušti."
  sv:
    - "Mara, ”bitterhet”, var Israels första läger efter genomgången av havet, tre dagar in i Shurs öken, en källa vars vatten inte gick att dricka. Var det låg beror på var man förlägger genomgången, och det vet ingen. Resenärer som förde israeliterna längs Suezvikens östra strand stannade vid Ain Hawarah, en bräckt källa omkring 80 km sydost om Suez, som Burckhardt och Robinson beskrev; andra föredrog Moses källor, Uyun Musa, en palmoas 15 km sydost om Suez, eller brunnen Bir Mara nära dem; och de som låter folket passera Bittersjöarna har funnit Mara i det salta vattnet. Kartan visar dessa fyra. Utöver namnet markerar ingenting på marken platsen."
    - "Andra Moseboken berättar det kort: ”Så kommo de till Mara; men de kunde icke dricka vattnet i Mara, ty det var bittert”. Folket knorrade, Mose ropade till Herren, ”och HERREN visade honom ett visst slags trä, som han kastade i vattnet, och så blev vattnet sött”. Där gav Gud dem ”lag och rätt” och löftet: ”jag är HERREN, din läkare”. Från Mara gick de vidare till Elim, där ”funnos tolv vattenkällor och sjuttio palmträd”, ofta förlagt till Wadi Gharandel. Förteckningen över läger i Fjärde Mosebok upprepar etapperna: tre dagar genom Etams öken, Mara, Elim."
    - "I dag ligger kandidatkällorna på Suezvikens egyptiska strand, längs vägen från Sueztunneln söderut mot Abu Zenima; Uyun Musa är fortfarande en palmoas, och Ain Hawarah en liten bitter pool i öknen."
  nb:
    - "Mara, «bitterhet», var Israels første leir etter å ha gått over havet, tre dager inne i ørkenen Sjur, en kilde hvis vann ikke kunne drikkes. Hvor den lå, avhenger av hvor man plasserer overgangen, og det vet ingen. Reisende som førte israelittene ned langs østkysten av Suezbukta, festet seg ved Ain Hawarah, en brakk kilde omkring 80 km sørøst for Suez, som Burckhardt og Robinson beskrev; andre foretrakk Moses' kilder, Uyun Musa, en palmeoase 15 km sørøst for Suez, eller brønnen kalt Bir Mara like ved; og de som fører folket forbi de Bitre innsjøene, har funnet Mara i det salte vannet. Kartet viser disse fire. Utover navnet markerer ingenting på bakken stedet."
    - "Andre Mosebok forteller det kort: «Så kom de til Mara; men de kunde ikke drikke vannet i Mara fordi det var beskt». Folket knurret, Moses ropte til Herren, og «Herren viste ham et tre; det kastet han i vannet, og vannet blev godt». Der satte Gud dem «lov og rett» og ga løftet: «jeg er Herren, din læge». Fra Mara gikk de videre til Elim, «der var tolv vannkilder og sytti palmetrær», ofte plassert ved Wadi Gharandel. Listen over leirer i Fjerde Mosebok gjentar etappene: tre dager gjennom Etams ørken, Mara, Elim."
    - "I dag ligger kandidatkildene på den egyptiske stranden av Suezbukta, langs veien fra Suez-tunnelen sørover mot Abu Zenima; Uyun Musa er fortsatt en palmeoase, og Ain Hawarah en liten bitter kulp i ørkenen."
  tl:
    - "Ang Mara, “kapaitan”, ay ang unang kampo ng Israel pagkatawid sa dagat, tatlong araw sa loob ng ilang ng Shur, isang bukal na ang tubig ay hindi mainom. Nakasalalay ang kinaroroonan nito sa kung saan inilalagay ang pagtawid, at walang nakaaalam niyon. Ang mga manlalakbay na nagdala sa mga Israelita pababa sa silangang baybayin ng Golpo ng Suez ay tumuon sa Ain Hawarah, isang bukal na maalat-alat mga 80 km sa timog-silangan ng Suez, na inilarawan nina Burckhardt at Robinson; mas pinili ng iba ang mga bukal ni Moises, Uyun Musa, isang oasis ng palma 15 km sa timog-silangan ng Suez, o ang balon na tinatawag na Bir Mara sa malapit; at ang mga nagdadala sa bayan sa tabi ng Mapait na mga Lawa ay nakasumpong ng Mara sa maalat na tubig na iyon. Ipinapakita ng mapa ang apat na ito. Lampas sa pangalan, walang bakas sa lupa na nagmamarka sa lugar."
    - "Maikling isinasalaysay ito ng Exodo: “nang sila'y dumating sa Mara, ay hindi sila makainom ng tubig sa Mara, sapagka't mapait”. Nagbulung-bulungan ang bayan, dumaing si Moises sa Panginoon, at “pinapagkitaan siya ng Panginoon ng isang puno ng kahoy, at inihagis niya sa tubig, at ang tubig ay tumabang”. Doon ay binigyan sila ng Diyos ng “palatuntunan, at ng tagubilin” at ng pangako, “ako ang Panginoon na nagpapagaling sa iyo”. Mula sa Mara ay nagpatuloy sila sa Elim, “na doo'y mayroong labingdalawang bukal ng tubig, at pitongpung puno ng palma”, na madalas ilagay sa Wadi Gharandel. Inuulit ng talaan ng mga kampo sa Mga Bilang ang mga yugto: tatlong araw sa ilang ng Etham, Mara, Elim."
    - "Ang mga bukal na kandidato ay nasa baybaying Egipcio ng Golpo ng Suez ngayon, sa daan mula sa tunel ng Suez patimog patungong Abu Zenima; ang Uyun Musa ay oasis pa rin ng mga palma, at ang Ain Hawarah ay maliit na mapait na lawa sa disyerto."
  da:
    - "Mara, »bitterhed«, var Israels første lejr efter havets krydsning, tre dage inde i Sjur-ørkenen, en kilde, hvis vand ikke kunne drikkes. Hvor den lå, afhænger af, hvor man sætter krydsningen, og det ved ingen. Rejsende, der førte israelitterne ned ad Suezbugtens østkyst, faldt for Ain Hawarah, en brakvandskilde omkring 80 km sydøst for Suez, som Burckhardt og Robinson beskrev; andre foretrak Moses' kilder, Uyun Musa, en palmeoase 15 km sydøst for Suez, eller brønden kaldet Bir Mara nær dem; og de, der fører folket forbi de Bitre Søer, har fundet Mara i det salte vand. Kortet viser disse fire. Ud over navnet markerer intet på jorden stedet."
    - "Anden Mosebog fortæller det kort: »Saa kom de til Mara; men de kunde ikke drikke Vandet i Mara, thi det var besk«. Folket knurrede, Moses råbte til Herren, og »Herren viste ham et Træ, og han kastede det i Vandet, og saa blev Vandet sødt«. Dér gav Gud dem »Lov og Ret« og løftet: »thi jeg er Herren, som læger dig«. Fra Mara drog de videre til Elim, hvor »der var tolv Vandkilder og halvfjerdsindstyve Palmetræer«, ofte placeret ved Wadi Gharandel. Listen over lejre i Fjerde Mosebog gentager etaperne: tre dage gennem Etams ørken, Mara, Elim."
    - "I dag ligger kandidatkilderne på Suezbugtens egyptiske bred, langs vejen fra Suez-tunnelen sydpå mod Abu Zenima; Uyun Musa er stadig en palmeoase, og Ain Hawarah en lille bitter pøl i ørkenen."
  sr:
    - "Мера, „горчина“, био је први логор Израиља после преласка мора, три дана у пустињи Сур, извор чија се вода није могла пити. Где је био, зависи од тога где се смешта прелаз, а то нико не зна. Путници који су Израиљце водили низ источну обалу Суецког залива определили су се за Ајн Хавару, слан извор око 80 км југоисточно од Суеца, који су описали Буркхарт и Робинсон; други су преферирали Мојсијеве изворе, Ујун Мусу, палмову оазу 15 км југоисточно од Суеца, или бунар Бир Мара близу њих; а они који воде народ поред Горких језера нашли су Меру у тој сланој води. Мапа приказује ова четири. Осим имена, ништа на терену не обележава место."
    - "Књига Изласка то приповеда кратко: „дођоше у Меру, али не могоше пити воду у Мери, јер беше горка“. Народ је викао на Мојсија, Мојсије је завапио Господу, „а Господ му показа дрво, те га метну у воду, и вода поста слатка“. Ту им је Бог дао „уредбу и закон“ и обећање: „сам ја Господ, лекар твој“. Из Мере су отишли у Елим, „где беше дванаест извора и седамдесет палми“, који се често смешта у Вади Гарандел. Списак логора у Књизи Бројева понавља етапе: три дана кроз пустињу Етам, Мера, Елим."
    - "Данас кандидатски извори леже на египатској обали Суецког залива, дуж пута од Суецког тунела на југ према Абу Зеними; Ујун Муса је још палмова оаза, а Ајн Хавара мала горка бара у пустињи."
  hu:
    - "Mára, „keserűség”, Izráel első tábora volt a tengeren való átkelés után, három napra a Súr pusztájában, egy forrás, amelynek vizét nem lehetett meginni. Hogy hol volt, azon múlik, hová teszik az átkelést, és ezt senki sem tudja. Az utazók, akik az izraelitákat a Szuezi-öböl keleti partján vezették le, az Ain Hawarahra gondoltak, egy brakkvizű forrásra Szueztől mintegy 80 km-re délkeletre, amelyet Burckhardt és Robinson leírt; mások a Mózes-forrásokat, az Uyun Musát választották, egy pálmaoázist Szueztől 15 km-re délkeletre, vagy a közelében lévő Bir Mara nevű kutat; akik a népet a Keserű-tavak mellett vezetik el, Márát ebben a sós vízben találták meg. A térkép e négyet mutatja. A néven túl semmi sem jelöli a helyet a terepen."
    - "A Kivonulás könyve röviden mondja el: „És eljutának Márába, de nem ihatják vala a vizet Márában, mivelhogy keserű vala”. A nép zúgolódott, Mózes az Úrhoz kiáltott, és „mutata néki az Úr egy fát és beveté azt a vízbe, és a víz megédesedék”. Ott adott nekik Isten „rendtartást és törvényt”, és az ígéretet: „én vagyok az Úr, a te gyógyítód”. Márából Élimbe mentek, ahol „tizenkét forrás vala és hetven pálmafa”, amelyet gyakran a Wadi Gharandelre helyeznek. A Számok könyvének táborjegyzéke megismétli az állomásokat: három nap Étám pusztájában, Mára, Élim."
    - "Ma a jelölt források a Szuezi-öböl egyiptomi partján fekszenek, a szuezi alagúttól Abu Zenima felé vezető út mentén; az Uyun Musa ma is pálmaoázis, az Ain Hawarah pedig kis keserű tó a sivatagban."
  fi:
    - "Mara, ”karvaus”, oli Israelin ensimmäinen leiri meren ylittämisen jälkeen, kolmen päivän päässä Surin erämaassa, lähde, jonka vettä ei voinut juoda. Missä se oli, riippuu siitä, mihin ylitys sijoitetaan, eikä sitä tiedä kukaan. Matkailijat, jotka veivät israelilaiset Suezinlahden itärantaa pitkin, valitsivat Ain Hawarahin, murtovetisen lähteen noin 80 km Suezista kaakkoon, jonka Burckhardt ja Robinson kuvasivat; toiset suosivat Mooseksen lähteitä, Uyun Musaa, palmukeidasta 15 km Suezista kaakkoon, tai niiden lähellä olevaa Bir Mara -kaivoa; ja ne, jotka johdattavat kansan Karvaiden järvien ohi, ovat löytäneet Maran siitä suolavedestä. Kartta näyttää nämä neljä. Nimeä lukuun ottamatta mikään maastossa ei merkitse paikkaa."
    - "Toinen Mooseksen kirja kertoo asian lyhyesti: ”Sitten he tulivat Maaraan; mutta he eivät voineet juoda Maaran vettä; sillä se oli karvasta”. Kansa napisi, Mooses huusi Herran puoleen, ja ”Herra osoitti hänelle puun, jonka hän heitti veteen, ja vesi tuli makeaksi”. Siellä Jumala antoi heille ”lain ja oikeuden” ja lupauksen: ”minä olen Herra, sinun parantajasi”. Marasta he menivät Elimiin, jossa oli ”kaksitoista vesilähdettä ja seitsemänkymmentä palmupuuta”; Elim sijoitetaan usein Wadi Gharandelille. Neljännen Mooseksen kirjan leiriluettelo toistaa vaiheet: kolme päivää Etamin erämaassa, Mara, Elim."
    - "Nykyään ehdokaslähteet sijaitsevat Suezinlahden Egyptin puoleisella rannalla, Suezin tunnelista etelään kohti Abu Zenimaa johtavan tien varrella; Uyun Musa on yhä palmujen keidas ja Ain Hawarah pieni karvas lampi autiomaassa."
  vi:
    - "Ma-ra, nghĩa là “đắng”, là nơi đóng trại đầu tiên của Y-sơ-ra-ên sau khi vượt biển, ba ngày đường vào đồng vắng Su-rơ, một mạch nước mà nước không uống được. Vị trí phụ thuộc vào chỗ người ta đặt nơi vượt biển, mà không ai biết. Những du khách vạch đường đi của dân Y-sơ-ra-ên xuống dọc bờ đông vịnh Suez thì chọn Ain Hawarah, một mạch nước lợ cách Suez khoảng 80 km về phía đông nam, mà Burckhardt và Robinson đã mô tả; những người khác ưa các suối của Môi-se, Uyun Musa, một ốc đảo chà là cách Suez 15 km về phía đông nam, hoặc giếng gọi là Bir Mara gần đó; và những ai cho rằng dân sự đi ngang các Hồ Đắng thì tìm thấy Ma-ra trong nước mặn ấy. Bản đồ cho thấy bốn nơi này. Ngoài cái tên, không có gì trên mặt đất đánh dấu nơi ấy."
    - "Sách Xuất Ê-díp-tô ký kể ngắn gọn: “Kế đến đất Ma-ra, nhưng vì nước tại đó đắng, uống chẳng được”. Dân sự oán trách, Môi-se kêu van Đức Giê-hô-va, “Ngài bèn chỉ cho người một cây gỗ, người lấy liệng xuống nước, nước bèn hóa ra ngọt”. Tại đó Đức Chúa Trời ban cho họ “luật lệ cùng lập pháp độ” và lời hứa: “ta là Đức Giê-hô-va, Đấng chữa bịnh cho ngươi”. Từ Ma-ra họ đi tiếp đến Ê-lim, “nơi đó có mười hai suối nước, và bảy mươi cây chà là”, thường được đặt tại Wadi Gharandel. Danh sách các nơi đóng trại trong Dân số ký lặp lại các chặng: ba ngày qua đồng vắng Ê-tam, Ma-ra, Ê-lim."
    - "Ngày nay các suối ứng viên nằm trên bờ Ai Cập của vịnh Suez, dọc đường từ đường hầm Suez xuống phía nam hướng về Abu Zenima; Uyun Musa vẫn là một ốc đảo chà là, còn Ain Hawarah là một vũng nhỏ đắng giữa sa mạc."
  ro:
    - "Mara, „amărăciune”, a fost prima tabără a lui Israel după trecerea mării, la trei zile în pustia Șur, un izvor a cărui apă nu putea fi băută. Unde se afla depinde de locul în care este pusă trecerea, și asta nu o știe nimeni. Călătorii care i-au dus pe israeliți pe țărmul estic al Golfului Suez au ales Ain Hawarah, un izvor sărat la circa 80 km sud-est de Suez, descris de Burckhardt și Robinson; alții au preferat izvoarele lui Moise, Uyun Musa, o oază de palmieri la 15 km sud-est de Suez, sau fântâna numită Bir Mara din apropiere; iar cei care conduc poporul pe lângă Lacurile Amare au găsit Mara în acea apă sărată. Harta le arată pe aceste patru. Dincolo de nume, nimic de pe teren nu marchează locul."
    - "Exodul povestește pe scurt: „au venit în Merra, și nu puteau să beà apă din Merra că erà amară”. Poporul a cârtit, Moise a strigat către Domnul, iar „i-au arătat lui Domnul un lemn și l-a băgat în apă și s’a îndulcit apa”. Acolo Dumnezeu le-a dat „îndreptări și judecăți” și făgăduința: „eu sunt Domnul Dumnezeul tău cel ce te vindec pre tine”. De la Mara au mers la Elim, unde erau „douăsprezece izvoare de apă și șaptezeci de pomi de finic”, de obicei așezat la Wadi Gharandel. Lista taberelor din Numeri repetă etapele: trei zile prin pustia Etam, Mara, Elim."
    - "Astăzi izvoarele candidate se află pe țărmul egiptean al Golfului Suez, de-a lungul drumului din tunelul Suez spre sud, către Abu Zenima; Uyun Musa este încă o oază de palmieri, iar Ain Hawarah un mic bazin amar în deșert."
  bg:
    - "Мера, „горчивина“, е първият стан на Израил след преминаването на морето, на три дни път в пустинята Сур — извор, чиято вода не можела да се пие. Къде е бил, зависи от това къде се поставя преминаването, а това никой не знае. Пътешествениците, които водели израилтяните по източния бряг на Суецкия залив, се спирали на Айн Хавара — солоноват извор на около 80 км югоизточно от Суец, описан от Буркхард и Робинсън; други предпочитали Мойсеевите извори, Уюн Муса, палмов оазис на 15 км югоизточно от Суец, или кладенеца Бир Мара близо до тях; а онези, които прекарват народа покрай Горчивите езера, откриват Мера в тази солена вода. Картата показва тези четири. Освен името нищо на терена не бележи мястото."
    - "Изход разказва накратко: „дойдоха в Мера; но не могоха да пият от водата на Мера защото беше горчива“. Народът роптаеше, Мойсей извика към Господа, „и показа му Господ дърво, което като хвърли у водата, водата се услади“. Там Бог им даде „заповед и повеление“ и обещанието: „аз съм Господ който те изцелявам“. От Мера те продължиха към Елим, „дето имаше дванадесет водни източници и седемдесет финикови дървета“, често поставян при Уади Гарандел. Списъкът на становете в Числа повтаря етапите: три дни през пустинята Етам, Мера, Елим."
    - "Днес изворите кандидати лежат на египетския бряг на Суецкия залив, по пътя от Суецкия тунел на юг към Абу Зенима; Уюн Муса все още е палмов оазис, а Айн Хавара — малко горчиво езерце в пустинята."
scripture:
  - Exod.15.22-Exod.15.27
  - Num.33.8-Num.33.9
sources:
