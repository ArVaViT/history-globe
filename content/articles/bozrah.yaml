body:
  en:
    - "Bozrah, a chief city of Edom, is usually identified with the ruins at Busayra (Buseira) in southern Jordan, about 10 km south of Tafila and some 50 km north of Petra. Crystal-M. Bennett excavated the site between 1971 and 1980, and Piotr Bienkowski published the final report in 2002. She uncovered large public buildings, among them Building A, a monumental complex of more than 2,300 m² whose courtyard is taken to belong to a temple or a palace."
    - "The excavated town belongs to the late Iron Age. Its beginnings were first dated to the eighth century BC, while later studies place the main remains no earlier than the seventh. In that age Assyrian records name kings of Edom: about 673 BC Esarhaddon summoned Qaush-gabri, king of Edom, with Manasseh, king of Judah, and other kings of the west to bring building materials for his palace at Nineveh."
    - 'Genesis names Jobab the son of Zerah of Bozrah among the kings who reigned in Edom before any king reigned over Israel. For the prophets Bozrah stands for Edom itself. Amos foretells a fire "which shall devour the palaces of Bozrah"; Isaiah says that "the LORD hath a sacrifice in Bozrah" and asks, "Who is this that cometh from Edom, with dyed garments from Bozrah?" Jeremiah warns that Bozrah "shall become a desolation" and that the enemy will fly as the eagle and spread his wings over it.'
    - "The Nabonidus Chronicle, in a damaged line, has the Babylonian king encamp against Edom in his third year, 553/552 BC, and the destruction of part of Building A in the seventh or sixth century may belong to that campaign. In the fifth and fourth centuries BC the western half of the building was rebuilt on the old foundations while the eastern half lay in ruins. Early in the fourth century AD Eusebius distinguished Bosor, the city of Esau in the hills of Idumea of which Isaiah speaks, from Bostra in Arabia."
  ru:
    - "Восор, один из главных городов Едома, обычно отождествляют с развалинами у Бусейры на юге Иордании, примерно в 10 км к югу от Эт-Тафилы и примерно в 50 км к северу от Петры. Кристал-М. Беннетт вела здесь раскопки с 1971 по 1980 год, а Пётр Бенковский в 2002 году издал итоговый отчёт. Она открыла большие общественные здания, среди них Здание A — монументальный комплекс площадью более 2300 м², двор которого считают частью храма или дворца."
    - "Раскопанный город относится к позднему железному веку. Его начало сперва датировали VIII веком до н. э., а более поздние исследования относят основные остатки не ранее чем к VII веку. В это время ассирийские записи называют царей Едома: около 673 г. до н. э. Асардан призвал Кауш-габри, царя Едома, вместе с Манассией, царём Иудейским, и другими царями запада доставить строительные материалы для его дворца в Ниневии."
    - "Книга Бытия называет Иовава, сына Зераха, из Восора среди царей, царствовавших в Едоме прежде царствования царей у сынов Израилевых. У пророков Восор означает сам Едом. Амос предрекает огонь, который «пожрет чертоги Восора»; Исаия говорит, что «жертва у Господа в Восоре», и спрашивает: «Кто это идет от Едома, в червленых ризах от Восора?» Иеремия предупреждает, что Восор станет «пустынею» и что враг, как орёл, распустит над ним крылья свои."
    - "Хроника Набонида в повреждённой строке сообщает, что вавилонский царь на третьем году правления, в 553/552 г. до н. э., встал лагерем против Едома, и разрушение части Здания A в VII или VI веке, возможно, связано с этим походом. В V–IV веках до н. э. западную половину здания отстроили на старых основаниях, а восточная лежала в развалинах. В начале IV века н. э. Евсевий отличал Восор, город Исава в горах Идумеи, о котором говорит Исаия, от Бостры в Аравии."
  uk:
    - "Боцру, одне з головних міст Едому, зазвичай ототожнюють із руїнами в Бусайрі (Бусейра) на півдні Йорданії, приблизно за 10 км на південь від Тафіли й за якихось 50 км на північ від Петри. Крістал-М. Беннетт розкопувала це місце з 1971 до 1980 р., а Пйотр Бєнковський опублікував остаточний звіт у 2002 р. Вона відкрила великі громадські будівлі, серед них Будівлю A, монументальний комплекс понад 2300 м², чий двір вважають частиною храму або палацу."
    - "Розкопане місто належить до пізньої залізної доби. Його початки спершу датували VIII ст. до н. е., тоді як пізніші дослідження відносять основні рештки не раніше ніж до VII ст. У ту добу ассирійські записи називають царів Едому: близько 673 р. до н. е. Асархаддон викликав Каушгабрі, царя Едому, разом із Манасією, царем Юди, та іншими царями заходу, щоб ті принесли будівельні матеріали для його палацу в Ніневії."
    - "Книга Буття називає Йовава, сина Зераха з Боцри, серед царів, що царювали в Едомі, перш ніж у Ізраїлі зацарював будь-який цар. Для пророків Боцра означає сам Едом. Амос віщує вогонь: «нехай пожере в Босрі будівлї»; Ісая каже, що «в Босорі справить Бог сю жертву», і питає: «Хто се йде з Едому, в червоній одежі з Босору?» Єремія застерігає, що «Восор станеться острахом, сьміховищем, дивовижею й прокляттєм» а ворог «орлом підійметься … налетить і розпустить крила понад Восором»."
    - "Хроніка Набоніда в пошкодженому рядку каже, що вавилонський цар стояв табором проти Едому в свій третій рік, 553/552 р. до н. е., і руйнування частини Будівлі A у VII або VI ст. може належати до цього походу. У V і IV ст. до н. е. західну половину будівлі було відбудовано на старих підвалинах, тоді як східна половина лежала в руїнах. На початку IV ст. н. е. Євсевій розрізняв Восор, місто Ісава в горах Ідумеї, про яке говорить Ісая, і Бостру в Аравії."
  es:
    - "Bosra, una de las principales ciudades de Edom, se identifica habitualmente con las ruinas de Busayra (Buseira), en el sur de Jordania, a unos 10 km al sur de Tafila y a unos 50 km al norte de Petra. Crystal-M. Bennett excavó el sitio entre 1971 y 1980, y Piotr Bienkowski publicó el informe final en 2002. Ella sacó a la luz grandes edificios públicos, entre ellos el Edificio A, un complejo monumental de más de 2300 m² cuyo patio se considera parte de un templo o de un palacio."
    - "La ciudad excavada pertenece a la Edad del Hierro tardía. Sus comienzos se fecharon primero en el siglo VIII a. C., mientras que estudios posteriores sitúan los restos principales no antes del VII. En esa época los registros asirios nombran reyes de Edom: hacia el 673 a. C. Esar-hadón convocó a Qaush-gabri, rey de Edom, junto con Manasés, rey de Judá, y otros reyes de Occidente para que aportaran materiales de construcción para su palacio de Nínive."
    - "El Génesis nombra a Jobab, hijo de Zera, de Bosra, entre los reyes que reinaron en Edom antes de que reinara rey alguno sobre Israel. Para los profetas, Bosra representa a Edom mismo. Amós anuncia un fuego que «consumirá los palacios de Bosra»; Isaías dice que «Jehová tiene sacrificios en Bosra» y pregunta: «¿Quién es éste que viene de Edom, de Bosra con vestidos bermejos?». Jeremías advierte que Bosra será «en asolamiento» y que el enemigo subirá como águila y extenderá sus alas sobre ella."
    - "La Crónica de Nabónido, en una línea dañada, hace que el rey babilonio acampe contra Edom en su tercer año, 553/552 a. C., y la destrucción de parte del Edificio A en el siglo VII o VI puede pertenecer a esa campaña. En los siglos V y IV a. C. la mitad occidental del edificio fue reconstruida sobre los antiguos cimientos mientras la mitad oriental yacía en ruinas. A principios del siglo IV d. C., Eusebio distinguió Bosor, la ciudad de Esaú en las montañas de Idumea de la que habla Isaías, de Bostra en Arabia."
  pt:
    - "Bozra, uma das principais cidades de Edom, costuma ser identificada com as ruínas de Busayra (Buseira), no sul da Jordânia, cerca de 10 km ao sul de Tafila e uns 50 km ao norte de Petra. Crystal-M. Bennett escavou o local entre 1971 e 1980, e Piotr Bienkowski publicou o relatório final em 2002. Ela descobriu grandes edifícios públicos, entre eles o Edifício A, um complexo monumental de mais de 2.300 m² cujo pátio se considera pertencer a um templo ou a um palácio."
    - "A cidade escavada pertence ao fim da Idade do Ferro. Seus inícios foram datados primeiro do século VIII a.C., enquanto estudos posteriores situam os principais vestígios não antes do século VII. Nessa época, registros assírios nomeiam reis de Edom: por volta de 673 a.C., Esar-Hadom convocou Qaus-Gabri, rei de Edom, com Manassés, rei de Judá, e outros reis do ocidente, para trazerem materiais de construção para o seu palácio em Nínive."
    - "O Gênesis nomeia Jobabe, filho de Zera, de Bozra, entre os reis que reinaram em Edom antes que qualquer rei reinasse sobre Israel. Para os profetas, Bozra representa o próprio Edom. Amós prediz um fogo que “devorará os palácios de Bozra”; Isaías diz que “o SENHOR tem um sacrifício em Bozra” e pergunta: “Quem é este que vem de Edom, com roupas tingidas de Bozra?” Jeremias adverte que Bozra “se tornará objeto de espanto, vergonha, desolação e maldição” e que o inimigo voará como a águia e estenderá as asas sobre ela."
    - "A Crônica de Nabonido, numa linha danificada, faz o rei babilônico acampar contra Edom em seu terceiro ano, 553/552 a.C., e a destruição de parte do Edifício A no século VII ou VI pode pertencer a essa campanha. Nos séculos V e IV a.C., a metade ocidental do edifício foi reconstruída sobre as antigas fundações, enquanto a metade oriental ficava em ruínas. No início do século IV d.C., Eusébio distinguiu Bosor, a cidade de Esaú nas colinas da Iduméia de que fala Isaías, de Bostra, na Arábia."
  de:
    - "Bozra, eine der wichtigsten Städte Edoms, wird gewöhnlich mit den Ruinen von Busayra (Buseira) im Süden Jordaniens gleichgesetzt, etwa 10 km südlich von Tafila und rund 50 km nördlich von Petra. Crystal-M. Bennett grub dort zwischen 1971 und 1980, und Piotr Bienkowski veröffentlichte 2002 den Abschlussbericht. Sie legte große öffentliche Bauten frei, darunter Gebäude A, einen monumentalen Komplex von mehr als 2300 m², dessen Hof einem Tempel oder einem Palast zugerechnet wird."
    - "Die ausgegrabene Stadt gehört der späten Eisenzeit an. Ihre Anfänge wurden zuerst ins 8. Jahrhundert v. Chr. datiert, während spätere Untersuchungen die Hauptreste nicht vor das 7. setzen. In jener Zeit nennen assyrische Quellen Könige von Edom: Um 673 v. Chr. forderte Asarhaddon Qaus-gabri, den König von Edom, zusammen mit Manasse, dem König von Juda, und anderen Königen des Westens auf, Baumaterial für seinen Palast in Ninive zu liefern."
    - "Die Genesis nennt Jobab, den Sohn Serachs von Bozra, unter den Königen, die in Edom regierten, ehe ein König über Israel regierte. Für die Propheten steht Bozra für Edom selbst. Amos kündigt ein Feuer an, „das soll die Paläste zu Bozra verzehren“; Jesaja sagt, „der HERR hält ein Schlachten zu Bozra“, und fragt: „Wer ist der, so von Edom kommt, mit rötlichen Kleidern von Bozra?“ Jeremia warnt: „Bozra soll ein Wunder, Schmach, Wüste und Fluch werden“, und der Feind werde wie ein Adler fliegen und seine Flügel über ihr ausbreiten."
    - "Die Nabonid-Chronik lässt in einer beschädigten Zeile den babylonischen König in seinem dritten Jahr, 553/552 v. Chr., gegen Edom lagern, und die Zerstörung eines Teils von Gebäude A im 7. oder 6. Jahrhundert könnte zu diesem Feldzug gehören. Im 5. und 4. Jahrhundert v. Chr. wurde die westliche Hälfte des Gebäudes auf den alten Fundamenten wieder aufgebaut, während die östliche Hälfte in Trümmern lag. Anfang des 4. Jahrhunderts n. Chr. unterschied Eusebius Bosor, die Stadt Esaus im Bergland von Idumäa, von der Jesaja spricht, von Bostra in Arabien."
  fr:
    - "Botsra, l’une des principales villes d’Édom, est généralement identifiée aux ruines de Busayra (Buseira), dans le sud de la Jordanie, à environ 10 km au sud de Tafila et à quelque 50 km au nord de Pétra. Crystal-M. Bennett fouilla le site de 1971 à 1980, et Piotr Bienkowski en publia le rapport final en 2002. Elle mit au jour de grands édifices publics, dont le bâtiment A, complexe monumental de plus de 2 300 m² dont la cour est attribuée à un temple ou à un palais."
    - "La ville fouillée appartient à la fin de l’âge du Fer. Ses débuts ont d’abord été datés du VIIIe siècle av. J.-C., tandis que des études plus récentes placent les principaux vestiges au plus tôt au VIIe. À cette époque, des annales assyriennes nomment des rois d’Édom : vers 673 av. J.-C., Esar-Haddon convoqua Qaush-gabri, roi d’Édom, avec Manassé, roi de Juda, et d’autres rois de l’Occident, pour apporter des matériaux de construction destinés à son palais de Ninive."
    - "La Genèse nomme Jobab, fils de Zérach, de Botsra, parmi les rois qui régnèrent en Édom avant qu’aucun roi régnât sur Israël. Pour les prophètes, Botsra désigne Édom lui-même. Amos annonce un feu qui « dévorera les palais de Botsra » ; Ésaïe dit qu’« il y a des victimes de l’Éternel à Botsra » et demande : « Qui est celui-ci qui vient d’Édom, de Botsra, en vêtements rouges ? » Jérémie avertit que Botsra « sera un objet de désolation » et que l’ennemi volera comme l’aigle et étendra ses ailes sur elle."
    - "La Chronique de Nabonide, dans une ligne endommagée, fait camper le roi babylonien contre Édom dans sa troisième année, 553/552 av. J.-C., et la destruction d’une partie du bâtiment A au VIIe ou au VIe siècle peut se rattacher à cette campagne. Aux Ve et IVe siècles av. J.-C., la moitié ouest du bâtiment fut reconstruite sur les anciennes fondations tandis que la moitié est restait en ruine. Au début du IVe siècle apr. J.-C., Eusèbe distinguait Bosor, la ville d’Ésaü dans les montagnes d’Idumée dont parle Ésaïe, de Bostra en Arabie."
  it:
    - "Bosra, una delle principali città di Edom, si identifica di solito con le rovine di Busayra (Buseira) nella Giordania meridionale, a circa 10 km a sud di Tafila e a circa 50 km a nord di Petra. Crystal-M. Bennett scavò il sito tra il 1971 e il 1980, e Piotr Bienkowski pubblicò il rapporto finale nel 2002. Essa portò alla luce grandi edifici pubblici, tra cui l’Edificio A, un complesso monumentale di oltre 2300 m² il cui cortile si ritiene appartenesse a un tempio o a un palazzo."
    - "La città scavata appartiene alla tarda età del Ferro. Le sue origini furono datate dapprima all’VIII secolo a.C., mentre studi più recenti collocano i resti principali non prima del VII. In quell’epoca le fonti assire nominano re di Edom: intorno al 673 a.C. Assaraddon convocò Qaush-gabri, re di Edom, con Manasse, re di Giuda, e altri re dell’Occidente, perché portassero materiali da costruzione per il suo palazzo a Ninive."
    - "La Genesi nomina Iobab figlio di Zerach, di Bosra, fra i re che regnarono in Edom prima che alcun re regnasse su Israele. Per i profeti Bosra rappresenta Edom stessa. Amos preannuncia un fuoco «che divorerà i palazzi di Botsra»; Isaia dice che «l’Eterno fa un sacrifizio a Botsra» e chiede: «Chi è questi che giunge da Edom, da Botsra, in vestimenti splendidi?» Geremia avverte che «Botsra diverrà una desolazione» e che il nemico volerà come l’aquila e spiegherà le ali su di essa."
    - "La Cronaca di Nabonedo, in una riga danneggiata, fa accampare il re babilonese contro Edom nel suo terzo anno, 553/552 a.C., e la distruzione di parte dell’Edificio A nel VII o VI secolo può appartenere a quella campagna. Nel V e IV secolo a.C. la metà occidentale dell’edificio fu ricostruita sulle antiche fondamenta mentre la metà orientale giaceva in rovina. All’inizio del IV secolo d.C. Eusebio distinse Bosor, la città di Esaù sui monti dell’Idumea di cui parla Isaia, da Bostra d’Arabia."
  pl:
    - "Bosra, jedno z głównych miast Edomu, jest zwykle utożsamiana z ruinami w Busajrze (Buseira) w południowej Jordanii, około 10 km na południe od Tafili i około 50 km na północ od Petry. Crystal-M. Bennett prowadziła wykopaliska na tym stanowisku w latach 1971–1980, a Piotr Bienkowski opublikował sprawozdanie końcowe w 2002 r. Odkryła duże budowle publiczne, wśród nich Budynek A, monumentalny kompleks o powierzchni ponad 2300 m², którego dziedziniec uważa się za część świątyni lub pałacu."
    - "Odkryte miasto należy do późnej epoki żelaza. Jego początki datowano najpierw na VIII w. p.n.e., podczas gdy późniejsze badania umieszczają główne pozostałości nie wcześniej niż w VII w. W tym czasie źródła asyryjskie wymieniają królów Edomu: około 673 r. p.n.e. Asarhaddon wezwał Kaus-gabri, króla Edomu, wraz z Manassesem, królem Judy, i innymi królami zachodu, by dostarczyli materiałów budowlanych do jego pałacu w Niniwie."
    - "Księga Rodzaju wymienia Jobaba, syna Zeracha z Bosry, wśród królów, którzy panowali w Edomie, zanim jakikolwiek król zapanował nad Izraelem. Dla proroków Bosra oznacza sam Edom. Amos zapowiada ogień, który „pożre pałace w Bocra”; Izajasz mówi, że „ofiara Pańska będzie w Bocra”, i pyta: „Któż to jest, który idzie z Edom, w szatach ubroczonych we krwi z Bocra?” Jeremiasz ostrzega, że Bosra przyjdzie „na spustoszenie”, a nieprzyjaciel poleci jak orzeł i rozciągnie nad nią skrzydła."
    - "Kronika Nabonida w uszkodzonym wierszu mówi, że król babiloński wyruszył przeciw Edomowi w trzecim roku swego panowania, 553/552 r. p.n.e., i zniszczenie części Budynku A w VII lub VI w. może należeć do tej wyprawy. W V i IV w. p.n.e. zachodnią połowę budynku odbudowano na dawnych fundamentach, podczas gdy wschodnia połowa leżała w ruinie. Na początku IV w. n.e. Euzebiusz odróżniał Bosor, miasto Ezawa w górach Idumei, o którym mówi Izajasz, od Bostry w Arabii."
  nl:
    - "Bozra, een hoofdstad van Edom, wordt gewoonlijk geïdentificeerd met de ruïnes bij Busayra (Buseira) in het zuiden van Jordanië, ongeveer 10 km ten zuiden van Tafila en zo'n 50 km ten noorden van Petra. Crystal-M. Bennett groef de plaats op tussen 1971 en 1980, en Piotr Bienkowski publiceerde het eindverslag in 2002. Zij legde grote openbare gebouwen bloot, onder meer Gebouw A, een monumentaal complex van meer dan 2300 m² waarvan het binnenplein wordt toegeschreven aan een tempel of een paleis."
    - "De opgegraven stad hoort bij de late IJzertijd. De begindatering werd eerst in de achtste eeuw v.Chr. gesteld, terwijl latere studies de belangrijkste resten niet eerder dan in de zevende plaatsen. In die tijd noemen Assyrische bronnen koningen van Edom: omstreeks 673 v.Chr. riep Esarhaddon Qaus-gabri, koning van Edom, samen met Manasse, koning van Juda, en andere koningen van het westen op om bouwmaterialen te leveren voor zijn paleis in Nineve."
    - "Genesis noemt Jobab, de zoon van Zerach, van Bozra, onder de koningen die in Edom regeerden voordat er enige koning over Israël regeerde. Voor de profeten staat Bozra voor Edom zelf. Amos kondigt een vuur aan “dat zal de paleizen van Bozra verteren”; Jesaja zegt dat “de HEERE heeft een slachtoffer te Bozra” en vraagt: “Wie is Deze, Die van Edom komt met besprenkelde klederen, van Bozra?” Jeremia waarschuwt dat Bozra “worden zal tot een ontzetting” en dat de vijand zal vliegen als een arend en zijn vleugels erover zal uitbreiden."
    - "De Kroniek van Nabonidus laat in een beschadigde regel de Babylonische koning in zijn derde jaar, 553/552 v.Chr., tegen Edom ten strijde trekken, en de verwoesting van een deel van Gebouw A in de zevende of zesde eeuw kan bij die veldtocht horen. In de vijfde en vierde eeuw v.Chr. werd de westelijke helft van het gebouw herbouwd op de oude fundamenten, terwijl de oostelijke helft in puin lag. Vroeg in de 4e eeuw n.Chr. onderscheidde Eusebius Bosor, de stad van Ezau in het bergland van Idumea waarover Jesaja spreekt, van Bostra in Arabië."
  cs:
    - "Bosra, jedno z hlavních měst Edómu, se obvykle ztotožňuje se zříceninami v Busayře (Buseira) v jižním Jordánsku, asi 10 km jižně od Tafily a zhruba 50 km severně od Petry. Crystal-M. Bennett zde v letech 1971–1980 prováděla vykopávky a Piotr Bienkowski vydal závěrečnou zprávu roku 2002. Odkryla velké veřejné budovy, mezi nimi Budovu A, monumentální komplex o rozloze přes 2 300 m², jehož nádvoří se pokládá za součást chrámu nebo paláce."
    - "Odkrytá osada patří k pozdní době železné. Její počátky byly nejprve datovány do 8. století př. n. l., zatímco pozdější studie kladou hlavní pozůstatky nejdříve do 7. století. V té době asyrské záznamy jmenují edómské krále: kolem roku 673 př. n. l. svolal Asarhadón Qaush-gabriho, krále Edómu, spolu s Manasesem, králem Judska, a dalšími králi západu, aby přinesli stavební materiál pro jeho palác v Ninive."
    - "Genesis jmenuje Jobaba, syna Zerachova z Bosry, mezi králi, kteří kralovali v Edómu dříve, než kraloval nějaký král nad Izraelem. Pro proroky stojí Bosra za sám Edóm. Amos předpovídá oheň, „kterýžto zžíře paláce v Bozra“; Izajáš praví, že „obět zajisté bude míti Hospodin v Bozra“, a ptá se: „Kdož jest to, ješto se béře z Edom, v ubroceném rouše z Bozra“? Jeremjáš varuje, že „pustinou, útržkou, pouští a prokletím bude Bozra“ a že nepřítel přiletí jako orlice a roztáhne nad ní křídla."
    - "Kronika Nabonidova v poškozeném řádku uvádí, že babylónský král se utábořil proti Edómu ve svém třetím roce, 553/552 př. n. l., a zničení části Budovy A v 7. nebo 6. století může patřit k tomuto tažení. V 5. a 4. století př. n. l. byla západní polovina budovy přestavěna na starých základech, zatímco východní polovina ležela v troskách. Na počátku 4. století n. l. Eusebios rozlišoval Bosor, město Ezauovo v idumejských horách, o němž mluví Izajáš, od Bostry v Arábii."
  sv:
    - "Bosra, en av Edoms huvudstäder, identifieras vanligen med ruinerna vid Busayra (Buseira) i södra Jordanien, omkring 10 km söder om Tafila och cirka 50 km norr om Petra. Crystal-M. Bennett grävde ut platsen 1971–1980, och Piotr Bienkowski publicerade slutrapporten 2002. Hon blottade stora offentliga byggnader, bland dem Byggnad A, ett monumentalt komplex på över 2 300 m² vars gård anses höra till ett tempel eller ett palats."
    - "Den utgrävda staden hör till sen järnålder. Dess början daterades först till 700-talet f.Kr., medan senare studier placerar de huvudsakliga lämningarna inte tidigare än 600-talet. Under den tiden nämner assyriska källor kungar av Edom: omkring 673 f.Kr. kallade Esarhaddon Qaus-gabri, kung av Edom, tillsammans med Manasse, kung av Juda, och andra kungar i väst att föra byggmaterial till hans palats i Nineve."
    - "Första Mosebok nämner Jobab, Serachs son, från Bosra, bland de kungar som regerade i Edom innan någon kung regerade över Israel. För profeterna står Bosra för själva Edom. Amos förutsäger en eld som ”skall förtära Bosras palatser”; Jesaja säger att ”HERREN anställer ett offer i Bosra” och frågar: ”Vem är han som kommer från Edom, från Bosra i högröda kläder?” Jeremia varnar för att ”Bosra skall bliva ett föremål för häpnad och smälek” och att fienden skall sväva fram som en örn och breda ut sina vingar över det."
    - "Nabonidkrönikan låter, i en skadad rad, den babyloniske kungen slå läger mot Edom i sitt tredje år, 553/552 f.Kr., och förstörelsen av en del av Byggnad A på 600- eller 500-talet kan höra till det fälttåget. På 400- och 300-talen f.Kr. byggdes byggnadens västra hälft upp på de gamla grunderna medan den östra hälften låg i ruiner. I början av 300-talet e.Kr. skilde Eusebios Bosor, Esaus stad i Idumeens berg som Jesaja talar om, från Bostra i Arabien."
  nb:
    - "Bosra, en hovedby i Edom, identifiseres vanligvis med ruinene ved Busayra (Buseira) i Sør-Jordan, omtrent 10 km sør for Tafila og omkring 50 km nord for Petra. Crystal-M. Bennett gravde ut stedet mellom 1971 og 1980, og Piotr Bienkowski utgav sluttrapporten i 2002. Hun avdekket store offentlige bygninger, blant dem bygning A, et monumentalt kompleks på mer enn 2300 m² hvis gårdsplass regnes å tilhøre et tempel eller et palass."
    - "Den utgravde byen hører til sen jernalder. Dens begynnelse ble først datert til 700-tallet f.Kr., mens senere studier plasserer hovedrestene ikke tidligere enn 600-tallet. I den tiden nevner assyriske opptegnelser konger av Edom: omkring 673 f.Kr. innkalte Asarhaddon Qaush-gabri, kongen av Edom, sammen med Manasse, kongen av Juda, og andre konger i vest til å bringe byggematerialer til hans palass i Ninive."
    - "1. Mosebok nevner Jobab, Serahs sønn, fra Bosra blant kongene som regjerte i Edom før noen konge regjerte over Israel. For profetene står Bosra for selve Edom. Amos forutsier en ild som «skal fortære Bosras palasser»; Jesaja sier at «en offerslakting holder Herren i Bosra» og spør: «Hvem er han som kommer fra Edom, i røde klær fra Bosra». Jeremia advarer om at Bosra «skal bli til en forferdelse» og at fienden skal fare opp som en ørn og bre sine vinger ut over den."
    - "Nabonid-krøniken har i en skadet linje at den babylonske kongen la leir mot Edom i sitt tredje år, 553/552 f.Kr., og ødeleggelsen av en del av bygning A på 600- eller 500-tallet kan høre til dette felttoget. På 400- og 300-tallet f.Kr. ble den vestlige halvdelen av bygningen gjenoppbygd på de gamle grunnmurene mens den østlige halvdelen lå i ruiner. Tidlig på 300-tallet e.Kr. skilte Eusebius mellom Bosor, Esaus by i Idumeas åser som Jesaja taler om, og Bostra i Arabia."
  tl:
    - "Ang Bozra, isang pangunahing lungsod ng Edom, ay karaniwang kinikilala sa mga guho sa Busayra (Buseira) sa katimugang Jordan, mga 10 km sa timog ng Tafila at humigit-kumulang 50 km sa hilaga ng Petra. Hinukay ni Crystal-M. Bennett ang pook sa pagitan ng 1971 at 1980, at inilathala ni Piotr Bienkowski ang pinal na ulat noong 2002. Natagpuan niya ang malalaking pampublikong gusali, kabilang ang Gusali A, isang monumental na kompleks na higit sa 2,300 m² na ang bakuran ay inaakalang kabilang sa isang templo o palasyo."
    - "Ang nahukay na bayan ay mula sa huling Panahon ng Bakal. Una nang ipinetsa ang simula nito sa ika-8 siglo BK, ngunit inilalagay ng mas huling mga pag-aaral ang pangunahing labi nito nang hindi mas maaga sa ika-7. Sa panahong iyon pinangalanan ng mga talaan ng Asiria ang mga hari ng Edom: noong mga 673 BK ipinatawag ni Esar-hadon si Qaush-gabri, hari ng Edom, kasama si Manases, hari ng Juda, at iba pang hari sa kanluran upang magdala ng materyales sa pagtatayo para sa kaniyang palasyo sa Ninive."
    - "Pinangangalanan ng Genesis si Jobab na anak ni Zera ng Bozra sa mga haring naghari sa Edom bago naghari ang sinumang hari sa Israel. Para sa mga propeta, ang Bozra ay kumakatawan sa Edom mismo. Inihuhula ni Amos ang apoy na “susupukin niyaon ang mga palacio sa Bozra”; sinasabi ni Isaias na “may hain sa Panginoon sa Bosra” at nagtatanong, “Sino ito na nanggagaling sa Edom, na may mga kasuutang tinina mula sa Bosra?” Nagbababala si Jeremias na ang Bozra ay “magiging katigilan” at na lilipad ang kaaway tulad ng agila at ikakalat ang kaniyang mga pakpak sa ibabaw nito."
    - "Ang Kronika ni Nabonido, sa isang nasirang linya, ay nagsasabing humimpil ang hari ng Babilonia laban sa Edom sa ikatlong taon niya, 553/552 BK, at ang pagkawasak ng bahagi ng Gusali A noong ika-7 o ika-6 na siglo ay maaaring kabilang sa kampanyang iyon. Noong ika-5 at ika-4 na siglo BK, ang kanlurang kalahati ng gusali ay muling itinayo sa dating mga pundasyon samantalang ang silangang kalahati ay nanatiling guho. Maaga sa ika-4 na siglo AD, pinag-iba ni Eusebio ang Bosor, ang lungsod ni Esau sa mga burol ng Idumea na sinasabi ni Isaias, sa Bostra sa Arabia."
  da:
    - "Bosra, en af Edoms hovedbyer, identificeres sædvanligvis med ruinerne ved Busayra (Buseira) i det sydlige Jordan, cirka 10 km syd for Tafila og omkring 50 km nord for Petra. Crystal-M. Bennett udgravede stedet mellem 1971 og 1980, og Piotr Bienkowski udgav den endelige rapport i 2002. Hun afdækkede store offentlige bygninger, blandt dem Bygning A, et monumentalt kompleks på mere end 2.300 m², hvis gård antages at høre til et tempel eller et palads."
    - "Den udgravede by hører til sen jernalder. Dens begyndelse blev først dateret til 700-tallet f.Kr., mens senere undersøgelser placerer hovedresterne ikke tidligere end 600-tallet. I den tid nævner assyriske optegnelser konger af Edom: Omkring 673 f.Kr. indkaldte Esarhaddon Qaush-gabri, konge af Edom, sammen med Manasse, konge af Juda, og andre konger i vest for at bringe byggematerialer til hans palads i Nineve."
    - "1 Mosebog nævner Jobab, søn af Zerah fra Bosra, blandt de konger, der regerede i Edom, før nogen konge regerede over Israel. For profeterne står Bosra for selve Edom. Amos forudsiger en ild: »den skal fortære Bozras Paladser«; Esajas siger, at »Herren har Slagtoffer i Bozra«, og spørger: »Hvo er denne, som kommer fra Edom, i højrøde Klæder fra Bozra«? Jeremias advarer om, at »Bozra skal blive til Forfærdelse«, og at fjenden vil flyve som ørnen og brede sine vinger over den."
    - "Nabonid-krøniken lader i en beskadiget linje den babylonske konge slå lejr mod Edom i sit tredje år, 553/552 f.Kr., og ødelæggelsen af en del af Bygning A i 600- eller 500-tallet kan høre til det felttog. I 400- og 300-tallet f.Kr. blev bygningens vestlige halvdel genopbygget på de gamle fundamenter, mens den østlige halvdel lå i ruiner. I begyndelsen af 300-tallet e.Kr. skelnede Eusebios mellem Bosor, Esaus by i Idumæas bjerge, som Esajas taler om, og Bostra i Arabien."
  sr:
    - "Восор, један од главних градова Едома, обично се поистовећује с рушевинама у Бусајри у јужном Јордану, око 10 км јужно од Тафиле и око 50 км северно од Петре. Кристал М. Бенет ископавала је налазиште између 1971. и 1980, а Пјотр Бјенковски објавио је завршни извештај 2002. Она је открила велике јавне зграде, међу њима Зграду А, монументални комплекс од више од 2.300 м² чије се двориште сматра делом храма или палате."
    - "Ископани град припада касном гвозденом добу. Његови почеци најпре су датирани у 8. век п. н. е., док каснија проучавања главне остатке смештају не раније од 7. У то доба асирски записи именују едомске цареве: око 673. п. н. е. Есарадон је позвао Каус-габрија, цара едомског, заједно с Манасијом, царем јудејским, и другим царевима запада да донесу грађевински материјал за његову палату у Ниниви."
    - "Постање међу царевима који су владали у Едому пре него што је иједан цар владао над Израиљем наводи Јовава, сина Зариног од Восора. За пророке Восор стоји за сам Едом. Амос најављује огањ који „прождреће дворе у Восори“; Исаија каже да „Господ има жртву у Восору“ и пита: „Ко је оно што иде из Едома, из Восора, у црвеним хаљинама?“ Јеремија упозорава да ће Восор „бити пустош“ и да ће непријатељ долетети као орао и раширити крила над њим."
    - "Набонидова хроника, у једном оштећеном реду наводи да се вавилонски цар улогорио против Едома у својој трећој години, 553/552. п. н. е., и разарање дела Зграде А у 7. или 6. веку може припадати том походу. У 5. и 4. веку п. н. е. западна половина зграде обновљена је на старим темељима док је источна лежала у рушевинама. Почетком 4. века н. е. Јевсевије је разликовао Восор, град Исавов у брдима Идумеје о коме говори Исаија, од Бостре у Арабији."
  hu:
    - "Boszra, Edom egyik fő városa, a legtöbb vélemény szerint a dél-jordániai Busayra (Buseira) romjaival azonos, Tafilától mintegy 10 km-re délre és Petrától mintegy 50 km-re északra. Crystal-M. Bennett 1971 és 1980 között ásta a helyet, a végleges jelentést Piotr Bienkowski tette közzé 2002-ben. Nagy középületeket tárt fel, köztük az A épületet, egy több mint 2300 m²-es monumentális együttest, amelynek udvarát templomhoz vagy palotához tartozónak tartják."
    - "A feltárt város a késő vaskorhoz tartozik. Kezdeteit először a Kr. e. 8. századra keltezték, a későbbi tanulmányok azonban a fő maradványokat nem korábbra helyezik a 7. századnál. Ebben a korban asszír feljegyzések Edom királyait nevezik meg: Kr. e. 673 körül Asszarhaddon Qaush-gabrit, Edom királyát Manassé júdai királlyal és a nyugat más királyaival együtt idézte magához, hogy építőanyagot hozzanak ninivei palotájához."
    - "Mózes első könyve megnevezi Jóbábot, Zerah fiát Boszrából, azon királyok között, akik Edómban uralkodtak, mielőtt király uralkodott Izráel felett. A prófétáknál Boszra magát Edomot jelképezi. Ámós tüzet jövendöl: „az emészti majd meg Boczra palotáit”; Ézsaiás szerint „áldozatja lesz az Úrnak Boczrában”, és megkérdezi: „Ki ez, ki jő Edomból, veres ruhákban Boczrából?” Jeremiás szerint „útálattá és gyalázattá, pusztasággá és átokká lesz Boczra”, az ellenség pedig „feljő mint saskeselyű, és repül és szárnyait szétterjeszti Boczrán”."
    - "A Nabonidosz-krónika egy megrongálódott sorában a babiloni király uralkodása harmadik évében, Kr. e. 553/552-ben Edom ellen táborozik, és az A épület egy részének Kr. e. 7. vagy 6. századi pusztulása ehhez a hadjárathoz tartozhat. A Kr. e. 5. és 4. században az épület nyugati felét a régi alapokon újjáépítették, miközben a keleti fele romokban hevert. A 4. század elején Eusebius megkülönböztette Bosort, Ézsau városát Idumea hegyei között, amelyről Ézsaiás beszél, az arábiai Bostrától."
  fi:
    - "Bosra, yksi Edomin pääkaupungeista, tunnistetaan yleensä Busayran (Buseira) raunioiksi Etelä-Jordaniassa, noin 10 km Tafilasta etelään ja noin 50 km Petrasta pohjoiseen. Crystal-M. Bennett kaivoi paikkaa vuosina 1971–1980, ja Piotr Bienkowski julkaisi loppuraportin vuonna 2002. Bennett paljasti suuria julkisia rakennuksia, muun muassa Rakennus A:n, yli 2 300 m² laajuisen monumentaalisen kompleksin, jonka pihan katsotaan kuuluneen temppeliin tai palatsiin."
    - "Kaivettu kaupunki kuuluu myöhäiseen rautakauteen. Sen alkuja ajoitettiin ensin 700-luvulle eaa., kun taas myöhemmät tutkimukset sijoittavat pääjäänteet aikaisintaan 600-luvulle. Tuolloin assyrialaiset asiakirjat mainitsevat Edomin kuninkaita: noin vuonna 673 eaa. Esarhaddon kutsui Edomin kuninkaan Qaush-gabrin sekä Juudan kuninkaan Manassen ja muiden lännen kuninkaiden kanssa tuomaan rakennusaineita palatsiinsa Niniveen."
    - "1. Mooseksen kirja mainitsee Jobabin, Serahin pojan, Bosrasta niiden kuninkaiden joukossa, jotka hallitsivat Edomissa ennen kuin yksikään kuningas hallitsi Israelia. Profeetoille Bosra edustaa Edomia itseään. Aamos ennustaa tulen, joka ”kuluttaa Bosran palatsit”; Jesaja sanoo, että ”Herralla on uhri Bosrassa”, ja kysyy: ”Kuka tuolla tulee Edomista, tulipunaisissa vaatteissa Bosrasta?” Jeremia varoittaa, että ”Bosra on tuleva kauhistukseksi”, ja että vihollinen kohoaa kotkan kaltaisena ja liitää siivet levällään Bosraa kohti."
    - "Nabonidoksen kronikka kertoo vahingoittuneella rivillä babylonialaisen kuninkaan leiriytyneen Edomia vastaan kolmantena hallitusvuotenaan, 553/552 eaa., ja osan Rakennus A:sta tuho 600- tai 500-luvulla saattaa liittyä tähän sotaretkeen. 400- ja 300-luvulla eaa. rakennuksen läntinen puolisko rakennettiin uudelleen vanhoille perustuksille, kun itäinen puolisko oli raunioina. 300-luvun alussa jaa. Eusebios erotti toisistaan Bosorin, Esaun kaupungin Idumean vuoristossa, josta Jesaja puhuu, ja Arabian Bostran."
  vi:
    - "Bốt-ra, một thành chính của Ê-đôm, thường được đồng nhất với phế tích ở Busayra (Buseira) tại nam Jordan, cách Tafila khoảng 10 km về phía nam và cách Petra chừng 50 km về phía bắc. Crystal-M. Bennett khai quật địa điểm từ năm 1971 đến 1980, và Piotr Bienkowski công bố báo cáo cuối cùng năm 2002. Bà phát hiện các công trình công cộng lớn, trong đó có Tòa nhà A, một quần thể đồ sộ rộng hơn 2.300 m² có sân được cho là thuộc một đền thờ hoặc một cung điện."
    - "Thành được khai quật thuộc cuối thời đồ sắt. Phần khởi đầu của nó lúc đầu được định niên đại vào thế kỷ 8 TCN, trong khi các nghiên cứu sau đặt các di tích chính không sớm hơn thế kỷ 7. Trong thời ấy, các ghi chép A-si-ri nêu tên các vua của Ê-đôm: khoảng năm 673 TCN, Ê-sạt-ha-đôn triệu Qaush-gabri, vua Ê-đôm, cùng Ma-na-se, vua Giu-đa, và các vua khác ở phía tây, đem vật liệu xây dựng cho cung điện của ông tại Ni-ni-ve."
    - "Sách Sáng thế ký nêu tên Giô-báp con của Xê-rách ở Bốt-ra trong số các vua trị vì ở Ê-đôm trước khi có vua nào trị vì Y-sơ-ra-ên. Đối với các nhà tiên tri, Bốt-ra đại diện cho chính Ê-đôm. A-mốt báo trước một ngọn lửa “sẽ thiêu nuốt những đền đài của Bốt-ra”; Ê-sai nói rằng “có sự tế tự Đức Giê-hô-va ở Bốt-ra” và hỏi: “Đấng từ Ê-đôm đến, từ Bốt-ra tới, mặc áo nhuộm … là ai?” Giê-rê-mi cảnh báo rằng “Bốt-sa sẽ nên gở lạ” và rằng kẻ thù sẽ bay như chim ưng và sè cánh trên nó."
    - "Biên niên sử Nabonidus, trong một dòng bị hư hại, cho biết vua Ba-by-lôn đóng quân chống Ê-đôm vào năm thứ ba của mình, 553/552 TCN, và việc phá hủy một phần Tòa nhà A vào thế kỷ 7 hoặc 6 có thể thuộc về chiến dịch ấy. Vào các thế kỷ 5 và 4 TCN, nửa phía tây của tòa nhà được xây lại trên nền cũ trong khi nửa phía đông nằm đổ nát. Đầu thế kỷ 4, Eusebius phân biệt Bosor, thành của Ê-sau trong vùng đồi Y-đu-mê mà Ê-sai nói đến, với Bostra ở A-ra-bi."
  ro:
    - "Boțra, una dintre cetățile principale ale Edomului, este identificată de obicei cu ruinele de la Busayra (Buseira), în sudul Iordaniei, la circa 10 km sud de Tafila și la vreo 50 km nord de Petra. Crystal-M. Bennett a săpat locul între 1971 și 1980, iar Piotr Bienkowski a publicat raportul final în 2002. Ea a scos la iveală clădiri publice mari, printre care Clădirea A, un complex monumental de peste 2 300 m², a cărui curte este socotită ca aparținând unui templu sau unui palat."
    - "Cetatea săpată aparține sfârșitului epocii fierului. Începuturile ei au fost datate mai întâi în secolul al VIII-lea î.Hr., în timp ce studii mai noi așază rămășițele principale nu mai devreme de secolul al VII-lea. În acea epocă, înregistrările asiriene numesc regi ai Edomului: pe la 673 î.Hr., Esar-Hadon l-a chemat pe Qaush-gabri, regele Edomului, împreună cu Manase, regele lui Iuda, și cu alți regi din vest, să aducă materiale de construcție pentru palatul său de la Ninive."
    - "Geneza îl numește pe Iobab, fiul lui Zerah din Boțra, printre regii care au domnit în Edom înainte ca vreun rege să domnească peste Israel. Pentru profeți, Boțra stă pentru Edom însuși. Amos vestește un foc care va mistui palatele Boțrei; Isaia spune că „jertfă este lui Dumnezeu în Vosor” și întreabă: „Cine este acesta carele a venit din Edom? Roșala hainelor lui din Vosor?” Ieremia avertizează că Boțra va deveni o pustiire și că dușmanul va zbura ca vulturul și își va întinde aripile peste ea."
    - "Cronica lui Nabonid, într-un rând deteriorat, spune că regele babilonian a tăbărât împotriva Edomului în al treilea an al său, 553/552 î.Hr., iar distrugerea unei părți a Clădirii A în secolul al VII-lea sau al VI-lea poate ține de acea campanie. În secolele al V-lea și al IV-lea î.Hr., jumătatea de vest a clădirii a fost reconstruită pe vechile temelii, în timp ce jumătatea de est a rămas în ruină. La începutul secolului al IV-lea d.Hr., Eusebiu a deosebit Bosor, cetatea lui Esau din dealurile Idumeei, despre care vorbește Isaia, de Bostra din Arabia."
  bg:
    - "Восор, един от главните градове на Едом, обикновено се отъждествява с руините при Бусайра (Бусейра) в Южна Йордания, на около 10 км южно от Тафила и на около 50 км северно от Петра. Кристал-М. Бенет разкопавала мястото между 1971 и 1980 г., а Пьотр Биенковски публикувал окончателния доклад през 2002 г. Тя открила големи обществени сгради, сред тях Сграда А, монументален комплекс от над 2300 м², чийто двор се смята за част от храм или дворец."
    - "Разкопаният град принадлежи към късната желязна епоха. Началото му първоначално било датирано към VIII в. пр.н.е., а по-късни изследвания поставят основните останки не по-рано от VII в. През онази епоха асирийските записи назовават царе на Едом: около 673 г. пр.н.е. Асардан призовал Кауш-габри, цар на Едом, заедно с Манасия, цар на Юда, и други царе от запада да донесат строителни материали за двореца му в Ниневия."
    - "Битие назовава Йовав, сина на Зерах, от Восор сред царете, които царували в Едом, преди някой цар да царува над Израил. За пророците Восор олицетворява самия Едом. Амос предрича огън, който „ще изпояде палатите на Восора“; Исаия казва, че „Господ има жъртва у Восора“, и пита: „Кой е този що иде от Едом, С очервенени дрехи от Восора?“ Йеремия предупреждава, че Восор ще бъде „в запустение“ и че врагът ще полети като орел и ще разпростре крилата си над него."
    - "Хрониката на Набонид, в повреден ред, казва, че вавилонският цар се разположил на стан срещу Едом в третата си година, 553/552 г. пр.н.е., и разрушаването на част от Сграда А през VII или VI в. може да е свързано с този поход. През V и IV в. пр.н.е. западната половина на сградата била възстановена върху старите основи, докато източната лежала в руини. В началото на IV в. н.е. Евсевий разграничавал Восор, града на Исав в планините на Идумея, за който говори Исаия, от Бостра в Арабия."
