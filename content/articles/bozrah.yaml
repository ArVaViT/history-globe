# Overview article (ADR 0007). Mainstream facts only; Bozrah is given as the usual identification of Busayra; the dating of the earliest Iron Age town is named as disputed.
id: bozrah
place: a871210
title:
  en: "Bozrah"
  ru: "Восор"
  uk: "Боцра"
