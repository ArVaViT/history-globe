# Overview article (ADR 0007). Mainstream facts only; this is Jabneel on Judah's northern border (Jabneh, Jamnia, Yavne), not Jabneel of Naphtali; the Yavne academy is given as rabbinic tradition.
id: jabneel-judah
place: a7adb01
title:
  en: "Jabneel in Judah"
  ru: "Иавнеил в Иудее"
  uk: "Явнеїл в Юді"
  es: "Jabneel de Judá"
  pt: "Jabneel em Judá"
  de: "Jabneel in Juda"
  fr: "Jabnéel en Juda"
  pl: "Jabneel w Judzie"
  it: "Iabneel in Giuda"
  nl: "Jabneël in Juda"
  cs: "Jabneel v Judsku"
  sv: "Javneel i Juda"
  nb: "Jabneel i Juda"
  tl: "Jabneel sa Juda"
body:
  en:
    - "This Jabneel, later Jabneh, Jamnia and Yavne, lay on the coastal plain about 20 km south of Joppa and 7 km from the sea, near the mouth of the Sorek valley; it is not the Jabneel on the border of Naphtali. Joshua makes it the last point of Judah's northern border before the sea: the border “went out unto Jabneel; and the goings out of the border were at the sea”. In practice the area was Philistine, and Chronicles tells how Uzziah of Judah, in the eighth century BC, “warred against the Philistines, and brake down the wall of Gath, and the wall of Jabneh, and the wall of Ashdod”. A pit of the Iron Age found in 2002 on a small hill beside the mound held fragments of more than a hundred clay cult stands."
    - "In Hellenistic times Jamnia was a town with a harbour of its own; 2 Maccabees says Judas burned that harbour and fleet, and Philo tells how an altar set up there by Gentiles and torn down by Jews provoked Caligula's order to place his statue in the Temple. Herod left Jamnia to his sister Salome. After the destruction of Jerusalem in AD 70, rabbinic tradition says, Yohanan ben Zakkai founded at Yavne the academy where Jewish life was rebuilt around the study of the law."
    - "Today the mound, Tel Yavne, stands at the edge of the Israeli city of Yavne, with the coastal ruin of Yavne-Yam, the old harbour, to the west."
  ru:
    - "Этот Иавнеил, позднее Иавнея, Ямния и Явне, лежал на прибрежной равнине примерно в 20 км к югу от Иоппии и в 7 км от моря, у устья долины Сорек; это не Иавнеил на границе Неффалима. Книга Иисуса Навина делает его последней точкой северной границы Иуды перед морем: предел «доходит до Иавнеила, и оканчивается предел у моря». На деле эта земля была филистимской, и Паралипоменон рассказывает, как Озия, царь Иудейский, в VIII веке до н. э. «сразился с Филистимлянами, и разрушил стены Гефа и стены Иавнеи и стены Азота». В яме железного века, найденной в 2002 году на небольшом холме рядом с городищем, лежали обломки более чем сотни глиняных культовых подставок."
    - "В эллинистическое время Ямния была городом со своей гаванью; Вторая книга Маккавейская говорит, что Иуда сжёг эту гавань с кораблями, а Филон рассказывает, как жертвенник, поставленный там язычниками и разрушенный Иудеями, вызвал приказ Калигулы поставить его статую в храме. Ирод оставил Ямнию своей сестре Саломии. После разрушения Иерусалима в 70 г. н. э., по раввинскому преданию, Иоханан бен Заккай основал в Явне академию, где жизнь народа была заново устроена вокруг изучения закона."
    - "Сегодня холм Тель-Явне стоит на краю израильского города Явне, а к западу у моря лежат развалины Явне-Яма, древней гавани."
  uk:
    - "Цей Явнеїл, пізніша Явнея, Ямнія й Явне, лежав на прибережній рівнині приблизно за 20 км на південь від Яффи й за 7 км від моря, біля гирла долини Сорек; це не Явнеїл на межі Нефталима. Книга Ісуса Навина робить його останньою точкою північної межі Юди перед морем: межа «йде далїй аж до Ябнеїла та кінчиться край моря». На практиці ця місцевість була філістимською, і Хроніки розповідають, як Уззія Юдейський у VIII ст. до н. е. «воювався з Филистіями, й порозвалював мури Гету й мури Ябнеї та мури Азоту». Яма залізного віку, знайдена 2002 року на малому пагорбі біля городища, містила уламки понад сотні глиняних культових підставок."
    - "В елліністичні часи Ямнія була містом із власною гаванню; Друга книга Макавеїв каже, що Юда спалив ту гавань і флот, а Філон розповідає, як жертовник, поставлений там язичниками й зруйнований юдеями, спровокував наказ Калігули поставити його статую в храмі. Ірод залишив Ямнію своїй сестрі Саломеї. Після руйнації Єрусалима 70 р. н. е., за рабинічним переданням, Йоханан бен Закай заснував у Явне академію, де юдейське життя відбудовувалося навколо вивчення Закону."
    - "Сьогодні городище Тель-Явне стоїть на краю ізраїльського міста Явне, а прибережна руїна Явне-Ям, давня гавань, лежить на заході."
  es:
    - "Este Jabneel, llamado más tarde Jabneh, Jamnia y Yavne, se hallaba en la llanura costera, a unos 20 km al sur de Jope y a 7 km del mar, cerca de la desembocadura del valle de Sorek; no es el Jabneel de la frontera de Neftalí. Josué lo hace el último punto de la frontera norte de Judá antes del mar: el límite «sale á Jabneel: y sale este término á la mar». En la práctica la zona era filistea, y Crónicas cuenta cómo Uzías de Judá, en el siglo VIII a. C., «peleó contra los Filisteos, y rompió el muro de Gath, y el muro de Jabnia, y el muro de Asdod». Una fosa de la Edad del Hierro hallada en 2002 en una pequeña colina junto al montículo contenía fragmentos de más de un centenar de soportes cultuales de arcilla."
    - "En época helenística Jamnia era una población con puerto propio; 2 Macabeos dice que Judas quemó ese puerto y la flota, y Filón cuenta cómo un altar levantado allí por gentiles y derribado por judíos provocó la orden de Calígula de colocar su estatua en el Templo. Herodes dejó Jamnia a su hermana Salomé. Tras la destrucción de Jerusalén en el 70 d. C., dice la tradición rabínica, Yohanan ben Zakkai fundó en Yavne la academia donde se reconstruyó la vida judía en torno al estudio de la ley."
    - "Hoy el montículo, Tel Yavne, se alza en el borde de la ciudad israelí de Yavne, con la ruina costera de Yavne-Yam, el antiguo puerto, al oeste."
  pt:
    - "Esta Jabneel, depois Jabne, Jâmnia e Yavne, ficava na planície costeira a cerca de 20 km ao sul de Jope e 7 km do mar, perto da foz do vale de Soreque; não é a Jabneel na fronteira de Naftali. Josué faz dela o último ponto da fronteira norte de Judá antes do mar: a fronteira “saía em Jabneel; e o fim da fronteira era no mar”. Na prática a área era filisteia, e Crônicas conta como Uzias de Judá, no século VIII a.C., “lutou contra os filisteus, e derrubou o muro de Gate, o muro de Jabne e o muro de Asdode”. Uma fossa da Idade do Ferro achada em 2002 numa pequena colina junto ao monte continha fragmentos de mais de cem suportes de culto de barro."
    - "Em tempos helenísticos, Jâmnia era uma cidade com porto próprio; 2 Macabeus diz que Judas queimou esse porto e a frota, e Fílon conta como um altar erguido ali por gentios e derrubado por judeus provocou a ordem de Calígula de pôr sua estátua no Templo. Herodes deixou Jâmnia à sua irmã Salomé. Depois da destruição de Jerusalém em 70 d.C., diz a tradição rabínica, Yohanan ben Zakkai fundou em Yavne a academia onde a vida judaica foi reconstruída em torno do estudo da lei."
    - "Hoje o monte, Tel Yavne, fica na orla da cidade israelense de Yavne, com a ruína costeira de Yavne-Yam, o antigo porto, a oeste."
  de:
    - "Dieses Jabneel, später Jabne, Jamnia und Jawne, lag auf der Küstenebene etwa 20 km südlich von Joppe und 7 km vom Meer, nahe der Mündung des Soreck-Tals; es ist nicht das Jabneel an der Grenze Naftalis. Josua macht es zum letzten Punkt von Judas Nordgrenze vor dem Meer: Die Grenze „kommt heraus gen Jabneel, daß ihr Ende ist das Meer“. Tatsächlich war das Gebiet philistäisch, und die Chronik erzählt, wie Usija von Juda im 8. Jahrhundert v. Chr. „zog aus und stritt wider die Philister und riß nieder die Mauer zu Gath und die Mauer zu Jabne und die Mauer zu Asdod“. Eine eisenzeitliche Grube, 2002 auf einem kleinen Hügel neben dem Siedlungshügel gefunden, enthielt Bruchstücke von mehr als hundert Kultständern aus Ton."
    - "In hellenistischer Zeit war Jamnia eine Stadt mit eigenem Hafen; das zweite Makkabäerbuch sagt, Judas habe diesen Hafen und die Flotte verbrannt, und Philo erzählt, wie ein dort von Heiden errichteter und von Juden niedergerissener Altar Caligulas Befehl auslöste, seine Statue im Tempel aufzustellen. Herodes überließ Jamnia seiner Schwester Salome. Nach der Zerstörung Jerusalems im Jahr 70 n. Chr. gründete nach der rabbinischen Überlieferung Jochanan ben Sakkai in Jawne die Akademie, in der das jüdische Leben um das Studium des Gesetzes neu aufgebaut wurde."
    - "Heute steht der Hügel, Tel Jawne, am Rand der israelischen Stadt Jawne, mit der Küstenruine Jawne-Jam, dem alten Hafen, im Westen."
  fr:
    - "Ce Jabnéel, plus tard Jabné, Jamnia et Yavné, se trouvait sur la plaine côtière à environ 20 km au sud de Joppé et à 7 km de la mer, près de l’embouchure de la vallée de Sorek ; ce n’est pas le Jabnéel de la frontière de Nephthali. Josué en fait le dernier point de la frontière nord de Juda avant la mer : la limite « se prolongeait jusqu’à Jabneel, pour aboutir à la mer ». En pratique, la région était philistine, et les Chroniques racontent qu’Ozias de Juda, au VIIIe siècle av. J.-C., « se mit en guerre contre les Philistins ; et il abattit les murs de Gath, les murs de Jabné, et les murs d’Asdod ». Une fosse de l’âge du Fer trouvée en 2002 sur une petite colline à côté du tertre contenait des fragments de plus de cent supports cultuels en argile."
    - "À l’époque hellénistique, Jamnia était une ville dotée de son propre port ; 2 Maccabées dit que Judas brûla ce port et la flotte, et Philon raconte comment un autel dressé là par des païens et abattu par des Juifs provoqua l’ordre de Caligula de placer sa statue dans le Temple. Hérode laissa Jamnia à sa sœur Salomé. Après la destruction de Jérusalem en 70 apr. J.-C., dit la tradition rabbinique, Yohanan ben Zakkaï fonda à Yavné l’académie où la vie juive fut reconstruite autour de l’étude de la Loi."
    - "Aujourd’hui, le tertre, Tel Yavné, se dresse à la lisière de la ville israélienne de Yavné, avec la ruine côtière de Yavné-Yam, l’ancien port, à l’ouest."
  pl:
    - "Ten Jabneel, później Jabne, Jamnia i Jawne, leżał na nizinie nadmorskiej około 20 km na południe od Jafy i 7 km od morza, blisko ujścia doliny Sorek; nie jest to Jabneel na granicy Neftalego. Jozue czyni go ostatnim punktem północnej granicy Judy przed morzem: granica „stamtąd wychodzi do Jabneel, i kończą się te granica u morza”. W praktyce okolica była filistyńska, a Księgi Kronik opowiadają, jak Uzzjasz z Judy w VIII w. p.n.e. „walczył z Filistynami, i poburzył mury w Get, i mury w Jabnie, i mury w Azocie”. Jama z epoki żelaza znaleziona w 2002 r. na małym wzgórzu obok pagórka zawierała fragmenty ponad stu glinianych podstawek kultowych."
    - "W czasach hellenistycznych Jamnia było miastem z własnym portem; 2 Księga Machabejska mówi, że Juda spalił ten port i flotę, a Filon opowiada, jak ołtarz postawiony tam przez pogan i zburzony przez Żydów sprowokował rozkaz Kaliguli o umieszczeniu jego posągu w Świątyni. Herod zostawił Jamnię swojej siostrze Salome. Po zburzeniu Jerozolimy w 70 r. n.e., jak mówi tradycja rabiniczna, Jochanan ben Zakkaj założył w Jawne akademię, w której odbudowano życie żydowskie wokół studium Prawa."
    - "Dziś pagórek, Tel Jawne, stoi na skraju izraelskiego miasta Jawne, a na zachodzie leży nadmorska ruina Jawne Jam, dawny port."
  it:
    - "Questa Iabneel, poi Iabneh, Iamnia e Yavne, sorgeva sulla pianura costiera circa 20 km a sud di Giaffa e a 7 km dal mare, presso la foce della valle di Sorek; non è la Iabneel sul confine di Neftali. Giosuè ne fa l’ultimo punto del confine settentrionale di Giuda prima del mare: il confine «si prolungava fino a Iabneel, e facea capo al mare». In pratica la zona era filistea, e le Cronache raccontano come Ozia di Giuda, nell’VIII secolo a.C., «mosse guerra ai Filistei, abbatté le mura di Gath, le mura di Jabne e le mura di Asdod». Una fossa dell’età del Ferro trovata nel 2002 su una piccola altura accanto al tell conteneva frammenti di più di cento supporti cultuali di argilla."
    - "In età ellenistica Iamnia era una città con un porto proprio; 2 Maccabei dice che Giuda ne bruciò il porto e la flotta, e Filone racconta come un altare eretto là dai Gentili e abbattuto dai Giudei provocò l’ordine di Caligola di collocare la sua statua nel Tempio. Erode lasciò Iamnia a sua sorella Salome. Dopo la distruzione di Gerusalemme nel 70 d.C., dice la tradizione rabbinica, Yohanan ben Zakkai fondò a Yavne l’accademia dove la vita giudaica fu ricostruita attorno allo studio della Legge."
    - "Oggi il tell, Tel Yavne, sorge al margine della città israeliana di Yavne, con la rovina costiera di Yavne-Yam, l’antico porto, a ovest."
  nl:
    - "Dit Jabneël, later Jabne, Jamnia en Yavne, lag in de kustvlakte ongeveer 20 km ten zuiden van Joppe en 7 km van de zee, bij de monding van de Sorekvallei; het is niet het Jabneël aan de grens van Naftali. Jozua maakt het tot het laatste punt van Juda’s noordgrens vóór de zee: de grens liep “uitgaan te Jabneel; en de uitgangen dezer landpale zullen zijn naar de zee”. In de praktijk was het gebied Filistijns, en Kronieken vertelt hoe Uzzia van Juda in de 8e eeuw v.Chr. “krijgde tegen de Filistijnen, en brak den muur van Gath, en den muur van Jabne, en den muur van Asdod”. Een kuil uit de IJzertijd, in 2002 gevonden op een kleine heuvel naast de tell, bevatte fragmenten van meer dan honderd aarden cultusstandaards."
    - "In de hellenistische tijd was Jamnia een stad met een eigen haven; 2 Makkabeeën zegt dat Judas die haven en vloot in brand stak, en Philo vertelt hoe een daar door heidenen opgericht en door Joden omvergehaald altaar Caligula’s bevel uitlokte om zijn standbeeld in de tempel te plaatsen. Herodes liet Jamnia na aan zijn zuster Salome. Na de verwoesting van Jeruzalem in 70 n.Chr. stichtte Yohanan ben Zakkai volgens de rabbijnse overlevering te Yavne de academie waar het Joodse leven werd herbouwd rond de studie van de wet."
    - "Nu staat de tell, Tel Yavne, aan de rand van de Israëlische stad Yavne, met de kustruïne Yavne-Yam, de oude haven, in het westen."
  cs:
    - "Tento Jabneel, později Jabne, Jamnia a Javne, ležel na pobřežní rovině asi 20 km jižně od Joppe a 7 km od moře, poblíž ústí údolí Sorek; není to Jabneel na hranici Neftalího. Jozue z něj činí poslední bod judské severní hranice před mořem: hranice „táhne se do Jebnael, i dochází ta meze k moři“. Prakticky byla oblast pelištejská a Letopisy vyprávějí, jak Uzijáš Judský v 8. stol. př. n. l. „bojoval proti Filistinským, a probořil zed města Gát, a zed města Jabne, i zed města Azotu“. Jáma z doby železné nalezená roku 2002 na malém pahorku vedle návrší obsahovala zlomky více než sta hliněných kultovních podstavců."
    - "V helénistické době byla Jamnia městem s vlastním přístavem; Druhá kniha Makabejská praví, že Juda ten přístav a loďstvo spálil, a Filón vypráví, jak oltář tam postavený pohany a zbořený Židy vyvolal Caligulův rozkaz umístit v chrámu jeho sochu. Herodes nechal Jamnii své sestře Salome. Po zničení Jeruzaléma roku 70 n. l., praví rabínská tradice, založil Jochanan ben Zakkaj v Javne akademii, kde byl židovský život obnoven kolem studia Zákona."
    - "Dnes pahorek, Tel Javne, stojí na okraji izraelského města Javne, s pobřežní zříceninou Javne-Jam, starým přístavem, na západě."
  sv:
    - "Detta Javneel, senare Jabne, Jamnia och Yavne, låg på kustslätten omkring 20 km söder om Joppe och 7 km från havet, nära mynningen av Sorekdalen; det är inte Javneel vid Naftalis gräns. Josua gör det till sista punkten på Judas norra gräns före havet: gränsen gick ”därifrån ut till Jabneel; sedan gick gränsen ut vid havet”. I praktiken var trakten filisteisk, och Krönikeboken berättar hur Ussia av Juda på 700-talet f.Kr. ”stridde mot filistéerna och bröt ned Gats, Jabnes och Asdods murar”. En grop från järnåldern som hittades 2002 på en liten kulle intill tellen innehöll fragment av över hundra kultstativ av lera."
    - "Under hellenistisk tid var Jamnia en stad med egen hamn; Andra Mackabeerboken säger att Judas brände den hamnen och flottan, och Filon berättar hur ett altare som hedningar rest där och judar rivit ned föranledde Caligulas order att placera hans staty i templet. Herodes lämnade Jamnia åt sin syster Salome. Efter Jerusalems förstöring år 70 e.Kr. grundade, enligt rabbinsk tradition, Yohanan ben Zakkai i Yavne akademin där det judiska livet byggdes upp kring studiet av lagen."
    - "I dag står kullen, Tel Yavne, i kanten av den israeliska staden Yavne, med kustruinen Yavne-Yam, den gamla hamnen, i väster."
  nb:
    - "Denne Jabneel, senere Jabne, Jamnia og Yavne, lå på kystsletten omtrent 20 km sør for Jaffa og 7 km fra havet, nær munningen av Sorek-dalen; det er ikke Jabneel på Naftalis grense. Josva gjør den til det siste punktet på Judas nordgrense før havet: grensen «gikk frem til Jabne'el og endte ute ved havet». I praksis var området filistisk, og Krønikebøkene forteller hvordan Ussia av Juda, på 700-tallet f.Kr., «drog ut og stred mot filistrene og rev ned bymurene i Gat og Jabne og Asdod». En grop fra jernalderen funnet i 2002 på en liten høyde ved siden av haugen inneholdt fragmenter av mer enn hundre kultstativer av leire."
    - "I hellenistisk tid var Jamnia en by med egen havn; Andre Makkabeerbok sier at Judas brente den havnen og flåten, og Filon forteller hvordan et alter reist der av hedninger og revet ned av jøder fremprovoserte Caligulas ordre om å sette opp hans statue i tempelet. Herodes overlot Jamnia til sin søster Salome. Etter ødeleggelsen av Jerusalem i 70 e.Kr. grunnla, sier rabbinsk tradisjon, Yohanan ben Zakkai i Yavne akademiet der jødisk liv ble gjenoppbygd rundt studiet av loven."
    - "I dag ligger haugen, Tel Yavne, i kanten av den israelske byen Yavne, med kystruinen Yavne-Yam, den gamle havnen, mot vest."
  tl:
    - "Ang Jabneel na ito, kalaunan ay Jabneh, Jamnia at Yavne, ay nasa kapatagan sa baybayin mga 20 km sa timog ng Joppa at 7 km mula sa dagat, malapit sa bukana ng libis ng Sorek; hindi ito ang Jabneel sa hangganan ng Nephtali. Ginagawa ito ni Josue na huling punto ng hilagang hangganan ng Juda bago ang dagat: ang hangganan ay “palabas sa Jabneel; at ang mga labasan ng hangganan ay sa dagat”. Sa praktika Filisteo ang lugar, at isinasalaysay ng Mga Cronica kung paanong si Uzzias ng Juda, noong ika-8 siglo BK, ay “nakipagdigma laban sa mga Filisteo, at ibinagsak ang kuta ng Gath, at ang kuta ng Jabnia, at ang kuta ng Asdod”. Ang isang hukay ng Panahon ng Bakal na natagpuan noong 2002 sa maliit na burol sa tabi ng tell ay naglalaman ng mga piraso ng mahigit isang daang patungang putik ng pagsamba."
    - "Noong panahong Helenistiko ang Jamnia ay bayang may sariling daungan; sinasabi ng 2 Macabeo na sinunog ni Judas ang daungan at hukbong-dagat na iyon, at isinasalaysay ni Philo kung paanong ang dambanang itinayo roon ng mga Gentil at giniba ng mga Judio ay nagpasimula ng utos ni Caligula na ilagay ang kaniyang istatwa sa Templo. Iniwan ni Herodes ang Jamnia sa kaniyang kapatid na si Salome. Pagkatapos ng pagkawasak ng Jerusalem noong 70 AD, sabi ng tradisyong rabiniko, itinatag ni Yohanan ben Zakkai sa Yavne ang akademyang kung saan itinayong muli ang buhay Judio sa palibot ng pag-aaral ng kautusan."
    - "Ang burol, ang Tel Yavne, ay nakatayo ngayon sa gilid ng lungsod ng Yavne ng Israel, kasama ang guho sa baybayin ng Yavne-Yam, ang lumang daungan, sa kanluran."
scripture:
  - Josh.15.11
  - 2Chr.26.6
