body:
  en:
    - "Beth-arbel is known only from Hosea, as a town whose destruction was proverbial, and its site is disputed. One view places it east of the Jordan at Irbid in northern Jordan, the Arbela of the Decapolis: Eusebius knew a village Arbela across the Jordan in the district of Pella, and the city's coins of the late first century BC and early first century AD give the Greek name Arbela. The other view places it at Arbel in Galilee, west of the Sea of Galilee, the Arbela of later Jewish history. Medieval Jewish commentators such as Kimchi took “Beth-arbel” as the household of a man named Arbel rather than a town."
    - "Hosea warns Israel: “all thy fortresses shall be spoiled, as Shalman spoiled Beth-arbel in the day of battle: the mother was dashed in pieces upon her children.” Who Shalman was is also disputed. Many take the name as short for Shalmaneser, an Assyrian king: Shalmaneser III, IV or V have all been proposed, the last being the king who made Hoshea “his servant”. Eberhard Schrader proposed Salamanu king of Moab, who appears among the kings paying tribute to Tiglath-pileser III; a Moabite raid would point to the town east of the Jordan."
    - "Tell Irbid, the mound in the centre of Irbid, has been excavated within the modern city and shows occupation from the Early Bronze Age, a city wall of about 1300–1200 BC and settlement through the early Iron Age to about 800 BC. Irbid is today one of the largest cities of Jordan, on the northern edge of the Gilead highlands about 20 km south of the Syrian border."
  ru:
    - "Бет-Арбел известен только из книги Осии как город, разрушение которого вошло в поговорку, и его местоположение спорно. Одни помещают его к востоку от Иордана, в Ирбиде на севере Иордании, — Арбеле Декаполиса: Евсевий знал селение Арбела за Иорданом в округе Пеллы, а монеты города конца I в. до н. э. и начала I в. н. э. дают греческое имя Арбела. Другие помещают его в Арбеле в Галилее, к западу от Галилейского моря, — Арбеле позднейшей иудейской истории. Средневековые иудейские толкователи, например Кимхи, понимали «Бет-Арбел» как дом человека по имени Арбел, а не город."
    - "Осия предупреждает Израиль: «все твердыни твои будут разрушены, как Салман разрушил Бет-Арбел в день брани: мать была убита с детьми». Кто такой Салман, тоже спорно. Многие видят в имени сокращение от Салманассар, имени ассирийских царей: предлагали Салманассара III, IV или V, последний из которых сделал Осию «подвластным ему». Эберхард Шрадер предложил Саламану, царя Моава, который значится среди царей, плативших дань Тиглатпаласару III; набег Моава указывал бы на город к востоку от Иордана."
    - "Телль-Ирбид, холм в центре Ирбида, раскапывали внутри современного города; он показывает жизнь с эпохи ранней бронзы, городскую стену ок. 1300–1200 гг. до н. э. и поселение раннего железного века примерно до 800 г. до н. э. Ирбид сегодня — один из крупнейших городов Иордании, на северном краю Галаадского нагорья, примерно в 20 км к югу от сирийской границы."
  uk:
    - "Бет-Арбел відомий лише з Осії, як місто, чиє руйнування стало приказкою, і його місце спірне. Одна думка поміщає його на схід від Йордану в Ірбіді на півночі Йорданії, в Арбелі Десятимістя: Євсевій знав село Арбела за Йорданом в окрузі Пелли, а монети міста кінця I ст. до н. е. — початку I ст. н. е. дають грецьку назву Арбела. Інша думка поміщає його в Арбелі в Галілеї, на захід від Галілейського моря, Арбелі пізнішої єврейської історії. Середньовічні єврейські коментатори, як-от Кімхі, розуміли «Бет-Арбел» як дім людини на ім'я Арбел, а не місто."
    - "Осія застерігає Ізраїль: «усї твердинї твої порозпадаються, як Салман збурив був Бет-Арбель в день битви: матїр полягла з дїтьми.» Хто такий Салман, також спірно. Багато хто вважає це ім'я скороченням від Салманассар, ассирійського царя: пропонували Салманассара III, IV чи V, останнього — царя, якому «зробивсь Осія підневоленим йому». Еберхард Шрадер запропонував Саламана, царя Моаву, який з'являється серед царів, що платили данину Тіглатпаласарові III; моавітський набіг указував би на місто на схід від Йордану."
    - "Телль-Ірбід, пагорб у центрі Ірбіда, розкопаний у межах сучасного міста й виявляє заселення від раннього бронзового віку, міський мур близько 1300–1200 рр. до н. е. та поселення крізь ранню залізну добу до близько 800 р. до н. е. Нині Ірбід — одне з найбільших міст Йорданії, на північному краї нагір'я Гілеаду, приблизно за 20 км на південь від сирійського кордону."
  es:
    - "Bet-arbel solo se conoce por Oseas, como una ciudad cuya destrucción se hizo proverbial, y su emplazamiento es discutido. Una opinión la sitúa al este del Jordán, en Irbid, en el norte de Jordania, la Arbela de la Decápolis: Eusebio conocía una aldea Arbela al otro lado del Jordán, en el distrito de Pela, y las monedas de la ciudad de fines del siglo I a. C. y comienzos del I d. C. dan el nombre griego Arbela. La otra opinión la sitúa en Arbel, en Galilea, al oeste del mar de Galilea, la Arbela de la historia judía posterior. Comentaristas judíos medievales como Kimchi tomaron «Bet-arbel» como la casa de un hombre llamado Arbel y no como una ciudad."
    - "Oseas advierte a Israel: «todas tus fortalezas serán destruídas, como destruyó Salmán á Beth-arbel el día de la batalla: la madre fué arrojada sobre los hijos». Quién fue Salmán también es discutido. Muchos toman el nombre como abreviatura de Salmanasar, rey asirio: se han propuesto Salmanasar III, IV o V, este último el rey que hizo de Oseas «su siervo». Eberhard Schrader propuso a Salamanu, rey de Moab, que figura entre los reyes tributarios de Tiglat-pileser III; una incursión moabita apuntaría a la ciudad al este del Jordán."
    - "Tell Irbid, el montículo del centro de Irbid, ha sido excavado dentro de la ciudad moderna y muestra ocupación desde el Bronce Antiguo, una muralla urbana de hacia 1300–1200 a. C. y poblamiento durante la edad del Hierro inicial hasta cerca de 800 a. C. Irbid es hoy una de las mayores ciudades de Jordania, en el borde septentrional de las alturas de Galaad, a unos 20 km al sur de la frontera siria."
  pt:
    - "Bete-Arbel é conhecida apenas por Oseias, como uma cidade cuja destruição se tornou proverbial, e sua localização é disputada. Uma opinião a situa a leste do Jordão, em Irbid, no norte da Jordânia, a Arbela da Decápole: Eusébio conhecia uma aldeia Arbela do outro lado do Jordão, no distrito de Pela, e as moedas da cidade do final do século I a.C. e início do século I d.C. trazem o nome grego Arbela. A outra opinião a situa em Arbel, na Galileia, a oeste do mar da Galileia, a Arbela da história judaica posterior. Comentaristas judeus medievais como Kimchi entendiam “Bete-Arbel” como a casa de um homem chamado Arbel, e não como uma cidade."
    - "Oseias adverte Israel: “todas as suas fortalezas serão destruídas, como Salmã destruiu Bete-Arbel no dia da batalha. A mãe foi despedaçada junto com os seus filhos.” Quem foi Salmã também é disputado. Muitos tomam o nome como abreviação de Salmaneser, rei assírio: Salmaneser III, IV ou V foram todos propostos, sendo o último o rei que fez de Oseias, rei de Israel, “seu servo”. Eberhard Schrader propôs Salamanu, rei de Moabe, que figura entre os reis que pagavam tributo a Tiglate-Pileser III; uma incursão moabita apontaria para a cidade a leste do Jordão."
    - "Tell Irbid, o montículo no centro de Irbid, foi escavado dentro da cidade moderna e mostra ocupação desde a Idade do Bronze Antigo, uma muralha de cerca de 1300–1200 a.C. e povoamento durante o início da Idade do Ferro até cerca de 800 a.C. Irbid é hoje uma das maiores cidades da Jordânia, na borda norte das terras altas de Gileade, a cerca de 20 km ao sul da fronteira com a Síria."
  de:
    - "Bet-Arbel ist nur aus Hosea bekannt, als Stadt, deren Zerstörung sprichwörtlich war, und ihre Lage ist umstritten. Eine Ansicht setzt sie östlich des Jordan bei Irbid im Norden Jordaniens an, dem Arbela der Dekapolis: Eusebius kannte ein Dorf Arbela jenseits des Jordan im Gebiet von Pella, und die Münzen der Stadt vom späten ersten Jahrhundert v. Chr. und frühen ersten Jahrhundert n. Chr. tragen den griechischen Namen Arbela. Die andere Ansicht setzt sie nach Arbel in Galiläa, westlich des Sees Genezareth, dem Arbela der späteren jüdischen Geschichte. Mittelalterliche jüdische Ausleger wie Kimchi verstanden „Bet-Arbel“ als das Haus eines Mannes namens Arbel und nicht als Stadt."
    - "Hosea warnt Israel: „so soll sich ein Getümmel erheben in deinem Volk, daß alle deine Festen verstört werden, gleichwie Salman verstörte das Haus Arbeels zur Zeit des Streits, da die Mutter samt den Kindern zu Trümmern ging“. Wer Salman war, ist ebenfalls umstritten. Viele halten den Namen für die Kurzform von Salmanassar, einem assyrischen König: Salmanassar III., IV. und V. sind alle vorgeschlagen worden, der letzte als der König, dem Hosea untertan wurde. Eberhard Schrader schlug Salamanu, König von Moab, vor, der unter den Königen erscheint, die Tiglat-Pileser III. Tribut zahlten; ein moabitischer Überfall würde auf die Stadt östlich des Jordan deuten."
    - "Tell Irbid, der Hügel im Zentrum von Irbid, ist innerhalb der modernen Stadt ausgegraben worden und zeigt Besiedlung seit der Frühbronzezeit, eine Stadtmauer von etwa 1300–1200 v. Chr. und Siedlung durch die frühe Eisenzeit bis etwa 800 v. Chr. Irbid ist heute eine der größten Städte Jordaniens, am Nordrand des Berglandes von Gilead etwa 20 km südlich der syrischen Grenze."
  fr:
    - "Beth-Arbel n’est connue que par Osée, comme une ville dont la destruction était proverbiale, et son site est disputé. Une opinion la place à l’est du Jourdain, à Irbid, dans le nord de la Jordanie, l’Arbela de la Décapole : Eusèbe connaissait un village Arbela de l’autre côté du Jourdain, dans le district de Pella, et les monnaies de la ville, de la fin du Ier siècle av. J.-C. et du début du Ier siècle apr. J.-C., portent le nom grec Arbela. L’autre opinion la place à Arbel, en Galilée, à l’ouest de la mer de Galilée, l’Arbela de l’histoire juive postérieure. Des commentateurs juifs médiévaux comme Kimhi voyaient dans « Beth-Arbel » la maison d’un homme nommé Arbel plutôt qu’une ville."
    - "Osée avertit Israël : « toutes tes forteresses seront détruites, comme fut détruite Schalman Beth-Arbel, au jour de la guerre, où la mère fut écrasée avec les enfants. » Qui était Schalman est également disputé. Beaucoup y voient une abréviation de Salmanasar, roi d’Assyrie : Salmanasar III, IV ou V ont tous été proposés, ce dernier étant le roi à qui Osée, le dernier roi d’Israël, fut assujetti. Eberhard Schrader proposa Salamanu, roi de Moab, qui figure parmi les rois payant tribut à Tiglath-Piléser III ; un raid moabite désignerait la ville à l’est du Jourdain."
    - "Tell Irbid, la butte au centre d’Irbid, a été fouillée à l’intérieur de la ville moderne et montre une occupation depuis le Bronze ancien, un rempart d’environ 1300–1200 av. J.-C. et un habitat qui se poursuit à travers le début de l’âge du Fer jusque vers 800 av. J.-C. Irbid est aujourd’hui l’une des plus grandes villes de Jordanie, sur la bordure nord des hauteurs de Galaad, à environ 20 km au sud de la frontière syrienne."
  it:
    - "Bet-Arbel è nota solo da Osea, come una città la cui distruzione era proverbiale, e il suo sito è discusso. Una tesi la colloca a est del Giordano a Irbid, nella Giordania settentrionale, l’Arbela della Decapoli: Eusebio conosceva un villaggio Arbela oltre il Giordano nel distretto di Pella, e le monete della città della fine del I secolo a.C. e dell’inizio del I secolo d.C. portano il nome greco Arbela. L’altra la colloca ad Arbel in Galilea, a ovest del mare di Galilea, l’Arbela della storia ebraica successiva. Commentatori ebrei medievali come Kimchi intesero «Bet-Arbel» come la casa di un uomo di nome Arbel più che come una città."
    - "Osea ammonisce Israele: «tutte le tue fortezze saranno distrutte, come Salman distrusse Beth-arbel, il dì della battaglia, quando la madre fu schiacciata coi figliuoli». Anche chi fosse Salman è discusso. Molti intendono il nome come abbreviazione di Salmanàssar, un re assiro: sono stati proposti Salmanàssar III, IV o V, l’ultimo dei quali è il re cui Osea fu assoggettato. Eberhard Schrader propose Salamanu re di Moab, che compare tra i re tributari di Tiglat-Pileser III; un’incursione moabita rimanderebbe alla città a est del Giordano."
    - "Tell Irbid, il tell al centro di Irbid, è stato scavato all’interno della città moderna e mostra un’occupazione dall’antica età del Bronzo, una cinta muraria del 1300–1200 a.C. circa e un abitato per tutta la prima età del Ferro fino all’800 a.C. circa. Irbid è oggi una delle maggiori città della Giordania, sul margine settentrionale degli altipiani di Galaad, a circa 20 km a sud del confine siriano."
  nl:
    - "Beth-Arbel is alleen uit Hosea bekend, als een stad wier verwoesting spreekwoordelijk was, en de ligging is omstreden. Volgens de ene opvatting lag het ten oosten van de Jordaan bij Irbid in het noorden van Jordanië, het Arbela van de Dekapolis: Eusebius kende een dorp Arbela aan de overzijde van de Jordaan in het district Pella, en de munten van de stad uit de late eerste eeuw v.Chr. en de vroege eerste eeuw n.Chr. geven de Griekse naam Arbela. Volgens de andere opvatting lag het bij Arbel in Galilea, ten westen van het Meer van Galilea, het Arbela uit de latere Joodse geschiedenis. Middeleeuwse Joodse commentatoren als Kimchi vatten “Beth-Arbel” op als het huis van een man genaamd Arbel, niet als een stad."
    - "Hosea waarschuwt Israël: “al uw vestingen zullen verstoord worden, gelijk Salman Beth-Arbel verstoorde ten dage des krijgs; de moeder werd verpletterd met de zonen.” Wie Salman was, is eveneens omstreden. Velen beschouwen de naam als een verkorting van Salmaneser, een Assyrische koning: Salmaneser III, IV en V zijn allemaal voorgesteld, de laatste is de koning die Hosea “zijn knecht” maakte. Eberhard Schrader stelde Salamanu, koning van Moab, voor, die voorkomt onder de koningen die Tiglat-Pileser III schatting betaalden; een Moabitische strooptocht zou wijzen op de stad ten oosten van de Jordaan."
    - "Tell Irbid, de heuvel in het centrum van Irbid, is binnen de moderne stad opgegraven en toont bewoning vanaf de vroege bronstijd, een stadsmuur van ongeveer 1300–1200 v.Chr. en bewoning door de vroege ijzertijd tot ongeveer 800 v.Chr. Irbid is tegenwoordig een van de grootste steden van Jordanië, aan de noordrand van het bergland van Gilead, ongeveer 20 km ten zuiden van de Syrische grens."
  pl:
    - "Bet-Arbel jest znane tylko z Księgi Ozeasza, jako miasto, którego zburzenie stało się przysłowiowe, a jego położenie jest sporne. Jedno stanowisko umieszcza je na wschód od Jordanu w Irbidzie w północnej Jordanii, czyli w Arbeli Dekapolu: Euzebiusz znał wieś Arbela za Jordanem w okręgu Pelli, a monety tego miasta z końca I w. p.n.e. i początku I w. n.e. noszą grecką nazwę Arbela. Drugie stanowisko umieszcza je w Arbel w Galilei, na zachód od Jeziora Galilejskiego, w Arbeli późniejszych dziejów żydowskich. Średniowieczni komentatorzy żydowscy, jak Kimchi, uważali „Bet-Arbel” za dom człowieka o imieniu Arbel, a nie za miasto."
    - "Ozeasz ostrzega Izraela: „wszystkie zamki twoje poburzone będą, tak jako poburzył Salman Bet Arbel w dzień bitwy; matki z synami roztrącone będą”. Kim był Salman, również jest sporne. Wielu uważa to imię za skrót od Salmanasara, króla asyryjskiego: proponowano Salmanasara III, IV lub V, a ostatni z nich to król, któremu Ozeasz stał się „niewolnikiem jego”. Eberhard Schrader zaproponował Salamanu, króla Moabu, który znajduje się wśród królów płacących daninę Tiglat-Pileserowi III; najazd moabicki wskazywałby na miasto na wschód od Jordanu."
    - "Tell Irbid, wzgórze w centrum Irbidu, zostało zbadane w obrębie współczesnego miasta i wykazuje osadnictwo od wczesnego brązu, mur miejski z około 1300-1200 p.n.e. oraz zasiedlenie przez wczesną epokę żelaza aż do około 800 p.n.e. Irbid jest dziś jednym z największych miast Jordanii, na północnym skraju wyżyn Gileadu, około 20 km na południe od granicy syryjskiej."
  cs:
    - "Bét-arbel je známo jen z Ozeáše jako město, jehož zkáza se stala příslovečnou, a jeho poloha je sporná. Jeden názor je klade východně od Jordánu k Irbidu v severním Jordánsku, k Arbele Dekapole: Eusebius znal vesnici Arbela za Jordánem v okrese Pella a mince města z konce prvního století př. n. l. a počátku prvního století n. l. uvádějí řecké jméno Arbela. Druhý názor je klade k Arbelu v Galileji, západně od Galilejského jezera, k Arbele pozdějších židovských dějin. Středověcí židovští komentátoři, například Kimchi, chápali „Bét-arbel“ jako rod muže jménem Arbel, a ne jako město."
    - "Ozeáš varuje Izrael: „i každá pevnost tvá zpuštěna bude, tak jako zpustil Salman Bet Arbel v den boje; matky s syny rozrážíny budou.“ Kdo byl Salman, je také sporné. Mnozí pokládají jméno za zkratku Salmanasara, asyrského krále: navrhován byl Salmanasar III., IV. i V., poslední z nich byl králem, který učinil Hóšeu „služebníkem jeho“. Eberhard Schrader navrhl Salamana, krále Moábu, který se objevuje mezi králi platícími daň Tiglatpilesarovi III.; moábský nájezd by ukazoval na město východně od Jordánu."
    - "Tell Irbid, pahorek ve středu Irbidu, byl zkoumán uvnitř dnešního města a vykazuje osídlení od rané doby bronzové, městskou hradbu z doby kolem 1300–1200 př. n. l. a sídliště přes starší dobu železnou až do doby kolem 800 př. n. l. Irbid je dnes jedním z největších měst Jordánska, na severním okraji gileadské vysočiny asi 20 km jižně od syrské hranice."
  sv:
    - "Bet-Arbel är känt bara från Hosea, som en stad vars förstörelse var ordspråksmässig, och dess plats är omstridd. Ett synsätt placerar den öster om Jordan vid Irbid i norra Jordanien, Dekapolis’ Arbela: Eusebios kände en by Arbela på andra sidan Jordan i Pellas distrikt, och stadens mynt från slutet av första århundradet f.Kr. och början av första århundradet e.Kr. ger det grekiska namnet Arbela. Det andra synsättet placerar den vid Arbel i Galileen, väster om Galileiska sjön, den senare judiska historiens Arbela. Medeltida judiska kommentatorer som Kimchi tog ”Bet-Arbel” som hushållet åt en man vid namn Arbel snarare än en stad."
    - "Hosea varnar Israel: ”alla edra fästen skola ödeläggas, såsom Bet-Arbel ödelades av Salman på stridens dag, då man krossade både mödrar och barn”. Vem Salman var är också omstritt. Många tar namnet som en förkortning av Salmanassar, en assyrisk kung: Salmanassar III, IV eller V har alla föreslagits, den sistnämnde var den kung som fick Hosea att ”bliva honom underdånig”. Eberhard Schrader föreslog Salamanu, Moabs kung, som förekommer bland de kungar som betalade tribut till Tiglat-Pileser III; ett moabitiskt plundringståg skulle peka på staden öster om Jordan."
    - "Tell Irbid, kullen i Irbids centrum, har grävts ut inne i den moderna staden och visar bosättning från äldre bronsåldern, en stadsmur från omkring 1300–1200 f.Kr. och bebyggelse genom äldre järnåldern till omkring 800 f.Kr. Irbid är i dag en av Jordaniens största städer, vid norra kanten av Gileads högland omkring 20 km söder om den syriska gränsen."
  nb:
    - "Bet-Arbel er bare kjent fra Hosea, som en by hvis ødeleggelse var ordspråklig, og stedet er omstridt. Ett syn plasserer den øst for Jordan ved Irbid i Nord-Jordan, Dekapolis' Arbela: Eusebius kjente en landsby Arbela hinsides Jordan i Pella-distriktet, og byens mynter fra slutten av det første århundre f.Kr. og begynnelsen av det første århundre e.Kr. gir det greske navnet Arbela. Det andre synet plasserer den ved Arbel i Galilea, vest for Galileasjøen, den senere jødiske historiens Arbela. Middelalderens jødiske kommentatorer som Kimchi tok «Bet-Arbel» som husstanden til en mann ved navn Arbel snarere enn en by."
    - "Hosea advarer Israel: «alle dine festninger skal ødelegges, likesom Salman ødela Bet-Arbel på stridens dag, da både mor og barn blev knust.» Hvem Salman var, er også omstridt. Mange tar navnet som en forkortelse for Salmanassar, en assyrisk konge: Salmanassar III, IV eller V er alle foreslått, den siste som kongen som gjorde Hosea «til sin tjener». Eberhard Schrader foreslo Salamanu, konge av Moab, som opptrer blant kongene som betalte tributt til Tiglat-Pileser III; et moabittisk raid ville peke på byen øst for Jordan."
    - "Tell Irbid, tellen i sentrum av Irbid, er gravd ut innenfor den moderne byen og viser bosetning fra eldre bronsealder, en bymur fra omkring 1300–1200 f.Kr. og bosetning gjennom tidlig jernalder til omkring 800 f.Kr. Irbid er i dag en av Jordans største byer, i nordkanten av Gilead-høylandet omtrent 20 km sør for den syriske grensen."
  tl:
    - "Ang Beth-arbel ay kilala lamang mula kay Oseas, bilang bayang ang pagkawasak ay naging kasabihan, at pinagtatalunan ang lugar nito. Inilalagay ito ng isang pananaw sa silangan ng Jordan sa Irbid sa hilagang Jordan, ang Arbela ng Decapolis: kilala ni Eusebio ang nayong Arbela sa kabila ng Jordan sa distrito ng Pella, at ibinibigay ng mga barya ng lungsod noong huling bahagi ng ika-1 siglo BK at maagang ika-1 siglo AD ang pangalang Griyego na Arbela. Inilalagay ito ng ibang pananaw sa Arbel sa Galilea, sa kanluran ng Dagat ng Galilea, ang Arbela ng kalaunang kasaysayang Judio. Itinuring ng mga komentaristang Judio noong Gitnang Panahon, gaya ni Kimchi, ang “Beth-arbel” na sambahayan ng taong nagngangalang Arbel sa halip na bayan."
    - "Binabalaan ni Oseas ang Israel: “lahat ng iyong mga katibayan ay magigiba, na gaya ni Salman na gumiba sa Beth-arbel sa kaarawan ng pagbabaka: ang ina ay pinaglurayluray na kasama ng kaniyang mga anak.” Pinagtatalunan din kung sino si Salman. Itinuturing ng marami ang pangalan na maikling Salmanasar, haring Asirio: iminungkahi si Salmanasar III, IV o V, ang huli ang haring gumawa kay Oseas na “naging kaniyang lingkod”. Iminungkahi ni Eberhard Schrader si Salamanu, hari ng Moab, na lumilitaw sa mga haring nagbabayad ng tributo kay Tiglath-pileser III; ang pagsalakay ng Moabita ay tutukoy sa bayan sa silangan ng Jordan."
    - "Ang Tell Irbid, ang burol sa gitna ng Irbid, ay nahukay sa loob ng makabagong lungsod at nagpapakita ng paninirahan mula sa Maagang Panahon ng Tanso, pader ng lungsod mula mga 1300–1200 BK at paninirahan sa buong maagang Panahon ng Bakal hanggang mga 800 BK. Ang Irbid ay isa sa pinakamalalaking lungsod ng Jordan ngayon, sa hilagang gilid ng kabundukan ng Gilead mga 20 km sa timog ng hangganan ng Siria."
  da:
    - "Bet-Arbel er kun kendt fra Hoseas, som en by, hvis ødelæggelse var mundheld, og dens sted er omstridt. Ét synspunkt placerer den øst for Jordan ved Irbid i det nordlige Jordan, Dekapolis' Arbela: Eusebius kendte en landsby Arbela hinsides Jordan i Pellas distrikt, og byens mønter fra slutningen af 1. århundrede f.Kr. og begyndelsen af 1. århundrede e.Kr. har det græske navn Arbela. Det andet synspunkt placerer den ved Arbel i Galilæa, vest for Genesaret Sø, den senere jødiske histories Arbela. Middelalderlige jødiske kommentatorer som Kimhi tog »Bet-Arbel« for en mands slægt ved navn Arbel snarere end en by."
    - "Hoseas advarer Israel: »alle dine Fæstninger skulle forstyrres, ligesom Salman forstyrrede Beth-Arbeel paa Krigens Dag; Moderen blev knust tillige med Børnene«. Hvem Salman var, er også omstridt. Mange tager navnet for en kortform af Salmanassar, en assyrisk konge: Salmanassar 3., 4. eller 5. er alle foreslået, den sidste var kongen, der gjorde Hosjea til »sin Tjener«. Eberhard Schrader foreslog Salamanu, Moabs konge, der optræder blandt de konger, som betalte Tiglat-Pileser 3. tribut; et moabitisk plyndringstog ville pege på byen øst for Jordan."
    - "Tell Irbid, tellen i midten af Irbid, er udgravet inden for den moderne by og viser bosættelse fra tidlig bronzealder, en bymur fra omkring 1300–1200 f.Kr. og bosættelse gennem tidlig jernalder til omkring 800 f.Kr. Irbid er i dag en af Jordans største byer, ved nordkanten af Gileads højland omkring 20 km syd for den syriske grænse."
  sr:
    - "Вет-Арвел је познат само из Осије, као град чије је разарање било пословично, а његово налазиште је спорно. Једно гледиште га смешта источно од Јордана у Ирбид у северном Јордану, Арбела Декаполиса: Јевсевије је знао село Арбелу с оне стране Јордана у округу Пеле, а новац града с краја 1. века п. н. е. и почетка 1. века н. е. даје грчко име Арбела. Друго гледиште га смешта у Арбел у Галилеји, западно од Галилејског мора, Арбелу касније јеврејске историје. Средњовековни јеврејски тумачи као Кимхи узимали су „Вет-Арвел“ као домаћинство човека по имену Арбел пре него град."
    - "Осија упозорава Израиља: „сви ће се градови твоји раскопати као што Салман раскопа Вет-Арвел кад беше рат, мајка би размрскана са синовима“. Ко је био Салман, такође је спорно. Многи узимају име као скраћеницу за Салманасар, асирског краља: предлагани су Салманасар III, IV или V, овај последњи краљ због кога се за Осију каже: „Осија му поста слуга“. Еберхард Шрадер је предложио Саламану, краља Моава, који се јавља међу краљевима што плаћају данак Теглат-Феласару III; моавски упад упућивао би на град источно од Јордана."
    - "Тел Ирбид, хумка у средишту Ирбида, ископаван је унутар савременог града и показује насељеност од раног бронзаног доба, градски зид из око 1300–1200. п. н. е. и насеље кроз рано гвоздено доба до око 800. п. н. е. Ирбид је данас један од највећих градова Јордана, на северном ободу горја Галада око 20 км јужно од сиријске границе."
