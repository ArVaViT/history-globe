# Overview article (ADR 0007). Both the site (Irbid in Jordan or Arbel in Galilee) and the identity of Shalman are disputed; the text names the options without choosing.
id: beth-arbel
place: a2da675
title:
  en: "Beth-arbel"
  ru: "Бет-Арбел"
  uk: "Бет-Арбел"
  es: "Bet-arbel"
  pt: "Bete-Arbel"
  de: "Bet-Arbel"
  fr: "Beth-Arbel"
