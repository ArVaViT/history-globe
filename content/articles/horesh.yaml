# Overview article (ADR 0007). Mainstream facts only; the Synodal Bible renders the name as a common noun, which is said; the identification with Khirbet Khureisa rests on the name and is said so.
id: horesh
place: a23db8d
title:
  en: "Horesh"
  ru: "Хореш"
  uk: "Хореш"
  es: "Horés"
  pt: "Horesa"
  de: "Horesch"
  fr: "Horesch"
  pl: "Choresz"
  it: "Choresh"
  nl: "Choresj"
  cs: "Choreš"
  sv: "Horesh"
  nb: "Horesj"
  tl: "Horesh"
  da: "Horesj"
body:
  en:
    - "Horesh is the place in the wilderness of Ziph where David hid from Saul and where Jonathan came to him for the last time. The Hebrew word means a wood or thicket, and the older translations took it so: the King James Bible says David “was in the wilderness of Ziph in a wood”, and the Russian Synodal Bible likewise has “in the forest”. Most modern translations and commentators read it as a place name, Horesh, since the Judean wilderness south of Hebron is bare, and since the Ziphites tell Saul that David hides “in strong holds in the wood, in the hill of Hachilah”, as if naming a locality. On that reading Horesh is usually identified with Khirbet Khureisa, a ruin about 3 km south of Tell Zif, the ancient Ziph, on the edge of the wilderness that drops toward the Dead Sea; the identification rests on the name, and nothing has been dug there."
    - "The story is told in one chapter. David, having saved Keilah and left it, “abode in the wilderness in strong holds”, and Saul sought him every day. “And Jonathan Saul's son arose, and went to David into the wood, and strengthened his hand in God”, telling him, “thou shalt be king over Israel, and I shall be next unto thee; and that also Saul my father knoweth”. The two made a covenant before the Lord, “and David abode in the wood, and Jonathan went to his house”; they never met again. Then the Ziphites went up to Saul at Gibeah to betray the hiding place, and David slipped away south to the wilderness of Maon."
    - "The ground today is the southern Hebron hills in the West Bank, east of the town of Yatta, where the last fields give way to the desert; Khirbet Khureisa is a scatter of ruins and caves among the terraces."
  ru:
    - "Хореш — место в пустыне Зиф, где Давид скрывался от Саула и куда Ионафан пришёл к нему в последний раз. Еврейское слово значит лес или чаща, и старые переводы так его и поняли: Синодальная Библия говорит, что Давид «был в пустыне Зиф в лесу», и Библия короля Иакова тоже даёт «в лесу». Большинство новых переводов и толкователей читает его как имя места, Хореш, ведь Иудейская пустыня к югу от Хеврона гола, а Зифеи говорят Саулу, что Давид скрывается «в неприступных местах, в лесу, на холме Гахила», словно называя местность. При таком чтении Хореш обычно отождествляют с Хирбет-Хурейсе, развалинами примерно в 3 км к югу от Телль-Зифа, древнего Зифа, на краю пустыни, спускающейся к Мёртвому морю; отождествление держится на имени, и раскопок там не было."
    - "Рассказ умещается в одну главу. Давид, спасший Кеиль и ушедший оттуда, «пребывал в пустыне в неприступных местах», и Саул искал его всякий день. «И встал Ионафан, сын Саула, и пришел к Давиду в лес, и укрепил его упованием на Бога», сказав ему: «ты будешь царствовать над Израилем, а я буду вторым по тебе; и Саул, отец мой, знает это». Они заключили завет пред лицом Господа, «и Давид остался в лесу, а Ионафан пошел в дом свой»; больше они не виделись. Затем Зифеи пришли к Саулу в Гиву выдать убежище, и Давид ускользнул на юг, в пустыню Маон."
    - "Сегодня это южные Хевронские горы на Западном берегу, к востоку от города Ятта, где последние поля переходят в пустыню; Хирбет-Хурейсе — россыпь развалин и пещер среди террас."
  uk:
    - "Хореш — місце в пустелі Зіф, де Давид ховався від Саула і куди Йонатан прийшов до нього востаннє. Давньоєврейське слово означає ліс або гайок, і давніші переклади розуміли його так: Біблія короля Якова каже, що Давид був «у пустинї Зиф у лїсї», а російська Синодальна Біблія так само має «в лесу». Більшість сучасних перекладів і коментаторів читають це як назву місця, Хореш, бо Юдейська пустеля на південь від Хеврона гола, і бо зифеї кажуть Саулу, що Давид ховається «по неприступних місцях, в лїсї, на верху гори Гахила», наче називаючи місцевість. За цим прочитанням Хореш зазвичай ототожнюють із Хірбет-Хурейсою, руїною приблизно за 3 км на південь від Телль-Зіфа, давнього Зіфа, на краю пустелі, що спадає до Мертвого моря; ототожнення спирається на назву, і там нічого не розкопували."
    - "Історія розказана в одному розділі. Давид, урятувавши Кеїлу й залишивши її, «державсь у пустинї на неприступних місцях», а Саул шукав його щодня. «Син же Саулів Йонатан вибравсь та й прийшов до Давида в лїс і укріпив його надїєю на Бога», кажучи йому: «ти будеш царем над Ізраїлем, а я буду другим по тобі; се знає й панотець мій Саул». Вони склали умову перед Господом, «і оставсь Давид у лїсї, а Йонатан пійшов додому»; більше вони не зустрілися. Потім зифеї пішли до Саула в Гіву, щоб видати схованку, і Давид пішов на південь до пустелі Маон."
    - "Ця місцевість сьогодні — південні хевронські пагорби Західного берега, на схід від міста Ятта, де останні поля поступаються пустелі; Хірбет-Хурейса — розсип руїн і печер серед терас."
  es:
    - "Horés es el lugar del desierto de Zif donde David se ocultó de Saúl y Jonatán vino a verlo por última vez. La palabra hebrea significa bosque o matorral, y las traducciones antiguas la tomaron así: la versión del rey Jacobo (King James) dice que David estaba «en el bosque en el desierto de Ziph», y la Biblia sinodal rusa pone igualmente «en el bosque». La mayoría de las traducciones y comentaristas modernos la leen como nombre de lugar, Horés, pues el desierto de Judá al sur de Hebrón es árido y los zifeos dicen a Saúl que David se esconde «en las peñas del bosque, en el collado de Hachîla», como nombrando una localidad. Con esa lectura Horés suele identificarse con Khirbet Khureisa, una ruina a unos 3 km al sur de Tell Zif, la antigua Zif, en el borde del desierto que desciende al mar Muerto; la identificación se apoya en el nombre, y allí no se ha excavado nada."
    - "La historia se cuenta en un solo capítulo. David, tras salvar Keila y dejarla, «se estaba en el desierto en peñas», y Saúl lo buscaba cada día. «Se levantó Jonathán hijo de Saúl, y vino á David en el bosque, y confortó su mano en Dios», diciéndole: «tú reinarás sobre Israel, y yo seré segundo después de ti; y aun Saúl mi padre así lo sabe». Los dos hicieron alianza delante del Señor, «y David se quedó en el bosque, y Jonathán se volvió á su casa»; no volvieron a encontrarse. Entonces los zifeos subieron a Saúl, a Gabaa, para delatar el escondite, y David se escabulló hacia el sur, al desierto de Maón."
    - "El terreno es hoy las colinas del sur de Hebrón, en Cisjordania, al este de la ciudad de Yatta, donde los últimos campos dan paso al desierto; Khirbet Khureisa es un conjunto disperso de ruinas y cuevas entre las terrazas."
  pt:
    - "Horesa é o lugar no deserto de Zife onde Davi se escondeu de Saul e onde Jônatas veio a ele pela última vez. A palavra hebraica significa bosque ou matagal, e as traduções mais antigas a entenderam assim: a Versão King James diz que Davi estava no deserto de Zife “num bosque”, e a Bíblia Sinodal russa também tem “na floresta”. A maioria das traduções modernas e dos comentaristas a lê como nome de lugar, Horesa, já que o deserto da Judeia ao sul de Hebrom é nu, e já que os zifeus dizem a Saul que Davi se esconde “nas fortalezas de Horesa, na colina de Haquila”, como se nomeassem uma localidade. Nessa leitura, Horesa é usualmente identificada com Khirbet Khureisa, uma ruína a cerca de 3 km ao sul de Tell Zif, a antiga Zife, na orla do deserto que desce para o mar Morto; a identificação repousa no nome, e nada foi escavado ali."
    - "A história é contada num só capítulo. Davi, tendo salvado Queila e a deixado, “permaneceu no deserto, em fortalezas”, e Saul o procurava todos os dias. “Jônatas, filho de Saul, levantou-se e foi até Davi, em Horesa, e fortaleceu a confiança dele em Deus”, dizendo-lhe: “você será rei sobre Israel, e eu serei o segundo depois de você; e Saul, meu pai, também sabe disso”. Os dois fizeram uma aliança perante o Senhor, e “Davi ficou em Horesa, e Jônatas foi para a sua casa”; nunca mais se encontraram. Então os zifeus subiram a Saul, em Gibeá, para trair o esconderijo, e Davi escapou para o sul, para o deserto de Maom."
    - "O terreno é hoje as colinas de Hebrom do sul, na Cisjordânia, a leste da cidade de Yatta, onde os últimos campos cedem ao deserto; Khirbet Khureisa é uma dispersão de ruínas e cavernas entre os terraços."
  de:
    - "Horesch ist der Ort in der Wüste Sif, wo David sich vor Saul verbarg und Jonatan zum letzten Mal zu ihm kam. Das hebräische Wort bedeutet Wald oder Dickicht, und die älteren Übersetzungen fassten es so auf: Luther hat David „in der Wüste Siph, in der Heide“, die King-James-Bibel in einem Wald, die russische Synodalübersetzung ebenfalls im Wald. Die meisten modernen Übersetzungen und Kommentatoren lesen es als Ortsnamen Horesch, da die judäische Wüste südlich von Hebron kahl ist und die Sifiter Saul sagen, David sei „an sicherem Ort in der Heide, auf dem Hügel Hachila“, als nennten sie eine Örtlichkeit. So gelesen wird Horesch meist mit Chirbet Churaisa gleichgesetzt, einer Ruine etwa 3 km südlich von Tell Zif, dem antiken Sif, am Rand der Wüste, die zum Toten Meer abfällt; die Gleichsetzung beruht auf dem Namen, und nichts ist dort ausgegraben."
    - "Die Geschichte steht in einem Kapitel. David, der Keïla gerettet und verlassen hatte, „blieb in der Wüste verborgen“, und Saul suchte ihn jeden Tag. „Da machte sich Jonathan auf, der Sohn Sauls, und ging hin zu David in der Heide und stärkte seine Hand in Gott“ und sagte ihm: „du wirst König werden über Israel, so will ich der nächste um dich sein; auch weiß solches mein Vater wohl“. Die beiden schlossen „einen Bund miteinander vor dem HERRN“, und „David blieb in der Heide, aber Jonathan zog wieder heim“; sie sahen sich nie wieder. Dann gingen die Sifiter zu Saul nach Gibea hinauf, um das Versteck zu verraten, und David entkam nach Süden in die Wüste Maon."
    - "Das Gelände sind heute die südlichen Hebroner Berge im Westjordanland, östlich der Stadt Jatta, wo die letzten Felder der Wüste weichen; Chirbet Churaisa ist eine Streuung von Ruinen und Höhlen zwischen den Terrassen."
  fr:
    - "Horesch est le lieu du désert de Ziph où David se cacha de Saül et où Jonathan vint le retrouver une dernière fois. Le mot hébreu signifie un bois ou un fourré, et les traductions anciennes l’ont compris ainsi : la version King James dit que David « se tint au désert de Ziph, dans la forêt », et la Bible synodale russe aussi. La plupart des traductions et des commentateurs modernes y lisent un nom de lieu, Horesch, puisque le désert de Judée au sud d’Hébron est nu, et puisque les Ziphiens disent à Saül que David se cache « dans des lieux forts, dans la forêt, sur la colline de Hakila », comme pour nommer une localité. Dans ce cas, Horesch est d’ordinaire identifiée à Khirbet Khureisa, une ruine à environ 3 km au sud de Tell Zif, l’ancienne Ziph, en bordure du désert qui descend vers la mer Morte ; l’identification repose sur le nom, et rien n’y a été fouillé."
    - "Le récit tient en un chapitre. David, après avoir sauvé Keïla et l’avoir quittée, « demeura au désert, dans des lieux forts », et Saül le cherchait chaque jour. « Jonathan, fils de Saül, se leva et alla vers David dans la forêt. Il fortifia sa confiance en Dieu » et lui dit : « Tu régneras sur Israël, et moi je serai au second rang près de toi ; Saül, mon père, le sait bien aussi. » Tous deux firent alliance devant l’Éternel ; « David resta dans la forêt, et Jonathan s’en alla chez lui » ; ils ne se revirent jamais. Puis les Ziphiens montèrent auprès de Saül à Guibea pour trahir la cachette, et David s’esquiva vers le sud, au désert de Maon."
    - "Le terrain est aujourd’hui celui des collines d’Hébron méridionales, en Cisjordanie, à l’est de la ville de Yatta, là où les derniers champs cèdent la place au désert ; Khirbet Khureisa est un semis de ruines et de grottes parmi les terrasses."
  pl:
    - "Choresz to miejsce na pustyni Zif, gdzie Dawid ukrywał się przed Saulem i gdzie Jonatan przyszedł do niego po raz ostatni. Hebrajskie słowo znaczy las lub gąszcz i tak rozumiały je starsze przekłady: Biblia Króla Jakuba mówi, że Dawid był „na puszczy Zyf w lesie”, a rosyjska Biblia synodalna także ma „w lesie”. Większość współczesnych przekładów i komentatorów czyta to jako nazwę miejsca, Choresz, ponieważ pustynia judzka na południe od Hebronu jest naga, a Zifejczycy mówią Saulowi, że Dawid kryje się „po miejscach obronnych w lesie na pagórku Hachila”, jakby wskazując miejscowość. Przy takim odczytaniu Choresz utożsamia się zwykle z Chirbet Churejsa, ruiną około 3 km na południe od Tell Zif, dawnego Zif, na skraju pustyni opadającej ku Morzu Martwemu; utożsamienie opiera się na nazwie i nic tam nie wykopano."
    - "Opowieść zajmuje jeden rozdział. Dawid, uratowawszy Keilę i opuściwszy ją, „mieszkał Dawid na puszczy w miejscach obronnych”, a Saul szukał go każdego dnia. „Wtedy wstał Jonatan, syn Saula, i szedł do Dawida do lasu, i posilił rękę jego w Bogu”, mówiąc mu: „a ty będziesz królował nad Izraelem, ja zaś będę wtórym po tobie; wszak i Saul, ojciec mój, wie o tem”. Obaj zawarli przymierze przed Panem, „i został Dawid w lesie, ale Jonatan wrócił się do domu ojca swego”; nigdy się już nie spotkali. Potem Zifejczycy poszli do Saula do Gibei, by zdradzić kryjówkę, a Dawid umknął na południe, na pustynię Maon."
    - "Teren to dziś południowe wzgórza Hebronu na Zachodnim Brzegu, na wschód od miasta Jatta, gdzie ostatnie pola ustępują pustyni; Chirbet Churejsa to rozsypisko ruin i jaskiń wśród tarasów."
  it:
    - "Choresh è il luogo nel deserto di Zif dove Davide si nascose da Saul e dove Gionata venne da lui per l’ultima volta. La parola ebraica significa bosco o boscaglia, e le traduzioni più antiche la intesero così: la King James Bible dice che Davide era nel deserto di Zif «in a wood», e anche la Bibbia sinodale russa ha «nella foresta». La maggior parte delle traduzioni moderne e dei commentatori la leggono come nome di luogo, Choresh, poiché il deserto di Giuda a sud di Ebron è spoglio e poiché gli Zifei dicono a Saul che Davide si nasconde «ne’ luoghi forti della foresta, sul colle di Hakila», come se indicassero una località. In questa lettura Choresh è di solito identificata con Khirbet Khureisa, una rovina circa 3 km a sud di Tell Zif, l’antica Zif, al margine del deserto che scende verso il Mar Morto; l’identificazione poggia sul nome, e nulla vi è stato scavato."
    - "La storia è narrata in un solo capitolo. Davide, dopo aver salvato Keila e averla lasciata, «rimase nel deserto in luoghi forti», e Saul lo cercava continuamente. «Allora Gionathan, figliuolo di Saul, si levò, e si recò da Davide nella foresta. Egli fortificò la sua fiducia in Dio», dicendogli: «tu regnerai sopra Israele, e io sarò il secondo dopo di te; e ben lo sa anche Saul mio padre». I due fecero alleanza davanti al Signore; «Davide rimase nella foresta, e Gionathan se ne andò a casa sua»; non si incontrarono mai più. Poi gli Zifei salirono da Saul a Gabaa per tradire il nascondiglio, e Davide scivolò via a sud verso il deserto di Maon."
    - "Il terreno è oggi quello delle colline meridionali di Ebron in Cisgiordania, a est della città di Yatta, dove gli ultimi campi cedono al deserto; Khirbet Khureisa è un insieme sparso di rovine e grotte fra le terrazze."
  nl:
    - "Choresj is de plaats in de woestijn van Zif waar David zich voor Saul verborg en waar Jonatan voor het laatst bij hem kwam. Het Hebreeuwse woord betekent bos of struikgewas, en de oudere vertalingen vatten het zo op: de King James Bible heeft David “in de woestijn van Zif in een woud”, en de Russische Synodale Bijbel heeft eveneens “in het bos”. De meeste moderne vertalingen en uitleggers lezen het als plaatsnaam, Choresj, omdat de Judese woestijn ten zuiden van Hebron kaal is, en omdat de Zifieten tegen Saul zeggen dat David zich verbergt “in de vestingen in het woud, op den heuvel van Hachila”, alsof een plaats wordt genoemd. In die lezing wordt Choresj gewoonlijk vereenzelvigd met Khirbet Khureisa, een ruïne ongeveer 3 km ten zuiden van Tell Zif, het oude Zif, aan de rand van de woestijn naar de Dode Zee; de identificatie berust op de naam, en er is niets opgegraven."
    - "Het verhaal staat in één hoofdstuk. David, die Keïla had gered en verlaten, “bleef in de woestijn in de vestingen”, en Saul zocht hem alle dagen. “Toen maakte zich Jonathan, de zoon van Saul, op, en hij ging tot David in het woud; en hij versterkte zijn hand in God”, en zei tegen hem: “gij zult koning worden over Israel, en ik zal de tweede bij u zijn; ook weet mijn vader Saul zulks wel”. De twee sloten een verbond voor het aangezicht van de HEER, “en David bleef in het woud, maar Jonathan ging naar zijn huis”; zij ontmoetten elkaar nooit meer. Daarna gingen de Zifieten naar Saul in Gibea om de schuilplaats te verraden, en David glipte weg naar het zuiden, naar de woestijn van Maön."
    - "Het gebied is nu de zuidelijke heuvels van Hebron op de Westoever, ten oosten van de stad Yatta, waar de laatste akkers overgaan in de woestijn; Khirbet Khureisa is een verspreiding van ruïnes en grotten tussen de terrassen."
  cs:
    - "Choreš je místo na poušti Zif, kde se David skrýval před Saulem a kde za ním naposledy přišel Jonatan. Hebrejské slovo znamená les nebo houští a starší překlady je tak braly: Bible krále Jakuba praví, že David „byl na poušti Zif v lese“, a ruská synodální Bible rovněž má „v lese“. Většina moderních překladů a komentátorů čte slovo jako místní jméno Choreš, protože judská poušť jižně od Hebronu je holá a protože Zifejští říkají Saulovi, že se David skrývá „v horách, v lese, na pahrbku Hachile“, jako by označovali místo. Podle toho se Choreš obvykle ztotožňuje s Chirbet Churejsa, zříceninou asi 3 km jižně od Tell Zif, starověkého Zífu, na okraji pouště klesající k Mrtvému moři; ztotožnění se opírá o jméno a nic tam nebylo vykopáno."
    - "Příběh je vyprávěn v jedné kapitole. David zachránil Keilu a opustil ji. „Byl pak David na poušti v místech bezpečných“ a Saul jej hledal každý den. „Vstav pak Jonata syn Saulův, přišel k Davidovi do lesa, a posilnil ruky jeho v Bohu“ a řekl mu: „ty kralovati budeš nad Izraelem, a já budu druhý po tobě. Však i Saul otec můj zná to.“ Oba uzavřeli smlouvu před Hospodinem, „a David zůstal v lese, Jonata pak navrátil se do domu svého“; už se nikdy nesetkali. Pak Zifejští šli k Saulovi do Gibeje zradit úkryt a David se vyplížil na jih na poušť Maon."
    - "Půdou jsou dnes jižní hebronské hory na Západním břehu, východně od města Jatta, kde poslední pole ustupují poušti; Chirbet Churejsa je změť zřícenin a jeskyní mezi terasami."
  sv:
    - "Horesh är platsen i Sifs öken där David gömde sig för Saul och där Jonatan kom till honom för sista gången. Det hebreiska ordet betyder en skog eller en snårskog, och de äldre översättningarna tog det så: King James-bibeln säger att David var ”i Sifs öken i en skog”, och den ryska synodalbibeln har likaså ”i skogen”. De flesta moderna översättningar och kommentatorer läser det som ett ortnamn, Horesh, eftersom den judeiska öknen söder om Hebron är kal, och eftersom sifiterna säger till Saul att David gömmer sig ”på bergfästena i Hores, på Hakilahöjden”, som om de angav en trakt. Så läst identifieras Horesh vanligen med Khirbet Khureisa, en ruin omkring 3 km söder om Tell Zif, det antika Sif, i kanten av öknen som stupar mot Döda havet; identifieringen vilar på namnet, och ingenting har grävts ut där."
    - "Berättelsen återges i ett kapitel. Sedan David räddat Keila och lämnat staden heter det: ”Så uppehöll sig nu David i öknen på bergfästena”, och Saul sökte honom varje dag. ”Men Jonatan, Sauls son, stod upp och gick till David i Hores och styrkte hans mod i Gud”, och sade till honom: ”du skall bliva konung över Israel, och jag skall då hava andra platsen, näst efter dig. Detta vet ock min fader Saul”. De två slöt ett förbund inför Herren; ”David stannade kvar i Hores, men Jonatan gick hem igen”; de träffades aldrig mer. Sedan gick sifiterna upp till Saul i Giva för att förråda gömstället, och David smet söderut till öknen Maon."
    - "Marken är i dag södra Hebronbergen på Västbanken, öster om staden Yatta, där de sista åkrarna övergår i öken; Khirbet Khureisa är en spridning av ruiner och grottor bland terrasserna."
  nb:
    - "Horesj er stedet i Sifs ørken der David skjulte seg for Saul og der Jonatan kom til ham for siste gang. Det hebraiske ordet betyr en skog eller et kratt, og de eldre oversettelsene tok det slik: King James-oversettelsen har David i Sifs ørken «i en skog», og den russiske synodalbibelen har likeså «i skogen». De fleste moderne oversettelser og kommentatorer leser det som et stedsnavn, Horesj, siden den judeiske ørkenen sør for Hebron er bar, og siden sifittene sier til Saul at David skjuler seg «i fjellborgene i skogen, på Kakilahaugen», som om de nevner et sted. Med den lesningen identifiseres Horesj vanligvis med Khirbet Khureisa, en ruin omtrent 3 km sør for Tell Zif, det gamle Sif, i kanten av ørkenen som faller ned mot Dødehavet; identifikasjonen hviler på navnet, og ingenting er gravd ut der."
    - "Historien fortelles i ett kapittel. David, som hadde reddet Keila og forlatt den, «holdt til i ørkenen, i fjellborgene», og Saul søkte ham hver dag. Da «drog Jonatan, Sauls sønn, avsted og kom til ham i skogen, og han styrket hans mot i Gud», og sa til ham: «du skal bli konge over Israel, og jeg skal være den næste efter dig; det vet også Saul, min far». De to gjorde en pakt for Herrens åsyn, og «David blev i skogen, men Jonatan drog hjem igjen»; de møttes aldri mer. Så dro sifittene opp til Saul i Gibea for å forråde skjulestedet, og David slapp unna sørover til Maons ørken."
    - "Grunnen er i dag de sørlige Hebron-åsene på Vestbredden, øst for byen Yatta, der de siste åkrene gir plass for ørkenen; Khirbet Khureisa er en spredning av ruiner og huler blant terrassene."
  tl:
    - "Ang Horesh ang lugar sa ilang ng Ziph kung saan nagtago si David kay Saul at huling dinatnan ni Jonathan. Gubat o kasukalan ang kahulugan ng salitang Hebreo, at gayon ito inunawa ng mga naunang salin: sinasabi ng King James Bible na si David ay nasa ilang ng Ziph sa isang gubat, at gayundin ang Russian Synodal Bible, “sa kagubatan”. Binabasa ito ng karamihan sa makabagong salin at komentarista bilang pangalang Horesh, yamang hubad ang ilang ng Judea sa timog ng Hebron, at yamang sinasabi ng mga Zipheo kay Saul na nagkukubli si David “sa mga katibayan sa gubat, sa burol ng Hachila”, na tila nagpapangalan ng pook. Sa pagbasang iyon, karaniwang itinutugma ang Horesh sa Khirbet Khureisa, guho mga 3 km sa timog ng Tell Zif, ang sinaunang Ziph, sa gilid ng ilang na bumababa patungong Dagat na Alat; nakasalig sa pangalan ang pagkakakilanlan, at wala pang hinukay."
    - "Isang kabanata ang naglalahad ng kuwento. Si David, matapos iligtas ang Ceila at lisanin ito, ay “tumahan sa ilang sa mga katibayan”, at pinag-usig siya ni Saul araw-araw. “At si Jonathan na anak ni Saul ay bumangon, at naparoon kay David sa gubat, at pinagtibay ang kaniyang kamay sa Dios”, at sinabi sa kaniya, “ikaw ay magiging hari sa Israel, at ako'y magiging pangalawa mo; at nalalamang gayon ni Saul na aking ama”. Nagtipanan ang dalawa sa harap ng Panginoon, “at si David ay tumahan sa gubat, at si Jonathan ay umuwi sa kaniyang bahay”; hindi na sila muling nagkita. Pagkatapos ay umahon ang mga Zipheo kay Saul sa Gibea upang ipagkanulo ang taguan, at tahimik na lumisan si David patimog sa ilang ng Maon."
    - "Ang lupain ngayon ay ang timog na mga burol ng Hebron sa West Bank, sa silangan ng bayan ng Yatta, kung saan ang mga huling bukid ay napapalitan ng disyerto; ang Khirbet Khureisa ay isang kalat ng mga guho at kuweba sa gitna ng mga hagdan-hagdang lupa."
  da:
    - "Horesj er stedet i Zifs ørken, hvor David skjulte sig for Saul, og hvor Jonatan kom til ham for sidste gang. Det hebraiske ord betyder en skov eller et krat, og de ældre oversættelser forstod det sådan: King James-oversættelsen siger, at David var »i Zifs ørken i en skov«, og den russiske synodalbibel har ligeledes »i skoven«. De fleste moderne oversættelser og kommentatorer læser det som et stednavn, Horesj, da den judæiske ørken syd for Hebron er nøgen, og da zifitterne siger til Saul, at David skjuler sig »i Befæstningerne i Skoven paa Hakilas Høj«, som om de nævnte et sted. Efter den læsning identificeres Horesj sædvanligvis med Khirbet Khureisa, en ruin omkring 3 km syd for Tell Zif, det gamle Zif, i udkanten af ørkenen, der falder mod Det Døde Hav; identifikationen hviler på navnet, og intet er gravet dér."
    - "Historien fortælles i ét kapitel. David, der havde reddet Ke'ila og forladt den, »blev i Ørken i Befæstningerne«, og Saul søgte efter ham hver dag. »Da gjorde Jonathan, Sauls Søn, sig rede og gik hen i Skoven til David, og han styrkede hans Kraft i Gud« og sagde til ham: »du skal blive Konge over Israel, og jeg vil være den anden hos dig; og Saul, min Fader, ved det ogsaa«. De to sluttede en pagt for Herrens ansigt, »og David blev i Skoven, men Jonathan gik til sit Hus«; de mødtes aldrig igen. Så gik zifitterne op til Saul i Gibea for at forråde skjulestedet, og David smuttede sydpå til Maons ørken."
    - "Egnen er i dag de sydlige Hebron-bjerge på Vestbredden, øst for byen Yatta, hvor de sidste marker viger for ørkenen; Khirbet Khureisa er en spredning af ruiner og huler blandt terrasserne."
