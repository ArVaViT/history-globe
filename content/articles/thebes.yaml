# Overview article (ADR 0007). Mainstream facts only; Egyptian dates follow I. Shaw (ed.), The Oxford History of Ancient Egypt.
# The card is named «Но» (Synodal); the article is titled with the usual name «Фивы», and its first sentence ties the two.
id: thebes
