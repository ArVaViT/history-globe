body:
  en:
    - "Thebes stood on both banks of the Nile in Upper Egypt, about 500 km south of Cairo, where Luxor is today. The Egyptians called it Waset, the Greeks Thebes, and the Hebrew Bible No or No-Amon, the city of Amun. It was a provincial town until its princes of the Eleventh Dynasty reunited Egypt under Mentuhotep II in the twenty-first century BC. From then on Amun of Thebes rose to be the chief god of the land, and king after king enlarged his temple at Karnak for some two thousand years."
    - "In the New Kingdom (c. 1550–1070 BC) Thebes was the religious capital of an empire. Its kings built the temples of Karnak and Luxor on the east bank and their mortuary temples on the west, among them Hatshepsut's at Deir el-Bahari, and were buried in the Valley of the Kings, where Howard Carter found the tomb of Tutankhamun in 1922. Homer speaks of Egyptian Thebes as the richest city in the world, with a hundred gates."
    - 'In 664 or 663 BC the Assyrian king Ashurbanipal pursued the Kushite king Tanutamon to Thebes, took the city and carried off its treasures, among them two obelisks. Nahum reminds Nineveh of that fall: "Art thou better than populous No ... Yet was she carried away, she went into captivity." Jeremiah foretold that God would punish the multitude of No together with Pharaoh, and Ezekiel that he would execute judgments in No.'
    - "Under the Ptolemies Thebes rebelled more than once; in the 80s BC Ptolemy IX put down a revolt so harshly, Pausanias says, that no trace of its old prosperity was left. Strabo found only a group of villages. An earthquake, usually dated 27 BC, had broken one of the two colossi of Amenhotep III; the broken statue was said to give out a sound once a day, and Roman visitors came to hear it and carved their names and verses on it; the emperor Hadrian came in AD 130. In late antiquity Christian monks settled in the old tombs and temples."
  ru:
    - "Фивы, библейский Но, стояли на обоих берегах Нила в Верхнем Египте, примерно в 500 км к югу от Каира, там, где теперь Луксор. Египтяне называли город Уасет, греки — Фивами, а еврейская Библия — Но или Но-Аммон, то есть город Амона. Это был провинциальный город, пока его правители из XI династии не объединили Египет вновь при Ментухотепе II в XXI веке до н. э. С тех пор Амон Фиванский стал главным богом страны, а его храм в Карнаке цари расширяли около двух тысяч лет."
    - "В эпоху Нового царства (ок. 1550–1070 гг. до н. э.) Фивы были религиозной столицей державы. Цари строили храмы Карнака и Луксора на восточном берегу, а на западном — свои поминальные храмы, среди них храм Хатшепсут в Дейр-эль-Бахри, и погребались в Долине царей, где в 1922 г. Говард Картер нашёл гробницу Тутанхамона. Гомер говорит о египетских Фивах как о богатейшем городе мира со ста воротами."
    - "В 664 или 663 г. до н. э. ассирийский царь Ашшурбанапал преследовал кушитского царя Тануатамона до Фив, взял город и увёз его сокровища, среди них два обелиска. Наум напоминает Ниневии об этом падении: «Разве ты лучше Но-Аммона... Но и он переселен, пошел в плен». Иеремия предрекал, что Бог посетит Аммона, который в Но, вместе с фараоном, а Иезекииль — что Он произведёт суд над Но."
    - "При Птолемеях Фивы не раз восставали; в 80-х годах до н. э. Птолемей IX подавил восстание так жестоко, говорит Павсаний, что от былого процветания не осталось и следа. Страбон застал здесь лишь несколько деревень. Землетрясение, которое обычно датируют 27 г. до н. э., повредило один из двух колоссов Аменхотепа III; о повреждённой статуе говорили, что раз в день она издаёт звук, и римские путешественники приходили его послушать и вырезали на ней свои имена и стихи; в 130 г. н. э. сюда приезжал император Адриан. В поздней античности в старых гробницах и храмах поселились христианские монахи."
  uk:
    - "Фіви стояли на обох берегах Нілу у Верхньому Єгипті, приблизно за 500 км на південь від Каїра, де нині Луксор. Єгиптяни називали їх Васет, греки — Фіви, а староєврейська Біблія — Но, або Но-Амон, місто Амона. Це було провінційне місто, доки його князі XI династії не об’єднали Єгипет під Ментухотепом II у XXI ст. до н. е. Відтоді Амон Фіванський піднісся до головного бога країни, і цар за царем розбудовували його храм у Карнаку близько двох тисяч років."
    - "За Нового царства (бл. 1550–1070 рр. до н. е.) Фіви були релігійною столицею імперії. Їхні царі збудували храми Карнака й Луксора на східному березі та свої заупокійні храми на західному, серед них храм Хатшепсут у Дейр-ель-Бахрі, і були поховані в Долині царів, де Говард Картер 1922 року знайшов гробницю Тутанхамона. Гомер говорить про єгипетські Фіви як про найбагатше місто світу, зі ста брамами."
    - "У 664 чи 663 р. до н. е. ассірійський цар Ашшурбаніпал переслідував кушитського царя Танутамона до Фів, узяв місто й вивіз його скарби, серед них два обеліски. Наум нагадує Ніневії про те падіння: «Хиба ж ти лучша за Но-Аммон … Та й він буде переселений, пійде в неволю». Єремія провістив, що Бог покарає безліч Но разом з фараоном, а Єзекіїль — що вчинить суд у Но."
    - "За Птолемеїв Фіви повставали не раз; у 80-х роках до н. е. Птолемей IX придушив повстання так жорстоко, каже Павсаній, що від колишнього добробуту не лишилося й сліду. Страбон застав лише купку сіл. Землетрус, який зазвичай датують 27 р. до н. е., розколов один із двох колосів Аменхотепа III; зламана статуя, як казали, видавала звук раз на день, і римські відвідувачі приходили послухати й вирізали на ній свої імена та вірші; імператор Адріан прибув 130 р. н. е. У пізню давнину християнські ченці оселилися в давніх гробницях і храмах."
  es:
    - "Tebas se extendía en ambas orillas del Nilo, en el Alto Egipto, a unos 500 km al sur de El Cairo, donde hoy está Luxor. Los egipcios la llamaban Uaset, los griegos Tebas y la Biblia hebrea No o No-amón, la ciudad de Amón. Fue una ciudad provincial hasta que sus príncipes de la dinastía XI reunificaron Egipto bajo Mentuhotep II en el siglo XXI a. C. Desde entonces Amón de Tebas ascendió hasta ser el dios principal del país, y rey tras rey amplió su templo de Karnak durante unos dos mil años."
    - "En el Reino Nuevo (h. 1550–1070 a. C.) Tebas fue la capital religiosa de un imperio. Sus reyes construyeron los templos de Karnak y Luxor en la orilla este y sus templos funerarios en la oeste, entre ellos el de Hatshepsut en Deir el-Bahari, y fueron enterrados en el Valle de los Reyes, donde Howard Carter halló la tumba de Tutankamón en 1922. Homero habla de la Tebas egipcia como la ciudad más rica del mundo, con cien puertas."
    - "En 664 o 663 a. C. el rey asirio Asurbanipal persiguió hasta Tebas al rey cusita Tanutamón, tomó la ciudad y se llevó sus tesoros, entre ellos dos obeliscos. Nahum recuerda a Nínive aquella caída: «¿Eres tú mejor que No-amón … También ella fué llevada en cautiverio». Jeremías anunció que Dios castigaría a la multitud de No junto con el faraón, y Ezequiel que ejecutaría juicios en No."
    - "Bajo los Ptolomeos Tebas se rebeló más de una vez; en los años 80 a. C. Ptolomeo IX sofocó una revuelta con tal dureza, dice Pausanias, que no quedó rastro de su antigua prosperidad. Estrabón solo halló un conjunto de aldeas. Un terremoto, fechado habitualmente en 27 a. C., había roto uno de los dos colosos de Amenhotep III; se decía que la estatua rota emitía un sonido una vez al día, y los visitantes romanos acudían a oírlo y grababan en ella sus nombres y versos; el emperador Adriano fue en 130 d. C. En la Antigüedad tardía, monjes cristianos se establecieron en las antiguas tumbas y templos."
  pt:
    - "Tebas ficava nas duas margens do Nilo, no Alto Egito, a cerca de 500 km ao sul do Cairo, onde hoje está Luxor. Os egípcios a chamavam Waset, os gregos Tebas e a Bíblia hebraica Nô ou Nô-Amom, a cidade de Amom. Era uma cidade provincial até que seus príncipes da XI Dinastia reunificaram o Egito sob Mentuhotep II, no século XXI a.C. Dali em diante Amom de Tebas ergueu-se a principal deus da terra, e rei após rei ampliou seu templo em Karnak por cerca de dois mil anos."
    - "No Reino Novo (c. 1550–1070 a.C.), Tebas foi a capital religiosa de um império. Seus reis construíram os templos de Karnak e Luxor na margem leste e seus templos funerários na oeste, entre eles o de Hatshepsut em Deir el-Bahari, e foram sepultados no Vale dos Reis, onde Howard Carter achou o túmulo de Tutancâmon em 1922. Homero fala da Tebas egípcia como a cidade mais rica do mundo, com cem portas."
    - "Em 664 ou 663 a.C., o rei assírio Assurbanípal perseguiu o rei cuxita Tanutamon até Tebas, tomou a cidade e levou seus tesouros, entre eles dois obeliscos. Naum lembra Nínive dessa queda: “Você é melhor do que Nô-Amom … Contudo, ela foi levada. Ela foi para o cativeiro.” Jeremias predisse que Deus castigaria a multidão de Nô junto com o Faraó, e Ezequiel que executaria juízos em Nô."
    - "Sob os ptolomeus, Tebas se rebelou mais de uma vez; nos anos 80 a.C., Ptolomeu IX sufocou uma revolta de modo tão duro, diz Pausânias, que não restou vestígio de sua antiga prosperidade. Estrabão encontrou apenas um conjunto de aldeias. Um terremoto, geralmente datado de 27 a.C., havia quebrado um dos dois colossos de Amenhotep III; dizia-se que a estátua quebrada emitia um som uma vez por dia, e visitantes romanos vinham ouvi-lo e gravaram nela seus nomes e versos; o imperador Adriano veio em 130 d.C. Na Antiguidade tardia, monges cristãos se instalaram nos antigos túmulos e templos."
  de:
    - "Theben lag an beiden Ufern des Nils in Oberägypten, etwa 500 km südlich von Kairo, wo heute Luxor liegt. Die Ägypter nannten es Waset, die Griechen Theben und die hebräische Bibel No oder No-Amon, die Stadt des Amun. Es war eine Provinzstadt, bis seine Fürsten der Elften Dynastie unter Mentuhotep II. im einundzwanzigsten Jahrhundert v. Chr. Ägypten wiedervereinigten. Seither stieg Amun von Theben zum obersten Gott des Landes auf, und König um König erweiterte seinen Tempel in Karnak etwa zweitausend Jahre lang."
    - "Im Neuen Reich (ca. 1550–1070 v. Chr.) war Theben die religiöse Hauptstadt eines Weltreichs. Seine Könige bauten die Tempel von Karnak und Luxor am Ostufer und ihre Totentempel am Westufer, darunter den der Hatschepsut in Deir el-Bahari, und wurden im Tal der Könige begraben, wo Howard Carter 1922 das Grab des Tutanchamun fand. Homer spricht vom ägyptischen Theben als der reichsten Stadt der Welt mit hundert Toren."
    - "664 oder 663 v. Chr. verfolgte der assyrische König Assurbanipal den kuschitischen König Tanutamun bis Theben, nahm die Stadt ein und führte ihre Schätze fort, darunter zwei Obelisken. Nahum erinnert Ninive an diesen Fall: „Meinst du, du seist besser denn die Stadt No-Amon … Doch hat sie müssen vertrieben werden und gefangen wegziehen.“ Jeremia kündigte an, Gott werde die Menge von No samt dem Pharao heimsuchen, und Hesekiel, dass er in No Gerichte vollziehen werde."
    - "Unter den Ptolemäern erhob sich Theben mehrfach; in den 80er Jahren v. Chr. schlug Ptolemaios IX. einen Aufstand so hart nieder, sagt Pausanias, dass keine Spur des alten Wohlstands blieb. Strabon fand nur eine Gruppe von Dörfern. Ein Erdbeben, meist auf 27 v. Chr. datiert, hatte einen der beiden Kolosse Amenophis' III. zerbrochen; die zerbrochene Statue soll einmal am Tag einen Klang von sich gegeben haben, und römische Besucher kamen, ihn zu hören, und ritzten ihre Namen und Verse hinein; Kaiser Hadrian kam im Jahr 130 n. Chr. In der Spätantike ließen sich christliche Mönche in den alten Gräbern und Tempeln nieder."
  fr:
    - "Thèbes s’étendait sur les deux rives du Nil en Haute-Égypte, à environ 500 km au sud du Caire, là où se trouve aujourd’hui Louxor. Les Égyptiens l’appelaient Ouaset, les Grecs Thèbes, et la Bible hébraïque No ou No-Amon, la ville d’Amon. Ce fut une ville de province jusqu’à ce que ses princes de la XIe dynastie réunifient l’Égypte sous Montouhotep II au XXIe siècle av. J.-C. Dès lors, Amon de Thèbes devint le dieu principal du pays, et roi après roi agrandit son temple de Karnak pendant quelque deux mille ans."
    - "Au Nouvel Empire (vers 1550-1070 av. J.-C.), Thèbes fut la capitale religieuse d’un empire. Ses rois y bâtirent les temples de Karnak et de Louxor sur la rive est et leurs temples funéraires sur la rive ouest, dont celui d’Hatchepsout à Deir el-Bahari, et furent enterrés dans la Vallée des Rois, où Howard Carter trouva en 1922 la tombe de Toutânkhamon. Homère parle de la Thèbes d’Égypte comme de la ville la plus riche du monde, aux cent portes."
    - "En 664 ou 663 av. J.-C., le roi assyrien Assurbanipal poursuivit à Thèbes le roi koushite Tanoutamon, prit la ville et emporta ses trésors, dont deux obélisques. Nahum rappelle cette chute à Ninive : « Es-tu meilleure que No-Amon … Et cependant elle est partie pour l’exil, elle s’en est allée captive ». Jérémie annonça que Dieu châtierait Amon de No avec Pharaon, et Ézéchiel qu’il exercerait ses jugements sur No."
    - "Sous les Ptolémées, Thèbes se révolta plus d’une fois ; dans les années 80 av. J.-C., Ptolémée IX écrasa une révolte si durement, dit Pausanias, qu’il ne resta rien de son ancienne prospérité. Strabon n’y trouva qu’un groupe de villages. Un séisme, d’ordinaire daté de 27 av. J.-C., avait brisé l’un des deux colosses d’Amenhotep III ; la statue brisée passait pour émettre un son une fois par jour, et des visiteurs romains vinrent l’entendre et y gravèrent leurs noms et des vers ; l’empereur Hadrien y vint en 130 apr. J.-C. À la fin de l’Antiquité, des moines chrétiens s’installèrent dans les anciennes tombes et les anciens temples."
  pl:
    - "Teby leżały po obu brzegach Nilu w Górnym Egipcie, około 500 km na południe od Kairu, tam gdzie dziś Luksor. Egipcjanie nazywali je Waset, Grecy Teby, a Biblia hebrajska No lub No-Amon, miasto Amona. Były miastem prowincjonalnym, dopóki jego książęta z XI dynastii nie zjednoczyli Egiptu pod Mentuhotepem II w XXI wieku p.n.e. Odtąd Amon z Teb wzrósł do rangi głównego boga kraju, a król po królu rozbudowywał jego świątynię w Karnaku przez około dwa tysiące lat."
    - "W Nowym Państwie (ok. 1550–1070 p.n.e.) Teby były religijną stolicą imperium. Ich królowie wznosili świątynie w Karnaku i Luksorze na wschodnim brzegu oraz swoje świątynie grobowe na zachodnim, wśród nich świątynię Hatszepsut w Dajr al-Bahari, i byli chowani w Dolinie Królów, gdzie Howard Carter znalazł w 1922 roku grobowiec Tutanchamona. Homer mówi o egipskich Tebach jako o najbogatszym mieście świata, ze stu bramami."
    - "W 664 lub 663 roku p.n.e. asyryjski król Aszurbanipal ścigał kuszyckiego króla Tanutamona aż do Teb, zdobył miasto i uprowadził jego skarby, wśród nich dwa obeliski. Nahum przypomina Niniwie ten upadek: „Izaliś ty lepsza, niż ludne miasto No ... Wszakże i to w zaprowadzenie i w pojmanie przyszło.” Jeremiasz zapowiedział, że Bóg ukarze tłum No razem z Faraonem, a Ezechiel, że wykona sądy nad No."
    - "Za Ptolemeuszów Teby buntowały się więcej niż raz; w latach osiemdziesiątych p.n.e. Ptolemeusz IX stłumił bunt tak surowo, że według Pauzaniasza nie został ślad dawnego dobrobytu. Strabon zastał już tylko grupę wsi. Trzęsienie ziemi, zwykle datowane na 27 rok p.n.e., złamało jeden z dwóch kolosów Amenhotepa III; złamany posąg miał wydawać dźwięk raz dziennie, a rzymscy goście przybywali go słuchać i wyryli na nim swoje imiona i wiersze; cesarz Hadrian przybył w 130 roku n.e. W późnej starożytności chrześcijańscy mnisi osiedlili się w dawnych grobowcach i świątyniach."
  it:
    - "Tebe sorgeva su entrambe le rive del Nilo nell’Alto Egitto, circa 500 km a sud del Cairo, dove oggi è Luxor. Gli Egizi la chiamavano Waset, i Greci Tebe, e la Bibbia ebraica No o No-Amon, la città di Amon. Fu una città di provincia finché i suoi principi della XI dinastia riunificarono l’Egitto sotto Mentuhotep II nel XXI secolo a.C. Da allora Amon di Tebe divenne il dio principale del paese, e re dopo re ampliarono il suo tempio a Karnak per circa duemila anni."
    - "Nel Nuovo Regno (1550–1070 a.C. circa) Tebe fu la capitale religiosa di un impero. I suoi re costruirono i templi di Karnak e Luxor sulla riva orientale e i loro templi funerari su quella occidentale, fra cui quello di Hatshepsut a Deir el-Bahari, e furono sepolti nella Valle dei Re, dove Howard Carter trovò nel 1922 la tomba di Tutankhamon. Omero parla della Tebe egizia come della città più ricca del mondo, con cento porte."
    - "Nel 664 o 663 a.C. il re assiro Assurbanipal inseguì a Tebe il re kushita Tanutamon, prese la città e ne portò via i tesori, fra cui due obelischi. Naum ricorda a Ninive quella caduta: «Vali tu meglio di No-Amon … Eppure, anch’essa è stata deportata, è andata in cattività». Geremia predisse che Dio avrebbe punito Amon di No insieme al Faraone, ed Ezechiele che avrebbe esercitato i suoi giudizi su No."
    - "Sotto i Tolomei Tebe si ribellò più volte; negli anni 80 a.C. Tolomeo IX represse una rivolta con tale durezza, dice Pausania, che non restò traccia dell’antica prosperità. Strabone vi trovò solo un gruppo di villaggi. Un terremoto, di solito datato al 27 a.C., aveva spezzato uno dei due colossi di Amenhotep III; si diceva che la statua rotta emettesse un suono una volta al giorno, e i visitatori romani venivano ad ascoltarlo e vi incidevano nomi e versi; l’imperatore Adriano vi giunse nel 130 d.C. Nella tarda antichità monaci cristiani si stabilirono nelle antiche tombe e nei templi."
  nl:
    - "Thebe lag aan beide oevers van de Nijl in Opper-Egypte, ongeveer 500 km ten zuiden van Caïro, waar nu Luxor ligt. De Egyptenaren noemden het Waset, de Grieken Thebe, en de Hebreeuwse Bijbel No of No-Amon, de stad van Amon. Het was een provinciestad totdat zijn vorsten van de Elfde Dynastie Egypte onder Mentuhotep II in de eenentwintigste eeuw v.Chr. herenigden. Vanaf toen steeg Amon van Thebe op tot de belangrijkste god van het land, en koning na koning breidde zijn tempel in Karnak uit gedurende zo’n tweeduizend jaar."
    - "In het Nieuwe Rijk (ca. 1550–1070 v.Chr.) was Thebe de religieuze hoofdstad van een rijk. Zijn koningen bouwden de tempels van Karnak en Luxor aan de oostoever en hun dodentempels aan de westoever, onder meer die van Hatsjepsoet bij Deir el-Bahari, en werden begraven in de Vallei der Koningen, waar Howard Carter in 1922 het graf van Toetanchamon vond. Homerus spreekt van het Egyptische Thebe als de rijkste stad ter wereld, met honderd poorten."
    - "In 664 of 663 v.Chr. achtervolgde de Assyrische koning Assurbanipal de Koesjitische koning Tanoetamon naar Thebe, nam de stad in en voerde haar schatten weg, onder meer twee obelisken. Nahum herinnert Nineve aan die val: “Zijt gij beter dan No, de volkrijke … Nog is zij gevankelijk gegaan in de gevangenis.” Jeremia voorspelde dat God de menigte van No tezamen met Farao zou bezoeken, en Ezechiël dat Hij gerichten zou oefenen in No."
    - "Onder de Ptolemaeën kwam Thebe meer dan eens in opstand; in de jaren 80 v.Chr. sloeg Ptolemaeus IX een opstand zo hard neer dat er, zegt Pausanias, geen spoor van de oude welvaart overbleef. Strabo trof er slechts een groep dorpen aan. Een aardbeving, gewoonlijk gedateerd in 27 v.Chr., had een van de twee kolossen van Amenhotep III gebroken; van het gebroken beeld werd gezegd dat het eenmaal per dag een geluid voortbracht, en Romeinse bezoekers kwamen het horen en kerfden hun namen en verzen erin; keizer Hadrianus kwam in 130 n.Chr. In de late oudheid vestigden christelijke monniken zich in de oude graven en tempels."
  cs:
    - "Théby stály na obou březích Nilu v Horním Egyptě, asi 500 km jižně od Káhiry, kde je dnes Luxor. Egypťané je nazývali Waset, Řekové Théby a hebrejská Bible No nebo No-Amón, město Amonovo. Bylo to provinční město, dokud jeho knížata z XI. dynastie nesjednotila Egypt pod Mentuhotepem II. v 21. stol. př. n. l. Od té doby Amon thébský vystoupil na hlavního boha země a král za králem rozšiřoval jeho chrám v Karnaku po dobu asi dvou tisíc let."
    - "V Nové říši (asi 1550–1070 př. n. l.) byly Théby náboženským hlavním městem říše. Jejich králové stavěli chrámy Karnaku a Luxoru na východním břehu a své pohřební chrámy na západním, mezi nimi chrám Hatšepsut v Dér el-Bahrí, a byli pohřbíváni v Údolí králů, kde Howard Carter roku 1922 našel hrobku Tutanchamonovu. Homér mluví o egyptských Thébách jako o nejbohatším městě na světě, se sty branami."
    - "V roce 664 nebo 663 př. n. l. pronásledoval asyrský král Aššurbanipal kúšského krále Tanutamona do Théb, město dobyl a odvezl jeho poklady, mezi nimi dva obelisky. Nachum připomíná Ninive tento pád: „Což by se tobě lépe díti mělo, nežli No lidnému … A však i to v přestěhování přišlo a v zajetí“. Jeremjáš předpověděl, že Bůh potrestá zástup No spolu s faraonem, a Ezechiel, že vykoná soudy v No."
    - "Za Ptolemaiovců se Théby několikrát vzbouřily; v 80. letech př. n. l. potlačil Ptolemaios IX. povstání tak tvrdě, říká Pausaniás, že po dřívější prosperitě nezůstala stopa. Strabón našel jen skupinu vesnic. Zemětřesení, obvykle datované do roku 27 př. n. l., rozlomilo jednoho ze dvou kolosů Amenhotepa III.; o rozlomené soše se říkalo, že jednou denně vydá zvuk, a římští návštěvníci přicházeli poslouchat a vyrývali na ni svá jména a verše; císař Hadrianus přišel roku 130 n. l. V pozdní antice se křesťanští mniši usadili ve starých hrobkách a chrámech."
  sv:
    - "Thebe låg på båda sidor av Nilen i Övre Egypten, omkring 500 km söder om Kairo, där Luxor ligger i dag. Egyptierna kallade det Waset, grekerna Thebe, och den hebreiska Bibeln No eller No-Amon, Amons stad. Det var en landsortsstad tills dess furstar i elfte dynastin återförenade Egypten under Mentuhotep II på 2000-talet f.Kr. Från och med då steg Amon av Thebe till landets främsta gud, och kung efter kung utvidgade hans tempel i Karnak i omkring två tusen år."
    - "Under Nya riket (ca 1550–1070 f.Kr.) var Thebe ett imperiums religiösa huvudstad. Dess kungar byggde templen i Karnak och Luxor på östra stranden och sina gravtempel på västra, bland dem Hatshepsuts i Deir el-Bahari, och begravdes i Konungarnas dal, där Howard Carter fann Tutankhamons grav 1922. Homeros talar om det egyptiska Thebe som världens rikaste stad, med hundra portar."
    - "År 664 eller 663 f.Kr. förföljde den assyriske kungen Assurbanipal den kushitiske kungen Tanutamon till Thebe, intog staden och förde bort dess skatter, bland dem två obelisker. Nahum påminner Nineve om det fallet: ”Är du då bättre än No-Amon … Också hon måste ju gå i landsflykt och fångenskap.” Jeremia förutsade att Gud skulle straffa Nos hop tillsammans med Farao, och Hesekiel att han skulle utföra domar i No."
    - "Under ptolemeerna gjorde Thebe uppror flera gånger; på 80-talet f.Kr. slog Ptolemaios IX ned ett uppror så hårt, säger Pausanias, att inget spår av dess gamla välstånd återstod. Strabon fann bara en grupp byar. En jordbävning, vanligen daterad till 27 f.Kr., hade brutit sönder en av de två kolosserna av Amenhotep III; den trasiga statyn sades ge ifrån sig ett ljud en gång om dagen, och romerska besökare kom för att höra det och ristade in sina namn och verser på den; kejsar Hadrianus kom dit år 130 e.Kr. Under senantiken bosatte sig kristna munkar i de gamla gravarna och templen."
  nb:
    - "Teben lå på begge sider av Nilen i Øvre Egypt, omkring 500 km sør for Kairo, der Luxor ligger i dag. Egypterne kalte den Waset, grekerne Thebai, og Bibelen på hebraisk No eller No-Amon, Amons by. Den var en provinsby til fyrstene i det 11. dynastiet gjenforente Egypt under Mentuhotep II på 2000-tallet f.Kr. Fra da av steg Amon av Teben til å bli landets øverste gud, og konge etter konge utvidet tempelet hans i Karnak i omkring to tusen år."
    - "I Det nye riket (ca. 1550–1070 f.Kr.) var Teben hovedstad for et imperium og dets religiøse sentrum. Kongene bygde templene i Karnak og Luxor på østbredden og likhusene sine på vestbredden, blant dem Hatsjepsuts i Deir el-Bahari, og ble gravlagt i Kongenes dal, der Howard Carter fant Tutankhamons grav i 1922. Homer taler om det egyptiske Teben som den rikeste byen i verden, med hundre porter."
    - "I 664 eller 663 f.Kr. forfulgte den assyriske kongen Assurbanipal den kusjittiske kongen Tanutamon til Teben, inntok byen og førte bort skattene dens, blant dem to obelisker. Nahum minner Ninive om det fallet: «Mon du er bedre enn No-Amon … Også det måtte gå i landflyktighet som fange.» Jeremia forutsa at Gud ville straffe mengden i No sammen med Farao, og Esekiel at han ville holde dom over No."
    - "Under ptolemeerne gjorde Teben opprør mer enn én gang; på 80-tallet f.Kr. slo Ptolemaios IX ned et opprør så hardt, sier Pausanias, at det ikke var spor igjen av den gamle velstanden. Strabon fant bare en gruppe landsbyer. Et jordskjelv, vanligvis datert til 27 f.Kr., hadde brutt ned en av de to kolossene av Amenhotep III; den ødelagte statuen skulle gi fra seg en lyd én gang om dagen, og romerske besøkende kom for å høre den og risset navnene og versene sine inn i den; keiser Hadrian kom i 130 e.Kr. I sen antikk bosatte kristne munker seg i de gamle gravene og templene."
  tl:
    - "Ang Thebes ay nakatayo sa magkabilang pampang ng Nilo sa Mataas na Egipto, mga 500 km sa timog ng Cairo, kung nasaan ang Luxor ngayon. Tinawag ito ng mga Ehipsiyo na Waset, ng mga Griego na Thebes, at ng Biblia sa Hebreo na No o No-Amon, ang lunsod ni Amun. Isa itong bayan ng lalawigan hanggang sa muling pagsamahin ng mga prinsipe nitong Ika-labing-isang Dinastiya ang Egipto sa ilalim ni Mentuhotep II noong ika-21 siglo BK. Mula noon, umangat si Amun ng Thebes bilang pangunahing diyos ng lupain, at hari kasunod ng hari ang nagpalawak ng kaniyang templo sa Karnak sa loob ng halos dalawang libong taon."
    - "Sa Bagong Kaharian (c. 1550–1070 BK), ang Thebes ay ang relihiyosong kabisera ng isang imperyo. Itinayo ng mga hari nito ang mga templo ng Karnak at Luxor sa silangang pampang at ang kanilang mga templong pang-libing sa kanluran, kasama ang kay Hatshepsut sa Deir el-Bahari, at inilibing sila sa Libis ng mga Hari, kung saan natagpuan ni Howard Carter ang libingan ni Tutankhamun noong 1922. Sinasabi ni Homero na ang Thebes ng Egipto ang pinakamayamang lunsod sa mundo, na may isandaang pintuan."
    - "Noong 664 o 663 BK, hinabol ng haring Asirio na si Asurbanipal ang haring Kushita na si Tanutamon hanggang Thebes, sinakop ang lunsod at dinala ang mga kayamanan nito, kasama ang dalawang obelisko. Ipinaaalala ni Nahum sa Ninive ang pagbagsak na iyon: “Ikaw baga'y mabuti pa sa Noamon … Gayon ma'y siya'y nadala, siya'y pumasok sa pagkabihag.” Inihula ni Jeremias na parurusahan ng Diyos ang karamihan ng No kasama ni Faraon, at ni Ezekiel na maglalapat siya ng mga kahatulan sa No."
    - "Sa ilalim ng mga Ptolemeo, higit sa isang beses naghimagsik ang Thebes; noong dekada 80 BK, sinupil ni Ptolemeo IX ang isang paghihimagsik nang napakalupit, ayon kay Pausanias, na walang naiwang bakas ng dati nitong kasaganaan. Mga kumpol lamang ng nayon ang natagpuan ni Estrabon. Isang lindol, karaniwang pinepetsahan noong 27 BK, ang nakabasag sa isa sa dalawang colossus ni Amenhotep III; sinasabing naglalabas ng tunog minsan sa isang araw ang nabasag na estatwa, at pumunta ang mga bisitang Romano upang marinig ito at inukit ang kanilang mga pangalan at tula dito; dumating ang emperador na si Hadriano noong 130 AD. Sa huling panahon ng antigüedad, nanirahan ang mga monghe sa mga lumang libingan at templo."
  da:
    - "Theben lå på begge sider af Nilen i Øvre Egypten, omkring 500 km syd for Kairo, hvor Luxor ligger i dag. Egypterne kaldte den Waset, grækerne Theben og den hebraiske Bibel No eller No-Amon, Amons by. Den var en provinsby, indtil dens fyrster i 11. dynasti genforenede Egypten under Mentuhotep 2. i 2000-tallet f.Kr. Fra da af steg Amon af Theben til at blive landets hovedgud, og konge efter konge udvidede hans tempel i Karnak i omkring to tusind år."
    - "I Det Nye Rige (ca. 1550–1070 f.Kr.) var Theben et imperiums religiøse hovedstad. Dets konger byggede templerne i Karnak og Luxor på østbredden og deres dødetempler på vestbredden, blandt dem Hatshepsuts ved Deir el-Bahari, og blev begravet i Kongernes Dal, hvor Howard Carter fandt Tutankhamons grav i 1922. Homer taler om det egyptiske Theben som verdens rigeste by med hundrede porte."
    - "I 664 eller 663 f.Kr. forfulgte den assyriske konge Assurbanipal den kushitiske konge Tanutamon til Theben, indtog byen og bortførte dens skatte, blandt dem to obelisker. Nahum minder Nineve om det fald: »Mon du er bedre end No-Amon … Ogsaa denne blev bortført, den maatte gaa i Fangenskab.« Jeremias forudsagde, at Gud ville straffe mængden i No sammen med Farao, og Ezekiel, at han ville holde dom i No."
    - "Under ptolemæerne gjorde Theben oprør mere end én gang; i 80'erne f.Kr. slog Ptolemaios 9. et oprør ned så hårdt, siger Pausanias, at der ikke var spor tilbage af dens gamle velstand. Strabon fandt blot en gruppe landsbyer. Et jordskælv, sædvanligvis dateret til 27 f.Kr., havde knust en af de to kolosser af Amenhotep 3.; den knuste statue siges at give lyd fra sig én gang om dagen, og romerske besøgende kom for at høre den og indhuggede deres navne og vers på den; kejser Hadrian kom i 130 e.Kr. I senantikken bosatte kristne munke sig i de gamle grave og templer."
