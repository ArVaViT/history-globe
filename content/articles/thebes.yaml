# Overview article (ADR 0007). Mainstream facts only; Egyptian dates follow I. Shaw (ed.), The Oxford History of Ancient Egypt.
# The card is named «Но» (Synodal); the article is titled with the usual name «Фивы», and its first sentence ties the two.
id: thebes
place: a9674fc
title:
  en: "Thebes"
  ru: "Фивы"
  uk: "Фіви"
  es: "Tebas"
  pt: "Tebas"
  de: "Theben"
  fr: "Thèbes"
body:
  en:
    - "Thebes stood on both banks of the Nile in Upper Egypt, about 500 km south of Cairo, where Luxor is today. The Egyptians called it Waset, the Greeks Thebes, and the Hebrew Bible No or No-Amon, the city of Amun. It was a provincial town until its princes of the Eleventh Dynasty reunited Egypt under Mentuhotep II in the twenty-first century BC. From then on Amun of Thebes rose to be the chief god of the land, and king after king enlarged his temple at Karnak for some two thousand years."
    - "In the New Kingdom (c. 1550–1070 BC) Thebes was the religious capital of an empire. Its kings built the temples of Karnak and Luxor on the east bank and their mortuary temples on the west, among them Hatshepsut's at Deir el-Bahari, and were buried in the Valley of the Kings, where Howard Carter found the tomb of Tutankhamun in 1922. Homer speaks of Egyptian Thebes as the richest city in the world, with a hundred gates."
    - 'In 664 or 663 BC the Assyrian king Ashurbanipal pursued the Kushite king Tanutamon to Thebes, took the city and carried off its treasures, among them two obelisks. Nahum reminds Nineveh of that fall: "Art thou better than populous No ... Yet was she carried away, she went into captivity." Jeremiah foretold that God would punish the multitude of No together with Pharaoh, and Ezekiel that he would execute judgments in No.'
    - "Under the Ptolemies Thebes rebelled more than once; in the 80s BC Ptolemy IX put down a revolt so harshly, Pausanias says, that no trace of its old prosperity was left. Strabo found only a group of villages. An earthquake, usually dated 27 BC, had broken one of the two colossi of Amenhotep III; the broken statue was said to give out a sound once a day, and Roman visitors came to hear it and carved their names and verses on it; the emperor Hadrian came in AD 130. In late antiquity Christian monks settled in the old tombs and temples."
  ru:
    - "Фивы, библейский Но, стояли на обоих берегах Нила в Верхнем Египте, примерно в 500 км к югу от Каира, там, где теперь Луксор. Египтяне называли город Уасет, греки — Фивами, а еврейская Библия — Но или Но-Аммон, то есть город Амона. Это был провинциальный город, пока его правители из XI династии не объединили Египет вновь при Ментухотепе II в XXI веке до н. э. С тех пор Амон Фиванский стал главным богом страны, а его храм в Карнаке цари расширяли около двух тысяч лет."
    - "В эпоху Нового царства (ок. 1550–1070 гг. до н. э.) Фивы были религиозной столицей державы. Цари строили храмы Карнака и Луксора на восточном берегу, а на западном — свои поминальные храмы, среди них храм Хатшепсут в Дейр-эль-Бахри, и погребались в Долине царей, где в 1922 г. Говард Картер нашёл гробницу Тутанхамона. Гомер говорит о египетских Фивах как о богатейшем городе мира со ста воротами."
    - "В 664 или 663 г. до н. э. ассирийский царь Ашшурбанапал преследовал кушитского царя Тануатамона до Фив, взял город и увёз его сокровища, среди них два обелиска. Наум напоминает Ниневии об этом падении: «Разве ты лучше Но-Аммона... Но и он переселен, пошел в плен». Иеремия предрекал, что Бог посетит Аммона, который в Но, вместе с фараоном, а Иезекииль — что Он произведёт суд над Но."
    - "При Птолемеях Фивы не раз восставали; в 80-х годах до н. э. Птолемей IX подавил восстание так жестоко, говорит Павсаний, что от былого процветания не осталось и следа. Страбон застал здесь лишь несколько деревень. Землетрясение, которое обычно датируют 27 г. до н. э., повредило один из двух колоссов Аменхотепа III; о повреждённой статуе говорили, что раз в день она издаёт звук, и римские путешественники приходили его послушать и вырезали на ней свои имена и стихи; в 130 г. н. э. сюда приезжал император Адриан. В поздней античности в старых гробницах и храмах поселились христианские монахи."
  uk:
    - "Фіви стояли на обох берегах Нілу у Верхньому Єгипті, приблизно за 500 км на південь від Каїра, де нині Луксор. Єгиптяни називали їх Васет, греки — Фіви, а староєврейська Біблія — Но, або Но-Амон, місто Амона. Це було провінційне місто, доки його князі XI династії не об’єднали Єгипет під Ментухотепом II у XXI ст. до н. е. Відтоді Амон Фіванський піднісся до головного бога країни, і цар за царем розбудовували його храм у Карнаку близько двох тисяч років."
    - "За Нового царства (бл. 1550–1070 рр. до н. е.) Фіви були релігійною столицею імперії. Їхні царі збудували храми Карнака й Луксора на східному березі та свої заупокійні храми на західному, серед них храм Хатшепсут у Дейр-ель-Бахрі, і були поховані в Долині царів, де Говард Картер 1922 року знайшов гробницю Тутанхамона. Гомер говорить про єгипетські Фіви як про найбагатше місто світу, зі ста брамами."
    - "У 664 чи 663 р. до н. е. ассірійський цар Ашшурбаніпал переслідував кушитського царя Танутамона до Фів, узяв місто й вивіз його скарби, серед них два обеліски. Наум нагадує Ніневії про те падіння: «Хиба ж ти лучша за Но-Аммон … Та й він буде переселений, пійде в неволю». Єремія провістив, що Бог покарає безліч Но разом з фараоном, а Єзекіїль — що вчинить суд у Но."
    - "За Птолемеїв Фіви повставали не раз; у 80-х роках до н. е. Птолемей IX придушив повстання так жорстоко, каже Павсаній, що від колишнього добробуту не лишилося й сліду. Страбон застав лише купку сіл. Землетрус, який зазвичай датують 27 р. до н. е., розколов один із двох колосів Аменхотепа III; зламана статуя, як казали, видавала звук раз на день, і римські відвідувачі приходили послухати й вирізали на ній свої імена та вірші; імператор Адріан прибув 130 р. н. е. У пізню давнину християнські ченці оселилися в давніх гробницях і храмах."
  es:
    - "Tebas se extendía en ambas orillas del Nilo, en el Alto Egipto, a unos 500 km al sur de El Cairo, donde hoy está Luxor. Los egipcios la llamaban Uaset, los griegos Tebas y la Biblia hebrea No o No-amón, la ciudad de Amón. Fue una ciudad provincial hasta que sus príncipes de la dinastía XI reunificaron Egipto bajo Mentuhotep II en el siglo XXI a. C. Desde entonces Amón de Tebas ascendió hasta ser el dios principal del país, y rey tras rey amplió su templo de Karnak durante unos dos mil años."
    - "En el Reino Nuevo (h. 1550–1070 a. C.) Tebas fue la capital religiosa de un imperio. Sus reyes construyeron los templos de Karnak y Luxor en la orilla este y sus templos funerarios en la oeste, entre ellos el de Hatshepsut en Deir el-Bahari, y fueron enterrados en el Valle de los Reyes, donde Howard Carter halló la tumba de Tutankamón en 1922. Homero habla de la Tebas egipcia como la ciudad más rica del mundo, con cien puertas."
    - "En 664 o 663 a. C. el rey asirio Asurbanipal persiguió hasta Tebas al rey cusita Tanutamón, tomó la ciudad y se llevó sus tesoros, entre ellos dos obeliscos. Nahum recuerda a Nínive aquella caída: «¿Eres tú mejor que No-amón … También ella fué llevada en cautiverio». Jeremías anunció que Dios castigaría a la multitud de No junto con el faraón, y Ezequiel que ejecutaría juicios en No."
    - "Bajo los Ptolomeos Tebas se rebeló más de una vez; en los años 80 a. C. Ptolomeo IX sofocó una revuelta con tal dureza, dice Pausanias, que no quedó rastro de su antigua prosperidad. Estrabón solo halló un conjunto de aldeas. Un terremoto, fechado habitualmente en 27 a. C., había roto uno de los dos colosos de Amenhotep III; se decía que la estatua rota emitía un sonido una vez al día, y los visitantes romanos acudían a oírlo y grababan en ella sus nombres y versos; el emperador Adriano fue en 130 d. C. En la Antigüedad tardía, monjes cristianos se establecieron en las antiguas tumbas y templos."
  pt:
    - "Tebas ficava nas duas margens do Nilo, no Alto Egito, a cerca de 500 km ao sul do Cairo, onde hoje está Luxor. Os egípcios a chamavam Waset, os gregos Tebas e a Bíblia hebraica Nô ou Nô-Amom, a cidade de Amom. Era uma cidade provincial até que seus príncipes da XI Dinastia reunificaram o Egito sob Mentuhotep II, no século XXI a.C. Dali em diante Amom de Tebas ergueu-se a principal deus da terra, e rei após rei ampliou seu templo em Karnak por cerca de dois mil anos."
    - "No Reino Novo (c. 1550–1070 a.C.), Tebas foi a capital religiosa de um império. Seus reis construíram os templos de Karnak e Luxor na margem leste e seus templos funerários na oeste, entre eles o de Hatshepsut em Deir el-Bahari, e foram sepultados no Vale dos Reis, onde Howard Carter achou o túmulo de Tutancâmon em 1922. Homero fala da Tebas egípcia como a cidade mais rica do mundo, com cem portas."
    - "Em 664 ou 663 a.C., o rei assírio Assurbanípal perseguiu o rei cuxita Tanutamon até Tebas, tomou a cidade e levou seus tesouros, entre eles dois obeliscos. Naum lembra Nínive dessa queda: “Você é melhor do que Nô-Amom … Contudo, ela foi levada. Ela foi para o cativeiro.” Jeremias predisse que Deus castigaria a multidão de Nô junto com o Faraó, e Ezequiel que executaria juízos em Nô."
    - "Sob os ptolomeus, Tebas se rebelou mais de uma vez; nos anos 80 a.C., Ptolomeu IX sufocou uma revolta de modo tão duro, diz Pausânias, que não restou vestígio de sua antiga prosperidade. Estrabão encontrou apenas um conjunto de aldeias. Um terremoto, geralmente datado de 27 a.C., havia quebrado um dos dois colossos de Amenhotep III; dizia-se que a estátua quebrada emitia um som uma vez por dia, e visitantes romanos vinham ouvi-lo e gravaram nela seus nomes e versos; o imperador Adriano veio em 130 d.C. Na Antiguidade tardia, monges cristãos se instalaram nos antigos túmulos e templos."
  de:
    - "Theben lag an beiden Ufern des Nils in Oberägypten, etwa 500 km südlich von Kairo, wo heute Luxor liegt. Die Ägypter nannten es Waset, die Griechen Theben und die hebräische Bibel No oder No-Amon, die Stadt des Amun. Es war eine Provinzstadt, bis seine Fürsten der Elften Dynastie unter Mentuhotep II. im einundzwanzigsten Jahrhundert v. Chr. Ägypten wiedervereinigten. Seither stieg Amun von Theben zum obersten Gott des Landes auf, und König um König erweiterte seinen Tempel in Karnak etwa zweitausend Jahre lang."
    - "Im Neuen Reich (ca. 1550–1070 v. Chr.) war Theben die religiöse Hauptstadt eines Weltreichs. Seine Könige bauten die Tempel von Karnak und Luxor am Ostufer und ihre Totentempel am Westufer, darunter den der Hatschepsut in Deir el-Bahari, und wurden im Tal der Könige begraben, wo Howard Carter 1922 das Grab des Tutanchamun fand. Homer spricht vom ägyptischen Theben als der reichsten Stadt der Welt mit hundert Toren."
    - "664 oder 663 v. Chr. verfolgte der assyrische König Assurbanipal den kuschitischen König Tanutamun bis Theben, nahm die Stadt ein und führte ihre Schätze fort, darunter zwei Obelisken. Nahum erinnert Ninive an diesen Fall: „Meinst du, du seist besser denn die Stadt No-Amon … Doch hat sie müssen vertrieben werden und gefangen wegziehen.“ Jeremia kündigte an, Gott werde die Menge von No samt dem Pharao heimsuchen, und Hesekiel, dass er in No Gerichte vollziehen werde."
    - "Unter den Ptolemäern erhob sich Theben mehrfach; in den 80er Jahren v. Chr. schlug Ptolemaios IX. einen Aufstand so hart nieder, sagt Pausanias, dass keine Spur des alten Wohlstands blieb. Strabon fand nur eine Gruppe von Dörfern. Ein Erdbeben, meist auf 27 v. Chr. datiert, hatte einen der beiden Kolosse Amenophis' III. zerbrochen; die zerbrochene Statue soll einmal am Tag einen Klang von sich gegeben haben, und römische Besucher kamen, ihn zu hören, und ritzten ihre Namen und Verse hinein; Kaiser Hadrian kam im Jahr 130 n. Chr. In der Spätantike ließen sich christliche Mönche in den alten Gräbern und Tempeln nieder."
  fr:
    - "Thèbes s’étendait sur les deux rives du Nil en Haute-Égypte, à environ 500 km au sud du Caire, là où se trouve aujourd’hui Louxor. Les Égyptiens l’appelaient Ouaset, les Grecs Thèbes, et la Bible hébraïque No ou No-Amon, la ville d’Amon. Ce fut une ville de province jusqu’à ce que ses princes de la XIe dynastie réunifient l’Égypte sous Montouhotep II au XXIe siècle av. J.-C. Dès lors, Amon de Thèbes devint le dieu principal du pays, et roi après roi agrandit son temple de Karnak pendant quelque deux mille ans."
    - "Au Nouvel Empire (vers 1550-1070 av. J.-C.), Thèbes fut la capitale religieuse d’un empire. Ses rois y bâtirent les temples de Karnak et de Louxor sur la rive est et leurs temples funéraires sur la rive ouest, dont celui d’Hatchepsout à Deir el-Bahari, et furent enterrés dans la Vallée des Rois, où Howard Carter trouva en 1922 la tombe de Toutânkhamon. Homère parle de la Thèbes d’Égypte comme de la ville la plus riche du monde, aux cent portes."
    - "En 664 ou 663 av. J.-C., le roi assyrien Assurbanipal poursuivit à Thèbes le roi koushite Tanoutamon, prit la ville et emporta ses trésors, dont deux obélisques. Nahum rappelle cette chute à Ninive : « Es-tu meilleure que No-Amon … Et cependant elle est partie pour l’exil, elle s’en est allée captive ». Jérémie annonça que Dieu châtierait Amon de No avec Pharaon, et Ézéchiel qu’il exercerait ses jugements sur No."
    - "Sous les Ptolémées, Thèbes se révolta plus d’une fois ; dans les années 80 av. J.-C., Ptolémée IX écrasa une révolte si durement, dit Pausanias, qu’il ne resta rien de son ancienne prospérité. Strabon n’y trouva qu’un groupe de villages. Un séisme, d’ordinaire daté de 27 av. J.-C., avait brisé l’un des deux colosses d’Amenhotep III ; la statue brisée passait pour émettre un son une fois par jour, et des visiteurs romains vinrent l’entendre et y gravèrent leurs noms et des vers ; l’empereur Hadrien y vint en 130 apr. J.-C. À la fin de l’Antiquité, des moines chrétiens s’installèrent dans les anciennes tombes et les anciens temples."
