# Overview article (ADR 0007). Mainstream facts only; dates of the fall of Assyria follow the Babylonian Chronicle.
id: haran
place: a6d9af3
title:
  en: "Haran"
  ru: "Харран"
  uk: "Харан"
  es: "Harán"
  pt: "Harã"
  de: "Haran"
  fr: "Haran"
  pl: "Charan"
  it: "Carran"
