body:
  en:
    - 'Haran lay in upper Mesopotamia on the Balikh, a tributary of the Euphrates, at the site of Harran in south-eastern Turkey, about 40 km south-east of Urfa. Its name means "road" in Akkadian, fitting a town where the routes from Mesopotamia to Syria and Anatolia crossed. It was famed as the city of the moon god Sin, whose temple was called Ehulhul. Under the Assyrian empire it was a provincial centre.'
    - "Genesis tells that Terah came to Haran with Abram, Sarai and Lot on the way from Ur of the Chaldees to Canaan, and died there. Abram was seventy and five years old when he departed out of Haran. Later Jacob fled to his uncle Laban in Haran and served him for his wives. Sennacherib's envoys to Hezekiah named Haran among the lands their kings had destroyed, Ezekiel lists its merchants among those who traded with Tyre, and Stephen recalled Abraham's stay in Charran."
    - "After Nineveh fell in 612 BC, Ashur-uballit II took the throne in Harran as the last king of Assyria. In 610 BC the Babylonians and the Medes marched on the city; the Assyrians and their Egyptian allies abandoned it, and it was taken. A year later Ashur-uballit and an Egyptian army tried in vain to retake it, as the Babylonian Chronicle records. Nabonidus, the last king of Babylon, rebuilt the temple of Sin."
    - "The Greeks and Romans called the town Carrhae. Near it in 53 BC the Parthians routed the army of Crassus, who was killed soon after. In AD 217 the emperor Caracalla was murdered on the road from Edessa to Carrhae, and in 363 Julian stopped there on his way to Persia to sacrifice to the moon. The pilgrim Egeria, about 384, was shown a church outside the walls on the site of Abraham's house, but found scarcely a Christian in the city apart from clergy and monks: Harran long kept its old worship."
  ru:
    - "Харран лежал в северной Месопотамии на реке Белих, притоке Евфрата, там, где теперь Харран на юго-востоке Турции, примерно в 40 км к юго-востоку от Урфы. Его имя по-аккадски означает «дорога»: здесь сходились пути из Месопотамии в Сирию и Анатолию. Он славился как город бога луны Сина, чей храм назывался Эхульхуль. В Ассирийской державе Харран был центром провинции."
    - "Книга Бытия рассказывает, что Фарра пришёл в Харран с Аврамом, Сарой и Лотом по пути из Ура Халдейского в землю Ханаанскую и умер там. Аврам был семидесяти пяти лет, когда вышел из Харрана. Позже Иаков бежал в Харран к своему дяде Лавану и служил ему за своих жён. Послы Сеннахирима к Езекии называли Харран среди земель, разорённых их царями, Иезекииль упоминает его купцов среди торговавших с Тиром, а Стефан вспоминал о пребывании Авраама в Харране."
    - "После падения Ниневии в 612 г. до н. э. в Харране воцарился последний царь Ассирии Ашшур-убаллит II. В 610 г. до н. э. вавилоняне и мидяне двинулись на город; ассирийцы и их египетские союзники оставили его, и он был взят. Через год Ашшур-убаллит с египетским войском тщетно пытался отвоевать его, как сообщает Вавилонская хроника. Набонид, последний царь Вавилона, отстроил храм Сина."
    - "Греки и римляне называли город Карры. Близ него в 53 г. до н. э. парфяне разгромили войско Красса, который вскоре был убит. В 217 г. н. э. по дороге из Эдессы в Карры был убит император Каракалла, а в 363 г. Юлиан по пути в Персию остановился здесь, чтобы принести жертву луне. Паломнице Эгерии около 384 г. показали церковь за городом, на месте дома Авраама, но кроме клириков и монахов она не нашла в городе почти ни одного христианина: Харран долго хранил старую веру."
  uk:
    - "Харан лежав у верхній Месопотамії на Балиху, притоці Євфрату, на місці Харрана на південному сході Туреччини, приблизно за 40 км на південний схід від Урфи. Його назва означає в аккадській «дорога», що пасує містові, де перетиналися шляхи з Месопотамії до Сирії та Анатолії. Він славився як місто бога місяця Сіна, чий храм звався Ехулхул. За Ассирійської імперії це був провінційний центр."
    - "Книга Буття розповідає, що Тарах прийшов до Харану з Аврамом, Сарою й Лотом дорогою з Ура Халдейського до Ханаану і помер там. Авраму було сімдесят п’ять років, коли він вийшов із Харану. Пізніше Яків утік до свого дядька Лавана в Харан і служив йому за дружин. Посланці Сінаххеріба до Єзекії назвали Харан серед земель, які зруйнували їхні царі, Єзекіїль зараховує його купців до тих, що торгували з Тіром, а Стефан згадав перебування Авраама в Харані."
    - "Після падіння Ніневії 612 р. до н. е. Ашшур-убаллит II сів на трон у Харані як останній цар Ассирії. 610 р. до н. е. вавилоняни й мідяни рушили на місто; ассирійці та їхні єгипетські союзники покинули його, і воно було взяте. Через рік Ашшур-убаллит і єгипетське військо марно намагалися його відвоювати, як записано у Вавилонській хроніці. Набонід, останній цар Вавилона, відбудував храм Сіна."
    - "Греки й римляни називали місто Карри. Біля нього 53 р. до н. е. парфяни розгромили військо Красса, якого невдовзі вбили. 217 року н. е. імператора Каракаллу вбили на дорозі з Едеси до Карр, а 363 року Юліан зупинився там дорогою до Персії, щоб принести жертву місяцеві. Паломниці Егерії близько 384 року показали церкву за межами мурів на місці дому Авраама, але в місті вона ледве знайшла християн, окрім кліру й монахів: Харан довго зберігав своє старе богослужіння."
  es:
    - "Harán se hallaba en la Alta Mesopotamia, en el Balij, afluente del Éufrates, en el sitio de Harrán, en el sudeste de Turquía, a unos 40 km al sudeste de Urfa. Su nombre significa «camino» en acadio, lo que cuadra con una ciudad donde se cruzaban las rutas de Mesopotamia a Siria y Anatolia. Era famosa como la ciudad del dios lunar Sin, cuyo templo se llamaba Ehulhul. Bajo el imperio asirio fue un centro provincial."
    - "El Génesis cuenta que Tara llegó a Harán con Abram, Sarai y Lot de camino desde Ur de los Caldeos a Canaán, y murió allí. Abram tenía setenta y cinco años cuando salió de Harán. Más tarde Jacob huyó a casa de su tío Labán en Harán y le sirvió por sus mujeres. Los enviados de Senaquerib a Ezequías nombraron a Harán entre las tierras que sus reyes habían destruido, Ezequiel enumera a sus mercaderes entre los que comerciaban con Tiro, y Esteban recordó la estancia de Abraham en Carán."
    - "Tras la caída de Nínive en el 612 a. C., Assur-uballit II tomó el trono en Harrán como último rey de Asiria. En el 610 a. C. los babilonios y los medos marcharon sobre la ciudad; los asirios y sus aliados egipcios la abandonaron, y fue tomada. Un año después Assur-uballit y un ejército egipcio intentaron en vano recuperarla, como registra la Crónica babilónica. Nabónido, el último rey de Babilonia, reconstruyó el templo de Sin."
    - "Griegos y romanos llamaron a la ciudad Carras. Cerca de ella, en el 53 a. C., los partos derrotaron al ejército de Craso, que murió poco después. En el 217 d. C. el emperador Caracalla fue asesinado en el camino de Edesa a Carras, y en el 363 Juliano se detuvo allí, de camino a Persia, para sacrificar a la luna. La peregrina Egeria, hacia el 384, vio una iglesia fuera de las murallas, en el lugar de la casa de Abraham, pero apenas halló cristianos en la ciudad fuera de clérigos y monjes: Harrán conservó largo tiempo su antiguo culto."
  pt:
    - "Harã ficava na alta Mesopotâmia, no Balikh, afluente do Eufrates, no sítio de Harran, no sudeste da Turquia, a cerca de 40 km a sudeste de Urfa. Seu nome significa “estrada” em acádio, o que combina com uma cidade onde se cruzavam as rotas da Mesopotâmia para a Síria e a Anatólia. Era famosa como cidade do deus-lua Sin, cujo templo se chamava Ehulhul. Sob o império assírio foi um centro provincial."
    - "Gênesis conta que Terá chegou a Harã com Abrão, Sarai e Ló no caminho de Ur dos caldeus para Canaã, e ali morreu. Abrão tinha setenta e cinco anos quando partiu de Harã. Mais tarde Jacó fugiu para seu tio Labã em Harã e o serviu por suas mulheres. Os enviados de Senaqueribe a Ezequias nomearam Harã entre as terras que seus reis haviam destruído, Ezequiel lista seus mercadores entre os que comerciavam com Tiro, e Estêvão recordou a estada de Abraão em Harã."
    - "Depois da queda de Nínive em 612 a.C., Assur-uballit II assumiu o trono em Harã como último rei da Assíria. Em 610 a.C., babilônios e medos marcharam sobre a cidade; os assírios e seus aliados egípcios a abandonaram, e ela foi tomada. Um ano depois Assur-uballit e um exército egípcio tentaram em vão retomá-la, como registra a Crônica Babilônica. Nabônido, o último rei da Babilônia, reconstruiu o templo de Sin."
    - "Gregos e romanos chamavam a cidade Carras. Perto dela, em 53 a.C., os partas derrotaram o exército de Crasso, que foi morto pouco depois. Em 217 d.C., o imperador Caracala foi assassinado na estrada de Edessa a Carras, e em 363 Juliano parou ali a caminho da Pérsia para sacrificar à lua. A peregrina Egéria, por volta de 384, foi levada a ver uma igreja fora das muralhas no lugar da casa de Abraão, mas quase não achou cristãos na cidade além de clérigos e monges: Harã conservou por muito tempo o seu antigo culto."
  de:
    - "Haran lag in Obermesopotamien am Balich, einem Nebenfluss des Euphrat, an der Stätte von Harran im Südosten der Türkei, etwa 40 km südöstlich von Urfa. Sein Name bedeutet auf Akkadisch „Straße“, passend für eine Stadt, in der sich die Wege von Mesopotamien nach Syrien und Anatolien kreuzten. Es war berühmt als Stadt des Mondgottes Sin, dessen Tempel Ehulhul hieß. Unter dem assyrischen Reich war es ein Provinzzentrum."
    - "Das erste Buch Mose erzählt, dass Tarach mit Abram, Sarai und Lot auf dem Weg von Ur in Chaldäa nach Kanaan nach Haran kam und dort starb. Abram war fünfundsiebzig Jahre alt, als er aus Haran zog. Später floh Jakob zu seinem Onkel Laban nach Haran und diente ihm um seine Frauen. Sanheribs Gesandte an Hiskia nannten Haran unter den Ländern, die ihre Könige zerstört hatten, Hesekiel führt seine Kaufleute unter denen auf, die mit Tyrus Handel trieben, und Stephanus erinnerte an Abrahams Aufenthalt in Haran."
    - "Nach dem Fall Ninives 612 v. Chr. bestieg Aššur-uballit II. in Harran den Thron als letzter König Assyriens. 610 v. Chr. zogen die Babylonier und Meder gegen die Stadt; die Assyrer und ihre ägyptischen Verbündeten gaben sie auf, und sie wurde eingenommen. Ein Jahr später versuchten Aššur-uballit und ein ägyptisches Heer vergeblich, sie zurückzuerobern, wie die Babylonische Chronik verzeichnet. Nabonid, der letzte König Babylons, baute den Tempel des Sin wieder auf."
    - "Die Griechen und Römer nannten die Stadt Carrhae. In ihrer Nähe schlugen 53 v. Chr. die Parther das Heer des Crassus, der bald darauf getötet wurde. Im Jahr 217 n. Chr. wurde Kaiser Caracalla auf der Straße von Edessa nach Carrhae ermordet, und 363 hielt Julian dort auf dem Weg nach Persien an, um dem Mond zu opfern. Der Pilgerin Egeria wurde um 384 außerhalb der Mauern eine Kirche an der Stelle von Abrahams Haus gezeigt, doch sie fand in der Stadt kaum einen Christen außer Geistlichen und Mönchen: Harran bewahrte lange seinen alten Kult."
  fr:
    - "Haran se trouvait en haute Mésopotamie, sur le Balikh, affluent de l’Euphrate, sur le site de Harran, dans le sud-est de la Turquie, à environ 40 km au sud-est d’Urfa. Son nom signifie « route » en akkadien, ce qui convient à une ville où se croisaient les routes de Mésopotamie vers la Syrie et l’Anatolie. Elle était célèbre comme la ville du dieu-lune Sin, dont le temple s’appelait Ehulhul. Sous l’empire assyrien, c’était un centre provincial."
    - "La Genèse raconte que Térach vint à Haran avec Abram, Saraï et Lot en allant d’Ur en Chaldée vers Canaan, et y mourut. Abram avait soixante-quinze ans quand il sortit de Haran. Plus tard, Jacob s’enfuit chez son oncle Laban à Haran et le servit pour ses épouses. Les envoyés de Sanchérib à Ézéchias nommèrent Haran parmi les pays que leurs rois avaient détruits, Ézéchiel range ses marchands parmi ceux qui trafiquaient avec Tyr, et Étienne rappela le séjour d’Abraham à Charran."
    - "Après la chute de Ninive en 612 av. J.-C., Assur-uballit II prit le trône à Haran comme dernier roi d’Assyrie. En 610 av. J.-C., les Babyloniens et les Mèdes marchèrent sur la ville ; les Assyriens et leurs alliés égyptiens l’abandonnèrent, et elle fut prise. Un an plus tard, Assur-uballit et une armée égyptienne tentèrent en vain de la reprendre, comme le rapporte la Chronique babylonienne. Nabonide, dernier roi de Babylone, reconstruisit le temple de Sin."
    - "Les Grecs et les Romains appelaient la ville Carrhes. Près d’elle, en 53 av. J.-C., les Parthes mirent en déroute l’armée de Crassus, qui fut tué peu après. En 217 apr. J.-C., l’empereur Caracalla fut assassiné sur la route d’Édesse à Carrhes, et en 363 Julien s’y arrêta en route vers la Perse pour sacrifier à la lune. La pèlerine Égérie, vers 384, se fit montrer une église hors des murs sur le site de la maison d’Abraham, mais ne trouva guère de chrétiens dans la ville en dehors du clergé et des moines : Haran garda longtemps son ancien culte."
  pl:
    - "Charan leżał w górnej Mezopotamii nad Balichem, dopływem Eufratu, na miejscu Harranu w południowo-wschodniej Turcji, około 40 km na południowy wschód od Urfy. Jego nazwa znaczy w akadyjskim „droga”, co pasuje do miasta, w którym krzyżowały się szlaki z Mezopotamii do Syrii i Anatolii. Słynął jako miasto boga księżyca Sina, którego świątynia nazywała się Ehulhul. Pod imperium asyryjskim był ośrodkiem prowincji."
    - "Księga Rodzaju opowiada, że Terach przybył do Charanu z Abramem, Saraj i Lotem w drodze z Ur Chaldejskiego do Kanaanu i tam umarł. Abram miał siedemdziesiąt pięć lat, gdy wyszedł z Charanu. Później Jakub uciekł do swego wuja Labana w Charanie i służył mu za żony. Posłowie Sennacheryba do Ezechiasza wymienili Charan wśród krain zniszczonych przez ich królów, Ezechiel zalicza jego kupców do tych, którzy handlowali z Tyrem, a Szczepan przypomniał pobyt Abrahama w Charran."
    - "Po upadku Niniwy w 612 r. p.n.e. Aszur-uballit II objął tron w Charanie jako ostatni król Asyrii. W 610 r. p.n.e. Babilończycy i Medowie ruszyli na miasto; Asyryjczycy i ich egipscy sprzymierzeńcy opuścili je i zostało zdobyte. Rok później Aszur-uballit i armia egipska próbowali je daremnie odzyskać, jak zapisuje Kronika babilońska. Nabonid, ostatni król Babilonu, odbudował świątynię Sina."
    - "Grecy i Rzymianie nazywali miasto Carrhae. Pod nim w 53 r. p.n.e. Partowie rozgromili wojsko Krassusa, który wkrótce zginął. W 217 r. n.e. cesarz Karakalla został zamordowany na drodze z Edessy do Carrhae, a w 363 r. Julian zatrzymał się tam w drodze do Persji, by złożyć ofiarę księżycowi. Pątniczce Egerii około 384 r. pokazano kościół poza murami na miejscu domu Abrahama, lecz w mieście prawie nie znalazła chrześcijan poza duchowieństwem i mnichami: Charan długo zachowywał dawny kult."
  it:
    - "Carran sorgeva nell’alta Mesopotamia sul Balikh, affluente dell’Eufrate, nel sito di Harran nella Turchia sud-orientale, circa 40 km a sud-est di Urfa. Il suo nome significa «strada» in accadico, adatto a una città dove si incrociavano le vie dalla Mesopotamia alla Siria e all’Anatolia. Era famosa come la città del dio lunare Sin, il cui tempio si chiamava Ehulhul. Sotto l’impero assiro fu un centro provinciale."
    - "La Genesi racconta che Tarach giunse a Carran con Abramo, Sarai e Lot sulla via da Ur dei Caldei a Canaan, e vi morì. Abramo aveva settantacinque anni quando partì da Carran. Più tardi Giacobbe fuggì dallo zio Labano a Carran e lo servì per ottenere le mogli. Gli inviati di Sennacherib a Ezechia nominarono Carran fra le terre che i loro re avevano distrutto, Ezechiele elenca i suoi mercanti fra quelli che commerciavano con Tiro, e Stefano ricordò il soggiorno di Abramo in Carran."
    - "Dopo la caduta di Ninive nel 612 a.C., Assur-uballit II prese il trono a Harran come ultimo re d’Assiria. Nel 610 a.C. Babilonesi e Medi marciarono sulla città; gli Assiri e i loro alleati egiziani l’abbandonarono, ed essa fu presa. Un anno dopo Assur-uballit e un esercito egizio tentarono invano di riprenderla, come registra la Cronaca babilonese. Nabonedo, ultimo re di Babilonia, ricostruì il tempio di Sin."
    - "I Greci e i Romani chiamavano la città Carre. Presso di essa nel 53 a.C. i Parti sbaragliarono l’esercito di Crasso, che fu ucciso poco dopo. Nel 217 d.C. l’imperatore Caracalla fu assassinato sulla strada da Edessa a Carre, e nel 363 Giuliano vi si fermò, in viaggio verso la Persia, per sacrificare alla luna. La pellegrina Egeria, verso il 384, fu condotta a vedere una chiesa fuori delle mura sul sito della casa di Abramo, ma non trovò quasi nessun cristiano in città oltre a chierici e monaci: Harran conservò a lungo il suo antico culto."
  nl:
    - "Haran lag in Boven-Mesopotamië aan de Balikh, een zijrivier van de Eufraat, op de plaats van Harran in Zuidoost-Turkije, ongeveer 40 km ten zuidoosten van Urfa. De naam betekent in het Akkadisch “weg”, passend bij een stad waar de routes van Mesopotamië naar Syrië en Anatolië elkaar kruisten. Zij was beroemd als de stad van de maangod Sin, wiens tempel Ehulhul heette. Onder het Assyrische rijk was zij een provinciaal centrum."
    - "Genesis vertelt dat Tarach met Abram, Sarai en Lot naar Haran kwam op weg van Ur in Chaldea naar Kanaän, en daar stierf. Abram was vijfenzeventig jaar oud toen hij uit Haran vertrok. Later vluchtte Jakob naar zijn oom Laban in Haran en diende hem voor zijn vrouwen. Sanheribs gezanten bij Chizkia noemden Haran onder de landen die hun koningen hadden vernietigd, Ezechiël noemt zijn kooplieden onder degenen die met Tyrus handel dreven, en Stefanus herinnerde aan Abrahams verblijf in Charran."
    - "Na de val van Nineve in 612 v.Chr. besteeg Assur-uballit II in Harran de troon als laatste koning van Assyrië. In 610 v.Chr. trokken de Babyloniërs en de Meden tegen de stad op; de Assyriërs en hun Egyptische bondgenoten verlieten haar, en zij werd ingenomen. Een jaar later probeerden Assur-uballit en een Egyptisch leger tevergeefs haar te heroveren, zoals de Babylonische Kroniek vermeldt. Nabonidus, de laatste koning van Babylon, herbouwde de tempel van Sin."
    - "De Grieken en Romeinen noemden de stad Carrhae. Daarbij versloegen de Parthen in 53 v.Chr. het leger van Crassus, die kort daarna werd gedood. In 217 n.Chr. werd keizer Caracalla vermoord op de weg van Edessa naar Carrhae, en in 363 hield Julianus er halt op weg naar Perzië om de maan te offeren. De pelgrim Egeria kreeg omstreeks 384 een kerk buiten de muren getoond op de plaats van Abrahams huis, maar trof in de stad nauwelijks een christen aan behalve geestelijken en monniken: Harran behield lang zijn oude eredienst."
  cs:
    - "Cháran ležel v horní Mezopotámii na Balichu, přítoku Eufratu, na místě Harranu v jihovýchodním Turecku, asi 40 km jihovýchodně od Urfy. Jeho jméno znamená v akkadštině „cesta“, což se hodí k městu, kde se křižovaly cesty z Mezopotámie do Sýrie a Anatolie. Proslul jako město boha měsíce Sína, jehož chrám se nazýval Ehulhul. Za asyrské říše byl provinčním střediskem."
    - "Genesis vypráví, že Tarach přišel do Chárana s Abramem, Sarai a Lotem na cestě z Ur Chaldejských do Kanaánu a tam zemřel. Abram byl v sedmdesáti pěti letech, když vyšel z Cháranu. Později Jákob utekl k strýci Labanovi do Chárana a sloužil mu za své ženy. Senacheribovi vyslanci k Chizkijášovi uvedli Cháran mezi země, které jejich králové zničili, Ezechiel řadí jeho obchodníky mezi ty, kdo obchodovali s Týrem, a Štěpán připomněl Abrahamův pobyt v Cháranu."
    - "Po pádu Ninive roku 612 př. n. l. se Aššur-uballit II. ujal trůnu v Chárane jako poslední král Asýrie. Roku 610 př. n. l. táhli na město Babylóňané a Médové; Asyřané a jejich egyptští spojenci je opustili a bylo dobyto. O rok později se Aššur-uballit a egyptské vojsko marně pokusili je znovu získat, jak zaznamenává Babylónská kronika. Nabonid, poslední babylonský král, obnovil chrám Sínův."
    - "Řekové a Římané nazývali město Karrhy. U něj roku 53 př. n. l. Parthové rozdrtili vojsko Crassa, který byl brzy poté zabit. Roku 217 n. l. byl císař Caracalla zavražděn na cestě z Edessy do Karrh a roku 363 se tam Julianus na cestě do Persie zastavil obětovat měsíci. Poutnici Egerii byl kolem roku 384 ukázán kostel před hradbami na místě Abrahamova domu, ale ve městě nenašla téměř žádného křesťana kromě duchovních a mnichů: Cháran dlouho zachovával své staré uctívání."
  sv:
    - "Harran låg i övre Mesopotamien vid Balikh, en biflod till Eufrat, på platsen för dagens Harran i sydöstra Turkiet, omkring 40 km sydost om Urfa. Namnet betyder ”väg” på akkadiska, passande för en stad där vägarna från Mesopotamien till Syrien och Anatolien korsades. Den var berömd som månguden Sins stad, vars tempel hette Ehulhul. Under det assyriska imperiet var den ett provinscentrum."
    - "Första Moseboken berättar att Tera kom till Harran med Abram, Sarai och Lot på vägen från det kaldeiska Ur till Kanaan, och dog där. Abram var sjuttiofem år gammal när han drog ut från Harran. Senare flydde Jakob till sin morbror Laban i Harran och tjänade honom för sina hustrur. Sanheribs sändebud till Hiskia nämnde Harran bland de länder som deras kungar hade förstört, Hesekiel räknar dess köpmän bland dem som drev handel med Tyros, och Stefanos påminde om Abrahams vistelse i Karran."
    - "Sedan Nineve fallit 612 f.Kr. tog Assur-uballit II tronen i Harran som Assyriens siste kung. År 610 f.Kr. tågade babylonierna och mederna mot staden; assyrierna och deras egyptiska bundsförvanter övergav den, och den intogs. Ett år senare försökte Assur-uballit och en egyptisk armé förgäves återta den, som Babyloniska krönikan berättar. Nabonid, Babylons siste kung, byggde upp Sins tempel."
    - "Greker och romare kallade staden Carrhae. Nära den slog parterna 53 f.Kr. Crassus armé, och Crassus dödades kort därefter. År 217 e.Kr. mördades kejsar Caracalla på vägen från Edessa till Carrhae, och 363 stannade Julianus där på väg till Persien för att offra till månen. Pilgrimen Egeria, omkring 384, visades en kyrka utanför murarna på platsen för Abrahams hus, men fann knappt någon kristen i staden utom präster och munkar: Harran behöll länge sin gamla gudsdyrkan."
  nb:
    - "Harran lå i Øvre Mesopotamia ved Balikh, en sideelv til Eufrat, på stedet for Harran i sørøstlige Tyrkia, omtrent 40 km sørøst for Urfa. Navnet betyr «vei» på akkadisk, noe som passer for en by der rutene fra Mesopotamia til Syria og Anatolia krysset hverandre. Den var berømt som byen til månegudden Sin, hvis tempel het Ehulhul. Under det assyriske riket var den et provinssenter."
    - "Første Mosebok forteller at Tarah kom til Harran med Abram, Sarai og Lot på veien fra Ur i Kaldea til Kanaan, og døde der. «Og Abram var fem og sytti år gammel da han drog ut fra Karan.» Senere flyktet Jakob til sin onkel Laban i Harran og tjente ham for sine hustruer. Sankeribs sendebud til Hiskia nevnte Harran blant landene deres konger hadde ødelagt, Esekiel oppfører dens kjøpmenn blant dem som handlet med Tyros, og Stefanus mintes Abrahams opphold i Harran."
    - "Etter at Ninive falt i 612 f.Kr., besteg Assur-uballit 2. tronen i Harran som Assyrias siste konge. I 610 f.Kr. marsjerte babylonerne og mederne mot byen; assyrerne og deres egyptiske allierte forlot den, og den ble inntatt. Et år senere forsøkte Assur-uballit og en egyptisk hær forgjeves å ta den tilbake, slik Den babylonske krønike forteller. Nabonid, Babylons siste konge, gjenoppbygde Sins tempel."
    - "Grekerne og romerne kalte byen Carrhae. Nær den slo partherne i 53 f.Kr. hæren til Crassus, som ble drept kort etter. I 217 e.Kr. ble keiser Caracalla myrdet på veien fra Edessa til Carrhae, og i 363 stanset Julian der på vei til Persia for å ofre til månen. Pilegrimen Egeria ble omkring 384 vist en kirke utenfor murene på stedet for Abrahams hus, men fant knapt en kristen i byen utenom geistlige og munker: Harran beholdt lenge sin gamle gudsdyrkelse."
  tl:
    - "Ang Haran ay nasa itaas na Mesopotamia sa Balikh, isang sanga ng Eufrates, sa pook ng Harran sa timog-silangang Turkey, mga 40 km sa timog-silangan ng Urfa. Ang pangalan nito ay nangangahulugang “daan” sa Akkadian, angkop sa isang bayan kung saan nagtatagpo ang mga ruta mula Mesopotamia patungong Siria at Anatolia. Bantog ito bilang lungsod ng diyos ng buwan na si Sin, na ang templo ay tinawag na Ehulhul. Sa ilalim ng imperyong Asirio ay sentro ito ng lalawigan."
    - "Isinasalaysay ng Genesis na dumating si Tara sa Haran kasama sina Abram, Sarai at Lot sa daan mula sa Ur ng mga Caldeo patungong Canaan, at namatay doon. Si Abram ay may pitong pu't limang taon, nang umalis sa Haran. Kalaunan ay tumakas si Jacob sa kaniyang tiyo na si Laban sa Haran at naglingkod sa kaniya dahil sa kaniyang mga asawa. Pinangalanan ng mga sugo ni Sennacherib kay Ezechias ang Haran sa mga lupaing winasak ng kanilang mga hari, inilista ni Ezekiel ang mga mangangalakal nito sa mga nakipagkalakalan sa Tiro, at ginunita ni Esteban ang pananatili ni Abraham sa Haran."
    - "Pagkabagsak ng Ninive noong 612 BK, naupo si Ashur-uballit II sa trono sa Haran bilang huling hari ng Asiria. Noong 610 BK ay lumusob ang mga Babilonio at mga Medo sa lungsod; iniwan ito ng mga Asirio at ng kanilang kaalyadong Egipcio, at nasakop ito. Isang taon pagkaraan, sinubukan ni Ashur-uballit at ng isang hukbong Egipcio na bawiin ito ngunit nabigo, gaya ng tala ng Kronikang Babilonio. Muling itinayo ni Nabonido, ang huling hari ng Babilonia, ang templo ni Sin."
    - "Tinawag ng mga Griyego at Romano ang bayan na Carrhae. Malapit dito noong 53 BK ay tinalo ng mga Parto ang hukbo ni Crassus, na pinatay pagkaraan ng ilang sandali. Noong 217 AD ay pinaslang ang emperador na si Caracalla sa daan mula Edessa patungong Carrhae, at noong 363 ay huminto roon si Julian patungong Persia upang maghandog sa buwan. Ang peregrinang si Egeria, noong mga 384, ay pinakitaan ng simbahan sa labas ng mga pader sa pook ng bahay ni Abraham, ngunit halos walang Kristiyanong nakita sa lungsod maliban sa mga klero at monghe: matagal na pinanatili ng Haran ang sinaunang pagsamba."
  da:
    - "Karan lå i det øvre Mesopotamien ved Balikh, en biflod til Eufrat, på stedet for Harran i det sydøstlige Tyrkiet, omkring 40 km sydøst for Urfa. Dens navn betyder »vej« på akkadisk, passende for en by, hvor ruterne fra Mesopotamien til Syrien og Anatolien krydsede. Den var berømt som månegudens, Sins, by, hvis tempel hed Ehulhul. Under det assyriske imperium var den et provinscentrum."
    - "Første Mosebog fortæller, at Tera kom til Karan med Abram, Sarai og Lot på vejen fra Ur i Kaldæa til Kana'an og døde dér. Abram var 75 år gammel, da han drog ud af Karan. Senere flygtede Jakob til sin morbror Laban i Karan og tjente ham for sine hustruer. Sankeribs udsendinge til Hizkija nævnte Karan blandt de lande, deres konger havde ødelagt, Ezekiel opregner dens købmænd blandt dem, der handlede med Tyrus, og Stefanus mindedes Abrahams ophold i Karan."
    - "Efter Nineves fald i 612 f.Kr. besteg Assur-uballit II tronen i Harran som Assyriens sidste konge. I 610 f.Kr. marcherede babylonierne og mederne mod byen; assyrerne og deres egyptiske allierede forlod den, og den blev indtaget. Et år senere forsøgte Assur-uballit og en egyptisk hær forgæves at generobre den, som den babylonske kronike beretter. Nabonid, Babylons sidste konge, genopbyggede Sins tempel."
    - "Grækerne og romerne kaldte byen Carrhae. Nær den slog partherne i 53 f.Kr. Crassus' hær, og han blev dræbt kort efter. I 217 e.Kr. blev kejser Caracalla myrdet på vejen fra Edessa til Carrhae, og i 363 gjorde Julian holdt der på vej til Persien for at ofre til månen. Pilgrimmen Egeria blev omkring 384 vist en kirke uden for murene på stedet for Abrahams hus, men fandt næppe en kristen i byen ud over gejstlige og munke: Harran bevarede længe sin gamle gudsdyrkelse."
  sr:
    - "Харан је лежао у горњој Месопотамији на Балиху, притоци Еуфрата, на месту данашњег Харана у југоисточној Турској, око 40 км југоисточно од Урфе. Његово име на акадском значи „пут“, што одговара граду где су се укрштали путеви из Месопотамије у Сирију и Анатолију. Био је чувен као град бога месеца Сина, чији се храм звао Ехулхул. Под Асирским царством био је покрајинско средиште."
    - "Постање приповеда да је Тара дошао у Харан с Аврамом, Саром и Лотом на путу од Ура халдејског у Ханан и тамо умро. Аврам је имао седамдесет и пет година кад је отишао из Харана. Касније је Јаков побегао стрицу Лавану у Харан и служио му за жене. Сенахиримови посланици Језекији именовали су Харан међу земљама које су њихови цареви уништили, Језекиљ набраја његове трговце међу онима који су трговали с Тиром, а Стефан је споменуо Аврамов боравак у Харану."
    - "После пада Ниниве 612. п. н. е., Ашур-убалит II преузео је престо у Харану као последњи цар Асирије. Године 610. п. н. е. Вавилонци и Меди кренули су на град; Асирци и њихови египатски савезници напустили су га и он је заузет. Годину дана касније Ашур-убалит и египатска војска узалуд су покушали да га поврате, како бележи Вавилонска хроника. Набонид, последњи цар Вавилона, обновио је храм Сина."
    - "Грци и Римљани звали су град Каре. Код њега су 53. п. н. е. Парћани разбили војску Краса, који је убрзо погинуо. Године 217. н. е. цар Каракала убијен је на путу из Едесе у Каре, а 363. Јулијан се ту зауставио на путу у Персију да принесе жртву месецу. Ходочасници Егерији је, око 384, показана црква изван зидина на месту Аврамове куће, али је једва нашла хришћане у граду осим свештенства и монаха: Харан је дуго задржао своје старо богослужење."
