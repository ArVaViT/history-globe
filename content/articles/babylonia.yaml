body:
  en:
    - "Babylonia here is the land the exiles were carried to, not the city of Babylon: the alluvial plain of the lower Tigris and Euphrates, from about Baghdad south to the marshes and the Persian Gulf, flat, hot, nearly rainless, and fed by canals. Genesis calls it “the land of Shinar”, with Babel, Erech and Accad as the first cities of its kingdom; the prophets say “the land of the Chaldeans”, after the tribes who ruled it from the seventh century BC, and Ezra “the province of Babylon”. Sumerian cities rose here before 3000 BC, Hammurabi of Babylon united the land in the eighteenth century BC (the chronologies differ by a century and more), and Kassites and Assyrians held it in turn until Nabopolassar made it independent in 626 BC and his son Nebuchadnezzar II (605–562) made it an empire."
    - "For Judah, Babylonia was the land of exile. Nebuchadnezzar took Jerusalem in 597 BC and carried off Jehoiachin and “all the craftsmen and smiths”; in 586 (or 587) his army burned the city, and “the rest of the people that were left in the city” followed. The exiles were settled on the canals of the Nippur region: Ezekiel saw his visions “among the captives by the river of Chebar”, and cuneiform tablets from a “town of Judah” (Al-Yahudu) record their fields, debts and Hebrew names from 572 to 477 BC. Jehoiachin's rations are listed in the archives of Nebuchadnezzar's palace. “By the rivers of Babylon, there we sat down, yea, we wept, when we remembered Zion”."
    - "Cyrus of Persia took Babylon without a battle in 539 BC, and in his first year Sheshbazzar brought the temple vessels “from Babylon unto Jerusalem”; Ezra 2 lists “the children of the province that went up out of the captivity”, and Ezra himself “went up from Babylon” under Artaxerxes, in 458 BC by the usual reckoning, though some put him in 398. Many Jews stayed: the Murashu business archive from Nippur names them in the fifth century, and in later centuries the academies of Sura and Pumbedita produced the Babylonian Talmud. Jeremiah's long oracle foresaw the land's end: “the hindermost of the nations shall be a wilderness, a dry land, and a desert”."
    - "Babylonia passed to Alexander, the Seleucids, the Parthians and the Sasanians, whose capital was at Ctesiphon, and in 637 to the Arabs. Today it is southern Iraq, with governorates such as Babil, Wasit, Qadisiyah, Dhi Qar and Basra, with the ruins of Babylon, Nippur, Uruk and Ur rising from the plain, and the marshes at its southern end, drained in the 1990s and partly restored."
  ru:
    - "Вавилония здесь — страна, куда уводили пленников, а не город Вавилон. Слова Вавилония в Синодальном переводе нет: страна там зовётся тем же именем Вавилон, а ещё землёй Халдейской («в земле Халдейской» у Иезекииля) а у Ездры — «во всей области Вавилонской». Это наносная равнина нижнего Тигра и Евфрата, от Багдада на юг до болот и Персидского залива: плоская, жаркая, почти без дождей, питаемая каналами. Книга Бытия называет её землёй Сеннаар, где «Вавилон, Эрех, Аккад и Халне» были первыми городами царства; пророки говорят о «земле Халдеев», по имени племён, правивших ею с VII века до н. э. Шумерские города поднялись здесь до 3000 г. до н. э., Хаммурапи объединил страну в XVIII веке до н. э. (хронологии расходятся на столетие и больше), а затем ею владели касситы и ассирийцы, пока Набопаласар не сделал её независимой в 626 г. до н. э., а его сын Навуходоносор II (605–562) — империей."
    - "Для Иудеи Вавилония была землёй плена. Навуходоносор взял Иерусалим в 597 г. до н. э., увёл Иехонию «и всех плотников и кузнецов»; в 586 (или 587) г. его войско сожгло город, и за ними последовал «прочий народ, остававшийся в городе». Переселенцев поселили на каналах в округе Ниппура: Иезекииль видел видения «среди переселенцев при реке Ховаре», а клинописные таблички из «города Иудеев» (Аль-Яхуду) записывают их поля, долги и еврейские имена с 572 по 477 г. до н. э. Пайки Иехонии перечислены в архивах дворца Навуходоносора. «При реках Вавилона, там сидели мы и плакали, когда вспоминали о Сионе»."
    - "Кир Персидский взял Вавилон без боя в 539 г. до н. э., и в первый его год Шешбацар привёз сосуды храма «из Вавилона в Иерусалим»; вторая глава Ездры перечисляет «сыны страны из пленников переселения», а сам Ездра «вышел из Вавилона» при Артаксерксе — в 458 г. до н. э. по обычному счёту, хотя некоторые относят его к 398 г. Многие Иудеи остались: деловой архив Мурашу из Ниппура называет их в V веке, а в позднейшие века академии Суры и Пумбедиты создали Вавилонский Талмуд. Долгое пророчество Иеремии предвидело конец страны: «вот будущность тех народов — пустыня, сухая земля и степь»."
    - "Вавилония перешла к Александру, Селевкидам, парфянам и Сасанидам, чьей столицей был Ктесифон, а в 637 г. — к арабам. Сегодня это южный Ирак, с такими провинциями, как Бабиль, Васит, Кадисия, Ди-Кар и Басра, с руинами Вавилона, Ниппура, Урука и Ура, поднимающимися над равниной, и болотами на южном краю, осушенными в 1990-х годах и отчасти восстановленными."
  uk:
    - "Вавилонія тут — земля, куди відвели вигнанців, а не місто Вавилон: алювіальна рівнина нижнього Тигру і Євфрату, приблизно від Багдада на південь до боліт і Перської затоки, пласка, спекотна, майже без дощів, зрошувана каналами. Буття називає її «Синеяр землї», з Бабелем, Ерехом і Аккадом як першими містами її царства; пророки кажуть «землю Халдейську», за племенами, що правили нею від VII століття до н. е., а Ездра — «по усїй країнї Вавилонській». Шумерські міста зросли тут ще до 3000 р. до н. е., Хаммурапі Вавилонський об'єднав край у XVIII столітті до н. е. (хронології розходяться на століття й більше), каситі й ассирійці тримали його по черзі, поки Набополасар не зробив його незалежним у 626 р. до н. е., а його син Навуходоносор II (605–562) — імперією."
    - "Для Юди Вавилонія була краєм вигнання. Навуходоносор узяв Єрусалим у 597 р. до н. е. й відвів Єхонію та «всї теслї й слюсарі»; у 586 (або 587) його військо спалило місто, і «останок люду, що зоставались у городї» пішов слідом. Вигнанців оселили на каналах навколо Ніппура: Єзекіїль бачив свої видіння «між полонянами над Ховар-річкою», а клинописні таблички з «міста Юди» (Аль-Яхуду) фіксують їхні поля, борги й єврейські імена з 572 до 477 р. до н. е. Пайки Єхонії перелічено в архівах палацу Навуходоносора. «Над ріками Вавилона, там сидїли ми і плакали, як Сиона спогадали»."
    - "Кір Перський узяв Вавилон без бою в 539 р. до н. е., і в його перший рік Шешбазар привіз храмовий посуд «із Вавилону в Ерусалим»; Ездра 2 перелічує «сини краю з виселених бранцїв», а сам Ездра «вийшов з Вавилону» за Артаксеркса, у 458 р. до н. е. за звичайним рахунком, хоча дехто відносить його до 398-го. Багато юдеїв залишилося: діловий архів Мурашу з Ніппура називає їх у V столітті, а в пізніші століття академії Сури й Пумбедіти створили Вавилонський Талмуд. Довге пророцтво Єремії передбачало кінець краю: «остання буде вона між народами — пустиня, суша, дике поле»."
    - "Вавилонія перейшла до Александра, Селевкідів, парфян і сасанідів, чия столиця була в Ктесифоні, а в 637 році — до арабів. Нині це південний Ірак, із мухафазами Бабіль, Васіт, Кадисія, Зі-Кар і Басра, з руїнами Вавилона, Ніппура, Урука й Ура, що здіймаються з рівнини, та болотами на південному краї, осушеними в 1990-х і частково відновленими."
  es:
    - "Babilonia aquí es la tierra a la que fueron llevados los exiliados, no la ciudad de Babilonia: la llanura aluvial del bajo Tigris y Éufrates, desde aproximadamente Bagdad hacia el sur hasta las marismas y el golfo Pérsico, llana, calurosa, casi sin lluvia, y alimentada por canales. El Génesis la llama «la tierra de Shinar», con Babel, Erec y Acad como las primeras ciudades de su reino; los profetas dicen «la tierra de los Caldeos», por las tribus que la gobernaron desde el siglo VII a. C., y Esdras «la provincia de Babilonia». Ciudades sumerias se alzaron aquí antes de 3000 a. C., Hammurabi de Babilonia unió la tierra en el siglo XVIII a. C. (las cronologías difieren en un siglo y más), y casitas y asirios la poseyeron por turno hasta que Nabopolasar la hizo independiente en 626 a. C. y su hijo Nabucodonosor II (605–562) la hizo un imperio."
    - "Para Judá, Babilonia fue la tierra del exilio. Nabucodonosor tomó Jerusalén en 597 a. C. y se llevó a Joaquín y a «todos los oficiales y herreros»; en 586 (o 587) su ejército incendió la ciudad, y «los del pueblo que habían quedado en la ciudad» los siguieron. Los exiliados fueron asentados en los canales de la región de Nippur: Ezequiel vio sus visiones «en medio de los trasportados junto al río de Chebar», y tablillas cuneiformes de una «ciudad de Judá» (Al-Yahudu) registran sus campos, deudas y nombres hebreos de 572 a 477 a. C. Las raciones de Joaquín figuran en los archivos del palacio de Nabucodonosor. «JUNTO á los ríos de Babilonia, allí nos sentábamos, y aun llorábamos, acordándonos de Sión»."
    - "Ciro de Persia tomó Babilonia sin batalla en 539 a. C., y en su primer año Sesbasar trajo los vasos del templo «del cautiverio de Babilonia á Jerusalem»; Esdras 2 enumera «los hijos de la provincia que subieron de la cautividad», y el propio Esdras «subió de Babilonia» bajo Artajerjes, en 458 a. C. según el cómputo habitual, aunque algunos lo sitúan en 398. Muchos judíos se quedaron: el archivo comercial de Murashu, de Nippur, los nombra en el siglo V, y en siglos posteriores las academias de Sura y Pumbedita produjeron el Talmud de Babilonia. El largo oráculo de Jeremías previó el fin de la tierra: «será la postrera de las gentes: desierto, sequedad, y páramo»."
    - "Babilonia pasó a Alejandro, a los seléucidas, a los partos y a los sasánidas, cuya capital estaba en Ctesifonte, y en 637 a los árabes. Hoy es el sur de Irak, con gobernaciones como Babil, Wasit, Qadisiyah, Dhi Qar y Basora, con las ruinas de Babilonia, Nippur, Uruk y Ur alzándose de la llanura, y las marismas en su extremo meridional, desecadas en la década de 1990 y en parte restauradas."
  pt:
    - "Babilônia, aqui, é a terra para onde os exilados foram levados, não a cidade de Babilônia: a planície aluvial do baixo Tigre e do Eufrates, de cerca de Bagdá para o sul até os pântanos e o golfo Pérsico, plana, quente, quase sem chuva e irrigada por canais. Gênesis a chama “a terra de Sinar”, com Babel, Ereque e Acade como as primeiras cidades de seu reino; os profetas dizem “a terra dos caldeus”, pelas tribos que a governaram desde o século VII a.C., e Esdras “a província da Babilônia”. Cidades sumérias surgiram aqui antes de 3000 a.C., Hamurábi de Babilônia uniu a terra no século XVIII a.C. (as cronologias diferem por um século e mais), e cassitas e assírios a dominaram por sua vez, até que Nabopolassar a tornou independente em 626 a.C. e seu filho Nabucodonosor II (605–562) a fez um império."
    - "Para Judá, a Babilônia foi a terra do exílio. Nabucodonosor tomou Jerusalém em 597 a.C. e levou Joaquim e “todos os artesãos e ferreiros”; em 586 (ou 587) seu exército queimou a cidade, e “o restante do povo que havia ficado na cidade” os seguiu. Os exilados foram instalados nos canais da região de Nipur: Ezequiel teve suas visões “entre os cativos junto ao rio Quebar”, e tabuinhas cuneiformes de uma “cidade de Judá” (Al-Yahudu) registram seus campos, dívidas e nomes hebraicos de 572 a 477 a.C. As rações de Joaquim constam dos arquivos do palácio de Nabucodonosor. “Junto aos rios da Babilônia, ali nos assentamos. Sim, nós choramos, quando nos lembramos de Sião.”"
    - "Ciro da Pérsia tomou Babilônia sem batalha em 539 a.C., e em seu primeiro ano Sesbazar trouxe os utensílios do templo “da Babilônia para Jerusalém”; Esdras 2 lista “os filhos da província que subiram do cativeiro”, e o próprio Esdras “subiu da Babilônia” sob Artaxerxes, em 458 a.C. pelo cálculo habitual, embora alguns o situem em 398. Muitos judeus ficaram: o arquivo comercial de Murashu, de Nipur, os nomeia no século V, e nos séculos seguintes as academias de Sura e Pumbedita produziram o Talmude Babilônico. O longo oráculo de Jeremias previu o fim da terra: “ela será a menor das nações, um ermo, uma terra seca e um deserto”."
    - "A Babilônia passou a Alexandre, aos selêucidas, aos partas e aos sassânidas, cuja capital ficava em Ctesifonte, e em 637 aos árabes. Hoje é o sul do Iraque, com províncias como Babil, Wasit, Qadisiyah, Dhi Qar e Basra, com as ruínas de Babilônia, Nipur, Uruk e Ur emergindo da planície, e os pântanos em seu extremo sul, drenados na década de 1990 e em parte restaurados."
  de:
    - "Babylonien ist hier das Land, in das die Verbannten geführt wurden, nicht die Stadt Babylon: die Schwemmlandebene des unteren Tigris und Euphrat, von etwa Bagdad südwärts bis zu den Marschen und dem Persischen Golf, flach, heiß, fast regenlos und von Kanälen bewässert. Die Genesis verortet Babel, Erech und Akkad, die ersten Städte seines Reiches, „im Lande Sinear“; die Propheten sagen „das Land der Chaldäer“, nach den Stämmen, die es seit dem 7. Jahrhundert v. Chr. beherrschten, und Esra „die Landschaft Babel“. Sumerische Städte erhoben sich hier vor 3000 v. Chr., Hammurabi von Babylon einte das Land im 18. Jahrhundert v. Chr. (die Chronologien unterscheiden sich um ein Jahrhundert und mehr), und Kassiten und Assyrer hielten es nacheinander, bis Nabopolassar es 626 v. Chr. unabhängig machte und sein Sohn Nebukadnezar II. (605–562) es zu einem Weltreich machte."
    - "Für Juda war Babylonien das Land des Exils. Nebukadnezar nahm Jerusalem 597 v. Chr. ein und führte Jojachin fort und „alle Zimmerleute und alle Schmiede“; 586 (oder 587) verbrannte sein Heer die Stadt, und „das andere Volk, das übrig war in der Stadt“, folgte. Die Verbannten wurden an den Kanälen der Gegend von Nippur angesiedelt: Hesekiel sah seine Gesichte „unter den Gefangenen am Wasser Chebar“, und Keilschrifttafeln aus einer „Stadt Judas“ (Al-Yahudu) verzeichnen ihre Felder, Schulden und hebräischen Namen von 572 bis 477 v. Chr. Jojachins Rationen stehen in den Archiven von Nebukadnezars Palast. „An den Wassern zu Babel saßen wir und weinten, wenn wir an Zion gedachten.“"
    - "Kyrus von Persien nahm Babylon 539 v. Chr. ohne Schlacht ein, und in seinem ersten Jahr brachte Scheschbazzar die Tempelgeräte „mit denen, die aus der Gefangenschaft von Babel heraufzogen gen Jerusalem“; Esra 2 führt auf „die Kinder der Landschaft, die heraufzogen aus der Gefangenschaft“, und Esra selbst führte die Häupter der Vaterhäuser, „die mit mir heraufzogen von Babel“, unter Artaxerxes, nach üblicher Rechnung 458 v. Chr., obwohl manche ihn 398 ansetzen. Viele Juden blieben: Das Geschäftsarchiv der Murašu aus Nippur nennt sie im 5. Jahrhundert, und in späteren Jahrhunderten brachten die Akademien von Sura und Pumbedita den Babylonischen Talmud hervor. Jeremias langer Spruch sah das Ende des Landes voraus: „unter den Heiden ist sie die geringste, wüst, dürr und öde“."
    - "Babylonien ging an Alexander, die Seleukiden, die Parther und die Sasaniden, deren Hauptstadt Ktesiphon war, und 637 an die Araber. Heute ist es der Südirak mit Gouvernements wie Babil, Wasit, Qadisiyya, Dhi Qar und Basra, wo die Ruinen von Babylon, Nippur, Uruk und Ur aus der Ebene aufragen, und mit den Marschen an seinem Südende, in den 1990er Jahren trockengelegt und teilweise wiederhergestellt."
  fr:
    - "La Babylonie est ici le pays où furent emmenés les exilés, non la ville de Babylone : la plaine alluviale du bas Tigre et de l’Euphrate, d’environ Bagdad vers le sud jusqu’aux marais et au golfe Persique, plate, chaude, presque sans pluie, et alimentée par des canaux. La Genèse l’appelle « le pays de Schinear », avec Babel, Érec et Accad pour premières villes de son royaume ; les prophètes disent « le pays des Chaldéens », d’après les tribus qui la dominèrent dès le VIIe siècle av. J.-C., et Esdras « la province de Babylone ». Des villes sumériennes s’y élevaient avant 3000 av. J.-C., Hammurabi de Babylone unifia le pays au XVIIIe siècle av. J.-C. (chronologies divergentes d’un siècle et plus), et Cassites et Assyriens le tinrent tour à tour jusqu’à ce que Nabopolassar le rende indépendant en 626 av. J.-C. et que son fils Nebucadnetsar II (605-562) en fasse un empire."
    - "Pour Juda, la Babylonie fut le pays de l’exil. Nebucadnetsar prit Jérusalem en 597 av. J.-C. et emmena Jojakin et « tous les charpentiers et les serruriers » ; en 586 (ou 587), son armée brûla la ville, et « ceux du peuple qui étaient demeurés dans la ville » suivirent. Les exilés furent établis sur les canaux de la région de Nippur : Ézéchiel eut ses visions « parmi les captifs du fleuve du Kebar », et des tablettes cunéiformes d’une « ville de Juda » (Al-Yahudu) consignent leurs champs, dettes et noms hébreux de 572 à 477 av. J.-C. Les rations de Jojakin figurent dans les archives du palais de Nebucadnetsar. « Sur les bords des fleuves de Babylone, nous étions assis et nous pleurions, en nous souvenant de Sion »."
    - "Cyrus de Perse prit Babylone sans bataille en 539 av. J.-C., et dès sa première année Scheschbatsar emporta les objets du temple « de Babylone à Jérusalem » ; Esdras 2 énumère « ceux de la province qui revinrent de l’exil », et Esdras lui-même « vint de Babylone » sous Artaxerxès, en 458 av. J.-C. selon le calcul habituel, bien que certains le placent en 398. Beaucoup de Juifs restèrent : l’archive commerciale des Murashu de Nippur les nomme au Ve siècle, et dans les siècles suivants les académies de Sura et de Pumbedita produisirent le Talmud de Babylone. Le long oracle de Jérémie prévoyait la fin du pays : « elle est la dernière des nations, c’est un désert, une terre sèche et aride »."
    - "La Babylonie passa à Alexandre, aux Séleucides, aux Parthes et aux Sassanides, dont la capitale était à Ctésiphon, et en 637 aux Arabes. Aujourd’hui c’est le sud de l’Irak, avec des gouvernorats comme Babil, Wasit, Qadisiyah, Dhi Qar et Bassora, les ruines de Babylone, de Nippur, d’Uruk et d’Ur surgissant de la plaine, et les marais à son extrémité sud, asséchés dans les années 1990 et en partie restaurés."
  it:
    - "Qui la Babilonia è la terra in cui furono portati gli esuli, non la città di Babilonia: la pianura alluvionale del Tigri e dell’Eufrate inferiori, da circa Baghdad verso sud fino alle paludi e al Golfo Persico, piatta, calda, quasi senza pioggia e alimentata da canali. La Genesi la chiama «paese di Scinear», con Babel, Erec e Accad come prime città del suo regno; i profeti dicono «il paese de’ Caldei», dalle tribù che la governarono dal VII secolo a.C., ed Esdra «la provincia di Babilonia». Città sumere sorsero qui prima del 3000 a.C., Hammurabi di Babilonia unì il paese nel XVIII secolo a.C. (le cronologie differiscono di un secolo e più), e Cassiti e Assiri lo tennero a turno finché Nabopolassar lo rese indipendente nel 626 a.C. e suo figlio Nabucodonosor II (605–562) ne fece un impero."
    - "Per Giuda, la Babilonia fu la terra dell’esilio. Nabucodonosor prese Gerusalemme nel 597 a.C. e portò via Ioiachin e «tutti i legnaiuoli e i fabbri»; nel 586 (o 587) il suo esercito bruciò la città, e «i superstiti ch’erano rimasti nella città» seguirono. Gli esuli furono stabiliti sui canali della regione di Nippur: Ezechiele ebbe le sue visioni «presso al fiume Kebar, fra quelli ch’erano stati menati in cattività», e tavolette cuneiformi da una «città di Giuda» (Al-Yahudu) registrano i loro campi, debiti e nomi ebraici dal 572 al 477 a.C. Le razioni di Ioiachin sono elencate negli archivi del palazzo di Nabucodonosor. «Là presso i fiumi di Babilonia, sedevamo ed anche piangevamo ricordandoci di Sion»."
    - "Ciro di Persia prese Babilonia senza battaglia nel 539 a.C., e nel suo primo anno Sceshbatsar riportò i vasi del tempio «da Babilonia a Gerusalemme»; Esdra 2 elenca «gli uomini della provincia che tornarono dalla cattività», ed Esdra stesso «veniva da Babilonia» sotto Artaserse, nel 458 a.C. secondo il computo abituale, benché alcuni lo pongano nel 398. Molti Giudei restarono: l’archivio commerciale dei Murashu di Nippur li nomina nel V secolo, e nei secoli successivi le accademie di Sura e Pumbedita produssero il Talmud babilonese. Il lungo oracolo di Geremia prevedeva la fine del paese: «essa è l’ultima delle nazioni, un deserto, una terra arida, una solitudine»."
    - "La Babilonia passò ad Alessandro, ai Seleucidi, ai Parti e ai Sasanidi, la cui capitale era a Ctesifonte, e nel 637 agli Arabi. Oggi è l’Iraq meridionale, con governatorati come Babil, Wasit, Qadisiyah, Dhi Qar e Bassora, con le rovine di Babilonia, Nippur, Uruk e Ur che emergono dalla pianura, e le paludi alla sua estremità meridionale, prosciugate negli anni Novanta e in parte ripristinate."
  pl:
    - "Babilonia to tutaj kraj, do którego uprowadzono wygnańców, nie miasto Babilon: aluwialna równina dolnego Tygrysu i Eufratu, od mniej więcej Bagdadu na południe po moczary i Zatokę Perską, płaska, gorąca, niemal pozbawiona deszczu i zasilana kanałami. Księga Rodzaju mówi o niej „w ziemi Senaar”, z Babel, Erek i Akad jako pierwszymi miastami jej królestwa; prorocy mówią „w ziemi Chaldejskiej”, od plemion, które rządziły nią od VII wieku p.n.e., a Ezdrasz o „krainie Babilońskiej”. Sumeryjskie miasta powstały tu przed 3000 r. p.n.e., Hammurabi z Babilonu zjednoczył kraj w XVIII wieku p.n.e. (chronologie różnią się o stulecie i więcej), a Kasyci i Asyryjczycy trzymali go kolejno, aż Nabopolassar uczynił go niezależnym w 626 r. p.n.e., a jego syn Nabuchodonozor II (605–562) uczynił z niego imperium."
    - "Dla Judy Babilonia była krajem wygnania. Nabuchodonozor zdobył Jerozolimę w 597 r. p.n.e. i uprowadził Jojakina oraz „wszystkich cieśli, i kowali”; w 586 (lub 587) jego wojsko spaliło miasto, a „ostatek ludu, który był został w mieście” uprowadzono po nich. Wygnańców osiedlono nad kanałami okolicy Nippur: Ezechiel miał swe widzenia „w pośrodku pojmanych u rzeki Chebar”, a klinowe tabliczki z „miasta Judy” (Al-Yahudu) zapisują ich pola, długi i hebrajskie imiona z lat 572–477 p.n.e. Racje Jojakina są wymienione w archiwach pałacu Nabuchodonozora. „Nad rzekami Babilońskiemi, tameśmy siadali i płakali, wspominając na Syon”."
    - "Cyrus perski zdobył Babilon bez bitwy w 539 r. p.n.e., a w jego pierwszym roku Sesbasar sprowadził naczynia świątynne „z Babilonu do Jeruzalemu”; Ezd 2 wylicza „ludzie onej krainy, którzy wyszli z pojmania i z niewoli”, a sam Ezdrasz „wyszedł z Babilonu” za Artakserksesa, w 458 r. p.n.e. według zwykłej rachuby, choć niektórzy umieszczają go w 398. Wielu Żydów zostało: archiwum handlowe Murashu z Nippur wymienia ich w V wieku, a w późniejszych stuleciach akademie w Sura i Pumbedita stworzyły Talmud babiloński. Długa wyrocznia Jeremiasza zapowiadała koniec kraju: „oto najpośledniejszą będzie z narodów, pustą ziemią, suchą i bezdrożną”."
    - "Babilonia przeszła do Aleksandra, Seleucydów, Partów i Sasanidów, których stolicą była Ktezyfon, a w 637 do Arabów. Dziś jest to południowy Irak, z muhafazami takimi jak Babil, Wasit, Qadisijja, Dhi Qar i Basra, z ruinami Babilonu, Nippur, Uruk i Ur wznoszącymi się z równiny i z moczarami na jej południowym krańcu, osuszonymi w latach 90. i częściowo odtworzonymi."
  nl:
    - "Babylonië is hier het land waarheen de ballingen werden gevoerd, niet de stad Babylon: de alluviale vlakte van de lagere Tigris en Eufraat, van ongeveer Bagdad zuidwaarts tot de moerassen en de Perzische Golf, vlak, heet, vrijwel regenloos en door kanalen gevoed. Genesis noemt het “het land Sinear”, met Babel, Erech en Akkad als eerste steden van zijn koninkrijk; de profeten zeggen “het land der Chaldeen”, naar de stammen die het vanaf de zevende eeuw v.Chr. beheersten, en Ezra “het landschap van Babel”. Sumerische steden rezen hier vóór 3000 v.Chr., Hammurabi van Babylon verenigde het land in de achttiende eeuw v.Chr. (de chronologieën verschillen een eeuw en meer), en Kassieten en Assyriërs hielden het beurtelings tot Nabopolassar het in 626 v.Chr. onafhankelijk maakte en zijn zoon Nebukadnessar II (605–562) er een rijk van maakte."
    - "Voor Juda was Babylonië het land van de ballingschap. Nebukadnessar nam Jeruzalem in 597 v.Chr. in en voerde Jojachin en “alle timmerlieden en smeden” weg; in 586 (of 587) verbrandde zijn leger de stad, en “het overige nu des volks, die in de stad overgelaten waren” volgde. De ballingen werden gevestigd aan de kanalen van de streek van Nippur: Ezechiël zag zijn visioenen “als ik in het midden der weggevoerden was bij de rivier Chebar”, en spijkerschrifttabletten uit een “stad van Juda” (Al-Yahudu) vermelden hun akkers, schulden en Hebreeuwse namen van 572 tot 477 v.Chr. Jojachins rantsoenen staan in de archieven van Nebukadnessars paleis. “Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij gedachten aan Sion.”"
    - "Cyrus van Perzië nam Babylon in 539 v.Chr. zonder slag of stoot in, en in zijn eerste jaar bracht Sesbazar de tempelvaten “van Babel naar Jeruzalem”; Ezra 2 somt “de kinderen van dat landschap, die optogen uit de gevangenis” op, en Ezra zelf “toog op uit Babel” onder Artaxerxes, in 458 v.Chr. volgens de gangbare berekening, al plaatsen sommigen hem in 398. Veel Joden bleven: het zakelijke Murashu-archief uit Nippur noemt hen in de vijfde eeuw, en in latere eeuwen brachten de academies van Sura en Pumbedita de Babylonische Talmoed voort. Jeremia’s lange godsspraak voorzag het einde van het land: “de achterste der heidenen, een woestijn, dorheid en wildernis”."
    - "Babylonië ging over op Alexander, de Seleuciden, de Parthen en de Sassaniden, wier hoofdstad bij Ctesiphon lag, en in 637 op de Arabieren. Tegenwoordig is het Zuid-Irak, met gouvernementen als Babil, Wasit, Qadisiyah, Dhi Qar en Basra, met de ruïnes van Babylon, Nippur, Uruk en Ur oprijzend uit de vlakte, en de moerassen aan het zuidelijke einde, in de jaren negentig drooggelegd en gedeeltelijk hersteld."
  cs:
    - "Babylonie je zde země, do níž byli vyhnanci odvlečeni, nikoli město Babylón: naplavená rovina dolního Tigridu a Eufratu, zhruba od Bagdádu na jih k močálům a Perskému zálivu, plochá, horká, téměř bez deště a zavlažovaná kanály. Genesis ji nazývá zemí „Sinear“, s Babelem, Erekem a Akkadem jako prvními městy jejího království; proroci mluví o „zemi Kaldejské“ a Ezdráš o „krajině Babylonské“. Sumerská města zde vznikla před rokem 3000 př. n. l., Chammurapi Babylonský sjednotil zemi v 18. století př. n. l. (chronologie se liší o století i více), a Kassité a Asyřané ji drželi střídavě, dokud ji Nabopolassar roku 626 př. n. l. neučinil nezávislou a jeho syn Nebukadnesar II. (605–562) z ní neučinil říši."
    - "Pro Judu byla Babylonie zemí vyhnanství. Nebukadnesar dobyl Jeruzalém roku 597 př. n. l. a odvlekl Jójakína a „všecky tesaře a kováře“; roku 586 (nebo 587) jeho vojsko město spálilo a „Ostatek pak lidu, kterýž byl zůstal v městě“ je následoval. Vyhnanci byli usazeni na kanálech v oblasti Nippuru: Ezechiel viděl svá vidění „mezi zajatými u řeky Chebar“ a klínopisné tabulky z „města Judy“ (Al-Yahudu) zaznamenávají jejich pole, dluhy a hebrejská jména z let 572 až 477 př. n. l. Jójakínovy příděly jsou uvedeny v archivech Nebukadnesarova paláce. „Při řekách Babylonských tam jsme sedávali, a plakávali, rozpomínajíce se na Sion.“"
    - "Kýros Perský dobyl Babylón bez bitvy roku 539 př. n. l. a v prvním roce přinesl Šešbasar chrámové nádoby „z Babylona do Jeruzaléma“; Ezdráš 2 uvádí „lidé té krajiny, kteříž se z zajetí a přestěhování toho brali“ a sám Ezdráš „vyšel z Babylona“ za Artaxerxa, v roce 458 př. n. l. podle obvyklého počtu, ač jej někteří kladou do roku 398. Mnoho Židů zůstalo: obchodní archiv Murašû z Nippuru je jmenuje v 5. století a v pozdějších stoletích akademie v Suře a Pumbedítě vytvořily babylonský Talmud. Jeremjášovo dlouhé proroctví předvídalo konec země: „Aj, nejzadnější z národů, poušť, země vyprahlá a pustina“."
    - "Babylonie přešla k Alexandrovi, Seleukovcům, Parthům a Sásánovcům, jejichž hlavní město bylo v Ktésifóntu, a roku 637 k Arabům. Dnes je to jižní Irák s guvernoráty jako Babil, Wasit, Qadisiyah, Dhi Qar a Basra, se zříceninami Babylónu, Nippuru, Uruku a Uru vyčnívajícími z roviny a s močály na jejím jižním konci, vysušenými v 90. letech 20. století a zčásti obnovenými."
  sv:
    - "Babylonien är här landet som de landsflyktiga fördes till, inte staden Babylon: den alluviala slätten vid nedre Tigris och Eufrat, från ungefär Bagdad söderut till träsken och Persiska viken, platt, het, nästan regnlös och matad av kanaler. Första Mosebok kallar det ”Sinears land”, med Babel, Erek och Ackad som första städer i dess rike; profeterna säger ”kaldéernas land”, efter stammarna som styrde det från 600-talet f.Kr., och Esra ”Babels hövdingdöme”. Sumeriska städer reste sig här före 3000 f.Kr., Hammurabi av Babylon förenade landet på 1700-talet f.Kr. (kronologierna skiljer sig åt med ett århundrade och mer), och kassiter och assyrier höll det i tur och ordning tills Nabopolassar gjorde det självständigt år 626 f.Kr. och hans son Nebukadnessar II (605–562) gjorde det till ett imperium."
    - "För Juda var Babylonien exilens land. Nebukadnessar intog Jerusalem år 597 f.Kr. och förde bort Jojakin och ”alla timmermän och smeder”; år 586 (eller 587) brände hans här staden, och ”återstoden av folket, dem som voro kvar i staden” följde. De landsflyktiga bosattes vid kanalerna i Nippurtrakten: Hesekiel såg sina syner ”bland de fångna vid strömmen Kebar”, och kilskriftstavlor från en ”Judas stad” (Al-Yahudu) upptecknar deras åkrar, skulder och hebreiska namn från 572 till 477 f.Kr. Jojakins ransoner förtecknas i arkiven från Nebukadnessars palats. ”Vid Babels floder, där sutto vi och gräto, när vi tänkte på Sion.”"
    - "Kyros av Persien intog Babylon utan strid år 539 f.Kr., och under hans första år förde Sesbassar tempelkärlen ”från Babel till Jerusalem”; Esra 2 förtecknar ”dessa voro de män från hövdingdömet, som drogo upp ur den landsflykt och fångenskap i Babel”, och Esra själv ”drog upp från Babel” under Artaxerxes, år 458 f.Kr. enligt den vanliga beräkningen, fastän några placerar honom år 398. Många judar stannade: Murashu-affärsarkivet från Nippur nämner dem på 400-talet f.Kr., och under senare århundraden frambringade akademierna i Sura och Pumbedita den babyloniska Talmud. Jeremias långa utsaga förutsåg landets slut: ”bland folken skall hon bliva den yttersta -- en öken, ett torrt land och en hedmark”."
    - "Babylonien övergick till Alexander, seleukiderna, parterna och sasaniderna, vars huvudstad låg i Ktesifon, och år 637 till araberna. I dag är det södra Irak, med guvernement som Babil, Wasit, Qadisiyah, Dhi Qar och Basra, med ruinerna av Babylon, Nippur, Uruk och Ur som reser sig från slätten, och träsken i dess södra ände, som dränerades på 1990-talet och delvis har återställts."
  nb:
    - "Babylonia er her landet eksilfolkene ble ført til, ikke byen Babylon: alluvialsletten ved nedre Tigris og Eufrat, fra omtrent Bagdad sørover til myrene og Persiabukta, flat, varm, nesten uten regn og forsynt med kanaler. 1. Mosebok kaller det «landet Sinear», med Babel, Erek og Akkad som første byer i riket; profetene sier «kaldeernes land», etter stammene som styrte det fra 600-tallet f.Kr., og Esra «hele Babels landskap». Sumeriske byer vokste opp her før 3000 f.Kr., Hammurabi av Babylon forente landet på 1700-tallet f.Kr. (kronologiene avviker med et århundre og mer), og kassitter og assyrere holdt det i tur og orden til Nabopolassar gjorde det uavhengig i 626 f.Kr. og hans sønn Nebukadnesar II (605–562) gjorde det til et imperium."
    - "For Juda var Babylonia eksillandet. Nebukadnesar inntok Jerusalem i 597 f.Kr. og førte bort Jojakin og «alle tømmermenn og stenhuggere og smeder»; i 586 (eller 587) brente hæren hans byen, og «resten av folket, dem som var blitt tilbake i byen» fulgte. Eksilfolkene ble bosatt ved kanalene i Nippur-området: Esekiel så synene sine «blandt de bortførte ved elven Kebar», og kileskrifttavler fra en «Judas by» (Al-Yahudu) forteller om deres marker, gjeld og hebraiske navn fra 572 til 477 f.Kr. Jojakins rasjoner står oppført i arkivene fra Nebukadnesars palass. «Ved Babylons elver, der satt vi og gråt når vi kom Sion i hu.»"
    - "Kyros av Persia inntok Babylon uten kamp i 539 f.Kr., og i sitt første år brakte Sesbassar tempelkarene «op fra Babel til Jerusalem»; Esra 2 oppregner «de menn fra landskapet Juda som drog hjem fra fangenskapet», og Esra selv «drog op fra Babel» under Artaxerxes, i 458 f.Kr. etter den vanlige beregningen, selv om noen setter ham til 398. Mange jøder ble igjen: Murashu-forretningsarkivet fra Nippur nevner dem på 400-tallet f.Kr., og i senere århundrer frembrakte akademiene i Sura og Pumbedita den babylonske Talmud. Jeremias lange utsagn forutså landets ende: «hun blir det siste blandt folkene, en ørken, et tørt land og en øde mark»."
    - "Babylonia gikk til Aleksander, seleukidene, partherne og sasanidene, hvis hovedstad var Ctesifon, og i 637 til araberne. I dag er det Sør-Irak, med guvernementer som Babil, Wasit, Qadisiyah, Dhi Qar og Basra, med ruinene av Babylon, Nippur, Uruk og Ur som reiser seg fra sletten, og myrene i den sørlige enden, tappet ut på 1990-tallet og delvis gjenopprettet."
  tl:
    - "Ang Babilonia dito ay ang lupaing pinagdalhan sa mga destiyero, hindi ang lungsod: ang kapatagang banlik ng ibabang Tigris at Eufrates, mula mga Baghdad patimog hanggang sa mga latian at Golpo ng Persia, patag, mainit, halos walang ulan, at pinapakain ng mga kanal. Tinatawag ito ng Genesis na “lupain ng Shinar”, na ang Babel, Erech at Accad ang mga unang lungsod ng kaharian nito; sinasabi ng mga propeta ang “lupain ng mga Caldeo”, mula sa mga tribong namuno rito mula ika-7 siglo BK, at si Ezra ang “lalawigan ng Babilonia”. Umangat ang mga lungsod na Sumerio rito bago ang 3000 BK, pinagbuklod ni Hammurabi ang lupain noong ika-18 siglo BK (magkaiba ng isang siglo at higit pa ang mga kronolohiya), at hinawakan ito ng mga Kassita at Asirio nang sunod-sunod hanggang gawin itong malaya ni Nabopolassar noong 626 BK at imperyo ng anak niyang si Nabucodonosor II (605–562)."
    - "Para sa Juda, ang Babilonia ang lupain ng pagkabihag. Sinakop ni Nabucodonosor ang Jerusalem noong 597 BK at dinala si Joachin at “ang lahat na manggagawa at mangbabakal”; noong 586 (o 587), sinunog ng kaniyang hukbo ang lungsod, at sumunod “ang nalabi na mga tao na naiwan sa bayan”. Inilagay ang mga destiyero sa mga kanal ng rehiyon ng Nippur: nakita ni Ezekiel ang kaniyang mga pangitain “kasama ng mga bihag sa pangpang ng ilog Chebar”, at itinatala ng mga tabletang cuneiform mula sa isang “bayan ng Juda” (Al-Yahudu) ang kanilang mga bukid, utang at pangalang Hebreo mula 572 hanggang 477 BK. Nakalista ang mga rasyon ni Joachin sa mga arkibo ng palasyo ni Nabucodonosor. “Sa tabi ng mga ilog ng Babilonia, doo'y nangaupo tayo, oo, nagiyak tayo, nang ating maalaala ang Sion”."
    - "Sinakop ni Ciro ng Persia ang Babilonia nang walang labanan noong 539 BK, at sa unang taon niya ay dinala ni Sesbassar ang mga sisidlan ng templo “mula sa Babilonia hanggang sa Jerusalem”; inililista ng Ezra 2 ang “mga anak ng lalawigan, na nagsiahon mula sa pagkabihag”, at si Ezra mismo ay “yumaon mula sa Babilonia” sa ilalim ni Artajerjes, noong 458 BK ayon sa karaniwang pagbilang, bagaman inilalagay siya ng ilan noong 398. Maraming Judio ang nanatili: pinangalanan sila ng arkibong pangnegosyo ng Murashu mula sa Nippur noong ika-5 siglo, at sa mga kalaunang siglo ay nabuo ng mga akademya ng Sura at Pumbedita ang Talmud Babilonyo. Nakita ng mahabang hula ni Jeremias ang wakas ng lupain: “siya'y magiging pinakahuli sa mga bansa, isang gubatan, isang tuyong lupain, isang ilang”."
    - "Napunta ang Babilonia kay Alejandro, sa mga Seleucida, Parto at Sasanida, na ang kabisera ay nasa Ctesiphon, at noong 637 sa mga Arabe. Ang timog Iraq ito ngayon, na may mga gobernorado gaya ng Babil, Wasit, Qadisiyah, Dhi Qar at Basra, kung saan umaangat sa kapatagan ang mga guho ng Babilonia, Nippur, Uruk at Ur, at ang mga latian sa timog na dulo nito, na pinatuyo noong dekada 1990 at bahagyang naibalik."
  da:
    - "Babylonien er her det land, de landflygtige blev ført til, ikke byen Babylon: alluvialsletten ved nedre Tigris og Eufrat, fra omkring Bagdad sydpå til sumpene og Den Persiske Bugt, flad, varm, næsten regnløs og vandet af kanaler. Første Mosebog kalder den »Landet Sinear«, med Babel, Erek og Akkad som første byer i dens rige; profeterne siger »Kaldæernes Land«, efter stammerne, der herskede over den fra 600-tallet f.Kr., og Ezra »hele Babels Land«. Sumeriske byer rejste sig her før 3000 f.Kr., Hammurabi af Babylon forenede landet i 1700-tallet f.Kr. (kronologierne afviger med et århundrede og mere), og kassitter og assyrere holdt det efter tur, indtil Nabopolassar gjorde det uafhængigt i 626 f.Kr., og hans søn Nebukadnezar 2. (605–562) gjorde det til et imperium."
    - "For Juda var Babylonien eksilets land. Nebukadnezar indtog Jerusalem i 597 f.Kr. og bortførte Jojakin og »alle Tømmermændene og Smedene«; i 586 (eller 587) brændte hans hær byen, og »det øvrige Folk, de overblevne i Staden« fulgte. De landflygtige blev bosat ved kanalerne i Nippur-egnen: Ezekiel så sine syner »midt iblandt de bortførte ved Floden Kebar«, og kileskrifttavler fra en »Judas by« (Al-Yahudu) optegner deres marker, gæld og hebraiske navne fra 572 til 477 f.Kr. Jojakins rationer er opført i arkiverne fra Nebukadnezars palads. »Ved Babylons Floder, der sad vi, og vi græd, naar vi kom Zion i Hu.«"
    - "Kyros af Persien indtog Babylon uden kamp i 539 f.Kr., og i hans første år bragte Sesbazar tempelkarrene »fra Babel til Jerusalem«; Ezra 2 opregner »Landskabets Folk«, der drog op af fangenskabet, og Ezra selv »drog op fra Babel« under Artaxerxes, i 458 f.Kr. efter den sædvanlige beregning, skønt nogle henlægger det til 398. Mange jøder blev: Murasju-forretningsarkivet fra Nippur nævner dem i 400-tallet, og i senere århundreder frembragte akademierne i Sura og Pumbedita den babylonske Talmud. Jeremias' lange udsagn forudså landets ende: »hun er bleven det sidste af Folkene, en Ørk, et tørt Sted og en øde Mark«."
    - "Babylonien gik til Alexander, seleukiderne, partherne og sassaniderne, hvis hovedstad lå ved Ktesifon, og i 637 til araberne. I dag er det det sydlige Irak, med guvernementer som Babil, Wasit, Qadisiyah, Dhi Qar og Basra, med ruinerne af Babylon, Nippur, Uruk og Ur, der rejser sig af sletten, og sumpene i dens sydlige ende, drænet i 1990'erne og delvis genoprettet."
  sr:
    - "Вавилонија је овде земља у коју су прогнаници одведени, а не град Вавилон: наносна равница доњег Тигра и Еуфрата, од отприлике Багдада на југ до мочвара и Персијског залива, равна, врућа, готово без кише и храњена каналима. Постање је зове „у земљи Сенару“, са Вавилоном, Орехом и Архадом као првим градовима њеног краљевства; пророци кажу „земљу халдејску“, по племенима која су њоме владала од 7. века п. н. е., а Јездра „у земљи вавилонској“. Сумерски градови никли су овде пре 3000. п. н. е., Хамурабије из Вавилона ујединио је земљу у 18. веку п. н. е. (хронологије се разликују за век и више), а Касити и Асирци држали су је редом док је Набополасар није учинио независном 626. п. н. е., а његов син Навуходоносор II (605–562) царством."
    - "За Јуду је Вавилонија била земља изгнанства. Навуходоносор је заузео Јерусалим 597. п. н. е. и одвео Јоахина и „све дрводеље и све коваче“; 586. (или 587) његова војска спалила је град, а „остатак народа што оста у граду“ следио је. Прогнаници су настањени на каналима области Нипура: Језекиљ је имао своје визије „кад бејах међу робљем на реци Хевару“, а клинописне плочице из „града Јуде“ (Ал-Јахуду) бележе њихова поља, дугове и хебрејска имена од 572. до 477. п. н. е. Јоахинови оброци наведени су у архивима Навуходоносорове палате. „На водама вавилонским сеђасмо и плакасмо опомињући се Сиона.“"
    - "Кир Персијски заузео је Вавилон без битке 539. п. н. е., а у својој првој години Сасавасар је донео храмовне посуде „из Вавилона у Јерусалим“; Јездра 2 наводи „људи оне земље што пођоше из ропства“, а сам Јездра „врати се из вавилонске“ под Артаксерксом, 458. п. н. е. по уобичајеном рачунању, мада га неки стављају у 398. Многи Јевреји су остали: пословни архив Мурашу из Нипура именује их у 5. веку, а у каснијим вековима академије у Сури и Пумбедити створиле су Вавилонски талмуд. Јеремијино дугачко пророштво предвидело је крај земље: „биће последња међу народима, пустиња, земља сува и пустош“."
    - "Вавилонија је прешла Александру, Селевкидима, Партима и Сасанидима, чија је престоница била у Ктесифонту, а 637. Арапима. Данас је то јужни Ирак, са гувернератима као Бабил, Васит, Кадисија, Ди Кар и Басра, са рушевинама Вавилона, Нипура, Урука и Ура што се уздижу из равнице, и мочварама на њеном јужном крају, исушеним 1990-их и делимично обновљеним."
