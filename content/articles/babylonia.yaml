# Overview article (ADR 0007). Mainstream facts only; Hammurabi's dates and the year of Ezra's journey are given as debated; this is the region, not the city (babylon.yaml).
id: babylonia
place: a8394b8
title:
  en: "Babylonia"
  ru: "Вавилония"
  uk: "Вавилонія"
  es: "Babilonia"
  pt: "Babilônia (região)"
  de: "Babylonien"
  fr: "Babylonie"
body:
  en:
    - "Babylonia here is the land the exiles were carried to, not the city of Babylon: the alluvial plain of the lower Tigris and Euphrates, from about Baghdad south to the marshes and the Persian Gulf, flat, hot, nearly rainless, and fed by canals. Genesis calls it “the land of Shinar”, with Babel, Erech and Accad as the first cities of its kingdom; the prophets say “the land of the Chaldeans”, after the tribes who ruled it from the seventh century BC, and Ezra “the province of Babylon”. Sumerian cities rose here before 3000 BC, Hammurabi of Babylon united the land in the eighteenth century BC (the chronologies differ by a century and more), and Kassites and Assyrians held it in turn until Nabopolassar made it independent in 626 BC and his son Nebuchadnezzar II (605–562) made it an empire."
    - "For Judah, Babylonia was the land of exile. Nebuchadnezzar took Jerusalem in 597 BC and carried off Jehoiachin and “all the craftsmen and smiths”; in 586 (or 587) his army burned the city, and “the rest of the people that were left in the city” followed. The exiles were settled on the canals of the Nippur region: Ezekiel saw his visions “among the captives by the river of Chebar”, and cuneiform tablets from a “town of Judah” (Al-Yahudu) record their fields, debts and Hebrew names from 572 to 477 BC. Jehoiachin's rations are listed in the archives of Nebuchadnezzar's palace. “By the rivers of Babylon, there we sat down, yea, we wept, when we remembered Zion”."
    - "Cyrus of Persia took Babylon without a battle in 539 BC, and in his first year Sheshbazzar brought the temple vessels “from Babylon unto Jerusalem”; Ezra 2 lists “the children of the province that went up out of the captivity”, and Ezra himself “went up from Babylon” under Artaxerxes, in 458 BC by the usual reckoning, though some put him in 398. Many Jews stayed: the Murashu business archive from Nippur names them in the fifth century, and in later centuries the academies of Sura and Pumbedita produced the Babylonian Talmud. Jeremiah's long oracle foresaw the land's end: “the hindermost of the nations shall be a wilderness, a dry land, and a desert”."
    - "Babylonia passed to Alexander, the Seleucids, the Parthians and the Sasanians, whose capital was at Ctesiphon, and in 637 to the Arabs. Today it is southern Iraq, with governorates such as Babil, Wasit, Qadisiyah, Dhi Qar and Basra, with the ruins of Babylon, Nippur, Uruk and Ur rising from the plain, and the marshes at its southern end, drained in the 1990s and partly restored."
  ru:
    - "Вавилония здесь — страна, куда уводили пленников, а не город Вавилон. Слова Вавилония в Синодальном переводе нет: страна там зовётся тем же именем Вавилон, а ещё землёй Халдейской («в земле Халдейской» у Иезекииля) а у Ездры — «во всей области Вавилонской». Это наносная равнина нижнего Тигра и Евфрата, от Багдада на юг до болот и Персидского залива: плоская, жаркая, почти без дождей, питаемая каналами. Книга Бытия называет её землёй Сеннаар, где «Вавилон, Эрех, Аккад и Халне» были первыми городами царства; пророки говорят о «земле Халдеев», по имени племён, правивших ею с VII века до н. э. Шумерские города поднялись здесь до 3000 г. до н. э., Хаммурапи объединил страну в XVIII веке до н. э. (хронологии расходятся на столетие и больше), а затем ею владели касситы и ассирийцы, пока Набопаласар не сделал её независимой в 626 г. до н. э., а его сын Навуходоносор II (605–562) — империей."
    - "Для Иудеи Вавилония была землёй плена. Навуходоносор взял Иерусалим в 597 г. до н. э., увёл Иехонию «и всех плотников и кузнецов»; в 586 (или 587) г. его войско сожгло город, и за ними последовал «прочий народ, остававшийся в городе». Переселенцев поселили на каналах в округе Ниппура: Иезекииль видел видения «среди переселенцев при реке Ховаре», а клинописные таблички из «города Иудеев» (Аль-Яхуду) записывают их поля, долги и еврейские имена с 572 по 477 г. до н. э. Пайки Иехонии перечислены в архивах дворца Навуходоносора. «При реках Вавилона, там сидели мы и плакали, когда вспоминали о Сионе»."
    - "Кир Персидский взял Вавилон без боя в 539 г. до н. э., и в первый его год Шешбацар привёз сосуды храма «из Вавилона в Иерусалим»; вторая глава Ездры перечисляет «сыны страны из пленников переселения», а сам Ездра «вышел из Вавилона» при Артаксерксе — в 458 г. до н. э. по обычному счёту, хотя некоторые относят его к 398 г. Многие Иудеи остались: деловой архив Мурашу из Ниппура называет их в V веке, а в позднейшие века академии Суры и Пумбедиты создали Вавилонский Талмуд. Долгое пророчество Иеремии предвидело конец страны: «вот будущность тех народов — пустыня, сухая земля и степь»."
    - "Вавилония перешла к Александру, Селевкидам, парфянам и Сасанидам, чьей столицей был Ктесифон, а в 637 г. — к арабам. Сегодня это южный Ирак, с такими провинциями, как Бабиль, Васит, Кадисия, Ди-Кар и Басра, с руинами Вавилона, Ниппура, Урука и Ура, поднимающимися над равниной, и болотами на южном краю, осушенными в 1990-х годах и отчасти восстановленными."
  uk:
    - "Вавилонія тут — земля, куди відвели вигнанців, а не місто Вавилон: алювіальна рівнина нижнього Тигру і Євфрату, приблизно від Багдада на південь до боліт і Перської затоки, пласка, спекотна, майже без дощів, зрошувана каналами. Буття називає її «Синеяр землї», з Бабелем, Ерехом і Аккадом як першими містами її царства; пророки кажуть «землю Халдейську», за племенами, що правили нею від VII століття до н. е., а Ездра — «по усїй країнї Вавилонській». Шумерські міста зросли тут ще до 3000 р. до н. е., Хаммурапі Вавилонський об'єднав край у XVIII столітті до н. е. (хронології розходяться на століття й більше), каситі й ассирійці тримали його по черзі, поки Набополасар не зробив його незалежним у 626 р. до н. е., а його син Навуходоносор II (605–562) — імперією."
    - "Для Юди Вавилонія була краєм вигнання. Навуходоносор узяв Єрусалим у 597 р. до н. е. й відвів Єхонію та «всї теслї й слюсарі»; у 586 (або 587) його військо спалило місто, і «останок люду, що зоставались у городї» пішов слідом. Вигнанців оселили на каналах навколо Ніппура: Єзекіїль бачив свої видіння «між полонянами над Ховар-річкою», а клинописні таблички з «міста Юди» (Аль-Яхуду) фіксують їхні поля, борги й єврейські імена з 572 до 477 р. до н. е. Пайки Єхонії перелічено в архівах палацу Навуходоносора. «Над ріками Вавилона, там сидїли ми і плакали, як Сиона спогадали»."
    - "Кір Перський узяв Вавилон без бою в 539 р. до н. е., і в його перший рік Шешбазар привіз храмовий посуд «із Вавилону в Ерусалим»; Ездра 2 перелічує «сини краю з виселених бранцїв», а сам Ездра «вийшов з Вавилону» за Артаксеркса, у 458 р. до н. е. за звичайним рахунком, хоча дехто відносить його до 398-го. Багато юдеїв залишилося: діловий архів Мурашу з Ніппура називає їх у V столітті, а в пізніші століття академії Сури й Пумбедіти створили Вавилонський Талмуд. Довге пророцтво Єремії передбачало кінець краю: «остання буде вона між народами — пустиня, суша, дике поле»."
    - "Вавилонія перейшла до Александра, Селевкідів, парфян і сасанідів, чия столиця була в Ктесифоні, а в 637 році — до арабів. Нині це південний Ірак, із мухафазами Бабіль, Васіт, Кадисія, Зі-Кар і Басра, з руїнами Вавилона, Ніппура, Урука й Ура, що здіймаються з рівнини, та болотами на південному краї, осушеними в 1990-х і частково відновленими."
  es:
    - "Babilonia aquí es la tierra a la que fueron llevados los exiliados, no la ciudad de Babilonia: la llanura aluvial del bajo Tigris y Éufrates, desde aproximadamente Bagdad hacia el sur hasta las marismas y el golfo Pérsico, llana, calurosa, casi sin lluvia, y alimentada por canales. El Génesis la llama «la tierra de Shinar», con Babel, Erec y Acad como las primeras ciudades de su reino; los profetas dicen «la tierra de los Caldeos», por las tribus que la gobernaron desde el siglo VII a. C., y Esdras «la provincia de Babilonia». Ciudades sumerias se alzaron aquí antes de 3000 a. C., Hammurabi de Babilonia unió la tierra en el siglo XVIII a. C. (las cronologías difieren en un siglo y más), y casitas y asirios la poseyeron por turno hasta que Nabopolasar la hizo independiente en 626 a. C. y su hijo Nabucodonosor II (605–562) la hizo un imperio."
    - "Para Judá, Babilonia fue la tierra del exilio. Nabucodonosor tomó Jerusalén en 597 a. C. y se llevó a Joaquín y a «todos los oficiales y herreros»; en 586 (o 587) su ejército incendió la ciudad, y «los del pueblo que habían quedado en la ciudad» los siguieron. Los exiliados fueron asentados en los canales de la región de Nippur: Ezequiel vio sus visiones «en medio de los trasportados junto al río de Chebar», y tablillas cuneiformes de una «ciudad de Judá» (Al-Yahudu) registran sus campos, deudas y nombres hebreos de 572 a 477 a. C. Las raciones de Joaquín figuran en los archivos del palacio de Nabucodonosor. «JUNTO á los ríos de Babilonia, allí nos sentábamos, y aun llorábamos, acordándonos de Sión»."
    - "Ciro de Persia tomó Babilonia sin batalla en 539 a. C., y en su primer año Sesbasar trajo los vasos del templo «del cautiverio de Babilonia á Jerusalem»; Esdras 2 enumera «los hijos de la provincia que subieron de la cautividad», y el propio Esdras «subió de Babilonia» bajo Artajerjes, en 458 a. C. según el cómputo habitual, aunque algunos lo sitúan en 398. Muchos judíos se quedaron: el archivo comercial de Murashu, de Nippur, los nombra en el siglo V, y en siglos posteriores las academias de Sura y Pumbedita produjeron el Talmud de Babilonia. El largo oráculo de Jeremías previó el fin de la tierra: «será la postrera de las gentes: desierto, sequedad, y páramo»."
    - "Babilonia pasó a Alejandro, a los seléucidas, a los partos y a los sasánidas, cuya capital estaba en Ctesifonte, y en 637 a los árabes. Hoy es el sur de Irak, con gobernaciones como Babil, Wasit, Qadisiyah, Dhi Qar y Basora, con las ruinas de Babilonia, Nippur, Uruk y Ur alzándose de la llanura, y las marismas en su extremo meridional, desecadas en la década de 1990 y en parte restauradas."
  pt:
    - "Babilônia, aqui, é a terra para onde os exilados foram levados, não a cidade de Babilônia: a planície aluvial do baixo Tigre e do Eufrates, de cerca de Bagdá para o sul até os pântanos e o golfo Pérsico, plana, quente, quase sem chuva e irrigada por canais. Gênesis a chama “a terra de Sinar”, com Babel, Ereque e Acade como as primeiras cidades de seu reino; os profetas dizem “a terra dos caldeus”, pelas tribos que a governaram desde o século VII a.C., e Esdras “a província da Babilônia”. Cidades sumérias surgiram aqui antes de 3000 a.C., Hamurábi de Babilônia uniu a terra no século XVIII a.C. (as cronologias diferem por um século e mais), e cassitas e assírios a dominaram por sua vez, até que Nabopolassar a tornou independente em 626 a.C. e seu filho Nabucodonosor II (605–562) a fez um império."
    - "Para Judá, a Babilônia foi a terra do exílio. Nabucodonosor tomou Jerusalém em 597 a.C. e levou Joaquim e “todos os artesãos e ferreiros”; em 586 (ou 587) seu exército queimou a cidade, e “o restante do povo que havia ficado na cidade” os seguiu. Os exilados foram instalados nos canais da região de Nipur: Ezequiel teve suas visões “entre os cativos junto ao rio Quebar”, e tabuinhas cuneiformes de uma “cidade de Judá” (Al-Yahudu) registram seus campos, dívidas e nomes hebraicos de 572 a 477 a.C. As rações de Joaquim constam dos arquivos do palácio de Nabucodonosor. “Junto aos rios da Babilônia, ali nos assentamos. Sim, nós choramos, quando nos lembramos de Sião.”"
    - "Ciro da Pérsia tomou Babilônia sem batalha em 539 a.C., e em seu primeiro ano Sesbazar trouxe os utensílios do templo “da Babilônia para Jerusalém”; Esdras 2 lista “os filhos da província que subiram do cativeiro”, e o próprio Esdras “subiu da Babilônia” sob Artaxerxes, em 458 a.C. pelo cálculo habitual, embora alguns o situem em 398. Muitos judeus ficaram: o arquivo comercial de Murashu, de Nipur, os nomeia no século V, e nos séculos seguintes as academias de Sura e Pumbedita produziram o Talmude Babilônico. O longo oráculo de Jeremias previu o fim da terra: “ela será a menor das nações, um ermo, uma terra seca e um deserto”."
    - "A Babilônia passou a Alexandre, aos selêucidas, aos partas e aos sassânidas, cuja capital ficava em Ctesifonte, e em 637 aos árabes. Hoje é o sul do Iraque, com províncias como Babil, Wasit, Qadisiyah, Dhi Qar e Basra, com as ruínas de Babilônia, Nipur, Uruk e Ur emergindo da planície, e os pântanos em seu extremo sul, drenados na década de 1990 e em parte restaurados."
  de:
    - "Babylonien ist hier das Land, in das die Verbannten geführt wurden, nicht die Stadt Babylon: die Schwemmlandebene des unteren Tigris und Euphrat, von etwa Bagdad südwärts bis zu den Marschen und dem Persischen Golf, flach, heiß, fast regenlos und von Kanälen bewässert. Die Genesis verortet Babel, Erech und Akkad, die ersten Städte seines Reiches, „im Lande Sinear“; die Propheten sagen „das Land der Chaldäer“, nach den Stämmen, die es seit dem 7. Jahrhundert v. Chr. beherrschten, und Esra „die Landschaft Babel“. Sumerische Städte erhoben sich hier vor 3000 v. Chr., Hammurabi von Babylon einte das Land im 18. Jahrhundert v. Chr. (die Chronologien unterscheiden sich um ein Jahrhundert und mehr), und Kassiten und Assyrer hielten es nacheinander, bis Nabopolassar es 626 v. Chr. unabhängig machte und sein Sohn Nebukadnezar II. (605–562) es zu einem Weltreich machte."
    - "Für Juda war Babylonien das Land des Exils. Nebukadnezar nahm Jerusalem 597 v. Chr. ein und führte Jojachin fort und „alle Zimmerleute und alle Schmiede“; 586 (oder 587) verbrannte sein Heer die Stadt, und „das andere Volk, das übrig war in der Stadt“, folgte. Die Verbannten wurden an den Kanälen der Gegend von Nippur angesiedelt: Hesekiel sah seine Gesichte „unter den Gefangenen am Wasser Chebar“, und Keilschrifttafeln aus einer „Stadt Judas“ (Al-Yahudu) verzeichnen ihre Felder, Schulden und hebräischen Namen von 572 bis 477 v. Chr. Jojachins Rationen stehen in den Archiven von Nebukadnezars Palast. „An den Wassern zu Babel saßen wir und weinten, wenn wir an Zion gedachten.“"
    - "Kyrus von Persien nahm Babylon 539 v. Chr. ohne Schlacht ein, und in seinem ersten Jahr brachte Scheschbazzar die Tempelgeräte „mit denen, die aus der Gefangenschaft von Babel heraufzogen gen Jerusalem“; Esra 2 führt auf „die Kinder der Landschaft, die heraufzogen aus der Gefangenschaft“, und Esra selbst führte die Häupter der Vaterhäuser, „die mit mir heraufzogen von Babel“, unter Artaxerxes, nach üblicher Rechnung 458 v. Chr., obwohl manche ihn 398 ansetzen. Viele Juden blieben: Das Geschäftsarchiv der Murašu aus Nippur nennt sie im 5. Jahrhundert, und in späteren Jahrhunderten brachten die Akademien von Sura und Pumbedita den Babylonischen Talmud hervor. Jeremias langer Spruch sah das Ende des Landes voraus: „unter den Heiden ist sie die geringste, wüst, dürr und öde“."
    - "Babylonien ging an Alexander, die Seleukiden, die Parther und die Sasaniden, deren Hauptstadt Ktesiphon war, und 637 an die Araber. Heute ist es der Südirak mit Gouvernements wie Babil, Wasit, Qadisiyya, Dhi Qar und Basra, wo die Ruinen von Babylon, Nippur, Uruk und Ur aus der Ebene aufragen, und mit den Marschen an seinem Südende, in den 1990er Jahren trockengelegt und teilweise wiederhergestellt."
  fr:
    - "La Babylonie est ici le pays où furent emmenés les exilés, non la ville de Babylone : la plaine alluviale du bas Tigre et de l’Euphrate, d’environ Bagdad vers le sud jusqu’aux marais et au golfe Persique, plate, chaude, presque sans pluie, et alimentée par des canaux. La Genèse l’appelle « le pays de Schinear », avec Babel, Érec et Accad pour premières villes de son royaume ; les prophètes disent « le pays des Chaldéens », d’après les tribus qui la dominèrent dès le VIIe siècle av. J.-C., et Esdras « la province de Babylone ». Des villes sumériennes s’y élevaient avant 3000 av. J.-C., Hammurabi de Babylone unifia le pays au XVIIIe siècle av. J.-C. (chronologies divergentes d’un siècle et plus), et Cassites et Assyriens le tinrent tour à tour jusqu’à ce que Nabopolassar le rende indépendant en 626 av. J.-C. et que son fils Nebucadnetsar II (605-562) en fasse un empire."
    - "Pour Juda, la Babylonie fut le pays de l’exil. Nebucadnetsar prit Jérusalem en 597 av. J.-C. et emmena Jojakin et « tous les charpentiers et les serruriers » ; en 586 (ou 587), son armée brûla la ville, et « ceux du peuple qui étaient demeurés dans la ville » suivirent. Les exilés furent établis sur les canaux de la région de Nippur : Ézéchiel eut ses visions « parmi les captifs du fleuve du Kebar », et des tablettes cunéiformes d’une « ville de Juda » (Al-Yahudu) consignent leurs champs, dettes et noms hébreux de 572 à 477 av. J.-C. Les rations de Jojakin figurent dans les archives du palais de Nebucadnetsar. « Sur les bords des fleuves de Babylone, nous étions assis et nous pleurions, en nous souvenant de Sion »."
    - "Cyrus de Perse prit Babylone sans bataille en 539 av. J.-C., et dès sa première année Scheschbatsar emporta les objets du temple « de Babylone à Jérusalem » ; Esdras 2 énumère « ceux de la province qui revinrent de l’exil », et Esdras lui-même « vint de Babylone » sous Artaxerxès, en 458 av. J.-C. selon le calcul habituel, bien que certains le placent en 398. Beaucoup de Juifs restèrent : l’archive commerciale des Murashu de Nippur les nomme au Ve siècle, et dans les siècles suivants les académies de Sura et de Pumbedita produisirent le Talmud de Babylone. Le long oracle de Jérémie prévoyait la fin du pays : « elle est la dernière des nations, c’est un désert, une terre sèche et aride »."
    - "La Babylonie passa à Alexandre, aux Séleucides, aux Parthes et aux Sassanides, dont la capitale était à Ctésiphon, et en 637 aux Arabes. Aujourd’hui c’est le sud de l’Irak, avec des gouvernorats comme Babil, Wasit, Qadisiyah, Dhi Qar et Bassora, les ruines de Babylone, de Nippur, d’Uruk et d’Ur surgissant de la plaine, et les marais à son extrémité sud, asséchés dans les années 1990 et en partie restaurés."
