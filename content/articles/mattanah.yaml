# Overview article (ADR 0007). Mainstream facts only; the site is named as an identification and the Jewish reading of the name as interpretation.
id: mattanah
place: a033373
title:
  en: "Mattanah"
  ru: "Матанна"
  uk: "Маттана"
  es: "Matana"
  pt: "Matana"
  de: "Mattana"
  fr: "Matthana"
body:
  en:
    - "Mattanah is a stage on Israel’s last march north of the Arnon, in the short itinerary of Numbers 21. At Beer the LORD gave the people water and they sang the Song of the Well: “The princes digged the well, the nobles of the people digged it, by the direction of the lawgiver, with their staves. And from the wilderness they went to Mattanah: And from Mattanah to Nahaliel: and from Nahaliel to Bamoth”, and on to the top of Pisgah, before Moses sent to Sihon. The name means “gift”, and Jewish interpreters read the run of names as a parable: the well was given as a gift and went with Israel from place to place. Nothing more is told of Mattanah."
    - "The map places it at Khirbet el-Medeiyineh (al-Mudayna) on the Wadi eth-Themed, a tributary of the Arnon south-east of Madaba, the site of a fortified Iron Age town excavated since the 1990s by a Canadian team under Michèle Daviau, with a small shrine and incense altars. The match rests on the route and on the likeness of the name, and is not certain. The site lies today in the Madaba governorate of Jordan."
  ru:
    - "Матанна — остановка на последнем переходе Израиля к северу от Арнона, в коротком перечне 21-й главы Чисел. У Беэра Господь дал народу воду, и он воспел песнь о колодезе: «колодезь, который выкопали князья, вырыли вожди народа с законодателем жезлами своими. Из пустыни отправились в Матанну, из Матанны в Нагалиил, из Нагалиила в Вамоф», а оттуда на вершину Фасги, прежде чем Моисей послал к Сигону. Имя значит «дар», и иудейские толкователи читали этот ряд имён как притчу: колодезь был дан в дар и шёл с Израилем от места к месту. Больше о Матанне ничего не сказано."
    - "На карте она стоит в Хирбет-эль-Медейине (аль-Мудайна) на Вади-эт-Тамад, притоке Арнона к юго-востоку от Медевы (Мадабы), — месте укреплённого города железного века, который с 1990-х годов раскапывает канадская экспедиция под руководством Мишель Давио, с небольшим святилищем и жертвенниками для курений. Совпадение основано на маршруте и сходстве имени и не бесспорно. Сегодня это место в иорданской провинции Мадаба."
  uk:
    - "Маттана — стоянка останнього переходу Ізраїлю на північ від Арнону, у короткому маршруті Книги Чисел, розділ 21. При Беері Господь дав народові воду, і вони заспівали Пісню криниці: «Колодязь той самі князї копали, дуки з народу, і сам законодавець жезлом пробивали. А із степу добирались дальше до Маттана. Із Маттана в Нахалієль, а з Нахалієля до Бамота», а далі до верховин Пісги, перш ніж Мойсей послав до Сігона. Назва означає «дар», і єврейські тлумачі читають низку назв як притчу: криницю було дано в дар, і вона йшла з Ізраїлем з місця на місце. Про Маттану більше нічого не сказано."
    - "Мапа розміщує її в Хірбет-ель-Мдейїне (аль-Мудайна) на ваді ес-Темед, притоці Арнону на південний схід від Мадаби, місці укріпленого міста залізної доби, яке від 1990-х рр. розкопує канадська група під керівництвом Мішель Довіо, з малою святинею й жертовниками для куріння. Збіг спирається на маршрут і схожість назви і не є певним. Це місце лежить сьогодні в мухафазі Мадаба в Йорданії."
  es:
    - "Matana es una etapa de la última marcha de Israel al norte del Arnón, en el breve itinerario de Números 21. En Beer, Jehová dio agua al pueblo y este cantó el Cántico del Pozo: «Pozo, el cual cavaron los señores; caváronlo los príncipes del pueblo, y el legislador, con sus bordones. Y del desierto vinieron á Mathana: Y de Mathana á Nahaliel: y de Nahaliel á Bamoth», y hasta la cumbre de Pisga, antes de que Moisés enviara mensajeros a Sehón. El nombre significa «don», y los intérpretes judíos leyeron la serie de nombres como una parábola: el pozo fue dado como un don y acompañó a Israel de lugar en lugar. No se cuenta nada más de Matana."
    - "El mapa la sitúa en Khirbet el-Medeiyineh (al-Mudayna), en el Wadi eth-Themed, un afluente del Arnón al sudeste de Madaba, sitio de una ciudad fortificada de la Edad del Hierro excavada desde los años noventa por un equipo canadiense bajo Michèle Daviau, con un pequeño santuario y altares de incienso. La correspondencia descansa en la ruta y en el parecido del nombre, y no es segura. El sitio se halla hoy en la gobernación de Madaba, en Jordania."
  pt:
    - "Matana é uma etapa da última marcha de Israel ao norte do Arnom, no breve itinerário de Números 21. Em Beer o SENHOR deu água ao povo, e eles cantaram o Cântico do Poço: “o poço que os príncipes cavaram, que os nobres do povo cavaram, com o cetro e com os seus cajados. Do deserto eles viajaram para Mataná; e de Mataná para Naaliel; e de Naaliel para Bamote”, e daí ao topo de Pisga, antes de Moisés enviar mensageiros a Seom. O nome significa “dádiva”, e intérpretes judeus leem a sequência de nomes como uma parábola: o poço foi dado como dádiva e acompanhou Israel de lugar em lugar. Nada mais se conta de Matana."
    - "O mapa a situa em Khirbet el-Medeiyineh (al-Mudayna), no Wadi eth-Themed, afluente do Arnom a sudeste de Madaba, sítio de uma cidade fortificada da Idade do Ferro escavada desde a década de 1990 por uma equipe canadense sob Michèle Daviau, com um pequeno santuário e altares de incenso. A correspondência repousa na rota e na semelhança do nome, e não é certa. O sítio fica hoje na província de Madaba, na Jordânia."
  de:
    - "Mattana ist eine Station auf Israels letztem Marsch nördlich des Arnon, in der kurzen Wegbeschreibung von 4. Mose 21. Bei Beer gab der HERR dem Volk Wasser, und sie sangen das Brunnenlied: „Das ist der Brunnen, den die Fürsten gegraben haben; die Edlen im Volk haben ihn gegraben mit dem Zepter, mit ihren Stäben.“ Weiter heißt es: „Und von dieser Wüste zogen sie gen Matthana; und von Matthana gen Nahaliel; und von Nahaliel gen Bamoth“, und weiter zum Gipfel des Pisga, ehe Mose zu Sihon sandte. Der Name bedeutet „Gabe“, und jüdische Ausleger lasen die Namensreihe als Gleichnis: Der Brunnen wurde als Gabe geschenkt und zog mit Israel von Ort zu Ort. Von Mattana wird nichts weiter erzählt."
    - "Die Karte setzt es nach Khirbet el-Medeiyineh (al-Mudayna) am Wadi eth-Themed, einem Zufluss des Arnon südöstlich von Madaba, dem Ort einer befestigten Stadt der Eisenzeit, die seit den 1990er Jahren von einem kanadischen Team unter Michèle Daviau ausgegraben wird, mit einem kleinen Heiligtum und Räucheraltären. Die Zuordnung beruht auf der Route und der Namensähnlichkeit und ist nicht sicher. Der Ort liegt heute im Gouvernement Madaba in Jordanien."
  fr:
    - "Matthana est une étape de la dernière marche d’Israël au nord de l’Arnon, dans le court itinéraire de Nombres 21. À Beer, l’Éternel donna de l’eau au peuple et celui-ci chanta le Cantique du puits : « Puits, que des princes ont creusé, que les grands du peuple ont creusé, avec le sceptre, avec leurs bâtons ! Du désert ils allèrent à Matthana ; de Matthana, à Nahaliel ; de Nahaliel, à Bamoth », puis jusqu’au sommet du Pisga, avant que Moïse envoie des messagers à Sihon. Le nom signifie « don », et des interprètes juifs lisent la suite de noms comme une parabole : le puits fut donné en présent et accompagna Israël de lieu en lieu. On ne dit rien d’autre de Matthana."
    - "La carte la place à Khirbet el-Medeiyineh (al-Mudayna), sur l’ouadi eth-Themed, affluent de l’Arnon au sud-est de Madaba, site d’une ville fortifiée de l’âge du Fer fouillée depuis les années 1990 par une équipe canadienne sous la direction de Michèle Daviau, avec un petit sanctuaire et des autels à encens. L’identification repose sur l’itinéraire et sur la ressemblance du nom, et n’est pas certaine. Le site se trouve aujourd’hui dans le gouvernorat de Madaba, en Jordanie."
scripture:
