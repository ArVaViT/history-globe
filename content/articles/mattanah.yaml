body:
  en:
    - "Mattanah is a stage on Israel’s last march north of the Arnon, in the short itinerary of Numbers 21. At Beer the LORD gave the people water and they sang the Song of the Well: “The princes digged the well, the nobles of the people digged it, by the direction of the lawgiver, with their staves. And from the wilderness they went to Mattanah: And from Mattanah to Nahaliel: and from Nahaliel to Bamoth”, and on to the top of Pisgah, before Israel sent messengers to Sihon. The name means “gift”, and Jewish interpreters read the run of names as a parable: the well was given as a gift and went with Israel from place to place. Nothing more is told of Mattanah."
    - "The map places it at Khirbet el-Medeiyineh (al-Mudayna) on the Wadi eth-Themed, a tributary of the Arnon south-east of Madaba, the site of a fortified Iron Age town excavated from 1995 to 2012 by a Canadian team under Michèle Daviau, with a small shrine and incense altars. The match rests on the route and on the likeness of the name, and is not certain. The site lies today in central Jordan."
  ru:
    - "Матанна — остановка на последнем переходе Израиля к северу от Арнона, в коротком перечне 21-й главы Чисел. У Беэра Господь дал народу воду, и он воспел песнь о колодезе: «колодезь, который выкопали князья, вырыли вожди народа с законодателем жезлами своими. Из пустыни отправились в Матанну, из Матанны в Нагалиил, из Нагалиила в Вамоф», а оттуда на вершину Фасги, прежде чем Израиль отправил послов к Сигону. Имя значит «дар», и иудейские толкователи читали этот ряд имён как притчу: колодезь был дан в дар и шёл с Израилем от места к месту. Больше о Матанне ничего не сказано."
    - "На карте она стоит в Хирбет-эль-Медейине (аль-Мудайна) на Вади-эт-Тамад, притоке Арнона к юго-востоку от Медевы (Мадабы), — месте укреплённого города железного века, который в 1995–2012 годах раскапывала канадская экспедиция под руководством Мишель Давио, с небольшим святилищем и жертвенниками для курений. Совпадение основано на маршруте и сходстве имени и не бесспорно. Сегодня это место в центральной Иордании."
  uk:
    - "Маттана — стоянка останнього переходу Ізраїлю на північ від Арнону, у короткому маршруті Книги Чисел, розділ 21. При Беері Господь дав народові воду, і вони заспівали Пісню криниці: «Колодязь той самі князї копали, дуки з народу, і сам законодавець жезлом пробивали. А із степу добирались дальше до Маттана. Із Маттана в Нахалієль, а з Нахалієля до Бамота», а далі до верховин Пісги, перш ніж Ізраїль послав послів до Сігона. Назва означає «дар», і єврейські тлумачі читають низку назв як притчу: криницю було дано в дар, і вона йшла з Ізраїлем з місця на місце. Про Маттану більше нічого не сказано."
    - "Мапа розміщує її в Хірбет-ель-Мдейїне (аль-Мудайна) на ваді ес-Темед, притоці Арнону на південний схід від Мадаби, місці укріпленого міста залізної доби, яке в 1995–2012 рр. розкопувала канадська група під керівництвом Мішель Довіо, з малою святинею й жертовниками для куріння. Збіг спирається на маршрут і схожість назви і не є певним. Це місце лежить сьогодні в центральній Йорданії."
  es:
    - "Matana es una etapa de la última marcha de Israel al norte del Arnón, en el breve itinerario de Números 21. En Beer, Jehová dio agua al pueblo y este cantó el Cántico del Pozo: «Pozo, el cual cavaron los señores; caváronlo los príncipes del pueblo, y el legislador, con sus bordones. Y del desierto vinieron á Mathana: Y de Mathana á Nahaliel: y de Nahaliel á Bamoth», y hasta la cumbre de Pisga, antes de que Israel enviara mensajeros a Sehón. El nombre significa «don», y los intérpretes judíos leyeron la serie de nombres como una parábola: el pozo fue dado como un don y acompañó a Israel de lugar en lugar. No se cuenta nada más de Matana."
    - "El mapa la sitúa en Khirbet el-Medeiyineh (al-Mudayna), en el Wadi eth-Themed, un afluente del Arnón al sudeste de Madaba, sitio de una ciudad fortificada de la Edad del Hierro excavada de 1995 a 2012 por un equipo canadiense bajo Michèle Daviau, con un pequeño santuario y altares de incienso. La correspondencia descansa en la ruta y en el parecido del nombre, y no es segura. El sitio se halla hoy en el centro de Jordania."
  pt:
    - "Matana é uma etapa da última marcha de Israel ao norte do Arnom, no breve itinerário de Números 21. Em Beer o SENHOR deu água ao povo, e eles cantaram o Cântico do Poço: “o poço que os príncipes cavaram, que os nobres do povo cavaram, com o cetro e com os seus cajados. Do deserto eles viajaram para Mataná; e de Mataná para Naaliel; e de Naaliel para Bamote”, e daí ao topo de Pisga, antes de Israel enviar mensageiros a Seom. O nome significa “dádiva”, e intérpretes judeus leem a sequência de nomes como uma parábola: o poço foi dado como dádiva e acompanhou Israel de lugar em lugar. Nada mais se conta de Matana."
    - "O mapa a situa em Khirbet el-Medeiyineh (al-Mudayna), no Wadi eth-Themed, afluente do Arnom a sudeste de Madaba, sítio de uma cidade fortificada da Idade do Ferro escavada de 1995 a 2012 por uma equipe canadense sob Michèle Daviau, com um pequeno santuário e altares de incenso. A correspondência repousa na rota e na semelhança do nome, e não é certa. O sítio fica hoje no centro da Jordânia."
  de:
    - "Mattana ist eine Station auf Israels letztem Marsch nördlich des Arnon, in der kurzen Wegbeschreibung von 4. Mose 21. Bei Beer gab der HERR dem Volk Wasser, und sie sangen das Brunnenlied: „Das ist der Brunnen, den die Fürsten gegraben haben; die Edlen im Volk haben ihn gegraben mit dem Zepter, mit ihren Stäben.“ Weiter heißt es: „Und von dieser Wüste zogen sie gen Matthana; und von Matthana gen Nahaliel; und von Nahaliel gen Bamoth“, und weiter zum Gipfel des Pisga, ehe Israel Boten zu Sihon sandte. Der Name bedeutet „Gabe“, und jüdische Ausleger lasen die Namensreihe als Gleichnis: Der Brunnen wurde als Gabe geschenkt und zog mit Israel von Ort zu Ort. Von Mattana wird nichts weiter erzählt."
    - "Die Karte setzt es nach Khirbet el-Medeiyineh (al-Mudayna) am Wadi eth-Themed, einem Zufluss des Arnon südöstlich von Madaba, dem Ort einer befestigten Stadt der Eisenzeit, die von 1995 bis 2012 von einem kanadischen Team unter Michèle Daviau ausgegraben wurde, mit einem kleinen Heiligtum und Räucheraltären. Die Zuordnung beruht auf der Route und der Namensähnlichkeit und ist nicht sicher. Der Ort liegt heute in Zentraljordanien."
  fr:
    - "Matthana est une étape de la dernière marche d’Israël au nord de l’Arnon, dans le court itinéraire de Nombres 21. À Beer, l’Éternel donna de l’eau au peuple et celui-ci chanta le Cantique du puits : « Puits, que des princes ont creusé, que les grands du peuple ont creusé, avec le sceptre, avec leurs bâtons ! Du désert ils allèrent à Matthana ; de Matthana, à Nahaliel ; de Nahaliel, à Bamoth », puis jusqu’au sommet du Pisga, avant qu’Israël envoie des messagers à Sihon. Le nom signifie « don », et des interprètes juifs lisent la suite de noms comme une parabole : le puits fut donné en présent et accompagna Israël de lieu en lieu. On ne dit rien d’autre de Matthana."
    - "La carte la place à Khirbet el-Medeiyineh (al-Mudayna), sur l’ouadi eth-Themed, affluent de l’Arnon au sud-est de Madaba, site d’une ville fortifiée de l’âge du Fer fouillée de 1995 à 2012 par une équipe canadienne sous la direction de Michèle Daviau, avec un petit sanctuaire et des autels à encens. L’identification repose sur l’itinéraire et sur la ressemblance du nom, et n’est pas certaine. Le site se trouve aujourd’hui dans le centre de la Jordanie."
  it:
    - "Mattana è una tappa dell’ultima marcia d’Israele a nord dell’Arnon, nel breve itinerario di Numeri 21. A Beer l’Eterno diede acqua al popolo ed essi cantarono il Cantico del Pozzo: «Pozzo che i principi hanno scavato, che i nobili del popolo hanno aperto con lo scettro, coi loro bastoni! … Poi dal deserto andarono a Matthana; da Matthana a Nahaliel; da Nahaliel a Bamoth», e fino alla cima del Pisga, prima che Israele mandasse messaggeri a Sicon. Il nome significa «dono», e gli interpreti ebrei leggono la serie di nomi come una parabola: il pozzo fu dato in dono e andò con Israele di luogo in luogo. Nulla più si racconta di Mattana."
    - "La mappa la colloca a Khirbet el-Medeiyineh (al-Mudayna) sul Wadi eth-Themed, un affluente dell’Arnon a sud-est di Màdaba, sito di una città fortificata dell’età del Ferro scavata dal 1995 al 2012 da una squadra canadese diretta da Michèle Daviau, con un piccolo santuario e altari per l’incenso. La corrispondenza poggia sul percorso e sulla somiglianza del nome, e non è certa. Il sito si trova oggi nella Giordania centrale."
  pl:
    - "Mattana to etap ostatniego marszu Izraela na północ od Arnonu, w krótkim itinerarium z Lb 21. W Beer Pan dał ludowi wodę i śpiewali Pieśń o Studni: „Studnia, którą wykopali książęta, wykopali ją hetmani ludu z ustawcą zakonu, laskami swojemi. A z tej puszczy ruszyli się do Matana; A z Matana do Nahalijelu, a z Nahalijelu do Bamotu”, a potem na szczyt Pisgi, zanim Izrael wysłał posłów do Sychona. Nazwa znaczy „dar”, a żydowscy interpretatorzy czytają ciąg nazw jako przypowieść: studnia została dana w darze i szła z Izraelem z miejsca na miejsce. Nic więcej o Mattanie nie wiadomo."
    - "Mapa umieszcza ją w Khirbet el-Medeiyineh (al-Mudayna) nad Wadi eth-Themed, dopływem Arnonu na południowy wschód od Madaby, w obwarowanym mieście z epoki żelaza, wykopywanym w latach 1995–2012 przez zespół kanadyjski pod kierunkiem Michèle Daviau, z małym sanktuarium i ołtarzami kadzielnymi. Dopasowanie opiera się na trasie i podobieństwie nazwy i nie jest pewne. Stanowisko leży dziś w środkowej Jordanii."
  nl:
    - "Mattana is een etappe van Israëls laatste mars ten noorden van de Arnon, in de korte reisbeschrijving van Numeri 21. Bij Beër gaf de HEER het volk water en zij zongen het Lied van de Put: “Gij put, dien de vorsten gegraven hebben, dien de edelen des volks gedolven hebben, door den wetgever, met hun staven. En van de woestijn reisden zij naar Mattana; en van Mattana tot Nahaliel; en van Nahaliel tot Bamoth”, en verder tot de top van de Pisga, voordat Israël boden naar Sihon zond. De naam betekent “gift”, en joodse uitleggers lazen de reeks namen als een gelijkenis: de put werd als gift gegeven en ging met Israël mee van plaats tot plaats. Verder wordt van Mattana niets verteld."
    - "De kaart plaatst het bij Khirbet el-Medeiyineh (al-Mudayna) aan de Wadi eth-Themed, een zijrivier van de Arnon ten zuidoosten van Madaba, de plaats van een versterkte stad uit de ijzertijd die van 1995 tot 2012 door een Canadees team onder Michèle Daviau werd opgegraven, met een klein heiligdom en wierookaltaren. De overeenkomst berust op de route en op de gelijkenis van de naam, en is niet zeker. De plaats ligt tegenwoordig in centraal Jordanië."
  cs:
    - "Matana je stanice poslední cesty Izraele na sever od Arnonu, v krátkém itineráři Numeri 21. U Beeru dal Hospodin lidu vodu a zpívali Píseň o studnici: „Studnice, kterouž kopala knížata, kterouž vykopali přední z lidu s vydavatelem zákona holemi svými. Z pouště pak brali se do Matana, A z Matana do Nahaliel, z Nahaliel do Bamot“, a dál na vrchol Pisgy, než Izrael poslal posly k Sichonovi. Jméno znamená „dar“ a židovští vykladači čtou řadu jmen jako podobenství: studna byla dána jako dar a šla s Izraelem z místa na místo. Víc se o Mataně neříká."
    - "Mapa ji klade do Khirbet el-Medeiyineh (al-Mudayna) na Wádí eth-Themed, přítoku Arnonu jihovýchodně od Madaby, na místo opevněného města z doby železné vykopávaného v letech 1995–2012 kanadským týmem pod vedením Michèle Daviauové, s malou svatyní a kadidelními oltáři. Shoda spočívá na trase a na podobnosti jména a není jistá. Místo leží dnes ve středním Jordánsku."
  sv:
    - "Mattana är en etapp på Israels sista marsch norr om Arnon, i den korta färdvägen i Fjärde Mosebok 21. Vid Beer gav HERREN folket vatten och de sjöng Brunnssången: ”om brunnen som furstar grävde, som folkets ypperste borrade, med spiran, med sina stavar. Från öknen drogo de till Mattana, från Mattana till Nahaliel”, från Nahaliel till Bamot, och vidare till Pisgas topp, innan Israel sände bud till Sichon. Namnet betyder ”gåva”, och judiska uttolkare läser raden av namn som en liknelse: brunnen gavs som en gåva och följde Israel från plats till plats. Inget mer berättas om Mattana."
    - "Kartan placerar den vid Khirbet el-Medeiyineh (al-Mudayna) vid Wadi eth-Themed, en biflod till Arnon sydost om Madaba, platsen för en befäst stad från järnåldern som grävdes ut 1995–2012 av ett kanadensiskt lag under Michèle Daviau, med en liten helgedom och rökelsealtare. Överensstämmelsen vilar på färdvägen och på namnlikheten och är inte säker. Platsen ligger i dag i centrala Jordanien."
  nb:
    - "Mattana er en etappe på Israels siste marsj nord for Arnon, i den korte reiseruten i Fjerde Mosebok 21. Ved Beer ga Herren folket vann, og de sang Brønnsangen: «Du brønn som høvdinger har gravd, som folkets ypperste har boret med herskerstav, med sine kongespir! Fra ørkenen brøt de op til Matana og fra Matana til Nahaliel og fra Nahaliel til Bamot», og videre til toppen av Pisga, før Israel sendte bud til Sihon. Navnet betyr «gave», og jødiske tolkere leste rekken av navn som en lignelse: brønnen ble gitt som en gave og fulgte Israel fra sted til sted. Ingenting mer fortelles om Mattana."
    - "Kartet plasserer den ved Khirbet el-Medeiyineh (al-Mudayna) ved Wadi eth-Themed, en sideelv til Arnon sørøst for Madaba, stedet for en befestet by fra jernalderen utgravd fra 1995 til 2012 av et kanadisk lag under Michèle Daviau, med en liten helligdom og røkelsesaltere. Sammenfallet hviler på ruten og på likheten mellom navnene, og er ikke sikkert. Stedet ligger i dag i det sentrale Jordan."
  tl:
    - "Ang Mathana ay isang yugto sa huling martsa ng Israel sa hilaga ng Arnon, sa maikling itineraryo ng Mga Bilang 21. Sa Beer binigyan ng Panginoon ng tubig ang bayan at inawit nila ang Awit ng Balon: “Siyang balong hinukay ng mga prinsipe, Na pinalalim ng mga mahal sa bayan, Ng setro at ng kanilang mga tungkod. At mula sa ilang, sila'y napasa Mathana. At mula sa Mathana ay napasa Nahaliel: at mula sa Nahaliel ay napasa Bamoth”, at hanggang sa tuktok ng Pisga, bago nagsugo ang Israel ng mga sugo kay Sehon. Ang pangalan ay nangangahulugang “kaloob”, at binabasa ng mga Judiong tagapagpaliwanag ang hanay ng mga pangalan bilang talinghaga: ang balon ay ibinigay bilang kaloob at sumama sa Israel mula lugar patungong lugar. Wala nang iba pang isinasalaysay tungkol sa Mathana."
    - "Inilalagay ito ng mapa sa Khirbet el-Medeiyineh (al-Mudayna) sa Wadi eth-Themed, isang sanga ng Arnon sa timog-silangan ng Madaba, ang pook ng isang kutang bayan ng Panahon ng Bakal na hinukay mula 1995 hanggang 2012 ng isang pangkat na Canadiano sa ilalim ni Michèle Daviau, na may maliit na dambana at mga altar ng insenso. Nakasalig ang pagtutugma sa ruta at sa pagkakahawig ng pangalan, at hindi tiyak. Ang pook ay nasa gitnang Jordan ngayon."
  da:
    - "Mattana er en etape på Israels sidste march nord for Arnon, i den korte rejseplan i Fjerde Mosebog 21. Ved Be'er gav Herren folket vand, og de sang Brøndens sang: »Brønd, som er graven af Fyrsterne, kastet af de ædle iblandt Folket, med Fyrstespir, med deres Herskerstave! Og fra den Ørk rejste de til Matthana, og fra Matthana til Nahaliel, og fra Nahaliel til Bamoth«, og videre til toppen af Pisga, før Israel sendte bud til Sihon. Navnet betyder »gave«, og jødiske fortolkere læste rækken af navne som en lignelse: brønden blev givet som en gave og fulgte med Israel fra sted til sted. Intet mere fortælles om Mattana."
    - "Kortet placerer den ved Khirbet el-Medeiyineh (al-Mudayna) ved Wadi eth-Themed, en biflod til Arnon sydøst for Madaba, stedet for en befæstet jernalderby udgravet fra 1995 til 2012 af et canadisk hold under Michèle Daviau, med en lille helligdom og røgelsesalter. Sammenfaldet hviler på ruten og på navnets lighed og er ikke sikkert. Stedet ligger i dag i det centrale Jordan."
