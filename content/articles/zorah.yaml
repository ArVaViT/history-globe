body:
  en:
    - "Zorah is Tel Tzora, a high hill on the north side of the Sorek valley, about 23 km west of Jerusalem and some 3 km north of Beth-shemesh, where the hills of Judah meet the Shephelah. The Arab village of Sar'a on the hill kept the ancient name until 1948, and Eshtaol, usually named with Zorah in the Bible, lay close by. Caves, tombs, cisterns and winepresses have been found on and around the hill."
    - "Zorah probably appears already in the Amarna letters of the fourteenth century BC. A ruler known as the Lady of the Lionesses warned Pharaoh that his land was going over to the Apiru, roving armed bands, and that the Apiru had written to Ayyaluna, that is Aijalon, and to Sarha, which is usually taken to be Zorah."
    - 'In the Book of Joshua Zorah is counted among the towns of the lowland of Judah and is also listed in the inheritance of Dan. It was the home of Manoah, "a certain man of Zorah, of the family of the Danites", whose son Samson the Spirit of the LORD began to move "in the camp of Dan between Zorah and Eshtaol"; after his death Samson was buried between Zorah and Eshtaol in the burying place of his father. From Zorah and Eshtaol the Danites sent five men to spy out the land and then six hundred armed men, who took Laish in the far north and named it Dan. Rehoboam fortified Zorah with Aijalon, and after the exile men of Judah lived there again, as Nehemiah records.'
    - "Josephus says that Samson's kindred buried him at Sarasat, his own country. In the early fourth century AD Eusebius knew Saraa as a village in the district of Eleutheropolis, about ten miles to the north on the road to Nicopolis, and pointed it out as the home of Samson."
  ru:
    - "Цора — это Тель-Цора, высокий холм на северной стороне долины Сорек, примерно в 23 км к западу от Иерусалима и в 3 км к северу от Вефсамиса, там, где горы Иудеи встречаются с Шефелой. Арабское селение Сараа на холме сохраняло древнее имя до 1948 г., а Естаол, который Библия обычно называет вместе с Цорой, лежал рядом. На холме и вокруг него найдены пещеры, гробницы, водоёмы и винодавильни."
    - "Цора, по всей видимости, упоминается уже в амарнских письмах XIV века до н. э. Правительница, известная как Владычица львиц, предупреждала фараона, что его земля переходит к апиру — бродячим вооружённым отрядам — и что апиру писали в Айялуну, то есть Аиалон, и в Сарху, которую обычно отождествляют с Цорой."
    - "В книге Иисуса Навина Цора числится среди городов низменности Иуды и названа также в уделе Дана. Здесь жил Маной, «человек из Цоры, от племени Данова», и в его сыне Самсоне Дух Господень начал действовать «в стане Дановом, между Цорою и Естаолом»; по смерти Самсона похоронили между Цорою и Естаолом во гробе его отца. Из Цоры и Естаола сыны Дановы послали пять человек осмотреть землю, а затем шестьсот вооружённых мужей, которые взяли Лаис на далёком севере и назвали его Даном. Ровоам укрепил Цору вместе с Аиалоном, а после плена сыны Иуды снова жили здесь, как сообщает Неемия."
    - "Иосиф Флавий пишет, что родные похоронили Самсона в Сарасате, на его родине. В начале IV века н. э. Евсевий знал Саару как селение в округе Елевферополя, примерно в десяти милях к северу по дороге в Никополь, и указывал её как родину Самсона."
  uk:
    - "Цора — це Тель-Цора, високий пагорб на північному боці долини Сорек, приблизно за 23 км на захід від Єрусалима і близько 3 км на північ від Бет-Шемеша, де пагорби Юди зустрічаються з Шефелою. Арабське село Сар’а на пагорбі зберігало давню назву до 1948 року, а Ештаол, зазвичай названий у Біблії разом з Цорою, лежав поруч. На пагорбі та навколо нього знайдено печери, гробниці, цистерни й винні преси."
    - "Цора, ймовірно, з’являється вже в листах з Амарни XIV ст. до н. е. Правитель, відомий як Володарка левиць, застерігав фараона, що його земля переходить до апіру, мандрівних озброєних ватаг, і що апіру писали до Аялуни, тобто Аялона, і до Сархи, яку зазвичай беруть за Цору."
    - "У Книзі Ісуса Навина Цора зарахована до міст низовини Юди і також перелічена в уділі Дана. Вона була домівкою Маноя, «один чоловік із Зореага, з поколїння Данового, на імя Маной», сина якого Самсона Дух Господній почав рухати «в таборі Дановому між Зореагом і Естаолом»; по смерті Самсона поховали між Цорою та Ештаолом у батьківському гробовищі. З Цори та Ештаола данійці послали п’ятьох розвідників, а потім шістсот озброєних людей, які взяли Лаіш на далекій півночі й назвали його Даном. Ровоам укріпив Цору з Аялоном, а після вигнання юдеї знову жили там, як записує Неемія."
    - "Йосиф Флавій каже, що родичі Самсона поховали його в Сарасаті, його власному краї. На початку IV століття н. е. Євсевій знав Сару як село в окрузі Елевтеополя, приблизно за десять миль на північ на дорозі до Нікополя, і показував його як домівку Самсона."
  es:
    - "Zora es Tel Tzora, una colina alta en el lado norte del valle de Sorec, a unos 23 km al oeste de Jerusalén y a unos 3 km al norte de Bet-semes, donde las colinas de Judá se encuentran con la Sefelá. La aldea árabe de Sar'a, en la colina, conservó el nombre antiguo hasta 1948, y Estaol, que la Biblia suele nombrar con Zora, estaba cerca. En la colina y en sus alrededores se han hallado cuevas, tumbas, cisternas y lagares."
    - "Zora aparece probablemente ya en las cartas de Amarna del siglo XIV a. C. Un gobernante conocido como la Señora de las Leonas advirtió al faraón de que su tierra se pasaba a los apiru, bandas armadas errantes, y de que los apiru habían escrito a Ayyaluna, es decir, Ajalón, y a Sarha, que suele tomarse por Zora."
    - "En el libro de Josué, Zora se cuenta entre las ciudades de la llanura de Judá y figura también en la heredad de Dan. Era la patria de Manoa, «un hombre de Sora, de la tribu de Dan», cuyo hijo Sansón empezó a ser movido por el Espíritu del Señor «en los campamentos de Dan, entre Sora y Esthaol»; tras su muerte Sansón fue sepultado entre Zora y Estaol en el sepulcro de su padre. De Zora y Estaol los danitas enviaron a cinco hombres a reconocer la tierra y luego a seiscientos hombres armados, que tomaron Lais en el extremo norte y la llamaron Dan. Roboam fortificó Zora con Ajalón, y tras el exilio hombres de Judá vivieron allí de nuevo, como registra Nehemías."
    - "Josefo dice que los parientes de Sansón lo sepultaron en Sarasat, su propia tierra. A comienzos del siglo IV d. C., Eusebio conocía Saraa como una aldea del distrito de Eleuterópolis, a unas diez millas al norte en el camino de Nicópolis, y la señalaba como la patria de Sansón."
  pt:
    - "Zorá é Tel Tzora, uma colina alta no lado norte do vale de Soreque, a cerca de 23 km a oeste de Jerusalém e uns 3 km ao norte de Bete-Semes, onde as colinas de Judá encontram a Sefelá. A aldeia árabe de Sar'a, na colina, conservou o nome antigo até 1948, e Estaol, geralmente nomeada com Zorá na Bíblia, ficava perto. Cavernas, túmulos, cisternas e lagares foram achados na colina e em volta dela."
    - "Zorá provavelmente já aparece nas cartas de Amarna do século XIV a.C. Um governante conhecido como a Senhora das Leoas advertiu o Faraó de que sua terra estava passando aos apiru, bandos armados errantes, e de que os apiru haviam escrito a Ayyaluna, isto é, Aijalom, e a Sarha, geralmente tomada por Zorá."
    - "No livro de Josué, Zorá é contada entre as cidades da planície de Judá e também listada na herança de Dã. Era a terra de Manoá, “um certo homem de Zorá, da família dos danitas”, cujo filho Sansão o Espírito do SENHOR começou a mover “em Maané-Dã, entre Zorá e Estaol”; depois de sua morte, Sansão foi sepultado entre Zorá e Estaol, no túmulo de seu pai. De Zorá e Estaol os danitas enviaram cinco homens para espiar a terra e depois seiscentos homens armados, que tomaram Laís, no extremo norte, e a chamaram Dã. Roboão fortificou Zorá com Aijalom, e depois do exílio homens de Judá viveram ali de novo, como registra Neemias."
    - "Josefo diz que os parentes de Sansão o sepultaram em Sarasat, sua própria terra. No início do século IV d.C., Eusébio conhecia Saraa como uma aldeia no distrito de Eleuterópolis, a umas dez milhas ao norte, na estrada para Nicópolis, e a apontava como a terra de Sansão."
  de:
    - "Zora ist Tel Tzora, ein hoher Hügel an der Nordseite des Sorektals, etwa 23 km westlich von Jerusalem und rund 3 km nördlich von Bet-Schemesch, wo die Hügel Judas auf die Schefela treffen. Das arabische Dorf Sar'a auf dem Hügel bewahrte den antiken Namen bis 1948, und Eschtaol, in der Bibel meist mit Zora genannt, lag ganz in der Nähe. Höhlen, Gräber, Zisternen und Kelterbecken wurden auf und um den Hügel gefunden."
    - "Zora erscheint wahrscheinlich schon in den Amarna-Briefen des vierzehnten Jahrhunderts v. Chr. Eine Herrscherin, die „Herrin der Löwinnen“, warnte den Pharao, dass sein Land zu den Apiru übergehe, umherziehenden bewaffneten Banden, und dass die Apiru an Ajaluna geschrieben hätten, das ist Ajalon, und an Sarha, das man meist für Zora hält."
    - "Im Buch Josua wird Zora zu den Städten des Tieflands Judas gezählt und steht auch im Erbteil Dans. Es war die Heimat Manoachs, „ein Mann zu Zora von einem Geschlecht der Daniter“, dessen Sohn Simson der Geist des HERRN zu treiben anfing „im Lager Dan zwischen Zora und Esthaol“; nach seinem Tod wurde Simson zwischen Zora und Eschtaol im Grab seines Vaters begraben. Von Zora und Eschtaol sandten die Daniter fünf Männer, das Land zu erkunden, und dann sechshundert bewaffnete Männer, die Lais im äußersten Norden nahmen und Dan nannten. Rehabeam befestigte Zora mit Ajalon, und nach dem Exil wohnten wieder Männer Judas dort, wie Nehemia vermerkt."
    - "Josephus sagt, Simsons Verwandte hätten ihn in Sarasat begraben, seiner Heimat. Anfang des vierten Jahrhunderts n. Chr. kannte Eusebius Saraa als Dorf im Gebiet von Eleutheropolis, etwa zehn Meilen nördlich an der Straße nach Nikopolis, und zeigte es als Heimat Simsons."
  fr:
    - "Tsorea est Tel Tzora, haute colline du côté nord de la vallée de Sorek, à environ 23 km à l’ouest de Jérusalem et à quelque 3 km au nord de Beth-Schémesch, là où les collines de Juda rejoignent la Shéphéla. Le village arabe de Sar’a, sur la colline, garda le nom antique jusqu’en 1948, et Eschthaol, d’ordinaire nommée avec Tsorea dans la Bible, se trouvait tout près. Des grottes, des tombes, des citernes et des pressoirs ont été trouvés sur la colline et autour."
    - "Tsorea figure probablement déjà dans les lettres d’Amarna du XIVe siècle av. J.-C. Un souverain connu comme la Dame des Lionnes avertit Pharaon que son pays passait aux Apirou, bandes armées errantes, et que les Apirou avaient écrit à Ayyaluna, c’est-à-dire Ajalon, et à Sarha, d’ordinaire prise pour Tsorea."
    - "Dans le livre de Josué, Tsorea est comptée parmi les villes de la plaine de Juda et figure aussi dans l’héritage de Dan. Elle était la patrie de Manoach, « un homme de Tsorea, de la famille des Danites », dont le fils Samson fut agité par l’Esprit de l’Éternel « à Machané-Dan, entre Tsorea et Eschthaol » ; après sa mort, Samson fut enterré entre Tsorea et Eschthaol, dans le sépulcre de son père. De Tsorea et d’Eschthaol, les Danites envoyèrent cinq hommes explorer le pays puis six cents hommes armés, qui prirent Laïsch à l’extrême nord et la nommèrent Dan. Roboam fortifia Tsorea avec Ajalon, et après l’exil des hommes de Juda y habitèrent de nouveau, comme le note Néhémie."
    - "Josèphe dit que les proches de Samson l’enterrèrent à Sarasat, son pays. Au début du IVe siècle apr. J.-C., Eusèbe connaissait Saraa comme un village du district d’Éleuthéropolis, à une dizaine de milles au nord sur la route de Nicopolis, et la désignait comme la patrie de Samson."
  pl:
    - "Sora to Tel Cora, wysokie wzgórze po północnej stronie doliny Sorek, około 23 km na zachód od Jerozolimy i około 3 km na północ od Bet-Szemesz, gdzie wzgórza Judy spotykają Szefelę. Arabska wieś Sara na wzgórzu zachowała starożytną nazwę do 1948 roku, a Esztaol, zwykle wymieniane w Biblii razem z Sorą, leżało w pobliżu. Na wzgórzu i wokół niego znaleziono jaskinie, groby, cysterny i prasy do wina."
    - "Sora pojawia się prawdopodobnie już w listach z Amarna z XIV wieku p.n.e. Władczyni znana jako Pani Lwic ostrzegała faraona, że jego kraj przechodzi do Apiru, wędrownych zbrojnych band, i że Apiru napisali do Ajjaluny, czyli Ajjalon, i do Sarchy, którą uważa się zwykle za Sorę."
    - "W Księdze Jozuego Sora jest zaliczona do miast niziny Judy i wymieniona także w dziedzictwie Dana. Była domem Manoacha, „mąż niektóry z Saraa, z pokolenia Dan”, którego syna Samsona Duch Pański zaczął poruszać „w obozie Dan między Saraa i między Estaol”; po śmierci Samson został pochowany między Sorą a Esztaol w grobie swego ojca. Z Sory i Esztaol Danici wysłali pięciu mężów na zwiad, a potem sześciuset uzbrojonych, którzy zdobyli Lajisz na dalekiej północy i nazwali je Dan. Roboam umocnił Sorę wraz z Ajjalonem, a po wygnaniu ludzie z Judy znów tam mieszkali, jak notuje Nehemiasz."
    - "Józef Flawiusz pisze, że krewni Samsona pochowali go w Sarasat, jego własnym kraju. Na początku IV wieku n.e. Euzebiusz znał Saraę jako wieś w okręgu Eleuteropolis, około dziesięciu mil na północ przy drodze do Nikopolis, i wskazywał ją jako dom Samsona."
  it:
    - "Zorea è Tel Tzora, un’alta collina sul lato nord della valle del Sorek, circa 23 km a ovest di Gerusalemme e circa 3 km a nord di Bet-Semes, dove le colline di Giuda incontrano la Sefela. Il villaggio arabo di Sar’a sulla collina conservò l’antico nome fino al 1948, e Estaol, di solito nominata con Zorea nella Bibbia, giaceva lì vicino. Sulla collina e attorno ad essa sono state trovate grotte, tombe, cisterne e torchi."
    - "Zorea compare probabilmente già nelle lettere di Amarna del XIV secolo a.C. Una sovrana nota come la Signora delle Leonesse avvertì il Faraone che il suo paese passava agli Apiru, bande armate vagabonde, e che gli Apiru avevano scritto ad Ayyaluna, cioè Aialon, e a Sarha, che di solito si intende come Zorea."
    - "Nel libro di Giosuè Zorea è contata fra le città della pianura di Giuda ed è elencata anche nell’eredità di Dan. Era la patria di Manoach, «un uomo di Tsorea, della famiglia dei Daniti», il cui figlio Sansone lo spirito del Signore cominciò ad agitare «a Mahaneh-Dan, fra Tsorea ed Eshtaol»; dopo la sua morte Sansone fu sepolto fra Zorea ed Estaol nel sepolcro di suo padre. Da Zorea ed Estaol i Daniti mandarono cinque uomini a esplorare il paese e poi seicento uomini armati, che presero Lais all’estremo nord e la chiamarono Dan. Roboamo fortificò Zorea con Aialon, e dopo l’esilio uomini di Giuda vi abitarono di nuovo, come registra Neemia."
    - "Giuseppe Flavio dice che i parenti di Sansone lo seppellirono a Sarasat, il suo paese. All’inizio del IV secolo d.C. Eusebio conosceva Saraa come villaggio nel distretto di Eleuteropoli, a circa dieci miglia a nord sulla strada per Nicopoli, e lo indicava come la patria di Sansone."
  nl:
    - "Zora is Tel Tzora, een hoge heuvel aan de noordkant van de Sorekvallei, ongeveer 23 km ten westen van Jeruzalem en zo’n 3 km ten noorden van Beth-Semes, waar de heuvels van Juda de Sefela ontmoeten. Het Arabische dorp Sar’a op de heuvel behield de oude naam tot 1948, en Estaol, in de Bijbel gewoonlijk met Zora genoemd, lag dichtbij. Op en rond de heuvel zijn grotten, graven, regenputten en wijnpersen gevonden."
    - "Zora komt waarschijnlijk al voor in de Amarnabrieven van de veertiende eeuw v.Chr. Een heerser bekend als de Vrouwe van de Leeuwinnen waarschuwde Farao dat zijn land overging naar de Apiru, rondtrekkende gewapende bendes, en dat de Apiru hadden geschreven naar Ayyaluna, dat is Ajalon, en naar Sarha, dat gewoonlijk voor Zora wordt gehouden."
    - "In het boek Jozua wordt Zora geteld onder de steden van de laagvlakte van Juda en staat het ook in het erfdeel van Dan. Het was de woonplaats van Manoach, “een man van Zora, uit het geslacht van een Daniet”, wiens zoon Simson de Geest van de HEER begon te drijven “in het leger van Dan, tussen Zora en tussen Esthaol”; na zijn dood werd Simson tussen Zora en Estaol begraven in het graf van zijn vader. Vanuit Zora en Estaol zonden de Danieten vijf mannen om het land te verspieden en daarna zeshonderd gewapende mannen, die Lais in het verre noorden innamen en het Dan noemden. Rehabeam versterkte Zora met Ajalon, en na de ballingschap woonden er weer mannen van Juda, zoals Nehemia vermeldt."
    - "Flavius Josephus zegt dat Simsons verwanten hem begroeven in Sarasat, zijn eigen land. In het begin van de vierde eeuw n.Chr. kende Eusebius Saraa als een dorp in het district van Eleutheropolis, ongeveer tien mijl naar het noorden aan de weg naar Nicopolis, en wees het aan als de woonplaats van Simson."
  cs:
    - "Corea je Tel Cor'a, vysoký pahorek na severní straně údolí Sorek, asi 23 km západně od Jeruzaléma a asi 3 km severně od Bét-šemeše, kde se judské hory setkávají se Šefelou. Arabská vesnice Sar'a na pahorku si zachovala starověké jméno do roku 1948 a Eštaol, s Coreou v Bibli obvykle jmenovaný, ležel nedaleko. Na pahorku a kolem něj byly nalezeny jeskyně, hrobky, cisterny a lisy na víno."
    - "Corea se pravděpodobně objevuje už v amarnských listech ze 14. stol. př. n. l. Vládce známý jako Paní lvic varoval faraona, že jeho země přechází k Apiru, potulným ozbrojeným tlupám, a že Apiru napsali do Ajaluny, tedy Ajalonu, a do Sarcha, což se obvykle pokládá za Coreu."
    - "V Knize Jozue je Corea počítána mezi města judské nížiny a je též uvedena v dědictví Danově. Byla domovem Manóacha: „muž jeden z Zaraha, z čeledi Dan“. Jeho syna Samsona začal Duch Hospodinův ponoukati „v Mahane Dan, mezi Zaraha a Estaol“; po své smrti byl Samson pohřben mezi Coreou a Eštaolem v hrobě svého otce. Z Corey a Eštaolu poslali Danité pět mužů vyšetřit zemi a poté šest set ozbrojených mužů, kteří dobyli Lajiš na dalekém severu a pojmenovali jej Dan. Rechabeám opevnil Coreu s Ajalonem a po exilu tam judští muži znovu bydleli, jak zaznamenává Nehemjáš."
    - "Josephus říká, že Samsonovi příbuzní jej pohřbili v Sarasat, jeho vlastní zemi. Na počátku 4. století n. l. znal Eusebius Saraa jako vesnici v okrese Eleutheropole, asi deset mil na sever na cestě do Nikopole, a ukazoval ji jako domov Samsonův."
  sv:
    - "Sora är Tel Tzora, en hög kulle på norra sidan av Sorekdalen, omkring 23 km väster om Jerusalem och omkring 3 km norr om Bet-Shemesh, där Judas berg möter Shefela. Den arabiska byn Sar'a på kullen behöll det forntida namnet till 1948, och Eshtaol, som Bibeln vanligen nämner med Sora, låg alldeles intill. Grottor, gravar, cisterner och vinpressar har hittats på och kring kullen."
    - "Sora förekommer sannolikt redan i Amarnabreven från 1300-talet f.Kr. En härskare känd som Lejoninnornas dam varnade farao för att hans land gick över till apiru, kringströvande beväpnade band, och att apiru hade skrivit till Ayyaluna, det vill säga Ajalon, och till Sarha, som vanligen tas för Sora."
    - "I Josuas bok räknas Sora bland städerna i Judas lågland och står också i Dans arvedel. Det var hemvist för Manoach: ”I Sorga levde nu en man av daniternas släkt, vid namn Manoa”. Hans son Simson började HERRENS Ande verka på ”medan han var i Dans läger, mellan Sorga och Estaol”; efter sin död begrovs Simson mellan Sora och Eshtaol i sin fars gravplats. Från Sora och Eshtaol sände daniterna fem män för att spionera ut landet och sedan sexhundra beväpnade män, som intog Lajish i det yttersta norr och döpte det till Dan. Rehabeam befäste Sora tillsammans med Ajalon, och efter exilen bodde Judas män där igen, som Nehemja uppger."
    - "Josefus säger att Simsons släktingar begravde honom i Sarasat, hans eget land. Tidigt på 300-talet e.Kr. kände Eusebios Saraa som en by i Eleutheropolis distrikt, omkring tio romerska mil norrut på vägen till Nikopolis, och pekade ut den som Simsons hem."
  nb:
    - "Sora er Tel Tzora, en høy høyde på nordsiden av Sorek-dalen, omkring 23 km vest for Jerusalem og noen 3 km nord for Bet-Sjemesj, der Judas åser møter Sjefela. Den arabiske landsbyen Sar'a på høyden bevarte det gamle navnet til 1948, og Esjtaol, som Bibelen vanligvis nevner sammen med Sora, lå like ved. Huler, graver, sisterner og vinpresser er funnet på og rundt høyden."
    - "Sora forekommer trolig allerede i Amarna-brevene fra 1300-tallet f.Kr. En hersker kjent som Løvinnenes frue advarte farao om at landet hans gikk over til apiruene, omstreifende væpnede bander, og at apiruene hadde skrevet til Ayyaluna, det vil si Ajalon, og til Sarha, som vanligvis tas for å være Sora."
    - "I Josvas bok regnes Sora blant byene i Judas lavland og er også oppført i Dans arvelodd. Det var hjemmet til Manoah, «en mann fra Sora av danittenes ætt, han hette Manoah», hvis sønn Samson Herrens Ånd begynte å drive «i Dans leir mellem Sora og Estaol»; etter sin død ble Samson gravlagt mellom Sora og Esjtaol i farens gravsted. Fra Sora og Esjtaol sendte danittene fem menn for å speide ut landet og siden seks hundre væpnede menn, som tok Lajisj langt i nord og kalte det Dan. Rehabeam befestet Sora sammen med Ajalon, og etter eksilet bodde menn fra Juda der igjen, slik Nehemja forteller."
    - "Josefus sier at Samsons slektninger gravla ham i Sarasat, hans eget land. Tidlig på 300-tallet e.Kr. kjente Eusebius Saraa som en landsby i distriktet Eleutheropolis, omkring ti romerske mil mot nord på veien til Nikopolis, og pekte den ut som Samsons hjem."
  tl:
    - "Ang Sora ay ang Tel Tzora, mataas na burol sa hilagang panig ng libis ng Sorek, mga 23 km sa kanluran ng Jerusalem at mga 3 km sa hilaga ng Beth-semes, kung saan nagtatagpo ang mga burol ng Juda at ang Sephela. Pinanatili ng nayong Arabe ng Sar'a sa burol ang sinaunang pangalan hanggang 1948, at ang Estaol, karaniwang kasama ng Sora sa Biblia, ay malapit. Natagpuan ang mga yungib, libingan, imbakan ng tubig at pisaan ng ubas sa burol at sa paligid nito."
    - "Marahil lumilitaw na ang Sora sa mga sulat ng Amarna noong ika-14 na siglo BK. Binalaan si Faraon ng isang pinunong kilala bilang Ginang ng mga Leonesa na ang lupain niya ay napupunta sa mga Apiru, mga gala-galang armadong pangkat, at sumulat ang mga Apiru sa Ayyaluna, iyon ay Ajalon, at sa Sarha, na karaniwang itinuturing na Sora."
    - "Sa Aklat ni Josue, binibilang ang Sora sa mga bayan ng mababang lupain ng Juda at nakatala rin sa mana ni Dan. Ito ang tahanan ni Manoa, “may isang lalake sa Sora sa angkan ng mga Danita”, na ang anak na si Samson ay pinasimulang kilusin ng Espiritu ng Panginoon “sa Mahanedan, sa pagitan ng Sora at Esthaol”; pagkamatay, inilibing si Samson sa pagitan ng Sora at Estaol sa libingan ng kaniyang ama. Mula sa Sora at Estaol, nagsugo ang mga Danita ng limang lalaki upang tiktikan ang lupain at pagkatapos ay animnaraang armadong lalaki, na sumakop sa Lais sa dulong hilaga at pinangalanan itong Dan. Pinatibay ni Roboam ang Sora kasama ng Ajalon, at pagkatapos ng pagkatapon, muling nanirahan doon ang mga lalaki ng Juda, ayon sa Nehemias."
    - "Sinasabi ni Josefo na inilibing si Samson ng kaniyang kamag-anak sa Sarasat, ang sarili niyang bayan. Noong simula ng ika-4 na siglo AD, kilala ni Eusebio ang Saraa bilang nayon sa distrito ng Eleutheropolis, mga sampung milya sa hilaga sa daan patungong Nicopolis, at itinuro ito bilang tahanan ni Samson."
  da:
    - "Zora er Tel Tzora, en høj bakke på nordsiden af Sorekdalen, omkring 23 km vest for Jerusalem og omkring 3 km nord for Bet-Sjemesj, hvor Judas bjerge møder Sjefela. Den arabiske landsby Sar'a på bakken bevarede det gamle navn til 1948, og Esjtaol, der sædvanligvis nævnes med Zora i Bibelen, lå tæt ved. Huler, grave, cisterner og vinpresser er fundet på og omkring bakken."
    - "Zora optræder sandsynligvis allerede i Amarna-brevene fra 1300-tallet f.Kr. En hersker kendt som Løvindernes Dame advarede farao om, at hans land gik over til apiru, omstrejfende væbnede bander, og at apiru havde skrevet til Ayyaluna, det vil sige Ajjalon, og til Sarha, som sædvanligvis tages for Zora."
    - "I Josvas Bog regnes Zora blandt byerne i Judas lavland og er også opført i Dans arv. Det var hjemsted for Manoa, »en Mand fra Zora, af en Daniters Slægt«, hvis søn Samson Herrens Ånd begyndte at drive »i Dans Lejr imellem Zora og Esthaol«; efter sin død blev Samson begravet mellem Zora og Esjtaol i sin faders gravsted. Fra Zora og Esjtaol sendte daniterne fem mænd for at udspejde landet og derefter seks hundrede væbnede mænd, som tog Laisj i det yderste nord og kaldte det Dan. Rehabeam befæstede Zora sammen med Ajjalon, og efter eksilet boede Judas mænd der igen, som Nehemias optegner."
    - "Josefus siger, at Samsons slægtninge begravede ham i Sarasat, hans eget land. I begyndelsen af 300-tallet e.Kr. kendte Eusebios Saraa som en landsby i Eleutheropolis' distrikt, omkring ti romerske mil mod nord på vejen til Nikopolis, og pegede på den som Samsons hjem."
  sr:
    - "Сараја је Тел Цора, високо брдо на северној страни долине Сорек, око 23 км западно од Јерусалима и неких 3 км северно од Вет-Семеса, где се брда Јуде спајају са Сефелом. Арапско село Сара на брду чувало је древно име до 1948, а Естаол, који се у Библији обично именује уз Сарају, лежао је близу. На брду и око њега нађене су пећине, гробнице, цистерне и пресе за вино."
    - "Сараја се вероватно јавља већ у амарнским писмима из 14. века п. н. е. Владар познат као Господарица лавица упозорио је фараона да његова земља прелази Апирима, лутајућим наоружаним четама, и да су Апири писали Ајалуни, то јест Ајалону, и Сархи, што се обично узима за Сарају."
    - "У Књизи Исуса Навина Сараја се убраја међу градове јудејске низије и наведена је и у наследству Данову. Била је дом Маноја, о коме стоји: „беше један човек од Сараје од племена синова Данових“; његовог сина Самсона је дух Господњи почео покретати „по логору Дановом, између Сараје и Естаола“; после смрти Самсон је сахрањен између Сараје и Естаола у гробу свога оца. Из Сараје и Естаола Данови синови послали су пет људи да уходе земљу, а затим шест стотина наоружаних људи, који су узели Лаис далеко на северу и назвали га Дан. Ровоам је утврдио Сарају с Ајалоном, а после изгнанства људи Јуде поново су онде живели, како бележи Немија."
    - "Јосиф Флавије каже да су Самсонови рођаци сахранили њега у Сарасату, његовој отаџбини. Почетком 4. века н. е. Јевсевије је знао Сараа као село у области Елеутеропоља, око десет миља северно на путу за Никопољ, и указивао на њега као на Самсонов завичај."
  hu:
    - "Cora a Tel Cora, a Szórek-völgy északi oldalán lévő magas domb, Jeruzsálemtől mintegy 23 km-re nyugatra és Bét-Semestől mintegy 3 km-re északra, ahol Júda hegyei a Sefélával találkoznak. A dombon álló arab Szar'a falu 1948-ig megőrizte az ókori nevet, és Estaól, amelyet a Biblia rendszerint Corával együtt nevez meg, közel feküdt. A dombon és körülötte barlangokat, sírokat, ciszternákat és szőlőpréseket találtak."
    - "Cora valószínűleg már a Kr. e. 14. századi amarnai levelekben szerepel. Egy uralkodó, akit az Oroszlánnők Úrnőjeként ismernek, figyelmeztette a fáraót, hogy országa a hapiruk, kóbor fegyveres bandák oldalára áll, és hogy a hapiruk írtak Ajjalunának, azaz Ajjalonnak, és Szarhának, amelyet általában Corának tartanak."
    - "Józsué könyvében Cora Júda alföldi városai között szerepel, és Dán örökségében is felsorolják. Mánoah otthona volt, „egy férfiú Czórából, a Dán nemzetségéből való”, akinek fiát, Sámsont az Úr Lelke kezdte indítani „a Dán táborában, Czóra és Estháol között”; halála után Sámsont Cora és Estaól között temették el apja sírjába. Corából és Estaólból a dániták öt embert küldtek, hogy kikémlelje a földet, majd hatszáz fegyveres férfit, akik elfoglalták a távoli északi Laist és Dánnak nevezték el. Roboám Corát Ajjalonnal erősítette meg, és a száműzetés után Júda férfiai ismét ott laktak, ahogy Nehémiás feljegyzi."
    - "Josephus szerint Sámson rokonai Szarasatban, saját hazájában temették el. A Kr. u. 4. század elején Eusebius Szaraát az Eleutheropolisz körzetében lévő falunak ismerte, mintegy tíz mérföldre északra a Nikopolisz felé vezető úton, és Sámson otthonaként mutatta meg."
  fi:
    - "Sora on Tel Tzora, korkea kukkula Sorekin laakson pohjoispuolella, noin 23 km Jerusalemista länteen ja noin 3 km Bet-Semeksestä pohjoiseen, missä Juudan vuoret kohtaavat Sefelan. Kukkulalla oleva arabikylä Sar'a säilytti muinaisen nimen vuoteen 1948, ja Estaol, jonka Raamattu yleensä mainitsee Soran kanssa, sijaitsi lähellä. Kukkulalla ja sen ympärillä on löydetty luolia, hautoja, vesisäiliöitä ja viinipuristimia."
    - "Sora esiintyy luultavasti jo Amarna-kirjeissä 1300-luvulta eaa. Hallitsija, joka tunnetaan nimellä Leijonattarien rouva, varoitti faraota, että hänen maansa oli siirtymässä apiruille, kiertäville aseellisille joukoille, ja että apirut olivat kirjoittaneet Ayyalunaan, eli Ajaloniin, ja Sarhaan, jonka yleensä katsotaan olevan Sora."
    - "Joosuan kirjassa Sora luetellaan Juudan alankomaan kaupunkien joukossa ja myös Danin perintöosassa. Se oli Manoahin kotikaupunki: ”Sorassa oli mies, Daanin sukukuntaa, nimeltä Maanoah”, jonka poikaa Simsonia Herran henki alkoi vaikuttaa ”Daanin leirissä, Soran ja Estaolin välillä”; kuoltuaan Simson haudattiin Soran ja Estaolin väliin isänsä hautaan. Soran ja Estaolin danilaiset lähettivät viisi miestä vakoilemaan maata ja sitten kuusisataa asemiestä, jotka valtasivat Laisin kaukaisessa pohjoisessa ja nimesivät sen Daniksi. Rehabeam linnoitti Soran Ajalonin kanssa, ja pakkosiirtolaisuuden jälkeen Juudan miehet asuivat siellä jälleen, kuten Nehemia kertoo."
    - "Josefus sanoo, että Simsonin sukulaiset hautasivat hänet Sarasatiin, hänen omaan maahansa. 300-luvun alussa jaa. Eusebios tunsi Saraan kylänä Eleutheropoliksen alueella, noin kymmenen mailin päässä pohjoiseen Nikopolikseen johtavalla tiellä, ja osoitti sen Simsonin kotipaikaksi."
  vi:
    - "Xô-rê-a là Tel Tzora, một đồi cao ở phía bắc trũng Sô-rếch, cách Giê-ru-sa-lem khoảng 23 km về phía tây và khoảng 3 km phía bắc Bết-Sê-mết, nơi các đồi Giu-đa gặp Sê-phê-la. Làng Ả Rập Sar'a trên đồi giữ tên cổ cho đến năm 1948, và Ê-ta-ôn, thường được nêu cùng Xô-rê-a trong Kinh Thánh, nằm gần đó. Hang động, mộ, bể chứa và máy ép nho đã được tìm thấy trên và quanh đồi."
    - "Xô-rê-a có lẽ đã xuất hiện trong các thư Amarna thế kỷ 14 TCN. Một người cai trị được biết là Nữ chủ của các Sư tử cái cảnh báo Pha-ra-ôn rằng xứ ông đang ngả sang Apiru, những toán vũ trang lang thang, và Apiru đã viết cho Ayyaluna, tức A-gia-lôn, và cho Sarha, thường được coi là Xô-rê-a."
    - "Trong sách Giô-suê, Xô-rê-a được kể trong các thành đồng bằng của Giu-đa và cũng được liệt kê trong sản nghiệp của Đan. Đó là quê của Ma-nô-a, “một người Xô-rê-a, thuộc về một họ hàng của chi phái Đan”, người có con trai là Sam-sôn mà “Thần Đức Giê-hô-va khởi cảm động người tại trong dinh Đan, giữa khoảng Xô-rê-a và Ê-ta-ôn”; sau khi chết, Sam-sôn được chôn giữa Xô-rê-a và Ê-ta-ôn trong mộ của cha. Từ Xô-rê-a và Ê-ta-ôn, người Đan sai năm người đi do thám xứ rồi sáu trăm người có vũ khí, những người chiếm La-ít ở cực bắc và đặt tên là Đan. Rô-bô-am củng cố Xô-rê-a cùng A-gia-lôn, và sau cuộc lưu đày người Giu-đa lại sống ở đó, như Nê-hê-mi ghi."
    - "Josephus nói rằng thân tộc Sam-sôn chôn ông tại Sarasat, quê hương ông. Vào đầu thế kỷ 4, Eusebius biết Saraa là một làng trong vùng Eleutheropolis, cách khoảng mười dặm về phía bắc trên đường đến Ni-cô-bô-li, và chỉ nó là quê của Sam-sôn."
  ro:
    - "Țorea este Tel Tzora, un deal înalt pe latura nordică a văii Sorek, la circa 23 km vest de Ierusalim și la circa 3 km nord de Bet-Șemeș, unde dealurile lui Iuda întâlnesc Șefela. Satul arab Sar'a de pe deal a păstrat numele antic până în 1948, iar Eștaol, de obicei numit împreună cu Țorea în Biblie, se afla aproape. Peșteri, morminte, cisterne și teascuri au fost găsite pe deal și în jurul lui."
    - "Țorea apare probabil deja în scrisorile de la Amarna din secolul al XIV-lea î.Hr. Un conducător cunoscut ca Doamna Leoaicelor l-a avertizat pe faraon că țara lui trece la Apiru, bande armate rătăcitoare, și că Apiru au scris la Ayyaluna, adică Aialon, și la Sarha, socotită de obicei Țorea."
    - "În cartea lui Iosua, Țorea este numărată printre cetățile din șesul lui Iuda și este enumerată și în moștenirea lui Dan. A fost locuința lui Manoah, „un bărbat din Saraa, din seminția lui Dan”, al cărui fiu Samson a început să fie mișcat de Duhul Domnului „în tabăra lui Dan între Saraa și între Estaol”; după moartea lui, Samson a fost îngropat între Țorea și Eștaol, în mormântul tatălui său. Din Țorea și Eștaol, daniții au trimis cinci bărbați să iscodească țara și apoi șase sute de bărbați înarmați, care au luat Laișul din extremul nord și l-au numit Dan. Roboam a întărit Țorea împreună cu Aialon, iar după exil oameni din Iuda au locuit din nou acolo, după cum consemnează Neemia."
    - "Iosif Flaviu spune că rudele lui Samson l-au îngropat la Sarasat, în țara lui. La începutul secolului al IV-lea d.Hr., Eusebiu cunoștea Saraa ca pe un sat din districtul Eleuteropolis, la circa zece mile spre nord, pe drumul spre Nicopole, și îl arăta drept locuința lui Samson."
  bg:
    - "Цора е Тел Цора — висок хълм на северната страна на долината Сорек, на около 23 км западно от Йерусалим и на около 3 км северно от Ветсамис, където Юдейските хълмове се срещат с Шефела. Арабското село Сара на хълма пазело древното име до 1948 г., а Ещаол, който Библията обикновено назовава заедно с Цора, лежал наблизо. На хълма и около него са намерени пещери, гробници, цистерни и винарски преси."
    - "Цора вероятно се появява още в писмата от Амарна от XIV в. пр.н.е. Една владетелка, известна като Господарката на лъвиците, предупреждавала фараона, че земята му преминава към апиру — скитащи въоръжени дружини, и че апиру са писали до Аялуна, тоест Аялон, и до Сарха, която обикновено се приема за Цора."
    - "В книгата Иисус Навин Цора е причислена към градовете на Юдейската низина и е изброена също в наследството на Дан. Тя била родното място на Маной, „един человек от Сарая, от Дановото племе“, чийто син Самсон бил подбуждан от Духа Господен „в Дановия стан между Сарая и Естаол“; след смъртта си Самсон бил погребан между Цора и Ещаол в гроба на баща си. От Цора и Ещаол данците изпратили петима мъже да съгледат земята, а после шестстотин въоръжени мъже, които превзели Лаиш далеч на север и го нарекли Дан. Ровоам укрепил Цора заедно с Аялон, а след изгнанието там отново живели юдеи, както записва Неемия."
    - "Йосиф Флавий казва, че роднините на Самсон го погребали в Сарасат, родния му край. В началото на IV в. н.е. Евсевий познавал Саара като село в областта на Елевтерополис, на около десет мили на север по пътя за Никопол, и го посочвал като родното място на Самсон."
