# Overview article (ADR 0007). Mainstream facts only; the identification with Tel Tzora (the village of Sar'a) is the accepted one; Amarna dates follow the usual fourteenth-century placing; no absolute dates are given for Samson or the Danite migration.
id: zorah
place: a08174b
title:
  en: "Zorah"
  ru: "Цора"
  uk: "Цора"
  es: "Zora"
