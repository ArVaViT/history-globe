body:
  en:
    - "Zorah is Tel Tzora, a high hill on the north side of the Sorek valley, about 23 km west of Jerusalem and some 3 km north of Beth-shemesh, where the hills of Judah meet the Shephelah. The Arab village of Sar'a on the hill kept the ancient name until 1948, and Eshtaol, usually named with Zorah in the Bible, lay close by. Caves, tombs, cisterns and winepresses have been found on and around the hill."
    - "Zorah probably appears already in the Amarna letters of the fourteenth century BC. A ruler known as the Lady of the Lionesses warned Pharaoh that his land was going over to the Apiru, roving armed bands, and that the Apiru had written to Ayyaluna, that is Aijalon, and to Sarha, which is usually taken to be Zorah."
    - 'In the Book of Joshua Zorah is counted among the towns of the lowland of Judah and is also listed in the inheritance of Dan. It was the home of Manoah, "a certain man of Zorah, of the family of the Danites", whose son Samson the Spirit of the LORD began to move "in the camp of Dan between Zorah and Eshtaol"; after his death Samson was buried between Zorah and Eshtaol in the burying place of his father. From Zorah and Eshtaol the Danites sent five men to spy out the land and then six hundred armed men, who took Laish in the far north and named it Dan. Rehoboam fortified Zorah with Aijalon, and after the exile men of Judah lived there again, as Nehemiah records.'
    - "Josephus says that Samson's kindred buried him at Sarasat, his own country. In the early fourth century AD Eusebius knew Saraa as a village in the district of Eleutheropolis, about ten miles to the north on the road to Nicopolis, and pointed it out as the home of Samson."
  ru:
    - "Цора — это Тель-Цора, высокий холм на северной стороне долины Сорек, примерно в 23 км к западу от Иерусалима и в 3 км к северу от Вефсамиса, там, где горы Иудеи встречаются с Шефелой. Арабское селение Сараа на холме сохраняло древнее имя до 1948 г., а Естаол, который Библия обычно называет вместе с Цорой, лежал рядом. На холме и вокруг него найдены пещеры, гробницы, водоёмы и винодавильни."
    - "Цора, по всей видимости, упоминается уже в амарнских письмах XIV века до н. э. Правительница, известная как Владычица львиц, предупреждала фараона, что его земля переходит к апиру — бродячим вооружённым отрядам — и что апиру писали в Айялуну, то есть Аиалон, и в Сарху, которую обычно отождествляют с Цорой."
    - "В книге Иисуса Навина Цора числится среди городов низменности Иуды и названа также в уделе Дана. Здесь жил Маной, «человек из Цоры, от племени Данова», и в его сыне Самсоне Дух Господень начал действовать «в стане Дановом, между Цорою и Естаолом»; по смерти Самсона похоронили между Цорою и Естаолом во гробе его отца. Из Цоры и Естаола сыны Дановы послали пять человек осмотреть землю, а затем шестьсот вооружённых мужей, которые взяли Лаис на далёком севере и назвали его Даном. Ровоам укрепил Цору вместе с Аиалоном, а после плена сыны Иуды снова жили здесь, как сообщает Неемия."
    - "Иосиф Флавий пишет, что родные похоронили Самсона в Сарасате, на его родине. В начале IV века н. э. Евсевий знал Саару как селение в округе Елевферополя, примерно в десяти милях к северу по дороге в Никополь, и указывал её как родину Самсона."
  uk:
    - "Цора — це Тель-Цора, високий пагорб на північному боці долини Сорек, приблизно за 23 км на захід від Єрусалима і близько 3 км на північ від Бет-Шемеша, де пагорби Юди зустрічаються з Шефелою. Арабське село Сар’а на пагорбі зберігало давню назву до 1948 року, а Ештаол, зазвичай названий у Біблії разом з Цорою, лежав поруч. На пагорбі та навколо нього знайдено печери, гробниці, цистерни й винні преси."
    - "Цора, ймовірно, з’являється вже в листах з Амарни XIV ст. до н. е. Правитель, відомий як Володарка левиць, застерігав фараона, що його земля переходить до апіру, мандрівних озброєних ватаг, і що апіру писали до Аялуни, тобто Аялона, і до Сархи, яку зазвичай беруть за Цору."
    - "У Книзі Ісуса Навина Цора зарахована до міст низовини Юди і також перелічена в уділі Дана. Вона була домівкою Маноя, «один чоловік із Зореага, з поколїння Данового, на імя Маной», сина якого Самсона Дух Господній почав рухати «в таборі Дановому між Зореагом і Естаолом»; по смерті Самсона поховали між Цорою та Ештаолом у батьківському гробовищі. З Цори та Ештаола данійці послали п’ятьох розвідників, а потім шістсот озброєних людей, які взяли Лаіш на далекій півночі й назвали його Даном. Ровоам укріпив Цору з Аялоном, а після вигнання юдеї знову жили там, як записує Неемія."
    - "Йосиф Флавій каже, що родичі Самсона поховали його в Сарасаті, його власному краї. На початку IV століття н. е. Євсевій знав Сару як село в окрузі Елевтеополя, приблизно за десять миль на північ на дорозі до Нікополя, і показував його як домівку Самсона."
  es:
    - "Zora es Tel Tzora, una colina alta en el lado norte del valle de Sorec, a unos 23 km al oeste de Jerusalén y a unos 3 km al norte de Bet-semes, donde las colinas de Judá se encuentran con la Sefelá. La aldea árabe de Sar'a, en la colina, conservó el nombre antiguo hasta 1948, y Estaol, que la Biblia suele nombrar con Zora, estaba cerca. En la colina y en sus alrededores se han hallado cuevas, tumbas, cisternas y lagares."
    - "Zora aparece probablemente ya en las cartas de Amarna del siglo XIV a. C. Un gobernante conocido como la Señora de las Leonas advirtió al faraón de que su tierra se pasaba a los apiru, bandas armadas errantes, y de que los apiru habían escrito a Ayyaluna, es decir, Ajalón, y a Sarha, que suele tomarse por Zora."
    - "En el libro de Josué, Zora se cuenta entre las ciudades de la llanura de Judá y figura también en la heredad de Dan. Era la patria de Manoa, «un hombre de Sora, de la tribu de Dan», cuyo hijo Sansón empezó a ser movido por el Espíritu del Señor «en los campamentos de Dan, entre Sora y Esthaol»; tras su muerte Sansón fue sepultado entre Zora y Estaol en el sepulcro de su padre. De Zora y Estaol los danitas enviaron a cinco hombres a reconocer la tierra y luego a seiscientos hombres armados, que tomaron Lais en el extremo norte y la llamaron Dan. Roboam fortificó Zora con Ajalón, y tras el exilio hombres de Judá vivieron allí de nuevo, como registra Nehemías."
    - "Josefo dice que los parientes de Sansón lo sepultaron en Sarasat, su propia tierra. A comienzos del siglo IV d. C., Eusebio conocía Saraa como una aldea del distrito de Eleuterópolis, a unas diez millas al norte en el camino de Nicópolis, y la señalaba como la patria de Sansón."
  pt:
    - "Zorá é Tel Tzora, uma colina alta no lado norte do vale de Soreque, a cerca de 23 km a oeste de Jerusalém e uns 3 km ao norte de Bete-Semes, onde as colinas de Judá encontram a Sefelá. A aldeia árabe de Sar'a, na colina, conservou o nome antigo até 1948, e Estaol, geralmente nomeada com Zorá na Bíblia, ficava perto. Cavernas, túmulos, cisternas e lagares foram achados na colina e em volta dela."
    - "Zorá provavelmente já aparece nas cartas de Amarna do século XIV a.C. Um governante conhecido como a Senhora das Leoas advertiu o Faraó de que sua terra estava passando aos apiru, bandos armados errantes, e de que os apiru haviam escrito a Ayyaluna, isto é, Aijalom, e a Sarha, geralmente tomada por Zorá."
    - "No livro de Josué, Zorá é contada entre as cidades da planície de Judá e também listada na herança de Dã. Era a terra de Manoá, “um certo homem de Zorá, da família dos danitas”, cujo filho Sansão o Espírito do SENHOR começou a mover “em Maané-Dã, entre Zorá e Estaol”; depois de sua morte, Sansão foi sepultado entre Zorá e Estaol, no túmulo de seu pai. De Zorá e Estaol os danitas enviaram cinco homens para espiar a terra e depois seiscentos homens armados, que tomaram Laís, no extremo norte, e a chamaram Dã. Roboão fortificou Zorá com Aijalom, e depois do exílio homens de Judá viveram ali de novo, como registra Neemias."
    - "Josefo diz que os parentes de Sansão o sepultaram em Sarasat, sua própria terra. No início do século IV d.C., Eusébio conhecia Saraa como uma aldeia no distrito de Eleuterópolis, a umas dez milhas ao norte, na estrada para Nicópolis, e a apontava como a terra de Sansão."
  de:
    - "Zora ist Tel Tzora, ein hoher Hügel an der Nordseite des Sorektals, etwa 23 km westlich von Jerusalem und rund 3 km nördlich von Bet-Schemesch, wo die Hügel Judas auf die Schefela treffen. Das arabische Dorf Sar'a auf dem Hügel bewahrte den antiken Namen bis 1948, und Eschtaol, in der Bibel meist mit Zora genannt, lag ganz in der Nähe. Höhlen, Gräber, Zisternen und Kelterbecken wurden auf und um den Hügel gefunden."
    - "Zora erscheint wahrscheinlich schon in den Amarna-Briefen des vierzehnten Jahrhunderts v. Chr. Eine Herrscherin, die „Herrin der Löwinnen“, warnte den Pharao, dass sein Land zu den Apiru übergehe, umherziehenden bewaffneten Banden, und dass die Apiru an Ajaluna geschrieben hätten, das ist Ajalon, und an Sarha, das man meist für Zora hält."
    - "Im Buch Josua wird Zora zu den Städten des Tieflands Judas gezählt und steht auch im Erbteil Dans. Es war die Heimat Manoachs, „ein Mann zu Zora von einem Geschlecht der Daniter“, dessen Sohn Simson der Geist des HERRN zu treiben anfing „im Lager Dan zwischen Zora und Esthaol“; nach seinem Tod wurde Simson zwischen Zora und Eschtaol im Grab seines Vaters begraben. Von Zora und Eschtaol sandten die Daniter fünf Männer, das Land zu erkunden, und dann sechshundert bewaffnete Männer, die Lais im äußersten Norden nahmen und Dan nannten. Rehabeam befestigte Zora mit Ajalon, und nach dem Exil wohnten wieder Männer Judas dort, wie Nehemia vermerkt."
    - "Josephus sagt, Simsons Verwandte hätten ihn in Sarasat begraben, seiner Heimat. Anfang des vierten Jahrhunderts n. Chr. kannte Eusebius Saraa als Dorf im Gebiet von Eleutheropolis, etwa zehn Meilen nördlich an der Straße nach Nikopolis, und zeigte es als Heimat Simsons."
  fr:
    - "Tsorea est Tel Tzora, haute colline du côté nord de la vallée de Sorek, à environ 23 km à l’ouest de Jérusalem et à quelque 3 km au nord de Beth-Schémesch, là où les collines de Juda rejoignent la Shéphéla. Le village arabe de Sar’a, sur la colline, garda le nom antique jusqu’en 1948, et Eschthaol, d’ordinaire nommée avec Tsorea dans la Bible, se trouvait tout près. Des grottes, des tombes, des citernes et des pressoirs ont été trouvés sur la colline et autour."
    - "Tsorea figure probablement déjà dans les lettres d’Amarna du XIVe siècle av. J.-C. Un souverain connu comme la Dame des Lionnes avertit Pharaon que son pays passait aux Apirou, bandes armées errantes, et que les Apirou avaient écrit à Ayyaluna, c’est-à-dire Ajalon, et à Sarha, d’ordinaire prise pour Tsorea."
    - "Dans le livre de Josué, Tsorea est comptée parmi les villes de la plaine de Juda et figure aussi dans l’héritage de Dan. Elle était la patrie de Manoach, « un homme de Tsorea, de la famille des Danites », dont le fils Samson fut agité par l’Esprit de l’Éternel « à Machané-Dan, entre Tsorea et Eschthaol » ; après sa mort, Samson fut enterré entre Tsorea et Eschthaol, dans le sépulcre de son père. De Tsorea et d’Eschthaol, les Danites envoyèrent cinq hommes explorer le pays puis six cents hommes armés, qui prirent Laïsch à l’extrême nord et la nommèrent Dan. Roboam fortifia Tsorea avec Ajalon, et après l’exil des hommes de Juda y habitèrent de nouveau, comme le note Néhémie."
    - "Josèphe dit que les proches de Samson l’enterrèrent à Sarasat, son pays. Au début du IVe siècle apr. J.-C., Eusèbe connaissait Saraa comme un village du district d’Éleuthéropolis, à une dizaine de milles au nord sur la route de Nicopolis, et la désignait comme la patrie de Samson."
