# Overview article (ADR 0007). Mainstream facts only; the home of Zophar is unknown and the article says so; the Septuagint's Minaean reading is given as the Greek translators' view.
id: naamah
place: ac6b210
title:
  en: "Naamah"
  ru: "Наема"
  uk: "Наама"
  es: "Naama"
  pt: "Naamá"
  de: "Naama"
