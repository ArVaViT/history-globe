# Overview article (ADR 0007). Mainstream facts only; the home of Zophar is unknown and the article says so; the Septuagint's Minaean reading is given as the Greek translators' view.
id: naamah
place: ac6b210
title:
  en: "Naamah"
  ru: "Наема"
  uk: "Наама"
  es: "Naama"
  pt: "Naamá"
  de: "Naama"
  fr: "Naama"
  it: "Naama"
  pl: "Naama"
  nl: "Naäma"
  cs: "Naama"
  sv: "Naama"
  nb: "Naama"
  tl: "Naama"
  da: "Naama"
  sr: "Нама"
body:
  en:
    - "Naamah is the home of Zophar the Naamathite, the third of Job's friends, and nothing is known of it but his name. When Job's three friends heard of his calamity, “they came every one from his own place; Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite”, to mourn with him and to comfort him. Zophar speaks twice, the harshest of the three, insisting that God punishes only the guilty and that Job should put away his sin; at the end the LORD rebukes the three, they offer sacrifice at the LORD's bidding while Job prays for them, and “the LORD also accepted Job”."
    - "The friends come from Edom and the Arabian borderlands, so Naamah is looked for there, not at the Naamah of Judah's lowland that Joshua lists, though the Russian form of the name used here, Naema, is that town's; in Job the Russian Bible has only Zophar the Naamite. The Greek translators of Job called Zophar “king of the Minaeans”, placing him in the incense kingdom of Ma'in in south Arabia next to Sheba, and the first candidate on the map follows that lead, marking Naamah at Sheba; the second is Jebel el-Na'ameh in north-west Arabia, chosen for the sound of its name; the third is Edom itself, home of Eliphaz. None of these can be shown, and most commentators leave the place unidentified."
    - "There is nothing to visit: Naamah is a name in a story whose own land, Uz, is uncertain. It is marked only so that Zophar's home has a place on the map."
  ru:
    - "Наема — родина Софара Наамитянина, третьего из друзей Иова, и о ней не известно ничего, кроме его прозвания. Услышав о беде Иова, три его друга «пошли каждый из своего места: Елифаз Феманитянин, Вилдад Савхеянин и Софар Наамитянин», чтобы «сетовать с ним и утешать его». Софар говорит дважды, резче всех троих, настаивая, что Бог наказывает только виновных и что Иову надо оставить свой грех; в конце Господь обличает троих, они приносят жертву по слову Господа, а Иов молится за них, «и Господь принял лице Иова»."
    - "Друзья приходят из Едома и с окраин Аравии, поэтому Наему ищут там, а не в Наеме иудейской низменности из списка Иисуса Навина, хотя русская форма имени, Наема, взята именно от того города; в Книге Иова русская Библия знает лишь Софара Наамитянина. Греческие переводчики Иова назвали Софара «царём Минеев», поместив его в царство благовоний Маин на юге Аравии, рядом с Савой, и первый кандидат на карте идёт за этим, отмечая Наему у Савы; второй — Джебель-эн-Нааме на северо-западе Аравии, выбранная по созвучию имени; третий — сам Едом, родина Елифаза. Ни одно из этого не доказуемо, и большинство толкователей оставляет место неопознанным."
    - "Посетить нечего: Наема — имя в рассказе, чья собственная земля, Уц, тоже неясна. Она отмечена лишь затем, чтобы у родины Софара было место на карте."
  uk:
    - "Наама — дім Софара Наамського, третього з друзів Йова, і про неї відомо лише його ім’я. Коли три друзі Йова почули про його лихо, «пійшли, кожен із свого місця: Елифаз Теманський, Билдад Савхеаський й Зофар Наамський», щоб посумувати з ним і розважити його. Софар говорить двічі, найжорсткіший із трьох, наполягаючи, що Бог карає лише винних і що Йов має відкинути свій гріх; наприкінці Господь докоряє трьом, вони приносять жертву за наказом Господа, а Йов молиться за них, і «приняв Господь ласкаво лице Йовове»."
    - "Друзі приходять з Едому й арабського пограниччя, тому Нааму шукають там, а не в Наемі низовини Юди, яку перелічує Ісус Навин; у Книзі Йова є лише Зофар Наамський. Грецькі перекладачі Йова називали Софара «царем мінеїв», розміщуючи його в ладановому царстві Маїн на півдні Аравії поряд із Шевою, і перший кандидат на мапі слідує цій підказці, позначаючи Нааму в Шеві; другий — Джебель-ель-Наама на північному заході Аравії, обраний за звучання назви; третій — сам Едом, дім Еліфаза. Нічого з цього не можна показати, і більшість коментаторів залишає місце неототожненим."
    - "Відвідати нічого: Наама — ім’я в оповіді, чий власний край, Уц, непевний. Вона позначена лише для того, щоб дім Софара мав місце на мапі."
  es:
    - "Naama es la patria de Zofar el naamatita, el tercero de los amigos de Job, y de ella no se sabe nada más que su nombre. Cuando los tres amigos de Job supieron de su calamidad, «Eliphaz Temanita, y Bildad Suhita, y Sophar Naamathita» «vinieron cada uno de su lugar» para condolerse de él y consolarle. Zofar habla dos veces, el más duro de los tres, insistiendo en que Dios castiga solo a los culpables y en que Job debe apartar su pecado; al final Jehová reprende a los tres, ellos ofrecen sacrificio por indicación de Jehová mientras Job ora por ellos, y «Jehová atendió á Job»."
    - "Los amigos vienen de Edom y de las tierras fronterizas de Arabia, por lo que Naama se busca allí, no en la Naama de la llanura de Judá que enumera Josué, aunque la forma rusa del nombre usada aquí, Naema, es la de esa ciudad; en Job la Biblia rusa tiene solo Zofar el naamita. Los traductores griegos de Job llamaron a Zofar «rey de los mineos», situándolo en el reino del incienso de Ma'in, en el sur de Arabia, junto a Seba, y el primer candidato del mapa sigue esa pista, marcando Naama en Seba; el segundo es el Yebel el-Na'ameh, en el noroeste de Arabia, elegido por el sonido de su nombre; el tercero es el propio Edom, patria de Elifaz. Nada de esto puede mostrarse, y la mayoría de los comentaristas dejan el lugar sin identificar."
    - "No hay nada que visitar: Naama es un nombre en un relato cuya propia tierra, Uz, es incierta. Se marca solo para que la patria de Zofar tenga un lugar en el mapa."
  pt:
    - "Naamá é a terra de Zofar, o naamatita, o terceiro dos amigos de Jó, e nada se sabe dela além do seu nome. Quando os três amigos de Jó ouviram de sua calamidade, “vieram cada um do seu próprio lugar: Elifaz, o temanita, Bildade, o suíta, e Zofar, o naamatita”, para chorar com ele e consolá-lo. Zofar fala duas vezes, o mais duro dos três, insistindo em que Deus castiga apenas os culpados e que Jó deve afastar seu pecado; no fim o SENHOR repreende os três, eles oferecem sacrifício por ordem do SENHOR enquanto Jó ora por eles, e “o SENHOR aceitou a Jó”."
    - "Os amigos vêm de Edom e das fronteiras da Arábia, de modo que Naamá é procurada ali, e não na Naamá da planície de Judá que Josué lista, embora a forma russa do nome aqui usada, Naema, seja a dessa cidade; em Jó a Bíblia russa traz apenas Zofar, o naamita. Os tradutores gregos de Jó chamaram Zofar de “rei dos mineus”, situando-o no reino do incenso de Ma'in, no sul da Arábia, ao lado de Seba, e o primeiro candidato no mapa segue essa pista, marcando Naamá em Seba; o segundo é Jebel el-Na'ameh, no noroeste da Arábia, escolhido pelo som do nome; o terceiro é o próprio Edom, terra de Elifaz. Nada disso pode ser mostrado, e a maioria dos comentadores deixa o lugar sem identificação."
    - "Não há nada para visitar: Naamá é um nome numa história cuja própria terra, Uz, é incerta. É marcada apenas para que a terra de Zofar tenha lugar no mapa."
  de:
    - "Naama ist die Heimat Zophars, des Naamatiters, des dritten der Freunde Hiobs, und von ihr ist nur sein Name bekannt. Als die drei Freunde Hiobs von seinem Unglück hörten, „kamen sie, ein jeglicher aus seinem Ort: Eliphas von Theman, Bildad von Suah und Zophar von Naema“, um mit ihm zu trauern und ihn zu trösten. Zophar spricht zweimal, der härteste der drei, und besteht darauf, dass Gott nur die Schuldigen straft und Hiob seine Sünde ablegen solle; am Ende tadelt der HERR die drei, sie bringen auf des HERRN Geheiß Opfer dar, während Hiob für sie bittet, und „der HERR sah an Hiob“."
    - "Die Freunde kommen aus Edom und den arabischen Grenzgebieten, daher wird Naama dort gesucht, nicht im Naama des Tieflands Judas, das Josua aufführt, obwohl die hier verwendete russische Namensform Naema die dieser Stadt ist; im Hiobbuch hat die russische Bibel nur Zophar, den Naamiter. Die griechischen Übersetzer des Hiobbuchs nannten Zophar „König der Minäer“ und setzten ihn damit in das Weihrauchkönigreich Ma'in in Südarabien neben Scheba, und der erste Kandidat auf der Karte folgt dieser Spur und setzt Naama bei Scheba an; der zweite ist der Jebel el-Na'ameh in Nordwestarabien, gewählt wegen des Klangs seines Namens; der dritte ist Edom selbst, die Heimat des Eliphas. Nichts davon lässt sich zeigen, und die meisten Ausleger lassen den Ort unbestimmt."
    - "Es gibt nichts zu besuchen: Naama ist ein Name in einer Geschichte, deren eigenes Land, Uz, ungewiss ist. Es ist nur eingetragen, damit Zophars Heimat einen Platz auf der Karte hat."
  fr:
    - "Naama est la patrie de Tsophar de Naama, le troisième des amis de Job, et l’on ne sait rien d’elle sinon son nom. Quand les trois amis de Job apprirent son malheur, « Éliphaz de Théman, Bildad de Schuach, et Tsophar de Naama » « partirent de chez eux pour aller le plaindre et le consoler ». Tsophar parle deux fois, le plus dur des trois, affirmant que Dieu ne punit que les coupables et que Job doit rejeter son péché ; à la fin l’Éternel réprimande les trois, qui offrent un sacrifice à la demande de l’Éternel tandis que Job prie pour eux, et « l’Éternel eut égard à la prière de Job »."
    - "Les amis viennent d’Édom et des confins arabes, aussi cherche-t-on Naama là, non à la Naama de la plaine de Juda que Josué énumère, bien que la forme russe du nom employée ici, Naéma, soit celle de cette ville ; dans Job la Bible russe n’a que Tsophar le Naamite. Les traducteurs grecs de Job appelèrent Tsophar « roi des Minéens », le plaçant dans le royaume de l’encens de Ma’in en Arabie du sud à côté de Schéba, et le premier candidat de la carte suit cette piste, marquant Naama à Schéba ; le deuxième est le djebel el-Na’ameh dans le nord-ouest de l’Arabie, choisi pour la sonorité de son nom ; le troisième est Édom lui-même, patrie d’Éliphaz. Rien de cela ne peut être démontré, et la plupart des commentateurs laissent le lieu non identifié."
    - "Il n’y a rien à visiter : Naama est un nom dans un récit dont le pays propre, Uts, est incertain. Elle n’est marquée que pour que la patrie de Tsophar ait une place sur la carte."
  it:
    - "Naama è la patria di Zofar il Naamatita, il terzo degli amici di Giobbe, e non se ne sa nulla se non il suo nome. Quando i tre amici di Giobbe seppero della sua sventura, «Elifaz di Teman, Bildad di Suach e Tsofar di Naama … partirono, ciascuno dal suo paese», per condolersi con lui e consolarlo. Zofar parla due volte, il più duro dei tre, insistendo che Dio punisce solo i colpevoli e che Giobbe deve allontanare il suo peccato; alla fine l’Eterno rimprovera i tre, essi offrono sacrifici su invito dell’Eterno mentre Giobbe prega per loro, e «l’Eterno ebbe riguardo a Giobbe»."
    - "Gli amici vengono da Edom e dalle terre di confine arabiche, e Naama si cerca là, non alla Naama della pianura di Giuda che Giosuè elenca, benché la forma russa del nome qui usata, Naema, sia quella di quella città; in Giobbe la Bibbia russa ha solo Zofar il Naamita. I traduttori greci di Giobbe chiamarono Zofar «re dei Minei», collocandolo nel regno dell’incenso di Ma‘in nell’Arabia meridionale accanto a Saba, e il primo candidato sulla mappa segue questa pista, segnando Naama a Saba; il secondo è il Jebel el-Na‘ameh nell’Arabia nord-occidentale, scelto per il suono del nome; il terzo è la stessa Edom, patria di Elifaz. Nessuna di queste ipotesi può essere dimostrata, e la maggior parte dei commentatori lascia il luogo non identificato."
    - "Non c’è nulla da visitare: Naama è un nome in un racconto la cui terra stessa, Uz, è incerta. È segnata solo perché la patria di Zofar abbia un posto sulla mappa."
  pl:
    - "Naama to dom Sofara Naamatczyka, trzeciego z przyjaciół Hioba, i nic o niej nie wiadomo poza jego imieniem. Gdy trzej przyjaciele Hioba usłyszeli o jego nieszczęściu, „przyszli każdy z miejsca swego: Elifas Temańczyk, i Bildad Suhytczyk, i Sofar Naamatczyk”, by go opłakiwać i pocieszać. Sofar przemawia dwa razy, najsurowszy z trójki, nalegając, że Bóg karze tylko winnych i że Hiob powinien porzucić swój grzech; na końcu Pan karci trójkę, ci składają ofiarę na polecenie Pana, a Hiob modli się za nich i „przyjął Pan oblicze Ijobowe”."
    - "Przyjaciele pochodzą z Edomu i arabskich pogranicz, więc Naamy szuka się tam, a nie w Naamie z nizin Judy z listy Jozuego, choć rosyjska forma nazwy, Naema, jest właśnie formą tego miasta; w Księdze Hioba Biblia rosyjska ma tylko Sofara Naamitę. Greccy tłumacze Hioba nazwali Sofara „królem Minejczyków”, umieszczając go w królestwie kadzidła Ma'in w południowej Arabii obok Szeby, i pierwszy kandydat na mapie idzie tym tropem, zaznaczając Naamę w Szebie; drugi to Dżabal el-Na'ameh w północno-zachodniej Arabii, wybrany ze względu na brzmienie nazwy; trzeci to sam Edom, ojczyzna Elifaza. Żadnego z nich nie da się wykazać, a większość komentatorów zostawia miejsce niezidentyfikowane."
    - "Nie ma tu czego zwiedzać: Naama to nazwa w opowieści, której własna kraina, Uz, jest niepewna. Jest zaznaczona tylko po to, by dom Sofara miał miejsce na mapie."
  nl:
    - "Naäma is de woonplaats van Zofar de Naamathiet, de derde van Jobs vrienden, en van de plaats is niets bekend behalve zijn naam. Toen Jobs drie vrienden van zijn ramp hoorden, “kwamen zij, ieder uit zijn plaats, Elifaz, de Themaniet, en Bildad, de Suhiet, en Zofar, de Naamathiet”, om met hem te rouwen en hem te troosten. Zofar spreekt tweemaal, de hardste van de drie, en houdt vol dat God alleen de schuldigen straft en dat Job zijn zonde moet wegdoen; aan het eind bestraft de HEER de drie, zij brengen een offer op verzoek van de HEER terwijl Job voor hen bidt, en “de HEERE nam het aangezicht van Job aan”."
    - "De vrienden komen uit Edom en de Arabische grensstreken, dus Naäma wordt daar gezocht, niet bij het Naäma van Juda's laagland dat Jozua noemt, hoewel de Russische vorm van de naam die hier wordt gebruikt, Naema, die van die stad is; in Job heeft de Russische Bijbel alleen Zofar de Naämiet. De Griekse vertalers van Job noemden Zofar “koning van de Minaeërs”, wat hem plaatst in het wierookkoninkrijk Ma'in in Zuid-Arabië naast Seba, en de eerste kandidaat op de kaart volgt dat spoor en markeert Naäma bij Seba; de tweede is de Jebel el-Na'ameh in het noordwesten van Arabië, gekozen vanwege de klank van zijn naam; de derde is Edom zelf, de woonplaats van Elifaz. Niets hiervan kan worden aangetoond, en de meeste commentatoren laten de plaats ongeïdentificeerd."
    - "Er is niets te bezoeken: Naäma is een naam in een verhaal waarvan het eigen land, Uz, onzeker is. Het is alleen aangegeven opdat Zofars woonplaats een plaats op de kaart heeft."
  cs:
    - "Naama je domov Sofara Naamatského, třetího z Jobových přátel, a nic se o ní neví kromě jeho jména. Když tři Jobovi přátelé uslyšeli o jeho pohromě, „přišli jeden každý z místa svého: Elifaz Temanský, a Bildad Suchský a Zofar Naamatský“, aby s ním truchlili a těšili ho. Sofar mluví dvakrát, nejtvrději ze tří, a trvá na tom, že Bůh trestá jen viníky a že Job má odložit hřích; nakonec Hospodin trojici kárá, ti na Hospodinův pokyn obětují, zatímco se Job za ně modlí, a „přijal Hospodin oblíčej Jobův“."
    - "Přátelé přicházejí z Edómu a arabského pomezí, proto se Naama hledá tam, ne u Naamy z judské nížiny, kterou uvádí Jozue, ačkoli ruská podoba jména užitá zde, Naema, patří tomu městu; v Jobovi má ruská Bible jen Sofara Naamitského. Řečtí překladatelé Joba nazvali Sofara „králem Minejců“, čímž jej umístili do kadidlového království Ma'in v jižní Arábii vedle Šeby, a první kandidát na mapě tuto stopu sleduje a klade Naamu do Šeby; druhý je Jebel el-Na'ameh v severozápadní Arábii, zvolený pro zvuk jména; třetí je sám Edóm, domov Elifazův. Nic z toho nelze doložit a většina vykladačů místo ponechává neurčené."
    - "Není tu co navštívit: Naama je jméno v příběhu, jehož vlastní země, Úc, je nejistá. Je označena jen proto, aby měl Sofarův domov na mapě místo."
  sv:
    - "Naama är hemorten för Sofar från Naama, den tredje av Jobs vänner, och man vet ingenting om den utom hans namn. När Jobs tre vänner hörde om hans olycka sägs det att ”de kommo så, var och en från sin ort; Elifas från Teman, Bildad från Sua och Sofar från Naama”, för att ömka honom och trösta honom. Sofar talar två gånger, den hårdaste av de tre, och hävdar att Gud bara straffar de skyldiga och att Job borde avlägsna sin synd; på slutet tillrättavisar HERREN de tre, de bär fram offer på HERRENS befallning medan Job ber för dem, och ”HERREN tog nådigt emot Jobs bön”."
    - "Vännerna kommer från Edom och Arabiens gränsland, så Naama söker man där, inte vid det Naama i Judas lågland som Josua förtecknar, även om den ryska formen av namnet som används här, Naema, är den stadens; i Job har den ryska Bibeln bara Sofar naamiten. De grekiska översättarna av Job kallade Sofar ”minéernas kung” och placerade honom i rökelsekungariket Ma'in i södra Arabien intill Saba, och det första alternativet på kartan följer det spåret och markerar Naama vid Saba; det andra är Jebel el-Na'ameh i nordvästra Arabien, valt på grund av namnets klang; det tredje är Edom självt, Elifas hem. Inget av detta kan bevisas, och de flesta kommentatorer lämnar platsen oidentifierad."
    - "Det finns inget att besöka: Naama är ett namn i en berättelse vars eget land, Us, är osäkert. Det är markerat endast för att Sofars hem ska ha en plats på kartan."
  nb:
    - "Naama er hjemstedet til Sofar fra Naama, den tredje av Jobs venner, og ingenting er kjent om det utenom hans navn. Da Jobs tre venner hørte om hans ulykke, «kom de fra hver sitt hjemsted: Elifas fra Teman, Bildad fra Suah og Sofar fra Na'ama», for å sørge med ham og trøste ham. Sofar taler to ganger, den hardeste av de tre, og hevder at Gud bare straffer de skyldige og at Job må legge synden bort; til slutt irettesetter Herren de tre, de ofrer etter Herrens bud mens Job ber for dem, og «Herren bønnhørte Job»."
    - "Vennene kommer fra Edom og de arabiske grenselandene, så Naama søkes der, ikke ved det Naama i Judas lavland som Josva oppfører, selv om den russiske formen av navnet som brukes her, Naema, er den byens; i Job har den russiske bibelen bare Sofar, naamitten. De greske oversetterne av Job kalte Sofar «minéernes konge», og plasserte ham i virakriket Ma'in i Sør-Arabia ved siden av Sjeba, og det første kandidatstedet på kartet følger dette sporet og markerer Naama ved Sjeba; det andre er Jebel el-Na'ameh i nordvestlige Arabia, valgt på grunn av navnets lyd; det tredje er selve Edom, Elifas' hjemland. Ingen av disse kan påvises, og de fleste kommentatorer lar stedet stå uidentifisert."
    - "Det er ingenting å besøke: Naama er et navn i en fortelling hvis eget land, Us, er usikkert. Det er markert bare for at Sofars hjem skal ha en plass på kartet."
  tl:
    - "Ang Naama ang tahanan ni Sophar na Naamathita, ang ikatlo sa mga kaibigan ni Job, at walang nalalaman tungkol dito maliban sa kaniyang pangalan. Nang mabalitaan ng tatlong kaibigan ni Job ang kaniyang sakuna, “sila'y naparoon bawa't isa na mula sa kanikaniyang sariling pook, si Eliphaz na Temanita, at si Bildad na Suhita, at si Sophar na Naamathita”, upang makidamay sa kaniya at umaliw sa kaniya. Dalawang ulit na nagsasalita si Sophar, ang pinakamabagsik sa tatlo, na iginigiit na ang Dios ay nagpaparusa lamang sa may sala at na dapat iwaksi ni Job ang kaniyang kasalanan; sa wakas ay sinasaway ng Panginoon ang tatlo, naghahandog sila ng hain ayon sa utos ng Panginoon habang ipinananalangin sila ni Job, at “nilingap ng Panginoon si Job”."
    - "Nagmumula ang mga kaibigan sa Edom at sa mga hangganang lupain ng Arabia, kaya doon hinahanap ang Naama, hindi sa Naama ng mababang lupain ng Juda na inililista ni Josue, bagaman ang anyong Ruso ng pangalang ginagamit dito, Naema, ay sa bayang iyon; sa Job, ang Bibliyang Ruso ay may Sophar na Naamita lamang. Tinawag ng mga tagapagsalin na Griyego ng Job si Sophar na “hari ng mga Mineo”, na inilalagay siya sa kaharian ng insenso ng Ma'in sa timog Arabia sa tabi ng Seba, at sinusundan ng unang kandidato sa mapa ang bakas na iyon, na minamarkahan ang Naama sa Seba; ang ikalawa ay ang Jebel el-Na'ameh sa hilagang-kanlurang Arabia, na pinili dahil sa tunog ng pangalan nito; ang ikatlo ay ang Edom mismo, tahanan ni Eliphaz. Walang isa man sa mga ito ang mapatutunayan, at iniiwan ng karamihan sa mga komentarista na hindi matukoy ang lugar."
    - "Walang mapupuntahan: ang Naama ay isang pangalan sa isang kuwento na ang sariling lupain, ang Uz, ay hindi tiyak. Minamarkahan lamang ito upang magkaroon ng lugar sa mapa ang tahanan ni Sophar."
  da:
    - "Naama er hjemstedet for Zofar naamatiten, den tredje af Jobs venner, og intet vides om det ud over hans navn. Da Jobs tre venner hørte om hans ulykke, »kom de, hver fra sit Sted: Themaniten Elifas og Sukiten Bildad og Naamathiten Zofar«, for at vise ham medynk og trøste ham. Zofar taler to gange, den hårdeste af de tre, og fastholder, at Gud kun straffer de skyldige, og at Job bør lægge sin synd bort; til sidst irettesætter Herren de tre, de ofrer efter Herrens befaling, mens Job beder for dem, og »Herren ansaa Jobs Person«."
    - "Vennerne kommer fra Edom og de arabiske grænselande, så Naama søges dér og ikke i det Naama i Judas lavland, som Josva opregner, selv om den russiske form af navnet, der bruges her, Naema, er denne bys; i Job har den russiske Bibel kun Zofar naamiten. De græske oversættere af Job kaldte Zofar »minæernes konge« og placerede ham i røgelsesriget Ma'in i Sydarabien ved siden af Sjeba, og kortets første kandidat følger det spor og markerer Naama ved Sjeba; den anden er Jebel el-Na'ameh i det nordvestlige Arabien, valgt for navnets lyd; den tredje er Edom selv, Elifaz' hjem. Ingen af disse kan påvises, og de fleste kommentatorer lader stedet stå uidentificeret."
    - "Der er intet at besøge: Naama er et navn i en fortælling, hvis eget land, Uz, er usikkert. Det er kun markeret, for at Zofars hjem kan have en plads på kortet."
  sr:
    - "Нама је завичај Софара Намаћанина, трећег од Јовових пријатеља, и о њој се не зна ништа осим његовог имена. Кад су три Јовова пријатеља чула за његову несрећу, „дођоше сваки из свог места, Елифас Теманац и Вилдад Сушанин и Софар Намаћанин“, да га пожале и утеше. Софар говори двапут, најоштрије од тројице, тврдећи да Бог кажњава само кривце и да Јов треба да одбаци свој грех; на крају Господ кори тројицу, они приносе жртву по Господњој заповести док се Јов моли за њих, и „погледа Господ на Јова“."
    - "Пријатељи долазе из Едома и арапског пограничја, па се Нама тражи тамо, а не у Нами у јудејској низији коју наводи Исус Навин, иако је руски облик имена који се овде користи, Наема, облик тог града; у Књизи о Јову руска Библија има само Софара Наамита. Грчки преводиоци Књиге о Јову назвали су Софара „царем Минејаца“ и сместили га у тамјанско царство Маин у јужној Арабији поред Саве, а први кандидат на карти следи тај траг и Наму означава у Сави; други је Џебел ен-Наама у северозападној Арабији, изабран због сличног звука имена; трећи је сам Едом, постојбина Елифасова. Ништа од тога се не може доказати, а већина тумача место оставља неодређеним."
    - "Нема шта да се посети: Нама је име у причи чија је сопствена земља, Уз, несигурна. Означена је само да би Софаров завичај имао место на карти."
