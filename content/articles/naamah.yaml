body:
  en:
    - "Naamah is the home of Zophar the Naamathite, the third of Job's friends, and nothing is known of it but his name. When Job's three friends heard of his calamity, “they came every one from his own place; Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite”, to mourn with him and to comfort him. Zophar speaks twice, the harshest of the three, insisting that God punishes only the guilty and that Job should put away his sin; at the end the LORD rebukes the three, they offer sacrifice at Job's bidding, and “the LORD also accepted Job”."
    - "The friends come from Edom and the Arabian borderlands, so Naamah is looked for there, not at the Naamah of Judah's lowland that Joshua lists, though the Russian form of the name used here, Naema, is that town's; in Job the Russian Bible has only Zophar the Naamite. The Greek translators of Job called Zophar “king of the Minaeans”, placing him in the incense kingdom of Ma'in in south Arabia next to Sheba, and the first candidate on the map follows that lead, marking Naamah at Sheba; the second is Jebel el-Na'ameh in north-west Arabia, chosen for the sound of its name; the third is Edom itself, home of Eliphaz. None of these can be shown, and most commentators leave the place unidentified."
    - "There is nothing to visit: Naamah is a name in a story whose own land, Uz, is uncertain. It is marked only so that Zophar's home has a place on the map."
  ru:
    - "Наема — родина Софара Наамитянина, третьего из друзей Иова, и о ней не известно ничего, кроме его прозвания. Услышав о беде Иова, три его друга «пошли каждый из своего места: Елифаз Феманитянин, Вилдад Савхеянин и Софар Наамитянин», чтобы «сетовать с ним и утешать его». Софар говорит дважды, резче всех троих, настаивая, что Бог наказывает только виновных и что Иову надо оставить свой грех; в конце Господь обличает троих, они приносят жертву по слову Иова, «и Господь принял лице Иова»."
    - "Друзья приходят из Едома и с окраин Аравии, поэтому Наему ищут там, а не в Наеме иудейской низменности из списка Иисуса Навина, хотя русская форма имени, Наема, взята именно от того города; в Книге Иова русская Библия знает лишь Софара Наамитянина. Греческие переводчики Иова назвали Софара «царём Минеев», поместив его в царство благовоний Маин на юге Аравии, рядом с Савой, и первый кандидат на карте идёт за этим, отмечая Наему у Савы; второй — Джебель-эн-Нааме на северо-западе Аравии, выбранная по созвучию имени; третий — сам Едом, родина Елифаза. Ни одно из этого не доказуемо, и большинство толкователей оставляет место неопознанным."
    - "Посетить нечего: Наема — имя в рассказе, чья собственная земля, Уц, тоже неясна. Она отмечена лишь затем, чтобы у родины Софара было место на карте."
  uk:
    - "Наама — дім Софара Наамського, третього з друзів Йова, і про неї відомо лише його ім’я. Коли три друзі Йова почули про його лихо, «пійшли, кожен із свого місця: Елифаз Теманський, Билдад Савхеаський й Зофар Наамський», щоб посумувати з ним і розважити його. Софар говорить двічі, найжорсткіший із трьох, наполягаючи, що Бог карає лише винних і що Йов має відкинути свій гріх; наприкінці Господь докоряє трьом, вони приносять жертву за наказом Йова, і «приняв Господь ласкаво лице Йовове»."
    - "Друзі приходять з Едому й арабського пограниччя, тому Нааму шукають там, а не в Наемі низовини Юди, яку перелічує Ісус Навин; у Книзі Йова є лише Зофар Наамський. Грецькі перекладачі Йова називали Софара «царем мінеїв», розміщуючи його в ладановому царстві Маїн на півдні Аравії поряд із Шевою, і перший кандидат на мапі слідує цій підказці, позначаючи Нааму в Шеві; другий — Джебель-ель-Наама на північному заході Аравії, обраний за звучання назви; третій — сам Едом, дім Еліфаза. Нічого з цього не можна показати, і більшість коментаторів залишає місце неототожненим."
    - "Відвідати нічого: Наама — ім’я в оповіді, чий власний край, Уц, непевний. Вона позначена лише для того, щоб дім Софара мав місце на мапі."
  es:
    - "Naama es la patria de Zofar el naamatita, el tercero de los amigos de Job, y de ella no se sabe nada más que su nombre. Cuando los tres amigos de Job supieron de su calamidad, «Eliphaz Temanita, y Bildad Suhita, y Sophar Naamathita» «vinieron cada uno de su lugar» para condolerse de él y consolarle. Zofar habla dos veces, el más duro de los tres, insistiendo en que Dios castiga solo a los culpables y en que Job debe apartar su pecado; al final Jehová reprende a los tres, ellos ofrecen sacrificio por indicación de Job, y «Jehová atendió á Job»."
    - "Los amigos vienen de Edom y de las tierras fronterizas de Arabia, por lo que Naama se busca allí, no en la Naama de la llanura de Judá que enumera Josué, aunque la forma rusa del nombre usada aquí, Naema, es la de esa ciudad; en Job la Biblia rusa tiene solo Zofar el naamita. Los traductores griegos de Job llamaron a Zofar «rey de los mineos», situándolo en el reino del incienso de Ma'in, en el sur de Arabia, junto a Seba, y el primer candidato del mapa sigue esa pista, marcando Naama en Seba; el segundo es el Yebel el-Na'ameh, en el noroeste de Arabia, elegido por el sonido de su nombre; el tercero es el propio Edom, patria de Elifaz. Nada de esto puede mostrarse, y la mayoría de los comentaristas dejan el lugar sin identificar."
    - "No hay nada que visitar: Naama es un nombre en un relato cuya propia tierra, Uz, es incierta. Se marca solo para que la patria de Zofar tenga un lugar en el mapa."
  pt:
    - "Naamá é a terra de Zofar, o naamatita, o terceiro dos amigos de Jó, e nada se sabe dela além do seu nome. Quando os três amigos de Jó ouviram de sua calamidade, “vieram cada um do seu próprio lugar: Elifaz, o temanita, Bildade, o suíta, e Zofar, o naamatita”, para chorar com ele e consolá-lo. Zofar fala duas vezes, o mais duro dos três, insistindo em que Deus castiga apenas os culpados e que Jó deve afastar seu pecado; no fim o SENHOR repreende os três, eles oferecem sacrifício por ordem de Jó, e “o SENHOR aceitou a Jó”."
    - "Os amigos vêm de Edom e das fronteiras da Arábia, de modo que Naamá é procurada ali, e não na Naamá da planície de Judá que Josué lista, embora a forma russa do nome aqui usada, Naema, seja a dessa cidade; em Jó a Bíblia russa traz apenas Zofar, o naamita. Os tradutores gregos de Jó chamaram Zofar de “rei dos mineus”, situando-o no reino do incenso de Ma'in, no sul da Arábia, ao lado de Seba, e o primeiro candidato no mapa segue essa pista, marcando Naamá em Seba; o segundo é Jebel el-Na'ameh, no noroeste da Arábia, escolhido pelo som do nome; o terceiro é o próprio Edom, terra de Elifaz. Nada disso pode ser mostrado, e a maioria dos comentadores deixa o lugar sem identificação."
    - "Não há nada para visitar: Naamá é um nome numa história cuja própria terra, Uz, é incerta. É marcada apenas para que a terra de Zofar tenha lugar no mapa."
  de:
    - "Naama ist die Heimat Zophars, des Naamatiters, des dritten der Freunde Hiobs, und von ihr ist nur sein Name bekannt. Als die drei Freunde Hiobs von seinem Unglück hörten, „kamen sie, ein jeglicher aus seinem Ort: Eliphas von Theman, Bildad von Suah und Zophar von Naema“, um mit ihm zu trauern und ihn zu trösten. Zophar spricht zweimal, der härteste der drei, und besteht darauf, dass Gott nur die Schuldigen straft und Hiob seine Sünde ablegen solle; am Ende tadelt der HERR die drei, sie bringen auf Hiobs Geheiß Opfer dar, und „der HERR sah an Hiob“."
    - "Die Freunde kommen aus Edom und den arabischen Grenzgebieten, daher wird Naama dort gesucht, nicht im Naama des Tieflands Judas, das Josua aufführt, obwohl die hier verwendete russische Namensform Naema die dieser Stadt ist; im Hiobbuch hat die russische Bibel nur Zophar, den Naamiter. Die griechischen Übersetzer des Hiobbuchs nannten Zophar „König der Minäer“ und setzten ihn damit in das Weihrauchkönigreich Ma'in in Südarabien neben Scheba, und der erste Kandidat auf der Karte folgt dieser Spur und setzt Naama bei Scheba an; der zweite ist der Jebel el-Na'ameh in Nordwestarabien, gewählt wegen des Klangs seines Namens; der dritte ist Edom selbst, die Heimat des Eliphas. Nichts davon lässt sich zeigen, und die meisten Ausleger lassen den Ort unbestimmt."
    - "Es gibt nichts zu besuchen: Naama ist ein Name in einer Geschichte, deren eigenes Land, Uz, ungewiss ist. Es ist nur eingetragen, damit Zophars Heimat einen Platz auf der Karte hat."
  fr:
    - "Naama est la patrie de Tsophar de Naama, le troisième des amis de Job, et l’on ne sait rien d’elle sinon son nom. Quand les trois amis de Job apprirent son malheur, « Éliphaz de Théman, Bildad de Schuach, et Tsophar de Naama » « partirent de chez eux pour aller le plaindre et le consoler ». Tsophar parle deux fois, le plus dur des trois, affirmant que Dieu ne punit que les coupables et que Job doit rejeter son péché ; à la fin l’Éternel réprimande les trois, qui offrent un sacrifice à la demande de Job, et « l’Éternel eut égard à la prière de Job »."
    - "Les amis viennent d’Édom et des confins arabes, aussi cherche-t-on Naama là, non à la Naama de la plaine de Juda que Josué énumère, bien que la forme russe du nom employée ici, Naéma, soit celle de cette ville ; dans Job la Bible russe n’a que Tsophar le Naamite. Les traducteurs grecs de Job appelèrent Tsophar « roi des Minéens », le plaçant dans le royaume de l’encens de Ma’in en Arabie du sud à côté de Schéba, et le premier candidat de la carte suit cette piste, marquant Naama à Schéba ; le deuxième est le djebel el-Na’ameh dans le nord-ouest de l’Arabie, choisi pour la sonorité de son nom ; le troisième est Édom lui-même, patrie d’Éliphaz. Rien de cela ne peut être démontré, et la plupart des commentateurs laissent le lieu non identifié."
    - "Il n’y a rien à visiter : Naama est un nom dans un récit dont le pays propre, Uts, est incertain. Elle n’est marquée que pour que la patrie de Tsophar ait une place sur la carte."
  it:
    - "Naama è la patria di Zofar il Naamatita, il terzo degli amici di Giobbe, e non se ne sa nulla se non il suo nome. Quando i tre amici di Giobbe seppero della sua sventura, «Elifaz di Teman, Bildad di Suach e Tsofar di Naama … partirono, ciascuno dal suo paese», per condolersi con lui e consolarlo. Zofar parla due volte, il più duro dei tre, insistendo che Dio punisce solo i colpevoli e che Giobbe deve allontanare il suo peccato; alla fine l’Eterno rimprovera i tre, essi offrono sacrifici su invito di Giobbe, e «l’Eterno ebbe riguardo a Giobbe»."
    - "Gli amici vengono da Edom e dalle terre di confine arabiche, e Naama si cerca là, non alla Naama della pianura di Giuda che Giosuè elenca, benché la forma russa del nome qui usata, Naema, sia quella di quella città; in Giobbe la Bibbia russa ha solo Zofar il Naamita. I traduttori greci di Giobbe chiamarono Zofar «re dei Minei», collocandolo nel regno dell’incenso di Ma‘in nell’Arabia meridionale accanto a Saba, e il primo candidato sulla mappa segue questa pista, segnando Naama a Saba; il secondo è il Jebel el-Na‘ameh nell’Arabia nord-occidentale, scelto per il suono del nome; il terzo è la stessa Edom, patria di Elifaz. Nessuna di queste ipotesi può essere dimostrata, e la maggior parte dei commentatori lascia il luogo non identificato."
    - "Non c’è nulla da visitare: Naama è un nome in un racconto la cui terra stessa, Uz, è incerta. È segnata solo perché la patria di Zofar abbia un posto sulla mappa."
  pl:
    - "Naama to dom Sofara Naamatczyka, trzeciego z przyjaciół Hioba, i nic o niej nie wiadomo poza jego imieniem. Gdy trzej przyjaciele Hioba usłyszeli o jego nieszczęściu, „przyszli każdy z miejsca swego: Elifas Temańczyk, i Bildad Suhytczyk, i Sofar Naamatczyk”, by go opłakiwać i pocieszać. Sofar przemawia dwa razy, najsurowszy z trójki, nalegając, że Bóg karze tylko winnych i że Hiob powinien porzucić swój grzech; na końcu Pan karci trójkę, ci składają ofiarę na polecenie Hioba i „przyjął Pan oblicze Ijobowe”."
    - "Przyjaciele pochodzą z Edomu i arabskich pogranicz, więc Naamy szuka się tam, a nie w Naamie z nizin Judy z listy Jozuego, choć rosyjska forma nazwy, Naema, jest właśnie formą tego miasta; w Księdze Hioba Biblia rosyjska ma tylko Sofara Naamitę. Greccy tłumacze Hioba nazwali Sofara „królem Minejczyków”, umieszczając go w królestwie kadzidła Ma'in w południowej Arabii obok Szeby, i pierwszy kandydat na mapie idzie tym tropem, zaznaczając Naamę w Szebie; drugi to Dżabal el-Na'ameh w północno-zachodniej Arabii, wybrany ze względu na brzmienie nazwy; trzeci to sam Edom, ojczyzna Elifaza. Żadnego z nich nie da się wykazać, a większość komentatorów zostawia miejsce niezidentyfikowane."
    - "Nie ma tu czego zwiedzać: Naama to nazwa w opowieści, której własna kraina, Uz, jest niepewna. Jest zaznaczona tylko po to, by dom Sofara miał miejsce na mapie."
  nl:
    - "Naäma is de woonplaats van Zofar de Naamathiet, de derde van Jobs vrienden, en van de plaats is niets bekend behalve zijn naam. Toen Jobs drie vrienden van zijn ramp hoorden, “kwamen zij, ieder uit zijn plaats, Elifaz, de Themaniet, en Bildad, de Suhiet, en Zofar, de Naamathiet”, om met hem te rouwen en hem te troosten. Zofar spreekt tweemaal, de hardste van de drie, en houdt vol dat God alleen de schuldigen straft en dat Job zijn zonde moet wegdoen; aan het eind bestraft de HEER de drie, zij brengen een offer op Jobs verzoek, en “de HEERE nam het aangezicht van Job aan”."
    - "De vrienden komen uit Edom en de Arabische grensstreken, dus Naäma wordt daar gezocht, niet bij het Naäma van Juda's laagland dat Jozua noemt, hoewel de Russische vorm van de naam die hier wordt gebruikt, Naema, die van die stad is; in Job heeft de Russische Bijbel alleen Zofar de Naämiet. De Griekse vertalers van Job noemden Zofar “koning van de Minaeërs”, wat hem plaatst in het wierookkoninkrijk Ma'in in Zuid-Arabië naast Seba, en de eerste kandidaat op de kaart volgt dat spoor en markeert Naäma bij Seba; de tweede is de Jebel el-Na'ameh in het noordwesten van Arabië, gekozen vanwege de klank van zijn naam; de derde is Edom zelf, de woonplaats van Elifaz. Niets hiervan kan worden aangetoond, en de meeste commentatoren laten de plaats ongeïdentificeerd."
    - "Er is niets te bezoeken: Naäma is een naam in een verhaal waarvan het eigen land, Uz, onzeker is. Het is alleen aangegeven opdat Zofars woonplaats een plaats op de kaart heeft."
  cs:
    - "Naama je domov Sofara Naamatského, třetího z Jobových přátel, a nic se o ní neví kromě jeho jména. Když tři Jobovi přátelé uslyšeli o jeho pohromě, „přišli jeden každý z místa svého: Elifaz Temanský, a Bildad Suchský a Zofar Naamatský“, aby s ním truchlili a těšili ho. Sofar mluví dvakrát, nejtvrději ze tří, a trvá na tom, že Bůh trestá jen viníky a že Job má odložit hřích; nakonec Hospodin trojici kárá, ti na Jobovo přání obětují a „přijal Hospodin oblíčej Jobův“."
    - "Přátelé přicházejí z Edómu a arabského pomezí, proto se Naama hledá tam, ne u Naamy z judské nížiny, kterou uvádí Jozue, ačkoli ruská podoba jména užitá zde, Naema, patří tomu městu; v Jobovi má ruská Bible jen Sofara Naamitského. Řečtí překladatelé Joba nazvali Sofara „králem Minejců“, čímž jej umístili do kadidlového království Ma'in v jižní Arábii vedle Šeby, a první kandidát na mapě tuto stopu sleduje a klade Naamu do Šeby; druhý je Jebel el-Na'ameh v severozápadní Arábii, zvolený pro zvuk jména; třetí je sám Edóm, domov Elifazův. Nic z toho nelze doložit a většina vykladačů místo ponechává neurčené."
    - "Není tu co navštívit: Naama je jméno v příběhu, jehož vlastní země, Úc, je nejistá. Je označena jen proto, aby měl Sofarův domov na mapě místo."
