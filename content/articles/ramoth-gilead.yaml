# Overview article (ADR 0007). Mainstream facts only; the site is disputed (Tell er-Rumeith, ar-Ramtha, Tell el-Hisn) and is named as such; kings are dated by the usual reckoning only where needed.
id: ramoth-gilead
place: a2fe63c # Ramoth-gilead record, drawn at Tell er-Rumeith (lon/lat checked); 20 verses; a95147f "Ramoth" at the same point carries the city-of-refuge verses
title:
  en: "Ramoth-gilead"
  ru: "Рамоф Галаадский"
  uk: "Рамот Гілеадський"
  es: "Ramot de Galaad"
  pt: "Ramote-Gileade"
  de: "Ramot-Gilead"
  fr: "Ramoth en Galaad"
  it: "Ramot di Galaad"
  pl: "Ramot w Gileadzie"
  cs: "Rámot v Gileadu"
  nl: "Ramot in Gilead"
  sv: "Ramot-Gilead"
  nb: "Ramot-Gilead"
  tl: "Ramoth-galaad"
body:
  en:
    - 'Ramoth-gilead, "the heights of Gilead", was a town in northern Gilead, east of the Jordan, near the border between Israel and the Aramaeans of Damascus. Its site is disputed. The name survives at ar-Ramtha, near today''s border between Jordan and Syria, a town built on a large Iron Age mound. Others prefer Tell el-Hisn, about 15 km to the southwest, at the edge of the Gilead hills. A long-favoured candidate, where the map point stands, is Tell er-Rumeith, a small mound a few kilometres south of Ramtha. In the fourth century AD Eusebius placed Ramoth fifteen miles west of Philadelphia (Amman), which fits none of these sites; Jerome''s Latin version of his book says east.'
    - "Paul Lapp excavated Tell er-Rumeith in 1962 and 1967 and found a small Iron Age fort. Its date is debated: some scholars hold that it cannot be older than the early eighth century BC, after the time of Ahab, and that so small a post cannot have been the biblical city."
    - "In the Bible Ramoth in Gilead is a city of refuge for the tribe of Gad, given to the Levites, and the seat of the son of Geber, Solomon's officer over the towns of Jair and the region of Argob in Bashan. Ahab, king of Israel, wished to take it back from the king of Syria and went up against it with Jehoshaphat, king of Judah; struck by an arrow drawn at a venture, he died at evening in his chariot. His son Joram fought there against Hazael of Syria and went back wounded to Jezreel. Then Elisha sent one of the sons of the prophets to Ramoth-gilead to anoint Jehu, captain of the host, king over Israel, and from there Jehu set out on the revolt that ended the house of Ahab. Josephus retells these wars and says that Joram had taken the city by force and left his army there under Jehu."
    - "In the days of Pekah, Tiglath-pileser III of Assyria took Gilead and carried its people captive, about 733–732 BC, and Ramoth-gilead does not appear again in the biblical story. In the fourth century AD Eusebius still knew Ramoth as a village."
  ru:
    - "Рамоф Галаадский, «высоты Галаада», был городом северного Галаада за Иорданом, у границы Израиля с арамеями Дамаска. Его местоположение спорно. Имя сохранилось в городе эр-Рамта у нынешней границы Иордании и Сирии, стоящем на большом холме железного века. Другие предпочитают Телль-эль-Хисн, примерно в 15 км к юго-западу, на краю Галаадских гор. Давний кандидат, где стоит точка на карте, — Телль-эр-Румейт, небольшой холм в нескольких километрах к югу от Рамты. Евсевий в IV веке н. э. помещал Рамоф в пятнадцати милях к западу от Филадельфии (Аммана), что не подходит ни к одному из этих мест; в латинском переводе его книги у Иеронима сказано «к востоку»."
    - "Пол Лапп раскапывал Телль-эр-Румейт в 1962 и 1967 гг. и нашёл небольшую крепость железного века. Её датировка спорна: часть учёных считает, что она не старше начала VIII века до н. э., то есть позже времени Ахава, и что столь малый пост не мог быть библейским городом."
    - "В Библии Рамоф в Галааде — город убежища от колена Гадова, отданный левитам, и место пребывания Бен-Гевера, Соломонова начальника над селениями Иаира и областью Аргов в Васане. Ахав, царь Израильский, хотел отнять его у царя Сирийского и пошёл на него вместе с Иосафатом, царём Иудейским; раненный стрелой, пущенной наудачу, он к вечеру умер в колеснице. Его сын Иорам воевал здесь с Азаилом, царём Сирийским, и раненым вернулся в Изреель. Тогда Елисей послал одного из сынов пророческих в Рамоф Галаадский помазать военачальника Ииуя в царя над Израилем, и отсюда Ииуй начал восстание, положившее конец дому Ахава. Иосиф Флавий пересказывает эти войны и сообщает, что Иорам взял город силой и оставил там войско под началом Ииуя."
    - "Во дни Факея ассирийский царь Феглаффелласар III взял Галаад и переселил его жителей, около 733–732 гг. до н. э., и больше Рамоф Галаадский в библейском повествовании не появляется. В IV веке н. э. Евсевий ещё знал Рамоф как селение."
  uk:
    - "Рамот Гілеадський, «висоти Гілеаду», був містом на півночі Гілеаду, на схід від Йордану, поблизу межі між Ізраїлем та арамеями Дамаска. Його розташування спірне. Назва збереглася в ар-Рамті, поблизу сучасного кордону між Йорданією та Сирією, у місті, збудованому на великому кургані залізної доби. Інші віддають перевагу Телль-ель-Хісну, приблизно за 15 км на південний захід, на краю гілеадських пагорбів. Давно улюбленим кандидатом, де стоїть позначка на карті, є Телль-ер-Румейт, невеликий курган за кілька кілометрів на південь від Рамти. У IV ст. н. е. Євсевій розмістив Рамот за п’ятнадцять миль на захід від Філадельфії (Амману), що не збігається з жодним із цих місць; латинська версія його книги, зроблена Єронімом, каже: на схід."
    - "Пол Лапп розкопував Телль-ер-Румейт у 1962 і 1967 роках і знайшов невеликий форт залізної доби. Його датування обговорюється: деякі вчені вважають, що він не може бути старшим за початок VIII ст. до н. е., тобто за часи після Ахава, і що такий малий пост не міг бути біблійним містом."
    - "У Біблії Рамот у Гілеаді — це місто-сховище для коліна Гада, віддане левітам, і осідок сина Гевера, Соломонового наглядача над містами Яіра та краєм Аргов у Башані. Ахав, цар Ізраїлю, хотів повернути його від царя Сирії й пішов на нього разом з Йосафатом, царем Юди; уражений стрілою, пущеною навмання, він помер надвечір у своїй колісниці. Його син Йорам боровся там проти Азаїла Сирійського й повернувся пораненим до Їзреелю. Тоді Єлисей послав одного із синів пророків до Рамота Гілеадського, щоб помазати Єгу, начальника війська, на царя над Ізраїлем, і звідти Єгу вирушив у заколот, що поклав кінець дому Ахава. Йосиф Флавій переказує ці війни й каже, що Йорам узяв місто силою й залишив там своє військо під началом Єгу."
    - "За днів Факея Тіглатпаласар III Ассирійський захопив Гілеад і відвів його мешканців у полон, близько 733–732 рр. до н. е., і Рамот Гілеадський більше не з’являється в біблійній оповіді. У IV ст. н. е. Євсевій ще знав Рамот як село."
  es:
    - "Ramot de Galaad, «las alturas de Galaad», era una ciudad del norte de Galaad, al este del Jordán, cerca de la frontera entre Israel y los arameos de Damasco. Su emplazamiento se discute. El nombre sobrevive en ar-Ramtha, cerca de la actual frontera entre Jordania y Siria, una ciudad construida sobre un gran montículo de la Edad del Hierro. Otros prefieren Tell el-Hisn, a unos 15 km al suroeste, en el borde de las colinas de Galaad. Un candidato largo tiempo favorecido, donde está el punto del mapa, es Tell er-Rumeith, un pequeño montículo a pocos kilómetros al sur de Ramtha. En el siglo IV d. C. Eusebio situó Ramot a quince millas al oeste de Filadelfia (Amán), lo que no concuerda con ninguno de estos lugares; la versión latina de su libro por Jerónimo dice al este."
    - "Paul Lapp excavó Tell er-Rumeith en 1962 y 1967 y halló un pequeño fuerte de la Edad del Hierro. Su fecha se debate: algunos estudiosos sostienen que no puede ser anterior a principios del siglo VIII a. C., después de la época de Acab, y que un puesto tan pequeño no puede haber sido la ciudad bíblica."
    - "En la Biblia Ramot de Galaad es una ciudad de refugio para la tribu de Gad, entregada a los levitas, y la sede del hijo de Geber, oficial de Salomón sobre las ciudades de Jair y la región de Argob en Basán. Acab, rey de Israel, quiso recobrarla del rey de Siria y subió contra ella con Josafat, rey de Judá; herido por una flecha disparada a la ventura, murió al atardecer en su carro. Su hijo Joram combatió allí contra Hazael de Siria y volvió herido a Jezreel. Entonces Eliseo envió a uno de los hijos de los profetas a Ramot de Galaad para ungir rey sobre Israel a Jehú, jefe del ejército, y desde allí Jehú emprendió la rebelión que acabó con la casa de Acab. Josefo vuelve a contar estas guerras y dice que Joram había tomado la ciudad por la fuerza y dejado allí a su ejército bajo Jehú."
    - "En tiempos de Peka, Tiglat-pileser III de Asiria tomó Galaad y llevó cautivo a su pueblo, hacia 733–732 a. C., y Ramot de Galaad no vuelve a aparecer en el relato bíblico. En el siglo IV d. C. Eusebio aún conocía Ramot como una aldea."
  pt:
    - "Ramote-Gileade, “as alturas de Gileade”, era uma cidade do norte de Gileade, a leste do Jordão, perto da fronteira entre Israel e os arameus de Damasco. Seu local é disputado. O nome sobrevive em ar-Ramtha, perto da atual fronteira entre a Jordânia e a Síria, cidade construída sobre um grande monte da Idade do Ferro. Outros preferem Tell el-Hisn, a cerca de 15 km ao sudoeste, na orla das colinas de Gileade. Um candidato há muito favorecido, onde fica o ponto do mapa, é Tell er-Rumeith, um pequeno monte a poucos quilômetros ao sul de Ramtha. No século IV d.C., Eusébio situou Ramote a quinze milhas a oeste de Filadélfia (Amã), o que não combina com nenhum desses locais; a versão latina de seu livro por Jerônimo diz leste."
    - "Paul Lapp escavou Tell er-Rumeith em 1962 e 1967 e encontrou um pequeno forte da Idade do Ferro. Sua datação é debatida: alguns estudiosos sustentam que ele não pode ser anterior ao início do século VIII a.C., depois do tempo de Acabe, e que um posto tão pequeno não pode ter sido a cidade bíblica."
    - "Na Bíblia, Ramote em Gileade é uma cidade de refúgio para a tribo de Gade, dada aos levitas, e a sede de Ben-Geber, oficial de Salomão sobre as cidades de Jair e a região de Argobe, em Basã. Acabe, rei de Israel, quis retomá-la do rei da Síria e subiu contra ela com Josafá, rei de Judá; atingido por uma flecha disparada ao acaso, morreu ao entardecer em seu carro. Seu filho Jorão lutou ali contra Hazael da Síria e voltou ferido a Jezreel. Então Eliseu enviou um dos filhos dos profetas a Ramote-Gileade para ungir Jeú, comandante do exército, rei sobre Israel, e dali Jeú partiu na revolta que pôs fim à casa de Acabe. Josefo reconta essas guerras e diz que Jorão tomara a cidade à força e deixara ali seu exército sob Jeú."
    - "Nos dias de Peca, Tiglate-Pileser III da Assíria tomou Gileade e levou seu povo cativo, por volta de 733–732 a.C., e Ramote-Gileade não aparece mais na história bíblica. No século IV d.C., Eusébio ainda conhecia Ramote como uma aldeia."
  de:
    - "Ramot-Gilead, „die Höhen Gileads“, war eine Stadt im nördlichen Gilead, östlich des Jordan, nahe der Grenze zwischen Israel und den Aramäern von Damaskus. Ihre Lage ist umstritten. Der Name lebt in ar-Ramtha fort, nahe der heutigen Grenze zwischen Jordanien und Syrien, einer Stadt auf einem großen eisenzeitlichen Hügel. Andere bevorzugen Tell el-Hisn, etwa 15 km südwestlich, am Rand des Berglands Gilead. Ein lange favorisierter Kandidat, wo der Kartenpunkt steht, ist Tell er-Rumeith, ein kleiner Hügel einige Kilometer südlich von Ramtha. Im 4. Jahrhundert n. Chr. setzte Eusebius Ramot fünfzehn Meilen westlich von Philadelphia (Amman), was zu keiner dieser Stätten passt; in der lateinischen Fassung seines Buches durch Hieronymus steht „östlich“."
    - "Paul Lapp grub Tell er-Rumeith 1962 und 1967 aus und fand ein kleines eisenzeitliches Kastell. Seine Datierung ist umstritten: Manche Gelehrte meinen, es könne nicht älter sein als das frühe 8. Jahrhundert v. Chr., nach der Zeit Ahabs, und ein so kleiner Posten könne nicht die biblische Stadt gewesen sein."
    - "In der Bibel ist Ramot in Gilead eine Freistadt für den Stamm Gad, den Leviten gegeben, und Sitz des Sohnes Gebers, Salomos Amtmanns über die Flecken Jaïrs und die Gegend Argob in Baschan. Ahab, der König von Israel, wollte es dem König von Syrien wieder abnehmen und zog mit Josaphat, dem König von Juda, dagegen; von einem aufs Geratewohl abgeschossenen Pfeil getroffen, starb er am Abend in seinem Wagen. Sein Sohn Joram kämpfte dort gegen Hasaël von Syrien und kehrte verwundet nach Jesreel zurück. Dann sandte Elisa einen der Prophetenjünger nach Ramot in Gilead, Jehu, den Heerführer, zum König über Israel zu salben, und von dort brach Jehu zum Aufstand auf, der das Haus Ahabs beendete. Josephus erzählt diese Kriege nach und sagt, Joram habe die Stadt mit Gewalt genommen und sein Heer unter Jehu dort gelassen."
    - "In den Tagen Pekachs nahm Tiglat-Pileser III. von Assyrien um 733–732 v. Chr. Gilead und führte seine Bewohner gefangen fort, und Ramot-Gilead erscheint in der biblischen Geschichte nicht wieder. Im 4. Jahrhundert n. Chr. kannte Eusebius Ramot noch als Dorf."
  fr:
    - "Ramoth en Galaad, « les hauteurs de Galaad », était une ville du nord de Galaad, à l’est du Jourdain, près de la frontière entre Israël et les Araméens de Damas. Son site est disputé. Le nom survit à ar-Ramtha, près de l’actuelle frontière entre la Jordanie et la Syrie, ville bâtie sur un grand tertre de l’âge du Fer. D’autres préfèrent Tell el-Hisn, à environ 15 km au sud-ouest, au bord des collines de Galaad. Un candidat longtemps favori, où se trouve le point de la carte, est Tell er-Rumeith, petit tertre à quelques kilomètres au sud de Ramtha. Au IVe siècle apr. J.-C., Eusèbe plaçait Ramoth à quinze milles à l’ouest de Philadelphie (Amman), ce qui ne convient à aucun de ces sites ; la version latine de Jérôme dit à l’est."
    - "Paul Lapp fouilla Tell er-Rumeith en 1962 et 1967 et y trouva un petit fort de l’âge du Fer. Sa date est débattue : certains spécialistes tiennent qu’il ne peut être antérieur au début du VIIIe siècle av. J.-C., après l’époque d’Achab, et qu’un poste si petit n’a pu être la ville biblique."
    - "Dans la Bible, Ramoth en Galaad est une ville de refuge de la tribu de Gad, donnée aux Lévites, et le siège du fils de Guéber, officier de Salomon sur les bourgs de Jaïr et la contrée d’Argob en Basan. Achab, roi d’Israël, voulut la reprendre au roi de Syrie et monta contre elle avec Josaphat, roi de Juda ; frappé par une flèche tirée au hasard, il mourut le soir dans son char. Son fils Joram y combattit Hazaël de Syrie et revint blessé à Jizreel. Puis Élisée envoya l’un des fils des prophètes à Ramoth en Galaad oindre Jéhu, chef de l’armée, roi d’Israël, et de là Jéhu partit pour la révolte qui mit fin à la maison d’Achab. Flavius Josèphe reprend ces guerres et dit que Joram avait pris la ville de force et y avait laissé son armée sous Jéhu."
    - "Au temps de Péka, Tiglath-Piléser III d’Assyrie prit Galaad et emmena ses habitants captifs, vers 733–732 av. J.-C., et Ramoth en Galaad ne reparaît plus dans le récit biblique. Au IVe siècle apr. J.-C., Eusèbe connaissait encore Ramoth comme un village."
  it:
    - "Ramot di Galaad, «le alture di Galaad», era una città del Galaad settentrionale, a est del Giordano, presso il confine tra Israele e gli Aramei di Damasco. Il suo sito è controverso. Il nome sopravvive ad ar-Ramtha, vicino all’odierno confine tra Giordania e Siria, una città costruita su un grande tell dell’età del Ferro. Altri preferiscono Tell el-Hisn, circa 15 km a sud-ovest, al margine delle colline di Galaad. Un candidato a lungo favorito, dove si trova il punto della mappa, è Tell er-Rumeith, un piccolo tell a pochi chilometri a sud di Ramtha. Nel IV secolo d.C. Eusebio pose Ramot a quindici miglia a ovest di Filadelfia (Amman), il che non si accorda con nessuno di questi siti; la versione latina del suo libro di Girolamo dice a est."
    - "Paul Lapp scavò Tell er-Rumeith nel 1962 e nel 1967 e trovò un piccolo forte dell’età del Ferro. La sua data è dibattuta: alcuni studiosi sostengono che non possa essere anteriore all’inizio dell’VIII secolo a.C., dopo l’epoca di Acab, e che un presidio così piccolo non possa essere stato la città biblica."
    - "Nella Bibbia Ramot in Galaad è una città di rifugio per la tribù di Gad, data ai Leviti, e la sede del figlio di Gheber, ufficiale di Salomone sulle città di Iair e sulla regione di Argob in Basan. Acab, re d’Israele, volle riprenderla al re di Siria e salì contro di essa con Giosafat, re di Giuda; colpito da una freccia scoccata a caso, morì verso sera sul suo carro. Suo figlio Ioram vi combatté contro Cazaèl di Siria e tornò ferito a Izreel. Poi Eliseo mandò uno dei figli dei profeti a Ramot di Galaad a ungere Ieu, capo dell’esercito, re d’Israele, e da lì Ieu partì per la rivolta che pose fine alla casa di Acab. Giuseppe Flavio rinarra queste guerre e dice che Ioram aveva preso la città con la forza e vi aveva lasciato il suo esercito sotto Ieu."
    - "Ai tempi di Pekach, Tiglat-Pilèser III d’Assiria prese Galaad e ne deportò gli abitanti, verso il 733–732 a.C., e Ramot di Galaad non compare più nel racconto biblico. Nel IV secolo d.C. Eusebio conosceva ancora Ramot come villaggio."
  pl:
    - "Ramot w Gileadzie, „wyżyny Gileadu”, było miastem w północnym Gileadzie, na wschód od Jordanu, blisko granicy między Izraelem a Aramejczykami z Damaszku. Jego położenie jest sporne. Nazwa przetrwała w ar-Ramta, blisko dzisiejszej granicy między Jordanią a Syrią, w mieście zbudowanym na wielkim kopcu z epoki żelaza. Inni wolą Tell el-Hisn, około 15 km na południowy zachód, na skraju wzgórz Gileadu. Od dawna faworyzowanym kandydatem, w którym stoi punkt na mapie, jest Tell er-Rumajt, niewielki kopiec kilka kilometrów na południe od Ramty. W IV wieku n.e. Euzebiusz umieścił Ramot piętnaście mil na zachód od Filadelfii (Ammanu), co nie pasuje do żadnego z tych miejsc; łaciński przekład jego księgi autorstwa Hieronima mówi: na wschód."
    - "Paul Lapp prowadził wykopaliska w Tell er-Rumajt w 1962 i 1967 roku i znalazł niewielki fort z epoki żelaza. Jego datowanie jest sporne: niektórzy uczeni twierdzą, że nie może być starszy niż początek VIII wieku p.n.e., po czasach Achaba, i że tak mała placówka nie mogła być biblijnym miastem."
    - "W Biblii Ramot w Gileadzie jest miastem ucieczki pokolenia Gada, oddanym lewitom, i siedzibą syna Gebera, urzędnika Salomona nad miastami Jaira i okręgiem Argob w Baszanie. Achab, król Izraela, chciał odebrać je królowi Syrii i ruszył na nie z Jozafatem, królem Judy; trafiony strzałą wypuszczoną na los szczęścia, zmarł wieczorem na swym rydwanie. Jego syn Joram walczył tam z Chazaelem z Syrii i wrócił ranny do Jizreel. Potem Elizeusz posłał jednego z synów prorockich do Ramot w Gileadzie, by namaścił Jehu, wodza wojska, na króla Izraela, i stamtąd Jehu wyruszył do przewrotu, który zakończył dom Achaba. Józef Flawiusz opowiada te wojny na nowo i mówi, że Joram zdobył miasto siłą i zostawił tam swe wojsko pod Jehu."
    - "W dniach Pekacha Tiglat-Pileser III z Asyrii zdobył Gilead i uprowadził jego ludność, około 733–732 roku p.n.e., a Ramot w Gileadzie nie pojawia się już w biblijnej opowieści. W IV wieku n.e. Euzebiusz znał jeszcze Ramot jako wieś."
  cs:
    - "Rámot v Gileadu, „výšiny Gileadu“, bylo město v severním Gileadu, východně od Jordánu, poblíž hranice mezi Izraelem a Aramejci z Damašku. Jeho poloha je sporná. Jméno se zachovalo v ar-Ramtě, poblíž dnešní hranice mezi Jordánskem a Sýrií, městě vystavěném na velkém pahorku z doby železné. Jiní dávají přednost Tell el-Hisn, asi 15 km jihozápadně, na okraji gileadských pahorků. Dlouho oblíbeným kandidátem, kde stojí bod na mapě, je Tell er-Rumajt, malý pahorek několik kilometrů jižně od Ramty. Ve 4. století n. l. Eusebius umístil Rámot patnáct mil západně od Filadelfie (Ammánu), což nevyhovuje žádnému z těchto míst; Jeronýmův latinský překlad jeho knihy říká východně."
    - "Paul Lapp kopal v Tell er-Rumajt v letech 1962 a 1967 a našel malou pevnost z doby železné. Její datace je sporná: někteří učenci soudí, že nemůže být starší než počátek 8. století př. n. l., po době Achabově, a že tak malé stanoviště nemohlo být biblickým městem."
    - "V Bibli je Rámot v Gileadu útočištným městem pokolení Gád, dané levitům, a sídlem syna Geberova, Šalomounova správce nad městy Jaírovými a krajem Argob v Bášanu. Achab, král Izraele, je chtěl vzít zpět od krále Sýrie a vytáhl proti němu s Jozafatem, králem Judy; zasažen šípem vystřeleným náhodou zemřel večer na svém voze. Jeho syn Joram tam bojoval proti Chazaelovi Syrskému a vrátil se raněn do Jizreelu. Pak Elíša poslal jednoho ze synů proroků do Rámotu v Gileadu, aby pomazal Jehúa, velitele vojska, za krále nad Izraelem, a odtud Jehú vyrazil k povstání, které ukončilo dům Achabův. Josephus tyto války převypráví a praví, že Joram město dobyl silou a nechal tam své vojsko pod Jehúem."
    - "Za dnů Pekachových dobyl Tiglatpilesar III. Asyrský Gilead a odvedl jeho lid do zajetí, asi v letech 733–732 př. n. l., a Rámot v Gileadu se v biblickém příběhu již neobjevuje. Ve 4. století n. l. ještě Eusebius znal Rámot jako vesnici."
  nl:
    - "Ramot in Gilead, “de hoogten van Gilead”, was een stad in Noord-Gilead, ten oosten van de Jordaan, bij de grens tussen Israël en de Arameeërs van Damascus. De ligging is omstreden. De naam leeft voort in ar-Ramtha, bij de huidige grens tussen Jordanië en Syrië, een stad gebouwd op een grote heuvel uit de ijzertijd. Anderen verkiezen Tell el-Hisn, zo’n 15 km naar het zuidwesten, aan de rand van het heuvelland van Gilead. Een lang geliefde kandidaat, waar het kaartpunt staat, is Tell er-Rumeith, een kleine heuvel enkele kilometers ten zuiden van Ramtha. In de 4e eeuw n.Chr. plaatste Eusebius Ramot vijftien mijl ten westen van Filadelfia (Amman), wat bij geen van deze plaatsen past; Hieronymus’ Latijnse versie van zijn boek zegt oost."
    - "Paul Lapp groef in 1962 en 1967 Tell er-Rumeith op en vond een klein fort uit de ijzertijd. De datering is omstreden: sommige geleerden menen dat het niet ouder kan zijn dan het begin van de 8e eeuw v.Chr., na de tijd van Achab, en dat zo’n kleine post niet de bijbelse stad kan zijn geweest."
    - "In de Bijbel is Ramot in Gilead een vrijstad voor de stam Gad, aan de Levieten gegeven, en de zetel van de zoon van Geber, Salomo’s ambtenaar over de steden van Jaïr en het gebied van Argob in Basan. Achab, koning van Israël, wilde het op de koning van Syrië heroveren en trok erheen met Josafat, koning van Juda; getroffen door een op goed geluk afgeschoten pijl stierf hij ’s avonds in zijn wagen. Zijn zoon Joram streed daar tegen Hazaël van Syrië en keerde gewond terug naar Jizreël. Toen zond Elisa een van de profetenzonen naar Ramot in Gilead om Jehu, de legeroverste, tot koning over Israël te zalven, en van daaruit trok Jehu uit voor de opstand die een einde maakte aan het huis van Achab. Josephus vertelt deze oorlogen opnieuw en zegt dat Joram de stad met geweld had ingenomen en zijn leger er onder Jehu had achtergelaten."
    - "In de dagen van Pekach nam Tiglat-Pileser III van Assyrië Gilead in en voerde zijn bevolking gevankelijk weg, omstreeks 733–732 v.Chr., en Ramot in Gilead komt daarna niet meer voor in het bijbelse verhaal. In de 4e eeuw n.Chr. kende Eusebius Ramot nog als dorp."
  sv:
    - "Ramot-Gilead, ”Gileads höjder”, var en stad i norra Gilead, öster om Jordan, nära gränsen mellan Israel och araméerna i Damaskus. Dess läge är omstritt. Namnet lever kvar i ar-Ramtha, nära dagens gräns mellan Jordanien och Syrien, en stad byggd på en stor järnåldershög. Andra föredrar Tell el-Hisn, cirka 15 km åt sydväst, vid kanten av Gileads berg. En länge föredragen kandidat, där kartpunkten står, är Tell er-Rumeith, en liten kulle några kilometer söder om Ramtha. På 300-talet e.Kr. placerade Eusebios Ramot femton romerska mil väster om Filadelfia (Amman), vilket inte passar någon av dessa platser; Hieronymus latinska version av hans bok säger öster."
    - "Paul Lapp grävde ut Tell er-Rumeith 1962 och 1967 och fann ett litet fort från järnåldern. Dess datering är omdebatterad: vissa forskare menar att det inte kan vara äldre än början av 700-talet f.Kr., efter Achavs tid, och att så liten en post inte kan ha varit den bibliska staden."
    - "I Bibeln är Ramot i Gilead en fristad för Gads stam, given åt leviterna, och säte för Gevers son, Salomos tjänsteman över Jairs städer och området Argov i Bashan. Achav, Israels kung, ville ta tillbaka den från kungen av Syrien och drog upp mot den med Josafat, Juda kung; träffad av en pil som sköts på måfå dog han på aftonen i sin vagn. Hans son Joram stred där mot Hasael av Syrien och vände tillbaka sårad till Jisreel. Därefter sände Elisha en av profetlärjungarna till Ramot-Gilead för att smörja Jehu, härens befälhavare, till kung över Israel, och därifrån gav sig Jehu av på upproret som gjorde slut på Achavs hus. Josefus återberättar dessa krig och säger att Joram hade intagit staden med våld och lämnat sin armé där under Jehu."
    - "På Pekachs tid tog Tiglat-Pileser III av Assyrien Gilead och förde bort dess folk i fångenskap, omkring 733–732 f.Kr., och Ramot-Gilead förekommer inte igen i den bibliska berättelsen. På 300-talet e.Kr. kände Eusebios fortfarande Ramot som en by."
  nb:
    - "Ramot-Gilead, «Gileads høyder», var en by i nordlige Gilead, øst for Jordan, nær grensen mellom Israel og arameerne i Damaskus. Stedet er omstridt. Navnet overlever i ar-Ramtha, nær dagens grense mellom Jordan og Syria, en by bygd på en stor jernaldershaug. Andre foretrekker Tell el-Hisn, omtrent 15 km mot sørvest, i kanten av Gileads åser. En lenge favorisert kandidat, der kartpunktet står, er Tell er-Rumeith, en liten haug noen kilometer sør for Ramtha. På 300-tallet e.Kr. plasserte Eusebius Ramot femten romerske mil vest for Filadelfia (Amman), noe som ikke passer noen av disse stedene; Hieronymus' latinske versjon av boken hans sier øst."
    - "Paul Lapp gravde ut Tell er-Rumeith i 1962 og 1967 og fant et lite jernalderfort. Dateringen er omdiskutert: noen forskere mener at det ikke kan være eldre enn tidlig på 700-tallet f.Kr., etter Akabs tid, og at en så liten post ikke kan ha vært den bibelske byen."
    - "I Bibelen er Ramot i Gilead en tilfluktsby for Gads stamme, gitt til levittene, og sete for Gebers sønn, Salomos embetsmann over Jairs byer og Argob-bygden i Basan. Akab, Israels konge, ville ta den tilbake fra Syrias konge og dro mot den sammen med Josjafat, Judas konge; truffet av en pil som ble skutt på lykke og fromme, døde han om kvelden i vognen sin. Hans sønn Joram kjempet der mot Hasael av Syria og vendte såret tilbake til Jisreel. Så sendte Elisja en av profetsønnene til Ramot-Gilead for å salve Jehu, hærføreren, til konge over Israel, og derfra dro Jehu ut på opprøret som gjorde slutt på Akabs hus. Josefus gjenforteller disse krigene og sier at Joram hadde tatt byen med makt og latt hæren sin bli der under Jehu."
    - "På Pekahs tid tok Tiglat-Pileser III av Assyria Gilead og førte folket bort som fanger, omkring 733–732 f.Kr., og Ramot-Gilead opptrer ikke igjen i den bibelske fortellingen. På 300-tallet e.Kr. kjente Eusebius fortsatt Ramot som en landsby."
  tl:
    - "Ang Ramoth-galaad, “ang mga kaitaasan ng Gilead”, ay isang bayan sa hilagang Gilead, sa silangan ng Jordan, malapit sa hangganan ng Israel at ng mga Arameo ng Damasco. Pinagtatalunan ang lugar nito. Nananatili ang pangalan sa ar-Ramtha, malapit sa hangganan ngayon ng Jordan at Siria, isang bayang itinayo sa malaking burol ng Panahong Bakal. Mas gusto ng iba ang Tell el-Hisn, mga 15 km sa timog-kanluran, sa gilid ng mga burol ng Gilead. Isang matagal nang pinapaborang kandidato, kung saan nakalagay ang punto sa mapa, ay ang Tell er-Rumeith, isang maliit na burol na ilang kilometro sa timog ng Ramtha. Noong ika-4 na siglo AD, inilagay ni Eusebio ang Ramoth nang labinlimang milya sa kanluran ng Filadelfia (Amman), na hindi akma sa alinman sa mga lugar na ito; ang bersiyong Latin ng kaniyang aklat ni Jerome ay nagsasabing silangan."
    - "Hinukay ni Paul Lapp ang Tell er-Rumeith noong 1962 at 1967 at nakatagpo ng maliit na kuta ng Panahong Bakal. Pinagtatalunan ang petsa nito: iginigiit ng ilang iskolar na hindi ito maaaring mas matanda kaysa unang bahagi ng ika-8 siglo BK, pagkatapos ng panahon ni Achab, at na ang gayon kaliit na himpilan ay hindi maaaring ang lungsod sa Bibliya."
    - "Sa Bibliya, ang Ramoth sa Gilead ay bayang ampunan ng lipi ni Gad, ibinigay sa mga Levita, at luklukan ng anak ni Geber, opisyal ni Salomon sa mga bayan ni Jair at rehiyon ng Argob sa Basan. Nais ni Achab, hari ng Israel, na bawiin ito sa hari ng Siria at sumalakay kasama ni Josaphat, hari ng Juda; tinamaan ng palasong ibinaril nang walang tiyak na puntirya, namatay siya sa gabi sa karo niya. Lumaban doon ang anak niyang si Joram kay Hazael ng Siria, at umuwing sugatan sa Jezreel. Isinugo ni Eliseo ang isa sa mga anak ng mga propeta sa Ramoth-galaad upang pahiran si Jehu, kapitan ng hukbo, na hari sa Israel, at mula roon ay nagsimula si Jehu ng paghihimagsik na nagtapos sa sambahayan ni Achab. Isinasalaysay muli ni Josefo ang mga digmaang ito at sinasabing sinakop ni Joram ang lungsod sa pamamagitan ng lakas at iniwan doon ang hukbo niya sa ilalim ni Jehu."
    - "Noong panahon ni Peka, kinuha ni Tiglath-pileser III ng Asiria ang Gilead at dinala ang mga tao nito bilang bihag, bandang 733–732 BK, at hindi na muling lumilitaw ang Ramoth-galaad sa kuwento ng Bibliya. Noong ika-4 na siglo AD, kilala pa rin ni Eusebio ang Ramoth bilang isang nayon."
