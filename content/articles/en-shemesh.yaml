# Overview article (ADR 0007). Mainstream facts only; Ain el-Hod is the generally accepted identification and is given as resting on position alone.
id: en-shemesh
place: a34e870
title:
  en: "En-shemesh"
  ru: "Ен-Шемеш"
body:
  en:
    - "En-shemesh, “spring of the sun”, is a spring on the border between Judah and Benjamin east of Jerusalem, named only in the two descriptions of that border. Joshua traces the line of Judah up from the Jordan past the ascent of Adummim, and “the border passed toward the waters of En-shemesh, and the goings out thereof were at En-rogel”; the border of Benjamin runs the same way in reverse, from En-rogel northward “to En-shemesh, and went forth toward Geliloth, which is over against the going up of Adummim”, and down to the stone of Bohan. Nothing else is said of it."
    - "Since the line is otherwise fixed by Adummim and En-rogel, En-shemesh must lie on the road from Jerusalem down to Jericho just east of the Mount of Olives, and it is generally identified with Ain el-Hod, the “Spring of the Apostles”, below the old Jericho road about 1.5 km east of Bethany, the only spring on the road down to Jericho; a tradition of the fifteenth century that the apostles drank there gave it its Christian name. The identification rests on position, not on finds, but no other spring competes. The spring today lies beside the old road near al-Eizariya (Bethany) in the West Bank."
  ru:
    - "Ен-Шемеш, «источник солнца», — источник на границе Иуды и Вениамина к востоку от Иерусалима, названный только в двух описаниях этой границы. Книга Иисуса Навина ведёт предел Иуды вверх от Иордана мимо возвышенности Адуммима, и «отсюда предел проходит к водам Ен-Шемеша и оканчивается у Ен-Рогела»; предел Вениамина идёт тем же путём в обратную сторону, от Ен-Рогела на север, «идет к Ен-Шемешу, и идет к Гелилофу, который против возвышенности Адуммима», и спускается к камню Богана. Больше о нём ничего не сказано."
    - "Поскольку линия в остальном закреплена Адуммимом и Ен-Рогелом, Ен-Шемеш должен лежать на дороге из Иерусалима вниз к Иерихону, сразу за горой Елеонской, и его обычно отождествляют с Айн-эль-Ходом, «источником Апостолов», под старой Иерихонской дорогой примерно в 1,5 км к востоку от Вифании, единственным источником на дороге вниз к Иерихону; христианское имя ему дало предание XV века о том, что из него пили апостолы. Отождествление опирается на положение, а не на находки, но другого источника здесь нет. Сегодня он лежит у старой дороги близ Эль-Азарии (Вифании) на Западном берегу."
scripture:
  - Josh.15.7
  - Josh.18.17
sources:
