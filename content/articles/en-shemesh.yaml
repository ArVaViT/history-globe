# Overview article (ADR 0007). Mainstream facts only; Ain el-Hod is the generally accepted identification and is given as resting on position alone.
id: en-shemesh
place: a34e870
title:
  en: "En-shemesh"
  ru: "Ен-Шемеш"
  uk: "Ен-Шемеш"
  es: "En-semes"
  pt: "En-Semes"
  de: "En-Schemesch"
  fr: "En-Schémesch"
  it: "En-Semes"
  pl: "En-Szemesz"
  nl: "En-Semes"
  cs: "Én-šemeš"
body:
  en:
    - "En-shemesh, “spring of the sun”, is a spring on the border between Judah and Benjamin east of Jerusalem, named only in the two descriptions of that border. Joshua traces the line of Judah up from the Jordan past the ascent of Adummim, and “the border passed toward the waters of En-shemesh, and the goings out thereof were at En-rogel”; the border of Benjamin runs the same way in reverse, from En-rogel northward “to En-shemesh, and went forth toward Geliloth, which is over against the going up of Adummim”, and down to the stone of Bohan. Nothing else is said of it."
    - "Since the line is otherwise fixed by Adummim and En-rogel, En-shemesh must lie on the road from Jerusalem down to Jericho just east of the Mount of Olives, and it is generally identified with Ain el-Hod, the “Spring of the Apostles”, below the old Jericho road about 1.5 km east of Bethany, the only spring on the road down to Jericho; a tradition of the fifteenth century that the apostles drank there gave it its Christian name. The identification rests on position, not on finds, but no other spring competes. The spring today lies beside the old road near al-Eizariya (Bethany) in the West Bank."
  ru:
    - "Ен-Шемеш, «источник солнца», — источник на границе Иуды и Вениамина к востоку от Иерусалима, названный только в двух описаниях этой границы. Книга Иисуса Навина ведёт предел Иуды вверх от Иордана мимо возвышенности Адуммима, и «отсюда предел проходит к водам Ен-Шемеша и оканчивается у Ен-Рогела»; предел Вениамина идёт тем же путём в обратную сторону, от Ен-Рогела на север, «идет к Ен-Шемешу, и идет к Гелилофу, который против возвышенности Адуммима», и спускается к камню Богана. Больше о нём ничего не сказано."
    - "Поскольку линия в остальном закреплена Адуммимом и Ен-Рогелом, Ен-Шемеш должен лежать на дороге из Иерусалима вниз к Иерихону, сразу за горой Елеонской, и его обычно отождествляют с Айн-эль-Ходом, «источником Апостолов», под старой Иерихонской дорогой примерно в 1,5 км к востоку от Вифании, единственным источником на дороге вниз к Иерихону; христианское имя ему дало предание XV века о том, что из него пили апостолы. Отождествление опирается на положение, а не на находки, но другого источника здесь нет. Сегодня он лежит у старой дороги близ Эль-Азарии (Вифании) на Западном берегу."
  uk:
    - "Ен-Шемеш, «джерело сонця», — джерело на межі між Юдою та Веніяміном на схід від Єрусалима, назване лише в двох описах цієї межі. Ісус Навин простежує лінію Юди вгору від Йордану повз підйом Адуммім: «тягнеться гряниця на Ен-Семесову Воду і йде далїй до Рогел криницї»; межа Веніямина проходить тим самим шляхом у зворотному напрямку, від Ен-Рогела на північ, «тягнеться на Ен-Семес і далїй до Гелилота, що стоїть проти проходу Адумимського», і вниз до каменя Бохана. Більше про нього нічого не сказано."
    - "Оскільки лінія інакше визначена Адуммімом і Ен-Рогелом, Ен-Шемеш має лежати на дорозі з Єрусалима вниз до Єрихону просто на схід від Оливкової гори, і його зазвичай ототожнюють з Айн-ель-Худ, «Джерелом апостолів», нижче старої єрихонської дороги приблизно за 1,5 км на схід від Віфанії, єдиним джерелом на дорозі вниз до Єрихону; переказ XV ст., що апостоли пили там, дав йому християнську назву. Ототожнення спирається на розташування, а не на знахідки, але інше джерело не змагається. Джерело сьогодні лежить поряд зі старою дорогою біля аль-Ейзарії (Віфанії) на Західному березі."
  es:
    - "En-semes, «fuente del sol», es una fuente en la frontera entre Judá y Benjamín, al este de Jerusalén, nombrada solo en las dos descripciones de esa frontera. Josué traza la línea de Judá subiendo desde el Jordán, pasando la subida de Adumim, y «pasa este término á las aguas de En-semes, y sale á la fuente de Rogel»; la frontera de Benjamín corre por el mismo trazado a la inversa, desde En-rogel hacia el norte, «sale á Ensemes, y de allí sale á Geliloth, que está delante de la subida de Adummim», y desciende a la piedra de Bohán. No se dice nada más de ella."
    - "Como la línea queda fijada por lo demás por Adumim y En-rogel, En-semes debe de hallarse en el camino de Jerusalén a Jericó, justo al este del monte de los Olivos, y se identifica generalmente con Ain el-Hod, la «Fuente de los Apóstoles», bajo el antiguo camino de Jericó, a unos 1,5 km al este de Betania, la única fuente del camino que baja a Jericó; una tradición del siglo XV según la cual los apóstoles bebieron allí le dio su nombre cristiano. La identificación se apoya en la posición, no en hallazgos, pero ninguna otra fuente compite con ella. La fuente se halla hoy junto al antiguo camino, cerca de al-Eizariya (Betania), en Cisjordania."
  pt:
    - "En-Semes, “fonte do sol”, é uma fonte na fronteira entre Judá e Benjamim, a leste de Jerusalém, nomeada apenas nas duas descrições dessa fronteira. Josué traça a linha de Judá subindo do Jordão pela subida de Adumim, e “A fronteira passava pelas águas de En-Semes e terminava em En-Rogel”; a fronteira de Benjamim corre no mesmo traçado, em sentido inverso, de En-Rogel para o norte, “saía em En-Semes e seguia para Gelilote, que fica em frente à subida de Adumim”, e descia até a pedra de Boã. Nada mais se diz dela."
    - "Como a linha é fixada de resto por Adumim e En-Rogel, En-Semes deve ficar na estrada que desce de Jerusalém a Jericó, logo a leste do Monte das Oliveiras, e é geralmente identificada com Ain el-Hod, a “Fonte dos Apóstolos”, abaixo da antiga estrada de Jericó, cerca de 1,5 km a leste de Betânia, a única fonte na estrada que desce a Jericó; uma tradição do século XV segundo a qual os apóstolos beberam ali lhe deu o nome cristão. A identificação repousa na posição, não em achados, mas nenhuma outra fonte compete. A fonte fica hoje junto à antiga estrada, perto de al-Eizariya (Betânia), na Cisjordânia."
  de:
    - "En-Schemesch, „Quelle der Sonne“, ist eine Quelle an der Grenze zwischen Juda und Benjamin östlich von Jerusalem, nur in den beiden Beschreibungen dieser Grenze genannt. Josua zeichnet die Linie Judas vom Jordan herauf an der Steige Adummim vorbei, „darnach geht sie zu dem Wasser En-Semes und kommt hinaus zum Brunnen Rogel“; die Grenze Benjamins verläuft denselben Weg umgekehrt, von En-Rogel nordwärts: „und kommt hinaus gen En-Semes und kommt hinaus gen Geliloth, das gegenüber der Steige Adummim liegt“, und hinab zum Stein Bohans. Sonst wird nichts von ihr gesagt."
    - "Da die Linie sonst durch Adummim und En-Rogel festgelegt ist, muss En-Schemesch an der Straße von Jerusalem hinab nach Jericho unmittelbar östlich des Ölbergs liegen, und es wird allgemein mit Ain el-Hod gleichgesetzt, der „Apostelquelle“, unterhalb der alten Jerichostraße etwa 1,5 km östlich von Bethanien, der einzigen Quelle an der Straße hinab nach Jericho; eine Überlieferung des 15. Jahrhunderts, die Apostel hätten dort getrunken, gab ihr den christlichen Namen. Die Gleichsetzung beruht auf der Lage, nicht auf Funden, doch keine andere Quelle konkurriert. Die Quelle liegt heute neben der alten Straße nahe al-Eizariya (Bethanien) im Westjordanland."
  fr:
    - "En-Schémesch, « source du soleil », est une source à la frontière entre Juda et Benjamin, à l’est de Jérusalem, nommée seulement dans les deux descriptions de cette frontière. Josué trace la ligne de Juda en remontant depuis le Jourdain devant la montée d’Adummim : « Elle passait près des eaux d’En-Schémesch, et se prolongeait jusqu’à En-Roguel » ; la frontière de Benjamin court dans le même sens à l’envers, d’En-Roguel vers le nord : « Elle se dirigeait vers le nord à En-Schémesch, puis à Gueliloth, qui est vis-à-vis de la montée d’Adummim », et descendait à la pierre de Bohan. On n’en dit rien d’autre."
    - "Comme la ligne est par ailleurs fixée par Adummim et En-Roguel, En-Schémesch doit se trouver sur la route de Jérusalem à Jéricho, juste à l’est du Mont des Oliviers, et on l’identifie généralement à Ain el-Hod, la « source des Apôtres », sous l’ancienne route de Jéricho, à environ 1,5 km à l’est de Béthanie, seule source sur la route descendant vers Jéricho ; une tradition du XVe siècle selon laquelle les apôtres y burent lui a donné son nom chrétien. L’identification repose sur la position et non sur des trouvailles, mais aucune autre source ne la concurrence. La source se trouve aujourd’hui à côté de l’ancienne route près d’al-Eizariya (Béthanie), en Cisjordanie."
  it:
    - "En-Semes, «sorgente del sole», è una sorgente sul confine fra Giuda e Beniamino a est di Gerusalemme, nominata solo nelle due descrizioni di quel confine. Giosuè traccia la linea di Giuda risalendo dal Giordano oltre la salita di Adummim, e «passava presso le acque di En-Scemesh, e faceva capo a En-Roghel»; il confine di Beniamino corre nello stesso modo al contrario, da En-Roghel verso nord «giungeva a En-Scemesh; di là si dirigeva verso Gheliloth, che è dirimpetto alla salita di Adummim», e scendeva al sasso di Bohan. Null’altro se ne dice."
    - "Poiché la linea è altrimenti fissata da Adummim e da En-Roghel, En-Semes deve trovarsi sulla strada da Gerusalemme a Gerico, appena a est del Monte degli Ulivi, e si identifica in genere con Ain el-Hod, la «Sorgente degli Apostoli», sotto l’antica strada di Gerico a circa 1,5 km a est di Betania, l’unica sorgente sulla strada che scende a Gerico; una tradizione del XV secolo secondo cui gli apostoli vi bevvero le diede il nome cristiano. L’identificazione poggia sulla posizione, non su ritrovamenti, ma nessun’altra sorgente la contende. La sorgente si trova oggi accanto all’antica strada presso al-Eizariya (Betania) in Cisgiordania."
  pl:
    - "En-Szemesz, „źródło słońca”, jest źródłem na granicy między Judą a Beniaminem na wschód od Jerozolimy, wymienionym tylko w dwóch opisach tej granicy. Jozue wyznacza linię Judy w górę od Jordanu obok wzniesienia Adummim, i „idzie ta granica do wód Ensemes, a kończy się u studnicy Rogiel”; granica Beniamina biegnie tą samą drogą w odwrotnym kierunku, od En-Rogel na północ, „dochodzi do Ensemes, a wychodzi do Gelilot, które jest przeciwko górze, wstępując do Adommim”, i w dół do kamienia Bohana. Nic więcej o nim nie powiedziano."
    - "Ponieważ linię wyznaczają skądinąd Adummim i En-Rogel, En-Szemesz musi leżeć przy drodze z Jerozolimy w dół do Jerycha tuż na wschód od Góry Oliwnej i zwykle utożsamia się je z Ajn el-Hod, „Źródłem Apostołów”, poniżej starej drogi do Jerycha około 1,5 km na wschód od Betanii, jedynym źródłem na drodze w dół do Jerycha; XV-wieczna tradycja, że pili tam apostołowie, dała mu chrześcijańską nazwę. Utożsamienie opiera się na położeniu, nie na znaleziskach, lecz żadne inne źródło nie konkuruje. Źródło leży dziś przy starej drodze koło al-Ajzarijji (Betanii) na Zachodnim Brzegu."
  nl:
    - "En-Semes, “bron van de zon”, is een bron op de grens tussen Juda en Benjamin ten oosten van Jeruzalem, alleen genoemd in de twee beschrijvingen van die grens. Jozua trekt de lijn van Juda op vanaf de Jordaan langs de opgang van Adummim, en “zal deze landpale doorgaan tot het water van En-semes, en haar uitgangen zullen wezen te En-rogel”; Benjamins grens loopt dezelfde weg in omgekeerde richting, van En-Rogel noordwaarts, “en gaat uit te En-semes; van daar gaat zij uit naar Geliloth, welke is tegenover den opgang naar Adummim”, en daalt naar de steen van Bohan. Verder wordt niets van haar gezegd."
    - "Omdat de lijn verder door Adummim en En-Rogel is vastgelegd, moet En-Semes liggen aan de weg van Jeruzalem naar Jericho net ten oosten van de Olijfberg, en zij wordt algemeen geïdentificeerd met Ain el-Hod, de “Bron van de Apostelen”, onder de oude Jerichoweg zo'n 1,5 km ten oosten van Betanië, de enige bron aan de weg naar Jericho; een overlevering uit de vijftiende eeuw dat de apostelen daar dronken gaf haar de christelijke naam. De identificatie berust op ligging, niet op vondsten, maar geen andere bron kan concurreren. De bron ligt nu naast de oude weg bij al-Eizariya (Betanië) op de Westelijke Jordaanoever."
  cs:
    - "Én-šemeš, „pramen slunce“, je pramen na hranici mezi Judou a Benjamínem východně od Jeruzaléma, jmenovaný jen ve dvou popisech té hranice. Jozue vede čáru Judy vzhůru od Jordánu kolem výstupu do Adumím a „přechází k vodám Ensemes, a skonává se u studnice Rogel“; hranice Benjamínova běží stejným směrem obráceně, od Én-rógelu na sever, „dochází k Ensemes, a vychází do Gelilot, kteréž jest naproti místu, kudy se jde do Adomim“, a dolů ke kameni Bohana. Nic jiného se o něm neříká."
    - "Protože je čára jinak určena Adumím a Én-rógelem, musí Én-šemeš ležet na cestě z Jeruzaléma dolů do Jericha těsně východně od Olivové hory a obecně se ztotožňuje s Ain el-Hod, „Pramenem apoštolů“, pod starou jerišskou cestou asi 1,5 km východně od Betanie, jediným pramenem na cestě dolů do Jericha; tradice z 15. století, že tam apoštolové pili, mu dala křesťanské jméno. Ztotožnění spočívá na poloze, ne na nálezech, ale žádný jiný pramen nesoupeří. Pramen dnes leží vedle staré cesty u al-Eizariya (Betanie) na Západním břehu."
