  - "F.-M. Abel, Géographie de la Palestine, vol. 1 (1933)"
  - "J. Simons, The Geographical and Topographical Texts of the Old Testament (1959)"
  - "Z. Kallai, Historical Geography of the Bible: The Tribal Territories of Israel (1986)"
