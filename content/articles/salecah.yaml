body:
  en:
    - "Salecah was the easternmost town of Bashan, the frontier of the kingdom of Og. Moses recalls taking “all Bashan, unto Salchah and Edrei, cities of the kingdom of Og in Bashan”; Og had reigned “in mount Hermon, and in Salcah, and in all Bashan”, and Joshua lists the land “unto Salcah” among what Moses gave the tribes east of the Jordan. Chronicles says that the sons of Gad also spread “in the land of Bashan unto Salchah”. In each verse it marks a limit: beyond it lay the desert."
    - "The town is Salkhad, which keeps the name, in the south of the Jebel ed-Druz, the volcanic mountain of the Hauran, some 120 km south-east of Damascus. It stands on a crater cone at about 1,350 m, the last height before the steppe runs east to the Euphrates. Nabataean inscriptions found there speak of a temple of the goddess Allat, so the Nabataeans held it before Rome annexed their kingdom in AD 106 and the town joined the province of Arabia; Greek inscriptions follow. On the summit the Ayyubids built a castle in the thirteenth century whose black basalt walls crown the town. No excavation has reached the Iron Age town of Og's day, and its site is known only from the name."
    - "Today Salkhad is a town of the as-Suwayda governorate of Syria, largely Druze, with the castle ruin above it and the lava fields of the Hauran around."
  ru:
    - "Салха — самый восточный город Васана, граница царства Ога. Моисей вспоминает, как взял «весь Васан до Салхи и Едреи, города царства Ога Васанского»; Ог владел «горою Ермоном и Салхою и всем Васаном», и Иисус Навин числит землю «до Салхи» среди того, что Моисей дал коленам к востоку от Иордана. Паралипоменон говорит, что и сыновья Гада жили «в земле Васанской до Салхи». В каждом стихе она отмечает предел: за ней лежала пустыня."
    - "Это Салхад, сохранивший имя, на юге Джебель-эд-Друз, вулканической горы Хаурана, примерно в 120 км к юго-востоку от Дамаска. Он стоит на конусе кратера на высоте около 1350 м, последней высоте перед степью, уходящей на восток к Евфрату. Найденные там набатейские надписи говорят о храме богини Аллат, так что Набатеи владели им до того, как Рим присоединил их царство в 106 г. н. э. и город вошёл в провинцию Аравия; дальше идут греческие надписи. На вершине Айюбиды в XIII веке построили замок, чьи стены из чёрного базальта венчают город. Раскопки не доходили до города железного века времён Ога, и его место известно только по имени."
    - "Сегодня Салхад — город провинции Эс-Сувейда в Сирии, в основном друзский, с развалинами замка над ним и лавовыми полями Хаурана вокруг."
  uk:
    - "Салха була найсхіднішим містом Башану, кордоном царства Ога. Мойсей згадує, що взято «ввесь Базан, до Салки та до Едреї, міста в царстві Ога в Базанї»; Ог панував «над Ермон-горами і Салхою і всїм Базаном», а Ісус Навин зараховує землю «до Салхи» до того, що Мойсей дав колінам на схід від Йордану. Хроніки кажуть, що й сини Гадові оселилися «в Базанському краю до Салхи». У кожному вірші вона означає межу: далі лежала пустеля."
    - "Це місто — Салхад, що зберігає назву, на півдні Джебель-ед-Друз, вулканічної гори Хауран, приблизно за 120 км на південний схід від Дамаска. Він стоїть на кратерному конусі на висоті близько 1350 м, останньому підвищенні перед тим, як степ тягнеться на схід до Євфрату. Знайдені там набатейські написи говорять про храм богині Аллат, отже, набатейці володіли ним, поки Рим не приєднав їхнє царство в 106 р. н. е., і місто ввійшло до провінції Аравія; далі йдуть грецькі написи. На вершині в XIII ст. Аюбіди збудували замок, чорні базальтові мури якого вінчають місто. Розкопки не дійшли до міста залізної доби за часів Ога, і його місце відоме лише з назви."
    - "Нині Салхад — місто мухафази Ас-Сувейда в Сирії, здебільшого друзьке, із руїнами замку над ним і лавовими полями Хаурана навколо."
  es:
    - "Saleca era la ciudad más oriental de Basán, la frontera del reino de Og. Moisés recuerda haber tomado «todo Basán hasta Salchâ y Edrei, ciudades del reino de Og en Basán»; Og había reinado «en el monte de Hermón, y en Salca, y en todo Basán», y Josué cuenta la tierra «hasta Salchâ» entre lo que Moisés dio a las tribus al este del Jordán. Crónicas dice que los hijos de Gad se extendieron también «en la tierra de Basán hasta Salca». En cada versículo marca un límite: más allá se extendía el desierto."
    - "La ciudad es Salkhad, que conserva el nombre, en el sur del Jebel ed-Druz, la montaña volcánica del Haurán, a unos 120 km al sureste de Damasco. Se alza sobre un cono de cráter a unos 1350 m, la última altura antes de que la estepa corra al este hasta el Éufrates. Inscripciones nabateas halladas allí hablan de un templo de la diosa Allat, de modo que los nabateos la tuvieron antes de que Roma anexionara su reino en 106 d. C. y la ciudad pasara a la provincia de Arabia; siguen inscripciones griegas. En la cumbre los ayubíes construyeron un castillo en el siglo XIII cuyos muros de basalto negro coronan la ciudad. Ninguna excavación ha llegado a la ciudad de la Edad del Hierro de los días de Og, y su emplazamiento se conoce solo por el nombre."
    - "Hoy Salkhad es una ciudad de la gobernación siria de as-Suwayda, en gran parte drusa, con las ruinas del castillo sobre ella y los campos de lava del Haurán alrededor."
  pt:
    - "Salcá era a cidade mais oriental de Basã, a fronteira do reino de Ogue. Moisés recorda ter tomado “todo o Basã, até Salca e Edrei, cidades do reino de Ogue em Basã”; Ogue reinara “no monte Hermom, em Salca e em todo o Basã”, e Josué inclui a terra “até Salca” no que Moisés deu às tribos a leste do Jordão. Crônicas diz que os filhos de Gade também se estenderam “na terra de Basã, até Salca”. Em cada versículo ela marca um limite: além dela ficava o deserto."
    - "A cidade é Salkhad, que conserva o nome, no sul do Jebel ed-Druz, a montanha vulcânica do Haurã, a cerca de 120 km a sudeste de Damasco. Fica num cone de cratera a cerca de 1.350 m, a última altura antes que a estepe corra a leste até o Eufrates. Inscrições nabateias achadas ali falam de um templo da deusa Allat, de modo que os nabateus a tinham antes de Roma anexar seu reino em 106 d.C. e a cidade passar à província da Arábia; seguem-se inscrições gregas. No cume os aiúbidas construíram no século XIII um castelo cujas muralhas de basalto negro coroam a cidade. Nenhuma escavação alcançou a cidade da Idade do Ferro do tempo de Ogue, e seu local é conhecido apenas pelo nome."
    - "Hoje Salkhad é uma cidade da província de as-Suwayda, na Síria, em grande parte drusa, com as ruínas do castelo acima dela e os campos de lava do Haurã em volta."
  de:
    - "Salcha war die östlichste Stadt Baschans, die Grenze des Königreichs Ogs. Mose erinnert, dass sie „das ganze Basan bis gen Salcha und Edrei, die Städte des Königreichs Ogs von Basan“ nahmen; Og hatte „über den Berg Hermon, über Salcha und über ganz Basan“ geherrscht, und Josua zählt das Land „bis gen Salcha“ zu dem, was Mose den Stämmen östlich des Jordan gab. Die Chronik sagt, auch die Söhne Gads breiteten sich „im Lande Basan bis gen Salcha“ aus. In jedem Vers bezeichnet es eine Grenze: Dahinter lag die Wüste."
    - "Die Stadt ist Salchad, das den Namen bewahrt, im Süden des Dschebel ed-Druz, des vulkanischen Gebirges des Hauran, etwa 120 km südöstlich von Damaskus. Sie liegt auf einem Kraterkegel in etwa 1350 m Höhe, der letzten Erhebung, bevor die Steppe nach Osten bis zum Euphrat verläuft. Dort gefundene nabatäische Inschriften sprechen von einem Tempel der Göttin Allat, die Nabatäer hielten sie also, ehe Rom ihr Reich 106 n. Chr. annektierte und die Stadt zur Provinz Arabia kam; griechische Inschriften folgen. Auf dem Gipfel bauten die Ajjubiden im 13. Jahrhundert eine Burg, deren schwarze Basaltmauern die Stadt krönen. Keine Grabung hat die eisenzeitliche Stadt der Zeit Ogs erreicht, und ihre Lage ist nur durch den Namen bekannt."
    - "Heute ist Salchad eine überwiegend drusische Stadt im syrischen Gouvernement as-Suwaida, mit der Burgruine darüber und den Lavafeldern des Hauran ringsum."
  fr:
    - "Salca était la ville la plus orientale de Basan, la frontière du royaume d’Og. Moïse rappelle avoir pris « tout Basan jusqu’à Salca et Édréï, villes du royaume d’Og en Basan » ; Og avait dominé « sur la montagne de l’Hermon, sur Salca, sur tout Basan », et Josué compte le pays « jusqu’à Salca » parmi ce que Moïse donna aux tribus à l’est du Jourdain. Les Chroniques disent que les fils de Gad s’étendirent aussi « dans le pays de Basan, jusqu’à Salca ». Dans chaque verset, elle marque une limite : au-delà s’étendait le désert."
    - "La ville est Salkhad, qui garde le nom, dans le sud du Djebel ed-Druze, la montagne volcanique du Havran, à quelque 120 km au sud-est de Damas. Elle se dresse sur un cône de cratère à environ 1 350 m, dernière hauteur avant que la steppe ne s’étende vers l’est jusqu’à l’Euphrate. Des inscriptions nabatéennes trouvées là parlent d’un temple de la déesse Allat, si bien que les Nabatéens la tenaient avant que Rome annexe leur royaume en 106 apr. J.-C. et que la ville entre dans la province d’Arabie ; des inscriptions grecques suivent. Au sommet, les Ayyoubides bâtirent au XIIIe siècle un château dont les murs de basalte noir couronnent la ville. Aucune fouille n’a atteint la ville de l’âge du Fer du temps d’Og, et son site n’est connu que par le nom."
    - "Aujourd’hui, Salkhad est une ville du gouvernorat de Soueïda, en Syrie, en grande partie druze, avec la ruine du château au-dessus et les champs de lave du Havran alentour."
  it:
    - "Salca era la città più orientale di Basan, la frontiera del regno di Og. Mosè ricorda di aver preso «tutto Basan fino a Salca e a Edrei, città del regno di Og, in Basan»; Og aveva dominato «sul monte Hermon, su Salca, su tutto Basan», e Giosuè elenca il paese «fino a Salca» fra ciò che Mosè diede alle tribù a est del Giordano. Le Cronache dicono che anche i figli di Gad si estesero «nel paese di Bashan, fino a Salca». In ogni versetto segna un limite: oltre c’era il deserto."
    - "La città è Salkhad, che ne conserva il nome, nel sud del Gebel ed-Druz, il monte vulcanico dell’Auran, circa 120 km a sud-est di Damasco. Sorge su un cono di cratere a circa 1.350 m, l’ultima altura prima che la steppa corra a est fino all’Eufrate. Iscrizioni nabatee trovate lì parlano di un tempio della dea Allat, per cui i Nabatei la tennero prima che Roma annettesse il loro regno nel 106 d.C. e la città entrasse nella provincia d’Arabia; seguono iscrizioni greche. Sulla sommità gli Ayyubidi costruirono nel XIII secolo un castello le cui mura di basalto nero coronano la città. Nessuno scavo ha raggiunto la città dell’età del Ferro ai tempi di Og, e il suo sito è noto solo dal nome."
    - "Oggi Salkhad è una città del governatorato di as-Suwayda in Siria, in gran parte drusa, con le rovine del castello sopra di essa e i campi di lava dell’Auran attorno."
  pl:
    - "Salka była najdalej na wschód wysuniętym miastem Baszanu, granicą królestwa Oga. Mojżesz wspomina zdobycie „wszystko Basan aż do Selcha, i Edrej, miasta królestwa Ogowego w Basan”; Og panował „na górze Hermon, i w Selecha, i we wszystkiem Basan”, a Jozue wylicza ziemię „aż do Salecha” wśród tego, co Mojżesz dał pokoleniom na wschód od Jordanu. Kroniki mówią, że synowie Gada rozeszli się również „w ziemi Bazan, aż do Selchy”. W każdym wersecie wyznacza ona granicę: za nią leżała pustynia."
    - "Miasto to Salchad, który zachowuje nazwę, na południu Dżabal ad-Druz, wulkanicznej góry Hauranu, około 120 km na południowy wschód od Damaszku. Stoi na stożku krateru na wysokości około 1350 m, ostatnim wzniesieniu przed stepem biegnącym na wschód ku Eufratowi. Napisy nabatejskie znalezione tam mówią o świątyni bogini Allat, więc Nabatejczycy je posiadali, zanim Rzym przyłączył ich królestwo w 106 roku n.e., a miasto weszło do prowincji Arabii; po nich pojawiają się napisy greckie. Na szczycie Ajjubidzi zbudowali w XIII wieku zamek, którego czarne bazaltowe mury wieńczą miasto. Żadne wykopaliska nie dotarły do miasta z epoki żelaza z czasów Oga, a jego miejsce znane jest tylko z nazwy."
    - "Dziś Salchad jest miastem muhafazy as-Suwajda w Syrii, w większości druzyjskim, z ruiną zamku nad nim i polami lawy Hauranu wokół."
  cs:
    - "Salka byla nejvýchodnější město Bášanu, hranice království Ógova. Mojžíš připomíná dobytí „všecken Bázan až do Sálecha a Edrei, kteráž byla města království Og v Bázan“; o Ógovi se praví, že „panoval na hoře Hermon a v Sálecha, i ve vší krajině Bázan“, a Jozue počítá zemi „až do Sálecha“ k tomu, co Mojžíš dal pokolením na východ od Jordánu. Kroniky praví, že synové Gádovi se také rozšířili „v zemi Bázan, až do Sálechy“. V každém verši označuje mez: za ní ležela poušť."
    - "Město je Salchad, který jméno zachovává, na jihu Džabal ad-Durúz, sopečného pohoří Havranu, asi 120 km jihovýchodně od Damašku. Stojí na kráterovém kuželu ve výšce asi 1 350 m, poslední výšina, než se step rozbíhá na východ k Eufratu. Nabatejské nápisy tam nalezené mluví o chrámu bohyně Allát, takže jej Nabatejci drželi, než Řím roku 106 n. l. jejich království připojil a město se stalo součástí provincie Arábie; následují řecké nápisy. Na vrcholu vystavěli Ajjúbovci ve 13. století hrad, jehož černé čedičové zdi korunují město. Žádné vykopávky nedosáhly města doby železné z Ógových dnů a jeho místo je známo jen podle jména."
    - "Dnes je Salchad město v guvernorátu as-Suvajdá v Sýrii, převážně drúzské, s ruinou hradu nad ním a lávovými poli Havranu kolem."
  nl:
    - "Salga was de oostelijkste stad van Basan, de grens van het koninkrijk van Og. Mozes herinnert eraan dat hij nam “het ganse Bazan, tot Salcha en Edrei toe; steden des koninkrijks van Og in Bazan”; Og had geheerst “over den berg Hermon, en over Salcha, en over geheel Bazan”, en Jozua rekent het land “tot Salcha toe” tot wat Mozes aan de stammen ten oosten van de Jordaan gaf. Kronieken zegt dat ook de kinderen van Gad zich uitbreidden “in het land van Basan, tot Salcha toe”. In elk vers markeert het een grens: daarachter lag de woestijn."
    - "De stad is Salkhad, dat de naam bewaart, in het zuiden van de Jebel ed-Druz, het vulkanische gebergte van de Hauran, zo’n 120 km ten zuidoosten van Damascus. Het ligt op een kraterkegel op ongeveer 1350 m, de laatste hoogte voordat de steppe naar het oosten tot de Eufraat loopt. Nabateese opschriften die daar zijn gevonden spreken van een tempel van de godin Allat, dus de Nabateeërs hadden het voordat Rome hun koninkrijk in 106 n.Chr. annexeerde en de stad bij de provincie Arabië kwam; Griekse opschriften volgen. Op de top bouwden de Ajjoebiden in de 13e eeuw een kasteel waarvan de zwarte basaltmuren de stad kronen. Geen opgraving heeft de ijzertijdstad uit Ogs dagen bereikt, en haar plaats is alleen uit de naam bekend."
    - "Tegenwoordig is Salkhad een stad in het gouvernement as-Suwayda in Syrië, grotendeels Druzisch, met de kasteelruïne erboven en de lavavelden van de Hauran eromheen."
  sv:
    - "Salka var Bashans östligaste stad, gränsen för Ogs rike. Mose påminner om att de intog ”hela Basan, ända till Salka och Edrei, städerna i Ogs rike, i Basan”; Og ”rådde över Hermons bergsbygd och över Salka och hela Basan”, och Josua förtecknar landet ”hela Basan ända till Salka” bland det Mose gav stammarna öster om Jordan. Krönikeböckerna säger att Gads söner också bredde ut sig ”i landet Basan ända till Salka”. I varje vers markerar det en gräns: bortom låg öknen."
    - "Staden är Salkhad, som behåller namnet, i södra delen av Jebel ed-Druz, Haurans vulkaniska berg, cirka 120 km sydost om Damaskus. Den ligger på en kraterkon på omkring 1 350 m, den sista höjden innan stäppen löper österut till Eufrat. Nabatéiska inskriptioner som hittats där talar om ett tempel för gudinnan Allat, så nabatéerna höll den innan Rom annekterade deras kungarike år 106 e.Kr. och staden kom till provinsen Arabien; grekiska inskriptioner följer. På toppen byggde ayyubiderna en borg på 1200-talet vars svarta basaltmurar kröner staden. Ingen utgrävning har nått järnåldersstaden från Ogs dagar, och dess plats är bara känd från namnet."
    - "I dag är Salkhad en stad i guvernementet as-Suwayda i Syrien, till stor del drusisk, med borgruinen ovanför och Haurans lavafält runt omkring."
  nb:
    - "Salka var den østligste byen i Basan, grensen for Ogs rike. Moses minnes at han tok «hele Basan like til byene Salka og Edre'i i Ogs rike i Basan»; Og hadde rådd «over Hermon-fjellet og over Salka og over hele Basan», og Josva oppfører landet «like til Salka» blant det Moses ga stammene øst for Jordan. Krønikebøkene sier at Gads sønner også bodde «i Basans land helt til Salka». I hvert vers markerer det en grense: bortenfor lå ørkenen."
    - "Byen er Salkhad, som bevarer navnet, i sør i Jebel ed-Druz, det vulkanske fjellet i Havran, omtrent 120 km sørøst for Damaskus. Den ligger på en kraterkjegle på omtrent 1350 m, den siste høyden før steppen løper østover til Eufrat. Nabateiske inskripsjoner funnet der taler om et tempel for gudinnen Allat, så nabateerne hadde den før Roma annekterte riket deres i 106 e.Kr. og byen ble en del av provinsen Arabia; greske inskripsjoner følger. På toppen bygde ayyubidene en borg på 1200-tallet hvis svarte basaltmurer kroner byen. Ingen utgravning har nådd jernalderbyen fra Ogs dager, og stedet er bare kjent fra navnet."
    - "I dag er Salkhad en by i guvernementet as-Suwayda i Syria, for det meste drusisk, med borgruinen over seg og lavafeltene i Havran rundt."
  tl:
    - "Ang Salcha ay ang pinakasilangang bayan ng Basan, ang hangganan ng kaharian ni Og. Inaalala ni Moises na kinuha niya ang “buong Basan, hanggang Salcha at Edrei, na mga bayan ng kaharian ni Og sa Basan”; si Og ay naghari “sa bundok ng Hermon, at sa Salca, at sa buong Basan”, at inililista ni Josue ang lupain “hanggang sa Salca” sa ibinigay ni Moises sa mga lipi sa silangan ng Jordan. Sinasabi ng Mga Cronica na ang mga anak ni Gad ay nanirahan din “sa lupain ng Basan hanggang sa Salca”. Sa bawat talata ay nagmamarka ito ng hangganan: sa kabila nito ay disyerto."
    - "Ang bayan ay ang Salkhad, na nagpapanatili ng pangalan, sa timog ng Jebel ed-Druz, ang bundok na bulkaniko ng Hauran, mga 120 km sa timog-silangan ng Damasco. Nakatayo ito sa kono ng bunganga ng bulkan sa mga 1,350 m, ang huling taas bago umabot ang steppe sa silangan hanggang sa Eufrates. Ang mga inskripsiyong Nabateo na natagpuan doon ay nagsasalita tungkol sa templo ng diyosang si Allat, kaya hawak ito ng mga Nabateo bago isinama ng Roma ang kanilang kaharian noong AD 106 at sumama ang bayan sa lalawigan ng Arabia; sumunod ang mga inskripsiyong Griyego. Sa tuktok, nagtayo ang mga Ayyubid ng kastilyo noong ika-13 siglo na ang mga itim na pader na basalto ang kumokorona sa bayan. Walang paghuhukay na umabot sa bayan ng Panahong Bakal noong mga araw ni Og, at kilala lamang ang lugar nito mula sa pangalan."
    - "Ang Salkhad ngayon ay bayan ng gobernorato ng as-Suwayda ng Siria, karamihan ay Druze, na may guho ng kastilyo sa itaas nito at ang mga bukid ng lava ng Hauran sa palibot."
  da:
    - "Salka var Basans østligste by, grænsen for Ogs rige. Moses erindrer, at de tog »hele Basan, indtil Salka og Edrei, som vare Stæder i Ogs Rige i Basan«; Og havde hersket »over Hermons Bjerg og over Salka og over al Basan«, og Josva opregner landet »indtil Salka« blandt det, Moses gav stammerne øst for Jordan. Krønikebøgerne siger, at Gads sønner også bredte sig »i Basans Land indtil Salka«. I hvert vers markerer den en grænse: bag den lå ørkenen."
    - "Byen er Salkhad, som bevarer navnet, i den sydlige del af Jebel ed-Druz, Hauran-egnens vulkanbjerg, omkring 120 km sydøst for Damaskus. Den ligger på en kraterkegle i omkring 1350 m højde, den sidste højde, før stepperne løber østpå til Eufrat. Nabatæiske indskrifter fundet dér taler om et tempel for gudinden Allat, så nabatæerne holdt den, før Rom indlemmede deres kongerige i 106 e.Kr., og byen kom ind under provinsen Arabia; græske indskrifter følger. På toppen byggede ayyubiderne i 1200-tallet en borg, hvis sorte basaltmure kroner byen. Ingen udgravning har nået jernalderbyen fra Ogs tid, og dens sted kendes kun fra navnet."
    - "I dag er Salkhad en by i as-Suwayda-guvernementet i Syrien, overvejende drusisk, med borgruinen over sig og Haurans lavamarker omkring."
