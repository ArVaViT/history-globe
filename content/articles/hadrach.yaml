body:
  en:
    - "Hadrach was a city and land of northern Syria, the Hazrak of Aramaic inscriptions and the Hatarikka of Assyrian ones. It was the capital of Luhuti (Lu'ash), joined to the kingdom of Hamath. It is usually located at Tell Afis, in Syria's Idlib governorate about 11 km north of Ebla, which a joint team of the universities of Rome, Pisa and Bologna led by Stefania Mazzoni and Serena Maria Cecchini excavated from 1986 to 2010."
    - "The Bible names it once, at the head of an oracle against Syria and Phoenicia: “The burden of the word of the LORD in the land of Hadrach, and Damascus shall be the rest thereof”. The prophecy goes on to Hamath, Tyre and Sidon and the cities of the Philistines."
    - "Around 785 BC Zakkur, king of Hamath and Lu'ash, was besieged in Hazrak by Bar-Hadad son of Hazael of Damascus and a coalition of kings, and set up a stele thanking his god for his rescue; it was found at Tell Afis in 1903 and is now in the Louvre. Assyria fought Hatarikka in 772, 765 and 755 BC under Ashur-dan III, and Tiglath-pileser III took it for Assyria about 738 BC. On the acropolis the excavators found an Iron Age temple of the tripartite long-room plan."
  ru:
    - "Хадрах — город и земля в Северной Сирии, Хазрак арамейских надписей и Хатарикка ассирийских. Это была столица Лухути (Луаша), соединённой с царством Емаф. Его обычно помещают на Телль-Афис, в сирийской мухафазе Идлиб, примерно в 11 км к северу от Эблы; в 1986–2010 гг. его раскапывала совместная экспедиция университетов Рима, Пизы и Болоньи во главе со Стефанией Мадзони и Сереной Марией Чеккини."
    - "Библия называет его один раз, в начале пророчества против Сирии и Финикии: «Пророческое слово Господа на землю Хадрах, и на Дамаске оно остановится». Далее пророчество говорит о Емафе, Тире и Сидоне и о городах филистимлян."
    - "Около 785 г. до н. э. Заккур, царь Емафа и Луаша, был осаждён в Хазраке Бар-Хададом, сыном Азаила Дамасского, и союзом царей и поставил стелу в благодарность своему богу за спасение; её нашли на Телль-Афис в 1903 г., ныне она в Лувре. Ассирия воевала с Хатариккой в 772, 765 и 755 гг. до н. э. при Ашшур-дане III, а Тиглатпаласар III около 738 г. до н. э. подчинил её Ассирии. На акрополе археологи нашли храм железного века трёхчастного продольного плана."
  uk:
    - "Хадрах був містом і країною північної Сирії, Хазраком арамейських написів і Хатарікою ассирійських. Він був столицею Лухуті (Луаш), приєднаної до царства Хамат. Його зазвичай шукають у Телль-Афісі, в сирійській мухафазі Ідліб приблизно за 11 км на північ від Ебли; спільна група університетів Рима, Пізи й Болоньї під керівництвом Стефанії Маццоні та Серени Марії Чеккіні розкопувала його в 1986–2010 рр."
    - "Біблія називає його один раз, на початку пророцтва проти Сирії та Фінікії: «Пророче слово Господнє, проти міста Гадрах, та й на Дамаск воно наляже». Пророцтво далі переходить до Хамата, Тіра й Сидона та міст филистимлян."
    - "Близько 785 р. до н. е. Закура, царя Хамата й Луаша, облягали в Хазраку Бар-Гадад, син Азаїла з Дамаска, і коаліція царів, і він поставив стелу з подякою своєму богові за порятунок; її знайшли в Телль-Афісі 1903 р., нині вона в Луврі. Ассирія воювала з Хатарікою в 772, 765 і 755 рр. до н. е. за Ашшур-дана III, а Тіглатпаласар III близько 738 р. до н. е. підкорив її Ассирії. На акрополі розкопувачі знайшли храм залізної доби з тридільним планом довгої зали."
  es:
    - "Hadrac era una ciudad y tierra del norte de Siria, la Hazrak de las inscripciones arameas y la Hatarikka de las asirias. Era la capital de Luhuti (Lu'ash), unida al reino de Hamat. Suele localizarse en Tell Afis, en la gobernación siria de Idlib, unos 11 km al norte de Ebla, que un equipo conjunto de las universidades de Roma, Pisa y Bolonia dirigido por Stefania Mazzoni y Serena Maria Cecchini excavó de 1986 a 2010."
    - "La Biblia la nombra una vez, al comienzo de un oráculo contra Siria y Fenicia: «Carga de la palabra de Jehová contra tierra de Hadrach, y de Damasco su reposo». La profecía sigue con Hamat, Tiro y Sidón y las ciudades de los filisteos."
    - "Hacia 785 a. C. Zakkur, rey de Hamat y Lu'ash, fue asediado en Hazrak por Bar-Hadad, hijo de Hazael de Damasco, y una coalición de reyes, y erigió una estela en que da gracias a su dios por su liberación; fue hallada en Tell Afis en 1903 y está hoy en el Louvre. Asiria combatió Hatarikka en 772, 765 y 755 a. C. bajo Ashur-dan III, y Tiglat-pileser III la tomó para Asiria hacia 738 a. C. En la acrópolis los excavadores hallaron un templo de la edad del Hierro de planta tripartita de sala alargada."
  de:
    - "Hadrach war eine Stadt und ein Land in Nordsyrien, das Hazrak der aramäischen und das Hatarikka der assyrischen Inschriften. Es war die Hauptstadt von Luhuti (Lu'asch), das dem Königreich Hamat angeschlossen war. Gewöhnlich wird es in Tell Afis lokalisiert, im syrischen Gouvernement Idlib etwa 11 km nördlich von Ebla, das ein gemeinsames Team der Universitäten Rom, Pisa und Bologna unter Stefania Mazzoni und Serena Maria Cecchini von 1986 bis 2010 ausgrub."
    - "Die Bibel nennt es einmal, am Anfang eines Spruches gegen Syrien und Phönizien: „Dies ist die Last, davon der HERR redet über das Land Hadrach und die sich niederläßt auf Damaskus“. Die Weissagung geht weiter zu Hamat, Tyrus und Sidon und den Städten der Philister."
    - "Um 785 v. Chr. wurde Zakkur, König von Hamat und Lu'asch, in Hazrak von Bar-Hadad, dem Sohn Hasaels von Damaskus, und einer Koalition von Königen belagert und errichtete eine Stele, auf der er seinem Gott für seine Rettung dankte; sie wurde 1903 in Tell Afis gefunden und steht heute im Louvre. Assyrien kämpfte 772, 765 und 755 v. Chr. unter Assur-dan III. gegen Hatarikka, und Tiglat-Pileser III. nahm es um 738 v. Chr. für Assyrien ein. Auf der Akropolis fanden die Ausgräber einen eisenzeitlichen Tempel mit dreiteiligem Langraumgrundriss."
  fr:
    - "Hadrac était une ville et un pays du nord de la Syrie, le Hazrak des inscriptions araméennes et le Hatarikka des inscriptions assyriennes. C’était la capitale du Luhuti (Lu’ash), uni au royaume de Hamath. On la situe d’ordinaire à Tell Afis, dans le gouvernorat syrien d’Idlib, à environ 11 km au nord d’Ebla, que fouilla de 1986 à 2010 une équipe commune des universités de Rome, Pise et Bologne dirigée par Stefania Mazzoni et Serena Maria Cecchini."
    - "La Bible la nomme une fois, en tête d’un oracle contre la Syrie et la Phénicie : « Oracle, parole de l’Éternel sur le pays de Hadrac. Elle s’arrête sur Damas ». La prophétie se poursuit avec Hamath, Tyr et Sidon et les villes des Philistins."
    - "Vers 785 av. J.-C., Zakkur, roi de Hamath et du Lu’ash, fut assiégé dans Hazrak par Bar-Hadad, fils de Hazaël de Damas, et une coalition de rois, et dressa une stèle remerciant son dieu de sa délivrance ; elle fut trouvée à Tell Afis en 1903 et se trouve aujourd’hui au Louvre. L’Assyrie combattit Hatarikka en 772, 765 et 755 av. J.-C. sous Assur-dan III, et Tiglath-Piléser III s’en empara pour l’Assyrie vers 738 av. J.-C. Sur l’acropole, les fouilleurs ont trouvé un temple de l’âge du Fer au plan tripartite à salle longue."
  pt:
    - "Hadraque era uma cidade e terra do norte da Síria, a Hazrak das inscrições arameias e a Hatarikka das assírias. Era a capital de Luhuti (Lu'ash), unida ao reino de Hamate. É geralmente localizada em Tell Afis, na governadoria de Idlib, na Síria, cerca de 11 km ao norte de Ebla, que uma equipe conjunta das universidades de Roma, Pisa e Bolonha, liderada por Stefania Mazzoni e Serena Maria Cecchini, escavou de 1986 a 2010."
    - "A Bíblia a nomeia uma vez, no início de um oráculo contra a Síria e a Fenícia: “A palavra do SENHOR é contra a terra de Hadraque, e repousará sobre Damasco”. A profecia prossegue com Hamate, Tiro e Sidom e as cidades dos filisteus."
    - "Por volta de 785 a.C., Zakkur, rei de Hamate e Lu'ash, foi cercado em Hazrak por Bar-Hadad, filho de Hazael de Damasco, e por uma coalizão de reis, e ergueu uma estela agradecendo ao seu deus pelo resgate; ela foi encontrada em Tell Afis em 1903 e está hoje no Louvre. A Assíria combateu Hatarikka em 772, 765 e 755 a.C. sob Assur-dan III, e Tiglate-Pileser III a tomou para a Assíria por volta de 738 a.C. Na acrópole os escavadores encontraram um templo da Idade do Ferro de planta tripartida em sala longa."
  it:
    - "Adrac era una città e un paese della Siria settentrionale, l’Hazrak delle iscrizioni aramaiche e l’Hatarikka di quelle assire. Era la capitale di Luhuti (Lu‘ash), unita al regno di Camat. Di solito è localizzata a Tell Afis, nel governatorato siriano di Idlib, a circa 11 km a nord di Ebla, che una squadra congiunta delle università di Roma, Pisa e Bologna guidata da Stefania Mazzoni e Serena Maria Cecchini scavò dal 1986 al 2010."
    - "La Bibbia la nomina una sola volta, all’inizio di un oracolo contro la Siria e la Fenicia: «Oracolo, parola dell’Eterno, contro il paese di Hadrac, e che si ferma sopra Damasco». La profezia prosegue con Camat, Tiro e Sidone e le città dei Filistei."
    - "Verso il 785 a.C. Zakkur, re di Camat e di Lu‘ash, fu assediato a Hazrak da Bar-Hadad figlio di Cazaèl di Damasco e da una coalizione di re, ed eresse una stele per ringraziare il suo dio della liberazione; fu trovata a Tell Afis nel 1903 ed è ora al Louvre. L’Assiria combatté Hatarikka nel 772, nel 765 e nel 755 a.C. sotto Ashur-dan III, e Tiglat-Pileser III la prese per l’Assiria verso il 738 a.C. Sull’acropoli gli scavatori trovarono un tempio dell’età del Ferro con pianta tripartita a sala lunga."
  nl:
    - "Chadrach was een stad en land in Noord-Syrië, het Hazrak van Aramese inscripties en het Hatarikka van Assyrische. Het was de hoofdstad van Luhuti (Lu'ash), verbonden met het koninkrijk Hamat. Het wordt gewoonlijk gezocht bij Tell Afis, in het Syrische gouvernement Idlib ongeveer 11 km ten noorden van Ebla, dat een gezamenlijk team van de universiteiten van Rome, Pisa en Bologna onder leiding van Stefania Mazzoni en Serena Maria Cecchini van 1986 tot 2010 opgroef."
    - "De Bijbel noemt het eenmaal, aan het hoofd van een godsspraak tegen Syrië en Fenicië: “De last van het woord des HEEREN over het land Chadrach en Damaskus, deszelfs rust”. De profetie gaat verder naar Hamat, Tyrus en Sidon en de steden van de Filistijnen."
    - "Omstreeks 785 v.Chr. werd Zakkur, koning van Hamat en Lu'ash, in Hazrak belegerd door Bar-Hadad, zoon van Hazaël van Damascus, en een coalitie van koningen, en hij richtte een stèle op om zijn god te danken voor zijn redding; zij werd in 1903 bij Tell Afis gevonden en staat nu in het Louvre. Assyrië voerde in 772, 765 en 755 v.Chr. onder Assur-dan III oorlog tegen Hatarikka, en Tiglat-Pileser III nam het omstreeks 738 v.Chr. voor Assyrië in. Op de acropolis vonden de opgravers een tempel uit de ijzertijd met een driedelige langzaalplattegrond."
  pl:
    - "Chadrak było miastem i krainą północnej Syrii, Hazrak z napisów aramejskich i Hatarikka z asyryjskich. Było stolicą Luhuti (Lu'asz), połączonej z królestwem Chamat. Zwykle lokalizuje się je w Tell Afis, w syryjskiej muhafazie Idlib, około 11 km na północ od Ebli, które wspólny zespół uniwersytetów w Rzymie, Pizie i Bolonii pod kierunkiem Stefanii Mazzoni i Sereny Marii Cecchini badał w latach 1986-2010."
    - "Biblia wymienia je raz, na początku wyroczni przeciw Syrii i Fenicji (Za 9,1): słowo Pana ma dotyczyć ziemi Chadrak, a Damaszek ma być jej miejscem spoczynku; nazwę ziemi podaje tu wprost tekst hebrajski i Biblia Króla Jakuba, a Biblia Gdańska ma „przeciwko ziemi, która jest w około ciebie”. Proroctwo biegnie dalej do Chamat, Tyru i Sydonu oraz miast Filistynów."
    - "Około 785 p.n.e. Zakkur, król Chamat i Lu'asz, został oblężony w Hazrak przez Bar-Hadada, syna Chazaela z Damaszku, i koalicję królów, i ustawił stelę dziękując swemu bogu za ocalenie; odnaleziono ją w Tell Afis w 1903 roku i znajduje się dziś w Luwrze. Asyria walczyła z Hatarikką w 772, 765 i 755 p.n.e. pod wodzą Aszur-dana III, a Tiglat-Pileser III zajął ją dla Asyrii około 738 p.n.e. Na akropolu badacze znaleźli świątynię z epoki żelaza o trójdzielnym planie długiej sali."
  cs:
    - "Chadrach bylo město a země v severní Sýrii, Hazrak aramejských nápisů a Hatarikka asyrských. Bylo hlavním městem Luhuti (Luʿaš), připojeného ke království Chamat. Obvykle se klade do Tell Afis v syrském guvernorátu Idlib asi 11 km severně od Ebly, kde společný tým univerzit v Římě, Pise a Bologni vedený Stefanií Mazzoni a Serenou Marií Cecchini kopal v letech 1986 až 2010."
    - "Bible je jmenuje jednou, na počátku věštby proti Sýrii a Fénicii: břímě slova Hospodinova přichází na zemi Chadrach a Damašek bude jeho odpočinutím. Proroctví pak pokračuje k Chamatu, Týru a Sidónu a k městům Pelištejců."
    - "Kolem roku 785 př. n. l. byl Zakkur, král Chamatu a Luʿaše, obležen v Hazraku Bar-hadadem, synem Chazaelovým z Damašku, a koalicí králů a postavil stélu, v níž děkoval svému bohu za záchranu; byla nalezena v Tell Afis roku 1903 a je dnes v Louvru. Asýrie bojovala proti Hatarikce v letech 772, 765 a 755 př. n. l. za Aššur-dána III. a Tiglatpilesar III. ji kolem roku 738 př. n. l. získal pro Asýrii. Na akropoli nalezli vykopávači chrám z doby železné s trojdílným půdorysem dlouhého sálu."
  sv:
    - "Hadrak var en stad och ett land i norra Syrien, arameiska inskrifters Hazrak och assyriska inskrifters Hatarikka. Det var huvudstad i Luhuti (Lu'ash), förenat med kungariket Hamat. Det förläggs vanligen till Tell Afis, i Syriens guvernement Idlib omkring 11 km norr om Ebla, som ett gemensamt team från universiteten i Rom, Pisa och Bologna under ledning av Stefania Mazzoni och Serena Maria Cecchini grävde ut 1986–2010."
    - "Bibeln nämner det en gång, i inledningen till en spådom mot Syrien och Fenicien: ”en utsaga som innehåller HERRENS ord över Hadraks land; också i Damaskus skall den slå ned”. Profetian fortsätter till Hamat, Tyros och Sidon och filistéernas städer."
    - "Omkring 785 f.Kr. belägrades Zakkur, kung av Hamat och Lu'ash, i Hazrak av Bar-Hadad, son till Hasael av Damaskus, och en koalition av kungar, och reste en stele som tackade hans gud för räddningen; den hittades i Tell Afis 1903 och finns nu i Louvren. Assyrien stred mot Hatarikka åren 772, 765 och 755 f.Kr. under Assur-dan III, och Tiglat-Pileser III intog det för Assyrien omkring 738 f.Kr. På akropolis fann utgrävarna ett järnålderstempel av tredelad långrumstyp."
  nb:
    - "Hadrak var en by og et land i det nordlige Syria, Hazrak i arameiske innskrifter og Hatarikka i assyriske. Det var hovedstaden i Luhuti (Lu'asj), knyttet til kongedømmet Hamat. Det plasseres vanligvis ved Tell Afis, i Syrias Idlib-guvernement omtrent 11 km nord for Ebla, som et felles team fra universitetene i Roma, Pisa og Bologna ledet av Stefania Mazzoni og Serena Maria Cecchini gravde ut fra 1986 til 2010."
    - "Bibelen nevner det én gang, i begynnelsen av et utsagn mot Syria og Fønikia: «Dette utsagn er Herrens ord mot Hadraks land; også i Damaskus skal det slå sig ned». Profetien fortsetter til Hamat, Tyros og Sidon og filistrenes byer."
    - "Omkring 785 f.Kr. ble Zakkur, konge av Hamat og Lu'asj, beleiret i Hazrak av Bar-Hadad, Hasaels sønn fra Damaskus, og en koalisjon av konger, og reiste en stele som takket hans gud for redningen; den ble funnet ved Tell Afis i 1903 og er nå i Louvre. Assyria kjempet mot Hatarikka i 772, 765 og 755 f.Kr. under Assur-dan 3., og Tiglat-Pileser 3. tok den for Assyria omkring 738 f.Kr. På akropolis fant utgraverne et jernalders tempel med tredelt langromsplan."
  tl:
    - "Ang Hadrach ay lungsod at lupain sa hilagang Siria, ang Hazrak ng mga inskripsiyong Arameo at ang Hatarikka ng mga Asirio. Ito ang kabisera ng Luhuti (Lu'ash), na isinanib sa kaharian ng Hamath. Karaniwan itong inilalagay sa Tell Afis, sa lalawigan ng Idlib ng Siria, mga 11 km sa hilaga ng Ebla, na hinukay mula 1986 hanggang 2010 ng magkasanib na pangkat ng mga pamantasan ng Roma, Pisa at Bologna sa pamumuno nina Stefania Mazzoni at Serena Maria Cecchini."
    - "Isang beses lamang itong pinangalanan ng Biblia, sa simula ng isang orakulo laban sa Siria at Fenicia: “Ang hula na salita ng Panginoon laban sa lupain ng Hadrach, at Damasco ang magiging pahingahang dako niyaon”. Nagpapatuloy ang hula sa Hamath, Tiro at Sidon at sa mga lungsod ng mga Filisteo."
    - "Noong mga 785 BK, si Zakkur, hari ng Hamath at Lu'ash, ay kinubkob sa Hazrak ni Bar-Hadad na anak ni Hazael ng Damasco at ng isang koalisyon ng mga hari, at nagtayo siya ng estela bilang pasasalamat sa kaniyang diyos sa pagliligtas sa kaniya; natagpuan ito sa Tell Afis noong 1903 at nasa Louvre ngayon. Nakipagdigma ang Asiria sa Hatarikka noong 772, 765 at 755 BK sa ilalim ni Ashur-dan III, at kinuha ito ni Tiglath-pileser III para sa Asiria noong mga 738 BK. Sa akropolis ay natagpuan ng mga arkeologo ang isang templo ng Panahong Bakal na may planong mahabang silid na may tatlong bahagi."
  da:
    - "Hadrak var en by og et land i det nordlige Syrien, Hazrak i aramæiske indskrifter og Hatarikka i assyriske. Den var hovedstad i Luhuti (Lu'ash), forenet med kongeriget Hamat. Den placeres sædvanligvis ved Tell Afis, i Syriens Idlib-guvernement omkring 11 km nord for Ebla, som et fælles hold fra universiteterne i Rom, Pisa og Bologna ledet af Stefania Mazzoni og Serena Maria Cecchini udgravede fra 1986 til 2010."
    - "Bibelen nævner den én gang, i spidsen for et orakel mod Syrien og Fønikien: »Herrens Ords Profeti er over Kadraks Land, og Damaskus er dets Hvilested«. Profetien fortsætter til Hamat, Tyrus og Sidon og filisterbyerne."
    - "Omkring 785 f.Kr. blev Zakkur, konge af Hamat og Lu'ash, belejret i Hazrak af Bar-Hadad, søn af Hazael af Damaskus, og en koalition af konger, og rejste en stele, der takkede hans gud for hans redning; den blev fundet ved Tell Afis i 1903 og er nu i Louvre. Assyrien kæmpede mod Hatarikka i 772, 765 og 755 f.Kr. under Assur-dan III, og Tiglat-Pileser III indlemmede den i Assyrien omkring 738 f.Kr. På akropolis fandt udgraverne et jernalderstempel med tredelt langrumsplan."
  sr:
    - "Хадрах је био град и земља у северној Сирији, Хазрак арамејских и Хатарика асирских натписа. Био је престоница Лухутија (Луаш), присаједињеног краљевству Емат. Обично се смешта у Тел Афис, у сиријском гувернорату Идлиб око 11 км северно од Ебле, који је заједнички тим универзитета у Риму, Пизи и Болоњи, под вођством Стефаније Маџони и Серене Марије Чекини, ископавао од 1986. до 2010."
    - "Библија га именује једном, на челу пророштва против Сирије и Феникије: „Бреме речи Господње земљи Адраху и Дамаску, где ће починути“. Пророчанство даље иде на Емат, Тир и Сидон и градове Филистеја."
    - "Око 785. п. н. е. Закур, цар Емата и Луаша, био је опседнут у Хазраку од Бар-Адада, Азаилова сина из Дамаска, и савеза царева, па је подигао стелу захваљујући свом богу на спасењу; пронађена је у Тел Афису 1903. и сада је у Лувру. Асирија је ратовала против Хатарике 772, 765. и 755. п. н. е. под Ашурданом III, а Теглат-Феласар III заузео ју је за Асирију око 738. п. н. е. На акрополи су ископавачи нашли храм гвозденог доба триделног плана са дугачком просторијом."
scripture:
