body:
  en:
    - "Shaalbon is known only through one man, “Eliahba the Shaalbonite”, in the two lists of David's thirty heroes. The gentilic points to Shaalbim (Shaalabbin in the list of Dan's towns), a town in the valley of Aijalon where “the Amorites would dwell” after the conquest until “the hand of the house of Joseph prevailed, so that they became tributaries”, and which later lay in the second of Solomon's twelve supply districts with Beth-shemesh. On the map Shaalbon is treated as the same place as Shaalbim."
    - "Shaalbim is identified with Selbit, a ruin on a hill about 5 km north-west of Aijalon (Yalo) at the edge of the valley, near the kibbutz that revived the name Sha'alvim in 1951. The identification rests on the name and the position; the excavation there by E. L. Sukenik in 1949 uncovered a Samaritan synagogue of about the fourth or fifth century AD with a mosaic floor, not the Amorite or Israelite town. Of Eliahba himself nothing is told beyond his name and his place in the list."
  ru:
    - "Шаалбон известен только по одному человеку из двух списков тридцати храбрых Давида: «Елияхба Шаалбонянин». Прозвище указывает на Шаалвим (Шаалаввин в списке городов Дана), город в долине Аиалонской, где после завоевания «остались Аморреи жить», пока «рука сынов Иосифовых» не «одолела Аморреев, и сделались они данниками им», и который позже входил во второй из двенадцати податных округов Соломона вместе с Вефсамисом. На карте Шаалбон считается тем же местом, что и Шаалвим."
    - "Шаалвим отождествляют с Сельбитом — руинами на холме примерно в 5 км к северо-западу от Аиалона (Яло) у края долины, рядом с кибуцем, который в 1951 году возродил имя Шаалвим. Отождествление держится на имени и положении; раскопки там Э. Л. Сукеника в 1949 году открыли самаритянскую синагогу примерно IV–V века н. э. с мозаичным полом, а не аморрейский или израильский город. О самом Елияхбе не сказано ничего, кроме имени и места в списке."
  uk:
    - "Шаалбон відомий лише через одну людину, «Еліахба з Саалбону», в обох переліках тридцяти героїв Давида. Назва родової належності вказує на Шаалвім (Шаалаввін у переліку міст Дана), місто в Аялонській долині, де після завоювання «остались Аморії», доки дім Йосифів не «почав… брати над ними гору» і вони «поробились крепаками», і яке пізніше лежало в другому з дванадцяти округів постачання Соломона разом із Бет-Шемешем. На карті Шаалбон розглядається як те саме місце, що й Шаалвім."
    - "Шаалвім ототожнюють із Сельбітом, руїною на пагорбі приблизно за 5 км на північний захід від Аялона (Яло) на краю долини, поблизу кібуца, що відродив назву Шаалвім у 1951 р. Ототожнення спирається на назву й розташування; тамтешні розкопки Е. Л. Сукеніка 1949 р. виявили самарянську синагогу приблизно IV–V ст. н. е. з мозаїчною підлогою, а не аморейське чи ізраїльське місто. Про самого Еліяхбу нічого не сказано, крім імені та місця в переліку."
  es:
    - "Saalbón se conoce solo por un hombre, «Eliaba Saalbonita», en las dos listas de los treinta héroes de David. El gentilicio apunta a Saalbim (Saalabín en la lista de las ciudades de Dan), una ciudad del valle de Ajalón donde «quiso el Amorrheo habitar» tras la conquista hasta que «la mano de la casa de José tomó fuerzas, hiciéronlos tributarios», y que más tarde estuvo en el segundo de los doce distritos de abastecimiento de Salomón con Bet-semes. En el mapa Saalbón se trata como el mismo lugar que Saalbim."
    - "Saalbim se identifica con Selbit, unas ruinas en una colina a unos 5 km al noroeste de Ajalón (Yalo), en el borde del valle, cerca del kibutz que revivió el nombre Sha'alvim en 1951. La identificación se apoya en el nombre y la posición; la excavación allí de E. L. Sukenik en 1949 sacó a la luz una sinagoga samaritana de hacia el siglo IV o V d. C. con suelo de mosaico, no la ciudad amorrea o israelita. Del propio Eliaba no se cuenta nada más allá de su nombre y su lugar en la lista."
  pt:
    - "Saalbom é conhecida apenas por um homem, “Eliaba, o saalbonita”, nas duas listas dos trinta heróis de Davi. O gentílico aponta para Saalabim, que consta da lista das cidades de Dã, cidade no vale de Aijalom onde “os amorreus persistiram em habitar” depois da conquista até que “a mão da casa de José prevaleceu, de modo que eles foram sujeitos a trabalhos forçados”, e que mais tarde ficou no segundo dos doze distritos de abastecimento de Salomão, com Bete-Semes. No mapa Saalbom é tratada como o mesmo lugar que Saalabim."
    - "Saalabim é identificada com Selbit, uma ruína numa colina a cerca de 5 km a noroeste de Aijalom (Yalo), na orla do vale, perto do kibutz que reviveu o nome Sha'alvim em 1951. A identificação se apoia no nome e na posição; a escavação ali por E. L. Sukenik em 1949 revelou uma sinagoga samaritana de cerca do século IV ou V d.C., com piso de mosaico, não a cidade amorreia ou israelita. De Eliaba nada se conta além do nome e de seu lugar na lista."
  de:
    - "Schaalbon ist nur durch einen Mann bekannt, „Eljahba, der Saalboniter“, in den beiden Listen von Davids dreißig Helden. Die Herkunftsbezeichnung weist auf Schaalbim (Schaalabbin in der Liste der Städte Dans), eine Stadt im Tal von Ajalon, wo „die Amoriter blieben wohnen“ nach der Eroberung, bis „ihnen die Hand des Hauses Joseph zu schwer“ wurde, „und wurden zinsbar“, und die später im zweiten von Salomos zwölf Versorgungsbezirken mit Bet-Schemesch lag. Auf der Karte wird Schaalbon als derselbe Ort wie Schaalbim behandelt."
    - "Schaalbim wird mit Selbit gleichgesetzt, einer Ruine auf einem Hügel etwa 5 km nordwestlich von Ajalon (Yalo) am Rand des Tals, nahe dem Kibbuz, der den Namen Scha'alwim 1951 wiederbelebte. Die Gleichsetzung beruht auf Name und Lage; die Grabung von E. L. Sukenik dort 1949 legte eine samaritanische Synagoge etwa des 4. oder 5. Jahrhunderts n. Chr. mit Mosaikboden frei, nicht die amoritische oder israelitische Stadt. Von Eljachba selbst wird nichts erzählt außer seinem Namen und seinem Platz in der Liste."
  fr:
    - "Schaalbon n’est connue que par un seul homme, « Éliachba, de Schaalbon », dans les deux listes des trente vaillants de David. Le gentilé renvoie à Schaalbim (Schaalabbin dans la liste des villes de Dan), ville de la vallée d’Ajalon où « les Amoréens voulurent rester » après la conquête jusqu’à ce que « la main de la maison de Joseph s’appesantit sur eux, et ils furent assujettis à un tribut », et qui se trouva plus tard dans le deuxième des douze districts de ravitaillement de Salomon avec Beth-Schémesch. Sur la carte, Schaalbon est traitée comme le même lieu que Schaalbim."
    - "Schaalbim est identifiée à Selbit, ruine sur une colline à environ 5 km au nord-ouest d’Ajalon (Yalo) au bord de la vallée, près du kibboutz qui reprit le nom de Sha‘alvim en 1951. L’identification repose sur le nom et la position ; la fouille faite là par E. L. Sukenik en 1949 a mis au jour une synagogue samaritaine d’environ le IVe ou le Ve siècle apr. J.-C. avec un sol de mosaïque, non la ville amoréenne ou israélite. D’Éliachba lui-même, on ne sait rien au-delà de son nom et de sa place dans la liste."
  it:
    - "Saalbon è nota solo attraverso un uomo, «Eliahba da Shaalbon», nei due elenchi dei trenta prodi di Davide. Il gentilizio rimanda a Saalbim (Saalabbin nell’elenco delle città di Dan), una città nella valle di Aialon dove gli Amorei «si mostrarono decisi a restare» dopo la conquista finché «la mano della casa di Giuseppe si aggravò su loro sì che furon soggetti a servitù», e che più tardi rientrò nel secondo dei dodici distretti di approvvigionamento di Salomone con Bet-Semes. Sulla mappa Saalbon è trattata come lo stesso luogo di Saalbim."
    - "Saalbim è identificata con Selbit, una rovina su una collina circa 5 km a nord-ovest di Aialon (Yalo) al margine della valle, presso il kibbutz che nel 1951 ha fatto rivivere il nome Sha’alvim. L’identificazione poggia sul nome e sulla posizione; lo scavo lì di E. L. Sukenik nel 1949 ha portato alla luce una sinagoga samaritana del IV o V secolo d.C. circa con un pavimento a mosaico, non la città amorrea o israelita. Di Eliacba stesso non si dice nulla oltre al nome e al suo posto nell’elenco."
  pl:
    - "Szaalbon znany jest tylko przez jednego człowieka, „Elijachba Salabończyk”, w obu listach trzydziestu bohaterów Dawida. Nazwa mieszkańca wskazuje na Szaalbim (Szaalabbin na liście miast Dana), miasto w dolinie Ajjalonu, w którym „począł mieszkać Amorejczyk” po podboju, aż „wzmocniła się ręka domu Józefowego, i byli hołdownikami ich”, a które później leżało w drugim z dwunastu okręgów zaopatrzeniowych Salomona razem z Bet-Szemesz. Na mapie Szaalbon traktuje się jako to samo miejsce co Szaalbim."
    - "Szaalbim utożsamia się z Selbit, ruiną na wzgórzu około 5 km na północny zachód od Ajjalonu (Jalo) na skraju doliny, koło kibucu, który w 1951 roku przywrócił nazwę Szaalwim. Utożsamienie opiera się na nazwie i położeniu; tamtejsze wykopaliska E. L. Sukenika w 1949 roku odsłoniły synagogę samarytańską z około IV lub V wieku n.e. z posadzką mozaikową, a nie miasto amoryckie ani izraelskie. O samym Eliachbie nie wiadomo nic poza jego imieniem i miejscem na liście."
  cs:
    - "Šaalbon je znám jen skrze jednoho muže, „Eliachba Salbonský“, v obou seznamech Davidových třiceti hrdinů. Přídomek ukazuje na Šaalbim (Šaalabbin v seznamu danských měst), město v údolí Ajalon, kde „počal Amorejský svobodně bydliti“ po dobytí země, dokud „se zsilila ruka čeledi Jozefovy, uvedeni jsou pod plat“, a které později leželo ve druhém ze Šalomounových dvanácti zásobovacích okresů s Bét-šemešem. Na mapě je Šaalbon pokládán za totéž místo jako Šaalbim."
    - "Šaalbim se ztotožňuje se Selbítem, ruinou na pahorku asi 5 km severozápadně od Ajalonu (Jalo) na okraji údolí, poblíž kibucu, který roku 1951 obnovil jméno Ša'alvim. Ztotožnění spočívá na jménu a poloze; tamní vykopávky E. L. Sukenika roku 1949 odkryly samařskou synagogu z asi 4. či 5. století n. l. s mozaikovou podlahou, nikoli amorejské či izraelské město. O Eliachbovi samém se neříká nic kromě jeho jména a místa v seznamu."
  nl:
    - "Saälbon is alleen bekend door één man, “Eljachba, de Saalboniet”, in de twee lijsten van Davids dertig helden. De afkomstaanduiding wijst naar Saälbim (Saälabbin in de lijst van Dans steden), een stad in de vallei van Ajalon waar de Amorieten na de verovering “wilden wonen”, “maar de hand van het huis van Jozef werd zwaar, zodat zij cijnsbaar werden”, en die later in het tweede van Salomo’s twaalf bevoorradingsdistricten lag met Beth-Semes. Op de kaart wordt Saälbon als dezelfde plaats als Saälbim behandeld."
    - "Saälbim wordt gelijkgesteld met Selbit, een ruïne op een heuvel zo’n 5 km ten noordwesten van Ajalon (Yalo) aan de rand van de vallei, bij de kibboets die in 1951 de naam Sha’alvim herleven liet. De identificatie berust op de naam en de ligging; de opgraving daar door E. L. Sukenik in 1949 legde een Samaritaanse synagoge uit omstreeks de 4e of 5e eeuw n.Chr. bloot met een mozaïekvloer, niet de Amorietische of Israëlitische stad. Van Eljachba zelf wordt niets verteld buiten zijn naam en zijn plaats in de lijst."
  sv:
    - "Shaalbon är bara känt genom en man, ”saalboniten Eljaba”, i de två förteckningarna över Davids trettio hjältar. Folknamnet pekar på Shaalbim (Saalabbin i förteckningen över Dans städer), en stad i Ajalondalen där ”amoréerna förmådde hålla sig kvar” efter erövringen tills ”Josefs barns hand blev tung över dem, så att de blevo arbetspliktiga under dessa”, och som senare låg i det andra av Salomos tolv försörjningsdistrikt med Bet-Shemesh. På kartan behandlas Shaalbon som samma plats som Shaalbim."
    - "Shaalbim identifieras med Selbit, en ruin på en kulle cirka 5 km nordväst om Ajalon (Yalo) i dalens kant, nära kibbutzen som återupplivade namnet Sha'alvim 1951. Identifikationen vilar på namnet och läget; utgrävningen där av E. L. Sukenik 1949 frilade en samarisk synagoga från omkring 300- eller 400-talet e.Kr. med mosaikgolv, inte den amoritiska eller israelitiska staden. Om Eljachba själv berättas ingenting utöver hans namn och hans plats i förteckningen."
  nb:
    - "Saalbon er bare kjent gjennom én mann, «sa'albonitten Eljahba», i de to listene over Davids tretti helter. Stedsbetegnelsen peker mot Sjaalbim (Sa'alabbin i listen over Dans byer), en by i Ajalon-dalen der «amorittene [lyktes] å bli boende» etter erobringen inntil «Josefs barns hånd lå tungt på dem, og de blev arbeidspliktige», og som senere lå i det andre av Salomos tolv forsyningsdistrikter sammen med Bet-Sjemesj. På kartet behandles Saalbon som det samme stedet som Sjaalbim."
    - "Sjaalbim identifiseres med Selbit, en ruin på en høyde omtrent 5 km nordvest for Ajalon (Yalo) i kanten av dalen, nær kibbutzen som gjenopplivet navnet Sha'alvim i 1951. Identifikasjonen hviler på navnet og beliggenheten; utgravningen der av E. L. Sukenik i 1949 avdekket en samaritansk synagoge fra omkring 300- eller 400-tallet e.Kr. med mosaikkgulv, ikke den amorittiske eller israelittiske byen. Om Eljahba selv fortelles ingenting utover navnet og plassen i listen."
  tl:
    - "Ang Saalbon ay kilala lamang sa pamamagitan ng isang lalaki, “Eliahba na Saalbonita”, sa dalawang listahan ng tatlumpung bayani ni David. Ang gentilic ay tumuturo sa Saalbim (Saalabbin sa listahan ng mga bayan ng Dan), isang bayan sa libis ng Ajalon kung saan “inibig ng mga Amorrheo na tumahan” pagkatapos ng pananakop hanggang “nanaig ang kamay ng sangbahayan ni Jose, na anopa't sila'y naging mga tagapagpaatag”, at na kalaunan ay nasa ikalawa sa labindalawang distrito ng panustos ni Salomon kasama ng Beth-semes. Sa mapa, itinuturing na iisang lugar ang Saalbon at Saalbim."
    - "Ang Saalbim ay kinikilala sa Selbit, isang guho sa isang burol na mga 5 km sa hilagang-kanluran ng Ajalon (Yalo) sa gilid ng libis, malapit sa kibbutz na muling nagbuhay ng pangalang Sha'alvim noong 1951. Nakasalalay ang pagkilala sa pangalan at lokasyon; ang paghuhukay roon ni E. L. Sukenik noong 1949 ay naglantad ng sinagoga ng mga Samaritano mula bandang ika-4 o ika-5 siglo AD na may sahig na mosaiko, hindi ang bayang Amorrheo o Israelita. Tungkol kay Eliahba mismo, walang sinasabi maliban sa kaniyang pangalan at lugar sa listahan."
