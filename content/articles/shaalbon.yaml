# Overview article (ADR 0007). Mainstream facts only; Shaalbon is known only as a gentilic and is taken, as the map takes it, for Shaalbim; the Selbit identification and the one excavation there are reported as such.
id: shaalbon
place: a1303a4
title:
  en: "Shaalbon"
  ru: "Шаалбон"
  uk: "Шаалбон"
  es: "Saalbón"
  pt: "Saalbom"
  de: "Schaalbon"
  fr: "Schaalbon"
body:
  en:
    - "Shaalbon is known only through one man, “Eliahba the Shaalbonite”, in the two lists of David's thirty heroes. The gentilic points to Shaalbim (Shaalabbin in the list of Dan's towns), a town in the valley of Aijalon where “the Amorites would dwell” after the conquest until “the hand of the house of Joseph prevailed, so that they became tributaries”, and which later lay in the second of Solomon's twelve supply districts with Beth-shemesh. On the map Shaalbon is treated as the same place as Shaalbim."
    - "Shaalbim is identified with Selbit, a ruin on a hill about 5 km north-west of Aijalon (Yalo) at the edge of the valley, near the kibbutz that revived the name Sha'alvim in 1951. The identification rests on the name and the position; the one excavation there, by E. L. Sukenik in 1949, uncovered a Samaritan synagogue of about the fourth or fifth century AD with a mosaic floor, not the Amorite or Israelite town. Of Eliahba himself nothing is told beyond his name and his place in the list."
  ru:
    - "Шаалбон известен только по одному человеку из двух списков тридцати храбрых Давида: «Елияхба Шаалбонянин». Прозвище указывает на Шаалвим (Шаалаввин в списке городов Дана), город в долине Аиалонской, где после завоевания «остались Аморреи жить», пока «рука сынов Иосифовых» не «одолела Аморреев, и сделались они данниками им», и который позже входил во второй из двенадцати податных округов Соломона вместе с Вефсамисом. На карте Шаалбон считается тем же местом, что и Шаалвим."
    - "Шаалвим отождествляют с Сельбитом — руинами на холме примерно в 5 км к северо-западу от Аиалона (Яло) у края долины, рядом с кибуцем, который в 1951 году возродил имя Шаалвим. Отождествление держится на имени и положении; единственные раскопки там, Э. Л. Сукеника в 1949 году, открыли самаритянскую синагогу примерно IV–V века н. э. с мозаичным полом, а не аморрейский или израильский город. О самом Елияхбе не сказано ничего, кроме имени и места в списке."
  uk:
    - "Шаалбон відомий лише через одну людину, «Еліахба з Саалбону», в обох переліках тридцяти героїв Давида. Назва родової належності вказує на Шаалвім (Шаалаввін у переліку міст Дана), місто в Аялонській долині, де після завоювання «остались Аморії», доки дім Йосифів не «почав… брати над ними гору» і вони «поробились крепаками», і яке пізніше лежало в другому з дванадцяти округів постачання Соломона разом із Бет-Шемешем. На карті Шаалбон розглядається як те саме місце, що й Шаалвім."
    - "Шаалвім ототожнюють із Сельбітом, руїною на пагорбі приблизно за 5 км на північний захід від Аялона (Яло) на краю долини, поблизу кібуца, що відродив назву Шаалвім у 1951 р. Ототожнення спирається на назву й розташування; єдині тамтешні розкопки, Е. Л. Сукеніка 1949 р., виявили самарянську синагогу приблизно IV–V ст. н. е. з мозаїчною підлогою, а не аморейське чи ізраїльське місто. Про самого Еліяхбу нічого не сказано, крім імені та місця в переліку."
  es:
    - "Saalbón se conoce solo por un hombre, «Eliaba Saalbonita», en las dos listas de los treinta héroes de David. El gentilicio apunta a Saalbim (Saalabín en la lista de las ciudades de Dan), una ciudad del valle de Ajalón donde «quiso el Amorrheo habitar» tras la conquista hasta que «la mano de la casa de José tomó fuerzas, hiciéronlos tributarios», y que más tarde estuvo en el segundo de los doce distritos de abastecimiento de Salomón con Bet-semes. En el mapa Saalbón se trata como el mismo lugar que Saalbim."
    - "Saalbim se identifica con Selbit, unas ruinas en una colina a unos 5 km al noroeste de Ajalón (Yalo), en el borde del valle, cerca del kibutz que revivió el nombre Sha'alvim en 1951. La identificación se apoya en el nombre y la posición; la única excavación allí, de E. L. Sukenik en 1949, sacó a la luz una sinagoga samaritana de hacia el siglo IV o V d. C. con suelo de mosaico, no la ciudad amorrea o israelita. Del propio Eliaba no se cuenta nada más allá de su nombre y su lugar en la lista."
  pt:
    - "Saalbom é conhecida apenas por um homem, “Eliaba, o saalbonita”, nas duas listas dos trinta heróis de Davi. O gentílico aponta para Saalabim, que consta da lista das cidades de Dã, cidade no vale de Aijalom onde “os amorreus persistiram em habitar” depois da conquista até que “a mão da casa de José prevaleceu, de modo que eles foram sujeitos a trabalhos forçados”, e que mais tarde ficou no segundo dos doze distritos de abastecimento de Salomão, com Bete-Semes. No mapa Saalbom é tratada como o mesmo lugar que Saalabim."
    - "Saalabim é identificada com Selbit, uma ruína numa colina a cerca de 5 km a noroeste de Aijalom (Yalo), na orla do vale, perto do kibutz que reviveu o nome Sha'alvim em 1951. A identificação se apoia no nome e na posição; a única escavação ali, por E. L. Sukenik em 1949, revelou uma sinagoga samaritana de cerca do século IV ou V d.C., com piso de mosaico, não a cidade amorreia ou israelita. De Eliaba nada se conta além do nome e de seu lugar na lista."
  de:
    - "Schaalbon ist nur durch einen Mann bekannt, „Eljahba, der Saalboniter“, in den beiden Listen von Davids dreißig Helden. Die Herkunftsbezeichnung weist auf Schaalbim (Schaalabbin in der Liste der Städte Dans), eine Stadt im Tal von Ajalon, wo „die Amoriter blieben wohnen“ nach der Eroberung, bis „ihnen die Hand des Hauses Joseph zu schwer“ wurde, „und wurden zinsbar“, und die später im zweiten von Salomos zwölf Versorgungsbezirken mit Bet-Schemesch lag. Auf der Karte wird Schaalbon als derselbe Ort wie Schaalbim behandelt."
    - "Schaalbim wird mit Selbit gleichgesetzt, einer Ruine auf einem Hügel etwa 5 km nordwestlich von Ajalon (Yalo) am Rand des Tals, nahe dem Kibbuz, der den Namen Scha'alwim 1951 wiederbelebte. Die Gleichsetzung beruht auf Name und Lage; die einzige Grabung dort, von E. L. Sukenik 1949, legte eine samaritanische Synagoge etwa des 4. oder 5. Jahrhunderts n. Chr. mit Mosaikboden frei, nicht die amoritische oder israelitische Stadt. Von Eljachba selbst wird nichts erzählt außer seinem Namen und seinem Platz in der Liste."
  fr:
    - "Schaalbon n’est connue que par un seul homme, « Éliachba, de Schaalbon », dans les deux listes des trente vaillants de David. Le gentilé renvoie à Schaalbim (Schaalabbin dans la liste des villes de Dan), ville de la vallée d’Ajalon où « les Amoréens voulurent rester » après la conquête jusqu’à ce que « la main de la maison de Joseph s’appesantit sur eux, et ils furent assujettis à un tribut », et qui se trouva plus tard dans le deuxième des douze districts de ravitaillement de Salomon avec Beth-Schémesch. Sur la carte, Schaalbon est traitée comme le même lieu que Schaalbim."
    - "Schaalbim est identifiée à Selbit, ruine sur une colline à environ 5 km au nord-ouest d’Ajalon (Yalo) au bord de la vallée, près du kibboutz qui reprit le nom de Sha‘alvim en 1951. L’identification repose sur le nom et la position ; l’unique fouille faite là, par E. L. Sukenik en 1949, a mis au jour une synagogue samaritaine d’environ le IVe ou le Ve siècle apr. J.-C. avec un sol de mosaïque, non la ville amoréenne ou israélite. D’Éliachba lui-même, on ne sait rien au-delà de son nom et de sa place dans la liste."
