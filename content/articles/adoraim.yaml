body:
  en:
    - "Adoraim was a town of the hills of Judah south-west of Hebron. The name, Adora in Greek, survives in Dura, a Palestinian town in the Hebron hills, and the identification is generally accepted. In the Bible it appears once, among the towns that Rehoboam fortified after the division of the kingdom: he “built cities for defence in Judah”, a list that runs through Bethlehem, Tekoa and the Shephelah and includes “Adoraim, and Lachish, and Azekah”, and ends “Zorah, and Aijalon, and Hebron, which are in Judah and in Benjamin fenced cities”."
    - "By the Hellenistic period Adora lay in Idumaea. When the Seleucid general Tryphon, having seized Jonathan, marched on Jerusalem, he went round by the way to Adora while Simon the Maccabee shadowed him with his army. Josephus relates that after the death of Antiochus VII John Hyrcanus took Adora and Marisa, cities of Idumaea, and made the Idumaeans accept circumcision and the Jewish law; and that the Roman proconsul Gabinius, in the 50s BC, rebuilt Adora among other ruined towns. Dura today lies in the Hebron Governorate of the West Bank."
  ru:
    - "Адораим — город в горах Иудеи к юго-западу от Хеврона. Его имя, по-гречески Адора, сохранилось в названии Дура — палестинского города в Хевронском нагорье, и это отождествление общепринято. В Библии он упомянут один раз, среди городов, которые укрепил Ровоам после разделения царства: он «обнес города в Иудее стенами», и список, проходящий через Вифлеем, Фекою и Шефелу, включает «Адораим, и Лахис, и Азеку», а кончается словами «и Цору, и Аиалон, и Хеврон, находившиеся в колене Иудином и Вениаминовом»."
    - "В эллинистическую эпоху Адора лежала в Идумее. Когда селевкидский полководец Трифон, захватив Ионафана, шёл на Иерусалим, он пошёл в обход, дорогой на Адору, а Симон Маккавей со своим войском шёл следом за ним. Иосиф Флавий рассказывает, что после смерти Антиоха VII Иоанн Гиркан взял Адору и Мариссу, города Идумеи, и заставил идумеев принять обрезание и иудейский закон, а римский проконсул Габиний в 50-х гг. до н. э. отстроил Адору среди других разрушенных городов. Дура сегодня находится в мухафазе Хеврон на Западном берегу."
  uk:
    - "Адораїм був містом в юдейських горах на південний захід від Хеврона. Назва, по-грецьки Адора, збереглася в Дурі, палестинському місті в хевронських горах, і це ототожнення загальноприйняте. У Біблії воно трапляється один раз, серед міст, які Ровоам укріпив після поділу царства: він «обвів міста в Юдеї мурами» — перелік, що йде через Вифлеєм, Текою та Шефелу й містить «Адораїм, і Лахис, і Азек», а закінчується словами «Зору, й Аялон, і Геброн, що були в поколїннї Юдиному та Беняминовому»."
    - "В елліністичну добу Адора лежала в Ідумеї. Коли селевкідський полководець Трифон, схопивши Йонатана, рушив на Єрусалим, він пішов в обхід дорогою на Адору, а Симон Маккавей стежив за ним зі своїм військом. Йосиф Флавій розповідає, що після смерті Антіоха VII Іван Гіркан узяв Адору та Маріссу, міста Ідумеї, і змусив ідумеян прийняти обрізання та юдейський закон; і що римський проконсул Габіній у 50-х рр. до н. е. відбудував Адору серед інших зруйнованих міст. Нині Дура лежить у мухафазі Хеврон на Західному березі."
  es:
    - "Adoraim era una ciudad de las colinas de Judá, al suroeste de Hebrón. El nombre, Adora en griego, pervive en Dura, ciudad palestina de las colinas de Hebrón, y la identificación se acepta generalmente. En la Biblia aparece una sola vez, entre las ciudades que Roboam fortificó tras la división del reino: «edificó ciudades para fortificar á Judá», lista que recorre Belén, Tecoa y la Sefelá e incluye «á Adoraim, y á Lachîs, y á Acechâ», y termina con «á Sora, y á Ajalón, y á Hebrón, que eran en Judá y en Benjamín, ciudades fuertes»."
    - "En la época helenística Adora estaba en Idumea. Cuando el general seléucida Trifón, tras apresar a Jonatán, marchó sobre Jerusalén, dio un rodeo por el camino de Adora mientras Simón el Macabeo lo seguía de cerca con su ejército. Josefo cuenta que, tras la muerte de Antíoco VII, Juan Hircano tomó Adora y Marisa, ciudades de Idumea, e hizo que los idumeos aceptaran la circuncisión y la ley judía; y que el procónsul romano Gabinio, en los años 50 a. C., reconstruyó Adora entre otras ciudades arruinadas. Dura se halla hoy en la gobernación de Hebrón, en Cisjordania."
  pt:
    - "Adoraim era uma cidade das colinas de Judá, a sudoeste de Hebrom. O nome, Adora em grego, sobrevive em Dura, uma cidade palestina nas colinas de Hebrom, e a identificação é geralmente aceita. Na Bíblia aparece uma só vez, entre as cidades que Roboão fortificou depois da divisão do reino: ele “construiu cidades para defesa em Judá”, numa lista que passa por Belém, Tecoa e a Sefelá e inclui “Adoraim, Laquis, Azeca”, terminando com “Zorá, Aijalom e Hebrom, que são cidades fortificadas em Judá e em Benjamim”."
    - "No período helenístico, Adora ficava na Iduméia. Quando o general selêucida Trifão, depois de capturar Jônatas, marchou sobre Jerusalém, deu a volta pelo caminho de Adora enquanto Simão, o macabeu, o seguia de perto com seu exército. Josefo relata que, depois da morte de Antíoco VII, João Hircano tomou Adora e Marisa, cidades da Iduméia, e fez os idumeus aceitarem a circuncisão e a lei judaica; e que o procônsul romano Gabínio, na década de 50 a.C., reconstruiu Adora entre outras cidades arruinadas. Dura fica hoje na Governadoria de Hebrom, na Cisjordânia."
  de:
    - "Adoraim war eine Stadt im Bergland von Juda südwestlich von Hebron. Der Name, griechisch Adora, lebt in Dura fort, einer palästinensischen Stadt im Hebroner Bergland, und die Gleichsetzung wird allgemein anerkannt. In der Bibel kommt er einmal vor, unter den Städten, die Rehabeam nach der Teilung des Reiches befestigte: Er „baute Städte zu Festungen in Juda“, eine Liste, die über Bethlehem, Tekoa und die Schefela führt und „Adoraim, Lachis, Aseka“ umfasst und mit „Zora, Ajalon und Hebron, welche waren die festen Städte in Juda und Benjamin“ endet."
    - "In hellenistischer Zeit lag Adora in Idumäa. Als der seleukidische Feldherr Tryphon, nachdem er Jonatan gefangen genommen hatte, gegen Jerusalem zog, nahm er den Weg über Adora, während Simon der Makkabäer ihn mit seinem Heer beschattete. Josephus berichtet, dass Johannes Hyrkanos nach dem Tod des Antiochos VII. Adora und Marisa, Städte Idumäas, einnahm und die Idumäer zwang, die Beschneidung und das jüdische Gesetz anzunehmen; und dass der römische Prokonsul Gabinius in den 50er Jahren v. Chr. Adora unter anderen zerstörten Städten wieder aufbaute. Dura liegt heute im Gouvernement Hebron im Westjordanland."
  fr:
    - "Adoraïm était une ville des collines de Juda, au sud-ouest d’Hébron. Le nom, Adora en grec, survit dans Dura, ville palestinienne des collines d’Hébron, et l’identification est généralement admise. Dans la Bible elle n’apparaît qu’une fois, parmi les villes que Roboam fortifia après la division du royaume : il « bâtit des villes fortes en Juda », liste qui passe par Bethléem, Tekoa et la Shéphéla et comprend « Adoraïm, Lakis, Azéka », pour s’achever sur « Tsorea, Ajalon et Hébron, qui étaient en Juda et en Benjamin, et il en fit des villes fortes »."
    - "À l’époque hellénistique, Adora se trouvait en Idumée. Lorsque le général séleucide Tryphon, ayant saisi Jonathan, marcha sur Jérusalem, il fit un détour par la route d’Adora tandis que Simon le Maccabée le suivait avec son armée. Josèphe rapporte qu’après la mort d’Antiochus VII, Jean Hyrcan prit Adora et Marisa, villes d’Idumée, et fit accepter aux Iduméens la circoncision et la loi juive ; et que le proconsul romain Gabinius, dans les années 50 av. J.-C., rebâtit Adora parmi d’autres villes ruinées. Aujourd’hui, Dura se trouve dans le gouvernorat d’Hébron, en Cisjordanie."
  it:
    - "Adoraim era una città dei monti di Giuda a sud-ovest di Ebron. Il nome, Adora in greco, sopravvive in Dura, una città palestinese sui monti di Ebron, e l’identificazione è generalmente accettata. Nella Bibbia compare una sola volta, tra le città che Roboamo fortificò dopo la divisione del regno: «costruì delle città fortificate in Giuda», un elenco che passa per «Bethlehem, Etam, Tekoa» e la Sefela e comprende «Adoraim, Lakis, Azeka», e termina con «Tsorea, Ajalon ed Hebron, che erano in Giuda e in Beniamino, e ne fece delle città fortificate»."
    - "In epoca ellenistica Adora si trovava in Idumea. Quando il generale seleucide Trifone, dopo aver catturato Gionata, marciò su Gerusalemme, fece il giro per la via di Adora mentre Simone Maccabeo lo seguiva a distanza con il suo esercito. Giuseppe Flavio racconta che dopo la morte di Antioco VII Giovanni Ircano prese Adora e Maresa, città dell’Idumea, e costrinse gli Idumei ad accettare la circoncisione e la legge giudaica; e che il proconsole romano Gabinio, negli anni Cinquanta a.C., ricostruì Adora insieme ad altre città in rovina. Oggi Dura si trova nel governatorato di Ebron, in Cisgiordania."
  nl:
    - "Adoraïm was een stad in het bergland van Juda ten zuidwesten van Hebron. De naam, in het Grieks Adora, leeft voort in Dura, een Palestijnse stad in het bergland van Hebron, en de gelijkstelling wordt algemeen aanvaard. In de Bijbel komt zij eenmaal voor, onder de steden die Rehabeam na de deling van het koninkrijk versterkte: hij “bouwde steden tot vastigheden in Juda”, een lijst die loopt van Bethlehem en Tekoa door de Sefela en “Adoraim, en Lachis, en Azeka” omvat, en eindigt met “Zora, en Ajalon, en Hebron; dewelke in Juda en in Benjamin de vaste steden waren”."
    - "In de hellenistische tijd lag Adora in Idumea. Toen de Seleucidische veldheer Tryfon, na Jonatan gevangen te hebben genomen, naar Jeruzalem optrok, nam hij de weg langs Adora, terwijl Simon de Makkabeeër hem met zijn leger op de hielen volgde. Josephus vertelt dat Johannes Hyrcanus na de dood van Antiochus VII Adora en Marisa, steden van Idumea, innam en de Idumeeërs de besnijdenis en de Joodse wet liet aannemen; en dat de Romeinse proconsul Gabinius in de jaren vijftig v.Chr. Adora samen met andere verwoeste steden herbouwde. Dura ligt tegenwoordig in het gouvernement Hebron op de Westelijke Jordaanoever."
  pl:
    - "Adoraim było miastem wzgórz judzkich na południowy zachód od Hebronu. Nazwa, po grecku Adora, przetrwała w nazwie Dura, palestyńskiego miasta w górach Hebronu, a to utożsamienie jest powszechnie przyjęte. W Biblii pojawia się raz, wśród miast, które Roboam umocnił po podziale królestwa: „pobudował miasta obronne w Judzie” — lista biegnie przez Betlejem, Tekoa i Szefelę i obejmuje „Adoraim, i Lachis, i Aseka”, a kończy się słowami „Sora, i Ajalon, i Hebron, które były w Judzie i w pokoleniu Benjaminowem miasta obronne”."
    - "W okresie hellenistycznym Adora leżała w Idumei. Gdy seleucydzki wódz Tryfon, pojmawszy Jonatana, ruszył na Jerozolimę, obszedł ją drogą na Adorę, a Szymon Machabeusz podążał za nim ze swoim wojskiem. Józef Flawiusz opowiada, że po śmierci Antiocha VII Jan Hirkan zdobył Adorę i Maresę, miasta Idumei, i kazał Idumejczykom przyjąć obrzezanie i prawo żydowskie, a rzymski prokonsul Gabiniusz w latach pięćdziesiątych p.n.e. odbudował Adorę wśród innych zburzonych miast. Dura leży dziś w muhafazie Hebron na Zachodnim Brzegu."
  cs:
    - "Adóraim bylo město v judských horách jihozápadně od Hebronu. Jméno, řecky Adora, se zachovalo v Dúře, palestinském městě v hebronských horách, a ztotožnění je všeobecně přijímáno. V Bibli se objevuje jednou, mezi městy, která Rechabeám opevnil po rozdělení království: „vzdělal města hrazená v Judstvu“, seznam vede přes Betlém, Tekoa a Šefelu a zahrnuje „Adoraim, Lachis a Azeka“ a končí „Zaraha, Aialon a Hebron, kteráž byla v pokolení Judově a Beniaminově města hrazená“."
    - "V helénistickém období ležela Adora v Idumeji. Když seleukovský vojevůdce Tryfón, poté co zajal Jonatana, táhl na Jeruzalém, šel oklikou po cestě do Adory, zatímco ho Šimon Makabejský se svým vojskem sledoval. Josephus Flavius vypráví, že po smrti Antiocha VII. dobyl Jan Hyrkán Adoru a Marisu, města Idumeje, a přinutil Idumejce přijmout obřízku a židovský zákon; a že římský prokonzul Gabinius v 50. letech př. n. l. mezi jinými zničenými městy znovu vystavěl Adoru. Dúra leží dnes v hebronském guvernorátu na Západním břehu."
