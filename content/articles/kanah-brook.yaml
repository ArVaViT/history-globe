# Overview article (ADR 0007). Mainstream facts only; the brook Kanah is identified with Wadi Qana as is usual; the Yarkon alternative is noted; not the town of Kanah in Asher.
id: kanah-brook
place: a373106
title:
  en: "Brook Kanah"
  ru: "Поток Кана"
  uk: "Потік Кана"
  es: "Arroyo de Caná"
  pt: "Ribeiro de Caná"
  de: "Bach Kana"
  fr: "Torrent de Kana"
  pl: "Potok Kana"
  it: "Torrente Cana"
  nl: "Beek Kana"
  cs: "Potok Kána"
  sv: "Kanabäcken"
  nb: "Kana-bekken"
  tl: "Batis ng Cana"
  da: "Bækken Kana"
body:
  en:
    - "The brook Kanah, “brook of reeds”, formed part of the boundary between Ephraim and Manasseh in the western hills. Joshua says of Ephraim's border that it “went out from Tappuah westward unto the river Kanah; and the goings out thereof were at the sea”, and of Manasseh's that “the coast descended unto the river Kanah, southward of the river: these cities of Ephraim are among the cities of Manasseh: the coast of Manasseh also was on the north side of the river”. The stream thus divided the two tribes of Joseph on its way to the Mediterranean, with a few towns of Ephraim lying on Manasseh's side. It is not the town of Kanah in Asher."
    - "It is usually identified with Wadi Qana, a valley that rises in the hills south-west of Nablus and runs west to join the Yarkon, which reaches the sea at Tel Aviv; some take the Kanah's lower course to be the Yarkon itself. The Bible names it only in these two border descriptions. Today Wadi Qana is a nature reserve in the West Bank, with springs, old orchards and the lands of the Palestinian village of Deir Istiya, and Israeli settlements on the ridges above."
  ru:
    - "Поток Кана, «поток тростников», был частью границы между Ефремом и Манассией в западных горах. О границе Ефрема книга Иисуса Навина говорит: «от Таппуаха идет предел к морю, к потоку Кане, и оканчивается морем», а о границе Манассии: «Отсюда предел нисходит к потоку Кане, с южной стороны потока. Города сии принадлежат Ефрему, хотя находятся среди городов Манассии», а предел Манассии шёл по северной стороне потока. Поток, таким образом, разделял два колена Иосифовых на пути к Средиземному морю, и несколько городов Ефрема лежали на стороне Манассии. Это не город Кана в уделе Асира."
    - "Его обычно отождествляют с Вади-Кана, долиной, которая начинается в горах к юго-западу от Наблуса и идёт на запад, к Яркону, впадающему в море у Тель-Авива; некоторые считают нижним течением Каны сам Яркон. Библия называет поток только в этих двух описаниях границ. Сегодня Вади-Кана — заповедник на Западном берегу с источниками, старыми садами и землями палестинской деревни Дейр-Истия, а на гребнях над ним стоят израильские поселения."
  uk:
    - "Потік Кана, «потік очерету», утворював частину межі між Єфремом і Манасією в західних пагорбах. Книга Ісуса Навина каже про межу Єфрема, що вона йде «Від Таппуаха ... на захід сонця до річки Кана і кіньчиться над морем», а про межу Манасії: «Далїй йде гряниця до Кана-річки, на полуднє від річки. Сї городи належать до Ефраїміїв, хоч лежать між містами Манассієвими, а потім іде гряниця Манассієва на північ від річки». Отже, потік ділив два коліна Йосипа на шляху до Середземного моря, з кількома єфремськими містами на боці Манасії. Це не місто Кана в Асирі."
    - "Його зазвичай ототожнюють із Ваді-Кана, долиною, що починається в пагорбах на південний захід від Наблуса й тече на захід, щоб злитися з Яркном, який досягає моря в Тель-Авіві; дехто вважає, що нижня течія Кани — це сам Яркон. Біблія називає його лише в цих двох описах меж. Сьогодні Ваді-Кана — заповідник на Західному березі, з джерелами, старими садами й землями палестинського села Дейр-Істія та ізраїльськими поселеннями на хребтах над ним."
  es:
    - "El arroyo de Caná, «arroyo de cañas», formaba parte de la frontera entre Efraín y Manasés en las colinas occidentales. Josué dice del límite de Efraín que «de Tappua torna este término hacia la mar al arroyo de Cana, y sale á la mar», y del de Manasés que «desciende este término al arroyo de Cana, hacia el mediodía del arroyo. Estas ciudades de Ephraim están entre las ciudades de Manasés: y el término de Manasés es desde el norte del mismo arroyo». La corriente dividía así las dos tribus de José en su camino hacia el Mediterráneo, con unas pocas ciudades de Efraín en el lado de Manasés. No es la población de Caná en Aser."
    - "Suele identificarse con el Wadi Qana, un valle que nace en las colinas al suroeste de Nablus y corre al oeste para unirse al Yarkón, que llega al mar en Tel Aviv; algunos toman el curso inferior del Caná por el propio Yarkón. La Biblia lo nombra solo en estas dos descripciones de frontera. Hoy el Wadi Qana es una reserva natural en Cisjordania, con manantiales, viejos huertos y las tierras de la aldea palestina de Deir Istiya, y asentamientos israelíes en las lomas de arriba."
  pt:
    - "O ribeiro de Caná, “ribeiro de canas”, fazia parte da fronteira entre Efraim e Manassés nas colinas ocidentais. Josué diz da fronteira de Efraim que “De Tapua a fronteira seguiu para o oeste até o ribeiro de Caná; e terminou no mar”, e da de Manassés que “A fronteira descia até o ribeiro de Caná, ao sul do ribeiro. Estas cidades pertenciam a Efraim entre as cidades de Manassés. A fronteira de Manassés ficava no lado norte do ribeiro, e terminava no mar”. O riacho dividia assim as duas tribos de José em seu caminho para o Mediterrâneo, com algumas cidades de Efraim situadas do lado de Manassés. Não é a cidade de Caná em Aser."
    - "É usualmente identificado com o uádi Qana, um vale que nasce nas colinas a sudoeste de Nablus e corre para oeste para se juntar ao Yarkon, que chega ao mar em Tel Aviv; alguns tomam o curso inferior do Caná como o próprio Yarkon. A Bíblia o nomeia só nessas duas descrições de fronteira. Hoje o uádi Qana é uma reserva natural na Cisjordânia, com fontes, velhos pomares e as terras da aldeia palestina de Deir Istiya, e povoados israelenses nas cristas acima."
  de:
    - "Der Bach Kana, „Rohrbach“, bildete einen Teil der Grenze zwischen Ephraim und Manasse im westlichen Bergland. Josua sagt von Ephraims Grenze: „von Thappuah geht sie abendwärts zum Bach Kana; und ihr Ende ist am Meer“, und von der Manasses: „darnach kommt sie herab zum Bach Kana zur Mittagsseite des Bachs, die Städte daselbst sind Ephraims unter den Städten Manasses; die Grenze Manasses aber geht weiter an der Mitternachtseite des Baches und endet am Meer“. Der Bach trennte also die beiden Stämme Josefs auf seinem Weg zum Mittelmeer, wobei einige Städte Ephraims auf Manasses Seite lagen. Er ist nicht die Stadt Kana in Asser."
    - "Er wird meist mit dem Wadi Qana gleichgesetzt, einem Tal, das in den Bergen südwestlich von Nablus beginnt und nach Westen zum Jarkon läuft, der bei Tel Aviv das Meer erreicht; manche halten den Unterlauf des Kana für den Jarkon selbst. Die Bibel nennt ihn nur in diesen beiden Grenzbeschreibungen. Heute ist das Wadi Qana ein Naturreservat im Westjordanland, mit Quellen, alten Obstgärten und dem Land des palästinensischen Dorfes Deir Istija und israelischen Siedlungen auf den Höhen darüber."
  fr:
    - "Le torrent de Kana, « torrent des roseaux », faisait partie de la frontière entre Éphraïm et Manassé dans les collines occidentales. Josué dit de la frontière d’Éphraïm : « De Tappuach elle allait vers l’occident au torrent de Kana, pour aboutir à la mer », et de celle de Manassé : « La limite descendait au torrent de Kana, au midi du torrent. Ces villes étaient à Éphraïm, au milieu des villes de Manassé. La limite de Manassé au nord du torrent aboutissait à la mer. » Le cours d’eau séparait ainsi les deux tribus de Joseph dans sa course vers la Méditerranée, quelques villes d’Éphraïm se trouvant du côté de Manassé. Ce n’est pas la ville de Kana en Aser."
    - "On l’identifie d’ordinaire à l’oued Qana, une vallée qui naît dans les collines au sud-ouest de Naplouse et court vers l’ouest pour rejoindre le Yarkon, qui atteint la mer à Tel-Aviv ; certains prennent le cours inférieur du Kana pour le Yarkon lui-même. La Bible ne le nomme que dans ces deux descriptions de frontière. Aujourd’hui, l’oued Qana est une réserve naturelle de Cisjordanie, avec des sources, de vieux vergers et les terres du village palestinien de Deir Istiya, et des colonies israéliennes sur les crêtes au-dessus."
  pl:
    - "Potok Kana, „potok trzcin”, tworzył część granicy między Efraimem a Manassesem we wzgórzach zachodnich. Jozue mówi o granicy Efraima, że „Od Tafua bieży ta granica ku zachodowi do potoku Kana, a kończy się przy morzu”, a o granicy Manassesa: „bieży ta granica do potoku Kana na południe tegoż potoku; a miasta Efraimitów są między miasty Manasesowemi; ale granica Manasesowa idzie od północy onego potoku”. Strumień dzielił więc oba pokolenia Józefa w drodze do Morza Śródziemnego, a kilka miast Efraima leżało po stronie Manassesa. Nie jest to miasto Kana w Aszerze."
    - "Utożsamia się go zwykle z Wadi Kana, doliną wznoszącą się we wzgórzach na południowy zachód od Nablusu i biegnącą na zachód do połączenia z Jarkonem, który wpada do morza w Tel Awiwie; niektórzy biorą dolny bieg Kany za sam Jarkon. Biblia wymienia go tylko w tych dwóch opisach granic. Dziś Wadi Kana jest rezerwatem przyrody na Zachodnim Brzegu, ze źródłami, starymi sadami i gruntami palestyńskiej wsi Dajr Istija oraz izraelskimi osiedlami na grzbietach powyżej."
  it:
    - "Il torrente Cana, «torrente delle canne», faceva parte del confine fra Efraim e Manasse sulle colline occidentali. Giosuè dice del confine di Efraim che «da Tappuah il confine andava verso occidente fino al torrente di Kana, per far capo al mare», e di quello di Manasse che «il confine scendeva al torrente di Kana, a sud del torrente, presso città che appartenevano ad Efraim in mezzo alle città di Manasse; ma il confine di Manasse era dal lato nord del torrente». Il corso d’acqua divideva dunque le due tribù di Giuseppe nel suo cammino verso il Mediterraneo, con alcune città di Efraim sul lato di Manasse. Non è la città di Cana in Aser."
    - "È di solito identificato con il Wadi Qana, una valle che nasce sulle colline a sud-ovest di Nablus e corre a ovest per unirsi allo Yarkon, che raggiunge il mare a Tel Aviv; alcuni ritengono che il corso inferiore del Cana sia lo stesso Yarkon. La Bibbia lo nomina solo in queste due descrizioni di confine. Oggi il Wadi Qana è una riserva naturale in Cisgiordania, con sorgenti, antichi frutteti e le terre del villaggio palestinese di Deir Istiya, e insediamenti israeliani sulle dorsali sopra."
  nl:
    - "De beek Kana, “beek van riet”, vormde een deel van de grens tussen Efraïm en Manasse in de westelijke heuvels. Jozua zegt van Efraïms grens dat “gaat deze landpale westwaarts naar de beek Kana, en haar uitgangen zijn aan de zee”, en van die van Manasse dat “komt de landpale af naar de beek Kana tegen het zuiden der beek. Deze steden zijn van Efraim in het midden der steden van Manasse; en de landpale van Manasse is aan het noorden der beek”. De stroom scheidde dus de twee stammen van Jozef op weg naar de Middellandse Zee, met enkele steden van Efraïm aan Manasses kant. Het is niet de stad Kana in Aser."
    - "Zij wordt gewoonlijk vereenzelvigd met de Wadi Qana, een dal dat in de heuvels ten zuidwesten van Nablus ontspringt en westwaarts loopt om zich bij de Yarkon te voegen, die bij Tel Aviv de zee bereikt; sommigen houden de benedenloop van de Kana voor de Yarkon zelf. De Bijbel noemt haar alleen in deze twee grensbeschrijvingen. Nu is de Wadi Qana een natuurreservaat op de Westoever, met bronnen, oude boomgaarden en het land van het Palestijnse dorp Deir Istiya, en Israëlische nederzettingen op de bergruggen erboven."
  cs:
    - "Potok Kána, „potok rákosí“, tvořil část hranice mezi Efrajimem a Manasesem v západních horách. Jozue praví o hranici Efrajimově, že „Od Tafue meze jde k moři ku potoku Kána, a skonává se při moři“, a o hranici Manasesově: „Odkudž sstupuje pomezí ku potoku Kána, na poledne tomu potoku, a tu jsou města Efraimova u prostřed měst Manassesových; pomezí pak Manassesovo jest na půlnoci toho potoka“. Potok tak dělil dva kmeny Josefovy na cestě ke Středozemnímu moři, s několika městy Efrajimovými ležícími na straně Manasesově. Není to město Kána v Ašeru."
    - "Obvykle se ztotožňuje s Wádí Qána, údolím pramenícím v horách jihozápadně od Nábulusu a tekoucím na západ k Jarkonu, který dosahuje moře u Tel Avivu; někteří pokládají dolní tok Kány za samotný Jarkon. Bible jej jmenuje jen v těchto dvou popisech hranic. Dnes je Wádí Qána přírodní rezervací na Západním břehu, s prameny, starými sady a pozemky palestinské vesnice Dejr Istíja a izraelskými osadami na hřebenech nad ní."
  sv:
    - "Kanabäcken, ”vassbäcken”, utgjorde en del av gränsen mellan Efraim och Manasse i västra bergen. Josua säger om Efraims gräns: ”Från Tappua gick gränsen västerut till Kanabäcken och gick sedan ut vid havet”, och om Manasses: ”gränsen gick vidare ned till Kanabäcken, söder om bäcken; men städerna där tillföllo Efraim, fastän de lågo bland Manasse städer. Manasse gräns gick vidare norr om bäcken”. Bäcken delade alltså Josefs båda stammar på sin väg till Medelhavet, med några städer i Efraim belägna på Manasses sida. Den är inte staden Kana i Asher."
    - "Den identifieras vanligen med Wadi Qana, en dal som tar sin början i bergen sydväst om Nablus och löper västerut för att förena sig med Yarkon, som når havet vid Tel Aviv; vissa menar att Kanas nedre lopp är själva Yarkon. Bibeln nämner den bara i dessa två gränsbeskrivningar. I dag är Wadi Qana ett naturreservat på Västbanken, med källor, gamla fruktodlingar och den palestinska byn Deir Istiyas marker, och med israeliska bosättningar på åsarna ovanför."
  nb:
    - "Kana-bekken, «sivets bekk», dannet en del av grensen mellom Efraim og Manasse i åsene i vest. Josva sier om Efraims grense: «Fra Tappuah gikk grensen vestover til Kana-bekken og endte ute ved havet», og om Manasses grense: «Så gikk grensen ned til Kana-bekken, sønnenfor bekken; men byene der tilfalt Efra'im, enda de lå mellem Manasses byer. Derfra gikk Manasses grense nordenfor bekken». Bekken delte altså de to Josef-stammene på vei til Middelhavet, med noen få byer i Efraim liggende på Manasses side. Den er ikke byen Kana i Asjer."
    - "Den identifiseres vanligvis med Wadi Qana, en dal som begynner i åsene sørvest for Nablus og løper vestover og forener seg med Yarkon, som når havet ved Tel Aviv; noen mener at Kanas nedre løp er selve Yarkon. Bibelen nevner den bare i disse to grensebeskrivelsene. I dag er Wadi Qana et naturreservat på Vestbredden, med kilder, gamle frukthager og jordene til den palestinske landsbyen Deir Istiya, og israelske bosetninger på åsryggene ovenfor."
  tl:
    - "Ang batis ng Cana, “batis ng mga tambo”, ay bahagi ng hangganan sa pagitan ng Ephraim at Manases sa mga kanlurang burol. Sinasabi ni Josue tungkol sa hangganan ng Ephraim: “Mula sa Tappua ay patuloy ang hangganan sa dakong kalunuran sa batis ng Cana: at ang labasan niyaon ay sa dagat”, at tungkol sa hangganan ng Manases: “ang hangganan ay pababa hanggang sa batis ng Cana, na dakong timugan ng batis: ang mga bayang ito ay ukol sa Ephraim sa gitna ng mga bayan ng Manases: at ang hangganan ng Manases ay nasa dakong hilagaan ng batis”. Kaya hinati ng sapa ang dalawang lipi ni Jose sa daan nito tungo sa Dagat Mediteraneo, na may ilang bayan ng Ephraim sa panig ng Manases. Hindi ito ang bayan ng Cana sa Aser."
    - "Karaniwan itong kinikilala sa Wadi Qana, isang libis na nagsisimula sa mga burol sa timog-kanluran ng Nablus at dumadaloy sa kanluran upang sumali sa Yarkon, na umaabot sa dagat sa Tel Aviv; itinuturing ng ilan na ang Yarkon mismo ang ibabang daloy ng Cana. Pinangangalanan lamang ito ng Biblia sa dalawang paglalarawang ito ng hangganan. Ngayon ang Wadi Qana ay isang reserbang pangkalikasan sa West Bank, na may mga bukal, matatandang halamanan at lupain ng nayong Palestino ng Deir Istiya, at mga pamayanang Israeli sa mga tagaytay sa itaas."
  da:
    - "Bækken Kana, »rørenes bæk«, udgjorde en del af grænsen mellem Efraim og Manasse i vestbjergene. Josva siger om Efraims grænse: »Fra Thappua gaar Landemærket i Vester til Bækken Kana; og dets Udgang er til Havet«, og om Manasses: »Landemærket gaar ned til Bækken Kana, Sønden for Bækken; disse Stæder høre Efraim til midt iblandt Manasse Stæder; men Manasse Landemærke er Norden for Bækken«. Åen delte således Josefs to stammer på sin vej mod Middelhavet, idet nogle få af Efraims byer lå på Manasses side. Den er ikke byen Kana i Aser."
    - "Den identificeres sædvanligvis med Wadi Qana, en dal, der udspringer i højderne sydvest for Nablus og løber mod vest for at slutte sig til Yarkon, som når havet ved Tel Aviv; nogle mener, at Kanas nedre løb er selve Yarkon. Bibelen nævner den kun i disse to grænsebeskrivelser. I dag er Wadi Qana et naturreservat på Vestbredden, med kilder, gamle frugtplantager og den palæstinensiske landsby Deir Istiyas jord og israelske bosættelser på højderyggene ovenover."
scripture:
  - Josh.16.8
  - Josh.17.9-Josh.17.10
  - Josh.19.28
sources:
