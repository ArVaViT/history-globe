# Overview article (ADR 0007). Mainstream facts only; the brook Kanah is identified with Wadi Qana as is usual; the Yarkon alternative is noted; not the town of Kanah in Asher.
id: kanah-brook
place: a373106
title:
  en: "Brook Kanah"
  ru: "Поток Кана"
body:
  en:
    - "The brook Kanah, “brook of reeds”, formed part of the boundary between Ephraim and Manasseh in the western hills. Joshua says of Ephraim's border that it “went out from Tappuah westward unto the river Kanah; and the goings out thereof were at the sea”, and of Manasseh's that “the coast descended unto the river Kanah, southward of the river: these cities of Ephraim are among the cities of Manasseh: the coast of Manasseh also was on the north side of the river”. The stream thus divided the two tribes of Joseph on its way to the Mediterranean, with a few towns of Ephraim lying on Manasseh's side. It is not the town of Kanah in Asher."
    - "It is usually identified with Wadi Qana, a valley that rises in the hills south-west of Nablus and runs west to join the Yarkon, which reaches the sea at Tel Aviv; some take the Kanah's lower course to be the Yarkon itself. The Bible names it only in these two border descriptions. Today Wadi Qana is a nature reserve in the West Bank, with springs, old orchards and the lands of the Palestinian village of Deir Istiya, and Israeli settlements on the ridges above."
  ru:
    - "Поток Кана, «поток тростников», был частью границы между Ефремом и Манассией в западных горах. О границе Ефрема книга Иисуса Навина говорит: «от Таппуаха идет предел к морю, к потоку Кане, и оканчивается морем», а о границе Манассии: «Отсюда предел нисходит к потоку Кане, с южной стороны потока. Города сии принадлежат Ефрему, хотя находятся среди городов Манассии», а предел Манассии шёл по северной стороне потока. Поток, таким образом, разделял два колена Иосифовых на пути к Средиземному морю, и несколько городов Ефрема лежали на стороне Манассии. Это не город Кана в уделе Асира."
    - "Его обычно отождествляют с Вади-Кана, долиной, которая начинается в горах к юго-западу от Наблуса и идёт на запад, к Яркону, впадающему в море у Тель-Авива; некоторые считают нижним течением Каны сам Яркон. Библия называет поток только в этих двух описаниях границ. Сегодня Вади-Кана — заповедник на Западном берегу с источниками, старыми садами и землями палестинской деревни Дейр-Истия, а на гребнях над ним стоят израильские поселения."
scripture:
  - Josh.16.8
  - Josh.17.9-Josh.17.10
sources:
