body:
  en:
    - "Thebez was a town in the hill country of Manasseh, north-east of Shechem, where Abimelech, the son of Gideon who made himself king at Shechem, met his end. After he had destroyed Shechem, “went Abimelech to Thebez, and encamped against Thebez, and took it”, but the people shut themselves in a strong tower in the middle of the city; as he came up to the door “to burn it with fire”, “a certain woman cast a piece of a millstone upon Abimelech's head, and all to brake his skull”, and he had his armour-bearer kill him so that it would not be said a woman slew him. Generations later Joab expected David to remember the story: “did not a woman cast a piece of a millstone upon him from the wall, that he died in Thebez?”"
    - "Beyond this episode nothing is known of the town. Eusebius placed a village Thebes thirteen Roman miles from Neapolis (Nablus) on the road to Scythopolis (Beth-shean), and Thebez is usually identified with Tubas, whose name seems to echo it, about 15 km north-east of Nablus, though some doubt this because no remains of the biblical period have been found there; some have instead read Tirzah in the text, and the map shows that site, Tell el-Far'ah, as a second candidate. No ancient remains at Tubas have been excavated as Thebez. Tubas is today a Palestinian town, the centre of the Tubas governorate in the northern West Bank."
  ru:
    - "Тевец — город в горах Манассии к северо-востоку от Сихема, где нашёл свой конец Авимелех, сын Гедеона, сделавший себя царём в Сихеме. Разорив Сихем, «пошел Авимелех в Тевец и осадил Тевец и взял его», но жители заперлись в крепкой башне посреди города; когда он подошёл к дверям, «чтобы сжечь ее огнем», «одна женщина бросила обломок жернова на голову Авимелеху и проломила ему череп», и он велел оруженосцу убить себя, чтобы не сказали, что его убила женщина. Много лет спустя Иоав ждал, что Давид вспомнит этот случай: «не женщина ли бросила на него со стены обломок жернова и поразила его, и он умер в Тевеце?»"
    - "Кроме этого эпизода, о городе ничего не известно. Евсевий помещал селение Февы в тринадцати римских милях от Неаполя (Наблуса) по дороге в Скифополь (Беф-Сан), и Тевец обычно отождествляют с Тубасом, имя которого, по-видимому, перекликается с ним, примерно в 15 км к северо-востоку от Наблуса, хотя некоторые в этом сомневаются, потому что остатков библейского времени там не найдено; некоторые читают в тексте вместо него Фирцу, и на карте это место, Телль-эль-Фара, показано вторым кандидатом. Древние остатки в Тубасе как Тевец не раскапывались. Тубас сегодня — палестинский город, центр провинции Тубас на севере Западного берега."
  uk:
    - "Тевец був містом у гірській країні Манасії, на північний схід від Сихема, де загинув Авімелех, син Гедеона, що проголосив себе царем у Сихемі. Зруйнувавши Сихем, «двинув Абимелех у Тебез, обложив Тебез і звоював його», але люди зачинилися в міцній башті посеред міста; коли він підійшов до дверей, «щоб її підпалити», «кинула одна жінка йому на голову відломок камення жорнового, та й проломила йому черепа», і він звелів зброєносцеві вбити себе, щоб не казали, що його вбила жінка. Через покоління Йоав очікував, що Давид пригадає цю історію: «Чи не баба ж у Тебезї скинула верхнього каменя жорнового на його й він знайшов там смерть?»"
    - "Крім цього епізоду, про місто нічого не відомо. Євсевій розмістив село Фіви за тринадцять римських миль від Неаполя (Наблуса) на дорозі до Скіфополя (Бет-Шеана), а Тевец зазвичай ототожнюють із Тубасом, чия назва, здається, відлунює його, приблизно за 15 км на північний схід від Наблуса, хоча дехто в цьому сумнівається, бо решток біблійної доби там не знайдено; дехто натомість читав у тексті Тірцу, і мапа показує те місце, Телль-ель-Фарах, як другого кандидата. Жодних давніх решток у Тубасі не розкопано як Тевец. Тубас нині — палестинське місто, центр провінції Тубас на півночі Західного берега."
  es:
    - "Tebes era una ciudad de la región montañosa de Manasés, al noreste de Siquem, donde halló su fin Abimelec, el hijo de Gedeón que se hizo rey en Siquem. Tras destruir Siquem, «Abimelech se fué á Thebes; y puso cerco á Thebes, y tomóla», pero la gente se encerró en una torre fuerte en medio de la ciudad; cuando él llegó a la puerta «para pegarle fuego», «una mujer dejó caer un pedazo de una rueda de molino sobre la cabeza de Abimelech, y quebróle los cascos», y él hizo que su escudero lo matara para que no se dijera que una mujer lo había matado. Generaciones después, Joab esperaba que David recordara la historia: «¿no echó una mujer del muro un pedazo de una rueda de molino, y murió en Thebes?»"
    - "Aparte de este episodio, nada se sabe de la ciudad. Eusebio situó una aldea Tebes a trece millas romanas de Neápolis (Nablus) en el camino a Escitópolis (Bet-seán), y Tebes se identifica por lo común con Tubas, cuyo nombre parece hacerle eco, a unos 15 km al noreste de Nablus, aunque algunos lo dudan porque allí no se han hallado restos del período bíblico; algunos han leído en cambio Tirsa en el texto, y el mapa muestra ese sitio, Tell el-Far'ah, como segundo candidato. En Tubas no se han excavado restos antiguos como Tebes. Tubas es hoy una ciudad palestina, centro de la gobernación de Tubas, en el norte de Cisjordania."
  pt:
    - "Tebez era uma cidade na região montanhosa de Manassés, a nordeste de Siquém, onde Abimeleque, filho de Gideão, que se fizera rei em Siquém, encontrou seu fim. Depois de destruir Siquém, “Abimeleque foi a Tebes, acampou contra Tebes e a tomou”, mas o povo se trancou numa torre forte no meio da cidade; quando ele se aproximou da porta “para incendiá-la”, “Uma certa mulher atirou uma pedra superior de moinho na cabeça de Abimeleque, quebrando-lhe o crânio”, e ele mandou seu escudeiro matá-lo, para que não se dissesse que uma mulher o matara. Gerações depois, Joabe esperava que Davi se lembrasse da história: “Acaso uma mulher não jogou uma pedra superior de moinho sobre ele da muralha, de modo que ele morreu em Tebes?”"
    - "Além desse episódio, nada se sabe da cidade. Eusébio situou uma aldeia Tebes a treze milhas romanas de Neápolis (Nablus), na estrada para Citópolis (Bete-Seã), e Tebez é geralmente identificada com Tubas, cujo nome parece ecoá-la, a cerca de 15 km a nordeste de Nablus, embora alguns duvidem disso porque ali não se acharam vestígios do período bíblico; alguns leram Tirza no texto, e o mapa mostra esse sítio, Tell el-Far'ah, como segundo candidato. Nenhum vestígio antigo em Tubas foi escavado como Tebez. Tubas é hoje uma cidade palestina, centro da província de Tubas, no norte da Cisjordânia."
  de:
    - "Tebez war eine Stadt im Bergland Manasses, nordöstlich von Sichem, wo Abimelech, der Sohn Gideons, der sich in Sichem zum König gemacht hatte, sein Ende fand. Nachdem er Sichem zerstört hatte, zog Abimelech „gen Thebez und belagerte es und gewann es“; doch das Volk schloss sich in einem starken Turm mitten in der Stadt ein; als er sich der Tür des Turms näherte, „daß er ihn mit Feuer verbrannte“, geschah es: „Aber ein Weib warf einen Mühlstein Abimelech auf den Kopf und zerbrach ihm den Schädel“, und er ließ sich von seinem Waffenträger töten, damit man nicht sage, ein Weib habe ihn erschlagen. Generationen später erwartete Joab, dass David sich an die Geschichte erinnerte: „Warf nicht ein Weib einen Mühlstein auf ihn von der Mauer, daß er starb zu Thebez?“"
    - "Über diese Episode hinaus ist nichts über die Stadt bekannt. Eusebius setzte ein Dorf Thebes dreizehn römische Meilen von Neapolis (Nablus) an der Straße nach Skythopolis (Bet-Schean) an, und Tebez wird meist mit Tubas gleichgesetzt, dessen Name daran anzuklingen scheint, etwa 15 km nordöstlich von Nablus, obwohl manche das bezweifeln, weil dort keine Überreste aus biblischer Zeit gefunden wurden; manche haben im Text stattdessen Tirza gelesen, und die Karte zeigt diesen Ort, Tell el-Far'ah, als zweiten Kandidaten. Keine antiken Überreste in Tubas sind als Tebez ausgegraben worden. Tubas ist heute eine palästinensische Stadt, Zentrum des Gouvernements Tubas im nördlichen Westjordanland."
  fr:
    - "Thébets était une ville des collines de Manassé, au nord-est de Sichem, où Abimélec, fils de Gédéon qui se fit roi à Sichem, trouva sa fin. Après avoir détruit Sichem, « Abimélec marcha contre Thébets. Il assiégea Thébets, et s’en empara », mais les habitants s’enfermèrent dans une forte tour au milieu de la ville ; comme il s’approchait de la porte « pour y mettre le feu », « une femme lança sur la tête d’Abimélec un morceau de meule de moulin, et lui brisa le crâne », et il se fit tuer par son porteur d’armes pour qu’on ne dise pas qu’une femme l’avait tué. Des générations plus tard, Joab comptait que David se souvienne de l’histoire : « N’est-ce pas une femme qui lança sur lui du haut de la muraille un morceau de meule de moulin, et n’en est-il pas mort à Thébets ? »"
    - "On ne sait rien d’autre de la ville. Eusèbe plaçait un village Thèbes à treize milles romains de Néapolis (Naplouse) sur la route de Scythopolis (Beth-Schean), et Thébets est généralement identifiée à Tubas, dont le nom semble en garder l’écho, à environ 15 km au nord-est de Naplouse, bien que certains en doutent parce qu’on n’y a trouvé aucun vestige de l’époque biblique ; certains ont plutôt lu Thirtsa dans le texte, et la carte montre ce site, Tell el-Far’ah, comme second candidat. Aucun vestige antique de Tubas n’a été fouillé comme étant Thébets. Tubas est aujourd’hui une ville palestinienne, chef-lieu du gouvernorat de Tubas, dans le nord de la Cisjordanie."
  pl:
    - "Tebes było miastem w górach Manassesa, na północny wschód od Sychem, gdzie zakończył życie Abimelek, syn Gedeona, który ogłosił się królem w Sychem. Po zburzeniu Sychem „Potem szedł Abimelech do Tebes, a położywszy się przeciwko Tebes, dobył go”, ale ludzie zamknęli się w mocnej wieży pośrodku miasta; gdy dotarł do drzwi, „chciał ją spalić ogniem”, a „zrzuciła niewiasta niektóra sztukę kamienia od żarn na głowę Abimelechowę, i rozbiła wierzch głowy jego”, i kazał swemu giermkowi go zabić, by nie mówiono, że zabiła go kobieta. Pokolenia później Joab spodziewał się, że Dawid pamięta tę historię: „izali nie niewiasta zrzuciwszy nań sztukę kamienia młyńskiego z muru, tak że umarł w Tebes?”"
    - "Poza tym epizodem nic o mieście nie wiadomo. Euzebiusz umieścił wieś Tebes w odległości trzynastu mil rzymskich od Neapolis (Nablusu) przy drodze do Scytopolis (Bet-Szean), a Tebes utożsamia się zwykle z Tubas, którego nazwa zdaje się je przypominać, około 15 km na północny wschód od Nablusu, choć niektórzy w to wątpią, bo nie znaleziono tam pozostałości z okresu biblijnego; niektórzy czytali natomiast w tekście Tirsę, i mapa pokazuje to stanowisko, Tell el-Fara, jako drugiego kandydata. Żadne starożytne pozostałości w Tubas nie były badane wykopaliskowo jako Tebes. Tubas jest dziś miastem palestyńskim, ośrodkiem muhafazy Tubas na północy Zachodniego Brzegu."
  it:
    - "Tebes era una città sulle colline di Manasse, a nord-est di Sichem, dove Abimelech, il figlio di Gedeone che si fece re a Sichem, trovò la morte. Dopo aver distrutto Sichem, «Abimelec andò a Thebets, la cinse d’assedio e la prese», ma gli abitanti si chiusero in una forte torre in mezzo alla città; mentre si accostava alla porta «per appiccarvi il fuoco», «una donna gettò giù un pezzo di macina sulla testa di Abimelec e gli spezzò il cranio», ed egli si fece uccidere dal suo scudiero perché non si dicesse che l’aveva ammazzato una donna. Generazioni dopo Ioab si aspettava che Davide ricordasse la storia: «Non fu ella una donna che gli gettò addosso un pezzo di macina dalle mura, sì ch’egli morì a Thebets?»"
    - "Oltre a questo episodio non si sa nulla della città. Eusebio collocava un villaggio Thebes a tredici miglia romane da Neapoli (Nablus) sulla strada per Scitopoli (Bet-Scean), e Tebes è generalmente identificata con Tubas, il cui nome sembra richiamarla, a circa 15 km a nord-est di Nablus, benché alcuni ne dubitino perché lì non sono stati trovati resti del periodo biblico; alcuni hanno invece letto Tirza nel testo, e la mappa mostra quel sito, Tell el-Far’ah, come secondo candidato. Nessun resto antico a Tubas è stato scavato come Tebes. Tubas è oggi una città palestinese, centro del governatorato di Tubas nella Cisgiordania settentrionale."
  nl:
    - "Tebez was een stad in het bergland van Manasse, ten noordoosten van Sichem, waar Abimelech, de zoon van Gideon die zich in Sichem tot koning had gemaakt, zijn einde vond. Nadat hij Sichem had verwoest, “toog Abimelech naar Thebez, en hij legerde zich tegen Thebez, en nam haar in”, maar de bewoners sloten zich op in een sterke toren in het midden van de stad; toen hij tot aan de deur kwam “om dien met vuur te verbranden”, “een vrouw wierp een stuk van een molensteen op Abimelechs hoofd; en zij verpletterde zijn hersenpan”, en hij liet zich door zijn wapendrager doden zodat men niet zou zeggen dat een vrouw hem had gedood. Generaties later verwachtte Joab dat David zich het verhaal zou herinneren: “Wierp niet een vrouw een stuk van een molensteen op hem van den muur, dat hij te Thebez stierf?”"
    - "Buiten deze episode is niets van de stad bekend. Eusebius plaatste een dorp Thebes op dertien Romeinse mijlen van Neapolis (Nablus) aan de weg naar Scythopolis (Beth-Sean), en Tebez wordt gewoonlijk vereenzelvigd met Tubas, waarvan de naam eraan lijkt te herinneren, ongeveer 15 km ten noordoosten van Nablus, al betwijfelen sommigen dit omdat er geen resten uit de bijbelse tijd zijn gevonden; sommigen hebben in de tekst in plaats daarvan Tirza gelezen, en de kaart toont die plek, Tell el-Far’ah, als tweede kandidaat. In Tubas zijn geen antieke resten als Tebez opgegraven. Tubas is tegenwoordig een Palestijnse stad, het centrum van het gouvernement Tubas in het noordelijke deel van de Westelijke Jordaanoever."
  cs:
    - "Tebec bylo město v pohoří Manasesově, severovýchodně od Šekemu, kde skončil Abimelek, syn Gedeonův, který se v Šekemu učinil králem. Poté, co zničil Šekem, „odšel pak Abimelech do Tébes, a položil se u Tébes, i dobyl ho“, ale lid se zavřel v pevné věži uprostřed města; když přistoupil ke dveřím věže, „aby je zapálil ohněm“, „žena nějaká svrhla kus žernovu na hlavu Abimelechovu, a prorazila hlavu jeho“ a on dal svého zbrojnoše, aby ho zabil, aby se neříkalo, že ho zabila žena. O generace později očekával Joáb, že David si příběh připomene: „Zdali ne žena, svrhši na něj kus žernovu se zdi, tak že umřel v Tébes?“"
    - "Mimo tuto epizodu o městě nic nevíme. Eusebius klade vesnici Thebes třináct římských mil od Neapole (Nábulusu) na silnici ke Skythopoli (Bét-še'an) a Tebec se obvykle ztotožňuje s Tubásem, jehož jméno na něj zřejmě upomíná, asi 15 km severovýchodně od Nábulusu, i když někteří o tom pochybují, protože se tam nenašly pozůstatky z biblické doby; někteří v textu místo toho čtou Tirsu a mapa ukazuje tuto lokalitu, Tell el-Far'a, jako druhého kandidáta. Žádné starověké pozůstatky v Tubásu nebyly vykopány jako Tebec. Tubás je dnes palestinské město, středisko guvernorátu Tubás v severní části Západního břehu."
  sv:
    - "Tebes var en stad i Manasses bergsbygd, nordost om Shekem, där Avimelek, Gideons son som gjorde sig själv till kung i Shekem, mötte sitt slut. Sedan han hade förstört Shekem heter det: ”Och Abimelek drog åstad till Tebes och belägrade Tebes och intog det”, men folket stängde in sig i ett starkt torn mitt i staden; när han kom fram till porten ”för att bränna upp den i eld”, hände detta: ”Men en kvinna kastade en kvarnsten ned på Abimeleks huvud och bräckte så hans huvudskål”, och han lät sin vapenbärare döda sig så att det inte skulle sägas att en kvinna hade dödat honom. Generationer senare väntade sig Joav att David skulle minnas historien: ”Var det icke en kvinna som kastade en kvarnsten ned på honom från muren, så att han dödades, där i Tebes?”"
    - "Utöver denna episod är inget känt om staden. Eusebios placerade en by Thebes tretton romerska mil från Neapolis (Nablus) på vägen till Skytopolis (Bet-Shean), och Tebes identifieras vanligen med Tubas, vars namn tycks eka det, omkring 15 km nordost om Nablus, fast vissa tvivlar på detta eftersom inga lämningar från bibelns tid har hittats där; några har i stället läst Tirsa i texten, och kartan visar den platsen, Tell el-Far'ah, som en andra kandidat. Inga forntida lämningar i Tubas har grävts ut som Tebes. Tubas är i dag en palestinsk stad, centrum för Tubasguvernementet på norra Västbanken."
  nb:
    - "Tebes var en by i Manasses fjellland, nordøst for Sikem, der Abimelek, sønnen til Gideon som gjorde seg selv til konge i Sikem, fant sin ende. Etter at han hadde ødelagt Sikem, «drog Abimelek til Tebes, og han kringsatte byen og inntok den», men folket stengte seg inne i et sterkt tårn midt i byen; da han kom opp til inngangen «for å sette ild på det», var det «en kvinne som kastet en kvernsten ned på hans hode og knuste hans hjerneskall», og han lot våpenbæreren drepe seg, slik at det ikke skulle sies at en kvinne hadde slått ham ihjel. Generasjoner senere regnet Joab med at David ville huske historien: «Var det ikke en kvinne som kastet en kvernsten ned på ham fra muren i Tebes, så han døde?»"
    - "Utover denne episoden er ingenting kjent om byen. Eusebius plasserte en landsby Thebes tretten romerske mil fra Neapolis (Nablus) på veien til Skytopolis (Bet-Sjean), og Tebes identifiseres vanligvis med Tubas, hvis navn later til å ekkoe det, omkring 15 km nordøst for Nablus, selv om noen tviler på dette fordi det ikke er funnet levninger fra bibelsk tid der; noen har i stedet lest Tirsa i teksten, og kartet viser det stedet, Tell el-Far'ah, som en annen kandidat. Ingen eldgamle levninger i Tubas er utgravd som Tebes. Tubas er i dag en palestinsk by, sentrum i Tubas-guvernementet på det nordlige Vestbredden."
  tl:
    - "Ang Thebes ay isang bayan sa maburol na lupain ng Manases, sa hilagang-silangan ng Sichem, kung saan nagwakas si Abimelech, ang anak ni Gedeon na ginawang hari ang sarili sa Sichem. Matapos wasakin ang Sichem, “naparoon si Abimelech sa Thebes, at humantong ng laban sa Thebes, at sinakop”, ngunit ikinulong ng mga tao ang sarili sa isang matibay na moog sa gitna ng lunsod; nang lumapit siya sa pintuan “upang sunugin ng apoy”, “hinagis ng isang babae, ng isang pangibabaw na bato ng gilingan ang ulo ni Abimelech at nabasag ang kaniyang bungo”, at ipinapatay niya ang sarili sa tagadala ng kaniyang sandata upang hindi masabing babae ang pumatay sa kaniya. Makalipas ang mga salinlahi, inaasahan ni Joab na maaalala ni David ang kuwento: “hindi ba isang babae ang naghagis ng isang bato sa ibabaw ng gilingan sa kaniya mula sa kuta, na anopa't siya'y namatay sa Thebes?”"
    - "Maliban sa pangyayaring ito, wala nang nalalaman tungkol sa bayan. Inilagay ni Eusebio ang isang nayong Thebes labintatlong milyang Romano mula sa Neapolis (Nablus) sa daan patungong Scythopolis (Beth-sean), at ang Thebes ay karaniwang kinikilala sa Tubas, na ang pangalan ay tila umaalingawngaw dito, mga 15 km sa hilagang-silangan ng Nablus, bagaman nag-aalinlangan ang ilan dahil wala pang natagpuang labi ng panahon ng Biblia roon; binasa naman ng iba ang Tirsa sa teksto, at ipinakikita ng mapa ang pook na iyon, ang Tell el-Far'ah, bilang ikalawang kandidato. Walang sinaunang labi sa Tubas ang hinukay bilang Thebes. Ang Tubas ay bayang Palestino ngayon, ang sentro ng lalawigan ng Tubas sa hilagang Kanlurang Pampang."
  da:
    - "Tebes var en by i Manasses bjerge, nordøst for Sikem, hvor Abimelek, søn af Gideon, som gjorde sig selv til konge i Sikem, mødte sin død. Efter at han havde ødelagt Sikem: »Saa drog Abimelek til Thebez; og han lejrede sig mod Thebez og indtog den«, og folket lukkede sig inde i et stærkt tårn midt i byen; da han kom nær til døren »forat opbrænde det med Ild«, men »en Kvinde kastede et Stykke af en Møllesten paa Abimeleks Hoved og knuste hans Hovedpande«, og han lod sin våbendrager dræbe sig, for at man ikke skulle sige, at en kvinde dræbte ham. Generationer senere regnede Joab med, at David huskede historien: »kastede ej en Kvinde et Stykke at en Møllesten ned paa ham fra Muren, saa han døde i Thebez?«"
    - "Ud over denne episode vides intet om byen. Eusebios placerede en landsby Thebes tretten romerske mil fra Neapolis (Nablus) på vejen til Skythopolis (Bet-Sjan), og Tebes identificeres sædvanligvis med Tubas, hvis navn synes at give genlyd af det, omkring 15 km nordøst for Nablus, selv om nogle tvivler på dette, fordi der ikke er fundet rester fra bibelsk tid; nogle har i stedet læst Tirsa i teksten, og kortet viser det sted, Tell el-Far'ah, som en anden kandidat. Ingen oldtidsrester ved Tubas er blevet udgravet som Tebes. Tubas er i dag en palæstinensisk by, centrum for Tubas-guvernementet i det nordlige Vestbredden."
  sr:
    - "Тевес је био град у горју Манасијином, североисточно од Сихема, где је нашао свој крај Авимелех, син Гедеонов, који се учинио царем у Сихему. Пошто је разорио Сихем, „отиде Авимелех на Тевес, и стаде у логор код Тевеса, и узе га“, али су се људи затворили у јаку кулу усред града; када је дошао до врата, „да је запали огњем“, „једна жена баци комад жрвња на главу Авимелеху и разби му главу“, а он је дао свом штитоноши да га убије да се не би рекло да га је жена убила. Нараштаје касније Јоав је очекивао да ће Давид запамтити ту причу: „Није ли жена бацила на њ комад жрвња са зида, те погибе у Тевесу?“"
    - "Осим овог догађаја о граду се ништа не зна. Јевсевије је сместио село Тебес тринаест римских миља од Неапоља (Наблус) на путу за Скитопољ (Вет-Сан), а Тевес се обично поистовећује с Тубасом, чије име као да одјекује, око 15 км североисточно од Наблуса, мада неки сумњају у то јер онде нису пронађени остаци из библијског доба; неки су уместо тога у тексту читали Терсу, а карта приказује то налазиште, Тел ел Фара, као другог кандидата. Никакви древни остаци у Тубасу нису ископани као Тевес. Тубас је данас палестински град, средиште гувернората Тубас на северу Западне обале."
  hu:
    - "Tébéc a Manassé hegyvidékén fekvő város volt, Sikemtől északkeletre, ahol Abimélek, Gedeon fia, aki Sikemben királlyá tette magát, a végét lelte. Miután lerombolta Sikemet, „Abimélek pedig elment Thébesbe, és táborba szállott Thébes ellen, és bevette azt”, de a nép a város közepén lévő erős toronyba zárkózott; amikor az ajtóhoz közeledett, „hogy azt tűzzel égesse fel”, „egy asszony egy malomkődarabot gördített le Abimélek fejére, és bezúzta koponyáját”, és ő fegyverhordozójával megöletett magát, hogy ne mondják: asszony ölte meg. Nemzedékekkel később Joáb arra számított, hogy Dávid emlékezni fog a történetre: „Nemde nem egy asszony üté-é agyon a kőfalról egy malomkődarabbal és meghala Tébesben?”"
    - "Ezen az eseményen túl semmit sem tudunk a városról. Eusebius egy Thebes nevű falut Neapolisztól (Nábulusz) tizenhárom római mérföldre helyezett a Szkütopolisz (Bét-Seán) felé vezető úton, és Tébécet általában Túbásszal azonosítják, amelynek neve visszhangozni látszik, Nábulusztól mintegy 15 km-re északkeletre, bár egyesek kételkednek ebben, mert bibliai kori maradványokat nem találtak ott; egyesek ehelyett a szövegben Tircát olvasták, és a térkép ezt a helyet, a Tell el-Fár'át mutatja második jelöltként. Túbászon semmilyen ókori maradványt nem ástak ki Tébécként. Túbász ma palesztin város, az északi Ciszjordániában a Túbászi kormányzóság központja."
  fi:
    - "Tebes oli kaupunki Manassen vuoristoseudulla Sikemistä koilliseen, missä Abimelek, Gideonin poika, joka julistautui kuninkaaksi Sikemissä, kohtasi loppunsa. Tuhottuaan Sikemin ”Abimelek meni Teebekseen, asettui leiriin Teebestä vastaan ja valloitti sen”, mutta asukkaat sulkeutuivat kaupungin keskellä olevaan vahvaan torniin; kun hän tuli tornin ovelle ”polttaakseen sen tulella”, ”eräs nainen heitti jauhinkiven Abimelekin päähän ja murskasi hänen pääkallonsa”, ja hän käski asekantajansa surmata itsensä, ettei sanottaisi naisen tappaneen häntä. Sukupolvia myöhemmin Joab odotti Daavidin muistavan tarinan: ”Eikö nainen heittänyt muurilta jauhinkiviä hänen päällensä, niin että hän kuoli Teebeksessä?”"
    - "Tämän jakson ulkopuolella kaupungista ei tiedetä mitään. Eusebios sijoitti kylän nimeltä Thebes kolmentoista roomalaisen mailin päähän Neapolisista (Nablus) Skythopolikseen (Beet-Sean) johtavalle tielle, ja Tebes tunnistetaan yleensä Tubasiksi, jonka nimi näyttää kaikuvan sitä, noin 15 km Nablusista koilliseen, vaikka jotkut epäilevät tätä, koska siellä ei ole löydetty Raamatun ajan jäänteitä; jotkut ovat sen sijaan lukeneet tekstissä Tirsan, ja kartta näyttää tuon paikan, Tell el-Far'ahin, toisena ehdokkaana. Tubasista ei ole kaivettu esiin Tebekseksi tunnistettavia muinaisjäännöksiä. Tubas on nykyisin palestiinalaiskaupunki, Länsirannan pohjoisosan Tubasin kuvernementin keskus."
  vi:
    - "Thê-bết là một thị trấn trong miền núi Ma-na-se, đông bắc Si-chem, nơi A-bi-mê-léc, con của Ghê-đê-ôn và là kẻ đã tự lập làm vua ở Si-chem, gặp cái chết. Sau khi phá hủy Si-chem, “A-bi-mê-léc liền đi đánh Thê-bết, vây và chiếm lấy nó”, nhưng dân thành tự nhốt mình trong một cái tháp vững chắc giữa thành; khi hắn tiến tới cửa “đặng phóng hỏa”, “một người nữ ném thớt cối trên đầu A-bi-mê-léc làm bể sọ người”, và hắn bảo người mang binh khí đâm chết mình để người ta khỏi nói rằng một người nữ đã giết. Nhiều đời sau, Giô-áp đoán Đa-vít sẽ nhớ chuyện này: “Há chẳng phải một người nữ ở trên chót vách thành ném một thớt cối xuống trên người làm cho người chết tại Tê-bết sao?”"
    - "Ngoài biến cố này không biết gì thêm về thị trấn. Eusebius đặt một làng Thebes cách Nê-a-bô-li (Nablus) mười ba dặm La Mã trên đường đến Scythopolis (Bết-Sê-an), và Thê-bết thường được đồng nhất với Tubas, có tên dường như vang vọng tên cũ, cách Nablus khoảng 15 km về phía đông bắc, dù một số người nghi ngờ vì ở đó chưa tìm thấy di tích thời Kinh Thánh; một số người thay vào đó đọc Tiệt-sa trong bản văn, và bản đồ cho thấy địa điểm ấy, Tell el-Far'ah, như ứng viên thứ hai. Chưa có di tích cổ nào ở Tubas được khai quật như Thê-bết. Tubas ngày nay là một thị trấn Palestine, trung tâm của tỉnh Tubas ở bắc Bờ Tây."
  ro:
    - "Tebeț era o cetate din ținutul muntos al lui Manase, la nord-est de Sihem, unde și-a găsit sfârșitul Abimelec, fiul lui Ghedeon, care se făcuse rege la Sihem. După ce a distrus Sihemul, „s’a dus Avimeleh din Vetil Verit la Tivis, și l-a încunjurat și l-a luat”, dar locuitorii s-au închis într-un turn tare din mijlocul cetății; pe când se apropia de ușă „să-l aprinză să arză cu foc”, „o femeie a aruncat o bucată de piatră de râșniță preste capul lui Avimeleh, și i-a spart capul”, iar el și-a pus purtătorul de arme să-l ucidă, ca să nu se spună că l-a omorât o femeie. Generații mai târziu, Ioab se aștepta ca David să-și amintească povestea: nu a aruncat o femeie de pe zid o bucată de piatră de moară peste el, de a murit în Tebeț?"
    - "Dincolo de acest episod, nu se știe nimic despre cetate. Eusebiu a așezat un sat Thebes la treisprezece mile romane de Neapolis (Nablus), pe drumul spre Scitopole (Bet-Șean), iar Tebeț este identificat de obicei cu Tubas, al cărui nume pare să-l reia, la circa 15 km nord-est de Nablus, deși unii se îndoiesc de aceasta, pentru că acolo nu s-au găsit vestigii din epoca biblică; alții au citit în text Tirța, iar harta arată acel loc, Tell el-Far'ah, ca al doilea candidat. Nicio rămășiță antică de la Tubas nu a fost săpată ca Tebeț. Tubas este astăzi un oraș palestinian, centrul guvernoratului Tubas din nordul Cisiordaniei."
  bg:
    - "Тевец бил град в Манасиевата планинска област, североизточно от Сихем, където намерил края си Авимелех, синът на Гедеон, който се направил цар в Сихем. След като разрушил Сихем, „отиде Авимелех в Тевес та разположи стан против Тевес, и облада го“, но жителите се затворили в един крепък стълп всред града; когато той се приближил до вратата, „за да го изгори с огън“, „една жена хвърли част от воденичен камик на Авимелеховата глава та му строши темето“, и той накарал оръженосеца си да го убие, за да не се каже, че го е убила жена. Поколения по-късно Йоав очаквал, че Давид ще си спомни историята: „не хвърли ли една жена от стената част от воденичен камик върх него, та умря в Тевес?“"
    - "Извън този епизод нищо не се знае за града. Евсевий поставял село Тебес на тринадесет римски мили от Неапол (Наблус) по пътя за Скитопол (Бет-Сан), а Тевец обикновено се отъждествява с Тубас, чието име изглежда напомня за него, на около 15 км североизточно от Наблус, макар някои да се съмняват, понеже там не са намерени останки от библейския период; други вместо това четат в текста Тирца и картата показва това място, Тел ел-Фара, като втори кандидат. В Тубас не са разкопавани древни останки като Тевец. Днес Тубас е палестински град, център на губернаторство Тубас в северната част на Западния бряг."
