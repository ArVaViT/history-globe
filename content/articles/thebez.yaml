# Overview article (ADR 0007). Mainstream facts only; Tubas is the usual identification, the minor Tirzah candidate on the map is named; nothing excavated as Thebez.
id: thebez
place: a5d1690
title:
  en: "Thebez"
  ru: "Тевец"
body:
  en:
    - "Thebez was a town in the hill country of Manasseh, north-east of Shechem, where Abimelech, the son of Gideon who made himself king at Shechem, met his end. After he had destroyed Shechem, “went Abimelech to Thebez, and encamped against Thebez, and took it”, but the people shut themselves in a strong tower in the middle of the city; as he came up to the door “to burn it with fire”, “a certain woman cast a piece of a millstone upon Abimelech's head, and all to brake his skull”, and he had his armour-bearer kill him so that it would not be said a woman slew him. Generations later Joab expected David to remember the story: “did not a woman cast a piece of a millstone upon him from the wall, that he died in Thebez?”"
    - "Beyond this episode nothing is known of the town. Eusebius placed a village Thebes thirteen Roman miles from Neapolis (Nablus) on the road to Scythopolis (Beth-shean), and Thebez is generally identified with Tubas, whose name preserves it, about 15 km north-east of Nablus; some have instead read Tirzah in the text, and the map shows that site, Tell el-Far'ah, as a second candidate. No ancient remains at Tubas have been excavated as Thebez. Tubas is today a Palestinian town, the centre of the Tubas governorate in the northern West Bank."
  ru:
    - "Тевец — город в горах Манассии к северо-востоку от Сихема, где нашёл свой конец Авимелех, сын Гедеона, сделавший себя царём в Сихеме. Разорив Сихем, «пошел Авимелех в Тевец и осадил Тевец и взял его», но жители заперлись в крепкой башне посреди города; когда он подошёл к дверям, «чтобы сжечь ее огнем», «одна женщина бросила обломок жернова на голову Авимелеху и проломила ему череп», и он велел оруженосцу убить себя, чтобы не сказали, что его убила женщина. Много лет спустя Иоав ждал, что Давид вспомнит этот случай: «не женщина ли бросила на него со стены обломок жернова и поразила его, и он умер в Тевеце?»"
    - "Кроме этого эпизода, о городе ничего не известно. Евсевий помещал селение Февы в тринадцати римских милях от Неаполя (Наблуса) по дороге в Скифополь (Беф-Сан), и Тевец обычно отождествляют с Тубасом, сохранившим имя, примерно в 15 км к северо-востоку от Наблуса; некоторые читают в тексте вместо него Фирцу, и на карте это место, Телль-эль-Фара, показано вторым кандидатом. Древние остатки в Тубасе как Тевец не раскапывались. Тубас сегодня — палестинский город, центр провинции Тубас на севере Западного берега."
scripture:
  - Judg.9.50-Judg.9.54
  - 2Sam.11.21
sources:
