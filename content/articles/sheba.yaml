# Overview article (ADR 0007). Mainstream facts only; Sheba is placed in Yemen as most scholars do, and the Ethiopian and north-Arabian views are named as such.
id: sheba
place: a81ab85
title:
  en: "Sheba"
  ru: "Сава"
  uk: "Шева"
  es: "Seba"
  pt: "Sabá"
  de: "Scheba"
  fr: "Schéba"
body:
  en:
    - "Sheba is Saba, the kingdom of south-west Arabia, in the Yemen of today, with its capital Marib on the desert edge east of Sanaa, where the Wadi Adhanah leaves the mountains. Its own inscriptions, in the South Arabian script, begin in the eighth century BC; its rulers built the Great Dam of Marib to water the oasis and the temple of the moon-god Almaqah at Awam. Saba grew rich on frankincense and myrrh, carried by camel caravan up the incense road to Gaza and Damascus. Assyrian kings of the late eighth century record gifts from Itamra and Karibilu of Saba, names that match the Sabaean rulers Yitha'amar and Karib'il. Genesis lists a Sheba among the sons of Cush, of Joktan and of Keturah, as if the name reached across the Red Sea and north Arabia. Josephus made the queen a ruler of Egypt and Ethiopia, and the Ethiopian Kebra Nagast tells how Makeda bore Solomon's son Menelik."
    - "The queen of Sheba, hearing of Solomon's fame, “came to prove him with hard questions”, with camels bearing spices, “very much gold, and precious stones”; she gave him a hundred and twenty talents of gold, and “there came no more such abundance of spices as these”, and he gave her all her desire before she went home. Jesus called her the queen of the south, who “came from the uttermost parts of the earth to hear the wisdom of Solomon”."
    - "The prophets and psalms keep Sheba as the land of gold and incense: “the kings of Sheba and Seba shall offer gifts”, “to him shall be given of the gold of Sheba”; Isaiah sees “all they from Sheba” bringing gold and incense to Zion, Jeremiah asks what use is “incense from Sheba”, and Ezekiel counts the merchants of Sheba and Raamah, with “chief of all spices”, among Tyre's traders. Job knows the caravans of Sheba, and Sabean raiders carried off his oxen; Joel calls the Sabeans “a people far off”."
    - "Greek writers knew the Sabaeans as the richest of Arabs. From the first century BC the Himyarites rose in their place, and the final breach of the Marib dam in the sixth century AD is remembered in the Quran. Marib today lies in a war zone; in 2023 UNESCO inscribed the landmarks of the ancient kingdom of Saba, the dam, the Awam temple and others, on the World Heritage List and at once on the list of sites in danger. The Awam temple is still called Mahram Bilqis, after the queen's Arabic name."
  ru:
    - "Сава — это Саба, царство юго-западной Аравии, в нынешнем Йемене, со столицей Мариб на краю пустыни к востоку от Саны, там, где Вади-Азана выходит из гор. Её собственные надписи южноаравийским письмом начинаются в VIII веке до н. э.; её правители построили Великую плотину Мариба, чтобы орошать оазис, и храм лунного бога Алмакаха в Аваме. Саба богатела на ладане и смирне, которые верблюжьи караваны везли по дороге благовоний к Газе и Дамаску. Ассирийские цари конца VIII века записывают дары Итамры и Карибилу из Сабы — имена, совпадающие с сабейскими правителями Йасаамаром и Карибилем. Книга Бытия называет Шеву среди сынов Хуша, Иоктана и Хеттуры, словно имя дотянулось через Красное море и северную Аравию. Иосиф Флавий сделал царицу правительницей Египта и Эфиопии, а эфиопская «Кебра Нагаст» рассказывает, как Македа родила от Соломона сына Менелика."
    - "Царица Савская, услышав о славе Соломона, «пришла испытать его загадками», с верблюдами, навьюченными благовониями, «великим множеством золота и драгоценными камнями»; она подарила ему сто двадцать талантов золота, и «никогда еще не приходило такого множества благовоний», а он дал ей всё, чего она желала, прежде чем она вернулась домой. Иисус назвал её царицей южной, которая «приходила от пределов земли послушать мудрости Соломоновой»."
    - "Пророки и псалмы хранят Саву как землю золота и ладана: «цари Аравии и Савы принесут дары», «будут давать ему от золота Аравии»; Исаия видит, как «все они из Савы придут» с золотом и ладаном в Сион, Иеремия спрашивает, к чему «ладан, который идет из Савы», а Иезекииль считает купцов из Савы и Раемы, с «лучшими благовониями», среди торговых партнёров Тира. Иов знает «пути Савейские», а Савеяне угнали его волов; Иоиль знает Савеев как народ отдалённый."
    - "Греческие писатели знали Сабеев как богатейших из арабов. С I века до н. э. на их место поднялись Химьяриты, а окончательный прорыв Марибской плотины в VI веке н. э. помнит Коран. Мариб сегодня лежит в зоне войны; в 2023 году ЮНЕСКО внесла памятники древнего царства Саба — плотину, храм Авам и другие — в список Всемирного наследия и сразу же в список объектов под угрозой. Храм Авам до сих пор зовут Махрам-Билкис, по арабскому имени царицы."
  uk:
    - "Шева — це Саба, царство на південному заході Аравії, у нинішньому Ємені, зі столицею Марибом на краю пустелі на схід від Сани, там, де ваді Адханах виходить із гір. Його власні написи, виконані південноаравійським письмом, починаються з VIII ст. до н. е.; його володарі збудували Велику греблю в Марибі, щоб зрошувати оазу, і храм бога місяця Алмака в Авамі. Саба розбагатіла на ладані та смирні, які верблюжими караванами везли ладановим шляхом до Гази й Дамаска. Ассирійські царі кінця VIII ст. до н. е. згадують дари від Ітамри та Карібілу з Саби — імена, що збігаються з іменами сабейських володарів Ітха'амара й Карібіла. Книга Буття згадує Шеву серед синів Куша, Йоктана й Хетури, наче це ім'я сягало за Червоне море й до північної Аравії. Йосиф Флавій зробив царицю володаркою Єгипту й Ефіопії, а ефіопська «Кебра Нагаст» розповідає, як Македа народила Соломонового сина Менеліка."
    - "Цариця Шеви, почувши про славу Соломона, «прибула вона випробувати його загадками», з верблюдами, що несли пахощі, «премного золота й дорогоцїнного каміння»; вона подарувала йому сто двадцять талантів золота, і «нїколи ще не приходило стільки пахощів, як подарувала цариця Сабська», а він дав їй усе, чого вона побажала, перш ніж вона повернулася додому. Ісус назвав її полуденною царицею, яка «прийшла з найдальших країн землї слухати премудростї Соломонової»."
    - "Пророки й псалми зберігають Шеву як край золота й ладану: «царі Шеви і Севи» принесуть дарунки, «давати муть йому золото із Шеви»; Ісая бачить, що «з Саби» принесуть золото й ладан до Сіону, Єремія питає, навіщо йому «кадило з Себи», а Єзекіїль зараховує купців Шеви та Раами, з їхніми «найлучшими пахощами», до торговців Тіру. Йов знає каравани Шеви, а сабейські напасники забрали його волів; у Йоїла сини Юди продані «Сабіям, народові далекому»."
    - "Грецькі автори знали сабеїв як найбагатших з арабів. З I ст. до н. е. на їхнє місце піднялися гімʼяріти, а остаточний прорив марибської греблі у VI ст. н. е. згадується в Корані. Сьогодні Маріб лежить у зоні війни; 2023 року ЮНЕСКО внесла пам'ятки давнього царства Саба — греблю, храм в Авамі та інші — до Списку всесвітньої спадщини й одразу до списку об'єктів під загрозою. Храм в Авамі досі називають Махрам-Білкіс — за арабським ім'ям цариці."
  es:
    - "Seba es Saba, reino del suroeste de Arabia (hoy Yemen), con capital en Marib, al este de Saná, en el borde del desierto, donde el Wadi Adhanah sale de las montañas. Sus inscripciones sudarábigas comienzan en el siglo VIII a. C.; sus gobernantes construyeron la Gran Presa de Marib para regar el oasis y el templo del dios luna Almaqah en Awam. Saba se enriqueció con incienso y mirra, en caravanas de camellos por la ruta del incienso a Gaza y Damasco. Reyes asirios de fines del siglo VIII registran regalos de Itamra y Karibilu de Saba, nombres que coinciden con los gobernantes sabeos Yitha'amar y Karib'il. El Génesis da un Seba entre los hijos de Cus, Joctán y Cetura, como si el nombre llegara al otro lado del mar Rojo y al norte de Arabia. Josefo hizo de la reina gobernante de Egipto y Etiopía, y el Kebra Nagast etíope cuenta que Makeda dio a luz a Menelik, hijo de Salomón."
    - "La reina de Seba, al oír la fama de Salomón, «vino á probarle con preguntas», con camellos que llevaban especias, «oro en grande abundancia, y piedras preciosas»; dio al rey ciento veinte talentos de oro, y «nunca vino tan grande copia de especias, como la reina de Seba dió al rey Salomón», y él le dio todo lo que quiso antes de que volviera a su casa. Jesús la llamó «la reina del Austro», que «vino de los fines de la tierra para oir la sabiduría de Salomón»."
    - "Los profetas y los salmos guardan a Seba como la tierra del oro y del incienso: «los reyes de Sheba y de Seba ofrecerán dones», «darásele del oro de Seba»; Isaías ve «todos los de Seba» trayendo oro e incienso a Sion, Jeremías pregunta de qué sirve el «incienso de Seba», y Ezequiel cuenta a los mercaderes de Seba y de Raama, con «lo principal de toda especiería», entre los comerciantes de Tiro. Job conoce las caravanas de Seba, y asaltantes sabeos se llevaron sus bueyes; Joel llama a los sabeos «nación apartada»."
    - "Los escritores griegos conocían a los sabeos como los más ricos de los árabes. Desde el siglo I a. C. los himiaritas se alzaron en su lugar, y la ruptura final de la presa de Marib en el siglo VI d. C. se recuerda en el Corán. Marib se halla hoy en una zona de guerra; en 2023 la UNESCO inscribió los monumentos del antiguo reino de Saba, la presa, el templo de Awam y otros, en la Lista del Patrimonio Mundial y de inmediato en la lista de sitios en peligro. El templo de Awam se sigue llamando Mahram Bilqis, por el nombre árabe de la reina."
  pt:
    - "Sabá é Saba, o reino do sudoeste da Arábia, no atual Iêmen, com capital em Marib, na orla do deserto a leste de Sana, onde o Wadi Adhanah deixa as montanhas. Suas inscrições, em escrita sul-arábica, começam no século VIII a.C.; seus governantes construíram a Grande Represa de Marib para irrigar o oásis e o templo do deus-lua Almaquah em Awam. Saba enriqueceu com incenso e mirra, levados em caravanas de camelos pela rota do incenso até Gaza e Damasco. Reis assírios do fim do século VIII registram presentes de Itamra e Karibilu de Saba, nomes que equivalem aos governantes sabeus Yitha'amar e Karib'il. O Gênesis lista um Sabá entre os filhos de Cuxe, de Joctã e de Quetura, como se o nome atravessasse o Mar Vermelho e a Arábia do norte. Josefo fez da rainha governante do Egito e da Etiópia, e o Kebra Nagast etíope conta como Makeda gerou o filho de Salomão, Menelik."
    - "A rainha de Sabá, ouvindo da fama de Salomão, “veio testá-lo com perguntas difíceis”, com camelos carregados de especiarias, “muitíssimo ouro e pedras preciosas”; deu-lhe cento e vinte talentos de ouro, e “Nunca mais houve tal abundância de especiarias como estas”, e ele lhe deu tudo o que ela desejou antes que voltasse para casa. Jesus a chamou de rainha do sul, que “veio dos confins da terra para ouvir a sabedoria de Salomão”."
    - "Os profetas e os salmos guardam Sabá como a terra do ouro e do incenso: “Os reis de Sabá e de Sebá oferecerão presentes”, “o ouro de Sabá lhe será dado”; Isaías vê “Todos os de Sabá” trazendo ouro e incenso a Sião, Jeremias pergunta de que serve “o incenso de Sabá”, e Ezequiel conta os comerciantes de Sabá e Raamá, com “a melhor de todas as especiarias”, entre os negociantes de Tiro. Jó conhece as caravanas de Sabá, e salteadores sabeus levaram seus bois; Joel chama os sabeus de “uma nação distante”."
    - "Escritores gregos conheciam os sabeus como os mais ricos dos árabes. A partir do século I a.C. os himiaritas se ergueram em seu lugar, e a ruptura final da represa de Marib no século VI d.C. é lembrada no Alcorão. Marib fica hoje numa zona de guerra; em 2023 a UNESCO inscreveu os marcos do antigo reino de Saba, a represa, o templo de Awam e outros, na Lista do Patrimônio Mundial e de imediato na lista de sítios em perigo. O templo de Awam ainda se chama Mahram Bilqis, pelo nome árabe da rainha."
  de:
    - "Scheba ist Saba, das Königreich im Südwesten Arabiens (heute Jemen), mit der Hauptstadt Marib am Wüstenrand östlich von Sanaa, wo das Wadi Adhana aus dem Gebirge tritt. Seine Inschriften (südarabische Schrift) beginnen im 8. Jahrhundert v. Chr.; seine Herrscher bauten den Großen Damm von Marib zur Bewässerung der Oase und den Almaqah-Tempel bei Awam. Saba wurde reich durch Weihrauch und Myrrhe, die Karawanen auf der Weihrauchstraße nach Gaza und Damaskus brachten. Assyrische Könige des späten 8. Jahrhunderts nennen Geschenke von Itamra und Karibilu von Saba (sabäisch Yitha'amar und Karib'il). Die Genesis kennt ein Scheba unter den Söhnen Kuschs, Joktans und Keturas, als reichte der Name über das Rote Meer und Nordarabien. Josephus machte die Königin zur Herrscherin Ägyptens und Äthiopiens; im äthiopischen Kebra Nagast gebiert Makeda Salomos Sohn Menelik."
    - "Als die Königin von Scheba von Salomos Ruhm hörte, „kam sie, Salomo zu versuchen mit Rätseln“, mit Kamelen, „die Spezerei trugen und viel Gold und Edelsteine“; sie gab ihm „hundertzwanzig Zentner Gold“, und „es kam nicht mehr so viel Spezerei“, und er gab ihr alles, was sie wünschte, ehe sie heimzog. Jesus nannte sie die Königin des Südens, die „vom Ende der Erde“ kam, „Salomons Weisheit zu hören“."
    - "Propheten und Psalmen bewahren Scheba als Land des Goldes und des Weihrauchs: „die Könige aus Reicharabien und Seba werden Gaben zuführen“, „man wird ihm von Gold aus Reicharabien geben“; Jesaja sieht Karawanen nach Zion ziehen, die „aus Saba alle kommen, Gold und Weihrauch bringen“, Jeremia fragt, was ihn „Weihrauch aus Reicharabien“ kümmere, und Hesekiel zählt die Kaufleute von Saba und Ragma, mit „allerlei köstlicher Spezerei“, unter Tyrus' Händlern. Hiob kennt die Karawanen von Saba, und sabäische Räuber nahmen seine Rinder; Joel erwähnt die Sabäer: „denen in Reicharabien, einem Volk in fernen Landen“."
    - "Griechische Autoren kannten die Sabäer als die reichsten der Araber. Ab dem 1. Jahrhundert v. Chr. stiegen an ihrer Stelle die Himjariten auf, und der endgültige Bruch des Damms von Marib im 6. Jahrhundert n. Chr. wird im Koran erinnert. Marib liegt heute in einem Kriegsgebiet; 2023 trug die UNESCO die Wahrzeichen des antiken Königreichs Saba, den Damm, den Tempel von Awam und andere, in die Welterbeliste und sofort in die Liste der gefährdeten Stätten ein. Der Tempel von Awam heißt noch immer Mahram Bilqis, nach dem arabischen Namen der Königin."
  fr:
    - "Schéba est Saba, royaume du sud-ouest de l’Arabie (Yémen actuel), dont la capitale Marib borde le désert à l’est de Sanaa, où le Wadi Adhanah quitte les montagnes. Ses inscriptions sud-arabiques commencent au VIIIe siècle av. J.-C. ; ses souverains bâtirent le Grand Barrage de Marib, qui irriguait l’oasis, et le temple du dieu-lune Almaqah à Awam. Saba s’enrichit d’encens et de myrrhe, portés par caravanes jusqu’à Gaza et Damas. Des rois assyriens de la fin du VIIIe siècle notent les présents d’Itamra et de Karibilu de Saba, soit les souverains sabéens Yitha‘amar et Karib‘il. La Genèse cite un Schéba parmi les fils de Cusch, de Joktan et de Ketura, comme si le nom débordait la mer Rouge et gagnait le nord de l’Arabie. Flavius Josèphe fit de la reine une souveraine d’Égypte et d’Éthiopie, et le Kebra Nagast éthiopien fait enfanter à Makeda Ménélik, fils de Salomon."
    - "La reine de Schéba, apprenant la renommée de Salomon, « vint pour l’éprouver par des énigmes », avec des chameaux portant des aromates, « de l’or en très grande quantité, et des pierres précieuses » ; elle donna au roi cent vingt talents d’or, et « Il ne vint plus autant d’aromates » que ceux-là, et il lui donna tout ce qu’elle désira avant qu’elle rentre chez elle. Jésus l’appela la reine du Midi, qui « vint des extrémités de la terre pour entendre la sagesse de Salomon »."
    - "Les prophètes et les psaumes gardent Schéba comme le pays de l’or et de l’encens : « Les rois de Séba et de Saba offriront des présents », « lui donneront de l’or de Séba » ; Ésaïe voit « tous » venir « de Séba » portant l’or et l’encens à Sion, Jérémie demande à quoi sert « l’encens qui vient de Séba », et Ézéchiel compte les marchands de Séba et de Raema, avec « tous les meilleurs aromates », parmi les trafiquants de Tyr. Job connaît les caravanes de Séba, et des Sabéens enlevèrent ses bœufs ; Joël appelle les Sabéens « nation lointaine »."
    - "Les auteurs grecs connaissaient les Sabéens comme les plus riches des Arabes. Dès le Ier siècle av. J.-C., les Himyarites s’élevèrent à leur place, et la rupture finale du barrage de Marib au VIe siècle apr. J.-C. est rappelée dans le Coran. Marib se trouve aujourd’hui en zone de guerre ; en 2023, l’UNESCO a inscrit les sites de l’ancien royaume de Saba, le barrage, le temple d’Awam et d’autres, au patrimoine mondial et aussitôt sur la liste des sites en péril. Le temple d’Awam s’appelle toujours Mahram Bilqis, d’après le nom arabe de la reine."
