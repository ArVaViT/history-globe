body:
  en:
    - "Sheba is Saba, the kingdom of south-west Arabia, in today's Yemen, with its capital Marib on the desert edge east of Sanaa, where the Wadi Adhanah leaves the mountains. Its own inscriptions, in South Arabian script, begin in the eighth century BC; its rulers built the Great Dam of Marib to water the oasis and the temple of the moon-god Almaqah at Awam. Saba grew rich on frankincense and myrrh, carried by caravan up the incense road to Gaza and Damascus. Assyrian kings of the late eighth and early seventh centuries record gifts from Itamra and Karibilu of Saba, names matching the Sabaean rulers Yitha'amar and Karib'il. Genesis lists a Sheba among the descendants of Cush, of Joktan and of Keturah, as if the name reached across the Red Sea and north Arabia. Josephus made the queen a ruler of Egypt and Ethiopia, and the Ethiopian Kebra Nagast tells how Makeda bore Solomon's son Menelik."
    - "The queen of Sheba, hearing of Solomon's fame, “came to prove him with hard questions”, with camels bearing spices, “very much gold, and precious stones”; she gave him a hundred and twenty talents of gold, and “there came no more such abundance of spices as these”, and he gave her all her desire before she went home. Jesus called her the queen of the south, who “came from the uttermost parts of the earth to hear the wisdom of Solomon”."
    - "The prophets and psalms keep Sheba as the land of gold and incense: “the kings of Sheba and Seba shall offer gifts”, “to him shall be given of the gold of Sheba”; Isaiah sees “all they from Sheba” bringing gold and incense to Zion, Jeremiah asks what use is “incense from Sheba”, and Ezekiel counts the merchants of Sheba and Raamah, with “chief of all spices”, among Tyre's traders. Job knows the caravans of Sheba, and Sabean raiders carried off his oxen; Joel calls the Sabeans “a people far off”."
    - "Greek writers knew the Sabaeans as the richest of Arabs. From the first century BC the Himyarites rose in their place, and the Marib dam, which finally gave way in the sixth century AD, is remembered in the Quran. Marib today lies in a war zone; in 2023 UNESCO inscribed the landmarks of the ancient kingdom of Saba, the dam, the Awam temple and others, on the World Heritage List and at once on the list of sites in danger. The Awam temple is still called Mahram Bilqis, after the queen's Arabic name."
  ru:
    - "Сава — это Саба, царство юго-западной Аравии, в нынешнем Йемене, со столицей Мариб на краю пустыни к востоку от Саны, там, где Вади-Азана выходит из гор. Её собственные надписи южноаравийским письмом начинаются в VIII веке до н. э.; её правители построили Великую плотину Мариба, чтобы орошать оазис, и храм лунного бога Алмакаха в Аваме. Саба богатела на ладане и смирне, которые верблюжьи караваны везли по дороге благовоний к Газе и Дамаску. Ассирийские цари конца VIII — начала VII века записывают дары Итамры и Карибилу из Сабы — имена, совпадающие с сабейскими правителями Йасаамаром и Карибилем. Книга Бытия называет Шеву среди потомков Хуша, Иоктана и Хеттуры, словно имя дотянулось через Красное море и северную Аравию. Иосиф Флавий сделал царицу правительницей Египта и Эфиопии, а эфиопская «Кебра Нагаст» рассказывает, как Македа родила от Соломона сына Менелика."
    - "Царица Савская, услышав о славе Соломона, «пришла испытать его загадками», с верблюдами, навьюченными благовониями, «великим множеством золота и драгоценными камнями»; она подарила ему сто двадцать талантов золота, и «никогда еще не приходило такого множества благовоний», а он дал ей всё, чего она желала, прежде чем она вернулась домой. Иисус назвал её царицей южной, которая «приходила от пределов земли послушать мудрости Соломоновой»."
    - "Пророки и псалмы хранят Саву как землю золота и ладана: «цари Аравии и Савы принесут дары», «будут давать ему от золота Аравии»; Исаия видит, как «все они из Савы придут» с золотом и ладаном в Сион, Иеремия спрашивает, к чему «ладан, который идет из Савы», а Иезекииль считает купцов из Савы и Раемы, с «лучшими благовониями», среди торговых партнёров Тира. Иов знает «пути Савейские», а Савеяне угнали его волов; Иоиль знает Савеев как народ отдалённый."
    - "Греческие писатели знали Сабеев как богатейших из арабов. С I века до н. э. на их место поднялись Химьяриты, а Марибскую плотину, окончательно прорванную в VI веке н. э., помнит Коран. Мариб сегодня лежит в зоне войны; в 2023 году ЮНЕСКО внесла памятники древнего царства Саба — плотину, храм Авам и другие — в список Всемирного наследия и сразу же в список объектов под угрозой. Храм Авам до сих пор зовут Махрам-Билкис, по арабскому имени царицы."
  uk:
    - "Шева — це Саба, царство на південному заході Аравії, у нинішньому Ємені, зі столицею Марибом на краю пустелі на схід від Сани, там, де ваді Адханах виходить із гір. Його власні написи південноаравійським письмом починаються з VIII ст. до н. е.; його володарі збудували Велику греблю в Марибі, щоб зрошувати оазу, і храм бога місяця Алмака в Авамі. Саба розбагатіла на ладані та смирні, які верблюжими караванами везли ладановим шляхом до Гази й Дамаска. Ассирійські царі кінця VIII — початку VII ст. до н. е. згадують дари від Ітамри та Карібілу з Саби — імена, що збігаються з іменами сабейських володарів Ітха'амара й Карібіла. Книга Буття згадує Шеву серед нащадків Куша, Йоктана й Хетури, наче це ім'я сягало за Червоне море й до північної Аравії. Йосиф Флавій зробив царицю володаркою Єгипту й Ефіопії, а ефіопська «Кебра Нагаст» розповідає, як Македа народила Соломонового сина Менеліка."
    - "Цариця Шеви, почувши про славу Соломона, «прибула вона випробувати його загадками», з верблюдами, що несли пахощі, «премного золота й дорогоцїнного каміння»; вона подарувала йому сто двадцять талантів золота, і «нїколи ще не приходило стільки пахощів, як подарувала цариця Сабська», а він дав їй усе, чого вона побажала, перш ніж вона повернулася додому. Ісус назвав її полуденною царицею, яка «прийшла з найдальших країн землї слухати премудростї Соломонової»."
    - "Пророки й псалми зберігають Шеву як край золота й ладану: «царі Шеви і Севи» принесуть дарунки, «давати муть йому золото із Шеви»; Ісая бачить, що «з Саби» принесуть золото й ладан до Сіону, Єремія питає, навіщо йому «кадило з Себи», а Єзекіїль зараховує купців Шеви та Раами, з їхніми «найлучшими пахощами», до торговців Тіру. Йов знає каравани Шеви, а сабейські напасники забрали його волів; у Йоїла сини Юди продані «Сабіям, народові далекому»."
    - "Грецькі автори знали сабеїв як найбагатших з арабів. З I ст. до н. е. на їхнє місце піднялися гімʼяріти, а марибська гребля, остаточно прорвана у VI ст. н. е., згадується в Корані. Сьогодні Маріб лежить у зоні війни; 2023 року ЮНЕСКО внесла пам'ятки давнього царства Саба — греблю, храм в Авамі та інші — до Списку всесвітньої спадщини й одразу до списку об'єктів під загрозою. Храм в Авамі досі називають Махрам-Білкіс — за арабським ім'ям цариці."
  es:
    - "Seba es Saba, reino del suroeste de Arabia (hoy Yemen), con capital en Marib, al borde del desierto al este de Saná, donde el Wadi Adhanah sale de las montañas. Sus inscripciones sudarábigas comienzan en el siglo VIII a. C.; sus gobernantes construyeron la Gran Presa de Marib para regar el oasis y el templo del dios luna Almaqah en Awam. Saba se enriqueció con incienso y mirra, en caravanas por la ruta del incienso a Gaza y Damasco. Reyes asirios de fines del siglo VIII y comienzos del VII registran regalos de Itamra y Karibilu de Saba, nombres que coinciden con los gobernantes sabeos Yitha'amar y Karib'il. El Génesis da un Seba entre los descendientes de Cus, Joctán y Cetura, como si el nombre llegara al otro lado del mar Rojo y al norte de Arabia. Josefo hizo de la reina gobernante de Egipto y Etiopía, y el Kebra Nagast etíope cuenta que Makeda dio a luz a Menelik, hijo de Salomón."
    - "La reina de Seba, al oír la fama de Salomón, «vino á probarle con preguntas», con camellos que llevaban especias, «oro en grande abundancia, y piedras preciosas»; dio al rey ciento veinte talentos de oro, y «nunca vino tan grande copia de especias, como la reina de Seba dió al rey Salomón», y él le dio todo lo que quiso antes de que volviera a su casa. Jesús la llamó «la reina del Austro», que «vino de los fines de la tierra para oir la sabiduría de Salomón»."
    - "Los profetas y los salmos guardan a Seba como la tierra del oro y del incienso: «los reyes de Sheba y de Seba ofrecerán dones», «darásele del oro de Seba»; Isaías ve «todos los de Seba» trayendo oro e incienso a Sion, Jeremías pregunta de qué sirve el «incienso de Seba», y Ezequiel cuenta a los mercaderes de Seba y de Raama, con «lo principal de toda especiería», entre los comerciantes de Tiro. Job conoce las caravanas de Seba, y asaltantes sabeos se llevaron sus bueyes; Joel llama a los sabeos «nación apartada»."
    - "Los escritores griegos conocían a los sabeos como los más ricos de los árabes. Desde el siglo I a. C. los himiaritas se alzaron en su lugar, y la presa de Marib, que cedió definitivamente en el siglo VI d. C., se recuerda en el Corán. Marib se halla hoy en una zona de guerra; en 2023 la UNESCO inscribió los monumentos del antiguo reino de Saba, la presa, el templo de Awam y otros, en la Lista del Patrimonio Mundial y de inmediato en la lista de sitios en peligro. El templo de Awam se sigue llamando Mahram Bilqis, por el nombre árabe de la reina."
  pt:
    - "Sabá é Saba, o reino do sudoeste da Arábia, no atual Iêmen, com capital em Marib, na orla do deserto a leste de Sana, onde o Wadi Adhanah deixa as montanhas. Suas inscrições, em escrita sul-arábica, começam no século VIII a.C.; seus governantes construíram a Grande Represa de Marib para irrigar o oásis e o templo do deus-lua Almaquah em Awam. Saba enriqueceu com incenso e mirra, levados em caravanas de camelos pela rota do incenso até Gaza e Damasco. Reis assírios do fim do século VIII e início do VII registram presentes de Itamra e Karibilu de Saba, nomes que equivalem aos governantes sabeus Yitha'amar e Karib'il. O Gênesis lista um Sabá entre os descendentes de Cuxe, de Joctã e de Quetura, como se o nome atravessasse o Mar Vermelho e a Arábia do norte. Josefo fez da rainha governante do Egito e da Etiópia, e o Kebra Nagast etíope conta como Makeda gerou o filho de Salomão, Menelik."
    - "A rainha de Sabá, ouvindo da fama de Salomão, “veio testá-lo com perguntas difíceis”, com camelos carregados de especiarias, “muitíssimo ouro e pedras preciosas”; deu-lhe cento e vinte talentos de ouro, e “Nunca mais houve tal abundância de especiarias como estas”, e ele lhe deu tudo o que ela desejou antes que voltasse para casa. Jesus a chamou de rainha do sul, que “veio dos confins da terra para ouvir a sabedoria de Salomão”."
    - "Os profetas e os salmos guardam Sabá como a terra do ouro e do incenso: “Os reis de Sabá e de Sebá oferecerão presentes”, “o ouro de Sabá lhe será dado”; Isaías vê “Todos os de Sabá” trazendo ouro e incenso a Sião, Jeremias pergunta de que serve “o incenso de Sabá”, e Ezequiel conta os comerciantes de Sabá e Raamá, com “a melhor de todas as especiarias”, entre os negociantes de Tiro. Jó conhece as caravanas de Sabá, e salteadores sabeus levaram seus bois; Joel chama os sabeus de “uma nação distante”."
    - "Escritores gregos conheciam os sabeus como os mais ricos dos árabes. A partir do século I a.C. os himiaritas se ergueram em seu lugar, e a represa de Marib, que cedeu de vez no século VI d.C., é lembrada no Alcorão. Marib fica hoje numa zona de guerra; em 2023 a UNESCO inscreveu os marcos do antigo reino de Saba, a represa, o templo de Awam e outros, na Lista do Patrimônio Mundial e de imediato na lista de sítios em perigo. O templo de Awam ainda se chama Mahram Bilqis, pelo nome árabe da rainha."
  de:
    - "Scheba ist Saba, das Königreich im Südwesten Arabiens (heute Jemen), mit der Hauptstadt Marib am Wüstenrand östlich von Sanaa, wo das Wadi Adhana aus dem Gebirge tritt. Seine Inschriften (südarabische Schrift) beginnen im 8. Jahrhundert v. Chr.; seine Herrscher bauten den Großen Damm von Marib zur Bewässerung der Oase und den Almaqah-Tempel bei Awam. Saba wurde reich durch Weihrauch und Myrrhe, die Karawanen auf der Weihrauchstraße nach Gaza und Damaskus brachten. Assyrische Könige des späten 8. und frühen 7. Jahrhunderts nennen Geschenke von Itamra und Karibilu von Saba (sabäisch Yitha'amar und Karib'il). Die Genesis kennt ein Scheba unter den Nachkommen Kuschs, Joktans und Keturas, als reichte der Name über das Rote Meer und Nordarabien. Josephus machte die Königin zur Herrscherin Ägyptens und Äthiopiens; im äthiopischen Kebra Nagast gebiert Makeda Salomos Sohn Menelik."
    - "Als die Königin von Scheba von Salomos Ruhm hörte, „kam sie, Salomo zu versuchen mit Rätseln“, mit Kamelen, „die Spezerei trugen und viel Gold und Edelsteine“; sie gab ihm „hundertzwanzig Zentner Gold“, und „es kam nicht mehr so viel Spezerei“, und er gab ihr alles, was sie wünschte, ehe sie heimzog. Jesus nannte sie die Königin des Südens, die „vom Ende der Erde“ kam, „Salomons Weisheit zu hören“."
    - "Propheten und Psalmen bewahren Scheba als Land des Goldes und des Weihrauchs: „die Könige aus Reicharabien und Seba werden Gaben zuführen“, „man wird ihm von Gold aus Reicharabien geben“; Jesaja sieht Karawanen nach Zion ziehen, die „aus Saba alle kommen, Gold und Weihrauch bringen“, Jeremia fragt, was ihn „Weihrauch aus Reicharabien“ kümmere, und Hesekiel zählt die Kaufleute von Saba und Ragma, mit „allerlei köstlicher Spezerei“, unter Tyrus' Händlern. Hiob kennt die Karawanen von Saba, und sabäische Räuber nahmen seine Rinder; Joel erwähnt die Sabäer: „denen in Reicharabien, einem Volk in fernen Landen“."
    - "Griechische Autoren kannten die Sabäer als die reichsten der Araber. Ab dem 1. Jahrhundert v. Chr. stiegen an ihrer Stelle die Himjariten auf, und der Damm von Marib, der im 6. Jahrhundert n. Chr. endgültig brach, wird im Koran erinnert. Marib liegt heute in einem Kriegsgebiet; 2023 trug die UNESCO die Wahrzeichen des antiken Königreichs Saba, den Damm, den Tempel von Awam und andere, in die Welterbeliste und sofort in die Liste der gefährdeten Stätten ein. Der Tempel von Awam heißt noch immer Mahram Bilqis, nach dem arabischen Namen der Königin."
  fr:
    - "Schéba est Saba, royaume du sud-ouest de l’Arabie (Yémen actuel), dont la capitale Marib borde le désert à l’est de Sanaa, où le Wadi Adhanah quitte les montagnes. Ses inscriptions sud-arabiques commencent au VIIIe siècle av. J.-C. ; ses souverains bâtirent le Grand Barrage de Marib, qui irriguait l’oasis, et le temple du dieu-lune Almaqah à Awam. Saba s’enrichit d’encens et de myrrhe, portés par caravanes jusqu’à Gaza et Damas. Des rois assyriens de la fin du VIIIe et du début du VIIe siècle notent les présents d’Itamra et de Karibilu de Saba, soit les souverains sabéens Yitha‘amar et Karib‘il. La Genèse cite un Schéba parmi les descendants de Cusch, de Joktan et de Ketura, comme si le nom débordait la mer Rouge et gagnait le nord de l’Arabie. Josèphe fit de la reine une souveraine d’Égypte et d’Éthiopie, et le Kebra Nagast éthiopien fait enfanter à Makeda Ménélik, fils de Salomon."
    - "La reine de Schéba, apprenant la renommée de Salomon, « vint pour l’éprouver par des énigmes », avec des chameaux portant des aromates, « de l’or en très grande quantité, et des pierres précieuses » ; elle donna au roi cent vingt talents d’or, et « Il ne vint plus autant d’aromates » que ceux-là, et il lui donna tout ce qu’elle désira avant qu’elle rentre chez elle. Jésus l’appela la reine du Midi, qui « vint des extrémités de la terre pour entendre la sagesse de Salomon »."
    - "Les prophètes et les psaumes gardent Schéba comme le pays de l’or et de l’encens : « Les rois de Séba et de Saba offriront des présents », « lui donneront de l’or de Séba » ; Ésaïe voit « tous » venir « de Séba » portant l’or et l’encens à Sion, Jérémie demande à quoi sert « l’encens qui vient de Séba », et Ézéchiel compte les marchands de Séba et de Raema, avec « tous les meilleurs aromates », parmi les trafiquants de Tyr. Job connaît les caravanes de Séba, et des Sabéens enlevèrent ses bœufs ; Joël appelle les Sabéens « nation lointaine »."
    - "Les auteurs grecs connaissaient les Sabéens comme les plus riches des Arabes. Dès le Ier siècle av. J.-C., les Himyarites s’élevèrent à leur place, et le barrage de Marib, qui céda définitivement au VIe siècle apr. J.-C., est rappelé dans le Coran. Marib se trouve aujourd’hui en zone de guerre ; en 2023, l’UNESCO a inscrit les sites de l’ancien royaume de Saba, le barrage, le temple d’Awam et d’autres, au patrimoine mondial et aussitôt sur la liste des sites en péril. Le temple d’Awam s’appelle toujours Mahram Bilqis, d’après le nom arabe de la reine."
  it:
    - "Saba è il regno dell’Arabia sud-occidentale, nell’odierno Yemen, con capitale Marib sul margine del deserto a est di Sanaa, allo sbocco del Wadi Adhanah. Le sue iscrizioni in sudarabico cominciano nell’VIII secolo a.C.; i suoi sovrani costruirono la Grande Diga di Marib per irrigare l’oasi e il tempio del dio lunare Almaqah ad Awam. Saba si arricchì d’incenso e mirra, trasportati da carovane lungo la via dell’incenso fino a Gaza e Damasco. I re assiri della fine dell’VIII e dell’inizio del VII secolo registrano doni di Itamra e Karibilu di Saba, nomi corrispondenti ai sovrani sabei Yitha’amar e Karib’il. La Genesi elenca una Saba tra i discendenti di Cus, di Ioktan e di Chetura, come se il nome attraversasse il Mar Rosso e l’Arabia settentrionale. Giuseppe Flavio ne fece una sovrana d’Egitto e d’Etiopia, e il Kebra Nagast etiopico racconta che Makeda partorì Menelik, figlio di Salomone."
    - "La regina di Saba, udita la fama di Salomone, «venne a metterlo alla prova con degli enimmi», con «cammelli carichi di aromi, d’oro in gran quantità, e di pietre preziose»; gli donò centoventi talenti d’oro, e «Non furon mai più portati tanti aromi quanti ne diede la regina di Sceba al re Salomone», ed egli le diede tutto ciò che desiderò prima che tornasse a casa. Gesù la chiamò la regina del Mezzodì, che «venne dalle estremità della terra per udir la sapienza di Salomone»."
    - "I profeti e i salmi serbano Saba come terra dell’oro e dell’incenso: «i re di Sceba e di Seba gli offriranno doni», «a lui sarà dato dell’oro di Sceba»; Isaia vede che «quelli di Sceba verranno tutti, portando oro ed incenso» a Sion, Geremia chiede che cosa importi «dell’incenso che viene da Seba», ed Ezechiele conta i mercanti di Saba e di Raama, con «tutti i migliori aromi», tra i commercianti di Tiro. Giobbe conosce le carovane di Saba, e predoni sabei portarono via i suoi buoi; Gioele chiama i Sabei «nazione lontana»."
    - "Gli scrittori greci conoscevano i Sabei come i più ricchi tra gli Arabi. Dal I secolo a.C. gli Himyariti salirono al loro posto, e la diga di Marib, che cedette definitivamente nel VI secolo d.C., è ricordata nel Corano. Marib si trova oggi in una zona di guerra; nel 2023 l’UNESCO ha iscritto i luoghi dell’antico regno di Saba, la diga, il tempio di Awam e altri, nella Lista del Patrimonio Mondiale e subito in quella dei siti in pericolo. Il tempio di Awam è ancora chiamato Mahram Bilqis, dal nome arabo della regina."
  pl:
    - "Szeba to Saba, królestwo południowo-zachodniej Arabii, w dzisiejszym Jemenie, ze stolicą Marib na skraju pustyni na wschód od Sany, gdzie Wadi Adana opuszcza góry. Jego własne napisy, pismem południowoarabskim, zaczynają się w VIII wieku p.n.e.; władcy zbudowali Wielką Tamę w Marib, by nawadniać oazę, i świątynię boga księżyca Almakaha w Awam. Saba wzbogaciła się na kadzidle i mirze, wożonych karawanami wielbłądów szlakiem kadzidła do Gazy i Damaszku. Królowie asyryjscy z końca VIII i początku VII wieku zapisują dary od Itamry i Karibilu z Saby, imiona zgodne z władcami sabejskimi Jita'amarem i Karib'ilem. Księga Rodzaju wymienia Szebę wśród potomków Kusza, Joktana i Ketury, jakby nazwa sięgała przez Morze Czerwone i północną Arabię. Józef Flawiusz uczynił królową władczynią Egiptu i Etiopii, a etiopski Kebra Nagast opowiada, jak Makeda urodziła syna Salomona, Menelika."
    - "Królowa Saby, usłyszawszy o sławie Salomona, „przyjechała, aby go doświadczyła w zagadkach”, z wielbłądami niosącymi wonności, „i złota bardzo wiele, i kamienia drogiego”; dała mu sto dwadzieścia talentów złota i wonności: „Nie przyszło nigdy potem tak wiele wonnych rzeczy, jako dała królowa z Saby królowi Salomonowi”, a on dał jej wszystko, czego pragnęła, zanim wróciła do domu. Jezus powiedział: „Królowa z południa stanie na sądzie z tym rodzajem, i potępi go; iż przyszła od krajów ziemi, aby słuchała mądrości Salomonowej”."
    - "Prorocy i psalmy zachowują Szebę jako kraj złota i kadzidła: „królowie Sebejscy i Sabejscy upominki oddadzą”, „dawać mu będą złoto sabejskie”; Izajasz widzi, jak „Wszyscy ci przyjdą z Saby, złoto i kadzidło przyniosą”, Jeremiasz pyta, na cóż mu „kadzidło z Saby”, a Ezechiel wymienia kupców Saby i Raamy, z „wszelakiemi przedniejszemi wonnemi rzeczami”, wśród handlarzy Tyru. Hiob zna karawany Saby, a sabejscy napastnicy uprowadzili jego woły; Joel nazywa Sabejczyków narodem dalekim."
    - "Pisarze greccy znali Sabejczyków jako najbogatszych z Arabów. Od I wieku p.n.e. na ich miejsce wzrośli Himjaryci, a tamę w Marib, ostatecznie przerwaną w VI wieku n.e., pamięta Koran. Marib leży dziś w strefie wojny; w 2023 roku UNESCO wpisało zabytki starożytnego królestwa Saby, tamę, świątynię w Awam i inne, na Listę Światowego Dziedzictwa i od razu na listę obiektów zagrożonych. Świątynię w Awam nadal nazywa się Mahram Bilkis, od arabskiego imienia królowej."
  cs:
    - "Šeba je Saba, království jihozápadní Arábie, v dnešním Jemenu, s hlavním městem Márib na okraji pouště východně od Saná, kde Vádí Adhana opouští hory. Jeho vlastní nápisy v jihoarabském písmu začínají v 8. století př. n. l.; jeho vládci vystavěli Velkou přehradu v Máribu, aby zavlažili oázu, a chrám boha měsíce Almaqaha v Avámu. Saba zbohatla na kadidle a myrse, vozených velbloudími karavanami po kadidlové cestě do Gazy a Damašku. Asyrští králové pozdního 8. a raného 7. století zaznamenávají dary od Itamry a Karibilua z Saby, jména odpovídající sabejským vládcům Jitha'amarovi a Karib'ilovi. Genesis uvádí Šebu mezi potomky Kúše, Joktana i Ketury, jako by jméno sahalo přes Rudé moře i severní Arábii. Josephus učinil královnu vládkyní Egypta a Etiopie a etiopský Kebra Nagast vypráví, jak Makeda porodila Šalomounova syna Menelika."
    - "Královna ze Šeby, uslyševši o Šalomounově slávě, „přijela, aby zkusila jeho v pohádkách“, s velbloudy nesoucími vonné věci, „zlata velmi mnoho i kamení drahého“; dala mu „sto a dvadceti centnéřů zlata“ a „aniž bylo kdy více přivezeno takových vonných věcí tak mnoho“, a on jí dal vše, po čem toužila, než se vrátila domů. Ježíš ji nazval královnou od poledne, která „přijela od končin země, aby slyšela moudrost Šalomounovu“."
    - "Proroci a žalmy uchovávají Šebu jako zemi zlata a kadidla: „králové Šebejští a Sabejští dary obětovati budou“, „dávati mu budou zlato Arabské“; Izajáš vidí, jak „všickni ti z Sáby přijdou, zlato a kadidlo přinesou“ na Sijón, Jeremjáš se ptá, k čemu je mu „kadidlo z Sáby“, a Ezechiel počítá obchodníky Šeby a Raemy, „ve všelijakých nejpřednějších vonných věcech“, mezi obchodníky Týru. Job zná karavany Šeby a sabejští nájezdníci odvedli jeho voly; Joel praví, že děti Judy budou prodány Sabejským, „do národu dalekého“."
    - "Řečtí spisovatelé znali Sabejce jako nejbohatší z Arabů. Od 1. století př. n. l. se na jejich místo zvedli Himjarité a přehrada v Máribu, definitivně protržená v 6. století n. l., je připomínána v Koránu. Márib dnes leží ve válečné zóně; roku 2023 UNESCO zapsalo památky starověkého království Saba, přehradu, chrám Avám a další, na Seznam světového dědictví a zároveň na seznam ohrožených památek. Chrám Avám se dosud nazývá Mahram Bilqís podle arabského jména královny."
  nl:
    - "Seba is Saba, het koninkrijk van Zuidwest-Arabië, in het huidige Jemen, met als hoofdstad Marib aan de woestijnrand ten oosten van Sanaa, waar de Wadi Adhanah uit het gebergte komt. Eigen opschriften in Zuid-Arabisch schrift beginnen in de 8e eeuw v.Chr.; de heersers bouwden de Grote Dam van Marib om de oase te bevloeien, en de tempel van de maangod Almaqah te Awam. Saba werd rijk van wierook en mirre, door karavanen naar Gaza en Damascus gebracht. Assyrische koningen van de late 8e en vroege 7e eeuw noemen geschenken van Itamra en Karibilu van Saba, namen die passen bij de Sabaeïsche heersers Yitha’amar en Karib’il. Genesis noemt een Seba onder de nakomelingen van Kus, Joktan en Ketura, alsof de naam de Rode Zee en Noord-Arabië overspande. Josephus maakte de koningin tot heerseres van Egypte en Ethiopië, en de Ethiopische Kebra Nagast vertelt hoe Makeda Salomo’s zoon Menelik baarde."
    - "Toen de koningin van Seba van Salomo’s faam hoorde, “kwam zij, om hem met raadselen te verzoeken”, met kamelen die specerijen droegen, “zeer veel gouds, en kostelijk gesteente”; zij gaf hem honderdtwintig talenten goud, en “als deze specerij, die de koningin van Scheba den koning Salomo gaf, is er nooit meer in menigte gekomen”, en hij gaf haar al haar begeerte voordat zij naar huis ging. Jezus noemde haar de koningin van het zuiden: “zij is gekomen van het einde der aarde, om te horen, de wijsheid van Salomo”."
    - "De profeten en psalmen bewaren Seba als het land van goud en wierook: “de koningen van Scheba en Seba zullen vereringen toevoeren”, “men zal hem geven van het goud van Scheba”; Jesaja ziet “zij allen uit Scheba” goud en wierook naar Sion brengen, Jeremia vraagt wat “de wierook voor Mij uit Scheba” baat, en Ezechiël telt de kooplieden van Seba en Raäma, met “alle hoofdspecerij”, onder Tyrus’ handelaars. Job kent de karavanen van Seba, en Sabaeïsche plunderaars namen zijn ossen mee; Joël noemt de Sabaeërs “een vergelegen volk”."
    - "Griekse schrijvers kenden de Sabaeërs als de rijkste Arabieren. Vanaf de 1e eeuw v.Chr. kwamen de Himyarieten in hun plaats op, en de Marib-dam, die in de 6e eeuw n.Chr. definitief bezweek, wordt in de Koran herinnerd. Marib ligt nu in een oorlogsgebied; in 2023 schreef UNESCO de monumenten van het oude koninkrijk Saba, de dam, de tempel van Awam en andere, in op de Werelderfgoedlijst en meteen op de lijst van bedreigd erfgoed. De tempel van Awam heet nog Mahram Bilqis, naar de Arabische naam van de koningin."
  sv:
    - "Saba är kungariket i sydvästra Arabien, i dagens Jemen, med huvudstad Marib i ökenkanten öster om Sanaa, där Wadi Adhanah lämnar bergen. Dess egna inskriptioner, i sydarabisk skrift, börjar på 700-talet f.Kr.; dess härskare byggde Stora dammen i Marib för att vattna oasen och månguden Almaqahs tempel vid Awam. Saba blev rikt genom rökelse och myrra, som fördes med karavaner uppför rökelsevägen till Gaza och Damaskus. Assyriska kungar från sent 700- och tidigt 600-tal f.Kr. anger gåvor från Itamra och Karibilu av Saba, namn som motsvarar de sabeiska härskarna Yitha'amar och Karib'il. Första Mosebok upptar ett Saba bland ättlingarna till Kush, Joktan och Ketura, som om namnet nådde över Röda havet och norra Arabien. Josefus gjorde drottningen till härskare över Egypten och Etiopien, och den etiopiska Kebra Nagast berättar hur Makeda födde Salomos son Menelik."
    - "Drottningen av Saba hörde ryktet om Salomo och kom, ”för att sätta honom på prov med svåra frågor”, med kameler som bar kryddor, ”guld i stor myckenhet, så ock ädla stenar”; hon gav honom ett hundra tjugu talenter guld, och ”en så stor myckenhet av välluktande kryddor, som drottningen av Saba gav åt konung Salomo, har aldrig mer blivit införd”, och han gav henne allt hon åstundade innan hon for hem. Jesus kallade henne ”Drottningen av Söderlandet”, som ”kom från jordens ända för att höra Salomos visdom”."
    - "Profeterna och psalmerna bevarar Saba som guldets och rökelsens land: ”konungarna av Saba och Seba bäre fram gåvor”, ”må man föra till honom guld från Saba”; Jesaja ser att ”från Saba skola de alla komma, guld och rökelse skola de bära” till Sion, Jeremia låter HERREN fråga vad han har för nytta av ”rökelse, komme den ock från Saba”, och Hesekiel räknar Sabas och Raamas köpmän, med ”kryddor av allra yppersta slag”, bland Tyros handelspartner. Job känner Sabas karavaner, och sabeiska rövare förde bort hans oxar; Joel kallar sabéerna ”folket i fjärran land”."
    - "Grekiska författare kände sabeerna som de rikaste av araberna. Från första århundradet f.Kr. steg himyariterna fram i deras ställe, och Maribdammen, som slutligen gav vika på 500-talet e.Kr., hågkoms i Koranen. Marib ligger i dag i en krigszon; 2023 upptog Unesco landmärkena i det forntida kungariket Saba, dammen, Awamtemplet och andra, på världsarvslistan och genast på listan över hotade platser. Awamtemplet kallas ännu Mahram Bilqis, efter drottningens arabiska namn."
  nb:
    - "Sjeba er Saba, kongeriket i sørvestlige Arabia, i dagens Jemen, med hovedstaden Marib i ørkenkanten øst for Sanaa, der Wadi Adhanah forlater fjellene. Dets egne inskripsjoner, med sørarabisk skrift, begynner på 700-tallet f.Kr.; herskerne bygde Marib-demningen for å vanne oasen og tempelet for måneguden Almaqah ved Awam. Saba ble rikt på virak og myrra, ført med karavaner opp Virakveien til Gasa og Damaskus. Assyriske konger fra sent på 700- og tidlig på 600-tallet f.Kr. forteller om gaver fra Itamra og Karibilu av Saba, navn som svarer til de sabeiske herskerne Yitha'amar og Karib'il. 1. Mosebok oppfører en Sjeba blant etterkommerne av Kusj, av Joktan og av Ketura, som om navnet rakk over Rødehavet og nordlige Arabia. Josefus gjorde dronningen til hersker over Egypt og Etiopia, og den etiopiske Kebra Nagast forteller hvordan Makeda fødte Salomos sønn Menelik."
    - "Dronningen av Sjeba, som hørte om Salomos ry, «kom [...] for å sette ham på prøve med gåter», med «kameler som bar krydderier og en stor mengde gull og dyre stener»; hun ga ham hundre og tyve talenter gull, og «aldri er det mere kommet en sådan mengde krydderier til landet som det dronningen av Saba gav kong Salomo», og han ga henne alt hun lyste til før hun dro hjem. Jesus kalte henne dronningen fra Syden, som «kom fra jordens ytterste ende for å høre Salomos visdom»."
    - "Profetene og salmene beholder Sjeba som gullets og viraken land: «kongene fra Sjeba og Seba frembære skatt», «gi ham av Sjebas gull»; Jesaja ser «alle sammen [...] komme fra Sjeba» med gull og virak til Sion, Jeremia spør hva han skal med «virak fra Sjeba», og Esekiel regner Sjebas og Raemas kjøpmenn, med «beste slag av allehånde velluktende urter», blant Tyros' handelsmenn. Job kjenner Sjebas karavaner, og sabeiske plyndrere tok oksene hans; Joel kaller sabeerne «et folk som bor langt borte»."
    - "Greske forfattere kjente sabeerne som de rikeste av araberne. Fra 1. århundre f.Kr. steg himyarittene fram i deres sted, og Marib-demningen, som til slutt ga etter på 500-tallet e.Kr., huskes i Koranen. Marib ligger i dag i en krigssone; i 2023 innskrev UNESCO landemerkene fra det gamle kongeriket Saba, demningen, Awam-tempelet og andre, på verdensarvlisten og straks på listen over truede steder. Awam-tempelet kalles fortsatt Mahram Bilqis, etter dronningens arabiske navn."
  tl:
    - "Ang Seba ay Saba, kaharian ng timog-kanlurang Arabia (Yemen), kabisera ang Marib sa gilid ng disyerto silangan ng Sanaa, kung saan lumalabas ang Wadi Adhanah sa bundok. Mula ika-8 siglo BK ang inskripsiyon nito sa titik Timog Arabe; itinayo ng mga pinuno ang Dakilang Dam ng Marib para sa oasis at ang templo ng diyos ng buwang si Almaqah sa Awam. Yumaman ito sa kamanyang at mira, dala ng karabana sa daan ng insenso patungong Gaza at Damasco. Itinatala ng mga haring Asiryo ng huling ika-8 at unang ika-7 siglo ang kaloob nina Itamra at Karibilu ng Saba, na tugma sa mga pinunong Sabeo na sina Yitha'amar at Karib'il. May Seba sa Genesis sa mga inapo ni Cush, Joctan at Cetura, tila umabot ang pangalan sa kabila ng Dagat na Pula at hilagang Arabia. Pinamunuan ng reyna ang Egipto at Etiopia ayon kay Josefo; ayon sa Kebra Nagast, ipinanganak ni Makeda ang anak ni Salomon, si Menelik."
    - "Ang reyna ng Seba, nang mabalitaan ang kabantugan ni Salomon, ay naparoon “upang subukin niya siya ng mga mahirap na tanong”, na may mga kamelyong may pasang espesia, “totoong maraming ginto, at mga mahalagang bato”; nagbigay siya sa kaniya ng isang daan at dalawampung talentong ginto, at “kailan ma'y hindi nagkaroon ng gayong kasaganaan ng mga espesia, gaya ng mga ito”, at ibinigay niya sa kaniya ang lahat ng ninais nito bago umuwi. Tinawag siya ni Jesus na reyna ng timugan, na “nanggaling sa mga wakas ng lupa upang pakinggan ang karunungan ni Salomon”."
    - "Pinananatili ng mga propeta at mga awit ang Seba bilang lupain ng ginto at insenso: “ang mga hari sa Sheba at Seba ay mangaghahandog ng mga kaloob”, “sa kaniya'y ibibigay ang ginto ng Sheba”; nakikita ni Isaias na “magsisipanggaling na lahat mula sa Seba: mangagdadala ng ginto at kamangyan” sa Sion, nagtatanong si Jeremias kung ano ang silbi ng “kamangyan na mula sa Seba”, at binibilang ni Ezekiel ang mga mangangalakal ng Seba at Raama, na may “mga pinakamainam na especia”, sa mga mangangalakal ng Tiro. Kilala ni Job ang mga karabana ng Seba, at tinangay ng mga mananalakay na Sabeo ang kaniyang mga baka; tinatawag ni Joel ang mga Sabeo na “isang bansang malayo”."
    - "Kilala ng mga manunulat na Griyego ang mga Sabeo bilang pinakamayaman sa mga Arabe. Mula sa ika-1 siglo BK, pumalit sa kanila ang mga Himyarita, at ang dam ng Marib, na tuluyang bumigay noong ika-6 na siglo AD, ay naaalala sa Quran. Ang Marib ngayon ay nasa sonang digmaan; noong 2023, isinama ng UNESCO ang mga palatandaan ng sinaunang kaharian ng Saba, ang dam, ang templo ng Awam at iba pa, sa Talaan ng Pandaigdigang Pamana at agad sa listahan ng mga pook na nanganganib. Tinatawag pa rin ang templo ng Awam na Mahram Bilqis, sunod sa pangalang Arabe ng reyna."
  da:
    - "Saba (i Bibelen Sjeba) er kongeriget i det sydvestlige Arabien, i nutidens Yemen, med hovedstad Marib ved ørkenranden øst for Sanaa, hvor Wadi Adhanah forlader bjergene. Dets indskrifter, på sydarabisk, begynder i 700-tallet f.Kr.; dets herskere byggede Marib-dæmningen for at vande oasen og Almaqahs, månegudens, tempel ved Awam. Saba blev rigt på røgelse og myrra, båret af karavaner op ad røgelsesvejen til Gaza og Damaskus. Assyriske konger fra slutningen af 700- og begyndelsen af 600-tallet f.Kr. optegner gaver fra Itamra og Karibilu af Saba, navne svarende til herskerne Yitha'amar og Karib'il. 1. Mosebog opregner et Sjeba blandt Kusjs, Joktans og Keturas efterkommere, som om navnet nåede over Det Røde Hav og det nordlige Arabien. Josefus gjorde dronningen til hersker over Egypten og Etiopien, og den etiopiske Kebra Nagast fortæller, hvordan Makeda fødte Salomos søn Menelik."
    - "Sabas dronning, der hørte om Salomos ry, »kom for at prøve ham med mørke Taler«, med kameler, der bar urter, »saare meget Guld og kostbare Stene«; hun gav ham hundrede og tyve talenter guld, og »der kom ikke ydermere saadanne Urter i Mangfoldighed som disse«, og han gav hende alt, hvad hun havde lyst til, før hun drog hjem. Jesus kaldte hende Sydens dronning, som »kom fra Jordens Grænser for at høre Salomons Visdom«."
    - "Profeterne og salmerne bevarer Saba som guldets og røgelsens land: »Konger fra Skeba og Seba skulle fremføre Gave«, »de skulle leve og give ham af Skebas Guld«; Esajas ser »alle de af Skeba« bringe guld og røgelse til Zion, Jeremias spørger, hvortil der skal bringes »Virak fra Seba«, og Ezekiel tæller Sabas og Raamas købmænd, »med det ypperste af alle Haande Urter«, blandt Tyrus' handlende. Job kender Sabas karavaner, og sabæiske plyndrere bortførte hans okser; Joel kalder sabæerne »et fjernt Folk«."
    - "Græske forfattere kendte sabæerne som de rigeste af araberne. Fra 1. århundrede f.Kr. rejste himyariterne sig i deres sted, og Marib-dæmningen, der endelig brast i 500-tallet e.Kr., mindes i Koranen. Marib ligger i dag i en krigszone; i 2023 optog UNESCO det gamle kongerige Sabas vartegn, dæmningen, Awam-templet og andre, på verdensarvslisten og straks på listen over truede steder. Awam-templet kaldes stadig Mahram Bilqis efter dronningens arabiske navn."
  sr:
    - "Сава је Саба, краљевство југозападне Арабије, у данашњем Јемену, са престоницом Мариб на ободу пустиње источно од Сане, где Вади Адана излази из планина. Њени натписи, јужноарабијским писмом, почињу у 8. веку п. н. е.; њени владари су подигли Велику брану Мариба да би наводњавали оазу и храм месечевог бога Алмаке у Аваму. Саба се обогатила тамјаном и смирном, које су каравани носили тамјанским путем до Газе и Дамаска. Асирски цареви касног 8. и раног 7. века бележе дарове од Итамре и Карибилуа из Сабе, имена која одговарају сабејским владарима Јитха’амару и Карибилу. Постање наводи Саву међу потомцима Хусовим, Јектановим и Хетуриним, као да је име досезало преко Црвеног мора и северне Арабије. Јосиф Флавије је од царице начинио владарку Египта и Етиопије, а етиопски Кебра Нагаст приповеда како је Македа родила Соломунова сина Менелика."
    - "Царица од Саве, чувши глас о Соломуну, „дође да га искуша загонеткама“, с камилама које „ношаху мириса и злата врло много и драгог камења“; дала му је сто и двадесет таланата злата, и „никада више не дође толико таквих мириса“, а он јој је дао „шта год зажеле“ пре него што се вратила кући. Исус ју је назвао царицом јужном, која „дође с краја земље да слуша премудрост Соломунову“."
    - "Пророци и псалми чувају Саву као земљу злата и тамјана: „цареви шавски и савски даће данак“, „донеће му злато из Шаве“; Исаија прориче: „сви из Саве доћи ће“, носећи злато и тамјан у Сион, Јеремија пита чему „тамјан, што долази из Саве“, а Језекиљ убраја савске и раемске трговце, који су долазили „са свакојаким мирисима“, међу тирске трговце. Јов зна караване Саве, а савски пљачкаши отерали су му волове; Јоило Савејце назива „народ далеки“."
    - "Грчки писци знали су Сабејце као најбогатије међу Арапима. Од 1. века п. н. е. на њихово место су се уздигли Химјарити, а бране Мариба, која је коначно попустила у 6. веку н. е., сећа се Куран. Мариб данас лежи у ратној зони; 2023. УНЕСКО је уписао знамените делове древног краљевства Сабе, брану, храм у Аваму и друге, на листу светске баштине и одмах на листу угрожених локалитета. Храм у Аваму и даље се зове Махрам Билкис, по арапском имену краљице."
  hu:
    - "Séba Saba, Délnyugat-Arábia királysága a mai Jemenben, fővárosa Marib a Szanaától keletre fekvő sivatagszélen, ahol a Wadi Adhanah elhagyja a hegyeket. Dél-arábiai írású feliratai a Kr. e. 8. században kezdődnek; uralkodói építették a Marib-gátat az oázis öntözésére és Almaqah holdisten templomát Awamban. Saba tömjénből és mirhából gazdagodott meg, amit karavánok vittek a tömjénúton Gázába és Damaszkuszba. A Kr. e. 8. század végének és a 7. század elejének asszír királyai Itamra és Karibilu sabai ajándékait jegyzik fel, Yitha'amar és Karib'il sabai uralkodók nevével egyezően. Mózes első könyve Sébát Kús, Joktán és Ketura leszármazottai között sorolja fel, mintha a név a Vörös-tengeren és Észak-Arábián is átnyúlna. Josephus Flavius a királynőt Egyiptom és Etiópia uralkodójává teszi, az etióp Kebra Nagast pedig elmondja, hogyan szülte Makeda Salamon fiát, Menelikot."
    - "Séba királynője, hallván Salamon hírét, „eljöve, hogy megkisértgesse őt nehéz kérdésekkel”, tevékkel, amelyek fűszerszámokat hoztak, „igen sok aranyat és drágaköveket”; százhúsz talentum aranyat adott neki, és „Nem hoztak azután ilyen és ennyi sokaságú fűszerszámot”, ő pedig minden kívánságát teljesítette, mielőtt hazament. Jézus a dél királynéjának nevezte, aki „eljött a földnek széléről, hogy hallhassa a Salamon bölcseségét”."
    - "A próféták és a zsoltárok Sébát az arany és a tömjén földjeként őrzik: a zsoltár Séba és Széba királyait ajándékhozóknak látja, és neki adnak Séba aranyából; Ézsaiás látja, hogy „mind Sebából jönnek”, aranyat és tömjént hozva Sionnak, Jeremiás megkérdezi, mire jó neki „ez a tömjén, a mi Sébából kerül”, Ezékiel pedig Séba és Raama kalmárait, „mindenféle drága fűszerszámokat” hozva, Tírusz kereskedői között számolja. Jób ismeri Séba karavánjait, és sabai rablók vitték el ökreit; Jóel a szábaiakat „a messze lakó népnek” nevezi."
    - "A görög írók a szábaiakat az arabok leggazdagabbjaként ismerték. A Kr. e. 1. századtól a himjáriták emelkedtek a helyükön, és a Marib-gát, amely végül a Kr. u. 6. században megadta magát, a Koránban él. Marib ma háborús övezetben fekszik; 2023-ban az UNESCO felvette az ókori Saba királyság nevezetességeit, a gátat, az Awam-templomot és másokat a világörökségi listára, és azonnal a veszélyeztetett helyek listájára is. Az Awam-templomot ma is Mahram Bilqisnak hívják, a királynő arab neve után."
  fi:
    - "Saba on Lounais-Arabian valtakunta, nykyinen Jemen, pääkaupunkinaan Marib aavikon reunalla Sanaasta itään, missä Wadi Adhanah lähtee vuorilta. Sen eteläarabialaiset kirjoitukset alkavat 700-luvulla eaa.; hallitsijat rakensivat Maribin suuren padon kastelemaan keidasta ja kuujumala Almaqahin temppelin Awamiin. Saba rikastui suitsukkeesta ja mirhasta, joita karavaanit kuljettivat suitsuketietä Gazaan ja Damaskokseen. Assyrian kuninkaat kirjaavat lahjoja Saban Itamralta ja Karibilulta (700-luvun lopulla ja 600-luvun alussa), nimet vastaavat hallitsijoita Yitha'amaria ja Karib'ilia. 1. Mooseksen kirja luettelee Saban Kusin, Joktanin ja Keturan jälkeläisten joukossa, ikään kuin nimi ulottuisi Punaisenmeren ja Pohjois-Arabian yli. Josephuksen mukaan kuningatar hallitsi Egyptiä ja Etiopiaa, ja etiopialainen Kebra Nagast kertoo Makedan synnyttäneen Salomon pojan Menelikin."
    - "Saban kuningatar, kuultuaan Salomon maineesta, ”tuli koettelemaan häntä arvoituksilla” kameleineen, jotka kantoivat hajuaineita, ”kultaa ylen paljon ja kalliita kiviä”; hän antoi hänelle sata kaksikymmentä talenttia kultaa, ja ”Niin paljon hajuaineita, kuin mitä Saban kuningatar antoi kuningas Salomolle, ei sinne ole sen jälkeen tullut”, ja Salomo antoi hänelle kaiken, mitä hän halusi, ennen kuin hän lähti kotiin. Jeesus kutsui häntä etelän kuningattareksi, joka ”tuli maan ääristä kuulemaan Salomon viisautta”."
    - "Profeetat ja psalmit säilyttävät Saban kullan ja suitsukkeen maana: ”Saban ja Seban kuninkaat veroa maksavat”, ”hänelle tuotakoon Saban kultaa”; Jesaja näkee, kuinka ”kaikki tulevat Sabasta” kantaen kultaa ja suitsutusta Siioniin, Jeremia kysyy, mitä hyötyä on ”suitsutuksesta, joka tulee Sabasta”, ja Hesekiel laskee Saban ja Raeman kauppiaat, ”kaikkinaisilla parhailla balsameilla”, Tyroksen kauppiaiden joukkoon. Job tuntee Saban karavaanit, ja sabalaiset ryöstäjät veivät hänen raavaansa; Joel kutsuu sabalaisia ”kaukaiseksi kansaksi”."
    - "Kreikkalaiset kirjoittajat tunsivat sabalaiset arabien rikkaimpina. 1. vuosisadalta eaa. himyarit nousivat heidän tilalleen, ja Maribin pato, joka lopulta murtui 500-luvulla jaa., muistetaan Koraanissa. Marib on nykyään sotatilassa; vuonna 2023 UNESCO merkitsi muinaisen Saban valtakunnan nähtävyydet, padon, Awamin temppelin ja muita, maailmanperintöluetteloon ja heti myös vaarantuneiden kohteiden luetteloon. Awamin temppeliä kutsutaan yhä nimellä Mahram Bilqis, kuningattaren arabialaisen nimen mukaan."
  vi:
    - "Sê-ba là Saba, vương quốc ở tây nam A-ra-bi, nay thuộc Yemen, với kinh đô Marib ở rìa sa mạc phía đông Sanaa, nơi Wadi Adhanah rời khỏi núi. Các bia ký của chính nó, bằng chữ Nam A-ra-bi, bắt đầu từ thế kỷ 8 TCN; các nhà cai trị của nó xây Đập Lớn Marib để tưới ốc đảo và đền thờ thần mặt trăng Almaqah ở Awam. Saba giàu lên nhờ nhũ hương và một dược, được các đoàn lạc đà chở lên con đường hương liệu đến Ga-xa và Đa-mách. Các vua A-si-ri cuối thế kỷ 8 và đầu thế kỷ 7 ghi lại quà của Itamra và Karibilu của Saba, các tên khớp với các nhà cai trị Saba là Yitha'amar và Karib'il. Sáng Thế Ký liệt kê một Sê-ba trong số hậu duệ của Cút, của Giốc-tan và của Kê-tu-ra, như thể cái tên trải qua Biển Đỏ và bắc A-ra-bi. Josephus coi nữ vương là người cai trị Ai Cập và Ê-thi-ô-bi, và Kebra Nagast của Ê-thi-ô-bi kể Makeda sinh con trai của Sa-lô-môn là Menelik."
    - "Nữ vương Sê-ba, nghe danh tiếng Sa-lô-môn, “bèn đến hỏi thử Sa-lô-môn nhiều câu đố”, với “lạc đà chở thuốc thơm, nhiều vàng và ngọc”; bà dâng ông “một trăm hai mươi ta lâng vàng”, và “chẳng hề có ai đem thuốc thơm đến số nhiều bằng” của bà, và ông ban cho bà mọi điều bà ước muốn trước khi bà về xứ. Chúa Giê-su gọi bà là “nữ hoàng nam phương”, người “từ nơi cùng trái đất đến nghe lời khôn ngoan vua Sa-lô-môn”."
    - "Các nhà tiên tri và thi thiên giữ Sê-ba là xứ vàng và nhũ hương: “Vua Sa-ba và vua Sê-ba sẽ cống lễ cho người”, “thiên hạ sẽ dâng vàng Sa-ba cho người”; Ê-sai thấy “hết thảy những người Sê-ba đem vàng và nhũ hương đến” Si-ôn, Giê-rê-mi hỏi nhũ hương “đến từ Sê-ba” có ích gì, và Ê-xê-chi-ên kể các con buôn ở Sê-ba và Ra-ê-ma, với “mọi thứ hương tốt nhất”, trong số thương nhân của Ty-rơ. Gióp biết các đoàn lữ hành Sê-ba, và quân Sê-ba cướp bò của ông; Giô-ên gọi người Sê-ba là “dân ở xa cách”."
    - "Các tác giả Hy Lạp biết người Saba là dân giàu nhất trong người A-ráp. Từ thế kỷ 1 TCN, người Himyar trỗi dậy thay họ, và đập Marib, cuối cùng vỡ vào thế kỷ 6, được nhớ đến trong Quran. Marib ngày nay nằm trong vùng chiến sự; năm 2023, UNESCO ghi danh các địa danh của vương quốc Saba cổ, đập, đền Awam và những nơi khác, vào Danh sách Di sản Thế giới và ngay lập tức vào danh sách các địa điểm nguy cấp. Đền Awam vẫn được gọi là Mahram Bilqis, theo tên A-ráp của nữ vương."
  ro:
    - "Seba este Saba, regatul din sud-vestul Arabiei, actualul Yemen, cu capitala Marib, la marginea deșertului, la est de Sanaa, unde Wadi Adhanah iese din munți. Inscripțiile ei sud-arabice încep în secolul al VIII-lea î.Hr.; regii ei au construit Marele Baraj de la Marib, pentru oază, și templul zeului-lună Almaqah de la Awam. Saba s-a îmbogățit din tămâie și smirnă, duse cu caravanele pe drumul tămâii spre Gaza și Damasc. Regii asirieni din secolele al VIII-lea–al VII-lea î.Hr. consemnează daruri de la Itamra și Karibilu din Saba, nume ale conducătorilor sabeeni Yitha'amar și Karib'il. Geneza înșiră un Seba printre descendenții lui Cuș, Ioctan și Chetura, ca și cum numele ar fi trecut Marea Roșie, spre nordul Arabiei. Iosif Flaviu a făcut regina domnitoare a Egiptului și Etiopiei, iar Kebra Nagast etiopian povestește cum Makeda l-a născut pe Menelik, fiul lui Solomon."
    - "Regina din Seba, auzind de faima lui Solomon, a venit să-l încerce cu întrebări grele, cu cămile încărcate cu mirodenii, mult aur și pietre scumpe; i-a dat o sută douăzeci de talanți de aur, nu a mai venit niciodată o asemenea mulțime de mirodenii, iar el i-a dat tot ce a dorit înainte de a se întoarce acasă. Isus a numit-o împărăteasa de la miazăzi, care „a venit dela marginile pământului să auză înțelepciunea lui Solomon”."
    - "Profeții și psalmii păstrează Seba ca țară a aurului și a tămâiei: regii Sebei și ai Sevei vor aduce daruri, i se va da din aurul Sebei; Isaia vede că „toți din Sava vor venì aducând aur, tămâie vor aduce”, Ieremia întreabă ce rost are „tămâie dela Sava”, iar Ezechiel numără negustorii din Seba și Raama, cu cele mai alese mirodenii, printre negustorii Tirului. Iov cunoaște caravanele Sebei, iar prădători sabeeni i-au luat boii; Ioel numește pe sabeeni un popor îndepărtat, „la neam departe”."
    - "Scriitorii greci îi cunoșteau pe sabeeni drept cei mai bogați dintre arabi. Din secolul I î.Hr., himyariții s-au ridicat în locul lor, iar barajul de la Marib, care a cedat în cele din urmă în secolul al VI-lea d.Hr., este amintit în Coran. Marib se află astăzi într-o zonă de război; în 2023, UNESCO a înscris reperele vechiului regat Saba, barajul, templul de la Awam și altele, pe Lista Patrimoniului Mondial și, deodată, pe lista siturilor în pericol. Templul de la Awam se numește încă Mahram Bilqis, după numele arab al reginei."
  bg:
    - "Шева е Саба, царството в Югозападна Арабия, в днешния Йемен, със столица Мариб на края на пустинята източно от Сана, където Уади Адхана излиза от планините. Собствените му надписи, на южноарабско писмо, започват през VIII в. пр.н.е.; владетелите му построили Големия бент на Мариб, за да напоява оазиса, и храма на лунния бог Алмаках в Аувам. Саба забогатяла от тамян и смирна, пренасяни с кервани по пътя на тамяна до Газа и Дамаск. Асирийски царе от края на VIII и началото на VII в. записват дарове от Итамра и Карибилу от Саба — имена, съответстващи на сабейските владетели Йитаамар и Кариб'ил. Битие изброява Шева сред потомците на Куш, на Йоктан и на Хетура, сякаш името се простирало отвъд Червено море и в Северна Арабия. Йосиф Флавий прави царицата владетелка на Египет и Етиопия, а етиопската „Кебра Негаст“ разказва как Македа родила на Соломон сина Менелик."
    - "Шевската царица, като чула за славата на Соломон, „дойде за да го изкуси с гатанки“, с камили, натоварени с аромати, „с твърде много злато, и с многоценни камене“; тя му дала сто и двадесет таланта злато и „не дойде вече такова изобилие от аромати“, а той ѝ дал всичко, което желаела, преди да се върне у дома. Исус я нарича Южната царица, която „от краищата на земята дойде да чуе мъдростта Соломонова“."
    - "Пророците и псалмите пазят Шева като земя на златото и тамяна: „Царете на Шева и на Сева ще представят дарове“, „ще му се даде от Шевското злато“; Исаия вижда как „Всичките от Сава ще дойдат“ и ще донесат злато и тамян в Сион, Йеремия пита за какво му е „ливанът що доносят от Сава“, а Йезекиил причислява търговците от Шева и Раама, с „всякакво изрядно благовоние“, към търговците на Тир. Йов познава керваните от Шева, а савейски грабители отвлекли воловете му; Йоил нарича савейците „народ далечен“."
    - "Гръцките автори познавали сабейците като най-богатите араби. От I в. пр.н.е. на тяхно място се издигнали химяритите, а бентът на Мариб, който окончателно се срутил през VI в. н.е., е споменат в Корана. Днес Мариб е във военна зона; през 2023 г. ЮНЕСКО вписа забележителностите на древното царство Саба — бента, храма Аувам и други — в списъка на световното наследство и едновременно в списъка на застрашените обекти. Храмът Аувам и днес се нарича Махрам Билкис, по арабското име на царицата."
