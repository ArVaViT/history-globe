body:
  en:
    - "Hanes is named once, in Isaiah's warning to the men of Judah who went down to Egypt for help: “For his princes were at Zoan, and his ambassadors came to Hanes.” It has not been identified for certain. Many commentators take it to be Heracleopolis Magna, Egyptian Hut-nen-nesut, Coptic Hnes, today Ihnasya el-Medina, the capital of the twentieth nome of Upper Egypt west of Beni Suef, a city whose ram-headed god the Greeks equated with Heracles; the name fits closely, and the map follows this."
    - "Others, among them the Swiss Egyptologist Édouard Naville, who excavated at Ihnasya, held that the verse points to a place in the Delta, nearer to Judah than Zoan (Tanis). The Aramaic Targum renders Hanes as Tahpanhes, the frontier fortress of the eastern Delta, while the Greek Septuagint did not know the name and translated the line instead. The International Standard Bible Encyclopedia calls all the proposals little more than clever guesses."
  ru:
    - "Ханес назван один раз, в предостережении Исаии иудеям, которые шли в Египет за помощью: «потому что князья его уже в Цоане, и послы его дошли до Ханеса». Надёжно он не отождествлён. Многие толкователи видят в нём Гераклеополь Великий, египетский Хут-нен-несут, коптский Хнес, ныне Ихнасья-эль-Мадина, столицу двадцатого нома Верхнего Египта к западу от Бени-Суэфа, город, чьего барана-бога греки отождествили с Гераклом; имя близко совпадает, и карта следует этому."
    - "Другие, в том числе швейцарский египтолог Эдуар Навиль, раскапывавший Ихнасью, считали, что стих указывает на место в Дельте, ближе к Иудее, чем Цоан (Танис). Арамейский Таргум передаёт Ханес как Тафнис, пограничную крепость восточной Дельты, а греческая Септуагинта не знала этого имени и перевела строку по смыслу. Международная стандартная библейская энциклопедия называет все предложения немногим более чем остроумными догадками."
  uk:
    - "Ханес названий один раз, у застереженні Ісаї юдеям, що ходили до Єгипту по допомогу: «Князї твої прийдуть у Зоан-город, а посли твої зійдуть аж до Ханесу». Його не ототожнено напевно. Багато коментаторів вважають його Гераклеополем Великим, єгипетським Хут-нен-несут, коптським Хнес, нині Ігнасія-ель-Медіна, столицею двадцятого нома Верхнього Єгипту на захід від Бені-Суефа, міста, чиє божество з бараньою головою греки прирівнювали до Геракла; назва тісно збігається, і мапа йде за цим."
    - "Інші, серед них швейцарський єгиптолог Едуар Навіль, який розкопував в Ігнасії, вважали, що вірш вказує на місце в дельті, ближче до Юдеї, ніж Цоан (Таніс). Арамейський таргум передає Ханес як Тафніс, прикордонну фортецю східної дельти, тоді як грецька Септуагінта не знала цієї назви й натомість переклала рядок. International Standard Bible Encyclopedia називає всі пропозиції лише дотепними здогадами."
  es:
    - "Hanes se nombra una vez, en la advertencia de Isaías a los hombres de Judá que bajaban a Egipto en busca de ayuda: «Cuando estarán sus príncipes en Zoán, y sus embajadores habrán llegado á Hanes». No ha sido identificada con certeza. Muchos comentaristas la toman por Heracleópolis Magna, en egipcio Hut-nen-nesut, en copto Hnes, hoy Ihnasya el-Medina, la capital del nomo vigésimo del Alto Egipto, al oeste de Beni Suef, ciudad cuyo dios de cabeza de carnero los griegos equipararon con Heracles; el nombre encaja de cerca, y el mapa lo sigue."
    - "Otros, entre ellos el egiptólogo suizo Édouard Naville, que excavó en Ihnasya, sostuvieron que el versículo apunta a un lugar del Delta, más cercano a Judá que Zoán (Tanis). El Targum arameo traduce Hanes por Tafnes, la fortaleza fronteriza del Delta oriental, mientras que la Septuaginta griega no conocía el nombre y tradujo en cambio la frase. La International Standard Bible Encyclopedia califica todas las propuestas de poco más que conjeturas ingeniosas."
  pt:
    - "Hanes é nomeada uma vez, na advertência de Isaías aos homens de Judá que desciam ao Egito em busca de ajuda: “Pois os seus príncipes estão em Zoã, e os seus embaixadores chegaram a Hanes.” Não foi identificada com certeza. Muitos comentaristas a tomam por Heracleópolis Magna, em egípcio Hut-nen-nesut, em copta Hnes, hoje Ihnasya el-Medina, capital do vigésimo nomo do Alto Egito, a oeste de Beni Suef, cidade cujo deus de cabeça de carneiro os gregos equiparavam a Héracles; o nome combina de perto, e o mapa segue essa opinião."
    - "Outros, entre eles o egiptólogo suíço Édouard Naville, que escavou em Ihnasya, sustentaram que o versículo aponta para um lugar do Delta, mais perto de Judá do que Zoã (Tânis). O Targum aramaico traduz Hanes por Tafnes, a fortaleza de fronteira do Delta oriental, enquanto a Septuaginta grega não conhecia o nome e traduziu a linha em vez disso. A International Standard Bible Encyclopedia chama todas as propostas pouco mais que palpites engenhosos."
  de:
    - "Hanes wird einmal genannt, in Jesajas Warnung an die Männer Judas, die nach Ägypten hinabzogen, um Hilfe zu holen: „Ihre Fürsten sind wohl zu Zoan gewesen und ihre Botschafter gen Hanes gekommen“. Es ist nicht sicher identifiziert. Viele Ausleger halten es für Herakleopolis Magna, ägyptisch Hut-nen-nesut, koptisch Hnes, heute Ihnasja el-Medina, die Hauptstadt des zwanzigsten oberägyptischen Gaus westlich von Beni Suef, eine Stadt, deren widderköpfigen Gott die Griechen mit Herakles gleichsetzten; der Name passt eng, und die Karte folgt dem."
    - "Andere, darunter der Schweizer Ägyptologe Édouard Naville, der in Ihnasja grub, hielten den Vers für einen Hinweis auf einen Ort im Delta, Juda näher als Zoan (Tanis). Der aramäische Targum gibt Hanes mit Tachpanhes wieder, der Grenzfestung des östlichen Deltas, während die griechische Septuaginta den Namen nicht kannte und die Zeile stattdessen übersetzte. Die International Standard Bible Encyclopedia nennt alle Vorschläge kaum mehr als geschickte Vermutungen."
  it:
    - "Canes è nominata una sola volta, nell’avvertimento di Isaia agli uomini di Giuda che scendevano in Egitto in cerca di aiuto: «I principi di Giuda son già a Tsoan, e i suoi ambasciatori son già arrivati a Hanes». Non è stata identificata con certezza. Molti commentatori la ritengono Eracleopoli Magna, in egizio Hut-nen-nesut, in copto Hnes, oggi Ihnasya el-Medina, capitale del ventesimo nomo dell’Alto Egitto a ovest di Beni Suef, città il cui dio dalla testa di ariete i Greci equiparavano a Eracle; il nome corrisponde da vicino, e la carta segue questa ipotesi."
    - "Altri, tra cui l’egittologo svizzero Édouard Naville, che scavò a Ihnasya, ritennero che il versetto indichi un luogo del Delta, più vicino a Giuda di Tanis. Il Targum aramaico rende Canes con Tafni, la fortezza di frontiera del Delta orientale, mentre la Settanta greca non conosceva il nome e tradusse invece la frase. La International Standard Bible Encyclopedia definisce tutte le proposte poco più che congetture ingegnose."
  fr:
    - "Hanès n’est nommé qu’une fois, dans l’avertissement d’Ésaïe aux hommes de Juda qui descendaient en Égypte chercher du secours : « Déjà ses princes sont à Tsoan, et ses envoyés ont atteint Hanès. » Il n’a pas été identifié avec certitude. Bien des commentateurs y voient Héracléopolis Magna, en égyptien Hout-nen-nesout, en copte Hnès, aujourd’hui Ihnasya el-Medina, capitale du vingtième nome de Haute-Égypte à l’ouest de Beni Souef, ville dont le dieu à tête de bélier était assimilé par les Grecs à Héraclès ; le nom s’accorde de près, et la carte suit cet avis."
    - "D’autres, dont l’égyptologue suisse Édouard Naville, qui fouilla à Ihnasya, tenaient que le verset désigne un lieu du Delta, plus proche de Juda que Tsoan (Tanis). Le Targum araméen rend Hanès par Tachpanès (Tahpanhes), la forteresse frontière du Delta oriental, tandis que la Septante grecque ne connaissait pas le nom et a traduit la ligne autrement. L’International Standard Bible Encyclopedia ne voit dans toutes les propositions guère plus que d’ingénieuses conjectures."
  nl:
    - "Chanes wordt eenmaal genoemd, in Jesaja's waarschuwing aan de mannen van Juda die naar Egypte afdaalden om hulp: “Wanneer zijn vorsten zullen geweest zijn tot Zoan, en zijn gezanten zullen gekomen zijn tot nabij Chanes.” Het is niet met zekerheid geïdentificeerd. Veel uitleggers houden het voor Herakleopolis Magna, Egyptisch Hut-nen-nesut, Koptisch Hnes, tegenwoordig Ihnasya el-Medina, de hoofdstad van de twintigste nomos van Opper-Egypte ten westen van Beni Suef, een stad wier ramshoofdige god de Grieken met Herakles gelijkstelden; de naam past nauw, en de kaart volgt dit."
    - "Anderen, onder wie de Zwitserse egyptoloog Édouard Naville, die bij Ihnasya groef, meenden dat het vers wijst op een plaats in de Delta, dichter bij Juda dan Zoan (Tanis). De Aramese Targum geeft Chanes weer als Tachpanhes, de grensvesting van de oostelijke Delta, terwijl de Griekse Septuaginta de naam niet kende en de regel in plaats daarvan vertaalde. De International Standard Bible Encyclopedia noemt alle voorstellen weinig meer dan slimme gissingen."
  cs:
    - "Chanes je jmenováno jednou, v Izajášově varování mužům judským, kteří sestupovali do Egypta pro pomoc: „Proto že knížata jeho byli v Soan, a poslové jeho do Chanes chodili.“ Nebylo s jistotou určeno. Mnozí vykladači je pokládají za Hérakleopolis Magnu, egyptsky Hut-nen-nesut, koptsky Hnes, dnes Ihnasja el-Medina, hlavní město dvacátého nomu Horního Egypta západně od Bani Suvajfu, město, jehož božstvo s beraní hlavou Řekové ztotožňovali s Héraklem; jméno se těsně shoduje a mapa tento názor sleduje."
    - "Jiní, mezi nimi švýcarský egyptolog Édouard Naville, který v Ihnasji kopal, soudili, že verš ukazuje na místo v Deltě, blíže k Judsku než Coan (Tanis). Aramejský targum překládá Chanes jako Tachpanchés, pohraniční pevnost východní Delty, zatímco řecká Septuaginta jméno neznala a řádek přeložila jinak. International Standard Bible Encyclopedia nazývá všechny návrhy téměř jen důvtipnými dohady."
  pl:
    - "Chanes jest wymienione raz, w ostrzeżeniu Izajasza dla mieszkańców Judy, którzy zeszli do Egiptu po pomoc: „Przeto, że byli w Soan książęta jego, a posłowie jego do Chanes chodzili”. Nie zidentyfikowano go z pewnością. Wielu komentatorów uważa je za Herakleopolis Wielką, egipskie Hut-nen-nesut, koptyjskie Hnes, dziś Ihnasja al-Madina, stolicę dwudziestego nomu Górnego Egiptu na zachód od Beni Suef, miasto, którego barani bóg był przez Greków utożsamiany z Heraklesem; nazwa pasuje ściśle i mapa idzie za tym."
    - "Inni, wśród nich szwajcarski egiptolog Édouard Naville, który prowadził wykopaliska w Ihnasji, sądzili, że werset wskazuje miejsce w Delcie, bliższe Judy niż Soan (Tanis). Targum aramejski oddaje Chanes jako Tachpanches, twierdzę graniczną wschodniej Delty, podczas gdy grecka Septuaginta nie znała tej nazwy i przetłumaczyła ten wers inaczej. International Standard Bible Encyclopedia nazywa wszystkie propozycje niewiele więcej niż zręcznymi domysłami."
  sv:
    - "Hanes nämns en gång, i Jesajas varning till Judas män som drog ned till Egypten för att söka hjälp: ”Ty om ock hans furstar äro i Soan, och om än hans sändebud komma ända till Hanes”. Den har inte identifierats med säkerhet. Många kommentatorer tar den för Herakleopolis Magna, egyptiska Hut-nen-nesut, koptiska Hnes, i dag Ihnasya el-Medina, huvudstad i Övre Egyptens tjugonde nom väster om Beni Suef, en stad vars vädurshövdade gud grekerna likställde med Herakles; namnet passar nära, och kartan följer detta."
    - "Andra, bland dem den schweiziske egyptologen Édouard Naville som grävde i Ihnasya, menade att versen pekar på en plats i deltat, närmare Juda än Soan (Tanis). Det arameiska targumet återger Hanes som Tachpanches, gränsfästningen i östra deltat, medan den grekiska Septuaginta inte kände namnet och i stället översatte raden. International Standard Bible Encyclopedia kallar alla förslagen föga mer än kvicka gissningar."
  nb:
    - "Hanes nevnes én gang, i Jesajas advarsel til Judas menn som dro ned til Egypt for å søke hjelp: «For deres fyrster er kommet til Soan, og deres sendebud kommer like til Hanes.» Den er ikke identifisert med sikkerhet. Mange kommentatorer tar den for å være Herakleopolis Magna, egyptisk Hut-nen-nesut, koptisk Hnes, i dag Ihnasya el-Medina, hovedstaden i det tjuende nomos i Øvre Egypt vest for Beni Suef, en by hvis værhodede gud grekerne likestilte med Herakles; navnet passer nøye, og kartet følger dette."
    - "Andre, blant dem den sveitsiske egyptologen Édouard Naville, som gravde ut ved Ihnasya, mente at verset peker på et sted i deltaet, nærmere Juda enn Soan (Tanis). Det arameiske targumet gjengir Hanes som Tahpanhes, grensefestningen i det østlige deltaet, mens den greske Septuaginta ikke kjente navnet og oversatte linjen i stedet. International Standard Bible Encyclopedia kaller alle forslagene lite mer enn kloke gjetninger."
