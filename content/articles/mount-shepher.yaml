# Overview article (ADR 0007). Mainstream facts only; a wilderness station known only from the itinerary of Numbers 33; nothing is known of it, and the article says so.
id: mount-shepher
place: a39fe14
title:
  en: "Mount Shepher"
  ru: "Гора Шафер"
  uk: "Гора Шафер"
  es: "Monte Sefer"
  pt: "Monte Séfer"
  de: "Berg Schefer"
  fr: "Mont Schapher"
body:
  en:
    - "Mount Shepher, in the King James Version “mount Shapher”, is one of the camps of Israel in the wilderness listed only in the itinerary of Numbers 33: “And they went from Kehelathah, and pitched in mount Shapher. And they removed from mount Shapher, and encamped in Haradah.” The name may mean “beauty” or “fairness”. Like most of the stations between Hazeroth and Ezion-geber, it appears nowhere else, and the list gives no event, water or landmark to fix it."
    - "Its site is unknown. The map draws it within about 50 km of Haradah, itself unplaced, and marks one proposal, Jebel Araif en-Naqa in the north-eastern Sinai near the Negev border, a conspicuous peak in a region where some reconstructions of the route pass. Others leave the whole sequence of camps unlocated, and there is no ancient tradition to choose between them."
  ru:
    - "Гора Шафер — один из станов Израиля в пустыне, известный только по перечню в 33-й главе книги Чисел: «И отправились из Кегелафы и расположились станом на горе Шафер. И отправились от горы Шафер и расположились станом в Хараде». Имя, возможно, значит «красота». Как и большинство станов между Асирофом и Ецион-Гавером, она больше нигде не упоминается, а перечень не называет ни события, ни воды, ни приметы, по которой её можно было бы найти."
    - "Местоположение неизвестно. На карте она помещена в радиусе примерно 50 км от Харады, которая и сама не найдена, и отмечено одно предположение — Джебель-Араиф-эн-Нака на северо-востоке Синая у границы Негева, заметная вершина в краю, через который проходят некоторые реконструкции пути. Другие оставляют весь этот ряд станов неопределённым, и древнего предания, которое помогло бы выбрать, нет."
  uk:
    - "Гора Шафер, у Біблії короля Якова «mount Shapher», — один із таборів Ізраїлю в пустелі, перелічений лише в маршруті Книги Чисел, розділ 33: «І рушили з Кегелата та й отаборились під Шефер горою. І рушили від Шефер гори та й отаборились у Гарадї.» Назва може означати «краса» або «гожість». Як і більшість стоянок між Хацеротом і Ецйон-Гевером, вона більше ніде не з’являється, і перелік не дає ні події, ні води, ні орієнтира, щоб її визначити."
    - "Місце її невідоме. Мапа креслить її в межах приблизно 50 км від Харади, самої не розміщеної, і позначає одну пропозицію, Джебель-Арейф-ен-Нака на північному сході Синаю біля кордону Негеву, помітну вершину в краї, через який проходять деякі реконструкції маршруту. Інші залишають усю послідовність таборів нерозміщеною, і немає давньої традиції, яка дозволила б обрати між ними."
  es:
    - "El monte Sefer, en la versión del rey Jacobo «mount Shapher», es uno de los campamentos de Israel en el desierto enumerados solo en el itinerario de Números 33: «Y partidos de Ceelatha, asentaron en el monte de Sepher. Y partidos del monte de Sepher, asentaron en Harada». El nombre puede significar «belleza» o «hermosura». Como la mayoría de las estaciones entre Haserot y Ezión-geber, no aparece en ningún otro lugar, y la lista no da ningún suceso, agua o punto de referencia que lo fije."
    - "Su emplazamiento se desconoce. El mapa lo traza a menos de unos 50 km de Harada, ella misma sin localizar, y marca una propuesta, el Yebel Araif en-Naqa, en el nordeste del Sinaí, cerca de la frontera del Néguev, un pico conspicuo en una región por donde pasan algunas reconstrucciones de la ruta. Otros dejan sin localizar toda la secuencia de campamentos, y no hay tradición antigua que permita elegir entre ellos."
  pt:
    - "O monte Séfer, na King James Version “mount Shapher”, é um dos acampamentos de Israel no deserto listados apenas no itinerário de Números 33: “Partiram de Queelata e acamparam no monte Sefer. Partiram do monte Sefer e acamparam em Harada.” O nome pode significar “beleza” ou “formosura”. Como a maioria das etapas entre Hazerote e Eziom-Geber, não aparece em nenhum outro lugar, e a lista não dá acontecimento, água ou marco que o fixe."
    - "Seu sítio é desconhecido. O mapa o traça a até uns 50 km de Harada, ela própria sem localização, e marca uma proposta, Jebel Araif en-Naqa, no nordeste do Sinai, perto da fronteira do Neguebe, um pico conspícuo numa região por onde passam algumas reconstruções da rota. Outros deixam toda a sequência de acampamentos sem localização, e não há tradição antiga para escolher entre eles."
  de:
    - "Der Berg Schefer, in der King-James-Version „mount Shapher“, ist eines der Lager Israels in der Wüste, nur in der Reisebeschreibung von 4. Mose 33 aufgeführt: „Von Kehelatha zogen sie aus und lagerten sich im Gebirge Sepher. Vom Gebirge Sepher zogen sie aus und lagerten sich in Harada.“ Der Name bedeutet vielleicht „Schönheit“ oder „Anmut“. Wie die meisten Stationen zwischen Hazerot und Ezjon-Geber erscheint er sonst nirgends, und die Liste nennt kein Ereignis, kein Wasser und kein Wahrzeichen, das ihn festlegen könnte."
    - "Seine Lage ist unbekannt. Die Karte setzt ihn im Umkreis von etwa 50 km um Harada, das selbst nicht lokalisiert ist, und zeigt einen Vorschlag, den Jebel Araif en-Naqa im nordöstlichen Sinai nahe der Negev-Grenze, einen auffälligen Gipfel in einer Gegend, durch die manche Rekonstruktionen der Route führen. Andere lassen die ganze Lagerfolge unlokalisiert, und es gibt keine antike Überlieferung, die zwischen ihnen entscheiden könnte."
  fr:
    - "Le mont Schapher, Shapher dans la version du roi Jacques, est l’un des campements d’Israël dans le désert, listés seulement dans l’itinéraire de Nombres 33 : « Ils partirent de Kehélatha, et campèrent à la montagne de Schapher. Ils partirent de la montagne de Schapher, et campèrent à Harada. » Le nom peut signifier « beauté » ou « grâce ». Comme la plupart des étapes entre Hatséroth et Étsjon-Guéber, il n’apparaît nulle part ailleurs, et la liste ne donne ni événement, ni eau, ni repère pour le fixer."
    - "Son site est inconnu. La carte le dessine à environ 50 km de Harada, elle-même non située, et marque une proposition, le djebel Araif en-Naqa dans le nord-est du Sinaï près de la frontière du Négev, sommet bien visible dans une région où passent certaines reconstitutions de l’itinéraire. D’autres laissent toute la suite des campements non située, et aucune tradition ancienne ne permet de choisir."
scripture:
  - Num.33.23-Num.33.24
sources:
