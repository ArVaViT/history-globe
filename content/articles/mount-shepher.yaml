# Overview article (ADR 0007). Mainstream facts only; a wilderness station known only from the itinerary of Numbers 33; nothing is known of it, and the article says so.
id: mount-shepher
place: a39fe14
title:
  en: "Mount Shepher"
  ru: "Гора Шафер"
  uk: "Гора Шафер"
  es: "Monte Sefer"
  pt: "Monte Séfer"
  de: "Berg Schefer"
  fr: "Mont Schapher"
  it: "Monte Sefer"
  pl: "Góra Szefer"
  nl: "Berg Sefer"
  cs: "Hora Šefer"
  sv: "Berget Shefer"
