  sr: "Гора Сафер"
body:
  en:
    - "Mount Shepher, in the King James Version “mount Shapher”, is one of the camps of Israel in the wilderness listed only in the itinerary of Numbers 33: “And they went from Kehelathah, and pitched in mount Shapher. And they removed from mount Shapher, and encamped in Haradah.” The name may mean “beauty” or “fairness”. Like most of the stations between Hazeroth and Ezion-geber, it appears nowhere else, and the list gives no event, water or landmark to fix it."
    - "Its site is unknown. The map draws it within about 50 km of Haradah, itself unplaced, and marks one proposal, Jebel Araif en-Naqa in the north-eastern Sinai near the Negev border, a conspicuous peak in a region where some reconstructions of the route pass. Others leave the whole sequence of camps unlocated, and there is no ancient tradition to choose between them."
  ru:
    - "Гора Шафер — один из станов Израиля в пустыне, известный только по перечню в 33-й главе книги Чисел: «И отправились из Кегелафы и расположились станом на горе Шафер. И отправились от горы Шафер и расположились станом в Хараде». Имя, возможно, значит «красота». Как и большинство станов между Асирофом и Ецион-Гавером, она больше нигде не упоминается, а перечень не называет ни события, ни воды, ни приметы, по которой её можно было бы найти."
    - "Местоположение неизвестно. На карте она помещена в радиусе примерно 50 км от Харады, которая и сама не найдена, и отмечено одно предположение — Джебель-Араиф-эн-Нака на северо-востоке Синая у границы Негева, заметная вершина в краю, через который проходят некоторые реконструкции пути. Другие оставляют весь этот ряд станов неопределённым, и древнего предания, которое помогло бы выбрать, нет."
  uk:
    - "Гора Шафер, у Біблії короля Якова «mount Shapher», — один із таборів Ізраїлю в пустелі, перелічений лише в маршруті Книги Чисел, розділ 33: «І рушили з Кегелата та й отаборились під Шефер горою. І рушили від Шефер гори та й отаборились у Гарадї.» Назва може означати «краса» або «гожість». Як і більшість стоянок між Хацеротом і Ецйон-Гевером, вона більше ніде не з’являється, і перелік не дає ні події, ні води, ні орієнтира, щоб її визначити."
    - "Місце її невідоме. Мапа креслить її в межах приблизно 50 км від Харади, самої не розміщеної, і позначає одну пропозицію, Джебель-Арейф-ен-Нака на північному сході Синаю біля кордону Негеву, помітну вершину в краї, через який проходять деякі реконструкції маршруту. Інші залишають усю послідовність таборів нерозміщеною, і немає давньої традиції, яка дозволила б обрати між ними."
  es:
    - "El monte Sefer, en la versión del rey Jacobo «mount Shapher», es uno de los campamentos de Israel en el desierto enumerados solo en el itinerario de Números 33: «Y partidos de Ceelatha, asentaron en el monte de Sepher. Y partidos del monte de Sepher, asentaron en Harada». El nombre puede significar «belleza» o «hermosura». Como la mayoría de las estaciones entre Haserot y Ezión-geber, no aparece en ningún otro lugar, y la lista no da ningún suceso, agua o punto de referencia que lo fije."
    - "Su emplazamiento se desconoce. El mapa lo traza a menos de unos 50 km de Harada, ella misma sin localizar, y marca una propuesta, el Yebel Araif en-Naqa, en el nordeste del Sinaí, cerca de la frontera del Néguev, un pico conspicuo en una región por donde pasan algunas reconstrucciones de la ruta. Otros dejan sin localizar toda la secuencia de campamentos, y no hay tradición antigua que permita elegir entre ellos."
  pt:
    - "O monte Séfer, na King James Version “mount Shapher”, é um dos acampamentos de Israel no deserto listados apenas no itinerário de Números 33: “Partiram de Queelata e acamparam no monte Sefer. Partiram do monte Sefer e acamparam em Harada.” O nome pode significar “beleza” ou “formosura”. Como a maioria das etapas entre Hazerote e Eziom-Geber, não aparece em nenhum outro lugar, e a lista não dá acontecimento, água ou marco que o fixe."
    - "Seu sítio é desconhecido. O mapa o traça a até uns 50 km de Harada, ela própria sem localização, e marca uma proposta, Jebel Araif en-Naqa, no nordeste do Sinai, perto da fronteira do Neguebe, um pico conspícuo numa região por onde passam algumas reconstruções da rota. Outros deixam toda a sequência de acampamentos sem localização, e não há tradição antiga para escolher entre eles."
  de:
    - "Der Berg Schefer, in der King-James-Version „mount Shapher“, ist eines der Lager Israels in der Wüste, nur in der Reisebeschreibung von 4. Mose 33 aufgeführt: „Von Kehelatha zogen sie aus und lagerten sich im Gebirge Sepher. Vom Gebirge Sepher zogen sie aus und lagerten sich in Harada.“ Der Name bedeutet vielleicht „Schönheit“ oder „Anmut“. Wie die meisten Stationen zwischen Hazerot und Ezjon-Geber erscheint er sonst nirgends, und die Liste nennt kein Ereignis, kein Wasser und kein Wahrzeichen, das ihn festlegen könnte."
    - "Seine Lage ist unbekannt. Die Karte setzt ihn im Umkreis von etwa 50 km um Harada, das selbst nicht lokalisiert ist, und zeigt einen Vorschlag, den Jebel Araif en-Naqa im nordöstlichen Sinai nahe der Negev-Grenze, einen auffälligen Gipfel in einer Gegend, durch die manche Rekonstruktionen der Route führen. Andere lassen die ganze Lagerfolge unlokalisiert, und es gibt keine antike Überlieferung, die zwischen ihnen entscheiden könnte."
  fr:
    - "Le mont Schapher, Shapher dans la version du roi Jacques, est l’un des campements d’Israël dans le désert, listés seulement dans l’itinéraire de Nombres 33 : « Ils partirent de Kehélatha, et campèrent à la montagne de Schapher. Ils partirent de la montagne de Schapher, et campèrent à Harada. » Le nom peut signifier « beauté » ou « grâce ». Comme la plupart des étapes entre Hatséroth et Étsjon-Guéber, il n’apparaît nulle part ailleurs, et la liste ne donne ni événement, ni eau, ni repère pour le fixer."
    - "Son site est inconnu. La carte le dessine à environ 50 km de Harada, elle-même non située, et marque une proposition, le djebel Araif en-Naqa dans le nord-est du Sinaï près de la frontière du Négev, sommet bien visible dans une région où passent certaines reconstitutions de l’itinéraire. D’autres laissent toute la suite des campements non située, et aucune tradition ancienne ne permet de choisir."
  it:
    - "Il Monte Sefer, nella King James Version «mount Shapher», è uno degli accampamenti d’Israele nel deserto elencati solo nell’itinerario di Numeri 33: «Partirono da Kehelatha e si accamparono al monte di Scefer. Partirono dal monte di Scefer e si accamparono a Harada». Il nome può significare «bellezza» o «bontà». Come la maggior parte delle tappe tra Cazerot ed Ezion-Gheber, non compare altrove, e l’elenco non dà alcun evento, acqua o punto di riferimento che lo fissi."
    - "Il suo sito è sconosciuto. La mappa lo disegna entro circa 50 km da Carada, a sua volta non localizzata, e segna una proposta, il Jebel Araif en-Naqa nel Sinai nord-orientale presso il confine con il Negheb, una vetta vistosa in una regione per cui passano alcune ricostruzioni del percorso. Altri lasciano l’intera sequenza degli accampamenti non localizzata, e non c’è alcuna tradizione antica per scegliere tra le ipotesi."
  pl:
    - "Góra Szefer, w Biblii Króla Jakuba góra Shapher, to jeden z obozów Izraela na pustyni, wymieniony tylko w itinerarium w Lb 33: „A ruszywszy się z Kieelata, położyli się obozem na górze Sefer. A ruszywszy się z góry Sefer, położyli się obozem w Charada.” Nazwa może znaczyć „piękno” albo „urodę”. Jak większość stacji między Chasserot a Esjon-Geber, nie pojawia się nigdzie indziej, a lista nie podaje żadnego wydarzenia, wody ani punktu orientacyjnego, który by ją ustalał."
    - "Jej położenie jest nieznane. Mapa rysuje ją w promieniu około 50 km od Charady, również niezlokalizowanej, i zaznacza jedną propozycję, Dżabal Araif en-Naqa w północno-wschodnim Synaju koło granicy z Negewem, rzucający się w oczy szczyt w regionie, przez który przechodzą niektóre rekonstrukcje trasy. Inni zostawiają całą sekwencję obozów niezlokalizowaną i nie ma starożytnej tradycji pozwalającej wybierać między nimi."
  nl:
    - "De Berg Sefer, in de King James Version “mount Shapher”, is een van de legerplaatsen van Israël in de woestijn die alleen genoemd worden in de reisbeschrijving van Numeri 33: “En zij verreisden van Kehelatha, en legerden zich in het gebergte van Safer. En zij verreisden van het gebergte Safer, en legerden zich in Harada.” De naam betekent misschien “schoonheid” of “bevalligheid”. Zoals de meeste pleisterplaatsen tussen Hazerot en Ezeon-Geber komt hij nergens anders voor, en de lijst geeft geen gebeurtenis, water of oriëntatiepunt om hem vast te leggen."
    - "De ligging is onbekend. De kaart tekent hem binnen ongeveer 50 km van Charada, dat zelf niet is geplaatst, en toont één voorstel, de Jebel Araif en-Naqa in het noordoosten van de Sinaï bij de Negevgrens, een opvallende piek in een streek waar sommige reconstructies van de route doorheen lopen. Anderen laten de hele reeks pleisterplaatsen ongelokaliseerd, en er is geen oude overlevering om tussen hen te kiezen."
  cs:
    - "Hora Šefer, v anglické Bibli krále Jakuba „mount Shapher“, je jeden z táborů Izraele na poušti uvedených jen v itineráři Numeri 33: „Z Cehelot pak hnuvše se, položili se na hoře Sefer. A když se hnuli s hory Sefer, položili se v Arad.“ Jméno může znamenat „krása“ nebo „sličnost“. Jako většina stanic mezi Chacerótem a Ecjon-geberem se nikde jinde neobjevuje a seznam neuvádí událost, vodu ani orientační bod, které by ji určily."
    - "Její poloha je neznámá. Mapa ji kreslí do vzdálenosti asi 50 km od Charady, sama neumístěné, a uvádí jeden návrh, Jebel Araif en-Naqa v severovýchodním Sinaji blízko negevské hranice, nápadný vrchol v oblasti, kudy vedou některé rekonstrukce trasy. Jiní ponechávají celé pořadí táborů neurčené a neexistuje žádná starověká tradice, která by mezi nimi rozhodla."
  sv:
    - "Berget Shefer, i King James-översättningen ”mount Shapher”, är ett av Israels läger i öknen som nämns endast i vandringsberättelsen i 4 Mos 33: ”Och de bröto upp från Kehelata och lägrade sig vid berget Sefer. Och de bröto upp från berget Sefer och lägrade sig i Harada.” Namnet kan betyda ”skönhet” eller ”behag”. Liksom de flesta stationerna mellan Haserot och Esjon-Geber förekommer det ingen annanstans, och förteckningen anger varken händelse, vatten eller landmärke som kan fastställa platsen."
    - "Platsen är okänd. Kartan placerar den inom cirka 50 km från Harada, som i sin tur inte är lokaliserad, och markerar ett förslag, Jebel Araif en-Naqa i nordöstra Sinai nära gränsen mot Negev, en framträdande bergstopp i en trakt som vissa rekonstruktioner av färdvägen går igenom. Andra lämnar hela raden av läger olokaliserad, och det finns ingen forntida tradition som kan avgöra valet mellan dem."
  nb:
    - "Sjefer-fjellet, i King James Version «mount Shapher», er en av Israels leirplasser i ørkenen og er bare nevnt i ferdaberetningen i 4. Mosebok 33: «Og de drog fra Kehelata og leiret sig ved Sefer-fjellet. Og de drog fra Sefer-fjellet og leiret sig i Harada.» Navnet kan bety «skjønnhet» eller «ynde». Som de fleste stasjonene mellom Haserot og Esjon-Geber forekommer det ikke andre steder, og listen gir ingen hendelse, noe vann eller noe landemerke som kan fastlegge det."
    - "Stedet er ukjent. Kartet tegner det inn innenfor omtrent 50 km fra Harada, som selv ikke er lokalisert, og markerer ett forslag, Jebel Araif en-Naqa i nordøstlige Sinai nær grensen til Negev, en iøynefallende topp i et område der noen rekonstruksjoner av ruten går. Andre lar hele rekken av leirplasser stå uten lokalisering, og det finnes ingen gammel tradisjon som kan avgjøre valget mellom dem."
  tl:
    - "Ang Bundok Sepher, na sa King James Version ay “mount Shapher”, ay isa sa mga kampamento ng Israel sa ilang na nakalista lamang sa itineraryo ng Mga Bilang 33: “At sila'y naglakbay mula sa Ceelatha at humantong sa bundok ng Sepher. At sila'y naglakbay mula sa bundok ng Sepher, at humantong sa Harada.” Maaaring nangangahulugan ang pangalan ng “kagandahan” o “kariktan”. Gaya ng karamihan sa mga himpilan sa pagitan ng Haseroth at Esion-geber, wala itong binabanggit saanman, at walang pangyayari, tubig o palatandaan sa listahan na makapagtatakda rito."
    - "Hindi alam ang kinaroroonan nito. Iginuguhit ito ng mapa sa loob ng humigit-kumulang 50 km mula sa Harada, na hindi rin matukoy ang lugar, at minamarkahan ang isang mungkahi, ang Jebel Araif en-Naqa sa hilagang-silangang Sinai malapit sa hangganan ng Negev, isang kapansin-pansing tuktok sa isang rehiyong dinaraanan ng ilang rekonstruksiyon ng ruta. Iniiwan ng iba na hindi matukoy ang buong sunud-sunod na mga kampamento, at walang sinaunang tradisyon na makapamimili sa pagitan ng mga ito."
  da:
    - "Bjerget Sjefer, i King James-oversættelsen »mount Shapher«, er en af Israels lejre i ørkenen, som kun er opregnet i rejseberetningen i 4 Mos 33: »Og de rejste fra Kehelath, og de lejrede sig paa Sefers Bjerg. Og de rejste fra Sefers Bjerg, og de lejrede sig i Harada.« Navnet kan betyde »skønhed« eller »ynde«. Ligesom de fleste stationer mellem Haserot og Esjon-Geber nævnes det ingen andre steder, og listen angiver hverken begivenhed, vand eller landemærke, som kunne fastlægge det."
    - "Dets beliggenhed er ukendt. Kortet tegner det inden for omkring 50 km fra Harada, som selv er uplaceret, og markerer ét forslag, Jebel Araif en-Naqa i det nordøstlige Sinai nær grænsen til Negev, en iøjnefaldende top i en egn, hvor nogle rekonstruktioner af ruten løber. Andre lader hele rækken af lejre være uplaceret, og der findes ingen gammel tradition, som kan afgøre valget mellem dem."
  sr:
    - "Гора Сафер, у Библији краља Џејмса „Маунт Шафер“, један је од израиљских логора у пустињи, поменут само у попису станица у 33. глави Књиге бројева: „А из Макелата отишавши стадоше у логор код горе Сафера. А од горе Сафера отишавши стадоше у логор у Хараду.“ Име можда значи „лепота“ или „пријатност“. Као и већина станица између Асирота и Есион-Гавера, не јавља се нигде другде, а попис не наводи ни догађај, ни воду, ни обележје по ком би се могла одредити."
    - "Њено место је непознато. Карта је смешта у круг од око 50 км од Хараде, која ни сама није убицирана, и означава један предлог, Џебел Араиф ел-Нака на североистоку Синаја, близу границе Негева, приметан врх у крају кроз који воде неке реконструкције пута. Други читав низ логора остављају неубицираним, а нема старог предања које би омогућило избор међу њима."
scripture:
  - Num.33.17-Num.33.35
sources:
  - "G. I. Davies, The Way of the Wilderness: A Geographical Study of the Wilderness Itineraries in the Old Testament (1979)"
  - "B. A. Levine, Numbers 21-36 (Anchor Bible, 2000)"
  - "M. Noth, Numbers: A Commentary (Old Testament Library, 1968)"
