# Overview article (ADR 0007). Mainstream facts only; disputed datings are named as such.
id: shechem
place: adf74d4
title:
  en: "Shechem"
  ru: "Сихем"
  uk: "Сихем"
  es: "Siquem"
  pt: "Siquém"
  de: "Sichem"
  fr: "Sichem"
  it: "Sichem"
  pl: "Sychem"
