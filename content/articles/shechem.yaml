# Overview article (ADR 0007). Mainstream facts only; disputed datings are named as such.
id: shechem
place: adf74d4
title:
  en: "Shechem"
  ru: "Сихем"
  uk: "Сихем"
  es: "Siquem"
  pt: "Siquém"
  de: "Sichem"
  fr: "Sichem"
body:
  en:
    - "Shechem lay at Tell Balata, in the pass between Mount Ebal and Mount Gerizim, where the roads of the central hills cross. In the Middle Bronze Age it became a great city with massive walls, gates and a fortress temple. An Egyptian stela of the nineteenth century BC records a campaign against Sekmem, probably Shechem, and in the Amarna letters of the fourteenth century BC its ruler Labayu troubles his neighbours."
    - "In Genesis Abraham stops at the oak of Moreh by Shechem, and Jacob buys a field there; Joseph's bones were later buried in it. Joshua gathered the tribes at Shechem to renew the covenant, and Abimelech, made king there, later destroyed the city. At Shechem the northern tribes rejected Rehoboam, and the kingdom divided in about 931 BC; Jeroboam built up the town as his first seat."
    - "After a long gap at the end of the Late Bronze Age, the town was rebuilt in the Iron Age and destroyed in the Assyrian conquest of the 720s BC. In the late fourth century BC the Samaritans resettled it and made it their chief city, with their temple on Mount Gerizim. John Hyrcanus destroyed the temple; the date is disputed, soon after 129 BC by Josephus' account or about 111 BC by the coins found on Gerizim. About 107 BC he razed the city, which was never rebuilt."
    - "The Gospel of John sets Jesus' talk with a Samaritan woman at Jacob's well near Sychar, beside the old site. In AD 72 Flavia Neapolis was founded 2 km to the west; Justin Martyr was born there. In the fourth century pilgrims were shown Jacob's well, where a church was built, and the tomb of Joseph. After a Samaritan revolt, usually dated 484, the emperor Zeno built a church to the Mother of God on Mount Gerizim."
  ru:
    - "Сихем стоял на холме Телль-Балата, в проходе между горами Гевал и Гаризим, где сходятся дороги центрального нагорья. В среднем бронзовом веке он стал большим городом с мощными стенами, воротами и храмом-крепостью. Египетская стела XIX века до н. э. упоминает поход на Секмем, вероятно Сихем, а в Амарнских письмах XIV века до н. э. его правитель Лабайю тревожит соседей."
    - "В Книге Бытия Авраам останавливается у дубравы Море близ Сихема, а Иаков покупает здесь участок поля; позже в нём погребли кости Иосифа. Иисус Навин собрал в Сихеме колена, чтобы обновить завет, а Авимелех, поставленный здесь царём, впоследствии разрушил город. В Сихеме северные колена отвергли Ровоама, и около 931 г. до н. э. царство разделилось; Иеровоам обстроил город и сделал его своей первой резиденцией."
    - "После долгого перерыва в конце позднего бронзового века город отстроили в железном веке, а в 720-х гг. до н. э. он был разрушен при ассирийском завоевании. В конце IV века до н. э. его вновь заселили самаряне и сделали своим главным городом, а их храм стоял на горе Гаризим. Иоанн Гиркан разрушил этот храм; дата спорна: по Иосифу Флавию, вскоре после 129 г. до н. э., по монетам, найденным на Гаризиме, около 111 г. до н. э. Около 107 г. до н. э. он сровнял с землёй и город, который больше не отстраивался."
    - "Евангелие от Иоанна относит беседу Иисуса с самарянкой к колодцу Иакова близ Сихаря, рядом со старым городищем. В 72 г. н. э. в 2 км к западу был основан город Флавия Неаполис; здесь родился Иустин Мученик. В IV веке паломникам показывали колодец Иакова, над которым построили церковь, и гробницу Иосифа. После восстания самарян, которое обычно датируют 484 г., император Зенон возвёл на Гаризиме церковь Богородицы."
  uk:
    - "Сихем лежав на Телл-Балаті, у ущелині між горою Гевал і горою Гарізім, де перетинаються дороги центральних пагорбів. У середньому бронзовому віці він став великим містом із масивними мурами, воротами й храмом-фортецею. Єгипетська стела XIX ст. до н. е. згадує похід проти Секмема, ймовірно Сихема, а в амарнських листах XIV ст. до н. е. його володар Лабайу турбує своїх сусідів."
    - "У книзі Буття Авраам зупиняється біля дубрави Море поруч із Сихемом, а Яків купує там поле; у ньому пізніше поховали кістки Йосипа. Ісус Навин зібрав у Сихемі племена, щоб відновити заповіт, а Авімелех, якого там проголосили царем, згодом зруйнував місто. У Сихемі північні племена відкинули Ровоама, і царство розділилося близько 931 р. до н. е.; Єровоам відбудував місто як свою першу резиденцію."
    - "Після тривалої перерви наприкінці пізнього бронзового віку місто відбудували в залізному віці, а під час ассирійського завоювання 720-х років до н. е. зруйнували. Наприкінці IV ст. до н. е. самаряни заселили його знову й зробили своїм головним містом, зі своїм храмом на горі Гарізім. Іоанн Гіркан зруйнував храм; дата спірна: невдовзі по 129 р. до н. е. за розповіддю Йосифа Флавія або близько 111 р. до н. е. за монетами, знайденими на Гарізімі. Близько 107 р. до н. е. він зрівняв місто із землею, і воно більше не відбудовувалося."
    - "Євангеліє від Івана розміщує розмову Ісуса з самарянкою біля колодязя Якова поблизу Сихаря, поруч зі старим місцем. У 72 р. н. е. за 2 км на захід заснували Флавію Неаполь; там народився Юстин Мученик. У IV ст. прочанам показували колодязь Якова, де збудували церкву, та гробницю Йосипа. Після самарянського повстання, яке зазвичай датують 484 р., імператор Зенон збудував на горі Гарізім церкву Богородиці."
  es:
    - "Siquem estaba en Tell Balata, en el paso entre el monte Ebal y el monte Gerizim, donde se cruzan los caminos de las colinas centrales. En la Edad del Bronce Medio llegó a ser una gran ciudad con murallas macizas, puertas y un templo-fortaleza. Una estela egipcia del siglo XIX a. C. registra una campaña contra Sekmem, probablemente Siquem, y en las cartas de Amarna del siglo XIV a. C. su gobernante Labayu inquieta a sus vecinos."
    - "En el Génesis Abraham se detiene en la encina de Moré junto a Siquem, y Jacob compra allí un campo; los huesos de José fueron sepultados después en él. Josué reunió a las tribus en Siquem para renovar la alianza, y Abimelec, hecho rey allí, destruyó más tarde la ciudad. En Siquem las tribus del norte rechazaron a Roboam, y el reino se dividió hacia 931 a. C.; Jeroboam reedificó la ciudad como su primera sede."
    - "Tras un largo hiato a finales de la Edad del Bronce Final, la ciudad fue reconstruida en la Edad del Hierro y destruida en la conquista asiria de la década de 720 a. C. A finales del siglo IV a. C. los samaritanos la repoblaron y la hicieron su ciudad principal, con su templo en el monte Gerizim. Juan Hircano destruyó el templo; la fecha se discute, poco después de 129 a. C. según el relato de Josefo o hacia 111 a. C. según las monedas halladas en el Gerizim. Hacia 107 a. C. arrasó la ciudad, que nunca fue reconstruida."
    - "El Evangelio de Juan sitúa la conversación de Jesús con una mujer samaritana junto al pozo de Jacob cerca de Sicar, al lado del antiguo lugar. En el 72 d. C. se fundó Flavia Neápolis a 2 km al oeste; Justino Mártir nació allí. En el siglo IV se mostraba a los peregrinos el pozo de Jacob, donde se construyó una iglesia, y la tumba de José. Tras una revuelta samaritana, por lo común fechada en 484, el emperador Zenón construyó una iglesia a la Madre de Dios en el monte Gerizim."
  pt:
    - "Siquém ficava em Tell Balata, na passagem entre o Monte Ebal e o Monte Gerizim, onde se cruzam as estradas das colinas centrais. Na Idade do Bronze Média tornou-se uma grande cidade com muralhas maciças, portões e um templo-fortaleza. Uma estela egípcia do século XIX a.C. registra uma campanha contra Sekmem, provavelmente Siquém, e nas cartas de Amarna do século XIV a.C. seu governante Labayu inquieta os vizinhos."
    - "No Gênesis Abraão para no carvalho de Moré, junto a Siquém, e Jacó compra ali um campo; os ossos de José foram depois sepultados nele. Josué reuniu as tribos em Siquém para renovar a aliança, e Abimeleque, feito rei ali, destruiu depois a cidade. Em Siquém as tribos do norte rejeitaram Roboão, e o reino se dividiu por volta de 931 a.C.; Jeroboão reconstruiu a cidade como sua primeira sede."
    - "Depois de uma longa lacuna no fim da Idade do Bronze Final, a cidade foi reconstruída na Idade do Ferro e destruída na conquista assíria da década de 720 a.C. No fim do século IV a.C. os samaritanos a repovoaram e fizeram dela sua cidade principal, com seu templo no Monte Gerizim. João Hircano destruiu o templo; a data é disputada, logo depois de 129 a.C. segundo o relato de Josefo ou por volta de 111 a.C. pelas moedas achadas no Gerizim. Por volta de 107 a.C. arrasou a cidade, que nunca foi reconstruída."
    - "O Evangelho de João situa a conversa de Jesus com uma mulher samaritana no poço de Jacó, perto de Sicar, ao lado do antigo sítio. Em 72 d.C. foi fundada Flávia Neápolis, 2 km a oeste; Justino Mártir nasceu ali. No século IV mostravam aos peregrinos o poço de Jacó, onde se construiu uma igreja, e o túmulo de José. Depois de uma revolta samaritana, em geral datada de 484, o imperador Zenão construiu uma igreja à Mãe de Deus no Monte Gerizim."
  de:
    - "Sichem lag bei Tell Balata, im Pass zwischen dem Ebal und dem Garizim, wo sich die Straßen des zentralen Berglandes kreuzen. In der Mittelbronzezeit wurde es zu einer großen Stadt mit massiven Mauern, Toren und einem Festungstempel. Eine ägyptische Stele des 19. Jahrhunderts v. Chr. verzeichnet einen Feldzug gegen Sekmem, wahrscheinlich Sichem, und in den Amarna-Briefen des 14. Jahrhunderts v. Chr. bedrängt sein Herrscher Labaju seine Nachbarn."
    - "In der Genesis macht Abraham an der Eiche More bei Sichem halt, und Jakob kauft dort ein Stück Land; Josefs Gebeine wurden später darin begraben. Josua versammelte die Stämme in Sichem zur Erneuerung des Bundes, und Abimelech, dort zum König gemacht, zerstörte die Stadt später. In Sichem verwarfen die Nordstämme Rehabeam, und das Reich teilte sich um 931 v. Chr.; Jerobeam baute die Stadt als seinen ersten Sitz aus."
    - "Nach einer langen Lücke am Ende der Spätbronzezeit wurde die Stadt in der Eisenzeit wieder aufgebaut und bei der assyrischen Eroberung der 720er Jahre v. Chr. zerstört. Im späten 4. Jahrhundert v. Chr. besiedelten die Samaritaner sie neu und machten sie zu ihrer Hauptstadt, mit ihrem Tempel auf dem Garizim. Johannes Hyrkanos zerstörte den Tempel; die Datierung ist umstritten, bald nach 129 v. Chr. nach Josephus oder um 111 v. Chr. nach den auf dem Garizim gefundenen Münzen. Um 107 v. Chr. schleifte er die Stadt, die nie wieder aufgebaut wurde."
    - "Das Johannesevangelium verlegt Jesu Gespräch mit einer samaritanischen Frau an Jakobs Brunnen bei Sychar, neben der alten Stätte. Im Jahr 72 n. Chr. wurde 2 km westlich Flavia Neapolis gegründet; Justin der Märtyrer wurde dort geboren. Im 4. Jahrhundert zeigte man Pilgern Jakobs Brunnen, wo eine Kirche gebaut wurde, und das Grab Josefs. Nach einem samaritanischen Aufstand, meist auf 484 datiert, baute Kaiser Zeno auf dem Garizim eine Kirche für die Mutter Gottes."
  fr:
    - "Sichem se trouvait à Tell Balata, dans le défilé entre le mont Ébal et le mont Garizim, là où se croisent les routes des collines centrales. À l’âge du Bronze moyen, elle devint une grande ville aux murs massifs, avec portes et temple-forteresse. Une stèle égyptienne du XIXe siècle av. J.-C. consigne une campagne contre Sekmem, probablement Sichem, et dans les lettres d’Amarna du XIVe siècle av. J.-C., son souverain Labayou trouble ses voisins."
    - "Dans la Genèse, Abraham s’arrête au chêne de Moré près de Sichem, et Jacob y achète un champ ; les os de Joseph y furent plus tard enterrés. Josué rassembla les tribus à Sichem pour renouveler l’alliance, et Abimélec, fait roi là, détruisit plus tard la ville. À Sichem, les tribus du nord rejetèrent Roboam, et le royaume se divisa vers 931 av. J.-C. ; Jéroboam fit de la ville sa première résidence."
    - "Après une longue interruption à la fin de l’âge du Bronze récent, la ville fut rebâtie à l’âge du Fer et détruite lors de la conquête assyrienne des années 720 av. J.-C. À la fin du IVe siècle av. J.-C., les Samaritains la repeuplèrent et en firent leur principale ville, avec leur temple sur le mont Garizim. Jean Hyrcan détruisit le temple ; la date est disputée, peu après 129 av. J.-C. selon Flavius Josèphe ou vers 111 av. J.-C. d’après les monnaies trouvées sur le Garizim. Vers 107 av. J.-C., il rasa la ville, qui ne fut jamais rebâtie."
    - "L’Évangile de Jean place l’entretien de Jésus avec une Samaritaine au puits de Jacob près de Sychar, à côté de l’ancien site. En 72 apr. J.-C., Flavia Néapolis fut fondée à 2 km à l’ouest ; Justin Martyr y naquit. Au IVe siècle, on montrait aux pèlerins le puits de Jacob, où une église fut bâtie, et le tombeau de Joseph. Après une révolte samaritaine, d’ordinaire datée de 484, l’empereur Zénon bâtit une église de la Mère de Dieu sur le mont Garizim."
