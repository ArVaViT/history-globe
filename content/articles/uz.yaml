# Overview article (ADR 0007). Mainstream facts only; the land is unlocated and the southern and northern views are given without choosing; the Book of Job is not dated.
id: uz
place: a324c4d
title:
  en: "Uz"
  ru: "Уц"
  uk: "Уц"
  es: "Uz"
  pt: "Uz"
  de: "Uz"
  fr: "Uz"
body:
  en:
    - "“There was a man in the land of Uz, whose name was Job.” Where that land lay the Bible never says, and the question has been open since antiquity. The name belongs to three men in the genealogies: Uz the son of Aram, Uz (Huz in the King James) the son of Nahor, Abraham's brother, and Uz the son of Dishan the Horite, among the clans of Seir. Two readings follow."
    - "The southern one puts Uz in or beside Edom: Lamentations addresses “O daughter of Edom, that dwellest in the land of Uz”, Job's friend Eliphaz comes from Teman in Edom, and the Greek Bible's note at the end of Job sets him “on the borders of Idumea and Arabia”. The northern one looks to the Aramean Uz and to the Hauran, south of Damascus, where Josephus says Uz founded Trachonitis and Damascus and where a tomb of Job has been venerated at Sheikh Saad since at least the fourth century; the oasis of Wadi Sirhan to the east has also been proposed. The map keeps the Edomite site first and the others beside it."
    - "The land is named three times. Job, “perfect and upright”, lived there with his seven sons and three daughters and his herds, until the Sabeans from the south and the Chaldeans from Mesopotamia carried them off and the wind from the wilderness struck his house: raiders from both directions, which is why the land has been sought between them. Jeremiah's cup of wrath goes to “all the kings of the land of Uz, and all the kings of the land of the Philistines”, and Lamentations warns Edom in Uz that “the cup also shall pass through unto thee”."
    - "Near Sheikh Saad in the Hauran the pilgrim Egeria in the 380s was shown Job's tomb at Carneas, with a church over it still unfinished; the “stone of Job” there is in fact a stela of Ramesses II, and a shrine of Job still stands in the village in southern Syria. Edom's hills, the other candidate, lie across the border in Jordan south of the Dead Sea."
  ru:
    - "«Был человек в земле Уц, имя его Иов». Где лежала эта земля, Библия не говорит, и вопрос открыт с древности. Имя носят трое мужей родословий: Уц, сын Арама, Уц, сын Нахора, брата Авраама, и Уц, сын Дишана Хорреянина, среди родов Сеира. Отсюда два прочтения."
    - "Южное помещает Уц в Едоме или рядом с ним: Плач Иеремии взывает: «Радуйся и веселись, дочь Едома, обитательница земли Уц!», друг Иова Елифаз — из Фемана в Едоме, а приписка в конце книги Иова в греческой Библии селит его «на границе Идумеи и Аравии». Северное смотрит на арамейского Уца и на Авран к югу от Дамаска, где, по Иосифу Флавию, Уц основал Трахонитиду и Дамаск и где гробницу Иова чтят в Шейх-Сааде по меньшей мере с IV века; предлагали и оазис Вади-Сирхан на востоке. Карта ставит первым едомское место, а остальные рядом."
    - "Земля названа трижды. Иов, «непорочен, справедлив», жил в ней с семью сыновьями, тремя дочерьми и стадами, пока савеяне с юга и халдеи из Месопотамии не угнали скот, а ветер из пустыни не обрушил дом: набеги с обеих сторон, оттого землю и ищут между ними. Чашу гнева у Иеремии пьют «и всех царей земли Уца, и всех царей земли Филистимской», как перечисляет пророк, а Плач предупреждает Едом в земле Уц: «И до тебя дойдет чаша»."
    - "Близ Шейх-Саада в Авране паломнице Эгерии в 380-х годах показали гробницу Иова в Карнее с недостроенной церковью над ней; тамошний «камень Иова» на деле — стела Рамсеса II, а святилище Иова и сейчас стоит в этом селении на юге Сирии. Горы Едома, другой кандидат, лежат за границей, в Иордании, к югу от Мёртвого моря."
  uk:
    - "«Був (давно) чоловік у землї Уз, на імя Йов». Де лежала ця земля, Біблія ніколи не каже, і питання відкрите ще з давнини. Це ім’я належить трьом чоловікам у родоводах: Уц, син Арама, Уц (Гуз у Біблії короля Якова), син Нахора, брата Авраама, і Уц, син Дішона хорея, серед родів Сеіру. Звідси два прочитання."
    - "Південне ставить Уц в Едомі чи поряд із ним: Плач Єремії звертається до «дочко Едомова, … ти, що живеш там у землї Уз», друг Йова Еліфаз походить із Темана в Едомі, а примітка грецької Біблії наприкінці Книги Йова розміщує його на межах Ідумеї та Аравії. Північне дивиться на арамейський Уц і на Хавран, на південь від Дамаска, де, за Йосифом Флавієм, Уц заснував Трахонітську область і Дамаск і де гробницю Йова шанують у Шейх-Саді принаймні з IV століття; пропонували також оазу Вади-Сірхан на сході. Мапа ставить едомське місце першим, а інші поряд."
    - "Земля названа тричі. Йов, «щирий, справедливий й богобоязливий», жив там із сімома синами і трьома доньками та своїми стадами, доки савеяни з півдня і халдеї з Месопотамії не забрали їх і вітер від пустелі не вдарив у його дім: напасники з обох боків, тому й шукали цю землю між ними. Чаша гніву Єремії іде до «усїх царів ув Уз-землї, й усїх царів Филистійських», а Плач попереджає Едом в Уці: «прийде й до тебе чарка»."
    - "Біля Шейх-Саада в Хаврані паломниці Егерії в 380-х роках показали гробницю Йова в Карнеї з церквою над нею, ще недобудованою; «камінь Йова» там насправді стела Рамсеса II, а святиня Йова досі стоїть у селі на півдні Сирії. Едомські пагорби, другий кандидат, лежать за кордоном в Йорданії на південь від Мертвого моря."
  es:
    - "«Hubo un varón en tierra de Hus, llamado Job». Dónde estaba esa tierra la Biblia nunca lo dice, y la cuestión está abierta desde la Antigüedad. El nombre pertenece a tres hombres en las genealogías: Uz hijo de Aram, Uz (Huz en la versión King James) hijo de Nacor, hermano de Abraham, y Uz hijo de Disán el horeo, entre los clanes de Seir. De ahí se siguen dos lecturas."
    - "La meridional sitúa Uz en Edom o junto a ella: Lamentaciones se dirige a la «hija de Edom, la que habitas en tierra de Hus», el amigo de Job, Elifaz, procede de Temán, en Edom, y la nota de la Biblia griega al final de Job lo sitúa en los confines de Idumea y Arabia. La septentrional mira al Uz arameo y al Haurán, al sur de Damasco, donde Josefo dice que Uz fundó Traconite y Damasco y donde una tumba de Job es venerada en Sheikh Saad desde al menos el siglo IV; también se ha propuesto el oasis del Wadi Sirhan, al este. El mapa conserva primero el sitio edomita y los otros a su lado."
    - "La tierra se nombra tres veces. Job, «perfecto y recto», vivía allí con sus siete hijos y tres hijas y sus rebaños, hasta que los sabeos del sur y los caldeos de Mesopotamia se los llevaron y el viento del desierto golpeó su casa: salteadores de ambas direcciones, por lo cual la tierra se ha buscado entre ellas. La copa de la ira de Jeremías va a «todos los reyes de tierra de Hus, y á todos los reyes de tierra de Palestina», y Lamentaciones advierte a Edom en Uz que «aun hasta ti pasará el cáliz»."
    - "Cerca de Sheikh Saad, en el Haurán, a la peregrina Egeria le mostraron en los años 380 la tumba de Job en Carneas, con una iglesia sobre ella todavía sin terminar; la «piedra de Job» de allí es en realidad una estela de Ramsés II, y un santuario de Job sigue en pie en la aldea, en el sur de Siria. Las colinas de Edom, el otro candidato, quedan al otro lado de la frontera, en Jordania, al sur del mar Muerto."
  pt:
    - "“Havia um homem na terra de Uz, cujo nome era Jó.” Onde ficava essa terra a Bíblia nunca diz, e a questão está aberta desde a Antiguidade. O nome pertence a três homens nas genealogias: Uz, filho de Arã; Uz (Huz na versão King James), filho de Naor, irmão de Abraão; e Uz, filho de Disã, o horeu, entre os clãs de Seir. Seguem-se duas leituras."
    - "A do sul põe Uz em Edom ou junto a ela: Lamentações se dirige à “filha de Edom, que habita na terra de Uz”, o amigo de Jó, Elifaz, vem de Temã, em Edom, e a nota da Bíblia grega no fim de Jó o situa “nos confins da Iduméia e da Arábia”. A do norte olha para o Uz arameu e para o Haurã, ao sul de Damasco, onde Josefo diz que Uz fundou Traconites e Damasco e onde um túmulo de Jó é venerado em Sheikh Saad desde pelo menos o século IV; o oásis de Wadi Sirhan, a leste, também foi proposto. O mapa mantém primeiro o sítio edomita e os outros ao lado."
    - "A terra é nomeada três vezes. Jó, “íntegro e reto”, vivia ali com seus sete filhos, três filhas e seus rebanhos, até que os sabeus do sul e os caldeus da Mesopotâmia os levaram e o vento do deserto atingiu sua casa: assaltantes das duas direções, razão pela qual a terra foi procurada entre eles. O cálice da ira de Jeremias vai a “todos os reis da terra de Uz, todos os reis dos filisteus”, e Lamentações adverte Edom em Uz de que “O cálice também passará para você”."
    - "Perto de Sheikh Saad, no Haurã, a peregrina Egéria, na década de 380, viu o túmulo de Jó em Carneas, com uma igreja sobre ele ainda inacabada; a “pedra de Jó” ali é na verdade uma estela de Ramsés II, e um santuário de Jó ainda se ergue na aldeia, no sul da Síria. As colinas de Edom, o outro candidato, ficam do outro lado da fronteira, na Jordânia, ao sul do Mar Morto."
  de:
    - "„Es war ein Mann im Lande Uz, der hieß Hiob.“ Wo dieses Land lag, sagt die Bibel nie, und die Frage ist seit der Antike offen. Der Name gehört drei Männern in den Genealogien: Uz, dem Sohn Arams, Uz, dem Sohn Nahors, des Bruders Abrahams, und Uz, dem Sohn Dischans, des Horiters, unter den Sippen Seirs. Daraus folgen zwei Deutungen."
    - "Die südliche setzt Uz in oder neben Edom: Die Klagelieder sprechen „du Tochter Edom, die du wohnst im Lande Uz“ an, Hiobs Freund Eliphas stammt aus Teman in Edom, und der Zusatz der griechischen Bibel am Ende des Hiobbuches setzt ihn an die Grenzen von Idumäa und Arabien. Die nördliche blickt auf das aramäische Uz und auf den Hauran südlich von Damaskus, wo laut Josephus Uz Trachonitis und Damaskus gründete und wo seit mindestens dem vierten Jahrhundert ein Grab Hiobs in Scheich Saad verehrt wird; auch die Oase Wadi Sirhan im Osten wurde vorgeschlagen. Die Karte behält die edomitische Stätte an erster Stelle und die anderen daneben."
    - "Das Land wird dreimal genannt. Hiob, „schlecht und recht“, lebte dort mit seinen sieben Söhnen, drei Töchtern und seinen Herden, bis die Sabäer aus dem Süden und die Chaldäer aus Mesopotamien sie wegführten und der Wind von der Wüste sein Haus traf: Räuber aus beiden Richtungen, weshalb man das Land zwischen ihnen gesucht hat. Jeremias Becher des Zorns geht an „allen Königen im Lande Uz, allen Königen in der Philister Lande“, und die Klagelieder warnen Edom in Uz, „denn der Kelch wird auch über dich kommen“."
    - "Bei Scheich Saad im Hauran wurde der Pilgerin Egeria in den 380er Jahren Hiobs Grab in Carneas gezeigt, mit einer noch unfertigen Kirche darüber; der „Stein Hiobs“ dort ist in Wahrheit eine Stele Ramses' II., und ein Hiobschrein steht noch im Dorf in Südsyrien. Die Hügel Edoms, der andere Kandidat, liegen jenseits der Grenze in Jordanien südlich des Toten Meeres."
  fr:
    - "« Il y avait dans le pays d’Uts un homme qui s’appelait Job. » Où se trouvait ce pays, la Bible ne le dit jamais, et la question est ouverte depuis l’Antiquité. Le nom appartient à trois hommes des généalogies : Uz fils d’Aram, Uz (Huz dans la King James) fils de Nachor, frère d’Abraham, et Uz fils de Dischan le Horien, parmi les clans de Séir. Deux lectures en découlent."
    - "La lecture méridionale place Uz en Édom ou à côté : les Lamentations s’adressent à la « fille d’Édom, habitante du pays d’Uts », l’ami de Job Éliphaz vient de Théman en Édom, et la note de la Bible grecque à la fin de Job le situe aux confins de l’Idumée et de l’Arabie. La lecture septentrionale regarde vers l’Uz araméen et le Havran, au sud de Damas, où, selon Josèphe, Uz fonda la Trachonite et Damas, et où un tombeau de Job est vénéré à Sheikh Saad depuis au moins le IVe siècle ; l’oasis de l’oued Sirhan, à l’est, a aussi été proposée. La carte garde d’abord le site édomite, et les autres à côté."
    - "Le pays est nommé trois fois. Job, « intègre et droit », y vivait avec ses sept fils, ses trois filles et ses troupeaux, jusqu’à ce que les Sabéens du sud et les Chaldéens de Mésopotamie les emportent et que le vent du désert frappe sa maison : des pillards des deux directions, ce qui explique qu’on ait cherché le pays entre elles. La coupe de colère de Jérémie va à « tous les rois du pays d’Uts, tous les rois du pays des Philistins », et les Lamentations préviennent Édom en Uz : « Vers toi aussi passera la coupe »."
    - "Près de Sheikh Saad, dans le Havran, la pèlerine Égérie se fit montrer dans les années 380 le tombeau de Job à Carnéas, surmonté d’une église encore inachevée ; la « pierre de Job » y est en fait une stèle de Ramsès II, et un sanctuaire de Job se dresse toujours dans le village, dans le sud de la Syrie. Les collines d’Édom, l’autre candidat, se trouvent de l’autre côté de la frontière, en Jordanie, au sud de la mer Morte."
