body:
  en:
    - "“There was a man in the land of Uz, whose name was Job.” Where that land lay the Bible never says, and the question has been open since antiquity. The name belongs to three men in the genealogies: Uz the son of Aram, Uz (Huz in the King James) the son of Nahor, Abraham's brother, and Uz the son of Dishan the Horite, among the clans of Seir. Two readings follow."
    - "The southern one puts Uz in or beside Edom: Lamentations addresses “O daughter of Edom, that dwellest in the land of Uz”, Job's friend Eliphaz comes from Teman in Edom, and the Greek Bible's note at the end of Job sets him “on the borders of Idumea and Arabia”. The northern one looks to the Aramean Uz and to the Hauran, south of Damascus, where Josephus says Uz founded Trachonitis and Damascus and where a tomb of Job has been venerated at Sheikh Saad since at least the fourth century; the oasis of Wadi Sirhan to the east has also been proposed. The map keeps the Edomite site first and the others beside it."
    - "The land is named three times. Job, “perfect and upright”, lived there with his seven sons and three daughters and his herds, until the Sabeans from the south and the Chaldeans from Mesopotamia carried them off and the wind from the wilderness struck his house: raiders from both directions, which is why the land has been sought between them. Jeremiah's cup of wrath goes to “all the kings of the land of Uz, and all the kings of the land of the Philistines”, and Lamentations warns Edom in Uz that “the cup also shall pass through unto thee”."
    - "Near Sheikh Saad in the Hauran the pilgrim Egeria in the 380s was shown Job's tomb at Carneas, with a church over it still unfinished; the “stone of Job” there is in fact a stela of Ramesses II, and a shrine of Job still stands in the village in southern Syria. Edom's hills, the other candidate, lie across the border in Jordan south of the Dead Sea."
  ru:
    - "«Был человек в земле Уц, имя его Иов». Где лежала эта земля, Библия не говорит, и вопрос открыт с древности. Имя носят трое мужей родословий: Уц, сын Арама, Уц, сын Нахора, брата Авраама, и Уц, сын Дишана Хорреянина, среди родов Сеира. Отсюда два прочтения."
    - "Южное помещает Уц в Едоме или рядом с ним: Плач Иеремии взывает: «Радуйся и веселись, дочь Едома, обитательница земли Уц!», друг Иова Елифаз — из Фемана в Едоме, а приписка в конце книги Иова в греческой Библии селит его «на границе Идумеи и Аравии». Северное смотрит на арамейского Уца и на Авран к югу от Дамаска, где, по Иосифу Флавию, Уц основал Трахонитиду и Дамаск и где гробницу Иова чтят в Шейх-Сааде по меньшей мере с IV века; предлагали и оазис Вади-Сирхан на востоке. Карта ставит первым едомское место, а остальные рядом."
    - "Земля названа трижды. Иов, «непорочен, справедлив», жил в ней с семью сыновьями, тремя дочерьми и стадами, пока савеяне с юга и халдеи из Месопотамии не угнали скот, а ветер из пустыни не обрушил дом: набеги с обеих сторон, оттого землю и ищут между ними. Чашу гнева у Иеремии пьют «и всех царей земли Уца, и всех царей земли Филистимской», как перечисляет пророк, а Плач предупреждает Едом в земле Уц: «И до тебя дойдет чаша»."
    - "Близ Шейх-Саада в Авране паломнице Эгерии в 380-х годах показали гробницу Иова в Карнее с недостроенной церковью над ней; тамошний «камень Иова» на деле — стела Рамсеса II, а святилище Иова и сейчас стоит в этом селении на юге Сирии. Горы Едома, другой кандидат, лежат за границей, в Иордании, к югу от Мёртвого моря."
  uk:
    - "«Був (давно) чоловік у землї Уз, на імя Йов». Де лежала ця земля, Біблія ніколи не каже, і питання відкрите ще з давнини. Це ім’я належить трьом чоловікам у родоводах: Уц, син Арама, Уц (Гуз у Біблії короля Якова), син Нахора, брата Авраама, і Уц, син Дішона хорея, серед родів Сеіру. Звідси два прочитання."
    - "Південне ставить Уц в Едомі чи поряд із ним: Плач Єремії звертається до «дочко Едомова, … ти, що живеш там у землї Уз», друг Йова Еліфаз походить із Темана в Едомі, а примітка грецької Біблії наприкінці Книги Йова розміщує його на межах Ідумеї та Аравії. Північне дивиться на арамейський Уц і на Хавран, на південь від Дамаска, де, за Йосифом Флавієм, Уц заснував Трахонітську область і Дамаск і де гробницю Йова шанують у Шейх-Саді принаймні з IV століття; пропонували також оазу Вади-Сірхан на сході. Мапа ставить едомське місце першим, а інші поряд."
    - "Земля названа тричі. Йов, «щирий, справедливий й богобоязливий», жив там із сімома синами і трьома доньками та своїми стадами, доки савеяни з півдня і халдеї з Месопотамії не забрали їх і вітер від пустелі не вдарив у його дім: напасники з обох боків, тому й шукали цю землю між ними. Чаша гніву Єремії іде до «усїх царів ув Уз-землї, й усїх царів Филистійських», а Плач попереджає Едом в Уці: «прийде й до тебе чарка»."
    - "Біля Шейх-Саада в Хаврані паломниці Егерії в 380-х роках показали гробницю Йова в Карнеї з церквою над нею, ще недобудованою; «камінь Йова» там насправді стела Рамсеса II, а святиня Йова досі стоїть у селі на півдні Сирії. Едомські пагорби, другий кандидат, лежать за кордоном в Йорданії на південь від Мертвого моря."
  es:
    - "«Hubo un varón en tierra de Hus, llamado Job». Dónde estaba esa tierra la Biblia nunca lo dice, y la cuestión está abierta desde la Antigüedad. El nombre pertenece a tres hombres en las genealogías: Uz hijo de Aram, Uz (Huz en la versión King James) hijo de Nacor, hermano de Abraham, y Uz hijo de Disán el horeo, entre los clanes de Seir. De ahí se siguen dos lecturas."
    - "La meridional sitúa Uz en Edom o junto a ella: Lamentaciones se dirige a la «hija de Edom, la que habitas en tierra de Hus», el amigo de Job, Elifaz, procede de Temán, en Edom, y la nota de la Biblia griega al final de Job lo sitúa en los confines de Idumea y Arabia. La septentrional mira al Uz arameo y al Haurán, al sur de Damasco, donde Josefo dice que Uz fundó Traconite y Damasco y donde una tumba de Job es venerada en Sheikh Saad desde al menos el siglo IV; también se ha propuesto el oasis del Wadi Sirhan, al este. El mapa conserva primero el sitio edomita y los otros a su lado."
    - "La tierra se nombra tres veces. Job, «perfecto y recto», vivía allí con sus siete hijos y tres hijas y sus rebaños, hasta que los sabeos del sur y los caldeos de Mesopotamia se los llevaron y el viento del desierto golpeó su casa: salteadores de ambas direcciones, por lo cual la tierra se ha buscado entre ellas. La copa de la ira de Jeremías va a «todos los reyes de tierra de Hus, y á todos los reyes de tierra de Palestina», y Lamentaciones advierte a Edom en Uz que «aun hasta ti pasará el cáliz»."
    - "Cerca de Sheikh Saad, en el Haurán, a la peregrina Egeria le mostraron en los años 380 la tumba de Job en Carneas, con una iglesia sobre ella todavía sin terminar; la «piedra de Job» de allí es en realidad una estela de Ramsés II, y un santuario de Job sigue en pie en la aldea, en el sur de Siria. Las colinas de Edom, el otro candidato, quedan al otro lado de la frontera, en Jordania, al sur del mar Muerto."
  pt:
    - "“Havia um homem na terra de Uz, cujo nome era Jó.” Onde ficava essa terra a Bíblia nunca diz, e a questão está aberta desde a Antiguidade. O nome pertence a três homens nas genealogias: Uz, filho de Arã; Uz (Huz na versão King James), filho de Naor, irmão de Abraão; e Uz, filho de Disã, o horeu, entre os clãs de Seir. Seguem-se duas leituras."
    - "A do sul põe Uz em Edom ou junto a ela: Lamentações se dirige à “filha de Edom, que habita na terra de Uz”, o amigo de Jó, Elifaz, vem de Temã, em Edom, e a nota da Bíblia grega no fim de Jó o situa “nos confins da Iduméia e da Arábia”. A do norte olha para o Uz arameu e para o Haurã, ao sul de Damasco, onde Josefo diz que Uz fundou Traconites e Damasco e onde um túmulo de Jó é venerado em Sheikh Saad desde pelo menos o século IV; o oásis de Wadi Sirhan, a leste, também foi proposto. O mapa mantém primeiro o sítio edomita e os outros ao lado."
    - "A terra é nomeada três vezes. Jó, “íntegro e reto”, vivia ali com seus sete filhos, três filhas e seus rebanhos, até que os sabeus do sul e os caldeus da Mesopotâmia os levaram e o vento do deserto atingiu sua casa: assaltantes das duas direções, razão pela qual a terra foi procurada entre eles. O cálice da ira de Jeremias vai a “todos os reis da terra de Uz, todos os reis dos filisteus”, e Lamentações adverte Edom em Uz de que “O cálice também passará para você”."
    - "Perto de Sheikh Saad, no Haurã, a peregrina Egéria, na década de 380, viu o túmulo de Jó em Carneas, com uma igreja sobre ele ainda inacabada; a “pedra de Jó” ali é na verdade uma estela de Ramsés II, e um santuário de Jó ainda se ergue na aldeia, no sul da Síria. As colinas de Edom, o outro candidato, ficam do outro lado da fronteira, na Jordânia, ao sul do Mar Morto."
  de:
    - "„Es war ein Mann im Lande Uz, der hieß Hiob.“ Wo dieses Land lag, sagt die Bibel nie, und die Frage ist seit der Antike offen. Der Name gehört drei Männern in den Genealogien: Uz, dem Sohn Arams, Uz, dem Sohn Nahors, des Bruders Abrahams, und Uz, dem Sohn Dischans, des Horiters, unter den Sippen Seirs. Daraus folgen zwei Deutungen."
    - "Die südliche setzt Uz in oder neben Edom: Die Klagelieder sprechen „du Tochter Edom, die du wohnst im Lande Uz“ an, Hiobs Freund Eliphas stammt aus Teman in Edom, und der Zusatz der griechischen Bibel am Ende des Hiobbuches setzt ihn an die Grenzen von Idumäa und Arabien. Die nördliche blickt auf das aramäische Uz und auf den Hauran südlich von Damaskus, wo laut Josephus Uz Trachonitis und Damaskus gründete und wo seit mindestens dem vierten Jahrhundert ein Grab Hiobs in Scheich Saad verehrt wird; auch die Oase Wadi Sirhan im Osten wurde vorgeschlagen. Die Karte behält die edomitische Stätte an erster Stelle und die anderen daneben."
    - "Das Land wird dreimal genannt. Hiob, „schlecht und recht“, lebte dort mit seinen sieben Söhnen, drei Töchtern und seinen Herden, bis die Sabäer aus dem Süden und die Chaldäer aus Mesopotamien sie wegführten und der Wind von der Wüste sein Haus traf: Räuber aus beiden Richtungen, weshalb man das Land zwischen ihnen gesucht hat. Jeremias Becher des Zorns geht an „allen Königen im Lande Uz, allen Königen in der Philister Lande“, und die Klagelieder warnen Edom in Uz, „denn der Kelch wird auch über dich kommen“."
    - "Bei Scheich Saad im Hauran wurde der Pilgerin Egeria in den 380er Jahren Hiobs Grab in Carneas gezeigt, mit einer noch unfertigen Kirche darüber; der „Stein Hiobs“ dort ist in Wahrheit eine Stele Ramses' II., und ein Hiobschrein steht noch im Dorf in Südsyrien. Die Hügel Edoms, der andere Kandidat, liegen jenseits der Grenze in Jordanien südlich des Toten Meeres."
  fr:
    - "« Il y avait dans le pays d’Uts un homme qui s’appelait Job. » Où se trouvait ce pays, la Bible ne le dit jamais, et la question est ouverte depuis l’Antiquité. Le nom appartient à trois hommes des généalogies : Uz fils d’Aram, Uz (Huz dans la King James) fils de Nachor, frère d’Abraham, et Uz fils de Dischan le Horien, parmi les clans de Séir. Deux lectures en découlent."
    - "La lecture méridionale place Uz en Édom ou à côté : les Lamentations s’adressent à la « fille d’Édom, habitante du pays d’Uts », l’ami de Job Éliphaz vient de Théman en Édom, et la note de la Bible grecque à la fin de Job le situe aux confins de l’Idumée et de l’Arabie. La lecture septentrionale regarde vers l’Uz araméen et le Havran, au sud de Damas, où, selon Josèphe, Uz fonda la Trachonite et Damas, et où un tombeau de Job est vénéré à Sheikh Saad depuis au moins le IVe siècle ; l’oasis de l’oued Sirhan, à l’est, a aussi été proposée. La carte garde d’abord le site édomite, et les autres à côté."
    - "Le pays est nommé trois fois. Job, « intègre et droit », y vivait avec ses sept fils, ses trois filles et ses troupeaux, jusqu’à ce que les Sabéens du sud et les Chaldéens de Mésopotamie les emportent et que le vent du désert frappe sa maison : des pillards des deux directions, ce qui explique qu’on ait cherché le pays entre elles. La coupe de colère de Jérémie va à « tous les rois du pays d’Uts, tous les rois du pays des Philistins », et les Lamentations préviennent Édom en Uz : « Vers toi aussi passera la coupe »."
    - "Près de Sheikh Saad, dans le Havran, la pèlerine Égérie se fit montrer dans les années 380 le tombeau de Job à Carnéas, surmonté d’une église encore inachevée ; la « pierre de Job » y est en fait une stèle de Ramsès II, et un sanctuaire de Job se dresse toujours dans le village, dans le sud de la Syrie. Les collines d’Édom, l’autre candidat, se trouvent de l’autre côté de la frontière, en Jordanie, au sud de la mer Morte."
  pl:
    - "„Był mąż w ziemi Uz, imieniem Ijob.” Gdzie leżał ten kraj, Biblia nigdy nie mówi, a pytanie jest otwarte od starożytności. Nazwę noszą trzej mężowie w rodowodach: Uz, syn Arama, Uz (Huz w Biblii Króla Jakuba), syn Nachora, brata Abrahama, i Uz, syn Diszana Choryty, wśród rodów Seiru. Wynikają z tego dwa odczytania."
    - "Południowe umieszcza Uz w Edomie lub obok niego: Lamentacje zwracają się do córki Edomu, która mieszka w ziemi Uz, przyjaciel Hioba Elifaz pochodzi z Temanu w Edomie, a przypisek Biblii greckiej na końcu Księgi Hioba umieszcza go „na granicach Idumei i Arabii”. Północne spogląda na aramejskie Uz i na Hauran, na południe od Damaszku, gdzie według Józefa Flawiusza Uz założył Trachonitidę i Damaszek i gdzie grób Hioba jest czczony w Szejk Saad co najmniej od IV wieku; proponowano też oazę Wadi Sirhan na wschodzie. Mapa zachowuje stanowisko edomickie na pierwszym miejscu, a pozostałe obok niego."
    - "Kraj jest wymieniony trzykrotnie. Hiob, „doskonały, i szczery”, mieszkał tam z siedmioma synami i trzema córkami i ze swoimi stadami, aż Sabejczycy z południa i Chaldejczycy z Mezopotamii je uprowadzili, a wiatr z pustyni uderzył w jego dom: najeźdźcy z obu stron, dlatego kraju szukano między nimi. Kielich gniewu Jeremiasza trafia do „wszystkich króli ziemi Uz, i wszystkich króli ziemi Filistyńskiej”, a Lamentacje ostrzegają Edom w Uz: „przyjdzie też do ciebie kubek”."
    - "Koło Szejk Saad w Hauranie pątniczce Egerii w latach osiemdziesiątych IV wieku pokazano grób Hioba w Carneas, z kościołem nad nim jeszcze niedokończonym; „kamień Hioba” jest tam w rzeczywistości stelą Ramzesa II, a sanktuarium Hioba nadal stoi we wsi w południowej Syrii. Wzgórza Edomu, drugi kandydat, leżą za granicą w Jordanii na południe od Morza Martwego."
  it:
    - "«C’era nel paese di Uz un uomo che si chiamava Giobbe.» Dove fosse quel paese la Bibbia non dice, e la questione è aperta fin dall’antichità. Il nome appartiene a tre uomini nelle genealogie: Uz figlio di Aram, Uz (Huz nella King James) figlio di Nacor, fratello di Abramo, e Uz figlio di Disan l’Urrita, fra i clan di Seir. Ne seguono due letture."
    - "Quella meridionale pone Uz in Edom o accanto a esso: le Lamentazioni si rivolgono alla «figliuola d’Edom, che dimori nel paese di Uts», l’amico di Giobbe Elifaz viene da Teman in Edom, e la nota della Bibbia greca alla fine di Giobbe lo colloca ai confini dell’Idumea e dell’Arabia. Quella settentrionale guarda all’Uz aramaico e all’Auran, a sud di Damasco, dove Giuseppe Flavio dice che Uz fondò la Traconitide e Damasco e dove una tomba di Giobbe è venerata a Sheikh Saad almeno dal IV secolo; è stata proposta anche l’oasi di Wadi Sirhan a oriente. La mappa tiene per primo il sito edomita e gli altri accanto."
    - "Il paese è nominato tre volte. Giobbe, «integro e retto», vi visse con i suoi sette figli e tre figlie e le sue greggi, finché i Sabei da sud e i Caldei dalla Mesopotamia li portarono via e il vento del deserto colpì la sua casa: predoni da entrambe le direzioni, per cui il paese è stato cercato fra le due. La coppa dell’ira di Geremia va a tutti i re del paese di Uz e a tutti i re del paese dei Filistei, e le Lamentazioni avvertono Edom in Uz che «anche fino a te passerà la coppa»."
    - "Presso Sheikh Saad nell’Auran la pellegrina Egeria, negli anni 380, vide la tomba di Giobbe a Carneas, con una chiesa sopra, ancora incompiuta; la «pietra di Giobbe» lì è in realtà una stele di Ramses II, e un santuario di Giobbe sorge ancora nel villaggio nella Siria meridionale. Le colline di Edom, l’altro candidato, si trovano oltre il confine in Giordania, a sud del Mar Morto."
  nl:
    - "“Er was een man in het land Uz, zijn naam was Job.” Waar dat land lag, zegt de Bijbel nooit, en de vraag is sinds de oudheid open. De naam behoort aan drie mannen in de geslachtsregisters: Uz, de zoon van Aram, Uz (Huz in de King James Version), de zoon van Nahor, de broer van Abraham, en Uz, de zoon van Disan de Horiet, onder de clans van Seïr. Daaruit volgen twee lezingen."
    - "De zuidelijke plaatst Uz in of naast Edom: Klaagliederen richt zich tot “gij dochter Edoms, die in het land Uz woont”, Jobs vriend Elifaz komt uit Teman in Edom, en de aantekening aan het slot van Job in de Griekse Bijbel plaatst hem aan de grenzen van Idumea en Arabië. De noordelijke kijkt naar het Arameese Uz en naar de Hauran, ten zuiden van Damascus, waar volgens Flavius Josephus Uz Trachonitis en Damascus stichtte en waar sinds minstens de vierde eeuw een graf van Job wordt vereerd bij Sheikh Saad; de oase Wadi Sirhan in het oosten is ook voorgesteld. De kaart houdt de Edomitische plaats voorop en de andere ernaast."
    - "Het land wordt driemaal genoemd. Job, “oprecht, en vroom”, woonde er met zijn zeven zonen en drie dochters en zijn kudden, totdat de Sabeeërs uit het zuiden en de Chaldeeën uit Mesopotamië ze wegvoerden en de wind uit de woestijn zijn huis trof: rovers uit twee richtingen, en daarom is het land daartussen gezocht. De beker van de gramschap van Jeremia gaat naar “allen koningen des lands van Uz; en allen koningen van der Filistijnen land”, en Klaagliederen waarschuwt Edom in Uz: “doch de beker zal ook tot u komen”."
    - "Bij Sheikh Saad in de Hauran kreeg de pelgrim Egeria in de jaren 380 het graf van Job te zien in Carneas, met een kerk erboven die nog onvoltooid was; de “steen van Job” daar is in werkelijkheid een stèle van Ramses II, en een heiligdom van Job staat nog in het dorp in het zuiden van Syrië. De heuvels van Edom, de andere kandidaat, liggen over de grens in Jordanië ten zuiden van de Dode Zee."
  cs:
    - "„Byl muž v zemi Uz, jménem Job.“ Kde ta země ležela, Bible nikdy neříká a otázka je otevřená od starověku. Jméno nesou v rodopisech tři muži: Úc, syn Aramův, Úc (v King James Version Huz), syn Nachorův, Abrahamova bratra, a Úc, syn Dišanův, Chórejce, mezi rody Seíru. Z toho plynou dva výklady."
    - "Jižní klade Úc do Edómu nebo k němu: Nářky oslovují „dcero Idumejská, kteráž jsi se usadila v zemi Uz“, Jobův přítel Elifaz pochází z Témánu v Edómu a poznámka řecké Bible na konci Jobu ho klade „na hranicích Idumeje a Arábie“. Severní hledí k aramejskému Úcu a k Havranu, jižně od Damašku, kde Josephus říká, že Úc založil Trachonitidu a Damašek a kde je hrob Jobův uctíván v Šajch Sa'd nejméně od 4. století; navrhována byla i oáza Wádí Sirhán na východě. Mapa ponechává edómské místo první a ostatní vedle něj."
    - "Země je jmenována třikrát. Job, „sprostný a upřímý“, tam žil se svými sedmi syny a třemi dcerami a se svými stády, dokud je Sabejští z jihu a Kaldejští z Mezopotámie neodvedli a vítr od pouště nezasáhl jeho dům: nájezdníci z obou stran, a proto byla země hledána mezi nimi. Jeremjáš napájí kalichem hněvu „všecky krále země Uz, všecky také krále země Filistinské“ a Nářky varují Edóm v Úcu: „Takéť k tobě přijde kalich“."
    - "Poblíž Šajch Sa'd v Havranu ukázali poutnici Egerii v 80. letech 4. století Jobův hrob v Karneas s kostelem nad ním dosud nedostavěným; „Jobův kámen“ tam je ve skutečnosti stéla Ramesse II. a svatyně Jobova dosud stojí ve vesnici v jižní Sýrii. Edómské kopce, druhý kandidát, leží za hranicí v Jordánsku jižně od Mrtvého moře."
  sv:
    - "”I Us' land levde en man som hette Job.” Var det landet låg säger Bibeln aldrig, och frågan har varit öppen sedan antiken. Namnet tillhör tre män i släktlistorna: Us, son till Aram, Us (Huz i King James-översättningen), son till Nachor, Abrahams bror, och Us, son till horiten Dishan, bland Seirs klaner. Två tolkningar följer."
    - "Den södra placerar Us i eller bredvid Edom: Klagovisorna vänder sig till ”du dotter Edom, du som bor i Us' land”, Jobs vän Elifas kommer från Teman i Edom, och den grekiska Bibelns not i slutet av Job sätter honom ”vid gränserna mellan Idumeen och Arabien”. Den norra ser till det arameiska Us och till Hauran, söder om Damaskus, där Josefus säger att Us grundade Trachonitis och Damaskus och där en grav för Job har vördats vid Sheikh Saad sedan åtminstone 300-talet; oasen Wadi Sirhan österut har också föreslagits. Kartan behåller den edomitiska platsen först och de andra bredvid."
    - "Landet nämns tre gånger. Job, ”ostrafflig och redlig”, bodde där med sina sju söner och tre döttrar och sina hjordar, tills sabéerna från söder och kaldéerna från Mesopotamien tog dem och vinden från öknen slog mot hans hus: plundrare från båda håll, vilket är skälet till att landet har sökts mellan dem. Jeremias vredesbägare går till ”alla konungar i Us' land och alla konungar i filistéernas land”, och Klagovisorna varnar Edom i Us att ”Också till dig skall kalken komma”."
    - "Nära Sheikh Saad i Hauran fick pilgrimen Egeria på 380-talet se Jobs grav i Carneas, med en kyrka över som ännu inte var färdig; ”Jobs sten” där är i själva verket en stele av Ramses II, och en helgedom åt Job står kvar i byn i södra Syrien. Edoms berg, den andra kandidaten, ligger över gränsen i Jordanien söder om Döda havet."
  nb:
    - "«I landet Us var det en mann som hette Job.» Hvor det landet lå, sier Bibelen aldri, og spørsmålet har vært åpent siden antikken. Navnet tilhører tre menn i slektstavlene: Us, sønn av Aram, Us (Huz i King James-oversettelsen), sønn av Nahor, Abrahams bror, og Us, sønn av Disjan horitten, blant Se'irs klaner. To tolkninger følger."
    - "Den sørlige plasserer Us i eller ved Edom: Klagesangene henvender seg til «Edoms datter, du som bor i landet Us», Jobs venn Elifas kommer fra Teman i Edom, og den greske Bibelens note på slutten av Job plasserer ham «på grensen mellom Idumea og Arabia». Den nordlige ser til det arameiske Us og til Havran, sør for Damaskus, der Josefus sier at Us grunnla Trakonitis og Damaskus og der en grav for Job har vært æret ved Sheikh Saad siden minst 300-tallet; oasen Wadi Sirhan i øst er også foreslått. Kartet beholder det edomittiske stedet først og de andre ved siden av."
    - "Landet er nevnt tre ganger. Job, «ulastelig og rettskaffen», bodde der med sine sju sønner og tre døtre og sine hjorder, til sabeerne fra sør og kaldeerne fra Mesopotamia tok dem og vinden fra ørkenen støtte mot huset hans: plyndrere fra begge retninger, og derfor har landet vært søkt mellom dem. Jeremias beger av vrede går til «alle kongene i landet Us og alle kongene i filistrenes land», og Klagesangene advarer Edom i Us: «Også til dig skal begeret komme»."
    - "Nær Sheikh Saad i Havran ble pilegrimen Egeria i 380-årene vist Jobs grav i Carneas, med en kirke over den som fortsatt var uferdig; «Jobs stein» der er i virkeligheten en stele av Ramses II, og en helligdom for Job står fortsatt i landsbyen i det sørlige Syria. Edoms åser, den andre kandidaten, ligger på den andre siden av grensen i Jordan sør for Dødehavet."
  tl:
    - "“May isang lalake sa lupain ng Uz, na ang pangalan ay Job.” Hindi kailanman sinasabi ng Biblia kung saan naroon ang lupaing iyon, at bukás ang tanong mula pa noong sinaunang panahon. Ang pangalan ay pag-aari ng tatlong lalaki sa mga talaan ng lahi: si Uz na anak ni Aram, si Uz (Huz sa King James) na anak ni Nachor, kapatid ni Abraham, at si Uz na anak ni Disan na Horeo, sa mga angkan ng Seir. Dalawang pagbasa ang sumusunod."
    - "Inilalagay ng timugang pagbasa ang Uz sa Edom o sa tabi nito: nagsasalita ang Panaghoy sa “Oh anak na babae ng Edom, na tumatahan sa lupain ng Uz”, ang kaibigan ni Job na si Eliphaz ay mula sa Teman sa Edom, at inilalagay siya ng tala ng Bibliyang Griego sa wakas ng Job “sa mga hangganan ng Idumea at Arabia”. Tumitingin ang hilagang pagbasa sa Uz na Arameo at sa Hauran, sa timog ng Damasco, kung saan ayon kay Josefo ay itinatag ni Uz ang Traconite at Damasco at kung saan iginagalang ang libingan ni Job sa Sheikh Saad mula pa noong ika-4 na siglo; iminungkahi rin ang oasis ng Wadi Sirhan sa silangan. Pinananatiling una ng mapa ang pook na Edomita at sa tabi nito ang iba."
    - "Tatlong beses pinangalanan ang lupain. Si Job, “sakdal at matuwid”, ay tumira roon kasama ng pitong anak na lalake at tatlong anak na babae at ng kaniyang mga kawan, hanggang dalhin silang lahat ng mga Sabeo mula sa timog at ng mga Caldeo mula sa Mesopotamia at hampasin ng hangin mula sa ilang ang kaniyang bahay: mga mandarambong mula sa magkabilang panig, kaya hinahanap ang lupain sa pagitan nila. Ang saro ng poot ni Jeremias ay para sa “lahat ng hari sa lupain ng Hus, at ang lahat ng hari sa lupain ng mga Filisteo”, at binabalaan ng Panaghoy ang Edom sa Uz na “ang saro ay darating din sa iyo”."
    - "Malapit sa Sheikh Saad sa Hauran, ipinakita sa manlalakbay na si Egeria noong dekada 380 ang libingan ni Job sa Carneas, na may simbahang hindi pa tapos sa ibabaw; ang “bato ni Job” doon ay talagang estela ni Ramses II, at nakatayo pa rin ang dambana ni Job sa nayon sa timog Siria. Ang mga burol ng Edom, ang ibang kandidato, ay nasa kabilang hangganan sa Jordan, timog ng Dagat na Patay."
