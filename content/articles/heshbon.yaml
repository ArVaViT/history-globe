body:
  en:
    - "Heshbon is identified with Tell Hesban in Jordan, a high hill about 20 km southwest of Amman and north of Madaba, at the edge of the plateau where the land drops toward the Jordan valley. The Heshbon Expedition of Andrews University dug there from 1968 to 1976, led first by Siegfried Horn and then by Lawrence Geraty, and work has continued under the Madaba Plains Project. No Late Bronze Age town has been found on the hill, and only scattered remains of the twelfth and eleventh centuries BC, so whether Tell Hesban is the Heshbon of Sihon or that town stood elsewhere is disputed."
    - "In Numbers, Heshbon is the city of Sihon, king of the Amorites, who had taken the land of Moab as far as the Arnon. Israel defeated him and dwelt in Heshbon; the children of Reuben built it, it marked the border of Gad, and it became a city of the Levites. Jephthah later reminded the Ammonites that Israel had dwelt in Heshbon for three hundred years. In Isaiah and Jeremiah it is a town of Moab, and Jeremiah also bids Heshbon howl in his oracle against Ammon. The Song of Songs likens the beloved's eyes to the fishpools in Heshbon."
    - "On Tell Hesban a large reservoir was cut and plastered in the Iron Age, and the town of the later Iron Age has yielded Ammonite pottery. In the Hellenistic period a fortress probably stood on the summit. Josephus lists Heshbon among the towns of Moab held by the Jews at the end of the reign of Alexander Jannaeus, says that Herod settled chosen horsemen in Hesebonitis in Perea, and records that in AD 66 Jewish bands laid waste Sebonitis together with other neighbouring districts."
    - "Under Rome the town, now called Esbus, struck its own coins, and a temple and other public buildings stood on the summit. Early in the fourth century Eusebius describes Esbus as a famous city of Arabia in the mountains opposite Jericho, twenty miles from the Jordan. In the Byzantine period two basilica churches with mosaic floors were built on the hill."
  ru:
    - "Есевон отождествляют с холмом Телль-Хесбан в Иордании, примерно в 20 км к юго-западу от Аммана и к северу от Медевы, на краю плато, где земля обрывается к долине Иордана. Экспедиция Университета Эндрюса копала здесь с 1968 по 1976 год, сначала под руководством Зигфрида Хорна, затем Лоуренса Джерати, и работы продолжаются в рамках проекта «Равнины Медевы». Города позднего бронзового века на холме не нашли, а от XII–XI веков до н. э. остались лишь разрозненные следы, поэтому спорно, тот ли это Есевон Сигона, или тот город стоял в другом месте."
    - "В книге Чисел Есевон — город Сигона, царя Аморрейского, который отнял у Моава землю до Арнона. Израиль победил его и поселился в Есевоне; сыны Рувимовы построили его, он отмечал границу Гада и стал городом левитов. Позже Иеффай напоминал Аммонитянам, что Израиль уже триста лет живёт в Есевоне. У Исаии и Иеремии это город Моава, а в пророчестве против Аммона Иеремия велит Есевону рыдать. В Песни песней глаза возлюбленной сравниваются с озерками Есевонскими."
    - "На Телль-Хесбане в железном веке был высечен и оштукатурен большой водоём, а в городе позднего железного века найдена аммонитская керамика. В эллинистическое время на вершине, вероятно, стояла крепость. Иосиф Флавий называет Есевон среди моавитских городов, которыми владели иудеи в конце царствования Александра Янная, сообщает, что Ирод поселил отборных всадников в Есевонитиде в Перее, и пишет, что в 66 г. н. э. иудейские отряды опустошили Себонитиду вместе с другими соседними областями."
    - "При римлянах город, называвшийся теперь Есбус, чеканил собственную монету, а на вершине стояли храм и другие общественные здания. В начале IV века Евсевий описывает Есбус как знаменитый город Аравии в горах напротив Иерихона, в двадцати милях от Иордана. В византийское время на холме построили две базилики с мозаичными полами."
  uk:
    - "Гесбон ототожнюють із Телль-Хесбаном в Йорданії — високим пагорбом приблизно за 20 км на південний захід від Амману й на північ від Мадаби, на краю плато, де земля спадає до Йорданської долини. Експедиція Гесбона Університету Ендрюса розкопувала там з 1968 по 1976 рік, спершу під керівництвом Зігфріда Хорна, а потім Лоуренса Джерейті, і роботи тривали в межах Проєкту рівнин Мадаби. Міста пізнього бронзового віку на пагорбі не знайдено, лише розрізнені рештки XII–XI ст. до н. е., тож чи є Телль-Хесбан Гесбоном Сігона, чи те місто стояло деінде, оспорюють."
    - "У Книзі Чисел Гесбон — місто Сігона, царя аморейського, який узяв землю Моава аж до Арнону. Ізраїль розбив його й оселився в Гесбоні; сини Рувима збудували його, він позначав межу Гада й став містом левітів. Єфтай пізніше нагадав аммонітянам, що Ізраїль жив у Гесбоні триста років. В Ісаї та Єремії це місто Моава, а Єремія також велить Гесбонові голосити в оракулі проти Аммона. Пісня над піснями порівнює очі коханої зі ставками в Гесбоні."
    - "На Телль-Хесбані в залізному віці вирубали й обмазали велику водойму, а місто пізнішого залізного віку дало аммонітську кераміку. В елліністичну добу на вершині, ймовірно, стояла фортеця. Йосиф Флавій перелічує Гесбон серед моавських міст, які утримували юдеї наприкінці царювання Александра Янная, каже, що Ірод оселив добірних вершників в Есебонітиді в Переї, і записує, що 66 р. н. е. юдейські загони спустошили Севонітиду разом з іншими сусідніми округами."
    - "За Рима місто, тепер зване Есбус, карбувало власні монети, а на вершині стояли храм та інші громадські будівлі. На початку IV ст. Євсевій описує Есбус як славне місто Аравії в горах навпроти Єрихона, за двадцять миль від Йордану. За візантійської доби на пагорбі збудували дві базиліки з мозаїчними підлогами."
  es:
    - "Hesbón se identifica con Tell Hesban, en Jordania, una alta colina a unos 20 km al suroeste de Amán y al norte de Madaba, en el borde de la meseta donde la tierra desciende hacia el valle del Jordán. La Expedición a Hesbón de la Universidad Andrews excavó allí de 1968 a 1976, dirigida primero por Siegfried Horn y luego por Lawrence Geraty, y los trabajos han continuado bajo el Proyecto de las Llanuras de Madaba. No se ha hallado en la colina ninguna población del Bronce Final, y solo restos dispersos de los siglos XII y XI a. C., de modo que se discute si Tell Hesban es la Hesbón de Sehón o si esa ciudad estuvo en otro lugar."
    - "En Números, Hesbón es la ciudad de Sehón, rey de los amorreos, que había tomado la tierra de Moab hasta el Arnón. Israel lo derrotó y habitó en Hesbón; los hijos de Rubén la edificaron, marcó el límite de Gad y llegó a ser una ciudad de los levitas. Jefté recordó después a los amonitas que Israel había habitado en Hesbón trescientos años. En Isaías y Jeremías es una ciudad de Moab, y Jeremías ordena también a Hesbón que aúlle en su oráculo contra Amón. El Cantar de los Cantares compara los ojos de la amada con las pesqueras de Hesbón."
    - "En Tell Hesban se excavó y revocó un gran depósito de agua en la Edad del Hierro, y la población de la Edad del Hierro tardía ha dado cerámica amonita. En el período helenístico una fortaleza probablemente se alzaba en la cima. Josefo enumera Hesbón entre las ciudades de Moab en poder de los judíos al final del reinado de Alejandro Janeo, dice que Herodes estableció jinetes escogidos en Hesebonítide, en Perea, y registra que en el 66 d. C. bandas judías devastaron Sebonítide junto con otros distritos vecinos."
    - "Bajo Roma la población, llamada ahora Esbus, acuñó moneda propia, y un templo y otros edificios públicos se alzaban en la cima. A comienzos del siglo IV Eusebio describe Esbus como una ciudad famosa de Arabia, en los montes frente a Jericó, a veinte millas del Jordán. En el período bizantino se construyeron en la colina dos iglesias basilicales con suelos de mosaico."
  pt:
    - "Hesbom é identificada com Tell Hesban, na Jordânia, uma colina alta a cerca de 20 km a sudoeste de Amã e ao norte de Madaba, na borda do planalto onde a terra desce para o vale do Jordão. A Expedição de Hesbom da Universidade Andrews escavou ali de 1968 a 1976, dirigida primeiro por Siegfried Horn e depois por Lawrence Geraty, e o trabalho prosseguiu sob o Projeto das Planícies de Madaba. Nenhuma cidade do Bronze Tardio foi achada na colina, e só restos esparsos dos séculos XII e XI a.C., de modo que é disputado se Tell Hesban é a Hesbom de Seom ou se aquela cidade ficava em outro lugar."
    - "Em Números, Hesbom é a cidade de Seom, rei dos amorreus, que tomara a terra de Moabe até o Arnom. Israel o derrotou e habitou em Hesbom; os filhos de Rúben a edificaram, ela marcava a fronteira de Gade e tornou-se cidade dos levitas. Jefté lembrou mais tarde aos amonitas que Israel habitara em Hesbom por trezentos anos. Em Isaías e Jeremias é uma cidade de Moabe, e Jeremias manda também Hesbom uivar em seu oráculo contra Amom. O Cântico dos Cânticos compara os olhos da amada às piscinas de Hesbom."
    - "Em Tell Hesban um grande reservatório foi escavado e rebocado na Idade do Ferro, e a cidade do Ferro posterior produziu cerâmica amonita. No período helenístico uma fortaleza provavelmente ficava no cume. Josefo lista Hesbom entre as cidades de Moabe mantidas pelos judeus no fim do reinado de Alexandre Janeu, diz que Herodes estabeleceu cavaleiros escolhidos em Hesebonitis, na Pereia, e registra que em 66 d.C. bandos judeus devastaram Sebonitis juntamente com outros distritos vizinhos."
    - "Sob Roma a cidade, então chamada Esbus, cunhou moedas próprias, e um templo e outros edifícios públicos ficavam no cume. No início do século IV, Eusébio descreve Esbus como uma famosa cidade da Arábia nas montanhas em frente a Jericó, a vinte milhas do Jordão. No período bizantino, duas igrejas de planta basilical com pisos de mosaico foram construídas na colina."
  de:
    - "Heschbon wird mit Tell Hesban in Jordanien gleichgesetzt, einem hohen Hügel etwa 20 km südwestlich von Amman und nördlich von Madaba, am Rand der Hochebene, wo das Land zum Jordantal abfällt. Die Heshbon Expedition der Andrews University grub dort von 1968 bis 1976, zuerst unter Siegfried Horn, dann unter Lawrence Geraty, und die Arbeit wurde unter dem Madaba Plains Project fortgesetzt. Eine spätbronzezeitliche Stadt ist auf dem Hügel nicht gefunden worden, nur verstreute Reste des 12. und 11. Jahrhunderts v. Chr., sodass umstritten ist, ob Tell Hesban das Heschbon Sihons ist oder jene Stadt anderswo lag."
    - "Im vierten Buch Mose ist Heschbon die Stadt Sihons, des Amoriterkönigs, der das Land Moab bis zum Arnon genommen hatte. Israel besiegte ihn und wohnte in Heschbon; die Kinder Ruben bauten es, es bezeichnete die Grenze Gads und wurde eine Stadt der Leviten. Jeftah erinnerte die Ammoniter später daran, dass Israel dreihundert Jahre in Heschbon gewohnt hatte. Bei Jesaja und Jeremia ist es eine Stadt Moabs, und Jeremia fordert Heschbon in seinem Orakel gegen Ammon auch zum Heulen auf. Das Hohelied vergleicht die Augen der Geliebten mit den Teichen in Heschbon."
    - "Auf Tell Hesban wurde in der Eisenzeit ein großes Becken angelegt und verputzt, und die Stadt der späteren Eisenzeit hat ammonitische Keramik geliefert. In hellenistischer Zeit stand auf dem Gipfel wahrscheinlich eine Festung. Josephus führt Heschbon unter den Städten Moabs auf, die die Juden am Ende der Herrschaft Alexander Jannäus' hielten, sagt, Herodes habe auserwählte Reiter in Hesebonitis in Peräa angesiedelt, und berichtet, dass 66 n. Chr. jüdische Banden Sebonitis zusammen mit anderen Nachbarbezirken verwüsteten."
    - "Unter Rom prägte die Stadt, nun Esbus genannt, eigene Münzen, und ein Tempel und andere öffentliche Bauten standen auf dem Gipfel. Im frühen 4. Jahrhundert beschreibt Eusebius Esbus als berühmte Stadt Arabiens im Gebirge gegenüber von Jericho, zwanzig Meilen vom Jordan. In byzantinischer Zeit wurden auf dem Hügel zwei Basilikakirchen mit Mosaikböden gebaut."
  fr:
    - "Hesbon est identifiée à Tell Hesban, en Jordanie, une haute colline à environ 20 km au sud-ouest d’Amman et au nord de Madaba, au bord du plateau où le terrain descend vers la vallée du Jourdain. L’expédition de Hesbon de l’Université Andrews y fouilla de 1968 à 1976, dirigée d’abord par Siegfried Horn puis par Lawrence Geraty, et les travaux se sont poursuivis sous le Madaba Plains Project. Aucune ville du Bronze récent n’a été trouvée sur la colline, et seulement des vestiges épars des XIIe et XIe siècles av. J.-C., de sorte que l’on discute pour savoir si Tell Hesban est la Hesbon de Sihon ou si cette ville se trouvait ailleurs."
    - "Dans les Nombres, Hesbon est la ville de Sihon, roi des Amoréens, qui avait pris le pays de Moab jusqu’à l’Arnon. Israël le vainquit et habita à Hesbon ; les fils de Ruben la bâtirent, elle marquait la frontière de Gad, et elle devint une ville des Lévites. Jephté rappela plus tard aux Ammonites qu’Israël avait habité à Hesbon trois cents ans. Chez Ésaïe et Jérémie, c’est une ville de Moab, et Jérémie ordonne aussi à Hesbon de gémir dans son oracle contre Ammon. Le Cantique des cantiques compare les yeux de la bien-aimée aux viviers de Hesbon."
    - "Sur Tell Hesban, un grand réservoir fut taillé et enduit à l’âge du Fer, et la ville du Fer récent a livré de la poterie ammonite. À l’époque hellénistique, une forteresse se dressait probablement au sommet. Josèphe énumère Hesbon parmi les villes de Moab tenues par les Juifs à la fin du règne d’Alexandre Jannée, dit qu’Hérode installa des cavaliers choisis dans l’Hésébonitide en Pérée, et rapporte qu’en 66 apr. J.-C. des bandes juives ravagèrent la Sébonitide avec d’autres districts voisins."
    - "Sous Rome, la ville, appelée alors Esbous, frappait sa propre monnaie, et un temple et d’autres édifices publics se dressaient au sommet. Au début du IVe siècle, Eusèbe décrit Esbous comme une ville célèbre d’Arabie dans les montagnes en face de Jéricho, à vingt milles du Jourdain. À l’époque byzantine, deux basiliques à sols de mosaïque furent bâties sur la colline."
  pl:
    - "Cheszbon utożsamia się z Tell Hesban w Jordanii, wysokim wzgórzem około 20 km na południowy zachód od Ammanu i na północ od Madaby, na skraju płaskowyżu, gdzie ziemia opada ku dolinie Jordanu. Ekspedycja Heshbon Uniwersytetu Andrewsa prowadziła tam wykopaliska w latach 1968–1976, kierowana najpierw przez Siegfrieda Horna, a potem przez Lawrence'a Geraty'ego, a prace trwają dalej w ramach Madaba Plains Project. Na wzgórzu nie znaleziono miasta z późnej epoki brązu, a tylko rozproszone szczątki z XII i XI w. p.n.e., więc jest sporne, czy Tell Hesban to Cheszbon Sychona, czy miasto to leżało gdzie indziej."
    - "W Księdze Liczb Cheszbon jest miastem Sychona, króla Amorytów, który zajął ziemię Moabu aż po Arnon. Izrael go pokonał i zamieszkał w Cheszbonie; synowie Rubena go odbudowali, wyznaczał granicę Gada i stał się miastem lewitów. Jefte przypomniał później Ammonitom, że Izrael mieszkał w Cheszbonie przez trzysta lat. U Izajasza i Jeremiasza jest miastem Moabu, a Jeremiasz każe też Cheszbonowi zawodzić w swoim orędziu przeciw Ammonowi. Pieśń nad Pieśniami porównuje oczy ukochanej do sadzawek w Cheszbonie."
    - "Na Tell Hesban w epoce żelaza wykuto i otynkowano duży zbiornik, a miasto z późniejszej epoki żelaza dostarczyło ceramiki ammonickiej. W okresie hellenistycznym na szczycie stała prawdopodobnie twierdza. Józef Flawiusz zalicza Cheszbon do miast Moabu w rękach Żydów pod koniec panowania Aleksandra Janneusza, mówi, że Herod osiedlił wybranych jeźdźców w Hesebonitis w Perei, i zapisuje, że w 66 r. n.e. żydowskie bandy spustoszyły Sebonitis wraz z innymi sąsiednimi okręgami."
    - "Za Rzymu miasto, zwane teraz Esbus, biło własne monety, a na szczycie stały świątynia i inne budynki publiczne. Na początku IV w. Euzebiusz opisuje Esbus jako sławne miasto Arabii w górach naprzeciw Jerycha, dwadzieścia mil od Jordanu. W okresie bizantyńskim na wzgórzu zbudowano dwa kościoły bazylikowe z posadzkami mozaikowymi."
  it:
    - "Chesbon è identificata con Tell Hesban in Giordania, un’alta collina circa 20 km a sud-ovest di Amman e a nord di Madaba, al margine dell’altopiano dove il terreno scende verso la valle del Giordano. La Spedizione di Chesbon dell’Andrews University vi scavò dal 1968 al 1976, diretta prima da Siegfried Horn e poi da Lawrence Geraty, e il lavoro è proseguito sotto il Madaba Plains Project. Sulla collina non è stata trovata alcuna città del Bronzo Tardo, e solo resti sparsi dei secoli XII e XI a.C., così se Tell Hesban sia la Chesbon di Sicon o se quella città sorgesse altrove è discusso."
    - "Nei Numeri, Chesbon è la città di Sicon, re degli Amorrei, che aveva preso il paese di Moab fino all’Arnon. Israele lo sconfisse e abitò a Chesbon; i figli di Ruben la costruirono, segnò il confine di Gad e divenne una città dei Leviti. Iefte ricordò più tardi agli Ammoniti che Israele aveva abitato a Chesbon per trecento anni. In Isaia e in Geremia è una città di Moab, e Geremia ordina anche a Chesbon di urlare nel suo oracolo contro Ammon. Il Cantico dei Cantici paragona gli occhi dell’amata alle piscine di Chesbon."
    - "A Tell Hesban un grande serbatoio fu scavato e intonacato nell’età del Ferro, e la città della tarda età del Ferro ha restituito ceramica ammonita. In età ellenistica una fortezza sorgeva probabilmente sulla sommità. Giuseppe Flavio elenca Chesbon fra le città di Moab tenute dai Giudei alla fine del regno di Alessandro Ianneo, dice che Erode insediò cavalieri scelti in Esebonitide in Perea e registra che nel 66 d.C. bande giudaiche devastarono la Sebonitide insieme ad altri distretti vicini."
    - "Sotto Roma la città, ora chiamata Esbus, coniò monete proprie, e un tempio e altri edifici pubblici sorgevano sulla sommità. All’inizio del IV secolo Eusebio descrive Esbus come una famosa città dell’Arabia sui monti di fronte a Gerico, a venti miglia dal Giordano. In età bizantina furono costruite sulla collina due chiese basilicali con pavimenti a mosaico."
  nl:
    - "Chesbon wordt vereenzelvigd met Tell Hesban in Jordanië, een hoge heuvel ongeveer 20 km ten zuidwesten van Amman en ten noorden van Madaba, aan de rand van het plateau waar het land afloopt naar het Jordaandal. De Heshbon Expedition van Andrews University groef daar van 1968 tot 1976, eerst onder leiding van Siegfried Horn en daarna van Lawrence Geraty, en het werk gaat voort onder het Madaba Plains Project. Op de heuvel is geen stad uit de Late Bronstijd gevonden, en slechts verspreide resten uit de 12e en 11e eeuw v.Chr., zodat het betwist wordt of Tell Hesban het Chesbon van Sihon is of dat die stad elders stond."
    - "In Numeri is Chesbon de stad van Sihon, koning van de Amorieten, die het land van Moab tot aan de Arnon had ingenomen. Israël versloeg hem en woonde in Chesbon; de kinderen van Ruben bouwden het, het markeerde de grens van Gad, en het werd een stad van de Levieten. Jefta herinnerde de Ammonieten er later aan dat Israël driehonderd jaar in Chesbon had gewoond. In Jesaja en Jeremia is het een stad van Moab, en Jeremia gebiedt Chesbon ook te huilen in zijn godsspraak tegen Ammon. Het Hooglied vergelijkt de ogen van de geliefde met de visvijvers in Chesbon."
    - "Op Tell Hesban werd in de IJzertijd een groot bassin uitgehouwen en gepleisterd, en de stad uit de late IJzertijd heeft Ammonitisch aardewerk opgeleverd. In de hellenistische tijd stond op de top waarschijnlijk een vesting. Josephus noemt Chesbon onder de steden van Moab die de Joden aan het eind van de regering van Alexander Jannaeus in handen hadden, zegt dat Herodes uitgelezen ruiters vestigde in Hesebonitis in Perea, en vermeldt dat Joodse benden in 66 n.Chr. Sebonitis verwoestten samen met andere naburige districten."
    - "Onder Rome sloeg de stad, nu Esbus geheten, eigen munten, en op de top stonden een tempel en andere openbare gebouwen. In het begin van de 4e eeuw beschrijft Eusebius Esbus als een beroemde stad van Arabië in het gebergte tegenover Jericho, twintig mijl van de Jordaan. In de Byzantijnse tijd werden twee basilicakerken met mozaïekvloeren op de heuvel gebouwd."
  cs:
    - "Chešbón se ztotožňuje s Tell Hesban v Jordánsku, vysokým pahorkem asi 20 km jihozápadně od Ammánu a severně od Madaby, na okraji náhorní plošiny, kde země klesá k Jordánskému údolí. Expedice Chešbónu z Andrewsovy univerzity tam kopala v letech 1968 až 1976, vedená nejprve Siegfriedem Hornem a poté Lawrencem Geratym, a práce pokračovaly pod Projektem Madabských planin. Na pahorku nebylo nalezeno žádné město z pozdní doby bronzové, jen roztroušené pozůstatky z 12. a 11. stol. př. n. l., takže zda je Tell Hesban Chešbónem Sichonovým, nebo ono město stálo jinde, je sporné."
    - "V Numeri je Chešbón městem Sichona, krále Amorejských, který zabral zemi Moábu až k Arnonu. Izrael jej porazil a bydlel v Chešbónu; synové Rúbenovi je vystavěli, vyznačovalo hranici Gádovu a stalo se městem levitů. Jiftách později připomněl Amónským, že Izrael bydlel v Chešbónu tři sta let. U Izajáše a Jeremjáše je městem Moábu a Jeremjáš také v proroctví proti Amónu vybízí Chešbón, aby kvílel. Píseň písní přirovnává oči milované k rybníkům v Chešbónu."
    - "Na Tell Hesban byla v době železné vytesána a omítnuta velká nádrž a město pozdní doby železné poskytlo amónskou keramiku. V helénistickém období stála na vrcholu pravděpodobně pevnost. Josephus uvádí Chešbón mezi městy Moábu drženými Židy na konci vlády Alexandra Jannaia, praví, že Herodes usadil vybrané jezdce v Hesebonitidě v Perei, a zaznamenává, že roku 66 n. l. židovské tlupy vyplenily Sebonitidu spolu s jinými sousedními okresy."
    - "Za Říma město, nyní zvané Esbus, razilo vlastní mince a na vrcholu stály chrám a jiné veřejné budovy. Na počátku 4. století popisuje Eusebios Esbus jako slavné město Arábie v horách naproti Jerichu, dvacet mil od Jordánu. V byzantském období byly na pahorku vystavěny dvě baziliky s mozaikovými podlahami."
  sv:
    - "Heshbon identifieras med Tell Hesban i Jordanien, en hög kulle omkring 20 km sydväst om Amman och norr om Madaba, i kanten av platån där landet sluttar mot Jordandalen. Heshbon Expedition vid Andrews University grävde där 1968–1976, först under Siegfried Horn och sedan under Lawrence Geraty, och arbetet har fortsatt inom Madaba Plains Project. Ingen stad från senbronsåldern har hittats på kullen, och bara spridda lämningar från 1100- och 1000-talen f.Kr., så om Tell Hesban är Sichons Heshbon eller om den staden låg någon annanstans är omstritt."
    - "I Fjärde Moseboken är Heshbon staden för Sichon, amoréernas kung, som hade tagit Moabs land ända till Arnon. Israel besegrade honom och bosatte sig i Heshbon; Rubens barn byggde upp den, den markerade Gads gräns, och den blev en levitstad. Jefta påminde senare ammoniterna om att Israel hade bott i Heshbon i tre hundra år. Hos Jesaja och Jeremia är den en stad i Moab, och Jeremia manar också Heshbon att jämra sig i sin spådom mot Ammon. Höga visan liknar den älskades ögon vid dammarna i Heshbon."
    - "På Tell Hesban hade en stor reservoar huggits och putsats under järnåldern, och staden från senare järnåldern har gett ammonitisk keramik. Under hellenistisk tid stod sannolikt en fästning på toppen. Josefus räknar Heshbon bland de moabitiska städerna som judarna höll vid slutet av Alexander Jannaios regering, säger att Herodes bosatte utvalda ryttare i Hesebonitis i Peraia, och berättar att judiska band år 66 e.Kr. härjade Sebonitis tillsammans med andra grannområden."
    - "Under romarna präglade staden, som nu kallades Esbus, egna mynt, och ett tempel och andra offentliga byggnader stod på toppen. Tidigt på 300-talet beskriver Eusebios Esbus som en berömd stad i Arabien i bergen mitt emot Jeriko, tjugo romerska mil från Jordan. Under bysantinsk tid byggdes två basilikakyrkor med mosaikgolv på kullen."
  nb:
    - "Hesjbon identifiseres med Tell Hesban i Jordan, en høy åsrygg omtrent 20 km sørvest for Amman og nord for Madaba, i kanten av platået der landet faller mot Jordan-dalen. Heshbon Expedition fra Andrews University gravde der fra 1968 til 1976, først ledet av Siegfried Horn og så av Lawrence Geraty, og arbeidet har fortsatt under Madaba Plains Project. Ingen by fra sen bronsealder er funnet på høyden, og bare spredte rester fra 1100- og 1000-tallet f.Kr., så om Tell Hesban er Sihons Hesjbon eller om den byen lå et annet sted, er omstridt."
    - "I Fjerde Mosebok er Hesjbon byen til Sihon, amorittenes konge, som hadde tatt Moabs land helt til Arnon. Israel beseiret ham og bosatte seg i Hesjbon; Rubens barn bygde den opp, den markerte grensen til Gad, og den ble en levittby. Jefta minnet senere ammonittene om at Israel hadde bodd i Hesjbon i tre hundre år. Hos Jesaja og Jeremia er den en by i Moab, og Jeremia ber også Hesjbon hyle i sitt utsagn mot Ammon. Høysangen sammenlikner den elskedes øyne med fiskedammene i Hesjbon."
    - "På Tell Hesban ble det hugget og pusset et stort reservoar i jernalderen, og byen fra sen jernalder har gitt ammonittisk keramikk. I hellenistisk tid sto trolig en festning på toppen. Josefus oppfører Hesjbon blant byene i Moab som jødene holdt mot slutten av Aleksander Jannaios' regjering, sier at Herodes bosatte utvalgte ryttere i Hesbonitis i Perea, og forteller at jødiske bander i 66 e.Kr. herjet Sebonitis sammen med andre nabodistrikter."
    - "Under Roma slo byen, nå kalt Esbus, sine egne mynter, og et tempel og andre offentlige bygninger sto på toppen. Tidlig på 300-tallet beskriver Eusebius Esbus som en berømt by i Arabia i fjellene overfor Jeriko, tjue romerske mil fra Jordan. I bysantinsk tid ble to basilikakirker med mosaikkgulv bygd på høyden."
  tl:
    - "Ang Hesbon ay tinutukoy sa Tell Hesban sa Jordan, isang mataas na burol mga 20 km sa timog-kanluran ng Amman at hilaga ng Madaba, sa gilid ng talampas kung saan bumababa ang lupain patungo sa libis ng Jordan. Ang Ekspedisyon ng Hesbon ng Andrews University ay naghukay roon mula 1968 hanggang 1976, pinamunuan muna ni Siegfried Horn at pagkatapos ni Lawrence Geraty, at nagpatuloy ang gawain sa ilalim ng Madaba Plains Project. Walang bayan ng Huling Panahon ng Tanso ang natagpuan sa burol, at kalat-kalat na labi lamang ng ika-12 at ika-11 siglo BK, kaya't pinagtatalunan kung ang Tell Hesban ang Hesbon ni Sehon o kung nasa ibang lugar ang bayang iyon."
    - "Sa Mga Bilang, ang Hesbon ang lungsod ni Sehon, hari ng mga Amorrheo, na sumakop sa lupain ng Moab hanggang sa Arnon: “ang Hesbon ay siyang bayan ni Sehon na hari ng mga Amorrheo”. Tinalo siya ng Israel at tumahan sa Hesbon; itinayo ito ng mga anak ni Ruben, minarkahan nito ang hangganan ni Gad, at naging lungsod ng mga Levita. Kalaunan ay ipinaalaala ni Jephte sa mga Ammonita na ang Israel ay “tumatahan sa Hesbon at sa mga bayan nito” nang “tatlong daang taon”. Sa Isaias at Jeremias ito ay bayan ng Moab, at inuutusan din ni Jeremias ang Hesbon na managhoy sa kaniyang orakulo laban sa Ammon. Inihahambing ng Awit ng mga Awit ang mga mata ng minamahal sa “mga lawa sa Hesbon”."
    - "Sa Tell Hesban ay tinabas at pinlasteran ang isang malaking imbakang-tubig sa Panahon ng Bakal, at ang bayan ng huling Panahon ng Bakal ay nagbunga ng palayok na Ammonita. Sa panahong Helenistiko, marahil ay may kuta sa tuktok. Itinatala ni Josephus ang Hesbon sa mga bayan ng Moab na hawak ng mga Judio sa katapusan ng paghahari ni Alejandro Janneo, sinasabing nagpatira si Herodes ng mga piling mangangabayo sa Hesebonitis sa Perea, at itinatala na noong 66 AD winasak ng mga pangkat ng mga Judio ang Sebonitis kasama ng iba pang kalapit na distrito."
    - "Sa ilalim ng Roma ang bayan, na tinatawag nang Esbus, ay gumawa ng sariling mga barya, at isang templo at iba pang pampublikong gusali ang nakatayo sa tuktok. Sa simula ng ika-4 na siglo inilalarawan ni Eusebio ang Esbus bilang kilalang lungsod ng Arabia sa mga bundok sa tapat ng Jerico, dalawampung milya mula sa Jordan. Sa panahong Bisantino, dalawang simbahang basilika na may sahig na mosaiko ang itinayo sa burol."
  da:
    - "Hesjbon identificeres med Tell Hesban i Jordan, en høj bakke omkring 20 km sydvest for Amman og nord for Madaba, ved kanten af plateauet, hvor landet falder mod Jordandalen. Heshbon Expedition fra Andrews University gravede der fra 1968 til 1976, ledet først af Siegfried Horn og siden af Lawrence Geraty, og arbejdet er fortsat under Madaba Plains Project. Ingen by fra sen bronzealder er fundet på bakken, og kun spredte levn fra 1100-tallet og 1000-tallet f.Kr., så om Tell Hesban er Sihons Hesjbon, eller byen stod et andet sted, er omstridt."
    - "I Fjerde Mosebog er Hesjbon byen for Sihon, amoriternes konge, som havde taget Moabs land helt til Arnon. Israel besejrede ham og boede i Hesjbon; Rubens børn byggede den, den markerede Gads grænse, og den blev en leviternes by. Jefta mindede senere ammonitterne om, at Israel havde boet i Hesjbon i tre hundrede år. Hos Esajas og Jeremias er den en by i Moab, og Jeremias byder også Hesjbon at hyle i sit orakel mod Ammon. Højsangen sammenligner den elskedes øjne med fiskedammene i Hesjbon."
    - "På Tell Hesban blev et stort reservoir hugget og pudset i jernalderen, og byen fra den senere jernalder har givet ammonitisk keramik. I den hellenistiske periode stod sandsynligvis en fæstning på toppen. Josefus opregner Hesjbon blandt de moabitiske byer, jøderne holdt ved slutningen af Alexander Jannæus' regering, siger at Herodes bosatte udvalgte ryttere i Hesebonitis i Peræa, og beretter, at jødiske bander i 66 e.Kr. hærgede Sebonitis sammen med andre nabodistrikter."
    - "Under Rom prægede byen, nu kaldet Esbus, sine egne mønter, og et tempel og andre offentlige bygninger stod på toppen. Tidligt i 300-tallet beskriver Eusebios Esbus som en berømt by i Arabien i bjergene over for Jeriko, tyve romerske mil fra Jordan. I den byzantinske periode blev to basilikakirker med mosaikgulve bygget på bakken."
  sr:
    - "Есевон се поистовећује с Тел Хесбаном у Јордану, високим брдом око 20 км југозападно од Амана и северно од Мадабе, на ободу висоравни где земља пада према долини Јордана. Експедиција Хесбон Универзитета Ендруз копала је ту од 1968. до 1976, прво под вођством Зигфрида Хорна, а затим Лоренса Џератија, а рад је настављен у оквиру Пројекта равнице Мадабе. На брду није пронађен град касног бронзаног доба, а само расути остаци из 12. и 11. века п. н. е., па је спорно да ли је Тел Хесбан Есевон Сионов или је тај град стајао другде."
    - "У Бројевима је Есевон град Сиона, цара аморејског, који је узео земљу Моава све до Арнона. Израиљ га је победио и населио се у Есевону; синови Рувимови су га саградили, означавао је границу Гада и постао је град Левита. Јефтај је касније подсетио Амонце да је Израиљ живео у Есевону три стотине година. У Исаији и Јеремији он је град Моава, а Јеремија позива и Есевон да рида у свом пророштву против Амона. Песма над песмама упоређује очи драге с рибњацима у Есевону."
    - "На Тел Хесбану је у гвозденом добу исклесан и омалтерисан велики резервоар, а град каснијег гвозденог доба дао је амонску керамику. У хеленистичко доба на врху је вероватно стајала тврђава. Јосиф Флавије набраја Есевон међу градовима Моава које су Јевреји држали на крају владавине Александра Јаноја, каже да је Ирод населио изабране коњанике у Есебонитиди у Переји и бележи да су 66. н. е. јеврејске чете опустошиле Себонитиду заједно с другим суседним областима."
    - "Под Римом је град, сада звани Есбус, ковао сопствени новац, а на врху су стајали храм и друге јавне зграде. Почетком четвртог века Јевсевије описује Есбус као чувен град Арабије у планинама насупрот Јерихону, двадесет миља од Јордана. У византијско доба на брду су подигнуте две базилике са мозаичким подовима."
  hu:
    - "Hesbont a jordániai Tell Hesbánnal azonosítják, egy magas dombbal mintegy 20 km-re délnyugatra Ammántól és Madabától északra, a fennsík szélén, ahol a föld a Jordán-völgy felé ereszkedik. Az Andrews Egyetem Hesbon Expedíciója 1968-tól 1976-ig ásott ott, először Siegfried Horn, majd Lawrence Geraty vezetésével, és a munka a Madaba-síksági Projekt keretében folytatódott. A dombon késő bronzkori várost nem találtak, a Kr. e. 12. és 11. századból pedig csak szétszórt maradványokat, így vitatott, hogy Tell Hesbán-e Szihon Hesbonja, vagy az a város máshol állt."
    - "A Számok könyvében Hesbon Szihonnak, az emóreusok királyának városa, aki Moáb földjét az Arnonig elfoglalta. Izráel legyőzte őt, és Hesbonban lakott; Rúben fiai építették fel, Gád határát jelölte, és lévita város lett. Jefte később emlékeztette az ammonitákat, hogy Izráel háromszáz évig lakott Hesbonban. Ézsaiásnál és Jeremiásnál Moáb városa, és Jeremiás az Ammon elleni jövendölésében Hesbont is jajgatásra szólítja. Az Énekek éneke a kedves szemeit a hesboni halastavakhoz hasonlítja."
    - "Tell Hesbánon a vaskorban nagy víztározót vájtak és vakoltak be, és a későbbi vaskor városa ammoni kerámiát adott. A hellenisztikus korban valószínűleg erőd állt a csúcson. Josephus Hesbont azon moábi városok között sorolja fel, amelyeket a zsidók Alexandrosz Jannaiosz uralkodásának végén tartottak, azt mondja, hogy Heródes válogatott lovasokat telepített Hesebonitiszbe Peraeában, és feljegyzi, hogy Kr. u. 66-ban zsidó bandák Szebonitiszt más szomszédos kerületekkel együtt elpusztították."
    - "Róma alatt a város, akkor Esbusz, saját pénzt vert, és a csúcson templom és más középületek álltak. A 4. század elején Eusebius Esbuszt Arábia híres városaként írja le a Jerikóval szemközti hegyekben, húsz mérföldre a Jordántól. A bizánci korban két mozaikpadlós bazilika épült a dombon."
  fi:
    - "Hesbon tunnistetaan Tell Hesbaniksi Jordaniassa, korkeaksi kukkulaksi noin 20 km Ammanista lounaaseen ja Madabasta pohjoiseen ylätasangon reunalla, missä maa laskeutuu kohti Jordanin laaksoa. Andrewsin yliopiston Hesbon-retkikunta kaivoi siellä vuosina 1968–1976, ensin Siegfried Hornin ja sitten Lawrence Geratyn johdolla, ja työ on jatkunut Madaban tasangon hankkeessa. Kukkulalta ei ole löydetty myöhäispronssikauden kaupunkia, vain hajanaisia jäänteitä 1100- ja 1000-luvuilta eaa., joten kiistellään siitä, onko Tell Hesban Sihonin Hesbon vai sijaitsiko tuo kaupunki muualla."
    - "Mooseksen neljännessä kirjassa Hesbon on amorilaisten kuninkaan Sihonin kaupunki, joka oli vallannut Moabin maan Arnoniin asti. Israel voitti hänet ja asettui Hesboniin; ruubenilaiset rakensivat sen, se merkitsi Gadin rajaa, ja siitä tuli leeviläisten kaupunki. Jefta muistutti myöhemmin ammonilaisia, että Israel oli asunut Hesbonissa kolmesataa vuotta. Jesajassa ja Jeremiassa se on Moabin kaupunki, ja Jeremia kehottaa Hesbonia myös valittamaan ennustuksessaan Ammonia vastaan. Laulujen laulu vertaa rakastetun silmiä Hesbonin kalalammikoihin."
    - "Tell Hesbanilla hakattiin ja rapattiin suuri vesisäiliö rautakaudella, ja myöhemmän rautakauden kaupungista on löytynyt ammonilaista keramiikkaa. Hellenistisellä ajalla huipulla seisoi luultavasti linnake. Josephus luettelee Hesbonin Moabin kaupunkien joukossa, jotka juutalaiset omistivat Aleksandros Jannaioksen hallituskauden lopussa, sanoo Herodeksen asuttaneen valittuja ratsumiehiä Hesebonitikseen Pereassa ja kirjaa, että vuonna 66 jaa. juutalaiset joukot hävittivät Sebonitiksen muiden lähialueiden ohella."
    - "Rooman alaisuudessa kaupunki, jota nyt kutsuttiin Esbukseksi, löi omia kolikoita, ja huipulla seisoi temppeli ja muita julkisia rakennuksia. 300-luvun alussa Eusebios kuvaa Esbuksen Arabian kuuluisaksi kaupungiksi vuoristossa Jerikoa vastapäätä, kahdenkymmenen mailin päässä Jordanista. Bysanttilaisella ajalla kukkulalle rakennettiin kaksi mosaiikkilattiaista basilikaa."
  vi:
    - "Hết-bôn được đồng nhất với Tell Hesban ở Jordan, một ngọn đồi cao cách Amman khoảng 20 km về phía tây nam và phía bắc Madaba, ở rìa cao nguyên nơi đất dốc xuống thung lũng Giô-đanh. Đoàn khai quật Heshbon của Đại học Andrews đào ở đó từ năm 1968 đến 1976, trước tiên do Siegfried Horn rồi Lawrence Geraty dẫn đầu, và công việc tiếp tục dưới Madaba Plains Project. Không tìm thấy thị trấn thời Đồ Đồng Muộn trên đồi, chỉ có di tích rải rác của thế kỷ 12 và 11 TCN, nên việc Tell Hesban có phải là Hết-bôn của Si-hôn hay thành ấy ở chỗ khác còn tranh cãi."
    - "Trong Dân Số Ký, Hết-bôn là thành của Si-hôn, vua dân A-mô-rít, người đã chiếm xứ Mô-áp đến tận sông Ạt-nôn. Y-sơ-ra-ên đánh bại ông và ở tại Hết-bôn; con cháu Ru-bên xây thành, thành đánh dấu ranh giới Gát, và trở thành thành của người Lê-vi. Giép-thê về sau nhắc người Am-môn rằng Y-sơ-ra-ên đã ở Hết-bôn ba trăm năm. Trong Ê-sai và Giê-rê-mi, đó là một thành của Mô-áp, và Giê-rê-mi cũng bảo Hết-bôn than khóc trong lời tiên tri nghịch cùng Am-môn. Nhã Ca ví đôi mắt người yêu với các ao cá ở Hết-bôn."
    - "Trên Tell Hesban, một hồ chứa lớn được đục và trát vữa vào thời Đồ Sắt, và thị trấn cuối thời Đồ Sắt cho ra đồ gốm Am-môn. Vào thời Hy Lạp hóa, một pháo đài có lẽ đứng trên đỉnh. Josephus liệt kê Hết-bôn trong các thành của Mô-áp do người Do Thái nắm giữ vào cuối triều Alexander Jannaeus, nói rằng Hê-rốt cho kỵ binh tuyển chọn định cư ở Hesebonitis thuộc Perea, và ghi rằng năm 66 các toán Do Thái tàn phá Sebonitis cùng các vùng lân cận khác."
    - "Dưới thời La Mã, thành, nay gọi là Esbus, đúc tiền riêng, và một đền cùng các công trình công cộng khác đứng trên đỉnh. Đầu thế kỷ 4, Eusebius mô tả Esbus là một thành nổi tiếng của A-ra-bi trong núi đối diện Giê-ri-cô, cách sông Giô-đanh 20 dặm. Vào thời Byzantine, hai nhà thờ kiểu thánh đường nền khảm được xây trên đồi."
  ro:
    - "Hesbon este identificat cu Tell Hesban din Iordania, un deal înalt la circa 20 km spre sud-vest de Amman și la nord de Madaba, la marginea podișului unde pământul coboară spre valea Iordanului. Expediția Heshbon a Universității Andrews a săpat acolo între 1968 și 1976, condusă întâi de Siegfried Horn și apoi de Lawrence Geraty, iar lucrările au continuat sub Madaba Plains Project. Pe deal nu s-a găsit niciun oraș din Bronzul Târziu, ci doar rămășițe răzlețe din secolele al XII-lea și al XI-lea î.Hr., așa că este disputat dacă Tell Hesban este Hesbonul lui Sihon sau dacă acel oraș se afla în altă parte."
    - "În Numeri, Hesbonul este orașul lui Sihon, regele amoriților, care luase țara Moabului până la Arnon. Israel l-a învins și a locuit în Hesbon; fiii lui Ruben l-au zidit, a marcat hotarul lui Gad și a devenit oraș al leviților. Ieftae le-a amintit mai târziu amoniților că Israel locuise în Hesbon trei sute de ani. La Isaia și Ieremia este un oraș al Moabului, iar Ieremia îi cere Hesbonului să se tânguiască și în profeția sa împotriva Amonului. Cântarea Cântărilor asemuiește ochii iubitei cu iazurile din Hesbon."
    - "Pe Tell Hesban a fost tăiat și tencuit un mare rezervor în Epoca Fierului, iar orașul din Epoca Fierului târzie a dat ceramică amonită. În epoca elenistică, o fortăreață se afla probabil pe vârf. Iosif Flaviu enumeră Hesbonul printre orașele Moabului stăpânite de iudei la sfârșitul domniei lui Alexandru Ianeu, spune că Irod a așezat călăreți aleși în Hesebonitis din Perea și consemnează că în 66 d.Hr. bande iudaice au pustiit Sebonitis împreună cu alte districte învecinate."
    - "Sub Roma, orașul, numit acum Esbus, și-a bătut propria monedă, iar pe vârf se aflau un templu și alte clădiri publice. La începutul secolului al IV-lea, Eusebiu descrie Esbus ca pe un oraș vestit al Arabiei, în munții din fața Ierihonului, la douăzeci de mile de Iordan. În epoca bizantină, pe deal au fost construite două biserici de tip bazilică, cu podele de mozaic."
  bg:
    - "Есевон се отъждествява с Тел Хесбан в Йордания — висок хълм на около 20 км югозападно от Аман и северно от Мадаба, на края на платото, където земята се спуска към Йорданската долина. Експедицията „Хешбон“ на университета „Андрюс“ копа там от 1968 до 1976 г., ръководена първо от Зигфрид Хорн, а после от Лорънс Джерати, и работата продължи в рамките на проекта „Равнините на Мадаба“. На хълма не е открит град от късната бронзова епоха, а само разпръснати останки от XII и XI в. пр.н.е., така че дали Тел Хесбан е Есевон на Сихон или онзи град е стоял другаде, е спорно."
    - "В Числа Есевон е градът на Сихон, царя на аморейците, който беше взел земята на Моав до Арнон. Израил го разби и се засели в Есевон; синовете на Рувим го съградиха, той бележеше границата на Гад и стана град на левитите. По-късно Йефтай напомни на амонците, че Израил е живял в Есевон триста години. При Исаия и Йеремия той е град на Моав, а Йеремия призовава Есевон да ридае и в пророчеството си против Амон. Песен на песните оприличава очите на любимата на водоемите в Есевон."
    - "На Тел Хесбан през желязната епоха беше изсечен и измазан голям водоем, а градът от късната желязна епоха е дал амонска керамика. През елинистическия период на върха вероятно е стояла крепост. Йосиф Флавий изброява Есевон сред градовете на Моав, държани от юдеите в края на царуването на Александър Яней, казва, че Ирод заселил избрани конници в Есевонитида в Перея, и съобщава, че през 66 г. н.е. юдейски отряди опустошили Севонитида заедно с други съседни области."
    - "При Рим градът, наричан вече Есбус, сечеше собствени монети, а на върха стояха храм и други обществени сгради. В началото на IV в. Евсевий описва Есбус като прочут град в Арабия, в планините срещу Йерихон, на двадесет мили от Йордан. През византийския период на хълма бяха построени две базилики с мозаечни подове."
