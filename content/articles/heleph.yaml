# Overview article (ADR 0007). Mainstream facts only; Heleph is known only as the starting point of Naphtali's border; the map's site (Khirbet Irbadeh) is a proposal.
id: heleph
place: a8687ff
title:
  en: "Heleph"
  ru: "Хелеф"
body:
  en:
    - "Heleph is the point from which Joshua traces the southern border of Naphtali: “their coast was from Heleph, from Allon to Zaanannim, and Adami, Nekeb, and Jabneel, unto Lakum; and the outgoings thereof were at Jordan”. From there the line turned west to Aznoth-tabor and Hukkok, touching Zebulun on the south and Asher on the west. Heleph thus marked the south-western end of Naphtali's land, near Mount Tabor, where the tribe met Zebulun and Issachar."
    - "That single border description is all the Bible says, and no other ancient source names the town. Its site is unknown; the map follows the proposal of Khirbet Irbadeh, a ruin at the foot of Mount Tabor, which fits the line of the border but preserves no trace of the name. What the name means is uncertain."
  ru:
    - "Хелеф — точка, от которой книга Иисуса Навина ведёт южную границу Неффалима: «предел их шел от Хелефа и от дубравы, что в Цананниме, к Адами-Некеву и Иавнеилу, до Лаккума, и оканчивался у Иордана». Оттуда черта поворачивала на запад, к Азноф-Фавору и Хуккоку, примыкая к Завулону с юга и к Асиру с запада. Хелеф, таким образом, отмечал юго-западный конец земли Неффалима, близ горы Фавор, где колено сходилось с Завулоном и Иссахаром."
    - "Это единственное описание границы — всё, что говорит Библия, и ни один другой древний источник город не называет. Где он был, неизвестно; карта следует предположению о Хирбет-Ирбаде, развалинах у подножия Фавора, которые подходят к линии границы, но имени не сохранили. Что значит само имя, неясно."
scripture:
  - Josh.19.32-Josh.19.34
sources:
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
  - "Z. Kallai, Historical Geography of the Bible: The Tribal Territories of Israel (1986)"
  - "R. G. Boling and G. E. Wright, Joshua (Anchor Bible, 1982)"
