body:
  en:
    - "Heleph is the point from which Joshua traces the southern border of Naphtali: “their coast was from Heleph, from Allon to Zaanannim, and Adami, Nekeb, and Jabneel, unto Lakum; and the outgoings thereof were at Jordan”. From there the line turned west to Aznoth-tabor and Hukkok, touching Zebulun on the south and Asher on the west. Heleph thus seems to have marked the south-western end of Naphtali's land, probably near Mount Tabor, where the tribe met Zebulun."
    - "That single border description is all the Bible says, and no other ancient source names the town. Its site is unknown; the map follows the proposal of Khirbet Irbadeh, a ruin about 5 km north-east of Mount Tabor, which fits the line of the border but preserves no trace of the name. What the name means is uncertain."
  ru:
    - "Хелеф — точка, от которой книга Иисуса Навина ведёт южную границу Неффалима: «предел их шел от Хелефа и от дубравы, что в Цананниме, к Адами-Некеву и Иавнеилу, до Лаккума, и оканчивался у Иордана». Оттуда черта поворачивала на запад, к Азноф-Фавору и Хуккоку, примыкая к Завулону с юга и к Асиру с запада. Хелеф, таким образом, по-видимому, отмечал юго-западный конец земли Неффалима, вероятно близ горы Фавор, где колено сходилось с Завулоном."
    - "Это единственное описание границы — всё, что говорит Библия, и ни один другой древний источник город не называет. Где он был, неизвестно; карта следует предположению о Хирбет-Ирбаде, развалинах примерно в 5 км к северо-востоку от Фавора, которые подходят к линии границы, но имени не сохранили. Что значит само имя, неясно."
  uk:
    - "Хелеф — точка, від якої Книга Ісуса Навина прокладає південну межу Нефталима: «Гряниця їх ійшла від Хелефа, від дуброви, що при Заннанимі, до Адами-Некеба й Ябнеїла та аж до Лаккума, та кінчилась на Йорданї». Звідти лінія повертала на захід до Азнот-Фавору та Хуккока, дотикаючись Завулона на півдні й Асира на заході. Так Хелеф, здається, позначав південно-західний кінець землі Нефталима, імовірно поблизу гори Фавор, де коліно межувало з Завулоном."
    - "Цей єдиний опис межі — все, що говорить Біблія, і жодне інше давнє джерело не називає міста. Його місце невідоме; карта йде за пропозицією Хірбет-Ірбада, руїни приблизно за 5 км на північний схід від гори Фавор, яка відповідає лінії межі, але не зберігає жодного сліду назви. Що означає назва, не певно."
  es:
    - "Helef es el punto desde el que Josué traza el límite sur de Neftalí: «fué su término desde Heleph, y Allón-saananim, y Adami-neceb, y Jabneel, hasta Lacum; y sale al Jordán». De allí la línea torcía al oeste hacia Aznot-tabor y Hucoc, tocando a Zabulón por el sur y a Aser por el oeste. Helef parece haber marcado así el extremo suroccidental de la tierra de Neftalí, probablemente cerca del monte Tabor, donde la tribu confinaba con Zabulón."
    - "Esa única descripción de frontera es todo lo que dice la Biblia, y ninguna otra fuente antigua nombra la población. Su sitio se ignora; el mapa sigue la propuesta de Khirbet Irbadeh, una ruina a unos 5 km al nordeste del monte Tabor, que encaja con la línea de la frontera pero no conserva rastro del nombre. Qué significa el nombre es incierto."
  pt:
    - "Helefe é o ponto a partir do qual Josué traça a fronteira meridional de Naftali: “A sua fronteira ia desde Helefe, desde o carvalho em Zaananim, Adami-Nequebe e Jabneel, até Lacum. Terminava no Jordão”. Dali a linha virava para oeste até Aznote-Tabor e Hucoque, tocando Zebulom ao sul e Aser a oeste. Helefe parece ter marcado assim o extremo sudoeste da terra de Naftali, provavelmente perto do monte Tabor, onde a tribo encontrava Zebulom."
    - "Essa única descrição de fronteira é tudo o que a Bíblia diz, e nenhuma outra fonte antiga nomeia a cidade. Seu sítio é desconhecido; o mapa segue a proposta de Khirbet Irbadeh, uma ruína a cerca de 5 km a nordeste do monte Tabor, que se ajusta à linha da fronteira mas não conserva vestígio do nome. O que o nome significa é incerto."
  de:
    - "Helef ist der Punkt, von dem aus Josua die Südgrenze Naftalis zieht: „Und ihre Grenze war von Heleph, von den Eichen bei Zaanannim an, Adami-Nebek, Jabneel, bis gen Lakkum und endet am Jordan“. Von dort wandte sich die Linie nach Westen zu Asnot-Tabor und Hukkok und berührte Sebulon im Süden und Asser im Westen. Helef bezeichnete damit offenbar das südwestliche Ende von Naftalis Land, wahrscheinlich nahe dem Tabor, wo der Stamm an Sebulon grenzte."
    - "Diese eine Grenzbeschreibung ist alles, was die Bibel sagt, und keine andere antike Quelle nennt die Stadt. Ihre Lage ist unbekannt; die Karte folgt dem Vorschlag Chirbet Irbadeh, einer Ruine etwa 5 km nordöstlich des Tabor, die zur Grenzlinie passt, aber keine Spur des Namens bewahrt. Was der Name bedeutet, ist ungewiss."
  fr:
    - "Héleph est le point à partir duquel Josué trace la limite sud de Nephthali : « Leur limite s’étendait depuis Héleph, depuis Allon, par Tsaanannim, Adami-Nékeb et Jabneel, jusqu’à Lakkum, et elle aboutissait au Jourdain ». De là, la ligne tournait vers l’ouest à Aznoth-Thabor et à Hukkok, touchant Zabulon au sud et Aser à l’ouest. Héleph semble donc avoir marqué l’extrémité sud-ouest du pays de Nephthali, probablement près du mont Thabor, là où la tribu rencontrait Zabulon."
    - "Cette seule description de frontière est tout ce que dit la Bible, et aucune autre source antique ne nomme la ville. Son site est inconnu ; la carte suit la proposition de Khirbet Irbadeh, une ruine à environ 5 km au nord-est du mont Thabor, qui s’accorde avec le tracé de la frontière mais ne conserve aucune trace du nom. Le sens du nom est incertain."
  pl:
    - "Chelef to punkt, od którego Jozue wyznacza południową granicę Neftalego: „była granica ich od Helef, i od Helon, do Saannanim, i Adami, które jest Necheb, i Jebnael, aż ku Lekum, i kończy się u Jordanu”. Stamtąd linia skręcała na zachód do Aznot-Tabor i Chukkok, stykając się z Zabulonem od południa i Aszerem od zachodu. Chelef wyznaczał więc, jak się zdaje, południowo-zachodni kraniec ziemi Neftalego, prawdopodobnie blisko góry Tabor, gdzie pokolenie stykało się z Zabulonem."
    - "Ten jedyny opis granicy to wszystko, co mówi Biblia, a żadne inne starożytne źródło nie wymienia miasta. Jego położenie jest nieznane; mapa idzie za propozycją Chirbet Irbadeh, ruiny około 5 km na północny wschód od góry Tabor, która pasuje do linii granicy, lecz nie zachowuje śladu nazwy. Co nazwa znaczy, nie jest pewne."
  it:
    - "Cheleph è il punto da cui Giosuè traccia il confine meridionale di Neftali: «Il loro confine si estendeva da Helef, da Elon-Bezaanannim, Adami-Nekeb e Iabneel fino a Lakkun e facea capo al Giordano». Di là la linea girava a occidente verso Aznot-Tabor e Cuccoc, toccando Zabulon a sud e Aser a ovest. Cheleph sembra dunque aver segnato l’estremità sud-occidentale del territorio di Neftali, probabilmente presso il Monte Tabor, dove la tribù incontrava Zabulon."
    - "Questa unica descrizione di confine è tutto ciò che dice la Bibbia, e nessun’altra fonte antica nomina la città. Il suo sito è ignoto; la mappa segue la proposta di Khirbet Irbadeh, una rovina circa 5 km a nord-est del Monte Tabor, che si accorda con la linea del confine ma non conserva traccia del nome. Che cosa significhi il nome è incerto."
  nl:
    - "Chelef is het punt van waaruit Jozua de zuidgrens van Naftali trekt: “hun landpale is van Helef, van Allon tot Zaanannim, en Adami-Nekeb, en Jabneel, tot Lakkum; en haar uitgangen zijn aan de Jordaan”. Vandaar boog de lijn westwaarts af naar Aznot-Tabor en Chukok, rakend aan Zebulon in het zuiden en Aser in het westen. Chelef lijkt dus het zuidwestelijke einde van Naftali’s land te hebben gemarkeerd, waarschijnlijk bij de Tabor, waar de stam grensde aan Zebulon."
    - "Die ene grensbeschrijving is alles wat de Bijbel zegt, en geen andere oude bron noemt de stad. De plaats is onbekend; de kaart volgt het voorstel Khirbet Irbadeh, een ruïne ongeveer 5 km ten noordoosten van de Tabor, die bij de grenslijn past maar geen spoor van de naam bewaart. Wat de naam betekent, is onzeker."
  cs:
    - "Chelef je bod, od něhož Jozue vede jižní hranici Neftalího: „A byla meze jejich od Helef a od Elon do Sananim, a Adami, Nekeb a Jebnael, až do Lekum, a skonává se u Jordánu.“ Odtud se čára stáčela na západ k Aznót-tábor a Chukoku, dotýkajíc se Zebulunu na jihu a Ašera na západě. Chelef tak zřejmě označoval jihozápadní konec Neftalího země, pravděpodobně poblíž hory Tábor, kde se kmen setkával se Zebulunem."
    - "Tento jediný popis hranice je vše, co Bible říká, a žádný jiný starověký pramen město nejmenuje. Jeho poloha je neznámá; mapa následuje návrh Chirbet Irbada, zříceniny asi 5 km severovýchodně od hory Tábor, která odpovídá průběhu hranice, ale nezachovává stopu jména. Co jméno znamená, je nejisté."
  sv:
    - "Helef är punkten från vilken Josua drar Naftalis södra gräns: ”deras gräns gick från Helef, från terebinten i Saanannim till Adami-Hannekeb och Jabneel, ända till Lackum, och gick så ut vid Jordan”. Därifrån vände linjen västerut till Asnot-Tabor och Huckok och rörde Sebulon i söder och Asher i väster. Helef tycks alltså ha markerat sydvästra änden av Naftalis land, sannolikt nära berget Tabor, där stammen mötte Sebulon."
    - "Denna enda gränsbeskrivning är allt Bibeln säger, och ingen annan antik källa nämner staden. Dess läge är okänt; kartan följer förslaget Khirbet Irbadeh, en ruin omkring 5 km nordost om berget Tabor, som passar gränslinjen men inte bevarar något spår av namnet. Vad namnet betyder är osäkert."
scripture:
  - Josh.19.32-Josh.19.34
