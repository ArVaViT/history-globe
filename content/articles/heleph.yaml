# Overview article (ADR 0007). Mainstream facts only; Heleph is known only as the starting point of Naphtali's border; the map's site (Khirbet Irbadeh) is a proposal.
id: heleph
place: a8687ff
title:
  en: "Heleph"
  ru: "Хелеф"
  uk: "Хелеф"
  es: "Helef"
  pt: "Helefe"
  de: "Helef"
  fr: "Héleph"
body:
  en:
    - "Heleph is the point from which Joshua traces the southern border of Naphtali: “their coast was from Heleph, from Allon to Zaanannim, and Adami, Nekeb, and Jabneel, unto Lakum; and the outgoings thereof were at Jordan”. From there the line turned west to Aznoth-tabor and Hukkok, touching Zebulun on the south and Asher on the west. Heleph thus marked the south-western end of Naphtali's land, near Mount Tabor, where the tribe met Zebulun and Issachar."
    - "That single border description is all the Bible says, and no other ancient source names the town. Its site is unknown; the map follows the proposal of Khirbet Irbadeh, a ruin at the foot of Mount Tabor, which fits the line of the border but preserves no trace of the name. What the name means is uncertain."
  ru:
    - "Хелеф — точка, от которой книга Иисуса Навина ведёт южную границу Неффалима: «предел их шел от Хелефа и от дубравы, что в Цананниме, к Адами-Некеву и Иавнеилу, до Лаккума, и оканчивался у Иордана». Оттуда черта поворачивала на запад, к Азноф-Фавору и Хуккоку, примыкая к Завулону с юга и к Асиру с запада. Хелеф, таким образом, отмечал юго-западный конец земли Неффалима, близ горы Фавор, где колено сходилось с Завулоном и Иссахаром."
    - "Это единственное описание границы — всё, что говорит Библия, и ни один другой древний источник город не называет. Где он был, неизвестно; карта следует предположению о Хирбет-Ирбаде, развалинах у подножия Фавора, которые подходят к линии границы, но имени не сохранили. Что значит само имя, неясно."
  uk:
    - "Хелеф — точка, від якої Книга Ісуса Навина прокладає південну межу Нефталима: «Гряниця їх ійшла від Хелефа, від дуброви, що при Заннанимі, до Адами-Некеба й Ябнеїла та аж до Лаккума, та кінчилась на Йорданї». Звідти лінія повертала на захід до Азнот-Фавору та Хуккока, дотикаючись Завулона на півдні й Асира на заході. Так Хелеф позначав південно-західний кінець землі Нефталима, поблизу гори Фавор, де коліно межувало з Завулоном та Іссахаром."
    - "Цей єдиний опис межі — все, що говорить Біблія, і жодне інше давнє джерело не називає міста. Його місце невідоме; карта йде за пропозицією Хірбет-Ірбада, руїни біля підніжжя гори Фавор, яка відповідає лінії межі, але не зберігає жодного сліду назви. Що означає назва, не певно."
  es:
    - "Helef es el punto desde el que Josué traza el límite sur de Neftalí: «fué su término desde Heleph, y Allón-saananim, y Adami-neceb, y Jabneel, hasta Lacum; y sale al Jordán». De allí la línea torcía al oeste hacia Aznot-tabor y Hucoc, tocando a Zabulón por el sur y a Aser por el oeste. Helef marcaba así el extremo suroccidental de la tierra de Neftalí, cerca del monte Tabor, donde la tribu confinaba con Zabulón e Isacar."
    - "Esa única descripción de frontera es todo lo que dice la Biblia, y ninguna otra fuente antigua nombra la población. Su sitio se ignora; el mapa sigue la propuesta de Khirbet Irbadeh, una ruina al pie del monte Tabor, que encaja con la línea de la frontera pero no conserva rastro del nombre. Qué significa el nombre es incierto."
  pt:
    - "Helefe é o ponto a partir do qual Josué traça a fronteira meridional de Naftali: “A sua fronteira ia desde Helefe, desde o carvalho em Zaananim, Adami-Nequebe e Jabneel, até Lacum. Terminava no Jordão”. Dali a linha virava para oeste até Aznote-Tabor e Hucoque, tocando Zebulom ao sul e Aser a oeste. Helefe marcava assim o extremo sudoeste da terra de Naftali, perto do monte Tabor, onde a tribo encontrava Zebulom e Issacar."
    - "Essa única descrição de fronteira é tudo o que a Bíblia diz, e nenhuma outra fonte antiga nomeia a cidade. Seu sítio é desconhecido; o mapa segue a proposta de Khirbet Irbadeh, uma ruína ao pé do monte Tabor, que se ajusta à linha da fronteira mas não conserva vestígio do nome. O que o nome significa é incerto."
  de:
    - "Helef ist der Punkt, von dem aus Josua die Südgrenze Naftalis zieht: „Und ihre Grenze war von Heleph, von den Eichen bei Zaanannim an, Adami-Nebek, Jabneel, bis gen Lakkum und endet am Jordan“. Von dort wandte sich die Linie nach Westen zu Asnot-Tabor und Hukkok und berührte Sebulon im Süden und Asser im Westen. Helef bezeichnete damit das südwestliche Ende von Naftalis Land, nahe dem Tabor, wo der Stamm an Sebulon und Issachar grenzte."
    - "Diese eine Grenzbeschreibung ist alles, was die Bibel sagt, und keine andere antike Quelle nennt die Stadt. Ihre Lage ist unbekannt; die Karte folgt dem Vorschlag Chirbet Irbadeh, einer Ruine am Fuß des Tabor, die zur Grenzlinie passt, aber keine Spur des Namens bewahrt. Was der Name bedeutet, ist ungewiss."
  fr:
    - "Héleph est le point à partir duquel Josué trace la limite sud de Nephthali : « Leur limite s’étendait depuis Héleph, depuis Allon, par Tsaanannim, Adami-Nékeb et Jabneel, jusqu’à Lakkum, et elle aboutissait au Jourdain ». De là, la ligne tournait vers l’ouest à Aznoth-Thabor et à Hukkok, touchant Zabulon au sud et Aser à l’ouest. Héleph marquait donc l’extrémité sud-ouest du pays de Nephthali, près du mont Thabor, là où la tribu rencontrait Zabulon et Issacar."
    - "Cette seule description de frontière est tout ce que dit la Bible, et aucune autre source antique ne nomme la ville. Son site est inconnu ; la carte suit la proposition de Khirbet Irbadeh, une ruine au pied du mont Thabor, qui s’accorde avec le tracé de la frontière mais ne conserve aucune trace du nom. Le sens du nom est incertain."
scripture:
  - Josh.19.32-Josh.19.34
sources:
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
  - "Z. Kallai, Historical Geography of the Bible: The Tribal Territories of Israel (1986)"
  - "R. G. Boling and G. E. Wright, Joshua (Anchor Bible, 1982)"
