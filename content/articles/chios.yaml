body:
  en:
    - "Chios is a large island of the eastern Aegean, separated from the Erythrae peninsula of Asia Minor by a strait only a few miles wide; its chief town, also called Chios, faces the mainland on the east coast. In antiquity it was one of the twelve cities of the Ionian League. The Chians claimed Homer, and Strabo cites as proof the Homeridae, a guild of reciters on the island who traced their line from him. Chian wine was among the most prized in the Greek world, and its amphoras are found across the Mediterranean; the mastic of the southern villages is still the island's best-known product."
    - "On his last voyage to Jerusalem Paul's ship went down the coast from Troas, picked him up at Assos and called at Mitylene; Luke goes on: “And we sailed thence, and came the next day over against Chios; and the next day we arrived at Samos, and tarried at Trogyllium; and the next day we came to Miletus.” The ship apparently anchored off the island for the night without landing. Paul was hurrying to reach Jerusalem by Pentecost, and this is the only mention of Chios in the Bible."
    - "At the battle of Lade in 494 BC Chios sent a hundred ships, the largest Ionian squadron, and fought on after others deserted. As an ally of Athens it kept its own fleet, until it revolted in 412 BC; Thucydides remarks that the Chians were the only people he knew, after the Spartans, who were prosperous and prudent at the same time. In 86 BC Mithridates VI had the Chians put on ships and carried off towards Pontus; after his defeat Sulla declared Chios free. Josephus tells how Herod, on his voyage to join Agrippa in 14 BC, paid for the rebuilding of the city's fallen portico, and later, travelling with Agrippa, paid off what the Chians owed the emperor's procurators. Chios belongs today to Greece."
  ru:
    - "Хиос — большой остров на востоке Эгейского моря, отделённый от Эритрейского полуострова Малой Азии проливом шириной всего в несколько километров; его главный город, тоже Хиос, стоит на восточном берегу против материка. В древности он был одним из двенадцати городов Ионийского союза. Хиосцы считали Гомера своим, и Страбон приводит в доказательство гомеридов — объединение исполнителей на острове, выводивших свой род от него. Хиосское вино было одним из самых ценимых в греческом мире, и его амфоры находят по всему Средиземноморью; мастика южных деревень и сегодня — самый известный продукт острова."
    - "В последнем путешествии в Иерусалим корабль Павла шёл вдоль побережья из Троады, взял его в Ассе и зашёл в Митилину; Лука продолжает: «И, отплыв оттуда, в следующий день мы остановились против Хиоса, а на другой пристали к Самосу и, побывав в Трогиллии, в следующий день прибыли в Милит». Корабль, по-видимому, простоял ночь у острова, не причаливая. Павел спешил быть в Иерусалиме ко дню Пятидесятницы, и это единственное упоминание Хиоса в Библии."
    - "В битве при Ладе в 494 г. до н. э. Хиос выставил сто кораблей, крупнейший ионийский отряд, и продолжал сражаться, когда другие бежали. Как союзник Афин он сохранял собственный флот, пока не отпал в 412 г. до н. э.; Фукидид замечает, что хиосцы — единственный известный ему после спартанцев народ, который был и благополучен, и благоразумен одновременно. В 86 г. до н. э. Митридат VI велел посадить хиосцев на корабли и увезти к Понту; после его поражения Сулла объявил Хиос свободным. Иосиф Флавий рассказывает, как Ирод, плывя к Агриппе в 14 г. до н. э., дал деньги на восстановление обрушившегося портика города, а позже, путешествуя с Агриппой, уплатил долг хиосцев прокураторам императора. Сегодня Хиос принадлежит Греции."
  uk:
    - "Хіос — великий острів східного Егейського моря, відокремлений від півострова Еритри в Малій Азії протокою завширшки лише кілька миль; його головне місто, також Хіос, обернене до материка на східному березі. В античності він був одним із дванадцяти міст Іонійського союзу. Хіосці вважали своїм Гомера, і Страбон наводить як доказ гомерідів, цех рапсодів на острові, що виводили свій рід від нього. Хіоське вино було серед найцінніших у грецькому світі, а його амфори знаходять по всьому Середземномор'ю; мастика південних сіл досі лишається найвідомішим продуктом острова."
    - "Під час останнього плавання до Єрусалима корабель Павла пройшов узбережжям від Троади, взяв його в Ассосі й зайшов у Мітилену; Лука веде далі: «А відпливши звідтіля, причалили ми другого дня проти Хиоса, на другий же день поплили в Самос, та, побувши в Трогилиї, другого дня прийшли в Милет». Корабель, вочевидь, став на якір біля острова на ніч, не пристаючи до берега. Павло поспішав потрапити в Єрусалим до П'ятидесятниці, і це єдина згадка про Хіос у Біблії."
    - "У битві при Ладе 494 р. до н. е. Хіос виставив сто кораблів — найбільшу іонійську ескадру — і бився далі, коли інші відступили. Як союзник Афін він зберігав власний флот, доки 412 р. до н. е. не повстав; Фукідід зауважує, що хіосці — єдиний відомий йому народ, окрім спартанців, який був водночас заможним і розсудливим. 86 р. до н. е. Мітридат VI наказав посадити хіосців на кораблі й вивезти у бік Понту; після його поразки Сулла оголосив Хіос вільним. Йосиф Флавій розповідає, що Ірод, пливучи до Агріппи 14 р. до н. е., оплатив відбудову обваленого портика міста, а згодом, подорожуючи з Агріппою, сплатив те, що хіосці заборгували імператорським прокураторам. Нині Хіос належить Греції."
  es:
    - "Quíos es una gran isla del Egeo oriental, separada de la península de Eritras, en Asia Menor, por un estrecho de solo unas millas de ancho; su ciudad principal, que también se llama Quíos, mira al continente en la costa oriental. En la Antigüedad fue una de las doce ciudades de la Liga Jónica. Los quiotas reivindicaban a Homero, y Estrabón cita como prueba a los homéridas, un gremio de recitadores de la isla que trazaban su linaje desde él. El vino de Quíos figuraba entre los más apreciados del mundo griego, y sus ánforas se hallan por todo el Mediterráneo; la almáciga de las aldeas del sur sigue siendo el producto más conocido de la isla."
    - "En su último viaje a Jerusalén, la nave de Pablo bajó por la costa desde Troas, lo recogió en Asón y tocó Mitilene; Lucas continúa: «Y navegando de allí, al día siguiente llegamos delante de Chîo, y al otro día tomamos puerto en Samo: y habiendo reposado en Trogilio, al día siguiente llegamos á Mileto». Al parecer, la nave ancló frente a la isla durante la noche sin desembarcar. Pablo se apresuraba para llegar a Jerusalén por Pentecostés, y esta es la única mención de Quíos en la Biblia."
    - "En la batalla de Lade, en 494 a. C., Quíos envió cien naves, la mayor escuadra jonia, y siguió combatiendo cuando otros desertaron. Como aliada de Atenas conservó su propia flota, hasta que se sublevó en 412 a. C.; Tucídides observa que los quiotas eran el único pueblo que conocía, después de los espartanos, que fuera a la vez próspero y prudente. En 86 a. C. Mitrídates VI hizo embarcar a los quiotas y se los llevó hacia el Ponto; tras su derrota, Sila declaró libre a Quíos. Josefo cuenta que Herodes, navegando para reunirse con Agripa en 14 a. C., costeó la reconstrucción del pórtico caído de la ciudad, y más tarde, de viaje con Agripa, saldó lo que los quiotas debían a los procuradores del emperador. Quíos pertenece hoy a Grecia."
  pt:
    - "Quios é uma grande ilha do Egeu oriental, separada da península de Eritras, na Ásia Menor, por um estreito de poucas milhas de largura; sua cidade principal, também chamada Quios, fica de frente para o continente, na costa leste. Na Antiguidade foi uma das doze cidades da Liga Jônica. Os quiotas reivindicavam Homero, e Estrabão cita como prova os homéridas, uma corporação de recitadores da ilha que faziam descender dele a sua linhagem. O vinho de Quios estava entre os mais apreciados do mundo grego, e suas ânforas são encontradas por todo o Mediterrâneo; o mástique das aldeias do sul continua sendo o produto mais conhecido da ilha."
    - "Em sua última viagem a Jerusalém, o navio de Paulo desceu a costa a partir de Trôade, recebeu-o a bordo em Assôs e tocou em Mitilene; Lucas prossegue: “Navegando dali, chegamos no dia seguinte diante de Quios. No outro dia, tocamos em Samos e ficamos em Trogílio, e no dia seguinte chegamos a Mileto.” Aparentemente o navio ancorou ao largo da ilha durante a noite, sem desembarcar. Paulo tinha pressa de chegar a Jerusalém para o Pentecostes, e esta é a única menção de Quios na Bíblia."
    - "Na batalha de Lade, em 494 a.C., Quios enviou cem navios, o maior contingente jônico, e continuou lutando depois que outros desertaram. Como aliada de Atenas, manteve a própria frota, até se revoltar em 412 a.C.; Tucídides observa que os quiotas eram o único povo que ele conhecia, depois dos espartanos, que eram ao mesmo tempo prósperos e prudentes. Em 86 a.C. Mitrídates VI mandou embarcar os quiotas em navios e levá-los em direção ao Ponto; depois da derrota dele, Sula declarou Quios livre. Josefo conta como Herodes, navegando para se juntar a Agripa em 14 a.C., pagou a reconstrução do pórtico caído da cidade e, mais tarde, viajando com Agripa, quitou o que os quiotas deviam aos procuradores do imperador. Quios pertence hoje à Grécia."
  de:
    - "Chios ist eine große Insel der östlichen Ägäis, von der Halbinsel Erythrai in Kleinasien durch eine nur wenige Meilen breite Meerenge getrennt; ihre Hauptstadt, ebenfalls Chios genannt, liegt an der Ostküste dem Festland gegenüber. In der Antike war sie eine der zwölf Städte des Ionischen Bundes. Die Chier beanspruchten Homer für sich, und Strabon führt als Beweis die Homeriden an, eine Zunft von Rezitatoren auf der Insel, die sich auf ihn zurückführten. Chiischer Wein gehörte zu den begehrtesten der griechischen Welt, und seine Amphoren finden sich im ganzen Mittelmeerraum; der Mastix der Dörfer im Süden ist noch heute das bekannteste Erzeugnis der Insel."
    - "Auf seiner letzten Reise nach Jerusalem fuhr das Schiff des Paulus die Küste von Troas hinab, nahm ihn in Assos auf und lief Mitylene an; Lukas fährt fort: „Und von da schifften wir und kamen des andern Tages hin gegen Chios; und des folgenden Tages stießen wir an Samos und blieben in Trogyllion; und des nächsten Tages kamen wir gen Milet.“ Das Schiff ankerte offenbar über Nacht vor der Insel, ohne zu landen. Paulus eilte, um bis Pfingsten in Jerusalem zu sein, und dies ist die einzige Erwähnung von Chios in der Bibel."
    - "In der Schlacht bei Lade 494 v. Chr. stellte Chios hundert Schiffe, das größte ionische Geschwader, und kämpfte weiter, nachdem andere desertiert waren. Als Verbündeter Athens behielt es seine eigene Flotte, bis es 412 v. Chr. abfiel; Thukydides bemerkt, die Chier seien nach den Spartanern die einzigen, die er kenne, die zugleich wohlhabend und besonnen gewesen seien. 86 v. Chr. ließ Mithridates VI. die Chier auf Schiffe bringen und Richtung Pontos wegführen; nach seiner Niederlage erklärte Sulla Chios für frei. Josephus erzählt, wie Herodes, als er 14 v. Chr. zu Agrippa segelte, den Wiederaufbau der eingestürzten Säulenhalle der Stadt bezahlte und später, als er mit Agrippa reiste, beglich, was die Chier den Prokuratoren des Kaisers schuldeten. Chios gehört heute zu Griechenland."
  fr:
    - "Chios est une grande île de l’Égée orientale, séparée de la presqu’île d’Érythrées, en Asie Mineure, par un détroit large de quelques milles seulement ; sa ville principale, aussi appelée Chios, fait face au continent sur la côte orientale. Dans l’Antiquité, c’était l’une des douze cités de la ligue ionienne. Les Chiotes revendiquaient Homère, et Strabon cite en preuve les Homérides, une corporation de récitants de l’île qui faisaient remonter leur lignée à lui. Le vin de Chios comptait parmi les plus estimés du monde grec, et ses amphores se retrouvent dans toute la Méditerranée ; le mastic des villages du sud reste le produit le plus connu de l’île."
    - "Lors de son dernier voyage vers Jérusalem, le navire de Paul longea la côte depuis Troas, le prit à bord à Assos et fit escale à Mytilène ; Luc poursuit : le lendemain, ils arrivèrent en face de Chios ; le jour suivant, ils abordèrent à Samos et firent halte à Trogylle ; le lendemain, ils vinrent à Milet. Le navire jeta apparemment l’ancre au large de l’île pour la nuit sans y débarquer. Paul se hâtait pour être à Jérusalem à la Pentecôte, et c’est la seule mention de Chios dans la Bible."
    - "À la bataille de Ladé, en 494 av. J.-C., Chios envoya cent navires, le plus grand contingent ionien, et combattit encore quand d’autres désertèrent. Alliée d’Athènes, elle garda sa propre flotte, jusqu’à sa révolte de 412 av. J.-C. ; Thucydide remarque que les Chiotes étaient les seuls qu’il connût, après les Spartiates, à être à la fois prospères et prudents. En 86 av. J.-C., Mithridate VI fit embarquer les Chiotes et les emmena vers le Pont ; après sa défaite, Sylla déclara Chios libre. Josèphe raconte qu’Hérode, faisant voile pour rejoindre Agrippa en 14 av. J.-C., paya la reconstruction du portique écroulé de la ville, et plus tard, voyageant avec Agrippa, acquitta ce que les Chiotes devaient aux procurateurs de l’empereur. Chios appartient aujourd’hui à la Grèce."
  it:
    - "Chio è una grande isola dell’Egeo orientale, separata dalla penisola di Eritre in Asia Minore da uno stretto largo solo poche miglia; la sua città principale, anch’essa detta Chio, si affaccia sulla terraferma sulla costa orientale. Nell’antichità fu una delle dodici città della Lega ionica. I Chii rivendicavano Omero, e Strabone cita come prova gli Omeridi, una corporazione di recitatori dell’isola che faceva risalire a lui la propria stirpe. Il vino di Chio era tra i più apprezzati del mondo greco, e le sue anfore si trovano in tutto il Mediterraneo; il mastice dei villaggi meridionali è ancora il prodotto più noto dell’isola."
    - "Nell’ultimo viaggio a Gerusalemme la nave di Paolo scese lungo la costa da Troade, lo prese a bordo ad Asso e fece scalo a Mitilene; Luca prosegue: «E di là, navigando, arrivammo il giorno dopo dirimpetto a Chio; e il giorno seguente approdammo a Samo, e il giorno dipoi giungemmo a Mileto». La nave sembra aver gettato l’ancora al largo dell’isola per la notte senza approdare. Paolo aveva fretta di giungere a Gerusalemme per la Pentecoste, ed è questa l’unica menzione di Chio nella Bibbia."
    - "Nella battaglia di Lade, nel 494 a.C., Chio mandò cento navi, la più grande squadra ionica, e continuò a combattere quando altri disertarono. Come alleata di Atene conservò una propria flotta, finché si ribellò nel 412 a.C.; Tucidide osserva che i Chii erano, dopo gli Spartani, il solo popolo da lui conosciuto che fosse insieme prospero e prudente. Nell’86 a.C. Mitridate VI fece imbarcare i Chii e li fece portare verso il Ponto; dopo la sua sconfitta Silla dichiarò Chio libera. Giuseppe Flavio racconta come Erode, navigando per raggiungere Agrippa nel 14 a.C., pagò la ricostruzione del portico crollato della città e più tardi, viaggiando con Agrippa, saldò quanto i Chii dovevano ai procuratori dell’imperatore. Chio appartiene oggi alla Grecia."
  nl:
    - "Chios is een groot eiland in de oostelijke Egeïsche Zee, door een zeestraat van slechts enkele mijlen breed gescheiden van het schiereiland Erythrae in Klein-Azië; de hoofdstad, ook Chios genoemd, ligt aan de oostkust tegenover het vasteland. In de oudheid was het een van de twaalf steden van de Ionische Bond. De Chiërs maakten aanspraak op Homerus, en Strabo noemt als bewijs de Homeriden, een gilde van voordragers op het eiland die hun afstamming van hem herleidden. Chiotische wijn behoorde tot de meest gewaardeerde van de Griekse wereld, en de amforen zijn overal rond de Middellandse Zee gevonden; de mastiek uit de zuidelijke dorpen is nog steeds het bekendste product van het eiland."
    - "Op zijn laatste reis naar Jeruzalem voer Paulus' schip langs de kust van Troas, nam hem bij Assos aan boord en deed Mitylene aan; Lukas gaat verder: “En van daar afgescheept zijnde, kwamen wij den volgenden dag tegen Chios over, en des anderen daags legden wij aan te Samos, en bleven te Trogyllion, en den dag daaraan kwamen wij te Milete.” Het schip lag blijkbaar de nacht voor het eiland voor anker zonder aan land te gaan. Paulus haastte zich om met Pinksteren in Jeruzalem te zijn, en dit is de enige vermelding van Chios in de Bijbel."
    - "In de slag bij Lade in 494 v.Chr. zond Chios honderd schepen, het grootste Ionische eskader, en bleef doorvechten toen anderen deserteerden. Als bondgenoot van Athene hield het zijn eigen vloot, tot het in 412 v.Chr. in opstand kwam; Thucydides merkt op dat de Chiërs, behalve de Spartanen, het enige volk waren dat hij kende dat tegelijk welvarend en verstandig was. In 86 v.Chr. liet Mithridates VI de Chiërs inschepen en naar Pontus wegvoeren; na zijn nederlaag verklaarde Sulla Chios vrij. Josephus vertelt dat Herodes, toen hij in 14 v.Chr. naar Agrippa zeilde, de herbouw van de ingestorte zuilengalerij van de stad betaalde en later, toen hij met Agrippa reisde, de schulden van de Chiërs aan de procurators van de keizer aflegde. Chios behoort tegenwoordig tot Griekenland."
  pl:
    - "Chios to duża wyspa wschodniego Morza Egejskiego, oddzielona od półwyspu Erytrajskiego w Azji Mniejszej cieśniną szeroką zaledwie na kilka mil; jej główne miasto, również zwane Chios, leży naprzeciw lądu na wschodnim wybrzeżu. W starożytności była jednym z dwunastu miast Związku Jońskiego. Chijczycy uważali Homera za swego, a Strabon przytacza jako dowód Homerydów, cech recytatorów na wyspie, wywodzących swój ród od niego. Wino chijskie należało do najbardziej cenionych w świecie greckim, a jego amfory znajdowane są w całym basenie Morza Śródziemnego; mastyks z południowych wsi pozostaje do dziś najbardziej znanym wyrobem wyspy."
    - "W swojej ostatniej podróży do Jerozolimy okręt Pawła płynął wzdłuż wybrzeża z Troady, zabrał go w Assos i zawinął do Mityleny; Łukasz pisze dalej: „A stamtąd odpłynąwszy, drugiego dnia przyszliśmy przeciw Chyju, a trzeciego dnia przypłynęliśmy do Samu, a pomieszkawszy w Trogillu, nazajutrz przyszliśmy do Miletu”. Okręt najwyraźniej zakotwiczył na noc przy wyspie, nie przybijając do brzegu. Paweł spieszył się, by dotrzeć do Jerozolimy na Pięćdziesiątnicę, i jest to jedyna wzmianka o Chios w Biblii."
    - "W bitwie pod Lade w 494 p.n.e. Chios wysłało sto okrętów, największy kontyngent joński, i walczyło dalej, gdy inni uciekli. Jako sojusznik Aten zachowało własną flotę, aż zbuntowało się w 412 p.n.e.; Tukidydes zauważa, że Chijczycy byli jedynym znanym mu ludem, obok Spartan, który był zarazem zamożny i roztropny. W 86 p.n.e. Mitrydates VI kazał załadować Chijczyków na okręty i wywieźć ku Pontowi; po jego klęsce Sulla ogłosił Chios wolnym. Józef Flawiusz opowiada, jak Herod, płynąc do Agryppy w 14 p.n.e., zapłacił za odbudowę zawalonego portyku miasta, a później, podróżując z Agryppą, spłacił to, co Chijczycy byli winni prokuratorom cesarskim. Chios należy dziś do Grecji."
  cs:
    - "Chios je velký ostrov ve východním Egeidu, oddělený od poloostrova Erythrai v Malé Asii průlivem širokým jen několik mil; jeho hlavní město, rovněž zvané Chios, je obráceno k pevnině na východním pobřeží. Ve starověku byl jedním z dvanácti měst Iónského spolku. Chiové si činili nárok na Homéra a Strabón uvádí jako důkaz Homérovce, cech recitátorů na ostrově, kteří od něj odvozovali svůj původ. Chiské víno patřilo k nejcennějším v řeckém světě a jeho amfory se nacházejí po celém Středomoří; mastix z jižních vesnic je dosud nejznámějším výrobkem ostrova."
    - "Na své poslední cestě do Jeruzaléma plula Pavlova loď podél pobřeží z Troady, vzala ho v Assu a zastavila se v Mitylénách; Lukáš pokračuje: „A odtud plavíce se, druhý den byli jsme proti Chium, a třetího dne přistavili jsme bárku k Sámu, a pobyvše v Trogyllí, nazejtří přišli jsme do Milétu.“ Loď zřejmě kotvila u ostrova přes noc, aniž by přistála. Pavel spěchal, aby byl v Jeruzalémě o letnicích, a toto je jediná zmínka o Chiu v Bibli."
    - "V bitvě u Ladé roku 494 př. n. l. vyslal Chios sto lodí, největší iónskou eskadru, a bojoval dál, když ostatní opustili bojiště. Jako spojenec Athén si ponechal vlastní loďstvo, až se roku 412 př. n. l. vzbouřil; Thúkydidés poznamenává, že Chiové byli jediným lidem, jaký zná, po Sparťanech, který byl zároveň zámožný a rozvážný. Roku 86 př. n. l. nechal Mithridatés VI. Chiany naložit na lodě a odvést k Pontu; po jeho porážce prohlásil Sulla Chios za svobodný. Josephus Flavius vypráví, že Herodes, který roku 14 př. n. l. plul za Agrippou, zaplatil obnovu zřícené sloupové haly města a později, když cestoval s Agrippou, splatil, co Chiové dlužili císařovým prokurátorům. Chios dnes patří Řecku."
  sv:
    - "Chios är en stor ö i östra Egeiska havet, skild från Erythraihalvön i Mindre Asien av ett sund som bara är några engelska mil brett; dess huvudstad, som också heter Chios, vetter mot fastlandet på östkusten. I antiken var den en av de tolv städerna i Joniska förbundet. Chioterna gjorde anspråk på Homeros, och Strabon anför som bevis homeriderna, ett gille av uppläsare på ön som härledde sin släkt från honom. Chiosvin var bland de mest skattade i den grekiska världen, och dess amforor finns över hela Medelhavet; mastixen från de södra byarna är fortfarande öns mest kända produkt."
    - "På sin sista resa till Jerusalem for Paulus skepp ned längs kusten från Troas, tog upp honom vid Assos och angjorde Mytilene; Lukas fortsätter: ”Därifrån seglade vi vidare och kommo följande dag mitt för Kios. Dagen därefter lade vi till vid Samos; och sedan vi hade legat över i Trogyllium, kommo vi nästföljande dag till Miletus.” Skeppet ankrade uppenbarligen utanför ön över natten utan att gå i land. Paulus skyndade för att nå Jerusalem till pingst, och detta är det enda omnämnandet av Chios i Bibeln."
    - "Vid slaget vid Lade 494 f.Kr. sände Chios hundra skepp, den största joniska eskadern, och fortsatte kämpa sedan andra hade övergivit striden. Som Atens bundsförvant behöll det sin egen flotta, tills det gjorde uppror 412 f.Kr.; Thukydides anmärker att chioterna var det enda folk han kände, näst efter spartanerna, som var välmående och förståndiga på samma gång. År 86 f.Kr. lät Mithridates VI föra chioterna på skepp och bort mot Pontos; efter hans nederlag förklarade Sulla Chios fritt. Josefus berättar hur Herodes, på sin resa för att möta Agrippa 14 f.Kr., bekostade återuppbyggnaden av stadens nedfallna pelarhall, och senare, när han reste med Agrippa, betalade vad chioterna var skyldiga kejsarens prokuratorer. Chios hör i dag till Grekland."
  nb:
    - "Khios er en stor øy i det østlige Egeerhavet, atskilt fra Erythrai-halvøya i Lilleasia av et sund bare noen få engelske mil bredt; hovedbyen, som også heter Khios, vender mot fastlandet på østkysten. I oldtiden var den en av de tolv byene i Den joniske liga. Khierne gjorde krav på Homer, og Strabon anfører som bevis homeridene, et laug av resitatorer på øya som førte sin slekt tilbake til ham. Khios-vin var blant de mest skattede i den greske verden, og dens amforaer finnes over hele Middelhavet; mastiksen fra de sørlige landsbyene er fremdeles øyas mest kjente produkt."
    - "På sin siste reise til Jerusalem gikk Paulus' skip nedover kysten fra Troas, tok ham ombord i Assos og anløp Mytilene; Lukas fortsetter: «Og derfra seilte vi videre og kom den næste dag bent ut for Kios; annen dag gikk vi innom Samos og lå over i Trogillium, og kom dagen efter til Milet.» Skipet ankret tilsynelatende opp utenfor øya for natten uten å gå i land. Paulus hastet for å nå Jerusalem til pinse, og dette er den eneste omtalen av Khios i Bibelen."
    - "I slaget ved Lade i 494 f.Kr. sendte Khios hundre skip, den største joniske flåteavdelingen, og kjempet videre etter at andre hadde forlatt kampen. Som Atens allierte beholdt den sin egen flåte, til den gjorde opprør i 412 f.Kr.; Tukydid bemerker at khierne var det eneste folket han kjente, etter spartanerne, som var velstående og kloke på samme tid. I 86 f.Kr. lot Mithridates VI khierne sette på skip og føre bort mot Pontos; etter hans nederlag erklærte Sulla Khios for fri. Josefus forteller hvordan Herodes, på reisen for å slutte seg til Agrippa i 14 f.Kr., betalte for gjenoppbyggingen av byens sammenstyrtede søylegang, og senere, på reise med Agrippa, betalte det khierne skyldte keiserens prokuratorer. Khios hører i dag til Hellas."
