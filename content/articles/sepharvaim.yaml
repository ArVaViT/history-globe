body:
  en:
    - "Sepharvaim is one of the places from which “the king of Assyria” brought settlers into Samaria after the fall of the northern kingdom in 722 BC, together with Babylon, Cuthah, Ava and Hamath; the newcomers kept their own gods, and “the Sepharvites burnt their children in fire to Adrammelech and Anammelech, the gods of Sepharvaim”. Some twenty years later Sennacherib's envoy taunted Jerusalem with the fate of the cities Assyria had already crushed: “Where are the gods of Hamath, and of Arpad? where are the gods of Sepharvaim, Hena, and Ivah?”, and Sennacherib's letter to Hezekiah repeats the list with “the king of the city of Sepharvaim”. Sargon II's inscriptions confirm that he settled conquered peoples in Samaria, among them Arab tribes in 716/715 BC."
    - "Where the city was is disputed. One view takes it for Sippar, the sun-god's city on the Euphrates north of Babylon, which was a twin city, Sippar of Shamash and Sippar of Anunitum, fitting the dual ending of the Hebrew name, and which is named beside Babylon and Cuthah; against this, Sippar had no king of its own in Assyrian times, its gods were not Adrammelech and Anammelech, and the envoy's list is otherwise of Syrian cities. The other view, followed on the map, equates it with Sibraim of Ezekiel, “between the border of Damascus and the border of Hamath”, and with the Shabarain whose capture the Babylonian Chronicle records under Shalmaneser V, though most scholars now read that name as Samaria (Shamara'in). A third candidate is Saparre in Babylonia. The names of its two gods, formed with melech, “king”, like Molech, suit the child sacrifice the text describes but do not fix the place."
    - "If Sepharvaim is Sippar, its ruins are Tell Abu Habbah south-west of Baghdad, where Hormuzd Rassam dug in 1881 and Iraqi excavators found a temple library in 1986; if it is Sibraim, it lies somewhere in the Syrian country between Homs and Damascus and has never been found."
  ru:
    - "Сепарваим — одно из мест, откуда «царь Ассирийский» перевёл поселенцев в Самарию после падения северного царства в 722 г. до н. э., вместе с Вавилоном, Кутой, Аввой и Емафом; пришельцы сохранили своих богов, и «Сепарваимцы сожигали сыновей своих в огне Адрамелеху и Анамелеху, богам Сепарваимским». Около двадцати лет спустя посланец Сеннахирима дразнил Иерусалим судьбой городов, уже раздавленных Ассирией: «Где боги Емафа и Арпада? Где боги Сепарваима, Ены и Иввы?», а письмо Сеннахирима Езекии повторяет список: «Где царь Емафа, и царь Арпада, и царь города Сепарваима»? Надписи Саргона II подтверждают, что он селил покорённые народы в Самарии, среди них арабские племена в 716/715 г. до н. э."
    - "Где был этот город — спорно. Одни принимают его за Сиппар, город бога солнца на Евфрате к северу от Вавилона: это был двойной город, Сиппар Шамаша и Сиппар Ануниту, что подходит к двойственному окончанию еврейского имени, и он назван рядом с Вавилоном и Кутой; против этого — то, что у Сиппара в ассирийское время не было своего царя, его боги не Адрамелех и Анамелех, а список посланца в остальном состоит из сирийских городов. Другой взгляд, которому следует карта, равняет его с Сивраимом у Иезекииля, «между Дамасскою и Емафскою областями», и с Шабараином, взятие которого Вавилонская хроника записывает при Салманасаре V, хотя большинство учёных теперь читает это имя как Самария (Шамараин). Третий кандидат — Сапарре в Вавилонии. Имена двух его богов, образованные с мелех, «царь», как и Молох, подходят к детским жертвам, о которых говорит текст, но места не определяют."
    - "Если Сепарваим — это Сиппар, его развалины — Телль-Абу-Хабба к юго-западу от Багдада, где Ормузд Рассам копал в 1881 году, а иракские археологи нашли храмовую библиотеку в 1986-м; если это Сивраим, он лежит где-то в сирийской земле между Хомсом и Дамаском и никогда не был найден."
  uk:
    - "Сефарваїм — одне з місць, з яких «царь Ассирийський» переселив людей у Самарію по падінні Північного царства 722 р. до н. е., разом із Вавилоном, Кутою, Авою та Хаматом; прибульці зберегли своїх богів, і «Сефарваїмцї палили дїтей своїх ув огнї Адрамелехові та Анамелехові, богам Сефарваїмським». Років через двадцять посланець Сінаххеріба глузував з Єрусалима, нагадуючи долю міст, уже розтрощених Ассирією: «Де боги Ематові й Арпадові? де боги Сефарваїмові, Енині й Івині?», а лист Сінаххеріба до Єзекії повторює перелік, згадуючи царя міста Сефарваїму. Написи Саргона II підтверджують, що він оселяв підкорені народи в Самарії, серед них арабські племена у 716/715 р. до н. е."
    - "Де було місто, є спірним. Одна думка ототожнює його із Сіппаром, містом бога сонця на Євфраті на північ від Вавилона, що було містом-близнюком, Сіппар Шамаша і Сіппар Анунітум, відповідно до двоїни в закінченні івритської назви, і яке згадується поряд із Вавилоном і Кутою; проти цього: Сіппар не мав власного царя в ассирійські часи, його боги не були Адрамелехом і Анамелехом, а в переліку посланця решта міст сирійські. Інша думка, якої дотримується карта, ототожнює його із Сібраїмом Єзекіїля, що «між Дамаським і Ематським займищами», і з Шабараїном, захоплення якого записує Вавилонська хроніка за Салманасара V, хоча більшість учених нині читають це ім'я як Самарія (Шамараїн). Третій кандидат — Сапарре у Вавилонії. Імена двох його богів, утворені від мелех, «цар», як і Молох, пасують до принесення дітей у жертву, яке описує текст, але не визначають місця."
    - "Якщо Сефарваїм — це Сіппар, його руїни — Телль-Абу-Хабба на південний захід від Багдада, де Гормузд Рассам копав у 1881 р., а іракські розкопувачі знайшли в 1986 р. храмову бібліотеку; якщо це Сібраїм, він лежить десь у сирійському краю між Хомсом і Дамаском і ніколи не був знайдений."
  es:
    - "Sefarvaim es uno de los lugares de los que «el rey de Asiria» trajo colonos a Samaria tras la caída del reino del norte en 722 a. C., junto con Babilonia, Cuta, Ava y Hamat; los recién llegados conservaron sus propios dioses, y «los de Sepharvaim quemaban sus hijos al fuego á Adra-melech y á Anamelech, dioses de Sepharvaim». Unos veinte años después el enviado de Senaquerib se burló de Jerusalén con la suerte de las ciudades que Asiria ya había aplastado: «¿Dónde está el dios de Hamath, y de Arphad? ¿dónde el dios de Sepharvaim, de Hena, y de Hiva?», y la carta de Senaquerib a Ezequías repite la lista con «el rey de la ciudad de Sepharvaim». Las inscripciones de Sargón II confirman que asentó pueblos conquistados en Samaria, entre ellos tribus árabes en 716/715 a. C."
    - "Dónde estaba la ciudad se discute. Una opinión la toma por Sippar, ciudad del dios sol en el Éufrates al norte de Babilonia, que era gemela, Sippar de Samas y Sippar de Anunitum, lo que encaja con la terminación dual hebrea, y se nombra junto a Babilonia y Cuta; en contra, Sippar no tenía rey propio en tiempos asirios, sus dioses no eran Adramelec y Anamelec, y el resto de la lista es de ciudades sirias. La otra, seguida en el mapa, la equipara con la Sibraim de Ezequiel, «que está entre el término de Damasco y el término de Hamath», y con la Shabarain cuya captura registra la Crónica babilónica bajo Salmanasar V, aunque la mayoría de los estudiosos lee hoy Samaria (Shamara'in). Un tercer candidato es Saparre en Babilonia. Los nombres de sus dos dioses, con melec, «rey», como Moloc, concuerdan con el sacrificio de niños del texto, pero no fijan el lugar."
    - "Si Sefarvaim es Sippar, sus ruinas son Tell Abu Habbah, al suroeste de Bagdad, donde excavó Hormuzd Rassam en 1881 y excavadores iraquíes hallaron una biblioteca de templo en 1986; si es Sibraim, se encuentra en algún lugar del país sirio entre Homs y Damasco y nunca ha sido hallada."
  pt:
    - "Sefarvaim é um dos lugares de onde “o rei da Assíria” trouxe colonos para Samaria depois da queda do reino do norte em 722 a.C., com Babilônia, Cuta, Ava e Hamate; os recém-chegados conservaram seus deuses, e “os sefarvitas queimavam seus filhos no fogo a Adrameleque e a Anameleque, os deuses de Sefarvaim”. Cerca de vinte anos depois, o enviado de Senaqueribe zombou de Jerusalém com o destino das cidades que a Assíria já esmagara: “Onde estão os deuses de Hamate e de Arpade? Onde estão os deuses de Sefarvaim, de Hena e de Iva?”, e a carta de Senaqueribe a Ezequias repete a lista com “o rei da cidade de Sefarvaim”. As inscrições de Sargão II confirmam que ele instalou povos conquistados em Samaria, entre eles tribos árabes em 716/715 a.C."
    - "Onde ficava é disputado. Uma visão a toma por Sippar, a cidade do deus-sol no Eufrates, ao norte da Babilônia, cidade gêmea (Sippar de Shamash e Sippar de Anunitum), como pede a terminação dual do nome hebraico, citada com Babilônia e Cuta; mas Sippar não tinha rei próprio em tempos assírios, seus deuses não eram Adrameleque e Anameleque, e a lista do enviado é, de resto, de cidades sírias. A outra visão, seguida no mapa, a equipara a Sibraim de Ezequiel, “que está entre a fronteira de Damasco e a fronteira de Hamate”, e a Sabarain, cuja captura a Crônica Babilônica registra sob Salmaneser V, embora a maioria dos estudiosos leia hoje esse nome como Samaria (Shamara'in). Um terceiro candidato é Saparre, na Babilônia. Os nomes de seus dois deuses, formados com melech, “rei”, como Moloque, combinam com o sacrifício de crianças descrito, mas não fixam o lugar."
    - "Se Sefarvaim é Sippar, suas ruínas são Tell Abu Habbah, a sudoeste de Bagdá, onde Hormuzd Rassam escavou em 1881 e escavadores iraquianos acharam uma biblioteca de templo em 1986; se é Sibraim, fica em algum ponto do país sírio entre Homs e Damasco e nunca foi encontrada."
  de:
    - "Sefarwajim ist einer der Orte, aus denen „der König von Assyrien“ nach dem Fall des Nordreichs 722 v. Chr. Siedler nach Samaria brachte, zusammen mit Babylon, Kuta, Awa und Hamat; die Neuankömmlinge behielten ihre eigenen Götter, und „die von Sepharvaim verbrannten ihre Söhne dem Adrammelech und Anammelech, den Göttern derer von Sepharvaim“. Etwa zwanzig Jahre später verspottete Sanheribs Gesandter Jerusalem mit dem Schicksal der von Assyrien zerschmetterten Städte: „Wo sind die Götter zu Hamath und Arpad? Wo sind die Götter zu Sepharvaim, Hena und Iwwa?“, und Sanheribs Brief an Hiskia wiederholt die Liste mit „der König der Stadt Sepharvaim“. Sargons II. Inschriften bestätigen, dass er Besiegte in Samaria ansiedelte, darunter arabische Stämme 716/715 v. Chr."
    - "Ihre Lage ist umstritten. Eine Ansicht hält sie für Sippar am Euphrat nördlich von Babylon, die Stadt des Sonnengottes und Doppelstadt, Sippar des Schamasch und der Anunitum, passend zur Dualendung des Namens, und neben Babylon und Kuta genannt; dagegen hatte Sippar in assyrischer Zeit keinen König, seine Götter waren nicht Adrammelech und Anammelech, und die Liste des Gesandten nennt sonst syrische Städte. Die andere Ansicht, der die Karte folgt, setzt es mit Hesekiels Sibraim gleich, „das an Damaskus und Hamath grenzt“, und mit dem Schabarain, dessen Einnahme die Babylonische Chronik unter Salmanassar V. verzeichnet, was die meisten heute als Samaria (Schamara'in) lesen. Dritter Kandidat ist Saparre in Babylonien. Die Namen seiner beiden Götter, mit melech, „König“, gebildet wie Moloch, passen zu dem beschriebenen Kinderopfer, legen aber den Ort nicht fest."
    - "Ist Sefarwajim Sippar, so sind seine Ruinen Tell Abu Habba südwestlich von Bagdad, wo Hormuzd Rassam 1881 grub und irakische Ausgräber 1986 eine Tempelbibliothek fanden; ist es Sibraim, so liegt es irgendwo im syrischen Land zwischen Homs und Damaskus und wurde nie gefunden."
  fr:
    - "Sepharvaïm est l’un des lieux d’où « le roi d’Assyrie » fit venir des colons en Samarie après la chute du royaume du nord en 722 av. J.-C., avec Babylone, Cutha, Avva et Hamath ; les nouveaux venus gardèrent leurs dieux, et « ceux de Sepharvaïm brûlaient leurs enfants par le feu en l’honneur d’Adrammélec et d’Anammélec, dieux de Sepharvaïm ». Une vingtaine d’années plus tard, l’envoyé de Sanchérib railla Jérusalem avec le sort des villes que l’Assyrie avait déjà écrasées : « Où sont les dieux de Hamath et d’Arpad ? Où sont les dieux de Sepharvaïm, d’Héna et d’Ivva ? », et la lettre de Sanchérib à Ézéchias reprend la liste avec « le roi de la ville de Sepharvaïm ». Les inscriptions de Sargon II confirment qu’il installa des peuples conquis en Samarie, dont des tribus arabes en 716/715 av. J.-C."
    - "L’emplacement est disputé. Une thèse y voit Sippar, ville du dieu-soleil sur l’Euphrate au nord de Babylone, ville double (Sippar de Shamash et d’Anunitum), d’où la terminaison duelle du nom hébreu, et nommée près de Babylone et de Cutha ; mais Sippar n’avait pas de roi propre à l’époque assyrienne, ses dieux n’étaient pas Adrammélec et Anammélec, et la liste de l’envoyé est faite de villes syriennes. L’autre thèse, suivie sur la carte, l’identifie à Sibraïm d’Ézéchiel, « entre la frontière de Damas et la frontière de Hamath », et au Shabarain dont la Chronique babylonienne consigne la prise sous Salmanasar V, bien que la plupart des spécialistes lisent aujourd’hui Samarie (Shamara’in). Un troisième candidat est Saparré en Babylonie. Les noms de ses deux dieux, formés avec melech, « roi », comme Moloc, conviennent au sacrifice d’enfants du texte sans fixer le lieu."
    - "Si Sepharvaïm est Sippar, ses ruines sont Tell Abu Habbah, au sud-ouest de Bagdad, où Hormuzd Rassam fouilla en 1881 et où des fouilleurs irakiens trouvèrent une bibliothèque de temple en 1986 ; si c’est Sibraïm, elle se trouve quelque part dans la campagne syrienne entre Homs et Damas et n’a jamais été trouvée."
  it:
    - "Sefarvaim è uno dei luoghi da cui «il re d’Assiria» portò coloni in Samaria dopo la caduta del regno settentrionale nel 722 a.C., insieme a Babilonia, Cutha, Avva e Camat; i nuovi arrivati conservarono i propri dèi, e «quelli di Sefarvaim bruciavano i loro figliuoli in onore di Adrammelec e di Anammelec, dèi di Sefarvaim». Una ventina d’anni dopo l’inviato di Sennacherib schernì Gerusalemme con la sorte delle città che l’Assiria aveva già schiacciato: «Dove sono gli dèi di Hamath e d’Arpad? Dove sono gli dèi di Sefarvaim, di Hena e d’Ivva?», e la lettera di Sennacherib a Ezechia ripete l’elenco con «il re della città di Sefarvaim». Le iscrizioni di Sargon II confermano che insediò popoli conquistati in Samaria, tra cui tribù arabe nel 716/715 a.C."
    - "Dove fosse la città è controverso. Una tesi la identifica con Sippar, la città del dio sole sull’Eufrate a nord di Babilonia, città gemella (Sippar di Shamash e Sippar di Annunitum) in accordo con la desinenza duale del nome ebraico, nominata accanto a Babilonia e a Cutha; contro questo, Sippar non aveva un re proprio in epoca assira, i suoi dèi non erano Adrammelech e Anammelech, e l’elenco dell’inviato è altrimenti di città siriane. L’altra tesi, seguita sulla mappa, la equipara alla Sibraim di Ezechiele, «tra la frontiera di Damasco, e la frontiera di Hamath», e alla Shabarain della Cronaca babilonese sotto Salmanàssar V, benché i più ora leggano quel nome come Samaria (Shamara’in). Un terzo è Saparre in Babilonia. I nomi dei suoi due dèi, formati con melech, «re», come Moloc, si adattano al sacrificio di bambini descritto dal testo ma non fissano il luogo."
    - "Se Sefarvaim è Sippar, le sue rovine sono Tell Abu Habbah a sud-ovest di Baghdad, dove Hormuzd Rassam scavò nel 1881 e scavatori iracheni trovarono una biblioteca di tempio nel 1986; se è Sibraim, si trova da qualche parte nel paese siriano tra Homs e Damasco e non è mai stata trovata."
  pl:
    - "Sefarwaim to jedno z miejsc, z których „król Assyryjski” sprowadził osadników do Samarii po upadku królestwa północnego w 722 roku p.n.e., razem z Babilonem, Kutą, Awą i Chamat; przybysze zachowali własnych bogów, a „Sefarwaiczycy palili syny swe w ogniu Adramelechowi, i Anamelechowi, bogom Sefarwaimskim”. Jakieś dwadzieścia lat później poseł Sennacheryba szydził z Jerozolimy losem miast, które Asyria już zmiażdżyła: „Gdzież jest bóg Emat i Arfad? gdzież jest bóg Sefarwaim, Ana i Awa?”, a pismo Sennacheryba do Ezechiasza powtarza listę z „król miasta Sefarwaim”. Napisy Sargona II potwierdzają, że osiedlał podbite ludy w Samarii, wśród nich plemiona arabskie w 716/715 roku p.n.e."
    - "Gdzie leżało miasto, jest sporne. Jedni widzą w nim Sippar, miasto boga słońca nad Eufratem na północ od Babilonu, podwójne, Sippar Szamasza i Sippar Anunitum, co pasuje do podwójnej końcówki hebrajskiej nazwy, wymieniane obok Babilonu i Kuta; przeciw temu: Sippar nie miał w czasach asyryjskich własnego króla, jego bogami nie byli Adrammelek i Anammelek, a lista posła obejmuje poza tym miasta syryjskie. Drugi pogląd, za którym idzie mapa, utożsamia je z Sibrajim Ezechiela, „które są między granicą Damaszku i między granicą Emat”, i z Szabarain, którego zdobycie odnotowuje Kronika babilońska za Salmanasara V, choć większość uczonych czyta dziś tę nazwę jako Samaria (Szamarain). Trzeci kandydat to Saparre w Babilonii. Imiona obu bogów, z melek, „król”, jak Molech, pasują do ofiar z dzieci, lecz miejsca nie ustalają."
    - "Jeśli Sefarwaim to Sippar, jego ruiny to Tell Abu Habba na południowy zachód od Bagdadu, gdzie Hormuzd Rassam kopał w 1881 roku, a irackie wykopaliska znalazły w 1986 roku bibliotekę świątynną; jeśli to Sibrajim, leży gdzieś w kraju syryjskim między Hims a Damaszkiem i nigdy nie zostało odnalezione."
  cs:
    - "Sefarvajim je jedno z míst, odkud „král Assyrský“ přivedl osadníky do Samaří po pádu severního království roku 722 př. n. l., spolu s Babylónem, Kutou, Avou a Chamatem; příchozí si ponechali své bohy a „Sefarvaimští pálili syny své ohněm Adramelechovi a Anamelechovi, bohům Sefarvaimským“. Asi o dvacet let později posel Senacheribův posmíval Jeruzalému osudem měst, která Asýrie již rozdrtila: „Kdež jsou bohové Emat a Arfad? Kde jsou bohové Sefarvaim, Ana a Ava?“, a Senacheribův dopis Chizkijášovi seznam opakuje s „král města Sefarvaim“. Nápisy Sargona II. potvrzují, že usazoval dobyté národy v Samaří, mezi nimi arabské kmeny roku 716/715 př. n. l."
    - "Kde město leželo, je sporné. Jeden názor je pokládá za Sippar, město boha slunce na Eufratu severně od Babylóna, které bylo dvojměstím, Sippar Šamašův a Sippar Anunitin, což odpovídá dvojnému zakončení hebrejského jména, a které je jmenováno vedle Babylóna a Kuty; proti tomu Sippar neměl za asyrské doby vlastního krále, jeho bohy nebyli Adrammelek a Anamelek a seznam posla jinak obsahuje syrská města. Druhý názor, který následuje mapa, je ztotožňuje se Sibrajim Ezechielovým, „mezi pomezím Damašským, a mezi pomezím Emat“, a se Šabarajin, jehož dobytí zaznamenává babylónská kronika za Salmanasara V., ač většina učenců dnes čte toto jméno jako Samaří (Šamarain). Třetím kandidátem je Saparre v Babylonii. Jména jeho dvou bohů, utvořená z melek, „král“, jako Molek, odpovídají dětské oběti, kterou text popisuje, ale místo neurčují."
    - "Je-li Sefarvajim Sippar, jsou jeho zříceniny Tell Abú Habba jihozápadně od Bagdádu, kde kopal Hormuzd Rassam roku 1881 a irácké vykopávky nalezly roku 1986 chrámovou knihovnu; je-li to Sibrajim, leží někde v syrské krajině mezi Homsem a Damaškem a nebylo nikdy nalezeno."
  nl:
    - "Sefarvaïm is een van de plaatsen waaruit de koning van Assyrië na de val van het noordelijke koninkrijk in 722 v.Chr. kolonisten naar Samaria bracht, samen met Babel, Chuta, Avva en Hamat; de nieuwkomers hielden hun eigen goden, en “de Sefarvieten verbrandden hun zonen voor Adramelech en Anamelech, de goden van Sefarvaim, met vuur”. Een twintigtal jaren later beschimpte Sanheribs gezant Jeruzalem met het lot van de steden die Assyrië al had vermorzeld: “Waar zijn de goden van Hamath, en van Arpad? Waar zijn de goden van Sefarvaim, Hena en Ivva?”, en Sanheribs brief aan Chizkia herhaalt de lijst met “de koning der stad Sefarvaim”. Sargons II opschriften bevestigen dat hij overwonnen volken in Samaria vestigde, onder wie Arabische stammen in 716/715 v.Chr."
    - "Waar de stad lag, is omstreden. Eén opvatting houdt haar voor Sippar, de stad van de zonnegod aan de Eufraat ten noorden van Babylon, een tweelingstad (Sippar van Sjamasj en Anunitum), passend bij de dubbele uitgang en genoemd naast Babylon en Chuta; daartegen pleit dat Sippar in Assyrische tijd geen eigen koning had, dat zijn goden niet Adramelech en Anamelech waren en dat de lijst verder Syrische steden telt. De andere opvatting, op de kaart gevolgd, vereenzelvigt haar met Sibraim van Ezechiël, “dat tussen de landpale van Damaskus en tussen de landpale van Hamath is”, en met Shabarain uit de Babylonische Kroniek onder Salmaneser V, al lezen de meesten die naam nu als Samaria (Shamara’in). Saparre in Babylonië is een derde kandidaat. De namen van haar goden, met melech, “koning”, zoals Molech, passen bij het kinderoffer maar leggen de plaats niet vast."
    - "Als Sefarvaïm Sippar is, zijn haar ruïnes Tell Abu Habbah ten zuidwesten van Bagdad, waar Hormuzd Rassam in 1881 groef en Iraakse opgravers in 1986 een tempelbibliotheek vonden; als het Sibraim is, ligt het ergens in het Syrische land tussen Homs en Damascus en is het nooit gevonden."
  sv:
    - "Sefarvajim är en av de platser från vilka ”konungen i Assyrien” förde nybyggare till Samaria efter nordrikets fall 722 f.Kr., tillsammans med Babylon, Kuta, Ava och Hamat; de nyanlända behöll sina egna gudar, och ”sefarviterna brände upp sina barn i eld åt Adrammelek och Anammelek, Sefarvaims gudar”. Omkring tjugo år senare hånade Sanheribs sändebud Jerusalem med ödet för de städer Assyrien redan krossat: ”Var äro Hamats och Arpads gudar? Var äro Sefarvaims, Henas och Ivas gudar?”, och Sanheribs brev till Hiskia upprepar förteckningen med ”konungen över Sefarvaims stad”. Sargon II:s inskrifter bekräftar att han bosatte erövrade folk i Samaria, bland dem arabiska stammar 716/715 f.Kr."
    - "Var staden låg är omstritt. En uppfattning tar den för Sippar, solgudens stad vid Eufrat norr om Babylon, en tvillingstad, Sippar av Shamash och Sippar av Anunitum, vilket passar det hebreiska namnets dualändelse, och som nämns bredvid Babylon och Kuta; mot detta talar att Sippar saknade egen kung under assyrisk tid, att dess gudar inte var Adrammelek och Anammelek och att sändebudets förteckning annars upptar syriska städer. Den andra uppfattningen, som kartan följer, likställer det med Hesekiels Sivrajim, ”som ligger mellan Damaskus' och Hamat områden”, och med Shabarain, vars intagande Babyloniska krönikan nämner under Salmanassar V, fastän de flesta forskare nu läser det namnet som Samaria (Shamara'in). En tredje kandidat är Saparre i Babylonien. Namnen på dess två gudar, bildade med melek, ”kung”, liksom Molok, passar barnoffret men fastställer inte platsen."
    - "Om Sefarvajim är Sippar är dess ruiner Tell Abu Habbah sydväst om Bagdad, där Hormuzd Rassam grävde 1881 och irakiska utgrävare fann ett tempelbibliotek 1986; om det är Sivrajim ligger det någonstans i det syriska landet mellan Homs och Damaskus och har aldrig hittats."
  nb:
    - "Sefarvajim er et av stedene hvor «kongen i Assyria» hentet nybyggere til Samaria etter nordrikets fall i 722 f.Kr., sammen med Babylon, Kuta, Ava og Hamat; nykommerne beholdt sine egne guder, og «sefarvittene brente sine sønner i ilden for Adrammelek og Anammelek, Sefarva'ims guder». Omkring tjue år senere hånte Sankeribs utsending Jerusalem med skjebnen til byene Assyria allerede hadde knust: «Hvor er Hamats og Arpads guder? Hvor er Sefarva'ims, Henas og Ivvas guder?», og Sankeribs brev til Hiskia gjentar listen med «byen Sefarva'ims konge». Sargon II's inskripsjoner bekrefter at han bosatte erobrede folk i Samaria, blant dem arabiske stammer i 716/715 f.Kr."
    - "Hvor byen lå, er omstridt. Ett syn tar den for Sippar, solgudens by ved Eufrat nord for Babylon, en tvillingby, Sippar for Sjamasj og Sippar for Anunitum, noe som passer med dualendelsen i det hebraiske navnet, og som er nevnt ved siden av Babylon og Kuta; mot dette taler at Sippar ikke hadde egen konge i assyrisk tid, at dens guder ikke var Adrammelek og Anammelek, og at utsendingens liste ellers er syriske byer. Det andre, som kartet følger, setter den lik Esekiels Sibrajim, «mellem Damaskus' landemerke og Hamats landemerke», og Sjabarain hvis erobring den babylonske kronikken forteller om under Salmanassar V, selv om de fleste forskere nå leser dette navnet som Samaria (Sjamara'in). En tredje kandidat er Saparre i Babylonia. Navnene på dens to guder, dannet med melek, «konge», som Molok, passer til barneofringen teksten beskriver, men fastlegger ikke stedet."
    - "Hvis Sefarvajim er Sippar, er ruinene Tell Abu Habbah sørvest for Bagdad, der Hormuzd Rassam gravde i 1881 og irakiske utgravere fant et tempelbibliotek i 1986; hvis det er Sibrajim, ligger det et sted i det syriske landet mellom Homs og Damaskus og er aldri funnet."
  tl:
    - "Ang Sepharvaim ay isa sa mga lugar kung saan “ang hari sa Asiria” ay nagdala ng mga naninirahan sa Samaria pagkatapos bumagsak ang hilagang kaharian noong 722 BK, kasama ang Babilonia, Cutha, Ava at Hamath; pinanatili ng mga dumating ang sarili nilang mga diyos, at “sinunog ng mga Sepharvita ang kanilang mga anak sa apoy sa Adrammelech at sa Anammelech, na mga dios ng Sefarvaim”. Mga dalawampung taon makalipas, nilibak ng sugo ni Sennacherib ang Jerusalem sa sinapit ng mga lungsod na dinurog na ng Asiria: “Saan nandoon ang mga dios ng Hamath, at ng Arphad? Saan nandoon ang mga dios ng Sepharvaim, ng Hena, at ng Hiva?”, at inuulit ng liham ni Sennacherib kay Ezechias ang listahan kasama ang “hari sa bayan ng Sepharvaim”. Pinatutunayan ng mga inskripsiyon ni Sargon II na nagpatira siya ng mga nasakop na bayan sa Samaria, kabilang ang mga tribong Arabe noong 716/715 BK."
    - "Pinagtatalunan ang lugar. Sippar ito sa isang pananaw, lungsod ng diyos ng araw sa Eufrates, hilaga ng Babilonia, na kambal na lungsod (Sippar ni Shamash at ni Anunitum), akma sa dalawahang wakas ng pangalang Hebreo at kasama ng Babilonia at Cutha sa mga banggit; ngunit walang sariling hari ito noong panahong Asiryo, hindi sina Adrammelech at Anammelech ang diyos nito, at mga lungsod ng Siria ang iba sa listahan ng sugo. Sa isa pa, na sinusunod ng mapa, ito ang Sibrahim ni Ezekiel, “na nasa pagitan ng hangganan ng Damasco at ng hangganan ng Hamath”, at ang Shabarain na kinuha ni Salmanasar V ayon sa Kronikang Babilonio, bagaman Samaria (Shamara'in) ang basa ng karamihan ng iskolar. Ikatlo ang Saparre sa Babilonia. Ang pangalan ng dalawang diyos nito, mula sa melech, “hari”, gaya ng Molech, ay angkop sa paghahandog ng bata ngunit hindi nagtatakda ng lugar."
    - "Kung ang Sepharvaim ay Sippar, ang mga guho nito ay ang Tell Abu Habbah sa timog-kanluran ng Baghdad, kung saan humukay si Hormuzd Rassam noong 1881 at nakatagpo ang mga naghukay na Iraqi ng aklatan ng templo noong 1986; kung Sibrahim, ito ay nasa isang lugar sa lupain ng Siria sa pagitan ng Homs at Damasco at hindi pa natatagpuan."
