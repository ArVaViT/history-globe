# Overview article (ADR 0007). Mainstream facts only; Geliloth is treated as a landmark on the border, not a town; the word's use in Joshua 22 is explained; no site is chosen.
id: geliloth
place: a0c9a06
title:
  en: "Geliloth"
  ru: "Гелилоф"
  uk: "Гелілот"
