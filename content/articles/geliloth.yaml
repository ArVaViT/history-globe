body:
  en:
    - "Geliloth is a point on the border between Benjamin and Judah, named once in the description of Benjamin's southern line: from En-shemesh the border “went forth toward Geliloth, which is over against the going up of Adummim, and descended to the stone of Bohan the son of Reuben”. The same line, drawn from Judah's side, passes a Gilgal “that is before the going up to Adummim”, so the two names stand for one landmark. Both mean something like “circles”; Geliloth is also the word Joshua uses for the “borders”, or districts, of the Jordan where the eastern tribes built their altar, which the Synodal Bible renders as the neighbourhood of the Jordan, and the record on the map counts those verses too, though most translators read a common noun there."
    - "The ascent of Adummim is the old road from Jericho up to Jerusalem along the ridge south of Wadi Qelt, named for its red rock, and later the road of the parable of the Good Samaritan. Geliloth lay somewhere on this road, east of En-shemesh and above the Jordan plain: the candidates on the map are Araq ed-Deir, El Khirbeh, Khan el-Ahmar, the ruined monastery of Euthymius by the road, and Tal'at ed-Damm, the Arabic name of the pass itself. It was probably a landmark, perhaps a circle of stones, rather than a town, and no one has identified it."
    - "The road is now Route 1 from Jerusalem to Jericho and the Dead Sea, past the town of Ma'ale Adumim and the Inn of the Good Samaritan, where a museum of mosaics stands beside the old khan."
  ru:
    - "Гелилоф — точка на границе между Вениамином и Иудой, названная один раз в описании южной черты Вениамина: от Ен-Шемеша предел «идет к Гелилофу, который против возвышенности Адуммима, и нисходит к камню Богана, сына Рувимова». Та же черта, проведённая со стороны Иуды, проходит через Галгал, «который против возвышенности Адуммима», так что два имени означают один ориентир. Оба значат примерно «круги»; тем же словом гелилот Иисус Навин называет «окрестности Иордана», где восточные колена поставили жертвенник, и запись на карте считает и эти стихи, хотя большинство переводчиков читают там нарицательное слово."
    - "Возвышенность Адуммима — старая дорога из Иерихона в Иерусалим по хребту к югу от Вади-Кельт, названная по красной скале, а позже — дорога притчи о добром самарянине. Гелилоф лежал где-то на этой дороге, восточнее Ен-Шемеша и над Иорданской равниной: кандидаты на карте — Арак-эд-Дейр, Эль-Хирбе, Хан-эль-Ахмар, развалины монастыря Евфимия у дороги, и Тальат-эд-Дамм, арабское имя самого перевала. Скорее всего, это был ориентир, может быть круг камней, а не город, и никто его не опознал."
    - "Дорога теперь — шоссе 1 из Иерусалима в Иерихон и к Мёртвому морю, мимо города Маале-Адумим и Гостиницы доброго самарянина, где рядом со старым ханом стоит музей мозаик."
  uk:
    - "Гелілот — точка на межі між Веніяминовим і Юдиним колінами, названа один раз в описі південної лінії Веніямина: від Ен-Шемеша межа «тягнеться ... далїй до Гелилота, що стоїть проти проходу Адумимського, і спадає до Боганового каменя, Рубененкового». Та сама лінія, проведена з боку Юди, проходить повз Гілгал, «що стоїть навпроти проходу Адуммимського», тож обидві назви означають один орієнтир. Обидві означають щось на зразок «кіл»; Гелілот — також слово, яким Книга Ісуса Навина позначає «межі», або округи, Йордану, де східні коліна збудували свій жертовник, що Синодальна Біблія передає як околицю Йордану, і запис на карті враховує й ті вірші, хоча більшість перекладачів читає там загальну назву."
    - "Підйом Адуммім — стара дорога з Єрихона вгору до Єрусалима по хребту на південь від Ваді-Кельт, названа за червону скелю, а згодом дорога з притчі про милосердного самарянина. Гелілот лежав десь на цій дорозі, на схід від Ен-Шемеша й над Йорданською рівниною: кандидати на карті — Арак-ед-Дейр, Ель-Хірбе, Хан-ель-Ахмар, зруйнований монастир Євтимія біля дороги та Талʼат-ед-Дамм, арабська назва самого перевалу. Це був, імовірно, орієнтир, можливо, коло з каменів, а не місто, і ніхто його не ототожнив."
    - "Сьогодні дорога — це шосе № 1 від Єрусалима до Єрихона й Мертвого моря повз місто Маале-Адумім і Заїзд милосердного самарянина, де поряд зі старим караван-сараєм стоїть музей мозаїк."
  es:
    - "Gelilot es un punto de la frontera entre Benjamín y Judá, nombrado una vez en la descripción del límite meridional de Benjamín: desde En-semes el límite «sale á Geliloth, que está delante de la subida de Adummim, y descendía á la piedra de Bohan, hijo de Rubén». La misma línea, trazada desde el lado de Judá, pasa por un Gilgal «que está delante de la subida de Adumin», de modo que los dos nombres designan un mismo hito. Ambos significan algo como «círculos»; Gelilot es también la palabra que usa Josué para los «términos», o distritos, del Jordán donde las tribus orientales edificaron su altar, que la Biblia sinodal traduce como los alrededores del Jordán, y el registro del mapa cuenta también esos versículos, aunque la mayoría de los traductores leen allí un nombre común."
    - "La subida de Adumim es el viejo camino de Jericó a Jerusalén por la loma al sur del Wadi Qelt, llamado así por su roca roja, y más tarde el camino de la parábola del buen samaritano. Gelilot estaba en algún punto de este camino, al este de En-semes y por encima de la llanura del Jordán: los candidatos del mapa son Araq ed-Deir, El Khirbeh, Khan el-Ahmar, el monasterio arruinado de Eutimio junto al camino y Tal'at ed-Damm, el nombre árabe del propio paso. Probablemente era un hito, quizá un círculo de piedras, más que una población, y nadie lo ha identificado."
    - "El camino es hoy la Ruta 1 de Jerusalén a Jericó y al mar Muerto, que pasa por la ciudad de Ma'ale Adumim y por la Posada del Buen Samaritano, donde un museo de mosaicos se alza junto al viejo caravasar."
  pt:
    - "Gelilote é um ponto na fronteira entre Benjamim e Judá, nomeado uma vez na descrição da linha sul de Benjamim: a partir de En-Semes, a fronteira “seguia para Gelilote, que fica em frente à subida de Adumim. Descia até a pedra de Boã, filho de Rúben”. A mesma linha, traçada do lado de Judá, passa por um Gilgal “que fica em frente à subida de Adumim”, de modo que os dois nomes designam um só marco. Ambos significam algo como “círculos”; Gelilote é também a palavra que Josué usa para os “limites”, ou distritos, do Jordão onde as tribos orientais construíram o seu altar, que a Bíblia Sinodal traduz como as redondezas do Jordão, e o registro no mapa conta também esses versículos, embora a maioria dos tradutores leia ali um substantivo comum."
    - "A subida de Adumim é a antiga estrada de Jericó para Jerusalém ao longo da crista ao sul do uádi Qelt, assim chamada por sua rocha vermelha, e mais tarde a estrada da parábola do Bom Samaritano. Gelilote ficava em algum ponto dessa estrada, a leste de En-Semes e acima da planície do Jordão: os candidatos no mapa são Araq ed-Deir, El Khirbeh, Khan el-Ahmar, o mosteiro arruinado de Eutímio junto à estrada e Tal’at ed-Damm, o nome árabe da própria passagem. Provavelmente era um marco, talvez um círculo de pedras, e não uma cidade, e ninguém o identificou."
    - "A estrada é hoje a Rodovia 1, de Jerusalém a Jericó e ao mar Morto, passando pela cidade de Ma’ale Adumim e pela Pousada do Bom Samaritano, onde um museu de mosaicos fica ao lado do antigo cã."
  de:
    - "Gelilot ist ein Punkt auf der Grenze zwischen Benjamin und Juda, einmal genannt in der Beschreibung von Benjamins Südlinie: Von En-Schemesch läuft die Grenze: Sie „kommt hinaus gen Geliloth, das gegenüber der Steige Adummim liegt, und kommt herab zum Stein Bohans, des Sohnes Rubens“. Dieselbe Linie, von Judas Seite gezogen, berührt ein Gilgal, „welches liegt gegenüber der Steige Adummim“; beide Namen stehen also für ein und dasselbe Wahrzeichen. Beide bedeuten etwa „Kreise“; Gelilot ist auch das Wort, das Josua für die „Kreise am Jordan“ gebraucht, wo die ostjordanischen Stämme ihren Altar bauten und das die Synodalübersetzung als Umgebung des Jordan wiedergibt; die Aufzeichnung auf der Karte zählt auch diese Verse mit, obwohl die meisten Übersetzer dort ein Gattungswort lesen."
    - "Die Steige Adummim ist die alte Straße von Jericho hinauf nach Jerusalem auf dem Höhenrücken südlich des Wadi Qelt, nach ihrem roten Gestein benannt und später die Straße des Gleichnisses vom barmherzigen Samariter. Gelilot lag irgendwo an dieser Straße, östlich von En-Schemesch und über der Jordanebene: Die Kandidaten auf der Karte sind Araq ed-Deir, El Khirbeh, Khan el-Ahmar, die Klosterruine des Euthymios an der Straße und Tal'at ed-Damm, der arabische Name des Passes selbst. Vermutlich war es eher ein Wahrzeichen, vielleicht ein Steinkreis, als eine Stadt, und niemand hat es identifiziert."
    - "Die Straße ist heute die Route 1 von Jerusalem nach Jericho und zum Toten Meer, vorbei an der Stadt Ma'ale Adumim und der Herberge des barmherzigen Samariters, wo neben der alten Karawanserei ein Mosaikenmuseum steht."
  fr:
    - "Guelilôth est un point de la frontière entre Benjamin et Juda, nommé une fois dans la description de la limite sud de Benjamin : depuis En-Schémesch, la frontière allait « à Gueliloth, qui est vis-à-vis de la montée d’Adummim, et elle descendait à la pierre de Bohan, fils de Ruben ». La même ligne, tracée du côté de Juda, passe par un Guilgal « qui est vis-à-vis de la montée d’Adummim », de sorte que les deux noms désignent un seul repère. Tous deux signifient à peu près « cercles » ; Guelilôth est aussi le mot que Josué emploie pour les « districts du Jourdain » où les tribus orientales bâtirent leur autel, que la Bible synodale rend par les environs du Jourdain, et la fiche de la carte compte aussi ces versets, bien que la plupart des traducteurs y lisent un nom commun."
    - "La montée d’Adummim est l’ancienne route qui monte de Jéricho à Jérusalem le long de la crête au sud de l’oued Qelt, ainsi nommée pour sa roche rouge, et plus tard la route de la parabole du Bon Samaritain. Guelilôth se trouvait quelque part sur cette route, à l’est d’En-Schémesch et au-dessus de la plaine du Jourdain : les candidats de la carte sont Araq ed-Deir, El Khirbeh, Khan el-Ahmar, le monastère ruiné d’Euthyme au bord de la route, et Tal’at ed-Damm, nom arabe du col lui-même. C’était probablement un repère, peut-être un cercle de pierres, plutôt qu’une ville, et personne ne l’a identifié."
    - "La route est aujourd’hui la route 1 de Jérusalem à Jéricho et à la mer Morte, qui passe par la ville de Ma’ale Adumim et l’auberge du Bon Samaritain, où un musée de mosaïques se dresse à côté de l’ancien khan."
  pl:
    - "Gelilot to punkt na granicy między Beniaminem a Judą, wspomniany raz w opisie południowej linii Beniamina: od En-Szemesz granica „wychodzi do Gelilot, które jest przeciwko górze, wstępując do Adommim, bieżąc stamtąd do kamienia Bohena, syna Rubenowego”. Ta sama linia, poprowadzona od strony Judy, mija Gilgal, „które jest przeciw górze, gdzie wstępują do Adommim”, więc obie nazwy oznaczają jeden punkt orientacyjny. Obie znaczą coś w rodzaju „kręgów”; Gelilot to także słowo, którego Jozue używa dla „granic”, czyli okręgów Jordanu, gdzie plemiona wschodnie zbudowały ołtarz, co Biblia synodalna oddaje jako okolice Jordanu, i zapis na mapie liczy również te wersety, choć większość tłumaczy czyta tam rzeczownik pospolity."
    - "Podejście Adummim to dawna droga z Jerycha w górę do Jerozolimy grzbietem na południe od Wadi Kelt, nazwana od czerwonej skały, a później droga z przypowieści o Dobrym Samarytaninie. Gelilot leżało gdzieś przy tej drodze, na wschód od En-Szemesz i nad równiną Jordanu: kandydaci na mapie to Araq ed-Deir, El Khirbeh, Khan el-Ahmar, ruiny klasztoru Eutymiusza przy drodze i Talat ed-Damm, arabska nazwa samej przełęczy. Był to prawdopodobnie punkt orientacyjny, może krąg kamieni, a nie miasto, i nikt go nie zidentyfikował."
    - "Droga ta jest dziś trasą nr 1 z Jerozolimy do Jerycha i Morza Martwego, obok miasta Maale Adummim i Gospody Dobrego Samarytanina, gdzie obok dawnego chanu stoi muzeum mozaik."
  it:
    - "Gelilot è un punto sul confine fra Beniamino e Giuda, nominato una volta nella descrizione della linea meridionale di Beniamino: da En-Semes il confine «si dirigeva verso Gheliloth, che è dirimpetto alla salita di Adummim, e scendeva al sasso di Bohan, figliuolo di Ruben». La stessa linea, tracciata dal lato di Giuda, passa presso un Gàlgala «che è dirimpetto alla salita di Adummim», così i due nomi indicano un unico punto di riferimento. Entrambi significano qualcosa come «cerchi»; Gelilot è anche la parola che Giosuè usa per i confini, o distretti, del Giordano dove le tribù orientali costruirono il loro altare, resi dalla Bibbia sinodale come i dintorni del Giordano, e il registro della mappa conta anche quei versetti, benché la maggior parte dei traduttori vi legga un nome comune."
    - "La salita di Adummim è l’antica strada che da Gerico sale a Gerusalemme lungo la dorsale a sud del Wadi Qelt, così chiamata per la sua roccia rossa, e poi strada della parabola del buon Samaritano. Gelilot si trovava da qualche parte su questa strada, a est di En-Semes e sopra la piana del Giordano: i candidati sulla mappa sono Araq ed-Deir, El Khirbeh, Khan el-Ahmar, il monastero in rovina di Eutimio lungo la strada e Tal’at ed-Damm, il nome arabo del passo stesso. Era probabilmente un punto di riferimento, forse un cerchio di pietre, più che una città, e nessuno l’ha identificato."
    - "La strada è oggi la Route 1 da Gerusalemme a Gerico e al Mar Morto, oltre la città di Ma’ale Adumim e la Locanda del buon Samaritano, dove un museo di mosaici sorge accanto all’antico khan."
  nl:
    - "Gelilot is een punt op de grens tussen Benjamin en Juda, dat één keer wordt genoemd in de beschrijving van de zuidelijke grens van Benjamin: vanaf En-Semes “gaat zij uit naar Geliloth, welke is tegenover den opgang naar Adummim, en zij gaat af aan den steen van Bohan, den zoon van Ruben”. Dezelfde lijn, vanaf de kant van Juda getrokken, passeert een Gilgal, “hetwelk tegen den opgang van Adummim is”, zodat beide namen één oriëntatiepunt aanduiden. Beide betekenen zoiets als “kringen”; Geliloth is ook het woord dat Jozua gebruikt voor de “grenzen”, of streken, van de Jordaan waar de oostelijke stammen hun altaar bouwden, wat de Synodale Bijbel weergeeft als de omgeving van de Jordaan, en het register op de kaart telt ook die verzen mee, al lezen de meeste vertalers daar een soortnaam."
    - "De opgang van Adummim is de oude weg van Jericho omhoog naar Jeruzalem langs de bergrug ten zuiden van de Wadi Qelt, genoemd naar zijn rode gesteente, en later de weg uit de gelijkenis van de barmhartige Samaritaan. Gelilot lag ergens aan deze weg, ten oosten van En-Semes en boven de Jordaanvlakte: de kandidaten op de kaart zijn Araq ed-Deir, El Khirbeh, Khan el-Ahmar, het verwoeste klooster van Euthymius aan de weg en Tal’at ed-Damm, de Arabische naam van de pas zelf. Het was waarschijnlijk een oriëntatiepunt, misschien een kring van stenen, en geen stad, en niemand heeft het geïdentificeerd."
    - "De weg is nu Route 1 van Jeruzalem naar Jericho en de Dode Zee, langs de stad Ma’ale Adumim en de Herberg van de Barmhartige Samaritaan, waar naast de oude khan een museum van mozaïeken staat."
  cs:
    - "Gelilót je bod na hranici mezi Benjamínem a Judou, jmenovaný jednou v popisu jižní hranice Benjamínovy: od Én-šemeše hranice „vychází do Gelilot, kteréž jest naproti místu, kudy se jde do Adomim, a sstupuje k kameni Bohana, syna Rubenova“. Táž čára, vedená ze strany Judovy, míjí Gilgal, „kteréž jest naproti vcházení do Adomim“, takže obě jména označují jeden orientační bod. Obě znamenají něco jako „kruhy“; Gelilót je také slovo, jímž Jozue označuje „pomezí“, tedy okrsky, Jordánu, kde východní kmeny postavily svůj oltář, což synodální Bible vykládá jako okolí Jordánu, a záznam na mapě počítá i tyto verše, třebaže je většina překladatelů čte jako obecné podstatné jméno."
    - "Výstup Adumím je stará cesta z Jericha vzhůru do Jeruzaléma po hřebeni jižně od Wádí Kelt, pojmenovaná podle své červené skály a později cesta z podobenství o milosrdném Samaritánovi. Gelilót ležel někde na této cestě, východně od Én-šemeše a nad Jordánskou rovinou: kandidáty na mapě jsou Araq ed-Deir, El Khirbeh, Khan el-Ahmar, zřícený klášter Euthymiův u cesty a Tal'at ed-Damm, arabské jméno samotného průsmyku. Byl to pravděpodobně orientační bod, snad kruh kamenů, spíše než město, a nikdo jej neurčil."
    - "Cesta je dnes silnice č. 1 z Jeruzaléma do Jericha a k Mrtvému moři, kolem města Ma'ale Adumim a Hostince milosrdného Samaritána, kde vedle starého chánu stojí muzeum mozaik."
  sv:
    - "Gelilot är en punkt på gränsen mellan Benjamin och Juda, nämnd en gång i beskrivningen av Benjamins södra linje: från En-Shemesh ”vidare till Gelilot, som ligger mitt emot Adummimshöjden, och gick så ned till Bohans, Rubens sons, sten”. Samma linje, dragen från Judas sida, passerar ett Gilgal ”som ligger mitt emot Adummimshöjden”, så de två namnen står för ett och samma landmärke. Båda betyder ungefär ”kretsar”; Gelilot är också ordet hos Josua för ”stenkretsarna vid Jordan” där de östra stammarna byggde sitt altare, vilket den ryska synodalbibeln återger som trakten vid Jordan, och kartans uppgift räknar även de verserna, fast de flesta översättare läser ett vanligt substantiv där."
    - "Adummimshöjden är den gamla vägen från Jeriko upp till Jerusalem längs åsen söder om Wadi Qelt, uppkallad efter sin röda klippa och senare vägen i liknelsen om den barmhärtige samariern. Gelilot låg någonstans på denna väg, öster om En-Shemesh och ovanför Jordanslätten: kandidaterna på kartan är Araq ed-Deir, El Khirbeh, Khan el-Ahmar, Euthymios förfallna kloster vid vägen och Tal'at ed-Damm, det arabiska namnet på själva passet. Det var sannolikt ett landmärke, kanske en krets av stenar, snarare än en stad, och ingen har identifierat det."
    - "Vägen är nu Väg 1 från Jerusalem till Jeriko och Döda havet, förbi staden Ma'ale Adumim och Den barmhärtige samarierns värdshus, där ett mosaikmuseum ligger intill den gamla karavanserajen."
  nb:
    - "Gelilot er et punkt på grensen mellom Benjamin og Juda, nevnt én gang i beskrivelsen av Benjamins sørlige linje: fra En-Sjemesj gikk grensen «videre til Gelilot, som ligger midt imot Adummim-skaret, og så ned til den sten som har navn efter Bohan, Rubens sønn». Den samme linjen, trukket fra Judas side, passerer en Gilgal «som ligger midt imot Adummim-skaret», så de to navnene står for ett landemerke. Begge betyr noe som «sirkler»; Gelilot er også ordet Josva bruker for grenseområdene, eller distriktene, ved Jordan der de østlige stammene bygde sitt alter, som den synodale bibelen gjengir som omegnen av Jordan, og kartets oppføring regner også de versene med, selv om de fleste oversettere leser et fellesnavn der."
    - "Stigningen opp til Adummim er den gamle veien fra Jeriko opp til Jerusalem langs ryggen sør for Wadi Qelt, oppkalt etter sin røde stein, og senere veien i lignelsen om den barmhjertige samaritan. Gelilot lå et sted langs denne veien, øst for En-Sjemesj og over Jordan-sletten: kandidatene på kartet er Araq ed-Deir, El Khirbeh, Khan el-Ahmar, det ødelagte klosteranlegget til Euthymius ved veien og Tal'at ed-Damm, det arabiske navnet på selve passet. Det var trolig et landemerke, kanskje en steinring, snarere enn en by, og ingen har identifisert det."
    - "Veien er nå vei 1 fra Jerusalem til Jeriko og Dødehavet, forbi byen Ma'ale Adumim og Den barmhjertige samaritans herberge, der et mosaikkmuseum ligger ved siden av den gamle karavanserajen."
  tl:
    - "Ang Geliloth ay isang punto sa hangganan ng Benjamin at Juda, na minsan lamang binanggit sa paglalarawan ng katimugang guhit ng Benjamin: mula sa En-semes, ang hangganan ay “palabas sa Geliloth na nasa tapat ng pagsampa sa Adummim; at pababa sa bato ng Bohan na anak ni Ruben”. Ang gayunding guhit, na iginuhit mula sa panig ng Juda, ay dumaraan sa isang Gilgal na “nasa tapat ng pagsampa sa Adumin”, kaya't iisang palatandaan ang tinutukoy ng dalawang pangalan. Parehong may kahulugang tulad ng “mga bilog”; ang Geliloth din ang salitang ginamit ni Josue para sa “mga hangganan”, o mga distrito, ng Jordan kung saan nagtayo ng dambana ang mga lipi sa silangan; isinasalin ito ng Bibliyang Sinodal bilang kapaligiran ng Jordan, at binibilang din ng tala sa mapa ang mga talatang iyon, bagaman karamihan ng mga tagapagsalin ay bumabasa roon ng karaniwang pangngalan."
    - "Ang pagsampa ng Adummim ay ang lumang daan mula sa Jerico paakyat sa Jerusalem sa tagaytay sa timog ng Wadi Qelt, na ipinangalan sa pulang bato nito, at kalaunan ay ang daan sa talinghaga ng Mabuting Samaritano. Nasa isang bahagi ng daang ito ang Geliloth, sa silangan ng En-semes at sa itaas ng kapatagan ng Jordan: ang mga kandidato sa mapa ay ang Araq ed-Deir, El Khirbeh, Khan el-Ahmar, ang wasak na monasteryo ni Euthymius sa tabi ng daan, at ang Tal'at ed-Damm, ang Arabeng pangalan ng mismong daanan. Marahil ito ay isang palatandaan, baka isang bilog na bato, at hindi isang bayan, at wala pang nakatutukoy rito."
    - "Ang daan ay ngayon ang Ruta 1 mula Jerusalem patungong Jerico at Dagat na Patay, na dumaraan sa bayan ng Ma'ale Adumim at sa Tuluyan ng Mabuting Samaritano, kung saan may museo ng mga mosaic sa tabi ng lumang khan."
  da:
    - "Gelilot er et punkt på grænsen mellem Benjamin og Juda, nævnt én gang i beskrivelsen af Benjamins sydlige linje: fra En-Sjemesj »gaar ud til Geliloth, som ligger tværs over for Opgangen til Adummim, og gaar ned til Bohans, Rubens Søns, Sten«. Den samme linje, trukket fra Judas side, passerer et Gilgal, »som ligger tværs overfor Opgangen til Adummim«, så de to navne står for ét pejlemærke. Begge betyder noget i retning af »kredse«; Gelilot er også det ord, Josva bruger om Jordans »grænser« eller distrikter, hvor de østlige stammer byggede deres alter, hvilket synodalbibelen gengiver som egnen ved Jordan, og kortets registrering tæller også de vers med, skønt de fleste oversættere læser et fællesnavn der."
    - "Opgangen til Adummim er den gamle vej fra Jeriko op til Jerusalem langs højderyggen syd for Wadi Qelt, opkaldt efter sin røde klippe, og siden vejen i lignelsen om den barmhjertige samaritaner. Gelilot lå et sted på denne vej, øst for En-Sjemesj og over Jordan-sletten: kandidaterne på kortet er Araq ed-Deir, El Khirbeh, Khan el-Ahmar, Euthymios' ruinerede kloster ved vejen og Tal'at ed-Damm, det arabiske navn på selve passet. Det var sandsynligvis et pejlemærke, måske en kreds af sten, snarere end en by, og ingen har identificeret det."
    - "Vejen er nu Rute 1 fra Jerusalem til Jeriko og Det Døde Hav, forbi byen Ma'ale Adumim og Den Barmhjertige Samaritaners Kro, hvor et mosaikmuseum ligger ved siden af den gamle khan."
