# Overview article (ADR 0007). Mainstream facts only; Joel's valley is treated as a symbolic name, and the Kidron identification is dated to the fourth century as tradition, not as fact about Joel.
id: valley-of-jehoshaphat
place: a324282
title:
  en: "Valley of Jehoshaphat"
  ru: "Долина Иосафата"
  uk: "Долина Йосафата"
  es: "Valle de Josafat"
  pt: "Vale de Josafá"
  de: "Tal Josaphat"
  fr: "Vallée de Josaphat"
  pl: "Dolina Jozafata"
  it: "Valle di Giosafat"
  nl: "Dal van Josafat"
  cs: "Jozafatovo údolí"
