body:
  en:
    - "The valley of Jehoshaphat is named only by Joel: “I will also gather all nations, and will bring them down into the valley of Jehoshaphat, and will plead with them there for my people”, and again, “Let the heathen be wakened, and come up to the valley of Jehoshaphat: for there will I sit to judge all the heathen round about.” Jehoshaphat means “the Lord judges”, and two verses later the same place is “the valley of decision”. Most commentators take the name as symbolic, a valley of judgement rather than a known place; some connect it with the valley of Berachah where King Jehoshaphat gave thanks for victory over Moab and Ammon, or with the valley that Zechariah sees opening at the Mount of Olives on the day of the Lord."
    - "By the fourth century AD the name was attached to the Kidron valley between the Temple Mount and the Mount of Olives: Eusebius's Onomasticon and the pilgrim from Bordeaux already know it there. Jews, Christians and Muslims came to see the valley as the scene of the last judgement, which is why its slopes hold the vast Jewish cemetery of the Mount of Olives and Muslim graves beneath the eastern wall, and the rock-cut monuments of the Second Temple period at its bottom were given names to match: the “Tomb of Absalom”, the “Tomb of Zechariah” and, behind Absalom's, the “Tomb of Jehoshaphat”. The Kidron is the valley the map shows; whether Joel had any particular valley in mind cannot be known."
  ru:
    - "Долину Иосафата называет только Иоиль: «Я соберу все народы, и приведу их в долину Иосафата, и там произведу над ними суд за народ Мой», и снова: «Пусть воспрянут народы и низойдут в долину Иосафата; ибо там Я воссяду, чтобы судить все народы отовсюду». Иосафат значит «Господь судит», и двумя стихами ниже то же место названо «долиной суда». Большинство толкователей считают имя символическим: долина суда, а не известное место; некоторые связывают его с долиной благословения, где царь Иосафат благодарил за победу над Моавом и Аммоном, или с долиной, которая у Захарии раскрывается на горе Елеонской в день Господень."
    - "К IV веку н. э. имя закрепилось за долиной Кедрона между Храмовой горой и горой Елеонской: Ономастикон Евсевия и паломник из Бордо уже знают его там. Иудеи, христиане и мусульмане стали видеть в долине место последнего суда, оттого на её склонах лежит огромное еврейское кладбище Елеонской горы и мусульманские могилы под восточной стеной, а высеченным в скале памятникам времён Второго храма на её дне дали подходящие имена: «гробница Авессалома», «гробница Захарии» и, позади Авессаломовой, «гробница Иосафата». Карта показывает Кедрон; имел ли Иоиль в виду какую-то определённую долину, узнать нельзя."
  uk:
    - "Долина Йосафата названа лише в Йоїла: «Позбіраю всї народи на Йосафатовій долинї, і заведу там над ними суд за мій люд», і знову: «Рушайте, народи, зійдїть на Йосафатову долину; бо там я засяду, судити всї народи звідʼусюди!» Йосафат означає «Господь судить», а два вірші пізніше те саме місце — «долина суду». Більшість коментаторів вважають назву символічною, долиною суду, а не відомим місцем; дехто пов’язує її з долиною хвали (Берека), де цар Йосафат дякував за перемогу над Моавом і Аммоном, або з долиною, що, за Захарією, відкривається на Оливковій горі в день Господній."
    - "До IV століття н. е. назву прикріпили до долини Кедрону між Храмовою горою та Оливковою горою: Ономастикон Євсевія і Бордоський пілігрим уже знають її там. Юдеї, християни й мусульмани стали бачити в долині місце останнього суду, тому її схили зайняв величезний юдейський цвинтар Оливкової гори і мусульманські могили під східним муром, а висічені в скелі пам’ятки доби Другого храму на її дні дістали відповідні назви: «Гробниця Авесалома», «Гробниця Захарії» і, за Авесаломовою, «Гробниця Йосафата». Кедрон — це долина, яку показує мапа; чи мав Йоїл на думці якусь певну долину, знати не можна."
  es:
    - "El valle de Josafat solo lo nombra Joel: «Juntaré todas las gentes, y harélas descender al valle de Josaphat, y allí entraré en juicio con ellos á causa de mi pueblo», y de nuevo, «Las gentes se despierten, y suban al valle de Josaphat: porque allí me sentaré para juzgar todas las gentes de alrededor». Josafat significa «Jehová juzga», y dos versículos después el mismo lugar es «el valle de la decisión». La mayoría de los comentaristas toman el nombre como simbólico, un valle de juicio más que un lugar conocido; algunos lo relacionan con el valle de Beracah, donde el rey Josafat dio gracias por la victoria sobre Moab y Amón, o con el valle que Zacarías ve abrirse en el Monte de los Olivos el día del Señor."
    - "Hacia el siglo IV d. C. el nombre se había aplicado al valle del Cedrón, entre el Monte del Templo y el Monte de los Olivos: el Onomasticon de Eusebio y el peregrino de Burdeos ya lo conocen allí. Judíos, cristianos y musulmanes llegaron a ver el valle como el escenario del juicio final, y por eso sus laderas albergan el vasto cementerio judío del Monte de los Olivos y tumbas musulmanas bajo la muralla oriental, y a los monumentos excavados en la roca de la época del Segundo Templo en su fondo se les dieron nombres acordes: la «Tumba de Absalón», la «Tumba de Zacarías» y, detrás de la de Absalón, la «Tumba de Josafat». El Cedrón es el valle que muestra el mapa; si Joel tenía en mente algún valle en particular no puede saberse."
  pt:
    - "O vale de Josafá é nomeado apenas por Joel: “reunirei todas as nações, e as farei descer ao vale de Josafá; e ali executarei juízo sobre elas por causa do meu povo”, e de novo: “Que as nações se despertem, e subam ao vale de Josafá; pois ali me assentarei para julgar todas as nações ao redor.” Josafá significa “o SENHOR julga”, e dois versículos depois o mesmo lugar é “o vale da decisão”. A maioria dos comentaristas toma o nome como simbólico, um vale de juízo e não um lugar conhecido; alguns o ligam ao vale de Beraca, onde o rei Josafá deu graças pela vitória sobre Moabe e Amom, ou ao vale que Zacarias vê abrir-se no Monte das Oliveiras no dia do Senhor."
    - "No século IV d.C., o nome já estava ligado ao vale do Cedrom, entre o Monte do Templo e o Monte das Oliveiras: o Onomástico de Eusébio e o peregrino de Bordeaux já o conhecem ali. Judeus, cristãos e muçulmanos passaram a ver o vale como o cenário do juízo final, razão pela qual suas encostas abrigam o vasto cemitério judaico do Monte das Oliveiras e sepulturas muçulmanas sob a muralha oriental, e os monumentos talhados na rocha do período do Segundo Templo, no fundo, receberam nomes correspondentes: o “Túmulo de Absalão”, o “Túmulo de Zacarias” e, atrás do de Absalão, o “Túmulo de Josafá”. O Cedrom é o vale que o mapa mostra; se Joel tinha algum vale em mente não se pode saber."
  de:
    - "Das Tal Josaphat wird nur bei Joel genannt: „… will ich alle Heiden zusammenbringen und will sie in das Tal Josaphat hinabführen und will mit ihnen daselbst rechten wegen meines Volks“, und wieder: „Die Heiden werden sich aufmachen und heraufkommen zum Tal Josaphat; denn daselbst will ich sitzen, zu richten alle Heiden um und um.“ Josaphat bedeutet „der Herr richtet“, und zwei Verse später heißt derselbe Ort „Tal des Urteils“. Die meisten Ausleger halten den Namen für symbolisch, ein Tal des Gerichts statt eines bekannten Ortes; manche verbinden ihn mit dem Beracha-Tal, wo König Josaphat für den Sieg über Moab und Ammon dankte, oder mit dem Tal, das Sacharja sich am Ölberg am Tag des Herrn öffnen sieht."
    - "Im vierten Jahrhundert n. Chr. war der Name dem Kidrontal zwischen Tempelberg und Ölberg beigelegt: Das Onomastikon des Eusebius und der Pilger von Bordeaux kennen ihn dort bereits. Juden, Christen und Muslime sahen in dem Tal den Schauplatz des Jüngsten Gerichts, weshalb seine Hänge den riesigen jüdischen Friedhof des Ölbergs und muslimische Gräber unter der Ostmauer tragen und die in den Fels gehauenen Monumente der Zeit des Zweiten Tempels an seinem Grund passende Namen erhielten: das „Grab Absaloms“, das „Grab Sacharjas“ und hinter Absaloms das „Grab Josaphats“. Das Kidrontal ist das Tal, das die Karte zeigt; ob Joel ein bestimmtes Tal vor Augen hatte, lässt sich nicht wissen."
  fr:
    - "La vallée de Josaphat n’est nommée que par Joël : « Je rassemblerai toutes les nations, et je les ferai descendre dans la vallée de Josaphat ; là, j’entrerai en jugement avec elles, au sujet de mon peuple », et encore : « Que les nations se réveillent, et qu’elles montent vers la vallée de Josaphat ! Car là je siégerai pour juger toutes les nations d’alentour. » Josaphat signifie « l’Éternel juge », et quelques versets plus loin le même lieu est « la vallée du jugement ». La plupart des commentateurs prennent le nom pour symbolique, une vallée de jugement plutôt qu’un lieu connu ; certains le rattachent à la vallée de Beraca où le roi Josaphat rendit grâces pour la victoire sur Moab et Ammon, ou à la vallée que Zacharie voit s’ouvrir au mont des Oliviers au jour de l’Éternel."
    - "Dès le IVe siècle apr. J.-C., le nom fut attaché à la vallée du Cédron entre le mont du Temple et le mont des Oliviers : l’Onomasticon d’Eusèbe et le pèlerin de Bordeaux l’y connaissent déjà. Juifs, chrétiens et musulmans en vinrent à y voir la scène du jugement dernier, ce qui explique que ses pentes portent le vaste cimetière juif du mont des Oliviers et des tombes musulmanes sous le mur oriental, et que les monuments rupestres de l’époque du Second Temple au fond de la vallée aient reçu des noms assortis : le « Tombeau d’Absalom », le « Tombeau de Zacharie » et, derrière celui d’Absalom, le « Tombeau de Josaphat ». Le Cédron est la vallée que montre la carte ; si Joël avait une vallée particulière en tête, on ne peut le savoir."
  pl:
    - "Dolina Jozafata jest wymieniona tylko u Joela: „Zgromadzę też wszystkie narody, i sprowadzę je na dolinę Jozafat, i będę się tam z nimi sądził o lud swój”, i znowu: „Niech się ocucą i przyciągną te narody na dolinę Jozafat; bo tam siedzieć będę, abym sądził wszystkie narody okoliczne.” Jozafat znaczy „Pan sądzi”, a dwa wersety dalej to samo miejsce jest „w dolinie posieczenia”. Większość komentatorów bierze nazwę za symboliczną, dolinę sądu, a nie znane miejsce; niektórzy łączą ją z doliną Beracha, gdzie król Jozafat dziękował za zwycięstwo nad Moabem i Ammonem, albo z doliną, którą Zachariasz widzi otwierającą się na Górze Oliwnej w dniu Pańskim."
    - "W IV wieku n.e. nazwa była już przypisana dolinie Cedronu między Wzgórzem Świątynnym a Górą Oliwną: Onomastykon Euzebiusza i pielgrzym z Bordeaux znają ją już tam. Żydzi, chrześcijanie i muzułmanie uznali dolinę za scenę sądu ostatecznego, dlatego na jej stokach znajduje się ogromny cmentarz żydowski na Górze Oliwnej i groby muzułmańskie pod wschodnim murem, a wykute w skale pomniki z okresu Drugiej Świątyni na jej dnie otrzymały pasujące nazwy: „Grób Absaloma”, „Grób Zachariasza” i, za Grobem Absaloma, „Grób Jozafata”. Cedron jest doliną pokazywaną na mapie; czy Joel miał na myśli jakąś konkretną dolinę, nie można wiedzieć."
  it:
    - "La valle di Giosafat è nominata solo da Gioele: «io radunerò tutte le nazioni, e le farò scendere nella valle di Giosafat; e verrò quivi in giudizio con esse, a proposito del mio popolo», e ancora: «Si muovano e salgan le nazioni alla valle di Giosafat! Poiché là io mi assiderò a giudicar le nazioni d’ogn’intorno». Giosafat significa «il Signore giudica», e due versetti dopo lo stesso luogo è «la valle del Giudizio». La maggior parte dei commentatori intende il nome in senso simbolico, una valle di giudizio più che un luogo noto; alcuni lo collegano con la valle di Benedizione dove il re Giosafat rese grazie per la vittoria su Moab e Ammon, o con la valle che Zaccaria vede aprirsi sul Monte degli Ulivi nel giorno del Signore."
    - "Entro il IV secolo d.C. il nome fu riferito alla valle del Cedron fra il Monte del Tempio e il Monte degli Ulivi: l’Onomasticon di Eusebio e il pellegrino di Bordeaux già lo conoscono lì. Ebrei, cristiani e musulmani giunsero a vederla come scena del giudizio finale, per cui sui suoi pendii si trovano il vasto cimitero ebraico del Monte degli Ulivi e tombe musulmane sotto il muro orientale, e ai monumenti scavati nella roccia di epoca del Secondo Tempio sul suo fondo furono dati nomi corrispondenti: la «Tomba di Assalonne», la «Tomba di Zaccaria» e, dietro quella di Assalonne, la «Tomba di Giosafat». Il Cedron è la valle che la mappa mostra; se Gioele avesse in mente una valle particolare non si può sapere."
  nl:
    - "Het dal van Josafat wordt alleen door Joël genoemd: “Dan zal Ik alle heidenen vergaderen, en zal hen afvoeren in het dal van Josafat; en Ik zal met hen aldaar richten, vanwege Mijn volk”, en opnieuw: “De heidenen zullen zich opmaken, en optrekken naar het dal van Josafat; maar aldaar zal Ik zitten, om te richten alle heidenen van rondom.” Josafat betekent “de HEER oordeelt”, en twee verzen verder heet dezelfde plaats “het dal des dorswagens”. De meeste uitleggers nemen de naam als symbolisch, een dal van oordeel eerder dan een bekende plaats; sommigen verbinden hem met het dal van Beracha waar koning Josafat dankte voor de overwinning op Moab en Ammon, of met het dal dat Zacharia zich ziet openen bij de Olijfberg op de dag van de HEER."
    - "In de vierde eeuw n.Chr. was de naam verbonden aan het Kidrondal tussen de Tempelberg en de Olijfberg: het Onomasticon van Eusebius en de pelgrim van Bordeaux kennen hem daar al. Joden, christenen en moslims gingen het dal zien als het toneel van het laatste oordeel, en daarom dragen de hellingen de enorme Joodse begraafplaats van de Olijfberg en moslimgraven onder de oostmuur, en kregen de uit de rots gehouwen monumenten uit de tijd van de Tweede Tempel op de bodem passende namen: het “Graf van Absalom”, het “Graf van Zacharia” en, achter dat van Absalom, het “Graf van Josafat”. Het Kidron is het dal dat de kaart toont; of Joël een bepaald dal voor ogen had, valt niet te weten."
  cs:
    - "Jozafatovo údolí je jmenováno jen u Joela: „Shromáždím také všecky národy, a svedu je do údolí Jozafat, abych se tam soudil s nimi o lid svůj“, a znovu: „Probudíť se a přitáhnou národové ti do údolé Jozafat; nebo tam se posadím, abych soudil všecky ty národy okolní.“ Jozafat znamená „Hospodin soudí“ a o dva verše později je totéž místo „údolí posekání“. Většina vykladačů bere jméno za symbolické, údolí soudu spíše než známé místo; někteří je spojují s údolím Beracha, kde král Jozafat děkoval za vítězství nad Moábem a Amónem, nebo s údolím, které Zacharjáš vidí otevřít se na Olivové hoře v den Páně."
    - "Ve 4. století n. l. bylo jméno připojeno k údolí Kidronu mezi Chrámovou horou a Olivovou horou: Eusebiův Onomastikon a poutník z Bordeaux je tam už znají. Židé, křesťané i muslimové začali vidět v údolí dějiště posledního soudu, a proto jeho svahy nesou rozsáhlý židovský hřbitov na Olivové hoře a muslimské hroby pod východní hradbou a skalní památky z období druhého chrámu na jeho dně dostaly odpovídající jména: „Abšalomova hrobka“, „Zacharjášova hrobka“ a za Abšalomovou „Jozafatova hrobka“. Kidron je údolí, které mapa ukazuje; zda měl Joel na mysli nějaké určité údolí, nelze vědět."
  sv:
    - "Josafats dal nämns bara av Joel: ”då skall jag samla tillhopa alla hednafolk och föra dem ned till Josafats dal, och där skall jag hålla dom över dem, för mitt folks och min arvedels, Israels, skull”, och åter: ”Ja, må hednafolken resa sig och draga åstad till Josafats dal; ty där skall jag sitta till doms över alla folk häromkring.” Josafat betyder ”HERREN dömer”, och två verser senare är samma plats ”Domens dal”. De flesta kommentatorer tar namnet som symboliskt, en domens dal snarare än en känd plats; några förbinder det med Berakadalen där kung Josafat tackade för segern över Moab och Ammon, eller med dalen som Sakarja ser öppna sig vid Olivberget på Herrens dag."
    - "På 300-talet e.Kr. hade namnet knutits till Kidrondalen mellan Tempelberget och Olivberget: Eusebios' Onomastikon och pilgrimen från Bordeaux känner det redan där. Judar, kristna och muslimer kom att se dalen som skådeplatsen för den yttersta domen, vilket är skälet till att dess sluttningar rymmer Olivbergets väldiga judiska kyrkogård och muslimska gravar under östra muren, och de klipphuggna monumenten från andra tempelperioden i dess botten fick namn som passade: ”Absaloms grav”, ”Sakarjas grav” och, bakom Absaloms, ”Josafats grav”. Kidron är dalen kartan visar; om Joel hade någon särskild dal i tankarna kan inte vetas."
  nb:
    - "Josjafats dal er nevnt bare av Joel: «da vil jeg samle alle hedningefolk og føre dem ned i Josafats dal, og jeg vil der gå i rette med dem for mitt folks og min arvs, Israels skyld», og igjen: «Hedningefolkene skal våkne op og dra til Josafats dal; for der vil jeg sitte og dømme alle hedningefolk fra alle kanter.» Josjafat betyr «Herren dømmer», og to vers senere kalles det samme stedet «avgjørelsens dal». De fleste kommentatorer tar navnet som symbolsk, en dom-dal snarere enn et kjent sted; noen knytter det til Beraka-dalen der kong Josjafat takket for seieren over Moab og Ammon, eller til dalen som Sakarja ser åpne seg ved Oljeberget på Herrens dag."
    - "På 300-tallet e.Kr. var navnet knyttet til Kedron-dalen mellom Tempelhøyden og Oljeberget: Eusebius' Onomasticon og pilegrimen fra Bordeaux kjenner det allerede der. Jøder, kristne og muslimer kom til å se dalen som åstedet for den siste dom, og derfor rommer skråningene den enorme jødiske gravplassen på Oljeberget og muslimske graver under østmuren, og monumentene hugget i fjellet fra tiden for det andre tempelet nede i bunnen fikk navn som passet: «Absaloms grav», «Sakarjas grav» og, bak Absaloms, «Josjafats grav». Kedron er dalen kartet viser; om Joel hadde noen bestemt dal i tankene, kan ikke vites."
  tl:
    - "Ang libis ng Josaphat ay pinangalanan lamang ni Joel: “Aking pipisanin ang lahat na bansa, at aking ibababa sila sa libis ni Josaphat; at ako'y makikipagtanggol sa kanila roon dahil sa aking bayan”, at muli, “Magpakasigla ang mga bansa, at magsisampa sa libis ni Josaphat; sapagka't doo'y uupo ako upang hatulan ang lahat na bansa sa palibot.” Ang Josaphat ay nangangahulugang “Humahatol ang Panginoon”, at pagkaraan ng dalawang talata, ang lugar ding iyon ay “libis ng pasiya”. Itinuturing ng karamihan ng komentarista na simboliko ang pangalan, libis ng paghatol sa halip na kilalang lugar; iniuugnay ito ng ilan sa libis ng Beracah kung saan nagpasalamat si Haring Josaphat sa tagumpay laban sa Moab at Ammon, o sa libis na nakikita ni Zacharias na bumubukas sa Bundok ng mga Olibo sa araw ng Panginoon."
    - "Pagsapit ng ika-4 na siglo AD, nakakabit na ang pangalan sa libis ng Cedron sa pagitan ng Bundok ng Templo at ng Bundok ng mga Olibo: kilala na ito roon ng Onomasticon ni Eusebio at ng manlalakbay mula sa Bordeaux. Nakita ng mga Judio, Kristiyano at Muslim ang libis bilang tagpuan ng huling paghatol, kaya nasa mga dalisdis nito ang malawak na sementeryong Judio ng Bundok ng mga Olibo at mga libingang Muslim sa ilalim ng silangang pader, at ang mga monumentong inukit sa bato ng panahon ng Ikalawang Templo sa ilalim nito ay binigyan ng katugmang pangalan: ang “Libingan ni Absalom”, ang “Libingan ni Zacharias” at, sa likod ng kay Absalom, ang “Libingan ni Josaphat”. Ang Cedron ang libis na ipinakikita ng mapa; hindi malalaman kung may partikular na libis na nasa isip si Joel."
  da:
    - "Josafats Dal nævnes kun af Joel: »da vil jeg samle alle Hedningerne og føre dem ned til Josafats Dal; og der vil jeg gaa i Rette med dem om mit Folk«, og igen: »Opvækkes skulle Hedningerne og drage op til Josafats Dal; thi der vil jeg sidde, at dømme alle Hedningerne trindt omkring fra.« Josafat betyder »Herren dømmer«, og to vers senere er det samme sted »Dommens Dal«. De fleste kommentatorer tager navnet som symbolsk, en dal for dom snarere end et kendt sted; nogle forbinder det med Berakadalen, hvor kong Josafat takkede for sejren over Moab og Ammon, eller med den dal, som Zakarias ser åbne sig ved Oliebjerget på Herrens dag."
    - "I 300-tallet e.Kr. var navnet knyttet til Kedron-dalen mellem Tempelbjerget og Oliebjerget: Eusebios' Onomastikon og pilgrimmen fra Bordeaux kender det allerede dér. Jøder, kristne og muslimer kom til at se dalen som skueplads for den sidste dom, hvorfor dens skråninger rummer Oliebjergets vældige jødiske kirkegård og muslimske grave neden for østmuren, og de klippehuggede monumenter fra Andet Tempels tid i dens bund fik navne, der passede dertil: »Absaloms grav«, »Zakarias' grav« og, bag Absaloms, »Josafats grav«. Kedron er den dal, kortet viser; om Joel havde nogen bestemt dal i tankerne, kan ikke vides."
  sr:
    - "Долину Јосафатову именује само Јоило: „сабраћу све народе, и свешћу их у долину Јосафатову, и онде ћу се судити с њима за свој народ“, и опет: „Нека се подигну и дођу народи у долину Јосафатову; јер ћу онде сести да судим свим народима унаоколо.“ Јосафат значи „Господ суди“, а два стиха касније исто место је „долина судска“. Већина тумача узима име као симболично, долину суда, а не познато место; неки га повезују с Долином Благословном где је цар Јосафат захваљивао за победу над Моавом и Амоном, или с долином коју Захарија види да се отвара на Маслинској гори на дан Господњи."
    - "До 4. века н. е. име се прикачило долини Кедрон између Храмовне горе и Маслинске горе: Јевсевијев Ономастикон и ходочасник из Бордоа већ га онде знају. Јевреји, хришћани и муслимани су дошли да виде долину као поприште последњег суда, зато њене падине носе огромно јеврејско гробље на Маслинској гори и муслиманске гробове испод источног зида, а у стену усечене споменике из доба Другог храма на њеном дну добили су одговарајућа имена: „Авесаломов гроб“, „Захаријин гроб“ и, иза Авесаломовог, „Јосафатов гроб“. Кедрон је долина коју карта приказује; да ли је Јоило имао на уму неку одређену долину, не може се знати."
  hu:
    - "A Jósafát-völgyet csak Jóel nevezi meg: „Egybegyűjtöm akkor mind a pogányokat, és levezetem őket a Josafát völgyébe, és perbe szállok ott velök, az én népemért”, és ismét: „Serkenjenek fel és jőjjenek fel a népek a Josafát völgyébe; mert ott ülök törvényt, hogy megítéljek minden népeket.” A Jósafát „az Úr ítél” jelentésű, és két verssel később ugyanez a hely „az ítélet völgye”. A legtöbb magyarázó a nevet jelképesnek tartja, az ítélet völgyének, nem ismert helynek; egyesek a Beráka völgyével kapcsolják össze, ahol Jósafát király hálát adott a Moáb és Ammon feletti győzelemért, vagy azzal a völggyel, amelyet Zakariás lát megnyílni az Olajfák hegyénél az Úr napján."
    - "A Kr. u. 4. századra a nevet a Templomhegy és az Olajfák hegye közötti Kidron-völgyhöz kötötték: Eusebius Onomasticonja és a bordeaux-i zarándok már ott ismerik. Zsidók, keresztények és muszlimok a völgyet az utolsó ítélet színhelyének kezdték tekinteni, ezért találhatók lejtőin az Olajfák hegyének hatalmas zsidó temetője és a keleti fal alatti muszlim sírok, és a völgy fenekén lévő, a második templom korából származó sziklába vájt emlékművek ennek megfelelő neveket kaptak: „Absolon sírja”, „Zakariás sírja” és, Absolon mögött, „Jósafát sírja”. A Kidron az a völgy, amelyet a térkép mutat; hogy Jóelnek volt-e valamilyen konkrét völgy a szeme előtt, nem tudható."
  fi:
    - "Josafatin laakso mainitaan vain Joelilla: ”minä kokoan kaikki pakanakansat, vien ne alas Joosafatin laaksoon ja käyn siellä oikeutta niitten kanssa kansani ja perintöosani, Israelin, tähden”, ja uudelleen: ”Lähtekööt liikkeelle, hyökätkööt kansakunnat Joosafatin laaksoon; sillä siellä hän istuu tuomitsemassa kaikkia pakanakansoja, joka taholta tulleita.” Josafat merkitsee ”Herra tuomitsee”, ja kaksi jaetta myöhemmin sama paikka on ”ratkaisulaaksossa”. Useimmat selittäjät pitävät nimeä symbolisena, tuomion laaksona eikä tunnettuna paikkana; jotkut yhdistävät sen Beraka-laaksoon, jossa kuningas Josafat kiitti voitosta Moabia ja Ammonia vastaan, tai laaksoon, jonka Sakarja näkee aukeavan Öljymäellä Herran päivänä."
    - "300-luvulle jaa. mennessä nimi oli kiinnitetty Kidronin laaksoon Temppelivuoren ja Öljymäen välillä: Eusebioksen Onomasticon ja Bordeaux'n pyhiinvaeltaja tuntevat sen jo siellä. Juutalaiset, kristityt ja muslimit alkoivat nähdä laakson viimeisen tuomion näyttämönä, minkä vuoksi sen rinteillä on Öljymäen valtava juutalainen hautausmaa ja muslimien hautoja itämuurin alla, ja sen pohjalla olevat toisen temppelin ajan kallioon hakatut monumentit saivat sen mukaisia nimiä: ”Absalomin hauta”, ”Sakarjan hauta” ja Absalomin takana ”Josafatin hauta”. Kartalla näkyy Kidron; oliko Joelilla mielessä jokin tietty laakso, ei voida tietää."
  vi:
    - "Trũng Giô-sa-phát chỉ được Giô-ên nêu: “ta sẽ nhóm hết thảy các nước lại, và đem chúng nó xuống trong trũng Giô-sa-phát. Tại đó, ta sẽ phán xét chúng nó vì cớ dân ta”, và lại, “Các nước khá dấy lên, khá lên trong trũng Giô-sa-phát, vì ở đó là nơi ta sẽ ngồi đặng phán xét hết thảy các dân tộc xung quanh.” Giô-sa-phát nghĩa là “Đức Giê-hô-va xét đoán”, và hai câu sau, cũng nơi ấy được gọi là “trũng đoán định”. Hầu hết các nhà chú giải coi tên là biểu tượng, một trũng phán xét hơn là một nơi đã biết; một số liên hệ với trũng Bê-ra-ca nơi vua Giô-sa-phát tạ ơn vì chiến thắng Mô-áp và Am-môn, hoặc với thung lũng mà Xa-cha-ri thấy mở ra tại Núi Ô-li-ve vào ngày của Chúa."
    - "Đến thế kỷ 4, tên đã được gắn với thung lũng Xết-rôn giữa Núi Đền Thờ và Núi Ô-li-ve: Onomasticon của Eusebius và người hành hương ở Bordeaux đã biết nó ở đó. Người Do Thái, Cơ Đốc nhân và người Hồi giáo đến coi thung lũng là cảnh của cuộc phán xét cuối cùng, vì thế các sườn của nó có nghĩa địa Do Thái rộng lớn của Núi Ô-li-ve và các mộ Hồi giáo dưới tường đông, và các công trình đục trong đá thời Đền Thờ Thứ Hai ở đáy nó được đặt tên tương ứng: “Mộ Áp-sa-lôm”, “Mộ Xa-cha-ri” và, sau mộ Áp-sa-lôm, “Mộ Giô-sa-phát”. Xết-rôn là thung lũng bản đồ cho thấy; Giô-ên có nghĩ đến thung lũng nào cụ thể không thì không thể biết."
  ro:
    - "Valea lui Iosafat este numită numai de Ioel: „Și voiu adunà toate neamurile, și le voiu pogorî în valea lui Iosafat, și mă voiu prici cu ei acolo pentru poporul meu”, și din nou: „Să se scoale și să se sue toate neamurile la valea lui Iosafat, că acolo voiu ședeà să judec toate neamurile din prejur.” Iosafat înseamnă „Domnul judecă”, iar două versete mai târziu același loc este „valea judecății”. Cei mai mulți comentatori socotesc numele simbolic, o vale a judecății mai degrabă decât un loc cunoscut; unii îl leagă de valea Beracha, unde regele Iosafat a mulțumit pentru victoria asupra lui Moab și Amon, sau de valea pe care Zaharia o vede deschizându-se la Muntele Măslinilor în ziua Domnului."
    - "Încă din secolul al IV-lea d.Hr., numele fusese atașat văii Chedronului dintre Muntele Templului și Muntele Măslinilor: Onomasticonul lui Eusebiu și pelerinul din Bordeaux îl cunosc deja acolo. Evreii, creștinii și musulmanii au ajuns să vadă în vale scena judecății de apoi, motiv pentru care pantele ei adăpostesc vastul cimitir evreiesc de pe Muntele Măslinilor și morminte musulmane sub zidul estic, iar monumentele săpate în stâncă din epoca Templului al Doilea din fundul ei au primit nume potrivite: „Mormântul lui Absalom”, „Mormântul lui Zaharia” și, în spatele celui al lui Absalom, „Mormântul lui Iosafat”. Chedronul este valea pe care o arată harta; dacă Ioel a avut în minte vreo vale anume nu se poate ști."
  bg:
    - "Йосафатовата долина се споменава само от Йоил: „Ще събера още всичките народи Та ще ги сваля в Йосафатовия дол, И ще се съдя с тях там За людете си“, и отново: „Да станат и да възлязат народите в дола Йосафатов; Защото там ще седна да съдя всичките народи изоколо.“ Йосафат означава „Господ съди“, а два стиха по-късно същото място е „дола на отсъждането“. Повечето тълкуватели приемат името за символично — долина на съда, а не известно място; някои го свързват с Дола на Благословението (Бераха), където цар Йосафат благодарил за победата над Моав и Амон, или с долината, която Захария вижда да се отваря при Елеонския хълм в деня Господен."
    - "Към IV в. н.е. името се свързвало с долината Кедрон между Храмовия хълм и Елеонския хълм: „Ономастикон“ на Евсевий и Бордоският поклонник вече го познават там. Юдеи, християни и мюсюлмани започнали да виждат в долината мястото на Страшния съд, затова по склоновете ѝ се намират огромното юдейско гробище на Елеонския хълм и мюсюлмански гробове под източната стена, а изсечените в скалата паметници от периода на Втория храм на дъното ѝ получили съответни имена: „гробницата на Авесалом“, „гробницата на Захария“ и, зад тази на Авесалом, „гробницата на Йосафат“. Кедрон е долината, която показва картата; дали Йоил е имал предвид някоя определена долина, не може да се знае."
