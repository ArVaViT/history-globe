# Overview article (ADR 0007). Mainstream facts only; the place is unlocated and the two readings of the northern border are given fairly without choosing.
id: hazar-enan
place: a1ce1b7
title:
  en: "Hazar-enan"
  ru: "Гацар-Енан"
body:
  en:
    - "Hazar-enan, “enclosure of the spring”, is the north-eastern corner of the land promised to Israel. In the description of the borders given to Moses the northern line runs from the Great Sea by Mount Hor and Lebo-hamath to Zedad and Ziphron, “and the goings out of it shall be at Hazar-enan: this shall be your north border”, and the eastern border is then drawn “from Hazar-enan to Shepham” and down to the Sea of Chinnereth and the Jordan. Ezekiel, laying out the land of the restored tribes, uses the same mark: the northern border reaches Hazar-enan, “the border of Damascus”, with Hamath beyond, and the portion of Dan lies along it. The place is a boundary stone in a list and nothing more; no event happens there."
    - "Where it stood depends on how far north one draws the border. If Lebo-hamath is the Beqaa valley north of Baalbek and Zedad the village of Sadad south-east of Homs, Hazar-enan is usually sought at al-Qaryatayn, the oasis on the desert road from Damascus to Palmyra, whose spring fits the name and whose position marks where the settled land of Hamath and Damascus meets the steppe. Those who read the border more narrowly, with Lebo-hamath near the sources of the Jordan, look instead for Hazar-enan at the foot of Mount Hermon, at Hadar or Banias. Neither site has yielded anything that settles the matter."
    - "Al-Qaryatayn is today a town in the Homs governorate of Syria on the edge of the Syrian desert, long known for the monastery of Mar Elian, which was destroyed in 2015 during the Syrian war."
  ru:
    - "Гацар-Енан, «двор источника», — северо-восточный угол земли, обещанной Израилю. В описании границ, данном Моисею, северная линия идёт от Великого моря через гору Ор и Вход в Емаф к Цедаду и Цифрону, «и выступы ее будут к Гацар-Енану: это будет у вас граница северная», а восточную границу велено провести «от Гацар-Енана к Шефаму» и далее вниз к морю Киннереф и Иордану. Иезекииль, размечая землю возвращённых колен, пользуется той же метой: северная граница доходит до Гацар-Енона, «граница с Дамаском», а дальше область Емаф, и вдоль неё лежит удел Дана. Это межевой камень в перечне, не более; никакое событие там не происходит."
    - "Где он стоял, зависит от того, как далеко на север провести границу. Если Вход в Емаф — долина Бекаа к северу от Баальбека, а Цедад — селение Садад к юго-востоку от Хомса, то Гацар-Енан обычно ищут в Эль-Карьятайне, оазисе на пустынной дороге из Дамаска в Пальмиру: его источник отвечает имени, а положение отмечает, где обжитая земля Емафа и Дамаска встречается со степью. Те, кто читает границу уже, с Входом в Емаф у истоков Иордана, ищут Гацар-Енан у подножия Ермона, в Хадаре или Банияс. Ни одно из мест не дало ничего, что решило бы вопрос."
    - "Эль-Карьятайн сегодня — город в сирийской провинции Хомс на краю Сирийской пустыни, издавна известный монастырём Мар-Элиан, разрушенным в 2015 году во время сирийской войны."
scripture:
  - Num.34.7-Num.34.12
  - Ezek.47.17
  - Ezek.48.1
sources:
