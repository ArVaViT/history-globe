body:
  en:
    - "Hazar-enan, “enclosure of the spring”, is the north-eastern corner of the land promised to Israel. In the description of the borders given to Moses the northern line runs from the Great Sea by Mount Hor and Lebo-hamath to Zedad and Ziphron, “and the goings out of it shall be at Hazar-enan: this shall be your north border”, and the eastern border is then drawn “from Hazar-enan to Shepham” and down to the Sea of Chinnereth and the Jordan. Ezekiel, laying out the land of the restored tribes, uses the same mark: the northern border reaches Hazar-enan, “the border of Damascus”, with Hamath beyond, and the portion of Dan lies along it. The place is a boundary stone in a list and nothing more; no event happens there."
    - "Where it stood depends on how far north one draws the border. If Lebo-hamath is the Beqaa valley north of Baalbek and Zedad the village of Sadad south-east of Homs, Hazar-enan is usually sought at al-Qaryatayn, the oasis on the desert road from Damascus to Palmyra, whose spring fits the name and whose position marks where the settled land of Hamath and Damascus meets the steppe. Those who read the border more narrowly, with Lebo-hamath near the sources of the Jordan, look instead for Hazar-enan at the foot of Mount Hermon, at Hadar or Banias. Neither site has yielded anything that settles the matter."
    - "Al-Qaryatayn is today a town in the Homs governorate of Syria on the edge of the Syrian desert, long known for the monastery of Mar Elian, which was destroyed in 2015 during the Syrian war."
  ru:
    - "Гацар-Енан, «двор источника», — северо-восточный угол земли, обещанной Израилю. В описании границ, данном Моисею, северная линия идёт от Великого моря через гору Ор и Вход в Емаф к Цедаду и Цифрону, «и выступы ее будут к Гацар-Енану: это будет у вас граница северная», а восточную границу велено провести «от Гацар-Енана к Шефаму» и далее вниз к морю Киннереф и Иордану. Иезекииль, размечая землю возвращённых колен, пользуется той же метой: северная граница доходит до Гацар-Енона, «граница с Дамаском», а дальше область Емаф, и вдоль неё лежит удел Дана. Это межевой камень в перечне, не более; никакое событие там не происходит."
    - "Где он стоял, зависит от того, как далеко на север провести границу. Если Вход в Емаф — долина Бекаа к северу от Баальбека, а Цедад — селение Садад к юго-востоку от Хомса, то Гацар-Енан обычно ищут в Эль-Карьятайне, оазисе на пустынной дороге из Дамаска в Пальмиру: его источник отвечает имени, а положение отмечает, где обжитая земля Емафа и Дамаска встречается со степью. Те, кто читает границу уже, с Входом в Емаф у истоков Иордана, ищут Гацар-Енан у подножия Ермона, в Хадаре или Банияс. Ни одно из мест не дало ничего, что решило бы вопрос."
    - "Эль-Карьятайн сегодня — город в сирийской провинции Хомс на краю Сирийской пустыни, издавна известный монастырём Мар-Элиан, разрушенным в 2015 году во время сирийской войны."
  uk:
    - "Гацар-Енан, «огорожа джерела», — північно-східний кут краю, обіцяного Ізраїлю. В описі меж, даному Мойсею, північна лінія йде від Великого моря через гору Гор і Вхід у Хамат до Цедаду й Цифрону, «і виступ її буде коло Газар Енану. Се буде вам північня гряниця», а східну межу потім проведено «від Газар Енану до Шефаму» і вниз до моря Кіннерет та Йордану. Єзекіїль, розмежовуючи землю відновлених колін, користується тим самим орієнтиром: північна межа сягає Гацар-Енана, «од північньої гряницї Дамаського займища», а далі Хамат, і вздовж неї лежить пай Дана. Це межовий знак у переліку й не більше; там не відбувається жодної події."
    - "Де він стояв, залежить від того, як далеко на північ проводити межу. Якщо Вхід у Хамат — це долина Бекаа на північ від Баальбека, а Цедад — село Садад на південний схід від Хомса, Гацар-Енан зазвичай шукають в Ель-Карьятейні, оазі на пустельній дорозі від Дамаска до Пальміри, чиє джерело відповідає назві і чиє положення позначає місце, де осілі землі Хамату й Дамаска зустрічаються зі степом. Ті, хто читає межу вужче, з Входом у Хамат поблизу витоків Йордану, шукають Гацар-Енан натомість біля підніжжя гори Гермон, у Хадарі або Баніасі. Жодне місце не дало нічого, що вирішило б питання."
    - "Ель-Карьятейн сьогодні — місто в губернаторстві Хомс у Сирії на краю Сирійської пустелі, здавна відоме монастирем Мар-Еліан, зруйнованим 2015 року під час сирійської війни."
  es:
    - "Hazar-enán, «recinto de la fuente», es la esquina nordeste de la tierra prometida a Israel. En la descripción de los límites dada a Moisés, la línea norte va desde el Mar Grande por el monte Hor y la Entrada de Hamat hasta Sedad y Zifrón, «y serán sus remates en Hasar-enán: este os será el término del norte», y el límite oriental se traza luego «desde Hasar-enán hasta Sepham» y baja hasta el mar de Cineret y el Jordán. Ezequiel, al repartir la tierra de las tribus restauradas, usa el mismo hito: el límite norte llega a Hazar-enán, «al término de Damasco», con Hamat más allá, y la porción de Dan se extiende a lo largo de él. El lugar es un mojón en una lista y nada más; no ocurre allí ningún suceso."
    - "Dónde estuvo depende de hasta qué punto del norte se trace la frontera. Si la Entrada de Hamat es el valle de la Becá al norte de Baalbek y Sedad la aldea de Sadad al sudeste de Homs, Hazar-enán suele buscarse en al-Qaryatayn, el oasis del camino del desierto de Damasco a Palmira, cuya fuente concuerda con el nombre y cuya posición marca donde la tierra poblada de Hamat y Damasco se encuentra con la estepa. Quienes leen la frontera más estrechamente, con la Entrada de Hamat cerca de las fuentes del Jordán, buscan en cambio Hazar-enán al pie del monte Hermón, en Hadar o Banias. Ninguno de los dos sitios ha dado nada que resuelva la cuestión."
    - "Al-Qaryatayn es hoy una población de la gobernación de Homs, en Siria, en el borde del desierto sirio, conocida desde hace mucho por el monasterio de Mar Elián, destruido en 2015 durante la guerra de Siria."
  pt:
    - "Hazar-Enã, “recinto da fonte”, é o canto nordeste da terra prometida a Israel. Na descrição das fronteiras dada a Moisés, a linha norte vai do Mar Grande pelo monte Hor e Lebo-Hamate a Zedade e Zifrom, “terminará em Hazar-Enã. Esta será a sua fronteira norte”, e a fronteira leste é então traçada “de Hazar-Enã até Sefã” e desce até o mar de Quinerete e o Jordão. Ezequiel, ao distribuir a terra das tribos restauradas, usa o mesmo marco: a fronteira norte chega a Hazar-Enã, “na fronteira de Damasco”, com Hamate além, e a porção de Dã se estende ao longo dela. O lugar é um marco de limite numa lista e nada mais; nenhum fato ocorre ali."
    - "Onde ficava depende de até onde ao norte se traça a fronteira. Se Lebo-Hamate é o vale de Beca, ao norte de Baalbek, e Zedade a aldeia de Sadad, a sudeste de Homs, Hazar-Enã é usualmente procurada em al-Qaryatayn, o oásis na estrada do deserto de Damasco a Palmira, cuja fonte combina com o nome e cuja posição marca onde a terra povoada de Hamate e Damasco encontra a estepe. Os que leem a fronteira de modo mais estreito, com Lebo-Hamate perto das nascentes do Jordão, procuram Hazar-Enã ao pé do monte Hermom, em Hadar ou Banias. Nenhum dos sítios produziu algo que decida a questão."
    - "Al-Qaryatayn é hoje uma cidade na província de Homs, na Síria, na orla do deserto sírio, há muito conhecida pelo mosteiro de Mar Elian, destruído em 2015 durante a guerra síria."
  de:
    - "Hazar-Enan, „Gehöft der Quelle“, ist die nordöstliche Ecke des Israel verheißenen Landes. In der Beschreibung der Grenzen, die Mose gegeben wurde, läuft die Nordlinie vom Großen Meer über den Berg Hor und Lebo-Hamat nach Zedad und Zifron, „und ihr Ende sei am Dorf Enan. Das sei eure Grenze gegen Mitternacht“, und die Ostgrenze wird dann „vom Dorf Enan gen Sepham“ gezogen und hinab zum Meer Kinneret und zum Jordan. Hesekiel, der das Land der wiederhergestellten Stämme ausmisst, verwendet dasselbe Mal: Die Nordgrenze reicht „bis gen Hazar-Enon, und Damaskus und Hamath sollen das Ende sein“, und der Anteil Dans liegt an ihr entlang. Der Ort ist ein Grenzstein in einer Liste und nichts weiter; dort geschieht kein Ereignis."
    - "Wo er stand, hängt davon ab, wie weit nördlich man die Grenze zieht. Wenn Lebo-Hamat die Bekaa-Ebene nördlich von Baalbek ist und Zedad das Dorf Sadad südöstlich von Homs, wird Hazar-Enan meist in al-Qaryatain gesucht, der Oase an der Wüstenstraße von Damaskus nach Palmyra, deren Quelle zum Namen passt und deren Lage markiert, wo das Siedlungsland von Hamat und Damaskus auf die Steppe trifft. Wer die Grenze enger liest, mit Lebo-Hamat nahe den Jordanquellen, sucht Hazar-Enan stattdessen am Fuß des Hermon, bei Hadar oder Banias. Keine der Stätten hat etwas ergeben, das die Sache entscheidet."
    - "Al-Qaryatain ist heute eine Stadt im syrischen Gouvernement Homs am Rand der syrischen Wüste, lange bekannt durch das Kloster Mar Elian, das 2015 im syrischen Krieg zerstört wurde."
  fr:
    - "Hatsar-Énan, « enclos de la source », est l’angle nord-est du pays promis à Israël. Dans la description des frontières donnée à Moïse, la ligne nord va de la Grande mer par la montagne de Hor et l’entrée de Hamath jusqu’à Tsedad et Tsiphron, « pour aboutir à Hatsar-Énan : ce sera votre limite au septentrion », et la frontière orientale est ensuite tracée « de Hatsar-Énan à Schepham » puis descend vers la mer de Kinnéreth et le Jourdain. Ézéchiel, en dessinant le pays des tribus restaurées, emploie le même repère : la frontière nord atteint Hatsar-Énan, « la frontière de Damas », avec Hamath au-delà, et la part de Dan s’étend le long d’elle. Le lieu est une borne dans une liste et rien de plus ; il ne s’y passe aucun événement."
    - "L’emplacement dépend de la hauteur à laquelle on trace la frontière au nord. Si l’entrée de Hamath est la vallée de la Bekaa au nord de Baalbek et Tsedad le village de Sadad au sud-est de Homs, on cherche d’ordinaire Hatsar-Énan à al-Qaryatayn, l’oasis sur la route du désert de Damas à Palmyre, dont la source s’accorde avec le nom et dont la position marque l’endroit où le pays habité de Hamath et de Damas rencontre la steppe. Ceux qui lisent la frontière plus étroitement, avec l’entrée de Hamath près des sources du Jourdain, cherchent plutôt Hatsar-Énan au pied du mont Hermon, à Hadar ou à Banias. Aucun site n’a livré quoi que ce soit qui tranche la question."
    - "Al-Qaryatayn est aujourd’hui une ville du gouvernorat de Homs, en Syrie, en lisière du désert syrien, longtemps connue pour le monastère de Mar Elian, détruit en 2015 pendant la guerre de Syrie."
  pl:
    - "Chasar-Enan, „zagroda źródła”, to północno-wschodni róg ziemi obiecanej Izraelowi. W opisie granic danym Mojżeszowi linia północna biegnie od Morza Wielkiego przez górę Hor i Lebo-Chamat do Sedad i Zifron, „a skończy się u wsi Enan; tę będziecie mieć granice północną”, a granica wschodnia jest potem poprowadzona „od wsi Enan aż do Sefama” i w dół do morza Kinneret i Jordanu. Ezechiel, rozmierzając ziemię odnowionych pokoleń, używa tego samego znaku: granica północna sięga Chasar-Enan, „ku granicy Damaszku”, z Chamat za nim, i wzdłuż niej leży dział Dana. Miejsce jest kamieniem granicznym w wykazie i niczym więcej; nic się tam nie dzieje."
    - "Gdzie stało, zależy od tego, jak daleko na północ poprowadzi się granicę. Jeśli Lebo-Chamat to dolina Bekaa na północ od Baalbeku, a Sedad to wieś Sadad na południowy wschód od Homs, Chasar-Enan szuka się zwykle w al-Karjatajn, oazie przy pustynnej drodze z Damaszku do Palmyry, której źródło pasuje do nazwy, a położenie wyznacza miejsce, gdzie osiadły kraj Chamat i Damaszku styka się ze stepem. Ci, którzy czytają granicę węziej, z Lebo-Chamat blisko źródeł Jordanu, szukają raczej Chasar-Enan u stóp góry Hermon, w Hadar lub Banijas. Żadne z miejsc nie dostarczyło niczego, co by rozstrzygało sprawę."
    - "Al-Karjatajn to dziś miasto w muhafazie Homs w Syrii na skraju pustyni syryjskiej, od dawna znane z klasztoru Mar Elian, zniszczonego w 2015 r. podczas wojny syryjskiej."
  it:
    - "Cazar-Enan, «recinto della sorgente», è l’angolo nord-orientale della terra promessa a Israele. Nella descrizione dei confini data a Mosè la linea settentrionale va dal Mare Grande per il Monte Or e l’Entrata di Camat fino a Zedad e Zifron, «per finire a Hatsar-Enan: questa sarà la vostra frontiera settentrionale», e il confine orientale è poi tracciato «da Hatsar-Enan a Scefam» e giù fino al mare di Chinnerèt e al Giordano. Ezechiele, nel delineare il paese delle tribù restaurate, usa lo stesso segno: il confine settentrionale giunge a Hatsar-Enon, «frontiera di Damasco», con Camat oltre, e la porzione di Dan si stende lungo di esso. Il luogo è un cippo di confine in un elenco e nulla più; non vi accade alcun evento."
    - "Dove sorgesse dipende da quanto a nord si tracci il confine. Se l’Entrata di Camat è la valle della Beqa a nord di Baalbek e Zedad il villaggio di Sadad a sud-est di Homs, Cazar-Enan si cerca di solito ad al-Qaryatayn, l’oasi sulla strada del deserto da Damasco a Palmira, la cui sorgente si adatta al nome e la cui posizione segna dove la terra coltivata di Camat e di Damasco incontra la steppa. Chi legge il confine in modo più stretto, con l’Entrata di Camat presso le sorgenti del Giordano, cerca invece Cazar-Enan ai piedi del Monte Ermon, a Hadar o a Banias. Nessuno dei due siti ha restituito qualcosa che decida la questione."
    - "Al-Qaryatayn è oggi una città del governatorato di Homs in Siria, al margine del deserto siriano, a lungo nota per il monastero di Mar Elian, distrutto nel 2015 durante la guerra siriana."
  nl:
    - "Hazar-Enan, “omheining van de bron”, is de noordoostelijke hoek van het aan Israël beloofde land. In de beschrijving van de grenzen die aan Mozes werd gegeven, loopt de noordlijn van de Grote Zee langs de berg Hor en Lebo-Hamat naar Zedad en Zifron, “en haar uitgangen zullen zijn te Hazar-Enan; dit zal u de noorder landpale zijn”, en de oostgrens wordt dan getrokken “van Hazar-Enan naar Sefam” en omlaag naar de zee van Kinneret en de Jordaan. Ezechiël, die het land van de herstelde stammen indeelt, gebruikt hetzelfde merkteken: de noordgrens reikt tot Hazar-Enan, “de landpale van Damaskus”, met Hamat erachter, en het deel van Dan ligt ertegenaan. De plaats is een grenssteen in een lijst en niets meer; er gebeurt niets."
    - "Waar het lag, hangt ervan af hoe ver naar het noorden men de grens trekt. Als Lebo-Hamat de Bekaavallei ten noorden van Baalbek is en Zedad het dorp Sadad ten zuidoosten van Homs, wordt Hazar-Enan gewoonlijk gezocht te al-Qaryatayn, de oase aan de woestijnweg van Damascus naar Palmyra, waarvan de bron bij de naam past en de ligging aangeeft waar het bewoonde land van Hamat en Damascus de steppe ontmoet. Wie de grens enger leest, met Lebo-Hamat bij de bronnen van de Jordaan, zoekt Hazar-Enan juist aan de voet van de Hermon, te Hadar of Banias. Geen van beide plaatsen heeft iets opgeleverd dat de zaak beslist."
    - "Al-Qaryatayn is nu een stad in het Syrische gouvernement Homs aan de rand van de Syrische woestijn, lang bekend om het klooster Mar Elian, dat in 2015 tijdens de Syrische oorlog werd verwoest."
  cs:
    - "Chacar-enan, „ohrada pramene“, je severovýchodní roh země zaslíbené Izraeli. V popisu hranic daném Mojžíšovi vede severní čára od Velkého moře přes horu Hor a Lebo-chamat k Sedadu a Zifronu, „a konec jeho u vsi Enan; to bude pomezí vaše k straně půlnoční“, a východní hranice je pak vedena „od vsi Enan až do Sefama“ a dolů k Kineretskému moři a k Jordánu. Ezechiel, vymezující zemi obnovených kmenů, užívá téže značky: severní hranice dosahuje „Azar Enon, pomezí Damašek“, s Chamatem za ní, a podíl Danův leží podél ní. Místo je mezník v seznamu a nic víc; nic se tam neděje."
    - "Kde stálo, závisí na tom, jak daleko na sever se hranice vede. Je-li Lebo-chamat údolí Bikáa severně od Baalbeku a Sedad vesnice Sadád jihovýchodně od Homsu, hledá se Chacar-enan obvykle v al-Qaryatayn, oáze na pouštní cestě z Damašku do Palmýry, jejíž pramen odpovídá jménu a jejíž poloha vyznačuje, kde se osídlená země Chamatu a Damašku setkává se stepí. Ti, kdo čtou hranici užší, s Lebo-chamat poblíž pramenů Jordánu, hledají místo toho Chacar-enan na úpatí Hermonu, v Hadaru nebo Baníásu. Žádné místo nepřineslo nic, co by věc rozhodlo."
    - "Al-Qaryatayn je dnes město v gubernii Homs v Sýrii na okraji syrské pouště, dlouho známé klášterem Mar Eljan, který byl zničen roku 2015 během syrské války."
  sv:
    - "Hasar-Enan, ”källans inhägnad”, är det nordöstra hörnet av landet som utlovades Israel. I beskrivningen av gränserna som gavs Mose löper norra linjen från Stora havet förbi berget Hor och Lebo-Hamat till Sedad och Sifron, ”därifrån ut vid Hasar-Enan. Detta skall vara eder gräns i norr”, och östgränsen dras sedan ”från Hasar-Enan fram till Sefam” och ned till Kinneretsjön och Jordan. Hesekiel, som lägger ut landet för de återupprättade stammarna, använder samma märke: norra gränsen når Hasar-Enan, ”vid Damaskus' område”, med Hamat bortom, och Dans del ligger längs den. Platsen är en gränssten i en förteckning och inget mer; ingen händelse sker där."
    - "Var den stod beror på hur långt norrut man drar gränsen. Om Lebo-Hamat är Bekaadalen norr om Baalbek och Sedad byn Sadad sydost om Homs, söks Hasar-Enan vanligen i al-Qaryatayn, oasen vid ökenvägen från Damaskus till Palmyra, vars källa passar namnet och vars läge markerar där Hamats och Damaskus bebodda land möter stäppen. De som läser gränsen snävare, med Lebo-Hamat nära Jordans källor, söker i stället Hasar-Enan vid foten av Hermon, vid Hadar eller Banias. Ingen av platserna har gett något som avgör saken."
    - "Al-Qaryatayn är i dag en stad i Syriens guvernement Homs i kanten av den syriska öknen, länge känd för klostret Mar Elian, som förstördes 2015 under kriget i Syrien."
  nb:
    - "Hasar-Enan, «kildens innhegning», er det nordøstlige hjørnet av landet som er lovet Israel. I beskrivelsen av grensene gitt til Moses løper nordlinjen fra Storhavet ved Hor-fjellet og Lebo-Hamat til Sedad og Sifron, «og ende ved Hasar-Enan. Dette skal være eders grense i nord», og østgrensen trekkes så «fra Hasar-Enan til Sefam» og ned til Kinnerets sjø og Jordan. Esekiel, som legger ut landet til de gjenopprettede stammene, bruker det samme merket: nordgrensen når «Hasar-Enon ved Damaskus' landemerke», med Hamat bortenfor, og Dans andel ligger langs den. Stedet er en grensestein i en liste og ikke mer; ingen hendelse finner sted der."
    - "Hvor det sto, avhenger av hvor langt nord man trekker grensen. Hvis Lebo-Hamat er Bekaa-dalen nord for Baalbek og Sedad landsbyen Sadad sørøst for Homs, søkes Hasar-Enan vanligvis ved al-Qaryatayn, oasen ved ørkenveien fra Damaskus til Palmyra, hvis kilde passer med navnet og hvis plass markerer stedet der det bebodde landet Hamat og Damaskus møter steppen. De som leser grensen snevrere, med Lebo-Hamat nær kildene til Jordan, leter i stedet etter Hasar-Enan ved foten av Hermon, ved Hadar eller Banias. Ingen av stedene har gitt noe som avgjør saken."
    - "Al-Qaryatayn er i dag en by i guvernementet Homs i Syria i kanten av den syriske ørkenen, lenge kjent for klosteret Mar Elian, som ble ødelagt i 2015 under krigen i Syria."
  tl:
    - "Ang Hasar-enan, “bakuran ng bukal”, ay ang hilagang-silangang sulok ng lupaing ipinangako sa Israel. Sa paglalarawan ng mga hangganang ibinigay kay Moises, ang hilagang guhit ay tumatakbo mula sa Malaking Dagat sa tabi ng Bundok Hor at Pasukan sa Hamath hanggang sa Sedad at Ziphron, “ang magiging mga labasan niyaon, ay ang Hasar-enan: ito ang magiging inyong hangganang hilagaan”, at ang silangang hangganan ay iginuguhit “mula sa Hasar-enan hanggang Sepham” at pababa sa Dagat ng Cinereth at Jordan. Si Ezekiel, na naglalatag ng lupain ng mga naibalik na lipi, ay gumagamit ng parehong palatandaan: ang hilagang hangganan ay umaabot sa Hasar-enan, “sa hangganan ng Damasco”, na may Hamath sa kabila, at ang bahagi ni Dan ay nasa tabi nito. Ang lugar ay isang batong hangganan sa isang talaan at wala nang iba; walang pangyayaring naganap doon."
    - "Kung saan ito nakatayo ay nakasalalay sa kung gaano kahilaga iginuguhit ang hangganan. Kung ang Pasukan sa Hamath ay ang libis ng Beqaa sa hilaga ng Baalbek at ang Sedad ay ang nayon ng Sadad sa timog-silangan ng Homs, ang Hasar-enan ay karaniwang hinahanap sa al-Qaryatayn, ang oasis sa daan ng disyerto mula Damasco patungong Palmyra, na ang bukal ay umaangkop sa pangalan at ang posisyon ay nagmamarka kung saan nagtatagpo ang tinitirhang lupain ng Hamath at Damasco at ang estepa. Ang mga nagbabasa ng hangganan nang mas makitid, na ang Pasukan sa Hamath ay malapit sa mga pinagmulan ng Jordan, ay naghahanap sa halip ng Hasar-enan sa paanan ng Bundok Hermon, sa Hadar o Banias. Wala sa dalawang lugar ang nagbunga ng anumang nakalulutas sa bagay."
    - "Ang al-Qaryatayn ay ngayon isang bayan sa gobernadorado ng Homs ng Siria sa gilid ng disyerto ng Siria, matagal nang kilala sa monasteryo ni Mar Elian, na winasak noong 2015 sa digmaang Siryano."
  da:
    - "Hasar-Enan, »kildens indhegning«, er det nordøstlige hjørne af det land, der blev lovet Israel. I beskrivelsen af grænserne givet til Moses løber nordlinjen fra Det Store Hav ved Bjerget Hor og Lebo-Hamat til Sedad og Sifron, »og dets Udgang skal være ved Hasar-Enan; dette skal være eders Landemærke imod Norden«, og østgrænsen trækkes derefter »fra Hasar-Enan til Sefam« og ned til Kinnerets Hav og Jordan. Ezekiel, der udstikker landet for de genoprettede stammer, bruger det samme mærke: nordgrænsen når Hasar-Enan, »Damaskus's Landemærke«, med Hamat bagved, og Dans andel ligger langs den. Stedet er en grænsesten i en liste og intet mere; ingen begivenhed finder sted der."
    - "Hvor det stod, afhænger af, hvor langt mod nord man trækker grænsen. Hvis Lebo-Hamat er Beqaa-dalen nord for Baalbek og Sedad landsbyen Sadad sydøst for Homs, søges Hasar-Enan sædvanligvis ved al-Qaryatayn, oasen på ørkenvejen fra Damaskus til Palmyra, hvis kilde passer til navnet, og hvis placering markerer, hvor Hamats og Damaskus' bebyggede land møder steppen. De, der læser grænsen snævrere, med Lebo-Hamat nær Jordans kilder, søger i stedet Hasar-Enan ved foden af Hermon, ved Hadar eller Banias. Intet af stederne har givet noget, der afgør sagen."
    - "Al-Qaryatayn er i dag en by i Homs-guvernementet i Syrien i udkanten af den syriske ørken, længe kendt for Mar Elian-klosteret, som blev ødelagt i 2015 under den syriske krig."
  sr:
    - "Асаренан, „двор извора“, је североисточни угао земље обећане Израиљу. У опису граница датом Мојсију северна линија иде од Великог мора поред горе Ора и Улаза у Емат до Седада и Зефрона, „и крај нека јој буде код села Енана, то да вам буде северна међа“, а источна граница се затим повлачи „од села Енана до Сефама“ и доле до мора Кинерет и Јордана. Језекиљ, излажући земљу обновљених племена, користи исти знак: северна граница досеже Асаренан, „међа дамаштанска“, а Емат иза ње, а Данов део лежи уз њу. Место је међни камен на списку и ништа више; тамо се не догађа ништа."
    - "Где је стајао, зависи од тога колико се далеко на север повуче граница. Ако је Улаз у Емат долина Бекаа северно од Баалбека, а Седад село Садад југоисточно од Хомса, Асаренан се обично тражи у Ел-Карјатејну, оази на пустињском путу од Дамаска до Палмире, чији извор одговара имену и чији положај означава где се насељена земља Емата и Дамаска среће са степом. Они који границу читају уже, са Улазом у Емат близу извора Јордана, траже Асаренан уместо тога у подножју Хермона, у Хадару или Банијасу. Ни једно налазиште није дало ништа што би питање решило."
    - "Ел-Карјатејн је данас град у гувернорату Хомс у Сирији на ободу сиријске пустиње, дуго познат по манастиру Мар Елијан, који је разорен 2015. током сиријског рата."
  hu:
    - "Hácar-Énán, „a forrás kerítése”, az Izráelnek ígért föld északkeleti sarka. A Mózesnek adott határleírásban az északi vonal a Nagy-tengertől a Hór-hegy és Lebó-Hamát mellett Cedádig és Zifrónig fut, „a vége pedig Haczar-Enán legyen. Ez legyen néktek az északi határotok”, a keleti határt pedig „vonjátok Haczar-Enántól Sefámig”, majd le a Kinneret-tengerig és a Jordánig. Ezékiel a helyreállított törzsek földjét kijelölve ugyanezt a jelet használja: az északi határ eléri Hácar-Énánt, „Damaskus határán”, Hamáton túl, és Dán része mellette fekszik. A hely határkő egy jegyzékben, és nem több; semmi sem történik ott."
    - "Hogy hol állt, attól függ, milyen messze északra húzzuk a határt. Ha Lebó-Hamát a Baalbektől északra fekvő Beqaa-völgy, Cedád pedig a Homsztól délkeletre fekvő Szadád falu, akkor Hácar-Énánt rendszerint al-Qarjatajnban keresik, a Damaszkuszt Palmürával összekötő sivatagi út oázisában, amelynek forrása illik a névhez, helye pedig ott jelöli meg Hamát és Damaszkusz művelt földjének a sztyeppével való találkozását. Akik a határt szűkebben olvassák, Lebó-Hamáttal a Jordán forrásai közelében, Hácar-Énánt inkább a Hermon-hegy lábánál keresik, Hadarnál vagy Baniásznál. Egyik hely sem hozott semmit, ami eldöntené a kérdést."
    - "Al-Qarjatajn ma Szíria Homsz kormányzóságának városa a szíriai sivatag szélén, régóta ismert a Mar Elián-kolostorról, amelyet 2015-ben a szíriai háború alatt elpusztítottak."
  fi:
    - "Hasar-Enan, ”lähteen aitaus”, on Israelille luvatun maan koillinen kulma. Mooseksen saamassa rajojen kuvauksessa pohjoislinja kulkee Suuresta merestä Horinvuoren ja Lebo-Hamatin ohi Sedadiin ja Sifroniin, ”päättyköön Hasar-Eenaniin. Tämä olkoon pohjoisena rajananne”, ja itäraja vedetään sitten ”Hasar-Eenanista Sefamiin” ja alas Kinnerethin merelle ja Jordanille. Hesekiel, joka jakaa palautettujen heimojen maata, käyttää samaa merkkiä: pohjoisraja ulottuu Hasar-Enaniin, ”Damaskon alue jää pohjoiseen ja pohjoiseen myös Hamatin alue”, ja Danin osuus on sen vieressä. Paikka on rajakivi luettelossa eikä muuta; mitään tapahtumaa ei sillä ole."
    - "Missä se sijaitsi, riippuu siitä, kuinka pohjoiseen rajan vetää. Jos Lebo-Hamat on Beqaan laakso Baalbekista pohjoiseen ja Sedad Sadadin kylä Homsista kaakkoon, Hasar-Enania etsitään yleensä al-Qaryatayn, keitaasta Damaskoksesta Palmyraan johtavan aavikkotien varrella, jonka lähde sopii nimeen ja jonka paikka merkitsee kohtaa, jossa Hamatin ja Damaskoksen asuttu maa kohtaa aron. Ne, jotka lukevat rajan kapeammin ja sijoittavat Lebo-Hamatin Jordanin lähteiden lähelle, etsivät Hasar-Enania sen sijaan Hermonvuoren juurelta, Hadarista tai Baniasista. Kumpikaan paikka ei ole tuottanut mitään, mikä ratkaisisi asian."
    - "Al-Qaryatayn on nykyään kaupunki Syyrian Homsin kuvernementissa Syyrian aavikon reunalla, pitkään tunnettu Mar Elianin luostarista, joka tuhottiin vuonna 2015 Syyrian sodan aikana."
  vi:
    - "Hát-sa-Ê-nan, “vòng rào của suối”, là góc đông bắc của xứ hứa cho Y-sơ-ra-ên. Trong phần mô tả các ranh giới ban cho Môi-se, đường ranh phía bắc chạy từ Biển Lớn qua Núi Hô-rơ và Cửa vào Ha-mát đến Xê-đát và Xíp-rôn, “Giới hạn sẽ chạy về hướng Xíp-rôn và ăn cuối Hát-sa-Ê-nan, đó là giới hạn của các ngươi về phía Bắc”, và ranh phía đông sau đó được vẽ “từ Hát-sa-Ê-nan tới Sê-pham” rồi xuống biển Ki-nê-rết và sông Giô-đanh. Ê-xê-chi-ên, khi vạch xứ của các chi phái được phục hồi, dùng cùng mốc ấy: ranh phía bắc đến Hát-sa-Ê-nan, “bờ cõi Đa-mách”, với Ha-mát ở xa hơn, và phần của Đan nằm dọc theo đó. Nơi này là một mốc ranh trong một bảng kê và không hơn; không có sự kiện nào xảy ra ở đó."
    - "Nơi này ở đâu tùy vào việc vẽ ranh xa về phía bắc đến đâu. Nếu Cửa vào Ha-mát là thung lũng Beqaa phía bắc Baalbek và Xê-đát là làng Sadad phía đông nam Homs, thì Hát-sa-Ê-nan thường được tìm ở al-Qaryatayn, ốc đảo trên đường sa mạc từ Đa-mách đến Palmyra, có suối khớp với tên và vị trí đánh dấu nơi xứ định cư của Ha-mát và Đa-mách gặp thảo nguyên. Những ai đọc ranh giới hẹp hơn, với Cửa vào Ha-mát gần nguồn sông Giô-đanh, thì tìm Hát-sa-Ê-nan ở chân Núi Hẹt-môn, tại Hadar hay Banias. Không địa điểm nào cho điều gì quyết định được vấn đề."
    - "Al-Qaryatayn ngày nay là một thị trấn thuộc tỉnh Homs của Sy-ri ở rìa sa mạc Sy-ri, từ lâu nổi tiếng với tu viện Mar Elian, bị phá hủy năm 2015 trong cuộc chiến Sy-ri."
  ro:
    - "Hațar-Enan, „curtea izvorului”, este colțul nord-estic al țării făgăduite lui Israel. În descrierea hotarelor dată lui Moise, linia de nord merge de la Marea cea Mare pe lângă Muntele Hor și Intrarea Hamatului până la Țedad și Zifron, „va fi sfârșitul lui la Arsenain”, iar hotarul de est este apoi tras „dela Arsenain la Sepfamar” și în jos spre marea Chineret și Iordan. Ezechiel, când împarte țara triburilor restaurate, folosește același reper: hotarul de nord ajunge la Hațar-Enan, hotarul Damascului, cu Hamatul dincolo, iar partea lui Dan se întinde de-a lungul lui. Locul este o piatră de hotar dintr-o listă și nimic mai mult; nu se petrece nimic acolo."
    - "Unde se afla depinde de cât de departe spre nord se trage hotarul. Dacă Intrarea Hamatului este valea Bekaa la nord de Baalbek, iar Țedad satul Sadad la sud-est de Homs, Hațar-Enan este căutat de obicei la al-Qaryatayn, oaza de pe drumul prin deșert de la Damasc la Palmira, al cărei izvor se potrivește numelui și a cărei poziție marchează unde ținutul așezat al Hamatului și al Damascului întâlnește stepa. Cei care citesc hotarul mai îngust, cu Intrarea Hamatului lângă izvoarele Iordanului, caută în schimb Hațar-Enan la poalele Muntelui Hermon, la Hadar sau Banias. Niciunul dintre locuri nu a dat ceva care să lămurească chestiunea."
    - "Al-Qaryatayn este astăzi un oraș din guvernoratul Homs din Siria, la marginea deșertului sirian, mult timp cunoscut pentru mănăstirea Mar Elian, distrusă în 2015 în timpul războiului sirian."
  bg:
    - "Хацар-Енан, „ограда на извора“, е североизточният ъгъл на земята, обещана на Израил. В описанието на границите, дадено на Мойсей, северната линия върви от Голямото море покрай планината Хор и Входа на Емат до Цедад и Цифрон, „и ще излазя до Асаренан: този ще ви бъде северен предел“, а източната граница после се прокарва „от Асаренан до Шефам“ и надолу до море Кинерет и Йордан. Йезекиил, разпределяйки земята на възстановените племена, използва същия белег: северната граница стига до Хацар-Енан, „пределът на Дамаск“, с Емат отвъд, а делът на Дан лежи покрай нея. Мястото е граничен камък в списък и нищо повече; там не се случва никакво събитие."
    - "Къде е стояло, зависи от това колко на север се прокарва границата. Ако Входът на Емат е долината Бекаа северно от Баалбек, а Цедад — село Садад югоизточно от Хомс, Хацар-Енан обикновено се търси в ал-Карятейн, оазиса на пустинния път от Дамаск за Палмира, чийто извор отговаря на името и чието положение бележи мястото, където обработваната земя на Емат и Дамаск се среща със степта. Онези, които четат границата по-тясно, с Входа на Емат близо до изворите на Йордан, търсят вместо това Хацар-Енан в подножието на Ермон, при Хадар или Банияс. Никое от местата не е дало нещо, което да реши въпроса."
    - "Ал-Карятейн днес е град в губернаторство Хомс в Сирия на края на Сирийската пустиня, дълго известен с манастира „Мар Елиан“, разрушен през 2015 г. по време на войната в Сирия."
