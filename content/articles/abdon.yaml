# Overview article (ADR 0007). Mainstream facts only; a minor Levitical town known from two lists; the Ebron of Joshua 19 is given as probably, not certainly, the same place; the site is surveyed, not excavated.
id: abdon
place: a72a1ff
title:
  en: "Abdon"
  ru: "Авдон"
body:
  en:
    - "Abdon was a town of the tribe of Asher in the hills of western Galilee, one of the four towns Asher gave to the Levites of the family of Gershon: “out of the tribe of Asher, Mishal with her suburbs, Abdon with her suburbs”. Chronicles repeats the list. The roll of Asher's own towns in Joshua 19 has no Abdon but names Hebron (Ebron) beside Rehob, and since the Hebrew letters d and r are easily confused, most readers take that Ebron to be the same place. The town is identified with Khirbet Abdeh, now Tel Avdon, a mound above the Kziv stream about 6 km inland from Achzib on the coast, which keeps the name; surveys report pottery of the Bronze and Iron Ages, but the mound has not been excavated."
    - "That is the whole record: two Levitical lists and, probably, one line of a boundary list. No event is set there and no later writer names it. The mound lies today in the Western Galilee of Israel beside the moshav Avdon, which is named after it, above the Nahal Kziv nature reserve."
  ru:
    - "Авдон — город колена Асирова в горах западной Галилеи, один из четырёх городов, которые Асир отдал левитам из рода Гирсона: «от колена Асирова: Мишал и предместья его, Авдон и предместья его». Паралипоменон повторяет этот список. В перечне собственных городов Асира в 19-й главе книги Иисуса Навина Авдона нет, но рядом с Реховом назван Еврон, и, поскольку еврейские буквы «д» и «р» легко спутать, большинство читателей считает тот Еврон тем же городом. Город отождествляют с Хирбет-Абде, ныне Тель-Авдон, холмом над потоком Кзив примерно в 6 км от прибрежного Ахзива, сохранившим имя; обследования отмечают керамику бронзового и железного веков, но раскопок на холме не было."
    - "Это вся запись: два списка левитских городов и, вероятно, одна строка в описании границ. Никакое событие там не происходит, и никто из поздних писателей его не называет. Холм лежит сегодня в Западной Галилее в Израиле рядом с мошавом Авдон, названным по нему, над заповедником Нахаль-Кзив."
scripture:
