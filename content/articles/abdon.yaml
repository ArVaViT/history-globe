body:
  en:
    - "Abdon was a town of the tribe of Asher in the hills of western Galilee, one of the four towns Asher gave to the Levites of the family of Gershon: “out of the tribe of Asher, Mishal with her suburbs, Abdon with her suburbs”. Chronicles repeats the list. The roll of Asher's own towns in Joshua 19 has no Abdon but names Hebron (Ebron) beside Rehob, and since the Hebrew letters d and r are easily confused, most readers take that Ebron to be the same place. The town is identified with Khirbet Abdeh, now Tel Avdon, a mound above the Kziv stream about 6 km inland from Achzib on the coast, which keeps the name; surveys report pottery of the Bronze and Iron Ages, but the mound has not been excavated."
    - "That is the whole record: two Levitical lists and, probably, one line of a boundary list. No event is set there, and Eusebius' Onomasticon only repeats it as a Levitical town of Asher. The mound lies today in the Western Galilee of Israel beside the moshav Avdon, which is named after it, above the Nahal Kziv nature reserve."
  ru:
    - "Авдон — город колена Асирова в горах западной Галилеи, один из четырёх городов, которые Асир отдал левитам из рода Гирсона: «от колена Асирова: Мишал и предместья его, Авдон и предместья его». Паралипоменон повторяет этот список. В перечне собственных городов Асира в 19-й главе книги Иисуса Навина Авдона нет, но рядом с Реховом назван Еврон, и, поскольку еврейские буквы «д» и «р» легко спутать, большинство читателей считает тот Еврон тем же городом. Город отождествляют с Хирбет-Абде, ныне Тель-Авдон, холмом над потоком Кзив примерно в 6 км от прибрежного Ахзива, сохранившим имя; обследования отмечают керамику бронзового и железного веков, но раскопок на холме не было."
    - "Это вся запись: два списка левитских городов и, вероятно, одна строка в описании границ. Никакое событие там не происходит, а «Ономастикон» Евсевия лишь повторяет его как левитский город Асира. Холм лежит сегодня в Западной Галилее в Израиле рядом с мошавом Авдон, названным по нему, над заповедником Нахаль-Кзив."
  uk:
    - "Авдон був містом племені Асір у пагорбах західної Галілеї, одним із чотирьох міст, які Асір віддав левітам роду Гершомового: «від поколїння Ассерового: Мишал укупі з пасовищами його, та Абдон і передмістя його». Хроніки повторюють цей перелік. У переліку власних міст Асіра в Ісусі Навині 19 Авдона немає, але названо Хеврон (Еврон) поряд із Реховом, і оскільки єврейські літери «д» і «р» легко сплутати, більшість дослідників вважає цей Еврон тим самим місцем. Місто ототожнюють із Хірбет-Абдою, нині Тель-Авдон, пагорбом над потоком Кзів приблизно за 6 км углиб суходолу від Ахзіва на узбережжі, який зберігає цю назву; розвідки виявили кераміку бронзової та залізної доби, але пагорб не розкопували."
    - "Ось і весь запис: два левітські переліки та, ймовірно, один рядок прикордонного переліку. Жодної події з ним не пов'язано, а «Ономастикон» Євсевія лише повторює його як левітське місто Асіра. Нині пагорб лежить у Західній Галілеї в Ізраїлі біля мошава Авдон, названого на його честь, над природним заповідником Нахаль-Кзів."
  es:
    - "Abdón era una ciudad de la tribu de Aser en las colinas de la Galilea occidental, una de las cuatro ciudades que Aser dio a los levitas de la familia de Gersón: «de la tribu de Aser, á Miseal con sus ejidos, á Abdón con sus ejidos». Las Crónicas repiten la lista. El registro de las ciudades propias de Aser en Josué 19 no menciona Abdón, pero nombra Hebrón (Ebrón) junto a Rehob; y como las letras hebreas d y r se confunden con facilidad, la mayoría de los estudiosos considera que ese Ebrón es el mismo lugar. La ciudad se identifica con Khirbet Abdeh, hoy Tel Avdon, un montículo sobre el arroyo Kziv, a unos 6 km tierra adentro de Aczib, en la costa, que conserva el nombre; las prospecciones señalan cerámica de las edades del Bronce y del Hierro, pero el montículo no ha sido excavado."
    - "Eso es todo el testimonio: dos listas levíticas y, probablemente, una línea de una lista de fronteras. Ningún suceso se sitúa allí, y el Onomasticón de Eusebio solo la repite como ciudad levítica de Aser. Hoy el montículo se encuentra en la Galilea Occidental de Israel, junto al moshav Avdon, que lleva su nombre, sobre la reserva natural de Nahal Kziv."
  pt:
    - "Abdom era uma cidade da tribo de Aser, nas colinas da Galileia ocidental, uma das quatro cidades que Aser deu aos levitas da família de Gérson: “Da tribo de Aser, Misal com suas pastagens, Abdom com suas pastagens”. Crônicas repete a lista. O rol das cidades do próprio Aser em Josué 19 não tem Abdom, mas nomeia Hebrom (Ebrom) ao lado de Reobe, e, como as letras hebraicas d e r se confundem com facilidade, a maioria dos estudiosos toma esse Ebrom pelo mesmo lugar. A cidade é identificada com Khirbet Abdeh, hoje Tel Avdon, um montículo acima do riacho Kziv, a cerca de 6 km para o interior de Aczibe, na costa, que conserva o nome; levantamentos registram cerâmica das Idades do Bronze e do Ferro, mas o montículo não foi escavado."
    - "Esse é todo o registro: duas listas levíticas e, provavelmente, uma linha de uma lista de fronteiras. Nenhum acontecimento se situa ali, e o Onomástico de Eusébio apenas a repete como cidade levítica de Aser. Hoje o montículo fica na Galileia Ocidental de Israel, junto ao moshav Avdon, que tem o seu nome, acima da reserva natural de Nahal Kziv."
  de:
    - "Abdon war eine Stadt des Stammes Asser im Bergland Westgaliläas, eine der vier Städte, die Asser den Leviten aus dem Geschlecht Gerschons gab: „Von dem Stamm Asser vier Städte: Miseal und seine Vorstädte, Abdon und seine Vorstädte“. Die Chronik wiederholt die Liste. Die Aufzählung der Städte Assers in Josua 19 kennt kein Abdon, nennt aber Hebron (Ebron) neben Rehob, und da die hebräischen Buchstaben d und r leicht verwechselt werden, halten die meisten Ausleger dieses Ebron für denselben Ort. Die Stadt wird mit Chirbet Abde gleichgesetzt, dem heutigen Tel Avdon, einem Hügel über dem Bach Kziv, etwa 6 km landeinwärts von Achsib an der Küste, der den Namen bewahrt hat; Surveys melden Keramik der Bronze- und Eisenzeit, doch der Hügel wurde nicht ausgegraben."
    - "Das ist die ganze Überlieferung: zwei Levitenlisten und wahrscheinlich eine Zeile einer Grenzliste. Kein Ereignis wird dort berichtet, und das Onomastikon des Eusebius wiederholt den Ort nur als Levitenstadt Assers. Der Hügel liegt heute im israelischen Westgaliläa neben dem nach ihm benannten Moschaw Avdon, oberhalb des Naturreservats Nahal Kziv."
  fr:
    - "Abdon était une ville de la tribu d’Aser, dans les collines de la Galilée occidentale, l’une des quatre villes qu’Aser donna aux lévites de la famille de Guerschon : « de la tribu d’Aser, Mischeal et sa banlieue, Abdon et sa banlieue ». Les Chroniques reprennent la liste. Le registre des villes propres d’Aser en Josué 19 ne contient pas Abdon, mais nomme Hébron (Ébron) à côté de Rehob ; comme les lettres hébraïques d et r se confondent aisément, la plupart des lecteurs tiennent cet Ébron pour le même lieu. La ville est identifiée à Khirbet Abdeh, aujourd’hui Tel Avdon, un tertre qui domine le ruisseau Kziv, à environ 6 km à l’intérieur des terres depuis Aczib, sur la côte, et qui a gardé le nom ; les prospections signalent de la céramique des âges du Bronze et du Fer, mais le tertre n’a pas été fouillé."
    - "Voilà tout le dossier : deux listes lévitiques et, probablement, une ligne d’une liste de frontières. Aucun événement n’y est situé, et l’Onomasticon d’Eusèbe ne fait que la reprendre comme ville lévitique d’Aser. Le tertre se trouve aujourd’hui en Galilée occidentale, en Israël, à côté du moshav Avdon, qui porte son nom, au-dessus de la réserve naturelle du Nahal Kziv."
  it:
    - "Abdon era una città della tribù di Aser sulle colline della Galilea occidentale, una delle quattro città che Aser diede ai leviti della famiglia di Gherson: «della tribù di Ascer, Misceal e il suo contado, Abdon e il suo contado». Le Cronache ripetono l’elenco. L’elenco delle città di Aser in Giosuè 19 non ha Abdon ma nomina Ebron accanto a Recob, e poiché le lettere ebraiche d ed r si confondono facilmente, la maggior parte degli studiosi ritiene che quell’Ebron sia lo stesso luogo. La città è identificata con Khirbet Abdeh, oggi Tel Avdon, un tell sopra il torrente Kziv, a circa 6 km nell’entroterra da Aczib sulla costa, che ne conserva il nome; le ricognizioni segnalano ceramica dell’età del Bronzo e del Ferro, ma il tell non è stato scavato."
    - "Questa è l’intera documentazione: due elenchi levitici e, probabilmente, una riga di un elenco di confini. Nessun avvenimento vi è collocato, e l’Onomasticon di Eusebio la ripete soltanto come città levitica di Aser. Il tell si trova oggi nella Galilea occidentale di Israele, accanto al moshav Avdon, che da esso prende il nome, sopra la riserva naturale del Nahal Kziv."
  pl:
    - "Abdon było miastem pokolenia Aszera na wzgórzach zachodniej Galilei, jednym z czterech miast, które Aszer oddał lewitom z rodu Gerszona: „A z pokolenia Aser: Masaa i przedmieścia jego; Abdon i przedmieścia jego”. Księga Kronik powtarza ten wykaz. Spis własnych miast Aszera w Joz 19 nie zna Abdonu, lecz wymienia Hebron (Ebron) obok Rechobu, a ponieważ hebrajskie litery d i r łatwo pomylić, większość badaczy uważa ten Ebron za to samo miejsce. Utożsamia się je z Chirbet Abdeh, dziś Tel Awdon, tellem nad strumieniem Kziw, około 6 km w głąb lądu od Akzibu na wybrzeżu, który zachował nazwę; badania powierzchniowe wskazują ceramikę z epoki brązu i żelaza, lecz tell nie był wykopywany."
    - "To cały zapis: dwa wykazy lewickie i, prawdopodobnie, jeden wiersz wykazu granic. Nie osadzono tam żadnego wydarzenia, a Onomastykon Euzebiusza jedynie powtarza je jako lewickie miasto Aszera. Tell leży dziś w Zachodniej Galilei w Izraelu obok moszawu Awdon, nazwanego od niego, nad rezerwatem przyrody Nachal Kziw."
  nl:
    - "Abdon was een stad van de stam Aser in de heuvels van West-Galilea, een van de vier steden die Aser aan de Levieten van het geslacht Gerson gaf: “van den stam van Aser, Misal en haar voorsteden, Abdon en haar voorsteden”. Kronieken herhaalt de lijst. De opsomming van Asers eigen steden in Jozua 19 kent geen Abdon, maar noemt Hebron (Ebron) naast Rechob; omdat de Hebreeuwse letters d en r gemakkelijk verward worden, houden de meeste lezers die Ebron voor dezelfde plaats. De stad wordt geïdentificeerd met Khirbet Abdeh, nu Tel Avdon, een heuvel boven de beek Kziv, ongeveer 6 km landinwaarts van Achzib aan de kust, die de naam bewaart; opgravingen zijn er niet verricht, maar verkenningen melden aardewerk uit de bronstijd en de ijzertijd."
    - "Dat is het hele bericht: twee lijsten van levietensteden en waarschijnlijk één regel van een grenslijst. Er wordt geen gebeurtenis gesitueerd, en het Onomasticon van Eusebius herhaalt de plaats alleen als levietenstad van Aser. De heuvel ligt tegenwoordig in West-Galilea in Israël, naast de moshav Avdon, die naar haar is genoemd, boven het natuurreservaat Nahal Kziv."
  cs:
    - "Abdón bylo město kmene Ašer v pahorkatině západní Galileje, jedno ze čtyř měst, která Ašer dal levitům z rodu Geršonova: „Z pokolení pak Asserova: Mesal a předměstí jeho, též Abdon a podměstí jeho“. Letopisy seznam opakují. Soupis vlastních měst Ašerových v Jozue 19 Abdón nemá, ale uvádí Hebron (Ebron) vedle Rechobu, a protože se hebrejská písmena d a r snadno zaměňují, pokládá většina badatelů tento Ebron za totéž místo. Město se ztotožňuje s Chirbet Abdeh, dnešním Tel Avdon, pahorkem nad potokem Kziv asi 6 km ve vnitrozemí od Achzívu na pobřeží, který si jméno uchoval; průzkumy uvádějí keramiku z doby bronzové a železné, pahorek však nebyl vykopán."
    - "To je celý záznam: dva levitské seznamy a pravděpodobně jeden řádek seznamu hranic. Nic se tam neodehrálo a Eusebiův Onomastikon je jen opakuje jako levitské město Ašerovo. Pahorek leží dnes v Západní Galileji v Izraeli vedle mošavu Avdon, který je po něm pojmenován, nad přírodní rezervací Nachal Kziv."
  sv:
    - "Avdon var en stad i Ashers stam i kullarna i västra Galileen, en av de fyra städer som Asher gav åt leviterna av Gershons släkt: ”ur Asers stam Miseal med dess utmarker, Abdon med dess utmarker”. Krönikeböckerna upprepar förteckningen. Förteckningen över Ashers egna städer i Josua 19 har inget Avdon men nämner Hebron (Evron) bredvid Rehov, och eftersom de hebreiska bokstäverna d och r lätt förväxlas anser de flesta att detta Evron är samma ort. Staden identifieras med Khirbet Abdeh, nu Tel Avdon, en kulle ovanför bäcken Kziv omkring 6 km inåt land från Aksiv vid kusten, som har behållit namnet; undersökningar redovisar keramik från brons- och järnåldern, men kullen har inte grävts ut."
    - "Det är hela uppgiften: två levitiska förteckningar och, sannolikt, en rad i en gränsbeskrivning. Ingen händelse förläggs dit, och Eusebios Onomastikon upprepar bara att det är en levitisk stad i Asher. Kullen ligger i dag i Västra Galileen i Israel invid moshaven Avdon, som har fått sitt namn efter den, ovanför naturreservatet Nahal Kziv."
  nb:
    - "Abdon var en by i Asjers stamme i åsene i Vest-Galilea, en av de fire byene Asjer ga til levittene av Gersjons ætt: «av Asers stamme: Misal med jorder, Abdon med jorder». Krønikebøkene gjentar listen. Oversikten over Asjers egne byer i Josva 19 har ingen Abdon, men nevner Ebron ved siden av Rehob, og siden de hebraiske bokstavene d og r lett forveksles, regner de fleste at denne Ebron er det samme stedet. Byen identifiseres med Khirbet Abdeh, nå Tel Avdon, en tell over bekken Kziv omtrent 6 km inne i landet fra Aksib ved kysten, som har bevart navnet; undersøkelser melder om keramikk fra bronse- og jernalderen, men tellen er ikke gravd ut."
    - "Det er hele beretningen: to levittlister og, trolig, én linje i en grenseliste. Ingen hendelse er knyttet til stedet, og Eusebius' Onomasticon gjentar bare at det var en levittby i Asjer. Tellen ligger i dag i Vest-Galilea i Israel ved moshaven Avdon, som er oppkalt etter den, over naturreservatet Nahal Kziv."
  tl:
    - "Ang Abdon ay bayan ng lipi ni Aser sa mga burol ng kanlurang Galilea, isa sa apat na bayang ibinigay ni Aser sa mga Levita ng angkan ni Gerson: “sa lipi ni Aser, ang Miseal pati ng mga nayon niyaon, ang Abdon pati ng mga nayon niyaon”. Inuulit ng Mga Cronica ang talaan. Ang talaan ng sariling mga bayan ni Aser sa Josue 19 ay walang Abdon ngunit binabanggit ang Hebron (Ebron) sa tabi ng Rehob, at yamang madaling mapagkamalan ang mga titik na Hebreong d at r, itinuturing ng karamihan na iisang lugar ang Ebron na iyon. Natutukoy ang bayan sa Khirbet Abdeh, na ngayo'y Tel Avdon, isang burol sa itaas ng batis ng Kziv na mga 6 km sa loob ng lupain mula sa Achzib sa baybayin, na nagtataglay pa ng pangalan; may ulat ang mga sarbey ng mga palayok ng Panahon ng Tanso at Panahon ng Bakal, ngunit hindi pa nahuhukay ang burol."
    - "Iyon na ang buong tala: dalawang talaan ng mga Levita at, marahil, isang linya ng talaan ng hangganan. Walang pangyayaring itinatakda roon, at inuulit lamang ng Onomasticon ni Eusebio na isa itong bayan ng mga Levita sa Aser. Ang burol ay nasa ngayo'y Kanlurang Galilea ng Israel sa tabi ng moshav na Avdon, na ipinangalan dito, sa itaas ng reserbang pangkalikasan ng Nahal Kziv."
