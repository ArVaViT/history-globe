# Overview article (ADR 0007). Mainstream facts only; Kehelathah is known only from Numbers 33; the link with Makheloth and the Kuntillet Ajrud proposal are given as proposals.
id: kehelathah
place: a32d25a
title:
  en: "Kehelathah"
  ru: "Кегелафа"
  uk: "Кегелата"
  es: "Ceelata"
  pt: "Queelata"
  de: "Kehelata"
  fr: "Kehélatha"
body:
  en:
    - "Kehelathah is a camp of Israel in the wilderness, named only in the list of stations in Numbers 33: “And they journeyed from Rissah, and pitched in Kehelathah. And they went from Kehelathah, and pitched in mount Shapher.” No event is told of it. The name comes from the Hebrew root of “assembly”, the same root as Makheloth, “assemblies”, three stations further on, and some scholars think the two names may be one place counted twice or two camps of a similar kind."
    - "Its site is unknown. The map follows the view that it is the same place as Makheloth, and so shows it where Makheloth is placed, at Kuntillet Ajrud, a hilltop in the north-eastern Sinai on the road from Gaza to the Gulf of Aqaba, known for a way station of about 800 BC whose inscriptions bless in the name of Yahweh “and his Asherah”. That station is far later than any date given for the wanderings, and the link with either station rests on the line of the route alone. Nothing more is known."
  ru:
    - "Кегелафа — стан Израиля в пустыне, названный только в списке стоянок в книге Чисел: «И отправились из Риссы и расположились станом в Кегелафе. И отправились из Кегелафы и расположились станом на горе Шафер». Никакого события о нём не рассказано. Имя происходит от еврейского корня со значением «собрание», того же, что и Макелоф, «собрания», тремя стоянками дальше, и некоторые исследователи думают, что это одно место, посчитанное дважды, или два сходных стана."
    - "Где он был, неизвестно. Карта следует мнению, что это то же место, что и Макелоф, и потому показывает его там же, где Макелоф, — в Кунтиллет-Аджруде, на холме в северо-восточном Синае на дороге из Газы к заливу Акаба, известном придорожной станцией около 800 г. до н. э., надписи которой благословляют именем Яхве «и его Ашеры». Эта станция намного позже любой даты, которую дают странствиям, и связь с любой из этих стоянок держится лишь на направлении пути. Больше ничего не известно."
  uk:
    - "Кегелата — табір Ізраїлю в пустелі, названий лише в переліку стоянок у Книзі Чисел, розділ 33: «І рушили з Рисси та й отаборились у Кегелатї. І рушили з Кегелата та й отаборились під Шефер горою.» Про жодну подію там не розповідається. Назва походить від староєврейського кореня зі значенням «збір», того самого, що й у Макелоті, «збори», яка лежить трьома стоянками далі, і деякі вчені гадають, що ці дві назви можуть позначати одне місце, пораховане двічі, або два табори схожого роду."
    - "Місце його невідоме. Мапа спирається на погляд, що воно збігається з Макелотом, і тому показує його там, де розміщено Макелот, — у Кунтіллет-Аджруді, на пагорбі на північному сході Синаю при дорозі від Гази до Акабської затоки, відомому придорожньою стоянкою близько 800 р. до н. е., чиї написи благословляють іменем Яхве «та його Ашери». Ця стоянка набагато пізніша за будь-яку дату, що її називають для блукань, а зв’язок з обома стоянками тримається лише на лінії маршруту. Більше нічого не відомо."
  es:
    - "Ceelata es un campamento de Israel en el desierto, nombrado solo en la lista de estaciones de Números 33: «Y partidos de Rissa, asentaron en Ceelatha. Y partidos de Ceelatha, asentaron en el monte de Sepher». No se cuenta ningún suceso de ella. El nombre procede de la raíz hebrea de «asamblea», la misma de Maquelot, «asambleas», tres estaciones más adelante, y algunos estudiosos piensan que los dos nombres pueden designar un mismo lugar contado dos veces o dos campamentos de naturaleza semejante."
    - "Su emplazamiento se desconoce. El mapa sigue la opinión de que es el mismo lugar que Maquelot, y por eso la muestra donde se sitúa Maquelot, en Kuntillet Ajrud, una colina del nordeste del Sinaí, en el camino de Gaza al golfo de Aqaba, conocida por una estación de postas de hacia 800 a. C. cuyas inscripciones bendicen en nombre de Yahveh «y de su Asera». Esa estación es mucho más tardía que cualquier fecha propuesta para las peregrinaciones por el desierto, y la relación con una u otra estación descansa solo en el trazado de la ruta. No se sabe nada más."
  pt:
    - "Queelata é um acampamento de Israel no deserto, citado apenas na lista de etapas de Números 33: “Partiram de Rissa e acamparam em Queelata. Partiram de Queelata e acamparam no monte Sefer.” Nenhum acontecimento se conta a seu respeito. O nome vem da raiz hebraica de “assembleia”, a mesma de Maquelote, “assembleias”, três etapas adiante, e alguns estudiosos pensam que os dois nomes podem designar um só lugar contado duas vezes ou dois acampamentos de natureza semelhante."
    - "Seu sítio é desconhecido. O mapa segue a opinião de que é o mesmo lugar que Maquelote e, por isso, a mostra onde Maquelote é situada, em Kuntillet Ajrud, um cume no nordeste do Sinai, na estrada de Gaza ao golfo de Aqaba, conhecido por um posto de parada de cerca de 800 a.C. cujas inscrições abençoam em nome de Javé “e da sua Asherá”. Esse posto é muito posterior a qualquer data atribuída às peregrinações, e a ligação com qualquer das duas etapas repousa apenas no traçado da rota. Nada mais se sabe."
  de:
    - "Kehelata ist ein Lagerplatz Israels in der Wüste, nur in der Stationenliste von 4. Mose 33 genannt: „Von Rissa zogen sie aus und lagerten sich in Kehelatha. Von Kehelatha zogen sie aus und lagerten sich im Gebirge Sepher.“ Von keinem Ereignis wird dort erzählt. Der Name kommt von der hebräischen Wurzel für „Versammlung“, derselben Wurzel wie Makhelot, „Versammlungen“, drei Stationen weiter, und manche Gelehrte halten beide Namen für einen zweimal gezählten Ort oder für zwei Lager ähnlicher Art."
    - "Seine Lage ist unbekannt. Die Karte folgt der Ansicht, dass es derselbe Ort wie Makhelot ist, und zeigt es daher dort, wo Makhelot angesetzt wird, in Kuntillet Ajrud, einer Hügelkuppe im nordöstlichen Sinai an der Straße von Gaza zum Golf von Akaba, bekannt durch eine Karawanenstation von etwa 800 v. Chr., deren Inschriften im Namen Jahwes „und seiner Aschera“ segnen. Diese Station ist weit jünger als jede für die Wanderung genannte Datierung, und die Verbindung mit einer der beiden Stationen beruht allein auf dem Verlauf der Route. Mehr ist nicht bekannt."
  fr:
    - "Kehélatha est un campement d’Israël dans le désert, nommé seulement dans la liste des étapes de Nombres 33 : « Ils partirent de Rissa, et campèrent à Kehélatha. Ils partirent de Kehélatha, et campèrent à la montagne de Schapher. » Aucun événement n’y est raconté. Le nom vient de la racine hébraïque de « assemblée », la même que Makhéloth, « assemblées », trois étapes plus loin, et certains savants pensent que les deux noms désignent peut-être un même lieu compté deux fois, ou deux campements de même nature."
    - "Son emplacement est inconnu. La carte suit l’opinion qui y voit le même lieu que Makhéloth, et la montre donc là où Makhéloth est placée, à Kuntillet Ajrud, une colline du nord-est du Sinaï, sur la route de Gaza au golfe d’Aqaba, connue pour un relais d’environ 800 av. J.-C. dont les inscriptions bénissent au nom de Yahvé « et de son Ashéra ». Ce relais est bien postérieur à toute date proposée pour l’errance, et le lien avec l’une ou l’autre étape ne repose que sur le tracé de l’itinéraire. On n’en sait pas davantage."
scripture:
