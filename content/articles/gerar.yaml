# Overview article (ADR 0007). Mainstream facts only; Gerar = Tel Haror, the usual identification, with the earlier candidates named; Bronze Age dates follow the excavators.
id: gerar
place: a3f5814
title:
  en: "Gerar"
  ru: "Герар"
body:
  en:
    - "Gerar was a town of the western Negev, between Gaza and Beersheba. It is now usually identified with Tel Haror (Tell Abu Hureira), a large mound on the north bank of Nahal Gerar, a little over 20 km north-west of Beersheba. Yohanan Aharoni proposed the site in 1956; earlier scholars had looked to Tell Jemmeh or to Tell esh-Sharia nearby. Eliezer Oren of Ben-Gurion University excavated Tel Haror in the 1980s and early 1990s."
    - "In the Middle Bronze Age, in the seventeenth and sixteenth centuries BC, Tel Haror was one of the largest cities of southern Canaan, about 16 ha (40 acres), fortified with massive earthen ramparts and a deep moat. In its sacred precinct stood a temple of Syrian type, and around it were many pits of offerings, among them puppies and birds; a young donkey was buried there with a metal bit in its mouth and saddlebag fittings on its back. In the Iron Age Philistine pottery appears, and in the later Iron Age a strongly fortified town with a thick wall, glacis and towers stood on the upper mound until it was destroyed by fire."
    - 'In Genesis the border of the Canaanites ran "from Sidon, as thou comest to Gerar, unto Gaza". Abraham sojourned in Gerar; Abimelech, king of Gerar, took Sarah, whom Abraham had called his sister, but God warned him in a dream and he restored her. In a famine Isaac went "unto Abimelech king of the Philistines unto Gerar", said the same of Rebekah, and later dug wells in the valley of Gerar; the herdmen of Gerar strove with his herdmen over the wells Esek and Sitnah, but not over Rehoboth. Many scholars regard the Philistines of these stories as an anachronism. Much later Asa, king of Judah, pursued the army of Zerah the Ethiopian as far as Gerar and plundered all the cities round about it.'
    - "The name outlived the town and passed to the district around it. In the early fourth century AD Eusebius places Gerara twenty-five miles south of Eleutheropolis, calls it a royal city of the Philistines and the old southern boundary of the Canaanites, and says that the Geraritike, the region beyond the Daroma, is named after it. Sozomen, writing in the fifth century, tells that the monk Silvanus, who had lived in Egypt and at Mount Sinai, founded at Gerara, in the wadi, a very large and famous monastery."
  ru:
    - "Герар — город западного Негева, между Газой и Вирсавией. Сейчас его обычно отождествляют с Тель-Харором (Телль-Абу-Хурейрой) — большим холмом на северном берегу ручья Нахаль-Герар, чуть более чем в 20 км к северо-западу от Вирсавии. Это место предложил в 1956 г. Йоханан Аарони; прежде исследователи искали Герар на соседних холмах Телль-Джемме и Телль-эш-Шариа. В 1980-х и начале 1990-х гг. Тель-Харор раскапывал Элиэзер Орен из Университета имени Бен-Гуриона."
    - "В среднем бронзовом веке, в XVII–XVI веках до н. э., Тель-Харор был одним из крупнейших городов юга Ханаана — около 16 га (40 акров), с мощными земляными валами и глубоким рвом. В его священном участке стоял храм сирийского типа, а вокруг — множество ям с приношениями, среди которых были щенки и птицы; там же был погребён молодой осёл с металлическими удилами во рту и креплениями перемётных сум на спине. В железном веке появляется филистимская керамика, а в позднем железном веке на верхнем холме стоял сильно укреплённый город с толстой стеной, гласисом и башнями, пока его не уничтожил пожар."
    - "В книге Бытия пределы Хананеев шли «от Сидона к Герару до Газы». Авраам был на время в Гераре; Авимелех, царь Герарский, взял Сарру, которую Авраам назвал своей сестрой, но Бог предостерёг его во сне, и он возвратил её. Во время голода Исаак пошёл «к Авимелеху, царю Филистимскому, в Герар», сказал то же о Ревекке, а позднее копал колодези в долине Герарской; пастухи Герарские спорили с пастухами Исаака о колодезях Есек и Ситна, но о Реховофе уже не спорили. Многие исследователи считают филистимлян в этих рассказах анахронизмом. Много позже Аса, царь Иудейский, преследовал войско Зарая Ефиоплянина до Герара и разграбил все города вокруг него."
    - "Имя пережило город и перешло на окрестную область. В начале IV века н. э. Евсевий помещает Герару в двадцати пяти милях к югу от Елевферополя, называет её царским городом филистимлян и древней южной границей Хананеев и говорит, что по ней названа Герарская область за Даромой. Созомен, писавший в V веке, рассказывает, что монах Сильван, живший прежде в Египте и на горе Синай, основал в Гераре, у потока, очень большой и знаменитый монастырь."
