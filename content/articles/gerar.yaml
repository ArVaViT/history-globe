body:
  en:
    - "Gerar was a town of the western Negev, between Gaza and Beersheba. It is now usually identified with Tel Haror (Tell Abu Hureira), a large mound on the north bank of Nahal Gerar, a little over 20 km north-west of Beersheba. Yohanan Aharoni proposed the site in 1956; earlier scholars had looked to Tell Jemmeh or to Tell esh-Sharia nearby. Eliezer Oren of Ben-Gurion University excavated Tel Haror in the 1980s and early 1990s."
    - "In the Middle Bronze Age, in the seventeenth and sixteenth centuries BC, Tel Haror was one of the largest cities of southern Canaan, about 16 ha (40 acres), fortified with massive earthen ramparts and a deep moat. In its sacred precinct stood a temple of Syrian type, and around it were many pits of offerings, among them puppies and birds; a young donkey was buried there with a metal bit in its mouth and saddlebag fittings on its back. In the Iron Age Philistine pottery appears, and in the later Iron Age a strongly fortified town with a thick wall, glacis and towers stood on the upper mound until it was destroyed by fire."
    - 'In Genesis the border of the Canaanites ran "from Sidon, as thou comest to Gerar, unto Gaza". Abraham sojourned in Gerar; Abimelech, king of Gerar, took Sarah, whom Abraham had called his sister, but God warned him in a dream and he restored her. In a famine Isaac went "unto Abimelech king of the Philistines unto Gerar", said the same of Rebekah, and later dug wells in the valley of Gerar; the herdmen of Gerar strove with his herdmen over the wells Esek and Sitnah, but not over Rehoboth. Many scholars regard the Philistines of these stories as an anachronism. Much later Asa, king of Judah, pursued the army of Zerah the Ethiopian as far as Gerar and plundered all the cities round about it.'
    - "The name outlived the town and passed to the district around it. In the early fourth century AD Eusebius places Gerara twenty-five miles south of Eleutheropolis, calls it a royal city of the Philistines and the old southern boundary of the Canaanites, and says that the Geraritike, the region beyond the Daroma, is named after it. Sozomen, writing in the fifth century, tells that the monk Silvanus, who had lived in Egypt and at Mount Sinai, founded at Gerara, in the wadi, a very large and famous monastery."
  ru:
    - "Герар — город западного Негева, между Газой и Вирсавией. Сейчас его обычно отождествляют с Тель-Харором (Телль-Абу-Хурейрой) — большим холмом на северном берегу ручья Нахаль-Герар, чуть более чем в 20 км к северо-западу от Вирсавии. Это место предложил в 1956 г. Йоханан Аарони; прежде исследователи искали Герар на соседних холмах Телль-Джемме и Телль-эш-Шариа. В 1980-х и начале 1990-х гг. Тель-Харор раскапывал Элиэзер Орен из Университета имени Бен-Гуриона."
    - "В среднем бронзовом веке, в XVII–XVI веках до н. э., Тель-Харор был одним из крупнейших городов юга Ханаана — около 16 га (40 акров), с мощными земляными валами и глубоким рвом. В его священном участке стоял храм сирийского типа, а вокруг — множество ям с приношениями, среди которых были щенки и птицы; там же был погребён молодой осёл с металлическими удилами во рту и креплениями перемётных сум на спине. В железном веке появляется филистимская керамика, а в позднем железном веке на верхнем холме стоял сильно укреплённый город с толстой стеной, гласисом и башнями, пока его не уничтожил пожар."
    - "В книге Бытия пределы Хананеев шли «от Сидона к Герару до Газы». Авраам был на время в Гераре; Авимелех, царь Герарский, взял Сарру, которую Авраам назвал своей сестрой, но Бог предостерёг его во сне, и он возвратил её. Во время голода Исаак пошёл «к Авимелеху, царю Филистимскому, в Герар», сказал то же о Ревекке, а позднее копал колодези в долине Герарской; пастухи Герарские спорили с пастухами Исаака о колодезях Есек и Ситна, но о Реховофе уже не спорили. Многие исследователи считают филистимлян в этих рассказах анахронизмом. Много позже Аса, царь Иудейский, преследовал войско Зарая Ефиоплянина до Герара и разграбил все города вокруг него."
    - "Имя пережило город и перешло на окрестную область. В начале IV века н. э. Евсевий помещает Герару в двадцати пяти милях к югу от Елевферополя, называет её царским городом филистимлян и древней южной границей Хананеев и говорит, что по ней названа Герарская область за Даромой. Созомен, писавший в V веке, рассказывает, что монах Сильван, живший прежде в Египте и на горе Синай, основал в Гераре, у потока, очень большой и знаменитый монастырь."
  uk:
    - "Герар було містом західного Негеву між Газою та Беер-Шевою. Його нині зазвичай ототожнюють із Тель-Харор (Телль-Абу-Хурейра) — великим городищем на північному березі Нахаль-Герар, трохи більше ніж за 20 км на північний захід від Беер-Шеви. Це місце 1956 року запропонував Йоханан Аароні; раніші дослідники шукали Телль-Джемму або Телль-еш-Шарію поблизу. Еліезер Орен з Університету Бен-Гуріона розкопував Тель-Харор у 1980-х і на початку 1990-х років."
    - "За доби середньої бронзи, у XVII–XVI ст. до н. е., Тель-Харор був одним із найбільших міст південного Ханаану, близько 16 га (40 акрів), укріпленим масивними земляними валами та глибоким ровом. У його священній ділянці стояв храм сирійського типу, а навколо нього було багато ям із дарами, серед них цуценята й птахи; там поховано молодого осла з металевими вудилами в роті й деталями в’ючного сідла на спині. За залізного віку з’являється філістимська кераміка, а в пізніший залізний вік на верхньому городищі стояло сильно укріплене місто з товстим муром, глясисом і вежами, доки його не зруйнувала пожежа."
    - "У Книзі Буття межа ханаанців проходила «від Сидону до Герару, до Гази». Авраам мешкав у Герарі; Авімелех, цар Герара, взяв Сарру, яку Авраам назвав своєю сестрою, але Бог попередив його вві сні, і він повернув її. Під час голоду Ісаак пішов «до Абимелеха, царя Филистимського, в Герар», те саме сказав про Ревеку й пізніше копав колодязі в долині Герара; пастухи Герара сварилися з його пастухами за колодязі Есек і Ситна, але не за Реховот. Багато дослідників уважають філістимлян цих оповідей анахронізмом. Набагато пізніше Аса, цар Юди, гнався за військом ефіопа Зераха аж до Герара й пограбував усі навколишні міста."
    - "Назва пережила місто й перейшла на навколишню округу. На початку IV ст. н. е. Євсевій розміщує Герару за двадцять п’ять миль на південь від Елевферополя, називає її царським містом філістимлян і давньою південною межею ханаанців та каже, що область Герарітіке, за Даромою, названа за нею. Созомен, який писав у V ст., розповідає, що чернець Сильван, який жив у Єгипті та на горі Синай, заснував у Герарі, у ваді, дуже великий і славний монастир."
  es:
    - "Gerar era una población del Négev occidental, entre Gaza y Beerseba. Hoy se identifica de ordinario con Tel Haror (Tell Abu Hureira), un gran montículo en la orilla norte del Nahal Gerar, a poco más de 20 km al noroeste de Beerseba. Yohanan Aharoni propuso el sitio en 1956; los estudiosos anteriores habían buscado en Tell Jemmeh o en el cercano Tell esh-Sharia. Eliezer Oren, de la Universidad Ben-Gurión, excavó Tel Haror en los años ochenta y a comienzos de los noventa."
    - "En la Edad del Bronce Medio, en los siglos XVII y XVI a. C., Tel Haror fue una de las mayores ciudades del sur de Canaán, de unas 16 ha (40 acres), fortificada con enormes terraplenes de tierra y un foso profundo. En su recinto sagrado se alzaba un templo de tipo sirio, y a su alrededor había muchas fosas de ofrendas, con cachorros y aves entre ellas; allí fue enterrado un asno joven con un bocado de metal en la boca y herrajes de alforjas sobre el lomo. En la Edad del Hierro aparece cerámica filistea, y en la Edad del Hierro tardía una ciudad fuertemente fortificada, con un muro grueso, glacis y torres, se alzó sobre el montículo superior hasta que fue destruida por el fuego."
    - "En el Génesis, el límite de los cananeos iba «desde Sidón, viniendo á Gerar hasta Gaza». Abraham habitó como forastero en Gerar; Abimelec, rey de Gerar, tomó a Sara, a quien Abraham había llamado su hermana, pero Dios le advirtió en sueños y la devolvió. En un tiempo de hambre Isaac fue «á Abimelech rey de los Filisteos, en Gerar», dijo lo mismo de Rebeca, y más tarde abrió pozos en el valle de Gerar; los pastores de Gerar riñeron con los suyos por los pozos Esec y Sitna, pero no por Rehobot. Muchos estudiosos consideran un anacronismo a los filisteos de estos relatos. Mucho después Asa, rey de Judá, persiguió al ejército de Zera el etíope hasta Gerar y saqueó todas las ciudades de alrededor."
    - "El nombre sobrevivió a la ciudad y pasó al distrito de su entorno. A comienzos del siglo IV d. C. Eusebio sitúa Gerara a veinticinco millas al sur de Eleuterópolis, la llama ciudad real de los filisteos y antiguo límite meridional de los cananeos, y dice que la Geraritike, la región más allá del Daroma, toma de ella su nombre. Sozomeno, que escribe en el siglo V, cuenta que el monje Silvano, que había vivido en Egipto y en el monte Sinaí, fundó en Gerara, en el wadi, un monasterio muy grande y famoso."
  pt:
    - "Gerar era uma cidade do Neguev ocidental, entre Gaza e Berseba. É hoje geralmente identificada com Tel Haror (Tell Abu Hureira), um grande monte na margem norte do Nahal Gerar, pouco mais de 20 km a noroeste de Berseba. Yohanan Aharoni propôs o sítio em 1956; estudiosos anteriores haviam procurado em Tell Jemmeh ou em Tell esh-Sharia, ali perto. Eliezer Oren, da Universidade Ben-Gurion, escavou Tel Haror na década de 1980 e no início da de 1990."
    - "Na Idade do Bronze Médio, nos séculos XVII e XVI a.C., Tel Haror era uma das maiores cidades do sul de Canaã, com cerca de 16 ha (40 acres), fortificada com maciços baluartes de terra e um fosso profundo. Em seu recinto sagrado erguia-se um templo de tipo sírio, e ao redor havia muitas covas de oferendas, entre elas de filhotes de cão e de aves; um jovem jumento foi sepultado ali com um freio de metal na boca e peças de alforje no dorso. Na Idade do Ferro surge cerâmica filisteia, e na Idade do Ferro posterior uma cidade fortemente fortificada, com muro espesso, glacis e torres, ergueu-se sobre o monte superior até ser destruída pelo fogo."
    - "Em Gênesis, a fronteira dos cananeus ia “desde Sidom — indo na direção de Gerar — até Gaza”. Abraão viveu como estrangeiro em Gerar; Abimeleque, rei de Gerar, tomou Sara, a quem Abraão chamara de sua irmã, mas Deus o advertiu num sonho e ele a devolveu. Numa fome, Isaque foi “a Abimeleque, rei dos filisteus, em Gerar”, disse o mesmo de Rebeca e depois cavou poços no vale de Gerar; os pastores de Gerar discutiram com os seus pastores por causa dos poços Eseque e Sitna, mas não por causa de Reobote. Muitos estudiosos consideram anacrônicos os filisteus dessas histórias. Muito mais tarde, Asa, rei de Judá, perseguiu o exército de Zera, o etíope, até Gerar e saqueou todas as cidades ao redor."
    - "O nome sobreviveu à cidade e passou à região em torno. No início do século IV d.C., Eusébio situa Gerara a vinte e cinco milhas ao sul de Eleutéropolis, chama-a cidade real dos filisteus e antigo limite meridional dos cananeus, e diz que a Geraritike, a região além do Daroma, recebeu o nome dela. Sozômeno, escrevendo no século V, conta que o monge Silvano, que vivera no Egito e no monte Sinai, fundou em Gerara, no uádi, um mosteiro muito grande e famoso."
  de:
    - "Gerar war eine Stadt im westlichen Negev zwischen Gaza und Beerscheba. Heute wird sie meist mit Tel Haror (Tell Abu Hureira) gleichgesetzt, einem großen Hügel am Nordufer des Nahal Gerar, knapp 20 km nordwestlich von Beerscheba. Yohanan Aharoni schlug die Stätte 1956 vor; frühere Forscher hatten an Tell Jemmeh oder das nahe Tell esch-Scharia gedacht. Elieser Oren von der Ben-Gurion-Universität grub Tel Haror in den 1980er und frühen 1990er Jahren aus."
    - "In der Mittelbronzezeit, im 17. und 16. Jahrhundert v. Chr., war Tel Haror eine der größten Städte Südkanaans, etwa 16 ha (40 Acres) groß, mit gewaltigen Erdwällen und einem tiefen Graben befestigt. In seinem heiligen Bezirk stand ein Tempel syrischen Typs, und rings um ihn lagen viele Opfergruben, darunter solche mit Welpen und Vögeln; ein junger Esel wurde dort mit einer Metalltrense im Maul und Satteltaschenbeschlägen auf dem Rücken begraben. In der Eisenzeit erscheint philistäische Keramik, und in der späteren Eisenzeit stand auf dem oberen Hügel eine stark befestigte Stadt mit dicker Mauer, Glacis und Türmen, bis sie durch Feuer zerstört wurde."
    - "Im ersten Buch Mose verlief die Grenze der Kanaaniter „von Sidon an durch Gerar bis gen Gaza“. Abraham hielt sich in Gerar als Fremdling auf; Abimelech, der König von Gerar, nahm Sara, die Abraham seine Schwester genannt hatte, doch Gott warnte ihn im Traum, und er gab sie zurück. In einer Teuerung zog Isaak „zu Abimelech, der Philister König, zu Gerar“, sagte dasselbe von Rebekka und grub später Brunnen im Tal von Gerar; die Hirten von Gerar zankten mit seinen Hirten um die Brunnen Esek und Sitna, nicht aber um Rehobot. Viele Forscher halten die Philister dieser Erzählungen für einen Anachronismus. Viel später verfolgte Asa, König von Juda, das Heer Serachs, des Kuschiters, bis nach Gerar und plünderte alle Städte ringsum."
    - "Der Name überdauerte die Stadt und ging auf die Gegend um sie über. Im frühen 4. Jahrhundert n. Chr. setzt Eusebius Gerara fünfundzwanzig Meilen südlich von Eleutheropolis an, nennt es eine Königsstadt der Philister und die alte Südgrenze der Kanaaniter und sagt, dass die Geraritike, die Landschaft jenseits der Daroma, nach ihr benannt ist. Sozomenos berichtet im 5. Jahrhundert, der Mönch Silvanus, der in Ägypten und am Berg Sinai gelebt hatte, habe in Gerara, im Wadi, ein sehr großes und berühmtes Kloster gegründet."
  fr:
    - "Guérar était une ville du Néguev occidental, entre Gaza et Beer-Schéba. On l’identifie aujourd’hui le plus souvent à Tel Haror (Tell Abu Hureira), un grand tertre sur la rive nord du Nahal Gerar, à un peu plus de 20 km au nord-ouest de Beer-Schéba. Yohanan Aharoni proposa le site en 1956 ; des savants antérieurs avaient songé à Tell Jemmeh ou à Tell esh-Sharia, tout proche. Eliezer Oren, de l’Université Ben-Gourion, fouilla Tel Haror dans les années 1980 et au début des années 1990."
    - "À l’âge du Bronze moyen, aux XVIIe et XVIe siècles av. J.-C., Tel Haror était l’une des plus grandes villes du sud de Canaan, d’environ 16 ha (40 acres), fortifiée de massifs remparts de terre et d’un fossé profond. Dans son enceinte sacrée se dressait un temple de type syrien, entouré de nombreuses fosses d’offrandes, contenant entre autres des chiots et des oiseaux ; un jeune âne y fut enterré avec un mors de métal dans la bouche et des garnitures de sacoches sur le dos. À l’âge du Fer apparaît la poterie philistine, et à l’âge du Fer récent une ville fortement fortifiée, avec un mur épais, un glacis et des tours, se dressa sur le tertre supérieur jusqu’à sa destruction par le feu."
    - "Dans la Genèse, la frontière des Cananéens allait « depuis Sidon, du côté de Guérar, jusqu’à Gaza ». Abraham séjourna à Guérar ; Abimélec, roi de Guérar, fit enlever Sara, qu’Abraham avait dite sa sœur, mais Dieu l’avertit en songe et il la rendit. Pendant une famine, Isaac alla « vers Abimélec, roi des Philistins, à Guérar », dit la même chose de Rebecca, et creusa plus tard des puits dans la vallée de Guérar ; les bergers de Guérar querellèrent ses bergers à propos des puits Ések et Sitna, mais non de Rehoboth. Beaucoup de spécialistes tiennent les Philistins de ces récits pour un anachronisme. Bien plus tard, Asa, roi de Juda, poursuivit l’armée de Zérach l’Éthiopien jusqu’à Guérar et pilla toutes les villes des environs."
    - "Le nom survécut à la ville et passa au district qui l’entourait. Au début du IVe siècle apr. J.-C., Eusèbe place Gerara à vingt-cinq milles au sud d’Éleuthéropolis, l’appelle ville royale des Philistins et ancienne limite méridionale des Cananéens, et dit que la Géraritique, la région au-delà du Daroma, en tire son nom. Sozomène, écrivant au Ve siècle, raconte que le moine Silvanus, qui avait vécu en Égypte et au mont Sinaï, fonda à Gerara, dans le ouadi, un monastère très vaste et fameux."
  pl:
    - "Gerar było miastem zachodniego Negebu, między Gazą a Beer-Szebą. Dziś utożsamia się je zwykle z Tel Haror (Tell Abu Hureira), dużym pagórkiem na północnym brzegu Nachal Gerar, nieco ponad 20 km na północny zachód od Beer-Szeby. Jochanan Aharoni zaproponował to miejsce w 1956 r.; wcześniejsi badacze szukali go w Tell Jemmeh lub pobliskim Tell esz-Szaria. Eliezer Oren z Uniwersytetu Ben Guriona prowadził wykopaliska w Tel Haror w latach osiemdziesiątych i na początku dziewięćdziesiątych."
    - "W środkowej epoce brązu, w XVII i XVI w. p.n.e., Tel Haror było jednym z największych miast południowego Kanaanu, o powierzchni około 16 ha (40 akrów), obwarowanym potężnymi wałami ziemnymi i głęboką fosą. W jego obrębie sakralnym stała świątynia typu syryjskiego, a wokół niej wiele jam z ofiarami, wśród nich szczeniętami i ptakami; pochowano tam młodego osła z metalowym wędzidłem w pysku i okuciami juków na grzbiecie. W epoce żelaza pojawia się ceramika filistyńska, a w późniejszej epoce żelaza na górnym pagórku stało silnie obwarowane miasto z grubym murem, glacis i wieżami, aż zniszczył je pożar."
    - "W Księdze Rodzaju granica Kananejczyków biegła „od Sydonu idąc do Gerary, aż do Gazy”. Abraham przebywał w Gerar jako przybysz; Abimelek, król Gerar, wziął Sarę, którą Abraham nazwał swoją siostrą, lecz Bóg ostrzegł go we śnie i oddał ją. W czasie głodu Izaak poszedł „do Abimelecha, do króla Filistyńskiego do Gerar”, to samo powiedział o Rebece, a później kopał studnie w dolinie Gerar; pasterze Gerar spierali się z jego pasterzami o studnie Esek i Sitna, ale nie o Rechobot. Wielu uczonych uważa Filistynów z tych opowieści za anachronizm. Znacznie później Asa, król Judy, ścigał wojsko Zeracha Etiopczyka aż do Gerar i złupił wszystkie miasta wokół niego."
    - "Nazwa przetrwała miasto i przeszła na okolicę. Na początku IV w. n.e. Euzebiusz umieszcza Gerarę dwadzieścia pięć mil na południe od Eleuteropolis, nazywa ją królewskim miastem Filistynów i dawną południową granicą Kananejczyków i mówi, że Geraritike, kraina za Daromą, nazwana jest od niej. Sozomen, pisząc w V w., opowiada, że mnich Sylwan, który mieszkał w Egipcie i na Górze Synaj, założył w Gerarze, w wadi, bardzo wielki i słynny klasztor."
  it:
    - "Gerar era una città del Negev occidentale, fra Gaza e Bersabea. È oggi di solito identificata con Tel Haror (Tell Abu Hureira), un grande tell sulla riva settentrionale del Nahal Gerar, poco più di 20 km a nord-ovest di Bersabea. Yohanan Aharoni propose il sito nel 1956; studiosi precedenti avevano guardato a Tell Jemmeh o a Tell esh-Sharia vicino. Eliezer Oren dell’Università Ben-Gurion scavò Tel Haror negli anni Ottanta e nei primi anni Novanta."
    - "Nel Bronzo Medio, nei secoli XVII e XVI a.C., Tel Haror era una delle più grandi città del Canaan meridionale, di circa 16 ettari (40 acri), fortificata con massicci terrapieni e un profondo fossato. Nel suo recinto sacro sorgeva un tempio di tipo siriano, e intorno vi erano molte fosse di offerte, fra cui cuccioli e uccelli; vi fu sepolto un giovane asino con un morso di metallo in bocca e finimenti di bisacce sul dorso. Nell’età del Ferro compare la ceramica filistea, e nella tarda età del Ferro una città fortemente fortificata, con un muro spesso, un terrapieno inclinato e torri, sorgeva sul tell superiore fino a quando fu distrutta da un incendio."
    - "Nella Genesi il confine dei Cananei andava «da Sidon, in direzione di Gherar, fino a Gaza». Abramo dimorò come forestiero in Gerar; Abimelec, re di Gerar, prese Sara, che Abramo aveva detto sua sorella, ma Dio lo ammonì in sogno ed egli la restituì. In una carestia Isacco andò «da Abimelec, re dei Filistei, a Gherar», disse lo stesso di Rebecca e più tardi scavò pozzi nella valle di Gerar; i pastori di Gerar altercarono con i suoi pastori per i pozzi Esek e Sitna, ma non per Recobot. Molti studiosi considerano un anacronismo i Filistei di questi racconti. Molto più tardi Asa, re di Giuda, inseguì l’esercito di Zerach l’Etiope fino a Gerar e saccheggiò tutte le città dei dintorni."
    - "Il nome sopravvisse alla città e passò al distretto circostante. All’inizio del IV secolo d.C. Eusebio colloca Gerara a venticinque miglia a sud di Eleuteropoli, la chiama città regia dei Filistei e antico confine meridionale dei Cananei, e dice che la Geraritike, la regione oltre il Daroma, prende nome da essa. Sozomeno, scrivendo nel V secolo, racconta che il monaco Silvano, vissuto in Egitto e sul Monte Sinai, fondò a Gerara, nel wadi, un monastero vastissimo e famoso."
  nl:
    - "Gerar was een stad in de westelijke Negev, tussen Gaza en Berseba. Zij wordt nu meestal vereenzelvigd met Tel Haror (Tell Abu Hureira), een grote heuvel aan de noordoever van de Nahal Gerar, ruim 20 km ten noordwesten van Berseba. Yohanan Aharoni stelde de plaats in 1956 voor; eerdere geleerden hadden gedacht aan Tell Jemmeh of aan het nabije Tell esh-Sharia. Eliezer Oren van de Ben-Goerion-universiteit groef Tel Haror op in de jaren tachtig en het begin van de jaren negentig."
    - "In de Midden-Bronstijd, in de zeventiende en 16e eeuw v.Chr., was Tel Haror een van de grootste steden van Zuid-Kanaän, ongeveer 16 ha (40 acres), versterkt met massieve aarden wallen en een diepe gracht. In het heilige gebied stond een tempel van Syrisch type, en eromheen lagen veel offerkuilen, onder meer met puppy’s en vogels; een jonge ezel was er begraven met een metalen bit in de bek en beslag van zadeltassen op de rug. In de IJzertijd verschijnt Filistijns aardewerk, en in de latere IJzertijd stond op de bovenheuvel een sterk versterkte stad met een dikke muur, glacis en torens, tot ze door brand werd verwoest."
    - "In Genesis liep de grens van de Kanaänieten “van Sidon, daar gij gaat naar Gerar tot Gaza toe”. Abraham verbleef als vreemdeling in Gerar; Abimelech, de koning van Gerar, nam Sara weg, die Abraham zijn zuster had genoemd, maar God waarschuwde hem in een droom en hij gaf haar terug. In een hongersnood toog Izak “tot Abimelech, de koning der Filistijnen, naar Gerar”, zei hetzelfde van Rebekka en groef later putten in het dal van Gerar; de herders van Gerar twistten met zijn herders over de putten Esek en Sitna, maar niet over Rehobot. Veel geleerden achten de Filistijnen in deze verhalen een anachronisme. Veel later achtervolgde Asa, de koning van Juda, het leger van Zerach de Ethiopiër tot Gerar en plunderde alle steden eromheen."
    - "De naam overleefde de stad en ging over op de streek eromheen. In het begin van de 4e eeuw n.Chr. plaatst Eusebius Gerara vijfentwintig mijl ten zuiden van Eleutheropolis, noemt het een koninklijke stad van de Filistijnen en de oude zuidgrens van de Kanaänieten, en zegt dat de Geraritike, het gebied voorbij de Daroma, ernaar is genoemd. Sozomenos vertelt in de 5e eeuw dat de monnik Silvanus, die in Egypte en op de Sinaï had geleefd, te Gerara, in de wadi, een zeer groot en beroemd klooster stichtte."
  cs:
    - "Gerar bylo město v západním Negevu, mezi Gazou a Beer-šebou. Dnes se obvykle ztotožňuje s Tel Haror (Tell Abu Hureira), velkým pahorkem na severním břehu Nachal Gerar, o něco více než 20 km severozápadně od Beer-šeby. Místo navrhl roku 1956 Jochanan Aharoni; dřívější badatelé hledali Tell Jemmeh nebo nedaleký Tell esh-Sharia. Eliezer Oren z Univerzity Ben-Guriona vykopával Tel Haror v 80. a na počátku 90. let 20. století."
    - "Ve střední době bronzové, v 17. a 16. stol. př. n. l., byl Tel Haror jedním z největších měst jižního Kanaánu, asi 16 ha (40 akrů), opevněným mohutnými zemními valy a hlubokým příkopem. Ve svatém okrsku stál chrám syrského typu a kolem něj mnoho jam s obětinami, mezi nimi štěňata a ptáci; byl tam pohřben mladý osel s kovovým udidlem v tlamě a okováním brašen na hřbetě. V době železné se objevuje pelištejská keramika a v pozdější době železné stálo na horním pahorku silně opevněné město s mohutnou hradbou, glacis a věžemi, dokud nebylo zničeno ohněm."
    - "V Genesis vedla hranice Kananejských „od Sidonu, když jdeš k Gerar až do Gázy“. Abraham pobýval v Gerar; Abimelek, král Gerarský, vzal Sáru, kterou Abraham nazval svou sestrou, ale Bůh ho ve snu varoval a on ji vrátil. V hladu šel Izák „k Abimelechovi králi Filistinskému do Gerar“, řekl totéž o Rebece a později kopal studny v údolí Gerar; pastýři z Gerar se přeli s jeho pastýři o studny Esek a Sitna, ale ne o Rechobót. Mnozí učenci pokládají Pelištejce v těchto příbězích za anachronismus. Mnohem později Asa, král Judský, pronásledoval vojsko Zeracha Etiopana až ke Gerar a vyplenil všechna města kolem něho."
    - "Jméno přežilo město a přešlo na okolní kraj. Na počátku 4. století n. l. klade Eusebios Gerara pětadvacet mil jižně od Eleutheropole, nazývá je královským městem Pelištejců a starou jižní hranicí Kananejských a říká, že podle něho se jmenuje Geraritiké, kraj za Daromou. Sozomenos v 5. století vypráví, že mnich Silvanus, který žil v Egyptě a na hoře Sinaj, založil v Gerara, ve wádí, velmi velký a slavný klášter."
  sv:
    - "Gerar var en stad i västra Negev, mellan Gaza och Beer Sheva. Den identifieras nu oftast med Tel Haror (Tell Abu Hureira), en stor kulle på norra stranden av Nahal Gerar, drygt 20 km nordväst om Beer Sheva. Yohanan Aharoni föreslog platsen 1956; tidigare forskare hade sett till Tell Jemmeh eller det närbelägna Tell esh-Sharia. Eliezer Oren vid Ben-Gurion-universitetet grävde ut Tel Haror på 1980-talet och i början av 1990-talet."
    - "Under mellanbronsåldern, på 1600- och 1500-talen f.Kr., var Tel Haror en av södra Kanaans största städer, omkring 16 ha (40 acres), befäst med massiva jordvallar och en djup vallgrav. I dess heliga område stod ett tempel av syrisk typ, och runt det fanns många offergropar, bland annat med valpar och fåglar; en ung åsna var begravd där med ett metallbett i munnen och sadelväskebeslag på ryggen. Under järnåldern uppträder filisteisk keramik, och under senare järnålder stod en starkt befäst stad med tjock mur, glacis och torn på den övre kullen tills den förstördes av eld."
    - "I Första Moseboken löper kananéernas gräns ”från Sidon fram emot Gerar ända till Gasa”. Abraham bodde en tid i Gerar; Avimelek, kung av Gerar, tog Sara, som Abraham kallat sin syster, men Gud varnade honom i en dröm och han gav henne tillbaka. Under en hungersnöd begav sig Isak ”till Abimelek, filistéernas konung, i Gerar”, sade detsamma om Rebecka och grävde senare brunnar i Gerars dal; herdarna i Gerar tvistade med hans herdar om brunnarna Esek och Sitna, men inte om Rehovot. Många forskare ser filistéerna i dessa berättelser som en anakronism. Mycket senare förföljde Asa, kung av Juda, etiopiern Serachs här ända till Gerar och plundrade alla städerna runtom."
    - "Namnet levde längre än staden och gick över till distriktet omkring. Tidigt på 300-talet e.Kr. förlägger Eusebios Gerara tjugofem romerska mil söder om Eleutheropolis, kallar den en kunglig stad hos filistéerna och kananéernas gamla sydgräns, och säger att Geraritike, trakten bortom Daroma, är uppkallad efter den. Sozomenos berättar på 400-talet att munken Silvanus, som hade levt i Egypten och på Sinaiberget, grundade i Gerara, i wadin, ett mycket stort och berömt kloster."
  nb:
    - "Gerar var en by i det vestlige Negev, mellom Gasa og Beer-Sjeba. Den identifiseres nå vanligvis med Tel Haror (Tell Abu Hureira), en stor haug på nordbredden av Nahal Gerar, litt over 20 km nordvest for Beer-Sjeba. Yohanan Aharoni foreslo stedet i 1956; tidligere forskere hadde sett mot Tell Jemmeh eller mot Tell esh-Sharia i nærheten. Eliezer Oren ved Ben-Gurion-universitetet gravde ut Tel Haror på 1980-tallet og tidlig på 1990-tallet."
    - "I mellombronsealder, på 1600- og 1500-tallet f.Kr., var Tel Haror en av de største byene i det sørlige Kanaan, omtrent 16 ha (40 acres), befestet med massive jordvoller og en dyp grøft. I dens hellige område sto et tempel av syrisk type, og rundt det var mange groper med ofringer, blant dem valper og fugler; et ungt esel var gravlagt der med et bissel av metall i munnen og beslag til salvesker på ryggen. I jernalderen dukker filistersk keramikk opp, og i senere jernalder sto en sterkt befestet by med tykk mur, glasis og tårn på den øvre haugen til den ble ødelagt av brann."
    - "I Første Mosebok gikk kanaanittenes grense «fra Sidon bortimot Gerar like til Gasa». Abraham oppholdt seg en tid i Gerar; Abimelek, kongen i Gerar, tok Sara, som Abraham hadde kalt sin søster, men Gud advarte ham i en drøm, og han ga henne tilbake. Under en hungersnød drog Isak «til filistrenes konge Abimelek i Gerar», sa det samme om Rebekka og gravde senere brønner i Gerar-dalen; hyrdene fra Gerar trettet med hans hyrder om brønnene Esek og Sitna, men ikke om Rehobot. Mange forskere regner filistrene i disse fortellingene for en anakronisme. Mye senere forfulgte Asa, Judas konge, hæren til etioperen Serah like til Gerar og plyndret alle byene rundt omkring den."
    - "Navnet overlevde byen og gikk over til distriktet rundt den. Tidlig på 300-tallet e.Kr. plasserer Eusebius Gerara tjuefem romerske mil sør for Eleutheropolis, kaller den en kongelig by hos filistrene og den gamle sørgrensen for kanaanittene, og sier at Geraritike, området hinsides Daroma, er oppkalt etter den. Sozomenos, som skrev på 400-tallet, forteller at munken Silvanus, som hadde levd i Egypt og på Sinai-fjellet, grunnla i Gerara, i wadien, et svært stort og berømt kloster."
  tl:
    - "Ang Gerar ay isang bayan sa kanlurang Negev, sa pagitan ng Gaza at Beer-seba. Karaniwan itong itinutumbas ngayon sa Tel Haror (Tell Abu Hureira), isang malaking gulod sa hilagang pampang ng Nahal Gerar, mahigit 20 km sa hilagang-kanluran ng Beer-seba. Iminungkahi ni Yohanan Aharoni ang lugar noong 1956; ang naunang mga iskolar ay tumingin sa Tell Jemmeh o sa kalapit na Tell esh-Sharia. Hinukay ni Eliezer Oren ng Ben-Gurion University ang Tel Haror noong dekada 1980 at maagang dekada 1990."
    - "Sa Gitnang Panahong Tanso, noong ika-17 at ika-16 na siglo BK, ang Tel Haror ay isa sa pinakamalalaking lungsod ng timog Canaan, mga 16 ha (40 akre), na nakukutaan ng malalaking pader na lupa at malalim na hukay. Sa banal na looban nito ay may templong uri-Siriano, at sa palibot nito ay maraming hukay ng handog, kabilang ang mga tuta at ibon; isang batang asno ang inilibing doon na may bit na metal sa bibig at mga kabit ng sakbat sa likod. Sa Panahong Bakal ay lumilitaw ang palayok ng mga Filisteo, at sa huling Panahong Bakal ay may matibay na kutang bayan na may makapal na pader, glacis at mga tore sa itaas na gulod hanggang sa wasakin ito ng sunog."
    - "Sa Genesis, ang hangganan ng mga Cananeo ay “mula sa Sidon, kung patungo sa Gerar, hanggang sa Gaza”. Nanirahan si Abraham sa Gerar; kinuha ni Abimelech, hari ng Gerar, si Sara, na tinawag ni Abraham na kaniyang kapatid, ngunit binalaan siya ng Dios sa panaginip at ibinalik niya ito. Sa taggutom, naparoon si Isaac “kay Abimelech, na hari ng mga Filisteo sa Gerar”, ganoon din ang sinabi tungkol kay Rebeca, at kalaunan ay humukay ng mga balon sa libis ng Gerar; nakipagtalo ang mga pastol ng Gerar sa kaniyang mga pastol tungkol sa mga balong Esec at Sitnah, ngunit hindi tungkol sa Rehoboth. Maraming iskolar ang nag-aakalang anakronismo ang mga Filisteo ng mga kuwentong ito. Higit na huli, hinabol ni Asa, hari ng Juda, ang hukbo ni Zera na Etiope hanggang sa Gerar at sinamsaman ang lahat ng bayan sa palibot nito."
    - "Nalampasan ng pangalan ang bayan at napunta sa nakapaligid na distrito. Sa unang bahagi ng ika-4 na siglo AD, inilalagay ni Eusebio ang Gerara sa dalawampu't limang milya sa timog ng Eleutheropolis, tinatawag itong maharlikang lungsod ng mga Filisteo at ang matandang katimugang hangganan ng mga Cananeo, at sinasabing ipinangalan dito ang Geraritike, ang rehiyon sa kabila ng Daroma. Isinulat ni Sozomeno noong ika-5 siglo na ang monghe na si Silvanus, na nanirahan sa Egipto at sa Bundok Sinai, ay nagtatag sa Gerara, sa wadi, ng isang napakalaki at tanyag na monasteryo."
  da:
    - "Gerar var en by i det vestlige Negev mellem Gaza og Beersheba. Den identificeres nu som regel med Tel Haror (Tell Abu Hureira), en stor høj på nordbredden af Nahal Gerar, lidt over 20 km nordvest for Beersheba. Yohanan Aharoni foreslog stedet i 1956; tidligere forskere havde set mod Tell Jemmeh eller Tell esh-Sharia i nærheden. Eliezer Oren fra Ben-Gurion Universitetet udgravede Tel Haror i 1980'erne og i begyndelsen af 1990'erne."
    - "I mellembronzealderen, i 1600-tallet og 1500-tallet f.Kr., var Tel Haror en af de største byer i det sydlige Kana'an, omkring 16 ha (40 acres), befæstet med massive jordvolde og en dyb grav. I dets hellige område stod et tempel af syrisk type, og omkring det var mange offergruber, blandt andet med hvalpe og fugle; et ungt æsel blev begravet der med et metalbid i munden og beslag til sadeltasker på ryggen. I jernalderen dukker filistæisk keramik op, og i den senere jernalder stod en stærkt befæstet by med en tyk mur, glacis og tårne på den øvre høj, indtil den blev ødelagt ved brand."
    - "I Første Mosebog løb kana'anæernes grænse »fra Zidon henimod Gerar indtil Gaza«. Abraham opholdt sig som fremmed i Gerar; Abimelek, Gerars konge, tog Sara, som Abraham havde kaldt sin søster, men Gud advarede ham i en drøm, og han gav hende tilbage. I en hungersnød drog Isak »til Abimelek, Filisternes Konge i Gerar«, sagde det samme om Rebekka og gravede senere brønde i Gerars dal; Gerars hyrder kivedes med hans hyrder om brøndene Esek og Sitna, men ikke om Rehobot. Mange forskere regner filisterne i disse fortællinger for en anakronisme. Meget senere forfulgte Asa, Judas konge, etiopieren Zerahs hær helt til Gerar og plyndrede alle byerne rundt om den."
    - "Navnet overlevede byen og gik over til distriktet omkring den. I begyndelsen af 300-tallet e.Kr. placerer Eusebios Gerara femogtyve romerske mil syd for Eleutheropolis, kalder den en kongeby hos filisterne og den gamle sydlige grænse for kana'anæerne og siger, at Geraritike, egnen hinsides Daroma, er opkaldt efter den. Sozomenos fortæller i 400-tallet, at munken Silvanus, der havde levet i Egypten og ved Sinajbjerget, grundlagde i Gerara, i wadien, et meget stort og berømt kloster."
  sr:
    - "Герар је био град западног Негева, између Газе и Вирсавеје. Данас се обично поистовећује с Тел Харором (Тел Абу Хурејра), великом хумком на северној обали Нахал Герара, нешто више од 20 км северозападно од Вирсавеје. Јоханан Ахарони предложио је налазиште 1956; ранији научници тражили су га у Тел Џеми или у оближњем Тел еш-Шарији. Елиезер Орен са Универзитета Бен Гурион ископавао је Тел Харор осамдесетих и почетком деведесетих година."
    - "У средњем бронзаном добу, у 17. и 16. веку п. н. е., Тел Харор је био један од највећих градова јужног Ханана, са око 16 ха (40 акри), утврђен масивним земљаним бедемима и дубоким опкопом. У његовом светом подручју стајао је храм сиријског типа, а око њега многе јаме с жртвама, међу њима и штенад и птице; ту је био закопан млад магарац с металним зубилом у устима и оковима за бисаге на леђима. У гвозденом добу појављује се филистејска керамика, а у каснијем гвозденом добу на горњој хумци стајао је јако утврђен град са дебелим зидом, глацисом и кулама, док није уништен ватром."
    - "У Постању међа Хананеја ишла је „од Сидона идући на Герар па до Газе“. Аврам је живео као дошљак у Герару; Авимелех, цар герарски, узео је Сару, коју је Аврам назвао својом сестром, али га је Бог упозорио у сну и он ју је вратио. У глади Исак је отишао „к Авимелеху цару филистејском у Герар“, рекао исто за Ревеку, а касније копао студенце у долини герарској; пастири герарски свађали су се с његовим пастирима око студенаца Есек и Ситна, али не и око Реховота. Многи научници Филистеје из ових прича сматрају анахронизмом. Много касније Аса, цар Јудин, гонио је војску Заре Етиопљанина све до Герара и опленио све градове око њега."
    - "Име је надживело град и прешло на област око њега. Почетком четвртог века н. е. Јевсевије смешта Герару двадесет пет миља јужно од Елеутерополиса, назива је краљевским градом Филистеја и старом јужном границом Хананеја и каже да је по њој названа Гераритика, област иза Дароме. Созомен, пишући у петом веку, приповеда да је монах Силван, који је живео у Египту и на Синају, основао у Герари, у вадију, врло велик и чувен манастир."
  hu:
    - "Gerár a nyugati Negev városa volt Gáza és Beérseba között. Ma általában Tel Harorral (Tell Abu Hureira) azonosítják, egy nagy halommal a Nahal Gerár északi partján, Beérsebától valamivel több mint 20 km-re északnyugatra. Yohanan Aharoni javasolta a helyet 1956-ban; korábbi kutatók a Tell Dzsemmé vagy a közeli Tell esh-Sharia felé tekintettek. Eliezer Oren (Ben-Gurion Egyetem) az 1980-as években és az 1990-es évek elején ásta Tel Harort."
    - "A középső bronzkorban, a Kr. e. 17. és 16. században Tel Haror Dél-Kánaán egyik legnagyobb városa volt, mintegy 16 ha (40 acre), hatalmas földsáncokkal és mély árokkal megerősítve. Szent körzetében szíriai típusú templom állt, körülötte sok áldozati gödör, köztük kiskutyákkal és madarakkal; egy fiatal szamarat is temettek oda, szájában fém zablával, hátán nyeregtáska-szerelvényekkel. A vaskorban filiszteus kerámia jelenik meg, a későbbi vaskorban pedig erősen megerősített város vastag fallal, glacis-szal és tornyokkal állt a felső halmon, míg tűz el nem pusztította."
    - "A Teremtés könyvében a kánaániták határa „Czídonból Gérár felé menve Gázáig” húzódott. Ábrahám Gerárban tartózkodott; Abimélek, Gerár királya elvette Sárát, akit Ábrahám a húgának nevezett, de Isten álomban figyelmeztette, és visszaadta. Éhínség idején Izsák „Abimélekhez a Filiszteusok királyához Gérárba” ment, Rebekáról ugyanezt mondta, később kutakat ásott Gerár völgyében; Gerár pásztorai vitatkoztak az ő pásztoraival az Eszek és Sitna kútjain, Rehóbót miatt azonban nem. Sok kutató a történetek filiszteusait anakronizmusnak tartja. Jóval később Ásza, Júda királya egészen Gerárig üldözte az etióp Zerah seregét, és kifosztotta a környező városokat."
    - "A név túlélte a várost, és átment a környező vidékre. A Kr. u. 4. század elején Eusebius Gerarát Eleutheropolisztól huszonöt mérföldre délre helyezi, a filiszteusok királyi városának és a kánaániták egykori déli határának nevezi, és azt mondja, hogy róla nevezték el a Geraritikét, a Daroma túli vidéket. Szozomenosz az 5. században azt meséli, hogy Szilvánusz szerzetes, aki Egyiptomban és a Sínai-hegyen élt, Gerarában, a vádiban egy igen nagy és híres kolostort alapított."
  fi:
    - "Gerar oli läntisen Negevin kaupunki Gazan ja Beerseban välissä. Se tunnistetaan nykyään yleensä Tel Harorin (Tell Abu Hureira) kumpuun, suureen kumpuun Nahal Gerarin pohjoisrannalla hieman yli 20 km Beersebasta luoteeseen. Yohanan Aharoni ehdotti paikkaa vuonna 1956; aiemmat tutkijat olivat etsineet sitä Tell Jemmehistä tai läheisestä Tell esh-Shariasta. Ben-Gurion-yliopiston Eliezer Oren kaivoi Tel Harorin 1980-luvulla ja 1990-luvun alussa."
    - "Keskipronssikaudella, 1600- ja 1500-luvuilla eaa., Tel Haror oli yksi Etelä-Kanaanin suurimmista kaupungeista, noin 16 ha (40 eekkeriä), linnoitettuna massiivisilla multavalleilla ja syvällä vallihaudalla. Sen pyhällä alueella oli syyrialaistyyppinen temppeli, ja sitä ympäröi monia uhrikuoppia, joissa oli muun muassa pentuja ja lintuja; nuori aasi oli haudattu sinne metallisuitset suussaan ja satulalaukun kiinnikkeet selässään. Rautakaudella ilmestyy filistealaista keramiikkaa, ja myöhemmällä rautakaudella ylämäellä oli vahvasti linnoitettu kaupunki paksuine muureineen, rinnevalleineen ja torneineen, kunnes se tuhoutui tulipalossa."
    - "Genesiksessä kanaanilaisten raja kulki ”Siidonista Gerariin päin aina Gassaan asti”. Abraham asui muukalaisena Gerarissa; Gerarin kuningas Abimelek otti Saaran, jota Abraham oli sanonut sisarekseen, mutta Jumala varoitti häntä unessa ja hän palautti hänet. Nälänhädän aikana Iisak meni ”Abimelekin, filistealaisten kuninkaan, luo Gerariin”, sanoi saman Rebekasta ja kaivoi myöhemmin kaivoja Gerarin laaksossa; Gerarin paimenet riitelivät hänen paimentensa kanssa kaivoista Esek ja Sitna mutta eivät Rehobotista. Monet tutkijat pitävät näiden kertomusten filistealaisia anakronismina. Paljon myöhemmin Juudan kuningas Asa ajoi etiopialaisen Serahin sotajoukkoa takaa aina Gerariin asti ja ryösti kaikki sen ympärillä olevat kaupungit."
    - "Nimi säilyi kaupunkia pidempään ja siirtyi sitä ympäröivälle alueelle. 300-luvun alussa jaa. Eusebios sijoittaa Gerara-nimisen paikan 25 mailia Eleutheropoliksesta etelään, kutsuu sitä filistealaisten kuninkaalliseksi kaupungiksi ja kanaanilaisten vanhaksi eteläiseksi rajaksi ja sanoo, että Daroman takainen alue, Geraritike, on nimetty sen mukaan. Sozomenos, joka kirjoitti 400-luvulla, kertoo, että munkki Silvanos, joka oli asunut Egyptissä ja Siinainvuorella, perusti Gerarassa, wadissa, hyvin suuren ja kuuluisan luostarin."
  vi:
    - "Ghê-ra là một thành ở tây Nê-ghép, giữa Ga-xa và Bê-e-Sê-ba. Nay thành thường được đồng nhất với Tel Haror (Tell Abu Hureira), một gò lớn ở bờ bắc Nahal Gerar, cách Bê-e-Sê-ba hơn 20 km một chút về phía tây bắc. Yohanan Aharoni đề nghị địa điểm này năm 1956; các học giả trước đó tìm ở Tell Jemmeh hoặc Tell esh-Sharia gần đó. Eliezer Oren của Đại học Ben-Gurion khai quật Tel Haror trong thập niên 1980 và đầu thập niên 1990."
    - "Vào thời Đồ Đồng Giữa, thế kỷ 17 và 16 TCN, Tel Haror là một trong những thành lớn nhất miền nam Ca-na-an, rộng khoảng 16 ha (40 mẫu Anh), được củng cố bằng lũy đất đồ sộ và hào sâu. Trong khu thánh của thành có một đền kiểu Sy-ri, và xung quanh có nhiều hố tế lễ, trong đó có chó con và chim; một con lừa non được chôn ở đó với hàm thiếc kim loại trong miệng và phụ kiện túi yên trên lưng. Vào thời Đồ Sắt, đồ gốm Phi-li-tin xuất hiện, và vào cuối thời Đồ Sắt một thành kiên cố với tường dày, dốc nghiêng và tháp đứng trên gò cao cho đến khi bị lửa phá hủy."
    - "Trong Sáng Thế Ký, ranh giới của dân Ca-na-an chạy “về hướng Ghê-ra, chạy từ Si-đôn tới Ga-xa”. Áp-ra-ham tạm cư ở Ghê-ra; A-bi-mê-léc, vua Ghê-ra, bắt Sa-ra, người mà Áp-ra-ham đã gọi là em gái mình, nhưng Đức Chúa Trời cảnh báo ông trong giấc mơ và ông trả nàng lại. Trong một nạn đói, Y-sác “đi đến A-bi-mê-léc, vua Phi-li-tin, tại Ghê-ra”, nói điều tương tự về Rê-be-ca, và về sau đào giếng trong thung lũng Ghê-ra; những người chăn bầy của Ghê-ra tranh giành với người chăn của ông về các giếng Ê-sét và Sít-na, nhưng không tranh về Rê-hô-bốt. Nhiều học giả coi người Phi-li-tin trong các câu chuyện này là sai thời đại. Rất lâu sau, A-sa, vua Giu-đa, đuổi quân của Xê-rách người Ê-thi-ô-bi cho đến Ghê-ra và cướp mọi thành xung quanh."
    - "Tên còn tồn tại lâu hơn thành và chuyển sang vùng chung quanh. Vào đầu thế kỷ 4, Eusebius đặt Gerara cách Eleutheropolis 25 dặm về phía nam, gọi đó là thành vua của người Phi-li-tin và ranh giới phía nam cổ của dân Ca-na-an, và nói rằng Geraritike, vùng bên kia Daroma, được đặt tên theo thành. Sozomen, viết vào thế kỷ 5, kể rằng tu sĩ Silvanus, người đã sống ở Ê-díp-tô và núi Si-na-i, lập tại Gerara, trong wadi, một tu viện rất lớn và nổi tiếng."
  ro:
    - "Gherar era un oraș din Neghevul de vest, între Gaza și Beer-Șeba. Este identificat acum de obicei cu Tel Haror (Tell Abu Hureira), o movilă mare pe malul nordic al Nahal Gerar, la puțin peste 20 km spre nord-vest de Beer-Șeba. Yohanan Aharoni a propus locul în 1956; cercetători mai vechi se uitaseră la Tell Jemmeh sau la Tell esh-Sharia, din apropiere. Eliezer Oren, de la Universitatea Ben-Gurion, a săpat la Tel Haror în anii 1980 și la începutul anilor 1990."
    - "În Bronzul Mijlociu, în secolele al XVII-lea și al XVI-lea î.Hr., Tel Haror era unul dintre cele mai mari orașe din Canaanul de sud, de circa 16 ha (40 de acri), întărit cu valuri de pământ masive și un șanț adânc. În incinta lui sacră se afla un templu de tip sirian, iar în jur multe gropi cu ofrande, între care pui de câine și păsări; un măgar tânăr a fost îngropat acolo cu o zăbală de metal în gură și cu piese de desagi pe spate. În Epoca Fierului apare ceramica filisteană, iar în Epoca Fierului târzie, pe movila superioară s-a aflat un oraș puternic fortificat, cu zid gros, glacis și turnuri, până a fost distrus prin foc."
    - "În Geneza, hotarul canaaniților mergea „dela Sidon până la Gherara și Gaza”. Avraam a locuit ca străin în Gherar; Abimelec, regele Gherarului, a luat-o pe Sara, pe care Avraam o numise sora lui, dar Dumnezeu l-a avertizat într-un vis și el i-a înapoiat-o. Într-o foamete, Isaac a mers „la Avimeleh împăratul Filistenilor în Gherara”, a spus același lucru despre Rebeca și a săpat mai târziu fântâni în valea Gherarului; păstorii Gherarului s-au certat cu păstorii lui pentru fântânile Esec și Sitna, dar nu și pentru Rehobot. Mulți cercetători socotesc un anacronism prezența filistenilor în aceste povestiri. Mult mai târziu, Asa, regele lui Iuda, a urmărit armata lui Zerah etiopianul până la Gherar și a jefuit toate cetățile din jurul lui."
    - "Numele a supraviețuit orașului și a trecut asupra districtului din jur. La începutul secolului al IV-lea d.Hr., Eusebiu așază Gerara la douăzeci și cinci de mile spre sud de Eleutheropolis, o numește oraș regal al filistenilor și vechi hotar de sud al canaaniților și spune că regiunea Geraritike, dincolo de Daroma, își ia numele de la ea. Sozomen, scriind în secolul al V-lea, povestește că monahul Silvan, care trăise în Egipt și la Muntele Sinai, a întemeiat la Gerara, în wadi, o mănăstire foarte mare și vestită."
  bg:
    - "Герар беше град в западния Негев, между Газа и Вирсавия. Днес обикновено се отъждествява с Тел Харор (Тел Абу Хурейра), голяма могила на северния бряг на Нахал Герар, на малко над 20 км северозападно от Вирсавия. Йоханан Ахарони предложи мястото през 1956 г.; по-ранните учени търсеха Тел Джема или близкия Тел еш-Шария. Елиезер Орен от университета „Бен-Гурион“ разкопаваше Тел Харор през 1980-те и началото на 1990-те години."
    - "През средната бронзова епоха, през XVII и XVI в. пр.н.е., Тел Харор беше един от най-големите градове в Южен Ханаан, около 16 ха (40 акра), укрепен с масивни земни валове и дълбок ров. В свещения му участък стоеше храм от сирийски тип, а около него имаше много ями с приношения, сред тях кученца и птици; там беше погребано младо магаре с метален мундщук в устата и обков на дисаги на гърба. През желязната епоха се появява филистимска керамика, а през късната желязна епоха на горната могила стоеше силно укрепен град с дебела стена, гласис и кули, докато не беше унищожен от пожар."
    - "В Битие пределите на ханаанците бяха „от Сидон като отхожда някой на Герар до Газа“. Авраам живя като пришълец в Герар; Авимелех, царят на Герар, взе Сара, която Авраам беше нарекъл своя сестра, но Бог го предупреди насън и той я върна. По време на глад Исаак отиде „при Авимелеха, Филистимския цар в Герар“, каза същото за Ревека и по-късно изкопа кладенци в Герарския дол; герарските пастири се препираха с неговите пастири за кладенците Есек и Ситна, но не и за Реховот. Много учени смятат филистимците в тези разкази за анахронизъм. Много по-късно Аса, царят на Юда, преследва войската на етиопянина Зерах до Герар и разграби всички градове около него."
    - "Името надживя града и премина към областта около него. В началото на IV в. н.е. Евсевий поставя Герара на двадесет и пет мили южно от Елевтерополис, нарича го царски град на филистимците и стара южна граница на ханаанците и казва, че Герарика, областта отвъд Дарома, е наречена на него. Созомен, който пише през V в., разказва, че монахът Силван, живял в Египет и на Синай, основал в Герара, в уадито, много голям и прочут манастир."
