# Overview article (ADR 0007). Mainstream facts only; the pool is unlocated and the two views are given without choosing; the Fuller's Field has its own article.
id: upper-pool
place: a532b99
title:
  en: "Upper Pool"
  ru: "Верхний пруд"
  uk: "Верхній ставок"
  es: "Estanque de Arriba"
  pt: "Tanque de Cima"
  de: "Oberer Teich"
  fr: "Bassin supérieur"
  pl: "Górny Basen"
  it: "Vasca Superiore"
  nl: "Bovenvijver"
  cs: "Horní nádrž"
  sv: "Övre dammen"
