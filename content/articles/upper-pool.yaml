  tl: "Mataas na Tangke"
body:
  en:
    - "The Upper Pool of Jerusalem is named in one scene told twice and in one more: Isaiah met King Ahaz “at the end of the conduit of the upper pool in the highway of the fuller's field”, and a generation later the envoys of Sennacherib stood at the same spot. Where it was is debated, and nothing found has been tied to it. One view puts it at the Gihon spring in the Kidron valley, the “upper” pool in contrast to the “lower pool” at the foot of the City of David, with the conduit being the channel that carried the spring's water down the valley to the gardens before Hezekiah cut his tunnel. The other puts it north-west of the city, where the road from the north came in and where an Assyrian army would camp, somewhere about the later Mamilla pool; but no pool of the kings' time is known there. The record stands in Jerusalem without a closer site."
    - "In the war of 734 BC, when Rezin of Damascus and Pekah of Israel marched on Jerusalem, Ahaz was presumably inspecting his water supply against a siege when the word came to Isaiah: “Go forth now to meet Ahaz, thou, and Shear-jashub thy son, at the end of the conduit of the upper pool”; there the prophet told him to be quiet and not fear the two smoking firebrands, and gave the sign of Immanuel."
    - "In 701 BC the king of Assyria sent his officers from Lachish to Hezekiah “with a great host against Jerusalem. And they went up and came to Jerusalem. And when they were come up, they came and stood by the conduit of the upper pool, which is in the highway of the fuller's field”, and from there the Rabshakeh shouted his demands in Hebrew to the men on the wall. Between the two scenes Hezekiah “made a pool, and a conduit, and brought water into the city”, and Isaiah reproaches the city for gathering “the waters of the lower pool” and making a ditch between the two walls for the water of the old pool."
    - "Today the Gihon spring and the channel along the valley are shown in the City of David excavations in Silwan, and the dry Mamilla pool lies in a park west of the Jaffa Gate; neither can be called the Upper Pool with confidence."
  ru:
    - "Верхний пруд Иерусалима назван в одной сцене, рассказанной дважды, и ещё в одной: Исаия встретил царя Ахаза «к концу водопровода верхнего пруда, на дорогу к полю белильничьему», а поколение спустя у того же места стояли послы Сеннахирима. Где он был — спорно, и ни одна находка с ним не связана. Одни помещают его у источника Гион в долине Кедрон — «верхний» пруд в противоположность «нижнему» у подножия города Давида, а водопровод — это канал, нёсший воду источника вниз по долине к садам, пока Езекия не пробил свой туннель. Другие ищут его к северо-западу от города, где входила дорога с севера и где стало бы станом ассирийское войско, где-то около позднейшего пруда Мамилла; но пруда царских времён там не известно. Запись стоит в Иерусалиме без более точного места."
    - "В войну 734 г. до н. э., когда Рецин Дамасский и Факей Израильский шли на Иерусалим, Ахаз, надо думать, осматривал водоснабжение на случай осады, когда «сказал Господь Исаии: выйди ты и сын твой Шеар-ясув навстречу Ахазу, к концу водопровода верхнего пруда»; там пророк велел ему быть спокойным и не бояться двух дымящихся головней и дал знамение об Еммануиле."
    - "В 701 г. до н. э. царь Ассирийский послал к Езекии из Лахиса своих вельмож «с большим войском в Иерусалим. И пошли, и пришли к Иерусалиму; и пошли, и пришли, и стали у водопровода верхнего пруда, который на дороге поля белильничьего», и оттуда Рабсак выкрикивал по-еврейски свои требования людям на стене. Между этими двумя сценами Езекия «сделал пруд и водопровод и провел воду в город», а Исаия упрекает город за то, что он собирал «воды в нижнем пруде» и делал между двумя стенами хранилище для вод старого пруда."
    - "Сегодня источник Гион и канал вдоль долины показывают в раскопках города Давида в Сильване, а сухой пруд Мамилла лежит в парке к западу от Яффских ворот; ни тот, ни другой нельзя уверенно назвать Верхним прудом."
  uk:
    - "Верхній ставок Єрусалима названий в одній сцені, розказаній двічі, і ще в одній: Ісая зустрів царя Ахаза «на край водопроводу з верхнього ставу на Шаповаловому шляху», а через покоління посланці Сінаххеріба стояли на тому самому місці. Де він був, дискутується, і ніщо знайдене не пов’язано з ним. Одна думка розміщує його біля джерела Гіхон у долині Кедрону, «верхній» ставок на противагу «нижньому» біля підніжжя Міста Давида, а водопровід — каналом, що вів воду джерела долиною до садів, перш ніж Єзекія пробив свій тунель. Інша розміщує його на північний захід від міста, де входила дорога з півночі й де таборувало б ассірійське військо, десь біля пізнішого басейну Мамілла; але ставка часів царів там не відомо. Запис стоїть в Єрусалимі без ближчого місця."
    - "У війні 734 р. до н. е., коли Рецін Дамаський і Факей Ізраїльський рушили на Єрусалим, Ахаз, імовірно, оглядав своє водопостачання на випадок облоги, коли слово прийшло до Ісаї: «Ійди на зустріч Ахазові, ти й син твій Шеар-Ясуб, на край водопроводу з верхнього ставу»; там пророк сказав йому бути спокійним і не боятися двох димних головешок і дав знак Еммануїла."
    - "У 701 р. до н. е. цар Ассирії послав своїх воєначальників з Лахіша до Єзекії «з великою військовою потугою до короля Езекії в Ерусалим. І пійшли вони й прийшли під Ерусалим, і зайняли становище на водопроводї вижшого ставу, на дорозї до поля красильнього», і звідти Рабсак вигукував свої вимоги староєврейською до людей на мурі. Між двома сценами Єзекія «зробив став і водопровід, і провів у город воду», а Ісая докоряє місту, що воно збирає «води до нижнього ставу» і копає між двома мурами став для води старого ставу."
    - "Нині джерело Гіхон і канал уздовж долини показують у розкопках Міста Давида в Сільвані, а сухий басейн Мамілла лежить у парку на захід від Яффських воріт; жоден не можна з певністю назвати Верхнім ставком."
  es:
    - "El Estanque de Arriba de Jerusalén se nombra en una escena contada dos veces y en una más: Isaías encontró al rey Acaz «al cabo del conducto de la Pesquera de arriba, en el camino de la heredad del Lavador», y una generación después los enviados de Senaquerib se detuvieron en el mismo punto. Se discute dónde estaba; nada hallado se vincula con él. Una opinión lo sitúa en la fuente de Gihón, en el valle del Cedrón, estanque «de arriba» frente a la «pesquera de abajo» al pie de la Ciudad de David, y el conducto sería el canal que llevaba el agua valle abajo a los huertos antes del túnel de Ezequías. La otra lo sitúa al noroeste de la ciudad, por donde entraba el camino del norte y donde acamparía un ejército asirio, hacia el posterior estanque de Mamilla; pero allí no se conoce estanque de la época de los reyes. El registro no precisa más el emplazamiento en Jerusalén."
    - "En la guerra de 734 a. C., cuando Rezín de Damasco y Peka de Israel marcharon sobre Jerusalén, Acaz estaba presumiblemente inspeccionando su abastecimiento de agua ante un asedio cuando llegó la palabra a Isaías: «Sal ahora al encuentro de Achâz, tú, y Sear-jasub tu hijo, al cabo del conducto de la Pesquera de arriba»; allí el profeta le dijo que se estuviera tranquilo y no temiera a los dos cabos de tizón humeantes, y le dio la señal de Emanuel."
    - "En 701 a. C. el rey de Asiria envió a sus oficiales desde Laquis a Ezequías «con un grande ejército: y subieron, y vinieron á Jerusalem. Y habiendo subido, vinieron y pararon junto al conducto del estanque de arriba, que es en el camino de la heredad del batanero», y desde allí el Rabsaces gritó sus exigencias en hebreo a los hombres de la muralla. Entre las dos escenas Ezequías «hizo el estanque, y el conducto, y metió las aguas en la ciudad», e Isaías reprocha a la ciudad haber recogido «las aguas de la pesquera de abajo» y haber hecho un foso entre los dos muros para el agua del estanque viejo."
    - "Hoy la fuente de Gihón y el canal a lo largo del valle se muestran en las excavaciones de la Ciudad de David, en Silwan, y el estanque seco de Mamilla se halla en un parque al oeste de la Puerta de Jaffa; de ninguno de los dos puede decirse con seguridad que sea el Estanque de Arriba."
  pt:
    - "O Tanque de Cima de Jerusalém é nomeado numa cena contada duas vezes e em mais uma: Isaías encontrou o rei Acaz “no fim do aqueduto do tanque superior, na estrada do campo do lavandeiro”, e uma geração depois os enviados de Senaqueribe pararam no mesmo ponto. Onde ficava é debatido, e nada achado foi ligado a ele. Uma visão o põe na fonte de Giom, no vale do Cedrom, o tanque “de cima” em contraste com o “tanque inferior” ao pé da Cidade de Davi, sendo o aqueduto o canal que levava a água da fonte vale abaixo até os jardins, antes de Ezequias abrir seu túnel. A outra o põe a noroeste da cidade, onde entrava a estrada do norte e onde acamparia um exército assírio, em algum ponto perto do posterior tanque de Mamilla; mas nenhum tanque do tempo dos reis é ali conhecido. O registro fica em Jerusalém sem sítio mais preciso."
    - "Na guerra de 734 a.C., quando Rezim de Damasco e Peca de Israel marcharam sobre Jerusalém, Acaz presumivelmente inspecionava seu abastecimento de água contra um cerco quando a palavra veio a Isaías: “Saia agora para encontrar Acaz, você e seu filho Sear-Jasube, no fim do aqueduto do tanque superior”; ali o profeta lhe disse que se acalmasse e não temesse os dois tições fumegantes, e deu o sinal de Emanuel."
    - "Em 701 a.C., o rei da Assíria enviou seus oficiais de Laquis a Ezequias “com um grande exército para Jerusalém. Eles subiram e vieram a Jerusalém. Quando subiram, vieram e pararam junto ao aqueduto do tanque superior, que fica no caminho do campo do lavandeiro”, e dali o Rabsaqué gritou suas exigências em hebraico aos homens da muralha. Entre as duas cenas, Ezequias “fez o tanque e o aqueduto, e trouxe água para a cidade”, e Isaías censura a cidade por juntar “as águas do tanque inferior” e abrir uma vala entre os dois muros para a água do tanque antigo."
    - "Hoje a fonte de Giom e o canal ao longo do vale são mostrados nas escavações da Cidade de Davi, em Silwan, e o seco tanque de Mamilla fica num parque a oeste da Porta de Jafa; nenhum dos dois pode ser chamado Tanque de Cima com confiança."
  de:
    - "Der Obere Teich Jerusalems wird in einer zweimal erzählten Szene und an einer weiteren Stelle genannt: Jesaja sollte König Ahas entgegengehen „an das Ende der Wasserleitung des oberen Teiches, am Wege beim Acker des Walkmüllers“, und eine Generation später standen die Gesandten Sanheribs an derselben Stelle. Wo er lag, ist umstritten, und kein Fund ist ihm zugeordnet. Eine Ansicht setzt ihn an die Gihonquelle im Kidrontal, den „oberen“ Teich im Gegensatz zum „unteren Teich“ am Fuß der Davidsstadt, mit der Wasserleitung als dem Kanal, der das Quellwasser vor Hiskias Tunnel das Tal hinab zu den Gärten führte. Die andere setzt ihn nordwestlich der Stadt, wo die Straße aus dem Norden einmündete und ein assyrisches Heer lagern würde, irgendwo beim späteren Mamilla-Teich; doch ist dort kein Teich der Königszeit bekannt. Die Überlieferung nennt keine genauere Stelle."
    - "Im Krieg von 734 v. Chr., als Rezin von Damaskus und Pekach von Israel gegen Jerusalem zogen, prüfte Ahas vermutlich seine Wasserversorgung für eine Belagerung, als das Wort an Jesaja erging: „Gehe hinaus, Ahas entgegen, du und dein Sohn Sear-Jasub, an das Ende der Wasserleitung des oberen Teiches“; dort sagte ihm der Prophet, er solle ruhig bleiben und die beiden rauchenden Brandscheite nicht fürchten, und gab das Zeichen Immanuels."
    - "701 v. Chr. sandte der König von Assyrien seine Offiziere von Lachisch zu Hiskia „mit großer Macht gen Jerusalem, und sie zogen herauf. Und da sie hinkamen, hielten sie an der Wasserleitung des oberen Teiches, der da liegt an der Straße bei dem Acker des Walkmüllers“, und von dort rief der Rabsake seine Forderungen auf Hebräisch den Männern auf der Mauer zu. Zwischen den beiden Szenen entstanden unter Hiskia, wie es heißt, „der Teich und die Wasserleitung, durch die er Wasser in die Stadt geleitet hat“, und Jesaja tadelt die Stadt, dass sie „das Wasser des untern Teiches“ sammelte und „einen Graben“ zwischen beiden Mauern „vom Wasser des alten Teiches“ machte."
    - "Heute werden die Gihonquelle und der Kanal entlang des Tals in den Grabungen der Davidsstadt in Silwan gezeigt, und der trockene Mamilla-Teich liegt in einem Park westlich des Jaffa-Tors; keiner von beiden kann mit Sicherheit der Obere Teich genannt werden."
  fr:
    - "Le Bassin supérieur de Jérusalem est nommé dans une scène racontée deux fois et dans une autre : Ésaïe rencontra le roi Achaz « vers l’extrémité de l’aqueduc de l’étang supérieur, sur la route du champ du foulon », et une génération plus tard les envoyés de Sanchérib se tinrent au même endroit. Sa place est débattue, et rien de trouvé n’y est rattaché. Une opinion le met à la source de Guihon, dans la vallée du Cédron, bassin « supérieur » par opposition à l’« étang inférieur » au pied de la Cité de David, l’aqueduc étant le canal qui menait l’eau de la source le long de la vallée vers les jardins avant le tunnel d’Ézéchias. L’autre le place au nord-ouest de la ville, où arrivait la route du nord et où camperait une armée assyrienne, vers le futur bassin de Mamilla ; mais aucun bassin de l’époque des rois n’y est connu. Le texte reste à Jérusalem, sans site précis."
    - "Dans la guerre de 734 av. J.-C., quand Retsin de Damas et Péka d’Israël marchèrent sur Jérusalem, Achaz inspectait sans doute ses réserves d’eau en prévision d’un siège lorsque la parole vint à Ésaïe : « Va à la rencontre d’Achaz, toi et Schear-Jaschub, ton fils, vers l’extrémité de l’aqueduc de l’étang supérieur » ; là le prophète lui dit de rester tranquille et de ne pas craindre ces deux bouts de tisons fumants, et lui donna le signe d’Emmanuel."
    - "En 701 av. J.-C., le roi d’Assyrie envoya ses officiers de Lakis à Ézéchias « avec une puissante armée. Ils montèrent, et ils arrivèrent à Jérusalem. Lorsqu’ils furent montés et arrivés, ils s’arrêtèrent à l’aqueduc de l’étang supérieur, sur le chemin du champ du foulon », et de là Rabschaké cria ses exigences en hébreu aux hommes du rempart. Entre les deux scènes, Ézéchias « fit l’étang et l’aqueduc, et amena les eaux dans la ville », et Ésaïe reproche à la ville de retenir « les eaux de l’étang inférieur » et de faire un réservoir entre les deux murs pour les eaux de l’ancien étang."
    - "Aujourd’hui, la source de Guihon et le canal le long de la vallée se visitent dans les fouilles de la Cité de David à Silwan, et le bassin de Mamilla, à sec, se trouve dans un parc à l’ouest de la porte de Jaffa ; on ne peut avec assurance appeler ni l’un ni l’autre le Bassin supérieur."
  pl:
    - "Górny Basen Jerozolimy jest wymieniony w jednej scenie opowiedzianej dwukrotnie i w jeszcze jednej: Izajasz miał wyjść naprzeciw króla Achaza „na koniec rur sadzawki wyższej, na drogę pola farbierzowego”, a pokolenie później wysłannicy Sennacheryba stanęli w tym samym miejscu. Gdzie leżał, jest sporne, a nic z odnalezionego nie zostało z nim powiązane. Jeden pogląd umieszcza go przy źródle Gichon w dolinie Cedronu, „górny” w przeciwieństwie do „dolnej sadzawki” u stóp Miasta Dawida, a rury byłyby kanałem, który niósł wodę ze źródła w dół doliny do ogrodów, zanim Ezechiasz wykuł swój tunel. Drugi umieszcza go na północny zachód od miasta, gdzie dochodziła droga z północy i gdzie rozbiłaby obóz armia asyryjska, gdzieś w okolicy późniejszej sadzawki Mamilla; ale nie jest tam znany żaden basen z czasów królów. Zapis stoi w Jerozolimie bez dokładniejszego miejsca."
    - "W wojnie 734 roku p.n.e., gdy Resin z Damaszku i Pekach z Izraela ruszyli na Jerozolimę, Achaz zapewne sprawdzał swoje zaopatrzenie w wodę na wypadek oblężenia, gdy słowo przyszło do Izajasza: „Wyjdź teraz przeciw Achazowi, ty, i Sear Jasub, syn twój, na koniec rur sadzawki wyższej”; tam prorok kazał mu być spokojnym i nie lękać się dwóch dymiących głowni, i dał znak Immanuela."
    - "W 701 roku p.n.e. król Asyrii wysłał swych dowódców z Lakisz do Ezechiasza „z wielkiem wojskiem do Jeruzalemu. Którzy wyciągnąwszy przyjechali ku Jeruzalemowi, a przyciągnąwszy przyszli i położyli się u rur sadzawki wyższej, która jest podle drogi brukowanej na polu blecharzowem”, i stamtąd Rabszake wykrzykiwał po hebrajsku swe żądania do ludzi na murze. Między obiema scenami Ezechiasz „uczynił sadzawkę, i rury, którymi przywiódł wodę do miasta”, a Izajasz wyrzuca miastu, że „zgromadziły się wody sadzawki dolnej” i że uczyniło przekop między dwoma murami dla wody starej sadzawki."
    - "Dziś źródło Gichon i kanał wzdłuż doliny są pokazywane w wykopaliskach Miasta Dawida w Silwanie, a wyschnięta sadzawka Mamilla leży w parku na zachód od Bramy Jafskiej; żadnej z nich nie można z pewnością nazwać Górnym Basenem."
  it:
    - "La Vasca Superiore di Gerusalemme è nominata in una scena raccontata due volte e in un’altra ancora: Isaia incontrò il re Acaz «verso l’estremità dell’acquedotto dello stagno superiore, sulla strada del campo del gualchieraio», e una generazione dopo gli inviati di Sennacherib si fermarono lì. Dove fosse è discusso e nulla di ciò che si è trovato vi è collegato. Una tesi la pone alla sorgente di Ghicon nella valle del Cedron, vasca «superiore» in contrasto con la «vasca inferiore» ai piedi della Città di Davide, con l’acquedotto che sarebbe il canale che portava ai giardini l’acqua della sorgente prima del tunnel di Ezechia. L’altra la pone a nord-ovest della città, dove entrava la strada da nord e si accamperebbe un esercito assiro, verso la vasca di Mamilla; ma lì non è nota alcuna vasca dell’epoca dei re. Resta senza un sito più preciso."
    - "Nella guerra del 734 a.C., quando Resin di Damasco e Pekach d’Israele marciarono su Gerusalemme, Acaz stava presumibilmente ispezionando le sue riserve d’acqua contro un assedio quando la parola giunse a Isaia: «Va’ incontro ad Achaz, tu con Scear-Jashub, tuo figliuolo, verso l’estremità dell’acquedotto dello stagno superiore»; là il profeta gli disse di stare calmo e di non temere i due tizzoni fumanti, e diede il segno dell’Emmanuele."
    - "Nel 701 a.C. il re d’Assiria mandò i suoi ufficiali da Lachis a Ezechia «con un grande esercito. Essi salirono e giunsero a Gerusalemme. E, come furon giunti, vennero a fermarsi presso l’acquedotto dello stagno superiore, che è sulla strada del campo del lavator di panni», e di là il Rabsache gridò le sue richieste in ebraico agli uomini sul muro. Fra le due scene Ezechia «fece il serbatoio e l’acquedotto e condusse le acque nella città», e Isaia rimprovera la città di aver raccolto «le acque dal serbatoio disotto» e di aver fatto un bacino fra le due mura per le acque del serbatoio antico."
    - "Oggi la sorgente di Ghicon e il canale lungo la valle si mostrano negli scavi della Città di Davide a Silwan, e la vasca asciutta di Mamilla giace in un parco a ovest della Porta di Giaffa; nessuna delle due può essere detta con sicurezza la Vasca Superiore."
  nl:
    - "De Bovenvijver van Jeruzalem komt voor in een tweemaal verteld tafereel en in nog één: Jesaja ontmoette koning Achaz “aan het einde van den watergang des oppersten vijvers, aan den hogen weg van het veld des vollers”, en een generatie later stonden de gezanten van Sanherib op dezelfde plek. Waar hij lag, wordt betwist; niets gevondens is eraan gekoppeld. Eén opvatting plaatst hem bij de Gihon in het Kidrondal, de “bovenste” vijver tegenover de “onderste vijver” aan de voet van de Stad van David, met de watergang als kanaal dat het bronwater door het dal naar de tuinen voerde voordat Chizkia zijn tunnel groef. De andere plaatst hem ten noordwesten van de stad, waar de weg uit het noorden binnenkwam en een Assyrisch leger zou kamperen, rond de latere Mamillavijver; maar daar is geen vijver uit de koningstijd bekend. Het verslag blijft in Jeruzalem zonder nauwere plaats."
    - "In de oorlog van 734 v.Chr., toen Rezin van Damascus en Pekach van Israël tegen Jeruzalem optrokken, inspecteerde Achaz vermoedelijk zijn watervoorziening met het oog op een beleg toen het woord tot Jesaja kwam: “Ga nu uit, Achaz tegemoet, gij en uw zoon, Schear-Jaschub, aan het einde van den watergang des oppersten vijvers”; daar zei de profeet hem rustig te blijven en de twee rokende vuurbranden niet te vrezen, en gaf het teken van Immanuël."
    - "In 701 v.Chr. zond de koning van Assyrië zijn officieren van Lachis naar Chizkia “met een zwaar heir naar Jeruzalem; en zij togen op, en kwamen naar Jeruzalem. En als zij optogen en gekomen waren, bleven zij staan bij den watergang des oppersten vijvers, welke is bij den hogen weg van het veld des vollers”, en vandaar riep de Rabsake zijn eisen in het Hebreeuws naar de mannen op de muur. Tussen de twee taferelen in is het Chizkia die “den vijver en den watergang gemaakt heeft, en water in de stad gebracht heeft”, en Jesaja verwijt de stad dat zij “de wateren des ondersten vijvers” verzamelt en een gracht tussen de beide muren maakt voor het water van de oude vijver."
    - "Tegenwoordig worden de Gihonbron en het kanaal langs het dal getoond in de opgravingen van de Stad van David in Silwan, en ligt de droge Mamillavijver in een park ten westen van de Jaffapoort; geen van beide kan met zekerheid de Bovenvijver worden genoemd."
  cs:
    - "Horní nádrž v Jeruzalémě je jmenována v jedné scéně vyprávěné dvakrát a v jedné další: Izajáš byl poslán vstříc králi Achazovi „až na konec struhy rybníka hořejšího, k silnici pole valchářova“ a o generaci později stáli na témže místě poslové Senacheribovi. Kde to bylo, je sporné a nic nalezeného s ní nebylo spojeno. Jeden názor ji klade k prameni Gichón v údolí Kidronu, „horní“ nádrž v protikladu k „dolní nádrži“ na úpatí Města Davidova, přičemž struha je kanál, který odváděl vodu pramene údolím do zahrad, než Chizkijáš vyrazil svůj tunel. Druhý ji klade severozápadně od města, kam přicházela silnice od severu a kde by se utábořilo asyrské vojsko, někam k pozdější nádrži Mamilla; ale žádná nádrž z doby králů tam není známa. Záznam stojí v Jeruzalémě bez bližšího určení místa."
    - "Ve válce roku 734 př. n. l., když Resín z Damašku a Pekach z Izraele táhli na Jeruzalém, Achaz patrně kontroloval své zásoby vody pro případ obležení, když došlo slovo k Izajášovi: „Vyjdi nyní vstříc Achasovi, ty a Sear Jašub syn tvůj, až na konec struhy rybníka hořejšího“; tam mu prorok řekl, aby byl klidný a nebál se dvou doutnajících pochodní, a dal znamení Immanuelovo."
    - "V roce 701 př. n. l. poslal asyrský král své důstojníky z Lachiše k Chizkijášovi „s vojskem velikým k Jeruzalému. Kteříž vytáhše, přijeli k Jeruzalému, a přitáhše, přitrhli a položili se u struhy rybníka hořejšího, kteráž jest podlé cesty dlážené při poli valchářovu“, a odtud Rab-šake křičel hebrejsky své požadavky na muže na hradbě. Mezi oběma scénami Chizkijáš „udělal rybník, a vodu po trubách uvedl do města“ a Izajáš vyčítá městu, že shromáždilo „vody rybníka dolního“ a vykopalo mezi dvěma zdmi příkop pro vodu starého rybníka."
    - "Dnes jsou pramen Gichón a kanál podél údolí ukazovány ve vykopávkách Města Davidova v Silwánu a vyschlá nádrž Mamilla leží v parku západně od Jaffské brány; ani jedno nelze s jistotou označit za Horní nádrž."
  sv:
    - "Jerusalems övre damm nämns i en scen som berättas två gånger och i ytterligare en: Jesaja mötte kung Achas ”vid ändan av Övre dammens vattenledning, på vägen till Valkarfältet”, och en generation senare stod Sanheribs sändebud på samma plats. Var den låg är omdebatterat, och inget fynd har kunnat knytas till den. En uppfattning förlägger den till Gihonkällan i Kidrondalen, den ”övre” dammen i motsats till ”Nedre dammen” vid foten av Davids stad, med vattenledningen som den ränna som förde källans vatten ner längs dalen till trädgårdarna innan Hiskia högg sin tunnel. Den andra förlägger den nordväst om staden, där vägen från norr kom in och där en assyrisk här skulle slå läger, någonstans kring den senare Mamilladammen; men ingen damm från kungatiden är känd där. Uppgiften står i Jerusalem utan närmare plats."
    - "I kriget 734 f.Kr., när Resin av Damaskus och Pekach av Israel tågade mot Jerusalem, inspekterade Achas förmodligen sin vattenförsörjning inför en belägring när ordet kom till Jesaja: ”Gå åstad med din son Sear-Jasub och möt Ahas vid ändan av Övre dammens vattenledning”; där sade profeten åt honom att vara lugn och inte frukta de två rykande brandstumparna, och gav Immanuels tecken."
    - "År 701 f.Kr. sände Assyriens kung sina ämbetsmän från Lakish till Hiskia ”med en stor här mot konung Hiskia i Jerusalem. Dessa drogo då upp och kommo till Jerusalem; och när de hade dragit ditupp och kommit fram, stannade de vid Övre dammens vattenledning, på vägen till Valkarfältet”, och därifrån ropade Rab-Shake sina krav på hebreiska till männen på muren. Mellan de två scenerna ”anlade” Hiskia ”dammen och vattenledningen och ledde vatten in i staden”, och Jesaja förebrår staden för att den samlade upp ”vattnet i Nedre dammen” och gjorde en grav mellan de två murarna för den gamla dammens vatten."
    - "I dag visas Gihonkällan och rännan längs dalen i utgrävningarna av Davids stad i Silwan, och den torra Mamilladammen ligger i en park väster om Jaffaporten; ingen av dem kan med säkerhet kallas Övre dammen."
  nb:
    - "Jerusalems øvre dam er nevnt i én scene som fortelles to ganger og i en til: Jesaja møtte kong Ahas «ved enden av vannledningen fra den øvre dam, ved allfarveien til Vaskervollen», og en generasjon senere sto Sankeribs sendebud på det samme stedet. Hvor den lå, er omdiskutert, og ingenting funnet er blitt knyttet til den. Ett syn plasserer den ved Gihon-kilden i Kedron-dalen, den «øvre» dammen i motsetning til «den nedre dam» ved foten av Davidsbyen, med vannledningen som kanalen som førte kildens vann nedover dalen til hagene før Hiskia hogg tunnelen sin. Det andre plasserer den nordvest for byen, der veien fra nord kom inn og der en assyrisk hær ville slå leir, et sted omkring den senere Mamilla-dammen; men ingen dam fra kongenes tid er kjent der. Beretningen står i Jerusalem uten et nærmere sted."
    - "I krigen i 734 f.Kr., da Resin av Damaskus og Pekah av Israel marsjerte mot Jerusalem, var Ahas antakelig i ferd med å granske vannforsyningen sin mot en beleiring da ordet kom til Jesaja: «Gå avsted, du og din sønn Sjear Jasjub, og møt Akas ved enden av vannledningen fra den øvre dam»; der ba profeten ham være rolig og ikke frykte de to rykende brandene, og ga Immanuel-tegnet."
    - "I 701 f.Kr. sendte kongen av Assyria offiserene sine «med en stor hær fra Lakis til kong Esekias i Jerusalem; og de drog op og kom til Jerusalem, og da de var kommet dit, stanset de ved vannledningen fra den øvre dam, ved alfarveien til Vaskervollen», og derfra ropte Rabsjake kravene sine på hebraisk til mennene på muren. Mellom de to scenene «gjorde» Hiskia «dammen og vannledningen og førte vannet inn i byen», og Jesaja bebreider byen for at den samler «vannet i den nedre dam» og graver en grøft mellom de to murene for vannet fra den gamle dammen."
    - "I dag vises Gihon-kilden og kanalen langs dalen i utgravningene i Davidsbyen i Silwan, og den tørre Mamilla-dammen ligger i en park vest for Jaffaporten; ingen av dem kan med sikkerhet kalles den øvre dam."
  tl:
    - "Ang Mataas na Tangke ay nasa isang eksenang dalawang beses isinalaysay at sa isa pa: sinalubong ni Isaias si Haring Achaz “sa dulo ng padaluyan ng tipunan ng tubig sa itaas, sa lansangan ng parang ng nagpapaputi ng kayo”, at pagkaraan ng isang salinlahi, tumayo roon ang mga sugo ni Sennacherib. Pinagtatalunan ang pook nito; walang natagpuang iniugnay rito. Isang pananaw ang naglalagay nito sa Gihon sa libis ng Cedron, ang “itaas” na tangke kumpara sa “mababang tangke” sa paanan ng Bayan ni David, na ang padaluyan ay kanal ng tubig ng bukal pababa sa mga halamanan bago hukayin ni Ezechias ang lagusan. Ang isa ay sa hilagang-kanluran ng lunsod, kung saan pumapasok ang daan mula hilaga at magkakampo ang Asirio, malapit sa kalaunang tangke ng Mamilla, bagaman walang kilalang tangke roon ng panahon ng mga hari. Nananatili ang tala sa Jerusalem, walang mas tiyak na pook."
    - "Sa digmaan noong 734 BK, nang magmartsa laban sa Jerusalem sina Rezin ng Damasco at Peka ng Israel, malamang sinusuri ni Achaz ang suplay ng tubig laban sa pagkubkob nang dumating ang salita kay Isaias: “Lumabas ka na iyong salubungin si Achaz, ikaw, at si Sear-jasub na iyong anak, sa dulo ng padaluyan ng tipunan ng tubig sa itaas”; doon sinabi ng propeta sa kaniya na tumahimik at huwag matakot sa dalawang umuusok na sulo, at ibinigay ang tanda ni Emmanuel."
    - "Noong 701 BK, isinugo ng hari ng Asiria ang kaniyang mga opisyal mula sa Lachis kay Ezechias “na may malaking hukbo sa Jerusalem. At sila'y nagsiahon at nagsiparoon sa Jerusalem. At nang sila'y mangakaahon, sila'y nagsiparoon at nagsitayo sa tabi ng padaluyan ng tubig ng mataas na tipunan ng tubig na nasa lansangan sa parang ng tagapagpaputi ng kayo”, at mula roon isinigaw ni Rabsaces sa Hebreo ang kaniyang mga hinihingi sa mga lalaking nasa pader. Sa pagitan ng dalawang eksena, “ginawa ang tipunan ng tubig, at ang padaluyan, at nagdala ng tubig sa bayan” si Ezechias, at sinisisi ni Isaias ang lunsod sa pagtitipon ng “ang tubig ng mababang tangke” at paggawa ng hukay sa pagitan ng dalawang pader para sa tubig ng lumang tangke."
    - "Ngayon, ang bukal ng Gihon at ang kanal sa libis ay ipinakikita sa mga paghuhukay ng Bayan ni David sa Silwan, at ang tuyong tangke ng Mamilla ay nasa liwasan sa kanluran ng Pintuang Jaffa; alinman ay hindi matatawag na Mataas na Tangke nang may tiwala."
