body:
  en:
    - "Halhul was a town in the hill country of Judah, named once in a group of towns north of Hebron: “Halhul, Beth-zur, and Gedor”. The name survives unchanged in Halhul, a town about 5 km north of Hebron, high on the ridge of the Judean hills; Edward Robinson identified it in the nineteenth century. Today Halhul is a Palestinian town in the Hebron governorate of the West Bank, built on Nabi Yunus, which at about 1,030 m is usually given as the highest point of the West Bank."
    - "In the late Second Temple period Halhul lay in Idumaea; during the war with Rome an Idumaean force gathered at the village of Alurus in its struggle with Simon bar Giora. Jewish tradition placed the tomb of Gad the seer at Halhul, and in 1847 John Wilson described it as a place of Jewish pilgrimage. In the late twelfth century the traveller Ali of Herat recorded there the tomb of Jonah son of Amittai, Yunus ibn Matta, and the town's mosque of Nabi Yunus keeps this tradition."
  ru:
    - "Халхул — город в горах Иудеи, названный однажды в группе городов к северу от Хеврона: «Халхул, Беф-Цур и Гедор». Имя без изменений сохранилось в Халхуле — городе примерно в 5 км к северу от Хеврона, высоко на хребте Иудейских гор; Эдвард Робинсон отождествил его в XIX в. Сегодня Халхул — палестинский город в мухафазе Хеврон на Западном берегу, построенный на горе Наби-Юнус, которую при высоте около 1030 м обычно называют высшей точкой Западного берега."
    - "В позднее время Второго храма Халхул находился в Идумее; во время войны с Римом идумейское войско, боровшееся с Симоном бар Гиорой, собралось в селении Алур. Иудейское предание помещало в Халхуле гробницу прозорливца Гада, и в 1847 г. Джон Уилсон описывал его как место иудейского паломничества. В конце XII в. путешественник Али из Герата отметил здесь гробницу Ионы, сына Амафиина, Юнуса ибн Матты, и мечеть Наби-Юнус в городе хранит это предание."
  uk:
    - "Халхул був містом у юдейських горах, названим один раз у групі міст на північ від Хеврона: «Халхул, Бет-Зур і Гедор». Назва без змін збереглася в Халхулі, місті приблизно за 5 км на північ від Хеврона, високо на хребті юдейських гір; Едвард Робінсон ототожнив його в XIX ст. Нині Халхул — палестинське місто в мухафазі Хеврон на Західному березі, збудоване на Набі-Юніс, що, маючи близько 1030 м, зазвичай вважається найвищою точкою Західного берега."
    - "Наприкінці періоду Другого храму Халхул лежав в Ідумеї; під час війни з Римом ідумейський загін зібрався в селі Алур у боротьбі з Симоном бар-Гіорою. Єврейська традиція поміщала в Халхулі гробницю пророка Гада, і 1847 р. Джон Вілсон описав його як місце єврейської прощі. Наприкінці XII ст. мандрівник Алі з Герата записав там гробницю Йони, сина Амітая, Юніса ібн Матти, і мечеть Набі-Юніс у місті зберігає це передання."
  es:
    - "Halhul era una ciudad de la región montañosa de Judá, nombrada una vez en un grupo de ciudades al norte de Hebrón: «Halhul, y Bethfur, y Gedor». El nombre pervive sin cambio en Halhul, una población a unos 5 km al norte de Hebrón, en lo alto de la cresta de las colinas de Judea; Edward Robinson la identificó en el siglo XIX. Hoy Halhul es una ciudad palestina de la gobernación de Hebrón, en Cisjordania, construida sobre Nabi Yunus, que con unos 1030 m suele darse como el punto más alto de Cisjordania."
    - "A fines de la época del Segundo Templo, Halhul se hallaba en Idumea; durante la guerra con Roma una fuerza idumea se reunió en la aldea de Alurus en su lucha con Simón bar Giora. La tradición judía situó en Halhul la tumba de Gad el vidente, y en 1847 John Wilson la describió como lugar de peregrinación judía. A fines del siglo XII el viajero Ali de Herat registró allí la tumba de Jonás hijo de Amitai, Yunus ibn Matta, y la mezquita de Nabi Yunus de la ciudad conserva esta tradición."
  pt:
    - "Halul era uma cidade na região montanhosa de Judá, nomeada uma vez num grupo de cidades ao norte de Hebrom: “Halul, Bete-Zur, Gedor”. O nome sobrevive inalterado em Halhul, uma cidade cerca de 5 km ao norte de Hebrom, no alto da cordilheira das colinas da Judeia; Edward Robinson a identificou no século XIX. Hoje Halhul é uma cidade palestina na governadoria de Hebrom, na Cisjordânia, construída sobre o Nabi Yunus, que, com cerca de 1.030 m, costuma ser dado como o ponto mais alto da Cisjordânia."
    - "No final do período do Segundo Templo, Halul ficava na Iduméia; durante a guerra com Roma, uma força idumeia se reuniu na aldeia de Alurus em sua luta contra Simão bar Giora. A tradição judaica situava em Halul o túmulo de Gade, o vidente, e em 1847 John Wilson a descreveu como lugar de peregrinação judaica. No final do século XII o viajante Ali de Herat registrou ali o túmulo de Jonas, filho de Amitai, Yunus ibn Matta, e a mesquita de Nabi Yunus da cidade conserva essa tradição."
  de:
    - "Halhul war eine Stadt im Bergland von Juda, einmal in einer Gruppe von Städten nördlich von Hebron genannt: „Halhul, Beth-Zur, Gedor“. Der Name überlebt unverändert in Halhul, einer Stadt etwa 5 km nördlich von Hebron, hoch auf dem Rücken der judäischen Berge; Edward Robinson erkannte sie im neunzehnten Jahrhundert. Heute ist Halhul eine palästinensische Stadt im Gouvernement Hebron im Westjordanland, auf dem Nabi Junis erbaut, der mit etwa 1030 m gewöhnlich als höchster Punkt des Westjordanlands angegeben wird."
    - "In der späten Zeit des Zweiten Tempels lag Halhul in Idumäa; während des Krieges mit Rom sammelte sich in einem Kampf mit Simon bar Giora ein idumäisches Heer im Dorf Alurus. Die jüdische Überlieferung setzte das Grab des Sehers Gad in Halhul an, und John Wilson beschrieb es 1847 als jüdischen Wallfahrtsort. Im späten zwölften Jahrhundert verzeichnete der Reisende Ali von Herat dort das Grab Jonas, des Sohnes Amittais, Junus ibn Matta, und die Moschee Nabi Junis der Stadt bewahrt diese Überlieferung."
  fr:
    - "Halhul était une ville de la montagne de Juda, nommée une fois dans un groupe de villes au nord d’Hébron : « Halhul, Beth-Tsur, Guedor ». Le nom survit inchangé dans Halhul, ville à environ 5 km au nord d’Hébron, haut perchée sur la crête des collines de Judée ; Edward Robinson l’identifia au XIXe siècle. Aujourd’hui, Halhul est une ville palestinienne du gouvernorat d’Hébron, en Cisjordanie, bâtie sur Nabi Yunus qui, avec environ 1 030 m, est d’ordinaire donné pour le point le plus haut de la Cisjordanie."
    - "À la fin de la période du Second Temple, Halhul se trouvait en Idumée ; pendant la guerre contre Rome, une troupe iduméenne se rassembla au village d’Alurus dans sa lutte avec Simon bar Giora. La tradition juive plaçait à Halhul le tombeau de Gad le voyant, et en 1847 John Wilson la décrivit comme un lieu de pèlerinage juif. À la fin du XIIe siècle, le voyageur Ali de Hérat y enregistra le tombeau de Jonas, fils d’Amitthaï, Yunus ibn Matta, et la mosquée de Nabi Yunus de la ville garde cette tradition."
  it:
    - "Calcul era una città dei monti di Giuda, nominata una volta in un gruppo di città a nord di Ebron: «Halhul, Beth-Tsur, Ghedor». Il nome sopravvive immutato a Halhul, una città a circa 5 km a nord di Ebron, in alto sulla dorsale delle colline di Giudea; Edward Robinson la identificò nell’Ottocento. Oggi Halhul è una città palestinese nel governatorato di Ebron, in Cisgiordania, costruita su Nabi Yunus, che con circa 1030 m è di solito indicato come il punto più alto della Cisgiordania."
    - "Nel tardo periodo del Secondo Tempio Calcul si trovava in Idumea; durante la guerra con Roma una forza idumea si radunò nel villaggio di Alurus nella sua lotta con Simone bar Giora. La tradizione ebraica poneva a Calcul la tomba di Gad il veggente, e nel 1847 John Wilson la descrisse come meta di pellegrinaggio ebraico. Alla fine del XII secolo il viaggiatore Ali di Herat vi registrò la tomba di Giona figlio di Amittai, Yunus ibn Matta, e la moschea cittadina di Nabi Yunus ne conserva la tradizione."
  nl:
    - "Chalchul was een stad in het bergland van Juda, eenmaal genoemd in een groep steden ten noorden van Hebron: “Halhul, Beth-Zur, en Gedor”. De naam leeft onveranderd voort in Halhul, een stad ongeveer 5 km ten noorden van Hebron, hoog op de bergkam van de Judese heuvels; Edward Robinson vereenzelvigde haar in de negentiende eeuw. Tegenwoordig is Halhul een Palestijnse stad in het gouvernement Hebron op de Westelijke Jordaanoever, gebouwd op Nabi Yunus, dat met ongeveer 1030 m gewoonlijk als het hoogste punt van de Westelijke Jordaanoever wordt opgegeven."
    - "In de late Tweede Tempeltijd lag Chalchul in Idumea; tijdens de oorlog met Rome verzamelde zich een Idumees leger bij het dorp Alurus in zijn strijd met Simon bar Giora. De Joodse overlevering plaatste het graf van Gad de ziener te Chalchul, en in 1847 beschreef John Wilson het als een Joodse bedevaartsplaats. Aan het einde van de twaalfde eeuw noteerde de reiziger Ali van Herat daar het graf van Jona, zoon van Amittai, Yunus ibn Matta, en de moskee van Nabi Yunus in de stad bewaart die overlevering."
  pl:
    - "Chalchul było miastem w górach Judy, wymienionym raz w grupie miast na północ od Hebronu: „Halhul, Betsur i Giedor”. Nazwa przetrwała bez zmian w Halhul, mieście około 5 km na północ od Hebronu, wysoko na grzbiecie wzgórz judzkich; utożsamił je w XIX wieku Edward Robinson. Dziś Halhul to palestyńskie miasto w muhafazie Hebron na Zachodnim Brzegu, zbudowane na Nabi Junus, który z wysokością około 1030 m podaje się zwykle jako najwyższy punkt Zachodniego Brzegu."
    - "W późnym okresie Drugiej Świątyni Chalchul leżało w Idumei; podczas wojny z Rzymem oddział idumejski zgromadził się we wsi Alurus w walce ze Szymonem bar Giorą. Tradycja żydowska umieszczała w Chalchul grób Gada, widzącego, a w 1847 roku John Wilson opisał je jako miejsce żydowskich pielgrzymek. Pod koniec XII wieku podróżnik Ali z Heratu zapisał tam grób Jonasza, syna Amittaja, Junusa ibn Matty, a meczet Nabi Junus w mieście zachowuje tę tradycję."
  cs:
    - "Chalchúl bylo město v judském pohoří, jmenované jednou ve skupině měst severně od Hebronu: „Alul, Betsur a Gedor“. Jméno se beze změny zachovalo v Chalchúlu, městě asi 5 km severně od Hebronu, vysoko na hřebeni judských hor; Edward Robinson jej ztotožnil v devatenáctém století. Dnes je Chalchúl palestinské město v hebronském guvernorátu na Západním břehu, postavené na Nabí Júnus, který s asi 1 030 m bývá uváděn jako nejvyšší bod Západního břehu."
    - "V pozdním období Druhého chrámu ležel Chalchúl v Idumeji; za války s Římem se idumejská jednotka shromáždila ve vesnici Alurus v zápase se Šimonem bar Giorou. Židovská tradice kladla do Chalchúlu hrob Gáda, věštce, a roku 1847 jej John Wilson popsal jako místo židovských poutí. Na konci dvanáctého století zaznamenal cestovatel Alí z Herátu na tomto místě hrob Jonáše, syna Amitajova, Júnuse ibn Matty, a městská mešita Nabí Júnus tuto tradici uchovává."
  sv:
    - "Halhul var en stad i Judas bergsbygd, nämnd en gång i en grupp städer norr om Hebron: ”Halhul, Bet-Sur, Gedor”. Namnet lever kvar oförändrat i Halhul, en stad omkring 5 km norr om Hebron, högt uppe på åsen i de judeiska bergen; Edward Robinson identifierade den på 1800-talet. I dag är Halhul en palestinsk stad i guvernementet Hebron på Västbanken, byggd på Nabi Yunus, som med omkring 1 030 m vanligen anges som Västbankens högsta punkt."
    - "Under sen andratemplets tid låg Halhul i Idumeen; under kriget mot Rom samlades en idumeisk styrka i byn Alurus i sin kamp mot Simon bar Giora. Judisk tradition förlade siaren Gads grav till Halhul, och 1847 beskrev John Wilson den som en judisk pilgrimsplats. I slutet av 1100-talet antecknade resenären Ali från Herat där profeten Jonas, Amittajs sons, grav, Yunus ibn Matta, och stadens moské Nabi Yunus bevarar denna tradition."
  nb:
    - "Halhul var en by i Judas fjellland, nevnt én gang i en gruppe byer nord for Hebron: «Halhul, Bet-Sur og Gedor». Navnet overlever uendret i Halhul, en by omtrent 5 km nord for Hebron, høyt på ryggen av de judeiske åsene; Edward Robinson identifiserte den på 1800-tallet. I dag er Halhul en palestinsk by i Hebron-guvernementet på Vestbredden, bygd på Nabi Yunus, som med omtrent 1030 m vanligvis oppgis som Vestbreddens høyeste punkt."
    - "I den sene andretempeltiden lå Halhul i Idumea; under krigen mot Roma samlet en idumeisk styrke seg i landsbyen Alurus i sin kamp mot Simon bar Giora. Jødisk tradisjon plasserte seeren Gads grav i Halhul, og i 1847 beskrev John Wilson det som et jødisk pilegrimssted. Sent på 1100-tallet noterte den reisende Ali av Herat der graven til Jona, Amittais sønn, Yunus ibn Matta, og byens moské Nabi Yunus bevarer denne tradisjonen."
  tl:
    - "Ang Halhul ay bayan sa maburol na lupain ng Juda, na pinangalanan nang isang beses sa pangkat ng mga bayan sa hilaga ng Hebron: “Halhul, Beth-zur, at Gedor”. Nananatiling hindi nagbabago ang pangalan sa Halhul, bayang mga 5 km sa hilaga ng Hebron, mataas sa tagaytay ng mga burol ng Judea; kinilala ito ni Edward Robinson noong ika-19 na siglo. Ngayon ang Halhul ay bayang Palestino sa lalawigan ng Hebron ng West Bank, itinayo sa Nabi Yunus, na may taas na humigit-kumulang 1,030 m at karaniwang itinuturing na pinakamataas na punto ng West Bank."
    - "Sa huling bahagi ng panahon ng Ikalawang Templo, ang Halhul ay nasa Idumea; noong digmaan sa Roma, isang hukbong Idumeo ang nagtipon sa nayon ng Alurus sa pakikibaka nito kay Simon bar Giora. Inilagay ng tradisyong Judio ang libingan ni Gad na tagakita sa Halhul, at noong 1847 inilarawan ito ni John Wilson bilang pook ng paglalakbay ng mga Judio. Sa huling bahagi ng ika-12 siglo, itinala roon ng manlalakbay na si Ali ng Herat ang libingan ni Jonas na anak ni Amittai, Yunus ibn Matta, at pinananatili ng moske ng Nabi Yunus ng bayan ang tradisyong ito."
  da:
    - "Halhul var en by i Judas bjergland, nævnt én gang i en gruppe byer nord for Hebron: »Halhul, Bethzur og Gedor«. Navnet lever uændret i Halhul, en by omkring 5 km nord for Hebron, højt på højderyggen i de judæiske bjerge; Edward Robinson identificerede den i 1800-tallet. I dag er Halhul en palæstinensisk by i Hebron-guvernementet på Vestbredden, bygget på Nabi Yunus, som med omkring 1.030 m sædvanligvis angives som Vestbreddens højeste punkt."
    - "I sen Andet Tempels tid lå Halhul i Idumæa; under krigen med Rom samlede en idumæisk styrke sig i landsbyen Alurus i sin kamp med Simon bar Giora. Jødisk tradition henlagde seeren Gads grav til Halhul, og i 1847 beskrev John Wilson den som et jødisk pilgrimssted. I slutningen af 1100-tallet optegnede den rejsende Ali fra Herat der graven af Jonas, Amittajs søn, Yunus ibn Matta, og byens Nabi Yunus-moské bevarer denne tradition."
  sr:
    - "Халхул је био град у јудејској гори, једном именован у групи градова северно од Хеврона: „Алул, Вет-сур и Гедор“. Име се непромењено чува у Халхулу, граду око 5 км северно од Хеврона, високо на гребену јудејских брда; Едвард Робинсон поистоветио га је у деветнаестом веку. Данас је Халхул палестински град у хевронском гувернорату на Западној обали, изграђен на Неби Јунусу, који се са око 1.030 м обично наводи као највиша тачка Западне обале."
    - "У касном раздобљу Другог храма Халхул је лежао у Идумеји; током рата с Римом идумејска чета окупила се у селу Алуру у борби против Симона бар Гиоре. Јеврејско предање смештало је гроб видеоца Гада у Халхул, а Џон Вилсон га је 1847. описао као место јеврејског ходочашћа. Крајем дванаестог века путник Али из Херата забележио је ту гроб Јоне сина Аматијевог, Јунуса ибн Мате, а градска џамија Неби Јунус чува то предање."
scripture:
