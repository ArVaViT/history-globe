body:
  en:
    - "This Rehob is the Aramaean land in the far north, probably the same as Beth-rehob. The spies sent by Moses “searched the land from the wilderness of Zin unto Rehob, as men come to Hamath”, so that Rehob marks the northern end of the land; and when the Ammonites hired Aramaean troops against David, “the Syrians of Zoba, and of Rehob, and Ish-tob, and Maacah, were by themselves in the field”, while the Ammonites stood at the city gate; Joab routed the Aramaeans and Abishai the Ammonites. In the Synodal Bible the spies' verse is Numbers 13:22."
    - "Its seat is unknown. The map follows those who equate it with Beth-rehob, drawn in the Beqaa valley of Lebanon on the road to Hamath, and also marks the two towns called Rehob in Asher as less likely readings. Nothing has been excavated under the name, and it disappears from history once Damascus absorbed the small Aramaean states."
  ru:
    - "Этот Рехов — арамейская земля на крайнем севере, вероятно, то же, что Беф-Рехов. Соглядатаи, посланные Моисеем, «высмотрели землю от пустыни Син даже до Рехова, близ Емафа», так что Рехов отмечает северный предел земли; а когда Аммонитяне наняли против Давида арамейские войска, «Сирийцы Сувы и Рехова, и Истова, и Маахи, стали отдельно в поле», а Аммонитяне стояли у ворот города; Иоав разбил арамеев, а Авесса — Аммонитян. В Синодальной Библии стих о соглядатаях — Числа 13:22."
    - "Где был его центр, неизвестно. Карта следует тем, кто отождествляет его с Беф-Реховом, и помещает его в долине Бекаа в Ливане, на дороге к Емафу, а также отмечает два города Рехов в Асире как менее вероятные прочтения. Под этим именем ничего не раскопано, и после того как Дамаск поглотил мелкие арамейские государства, Рехов исчезает из истории."
  uk:
    - "Цей Рехов — арамейська земля на далекій півночі, ймовірно, та сама, що й Бет-Рехов. Розвідники, послані Мойсеєм, «розгледїли землю від Зин степу до Регобу, як ійти до Гамату», тож Рехов позначає північний кінець краю; а коли аммонітяни найняли арамейські війська проти Давида, «Сирийцї Сабські й Рехобські, та Істобські й Маахські розставились у чистому полі», а аммонітяни стояли біля міської брами; Йоав розбив арамеїв, а Авішай — аммонітян. У Синодальній Біблії вірш про розвідників — Числа 13:22."
    - "Його осідок невідомий. Карта йде за тими, хто ототожнює його з Бет-Реховом, нанесеним у долині Бекаа в Лівані на шляху до Хамата, і позначає також два міста під назвою Рехов в Асірі як менш імовірні прочитання. Під цією назвою нічого не розкопано, і він зникає з історії, коли Дамаск поглинув дрібні арамейські держави."
  es:
    - "Este Rehob es la tierra aramea del extremo norte, probablemente la misma que Bet-rehob. Los espías enviados por Moisés «reconocieron la tierra desde el desierto de Zin hasta Rehob, entrando en Emath», de modo que Rehob marca el extremo septentrional de la tierra; y cuando los amonitas contrataron tropas arameas contra David, «los Siros de Soba, y de Rehob, y de Is-tob, y de Maaca, estaban de por sí en el campo», mientras los amonitas estaban a la puerta de la ciudad; Joab derrotó a los arameos y Abisai a los amonitas. En la Biblia sinodal el versículo de los espías es Números 13:22."
    - "Se desconoce su sede. El mapa sigue a quienes la equiparan con Bet-rehob, situada en el valle de la Becá, en el Líbano, en el camino a Hamat, y señala también las dos ciudades llamadas Rehob en Aser como lecturas menos probables. No se ha excavado nada bajo este nombre, y desaparece de la historia cuando Damasco absorbió los pequeños Estados arameos."
  pt:
    - "Esta Reobe é a terra aramaica do extremo norte, provavelmente a mesma que Bete-Reobe. Os espias enviados por Moisés “espiaram a terra desde o deserto de Zim até Reobe, à entrada de Hamate”, de modo que Reobe marca o limite norte da terra; e quando os amonitas contrataram tropas arameias contra Davi, “Os sírios de Zobá e de Reobe, e os homens de Tobe e de Maaca, estavam sozinhos no campo”, enquanto os amonitas estavam à porta da cidade; Joabe derrotou os arameus e Abisai os amonitas. Na Bíblia Sinodal o versículo dos espias é Números 13:22."
    - "Sua sede é desconhecida. O mapa segue os que a equiparam a Bete-Reobe, situada no vale da Beqaa, no Líbano, na estrada de Hamate, e marca também as duas cidades chamadas Reobe em Aser como leituras menos prováveis. Nada foi escavado sob esse nome, e ela desaparece da história quando Damasco absorveu os pequenos Estados arameus."
  de:
    - "Dieses Rehob ist das aramäische Land im äußersten Norden, wahrscheinlich dasselbe wie Bet-Rehob. Die Kundschafter des Mose „erkundeten das Land von der Wüste Zin bis gen Rehob, da man gen Hamath geht“, sodass Rehob das Nordende des Landes markiert; und als die Ammoniter aramäische Truppen gegen David dingten, „Die Syrer aber von Zoba, von Rehob, von Is-Tob und von Maacha waren allein im Felde“, während die Ammoniter am Stadttor standen; Joab schlug die Aramäer in die Flucht und Abisai die Ammoniter. In der Synodalübersetzung ist der Vers der Kundschafter Numeri 13,22."
    - "Sein Sitz ist unbekannt. Die Karte folgt denen, die es mit Bet-Rehob gleichsetzen, im Bekaa-Tal des Libanon an der Straße nach Hamat eingezeichnet, und markiert auch die beiden Orte namens Rehob in Asser als weniger wahrscheinliche Lesarten. Unter dem Namen wurde nichts ausgegraben, und es verschwindet aus der Geschichte, sobald Damaskus die kleinen aramäischen Staaten aufnahm."
  fr:
    - "Ce Rehob est le pays araméen de l’extrême nord, probablement le même que Beth-Rehob. Les explorateurs envoyés par Moïse « explorèrent le pays, depuis le désert de Tsin jusqu’à Rehob, sur le chemin de Hamath », de sorte que Rehob marque l’extrémité nord du pays ; et quand les Ammonites engagèrent des troupes araméennes contre David, « les Syriens de Tsoba et de Rehob, et les hommes de Tob et de Maaca, étaient à part dans la campagne », tandis que les Ammonites se tenaient à la porte de la ville ; Joab mit en déroute les Araméens et Abischaï les Ammonites. Dans la Bible synodale russe, le verset des explorateurs est Nombres 13:22."
    - "Son siège est inconnu. La carte suit ceux qui l’identifient à Beth-Rehob, dessinée dans la vallée de la Bekaa, au Liban, sur la route de Hamath, et marque aussi les deux villes appelées Rehob en Aser comme lectures moins probables. Rien n’a été fouillé sous ce nom, et il disparaît de l’histoire quand Damas absorba les petits États araméens."
  it:
    - "Questo Recob è la terra aramea dell’estremo nord, probabilmente la stessa di Bet-Recob. Gli esploratori mandati da Mosè «esplorarono il paese dal deserto di Tsin fino a Rehob, sulla via di Hamath», così che Recob segna l’estremità settentrionale del paese; e quando gli Ammoniti presero al loro soldo truppe aramee contro Davide, «i Siri di Tsoba e di Rehob e la gente di Tob e di Maaca stavano a parte nella campagna», mentre gli Ammoniti stavano alla porta della città; Ioab sbaragliò gli Aramei e Abisai gli Ammoniti. Nella Bibbia sinodale il versetto degli esploratori è Numeri 13,22."
    - "La sua sede è ignota. La mappa segue coloro che la identificano con Bet-Recob, tracciata nella valle della Beqa’ in Libano sulla strada per Camat, e segna anche i due luoghi chiamati Recob in Aser come letture meno probabili. Nulla è stato scavato sotto questo nome, e scompare dalla storia quando Damasco assorbì i piccoli Stati aramei."
  pl:
    - "Ten Rechob to aramejska kraina na dalekiej północy, prawdopodobnie ta sama co Bet-Rechob. Zwiadowcy wysłani przez Mojżesza „przeszpiegowali ziemię od puszczy Syn aż do Rochob, którędy chodzą do Emat”, tak że Rechob wyznacza północny kraniec kraju; a gdy Ammonici najęli aramejskie wojska przeciw Dawidowi, „Syryjczyk zasię z Soby, i Rechob, i Istob, i Maacha byli osobno w polu”, a Ammonici stali u bramy miasta; Joab rozgromił Aramejczyków, a Abiszaj Ammonitów. W Biblii synodalnej werset o zwiadowcach to Lb 13,22."
    - "Jego położenie jest nieznane. Mapa idzie za tymi, którzy utożsamiają je z Bet-Rechob, naniesionym w dolinie Bekaa w Libanie na drodze do Chamat, i zaznacza też dwa miasta zwane Rechob w Aszerze jako mniej prawdopodobne odczytania. Pod tą nazwą nic nie odkopano, a znika ono z historii, gdy Damaszek wchłonął małe państwa aramejskie."
  cs:
    - "Tento Rechob je aramejská země na dalekém severu, pravděpodobně totéž co Bét-rechob. Vyzvědači vyslaní Mojžíšem „prohlédli tu zemi od pouště Tsin až do Rohob, kudy se jde do Emat“, takže Rechob označuje severní konec země; a když Amónci najali aramejské vojsko proti Davidovi, „Syrští také, Soba a Rohob, a Istob i Maacha zvláště byli na poli“, zatímco Amónci stáli u městské brány; Joáb rozprášil Aramejce a Abišaj Amónce. V synodální Bibli je verš o vyzvědačích Numeri 13,22."
    - "Jeho sídlo je neznámé. Mapa následuje ty, kdo jej ztotožňují s Bét-rechobem, zakresleným v údolí Bikáa v Libanonu na cestě k Chamatu, a vyznačuje také dvě města zvaná Rechob v Ašeru jako méně pravděpodobné čtení. Pod tímto jménem nebylo nic vykopáno a z dějin mizí, jakmile Damašek pohltil malé aramejské státy."
  nl:
    - "Dit Rechob is het Aramese land in het verre noorden, waarschijnlijk hetzelfde als Beth-Rechob. De verspieders die Mozes zond “verspiedden het land, van de woestijn Zin af tot Rechob toe, waar men gaat naar Hamath”, zodat Rechob het noordeinde van het land markeert; en toen de Ammonieten Aramese troepen tegen David huurden, “de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maacha waren bijzonder in het veld”, terwijl de Ammonieten bij de stadspoort stonden; Joab versloeg de Arameeërs en Abisai de Ammonieten. In de Synodale Bijbel is het vers over de verspieders Numeri 13:22."
    - "De ligging is onbekend. De kaart volgt degenen die het gelijkstellen met Beth-Rechob, getekend in de Bekaavallei van Libanon aan de weg naar Hamat, en wijst ook de twee steden Rechob in Aser aan als minder waarschijnlijke lezingen. Onder die naam is niets opgegraven, en het verdwijnt uit de geschiedenis zodra Damascus de kleine Aramese staten opslokte."
  sv:
    - "Detta Rehov är det arameiska landet längst i norr, sannolikt detsamma som Bet-Rehov. Spejarna som Mose sände ”bespejade landet från öknen Sin ända till Rehob, där vägen går till Hamat”, så att Rehov markerar landets norra ände; och när ammoniterna lejde arameiska trupper mot David, heter det att ”de från Aram-Soba och Rehob, ävensom Tobs män och maakatéerna, ställde upp sig för sig själva på fältet”, medan ammoniterna stod vid stadsporten; Joav slog araméerna på flykten och Avishaj ammoniterna. I den synodala bibeln är spejarnas vers 4 Mos 13:22."
    - "Dess säte är okänt. Kartan följer dem som likställer det med Bet-Rehov, ritat i Bekaadalen i Libanon på vägen till Hamat, och markerar också de två städerna kallade Rehov i Asher som mindre sannolika läsningar. Ingenting har grävts ut under namnet, och det försvinner ur historien när Damaskus uppslukade de små arameiska staterna."
  nb:
    - "Dette Rehob er det arameiske landet langt i nord, trolig det samme som Bet-Rehob. Spionene som Moses sendte, «utspeidet landet fra ørkenen Sin til Rehob, bortimot Hamat», slik at Rehob markerer landets nordlige ende; og da ammonittene leide arameiske tropper mot David, «stod syrerne fra Soba og Rehob og mennene fra Tob og Ma'aka for sig selv på marken», mens ammonittene stilte opp foran byporten; Joab slo arameerne på flukt og Abisjai ammonittene. I den synodale bibelen er spionverset 4. Mosebok 13,22."
    - "Stedet er ukjent. Kartet følger dem som setter det lik Bet-Rehob, tegnet i Beqaa-dalen i Libanon på veien til Hamat, og markerer også de to byene som heter Rehob i Asjer som mindre sannsynlige lesninger. Ingenting er gravd ut under navnet, og det forsvinner fra historien når Damaskus absorberte de små arameiske statene."
scripture:
  - Num.13.21
  - 2Sam.10.6-2Sam.10.14
