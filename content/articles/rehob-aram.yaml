# Overview article (ADR 0007). Mainstream facts only; Rehob of Aram, usually taken as Beth-rehob; its seat is unknown and the candidates on the map are given without choosing.
id: rehob-aram
place: ae4cd38
title:
  en: "Rehob"
  ru: "Рехов"
  uk: "Рехов"
  es: "Rehob"
  pt: "Reobe"
  de: "Rehob"
  fr: "Rehob"
body:
  en:
    - "This Rehob is the Aramaean land in the far north, probably the same as Beth-rehob. The spies sent by Moses “searched the land from the wilderness of Zin unto Rehob, as men come to Hamath”, so that Rehob marks the northern end of the land; and when the Ammonites hired Aramaean troops against David, “the Syrians of Zoba, and of Rehob, and Ish-tob, and Maacah, were by themselves in the field” before the city gate, where Joab and Abishai routed them. In the Synodal Bible the spies' verse is Numbers 13:22."
    - "Its seat is unknown. The map follows those who equate it with Beth-rehob, drawn in the Beqaa valley of Lebanon on the road to Hamath, and also marks the two towns called Rehob in Asher as less likely readings. Nothing has been excavated under the name, and it disappears from history once Damascus absorbed the small Aramaean states."
  ru:
    - "Этот Рехов — арамейская земля на крайнем севере, вероятно, то же, что Беф-Рехов. Соглядатаи, посланные Моисеем, «высмотрели землю от пустыни Син даже до Рехова, близ Емафа», так что Рехов отмечает северный предел земли; а когда Аммонитяне наняли против Давида арамейские войска, «Сирийцы Сувы и Рехова, и Истова, и Маахи, стали отдельно в поле» перед воротами города, где их разбили Иоав и Авесса. В Синодальной Библии стих о соглядатаях — Числа 13:22."
    - "Где был его центр, неизвестно. Карта следует тем, кто отождествляет его с Беф-Реховом, и помещает его в долине Бекаа в Ливане, на дороге к Емафу, а также отмечает два города Рехов в Асире как менее вероятные прочтения. Под этим именем ничего не раскопано, и после того как Дамаск поглотил мелкие арамейские государства, Рехов исчезает из истории."
  uk:
    - "Цей Рехов — арамейська земля на далекій півночі, ймовірно, та сама, що й Бет-Рехов. Розвідники, послані Мойсеєм, «розгледїли землю від Зин степу до Регобу, як ійти до Гамату», тож Рехов позначає північний кінець краю; а коли аммонітяни найняли арамейські війська проти Давида, «Сирийцї Сабські й Рехобські, та Істобські й Маахські розставились у чистому полі» перед міською брамою, де Йоав і Авішай їх розбили. У Синодальній Біблії вірш про розвідників — Числа 13:22."
    - "Його осідок невідомий. Карта йде за тими, хто ототожнює його з Бет-Реховом, нанесеним у долині Бекаа в Лівані на шляху до Хамата, і позначає також два міста під назвою Рехов в Асірі як менш імовірні прочитання. Під цією назвою нічого не розкопано, і він зникає з історії, коли Дамаск поглинув дрібні арамейські держави."
  es:
    - "Este Rehob es la tierra aramea del extremo norte, probablemente la misma que Bet-rehob. Los espías enviados por Moisés «reconocieron la tierra desde el desierto de Zin hasta Rehob, entrando en Emath», de modo que Rehob marca el extremo septentrional de la tierra; y cuando los amonitas contrataron tropas arameas contra David, «los Siros de Soba, y de Rehob, y de Is-tob, y de Maaca, estaban de por sí en el campo» ante la puerta de la ciudad, donde Joab y Abisai los derrotaron. En la Biblia sinodal el versículo de los espías es Números 13:22."
    - "Se desconoce su sede. El mapa sigue a quienes la equiparan con Bet-rehob, situada en el valle de la Becá, en el Líbano, en el camino a Hamat, y señala también las dos ciudades llamadas Rehob en Aser como lecturas menos probables. No se ha excavado nada bajo este nombre, y desaparece de la historia cuando Damasco absorbió los pequeños Estados arameos."
  pt:
    - "Esta Reobe é a terra aramaica do extremo norte, provavelmente a mesma que Bete-Reobe. Os espias enviados por Moisés “espiaram a terra desde o deserto de Zim até Reobe, à entrada de Hamate”, de modo que Reobe marca o limite norte da terra; e quando os amonitas contrataram tropas arameias contra Davi, “Os sírios de Zobá e de Reobe, e os homens de Tobe e de Maaca, estavam sozinhos no campo” diante da porta da cidade, onde Joabe e Abisai os derrotaram. Na Bíblia Sinodal o versículo dos espias é Números 13:22."
    - "Sua sede é desconhecida. O mapa segue os que a equiparam a Bete-Reobe, situada no vale da Beqaa, no Líbano, na estrada de Hamate, e marca também as duas cidades chamadas Reobe em Aser como leituras menos prováveis. Nada foi escavado sob esse nome, e ela desaparece da história quando Damasco absorveu os pequenos Estados arameus."
  de:
    - "Dieses Rehob ist das aramäische Land im äußersten Norden, wahrscheinlich dasselbe wie Bet-Rehob. Die Kundschafter des Mose „erkundeten das Land von der Wüste Zin bis gen Rehob, da man gen Hamath geht“, sodass Rehob das Nordende des Landes markiert; und als die Ammoniter aramäische Truppen gegen David dingten, „Die Syrer aber von Zoba, von Rehob, von Is-Tob und von Maacha waren allein im Felde“ vor dem Stadttor, wo Joab und Abisai sie in die Flucht schlugen. In der Synodalübersetzung ist der Vers der Kundschafter Numeri 13,22."
    - "Sein Sitz ist unbekannt. Die Karte folgt denen, die es mit Bet-Rehob gleichsetzen, im Bekaa-Tal des Libanon an der Straße nach Hamat eingezeichnet, und markiert auch die beiden Orte namens Rehob in Asser als weniger wahrscheinliche Lesarten. Unter dem Namen wurde nichts ausgegraben, und es verschwindet aus der Geschichte, sobald Damaskus die kleinen aramäischen Staaten aufnahm."
  fr:
    - "Ce Rehob est le pays araméen de l’extrême nord, probablement le même que Beth-Rehob. Les explorateurs envoyés par Moïse « explorèrent le pays, depuis le désert de Tsin jusqu’à Rehob, sur le chemin de Hamath », de sorte que Rehob marque l’extrémité nord du pays ; et quand les Ammonites engagèrent des troupes araméennes contre David, « les Syriens de Tsoba et de Rehob, et les hommes de Tob et de Maaca, étaient à part dans la campagne » devant la porte de la ville, où Joab et Abischaï les mirent en déroute. Dans la Bible synodale russe, le verset des explorateurs est Nombres 13:22."
    - "Son siège est inconnu. La carte suit ceux qui l’identifient à Beth-Rehob, dessinée dans la vallée de la Bekaa, au Liban, sur la route de Hamath, et marque aussi les deux villes appelées Rehob en Aser comme lectures moins probables. Rien n’a été fouillé sous ce nom, et il disparaît de l’histoire quand Damas absorba les petits États araméens."
