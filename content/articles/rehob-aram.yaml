# Overview article (ADR 0007). Mainstream facts only; Rehob of Aram, usually taken as Beth-rehob; its seat is unknown and the candidates on the map are given without choosing.
id: rehob-aram
place: ae4cd38
title:
  en: "Rehob"
  ru: "Рехов"
body:
  en:
    - "This Rehob is the Aramaean land in the far north, probably the same as Beth-rehob. The spies sent by Moses “searched the land from the wilderness of Zin unto Rehob, as men come to Hamath”, so that Rehob marks the northern end of the land; and when the Ammonites hired Aramaean troops against David, “the Syrians of Zoba, and of Rehob, and Ish-tob, and Maacah, were by themselves in the field” before the city gate, where Joab and Abishai routed them. In the Synodal Bible the spies' verse is Numbers 13:22."
    - "Its seat is unknown. The map follows those who equate it with Beth-rehob, drawn in the Beqaa valley of Lebanon on the road to Hamath, and also marks the two towns called Rehob in Asher as less likely readings. Nothing has been excavated under the name, and it disappears from history once Damascus absorbed the small Aramaean states."
  ru:
    - "Этот Рехов — арамейская земля на крайнем севере, вероятно, то же, что Беф-Рехов. Соглядатаи, посланные Моисеем, «высмотрели землю от пустыни Син даже до Рехова, близ Емафа», так что Рехов отмечает северный предел земли; а когда Аммонитяне наняли против Давида арамейские войска, «Сирийцы Сувы и Рехова, и Истова, и Маахи, стали отдельно в поле» перед воротами города, где их разбили Иоав и Авесса. В Синодальной Библии стих о соглядатаях — Числа 13:22."
    - "Где был его центр, неизвестно. Карта следует тем, кто отождествляет его с Беф-Реховом, и помещает его в долине Бекаа в Ливане, на дороге к Емафу, а также отмечает два города Рехов в Асире как менее вероятные прочтения. Под этим именем ничего не раскопано, и после того как Дамаск поглотил мелкие арамейские государства, Рехов исчезает из истории."
scripture:
  - Num.13.21
  - 2Sam.10.6-2Sam.10.8
sources:
  - "B. Mazar, 'The Aramean Empire and Its Relations with Israel', Biblical Archaeologist 25 (1962)"
  - "W. T. Pitard, Ancient Damascus (1987)"
  - "P. K. McCarter, II Samuel (Anchor Bible, 1984)"
