body:
  en:
    - "Hushah is a town of Judah known from a single line of genealogy and from the hero called the Hushathite after it. Chronicles lists “Ezer the father of Hushah” among “the sons of Hur, the firstborn of Ephratah, the father of Beth-lehem”, which places it in the hill country around Bethlehem. On the strength of the name it is usually identified with Husan, a village about 7 km west of Bethlehem near Battir, the ancient Betar; nothing has been excavated there, and the identification is likely rather than proved."
    - "The town's fame is Sibbecai the Hushathite, one of David's heroes. In a battle with the Philistines at Gob, which Chronicles places at Gezer, he “slew Saph, which was of the sons of the giant”; he stands in the list of the thirty, where the book of Samuel calls him Mebunnai the Hushathite; and in David's twelve monthly divisions he was “the eighth captain for the eighth month”, of the clan of Zerah, with twenty-four thousand men. Beyond this the Bible says nothing of Hushah, and no later writer names it."
    - "Husan today is a Palestinian village in the Bethlehem governorate, on the road from Bethlehem to Battir, with terraced olive groves and springs; the settlement of Betar Illit stands on the ridge above it."
  ru:
    - "Хуша — город Иуды, известный по одной строке родословия и по герою, которого звали по нему Хушатянином. Паралипоменон называет «Езер, отец Хуша» среди сыновей «Хура, первенца Ефрафы, отца Вифлеема», что помещает его в горы вокруг Вифлеема. По созвучию имени его обычно отождествляют с Хусаном, селением примерно в 7 км к западу от Вифлеема близ Баттира, древнего Бетара; раскопок там не было, и отождествление скорее вероятно, чем доказано."
    - "Слава города — Совохай Хушатянин, один из храбрых Давида. В битве с Филистимлянами в Гобе, которую Паралипоменон помещает в Газер, он «убил Сафута, одного из потомков Рефаимов»; он стоит в списке тридцати, где книга Царств зовёт его Мебуннаем Хушатянином, а в двенадцати месячных отделениях Давида он «Восьмой, для восьмого месяца», из племени Зары, с двадцатью четырьмя тысячами. Больше Библия о Хуше ничего не говорит, и никто из позднейших писателей её не называет."
    - "Хусан сегодня — палестинское селение в мухафазе Вифлеем, на дороге из Вифлеема в Баттир, с террасами олив и источниками; на гребне над ним стоит поселение Бейтар-Илит."
  uk:
    - "Хуша — місто Юди, відоме з одного рядка родоводу та з героя, названого за ним хушатянином. Хроніки перелічують «Езер, батько Хушів» серед «Оце сини в Гура, найстаршого в Ефратї, Бетлеємського батька (князя)», що розміщує його в гірській країні довкола Вифлеєма. На підставі назви його зазвичай ототожнюють з Хусаном, селом приблизно за 7 км на захід від Вифлеєма біля Баттіра, давнього Бетара; там нічого не розкопували, і ототожнення радше ймовірне, ніж доведене."
    - "Слава міста — Совохай Хушатянин, один із героїв Давида. У битві з філістимлянами в Гобі, яку Хроніки поміщають у Гезері, він «побив Сафа, одного з нащадків Рефаїмових»; він стоїть у переліку тридцяти, де Книга Самуїла називає його Мебуннай із Гуші; а в Давидових дванадцяти місячних відділах він був «Восьмий, на восьмий місяць, Совохай, з Хушату», з роду Зераха, з двадцятьма чотирма тисячами людей. Понад це Біблія про Хушу нічого не каже, і жоден пізніший автор її не називає."
    - "Хусан сьогодні — палестинське село в Вифлеємському окрузі, на дорозі від Вифлеєма до Баттіра, з терасованими оливковими гаями та джерелами; поселення Бейтар-Ілліт стоїть на хребті над ним."
  es:
    - "Husa es una población de Judá conocida por una sola línea de genealogía y por el héroe llamado el husatita por ella. Crónicas enumera a «Ezer padre de Husa» entre «los hijos de Hur, primogénito de Ephrata, padre de Beth-lehem», lo que la sitúa en la región montañosa en torno a Belén. Por el nombre suele identificarse con Husan, una aldea a unos 7 km al oeste de Belén, cerca de Battir, la antigua Betar; allí no se ha excavado nada, y la identificación es probable más que demostrada."
    - "La fama de la población es Sibecai el husatita, uno de los héroes de David. En una batalla con los filisteos en Gob, que Crónicas sitúa en Gezer, «hirió á Saph, que era de los hijos del gigante»; figura en la lista de los treinta, donde el libro de Samuel lo llama Mebunnai el husatita; y en las doce divisiones mensuales de David fue «El octavo para el octavo mes», del clan de Zera, con veinticuatro mil hombres. Más allá de esto la Biblia no dice nada de Husa, y ningún escritor posterior la nombra."
    - "Husan es hoy una aldea palestina de la gobernación de Belén, en el camino de Belén a Battir, con olivares en terrazas y manantiales; el asentamiento de Betar Illit se alza en la loma sobre ella."
  pt:
    - "Husa é uma cidade de Judá conhecida por uma só linha de genealogia e pelo herói chamado o husatita por causa dela. Crônicas lista “Ezer o pai de Husá” entre “os filhos de Hur, o primogênito de Efrata, o pai de Belém”, o que a situa na região montanhosa em torno de Belém. Pela força do nome, é usualmente identificada com Husan, uma aldeia a cerca de 7 km a oeste de Belém, perto de Battir, a antiga Betar; nada foi escavado ali, e a identificação é provável e não provada."
    - "A fama da cidade é Sibecai, o husatita, um dos heróis de Davi. Numa batalha com os filisteus em Gobe, que Crônicas situa em Gezer, ele “matou Safe, que era dos descendentes do gigante”; consta da lista dos trinta, onde o livro de Samuel o chama Mebunai, o husatita; e nas doze divisões mensais de Davi foi “O oitavo comandante para o oitavo mês”, do clã de Zera, com vinte e quatro mil homens. Além disso a Bíblia nada diz de Husa, e nenhum escritor posterior a nomeia."
    - "Husan é hoje uma aldeia palestina na província de Belém, na estrada de Belém a Battir, com olivais em terraços e fontes; o povoado de Betar Illit fica na crista acima dela."
  de:
    - "Huscha ist eine Stadt Judas, bekannt aus einer einzigen Zeile eines Geschlechtsregisters und aus dem nach ihr benannten Helden, dem Husathiter. Die Chronik führt „Eser, der Vater Husas“ auf: „Das sind die Kinder Hurs, des ersten Sohnes der Ephrata, des Vaters Bethlehems“, was es im Bergland um Bethlehem verortet. Wegen des Namens wird es meist mit Husan gleichgesetzt, einem Dorf etwa 7 km westlich von Bethlehem bei Battir, dem antiken Betar; dort ist nichts ausgegraben, und die Gleichsetzung ist wahrscheinlich, aber nicht bewiesen."
    - "Der Ruhm der Stadt ist Sibbechai, der Husathiter, einer von Davids Helden. In einer Schlacht mit den Philistern bei Gob, das die Chronik nach Geser verlegt, „schlug“ er „den Saph, welcher auch der Kinder Raphas einer war“; er steht in der Liste der Dreißig, wo das Samuelbuch ihn Mebunnai, den Husathiter, nennt; und in Davids zwölf Monatsabteilungen war er „der achte im achten Monat“, aus den Serahitern, „und unter seiner Ordnung waren vierundzwanzigtausend“. Darüber hinaus sagt die Bibel nichts von Huscha, und kein späterer Schriftsteller nennt es."
    - "Husan ist heute ein palästinensisches Dorf im Gouvernement Bethlehem an der Straße von Bethlehem nach Battir, mit terrassierten Olivenhainen und Quellen; die Siedlung Betar Illit steht auf dem Höhenzug darüber."
  fr:
    - "Huscha est une ville de Juda connue par une seule ligne de généalogie et par le héros appelé le Huschatite d’après elle. Les Chroniques énumèrent « Ézer père de Huscha » parmi « les fils de Hur, premier-né d’Éphrata, père de Bethléhem », ce qui la place dans la montagne autour de Bethléhem. D’après le nom, on l’identifie d’ordinaire à Husan, un village à environ 7 km à l’ouest de Bethléhem près de Battir, l’ancienne Béthar ; rien n’y a été fouillé, et l’identification est probable plutôt que prouvée."
    - "La gloire de la ville est Sibbecaï le Huschatite, l’un des héros de David. Dans une bataille contre les Philistins à Gob, que les Chroniques placent à Guézer, il « tua Saph, qui était un des enfants de Rapha » ; il figure dans la liste des trente, où le livre de Samuel l’appelle Mebunnaï de Huscha ; et dans les douze divisions mensuelles de David, il était « le huitième, pour le huitième mois », de la famille des Zérachites, avec vingt-quatre mille hommes. Au-delà, la Bible ne dit rien de Huscha, et aucun écrivain postérieur ne la nomme."
    - "Husan est aujourd’hui un village palestinien du gouvernorat de Bethléem, sur la route de Bethléem à Battir, avec des oliveraies en terrasses et des sources ; la colonie de Betar Illit se dresse sur la crête au-dessus."
  pl:
    - "Chusza to miasto Judy znane z jednej linii rodowodu i z bohatera od niego zwanego Chuszatytą. Księgi Kronik wymieniają „Ezer ojciec Hosy” wśród potomków Hura: „synowie Hura, pierworodnego Efraty, ojca Betlehemczyków”, co umieszcza je w górach wokół Betlejem. Na podstawie nazwy utożsamia się je zwykle z Chusan, wsią około 7 km na zachód od Betlejem koło Battir, starożytnego Betar; nic tam nie wykopano, a utożsamienie jest prawdopodobne, nie udowodnione."
    - "Sławą miasta jest Sibbekaj Chuszatyta, jeden z bohaterów Dawida. W bitwie z Filistynami w Gob, którą Księgi Kronik umieszczają w Gezer, „zabił Sobochaj Husatycki Safa, który był z synów tegoż olbrzyma”; stoi w wykazie trzydziestu, gdzie Księga Samuela nazywa go Mebunnajem Chuszatytą; a w dwunastu miesięcznych podziałach Dawida: „Osmy miesiąca ósmego był Sobochaj Husatczyk z Zarchejczyków, a w podziale jego dwadzieścia i cztery tysiące”. Poza tym Biblia nic o Chuszy nie mówi, a żaden późniejszy pisarz jej nie wymienia."
    - "Chusan to dziś palestyńska wieś w prowincji Betlejem, przy drodze z Betlejem do Battir, z tarasowymi gajami oliwnymi i źródłami; osiedle Betar Illit stoi na grzbiecie nad nią."
  it:
    - "Cusa è una città di Giuda nota da una sola riga di genealogia e dall’eroe detto il Cusatita da essa. Le Cronache elencano «Ezer, padre di Husha» fra i «figliuoli di Hur, primogenito di Efrata, padre di Bethlehem», il che la colloca sui monti attorno a Betlemme. In base al nome è di solito identificata con Husan, un villaggio circa 7 km a ovest di Betlemme presso Battir, l’antica Betar; nulla vi è stato scavato, e l’identificazione è probabile più che provata."
    - "La fama della città è Sibbecai il Cusatita, uno degli eroi di Davide. In una battaglia con i Filistei a Gob, che le Cronache collocano a Ghezer, «uccise Saf, uno dei discendenti di Rafa»; compare nell’elenco dei trenta, dove il libro di Samuele lo chiama Mebunnai il Cusatita; e nelle dodici divisioni mensili di Davide era «L’ottavo, per l’ottavo mese», del clan di Zerach, con ventiquattromila uomini. Oltre a ciò la Bibbia non dice nulla di Cusa, e nessuno scrittore posteriore la nomina."
    - "Husan è oggi un villaggio palestinese nel governatorato di Betlemme, sulla strada da Betlemme a Battir, con uliveti a terrazze e sorgenti; l’insediamento di Betar Illit sorge sulla dorsale sopra di esso."
  nl:
    - "Chusa is een stad van Juda die bekend is uit één regel in een geslachtsregister en uit de held die ernaar de Husathiet heet. Kronieken noemt “Ezer de vader van Husah” onder “de kinderen van Hur, den eerstgeborene van Efratha, den vader van Bethlehem”, wat haar in het bergland rond Bethlehem plaatst. Op grond van de naam wordt zij gewoonlijk vereenzelvigd met Husan, een dorp ongeveer 7 km ten westen van Bethlehem bij Battir, het oude Betar; daar is niets opgegraven, en de identificatie is waarschijnlijk maar niet bewezen."
    - "De roem van de stad is Sibbekai de Husathiet, een van Davids helden. In een veldslag met de Filistijnen te Gob, die Kronieken te Gezer plaatst, sloeg hij “Saf, die van de kinderen van Rafa was”; hij staat in de lijst van de dertig, waar het boek Samuël hem Mebunnai de Husathiet noemt; en in Davids twaalf maandelijkse afdelingen was hij “de achtste, in de achtste maand”, van het geslacht van Zerach, met vierentwintigduizend man. Verder zegt de Bijbel niets over Chusa, en geen latere schrijver noemt het."
    - "Husan is nu een Palestijns dorp in het gouvernement Bethlehem, aan de weg van Bethlehem naar Battir, met terrassen van olijfgaarden en bronnen; de nederzetting Betar Illit staat op de bergrug erboven."
  cs:
    - "Chuša je judské město známé z jediného řádku rodokmenu a z hrdiny zvaného podle něj Chušatský. Letopisy uvádějí „Ezer otec Chusův“ v oddílu, který začíná: „Ti jsou synové Hur prvorozeného Efraty, otce Betlémských“, což je klade do pahorkatiny kolem Betléma. Podle jména se obvykle ztotožňuje s Chusánem, vesnicí asi 7 km západně od Betléma u Battíru, starověkého Betaru; nic tam nebylo vykopáno a ztotožnění je pravděpodobné, nikoli dokázané."
    - "Slávou města je Sibekaj Chušatský, jeden z Davidových hrdinů. V bitvě s Pelištejci u Góbu, kterou Letopisy kladou do Gezeru, „Sibbechai Chusatský zabil Sáfu, kterýž byl z synů téhož obra“; stojí v seznamu třiceti, kde jej kniha Samuelova nazývá Mebunaj Chušatský; a v Davidových dvanácti měsíčních oddílech byl „Osmého na osmý měsíc Sibbechai Chusatský z Zarchejských“, z rodu Zerachova, s čtyřiadvaceti tisíci muži. Mimo to Bible o Chuše nic neříká a žádný pozdější pisatel ji nejmenuje."
    - "Chusán je dnes palestinská vesnice v betlémské gubernii, na cestě z Betléma do Battíru, s terasovitými olivovými háji a prameny; osada Betar Illit stojí na hřebeni nad ní."
  sv:
    - "Husha är en stad i Juda känd från en enda rad i en släkttavla och från hjälten som kallas husatiten efter den. Krönikeboken nämner ”Eser, Husas fader” bland ”söner till Hur, Efratas förstfödde, Bet-Lehems fader”, vilket placerar den i bergsbygden kring Betlehem. Utifrån namnet identifieras den vanligen med Husan, en by omkring 7 km väster om Betlehem nära Battir, det antika Betar; ingenting har grävts ut där, och identifieringen är sannolik snarare än bevisad."
    - "Stadens ryktbarhet är Sibbekaj husatiten, en av Davids hjältar. I en strid med filistéerna vid Gob, som Krönikeboken förlägger till Geser, ”slog då ned Saf, en av rafaéernas avkomlingar”, heter det om honom; han står i listan över de trettio, där Samuelsboken kallar honom Mebunnaj husatiten; och bland Davids tolv månadsavdelningar står det: ”Den åttonde, den som tjänstgjorde under åttonde månaden, var husatiten Sibbekai”, av seraiternas släkt, med tjugufyra tusen man. Utöver detta säger Bibeln inget om Husha, och ingen senare författare nämner den."
    - "Husan är i dag en palestinsk by i guvernementet Betlehem, vid vägen från Betlehem till Battir, med terrasserade olivlundar och källor; bosättningen Betar Illit ligger på åsen ovanför."
  nb:
    - "Husja er en by i Juda kjent fra én linje i en slektsliste og fra helten som er kalt husatitten etter den. Krønikebøkene oppfører «Eser var far til Husa; de var sønner av Hur, Efratas førstefødte sønn og far til Betlehem», som plasserer den i fjellandet rundt Betlehem. Ut fra navnet identifiseres den vanligvis med Husan, en landsby omtrent 7 km vest for Betlehem nær Battir, det gamle Betar; ingenting er gravd ut der, og identifikasjonen er sannsynlig snarere enn bevist."
    - "Byens berømmelse er Sibbekai husatitten, en av Davids helter. I et slag mot filistrene ved Gob, som Krønikebøkene plasserer ved Geser, «slo husatitten Sibbekai Saf, som hørte til Rafas barn»; han står i listen over de tretti, der Samuelsbøkene kaller ham husatitten Mebunnai; og i Davids tolv månedlige avdelinger var han «Den åttende, som gjorde tjeneste i den åttende måned», av Serahs ætt, med fire og tyve tusen mann. Utover dette sier Bibelen ingenting om Husja, og ingen senere forfatter nevner den."
    - "Husan er i dag en palestinsk landsby i Betlehem-guvernementet, ved veien fra Betlehem til Battir, med terrasserte oliventrær og kilder; bosetningen Betar Illit ligger på ryggen over den."
  tl:
    - "Ang Husa ay isang bayan ng Juda na kilala mula sa isang linya ng talaangkanan at mula sa bayaning tinatawag na Husatita dahil dito. Itinatala ng Mga Cronica ang “si Ezer na ama ni Husa” sa “mga anak ni Hur, na panganay ni Ephrata, na ama ni Bethlehem”, na naglalagay dito sa maburol na lupain sa palibot ng Bethlehem. Batay sa pangalan, karaniwan itong itinutugma sa Husan, isang nayon na mga 7 km sa kanluran ng Bethlehem malapit sa Battir, ang sinaunang Betar; wala pang hinukay doon, at malamang ngunit hindi pa napatutunayan ang pagkakakilanlan."
    - "Ang katanyagan ng bayan ay si Sibechai na Husatita, isa sa mga bayani ni David. Sa isang labanan sa mga Filisteo sa Gob, na inilalagay ng Mga Cronica sa Gezer, “sinaktan ni Sibechai na Husathita si Saph, na sa mga anak ng higante”; nasa talaan siya ng tatlumpu, kung saan tinatawag siyang Mebunai na Husatita ng aklat ni Samuel; at sa labindalawang buwanang pangkat ni David siya ang “ikawalong pinuno sa ikawalong buwan”, sa mga Zarahita, na may dalawampu't apat na libong tao. Higit dito ay wala nang sinasabi ang Biblia tungkol sa Husa, at walang huling manunulat na nagbanggit nito."
    - "Ang Husan ngayon ay isang nayong Palestino sa Bethlehem governorate, sa daan mula Bethlehem patungong Battir, na may mga hagdan-hagdang taniman ng olibo at mga bukal; ang pamayanang Betar Illit ay nakatayo sa tagaytay sa itaas nito."
  da:
    - "Husja er en by i Juda, kendt fra en enkelt linje i et slægtsregister og fra helten, der kaldes husatitten efter den. Krønikebøgerne opregner »Eser var Husas Fader« blandt »Børn af Hur, som var Efratas førstefødte, Bethlehems Fader«, hvilket placerer den i bjerglandet omkring Betlehem. På grundlag af navnet identificeres den sædvanligvis med Husan, en landsby omkring 7 km vest for Betlehem nær Battir, det gamle Betar; intet er udgravet der, og identifikationen er sandsynlig snarere end bevist."
    - "Byens ry er husatitten Sibbekaj, en af Davids helte. I et slag med filisterne ved Gob, som Krønikebøgerne placerer ved Gezer, hedder det: »da slog Husathiteren Sibkaj Saf, som var af Rafas Børn«; han står i listen over de tredive, hvor Samuelsbogen kalder ham Mebunnaj husatitten; og i Davids tolv månedlige afdelinger var han »Den ottende i den ottende Maaned«, af Zerahs slægt, med fireogtyve tusind mand. Ud over dette siger Bibelen intet om Husja, og ingen senere forfatter nævner den."
    - "Husan er i dag en palæstinensisk landsby i Betlehem-guvernementet, på vejen fra Betlehem til Battir, med terrasserede olivenlunde og kilder; bosættelsen Betar Illit ligger på højderyggen over den."
