body:
  en:
    - "Adummim, “the red ones”, is the steep ascent on the road from Jericho up to Jerusalem, named for the red rock of the hillside. Joshua uses it twice as a landmark on the border between Judah and Benjamin: the line runs past Gilgal, or Geliloth, “that is before the going up to Adummim, which is on the south side of the river”, the river being the Wadi Qelt. Eusebius knew the place as Maledomni, on the road down from Jerusalem to Jericho, and Jerome, explaining the name as “the place of blood” for the blood that robbers shed there, connected it with the parable of the traveller who went down from Jerusalem to Jericho and fell among thieves."
    - "The Crusaders held a small castle on the red hill above the road, whose ruins remain; the Ottoman khan beside it, long shown to travellers as the Inn of the Good Samaritan, is now a museum of mosaics; and the Israeli city of Ma'ale Adumim, founded east of Jerusalem in 1975, takes its name from the ascent. The modern highway from Jerusalem to Jericho and the Dead Sea still climbs the same slope."
  ru:
    - "Адуммим, «красные», — крутой подъём на дороге из Иерихона в Иерусалим, названный по красной породе склона. Книга Иисуса Навина дважды берёт его ориентиром на границе Иуды и Вениамина: предел проходит мимо Галгала, или Гелилофа, «который против возвышенности Адуммима, лежащего с южной стороны потока», и поток этот — Вади-Кельт. Евсевий знал это место как Маледомни на дороге из Иерусалима в Иерихон, а Иероним, толкуя имя как «место крови» — от крови, которую проливали там разбойники, — связал его с притчей о путнике, который шёл из Иерусалима в Иерихон и попался разбойникам."
    - "Крестоносцы держали на красном холме над дорогой небольшой замок, развалины которого сохранились; османский постоялый двор рядом, который долго показывали путешественникам как гостиницу доброго самарянина, теперь музей мозаик; а израильский город Маале-Адумим, основанный к востоку от Иерусалима в 1975 году, носит имя этого подъёма. Современное шоссе из Иерусалима в Иерихон и к Мёртвому морю всё так же поднимается по этому склону."
  uk:
    - "Адуммім, «червоні», — стрімкий підйом на дорозі від Єрихону до Єрусалима, названий за червону скелю схилу. Ісус Навин двічі використовує його як орієнтир на межі між Юдою та Веніяміном: лінія проходить повз Гілгал, або Гелілот, «що стоїть навпроти проходу Адуммимського, що навпроти річки на полуднї», а річка — це вадій Кельт. Євсевій знав це місце як Маледомні на дорозі, що спускається з Єрусалима до Єрихону, а Єронім, пояснюючи назву як «місце крові» через кров, яку там проливали розбійники, пов'язав його з притчею про мандрівника, що йшов з Єрусалима до Єрихону й потрапив до розбійників."
    - "Хрестоносці тримали невеликий замок на червоному пагорбі над дорогою, руїни якого лишилися; османський хан поруч, який довго показували мандрівникам як заїзд Доброго Самарянина, нині є музеєм мозаїк; а ізраїльське місто Маале-Адумім, засноване на схід від Єрусалима в 1975 році, бере назву від цього підйому. Сучасна траса з Єрусалима до Єрихону та Мертвого моря й досі піднімається тим самим схилом."
  es:
    - "Adumim, «los rojos», es la empinada cuesta del camino que sube de Jericó a Jerusalén, llamada así por la roca roja de la ladera. Josué la usa dos veces como mojón en la frontera entre Judá y Benjamín: la línea pasa por Gilgal, o Gelilot, «que está delante de la subida de Adumin, la cual está al mediodía del arroyo», siendo el arroyo el uadi Qelt. Eusebio conocía el lugar como Maledomni, en el camino que baja de Jerusalén a Jericó, y Jerónimo, que explicaba el nombre como «el lugar de la sangre» por la sangre que allí derramaban los ladrones, lo relacionó con la parábola del viajero que descendía de Jerusalén a Jericó y cayó en manos de ladrones."
    - "Los cruzados mantuvieron un pequeño castillo en la colina roja sobre el camino, cuyas ruinas subsisten; el kan otomano que hay junto a él, mostrado durante mucho tiempo a los viajeros como la Posada del Buen Samaritano, es hoy un museo de mosaicos; y la ciudad israelí de Ma'ale Adumim, fundada al este de Jerusalén en 1975, toma su nombre de la cuesta. La carretera moderna de Jerusalén a Jericó y al mar Muerto sigue subiendo por la misma ladera."
  pt:
    - "Adumim, “os vermelhos”, é a subida íngreme da estrada que leva de Jericó a Jerusalém, assim chamada pela rocha vermelha da encosta. Josué a usa duas vezes como marco na fronteira entre Judá e Benjamim: a linha passa por Gilgal, ou Gelilote, “que fica em frente à subida de Adumim, que está no lado sul do ribeiro”, sendo o ribeiro o uádi Qelt. Eusébio conhecia o lugar como Maledomni, na estrada que desce de Jerusalém a Jericó, e Jerônimo, explicando o nome como “o lugar do sangue” pelo sangue que ali derramavam os salteadores, relacionou-o com a parábola do viajante que descia de Jerusalém a Jericó e caiu nas mãos de ladrões."
    - "Os cruzados mantiveram um pequeno castelo na colina vermelha acima da estrada, cujas ruínas subsistem; o cã otomano ao lado, durante muito tempo mostrado aos viajantes como a Estalagem do Bom Samaritano, é hoje um museu de mosaicos; e a cidade israelense de Maale Adumim, fundada a leste de Jerusalém em 1975, toma o nome da subida. A rodovia moderna de Jerusalém a Jericó e ao mar Morto ainda sobe a mesma encosta."
  de:
    - "Adummim, „die Roten“, ist die steile Steige an der Straße von Jericho hinauf nach Jerusalem, benannt nach dem roten Fels des Hangs. Josua nennt sie zweimal als Wegmarke an der Grenze zwischen Juda und Benjamin: Die Linie führt an Gilgal oder Gelilot vorbei, das „gegenüber der Steige Adummim“ liegt, „die mittagwärts vom Wasser liegt“, wobei das Wasser der Wadi Qelt ist. Eusebius kannte den Ort als Maledomni an der Straße von Jerusalem hinab nach Jericho, und Hieronymus, der den Namen als „Ort des Blutes“ nach dem Blut erklärte, das Räuber dort vergossen, brachte ihn mit dem Gleichnis vom Reisenden in Verbindung, der von Jerusalem nach Jericho hinabging und unter die Räuber fiel."
    - "Die Kreuzfahrer hielten eine kleine Burg auf dem roten Hügel über der Straße, deren Ruinen bestehen; die osmanische Karawanserei daneben, Reisenden lange als Herberge des barmherzigen Samariters gezeigt, ist heute ein Mosaikmuseum; und die israelische Stadt Ma'ale Adummim, 1975 östlich von Jerusalem gegründet, trägt den Namen der Steige. Die moderne Straße von Jerusalem nach Jericho und zum Toten Meer steigt noch immer an demselben Hang."
  fr:
    - "Adummim, « les rouges », est la montée escarpée de la route qui va de Jéricho à Jérusalem, ainsi nommée d’après la roche rouge du versant. Josué l’emploie deux fois comme repère sur la frontière entre Juda et Benjamin : la ligne passe par Guilgal, ou Guelilôth, « qui est vis-à-vis de la montée d’Adummim au sud du torrent », ce torrent étant le Wadi Qelt. Eusèbe connaissait le lieu sous le nom de Maledomni, sur la route qui descend de Jérusalem à Jéricho, et Jérôme, expliquant le nom par « lieu du sang », à cause du sang que les brigands y versaient, le rattacha à la parabole du voyageur qui descendait de Jérusalem à Jéricho et tomba parmi les voleurs."
    - "Les croisés tinrent un petit château sur la colline rouge au-dessus de la route, dont les ruines subsistent ; le khan ottoman voisin, longtemps montré aux voyageurs comme l’auberge du Bon Samaritain, est aujourd’hui un musée de mosaïques ; et la ville israélienne de Maalé Adoumim, fondée à l’est de Jérusalem en 1975, tient son nom de la montée. L’autoroute moderne de Jérusalem à Jéricho et à la mer Morte gravit encore la même pente."
  it:
    - "Adummim, «i rossi», è l’erta salita sulla strada da Gerico a Gerusalemme, così chiamata dalla roccia rossa del pendio. Giosuè la usa due volte come punto di riferimento sul confine tra Giuda e Beniamino: la linea passa per Gàlgala, o Gelilot, «che è dirimpetto alla salita di Adummim, a sud del torrente», il torrente essendo il Wadi Qelt. Eusebio conosceva il luogo come Maledomni, sulla strada che scende da Gerusalemme a Gerico, e Girolamo, spiegando il nome come «luogo del sangue» per il sangue che i briganti vi versavano, lo collegò alla parabola del viaggiatore che scendeva da Gerusalemme a Gerico e cadde fra i ladroni."
    - "I crociati tennero un piccolo castello sulla collina rossa sopra la strada, le cui rovine restano; il khan ottomano accanto, per lungo tempo mostrato ai viaggiatori come la Locanda del Buon Samaritano, è ora un museo di mosaici; e la città israeliana di Ma’ale Adumim, fondata a est di Gerusalemme nel 1975, prende il nome dalla salita. La moderna strada da Gerusalemme a Gerico e al Mar Morto sale ancora lungo lo stesso pendio."
  pl:
    - "Adummim, „Czerwone”, to stromy podjazd na drodze z Jerycha w górę do Jerozolimy, nazwany od czerwonej skały zbocza. Jozue dwukrotnie używa go jako punktu orientacyjnego na granicy między Judą a Beniaminem: linia biegnie obok Gilgal, czyli Gelilot, „które jest przeciw górze, gdzie wstępują do Adommim, która jest na południe od rzeki”, a rzeką jest Wadi Qelt. Euzebiusz znał to miejsce jako Maledomni, przy drodze w dół z Jerozolimy do Jerycha, a Hieronim, tłumacząc tę nazwę jako „miejsce krwi” od krwi przelewanej tam przez zbójców, związał je z przypowieścią o podróżnym, który szedł z Jerozolimy do Jerycha i wpadł między zbójców."
    - "Krzyżowcy mieli mały zamek na czerwonym wzgórzu nad drogą, którego ruiny trwają; osmański chan obok, od dawna pokazywany podróżnym jako Gospoda Dobrego Samarytanina, jest dziś muzeum mozaik; a izraelskie miasto Ma'ale Adummim, założone na wschód od Jerozolimy w 1975 roku, bierze nazwę od tego podjazdu. Nowoczesna szosa z Jerozolimy do Jerycha i nad Morze Martwe wciąż wspina się tym samym zboczem."
  nl:
    - "Adummim, “de rode”, is de steile helling aan de weg van Jericho omhoog naar Jeruzalem, genoemd naar het rode gesteente van de berghelling. Jozua gebruikt haar tweemaal als oriëntatiepunt op de grens tussen Juda en Benjamin: de lijn loopt langs Gilgal, of Gelilot, “hetwelk tegen den opgang van Adummim is, die aan het zuiden der beek is”, waarbij de beek de Wadi Qelt is. Eusebius kende de plaats als Maledomni, aan de weg die van Jeruzalem naar Jericho afdaalt, en Hieronymus, die de naam verklaarde als “plaats van bloed”, naar het bloed dat rovers daar vergoten, bracht haar in verband met de gelijkenis van de reiziger die van Jeruzalem naar Jericho afdaalde en onder de rovers viel."
    - "De kruisvaarders hielden een klein kasteel op de rode heuvel boven de weg, waarvan de ruïnes resteren; de Ottomaanse khan ernaast, lang aan reizigers getoond als de Herberg van de Barmhartige Samaritaan, is nu een mozaïekmuseum; en de Israëlische stad Ma’ale Adumim, in 1975 ten oosten van Jeruzalem gesticht, ontleent haar naam aan de helling. De moderne snelweg van Jeruzalem naar Jericho en de Dode Zee beklimt nog altijd dezelfde helling."
  cs:
    - "Adumím, „červení“, je příkrý výstup na cestě z Jericha vzhůru do Jeruzaléma, pojmenovaný podle červené skály svahu. Jozue ho dvakrát užívá jako orientační bod na hranici mezi Judou a Benjamínem: čára vede kolem Gilgalu neboli Gelilótu, „kteréž jest naproti vcházení do Adomim, jenž jest údolí tomu ku poledni“, přičemž tím údolím je vádí Qelt. Eusebios znal místo jako Maledomni, na cestě dolů z Jeruzaléma do Jericha, a Jeroným, který jméno vykládal jako „místo krve“ podle krve, kterou tam prolévali lupiči, je spojil s podobenstvím o poutníkovi, jenž šel z Jeruzaléma do Jericha a upadl mezi lotry."
    - "Křižáci drželi na červeném pahorku nad cestou malou pevnost, jejíž zříceniny se dochovaly; osmanský chán vedle ní, dlouho ukazovaný poutníkům jako Hostinec dobrého Samaritána, je nyní muzeem mozaik; a izraelské město Ma'ale Adumim, založené východně od Jeruzaléma v roce 1975, má jméno podle tohoto výstupu. Moderní silnice z Jeruzaléma do Jericha a k Mrtvému moři stoupá stále po témž svahu."
  sv:
    - "Adummim, ”de röda”, är den branta stigningen på vägen från Jeriko upp till Jerusalem, uppkallad efter sluttningens röda berg. Josua använder den två gånger som landmärke på gränsen mellan Juda och Benjamin: linjen löper förbi Gilgal, eller Gelilot, ”som ligger mitt emot Adummimshöjden, söder om bäcken”, där bäcken är Wadi Qelt. Eusebios kände platsen som Maledomni, på vägen ned från Jerusalem till Jeriko, och Hieronymus, som förklarade namnet som ”blodets plats” efter det blod som rövare utgöt där, förband det med liknelsen om resenären som gick ned från Jerusalem till Jeriko och föll i rövares händer."
    - "Korsfararna höll en liten borg på den röda höjden ovanför vägen, vars ruiner finns kvar; den osmanska khanen bredvid, som länge visades för resenärer som Den barmhärtige samariens värdshus, är nu ett mosaikmuseum; och den israeliska staden Ma'ale Adumim, grundad öster om Jerusalem 1975, har fått sitt namn efter stigningen. Den moderna landsvägen från Jerusalem till Jeriko och Döda havet klättrar fortfarande uppför samma sluttning."
  nb:
    - "Adummim, «de røde», er den bratte stigningen på veien fra Jeriko opp til Jerusalem, oppkalt etter den røde bergarten i skråningen. Josva bruker den to ganger som landemerke på grensen mellom Juda og Benjamin: linjen går forbi Gilgal, eller Gelilot, «som ligger midt imot Adummim-skaret sønnenfor bekken», der bekken er Wadi Qelt. Eusebius kjente stedet som Maledomni, på veien ned fra Jerusalem til Jeriko, og Hieronymus, som forklarte navnet som «blodets sted» på grunn av blodet røvere utøste der, knyttet det til lignelsen om den reisende som gikk ned fra Jerusalem til Jeriko og falt iblandt røvere."
    - "Korsfarerne holdt en liten borg på den røde høyden over veien, hvis ruiner står igjen; den osmanske karavanserajen ved siden av, lenge vist reisende som Den barmhjertige samaritans herberge, er nå et mosaikkmuseum; og den israelske byen Ma'ale Adumim, grunnlagt øst for Jerusalem i 1975, har fått navn etter stigningen. Den moderne hovedveien fra Jerusalem til Jeriko og Dødehavet klatrer fortsatt opp den samme skråningen."
  tl:
    - "Ang Adummim, “ang mga pula”, ay ang matarik na pag-akyat sa daan mula Jerico paakyat ng Jerusalem, na ipinangalan sa pulang bato ng dalisdis. Ginagamit ito ni Josue nang dalawang beses bilang palatandaan sa hangganan ng Juda at Benjamin: dumaraan ang guhit sa Gilgal, o Geliloth, “na nasa tapat ng pagsampa sa Adumin, na nasa dakong timugan ng ilog”, ang ilog ay ang Wadi Qelt. Kilala ni Eusebio ang lugar bilang Maledomni, sa daang pababa mula Jerusalem patungong Jerico, at si Jeronimo, na nagpaliwanag sa pangalan bilang “dako ng dugo” dahil sa dugong ibinuhos ng mga tulisan doon, ay iniugnay ito sa talinghaga ng manlalakbay na bumaba mula Jerusalem patungong Jerico at nahulog sa mga tulisan."
    - "Hawak ng mga Krusado ang isang maliit na kastilyo sa pulang burol sa itaas ng daan, na ang mga guho ay nananatili; ang khan na Otomano sa tabi nito, na matagal na ipinakita sa mga manlalakbay bilang Bahay-Tuluyan ng Mabuting Samaritano, ay isa nang museo ng mga mosaiko; at ang lungsod ng Ma'ale Adumim sa Israel, na itinatag sa silangan ng Jerusalem noong 1975, ay kumuha ng pangalan mula sa pag-akyat. Ang makabagong lansangan mula Jerusalem patungong Jerico at Dagat na Patay ay umaakyat pa rin sa parehong dalisdis."
  da:
    - "Adummim, »de røde«, er den stejle stigning på vejen fra Jeriko op til Jerusalem, opkaldt efter bakkesidens røde klippe. Josva bruger det to gange som landemærke på grænsen mellem Juda og Benjamin: linjen løber forbi Gilgal, eller Gelilot, »som ligger tværs overfor Opgangen til Adummim, som er Sønden for Bækken«, hvor bækken er Wadi Qelt. Eusebius kendte stedet som Maledomni, på vejen ned fra Jerusalem til Jeriko, og Hieronymus, der forklarede navnet som »blodets sted« efter det blod, røvere udgød dér, knyttede det til lignelsen om den rejsende, der gik ned fra Jerusalem til Jeriko og faldt iblandt røvere."
    - "Korsfarerne holdt en lille borg på den røde bakke over vejen, hvis ruiner består; den osmanniske khan ved siden af, længe vist for rejsende som Den Barmhjertige Samaritans Kro, er nu et mosaikmuseum; og den israelske by Ma'ale Adumim, grundlagt øst for Jerusalem i 1975, har navn efter stigningen. Den moderne hovedvej fra Jerusalem til Jeriko og Det Døde Hav stiger stadig op ad den samme skråning."
