body:
  en:
    - "Myra lay in Lycia, on the south coast of Asia Minor, beside modern Demre in Turkey. It stood on the river Myros a little inland, and its harbour was Andriake at the river's mouth; Strabo places the city twenty stadia above the sea on a lofty hill. In the cliffs above the town the Lycians carved tombs shaped like houses and temple fronts, many of them in the fourth century BC. Silt from the river has since buried much of the lower city."
    - "Myra was one of the six largest cities of the Lycian League, which, Strabo says, cast three votes each in its common council. Under Rome the league kept its own government until Claudius took away the Lycians' freedom because of their feuds and made Lycia a province. Under Hadrian a large granary was built at Andriake."
    - "Paul, sent to Rome as a prisoner in the charge of a centurion named Julius, sailed along the coast of Asia, crossed the sea of Cilicia and Pamphylia and came to Myra. There the centurion found a ship of Alexandria sailing into Italy and put the prisoners on board. It was this ship, carrying wheat, that was later wrecked on Malta."
    - "In the reign of Antoninus Pius a violent earthquake overthrew the cities of Lycia, and the emperor paid for their rebuilding; the large theatre at Myra was restored after it. In the fourth century Nicholas was bishop of Myra; little is known of his life for certain, and his presence at the Council of Nicaea in 325 is first reported in later lists. In late antiquity Myra was the chief city of the province of Lycia and the seat of its metropolitan bishop."
  ru:
    - "Миры лежали в Ликии, на южном берегу Малой Азии, рядом с нынешним Демре в Турции. Город стоял на реке Мирос, немного в глубине суши, а его гаванью была Андриака в устье реки; Страбон помещает город в двадцати стадиях от моря, на высоком холме. В скалах над городом ликийцы высекали гробницы в виде домов и фасадов храмов, многие из них — в IV веке до н. э. С тех пор речной ил погрёб значительную часть нижнего города."
    - "Миры были одним из шести крупнейших городов Ликийского союза, которые, по словам Страбона, имели по три голоса в общем совете. Под властью Рима союз сохранял собственное управление, пока Клавдий не отнял у ликийцев свободу из-за их распрей и не сделал Ликию провинцией. При Адриане в Андриаке построили большую житницу."
    - "Павел, отправленный в Рим узником под надзором сотника по имени Юлий, плыл вдоль берегов Асии, переплыл море против Киликии и Памфилии и прибыл в Миры Ликийские. Там сотник нашёл Александрийский корабль, плывущий в Италию, и посадил узников на него. Этот корабль, везший пшеницу, потом разбился у Мелита."
    - "При Антонине Пии сильное землетрясение разрушило города Ликии, и император дал средства на их восстановление; большой театр в Мирах после этого отстроили заново. В IV веке епископом Мир был Николай; о его жизни достоверно известно немногое, а его участие в Никейском соборе 325 г. впервые упоминается в более поздних списках. В поздней античности Миры были главным городом провинции Ликия и кафедрой её митрополита."
  uk:
    - "Мири лежали в Лікії, на південному узбережжі Малої Азії, біля сучасного Демре в Туреччині. Вони стояли на ріці Мірос трохи вглиб суходолу, а їхня гавань — Андріака в гирлі ріки; Страбон розміщує місто за двадцять стадій від моря на високому пагорбі. У скелях над містом лікійці висікли гробниці у формі будинків і фасадів храмів, багато з них у IV ст. до н. е. Мул ріки відтоді поховав значну частину нижнього міста."
    - "Мири були одним із шести найбільших міст Лікійського союзу, який, за Страбоном, мав по три голоси в спільній раді. За Риму союз зберігав власне управління, аж поки Клавдій не позбавив лікійців свободи через їхні чвари й не зробив Лікію провінцією. За Адріана в Андріаці збудували велике зерносховище."
    - "Павла, відправленого до Риму як в’язня під опікою сотника на ім’я Юлій, везли вздовж берега Азії, через море Кілікії та Памфілії, і він прибув до Мир. Там сотник знайшов александрійський корабель, що плив до Італії, і посадив в’язнів на борт. Саме цей корабель, що віз пшеницю, пізніше розбився біля Мальти."
    - "За правління Антоніна Пія сильний землетрус зруйнував міста Лікії, і імператор оплатив їх відбудову; великий театр у Мирах було відновлено після нього. У IV ст. Миколай був єпископом Мир; про його життя відомо мало певного, а його присутність на Нікейському соборі 325 р. вперше згадана в пізніших переліках. У пізній античності Мири були головним містом провінції Лікія й осідком її митрополичого єпископа."
  es:
    - "Mira se hallaba en Licia, en la costa meridional de Asia Menor, junto a la actual Demre, en Turquía. Se alzaba sobre el río Myros, algo tierra adentro, y su puerto era Andriake, en la desembocadura del río; Estrabón sitúa la ciudad a veinte estadios sobre el mar, en una elevada colina. En los acantilados sobre la ciudad los licios tallaron tumbas con forma de casas y frentes de templos, muchas de ellas en el siglo IV a. C. El limo del río ha enterrado desde entonces gran parte de la ciudad baja."
    - "Mira era una de las seis mayores ciudades de la Liga Licia, que, dice Estrabón, emitía tres votos cada una en su consejo común. Bajo Roma la liga conservó su propio gobierno hasta que Claudio quitó la libertad a los licios por sus querellas y convirtió Licia en provincia. Bajo Adriano se construyó un gran granero en Andriake."
    - "Pablo, enviado a Roma como prisionero bajo la custodia de un centurión llamado Julio, navegó a lo largo de la costa de Asia, cruzó el mar de Cilicia y Panfilia y llegó a Mira. Allí el centurión halló una nave de Alejandría que navegaba a Italia y puso a los presos a bordo. Fue esta nave, que llevaba trigo, la que más tarde naufragó en Malta."
    - "En el reinado de Antonino Pío un violento terremoto derribó las ciudades de Licia, y el emperador pagó su reconstrucción; el gran teatro de Mira fue restaurado después. En el siglo IV Nicolás fue obispo de Mira; poco se sabe con certeza de su vida, y su presencia en el Concilio de Nicea en 325 se informa por primera vez en listas posteriores. En la antigüedad tardía Mira fue la ciudad principal de la provincia de Licia y sede de su obispo metropolitano."
  pt:
    - "Mira ficava na Lícia, na costa sul da Ásia Menor, ao lado da atual Demre, na Turquia. Erguia-se no rio Myros, um pouco para o interior, e seu porto era Andriake, na foz do rio; Estrabão situa a cidade a vinte estádios do mar numa colina elevada. Nos penhascos acima da cidade os lícios esculpiram túmulos em forma de casas e fachadas de templos, muitos deles no século IV a.C. O limo do rio enterrou desde então grande parte da cidade baixa."
    - "Mira foi uma das seis maiores cidades da Liga Lícia, que, diz Estrabão, dava três votos cada uma em seu conselho comum. Sob Roma a liga manteve seu próprio governo até que Cláudio tirou a liberdade dos lícios por causa de suas contendas e fez da Lícia uma província. Sob Adriano construiu-se um grande celeiro em Andriake."
    - "Paulo, enviado a Roma como prisioneiro sob a guarda de um centurião chamado Júlio, navegou ao longo da costa da Ásia, atravessou o mar da Cilícia e da Panfília e chegou a Mira. Ali o centurião achou um navio de Alexandria que navegava para a Itália e pôs os prisioneiros a bordo. Foi esse navio, carregado de trigo, que mais tarde naufragou em Malta."
    - "No reinado de Antonino Pio, um violento terremoto derrubou as cidades da Lícia, e o imperador pagou sua reconstrução; o grande teatro de Mira foi restaurado depois dele. No século IV, Nicolau foi bispo de Mira; pouco se sabe com certeza de sua vida, e sua presença no Concílio de Niceia em 325 é relatada primeiro em listas posteriores. Na Antiguidade tardia, Mira foi a principal cidade da província da Lícia e sede de seu bispo metropolita."
  de:
    - "Myra lag in Lykien an der Südküste Kleinasiens, beim heutigen Demre in der Türkei. Es stand etwas landeinwärts am Fluss Myros, und sein Hafen war Andriake an der Flussmündung; Strabon setzt die Stadt zwanzig Stadien über dem Meer auf einen hohen Hügel. In die Felsen über der Stadt meißelten die Lykier Gräber in Form von Häusern und Tempelfronten, viele davon im 4. Jahrhundert v. Chr. Der Schlick des Flusses hat große Teile der Unterstadt seither begraben."
    - "Myra war eine der sechs größten Städte des Lykischen Bundes, der nach Strabon im gemeinsamen Rat je drei Stimmen abgab. Unter Rom behielt der Bund seine eigene Regierung, bis Klaudius den Lykiern wegen ihrer Fehden die Freiheit nahm und Lykien zur Provinz machte. Unter Hadrian wurde in Andriake ein großer Speicher gebaut."
    - "Paulus, als Gefangener unter der Obhut eines Hauptmanns namens Julius nach Rom gesandt, fuhr an der Küste Asiens entlang, durchquerte das Meer von Kilikien und Pamphylien und kam nach Myra. Dort fand der Hauptmann ein Schiff aus Alexandria, das nach Italien fuhr, und brachte die Gefangenen an Bord. Dieses Schiff, mit Weizen beladen, scheiterte später vor Malta."
    - "Unter Antoninus Pius stürzte ein heftiges Erdbeben die Städte Lykiens, und der Kaiser zahlte ihren Wiederaufbau; das große Theater von Myra wurde danach wiederhergestellt. Im 4. Jahrhundert war Nikolaus Bischof von Myra; von seinem Leben ist wenig sicher bekannt, und seine Anwesenheit beim Konzil von Nicäa 325 wird erst in späteren Listen berichtet. In der Spätantike war Myra die Hauptstadt der Provinz Lykien und Sitz ihres Metropoliten."
  fr:
    - "Myra se trouvait en Lycie, sur la côte sud de l’Asie Mineure, à côté de l’actuelle Demre en Turquie. Elle se dressait sur le fleuve Myros un peu à l’intérieur des terres, et son port était Andriaké à l’embouchure du fleuve ; Strabon place la ville à vingt stades au-dessus de la mer sur une haute colline. Dans les falaises au-dessus de la ville, les Lyciens taillèrent des tombes en forme de maisons et des façades de temples, beaucoup au IVe siècle av. J.-C. Les alluvions du fleuve ont depuis enseveli une grande partie de la ville basse."
    - "Myra était l’une des six plus grandes villes de la Ligue lycienne, qui, dit Strabon, avait trois voix chacune dans son conseil commun. Sous Rome, la ligue garda son propre gouvernement jusqu’à ce que Claude ôte aux Lyciens leur liberté à cause de leurs querelles et fasse de la Lycie une province. Sous Hadrien, un grand grenier fut construit à Andriaké."
    - "Paul, envoyé à Rome comme prisonnier sous la garde d’un centurion nommé Julius, longea la côte d’Asie, traversa la mer de Cilicie et de Pamphylie et arriva à Myra. Là, le centurion trouva un navire d’Alexandrie à destination de l’Italie et y fit monter les prisonniers. C’est ce navire, chargé de blé, qui fut plus tard naufragé à Malte."
    - "Sous le règne d’Antonin le Pieux, un violent tremblement de terre renversa les villes de Lycie, et l’empereur paya leur reconstruction ; le grand théâtre de Myra fut restauré après lui. Au IVe siècle, Nicolas fut évêque de Myra ; on sait peu de sa vie avec certitude, et sa présence au concile de Nicée en 325 n’est rapportée que par des listes plus tardives. À la fin de l’Antiquité, Myra était la principale ville de la province de Lycie et le siège de son évêque métropolitain."
  it:
    - "Mira sorgeva in Licia, sulla costa meridionale dell’Asia Minore, presso l’odierna Demre in Turchia. Sorgeva sul fiume Myros, un po’ nell’entroterra, e il suo porto era Andriace alla foce del fiume; Strabone pone la città a venti stadi dal mare su un’alta collina. Nelle rupi sopra la città i Lici scolpirono tombe a forma di case e facciate di tempio, molte nel IV secolo a.C. I sedimenti del fiume hanno poi sepolto gran parte della città bassa."
    - "Mira era una delle sei maggiori città della Lega licia, che, dice Strabone, esprimeva tre voti ciascuna nel consiglio comune. Sotto Roma la lega conservò un proprio governo finché Claudio tolse ai Lici la libertà a causa delle loro contese e fece della Licia una provincia. Sotto Adriano fu costruito a Andriace un grande granaio."
    - "Paolo, inviato a Roma come prigioniero sotto la custodia di un centurione di nome Giulio, navigò lungo la costa dell’Asia, attraversò il mare di Cilicia e di Panfilia e giunse a Mira. Là il centurione trovò una nave alessandrina che faceva vela per l’Italia e vi fece salire i prigionieri. Fu questa nave, carica di grano, a naufragare poi a Malta."
    - "Sotto Antonino Pio un violento terremoto abbatté le città della Licia, e l’imperatore pagò la loro ricostruzione; il grande teatro di Mira fu restaurato dopo di esso. Nel IV secolo Nicola fu vescovo di Mira; poco si sa di certo della sua vita, e la sua presenza al Concilio di Nicea nel 325 è riferita per la prima volta in elenchi più tardi. Nella tarda antichità Mira era la città principale della provincia di Licia e sede del suo vescovo metropolita."
  pl:
    - "Mira leżała w Licji, na południowym wybrzeżu Azji Mniejszej, obok dzisiejszego Demre w Turcji. Stała nad rzeką Myros nieco w głębi lądu, a jej portem było Andriake u ujścia rzeki; Strabon umieszcza miasto dwadzieścia stadiów nad morzem na wysokim wzgórzu. W klifach nad miastem Licyjczycy wykuli grobowce w kształcie domów i fasad świątyń, wiele z nich w IV w. p.n.e. Muł rzeki pogrzebał od tamtej pory większą część dolnego miasta."
    - "Mira była jednym z sześciu największych miast Związku Licyjskiego, który, jak mówi Strabon, miał po trzy głosy każde w swej wspólnej radzie. Pod Rzymem związek zachował własny rząd, aż Klaudiusz odebrał Licyjczykom wolność z powodu ich waśni i uczynił z Licji prowincję. Za Hadriana w Andriake zbudowano duży spichlerz."
    - "Paweł, wysłany do Rzymu jako więzień pod opieką setnika imieniem Juliusz, płynął wzdłuż wybrzeża Azji, przepłynął morze Cylicji i Pamfilii i przybył do Miry. Tam setnik znalazł okręt aleksandryjski płynący do Italii i wsadził na niego więźniów. To właśnie ten okręt, wiozący pszenicę, został później rozbity koło Malty."
    - "Za Antonina Piusa gwałtowne trzęsienie ziemi zniszczyło miasta Licji, a cesarz zapłacił za ich odbudowę; wielki teatr w Mirze został po nim odnowiony. W IV w. biskupem Miry był Mikołaj; niewiele wiadomo o jego życiu na pewno, a jego obecność na Soborze Nicejskim w 325 r. jest po raz pierwszy zapisana w późniejszych listach. W późnej starożytności Mira była głównym miastem prowincji Licji i siedzibą jej biskupa metropolity."
  nl:
    - "Myra lag in Lycië, aan de zuidkust van Klein-Azië, naast het huidige Demre in Turkije. Het lag aan de rivier de Myros wat landinwaarts, en zijn haven was Andriake aan de riviermonding; Strabo plaatst de stad twintig stadiën boven de zee op een hoge heuvel. In de kliffen boven de stad hakten de Lyciërs graven in de vorm van huizen en tempelgevels, veel ervan in de vierde eeuw v.Chr. Slib van de rivier heeft sindsdien een groot deel van de benedenstad bedolven."
    - "Myra was een van de zes grootste steden van de Lycische Bond, die, zegt Strabo, elk drie stemmen uitbracht in zijn gemeenschappelijke raad. Onder Rome behield de bond zijn eigen bestuur tot Claudius de Lyciërs hun vrijheid ontnam wegens hun twisten en van Lycië een provincie maakte. Onder Hadrianus werd bij Andriake een grote graanschuur gebouwd."
    - "Paulus, als gevangene naar Rome gestuurd onder bewaking van een hoofdman genaamd Julius, voer langs de kust van Asia, stak de zee van Cilicië en Pamfylië over en kwam te Myra. Daar vond de hoofdman een schip van Alexandrië dat naar Italië voer en zette de gevangenen aan boord. Dit schip, dat tarwe vervoerde, leed later schipbreuk op Malta."
    - "Onder Antoninus Pius wierp een hevige aardbeving de steden van Lycië omver, en de keizer betaalde de wederopbouw; het grote theater van Myra werd erna hersteld. In de vierde eeuw was Nicolaas bisschop van Myra; weinig is met zekerheid over zijn leven bekend, en zijn aanwezigheid op het Concilie van Nicea in 325 wordt voor het eerst in latere lijsten vermeld. In de late oudheid was Myra de hoofdstad van de provincie Lycië en de zetel van haar metropoliet."
  cs:
    - "Myra ležela v Lykii, na jižním pobřeží Malé Asie, vedle dnešního Demre v Turecku. Stála na řece Myros kousek ve vnitrozemí a její přístav byl Andriake při ústí řeky; Strabón klade město dvacet stadií nad moře na vysoký pahorek. Ve skalách nad městem vytesali Lykijci hrobky ve tvaru domů a chrámových průčelí, mnohé ve 4. století př. n. l. Naplaveniny řeky od té doby pohřbily velkou část dolního města."
    - "Myra byla jedním ze šesti největších měst Lykijského spolku, který podle Strabóna dával každé město tři hlasy ve společné radě. Za Říma si spolek zachoval vlastní správu, dokud Klaudius Lykijcům pro jejich sváry nevzal svobodu a neučinil z Lykie provincii. Za Hadriana byla v Andriake postavena velká sýpka."
    - "Pavel, poslaný do Říma jako vězeň pod dohledem setníka jménem Julius, plul podél pobřeží Asie, přeplul moře Kilikie a Pamfylie a přišel do Myry. Tam setník nalezl alexandrijskou loď plující do Itálie a vězně na ni dal. Byla to tato loď, vezoucí pšenici, která se později roztříštila na Maltě."
    - "Za vlády Antonina Pia zničilo Lykii prudké zemětřesení a císař zaplatil obnovu měst; velké divadlo v Myře bylo po něm obnoveno. Ve 4. století byl Mikuláš biskupem v Myře; o jeho životě je jisté málo a jeho přítomnost na koncilu v Nikaii roku 325 je poprvé hlášena v pozdějších seznamech. V pozdní antice byla Myra hlavním městem provincie Lykie a sídlem jejího metropolity."
  sv:
    - "Myra låg i Lykien på Mindre Asiens sydkust, vid nuvarande Demre i Turkiet. Staden låg vid floden Myros en bit inåt land, och dess hamn var Andriake vid flodens mynning; Strabon placerar staden tjugo stadier ovanför havet på en hög kulle. I klipporna ovanför staden högg lykierna ut gravar formade som hus och tempelfasader, många av dem på 300-talet f.Kr. Slam från floden har sedan dess begravt stora delar av nedre staden."
    - "Myra var en av de sex största städerna i Lykiska förbundet, som enligt Strabon avgav tre röster var i sitt gemensamma råd. Under Rom behöll förbundet sin egen styrelse tills Claudius tog ifrån lykierna deras frihet på grund av deras stridigheter och gjorde Lykien till en provins. Under Hadrianus byggdes ett stort spannmålsmagasin i Andriake."
    - "Paulus, som sändes till Rom som fånge under uppsikt av en centurion vid namn Julius, seglade längs Asiens kust, korsade havet utanför Kilikien och Pamfylien och kom till Myra. Där fann centurionen ett alexandrinskt skepp på väg till Italien och förde fångarna ombord. Det var detta skepp, lastat med vete, som senare led skeppsbrott vid Malta."
    - "Under Antoninus Pius regering omstörtade en våldsam jordbävning städerna i Lykien, och kejsaren bekostade deras återuppbyggnad; den stora teatern i Myra restaurerades efter den. På 300-talet var Nikolaus biskop i Myra; man vet föga säkert om hans liv, och hans närvaro vid konciliet i Nicaea 325 omnämns först i senare förteckningar. Under senantiken var Myra huvudstad i provinsen Lykien och säte för dess metropolit."
  nb:
    - "Myra lå i Lykia, på sørkysten av Lilleasia, ved dagens Demre i Tyrkia. Byen lå ved elven Myros et stykke inne i landet, og havnen var Andriake ved elvemunningen; Strabon plasserer byen tjue stadier over havet på en høy ås. I klippene over byen hogg lykierne ut graver formet som hus og tempelfasader, mange av dem på 300-tallet f.Kr. Slam fra elven har siden begravd mye av nedre by."
    - "Myra var en av de seks største byene i Det lykiske forbund, som ifølge Strabon avga tre stemmer hver i sitt felles råd. Under Roma beholdt forbundet sin egen styreform helt til Klaudius tok fra lykierne friheten på grunn av deres stridigheter og gjorde Lykia til en provins. Under Hadrian ble et stort kornmagasin bygd i Andriake."
    - "Paulus, som var sendt til Roma som fange i en høvedsmanns varetekt, en mann som hette Julius, seilte langs kysten av Asia, krysset havet ved Kilikia og Pamfylia og kom til Myra. Der fant høvedsmannen et skip fra Aleksandria som skulle til Italia, og satte fangene om bord. Det var dette skipet, lastet med hvete, som senere forliste ved Malta."
    - "Under Antoninus Pius ødela et voldsomt jordskjelv byene i Lykia, og keiseren betalte for gjenoppbyggingen; det store teateret i Myra ble restaurert etter det. På 300-tallet var Nikolaus biskop i Myra; lite er sikkert kjent om hans liv, og hans nærvær ved konsilet i Nikea i 325 er først rapportert i senere lister. I senantikken var Myra hovedbyen i provinsen Lykia og sete for dens metropolitt."
