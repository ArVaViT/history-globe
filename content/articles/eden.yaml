body:
  en:
    - "This Eden is not the garden of Genesis but a country on the Euphrates: the Aramaean kingdom of Bit-Adini, “the house of Eden”, which held both banks of the river about its great bend below Carchemish, with its capital at Til Barsip, now Tell Ahmar in Syria. The Assyrians fought it hard in the ninth century BC. Ashurnasirpal II took tribute from its king Ahuni; Shalmaneser III besieged Til Barsip, captured it in 856 BC, renamed it Kar-Shalmaneser and settled Assyrians there, and the next year took Ahuni himself. From then on the land was an Assyrian province, in the eighth century the seat of the powerful commander Shamshi-ilu, who left his own inscriptions on the stone lions at the gate of Til Barsip."
    - "That history is what the Assyrian envoys' message to Hezekiah assumes. Sennacherib's men asked, “Have the gods of the nations delivered them which my fathers have destroyed; as Gozan, and Haran, and Rezeph, and the children of Eden which were in Thelasar?”, and Isaiah's parallel repeats the list with “Telassar”; all four lie in the same Assyrian west, Gozan on the Khabur, Haran and Rezeph on the roads toward the Euphrates, and Telassar, not identified, somewhere in Bit-Adini. Amos threatens “him that holdeth the sceptre from the house of Eden” together with Damascus, probably meaning a ruler of the region in his own day; the map treats this Eden and the Beth-eden of Amos as one place. Ezekiel lists “Haran, and Canneh, and Eden” among the merchants of Tyre, the traders of the upper Euphrates."
    - "Tell Ahmar was excavated by François Thureau-Dangin in 1929–1931, who found the Assyrian governor's palace with its wall paintings, and again by an Australian expedition from 1988; much of the lower town now lies under the reservoir of the Tishrin dam. The village of Tell Ahmar stands on the east bank of the Euphrates south of Jarabulus."
  ru:
    - "Этот Еден — не сад из книги Бытия, а страна на Евфрате: арамейское царство Бит-Адини, «дом Едена», владевшее обоими берегами реки у её большой излучины ниже Кархемиса, со столицей в Тиль-Барсипе, нынешнем Телль-Ахмаре в Сирии. Ассирийцы жестоко воевали с ним в IX веке до н. э. Ашшурнацирапал II брал дань с его царя Ахуни; Салманасар III осадил Тиль-Барсип, взял его в 856 г. до н. э., переименовал в Кар-Салманасар и поселил там ассирийцев, а на следующий год захватил самого Ахуни. С тех пор земля была ассирийской провинцией, в VIII веке — резиденцией могущественного военачальника Шамши-илу, оставившего собственные надписи на каменных львах у ворот Тиль-Барсипа."
    - "Именно эту историю подразумевает послание ассирийских послов Езекии. Люди Сеннахирима спрашивали: «Боги народов, которых разорили отцы мои, спасли ли их? Спасли ли Гозан, и Харан, и Рецеф, и сынов Едена, что в Фалассаре?», и параллель у Исаии повторяет перечень; все четыре места лежат на одном ассирийском западе: Гозан на Хабуре, Харан и Рецеф на дорогах к Евфрату, а Фалассар, не отождествлённый, где-то в Бит-Адини. Амос вместе с Дамаском грозит истребить «держащего скипетр — из дома Еденова», разумея, вероятно, правителя этой области своих дней; на карте этот Еден и Беф-Еден Амоса считаются одним местом. Иезекииль числит «Харан и Хане и Еден» среди купцов Тира, торговцев верхнего Евфрата."
    - "Телль-Ахмар раскапывал Франсуа Тюро-Данжен в 1929–1931 годах, нашедший дворец ассирийского наместника с настенными росписями, а с 1988 года — австралийская экспедиция; бо́льшая часть нижнего города теперь лежит под водохранилищем плотины Тишрин. Деревня Телль-Ахмар стоит на восточном берегу Евфрата к югу от Джараблуса."
  uk:
    - "Цей Еден — не сад із Книги Буття, а країна на Євфраті: арамейське царство Бит-Адіні, «дім Едену», що тримало обидва береги річки навколо її великого вигину нижче Каркемиша, зі столицею Тіль-Барсіп, нині Телль-Ахмар у Сирії. Ассирійці вперто воювали з ним у IX ст. до н. е. Ашшурнасірапал II брав данину в його царя Ахуні; Салманассар III облягав Тіль-Барсіп, здобув його в 856 р. до н. е., перейменував на Кар-Салманассар і оселив там ассирійців, а наступного року взяв і самого Ахуні. Відтоді земля була ассирійською провінцією, у VIII ст. — осередком могутнього полководця Шамшіілу, який залишив власні написи на кам'яних левах біля брами Тіль-Барсіпа."
    - "Саме цю історію передбачає звістка ассирійських послів до Єзекії. Люди Сінаххеріба питали: «Хиба ж боги народів, що їх мої предки в нїщо пообертали, вирятували їх, — як Гозан та Харан та Резеф та людей Еденських у Талассарі?» — а паралельне місце в Ісаї повторює перелік з «в Талассарі»; усі чотири лежать у тому самому ассирійському заході: Гозан на Хабурі, Харан і Рецеф на дорогах до Євфрату, а Телассар, не ототожнений, десь у Бит-Адіні. Амос погрожує «держучого скиптро — із дому роскошів» разом із Дамаском, маючи на увазі, ймовірно, правителя цього краю своєї доби; мапа розглядає цей Еден і Бет-Еден Амоса як одне місце. Єзекіїль перелічує «Гаран і Хане й Еден» серед купців Тиру, торговців верхнього Євфрату."
    - "Телль-Ахмар розкопував Франсуа Тюро-Данжен у 1929–1931 рр., який знайшов палац ассирійського намісника з настінними розписами, і знову австралійська експедиція від 1988 р.; значна частина нижнього міста лежить нині під водосховищем греблі Тішрін. Село Телль-Ахмар стоїть на східному березі Євфрату на південь від Джераблуса."
  es:
    - "Este Edén no es el jardín del Génesis sino un país del Éufrates: el reino arameo de Bit-Adini, «la casa de Edén», que ocupaba ambas orillas del río en torno a su gran recodo por debajo de Carquemis, con su capital en Til Barsip, hoy Tell Ahmar, en Siria. Los asirios lo combatieron con dureza en el siglo IX a. C. Asurnasirpal II cobró tributo a su rey Ahuni; Salmanasar III sitió Til Barsip, la capturó en el 856 a. C., la rebautizó Kar-Salmanasar y asentó allí a asirios, y al año siguiente tomó al propio Ahuni. Desde entonces el territorio fue una provincia asiria, en el siglo VIII sede del poderoso comandante Shamshi-ilu, que dejó sus propias inscripciones en los leones de piedra de la puerta de Til Barsip."
    - "Esa historia es la que presupone el mensaje de los enviados asirios a Ezequías. Los hombres de Senaquerib preguntaron: «¿Libráronlas los dioses de las gentes, que mis padres destruyeron, es á saber, Gozán, y Harán, y Reseph, y los hijos de Edén que estaban en Thalasar?», e Isaías, en el pasaje paralelo, repite la lista con «Thelasar»; los cuatro lugares se hallan en el mismo occidente asirio, Gozán en el Jabur, Harán y Resef en los caminos hacia el Éufrates, y Telasar, sin identificar, en algún punto de Bit-Adini. Amós amenaza a «los gobernadores de Beth-eden» junto con Damasco, en referencia probablemente a un gobernante de la región en su propia época; el mapa trata este Edén y el Bet-edén de Amós como un solo lugar. Ezequiel enumera «Harán, y Canneh, y Edén» entre los mercaderes de Tiro, los comerciantes del alto Éufrates."
    - "Tell Ahmar fue excavado por François Thureau-Dangin en 1929–1931, que halló el palacio del gobernador asirio con sus pinturas murales, y de nuevo por una expedición australiana desde 1988; gran parte de la ciudad baja yace ahora bajo el embalse de la presa de Tishrin. La aldea de Tell Ahmar se halla en la orilla oriental del Éufrates, al sur de Jarabulus."
  pt:
    - "Este Éden não é o jardim do Gênesis, mas um país no Eufrates: o reino arameu de Bit-Adini, “a casa de Éden”, que mantinha as duas margens do rio em torno de sua grande curva abaixo de Carquemis, com capital em Til Barsip, hoje Tell Ahmar, na Síria. Os assírios o combateram duramente no século IX a.C. Assurnasirpal II recebeu tributo de seu rei Ahuni; Salmaneser III sitiou Til Barsip, capturou-a em 856 a.C., rebatizou-a Kar-Salmaneser e fixou assírios ali, e no ano seguinte tomou o próprio Ahuni. Daí em diante a terra foi uma província assíria, no século VIII sede do poderoso comandante Shamshi-ilu, que deixou suas próprias inscrições nos leões de pedra do portão de Til Barsip."
    - "Essa história é o que a mensagem dos enviados assírios a Ezequias pressupõe. Os homens de Senaqueribe perguntaram: “Acaso os deuses das nações as livraram, as quais os meus pais destruíram — Gozã, Harã, Rezefe e os filhos de Éden que estavam em Telassar?”, e o paralelo de Isaías repete a lista; todos os quatro ficam no mesmo oeste assírio, Gozã no Khabur, Harã e Rezefe nas estradas para o Eufrates, e Telassar, não identificada, em algum ponto de Bit-Adini. Amós ameaça “aquele que segura o cetro da casa de Éden” junto com Damasco, referindo-se provavelmente a um governante da região em seu próprio tempo; o mapa trata este Éden e o Bete-Éden de Amós como um só lugar. Ezequiel lista “Harã, Cane, Éden” entre os mercadores de Tiro, os comerciantes do alto Eufrates."
    - "Tell Ahmar foi escavada por François Thureau-Dangin em 1929–1931, que achou o palácio do governador assírio com suas pinturas murais, e de novo por uma expedição australiana a partir de 1988; grande parte da cidade baixa jaz agora sob o reservatório da barragem de Tishrin. A aldeia de Tell Ahmar fica na margem leste do Eufrates, ao sul de Jarabulus."
  de:
    - "Dieses Eden ist nicht der Garten der Genesis, sondern ein Land am Euphrat: das aramäische Königreich Bit-Adini, „Haus Edens“, das beide Ufer des Flusses um seine große Biegung unterhalb von Karkemisch beherrschte, mit der Hauptstadt Til Barsip, dem heutigen Tell Ahmar in Syrien. Die Assyrer bekämpften es im 9. Jahrhundert v. Chr. hart. Assurnasirpal II. nahm Tribut von seinem König Ahuni; Salmanassar III. belagerte Til Barsip, eroberte es 856 v. Chr., nannte es in Kar-Salmanassar um und siedelte dort Assyrer an, und im folgenden Jahr nahm er Ahuni selbst gefangen. Von da an war das Land eine assyrische Provinz, im 8. Jahrhundert Sitz des mächtigen Oberbefehlshabers Schamschi-ilu, der seine eigenen Inschriften auf den Steinlöwen am Tor von Til Barsip hinterließ."
    - "Diese Geschichte setzt die Botschaft der assyrischen Gesandten an Hiskia voraus. Sanheribs Männer fragten: „Haben der Heiden Götter auch sie errettet, welche meine Väter haben verderbt: Gosan, Haran, Rezeph und die Kinder Edens, die zu Thelassar waren?“, und die Parallele bei Jesaja wiederholt die Liste mit „Thelassar“; alle vier liegen im selben assyrischen Westen, Gosan am Chabur, Haran und Rezef an den Straßen zum Euphrat und Telassar, nicht identifiziert, irgendwo in Bit-Adini. Amos droht zusammen mit Damaskus „dem, der das Zepter hält, aus dem Lusthause“, womit wohl ein Herrscher der Region zu seiner eigenen Zeit gemeint ist; die Karte behandelt dieses Eden und das Bet-Eden des Amos als einen Ort. Hesekiel führt „Haran und Kanne und Eden“ unter den Händlern von Tyrus auf, den Kaufleuten des oberen Euphrat."
    - "Tell Ahmar wurde 1929–1931 von François Thureau-Dangin ausgegraben, der den Palast des assyrischen Statthalters mit seinen Wandmalereien fand, und erneut ab 1988 von einer australischen Expedition; ein großer Teil der Unterstadt liegt heute unter dem Stausee des Tischrin-Damms. Das Dorf Tell Ahmar liegt am Ostufer des Euphrat südlich von Dscharabulus."
  fr:
    - "Cet Éden n’est pas le jardin de la Genèse mais un pays sur l’Euphrate : le royaume araméen de Bit-Adini, « la maison d’Éden », qui tenait les deux rives du fleuve autour de sa grande boucle en aval de Carkemisch, avec pour capitale Til Barsip, aujourd’hui Tell Ahmar en Syrie. Les Assyriens le combattirent durement au IXe siècle av. J.-C. Assurnasirpal II prélevait tribut sur son roi Ahuni ; Salmanasar III assiégea Til Barsip, la prit en 856 av. J.-C., la rebaptisa Kar-Salmanasar et y installa des Assyriens, puis prit Ahuni lui-même l’année suivante. Dès lors le pays fut une province assyrienne, au VIIIe siècle le siège du puissant commandant Shamshi-ilu, qui laissa ses propres inscriptions sur les lions de pierre de la porte de Til Barsip."
    - "Cette histoire est ce que suppose le message des envoyés assyriens à Ézéchias. Les gens de Sanchérib demandaient : « Les dieux des nations que mes pères ont détruites les ont-ils délivrées, Gozan, Charan, Retseph, et les fils d’Éden qui sont à Telassar ? », et le passage parallèle d’Ésaïe reprend la liste avec « Telassar » ; les quatre lieux sont dans le même Ouest assyrien, Gozan sur le Khabur, Haran et Retseph sur les routes vers l’Euphrate, et Télassar, non identifiée, quelque part en Bit-Adini. Amos menace avec Damas « de Beth-Éden celui qui tient le sceptre », sans doute un dirigeant de la région à son époque ; la carte traite cet Éden et le Beth-Éden d’Amos comme un seul lieu. Ézéchiel range « Charan, Canné et Éden » parmi les marchands de Tyr, négociants du haut Euphrate."
    - "Tell Ahmar fut fouillé par François Thureau-Dangin en 1929–1931, qui trouva le palais du gouverneur assyrien avec ses peintures murales, puis de nouveau par une expédition australienne à partir de 1988 ; une grande partie de la ville basse repose aujourd’hui sous le réservoir du barrage de Tishrin. Le village de Tell Ahmar se dresse sur la rive est de l’Euphrate, au sud de Jarabulus."
  it:
    - "Questo Eden non è il giardino della Genesi ma un paese sull’Eufrate: il regno aramaico di Bit-Adini, «la casa di Eden», che teneva entrambe le rive del fiume attorno alla sua grande ansa sotto Carchemis, con capitale a Til Barsip, oggi Tell Ahmar in Siria. Gli Assiri lo combatterono duramente nel IX secolo a.C. Assurnasirpal II ricevette tributo dal suo re Ahuni; Salmanàssar III assediò Til Barsip, la prese nell’856 a.C., la ribattezzò Kar-Salmanàssar e vi insediò Assiri, e l’anno dopo prese lo stesso Ahuni. Da allora il paese fu una provincia assira, nell’VIII secolo sede del potente comandante Shamshi-ilu, che lasciò proprie iscrizioni sui leoni di pietra alla porta di Til Barsip."
    - "Questa storia è ciò che presuppone il messaggio degli inviati assiri a Ezechia. Gli uomini di Sennacherib chiesero: «Gli dèi delle nazioni che i miei padri distrussero, gli dèi di Gozan, di Haran, di Retsef, dei figliuoli di Eden ch’erano a Telassar, valsero eglino a liberarle?», e il passo parallelo di Isaia ripete l’elenco; tutti e quattro si trovano nello stesso occidente assiro, Gozan sul Khabur, Carran e Resef sulle strade verso l’Eufrate, e Telassar, non identificata, da qualche parte in Bit-Adini. Amos minaccia, insieme a Damasco, «da Beth-eden colui che tiene lo scettro», probabilmente un sovrano della regione ai suoi giorni; la mappa tratta questo Eden e il Bet-Eden di Amos come un solo luogo. Ezechiele elenca «Haran, Canné e Eden» fra i mercanti di Tiro, i commercianti dell’alto Eufrate."
    - "Tell Ahmar fu scavata da François Thureau-Dangin nel 1929–1931, che trovò il palazzo del governatore assiro con le sue pitture murali, e di nuovo da una spedizione australiana dal 1988; gran parte della città bassa giace ora sotto il bacino della diga di Tishrin. Il villaggio di Tell Ahmar sorge sulla riva orientale dell’Eufrate a sud di Jarabulus."
  pl:
    - "Ten Eden nie jest ogrodem z Księgi Rodzaju, lecz krajem nad Eufratem: aramejskim królestwem Bit-Adini, „domem Edenu”, które trzymało oba brzegi rzeki wokół jej wielkiego zakola poniżej Karkemisz, ze stolicą w Til Barsip, dzisiejszym Tell Ahmar w Syrii. Asyryjczycy walczyli z nim zażarcie w IX w. p.n.e. Aszurnasirpal II pobierał daninę od jego króla Ahuniego; Salmanasar III oblegał Til Barsip, zdobył je w 856 r. p.n.e., przemianował na Kar-Salmanasar i osiedlił tam Asyryjczyków, a w następnym roku pojmał samego Ahuniego. Odtąd kraj był prowincją asyryjską, w VIII w. siedzibą potężnego dowódcy Szamszi-ilu, który zostawił własne inskrypcje na kamiennych lwach przy bramie Til Barsip."
    - "Tę historię zakłada przesłanie asyryjskich posłów do Ezechiasza. Ludzie Sennacheryba pytali: „Izali wybawili bogowie narodów te, które wygubili ojcowie moi, Gozan, i Haran, i Resef, i syny Eden, którzy byli w Telassar?”, a paralelny tekst Izajasza powtarza listę z „Telassar”; wszystkie cztery leżą w tym samym asyryjskim zachodzie, Gozan nad Chaburem, Haran i Resef przy drogach ku Eufratowi, a Telassar, niezidentyfikowane, gdzieś w Bit-Adini. Amos zapowiada, że Pan wykorzeni, razem z Damaszkiem, „tego, który trzyma sceptr z domu Heden”, mając zapewne na myśli władcę tego regionu swoich czasów; mapa traktuje ten Eden i Bet-Eden Amosa jako jedno miejsce. Ezechiel wymienia „Haran, i Kanne, i Eden” wśród kupców Tyru, handlarzy górnego Eufratu."
    - "Tell Ahmar badał François Thureau-Dangin w latach 1929–1931, który znalazł pałac asyryjskiego namiestnika z malowidłami ściennymi, a ponownie australijska wyprawa od 1988 r.; znaczna część dolnego miasta leży dziś pod zbiornikiem tamy Tiszrin. Wieś Tell Ahmar stoi na wschodnim brzegu Eufratu na południe od Dżarabulus."
  nl:
    - "Dit Eden is niet de tuin van Genesis maar een land aan de Eufraat: het Aramese koninkrijk Bit-Adini, “het huis van Eden”, dat beide oevers van de rivier bezat rond haar grote bocht onder Karkemis, met als hoofdstad Til Barsip, nu Tell Ahmar in Syrië. De Assyriërs bestreden het hard in de negende eeuw v.Chr. Assurnasirpal II nam schatting van zijn koning Ahuni; Salmaneser III belegerde Til Barsip, nam het in 856 v.Chr. in, doopte het Kar-Salmaneser en vestigde er Assyriërs, en nam het jaar daarop Ahuni zelf gevangen. Sindsdien was het land een Assyrische provincie, in de achtste eeuw de zetel van de machtige bevelhebber Shamshi-ilu, die zijn eigen inscripties liet op de stenen leeuwen bij de poort van Til Barsip."
    - "Die geschiedenis veronderstelt de boodschap van de Assyrische gezanten aan Chizkia. Sanheribs mannen vroegen: “Hebben de goden der volken, die mijn vaders verdorven hebben, dezelve gered, als Gozan, en Haran, en Rezef, en de kinderen van Eden, die in Telasser waren?”, en het parallelle Jesaja herhaalt de lijst; alle vier liggen in hetzelfde Assyrische westen, Gozan aan de Chabor, Haran en Rezef aan de wegen naar de Eufraat, en Telassar, niet geïdentificeerd, ergens in Bit-Adini. Amos dreigt samen met Damascus “dien, die den scepter houdt, uit Beth-Eden”, waarschijnlijk een heerser van de streek uit zijn eigen tijd; de kaart behandelt dit Eden en het Beth-Eden van Amos als één plaats. Ezechiël noemt “Haran, en Kanne, en Eden” onder de kooplieden van Tyrus, de handelaars van de bovenloop van de Eufraat."
    - "Tell Ahmar werd opgegraven door François Thureau-Dangin in 1929–1931, die het paleis van de Assyrische gouverneur met zijn muurschilderingen vond, en opnieuw door een Australische expeditie vanaf 1988; veel van de benedenstad ligt nu onder het stuwmeer van de Tishrin-dam. Het dorp Tell Ahmar ligt aan de oostoever van de Eufraat ten zuiden van Jarabulus."
  cs:
    - "Tento Eden není zahrada z Genesis, ale země na Eufratu: aramejské království Bít-Adini, „dům Edenu“, které držel oba břehy řeky kolem její velké zátočiny pod Karkemíšem, s hlavním městem Til Barsip, dnešním Tell Ahmar v Sýrii. Asyřané s ním v 9. století př. n. l. tvrdě bojovali. Aššurnasirpal II. přijal tribut od jeho krále Ahuniho; Salmanasar III. obléhal Til Barsip, dobyl je roku 856 př. n. l., přejmenoval je na Kár-Salmanasar a usadil tam Asyřany a následujícího roku zajal i samého Ahuniho. Od té doby byla země asyrskou provincií, v 8. století sídlem mocného velitele Šamši-ila, který zanechal vlastní nápisy na kamenných lvech u brány Til Barsip."
    - "Tato historie je tím, co předpokládá poselství asyrských vyslanců Chizkijášovi. Senacheribovi muži se ptali: „Zdaliž jsou je vysvobodili bohové těch národů, kteréž zahladili otcové moji, totiž Gozana, Charana, Resefa a syny Eden, kteříž byli v Telasar?“ a Izajášův paralelní text opakuje seznam s „Telasar“; všechna čtyři místa leží na stejném asyrském západě, Gózan na Chabúru, Cháran a Resef na cestách k Eufratu a Telassar, neurčený, kdesi v Bít-Adini. Amos ohlašuje zkázu „toho, kterýž drží berlu, z domu Eden“ spolu s Damaškem, míně nejspíš vládce té oblasti své doby; mapa pokládá tento Eden a Bét-eden u Amose za jedno místo. Ezechiel uvádí „Cháran a Kanne i Eden“ mezi kupci Týru, obchodníky horního Eufratu."
    - "Tell Ahmar vykopával François Thureau-Dangin v letech 1929–1931, který našel palác asyrského správce s jeho nástěnnými malbami, a znovu australská expedice od roku 1988; velká část dolního města leží nyní pod nádrží přehrady Tišrín. Vesnice Tell Ahmar stojí na východním břehu Eufratu jižně od Jarabulusu."
  sv:
    - "Detta Eden är inte Första Mosebokens trädgård utan ett land vid Eufrat: det arameiska kungariket Bit-Adini, ”Edens hus”, som höll båda stränderna av floden kring dess stora krök nedanför Karkemish, med huvudstad i Til Barsip, nu Tell Ahmar i Syrien. Assyrierna bekämpade det hårt på 800-talet f.Kr. Assurnasirpal II tog tribut av dess kung Ahuni; Salmanassar III belägrade Til Barsip, intog det 856 f.Kr., döpte om det till Kar-Salmanassar och bosatte assyrier där, och året därpå tog han Ahuni själv. Från den tiden var landet en assyrisk provins, på 700-talet säte för den mäktige fältherren Shamshi-ilu, som lämnade egna inskrifter på stenlejonen vid porten till Til Barsip."
    - "Den historien är vad de assyriska sändebudens budskap till Hiskia förutsätter. Sanheribs män frågade: ”Hava väl de folk som mina fäder fördärvade, Gosan, Haran, Resef och Edens barn i Telassar, blivit räddade av sina gudar?”, och Jesajas parallell upprepar förteckningen; alla fyra ligger i samma assyriska väst, Gosan vid Khabur, Harran och Resef på vägarna mot Eufrat och Telassar, oidentifierat, någonstans i Bit-Adini. Amos hotar ”spirans bärare i Bet-Eden” tillsammans med Damaskus, sannolikt med avseende på en härskare i regionen på hans egen tid; kartan behandlar detta Eden och Amos Bet-Eden som en och samma plats. Hesekiel förtecknar ”Haran, Kanne och Eden” bland Tyros köpmän, handelsmännen vid övre Eufrat."
    - "Tell Ahmar grävdes ut av François Thureau-Dangin 1929–1931, som fann den assyriske guvernörens palats med dess väggmålningar, och åter av en australisk expedition från 1988; stora delar av nedre staden ligger nu under Tishrindammens reservoar. Byn Tell Ahmar ligger på Eufrats östra strand söder om Jarabulus."
  nb:
    - "Dette Eden er ikke hagen i 1. Mosebok, men et land ved Eufrat: det arameiske kongeriket Bit-Adini, «Edens hus», som holdt begge breddene av elven rundt dens store sving nedenfor Karkemisj, med hovedstad i Til Barsip, nå Tell Ahmar i Syria. Assyrerne kjempet hardt mot det på 800-tallet f.Kr. Assurnasirpal II tok tributt fra dets konge Ahuni; Salmanassar III beleiret Til Barsip, inntok den i 856 f.Kr., døpte den om til Kar-Salmanassar og bosatte assyrere der, og tok året etter Ahuni selv. Fra da av var landet en assyrisk provins, på 700-tallet sete for den mektige øverstkommanderende Shamshi-ilu, som etterlot egne innskrifter på steinløvene ved porten til Til Barsip."
    - "Denne historien er forutsetningen for budskapet fra de assyriske sendebudene til Hiskia. Sankeribs menn spurte: «Har vel folkenes guder frelst dem som mine fedre ødela, Gosan og Karan og Resef og Edens barn i Telassar?», og Jesajas parallelle tekst gjentar listen med «Telassar»; alle fire ligger i det samme assyriske vest, Gosan ved Khabur, Harran og Resef ved veiene mot Eufrat, og Telassar, ikke identifisert, et sted i Bit-Adini. Amos truer «den som bærer kongestaven, i Bet-Eden» sammen med Damaskus, trolig med en hersker over regionen i hans egen tid; kartet behandler dette Eden og Amos' Bet-Eden som ett sted. Esekiel fører opp «Karan og Kanne og Eden» blant Tyros' handelsmenn, de øvre Eufrats kjøpmenn."
    - "Tell Ahmar ble gravd ut av François Thureau-Dangin i 1929–1931, som fant den assyriske guvernørens palass med veggmalerier, og igjen av en australsk ekspedisjon fra 1988; mye av underbyen ligger nå under reservoaret til Tishrin-demningen. Landsbyen Tell Ahmar ligger på østbredden av Eufrat sør for Jarabulus."
  tl:
    - "Ang Eden na ito ay hindi ang halamanan ng Genesis kundi isang lupain sa Eufrates: ang kahariang Arameo ng Bit-Adini, “bahay ng Eden”, na humawak sa magkabilang pampang ng ilog sa palibot ng malaking liko nito sa ibaba ng Carchemis, na ang kabisera ay ang Til Barsip, ang Tell Ahmar ngayon sa Siria. Mahigpit na nilabanan ito ng mga Asiryo noong ika-9 na siglo BK. Kumuha ng tributo si Ashurnasirpal II mula sa hari nitong si Ahuni; kinubkob ni Salmanasar III ang Til Barsip, sinakop ito noong 856 BK, pinangalanang Kar-Shalmaneser at nagpatira ng mga Asiryo, at sa sumunod na taon ay kinuha mismo si Ahuni. Mula noon, lalawigang Asiryo ang lupain, at noong ika-8 siglo ay luklukan ng makapangyarihang kumander na si Shamshi-ilu, na nag-iwan ng sarili niyang mga inskripsiyon sa mga batong leon sa pintuan ng Til Barsip."
    - "Ang kasaysayang iyon ang ipinapalagay ng mensahe ng mga sugo ng Asiria kay Ezechias. Tanong ng mga tauhan ni Sennacherib, “Iniligtas ba sila ng mga dios ng mga bansa na nilipol ng aking mga magulang, gaya ng Gozan, at ng Haran, at ng Reseph, at ng mga anak ni Eden na nangasa Thalasar?”, at inuulit ng katulad na talata sa Isaias ang talaan na may “Thelasar”; apat ay nasa gayunding kanluran ng Asiria, ang Gozan sa Khabur, ang Haran at Reseph sa mga daan patungong Eufrates, at ang Thelasar, di matukoy, saanman sa Bit-Adini. Binabantaan ni Amos “siyang humahawak ng cetro mula sa bahay ng Eden” kasama ng Damasco, marahil isang pinuno ng rehiyon noong kaniyang panahon; itinuturing ng mapa na iisang pook ang Eden at ang Beth-eden ni Amos. Inililista ni Ezekiel ang “Ang Haran at ang Canneh at ang Eden” sa mga mangangalakal ng Tiro, mga mangangalakal ng itaas na Eufrates."
    - "Hinukay ni François Thureau-Dangin ang Tell Ahmar noong 1929–1931, na nakatagpo ng palasyo ng gobernador na Asiryo na may mga larawang-dingding, at muli ng isang ekspedisyong Australyano mula 1988; malaking bahagi ng ibabang bayan ay nasa ilalim ngayon ng imbakan ng dam ng Tishrin. Ang nayon ng Tell Ahmar ay nasa silangang pampang ng Eufrates sa timog ng Jarabulus."
  da:
    - "Denne Eden er ikke haven i 1 Mosebog, men et land ved Eufrat: det aramæiske kongerige Bit-Adini, »Edens hus«, som holdt begge bredder af floden omkring dens store sving neden for Karkemisj, med hovedstad i Til Barsip, nu Tell Ahmar i Syrien. Assyrerne bekæmpede det hårdt i 800-tallet f.Kr. Assurnasirpal 2. tog tribut af dets konge Ahuni; Salmanassar 3. belejrede Til Barsip, indtog den i 856 f.Kr., omdøbte den Kar-Salmanassar og bosatte assyrere der, og tog året efter Ahuni selv. Fra da af var landet en assyrisk provins, i 700-tallet sæde for den mægtige hærfører Shamshi-ilu, som efterlod sine egne indskrifter på stenløverne ved Til Barsips port."
    - "Den historie er, hvad de assyriske udsendinges budskab til Hizkija forudsætter. Sankeribs mænd spurgte: »Have Hedningernes Guder friet dem, som mine Fædre ødelagde, nemlig Gosan og Karan og Rezef og Edens Børn, som vare i Thelassar?«, og Esajas' parallelsted gentager listen med »Telassar«; alle fire ligger i det samme assyriske vest, Gozan ved Khabur, Karan og Resef ved vejene mod Eufrat, og Telassar, ikke identificeret, et sted i Bit-Adini. Amos truer »den, som fører Spiret, fra Beth-Eden« sammen med Damaskus, sandsynligvis om en hersker i egnen i hans egen tid; kortet behandler denne Eden og Amos' Bet-Eden som ét sted. Ezekiel opregner »Haran og Karma og Eden« blandt Tyrus' købmænd, de handlende fra det øvre Eufrat."
    - "Tell Ahmar blev udgravet af François Thureau-Dangin i 1929–1931, som fandt den assyriske guvernørs palads med dets vægmalerier, og igen af en australsk ekspedition fra 1988; meget af nedre by ligger nu under Tishrin-dæmningens reservoir. Landsbyen Tell Ahmar ligger på Eufrats østbred syd for Jarabulus."
  sr:
    - "Овај Еден није врт из Постања него земља на Еуфрату: арамејско краљевство Бит-Адини, „дом Едена“, које је држало обе обале реке око њеног великог лука испод Хархемиса, с престоницом у Тил Барсипу, данас Тел Ахмару у Сирији. Асирци су га жестоко ратовали у 9. веку п. н. е. Ашурнасирпал II узимао је данак од његовог краља Ахунија; Салманасар III опседао је Тил Барсип, заузео га 856. п. н. е., преименовао у Кар-Салманасар и населио тамо Асирце, а следеће године заробио и самог Ахунија. Од тада је земља била асирска провинција, у 8. веку седиште моћног заповедника Шамши-илуа, који је оставио своје натписе на каменим лавовима на капији Тил Барсипа."
    - "Та историја је оно што претпоставља порука асирских изасланика Језекији. Сенахиримови људи питали су: „Јесу ли народе које сатрше оци моји избавили богови њихови, Госанце, Харанце, Ресефе и синове Еденове, који беху у Теласару?“, а Исаијино паралелно место понавља исти списак; сва четири леже на истом асирском западу, Гозан на Хабуру, Харан и Ресеф на путевима према Еуфрату, а Теласар, неидентификован, негде у Бит-Адинију. Амос прети, заједно са Дамаском, „оног који држи палицу из дома Еденовог“, вероватно мислећи на владара те области у његово доба; карта овај Еден и Вет-Еден код Амоса третира као једно место. Језекиљ међу тирским трговцима, трговцима горњег Еуфрата, набраја „Харан и Кана и Еден“."
    - "Тел Ахмар ископавао је Франсоа Тиро-Данжен 1929–1931, који је нашао палату асирског намесника са зидним сликама, и поново аустралијска експедиција од 1988; велики део доњег града сада лежи испод језера бране Тишрин. Село Тел Ахмар стоји на источној обали Еуфрата јужно од Џарабулуса."
