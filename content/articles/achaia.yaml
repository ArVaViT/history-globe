body:
  en:
    - "Achaia in the New Testament is the Roman province of southern Greece: the Peloponnese, Attica with Athens, Boeotia and the lands north to the border of Macedonia, with the islands. The name was old and narrow, the north coast of the Peloponnese, home of the Achaean League; when the Romans crushed the League and destroyed Corinth in 146 BC they gave the name to all the Greece they had conquered. Augustus made Achaia a province of its own in 27 BC, governed by a proconsul of the senate seated at Corinth, which Julius Caesar had refounded as a Roman colony in 44 BC; Tiberius put it for a time under an imperial legate, and Claudius returned it to the senate in AD 44."
    - "Paul came into Achaia from Macedonia, through Athens to Corinth, where he stayed eighteen months. There, “when Gallio was the deputy of Achaia, the Jews made insurrection with one accord against Paul” and brought him before the proconsul's judgement seat; Gallio refused to hear the case. A letter of Claudius inscribed at Delphi names Gallio as proconsul and fixes his year, probably AD 51–52, the surest date in Paul's life. The household of Stephanas was “the firstfruits of Achaia”; Apollos later went over from Ephesus “into Achaia”. Paul addressed his second letter to Corinth “with all the saints which are in all Achaia”, and the church at Cenchreae, Corinth's eastern port, had its deaconess Phoebe."
    - "The province took part in the collection for Jerusalem: “it hath pleased them of Macedonia and Achaia to make a certain contribution for the poor saints”, and Paul boasted to the Macedonians that “Achaia was ready a year ago”. The Thessalonians had become “ensamples to all that believe in Macedonia and Achaia”. Paul passed through both provinces again on his way to Jerusalem and spent three months in Greece. Nero declared the Greeks free in AD 67, but Vespasian made Achaia a province once more, and it remained one, poorer and quieter than in classical days, until the empire's end."
    - "Today Achaea is a small regional unit of Greece on the Gulf of Corinth, with its capital at Patras, while the old province is the heart of the Hellenic Republic: Athens, the Peloponnese and central Greece."
  ru:
    - "Ахаия в Новом Завете — римская провинция южной Греции: Пелопоннес, Аттика с Афинами, Беотия и земли к северу до границы с Македонией, вместе с островами. Имя было старым и узким — так звался северный берег Пелопоннеса, родина Ахейского союза; когда римляне разгромили союз и разрушили Коринф в 146 г. до н. э., они дали это имя всей завоёванной Греции. Август в 27 г. до н. э. сделал Ахаию отдельной провинцией под управлением сенатского проконсула с резиденцией в Коринфе, который Юлий Цезарь в 44 г. до н. э. восстановил как римскую колонию; Тиберий на время передал её императорскому легату, а Клавдий в 44 г. н. э. вернул сенату."
    - "Павел пришёл в Ахаию из Македонии, через Афины в Коринф, где провёл полтора года. Лука пишет: «во время проконсульства Галлиона в Ахаии, напали Иудеи единодушно на Павла» и привели его к судилищу проконсула; Галлион отказался разбирать дело. Письмо Клавдия, высеченное в Дельфах, называет Галлиона проконсулом и определяет его год, вероятно 51–52 гг. н. э., — самая надёжная дата в жизни Павла. Семейство Стефаново было «начаток Ахаии»; позже Аполлос отправился из Ефеса «в Ахаию». Второе послание в Коринф Павел обратил к церкви «со всеми святыми по всей Ахаии», а у церкви в Кенхреях, восточной гавани Коринфа, была диаконисса Фива."
    - "Провинция участвовала в сборе для Иерусалима: «Македония и Ахаия усердствуют некоторым подаянием для бедных между святыми в Иерусалиме», и Павел хвалился перед Македонянами, что «Ахаия приготовлена еще с прошедшего года». Фессалоникийцы стали «образцом для всех верующих в Македонии и Ахаии». По пути в Иерусалим Павел снова прошёл обе провинции и провёл три месяца в Елладе. Нерон в 67 г. н. э. объявил греков свободными, но Веспасиан вновь сделал Ахаию провинцией, и она оставалась ею, беднее и тише, чем в классические дни, до конца империи."
    - "Сегодня Ахея — небольшая область Греции на берегу Коринфского залива со столицей в Патрах, а древняя провинция — это сердце Греческой Республики: Афины, Пелопоннес и Средняя Греция."
  uk:
    - "Ахая в Новому Завіті — римська провінція південної Еллади: Пелопоннес, Аттика з Афінами, Беотія та землі на північ до кордону Македонії, разом з островами. Назва була давньою і вужчою — північне узбережжя Пелопоннесу, батьківщина Ахейського союзу; коли римляни розгромили союз і зруйнували Коринт у 146 р. до н. е., вони дали цю назву всій завойованій Елладі. Август зробив Ахаю окремою провінцією в 27 р. до н. е., якою керував проконсул від сенату з резиденцією в Коринті, що його Юлій Цезар заснував наново як римську колонію в 44 р. до н. е.; Тиверій на якийсь час віддав її під імператорського легата, а Клавдій повернув сенатові в 44 р. н. е."
    - "Павло прийшов в Ахаю з Македонії, через Афіни до Коринта, де пробув півтора року. Там, «як старостував Галион в Ахаї, напали однодушно Жиди на Павла» і привели його до судилища проконсула; Галліон відмовився слухати справу. Лист Клавдія, висічений у Дельфах, називає Галліона проконсулом і визначає його рік, ймовірно, 51–52 рр. н. е. — найпевнішу дату в житті Павла. Родина Стефана була «первоплід Ахайський»; Аполлос згодом із Ефеса «захотїв перейти в Ахаю». Павло адресував другого листа до Коринта «з усїма сьвятими у всїй Ахаї», а в церкві в Кенхреях, східному порту Коринта, була служителька Фива."
    - "Провінція брала участь у збірці для Єрусалима: «Зволили бо Македонцї та Ахайцї удїлити дещо вбогим сьвятим», і Павло хвалився македонянам, що «Ахая приготовилась від торішнього лїта». Солуняни стали «взором усїм віруючим у Македониї і Ахаї». Павло ще раз пройшов обидві провінції дорогою до Єрусалима і провів три місяці в Греції. Нерон проголосив греків вільними у 67 р. н. е., але Веспасіан знову зробив Ахаю провінцією, і вона лишалася нею, біднішою і тихішою, ніж за класичних часів, аж до кінця імперії."
    - "Нині Ахея — невелика регіональна одиниця Греції на Коринфській затоці зі столицею в Патрах, а стара провінція — це серце Грецької Республіки: Афіни, Пелопоннес і Середня Греція."
  es:
    - "Acaya, en el Nuevo Testamento, es la provincia romana del sur de Grecia: el Peloponeso, el Ática con Atenas, Beocia y las tierras hacia el norte hasta la frontera con Macedonia, con las islas. El nombre era antiguo y estrecho, la costa norte del Peloponeso, patria de la Liga Aquea; cuando los romanos aplastaron la Liga y destruyeron Corinto en 146 a. C., dieron el nombre a toda la Grecia que habían conquistado. Augusto hizo de Acaya una provincia independiente en 27 a. C., gobernada por un procónsul del senado con sede en Corinto, que Julio César había refundado como colonia romana en 44 a. C.; Tiberio la puso durante un tiempo bajo un legado imperial, y Claudio la devolvió al senado en 44 d. C."
    - "Pablo llegó a Acaya desde Macedonia, pasando por Atenas hasta Corinto, donde permaneció dieciocho meses. Allí, «siendo Galión procónsul de Acaya, los Judíos se levantaron de común acuerdo contra Pablo, y le llevaron al tribunal»; Galión se negó a oír la causa. Una carta de Claudio grabada en Delfos nombra a Galión como procónsul y fija su año, probablemente 51–52 d. C., la fecha más segura de la vida de Pablo. La casa de Estéfanas era «las primicias de Acaya»; Apolos pasó más tarde de Éfeso, queriendo «pasar á Acaya». Pablo dirigió su segunda carta a Corinto «juntamente con todos los santos que están por toda la Acaya», y la iglesia de Cencrea, el puerto oriental de Corinto, tenía como diaconisa a Febe."
    - "La provincia participó en la colecta para Jerusalén: «Macedonia y Acaya tuvieron por bien hacer una colecta para los pobres de los santos», y Pablo se gloriaba ante los macedonios de que «Acaya está apercibida desde el año pasado». Los tesalonicenses se habían convertido en «ejemplo á todos los que han creído en Macedonia y en Acaya». Pablo recorrió de nuevo ambas provincias camino de Jerusalén y pasó tres meses en Grecia. Nerón declaró libres a los griegos en 67 d. C., pero Vespasiano volvió a hacer de Acaya una provincia, y siguió siéndolo, más pobre y tranquila que en los días clásicos, hasta el final del imperio."
    - "Hoy Acaya es una pequeña unidad regional de Grecia en el golfo de Corinto, con su capital en Patras, mientras que la antigua provincia es el corazón de la República Helénica: Atenas, el Peloponeso y la Grecia central."
  pt:
    - "Acaia, no Novo Testamento, é a província romana do sul da Grécia: o Peloponeso, a Ática com Atenas, a Beócia e as terras ao norte até a fronteira da Macedônia, com as ilhas. O nome era antigo e restrito, a costa norte do Peloponeso, pátria da Liga Aqueia; quando os romanos esmagaram a Liga e destruíram Corinto em 146 a.C., deram o nome a toda a Grécia que haviam conquistado. Augusto fez da Acaia uma província própria em 27 a.C., governada por um procônsul do senado com sede em Corinto, que Júlio César refundara como colônia romana em 44 a.C.; Tibério a pôs por algum tempo sob um legado imperial, e Cláudio a devolveu ao senado em 44 d.C."
    - "Paulo chegou à Acaia vindo da Macedônia, por Atenas até Corinto, onde ficou dezoito meses. Ali, “quando Gálio era procônsul da Acaia, os judeus se levantaram juntos contra Paulo” e o levaram ao tribunal do procônsul; Gálio recusou-se a ouvir a causa. Uma carta de Cláudio inscrita em Delfos nomeia Gálio como procônsul e fixa o seu ano, provavelmente 51–52 d.C., a data mais segura da vida de Paulo. A casa de Estéfanas era “as primícias da Acaia”; Apolo passou depois de Éfeso “para a Acaia”. Paulo dirigiu a sua segunda carta a Corinto, “com todos os santos que estão em toda a Acaia”, e a igreja de Cencreia, o porto oriental de Corinto, tinha a sua serva Febe."
    - "A província participou da coleta para Jerusalém: “foi do agrado da Macedônia e da Acaia fazer uma contribuição para os pobres dentre os santos que estão em Jerusalém”, e Paulo se orgulhou diante dos macedônios de que “a Acaia está preparada desde o ano passado”. Os tessalonicenses haviam se tornado “exemplo para todos os que creem na Macedônia e na Acaia”. Paulo passou de novo pelas duas províncias a caminho de Jerusalém e passou três meses na Grécia. Nero declarou livres os gregos em 67 d.C., mas Vespasiano tornou a fazer da Acaia uma província, e assim ela permaneceu, mais pobre e mais quieta do que nos dias clássicos, até o fim do império."
    - "Hoje Acaia é uma pequena unidade regional da Grécia, no golfo de Corinto, com capital em Patras, enquanto a antiga província é o coração da República Helênica: Atenas, o Peloponeso e a Grécia central."
  de:
    - "Achaja ist im Neuen Testament die römische Provinz Südgriechenlands: die Peloponnes, Attika mit Athen, Böotien und die Länder nördlich bis zur Grenze Mazedoniens, dazu die Inseln. Der Name war alt und eng gefasst, die Nordküste der Peloponnes, Heimat des Achaiischen Bundes; als die Römer 146 v. Chr. den Bund zerschlugen und Korinth zerstörten, gaben sie den Namen dem ganzen eroberten Griechenland. Augustus machte Achaja 27 v. Chr. zu einer eigenen Provinz, die ein Prokonsul des Senats von Korinth aus verwaltete, das Julius Caesar 44 v. Chr. als römische Kolonie neu gegründet hatte; Tiberius unterstellte sie zeitweise einem kaiserlichen Legaten, und Klaudius gab sie 44 n. Chr. an den Senat zurück."
    - "Paulus kam von Mazedonien über Athen nach Korinth in die Provinz Achaja und blieb dort achtzehn Monate. Dort heißt es: „Da aber Gallion Landvogt war in Achaja, empörten sich die Juden einmütig wider Paulus und führten ihn vor den Richtstuhl“ des Prokonsuls; Gallio lehnte es ab, den Fall zu verhandeln. Ein in Delphi eingemeißelter Brief des Klaudius nennt Gallio als Prokonsul und legt sein Amtsjahr fest, wohl 51–52 n. Chr., das sicherste Datum im Leben des Paulus. Das Haus des Stephanas waren „die Erstlinge in Achaja“; Apollos reiste später von Ephesus „nach Achaja“. Paulus richtete seinen zweiten Brief an die Gemeinde zu Korinth „samt allen Heiligen in ganz Achaja“, und die Gemeinde in Kenchreä, Korinths Hafen im Osten, hatte ihre Dienerin Phöbe."
    - "Die Provinz beteiligte sich an der Sammlung für Jerusalem: „Die aus Mazedonien und Achaja haben willig eine gemeinsame Steuer zusammengelegt den armen Heiligen zu Jerusalem“, und Paulus rühmte vor den Mazedoniern: „Achaja ist schon voriges Jahr bereit gewesen“. Die Thessalonicher waren „ein Vorbild allen Gläubigen in Mazedonien und Achaja“ geworden. Paulus zog auf dem Weg nach Jerusalem noch einmal durch beide Provinzen und verbrachte drei Monate in Griechenland. Nero erklärte die Griechen 67 n. Chr. für frei, doch Vespasian machte Achaja wieder zur Provinz, und sie blieb es, ärmer und stiller als in klassischer Zeit, bis zum Ende des Reiches."
    - "Heute ist Achaia eine kleine Regionalverwaltungseinheit Griechenlands am Golf von Korinth mit der Hauptstadt Patras, während die alte Provinz das Herz der Hellenischen Republik ist: Athen, die Peloponnes und Mittelgriechenland."
  fr:
    - "L’Achaïe du Nouveau Testament est la province romaine de la Grèce méridionale : le Péloponnèse, l’Attique avec Athènes, la Béotie et les terres jusqu’à la frontière de la Macédoine, avec les îles. Le nom, ancien et étroit, désignait la côte nord du Péloponnèse, patrie de la Ligue achéenne ; quand les Romains écrasèrent la Ligue et détruisirent Corinthe en 146 av. J.-C., ils donnèrent ce nom à toute la Grèce conquise. Auguste fit de l’Achaïe une province distincte en 27 av. J.-C., gouvernée par un proconsul du sénat siégeant à Corinthe, que Jules César avait refondée comme colonie romaine en 44 av. J.-C. ; Tibère la plaça un temps sous un légat impérial, et Claude la rendit au sénat en 44 apr. J.-C."
    - "Paul entra en Achaïe par la Macédoine, passa par Athènes et gagna Corinthe, où il resta dix-huit mois. Là, « du temps que Gallion était proconsul de l’Achaïe, les Juifs se soulevèrent unanimement contre Paul, et le menèrent devant le tribunal » du proconsul ; Gallion refusa d’entendre l’affaire. Une lettre de Claude gravée à Delphes nomme Gallion proconsul et fixe son année, probablement 51-52 apr. J.-C., la date la plus sûre de la vie de Paul. La famille de Stéphanas fut « les prémices de l’Achaïe » ; Apollos passa plus tard d’Éphèse « en Achaïe ». Paul adressa sa seconde lettre à Corinthe et « à tous les saints qui sont dans toute l’Achaïe », et l’Église de Cenchrées, port oriental de Corinthe, avait sa diaconesse Phœbé."
    - "La province prit part à la collecte pour Jérusalem : « la Macédoine et l’Achaïe ont bien voulu s’imposer une contribution en faveur des pauvres parmi les saints », et Paul se glorifiait auprès des Macédoniens de « déclarer que l’Achaïe est prête depuis l’année dernière ». Les Thessaloniciens étaient devenus « un modèle pour tous les croyants de la Macédoine et de l’Achaïe ». Paul traversa de nouveau les deux provinces en allant à Jérusalem et passa trois mois en Grèce. Néron proclama les Grecs libres en 67 apr. J.-C., mais Vespasien refit de l’Achaïe une province, et elle le resta, plus pauvre et plus calme qu’aux jours classiques, jusqu’à la fin de l’Empire."
    - "Aujourd’hui l’Achaïe est une petite unité régionale de la Grèce, sur le golfe de Corinthe, avec Patras pour capitale, tandis que l’ancienne province est le cœur de la République hellénique : Athènes, le Péloponnèse et la Grèce centrale."
  it:
    - "L’Acaia del Nuovo Testamento è la provincia romana della Grecia meridionale: il Peloponneso, l’Attica con Atene, la Beozia e le terre a nord fino al confine della Macedonia, con le isole. Il nome era antico e ristretto, la costa settentrionale del Peloponneso, patria della Lega achea; quando i Romani schiacciarono la Lega e distrussero Corinto nel 146 a.C. diedero il nome a tutta la Grecia da loro conquistata. Augusto fece dell’Acaia una provincia a sé nel 27 a.C., governata da un proconsole del senato con sede a Corinto, che Giulio Cesare aveva rifondato come colonia romana nel 44 a.C.; Tiberio la pose per un periodo sotto un legato imperiale, e Claudio la restituì al senato nel 44 d.C."
    - "Paolo giunse in Acaia dalla Macedonia, passando per Atene fino a Corinto, dove rimase diciotto mesi. Là, «quando Gallione fu proconsole d’Acaia, i Giudei, tutti d’accordo, si levaron contro Paolo» e lo condussero davanti al tribunale del proconsole; Gallione rifiutò di ascoltare la causa. Una lettera di Claudio incisa a Delfi nomina Gallione come proconsole e ne fissa l’anno, probabilmente 51–52 d.C., la data più sicura della vita di Paolo. La famiglia di Stefana era «la primizia dell’Acaia»; Apollo passò poi da Efeso «in Acaia». Paolo indirizzò la sua seconda lettera a Corinto «con tutti i santi che sono in tutta l’Acaia», e la chiesa di Cencre, il porto orientale di Corinto, ebbe la sua diaconessa Febe."
    - "La provincia prese parte alla colletta per Gerusalemme: «la Macedonia e l’Acaia si son compiaciute di raccogliere una contribuzione a pro dei poveri fra i santi», e Paolo si vantava con i Macedoni che «l’Acaia è pronta fin dall’anno passato». I Tessalonicesi erano diventati «un esempio a tutti i credenti della Macedonia e dell’Acaia». Paolo attraversò di nuovo entrambe le province nel suo viaggio verso Gerusalemme e trascorse tre mesi in Grecia. Nerone dichiarò liberi i Greci nel 67 d.C., ma Vespasiano fece di nuovo dell’Acaia una provincia, e tale rimase, più povera e più quieta che nei giorni classici, fino alla fine dell’impero."
    - "Oggi l’Acaia è una piccola unità regionale della Grecia sul golfo di Corinto, con capoluogo Patrasso, mentre l’antica provincia è il cuore della Repubblica Ellenica: Atene, il Peloponneso e la Grecia centrale."
  pl:
    - "Achaja w Nowym Testamencie to rzymska prowincja południowej Grecji: Peloponez, Attyka z Atenami, Beocja i ziemie na północ aż do granicy Macedonii, wraz z wyspami. Nazwa była dawna i wąska, oznaczała północne wybrzeże Peloponezu, ojczyznę Związku Achajskiego; gdy w 146 r. p.n.e. Rzymianie rozgromili Związek i zniszczyli Korynt, nadali ją całej podbitej Grecji. August uczynił z Achai odrębną prowincję w 27 r. p.n.e., rządzoną przez prokonsula senatu z siedzibą w Koryncie, który Juliusz Cezar odnowił jako kolonię rzymską w 44 r. p.n.e.; Tyberiusz oddał ją na pewien czas legatowi cesarskiemu, a Klaudiusz zwrócił senatowi w 44 r. n.e."
    - "Paweł przybył do Achai z Macedonii, przez Ateny do Koryntu, gdzie przebywał osiemnaście miesięcy. Tam „gdy Galijo był starostą w Achai, powstali jednomyślnie Żydowie przeciwko Pawłowi i przywiedli go do sądu” przed trybunał prokonsula; Gallion odmówił rozpatrzenia sprawy. List Klaudiusza wyryty w Delfach wymienia Galliona jako prokonsula i wyznacza jego rok, prawdopodobnie 51–52 n.e., najpewniejszą datę w życiu Pawła. Dom Stefanasa był „pierwiastkiem Achai”; Apollos przeszedł później z Efezu „do Achai”. Paweł skierował drugi list do Koryntu „ze wszystkimi świętymi, którzy są we wszystkiej Achai”, a wspólnota w Kenchrei, wschodnim porcie Koryntu, miała diakonisę Febe."
    - "Prowincja wzięła udział w zbiórce dla Jerozolimy: „Albowiem się upodobało Macedonii i Achai, nieco spólnie złożyć na ubogich świętych”, a Paweł chlubił się przed Macedończykami, że „Achaja gotowa była od przeszłego roku”. Tesaloniczanie stali się „za wzór wszystkim wierzącym w Macedonii i w Achai”. Paweł ponownie przeszedł przez obie prowincje w drodze do Jerozolimy i spędził trzy miesiące w Grecji. Neron ogłosił Greków wolnymi w 67 r. n.e., lecz Wespazjan znów uczynił z Achai prowincję, którą pozostała, uboższa i cichsza niż w czasach klasycznych, do końca cesarstwa."
    - "Dziś Achaja to niewielka jednostka regionalna Grecji nad Zatoką Koryncką, ze stolicą w Patras, podczas gdy dawna prowincja jest sercem Republiki Helleńskiej: Ateny, Peloponez i Grecja środkowa."
  nl:
    - "Achaja is in het Nieuwe Testament de Romeinse provincie Zuid-Griekenland: de Peloponnesos, Attika met Athene, Boeotië en de landen daarboven tot de grens van Macedonië, met de eilanden. De naam was oud en beperkt, de noordkust van de Peloponnesos, thuisland van de Achaeïsche Bond; toen de Romeinen in 146 v.Chr. de Bond verpletterden en Korinthe verwoestten, gaven zij de naam aan heel het veroverde Griekenland. Augustus maakte Achaja in 27 v.Chr. tot een eigen provincie, bestuurd door een proconsul van de senaat met zetel te Korinthe, dat Julius Caesar in 44 v.Chr. als Romeinse kolonie had hersticht; Tiberius plaatste haar enige tijd onder een keizerlijk legaat, en Claudius gaf haar in 44 n.Chr. terug aan de senaat."
    - "Paulus kwam vanuit Macedonië in Achaja, via Athene naar Korinthe, waar hij anderhalf jaar bleef. Daar, “als Gallio stadhouder van Achaje was, stonden de Joden eendrachtelijk tegen Paulus op, en brachten hem voor den rechterstoel”; Gallio weigerde de zaak te behandelen. Een brief van Claudius, ingekerfd te Delphi, noemt Gallio als proconsul en bepaalt zijn jaar, waarschijnlijk 51–52 n.Chr., de zekerste datum in Paulus’ leven. Het huis van Stefanas was “de eersteling van Achaje”; Apollos stak later over van Efeze “naar Achaje”. Paulus richtte zijn tweede brief aan Korinthe “met al de heiligen, die in geheel Achaje zijn”, en de gemeente te Kenchreeën, Korinthes oosterhaven, had haar dienares Febe."
    - "De provincie nam deel aan de collecte voor Jeruzalem: “het heeft dien van Macedonie en Achaje goed gedacht een gemene handreiking te doen aan de armen onder de heiligen”, en Paulus roemde bij de Macedoniërs dat “Achaje van over een jaar bereid is geweest”. Aan de Thessalonicenzen schreef Paulus: “Alzo dat gij voorbeelden geworden zijt al den gelovigen in Macedonie en Achaje.” Paulus trok op weg naar Jeruzalem opnieuw door beide provincies en bracht drie maanden in Griekenland door. Nero verklaarde de Grieken in 67 n.Chr. vrij, maar Vespasianus maakte van Achaja weer een provincie, en dat bleef zij, armer en stiller dan in de klassieke tijd, tot het einde van het rijk."
    - "Tegenwoordig is Achaia een kleine regionale eenheid van Griekenland aan de Golf van Korinthe, met Patras als hoofdstad, terwijl de oude provincie het hart van de Helleense Republiek vormt: Athene, de Peloponnesos en Midden-Griekenland."
  cs:
    - "Achaja je v Novém zákoně římská provincie jižního Řecka: Peloponés, Attika s Aténami, Boiótie a země na sever až k hranici Makedonie, s ostrovy. Jméno bylo staré a úzké, označovalo severní pobřeží Peloponésu, domov Achajského spolku; když Římané v roce 146 př. n. l. spolek rozdrtili a zničili Korint, dali jméno celému Řecku, které dobyli. Augustus učinil z Achaje v roce 27 př. n. l. samostatnou provincii spravovanou prokonzulem senátu se sídlem v Korintu, který Julius Caesar obnovil jako římskou kolonii v roce 44 př. n. l.; Tiberius ji na čas podřídil císařskému legátovi a Klaudius ji v roce 44 n. l. vrátil senátu."
    - "Pavel přišel do Achaje z Makedonie, přes Atény do Korintu, kde zůstal osmnáct měsíců. Tam, „když pak Gallio vladařem byl v Achaii, povstali jednomyslně Židé proti Pavlovi“ a přivedli ho před prokonzulovu soudnou stolici; Gallión odmítl věc vyslechnout. List Klaudiův vytesaný v Delfách jmenuje Gallióna prokonzulem a určuje jeho rok, pravděpodobně 51–52 n. l., nejjistější datum v Pavlově životě. Čeleď Štěpanasova byla „prvotiny Achaie“; Apollos později přešel z Efezu „do Achaie“. Pavel adresoval svůj druhý list Korintu „se všemi svatými, kteříž jsou ve vší Achaii“ a církev v Kenchrejích, východním přístavu Korintu, měla služebnici Foibé."
    - "Provincie se podílela na sbírce pro Jeruzalém: „za dobré se vidělo Macedonským a Achaiským, aby sbírku nějakou učinili na chudé svaté“ a Pavel se před Makedonskými chlubil, že „Achaia hotova byla k tomu od předešlého léta“. Tesaloničtí se stali „příklad dobrý všem věřícím v Macedonii a v Achaii“. Pavel prošel oběma provinciemi znovu na cestě do Jeruzaléma a strávil tři měsíce v Řecku. Nero prohlásil Řeky za svobodné v roce 67 n. l., ale Vespasianus učinil z Achaje opět provincii a zůstala jí, chudší a tišší než za klasických dob, až do konce říše."
    - "Dnes je Achaja malou regionální jednotkou Řecka při Korintském zálivu s hlavním městem Patrasem, zatímco stará provincie je jádrem Helénské republiky: Atény, Peloponés a střední Řecko."
  sv:
    - "Achaia i Nya testamentet är den romerska provinsen södra Grekland: Peloponnesos, Attika med Aten, Boiotien och landet norrut till Makedoniens gräns, med öarna. Namnet var gammalt och snävt, Peloponnesos norra kust, hemvist för Achaiska förbundet; när romarna krossade förbundet och förstörde Korinth år 146 f.Kr. gav de namnet åt hela det Grekland de hade erövrat. Augustus gjorde Achaia till en egen provins år 27 f.Kr., styrd av en prokonsul under senaten med säte i Korinth, som Julius Caesar hade återgrundat som romersk koloni år 44 f.Kr.; Tiberius ställde den en tid under en kejserlig legat, och Claudius återlämnade den till senaten år 44 e.Kr."
    - "Paulus kom till Achaia från Makedonien, genom Aten till Korinth, där han stannade arton månader. Där ”när Gallio var landshövding i Akaja, reste sig judarna, alla tillhopa, upp mot Paulus” och förde honom inför prokonsulns domstol; Gallio vägrade höra målet. Ett brev från Claudius, inristat i Delfi, nämner Gallio som prokonsul och fastställer hans år, sannolikt 51–52 e.Kr., det säkraste dateringsunderlaget i Paulus liv. Stefanas’ hushåll var ”förstlingen i Akaja”; Apollos for senare från Efesos ”till Akaja”. Paulus ställde sitt andra brev till Korinth ”och tillika alla de heliga som finnas i hela Akaja”, och församlingen i Kenchreai, Korinths östra hamn, hade diakonissan Foibe."
    - "Provinsen deltog i insamlingen till Jerusalem: ”Macedonien och Akaja hava nämligen känt sig manade att göra ett sammanskott åt dem bland de heliga i Jerusalem, som leva i fattigdom”, och Paulus berömde sig inför makedonierna av att ”Akaja ända sedan förra året har varit redo”. Tessalonikerna hade blivit ”ett föredöme för alla de troende i Macedonien och Akaja”. Paulus drog genom båda provinserna igen på väg till Jerusalem och tillbringade tre månader i Grekland. Nero förklarade grekerna fria år 67 e.Kr., men Vespasianus gjorde Achaia till provins på nytt, och den förblev det, fattigare och lugnare än under den klassiska tiden, till rikets slut."
    - "I dag är Achaia en liten regional enhet i Grekland vid Korintiska viken, med Patras som huvudort, medan den gamla provinsen är kärnan i Republiken Grekland: Aten, Peloponnesos och Mellangrekland."
  nb:
    - "Akaia i Det nye testamente er den romerske provinsen Sør-Hellas: Peloponnes, Attika med Aten, Boiotia og landet nordover til grensen mot Makedonia, med øyene. Navnet var gammelt og snevert, nordkysten av Peloponnes, hjemlandet til Akhaiiske forbund; da romerne knuste forbundet og ødela Korint i 146 f.Kr., ga de navnet til hele Hellas, som de hadde erobret. Augustus gjorde Akaia til egen provins i 27 f.Kr., styrt av en prokonsul fra senatet med sete i Korint, som Julius Caesar hadde grunnlagt på nytt som romersk koloni i 44 f.Kr.; Tiberius la den en tid under en keiserlig legat, og Klaudius ga den tilbake til senatet i 44 e.Kr."
    - "Paulus kom til Akaia fra Makedonia, gjennom Aten til Korint, der han ble i atten måneder. Der, «da Gallio var landshøvding i Akaia, reiste jødene sig alle som en mot Paulus» og førte ham for prokonsulens domstol; Gallio nektet å høre saken. Et brev fra Klaudius innskrevet i Delfi nevner Gallio som prokonsul og fastsetter hans år, trolig 51–52 e.Kr., den sikreste dateringen i Paulus' liv. Stefanas' hus var «førstegrøden av Akaia»; Apollos dro senere over fra Efesos for å «dra videre til Akaia». Paulus adresserte sitt andre brev til Korint «tillikemed alle de hellige som er i hele Akaia», og menigheten i Kenkreae, Korints østlige havn, hadde sin menighetstjenerinne Føbe."
    - "Provinsen deltok i innsamlingen til Jerusalem: «Makedonia og Akaia har villet gjøre et sammenskudd for de fattige blandt de hellige i Jerusalem», og Paulus roste seg overfor makedonierne av at «Akaia har vært rede like fra ifjor». Tessalonikerne var blitt «et forbillede for alle de troende i Makedonia og Akaia». Paulus reiste gjennom begge provinsene igjen på vei til Jerusalem og tilbrakte tre måneder i Hellas. Nero erklærte grekerne frie i 67 e.Kr., men Vespasian gjorde Akaia til provins på ny, og den forble det, fattigere og stillere enn i klassisk tid, til rikets slutt."
    - "I dag er Akaia en liten regional enhet i Hellas ved Korintbukta, med hovedstad i Patras, mens den gamle provinsen er kjernen i Den hellenske republikk: Aten, Peloponnes og Sentral-Hellas."
  tl:
    - "Ang Acaya sa Bagong Tipan ay ang lalawigang Romano ng timog Grecia: ang Peloponeso, ang Atica kasama ang Atenas, ang Beocia at ang mga lupain sa hilaga hanggang sa hangganan ng Macedonia, kasama ang mga pulo. Luma at makitid ang pangalan, ang hilagang baybayin ng Peloponeso, tahanan ng Ligang Aqueo; nang durugin ng mga Romano ang Liga at wasakin ang Corinto noong 146 BK, ibinigay nila ang pangalan sa buong Grecia na kanilang nasakop. Ginawa ni Augusto ang Acaya na sariling lalawigan noong 27 BK, na pinamumunuan ng isang proconsul ng senado na nakaluklok sa Corinto, na muling itinatag ni Julio Cesar bilang kolonyang Romano noong 44 BK; inilagay ito ni Tiberio sa loob ng ilang panahon sa ilalim ng isang legadong imperyal, at ibinalik ito ni Claudio sa senado noong 44 AD."
    - "Pumasok si Pablo sa Acaya mula sa Macedonia, sa pamamagitan ng Atenas patungong Corinto, kung saan siya tumigil nang labingwalong buwan. Doon, “nang si Galion ay proconsul ng Acaya ang mga Judio ay nangagkaisang nangagsitindig laban kay Pablo” at dinala siya sa harap ng hukuman ng proconsul; tumangging dinggin ni Galion ang usapin. Isang liham ni Claudio na nakasulat sa Delfos ang nagpapangalan kay Galion bilang proconsul at nagtatakda ng kaniyang taon, marahil 51–52 AD, ang pinakatiyak na petsa sa buhay ni Pablo. Ang sangbahayan ni Estefanas ay “pangunahing bunga ng Acaya”; si Apolos ay kalaunang “lumipat sa Acaya” mula sa Efeso. Isinulat ni Pablo ang kaniyang ikalawang liham sa Corinto “kalakip ng lahat ng mga banal na nasa buong Acaya”, at ang iglesia sa Cencrea, pantalang silangan ng Corinto, ay may diakonesang si Febe."
    - "Nakibahagi ang lalawigan sa ambagan para sa Jerusalem: “minagaling ng Macedonia at ng Acaya na gumawa ng isang ambagang laan sa mga dukha sa mga banal na nasa Jerusalem”, at ipinagmalaki ni Pablo sa mga taga-Macedonia na “ang Acaya ay nahahandang isang taon na”. Ang mga taga-Tesalonica ay naging “uliran ng lahat ng nangananampalatayang nangasa Macedonia at nangasa Acaya”. Muling dumaan si Pablo sa dalawang lalawigan patungong Jerusalem at gumugol ng tatlong buwan sa Grecia. Ipinahayag ni Nero na malaya ang mga Griyego noong 67 AD, ngunit muling ginawa ni Vespasiano na lalawigan ang Acaya, at nanatili itong gayon, na mas mahirap at mas tahimik kaysa noong panahong klasiko, hanggang sa katapusan ng imperyo."
    - "Ngayon, ang Acaya ay isang maliit na yunit panrehiyon ng Grecia sa Golpo ng Corinto, na may kabisera sa Patras, samantalang ang dating lalawigan ay ang puso ng Republikang Helenika: ang Atenas, ang Peloponeso at gitnang Grecia."
  da:
    - "Akaja i Det Nye Testamente er den romerske provins i det sydlige Grækenland: Peloponnes, Attika med Athen, Boiotien og landene nordpå til Makedoniens grænse, med øerne. Navnet var gammelt og snævert, Peloponnes' nordkyst, hjemsted for Det Achaiiske Forbund; da romerne knuste forbundet og ødelagde Korinth i 146 f.Kr., gav de navnet til hele det Grækenland, de havde erobret. Augustus gjorde Akaja til en selvstændig provins i 27 f.Kr., styret af en prokonsul udpeget af senatet med sæde i Korinth, som Julius Cæsar havde genstiftet som romersk koloni i 44 f.Kr.; Tiberius lagde den en tid under en kejserlig legat, og Klaudius gav den tilbage til senatet i 44 e.Kr."
    - "Paulus kom til Akaja fra Makedonien, via Athen til Korinth, hvor han blev i atten måneder. Dér »stode Jøderne endrægtigt op imod Paulus«, »medens Gallio var Statholder i Akaja«, og førte ham for prokonsulens domstol; Gallio nægtede at høre sagen. Et brev fra Klaudius, indhugget i Delfi, nævner Gallio som prokonsul og fastlægger hans år, sandsynligvis 51–52 e.Kr., den sikreste datering i Paulus' liv. Stefanas' hus var »Akajas Førstegrøde«; Apollos rejste senere fra Efesos »videre til Akaja«. Paulus stilede sit andet brev til Korinth »tillige med alle de hellige, som ere i hele Akaja«, og menigheden i Kenkreæ, Korinths østlige havn, havde sin tjenerinde Føbe."
    - "Provinsen deltog i indsamlingen til Jerusalem: Makedonien og Akaja »have fundet Glæde i at gøre et Sammenskud til de fattige iblandt de hellige«, og Paulus roste sig over for makedonerne af, at »Akaja alt fra i Fjor har været beredt«. Thessalonikerne var blevet »et Forbillede for alle de troende i Makedonien og Akaja«. Paulus drog igen gennem begge provinser på vej til Jerusalem og tilbragte tre måneder i Grækenland. Nero erklærede grækerne frie i 67 e.Kr., men Vespasian gjorde Akaja til provins igen, og det forblev den, fattigere og stillere end i klassisk tid, til rigets ophør."
    - "I dag er Achaia en lille regional enhed i Grækenland ved Korintbugten med hovedstad i Patras, mens den gamle provins er hjertet af Den Hellenske Republik: Athen, Peloponnes og det centrale Grækenland."
