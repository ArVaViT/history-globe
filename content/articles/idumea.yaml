# Overview article (ADR 0007). Mainstream facts only; Idumea here is the Persian to Roman district south of Judea, not the older Edom east of the Arabah; the date of Hyrcanus' conquest is usually put in the 120s or 110s BC.
id: idumea
place: a2517a0
title:
  en: "Idumea"
  ru: "Идумея"
  uk: "Ідумея"
  es: "Idumea"
  pt: "Iduméia"
  de: "Idumäa"
