body:
  en:
    - "Idumea is the Greek form of the name Edom, but in the Persian, Hellenistic and Roman periods it meant a district west of the Arabah: the southern hills of Judah and the southern Shephelah, from about Beth-zur southward to the region of Beersheba, with Hebron, Adoraim and Marisa (Mareshah) among its towns. Edomites had moved into this land in the late Iron Age and especially after the fall of Judah in 586 BC. Hundreds of Aramaic ostraca of the fourth century BC from the area record many personal names formed with Qos, the Edomite god. The region lies today in the southern Hebron hills of the West Bank and in the adjoining part of Israel."
    - "Mark tells that when Jesus withdrew to the Sea of Galilee “a great multitude from Galilee followed him, and from Judæa, and from Jerusalem, and from Idumaea, and from beyond Jordan”. Idumea is the most southerly land in the list, so the crowd came from the whole of the Jewish country and beyond. This is its only mention in the New Testament; in the Old Testament the name stands for Edom itself, rarely in the KJV and often in the Synodal Bible, as in Ezekiel's “thou shalt be desolate, O mount Seir, and all Idumea”."
    - "Judas Maccabeus fought the Idumeans and took Hebron. In the late second century BC John Hyrcanus captured Adora and Marisa and, Josephus says, let the Idumeans stay in their land if they accepted circumcision and the Jewish law. Under Alexander Jannaeus Antipas, an Idumean, governed the district; his son Antipater was the father of Herod the Great. During the revolt against Rome the Zealots let an Idumean force into Jerusalem, and they killed the former high priest Ananus. Marisa was excavated by F. J. Bliss and R. A. S. Macalister in 1898–1900 and by Amos Kloner from 1989; its painted tombs and cave complexes form the Beit Guvrin–Maresha National Park in Israel, on the UNESCO World Heritage list since 2014."
  ru:
    - "Идумея — греческая форма имени Едом, но в персидское, эллинистическое и римское время так называли область к западу от Аравы: южные горы Иудеи и южную Шефелу, примерно от Беф-Цура на юг до окрестностей Вирсавии, с Хевроном, Адораимом и Марисой (Мареша) среди её городов. Едомитяне переселялись на эти земли в конце железного века и особенно после падения Иудеи в 586 г. до н. э. Сотни арамейских остраконов IV в. до н. э. из этой местности содержат множество личных имён, образованных от имени Коса, едомского бога. Сегодня эта область лежит в южных горах Хеврона на Западном берегу и в прилегающей части Израиля."
    - "Марк рассказывает, что когда Иисус удалился к морю Галилейскому, «за Ним последовало множество народа из Галилеи, Иудеи, Иерусалима, Идумеи и из-за Иордана». Идумея — самая южная из названных земель, так что народ сходился со всей иудейской страны и из-за её пределов. Это единственное упоминание Идумеи в Новом Завете; в Ветхом Завете это имя означает сам Едом — в KJV редко, в Синодальном переводе часто, — как у Иезекииля: «опустошена будешь, гора Сеир, и вся Идумея вместе»."
    - "Иуда Маккавей воевал с идумеями и взял Хеврон. В конце II в. до н. э. Иоанн Гиркан захватил Адору и Марису и, по словам Иосифа Флавия, позволил идумеям остаться на своей земле, если они примут обрезание и иудейский закон. При Александре Яннае областью правил идумеянин Антипа; его сын Антипатр был отцом Ирода Великого. Во время восстания против Рима зелоты впустили в Иерусалим отряд идумеев, и те убили бывшего первосвященника Анана. Марису раскапывали Ф. Дж. Блисс и Р. А. С. Макалистер в 1898–1900 гг. и Амос Клонер с 1989 г.; её расписные гробницы и пещерные комплексы составляют национальный парк Бейт-Гуврин — Мареша в Израиле, с 2014 г. входящий в список Всемирного наследия ЮНЕСКО."
  uk:
    - "Ідумея — грецька форма назви Едом, але в перський, елліністичний і римський періоди так називали область на захід від Арави: південні юдейські гори та південну Шефелу, приблизно від Бет-Цура на південь до околиць Беер-Шеви, з-поміж міст якої — Хеврон, Адораїм і Маріса (Мареша). Едомити перейшли в цю землю наприкінці залізної доби, особливо після падіння Юдеї 586 р. до н. е. Сотні арамейських острака IV ст. до н. е. з цієї місцевості фіксують багато особових імен, утворених від Кос, едомського бога. Область лежить нині в південних хевронських горах на Західному березі та в прилеглій частині Ізраїлю."
    - "Марк розповідає, що коли Ісус відійшов до Галілейського моря, «великий натовп із Галилеї йшов за Ним, і з Юдеї, і з Єрусалиму, й з Ідумеї, і зза Йордану». Ідумея — найпівденніша земля в переліку, тож натовп прийшов з усієї юдейської країни й за її межами. Це її єдина згадка в Новому Завіті; у Старому Завіті це ім'я стоїть за сам Едом, рідко в KJV і часто в Синодальній Біблії, як в Єзекіїля: «пустинею станеш ти, горо Сеїр, та й уся Ідумея»."
    - "Юда Маккавей воював з ідумеянами й узяв Хеврон. Наприкінці II ст. до н. е. Іван Гіркан захопив Адору й Марису та, за Йосифом Флавієм, дозволив ідумеянам лишитися в їхній землі, якщо вони приймуть обрізання та юдейський закон. За Александра Янная округом управляв ідумеянин Антипа; його син Антипатр був батьком Ірода Великого. Під час повстання проти Риму зелоти впустили до Єрусалима ідумейський загін, і ті вбили колишнього первосвященика Анана. Марису розкопували Ф. Дж. Бліс і Р. А. С. Макалістер 1898–1900 рр. та Амос Клонер від 1989 р.; її розписані гробниці й печерні комплекси становлять національний парк Бейт-Ґуврін — Мареша в Ізраїлі, у Списку всесвітньої спадщини ЮНЕСКО від 2014 р."
  es:
    - "Idumea es la forma griega del nombre Edom, pero en las épocas persa, helenística y romana designaba un distrito al oeste de la Arabá: las colinas meridionales de Judá y la Sefelá meridional, desde aproximadamente Bet-sur hacia el sur hasta la región de Beerseba, con Hebrón, Adoraim y Marisa (Maresa) entre sus ciudades. Los edomitas se habían establecido en esta tierra a fines de la edad del Hierro y sobre todo tras la caída de Judá en 586 a. C. Cientos de óstracos arameos del siglo IV a. C. hallados en la zona registran muchos nombres personales formados con Qos, el dios edomita. La región se halla hoy en las colinas meridionales de Hebrón, en Cisjordania, y en la parte contigua de Israel."
    - "Marcos cuenta que, cuando Jesús se retiró al mar de Galilea, «le siguió gran multitud de Galilea, y de Judea, Y de Jerusalem, y de Idumea, y de la otra parte del Jordán». Idumea es la tierra más meridional de la lista, de modo que la multitud venía de todo el país judío y de más allá. Es su única mención en el Nuevo Testamento; en el Antiguo Testamento el nombre designa a la propia Edom, raramente en la KJV y a menudo en la Biblia sinodal, como en las palabras de Ezequiel «asolado será el monte de Seir, y toda Idumea»."
    - "Judas Macabeo combatió a los idumeos y tomó Hebrón. A finales del siglo II a. C. Juan Hircano capturó Adora y Marisa y, dice Josefo, dejó que los idumeos permanecieran en su tierra si aceptaban la circuncisión y la ley judía. Bajo Alejandro Janeo, Antipas, un idumeo, gobernó el distrito; su hijo Antípatro fue el padre de Herodes el Grande. Durante la rebelión contra Roma los zelotes dejaron entrar en Jerusalén a una fuerza idumea, que mató al antiguo sumo sacerdote Anano. Marisa fue excavada por F. J. Bliss y R. A. S. Macalister en 1898–1900 y por Amos Kloner desde 1989; sus tumbas pintadas y complejos de cuevas forman el Parque Nacional de Beit Guvrin–Maresha, en Israel, en la lista del Patrimonio Mundial de la UNESCO desde 2014."
  pt:
    - "Iduméia é a forma grega do nome Edom, mas nos períodos persa, helenístico e romano designava um distrito a oeste da Arabá: as colinas meridionais de Judá e a Sefelá meridional, de cerca de Bete-Zur para o sul até a região de Berseba, com Hebrom, Adoraim e Marisa (Maressa) entre suas cidades. Os edomitas haviam se mudado para essa terra no final da Idade do Ferro e sobretudo depois da queda de Judá em 586 a.C. Centenas de óstracos aramaicos do século IV a.C. da região registram muitos nomes pessoais formados com Qos, o deus edomita. A região fica hoje nas colinas meridionais de Hebrom, na Cisjordânia, e na parte adjacente de Israel."
    - "Marcos conta que, quando Jesus se retirou para o mar da Galileia, “uma grande multidão o seguiu da Galileia, da Judeia, de Jerusalém, da Idumeia, de além do Jordão”. A Iduméia é a terra mais meridional da lista, de modo que a multidão veio de todo o país judeu e de além dele. Esta é a sua única menção no Novo Testamento; no Antigo Testamento o nome designa o próprio Edom, raramente na KJV e com frequência na Bíblia sinodal, como em Ezequiel 35:15, onde a KJV diz que o monte Seir e toda a Iduméia ficarão desolados (a Bíblia em português traz “todo o Edom”)."
    - "Judas Macabeu combateu os idumeus e tomou Hebrom. No final do século II a.C., João Hircano capturou Adora e Marisa e, diz Josefo, deixou os idumeus permanecerem em sua terra se aceitassem a circuncisão e a lei judaica. Sob Alexandre Janeu, Antipas, um idumeu, governou o distrito; seu filho Antípatro foi o pai de Herodes, o Grande. Durante a revolta contra Roma, os zelotes deixaram entrar em Jerusalém uma força idumeia, e esta matou o antigo sumo sacerdote Anano. Marisa foi escavada por F. J. Bliss e R. A. S. Macalister em 1898–1900 e por Amos Kloner a partir de 1989; seus túmulos pintados e complexos de cavernas formam o Parque Nacional Bet Guvrin–Maresha, em Israel, na lista do Patrimônio Mundial da UNESCO desde 2014."
  de:
    - "Idumäa ist die griechische Form des Namens Edom, bezeichnete aber in persischer, hellenistischer und römischer Zeit einen Bezirk westlich der Araba: die südlichen Berge Judas und die südliche Schefela, etwa von Bet-Zur südwärts bis in die Gegend von Beerscheba, mit Hebron, Adoraim und Marisa (Maresa) unter seinen Städten. Edomiter waren in diesem Land in der späten Eisenzeit und besonders nach dem Fall Judas 586 v. Chr. eingewandert. Hunderte aramäischer Ostraka des vierten Jahrhunderts v. Chr. aus der Gegend verzeichnen viele Personennamen, die mit Qos, dem edomitischen Gott, gebildet sind. Die Region liegt heute im südlichen Hebroner Bergland des Westjordanlands und im angrenzenden Teil Israels."
    - "Markus berichtet, dass, als Jesus sich an den See Genezareth zurückzog, „viel Volks folgte ihm nach aus Galiläa und aus Judäa und von Jerusalem und aus Idumäa und von jenseits des Jordans“. Idumäa ist das südlichste Land der Aufzählung, die Menge kam also aus dem ganzen jüdischen Land und darüber hinaus. Dies ist seine einzige Erwähnung im Neuen Testament; im Alten Testament steht der Name für Edom selbst, in der King-James-Bibel selten und in der Synodalbibel oft, so in der King-James-Fassung von Hesekiels Drohung, der Berg Seir müsse wüst werden samt ganz Idumäa."
    - "Judas Makkabäus bekämpfte die Idumäer und nahm Hebron ein. Im späten zweiten Jahrhundert v. Chr. eroberte Johannes Hyrkanos Adora und Marisa und ließ, sagt Josephus, die Idumäer in ihrem Land bleiben, wenn sie die Beschneidung und das jüdische Gesetz annahmen. Unter Alexander Jannäus regierte der Idumäer Antipas den Bezirk; sein Sohn Antipater war der Vater Herodes' des Großen. Während des Aufstands gegen Rom ließen die Zeloten ein idumäisches Heer in Jerusalem ein, und es tötete den früheren Hohenpriester Ananos. Marisa wurde 1898–1900 von F. J. Bliss und R. A. S. Macalister und seit 1989 von Amos Kloner ausgegraben; seine bemalten Gräber und Höhlenkomplexe bilden den Nationalpark Beit Guvrin–Maresha in Israel, seit 2014 auf der UNESCO-Welterbeliste."
  fr:
    - "L’Idumée est la forme grecque du nom d’Édom, mais aux époques perse, hellénistique et romaine elle désignait un district à l’ouest de l’Araba : les collines méridionales de Juda et la Shéphéla du sud, d’environ Beth-Tsur vers le sud jusqu’à la région de Beer-Schéba, avec Hébron, Adoraïm et Marisa (Maréscha) parmi ses villes. Des Édomites s’étaient installés dans ce pays à la fin de l’âge du Fer et surtout après la chute de Juda en 586 av. J.-C. Des centaines d’ostraca araméens du IVe siècle av. J.-C. provenant de la région attestent de nombreux noms de personnes formés sur Qos, le dieu édomite. La région se trouve aujourd’hui dans le sud des collines d’Hébron, en Cisjordanie, et dans la partie voisine d’Israël."
    - "Marc raconte que, lorsque Jésus se retira vers la mer de Galilée, « une grande multitude le suivit de la Galilée ; et de la Judée, et de Jérusalem, et de l’Idumée, et d’au-delà du Jourdain ». L’Idumée est le pays le plus méridional de la liste, si bien que la foule venait de tout le pays juif et au-delà. C’est sa seule mention dans le Nouveau Testament ; dans l’Ancien, le nom désigne Édom lui-même, rarement dans la version du roi Jacques et souvent dans la Bible synodale, comme en Ézéchiel 35:15, où la version du roi Jacques et la Bible synodale annoncent à la montagne de Séir qu’elle sera désolée, « et toute l’Idumée » avec elle (Louis Segond : « Édom tout entier »)."
    - "Judas Maccabée combattit les Iduméens et prit Hébron. À la fin du IIe siècle av. J.-C., Jean Hyrcan s’empara d’Adora et de Marisa et, dit Josèphe, laissa les Iduméens dans leur pays s’ils acceptaient la circoncision et la loi juive. Sous Alexandre Jannée, Antipas, un Iduméen, gouvernait le district ; son fils Antipater fut le père d’Hérode le Grand. Pendant la révolte contre Rome, les zélotes firent entrer à Jérusalem une troupe iduméenne, qui tua l’ancien grand prêtre Ananos. Marisa fut fouillée par F. J. Bliss et R. A. S. Macalister en 1898–1900 et par Amos Kloner dès 1989 ; ses tombes peintes et ses complexes de cavernes forment le parc national de Beit Guvrin–Maresha, en Israël, inscrit au patrimoine mondial de l’UNESCO depuis 2014."
  it:
    - "Idumea è la forma greca del nome Edom, ma in epoca persiana, ellenistica e romana designava un distretto a ovest dell’Araba: le colline meridionali di Giuda e la Sefela meridionale, grosso modo da Bet-Zur verso sud fino alla regione di Bersabea, con Ebron, Adoraim e Maresa tra le sue città. Gli Edomiti si erano trasferiti in questa terra nella tarda età del Ferro e soprattutto dopo la caduta di Giuda nel 586 a.C. Centinaia di ostraca aramaici del IV secolo a.C. provenienti dalla zona registrano molti nomi personali formati con Qos, il dio edomita. La regione si trova oggi nelle colline meridionali di Ebron, in Cisgiordania, e nella parte adiacente di Israele."
    - "Marco racconta che quando Gesù si ritirò verso il mare di Galilea «dalla Galilea gran moltitudine lo seguitò; e dalla Giudea e da Gerusalemme e dalla Idumea e da oltre il Giordano». L’Idumea è la terra più meridionale dell’elenco, perciò la folla veniva da tutto il paese ebraico e da oltre. È la sua unica menzione nel Nuovo Testamento; nell’Antico Testamento il nome sta per lo stesso Edom, di rado nella King James Version e spesso nella Bibbia sinodale, come nel versetto di Ezechiele in cui, nella King James Version, il monte Seir e tutta Idumea diventano una desolazione."
    - "Giuda Maccabeo combatté gli Idumei e prese Ebron. Alla fine del II secolo a.C. Giovanni Ircano conquistò Adora e Maresa e, dice Giuseppe Flavio, lasciò gli Idumei nella loro terra se accettavano la circoncisione e la legge giudaica. Sotto Alessandro Ianneo, Antipa, un Idumeo, governò il distretto; suo figlio Antipatro fu il padre di Erode il Grande. Durante la rivolta contro Roma gli Zeloti fecero entrare a Gerusalemme una forza idumea, e questa uccise l’ex sommo sacerdote Anano. Maresa fu scavata da F. J. Bliss e R. A. S. Macalister nel 1898–1900 e da Amos Kloner dal 1989; le sue tombe dipinte e i complessi di grotte formano il Parco nazionale di Beit Guvrin–Maresha, in Israele, nella lista del patrimonio mondiale dell’UNESCO dal 2014."
  nl:
    - "Idumea is de Griekse vorm van de naam Edom, maar in de Perzische, hellenistische en Romeinse tijd betekende het een district ten westen van de Araba: de zuidelijke heuvels van Juda en de zuidelijke Sefela, van ongeveer Beth-Zur zuidwaarts tot de streek van Berseba, met Hebron, Adoraïm en Marisa (Maresa) onder zijn steden. Edomieten hadden zich in de late ijzertijd en vooral na de val van Juda in 586 v.Chr. in dit land gevestigd. Honderden Aramese ostraca uit de vierde eeuw v.Chr. uit het gebied vermelden veel persoonsnamen gevormd met Qos, de Edomitische god. De streek ligt tegenwoordig in de zuidelijke heuvels van Hebron op de Westelijke Jordaanoever en in het aangrenzende deel van Israël."
    - "Marcus vertelt dat toen Jezus zich naar het Meer van Galilea terugtrok, “Hem volgde een grote menigte van Galilea, en van Judea, en van Jeruzalem, en van Idumea, en van over de Jordaan”. Idumea is het zuidelijkste land in de lijst, zodat de menigte uit het hele Joodse land en daarbuiten kwam. Dit is de enige vermelding in het Nieuwe Testament; in het Oude Testament staat de naam voor Edom zelf, zelden in de KJV en vaak in de Synodale Bijbel, zoals in Ezechiël 35:15 in de KJV: “thou shalt be desolate, O mount Seir, and all Idumea” (de Statenvertaling heeft hier “gans Edom”)."
    - "Judas Makkabeüs bestreed de Idumeeërs en nam Hebron in. Aan het eind van de tweede eeuw v.Chr. veroverde Johannes Hyrcanus Adora en Marisa en liet de Idumeeërs, zegt Josephus, in hun land blijven als zij de besnijdenis en de Joodse wet aannamen. Onder Alexander Jannaeüs bestuurde Antipas, een Idumeeër, het district; zijn zoon Antipater was de vader van Herodes de Grote. Tijdens de opstand tegen Rome lieten de zeloten een Idumees leger Jeruzalem binnen, en zij doodden de gewezen hogepriester Ananus. Marisa werd in 1898–1900 opgegraven door F. J. Bliss en R. A. S. Macalister en vanaf 1989 door Amos Kloner; de beschilderde graven en grotcomplexen vormen het Beit Guvrin–Maresha National Park in Israël, sinds 2014 op de werelderfgoedlijst van UNESCO."
  pl:
    - "Idumea to grecka forma nazwy Edom, lecz w okresie perskim, hellenistycznym i rzymskim oznaczała okręg na zachód od Araby: południowe wzgórza Judy i południową Szefelę, mniej więcej od Bet-Sur na południe po okolice Beer-Szeby, z Hebronem, Adoraim i Marisą (Maresza) wśród jej miast. Edomici przenieśli się na tę ziemię w późnej epoce żelaza, zwłaszcza po upadku Judy w 586 p.n.e. Setki aramejskich ostrakonów z IV w. p.n.e. z tego obszaru zapisują wiele imion osobowych utworzonych od Qos, boga edomickiego. Region leży dziś w południowych wzgórzach Hebronu na Zachodnim Brzegu i w przyległej części Izraela."
    - "Marek opowiada, że gdy Jezus ustąpił nad Jezioro Galilejskie, „wielkie mnóstwo szło za nim z Galilei i z ziemi Judzkiej, i z Jeruzalemu, i z Idumei, i zza Jordanu”. Idumea jest najdalej na południe położoną krainą na tej liście, więc tłum przybył z całego kraju żydowskiego i spoza niego. Jest to jedyna jej wzmianka w Nowym Testamencie; w Starym Testamencie nazwa oznacza samą Edom, rzadko w Biblii Króla Jakuba, a często w Biblii synodalnej, jak w Ez 35,15, gdzie w Biblii Króla Jakuba (nie w Biblii Gdańskiej, która ma tam „ziemię Edomską”) góra Seir i cała Idumea mają zostać spustoszone."
    - "Juda Machabeusz walczył z Idumejczykami i zdobył Hebron. Pod koniec II wieku p.n.e. Jan Hirkan zdobył Adorę i Marisę i, jak mówi Józef Flawiusz, pozwolił Idumejczykom pozostać na ich ziemi, jeśli przyjmą obrzezanie i prawo żydowskie. Za Aleksandra Jannaja okręgiem rządził Antypas, Idumejczyk; jego syn Antypater był ojcem Heroda Wielkiego. Podczas powstania przeciw Rzymowi zeloci wpuścili do Jerozolimy oddział idumejski, który zabił dawnego arcykapłana Ananosa. Marisę badali F. J. Bliss i R. A. S. Macalister w latach 1898-1900 oraz Amos Kloner od 1989 roku; jej malowane grobowce i kompleksy jaskiń tworzą Park Narodowy Bet Guwrin-Maresza w Izraelu, od 2014 roku na liście światowego dziedzictwa UNESCO."
  cs:
    - "Idumea je řecká podoba jména Edóm, ale v perském, helénistickém a římském období znamenala okres západně od Araby: jižní judské hory a jižní Šefelu, přibližně od Bét-cúru na jih až do kraje Beer-šeby, s městy Hebronem, Adóraimem a Marisou (Marešou). Edómci se do této země přesunuli v pozdní době železné a zvláště po pádu Judy roku 586 př. n. l. Stovky aramejských ostrak ze čtvrtého století př. n. l. z této oblasti zaznamenávají mnoho osobních jmen tvořených s Qósem, edómským bohem. Oblast leží dnes v jižních hebronských horách na Západním břehu a v přilehlé části Izraele."
    - "Marek vypráví, že když se Ježíš odebral k Galilejskému jezeru, „veliké množství od Galilee šlo za ním, i z Judstva, i od Jeruzaléma, i od Idumee, i z Zajordání“. Idumea je v seznamu nejjižnější zemí, takže zástup přišel z celé židovské země i z dalších krajů. Je to jediná zmínka o ní v Novém zákoně; ve Starém zákoně znamená jméno samo Edóm, v KJV zřídka a v synodální Bibli často, jako v Ezechielově „Pustinou budeš, ó horo Seir, i všecka země Idumejská naskrze“."
    - "Juda Makabejský bojoval s Idumejci a dobyl Hebron. Koncem druhého století př. n. l. dobyl Jan Hyrkán Adoru a Marisu a podle Josepha Flavia nechal Idumejce v jejich zemi, přijmou-li obřízku a židovský zákon. Za Alexandra Jannaia spravoval okres Idumejec Antipas; jeho syn Antipatros byl otcem Heroda Velikého. Za povstání proti Římu vpustili zélóti do Jeruzaléma idumejskou jednotku a ti zabili bývalého nejvyššího kněze Ananose. Marisu zkoumali F. J. Bliss a R. A. S. Macalister v letech 1898–1900 a Amos Kloner od roku 1989; její malované hrobky a jeskynní komplexy tvoří Národní park Bejt Guvrin–Mareša v Izraeli, od roku 2014 na seznamu světového dědictví UNESCO."
  sv:
    - "Idumeen är den grekiska formen av namnet Edom, men under den persiska, hellenistiska och romerska tiden betydde det ett distrikt väster om Arava: Judas södra berg och södra Shefela, från omkring Bet-Sur söderut till trakten av Beer Sheva, med Hebron, Adorajim och Marisa (Maresha) bland sina städer. Edomiter hade flyttat in i detta land sent under järnåldern och särskilt efter Judas fall 586 f.Kr. Hundratals arameiska ostraka från 300-talet f.Kr. från området upptar många personnamn bildade med Qos, den edomitiska guden. Regionen ligger i dag i södra Hebronbergen på Västbanken och i den angränsande delen av Israel."
    - "Markus berättar att när Jesus drog sig undan till Galileiska sjön följde honom ”en stor hop folk ... från Galileen. Och från Judeen och Jerusalem och Idumeen och från landet på andra sidan Jordan”. Idumeen är det sydligaste landet i förteckningen, så skaran kom från hela det judiska landet och bortom. Detta är dess enda omnämnande i Nya testamentet; i Gamla testamentet står namnet för Edom självt, sällan i King James-bibeln och ofta i den ryska synodalbibeln, som i Hesekiels ord till berget Seir och hela Idumeen."
    - "Judas mackabeen stred mot idumeerna och intog Hebron. Sent på 100-talet f.Kr. intog Johannes Hyrkanos Adora och Marisa och lät, säger Josefus, idumeerna stanna i sitt land om de antog omskärelsen och den judiska lagen. Under Alexander Jannaios styrde idumeen Antipas distriktet; hans son Antipater var far till Herodes den store. Under upproret mot Rom släppte zeloterna in en idumeisk styrka i Jerusalem, och den dödade den förre översteprästen Ananos. Marisa grävdes ut av F. J. Bliss och R. A. S. Macalister 1898–1900 och av Amos Kloner från 1989; dess målade gravar och grottkomplex bildar nationalparken Beit Guvrin–Maresha i Israel, på Unescos världsarvslista sedan 2014."
