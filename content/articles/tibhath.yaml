body:
  en:
    - "Tibhath was a city of Hadarezer (Hadadezer), the Aramaean king of Zobah, from which David took bronze after defeating him: “from Tibhath, and from Chun, cities of Hadarezer, brought David very much brass, wherewith Solomon made the brasen sea, and the pillars, and the vessels of brass.” The parallel in Samuel names the two cities Betah and Berothai, and Betah is commonly taken as a copyist's slip for Tebah, the same name as Tibhath; a Tebah also appears among the Aramaean sons of Nahor in Genesis."
    - "Its exact site is unknown. Zobah lay in the Beqaa Valley of Lebanon and the country north of it, between Baalbek and Kadesh on the Orontes, and Tibhath is usually connected with Tubihi, a town of that region named in Egyptian sources and the Amarna letters of the fourteenth century BC. The map shows three areas: between Baalbek and Kadesh, the Beqaa Valley, and the neighbourhood of Zobah. No site has been excavated as Tibhath; the region is today the northern Beqaa of Lebanon and the Homs district of Syria."
  ru:
    - "Тивхава — город Адраазара, арамейского царя Сувы, из которого Давид, победив его, взял медь: «А из Тивхавы и Куна, городов Адраазаровых, взял Давид весьма много меди. Из нее Соломон сделал медное море и столбы и медные сосуды». В параллельном месте книги Царств эти города названы Бефа и Берофа, и Бефу обычно считают ошибкой переписчика вместо Теваха — того же имени, что Тивхава; Тевах встречается и среди арамейских сыновей Нахора в книге Бытия."
    - "Точное место неизвестно. Сува лежала в долине Бекаа в Ливане и в стране к северу от неё, между Баальбеком и Кадешем на Оронте, и Тивхаву обычно связывают с Тубихи — городом этой области, упомянутым в египетских источниках и в амарнских письмах XIV века до н. э. На карте показаны три области: между Баальбеком и Кадешем, долину Бекаа и окрестности Сувы. Ни одно место как Тивхава не раскопано; эта область сегодня — север Бекаа в Ливане и округ Хомс в Сирии."
  uk:
    - "Тівхава була містом Адраазара (Хададезера), арамейського царя Суви, з якого Давид узяв мідь після його перемоги над ним: «А з Тивхати, та з Куна, міст Адраазерових, взяв Давид дуже багато мідї. З неї поробив Соломон мідяне море й стовпи й мідяний посуд». Паралельне місце в Самуїла називає ці два міста Бета й Берот, і Бету зазвичай вважають помилкою переписувача замість Тевах, тієї самої назви, що й Тівхава; Тевах з’являється також серед арамейських синів Нахора в Книзі Буття."
    - "Її точне місце невідоме. Сува лежала в долині Бекаа в Лівані та в краю на північ від неї, між Баальбеком і Кадешем на Оронті, а Тівхаву зазвичай пов’язують із Тубіхі, містом цієї області, названим в єгипетських джерелах і листах з Амарни XIV ст. до н. е. Мапа показує три райони: між Баальбеком і Кадешем, долину Бекаа та околиці Суви. Жодне місце не розкопане як Тівхава; нині цей край — північна Бекаа в Лівані та район Хомса в Сирії."
  es:
    - "Tibhat era una ciudad de Adarezer (Hadad-ezer), el rey arameo de Soba, de la cual David tomó bronce tras derrotarlo: «Asimismo de Thibath y de Chûn ciudades de Adarezer, tomó David muy mucho metal, de que Salomón hizo el mar de bronce, las columnas, y vasos de bronce». El paralelo de Samuel nombra las dos ciudades Beta y Berotai, y Beta se toma comúnmente por un error de copista por Teba, el mismo nombre que Tibhat; también aparece un Teba entre los hijos arameos de Nacor en el Génesis."
    - "Su emplazamiento exacto se desconoce. Soba se hallaba en el valle de la Beqaa, en el Líbano, y en el país al norte de él, entre Baalbek y Cades del Orontes, y Tibhat se relaciona habitualmente con Tubihi, una ciudad de esa región nombrada en fuentes egipcias y en las cartas de Amarna del siglo XIV a. C. El mapa muestra tres zonas: entre Baalbek y Cades, el valle de la Beqaa y las inmediaciones de Soba. Ningún sitio ha sido excavado como Tibhat; la región es hoy el norte de la Beqaa, en el Líbano, y el distrito de Homs, en Siria."
  pt:
    - "Tibate era uma cidade de Hadadezer, rei arameu de Zobá, da qual Davi tomou bronze depois de derrotá-lo: “De Tibate e de Cum, cidades de Hadadezer, Davi tomou muitíssimo bronze, com o qual Salomão fez o mar de bronze, as colunas e os utensílios de bronze.” O paralelo em Samuel dá às duas cidades os nomes Betá e Berotai, e Betá é comumente tomada por lapso de copista por Tebá, o mesmo nome que Tibate; um Tebá aparece também entre os filhos arameus de Naor em Gênesis."
    - "Seu sítio exato é desconhecido. Zobá ficava no vale de Beqaa, no Líbano, e na região ao norte dele, entre Baalbek e Cades, no Orontes, e Tibate costuma ser ligada a Tubihi, cidade dessa região citada em fontes egípcias e nas cartas de Amarna do século XIV a.C. O mapa mostra três áreas: entre Baalbek e Cades, o vale de Beqaa e as imediações de Zobá. Nenhum sítio foi escavado como Tibate; a região é hoje o norte de Beqaa, no Líbano, e o distrito de Homs, na Síria."
  de:
    - "Tibhat war eine Stadt Hadadesers (Hadarezers), des aramäischen Königs von Zoba, aus der David nach dessen Besiegung Bronze nahm: „Auch nahm David aus den Städten Hadadesers, Tibehath und Chun, sehr viel Erz, davon Salomo das eherne Meer und die Säulen und eherne Gefäße machte“. Die Parallele bei Samuel nennt die beiden Städte Betah und Berotai, und Betah gilt gemeinhin als Abschreibfehler für Tebach, denselben Namen wie Tibhat; auch unter den aramäischen Söhnen Nahors in der Genesis erscheint ein Tebach."
    - "Ihre genaue Lage ist unbekannt. Zoba lag in der Beqaa-Ebene des Libanon und dem Land nördlich davon, zwischen Baalbek und Kadesch am Orontes, und Tibhat wird meist mit Tubihi verbunden, einer Stadt dieser Region, die in ägyptischen Quellen und den Amarna-Briefen des vierzehnten Jahrhunderts v. Chr. genannt wird. Die Karte zeigt drei Gebiete: zwischen Baalbek und Kadesch, die Beqaa-Ebene und die Umgebung von Zoba. Keine Stätte ist als Tibhat ausgegraben worden; die Region ist heute die nördliche Beqaa im Libanon und der Distrikt Homs in Syrien."
  fr:
    - "Thibchath était une ville d’Hadarézer (Hadadézer), roi araméen de Tsoba, où David prit du bronze après l’avoir vaincu : « David prit encore une grande quantité d’airain à Thibchath et à Cun, villes d’Hadarézer. Salomon en fit la mer d’airain, les colonnes et les ustensiles d’airain. » Le passage parallèle de Samuel nomme les deux villes Béthach et Bérothaï, et Béthach passe communément pour une faute de copiste pour Thébach, le même nom que Thibchath ; un Thébach figure aussi parmi les fils araméens de Nachor dans la Genèse."
    - "Son site exact est inconnu. Tsoba se trouvait dans la vallée de la Beqaa, au Liban, et le pays au nord, entre Baalbek et Qadesh sur l’Oronte, et Thibchath est d’ordinaire rapprochée de Tubihi, ville de cette région nommée dans des sources égyptiennes et dans les lettres d’Amarna du XIVe siècle av. J.-C. La carte montre trois zones : entre Baalbek et Qadesh, la vallée de la Beqaa, et les abords de Tsoba. Aucun site n’a été fouillé comme étant Thibchath ; la région est aujourd’hui la Beqaa nord du Liban et le district de Homs, en Syrie."
  pl:
    - "Tibchat było miastem Hadadezera (Hadarezera), aramejskiego króla Soby, z którego Dawid zabrał miedź po jego pokonaniu: „Przytem z Tybchat i z Chun, miast Hadarezerowych, nabrał Dawid miedzi bardzo wiele, z której Salomon sprawił morze miedziane, i słupy, i naczynia miedziane.” Paralelne miejsce w Księdze Samuela nazywa te dwa miasta Betach i Berotaj, a Betach uważa się powszechnie za pomyłkę kopisty zamiast Tebach, tej samej nazwy co Tibchat; Tebach pojawia się też wśród aramejskich synów Nachora w Księdze Rodzaju."
    - "Jego dokładne położenie jest nieznane. Soba leżała w Dolinie Bekaa w Libanie i w kraju na północ od niej, między Baalbekiem a Kadesz nad Orontesem, a Tibchat łączy się zwykle z Tubihi, miastem tego regionu wymienianym w źródłach egipskich i listach z Amarna z XIV wieku p.n.e. Mapa pokazuje trzy obszary: między Baalbekiem a Kadesz, Dolinę Bekaa i okolice Soby. Żadne stanowisko nie było badane wykopaliskowo jako Tibchat; region ten to dziś północna Bekaa w Libanie i okręg Hims w Syrii."
  it:
    - "Tibcat era una città di Adarezer (Adadezer), il re aramaico di Zoba, da cui Davide prese il bronzo dopo averlo sconfitto: «Davide prese anche una grande quantità di rame a Tibhath e a Cun, città di Hadarezer. Salomone se ne servì per fare il mar di rame, le colonne e gli utensili di rame». Il passo parallelo di Samuele chiama le due città Betach e Berotai, e Betach è comunemente ritenuto una svista di copista per Tebach, lo stesso nome di Tibcat; un Tebach compare anche fra i figli aramei di Nacor nella Genesi."
    - "Il suo sito esatto è ignoto. Zoba si trovava nella valle della Beqa in Libano e nel paese a nord di essa, fra Baalbek e Kades sull’Oronte, e Tibcat è di solito collegata con Tubihi, una città di quella regione nominata nelle fonti egizie e nelle lettere di Amarna del XIV secolo a.C. La mappa mostra tre aree: fra Baalbek e Kades, la valle della Beqa e i dintorni di Zoba. Nessun sito è stato scavato come Tibcat; la regione è oggi la Beqa settentrionale del Libano e il distretto di Homs in Siria."
  nl:
    - "Tibchat was een stad van Hadarezer (Hadadezer), de Arameese koning van Soba, vanwaar David brons nam na hem te hebben verslagen: “zeer veel kopers uit Tibchath, en uit Chun, steden van Hadar-ezer; daarvan heeft Salomo de koperen zee, en de pilaren, en de koperen vaten gemaakt.” De parallelle tekst in Samuël noemt de twee steden Betach en Berotai, en Betach wordt gewoonlijk beschouwd als een schrijffout voor Tebach, dezelfde naam als Tibchat; een Tebach komt ook voor onder de Arameese zonen van Nahor in Genesis."
    - "De precieze ligging is onbekend. Soba lag in de Beqaa-vallei van Libanon en het land ten noorden ervan, tussen Baalbek en Kades aan de Orontes, en Tibchat wordt gewoonlijk verbonden met Tubihi, een stad in die streek die in Egyptische bronnen en de Amarnabrieven van de veertiende eeuw v.Chr. wordt genoemd. De kaart toont drie gebieden: tussen Baalbek en Kades, de Beqaa-vallei, en de omgeving van Soba. Geen plek is als Tibchat opgegraven; de streek is tegenwoordig de noordelijke Beqaa van Libanon en het district Homs in Syrië."
  cs:
    - "Tibchat bylo město Hadarezerovo (Hadadezerovo), aramejského krále Sóby, z něhož David vzal měď po jeho porážce: „Z Tibchat též a z Chun, měst Hadarezerových, nabral David mědi velmi mnoho, z kteréž potom slil Šalomoun moře měděné, a sloupy i nádobí měděné“. Paralela v Samuelovi jmenuje obě města Betach a Berotaj a Betach se obvykle pokládá za opisovačskou chybu pro Tebach, totéž jméno jako Tibchat; Tebach se objevuje také mezi aramejskými syny Nachorovými v Genesis."
    - "Jeho přesná poloha není známa. Sóba ležela v údolí Bikáa v Libanonu a v zemi severně od něj, mezi Baalbekem a Kádešem na Orontu, a Tibchat se obvykle spojuje s Tubichi, městem té oblasti jmenovaným v egyptských pramenech a v amarnských listech 14. stol. př. n. l. Mapa ukazuje tři oblasti: mezi Baalbekem a Kádešem, údolí Bikáa a okolí Sóby. Žádná lokalita nebyla vykopána jako Tibchat; oblast je dnes severní Bikáa v Libanonu a okres Homs v Sýrii."
