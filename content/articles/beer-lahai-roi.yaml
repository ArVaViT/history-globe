# Overview article (ADR 0007). Mainstream facts only; the well has never been found, and the four candidates on the map are given without choosing.
id: beer-lahai-roi
place: a70e842
title:
  en: "Beer-lahai-roi"
  ru: "Беэр-лахай-рои"
  uk: "Беер-Лахай-Рої"
  es: "Beer-lahai-roi"
  pt: "Beer-Laai-Roi"
  de: "Beer-Lachai-Roï"
  fr: "Beer-Lachaï-Roï"
body:
  en:
    - "Beer-lahai-roi, “the well of the Living One who sees me”, was a well in the Negeb on the way to Shur, the desert toward Egypt. When Hagar fled from Sarai, “the angel of the LORD found her by a fountain of water in the wilderness, by the fountain in the way to Shur”, promised her a son, Ishmael, and sent her back. She called the LORD who spoke to her “Thou God seest me”, and so “the well was called Beer-lahai-roi; behold, it is between Kadesh and Bered”. Isaac later lived near it. He “came from the way of the well Lahai-roi; for he dwelt in the south country” on the evening when he saw the camels bringing Rebekah, and after Abraham's death “Isaac dwelt by the well Lahai-roi”."
    - "Bered is named nowhere else, and the well has never been found. Since Kadesh is usually put at Ain el-Qudeirat, searchers have looked at the springs west of it: in the 1840s the traveller John Rowlands heard the name of Ain Muweileh near Quseima as Moilahhi and took it for Lahai-roi, and that spring remains the first candidate on the map. Others have looked toward Haluza (Elusa), the Nabataean town between Beersheba and Kadesh, or to Jebel Umm el-Bared, whose name recalls Bered, and the Wadi Umm Rajil farther south-west. None of these is more than a guess from the two names, and the well itself may have been no more than a watering place known to shepherds."
    - "Today the springs of the Quseima oasis lie in Egyptian Sinai beside the Israeli border, and Haluza is a ruin in the Negev south-west of Beersheba, one of the desert towns of the Incense Route inscribed by UNESCO in 2005."
  ru:
    - "Беэр-лахай-рои, «источник Живого, видящего меня», — колодец в Негеве на дороге к Суру, пустыне на пути в Египет. Когда Агарь бежала от Сары, «нашел ее Ангел Господень у источника воды в пустыне, у источника на дороге к Суру», обещал ей сына, Измаила, и отослал назад. Господа, говорившего с ней, она назвала «Ты Бог видящий меня», и потому «источник тот называется: Беэр-лахай-рои. Он находится между Кадесом и между Баредом». Позже рядом с ним жил Исаак. «А Исаак пришел из Беэр-лахай-рои, ибо жил он в земле полуденной» в тот вечер, когда увидел верблюдов, везущих Ревекку, а по смерти Авраама «Исаак жил при Беэр-лахай-рои»."
    - "Баред больше нигде не назван, а колодец так и не найден. Поскольку Кадес обычно помещают у Айн-эль-Кудейрата, искали среди источников к западу от него: в 1840-х годах путешественник Джон Роулендс услышал имя Айн-Мувейле близ Кусеймы как «Моилахи» и принял его за Лахай-рои, и этот источник остаётся первым кандидатом на карте. Другие смотрели в сторону Халуцы (Елусы), набатейского города между Вирсавией и Кадесом, или к Джебель-Умм-эль-Бареду, чьё имя напоминает Баред, и к Вади-Умм-Раджиль дальше на юго-запад. Всё это не более чем догадки по двум именам, а сам колодец мог быть просто водопоем, известным пастухам."
    - "Сегодня источники оазиса Кусейма лежат на египетском Синае у израильской границы, а Халуца — развалины в Негеве к юго-западу от Беэр-Шевы, один из пустынных городов Дороги благовоний, внесённых в список ЮНЕСКО в 2005 году."
  uk:
    - "Беер-Лахай-Рої, «колодязь Живого, що мене бачить», був колодязем у Негеві на шляху до Сура, пустелі в бік Єгипту. Коли Агар утекла від Сари, «знайшов її ангел Господень коло криницї в пустинї, по дорозї в Сур», пообіцяв їй сина, Ізмаїла, і відіслав її назад. Вона назвала Господа, який до неї говорив: «Бог бачений», і тому «Тим прозвано криницю ту: „Криницею Живого, що мене бачить“. Се між Кадесом і Баредом». Ісаак згодом жив неподалік. Він «прийшов з Бейер-Лахай-Рої; жив бо він у землї полуденнїй» у вечір, коли побачив верблюдів, що привозили Ревеку, а по смерті Авраама «вселивсь Ізаак при колодязї Бейер-Лахай-Рої»."
    - "Баред більше ніде не названий, і колодязь ніколи не знайшли. Оскільки Кадес зазвичай ставлять в Айн-ель-Кудейраті, шукачі дивилися на джерела на захід від нього: у 1840-х роках мандрівник Джон Роулендс почув назву Айн-Мувейле біля Кусеїми як Мойлахі й вважав її за Лахай-Рої, і це джерело лишається першим кандидатом на мапі. Інші дивилися в бік Халуци (Елуси), набатейського міста між Беер-Шевою та Кадесом, або Джебель-Умм-ель-Бараду, чия назва нагадує Баред, і вадію Умм-Раджіль далі на південний захід. Жодне з них — не більше за здогад із двох назв, а сам колодязь міг бути лише водопоєм, відомим пастухам."
    - "Нині джерела оази Кусейма лежать у єгипетському Сінаї біля ізраїльського кордону, а Халуца — руїна в Негеві на південний захід від Беер-Шеви, одне з пустельних міст Шляху пахощів, внесених ЮНЕСКО до списку 2005 року."
  es:
    - "Beer-lahai-roi, «el pozo del Viviente que me ve», era un pozo del Néguev en el camino de Shur, el desierto hacia Egipto. Cuando Agar huyó de Sarai, «hallóla el ángel de Jehová junto á una fuente de agua en el desierto, junto á la fuente que está en el camino del Sur», le prometió un hijo, Ismael, y la devolvió. Ella llamó al Señor que le había hablado «Tú eres el Dios de la vista», y así «llamó al pozo, Pozo del Viviente que me ve. He aquí está entre Cades y Bered». Isaac vivió más tarde cerca de él. «Venía Isaac del pozo del Viviente que me ve; porque él habitaba en la tierra del Mediodía» la tarde en que vio los camellos que traían a Rebeca, y después de la muerte de Abraham «habitó Isaac junto al pozo del Viviente que me ve»."
    - "Bered no se nombra en ningún otro lugar, y el pozo nunca ha sido hallado. Como Cades suele situarse en Ain el-Qudeirat, los buscadores han mirado a los manantiales al oeste de ella: en la década de 1840 el viajero John Rowlands oyó el nombre de Ain Muweileh, cerca de Quseima, como Moilahhi y lo tomó por Lahai-roi, y ese manantial sigue siendo el primer candidato del mapa. Otros han mirado hacia Haluza (Elusa), la ciudad nabatea entre Beerseba y Cades, o al Jebel Umm el-Bared, cuyo nombre recuerda a Bered, y el uadi Umm Rajil, más al sudoeste. Ninguno de estos es más que una conjetura a partir de los dos nombres, y el propio pozo pudo no ser más que un abrevadero conocido de los pastores."
    - "Hoy los manantiales del oasis de Quseima se encuentran en el Sinaí egipcio junto a la frontera israelí, y Haluza es una ruina en el Néguev, al sudoeste de Beerseba, una de las ciudades del desierto de la Ruta del Incienso inscritas por la UNESCO en 2005."
  pt:
    - "Beer-Laai-Roi, “o poço do Vivente que me vê”, era um poço no Neguebe, a caminho de Sur, o deserto rumo ao Egito. Quando Agar fugiu de Sarai, “O anjo do SENHOR a encontrou junto a uma fonte de água no deserto, junto à fonte no caminho de Sur”, prometeu-lhe um filho, Ismael, e a mandou de volta. Ela invocou o nome do SENHOR que lhe falava: “Você é um Deus que vê”, e assim “o poço foi chamado de Beer-Laai-Roi. Eis que ele está entre Cades e Berede”. Isaque morou depois perto dele. “Isaque vinha do caminho de Beer-Laai-Roi, pois ele morava na terra do Sul” na tarde em que viu os camelos que traziam Rebeca, e depois da morte de Abraão “Isaque habitava perto de Beer-Laai-Roi”."
    - "Berede não é nomeada em nenhum outro lugar, e o poço nunca foi achado. Como Cades costuma ser posta em Ain el-Qudeirat, os pesquisadores olharam as fontes a oeste dela: na década de 1840 o viajante John Rowlands ouviu o nome de Ain Muweileh, perto de Quseima, como Moilahhi e o tomou por Laai-Roi, e essa fonte continua o primeiro candidato do mapa. Outros olharam para Haluza (Elusa), a cidade nabateia entre Berseba e Cades, ou para o Jebel Umm el-Bared, cujo nome lembra Berede, e para o uádi Umm Rajil, mais a sudoeste. Nenhum passa de conjetura a partir dos dois nomes, e o próprio poço pode ter sido apenas uma aguada conhecida dos pastores."
    - "Hoje as fontes do oásis de Quseima ficam no Sinai egípcio, junto à fronteira israelense, e Haluza é uma ruína no Neguev, a sudoeste de Berseba, uma das cidades do deserto da Rota do Incenso inscritas pela UNESCO em 2005."
  de:
    - "Beer-Lachai-Roï, „der Brunnen des Lebendigen, der mich sieht“, war ein Brunnen im Negev am Weg nach Schur, der Wüste gegen Ägypten. Als Hagar vor Sarai floh, „fand“ sie „der Engel des HERRN bei einem Wasserbrunnen in der Wüste, nämlich bei dem Brunnen am Wege gen Sur“, verhieß ihr einen Sohn, Ismael, und schickte sie zurück. Sie nannte den HERRN, der mit ihr redete: „Du Gott siehst mich“, und so „hieß man den Brunnen einen Brunnen des Lebendigen, der mich ansieht; welcher Brunnen ist zwischen Kades und Bared“. Isaak wohnte später in seiner Nähe. Er „kam vom Brunnen des Lebendigen und Sehenden (denn er wohnte im Lande gegen Mittag)“ an dem Abend, als er die Kamele sah, die Rebekka brachten, und nach dem Tod Abrahams „wohnte er bei dem Brunnen des Lebendigen und Sehenden“."
    - "Bered wird sonst nirgends genannt, und der Brunnen wurde nie gefunden. Da Kadesch gewöhnlich bei Ain el-Qudeirat angesetzt wird, hat man die Quellen westlich davon betrachtet: In den 1840er Jahren hörte der Reisende John Rowlands den Namen von Ain Muweile bei Quseima als Moilahhi und hielt ihn für Lachai-Roï, und diese Quelle bleibt der erste Kandidat auf der Karte. Andere blickten auf Haluza (Elusa), die nabatäische Stadt zwischen Beerscheba und Kadesch, oder auf den Dschebel Umm el-Bared, dessen Name an Bered erinnert, und den Wadi Umm Radschil weiter südwestlich. Keine dieser Gleichsetzungen ist mehr als eine Vermutung aus den beiden Namen, und der Brunnen selbst mag nicht mehr gewesen sein als eine den Hirten bekannte Tränke."
    - "Heute liegen die Quellen der Oase Quseima im ägyptischen Sinai neben der israelischen Grenze, und Haluza ist eine Ruine im Negev südwestlich von Beerscheba, eine der Wüstenstädte der Weihrauchstraße, 2005 von der UNESCO eingetragen."
  fr:
    - "Beer-Lachaï-Roï, « le puits du Vivant qui me voit », était un puits du Négev sur le chemin de Schur, le désert vers l’Égypte. Quand Agar fuit Saraï, « L’ange de l’Éternel la trouva près d’une source d’eau dans le désert, près de la source qui est sur le chemin de Schur », lui promit un fils, Ismaël, et la renvoya. Elle appela l’Éternel qui lui avait parlé « Atta-El-roï », c’est-à-dire « Tu es un Dieu qui me voit », et « C’est pourquoi l’on a appelé ce puits le puits de Lachaï-roï ; il est entre Kadès et Bared ». Isaac vécut plus tard près de lui. Il « était revenu du puits de Lachaï-roï, et il habitait dans le pays du midi » le soir où il vit les chameaux amenant Rebecca, et après la mort d’Abraham « Il habitait près du puits de Lachaï-roï »."
    - "Bered n’est nommé nulle part ailleurs, et le puits n’a jamais été retrouvé. Qadesh étant d’ordinaire placée à Ain el-Qudeirat, on a cherché aux sources à l’ouest : dans les années 1840, le voyageur John Rowlands entendit le nom d’Ain Muweileh près de Quseima sous la forme Moilahhi et le prit pour Lachaï-roï, et cette source reste le premier candidat de la carte. D’autres ont regardé vers Haluza (Élousa), la ville nabatéenne entre Beer-Schéba et Qadesh, ou vers le Jebel Umm el-Bared, dont le nom rappelle Bered, et le Wadi Umm Rajil plus au sud-ouest. Aucun n’est plus qu’une conjecture tirée des deux noms, et le puits lui-même n’était peut-être qu’un point d’eau connu des bergers."
    - "Aujourd’hui les sources de l’oasis de Quseima sont dans le Sinaï égyptien, contre la frontière israélienne, et Haluza est une ruine du Négev au sud-ouest de Beer-Schéba, l’une des villes du désert de la route de l’encens inscrites par l’UNESCO en 2005."
