body:
  en:
    - "Beer-lahai-roi, “the well of the Living One who sees me”, was a well in the Negeb on the way to Shur, the desert toward Egypt. When Hagar fled from Sarai, “the angel of the LORD found her by a fountain of water in the wilderness, by the fountain in the way to Shur”, promised her a son, Ishmael, and sent her back. She called the LORD who spoke to her “Thou God seest me”, and so “the well was called Beer-lahai-roi; behold, it is between Kadesh and Bered”. Isaac later lived near it. He “came from the way of the well Lahai-roi; for he dwelt in the south country” on the evening when he saw the camels bringing Rebekah, and after Abraham's death “Isaac dwelt by the well Lahai-roi”."
    - "Bered is named nowhere else, and the well has never been found. Since Kadesh is usually put at Ain el-Qudeirat, searchers have looked at the springs west of it: in the 1840s the traveller John Rowlands heard the name of Ain Muweileh near Quseima as Moilahhi and took it for Lahai-roi, and that spring remains the first candidate on the map. Others have looked toward Haluza (Elusa), the Nabataean town between Beersheba and Kadesh, or to Jebel Umm el-Bared, whose name recalls Bered, and the Wadi Umm Rajil farther west. None of these is more than a guess from the two names, and the well itself may have been no more than a watering place known to shepherds."
    - "Today the springs of the Quseima oasis lie in Egyptian Sinai beside the Israeli border, and Haluza is a ruin in the Negev south-west of Beersheba, one of the desert towns of the Incense Route inscribed by UNESCO in 2005."
  ru:
    - "Беэр-лахай-рои, «источник Живого, видящего меня», — колодец в Негеве на дороге к Суру, пустыне на пути в Египет. Когда Агарь бежала от Сары, «нашел ее Ангел Господень у источника воды в пустыне, у источника на дороге к Суру», обещал ей сына, Измаила, и отослал назад. Господа, говорившего с ней, она назвала «Ты Бог видящий меня», и потому «источник тот называется: Беэр-лахай-рои. Он находится между Кадесом и между Баредом». Позже рядом с ним жил Исаак. «А Исаак пришел из Беэр-лахай-рои, ибо жил он в земле полуденной» в тот вечер, когда увидел верблюдов, везущих Ревекку, а по смерти Авраама «Исаак жил при Беэр-лахай-рои»."
    - "Баред больше нигде не назван, а колодец так и не найден. Поскольку Кадес обычно помещают у Айн-эль-Кудейрата, искали среди источников к западу от него: в 1840-х годах путешественник Джон Роулендс услышал имя Айн-Мувейле близ Кусеймы как «Моилахи» и принял его за Лахай-рои, и этот источник остаётся первым кандидатом на карте. Другие смотрели в сторону Халуцы (Елусы), набатейского города между Вирсавией и Кадесом, или к Джебель-Умм-эль-Бареду, чьё имя напоминает Баред, и к Вади-Умм-Раджиль дальше на запад. Всё это не более чем догадки по двум именам, а сам колодец мог быть просто водопоем, известным пастухам."
    - "Сегодня источники оазиса Кусейма лежат на египетском Синае у израильской границы, а Халуца — развалины в Негеве к юго-западу от Беэр-Шевы, один из пустынных городов Дороги благовоний, внесённых в список ЮНЕСКО в 2005 году."
  uk:
    - "Беер-Лахай-Рої, «колодязь Живого, що мене бачить», був колодязем у Негеві на шляху до Сура, пустелі в бік Єгипту. Коли Агар утекла від Сари, «знайшов її ангел Господень коло криницї в пустинї, по дорозї в Сур», пообіцяв їй сина, Ізмаїла, і відіслав її назад. Вона назвала Господа, який до неї говорив: «Бог бачений», і тому «Тим прозвано криницю ту: „Криницею Живого, що мене бачить“. Се між Кадесом і Баредом». Ісаак згодом жив неподалік. Він «прийшов з Бейер-Лахай-Рої; жив бо він у землї полуденнїй» у вечір, коли побачив верблюдів, що привозили Ревеку, а по смерті Авраама «вселивсь Ізаак при колодязї Бейер-Лахай-Рої»."
    - "Баред більше ніде не названий, і колодязь ніколи не знайшли. Оскільки Кадес зазвичай ставлять в Айн-ель-Кудейраті, шукачі дивилися на джерела на захід від нього: у 1840-х роках мандрівник Джон Роулендс почув назву Айн-Мувейле біля Кусеїми як Мойлахі й вважав її за Лахай-Рої, і це джерело лишається першим кандидатом на мапі. Інші дивилися в бік Халуци (Елуси), набатейського міста між Беер-Шевою та Кадесом, або Джебель-Умм-ель-Бараду, чия назва нагадує Баред, і вадію Умм-Раджіль далі на захід. Жодне з них — не більше за здогад із двох назв, а сам колодязь міг бути лише водопоєм, відомим пастухам."
    - "Нині джерела оази Кусейма лежать у єгипетському Сінаї біля ізраїльського кордону, а Халуца — руїна в Негеві на південний захід від Беер-Шеви, одне з пустельних міст Шляху пахощів, внесених ЮНЕСКО до списку 2005 року."
  es:
    - "Beer-lahai-roi, «el pozo del Viviente que me ve», era un pozo del Néguev en el camino de Shur, el desierto hacia Egipto. Cuando Agar huyó de Sarai, «hallóla el ángel de Jehová junto á una fuente de agua en el desierto, junto á la fuente que está en el camino del Sur», le prometió un hijo, Ismael, y la devolvió. Ella llamó al Señor que le había hablado «Tú eres el Dios de la vista», y así «llamó al pozo, Pozo del Viviente que me ve. He aquí está entre Cades y Bered». Isaac vivió más tarde cerca de él. «Venía Isaac del pozo del Viviente que me ve; porque él habitaba en la tierra del Mediodía» la tarde en que vio los camellos que traían a Rebeca, y después de la muerte de Abraham «habitó Isaac junto al pozo del Viviente que me ve»."
    - "Bered no se nombra en ningún otro lugar, y el pozo nunca ha sido hallado. Como Cades suele situarse en Ain el-Qudeirat, los buscadores han mirado a los manantiales al oeste de ella: en la década de 1840 el viajero John Rowlands oyó el nombre de Ain Muweileh, cerca de Quseima, como Moilahhi y lo tomó por Lahai-roi, y ese manantial sigue siendo el primer candidato del mapa. Otros han mirado hacia Haluza (Elusa), la ciudad nabatea entre Beerseba y Cades, o al Jebel Umm el-Bared, cuyo nombre recuerda a Bered, y el uadi Umm Rajil, más al oeste. Ninguno de estos es más que una conjetura a partir de los dos nombres, y el propio pozo pudo no ser más que un abrevadero conocido de los pastores."
    - "Hoy los manantiales del oasis de Quseima se encuentran en el Sinaí egipcio junto a la frontera israelí, y Haluza es una ruina en el Néguev, al sudoeste de Beerseba, una de las ciudades del desierto de la Ruta del Incienso inscritas por la UNESCO en 2005."
  pt:
    - "Beer-Laai-Roi, “o poço do Vivente que me vê”, era um poço no Neguebe, a caminho de Sur, o deserto rumo ao Egito. Quando Agar fugiu de Sarai, “O anjo do SENHOR a encontrou junto a uma fonte de água no deserto, junto à fonte no caminho de Sur”, prometeu-lhe um filho, Ismael, e a mandou de volta. Ela invocou o nome do SENHOR que lhe falava: “Você é um Deus que vê”, e assim “o poço foi chamado de Beer-Laai-Roi. Eis que ele está entre Cades e Berede”. Isaque morou depois perto dele. “Isaque vinha do caminho de Beer-Laai-Roi, pois ele morava na terra do Sul” na tarde em que viu os camelos que traziam Rebeca, e depois da morte de Abraão “Isaque habitava perto de Beer-Laai-Roi”."
    - "Berede não é nomeada em nenhum outro lugar, e o poço nunca foi achado. Como Cades costuma ser posta em Ain el-Qudeirat, os pesquisadores olharam as fontes a oeste dela: na década de 1840 o viajante John Rowlands ouviu o nome de Ain Muweileh, perto de Quseima, como Moilahhi e o tomou por Laai-Roi, e essa fonte continua o primeiro candidato do mapa. Outros olharam para Haluza (Elusa), a cidade nabateia entre Berseba e Cades, ou para o Jebel Umm el-Bared, cujo nome lembra Berede, e para o uádi Umm Rajil, mais a oeste. Nenhum passa de conjetura a partir dos dois nomes, e o próprio poço pode ter sido apenas uma aguada conhecida dos pastores."
    - "Hoje as fontes do oásis de Quseima ficam no Sinai egípcio, junto à fronteira israelense, e Haluza é uma ruína no Neguev, a sudoeste de Berseba, uma das cidades do deserto da Rota do Incenso inscritas pela UNESCO em 2005."
  de:
    - "Beer-Lachai-Roï, „der Brunnen des Lebendigen, der mich sieht“, war ein Brunnen im Negev am Weg nach Schur, der Wüste gegen Ägypten. Als Hagar vor Sarai floh, „fand“ sie „der Engel des HERRN bei einem Wasserbrunnen in der Wüste, nämlich bei dem Brunnen am Wege gen Sur“, verhieß ihr einen Sohn, Ismael, und schickte sie zurück. Sie nannte den HERRN, der mit ihr redete: „Du Gott siehst mich“, und so „hieß man den Brunnen einen Brunnen des Lebendigen, der mich ansieht; welcher Brunnen ist zwischen Kades und Bared“. Isaak wohnte später in seiner Nähe. Er „kam vom Brunnen des Lebendigen und Sehenden (denn er wohnte im Lande gegen Mittag)“ an dem Abend, als er die Kamele sah, die Rebekka brachten, und nach dem Tod Abrahams „wohnte er bei dem Brunnen des Lebendigen und Sehenden“."
    - "Bered wird sonst nirgends genannt, und der Brunnen wurde nie gefunden. Da Kadesch gewöhnlich bei Ain el-Qudeirat angesetzt wird, hat man die Quellen westlich davon betrachtet: In den 1840er Jahren hörte der Reisende John Rowlands den Namen von Ain Muweile bei Quseima als Moilahhi und hielt ihn für Lachai-Roï, und diese Quelle bleibt der erste Kandidat auf der Karte. Andere blickten auf Haluza (Elusa), die nabatäische Stadt zwischen Beerscheba und Kadesch, oder auf den Dschebel Umm el-Bared, dessen Name an Bered erinnert, und den Wadi Umm Radschil weiter westlich. Keine dieser Gleichsetzungen ist mehr als eine Vermutung aus den beiden Namen, und der Brunnen selbst mag nicht mehr gewesen sein als eine den Hirten bekannte Tränke."
    - "Heute liegen die Quellen der Oase Quseima im ägyptischen Sinai neben der israelischen Grenze, und Haluza ist eine Ruine im Negev südwestlich von Beerscheba, eine der Wüstenstädte der Weihrauchstraße, 2005 von der UNESCO eingetragen."
  fr:
    - "Beer-Lachaï-Roï, « le puits du Vivant qui me voit », était un puits du Négev sur le chemin de Schur, le désert vers l’Égypte. Quand Agar fuit Saraï, « L’ange de l’Éternel la trouva près d’une source d’eau dans le désert, près de la source qui est sur le chemin de Schur », lui promit un fils, Ismaël, et la renvoya. Elle appela l’Éternel qui lui avait parlé « Atta-El-roï », c’est-à-dire « Tu es un Dieu qui me voit », et « C’est pourquoi l’on a appelé ce puits le puits de Lachaï-roï ; il est entre Kadès et Bared ». Isaac vécut plus tard près de lui. Il « était revenu du puits de Lachaï-roï, et il habitait dans le pays du midi » le soir où il vit les chameaux amenant Rebecca, et après la mort d’Abraham « Il habitait près du puits de Lachaï-roï »."
    - "Bered n’est nommé nulle part ailleurs, et le puits n’a jamais été retrouvé. Qadesh étant d’ordinaire placée à Ain el-Qudeirat, on a cherché aux sources à l’ouest : dans les années 1840, le voyageur John Rowlands entendit le nom d’Ain Muweileh près de Quseima sous la forme Moilahhi et le prit pour Lachaï-roï, et cette source reste le premier candidat de la carte. D’autres ont regardé vers Haluza (Élousa), la ville nabatéenne entre Beer-Schéba et Qadesh, ou vers le Jebel Umm el-Bared, dont le nom rappelle Bered, et le Wadi Umm Rajil plus à l’ouest. Aucun n’est plus qu’une conjecture tirée des deux noms, et le puits lui-même n’était peut-être qu’un point d’eau connu des bergers."
    - "Aujourd’hui les sources de l’oasis de Quseima sont dans le Sinaï égyptien, contre la frontière israélienne, et Haluza est une ruine du Négev au sud-ouest de Beer-Schéba, l’une des villes du désert de la route de l’encens inscrites par l’UNESCO en 2005."
  it:
    - "Beer-Lacai-Roi, «il pozzo del Vivente che mi vede», era un pozzo nel Negheb sulla via di Shur, il deserto verso l’Egitto. Quando Agar fuggì da Sarai, «l’angelo dell’Eterno la trovò presso una sorgente d’acqua, nel deserto, presso la sorgente ch’è sulla via di Shur», le promise un figlio, Ismaele, e la rimandò indietro. Ella chiamò il Signore che le aveva parlato Atta-El-Roi, cioè il Dio che mi vede, e così «quel pozzo fu chiamato “il pozzo di Lachai-Roi”. Ecco, esso è fra Kades e Bered». Isacco vi abitò poi vicino. «Isacco era tornato dal pozzo di Lachai-Roi, ed abitava nel paese del mezzodì» la sera in cui vide i cammelli che portavano Rebecca, e dopo la morte di Abramo «Isacco dimorò presso il pozzo di Lachai-Roi»."
    - "Bered non è nominata altrove, e il pozzo non è mai stato trovato. Poiché Kades è di solito posta ad Ain el-Qudeirat, i ricercatori hanno guardato le sorgenti a ovest di essa: negli anni 1840 il viaggiatore John Rowlands sentì il nome di Ain Muweileh presso Quseima come Moilahhi e lo ritenne Lacai-Roi, e quella sorgente resta il primo candidato sulla carta. Altri hanno guardato verso Haluza (Elusa), la città nabatea tra Bersabea e Kades, o verso Jebel Umm el-Bared, il cui nome ricorda Bered, e lo Wadi Umm Rajil più a ovest. Nessuno di questi è più di una congettura dai due nomi, e il pozzo stesso può essere stato solo un abbeveratoio noto ai pastori."
    - "Oggi le sorgenti dell’oasi di Quseima si trovano nel Sinai egiziano accanto al confine israeliano, e Haluza è una rovina nel Negheb a sud-ovest di Bersabea, una delle città del deserto della Via dell’incenso iscritte dall’UNESCO nel 2005."
  pl:
    - "Beer-Lachaj-Roj, studnia, „którą zowią Żywiącego i Widzącego mię”, leżała w Negewie na drodze do Szur, pustyni ku Egiptowi. Gdy Hagar uciekła przed Saraj, „znalazł ją Anioł Pański u źródła wód na puszczy, nad źródłem, przy drodze Sur”, obiecał jej syna, Izmaela, i odesłał ją z powrotem. Nazwała Pana, który do niej mówił: „Tyś Bóg widzący mię”, i tak „nazwała studnią onę studnią żywiącego, widzącego mię; a tać jest między Kades, i między Barad”. Izaak później mieszkał w jej pobliżu. Jak czytamy, „wracał się z przechadzki od studni, którą zowią Żywiącego i Widzącego mię; bo mieszkał w ziemi południowej” wieczorem, gdy ujrzał wielbłądy przywożące Rebekę, a po śmierci Abrahama „Izaak mieszkał u studni Żywiącego i Widzącego mię”."
    - "Bered nie jest wymienione nigdzie indziej, a studni nigdy nie odnaleziono. Ponieważ Kadesz umieszcza się zwykle w Ain el-Qudeirat, szukano źródeł na zachód od niego: w latach 40. XIX wieku podróżnik John Rowlands usłyszał nazwę Ain Muweileh koło Quseima jako Moilahhi i uznał ją za Lachaj-Roj, a to źródło pozostaje pierwszym kandydatem na mapie. Inni patrzyli ku Haluza (Elusa), nabatejskiemu miastu między Beer-Szebą a Kadesz, albo ku Dżabal Umm el-Bared, której nazwa przypomina Bered, i Wadi Umm Rajil dalej na zachód. Żadne z tych miejsc nie jest czymś więcej niż domysłem z dwóch nazw, a sama studnia mogła być tylko poidłem znanym pasterzom."
    - "Dziś źródła oazy Quseima leżą w egipskim Synaju przy granicy izraelskiej, a Haluza jest ruiną w Negewie na południowy zachód od Beer-Szeby, jednym z pustynnych miast Szlaku Kadzidlanego wpisanych przez UNESCO w 2005 roku."
  nl:
    - "Beër-Lachai-Roï, “de put van de Levende die mij ziet”, was een put in de Negev op de weg naar Sur, de woestijn richting Egypte. Toen Hagar voor Saraï vluchtte: “En de Engel des HEEREN vond haar aan een waterfontein in de woestijn, aan de fontein op den weg van Sur”. Hij beloofde haar een zoon, Ismaël, en zond haar terug. Zij noemde de HEER die tot haar sprak “Gij, God des aanziens!”, en zo “noemde men dien put, den put Lachai-Roi; ziet, hij is tussen Kades en tussen Bered”. Isaak woonde later in de buurt. Hij “kwam, van daar men komt tot den put Lachai-Roi; en hij woonde in het zuiderland” op de avond dat hij de kamelen zag die Rebekka brachten, en na Abrahams dood “en Izak woonde bij den put Lachai-Roi”."
    - "Bered wordt nergens anders genoemd, en de put is nooit gevonden. Omdat Kades gewoonlijk op Ain el-Qudeirat wordt gezet, hebben zoekers gekeken naar de bronnen ten westen ervan: in de jaren 1840 hoorde de reiziger John Rowlands de naam van Ain Muweileh bij Quseima als Moilahhi en hield die voor Lachai-Roï, en die bron blijft de eerste kandidaat op de kaart. Anderen hebben gekeken naar Chaloeza (Elusa), de Nabateese stad tussen Berseba en Kades, of naar Jebel Umm el-Bared, wiens naam aan Bered herinnert, en de Wadi Umm Rajil verder westelijk. Geen van deze is meer dan een gissing op grond van de twee namen, en de put zelf kan niet meer zijn geweest dan een drinkplaats die herders kenden."
    - "Tegenwoordig liggen de bronnen van de oase Quseima in Egyptisch Sinaï naast de Israëlische grens, en Chaloeza is een ruïne in de Negev ten zuidwesten van Berseba, een van de woestijnsteden van de Wierookroute die in 2005 door UNESCO werd ingeschreven."
  cs:
    - "Beer-lachaj-roí, „studna Živého, který mě vidí“, byla studna v Negevu na cestě k Šuru, poušti směrem k Egyptu. Když Hagar utekla před Sáraj, anděl Hospodinův ji našel „u studnice vody na poušti, u studnice té, kteráž jest při cestě Sur“, slíbil jí syna, Jišmaele, a poslal ji zpět. Hospodina, který k ní mluvil, nazvala „Ty jsi silný Bůh vidění“ a tak „nazvala studnici tu studnicí Živého vidoucího mne. Aj, ta jest mezi Kádes a Barad“. Izák později bydlel poblíž. „Izák pak šel, navracuje se od studnice Živého vidoucího mne; nebo bydlil v zemi polední“, večer, kdy spatřil velbloudy vezoucí Rebeku, a po Abrahamově smrti „bydlil Izák u studnice Živého vidoucího mne“."
    - "Bered se nikde jinde nejmenuje a studna nebyla nikdy nalezena. Protože se Kádeš obvykle klade do Ain el-Qudeirat, hledači pohlíželi k pramenům západně od něj: ve 40. letech 19. století cestovatel John Rowlands zaslechl jméno Ain Muweileh poblíž Quseimy jako Moilahhi a pokládal je za Lachaj-roí a ten pramen zůstává prvním kandidátem na mapě. Jiní hledali směrem k Chaluze (Elusa), nabatejskému městu mezi Beer-šebou a Kádešem, nebo k Jebel Umm el-Bared, jehož jméno připomíná Bered, a k Wadi Umm Rajil dále na západ. Žádné z nich není víc než dohad ze dvou jmen a sama studna mohla být pouhým napajedlem známým pastýřům."
    - "Dnes leží prameny oázy Quseima v egyptském Sinaji u izraelské hranice a Chaluza je zřícenina v Negevu jihozápadně od Beer-šeby, jedno z pouštních měst Kadidlové stezky zapsaných UNESCO roku 2005."
  sv:
    - "Beer-Lachaj-Roi, ”brunnen åt den Levande som ser mig”, var en brunn i Negev på vägen till Shur, öknen mot Egypten. När Hagar flydde från Sarai: ”HERRENS ängel kom emot henne vid en vattenkälla i öknen, den källa som ligger vid vägen till Sur”, lovade henne en son, Ismael, och sände henne tillbaka. Hon kallade HERREN som talat till henne ”Du är Seendets Gud”, och ”Därav kallades brunnen Beer-Lahai-Roi; den ligger mellan Kades och Bered”. Isak bodde senare nära den. Han ”var på väg hem från Beer-Lahai-Roi, ty han bodde i Sydlandet” den afton då han såg kamelerna som förde Rebecka, och efter Abrahams död ”Isak bodde vid Beer-Lahai-Roi”."
    - "Bered nämns ingen annanstans, och brunnen har aldrig hittats. Eftersom Kadesh vanligen förläggs till Ajin el-Qudeirat har sökare tittat på källorna väster därom: på 1840-talet hörde resenären John Rowlands namnet Ajin Muweileh nära Quseima som Moilahhi och tog det för Lachaj-Roi, och den källan är fortfarande den första kandidaten på kartan. Andra har tittat mot Haluza (Elusa), den nabateiska staden mellan Beer Sheva och Kadesh, eller mot Jebel Umm el-Bared, vars namn påminner om Bered, och Wadi Umm Rajil längre västerut. Ingen av dessa är mer än en gissning utifrån de två namnen, och brunnen själv kan ha varit inte mer än en vattningsplats känd för herdar."
    - "I dag ligger källorna i oasen Quseima i egyptiska Sinai vid den israeliska gränsen, och Haluza är en ruin i Negev sydväst om Beer Sheva, en av ökenstäderna på Rökelseleden som Unesco upptog på världsarvslistan 2005."
  nb:
    - "Beer-Lahai-Roi, «brønnen til den levende som ser meg», var en brønn i Negev på veien til Sjur, ørkenen mot Egypt. Da Hagar flyktet fra Sarai, fant Herrens engel henne «ved vannkilden i ørkenen, ved kilden på veien til Sur», lovet henne en sønn, Ismael, og sendte henne tilbake. Hun ga Herren, som hadde talt med henne, navnet «Du er Gud, den som ser», og «Derfor kaller de brønnen Lakai Ro'is brønn; den ligger mellem Kades og Bered». Isak bodde senere i nærheten. Han var «nettop kommet tilbake fra en vandring til brønnen Lakai Ro'i; for han bodde i sydlandet» den kvelden han så kamelene som førte Rebekka, og etter Abrahams død heter det: «Og Isak bodde ved brønnen Lakai Ro'i.»"
    - "Bered er ikke nevnt noe annet sted, og brønnen er aldri funnet. Siden Kadesj vanligvis settes til Ajin el-Qudeirat, har søkerne sett på kildene vest for det: på 1840-tallet hørte reisende John Rowlands navnet Ajin Muweileh nær Quseima som Moilahhi og tok det for Lahai-Roi, og den kilden er fortsatt den første kandidaten på kartet. Andre har sett mot Haluza (Elusa), den nabateiske byen mellom Beer-Sjeba og Kadesj, eller mot Jebel Umm el-Bared, hvis navn minner om Bered, og Wadi Umm Rajil lenger vest. Ingen av disse er mer enn en gjetning ut fra de to navnene, og brønnen selv kan ha vært ikke mer enn et vanningssted kjent av gjetere."
    - "I dag ligger kildene i Quseima-oasen i egyptisk Sinai ved den israelske grensen, og Haluza er en ruin i Negev sørvest for Beer-Sjeba, en av ørkenbyene på Røkelsesruten oppført av UNESCO i 2005."
  tl:
    - "Ang Beer-lahai-roi, “balon ng Nabubuhay na nakakakita sa akin”, ay balon sa Negeb sa daan patungong Shur, ang disyerto patungong Egipto. Nang tumakas si Agar kay Sarai, “nasumpungan siya ng anghel ng Panginoon sa tabi ng isang bukal ng tubig sa ilang, sa bukal na nasa daang patungo sa Shur”, ipinangako sa kaniya ang isang anak, si Ismael, at pinabalik siya. Tinawag niya ang Panginoong nagsalita sa kaniya, “Ikaw ay Dios na nakakakita”, at kaya “nginalanan ang balong yaon Balon ng Nabubuhay na nakakakita sa akin; narito't ito'y nasa pagitan ng Cades at Bered”. Kalaunan ay tumira si Isaac malapit dito. Siya ay “nanggaling sa daang Beer-lahai-roi; sapagka't siya'y natira sa lupaing Timugan” nang gabing makita niya ang mga kamelyong nagdadala kay Rebeca, at pagkamatay ni Abraham, “si Isaac ay nanahan sa tabi ng Beer-lahai-roi”."
    - "Wala nang ibang pinangalanang Bered, at hindi pa natatagpuan ang balon. Yamang karaniwang inilalagay ang Cades sa Ain el-Qudeirat, hinanap ang mga bukal sa kanluran nito: noong dekada 1840, narinig ng manlalakbay na si John Rowlands ang pangalan ng Ain Muweileh malapit sa Quseima bilang Moilahhi at itinuring itong Lahai-roi, at nananatili ang bukal na iyon na unang kandidato sa mapa. Tumingin ang iba sa Haluza (Elusa), ang bayang Nabateo sa pagitan ng Beer-seba at Cades, o sa Jebel Umm el-Bared, na ang pangalan ay nagpapaalala sa Bered, at sa Wadi Umm Rajil sa kanluran pa. Wala sa mga ito ang higit sa hula mula sa dalawang pangalan, at maaaring pawang inuman ng mga pastol ang mismong balon."
    - "Ang mga bukal ng oasis ng Quseima ay nasa Sinai ng Egipto sa tabi ng hangganan ng Israel ngayon, at ang Haluza ay guho sa Negev sa timog-kanluran ng Beer-seba, isa sa mga bayan ng disyerto ng Ruta ng Kamanyang na inilista ng UNESCO noong 2005."
