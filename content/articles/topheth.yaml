body:
  en:
    - "Topheth was a place of sacrifice in the valley of the son of Hinnom, the ravine that curves round the south-west of Jerusalem below the walls, where children were made to “pass through the fire to Molech”. The name is usually explained from a word for a fireplace or hearth, with the vowels of the Hebrew for “shame” given it by the scribes, but this is not certain. Isaiah already uses it as a byword for a burning place prepared for the king of Assyria: “Tophet is ordained of old … the pile thereof is fire and much wood”. Its exact spot in the valley, today the Wadi er-Rababi, has never been found."
    - "Ahaz burnt incense in the valley of Hinnom “and burnt his children in the fire”, and Manasseh did the same. Jeremiah accused Judah: “they have built the high places of Tophet, which is in the valley of the son of Hinnom, to burn their sons and their daughters in the fire; which I commanded them not, neither came it into my heart”. Josiah, in his reform, “defiled Topheth”, that no one might offer a child there again. Jeremiah was sent to the valley with a potter's jar to break it before the elders and to say that “this place shall no more be called Tophet, nor The valley of the son of Hinnom, but The valley of slaughter”, that the dead would be buried in Topheth “till there be no place”, and that God would “make this city as Tophet”; then he came “from Tophet” and repeated it in the temple court. The law had forbidden the rite from the first."
    - "The valley gave its name, Ge-Hinnom, to Gehenna, the place of fire in later Jewish teaching and in the Gospels. Modern scholars borrowed the word Topheth for the walled precincts at Carthage and other Phoenician colonies where urns of burnt infants were buried; whether those were sacrifices or a cemetery for children who died naturally is still debated. In 1979 Gabriel Barkay found, in a tomb on the shoulder of the valley at Ketef Hinnom, two small silver scrolls of the seventh or sixth century BC inscribed with the priestly blessing, the oldest known words of the Bible."
    - "Today the Hinnom valley is a park below the walls of the Old City, with the Sultan's Pool at its head, the Cinematheque and the Menachem Begin Heritage Center above its western slope, and the monastery of Akeldama at its junction with the Kidron; the Ketef Hinnom amulets are in the Israel Museum."
  ru:
    - "Тофет — место жертвоприношений в долине сыновей Еннома, ущелье, огибающем Иерусалим с юго-запада под стенами, где детей проводили «чрез огонь Молоху». Имя обычно выводят из слова «очаг», «место сожжения», а огласовку ему, как считают, дали переписчики от еврейского слова «позор», но это не бесспорно. Исаия уже употребляет его как нарицательное имя костра, уготованного царю Ассирии: «Тофет давно уже устроен… в костре его много огня и дров». Точное место его в долине, нынешнем Вади-эр-Рабаби, так и не найдено."
    - "Ахаз совершал курения в долине Еннома и «проводил сыновей своих через огонь», то же делал и Манассия. Иеремия обличал Иудею: «устроили высоты Тофета в долине сыновей Енномовых, чтобы сожигать сыновей своих и дочерей своих в огне, чего Я не повелевал и что Мне на сердце не приходило». Об Иосии и его реформе сказано: «И осквернил он Тофет», чтобы никто больше не приносил там детей. Иеремия был послан в долину с кувшином горшечника, чтобы разбить его перед старейшинами и сказать, что «место сие не будет более называться Тофетом или долиною сыновей Енномовых, но долиною убиения», что мёртвых будут хоронить в Тофете «по недостатку места для погребения» и что Бог сделает город «подобным Тофету»; затем он пришёл «с Тофета» и повторил это на дворе храма. Закон запрещал этот обряд с самого начала."
    - "Долина дала своё имя, Ге-Хинном, геенне — месту огня в позднейшем иудейском учении и в Евангелиях. Современные учёные позаимствовали слово «тофет» для обнесённых стеной участков в Карфагене и других финикийских колониях, где хоронили урны с сожжёнными младенцами; были ли это жертвы или кладбище детей, умерших своей смертью, до сих пор спорят. В 1979 году Габриэль Баркай нашёл в гробнице на плече долины, в Кетеф-Хинном, два маленьких серебряных свитка VII–VI веков до н. э. со священническим благословением — древнейшие известные слова Библии."
    - "Сегодня долина Еннома — парк под стенами Старого города, с Султанским прудом в её верховье, Синематекой и Центром наследия Менахема Бегина над западным склоном и монастырём Акелдама у слияния с Кедроном; амулеты из Кетеф-Хинном хранятся в Музее Израиля."
  uk:
    - "Тофет був місцем жертвоприношень у долині сина Гінном, яру, що огинає Єрусалим з південного заходу під мурами, де дітей проводили «через огонь Молохові». Назву зазвичай пояснюють від слова, що означає вогнище чи жаровню, з голосними староєврейського слова «ганьба», які надали їй книжники, але це не певно. Ісая вже вживає її як символ палаючого місця, приготованого для царя Ассирії: «Наготовлено бо вже давно Тофет … в кострі його багато огню й дров». Його точне місце в долині, нині Вади-ер-Рабабі, так і не знайдено."
    - "Ахаз кадив у долині Гінном і «переводив синів своїх через огонь», і Манасія робив те саме. Єремія звинувачував Юду: «І построїли висоти Тофет в долинї потомків Енномових, щоб там палити синів своїх і дочки свої, чого я не заповідував, і що на думку менї не приходило». Йосія у своїй реформі «Посквернив і Тофет», щоб ніхто більше не приносив там дитину. Єремію послали до долини з гончарним глеком, щоб розбити його перед старійшинами й сказати, що «се місце не звати муть Тофетом і долиною синів Енномових, а долиною душогубною», що мертвих ховатимуть у Тофеті, «бо не буде місця», і що Господь скаже: «вчиню місто се таким, як Тофет»; потім він повернувся «з Тофету» й повторив це на подвір’ї храму. Закон заборонив цей обряд від самого початку."
    - "Долина дала свою назву, Ге-Хіном, геєні, місцю вогню в пізнішому юдейському вченні та в Євангеліях. Сучасні вчені запозичили слово Тофет для обнесених мурами ділянок у Карфагені й інших фінікійських колоніях, де ховали урни зі спаленими немовлятами; чи це були жертви, чи цвинтар для дітей, що померли своєю смертю, досі дискутується. У 1979 році Габріель Баркай знайшов у гробниці на плечі долини в Кетеф-Хіномі два маленькі срібні сувої VII чи VI ст. до н. е., списані священицьким благословенням, — найдавніші відомі слова Біблії."
    - "Нині долина Гінном — парк під мурами Старого міста, з Басейном Султана в її верхів’ї, Сінематекою та Центром спадщини Менахема Бегіна над її західним схилом і монастирем Акелдама на її злитті з Кедроном; амулети з Кетеф-Хінома зберігаються в Музеї Ізраїлю."
  es:
    - "Tofet era un lugar de sacrificio en el valle del hijo de Hinnom, la hondonada que rodea el suroeste de Jerusalén bajo las murallas, donde se hacía a los niños «pasar por el fuego á Moloch». El nombre suele explicarse a partir de una palabra que significa hogar o brasero, con las vocales de la palabra hebrea para «vergüenza» que le dieron los escribas, pero no es seguro. Isaías lo usa ya como símbolo de un lugar de combustión preparado para el rey de Asiria: «Topheth ya de tiempo está diputada y aparejada para el rey … cuyo foco es de fuego, y mucha leña». Su lugar exacto en el valle, hoy el Wadi er-Rababi, nunca se ha hallado."
    - "Acaz quemó incienso en el valle de Hinnom y «quemó sus hijos por fuego», y Manasés hizo lo mismo. Jeremías acusó a Judá: «Y han edificado los altos de Topheth, que es en el valle del hijo de Hinnom, para quemar al fuego sus hijos y sus hijas, cosa que yo no les mandé, ni subió en mi corazón». Josías, en su reforma, «profanó á Topheth», para que nadie volviera a ofrecer allí a un niño. Jeremías fue enviado al valle con una vasija de barro para romperla ante los ancianos y decir que «este lugar no se llamará más Topheth, ni Valle del hijo de Hinnom, sino Valle de la Matanza», que los muertos serían enterrados en Topheth «por no haber lugar», y que Dios pondría «esta ciudad como Topheth»; luego volvió «de Topheth» y lo repitió en el atrio del templo. La ley había prohibido el rito desde el principio."
    - "El valle dio su nombre, Ge-Hinnom, a la Gehena, el lugar de fuego en la enseñanza judía posterior y en los Evangelios. Los estudiosos modernos tomaron prestada la palabra Tofet para los recintos amurallados de Cartago y otras colonias fenicias donde se enterraban urnas con restos de niños quemados; si eran sacrificios o un cementerio de niños muertos de forma natural sigue debatiéndose. En 1979 Gabriel Barkay halló, en una tumba del hombro del valle en Ketef Hinnom, dos pequeños rollos de plata del siglo VII o VI a. C. con la bendición sacerdotal, las palabras más antiguas conocidas de la Biblia."
    - "Hoy el valle de Hinnom es un parque bajo las murallas de la Ciudad Vieja, con el Estanque del Sultán en su cabecera, la Cinemateca y el Centro del Patrimonio Menachem Begin sobre su ladera occidental, y el monasterio de Aceldama en su confluencia con el Cedrón; los amuletos de Ketef Hinnom están en el Museo de Israel."
  pt:
    - "Tofete era um lugar de sacrifício no vale do filho de Hinom, a ravina que contorna o sudoeste de Jerusalém, abaixo das muralhas, onde crianças eram feitas “passar pelo fogo a Moloque”. O nome costuma ser explicado a partir de uma palavra para lareira ou braseiro, com as vogais da palavra hebraica para “vergonha” postas pelos escribas, mas isso não é certo. Isaías já o usa como símbolo de um lugar de queima preparado para o rei da Assíria: “o seu lugar de queima já está pronto há muito tempo … Ele fez a sua pira profunda e larga, com fogo e muita lenha”. Seu ponto exato no vale, hoje o Wadi er-Rababi, nunca foi encontrado."
    - "Acaz queimou incenso no vale de Hinom e “queimou seus filhos no fogo”, e Manassés fez o mesmo. Jeremias acusou Judá: “Eles construíram os altos de Tofete, que está no vale do filho de Hinom, para queimarem os seus filhos e as suas filhas no fogo, o que eu não ordenei, nem me passou pela mente”. Josias, em sua reforma, “profanou Tofete”, para que ninguém mais oferecesse ali uma criança. Jeremias foi enviado ao vale com um vaso de oleiro para quebrá-lo diante dos anciãos e dizer que “este lugar não será mais chamado ‘Tofete’, nem ‘O Vale do filho de Hinom’, mas ‘O Vale da Matança’”, que os mortos seriam enterrados em Tofete “até que não haja mais lugar para enterrar”, e que Deus faria “esta cidade como Tofete”; depois voltou “de Tofete” e repetiu tudo no pátio do templo. A lei proibira o rito desde o início."
    - "O vale deu seu nome, Ge-Hinom, à Geena, o lugar de fogo no ensino judaico posterior e nos Evangelhos. Estudiosos modernos tomaram emprestada a palavra Tofete para os recintos murados de Cartago e de outras colônias fenícias onde se sepultavam urnas com crianças queimadas; se eram sacrifícios ou um cemitério de crianças mortas naturalmente ainda é debatido. Em 1979, Gabriel Barkay encontrou, num túmulo no flanco do vale, em Ketef Hinom, dois pequenos rolos de prata do século VII ou VI a.C. com a bênção sacerdotal, as palavras mais antigas conhecidas da Bíblia."
    - "Hoje o vale de Hinom é um parque abaixo das muralhas da Cidade Velha, com o Tanque do Sultão em sua cabeceira, a Cinemateca e o Centro do Patrimônio Menachem Begin acima de sua encosta ocidental e o mosteiro de Aceldama em sua junção com o Cedrom; os amuletos de Ketef Hinom estão no Museu de Israel."
  de:
    - "Tofet war eine Opferstätte im Tal des Sohnes Hinnoms, der Schlucht, die sich im Südwesten Jerusalems unterhalb der Mauern herumzieht, wo Kinder „dem Moloch durchs Feuer“ geführt wurden. Der Name wird meist von einem Wort für Feuerstelle oder Herd erklärt, mit den Vokalen des hebräischen Wortes für „Schande“ von den Schreibern versehen, doch ist das nicht sicher. Schon Jesaja gebraucht ihn (im Hebräischen Tofet) als Sinnbild für einen Brandplatz, der für den König von Assyrien bereitet ist: „die Grube ist von gestern her zugerichtet; ja sie ist auch dem König bereitet … der Scheiterhaufen darin hat Feuer und Holz die Menge“. Ihre genaue Stelle im Tal, dem heutigen Wadi er-Rababi, wurde nie gefunden."
    - "Ahas räucherte im Tal Hinnom und „verbrannte seine Söhne mit Feuer“, und Manasse tat dasselbe. Jeremia warf Juda vor, sie „bauen die Altäre des Thopheth im Tal Ben-Hinnom, daß sie ihre Söhne und Töchter verbrennen, was ich nie geboten noch in den Sinn genommen habe“. Josia „verunreinigte auch das Topheth“, damit niemand dort je wieder ein Kind opfere. Jeremia wurde mit einem Tonkrug ins Tal geschickt, um ihn vor den Ältesten zu zerbrechen und zu sagen, „daß man diese Stätte nicht mehr Thopheth noch das Tal Ben-Hinnom, sondern Würgetal heißen wird“, dass man im Thopheth begraben werde, „weil sonst kein Raum sein wird, zu begraben“, und dass Gott diese Stadt machen werde „gleich wie das Thopheth“; dann kam er „vom Thopheth“ und wiederholte es im Tempelvorhof. Das Gesetz hatte den Ritus von Anfang an verboten."
    - "Das Tal gab seinen Namen, Ge-Hinnom, der Gehenna, dem Ort des Feuers in der späteren jüdischen Lehre und in den Evangelien. Moderne Forscher entlehnten das Wort Tofet für die ummauerten Bezirke in Karthago und anderen phönizischen Kolonien, in denen Urnen mit verbrannten Säuglingen begraben wurden; ob es Opfer waren oder ein Friedhof für natürlich gestorbene Kinder, ist noch umstritten. 1979 fand Gabriel Barkay in einem Grab an der Schulter des Tals bei Ketef Hinnom zwei kleine Silberrollen des siebten oder sechsten Jahrhunderts v. Chr. mit dem Priestersegen, die ältesten bekannten Worte der Bibel."
    - "Heute ist das Hinnomtal ein Park unterhalb der Mauern der Altstadt, mit dem Sultansteich an seinem Kopf, der Cinematheque und dem Menachem Begin Heritage Center über seinem Westhang und dem Kloster von Hakeldama an seiner Einmündung ins Kidrontal; die Amulette von Ketef Hinnom sind im Israel-Museum."
  fr:
    - "Topheth était un lieu de sacrifice dans la vallée du fils de Hinnom, le ravin qui contourne le sud-ouest de Jérusalem sous les murailles, où l’on faisait « passer son fils ou sa fille par le feu en l’honneur de Moloc ». Le nom s’explique d’ordinaire par un mot désignant un foyer, auquel les scribes auraient donné les voyelles de l’hébreu pour « honte », mais ce n’est pas certain. Ésaïe l’emploie déjà comme emblème d’un lieu brûlant préparé pour le roi d’Assyrie : « Depuis longtemps un bûcher est préparé … Son bûcher, c’est du feu et du bois en abondance » (le mot hébreu est ici Topheth). Son emplacement exact dans la vallée, aujourd’hui l’oued er-Rababi, n’a jamais été retrouvé."
    - "Achaz « brûla des parfums dans la vallée des fils de Hinnom, et il fit passer ses fils par le feu », et Manassé fit de même. Jérémie accusa Juda : « Ils ont bâti des hauts lieux à Topheth dans la vallée de Ben-Hinnom, pour brûler au feu leurs fils et leurs filles : ce que je n’avais point ordonné, ce qui ne m’était point venu à la pensée. » Josias, dans sa réforme, « souilla Topheth », pour que nul n’y fasse plus passer un enfant par le feu. Jérémie fut envoyé dans la vallée avec une cruche de potier pour la briser devant les anciens et dire que « ce lieu ne sera plus appelé Topheth et vallée de Ben-Hinnom, mais … vallée du carnage », que l’on enterrerait les morts à Topheth « par défaut de place », et que Dieu rendrait « cette ville semblable à Topheth » ; puis il revint « de Topheth » et le redit dans le parvis du Temple. La Loi avait interdit ce rite dès l’origine."
    - "La vallée donna son nom, Ge-Hinnom, à la Géhenne, lieu de feu dans l’enseignement juif tardif et dans les Évangiles. Les savants modernes ont emprunté le mot Topheth pour désigner les enceintes murées de Carthage et d’autres colonies phéniciennes où l’on enterrait des urnes d’enfants brûlés ; s’agissait-il de sacrifices ou d’un cimetière d’enfants morts naturellement, on en débat encore. En 1979, Gabriel Barkay trouva, dans une tombe sur l’épaule de la vallée à Ketef Hinnom, deux petits rouleaux d’argent du VIIe ou VIe siècle av. J.-C. inscrits de la bénédiction sacerdotale, les plus anciens mots connus de la Bible."
    - "Aujourd’hui, la vallée de Hinnom est un parc sous les murailles de la Vieille Ville, avec le Bassin du Sultan à sa tête, la Cinémathèque et le Centre du patrimoine Menachem Begin au-dessus de son versant ouest, et le monastère de Hakeldama à sa jonction avec le Cédron ; les amulettes de Ketef Hinnom sont au Musée d’Israël."
  pl:
    - "Tofet było miejscem ofiar w dolinie syna Hinnoma, wąwozie okrążającym od południowego zachodu Jerozolimę pod murami, gdzie dzieci przeprowadzano „przez ogień ku czci Molochowi”. Nazwę wyjaśnia się zwykle od słowa oznaczającego palenisko lub ognisko, z samogłoskami hebrajskiego słowa „hańba”, nadanymi jej przez skrybów, ale nie jest to pewne. Izajasz używa jej już jako przysłowia na miejsce spalania przygotowane od dawna dla króla Asyrii, gdzie stos to ogień i wiele drewna. Jego dokładne położenie w dolinie, dziś Wadi er-Rababi, nigdy nie zostało odnalezione."
    - "Achaz kadził w dolinie Hinnom i „palił synów swych ogniem”, a Manasses czynił to samo. Jeremiasz oskarżał Judę: „Nadto pobudowali wyżyny Tofet, które jest w dolinie syna Hennomowego, aby palili synów swych i córki swe ogniem, czegom nie rozkazał, ani wstąpiło na serce moje”. Jozjasz w swej reformie „Splugawił też i Tofet”, aby nikt więcej nie składał tam dziecka w ofierze. Jeremiasz został posłany do doliny z glinianym dzbanem, by stłuc go przed starszymi i powiedzieć, że „nie będzie nazywane więcej to miejsce Tofet, ani doliną syna Hennomowego, ale doliną mordu”, że umarłych będą grzebać w Tofet, „bo indziej miejsca nie będzie”, i że Bóg postąpi z tym miastem, „tak jako z Tofet”; potem „wróciwszy się Jeremijasz z Tofet” powtórzył to na dziedzińcu świątyni. Prawo zakazywało tego obrzędu od początku."
    - "Dolina dała swoją nazwę, Ge-Hinnom, Gehennie, miejscu ognia w późniejszym nauczaniu żydowskim i w Ewangeliach. Współcześni badacze przejęli słowo Tofet dla otoczonych murem obszarów w Kartaginie i innych koloniach fenickich, gdzie grzebano urny ze spalonymi niemowlętami; czy były to ofiary, czy cmentarz dzieci zmarłych naturalnie, jest nadal przedmiotem sporu. W 1979 roku Gabriel Barkaj znalazł w grobowcu na ramieniu doliny w Ketef Hinnom dwa małe srebrne zwoje z VII lub VI wieku p.n.e. z wyrytym błogosławieństwem kapłańskim, najstarsze znane słowa Biblii."
    - "Dziś dolina Hinnom jest parkiem pod murami Starego Miasta, z Sadzawką Sułtana u jego początku, Kinoteką i Centrum Dziedzictwa Menachema Begina nad jego zachodnim stokiem oraz klasztorem Hakeldama u zbiegu z Cedronem; amulety z Ketef Hinnom znajdują się w Muzeum Izraela."
  it:
    - "Tofet era un luogo di sacrifici nella valle del figlio di Innom, il burrone che gira attorno al sud-ovest di Gerusalemme sotto le mura, dove i bambini erano fatti «passare per il fuoco … in onore di Molec». Il nome si spiega di solito da una parola per focolare o braciere, con le vocali dell’ebraico per «vergogna» datele dagli scribi, ma ciò non è certo. Isaia lo usa già come emblema di un luogo di rogo preparato per il re d’Assiria: «da lungo tempo Tofet è preparato … sul suo rogo v’è del fuoco e legna in abbondanza». Il suo punto esatto nella valle, oggi l’uadi er-Rababi, non è mai stato trovato."
    - "Acaz «bruciò dei profumi nella valle del figliuolo di Hinnom, ed arse i suoi figliuoli nel fuoco», e lo stesso fece Manasse. Geremia accusò Giuda: «Hanno edificato gli alti luoghi di Tofet, nella valle del figliuolo di Hinnom, per bruciarvi nel fuoco i loro figliuoli e le loro figliuole: cosa che io non avevo comandata, e che non m’era mai venuta in mente». Giosia, nella sua riforma, «contaminò Tofeth», perché nessuno vi offrisse più un bambino. Geremia fu mandato alla valle con una brocca di terra per spezzarla davanti agli anziani e dire che «questo luogo non sarà più chiamato “Tofet”, né “la valle del figliuolo d’Hinnom”, ma “la valle del Massacro”», che si sarebbe seppellito a Tofet «per mancanza di luogo per seppellire», e che Dio avrebbe reso questa città «simile a Tofet»; poi tornò «da Tofet» e lo ripeté nel cortile del tempio. La legge aveva vietato il rito fin dall’inizio."
    - "La valle diede il suo nome, Ge-Hinnom, alla Geenna, il luogo del fuoco nell’insegnamento ebraico posteriore e nei Vangeli. Gli studiosi moderni hanno preso la parola Tofet per i recinti murati di Cartagine e di altre colonie fenicie dove erano sepolte urne di infanti bruciati; se fossero sacrifici o un cimitero per bambini morti di morte naturale è ancora discusso. Nel 1979 Gabriel Barkay trovò, in una tomba sul fianco della valle a Ketef Hinnom, due piccoli rotoli d’argento del VII o VI secolo a.C. con la benedizione sacerdotale, le più antiche parole note della Bibbia."
    - "Oggi la valle di Innom è un parco sotto le mura della Città Vecchia, con la Piscina del Sultano al suo inizio, la Cinemateca e il Menachem Begin Heritage Center sopra il suo versante occidentale, e il monastero di Acheldamà alla sua confluenza con il Cedron; gli amuleti di Ketef Hinnom sono al Museo d’Israele."
  nl:
    - "Tofet was een offerplaats in het dal van de zoon van Hinnom, de kloof die om het zuidwesten van Jeruzalem buigt onder de muren, waar kinderen “voor den Molech door het vuur” moesten gaan. De naam wordt gewoonlijk verklaard uit een woord voor een vuurplaats of haard, met de klinkers van het Hebreeuwse woord voor “schande” die de schriftgeleerden eraan gaven, maar dit is niet zeker. Jesaja gebruikt het al als spreekwoord voor een brandplaats die voor de koning van Assyrië is bereid: “Tofeth is van gisteren bereid … het vuur en hout van zijn brandstapel is veel”. De precieze plek in het dal, tegenwoordig de Wadi er-Rababi, is nooit gevonden."
    - "Achaz rookte in het dal van Hinnom “en hij brandde zijn zonen in het vuur”, en Manasse deed hetzelfde. Jeremia beschuldigde Juda: “zij hebben gebouwd de hoogten van Tofeth, dat in het dal des zoons van Hinnom is, om hun zonen en hun dochteren met vuur te verbranden; hetwelk Ik niet heb geboden, noch in Mijn hart is opgekomen”. Josia “verontreinigde ook Thofeth” bij zijn hervorming, opdat niemand daar nog een kind zou offeren. Jeremia werd met een pottenbakkerskruik naar het dal gestuurd om die voor de oudsten te breken en te zeggen dat “het niet meer zal geheten worden Tofeth, noch dal des zoons van Hinnom, maar moorddal”, dat de doden in Tofeth zouden worden begraven “omdat er geen plaats zal zijn”, en dat God “deze stad te stellen als een Tofeth”; daarna kwam hij “van Tofeth” en herhaalde het in het voorhof van de tempel. De wet had de rite van meet af aan verboden."
    - "Het dal gaf zijn naam, Ge-Hinnom, aan Gehenna, de plaats van vuur in de latere Joodse leer en in de evangeliën. Moderne geleerden leenden het woord Tofet voor de ommuurde terreinen in Carthago en andere Fenicische kolonies waar urnen met verbrande zuigelingen werden begraven; of dat offers waren of een begraafplaats voor natuurlijk gestorven kinderen, wordt nog steeds betwist. In 1979 vond Gabriel Barkay in een graf op de schouder van het dal bij Ketef Hinnom twee kleine zilveren rolletjes uit de zevende of zesde eeuw v.Chr. met de priesterlijke zegen, de oudste bekende woorden van de Bijbel."
    - "Tegenwoordig is het Hinnomdal een park onder de muren van de Oude Stad, met de Sultansvijver aan het bovenste uiteinde, de Cinematheque en het Menachem Begin Heritage Center boven de westelijke helling, en het klooster van Akeldama bij de samenloop met het Kidron; de amuletten van Ketef Hinnom bevinden zich in het Israëlmuseum."
  cs:
    - "Tofet bylo místo obětí v údolí syna Hinnomova, v rokli, která se ohýbá kolem jihozápadu Jeruzaléma pod hradbami, kde děti vodili „skrze oheň Molochovi“. Jméno se obvykle vysvětluje ze slova pro ohniště nebo ohnisko, se samohláskami hebrejského slova pro „hanbu“, které mu přidali písaři, což však není jisté. Izajáš ho už užívá jako přísloví pro spalovací místo připravené pro krále Asýrie: „Nebo připraveno jest již dávno peklo, také i samému králi připraveno jest … ohně a dříví mnoho“. Jeho přesné místo v údolí, dnes Wádí er-Rabábí, nebylo nikdy nalezeno."
    - "Achaz kadil v údolí Hinnomově a „pálil syny své ohněm“ a totéž činil Manases. Jeremjáš obvinil Judu: „Nadto vzdělali výsosti Tofet, kteréž jest v údolí syna Hinnom, aby pálili syny své i dcery své ohněm, čehož jsem nepřikázal, aniž vstoupilo na srdce mé“. Jošijáš ve své reformě „poškvrnil … Tofet“, aby tam už nikdo neobětoval dítě. Jeremjáš byl poslán do údolí s hrnčířskou nádobou, aby ji před staršími rozbil a řekl, že „nebude slouti více toto místo Tofet, ani údolí Benhinnom, ale údolí mordu“, že mrtví budou pochováváni v Tofet, „nebo nebude dostávati místa“, a že Bůh řekl: „naložím s městem tímto tak jako s Tofet“; potom se vrátil „z Tofet“ a zopakoval to v chrámovém nádvoří. Zákon zakazoval tento obřad od počátku."
    - "Údolí dalo své jméno, Ge-Hinnom, Gehenně, místu ohně v pozdějším židovském učení a v evangeliích. Moderní učenci převzali slovo Tofet pro opevněné okrsky v Kartágu a jiných fénických koloniích, kde byly pohřbívány urny se spálenými nemluvňaty; zda šlo o oběti, nebo o hřbitov pro děti, které zemřely přirozeně, je dosud sporné. V roce 1979 našel Gabriel Barkay v hrobce na úbočí údolí v Ketef Hinnom dva malé stříbrné svitky ze 7. nebo 6. stol. př. n. l. s vyrytým kněžským požehnáním, nejstarší známá slova Bible."
    - "Dnes je údolí Hinnom parkem pod hradbami Starého Města, se Sultánovým rybníkem na horním konci, Kinotékou a Centrem dědictví Menachema Begina nad jeho západním svahem a klášterem Akeldama na soutoku s Kidronem; amulety z Ketef Hinnom jsou v Izraelském muzeu."
  sv:
    - "Tofet var en offerplats i Hinnoms dal, ravinen som kröker sig kring sydvästra Jerusalem nedanför murarna, där barn fick ”gå genom eld, till offer åt Molok”. Namnet förklaras vanligen ur ett ord för en eldstad eller härd, med vokalerna från det hebreiska ordet för ”skam” givna av skriftlärda, men detta är inte säkert. Jesaja använder det redan som ett ordstäv för en brinnande plats beredd åt Assyriens kung: ”Ty en Tofetplats är längesedan tillredd … dess rund är fylld av eld och av ved i myckenhet”. Dess exakta plats i dalen, i dag Wadi er-Rababi, har aldrig hittats."
    - "Achas tände offereld i Hinnoms dal och ”brände upp sina barn i eld”, och Manasse gjorde detsamma. Jeremia anklagade Juda: ”Tofethöjderna i Hinnoms sons dal hava de byggt upp, för att där uppbränna sina söner och döttrar i eld, fastän jag aldrig har bjudit eller ens tänkt mig något sådant”. Josia ”orenade ock Tofet” vid sin reform, så att ingen mer skulle offra ett barn där. Jeremia sändes till dalen med en krukmakarkruka för att krossa den inför de äldste och säga att man inte mer skulle kalla denna plats ’Tofet’ eller ’Hinnoms sons dal’, utan ’Dråpdalen’, att de döda skulle begravas i Tofet ”därför att ingen annan plats finnes”, och att Gud skulle ”göra denna stad lik Tofet”; sedan kom han ”från Tofet” och upprepade det i tempelgården. Lagen hade förbjudit riten från första början."
    - "Dalen gav sitt namn, Ge-Hinnom, åt Gehenna, eldens plats i senare judisk undervisning och i evangelierna. Moderna forskare lånade ordet Tofet för de muromgärdade områdena i Kartago och andra feniciska kolonier där urnor med brända spädbarn begravdes; om det var offer eller en gravplats för barn som dött naturligt är fortfarande omdebatterat. År 1979 fann Gabriel Barkay, i en grav på dalens skuldra vid Ketef Hinnom, två små silverrullar från 600- eller 500-talet f.Kr. med den prästerliga välsignelsen ingraverad, de äldsta kända orden ur Bibeln."
    - "I dag är Hinnoms dal en park nedanför Gamla stadens murar, med Sultansdammen vid dess övre ände, Cinematheque och Menachem Begin Heritage Center ovanför dess västra sluttning och klostret Akeldama vid dess förening med Kidron; amuletterna från Ketef Hinnom finns i Israelmuseet."
  nb:
    - "Tofet var et offersted i Hinnom-dalen, juvet som buer rundt sørvest for Jerusalem under murene, der barn ble latt «gå gjennem ilden for Molok». Navnet forklares vanligvis av et ord for ildsted eller ovn, gitt vokalene til det hebraiske ordet for «skam» av skriftlærde, men dette er ikke sikkert. Jesaja bruker det allerede som et sinnbilde på et brennested gjort i stand for kongen av Assyria: «For et brandsted er laget i stand for lenge siden … dets bål har ild og ved i mengde». Dets nøyaktige sted i dalen, i dag Wadi er-Rababi, er aldri funnet."
    - "Ahas «brente røkelse i Hinnoms sønns dal og lot sine sønner gå igjennem ilden», og Manasse gjorde det samme. Jeremia anklaget Juda: «de har bygget Tofet-haugene i Hinnoms sønns dal for å opbrenne sine sønner og sine døtre med ild, noget som jeg ikke har pålagt dem, og som ikke er opkommet i mitt hjerte». Josjia «gjorde også Tofet i Hinnoms barns dal urent» i sin reform, slik at ingen igjen skulle ofre et barn der. Jeremia ble sendt til dalen med en pottemakerkrukke for å knuse den foran de eldste og for å si at dager skulle komme «da en ikke mere skal kalle dette sted Tofet eller Hinnoms sønns dal, men Drapsdalen», at de døde skulle begraves i Tofet «fordi det ellers ikke er plass til å begrave», og at Gud ville «gjøre denne by lik Tofet»; da han «kom fra Tofet», gjentok han det i tempelets forgård. Loven hadde forbudt ritualet fra begynnelsen."
    - "Dalen ga navnet sitt, Ge-Hinnom, til Gehenna, stedet for ild i senere jødisk lære og i evangeliene. Moderne forskere lånte ordet Tofet om de ummurte områdene i Kartago og andre fønikiske kolonier der urner med brente spedbarn ble gravlagt; om det var ofringer eller en gravplass for barn som døde naturlig, er fortsatt omdiskutert. I 1979 fant Gabriel Barkay, i en grav på skulderen av dalen ved Ketef Hinnom, to små sølvruller fra 600- eller 500-tallet f.Kr. innskrevet med den prestelige velsignelsen, de eldste kjente ordene fra Bibelen."
    - "I dag er Hinnom-dalen en park under murene i Gamlebyen, med Sultanens dam ved begynnelsen, Cinematheque og Menachem Begin-senteret for arv over den vestlige skråningen, og Hakeldama-klosteret ved sammenløpet med Kedron; amulettene fra Ketef Hinnom er i Israel-museet."
  tl:
    - "Ang Topheth ay dakong pinaghahandugan sa libis ng anak ni Hinnom, ang bangin na kumukurba sa timog-kanluran ng Jerusalem sa ilalim ng mga pader, kung saan pinadaraan ang mga bata “sa apoy kay Moloch”. Karaniwang ipinaliliwanag ang pangalan mula sa salitang nangangahulugang pugon o apuyan, na may mga patinig ng Hebreong “kahihiyan” na ibinigay ng mga eskriba, ngunit hindi ito tiyak. Ginamit na ito ni Isaias bilang sagisag ng lugar ng pagsunog na inihanda para sa hari ng Asiria: “ang Topheth ay handa nang malaon … ang bunton niyaon ay apoy at maraming kahoy”. Hindi pa natatagpuan ang eksaktong pook nito sa libis, ang Wadi er-Rababi ngayon."
    - "Nagsunog si Achaz ng kamangyan sa libis ng Hinnom at “sinunog ang kaniyang mga anak sa apoy”; gayundin si Manases. Sabi ni Jeremias: “At kanilang itinayo ang mga mataas na dako ng Topheth, na nasa libis ng anak ni Hinnom, upang sunugin ang kanilang mga anak na lalake at babae sa apoy; na hindi ko iniuutos, o pumasok man sa aking pagiisip”. Sa reporma ni Josias, “nilapastangan ang Topheth”, upang wala nang maghandog ng bata roon. Isinugo si Jeremias sa libis na may banga ng magpapalyok upang basagin sa harap ng matatanda at sabihing “ang dakong ito ay hindi na tatawaging Topheth, ni Ang libis ng anak ni Hinnom, kundi Ang libis ng Patayan”, at ililibing ang patay sa Topheth “hanggang sa mawalan ng dakong mapaglilibingan”, at “gagawin ang bayang ito na gaya ng Topheth”; pagkatapos, “mula sa Topheth”, inulit iyon sa looban ng templo. Ipinagbawal na ito ng batas noon pa."
    - "Ibinigay ng libis ang pangalang Ge-Hinnom sa Gehenna, ang dako ng apoy sa mas huling turong Judio at sa mga Ebanghelyo. Hiniram ng mga makabagong iskolar ang salitang Topheth para sa mga lugar na may pader sa Cartago at iba pang kolonyang Fenicio kung saan inilibing ang mga urna ng sinunog na sanggol; pinagtatalunan pa kung mga handog iyon o sementeryo ng mga batang namatay nang likas. Noong 1979, natagpuan ni Gabriel Barkay, sa libingan sa balikat ng libis sa Ketef Hinnom, ang dalawang maliit na pilak na balumbon ng ika-7 o ika-6 na siglo BK na may inskripsiyong pagpapala ng saserdote, ang pinakamatandang kilalang salita ng Biblia."
    - "Ngayon, ang libis ng Hinnom ay liwasan sa ilalim ng mga pader ng Lumang Lunsod, na may Tangke ng Sultan sa ulo nito, ang Cinematheque at ang Sentro ng Pamana ni Menachem Begin sa itaas ng kanlurang dalisdis, at ang monasteryo ng Aceldama sa salubungan nito sa Cedron; ang mga agimat ng Ketef Hinnom ay nasa Museo ng Israel."
  da:
    - "Tofet var et ofringssted i Ben-Hinnoms Dal, kløften, der krummer sig rundt om Jerusalems sydvestside under murene, hvor børn blev fået til at »gaa igennem Ilden til Molek«. Navnet forklares sædvanligvis ud fra et ord for en ildsted eller et arnested, med vokalerne fra det hebraiske ord for »skam« givet det af de skriftlærde, men dette er ikke sikkert. Esajas bruger allerede ordet om et brandsted beredt til kongen af Assyrien: »Thi et Brandsted er alt beredt, det er og beredt til Kongen … dets Baal har Ild og Ved i Mangfoldighed«. Dets nøjagtige sted i dalen, i dag Wadi er-Rababi, er aldrig blevet fundet."
    - "Akaz brændte røgelse i Hinnoms dal og »brændte sine Sønner i Ilden«, og Manasse gjorde det samme. Jeremias anklagede Juda: »de have bygget Tofeths Høje, som ere i Ben-Hinnoms Dal, for at opbrænde deres Sønner og Døtre i Ilden, hvilket jeg ikke har budet, og hvad ej heller er kommet mig i Tanke«. Josias »vanhelligede Tofet« i sin reform, for at ingen mere skulle ofre et barn dér. Jeremias blev sendt til dalen med en pottemagerkrukke for at knuse den foran de ældste og sige, at man »ikke mere skal kalde dette Sted Tofeth, eller Ben-Hinnoms Dal, men Morderdal«, at de døde ville blive begravet i Tofeth »af Mangel paa Plads«, og at Gud ville »gøre denne Stad som Tofeth«; så kom han »fra Tofeth« og gentog det i templets forgård. Loven havde forbudt ritualet fra begyndelsen."
    - "Dalen gav sit navn, Ge-Hinnom, til Gehenna, ildstedet i senere jødisk lære og i evangelierne. Moderne forskere har lånt ordet Tofet til de indhegnede områder ved Karthago og andre fønikiske kolonier, hvor urner med brændte spædbørn blev begravet; om det var ofringer eller en gravplads for børn, der døde en naturlig død, er stadig omstridt. I 1979 fandt Gabriel Barkay i en grav på dalens skulder ved Ketef Hinnom to små sølvruller fra 600- eller 500-tallet f.Kr., indskrevet med den præstelige velsignelse, Bibelens ældste kendte ord."
    - "I dag er Hinnomdalen en park neden for den gamle bys mure, med Sultanens Dam ved dens øvre ende, Cinemateket og Menachem Begin Heritage Center oven for dens vestlige skråning og Hakeldama-klosteret, hvor den møder Kedron; Ketef Hinnom-amuletterne er i Israel Museum."
  sr:
    - "Тофет је било место жртвовања у долини сина Еномовог, провалији која се савија око југозапада Јерусалима испод зидина, где су децу терали да иду „кроз огањ Молоху“. Име се обично објашњава од речи за огњиште, са самогласницима хебрејске речи за „срамоту“ које су му дали писари, али то није сигурно. Исаија га већ употребљава као пример места горења припремљеног за цара асирског: „Јер је већ приправљен Тофет, и самом цару приправљен је ... места, огња и дрва има много“. Његово тачно место у долини, данас Вади ер Рабаби, никад није нађено."
    - "Ахаз „кађаше у долини сина Еномовог, и сажизаше синове своје огњем“, а то је чинио и Манасија. Јеремија је оптуживао Јуду: „саградише висине Тофету, који је у долини сина Еномовог, да сажижу синове своје и кћери своје огњем, што нисам заповедио нити ми је дошло на ум“. Јосија је у својој реформи „оскврни и Тофет“, да нико више ту не принесе дете. Јеремија је био послан у долину са лончарским крчагом да га разбије пред старешинама и да рече да се „ово место неће више звати Тофет, ни долина сина Еномовог, него крвна долина“, да ће мртви бити сахрањивани у Тофету, „јер неће бити места за погребавање“, и да ће Бог рећи: „учинићу тај град да буде као Тофет“; затим се вратио „из Тофета“ и поновио то у дворишту Храма. Закон је тај обред забранио од почетка."
    - "Долина је дала своје име, Ге-Енон, Геени, месту огња у каснијем јеврејском учењу и у Јеванђељима. Савремени научници позајмили су реч Тофет за зидане ограде у Картагини и другим феничанским колонијама где су сахрањиване урне са спаљеним новорођенчадима; да ли су то биле жртве или гробље за децу која су умрла природном смрћу, још је предмет спора. Габријел Баркај је 1979. нашао, у гробници на рамену долине у Кетеф Хиному, два мала сребрна свитка из 7. или 6. века п. н. е. исписана свештеничким благословом, најстарије познате речи Библије."
    - "Данас је долина Енон парк испод зидина Старог града, са Султановим базеном на горњем крају, Синематеком и Центром баштине Менахема Бегина изнад њене западне падине, и манастиром Акелдама на њеном споју с Кедроном; амајлије из Кетеф Хинома налазе се у Музеју Израела."
  hu:
    - "Tófet áldozati hely volt Hinnom fiának völgyében, abban a szurdokban, amely Jeruzsálem délnyugati oldalán kanyarodik a falak alatt, ahol gyermekeket vittek át „a tűzön Moloknak”. A nevet általában a tűzhelyet jelentő szóból magyarázzák, a héber „szégyen” szó magánhangzóival ellátva az írnokok által, de ez nem biztos. Ézsaiás már az asszír király számára készített égetőhely jelképeként használja: „készen van a szörnyű tűzhely régen … máglyájában tűz és fa bőven”. Pontos helyét a völgyben, a mai Vádi er-Rababiban, soha nem találták meg."
    - "Áház tömjénezett Hinnom völgyében, és „fiait is megégeté tűzben”, és Manassé is ugyanezt tette. Jeremiás vádolta Júdát: „felépítették a Tófet magaslatait, a mely a Ben-Hinnom völgyében van, hogy megégessék fiaikat és leányaikat tűzben, a mit nem parancsoltam, és a mi gondolatomban sem volt”. Jósiás reformja során „megfertőztette a Tófetet”, hogy senki ne áldozhasson ott többé gyermeket. Jeremiást a völgybe küldték egy fazekas korsóval, hogy a vének előtt összetörje, és mondja, hogy „e hely nem neveztetik többé Tófetnek, sem Ben-Hinnom völgyének, hanem öldöklés völgyének”, hogy a holtakat Tófetben temetik, „és hely sem lesz elég”, és hogy Isten „olyanná teszem e várost, a milyen Tófet”; majd „hazajöve … Tófetből”, és megismételte a templom pitvarában. A törvény az első pillanattól tiltotta a szertartást."
    - "A völgy adta nevét, Gé-Hinnomot, Gyehennának, a későbbi zsidó tanításban és az evangéliumokban a tűz helyének. A modern tudósok a Tófet szót kölcsönözték a karthágói és más föníciai gyarmatok falakkal körülvett területeire, ahol elégetett csecsemők urnáit temették el; hogy áldozatok voltak-e, vagy természetes halállal elhunyt gyermekek temetője, még vitatott. 1979-ben Gabriel Barkay a völgy oldalán fekvő Ketef Hinnomnál egy sírban két kis ezüsttekercset talált a Kr. e. 7. vagy 6. századból, amelyekbe a papi áldást vésték, a Biblia legrégebbi ismert szavait."
    - "Ma a Hinnom-völgy park az Óváros falai alatt, elején a Szultán-tóval, nyugati lejtője fölött a Cinemathequével és a Menachem Begin Örökség Központtal, a Kidronnal való találkozásánál pedig a Hakeldama kolostorral; a Ketef Hinnom-amulettek az Izraeli Múzeumban vannak."
  fi:
    - "Tofet oli uhripaikka Hinnomin pojan laaksossa, rotkossa, joka kaartuu Jerusalemin lounaispuolella muurien alla ja jossa lapset pantiin ”kulkemaan tulen läpi Molokin kunniaksi”. Nimi selitetään yleensä sanasta, joka tarkoittaa tulisijaa, ja kirjurit antoivat sille heprean ”häpeän” vokaalit, mutta tämä ei ole varmaa. Jo Jesaja käyttää sitä sananparsimaisena polttopaikkana, joka on valmistettu Assyrian kuninkaalle: ”aikoja sitten on polttopaikka valmistettu … tulta ja polttopuita paljon”. Sen tarkkaa paikkaa laaksossa, nykyisessä Wadi er-Rababissa, ei ole koskaan löydetty."
    - "Ahas poltti suitsukkeita Hinnomin laaksossa ja ”poltti poikansa tulessa”, ja Manasse teki samoin. Jeremia syytti Juudaa: ”Ja he ovat rakentaneet Toofet-uhrikukkulat Ben-Hinnomin laaksoon, polttaakseen tulessa poikiansa ja tyttäriänsä, mitä minä en ole käskenyt ja mikä ei ole minun mieleeni tullut”. Josia ”saastutti myöskin polttopaikan Ben-Hinnomin laaksossa”, ettei kukaan enää uhraisi siellä lasta. Jeremia lähetettiin laaksoon savenvalajan astian kanssa rikkomaan se vanhimpien edessä ja sanomaan, että ”tätä paikkaa ei enää sanota Toofetiksi eikä Ben-Hinnomin laaksoksi, vaan ’Murhalaaksoksi’”, että ”Toofetiin haudataan, kun ei ole muualla tilaa, minne haudata” ja että Jumala ”tekee tämän kaupungin Toofetin kaltaiseksi”; sitten hän ”tuli Toofetista” ja toisti sen temppelin esipihassa. Laki oli kieltänyt menon alusta asti."
    - "Laakso antoi nimensä, Ge-Hinnom, Gehennalle, myöhemmän juutalaisen opetuksen ja evankeliumien tulen paikalle. Nykytutkijat lainasivat sanan Tofet Karthagon ja muiden foinikialaisten siirtokuntien muurein ympäröidyille alueille, joihin haudattiin poltettujen lasten uurnia; kiistellään yhä, olivatko ne uhreja vai luonnollisesti kuolleiden lasten hautausmaa. Vuonna 1979 Gabriel Barkay löysi Ketef Hinnomin laakson olkapäällä olevasta haudasta kaksi pientä hopeakääröä 600- tai 500-luvulta eaa., joihin oli kaiverrettu pappillinen siunaus, Raamatun vanhimmat tunnetut sanat."
    - "Nykyisin Hinnomin laakso on puisto Vanhankaupungin muurien alla; sen päässä on Sultaanin lammikko, länsirinteen yläpuolella Cinematheque ja Menachem Begin Heritage Center ja Kidronin risteyksessä Hakeldaman luostari; Ketef Hinnomin amuletit ovat Israel-museossa."
  vi:
    - "Tô-phết là nơi tế lễ trong trũng con trai Hi-nôm, khe núi uốn quanh tây nam Giê-ru-sa-lem dưới các bức tường, nơi trẻ con bị bắt “qua lửa cho Mo-lóc”. Tên này thường được giải thích từ một từ chỉ lò hay bếp lửa, với nguyên âm của từ Hê-bơ-rơ nghĩa “sự xấu hổ” do các thầy chép gán cho, nhưng điều này không chắc chắn. Ê-sai đã dùng nó như biểu tượng một nơi thiêu sẵn cho vua A-si-ri: “Tô-phết đã sửa soạn từ xưa … trên có lửa và củi thật nhiều”. Vị trí chính xác của nó trong trũng, nay là Wadi er-Rababi, chưa bao giờ tìm ra."
    - "A-cha đốt hương trong trũng Hi-nôm và “thiêu con cái mình nơi lửa”, và Ma-na-se cũng làm như vậy. Giê-rê-mi buộc tội Giu-đa: “Chúng nó đã xây các nơi cao của Tô-phết, trong trũng của con trai Hi-nôm, đặng đốt con trai con gái mình trong lửa, ấy là điều ta chẳng từng dạy, là điều ta chẳng hề nghĩ đến”. Giô-si-a, trong cuộc cải cách, “làm ô uế Tô-phết”, để không ai còn dâng con ở đó nữa. Giê-rê-mi được sai đến trũng với một bình gốm để đập vỡ trước các trưởng lão và nói rằng “nơi nầy sẽ không gọi là Tô-phết, cũng không gọi là nơi trũng của con trai Hi-nôm nữa, mà là nơi trũng của sự đánh giết”, rằng người chết sẽ được chôn ở Tô-phết “cho đến thiếu chỗ chôn”, và Đức Chúa Trời sẽ “khiến thành nầy nên như Tô-phết”; rồi ông trở về “từ Tô-phết” và lặp lại trong hành lang đền. Luật pháp đã cấm nghi lễ ấy từ đầu."
    - "Từ tên Ge-Hinnom của trũng này mà có Gehenna, nơi có lửa trong giáo huấn Do Thái về sau và trong các sách Tin Lành. Các học giả hiện đại mượn từ Topheth cho các khu có tường bao ở Carthage và các thuộc địa Phê-ni-xi khác, nơi chôn các bình đựng trẻ sơ sinh bị thiêu; liệu đó là tế lễ hay là nghĩa địa cho trẻ chết tự nhiên thì vẫn còn tranh luận. Năm 1979, Gabriel Barkay tìm thấy, trong một ngôi mộ trên vai trũng tại Ketef Hinnom, hai cuộn bạc nhỏ thế kỷ 7 hoặc 6 TCN khắc lời chúc phước của thầy tế lễ, những lời Kinh Thánh cổ nhất được biết."
    - "Ngày nay trũng Hi-nôm là một công viên dưới các bức tường Thành Cổ, với Hồ Sultan ở đầu, Cinematheque và Trung tâm Di sản Menachem Begin phía trên sườn tây, và tu viện Hác-en-đa-ma ở chỗ giao với Xết-rôn; các bùa Ketef Hinnom ở Bảo tàng Israel."
  ro:
    - "Tofet era un loc de jertfă în valea fiului lui Hinom, râpa care ocolește Ierusalimul la sud-vest, sub ziduri, unde copiii erau trecuți prin foc pentru Moloh. Numele este explicat de obicei dintr-un cuvânt pentru vatră sau cuptor, cu vocalele cuvântului ebraic pentru „rușine” date lui de scribi, dar aceasta nu este sigur. Isaia îl folosește deja ca simbol al unui loc de ardere pregătit pentru regele Asiriei: Tofetul este pregătit de demult, rugul lui este foc și lemne multe. Locul său exact în vale, astăzi Wadi er-Rababi, nu a fost găsit niciodată."
    - "Ahaz a ars tămâie în valea Hinom și „a trecut pre fiii săi prin foc”, iar Manase a făcut la fel. Ieremia a acuzat Iuda că și-a zidit înălțimile Tofetului din valea fiului lui Hinom ca să-și ardă fiii și fiicele în foc, ceea ce Dumnezeu nu poruncise și nu-i trecuse prin inimă. Iosia, în reforma lui, a spurcat „Tofetul cel din valea fiului lui Enom”, ca nimeni să nu mai jertfească acolo un copil. Ieremia a fost trimis în vale cu un vas de lut ca să-l spargă înaintea bătrânilor și să spună că „locul acesta nu se va mai chema Tofet, nici loc de înmormântare Benenom, ci mormântul pierzărei”, că morții vor fi îngropați în Tofet, „pentrucă nu este alt loc de îngropăciune”, și că Dumnezeu va face cetatea aceasta ca Tofetul; apoi a venit „din valea Tofet” și a repetat acestea în curtea templului. Legea interzisese acest rit de la început."
    - "Valea i-a dat numele, Ge-Hinom, Gheenei, locul focului din învățătura iudaică ulterioară și din Evanghelii. Cercetătorii moderni au preluat cuvântul Tofet pentru incintele zidite de la Cartagina și din alte colonii feniciene, unde erau îngropate urne cu copii arși; dacă acelea erau jertfe sau un cimitir pentru copiii morți de moarte naturală este încă dezbătut. În 1979, Gabriel Barkay a găsit, într-un mormânt de pe panta văii, la Ketef Hinnom, două mici suluri de argint din secolul al VII-lea sau al VI-lea î.Hr., inscripționate cu binecuvântarea preoțească, cele mai vechi cuvinte cunoscute ale Bibliei."
    - "Astăzi valea Hinom este un parc sub zidurile Orașului Vechi, cu Iazul Sultanului în capul ei, Cinematheque și Centrul Menachem Begin pentru Patrimoniu deasupra pantei vestice, și mănăstirea Acheldama la întâlnirea ei cu Chedronul; amuletele de la Ketef Hinnom se află în Muzeul Israelului."
  bg:
    - "Тофет било място за жертвоприношения в долината Еном — клисурата, която обикаля югозападната страна на Йерусалим под стените, където децата били прекарвани „през огън за Молоха“. Името обикновено се обяснява от дума за огнище, на която писарите дали гласните на еврейската дума за „срам“, но това не е сигурно. Исаия вече го използва като нарицателно за място за изгаряне, приготвено за асирийския цар: „Тофет е пред време приготвен … Купът му е огън и дърва много“. Точното му място в долината, днес Уади ер-Рабаби, никога не е намерено."
    - "Ахаз кадил в долината Еном и „приведе чадата си през огъня“, а Манасия направил същото. Йеремия обвинявал Юда: „съградиха високите места на Тофет, Който е в дола на Еномовия син, За да горят синовете си и дъщерите си в огън, Което не съм заповядал, нито ми е дохождало на ум“. Йосия при реформата си „оскверни Тофета“, за да не може никой вече да принесе там дете. Йеремия бил изпратен в долината с грънчарски кърчаг, за да го строши пред старейшините и да каже, че „това място не ще се нарича вече Тофет, нито Дол на Еномовия син, но Дол на Клане“, че мъртвите ще бъдат погребвани в Тофет „доде не остане място“ и че Бог ще направи града „като Тофет“; после той дошъл „от Тофет“ и повторил това в двора на храма. Законът забранявал обреда от самото начало."
    - "Долината дала името си, Ге-Еном, на Геена — мястото на огъня в по-късното юдейско учение и в евангелията. Съвременните учени заимствали думата Тофет за оградените светилища в Картаген и други финикийски колонии, където са погребвани урни с изгорени бебета; дали това са били жертвоприношения или гробище за деца, починали от естествена смърт, още се обсъжда. През 1979 г. Габриел Баркай намерил в гробница на склона на долината при Кетеф Хином два малки сребърни свитъка от VII или VI в. пр.н.е. с надпис на свещеническото благословение — най-старите известни думи от Библията."
    - "Днес долината Еном е парк под стените на Стария град, с Басейна на султана в горния ѝ край, Синематеката и Центъра за наследството на Менахем Бегин над западния ѝ склон и манастира Акелдама при сливането ѝ с Кедрон; амулетите от Кетеф Хином са в Израелския музей."
