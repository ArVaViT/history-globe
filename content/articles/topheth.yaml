# Overview article (ADR 0007). Mainstream facts only; the etymology of the name is given as the usual but uncertain one; the nature of the Punic "tophets" is named as debated; the exact spot in the valley is said to be unknown.
id: topheth
place: ad81b79
title:
  en: "Topheth"
  ru: "Тофет"
body:
  en:
    - "Topheth was a place of sacrifice in the valley of the son of Hinnom, the ravine that curves round the south-west of Jerusalem below the walls, where children were made to “pass through the fire to Molech”. The name is usually explained from a word for a fireplace or hearth, with the vowels of the Hebrew for “shame” given it by the scribes, but this is not certain. Isaiah already uses it as a byword for a burning place prepared for the king of Assyria: “Tophet is ordained of old … the pile thereof is fire and much wood”. Its exact spot in the valley, today the Wadi er-Rababi, has never been found."
    - "Ahaz burnt incense in the valley of Hinnom “and burnt his children in the fire”, and Manasseh did the same. Jeremiah accused Judah: “they have built the high places of Tophet, which is in the valley of the son of Hinnom, to burn their sons and their daughters in the fire; which I commanded them not, neither came it into my heart”. Josiah, in his reform, “defiled Topheth”, that no one might offer a child there again. Jeremiah was sent to the valley with a potter's jar to break it before the elders and to say that “this place shall no more be called Tophet, nor The valley of the son of Hinnom, but The valley of slaughter”, that the dead would be buried in Topheth “till there be no place”, and that God would “make this city as Tophet”; then he came “from Tophet” and repeated it in the temple court. The law had forbidden the rite from the first."
    - "The valley gave its name, Ge-Hinnom, to Gehenna, the place of fire in later Jewish teaching and in the Gospels. Modern scholars borrowed the word Topheth for the walled precincts at Carthage and other Phoenician colonies where urns of burnt infants were buried; whether those were sacrifices or a cemetery for children who died naturally is still debated. In 1979 Gabriel Barkay found, in a tomb on the shoulder of the valley at Ketef Hinnom, two small silver scrolls of the seventh or sixth century BC inscribed with the priestly blessing, the oldest known words of the Bible."
    - "Today the Hinnom valley is a park below the walls of the Old City, with the Sultan's Pool at its head, the Cinematheque and the Menachem Begin Heritage Center above its western slope, and the monastery of Akeldama at its junction with the Kidron; the Ketef Hinnom amulets are in the Israel Museum."
  ru:
    - "Тофет — место жертвоприношений в долине сыновей Еннома, ущелье, огибающем Иерусалим с юго-запада под стенами, где детей проводили «чрез огонь Молоху». Имя обычно выводят из слова «очаг», «место сожжения», а огласовку ему, как считают, дали переписчики от еврейского слова «позор», но это не бесспорно. Исаия уже употребляет его как нарицательное имя костра, уготованного царю Ассирии: «Тофет давно уже устроен… в костре его много огня и дров». Точное место его в долине, нынешнем Вади-эр-Рабаби, так и не найдено."
    - "Ахаз совершал курения в долине Еннома и «проводил сыновей своих через огонь», то же делал и Манассия. Иеремия обличал Иудею: «устроили высоты Тофета в долине сыновей Енномовых, чтобы сожигать сыновей своих и дочерей своих в огне, чего Я не повелевал и что Мне на сердце не приходило». Об Иосии и его реформе сказано: «И осквернил он Тофет», чтобы никто больше не приносил там детей. Иеремия был послан в долину с кувшином горшечника, чтобы разбить его перед старейшинами и сказать, что «место сие не будет более называться Тофетом или долиною сыновей Енномовых, но долиною убиения», что мёртвых будут хоронить в Тофете «по недостатку места для погребения» и что Бог сделает город «подобным Тофету»; затем он пришёл «с Тофета» и повторил это на дворе храма. Закон запрещал этот обряд с самого начала."
    - "Долина дала своё имя, Ге-Хинном, геенне — месту огня в позднейшем иудейском учении и в Евангелиях. Современные учёные позаимствовали слово «тофет» для обнесённых стеной участков в Карфагене и других финикийских колониях, где хоронили урны с сожжёнными младенцами; были ли это жертвы или кладбище детей, умерших своей смертью, до сих пор спорят. В 1979 году Габриэль Баркай нашёл в гробнице на плече долины, в Кетеф-Хинном, два маленьких серебряных свитка VII–VI веков до н. э. со священническим благословением — древнейшие известные слова Библии."
    - "Сегодня долина Еннома — парк под стенами Старого города, с Султанским прудом в её верховье, Синематекой и Центром наследия Менахема Бегина над западным склоном и монастырём Акелдама у слияния с Кедроном; амулеты из Кетеф-Хинном хранятся в Музее Израиля."
