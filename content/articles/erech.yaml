# Overview article (ADR 0007). Mainstream facts only; dates for the fourth and third millennia BC are approximate, later Mesopotamian dates follow the middle chronology.
id: erech
place: a5db1a6
title:
  en: "Erech"
  ru: "Эрех"
  uk: "Ерех"
  es: "Erec"
  pt: "Ereque"
  de: "Erech"
  fr: "Érec"
  it: "Erec"
