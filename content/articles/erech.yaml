body:
  en:
    - "Erech, Sumerian Unug and Akkadian Uruk, lay in southern Mesopotamia at the mounds of Warka, about 35 km east of modern Samawah, on a channel of the Euphrates that has long since dried up. In the fourth millennium BC it grew into one of the first cities in the world, covering some 250 hectares by its end. In its two temple quarters, Eanna of the goddess Inanna and the district of the sky god Anu with the White Temple, excavators found the earliest known written tablets, from the late fourth millennium BC."
    - "By the early third millennium a city wall about 9 km long enclosed Uruk. The Sumerian King List counts Gilgamesh, the hero of the later epic, among its early kings. The city then lost the lead to other Sumerian cities and was ruled in turn from Akkad, Ur and Babylon, but it remained a great temple city of Anu and Ishtar. W. K. Loftus dug there in 1850 and 1854, and German expeditions have worked on the site, with long breaks, since 1912."
    - "In Genesis, Erech is one of the first cities of Nimrod's kingdom, with Babel, Accad and Calneh in the land of Shinar. The Book of Ezra lists the Archevites, usually understood as men of Erech, among the peoples whom the great and noble Asnappar, usually identified with Ashurbanipal of Assyria, had settled in the cities of Samaria, and who wrote to the Persian king against the rebuilding of Jerusalem."
    - "Under the Seleucid kings Uruk flourished again: its great temples of Anu and Ishtar were rebuilt, and its scribes went on writing cuneiform ritual and astronomical texts. Strabo names the Orcheni as one of the schools of Chaldean astronomers. The Parthians, who took Babylonia in 141 BC, held the city after them, but it dwindled under the Sasanian kings and was in the end abandoned; dates from the fifth to the eighth century AD are given."
  ru:
    - "Эрех, по-шумерски Унуг, по-аккадски Урук, лежал на юге Месопотамии, на холмах Варка, примерно в 35 км к востоку от нынешней Эс-Самавы, у давно пересохшего рукава Евфрата. В IV тысячелетии до н. э. он стал одним из первых городов мира и к концу этого тысячелетия занимал около 250 гектаров. В двух его храмовых кварталах — Эанне, святилище богини Инанны, и квартале бога неба Ану с Белым храмом — археологи нашли самые ранние известные письменные таблички конца IV тысячелетия до н. э."
    - "К началу III тысячелетия Урук окружала городская стена длиной около 9 км. Шумерский царский список называет Гильгамеша, героя позднейшего эпоса, среди ранних царей города. Затем первенство перешло к другим шумерским городам, и Уруком по очереди правили из Аккада, Ура и Вавилона, но он оставался великим храмовым городом Ану и Иштар. У. К. Лофтус копал здесь в 1850 и 1854 гг., а немецкие экспедиции с долгими перерывами работают здесь с 1912 г."
    - "В книге Бытия Эрех — один из первых городов царства Нимрода, вместе с Вавилоном, Аккадом и Халне в земле Сеннаар. Книга Ездры называет Арехьян, которых обычно понимают как жителей Эреха, среди народов, переселённых великим и славным Аснафаром (в Синодальном переводе — «Аснафар Сеннахирим», но обычно его отождествляют с ассирийским царём Ашшурбанапалом) в города Самарийские; они и писали персидскому царю против восстановления Иерусалима."
    - "При Селевкидах Урук снова расцвёл: здесь были отстроены большие храмы Ану и Иштар, а писцы продолжали писать клинописью ритуальные и астрономические тексты. Страбон называет орхенов одной из школ халдейских астрономов. Парфяне, взявшие Вавилонию в 141 г. до н. э., удерживали город после Селевкидов, но при сасанидских царях он пришёл в упадок и в конце концов был покинут; называют даты от V до VIII века н. э."
  uk:
    - "Ерех, шумерською Унуг, акадською Урук, лежав у південній Месопотамії на горбах Варка, приблизно за 35 км на схід від сучасної Самави, на каналі Євфрату, що давно висох. У IV тис. до н. е. він виріс в одне з перших міст світу, що наприкінці тисячоліття займало близько 250 гектарів. У його двох храмових кварталах, Еанні богині Інанни та районі бога неба Ану з Білим храмом, розкопувачі знайшли найдавніші відомі писемні таблички, кінця IV тис. до н. е."
    - "На початку III тис. міський мур завдовжки близько 9 км оточував Урук. Шумерський царський список зараховує Гільгамеша, героя пізнішого епосу, до його ранніх царів. Місто потім втратило першість на користь інших шумерських міст і управлялося по черзі з Аккаду, Ура та Вавилона, але лишалося великим храмовим містом Ану та Іштар. В. К. Лофтус копав там у 1850 і 1854 рр., а німецькі експедиції працюють на місці, з довгими перервами, від 1912 р."
    - "У Книзі Буття Ерех — одне з перших міст царства Німрода, поряд із Вавилоном, Аккадом і Калне в землі Сеннаар. Книга Ездри перелічує архевеїв, яких зазвичай розуміють як мешканців Ереха, серед народів, яких великий і славний Аснафар, зазвичай ототожнюваний з Ашшурбаніпалом Ассирійським, оселив у містах Самарії і які писали перському цареві проти відбудови Єрусалима."
    - "За селевкідських царів Урук знову процвітав: його великі храми Ану та Іштар було відбудовано, а його писарі й далі писали клинописні ритуальні й астрономічні тексти. Страбон називає оркенів як одну зі шкіл халдейських астрономів. Парфяни, які взяли Вавилонію в 141 р. до н. е., тримали місто після них, але воно занепадало за сасанідських царів і зрештою було покинуте; називають дати від V до VIII ст. н. е."
  es:
    - "Erec, en sumerio Unug y en acadio Uruk, se hallaba en el sur de Mesopotamia, en los montículos de Warka, a unos 35 km al este de la actual Samawa, en un cauce del Éufrates seco desde hace mucho. En el cuarto milenio a. C. llegó a ser una de las primeras ciudades del mundo, con unas 250 hectáreas al final de ese periodo. En sus dos barrios de templos, Eanna de la diosa Inanna y el distrito del dios del cielo Anu con el Templo Blanco, los excavadores hallaron las tablillas escritas más antiguas conocidas, de finales del cuarto milenio a. C."
    - "A comienzos del tercer milenio una muralla de unos 9 km de longitud rodeaba Uruk. La Lista Real Sumeria cuenta a Gilgamesh, el héroe de la epopeya posterior, entre sus primeros reyes. La ciudad perdió luego la primacía en favor de otras ciudades sumerias y fue gobernada sucesivamente desde Acad, Ur y Babilonia, pero siguió siendo una gran ciudad-templo de Anu e Ishtar. W. K. Loftus excavó allí en 1850 y 1854, y expediciones alemanas han trabajado en el sitio, con largas interrupciones, desde 1912."
    - "En el Génesis, Erec es una de las primeras ciudades del reino de Nimrod, con Babel, Acad y Calne en la tierra de Sinar. El libro de Esdras enumera a los arquevitas, que suelen entenderse como hombres de Erec, entre los pueblos que el grande y noble Asnapar, identificado habitualmente con Asurbanipal de Asiria, había asentado en las ciudades de Samaria, y que escribieron al rey persa contra la reconstrucción de Jerusalén."
    - "Bajo los reyes seléucidas Uruk floreció de nuevo: sus grandes templos de Anu e Ishtar fueron reconstruidos, y sus escribas siguieron escribiendo textos cuneiformes rituales y astronómicos. Estrabón nombra a los orqueni como una de las escuelas de astrónomos caldeos. Los partos, que tomaron Babilonia en el 141 a. C., conservaron la ciudad tras ellos, pero esta menguó bajo los reyes sasánidas y acabó abandonada; se dan fechas entre los siglos V y VIII d. C."
  pt:
    - "Ereque, em sumério Unug e em acádico Uruk, ficava no sul da Mesopotâmia, nos montes de Warka, a cerca de 35 km a leste da atual Samawah, num canal do Eufrates que secou há muito tempo. No quarto milênio a.C. cresceu até ser uma das primeiras cidades do mundo, cobrindo cerca de 250 hectares ao seu fim. Em seus dois bairros de templos, Eanna, da deusa Inanna, e o distrito do deus do céu Anu, com o Templo Branco, os escavadores acharam as mais antigas tabuinhas escritas conhecidas, do fim do quarto milênio a.C."
    - "No início do terceiro milênio, uma muralha de cerca de 9 km cercava Uruk. A Lista Real Suméria conta Gilgamesh, o herói da epopeia posterior, entre seus primeiros reis. A cidade perdeu depois a dianteira para outras cidades sumérias e foi governada sucessivamente de Acade, Ur e Babilônia, mas continuou sendo uma grande cidade-templo de Anu e Ishtar. W. K. Loftus escavou ali em 1850 e 1854, e expedições alemãs trabalham no local, com longas interrupções, desde 1912."
    - "No Gênesis, Ereque é uma das primeiras cidades do reino de Ninrode, com Babel, Acade e Calné, na terra de Sinar. O livro de Esdras lista os arquevitas, geralmente entendidos como homens de Ereque, entre os povos que o grande e nobre Asnapar, geralmente identificado com Assurbanipal da Assíria, fixara nas cidades de Samaria, e que escreveram ao rei persa contra a reconstrução de Jerusalém."
    - "Sob os reis selêucidas, Uruk floresceu de novo: seus grandes templos de Anu e Ishtar foram reconstruídos, e seus escribas continuaram a escrever textos cuneiformes rituais e astronômicos. Estrabão nomeia os orcenos como uma das escolas de astrônomos caldeus. Os partas, que tomaram a Babilônia em 141 a.C., mantiveram a cidade depois deles, mas ela definhou sob os reis sassânidas e foi por fim abandonada; dão-se datas do século V ao VIII d.C."
  de:
    - "Erech, sumerisch Unug und akkadisch Uruk, lag in Südmesopotamien bei den Hügeln von Warka, etwa 35 km östlich des heutigen Samawa, an einem längst ausgetrockneten Arm des Euphrat. Im 4. Jahrtausend v. Chr. wuchs es zu einer der ersten Städte der Welt heran und bedeckte an dessen Ende rund 250 Hektar. In seinen beiden Tempelbezirken, Eanna der Göttin Inanna und dem Bezirk des Himmelsgottes Anu mit dem Weißen Tempel, fanden Ausgräber die frühesten bekannten Schrifttafeln aus dem späten 4. Jahrtausend v. Chr."
    - "Im frühen 3. Jahrtausend umschloss eine etwa 9 km lange Stadtmauer Uruk. Die Sumerische Königsliste zählt Gilgamesch, den Helden des späteren Epos, zu seinen frühen Königen. Die Stadt verlor dann die Führung an andere sumerische Städte und wurde nacheinander von Akkad, Ur und Babylon aus beherrscht, blieb aber eine große Tempelstadt Anus und Ischtars. W. K. Loftus grub dort 1850 und 1854, und deutsche Expeditionen arbeiten, mit langen Unterbrechungen, seit 1912 am Ort."
    - "In der Genesis ist Erech eine der ersten Städte von Nimrods Reich, mit Babel, Akkad und Kalne im Land Schinar. Das Buch Esra führt die Arkewiter auf, gewöhnlich als Männer von Erech verstanden, unter den Völkern, die der große und berühmte Asnappar, gewöhnlich mit Assurbanipal von Assyrien gleichgesetzt, in den Städten Samarias angesiedelt hatte und die dem persischen König gegen den Wiederaufbau Jerusalems schrieben."
    - "Unter den seleukidischen Königen blühte Uruk wieder auf: Seine großen Tempel Anus und Ischtars wurden wiederaufgebaut, und seine Schreiber schrieben weiter keilschriftliche Ritual- und astronomische Texte. Strabon nennt die Orchener als eine der Schulen chaldäischer Astronomen. Die Parther, die Babylonien 141 v. Chr. einnahmen, hielten die Stadt nach ihnen, doch sie schrumpfte unter den Sasanidenkönigen und wurde schließlich aufgegeben; genannt werden Daten vom 5. bis zum 8. Jahrhundert n. Chr."
  fr:
    - "Érec, en sumérien Unug et en akkadien Uruk, se trouvait dans le sud de la Mésopotamie, aux tertres de Warka, à environ 35 km à l’est de l’actuelle Samawa, sur un bras de l’Euphrate asséché depuis longtemps. Au IVe millénaire av. J.-C., elle devint l’une des premières villes du monde, couvrant quelque 250 hectares à la fin de cette période. Dans ses deux quartiers de temples, l’Eanna de la déesse Inanna et le quartier du dieu du ciel Anu avec le Temple blanc, les fouilleurs trouvèrent les plus anciennes tablettes écrites connues, de la fin du IVe millénaire av. J.-C."
    - "Dès le début du IIIe millénaire, un rempart d’environ 9 km de long enfermait Uruk. La Liste royale sumérienne compte Gilgamesh, le héros de l’épopée ultérieure, parmi ses premiers rois. La ville perdit ensuite la primauté au profit d’autres cités sumériennes et fut gouvernée tour à tour depuis Akkad, Ur et Babylone, mais elle resta une grande ville de temples d’Anu et d’Ishtar. W. K. Loftus y fouilla en 1850 et 1854, et des expéditions allemandes travaillent sur le site, avec de longues interruptions, depuis 1912."
    - "Dans la Genèse, Érec est l’une des premières villes du royaume de Nimrod, avec Babel, Accad et Calné au pays de Schinear. Le livre d’Esdras cite les Arkévites, généralement compris comme les gens d’Érec, parmi les peuples que le grand et illustre Osnappar, généralement identifié à Assurbanipal d’Assyrie, avait établis dans les villes de Samarie, et qui écrivirent au roi perse contre la reconstruction de Jérusalem."
    - "Sous les rois séleucides, Uruk connut un nouvel essor : ses grands temples d’Anu et d’Ishtar furent reconstruits, et ses scribes continuèrent d’écrire des textes rituels et astronomiques cunéiformes. Strabon nomme les Orchéniens parmi les écoles d’astronomes chaldéens. Les Parthes, qui prirent la Babylonie en 141 av. J.-C., tinrent la ville après eux, mais elle déclina sous les rois sassanides et fut finalement abandonnée ; des dates du Ve au VIIIe siècle apr. J.-C. sont avancées."
  it:
    - "Erec, in sumerico Unug e in accadico Uruk, sorgeva nella Mesopotamia meridionale presso i tell di Warka, a circa 35 km a est dell’odierna Samawah, su un canale dell’Eufrate prosciugato da tempo. Nel IV millennio a.C. crebbe fino a diventare una delle prime città del mondo, estendendosi alla fine per circa 250 ettari. Nei suoi due quartieri templari, Eanna della dea Inanna e il distretto del dio del cielo Anu con il Tempio Bianco, gli scavatori trovarono le più antiche tavolette scritte note, della fine del IV millennio a.C."
    - "All’inizio del III millennio una cinta muraria lunga circa 9 km racchiudeva Uruk. La Lista reale sumerica annovera Gilgamesh, l’eroe del poema successivo, fra i suoi primi re. La città perse poi il primato a favore di altre città sumeriche e fu governata a turno da Accad, Ur e Babilonia, ma restò una grande città templare di Anu e Ishtar. W. K. Loftus vi scavò nel 1850 e nel 1854, e spedizioni tedesche lavorano sul sito, con lunghe pause, dal 1912."
    - "Nella Genesi Erec è una delle prime città del regno di Nimrod, con Babele, Accad e Calne nel paese di Sennaar. Il libro di Esdra elenca gli Archeviti, di solito intesi come uomini di Erec, fra i popoli che il grande e illustre Asnappar, di solito identificato con Assurbanipal d’Assiria, aveva stanziato nelle città di Samaria, e che scrissero al re persiano contro la ricostruzione di Gerusalemme."
    - "Sotto i re seleucidi Uruk fiorì di nuovo: i suoi grandi templi di Anu e Ishtar furono ricostruiti, e i suoi scribi continuarono a scrivere testi cuneiformi rituali e astronomici. Strabone nomina gli Orcheni come una delle scuole di astronomi caldei. I Parti, che presero la Babilonia nel 141 a.C., la tennero dopo di loro, ma sotto i re sasanidi essa si ridusse e fu infine abbandonata; si danno date dal V all’VIII secolo d.C."
  pl:
    - "Erek, sumeryjskie Unug, a akadyjskie Uruk, leżało w południowej Mezopotamii na kopcach Warka, około 35 km na wschód od dzisiejszej Samawy, nad odnogą Eufratu, która dawno wyschła. W IV tysiącleciu p.n.e. wyrosło na jedno z pierwszych miast świata, obejmując pod koniec około 250 hektarów. W jego dwóch dzielnicach świątynnych, Eanna bogini Inanny i dzielnicy boga nieba Anu z Białą Świątynią, archeolodzy znaleźli najwcześniejsze znane tabliczki z pismem, z końca IV tysiąclecia p.n.e."
    - "Na początku III tysiąclecia mur miejski o długości około 9 km otaczał Uruk. Sumeryjska lista królów zalicza Gilgamesza, bohatera późniejszego eposu, do jego wczesnych królów. Miasto straciło potem pierwszeństwo na rzecz innych miast sumeryjskich i było rządzone kolejno z Akadu, Ur i Babilonu, lecz pozostało wielkim miastem świątynnym Anu i Isztar. W. K. Loftus kopał tam w 1850 i 1854 r., a wyprawy niemieckie pracują na stanowisku, z długimi przerwami, od 1912 r."
    - "W Księdze Rodzaju Erek jest jednym z pierwszych miast królestwa Nimroda, z Babel, Akad i Kalne w ziemi Szinear. Księga Ezdrasza wymienia Archewitów, zwykle rozumianych jako mieszkańców Erek, wśród ludów, które wielki i szlachetny Asnappar, zwykle utożsamiany z Aszurbanipalem Asyryjskim, osiedlił w miastach Samarii i które pisały do króla perskiego przeciw odbudowie Jerozolimy."
    - "Za królów seleucydzkich Uruk znów rozkwitło: jego wielkie świątynie Anu i Isztar odbudowano, a jego skrybowie nadal pisali klinowe teksty rytualne i astronomiczne. Strabon wymienia Orchenijczyków jako jedną ze szkół chaldejskich astronomów. Partowie, którzy zajęli Babilonię w 141 r. p.n.e., trzymali miasto po nich, lecz za królów sasanidzkich podupadło i w końcu zostało opuszczone; podaje się daty od V do VIII w. n.e."
  nl:
    - "Erech, Soemerisch Unug en Akkadisch Uruk, lag in Zuid-Mesopotamië bij de heuvels van Warka, zo'n 35 km ten oosten van het moderne Samawa, aan een arm van de Eufraat die al lang is opgedroogd. In het vierde millennium v.Chr. groeide het uit tot een van de eerste steden ter wereld, die tegen het eind zo'n 250 hectare besloeg. In zijn twee tempelkwartieren, Eanna van de godin Inanna en het district van de hemelgod Anu met de Witte Tempel, vonden opgravers de oudste bekende geschreven tabletten, uit het late vierde millennium v.Chr."
    - "In het begin van het derde millennium omsloot een stadsmuur van zo'n 9 km lang Uruk. De Soemerische koningslijst telt Gilgamesj, de held van het latere epos, onder de vroege koningen. De stad verloor daarna de leiding aan andere Soemerische steden en werd beurtelings vanuit Akkad, Ur en Babylon bestuurd, maar bleef een grote tempelstad van Anu en Ishtar. W.K. Loftus groef er in 1850 en 1854, en Duitse expedities werken sinds 1912, met lange onderbrekingen, op de plaats."
    - "In Genesis is Erech een van de eerste steden van Nimrods koninkrijk, met Babel, Akkad en Kalne in het land Sinear. Het boek Ezra noemt de Archevieten, gewoonlijk opgevat als mannen van Erech, onder de volken die de grote en vermaarde Asnappar, gewoonlijk geïdentificeerd met Assurbanipal van Assyrië, had gevestigd in de steden van Samaria, en die de Perzische koning schreven tegen de herbouw van Jeruzalem."
    - "Onder de Seleucidische koningen bloeide Uruk opnieuw: zijn grote tempels van Anu en Ishtar werden herbouwd, en zijn schrijvers bleven spijkerschriftteksten over ritueel en sterrenkunde schrijven. Strabo noemt de Orchenen als een van de scholen van Chaldeeuwse sterrenkundigen. De Parthen, die Babylonië in 141 v.Chr. namen, hielden de stad na hen, maar onder de Sassanidische koningen kromp zij en werd ten slotte verlaten; data van de vijfde tot de achtste eeuw n.Chr. worden genoemd."
  cs:
    - "Erek, sumersky Unug a akkadsky Uruk, ležel v jižní Mezopotámii na pahorcích Warka, asi 35 km východně od dnešní Samáwy, na rameni Eufratu, které už dávno vyschlo. Ve 4. tisíciletí př. n. l. vyrostl v jedno z prvních měst světa, jež na jeho konci zabíralo asi 250 hektarů. Ve dvou jeho chrámových čtvrtích, Eanně bohyně Inanny a čtvrti nebeského boha Anua s Bílým chrámem, vykopávači našli nejstarší známé psané tabulky z konce 4. tisíciletí př. n. l."
    - "Na počátku 3. tisíciletí obepínala Uruk městská hradba dlouhá asi 9 km. Sumerský královský seznam počítá Gilgameše, hrdinu pozdějšího eposu, mezi jeho rané krále. Město pak ztratilo prvenství ve prospěch jiných sumerských měst a bylo střídavě ovládáno z Akkadu, Uru a Babylóna, ale zůstalo velkým chrámovým městem Anua a Ištar. W. K. Loftus tam kopal v letech 1850 a 1854 a německé expedice na místě pracují, s dlouhými přestávkami, od roku 1912."
    - "V Genesi je Erek jedním z prvních měst Nimrodova království, s Babelem, Akkadem a Kalne v zemi Šineár. Kniha Ezdrášova uvádí Arkevejce, obvykle chápané jako muže z Ereku, mezi národy, které velký a vznešený Asnapar, obvykle ztotožňovaný s Aššurbanipalem Asyrským, usadil ve městech Samaří a kteří psali perskému králi proti obnovení Jeruzaléma."
    - "Za seleukovských králů Uruk znovu vzkvétal: jeho velké chrámy Anua a Ištar byly přestavěny a jeho písaři dál psali klínopisné rituální a astronomické texty. Strabón jmenuje Orchény jako jednu ze škol chaldejských astronomů. Parthové, kteří dobyli Babylonii roku 141 př. n. l., město po nich drželi, ale za sásánovských králů se zmenšovalo a nakonec bylo opuštěno; udávají se data od 5. do 8. století n. l."
