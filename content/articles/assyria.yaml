body:
  en:
    - 'Assyria was the land on the upper Tigris, in what is now northern Iraq, named after the city and god Ashur. Its heartland was a triangle of some 100 km between Ashur on the west bank, Nineveh opposite modern Mosul and Arbela (Erbil), with Calah (Nimrud) between them and Dur-Sharrukin (Khorsabad) just north of Nineveh. Genesis says that Asshur "builded Nineveh, and the city Rehoboth, and Calah". In the twentieth and nineteenth centuries BC Assyrian merchants kept a trading colony at Kanesh in Anatolia whose tablets form the richest archive of the Old Assyrian period; in the fourteenth century Ashur-uballit I made Assyria a kingdom among the great powers.'
    - 'From the ninth century BC Assyria built the largest empire the Near East had seen. Shalmaneser III fought Ahab the Israelite at Qarqar in 853 BC, and his Black Obelisk shows the tribute of Jehu. Tiglath-pileser III, the Pul of Kings, took a thousand talents of silver from Menahem and in 733–732 BC carried off Gilead and Galilee; Shalmaneser V and Sargon II took Samaria in 722 BC and "carried Israel away into Assyria". Sennacherib took the fortified cities of Judah in 701 BC, as his prism and the Lachish reliefs record, but Jerusalem was spared; Kings tells of the angel who "smote in the camp of the Assyrians an hundred fourscore and five thousand". Esarhaddon and Ashurbanipal, whose library was found at Nineveh, conquered Egypt.'
    - 'For the prophets Assyria is "the rod of mine anger", the instrument of judgement that will itself be judged. Jonah is sent to Nineveh, "that great city", and it repents; Nahum and Zephaniah foretell its ruin. The Babylonian Chronicle records how the Medes took Ashur in 614 BC and, with the Babylonians, Nineveh in 612; the last Assyrian king lost Harran in 610, failed to retake it in 609 and then vanishes from the record, and the Egyptians who had come to his aid were driven from Carchemish in 605. Isaiah nevertheless looks to a day when "Israel be the third with Egypt and with Assyria".'
    - "The Assyrian cities were rediscovered in the 1840s by Botta at Khorsabad and Layard at Nimrud and Nineveh; their reliefs and the tablets of Ashurbanipal's library fill the Louvre and the British Museum. Under the Parthians the land became the kingdom of Adiabene, whose royal house converted to Judaism, and later it became a centre of Syriac Christianity. The Assyrian Christians of Iraq, Syria and the diaspora still bear the name. Nineveh and Nimrud were badly damaged by the Islamic State in 2015–2016."
  ru:
    - "Ассирия — страна на верхнем Тигре, на севере нынешнего Ирака, названная по городу и богу Ашшуру. Её сердцевиной был треугольник со стороной около 100 км между Ассуром на западном берегу, Ниневией напротив нынешнего Мосула и Арбелой (Эрбилем), с Калахом (Нимрудом) между ними и Дур-Шаррукином (Хорсабадом) чуть севернее Ниневии. Книга Бытия говорит, что Ассур «построил Ниневию, Реховоф-ир, Калах». В XX–XIX веках до н. э. ассирийские купцы держали торговую колонию в Канише в Анатолии, таблички которой — богатейший архив староассирийской эпохи; в XIV веке Ашшур-убаллит I сделал Ассирию царством в ряду великих держав."
    - "С IX века до н. э. Ассирия построила самую большую державу, какую знал Ближний Восток. Салманассар III сражался с Ахавом Израильтянином при Каркаре в 853 г. до н. э., а его Чёрный обелиск показывает дань Ииуя. Феглаффелласар III, Фул книг Царств, взял у Менаима тысячу талантов серебра, а в 733–732 гг. до н. э. увёл в плен Галаад и Галилею; Салманассар V и Саргон II взяли Самарию в 722 г. до н. э. и переселили «Израильтян в Ассирию». Сеннахирим в 701 г. до н. э. взял укреплённые города Иудеи, о чём говорят его призма и рельефы из Лахиса, но Иерусалим уцелел; книги Царств рассказывают об Ангеле, который «поразил в стане Ассирийском сто восемьдесят пять тысяч». Асардан и Ашшурбанапал, чья библиотека найдена в Ниневии, завоевали Египет."
    - "Для пророков Ассирия — «жезл гнева Моего», орудие суда, которое само будет судимо. Иона послан в Ниневию, «город великий», и она кается; Наум и Софония предрекают её гибель. Вавилонская хроника сообщает, как Мидяне взяли Ассур в 614 г. до н. э., а вместе с Вавилонянами — Ниневию в 612 г.; последний ассирийский царь потерял Харран в 610 г., не смог отбить его в 609 г. и затем исчезает из записей, а Египтяне, пришедшие ему на помощь, были выбиты из Кархемиса в 605 г. И всё же Исаия ждёт дня, когда «Израиль будет третьим с Египтом и Ассириею»."
    - "Ассирийские города заново открыли в 1840-х годах Ботта в Хорсабаде и Лэйард в Нимруде и Ниневии; их рельефы и таблички библиотеки Ашшурбанапала наполняют Лувр и Британский музей. При Парфянах эта земля стала царством Адиабеной, чей царский дом принял иудаизм, а позже стала средоточием сирийского христианства. Ассирийцы-христиане Ирака, Сирии и рассеяния до сих пор носят это имя. Ниневия и Нимруд сильно пострадали от «Исламского государства» в 2015–2016 годах."
  uk:
    - "Ассирія була краєм на верхньому Тигрі, на території нинішнього північного Іраку, названим за містом і богом Ашшуром. Її осердям був трикутник близько 100 км між Ашшуром на західному березі, Ніневією навпроти сучасного Мосула та Арбелою (Ербіль), з Калахом (Німруд) між ними та Дур-Шаррукіном (Хорсабад) трохи на північ від Ніневії. Буття каже, що Ассур «збудовав Ниневу і Регобод-Ір, і Калаг». У XX–XIX століттях до н. е. ассирійські купці мали торговельну колонію в Каніші в Анатолії, чиї таблички утворюють найбагатший архів староассирійського періоду; у XIV столітті Ашшур-убалліт I зробив Ассирію царством серед великих держав."
    - "Від IX століття до н. е. Ассирія побудувала найбільшу імперію, яку бачив Близький Схід. Салманассар III воював проти ізраїльтянина Ахава при Каркарі в 853 р. до н. е., а його Чорний обеліск показує данину Єгу. Тіглатпаласар III, Фул з книг Царів, узяв тисячу талантів срібла від Менаїма і в 733–732 рр. до н. е. забрав Гілеад і Галілею; Салманассар V і Саргон II взяли Самарію в 722 р. до н. е. і «одвів Ізрайлитян полонянами в Ассирию». Сінаххеріб узяв укріплені міста Юди в 701 р. до н. е., як записують його призма й лахішські рельєфи, але Єрусалим пощадили; книги Царів розповідають про ангела, що «положив трупом ув Ассирийському таборі сто вісїмдесять і пять тисяч». Асархаддон та Ашшурбаніпал, чию бібліотеку знайдено в Ніневії, завоювали Єгипет."
    - "Для пророків Ассирія — «палиця мого гнїву», знаряддя суду, яке саме буде судити. Йону посилають до Ніневії, у «город великий», і вона розкається; Наум і Софонія провіщають її руїну. Вавилонська хроніка записує, як мідяни взяли Ашшур у 614 р. до н. е., а разом із вавилонянами — Ніневію в 612-му; останній ассирійський цар втратив Харан у 610-му, не зміг повернути його в 609-му і далі зникає із записів, а єгиптян, що прийшли йому на допомогу, прогнали з Каркемиша у 605-му. Проте Ісая дивиться на день, коли «буде Ізраїль третим із Египтом і Ассириєю»."
    - "Ассирійські міста заново відкрили в 1840-х роках Ботта в Хорсабаді та Лейярд у Німруді й Ніневії; їхні рельєфи та таблички бібліотеки Ашшурбаніпала наповнюють Лувр і Британський музей. За парфян край став царством Адіабена, чий царський дім навернувся до юдаїзму, а згодом став осередком сирійського християнства. Ассирійські християни Іраку, Сирії та діаспори й досі носять це ім'я. Ніневію і Німруд сильно пошкодила «Ісламська держава» в 2015–2016 роках."
  es:
    - "Asiria era la tierra del alto Tigris, en lo que hoy es el norte de Irak, que tomó el nombre de la ciudad y dios Asur. Su corazón era un triángulo de unos 100 km entre Asur, en la orilla occidental, Nínive, frente a la actual Mosul, y Arbela (Erbil), con Cala (Nimrud) entre ellas y Dur-Sharrukin (Jorsabad) justo al norte de Nínive. El Génesis dice que Asur «edificó á Nínive, y á Rehoboth, y á Calah». En los siglos XX y XIX a. C. los mercaderes asirios mantuvieron una colonia comercial en Kanesh, en Anatolia, cuyas tablillas forman el más rico archivo del período paleoasirio; en el siglo XIV Asur-uballit I hizo de Asiria un reino entre las grandes potencias."
    - "Desde el siglo IX a. C. Asiria construyó el mayor imperio que había visto el Próximo Oriente. Salmanasar III combatió a Acab el israelita en Qarqar en 853 a. C., y su Obelisco Negro muestra el tributo de Jehú. Tiglat-pileser III, el Phul de Reyes, tomó mil talentos de plata a Manahem y en 733–732 a. C. se llevó Galaad y Galilea; Salmanasar V y Sargón II tomaron Samaria en 722 a. C. y «trasportó á Israel á Asiria». Senaquerib tomó las ciudades fortificadas de Judá en 701 a. C., como registran su prisma y los relieves de Laquis, pero Jerusalén se salvó; Reyes habla del ángel que «hirió en el campo de los Asirios ciento ochenta y cinco mil». Esar-hadón y Asurbanipal, cuya biblioteca fue hallada en Nínive, conquistaron Egipto."
    - "Para los profetas Asiria es «vara y bastón de mi furor», el instrumento de juicio que será a su vez juzgado. Jonás es enviado a Nínive, «ciudad grande», y esta se arrepiente; Nahum y Sofonías predicen su ruina. La Crónica babilónica registra cómo los medos tomaron Asur en 614 a. C. y, con los babilonios, Nínive en 612; el último rey asirio perdió Harán en 610, no logró recuperarla en 609 y luego desaparece del registro, y los egipcios que habían acudido en su ayuda fueron expulsados de Carquemis en 605. Isaías mira, sin embargo, a un día en que «Israel será tercero con Egipto y con Asiria»."
    - "Las ciudades asirias fueron redescubiertas en la década de 1840 por Botta en Jorsabad y Layard en Nimrud y Nínive; sus relieves y las tablillas de la biblioteca de Asurbanipal llenan el Louvre y el Museo Británico. Bajo los partos la tierra se convirtió en el reino de Adiabene, cuya casa real se convirtió al judaísmo, y más tarde fue un centro del cristianismo siríaco. Los cristianos asirios de Irak, Siria y la diáspora aún llevan el nombre. Nínive y Nimrud fueron gravemente dañadas por el Estado Islámico en 2015–2016."
  pt:
    - "A Assíria era a terra do alto Tigre, no atual norte do Iraque, que recebeu o nome da cidade e do deus Assur. Seu coração era um triângulo de cerca de 100 km entre Assur, na margem oeste, Nínive, defronte da atual Mossul, e Arbela (Erbil), com Calá (Nimrud) entre elas e Dur-Sharrukin (Khorsabad) logo ao norte de Nínive. Gênesis diz que Assur “edificou Nínive, Reobote-Ir, Calá”. Nos séculos XX e XIX a.C., mercadores assírios mantinham uma colônia comercial em Kanesh, na Anatólia, cujas tabuinhas formam o mais rico arquivo do período paleoassírio; no século XIV, Assur-uballit I fez da Assíria um reino entre as grandes potências."
    - "A partir do século IX a.C. a Assíria construiu o maior império que o Oriente Próximo vira. Salmaneser III combateu Acabe, o israelita, em Qarqar em 853 a.C., e seu Obelisco Negro mostra o tributo de Jeú. Tiglate-Pileser III, o Pul de Reis, tomou mil talentos de prata de Menaém e em 733–732 a.C. levou Gileade e a Galileia; Salmaneser V e Sargão II tomaram Samaria em 722 a.C., e o rei assírio “levou Israel cativo para a Assíria”. Senaqueribe tomou as cidades fortificadas de Judá em 701 a.C., como registram seu prisma e os relevos de Laquis, mas Jerusalém foi poupada; Reis conta do anjo que “feriu cento e oitenta e cinco mil no acampamento dos assírios”. Esar-Hadom e Assurbanípal, cuja biblioteca foi achada em Nínive, conquistaram o Egito."
    - "Para os profetas a Assíria é “a vara da minha ira”, o instrumento de juízo que será ele mesmo julgado. Jonas é enviado a Nínive, “a grande cidade”, e ela se arrepende; Naum e Sofonias predizem a sua ruína. A Crônica Babilônica registra como os medos tomaram Assur em 614 a.C. e, com os babilônios, Nínive em 612; o último rei assírio perdeu Harã em 610, não conseguiu retomá-la em 609 e depois some dos registros, e os egípcios que tinham vindo em seu auxílio foram expulsos de Carquemis em 605. Isaías, contudo, olha para um dia em que “Israel será o terceiro com o Egito e com a Assíria”."
    - "As cidades assírias foram redescobertas na década de 1840 por Botta em Khorsabad e por Layard em Nimrud e Nínive; seus relevos e as tabuinhas da biblioteca de Assurbanípal enchem o Louvre e o Museu Britânico. Sob os partas a terra tornou-se o reino de Adiabene, cuja casa real se converteu ao judaísmo, e mais tarde tornou-se um centro do cristianismo siríaco. Os cristãos assírios do Iraque, da Síria e da diáspora ainda levam o nome. Nínive e Nimrud foram gravemente danificadas pelo Estado Islâmico em 2015–2016."
  de:
    - "Assyrien war das Land am oberen Tigris im heutigen Nordirak, benannt nach der Stadt und dem Gott Aschschur. Sein Kernland war ein Dreieck von etwa 100 km zwischen Assur am Westufer, Ninive gegenüber dem heutigen Mossul und Arbela (Erbil), mit Kalach (Nimrud) dazwischen und Dur-Scharrukin (Chorsabad) knapp nördlich von Ninive. Das erste Buch Mose sagt: „Von dem Land ist er gekommen nach Assur und baute Ninive und Rehoboth-Ir und Kalah“ (so Luther; nach der King-James-Bibel baute Assur selbst diese Städte). Im 20. und 19. Jahrhundert v. Chr. unterhielten assyrische Kaufleute eine Handelskolonie in Kanesch in Anatolien, deren Tafeln das reichste Archiv der altassyrischen Zeit bilden; im 14. Jahrhundert machte Aschschur-uballit I. Assyrien zu einem Königreich unter den Großmächten."
    - "Vom 9. Jahrhundert v. Chr. an baute Assyrien das größte Reich, das der Vordere Orient gesehen hatte. Salmanassar III. kämpfte 853 v. Chr. bei Qarqar gegen Ahab den Israeliten, und sein Schwarzer Obelisk zeigt den Tribut Jehus. Tiglat-Pileser III., der Pul der Königsbücher, nahm von Menahem tausend Talente Silber und führte 733–732 v. Chr. Gilead und Galiläa fort; Salmanassar V. und Sargon II. nahmen 722 v. Chr. Samaria ein und „führten Israel weg nach Assyrien“. Sanherib nahm 701 v. Chr. die festen Städte Judas ein, wie sein Prisma und die Lachisch-Reliefs bezeugen, doch Jerusalem blieb verschont; die Königsbücher erzählen vom Engel, der „im Lager von Assyrien hundertfünfundachtzigtausend Mann“ schlug. Asarhaddon und Assurbanipal, dessen Bibliothek in Ninive gefunden wurde, eroberten Ägypten."
    - "Den Propheten ist Assyrien „meines Zornes Rute“, das Werkzeug des Gerichts, das selbst gerichtet werden wird. Jona wird nach Ninive gesandt, „die große Stadt“, und sie bekehrt sich; Nahum und Zefanja sagen ihren Untergang voraus. Die Babylonische Chronik verzeichnet, wie die Meder 614 v. Chr. Assur und 612 zusammen mit den Babyloniern Ninive einnahmen; der letzte assyrische König verlor 610 Haran, scheiterte 609 bei dessen Rückeroberung und verschwindet dann aus den Quellen, und die Ägypter, die ihm zu Hilfe gekommen waren, wurden 605 aus Karkemisch vertrieben. Dennoch schaut Jesaja auf einen Tag, an dem „Israel selbdritt sein wird mit den Ägyptern und Assyrern“."
    - "Die assyrischen Städte wurden in den 1840er Jahren wiederentdeckt, von Botta in Chorsabad und Layard in Nimrud und Ninive; ihre Reliefs und die Tafeln der Bibliothek Assurbanipals füllen den Louvre und das Britische Museum. Unter den Parthern wurde das Land das Königreich Adiabene, dessen Königshaus zum Judentum übertrat, und später ein Zentrum des syrischen Christentums. Die assyrischen Christen im Irak, in Syrien und in der Diaspora tragen den Namen noch heute. Ninive und Nimrud wurden 2015–2016 vom Islamischen Staat schwer beschädigt."
  fr:
    - "L’Assyrie était le pays du haut Tigre, dans l’actuel nord de l’Irak, nommé d’après la ville et le dieu Ashur. Son cœur était un triangle d’environ 100 km entre Ashur sur la rive ouest, Ninive en face de l’actuelle Mossoul et Arbèles (Erbil), avec Calach (Nimroud) entre elles et Dur-Sharrukin (Khorsabad) juste au nord de Ninive. La Genèse dit qu’Assur « bâtit Ninive, Rehoboth Hir, Calach ». Aux XXe et XIXe siècles av. J.-C., des marchands assyriens tenaient un comptoir à Kanesh en Anatolie dont les tablettes forment la plus riche archive de la période paléo-assyrienne ; au XIVe siècle, Assour-uballit Ier fit de l’Assyrie un royaume parmi les grandes puissances."
    - "Dès le IXe siècle av. J.-C., l’Assyrie bâtit le plus vaste empire que le Proche-Orient eût connu. Salmanasar III combattit Achab l’Israélite à Qarqar en 853 av. J.-C., et son obélisque noir montre le tribut de Jéhu. Tiglath-Piléser III, le Pul des Rois, prit mille talents d’argent à Menahem et en 733-732 av. J.-C. emmena Galaad et la Galilée ; Salmanasar V et Sargon II prirent Samarie en 722 av. J.-C. : le roi d’Assyrie « emmena Israël captif en Assyrie ». Sanchérib prit les villes fortes de Juda en 701 av. J.-C., comme le consignent son prisme et les reliefs de Lakis, mais Jérusalem fut épargnée ; les Rois racontent l’ange qui « frappa dans le camp des Assyriens cent quatre-vingt-cinq mille hommes ». Esar-Haddon et Assurbanipal, dont la bibliothèque fut trouvée à Ninive, conquirent l’Égypte."
    - "Pour les prophètes, l’Assyrie est la « verge de ma colère », instrument du jugement qui sera jugé à son tour. Jonas est envoyé à Ninive, « la grande ville », et elle se repent ; Nahum et Sophonie annoncent sa ruine. La Chronique babylonienne note comment les Mèdes prirent Ashur en 614 av. J.-C. et, avec les Babyloniens, Ninive en 612 ; le dernier roi assyrien perdit Haran en 610, échoua à la reprendre en 609 puis disparaît des sources, et les Égyptiens venus à son aide furent chassés de Carkemisch en 605. Ésaïe regarde pourtant vers un jour où « Israël sera, lui troisième, uni à l’Égypte et à l’Assyrie »."
    - "Les villes assyriennes furent redécouvertes dans les années 1840 par Botta à Khorsabad et Layard à Nimroud et Ninive ; leurs reliefs et les tablettes de la bibliothèque d’Assurbanipal remplissent le Louvre et le British Museum. Sous les Parthes, le pays devint le royaume d’Adiabène, dont la maison royale se convertit au judaïsme, et il devint plus tard un centre du christianisme syriaque. Les chrétiens assyriens d’Irak, de Syrie et de la diaspora portent encore ce nom. Ninive et Nimroud furent gravement endommagées par l’État islamique en 2015-2016."
  it:
    - "L’Assiria era la terra sul Tigri superiore, nell’attuale Iraq settentrionale, che prendeva nome dalla città e dal dio Ashur. Il suo cuore era un triangolo di circa 100 km tra Assur sulla riva occidentale, Ninive di fronte all’odierna Mossul e Arbela (Erbil), con Calach (Nimrud) in mezzo e Dur-Sharrukin (Khorsabad) poco a nord di Ninive. La Genesi dice che Assur «edificò Ninive, Rehoboth-Ir e Calah». Nel XX e XIX secolo a.C. mercanti assiri tennero una colonia commerciale a Kanesh in Anatolia, le cui tavolette formano il più ricco archivio del periodo paleo-assiro; nel XIV secolo Assur-uballit I fece dell’Assiria un regno tra le grandi potenze."
    - "Dal IX secolo a.C. l’Assiria costruì il più grande impero che il Vicino Oriente avesse visto. Salmanàssar III combatté Acab l’israelita a Qarqar nell’853 a.C., e il suo Obelisco Nero mostra il tributo di Ieu. Tiglat-Pilèser III, il Pul dei Re, prese mille talenti d’argento da Menachem e nel 733–732 a.C. portò via Galaad e la Galilea; Salmanàssar V e Sargon II presero Samaria nel 722 a.C. e «trasportò gl’Israeliti in Assiria». Sennacherib prese le città fortificate di Giuda nel 701 a.C., come registrano il suo prisma e i rilievi di Lachis, ma Gerusalemme fu risparmiata; i Re raccontano dell’angelo che «colpì nel campo degli Assiri cent’ottantacinquemila uomini». Assaraddon e Assurbanipal, la cui biblioteca fu trovata a Ninive, conquistarono l’Egitto."
    - "Per i profeti l’Assiria è la «verga della mia ira», lo strumento del giudizio che sarà a sua volta giudicato. Giona è mandato a Ninive, «la gran città», ed essa si pente; Naum e Sofonia ne predicono la rovina. La Cronaca babilonese registra come i Medi presero Assur nel 614 a.C. e, con i Babilonesi, Ninive nel 612; l’ultimo re assiro perse Carran nel 610, non riuscì a riprenderla nel 609 e poi scompare dalle fonti, e gli Egizi venuti in suo aiuto furono scacciati da Carchemis nel 605. Isaia guarda tuttavia a un giorno in cui «Israele sarà terzo con l’Egitto e con l’Assiria»."
    - "Le città assire furono riscoperte negli anni 1840 da Botta a Khorsabad e da Layard a Nimrud e Ninive; i loro rilievi e le tavolette della biblioteca di Assurbanipal riempiono il Louvre e il British Museum. Sotto i Parti la terra divenne il regno di Adiabene, la cui casa reale si convertì al giudaismo, e più tardi fu un centro del cristianesimo siriaco. I cristiani assiri dell’Iraq, della Siria e della diaspora portano ancora il nome. Ninive e Nimrud furono gravemente danneggiate dallo Stato Islamico nel 2015–2016."
  pl:
    - "Asyria była krainą nad górnym Tygrysem, w dzisiejszym północnym Iraku, nazwaną od miasta i boga Aszura. Jej serce stanowił trójkąt o boku około 100 km między Aszurem na zachodnim brzegu, Niniwą naprzeciw dzisiejszego Mosulu i Arbelą (Irbil), z Kalach (Nimrud) pomiędzy nimi i Dur-Szarrukin (Khorsabad) tuż na północ od Niniwy. Księga Rodzaju mówi, że Aszur „zbudował Niniwe, i Rechobot miasto, i Chale”. W XX i XIX wieku p.n.e. kupcy asyryjscy mieli faktorię handlową w Kanesz w Anatolii, której tabliczki tworzą najbogatsze archiwum okresu staroasyryjskiego; w XIV wieku Aszur-uballit I uczynił z Asyrii królestwo wśród wielkich mocarstw."
    - "Od IX wieku p.n.e. Asyria zbudowała największe imperium, jakie widział Bliski Wschód. Salmanasar III walczył z Izraelitą Achabem pod Qarqar w 853 r. p.n.e., a jego Czarny Obelisk ukazuje daninę Jehu. Tiglat-Pileser III, Pul z Ksiąg Królewskich, wziął tysiąc talentów srebra od Menachema, a w latach 733–732 p.n.e. uprowadził Gilead i Galileę; Salmanasar V i Sargon II zdobyli Samarię w 722 r. p.n.e., a król asyryjski „przeniósł Izraela do Assyryi”. Sennacheryb zajął obwarowane miasta Judy w 701 r. p.n.e., jak zapisują jego pryzmat i reliefy z Lakisz, lecz Jerozolimę oszczędzono; Księga Królewska opowiada o aniele, który „pobił w obozie Assyryjskim sto ośmdziesiąt i pięć tysięcy”. Asarhaddon i Aszurbanipal, którego bibliotekę znaleziono w Niniwie, podbili Egipt."
    - "Dla proroków Asyria jest narzędziem sądu, które samo zostanie osądzone: „Biada Assurowi, rózdze gniewu mego!” Jonasz zostaje posłany do Niniwy, „miasta tego wielkiego”, i ona czyni pokutę; Nahum i Sofoniasz zapowiadają jej zagładę. Kronika babilońska zapisuje, jak Medowie zdobyli Aszur w 614 r. p.n.e., a wraz z Babilończykami Niniwę w 612; ostatni król asyryjski stracił Charan w 610, nie zdołał go odzyskać w 609 i znika ze źródeł, a Egipcjan, którzy przyszli mu z pomocą, wypędzono z Karkemisz w 605. Izajasz mimo to zapowiada: „Dnia onego będzie Izrael jako trzeci między Egipczanem i Assyryjczykiem”."
    - "Miasta asyryjskie odkryto na nowo w latach 40. XIX wieku: Botta w Khorsabad, Layard w Nimrud i Niniwie; ich reliefy i tabliczki z biblioteki Aszurbanipala wypełniają Luwr i British Museum. Pod Partami kraj stał się królestwem Adiabene, którego dom królewski przeszedł na judaizm, a później ośrodkiem syryjskiego chrześcijaństwa. Asyryjscy chrześcijanie Iraku, Syrii i diaspory wciąż noszą tę nazwę. Niniwa i Nimrud zostały poważnie zniszczone przez Państwo Islamskie w latach 2015–2016."
  nl:
    - "Assyrië was het land aan de bovenloop van de Tigris, in wat nu Noord-Irak is, genoemd naar de stad en god Assur. Zijn kerngebied was een driehoek van zo’n 100 km tussen Assur aan de westoever, Nineve tegenover het huidige Mosul en Arbela (Erbil), met Kalach (Nimrud) ertussen en Dur-Sjarroekin (Khorsabad) net ten noorden van Nineve. Genesis zegt dat Assur “heeft gebouwd Nineve, en Rehoboth, Ir, en Kalach”. In de twintigste en negentiende eeuw v.Chr. hielden Assyrische kooplieden een handelskolonie te Kanesh in Anatolië, wier tabletten het rijkste archief van de Oud-Assyrische tijd vormen; in de veertiende eeuw maakte Assur-uballit I van Assyrië een koninkrijk onder de grote mogendheden."
    - "Vanaf de negende eeuw v.Chr. bouwde Assyrië het grootste rijk dat het Nabije Oosten had gezien. Salmaneser III vocht in 853 v.Chr. bij Qarqar tegen Achab de Israëliet, en zijn Zwarte Obelisk toont Jehu’s schatting. Tiglat-Pileser III, de Pul van Koningen, nam duizend talenten zilver van Menachem en voerde in 733–732 v.Chr. Gilead en Galilea weg; Samaria viel in 722 v.Chr. aan Salmaneser V en Sargon II, en de koning van Assyrië “voerde Israel weg in Assyrië”. Sanherib nam in 701 v.Chr. de vaste steden van Juda in, zoals zijn prisma en de Lachisreliëfs vermelden, maar Jeruzalem werd gespaard; Koningen vertelt van de Engel die “sloeg in het leger van Assyrië honderd vijf en tachtig duizend”. Esarhaddon en Assurbanipal, wiens bibliotheek te Nineve werd gevonden, veroverden Egypte."
    - "Voor de profeten is Assyrië “de roede Mijns toorns”, het werktuig van het oordeel dat zelf geoordeeld zal worden. Jona wordt naar Nineve gezonden, “de grote stad”, en zij bekeert zich; Nahum en Zefanja voorspellen haar ondergang. De Babylonische kroniek vermeldt hoe de Meden Assur in 614 v.Chr. innamen en, met de Babyloniërs, Nineve in 612; de laatste Assyrische koning verloor Haran in 610, slaagde er in 609 niet in het te heroveren en verdwijnt dan uit de bronnen, en de Egyptenaren die hem te hulp waren gekomen, werden in 605 bij Karkemis verdreven. Toch ziet Jesaja een dag komen dat “Israel de derde wezen met de Egyptenaren en met de Assyriers”."
    - "De Assyrische steden werden in de jaren 1840 herontdekt door Botta te Khorsabad en Layard te Nimrud en Nineve; hun reliëfs en de tabletten van Assurbanipals bibliotheek vullen het Louvre en het British Museum. Onder de Parthen werd het land het koninkrijk Adiabene, wiens koningshuis zich tot het jodendom bekeerde, en later werd het een centrum van Syrisch christendom. De Assyrische christenen in Irak, Syrië en de diaspora dragen de naam nog. Nineve en Nimrud werden in 2015–2016 zwaar beschadigd door Islamitische Staat."
  cs:
    - "Asýrie byla země na horním Tigridu, v dnešním severním Iráku, pojmenovaná podle města a boha Ašura. Její jádro tvořil trojúhelník o straně asi 100 km mezi Ašurem na západním břehu, Ninive naproti dnešnímu Mosulu a Arbelou (Erbil), s Kalachem (Nimrud) mezi nimi a Dur-Šarrukinem (Chorsabád) kousek severně od Ninive. Genesis praví, že Aššúr „vystavěl Ninive, a Rohobot město, a Chále“. V 20. a 19. století př. n. l. měli asyrští obchodníci obchodní kolonii v Kaneši v Anatolii, jejíž tabulky tvoří nejbohatší archiv staroasyrského období; ve 14. století učinil Aššúr-uballit I. z Asýrie království mezi velmocemi."
    - "Od 9. století př. n. l. vybudovala Asýrie největší říši, jakou Blízký východ viděl. Salmanasar III. bojoval s Izraelcem Achabem u Qarqaru roku 853 př. n. l. a jeho Černý obelisk ukazuje Jehúův tribut. Tiglatpilesar III., Ful z Knih královských, vzal od Menachema tisíc talentů stříbra a v letech 733–732 př. n. l. odvlekl Gilead a Galileu; Salmanasar V. a Sargon II. dobyli roku 722 př. n. l. Samaří a asyrský král „přenesl Izraele do Assyrie“. Senacherib dobyl v roce 701 př. n. l. opevněná města Judy, jak zaznamenávají jeho hranol a lachišské reliéfy, ale Jeruzalém byl ušetřen; Knihy královské vyprávějí o andělu, který „zbil v vojště Assyrském sto osmdesáte pět tisíců“. Asarhadón a Aššurbanipal, jehož knihovna byla nalezena v Ninive, dobyli Egypt."
    - "Pro proroky je Asýrie „metle hněvu mého“, nástroj soudu, který bude sám souzen. Jonáš je poslán do Ninive, „města toho velikého“, a to činí pokání; Nachum a Sofonjáš předpovídají jeho zkázu. Babylonská kronika zaznamenává, jak Médové dobyli Ašur roku 614 př. n. l. a spolu s Babylóňany Ninive roku 612; poslední asyrský král ztratil v roce 610 Cháran, v roce 609 jej nedokázal znovu dobýt a pak ze záznamu mizí, a Egypťané, kteří mu přišli na pomoc, byli roku 605 vyhnáni z Karkemíše. Izajáš přesto hledí k dni, kdy „bude Izrael Egyptským a Assyrským jako třetí z nich“."
    - "Asyrská města byla znovu objevena ve 40. letech 19. století Bottou v Chorsabádu a Layardem v Nimrudu a Ninive; jejich reliéfy a tabulky Aššurbanipalovy knihovny plní Louvre a Britské muzeum. Za Parthů se země stala královstvím Adiabéné, jehož královský rod přijal judaismus, a později se stala střediskem syrského křesťanství. Asyrští křesťané Iráku, Sýrie a diaspory nesou jméno dosud. Ninive a Nimrud byly v letech 2015–2016 těžce poškozeny Islámským státem."
  sv:
    - "Assyrien var landet vid övre Tigris, i dagens norra Irak, uppkallat efter staden och guden Assur. Dess kärnland var en triangel på omkring 100 km mellan Assur på västra stranden, Nineve mitt emot nuvarande Mosul och Arbela (Erbil), med Kalach (Nimrud) mellan dem och Dur-Sharrukin (Khorsabad) strax norr om Nineve. Första Mosebok säger att Assur byggde Nineve, staden Rehovot och Kalach. På 1900- och 1800-talen f.Kr. hade assyriska köpmän en handelskoloni i Kanesh i Anatolien vars tavlor utgör det rikaste arkivet från den gammalassyriska tiden; på 1300-talet gjorde Assur-uballit I Assyrien till ett kungarike bland de stora makterna."
    - "Från 800-talet f.Kr. byggde Assyrien det största imperium Främre Orienten hade sett. Salmanassar III stred mot israeliten Achav vid Qarqar år 853 f.Kr., och hans Svarta obelisk visar Jehus tribut. Tiglat-Pileser III, Pul i Konungaböckerna, tog tusen talenter silver av Menachem och förde 733–732 f.Kr. bort Gilead och Galileen; Salmanassar V och Sargon II intog Samaria år 722 f.Kr. och ”förde Israel bort till Assyrien”. Sanherib intog Judas befästa städer år 701 f.Kr., som hans prisma och Lakish-reliefen berättar, men Jerusalem skonades; Konungaböckerna berättar om ängeln som ”slog i assyriernas läger ett hundra åttiofem tusen man”. Esarhaddon och Assurbanipal, vars bibliotek hittades i Nineve, erövrade Egypten."
    - "För profeterna är Assyrien ”Assur, min vredes ris”, redskapet för domen som själv ska dömas. Jona sänds till Nineve, ”den stora staden”, och den omvänder sig; Nahum och Sefanja förutsäger dess undergång. Den babyloniska krönikan berättar hur mederna intog Assur år 614 f.Kr. och, med babylonierna, Nineve år 612; den siste assyriske kungen förlorade Harran år 610, misslyckades med att återta det år 609 och försvinner sedan ur källorna, och egyptierna som hade kommit honom till hjälp drevs från Karkemish år 605. Jesaja ser ändå fram mot en dag då det heter: ”På den tiden skall Israel, såsom den tredje i förbundet, stå vid sidan av Egypten och Assyrien.”"
    - "De assyriska städerna återupptäcktes på 1840-talet av Botta vid Khorsabad och Layard vid Nimrud och Nineve; deras reliefer och tavlorna från Assurbanipals bibliotek fyller Louvren och Brittiska museet. Under parterna blev landet kungariket Adiabene, vars kungahus konverterade till judendomen, och senare blev det ett centrum för syrisk kristendom. De assyriska kristna i Irak, Syrien och diasporan bär ännu namnet. Nineve och Nimrud skadades svårt av Islamiska staten 2015–2016."
  nb:
    - "Assyria var landet ved øvre Tigris, i det som nå er Nord-Irak, oppkalt etter byen og guden Assur. Kjerneområdet var en trekant på omkring 100 km mellom Assur på vestbredden, Ninive midt imot dagens Mosul og Arbela (Erbil), med Kalah (Nimrud) imellom og Dur-Sjarrukin (Khorsabad) like nord for Ninive. 1. Mosebok sier at Assur «bygget Ninive og Rehobot-Ir og Kalah». På 2000- og 1900-tallet f.Kr. hadde assyriske kjøpmenn en handelskoloni i Kanesj i Anatolia, hvis tavler utgjør det rikeste arkivet fra gammelassyrisk tid; på 1300-tallet gjorde Assur-uballit I Assyria til et kongedømme blant stormaktene."
    - "Fra 800-tallet f.Kr. bygde Assyria det største riket Midtøsten hadde sett. Salmanassar III kjempet mot israelitten Akab ved Qarqar i 853 f.Kr., og hans Svarte obelisk viser Jehus tributt. Tiglat-Pileser III, Pul i Kongebøkene, tok tusen talenter sølv fra Menahem og førte i 733–732 f.Kr. bort Gilead og Galilea; Salmanassar V og Sargon II inntok Samaria i 722 f.Kr. og «bortførte Israel til Assyria». Sankerib inntok Judas befestede byer i 701 f.Kr., slik prismet hans og Lakisj-relieffene forteller, men Jerusalem ble spart; Kongebøkene forteller om engelen som «slo hundre og fem og åtti tusen mann i assyrernes leir». Asarhaddon og Assurbanipal, hvis bibliotek ble funnet i Ninive, erobret Egypt."
    - "For profetene er Assyria «Assur, min vredes ris», dommens redskap som selv skal dømmes. Jona blir sendt til Ninive, «den store stad», og den omvender seg; Nahum og Sefanja forutsier dens undergang. Den babylonske krøniken forteller hvordan mederne tok Assur i 614 f.Kr. og, sammen med babylonerne, Ninive i 612; den siste assyriske kongen mistet Harran i 610, mislyktes i å ta den tilbake i 609 og forsvinner så fra kildene, og egypterne som hadde kommet ham til hjelp, ble drevet fra Karkemisj i 605. Likevel ser Jesaja fram til en dag da «Israel være den tredje med Egypten og med Assyria»."
    - "De assyriske byene ble gjenoppdaget på 1840-tallet av Botta ved Khorsabad og Layard ved Nimrud og Ninive; relieffene deres og tavlene fra Assurbanipals bibliotek fyller Louvre og British Museum. Under partherne ble landet kongedømmet Adiabene, hvis kongehus gikk over til jødedommen, og senere ble det et sentrum for syrisk kristendom. De assyriske kristne i Irak, Syria og diasporaen bærer fortsatt navnet. Ninive og Nimrud ble hardt skadet av Den islamske stat i 2015–2016."
  tl:
    - "Ang Asiria ay ang lupain sa itaas na Tigris, sa ngayo'y hilagang Iraq, na ipinangalan sa lungsod at diyos na si Ashur. Ang ubod nito ay tatsulok na mga 100 km sa pagitan ng Ashur sa kanlurang pampang, Ninive katapat ng makabagong Mosul at Arbela (Erbil), na ang Calah (Nimrud) sa pagitan nila at ang Dur-Sharrukin (Khorsabad) sa hilaga lamang ng Ninive. Sinasabi ng Genesis na, mula sa lupaing iyon, “napasa Asiria at itinayo ang Ninive, at ang Rehobotir, at ang Calah”. Noong ika-20 at ika-19 na siglo BK, may kolonyang pangkalakal ang mga mangangalakal na Asirio sa Kanesh sa Anatolia na ang mga tableta ay bumubuo sa pinakamayamang arkibo ng panahong Lumang Asirio; noong ika-14 na siglo, ginawa ni Ashur-uballit I ang Asiria na kaharian sa gitna ng mga dakilang kapangyarihan."
    - "Mula ika-9 na siglo BK, itinayo ng Asiria ang pinakamalaking imperyong nakita ng Malapit na Silangan. Nakipaglaban si Salmanasar III kay Achab na Israelita sa Qarqar noong 853 BK, at ipinapakita ng kaniyang Itim na Obelisko ang tributo ni Jehu. Si Tiglath-pileser III, ang Phul ng Mga Hari, ay kumuha ng isang libong talentong pilak kay Manahem at noong 733–732 BK ay dinala ang Gilead at Galilea; sinakop nina Salmanasar V at Sargon II ang Samaria noong 722 BK at “dinala ang Israel sa Asiria”. Sinakop ni Sennacherib ang mga nakukutaang lungsod ng Juda noong 701 BK, ayon sa kaniyang prisma at mga relyebe ng Lachis, ngunit naligtas ang Jerusalem; isinasalaysay ng Mga Hari ang anghel na “nanakit sa kampamento ng mga taga Asiria ng isang daan at walong pu't limang libo”. Sinakop nina Esar-hadon at Ashurbanipal, na ang aklatan ay natagpuan sa Ninive, ang Egipto."
    - "Para sa mga propeta, ang Asiria ang “pamalo ng aking galit”, ang kasangkapan ng paghatol na hahatulan din. Isinugo si Jonas sa Ninive, “malaking bayang yaon”, at nagsisi ito; inihula nina Nahum at Zefanias ang pagkawasak nito. Itinatala ng Kronikang Babilonyo kung paano sinakop ng mga Medo ang Ashur noong 614 BK at, kasama ng mga Babilonyo, ang Ninive noong 612; nawala sa huling haring Asirio ang Harran noong 610, nabigong bawiin ito noong 609 at pagkatapos ay naglaho sa talaan, at ang mga Egipcio na tumulong sa kaniya ay itinaboy mula Carchemis noong 605. Gayunman, tumitingin si Isaias sa araw na “magiging pangatlo ang Israel sa Egipto at sa Asiria”."
    - "Natuklasan muli ang mga lungsod na Asirio noong dekada 1840 ni Botta sa Khorsabad at ni Layard sa Nimrud at Ninive; pinupuno ng kanilang mga relyebe at ng mga tableta ng aklatan ni Ashurbanipal ang Louvre at ang British Museum. Sa ilalim ng mga Parto, naging kaharian ng Adiabene ang lupain, na ang maharlikang sambahayan ay nagbalik-loob sa Judaismo, at kalaunan ay naging sentro ng Kristiyanismong Siriaco. Taglay pa rin ng mga Kristiyanong Asirio ng Iraq, Siria at diaspora ang pangalan. Lubhang napinsala ng Islamic State ang Ninive at Nimrud noong 2015–2016."
  da:
    - "Assyrien var landet ved øvre Tigris, i det nuværende nordlige Irak, opkaldt efter byen og guden Assur. Dets kerneland var en trekant på omkring 100 km mellem Assur på vestbredden, Nineve over for nutidens Mosul og Arbela (Erbil), med Kala (Nimrud) imellem og Dur-Sharrukin (Khorsabad) lige nord for Nineve. Første Mosebog fortæller om Sinear: »Fra dette Land drog han ud til Assur, og han byggede Ninive og Rekoboth-Ir og Kala« (i King James Version er det Assur, der bygger Nineve). I 2000- og 1900-tallet f.Kr. holdt assyriske købmænd en handelskoloni ved Kanesh i Anatolien, hvis tavler udgør det rigeste arkiv fra gammelassyrisk tid; i 1300-tallet gjorde Assur-uballit 1. Assyrien til et kongerige blandt stormagterne."
    - "Fra 800-tallet f.Kr. byggede Assyrien det største rige, Mellemøsten hidtil havde set. Salmanassar 3. kæmpede mod israelitten Akab ved Qarqar i 853 f.Kr., og hans Sorte Obelisk viser Jehus tribut. Tiglat-Pileser 3., Ful i Kongebøgerne, tog tusind talenter sølv af Menahem og bortførte i 733–732 f.Kr. Gilead og Galilæa; Salmanassar 5. og Sargon 2. indtog Samaria i 722 f.Kr. og »førte Israel bort til Assyrien«. Sankerib indtog Judas befæstede byer i 701 f.Kr., som hans prisme og Lakisj-relieferne beretter, men Jerusalem blev skånet; Kongebøgerne fortæller om engelen, der »slog i Assyrernes Lejr Hundrede og fem og firsindstyve Tusinde«. Esarhaddon og Assurbanipal, hvis bibliotek blev fundet i Nineve, erobrede Egypten."
    - "For profeterne er Assyrien »Assur, min Vredes Ris«, dommens redskab, der selv skal dømmes. Jonas sendes til Nineve, »den store Stad«, og den omvender sig; Nahum og Sefanja forudsiger dens undergang. Den babyloniske krønike beretter, hvordan mederne indtog Assur i 614 f.Kr. og, sammen med babylonierne, Nineve i 612; den sidste assyriske konge mistede Karan i 610, forsøgte forgæves at generobre den i 609 og forsvinder så fra kilderne, og egypterne, der var kommet ham til hjælp, blev drevet fra Karkemisj i 605. Esajas ser alligevel frem til en dag, om hvilken der står: »Paa denne Dag skal Israel være selv tredje med Ægypterne og Assyrerne«."
    - "De assyriske byer blev genopdaget i 1840'erne af Botta ved Khorsabad og Layard ved Nimrud og Nineve; deres relieffer og tavlerne fra Assurbanipals bibliotek fylder Louvre og British Museum. Under partherne blev landet til kongeriget Adiabene, hvis kongehus konverterede til jødedommen, og senere blev det et centrum for syrisk kristendom. De assyriske kristne i Irak, Syrien og diasporaen bærer stadig navnet. Nineve og Nimrud blev groft ødelagt af Islamisk Stat i 2015–2016."
