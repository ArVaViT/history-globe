# Overview article (ADR 0007). Mainstream facts only; Assyrian dates follow the eponym chronology, earlier Mesopotamian dates the middle chronology.
id: assyria
place: a3d1321
title:
  en: "Assyria"
  ru: "Ассирия"
  uk: "Ассирія"
  es: "Asiria"
  pt: "Assíria"
  de: "Assyrien"
  fr: "Assyrie"
body:
  en:
    - 'Assyria was the land on the upper Tigris, in what is now northern Iraq, named after the city and god Ashur. Its heartland was a triangle of some 100 km between Ashur on the west bank, Nineveh opposite modern Mosul and Arbela (Erbil), with Calah (Nimrud) and Dur-Sharrukin (Khorsabad) between them. Genesis says that Asshur "builded Nineveh, and the city Rehoboth, and Calah". In the twentieth and nineteenth centuries BC Assyrian merchants kept a trading colony at Kanesh in Anatolia whose tablets form the richest archive of the Old Assyrian period; in the fourteenth century Ashur-uballit I made Assyria a kingdom among the great powers.'
    - 'From the ninth century BC Assyria built the largest empire the Near East had seen. Shalmaneser III fought Ahab the Israelite at Qarqar in 853 BC, and his Black Obelisk shows the tribute of Jehu. Tiglath-pileser III, the Pul of Kings, took a thousand talents of silver from Menahem and in 733–732 BC carried off Gilead and Galilee; Shalmaneser V and Sargon II took Samaria in 722 BC and "carried Israel away into Assyria". Sennacherib took the fortified cities of Judah in 701 BC, as his prism and the Lachish reliefs record, but Jerusalem was spared; Kings tells of the angel who "smote in the camp of the Assyrians an hundred fourscore and five thousand". Esarhaddon and Ashurbanipal, whose library was found at Nineveh, conquered Egypt.'
    - 'For the prophets Assyria is "the rod of mine anger", the instrument of judgement that will itself be judged. Jonah is sent to Nineveh, "that great city", and it repents; Nahum and Zephaniah foretell its ruin. The Babylonian Chronicle records how the Medes and Babylonians took Ashur in 614 BC and Nineveh in 612; the last Assyrian king lost Harran in 610, failed to retake it in 609 and then vanishes from the record, and the Egyptians who had come to his aid were driven from Carchemish in 605. Isaiah nevertheless looks to a day when "Israel be the third with Egypt and with Assyria".'
    - "The Assyrian cities were rediscovered in the 1840s by Botta at Khorsabad and Layard at Nimrud and Nineveh; their reliefs and the tablets of Ashurbanipal's library fill the Louvre and the British Museum. Under the Parthians the land became the kingdom of Adiabene, whose royal house converted to Judaism, and later it became a centre of Syriac Christianity. The Assyrian Christians of Iraq, Syria and the diaspora still bear the name. Nineveh and Nimrud were badly damaged by the Islamic State in 2015–2016."
  ru:
    - "Ассирия — страна на верхнем Тигре, на севере нынешнего Ирака, названная по городу и богу Ашшуру. Её сердцевиной был треугольник со стороной около 100 км между Ассуром на западном берегу, Ниневией напротив нынешнего Мосула и Арбелой (Эрбилем), с Калахом (Нимрудом) и Дур-Шаррукином (Хорсабадом) между ними. Книга Бытия говорит, что Ассур «построил Ниневию, Реховоф-ир, Калах». В XX–XIX веках до н. э. ассирийские купцы держали торговую колонию в Канише в Анатолии, таблички которой — богатейший архив староассирийской эпохи; в XIV веке Ашшур-убаллит I сделал Ассирию царством в ряду великих держав."
    - "С IX века до н. э. Ассирия построила самую большую державу, какую знал Ближний Восток. Салманассар III сражался с Ахавом Израильтянином при Каркаре в 853 г. до н. э., а его Чёрный обелиск показывает дань Ииуя. Феглаффелласар III, Фул книг Царств, взял у Менаима тысячу талантов серебра, а в 733–732 гг. до н. э. увёл в плен Галаад и Галилею; Салманассар V и Саргон II взяли Самарию в 722 г. до н. э. и переселили «Израильтян в Ассирию». Сеннахирим в 701 г. до н. э. взял укреплённые города Иудеи, о чём говорят его призма и рельефы из Лахиса, но Иерусалим уцелел; книги Царств рассказывают об Ангеле, который «поразил в стане Ассирийском сто восемьдесят пять тысяч». Асардан и Ашшурбанапал, чья библиотека найдена в Ниневии, завоевали Египет."
    - "Для пророков Ассирия — «жезл гнева Моего», орудие суда, которое само будет судимо. Иона послан в Ниневию, «город великий», и она кается; Наум и Софония предрекают её гибель. Вавилонская хроника сообщает, как Мидяне и Вавилоняне взяли Ассур в 614 г. до н. э. и Ниневию в 612 г.; последний ассирийский царь потерял Харран в 610 г., не смог отбить его в 609 г. и затем исчезает из записей, а Египтяне, пришедшие ему на помощь, были выбиты из Кархемиса в 605 г. И всё же Исаия ждёт дня, когда «Израиль будет третьим с Египтом и Ассириею»."
    - "Ассирийские города заново открыли в 1840-х годах Ботта в Хорсабаде и Лэйард в Нимруде и Ниневии; их рельефы и таблички библиотеки Ашшурбанапала наполняют Лувр и Британский музей. При Парфянах эта земля стала царством Адиабеной, чей царский дом принял иудаизм, а позже стала средоточием сирийского христианства. Ассирийцы-христиане Ирака, Сирии и рассеяния до сих пор носят это имя. Ниневия и Нимруд сильно пострадали от «Исламского государства» в 2015–2016 годах."
  uk:
    - "Ассирія була краєм на верхньому Тигрі, на території нинішнього північного Іраку, названим за містом і богом Ашшуром. Її осердям був трикутник близько 100 км між Ашшуром на західному березі, Ніневією навпроти сучасного Мосула та Арбелою (Ербіль), з Калахом (Німруд) та Дур-Шаррукіном (Хорсабад) між ними. Буття каже, що Ассур «збудовав Ниневу і Регобод-Ір, і Калаг». У XX–XIX століттях до н. е. ассирійські купці мали торговельну колонію в Каніші в Анатолії, чиї таблички утворюють найбагатший архів староассирійського періоду; у XIV столітті Ашшур-убалліт I зробив Ассирію царством серед великих держав."
    - "Від IX століття до н. е. Ассирія побудувала найбільшу імперію, яку бачив Близький Схід. Салманассар III воював проти ізраїльтянина Ахава при Каркарі в 853 р. до н. е., а його Чорний обеліск показує данину Єгу. Тіглатпаласар III, Фул з книг Царів, узяв тисячу талантів срібла від Менаїма і в 733–732 рр. до н. е. забрав Гілеад і Галілею; Салманассар V і Саргон II взяли Самарію в 722 р. до н. е. і «одвів Ізрайлитян полонянами в Ассирию». Сінаххеріб узяв укріплені міста Юди в 701 р. до н. е., як записують його призма й лахішські рельєфи, але Єрусалим пощадили; книги Царів розповідають про ангела, що «положив трупом ув Ассирийському таборі сто вісїмдесять і пять тисяч». Асархаддон та Ашшурбаніпал, чию бібліотеку знайдено в Ніневії, завоювали Єгипет."
    - "Для пророків Ассирія — «палиця мого гнїву», знаряддя суду, яке саме буде судити. Йону посилають до Ніневії, у «город великий», і вона розкається; Наум і Софонія провіщають її руїну. Вавилонська хроніка записує, як мідяни та вавилоняни взяли Ашшур у 614 р. до н. е. і Ніневію в 612-му; останній ассирійський цар втратив Харан у 610-му, не зміг повернути його в 609-му і далі зникає із записів, а єгиптян, що прийшли йому на допомогу, прогнали з Каркемиша у 605-му. Проте Ісая дивиться на день, коли «буде Ізраїль третим із Египтом і Ассириєю»."
    - "Ассирійські міста заново відкрили в 1840-х роках Ботта в Хорсабаді та Лейярд у Німруді й Ніневії; їхні рельєфи та таблички бібліотеки Ашшурбаніпала наповнюють Лувр і Британський музей. За парфян край став царством Адіабена, чий царський дім навернувся до юдаїзму, а згодом став осередком сирійського християнства. Ассирійські християни Іраку, Сирії та діаспори й досі носять це ім'я. Ніневію і Німруд сильно пошкодила «Ісламська держава» в 2015–2016 роках."
  es:
    - "Asiria era la tierra del alto Tigris, en lo que hoy es el norte de Irak, que tomó el nombre de la ciudad y dios Asur. Su corazón era un triángulo de unos 100 km entre Asur, en la orilla occidental, Nínive, frente a la actual Mosul, y Arbela (Erbil), con Cala (Nimrud) y Dur-Sharrukin (Jorsabad) entre ellas. El Génesis dice que Asur «edificó á Nínive, y á Rehoboth, y á Calah». En los siglos XX y XIX a. C. los mercaderes asirios mantuvieron una colonia comercial en Kanesh, en Anatolia, cuyas tablillas forman el más rico archivo del período paleoasirio; en el siglo XIV Asur-uballit I hizo de Asiria un reino entre las grandes potencias."
    - "Desde el siglo IX a. C. Asiria construyó el mayor imperio que había visto el Próximo Oriente. Salmanasar III combatió a Acab el israelita en Qarqar en 853 a. C., y su Obelisco Negro muestra el tributo de Jehú. Tiglat-pileser III, el Phul de Reyes, tomó mil talentos de plata a Manahem y en 733–732 a. C. se llevó Galaad y Galilea; Salmanasar V y Sargón II tomaron Samaria en 722 a. C. y «trasportó á Israel á Asiria». Senaquerib tomó las ciudades fortificadas de Judá en 701 a. C., como registran su prisma y los relieves de Laquis, pero Jerusalén se salvó; Reyes habla del ángel que «hirió en el campo de los Asirios ciento ochenta y cinco mil». Esar-hadón y Asurbanipal, cuya biblioteca fue hallada en Nínive, conquistaron Egipto."
    - "Para los profetas Asiria es «vara y bastón de mi furor», el instrumento de juicio que será a su vez juzgado. Jonás es enviado a Nínive, «ciudad grande», y esta se arrepiente; Nahum y Sofonías predicen su ruina. La Crónica babilónica registra cómo medos y babilonios tomaron Asur en 614 a. C. y Nínive en 612; el último rey asirio perdió Harán en 610, no logró recuperarla en 609 y luego desaparece del registro, y los egipcios que habían acudido en su ayuda fueron expulsados de Carquemis en 605. Isaías mira, sin embargo, a un día en que «Israel será tercero con Egipto y con Asiria»."
    - "Las ciudades asirias fueron redescubiertas en la década de 1840 por Botta en Jorsabad y Layard en Nimrud y Nínive; sus relieves y las tablillas de la biblioteca de Asurbanipal llenan el Louvre y el Museo Británico. Bajo los partos la tierra se convirtió en el reino de Adiabene, cuya casa real se convirtió al judaísmo, y más tarde fue un centro del cristianismo siríaco. Los cristianos asirios de Irak, Siria y la diáspora aún llevan el nombre. Nínive y Nimrud fueron gravemente dañadas por el Estado Islámico en 2015–2016."
  pt:
    - "A Assíria era a terra do alto Tigre, no atual norte do Iraque, que recebeu o nome da cidade e do deus Assur. Seu coração era um triângulo de cerca de 100 km entre Assur, na margem oeste, Nínive, defronte da atual Mossul, e Arbela (Erbil), com Calá (Nimrud) e Dur-Sharrukin (Khorsabad) entre elas. Gênesis diz que Assur “edificou Nínive, Reobote-Ir, Calá”. Nos séculos XX e XIX a.C., mercadores assírios mantinham uma colônia comercial em Kanesh, na Anatólia, cujas tabuinhas formam o mais rico arquivo do período paleoassírio; no século XIV, Assur-uballit I fez da Assíria um reino entre as grandes potências."
    - "A partir do século IX a.C. a Assíria construiu o maior império que o Oriente Próximo vira. Salmaneser III combateu Acabe, o israelita, em Qarqar em 853 a.C., e seu Obelisco Negro mostra o tributo de Jeú. Tiglate-Pileser III, o Pul de Reis, tomou mil talentos de prata de Menaém e em 733–732 a.C. levou Gileade e a Galileia; Salmaneser V e Sargão II tomaram Samaria em 722 a.C., e o rei assírio “levou Israel cativo para a Assíria”. Senaqueribe tomou as cidades fortificadas de Judá em 701 a.C., como registram seu prisma e os relevos de Laquis, mas Jerusalém foi poupada; Reis conta do anjo que “feriu cento e oitenta e cinco mil no acampamento dos assírios”. Esar-Hadom e Assurbanípal, cuja biblioteca foi achada em Nínive, conquistaram o Egito."
    - "Para os profetas a Assíria é “a vara da minha ira”, o instrumento de juízo que será ele mesmo julgado. Jonas é enviado a Nínive, “a grande cidade”, e ela se arrepende; Naum e Sofonias predizem a sua ruína. A Crônica Babilônica registra como medos e babilônios tomaram Assur em 614 a.C. e Nínive em 612; o último rei assírio perdeu Harã em 610, não conseguiu retomá-la em 609 e depois some dos registros, e os egípcios que tinham vindo em seu auxílio foram expulsos de Carquemis em 605. Isaías, contudo, olha para um dia em que “Israel será o terceiro com o Egito e com a Assíria”."
    - "As cidades assírias foram redescobertas na década de 1840 por Botta em Khorsabad e por Layard em Nimrud e Nínive; seus relevos e as tabuinhas da biblioteca de Assurbanípal enchem o Louvre e o Museu Britânico. Sob os partas a terra tornou-se o reino de Adiabene, cuja casa real se converteu ao judaísmo, e mais tarde tornou-se um centro do cristianismo siríaco. Os cristãos assírios do Iraque, da Síria e da diáspora ainda levam o nome. Nínive e Nimrud foram gravemente danificadas pelo Estado Islâmico em 2015–2016."
  de:
    - "Assyrien war das Land am oberen Tigris im heutigen Nordirak, benannt nach der Stadt und dem Gott Aschschur. Sein Kernland war ein Dreieck von etwa 100 km zwischen Assur am Westufer, Ninive gegenüber dem heutigen Mossul und Arbela (Erbil), mit Kalach (Nimrud) und Dur-Scharrukin (Chorsabad) dazwischen. Das erste Buch Mose sagt: „Von dem Land ist er gekommen nach Assur und baute Ninive und Rehoboth-Ir und Kalah“ (so Luther; nach der King-James-Bibel baute Assur selbst diese Städte). Im 20. und 19. Jahrhundert v. Chr. unterhielten assyrische Kaufleute eine Handelskolonie in Kanesch in Anatolien, deren Tafeln das reichste Archiv der altassyrischen Zeit bilden; im 14. Jahrhundert machte Aschschur-uballit I. Assyrien zu einem Königreich unter den Großmächten."
    - "Vom 9. Jahrhundert v. Chr. an baute Assyrien das größte Reich, das der Vordere Orient gesehen hatte. Salmanassar III. kämpfte 853 v. Chr. bei Qarqar gegen Ahab den Israeliten, und sein Schwarzer Obelisk zeigt den Tribut Jehus. Tiglat-Pileser III., der Pul der Königsbücher, nahm von Menahem tausend Talente Silber und führte 733–732 v. Chr. Gilead und Galiläa fort; Salmanassar V. und Sargon II. nahmen 722 v. Chr. Samaria ein und „führten Israel weg nach Assyrien“. Sanherib nahm 701 v. Chr. die festen Städte Judas ein, wie sein Prisma und die Lachisch-Reliefs bezeugen, doch Jerusalem blieb verschont; die Königsbücher erzählen vom Engel, der „im Lager von Assyrien hundertfünfundachtzigtausend Mann“ schlug. Asarhaddon und Assurbanipal, dessen Bibliothek in Ninive gefunden wurde, eroberten Ägypten."
    - "Den Propheten ist Assyrien „meines Zornes Rute“, das Werkzeug des Gerichts, das selbst gerichtet werden wird. Jona wird nach Ninive gesandt, „die große Stadt“, und sie bekehrt sich; Nahum und Zefanja sagen ihren Untergang voraus. Die Babylonische Chronik verzeichnet, wie Meder und Babylonier 614 v. Chr. Assur und 612 Ninive einnahmen; der letzte assyrische König verlor 610 Haran, scheiterte 609 bei dessen Rückeroberung und verschwindet dann aus den Quellen, und die Ägypter, die ihm zu Hilfe gekommen waren, wurden 605 aus Karkemisch vertrieben. Dennoch schaut Jesaja auf einen Tag, an dem „Israel selbdritt sein wird mit den Ägyptern und Assyrern“."
    - "Die assyrischen Städte wurden in den 1840er Jahren wiederentdeckt, von Botta in Chorsabad und Layard in Nimrud und Ninive; ihre Reliefs und die Tafeln der Bibliothek Assurbanipals füllen den Louvre und das Britische Museum. Unter den Parthern wurde das Land das Königreich Adiabene, dessen Königshaus zum Judentum übertrat, und später ein Zentrum des syrischen Christentums. Die assyrischen Christen im Irak, in Syrien und in der Diaspora tragen den Namen noch heute. Ninive und Nimrud wurden 2015–2016 vom Islamischen Staat schwer beschädigt."
  fr:
    - "L’Assyrie était le pays du haut Tigre, dans l’actuel nord de l’Irak, nommé d’après la ville et le dieu Ashur. Son cœur était un triangle d’environ 100 km entre Ashur sur la rive ouest, Ninive en face de l’actuelle Mossoul et Arbèles (Erbil), avec Calach (Nimroud) et Dur-Sharrukin (Khorsabad) entre elles. La Genèse dit qu’Assur « bâtit Ninive, Rehoboth Hir, Calach ». Aux XXe et XIXe siècles av. J.-C., des marchands assyriens tenaient un comptoir à Kanesh en Anatolie dont les tablettes forment la plus riche archive de la période paléo-assyrienne ; au XIVe siècle, Assour-uballit Ier fit de l’Assyrie un royaume parmi les grandes puissances."
    - "Dès le IXe siècle av. J.-C., l’Assyrie bâtit le plus vaste empire que le Proche-Orient eût connu. Salmanasar III combattit Achab l’Israélite à Qarqar en 853 av. J.-C., et son obélisque noir montre le tribut de Jéhu. Tiglath-Piléser III, le Pul des Rois, prit mille talents d’argent à Menahem et en 733-732 av. J.-C. emmena Galaad et la Galilée ; Salmanasar V et Sargon II prirent Samarie en 722 av. J.-C. : le roi d’Assyrie « emmena Israël captif en Assyrie ». Sanchérib prit les villes fortes de Juda en 701 av. J.-C., comme le consignent son prisme et les reliefs de Lakis, mais Jérusalem fut épargnée ; les Rois racontent l’ange qui « frappa dans le camp des Assyriens cent quatre-vingt-cinq mille hommes ». Esar-Haddon et Assurbanipal, dont la bibliothèque fut trouvée à Ninive, conquirent l’Égypte."
    - "Pour les prophètes, l’Assyrie est la « verge de ma colère », instrument du jugement qui sera jugé à son tour. Jonas est envoyé à Ninive, « la grande ville », et elle se repent ; Nahum et Sophonie annoncent sa ruine. La Chronique babylonienne note comment Mèdes et Babyloniens prirent Ashur en 614 av. J.-C. et Ninive en 612 ; le dernier roi assyrien perdit Haran en 610, échoua à la reprendre en 609 puis disparaît des sources, et les Égyptiens venus à son aide furent chassés de Carkemisch en 605. Ésaïe regarde pourtant vers un jour où « Israël sera, lui troisième, uni à l’Égypte et à l’Assyrie »."
    - "Les villes assyriennes furent redécouvertes dans les années 1840 par Botta à Khorsabad et Layard à Nimroud et Ninive ; leurs reliefs et les tablettes de la bibliothèque d’Assurbanipal remplissent le Louvre et le British Museum. Sous les Parthes, le pays devint le royaume d’Adiabène, dont la maison royale se convertit au judaïsme, et il devint plus tard un centre du christianisme syriaque. Les chrétiens assyriens d’Irak, de Syrie et de la diaspora portent encore ce nom. Ninive et Nimroud furent gravement endommagées par l’État islamique en 2015-2016."
