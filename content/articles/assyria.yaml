# Overview article (ADR 0007). Mainstream facts only; Assyrian dates follow the eponym chronology, earlier Mesopotamian dates the middle chronology.
id: assyria
place: a3d1321
title:
  en: "Assyria"
  ru: "Ассирия"
body:
  en:
    - 'Assyria was the land on the upper Tigris, in what is now northern Iraq, named after the city and god Ashur. Its heartland was a triangle of some 100 km between Ashur on the west bank, Nineveh opposite modern Mosul and Arbela (Erbil), with Calah (Nimrud) and Dur-Sharrukin (Khorsabad) between them. Genesis says that Asshur "builded Nineveh, and the city Rehoboth, and Calah". In the twentieth and nineteenth centuries BC Assyrian merchants kept a trading colony at Kanesh in Anatolia whose tablets form the richest archive of the Old Assyrian period; in the fourteenth century Ashur-uballit I made Assyria a kingdom among the great powers.'
    - 'From the ninth century BC Assyria built the largest empire the Near East had seen. Shalmaneser III fought Ahab the Israelite at Qarqar in 853 BC, and his Black Obelisk shows the tribute of Jehu. Tiglath-pileser III, the Pul of Kings, took a thousand talents of silver from Menahem and in 733–732 BC carried off Gilead and Galilee; Shalmaneser V and Sargon II took Samaria in 722 BC and "carried Israel away into Assyria". Sennacherib took the fortified cities of Judah in 701 BC, as his prism and the Lachish reliefs record, but Jerusalem was spared; Kings tells of the angel who "smote in the camp of the Assyrians an hundred fourscore and five thousand". Esarhaddon and Ashurbanipal, whose library was found at Nineveh, conquered Egypt.'
    - 'For the prophets Assyria is "the rod of mine anger", the instrument of judgement that will itself be judged. Jonah is sent to Nineveh, "that great city", and it repents; Nahum and Zephaniah foretell its ruin. The Babylonian Chronicle records how the Medes and Babylonians took Ashur in 614 BC and Nineveh in 612; the last Assyrian king lost Harran in 610, failed to retake it in 609 and then vanishes from the record, and the Egyptians who had come to his aid were driven from Carchemish in 605. Isaiah nevertheless looks to a day when "Israel be the third with Egypt and with Assyria".'
    - "The Assyrian cities were rediscovered in the 1840s by Botta at Khorsabad and Layard at Nimrud and Nineveh; their reliefs and the tablets of Ashurbanipal's library fill the Louvre and the British Museum. Under the Parthians the land became the kingdom of Adiabene, whose royal house converted to Judaism, and later it became a centre of Syriac Christianity. The Assyrian Christians of Iraq, Syria and the diaspora still bear the name. Nineveh and Nimrud were badly damaged by the Islamic State in 2015–2016."
  ru:
    - "Ассирия — страна на верхнем Тигре, на севере нынешнего Ирака, названная по городу и богу Ашшуру. Её сердцевиной был треугольник со стороной около 100 км между Ассуром на западном берегу, Ниневией напротив нынешнего Мосула и Арбелой (Эрбилем), с Калахом (Нимрудом) и Дур-Шаррукином (Хорсабадом) между ними. Книга Бытия говорит, что Ассур «построил Ниневию, Реховоф-ир, Калах». В XX–XIX веках до н. э. ассирийские купцы держали торговую колонию в Канише в Анатолии, таблички которой — богатейший архив староассирийской эпохи; в XIV веке Ашшур-убаллит I сделал Ассирию царством в ряду великих держав."
    - "С IX века до н. э. Ассирия построила самую большую державу, какую знал Ближний Восток. Салманассар III сражался с Ахавом Израильтянином при Каркаре в 853 г. до н. э., а его Чёрный обелиск показывает дань Ииуя. Феглаффелласар III, Фул книг Царств, взял у Менаима тысячу талантов серебра, а в 733–732 гг. до н. э. увёл в плен Галаад и Галилею; Салманассар V и Саргон II взяли Самарию в 722 г. до н. э. и переселили «Израильтян в Ассирию». Сеннахирим в 701 г. до н. э. взял укреплённые города Иудеи, о чём говорят его призма и рельефы из Лахиса, но Иерусалим уцелел; книги Царств рассказывают об Ангеле, который «поразил в стане Ассирийском сто восемьдесят пять тысяч». Асардан и Ашшурбанапал, чья библиотека найдена в Ниневии, завоевали Египет."
    - "Для пророков Ассирия — «жезл гнева Моего», орудие суда, которое само будет судимо. Иона послан в Ниневию, «город великий», и она кается; Наум и Софония предрекают её гибель. Вавилонская хроника сообщает, как Мидяне и Вавилоняне взяли Ассур в 614 г. до н. э. и Ниневию в 612 г.; последний ассирийский царь потерял Харран в 610 г., не смог отбить его в 609 г. и затем исчезает из записей, а Египтяне, пришедшие ему на помощь, были выбиты из Кархемиса в 605 г. И всё же Исаия ждёт дня, когда «Израиль будет третьим с Египтом и Ассириею»."
    - "Ассирийские города заново открыли в 1840-х годах Ботта в Хорсабаде и Лэйард в Нимруде и Ниневии; их рельефы и таблички библиотеки Ашшурбанапала наполняют Лувр и Британский музей. При Парфянах эта земля стала царством Адиабеной, чей царский дом принял иудаизм, а позже стала средоточием сирийского христианства. Ассирийцы-христиане Ирака, Сирии и рассеяния до сих пор носят это имя. Ниневия и Нимруд сильно пострадали от «Исламского государства» в 2015–2016 годах."
