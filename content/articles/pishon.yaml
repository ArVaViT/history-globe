# Overview article (ADR 0007). The Pishon, a river of Eden, is unidentified; Josephus (Ganges), Rashi (Nile), Keil (the Cyrus, i.e. the Kura, after setting aside Reland's Phasis) and Sauer / El-Baz (Wadi al-Batin) are shown without choosing. The map's point in south-western Arabia is a placeholder for Havilah's gold country.
