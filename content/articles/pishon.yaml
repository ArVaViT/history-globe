body:
  en:
    - "The Pishon is the first of the four heads into which the river that watered Eden divided: “The name of the first is Pison: that is it which compasseth the whole land of Havilah, where there is gold; And the gold of that land is good: there is bdellium and the onyx stone.” Unlike the Tigris and the Euphrates, it is named nowhere else in the Hebrew Bible (Sirach 24:25 mentions it only in passing), and it has never been identified; the map's point in western Arabia stands only for one of the proposals that seek Havilah's gold country there."
    - "Ancient and modern readers have looked for it far apart. Josephus identified the Pishon with the Ganges, and Rashi with the Nile; C. F. Keil set aside Reland's Phasis and thought it more probably the Cyrus (the Kura), which rises in Armenia and flows to the Caspian Sea. In 1996 James A. Sauer, formerly curator at the Harvard Semitic Museum, proposed a now-dry river of Arabia, the channel of the Wadi al-Rummah and the Wadi al-Batin, which runs from the Hijaz mountains near Medina north-east to Kuwait and which Farouk El-Baz of Boston University had traced on satellite images; in this view the ancient gold mine of Mahd adh-Dhahab near its upper course answers to the gold of Havilah."
  ru:
    - "Фисон — первая из четырёх рек, на которые разделялась река, орошавшая Эдем: «Имя одной Фисон: она обтекает всю землю Хавила, ту, где золото; и золото той земли хорошее; там бдолах и камень оникс». В отличие от Тигра и Евфрата, он больше нигде в еврейской Библии не назван (Книга Сираха, 24:27, лишь мимоходом упоминает его) и никогда не был отождествлён; точка на карте в Западной Аравии обозначает лишь одно из предположений, ищущих там золотую землю Хавилу."
    - "Древние и новые читатели искали его далеко друг от друга. Иосиф Флавий отождествлял Фисон с Гангом, Раши — с Нилом; К. Ф. Кейль отверг Фасис, предложенный Реландом, и считал более вероятным Кир (Куру), который берёт начало в Армении и впадает в Каспийское море. В 1996 г. Джеймс А. Сауэр, бывший хранитель Семитского музея Гарварда, предложил ныне высохшую реку Аравии — русло вади эр-Румма и вади эль-Батин, идущее от гор Хиджаза близ Медины на северо-восток к Кувейту, которое Фарук эль-Баз из Бостонского университета проследил по спутниковым снимкам; в этом взгляде древний золотой рудник Махд-эз-Захаб у его верховьев отвечает золоту земли Хавила."
  uk:
    - "Фісон — перша з чотирьох голів, на які розділялася річка, що зрошувала Еден: «Імя первої Пизон; ся обтекає всю Гавила землю, де знаходять золото. А золото в тій землї предобре. Там знаходять і бедола-смолу і камінь оникс». На відміну від Тигра й Євфрату, він не названий більше ніде в єврейській Біблії (Книга Сираха, 24:25, лише побіжно згадує його) й ніколи не був ототожнений; точка на мапі в західній Аравії означає лише одну з пропозицій, що шукають там золоту країну Хавіли."
    - "Давні й сучасні читачі шукали його в дуже віддалених місцях. Йосиф Флавій ототожнював Фісон з Гангом, а Раші — з Нілом; К. Ф. Кайль, відкинувши Фазіс Рейланда, вважав імовірнішою Куру, що бере початок у Вірменії й тече до Каспійського моря. 1996 р. Джеймс А. Сауер, колишній куратор Гарвардського семітського музею, запропонував нині сухе русло в Аравії, канал вад-ар-Румма й вад-ель-Батін, що тягнеться від гір Хіджазу поблизу Медини на північний схід до Кувейту і яке Фарук Ель-Баз з Бостонського університету простежив на супутникових знімках; за цим поглядом давній золотий рудник Махд-ед-Дахаб біля його верхів'я відповідає золоту Хавіли."
  es:
    - "El Pisón es el primero de los cuatro brazos en que se dividía el río que regaba el Edén: «El nombre del uno era Pisón: éste es el que cerca toda la tierra de Havilah, donde hay oro: Y el oro de aquella tierra es bueno: hay allí también bdelio y piedra cornerina». A diferencia del Tigris y el Éufrates, no se nombra en ningún otro lugar de la Biblia hebrea (Eclesiástico 24:25 lo menciona solo de pasada), y nunca ha sido identificado; el punto del mapa en el oeste de Arabia representa solo una de las propuestas que buscan allí el país del oro de Havila."
    - "Lectores antiguos y modernos lo han buscado muy lejos unos de otros. Josefo identificó el Pisón con el Ganges, y Rashi con el Nilo; C. F. Keil, descartando el Fasis de Reland, lo creyó más probablemente el Ciro (el Kura), que nace en Armenia y fluye hacia el mar Caspio. En 1996 James A. Sauer, antiguo conservador del Museo Semítico de Harvard, propuso un río de Arabia hoy seco, el cauce del Wadi al-Rummah y el Wadi al-Batin, que corre desde las montañas del Hiyaz, cerca de Medina, hacia el nordeste hasta Kuwait y que Farouk El-Baz, de la Universidad de Boston, había trazado en imágenes de satélite; según esta opinión, la antigua mina de oro de Mahd adh-Dhahab, cerca de su curso alto, corresponde al oro de Havila."
  pt:
    - "O Pisom é o primeiro dos quatro braços em que se dividia o rio que regava o Éden: “O nome do primeiro é Pisom: ele flui por toda a terra de Havilá, onde há ouro; e o ouro daquela terra é bom. O bdélio e a pedra de ônix também estão lá.” Ao contrário do Tigre e do Eufrates, não é nomeado em nenhum outro lugar da Bíblia hebraica (Eclesiástico 24:25 o menciona apenas de passagem), e nunca foi identificado; o ponto do mapa no oeste da Arábia representa apenas uma das propostas que procuram ali a região aurífera de Havilá."
    - "Leitores antigos e modernos o procuraram em lugares muito distantes. Josefo identificou o Pisom com o Ganges, e Rashi com o Nilo; C. F. Keil, pondo de lado o Fásis de Reland, pensou que fosse mais provavelmente o Ciro (o Kura), que nasce na Armênia e corre para o mar Cáspio. Em 1996 James A. Sauer, antigo curador do Museu Semítico de Harvard, propôs um rio hoje seco da Arábia, o leito do uádi al-Rummah e do uádi al-Batin, que vai das montanhas do Hejaz, perto de Medina, para nordeste até o Kuwait e que Farouk El-Baz, da Universidade de Boston, havia traçado em imagens de satélite; nessa visão, a antiga mina de ouro de Mahd adh-Dhahab, perto de seu curso superior, corresponde ao ouro de Havilá."
  de:
    - "Der Pischon ist der erste der vier Arme, in die sich der Strom teilte, der Eden bewässerte: „Das erste heißt Pison, das fließt um das ganze Land Hevila; und daselbst findet man Gold. Und das Gold des Landes ist köstlich; und da findet man Bedellion und den Edelstein Onyx.“ Anders als Tigris und Euphrat wird er sonst nirgends in der hebräischen Bibel genannt (Jesus Sirach 24,25 erwähnt ihn nur beiläufig), und er ist nie identifiziert worden; der Punkt der Karte in Westarabien steht nur für einen der Vorschläge, die das Goldland Hawila dort suchen."
    - "Alte und moderne Leser haben ihn weit auseinander gesucht. Josephus setzte den Pischon mit dem Ganges gleich, Raschi mit dem Nil; C. F. Keil verwarf Relands Phasis und hielt eher den Kyros (die Kura) für wahrscheinlich, die in Armenien entspringt und zum Kaspischen Meer fließt. 1996 schlug James A. Sauer, früher Kurator am Harvard Semitic Museum, einen heute trockenen Fluss Arabiens vor, das Bett des Wadi ar-Rumma und des Wadi al-Batin, das von den Bergen des Hedschas nahe Medina nach Nordosten bis Kuwait verläuft und das Farouk El-Baz von der Boston University auf Satellitenbildern verfolgt hatte; nach dieser Ansicht entspricht die antike Goldmine Mahd adh-Dhahab nahe seinem Oberlauf dem Gold Hawilas."
  it:
    - "Il Pison è il primo dei quattro capi in cui si divideva il fiume che irrigava l’Eden: «Il nome del primo è Pishon, ed è quello che circonda tutto il paese di Havila, dov’è l’oro; e l’oro di quel paese è buono; quivi si trovan pure il bdellio e l’onice». A differenza del Tigri e dell’Eufrate, non è nominato altrove nella Bibbia ebraica (Siracide 24,25 lo menziona solo di passaggio) e non è mai stato identificato; il punto della carta nell’Arabia occidentale rappresenta soltanto una delle proposte che cercano là il paese dell’oro di Avila."
    - "Lettori antichi e moderni lo hanno cercato in luoghi assai lontani. Giuseppe Flavio identificò il Pison con il Gange, e Rashi con il Nilo; C. F. Keil scartò il Fasi di Reland e lo ritenne più probabilmente il Ciro (il Kura), che nasce in Armenia e scorre verso il Mar Caspio. Nel 1996 James A. Sauer, già curatore dello Harvard Semitic Museum, propose un fiume ora asciutto dell’Arabia, il letto del Wadi al-Rummah e del Wadi al-Batin, che va dalle montagne dello Hijaz presso Medina a nord-est fino al Kuwait e che Farouk El-Baz della Boston University aveva tracciato su immagini satellitari; secondo questa tesi l’antica miniera d’oro di Mahd adh-Dhahab presso il suo corso superiore corrisponde all’oro di Avila."
  fr:
    - "Le Pischon est le premier des quatre bras en lesquels se divisait le fleuve qui arrosait l’Éden : « Le nom du premier est Pischon ; c’est celui qui entoure tout le pays de Havila, où se trouve l’or. L’or de ce pays est pur ; on y trouve aussi le bdellium et la pierre d’onyx. » À la différence du Tigre et de l’Euphrate, il n’est nommé nulle part ailleurs dans la Bible hébraïque (Siracide 24:25 ne le mentionne qu’en passant) et n’a jamais été identifié ; le point de la carte en Arabie occidentale ne représente que l’une des propositions qui y cherchent le pays de l’or de Havila."
    - "Les lecteurs anciens et modernes l’ont cherché en des lieux très éloignés. Josèphe identifiait le Pischon au Gange, et Rachi au Nil ; C. F. Keil, écartant le Phase de Reland, le tenait plus probablement pour le Cyrus (la Koura), qui naît en Arménie et coule vers la mer Caspienne. En 1996, James A. Sauer, ancien conservateur du Harvard Semitic Museum, proposa un fleuve d’Arabie aujourd’hui asséché, le lit de l’ouadi al-Rummah et de l’ouadi al-Batin, qui court des monts du Hedjaz près de Médine vers le nord-est jusqu’au Koweït et que Farouk El-Baz, de l’université de Boston, avait tracé sur des images satellites ; dans cette vue, l’ancienne mine d’or de Mahd adh-Dhahab, près de son cours supérieur, répond à l’or de Havila."
  nl:
    - "De Pison is de eerste van de vier hoofden waarin de rivier die Eden bewaterde zich verdeelde: “De naam der eerste rivier is Pison; deze is het, die het ganse land van Havila omloopt, waar het goud is. En het goud van dit land is goed; daar is ook bedolah, en de steen sardonix.” Anders dan de Tigris en de Eufraat wordt zij nergens elders in de Hebreeuwse Bijbel genoemd (Jezus Sirach 24:25 noemt haar slechts terloops), en zij is nooit geïdentificeerd; het punt op de kaart in West-Arabië staat slechts voor een van de voorstellen die het goudland Havila daar zoeken."
    - "Oude en moderne lezers hebben haar ver uiteen gezocht. Josephus vereenzelvigde de Pison met de Ganges, en Rasji met de Nijl; C. F. Keil liet Relands Phasis terzijde en achtte haar waarschijnlijker de Cyrus (de Koera), die in Armenië ontspringt en naar de Kaspische Zee stroomt. In 1996 stelde James A. Sauer, voorheen conservator van het Harvard Semitic Museum, een thans droge rivier van Arabië voor, het bed van de Wadi al-Rummah en de Wadi al-Batin, dat van het Hijaz-gebergte bij Medina naar het noordoosten tot Koeweit loopt en dat Farouk El-Baz van Boston University op satellietbeelden had getraceerd; in deze opvatting komt de antieke goudmijn van Mahd adh-Dhahab bij de bovenloop overeen met het goud van Havila."
  cs:
    - "Píšon je první ze čtyř ramen, na něž se dělila řeka, která zavlažovala Eden: „Jméno jedné Píson, ta obchází všecku zemi Hevilah, kdež jest zlato. A zlato země té jest výborné; tam jest i bdelium, a kámen onychin.“ Na rozdíl od Tigridu a Eufratu není nikde jinde v hebrejské Bibli jmenován (Kniha Sírachovcova 24,25 jej zmiňuje jen mimochodem) a nikdy nebyl určen; bod na mapě v západní Arábii představuje jen jeden z návrhů, které tam hledají zlatou zemi Chavílu."
    - "Staří i moderní čtenáři jej hledali daleko od sebe. Josephus Flavius ztotožnil Píšon s Gangou a Raši s Nilem; C. F. Keil odložil Relandův Fasis a pokládal za pravděpodobnější Kýros (Kura), který pramení v Arménii a teče do Kaspického moře. V roce 1996 navrhl James A. Sauer, dříve kurátor Harvardského semitského muzea, dnes vyschlou řeku Arábie, koryto Wádí ar-Rumma a Wádí al-Bátin, které vede z hor Hidžázu poblíž Medíny na severovýchod do Kuvajtu a které Farouk El-Baz z Bostonské univerzity vysledoval na družicových snímcích; podle tohoto názoru starověký zlatý důl Mahd adh-Dhahab poblíž jeho horního toku odpovídá zlatu Chavíly."
  pl:
    - "Pischon jest pierwszą z czterech odnóg, na które dzieliła się rzeka nawadniająca Eden: „Imię jednej Fyson; ta okrąża wszystką ziemię Hewila, gdzie się rodzi złoto. A złoto ziemi onej jest wyborne. Tamże jest Bdellion, i kamień Onychyn”. W przeciwieństwie do Tygrysu i Eufratu nie jest wymieniony nigdzie indziej w Biblii hebrajskiej (Mądrość Syracha 24,25 wspomina go tylko mimochodem) i nigdy go nie zidentyfikowano; punkt na mapie w zachodniej Arabii oznacza tylko jedną z propozycji, które szukają tam złotodajnej krainy Chawila."
    - "Dawni i współcześni czytelnicy szukali go bardzo daleko od siebie. Józef Flawiusz utożsamił Pischon z Gangesem, a Raszi z Nilem; C. F. Keil odrzucił Fazis Relanda i uznał za bardziej prawdopodobną Kurę (Cyrus), która wypływa w Armenii i uchodzi do Morza Kaspijskiego. W 1996 roku James A. Sauer, dawny kustosz Harvard Semitic Museum, zaproponował dziś wyschniętą rzekę Arabii, koryto Wadi ar-Rumma i Wadi al-Batin, biegnące od gór Hidżazu koło Medyny na północny wschód do Kuwejtu, które Farouk El-Baz z Uniwersytetu Bostońskiego prześledził na zdjęciach satelitarnych; według tego poglądu dawna kopalnia złota Mahd ad-Dahab w jego górnym biegu odpowiada złotu Chawili."
  sv:
    - "Pishon är den första av de fyra grenar som floden som vattnade Eden delade sig i: ”Den första heter Pison; det är den som flyter omkring hela landet Havila, där guld finnes, och det landets guld är gott; där finnes ock bdelliumharts och onyxsten.” Till skillnad från Tigris och Eufrat nämns den ingen annanstans i den hebreiska Bibeln (Syrak 24:25 nämner den bara i förbigående), och den har aldrig identifierats; kartans punkt i västra Arabien står bara för ett av förslagen som söker Havilas guldland där."
    - "Forntida och moderna läsare har sökt den vitt skilda platser. Josefus identifierade Pishon med Ganges, och Rashi med Nilen; C. F. Keil lade Relands Phasis åt sidan och menade att den snarare var Kyros (Kura), som har sin källa i Armenien och rinner till Kaspiska havet. År 1996 föreslog James A. Sauer, tidigare intendent vid Harvard Semitic Museum, en nu torr flod i Arabien, bädden för Wadi al-Rummah och Wadi al-Batin, som löper från Hijazbergen nära Medina nordost till Kuwait och som Farouk El-Baz vid Boston University hade spårat på satellitbilder; enligt denna uppfattning motsvarar den forntida guldgruvan Mahd adh-Dhahab nära dess övre lopp Havilas guld."
  nb:
    - "Pisjon er det første av de fire hovedløpene som elven som vannet Eden delte seg i: «Den første heter Pison; det er den som løper omkring hele landet Havila, der hvor det er gull. Og gullet i dette land er godt; der er bdellium og onyks-stenen.» I motsetning til Tigris og Eufrat er den ikke nevnt noe annet sted i den hebraiske bibelen (Siraks bok 24,25 nevner den bare i forbifarten), og den er aldri blitt identifisert; kartpunktet i vestlige Arabia står bare for ett av forslagene som søker Havilas gulland der."
    - "Gamle og moderne lesere har lett etter den langt fra hverandre. Josefus identifiserte Pisjon med Ganges, og Rashi med Nilen; C. F. Keil la til side Relands Phasis og mente at det mer sannsynlig var Kyros (Kura), som har sitt utspring i Armenia og renner til Kaspihavet. I 1996 foreslo James A. Sauer, tidligere kurator ved Harvard Semitic Museum, en nå tørr elv i Arabia, løpet til Wadi al-Rummah og Wadi al-Batin, som går fra Hijaz-fjellene nær Medina nordøstover til Kuwait og som Farouk El-Baz ved Boston University hadde kartlagt på satellittbilder; i dette synet svarer den gamle gullgruven Mahd adh-Dhahab nær dens øvre løp til Havilas gull."
  tl:
    - "Ang Pison ang una sa apat na ulo na pinaghati-hatian ng ilog na dumilig sa Eden: “Ang pangalan ng una ay Pison: na siyang lumiligid sa buong lupain ng Havilah, na doo'y may ginto; At ang ginto sa lupang yao'y mabuti; mayroon din naman doong bedelio at batong onix.” Hindi tulad ng Tigris at Eufrates, wala nang ibang lugar na pinangalanan ito sa Bibliyang Hebreo (binanggit lamang ito sa Sirac 24:25), at hindi pa ito natukoy kailanman; ang punto ng mapa sa kanlurang Arabia ay kumakatawan lamang sa isa sa mga mungkahing naghahanap sa lupain ng ginto ng Havila roon."
    - "Magkakalayo ang paghahanap ng mga sinauna at makabagong mambabasa. Kinilala ni Josephus ang Pison sa Ganges, at ni Rashi sa Nilo; isinantabi ni C. F. Keil ang Phasis ni Reland at inisip na mas malamang ito ang Cyrus (ang Kura), na nagmumula sa Armenia at umaagos sa Dagat Caspio. Noong 1996, iminungkahi ni James A. Sauer, dating tagapangasiwa sa Harvard Semitic Museum, ang isang ilog ng Arabia na tuyo na ngayon, ang daluyan ng Wadi al-Rummah at Wadi al-Batin, na tumatakbo mula sa mga bundok ng Hijaz malapit sa Medina pahilagang-silangan hanggang Kuwait at nasubaybayan ni Farouk El-Baz ng Boston University sa mga larawang satelayt; sa pananaw na ito, ang sinaunang minahan ng ginto ng Mahd adh-Dhahab malapit sa itaas na agos nito ay tumutugma sa ginto ng Havila."
  da:
    - "Pisjon er det første af de fire hoveder, som floden, der vandede Eden, delte sig i: »Den førstes Navn er Pison, hvilken løber om det ganske Land Havila, hvor der er Guld. Og Guldet fra det samme Land er godt; der er Bdellion og den Sten Onyks.« I modsætning til Tigris og Eufrat er den ikke nævnt andre steder i den hebraiske bibel (Siraks Bog 24,25 nævner den kun i forbifarten), og den er aldrig blevet identificeret; kortets punkt i det vestlige Arabien står kun for et af de forslag, der søger Havilas guldland dér."
    - "Gamle og nyere læsere har søgt den vidt forskellige steder. Josefus identificerede Pisjon med Ganges og Rashi med Nilen; C. F. Keil afviste Relands Phasis og mente, at det mere sandsynligt var Kyros (Kura), som udspringer i Armenien og løber til Det Kaspiske Hav. I 1996 foreslog James A. Sauer, tidligere kurator ved Harvard Semitic Museum, en nu udtørret flod i Arabien, løbet af Wadi al-Rummah og Wadi al-Batin, som løber fra Hijaz-bjergene nær Medina mod nordøst til Kuwait, og som Farouk El-Baz fra Boston University havde fulgt på satellitbilleder; i dette syn svarer den gamle guldmine Mahd adh-Dhahab nær dens øvre løb til Havilas guld."
  sr:
    - "Фисон је прва од четири главе на које се делила река што је натапала Еден: „Једној је име Фисон, она тече око целе земље евилске, а онде има злата, и злато је оне земље врло добро; онде има и бдела и драгог камена ониха.“ За разлику од Тигра и Еуфрата, нигде се другде не именује у хебрејској Библији (Сирах 24,25 га помиње само узгред) и никад није поистовећен; тачка на карти у западној Арабији стоји само за један од предлога који тамо траже Евилину земљу злата."
    - "Стари и савремени читаоци тражили су га врло далеко. Јосиф Флавије поистоветио је Фисон с Гангом, а Раши с Нилом; К. Ф. Кајл одбацио је Реландов Фасис и сматрао вероватнијим Кир (Куру), који извире у Јерменији и тече у Каспијско море. Године 1996. Џејмс А. Зауер, раније кустос Харвардског семитског музеја, предложио је данас суву реку Арабије, корито Вади ер-Руме и Вади ел-Батина, које тече од планина Хиџаза код Медине на североисток до Кувајта и које је Фарук ел-Баз са Универзитета у Бостону пратио на сателитским снимцима; по том виђењу древни златни рудник Махд ед-Дахаб близу њеног горњег тока одговара злату Евиле."
scripture:
  - Gen.2.10
