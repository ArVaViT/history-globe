body:
  en:
    - "Giloh was a town in the hill country of Judah, listed in the district of Debir with “Goshen, and Holon, and Giloh; eleven cities with their villages”, south-west of Hebron. It is remembered as the home of Ahithophel, whose advice “was as if a man had enquired at the oracle of God”. When Absalom raised his revolt at Hebron he “sent for Ahithophel the Gilonite, David's counsellor, from his city, even from Giloh, while he offered sacrifices”, and David prayed, “turn the counsel of Ahithophel into foolishness”. The prayer was answered through Hushai; when Ahithophel “saw that his counsel was not followed”, he went home “to his city, and put his household in order, and hanged himself”, and was buried in his father's tomb. His son Eliam stands among David's thirty; since Bathsheba's father was also an Eliam, some have supposed that Ahithophel was her grandfather, which the text does not say."
    - "The site has not been found. On the strength of the name, Khirbet Jala, some 10 km north-north-west of Hebron, has long been proposed, but it lies in the wrong district: Joshua's list groups Giloh with Debir, now generally placed at Khirbet Rabud south-west of Hebron, so others look for it in that country, near Dhahiriya, where the map places it; nothing has been excavated. The Jerusalem neighbourhood of Gilo, built in the 1970s, took the name, and Amihai Mazar dug there in 1978–1982 a small fortified village of the twelfth century BC, one of the earliest Israelite settlements known; it is a find of its own, not the Giloh of Ahithophel, which lay far to the south."
    - "Eusebius lists Gilon only as the home of Ahithophel, without a site. The hills where it stood are now the southern Hebron district of the West Bank, around Dhahiriya and Dura, farmed in terraces of vines and olives."
  ru:
    - "Гило был городом в горах Иуды, названным в округе Давира: «Гошен, Холон и Гило: одиннадцать городов с их селами», что помещает его в горы к юго-западу от Хеврона. Его помнят как родину Ахитофела, советника Давидова, чьи советы «считались, как если бы кто спрашивал наставления у Бога». Подняв мятеж в Хевроне, Авессалом «послал и призвал Ахитофела Гилонянина, советника Давидова, из его города Гило», и Давид молился: «Господи Боже мой! разрушь совет Ахитофела». Молитва была услышана через Хусия; когда Ахитофел увидел, «что не исполнен совет его», он «оседлал осла, и собрался, и пошел в дом свой, в город свой, и сделал завещание дому своему, и удавился», и был погребён в гробе отца своего в Гило. Его сын Елиам стоит среди тридцати храбрых Давида; поскольку отца Вирсавии тоже звали Елиам, некоторые предполагали, что Ахитофел был её дедом, но текст этого не говорит."
    - "Место не найдено. По созвучию имени давно предлагали Хирбет-Джалу примерно в 10 км к северо-северо-западу от Хеврона, но она лежит не в том округе: список Иисуса Навина ставит Гило рядом с Давиром, который теперь обычно помещают в Хирбет-Рабуд к юго-западу от Хеврона, поэтому другие ищут его в тех краях, близ Дахрии, где его ставит и карта; раскопок не было. Иерусалимский район Гило, построенный в 1970-х годах, взял себе это имя, и Амихай Мазар раскопал там в 1978–1982 годах маленькое укреплённое селение XII века до н. э., одно из самых ранних известных израильских поселений; это находка сама по себе, а не Гило Ахитофела, лежавший далеко на юге."
    - "Евсевий называет Гилон только родиной Ахитофела, не указывая места. Горы, где он стоял, — ныне южная часть Хевронского района Западного берега, вокруг Дахрии и Дуры, с террасами виноградников и олив."
  uk:
    - "Гіло було містом у гірській країні Юди, перерахованим в окрузі Девіра: «Гозен, Холон та Гило — одинайцять городів з їх селами», на південний захід від Хеврона. Його пам’ятають як батьківщину Ахітофела, чия порада була такою, «неначе рада самого Бога». Коли Авесалом підняв заколот у Хевроні, він «прикликав порадника Давидового, Ахитофела, з його города Гило. А коли принесено жертву», а Давид молився: «Поглумись, Господи, над Ахитофелевою радою!» Молитву було вислухано через Хусія; тоді «Побачивши ж Ахитофел, що порада його не пійшла в лад, осїдлав осла та й пустивсь у дорогу до дому у свій отецький город, а розпорядивши господою своєю, завісивсь», і його поховали в батьковому гробі. Його син Еліам стоїть серед Давидових тридцяти; оскільки батько Вірсавії теж звався Еліам, дехто припускав, що Ахітофел був її дідом, чого текст не каже."
    - "Місце не знайдено. З огляду на назву давно пропонують Хірбет-Джала, приблизно за 10 км на північ-північний захід від Хеврона, але він лежить не в тому окрузі: перелік у Книзі Ісуса Навина групує Гіло з Девіром, якого нині зазвичай розміщують у Хірбет-Рабуд на південний захід від Хеврона, тож інші шукають його в тому краї, поблизу Ед-Захірії, де його позначає карта; нічого не розкопано. Єрусалимський район Гіло, збудований у 1970-х роках, узяв цю назву, і Аміхай Мазар розкопав там у 1978–1982 роках невелике укріплене село XII ст. до н. е., одне з найдавніших відомих ізраїльських поселень; це окрема знахідка, а не Гіло Ахітофела, яке лежало далеко на півдні."
    - "Євсевій згадує Гілон лише як батьківщину Ахітофела, без місця. Пагорби, де воно стояло, нині входять до південної частини Хевронського округу на Західному березі, довкола Ед-Захірії та Дури, оброблювані терасами з виноградом і оливами."
  es:
    - "Gilo era una población serrana de Judá, enumerada en el distrito de Debir con «Gosén, y Olón, y Gilo; once ciudades con sus aldeas», al suroeste de Hebrón. Se recuerda como patria de Ahitofel, cuyo consejo «era como si consultaran la palabra de Dios». Cuando Absalón se rebeló en Hebrón, «envió Absalom por Achitophel Gilonita, del consejo de David, á Gilo su ciudad, mientras hacía sus sacrificios», y David oró: «Entontece ahora, oh Jehová, el consejo de Achitophel». La oración fue respondida por Husai; cuando Ahitofel, «viendo que no se había puesto por obra su consejo», se fue «á su casa en su ciudad; y después de disponer acerca de su casa, ahorcóse y murió», y fue sepultado en el sepulcro de su padre. Su hijo Eliam es de los treinta de David; como el padre de Betsabé se llamaba también Eliam, algunos suponen que Ahitofel era su abuelo, lo que el texto no dice."
    - "El sitio no se ha hallado. Por el nombre se ha propuesto desde antiguo Khirbet Jala, unos 10 km al nornoroeste de Hebrón, pero queda en el distrito equivocado: la lista de Josué agrupa Gilo con Debir, que hoy se sitúa generalmente en Khirbet Rabud, al suroeste de Hebrón, de modo que otros lo buscan en esa comarca, cerca de Dhahiriya, donde lo sitúa el mapa; no se ha excavado nada. El barrio de Gilo, en Jerusalén, construido en los años setenta, tomó el nombre, y Amihai Mazar excavó allí en 1978–1982 una pequeña aldea fortificada del siglo XII a. C., uno de los asentamientos israelitas más antiguos que se conocen; es un hallazgo propio, no el Gilo de Ahitofel, que quedaba muy al sur."
    - "Eusebio enumera Gilon solo como la patria de Ahitofel, sin indicar un sitio. Las colinas donde se alzaba son hoy el sur del distrito de Hebrón en Cisjordania, en torno a Dhahiriya y Dura, cultivadas en terrazas de viñas y olivos."
  pt:
    - "Gilo era uma cidade na região montanhosa de Judá, listada no distrito de Debir com “Gósen, Holom e Gilo; onze cidades com as suas aldeias”, a sudoeste de Hebrom. É lembrada como a terra de Aitofel, cujo conselho “era como se alguém consultasse o oráculo de Deus”. Quando Absalão levantou sua revolta em Hebrom, “mandou chamar Aitofel, o gilonita, conselheiro de Davi, da sua cidade, isto é, de Gilo, enquanto oferecia os sacrifícios”, e Davi orou: “torna em loucura o conselho de Aitofel”. A oração foi atendida por meio de Husai; quando Aitofel “viu que o seu conselho não foi seguido”, foi “para casa, na sua cidade, colocou a sua casa em ordem e se enforcou”, e foi sepultado no túmulo de seu pai. Seu filho Eliã está entre os trinta de Davi; como o pai de Bate-Seba também se chamava Eliã, alguns supuseram que Aitofel era o avô dela, o que o texto não diz."
    - "O sítio não foi encontrado. Pela força do nome, Khirbet Jala, a cerca de 10 km a nor-noroeste de Hebrom, é há muito proposta, mas fica no distrito errado: a lista de Josué agrupa Gilo com Debir, hoje geralmente situada em Khirbet Rabud, a sudoeste de Hebrom, de modo que outros a procuram naquela região, perto de Dhahiriya, onde o mapa a coloca; nada foi escavado. O bairro jerosolimitano de Gilo, construído na década de 1970, tomou o nome, e Amihai Mazar escavou ali, em 1978–1982, uma pequena aldeia fortificada do século XII a.C., um dos mais antigos povoados israelitas conhecidos; é um achado à parte, não o Gilo de Aitofel, que ficava muito ao sul."
    - "Eusébio lista Gilon apenas como terra de Aitofel, sem indicar sítio. As colinas onde ficava são hoje o sul do distrito de Hebrom, na Cisjordânia, em torno de Dhahiriya e Dura, cultivadas em terraços de vinhas e oliveiras."
  de:
    - "Gilo war eine Stadt im Bergland Judas, im Bezirk von Debir aufgeführt mit „Gosen, Holon, Gilo. Das sind elf Städte und ihre Dörfer“, südwestlich von Hebron. Man erinnert sich daran als der Heimat Ahitofels, dessen Rat war, „als wenn man Gott um etwas hätte gefragt“. Als Absalom in Hebron seinen Aufstand erhob, sandte er „nach Ahithophel, dem Giloniten, Davids Rat, aus seiner Stadt Gilo. Da er nun die Opfer tat“, und David betete: „HERR, mache den Ratschlag Ahithophels zur Narrheit!“ Das Gebet wurde durch Huschai erhört; als Ahitofel „sah, daß sein Rat nicht ausgeführt ward“, zog er „heim in seine Stadt und beschickte sein Haus und erhängte sich“ und wurde „in seines Vaters Grab“ begraben. Sein Sohn Eliam gehört zu Davids Dreißig; da auch Batsebas Vater Eliam hieß, haben manche Ahitofel für ihren Großvater gehalten, was der Text nicht sagt."
    - "Die Stätte ist nicht gefunden. Wegen des Namens wird seit langem Chirbet Dschala, etwa 10 km nord-nordwestlich von Hebron, vorgeschlagen, doch es liegt im falschen Bezirk: Josuas Liste gruppiert Gilo mit Debir, das heute meist bei Chirbet Rabud südwestlich von Hebron angesetzt wird; daher suchen andere es dort, nahe Dhahirija, wo die Karte es ansetzt; ausgegraben ist nichts. Das Jerusalemer Viertel Gilo, in den 1970er Jahren gebaut, übernahm den Namen, und Amihai Mazar grub dort 1978–1982 ein kleines befestigtes Dorf des 12. Jahrhunderts v. Chr. aus, eine der frühesten bekannten israelitischen Siedlungen; es ist ein eigener Fund, nicht das Gilo Ahitofels, das weit im Süden lag."
    - "Eusebius führt Gilon nur als Heimat Ahitofels auf, ohne Ortsangabe. Die Hügel, auf denen es stand, sind heute der südliche Bezirk Hebron im Westjordanland, um Dhahirija und Dura, in Terrassen mit Wein und Oliven bewirtschaftet."
  fr:
    - "Guilo était une ville de la montagne de Juda, inscrite au district de Debir avec « Gosen, Holon, et Guilo ; onze villes, et leurs villages », au sud-ouest d’Hébron. C’est la patrie d’Achitophel, dont les conseils « avaient autant d’autorité que si l’on eût consulté Dieu lui-même ». Quand Absalom se révolta à Hébron, il « envoya chercher à la ville de Guilo Achitophel, le Guilonite, conseiller de David », en offrant les sacrifices, et David pria : « réduis à néant les conseils d’Achitophel ! » La prière fut exaucée par Huschaï ; voyant que « son conseil n’était pas suivi », Achitophel s’en alla « chez lui dans sa ville. Il donna ses ordres à sa maison, et il s’étrangla », et fut enterré dans le sépulcre de son père. Son fils Éliam compte parmi les trente de David ; Bath-Schéba ayant pour père un autre Éliam, certains font d’Achitophel son grand-père, ce que le texte ne dit pas."
    - "Le site n’a pas été trouvé. Sur la foi du nom, on a longtemps proposé Khirbet Jala, à quelque 10 km au nord-nord-ouest d’Hébron, mais il se trouve dans le mauvais district : la liste de Josué groupe Guilo avec Debir, aujourd’hui généralement placée à Khirbet Rabud, au sud-ouest d’Hébron, et d’autres la cherchent donc dans cette région, près de Dhahiriya, où la carte la place ; rien n’a été fouillé. Le quartier de Gilo, à Jérusalem, bâti dans les années 1970, a pris le nom, et Amihai Mazar y a fouillé en 1978–1982 un petit village fortifié du XIIe siècle av. J.-C., l’un des plus anciens établissements israélites connus ; c’est une découverte à part, non le Guilo d’Achitophel, qui se trouvait bien plus au sud."
    - "Eusèbe ne mentionne Gilon que comme patrie d’Achitophel, sans indiquer de site. Les collines où elle se dressait forment aujourd’hui le sud du district d’Hébron, en Cisjordanie, autour de Dhahiriya et de Dura, cultivées en terrasses de vignes et d’oliviers."
  pl:
    - "Gilo było miastem w górach Judy, wymienionym w okręgu Debir wraz z „Gosen, i Holon, i Gilo, miast jedenaście, i wsi ich”, na południowy zachód od Hebronu. Pamięta się je jako rodzinne miasto Achitofela, którego rada „była na on czas w takiej wadze, jakoby się kto radził Boga”. Gdy Absalom wzniecił bunt w Hebronie, posłał „po Achitofela Giloniczyka, radcę Dawidowego, aby przyszedł z miasta swego Gilo, gdy miał sprawować ofiary”, a Dawid modlił się: „obróć w głupstwo radę Achitofelowę”. Modlitwa została wysłuchana przez Chuszaja; gdy Achitofel, „widząc, iż się nie stało podług rady jego”, wrócił „do miasta swego, a rozprawiwszy dom swój, powiesił się”, i został pochowany w grobie swego ojca. Jego syn Eliam należy do trzydziestu Dawida; ponieważ ojciec Batszeby też nazywał się Eliam, niektórzy przypuszczali, że Achitofel był jej dziadkiem, czego tekst nie mówi."
    - "Miejsca nie odnaleziono. Na podstawie nazwy od dawna proponuje się Chirbet Dżala, około 10 km na północ-północny zachód od Hebronu, lecz leży ona w niewłaściwym okręgu: wykaz Jozuego łączy Gilo z Debirem, dziś zwykle umieszczanym w Chirbet Rabud na południowy zachód od Hebronu, więc inni szukają go w tej okolicy, koło ad-Dahirijja, gdzie umieszcza je mapa; nic nie wykopano. Jerozolimska dzielnica Gilo, zbudowana w latach siedemdziesiątych, przejęła nazwę, a Amihaj Mazar odkopał tam w latach 1978–1982 małą obwarowaną wieś z XII w. p.n.e., jedno z najwcześniejszych znanych osiedli izraelskich; jest to odrębne znalezisko, nie Gilo Achitofela, które leżało daleko na południu."
    - "Euzebiusz wymienia Gilon tylko jako rodzinne miasto Achitofela, bez wskazania miejsca. Wzgórza, na których leżało, to dziś południowy okręg Hebronu na Zachodnim Brzegu, wokół ad-Dahirijja i Dury, uprawiane na tarasach winnic i oliwek."
  it:
    - "Gilo era una città dei monti di Giuda, nel distretto di Debir, con «Goscen, Holon e Ghilo: undici città e i loro villaggi», a sud-ovest di Ebron. È la patria di Achitofel, il cui consiglio «era come una parola data da Dio a uno che lo avesse consultato». Quando Assalonne si ribellò a Ebron, «mentre offriva i sacrifizi, mandò a chiamare Ahitofel, il Ghilonita, consigliere di Davide, perché venisse dalla sua città di Ghilo», e Davide pregò: «rendi vani i consigli di Ahitofel!» La preghiera fu esaudita tramite Cusai; quando Achitofel vide «che il suo consiglio non era stato seguito», tornò a casa «nella sua città. Mise in ordine le cose della sua casa, e s’impiccò», e fu sepolto nella tomba paterna. Suo figlio Eliam è fra i trenta di Davide; poiché anche il padre di Betsabea si chiamava Eliam, alcuni suppongono che Achitofel fosse suo nonno, ma il testo non lo dice."
    - "Il sito non è stato trovato. In base al nome è stata a lungo proposta Khirbet Jala, circa 10 km a nord-nord-ovest di Ebron, ma si trova nel distretto sbagliato: l’elenco di Giosuè raggruppa Gilo con Debir, ora generalmente collocata a Khirbet Rabud a sud-ovest di Ebron, così altri la cercano in quella zona, presso Dhahiriya, dove la mappa la pone; nulla è stato scavato. Il quartiere di Gilo a Gerusalemme, costruito negli anni Settanta, ne ha preso il nome, e Amihai Mazar vi scavò nel 1978–1982 un piccolo villaggio fortificato del XII secolo a.C., uno dei più antichi insediamenti israelitici noti; è una scoperta a sé, non la Gilo di Achitofel, che si trovava molto più a sud."
    - "Eusebio elenca Gilon solo come patria di Achitofel, senza indicare un sito. Le colline dove sorgeva sono oggi il distretto meridionale di Ebron in Cisgiordania, intorno a Dhahiriya e Dura, coltivate a terrazze di viti e ulivi."
  nl:
    - "Gilo was een stad in het bergland van Juda, vermeld in het district van Debir met “Gosen, en Holon, en Gilo; elf steden en haar dorpen”, ten zuidwesten van Hebron. Het is bekend als de woonplaats van Achitofel, wiens raad was “als of men naar Gods woord gevraagd had”. Toen Absalom in Hebron zijn opstand begon, “zond” hij “om Achitofel, den Giloniet, Davids raad, uit zijn stad, uit Gilo te halen, als hij offeranden offerde”, en David bad: “maak toch Achitofels raad tot zotheid”. Het gebed werd verhoord door Chusai; toen Achitofel “zag, dat zijn raad niet gedaan was”, “toog” hij “naar zijn huis in zijn stad, en gaf bevel aan zijn huis, en verhing zich”, en werd begraven in het graf van zijn vader. Zijn zoon Eliam is een van Davids dertig; omdat de vader van Batseba ook een Eliam was, hebben sommigen gemeend dat Achitofel haar grootvader was, wat de tekst niet zegt."
    - "De plaats is niet gevonden. Op grond van de naam werd Khirbet Jala, zo’n 10 km noordnoordwestelijk van Hebron, lang voorgesteld, maar het ligt in het verkeerde district: Jozua’s lijst groepeert Gilo met Debir, nu algemeen geplaatst bij Khirbet Rabud ten zuidwesten van Hebron, dus anderen zoeken het in die streek, bij Dhahiriya, waar de kaart het plaatst; er is niets opgegraven. De Jeruzalemse wijk Gilo, in de jaren zeventig gebouwd, nam de naam over, en Amihai Mazar groef daar in 1978–1982 een klein versterkt dorp uit de 12e eeuw v.Chr. op, een van de oudste bekende Israëlitische nederzettingen; het is een vondst op zichzelf, niet het Gilo van Achitofel, dat ver naar het zuiden lag."
    - "Eusebius noemt Gilon alleen als woonplaats van Achitofel, zonder plaats. De heuvels waar het stond, vormen nu het zuidelijke district Hebron van de Westoever, rond Dhahiriya en Dura, met terrassen van wijnstokken en olijven."
  cs:
    - "Gilo bylo město v judské pahorkatině, uvedené v okrese Debíru s „Gosen, Holon a Gilo, měst jedenácte i vsi jejich“, jihozápadně od Hebronu. Připomíná se jako domov Achitofela, jehož rada „byla, jako by se kdo doptával na řeč Boží“. Když Abšalom vyvolal vzpouru v Hebronu, „Poslal také Absolon pro Achitofele Gilonského, rádce Davidova, aby přišel z města svého Gilo, když měl obětovati oběti“, a David se modlil: „Zruš, prosím, ó Hospodine, radu Achitofelovu“. Modlitba byla vyslyšena skrze Chušaje; když Achitofel „vida, že se nestalo vedlé rady jeho“, odjel „do domu svého, do města svého. A učiniv pořízení v čeledi své, oběsil se“ a byl pohřben v hrobě svého otce. Jeho syn Eliam patří mezi Davidových třicet; protože i otec Bat-šeby se jmenoval Eliam, domnívali se někteří, že Achitofel byl jejím dědem, což text neříká."
    - "Poloha nebyla nalezena. Podle jména se dlouho navrhuje Chirbet Džala, asi 10 km severoseverozápadně od Hebronu, ale leží v nesprávném okrese: Jozuův seznam seskupuje Gilo s Debírem, nyní obecně kladeným do Chirbet Rabúd jihozápadně od Hebronu, a proto jiní hledají je v tomto kraji, poblíž Dhahiriya, kam je klade mapa; nic nebylo vykopáno. Jeruzalémská čtvrť Gilo, vystavěná v 70. letech 20. století, převzala jméno a Amihai Mazar tam v letech 1978–1982 vykopal malou opevněnou vesnici z 12. stol. př. n. l., jedno z nejstarších známých izraelských sídlišť; je to samostatný nález, nikoli Gilo Achitofelovo, které leželo daleko na jihu."
    - "Eusebios uvádí Gilon jen jako domov Achitofela, bez místa. Pahorky, kde stálo, jsou nyní jižním hebronským okresem Západního břehu, kolem Dhahiriya a Dúry, obdělávané v terasách vinic a olivovníků."
  sv:
    - "Gilo var en stad i Judas bergsbygd, upptagen i Devirs distrikt med ”Gosen, Holon och Gilo – elva städer med sina byar”, sydväst om Hebron. Den är ihågkommen som Achitofels hemort, vars råd gällde ”lika mycket som om man hade frågat Gud till råds”. När Absalom reste sitt uppror i Hebron heter det: ”Medan Absalom offrade slaktoffren, sände han också och lät hämta giloniten Ahitofel, Davids rådgivare, från hans stad Gilo”, och David bad: ”HERRE, gör Ahitofels råd till dårskap”. Bönen besvarades genom Hushaj; när Achitofel ”såg att man icke följde hans råd”, for han hem ”till sin stad, och sedan han hade beställt om sitt hus, hängde han sig”, och blev begravd i sin faders grav. Hans son Eliam står bland Davids trettio; eftersom Batsebas far också hette Eliam har några menat att Achitofel var hennes farfar, vilket texten inte säger."
    - "Platsen har inte hittats. Utifrån namnet har Khirbet Jala, omkring 10 km nordnordväst om Hebron, länge föreslagits, men den ligger i fel distrikt: Josuas förteckning grupperar Gilo med Devir, som nu allmänt förläggs till Khirbet Rabud sydväst om Hebron, så andra söker den i den trakten, nära Dhahiriya, där kartan placerar den; ingenting har grävts ut. Jerusalemkvarteret Gilo, byggt på 1970-talet, tog namnet, och Amihai Mazar grävde där 1978–1982 fram en liten befäst by från 1100-talet f.Kr., en av de äldsta kända israelitiska bosättningarna; det är ett fynd för sig, inte Achitofels Gilo, som låg långt åt söder."
    - "Eusebios nämner Gilon bara som Achitofels hemort, utan plats. Höjderna där den stod är nu södra Hebrondistriktet på Västbanken, kring Dhahiriya och Dura, brukade i terrasser med vin och oliver."
  nb:
    - "Gilo var en by i Judas fjellland, oppført i Debir-distriktet sammen med «Gosen og Holon og Gilo - elleve byer med tilhørende landsbyer», sørvest for Hebron. Den huskes som hjemstedet til Ahitofel, hvis råd «gjaldt ... like så meget som om en hadde spurt Guds ord til råds». Da Absalom reiste sitt opprør i Hebron, sendte han etter Ahitofel: «mens Absalom bar frem offerne, hentet han gilonitten Akitofel, Davids rådgiver, fra hans by Gilo», og David ba: «Gjør Akitofels råd til dårskap, Herre!» Bønnen ble besvart gjennom Husjai; da Ahitofel «så at hans råd ikke blev fulgt, salte han sitt asen og tok ut og drog hjem til sin by og beskikket sitt hus og hengte sig», og han ble begravet i sin fars grav. Hans sønn Eliam står blant Davids tretti; siden Batsebas far også het Eliam, har noen antatt at Ahitofel var hennes bestefar, noe teksten ikke sier."
    - "Stedet er ikke funnet. Ut fra navnet har Khirbet Jala, omtrent 10 km nord-nordvest for Hebron, lenge vært foreslått, men det ligger i feil distrikt: Josvas liste grupperer Gilo med Debir, nå vanligvis plassert ved Khirbet Rabud sørvest for Hebron, så andre leter etter det i det området, nær Dhahiriya, der kartet plasserer det; ingenting er utgravd. Bydelen Gilo i Jerusalem, bygd i 1970-årene, tok navnet, og Amihai Mazar gravde der i 1978–1982 ut en liten befestet landsby fra 1100-tallet f.Kr., en av de tidligste israelittiske bosetningene som er kjent; det er et funn for seg, ikke Ahitofels Gilo, som lå langt mot sør."
    - "Eusebius oppfører Gilon bare som hjemstedet til Ahitofel, uten å oppgi et sted. Åsene der det sto, er nå det sørlige Hebron-distriktet på Vestbredden, rundt Dhahiriya og Dura, dyrket i terrasser med vinranker og oliventrær."
  tl:
    - "Ang Gilo ay bayan sa maburol na Juda, sa distrito ng Debir, timog-kanluran ng Hebron: “Gosen, at Olon, at Gilo: labing isang bayan pati ng mga nayon ng mga yaon”. Tahanan ito ni Achitophel na ang payo ay “gaya ng kung ang isang lalake ay nagsisiyasat sa salita ng Dios”. Sa paghihimagsik sa Hebron, “pinagsuguan ni Absalom si Achitophel na Gilonita, na kasangguni ni David, mula sa kaniyang bayan, mula sa Gilo …”, at nanalangin si David na “gawing kamangmangan ang payo ni Achitophel”. Sinagot ito sa tulong ni Husai; nang “makita ni Achitophel na ang kaniyang payo ay hindi sinunod”, umuwi siya “sa kaniyang bayan at kaniyang inayos ang kaniyang bahay, at nagbigti”, at inilibing sa libingan ng ama. Isa sa tatlumpu ni David ang anak niyang si Eliam; dahil Eliam din ang ama ni Bath-sheba, inakala ng ilan na apo siya ni Achitophel, na hindi sinasabi ng teksto."
    - "Hindi pa natatagpuan ang lugar. Batay sa pangalan, matagal nang iminungkahi ang Khirbet Jala, mga 10 km sa hilaga-hilagang-kanluran ng Hebron, ngunit nasa maling distrito ito: pinagsasama ng listahan ni Josue ang Gilo at Debir, na karaniwang inilalagay ngayon sa Khirbet Rabud sa timog-kanluran ng Hebron, kaya't hinahanap ito ng iba sa lupaing iyon, malapit sa Dhahiriya, kung saan inilalagay ito ng mapa; wala pang nahukay. Ang pamayanang Gilo sa Jerusalem, na itinayo noong dekada 1970, ang kumuha ng pangalan, at hinukay roon ni Amihai Mazar noong 1978–1982 ang isang maliit na nakukutaang nayon ng ika-12 siglo BK, isa sa pinakaunang kilalang paninirahan ng Israel; ito ay sariling tuklas, hindi ang Gilo ni Achitophel, na malayo sa timog."
    - "Inililista ni Eusebio ang Gilon bilang tahanan lamang ni Achitophel, nang walang lugar. Ang mga burol kung saan ito nakatayo ay ang timog na distrito ng Hebron ng West Bank ngayon, sa paligid ng Dhahiriya at Dura, na sinasaka sa mga hagdang-hagdang ubasan at olibohan."
  da:
    - "Gilo var en by i Judas bjergland, opført i Debir-distriktet med »Gosen og Holon og Gilo; elleve Stæder og deres Landsbyer«, sydvest for Hebron. Den huskes som Akitofels hjemby, hvis råd »var, ligesom man havde adspurgt Gud om en Ting«. Da Absalon rejste sit oprør i Hebron, sendte han bud »til Giloniteren Akitofel, Davids Raadgiver, for at hente ham fra hans Stad Gilo, medens han ofrede Offeret«, og David bad: »Herre, gør dog Akitofels Raad til Daarlighed!« Bønnen blev hørt gennem Husjaj; da Akitofel »saa, at man ikke havde gjort efter hans Raad«, drog han hjem »til sit Hus, til sin Stad, og beskikkede sit Hus og hængte sig«, og blev begravet i sin fars grav. Hans søn Eliam er blandt Davids tredive; da Batsebas far også hed Eliam, har nogle formodet, at Akitofel var hendes bedstefar, hvad teksten ikke siger."
    - "Stedet er ikke fundet. På grundlag af navnet har Khirbet Jala, omkring 10 km nord-nordvest for Hebron, længe været foreslået, men den ligger i det forkerte distrikt: Josvas liste grupperer Gilo med Debir, nu almindeligvis placeret ved Khirbet Rabud sydvest for Hebron, så andre søger den i det land, nær Dhahiriya, hvor kortet placerer den; intet er udgravet. Jerusalems kvarter Gilo, bygget i 1970'erne, tog navnet, og Amihai Mazar gravede der i 1978–1982 en lille befæstet landsby fra 1100-tallet f.Kr., en af de tidligste kendte israelitiske bosættelser; det er et fund for sig, ikke Akitofels Gilo, som lå langt mod syd."
    - "Eusebios opregner Gilon kun som Akitofels hjemsted, uden et sted. Bjergene, hvor den lå, er nu det sydlige Hebron-distrikt på Vestbredden, omkring Dhahiriya og Dura, dyrket i terrasser med vinstokke og oliven."
  sr:
    - "Гилон је био град у јудејској гори, наведен у крају Давира са „Госен и Олон и Гилон; једанаест градова са селима својим“, југозападно од Хеврона. Памти се као завичај Ахитофела, чији савет „беше као да би ко Бога упитао“. Кад је Авесалом дигао буну у Хеврону, „посла и по Ахитофела Гилоњанина, саветника Давидовог, да дође из града свог Гилона, кад приношаше жртве“, а Давид се молио: „Разбиј намеру Ахитофелову, Господе!“ Молитва је услишена преко Хусаја; Ахитофел, „видећи где се не учини како он саветова“, оседлао је магарца и отишао „кући својој, у свој град, и наредивши за своју кућу обеси се те умре“ и био погребен у гробу оца свог. Његов син Елијам је међу Давидовим тридесеторицом; пошто се и Витсавејин отац звао Елијам, неки су претпостављали да је Ахитофел био њен деда, што текст не каже."
    - "Налазиште није пронађено. На основу имена, Хирбет Џала, око 10 км северо-северозападно од Хеврона, одавно је предлаган, али лежи у погрешном крају: Исусов списак групише Гилон с Давиром, који се данас обично смешта у Хирбет Рабуд југозападно од Хеврона, па га други траже у том крају, близу Дахирије, где га карта смешта; ништа није ископавано. Јерусалимска четврт Гило, изграђена седамдесетих година, преузела је име, а Амихај Мазар ископао је ту 1978–1982. мало утврђено село из 12. века п. н. е., једно од најранијих познатих израиљских насеља; то је налаз за себе, не Гилон Ахитофелов, који је лежао далеко на југу."
    - "Јевсевије наводи Гилон само као завичај Ахитофелов, без налазишта. Брда где је стајао данас су јужни округ Хеврона на Западној обали, око Дахирије и Дуре, обрађена у терасама винограда и маслина."
  hu:
    - "Gilóh Júda hegyvidékének városa volt Hebrontól délnyugatra, Debir kerületében sorolják fel: „Gósen, Hólon és Giló. Tizenegy város és ezeknek falui.” Ahitófel lakhelyeként emlékeznek rá, akinek tanácsa „olyannak tekintetett abban az időben, mintha valaki az Isten szavát kérdezte volna”. Amikor Absolon Hebronban lázadást szított, „hivatá a Gilóból való Akhitófelt is, Dávidnak tanácsosát, az ő városából Gilóból, míg ő az áldozatot végezte”, Dávid pedig így imádkozott: „hiúsítsd meg az Akhitófel tanácsát”. Az imát Húsai révén hallgatta meg az Úr; „Látván pedig Akhitófel, hogy az ő tanácsát nem hajtották végre”, hazatért „az ő városába; és elrendezvén háznépének dolgát, megfojtá magát”, és atyja sírjába temették. Fia, Eliám Dávid harminc hőse között szerepel; mivel Betsabé apja is Eliám volt, egyesek úgy vélték, hogy Ahitófel a nagyapja volt, amit a szöveg nem mond."
    - "A lelőhelyet nem találták meg. A név alapján régóta Hirbet Dzsalát javasolták, mintegy 10 km-re észak-északnyugatra Hebrontól, de az rossz kerületben fekszik: Józsué jegyzéke Gilót Debirrel csoportosítja, amelyet ma általában a Hebrontól délnyugatra fekvő Hirbet Rabúdra helyeznek, így mások azon a tájon keresik, Dhahirije közelében, ahová a térkép teszi; ásatás nem volt. A jeruzsálemi Gilo városrész, amelyet az 1970-es években építettek, vette át a nevet, és Amihai Mazar ott 1978–1982-ben egy kis megerősített falut ásott ki a Kr. e. 12. századból, a legkorábbi ismert izraelita települések egyikét; ez önálló lelet, nem Ahitófel Gilója, amely messze délre feküdt."
    - "Eusebius Gilont csak Ahitófel lakhelyeként sorolja fel, helymeghatározás nélkül. A dombok, ahol állt, ma Ciszjordánia déli hebroni kerületéhez tartoznak, Dhahirije és Dúra körül, szőlő- és olajfateraszokon művelve."
  fi:
    - "Gilo oli kaupunki Juudan vuoristossa, luetteloitu Debirin piirissä: ”Goosen, Hoolon ja Giilo – yksitoista kaupunkia kylineen”, Hebronista lounaaseen. Se muistetaan Ahitofelin kotipaikkana, jonka neuvo ”oli siihen aikaan niinkuin Jumalalta saatu vastaus”. Kun Absalom nosti kapinansa Hebronissa, hän lähetti ”noutamaan giilolaisen Ahitofelin, Daavidin neuvonantajan, hänen kaupungistaan Giilosta”, ja Daavid rukoili: ”Herra, käännä Ahitofelin neuvo hulluudeksi”. Rukous kuultiin Husain kautta; kun Ahitofel ”näki, ettei hänen neuvoansa noudatettu”, hän ”lähti kotiinsa omaan kaupunkiinsa, ja kun hän oli toimittanut talonsa, hirttäytyi hän”, ja hänet haudattiin isänsä hautaan. Hänen poikansa Eliam on Daavidin kolmenkymmenen joukossa; koska Batseban isäkin oli Eliam, jotkut ovat olettaneet Ahitofelin olleen hänen isoisänsä, mitä teksti ei sano."
    - "Paikkaa ei ole löydetty. Nimen perusteella on pitkään ehdotettu Khirbet Jalaa, noin 10 km Hebronista pohjois-luoteeseen, mutta se on väärässä piirissä: Joosuan luettelo ryhmittelee Gilon Debirin kanssa, joka sijoitetaan nykyään yleensä Khirbet Rabudiin Hebronista lounaaseen, joten toiset etsivät sitä sieltä, Dhahiriyan läheltä, johon kartta sen sijoittaa; mitään ei ole kaivettu. Jerusalemin Gilon kaupunginosa, rakennettu 1970-luvulla, otti nimen, ja Amihai Mazar kaivoi siellä vuosina 1978–1982 pienen linnoitetun kylän 1100-luvulta eaa., yhden varhaisimmista tunnetuista israelilaisista asutuksista; se on oma löytönsä, ei Ahitofelin Gilo, joka sijaitsi kaukana etelässä."
    - "Eusebios luettelee Gilonin vain Ahitofelin kotipaikkana ilman sijaintia. Kukkulat, joilla se sijaitsi, ovat nykyään Länsirannan eteläinen Hebronin piiri Dhahiriyan ja Duran ympärillä, jossa viljellään viini- ja oliivipuuterasseja."
  vi:
    - "Ghi-lô là một thành trong miền núi Giu-đa, được liệt kê trong vùng Đê-bia với “Gô-sen, Hô-lôn, Ghi-lô: hết thảy mười một thành cùng các làng của nó”, ở phía tây nam Hếp-rôn. Thành được nhớ đến là quê của A-hi-tô-phe; người ta “coi mưu của A-hi-tô-phe như lời phán của chính Đức Chúa Trời”. Khi Áp-sa-lôm khởi loạn ở Hếp-rôn, ông “sai mời A-hi-tô-phe, là mưu sĩ của Đa-vít ở Ghi-lô, bổn thành người”, và Đa-vít cầu nguyện: “xin làm cho những mưu chước của A-hi-tô-phe ra ngu dại”. Lời cầu được đáp qua Hu-sai; khi A-hi-tô-phe “thấy người ta không theo mưu của mình, bèn thắng lừa, trở về thành mình … thì tự thắt cổ mà chết”, và “Người ta chôn người trong mộ của cha người”. Con trai ông là Ê-li-am có tên trong ba mươi dũng sĩ của Đa-vít; vì cha của Bát-Sê-ba cũng tên Ê-li-am, có người cho rằng A-hi-tô-phe là ông ngoại nàng, điều mà văn bản không nói."
    - "Địa điểm chưa được tìm thấy. Dựa vào tên, Khirbet Jala, cách Hếp-rôn khoảng 10 km về phía bắc-tây bắc, từ lâu được đề nghị, nhưng nó nằm sai vùng: bảng kê của Giô-suê nhóm Ghi-lô với Đê-bia, nay thường được đặt ở Khirbet Rabud phía tây nam Hếp-rôn, nên những người khác tìm trong vùng đó, gần Dhahiriya, nơi bản đồ đặt thành; chưa nơi nào được khai quật. Khu phố Gilo của Giê-ru-sa-lem, xây thập niên 1970, lấy tên này, và Amihai Mazar đào ở đó năm 1978–1982 một ngôi làng nhỏ có thành lũy của thế kỷ 12 TCN, một trong những khu định cư Y-sơ-ra-ên sớm nhất được biết; đó là một phát hiện riêng, không phải Ghi-lô của A-hi-tô-phe, vốn ở xa về phía nam."
    - "Eusebius chỉ liệt kê Gilon là quê của A-hi-tô-phe, không nêu địa điểm. Các đồi nơi thành đứng nay là huyện Hếp-rôn phía nam của Bờ Tây, quanh Dhahiriya và Đu-ra, được canh tác thành ruộng bậc thang nho và ô-liu."
  ro:
    - "Gilo era un oraș din regiunea muntoasă a lui Iuda, înscris în districtul Debirului împreună cu Gosen și Holon, printre unsprezece cetăți cu satele lor, la sud-vest de Hebron. E amintit ca locul de baștină al lui Ahitofel, al cărui sfat era „ca și cum cinevà ar fi întrebat cuvântul lui Dumnezeu”. Când Absalom a pornit răscoala la Hebron, l-a chemat pe Ahitofel ghiloneanul, sfetnicul lui David, din cetatea lui, din Gilo, în timp ce aducea jertfele, iar David s-a rugat: „risipește sfatul lui Ahitofel”. Rugăciunea a fost ascultată prin Hușai; când Ahitofel a văzut că „nu s’a urmat sfatul lui”, s-a dus acasă, „la cetatea sa, și a rânduit casa sa și s’a spânzurat”, și a fost îngropat în mormântul tatălui său. Fiul său Eliam se numără printre cei treizeci ai lui David; cum și tatăl Bat-Șebei se numea Eliam, unii au presupus că Ahitofel era bunicul ei, ceea ce textul nu spune."
    - "Locul nu a fost găsit. Pe baza numelui, Khirbet Jala, la circa 10 km spre nord-nord-vest de Hebron, a fost propus de mult, dar se află în districtul nepotrivit: lista lui Iosua grupează Gilo cu Debirul, plasat acum în general la Khirbet Rabud, la sud-vest de Hebron, așa că alții îl caută în acel ținut, lângă Dhahiriya, unde îl așază harta; nu s-a săpat nimic. Cartierul ierusalimitean Gilo, construit în anii 1970, a luat numele, iar Amihai Mazar a săpat acolo în 1978–1982 un mic sat fortificat din secolul al XII-lea î.Hr., una dintre cele mai vechi așezări israelite cunoscute; este o descoperire în sine, nu Gilo al lui Ahitofel, care se afla departe, spre sud."
    - "Eusebiu menționează Gilon doar ca locul de baștină al lui Ahitofel, fără a-i indica locul. Dealurile unde se afla sunt astăzi sudul districtului Hebron din Cisiordania, în jurul Dhahiriya și Dura, cultivate în terase de vii și măslini."
  bg:
    - "Гило беше град в Юдейската планинска област, изброен в областта на Давир — „и Гесен, и Олон, и Гило, градове единадесет, и селата им“, югозападно от Хеврон. Той е запомнен като дом на Ахитофел, чийто съвет беше „както кога би търсил някой съвет от Бога“. Когато Авесалом вдигна бунта си в Хеврон, той „покани... Ахитофела Гилонеца, Давидовия съветник, от града му, от Гило, като приносяше жъртвите“, а Давид се помоли: „осуети съвета на Ахитофела“. Молитвата беше чута чрез Хусий; когато Ахитофел „видя че съветът му не се сбъде“, той си отиде „в града си; и като нареди къщните си работи, обеси се“ и беше погребан в гроба на баща си. Синът му Елиам е сред тридесетте на Давид; понеже бащата на Вирсавия също се казваше Елиам, някои предполагат, че Ахитофел е бил неин дядо, което текстът не казва."
    - "Мястото не е открито. Въз основа на името отдавна се предлага Хирбет Джала, на около 10 км северно-северозападно от Хеврон, но то лежи в друга област: списъкът на Иисус Навин групира Гило с Давир, днес общо поставян в Хирбет Рабуд югозападно от Хеврон, затова други го търсят в онзи край, близо до Дахирия, където го поставя картата; нищо не е разкопавано. Йерусалимският квартал Гило, построен през 1970-те години, взе името, а Амихай Мазар разкопа там през 1978–1982 г. малко укрепено село от XII в. пр.н.е., едно от най-ранните известни израилски селища; то е отделна находка, а не Гило на Ахитофел, който е лежал далеч на юг."
    - "Евсевий изброява Гилон само като дом на Ахитофел, без местоположение. Хълмовете, където е стоял, днес са южната част на Хевронска област на Западния бряг, около Дахирия и Дура, обработвани на тераси с лозя и маслини."
