body:
  en:
    - "Parah was a town of Benjamin, named once in the tribe's list: “And Avim, and Parah, and Ophrah”. It is usually identified with Khirbet Ein Fara, a hilltop ruin in Wadi Fara about 5 km north-east of Anathoth, which the International Standard Bible Encyclopedia accepted “with some confidence”; yet its surface pottery shows settlement only in the Early Bronze Age and in Roman to early Islamic times. Below it the spring of Ein Fara (Hebrew Ein Prat), the uppermost and largest of the three perennial springs of Wadi Qelt, fed aqueducts to Jericho from Hasmonean times; it lies today in a nature reserve in the West Bank."
    - "In Jeremiah the prophet is told to hide his linen girdle “by Euphrates”, Hebrew Perath, and later to fetch it back, a journey of hundreds of kilometres each way; G. Lombardi has proposed that Perath here means Parah, a short walk from Jeremiah's Anathoth, with a play on the name of the great river. About 330 the monk Chariton founded here the laura of Pharan, the first of the monastic lauras of the Judaean desert, around a cave church; after 1903 Russian monks began to restore it, and it is now a skete of the Russian Ecclesiastical Mission in Jerusalem."
  ru:
    - "Фара — город Вениамина, названный однажды в списке колена: «Аввим, Фара и Офра». Его обычно отождествляют с Хирбет-Эйн-Фара — развалинами на холме в вади Фара примерно в 5 км к северо-востоку от Анафофа, что Международная стандартная библейская энциклопедия принимала «с некоторой уверенностью»; однако керамика на поверхности говорит о заселении лишь в раннем бронзовом веке и от римского до раннеисламского времени. Ниже лежит источник Айн-Фара (на иврите Эйн-Прат) — самый верхний и обильный из трёх постоянных источников вади Кельт, чья вода со времён Хасмонеев шла по водоводам к Иерихону; сегодня он в заповеднике на Западном берегу."
    - "У Иеремии пророку велено спрятать льняной пояс «у Евфрата», по-еврейски Перат, а потом забрать его — путь в сотни километров в каждую сторону; Г. Ломбарди предположил, что здесь Перат означает Фару, в недолгой ходьбе от Анафофа, родины Иеремии, с игрой слов на имени великой реки. Около 330 г. монах Харитон основал здесь лавру Фаран — первую из монашеских лавр Иудейской пустыни, вокруг пещерной церкви; после 1903 г. её начали восстанавливать русские монахи, и ныне это скит Русской духовной миссии в Иерусалиме."
  uk:
    - "Фара була містом Веніяміна, названим один раз у переліку коліна: «Авим, Фара, та Офра». Її зазвичай ототожнюють з Хірбет-Ейн-Фара, руїною на вершині пагорба у Вади-Фара приблизно за 5 км на північний схід від Анатоту, що International Standard Bible Encyclopedia прийняла «з певною впевненістю»; проте її поверхнева кераміка показує заселення лише в ранній бронзовий вік та в римський — ранньоісламський час. Нижче джерело Ейн-Фара (єврейською Ейн-Прат), найвище й найбільше з трьох постійних джерел Вади-Кельт, з хасмонейських часів живило акведуки до Єрихону; нині воно лежить у заповіднику на Західному березі."
    - "У Єремії пророкові велено сховати лляний пояс «на Евфрат», єврейською Перат, а згодом забрати його назад — подорож у сотні кілометрів в один бік; Дж. Ломбарді запропонував, що Перат тут означає Фару, на відстані короткої прогулянки від Анатоту Єремії, з грою на назві великої ріки. Близько 330 р. монах Харитон заснував тут лавру Фаран, першу з монастирських лавр Юдейської пустелі, довкола печерної церкви; після 1903 р. російські ченці почали її відновлювати, і нині це скит Російської духовної місії в Єрусалимі."
  es:
    - "Para fue una ciudad de Benjamín, nombrada una vez en la lista de la tribu: «Y Avim, y Para, y Ophra». Suele identificarse con Khirbet Ein Fara, una ruina en lo alto de una colina en el Wadi Fara, a unos 5 km al nordeste de Anatot, que la International Standard Bible Encyclopedia aceptó «con cierta confianza»; sin embargo, su cerámica de superficie muestra poblamiento solo en el Bronce Antiguo y de época romana a islámica temprana. Debajo, el manantial de Ein Fara (en hebreo Ein Prat), el más alto y mayor de los tres manantiales perennes del Wadi Qelt, alimentó acueductos hacia Jericó desde época asmonea; hoy se halla en una reserva natural de Cisjordania."
    - "En Jeremías se manda al profeta esconder su cinto de lino «al Eufrates», en hebreo Perat, y luego ir a recogerlo, un viaje de cientos de kilómetros en cada sentido; G. Lombardi ha propuesto que Perat significa aquí Para, a corta caminata de la Anatot de Jeremías, con un juego con el nombre del gran río. Hacia 330 el monje Cariton fundó aquí la laura de Farán, la primera de las lauras monásticas del desierto de Judea, en torno a una iglesia en una cueva; después de 1903 monjes rusos empezaron a restaurarla, y hoy es un skit de la Misión Eclesiástica Rusa en Jerusalén."
  pt:
    - "Pará era uma cidade de Benjamim, nomeada uma vez na lista da tribo: “Avim, Pará, Ofra”. É geralmente identificada com Khirbet Ein Fara, uma ruína no alto de uma colina no uádi Fara, cerca de 5 km a nordeste de Anatote, que a International Standard Bible Encyclopedia aceitou “com alguma confiança”; porém sua cerâmica de superfície mostra povoamento apenas na Idade do Bronze Antigo e dos períodos romano ao islâmico antigo. Abaixo dela, a nascente de Ein Fara (em hebraico Ein Prat), a mais alta e maior das três nascentes perenes do uádi Qelt, alimentou aquedutos para Jericó desde os tempos hasmoneus; fica hoje numa reserva natural da Cisjordânia."
    - "Em Jeremias, o profeta recebe a ordem de esconder seu cinto de linho “no Eufrates”, em hebraico Perath, e mais tarde de ir buscá-lo de volta, uma viagem de centenas de quilômetros em cada sentido; G. Lombardi propôs que Perath aqui significa Pará, a uma curta caminhada da Anatote de Jeremias, com um jogo com o nome do grande rio. Por volta de 330 o monge Caritão fundou aqui a laura de Faran, a primeira das lauras monásticas do deserto da Judeia, em torno de uma igreja numa caverna; depois de 1903 monges russos começaram a restaurá-la, e ela é hoje um skete da Missão Eclesiástica Russa em Jerusalém."
  de:
    - "Para war eine Stadt Benjamins, einmal in der Liste des Stammes genannt: „Avvim, Happara, Ophra“. Es wird gewöhnlich mit Chirbet Ein Fara gleichgesetzt, einer Ruine auf einer Anhöhe im Wadi Fara etwa 5 km nordöstlich von Anatot, die die International Standard Bible Encyclopedia „mit einiger Zuversicht“ annahm; doch seine Oberflächenkeramik zeigt Besiedlung nur in der Frühbronzezeit und von der römischen bis zur frühislamischen Zeit. Unterhalb davon speiste die Quelle Ein Fara (hebräisch Ein Prat), die oberste und größte der drei ganzjährigen Quellen des Wadi Qelt, seit hasmonäischer Zeit Aquädukte nach Jericho; sie liegt heute in einem Naturreservat im Westjordanland."
    - "Bei Jeremia soll der Prophet seinen leinenen Gürtel verstecken: „gehe hin an den Euphrat und verstecke ihn daselbst in einem Steinritz“, hebräisch Perat; später muss er ihn wieder holen, eine Reise von Hunderten von Kilometern in jede Richtung; G. Lombardi hat vorgeschlagen, dass Perat hier Para meint, einen kurzen Fußweg von Jeremias Anatot, mit einem Wortspiel auf den Namen des großen Flusses. Um 330 gründete hier der Mönch Chariton die Laura Pharan, die erste der Mönchslauren der judäischen Wüste, um eine Höhlenkirche; nach 1903 begannen russische Mönche, sie wiederherzustellen, und sie ist heute eine Skite der Russischen Geistlichen Mission in Jerusalem."
  fr:
    - "Para était une ville de Benjamin, nommée une fois dans la liste de la tribu : « Avvim, Para, Ophra ». On l’identifie d’ordinaire avec Khirbet Ein Fara, ruine sur une hauteur de l’ouadi Fara, à environ 5 km au nord-est d’Anathoth, que l’International Standard Bible Encyclopedia acceptait « avec une certaine confiance » ; or sa céramique de surface ne montre d’habitat qu’au Bronze ancien et de l’époque romaine au début de l’époque islamique. Au-dessous, la source d’Ein Fara (en hébreu Ein Prat), la plus haute et la plus grande des trois sources pérennes de l’ouadi Qelt, alimenta des aqueducs vers Jéricho dès l’époque hasmonéenne ; elle se trouve aujourd’hui dans une réserve naturelle de Cisjordanie."
    - "Chez Jérémie, le prophète reçoit l’ordre de cacher sa ceinture de lin « près de l’Euphrate », en hébreu Perath, puis d’aller la rechercher, voyage de centaines de kilomètres dans chaque sens ; G. Lombardi a proposé que Perath désigne ici Para, à quelques pas de l’Anathoth de Jérémie, avec un jeu sur le nom du grand fleuve. Vers 330, le moine Chariton fonda ici la laure de Pharan, première des laures monastiques du désert de Judée, autour d’une église-grotte ; après 1903, des moines russes commencèrent à la restaurer, et elle est aujourd’hui un skite de la Mission ecclésiastique russe à Jérusalem."
  it:
    - "Para era una città di Beniamino, nominata una sola volta nell’elenco della tribù: «Avvim, Para, Ofra». È di solito identificata con Khirbet Ein Fara, una rovina in cima a un colle nel Wadi Fara a circa 5 km a nord-est di Anatot, che la International Standard Bible Encyclopedia accettò «con una certa sicurezza»; tuttavia la sua ceramica di superficie mostra un insediamento solo nell’antica età del Bronzo e dall’epoca romana all’alto periodo islamico. Sotto di essa la sorgente di Ein Fara (in ebraico Ein Prat), la più alta e più grande delle tre sorgenti perenni del Wadi Qelt, alimentò acquedotti verso Gerico fin dall’epoca asmonea; oggi si trova in una riserva naturale in Cisgiordania."
    - "In Geremia il profeta riceve l’ordine di nascondere la sua cintura di lino «verso l’Eufrate», in ebraico Perat, e più tardi di andare a riprenderla, un viaggio di centinaia di chilometri all’andata e al ritorno; G. Lombardi ha proposto che Perat significhi qui Para, a breve distanza a piedi dall’Anatot di Geremia, con un gioco sul nome del grande fiume. Verso il 330 il monaco Cariton vi fondò la laura di Faran, la prima delle laure monastiche del deserto di Giudea, attorno a una chiesa rupestre; dopo il 1903 monaci russi cominciarono a restaurarla, ed è ora uno skit della Missione ecclesiastica russa a Gerusalemme."
  nl:
    - "Para was een stad van Benjamin, eenmaal genoemd in de lijst van de stam: “En Haavvim, en Para, en Ofra”. Het wordt gewoonlijk vereenzelvigd met Khirbet Ein Fara, een ruïne op een heuveltop in de Wadi Fara ongeveer 5 km ten noordoosten van Anatot, die de International Standard Bible Encyclopedia “met enig vertrouwen” aanvaardde; toch toont het oppervlakteaardewerk alleen bewoning in de vroege bronstijd en van de Romeinse tot de vroeg-islamitische tijd. Eronder voedde de bron van Ein Fara (Hebreeuws Ein Prat), de hoogstgelegen en grootste van de drie bronnen met jaarrond water van de Wadi Qelt, vanaf de Hasmonese tijd aquaducten naar Jericho; zij ligt tegenwoordig in een natuurreservaat op de Westelijke Jordaanoever."
    - "In Jeremia krijgt de profeet de opdracht zijn linnen gordel bij de Eufraat (Hebreeuws Perath) te verbergen en later terug te halen, een reis van honderden kilometers heen en terug; G. Lombardi heeft voorgesteld dat Perath hier Para betekent, een korte wandeling van Jeremia's Anatot, met een woordspeling op de naam van de grote rivier. Omstreeks 330 stichtte de monnik Chariton hier de laura van Pharan, de eerste van de monastieke laura's van de Judese woestijn, rond een grotkerk; na 1903 begonnen Russische monniken haar te herstellen, en zij is nu een skete van de Russische Geestelijke Missie in Jeruzalem."
  pl:
    - "Para było miastem Beniamina, wymienionym raz na liście tego pokolenia: „I Awim, i Afara, i Ofera”. Utożsamia się je zwykle z Chirbet Ajn Fara, ruiną na szczycie wzgórza w Wadi Fara około 5 km na północny wschód od Anatot, co International Standard Bible Encyclopedia przyjęła „z pewną dozą przekonania”; jednak ceramika z powierzchni wskazuje osadnictwo tylko we wczesnym brązie oraz od okresu rzymskiego do wczesnoislamskiego. Poniżej źródło Ajn Fara (hebrajskie Ajn Prat), najwyższe i największe z trzech stałych źródeł Wadi Kelt, zasilało akwedukty do Jerycha od czasów hasmonejskich; leży dziś w rezerwacie przyrody na Zachodnim Brzegu."
    - "U Jeremiasza prorok ma ukryć swój lniany pas „do Eufratesa”, hebrajskie Perat, a później go przynieść z powrotem, podróż setek kilometrów w każdą stronę; G. Lombardi zaproponował, że Perat oznacza tu Parę, krótki spacer od Anatot Jeremiasza, z grą słów z nazwą wielkiej rzeki. Około 330 roku mnich Chariton założył tu ławrę Faran, pierwszą z ławr monastycznych pustyni judzkiej, wokół jaskiniowego kościoła; po 1903 roku rosyjscy mnisi zaczęli ją odnawiać i jest to dziś skit Rosyjskiej Misji Duchownej w Jerozolimie."
  cs:
    - "Para bylo město Benjamínovo, jmenované jednou v seznamu pokolení: „A Avim, též Afara a Ofra“. Obvykle se ztotožňuje s Chirbet Ejn Fara, zříceninou na návrší ve Wádí Fara asi 5 km severovýchodně od Anatótu, kterou International Standard Bible Encyclopedia přijala „s jistou důvěrou“; avšak její povrchová keramika ukazuje osídlení jen v rané době bronzové a od římského do raně islámského období. Pod ní pramen Ejn Fara (hebrejsky Ejn Prat), nejvyšší a největší ze tří stálých pramenů Wádí Kelt, napájel akvadukty do Jericha od hasmonejské doby; leží dnes v přírodní rezervaci na Západním břehu."
    - "U Jeremjáše dostává prorok příkaz ukrýt lněný pás „k Eufrates“, hebrejsky Perat, a později jej přinést zpět, což je cesta stovek kilometrů tam i zpět; G. Lombardi navrhl, že Perat zde znamená Paru, krátkou procházku od Jeremjášova Anatótu, s hrou na jméno velké řeky. Kolem roku 330 založil mnich Chariton na tomto místě lávru Faran, první z mnišských lávr Judské pouště, kolem jeskynního kostela; po roce 1903 ji začali ruští mniši obnovovat a dnes je skitem Ruské duchovní misie v Jeruzalémě."
