# Overview article (ADR 0007). Parah of Benjamin = Khirbet Ein Fara near the spring at the head of Wadi Qelt (ISBE, Koenen; the map's point), with the caveat that its surface pottery shows no Iron Age; Lombardi's reading of Parah for "Perath" in Jer 13 is shown as a proposal; Chariton's laura of Pharan follows the CMHL database.
id: parah
