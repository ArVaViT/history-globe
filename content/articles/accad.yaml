body:
  en:
    - "Accad, in Akkadian Agade, was the royal city of Sargon, who about 2300 BC built the first empire to unite Mesopotamia; it gave its name to the land of Akkad, the northern half of Babylonia, and to the Akkadian language. The city itself has never been found. Many scholars look for it on or east of the Tigris between Samarra and Baghdad. Harvey Weiss proposed Ishan Mizyad near Kish, where tablets of the Akkadian period were found; Christophe Wall-Romana proposed Tell Muhammad in Baghdad, near the mouth of the Diyala, which however has yielded no remains of that age; and W. H. Lane looked for it at El Sanam south of Samarra, where Claudius Rich saw in 1821 the base of an Old Akkadian statue, now in the British Museum. The point on the map is therefore only approximate."
    - "Genesis names Accad once, among the first cities of Nimrod, “a mighty hunter before the LORD”: “the beginning of his kingdom was Babel, and Erech, and Accad, and Calneh, in the land of Shinar”. Babel and Erech are Babylon and Uruk, and the verse thus remembers Accad among the ancient royal cities of Babylonia, where its name lived on long after its empire in the royal title “king of Sumer and Akkad”."
    - "Inscriptions of the Akkadian kings, known mostly from later copies, tell that Sargon moored ships from Meluhha, Magan and Dilmun at the quay of Agade, and that after Naram-Sin crushed a great revolt the citizens built him a temple in the city as their god. A Sumerian poem, the Curse of Agade, blames Naram-Sin for the ruin of Enlil's temple at Nippur and tells of the city's fall before the Gutians. Yet Agade lived on: the prologue of Hammurabi's laws mentions the temple Eulmash of Ishtar there, letters to Esarhaddon in the seventh century BC report from the city, and the Cyrus Cylinder, written after Cyrus took Babylon in 539 BC, still lists Agade among the cities whose gods Cyrus returned."
  ru:
    - "Аккад, по-аккадски Агаде, был царским городом Саргона, который ок. 2300 г. до н. э. создал первую державу, объединившую Месопотамию; от него получили имя земля Аккад, северная половина Вавилонии, и аккадский язык. Сам город так и не найден. Многие учёные ищут его на Тигре или к востоку от него, между Самаррой и Багдадом. Харви Вайс предложил Ишан-Мизьяд у Киша, где найдены таблички аккадской эпохи; Кристоф Валь-Романа — Телль-Мухаммад в Багдаде, у устья Диялы, который, однако, не дал остатков этого времени; У. Х. Лейн искал его в Эль-Санаме к югу от Самарры, где Клавдий Рич в 1821 г. видел основание староаккадской статуи, ныне в Британском музее. Поэтому точка на карте лишь приблизительна."
    - "Книга Бытия называет Аккад один раз, среди первых городов Нимрода, который «был сильный зверолов пред Господом Богом»: «Царство его вначале составляли: Вавилон, Эрех, Аккад и Халне в земле Сеннаар». Вавилон и Эрех — это Вавилон и Урук, и стих, таким образом, помнит Аккад среди древних царских городов Вавилонии, где его имя пережило державу в царском титуле «царь Шумера и Аккада»."
    - "Надписи аккадских царей, известные в основном по поздним копиям, говорят, что Саргон швартовал у пристани Агаде корабли из Мелуххи, Магана и Дильмуна, а после того как Нарам-Суэн подавил великое восстание, горожане построили ему в городе храм как своему богу. Шумерская поэма «Проклятие Агаде» винит Нарам-Суэна в разорении храма Энлиля в Ниппуре и рассказывает о падении города перед гутиями. И всё же Агаде продолжал жить: пролог законов Хаммурапи упоминает там храм Иштар Эульмаш, письма к Асархаддону в VII в. до н. э. приходят из этого города, а цилиндр Кира, написанный после взятия Вавилона в 539 г. до н. э., ещё называет Агаде среди городов, чьих богов Кир вернул на место."
  uk:
    - "Аккад, по-аккадськи Агаде, був царським містом Саргона, який близько 2300 р. до н. е. створив першу імперію, що об'єднала Месопотамію; місто дало назву краю Аккад, північній половині Вавилонії, та аккадській мові. Саме місто так і не знайдено. Багато вчених шукають його на Тигрі або на схід від нього між Самаррою та Багдадом. Гарві Вайс запропонував Ішан-Мізйад поблизу Кіша, де знайшли таблички аккадської доби; Крістоф Валь-Романа — Телль-Мухаммад у Багдаді, біля гирла Діяли, який, однак, не дав залишків тієї доби; а В. Г. Лейн шукав його в Ель-Санамі на південь від Самарри, де 1821 р. Клавдій Річ бачив основу староаккадської статуї, нині в Британському музеї. Тож точка на мапі лише приблизна."
    - "Книга Буття згадує Аккад один раз, серед перших міст Німрода, який був «велетень ловець перед Господом»: «Царюваннє ж його роспростерлось на Бабилон, і Ерех, і Аккад, і Калне у Синеяр землї». Бабіль і Ерех — це Вавилон і Урук, і вірш таким чином пам'ятає Аккад серед давніх царських міст Вавилонії, де його ім'я жило ще довго після загибелі його імперії у царському титулі «цар Шумеру й Аккаду»."
    - "Написи аккадських царів, відомі здебільшого за пізнішими копіями, розповідають, що Саргон причалював кораблі з Мелухи, Магану й Дільмуна до пристані Агаде і що після того, як Нарам-Суен придушив велике повстання, городяни збудували йому в місті храм як своєму богові. Шумерська поема «Прокляття Агаде» звинувачує Нарам-Суена в руйнуванні храму Енліля в Ніппурі й розповідає про падіння міста перед гутіями. Проте Агаде жило далі: пролог законів Хаммурапі згадує тамтешній храм Ульмаш богині Іштар, листи до Асархаддона в VII ст. до н. е. повідомляють з міста, а Циліндр Кіра, написаний після взяття Вавилона Киром 539 р. до н. е., усе ще називає Агаде серед міст, чиїх богів Кір повернув."
  es:
    - "Acad, en acadio Agadé, fue la ciudad real de Sargón, que hacia 2300 a. C. construyó el primer imperio que unió Mesopotamia; dio nombre a la tierra de Acad, la mitad septentrional de Babilonia, y a la lengua acadia. La ciudad misma nunca ha sido hallada. Muchos estudiosos la buscan en el Tigris o al este de él, entre Samarra y Bagdad. Harvey Weiss propuso Ishan Mizyad, cerca de Kish, donde aparecieron tablillas de época acadia; Christophe Wall-Romana propuso Tell Muhammad, en Bagdad, junto a la desembocadura del Diyala, que sin embargo no ha dado restos de esa época; y W. H. Lane la buscó en El Sanam, al sur de Samarra, donde Claudius Rich vio en 1821 la base de una estatua paleoacadia, hoy en el Museo Británico. El punto del mapa es, pues, solo aproximado."
    - "El Génesis nombra Acad una sola vez, entre las primeras ciudades de Nimrod, «vigoroso cazador delante de Jehová»: «la cabecera de su reino Babel, y Erech, y Accad, y Calneh, en la tierra de Shinar». Babel y Erec son Babilonia y Uruk, y el versículo recuerda así a Acad entre las antiguas ciudades reales de Babilonia, donde su nombre sobrevivió mucho después de su imperio en el título real «rey de Sumer y Acad»."
    - "Las inscripciones de los reyes acadios, conocidas sobre todo por copias posteriores, cuentan que Sargón amarró en el muelle de Agadé naves de Meluhha, Magan y Dilmun, y que, después de que Naram-Sin aplastara una gran revuelta, los ciudadanos le construyeron en la ciudad un templo como a su dios. Un poema sumerio, la Maldición de Agadé, culpa a Naram-Sin de la ruina del templo de Enlil en Nippur y relata la caída de la ciudad ante los guteos. Sin embargo, Agadé siguió viviendo: el prólogo de las leyes de Hammurabi menciona allí el templo Eulmash de Ishtar, cartas dirigidas a Esar-hadón en el siglo VII a. C. dan noticias desde la ciudad, y el Cilindro de Ciro, escrito después de que Ciro tomara Babilonia en 539 a. C., aún enumera Agadé entre las ciudades cuyos dioses Ciro devolvió."
  pt:
    - "Acade, em acádio Agade, foi a cidade real de Sargão, que por volta de 2300 a.C. formou o primeiro império a unir a Mesopotâmia; deu nome à terra de Acade, a metade norte da Babilônia, e à língua acádica. A cidade em si nunca foi encontrada. Muitos estudiosos a procuram no Tigre ou a leste dele, entre Samarra e Bagdá. Harvey Weiss propôs Ishan Mizyad, perto de Quis, onde foram achadas tabuinhas do período acádico; Christophe Wall-Romana propôs Tell Muhammad, em Bagdá, perto da foz do Diyala, que porém não forneceu restos daquela época; e W. H. Lane a procurou em El Sanam, ao sul de Samarra, onde Claudius Rich viu em 1821 a base de uma estátua do acádico antigo, hoje no Museu Britânico. O ponto no mapa é, portanto, apenas aproximado."
    - "Gênesis menciona Acade uma só vez, entre as primeiras cidades de Ninrode, “um poderoso caçador diante do SENHOR”: “O princípio do seu reino foi Babel, Ereque, Acade e Calné, na terra de Sinar”. Babel e Ereque são Babilônia e Uruk, e o versículo recorda assim Acade entre as antigas cidades reais da Babilônia, onde seu nome sobreviveu muito tempo depois de seu império, no título real “rei de Sumer e Acade”."
    - "Inscrições dos reis acádios, conhecidas sobretudo por cópias posteriores, contam que Sargão atracou no cais de Agade navios de Meluhha, Magan e Dilmun, e que, depois de Naram-Sin esmagar uma grande revolta, os cidadãos lhe construíram na cidade um templo como seu deus. Um poema sumério, a Maldição de Agade, culpa Naram-Sin pela ruína do templo de Enlil em Nipur e narra a queda da cidade diante dos gútios. Contudo, Agade continuou a existir: o prólogo das leis de Hamurabi menciona ali o templo Eulmash de Ishtar, cartas a Esar-Hadom, no século VII a.C., dão notícias da cidade, e o Cilindro de Ciro, escrito depois que Ciro tomou a Babilônia em 539 a.C., ainda inclui Agade entre as cidades cujos deuses Ciro devolveu."
  de:
    - "Akkad, akkadisch Agade, war die Königsstadt Sargons, der um 2300 v. Chr. das erste Reich errichtete, das Mesopotamien einte; sie gab dem Land Akkad, der nördlichen Hälfte Babyloniens, und der akkadischen Sprache den Namen. Die Stadt selbst ist nie gefunden worden. Viele Gelehrte suchen sie am oder östlich des Tigris zwischen Samarra und Bagdad. Harvey Weiss schlug Ishan Mizyad bei Kisch vor, wo Tafeln aus akkadischer Zeit gefunden wurden; Christophe Wall-Romana schlug Tell Muhammad in Bagdad nahe der Mündung der Diyala vor, das jedoch keine Überreste aus jener Zeit geliefert hat; und W. H. Lane suchte sie in El Sanam südlich von Samarra, wo Claudius Rich 1821 den Sockel einer altakkadischen Statue sah, die heute im Britischen Museum steht. Der Punkt auf der Karte ist daher nur ungefähr."
    - "Das Erste Buch Mose nennt Akkad einmal, unter den ersten Städten Nimrods, der „ein gewaltiger Jäger vor dem HERRN“ war: „Und der Anfang seines Reiches war Babel, Erech, Akkad und Chalne im Lande Sinear.“ Babel und Erech sind Babylon und Uruk, und der Vers erinnert so an Akkad unter den alten Königsstädten Babyloniens, wo sein Name lange nach dem Ende seines Reiches im Königstitel „König von Sumer und Akkad“ fortlebte."
    - "Inschriften der akkadischen Könige, meist aus späteren Abschriften bekannt, berichten, dass Sargon am Kai von Agade Schiffe aus Meluhha, Magan und Dilmun festmachen ließ und dass die Bürger Naram-Sin, nachdem er einen großen Aufstand niedergeschlagen hatte, in der Stadt einen Tempel als ihrem Gott bauten. Ein sumerisches Gedicht, der Fluch über Agade, gibt Naram-Sin die Schuld am Untergang des Tempels Enlils in Nippur und erzählt vom Fall der Stadt vor den Gutiern. Dennoch bestand Agade fort: Der Prolog der Gesetze Hammurabis nennt dort den Tempel Eulmasch der Ischtar, Briefe an Asarhaddon im siebten Jahrhundert v. Chr. melden sich aus der Stadt, und der Kyros-Zylinder, nach Kyros' Einnahme Babylons 539 v. Chr. geschrieben, zählt Agade noch unter den Städten auf, deren Götter Kyros zurückbrachte."
  fr:
    - "Accad, en akkadien Agadé, fut la cité royale de Sargon, qui vers 2300 av. J.-C. fonda le premier empire à unir la Mésopotamie ; elle donna son nom au pays d’Akkad, moitié nord de la Babylonie, et à la langue akkadienne. La ville elle-même n’a jamais été retrouvée. Bien des savants la cherchent sur le Tigre ou à l’est, entre Samarra et Bagdad. Harvey Weiss a proposé Ishan Mizyad près de Kis, où l’on a trouvé des tablettes de l’époque akkadienne ; Christophe Wall-Romana, Tell Muhammad à Bagdad, près de l’embouchure de la Diyala, qui n’a toutefois livré aucun vestige de cet âge ; et W. H. Lane l’a cherchée à El Sanam, au sud de Samarra, où Claudius Rich vit en 1821 la base d’une statue vieil-akkadienne, aujourd’hui au British Museum. Le point sur la carte n’est donc qu’approximatif."
    - "La Genèse nomme Accad une seule fois, parmi les premières villes de Nimrod, « un vaillant chasseur devant l’Éternel » : « Il régna d’abord sur Babel, Érec, Accad et Calné, au pays de Schinear. » Babel et Érec sont Babylone et Uruk, et le verset garde ainsi le souvenir d’Accad parmi les anciennes villes royales de la Babylonie, où son nom survécut longtemps à son empire dans le titre royal « roi de Sumer et d’Akkad »."
    - "Les inscriptions des rois d’Akkad, connues surtout par des copies tardives, racontent que Sargon amarra à l’embarcadère d’Agadé des navires de Meluhha, de Magan et de Dilmun, et qu’après que Naram-Sin eut écrasé une grande révolte les citoyens lui bâtirent dans la ville un temple, comme à leur dieu. Un poème sumérien, la Malédiction d’Agadé, rend Naram-Sin responsable de la ruine du temple d’Enlil à Nippur et raconte la chute de la ville devant les Gutis. Pourtant Agadé survécut : le prologue des lois de Hammurabi mentionne l’Eulmash d’Ishtar qui s’y trouve, des lettres à Esar-Haddon, au VIIe siècle av. J.-C., en font état, et le Cylindre de Cyrus, rédigé après la prise de Babylone en 539 av. J.-C., range encore Agadé parmi les villes dont Cyrus rendit les dieux."
  it:
    - "Accad, in accadico Agade, fu la città regale di Sargon, che verso il 2300 a.C. costruì il primo impero a unire la Mesopotamia; diede il nome al paese di Accad, la metà settentrionale della Babilonia, e alla lingua accadica. La città stessa non è mai stata trovata. Molti studiosi la cercano sul Tigri o a est di esso, tra Samarra e Baghdad. Harvey Weiss propose Ishan Mizyad presso Kish, dove furono trovate tavolette dell’epoca accadica; Christophe Wall-Romana propose Tell Muhammad a Baghdad, presso la foce del Diyala, che tuttavia non ha restituito resti di quell’età; e W. H. Lane la cercò a El Sanam, a sud di Samarra, dove nel 1821 Claudius Rich vide la base di una statua paleoaccadica, oggi al British Museum. Il punto sulla carta è dunque solo approssimativo."
    - "La Genesi nomina Accad una sola volta, tra le prime città di Nimrod, «potente cacciatore nel cospetto dell’Eterno»: «il principio del suo regno fu Babel, Erec, Accad e Calne nel paese di Scinear». Babel ed Erec sono Babilonia e Uruk, e il versetto ricorda così Accad tra le antiche città regali della Babilonia, dove il suo nome sopravvisse a lungo al suo impero nel titolo regale «re di Sumer e di Accad»."
    - "Le iscrizioni dei re accadici, note per lo più da copie più tarde, narrano che Sargon ormeggiava alla banchina di Agade le navi di Meluhha, Magan e Dilmun e che, dopo che Naram-Sin ebbe schiacciato una grande rivolta, i cittadini gli costruirono nella città un tempio come al loro dio. Un poema sumerico, la Maledizione di Agade, incolpa Naram-Sin della rovina del tempio di Enlil a Nippur e racconta la caduta della città davanti ai Gutei. Eppure Agade sopravvisse: il prologo del codice di Hammurabi menziona il tempio Eulmash di Ishtar in essa, lettere ad Assaraddon del VII secolo a.C. riferiscono da quella città, e il Cilindro di Ciro, scritto dopo la presa di Babilonia da parte di Ciro nel 539 a.C., elenca ancora Agade tra le città i cui dèi Ciro restituì."
  nl:
    - "Akkad, in het Akkadisch Agade, was de koningsstad van Sargon, die omstreeks 2300 v.Chr. het eerste rijk bouwde dat Mesopotamië verenigde; het gaf zijn naam aan het land Akkad, de noordelijke helft van Babylonië, en aan de Akkadische taal. De stad zelf is nooit gevonden. Veel geleerden zoeken haar aan of ten oosten van de Tigris tussen Samarra en Bagdad. Harvey Weiss stelde Ishan Mizyad bij Kis voor, waar tabletten uit de Akkadische tijd werden gevonden; Christophe Wall-Romana stelde Tell Muhammad in Bagdad voor, bij de monding van de Diyala, die echter geen resten uit die tijd heeft opgeleverd; en W. H. Lane zocht haar bij El Sanam ten zuiden van Samarra, waar Claudius Rich in 1821 de basis van een oud-Akkadisch standbeeld zag, dat nu in het British Museum staat. De stip op de kaart is dus slechts bij benadering."
    - "Genesis noemt Akkad één keer, onder de eerste steden van Nimrod, “een geweldig jager voor het aangezicht des HEEREN”: “het beginsel zijns rijks was Babel, en Erech, en Accad, en Calne in het land Sinear”. Babel en Erech zijn Babylon en Uruk, en het vers gedenkt Akkad dus onder de oude koningssteden van Babylonië, waar zijn naam lang na het verdwijnen van zijn rijk voortleefde in de koningstitel ‘koning van Sumer en Akkad’."
    - "Inscripties van de Akkadische koningen, die vooral uit latere afschriften bekend zijn, vertellen dat Sargon schepen uit Meluhha, Magan en Dilmun aan de kade van Agade liet aanleggen, en dat de burgers na Naram-Sins onderdrukking van een grote opstand een tempel voor hem in de stad bouwden als hun god. Een Sumerisch gedicht, de Vloek over Agade, geeft Naram-Sin de schuld van de verwoesting van Enlils tempel te Nippur en verhaalt van de val van de stad voor de Gutiërs. Toch leefde Agade voort: de proloog van Hammoerabi's wetten noemt de tempel Eulmash van Ishtar aldaar, brieven aan Esarhaddon in de zevende eeuw v.Chr. melden zich vanuit de stad, en de Cyruscilinder, geschreven nadat Cyrus in 539 v.Chr. Babylon had ingenomen, noemt Agade nog onder de steden wier goden Cyrus teruggaf."
  pl:
    - "Akad, po akadyjsku Agade, był miastem królewskim Sargona, który około 2300 p.n.e. stworzył pierwsze państwo jednoczące Mezopotamię; dał on nazwę krainie Akad, północnej połowie Babilonii, i językowi akadyjskiemu. Samego miasta nigdy nie odnaleziono. Wielu uczonych szuka go nad Tygrysem lub na wschód od niego, między Samarrą a Bagdadem. Harvey Weiss wskazał Iszan Mizjad koło Kisz, gdzie znaleziono tabliczki z okresu akadyjskiego; Christophe Wall-Romana wskazał Tell Muhammad w Bagdadzie, przy ujściu Dijali, gdzie jednak nie znaleziono śladów z tej epoki; a W. H. Lane szukał go w El Sanam na południe od Samarry, gdzie w 1821 roku Claudius Rich zobaczył podstawę starej statuy akadyjskiej, dziś w Muzeum Brytyjskim. Punkt na mapie jest więc tylko przybliżony."
    - "Księga Rodzaju wymienia Akad raz, wśród pierwszych miast Nimroda, „możnego myśliwca przed obliczem Pańskiem”: „początek królestwa jego był Babel, i Erech, i Achad, i Chalne w ziemi Senaar”. Babel i Erek to Babilon i Uruk, a werset przypomina więc Akad wśród dawnych miast królewskich Babilonii, gdzie jego imię przetrwało długo po upadku jego państwa w tytule królewskim „król Sumeru i Akadu”."
    - "Napisy królów akadyjskich, znane głównie z późniejszych odpisów, opowiadają, że Sargon cumował u nabrzeża Agade statki z Meluhhy, Magan i Dilmun oraz że gdy Naram-Sin stłumił wielki bunt, mieszkańcy zbudowali mu w mieście świątynię jako bogu. Sumeryjski poemat Przekleństwo Agade obwinia Naram-Sina o zniszczenie świątyni Enlila w Nippur i opowiada o upadku miasta pod ciosami Gutejczyków. Mimo to Agade przetrwało: prolog praw Hammurabiego wspomina tamtejszą świątynię Eulmasz bogini Isztar, listy do Asarhaddona z VII w. p.n.e. są pisane z miasta, a Cylinder Cyrusa, spisany po zdobyciu Babilonu przez Cyrusa w 539 p.n.e., wciąż wymienia Agade wśród miast, którym Cyrus zwrócił bogów."
  cs:
    - "Akkad, akkadsky Agade, bylo sídelním městem Sargona, který kolem roku 2300 př. n. l. vybudoval první říši sjednocující Mezopotámii; dalo jméno zemi Akkad, severní polovině Babylonie, i akkadskému jazyku. Samo město nebylo nikdy nalezeno. Mnozí badatelé je hledají na Tigridu nebo východně od něj mezi Sámarrou a Bagdádem. Harvey Weiss navrhl Išán Mizjád poblíž Kíše, kde byly nalezeny tabulky z akkadského období; Christophe Wall-Romana navrhl Tell Muhammad v Bagdádu u ústí Dijály, který však žádné pozůstatky z oné doby nevydal; a W. H. Lane je hledal v El Sanamu jižně od Sámarry, kde Claudius Rich roku 1821 spatřil podstavec staroakkadské sochy, dnes v Britském muzeu. Bod na mapě je proto jen přibližný."
    - "Genesis jmenuje Akkad jednou, mezi prvními městy Nimroda, „silného lovce před Hospodinem“: „Počátek pak jeho království byl Babylon a Erech, Achad a Chalne, v zemi Sinear.“ Babel a Erek jsou Babylon a Uruk a verš tak připomíná Akkad mezi starými královskými městy Babylonie, kde jeho jméno žilo dlouho po zániku jeho říše v královském titulu „král Sumeru a Akkadu“."
    - "Nápisy akkadských králů, známé většinou z pozdějších opisů, vyprávějí, že Sargon uvazoval u nábřeží Agade lodě z Meluhhy, Magan a Dilmunu a že poté, co Naram-Sin potlačil velké povstání, vystavěli mu občané ve městě chrám jako svému bohu. Sumerská báseň Kletba Agade viní Naram-Sina ze zkázy Enlilova chrámu v Nippuru a vypráví o pádu města před Guti. Přesto Agade žilo dál: prolog Chammurapiho zákoníku zmiňuje tamní chrám Ištar Eulmaš, dopisy Asarhadónovi ze sedmého století př. n. l. hlásí zprávy z města a Kýrův válec, psaný po Kýrově dobytí Babylonu roku 539 př. n. l., stále vyjmenovává Agade mezi městy, jejichž bohy Kýros vrátil."
  sv:
    - "Ackad, på akkadiska Agade, var Sargons kungastad; omkring 2300 f.Kr. byggde han det första imperiet som förenade Mesopotamien, och staden gav sitt namn åt landet Akkad, Babyloniens norra hälft, och åt det akkadiska språket. Själva staden har aldrig hittats. Många forskare söker den vid eller öster om Tigris mellan Samarra och Bagdad. Harvey Weiss föreslog Ishan Mizyad nära Kish, där lertavlor från den akkadiska tiden hittades; Christophe Wall-Romana föreslog Tell Muhammad i Bagdad, nära Diyalas mynning, som dock inte har givit några lämningar från den tiden; och W. H. Lane sökte den vid El Sanam söder om Samarra, där Claudius Rich 1821 såg sockeln till en fornakkadisk staty, nu i Brittiska museet. Punkten på kartan är därför bara ungefärlig."
    - "Första Mosebok nämner Ackad en gång, bland Nimrods första städer, ”en väldig jägare inför HERREN”: ”hans rike hade sin begynnelse i Babel, Erek, Ackad och Kalne, i Sinears land”. Babel och Erek är Babylon och Uruk, och versen minns alltså Ackad bland Babyloniens forna kungastäder, där dess namn levde kvar långt efter dess imperium i kungatiteln ”kung av Sumer och Akkad”."
    - "Inskrifter av de akkadiska kungarna, mest kända från senare avskrifter, berättar att Sargon förtöjde skepp från Meluhha, Magan och Dilmun vid Agades kaj, och att medborgarna efter att Naram-Sin hade krossat ett stort uppror byggde ett tempel åt honom i staden som deras gud. En sumerisk dikt, Förbannelsen över Agade, skyller på Naram-Sin för ödeläggelsen av Enlils tempel i Nippur och berättar om stadens fall för gutéerna. Ändå levde Agade kvar: prologen till Hammurabis lagar nämner Ishtars tempel Eulmash där, brev till Esarhaddon på 600-talet f.Kr. rapporterar från staden, och Kyroscylindern, skriven sedan Kyros intagit Babylon år 539 f.Kr., räknar ännu upp Agade bland de städer vars gudar Kyros lät föra tillbaka."
  nb:
    - "Akkad, på akkadisk Agade, var kongebyen til Sargon, som omkring 2300 f.Kr. bygde det første riket som forente Mesopotamia; den ga navn til landet Akkad, den nordlige halvdelen av Babylonia, og til det akkadiske språket. Selve byen er aldri funnet. Mange forskere søker den ved eller øst for Tigris mellom Samarra og Bagdad. Harvey Weiss foreslo Ishan Mizyad nær Kisj, der man fant tavler fra den akkadiske tiden; Christophe Wall-Romana foreslo Tell Muhammad i Bagdad, nær munningen av Diyala, som imidlertid ikke har gitt levninger fra den tiden; og W. H. Lane lette etter den ved El Sanam sør for Samarra, der Claudius Rich i 1821 så sokkelen til en gammelakkadisk statue, nå i British Museum. Punktet på kartet er derfor bare omtrentlig."
    - "1. Mosebok nevner Akkad én gang, blant de første byene til Nimrod, «en veldig jeger for Herrens åsyn»: «Først hersket han over Babel og Erek og Akkad og Kalne i landet Sinear». Babel og Erek er Babylon og Uruk, og verset minnes dermed Akkad blant Babylonias eldgamle kongebyer, der navnet levde videre lenge etter riket i kongetittelen «konge av Sumer og Akkad»."
    - "Innskrifter fra de akkadiske kongene, mest kjent fra senere avskrifter, forteller at Sargon fortøyde skip fra Meluhha, Magan og Dilmun ved kaia i Agade, og at borgerne, etter at Naram-Sin hadde knust et stort opprør, bygde et tempel for ham i byen som deres gud. Et sumerisk dikt, Forbannelsen over Agade, gir Naram-Sin skylden for ødeleggelsen av Enlils tempel i Nippur og forteller om byens fall for gutierne. Likevel levde Agade videre: prologen til Hammurabis lover nevner Ishtars tempel Eulmash der, brev til Asarhaddon på 600-tallet f.Kr. rapporterer fra byen, og Kyros-sylinderen, skrevet etter at Kyros inntok Babylon i 539 f.Kr., regner fortsatt Agade blant byene hvis guder Kyros sendte tilbake."
  tl:
    - "Ang Accad, sa Acadio ay Agade, ay ang maharlikang lungsod ni Sargon, na noong mga 2300 BK ay nagtayo ng unang imperyong nagbuklod sa Mesopotamia; ibinigay nito ang pangalan sa lupain ng Acad, ang hilagang kalahati ng Babilonia, at sa wikang Acadio. Hindi pa natatagpuan ang lungsod. Hinahanap ito ng maraming iskolar sa Tigris o silangan nito sa pagitan ng Samarra at Baghdad. Iminungkahi ni Harvey Weiss ang Ishan Mizyad malapit sa Kish, kung saan natagpuan ang mga tableta ng panahong Acadio; ni Christophe Wall-Romana ang Tell Muhammad sa Baghdad, malapit sa bukana ng Diyala, na wala namang naibigay na labi ng panahong iyon; at hinanap ito ni W. H. Lane sa El Sanam sa timog ng Samarra, kung saan nakita ni Claudius Rich noong 1821 ang paanan ng isang estatwang Lumang Acadio, na nasa British Museum ngayon. Kaya tinatayang lamang ang punto sa mapa."
    - "Isang beses lamang pinangalanan ng Genesis ang Accad, sa mga unang lungsod ni Nimrod, “makapangyarihang mangangaso sa harap ng Panginoon”: “ang pinagsimulan ng kaniyang kaharian ay ang Babel, at ang Erech, at ang Accad, at ang Calneh, sa lupain ng Shinar”. Ang Babel at Erech ay ang Babilonia at Uruk, at sa gayon ay inaalala ng talata ang Accad sa mga sinaunang maharlikang lungsod ng Babilonia, kung saan nabuhay ang pangalan nito nang matagal pagkatapos ng imperyo nito sa maharlikang titulong “hari ng Sumer at Acad”."
    - "Isinasalaysay ng mga inskripsiyon ng mga haring Acadio, na kilala higit sa lahat mula sa mga huling kopya, na itinali ni Sargon sa pantalan ng Agade ang mga barko mula sa Meluhha, Magan at Dilmun, at na matapos durugin ni Naram-Sin ang isang malaking paghihimagsik ay ipinagtayo siya ng mga mamamayan ng templo sa lungsod bilang kanilang diyos. Isang tulang Sumerio, ang Sumpa ng Agade, ang sumisisi kay Naram-Sin sa pagkawasak ng templo ni Enlil sa Nippur at nagsasalaysay ng pagbagsak ng lungsod sa mga Gutian. Gayunman, nabuhay pa ang Agade: binabanggit ng paunang salita ng mga batas ni Hammurabi ang templong Eulmash ni Ishtar roon, may mga liham kay Esar-hadon noong ika-7 siglo BK na nag-uulat mula sa lungsod, at inililista pa rin ng Silindro ni Ciro, na isinulat nang kunin ni Ciro ang Babilonia noong 539 BK, ang Agade sa mga lungsod na pinagbalikan ni Ciro ng kanilang mga diyos."
  da:
    - "Akkad, på akkadisk Agade, var kongebyen for Sargon, der omkring 2300 f.Kr. byggede det første imperium, som forenede Mesopotamien; den gav navn til landet Akkad, den nordlige halvdel af Babylonien, og til det akkadiske sprog. Selve byen er aldrig fundet. Mange forskere søger den ved eller øst for Tigris mellem Samarra og Bagdad. Harvey Weiss foreslog Ishan Mizyad nær Kisj, hvor man fandt tavler fra den akkadiske tid; Christophe Wall-Romana foreslog Tell Muhammad i Bagdad, nær Diyalas munding, som dog ikke har givet levn fra den tid; og W. H. Lane søgte den ved El Sanam syd for Samarra, hvor Claudius Rich i 1821 så soklen til en gammelakkadisk statue, nu i British Museum. Punktet på kortet er derfor kun omtrentligt."
    - "Første Mosebog nævner Akkad én gang, blandt de første af Nimrods byer, »en vældig Jæger for Herrens Ansigt«: »Babel var hans Riges Begyndelse, og Erek og Akad og Kalne i Landet Sinear«. Babel og Erek er Babylon og Uruk, og verset husker således Akkad blandt Babyloniens ældgamle kongebyer, hvor dets navn levede længe efter dets imperium i kongetitlen »konge af Sumer og Akkad«."
    - "Indskrifter fra de akkadiske konger, kendt mest fra senere kopier, fortæller, at Sargon fortøjede skibe fra Meluhha, Magan og Dilmun ved kajen i Agade, og at borgerne, efter at Naram-Sin havde knust et stort oprør, byggede ham et tempel i byen som deres gud. Et sumerisk digt, Agades forbandelse, giver Naram-Sin skylden for ødelæggelsen af Enlils tempel i Nippur og fortæller om byens fald for gutæerne. Alligevel levede Agade videre: prologen til Hammurabis love nævner Ishtars tempel Eulmash dér, breve til Esarhaddon i 600-tallet f.Kr. melder fra byen, og Kyros-cylinderen, skrevet efter at Kyros indtog Babylon i 539 f.Kr., opregner stadig Agade blandt de byer, hvis guder Kyros sendte tilbage."
  sr:
    - "Акад, на акадском Агаде, био је престони град Саргона, који је око 2300. п. н. е. подигао прво царство што је ујединило Месопотамију; дао је име земљи Акад, северној половини Вавилоније, и акадском језику. Сам град никада није пронађен. Многи научници га траже на Тигру или источно од њега између Самаре и Багдада. Харви Вајс је предложио Ишан Мизијад код Киса, где су нађене плочице из акадског доба; Кристоф Вал-Романа предложио је Тел Мухамед у Багдаду, близу ушћа Дијале, који ипак није дао остатке из тог доба; а В. Х. Лејн тражио га је у Ел Санаму јужно од Самаре, где је Клаудије Рич 1821. видео подножје староакадског кипа, сада у Британском музеју. Тачка на карти је стога само приближна."
    - "Књига Постања помиње Акад једном, међу првим градовима Неврода, који је био „добар ловац пред Господом“: „А почетак царству његовом беше Вавилон и Орех и Архад и Халани у земљи Сенару.“ Бабел и Орех су Вавилон и Урук, па стих тако памти Акад међу древним престоним градовима Вавилоније, где је његово име живело дуго после његовог царства у краљевској титули „цар Сумера и Акада“."
    - "Натписи акадских владара, познати углавном из каснијих преписа, казују да је Саргон привезивао бродове из Мелухе, Магане и Дилмуна уз кеј Агадеа и да су му грађани, пошто је Нарам-Син сломио велику побуну, подигли храм у граду као свом богу. Сумерска песма, Проклетство Агадеа, криви Нарам-Сина за пропаст Енлиловог храма у Нипуру и прича о паду града пред Гутијцима. Ипак, Агаде је живео даље: у прологу Хамурабијевих закона помиње се тамошњи храм Еулмаш посвећен Иштари, писма Есарадону у 7. веку п. н. е. јављају се из града, а Киров цилиндар, написан пошто је Кир 539. п. н. е. заузео Вавилон, још увек наводи Агаде међу градовима чије је богове Кир вратио."
  hu:
    - "Akkád, akkád nyelven Agade, Szargón királyi városa volt, aki Kr. e. 2300 körül megalkotta az első, Mezopotámiát egyesítő birodalmat; nevét adta Akkád országának, Babilónia északi felének és az akkád nyelvnek. Magát a várost soha nem találták meg. Sok kutató a Tigris mentén vagy attól keletre keresi, Szamarra és Bagdad között. Harvey Weiss a Kis melletti Ishan Mizyadot javasolta, ahol akkád kori táblákat találtak; Christophe Wall-Romana a bagdadi Tell Muhammadot javasolta a Diyala torkolatánál, amely azonban nem adott ilyen korú maradványokat; W. H. Lane pedig az El Sanamban kereste, Szamarrától délre, ahol Claudius Rich 1821-ben egy óakkád szobor talapzatát látta, amely ma a British Museumban van. A térképi pont ezért csupán hozzávetőleges."
    - "A Teremtés könyve egyszer nevezi meg Akkádot, Nimród első városai között, aki „hatalmas vadász az Úr előtt”: „Az ő birodalmának kezdete volt Bábel, Erekh, Akkád és Kálnéh a Sineár földén”. Bábel és Erek Babilon és Uruk, a vers tehát Akkádot Babilónia ősi királyi városai között említi, ahol neve birodalmánál sokkal tovább élt a „Sumer és Akkád királya” királyi címben."
    - "Az akkád királyok feliratai, amelyeket többnyire későbbi másolatokból ismerünk, azt mondják el, hogy Szargón Meluhha, Magan és Dilmun hajóit kötötte ki Agade rakpartjánál, és hogy miután Naram-Szín leverte a nagy lázadást, a polgárok templomot építettek neki a városban mint istenüknek. Egy szumer költemény, Agade átka Naram-Színt okolja az Enlil nippuri temploma elpusztításáért, és elmeséli a város bukását a gutik előtt. Agade mégis tovább élt: Hammurapi törvényeinek prológusa megemlíti Istár ottani Eulmash templomát, a Kr. e. 7. századi Asszarhaddonnak szóló levelek a városból jelentenek, és a Círusz-henger, amelyet azután írtak, hogy Círusz Kr. e. 539-ben elfoglalta Babilont, még mindig felsorolja Agadét azon városok között, amelyeknek isteneit Círusz visszaadta."
  fi:
    - "Akkad, akkadiksi Agade, oli Sargonin kuninkaallinen kaupunki; hän rakensi noin 2300 eaa. ensimmäisen Mesopotamian yhdistäneen valtakunnan. Kaupunki antoi nimensä Akkadin maalle, Babylonian pohjoiselle puoliskolle, ja akkadin kielelle. Itse kaupunkia ei ole koskaan löydetty. Monet tutkijat etsivät sitä Tigrisin varrelta tai sen itäpuolelta Samarran ja Bagdadin väliltä. Harvey Weiss ehdotti Ishan Mizyadia Kisin lähellä, josta löytyi Akkadin ajan tauluja; Christophe Wall-Romana ehdotti Tell Muhammadia Bagdadissa Diyalan suun lähellä, josta ei kuitenkaan ole löytynyt tuolta ajalta jäännöksiä; ja W. H. Lane etsi sitä El Sanamista Samarran eteläpuolelta, missä Claudius Rich näki vuonna 1821 vanha-akkadilaisen patsaan jalustan, joka on nykyisin British Museumissa. Kohta kartalla on siksi vain likimääräinen."
    - "Ensimmäinen Mooseksen kirja mainitsee Akkadin kerran, Nimrodin ensimmäisten kaupunkien joukossa; Nimrod oli ”mahtava metsämies Herran edessä”: ”hänen valtakuntansa alkuna olivat Baabel, Erek, Akkad ja Kalne Sinearin maassa”. Babel ja Erek ovat Babylon ja Uruk, ja jae muistaa siten Akkadin Babylonian muinaisten kuninkaankaupunkien joukossa; sen nimi eli siellä kauan sen valtakunnan jälkeen kuninkaallisessa arvonimessä ”Sumerin ja Akkadin kuningas”."
    - "Akkadin kuninkaiden kirjoitukset, jotka tunnetaan enimmäkseen myöhemmistä jäljennöksistä, kertovat, että Sargon kiinnitti Meluhhan, Maganin ja Dilmunin laivat Agaden laituriin ja että sen jälkeen kun Naram-Sin oli kukistanut suuren kapinan, kansalaiset rakensivat hänelle kaupunkiin temppelin heidän jumalanaan. Sumerilainen runo Agaden kirous syyttää Naram-Sinia Enlilin temppelin tuhosta Nippurissa ja kertoo kaupungin kukistumisesta gutilaisten edessä. Silti Agade eli edelleen: Hammurabin lakien johdannossa mainitaan sen Ištarin temppeli Eulmash, Esarhaddonille 600-luvulla eaa. lähetetyt kirjeet raportoivat kaupungista, ja Kyyroksen sylinteri, joka kirjoitettiin Kyyroksen vallattua Babylonin 539 eaa., luettelee yhä Agaden niiden kaupunkien joukossa, joiden jumalat Kyyros palautti."
  vi:
    - "A-cát, trong tiếng Akkad là Agade, là kinh thành của Sargon, người khoảng năm 2300 TCN đã dựng nên đế quốc đầu tiên thống nhất Mê-sô-bô-ta-mi; thành đã đặt tên cho xứ Akkad, nửa phía bắc của Ba-by-lôn, và cho ngôn ngữ Akkad. Bản thân thành chưa bao giờ được tìm thấy. Nhiều học giả tìm nó trên hoặc phía đông sông Hi-đê-ke giữa Samarra và Baghdad. Harvey Weiss đề xuất Ishan Mizyad gần Kish, nơi tìm thấy các bảng đất sét thời Akkad; Christophe Wall-Romana đề xuất Tell Muhammad ở Baghdad, gần cửa sông Diyala, nhưng nơi này chưa cho ra di tích nào của thời đó; còn W. H. Lane tìm nó tại El Sanam phía nam Samarra, nơi Claudius Rich năm 1821 đã thấy phần đế của một bức tượng thời Akkad cổ, nay ở Bảo tàng Anh. Vì vậy điểm trên bản đồ chỉ mang tính gần đúng."
    - "Sáng Thế Ký nhắc đến A-cát một lần, trong số những thành đầu tiên của Nim-rốt, “một tay thợ săn can đảm trước mặt Đức Giê-hô-va”: “Nước người sơ-lập là Ba-bên, Ê-rết, A-cát và Ca-ne ở tại xứ Si-nê-a”. Ba-bên và Ê-rết là Ba-by-lôn và Uruk, và như vậy câu này nhắc đến A-cát trong số những kinh thành cổ của Ba-by-lôn, nơi tên của nó còn sống rất lâu sau khi đế quốc của nó tàn, trong tước hiệu hoàng gia “vua xứ Sumer và Akkad”."
    - "Các bia văn của các vua Akkad, phần lớn được biết qua các bản sao muộn hơn, kể rằng Sargon cho tàu từ Meluhha, Magan và Dilmun cập bến tại bến cảng của Agade, và rằng sau khi Naram-Sin dẹp tan một cuộc nổi dậy lớn, các công dân đã xây cho ông một đền thờ trong thành như một vị thần của họ. Một bài thơ Sumer, Lời nguyền của Agade, đổ lỗi cho Naram-Sin về việc đền của Enlil tại Nippur bị hủy hoại và kể về việc thành sụp đổ trước người Gutium. Tuy vậy Agade vẫn tồn tại: phần mở đầu bộ luật Hammurabi nhắc đến đền Eulmash của Ishtar tại đó, các bức thư gửi Ê-sạt-ha-đôn vào thế kỷ 7 TCN có báo cáo từ thành này, và Trụ Si-ru, được viết sau khi Si-ru chiếm Ba-by-lôn năm 539 TCN, vẫn liệt kê Agade trong số các thành mà Si-ru đã trả lại các thần."
  ro:
    - "Acad, în akkadiană Agade, era cetatea regală a lui Sargon, care în jurul anului 2300 î.Hr. a întemeiat primul imperiu ce a unit Mesopotamia; ea a dat numele țării Akkad, jumătatea de nord a Babiloniei, și limbii akkadiene. Cetatea însăși nu a fost niciodată găsită. Mulți cercetători o caută pe Tigru sau la est de el, între Samarra și Bagdad. Harvey Weiss a propus Ishan Mizyad, lângă Chiș, unde s-au găsit tăblițe din epoca akkadiană; Christophe Wall-Romana a propus Tell Muhammad din Bagdad, lângă vărsarea Diyalei, care însă nu a dat vestigii din acea epocă; iar W. H. Lane a căutat-o la El Sanam, la sud de Samarra, unde Claudius Rich a văzut în 1821 baza unei statui akkadiene timpurii, aflată acum la British Museum. Punctul de pe hartă este deci doar aproximativ."
    - "Geneza îl numește pe Acad o singură dată, printre primele cetăți ale lui Nimrod, un vânător puternic înaintea Domnului: „Și a fost începutul împărăției lui Vavilonul; și Oreh și Arhad și Halanii în pământul Senaar”. Babel și Erec sunt Babilonul și Uruk, iar versetul îl păstrează astfel pe Acad printre vechile cetăți regale ale Babiloniei, unde numele lui a trăit mult după imperiul său în titlul regal „rege al Sumerului și al Akkadului”."
    - "Inscripțiile regilor akkadieni, cunoscute mai ales din copii târzii, povestesc că Sargon a ancorat corăbii din Meluhha, Magan și Dilmun la cheiul Agadei și că, după ce Naram-Sin a înăbușit o mare răscoală, cetățenii i-au construit în cetate un templu, ca unui zeu al lor. Un poem sumerian, Blestemul Agadei, îl învinuiește pe Naram-Sin pentru nimicirea templului lui Enlil de la Nippur și povestește căderea cetății în fața gutienilor. Totuși Agade a continuat să trăiască: prologul legilor lui Hammurabi pomenește acolo templul Eulmaș al Ishtarei, scrisori către Esar-Hadon din secolul al VII-lea î.Hr. sunt trimise din cetate, iar Cilindrul lui Cir, scris după ce Cir a luat Babilonul în 539 î.Hr., încă enumeră Agade printre cetățile ai căror zei i-a înapoiat Cir."
  bg:
    - "Акад, на акадски Агаде, бил царският град на Саргон, който около 2300 г. пр.н.е. създал първата империя, обединила Месопотамия; градът дал името си на земята Акад, северната половина на Вавилония, и на акадския език. Самият град никога не е намерен. Много изследователи го търсят по или източно от Тигър между Самара и Багдад. Харви Уайс предлагал Ишан Мизяд близо до Киш, където са намерени плочки от акадския период; Кристоф Уол-Романа предлагал Тел Мухамад в Багдад, близо до устието на Дияла, който обаче не е дал останки от онази епоха; а У. Х. Лейн го търсел при Ел Санам южно от Самара, където Клавдий Рич видял през 1821 г. основата на староакадска статуя, днес в Британския музей. Затова точката на картата е само приблизителна."
    - "Битие назовава Акад веднъж, сред първите градове на Нимрод, „силен ловец пред Господа“: „И началото на царството му бе Вавилон, и Ерех, и Акад, и Халне в земята Сенаар“. Първите два града са Вавилон и Урук, а стихът така споменава Акад сред древните царски градове на Вавилония, където името му живяло дълго след империята му в царската титла „цар на Шумер и Акад“."
    - "Надписите на акадските царе, известни най-вече от по-късни преписи, разказват, че Саргон връзвал при кея на Агаде кораби от Мелуха, Маган и Дилмун и че след като Нарам-Син смазал голямо въстание, гражданите му построили в града храм като на техен бог. Шумерска поема, „Проклятието на Агаде“, обвинява Нарам-Син за разрушаването на храма на Енлил в Нипур и разказва за падането на града пред гутите. И все пак Агаде продължил да живее: прологът на законите на Хамурапи споменава там храма Еулмаш на Ищар, писма до Асардан през VII в. пр.н.е. съобщават от града, а Цилиндърът на Кир, написан след превземането на Вавилон от Кир през 539 г. пр.н.е., още изброява Агаде сред градовете, чиито богове Кир върнал."
