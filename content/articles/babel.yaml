body:
  en:
    - "Babel is the Hebrew name of Babylon, used in the first chapters of Genesis for the city on the Euphrates in the land of Shinar, southern Mesopotamia. In the table of nations it is the first city of Nimrod: “the beginning of his kingdom was Babel, and Erech, and Accad, and Calneh, in the land of Shinar”. In the next chapter men who spoke one language settled in Shinar and said, “let us build us a city and a tower, whose top may reach unto heaven”; the LORD came down, confused their speech and scattered them, “and they left off to build the city”. The story explains the name by a play on words: “Therefore is the name of it called Babel; because the LORD did there confound the language of all the earth”, Hebrew balal meaning “to confuse”. The Babylonians themselves understood Bab-ili as “the gate of the god”."
    - "Many scholars see behind the story the great temple tower of Babylon, Etemenanki, “the house, foundation of heaven and earth”, a stepped ziggurat about 90 m square at its base, rebuilt by Nabopolassar and Nebuchadnezzar II and described by Herodotus; its foundations remain in the ruins, but the dating of the Genesis story and its exact model are debated. The ruins of Babylon lie today near Hillah in Iraq, a World Heritage site since 2019; the later history of the city is told under Babylon."
  ru:
    - "Вавилон первых глав книги Бытия — еврейское Бавель, город на Евфрате в земле Сеннаар, на юге Месопотамии. В родословии народов это первый город Нимрода: «Царство его вначале составляли: Вавилон, Эрех, Аккад и Халне в земле Сеннаар». В следующей главе люди, говорившие на одном языке, поселились в Сеннааре и сказали: «построим себе город и башню, высотою до небес»; Господь сошёл, смешал их язык и рассеял их, «и они перестали строить город и башню». Рассказ объясняет имя игрой слов: «Посему дано ему имя: Вавилон, ибо там смешал Господь язык всей земли», — по-еврейски «балал» значит «смешивать». Сами вавилоняне понимали Баб-или как «врата бога»."
    - "Многие учёные видят за этим рассказом великую храмовую башню Вавилона Этеменанки, «дом основания неба и земли», ступенчатый зиккурат около 90 м в основании, восстановленный Набопаласаром и Навуходоносором II и описанный Геродотом; её фундамент сохранился среди развалин, но время возникновения рассказа и его точный образец остаются предметом спора. Развалины Вавилона лежат сегодня близ Хиллы в Ираке и с 2019 года входят в список Всемирного наследия; дальнейшая история города рассказана в статье «Вавилон»."
  uk:
    - "Бабель — єврейська назва Вавилона, вжита в перших розділах Буття для міста на Євфраті в землі Сеннаар, у південній Месопотамії. У таблиці народів це перше місто Німрода: «Царюваннє ж його роспростерлось на Бабилон, і Ерех, і Аккад, і Калне у Синеяр землї». У наступному розділі люди, що говорили однією мовою, оселилися в Сеннаарі й казали: «Нумо споруджувати місто із баштою, щоб її верх був до небес»; Господь зійшов, змішав їхню мову й розсіяв їх, і вони «покинули споруджувати город і башту». Оповідь пояснює назву грою слів: «Тим проложено йому імя Бабель: бо там помішав Господь мову всієї землї», де єврейське балаль означає «змішувати». Самі вавилоняни розуміли Баб-ілі як «браму бога»."
    - "Багато вчених бачать за оповіддю велику храмову вежу Вавилона, Етеменанкі, «дім, основа неба і землі», ступінчастий зікурат близько 90 м у квадраті при основі, відбудований Набополасаром і Навуходоносором II та описаний Геродотом; його фундаменти лишаються в руїнах, але датування оповіді з Буття та її точний взірець дискутуються. Руїни Вавилона лежать нині біля Хілли в Іраку, об'єкт Світової спадщини від 2019 року; подальша історія міста розповідається під заголовком Вавилон."
  es:
    - "Babel es el nombre hebreo de Babilonia, usado en los primeros capítulos del Génesis para la ciudad del Éufrates en la tierra de Sinar, en el sur de Mesopotamia. En la tabla de las naciones es la primera ciudad de Nimrod: «Y fué la cabecera de su reino Babel, y Erech, y Accad, y Calneh, en la tierra de Shinar». En el capítulo siguiente, hombres que hablaban una sola lengua se establecieron en Sinar y dijeron: «Vamos, edifiquémonos una ciudad y una torre, cuya cúspide llegue al cielo»; Jehová descendió, confundió su lenguaje y los esparció, «y dejaron de edificar la ciudad». El relato explica el nombre con un juego de palabras: «Por esto fué llamado el nombre de ella Babel, porque allí confundió Jehová el lenguaje de toda la tierra», significando el hebreo balal «confundir». Los propios babilonios entendían Bab-ili como «la puerta del dios»."
    - "Muchos estudiosos ven tras el relato la gran torre-templo de Babilonia, Etemenanki, «la casa, fundamento del cielo y de la tierra», un zigurat escalonado de unos 90 m de lado en la base, reconstruido por Nabopolasar y Nabucodonosor II y descrito por Heródoto; sus cimientos subsisten entre las ruinas, pero se debate la datación del relato del Génesis y su modelo exacto. Las ruinas de Babilonia se encuentran hoy cerca de Hilla, en Irak, y son Patrimonio de la Humanidad desde 2019; la historia posterior de la ciudad se cuenta en el artículo Babilonia."
  pt:
    - "Babel é o nome hebraico de Babilônia, usado nos primeiros capítulos de Gênesis para a cidade do Eufrates na terra de Sinar, no sul da Mesopotâmia. Na tabela das nações é a primeira cidade de Ninrode: “O princípio do seu reino foi Babel, Ereque, Acade e Calné, na terra de Sinar”. No capítulo seguinte, homens de uma só língua se estabeleceram em Sinar e disseram: “Venham, vamos construir para nós uma cidade e uma torre cujo topo chegue até o céu”; o SENHOR desceu, confundiu a sua fala e os espalhou, “E eles pararam de construir a cidade”. A narrativa explica o nome por um jogo de palavras: “Por isso, o seu nome foi chamado Babel, porque ali o SENHOR confundiu a língua de toda a terra”, significando o hebraico balal “confundir”. Os próprios babilônios entendiam Bab-ili como “a porta do deus”."
    - "Muitos estudiosos veem por trás da narrativa a grande torre do templo de Babilônia, Etemenanki, “a casa, fundamento do céu e da terra”, um zigurate escalonado de cerca de 90 m de lado na base, reconstruído por Nabopolassar e Nabucodonosor II e descrito por Heródoto; seus alicerces subsistem nas ruínas, mas a datação da narrativa de Gênesis e seu modelo exato são discutidos. As ruínas de Babilônia ficam hoje perto de Hillah, no Iraque, sítio do Patrimônio Mundial desde 2019; a história posterior da cidade é contada em Babilônia."
  de:
    - "Babel ist der hebräische Name Babylons, in den ersten Kapiteln der Genesis für die Stadt am Euphrat im Land Schinar in Südmesopotamien gebraucht. In der Völkertafel ist sie die erste Stadt Nimrods: „Und der Anfang seines Reiches war Babel, Erech, Akkad und Chalne im Lande Sinear“. Im nächsten Kapitel siedelten Menschen, die eine Sprache sprachen, in Schinar und sagten: „Wohlauf, laßt uns eine Stadt und einen Turm bauen, des Spitze bis an den Himmel reiche“; der HERR fuhr herab, verwirrte ihre Sprache und zerstreute sie, „daß sie mußten aufhören die Stadt zu bauen“. Die Erzählung erklärt den Namen durch ein Wortspiel: „Daher heißt ihr Name Babel, daß der HERR daselbst verwirrt hatte aller Länder Sprache“, hebräisch balal, „verwirren“. Die Babylonier selbst verstanden Bab-ili als „Tor des Gottes“."
    - "Viele Gelehrte sehen hinter der Erzählung den großen Tempelturm Babylons, Etemenanki, „das Haus, Grundstein von Himmel und Erde“, eine Stufenzikkurat von etwa 90 m im Quadrat an der Basis, von Nabopolassar und Nebukadnezar II. erneuert und von Herodot beschrieben; seine Fundamente liegen noch in den Ruinen, doch die Datierung der Genesiserzählung und ihr genaues Vorbild sind umstritten. Die Ruinen Babylons liegen heute bei Hilla im Irak, seit 2019 Welterbestätte; die spätere Geschichte der Stadt wird unter Babylon erzählt."
  fr:
    - "Babel est le nom hébreu de Babylone, employé dans les premiers chapitres de la Genèse pour la ville sur l’Euphrate, au pays de Schinear, dans le sud de la Mésopotamie. Dans la table des nations, c’est la première ville de Nimrod : « Il régna d’abord sur Babel, Érec, Accad et Calné, au pays de Schinear ». Au chapitre suivant, des hommes parlant une même langue s’établirent en Schinear et dirent : « Allons ! Bâtissons-nous une ville et une tour dont le sommet touche au ciel » ; l’Éternel descendit, confondit leur langage et les dispersa, et « ils cessèrent de bâtir la ville ». Le récit explique le nom par un jeu de mots : « C’est pourquoi on l’appela du nom de Babel, car c’est là que l’Éternel confondit le langage de toute la terre », l’hébreu balal signifiant « confondre ». Les Babyloniens eux-mêmes comprenaient Bab-ili comme « la porte du dieu »."
    - "Beaucoup de savants voient derrière le récit la grande tour-temple de Babylone, Étemenanki, « la maison, fondement du ciel et de la terre », ziggourat à gradins d’environ 90 m de côté à la base, rebâtie par Nabopolassar et Nebucadnetsar II et décrite par Hérodote ; ses fondations subsistent dans les ruines, mais la date du récit de la Genèse et son modèle exact sont discutés. Les ruines de Babylone se trouvent aujourd’hui près de Hillah, en Irak, site du patrimoine mondial depuis 2019 ; l’histoire ultérieure de la ville est racontée à Babylone."
  it:
    - "Babel è il nome ebraico di Babilonia, usato nei primi capitoli della Genesi per la città sull’Eufrate nel paese di Sennaar, nella Mesopotamia meridionale. Nella tavola delle nazioni è la prima città di Nimrod: «E il principio del suo regno fu Babel, Erec, Accad e Calne nel paese di Scinear». Nel capitolo seguente gli uomini che parlavano una sola lingua si stabilirono in Sennaar e dissero: «Orsù, edifichiamoci una città ed una torre di cui la cima giunga fino al cielo»; il Signore discese, confuse il loro linguaggio e li disperse, «ed essi cessarono di edificare la città». Il racconto spiega il nome con un gioco di parole: «Perciò a questa fu dato il nome di Babel perché l’Eterno confuse quivi il linguaggio di tutta la terra», l’ebraico balal significando «confondere». I Babilonesi stessi intendevano Bab-ili come «la porta del dio»."
    - "Molti studiosi vedono dietro il racconto la grande torre-tempio di Babilonia, Etemenanki, «la casa, fondamento del cielo e della terra», una ziggurat a gradoni di circa 90 m di lato alla base, ricostruita da Nabopolassar e Nabucodonosor II e descritta da Erodoto; le sue fondamenta restano fra le rovine, ma la datazione del racconto della Genesi e il suo modello esatto sono discussi. Le rovine di Babilonia si trovano oggi presso Hillah in Iraq, sito del patrimonio mondiale dal 2019; la storia posteriore della città è narrata alla voce Babilonia."
  pl:
    - "Babel to hebrajska nazwa Babilonu, używana w pierwszych rozdziałach Księgi Rodzaju dla miasta nad Eufratem w ziemi Szinear, w południowej Mezopotamii. W Tablicy Ludów jest to pierwsze miasto Nimroda: „początek królestwa jego był Babel, i Erech, i Achad, i Chalne w ziemi Senaar”. W następnym rozdziale ludzie mówiący jednym językiem osiedlili się w Szinear i powiedzieli: „zbudujmy sobie miasto i wieżą, której by wierzch dosięgał do nieba”; Pan zstąpił, pomieszał ich mowę i rozproszył ich, a oni „przestali budować miasta onego”. Opowieść wyjaśnia nazwę grą słów: „Przetoż nazwał imię jego Babel; iż tam pomieszał Pan język wszystkiej ziemi”, bo hebrajskie balal znaczy „mieszać”. Sami Babilończycy rozumieli Bab-ili jako „bramę boga”."
    - "Wielu uczonych widzi za opowieścią wielką świątynną wieżę Babilonu, Etemenanki, „dom, fundament nieba i ziemi”, schodkowy zigurat o podstawie około 90 m, odbudowany przez Nabopolassara i Nabuchodonozora II i opisany przez Herodota; jego fundamenty pozostały w ruinach, lecz datowanie opowieści z Księgi Rodzaju i jej dokładny wzór są dyskutowane. Ruiny Babilonu leżą dziś koło Hilli w Iraku, od 2019 roku na Liście Światowego Dziedzictwa; dalsze dzieje miasta opowiada hasło Babilon."
  nl:
    - "Babel is de Hebreeuwse naam van Babylon, gebruikt in de eerste hoofdstukken van Genesis voor de stad aan de Eufraat in het land Sinear, Zuid-Mesopotamië. In de volkerentafel is het de eerste stad van Nimrod: “het beginsel zijns rijks was Babel, en Erech, en Accad, en Calne in het land Sinear”. In het volgende hoofdstuk vestigden mensen die één taal spraken zich in Sinear en zeiden: “Kom aan, laat ons voor ons een stad bouwen, en een toren, welks opperste in den hemel zij”; de HEER daalde neer, verwarde hun spraak en verstrooide hen, en “zij hielden op de stad te bouwen”. Het verhaal verklaart de naam met een woordspeling: “Daarom noemde men haar naam Babel; want aldaar verwarde de HEERE de spraak der ganse aarde”, Hebreeuws balal betekent “verwarren”. De Babyloniërs zelf begrepen Bab-ili als “de poort van de god”."
    - "Veel geleerden zien achter het verhaal de grote tempeltoren van Babylon, Etemenanki, “het huis, fundament van hemel en aarde”, een getrapte ziggoerat van zo’n 90 m in het vierkant aan de voet, herbouwd door Nabopolassar en Nebukadnessar II en beschreven door Herodotus; zijn fundamenten blijven in de ruïnes, maar de datering van het Genesisverhaal en zijn precieze model zijn omstreden. De ruïnes van Babylon liggen nu bij Hillah in Irak, sinds 2019 werelderfgoed; de latere geschiedenis van de stad wordt verteld onder Babylon."
  cs:
    - "Babel je hebrejské jméno Babylónu, užívané v prvních kapitolách Genesis pro město na Eufratu v zemi Šineár, v jižní Mezopotámii. V Tabulce národů je prvním městem Nimrodovým: „Počátek pak jeho království byl Babylon a Erech, Achad a Chalne, v zemi Sinear“. V následující kapitole se lidé mluvící jedním jazykem usadili v Šineáru a řekli: „Nuže, vystavějme sobě město a věži, jejíž by vrch dosahal k nebi“; Hospodin sestoupil, zmátl jejich řeč a rozptýlil je, „i přestali stavěti města toho“. Příběh vysvětluje jméno slovní hříčkou: „Protož nazváno jest jméno jeho Bábel; nebo tu zmátl Hospodin jazyk vší země“, hebrejské balal znamená „zmást“. Babyloňané sami chápali Bab-ili jako „bránu boha“."
    - "Mnozí badatelé vidí za příběhem velkou chrámovou věž Babylónu, Etemenanki, „dům, základ nebe a země“, stupňovitý zikkurat o straně asi 90 m u paty, přestavěný Nabopolassarem a Nebukadnesarem II. a popsaný Hérodotem; jeho základy zůstávají ve zříceninách, ale datování příběhu Genesis a jeho přesný vzor jsou sporné. Zříceniny Babylónu leží dnes poblíž Hilly v Iráku, od roku 2019 jsou na seznamu světového dědictví; pozdější dějiny města jsou vyprávěny pod heslem Babylón."
