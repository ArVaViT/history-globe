# Overview article (ADR 0007). Mainstream facts only; this is Babel of Genesis 10–11, the city of the tower; the history of Babylon itself has its own article; the link of the tower story to the ziggurat Etemenanki is given as a common view, not a fact.
id: babel
place: ab8fdbc
title:
  en: "Babel"
  ru: "Вавилон"
body:
  en:
    - "Babel is the Hebrew name of Babylon, used in the first chapters of Genesis for the city on the Euphrates in the land of Shinar, southern Mesopotamia. In the table of nations it is the first city of Nimrod: “the beginning of his kingdom was Babel, and Erech, and Accad, and Calneh, in the land of Shinar”. In the next chapter men who spoke one language settled in Shinar and said, “let us build us a city and a tower, whose top may reach unto heaven”; the LORD came down, confused their speech and scattered them, “and they left off to build the city”. The story explains the name by a play on words: “Therefore is the name of it called Babel; because the LORD did there confound the language of all the earth”, Hebrew balal meaning “to confuse”. The Babylonians themselves understood Bab-ili as “the gate of the god”."
    - "Many scholars see behind the story the great temple tower of Babylon, Etemenanki, “the house, foundation of heaven and earth”, a stepped ziggurat about 90 m square at its base, rebuilt by Nabopolassar and Nebuchadnezzar II and described by Herodotus; its foundations remain in the ruins, but the dating of the Genesis story and its exact model are debated. The ruins of Babylon lie today near Hillah in Iraq, a World Heritage site since 2019; the later history of the city is told under Babylon."
  ru:
    - "Вавилон первых глав книги Бытия — еврейское Бавель, город на Евфрате в земле Сеннаар, на юге Месопотамии. В родословии народов это первый город Нимрода: «Царство его вначале составляли: Вавилон, Эрех, Аккад и Халне в земле Сеннаар». В следующей главе люди, говорившие на одном языке, поселились в Сеннааре и сказали: «построим себе город и башню, высотою до небес»; Господь сошёл, смешал их язык и рассеял их, «и они перестали строить город и башню». Рассказ объясняет имя игрой слов: «Посему дано ему имя: Вавилон, ибо там смешал Господь язык всей земли», — по-еврейски «балал» значит «смешивать». Сами вавилоняне понимали Баб-или как «врата бога»."
    - "Многие учёные видят за этим рассказом великую храмовую башню Вавилона Этеменанки, «дом основания неба и земли», ступенчатый зиккурат около 90 м в основании, восстановленный Набопаласаром и Навуходоносором II и описанный Геродотом; её фундамент сохранился среди развалин, но время возникновения рассказа и его точный образец остаются предметом спора. Развалины Вавилона лежат сегодня близ Хиллы в Ираке и с 2019 года входят в список Всемирного наследия; дальнейшая история города рассказана в статье «Вавилон»."
