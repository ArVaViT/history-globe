body:
  en:
    - "Cabul was a town on the eastern border of Asher, where the hills of western Galilee meet the plain of Acco: Asher's border “reacheth to Zebulun, and to the valley of Jiphthah-el toward the north side of Beth-emek, and Neiel, and goeth out to Cabul on the left hand”. The name survives in Kabul, an Arab town in northern Israel about 14 km south-east of Acre; it is the Chabolo of Josephus."
    - "Kings tells that Solomon, in return for Hiram's cedar, fir and gold, gave the king of Tyre twenty cities in Galilee, and that Hiram came to see them “and they pleased him not. And he said, What cities are these which thou hast given me, my brother? And he called them the land of Cabul unto this day.” Josephus explains the name as meaning, in the Phoenician tongue, “what does not please”. Zvi Gal, who in 1983–1992 excavated Horvat Rosh Zayit, about 2 km north-east of Kabul, a tenth-century BC storage fort with abundant Phoenician pottery, proposed that it belonged to this land of Cabul handed over to Tyre."
  ru:
    - "Кавул — город на восточной границе Асира, там, где холмы западной Галилеи сходятся с равниной Акко: предел Асира «примыкает к Завулону и к долине Ифтах-Ел с севера, и входит в пределы Асафы в Беф-Емек и Неиел, и идет у Кавула, с левой стороны». Имя сохранилось в Кабуле, арабском городе на севере Израиля примерно в 14 км к юго-востоку от Акко; это Хаболо Иосифа Флавия."
    - "Книга Царств рассказывает, что Соломон за кедры, кипарисы и золото Хирама дал тирскому царю двадцать городов в Галилее, и Хирам пришёл посмотреть на них, но они ему не понравились: «что это за города, которые ты, брат мой, дал мне? И назвал их землею Кавул, как называются они до сего дня». Иосиф Флавий объясняет это имя как означающее на финикийском языке «то, что не нравится». Цви Галь, раскапывавший в 1983–1992 гг. Хорват-Рош-Зайит примерно в 2 км к северо-востоку от Кабула — крепость-склад X в. до н. э. с обилием финикийской керамики, — предположил, что она относилась к этой земле Кавул, переданной Тиру."
  de:
    - "Kabul war eine Stadt an der Ostgrenze Assers, wo die Hügel Westgaliläas auf die Ebene von Akko treffen: Assers Grenze „stößt an Sebulon und an das Tal Jephthah-El mitternachtwärts, Beth-Emek, Negiel und kommt hinaus gen Kabul zur Linken“. Der Name überlebt in Kabul, einer arabischen Stadt im Norden Israels etwa 14 km südöstlich von Akko; es ist das Chabolo des Josephus."
    - "Das Buch der Könige erzählt, dass Salomo Hiram für Zedern, Tannen und Gold zwanzig Städte in Galiläa gab und dass Hiram kam, um sie zu besehen: „und sie gefielen ihm nicht, und er sprach: Was sind das für Städte, mein Bruder, die du mir gegeben hast? Und hieß das Land Kabul bis auf diesen Tag.“ Josephus erklärt den Namen als in phönizischer Sprache „was nicht gefällt“. Zvi Gal, der 1983–1992 Chorbat Rosch Zajit etwa 2 km nordöstlich von Kabul ausgrub, ein Vorratskastell des zehnten Jahrhunderts v. Chr. mit reichlich phönizischer Keramik, schlug vor, es habe zu diesem an Tyrus übergebenen Land Kabul gehört."
  fr:
    - "Cabul était une ville de la frontière orientale d’Aser, là où les collines de la Galilée occidentale rejoignent la plaine d’Acco : la frontière d’Aser « atteignait Zabulon et la vallée de Jiphthach-El au nord de Beth-Émek et de Neïel, et se prolongeait vers Cabul, à gauche ». Le nom survit dans Kabul, ville arabe du nord d’Israël à environ 14 km au sud-est d’Acre ; c’est le Chabolo de Josèphe."
    - "Les Rois racontent que Salomon, en échange du cèdre, du cyprès et de l’or d’Hiram, donna au roi de Tyr vingt villes en Galilée, et qu’Hiram vint les voir : « Mais elles ne lui plurent point, et il dit : Quelles villes m’as-tu données là, mon frère ? Et il les appela pays de Cabul, nom qu’elles ont conservé jusqu’à ce jour. » Josèphe explique que le nom signifie, en langue phénicienne, « ce qui ne plaît pas ». Zvi Gal, qui fouilla en 1983–1992 Horvat Rosh Zayit, à environ 2 km au nord-est de Kabul, fort de stockage du Xe siècle av. J.-C. à l’abondante céramique phénicienne, proposa qu’il ait fait partie de ce pays de Cabul remis à Tyr."
  pt:
    - "Cabul era uma cidade na fronteira oriental de Aser, onde as colinas da Galileia ocidental encontram a planície de Aco: a fronteira de Aser “chegava a Zebulom e ao vale de Iftá-El, ao norte, para Bete-Emeque e Neiel. Saía para Cabul, à esquerda”. O nome sobrevive em Kabul, uma cidade árabe no norte de Israel cerca de 14 km a sudeste de Acre; é a Chabolo de Josefo."
    - "Reis conta que Salomão, em troca do cedro, do cipreste e do ouro de Hirão, deu ao rei de Tiro vinte cidades na Galileia, e que Hirão veio vê-las e “elas não lhe agradaram. Ele disse: ‘Que cidades são estas que você me deu, meu irmão?’ Ele as chamou de terra de Cabul até o dia de hoje.” Josefo explica que o nome significa, em língua fenícia, “o que não agrada”. Zvi Gal, que em 1983–1992 escavou Horvat Rosh Zayit, cerca de 2 km a nordeste de Kabul, uma fortaleza de armazenamento do século X a.C. com abundante cerâmica fenícia, propôs que ela pertencia a esta terra de Cabul entregue a Tiro."
  it:
    - "Cabul era una città sul confine orientale di Aser, dove le colline della Galilea occidentale incontrano la piana di Acco: il confine di Aser «giungeva a Zabulon e alla valle di Iftah-El al nord di Beth-Emek e di Neiel, e si prolungava verso Cabul a sinistra». Il nome sopravvive a Kabul, una città araba nel nord di Israele a circa 14 km a sud-est di Acri; è la Cabolo di Giuseppe Flavio."
    - "I Re raccontano che Salomone, in cambio del legname di cedro e di cipresso e dell’oro di Chiram, diede al re di Tiro venti città in Galilea, e che Chiram uscì per vedere le città, «ma non gli piacquero; e disse: “Che città son queste che tu m’hai date, fratel mio?” E le chiamò “terra di Kabul” nome ch’è rimasto loro fino al dì d’oggi». Giuseppe Flavio spiega il nome come significante, in lingua fenicia, «ciò che non piace». Zvi Gal, che nel 1983–1992 scavò Horvat Rosh Zayit, a circa 2 km a nord-est di Kabul, un forte-magazzino del X secolo a.C. con abbondante ceramica fenicia, propose che appartenesse a questa terra di Cabul ceduta a Tiro."
  nl:
    - "Kabul was een stad aan de oostgrens van Aser, waar de heuvels van West-Galilea de vlakte van Akko ontmoeten: Asers grens “reikt aan Zebulon, en aan het dal Jiftha-El noordwaarts naar Beth-Emek, en Nehiel, en komt uit tot Kabul ter linkerhand”. De naam leeft voort in Kabul, een Arabische stad in het noorden van Israël ongeveer 14 km ten zuidoosten van Akko; het is het Chabolo van Josephus."
    - "Koningen vertelt dat Salomo, als tegenprestatie voor Hirams cederhout, dennenhout en goud, de koning van Tyrus twintig steden in Galilea gaf, en dat Hiram ze kwam bekijken, “maar zij waren niet recht in zijn ogen. Daarom zeide hij: Wat zijn dat voor steden, mijn broeder, die gij mij gegeven hebt? En hij noemde ze het land Kabul, tot op dezen dag.” Josephus verklaart de naam als betekenend, in de Fenicische taal, “wat niet bevalt”. Zvi Gal, die in 1983–1992 Horvat Rosh Zayit opgroef, ongeveer 2 km ten noordoosten van Kabul, een voorraadfort uit de tiende eeuw v.Chr. met overvloedig Fenicisch aardewerk, stelde voor dat het hoorde bij dit aan Tyrus overgedragen land Kabul."
  pl:
    - "Kabul było miastem na wschodniej granicy Aszera, gdzie wzgórza zachodniej Galilei stykają się z równiną Akko: granica Aszera „bieży aż do Zabulon, i do doliny Jeftach El na północy, Betemek i do Nehyjel, wychodząc do Kabul ku lewej stronie”. Nazwa przetrwała w Kabul, arabskim mieście w północnym Izraelu około 14 km na południowy wschód od Akki; jest to Chabolo Józefa Flawiusza."
    - "Księgi Królewskie opowiadają, że Salomon w zamian za cedr, jodłę i złoto Hirama dał królowi Tyru dwadzieścia miast w Galilei, a Hiram przybył je obejrzeć, „ale mu się niepodobały. I rzekł: Cóż to za miasta, któreś mi dał, bracie mój? I nazwał je ziemią Chabul, aż do dnia tego”. Józef Flawiusz wyjaśnia nazwę jako oznaczającą w języku fenickim „to, co się nie podoba”. Zvi Gal, który w latach 1983-1992 badał Horvat Rosh Zayit, około 2 km na północny wschód od Kabul, warowny magazyn z X w. p.n.e. z obfitą ceramiką fenicką, zaproponował, że należał on do tej ziemi Kabul oddanej Tyrowi."
  uk:
    - "Кабул був містом на східній межі Асіра, де пагорби західної Галілеї сходяться з рівниною Акко: межа Асіра «торкається до Зебулона та до Іфтах-Ел долини на півночі, та до Бет-Емек і Неіел, і йде на Кабул з лївого боку». Назва збереглася в Кабулі, арабському місті на півночі Ізраїлю приблизно за 14 км на південний схід від Акри; це Хаболо Йосифа Флавія."
    - "Перша книга Царів розповідає, що Соломон, віддячуючи за кедрову й кипарисову деревину та золото Хірама, віддав цареві Тіра двадцять міст у Галілеї, і що Хірам приїхав на них подивитися: «та й не сподобались вони йому. І каже він: Що се за городи, що ти, брате, поступився менї ними! Тим прозвано їх по сей день Кабул». Йосиф Флавій пояснює назву як таку, що фінікійською означає «те, що не подобається». Цві Ґал, який 1983–1992 рр. розкопував Хорват-Рош-Заїт, приблизно за 2 км на північний схід від Кабула, склад-фортецю X ст. до н. е. з рясною фінікійською керамікою, припустив, що вона належала цій землі Кабул, переданій Тіру."
  cs:
    - "Kabul bylo město na východní hranici Ašeru, kde se kopce západní Galileje setkávají s rovinou Akko: hranice Ašeru „dosahá k losu Zabulonovu, a do údolí Jeftael k půlnoci, a do Betemek a Nehiel, a táhne se do Kábul na levou stranu“. Jméno se zachovalo v Kabulu, arabském městě v severním Izraeli asi 14 km jihovýchodně od Akka; je to Josephovo Chabolo."
    - "Královské vypráví, že Šalomoun dal králi Týru za jeho cedrové a jedlové dříví a zlato dvacet měst v Galileji a že je Chíram přijel shlédnout, „ale nelíbila se jemu. Protož řekl: Jakáž jsou ta města, kteráž mi dáváš, bratře můj? I nazval je zemí Kabul až do tohoto dne.“ Josephus Flavius vysvětluje jméno tak, že ve fénickém jazyce znamená „co se nelíbí“. Zvi Gal, který v letech 1983–1992 kopal Chorvat Roš Cajit, asi 2 km severovýchodně od Kabulu, pevnůstku se skladem z desátého století př. n. l. s hojnou fénickou keramikou, navrhl, že patřila k této zemi Kabul vydané Týru."
  es:
    - "Cabul era una ciudad en la frontera oriental de Aser, donde las colinas de la Galilea occidental se encuentran con la llanura de Aco: la frontera de Aser «llega á Zabulón, y al valle de Iphtael al norte, á Beth-emec, y á Nehiel, y sale á Cabul á la izquierda». El nombre pervive en Kabul, una ciudad árabe del norte de Israel a unos 14 km al sureste de Acre; es la Chabolo de Josefo."
    - "Reyes cuenta que Salomón, a cambio del cedro, el abeto y el oro de Hiram, dio al rey de Tiro veinte ciudades en Galilea, y que Hiram fue a verlas y «no le contentaron. Y dijo: ¿Qué ciudades son estas que me has dado, hermano? Y púsoles por nombre, la tierra de Cabul, hasta hoy». Josefo explica que el nombre significa, en lengua fenicia, «lo que no agrada». Zvi Gal, que en 1983–1992 excavó Horvat Rosh Zayit, a unos 2 km al noreste de Kabul, un fuerte de almacenamiento del siglo X a. C. con abundante cerámica fenicia, propuso que perteneció a esta tierra de Cabul entregada a Tiro."
  sv:
    - "Kabul var en stad vid Ashers östra gräns, där västra Galileens berg möter Ackoslätten: Ashers gräns vände åt öster till Bet-Dagon och ”träffade Sebulon och Jifta-Els dal i norr, vidare Bet-Haemek och Negiel och gick så ut till Kabul i norr”. Namnet lever kvar i Kabul, en arabisk stad i norra Israel omkring 14 km sydost om Akko; det är Josefus Chabolo."
    - "Konungaboken berättar att Salomo, som tack för Hirams cederträ, cypressträ och guld, gav kungen av Tyros tjugo städer i Galileen, och att Hiram kom för att bese dem, och då ”behagade de honom icke”. Han sade: ”Vad är detta för städer som du har givit mig, min broder?” Och han kallade dem Kabuls land, ”såsom de heta ännu i dag”. Josefus förklarar namnet som på det feniciska språket ”det som inte behagar”. Zvi Gal, som 1983–1992 grävde ut Horvat Rosh Zayit, omkring 2 km nordost om Kabul, ett förrådsfäste från 900-talet f.Kr. med rik fenicisk keramik, föreslog att det hörde till detta Kabuls land som överlämnats till Tyros."
  nb:
    - "Kabul var en by på østgrensen av Asjer, der åsene i det vestlige Galilea møter Akko-sletten: Asjers grense «støtte til Sebulon og Jiftah-El-dalen, nordenfor Bet-Haemek og Ne'iel, og gikk så frem til Kabul i nord». Navnet lever videre i Kabul, en arabisk by i Nord-Israel omtrent 14 km sørøst for Akko; det er Josefus' Chabolo."
    - "Kongebøkene forteller at Salomo til gjengjeld for Hirams sedertre, cypresstre og gull gav kongen av Tyros tyve byer i Galilea, og at Hiram kom for å se dem, men «syntes han ikke om dem. Han sa: Hvad er dette for byer du har gitt mig, min bror? Og han kalte dem Kabuls land; så heter de den dag idag.» Josefus forklarer navnet som at det på fønikisk betyr «det som ikke behager». Zvi Gal, som i 1983–1992 gravde ut Horvat Rosh Zayit, omtrent 2 km nordøst for Kabul, et lagerfort fra 900-tallet f.Kr. med rikelig fønikisk keramikk, foreslo at det hørte til dette Kabuls land som ble overlatt til Tyros."
  tl:
    - "Ang Cabul ay isang bayan sa silangang hangganan ng Aser, kung saan nagtatagpo ang mga burol ng kanlurang Galilea at ang kapatagan ng Acho: ang hangganan ng Aser ay “abot sa Zabulon, at sa libis ng Iphta-el na dakong hilagaan sa Beth-emec at Nehiel; at palabas sa Cabul sa kaliwa”. Ang pangalan ay nananatili sa Kabul, isang bayang Arabe sa hilagang Israel mga 14 km sa timog-silangan ng Acre; ito ang Chabolo ni Josefo."
    - "Isinasalaysay ng Mga Hari na si Salomon, kapalit ng sedro, abeto at ginto ni Hiram, ay nagbigay sa hari ng Tiro ng dalawampung lungsod sa Galilea, at pumunta si Hiram upang tingnan ang mga ito at “hindi niya kinalugdan. At kaniyang sinabi, Anong mga bayan itong iyong ipinagbibigay sa akin, kapatid ko? At tinawag niya: lupain ng Cabul, hanggang sa araw na ito.” Ipinaliliwanag ni Josefo na ang pangalan ay nangangahulugan, sa wikang Fenicio, ng “hindi nakalulugod”. Si Zvi Gal, na humukay noong 1983–1992 sa Horvat Rosh Zayit, mga 2 km sa hilagang-silangan ng Kabul, isang kutang imbakan noong ika-10 siglo BK na may saganang palayok na Fenicio, ay nagmungkahing kabilang ito sa lupain ng Cabul na ibinigay sa Tiro."
  da:
    - "Kabul var en by på Asers østlige grænse, hvor Vestgalilæas bjerge møder Akko-sletten: Asers grænse »støder op til Sebulon og til Jeftha-Els Dal, Nord om Beth-Emek og Negiel, og gaar ud til Kabul, paa den venstre Side«. Navnet lever videre i Kabul, en arabisk by i det nordlige Israel cirka 14 km sydøst for Akko; det er Josefus' Chabolo."
    - "Kongebøgerne fortæller, at Salomo til gengæld for Hirams cedertræ, fyrretræ og guld gav kongen af Tyrus tyve byer i Galilæa, og at Hiram kom for at se dem, »og de behagede ham ikke. Og han sagde: Hvad er dette for Stæder, min Broder, som du har givet mig? og han kaldte dem Kabul-Land indtil denne Dag.« Josefus forklarer navnet som betydende »hvad der ikke behager« på fønikisk. Zvi Gal, som i 1983–1992 udgravede Horvat Rosh Zayit, cirka 2 km nordøst for Kabul, et opbevaringsfort fra 900-tallet f.Kr. med rigelig fønikisk keramik, foreslog, at det hørte til dette Kabul-land, der blev overdraget til Tyrus."
