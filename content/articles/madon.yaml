body:
  en:
    - "Madon was a Canaanite city of Galilee whose king joined the northern coalition against Joshua. When Jabin king of Hazor heard of Israel’s victories in the south, “he sent to Jobab king of Madon, and to the king of Shimron, and to the king of Achshaph”; the kings camped together at the waters of Merom, and Joshua fell on them there and routed them. In the list of the thirty-one kings he defeated stands “The king of Madon, one; the king of Hazor, one”. That is all the Bible says, and Madon is not named in any other ancient source with certainty."
    - "Where it stood is disputed. The Greek translation of Joshua 11:1 reads Marron, close to Merom, and some therefore think Madon is a copyist’s form of Merom itself; that is the map’s first choice. Others point to Khirbet Madin, which keeps the name, beside the twin peaks of the Horns of Hattin west of the Sea of Galilee, or to Qarn Hattin itself, a Canaanite hilltop fortress on the extinct volcano where Saladin defeated the Crusaders in 1187; Tell el-Khirbeh has also been proposed. Without an inscription the question stays open."
  ru:
    - "Мадон — ханаанский город Галилеи, царь которого вошёл в северный союз против Иисуса Навина. Услышав о победах Израиля на юге, Иавин, царь Асорский, «послал к Иоваву, царю Мадонскому, и к царю Шимронскому, и к царю Ахсафскому»; цари расположились станом вместе при водах Меромских, и Иисус напал на них там и обратил в бегство. В перечне тридцати одного побеждённого им царя стоит: «один царь Мадона, один царь Асора». Это всё, что говорит Библия, и ни один другой древний источник не называет Мадон с уверенностью."
    - "Где он стоял — спорно. Греческий перевод Иисуса Навина 11:1 читает Маррон, близкое к Мерому, и потому некоторые считают Мадон искажением при переписке имени самого Мерома; это первый выбор на карте. Другие указывают на Хирбет-Мадин, сохраняющий имя, у двойной вершины Рогов Хаттина к западу от Галилейского моря, или на сами Рога Хаттина — ханаанскую крепость на вершине потухшего вулкана, где в 1187 году Саладин разбил крестоносцев; предлагали также Телль-эль-Хирбе. Без надписи вопрос остаётся открытым."
  uk:
    - "Мадон був ханаанським містом Галілеї, чий цар приєднався до північної коаліції проти Ісуса Навина. Коли Явін, цар Гацору, почув про перемоги Ізраїлю на півдні, «післав він посли до Йобаба, царя Мадонського, та до царя Симронського, та до царя Ахсафського»; царі отаборилися разом при водах Мерому, і Ісус там напав на них і розгромив. У переліку тридцяти одного царя, яких він переміг, стоїть «Царь Мадонський, один; царь Асорський, один». Це все, що каже Біблія, і Мадон не названий певно в жодному іншому давньому джерелі."
    - "Де він стояв, спірно. Грецький переклад Ісуса Навина 11:1 читає Марон, близько до Мерому, і дехто тому думає, що Мадон — форма самого Мерому, породжена переписувачем; це перший вибір мапи. Інші вказують на Хірбет-Мадін, що зберігає назву, поруч із двома вершинами Рогів Хаттіну на захід від Галілейського моря, або на сам Карн-Хаттін, ханаанську фортецю на вершині згаслого вулкана, де Салах-ад-Дін розбив хрестоносців 1187 р.; пропонували також Телль-ель-Хірбе. Без напису питання залишається відкритим."
  es:
    - "Madón era una ciudad cananea de Galilea cuyo rey se unió a la coalición del norte contra Josué. Cuando Jabín, rey de Hazor, supo de las victorias de Israel en el sur, «envió mensaje á Jobab rey de Madón, y al rey de Simrom, y al rey de Achsaph»; los reyes acamparon juntos junto a las aguas de Merom, y Josué cayó sobre ellos allí y los puso en fuga. En la lista de los treinta y un reyes que derrotó figura «El rey de Madón, otro: el rey de Hasor, otro». Eso es todo lo que dice la Biblia, y Madón no se nombra con certeza en ninguna otra fuente antigua."
    - "Se discute dónde estaba. La traducción griega de Josué 11:1 lee Marron, cercano a Merom, y algunos piensan por ello que Madón es una forma de copista del propio Merom; esa es la primera elección del mapa. Otros señalan Khirbet Madin, que conserva el nombre, junto a los picos gemelos de los Cuernos de Hattin, al oeste del Mar de Galilea, o el propio Qarn Hattin, una fortaleza cananea en la cima del volcán extinto donde Saladino derrotó a los cruzados en 1187; también se ha propuesto Tell el-Khirbeh. Sin una inscripción, la cuestión sigue abierta."
  pt:
    - "Madom era uma cidade cananeia da Galileia cujo rei se juntou à coalizão do norte contra Josué. Quando Jabim, rei de Hazor, soube das vitórias de Israel no sul, “enviou mensageiros a Jobabe, rei de Madom, ao rei de Sinrom, ao rei de Acsafe”; os reis acamparam juntos nas águas de Merom, e Josué caiu sobre eles ali e os derrotou. Na lista dos trinta e um reis que derrotou consta “o rei de Madom, um; o rei de Hazor, um”. É tudo o que a Bíblia diz, e Madom não é nomeada com certeza em nenhuma outra fonte antiga."
    - "Onde ficava é disputado. A tradução grega de Josué 11:1 lê Marron, próximo de Merom, e alguns pensam por isso que Madom é uma forma de copista do próprio Merom; é a primeira escolha do mapa. Outros apontam Khirbet Madin, que conserva o nome, junto aos picos gêmeos dos Chifres de Hattin, a oeste do Mar da Galileia, ou o próprio Qarn Hattin, uma fortaleza cananeia no alto do vulcão extinto onde Saladino derrotou os cruzados em 1187; Tell el-Khirbeh também foi proposto. Sem uma inscrição, a questão permanece em aberto."
  de:
    - "Madon war eine kanaanäische Stadt in Galiläa, deren König sich der nördlichen Koalition gegen Josua anschloss. Als Jabin, der König von Hazor, von Israels Siegen im Süden hörte, „sandte er zu Jobab, dem König zu Madon, und zum König zu Simron und zum König zu Achsaph“; die Könige lagerten zusammen am Wasser Merom, und Josua fiel dort über sie her und schlug sie in die Flucht. In der Liste der einunddreißig Könige, die er besiegte, steht „der König zu Madon, der König zu Hazor“. Mehr sagt die Bibel nicht, und Madon wird in keiner anderen antiken Quelle sicher genannt."
    - "Wo es lag, ist umstritten. Die griechische Übersetzung von Josua 11,1 liest Marron, nahe bei Merom, und manche halten Madon daher für eine Abschreiberform von Merom selbst; das ist die erste Wahl der Karte. Andere verweisen auf Khirbet Madin, das den Namen bewahrt, bei den Zwillingsgipfeln der Hörner von Hattin westlich des Sees Genezareth, oder auf Qarn Hattin selbst, eine kanaanäische Höhenfestung auf dem erloschenen Vulkan, wo Saladin 1187 die Kreuzfahrer schlug; auch Tell el-Khirbeh wurde vorgeschlagen. Ohne Inschrift bleibt die Frage offen."
  fr:
    - "Madon était une ville cananéenne de Galilée dont le roi se joignit à la coalition du nord contre Josué. Quand Jabin, roi de Hatsor, apprit les victoires d’Israël dans le sud, il « envoya des messagers à Jobab, roi de Madon, au roi de Schimron, au roi d’Acschaph » ; les rois campèrent ensemble près des eaux de Mérom, et Josué tomba sur eux là et les mit en déroute. Dans la liste des trente et un rois qu’il vainquit figure « le roi de Madon, un ; le roi de Hatsor, un ». C’est tout ce que dit la Bible, et Madon n’est nommée avec certitude dans aucune autre source ancienne."
    - "Où elle se dressait est discuté. La traduction grecque de Josué 11:1 lit Marron, proche de Mérom, et certains pensent donc que Madon est une forme de copiste de Mérom elle-même ; c’est le premier choix de la carte. D’autres désignent Khirbet Madin, qui garde le nom, près des deux sommets jumeaux des Cornes de Hattin, à l’ouest de la mer de Galilée, ou Qarn Hattin elle-même, forteresse cananéenne au sommet du volcan éteint où Saladin vainquit les croisés en 1187 ; Tell el-Khirbeh a aussi été proposé. Sans inscription, la question reste ouverte."
  it:
    - "Madon era una città cananea della Galilea il cui re si unì alla coalizione settentrionale contro Giosuè. Quando Iabin re di Asor ebbe udito delle vittorie d’Israele nel sud, «mandò de’ messi a Iobab re di Madon, al re di Scimron, al re di Acsaf»; i re si accamparono insieme presso le acque di Merom, e Giosuè piombò su di loro e li mise in rotta. Nell’elenco dei trentun re che sconfisse si trova «il re di Madon, il re di Hatsor». Questo è tutto ciò che la Bibbia dice, e Madon non è nominata con certezza in nessun’altra fonte antica."
    - "Dove sorgesse è discusso. La traduzione greca di Giosuè 11,1 legge Marron, vicino a Merom, e alcuni pensano perciò che Madon sia una forma di copista della stessa Merom; è la prima scelta della mappa. Altri indicano Khirbet Madin, che conserva il nome, accanto alle due cime gemelle dei Corni di Hattin a ovest del Lago di Tiberiade, o la stessa Qarn Hattin, una fortezza cananea in cima al vulcano spento dove Saladino sconfisse i Crociati nel 1187; è stata proposta anche Tell el-Khirbeh. Senza un’iscrizione la questione resta aperta."
  pl:
    - "Madon było kananejskim miastem w Galilei, którego król przyłączył się do północnej koalicji przeciw Jozuemu. Gdy Jabin, król Chasoru, usłyszał o zwycięstwach Izraela na południu, „posłał do Johaba, króla Madon, i do króla Symron, i do króla Achsaf”; królowie obozowali razem nad wodami Merom, a Jozue rzucił się na nich tam i rozgromił ich. Na liście trzydziestu jeden pokonanych przez niego królów stoi: „Król Madon jeden; król Hasor jeden”. Tyle mówi Biblia, a Madon nie jest z pewnością wymienione w żadnym innym starożytnym źródle."
    - "Gdzie stało, jest sporne. Grecki przekład Joz 11,1 czyta Marron, blisko Merom, i niektórzy sądzą więc, że Madon jest formą kopisty samego Merom; to pierwszy wybór mapy. Inni wskazują Khirbet Madin, które zachowuje nazwę, obok bliźniaczych szczytów Rogów Hittin na zachód od Jeziora Galilejskiego, albo samo Qarn Hattin, kananejską twierdzę na szczycie wygasłego wulkanu, gdzie Saladyn pokonał krzyżowców w 1187 r.; proponowano też Tell el-Khirbeh. Bez inskrypcji sprawa pozostaje otwarta."
  nl:
    - "Madon was een Kanaänitische stad in Galilea waarvan de koning zich aansloot bij de noordelijke coalitie tegen Jozua. Toen Jabin, koning van Hazor, van Israëls overwinningen in het zuiden hoorde, “zond hij tot Jobab, den koning van Madon, en tot den koning van Simron, en tot den koning van Achsaf”; de koningen legerden zich samen bij de wateren van Merom, en Jozua viel hen daar aan en versloeg hen. In de lijst van de eenendertig koningen die hij versloeg staat “De koning van Madon, een; de koning van Hazor, een”. Dat is alles wat de Bijbel zegt, en Madon wordt in geen enkele andere oude bron met zekerheid genoemd."
    - "Waar het lag, is omstreden. De Griekse vertaling van Jozua 11:1 leest Marron, dicht bij Merom, en sommigen menen daarom dat Madon een door een kopiist ontstane vorm van Merom zelf is; dat is de eerste keuze van de kaart. Anderen wijzen op Khirbet Madin, dat de naam bewaart, naast de tweelingtoppen van de Hoorns van Hattin ten westen van het Meer van Galilea, of op Qarn Hattin zelf, een Kanaänitische vesting op de top van de uitgedoofde vulkaan waar Saladin in 1187 de kruisvaarders versloeg; ook Tell el-Khirbeh is voorgesteld. Zonder inscriptie blijft de vraag open."
  cs:
    - "Madon bylo kanaánské město v Galileji, jehož král se připojil k severní koalici proti Jozuovi. Když Jabín, král Chacoru, uslyšel o izraelských vítězstvích na jihu, „poslal k Jobábovi, králi Mádon, a k králi Simron, a k králi Achzaf“; králové se utábořili společně u vod Merom a Jozue na ně tam udeřil a rozprášil je. V seznamu jednatřiceti králů, které porazil, stojí „Král Mádon jeden, král Azor jeden“. To je vše, co Bible praví, a Madon není s jistotou jmenován v žádném jiném starověkém prameni."
    - "Kde stálo, je sporné. Řecký překlad Jozue 11,1 čte Marron, blízké Meromu, a někteří proto soudí, že Madon je opisovačský tvar samotného Meromu; to je první volba mapy. Jiní ukazují na Khirbet Madin, které jméno zachovává, vedle dvojitého vrcholu Hattínských rohů západně od Galilejského jezera, nebo na samotný Qarn Hattin, kenaanskou pevnost na vrcholu vyhaslé sopky, kde Saladin roku 1187 porazil křižáky; navržen byl i Tell el-Khirbeh. Bez nápisu zůstává otázka otevřená."
  sv:
    - "Madon var en kanaaneisk stad i Galileen vars kung anslöt sig till den nordliga koalitionen mot Josua. När Javin, konungen i Hasor, hörde om Israels segrar i söder, ”sände han bud till Jobab, konungen i Madon, och till konungen i Simron och konungen i Aksaf”; konungarna lägrade sig tillsammans vid Meroms vatten, och Josua föll över dem där och slog dem på flykt. I förteckningen över de trettioen konungar han besegrade står ”konungen i Madon en, konungen i Hasor en”. Det är allt Bibeln säger, och Madon nämns inte med säkerhet i någon annan antik källa."
    - "Var den låg är omstritt. Den grekiska översättningen av Josua 11:1 läser Marron, nära Merom, och vissa tror därför att Madon är en skrivares form av Merom själv; det är kartans första val. Andra pekar på Khirbet Madin, som bevarar namnet, intill de tvillingtoppar som kallas Hattins horn väster om Galileiska sjön, eller på Qarn Hattin självt, en kanaaneisk bergsfästning på den utslocknade vulkanen där Saladin besegrade korsfararna 1187; Tell el-Khirbeh har också föreslagits. Utan en inskrift förblir frågan öppen."
  nb:
    - "Madon var en kanaanittisk by i Galilea hvis konge sluttet seg til den nordlige koalisjonen mot Josva. Da Jabin, kongen i Hasor, hørte om Israels seire i sør, «sendte han bud til Jobab, kongen i Madon, og til kongen i Simron og til kongen i Aksaf»; kongene slo leir sammen ved Merom-vannet, og Josva falt over dem der og slo dem på flukt. I listen over de en og tretti kongene han beseiret står «kongen i Madon én, kongen i Hasor én». Det er alt Bibelen sier, og Madon er ikke med sikkerhet nevnt i noen annen gammel kilde."
    - "Hvor den lå, er omstridt. Den greske oversettelsen av Josva 11,1 har Marron, nær Merom, og noen mener derfor at Madon er en avskriverform av Merom selv; det er kartets første valg. Andre peker på Khirbet Madin, som har beholdt navnet, ved siden av de to toppene Hornene fra Hattin vest for Galileasjøen, eller på selve Qarn Hattin, en kanaanittisk høydefestning på den utdødde vulkanen der Saladin beseiret korsfarerne i 1187; Tell el-Khirbeh er også foreslått. Uten en innskrift forblir spørsmålet åpent."
  tl:
    - "Ang Madon ay lungsod ng mga Cananeo sa Galilea na ang hari ay sumali sa hilagang koalisyon laban kay Josue. Nang mabalitaan ni Jabin na hari ng Hasor ang mga tagumpay ng Israel sa timog, “nagsugo kay Jobab na hari sa Madon, at sa hari sa Simron, at sa hari sa Achsaph”; nagkampong magkakasama ang mga hari sa tubig ng Merom, at sinalakay sila roon ni Josue at dinurog. Sa talaan ng tatlumpu't isang haring tinalo niya ay nakatayo ang “hari sa Madon, isa; ang hari sa Hasor, isa”. Iyon lamang ang sinasabi ng Biblia, at hindi tiyak na pinangalanan ang Madon sa anumang ibang sinaunang sanggunian."
    - "Pinagtatalunan kung saan ito nakatayo. Ang salin sa Griyego ng Josue 11:1 ay bumabasa ng Marron, malapit sa Merom, at kaya iniisip ng ilan na ang Madon ay anyo ng tagakopya ng Merom mismo; iyon ang unang pinili ng mapa. Itinuturo ng iba ang Khirbet Madin, na nag-iingat ng pangalan, sa tabi ng kambal na tuktok ng Mga Sungay ng Hattin sa kanluran ng Dagat ng Galilea, o ang Qarn Hattin mismo, isang kutang tuktok ng burol ng mga Cananeo sa patay na bulkan kung saan tinalo ni Saladin ang mga Krusado noong 1187; iminungkahi rin ang Tell el-Khirbeh. Kung walang inskripsiyon, bukas ang tanong."
  da:
    - "Madon var en kana'anæisk by i Galilæa, hvis konge sluttede sig til den nordlige koalition mod Josva. Da Jabin, Hazors konge, hørte det, »sendte han til Jobab, Kongen af Madon, og til Kongen af Simron og til Kongen af Aksaf«; kongerne lejrede sig sammen ved Meroms vande, og Josva faldt over dem dér og slog dem på flugt. I listen over de enogtredive konger, han besejrede, står »Kongen af Madon een; Kongen af Hazor een«. Det er alt, Bibelen siger, og Madon er ikke med sikkerhed nævnt i nogen anden gammel kilde."
    - "Hvor den lå, er omstridt. Den græske oversættelse af Josva 11,1 læser Marron, tæt på Merom, og nogle mener derfor, at Madon er en afskrivers form af selve Merom; det er kortets første valg. Andre peger på Khirbet Madin, som bevarer navnet, ved siden af de tvillingetoppe, Hattins Horn, vest for Genesaret Sø, eller på Qarn Hattin selv, en kana'anæisk bjergfæstning på den uddøde vulkan, hvor Saladin besejrede korsfarerne i 1187; Tell el-Khirbeh er også blevet foreslået. Uden en indskrift forbliver spørgsmålet åbent."
  sr:
    - "Мадон је био ханаански град у Галилеји чији је цар приступио северној коалицији против Исуса Навина. Када је Јавин, цар асорски, чуо за победе Израиља на југу, „посла к Јоваву цару адонском и к цару имронском и к цару ахсавском“; цареви су се заједно улогорили на води Мером, а Исус их је тамо напао и разбио. У списку тридесет и једног цара којег је победио стоји „цар мадонски један; цар асорски један“. То је све што Библија каже, и Мадон се ни у једном другом древном извору не именује са сигурношћу."
    - "Где је стајао, спорно је. Грчки превод Исуса Навина 11,1 чита Марон, близу Мерома, па неки мисле да је Мадон преписивачки облик самог Мерома; то је први избор мапе. Други указују на Хирбет Мадин, који чува име, поред двоструког врха Хатинских рогова западно од Галилејског мора, или на сам Карн Хатин, ханаанску тврђаву на врху угашеног вулкана где је Саладин 1187. победио крсташе; предложен је и Тел ел-Хирбе. Без натписа питање остаје отворено."
  hu:
    - "Mádon galileai kánaáni város volt, amelynek királya csatlakozott a Józsué elleni északi koalícióhoz. Amikor Jábin, Hácór királya meghallotta Izráel déli győzelmeit, „külde Jobábhoz, Mádonnak királyához, és Simronnak királyához, és Aksáfnak királyához”; a királyok együtt táboroztak Mérom vizeinél, és Józsué ott rájuk támadt, és szétverte őket. A legyőzött harmincegy király jegyzékében áll: „Mádonnak királya egy, Hásornak királya egy”. A Biblia ennyit mond, és Mádont semmilyen más ókori forrás nem említi biztosan."
    - "Hogy hol állt, vitatott. Józsué 11,1 görög fordítása Marront olvas, amely közel áll Mérom nevéhez, és egyesek ezért Mádont Mérom másolói alakjának tartják; ez a térkép első választása. Mások a Khirbet Madinra mutatnak, amely megőrizte a nevet, a Galileai-tengertől nyugatra fekvő Hattín szarvainak ikercsúcsa mellett, vagy magára a Qarn Hattinra, egy kialudt vulkánon álló kánaáni hegytetői erődre, ahol Szaladin 1187-ben legyőzte a keresztes lovagokat; a Tell el-Khirbeh is szóba jött. Felirat nélkül a kérdés nyitott marad."
  fi:
    - "Madon oli Galilean kanaanilainen kaupunki, jonka kuningas liittyi Joosuaa vastaan muodostettuun pohjoiseen liittoon. Kun Jabin, Hasorin kuningas, kuuli Israelin voitoista etelässä, ”lähetti hän sanan Joobabille, Maadonin kuninkaalle, ja Simronin kuninkaalle ja Aksafin kuninkaalle”; kuninkaat leiriytyivät yhdessä Meromin vesille, ja Joosua hyökkäsi heidän kimppuunsa siellä ja löi heidät. Niiden kolmenkymmenen yhden kuninkaan luettelossa, jotka hän voitti, on ”Maadonin kuningas yksi, Haasorin kuningas yksi”. Se on kaikki, mitä Raamattu sanoo, eikä Madonia mainita varmuudella missään muussa muinaisessa lähteessä."
    - "Sen sijainti on kiistanalainen. Joos. 11:1:n kreikkalainen käännös lukee Marron, lähellä Meromia, ja jotkut ajattelevat siksi, että Madon on itse Meromin kopioijan muoto; se on kartan ensimmäinen valinta. Toiset osoittavat Khirbet Madinia, joka säilyttää nimen, Hattinin sarvien kaksoishuippujen vieressä Galileanjärven länsipuolella, tai Qarn Hattinia itseään, kanaanilaista kukkulalinnaketta sammuneella tulivuorella, jossa Saladin voitti ristiretkeläiset vuonna 1187; ehdotettu on myös Tell el-Khirbehiä. Ilman kirjoitusta kysymys pysyy avoimena."
  vi:
    - "Ma-đôn là một thành Ca-na-an ở Ga-li-lê có vua gia nhập liên minh phương bắc chống Giô-suê. Khi Gia-bin vua Hát-so nghe tin Y-sơ-ra-ên thắng ở phía nam, ông “bèn sai sứ giả đến cùng Giô-báp, vua Ma-đôn, đến cùng Sim-rôn, vua Ạc-sáp”; các vua đóng trại chung ở nước Mê-rôm, và Giô-suê xông vào họ ở đó và đánh tan. Trong danh sách ba mươi mốt vua ông đánh bại có “vua Ma-đôn, vua Hát-so”. Đó là tất cả những gì Kinh Thánh nói, và Ma-đôn không được nêu chắc chắn trong nguồn cổ nào khác."
    - "Thành nằm ở đâu còn tranh luận. Bản dịch Hy Lạp của Giô-suê 11:1 đọc là Marron, gần Mê-rôm, nên một số người cho rằng Ma-đôn là dạng sao chép sai của chính Mê-rôm; đó là lựa chọn đầu tiên của bản đồ. Những người khác chỉ Khirbet Madin, nơi giữ tên, cạnh hai đỉnh đôi Sừng Hattin phía tây Biển Ga-li-lê, hoặc chính Qarn Hattin, một pháo đài đồi của người Ca-na-an trên ngọn núi lửa đã tắt, nơi Saladin đánh bại quân Thập tự chinh năm 1187; Tell el-Khirbeh cũng được đề nghị. Không có bản khắc, vấn đề vẫn để ngỏ."
  ro:
    - "Madon era o cetate canaanită din Galileea al cărei rege s-a alăturat coaliției din nord împotriva lui Iosua. Când Iabin, regele Hațorului, a auzit de victoriile lui Israel în sud, „a trimis la Iovav împăratul Madonului și la împăratul Semeronului și la împăratul Ashiafului”; regii au tăbărât împreună la apele Merom, iar Iosua s-a năpustit asupra lor acolo și i-a pus pe fugă. În lista celor treizeci și unu de regi pe care i-a învins se află regele Madonului, unul, și regele Hațorului, unul. Atât spune Biblia, iar Madon nu este numit cu certitudine în nicio altă sursă antică."
    - "Unde se afla este disputat. Traducerea greacă a lui Iosua 11:1 citește Marron, apropiat de Merom, și unii cred de aceea că Madon este o formă de copist a lui Merom însuși; aceasta e prima alegere a hărții. Alții arată spre Khirbet Madin, care păstrează numele, lângă cele două vârfuri gemene ale Coarnelor Hattinului, la vest de Marea Galileii, sau spre Qarn Hattin însuși, o fortăreață canaanită pe un deal, pe vulcanul stins unde Saladin i-a învins pe cruciați în 1187; a fost propus și Tell el-Khirbeh. Fără o inscripție, chestiunea rămâne deschisă."
  bg:
    - "Мадон е бил ханаански град в Галилея, чийто цар се присъединил към северната коалиция срещу Иисус Навин. Когато Явин, царят на Хацор, чу за победите на Израил на юг, той „прати на Иовава Мадонския цар, и на Симвронския цар, и на Ахсафския цар“; царете се разположиха заедно при водите на Мером, а Иисус Навин ги нападна там и ги разби. В списъка на тридесет и единте царе, които той победи, стои: „Мадонский цар, един; Асорский цар, един“. Това е всичко, което казва Библията, и Мадон не е назован със сигурност в никой друг древен извор."
    - "Къде е стоял, е спорно. Гръцкият превод на Иисус Навин 11:1 чете Марон, близко до Мером, и затова някои смятат, че Мадон е форма на самия Мером, появила се при преписване; това е първият избор на картата. Други посочват Хирбет Мадин, който пази името, до двойните върхове на Рогата на Хатин на запад от Галилейско езеро, или самия Карн Хатин — ханаанска крепост на върха на угасналия вулкан, където Саладин разбива кръстоносците през 1187 г.; предлаган е и Тел ел-Хирбе. Без надпис въпросът остава открит."
