body:
  en:
    - "Madon was a Canaanite city of Galilee whose king joined the northern coalition against Joshua. When Jabin king of Hazor heard of Israel’s victories in the south, “he sent to Jobab king of Madon, and to the king of Shimron, and to the king of Achshaph”; the kings camped together at the waters of Merom, and Joshua fell on them there and routed them. In the list of the thirty-one kings he defeated stands “The king of Madon, one; the king of Hazor, one”. That is all the Bible says, and Madon is not named in any other ancient source with certainty."
    - "Where it stood is disputed. The Greek translation of Joshua 11:1 reads Marron, close to Merom, and some therefore think Madon is a copyist’s form of Merom itself; that is the map’s first choice. Others point to Khirbet Madin, which keeps the name, beside the twin peaks of the Horns of Hattin west of the Sea of Galilee, or to Qarn Hattin itself, an Iron Age and Late Bronze Age hill fort on the extinct volcano where Saladin defeated the Crusaders in 1187; Tell el-Khirbeh has also been proposed. Without an inscription the question stays open."
  ru:
    - "Мадон — ханаанский город Галилеи, царь которого вошёл в северный союз против Иисуса Навина. Услышав о победах Израиля на юге, Иавин, царь Асорский, «послал к Иоваву, царю Мадонскому, и к царю Шимронскому, и к царю Ахсафскому»; цари расположились станом вместе при водах Меромских, и Иисус напал на них там и обратил в бегство. В перечне тридцати одного побеждённого им царя стоит: «один царь Мадона, один царь Асора». Это всё, что говорит Библия, и ни один другой древний источник не называет Мадон с уверенностью."
    - "Где он стоял — спорно. Греческий перевод 11-й главы Иисуса Навина читает Маррон, близкое к Мерому, и потому некоторые считают Мадон искажением при переписке имени самого Мерома; это первый выбор на карте. Другие указывают на Хирбет-Мадин, сохраняющий имя, у двойной вершины Рогов Хаттина к западу от Галилейского моря, или на сами Рога Хаттина — укреплённый холм бронзового и железного века на потухшем вулкане, где в 1187 году Саладин разбил крестоносцев; предлагали также Телль-эль-Хирбе. Без надписи вопрос остаётся открытым."
  uk:
    - "Мадон був ханаанським містом Галілеї, чий цар приєднався до північної коаліції проти Ісуса Навина. Коли Явін, цар Гацору, почув про перемоги Ізраїлю на півдні, «післав він посли до Йобаба, царя Мадонського, та до царя Симронського, та до царя Ахсафського»; царі отаборилися разом при водах Мерому, і Ісус там напав на них і розгромив. У переліку тридцяти одного царя, яких він переміг, стоїть «Царь Мадонський, один; царь Асорський, один». Це все, що каже Біблія, і Мадон не названий певно в жодному іншому давньому джерелі."
    - "Де він стояв, спірно. Грецький переклад Ісуса Навина 11:1 читає Марон, близько до Мерому, і дехто тому думає, що Мадон — форма самого Мерому, породжена переписувачем; це перший вибір мапи. Інші вказують на Хірбет-Мадін, що зберігає назву, поруч із двома вершинами Рогів Хаттіну на захід від Галілейського моря, або на сам Карн-Хаттін, фортецю на пагорбі бронзової й залізної доби на згаслому вулкані, де Салах-ад-Дін розбив хрестоносців 1187 р.; пропонували також Телль-ель-Хірбе. Без напису питання залишається відкритим."
  es:
    - "Madón era una ciudad cananea de Galilea cuyo rey se unió a la coalición del norte contra Josué. Cuando Jabín, rey de Hazor, supo de las victorias de Israel en el sur, «envió mensaje á Jobab rey de Madón, y al rey de Simrom, y al rey de Achsaph»; los reyes acamparon juntos junto a las aguas de Merom, y Josué cayó sobre ellos allí y los puso en fuga. En la lista de los treinta y un reyes que derrotó figura «El rey de Madón, otro: el rey de Hasor, otro». Eso es todo lo que dice la Biblia, y Madón no se nombra con certeza en ninguna otra fuente antigua."
    - "Se discute dónde estaba. La traducción griega de Josué 11:1 lee Marron, cercano a Merom, y algunos piensan por ello que Madón es una forma de copista del propio Merom; esa es la primera elección del mapa. Otros señalan Khirbet Madin, que conserva el nombre, junto a los picos gemelos de los Cuernos de Hattin, al oeste del Mar de Galilea, o el propio Qarn Hattin, una fortaleza de colina de la Edad del Hierro y del Bronce Final sobre el volcán extinto donde Saladino derrotó a los cruzados en 1187; también se ha propuesto Tell el-Khirbeh. Sin una inscripción, la cuestión sigue abierta."
  pt:
    - "Madom era uma cidade cananeia da Galileia cujo rei se juntou à coalizão do norte contra Josué. Quando Jabim, rei de Hazor, soube das vitórias de Israel no sul, “enviou mensageiros a Jobabe, rei de Madom, ao rei de Sinrom, ao rei de Acsafe”; os reis acamparam juntos nas águas de Merom, e Josué caiu sobre eles ali e os derrotou. Na lista dos trinta e um reis que derrotou consta “o rei de Madom, um; o rei de Hazor, um”. É tudo o que a Bíblia diz, e Madom não é nomeada com certeza em nenhuma outra fonte antiga."
    - "Onde ficava é disputado. A tradução grega de Josué 11:1 lê Marron, próximo de Merom, e alguns pensam por isso que Madom é uma forma de copista do próprio Merom; é a primeira escolha do mapa. Outros apontam Khirbet Madin, que conserva o nome, junto aos picos gêmeos dos Chifres de Hattin, a oeste do Mar da Galileia, ou o próprio Qarn Hattin, um forte de colina das Idades do Ferro e do Bronze Recente no vulcão extinto onde Saladino derrotou os cruzados em 1187; Tell el-Khirbeh também foi proposto. Sem uma inscrição, a questão permanece em aberto."
  de:
    - "Madon war eine kanaanäische Stadt in Galiläa, deren König sich der nördlichen Koalition gegen Josua anschloss. Als Jabin, der König von Hazor, von Israels Siegen im Süden hörte, „sandte er zu Jobab, dem König zu Madon, und zum König zu Simron und zum König zu Achsaph“; die Könige lagerten zusammen am Wasser Merom, und Josua fiel dort über sie her und schlug sie in die Flucht. In der Liste der einunddreißig Könige, die er besiegte, steht „der König zu Madon, der König zu Hazor“. Mehr sagt die Bibel nicht, und Madon wird in keiner anderen antiken Quelle sicher genannt."
    - "Wo es lag, ist umstritten. Die griechische Übersetzung von Josua 11,1 liest Marron, nahe bei Merom, und manche halten Madon daher für eine Abschreiberform von Merom selbst; das ist die erste Wahl der Karte. Andere verweisen auf Khirbet Madin, das den Namen bewahrt, bei den Zwillingsgipfeln der Hörner von Hattin westlich des Sees Genezareth, oder auf Qarn Hattin selbst, eine Bergfestung der Eisenzeit und Spätbronzezeit auf dem erloschenen Vulkan, wo Saladin 1187 die Kreuzfahrer schlug; auch Tell el-Khirbeh wurde vorgeschlagen. Ohne Inschrift bleibt die Frage offen."
  fr:
    - "Madon était une ville cananéenne de Galilée dont le roi se joignit à la coalition du nord contre Josué. Quand Jabin, roi de Hatsor, apprit les victoires d’Israël dans le sud, il « envoya des messagers à Jobab, roi de Madon, au roi de Schimron, au roi d’Acschaph » ; les rois campèrent ensemble près des eaux de Mérom, et Josué tomba sur eux là et les mit en déroute. Dans la liste des trente et un rois qu’il vainquit figure « le roi de Madon, un ; le roi de Hatsor, un ». C’est tout ce que dit la Bible, et Madon n’est nommée avec certitude dans aucune autre source ancienne."
    - "Où elle se dressait est discuté. La traduction grecque de Josué 11:1 lit Marron, proche de Mérom, et certains pensent donc que Madon est une forme de copiste de Mérom elle-même ; c’est le premier choix de la carte. D’autres désignent Khirbet Madin, qui garde le nom, près des deux sommets jumeaux des Cornes de Hattin, à l’ouest de la mer de Galilée, ou Qarn Hattin elle-même, fort de colline des âges du Fer et du Bronze récent sur le volcan éteint où Saladin vainquit les croisés en 1187 ; Tell el-Khirbeh a aussi été proposé. Sans inscription, la question reste ouverte."
  it:
    - "Madon era una città cananea della Galilea il cui re si unì alla coalizione settentrionale contro Giosuè. Quando Iabin re di Asor ebbe udito delle vittorie d’Israele nel sud, «mandò de’ messi a Iobab re di Madon, al re di Scimron, al re di Acsaf»; i re si accamparono insieme presso le acque di Merom, e Giosuè piombò su di loro e li mise in rotta. Nell’elenco dei trentun re che sconfisse si trova «il re di Madon, il re di Hatsor». Questo è tutto ciò che la Bibbia dice, e Madon non è nominata con certezza in nessun’altra fonte antica."
    - "Dove sorgesse è discusso. La traduzione greca di Giosuè 11,1 legge Marron, vicino a Merom, e alcuni pensano perciò che Madon sia una forma di copista della stessa Merom; è la prima scelta della mappa. Altri indicano Khirbet Madin, che conserva il nome, accanto alle due cime gemelle dei Corni di Hattin a ovest del Lago di Tiberiade, o la stessa Qarn Hattin, una fortezza collinare dell’età del Bronzo Tardo e del Ferro sul vulcano spento dove Saladino sconfisse i Crociati nel 1187; è stata proposta anche Tell el-Khirbeh. Senza un’iscrizione la questione resta aperta."
  pl:
    - "Madon było kananejskim miastem w Galilei, którego król przyłączył się do północnej koalicji przeciw Jozuemu. Gdy Jabin, król Chasoru, usłyszał o zwycięstwach Izraela na południu, „posłał do Johaba, króla Madon, i do króla Symron, i do króla Achsaf”; królowie obozowali razem nad wodami Merom, a Jozue rzucił się na nich tam i rozgromił ich. Na liście trzydziestu jeden pokonanych przez niego królów stoi: „Król Madon jeden; król Hasor jeden”. Tyle mówi Biblia, a Madon nie jest z pewnością wymienione w żadnym innym starożytnym źródle."
    - "Gdzie stało, jest sporne. Grecki przekład Joz 11,1 czyta Marron, blisko Merom, i niektórzy sądzą więc, że Madon jest formą kopisty samego Merom; to pierwszy wybór mapy. Inni wskazują Khirbet Madin, które zachowuje nazwę, obok bliźniaczych szczytów Rogów Hittin na zachód od Jeziora Galilejskiego, albo samo Qarn Hattin, fort wzgórzowy z epoki żelaza i późnej epoki brązu na wygasłym wulkanie, gdzie Saladyn pokonał krzyżowców w 1187 r.; proponowano też Tell el-Khirbeh. Bez inskrypcji sprawa pozostaje otwarta."
  nl:
    - "Madon was een Kanaänitische stad in Galilea waarvan de koning zich aansloot bij de noordelijke coalitie tegen Jozua. Toen Jabin, koning van Hazor, van Israëls overwinningen in het zuiden hoorde, “zond hij tot Jobab, den koning van Madon, en tot den koning van Simron, en tot den koning van Achsaf”; de koningen legerden zich samen bij de wateren van Merom, en Jozua viel hen daar aan en versloeg hen. In de lijst van de eenendertig koningen die hij versloeg staat “De koning van Madon, een; de koning van Hazor, een”. Dat is alles wat de Bijbel zegt, en Madon wordt in geen enkele andere oude bron met zekerheid genoemd."
    - "Waar het lag, is omstreden. De Griekse vertaling van Jozua 11:1 leest Marron, dicht bij Merom, en sommigen menen daarom dat Madon een door een kopiist ontstane vorm van Merom zelf is; dat is de eerste keuze van de kaart. Anderen wijzen op Khirbet Madin, dat de naam bewaart, naast de tweelingtoppen van de Hoorns van Hattin ten westen van het Meer van Galilea, of op Qarn Hattin zelf, een fort uit de ijzertijd en de late bronstijd op de uitgedoofde vulkaan waar Saladin in 1187 de kruisvaarders versloeg; ook Tell el-Khirbeh is voorgesteld. Zonder inscriptie blijft de vraag open."
  cs:
    - "Madon bylo kanaánské město v Galileji, jehož král se připojil k severní koalici proti Jozuovi. Když Jabín, král Chacoru, uslyšel o izraelských vítězstvích na jihu, „poslal k Jobábovi, králi Mádon, a k králi Simron, a k králi Achzaf“; králové se utábořili společně u vod Merom a Jozue na ně tam udeřil a rozprášil je. V seznamu jednatřiceti králů, které porazil, stojí „Král Mádon jeden, král Azor jeden“. To je vše, co Bible praví, a Madon není s jistotou jmenován v žádném jiném starověkém prameni."
    - "Kde stálo, je sporné. Řecký překlad Jozue 11,1 čte Marron, blízké Meromu, a někteří proto soudí, že Madon je opisovačský tvar samotného Meromu; to je první volba mapy. Jiní ukazují na Khirbet Madin, které jméno zachovává, vedle dvojitého vrcholu Hattínských rohů západně od Galilejského jezera, nebo na samotný Qarn Hattin, pevnůstku z doby železné a pozdní bronzové na vyhaslé sopce, kde Saladin roku 1187 porazil křižáky; navržen byl i Tell el-Khirbeh. Bez nápisu zůstává otázka otevřená."
