body:
  en:
    - "Crete, the largest of the Greek islands, stretches some 260 km from east to west and closes the Aegean Sea on the south. In the Bronze Age it was the home of the Minoan civilisation: the first palace at Knossos was built about 1900 BC, and others stood at Phaistos and Malia. Arthur Evans began large-scale excavations at Knossos in 1900. In the last palace period Greek-speaking Mycenaeans kept the accounts in the Linear B script, and the palace of Knossos was destroyed about 1350 BC by the conventional dating, though some scholars put its end later."
    - 'The Bible names Caphtor as the land from which the Philistines came: Amos says that God brought up "the Philistines from Caphtor", and Jeremiah calls them "the remnant of the country of Caphtor". Caphtor is often linked with the Keftiu of Egyptian texts and the Kaptara of cuneiform ones and identified with Crete, but this is disputed, and Cyprus and Cilicia have also been proposed. Zephaniah''s woe on "the nation of the Cherethites" on the sea coast, in the land of the Philistines, uses a Hebrew name that the Greek Septuagint renders "Cretans".'
    - 'Cretes were among those who heard the apostles at Pentecost, and Philo counts Crete among the islands full of Jewish settlements. On the voyage to Rome Paul''s ship sailed under Crete off Salmone and reached the Fair Havens near Lasea. Paul advised them to stay, but most were for sailing on to winter at Phenice, "an haven of Crete", until the tempestuous wind Euroclydon drove the ship out to sea. In his letter to Titus, Paul says he left him in Crete to "ordain elders in every city", and quotes a prophet of their own: "The Cretians are alway liars, evil beasts, slow bellies". Clement of Alexandria names the poet as Epimenides.'
    - "Rome conquered Crete between 69 and 67 BC: Quintus Caecilius Metellus subdued the whole island and took the name Creticus. Under Augustus Crete and Cyrenaica on the African coast formed one senatorial province, with its capital at Gortyn. Eusebius records that Titus was the first to receive the oversight of the churches in Crete. About AD 298 Diocletian made Crete a province of its own, still governed from Gortyn."
  ru:
    - "Крит, самый большой из греческих островов, тянется примерно на 260 км с востока на запад и замыкает Эгейское море с юга. В бронзовом веке он был родиной минойской цивилизации: первый дворец в Кноссе построили около 1900 г. до н. э., другие стояли в Фесте и Малии. В 1900 году Артур Эванс начал в Кноссе большие раскопки. В последний дворцовый период грекоязычные микенцы вели счета линейным письмом Б, а дворец Кносса был разрушен около 1350 г. до н. э. по общепринятой датировке, хотя некоторые учёные относят его конец к более позднему времени."
    - "Библия называет Кафтор землёй, из которой пришли Филистимляне: у Амоса Бог вывел «Филистимлян — из Кафтора», а Иеремия называет их «остаток острова Кафтора». Кафтор часто связывают с Кефтиу египетских текстов и Каптарой клинописных и отождествляют с Критом, но это спорно: предлагались также Кипр и Киликия. Горе, которое Софония возвещает «народу Критскому» на морском берегу, в земле Филистимской, обращено к народу, чьё еврейское имя греческая Септуагинта передаёт как «критяне»."
    - "Критяне были среди тех, кто слышал апостолов в день Пятидесятницы, а Филон называет Крит среди островов, полных иудейских поселений. На пути в Рим корабль Павла подплыл к Криту при Салмоне и дошёл до Хороших Пристаней близ Ласеи. Павел советовал остаться, но многие хотели плыть дальше, чтобы перезимовать в Финике, «пристани Критской», пока бурный ветер эвроклидон не унёс корабль в море. В послании к Титу Павел пишет, что оставил его в Крите, чтобы он «поставил по всем городам пресвитеров», и приводит слова их же стихотворца: «Критяне всегда лжецы, злые звери, утробы ленивые». Климент Александрийский называет этого поэта Эпименидом."
    - "Рим завоевал Крит в 69–67 гг. до н. э.: Квинт Цецилий Метелл покорил весь остров и получил прозвище Критский. При Августе Крит и Киренаика на африканском берегу составили одну сенатскую провинцию со столицей в Гортине. Евсевий сообщает, что Тит первым получил попечение о церквах Крита. Около 298 г. н. э. Диоклетиан сделал Крит отдельной провинцией, по-прежнему управлявшейся из Гортины."
  uk:
    - "Крит, найбільший з грецьких островів, простягається приблизно на 260 км зі сходу на захід і замикає Егейське море з півдня. За доби бронзи він був домівкою мінойської цивілізації: перший палац у Кноссі збудовано близько 1900 р. до н. е., а інші стояли у Фесті та Малії. Артур Еванс розпочав масштабні розкопки в Кноссі в 1900 р. В останній палацовий період грекомовні мікенці вели облік лінійним письмом Б, а палац у Кноссі було зруйновано близько 1350 р. до н. е. за умовною датою, хоча деякі вчені відносять його кінець на пізніше."
    - "Біблія називає Кафтор землею, звідки прийшли филистимляни: Амос каже, що Бог вивів «Филистіїв із Кафтору», а Єремія називає їх «останок острова Кафтора». Кафтор часто пов'язують із Кефтіу єгипетських текстів і Каптарою клинописних і ототожнюють із Критом, але це спірне, і пропонували також Кіпр та Кілікію. Горе, яке Софонія виголошує над приморським народом у землі филистимській, — «Горе поморянам, — народові Крити!» — вживає єврейську назву (кереті), яку грецька Септуагінта передає як «критяни»."
    - "Критяни були серед тих, хто чув апостолів на П'ятдесятницю, а Філон зараховує Крит до островів, повних юдейських поселень. Під час плавання до Рима корабель Павла пройшов під Критом біля Салмони й досяг Добрих Пристаней поблизу Ласеї. Павло радив лишитися, але більшість була за те, щоб пливти далі й перезимувати у Феніксі, «в пристанї Крицькій», доки бурхливий вітер Євроклідон не виніс корабель у море. У посланні до Тита Павло каже, що залишив його на Кріті, щоб він «настановив по всїх городах пресвитерів», і наводить їхнього власного пророка: «Критяне завсїди брехуни, люті зьвіри, черева лїниві». Климент Александрійський називає цього поета Епіменідом."
    - "Рим завоював Крит між 69 і 67 рр. до н. е.: Квінт Цецилій Метелл підкорив увесь острів і прийняв прізвисько Кретік («Критський»). За Августа Крит і Киренаїка на африканському узбережжі утворювали одну сенатську провінцію зі столицею в Гортині. Євсевій повідомляє, що Тит першим одержав нагляд над церквами на Кріті. Близько 298 р. н. е. Діоклетіан зробив Крит окремою провінцією, що й далі управлялася з Гортини."
  es:
    - "Creta, la mayor de las islas griegas, se extiende unos 260 km de este a oeste y cierra el mar Egeo por el sur. En la Edad del Bronce fue la patria de la civilización minoica: el primer palacio de Cnosos se construyó hacia el 1900 a. C., y otros se alzaron en Festos y Malia. Arthur Evans inició excavaciones a gran escala en Cnosos en 1900. En el último periodo palacial, los micénicos de habla griega llevaban las cuentas en escritura lineal B, y el palacio de Cnosos fue destruido hacia el 1350 a. C. según la datación convencional, aunque algunos estudiosos sitúan su final más tarde."
    - "La Biblia nombra Caftor como la tierra de la que vinieron los filisteos: Amós dice que Dios hizo subir «los Palestinos de Caphtor», y Jeremías los llama «el resto de la isla de Caphtor». Caftor se relaciona a menudo con el Keftiu de los textos egipcios y el Kaptara de los cuneiformes y se identifica con Creta, pero esto se discute, y también se han propuesto Chipre y Cilicia. El ay de Sofonías sobre «la gente de Cheretim» de la costa del mar, en la tierra de los filisteos, usa un nombre hebreo que la Septuaginta griega traduce «cretenses»."
    - "Había cretenses entre quienes oyeron a los apóstoles en Pentecostés, y Filón cuenta Creta entre las islas llenas de asentamientos judíos. En el viaje a Roma, la nave de Pablo navegó bajo Creta, junto a Salmona, y llegó a Buenos Puertos, cerca de Lasea. Pablo aconsejó quedarse, pero la mayoría era partidaria de seguir para invernar en Fenice, «un puerto de Creta», hasta que el viento tempestuoso Euroclidón arrastró la nave mar adentro. En su carta a Tito, Pablo dice que lo dejó en Creta para que «pusieses ancianos por las villas», y cita a un profeta de ellos mismos: «Los Cretenses, siempre mentirosos, malas bestias, vientres perezosos». Clemente de Alejandría nombra al poeta como Epiménides."
    - "Roma conquistó Creta entre el 69 y el 67 a. C.: Quinto Cecilio Metelo sometió toda la isla y tomó el nombre de Crético. Bajo Augusto, Creta y la Cirenaica, en la costa africana, formaron una sola provincia senatorial, con su capital en Gortina. Eusebio registra que Tito fue el primero en recibir la supervisión de las iglesias de Creta. Hacia el 298 d. C. Diocleciano hizo de Creta una provincia propia, gobernada todavía desde Gortina."
  pt:
    - "Creta, a maior das ilhas gregas, estende-se por uns 260 km de leste a oeste e fecha o Mar Egeu ao sul. Na Idade do Bronze foi o lar da civilização minoica: o primeiro palácio de Cnossos foi construído por volta de 1900 a.C., e outros se ergueram em Festos e Malia. Arthur Evans iniciou escavações em larga escala em Cnossos em 1900. No último período palaciano, micênicos de língua grega mantinham as contas no sistema Linear B, e o palácio de Cnossos foi destruído por volta de 1350 a.C. pela datação convencional, embora alguns estudiosos situem o seu fim mais tarde."
    - "A Bíblia nomeia Caftor como a terra de onde vieram os filisteus: Amós diz que Deus fez subir “os filisteus de Caftor”, e Jeremias os chama de “o remanescente da ilha de Caftor”. Caftor é muitas vezes ligada ao Keftiu dos textos egípcios e à Kaptara dos cuneiformes e identificada com Creta, mas isso é disputado, e Chipre e a Cilícia também foram propostos. O ai de Sofonias sobre “a nação dos quereteus” na costa do mar, na terra dos filisteus, usa um nome hebraico que a Septuaginta grega traduz por “cretenses”."
    - "Cretenses estavam entre os que ouviram os apóstolos em Pentecostes, e Fílon conta Creta entre as ilhas cheias de comunidades judaicas. Na viagem a Roma, o navio de Paulo navegou sob o abrigo de Creta, diante de Salmona, e chegou a Bons Portos, perto de Laseia. Paulo aconselhou que ficassem, mas a maioria era por seguir adiante para invernar em Fenice, “um porto de Creta”, até que o vento tempestuoso Euroclidão levou o navio para o mar alto. Em sua carta a Tito, Paulo diz que o deixou em Creta para que “constituísse presbíteros em cada cidade”, e cita um profeta deles mesmos: “Os cretenses são sempre mentirosos, feras malignas e glutões preguiçosos.” Clemente de Alexandria nomeia o poeta como Epimênides."
    - "Roma conquistou Creta entre 69 e 67 a.C.: Quinto Cecílio Metelo submeteu toda a ilha e tomou o nome Crético. Sob Augusto, Creta e a Cirenaica, na costa africana, formaram uma província senatorial, com capital em Gortina. Eusébio registra que Tito foi o primeiro a receber a supervisão das igrejas de Creta. Por volta de 298 d.C., Diocleciano fez de Creta uma província separada, ainda governada de Gortina."
  de:
    - "Kreta, die größte der griechischen Inseln, erstreckt sich etwa 260 km von Ost nach West und schließt die Ägäis im Süden ab. In der Bronzezeit war es die Heimat der minoischen Kultur: Der erste Palast in Knossos wurde um 1900 v. Chr. gebaut, und weitere standen in Phaistos und Malia. Arthur Evans begann 1900 mit groß angelegten Ausgrabungen in Knossos. In der letzten Palastzeit führten griechischsprachige Mykener die Buchführung in der Linear-B-Schrift, und der Palast von Knossos wurde nach der konventionellen Datierung um 1350 v. Chr. zerstört, obwohl einige Gelehrte sein Ende später ansetzen."
    - "Die Bibel nennt Kaftor als das Land, aus dem die Philister kamen: Amos sagt, Gott habe „die Philister aus Kaphthor“ geführt, und Jeremia nennt sie „das übrige … aus der Insel Kaphthor“. Kaftor wird oft mit den Keftiu der ägyptischen und den Kaptara der keilschriftlichen Texte verbunden und mit Kreta gleichgesetzt, doch ist dies umstritten, und auch Zypern und Kilikien wurden vorgeschlagen. Zefanjas Weh über die, „so am Meer hinab wohnen, dem Volk der Krether“, im Land der Philister gebraucht einen hebräischen Namen, den die griechische Septuaginta mit „Kreter“ wiedergibt."
    - "Kreter gehörten zu denen, die die Apostel an Pfingsten hörten, und Philo zählt Kreta zu den Inseln voller jüdischer Siedlungen. Auf der Reise nach Rom segelte das Schiff des Paulus bei Salmone unter Kreta hin und erreichte Schönhafen bei Lasäa. Paulus riet zu bleiben, doch die meisten wollten weiterfahren, um in Phönix zu überwintern, „welches ist eine Anfurt an Kreta“, bis der stürmische Wind Euroklydon das Schiff aufs Meer hinaustrieb. In seinem Brief an Titus sagt Paulus, er habe ihn in Kreta gelassen, um „die Städte hin und her mit Ältesten“ zu besetzen, und zitiert einen Propheten aus ihrer Mitte: „Die Kreter sind immer Lügner, böse Tiere und faule Bäuche.“ Klemens von Alexandria nennt den Dichter Epimenides."
    - "Rom eroberte Kreta zwischen 69 und 67 v. Chr.: Quintus Caecilius Metellus unterwarf die ganze Insel und nahm den Beinamen Creticus an. Unter Augustus bildeten Kreta und die Kyrenaika an der afrikanischen Küste eine senatorische Provinz mit der Hauptstadt Gortyn. Eusebius berichtet, Titus habe als Erster die Aufsicht über die Kirchen auf Kreta erhalten. Um 298 n. Chr. machte Diokletian Kreta zu einer eigenen Provinz, die weiterhin von Gortyn aus regiert wurde."
  fr:
    - "La Crète, la plus grande des îles grecques, s’étend sur quelque 260 km d’est en ouest et ferme la mer Égée au sud. À l’âge du Bronze, elle fut le foyer de la civilisation minoenne : le premier palais de Cnossos fut bâti vers 1900 av. J.-C., et d’autres se dressaient à Phaistos et à Malia. Arthur Evans commença les fouilles de grande ampleur à Cnossos en 1900. À la dernière période palatiale, des Mycéniens de langue grecque tenaient les comptes en linéaire B, et le palais de Cnossos fut détruit vers 1350 av. J.-C. selon la datation conventionnelle, bien que certains spécialistes en placent la fin plus tard."
    - "La Bible nomme Caphtor comme le pays d’où vinrent les Philistins : Amos dit que Dieu fit venir « les Philistins de Caphtor », et Jérémie les appelle « les restes de l’île de Caphtor ». Caphtor est souvent rapprochée du Keftiu des textes égyptiens et du Kaptara des textes cunéiformes et identifiée à la Crète, mais cela est discuté, et Chypre et la Cilicie ont aussi été proposées. Le malheur de Sophonie sur « la nation des Kéréthiens » de la côte, au pays des Philistins, emploie un nom hébreu que la Septante grecque rend par « Crétois »."
    - "Des Crétois figuraient parmi ceux qui entendirent les apôtres à la Pentecôte, et Philon compte la Crète parmi les îles pleines de colonies juives. Lors du voyage vers Rome, le navire de Paul longea la Crète au large de Salmone et gagna Beaux-Ports près de Lasée. Paul conseilla de rester, mais la plupart voulurent poursuivre jusqu’à Phénix, « port de Crète », pour y passer l’hiver, jusqu’à ce que le vent tempétueux Euraquilon pousse le navire en haute mer. Dans sa lettre à Tite, Paul dit l’avoir laissé en Crète afin que « tu établisses des anciens dans chaque ville », et cite un prophète des Crétois eux-mêmes : « Crétois toujours menteurs, méchantes bêtes, ventres paresseux ». Clément d’Alexandrie nomme le poète : Épiménide."
    - "Rome conquit la Crète entre 69 et 67 av. J.-C. : Quintus Caecilius Metellus soumit toute l’île et prit le nom de Creticus. Sous Auguste, la Crète et la Cyrénaïque, sur la côte africaine, formèrent une seule province sénatoriale, avec Gortyne pour capitale. Eusèbe rapporte que Tite fut le premier à recevoir la surveillance des Églises de Crète. Vers 298 apr. J.-C., Dioclétien fit de la Crète une province distincte, toujours gouvernée depuis Gortyne."
  it:
    - "Creta, la più grande delle isole greche, si estende per circa 260 km da est a ovest e chiude a sud il Mar Egeo. Nell’età del Bronzo fu la patria della civiltà minoica: il primo palazzo di Cnosso fu costruito intorno al 1900 a.C., e altri sorgevano a Festo e a Malia. Arthur Evans iniziò scavi su larga scala a Cnosso nel 1900. Nell’ultimo periodo palaziale i Micenei di lingua greca tenevano i conti nella scrittura Lineare B, e il palazzo di Cnosso fu distrutto intorno al 1350 a.C. secondo la datazione convenzionale, benché alcuni studiosi ne pongano la fine più tardi."
    - "La Bibbia nomina Caftor come la terra da cui vennero i Filistei: Amos dice che Dio fece salire «i Filistei da Caftor», e Geremia li chiama «ciò che resta dell’isola di Caftor». Caftor è spesso collegata ai Keftiu dei testi egizi e ai Kaptara di quelli cuneiformi e identificata con Creta, ma la cosa è controversa, e sono state proposte anche Cipro e la Cilicia. L’invettiva di Sofonia sulla «nazione dei Keretei» della costa marittima, nel paese dei Filistei, usa un nome ebraico che la Settanta greca rende «Cretesi»."
    - "Dei Cretesi erano fra quelli che udirono gli apostoli a Pentecoste, e Filone annovera Creta fra le isole piene di insediamenti ebraici. Nel viaggio verso Roma la nave di Paolo navigò sotto Creta, di fronte a Salmone, e raggiunse i Buoni Porti vicino a Lasea. Paolo consigliò di fermarsi, ma i più furono per proseguire e svernare a Fenice, «porto di Creta», finché il vento tempestoso Euraquilone spinse la nave al largo. Nella lettera a Tito Paolo dice di averlo lasciato a Creta perché «costituisca degli anziani per ogni città», e cita un profeta dei loro: «I Cretesi son sempre bugiardi, male bestie, ventri pigri». Clemente Alessandrino indica il poeta in Epimenide."
    - "Roma conquistò Creta fra il 69 e il 67 a.C.: Quinto Cecilio Metello sottomise tutta l’isola e prese il nome di Cretico. Sotto Augusto Creta e la Cirenaica sulla costa africana formarono un’unica provincia senatoria, con capitale a Gortina. Eusebio ricorda che Tito fu il primo a ricevere la sorveglianza delle chiese di Creta. Verso il 298 d.C. Diocleziano fece di Creta una provincia a sé, sempre governata da Gortina."
  pl:
    - "Kreta, największa z wysp greckich, ciągnie się na około 260 km ze wschodu na zachód i zamyka Morze Egejskie od południa. W epoce brązu była ojczyzną cywilizacji minojskiej: pierwszy pałac w Knossos zbudowano około 1900 r. p.n.e., a inne stały w Fajstos i Malii. Arthur Evans rozpoczął wielkoskalowe wykopaliska w Knossos w 1900 r. W ostatnim okresie pałacowym grecko mówiący Mykeńczycy prowadzili rachunki pismem linearnym B, a pałac w Knossos został zniszczony około 1350 r. p.n.e. według datowania konwencjonalnego, choć niektórzy uczeni przesuwają jego kres później."
    - "Biblia wymienia Kaftor jako kraj, z którego przybyli Filistyni: Amos mówi, że Bóg wywiódł „Filistyńczyków z Kaftor”, a Jeremiasz nazywa ich: „ostatek wyspy Kaftor”. Kaftor jest często łączony z Keftiu tekstów egipskich i Kaptarą tekstów klinowych i utożsamiany z Kretą, lecz jest to sporne, a proponowano też Cypr i Cylicję. Sofoniasz woła biada „narodowi Ceretejczyków” nad morzem, w ziemi Filistynów, i używa hebrajskiej nazwy, którą grecka Septuaginta oddaje jako „Kreteńczycy”."
    - "Kreteńczycy byli wśród tych, którzy słyszeli apostołów w Pięćdziesiątnicę, a Filon zalicza Kretę do wysp pełnych żydowskich osad. W podróży do Rzymu okręt Pawła przepłynął pod Kretą koło Salmone i dotarł do Pięknych Przystani koło Lasei. Paweł radził zostać, lecz większość chciała płynąć dalej i przezimować w Feniks, „u portu Kreteńskiego”, aż burzliwy wiatr Euroklidon zepchnął okręt na morze. W liście do Tytusa Paweł mówi, że zostawił go w Krecie, aby „postanowił po miastach starszych”, i cytuje ich własnego proroka: „Kreteńczycy zawsze są kłamcami, złemi bestyjami, brzuchami leniwemi”. Klemens Aleksandryjski wymienia tego poetę jako Epimenidesa."
    - "Rzym podbił Kretę w latach 69–67 p.n.e.: Kwintus Cecyliusz Metellus ujarzmił całą wyspę i przyjął przydomek Creticus. Za Augusta Kreta i Cyrenajka na wybrzeżu afrykańskim tworzyły jedną prowincję senatorską ze stolicą w Gortynie. Euzebiusz zapisuje, że Tytus jako pierwszy otrzymał nadzór nad kościołami na Krecie. Około 298 r. n.e. Dioklecjan uczynił Kretę odrębną prowincją, nadal zarządzaną z Gortyny."
  nl:
    - "Kreta, het grootste van de Griekse eilanden, strekt zich over zo'n 260 km van oost naar west uit en sluit de Egeïsche Zee in het zuiden af. In de Bronstijd was het de thuisbasis van de Minoïsche beschaving: het eerste paleis van Knossos werd omstreeks 1900 v.Chr. gebouwd, en andere stonden te Phaistos en Malia. Arthur Evans begon in 1900 grootschalige opgravingen in Knossos. In de laatste paleisperiode voerden Grieks sprekende Myceners de boekhouding in Lineair B, en het paleis van Knossos werd volgens de conventionele datering omstreeks 1350 v.Chr. verwoest, al plaatsen sommige geleerden het einde later."
    - "De Bijbel noemt Kaftor als het land waaruit de Filistijnen kwamen: Amos zegt dat God “de Filistijnen uit Kafthor” heeft opgevoerd, en Jeremia noemt hen “het overblijfsel des eilands van Kafthor”. Kaftor wordt vaak gelijkgesteld met de Keftiu van Egyptische en de Kaptara van spijkerschriftteksten en met Kreta geïdentificeerd, maar dat is omstreden, en ook Cyprus en Cilicië zijn voorgesteld. Zefanja's wee over “den volken der Cheretim” aan de zeekust, in het land der Filistijnen, gebruikt een Hebreeuwse naam die de Griekse Septuaginta weergeeft als “Kretenzers”."
    - "Kretenzers behoorden tot hen die de apostelen met Pinksteren hoorden, en Philo rekent Kreta tot de eilanden vol Joodse nederzettingen. Op de reis naar Rome voer Paulus' schip onder Kreta langs bij Salmone en bereikte de Schone Havens bij Lasea. Paulus raadde aan te blijven, maar de meesten wilden doorvaren om te overwinteren te Fenix, “zijnde een haven in Kreta”, totdat de stormwind Euroklydon het schip de zee op dreef. In zijn brief aan Titus zegt Paulus: “Om die oorzaak heb ik u te Kreta gelaten … dat gij van stad tot stad zoudt ouderlingen stellen”, en hij haalt een profeet van henzelf aan: “De Kretensen zijn altijd leugenachtig, kwade beesten, luie buiken”. Clemens van Alexandrië noemt de dichter Epimenides."
    - "Rome veroverde Kreta tussen 69 en 67 v.Chr.: Quintus Caecilius Metellus onderwierp het hele eiland en nam de naam Creticus aan. Onder Augustus vormden Kreta en Cyrenaica aan de Afrikaanse kust één senatoriale provincie, met Gortyn als hoofdstad. Eusebius vermeldt dat Titus als eerste het toezicht op de kerken van Kreta ontving. Omstreeks 298 n.Chr. maakte Diocletianus van Kreta een eigen provincie, nog steeds vanuit Gortyn bestuurd."
  cs:
    - "Kréta, největší z řeckých ostrovů, se táhne asi 260 km od východu k západu a uzavírá Egejské moře na jihu. V době bronzové byla domovem minojské civilizace: první palác v Knóssu byl postaven kolem roku 1900 př. n. l. a další stály ve Faistu a Malii. Arthur Evans zahájil rozsáhlé vykopávky v Knóssu roku 1900. V posledním paláceovém období vedli řecky mluvící Mykéňané účty písmem lineárním B a palác v Knóssu byl zničen kolem roku 1350 př. n. l. podle konvenčního datování, ač někteří badatelé kladou jeho konec později."
    - "Bible jmenuje Kaftor jako zemi, odkud přišli Pelištejci: Amos praví, že Bůh vyvedl „Filistinské z Kaftor“, a Jeremjáš je nazývá „ostatek krajiny Kaftor“. Kaftor se často spojuje s Keftiu egyptských textů a Kaptarou klínopisných a ztotožňuje s Krétou, ale to je sporné a navrhován byl i Kypr a Kilikie. Sofonjášovo běda „národu Ceretejských“ na mořském pobřeží, v zemi Pelištejců, užívá hebrejského jména, které řecká Septuaginta překládá „Krétané“."
    - "Krétané byli mezi těmi, kdo slyšeli apoštoly o Letnicích, a Filón počítá Krétu mezi ostrovy plné židovských osad. Na cestě do Říma plula Pavlova loď pod Krétou u Salmóny a dorazila do Dobrých přístavů u Lasaie. Pavel radil, aby zůstali, ale většina byla pro to plout dál, „přijedouce do Fenicen, přes zimu tu pobýti na břehu Kréty“, dokud bouřlivý vítr Euroklydon neunesl loď na moře. V listu Titovi Pavel říká, že ho zanechal v Krétě, aby „ustanovil po městech starší“, a cituje jejich vlastního proroka: „Kretenští jsou vždycky lháři, zlá hovada, břicha lenivá“. Klement Alexandrijský jmenuje básníka Epimenida."
    - "Řím dobyl Krétu v letech 69–67 př. n. l.: Quintus Caecilius Metellus podmanil celý ostrov a přijal jméno Creticus. Za Augusta tvořily Kréta a Kyrenaika na africkém pobřeží jednu senátorskou provincii s hlavním městem v Gortyně. Eusebios zaznamenává, že Titus první obdržel dohled nad církvemi na Krétě. Kolem roku 298 n. l. učinil Diocletianus z Kréty samostatnou provincii, stále spravovanou z Gortyny."
