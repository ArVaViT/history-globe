body:
  en:
    - "Hazor lies in Upper Galilee, north of the Sea of Galilee, beside the road from Egypt to Damascus. Its ruins are the largest Bronze Age city in the land: an upper mound of about 12 hectares and a lower city of about 70. A town stood here in the Early Bronze Age, and in the Middle Bronze Age Hazor became a great city; letters from the palace of Mari on the Euphrates, in the eighteenth century BC, name it and its king. In the Amarna letters of the fourteenth century BC the king of Hazor writes to Pharaoh, and the king of Tyre complains that he has left his city and joined the Habiru."
    - 'Joshua tells how Jabin, king of Hazor, gathered the kings of the north against Israel. Joshua took the city, "for Hazor beforetime was the head of all those kingdoms", and burned it, the only one of those cities he burned. In Judges another Jabin reigns in Hazor, and his captain Sisera is defeated by Deborah and Barak. Excavators found the Late Bronze city destroyed by a great fire in the thirteenth century BC. Yigael Yadin and Amnon Ben-Tor link the fire with the Israelites; others think of strife within the city, the Sea Peoples or the general collapse at the end of the Bronze Age.'
    - "1 Kings names Hazor among the cities Solomon built. A six-chambered gate and casemate wall on the upper mound, like those of Megiddo and Gezer, are dated by many to the tenth century BC and by others to the ninth. Later the Israelite town cut a great shaft down to the water table. In the days of Pekah, king of Israel, Tiglath-pileser III of Assyria took Hazor and carried its people captive to Assyria; excavators found the city of that time, 732 BC, burned."
    - "Afterwards only small forts stood on the mound. In the second century BC Jonathan the Maccabee fought the army of Demetrius in the plain of Hazor, as 1 Maccabees and Josephus tell. Josephus places Hazor above Lake Semechonitis, while Eusebius only assigns it to the lot of Naphtali and recalls that Joshua burned it and the king of Assyria destroyed it. No later town is known on the site."
  ru:
    - "Асор лежит в Верхней Галилее, к северу от Галилейского моря, у дороги из Египта в Дамаск. Его развалины — крупнейший город бронзового века в этой земле: верхний холм около 12 га и нижний город площадью около 70 га. Поселение здесь было уже в раннем бронзовом веке, а в среднем бронзовом веке Асор стал большим городом; письма из дворца Мари на Евфрате, XVIII века до н. э., называют его и его царя. В амарнских письмах XIV века до н. э. царь Асора пишет фараону, а царь Тира жалуется, что тот оставил свой город и примкнул к хабиру."
    - "Книга Иисуса Навина рассказывает, как Иавин, царь Асорский, собрал против Израиля царей севера. Иисус Навин взял город, ибо «Асор же прежде был главою всех царств сих», и сжёг его — единственный из тех городов. В Книге Судей в Асоре царствует другой Иавин, и его военачальника Сисару побеждают Девора и Варак. Археологи нашли город позднего бронзового века уничтоженным сильным пожаром в XIII веке до н. э. Игаэль Ядин и Амнон Бен-Тор связывают пожар с израильтянами; другие думают о смуте внутри города, о «народах моря» или об общем крушении конца бронзового века."
    - "Третья книга Царств называет Асор среди городов, которые построил Соломон. Шестикамерные ворота и казематную стену на верхнем холме, подобные воротам Мегиддона и Газера, многие датируют X веком до н. э., другие — IX веком. Позже израильский город пробил большую шахту до грунтовых вод. Во дни Факея, царя Израильского, ассирийский царь Феглаффелласар III взял Асор и переселил его жителей в Ассирию; археологи нашли город того времени, 732 г. до н. э., сожжённым."
    - "После этого на холме стояли лишь небольшие крепости. Во II веке до н. э. Ионафан Маккавей сражался с войском Димитрия на равнине Асора, как рассказывают Первая книга Маккавейская и Иосиф Флавий. Иосиф помещает Асор над озером Семехонитис, а Евсевий лишь относит его к уделу Неффалима и напоминает, что его сжёг Иисус Навин и разрушил царь Ассирийский. Более позднего города на этом месте не известно."
  uk:
    - "Гацор лежить у Верхній Галілеї, на північ від Галілейського моря, біля дороги з Єгипту до Дамаска. Його руїни — найбільше місто бронзового віку в краї: верхнє городище близько 12 гектарів і нижнє місто близько 70. Місто стояло тут у ранньому бронзовому віці, а в середньому бронзовому віці Гацор став великим містом; листи з палацу Марі на Євфраті, XVIII ст. до н. е., називають його та його царя. В амарнських листах XIV ст. до н. е. цар Гацору пише фараонові, а цар Тіру скаржиться, що той покинув своє місто й приєднався до хабіру."
    - "Книга Ісуса Навина розповідає, як Явін, цар Гацору, зібрав царів півночі проти Ізраїлю. Ісус Навин узяв місто, «бо Асор та був перше головою усїм містам в цїм царстві», і спалив його, єдине з тих міст, яке він спалив. У Книзі Суддів у Гацорі царює інший Явін, і його воєначальник Сісара розбитий Деборою та Вараком. Розкопувачі знайшли місто пізнього бронзового віку знищене великою пожежею в XIII ст. до н. е. Йігаель Ядін та Амнон Бен-Тор пов’язують пожежу з ізраїльтянами; інші думають про міжусобицю всередині міста, «народи моря» або загальний крах кінця бронзового віку."
    - "Перша книга Царів називає Гацор серед міст, які збудував Соломон. Брама з шістьма приміщеннями й казематний мур на верхньому городищі, як у Мегіддо й Гезері, датуються багатьма X ст. до н. е., а іншими IX ст. Пізніше ізраїльське місто прорубало велику шахту до рівня ґрунтових вод. За днів Факея, царя Ізраїлю, Тіглатпаласар III Ассирійський узяв Гацор і вивів його людей у полон до Ассирії; розкопувачі знайшли місто того часу, 732 р. до н. е., спаленим."
    - "Згодом на городищі стояли лише малі форти. У II ст. до н. е. Йонатан Макавей воював з військом Димитрія на рівнині Гацору, як розповідають Перша книга Макавеїв та Йосиф Флавій. Йосиф Флавій розміщує Гацор над озером Семехонітським, тоді як Євсевій лише відносить його до жереба Нефталима і нагадує, що Ісус Навин спалив його, а цар Ассирії зруйнував. Жодного пізнішого міста на цьому місці не відомо."
  es:
    - "Hazor se halla en la Alta Galilea, al norte del mar de Galilea, junto al camino de Egipto a Damasco. Sus ruinas son la mayor ciudad de la Edad del Bronce de la región: un montículo superior de unas 12 hectáreas y una ciudad baja de unas 70. Una población se alzó aquí en la Edad del Bronce Antiguo, y en la Edad del Bronce Medio Hazor se convirtió en una gran ciudad; cartas del palacio de Mari, en el Éufrates, del siglo XVIII a. C., la nombran a ella y a su rey. En las cartas de Amarna del siglo XIV a. C. el rey de Hazor escribe al faraón, y el rey de Tiro se queja de que ha abandonado su ciudad y se ha unido a los habiru."
    - "Josué cuenta cómo Jabín, rey de Hazor, reunió a los reyes del norte contra Israel. Josué tomó la ciudad, pues Hasor «había sido antes cabeza de todos estos reinos», y la quemó, la única de aquellas ciudades que quemó. En Jueces reina en Hazor otro Jabín, y su capitán Sísara es derrotado por Débora y Barac. Los excavadores hallaron la ciudad del Bronce Final destruida por un gran incendio en el siglo XIII a. C. Yigael Yadin y Amnon Ben-Tor vinculan el incendio con los israelitas; otros piensan en luchas dentro de la ciudad, en los Pueblos del Mar o en el colapso general del fin de la Edad del Bronce."
    - "1 Reyes nombra Hazor entre las ciudades que construyó Salomón. Una puerta de seis cámaras y un muro de casamatas en el montículo superior, como los de Meguido y Gezer, son fechados por muchos en el siglo X a. C. y por otros en el IX. Más tarde la población israelita excavó un gran pozo hasta el nivel freático. En los días de Peka, rey de Israel, Tiglat-pileser III de Asiria tomó Hazor y llevó cautivo a su pueblo a Asiria; los excavadores hallaron la ciudad de aquella época, 732 a. C., quemada."
    - "Después solo pequeños fuertes se alzaron en el montículo. En el siglo II a. C. Jonatán Macabeo combatió al ejército de Demetrio en la llanura de Hazor, como cuentan 1 Macabeos y Josefo. Josefo sitúa Hazor sobre el lago Semaconítide, mientras que Eusebio solo la asigna a la suerte de Neftalí y recuerda que Josué la quemó y el rey de Asiria la destruyó. No se conoce ninguna población posterior en el sitio."
  pt:
    - "Hazor fica na Alta Galileia, ao norte do mar da Galileia, junto à estrada do Egito a Damasco. Suas ruínas são a maior cidade da Idade do Bronze na terra: um monte superior de cerca de 12 hectares e uma cidade baixa de cerca de 70. Uma cidade se erguia aqui na Idade do Bronze Antigo, e no Bronze Médio Hazor tornou-se uma grande cidade; cartas do palácio de Mari, no Eufrates, no século XVIII a.C., nomeiam-na e a seu rei. Nas cartas de Amarna do século XIV a.C., o rei de Hazor escreve ao faraó, e o rei de Tiro se queixa de que ele deixou a sua cidade e se juntou aos habiru."
    - "Josué conta como Jabim, rei de Hazor, reuniu os reis do norte contra Israel. Josué tomou a cidade, “pois Hazor, no passado, era a cabeça de todos aqueles reinos”, e a queimou, a única daquelas cidades que queimou. Em Juízes, outro Jabim reina em Hazor, e seu capitão Sísera é derrotado por Débora e Baraque. Os escavadores acharam a cidade do Bronze Tardio destruída por um grande incêndio no século XIII a.C. Yigael Yadin e Amnon Ben-Tor ligam o incêndio aos israelitas; outros pensam em luta dentro da cidade, nos Povos do Mar ou no colapso geral do fim da Idade do Bronze."
    - "Primeiro Reis nomeia Hazor entre as cidades que Salomão edificou. Um portão de seis câmaras e uma muralha de casamatas no monte superior, como os de Megido e Gezer, são datados por muitos do século X a.C. e por outros do IX. Mais tarde a cidade israelita abriu um grande poço até o lençol freático. Nos dias de Peca, rei de Israel, Tiglate-Pileser III da Assíria tomou Hazor e levou seu povo cativo para a Assíria; os escavadores acharam queimada a cidade daquele tempo, 732 a.C."
    - "Depois disso só pequenos fortes se ergueram no monte. No século II a.C., Jônatas Macabeu combateu o exército de Demétrio na planície de Hazor, como contam 1 Macabeus e Josefo. Josefo situa Hazor acima do lago Semeconites, ao passo que Eusébio apenas a atribui à porção de Naftali e recorda que Josué a queimou e o rei da Assíria a destruiu. Nenhuma cidade posterior é conhecida no sítio."
  de:
    - "Hazor liegt in Obergaliläa nördlich des Sees Genezareth an der Straße von Ägypten nach Damaskus. Seine Ruinen sind die größte bronzezeitliche Stadt des Landes: ein Oberhügel von etwa 12 Hektar und eine Unterstadt von etwa 70. Schon in der Frühbronzezeit stand hier eine Siedlung, und in der Mittelbronzezeit wurde Hazor eine große Stadt; Briefe aus dem Palast von Mari am Euphrat nennen sie und ihren König im 18. Jahrhundert v. Chr. In den Amarnabriefen des 14. Jahrhunderts v. Chr. schreibt der König von Hazor an den Pharao, und der König von Tyrus klagt, er habe seine Stadt verlassen und sich den Habiru angeschlossen."
    - "Josua erzählt, wie Jabin, der König von Hazor, die Könige des Nordens gegen Israel versammelte. Josua nahm die Stadt, „denn Hazor war vormals die Hauptstadt aller dieser Königreiche“, und verbrannte sie, als einzige jener Städte. Im Buch der Richter herrscht ein anderer Jabin in Hazor, und sein Feldhauptmann Sisera wird von Debora und Barak besiegt. Die Ausgräber fanden die spätbronzezeitliche Stadt im 13. Jahrhundert v. Chr. durch einen großen Brand zerstört. Yigael Yadin und Amnon Ben-Tor verbinden den Brand mit den Israeliten; andere denken an Streit in der Stadt, die Seevölker oder den allgemeinen Zusammenbruch am Ende der Bronzezeit."
    - "Das erste Königsbuch nennt Hazor unter den Städten, die Salomo baute. Ein Sechskammertor und eine Kasemattenmauer auf dem Oberhügel, wie die von Megiddo und Geser, werden von vielen ins 10. Jahrhundert v. Chr., von anderen ins 9. datiert. Später trieb die israelitische Stadt einen großen Schacht hinab zum Grundwasser. Zur Zeit Pekachs, des Königs von Israel, nahm Tiglat-Pileser III. von Assyrien Hazor und führte seine Bewohner gefangen nach Assyrien; die Ausgräber fanden die Stadt jener Zeit, 732 v. Chr., verbrannt."
    - "Danach standen auf dem Hügel nur noch kleine Festungen. Im 2. Jahrhundert v. Chr. kämpfte Jonatan der Makkabäer in der Ebene von Hazor gegen das Heer des Demetrius, wie das erste Makkabäerbuch und Josephus erzählen. Josephus setzt Hazor über dem See Semechonitis an, während Eusebius es nur dem Los Naftalis zuweist und daran erinnert, dass Josua es verbrannte und der König von Assyrien es zerstörte. Keine spätere Stadt auf der Stätte ist bekannt."
  fr:
    - "Hatsor se trouve en Haute Galilée, au nord de la mer de Galilée, au bord de la route d’Égypte à Damas. Ses ruines sont la plus grande ville de l’âge du Bronze du pays : un tertre supérieur d’environ 12 hectares et une ville basse d’environ 70. Une ville s’y dressait au Bronze ancien, et au Bronze moyen Hatsor devint une grande cité ; des lettres du palais de Mari sur l’Euphrate, au XVIIIe siècle av. J.-C., la nomment ainsi que son roi. Dans les lettres d’Amarna du XIVe siècle av. J.-C., le roi de Hatsor écrit au pharaon, et le roi de Tyr se plaint qu’il a quitté sa ville et rejoint les Habirou."
    - "Josué raconte comment Jabin, roi de Hatsor, rassembla les rois du nord contre Israël. Josué prit la ville, car « Hatsor était autrefois la principale ville de tous ces royaumes », et la brûla, la seule de ces villes qu’il brûla. Dans les Juges, un autre Jabin règne à Hatsor, et son chef d’armée Sisera est vaincu par Débora et Barak. Les fouilleurs trouvèrent la ville du Bronze récent détruite par un grand incendie au XIIIe siècle av. J.-C. Yigael Yadin et Amnon Ben-Tor rattachent l’incendie aux Israélites ; d’autres pensent à des luttes internes, aux Peuples de la mer ou à l’effondrement général de la fin de l’âge du Bronze."
    - "Le premier livre des Rois nomme Hatsor parmi les villes que bâtit Salomon. Une porte à six chambres et un mur à casemates sur le tertre supérieur, comme ceux de Meguiddo et de Guézer, sont datés par beaucoup du Xe siècle av. J.-C. et par d’autres du IXe. Plus tard, la ville israélite creusa un grand puits jusqu’à la nappe phréatique. Du temps de Péka, roi d’Israël, Tiglath-Piléser III d’Assyrie prit Hatsor et emmena ses habitants captifs en Assyrie ; les fouilleurs trouvèrent la ville de cette époque, 732 av. J.-C., incendiée."
    - "Ensuite, seuls de petits forts se dressèrent sur le tertre. Au IIe siècle av. J.-C., Jonathan Maccabée combattit l’armée de Démétrius dans la plaine de Hatsor, comme le racontent 1 Maccabées et Josèphe. Josèphe place Hatsor au-dessus du lac Semachonitis, tandis qu’Eusèbe se borne à l’assigner au lot de Nephthali et rappelle que Josué la brûla et que le roi d’Assyrie la détruisit. On ne connaît aucune ville ultérieure sur le site."
  pl:
    - "Chasor leży w Górnej Galilei, na północ od Jeziora Galilejskiego, przy drodze z Egiptu do Damaszku. Jego ruiny to największe miasto epoki brązu w kraju: górny pagórek o powierzchni około 12 hektarów i dolne miasto około 70. Miasto stało tu we wczesnej epoce brązu, a w środkowej epoce brązu Chasor stał się wielkim miastem; listy z pałacu w Mari nad Eufratem z XVIII w. p.n.e. wymieniają je i jego króla. W listach z Amarna z XIV w. p.n.e. król Chasoru pisze do faraona, a król Tyru skarży się, że opuścił swoje miasto i przyłączył się do Habiru."
    - "Księga Jozuego opowiada, jak Jabin, król Chasoru, zebrał królów północy przeciw Izraelowi. Jozue zdobył miasto, „Hasor było przedtem głową wszystkich tych królestw”, i spalił je, jedyne z tych miast, które spalił. W Księdze Sędziów w Chasorze rządzi inny Jabin, a jego wódz Sisera zostaje pokonany przez Deborę i Baraka. Badacze znaleźli miasto z późnej epoki brązu zniszczone wielkim pożarem w XIII w. p.n.e. Jigael Jadin i Amnon Ben-Tor wiążą pożar z Izraelitami; inni myślą o walkach wewnątrz miasta, Ludach Morza lub powszechnym upadku na końcu epoki brązu."
    - "Pierwsza Księga Królewska wymienia Chasor wśród miast zbudowanych przez Salomona. Brama z sześcioma komorami i mur kazamatowy na górnym pagórku, podobne do tych w Megiddo i Gezer, są datowane przez wielu na X w. p.n.e., a przez innych na IX w. Później izraelskie miasto wykuło wielki szyb aż do poziomu wód gruntowych. W dniach Pekacha, króla Izraela, Tiglat-Pileser III z Asyrii zdobył Chasor i uprowadził jego ludność do Asyrii; badacze znaleźli miasto z tego czasu, 732 r. p.n.e., spalone."
    - "Potem na pagórku stały tylko małe forty. W II w. p.n.e. Jonatan Machabeusz walczył z wojskiem Demetriusza na równinie Chasoru, jak opowiadają 1 Księga Machabejska i Józef Flawiusz. Józef Flawiusz umieszcza Chasor nad jeziorem Semechonitis, a Euzebiusz tylko przydziela go do losu Neftalego i przypomina, że Jozue go spalił, a król Asyrii zniszczył. Nie znamy późniejszego miasta na tym miejscu."
  it:
    - "Asor si trova nell’Alta Galilea, a nord del Lago di Tiberiade, presso la strada dall’Egitto a Damasco. Le sue rovine sono la più grande città dell’età del Bronzo nel paese: un tell superiore di circa 12 ettari e una città bassa di circa 70. Una città sorgeva qui nel Bronzo Antico, e nel Bronzo Medio Asor divenne una grande città; lettere dal palazzo di Mari sull’Eufrate, nel XVIII secolo a.C., nominano la città e il suo re. Nelle lettere di Amarna del XIV secolo a.C. il re di Asor scrive al faraone, e il re di Tiro si lamenta che abbia lasciato la sua città e si sia unito agli Habiru."
    - "Giosuè racconta come Iabin, re di Asor, radunò i re del nord contro Israele. Giosuè prese la città, perché «Hatsor era stata per l’addietro la capitale di tutti quei regni», e la incendiò, la sola di quelle città che bruciò. Nei Giudici un altro Iabin regna in Asor, e il suo capo Sisara è sconfitto da Debora e Barak. Gli scavatori trovarono la città del Bronzo Tardo distrutta da un grande incendio nel XIII secolo a.C. Yigael Yadin e Amnon Ben-Tor collegano l’incendio con gli Israeliti; altri pensano a contese interne alla città, ai Popoli del Mare o al collasso generale alla fine dell’età del Bronzo."
    - "1 Re nomina Asor fra le città costruite da Salomone. Una porta a sei camere e un muro a casematte sul tell superiore, come quelli di Meghiddo e di Ghezer, sono datati da molti al X secolo a.C. e da altri al IX. Più tardi la città israelitica scavò un grande pozzo fino alla falda. Ai giorni di Pekach, re d’Israele, Tiglat-Pilèser III d’Assiria prese Asor e ne deportò la gente in Assiria; gli scavatori trovarono la città di quel tempo, 732 a.C., bruciata."
    - "In seguito sul tell sorsero solo piccoli forti. Nel II secolo a.C. Gionata il Maccabeo combatté l’esercito di Demetrio nella pianura di Asor, come raccontano 1 Maccabei e Giuseppe Flavio. Giuseppe Flavio pone Asor sopra il lago Semechonitide, mentre Eusebio la assegna soltanto al lotto di Neftali e ricorda che Giosuè la bruciò e il re d’Assiria la distrusse. Nessuna città posteriore è nota sul sito."
  nl:
    - "Hazor ligt in Boven-Galilea, ten noorden van het Meer van Galilea, naast de weg van Egypte naar Damascus. De ruïnes zijn de grootste stad uit de Bronstijd in het land: een bovenheuvel van ongeveer 12 hectare en een benedenstad van ongeveer 70. Er stond al in de Vroege Bronstijd een stad, en in de Midden-Bronstijd werd Hazor een grote stad; brieven uit het paleis van Mari aan de Eufraat, in de 18e eeuw v.Chr., noemen haar en haar koning. In de brieven van Amarna uit de 14e eeuw v.Chr. schrijft de koning van Hazor aan de farao, en de koning van Tyrus klaagt dat hij zijn stad heeft verlaten en zich bij de Habiru heeft gevoegd."
    - "Jozua vertelt hoe Jabin, koning van Hazor, de koningen van het noorden tegen Israël verzamelde. Jozua nam de stad in, “want Hazor was te voren het hoofd van al deze koninkrijken”, en verbrandde haar, als enige van die steden. In Richteren regeert een andere Jabin in Hazor, en zijn krijgsoverste Sisera wordt door Debora en Barak verslagen. Opgravers vonden de stad van de Late Bronstijd verwoest door een grote brand in de 13e eeuw v.Chr. Yigael Yadin en Amnon Ben-Tor brengen de brand in verband met de Israëlieten; anderen denken aan strijd binnen de stad, de Zeevolken of de algemene ineenstorting aan het eind van de Bronstijd."
    - "1 Koningen noemt Hazor onder de steden die Salomo bouwde. Een poort met zes kamers en een kazemattenmuur op de bovenheuvel, net als die van Megiddo en Gezer, worden door velen gedateerd in de 10e eeuw v.Chr. en door anderen in de 9e. Later groef de Israëlitische stad een grote schacht naar de grondwaterspiegel. In de dagen van Pekach, koning van Israël, nam Tiglat-Pileser III van Assyrië Hazor in en voerde zijn bewoners gevangen naar Assyrië; opgravers vonden de stad van die tijd, 732 v.Chr., verbrand."
    - "Daarna stonden er alleen kleine forten op de heuvel. In de 2e eeuw v.Chr. streed Jonatan de Makkabeeër tegen het leger van Demetrius in de vlakte van Hazor, zoals 1 Makkabeeën en Josephus vertellen. Josephus plaatst Hazor boven het Meer van Semechonitis, terwijl Eusebius het alleen toewijst aan het lot van Naftali en eraan herinnert dat Jozua het verbrandde en de koning van Assyrië het verwoestte. Er is geen latere stad op de plaats bekend."
  cs:
    - "Chacor leží v Horní Galileji, severně od Galilejského jezera, u cesty z Egypta do Damašku. Jeho zříceniny jsou největším městem doby bronzové v zemi: horní pahorek o rozloze asi 12 hektarů a dolní město asi 70. Město tu stálo již v rané době bronzové a ve střední době bronzové se Chacor stal velkým městem; dopisy z paláce v Mari na Eufratu, z 18. stol. př. n. l., jmenují je i jeho krále. V amarnských dopisech 14. stol. př. n. l. píše chacorský král faraonovi a král Týru si stěžuje, že opustil své město a připojil se k Chabirům."
    - "Jozue vypráví, jak Jabín, král chacorský, shromáždil krále severu proti Izraeli. Jozue město dobyl, „Azor pak bylo prvé nejznamenitější mezi všemi království těmi“, a spálil je, jediné z oněch měst, které spálil. V Soudcích kraluje v Chacoru jiný Jabín a jeho vojevůdce Sisera je poražen Deborou a Bárakem. Vykopávači nalezli město z pozdní doby bronzové zničené velkým požárem ve 13. stol. př. n. l. Jigael Jadin a Amnón Ben-Tor spojují požár s Izraelity; jiní myslí na boje uvnitř města, Mořské národy nebo všeobecný zánik na konci doby bronzové."
    - "První kniha Královská jmenuje Chacor mezi městy, která Šalomoun vystavěl. Brána o šesti komorách a kazematová hradba na horním pahorku, jako brány Megida a Gezeru, jsou mnohými datovány do 10. stol. př. n. l. a jinými do 9. století. Později izraelské město vyhloubilo velkou šachtu až k hladině podzemní vody. Za dnů Pekacha, krále Izraele, dobyl Chacor Tiglatpilesar III. Asyrský a odvedl jeho lid do zajetí v Asýrii; vykopávači nalezli město té doby, 732 př. n. l., vypálené."
    - "Poté stály na pahorku jen malé pevnůstky. Ve 2. stol. př. n. l. bojoval Jonatan Makabejský s vojskem Démétria v rovině Chacoru, jak vyprávějí První kniha Makabejská a Josephus. Josephus klade Chacor nad jezero Semachónitis, kdežto Eusebios jej jen přiřazuje k losu Neftalího a připomíná, že jej Jozue spálil a král asyrský zničil. Žádné pozdější město na místě není známo."
  sv:
    - "Hasor ligger i övre Galileen, norr om Galileiska sjön, vid vägen från Egypten till Damaskus. Dess ruiner är landets största stad från bronsåldern: en övre kulle på omkring 12 hektar och en nedre stad på omkring 70. En stad stod här redan under tidig bronsålder, och under mellanbronsåldern blev Hasor en stor stad; brev från palatset i Mari vid Eufrat, på 1700-talet f.Kr., nämner den och dess kung. I Amarnabreven från 1300-talet f.Kr. skriver Hasors kung till farao, och Tyros kung klagar över att han har lämnat sin stad och slutit sig till habiru."
    - "Josua berättar hur Javin, kung av Hasor, samlade nordens kungar mot Israel. Josua intog staden, ”ty Hasor var fordom huvudstaden för alla dessa riken”, och brände den, den enda av dessa städer han brände. I Domarboken regerar en annan Javin i Hasor, och hans härhövitsman Sisera besegras av Debora och Barak. Utgrävare fann den senbronsåldriga staden förstörd av en stor eld på 1200-talet f.Kr. Yigael Yadin och Amnon Ben-Tor kopplar elden till israeliterna; andra tänker på strid inom staden, havsfolken eller det allmänna sammanbrottet vid bronsålderns slut."
    - "Första Kungaboken nämner Hasor bland de städer Salomo byggde. En port med sex kamrar och en kasemattmur på övre kullen, liksom de i Megiddo och Geser, dateras av många till 900-talet f.Kr. och av andra till 800-talet. Senare högg den israelitiska staden ett stort schakt ned till grundvattnet. På Pekachs tid, Israels kung, intog Tiglat-Pileser III av Assyrien Hasor och förde dess folk i fångenskap till Assyrien; utgrävare fann staden från den tiden, 732 f.Kr., bränd."
    - "Därefter stod bara små fästningar på kullen. På 100-talet f.Kr. stred Jonatan mackabeen mot Demetrios armé på Hasors slätt, som Första Mackabeerboken och Josefus berättar. Josefus placerar Hasor ovanför sjön Semechonitis, medan Eusebios bara hänför den till Naftalis lott och erinrar om att Josua brände den och Assyriens kung förstörde den. Ingen senare stad är känd på platsen."
  nb:
    - "Hasor ligger i øvre Galilea, nord for Galileasjøen, ved veien fra Egypt til Damaskus. Ruinene er den største bronsealderbyen i landet: en øvre haug på omtrent 12 hektar og en nedre by på omtrent 70. En by sto her i tidlig bronsealder, og i mellombronsealder ble Hasor en stor by; brev fra palasset i Mari ved Eufrat, på 1700-tallet f.Kr., nevner den og dens konge. I Amarna-brevene fra 1300-tallet f.Kr. skriver kongen av Hasor til farao, og kongen av Tyros klager over at han har forlatt sin by og sluttet seg til Habiru."
    - "Josva forteller hvordan Jabin, kongen i Hasor, samlet kongene i nord mot Israel. Josva inntok byen, «for Hasor var fordum hovedstaden for alle disse kongeriker», og brente den, den eneste av disse byene han brente. I Dommerboken regjerer en annen Jabin i Hasor, og hans hærfører Sisera blir beseiret av Debora og Barak. Utgraverne fant at byen fra sen bronsealder var ødelagt av en stor brann på 1200-tallet f.Kr. Yigael Yadin og Amnon Ben-Tor knytter brannen til israelittene; andre tenker på stridigheter i byen selv, havfolkene eller det generelle sammenbruddet ved slutten av bronsealderen."
    - "Første Kongebok nevner Hasor blant byene Salomo bygde. En port med seks kamre og en kasemattmur på den øvre haugen, som de i Megiddo og Geser, dateres av mange til 900-tallet f.Kr. og av andre til 800-tallet. Senere hugget den israelittiske byen en stor sjakt ned til grunnvannsspeilet. I Pekahs dager, Israels konge, tok Tiglat-Pileser 3. av Assyria Hasor og førte folket i fangenskap til Assyria; utgraverne fant byen fra den tiden, 732 f.Kr., brent."
    - "Etterpå sto bare små festninger på haugen. På 100-tallet f.Kr. kjempet Jonatan Makkabeus mot Demetrios' hær på Hasor-sletten, slik Første Makkabeerbok og Josefus forteller. Josefus plasserer Hasor over Semechonitis-sjøen, mens Eusebius bare tildeler den til Naftalis lodd og minner om at Josva brente den og Assyrias konge ødela den. Ingen senere by er kjent på stedet."
