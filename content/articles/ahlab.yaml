body:
  en:
    - "Ahlab, “fertile”, was one of the coastal towns that the tribe of Asher never took: “Neither did Asher drive out the inhabitants of Accho, nor the inhabitants of Zidon, nor of Ahlab, nor of Achzib, nor of Helbah, nor of Aphik, nor of Rehob.” Many scholars hold that Ahlab, Helbah in the same verse and the Mahalab that some read in Asher's border list at Joshua 19:29 are forms of one name, the Mahalliba of Assyrian texts; an older proposal, noted in the International Standard Bible Encyclopedia, placed it at Gush Halav in upper Galilee."
    - "Mahalliba appears in Sennacherib's account of his campaign of 701 BC, among the towns of the king of Sidon that submitted to him, listed between Zarephath and Ushu, the mainland town of Tyre. It is usually located at Khirbet el-Mahalib on the coast of southern Lebanon, about 6 km north of Tyre and some 2 km south of the mouth of the Litani, where the map sets it."
  ru:
    - "Ахлав, «плодородный», — один из приморских городов, которых колено Асирово так и не взяло: «И Асир не изгнал жителей Акко которые платили ему дань, и жителей Дора и жителей Сидона и Ахлава, Ахзива, Хелвы, Афека и Рехова». Многие учёные считают, что Ахлав, Хелва в том же стихе и Махалав, которого некоторые читают в описании границы Асира в Нав 19:29, — формы одного имени, Махаллибы ассирийских текстов; более старое предложение, отмеченное в Международной стандартной библейской энциклопедии, помещало его в Гуш-Халав в Верхней Галилее."
    - "Махаллиба встречается в рассказе Синаххериба о походе 701 г. до н. э. среди городов сидонского царя, покорившихся ему, между Сарептой и Ушу — материковым городом Тира. Её обычно помещают в Хирбет-эль-Махалиб на побережье Южного Ливана, примерно в 6 км к северу от Тира и в 2 км к югу от устья Литани, где её и ставит карта."
  cs:
    - "Achlab, „úrodný“, bylo jedno z pobřežních měst, která pokolení Ašer nikdy nedobylo: „Asser také nevyhnal obyvatelů Acho a obyvatelů Sidonu, ani Ahalab, ani Achzib, ani Helba, ani Afek, ani Rohob.“ Mnozí badatelé míní, že Achlab, Chelba ve stejném verši a Mahalab, který někteří čtou v seznamu Ašerových hranic v Joz 19,29, jsou podoby jednoho jména, asyrské Mahalliby; starší návrh, zaznamenaný v International Standard Bible Encyclopedia, jej kladl do Guš Chalavu v Horní Galileji."
    - "Mahalliba se objevuje ve Senacheribově líčení tažení roku 701 př. n. l. mezi městy sidónského krále, která se mu podrobila, uvedená mezi Sareptou a Ušu, pevninským městem Týru. Obvykle se klade do Chirbet el-Mahálib na pobřeží jižního Libanonu, asi 6 km severně od Týru a asi 2 km jižně od ústí Lítání, kam je klade mapa."
  uk:
    - "Ахлав, «родючий», був одним із прибережних міст, яких плем'я Асіра так і не здобуло: «І Ассер не повиганяв осадників Акковських і осадників Сидонських і Ахлавських, Ахзивських, Гелвийських, Афеківських та Реховських». Багато вчених вважають, що Ахлав, Хелва в тому самому вірші та Махалаб, який дехто читає у переліку меж Асіра в Ісусі Навині 19:29, — форми однієї назви, Махаліби ассирійських текстів; давніша пропозиція, відзначена в International Standard Bible Encyclopedia, розміщувала його в Гуш-Халаві у верхній Галілеї."
    - "Махаліба з'являється в розповіді Сінаххеріба про похід 701 р. до н. е. серед міст царя Сидона, що підкорилися йому, у переліку між Сарептою та Ушу, материковим містом Тіра. Її зазвичай розміщують у Хірбет-ель-Махалеб на узбережжі південного Лівану, приблизно за 6 км на північ від Тіра й близько 2 км на південь від гирла Літані, де її й ставить мапа."
  pl:
    - "Achlab, „żyzne”, było jednym z nadmorskich miast, których pokolenie Aszer nigdy nie zdobyło: „Aser też nie wypędził mieszkających w Acho, i mieszkających w Sydonie, i w Ahalab, i w Achsyb, i w Helba, i w Afek, i w Rohob”. Wielu uczonych uważa, że Achlab, Chelba z tego samego wersetu i Mahalab, który niektórzy czytają na liście granic Aszera w Joz 19,29, są formami jednej nazwy, Mahalliba tekstów asyryjskich; starsza propozycja, odnotowana w International Standard Bible Encyclopedia, umieszczała je w Gusz Chalaw w górnej Galilei."
    - "Mahalliba pojawia się w relacji Sennacheryba z wyprawy w 701 p.n.e., wśród miast króla Sydonu, które mu się poddały, wymieniona między Sareptą a Uszu, lądowym miastem Tyru. Lokalizuje się je zwykle w Chirbet el-Mahalib na wybrzeżu południowego Libanu, około 6 km na północ od Tyru i około 2 km na południe od ujścia Litani, gdzie umieszcza je mapa."
  es:
    - "Ahlab, «fértil», fue una de las ciudades costeras que la tribu de Aser nunca tomó: «Tampoco Aser echó á los que habitaban en Achô, y á los que habitaban en Sidón, y en Ahlab, y en Achzib, y en Helba, y en Aphec, y en Rehod». Muchos estudiosos sostienen que Ahlab, Helba en el mismo versículo y la Mahalab que algunos leen en la lista de la frontera de Aser en Josué 19:29 son formas de un solo nombre, la Mahalliba de los textos asirios; una propuesta más antigua, recogida en la International Standard Bible Encyclopedia, la situaba en Gush Halav, en la Alta Galilea."
    - "Mahalliba aparece en el relato de Senaquerib sobre su campaña de 701 a. C., entre las ciudades del rey de Sidón que se le sometieron, enumerada entre Sarepta y Ushu, la ciudad continental de Tiro. Suele localizarse en Khirbet el-Mahalib, en la costa del sur del Líbano, a unos 6 km al norte de Tiro y a unos 2 km al sur de la desembocadura del Litani, donde la sitúa el mapa."
  pt:
    - "Alabe, “fértil”, era uma das cidades costeiras que a tribo de Aser nunca tomou: “Aser não expulsou os habitantes de Aco, nem os habitantes de Sidom, nem de Ahlabe, nem de Aczibe, nem de Helba, nem de Afeque, nem de Reobe.” Muitos estudiosos sustentam que Alabe, Helba, no mesmo versículo, e o Mahalab que alguns leem na lista de fronteiras de Aser em Josué 19:29 são formas de um só nome, a Mahalliba dos textos assírios; uma proposta mais antiga, anotada na International Standard Bible Encyclopedia, a situava em Gush Halav, na alta Galileia."
    - "Mahalliba aparece no relato de Senaqueribe sobre sua campanha de 701 a.C., entre as cidades do rei de Sidom que se submeteram a ele, listada entre Sarepta e Ushu, a cidade continental de Tiro. É geralmente localizada em Khirbet el-Mahalib, na costa do sul do Líbano, cerca de 6 km ao norte de Tiro e uns 2 km ao sul da foz do Litani, onde o mapa a coloca."
  de:
    - "Achlab, „fruchtbar“, war eine der Küstenstädte, die der Stamm Asser nie einnahm: „Asser vertrieb die Einwohner zu Akko nicht noch die Einwohner zu Sidon, zu Ahelab, zu Achsib, zu Helba, zu Aphik und zu Rehob“. Viele Gelehrte halten Achlab, Helba im selben Vers und das Mahaleb, das manche in Assers Grenzliste in Josua 19,29 lesen, für Formen eines Namens, des Mahalliba der assyrischen Texte; ein älterer Vorschlag, in der International Standard Bible Encyclopedia vermerkt, setzte es in Gusch Chalav in Obergaliläa an."
    - "Mahalliba erscheint in Sanheribs Bericht über seinen Feldzug von 701 v. Chr. unter den Städten des Königs von Sidon, die sich ihm unterwarfen, zwischen Sarepta und Uschu, der Festlandstadt von Tyrus. Es wird gewöhnlich in Chirbet el-Mahalib an der Küste des südlichen Libanon angesetzt, etwa 6 km nördlich von Tyrus und etwa 2 km südlich der Mündung des Litani, wo die Karte es einträgt."
  fr:
    - "Achlab, « fertile », était l’une des villes côtières que la tribu d’Aser ne prit jamais : « Aser ne chassa point les habitants d’Acco, ni les habitants de Sidon, ni ceux d’Achlal, d’Aczib, de Helba, d’Aphik et de Rehob » (Louis Segond écrit Achlal, la version du roi Jacques Ahlab). Bien des savants tiennent qu’Achlab, Helba dans le même verset et le Mahalab que certains lisent dans la liste frontalière d’Aser en Josué 19:29 sont des formes d’un seul nom, le Mahalliba des textes assyriens ; une proposition plus ancienne, notée dans l’International Standard Bible Encyclopedia, la plaçait à Gouch Halav, en Haute Galilée."
    - "Mahalliba paraît dans le récit de la campagne de Sanchérib en 701 av. J.-C., parmi les villes du roi de Sidon qui se soumirent à lui, citée entre Sarepta et Ouchou, la ville continentale de Tyr. On la situe d’ordinaire à Khirbet el-Mahalib, sur la côte du sud du Liban, à environ 6 km au nord de Tyr et à quelque 2 km au sud de l’embouchure du Litani, où la carte la place."
  it:
    - "Acleb, «fertile», era una delle città costiere che la tribù di Aser non conquistò mai: «Ascer non cacciò gli abitanti di Acco, né gli abitanti di Sidone, né quelli di Ahlab, di Aczib, di Helba, di Afik, di Rehob». Molti studiosi ritengono che Acleb, Chelba nello stesso versetto e la Mahalab che alcuni leggono nell’elenco dei confini di Aser in Giosuè 19,29 siano forme di un solo nome, la Mahalliba dei testi assiri; una proposta più antica, ricordata nella International Standard Bible Encyclopedia, la collocava a Gush Halav nell’alta Galilea."
    - "Mahalliba compare nel racconto di Sennacherib sulla sua campagna del 701 a.C., tra le città del re di Sidone che si sottomisero a lui, elencata tra Sarepta e Ushu, la città di Tiro sulla terraferma. È di solito localizzata a Khirbet el-Mahalib, sulla costa del Libano meridionale, a circa 6 km a nord di Tiro e a circa 2 km a sud della foce del Litani, dove la colloca la carta."
  nl:
    - "Achlab, ‘vruchtbaar’, was een van de kuststeden die de stam Aser nooit innam: “Aser verdreef de inwoners van Acco niet, noch de inwoners van Sidon, noch Achlab, noch Achsib, noch Chelba, noch Afik, noch Rechob.” Veel geleerden menen dat Achlab, Chelba in hetzelfde vers en het Mahalab dat sommigen lezen in Asers grenslijst in Jozua 19:29 vormen zijn van één naam, het Mahalliba van Assyrische teksten; een oudere opvatting, vermeld in de International Standard Bible Encyclopedia, plaatste het bij Gush Halav in Boven-Galilea."
    - "Mahalliba komt voor in Sanheribs verslag van zijn veldtocht van 701 v.Chr., onder de steden van de koning van Sidon die zich aan hem onderwierpen, vermeld tussen Sarefat en Ushu, de vastelandsstad van Tyrus. Het wordt gewoonlijk gezocht bij Khirbet el-Mahalib aan de kust van Zuid-Libanon, ongeveer 6 km ten noorden van Tyrus en zo'n 2 km ten zuiden van de monding van de Litani, waar de kaart het zet."
  sv:
    - "Achlav, ”bördig”, var en av de kuststäder som Ashers stam aldrig intog: ”Aser fördrev icke invånarna i Acko eller invånarna i Sidon, ej heller dem i Alab, Aksib, Helba, Afik och Rehob.” Många forskare anser att Achlav, Helba i samma vers och det Mahalab som några läser i Ashers gränsförteckning i Josua 19:29 är former av ett och samma namn, Mahalliba i assyriska texter; ett äldre förslag, som antecknas i International Standard Bible Encyclopedia, placerade det vid Gush Halav i övre Galileen."
    - "Mahalliba förekommer i Sanheribs redogörelse för hans fälttåg år 701 f.Kr., bland de städer under Sidons kung som underkastade sig honom, uppräknad mellan Sarefat och Ushu, Tyros fastlandsstad. Den förläggs vanligen till Khirbet el-Mahalib vid kusten i södra Libanon, omkring 6 km norr om Tyros och cirka 2 km söder om Litanis mynning, där kartan placerar den."
  nb:
    - "Ahlab, «fruktbar», var en av kystbyene som Asjers stamme aldri inntok: «Aser drev ikke bort innbyggerne i Akko og innbyggerne i Sidon og Ahlab og Aksib og Helba og Afik og Rehob». Mange forskere mener at Ahlab, Helba i samme vers og Mahalab, som noen leser i Asjers grenseliste i Josva 19,29, er former av ett navn, Mahalliba i assyriske tekster; et eldre forslag, nevnt i International Standard Bible Encyclopedia, plasserte den ved Gush Halav i Øvre Galilea."
    - "Mahalliba forekommer i Sankeribs beretning om hans felttog i 701 f.Kr., blant byene til kongen av Sidon som underkastet seg ham, oppført mellom Sarepta og Ushu, Tyros' fastlandsby. Den lokaliseres vanligvis til Khirbet el-Mahalib på kysten av Sør-Libanon, omtrent 6 km nord for Tyros og rundt 2 km sør for munningen av Litani, der kartet plasserer den."
  tl:
    - "Ang Ahlab, “mabunga”, ay isa sa mga bayan sa baybayin na hindi kailanman nasakop ng lipi ni Aser: “Hindi pinalayas ng Aser ang mga taga Acho, ni ang mga taga Sidon, ni ang taga Ahlab, ni ang taga Achzib, ni ang taga Helba, ni ang taga Aphec, ni ang taga Rehob.” Maraming iskolar ang naniniwalang ang Ahlab, ang Helba sa parehong talata at ang Mahalab na binabasa ng ilan sa talaan ng hangganan ni Aser sa Josue 19:29 ay mga anyo ng iisang pangalan, ang Mahalliba ng mga tekstong Asirio; ang isang naunang mungkahi, na itinala sa International Standard Bible Encyclopedia, ay naglagay nito sa Gush Halav sa itaas na Galilea."
    - "Lumilitaw ang Mahalliba sa salaysay ni Sennacherib ng kaniyang kampanya noong 701 BK, sa mga bayan ng hari ng Sidon na sumuko sa kaniya, na nakalista sa pagitan ng Sarepta at Ushu, ang bayan ng Tiro sa katihan. Karaniwang inilalagay ito sa Khirbet el-Mahalib sa baybayin ng katimugang Libano, mga 6 km sa hilaga ng Tiro at mga 2 km sa timog ng bukana ng Litani, kung saan ito inilalagay ng mapa."
  da:
    - "Ahlab, »frugtbar«, var en af de kystbyer, som Aser stamme aldrig indtog: »Aser fordrev ikke Indbyggerne i Akko eller Indbyggerne i Zidon og Alab og Aksib og Helba og Afik og Rehob.« Mange forskere mener, at Ahlab, Helba i det samme vers og den Mahalab, som nogle læser i Asers grænseliste ved Josva 19,29, er former af ét navn, assyriske teksters Mahalliba; et ældre forslag, nævnt i International Standard Bible Encyclopedia, placerede det ved Gush Halav i Øvre Galilæa."
    - "Mahalliba optræder i Sankeribs beretning om hans felttog i 701 f.Kr., blandt de byer under Sidons konge, der underkastede sig ham, opregnet mellem Sarepta og Ushu, Tyrus' fastlandsby. Den placeres sædvanligvis ved Khirbet el-Mahalib på Sydlibanons kyst, omkring 6 km nord for Tyrus og ca. 2 km syd for Litanis munding, hvor kortet sætter den."
