# Overview article (ADR 0007). Ahlab = Mahalab (Josh 19:29) = Helbah = Mahalliba of Sennacherib at Khirbet el-Mahalib (the map's point) is the common view (EJ); Gush Halav (an older proposal in the ISBE) is noted.
