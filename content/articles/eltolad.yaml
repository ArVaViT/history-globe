body:
  en:
    - "Eltolad was a town in the Negeb, the dry south of Judah. It is named in the list of Judah's southernmost towns, between Azem and Chesil, and again in the inheritance of Simeon, whose towns lay inside Judah's, between Azem and Bethul; the Chronicler's copy of the Simeonite list shortens the name to Tolad. The name may mean “God causes to be born”, though its sense is uncertain. That is all the Bible tells of it."
    - "No site has been found. The map marks three possibilities: somewhere within 10 km of Beersheba, around which the Simeonite towns cluster; Khirbet Erqa Saqra to the south-east; and Tell el-Meleiha to the north-west. Surveys of the Negeb have found Iron Age remains at many such ruins, but none has yielded the name, and Eltolad appears in no ancient text outside the Bible. Its interest for historians is as one witness among many that the list of Simeon was once a real register of villages in the Beersheba basin."
    - "Today the whole district is the farmed and settled country around Beersheba, the largest city of Israel's Negev."
  ru:
    - "Елтолад — город в Негеве, сухом юге Иуды. Он назван в перечне самых южных городов Иуды, между Ацемом и Кесилом, и снова в уделе Симеона, чьи города лежали внутри Иудиных, между Ацемом и Вефулом; в списке Симеона у Паралипоменон имя сокращено до Фолада. Имя, возможно, значит «Бог даёт родиться», хотя смысл его неясен. Больше Библия о нём ничего не говорит."
    - "Место не найдено. На карте отмечены три возможности: где-то в 10 км от Вирсавии, вокруг которой теснятся города Симеона; Хирбет-Эрка-Сакру к юго-востоку; и Телль-эль-Мелейху к северо-западу. Разведки Негева нашли остатки железного века на многих таких развалинах, но ни одни не дали имени, а вне Библии Елтолад не встречается ни в одном древнем тексте. Для историков он интересен как одно из многих свидетельств, что список Симеона был когда-то настоящим реестром селений Беэр-Шевской котловины."
    - "Сегодня вся округа — обжитая земледельческая страна вокруг Беэр-Шевы, крупнейшего города израильского Негева."
  uk:
    - "Елтолад було містом у Негеві, сухому півдні Юди. Його названо в переліку найпівденніших міст Юди, між Ацемом і Кесілом, і знову в уділі Симеона, чиї міста лежали всередині Юдиних, між Ацемом і Бетулом; копія симеонітського переліку в Хроніках скорочує назву до Толад. Назва може означати «Бог породжує», хоча її значення непевне. Це все, що Біблія розповідає про нього."
    - "Місце не знайдено. Мапа позначає три можливості: десь у межах 10 км від Беер-Шеви, навколо якої групуються симеонітські міста; Хірбет-Ерка-Сакра на південному сході; і Телль-ель-Мелейха на північному заході. Обстеження Негеву знайшли рештки залізної доби на багатьох таких руїнах, але жодні не дали назви, і Елтолад не трапляється в жодному давньому тексті поза Біблією. Його значення для істориків у тому, що він — один зі свідків (серед багатьох) того, що список Симеона колись був справжнім реєстром сіл у басейні Беер-Шеви."
    - "Сьогодні весь округ — це оброблена й заселена країна навколо Беер-Шеви, найбільшого міста ізраїльського Негеву."
  es:
    - "Eltolad era una ciudad del Néguev, el árido sur de Judá. Se nombra en la lista de las ciudades más meridionales de Judá, entre Esem y Quesil, y de nuevo en la heredad de Simeón, cuyas ciudades estaban dentro de las de Judá, entre Esem y Betul; la copia del cronista de la lista simeonita acorta el nombre a Tolad. El nombre puede significar «Dios hace nacer», aunque su sentido es incierto. Eso es todo lo que la Biblia cuenta de ella."
    - "No se ha hallado ningún sitio. El mapa señala tres posibilidades: algún lugar a menos de 10 km de Beerseba, en torno a la cual se agrupan las ciudades de Simeón; Khirbet Erqa Saqra, al sudeste; y Tell el-Meleiha, al noroeste. Las prospecciones del Néguev han hallado restos de la Edad del Hierro en muchas ruinas así, pero ninguna ha dado el nombre, y Eltolad no aparece en ningún texto antiguo fuera de la Biblia. Su interés para los historiadores está en ser un testimonio más de que la lista de Simeón fue en otro tiempo un registro real de aldeas de la cuenca de Beerseba."
    - "Hoy todo el distrito es la tierra cultivada y poblada en torno a Beerseba, la mayor ciudad del Néguev de Israel."
  pt:
    - "Eltolade era uma cidade no Neguebe, o seco sul de Judá. É nomeada na lista das cidades mais meridionais de Judá, entre Azém e Quesil, e de novo na herança de Simeão, cujas cidades ficavam dentro das de Judá, entre Azém e Betul; a cópia do cronista da lista de Simeão abrevia o nome para Tolade. O nome pode significar “Deus faz nascer”, embora seu sentido seja incerto. Isso é tudo o que a Bíblia conta dela."
    - "Nenhum local foi encontrado. O mapa assinala três possibilidades: algum ponto a menos de 10 km de Berseba, em torno da qual se agrupam as cidades de Simeão; Khirbet Erqa Saqra, a sudeste; e Tell el-Meleiha, a noroeste. Levantamentos do Neguebe acharam vestígios da Idade do Ferro em muitas dessas ruínas, mas nenhuma rendeu o nome, e Eltolade não aparece em nenhum texto antigo fora da Bíblia. Seu interesse para os historiadores está em ser uma testemunha entre muitas de que a lista de Simeão foi outrora um registro real de aldeias na bacia de Berseba."
    - "Hoje todo o distrito é a região cultivada e povoada em torno de Berseba, a maior cidade do Neguebe de Israel."
  de:
    - "Eltolad war eine Stadt im Negev, dem trockenen Süden Judas. Sie wird in der Liste der südlichsten Städte Judas genannt, zwischen Ezem und Kesil, und wieder im Erbteil Simeons, dessen Städte innerhalb von Judas lagen, zwischen Ezem und Betul; die Abschrift der Simeonitenliste in der Chronik verkürzt den Namen zu Tolad. Der Name bedeutet vielleicht „Gott lässt geboren werden“, doch ist sein Sinn unsicher. Das ist alles, was die Bibel von ihr erzählt."
    - "Kein Ort ist gefunden worden. Die Karte markiert drei Möglichkeiten: irgendwo innerhalb von 10 km von Beerscheba, um das sich die Städte Simeons gruppieren; Khirbet Erqa Saqra im Südosten; und Tell el-Meleiha im Nordwesten. Untersuchungen im Negev haben an vielen solcher Ruinen eisenzeitliche Reste gefunden, doch keine hat den Namen geliefert, und Eltolad erscheint in keinem antiken Text außerhalb der Bibel. Sein Interesse für Historiker liegt darin, dass es ein Zeuge unter vielen dafür ist, dass die Liste Simeons einst ein wirkliches Register von Dörfern im Becken von Beerscheba war."
    - "Heute ist der ganze Bezirk das bewirtschaftete und besiedelte Land um Beerscheba, die größte Stadt des israelischen Negev."
  fr:
    - "Eltholad était une ville du Négev, le sud aride de Juda. Elle est nommée dans la liste des villes les plus méridionales de Juda, entre Atsem et Késil, et de nouveau dans l’héritage de Siméon, dont les villes se trouvaient à l’intérieur de celles de Juda, entre Atsem et Bethul ; la copie du Chroniqueur de la liste de Siméon abrège le nom en Tholad. Le nom peut signifier « Dieu fait naître », mais son sens est incertain. C’est tout ce que la Bible en dit."
    - "Aucun site n’a été trouvé. La carte en marque trois possibles : quelque part à moins de 10 km de Beer-Schéba, autour de laquelle se groupent les villes de Siméon ; Khirbet Erqa Saqra au sud-est ; et Tell el-Meleiha au nord-ouest. Les prospections du Négev ont trouvé des vestiges de l’âge du Fer dans bien des ruines de ce genre, mais aucune n’a livré le nom, et Eltholad n’apparaît dans aucun texte ancien hors de la Bible. Son intérêt pour les historiens est d’être un témoin parmi d’autres que la liste de Siméon fut jadis un vrai registre de villages du bassin de Beer-Schéba."
    - "Aujourd’hui, tout le district est la campagne cultivée et habitée autour de Beer-Schéba, la plus grande ville du Négev israélien."
  it:
    - "Eltolad era una città del Negheb, il sud arido di Giuda. È nominata nell’elenco delle città più meridionali di Giuda, fra Esem e Chesil, e di nuovo nell’eredità di Simeone, le cui città stavano dentro quelle di Giuda, fra Esem e Betul; la copia del Cronista dell’elenco simeonita abbrevia il nome in Tolad. Il nome può significare «Dio fa nascere», benché il suo senso sia incerto. È tutto ciò che la Bibbia ne dice."
    - "Non è stato trovato alcun sito. La mappa segna tre possibilità: da qualche parte entro 10 km da Bersabea, attorno alla quale si raggruppano le città simeonite; Khirbet Erqa Saqra a sud-est; e Tell el-Meleiha a nord-ovest. Le ricognizioni del Negheb hanno trovato resti dell’età del Ferro in molte di queste rovine, ma nessuna ha restituito il nome, ed Eltolad non compare in alcun testo antico fuori della Bibbia. Il suo interesse per gli storici è di essere un testimone fra molti del fatto che l’elenco di Simeone fu un tempo un vero registro di villaggi del bacino di Bersabea."
    - "Oggi l’intero distretto è la campagna coltivata e abitata attorno a Bersabea, la più grande città del Negev israeliano."
  pl:
    - "Eltolad było miastem w Negewie, suchym południu Judy. Jest wymienione w wykazie najdalej na południe położonych miast Judy, między Esem a Kesil, i znów w dziedzictwie Symeona, którego miasta leżały w obrębie miast Judy, między Esem a Betul; kopia wykazu symeonickiego u Kronikarza skraca nazwę do Tolad. Nazwa może znaczyć „Bóg sprawia narodziny”, choć jej sens jest niepewny. To wszystko, co Biblia o nim mówi."
    - "Nie znaleziono miejsca. Mapa zaznacza trzy możliwości: gdzieś w promieniu 10 km od Beer-Szeby, wokół której skupiają się miasta Symeona; Chirbet Erka Sakra na południowym wschodzie; i Tell el-Melejcha na północnym zachodzie. Badania Negewu odnalazły pozostałości z epoki żelaza w wielu takich ruinach, ale żadna nie dała nazwy, a Eltolad nie występuje w żadnym starożytnym tekście poza Biblią. Jego znaczenie dla historyków polega na tym, że jest jednym z wielu świadectw, iż wykaz Symeona był niegdyś prawdziwym rejestrem wsi w basenie Beer-Szeby."
    - "Dziś cały okręg jest uprawnym i zamieszkanym krajem wokół Beer-Szeby, największego miasta izraelskiego Negewu."
  nl:
    - "Eltolad was een stad in de Negev, het droge zuiden van Juda. Zij wordt genoemd in de lijst van Juda's zuidelijkste steden, tussen Ezem en Kesil, en opnieuw in het erfdeel van Simeon, wiens steden binnen die van Juda lagen, tussen Ezem en Betul; het afschrift van de Simeonitische lijst in Kronieken verkort de naam tot Tolad. De naam betekent misschien “God doet geboren worden”, al is de zin onzeker. Dat is alles wat de Bijbel erover vertelt."
    - "Er is geen plaats gevonden. De kaart markeert drie mogelijkheden: ergens binnen 10 km van Berseba, waaromheen de Simeonitische steden zich groeperen; Khirbet Erqa Saqra in het zuidoosten; en Tell el-Meleiha in het noordwesten. Onderzoek in de Negev vond IJzertijdresten bij veel van zulke ruïnes, maar geen leverde de naam op, en Eltolad komt in geen antieke tekst buiten de Bijbel voor. Haar belang voor historici is als een getuige onder velen dat de lijst van Simeon ooit een echt register van dorpen in het bekken van Berseba was."
    - "Tegenwoordig is het hele district het bewerkte en bewoonde land rond Berseba, de grootste stad van Israëls Negev."
  cs:
    - "Eltolad bylo město v Negevu, suchém jihu Judska. Je jmenováno v seznamu nejjižnějších měst Judy, mezi Ecemem a Kesílem, a znovu v dědictví Simeonově, jehož města ležela uvnitř judských, mezi Ecemem a Betúlem; opis simeonského seznamu v Letopisech zkracuje jméno na Tolad. Jméno může znamenat „Bůh dává zrodit“, ač jeho smysl je nejistý. To je vše, co o něm Bible vypráví."
    - "Nebylo nalezeno žádné místo. Mapa označuje tři možnosti: někde do 10 km od Beer-šeby, kolem níž se simeonská města shlukují; Khirbet Erqa Saqra na jihovýchodě; a Tell el-Meleiha na severozápadě. Průzkumy Negevu nalezly zbytky z doby železné na mnoha takových zříceninách, ale žádná nevydala jméno a Eltolad se nevyskytuje v žádném starověkém textu mimo Bibli. Jeho zajímavost pro historiky spočívá v tom, že je jedním ze svědků mezi mnoha, že seznam Simeonův byl kdysi skutečným soupisem vesnic v povodí Beer-šeby."
    - "Dnes je celý okres obdělávanou a osídlenou krajinou kolem Beer-šeby, největšího města izraelského Negevu."
  sv:
    - "Eltolad var en stad i Negev, Judas torra söder. Den nämns i förteckningen över Judas sydligaste städer, mellan Esem och Kesil, och åter i Simeons arvedel, vars städer låg inom Judas, mellan Esem och Betul; Krönikebokens kopia av Simeons förteckning förkortar namnet till Tolad. Namnet kan betyda ”Gud låter födas”, fastän dess betydelse är osäker. Det är allt Bibeln berättar om den."
    - "Ingen plats har hittats. Kartan markerar tre möjligheter: någonstans inom 10 km från Beer Sheva, kring vilken Simeons städer samlas; Khirbet Erqa Saqra åt sydost; och Tell el-Meleiha åt nordväst. Inventeringar av Negev har funnit järnåldersrester vid många sådana ruiner, men ingen har gett namnet, och Eltolad förekommer i ingen antik text utanför Bibeln. Dess intresse för historiker är som ett vittne bland många om att Simeons förteckning en gång var ett verkligt register över byar i Beer Sheva-bäckenet."
    - "I dag är hela distriktet det odlade och bebodda landet kring Beer Sheva, den största staden i Israels Negev."
