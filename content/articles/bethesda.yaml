body:
  en:
    - "Bethesda was a pool in the north-east of Jerusalem, near the Sheep Gate, outside the Temple's northern side. It is identified with the twin pools beside the church of St Anne, just inside the Lions' Gate of the Old City; Conrad Schick took a large tank there for the pool in 1888, and later digging showed two big rock-cut basins divided by a rock partition. The manuscripts spell the name differently: Bethesda in most later copies and in the KJV, Bethzatha in Codex Sinaiticus, Bethsaida in Codex Vaticanus and the papyrus P75. The Copper Scroll from Qumran (3Q15) names a place Beth Eshdatayin with a pool, and J. T. Milik, who first published the scroll, took its dual ending to mean a double pool."
    - "John says: “Now there is at Jerusalem by the sheep market a pool, which is called in the Hebrew tongue Bethesda, having five porches.” Many sick lay in the porches, “waiting for the moving of the water”; the next verse, about an angel troubling the water, is missing from the oldest manuscripts. There Jesus found a man “which had an infirmity thirty and eight years” and said to him: “Rise, take up thy bed, and walk.” Because it was the sabbath, the healing led to an open dispute with the Jewish leaders. Four porticoes round the two pools and a fifth on the partition between them are the usual explanation of the “five porches”."
    - "East of the pools small baths cut in natural caves were in use by the first century BC, and in the Roman city of Aelia Capitolina they became a healing sanctuary, usually linked to Asclepius and Serapis. In the fifth century a Byzantine church, known as the church of the Probatica, was built over the site; the Persians destroyed it in 614, and the Crusaders later put up a small chapel in its ruins beside their church of St Anne. In 1856 the Ottoman sultan gave the property to France, and the White Fathers keep it. Shimon Gibson has argued that the pools served from the start as a ritual bath for purification before entering the Temple. The ruins can be visited inside the St Anne compound in the Muslim Quarter of the Old City."
  ru:
    - "Вифезда — купальня на северо-востоке Иерусалима, у Овечьих ворот, к северу от Храма. Её отождествляют с двойным водоёмом у церкви святой Анны, сразу за Львиными воротами Старого города; Конрад Шик в 1888 г. принял за купальню большой резервуар на этом месте, а дальнейшие раскопки открыли два больших высеченных в скале бассейна, разделённых скальной перемычкой. Рукописи пишут имя по-разному: Вифезда в большинстве поздних списков и в KJV, Вифзафа в Синайском кодексе, Вифсаида в Ватиканском кодексе и папирусе P75. Медный свиток из Кумрана (3Q15) называет место Бет-Эшдатаин с водоёмом, и Ю. Т. Милик, первым издавший свиток, понял окончание двойственного числа как указание на двойной водоём."
    - "Иоанн пишет: «Есть же в Иерусалиме у Овечьих ворот купальня, называемая по-еврейски Вифезда, при которой было пять крытых ходов». В них лежало множество больных, «ожидающих движения воды»; следующего стиха, об Ангеле, возмущавшем воду, нет в древнейших рукописях. Там был человек, «находившийся в болезни тридцать восемь лет», и Иисус сказал ему: «встань, возьми постель твою и ходи». Исцеление совершилось в субботу и повело к открытому спору с иудейскими начальниками. «Пять крытых ходов» обычно объясняют четырьмя портиками вокруг двух бассейнов и пятым на перемычке между ними."
    - "К востоку от бассейнов уже в I в. до н. э. действовали небольшие купальни в природных пещерах, а в римском городе Элия Капитолина они стали святилищем исцелений, которое обычно связывают с Асклепием и Сераписом. В V в. над этим местом построили византийскую церковь, известную как церковь Пробатики; персы разрушили её в 614 г., а крестоносцы позже поставили в её развалинах небольшую часовню рядом со своей церковью святой Анны. В 1856 г. османский султан передал участок Франции, и им ведают Белые отцы. Шимон Гибсон доказывает, что бассейны с самого начала служили ритуальной купальней для очищения перед входом в Храм. Развалины открыты для посещения на территории церкви святой Анны в Мусульманском квартале Старого города."
  uk:
    - "Віфезда була купіллю на північному сході Єрусалима, поблизу Овечих воріт, поза північним боком Храму. Її ототожнюють зі здвоєними басейнами біля церкви св. Анни, одразу всередині Левових воріт Старого міста; Конрад Шик 1888 р. визнав за купіль великий резервуар там, а пізніші розкопки показали два великі видовбані в скелі басейни, розділені скельною перегородкою. Рукописи по-різному пишуть назву: Віфезда в більшості пізніх копій і в KJV, Бетзата в Синайському кодексі, Віфсаїда у Ватиканському кодексі та в папірусі P75. Мідний сувій із Кумрана (3Q15) називає місце Бет-Ешдатаїн із басейном, а Й. Т. Мілік, який перший опублікував сувій, вважав, що його подвійне закінчення означає здвоєний басейн."
    - "Іван пише: «У Єрусалимі ж коло Овечих воріт є купіль, що зветь ся по єврейськи Ветезда, з пятьма ходниками». У ходниках лежало багато недужих, що «дожидали движення води»; наступний вірш, про ангела, який збивав воду, відсутній у найдавніших рукописах. Там Ісус побачив чоловіка, що «трийцять і вісїм років був у недузї», і сказав йому: «Устань, візьми постїль твою, та й ходи!» Оскільки була субота, зцілення призвело до відкритої суперечки з юдейськими проводирями. Чотири портики навколо двох басейнів і п'ятий на перегородці між ними — звичайне пояснення п'яти ходників."
    - "На схід від басейнів невеликі купальні, висічені в природних печерах, вживалися вже в I ст. до н. е., а в римському місті Елія Капітоліна вони стали цілющим святилищем, яке зазвичай пов'язують з Асклепієм і Серапісом. У V ст. над місцем збудували візантійську церкву, відому як церква Пробатика; перси зруйнували її 614 р., а хрестоносці згодом поставили в її руїнах невелику каплицю поряд зі своєю церквою св. Анни. 1856 р. османський султан передав ділянку Франції, і нею володіють Білі отці. Шимон Гібсон доводив, що басейни від самого початку правили за ритуальну купіль для очищення перед входом до Храму. Руїни можна відвідати всередині комплексу св. Анни в Мусульманському кварталі Старого міста."
  es:
    - "Betesda era un estanque en el noreste de Jerusalén, cerca de la Puerta de las Ovejas, fuera del lado norte del Templo. Se identifica con las piscinas gemelas junto a la iglesia de Santa Ana, justo dentro de la Puerta de los Leones de la Ciudad Vieja; Conrad Schick tomó en 1888 un gran depósito de allí por el estanque, y excavaciones posteriores mostraron dos grandes cuencas excavadas en la roca, separadas por un tabique rocoso. Los manuscritos escriben el nombre de modos distintos: Betesda en la mayoría de las copias tardías y en la KJV, Betzatá en el Códice Sinaítico, Betsaida en el Códice Vaticano y en el papiro P75. El Rollo de Cobre de Qumrán (3Q15) nombra un lugar Bet Eshdatayin con un estanque, y J. T. Milik, su primer editor, entendió que la terminación dual significaba un estanque doble."
    - "Juan dice: «Y hay en Jerusalem á la puerta del ganado un estanque, que en hebraico es llamado Bethesda, el cual tiene cinco portales». Muchos enfermos yacían en los pórticos, «esperando el movimiento del agua»; el versículo siguiente, sobre un ángel que agitaba el agua, falta en los manuscritos más antiguos. Allí Jesús halló a un hombre «que había treinta y ocho años que estaba enfermo» y le dijo: «Levántate, toma tu lecho, y anda». Como era sábado, la curación desembocó en una disputa abierta con los dirigentes judíos. Cuatro pórticos alrededor de las dos piscinas y un quinto sobre el tabique entre ellas son la explicación habitual de los «cinco portales»."
    - "Al este de las piscinas, pequeños baños excavados en cuevas naturales estaban en uso en el siglo I a. C., y en la ciudad romana de Aelia Capitolina se convirtieron en un santuario de curación, vinculado por lo general a Asclepio y Serapis. En el siglo V se levantó sobre el lugar una iglesia bizantina, conocida como iglesia de la Probática; los persas la destruyeron en 614, y los cruzados alzaron después una pequeña capilla entre sus ruinas, junto a su iglesia de Santa Ana. En 1856 el sultán otomano cedió la propiedad a Francia, y la custodian los Padres Blancos. Shimon Gibson ha sostenido que las piscinas sirvieron desde el principio como baño ritual de purificación antes de entrar en el Templo. Las ruinas pueden visitarse dentro del recinto de Santa Ana, en el Barrio Musulmán de la Ciudad Vieja."
  pt:
    - "Betesda era um tanque no nordeste de Jerusalém, perto da Porta das Ovelhas, fora do lado norte do Templo. É identificada com os tanques gêmeos ao lado da igreja de Santa Ana, logo dentro da Porta dos Leões da Cidade Velha; Conrad Schick tomou em 1888 um grande reservatório ali como o tanque, e escavações posteriores revelaram duas grandes bacias escavadas na rocha, separadas por uma divisória de pedra. Os manuscritos grafam o nome de maneiras diferentes: Betesda na maioria das cópias tardias e na KJV, Betzata no Códice Sinaítico, Betsaida no Códice Vaticano e no papiro P75. O Rolo de Cobre de Qumran (3Q15) menciona um lugar chamado Bet Eshdatayin com um tanque, e J. T. Milik, que primeiro publicou o rolo, entendeu que a terminação dual indicava um tanque duplo."
    - "João diz: “Ora, em Jerusalém, próximo à porta das ovelhas, há um tanque, chamado em hebraico Betesda, o qual tem cinco pórticos.” Muitos doentes jaziam nos pórticos, “esperando o movimento da água”; o versículo seguinte, sobre um anjo que agitava a água, falta nos manuscritos mais antigos. Ali Jesus encontrou um homem “enfermo havia trinta e oito anos” e lhe disse: “Levante-se, pegue a sua maca e ande.” Como era sábado, a cura levou a uma disputa aberta com os líderes judeus. Quatro pórticos em volta dos dois tanques e um quinto na divisória entre eles são a explicação habitual dos “cinco pórticos”."
    - "A leste dos tanques, pequenos banhos escavados em cavernas naturais estavam em uso no século I a.C., e na cidade romana de Aelia Capitolina tornaram-se um santuário de cura, em geral ligado a Asclépio e Serápis. No século V uma igreja bizantina, conhecida como igreja da Probática, foi construída sobre o local; os persas a destruíram em 614, e os cruzados ergueram depois uma pequena capela em suas ruínas, ao lado de sua igreja de Santa Ana. Em 1856 o sultão otomano deu a propriedade à França, e os Padres Brancos a conservam. Shimon Gibson argumentou que os tanques serviram desde o início como banho ritual de purificação antes da entrada no Templo. As ruínas podem ser visitadas no recinto de Santa Ana, no Bairro Muçulmano da Cidade Velha."
  de:
    - "Betesda war ein Teich im Nordosten Jerusalems, nahe dem Schaftor, außerhalb der Nordseite des Tempels. Er wird mit den Zwillingsteichen neben der Kirche der heiligen Anna gleichgesetzt, unmittelbar innerhalb des Löwentors der Altstadt; Conrad Schick hielt 1888 ein großes Becken dort für den Teich, und spätere Grabungen zeigten zwei große, in den Fels gehauene Becken, durch eine Felswand getrennt. Die Handschriften schreiben den Namen unterschiedlich: Bethesda in den meisten späteren Abschriften und in der King-James-Bibel, Bethzatha im Codex Sinaiticus, Bethsaida im Codex Vaticanus und im Papyrus P75. Die Kupferrolle aus Qumran (3Q15) nennt einen Ort Beth Eschdatajin mit einem Teich, und J. T. Milik, der die Rolle zuerst veröffentlichte, verstand ihre Dualendung als Doppelteich."
    - "Johannes sagt: „Es ist aber zu Jerusalem bei dem Schaftor ein Teich, der heißt auf hebräisch Bethesda und hat fünf Hallen“. Viele Kranke lagen in den Hallen, „die warteten, wann sich das Wasser bewegte“; der nächste Vers, über einen Engel, der das Wasser bewegte, fehlt in den ältesten Handschriften. Dort fand Jesus einen Menschen, der „achtunddreißig Jahre lang krank gelegen“ war, und sprach zu ihm: „Stehe auf, nimm dein Bett und gehe hin!“ Weil es Sabbat war, führte die Heilung zu einem offenen Streit mit den jüdischen Führern. Vier Säulenhallen rings um die beiden Teiche und eine fünfte auf der Wand zwischen ihnen sind die übliche Erklärung für die „fünf Hallen“."
    - "Östlich der Teiche waren kleine, in natürliche Höhlen gehauene Bäder im ersten Jahrhundert v. Chr. in Gebrauch, und in der römischen Stadt Aelia Capitolina wurden sie zu einem Heilheiligtum, gewöhnlich mit Asklepios und Serapis verbunden. Im fünften Jahrhundert wurde über der Stätte eine byzantinische Kirche errichtet, als Probatica-Kirche bekannt; die Perser zerstörten sie 614, und die Kreuzfahrer bauten später in ihren Ruinen neben ihrer Annenkirche eine kleine Kapelle. 1856 schenkte der osmanische Sultan das Gelände Frankreich, und die Weißen Väter verwalten es. Shimon Gibson hat vertreten, dass die Teiche von Anfang an als rituelles Bad zur Reinigung vor dem Betreten des Tempels dienten. Die Ruinen sind im Annenkomplex im Muslimischen Viertel der Altstadt zu besichtigen."
  fr:
    - "Béthesda était une piscine du nord-est de Jérusalem, près de la porte des Brebis, à l’extérieur du côté nord du Temple. On l’identifie avec les bassins jumeaux situés à côté de l’église Sainte-Anne, juste à l’intérieur de la porte des Lions de la vieille ville ; Conrad Schick y reconnut en 1888 un grand réservoir pour la piscine, et des fouilles ultérieures montrèrent deux grands bassins taillés dans le roc et séparés par une cloison de roche. Les manuscrits écrivent le nom différemment : Béthesda dans la plupart des copies tardives et dans la KJV, Bethzatha dans le Codex Sinaïticus, Bethsaïda dans le Codex Vaticanus et le papyrus P75. Le Rouleau de cuivre de Qumrân (3Q15) nomme un lieu Beth Eshdatayin avec un bassin, et J. T. Milik, qui publia le rouleau le premier, vit dans sa terminaison duelle l’indice d’une piscine double."
    - "Jean dit : « Or, à Jérusalem, près de la porte des brebis, il y a une piscine qui s’appelle en hébreu Béthesda, et qui a cinq portiques. » De nombreux malades gisaient sous les portiques, « qui attendaient le mouvement de l’eau » ; le verset suivant, sur un ange qui agitait l’eau, manque aux plus anciens manuscrits. Là Jésus trouva un homme « malade depuis trente-huit ans » et lui dit : « Lève-toi, prends ton lit, et marche. » Comme c’était le sabbat, la guérison provoqua une dispute ouverte avec les chefs juifs. Quatre portiques autour des deux bassins et un cinquième sur la cloison qui les sépare sont l’explication habituelle des « cinq portiques »."
    - "À l’est des bassins, de petits bains taillés dans des grottes naturelles étaient en usage dès le Ier siècle av. J.-C., et dans la ville romaine d’Aelia Capitolina ils devinrent un sanctuaire de guérison, d’ordinaire lié à Asclépios et à Sérapis. Au Ve siècle, une église byzantine, dite de la Probatique, fut bâtie sur le site ; les Perses la détruisirent en 614, et les croisés élevèrent plus tard une petite chapelle dans ses ruines, à côté de leur église Sainte-Anne. En 1856, le sultan ottoman donna la propriété à la France, et les Pères blancs la gardent. Shimon Gibson a soutenu que les bassins servirent dès l’origine de bain rituel de purification avant l’entrée au Temple. Les ruines se visitent dans l’enclos de Sainte-Anne, dans le quartier musulman de la vieille ville."
  it:
    - "Betesda era una vasca nel nord-est di Gerusalemme, presso la porta delle Pecore, fuori dal lato settentrionale del Tempio. È identificata con le vasche gemelle accanto alla chiesa di Sant’Anna, appena dentro la Porta dei Leoni della città vecchia; Conrad Schick nel 1888 prese per la vasca una grande cisterna lì, e scavi successivi mostrarono due grandi bacini scavati nella roccia divisi da un tramezzo roccioso. I manoscritti scrivono il nome in modo diverso: Betesda nella maggior parte delle copie tarde e nella King James Version, Betzatà nel Codice Sinaitico, Betsaida nel Codice Vaticano e nel papiro P75. Il Rotolo di rame di Qumran (3Q15) nomina un luogo Beth Eshdatayin con una vasca, e J. T. Milik, che per primo pubblicò il rotolo, intese la sua desinenza duale come indicazione di una vasca doppia."
    - "Giovanni dice: «Or a Gerusalemme, presso la porta delle Pecore, v’è una vasca, chiamata in ebraico Betesda, che ha cinque portici». Molti malati giacevano sotto i portici, «i quali aspettavano l’agitarsi dell’acqua»; il versetto seguente, su un angelo che agita l’acqua, manca nei manoscritti più antichi. Là Gesù trovò un uomo «che da trentott’anni era infermo» e gli disse: «Lèvati, prendi il tuo lettuccio, e cammina». Poiché era sabato, la guarigione portò a una disputa aperta con i capi dei Giudei. Quattro portici attorno alle due vasche e un quinto sul tramezzo fra di esse sono la spiegazione consueta dei «cinque portici»."
    - "A est delle vasche piccoli bagni scavati in grotte naturali erano in uso già nel I secolo a.C., e nella città romana di Aelia Capitolina divennero un santuario di guarigione, di solito collegato ad Asclepio e Serapide. Nel V secolo fu costruita sul sito una chiesa bizantina, nota come chiesa della Probatica; i Persiani la distrussero nel 614, e i Crociati più tardi eressero tra le sue rovine una piccola cappella accanto alla loro chiesa di Sant’Anna. Nel 1856 il sultano ottomano donò la proprietà alla Francia, e i Padri Bianchi la custodiscono. Shimon Gibson ha sostenuto che le vasche servissero fin dall’inizio come bagno rituale di purificazione prima di entrare nel Tempio. Le rovine si possono visitare all’interno del complesso di Sant’Anna, nel Quartiere musulmano della città vecchia."
  nl:
    - "Bethesda was een badwater in het noordoosten van Jeruzalem, bij de Schaapspoort, buiten de noordzijde van de Tempel. Het wordt vereenzelvigd met de dubbele poelen naast de kerk van Sint-Anna, net binnen de Leeuwenpoort van de oude stad; Conrad Schick hield er in 1888 een grote tank voor de poel, en later graafwerk toonde twee grote in de rots uitgehouwen bekkens, gescheiden door een rotswand. De handschriften spellen de naam verschillend: Bethesda in de meeste latere afschriften en in de KJV, Bethzatha in de Codex Sinaiticus, Bethsaïda in de Codex Vaticanus en papyrus P75. De Koperen Rol uit Qumran (3Q15) noemt een plaats Beth Eshdatayin met een poel, en J. T. Milik, die de rol als eerste publiceerde, vatte de dualisvorm op als een dubbele poel."
    - "Johannes zegt: “er is te Jeruzalem aan de Schaaps poort, een badwater, hetwelk in het Hebreeuws toegenaamd wordt Bethesda, hebbende vijf zalen.” Veel zieken lagen in de zalen, “wachtende op de roering des waters”; het volgende vers, over een engel die het water beroerde, ontbreekt in de oudste handschriften. Daar vond Jezus een man “die acht en dertig jaren krank gelegen had” en zei tot hem: “Sta op, neem uw beddeken op, en wandel.” Omdat het sabbat was, leidde de genezing tot een openlijk geschil met de Joodse leiders. Vier zuilengalerijen rond de twee poelen en een vijfde op de scheidingswand ertussen zijn de gebruikelijke verklaring van de “vijf zalen”."
    - "Ten oosten van de poelen werden kleine baden in natuurlijke grotten al in de eerste eeuw v.Chr. gebruikt, en in het Romeinse Aelia Capitolina werden ze een genezingsheiligdom, gewoonlijk met Asklepios en Serapis verbonden. In de vijfde eeuw werd boven de plaats een Byzantijnse kerk gebouwd, bekend als de kerk van de Probatica; de Perzen verwoestten haar in 614, en de kruisvaarders bouwden later een kleine kapel in de ruïne naast hun kerk van Sint-Anna. In 1856 schonk de Ottomaanse sultan het terrein aan Frankrijk, en de Witte Paters beheren het. Shimon Gibson heeft betoogd dat de poelen van meet af aan dienden als ritueel bad voor de reiniging vóór het betreden van de Tempel. De ruïnes zijn te bezoeken binnen het Sint-Anna-complex in het Moslimkwartier van de oude stad."
  pl:
    - "Betesda była sadzawką w północno-wschodniej części Jerozolimy, w pobliżu Bramy Owczej, na zewnątrz północnej strony Świątyni. Utożsamia się ją z bliźniaczymi sadzawkami obok kościoła św. Anny, tuż za Bramą Lwów w Starym Mieście; Conrad Schick uznał w 1888 roku wielki zbiornik w tym miejscu za sadzawkę, a późniejsze wykopaliska odsłoniły dwa duże baseny wykute w skale, rozdzielone skalną przegrodą. Rękopisy zapisują nazwę różnie: Betesda w większości późniejszych odpisów i w Biblii Króla Jakuba, Betzata w Kodeksie Synajskim, Betsaida w Kodeksie Watykańskim i papirusie P75. Zwój Miedziany z Qumran (3Q15) wymienia miejsce Bet Eszdatajin z sadzawką, a J. T. Milik, który pierwszy opublikował zwój, uznał jego końcówkę liczby podwójnej za wskazującą na sadzawkę podwójną."
    - "Jan pisze: „A była w Jeruzalemie przy owczej bramie sadzawka, którą zowią po żydowsku Betesda, mająca pięć ganków”. W gankach leżało wielu chorych, „którzy czekali poruszenia wody”; następny werset, o aniele wzruszającym wodę, nie występuje w najstarszych rękopisach. Jezus znalazł tam człowieka, który był „trzydzieści i ośm lat chorobą złożony”, i rzekł do niego: „Wstań, weźmij łoże twoje, a chodź”. Ponieważ był szabat, uzdrowienie doprowadziło do otwartego sporu z przywódcami żydowskimi. Cztery portyki wokół dwóch sadzawek i piąty na przegrodzie między nimi to zwykłe wyjaśnienie „pięciu ganków”."
    - "Na wschód od sadzawek małe łaźnie wykute w naturalnych jaskiniach były w użyciu w I w. p.n.e., a w rzymskim mieście Aelia Capitolina stały się sanktuarium uzdrowicielskim, zwykle wiązanym z Asklepiosem i Serapisem. W V wieku wzniesiono nad tym miejscem bizantyjski kościół, znany jako kościół Probatyki; Persowie zburzyli go w 614 roku, a krzyżowcy postawili później w jego ruinach małą kaplicę obok swego kościoła św. Anny. W 1856 roku sułtan osmański oddał ten teren Francji, a utrzymują go Ojcowie Biali. Szimon Gibson twierdził, że sadzawki od początku służyły jako łaźnia rytualna do oczyszczenia przed wejściem do Świątyni. Ruiny można zwiedzać na terenie kompleksu św. Anny w Dzielnicy Muzułmańskiej Starego Miasta."
  cs:
    - "Bethesda byl rybník v severovýchodní části Jeruzaléma, u Ovčí brány, mimo severní stranu chrámu. Ztotožňuje se s dvojicí rybníků u kostela svaté Anny, těsně uvnitř Lví brány starého města; Conrad Schick pokládal roku 1888 za rybník tam odkrytou velkou nádrž a pozdější vykopávky ukázaly dvě velké ve skále vytesané nádrže rozdělené skalní přepážkou. Rukopisy píší jméno různě: Bethesda ve většině pozdějších opisů a v KJV, Bethzatha v Kodexu sinajském, Betsaida v Kodexu vatikánském a v papyru P75. Měděný svitek z Kumránu (3Q15) jmenuje místo Bét Ešdatajin s rybníkem a J. T. Milik, který svitek poprvé vydal, vyložil jeho dvojné zakončení jako dvojitý rybník."
    - "Jan říká: „Byl pak v Jeruzalémě u brány bravné rybník, kterýž slove Židovsky Bethesda, patero přístřeší maje.“ V přístřešcích leželo mnoho nemocných, „očekávajících hnutí vody“; další verš, o andělu rozbouřujícím vodu, v nejstarších rukopisech chybí. Tam Ježíš našel člověka, „kterýž osm a třidceti let nemocen byl“, a řekl mu: „Vstaň, vezmi lože své a choď.“ Protože byla sobota, vedlo uzdravení k otevřenému sporu s židovskými vůdci. Čtyři sloupořadí kolem obou rybníků a páté na přepážce mezi nimi jsou obvyklým vysvětlením „patera přístřeší“."
    - "Východně od rybníků byly v prvním století př. n. l. v užívání malé lázně vytesané v přírodních jeskyních a v římském městě Aelia Capitolina se z nich stala léčebná svatyně, obvykle spojovaná s Asklépiem a Serapidou. V pátém století byl nad místem vystavěn byzantský kostel, známý jako kostel Probatiky; Peršané jej roku 614 zničili a křižáci později vztyčili v jeho troskách malou kapli vedle svého kostela svaté Anny. Roku 1856 daroval osmanský sultán pozemek Francii a spravují jej Bílí otcové. Shimon Gibson tvrdil, že rybníky sloužily od počátku jako rituální lázeň k očišťování před vstupem do chrámu. Zříceniny lze navštívit v areálu svaté Anny v Muslimské čtvrti starého města."
  sv:
    - "Betesda var en damm i nordöstra Jerusalem, nära Fårporten, utanför tempelområdets norra sida. Den identifieras med de tvillingdammar som ligger intill Sankt Annas kyrka, strax innanför Lejonporten i Gamla staden; Conrad Schick tog 1888 en stor cistern där för dammen, och senare grävningar visade två stora klipputhuggna bassänger åtskilda av en bergvägg. Handskrifterna stavar namnet olika: Betesda i de flesta senare avskrifter och i King James-bibeln, Betzata i Codex Sinaiticus, Betsaida i Codex Vaticanus och papyrusen P75. Kopparrullen från Qumran (3Q15) nämner en plats Bet Eshdatajin med en damm, och J. T. Milik, som först publicerade rullen, tolkade dess dualändelse som en dubbeldamm."
    - "Johannes säger: ”Vid Fårporten i Jerusalem ligger en damm, på hebreiska kallad Betesda, och invid den finnas fem pelargångar.” Många sjuka låg i pelargångarna och väntade på att vattnet skulle röra sig; nästa vers, om en ängel som rör upp vattnet, saknas i de äldsta handskrifterna. Där fann Jesus en man som ”hade varit sjuk i trettioåtta år” och sade till honom: ”Stå upp, tag din säng och gå.” Eftersom det var sabbat ledde helandet till en öppen tvist med de judiska ledarna. Fyra pelargångar runt de två dammarna och en femte på bergväggen mellan dem är den vanliga förklaringen till de ”fem pelargångarna”."
    - "Öster om dammarna användes små bad i naturliga grottor redan under första århundradet f.Kr., och i den romerska staden Aelia Capitolina blev de en helgedom för helande, vanligen knuten till Asklepios och Serapis. På 400-talet byggdes en bysantinsk kyrka, känd som Probatikakyrkan, över platsen; perserna förstörde den 614, och korsfararna reste senare ett litet kapell i dess ruiner intill sin Sankt Annas kyrka. År 1856 gav den osmanske sultanen egendomen åt Frankrike, och Vita fäderna förvaltar den. Shimon Gibson har hävdat att dammarna från början tjänade som ritualbad för rening före inträdet i templet. Ruinerna kan besökas inom Sankt Annas område i muslimska kvarteret i Gamla staden."
  nb:
    - "Betesda var en dam i nordøst i Jerusalem, nær Saueporten, utenfor tempelets nordside. Den identifiseres med tvillingdammene ved St. Anne-kirken, like innenfor Løveporten i den gamle byen; Conrad Schick tok en stor sisterne der for dammen i 1888, og senere gravearbeid viste to store fjellhugde bassenger delt av en fjellskillevegg. Håndskriftene staver navnet ulikt: Betesda i de fleste senere avskrifter og i King James-oversettelsen, Betzata i Codex Sinaiticus, Betsaida i Codex Vaticanus og papyrusen P75. Kobberrullen fra Qumran (3Q15) nevner et sted Beth Eshdatayin med en dam, og J. T. Milik, som først utgav rullen, mente at dens dualisendelse betyr en dobbel dam."
    - "Johannes sier: «Men det er ved Fåreporten i Jerusalem en dam som på hebraisk heter Betesda og har fem bueganger». Mange syke lå i buegangene og ventet på at vannet skulle røre seg; det neste verset, om en engel som oppskaket vannet, mangler i de eldste håndskriftene. Der fant Jesus en mann som «hadde vært syk i åtte og tretti år», og sa til ham: «Stå op, ta din seng og gå!» Fordi det var sabbat, førte helbredelsen til en åpen strid med de jødiske lederne. Fire søylehaller rundt de to dammene og en femte på skilleveggen mellom dem er den vanlige forklaringen på de «fem buegangene»."
    - "Øst for dammene var små bad hugd i naturlige huler i bruk allerede i det første århundre f.Kr., og i den romerske byen Aelia Capitolina ble de et helbredelsessenter, vanligvis knyttet til Asklepios og Serapis. På 400-tallet ble en bysantinsk kirke, kjent som Probatica-kirken, bygd over stedet; perserne ødela den i 614, og korsfarerne bygde senere et lite kapell i ruinene ved siden av sin St. Anne-kirke. I 1856 gav den osmanske sultanen eiendommen til Frankrike, og Hvite fedre forvalter den. Shimon Gibson har hevdet at dammene fra begynnelsen tjente som rituelt bad for rensing før inntreden i tempelet. Ruinene kan besøkes innenfor St. Anne-komplekset i det muslimske kvarteret i den gamle byen."
  tl:
    - "Ang Betesda ay isang tangke sa hilagang-silangan ng Jerusalem, malapit sa Pintuang-bayan ng mga Tupa, sa labas ng hilagang panig ng Templo. Kinikilala ito sa kambal na tangke sa tabi ng simbahan ni Santa Ana, sa loob lamang ng Pintuan ng mga Leon ng Lumang Lungsod; inakala ni Conrad Schick noong 1888 na ang isang malaking imbakan doon ang tangke, at ipinakita ng paghuhukay nang maglaon ang dalawang malalaking hukay na tinabas sa bato at hinahati ng pader na bato. Magkaiba ang baybay ng pangalan sa mga manuskrito: Bethesda sa karamihan ng mas huling kopya at sa KJV, Bethzatha sa Codex Sinaiticus, Bethsaida sa Codex Vaticanus at sa papirong P75. Ang Copper Scroll mula sa Qumran (3Q15) ay may pook na Beth Eshdatayin na may tangke, at inakala ni J. T. Milik, na unang naglathala ng balumbon, na ang dalawahang hulapi nito ay nangangahulugang dobleng tangke."
    - "Sabi ni Juan: “Sa Jerusalem nga'y may isang tangke sa tabi ng pintuan ng mga tupa, na sa wikang Hebreo ay tinatawag na Betesda, na may limang portiko.” Maraming maysakit ang nakahandusay sa mga portiko, naghihintay sa paggalaw ng tubig; ang kasunod na talata, tungkol sa isang anghel na kumakalawkaw sa tubig, ay wala sa pinakamatatandang manuskrito. Doon nasumpungan ni Jesus ang isang lalaking “may tatlongpu't walong taon nang maysakit” at sinabi sa kaniya: “Magtindig ka, buhatin mo ang iyong higaan, at lumakad ka.” Dahil Sabbath, ang pagpapagaling ay humantong sa hayagang pagtatalo sa mga pinunong Judio. Ang apat na portiko sa palibot ng dalawang tangke at ikalima sa hati sa pagitan ng mga ito ang karaniwang paliwanag sa “limang portiko”."
    - "Sa silangan ng mga tangke, ang maliliit na paliguang tinabas sa likas na yungib ay ginagamit na noong ika-1 siglo BK, at sa lungsod Romano ng Aelia Capitolina ay naging santuwaryo ng pagpapagaling, na karaniwang iniuugnay kina Asclepio at Serapis. Noong ika-5 siglo, itinayo sa pook ang simbahang Bizantino na kilala bilang simbahan ng Probatica; winasak ito ng mga Persiano noong 614, at nagtayo nang maglaon ang mga Krusado ng maliit na kapilya sa mga guho nito sa tabi ng kanilang simbahan ni Santa Ana. Noong 1856 ibinigay ng sultang Otomano ang ari-arian sa Pransiya, at iniingatan ito ng mga White Fathers. Nangatwiran si Shimon Gibson na ang mga tangke ay naglingkod mula pa sa simula bilang paliguang ritwal para sa paglilinis bago pumasok sa Templo. Maaaring dalawin ang mga guho sa loob ng looban ng Santa Ana sa Muslim Quarter ng Lumang Lungsod."
  da:
    - "Betesda var en dam i det nordøstlige Jerusalem, nær Fåreporten, uden for tempelområdets nordside. Den identificeres med de to sammenhængende damme ved Sankt Annas kirke, lige inden for Gamlebyens Løveport; Conrad Schick regnede i 1888 en stor cisterne dér for dammen, og senere udgravninger viste to store klippehuggede bassiner adskilt af en klippeskillevæg. Håndskrifterne staver navnet forskelligt: Betesda i de fleste yngre afskrifter og i King James-oversættelsen, Betzata i Codex Sinaiticus, Betsajda i Codex Vaticanus og papyrus P75. Kobberrullen fra Qumran (3Q15) nævner et sted, Beth Eshdatayin, med en dam, og J. T. Milik, der først udgav rullen, tolkede dens dualisendelse som en dobbelt dam."
    - "Johannes siger: »Men der er i Jerusalem ved Faareporten en Dam, som paa Hebraisk kaldes Bethesda, og den har fem Søjlegange.« Mange syge lå i søjlegangene og »ventede paa, at Vandet skulde røres«; det følgende vers om en engel, der oprørte vandet, mangler i de ældste håndskrifter. Dér fandt Jesus en mand, som »havde været syg i otte og tredive Aar«, og sagde til ham: »Staa op, tag din Seng og gaa!« Fordi det var sabbat, førte helbredelsen til en åben strid med de jødiske ledere. Fire søjlegange rundt om de to damme og en femte på skillevæggen mellem dem er den sædvanlige forklaring på de »fem Søjlegange«."
    - "Øst for dammene var små bade hugget i naturlige huler i brug allerede i 1. århundrede f.Kr., og i den romerske by Aelia Capitolina blev de et helbredelsessted, sædvanligvis knyttet til Asklepios og Serapis. I 400-tallet blev en byzantinsk kirke, kendt som Probatica-kirken, bygget over stedet; perserne ødelagde den i 614, og korsfarerne rejste senere et lille kapel i dens ruiner ved siden af deres Sankt Annas kirke. I 1856 skænkede den osmanniske sultan ejendommen til Frankrig, og Hvide Fædre forvalter den. Shimon Gibson har hævdet, at dammene fra begyndelsen tjente som rituelt bad til rensning før indgang i templet. Ruinerne kan besøges inden for Sankt Annas område i Gamlebyens muslimske kvarter."
  sr:
    - "Витезда је била бања на североистоку Јерусалима, близу Овчје капије, изван северне стране Храма. Поистовећује се с двоструким базенима поред цркве свете Ане, одмах унутар Лавље капије Старог града; Конрад Шик је 1888. један велики резервоар тамо сматрао бањом, а касније копање показало је два велика у стени исклесана басена раздвојена стеном. Рукописи име пишу различито: Витезда у већини каснијих преписа и у преводу Краља Џејмса, Витзата у Синајском кодексу, Витсаида у Ватиканском кодексу и папирусу P75. Бакарни свитак из Кумрана (3Q15) именује место Бет Ешдатајин с бањом, а Ј. Т. Милик, који је свитак први објавио, схватио је његов двојни наставак као двоструку бању."
    - "Јован каже: „У Јерусалиму, пак, код Овчијих врата има бања, која се зове јеврејски Витезда, и око ње пет покривених тремова“. У тремовима је лежало много болесника, „који чекаху да се заљуја вода“; следећи стих, о анђелу који мути воду, недостаје у најстаријим рукописима. Ту је Исус нашао човека „који тридесет и осам година беше болестан“ и рекао му: „Устани, узми одар свој и ходи.“ Пошто је био дан суботе, исцељење је довело до отвореног спора с јеврејским вођама. Четири портика око два базена и пети на прегради између њих уобичајено су објашњење „пет тремова“."
    - "Источно од базена мала купатила исклесана у природним пећинама била су у употреби већ у 1. веку п. н. е., а у римском граду Елији Капитолини постала су светилиште исцељења, обично повезано с Асклепијем и Сераписом. У 5. веку изнад места подигнута је византијска црква, позната као црква Пробатике; Персијанци су је разорили 614, а крсташи су касније у њеним рушевинама подигли малу капелу поред своје цркве свете Ане. Османски султан је 1856. имање поклонио Француској, а чувају га Бели оци. Шимон Гибсон је тврдио да су базени од почетка служили као обредно купатило за очишћење пред улазак у Храм. Рушевине се могу посетити унутар комплекса свете Ане у Муслиманској четврти Старог града."
