body:
  en:
    - "Mareshah is Tel Maresha, the mound of Tell Sandahanna in the Shephelah, the lowland of Judah, about 2 km south of Beit Guvrin and about 38 km south-west of Jerusalem, on the road from the coast to Hebron. Joshua lists it among the cities of the lowland with Keilah and Achzib, and the genealogies of Judah give it a founder, Laadah, and count “the sons of Mareshah the father of Hebron” among Caleb's line. Rehoboam fortified it with Gath and Ziph, and Micah plays on its name, “heir”: “Yet will I bring an heir unto thee, O inhabitant of Mareshah”."
    - "Here Asa met “Zerah the Ethiopian with an host of a thousand thousand, and three hundred chariots”, and the armies “set the battle in array in the valley of Zephathah at Mareshah”; Asa prayed, “it is nothing with thee to help, whether with many, or with them that have no power”, and pursued the broken host to Gerar. From Mareshah came the prophet Eliezer, who told Jehoshaphat that his ships would not sail because he had joined himself with Ahaziah."
    - "After the exile Edomites settled the lowland, and Mareshah, now Marisa, became the chief town of Idumea, with a colony of Sidonian merchants whose painted tombs, found in 1902, show hunting scenes and animals; the Zenon papyri of 259 BC record Ptolemaic agents trading there. John Hyrcanus took it late in the second century BC and made the Idumeans Jews, among them the ancestors of Herod; the Parthians destroyed it in 40 BC, and Eusebius saw only ruins two miles from Eleutheropolis. Under the mound and around it are hundreds of rock-cut caves: olive presses, columbaria for doves, cisterns and the great bell-shaped quarries of Beit Guvrin."
    - "Bliss and Macalister excavated the Hellenistic town in 1898–1900, and Amos Kloner's work since the 1980s cleared the caves; the Beit Guvrin–Maresha national park, with the Sidonian tomb and the bell caves, was inscribed by UNESCO in 2014."
  ru:
    - "Мареша — это Тель-Мареша, холм Телль-Сандаханна в Шефеле, низменности Иуды, примерно в 2 км к югу от Бейт-Гуврина и примерно в 38 км к юго-западу от Иерусалима, на дороге с побережья в Хеврон. Иисус Навин перечисляет её среди городов низменности вместе с Кеилой и Ахзивом, а родословия Иуды дают ей основателя, Лаеду, и числят «сыновья Мареши, отца Хеврона» в роду Халева. Ровоам укрепил её вместе с Гефом и Зифом, а Михей играет её именем, созвучным слову «наследник»: «Еще наследника приведу к тебе, жительница Мореша»."
    - "Здесь Аса встретил Зарая Ефиоплянина «с войском в тысячу тысяч и с тремястами колесниц», и войска «построились к сражению на долине Цефата у Мареши»; Аса молился: «не в Твоей ли силе помочь сильному или бессильному?» — и преследовал разбитое войско до Герара. Из Мареши был пророк Елиезер, сказавший Иосафату, что его корабли не пойдут, потому что он вступил в общение с Охозией."
    - "После плена низменность заселили Идумеи, и Мареша, теперь Мариса, стала главным городом Идумеи с колонией сидонских купцов, чьи расписные гробницы, найденные в 1902 году, показывают сцены охоты и зверей; папирусы Зенона 259 г. до н. э. отмечают здесь торговлю агентов Птолемеев. Иоанн Гиркан взял её в конце II века до н. э. и обратил Идумеев в иудейство, среди них предков Ирода; парфяне разрушили её в 40 г. до н. э., и Евсевий видел лишь развалины в двух милях от Елевферополя. Под холмом и вокруг него сотни высеченных в скале пещер: маслодавильни, колумбарии для голубей, водоёмы и огромные колоколообразные каменоломни Бейт-Гуврина."
    - "Блисс и Макалистер раскопали эллинистический город в 1898–1900 годах, а работы Амоса Клонера с 1980-х расчистили пещеры; национальный парк Бейт-Гуврин — Мареша с сидонской гробницей и колокольными пещерами внесён в список ЮНЕСКО в 2014 году."
  uk:
    - "Мареша — це Тель-Мареша, пагорб Телль-Сандахана в Шефелі, низовині Юди, приблизно за 2 км на південь від Бейт-Гуврина й близько 38 км на південний захід від Єрусалима, на дорозі від узбережжя до Хеврона. Ісус Навин зараховує її до міст низовини разом із Кеїлою та Ахзівом, а родоводи Юди дають їй засновника, Лаеду, і зараховують «сини Мареші, Хевронового батька» до роду Калеба. Ровоам укріпив її разом з Гатом і Зіфом, а Міхей грає на її назві, «спадкоємець»: «Я ще нашлю на тебе, осаднице Мореша, здобичника» — у староєврейському тексті тут «приведу до тебе спадкоємця», а текст Куліша передає це як «здобичник»."
    - "Тут Аса зустрів Зераха Ефіопянина: «Зарай, Етіопій, з військом в тисячу тисяч і з трьома стами колесниць», і війська «стали лавами до битви на долинї Зефата коло Мареші»; Аса молився: «чи ж се не в твоїй руцї, помогти чи сильному чи малосилому?» — і гнав розбите військо до Герара. З Мареші походив пророк Еліезер, який сказав Йосафатові, що його кораблі не попливуть, бо той поєднався з Охозією."
    - "Після полону едомити оселилися в низовині, і Мареша, тепер Маріса, стала головним містом Ідумеї, з колонією сидонських купців, чиї розписані гробниці, знайдені 1902 р., показують сцени полювання й тварин; Зенонові папіруси 259 р. до н. е. записують, що там торгували птолемеївські агенти. Іоанн Гіркан узяв її наприкінці II ст. до н. е. й зробив ідумеїв юдеями, серед них і пращурів Ірода; парфяни зруйнували її 40 р. до н. е., а Євсевій бачив лише руїни за дві милі від Елевтерополя. Під пагорбом і навколо нього — сотні висічених у скелі печер: оливні преси, голубники, цистерни й великі дзвоноподібні каменоломні Бейт-Гуврина."
    - "Бліс і Макалістер розкопували елліністичне місто 1898–1900 рр., а робота Амоса Клонера з 1980-х рр. розчистила печери; національний парк Бейт-Гуврін — Мареша, зі сидонською гробницею та дзвоноподібними печерами, внесений ЮНЕСКО до списку 2014 р."
  es:
    - "Maresa es Tel Maresha, el montículo de Tell Sandahanna en la Sefelá, la llanura baja de Judá, a unos 2 km al sur de Beit Guvrin y a unos 38 km al sudoeste de Jerusalén, en el camino de la costa a Hebrón. Josué la enumera entre las ciudades de la llanura con Keila y Aczib, y las genealogías de Judá le dan un fundador, Laada, y cuentan «los hijos de Maresa padre de Hebrón» en el linaje de Caleb. Roboam la fortificó junto con Gat y Zif, y Miqueas juega con su nombre, «heredero»: «Aun te traeré heredero, oh moradora de Maresah»."
    - "Aquí Asa se enfrentó a «Zera Etiope con un ejército de mil millares, y trescientos carros», y los ejércitos «ordenaron la batalla en el valle de Sephata junto á Maresa»; Asa oró: «Jehová, no tienes tú más con el grande que con el que ninguna fuerza tiene, para dar ayuda», y persiguió al ejército deshecho hasta Gerar. De Maresa vino el profeta Eliezer, que dijo a Josafat que sus naves no navegarían porque se había asociado con Ocozías."
    - "Después del destierro los edomitas se establecieron en la llanura baja, y Maresa, ahora Marisa, llegó a ser la ciudad principal de Idumea, con una colonia de mercaderes sidonios cuyas tumbas pintadas, halladas en 1902, muestran escenas de caza y animales; los papiros de Zenón de 259 a. C. registran agentes ptolemaicos comerciando allí. Juan Hircano la tomó a finales del siglo II a. C. e hizo judíos a los idumeos, entre ellos los antepasados de Herodes; los partos la destruyeron en 40 a. C., y Eusebio solo vio ruinas a dos millas de Eleuterópolis. Bajo el montículo y a su alrededor hay cientos de cuevas excavadas en la roca: lagares de aceite, palomares, cisternas y las grandes canteras en forma de campana de Beit Guvrin."
    - "Bliss y Macalister excavaron la ciudad helenística en 1898–1900, y los trabajos de Amos Kloner desde los años ochenta despejaron las cuevas; el parque nacional de Beit Guvrin–Maresha, con la tumba sidonia y las cuevas en forma de campana, fue inscrito por la UNESCO en 2014."
  pt:
    - "Maressa é Tel Maresha, o montículo de Tell Sandahanna na Sefelá, a planície baixa de Judá, a cerca de 2 km ao sul de Bet Guvrin e a cerca de 38 km a sudoeste de Jerusalém, na estrada da costa para Hebrom. Josué a lista entre as cidades da planície com Queila e Aczibe, e as genealogias de Judá lhe dão um fundador, Ladã, e contam “os filhos de Maressa, pai de Hebrom” na linhagem de Calebe. Roboão a fortificou com Gate e Zife, e Miqueias joga com o seu nome, “herdeiro”: “Ainda trarei um conquistador a vocês, habitantes de Maressa”."
    - "Aqui Asa enfrentou Zera, o etíope, com um exército de “um milhão de soldados e trezentos carros de guerra”, e os exércitos “se posicionaram para a batalha no vale de Zefatá, em Maressa”; Asa orou: “não há ninguém além de ti para ajudar, entre o poderoso e aquele que não tem força”, e perseguiu o exército desfeito até Gerar. De Maressa veio o profeta Eliézer, que disse a Josafá que seus navios não navegariam porque se aliara a Acazias."
    - "Depois do exílio, edomitas se estabeleceram na planície, e Maressa, agora Marisa, tornou-se a principal cidade da Iduméia, com uma colônia de mercadores sidônios cujos túmulos pintados, descobertos em 1902, mostram cenas de caça e animais; os papiros de Zenão de 259 a.C. registram agentes ptolemaicos negociando ali. João Hircano a tomou no final do século II a.C. e tornou judeus os idumeus, entre eles os antepassados de Herodes; os partas a destruíram em 40 a.C., e Eusébio viu apenas ruínas a duas milhas de Eleuterópolis. Sob o montículo e em torno dele há centenas de cavernas escavadas na rocha: lagares de azeite, columbários para pombas, cisternas e as grandes pedreiras em forma de sino de Bet Guvrin."
    - "Bliss e Macalister escavaram a cidade helenística em 1898–1900, e o trabalho de Amos Kloner desde a década de 1980 liberou as cavernas; o parque nacional de Bet Guvrin–Maresha, com o túmulo sidônio e as cavernas em forma de sino, foi inscrito pela UNESCO em 2014."
  de:
    - "Maresa ist Tel Maresha, der Hügel Tell Sandahanna in der Schefela, dem Tiefland Judas, etwa 2 km südlich von Beit Guvrin und etwa 38 km südwestlich von Jerusalem, an der Straße von der Küste nach Hebron. Josua führt es unter den Städten des Tieflands mit Keïla und Achsib auf, und die Genealogien Judas geben ihm einen Gründer, Laeda, und zählen „die Kinder Maresas, des Vaters Hebrons“ zur Linie Kalebs. Rehabeam befestigte es mit Gat und Sif, und Micha spielt auf seinen Namen, „Erbe“, an: „Ich will dir, Maresa, den rechten Erben bringen“."
    - "Hier traf Asa auf „Serah, der Mohr, mit einer Heereskraft tausendmaltausend, dazu dreihundert Wagen“, und die Heere „rüsteten sich zum Streit im Tal Zephatha bei Maresa“; Asa betete: „es ist bei dir kein Unterschied, zu helfen unter vielen oder da keine Kraft ist“, und verfolgte das geschlagene Heer bis Gerar. Aus Maresa kam der Prophet Elieser, der Josaphat sagte, seine Schiffe würden nicht fahren, weil er sich mit Ahasja verbunden hatte."
    - "Nach dem Exil siedelten Edomiter im Tiefland, und Maresa, nun Marisa, wurde der Hauptort Idumäas, mit einer Kolonie sidonischer Kaufleute, deren 1902 gefundene bemalte Gräber Jagdszenen und Tiere zeigen; die Zenon-Papyri von 259 v. Chr. verzeichnen ptolemäische Händler, die dort Handel trieben. Johannes Hyrkanos nahm es Ende des 2. Jahrhunderts v. Chr. ein und machte die Idumäer zu Juden, unter ihnen die Vorfahren des Herodes; die Parther zerstörten es 40 v. Chr., und Eusebius sah nur Ruinen zwei Meilen von Eleutheropolis. Unter dem Hügel und ringsum liegen Hunderte in den Fels gehauener Höhlen: Ölpressen, Taubenschläge (Kolumbarien), Zisternen und die großen glockenförmigen Steinbrüche von Beit Guvrin."
    - "Bliss und Macalister gruben 1898–1900 die hellenistische Stadt aus, und Amos Kloners Arbeiten seit den 1980er Jahren legten die Höhlen frei; der Nationalpark Beit Guvrin–Maresha mit dem sidonischen Grab und den Glockenhöhlen wurde 2014 von der UNESCO eingetragen."
  fr:
    - "Maréscha est Tel Maresha, le tertre de Tell Sandahanna, dans la Shéphéla, la plaine de Juda, à environ 2 km au sud de Beit Guvrin et à environ 38 km au sud-ouest de Jérusalem, sur la route de la côte vers Hébron. Josué la range parmi les villes de la plaine avec Keïla et Aczib, et les généalogies de Juda lui donnent un fondateur, Laeda, et comptent « les fils de Maréscha, père d’Hébron » dans la lignée de Caleb. Roboam la fortifia avec Gath et Ziph, et Michée joue sur son nom, « héritier » : « Je t’amènerai un nouveau maître, habitante de Maréscha »."
    - "C’est ici que Zérach l’Éthiopien sortit contre Asa « avec une armée d’un million d’hommes et trois cents chars », et que les armées « se rangèrent en bataille dans la vallée de Tsephata, près de Maréscha » ; Asa invoqua l’Éternel : « toi seul peux venir en aide au faible comme au fort », et poursuivit l’armée brisée jusqu’à Guérar. De Maréscha vint le prophète Éliézer, qui dit à Josaphat que ses navires ne pourraient pas naviguer parce qu’il s’était associé à Achazia."
    - "Après l’exil, des Édomites s’installèrent dans la plaine, et Maréscha, devenue Marisa, fut la ville principale de l’Idumée, avec une colonie de marchands sidoniens dont les tombes peintes, trouvées en 1902, montrent des scènes de chasse et des animaux ; les papyrus de Zénon de 259 av. J.-C. attestent que des agents ptolémaïques y faisaient commerce. Jean Hyrcan la prit à la fin du IIe siècle av. J.-C. et fit des Iduméens des Juifs, parmi lesquels les ancêtres d’Hérode ; les Parthes la détruisirent en 40 av. J.-C., et Eusèbe n’en vit que des ruines, à deux milles d’Éleuthéropolis. Sous le tertre et autour de lui se trouvent des centaines de grottes taillées dans le roc : pressoirs à olives, columbariums pour pigeons, citernes et les grandes carrières en cloche de Beit Guvrin."
    - "Bliss et Macalister fouillèrent la ville hellénistique en 1898–1900, et les travaux d’Amos Kloner depuis les années 1980 ont dégagé les grottes ; le parc national de Beit Guvrin–Maresha, avec la tombe sidonienne et les grottes en cloche, a été inscrit par l’UNESCO en 2014."
  it:
    - "Maresa è Tel Maresha, il tell di Tell Sandahanna nella Sefela, la pianura di Giuda, a circa 2 km a sud di Bet Guvrin e a circa 38 km a sud-ovest di Gerusalemme, sulla strada dalla costa a Ebron. Giosuè la elenca tra le città della pianura con Keila e Aczib, e le genealogie di Giuda le danno un fondatore, Laada, e annoverano «i figliuoli di Maresha, che fu padre di Hebron» nella linea di Caleb. Roboamo la fortificò con Gat e Zif, e Michea gioca sul suo nome, «erede»: «Io ti condurrò un nuovo possessore, o abitatrice di Maresha»."
    - "Qui Asa affrontò «Zerah, l’Etiopo, … con un esercito d’un milione d’uomini e trecento carri», e gli eserciti «si disposero in ordine di battaglia nella valle di Tsefatha presso Maresha»; Asa pregò: «per te non v’è differenza tra il dar soccorso a chi è in gran numero, e il darlo a chi è senza forza», e inseguì l’esercito sconfitto fino a Gerar. Da Maresa venne il profeta Eliezer, che disse a Giosafat che le sue navi non avrebbero preso il mare perché si era associato con Acazia."
    - "Dopo l’esilio gli Edomiti si stabilirono nella pianura, e Maresa, ora Marisa, divenne la città principale dell’Idumea, con una colonia di mercanti sidonii le cui tombe dipinte, trovate nel 1902, mostrano scene di caccia e animali; i papiri di Zenone del 259 a.C. registrano agenti tolemaici che vi commerciavano. Giovanni Ircano la prese verso la fine del II secolo a.C. e rese giudei gli Idumei, tra i quali gli antenati di Erode; i Parti la distrussero nel 40 a.C., ed Eusebio vide solo rovine a due miglia da Eleuteropoli. Sotto il tell e intorno ad esso vi sono centinaia di grotte scavate nella roccia: frantoi, colombari, cisterne e le grandi cave a forma di campana di Bet Guvrin."
    - "Bliss e Macalister scavarono la città ellenistica nel 1898–1900, e il lavoro di Amos Kloner dagli anni Ottanta ha ripulito le grotte; il parco nazionale di Bet Guvrin–Maresha, con la tomba sidonia e le grotte a campana, è stato iscritto dall’UNESCO nel 2014."
  pl:
    - "Maresza to Tel Maresha, kopiec Tell Sandahanna w Szefeli, nizinie Judy, około 2 km na południe od Bet Guvrin i około 38 km na południowy zachód od Jerozolimy, przy drodze z wybrzeża do Hebronu. Jozue wymienia ją wśród miast nizin z Keilą i Akzibem, a rodowody Judy dają jej założyciela, Laedę, i zaliczają „synów Maresy, ojca Hebrowowego” do rodu Kaleba. Roboam ufortyfikował ją z Gat i Zifem, a Mika gra jej nazwą, „dziedzic”: „Jeszczeć dziedzice przywiodę, o obywatelko Maresy!”"
    - "Tu, jak mówi Księga Kronik, „wyciągnął przeciw nim Zara Etyjopczyk, mając wojska dziesięć kroć sto tysięcy, a wozów trzy sta”; Asa wyszedł mu naprzeciw i „uszykowali wojska w dolinie Sefata u Maresy”; modlił się: „ty nie potrzebujesz wielu, abyś ratował tego, który nie ma potęgi”, i ścigał rozbite wojsko aż do Gerar. Z Maresy pochodził prorok Eliezer, który powiedział Jozafatowi, że jego okręty nie popłyną, bo związał się z Ochozjaszem."
    - "Po niewoli Edomici osiedlili się na nizinie, a Maresza, teraz Marisa, stała się głównym miastem Idumei, z kolonią sydońskich kupców, których malowane grobowce, odkryte w 1902 r., ukazują sceny łowieckie i zwierzęta; papirusy Zenona z 259 r. p.n.e. notują tam handlujących agentów ptolemejskich. Jan Hyrkan zdobył ją pod koniec II w. p.n.e. i uczynił Idumejczyków Żydami, wśród nich przodków Heroda; Partowie zniszczyli ją w 40 r. p.n.e., a Euzebiusz widział tylko ruiny dwie mile od Eleuteropolis. Pod kopcem i wokół niego są setki wykutych w skale jaskiń: tłocznie oliwy, kolumbaria dla gołębi, cysterny i wielkie dzwonowate kamieniołomy Bet Guvrin."
    - "Bliss i Macalister prowadzili wykopaliska w hellenistycznym mieście w latach 1898–1900, a prace Amosa Klonera od lat osiemdziesiątych XX w. oczyściły jaskinie; park narodowy Bet Guvrin–Maresza, z grobowcem sydońskim i jaskiniami dzwonowatymi, został wpisany przez UNESCO w 2014 r."
  nl:
    - "Maresa is Tel Maresha, de heuvel Tell Sandahanna in de Sefela, het laagland van Juda, ongeveer 2 km ten zuiden van Beit Guvrin en zo'n 38 km ten zuidwesten van Jeruzalem, aan de weg van de kust naar Hebron. Jozua noemt het onder de steden van het laagland met Keïla en Achzib, en de genealogieën van Juda geven het een stichter, Laäda, en rekenen “de kinderen van Maresa, den vader van Hebron” tot Kalebs geslacht. Rehabeam versterkte het met Gat en Zif, en Micha speelt met zijn naam, “erfgenaam”: “Ik zal u nog een erfgenaam toebrengen, gij inwoneres van Maresa!”"
    - "Hier ontmoette Asa Zerach: “Zerah, de Moor, kwam tegen hen uit, met een heir van duizend maal duizend, en driehonderd wagenen”, en de legers “stelden de slagorde in het dal Zefatha bij Maresa”; Asa bad: “het is niets bij U, te helpen hetzij den machtige, hetzij den krachteloze”, en achtervolgde het verslagen leger tot Gerar. Uit Maresa kwam de profeet Eliëzer, die Josafat zei dat zijn schepen niet zouden varen omdat hij zich met Achazia had verbonden."
    - "Na de ballingschap vestigden Edomieten zich in het laagland, en Maresa, nu Marisa, werd de hoofdplaats van Idumea, met een kolonie Sidonische kooplieden wier beschilderde graven, in 1902 gevonden, jachttaferelen en dieren tonen; de Zenon-papyri van 259 v.Chr. vermelden Ptolemaeïsche agenten die er handel dreven. Johannes Hyrcanus nam het eind tweede eeuw v.Chr. in en maakte de Idumeeërs tot joden, onder wie de voorouders van Herodes; de Parthen verwoestten het in 40 v.Chr., en Eusebius zag alleen ruïnes op twee mijl van Eleutheropolis. Onder en rond de heuvel liggen honderden in de rots uitgehouwen grotten: olijfpersen, duiventillen, cisternen en de grote klokvormige steengroeven van Beit Guvrin."
    - "Bliss en Macalister groeven de hellenistische stad op in 1898–1900, en het werk van Amos Kloner sinds de jaren tachtig legde de grotten bloot; het nationale park Beit Guvrin–Maresha, met het Sidonische graf en de klokgrotten, werd in 2014 door UNESCO op de werelderfgoedlijst geplaatst."
  cs:
    - "Mareša je Tel Maresha, pahorek Tell Sandahanna v Šefele, nížině Judy, asi 2 km jižně od Bejt Guvrinu a asi 38 km jihozápadně od Jeruzaléma, při cestě od pobřeží do Hebronu. Jozue ji uvádí mezi městy nížiny s Keilou a Achzívem a rodopisy Judy jí dávají zakladatele, Laadu, a počítají „synů Marese, otce Hebronova“ ke Kálebovu rodu. Rechabeám ji opevnil s Gatem a Zífem a Micheáš si hraje s jejím jménem, „dědic“: „Ó obyvatelkyně Maresa, i toběť tudíž přivedu dědice“."
    - "Tu proti Asovi vytáhl „Zerach Mouřenín, maje v vojště desetkrát sto tisíců, a vozů tři sta“ a „sšikovali vojska v údolí Sefata u Maresa“; Asa se modlil: „neníť potřebí tobě velikého množství, když ty chceš pomoci mdlejším“, a pronásledoval rozbité vojsko až do Gerar. Z Mareši pocházel prorok Eliezer, který Jozafatovi řekl, že jeho lodě neodplují, protože se spojil s Achazjášem."
    - "Po exilu Edómci osídlili nížinu a Mareša, nyní Marisa, se stala hlavním městem Idumeje, s kolonií sidonských obchodníků, jejichž malované hrobky, nalezené roku 1902, ukazují lovecké výjevy a zvířata; zenónské papyry z roku 259 př. n. l. zaznamenávají, že tam obchodovali ptolemaiovští agenti. Jan Hyrkanos ji dobyl koncem 2. století př. n. l. a učinil z Idumejců Židy, mezi nimi předky Heroda; Parthové ji zničili roku 40 př. n. l. a Eusebius viděl jen zříceniny dvě míle od Eleutheropole. Pod pahorkem i kolem něj jsou stovky skalních jeskyní: lisy na olivy, kolumbária pro holuby, cisterny a velké zvonovité lomy Bejt Guvrinu."
    - "Bliss a Macalister vykopávali helénistické město v letech 1898–1900 a práce Amose Klonera od 80. let 20. století vyčistily jeskyně; národní park Bejt Guvrin–Mareša se sidonskou hrobkou a zvonovitými jeskyněmi byl zapsán UNESCO roku 2014."
  sv:
    - "Maresha är Tel Maresha, kullen Tell Sandahanna i Shefela, Judas lågland, omkring 2 km söder om Beit Guvrin och omkring 38 km sydväst om Jerusalem, vid vägen från kusten till Hebron. Josua förtecknar den bland låglandets städer med Keila och Aksiv, och Judas släktregister ger den en grundare, Lada, och räknar ”Maresas, Hebrons faders, söner” till Kalevs släkt. Rehabeam befäste den med Gat och Sif, och Mika leker med dess namn, ”arvinge”: ”Ännu en gång skall jag låta erövraren komma över eder, I Maresas invånare.”"
    - "Här mötte Asa ”Sera från Etiopien”, som ”drog ut mot dem med en här av tusen gånger tusen man och tre hundra vagnar”, och härarna ”ställde upp sig till strid i Sefatas dal vid Maresa”; Asa bad: ”HERRE, förutom dig finnes ingen som kan hjälpa i striden mellan den starke och den svage”, och förföljde den krossade hären till Gerar. Från Maresha kom profeten Elieser, som sade till Josafat att hans skepp inte skulle segla eftersom han hade förbundit sig med Achasja."
    - "Efter exilen bosatte sig edomiter i låglandet, och Maresha, nu Marisa, blev Idumeens huvudstad, med en koloni av sidoniska köpmän vars målade gravar, funna 1902, visar jaktscener och djur; Zenonpapyrerna från 259 f.Kr. upptecknar ptolemaiska ombud som handlade där. Johannes Hyrkanos intog den sent under 100-talet f.Kr. och gjorde idumeerna till judar, bland dem Herodes förfäder; partherna förstörde den 40 f.Kr., och Eusebios såg endast ruiner två romerska mil från Eleutheropolis. Under kullen och runt omkring den finns hundratals klippgrottor: oljepressar, duvslag, cisterner och de stora klockformade stenbrotten i Beit Guvrin."
    - "Bliss och Macalister grävde ut den hellenistiska staden 1898–1900, och Amos Kloners arbete sedan 1980-talet rensade grottorna; nationalparken Beit Guvrin–Maresha, med den sidoniska graven och klockgrottorna, skrevs in på Unescos världsarvslista 2014."
  nb:
    - "Maresja er Tel Maresha, haugen Tell Sandahanna i Sjefela, lavlandet i Juda, omkring 2 km sør for Bet Guvrin og omkring 38 km sørvest for Jerusalem, ved veien fra kysten til Hebron. Josva oppfører den blant byene i lavlandet sammen med Keila og Aksib, og Judas slektstavler gir den en grunnlegger, Lada, og regner «sønnene til Hebrons far Maresa» til Kalebs linje. Rehabeam befestet den sammen med Gat og Sif, og Mika leker med navnet, «arving»: «Ennu en gang skal jeg la eder få en eiermann, I Maresas innbyggere!»"
    - "Her møtte Asa «etioperen Serah … med en hær på tusen ganger tusen mann og tre hundre stridsvogner», og hærene «stilte sig i fylking i Sefata-dalen ved Maresa»; Asa ba: «for dig gjør det ingen forskjell, enten du hjelper den mektige eller den maktesløse», og forfulgte den slagne hæren til Gerar. Fra Maresja kom profeten Elieser, som sa til Josjafat at skipene hans ikke ville seile fordi han hadde sluttet forbund med Ahasja."
    - "Etter eksilet bosatte edomittene lavlandet, og Maresja, nå Marisa, ble hovedbyen i Idumea, med en koloni av sidoniske kjøpmenn hvis malte graver, funnet i 1902, viser jaktscener og dyr; Zenon-papyrusene fra 259 f.Kr. forteller om ptolemeiske agenter som drev handel der. Johannes Hyrkan inntok den sent på 100-tallet f.Kr. og gjorde idumeerne til jøder, blant dem Herodes' forfedre; partherne ødela den i 40 f.Kr., og Eusebius så bare ruiner to romerske mil fra Eleutheropolis. Under haugen og omkring den finnes hundrevis av uthuggede huler: oljepresser, duehus, sisterner og de store klokkeformede steinbruddene i Bet Guvrin."
    - "Bliss og Macalister gravde ut den hellenistiske byen i 1898–1900, og Amos Kloners arbeid siden 1980-årene har ryddet hulene; nasjonalparken Bet Guvrin–Maresha, med den sidoniske graven og klokkehulene, ble oppført på UNESCOs verdensarvliste i 2014."
  tl:
    - "Ang Maresa ay ang Tel Maresha, ang burol ng Tell Sandahanna sa Sephela, ang mababang lupain ng Juda, mga 2 km sa timog ng Beit Guvrin at mga 38 km sa timog-kanluran ng Jerusalem, sa daan mula sa baybayin hanggang Hebron. Itinatala ito ni Josue sa mga lungsod ng mababang lupain kasama ng Ceila at Achzib, at binibigyan ito ng mga talaangkan ng Juda ng tagapagtatag, si Laada, at ibinibilang ang “mga anak ni Maresa na ama ni Hebron” sa angkan ni Caleb. Pinatibay ito ni Roboam kasama ng Gath at Ziph, at naglalaro si Mikas sa pangalan nito, “tagapagmana”: “Dadalhin ko pa sa iyo, Oh nananahan sa Maresah ang magaari sa iyo”."
    - "Dito sinalubong ni Asa si “Zera na taga Etiopia na may hukbo na isang angaw, at tatlong daang karo”, at ang mga hukbo ay “nagsihanay ng pakikipagbaka sa libis ng Sephata sa Maresa”; nanalangin si Asa, “walang iba liban sa iyo na makatutulong, sa pagitan ng makapangyarihan at niya na walang lakas”, at hinabol ang nadurog na hukbo hanggang sa Gerar. Mula sa Maresa nanggaling ang propetang si Eliezer, na nagsabi kay Josaphat na hindi maglalayag ang kaniyang mga barko dahil nakipagkaisa siya kay Ochozias."
    - "Pagkatapos ng pagkatapon, nanirahan ang mga Edomita sa mababang lupain, at ang Maresa, na ngayo'y Marisa, ay naging pangunahing bayan ng Idumea, na may kolonya ng mga mangangalakal na Sidonio na ang mga pininturahang libingan, na natagpuan noong 1902, ay nagpapakita ng mga eksena ng pangangaso at mga hayop; itinatala ng mga papiro ni Zenon noong 259 BK ang mga ahenteng Ptolemeo na nangangalakal doon. Sinakop ito ni Juan Hircano noong huling bahagi ng ika-2 siglo BK at ginawang Judio ang mga Idumeo, kabilang ang mga ninuno ni Herodes; winasak ito ng mga Parto noong 40 BK, at mga guho lamang ang nakita ni Eusebio dalawang milya mula sa Eleutheropolis. Sa ilalim at sa palibot ng burol ay daan-daang yungib na tinabas sa bato: mga pisaan ng olibo, columbarium para sa mga kalapati, mga imbakan ng tubig at ang malalaking hukay-bato na hugis-kampana ng Beit Guvrin."
    - "Hinukay nina Bliss at Macalister ang bayang Helenistiko noong 1898–1900, at nilinis ng gawain ni Amos Kloner mula dekada 1980 ang mga yungib; ang pambansang liwasang Beit Guvrin–Maresha, na may libingang Sidonio at mga yungib na hugis-kampana, ay isinama ng UNESCO sa talaan noong 2014."
  da:
    - "Maresja er Tel Maresha, højen Tell Sandahanna i Sjefela, Judas lavland, omkring 2 km syd for Beit Guvrin og omkring 38 km sydvest for Jerusalem, på vejen fra kysten til Hebron. Josva opregner den blandt lavlandets byer med Ke'ila og Akzib, og Judas slægtsregistre giver den en grundlægger, Laada, og regner »Maresas, Hebrons Faders, Sønner« til Kalebs slægt. Rehabeam befæstede den med Gat og Zif, og Mika spiller på dens navn, »arving«: »Jeg vil endnu føre en Ejermand til dig, du Indbyggerske i Maresa!«"
    - "Her skete det, at »Morianen Sera drog ud imod dem med en Hær, tusinde Gange tusinde, og med tre Hundrede Vogne«, og at Asa og hans hær »rustede sig til Slag i Zefatas Dal ved Maresa«; Asa bad: »hos dig, naar du vil hjælpe, gør det ingen Forskel, om en har megen eller ingen Kraft«, og forfulgte den knuste hær til Gerar. Fra Maresja kom profeten Eliezer, der fortalte Josafat, at hans skibe ikke ville sejle, fordi han havde forbundet sig med Akazja."
    - "Efter eksilet bosatte edomitterne sig i lavlandet, og Maresja, nu Marisa, blev Idumæas hovedby, med en koloni af sidoniske købmænd, hvis malede grave, fundet i 1902, viser jagtscener og dyr; Zenon-papyrerne fra 259 f.Kr. optegner ptolemæiske agenter, der handlede dér. Johannes Hyrkanos indtog den sent i 100-tallet f.Kr. og gjorde idumæerne til jøder, blandt dem Herodes' forfædre; partherne ødelagde den i 40 f.Kr., og Eusebios så kun ruiner to romerske mil fra Eleutheropolis. Under højen og omkring den er der hundredvis af klippehuggede huler: olivenpresser, columbarier til duer, cisterner og de store klokkeformede stenbrud i Beit Guvrin."
    - "Bliss og Macalister udgravede den hellenistiske by i 1898–1900, og Amos Kloners arbejde siden 1980'erne ryddede hulerne; nationalparken Beit Guvrin–Maresha, med den sidoniske grav og klokkehulerne, blev optaget på UNESCOs liste i 2014."
  sr:
    - "Мариса је Тел Мариса, хумка Тел Сандахана у Сефели, јудејској низији, око 2 км јужно од Бејт Гуврина и око 38 км југозападно од Јерусалима, на путу од обале до Хеврона. Исус Навин је наводи међу градовима низије с Кеилом и Ахзивом, а родослови Јуде дају јој оснивача, Ладу, и убрајају „синови Марисе оца Хевроновог“ у Халевову лозу. Ровоам ју је утврдио с Гатом и Зифом, а Миха се игра њеним именом, „наследник“: „Још ћу ти довести наследника, становнице мариска“."
    - "Овде је Аса дочекао „Зара Етиопљанин с хиљаду хиљада војске и с триста кола“, и „уврсташе се војске у долини Сефати код Марисе“; Аса се молио: „Господе Теби је ништа помоћи множини или нејаком“, и гонио је разбијену војску до Герара. Из Марисе је био пророк Елијезер, који је рекао Јосафату да његове лађе неће пловити јер се здружио с Охозијом."
    - "После изгнанства Едомци су населили низију, а Мариса, названа сада грчким обликом имена, постала је главни град Идумеје, са колонијом сидонских трговаца чије осликане гробнице, нађене 1902, приказују ловачке сцене и животиње; Зенонови папируси из 259. п. н. е. бележе птолемејске агенте који ту тргују. Јован Хиркан заузео ју је крајем II века п. н. е. и Идумејце учинио Јеврејима, међу њима и претке Ирода; Парти су је разорили 40. п. н. е., а Јевсевије је видео само рушевине две миље од Елевтеропоља. Испод хумке и око ње су стотине у стени исклесаних пећина: пресе за маслине, голубарници, цистерне и велики звонасти каменоломи Бејт Гуврина."
    - "Блис и Макалистер ископавали су хеленистички град 1898–1900, а рад Амоса Клонера од 1980-их очистио је пећине; национални парк Бејт Гуврин–Мариса, са сидонском гробницом и звонастим пећинама, УНЕСКО је уписао 2014."
  hu:
    - "Maresa a Tel Maresha, a Tell Sandahanna halma a Sefélában, Júda alföldjén, Beit Guvrintől mintegy 2 km-re délre és Jeruzsálemtől mintegy 38 km-re délnyugatra, a partról Hebronba vezető úton. Józsué az alföld városai között sorolja fel Keilával és Akzibbal, Júda nemzetségtáblái pedig alapítót adnak neki, Laadát, és Káleb ágában említik: „ez volt Zifnek és Marésa fiainak atyjok, Hebronnak atyja”. Roboám megerősítette Gáttal és Ziffel, Mikeás pedig szójátékot játszik a nevével, „örökös”: „Még hozok én te néked örököst, Marésa lakosa”."
    - "Itt ütközött meg Ásza a támadóval: „kijöve ő ellenök a szerecsen Zérah, ezerszer ezer emberrel és háromszáz szekérrel”, és a seregek „viadalhoz készülének a Sefáta völgyben, Marésa mellett”; Ásza így imádkozott: „nincs különbség előtted a sok között és az erő nélkül való között, hogy megsegítsed”, és a szétvert sereget Gerárig üldözte. Maresából való volt Eliézer próféta, aki megmondta Jósafátnak, hogy hajói nem hajózhatnak, mert Ahazjával szövetkezett."
    - "A száműzetés után edomiták telepedtek az alföldre, és Maresa, most Marisa, Idumea fő városa lett, szidóni kereskedők kolóniájával, akiknek 1902-ben talált festett sírjai vadászjeleneteket és állatokat mutatnak; a Kr. e. 259-es Zénón-papiruszok ptolemaioszi megbízottak kereskedését jegyzik itt. Hürkánosz János a Kr. e. 2. század végén elfoglalta, és az idumeaiakat zsidókká tette, köztük Heródes őseit; a pártusok Kr. e. 40-ben elpusztították, és Eusebius csak romokat látott Eleutheropolistól két mérföldre. A halom alatt és körül százával vannak sziklába vájt barlangok: olajprések, galambdúcok, ciszternák és Beit Guvrin nagy harang alakú kőfejtői."
    - "Bliss és Macalister 1898–1900-ban ásta a hellénisztikus várost, Amos Kloner munkája az 1980-as évektől kitisztította a barlangokat; a Beit Guvrin–Maresha nemzeti park a szidóni sírral és a harangbarlangokkal 2014-ben az UNESCO világörökségi listájára került."
  fi:
    - "Maresa on Tel Maresha, Tell Sandahannan kumpu Sefelassa, Juudan alangolla, noin 2 km Beit Guvrinista etelään ja noin 38 km Jerusalemista lounaaseen, rannikolta Hebroniin johtavan tien varrella. Joosua luettelee sen alangon kaupunkien joukossa Keilan ja Aksibin kanssa, ja Juudan sukuluettelot antavat sille perustajan, Ladan, ja laskevat ”Maaresan, Hebronin isän, pojat” Kalebin suvun joukkoon. Rehabeam linnoitti sen Gatin ja Sifin kanssa, ja Miika leikittelee sen nimellä, ”perijä”: ”Minä tuon vieläkin perijän sinulle, Maaresan asujatar”."
    - "Täällä Aasa kohtasi etiopialaisen Serahin, joka oli lähtenyt heitä vastaan ”sotajoukolla, jossa oli miehiä tuhannen tuhatta ja sotavaunuja kolmesataa”, ja armeijat ”asettuivat sotarintaan Sefatan laaksoon, Maaresaan”; Aasa rukoili: ”Herra, sinä yksin voit auttaa taistelussa voimallisen ja voimattoman välillä”, ja ajoi hajotetun joukon takaa Gerariin. Maresasta oli kotoisin profeetta Elieser, joka kertoi Josafatille, että hänen laivansa eivät purjehtisi, koska tämä oli liittoutunut Ahasjan kanssa."
    - "Pakkosiirtolaisuuden jälkeen edomilaiset asettuivat alangolle, ja Maresasta, nyt Marisasta, tuli Idumean pääkaupunki, jossa oli sidonilaisten kauppiaiden siirtokunta, jonka vuonna 1902 löydetyt maalatut haudat esittävät metsästyskohtauksia ja eläimiä; vuoden 259 eaa. Zenonin papyrukset kertovat ptolemaiolaisten asiamiesten käyneen siellä kauppaa. Johannes Hyrkanos valtasi sen 100-luvun eaa. lopulla ja teki idumealaisista juutalaisia, heidän joukossaan Herodeksen esi-isät; parthialaiset tuhosivat sen vuonna 40 eaa., ja Eusebios näki vain rauniot kahden mailin päässä Eleutheropoliksesta. Kummun alla ja ympärillä on satoja kallioon hakattuja luolia: öljypuristamoita, kyyhkysten kolumbaarioita, vesisäiliöitä ja Beit Guvrinin suuret kellonmuotoiset louhokset."
    - "Bliss ja Macalister kaivoivat hellenistisen kaupungin vuosina 1898–1900, ja Amos Klonerin työ 1980-luvulta lähtien puhdisti luolat; Beit Guvrin–Maresha -kansallispuisto, jossa ovat sidonilaisten hauta ja kellonmuotoiset luolat, merkittiin UNESCOn maailmanperintöluetteloon vuonna 2014."
  vi:
    - "Ma-rê-sa là Tel Maresha, gò Tell Sandahanna ở Sê-phê-la, vùng đất thấp của Giu-đa, cách Beit Guvrin khoảng 2 km về phía nam và cách Giê-ru-sa-lem khoảng 38 km về phía tây nam, trên đường từ bờ biển đến Hếp-rôn. Giô-suê liệt kê nó trong các thành vùng đất thấp cùng Kê-i-la và Ạc-xíp, và các gia phả Giu-đa cho nó một người sáng lập, La-ê-đa, và kể “những con trai của Ma-rê-sa, là tổ phụ của Hếp-rôn” trong dòng Ca-lép. Rô-bô-am củng cố nó cùng Gát và Xíp, và Mi-chê chơi chữ với tên nó, “kẻ thừa kế”: “Hỡi dân cư Ma-rê-sa, ta sẽ đem một kẻ hưởng nghiệp ngươi đến cho ngươi”."
    - "Tại đây A-sa gặp “Xê-rách, người Ê-thi-ô-bi kéo đạo binh một trăm vạn người, và ba trăm cỗ xe”, và hai đạo quân “dàn trận tại trong trũng Xê-pha-ta, gần Ma-rê-sa”; A-sa cầu nguyện rằng “Trừ ra Chúa chẳng có ai giúp đỡ người yếu thắng được người mạnh”, và đuổi đạo quân tan vỡ đến Ghê-ra. Từ Ma-rê-sa có nhà tiên tri Ê-li-ê-xe, người nói với Giô-sa-phát rằng tàu của ông sẽ không đi được vì ông kết giao với A-cha-xia."
    - "Sau thời lưu đày, người Ê-đôm định cư vùng đất thấp, và Ma-rê-sa, nay là Marisa, trở thành thành chính của Y-đu-mê, với một khu thương nhân Si-đôn có những ngôi mộ vẽ tranh, tìm thấy năm 1902, cho thấy cảnh săn bắn và thú vật; các giấy cói Zenon năm 259 TCN ghi các đại diện Ptolemy buôn bán ở đó. John Hyrcanus chiếm nó cuối thế kỷ 2 TCN và biến người Y-đu-mê thành người Do Thái, trong đó có tổ tiên của Hê-rốt; người Parthia phá hủy nó năm 40 TCN, và Eusebius chỉ thấy tàn tích cách Eleutheropolis hai dặm. Dưới gò và quanh đó có hàng trăm hang đục trong đá: máy ép ô-liu, chuồng bồ câu, bể chứa nước và những mỏ đá hình chuông lớn của Beit Guvrin."
    - "Bliss và Macalister khai quật thị trấn Hy Lạp hóa năm 1898–1900, và công việc của Amos Kloner từ thập niên 1980 dọn sạch các hang; vườn quốc gia Beit Guvrin–Maresha, với ngôi mộ Si-đôn và các hang hình chuông, được UNESCO ghi danh năm 2014."
  ro:
    - "Mareșa este Tel Maresha, movila Tell Sandahanna din Șefela, câmpia joasă a lui Iuda, la circa 2 km sud de Beit Guvrin și la circa 38 km sud-vest de Ierusalim, pe drumul de la coastă la Hebron. Iosua o înșiră printre cetățile câmpiei, cu Cheila și Aczib, iar genealogiile lui Iuda îi dau un întemeietor, Laeda, și numără „fiii lui Marisa tatăl lui Hevron” în linia lui Caleb. Roboam a fortificat-o împreună cu Gat și Zif, iar Mica face un joc de cuvinte cu numele ei, „moștenitor”: voi aduce un moștenitor la tine, locuitor al Mareșei."
    - "Aici l-a întâmpinat Asa pe „Zare Etiopul cu oaste de o mie de mii și cu trei sute de care”, iar Asa „a rânduit răsboiul în valea despre miazănoapte la Marisa”; Asa s-a rugat: „nu este cu neputință ție a mântuì cu mulți sau cu puțini”, și a urmărit oastea sfărâmată până la Gherar. Din Mareșa venea proorocul Eliezer, care i-a spus lui Iosafat că corăbiile lui nu vor naviga fiindcă se unise cu Ahazia."
    - "După exil, edomiții s-au așezat în câmpie, iar Mareșa, acum Marisa, a devenit orașul principal al Idumeei, cu o colonie de negustori sidonieni ale căror morminte pictate, găsite în 1902, arată scene de vânătoare și animale; papirusurile lui Zenon din 259 î.Hr. consemnează agenți ptolemeici care făceau comerț acolo. Ioan Hircan a luat-o spre sfârșitul secolului al II-lea î.Hr. și i-a făcut iudei pe idumeeni, printre ei strămoșii lui Irod; parții au distrus-o în 40 î.Hr., iar Eusebiu a văzut doar ruine la două mile de Eleuteropolis. Sub movilă și în jurul ei se află sute de peșteri tăiate în stâncă: prese de ulei, columbarii pentru porumbei, cisterne și marile cariere în formă de clopot din Beit Guvrin."
    - "Bliss și Macalister au excavat orașul elenistic în 1898–1900, iar lucrările lui Amos Kloner din anii 1980 au curățat peșterile; parcul național Beit Guvrin–Maresha, cu mormântul sidonian și peșterile-clopot, a fost înscris de UNESCO în 2014."
  bg:
    - "Мареша е Тел Мареша — хълмът Тел Сандахана в Шефела, низината на Юда, на около 2 км южно от Бейт Гуврин и на около 38 км югозападно от Йерусалим, на пътя от брега към Хеврон. Иисус Навин я изброява сред градовете на низината заедно с Кеила и Ахзив, а родословията на Юда ѝ дават основател, Лаеда, и броят „синът на Мариса отеца на Хеврона“ към рода на Халев. Ровоам я укрепи заедно с Гет и Зиф, а Миха играе с името ѝ, „наследник“: „Ще ти доведа още наследник, жителко на Мариса“."
    - "Тук Аса срещна „Зара Етиопянинът с воинство сто тми и с триста колесници“ и войските „се опълчиха на бой в дола Сефата, при Мариса“; Аса се помоли: „Господи, не е нищо пред тебе да помагаш на тези които са мнозина или на тези които нямат никаква сила“, и преследва разбитата войска до Герар. От Мареша беше пророк Елиезер, който каза на Йосафат, че корабите му няма да отплават, понеже се беше съюзил с Охозия."
    - "След изгнанието едомци заселват низината и Мареша, вече Мариса, става главният град на Идумея, с колония от сидонски търговци, чиито изрисувани гробници, открити през 1902 г., показват ловни сцени и животни; папирусите на Зенон от 259 г. пр.н.е. отбелязват птолемейски агенти, търгуващи там. Йоан Хиркан я превзема в края на II в. пр.н.е. и прави идумейците юдеи, сред тях и предците на Ирод; партите я разрушават през 40 г. пр.н.е., а Евсевий вижда само развалини на две мили от Елевтерополис. Под хълма и около него има стотици изсечени в скалата пещери: маслобойни, колумбарии за гълъби, цистерни и големите камбановидни кариери на Бейт Гуврин."
    - "Блис и Макалистър разкопават елинистическия град през 1898–1900 г., а работата на Амос Клонер от 1980-те години насам разчиства пещерите; националният парк Бейт Гуврин–Мареша, със сидонската гробница и камбановидните пещери, е вписан от ЮНЕСКО през 2014 г."
