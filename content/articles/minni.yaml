body:
  en:
    - "Minni is the kingdom of the Mannaeans, a people of the mountains east and south of Lake Urmia in north-western Iran, known to the Assyrians as Mannaya. Its name and its ruler Udaki first appear in an inscription of the thirtieth year of Shalmaneser III, 828 BC. Its fortified capital, Izirtu, is not located for certain: it is placed near modern Saqqez or at Qalaichi near Bukan, where an Aramaic stele of about 700 BC names a place Ztr, which André Lemaire took to be Izirtu."
    - "Jeremiah's oracle against Babylon calls up its northern enemies: “call together against her the kingdoms of Ararat, Minni, and Ashchenaz”. Ararat is Urartu and Ashchenaz is usually taken as the Scythians, so Minni stands between them in the same mountain world. The Russian Synodal Bible reads “Median” here instead."
    - "From about 800 BC Mannaea lay between Urartu and Assyria and was fought over by both. Sargon II took Izirtu in 716 BC, and the Mannaeans rose against Esarhaddon. At the end they stood with Assyria: the Babylonian chronicle of the fall of Nineveh records that in his tenth year, 616 BC, Nabopolassar “captured the Manneans, who had come to the Assyrians' aid”. Soon after, Mannaea passed under the Medes."
  ru:
    - "Маннея — царство маннеев, народа гор к востоку и югу от озера Урмия на северо-западе Ирана; ассирийцы звали его Маннайя. Имя страны и её правителя Удаки впервые появляется в надписи тридцатого года Салманасара III, 828 г. до н. э. Где была укреплённая столица Изирту, точно не известно: её помещают близ нынешнего Секкеза или в Калайчи близ Букана, где найдена арамейская стела ок. 700 г. до н. э. с названием места Ztr, в котором Андре Лемер видел Изирту."
    - "Иеремия в пророчестве против Вавилона созывает его северных врагов; в еврейском и английском тексте названы царства Арарат, Минни и Аскеназ. Арарат — это Урарту, Аскеназ обычно понимают как скифов, так что Минни (Маннея) стоит между ними в том же горном мире. В Синодальном переводе здесь иначе: «созовите на него царства Араратские, Мидийские и Аскеназские»."
    - "Примерно с 800 г. до н. э. Маннея лежала между Урарту и Ассирией, и за неё боролись обе. Саргон II взял Изирту в 716 г. до н. э., а маннеи восставали против Асархаддона. В конце они стояли на стороне Ассирии: вавилонская хроника падения Ниневии сообщает, что в десятый год, 616 г. до н. э., Набопаласар «захватил маннеев, пришедших на помощь ассирийцам». Вскоре после этого Маннея перешла под власть мидян."
  uk:
    - "Маннея — царство маннеїв, народу гір на схід і південь від озера Урмія на північному заході Ірану, відомого ассирійцям як Маннайя. Її назва та її правитель Удакі вперше з'являються в написі тридцятого року Салманассара III, 828 р. до н. е. Її укріплена столиця Ізірту не локалізована напевно: її розміщують поблизу сучасного Саккеза або в Калайчі біля Букана, де арамейська стела близько 700 р. до н. е. називає місце Ztr, яке Андре Лемер вважав Ізірту."
    - "Пророцтво Єремії проти Вавилона скликає його північних ворогів: «поскликайте на його царства: Арарацькі, Минїйські, Аскеназькі». Арарат — це Урарту, а Аскеназ зазвичай розуміють як скіфів, тож Маннея стоїть між ними в тому самому гірському світі. Російська Синодальна Біблія читає тут натомість «мідійський»."
    - "Приблизно від 800 р. до н. е. Маннея лежала між Урарту й Ассирією, і обидві боролися за неї. Саргон II узяв Ізірту 716 р. до н. е., а маннеї повстали проти Асархаддона. Наприкінці вони стали на бік Ассирії: вавилонська хроніка падіння Ніневії записує, що на десятому році свого правління, 616 р. до н. е., Набопаласар «захопив маннеїв, які прийшли на допомогу ассирійцям». Невдовзі Маннея перейшла під владу мідян."
  es:
    - "Mini es el reino de los manneos, un pueblo de las montañas al este y sur del lago Urmía, en el noroeste de Irán, conocido por los asirios como Mannaya. Su nombre y el de su gobernante Udaki aparecen por primera vez en una inscripción del año treinta de Salmanasar III, 828 a. C. Su capital fortificada, Izirtu, no está localizada con certeza: se la sitúa cerca de la actual Saqqez o en Qalaichi, cerca de Bukan, donde una estela aramea de hacia 700 a. C. nombra un lugar Ztr, que André Lemaire tomó por Izirtu."
    - "El oráculo de Jeremías contra Babilonia convoca a sus enemigos del norte: «juntad contra ella los reinos de Ararat, de Minni, y de Aschênaz». Ararat es Urartu y Askenaz suele tomarse por los escitas, de modo que Mini se halla entre ellos en el mismo mundo montañoso. La Biblia sinodal rusa lee aquí «medo» en lugar de ese nombre."
    - "Desde alrededor de 800 a. C. Mannea estuvo entre Urartu y Asiria y ambas se la disputaron. Sargón II tomó Izirtu en 716 a. C., y los manneos se alzaron contra Esar-hadón. Al final se pusieron del lado de Asiria: la crónica babilonia de la caída de Nínive registra que en su año décimo, 616 a. C., Nabopolasar «capturó a los manneos, que habían acudido en auxilio de los asirios». Poco después Mannea pasó a los medos."
  de:
    - "Minni ist das Königreich der Mannäer, eines Bergvolkes östlich und südlich des Urmiasees im Nordwesten Irans, den Assyrern als Mannaja bekannt. Sein Name und sein Herrscher Udaki erscheinen erstmals in einer Inschrift aus dem dreißigsten Jahr Salmanassars III., 828 v. Chr. Seine befestigte Hauptstadt Izirtu ist nicht sicher lokalisiert: Sie wird nahe dem heutigen Saqqez oder in Qalaichi bei Bukan angesetzt, wo eine aramäische Stele von etwa 700 v. Chr. einen Ort Ztr nennt, den André Lemaire für Izirtu hielt."
    - "Jeremias Spruch gegen Babel ruft dessen Feinde aus dem Norden herbei: „rufet wider sie die Königreiche Ararat, Minni und Askenas“. Ararat ist Urartu, und Aschkenas wird gewöhnlich als die Skythen gedeutet, Minni steht also zwischen ihnen in derselben Bergwelt. Die russische Synodalbibel liest hier stattdessen medisch."
    - "Von etwa 800 v. Chr. an lag Mannäa zwischen Urartu und Assyrien und wurde von beiden umkämpft. Sargon II. nahm 716 v. Chr. Izirtu ein, und die Mannäer erhoben sich gegen Asarhaddon. Am Ende standen sie auf der Seite Assyriens: Die babylonische Chronik vom Fall Ninives verzeichnet, dass Nabopolassar in seinem zehnten Jahr, 616 v. Chr., „die Mannäer eroberte, die den Assyrern zu Hilfe gekommen waren“. Bald danach kam Mannäa unter die Meder."
  fr:
    - "Minni est le royaume des Mannéens, peuple des montagnes à l’est et au sud du lac d’Ourmia, dans le nord-ouest de l’Iran, connu des Assyriens sous le nom de Mannaya. Son nom et son souverain Udaki apparaissent pour la première fois dans une inscription de la trentième année de Salmanasar III, en 828 av. J.-C. Sa capitale fortifiée, Izirtu, n’est pas localisée avec certitude : on la place près de l’actuelle Saqqez ou à Qalaichi, près de Bukan, où une stèle araméenne d’environ 700 av. J.-C. nomme un lieu Ztr, qu’André Lemaire a pris pour Izirtu."
    - "L’oracle de Jérémie contre Babylone appelle ses ennemis du nord : « Appelez contre elle les royaumes d’Ararat, de Minni et d’Aschkenaz ». Ararat est l’Urartu et Aschkenaz est d’ordinaire tenu pour les Scythes, si bien que Minni se tient entre eux, dans le même monde de montagnes. La Bible synodale russe lit ici « mède » à la place."
    - "À partir d’environ 800 av. J.-C., la Mannée se trouva entre l’Urartu et l’Assyrie et fut disputée par les deux. Sargon II prit Izirtu en 716 av. J.-C., et les Mannéens se soulevèrent contre Esar-Haddon. À la fin, ils se tinrent aux côtés de l’Assyrie : la chronique babylonienne de la chute de Ninive rapporte que, la dixième année de son règne, en 616 av. J.-C., Nabopolassar « prit les Mannéens, venus au secours des Assyriens ». Peu après, la Mannée passa sous les Mèdes."
  pt:
    - "Mini é o reino dos manneus, um povo das montanhas a leste e ao sul do lago Urmia, no noroeste do Irã, conhecido dos assírios como Mannaya. Seu nome e seu governante Udaki aparecem pela primeira vez numa inscrição do trigésimo ano de Salmaneser III, 828 a.C. Sua capital fortificada, Izirtu, não está localizada com certeza: é situada perto da atual Saqqez ou em Qalaichi, perto de Bukan, onde uma estela aramaica de cerca de 700 a.C. menciona um lugar Ztr, que André Lemaire tomou por Izirtu."
    - "O oráculo de Jeremias contra a Babilônia convoca seus inimigos do norte: “Convoquem contra ela os reinos de Ararate, Mini e Asquenaz!” Ararate é Urartu e Asquenaz costuma ser tomada pelos citas, de modo que Mini fica entre eles, no mesmo mundo montanhoso. A Bíblia sinodal russa traz aqui medo em vez de Mini."
    - "A partir de cerca de 800 a.C., a Manneia ficava entre Urartu e a Assíria e foi disputada por ambas. Sargão II tomou Izirtu em 716 a.C., e os manneus se rebelaram contra Esar-Hadom. No fim ficaram ao lado da Assíria: a crônica babilônica da queda de Nínive registra que, em seu décimo ano, 616 a.C., Nabopolassar “capturou os manneus, que tinham vindo em auxílio dos assírios”. Pouco depois, a Manneia passou aos medos."
  it:
    - "Minni è il regno dei Mannei, un popolo delle montagne a est e a sud del lago di Urmia, nell’Iran nord-occidentale, noto agli Assiri come Mannaya. Il suo nome e il suo sovrano Udaki compaiono per la prima volta in un’iscrizione del trentesimo anno di Salmanàssar III, l’828 a.C. La sua capitale fortificata, Izirtu, non è localizzata con certezza: la si colloca presso l’odierna Saqqez o a Qalaichi presso Bukan, dove una stele aramaica del 700 a.C. circa nomina un luogo Ztr, che André Lemaire ritenne essere Izirtu."
    - "L’oracolo di Geremia contro Babilonia chiama a raccolta i suoi nemici del nord: «chiamate a raccolta contro di lei i regni d’Ararat, di Minni e d’Ashkenaz». Ararat è Urartu e Aschenàz è di solito inteso come gli Sciti, così Minni sta tra loro nello stesso mondo di montagne. La Bibbia sinodale russa ha qui invece i regni «medi»."
    - "Dal 800 a.C. circa la Mannea giaceva tra Urartu e l’Assiria ed era contesa da entrambe. Sargon II prese Izirtu nel 716 a.C., e i Mannei si sollevarono contro Assaraddon. Alla fine si schierarono con l’Assiria: la cronaca babilonese della caduta di Ninive registra che nel suo decimo anno, il 616 a.C., Nabopolassar «catturò i Mannei, che erano venuti in aiuto degli Assiri». Poco dopo la Mannea passò sotto i Medi."
  nl:
    - "Minni is het koninkrijk van de Mannaeërs, een bergvolk ten oosten en zuiden van het Urmiameer in het noordwesten van Iran, door de Assyriërs Mannaya genoemd. De naam en hun heerser Udaki verschijnen voor het eerst in een inscriptie uit het dertigste jaar van Salmaneser III, 828 v.Chr. De versterkte hoofdstad Izirtu is niet met zekerheid gelokaliseerd: zij wordt gezocht bij het moderne Saqqez of bij Qalaichi bij Bukan, waar een Aramese stèle van omstreeks 700 v.Chr. een plaats Ztr noemt, die André Lemaire voor Izirtu hield."
    - "Jeremia's godsspraak tegen Babylon roept zijn noordelijke vijanden op: “roept tegen haar bijeen de koninkrijken van Ararat, Minni en Askenaz”. Ararat is Urartu en Askenaz wordt gewoonlijk opgevat als de Scythen, zodat Minni daartussen staat in dezelfde bergwereld. De Russische Synodale Bijbel leest hier in plaats daarvan “Medisch”."
    - "Vanaf omstreeks 800 v.Chr. lag Mannea tussen Urartu en Assyrië en werd door beide bevochten. Sargon II nam Izirtu in 716 v.Chr. in, en de Mannaeërs kwamen tegen Esarhaddon in opstand. Aan het einde stonden zij aan de kant van Assyrië: de Babylonische kroniek van de val van Nineve vermeldt dat Nabopolassar in zijn tiende jaar, 616 v.Chr., “de Mannaeërs, die de Assyriërs te hulp waren gekomen, veroverde”. Kort daarna kwam Mannea onder de Meden."
  pl:
    - "Minni to królestwo Mannejczyków, ludu gór na wschód i południe od jeziora Urmia w północno-zachodnim Iranie, znanego Asyryjczykom jako Mannaja. Jego nazwa i władca Udaki pojawiają się po raz pierwszy w inskrypcji z trzydziestego roku Salmanasara III, 828 p.n.e. Jego warowna stolica, Izirtu, nie jest zlokalizowana z pewnością: umieszcza się ją w pobliżu dzisiejszego Saqqez lub w Qalaichi koło Bukan, gdzie aramejska stela z około 700 p.n.e. wymienia miejsce Ztr, które André Lemaire uznał za Izirtu."
    - "Wyrocznia Jeremiasza przeciw Babilonowi przywołuje jego północnych wrogów: „zwołajcie przeciwko niemu królestwa Ararad, Minny, i Aschenas”. Ararat to Urartu, a Aszkenaz uważa się zwykle za Scytów, więc Minni stoi między nimi w tym samym górskim świecie. Rosyjska Biblia synodalna czyta tu zamiast tego „medyjski”."
    - "Od około 800 p.n.e. Mannea leżała między Urartu a Asyrią i była przedmiotem walk obu. Sargon II zdobył Izirtu w 716 p.n.e., a Mannejczycy powstali przeciw Asarhaddonowi. W końcu stanęli po stronie Asyrii: babilońska kronika upadku Niniwy zapisuje, że w dziesiątym roku, 616 p.n.e., Nabopolasar „zdobył Mannejczyków, którzy przybyli z pomocą Asyryjczykom”. Wkrótce potem Mannea przeszła pod władzę Medów."
  cs:
    - "Mini je království Mannajců, lidu hor východně a jižně od Urmijského jezera v severozápadním Íránu, Asyřanům známého jako Mannaja. Jeho jméno a jeho vládce Udaki se poprvé objevují v nápisu z třicátého roku Salmanasara III., 828 př. n. l. Jeho opevněné hlavní město Izirtu není s jistotou určeno: klade se poblíž dnešního Saqqezu nebo do Qalaichi u Bukanu, kde aramejská stéla z doby asi 700 př. n. l. jmenuje místo Ztr, které André Lemaire pokládal za Izirtu."
    - "Jeremjášovo proroctví proti Babylonu svolává jeho severní nepřátele: „svolejte proti němu království Ararat, Minni, Ascenez“. Ararat je Urartu a Aškenaz se obvykle pokládá za Skythy, takže Mini stojí mezi nimi ve stejném horském světě. Ruská synodální Bible zde čte místo toho „médské“."
    - "Od doby kolem roku 800 př. n. l. ležela Mannaja mezi Urartu a Asýrií a obě o ni bojovaly. Sargon II. dobyl Izirtu roku 716 př. n. l. a Mannajci povstali proti Asarhadónovi. Nakonec stáli při Asýrii: babylonská kronika o pádu Ninive zaznamenává, že Nabopolasar v desátém roce své vlády, 616 př. n. l., „zajal Mannajce, kteří přišli Asyřanům na pomoc“. Brzy poté přešla Mannaja pod Médy."
  sv:
    - "Minni är mannaiernas kungarike, ett folk i bergen öster och söder om Urmiasjön i nordvästra Iran, känt av assyrierna som Mannaya. Dess namn och dess härskare Udaki förekommer först i en inskrift från Salmanassar III:s trettionde år, 828 f.Kr. Dess befästa huvudstad, Izirtu, är inte säkert lokaliserad: den förläggs nära dagens Saqqez eller vid Qalaichi nära Bukan, där en arameisk stele från omkring 700 f.Kr. nämner en plats Ztr, som André Lemaire höll för Izirtu."
    - "Jeremias utsaga mot Babylon kallar upp dess nordliga fiender: ”båden upp mot det riken, både Ararats, Minnis och Askenas'”. Ararat är Urartu och Askenas tas vanligen för skyterna, så Minni står mellan dem i samma bergsvärld. Den ryska Synodalbibeln läser här ”mediskt” i stället."
    - "Från omkring 800 f.Kr. låg Mannaia mellan Urartu och Assyrien och stred man om det från båda håll. Sargon II intog Izirtu 716 f.Kr., och mannaierna reste sig mot Esarhaddon. Till slut stod de med Assyrien: den babyloniska krönikan om Nineves fall upptecknar att Nabopolassar i sitt tionde år, 616 f.Kr., ”intog mannaierna, som hade kommit assyrierna till hjälp”. Strax därefter kom Mannaia under mederna."
  nb:
    - "Minni er mannaernes kongedømme, et fjellfolk øst og sør for Urmia-sjøen i nordvestlige Iran, kjent for assyrerne som Mannaya. Navnet og herskeren Udaki dukker først opp i en innskrift fra Salmanassar IIIs trettiende regjeringsår, 828 f.Kr. Hovedstaden Izirtu, en befestet by, er ikke lokalisert med sikkerhet: den plasseres nær moderne Saqqez eller ved Qalaichi nær Bukan, der en arameisk stele fra omkring 700 f.Kr. nevner et sted Ztr, som André Lemaire tok for å være Izirtu."
    - "Jeremias orakel mot Babylon kaller opp dets nordlige fiender: «kall sammen mot det Ararats, Minnis og Askenas' riker». Ararat er Urartu, og Askenas regnes vanligvis for skyterne, så Minni står mellom dem i den samme fjellverdenen. Den russiske synodalbibelen leser «mederen» her i stedet."
    - "Fra omkring 800 f.Kr. lå Mannaea mellom Urartu og Assyria og ble kjempet om av begge. Sargon II tok Izirtu i 716 f.Kr., og mannaerne reiste seg mot Asarhaddon. Til slutt sto de med Assyria: den babylonske krøniken om Ninives fall forteller at Nabopolassar i sitt tiende år, 616 f.Kr., «tok mannaerne til fange, som var kommet assyrerne til hjelp». Kort etter kom Mannaea under mederne."
  tl:
    - "Ang Minni ay kaharian ng mga Mannaeo, isang bayan ng mga bundok sa silangan at timog ng Lawa ng Urmia sa hilagang-kanlurang Iran, na kilala ng mga Asirio bilang Mannaya. Ang pangalan nito at ang pinuno nitong si Udaki ay unang lumilitaw sa isang inskripsiyon ng ika-30 taon ni Salmanasar III, 828 BK. Hindi tiyak ang kinaroroonan ng kutang kabisera nitong Izirtu: inilalagay ito malapit sa makabagong Saqqez o sa Qalaichi malapit sa Bukan, kung saan ang isang estelang Aramaiko noong mga 700 BK ay nagpapangalan ng isang lugar na Ztr, na itinuring ni André Lemaire na Izirtu."
    - "Tinatawag ng orakulo ni Jeremias laban sa Babilonia ang mga kaaway nito sa hilaga: “pisanin laban sa kaniya ang mga kaharian ng Ararat, ng Minmi, at ng Aschenaz”. Ang Ararat ay Urartu at ang Aschenaz ay karaniwang itinuturing na mga Eskita, kaya ang Minni ay nasa pagitan nila sa iisang daigdig ng bundok. Binabasa ng Synodal Bible ng Ruso dito ang “Medo” sa halip."
    - "Mula mga 800 BK, nasa pagitan ng Urartu at Asiria ang Mannaea at pinaglabanan ng dalawa. Sinakop ni Sargon II ang Izirtu noong 716 BK, at nag-alsa ang mga Mannaeo laban kay Esar-hadon. Sa dulo ay kinampihan nila ang Asiria: itinatala ng kronikang Babilonyo ng pagbagsak ng Ninive na sa kaniyang ika-10 taon, 616 BK, si Nabopolassar ay “bumihag sa mga Mannaeo, na dumating upang tulungan ang mga Asirio”. Hindi nagtagal, napasailalim ng mga Medo ang Mannaea."
scripture:
  - Jer.51.27
