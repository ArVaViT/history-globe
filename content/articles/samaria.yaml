body:
  en:
    - "Samaria stands on a lone hill in the central highlands, about 10 km northwest of Shechem, above the road from the hills to the coastal plain. In the Bible, Omri, king of Israel, bought the hill from Shemer for two talents of silver and about 880 BC built a city on it, calling it Samaria after Shemer, the owner of the hill; it replaced Tirzah as the capital of the northern kingdom. Assyrian inscriptions afterwards called Israel the house of Omri."
    - "Omri and Ahab built a royal acropolis of finely dressed stone. In the palace area excavators found carved ivory inlays of the ninth and eighth centuries BC, recalling the ivory house of Ahab and the luxury denounced by Amos, and the Samaria ostraca, eighth-century notes of deliveries of wine and oil. The Assyrians besieged the city for three years; it fell in 722 BC, and Sargon II claims to have deported its people and settled others in their place. Samaria became the seat of an Assyrian province."
    - "Under the Persians it remained a seat of governors: Sanballat opposed Nehemiah, and an Elephantine papyrus of 407 BC names him governor of Samaria. After the Samaritans burned alive Andromachus, Alexander's governor of Syria, Alexander came to avenge him and the culprits were handed over; Samaria then became a Macedonian settlement, fortified with round towers. John Hyrcanus took it after a long siege and razed it in about 108 BC; Pompey gave it back to its people in 63 BC and Gabinius rebuilt it."
    - "Augustus gave Samaria to Herod the Great in 30 BC. Herod rebuilt it with a temple of Augustus and new walls and renamed it Sebaste, from the Greek for Augustus. Acts tells of Philip preaching the gospel in Samaria, the land that took its name from the city. About AD 200 Septimius Severus made Sebaste a Roman colony. By the late fourth century Christians venerated the tomb of John the Baptist there, and Paula prayed there on her pilgrimage."
  ru:
    - "Самария стоит на отдельном холме в центральном нагорье, примерно в 10 км к северо-западу от Сихема, над дорогой с гор к приморской равнине. По Библии, израильский царь Амврий купил эту гору у Семира за два таланта серебра и около 880 г. до н. э. построил на ней город, назвав его Самарией по имени Семира, владельца горы; Самария сменила Фирцу как столица Северного царства. Ассирийские надписи и позже называли Израиль домом Амврия."
    - "Амврий и Ахав построили на вершине царский акрополь из тщательно отёсанного камня. В дворцовом квартале археологи нашли резные инкрустации из слоновой кости IX–VIII веков до н. э., напоминающие о доме из слоновой кости Ахава и о роскоши, которую обличал Амос, а также самарийские остраки, записи VIII века о поставках вина и масла. Ассирийцы осаждали город три года; в 722 г. до н. э. он пал, и Саргон II пишет, что угнал его жителей и поселил на их место других. Самария стала центром ассирийской провинции."
    - "При персах здесь по-прежнему сидели наместники: Санаваллат противился Неемии, а папирус с Элефантины 407 г. до н. э. называет его правителем Самарии. Когда самаряне заживо сожгли Андромаха, поставленного Александром над Сирией, Александр пришёл отомстить за него, и виновных выдали ему; после этого Самария стала македонским поселением с круглыми башнями. Иоанн Гиркан после долгой осады взял его и около 108 г. до н. э. сровнял с землёй; Помпей в 63 г. до н. э. вернул город жителям, и Габиний отстроил его."
    - "В 30 г. до н. э. Август отдал Самарию Ироду Великому. Ирод перестроил её, возвёл храм Августа и новые стены и назвал город Севастией, от греческого имени Августа. Книга Деяний рассказывает, как Филипп проповедовал в Самарии, земле, получившей имя от города. Около 200 г. н. э. Септимий Север сделал Севастию римской колонией. К концу IV века христиане почитали здесь гробницу Иоанна Крестителя, и Павла молилась у неё во время своего паломничества."
  uk:
    - "Самарія стоїть на самотньому пагорбі в центральному нагір'ї, приблизно за 10 км на північний захід від Сихема, над дорогою з гір до прибережної рівнини. За Біблією, Омрі, цар Ізраїля, купив пагорб у Шемера за два таланти срібла і близько 880 р. до н. е. збудував на ньому місто, назвавши його Самарією за ім'ям Шемера, власника пагорба; воно замінило Тірцу як столицю Північного царства. Ассирійські написи згодом називали Ізраїль домом Омрі."
    - "Омрі й Ахав збудували царський акрополь із тонко обтесаного каменю. У палацовій частині розкопувачі знайшли різьблені інкрустації зі слонової кістки IX–VIII ст. до н. е., що нагадують дім зі слонової кістки Ахава й розкіш, яку картав Амос, та Самарійські остракони, записки VIII ст. про постачання вина й олії. Ассирійці облягали місто три роки; воно впало в 722 р. до н. е., і Саргон II заявляє, що вивів його народ і оселив інших на його місці. Самарія стала осідком ассирійської провінції."
    - "Під персами вона лишалася осідком намісників: Санаваллат протистояв Неемії, і елефантинський папірус 407 р. до н. е. називає його намісником Самарії. Після того, як самаряни живцем спалили Андромаха, намісника Сирії при Александрі, Александр прийшов помститися за нього, і винних видали; тоді Самарія стала македонським поселенням, укріпленим круглими баштами. Іоанн Гіркан узяв її після довгої облоги й зруйнував близько 108 р. до н. е.; Помпей повернув її народові в 63 р. до н. е., а Габіній відбудував."
    - "Август віддав Самарію Іродові Великому в 30 р. до н. е. Ірод перебудував її, спорудивши храм Августа й нові мури, і перейменував на Севасту, від грецького слова, що означає Август. Діяння розповідають, як Пилип проповідував Євангелію в Самарії, краю, що узяв назву від міста. Близько 200 р. н. е. Септимій Север зробив Севасту римською колонією. Наприкінці IV ст. християни шанували там гробницю Івана Христителя, і Паула молилася там під час свого паломництва."
  es:
    - "Samaria se alza sobre una colina aislada en la región montañosa central, a unos 10 km al noroeste de Siquem, sobre el camino que va de las colinas a la llanura costera. Según la Biblia, Omri, rey de Israel, compró la colina a Semer por dos talentos de plata y hacia 880 a. C. edificó en ella una ciudad, llamándola Samaria por Semer, el dueño de la colina; reemplazó a Tirsa como capital del reino del norte. Las inscripciones asirias llamaron después a Israel la casa de Omri."
    - "Omri y Acab construyeron una acrópolis real de piedra finamente labrada. En la zona del palacio los excavadores hallaron incrustaciones de marfil tallado de los siglos IX y VIII a. C., que recuerdan la casa de marfil de Acab y el lujo denunciado por Amós, y los óstraca de Samaria, notas del siglo VIII sobre entregas de vino y aceite. Los asirios sitiaron la ciudad durante tres años; cayó en 722 a. C., y Sargón II afirma haber deportado a su gente y asentado a otros en su lugar. Samaria se convirtió en sede de una provincia asiria."
    - "Bajo los persas siguió siendo sede de gobernadores: Sanbalat se opuso a Nehemías, y un papiro de Elefantina de 407 a. C. lo nombra gobernador de Samaria. Después de que los samaritanos quemaran vivo a Andrómaco, gobernador de Siria de Alejandro, Alejandro vino a vengarlo y le fueron entregados los culpables; Samaria se convirtió entonces en un asentamiento macedonio, fortificado con torres redondas. Juan Hircano la tomó tras un largo asedio y la arrasó hacia 108 a. C.; Pompeyo se la devolvió a su pueblo en 63 a. C. y Gabinio la reconstruyó."
    - "Augusto dio Samaria a Herodes el Grande en 30 a. C. Herodes la reconstruyó con un templo de Augusto y nuevas murallas y la rebautizó Sebaste, del griego para Augusto. Los Hechos cuentan que Felipe predicó el evangelio en Samaria, la región que tomó su nombre de la ciudad. Hacia el 200 d. C. Septimio Severo hizo de Sebaste una colonia romana. A finales del siglo IV los cristianos veneraban allí la tumba de Juan el Bautista, y Paula oró allí durante su peregrinación."
  pt:
    - "Samaria fica numa colina isolada nas terras altas centrais, a cerca de 10 km a noroeste de Siquém, acima da estrada que leva das colinas à planície costeira. Na Bíblia, Onri, rei de Israel, comprou a colina de Semer por dois talentos de prata e por volta de 880 a.C. construiu nela uma cidade, chamando-a Samaria em honra de Semer, o dono da colina; ela substituiu Tirza como capital do reino do norte. Inscrições assírias passaram a chamar Israel de casa de Onri."
    - "Onri e Acabe construíram uma acrópole real de pedra finamente lavrada. Na área do palácio os escavadores encontraram embutidos de marfim entalhado dos séculos IX e VIII a.C., que lembram a casa de marfim de Acabe e o luxo denunciado por Amós, e os óstracos de Samaria, notas do século VIII sobre entregas de vinho e óleo. Os assírios sitiaram a cidade por três anos; caiu em 722 a.C., e Sargão II afirma ter deportado seu povo e instalado outros em seu lugar. Samaria tornou-se sede de uma província assíria."
    - "Sob os persas continuou sede de governadores: Sambalá se opôs a Neemias, e um papiro de Elefantina de 407 a.C. o nomeia governador de Samaria. Depois que os samaritanos queimaram vivo Andrômaco, governador da Síria de Alexandre, este veio vingá-lo e os culpados lhe foram entregues; Samaria tornou-se então um assentamento macedônio, fortificado com torres redondas. João Hircano a tomou depois de longo cerco e a arrasou por volta de 108 a.C.; Pompeu a devolveu a seu povo em 63 a.C. e Gabínio a reconstruiu."
    - "Augusto deu Samaria a Herodes, o Grande, em 30 a.C. Herodes a reconstruiu com um templo de Augusto e novas muralhas e a rebatizou Sebaste, do grego para Augusto. Atos conta que Filipe pregou o evangelho em Samaria, a terra que tomou o nome da cidade. Por volta de 200 d.C., Septímio Severo fez de Sebaste uma colônia romana. No fim do século IV os cristãos veneravam ali o túmulo de João Batista, e Paula orou ali em sua peregrinação."
  de:
    - "Samaria liegt auf einem einzelnen Hügel im zentralen Bergland, etwa 10 km nordwestlich von Sichem, über der Straße vom Bergland zur Küstenebene. In der Bibel kaufte Omri, der König von Israel, den Hügel von Schemer für zwei Talente Silber und baute um 880 v. Chr. eine Stadt darauf, die er nach Schemer, dem Besitzer des Hügels, Samaria nannte; sie löste Tirza als Hauptstadt des Nordreichs ab. Assyrische Inschriften nannten Israel danach das Haus Omris."
    - "Omri und Ahab bauten eine königliche Akropolis aus fein behauenem Stein. Im Palastbereich fanden die Ausgräber geschnitzte Elfenbeineinlagen des 9. und 8. Jahrhunderts v. Chr., die an das Elfenbeinhaus Ahabs und den von Amos gegeißelten Luxus erinnern, sowie die Samaria-Ostraka, Notizen des 8. Jahrhunderts über Lieferungen von Wein und Öl. Die Assyrer belagerten die Stadt drei Jahre; sie fiel 722 v. Chr., und Sargon II. behauptet, ihre Bewohner deportiert und andere an ihrer Stelle angesiedelt zu haben. Samaria wurde Sitz einer assyrischen Provinz."
    - "Unter den Persern blieb es Sitz von Statthaltern: Sanballat widersetzte sich Nehemia, und ein Elephantine-Papyrus von 407 v. Chr. nennt ihn Statthalter von Samaria. Nachdem die Samaritaner Andromachos, Alexanders Statthalter von Syrien, lebendig verbrannt hatten, kam Alexander, ihn zu rächen, und die Schuldigen wurden ausgeliefert; Samaria wurde dann eine makedonische Siedlung, mit runden Türmen befestigt. Johannes Hyrkanos nahm es nach langer Belagerung und schleifte es um 108 v. Chr.; Pompeius gab es 63 v. Chr. seinen Bewohnern zurück, und Gabinius baute es wieder auf."
    - "Augustus gab Samaria 30 v. Chr. an Herodes den Großen. Herodes baute es mit einem Tempel des Augustus und neuen Mauern wieder auf und nannte es Sebaste, vom griechischen Wort für Augustus. Die Apostelgeschichte erzählt von Philippus, der in Samaria das Evangelium predigte, dem Land, das seinen Namen von der Stadt hatte. Um 200 n. Chr. machte Septimius Severus Sebaste zur römischen Kolonie. Im späten 4. Jahrhundert verehrten Christen dort das Grab Johannes des Täufers, und Paula betete dort auf ihrer Pilgerreise."
  fr:
    - "Samarie se dresse sur une colline isolée des hautes terres centrales, à environ 10 km au nord-ouest de Sichem, au-dessus de la route des collines à la plaine côtière. Dans la Bible, Omri, roi d’Israël, acheta la colline à Schémer pour deux talents d’argent et vers 880 av. J.-C. y bâtit une ville, qu’il appela Samarie d’après Schémer, le propriétaire de la colline ; elle remplaça Thirtsa comme capitale du royaume du nord. Les inscriptions assyriennes appelèrent ensuite Israël la maison d’Omri."
    - "Omri et Achab bâtirent une acropole royale en pierre finement taillée. Dans le quartier du palais, les fouilleurs trouvèrent des incrustations d’ivoire sculptées des IXe et VIIIe siècles av. J.-C., qui rappellent la maison d’ivoire d’Achab et le luxe dénoncé par Amos, et les ostraca de Samarie, notes du VIIIe siècle sur des livraisons de vin et d’huile. Les Assyriens assiégèrent la ville trois ans ; elle tomba en 722 av. J.-C., et Sargon II prétend avoir déporté son peuple et installé d’autres à sa place. Samarie devint le siège d’une province assyrienne."
    - "Sous les Perses, elle resta un siège de gouverneurs : Sanballat s’opposa à Néhémie, et un papyrus d’Éléphantine de 407 av. J.-C. le nomme gouverneur de Samarie. Après que les Samaritains eurent brûlé vif Andromaque, gouverneur de Syrie pour Alexandre, Alexandre vint le venger et les coupables furent livrés ; Samarie devint alors une colonie macédonienne, fortifiée de tours rondes. Jean Hyrcan la prit après un long siège et la rasa vers 108 av. J.-C. ; Pompée la rendit à son peuple en 63 av. J.-C. et Gabinius la rebâtit."
    - "Auguste donna Samarie à Hérode le Grand en 30 av. J.-C. Hérode la rebâtit avec un temple d’Auguste et de nouveaux murs et la rebaptisa Sébaste, du grec pour Auguste. Les Actes racontent Philippe prêchant l’Évangile en Samarie, le pays qui tira son nom de la ville. Vers 200 apr. J.-C., Septime Sévère fit de Sébaste une colonie romaine. À la fin du IVe siècle, les chrétiens y vénéraient le tombeau de Jean-Baptiste, et Paula y pria lors de son pèlerinage."
  it:
    - "Samaria sorge su una collina isolata negli altopiani centrali, circa 10 km a nord-ovest di Sichem, sopra la strada dalle colline alla pianura costiera. Nella Bibbia Omri, re d’Israele, comprò la collina da Semer per due talenti d’argento e verso l’880 a.C. vi costruì una città, chiamandola Samaria dal nome di Semer, proprietario della collina; sostituì Tirza come capitale del regno settentrionale. Le iscrizioni assire chiamarono poi Israele la casa di Omri."
    - "Omri e Acab costruirono un’acropoli reale di pietra finemente squadrata. Nell’area del palazzo gli scavatori trovarono intarsi d’avorio scolpiti del IX e VIII secolo a.C., che ricordano la casa d’avorio di Acab e il lusso denunciato da Amos, e gli ostraca di Samaria, note dell’VIII secolo su consegne di vino e olio. Gli Assiri assediarono la città per tre anni; cadde nel 722 a.C., e Sargon II sostiene di averne deportato la popolazione e di avervi insediato altri. Samaria divenne sede di una provincia assira."
    - "Sotto i Persiani rimase sede di governatori: Sanballàt si oppose a Neemia, e un papiro di Elefantina del 407 a.C. lo nomina governatore di Samaria. Dopo che i Samaritani ebbero bruciato vivo Andromaco, governatore di Siria per Alessandro, Alessandro venne a vendicarlo e i colpevoli furono consegnati; Samaria divenne allora un insediamento macedone, fortificato con torri rotonde. Giovanni Ircano la prese dopo un lungo assedio e la rase al suolo verso il 108 a.C.; Pompeo la restituì alla sua gente nel 63 a.C. e Gabinio la ricostruì."
    - "Augusto diede Samaria a Erode il Grande nel 30 a.C. Erode la ricostruì con un tempio di Augusto e nuove mura e la ribattezzò Sebaste, dal greco per Augusto. Gli Atti raccontano di Filippo che predica il vangelo in Samaria, il paese che prese il nome dalla città. Verso il 200 d.C. Settimio Severo fece di Sebaste una colonia romana. Alla fine del IV secolo i cristiani vi veneravano la tomba di Giovanni Battista, e Paola vi pregò durante il suo pellegrinaggio."
  pl:
    - "Samaria stoi na samotnym wzgórzu w środkowych wyżynach, około 10 km na północny zachód od Sychem, nad drogą ze wzgórz na równinę nadmorską. W Biblii Omri, król Izraela, kupił wzgórze od Szemera za dwa talenty srebra i około 880 roku p.n.e. zbudował na nim miasto, nazywając je Samarią od Szemera, właściciela wzgórza; zastąpiło Tirsę jako stolica królestwa północnego. Napisy asyryjskie nazywały później Izrael domem Omriego."
    - "Omri i Achab zbudowali królewski akropol z kunsztownie ciosanego kamienia. W okolicy pałacu odkrywcy znaleźli rzeźbione wstawki z kości słoniowej z IX i VIII wieku p.n.e., przypominające dom z kości słoniowej Achaba i zbytek piętnowany przez Amosa, oraz ostraka samarijskie, notatki z VIII wieku o dostawach wina i oliwy. Asyryjczycy oblegali miasto przez trzy lata; padło w 722 roku p.n.e., a Sargon II twierdzi, że deportował jego ludność i osiedlił w jej miejsce innych. Samaria stała się siedzibą prowincji asyryjskiej."
    - "Pod Persami pozostała siedzibą namiestników: Sanballat sprzeciwiał się Nehemiaszowi, a papirus z Elefantyny z 407 roku p.n.e. wymienia go jako namiestnika Samarii. Gdy Samarytanie spalili żywcem Andromacha, namiestnika Aleksandra w Syrii, Aleksander przybył go pomścić, a winnych wydano; Samaria stała się wtedy osadą macedońską, umocnioną okrągłymi wieżami. Jan Hirkan zdobył ją po długim oblężeniu i zrównał z ziemią około 108 roku p.n.e.; Pompejusz oddał ją jej mieszkańcom w 63 roku p.n.e., a Gabiniusz ją odbudował."
    - "August oddał Samarię Herodowi Wielkiemu w 30 roku p.n.e. Herod odbudował ją ze świątynią Augusta i nowymi murami i przemianował na Sebaste, od greckiego określenia Augusta. Dzieje opowiadają, jak Filip głosił ewangelię w Samarii, kraju, który wziął nazwę od miasta. Około 200 roku n.e. Septymiusz Sewer uczynił Sebaste rzymską kolonią. Pod koniec IV wieku chrześcijanie czcili tam grób Jana Chrzciciela, a Paula modliła się tam podczas swej pielgrzymki."
  cs:
    - "Samaří stojí na osamělém pahorku ve středním pohoří, asi 10 km severozápadně od Šekemu, nad cestou z hor na pobřežní rovinu. Podle Bible koupil izraelský král Omrí pahorek od Šemera za dva talenty stříbra a asi roku 880 př. n. l. na něm vystavěl město, jež nazval Samaří po Šemerovi, majiteli pahorku; nahradilo Tirsu jako hlavní město severního království. Asyrské nápisy později nazývaly Izrael domem Omríovým."
    - "Omrí a Achab vystavěli královskou akropoli z jemně opracovaného kamene. V oblasti paláce nalezli vykopávky vyřezávané slonovinové vložky z 9. a 8. století př. n. l., připomínající Achabův dům ze slonoviny a přepych, který odsuzuje Amos, a samařské ostraky, poznámky z 8. století o dodávkách vína a oleje. Asyřané město obléhali tři roky; padlo roku 722 př. n. l. a Sargon II. tvrdí, že deportoval jeho lid a usadil na jeho místě jiné. Samaří se stalo sídlem asyrské provincie."
    - "Pod Peršany zůstalo sídlem místodržitelů: Sanbalat se stavěl proti Nehemjášovi a elefantinský papyrus z roku 407 př. n. l. ho jmenuje místodržitelem Samaří. Poté, co Samařané zaživa spálili Andromacha, Alexandrova místodržitele Sýrie, přišel Alexandr pomstít jeho smrt a viníci byli vydáni; Samaří se pak stalo makedonskou osadou, opevněnou kulatými věžemi. Jan Hyrkanos je po dlouhém obléhání dobyl a asi roku 108 př. n. l. srovnal se zemí; Pompeius je roku 63 př. n. l. vrátil jeho lidu a Gabinius je přestavěl."
    - "Augustus daroval Samaří roku 30 př. n. l. Herodovi Velikému. Herodes je přestavěl s chrámem Augustovým a novými hradbami a přejmenoval je na Sebaste, od řeckého jména Augustus. Skutky vypravují o Filipovi kážícím evangelium v Samaří, v zemi, která převzala jméno po městě. Asi roku 200 n. l. učinil Septimius Severus ze Sebaste římskou kolonii. Koncem 4. století tam křesťané ctili hrob Jana Křtitele a Paula se tam na své pouti modlila."
  nl:
    - "Samaria staat op een alleenstaande heuvel in het centrale bergland, zo’n 10 km ten noordwesten van Sichem, boven de weg van de heuvels naar de kustvlakte. In de Bijbel kocht Omri, koning van Israël, de heuvel van Semer voor twee talenten zilver en bouwde omstreeks 880 v.Chr. een stad erop, die hij Samaria noemde naar Semer, de eigenaar van de heuvel; ze verving Tirza als hoofdstad van het noordelijke koninkrijk. Assyrische opschriften noemden Israël daarna het huis van Omri."
    - "Omri en Achab bouwden een koninklijke akropolis van fijn bewerkte steen. In het paleisgebied vonden opgravers gesneden ivoren inlegwerk uit de 9e en 8e eeuw v.Chr., dat doet denken aan het ivoren huis van Achab en de door Amos aan de kaak gestelde weelde, en de Samaria-ostraca, notities uit de 8e eeuw over leveringen van wijn en olie. De Assyriërs belegerden de stad drie jaar; ze viel in 722 v.Chr., en Sargon II beweert haar bevolking te hebben gedeporteerd en anderen in hun plaats te hebben gevestigd. Samaria werd de zetel van een Assyrische provincie."
    - "Onder de Perzen bleef het een zetel van gouverneurs: Sanballat verzette zich tegen Nehemia, en een Elefantine-papyrus van 407 v.Chr. noemt hem gouverneur van Samaria. Nadat de Samaritanen Andromachus, Alexanders gouverneur van Syrië, levend hadden verbrand, kwam Alexander hem wreken en werden de schuldigen uitgeleverd; Samaria werd toen een Macedonische nederzetting, versterkt met ronde torens. Johannes Hyrcanus nam het na een lang beleg in en sloopte het omstreeks 108 v.Chr.; Pompeius gaf het in 63 v.Chr. aan zijn bewoners terug en Gabinius herbouwde het."
    - "Augustus schonk Samaria in 30 v.Chr. aan Herodes de Grote. Herodes herbouwde het met een tempel van Augustus en nieuwe muren en doopte het Sebaste, van het Griekse woord voor Augustus. Handelingen vertelt hoe Filippus het evangelie in Samaria predikte, het land dat zijn naam aan de stad dankte. Omstreeks 200 n.Chr. maakte Septimius Severus Sebaste tot Romeinse kolonie. Tegen het einde van de 4e eeuw vereerden christenen daar het graf van Johannes de Doper, en Paula bad er tijdens haar bedevaart."
  sv:
    - "Samaria ligger på en ensam kulle i det centrala höglandet, cirka 10 km nordväst om Shekem, ovanför vägen från bergen till kustslätten. Enligt Bibeln köpte Omri, Israels kung, kullen av Shemer för två talenter silver och byggde omkring 880 f.Kr. en stad på den, som han kallade Samaria efter Shemer, kullens ägare; den ersatte Tirsa som huvudstad i nordriket. Assyriska inskriptioner kallade därefter Israel Omris hus."
    - "Omri och Achav byggde en kunglig akropol av finhuggen sten. I palatsområdet fann utgrävarna snidade elfenbensinläggningar från 800- och 700-talen f.Kr., som erinrar om Achavs elfenbenshus och den lyx Amos fördömde, och Samariaostraka, anteckningar från 700-talet om leveranser av vin och olja. Assyrierna belägrade staden i tre år; den föll 722 f.Kr., och Sargon II påstår sig ha deporterat dess folk och bosatt andra i deras ställe. Samaria blev säte för en assyrisk provins."
    - "Under perserna förblev det guvernörssäte: Sanballat motsatte sig Nehemja, och en Elefantinepapyrus från 407 f.Kr. nämner honom som guvernör i Samaria. Sedan samarierna levande bränt Andromachos, Alexanders guvernör i Syrien, kom Alexander för att hämnas honom och de skyldiga utlämnades; Samaria blev då en makedonisk bosättning, befäst med runda torn. Johannes Hyrkanos intog det efter en lång belägring och jämnade det med marken omkring 108 f.Kr.; Pompejus gav tillbaka det till dess folk 63 f.Kr. och Gabinius byggde upp det."
    - "Augustus gav Samaria till Herodes den store år 30 f.Kr. Herodes byggde upp det med ett Augustustempel och nya murar och döpte om det till Sebaste, av grekiskans ord för Augustus. Apostlagärningarna berättar att Filippos predikade evangelium i Samaria, landet som fick sitt namn av staden. Omkring år 200 gjorde Septimius Severus Sebaste till en romersk koloni. På sent 300-tal vördade kristna Johannes Döparens grav där, och Paula bad där under sin pilgrimsfärd."
  nb:
    - "Samaria ligger på en enslig høyde i det sentrale høylandet, omtrent 10 km nordvest for Sikem, over veien fra åsene til kystsletten. Ifølge Bibelen kjøpte Omri, Israels konge, høyden av Sjemer for to talenter sølv og bygde omkring 880 f.Kr. en by på den, som han kalte Samaria etter Sjemer, høydens eier; den avløste Tirsa som hovedstad i nordriket. Assyriske inskripsjoner kalte siden Israel Omris hus."
    - "Omri og Akab bygde en kongelig akropolis av finhogd stein. I palassområdet fant utgraverne utskårne elfenbensinnlegg fra 800- og 700-tallet f.Kr., som minner om Akabs elfenbenshus og luksusen Amos fordømte, og Samaria-ostrakaene, notater fra 700-tallet om leveranser av vin og olje. Assyrerne beleiret byen i tre år; den falt i 722 f.Kr., og Sargon II hevder å ha deportert folket og bosatt andre i stedet. Samaria ble sete for en assyrisk provins."
    - "Under perserne forble den guvernørsete: Sanballat motsatte seg Nehemja, og en papyrus fra Elefantine fra 407 f.Kr. nevner ham som guvernør i Samaria. Etter at samaritanene brant Andromakhos, Aleksanders guvernør i Syria, levende, kom Aleksander for å hevne ham og de skyldige ble utlevert; Samaria ble så en makedonsk bosetning, befestet med runde tårn. Johannes Hyrkanos tok den etter en lang beleiring og jevnet den med jorden omkring 108 f.Kr.; Pompeius ga den tilbake til folket i 63 f.Kr., og Gabinius gjenreiste den."
    - "Augustus ga Samaria til Herodes den store i 30 f.Kr. Herodes gjenreiste den med et tempel for Augustus og nye murer og omdøpte den til Sebaste, av det greske ordet for Augustus. Apostlenes gjerninger forteller om Filip som forkynte evangeliet i Samaria, landet som fikk navn etter byen. Omkring 200 e.Kr. gjorde Septimius Severus Sebaste til en romersk koloni. Sent på 300-tallet æret de kristne Johannes døperens grav der, og Paula ba der på pilegrimsreisen sin."
