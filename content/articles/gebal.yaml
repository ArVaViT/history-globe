body:
  en:
    - "Gebal is the Hebrew name of Byblos, the Phoenician port on the coast of Lebanon about 30 km north of Beirut: Gubla in the Akkadian of the Amarna letters, Kepen to the Egyptians, Byblos to the Greeks, who took their word for papyrus, and so for book, from the trade that passed through it. People have lived on its headland since the Neolithic age, and from the third millennium BC it was the harbour through which the cedar of Lebanon went to Egypt and Egyptian gifts came to the temples of the Lady of Byblos. In the fourteenth century BC its king Rib-Hadda wrote Pharaoh more letters than any other vassal, begging for help; about 1075 BC the Egyptian envoy Wenamun came for timber and was kept waiting on the shore; and the sarcophagus of King Ahiram, from about 1000 BC, carries one of the earliest inscriptions in the Phoenician alphabet, the ancestor of the Hebrew and Greek letters."
    - "The Bible names it three times. Among the lands still unconquered in Joshua's old age is “the land of the Giblites”, which the Synodal Bible renders as the land of Gebla; when Solomon built the Temple, “Solomon's builders and Hiram's builders did hew them, and the stonesquarers”, where the Hebrew, kept in the Synodal text, says the Giblites; and in Ezekiel's lament over Tyre, “The ancients of Gebal and the wise men thereof were in thee thy calkers”, the shipwrights who stopped the seams of her ships. The Gebal of Psalm 83, in league with Moab and Ammon, is usually taken for a different place, a district of Edom, though some read Byblos there too."
    - "Byblos lived on under Persians, Greeks and Romans, who built its colonnaded street and theatre, and the Crusaders held it as Giblet from 1104 and left a castle. Pierre Montet dug the royal tombs in 1921–1924, and Maurice Dunand excavated the site from 1926 for half a century. It is the town of Jbeil in Lebanon today, with its harbour, souk and ruins, inscribed by UNESCO in 1984."
  ru:
    - "Гевал — еврейское имя Библа, финикийской гавани на побережье Ливана примерно в 30 км к северу от Бейрута: Губла в аккадском языке амарнских писем, Кепен у египтян, Библ у греков, которые взяли отсюда своё слово для папируса, а значит и для книги, по торговле, шедшей через этот порт. Люди живут на его мысу с неолита, а с третьего тысячелетия до н. э. это была гавань, через которую ливанский кедр шёл в Египет, а египетские дары приходили в храмы Владычицы Библа. В XIV веке до н. э. его царь Риб-Адди написал фараону больше писем, чем любой другой вассал, умоляя о помощи против соседей; около 1075 г. до н. э. египетский посланник Унамон приехал за лесом и долго ждал на берегу; а саркофаг царя Ахирама, около 1000 г. до н. э., несёт одну из древнейших надписей финикийским алфавитом, предком еврейских и греческих букв."
    - "Библия называет его трижды. Среди земель, ещё не завоёванных к старости Иисуса Навина, названа «земля Гевла», как передаёт Синодальный перевод; о камнях для храма Соломона сказано: «Обтесывали же их работники Соломоновы и работники Хирамовы и Гивлитяне»; а в плаче Иезекииля о Тире «Старшие из Гевала и знатоки его были у тебя, чтобы заделывать пробоины твои» — корабельщики, конопатившие швы её судов. Гевал 82-го псалма, в союзе с Моавом и Аммоном, обычно считают другим местом, областью Едома, хотя некоторые видят и там Библ."
    - "Библ жил и при персах, греках и римлянах, построивших его улицу с колоннадой и театр, а крестоносцы держали его как Жибле с 1104 года и оставили замок. Пьер Монте раскопал царские гробницы в 1921–1924 годах, а Морис Дюнан вёл раскопки с 1926 года полвека. Сегодня это город Джубейль в Ливане, с гаванью, рынком и развалинами, внесённый в список ЮНЕСКО в 1984 году."
  uk:
    - "Гевал — давньоєврейська назва Бібла, фінікійського порту на узбережжі Лівану приблизно за 30 км на північ від Бейрута: Губла в аккадській мові амарнських листів, Кепен у єгиптян, Бібл у греків, які свою назву папірусу, а тому й книги, взяли від торгівлі, що йшла через нього. На його мисі люди живуть із доби неоліту, а від III тисячоліття до н. е. він був гаванню, через яку ліванський кедр ішов до Єгипту, а єгипетські дари надходили до храмів Володарки Бібла. У XIV ст. до н. е. його цар Рібхадда писав фараонові більше листів, ніж будь-який інший васал, благаючи про допомогу; близько 1075 р. до н. е. єгипетський посланець Венамон прибув по деревину й чекав на березі; а саркофаг царя Ахірама, приблизно 1000 р. до н. е., має один із найдавніших написів фінікійською абеткою — предком єврейських і грецьких літер."
    - "Біблія називає його тричі. Серед земель, які лишалися непідкореними на старості Ісуса Навина, — «земля Гевла», яку Синодальна Біблія передає як землю Гевла; коли Соломон будував храм, «тесали їх будівники Соломонові та Гирамові та Гиблїї», де давньоєврейський текст, збережений у Синодальному, говорить про гівлян; а в плачі Єзекіїля над Тиром — «Найзначнїйші й тямущі мужі Гевалські були в тебе, що залатували проломини твої», тобто корабели, які конопатили шви її суден. Гевал із Псалма 83, союзник Моава й Аммона, зазвичай вважають іншим місцем, областю Едому, хоча дехто бачить і там Бібл."
    - "Бібл жив далі за персів, греків і римлян, які збудували його вулицю з колонадою й театр; хрестоносці утримували його як Жібле з 1104 року й залишили замок. П’єр Монте розкопав царські гробниці в 1921–1924 роках, а Моріс Дюнан розкопував місце від 1926 року протягом півстоліття. Сьогодні це місто Джбейль у Лівані з гаванню, ринком і руїнами, занесене ЮНЕСКО до списку 1984 року."
  es:
    - "Gebal es el nombre hebreo de Biblos, el puerto fenicio de la costa del Líbano, unos 30 km al norte de Beirut: Gubla en el acadio de las cartas de Amarna, Kepen para los egipcios, Biblos para los griegos, que tomaron su palabra para papiro, y por tanto para libro, del comercio que pasaba por ella. Su promontorio está habitado desde el Neolítico, y desde el tercer milenio a. C. fue el puerto por el que el cedro del Líbano iba a Egipto y los presentes egipcios llegaban a los templos de la Señora de Biblos. En el siglo XIV a. C. su rey Rib-Hadda escribió al faraón más cartas que ningún otro vasallo, suplicando ayuda; hacia 1075 a. C. el enviado egipcio Wenamón llegó en busca de madera y fue dejado esperando en la orilla; y el sarcófago del rey Ahiram, de hacia 1000 a. C., lleva una de las inscripciones más antiguas en alfabeto fenicio, antecesor de las letras hebreas y griegas."
    - "La Biblia la nombra tres veces. Entre las tierras aún sin conquistar en la vejez de Josué está «la tierra de los Gibleos», que la Biblia sinodal traduce como tierra de Gebla; cuando Salomón edificó el Templo, «los albañiles de Salomón y los de Hiram, y los aparejadores, cortaron y aparejaron la madera y la cantería», donde el hebreo, conservado en el texto sinodal, dice los giblitas; y en la lamentación de Ezequiel sobre Tiro, «Los ancianos de Gebal y sus sabios repararon tus hendiduras», los carpinteros de ribera que calafateaban las junturas de sus naves. El Gebal del Salmo 83, aliado con Moab y Amón, suele tomarse por un lugar distinto, un distrito de Edom, aunque algunos leen ahí también Biblos."
    - "Biblos siguió viviendo bajo persas, griegos y romanos, que construyeron su calle de columnas y su teatro, y los cruzados la tuvieron como Giblet desde 1104 y dejaron un castillo. Pierre Montet excavó las tumbas reales en 1921–1924, y Maurice Dunand excavó el sitio desde 1926 durante medio siglo. Hoy es la ciudad de Jbeil, en el Líbano, con su puerto, su zoco y sus ruinas, inscrita por la UNESCO en 1984."
  pt:
    - "Gebal é o nome hebraico de Biblos, o porto fenício na costa do Líbano, a cerca de 30 km ao norte de Beirute: Gubla no acádio das cartas de Amarna, Kepen para os egípcios, Biblos para os gregos, que tomaram dela a sua palavra para papiro, e assim para livro, do comércio que passava por ali. Vive-se em seu promontório desde o Neolítico, e desde o terceiro milênio a.C. foi o porto por onde o cedro do Líbano seguia para o Egito e os presentes egípcios chegavam aos templos da Senhora de Biblos. No século XIV a.C., o seu rei Rib-Hadda escreveu ao faraó mais cartas do que qualquer outro vassalo, pedindo socorro; por volta de 1075 a.C., o enviado egípcio Wenamun veio buscar madeira e foi mantido à espera na praia; e o sarcófago do rei Ahiram, de cerca de 1000 a.C., traz uma das mais antigas inscrições no alfabeto fenício, ancestral das letras hebraicas e gregas."
    - "A Bíblia a nomeia três vezes. Entre as terras ainda não conquistadas na velhice de Josué está “a terra dos gebalitas”, que a Bíblia Sinodal traduz como terra de Gebla; quando Salomão edificou o Templo, “Os construtores de Salomão, os construtores de Hirão e os giblitas as cortaram”, passagem em que o hebraico, mantido no texto sinodal, tem os giblitas; e no lamento de Ezequiel sobre Tiro, “Os anciãos de Gebal e os seus sábios eram os reparadores das fendas dos seus navios em você”, os construtores navais que vedavam as juntas dos seus navios. A Gebal do Salmo 83, aliada de Moabe e Amom, costuma ser tomada por um lugar diferente, um distrito de Edom, embora alguns leiam ali também Biblos."
    - "Biblos continuou a viver sob persas, gregos e romanos, que construíram a sua rua com colunatas e o teatro, e os cruzados a mantiveram como Giblet a partir de 1104 e deixaram um castelo. Pierre Montet escavou as tumbas reais em 1921–1924, e Maurice Dunand escavou o sítio a partir de 1926 durante meio século. Hoje é a cidade de Jbeil, no Líbano, com seu porto, souk e ruínas, inscrita pela UNESCO em 1984."
  de:
    - "Gebal ist der hebräische Name von Byblos, des phönizischen Hafens an der libanesischen Küste, 30 km nördlich von Beirut: Gubla im Akkadisch der Amarnabriefe, Kepen bei den Ägyptern, Byblos bei den Griechen, die ihr Wort für Papyrus und damit für Buch vom Handel über diese Stadt ableiteten. Auf ihrer Landzunge siedelt man seit der Jungsteinzeit, und seit dem 3. Jahrtausend v. Chr. ging über sie das Zedernholz des Libanon nach Ägypten, und ägyptische Gaben kamen zu den Tempeln der Herrin von Byblos. Im 14. Jahrhundert v. Chr. schrieb König Rib-Hadda dem Pharao mehr Bittbriefe als jeder andere Vasall; um 1075 v. Chr. kam der ägyptische Gesandte Wenamun wegen Bauholz und musste am Ufer warten; der Sarkophag König Ahirams von etwa 1000 v. Chr. trägt eine der frühesten Inschriften im phönizischen Alphabet, dem Ahnen der hebräischen und griechischen Schrift."
    - "Die Bibel nennt es dreimal. Unter den Ländern, die in Josuas hohem Alter noch nicht erobert waren, ist „das Land der Gebaliter“, das die russische Synodalübersetzung als Land Gebla wiedergibt; beim Bau des Tempels durch Salomo heißt es: „Und die Bauleute Salomos und die Bauleute Hirams und die Gebaliter hieben aus“, wo der hebräische Text, den auch die Synodalübersetzung bewahrt, die Gebaliter nennt; und in Hesekiels Klage über Tyrus heißt es: „Die Ältesten und Klugen von Gebal mußten deine Risse bessern“, die Schiffbauer, die die Fugen ihrer Schiffe dichteten. Das Gebal in Psalm 83, im Bund mit Moab und Ammon, gilt meist als ein anderer Ort, ein Gebiet Edoms, doch manche lesen auch dort Byblos."
    - "Byblos lebte unter Persern, Griechen und Römern weiter, die seine Säulenstraße und sein Theater bauten, und die Kreuzfahrer hielten es ab 1104 als Giblet und hinterließen eine Burg. Pierre Montet grub 1921–1924 die Königsgräber aus, und Maurice Dunand erforschte die Stätte ab 1926 ein halbes Jahrhundert lang. Heute ist es die Stadt Dschbeil im Libanon mit Hafen, Souk und Ruinen, 1984 von der UNESCO eingetragen."
  fr:
    - "Guebal est le nom hébreu de Byblos, port phénicien de la côte libanaise, à environ 30 km au nord de Beyrouth : Gubla dans l’akkadien des lettres d’Amarna, Képen pour les Égyptiens, Byblos pour les Grecs, qui durent leur mot pour papyrus, et donc pour livre, au commerce qui y passait. Son promontoire est habité depuis le Néolithique ; dès le IIIe millénaire av. J.-C., le cèdre du Liban y partait pour l’Égypte et les présents égyptiens arrivaient aux temples de la Dame de Byblos. Au XIVe siècle av. J.-C., son roi Rib-Hadda écrivit au pharaon plus de lettres que tout autre vassal, implorant du secours ; vers 1075 av. J.-C., l’envoyé égyptien Ounamon vint chercher du bois et dut attendre sur le rivage ; le sarcophage du roi Ahiram, vers 1000 av. J.-C., porte l’une des plus anciennes inscriptions en alphabet phénicien, ancêtre des lettres hébraïques et grecques."
    - "La Bible la nomme trois fois. Parmi les pays non conquis dans la vieillesse de Josué se trouve « le pays des Guibliens », que la Bible synodale rend par le pays de Gebla ; quand Salomon bâtit le Temple, « Les ouvriers de Salomon, ceux de Hiram, et les Guibliens, les taillèrent », où l’hébreu, conservé dans le texte synodal, dit les Guibliens ; et dans la lamentation d’Ézéchiel sur Tyr, « Les anciens de Guebal et ses ouvriers habiles étaient chez toi, pour réparer tes fissures », ces constructeurs de navires qui calfataient les joints de ses vaisseaux. Le Guebal du Psaume 83, allié de Moab et d’Ammon, passe d’ordinaire pour un autre lieu, un district d’Édom, bien que certains y lisent aussi Byblos."
    - "Byblos survécut sous les Perses, les Grecs et les Romains, qui y bâtirent sa rue à colonnades et son théâtre, et les croisés la tinrent sous le nom de Giblet à partir de 1104 et y laissèrent un château. Pierre Montet fouilla les tombes royales en 1921–1924, et Maurice Dunand explora le site à partir de 1926 pendant un demi-siècle. C’est aujourd’hui la ville de Jbeil, au Liban, avec son port, son souk et ses ruines, inscrite par l’UNESCO en 1984."
  pl:
    - "Gebal to hebrajska nazwa Biblos, fenickiego portu na wybrzeżu Libanu, około 30 km na północ od Bejrutu: Gubla w akadyjskim listów z Amarna, Kepen dla Egipcjan, Biblos dla Greków, którzy od handlu przechodzącego przez to miasto wzięli swoje słowo na papirus, a stąd na księgę. Ludzie mieszkają na jego cyplu od neolitu, a od III tysiąclecia p.n.e. był to port, przez który cedr libański szedł do Egiptu, a egipskie dary trafiały do świątyń Pani Biblos. W XIV w. p.n.e. jego król Rib-Hadda napisał do faraona więcej listów z prośbą o pomoc niż jakikolwiek inny wasal; około 1075 p.n.e. egipski poseł Wenamon przybył po drewno i kazano mu czekać na wybrzeżu; a sarkofag króla Ahirama, z około 1000 p.n.e., nosi jeden z najstarszych napisów alfabetem fenickim, przodkiem liter hebrajskich i greckich."
    - "Biblia wymienia je trzykrotnie. Wśród ziem niepodbitych za starości Jozuego jest „ziemia Giblitów”, którą Biblia synodalna oddaje jako ziemię Gebla; gdy Salomon budował Świątynię, „rzemieślnicy Salomonowi, i rzemieślnicy Hiramowi, i Gimblimczycy” ciosali kamienie, przy czym hebrajski tekst, zachowany w tekście synodalnym, mówi o Giblitach; a w lamencie Ezechiela nad Tyrem „starcy z Giebal, i mędrcy jego oprawiali w tobie rozpadliny twoje”, czyli szkutnicy, którzy uszczelniali szwy jej okrętów. Gebal z Psalmu 83, w sojuszu z Moabem i Ammonem, uchodzi zwykle za inne miejsce, okręg Edomu, choć niektórzy i tam widzą Biblos."
    - "Biblos przetrwał pod Persami, Grekami i Rzymianami, którzy zbudowali jego ulicę z kolumnadą i teatr, a krzyżowcy trzymali go jako Giblet od 1104 r. i zostawili zamek. Pierre Montet odkopał grobowce królewskie w latach 1921–1924, a Maurice Dunand badał stanowisko od 1926 r. przez pół wieku. Dziś jest to miasto Jbeil w Libanie z portem, sukiem i ruinami, wpisane przez UNESCO w 1984 r."
  it:
    - "Gebal è il nome ebraico di Biblo, il porto fenicio sulla costa del Libano a circa 30 km a nord di Beirut: Gubla nell’accadico delle lettere di Amarna, Kepen per gli Egizi, Byblos per i Greci, che dal commercio che vi passava trassero la loro parola per papiro, e quindi per libro. La sua altura sul mare è abitata fin dal Neolitico, e dal III millennio a.C. fu il porto attraverso cui il cedro del Libano andava in Egitto e i doni egizi giungevano ai templi della Signora di Biblo. Nel XIV secolo a.C. il suo re Rib-Hadda scrisse al faraone più lettere di qualsiasi altro vassallo, implorando aiuto; verso il 1075 a.C. l’inviato egizio Wenamun venne per il legname e fu lasciato ad attendere sulla riva; e il sarcofago del re Achiram, del 1000 a.C. circa, reca una delle più antiche iscrizioni in alfabeto fenicio, antenato delle lettere ebraiche e greche."
    - "La Bibbia la nomina tre volte. Fra le terre ancora da conquistare nella vecchiaia di Giosuè vi è «il paese dei Ghibliti», che la Bibbia sinodale rende come terra di Gebla; quando Salomone costruì il Tempio, «gli operai di Salomone e gli operai di Hiram e i Ghiblei tagliarono e prepararono il legname e le pietre», dove l’ebraico, conservato nel testo sinodale, dice i Ghiblei; e nel lamento di Ezechiele su Tiro, «gli anziani di Ghebel e i suoi savi» erano lì «a calafatare le tue falle», i carpentieri navali che turavano le giunture delle sue navi. Il Gebal del Salmo 83, alleato di Moab e di Ammon, è di solito ritenuto un luogo diverso, un distretto di Edom, benché alcuni vi leggano anche Biblo."
    - "Biblo continuò a vivere sotto Persiani, Greci e Romani, che vi costruirono la strada colonnata e il teatro, e i Crociati la tennero come Giblet dal 1104 e vi lasciarono un castello. Pierre Montet scavò le tombe reali nel 1921–1924, e Maurice Dunand esplorò il sito dal 1926 per mezzo secolo. Oggi è la città di Jbeil in Libano, con il suo porto, il suk e le rovine, iscritta dall’UNESCO nel 1984."
  nl:
    - "Gebal is de Hebreeuwse naam van Byblos, de Fenicische haven aan de Libanese kust, ongeveer 30 km ten noorden van Beiroet: Gubla in het Akkadisch van de Amarnabrieven, Kepen voor de Egyptenaren, Byblos voor de Grieken, die hun woord voor papyrus, en dus voor boek, ontleenden aan de handel die er passeerde. Sinds het neolithicum woont men op de landtong, en vanaf het 3e millennium v.Chr. ging door deze haven het cederhout naar Egypte en kwamen gaven voor de tempels van de Vrouwe van Byblos. In de 14e eeuw v.Chr. schreef koning Rib-Hadda de farao meer smeekbrieven dan enige andere vazal; omstreeks 1075 v.Chr. kwam de Egyptische gezant Wenamon om hout en liet men hem aan de kust wachten; en de sarcofaag van koning Ahiram (omstreeks 1000 v.Chr.) draagt een van de oudste opschriften in het Fenicische alfabet, voorloper van het Hebreeuwse en Griekse schrift."
    - "De Bijbel noemt de stad driemaal. Onder de landen die in Jozua’s hoge ouderdom nog niet veroverd waren, is “het land der Giblieten”, dat de Synodale Bijbel weergeeft als het land Gebla; toen Salomo de tempel bouwde, “behieuwen” “de bouwlieden van Salomo, en de bouwlieden van Hiram, en de Giblieten” de stenen, waar het Hebreeuws, dat in de Synodale tekst bewaard is, de Giblieten noemt; en in Ezechiëls klaagzang over Tyrus: “De oudsten van Gebal en haar wijzen waren in u, verbeterende uw breuken”, de scheepsbouwers die de naden van haar schepen dichtten. Het Gebal van Psalm 83, in verbond met Moab en Ammon, geldt meestal als een andere plaats, een streek van Edom, al lezen sommigen ook daar Byblos."
    - "Byblos bleef bestaan onder Perzen, Grieken en Romeinen, die er de zuilenstraat en het theater bouwden, en de kruisvaarders hielden het vanaf 1104 als Giblet en lieten er een kasteel achter. Pierre Montet groef de koningsgraven op in 1921–1924, en Maurice Dunand groef vanaf 1926 een halve eeuw lang op de plaats. Het is nu de stad Jbeil in Libanon, met haven, soek en ruïnes, in 1984 door UNESCO op de werelderfgoedlijst geplaatst."
  cs:
    - "Gebal je hebrejské jméno Býblu, fénického přístavu na pobřeží Libanonu asi 30 km severně od Bejrútu: akkadsky v amarnských dopisech Gubla, u Egypťanů Kepen, u Řeků Býblos, kteří vzali své slovo pro papyrus, a tedy pro knihu, z obchodu, který jím procházel. Na jeho předhůří lidé žili od neolitu a od 3. tisíciletí př. n. l. byl přístavem, jímž šlo libanonské cedrové dřevo do Egypta a egyptské dary přicházely do chrámů Paní z Býblu. Ve 14. stol. př. n. l. napsal jeho král Rib-Hadda faraonovi více dopisů než kterýkoli jiný vazal a prosil o pomoc; kolem roku 1075 př. n. l. přišel egyptský vyslanec Wenamun pro dřevo a byl nechán čekat na břehu; a sarkofág krále Achírama, z doby kolem roku 1000 př. n. l., nese jeden z nejstarších nápisů ve fénické abecedě, předchůdkyni hebrejského a řeckého písma."
    - "Bible jej jmenuje třikrát. Mezi zeměmi dosud nedobytými v Jozuově stáří je „země Giblická“, kterou synodální Bible vykládá jako zemi Gebla; když Šalomoun stavěl chrám, „kameníci Šalomounovi a kameníci Chíramovi a Gibličtí“ tesali kámen, kde Bible krále Jakuba čte jen „kameníky“, kdežto hebrejština, zachovaná v synodálním textu i v Bibli kralické, má Gibličtí; a v Ezechielově nářku nad Týrem „Starší Gebalští a moudří jejich opravovali v tobě zbořeniny tvé“, kde jde o lodní tesaře, kteří utěsňovali spáry jejích lodí. Gebal ze Žalmu 83, spolčený s Moábem a Amónem, se obvykle pokládá za jiné místo, kraj v Edómu, ač někteří i tam čtou Býblos."
    - "Býblos žil dál pod Peršany, Řeky a Římany, kteří vystavěli jeho sloupovou ulici a divadlo, a křižáci jej drželi od roku 1104 jako Giblet a zanechali hrad. Pierre Montet vykopal královské hrobky v letech 1921–1924 a Maurice Dunand prozkoumával lokalitu od roku 1926 po půl století. Dnes je to město Džbejl v Libanonu se svým přístavem, súkem a zříceninami, zapsané UNESCO roku 1984."
  sv:
    - "Gebal är det hebreiska namnet på Byblos, den fönikiska hamnen på Libanons kust omkring 30 km norr om Beirut: Gubla på akkadiska i Amarnabreven, Kepen för egyptierna, Byblos för grekerna, som fick sitt ord för papyrus, och därmed för bok, från handeln som gick genom staden. Människor har bott på dess udde sedan neolitikum, och från tredje årtusendet f.Kr. var den hamnen genom vilken Libanons cederträ gick till Egypten och egyptiska gåvor kom till templen för Byblos härskarinna. På 1300-talet f.Kr. skrev dess kung Rib-Hadda fler brev till farao än någon annan vasall och bad om hjälp; omkring 1075 f.Kr. kom den egyptiske sändebudet Wenamun efter virke och fick vänta på stranden; och kung Ahirams sarkofag, från omkring 1000 f.Kr., bär en av de äldsta inskrifterna i det fönikiska alfabetet, förfader till de hebreiska och grekiska bokstäverna."
    - "Bibeln nämner den tre gånger. Bland de länder som ännu var ointagna i Josuas ålderdom finns ”gebaléernas land”, som den ryska synodalbibeln återger som Geblas land; när Salomo byggde templet ”Salomos byggningsmän och Hiroms byggningsmän och männen från Gebal höggo och tillredde” virket och stenarna, där hebreiskan, bevarad i den synodala texten, har gebaliterna; och i Hesekiels klagosång över Tyros: ”Gebals äldste och dess förfarnaste män tjänade dig med att bota dina läckor”, skeppsbyggarna som tätade fogarna i hennes skepp. Gebal i Psalm 83, i förbund med Moab och Ammon, anses oftast vara en annan plats, ett distrikt i Edom, fast några läser Byblos även där."
    - "Byblos levde vidare under perser, greker och romare, som byggde dess kolonnadgata och teater, och korsfararna höll det som Giblet från 1104 och lämnade en borg. Pierre Montet grävde fram kungagravarna 1921–1924, och Maurice Dunand undersökte platsen från 1926 i ett halvt sekel. Det är i dag staden Jbeil i Libanon, med hamn, souk och ruiner, upptagen på Unescos lista 1984."
  nb:
    - "Gebal er det hebraiske navnet på Byblos, den fønikiske havnen på kysten av Libanon omtrent 30 km nord for Beirut: Gubla på akkadisk i Amarna-brevene, Kepen for egypterne, Byblos for grekerne, som fikk sitt ord for papyrus, og dermed for bok, fra handelen som gikk gjennom den. Folk har bodd på dens nes siden yngre steinalder, og fra det tredje årtusen f.Kr. var den havnen som libanonsedertreet gikk til Egypt gjennom og egyptiske gaver kom til templene for Byblos' frue. På 1300-tallet f.Kr. skrev kongen Rib-Hadda flere brev til Farao enn noen annen vasall og tryglet om hjelp; omkring 1075 f.Kr. kom den egyptiske utsendingen Wenamon for å hente tømmer og ble holdt ventende på stranden; og kong Ahirams sarkofag, fra omkring 1000 f.Kr., bærer en av de eldste innskriftene i det fønikiske alfabetet, forfaren til de hebraiske og greske bokstavene."
    - "Bibelen nevner den tre ganger. Blant landene som ennå ikke var erobret i Josvas alderdom, er «giblittenes land», som den synodale bibelen gjengir som landet Gebla; da Salomo bygde tempelet, «Salomos bygningsmenn og Hirams bygningsmenn og giblittene hugg dem til», der den hebraiske teksten, som den synodale teksten beholder, har giblittene; og i Esekiels klagesang over Tyros: «Gebals eldste og dets kloke menn var hos dig og bøtte dine brøst», skipsbyggerne som tettet sømmene i hennes skip. Gebal i Salme 83, i forbund med Moab og Ammon, regnes vanligvis for et annet sted, en del av Edom, selv om noen leser Byblos også der."
    - "Byblos levde videre under perserne, grekerne og romerne, som bygde dens søylegate og teater, og korsfarerne holdt den som Giblet fra 1104 og etterlot en borg. Pierre Montet gravde ut kongegravene i 1921–1924, og Maurice Dunand utgravde stedet fra 1926 i et halvt århundre. Det er byen Jbeil i Libanon i dag, med havn, souk og ruiner, innskrevet av UNESCO i 1984."
  tl:
    - "Ang Gebal ay pangalang Hebreo ng Byblos, daungang Fenicio sa baybayin ng Libano mga 30 km hilaga ng Beirut: Gubla sa Akkadiano ng liham ng Amarna, Kepen sa mga Egipsiyo, Byblos sa mga Griyego, na kumuha ng salita nila para sa papiro, at sa aklat, mula sa kalakalang dumaan dito. May nakatira sa tangos nito mula pa sa Neolitiko, at mula sa ika-3 milenyo BK ito ang daungang dinaanan ng sedro ng Libano patungong Egipto at ng handog ng Egipto sa templo ng Binibini ng Byblos. Noong ika-14 na siglo BK, mas maraming liham ang isinulat ng hari nitong si Rib-Hadda kay Faraon kaysa sa alinmang basalyo, na humihingi ng tulong; mga 1075 BK, dumating ang sugong Egipsiyo na si Wenamun para sa kahoy at pinaghintay sa baybayin; at ang sarkopago ni Haring Ahiram, mga 1000 BK, ay may isa sa pinakamaagang inskripsiyon sa alpabetong Fenicio, ninuno ng letrang Hebreo at Griyego."
    - "Tatlong beses itong pinangalanan ng Biblia. Kabilang sa mga lupaing hindi pa nasasakop sa pagtanda ni Josue ang “lupain ng mga Gebalita”, na isinasalin ng Bibliyang Synodal na lupain ng Gebla; nang itayo ni Salomon ang Templo, “tinabas ng mga tagapagtayo ni Salomon, at ng mga tagapagtayo ni Hiram at ng mga Gebalita”, kung saan ang Hebreo, na pinananatili sa tekstong Synodal, ay nagsasabi ng mga Giblita; at sa panaghoy ni Ezekiel sa Tiro, “Ang mga matanda sa Gebal at ang mga pantas niyao'y pawang tagapagpasak mo”, ang mga gumagawa ng barko na nagpapasak sa mga siwang ng kaniyang mga sasakyan. Ang Gebal ng Awit 83, na kaalyado ng Moab at Ammon, ay karaniwang itinuturing na ibang lugar, isang distrito ng Edom, bagaman binabasa ng ilan ang Byblos din doon."
    - "Nagpatuloy ang Byblos sa ilalim ng mga Persiano, Griyego at Romano, na nagtayo ng kalyeng may kolonada at teatro nito, at hinawakan ito ng mga Krusado bilang Giblet mula 1104 at nag-iwan ng kastilyo. Hinukay ni Pierre Montet ang mga libingang maharlika noong 1921–1924, at hinukay ni Maurice Dunand ang lugar mula 1926 sa loob ng kalahating siglo. Ito ngayon ang bayan ng Jbeil sa Libano, na may daungan, souk at mga guho, na itinala ng UNESCO noong 1984."
