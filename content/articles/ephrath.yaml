body:
  en:
    - "Ephrath, or Ephrathah, is the older or district name of Bethlehem in Judah, 8 km south of Jerusalem. Genesis uses it for the place of Rachel's death: Jacob's family “journeyed from Beth-el; and there was but a little way to come to Ephrath: and Rachel travailed”, and she “was buried in the way to Ephrath, which is Beth-lehem. And Jacob set a pillar upon her grave”. Jacob repeats it to Joseph in Egypt: “I buried her there in the way of Ephrath; the same is Beth-lehem”. Elsewhere the two names stand side by side: David is “the son of that Ephrathite of Beth-lehem-judah”; and Micah addresses “Beth-lehem Ephratah, though thou be little among the thousands of Judah”. In Chronicles Ephrath is a woman, Caleb's wife and mother of Hur, whose descendants were the “fathers” of Bethlehem and Kiriath-jearim: the name, it seems, of the clan that held the Bethlehem hills."
    - "The grave of Rachel is shown at the northern entrance of Bethlehem, where the pilgrim of Bordeaux in 333 and Jerome already saw it; the domed building is Ottoman, enlarged by Moses Montefiore in 1841 and now enclosed by walls and the separation barrier. Yet Samuel places “Rachel’s sepulchre in the border of Benjamin at Zelzah”, north of Jerusalem, and Jeremiah hears Rachel weeping “in Ramah”; many scholars therefore think that the oldest tradition put her grave in Benjamin, and that the words “which is Beth-lehem” are a later gloss. Others hold that the texts can be reconciled. The question is open."
    - "Today Rachel's Tomb stands on the Hebron road at the edge of Bethlehem, a place of Jewish prayer reached from the Jerusalem side; the town itself is told in the article on Bethlehem."
  ru:
    - "Ефрафа — старое имя, или имя округи, Вифлеема Иудейского в 8 км к югу от Иерусалима. Книга Бытия называет им место смерти Рахили: семья Иакова «отправились из Вефиля», и «когда еще оставалось некоторое расстояние земли до Ефрафы, Рахиль родила, и роды ее были трудны», и она «погребена на дороге в Ефрафу, то есть Вифлеем. Иаков поставил над гробом ее памятник». Иаков повторяет это Иосифу в Египте: «я похоронил ее там на дороге к Ефрафе, что ныне Вифлеем». В других местах два имени стоят рядом: Давид — «сын Ефрафянина из Вифлеема Иудина»; а Михей обращается: «И ты, Вифлеем-Ефрафа, мал ли ты между тысячами Иудиными?» В Паралипоменон Ефрафа — женщина, жена Халева и мать Хура, чьи потомки были «отцами» Вифлеема и Кириаф-Иарима: по-видимому, имя рода, державшего Вифлеемские холмы."
    - "Гроб Рахили показывают у северного въезда в Вифлеем, где его видели уже Бордоский паломник в 333 году и Иероним; здание с куполом — османское, расширенное Мозесом Монтефиоре в 1841 году и теперь обнесённое стенами и разделительным барьером. Однако книга Царств помещает гроб Рахили «на пределах Вениаминовых, в Целцахе», к северу от Иерусалима, а Иеремия слышит плач Рахили «в Раме»; потому многие учёные думают, что древнейшее предание помещало её могилу в Вениамине, а слова «то есть Вифлеем» — позднейшая глосса. Другие считают, что тексты можно согласовать. Вопрос открыт."
    - "Сегодня гробница Рахили стоит на Хевронской дороге на краю Вифлеема — место иудейской молитвы, куда приезжают со стороны Иерусалима; о самом городе рассказывает статья о Вифлееме."
  uk:
    - "Ефрата, або Ефрафа, — давніша або окружна назва Вифлеєму в Юді, за 8 км на південь від Єрусалима. Книга Буття вживає її для місця смерті Рахілі: родина Якова «рушили вони з Бетеля, і було вже не далеко до Евфрата і настигла Рахелю родїльня мука», і її «поховано на шляху до Евфрата, се єсть Бетлегем. І поставив Яков стовпа над гробом її». Яків повторює це Йосипові в Єгипті: «в дорозї до Ефрата, се Бетлегем». В іншому місці обидві назви стоять поряд: Давид — «син одного Ефратїя із Бетлеєма Юдиного»; а Міха звертається: «Бетлеєме — ти, Ефрато, хоч ти малий між тисячами в Юдеї». У Хроніках Ефрата — жінка, дружина Калеба й мати Гура, чиї нащадки були «батьками» Вифлеєму й Кіріят-Єарима: назва, схоже, роду, що тримав вифлеємські пагорби."
    - "Гробницю Рахілі показують біля північного входу до Вифлеєму, де його бачили вже бордоський пілігрим у 333 р. та Ієронім; споруда з куполом османська, розбудована Мозесом Монтефіоре в 1841 р. і нині оточена стінами та розділювальним бар'єром. Проте Самуїл розміщує «коло гробу Рахилиного на гряницї Беняминовій, в Зелзасї», на північ від Єрусалима, а Єремія чує, як Рахіль плаче «аж у Рамі»; тому багато вчених думає, що найдавніша традиція розташовувала її гробницю в землі Веніямина, а слова «се єсть Бетлегем» — пізніша глоса. Інші вважають, що тексти можна узгодити. Питання відкрите."
    - "Сьогодні Гробниця Рахілі стоїть на хевронській дорозі на краю Вифлеєму, місце юдейської молитви, доступне з боку Єрусалима; саме місто описано в статті про Вифлеєм."
  es:
    - "Efrata, o Efratá, es el nombre antiguo o de distrito de Belén de Judá, a 8 km al sur de Jerusalén. El Génesis lo usa para el lugar de la muerte de Raquel: la familia de Jacob «partieron de Beth-el, y había aún como media legua de tierra para llegar á Ephrata, cuando parió Rachêl, y hubo trabajo en su parto», y ella «fué sepultada en el camino de Ephrata, la cual es Beth-lehem. Y puso Jacob un título sobre su sepultura». Jacob lo repite a José: «sepultéla allí en el camino de Ephrata, que es Bethlehem». Otras veces aparecen juntos: David es «hijo de aquel hombre Ephrateo de Beth-lehem de Judá»; y Miqueas se dirige a «Beth-lehem Ephrata, pequeña para ser en los millares de Judá». En Crónicas Efrata es una mujer, esposa de Caleb y madre de Hur, cuyos descendientes fueron los «padres» de Belén y de Quiriat-jearim: al parecer el clan dueño de las colinas de Belén."
    - "La tumba de Raquel se muestra en la entrada norte de Belén, donde ya la vieron el peregrino de Burdeos en el 333 y Jerónimo; el edificio con cúpula es otomano, ampliado por Moisés Montefiore en 1841 y hoy encerrado entre muros y la barrera de separación. Sin embargo, Samuel sitúa el «sepulcro de Rachêl, en el término de Benjamín, en Selsah», al norte de Jerusalén, y Jeremías oye llorar a Raquel «en Ramá»; muchos estudiosos piensan por ello que la tradición más antigua puso su tumba en Benjamín, y que las palabras «la cual es Beth-lehem» son una glosa posterior. Otros sostienen que los textos pueden conciliarse. La cuestión está abierta."
    - "Hoy la Tumba de Raquel se halla en el camino de Hebrón, en el borde de Belén, lugar de oración judía al que se llega desde el lado de Jerusalén; la ciudad misma se cuenta en el artículo sobre Belén."
  pt:
    - "Efrata, ou Efrate, é o nome mais antigo ou distrital de Belém de Judá, a 8 km ao sul de Jerusalém. O Gênesis o usa para o lugar da morte de Raquel: a família de Jacó viajou de Betel, e “Ainda faltava alguma distância para chegar a Efrata, e Raquel entrou em trabalho de parto”; ela “foi sepultada no caminho para Efrata (também chamada Belém). Jacó ergueu uma coluna sobre o seu túmulo”. Jacó o repete a José no Egito: “eu a sepultei ali, no caminho para Efrata (que é Belém)”. Em outros lugares os dois nomes aparecem lado a lado: Davi é “filho daquele efrateu de Belém de Judá”; e Miqueias se dirige a “Belém Efrata, embora seja pequena entre os clãs de Judá”. Nas Crônicas, Efrata é uma mulher, esposa de Calebe e mãe de Hur, cujos descendentes foram os “pais” de Belém e Quiriate-Jearim: o nome, ao que parece, do clã que ocupava as colinas de Belém."
    - "O túmulo de Raquel é mostrado na entrada norte de Belém, onde o peregrino de Bordéus, em 333, e Jerônimo já o viam; o edifício abobadado é otomano, ampliado por Moisés Montefiore em 1841 e agora cercado por muros e pela barreira de separação. Contudo Samuel situa o “túmulo de Raquel, na fronteira de Benjamim, em Zelza”, ao norte de Jerusalém, e Jeremias ouve Raquel chorar “em Ramá”; muitos estudiosos pensam, por isso, que a tradição mais antiga pôs o seu túmulo em Benjamim, e que as palavras “(também chamada Belém)” são uma glosa posterior. Outros sustentam que os textos podem ser conciliados. A questão está aberta."
    - "Hoje o Túmulo de Raquel fica na estrada de Hebrom, no limite de Belém, lugar de oração judaica acessado pelo lado de Jerusalém; a própria cidade é contada no artigo sobre Belém."
  de:
    - "Efrata, oder Ephratha, ist der ältere oder Bezirksname von Bethlehem in Juda, 8 km südlich von Jerusalem. Die Genesis gebraucht ihn für den Ort von Rahels Tod: „Und sie zogen von Beth-El. Und da noch ein Feld Weges war von Ephrath, da gebar Rahel“; sie „ward begraben an dem Wege gen Ephrath, das nun heißt Bethlehem. Und Jakob richtete ein Mal auf über ihrem Grabe“. Jakob wiederholt es Josef in Ägypten gegenüber: „und ich begrub sie daselbst an dem Wege Ephraths, das nun Bethlehem heißt“. Anderswo stehen beide Namen nebeneinander: David ist „jenes ephrathischen Mannes Sohn von Bethlehem-Juda“, und Micha sagt: „Und du Bethlehem Ephrata, die du klein bist unter den Städten in Juda“. In der Chronik ist Efrata Kalebs Frau und Hurs Mutter, dessen Nachkommen die „Väter“ von Bethlehem und Kirjat-Jearim waren: wohl der Name des Geschlechts der Hügel von Bethlehem."
    - "Das Grab Rahels wird am nördlichen Eingang von Bethlehem gezeigt, wo der Pilger von Bordeaux 333 und Hieronymus es bereits sahen; das Kuppelgebäude ist osmanisch, 1841 von Moses Montefiore erweitert und heute von Mauern und der Trennanlage umschlossen. Doch Samuel setzt „das Grab Rahels, in der Grenze Benjamins, zu Zelzah“ nördlich von Jerusalem an, und Jeremia hört Rahel weinen „zu Rama“; viele Gelehrte meinen daher, dass die älteste Überlieferung ihr Grab in Benjamin ansetzte und dass die Worte „das nun heißt Bethlehem“ eine spätere Glosse sind. Andere halten die Texte für vereinbar. Die Frage ist offen."
    - "Heute steht Rahels Grab an der Hebron-Straße am Rand von Bethlehem, ein Ort jüdischen Gebets, der von der Jerusalemer Seite aus erreicht wird; die Stadt selbst wird im Artikel über Bethlehem erzählt."
  fr:
    - "Éphrata, ou Éphratha, est le nom ancien ou de district de Bethléem de Juda, à 8 km au sud de Jérusalem. La Genèse l’emploie pour la mort de Rachel : « Ils partirent de Béthel ; et il y avait encore une certaine distance jusqu’à Éphrata, lorsque Rachel accoucha », puis elle « fut enterrée sur le chemin d’Éphrata, qui est Bethléhem. Jacob éleva un monument sur son sépulcre ». Jacob le répète à Joseph en Égypte : « c’est là que je l’ai enterrée, sur le chemin d’Éphrata, qui est Bethléhem ». Ailleurs, les deux vont de pair : David est « fils de cet Éphratien de Bethléhem de Juda » ; et Michée s’adresse à « Bethléhem Éphrata, petite entre les milliers de Juda ». Dans les Chroniques, Éphrata est une femme, épouse de Caleb et mère de Hur, dont les descendants furent les « pères » de Bethléem et de Kirjath-Jearim : sans doute le nom du clan des collines de Bethléem."
    - "Le tombeau de Rachel est montré à l’entrée nord de Bethléem, où le pèlerin de Bordeaux en 333 et Jérôme le voyaient déjà ; l’édifice à coupole est ottoman, agrandi par Moses Montefiore en 1841 et aujourd’hui enclos par des murs et par la barrière de séparation. Pourtant Samuel place « le sépulcre de Rachel, sur la frontière de Benjamin, à Tseltsach », au nord de Jérusalem, et Jérémie entend Rachel pleurer : « On entend des cris à Rama » ; beaucoup de spécialistes pensent donc que la plus ancienne tradition plaçait sa tombe en Benjamin, et que les mots « qui est Bethléhem » sont une glose tardive. D’autres tiennent que les textes peuvent se concilier. La question est ouverte."
    - "Aujourd’hui, le tombeau de Rachel se dresse sur la route d’Hébron, à la lisière de Bethléem, lieu de prière juive atteint depuis le côté de Jérusalem ; la ville elle-même est racontée dans l’article sur Bethléem."
  it:
    - "Efrat, o Efrata, è il nome più antico o distrettuale di Betlemme di Giuda, a 8 km a sud di Gerusalemme. La Genesi lo usa per il luogo della morte di Rachele: la famiglia di Giacobbe «partirono da Bethel; e c’era ancora qualche distanza per arrivare ad Efrata, quando Rachele partorì», ed ella «fu sepolta sulla via di Efrata; cioè di Bethlehem. E Giacobbe eresse un monumento sulla tomba di lei». Giacobbe lo ripete a Giuseppe in Egitto: «la seppellii quivi, sulla via di Efrata, che è Bethlehem». Altrove i due nomi stanno accanto: Davide è «figliuolo di quell’Efrateo di Bethlehem di Giuda»; e Michea si rivolge a «Bethlehem Efrata, piccola per essere tra i migliaia di Giuda». Nelle Cronache Efrat è una donna, moglie di Caleb e madre di Cur, i cui discendenti furono i «padri» di Betlemme e di Kiriat-Iearim: il nome, pare, del clan che teneva le alture di Betlemme."
    - "La tomba di Rachele è mostrata all’ingresso settentrionale di Betlemme, dove la vedevano già il pellegrino di Bordeaux nel 333 e Girolamo; l’edificio a cupola è ottomano, ampliato da Moses Montefiore nel 1841 e oggi racchiuso da mura e dalla barriera di separazione. Eppure Samuele pone «il sepolcro di Rachele, ai confini di Beniamino, a Tseltsah», a nord di Gerusalemme, e Geremia sente Rachele piangere «in Rama»; molti studiosi pensano perciò che la più antica tradizione ponesse la sua tomba in Beniamino, e che le parole «cioè di Bethlehem» siano una glossa posteriore. Altri ritengono che i testi si possano conciliare. La questione è aperta."
    - "Oggi la Tomba di Rachele si trova sulla strada di Ebron al margine di Betlemme, luogo di preghiera ebraica raggiunto dal lato di Gerusalemme; la città stessa è raccontata nell’articolo su Betlemme."
  pl:
    - "Efrata (hebr. Efrat, w dłuższej postaci Efratah) jest starszą nazwą lub nazwą okręgu Betlejem w Judzie, 8 km na południe od Jerozolimy. Księga Rodzaju używa jej dla miejsca śmierci Racheli: „Potem odeszli z Betel; i było jeszcze jakoby mila drogi do Efraty, i rodziła Rachel a ciężkie rodzenie miała”, a Rachel „pogrzebiona jest na drodze ku Efracie; tać jest Betlehem. I postawił Jakób znak nad grobem jej”. Jakub powtarza to Józefowi w Egipcie: „pogrzebłem ją tam przy drodze ku Efracie; a toć jest Betlehem”. Gdzie indziej obie nazwy stoją obok siebie: Dawid był „synem męża Efratejczyka z Betlehem Juda”, a Mika zwraca się do „Betlehemie Efrata! acześ najmniejszy między tysiącami Judzkimi”. W Księdze Kronik Efrata jest kobietą, żoną Kaleba i matką Chura, którego potomkowie byli „ojcami” Betlejem i Kiriat-Jearim: nazwa, jak się zdaje, rodu, który trzymał wzgórza Betlejem."
    - "Grób Racheli pokazuje się przy północnym wjeździe do Betlejem, gdzie widział go już pielgrzym z Bordeaux w 333 r. i Hieronim; budowla z kopułą jest osmańska, powiększona przez Mojżesza Montefiore w 1841 r. i otoczona dziś murami i barierą separacyjną. Jednak Samuel mówi o miejscu „u grobu Racheli, na granicach Benjamin w Selsa”, na północ od Jerozolimy, a Jeremiasz słyszy Rachelę płaczącą „w Rama”; wielu uczonych sądzi więc, że najstarsza tradycja umieszczała jej grób w Beniaminie, a słowa „tać jest Betlehem” są późniejszą glosą. Inni sądzą, że teksty można uzgodnić. Sprawa pozostaje otwarta."
    - "Grób Racheli stoi dziś przy drodze do Hebronu na skraju Betlejem, miejsce żydowskiej modlitwy, do którego dochodzi się od strony Jerozolimy; samo miasto opisuje artykuł o Betlejem."
  nl:
    - "Efrata, of Efratha, is de oudere of streeknaam van Bethlehem in Juda, 8 km ten zuiden van Jeruzalem. Genesis gebruikt het voor Rachels sterfplaats: “zij reisden van Beth-El; en er was nog een kleine streek lands om tot Efrath te komen; en Rachel baarde”, en zij “werd begraven aan den weg naar Efrath, hetwelk is Bethlehem. En Jakob richtte een gedenkteken op boven haar graf”. Jakob herhaalt het aan Jozef: “ik begroef haar aldaar aan den weg van Efrath, welke is Bethlehem”. Elders staan de twee namen naast elkaar: David is “de zoon van den Efrathischen man van Bethlehem-Juda”; en Micha zegt: “Bethlehem Efratha! zijt gij klein om te wezen onder de duizenden van Juda?” In Kronieken is Efrata een vrouw, Kalebs vrouw en moeder van Chur, wier nakomelingen de “vaders” van Bethlehem en Kirjat-Jearim waren: de naam, naar het schijnt, van de clan van de heuvels van Bethlehem."
    - "Rachels graf wordt getoond bij de noordelijke ingang van Bethlehem, waar de pelgrim van Bordeaux in 333 en Hieronymus het al zagen; het gebouw met de koepel is Ottomaans, in 1841 vergroot door Moses Montefiore en nu omsloten door muren en de scheidingsbarrière. Toch plaatst Samuël “het graf van Rachel, aan de landpale van Benjamin, te Zelzah”, ten noorden van Jeruzalem, en Jeremia hoort Rachel wenen “te Rama”; velen menen daarom dat de oudste overlevering haar graf in Benjamin plaatste en dat de woorden “hetwelk is Bethlehem” een latere glosse zijn. Anderen houden de teksten voor te verenigen. De vraag is open."
    - "Rachels Graf staat nu aan de weg naar Hebron aan de rand van Bethlehem, een plaats van Joods gebed die vanaf de kant van Jeruzalem bereikt wordt; de stad zelf wordt verteld in het artikel over Bethlehem."
  cs:
    - "Efrata, též Efrat, je starší nebo okresní jméno Betléma v Judsku, 8 km jižně od Jeruzaléma. Genesis je užívá pro místo smrti Ráchel: Jákobova rodina „brali se z Bethel, a bylo již nedaleko do Efraty. I porodila Ráchel, a těžkosti trpěla roděci“ a ona „pochována jest na cestě k Efratě, jenž jest Betlém. A postavil Jákob znamení pamětné nad hrobem jejím“. Jákob to opakuje Josefovi v Egyptě: „pochoval jsem ji tam u cesty k Efratě, jenž jest Betlém“. Jinde stojí obě jména vedle sebe: David je „syn muže Efratejského z Betléma Judova“ a Micheáš oslovuje „Betléme Efrata, jakžkoli jsi nejmenší mezi tisíci Judskými“. V Letopisech je Efrata žena, Kálebova manželka a matka Chúrova, jejíž potomci byli „otci“ Betléma a Kirjat-jearímu: jméno, jak se zdá, rodu, který držel betlémské pahorky."
    - "Hrob Ráchel se ukazuje u severního vchodu do Betléma, kde jej poutník z Bordeaux roku 333 i Jeroným již viděli; stavba s kupolí je osmanská, rozšířená Mosesem Montefiorem roku 1841 a nyní uzavřená zdmi a oddělovací bariérou. Samuel však klade hrob Ráchel „v končinách Beniamin v Zelzachu“, severně od Jeruzaléma, a Jeremjáš slyší Ráchel plakat: „Hlas v Ráma slyšán jest“; mnozí badatelé proto soudí, že nejstarší tradice kladla její hrob do Benjamína a že slova „jenž jest Betlém“ jsou pozdější glosa. Jiní tvrdí, že texty lze sladit. Otázka je otevřená."
    - "Dnes stojí Hrob Ráchel na hebronské silnici na okraji Betléma, místo židovské modlitby dostupné z jeruzalémské strany; samo město je vylíčeno v článku o Betlémě."
