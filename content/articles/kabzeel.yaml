# Overview article (ADR 0007). Mainstream facts only; the town is unlocated and the two candidates are given without choosing; Tel Ira's finds are reported as such.
id: kabzeel
place: a2715db
title:
  en: "Kabzeel"
  ru: "Кавцеил"
body:
  en:
    - "Kabzeel was a town of the Negeb, the first named in Joshua's list of “the uttermost cities of the tribe of the children of Judah toward the coast of Edom southward”, which crosses the dry country south of the Hebron hills. Its fame is its son. “Benaiah the son of Jehoiada, the son of a valiant man, of Kabzeel”, was one of David's heroes: “he slew two lionlike men of Moab: he went down also and slew a lion in the midst of a pit in time of snow”, and killed a huge Egyptian with the man's own spear. David set him over his bodyguard, the Cherethites and Pelethites; he stood by Solomon against Adonijah, executed Joab and became commander of the army. After the exile men of Judah lived again “at Jekabzeel, and in the villages thereof”, the same town under a fuller form of the name."
    - "The site is not known. Since the list seems to begin at the eastern end of the Negeb, toward Edom, Kabzeel is sought in the Beersheba–Arad basin, and two ruins are proposed: Khirbet Hora, north-east of Beersheba, and Tel Ira, a fortified hilltop town of the Iron Age south-east of it, excavated by Itzhaq Beit-Arieh in 1979–1987, which others take to be Ramah of the south; the name has not been found at either. Beyond its four mentions the town has no history."
    - "The basin is today the northern Negev of Israel, between Beersheba and Arad, with Bedouin towns such as Hura on the old ruin's ground and Tel Ira a bare hill above the Beersheba valley."
  ru:
    - "Кавцеил — город Негева, первый в списке Иисуса Навина городов «с края колена сынов Иудиных в смежности с Идумеею на юге», который охватывает сухую страну к югу от Хевронских гор. Слава города — его сын. «Ванея, сын Иодая, мужа храброго, великий по делам, из Кавцеила» был одним из храбрых Давида: «он поразил двух сыновей Ариила Моавитского; он же сошел и убил льва во рве в снежное время» и сразил рослого Египтянина его же копьём. Давид поставил его над своей стражей, Хелефеями и Фелефеями; он стоял за Соломона против Адонии, казнил Иоава и стал военачальником. После плена сыновья Иуды снова жили «в Иекавцеиле и селах его» — в том же городе под более полной формой имени."
    - "Место неизвестно. Поскольку список, по-видимому, начинается с восточного конца Негева, со стороны Едома, Кавцеил ищут в котловине между Вирсавией и Арадом, и предложены две руины: Хирбет-Хора к северо-востоку от Вирсавии и Тель-Ира, укреплённый город железного века на холме к юго-востоку, раскопанный Ицхаком Бейт-Арье в 1979–1987 годах, в котором другие видят Раму южную; имени не найдено ни там, ни там. Сверх четырёх упоминаний у города нет истории."
    - "Сегодня эта котловина — северный Негев Израиля между Беэр-Шевой и Арадом, с бедуинскими городами вроде Хуры на месте старой руины и Тель-Ирой, голым холмом над долиной Беэр-Шевы."
