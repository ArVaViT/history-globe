body:
  en:
    - "Kabzeel was a town of the Negeb, the first named in Joshua's list of “the uttermost cities of the tribe of the children of Judah toward the coast of Edom southward”, which crosses the dry country south of the Hebron hills. Its fame is its son. “Benaiah the son of Jehoiada, the son of a valiant man, of Kabzeel”, was one of David's heroes: “he slew two lionlike men of Moab: he went down also and slew a lion in the midst of a pit in time of snow”, and killed a huge Egyptian with the man's own spear. David set him over his bodyguard, the Cherethites and Pelethites; he stood by Solomon against Adonijah, executed Joab and became commander of the army. After the exile men of Judah lived again “at Jekabzeel, and in the villages thereof”, the same town under a fuller form of the name."
    - "The site is not known. Since the list seems to begin at the eastern end of the Negeb, toward Edom, Kabzeel is sought in the Beersheba–Arad basin, and two ruins are proposed: Khirbet Hora, north-east of Beersheba, and Tel Ira, a fortified hilltop town of the Iron Age south-east of it, excavated by Itzhaq Beit-Arieh in 1979–1987, which others take to be Ramah of the south; the name has not been found at either. Beyond its four mentions the town has no history."
    - "The basin is today the northern Negev of Israel, between Beersheba and Arad, with Bedouin towns such as Hura on the old ruin's ground and Tel Ira a bare hill above the Beersheba valley."
  ru:
    - "Кавцеил — город Негева, первый в списке Иисуса Навина городов «с края колена сынов Иудиных в смежности с Идумеею на юге», который охватывает сухую страну к югу от Хевронских гор. Слава города — его сын. «Ванея, сын Иодая, мужа храброго, великий по делам, из Кавцеила» был одним из храбрых Давида: «он поразил двух сыновей Ариила Моавитского; он же сошел и убил льва во рве в снежное время» и сразил рослого Египтянина его же копьём. Давид поставил его над своей стражей, Хелефеями и Фелефеями; он стоял за Соломона против Адонии, казнил Иоава и стал военачальником. После плена сыновья Иуды снова жили «в Иекавцеиле и селах его» — в том же городе под более полной формой имени."
    - "Место неизвестно. Поскольку список, по-видимому, начинается с восточного конца Негева, со стороны Едома, Кавцеил ищут в котловине между Вирсавией и Арадом, и предложены две руины: Хирбет-Хора к северо-востоку от Вирсавии и Тель-Ира, укреплённый город железного века на холме к юго-востоку, раскопанный Ицхаком Бейт-Арье в 1979–1987 годах, в котором другие видят Раму южную; имени не найдено ни там, ни там. Сверх четырёх упоминаний у города нет истории."
    - "Сегодня эта котловина — северный Негев Израиля между Беэр-Шевой и Арадом, с бедуинскими городами вроде Хуры на месте старой руины и Тель-Ирой, голым холмом над долиной Беэр-Шевы."
  uk:
    - "Кавцеїл було містом Негеву, першим названим у переліку Книги Ісуса Навина «міста на полуденньому краї поколїння Юдиного проти гряницї Ідумейської в полуденнїй країнї», що перетинає сухий край на південь від хевронських пагорбів. Його слава — його син. «Банея, син Йодая, мужа хороброго, великий дїлами, із Казеїла» був одним із героїв Давида: «Він убив двох синів Ариїла з Моабу. Раз, як упав снїг, убив він лева в ямі», і вбив велетня-єгиптянина його власним списом. Давид поставив його над своєю охороною, Хелетеями та Фелетеями; він став поруч із Соломоном проти Адонії, стратив Йоава й став начальником війська. Після вигнання юдеї знову жили «в Екавзеїлї й селах його», те саме місто з повнішою формою назви."
    - "Місце невідоме. Оскільки перелік, схоже, починається зі східного краю Негеву, в бік Едому, Кавцеїл шукають у басейні Беер-Шева — Арад, і пропонують дві руїни: Хірбет-Хора, на північний схід від Беер-Шеви, і Тель-Іра, укріплене гірське місто залізного віку на південний схід від неї, розкопане Іцхаком Бейт-Арьє в 1979–1987 роках, яке інші вважають Рамою півдня; назви не знайдено ні в одному. Крім чотирьох згадок, місто не має історії."
    - "Басейн сьогодні — північний Негев Ізраїлю між Беер-Шевою та Арадом, з бедуїнськими містами, як-от Хура, на ґрунті старої руїни, і Тель-Іра, голий пагорб над долиною Беер-Шеви."
  es:
    - "Cabseel era una población del Néguev, la primera nombrada en la lista de Josué de «las ciudades del término de la tribu de los hijos de Judá hacia el término de Edom al mediodía», que atraviesa el país seco al sur de las colinas de Hebrón. Su fama es su hijo. «Benaía hijo de Joiada, hijo de un varón esforzado, grande en hechos, de Cabseel» fue uno de los héroes de David: «hirió dos leones de Moab: y él mismo descendió, é hirió un león en medio de un foso en el tiempo de la nieve», y mató a un egipcio enorme con la lanza del propio hombre. David lo puso al frente de su guardia personal, los cereteos y peleteos; apoyó a Salomón contra Adonías, ejecutó a Joab y llegó a ser comandante del ejército. Después del destierro hombres de Judá vivieron de nuevo «en Jecabseel y sus aldeas», la misma población con una forma más plena del nombre."
    - "El sitio no se conoce. Como la lista parece empezar por el extremo oriental del Néguev, hacia Edom, Cabseel se busca en la cuenca de Beerseba–Arad, y se proponen dos ruinas: Khirbet Hora, al nordeste de Beerseba, y Tel Ira, una ciudad de cima fortificada de la Edad del Hierro al sudeste de ella, excavada por Itzhaq Beit-Arieh en 1979–1987, que otros toman por la Ramá del sur; el nombre no se ha hallado en ninguno. Más allá de sus cuatro menciones la población no tiene historia."
    - "La cuenca es hoy el norte del Néguev israelí, entre Beerseba y Arad, con ciudades beduinas como Hura en el terreno de la antigua ruina y Tel Ira como una colina desnuda sobre el valle de Beerseba."
  pt:
    - "Cabzeel era uma cidade do Neguebe, a primeira nomeada na lista de Josué “as cidades mais distantes da tribo dos filhos de Judá, em direção à fronteira de Edom, no Sul”, que atravessa a terra seca ao sul das colinas de Hebrom. Sua fama é seu filho. “Benaia, filho de Joiada, filho de um homem valente de Cabzeel”, foi um dos heróis de Davi: “matou os dois filhos de Ariel de Moabe. Ele também desceu e matou um leão no meio de uma cova em tempo de neve”, e matou um egípcio enorme com a própria lança dele. Davi o pôs à frente de sua guarda, os quereteus e peleteus; ficou ao lado de Salomão contra Adonias, executou Joabe e tornou-se comandante do exército. Depois do exílio, homens de Judá viveram de novo “em Jecabzeel e suas aldeias”, a mesma cidade sob uma forma mais plena do nome."
    - "O sítio não é conhecido. Como a lista parece começar na extremidade oriental do Neguebe, rumo a Edom, Cabzeel é procurada na bacia de Berseba–Arade, e duas ruínas são propostas: Khirbet Hora, a nordeste de Berseba, e Tel Ira, uma cidade de colina fortificada da Idade do Ferro a sudeste dela, escavada por Itzhaq Beit-Arieh em 1979–1987, que outros tomam por Ramá do Sul; o nome não foi achado em nenhum dos dois. Além de suas quatro menções, a cidade não tem história."
    - "A bacia é hoje o norte do Neguebe, em Israel, entre Berseba e Arade, com cidades beduínas como Hura no terreno da velha ruína e Tel Ira, uma colina nua acima do vale de Berseba."
  de:
    - "Kabzeel war eine Stadt im Negev, die erste in Josuas Liste: „Und die Städte des Stammes der Kinder Juda von einer Ecke zu der andern, an der Grenze der Edomiter gegen Mittag, waren diese: Kabzeel“; die Liste durchquert das trockene Land südlich der Hebroner Berge. Ihr Ruhm ist ihr Sohn. „Benaja, der Sohn Jojadas, des Sohnes Is-Hails, von großen Taten, von Kabzeel“, war einer von Davids Helden: Er „schlug zwei Helden der Moabiter und ging hinab und schlug einen Löwen im Brunnen zur Schneezeit“ und erschlug einen riesigen Ägypter mit dessen eigenem Speer. David setzte ihn über seine Leibwache, die Krether und Plether; er stand Salomo gegen Adonija bei, richtete Joab hin und wurde Heerführer. Nach dem Exil wohnten Judäer wieder „zu Kabzeel und seinen Ortschaften“, im Hebräischen Jekabzeel, dieselbe Stadt in einer volleren Namensform."
    - "Die Stätte ist nicht bekannt. Da die Liste am östlichen Ende des Negev, zu Edom hin, zu beginnen scheint, wird Kabzeel im Becken von Beerscheba und Arad gesucht, und zwei Ruinen sind vorgeschlagen: Chirbet Hora nordöstlich von Beerscheba und Tel Ira, eine befestigte eisenzeitliche Bergstadt südöstlich davon, 1979–1987 von Itzhaq Beit-Arie ausgegraben, die andere für Rama im Süden halten; der Name wurde an keiner von beiden gefunden. Über seine vier Erwähnungen hinaus hat die Stadt keine Geschichte."
    - "Das Becken ist heute der nördliche Negev Israels zwischen Beerscheba und Arad, mit Beduinenstädten wie Hura auf dem Boden der alten Ruine und Tel Ira, einem kahlen Hügel über dem Beerschebatal."
  fr:
    - "Kabtséel était une ville du Négev, la première de la liste de Josué des « villes situées dans la contrée du midi, à l’extrémité de la tribu des fils de Juda, vers la frontière d’Édom », qui traverse le pays aride au sud des collines d’Hébron. Sa gloire est son fils. « Benaja, fils de Jehojada, fils d’un homme de Kabtseel, rempli de valeur et célèbre par ses exploits », fut un héros de David : « Il frappa les deux lions de Moab. Il descendit au milieu d’une citerne, où il frappa un lion, un jour de neige », et tua un Égyptien formidable avec sa propre lance. David le mit à la tête de sa garde, les Kéréthiens et les Péléthiens ; il se tint aux côtés de Salomon contre Adonija, exécuta Joab et devint chef de l’armée. Après l’exil, des Judéens s’établirent de nouveau « à Jekabtseel et dans les villages de son ressort », la même ville sous une forme complète du nom."
    - "Le site n’est pas connu. Comme la liste semble commencer à l’extrémité orientale du Négev, vers Édom, on cherche Kabtséel dans le bassin de Beer-Schéba–Arad, et deux ruines sont proposées : Khirbet Hora, au nord-est de Beer-Schéba, et Tel Ira, ville fortifiée de colline de l’âge du Fer au sud-est, fouillée par Itzhaq Beit-Arieh en 1979–1987, que d’autres tiennent pour Rama du midi ; le nom n’a été trouvé en aucun des deux. Au-delà de ses quatre mentions, la ville n’a pas d’histoire."
    - "Le bassin est aujourd’hui le nord du Négev israélien, entre Beer-Schéba et Arad, avec des villes bédouines comme Hura sur le terrain de l’ancienne ruine et Tel Ira, colline nue au-dessus de la vallée de Beer-Schéba."
  pl:
    - "Kabseel było miastem Negewu, pierwszym wymienionym w wykazie Jozuego, w którym czytamy: „I były miasta w granicach pokolenia synów Judowych podle granicy Edom ku południowi: Kabseel”, przecinającym suchy kraj na południe od wzgórz Hebronu. Jego sławą jest jego syn. „Banajas też syn Jojady, syn męża rycerskiego, zacny w swych sprawach, z Kabseel” był jednym z bohaterów Dawida: „ten zabił dwóch mocarzów Moabskich, tenże szedłszy zabił lwa w pośrodku studni, we dni śnieżne”, i zabił olbrzymiego Egipcjanina jego własną włócznią. Dawid ustanowił go nad swoją strażą przyboczną, Keretytami i Peletytami; stanął po stronie Salomona przeciw Adoniaszowi, kazał stracić Joaba i został dowódcą wojska. Po wygnaniu mężowie Judy znów mieszkali „w Jekabseel i we wsiach jego”, w tym samym mieście pod pełniejszą formą nazwy."
    - "Miejsce nie jest znane. Ponieważ wykaz zdaje się zaczynać na wschodnim krańcu Negewu, ku Edomowi, Kabseel szuka się w basenie Beer-Szeby i Aradu, a proponuje się dwie ruiny: Chirbet Chora, na północny wschód od Beer-Szeby, i Tel Ira, obwarowane miasto na wzgórzu z epoki żelaza na południowy wschód od niej, badane przez Icchaka Beit-Arie w latach 1979–1987, które inni biorą za Ramę w Negewie; nazwy nie znaleziono w żadnym z nich. Poza czterema wzmiankami miasto nie ma dziejów."
    - "Basen to dziś północny Negew w Izraelu, między Beer-Szebą a Aradem, z beduińskimi miastami, jak Chura, na gruncie dawnej ruiny, i z Tel Ira, nagim wzgórzem nad doliną Beer-Szeby."
  it:
    - "Cabseel era una città del Negheb, la prima nominata nell’elenco di Giosuè delle «città poste all’estremità della tribù dei figliuoli di Giuda, verso il confine di Edom, dal lato di mezzogiorno», che attraversa la terra arida a sud delle colline di Ebron. La sua fama è suo figlio. «Benaia, figliuolo di Jehoiada, figliuolo di un uomo da Kabtseel, valoroso», fu uno degli eroi di Davide: «Egli uccise i due grandi eroi di Moab. Discese anche in mezzo a una cisterna, dove uccise un leone, un giorno di neve», e uccise un enorme Egiziano con la sua stessa lancia. Davide lo pose a capo della guardia del corpo, i Cheretei e i Peletei; stette con Salomone contro Adonia, mise a morte Ioab e divenne comandante dell’esercito. Dopo l’esilio uomini di Giuda vissero di nuovo «in Jekabtseel e ne’ villaggi che ne dipendevano», la stessa città sotto una forma più piena del nome."
    - "Il sito non è noto. Poiché l’elenco sembra cominciare all’estremità orientale del Negheb, verso Edom, Cabseel si cerca nel bacino di Bersabea-Arad, e sono proposte due rovine: Khirbet Hora, a nord-est di Bersabea, e Tel Ira, una città collinare fortificata dell’età del Ferro a sud-est di essa, scavata da Itzhaq Beit-Arieh nel 1979–1987, che altri ritengono la Rama del sud; il nome non è stato trovato in nessuna delle due. Oltre alle sue quattro menzioni la città non ha storia."
    - "Il bacino è oggi il Negheb settentrionale d’Israele, fra Bersabea e Arad, con città beduine come Hura sul terreno dell’antica rovina e Tel Ira un’arida altura sopra la valle di Bersabea."
  nl:
    - "Kabseël was een stad in de Negev, de eerste genoemd in Jozua’s lijst van “De steden nu, van het uiterste van den stam der kinderen van Juda tot de landpale van Edom, tegen het zuiden”, die het droge land ten zuiden van de heuvels van Hebron doorkruist. De roem van de stad is haar zoon. “Benaja, de zoon van Jojada, de zoon van een dapperen man, groot van daden, van Kabzeel”, was een van Davids helden: “die sloeg twee sterke leeuwen van Moab; ook ging hij af, en sloeg een leeuw in het midden van een kuil in den sneeuwtijd”, en doodde een reusachtige Egyptenaar met diens eigen spies. David stelde hem over zijn lijfwacht, de Krethi en Plethi; hij stond Salomo bij tegen Adonia, liet Joab doden en werd bevelhebber van het leger. Na de ballingschap woonden mannen van Juda weer “in Jekabzeel en haar dorpen”, dezelfde stad onder een voller vorm van de naam."
    - "De plaats is onbekend. Omdat de lijst lijkt te beginnen aan het oostelijke einde van de Negev, richting Edom, wordt Kabseël gezocht in het bekken Berseba–Arad, en twee ruïnes zijn voorgesteld: Khirbet Hora, ten noordoosten van Berseba, en Tel Ira, een versterkte heuveltop-stad uit de IJzertijd ten zuidoosten daarvan, door Itzhaq Beit-Arieh opgegraven in 1979–1987, die anderen houden voor Rama van het zuiden; de naam is op geen van beide gevonden. Buiten haar vier vermeldingen heeft de stad geen geschiedenis."
    - "Het bekken is nu de noordelijke Negev van Israël, tussen Berseba en Arad, met bedoeïenensteden zoals Hura op de grond van de oude ruïne en Tel Ira als kale heuvel boven de vallei van Berseba."
  cs:
    - "Kabceel bylo město v Negevu, první jmenované v Jozuově seznamu „Tato pak jsou města v končinách pokolení synů Juda, podlé pomezí Edom na poledne“, který prochází suchou zemí jižně od hebronských hor. Jeho slávou je jeho syn. „Banaiáš také syn Joiadův, syn muže udatného, velikých činů, z Kabsael“ byl jedním z Davidových hrdinů: „ten porazil dva reky Moábské. Tentýž sstoupiv, zabil lva v jámě, když byl sníh“, a zabil obrovitého Egypťana jeho vlastním kopím. David jej ustanovil nad svou tělesnou stráží, Keretejskými a Peletejskými; stál při Šalomounovi proti Adonijášovi, popravil Joába a stal se velitelem vojska. Po exilu žili Judovci opět „v Jekabsael i ve vsech jeho“, totéž město pod plnější podobou jména."
    - "Poloha není známa. Protože seznam zdá se začínat na východním konci Negevu, směrem k Edómu, hledá se Kabceel v pánvi Beer-šeba–Arad a navrhovány jsou dvě zříceniny: Chirbet Chora, severovýchodně od Beer-šeby, a Tel Ira, opevněné městečko na vrcholu pahorku z doby železné jihovýchodně od ní, vykopávané Jicchakem Bejt-Arie v letech 1979–1987, které jiní pokládají za Rámu jižní; jméno nebylo nalezeno na žádném. Mimo své čtyři zmínky nemá město historii."
    - "Pánev je dnes severní Negev v Izraeli, mezi Beer-šebou a Aradem, s beduínskými městy jako Hura na půdě staré zříceniny a Tel Ira holým pahorkem nad údolím Beer-šeby."
  sv:
    - "Kabseel var en stad i Negev, den första som nämns i Josuas förteckning över ”de städer som lågo ytterst i Juda barns stam, mot Edoms gräns, i Sydlandet”, vilken löper över det torra landet söder om Hebrons berg. Dess berömmelse är sonen. ”Benaja, son till Jojada, som var son till en tapper, segerrik man från Kabseel”, var en av Davids hjältar: ”han slog ned de två Arielerna i Moab, och det var han som en snövädersdag steg ned och slog ihjäl lejonet i brunnen”, och han dräpte en jättelik egyptier med mannens eget spjut. David satte honom över sin livvakt, keretéerna och peletéerna; han ställde sig vid Salomos sida mot Adonia, lät avrätta Joav och blev härens överbefälhavare. Efter exilen bodde Juda män åter ”i Jekabseel och dess byar”, samma stad under en fylligare namnform."
    - "Platsen är okänd. Eftersom förteckningen tycks börja i Negevs östra ände, mot Edom, söks Kabseel i bäckenet Beer Sheva–Arad, och två ruiner föreslås: Khirbet Hora, nordost om Beer Sheva, och Tel Ira, en befäst kullstad från järnåldern sydost om den, utgrävd av Itzhaq Beit-Arieh 1979–1987, som andra håller för Rama i söder; namnet har inte påträffats vid någon av dem. Utöver de fyra omnämnandena har staden ingen historia."
    - "Bäckenet är i dag norra Negev i Israel, mellan Beer Sheva och Arad, med beduinstäder som Hura på den gamla ruinens mark och Tel Ira, en kal kulle ovanför Beer Sheva-dalen."
  nb:
    - "Kabseel var en by i Negev, den første som nevnes i Josvas liste over «byene ved den ytterste grense av Judas barns stamme mot Edoms landemerke, i sydlandet», som krysser det tørre landet sør for Hebron-åsene. Den er kjent for sin sønn. «Benaja, sønn av Jojada, som var sønn av en djerv seierrik stridsmann fra Kabse'el», var en av Davids helter: «han slo Moabs to løvehelter. En dag det hadde snedd, steg han ned i en brønn og slo ihjel en løve», og han drepte en kjempestor egypter med mannens eget spyd. David satte ham over livvakten, kretere og peletere; han stod Salomo bi mot Adonja, henrettet Joab og ble hærfører. Etter eksilet bodde menn fra Juda igjen «i Jekabse'el og dets landsbyer», den samme byen under en fyldigere navneform."
    - "Stedet er ukjent. Siden listen later til å begynne i den østlige enden av Negev, mot Edom, søkes Kabseel i bassenget Beer-Sjeba–Arad, og to ruiner foreslås: Khirbet Hora, nordøst for Beer-Sjeba, og Tel Ira, en befestet høydeby fra jernalderen sørøst for den, utgravd av Itzhaq Beit-Arieh i 1979–1987, som andre mener er Rama i sør; navnet er ikke funnet på noen av dem. Utover de fire omtalene har byen ingen historie."
    - "Bassenget er i dag det nordlige Negev i Israel, mellom Beer-Sjeba og Arad, med beduinbyer som Hura på den gamle ruinens grunn, og Tel Ira er en bar høyde over Beer-Sjeba-dalen."
  tl:
    - "Ang Cabseel ay bayan ng Negeb, una sa talaan ni Josue ng “mga kaduluduluhang bayan ng lipi ng mga anak ni Juda sa dako ng hangganan ng Edom sa timugan”, na sumasaklaw sa tuyong lupain sa timog ng mga burol ng Hebron. Tanyag ito dahil sa anak nito. “Benaia, na anak ni Joiada, na anak ng matapang na lalake na taga Cabseel”, ay isa sa mga bayani ni David: “pinatay ang dalawang anak ni Ariel na taga Moab; siya'y lumusong din at pumatay ng isang leon sa gitna ng isang hukay sa kapanahunan ng niebe”, at pinatay ang isang higanteng Egipcio sa sariling sibat nito. Inilagay siya ni David sa mga tanod, ang mga Cerethita at Pelethita; kinampihan niya si Salomon laban kay Adonia, pinatay si Joab at naging pinuno ng hukbo. Pagkatapos ng pagkatapon ay tumahan muli ang mga taga-Juda “sa Jecabzeel at sa mga nayon niyaon”, gayon ding bayan sa mas buong anyo ng pangalan."
    - "Hindi alam ang pook. Yamang waring nagsisimula ang talaan sa silangang dulo ng Negeb, patungong Edom, hinahanap ang Cabseel sa palanggana ng Beer-seba–Arad, at dalawang guho ang iminumungkahi: ang Khirbet Hora, sa hilagang-silangan ng Beer-seba, at ang Tel Ira, isang kutang bayan sa tuktok ng burol noong Panahon ng Bakal sa timog-silangan nito, na hinukay ni Itzhaq Beit-Arieh noong 1979–1987 at itinuturing ng iba na Rama ng timog; hindi natagpuan ang pangalan sa alinman. Bukod sa apat na pagbanggit dito, walang kasaysayan ang bayan."
    - "Ang palanggana ay ngayon ang hilagang Negev ng Israel, sa pagitan ng Beer-seba at Arad, na may mga bayang Bedouin tulad ng Hura sa lupa ng lumang guho at ang Tel Ira bilang hubad na burol sa itaas ng libis ng Beer-seba."
  da:
    - "Kabse'el var en by i Negev, den første nævnt i Josvas liste over »Stæderne ved Enden af Judas Børns Stamme op mod Edoms Landemærke Sønder paa«, der krydser det tørre land syd for Hebrons højland. Dens berømmelse er dens søn. »Benaja, Jojadas Søn, var en stridbar Mands Søn, stor i Gerninger, fra Kabzeel«, var en af Davids helte: »han slog to Løvehelte af Moabiterne, og han gik ned og slog en Løve midt i en Brønd en Dag, da der var Sne«, og han dræbte en vældig egypter med mandens eget spyd. David satte ham over sin livvagt, keretitterne og peletitterne; han stod ved Salomons side mod Adonija, lod Joab henrette og blev øverstkommanderende for hæren. Efter eksilet boede Judas mænd igen »i Jekabzeel og dens Landsbyer«, den samme by under en fyldigere form af navnet."
    - "Stedet kendes ikke. Da listen synes at begynde i den østlige ende af Negev, mod Edom, søges Kabse'el i bækkenet Beersheba–Arad, og to ruiner foreslås: Khirbet Hora, nordøst for Beersheba, og Tel Ira, en befæstet bjergby fra jernalderen sydøst for den, udgravet af Itzhaq Beit-Arieh i 1979–1987, som andre tager for at være Rama i Negev; navnet er ikke fundet nogen af stederne. Ud over sine fire omtaler har byen ingen historie."
    - "Bækkenet er i dag det nordlige Negev i Israel, mellem Beersheba og Arad, med beduinbyer som Hura på den gamle ruins grund og Tel Ira, en bar høj over Beershebadalen."
  sr:
    - "Кавсеил је био град у Негеву, први наведен у списку Исуса Навина међу „градови по крајевима племена синова Јудиних, дуж међе едомске к југу“, који прелази суху земљу јужно од хевронских брда. Прославио га је његов син. „Венаја син Јодајев, син човека јунака, велик делима, из Кавсеила“ био је један од Давидових јунака: „погуби два јунака моавска, и сишав уби лава у јами кад беше снег“, а убио је и огромног Египћанина његовим сопственим копљем. Давид га је поставио над својим телохранитељима, Херетејима и Фелетејима; он је стао уз Соломуна против Адоније, погубио Јоава и постао заповедник војске. После изгнанства Јудејци су поново живели „у Јекавсеилу и селима његовим“, у истом граду под потпунијим обликом имена."
    - "Налазиште није познато. Пошто се чини да списак почиње на источном крају Негева, према Едому, Кавсеил се тражи у басену Вирсавеја–Арад, и предлажу се две рушевине: Хирбет Хора, североисточно од Вирсавеје, и Тел Ира, утврђени град на брду из гвозденог доба југоисточно од ње, који је 1979–1987. ископавао Ицхак Бејт-Арије, а други га узимају за Раму јужну; име није нађено ни на једном од та два места. Осим четири помена, град нема историју."
    - "Басен је данас северни Негев у Израелу, између Вирсавеје и Арада, с бедуинским градовима као што је Хура на тлу древне рушевине, док је Тел Ира гола узвишица изнад долине Вирсавеје."
  hu:
    - "Kabceél a Negev egyik városa volt, az első, amelyet Józsué jegyzéke megnevez; ez így kezdődik: „A Júda fiai nemzetségének városai pedig a déli végtől kezdve Edom határa felé valának”, és a Hebroni-hegyvidéktől délre fekvő száraz vidéken halad át. Hírét a fiának köszönheti. „Benája, a Jojada fia, vitéz férfiúnak fia Kabséelből” Dávid hőseinek egyike volt: „ő ölte meg Moáb két oroszlánját, és ő méne alá a verembe, s ölte meg az oroszlánt, mikor havas idő volt”, és megölt egy óriási egyiptomit is a férfi saját dárdájával. Dávid a testőrsége, a keretiek és peletiek fölé tette; Salamon mellett állt Adónia ellen, kivégezte Joábot, és a hadsereg parancsnoka lett. A száműzetés után Júda fiai ismét laktak „Jekabseélben és faluiban”, ugyanabban a városban, a név teljesebb alakja alatt."
    - "A hely ismeretlen. Mivel a jegyzék a Negev keleti végén, Edom felől látszik kezdődni, Kabceélt a Beérseba–Arád-medencében keresik, és két romot javasolnak: a Beérsebától északkeletre fekvő Khirbet Horát és a tőle délkeletre eső Tel Írát, egy vaskori erődített hegytetői várost, amelyet Itzhaq Beit-Arieh ásott 1979 és 1987 között, és amelyet mások a déli Rámának tartanak; a nevet egyik helyen sem találták meg. A négy említésen túl a városnak nincs története."
    - "A medence ma Izrael északi Negevje Beérseba és Arád között, az egykori rom helyén beduin településekkel, például Hurával, a Tel Írá pedig kopár domb a beérsebai völgy fölött."
  fi:
    - "Kabseel oli Negevin kaupunki, Joosuan luettelon ensimmäinen: ”Juudan jälkeläisten sukukunnan etäisimmät kaupungit Edomin rajalla Etelämaassa” ulottuvat Hebronin kukkuloiden eteläpuolisen kuivan maan poikki. Sen maine on sen poika. ”Benaja, Joojadan poika, joka oli urhoollisen ja suurista teoistaan kuuluisan miehen poika, oli kotoisin Kabseelista”, ja hän oli yksi Daavidin sankareista: ”Hän surmasi ne kaksi mooabilaista sankaria, ja hän laskeutui alas ja tappoi lumituiskun aikana leijonan kaivoon”, ja hän tappoi valtavan egyptiläisen tämän omalla keihäällä. Daavid asetti hänet henkivartiostonsa, kreettien ja pleettien, päälliköksi; hän seisoi Salomon rinnalla Adoniaa vastaan, teloitti Jooabin ja tuli sotaväen päälliköksi. Pakkosiirtolaisuuden jälkeen juudalaiset asuivat taas ”Jekabseelissa ja siihen kuuluvissa kylissä”, samassa kaupungissa nimen täydemmässä muodossa."
    - "Paikkaa ei tunneta. Koska luettelo näyttää alkavan Negevin itäpäästä, Edomia kohti, Kabseelia etsitään Beerseban ja Aradin altaasta, ja ehdolla on kaksi raunioita: Khirbet Hora Beersebasta koilliseen sekä Tel Ira, rautakauden linnoitettu kukkulakaupunki sen kaakkoispuolella, jonka Itzhaq Beit-Arieh kaivoi vuosina 1979–1987 ja jonka toiset pitävät Etelän Ramana; nimeä ei ole löydetty kummastakaan. Neljää mainintaa lukuun ottamatta kaupungilla ei ole historiaa."
    - "Allas on nykyään Israelin pohjoista Negeviä Beerseban ja Aradin välillä; vanhan raunion maalla on beduiinikaupunkeja kuten Hura, ja Tel Ira on paljas kukkula Beerseban laakson yläpuolella."
  vi:
    - "Cáp-xê-ên là một thành của Nê-ghép, được nêu đầu tiên trong danh sách của Giô-suê về “các thành ở đầu cùng chi phái Giu-đa, về phía ranh Ê-đôm tại miền nam”, danh sách chạy ngang vùng đất khô phía nam các đồi Hếp-rôn. Thành nổi tiếng nhờ con trai của mình. “Bê-na-gia ở Cáp-sê-ên, con trai của Giê-hô-gia-đa, là một người mạnh bạo” là một trong các dõng sĩ của Đa-vít: ông “giết hai người Mô-áp mạnh bạo hơn hết. Trong một ngày tuyết kia, ấy cũng người nầy đi xuống một cái hầm chứa nước, có con sư tử, và giết nó đi”, và giết một người Ai Cập khổng lồ bằng chính cây giáo của hắn. Đa-vít đặt ông coi đội vệ binh, những người Kê-rê-thít và Phê-lê-thít; ông đứng về phía Sa-lô-môn chống A-đô-ni-gia, hành quyết Giô-áp và trở thành tổng chỉ huy quân đội. Sau thời lưu đày, người Giu-đa lại ở “tại Giê-cáp-xê-ên và các làng nó”, tức cùng một thành dưới dạng tên đầy đủ hơn."
    - "Địa điểm không được biết. Vì danh sách dường như bắt đầu từ đầu phía đông của Nê-ghép, về phía Ê-đôm, nên người ta tìm Cáp-xê-ên trong vùng trũng Bê-e-Sê-ba–A-rát, và hai di tích được đề nghị: Khirbet Hora, phía đông bắc Bê-e-Sê-ba, và Tel Ira, một thị trấn kiên cố trên đỉnh đồi thời Đồ Sắt ở phía đông nam, do Itzhaq Beit-Arieh khai quật năm 1979–1987, mà những người khác cho là Ra-ma ở miền nam; tên thành chưa được tìm thấy ở nơi nào. Ngoài bốn lần được nhắc đến, thành không có lịch sử nào khác."
    - "Vùng trũng ngày nay là miền bắc Negev của Israel, giữa Bê-e-Sê-ba và A-rát, với các thị trấn Bedouin như Hura trên nền di tích cũ và Tel Ira là một ngọn đồi trơ trọi phía trên thung lũng Bê-e-Sê-ba."
  ro:
    - "Cabțeel era o cetate din Neghev, cea dintâi numită în lista lui Iosua a celor mai îndepărtate cetăți ale seminției fiilor lui Iuda spre hotarul Edomului, la sud, listă care străbate ținutul uscat de la sud de dealurile Hebronului. Faima ei este fiul ei. „Vanaia feciorul lui Iodae fecior de viteaz, multe sunt faptele lui din Kavasail” a fost unul dintre vitejii lui David: „acesta a ucis pre doi foarte tari Moaviteni, și el s’a pogorît de a ucis pre leu în groapă într’o zi cu zăpadă”, și a omorât un egiptean uriaș cu propria lui suliță. David l-a pus peste garda sa, cheretiții și peletiții; el a stat de partea lui Solomon împotriva lui Adonia, l-a executat pe Ioab și a devenit comandantul armatei. După exil, oamenii lui Iuda au locuit din nou „în Kavziil și în satele lui”, aceeași cetate sub o formă mai plină a numelui."
    - "Locul nu este cunoscut. Deoarece lista pare să înceapă de la capătul estic al Neghevului, spre Edom, Cabțeel este căutată în bazinul Beer-Șeba–Arad, iar două ruine sunt propuse: Khirbet Hora, la nord-est de Beer-Șeba, și Tel Ira, un oraș fortificat de pe un vârf de deal din epoca fierului, la sud-est de ea, excavat de Itzhaq Beit-Arieh în 1979–1987, pe care alții îl socotesc Rama din sud; numele nu a fost găsit la niciunul. În afara celor patru mențiuni ale sale, cetatea nu are istorie."
    - "Bazinul este astăzi nordul Negevului israelian, între Beer-Șeba și Arad, cu orașe beduine precum Hura pe terenul vechii ruine, iar Tel Ira este un deal gol deasupra văii Beer-Șeba."
  bg:
    - "Кавцеил е бил град в Негев, първият, назован в списъка на Иисус Навин на „най-крайните градове в племето на Юдините синове към пределите на Едом към пладне“, който обхваща сухата земя на юг от Хевронските възвишения. Славата му е неговият син. „Ваная Иодаевът син, син на силен мъж, от Кавсеил“, е бил един от героите на Давид: „той порази двамата лъвовидни Моавски мъже. Той още слезе та порази лъв всред рова в снежен ден“, и уби огромен египтянин със собственото му копие. Давид го постави над телохранителите си, херетите и фелетите; той застана на страната на Соломон срещу Адония, екзекутира Йоав и стана началник на войската. След изгнанието юдеи отново живееха „в Кавсеил и по селата му“ — в еврейския текст Йекавцеил, по-пълна форма на името на същия град."
    - "Мястото не е известно. Тъй като списъкът изглежда започва от източния край на Негев, към Едом, Кавцеил се търси в котловината Вирсавия–Арад и се предлагат две развалини: Хирбет Хора, североизточно от Вирсавия, и Тел Ира — укрепен град от желязната епоха на хълм югоизточно от нея, разкопан от Ицхак Бейт-Арие през 1979–1987 г., който други смятат за Рама на юга; името не е открито на нито едно от двете места. Освен четирите си споменавания градът няма история."
    - "Днес котловината е северният Негев в Израел, между Вирсавия и Арад, с бедуински градове като Хура на мястото на старата развалина, а Тел Ира е гол хълм над долината на Вирсавия."
