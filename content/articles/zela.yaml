title:
  en: "Zela"
  ru: "Цела"
  uk: "Цела"
  es: "Sela"
  pt: "Zela"
  de: "Zela"
  fr: "Tséla"
body:
  en:
    - "Zela, or Zelah, was a town of Benjamin, listed among its fourteen cities with Jerusalem: “And Zelah, Eleph, and Jebusi, which is Jerusalem, Gibeath, and Kirjath”. Some read the first two names as one, Zela-haeleph. Its one moment in the story comes at the end of Saul's line. After the Gibeonites had hanged seven of Saul's descendants and Rizpah had kept watch over their bodies, David fetched the bones of Saul and Jonathan from Jabesh-gilead, and “the bones of Saul and Jonathan his son buried they in the country of Benjamin in Zelah, in the sepulchre of Kish his father”. Zela was thus the burial place of Saul's family, though Gibeah is the town most linked with him."
    - "Beyond this nothing is known. The town has not been located; the map's leading candidate is Khirbet Salah on the western edge of modern Jerusalem, with Khirbet Erha and Khirbet Shab Salah to the north as alternatives, but none has been excavated or tied to the name with certainty, and the tomb of Kish has never been found."
  ru:
    - "Цела — город Вениамина, названный среди четырнадцати его городов вместе с Иерусалимом: «Цела, Елеф и Иевус, иначе Иерусалим, Гивеаф и Кириаф». Некоторые читают два первых имени как одно, Цела-Гаелеф. Единственный его час в истории приходится на конец рода Саула. После того как гаваонитяне повесили семерых потомков Саула, а Рицпа стерегла их тела, Давид взял кости Саула и Ионафана у жителей Иависа Галаадского, «и похоронили кости Саула и Ионафана, сына его, в земле Вениаминовой, в Цела, во гробе Киса, отца его». Так Цела оказывается местом погребения семьи Саула, хотя с ним самим больше всего связана Гива."
    - "Больше ничего не известно. Город не найден; главный кандидат на карте — Хирбет-Салах на западной окраине нынешнего Иерусалима, а также Хирбет-Эрха и Хирбет-Шаб-Салах севернее, но ни одно из этих мест не раскопано и не связано с именем надёжно, а гробница Киса так и не обнаружена."
  uk:
    - "Цела, або Целах, була містом Веніяміна, перелічена серед його чотирнадцяти міст з Єрусалимом: «Цела, Елеф та Евусі, се Ерусалим; Гибеат та Кират». Дехто читає перші два імені як одне, Цела-ха-Елеф. Її єдина мить у розповіді настає наприкінці роду Саула. Після того як гаваонітяни повісили сімох нащадків Саула, а Ріцпа вартувала над їхніми тілами, Давид забрав кістки Саула й Йонатана з Явісу Гілеадського, і «поховали костї Саулові й сина його Йонатана й костї повішених, у займищі Беняминовому, у Зелї, в отецькому Кисовому гробі». Отже, Цела була місцем поховання родини Саула, хоч місто, найбільше з ним пов’язане, — Гіва."
    - "Понад це нічого не відомо. Місто не локалізовано; провідний кандидат мапи — Хірбет-Салах на західному краю сучасного Єрусалима, з Хірбет-Ерха й Хірбет-Шаб-Салах на північ як альтернативами, але жодне не розкопане і не пов’язане з назвою з певністю, і гробницю Кіша так і не знайдено."
  es:
    - "Sela, o Zela, era una ciudad de Benjamín, enumerada entre sus catorce ciudades con Jerusalén: «Y Sela, Eleph, Jebus, que es Jerusalem, Gibeath, y Chîriath». Algunos leen los dos primeros nombres como uno solo, Sela-haeleph. Su único momento en el relato llega al final del linaje de Saúl. Después de que los gabaonitas ahorcaron a siete descendientes de Saúl y Rizpa veló sus cuerpos, David fue a buscar los huesos de Saúl y Jonatán a Jabes de Galaad, y «sepultaron los huesos de Saúl y los de su hijo Jonathán en tierra de Benjamín, en Sela, en el sepulcro de Cis su padre». Sela fue así el lugar de sepultura de la familia de Saúl, aunque Gabaa es la ciudad más vinculada a él."
    - "Fuera de esto nada se sabe. La ciudad no ha sido localizada; el principal candidato del mapa es Khirbet Salah, en el borde occidental de la Jerusalén moderna, con Khirbet Erha y Khirbet Shab Salah, al norte, como alternativas, pero ninguno ha sido excavado ni vinculado con certeza al nombre, y la tumba de Cis nunca se ha hallado."
  pt:
    - "Zela, ou Zelá, era uma cidade de Benjamim, listada entre suas catorze cidades com Jerusalém: “Zela, Elefe, a cidade dos jebuseus (também chamada Jerusalém), Gibeá e Quiriate”. Alguns leem os dois primeiros nomes como um só, Zela-Haelefe. Seu único momento na história vem no fim da linhagem de Saul. Depois que os gibeonitas enforcaram sete descendentes de Saul e Rispa velou seus corpos, Davi recolheu os ossos de Saul e Jônatas de Jabes-Gileade, e “Eles sepultaram os ossos de Saul e de Jônatas, seu filho, na região de Benjamim, em Zela, no túmulo de Quis, seu pai”. Zela foi, portanto, o lugar de sepultamento da família de Saul, embora Gibeá seja a cidade mais ligada a ele."
    - "Além disso nada se sabe. A cidade não foi localizada; o principal candidato do mapa é Khirbet Salah, na orla ocidental da Jerusalém moderna, com Khirbet Erha e Khirbet Shab Salah, ao norte, como alternativas, mas nenhum foi escavado ou ligado ao nome com certeza, e o túmulo de Quis nunca foi encontrado."
  de:
    - "Zela war eine Stadt Benjamins, unter seinen vierzehn Städten mit Jerusalem aufgeführt: „Zela, Eleph und die Jebusiter, das ist Jerusalem, Gibeath, Kirjath“. Manche lesen die ersten beiden Namen als einen, Zela-Haelef. Sein einziger Auftritt in der Geschichte kommt am Ende von Sauls Linie. Nachdem die Gibeoniter sieben Nachkommen Sauls gehängt und Rizpa über ihre Leichen gewacht hatte, holte David die Gebeine Sauls und Jonatans aus Jabes in Gilead, und sie „begruben die Gebeine Sauls und seines Sohnes Jonathan im Lande Benjamin zu Zela im Grabe seines Vaters Kis“. Zela war damit die Grabstätte der Familie Sauls, obwohl Gibea die am meisten mit ihm verbundene Stadt ist."
    - "Darüber hinaus ist nichts bekannt. Die Stadt wurde nicht lokalisiert; der führende Kandidat der Karte ist Khirbet Salah am Westrand des heutigen Jerusalem, mit Khirbet Erha und Khirbet Shab Salah im Norden als Alternativen, doch keiner wurde ausgegraben oder sicher mit dem Namen verbunden, und das Grab des Kis ist nie gefunden worden."
  fr:
    - "Tséla, ou Tséla-Haéleph, était une ville de Benjamin, citée parmi ses quatorze villes avec Jérusalem : « Tséla, Éleph, Jebus, qui est Jérusalem, Guibeath, et Kirjath ». Certains lisent les deux premiers noms comme un seul, Tséla-Haéleph. Son unique moment dans le récit vient à la fin de la lignée de Saül. Après que les Gabaonites eurent pendu sept descendants de Saül et que Ritspa eut veillé sur leurs corps, David alla chercher les os de Saül et de Jonathan à Jabès en Galaad, et « on enterra les os de Saül et de Jonathan, son fils, au pays de Benjamin, à Tséla, dans le sépulcre de Kis, père de Saül ». Tséla fut donc le lieu de sépulture de la famille de Saül, bien que Guibea soit la ville la plus liée à lui."
    - "On ne sait rien de plus. La ville n’a pas été localisée ; le principal candidat de la carte est Khirbet Salah, au bord ouest de la Jérusalem moderne, avec Khirbet Erha et Khirbet Shab Salah au nord comme solutions de rechange, mais aucun n’a été fouillé ni rattaché au nom avec certitude, et la tombe de Kis n’a jamais été trouvée."
