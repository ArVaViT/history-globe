# Overview article (ADR 0007). Mainstream facts only; a Roman province named twice in the New Testament; the Septuagint's Cappadocia for Caphtor is noted as a reading, not a fact.
id: cappadocia
place: a33fbde
title:
  en: "Cappadocia"
  ru: "Каппадокия"
  uk: "Каппадокія"
  es: "Capadocia"
  pt: "Capadócia"
  de: "Kappadokien"
  fr: "Cappadoce"
