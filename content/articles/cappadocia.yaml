body:
  en:
    - "Cappadocia is the high inland plateau of eastern central Anatolia, a land of cold winters, horses and wheat, framed by the Taurus to the south and the volcano Erciyes (Argaeus) at its heart. Long before the Bible's mention, Assyrian merchants traded there: the clay tablets of their colony at Kanesh (Kültepe), near Kayseri, date from the nineteenth and eighteenth centuries BC, and the region later lay within the Hittite world. Under the Persians it was a satrapy, then a kingdom of the Ariarathid house; Tiberius annexed it in AD 17, after the death of its last king, Archelaus, and it became a Roman province with Caesarea, the old Mazaca, as its capital."
    - "The New Testament names it twice. Among the crowd at Pentecost were “the dwellers in Mesopotamia, and in Judæa, and Cappadocia, in Pontus, and Asia”, Jews and proselytes who heard the apostles speak each in his own tongue; and the first letter of Peter is sent to the strangers scattered “throughout Pontus, Galatia, Cappadocia, Asia, and Bithynia”. How the faith came there is not told. The Greek Septuagint renders Caphtor, the homeland of the Philistines, as Cappadocia in a few places, but that reading is not followed today."
    - "In the fourth century Cappadocia gave the church Basil of Caesarea, his brother Gregory of Nyssa and their friend Gregory of Nazianzus, the Cappadocian Fathers. Its soft volcanic tuff, carved by erosion into cones and pillars, was hollowed out for dwellings, underground towns and hundreds of painted churches, most of them from the ninth to eleventh centuries. Today it is the region around Kayseri and Nevşehir in Turkey, and Göreme with the rock sites around it is a UNESCO World Heritage Site."
  ru:
    - "Каппадокия — высокое внутреннее плато восточной части Центральной Анатолии, земля холодных зим, коней и пшеницы, огороженная с юга Тавром, с вулканом Эрджиес (Аргей) посередине. Задолго до упоминания в Библии там торговали ассирийские купцы: глиняные таблички их колонии в Канеше (Кюльтепе) близ Кайсери относятся к XIX–XVIII векам до н. э., а позже край входил в хеттский мир. При персах это была сатрапия, затем царство дома Ариаратов; Тиберий присоединил её в 17 г. н. э., после смерти последнего царя Архелая, и она стала римской провинцией со столицей в Кесарии, древней Мазаке."
    - "Новый Завет называет её дважды. Среди толпы в день Пятидесятницы были «жители Месопотамии, Иудеи и Каппадокии, Понта и Асии», Иудеи и прозелиты, слышавшие апостолов каждый на своём наречии; а первое послание Петра обращено к пришельцам, «рассеянным в Понте, Галатии, Каппадокии, Асии и Вифинии». Как туда пришла вера, не сказано. Греческая Септуагинта в нескольких местах передаёт Кафтор, родину Филистимлян, как Каппадокию, но этому чтению сегодня не следуют."
    - "В IV веке Каппадокия дала Церкви Василия Кесарийского, его брата Григория Нисского и их друга Григория Назианзина — Каппадокийских отцов. Её мягкий вулканический туф, изваянный ветром и водой в конусы и столбы, вырубали под жилища, подземные города и сотни расписных церквей, большей частью IX–XI веков. Сегодня это край вокруг Кайсери и Невшехира в Турции, а Гёреме со скальными памятниками вокруг него — объект Всемирного наследия ЮНЕСКО."
  uk:
    - "Каппадокія — високе внутрішнє плато східної центральної Анатолії, край холодних зим, коней і пшениці, обрамлений Тавром на півдні та вулканом Ерджієс (Аргей) у серці. Задовго до біблійної згадки там торгували ассирійські купці: глиняні таблички їхньої колонії в Канеші (Кюльтепе) поблизу Кайсері датуються XIX–XVIII ст. до н. е., а пізніше область лежала в межах хетського світу. За персів вона була сатрапією, потім царством дому Аріаратідів; Тиверій анексував її в 17 р. н. е., після смерті її останнього царя Архелая, і вона стала римською провінцією з Кесарією, колишньою Мазакою, як столицею."
    - "Новий Заповіт називає її двічі. Серед юрби на П'ятдесятницю були ті, «що домуємо в Мезопотамії, і в Юдеї, і Каппадокиї, і Понтї, і Азиї», юдеї й прозеліти, які чули, як апостоли говорять кожен своєю мовою; а перший лист Петра надісланий «вибраним захожанам розсїяння по Понту, Галатиї, Кападокиї, Азиї і Витиниї». Як віра прийшла туди, не розповідається. Грецька Септуагінта в кількох місцях передає Кафтор, батьківщину филистимлян, як Каппадокію, але цьому прочитанню сьогодні не слідують."
    - "У IV ст. Каппадокія дала Церкві Василія Кесарійського, його брата Григорія Ніського та їхнього друга Григорія Назіанзина, каппадокійських отців. Її м'який вулканічний туф, вирізьблений ерозією на конуси й стовпи, видовбували під житла, підземні міста та сотні розписаних церков, більшість із яких з IX–XI ст. Сьогодні це область навколо Кайсері та Невшехіра в Туреччині, а Гьореме з навколишніми скельними пам'ятками належить до Світової спадщини ЮНЕСКО."
  es:
    - "Capadocia es la alta meseta interior del centro-este de Anatolia, una tierra de inviernos fríos, caballos y trigo, enmarcada por el Tauro al sur y por el volcán Erciyes (Argeo) en su corazón. Mucho antes de que la Biblia la mencione, mercaderes asirios comerciaban allí: las tablillas de arcilla de su colonia en Kanesh (Kültepe), cerca de Kayseri, datan de los siglos XIX y XVIII a. C., y la región perteneció después al mundo hitita. Bajo los persas fue una satrapía, luego un reino de la casa de los Ariarátidas; Tiberio lo anexionó en el 17 d. C., tras la muerte de su último rey, Arquelao, y pasó a ser una provincia romana con Cesarea, la antigua Mazaca, como capital."
    - "El Nuevo Testamento la nombra dos veces. Entre la multitud de Pentecostés estaban «los que habitamos en Mesopotamia, en Judea y en Capadocia, en el Ponto y en Asia», judíos y prosélitos que oyeron hablar a los apóstoles cada uno en su propia lengua; y la primera carta de Pedro se dirige «á los extranjeros esparcidos en Ponto, en Galacia, en Capadocia, en Asia, y en Bithinia». No se cuenta cómo llegó la fe allí. La Septuaginta griega traduce Caftor, la patria de los filisteos, como Capadocia en unos pocos lugares, pero hoy no se sigue esa lectura."
    - "En el siglo IV Capadocia dio a la Iglesia a Basilio de Cesarea, a su hermano Gregorio de Nisa y a su amigo Gregorio Nacianceno, los Padres capadocios. Su suave toba volcánica, esculpida por la erosión en conos y pilares, fue horadada para hacer viviendas, ciudades subterráneas y cientos de iglesias pintadas, la mayoría de los siglos IX al XI. Hoy es la región en torno a Kayseri y Nevşehir, en Turquía, y Göreme con los sitios rupestres que la rodean es Patrimonio de la Humanidad de la UNESCO."
  pt:
    - "A Capadócia é o alto planalto interior do centro-leste da Anatólia, terra de invernos frios, cavalos e trigo, emoldurada pelo Touro ao sul e pelo vulcão Erciyes (Argeu) em seu coração. Muito antes da menção bíblica, mercadores assírios negociavam ali: as tabuinhas de argila de sua colônia em Kanesh (Kültepe), perto de Kayseri, datam dos séculos XIX e XVIII a.C., e a região esteve depois dentro do mundo hitita. Sob os persas foi uma satrapia, depois um reino da casa dos Ariaratidas; Tibério a anexou em 17 d.C., após a morte de seu último rei, Arquelau, e ela se tornou província romana com Cesareia, a antiga Mazaca, por capital."
    - "O Novo Testamento a nomeia duas vezes. Entre a multidão de Pentecostes estavam “os habitantes da Mesopotâmia, Judeia, Capadócia, Ponto, Ásia”, judeus e prosélitos que ouviram os apóstolos falar, cada um em sua própria língua; e a primeira carta de Pedro é enviada aos que vivem como estrangeiros “no Ponto, Galácia, Capadócia, Ásia e Bitínia”. Como a fé chegou lá não se conta. A Septuaginta grega traduz Caftor, a pátria dos filisteus, por Capadócia em alguns lugares, mas essa leitura não é seguida hoje."
    - "No século IV, a Capadócia deu à igreja Basílio de Cesareia, seu irmão Gregório de Nissa e o amigo deles Gregório de Nazianzo, os Padres Capadócios. Seu tufo vulcânico macio, esculpido pela erosão em cones e pilares, foi escavado para moradias, cidades subterrâneas e centenas de igrejas pintadas, a maioria dos séculos IX a XI. Hoje é a região em torno de Kayseri e Nevşehir, na Turquia, e Göreme, com os sítios rupestres ao redor, é Patrimônio Mundial da UNESCO."
  de:
    - "Kappadokien ist die hohe Binnenhochfläche im Osten Zentralanatoliens, ein Land kalter Winter, der Pferde und des Weizens, im Süden vom Taurus begrenzt und in seiner Mitte vom Vulkan Erciyes (Argaios) überragt. Lange vor der Erwähnung in der Bibel handelten dort assyrische Kaufleute: Die Tontafeln ihrer Kolonie in Kanesch (Kültepe) bei Kayseri stammen aus dem 19. und 18. Jahrhundert v. Chr., und die Region lag später im hethitischen Machtbereich. Unter den Persern war es eine Satrapie, dann ein Königreich des Hauses der Ariarathiden; Tiberius annektierte es im Jahr 17 n. Chr. nach dem Tod seines letzten Königs Archelaus, und es wurde eine römische Provinz mit Caesarea, dem alten Mazaka, als Hauptstadt."
    - "Das Neue Testament nennt es zweimal. Unter der Menge an Pfingsten waren „die wir wohnen in Mesopotamien und in Judäa und Kappadozien, Pontus und Asien“, Juden und Proselyten, die die Apostel jeder in seiner eigenen Sprache reden hörten; und der erste Petrusbrief ist gerichtet an die Fremdlinge, die „hin und her in Pontus, Galatien, Kappadozien, Asien und Bithynien“ verstreut sind. Wie der Glaube dorthin kam, wird nicht erzählt. Die griechische Septuaginta gibt Kaftor, die Heimat der Philister, an einigen Stellen mit Kappadokien wieder, doch dieser Lesart folgt man heute nicht."
    - "Im 4. Jahrhundert schenkte Kappadokien der Kirche Basilius von Caesarea, seinen Bruder Gregor von Nyssa und ihren Freund Gregor von Nazianz, die Kappadokischen Väter. Sein weicher vulkanischer Tuff, von der Erosion zu Kegeln und Säulen geformt, wurde für Wohnungen, unterirdische Städte und Hunderte bemalter Kirchen ausgehöhlt, die meisten aus dem 9. bis 11. Jahrhundert. Heute ist es die Region um Kayseri und Nevşehir in der Türkei, und Göreme mit den Felsstätten ringsum gehört zum UNESCO-Welterbe."
  fr:
    - "La Cappadoce est le haut plateau intérieur de l’est de l’Anatolie centrale, pays d’hivers froids, de chevaux et de blé, encadré par le Taurus au sud et le volcan Erciyes (Argée) en son cœur. Bien avant que la Bible la mentionne, des marchands assyriens y commerçaient : les tablettes d’argile de leur comptoir de Kanesh (Kültepe), près de Kayseri, datent des XIXe et XVIIIe siècles av. J.-C., et la région fit ensuite partie du monde hittite. Sous les Perses, elle fut une satrapie, puis un royaume de la maison des Ariarathides ; Tibère l’annexa en 17 apr. J.-C., après la mort de son dernier roi, Archélaüs, et elle devint une province romaine avec Césarée, l’ancienne Mazaca, pour capitale."
    - "Le Nouveau Testament la nomme deux fois. Dans la foule de la Pentecôte se trouvaient « ceux qui habitent la Mésopotamie, la Judée, la Cappadoce, le Pont, l’Asie », Juifs et prosélytes qui entendirent les apôtres parler chacun dans sa langue ; et la première lettre de Pierre est envoyée aux étrangers dispersés « dans le Pont, la Galatie, la Cappadoce, l’Asie et la Bithynie ». On ne dit pas comment la foi y parvint. La Septante grecque rend Caphtor, patrie des Philistins, par Cappadoce en quelques endroits, mais cette lecture n’est plus suivie aujourd’hui."
    - "Au IVe siècle, la Cappadoce donna à l’Église Basile de Césarée, son frère Grégoire de Nysse et leur ami Grégoire de Nazianze, les Pères cappadociens. Son tuf volcanique tendre, sculpté par l’érosion en cônes et en piliers, fut creusé pour y loger des habitations, des villes souterraines et des centaines d’églises peintes, pour la plupart des IXe-XIe siècles. Aujourd’hui, c’est la région autour de Kayseri et de Nevşehir, en Turquie, et Göreme, avec les sites rupestres qui l’entourent, est inscrit au patrimoine mondial de l’UNESCO."
  it:
    - "La Cappadocia è l’alto altopiano interno dell’Anatolia centro-orientale, una terra di inverni freddi, cavalli e grano, racchiusa dal Tauro a sud e dal vulcano Erciyes (Argeo) al suo centro. Molto prima della menzione biblica vi commerciavano mercanti assiri: le tavolette d’argilla della loro colonia di Kanesh (Kültepe), presso Kayseri, risalgono al XIX e XVIII secolo a.C., e la regione rientrò poi nel mondo ittita. Sotto i Persiani fu una satrapia, poi un regno della casa degli Ariaratidi; Tiberio l’annesse nel 17 d.C., dopo la morte dell’ultimo re, Archelao, ed essa divenne provincia romana con Cesarea, l’antica Mazaca, come capitale."
    - "Il Nuovo Testamento la nomina due volte. Fra la folla di Pentecoste c’erano «abitanti della Mesopotamia, della Giudea e della Cappadocia, del Ponto e dell’Asia», Giudei e proseliti che udirono gli apostoli parlare ciascuno nella propria lingua; e la prima lettera di Pietro è inviata «agli eletti che vivono come forestieri nella dispersione del Ponto, della Galazia, della Cappadocia, dell’Asia e della Bitinia». Come la fede vi sia giunta non è detto. La Settanta greca rende in alcuni luoghi Caftor, patria dei Filistei, con Cappadocia, ma oggi questa lettura non è seguita."
    - "Nel IV secolo la Cappadocia diede alla Chiesa Basilio di Cesarea, suo fratello Gregorio di Nissa e il loro amico Gregorio di Nazianzo, i Padri cappadoci. Il suo morbido tufo vulcanico, modellato dall’erosione in coni e pilastri, fu scavato per ricavarne abitazioni, città sotterranee e centinaia di chiese dipinte, per lo più dei secoli IX–XI. Oggi è la regione intorno a Kayseri e Nevşehir in Turchia, e Göreme con i siti rupestri circostanti è Patrimonio dell’Umanità dell’UNESCO."
  pl:
    - "Kapadocja to wysoki śródlądowy płaskowyż wschodniej części środkowej Anatolii, kraj zimnych zim, koni i pszenicy, ograniczony od południa Taurem, a w swym sercu wulkanem Erciyes (Argeusz). Na długo przed wzmianką w Biblii handlowali tam kupcy asyryjscy: gliniane tabliczki ich kolonii w Kaneszu (Kültepe) koło Kayseri pochodzą z XIX i XVIII w. p.n.e., a region leżał później w świecie hetyckim. Za Persów był satrapią, potem królestwem rodu Ariaratydów; Tyberiusz anektował go w 17 r. n.e., po śmierci ostatniego króla Archelaosa, a kraj stał się prowincją rzymską ze stolicą w Cezarei, dawnej Mazace."
    - "Nowy Testament wymienia ją dwukrotnie. Wśród zgromadzonych w Pięćdziesiątnicę byli Żydzi i prozelici, którzy o sobie mówią: „mieszkamy w Mezopotamii, w Judzkiej ziemi, i w Kapadocyi, w Poncie, i w Azyi”, i słyszeli apostołów mówiących każdy w swoim języku; a pierwszy list Piotra jest zaadresowany „przychodniom rozproszonym w Poncie, w Galacyi, w Kapadocyi, w Azji i w Bitynii”. Jak wiara tam dotarła, nie jest opowiedziane. Grecka Septuaginta oddaje w kilku miejscach Kaftor, ojczyznę Filistynów, jako Kapadocję, lecz tego odczytania dziś się nie przyjmuje."
    - "W IV w. Kapadocja dała Kościołowi Bazylego z Cezarei, jego brata Grzegorza z Nyssy i ich przyjaciela Grzegorza z Nazjanzu, Ojców Kapadockich. Jej miękki wulkaniczny tuf, rzeźbiony erozją w stożki i filary, wydrążono na mieszkania, podziemne miasta i setki malowanych kościołów, w większości z IX–XI w. Dziś jest to region wokół Kayseri i Nevşehir w Turcji, a Göreme z okolicznymi skalnymi stanowiskami znajduje się na Liście światowego dziedzictwa UNESCO."
  nl:
    - "Cappadocië is het hoge binnenlandse plateau van het oostelijke midden van Anatolië, een land van koude winters, paarden en tarwe, omlijst door de Taurus in het zuiden en de vulkaan Erciyes (Argaeus) in het hart. Lang voordat de Bijbel het noemt, dreven Assyrische kooplieden er handel: de kleitabletten van hun kolonie in Kanesh (Kültepe), bij Kayseri, dateren uit de negentiende en achttiende eeuw v.Chr., en de streek lag later binnen de Hettitische wereld. Onder de Perzen was het een satrapie, daarna een koninkrijk van het huis der Ariarathiden; Tiberius lijfde het in 17 n.Chr. in, na de dood van de laatste koning, Archelaüs, en het werd een Romeinse provincie met Caesarea, het oude Mazaca, als hoofdstad."
    - "Het Nieuwe Testament noemt het tweemaal. Onder de menigte met Pinksteren waren “de inwoners … van Mesopotamië, en Judea, en Cappadocië, Pontus en Azië”, Joden en proselieten die de apostelen ieder in zijn eigen taal hoorden spreken; en de eerste brief van Petrus is gericht aan de vreemdelingen, “verstrooid in Pontus, Galatie, Kappadocie, Azie en Bithynie”. Hoe het geloof er kwam, wordt niet verteld. De Griekse Septuaginta geeft Kaftor, het vaderland van de Filistijnen, op enkele plaatsen weer als Cappadocië, maar die lezing wordt tegenwoordig niet gevolgd."
    - "In de 4e eeuw schonk Cappadocië de kerk Basilius van Caesarea, zijn broer Gregorius van Nyssa en hun vriend Gregorius van Nazianze, de Cappadocische Vaders. Zijn zachte vulkanische tufsteen, door erosie tot kegels en pilaren gevormd, werd uitgehold tot woningen, ondergrondse steden en honderden beschilderde kerken, de meeste uit de negende tot elfde eeuw. Tegenwoordig is het de streek rond Kayseri en Nevşehir in Turkije, en Göreme met de rotslocaties eromheen is UNESCO-werelderfgoed."
  cs:
    - "Kappadokie je vysoká vnitrozemská plošina východní střední Anatolie, země chladných zim, koní a pšenice, ohraničená na jihu Taurem a uprostřed sopkou Erciyes (Argaios). Dávno před zmínkou v Bibli tu obchodovali asyrští kupci: hliněné tabulky z jejich kolonie v Kaneši (Kültepe) u Kayseri pocházejí z 19. a 18. století př. n. l. a region později náležel k chetitskému světu. Za Peršanů byl satrapií, pak královstvím rodu Ariarathovců; Tiberius jej roku 17 n. l. po smrti posledního krále Archelaa připojil a region se stal římskou provincií s Cesareou, dávnou Mazakou, jako hlavním městem."
    - "Nový zákon ji jmenuje dvakrát. Mezi zástupem o Letnicích byli ti, „kteříž přebýváme v Mezopotamii, v Židovstvu a v Kappadocii, v Pontu a v Azii“, Židé a proselyté, kteří slyšeli apoštoly mluvit každého svým jazykem; a první list Petrův je zaslán „příchozím rozptýleným v Pontu, Galacii, Kappadocii, v Azii a v Bitynii“. Jak se tam víra dostala, se nevypráví. Řecká Septuaginta překládá Kaftor, domov Pelištejců, na několika místech jako Kappadokii, ale toto čtení se dnes nenásleduje."
    - "Ve 4. století dala Kappadokie církvi Basileia z Cesareje, jeho bratra Řehoře z Nyssy a jejich přítele Řehoře z Nazianzu, kappadocké otce. Její měkký sopečný tuf, erozí vytvarovaný do kuželů a sloupů, byl vyhlouben pro obydlí, podzemní města a stovky malovaných kostelů, většinou z 9. až 11. století. Dnes je to oblast kolem Kayseri a Nevşehiru v Turecku a Göreme se skalními lokalitami kolem je zapsáno na Seznam světového dědictví UNESCO."
  sv:
    - "Kappadokien är den höga inlandsplatån i östra centrala Anatolien, ett land med kalla vintrar, hästar och vete, inramat av Taurus i söder och vulkanen Erciyes (Argaios) i dess hjärta. Långt före Bibelns omnämnande handlade assyriska köpmän där: lertavlorna från deras koloni i Kanesh (Kültepe), nära Kayseri, dateras till 1800- och 1700-talen f.Kr., och regionen låg senare inom den hettitiska världen. Under perserna var den en satrapi, sedan ett kungarike under ätten Ariarathiderna; Tiberius annekterade det år 17 e.Kr., efter att dess siste kung Archelaos dött, och det blev en romersk provins med Caesarea, det gamla Mazaka, som huvudstad."
    - "Nya testamentet nämner det två gånger. Bland folkmassan vid pingsten fanns de som hade sitt hem ”i Mesopotamien eller Judeen eller Kappadocien, i Pontus eller provinsen Asien”, judar och proselyter som hörde apostlarna tala var och en på sitt eget tungomål; och Första Petrusbrevet är sänt till främlingarna ”kringspridda i Pontus, Galatien, Kappadocien, provinsen Asien och Bitynien”. Hur tron kom dit berättas inte. Den grekiska Septuaginta återger Kaftor, filistéernas hemland, som Kappadokien på några ställen, men den läsningen följs inte i dag."
    - "På 300-talet gav Kappadokien kyrkan Basileios av Caesarea, hans bror Gregorios av Nyssa och deras vän Gregorios av Nazianzos, de kappadokiska fäderna. Dess mjuka vulkaniska tuff, som erosionen format till koner och pelare, urholkades till bostäder, underjordiska städer och hundratals målade kyrkor, de flesta från 800- till 1000-talen. I dag är det trakten kring Kayseri och Nevşehir i Turkiet, och Göreme med klippplatserna runt omkring är ett Unesco-världsarv."
  nb:
    - "Kappadokia er det høye indre platået i det østlige Sentral-Anatolia, et land med kalde vintre, hester og hvete, innrammet av Taurus i sør og vulkanen Erciyes (Argaios) i hjertet. Lenge før Bibelen nevner det, drev assyriske kjøpmenn handel der: leirtavlene fra deres koloni i Kanesh (Kültepe), nær Kayseri, stammer fra 1800- og 1700-tallet f.Kr., og regionen lå senere innenfor den hettittiske verden. Under perserne var det et satrapi, så et kongerike under huset Ariarates; Tiberius innlemmet det i 17 e.Kr., etter døden til dets siste konge, Arkelaus, og det ble en romersk provins med Cæsarea, det gamle Mazaka, som hovedstad."
    - "Det nye testamente nevner det to ganger. Blant folkemengden ved pinse var «vi som bor i Mesopotamia og Judea og Kappadokia, Pontus og Asia», jøder og proselytter som hørte apostlene tale hver på sitt eget mål; og Peters første brev er sendt til utlendingene som er «spredt omkring i Pontus, Galatia, Kappadokia, Asia og Bitynia». Hvordan troen kom dit, fortelles ikke. Den greske Septuaginta gjengir Kaftor, filistrenes hjemland, som Kappadokia noen få steder, men denne lesningen følges ikke i dag."
    - "På 300-tallet gav Kappadokia kirken Basileios av Cæsarea, hans bror Gregor av Nyssa og deres venn Gregor av Nazianz, de kappadokiske fedre. Den myke vulkanske tuffen, formet av erosjon til kjegler og søyler, ble hulet ut til boliger, underjordiske byer og hundrevis av malte kirker, de fleste fra 800- til 1000-tallet. I dag er det området rundt Kayseri og Nevşehir i Tyrkia, og Göreme med klippestedene rundt er et UNESCO-verdensarvsted."
  tl:
    - "Ang Capadocia ay ang mataas na talampas sa loob ng lupa ng silangang gitnang Anatolia, lupain ng malamig na taglamig, kabayo at trigo, na nasa pagitan ng Taurus sa timog at ng bulkang Erciyes (Argaeus) sa gitna nito. Matagal bago ang pagbanggit ng Bibliya, nakipagkalakalan doon ang mga mangangalakal ng Asiria: ang mga tabletang luwad ng kanilang kolonya sa Kanesh (Kültepe), malapit sa Kayseri, ay mula sa ika-19 at ika-18 siglo BK, at ang rehiyon ay nang maglaon nasa daigdig ng mga Hetheo. Sa ilalim ng mga Persiano ito ay satrapiya, saka kaharian ng angkang Ariarathid; sinakop ito ni Tiberio noong 17 AD, pagkamatay ng huling hari nito, si Arquelao, at naging lalawigang Romano na ang kabisera ay ang Cesarea, ang dating Mazaca."
    - "Dalawang ulit itong pinangalanan ng Bagong Tipan. Kabilang sa pulutong sa Pentecostes ang “nangananahan sa Mesapotamia, sa Judea, at sa Capadocia, sa Ponto at sa Asia”, mga Judio at proselita na nakarinig sa mga apostol na nagsasalita ng kani-kaniyang wika; at ang unang liham ni Pedro ay ipinadala sa mga nangingibang bayan na “nasa Pangangalat sa Ponto, Galacia, Capadocia, Asia at Bitinia”. Hindi sinasabi kung paano dumating doon ang pananampalataya. Isinasalin ng Septuagintang Griyego ang Caftor, ang tinubuang lupa ng mga Filisteo, bilang Capadocia sa ilang lugar, ngunit hindi na sinusunod ngayon ang pagbasang iyon."
    - "Noong ika-4 na siglo, ibinigay ng Capadocia sa iglesia si Basilio ng Cesarea, ang kaniyang kapatid na si Gregorio ng Nisa at ang kanilang kaibigang si Gregorio ng Nacianzo, ang mga Amang Capadocio. Ang malambot nitong tuffang bulkaniko, na inukit ng pagguho sa mga kono at haligi, ay binutasan para sa mga tirahan, mga lungsod sa ilalim ng lupa at daan-daang simbahang ipininta, karamihan ay mula ika-9 hanggang ika-11 siglo. Ngayon ito ang rehiyon sa palibot ng Kayseri at Nevşehir sa Turkey, at ang Göreme kasama ang mga pook-bato sa palibot nito ay isang UNESCO World Heritage Site."
  da:
    - "Kappadokien er det høje indre plateau i det østlige centrale Anatolien, et land med kolde vintre, heste og hvede, indrammet af Taurus mod syd og vulkanen Erciyes (Argaeus) i dets hjerte. Længe før Bibelens omtale drev assyriske købmænd handel dér: Lertavlerne fra deres koloni i Kanesh (Kültepe) nær Kayseri stammer fra 1800- og 1700-tallet f.Kr., og området lå senere i den hittitiske verden. Under perserne var det et satrapi, derefter et kongedømme under Ariarathidernes hus; Tiberius annekterede det i 17 e.Kr. efter dets sidste konges, Arkelaus', død, og det blev en romersk provins med Cæsarea, det gamle Mazaca, som hovedstad."
    - "Det Nye Testamente nævner det to gange. Blandt skaren ved pinse var dem, »som høre hjemme i Mesopotamien, Judæa og Kappadokien, Pontus og Asien«, jøder og proselytter, der hørte apostlene tale, hver på sit eget sprog; og første Petersbrev er stilet til »Udlændingene i Adspredelse i Pontus, Galatien, Kappadokien, Asien og Bithynien«. Hvordan troen kom dertil, fortælles ikke. Den græske Septuaginta gengiver Kaftor, filisternes hjemland, som Kappadokien nogle få steder, men den læsning følges ikke i dag."
    - "I 300-tallet gav Kappadokien kirken Basileios af Cæsarea, hans bror Gregor af Nyssa og deres ven Gregor af Nazianz, de kappadokiske fædre. Dets bløde vulkanske tuf, formet af erosionen til kegler og søjler, blev udhulet til boliger, underjordiske byer og hundredvis af malede kirker, de fleste fra 800- til 1000-tallet. I dag er det egnen omkring Kayseri og Nevşehir i Tyrkiet, og Göreme med de omkringliggende klippesteder er et UNESCO-verdensarvssted."
  sr:
    - "Кападокија је висока унутрашња висораван источне средишње Анадолије, земља хладних зима, коња и пшенице, уоквирена Тавром на југу и вулканом Ерџијас (Аргеј) у свом срцу. Много пре него што је Библија помиње, тамо су трговали асирски трговци: глинене плочице њихове колоније у Канешу (Култепе), код Кајсерија, датирају из 19. и 18. века п. н. е., а област је касније лежала у хетитском свету. Под Персијанцима била је сатрапија, затим краљевство династије Ариаратида; Тиверије ју је припојио 17. н. е., после смрти њеног последњег краља, Архелаја, и постала је римска провинција с Цезарејом, старом Мазаком, као престоницом."
    - "Нови завет је помиње двапут. Међу мноштвом на Педесетници били су и они „који смо из Месопотамије, и из Јудеје и Кападокије, и из Понта и Азије“, Јевреји и прозелити који су чули апостоле како говоре, сваки на свом језику; а прва Петрова посланица упућена је „избраним дошљацима, расејаним по Понту, Галатији, Кападокији, Азији и Витанији“. Како је вера тамо стигла, не приповеда се. Грчка Септуагинта на неколико места преводи Кафтор, постојбину Филистеја, као Кападокију, али то читање се данас не следи."
    - "У 4. веку Кападокија је цркви дала Василија Кесаријског, његовог брата Григорија Ниског и њиховог пријатеља Григорија Назијанзина, кападокијске оце. Њен меки вулкански туф, који је ерозија обликовала у купе и стубове, дубљен је за станове, подземне градове и стотине осликаних цркава, већином из 9. до 11. века. Данас је то област око Кајсерија и Невшехира у Турској, а Гореме са околним стеновитим налазиштима налази се на Унесковој листи светске баштине."
  hu:
    - "Kappadókia Közép-Anatólia keleti részének magas belső fennsíkja, hideg telek, lovak és búza földje, délről a Taurus, szívében az Erciyes (Argaios) vulkán övezi. Jóval a Biblia említése előtt asszír kereskedők kereskedtek itt: a Kayseri közelében fekvő Kaneš (Kültepe) kolóniájuk agyagtáblái a Kr. e. 19. és 18. századból valók, a vidék később a hettita világhoz tartozott. A perzsák alatt szatrapia, majd az Ariarathida-ház királysága volt; Tiberius Kr. u. 17-ben a birodalomhoz csatolta, miután meghalt utolsó királya, Arkhelaosz, és római tartomány lett, fővárosa Cézárea, a régi Mazaka."
    - "Az Újszövetség kétszer nevezi meg. A pünkösdi sokaság között voltak „kik lakozunk Mesopotámiában, Júdeában és Kappadócziában, Pontusban és Ázsiában”, zsidók és prozeliták, akik hallották az apostolokat mindegyiket a maga nyelvén beszélni; és Péter első levelét „a Pontusban, Galátziában, Kappadóciában, Ázsiában és Bithiniában” elszéledt jövevényeknek küldik. Hogy a hit hogyan jutott oda, nem mondják el. A görög Septuaginta néhány helyen Kappadókiának fordítja Kaftort, a filiszteusok hazáját, de ezt az olvasatot ma nem követik."
    - "A 4. században Kappadókia adta az egyháznak Cézáreai Baszileiosz püspököt, testvérét, Nüsszai Gergelyt és barátjukat, Nazianzoszi Gergelyt, a kappadókiai atyákat. Puha vulkáni tufáját, amelyet az erózió kúpokká és oszlopokká faragott, lakásokká, földalatti városokká és több száz festett templommá vájták ki, többségük a 9–11. századból való. Ma a Kayseri és Nevşehir körüli terület Törökországban, és Göreme a körülötte lévő sziklahelyekkel UNESCO világörökségi helyszín."
  fi:
    - "Kappadokia on Itä-Keski-Anatolian korkea sisämaan ylänkö, kylmien talvien, hevosten ja vehnän maa, jota rajaavat etelässä Taurus ja sydämessä tulivuori Erciyes (Argaios). Kauan ennen Raamatun mainintaa assyrialaiset kauppiaat kävivät siellä kauppaa: heidän Kaneshin (Kültepe) siirtokuntansa savitaulut lähellä Kayseria ajoittuvat 1800- ja 1700-luvuille eaa., ja alue kuului myöhemmin heettiläisten maailmaan. Persialaisten aikana se oli satrapia, sitten Ariarathes-suvun kuningaskunta; Tiberius liitti sen valtakuntaan vuonna 17 jaa. viimeisen kuninkaansa Arkelaoksen kuoltua, ja siitä tuli Rooman provinssi, jonka pääkaupunki oli Kesarea, vanha Mazaka."
    - "Uusi testamentti mainitsee sen kahdesti. Helluntain väkijoukossa olivat ”me, jotka asumme Mesopotamiassa, Juudeassa ja Kappadokiassa, Pontossa ja Aasiassa”, juutalaisia ja käännynnäisiä, jotka kuulivat apostolien puhuvan kukin omaa kieltään; ja Pietarin ensimmäinen kirje on osoitettu muukalaisille, jotka asuvat ”hajallaan Pontossa, Galatiassa, Kappadokiassa, Aasiassa ja Bityniassa”. Miten usko sinne tuli, ei kerrota. Kreikkalainen Septuaginta kääntää Kaftorin, filistealaisten kotimaan, muutamassa kohdassa Kappadokiaksi, mutta tätä lukutapaa ei nykyisin seurata."
    - "300-luvulla Kappadokia antoi kirkolle Kesarean Basileioksen, hänen veljensä Nyssan Gregorioksen ja heidän ystävänsä Gregorios Nazianzolaisen, kappadokialaiset kirkkoisät. Sen pehmeä tulivuoritufti, jonka eroosio on muovannut kartioiksi ja pylväiksi, louhittiin asunnoiksi, maanalaisiksi kaupungeiksi ja satoiksi maalatuiksi kirkoiksi, joista useimmat ovat 800–1000-luvuilta. Nykyisin se on Kayserin ja Nevşehirin ympäristö Turkissa, ja Göreme ympäröivine kalliokohteineen on UNESCOn maailmanperintökohde."
  vi:
    - "Cáp-ba-đốc là cao nguyên nội địa cao ở miền đông trung Anatolia, một xứ có mùa đông lạnh, ngựa và lúa mì, được dãy Taurus ở phía nam và ngọn núi lửa Erciyes (Argaeus) ở trung tâm bao quanh. Rất lâu trước khi Kinh Thánh nhắc đến, các thương nhân A-si-ri đã buôn bán ở đó: các bảng đất sét của thuộc địa của họ tại Kanesh (Kültepe), gần Kayseri, có niên đại từ thế kỷ 19 và 18 TCN, và vùng này về sau nằm trong thế giới Hittite. Dưới thời Ba Tư nó là một tổng trấn, rồi là một vương quốc của nhà Ariarathid; Ti-be-rơ sáp nhập nó năm 17, sau cái chết của vị vua cuối cùng, A-chê-la-u, và nó trở thành một tỉnh La Mã với Sê-sa-rê, Mazaca xưa, làm thủ phủ."
    - "Tân Ước nêu tên nó hai lần. Trong đám đông ngày Lễ Ngũ Tuần có “kẻ ở tại Mê-sô-bô-ta-mi, Giu-đê, Cáp-ba-đốc, Bông, A-si”, những người Do Thái và người tòng giáo nghe các sứ đồ nói mỗi người bằng thứ tiếng của mình; và thư thứ nhất của Phi-e-rơ được gửi cho những người kiều ngụ rải rác “trong xứ Bông, Ga-la-ti, Cáp-ba-đốc, A-si và Bi-thi-ni”. Đức tin đến đó bằng cách nào thì không được kể. Bản Septuagint Hy Lạp dịch Cáp-tô, quê hương của người Phi-li-tin, là Cáp-ba-đốc ở vài chỗ, nhưng ngày nay không ai theo cách đọc đó."
    - "Vào thế kỷ 4, Cáp-ba-đốc ban cho hội thánh Basil ở Sê-sa-rê, em ông là Gregory ở Nyssa và bạn họ là Gregory ở Nazianzus, các Giáo phụ Cáp-ba-đốc. Lớp đá tuff núi lửa mềm của nó, được xói mòn tạc thành các nón và cột, đã được đục rỗng làm nhà ở, các thành ngầm và hàng trăm nhà thờ có tranh vẽ, phần lớn từ thế kỷ 9 đến 11. Ngày nay đó là vùng quanh Kayseri và Nevşehir ở Thổ Nhĩ Kỳ, và Göreme cùng các địa điểm đá xung quanh là Di sản Thế giới của UNESCO."
  ro:
    - "Capadocia este înaltul podiș interior din centrul-estul Anatoliei, un ținut cu ierni reci, cai și grâu, încadrat la sud de Taur și având în inimă vulcanul Erciyes (Argaios). Cu mult înainte de pomenirea din Biblie, negustori asirieni făceau comerț acolo: tăblițele de lut ale coloniei lor de la Kanesh (Kültepe), lângă Kayseri, datează din secolele al XIX-lea și al XVIII-lea î.Hr., iar regiunea s-a aflat mai târziu în lumea hitită. Sub perși a fost o satrapie, apoi un regat al casei Ariarațizilor; Tiberiu l-a anexat în anul 17 d.Hr., după moartea ultimului său rege, Arhelau, și a devenit provincie romană, cu Cezareea, vechea Mazaca, drept capitală."
    - "Noul Testament o numește de două ori. Printre mulțimea de la Cincizecime erau „cei ce locuesc în Mesopotamia, în Iudeea și în Capadochia, în Pont și în Asia”, iudei și prozeliți care i-au auzit pe apostoli vorbind fiecare în limba lui; iar prima epistolă a lui Petru este trimisă „nemernicilor celor aleși ai risipirei Pontului, Galatiei, Capadochiei, Asiei și Vitiniei”. Cum a ajuns credința acolo nu se spune. Septuaginta greacă redă Caftorul, patria filistenilor, ca Capadocia în câteva locuri, dar această lecțiune nu este urmată astăzi."
    - "În secolul al IV-lea, Capadocia a dat Bisericii pe Vasile cel Mare, episcop al Cezareei, pe fratele său Grigore de Nyssa și pe prietenul lor Grigore de Nazianz, Părinții capadocieni. Tuful ei vulcanic moale, sculptat de eroziune în conuri și stâlpi, a fost scobit pentru locuințe, orașe subterane și sute de biserici pictate, cele mai multe din secolele IX–XI. Astăzi este regiunea din jurul orașelor Kayseri și Nevşehir din Turcia, iar Göreme, cu siturile din stâncă din jur, este în patrimoniul mondial UNESCO."
  bg:
    - "Кападокия е високото вътрешно плато на източната част на Централна Анатолия, земя на студени зими, коне и пшеница, оградена от Таврус на юг, с вулкана Ерджиес (Аргей) в сърцето ѝ. Дълго преди споменаването ѝ в Библията там търгували асирийски търговци: глинените плочки на колонията им в Канеш (Кюлтепе), близо до Кайсери, датират от XIX и XVIII в. пр.н.е., а по-късно областта била част от хетския свят. При персите тя била сатрапия, после царство на династията на Ариаратидите; Тиберий я присъединил през 17 г. н.е., след смъртта на последния ѝ цар Архелай, и тя станала римска провинция със столица Кесария, древната Мазака."
    - "Новият завет я назовава два пъти. Сред множеството на Петдесетница били „които населяват Месопотамия, Юдея и Кападокия, Понт и Азия“, юдеи и прозелити, които чули апостолите да говорят всеки на собствения им език; а Първото послание на Петър е изпратено до преселниците, пръснати „по Понт, по Галатия, по Кападокия, по Азия и по Витиния“. Как вярата стигнала там, не се казва. Гръцката Септуагинта предава Кафтор, родината на филистимците, като Кападокия на няколко места, но това четене днес не се следва."
    - "През IV в. Кападокия дала на църквата Василий Кесарийски, брат му Григорий Нисийски и техния приятел Григорий Назиански — Кападокийските отци. Мекият ѝ вулканичен туф, изваян от ерозията в конуси и стълбове, бил издълбаван за жилища, подземни градове и стотици изрисувани църкви, повечето от IX до XI в. Днес това е областта около Кайсери и Невшехир в Турция, а Гьореме със скалните обекти около него е обект на световното наследство на ЮНЕСКО."
scripture:
