# Overview article (ADR 0007). Mainstream facts only; the Chaldean origin of Nabopolassar's dynasty and the site of Ur of the Chaldees are given as debated; dates follow the Babylonian chronicles.
id: chaldea
place: a32a4f8
title:
  en: "Chaldea"
  ru: "Халдея"
  uk: "Халдея"
  es: "Caldea"
  pt: "Caldeia"
  de: "Chaldäa"
  fr: "Chaldée"
body:
  en:
    - 'Chaldea, Kaldu in Assyrian, was the southern part of Babylonia, the marshes and river lands near the head of the Persian Gulf, where the Euphrates and Tigris draw together below Babylon. The Chaldeans first appear in Assyrian records in the ninth century BC, under Ashurnasirpal II and Shalmaneser III, as tribes settled in walled towns among the canals, Bit-Yakin, Bit-Dakkuri and Bit-Amukani the chief of them. Isaiah can still speak of the Chaldeans as a people that "was not, till the Assyrian founded it". They fought the Assyrians for a century: Merodach-baladan of Bit-Yakin, who sent envoys to Hezekiah, twice made himself king of Babylon.'
    - 'In 626 BC Nabopolassar took the throne of Babylon and founded the dynasty that modern historians often call Chaldean, though whether he came from a Chaldean tribe is debated. Under his son Nebuchadnezzar the Chaldeans became for the prophets the name of Babylon''s power: Habakkuk sees God raise up "the Chaldeans, that bitter and hasty nation"; bands of the Chaldees came against Jehoiakim; "the army of the Chaldees" pursued Zedekiah to the plains of Jericho. Ezekiel received his call "in the land of the Chaldeans by the river Chebar", a canal near Nippur; cuneiform tablets from al-Yahudu, a village of Judean exiles somewhere in Babylonia, now show their life there. Isaiah bids the exiles, "Go ye forth of Babylon, flee ye from the Chaldeans".'
    - 'Daniel''s "king of the Chaldeans", Belshazzar, fell when Cyrus took Babylon in 539 BC. In Daniel the Chaldeans are also a class of wise men beside the magicians and astrologers, and Herodotus, Strabo and Diodorus likewise use the name for the priests and astronomers of Babylon, a sense that survived into the Middle Ages. Jeremiah foretold that Chaldea "shall be a spoil".'
    - 'Genesis sets the birthplace of Abraham''s family in "Ur of the Chaldees", from which Terah went out towards Canaan. Most scholars identify it with Ur at Tell el-Muqayyar, excavated by Woolley from 1922, though some have argued for a northern Ur near Haran, and the epithet is in any case later than Abraham''s age. Stephen''s speech recalls that Abraham came out of the land of the Chaldeans. The old Chaldea is now the south of Iraq, the marshes and the provinces around Nasiriyah and Basra; the name is also borne by the Chaldean Catholic Church, the largest church of Iraq''s Christians, whose union with Rome goes back to the sixteenth century.'
  ru:
    - "Халдея, по-ассирийски Калду, — южная часть Вавилонии, болота и речные земли у вершины Персидского залива, где Евфрат и Тигр сближаются ниже Вавилона. Халдеи впервые появляются в ассирийских записях в IX веке до н. э., при Ашшурнацирапале II и Салманассаре III, как племена, осевшие в укреплённых городках среди каналов; главные из них — Бит-Якин, Бит-Даккури и Бит-Амуккани. Исаия ещё может сказать о Халдеях: «Этого народа прежде не было; Ассур положил ему начало». Они век воевали с Ассирией: Беродах Баладан из Бит-Якина, посылавший послов к Езекии, дважды делался царём Вавилона."
    - "В 626 г. до н. э. Набопаласар занял престол Вавилона и основал династию, которую современные историки часто называют халдейской, хотя происходил ли он из халдейского племени — спорно. При его сыне Навуходоносоре Халдеи стали у пророков именем вавилонской мощи: Аввакум видит, как Бог поднимает «Халдеев, народ жестокий и необузданный»; полчища Халдеев шли на Иоакима; «войско Халдейское» гналось за Седекией до равнин Иерихонских. Иезекииль получил призвание «в земле Халдейской, при реке Ховаре» — канале близ Ниппура; клинописные таблички из Аль-Яхуду, селения иудейских изгнанников где-то в Вавилонии, показывают их тамошнюю жизнь. Исаия велит изгнанникам: «Выходите из Вавилона, бегите от Халдеев»."
    - "Валтасар, «царь Халдейский» книги Даниила, пал, когда Кир взял Вавилон в 539 г. до н. э. В книге Даниила Халдеи — это также разряд мудрецов рядом с тайноведцами и гадателями, и Геродот, Страбон и Диодор так же называют жрецов и звездочётов Вавилона; в этом смысле имя дожило до Средневековья. Иеремия предрёк, что Халдея «сделается добычею»."
    - "Книга Бытия помещает родину семьи Авраама в «Уре Халдейском», откуда Фарра вышел в сторону Ханаана. Большинство учёных отождествляют его с Уром на Телль-эль-Мукайяре, раскопанным Вулли с 1922 года, хотя некоторые отстаивали северный Ур близ Харрана; само же прозвание «Халдейский» во всяком случае моложе времени Авраама. Речь Стефана вспоминает, что «он вышел из земли Халдейской». Древняя Халдея — ныне юг Ирака, болота и провинции вокруг Насирии и Басры; имя носит и Халдейская католическая церковь — крупнейшая церковь христиан Ирака, чей союз с Римом восходит к XVI веку."
  uk:
    - "Халдея, ассирійською Калду, була південною частиною Вавилонії, болотами й прирічними землями біля вершини Перської затоки, де Євфрат і Тигр зближуються нижче Вавилона. Халдеї вперше з'являються в ассирійських записах у IX ст. до н. е., за Ашшурнасірапала II та Салманассара III, як племена, що оселилися в обнесених стінами містах серед каналів, головними з яких були Бит-Якін, Бит-Дакурі та Бит-Амукані. Ісая ще може говорити про халдеїв як про народ, про який сказано: «давно того народу не було; се Ассур дав до його почин». Вони воювали з ассирійцями століття: Баладан із Бит-Якіна, який посилав послів до Єзекії, двічі робив себе царем Вавилона."
    - "У 626 р. до н. е. Набопаласар посів вавилонський трон і заснував династію, яку сучасні історики часто називають халдейською, хоча чи походив він із халдейського племені, є предметом суперечки. За його сина Навуходоносора халдеї стали для пророків назвою вавилонської могутності: Авакум бачить, як Бог підіймає «Халдеїв, нарід жорстокий, та бутний»; «ватаги Халдеїв» напали на Йоакима; «Військо Халдейське» погналося за Седекією аж до рівнини Єрихону. Єзекіїль отримав своє покликання «в Халдейській землї, при Ховар-річцї», каналі поблизу Ніппура; клинописні таблички з аль-Яхуду, села юдейських вигнанців десь у Вавилонії, тепер показують їхнє життя там. Ісая закликає вигнанців: «Рушайте ж із Вавилону, втїкайте від Халдеїв»."
    - "Валтасара, «царя Халдейського» в Книзі Даниїла, було вбито, коли Кір узяв Вавилон у 539 р. до н. е. У Книзі Даниїла халдеї також є класом мудреців поряд із чарівниками й астрологами, і Геродот, Страбон та Діодор так само вживають цю назву для жерців і астрономів Вавилона, значення, яке збереглося до Середньовіччя. Єремія пророкував, що «Халдея здобиччю їх»."
    - "Книга Буття ставить місце народження родини Авраама в «Урі Халдейському», звідки Тара вийшов у напрямку Ханаану. Більшість учених ототожнює його з Уром у Телль-ель-Муккаярі, який Вулі розкопував з 1922 р., хоча дехто доводив існування північного Ура біля Харана, а цей епітет у будь-якому разі пізніший за добу Авраама. Промова Стефана нагадує, що Авраам вийшов із землі халдейської. Давня Халдея — це тепер південь Іраку, болота й провінції навколо Насірії та Басри; цю назву носить і Халдейська католицька церква, найбільша церква іракських християн, чия унія з Римом сягає XVI ст."
  es:
    - "Caldea, Kaldu en asirio, era la parte meridional de Babilonia, las marismas y tierras fluviales cercanas a la cabecera del golfo Pérsico, donde el Éufrates y el Tigris se aproximan por debajo de Babilonia. Los caldeos aparecen por primera vez en los registros asirios en el siglo IX a. C., bajo Asurnasirpal II y Salmanasar III, como tribus asentadas en ciudades amuralladas entre los canales, siendo Bit-Yakin, Bit-Dakkuri y Bit-Amukani las principales. Isaías aún puede hablar de los caldeos como de un pueblo que «no era; Assur la fundó para los que habitaban en el desierto». Combatieron a los asirios durante un siglo: Merodac-baladán de Bit-Yakin, que envió embajadores a Ezequías, se hizo rey de Babilonia en dos ocasiones."
    - "En el 626 a. C. Nabopolasar tomó el trono de Babilonia y fundó la dinastía que los historiadores modernos suelen llamar caldea, aunque se debate si procedía de una tribu caldea. Bajo su hijo Nabucodonosor, los caldeos se convirtieron para los profetas en el nombre del poder de Babilonia: Habacuc ve a Dios levantar «los Caldeos, gente amarga y presurosa»; tropas de caldeos vinieron contra Joacim; «el ejército de los Caldeos» persiguió a Sedequías hasta las llanuras de Jericó. Ezequiel recibió su llamamiento «en la tierra de los Caldeos, junto al río de Chebar», un canal cercano a Nippur; tablillas cuneiformes de al-Yahudu, una aldea de desterrados judíos en algún lugar de Babilonia, muestran hoy su vida allí. Isaías exhorta a los desterrados: «Salid de Babilonia, huid de entre los Caldeos»."
    - "El «rey de los Caldeos» de Daniel, Belsasar, cayó cuando Ciro tomó Babilonia en el 539 a. C. En Daniel los caldeos son también una clase de sabios junto a los magos y los astrólogos, y Heródoto, Estrabón y Diodoro usan igualmente el nombre para los sacerdotes y astrónomos de Babilonia, sentido que sobrevivió hasta la Edad Media. Jeremías profetizó que Caldea «será para presa»."
    - "El Génesis sitúa el lugar de nacimiento de la familia de Abraham en «Ur de los Caldeos», de donde Taré salió hacia Canaán. La mayoría de los estudiosos la identifican con Ur, en Tell el-Muqayyar, excavada por Woolley desde 1922, aunque algunos han defendido una Ur septentrional cerca de Harán, y el epíteto es en todo caso posterior a la época de Abraham. El discurso de Esteban recuerda que Abraham salió de la tierra de los caldeos. La antigua Caldea es hoy el sur de Irak, las marismas y las provincias en torno a Nasiriya y Basora; el nombre lo lleva también la Iglesia católica caldea, la mayor iglesia de los cristianos de Irak, cuya unión con Roma se remonta al siglo XVI."
  pt:
    - "A Caldeia, Kaldu em assírio, era a parte sul da Babilônia, os pântanos e terras fluviais perto da cabeceira do Golfo Pérsico, onde o Eufrates e o Tigre se aproximam abaixo da Babilônia. Os caldeus aparecem pela primeira vez nos registros assírios no século IX a.C., sob Assurnasirpal II e Salmaneser III, como tribos fixadas em cidades muradas entre os canais, das quais Bit-Yakin, Bit-Dakkuri e Bit-Amukani eram as principais. Isaías pode ainda falar dos caldeus como de um povo: “Este povo não existia. Os assírios a fundaram para os que habitam no deserto.” Lutaram contra os assírios por um século: Merodaque-Baladã, de Bit-Yakin, que enviou emissários a Ezequias, fez-se duas vezes rei da Babilônia."
    - "Em 626 a.C., Nabopolassar tomou o trono da Babilônia e fundou a dinastia que os historiadores modernos costumam chamar caldeia, embora seja debatido se ele veio de uma tribo caldeia. Sob seu filho Nabucodonosor, os caldeus tornaram-se para os profetas o nome do poder da Babilônia: Habacuque vê Deus levantar “os caldeus, aquela nação amarga e impetuosa”; bandos de caldeus atacaram Jeoaquim; “o exército dos caldeus” perseguiu Zedequias até as planícies de Jericó. Ezequiel recebeu o seu chamado “na terra dos caldeus, junto ao rio Quebar”, um canal perto de Nipur; tabuinhas cuneiformes de al-Yahudu, aldeia de exilados judeus em algum ponto da Babilônia, mostram agora a vida deles ali. Isaías ordena aos exilados: “Saiam da Babilônia! Fujam dos caldeus!”"
    - "Belsazar, “o rei caldeu”, caiu quando Ciro tomou a Babilônia em 539 a.C. Em Daniel, os caldeus são também uma classe de sábios ao lado dos magos e astrólogos, e Heródoto, Estrabão e Diodoro usam igualmente o nome para os sacerdotes e astrônomos da Babilônia, sentido que sobreviveu até a Idade Média. Jeremias predisse que “A Caldeia será uma presa”."
    - "O Gênesis situa o lugar de nascimento da família de Abraão em “Ur dos Caldeus”, de onde Terá partiu em direção a Canaã. A maioria dos estudiosos a identifica com Ur, em Tell el-Muqayyar, escavada por Woolley a partir de 1922, embora alguns tenham defendido uma Ur do norte, perto de Harã, e o epíteto seja em todo caso posterior à época de Abraão. O discurso de Estêvão recorda que Abraão saiu da terra dos caldeus. A antiga Caldeia é hoje o sul do Iraque, os pântanos e as províncias em torno de Nasíria e Basra; o nome é também o da Igreja Católica Caldeia, a maior igreja dos cristãos do Iraque, cuja união com Roma remonta ao século XVI."
  de:
    - "Chaldäa, assyrisch Kaldu, war der südliche Teil Babyloniens, die Marschen und Flusslandschaften nahe dem Kopf des Persischen Golfs, wo sich Euphrat und Tigris unterhalb von Babylon annähern. Die Chaldäer erscheinen erstmals im 9. Jahrhundert v. Chr. unter Assurnasirpal II. und Salmanassar III. in den assyrischen Quellen, als Stämme, die in ummauerten Städten zwischen den Kanälen siedelten, mit Bit-Jakin, Bit-Dakkuri und Bit-Amukani als den wichtigsten. Jesaja kann noch vom Land der Chaldäer sagen, es sei „nicht ein Volk“ gewesen, „sondern Assur hat es angerichtet“. Sie kämpften ein Jahrhundert lang gegen die Assyrer: Merodach-Baladan von Bit-Jakin, der Gesandte zu Hiskia schickte, machte sich zweimal zum König von Babylon."
    - "Im Jahr 626 v. Chr. bestieg Nabopolassar den Thron von Babylon und gründete die Dynastie, die moderne Historiker oft chaldäisch nennen, obwohl umstritten ist, ob er aus einem chaldäischen Stamm kam. Unter seinem Sohn Nebukadnezar wurden die Chaldäer für die Propheten zum Namen der Macht Babylons: Habakuk sieht Gott „die Chaldäer erwecken, ein bitteres und schnelles Volk“; Scharen der Chaldäer zogen gegen Jojakim; „die Macht der Chaldäer“ jagte Zedekia nach bis in die Ebene von Jericho. Hesekiel erhielt seine Berufung „im Lande der Chaldäer, am Wasser Chebar“, einem Kanal bei Nippur; Keilschrifttafeln aus al-Jahudu, einem Dorf judäischer Exilierter irgendwo in Babylonien, zeigen heute ihr Leben dort. Jesaja ruft die Exilierten auf: „Gehet aus von Babel, fliehet von den Chaldäern“."
    - "Belsazar, im Buch Daniel „der Chaldäer König“, fiel, als Kyrus 539 v. Chr. Babylon einnahm. Bei Daniel sind die Chaldäer auch ein Stand von Weisen neben den Zauberern und Sterndeutern, und Herodot, Strabon und Diodor gebrauchen den Namen ebenfalls für die Priester und Astronomen Babylons, ein Sinn, der bis ins Mittelalter fortlebte. Jeremia sagte voraus: „das Chaldäerland soll ein Raub werden“."
    - "Die Genesis setzt den Geburtsort der Familie Abrahams nach „Ur in Chaldäa“, von wo Tarach auszog, um nach Kanaan zu ziehen. Die meisten Gelehrten setzen es mit Ur in Tell el-Muqayyar gleich, das Woolley ab 1922 ausgrub, obwohl einige für ein nördliches Ur bei Haran eingetreten sind und der Beiname in jedem Fall jünger ist als die Zeit Abrahams. Stephanus’ Rede erinnert daran, dass Abraham aus der Chaldäer Lande auszog. Das alte Chaldäa ist heute der Süden des Irak, die Marschen und die Provinzen um Nasirijja und Basra; der Name wird auch von der chaldäisch-katholischen Kirche getragen, der größten Kirche der Christen des Irak, deren Union mit Rom ins 16. Jahrhundert zurückreicht."
  fr:
    - "La Chaldée, Kaldu en assyrien, était la partie sud de la Babylonie, les marais et les terres fluviales près du fond du golfe Persique, où l’Euphrate et le Tigre se rapprochent en aval de Babylone. Les Chaldéens apparaissent pour la première fois dans les annales assyriennes au IXe siècle av. J.-C., sous Assurnasirpal II et Salmanasar III, comme des tribus établies dans des villes fortifiées parmi les canaux, Bit-Yakin, Bit-Dakkuri et Bit-Amukani étant les principales. Ésaïe peut encore dire des Chaldéens qu’ils « n’étaient pas un peuple », ces habitants du désert pour qui « l’Assyrien a fondé un pays ». Ils combattirent les Assyriens pendant un siècle : Berodac-Baladan de Bit-Yakin, qui envoya des messagers à Ézéchias, se fit deux fois roi de Babylone."
    - "En 626 av. J.-C., Nabopolassar prit le trône de Babylone et fonda la dynastie que les historiens modernes appellent souvent chaldéenne, bien que l’on discute s’il venait d’une tribu chaldéenne. Sous son fils Nebucadnetsar, les Chaldéens devinrent pour les prophètes le nom de la puissance de Babylone : Habacuc voit Dieu susciter « les Chaldéens, peuple furibond et impétueux » ; des bandes de Chaldéens vinrent contre Jojakim ; « l’armée des Chaldéens » poursuivit Sédécias jusque dans les plaines de Jéricho. Ézéchiel reçut son appel « dans le pays des Chaldéens, près du fleuve du Kebar », un canal près de Nippur ; des tablettes cunéiformes d’al-Yahudu, village d’exilés judéens quelque part en Babylonie, montrent aujourd’hui leur vie là-bas. Ésaïe enjoint aux exilés : « Sortez de Babylone, fuyez du milieu des Chaldéens ! »"
    - "Belschatsar, le « roi des Chaldéens » de Daniel, tomba quand Cyrus prit Babylone en 539 av. J.-C. Dans Daniel, les Chaldéens sont aussi une classe de sages à côté des magiciens et des astrologues, et Hérodote, Strabon et Diodore emploient de même le nom pour les prêtres et astronomes de Babylone, sens qui survécut jusqu’au Moyen Âge. Jérémie annonça que la Chaldée « sera livrée au pillage »."
    - "La Genèse place le lieu de naissance de la famille d’Abraham à « Ur en Chaldée », d’où Térach partit vers Canaan. La plupart des spécialistes l’identifient à Ur, à Tell el-Muqayyar, fouillée par Woolley à partir de 1922, bien que certains aient plaidé pour un Ur du nord près de Haran, et l’épithète est de toute façon postérieure à l’époque d’Abraham. Le discours d’Étienne rappelle qu’Abraham sortit du pays des Chaldéens. L’ancienne Chaldée est aujourd’hui le sud de l’Irak, les marais et les provinces autour de Nassiriya et de Bassorah ; le nom est aussi porté par l’Église catholique chaldéenne, la plus grande Église des chrétiens d’Irak, dont l’union avec Rome remonte au XVIe siècle."
