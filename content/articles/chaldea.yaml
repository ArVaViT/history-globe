body:
  en:
    - 'Chaldea, Kaldu in Assyrian, was the southern part of Babylonia, the marshes and river lands near the head of the Persian Gulf, where the Euphrates and Tigris draw together below Babylon. The Chaldeans first appear in Assyrian records in the ninth century BC, under Ashurnasirpal II and Shalmaneser III, as tribes settled in walled towns among the canals, Bit-Yakin, Bit-Dakkuri and Bit-Amukani the chief of them. Isaiah can still speak of the Chaldeans as a people that "was not, till the Assyrian founded it". They fought the Assyrians for a century: Merodach-baladan of Bit-Yakin, who sent envoys to Hezekiah, twice made himself king of Babylon.'
    - 'In 626 BC Nabopolassar took the throne of Babylon and founded the dynasty that modern historians often call Chaldean, though whether he came from a Chaldean tribe is debated. Under his son Nebuchadnezzar the Chaldeans became for the prophets the name of Babylon''s power: Habakkuk sees God raise up "the Chaldeans, that bitter and hasty nation"; bands of the Chaldees came against Jehoiakim; "the army of the Chaldees" pursued Zedekiah to the plains of Jericho. Ezekiel received his call "in the land of the Chaldeans by the river Chebar", a canal near Nippur; cuneiform tablets from al-Yahudu, a village of Judean exiles somewhere in Babylonia, now show their life there. Isaiah bids the exiles, "Go ye forth of Babylon, flee ye from the Chaldeans".'
    - 'Daniel''s "king of the Chaldeans", Belshazzar, fell when Cyrus took Babylon in 539 BC. In Daniel the Chaldeans are also a class of wise men beside the magicians and astrologers, and Herodotus, Strabo and Diodorus likewise use the name for the priests and astronomers of Babylon, a sense that survived into the Middle Ages. Jeremiah foretold that Chaldea "shall be a spoil".'
    - 'Genesis sets the birthplace of Abraham''s family in "Ur of the Chaldees", from which Terah went out towards Canaan. Most scholars identify it with Ur at Tell el-Muqayyar, excavated by Woolley from 1922, though some have argued for a northern Ur near Haran, and the epithet is in any case later than Abraham''s age. Stephen''s speech recalls that Abraham came out of the land of the Chaldeans. The old Chaldea is now the south of Iraq, the marshes and the provinces around Nasiriyah and Basra; the name is also borne by the Chaldean Catholic Church, the largest church of Iraq''s Christians, whose union with Rome goes back to the sixteenth century.'
  ru:
    - "Халдея, по-ассирийски Калду, — южная часть Вавилонии, болота и речные земли у вершины Персидского залива, где Евфрат и Тигр сближаются ниже Вавилона. Халдеи впервые появляются в ассирийских записях в IX веке до н. э., при Ашшурнацирапале II и Салманассаре III, как племена, осевшие в укреплённых городках среди каналов; главные из них — Бит-Якин, Бит-Даккури и Бит-Амуккани. Исаия ещё может сказать о Халдеях: «Этого народа прежде не было; Ассур положил ему начало». Они век воевали с Ассирией: Беродах Баладан из Бит-Якина, посылавший послов к Езекии, дважды делался царём Вавилона."
    - "В 626 г. до н. э. Набопаласар занял престол Вавилона и основал династию, которую современные историки часто называют халдейской, хотя происходил ли он из халдейского племени — спорно. При его сыне Навуходоносоре Халдеи стали у пророков именем вавилонской мощи: Аввакум видит, как Бог поднимает «Халдеев, народ жестокий и необузданный»; полчища Халдеев шли на Иоакима; «войско Халдейское» гналось за Седекией до равнин Иерихонских. Иезекииль получил призвание «в земле Халдейской, при реке Ховаре» — канале близ Ниппура; клинописные таблички из Аль-Яхуду, селения иудейских изгнанников где-то в Вавилонии, показывают их тамошнюю жизнь. Исаия велит изгнанникам: «Выходите из Вавилона, бегите от Халдеев»."
    - "Валтасар, «царь Халдейский» книги Даниила, пал, когда Кир взял Вавилон в 539 г. до н. э. В книге Даниила Халдеи — это также разряд мудрецов рядом с тайноведцами и гадателями, и Геродот, Страбон и Диодор так же называют жрецов и звездочётов Вавилона; в этом смысле имя дожило до Средневековья. Иеремия предрёк, что Халдея «сделается добычею»."
    - "Книга Бытия помещает родину семьи Авраама в «Уре Халдейском», откуда Фарра вышел в сторону Ханаана. Большинство учёных отождествляют его с Уром на Телль-эль-Мукайяре, раскопанным Вулли с 1922 года, хотя некоторые отстаивали северный Ур близ Харрана; само же прозвание «Халдейский» во всяком случае моложе времени Авраама. Речь Стефана вспоминает, что «он вышел из земли Халдейской». Древняя Халдея — ныне юг Ирака, болота и провинции вокруг Насирии и Басры; имя носит и Халдейская католическая церковь — крупнейшая церковь христиан Ирака, чей союз с Римом восходит к XVI веку."
  uk:
    - "Халдея, ассирійською Калду, була південною частиною Вавилонії, болотами й прирічними землями біля вершини Перської затоки, де Євфрат і Тигр зближуються нижче Вавилона. Халдеї вперше з'являються в ассирійських записах у IX ст. до н. е., за Ашшурнасірапала II та Салманассара III, як племена, що оселилися в обнесених стінами містах серед каналів, головними з яких були Бит-Якін, Бит-Дакурі та Бит-Амукані. Ісая ще може говорити про халдеїв як про народ, про який сказано: «давно того народу не було; се Ассур дав до його почин». Вони воювали з ассирійцями століття: Баладан із Бит-Якіна, який посилав послів до Єзекії, двічі робив себе царем Вавилона."
    - "У 626 р. до н. е. Набопаласар посів вавилонський трон і заснував династію, яку сучасні історики часто називають халдейською, хоча чи походив він із халдейського племені, є предметом суперечки. За його сина Навуходоносора халдеї стали для пророків назвою вавилонської могутності: Авакум бачить, як Бог підіймає «Халдеїв, нарід жорстокий, та бутний»; «ватаги Халдеїв» напали на Йоакима; «Військо Халдейське» погналося за Седекією аж до рівнини Єрихону. Єзекіїль отримав своє покликання «в Халдейській землї, при Ховар-річцї», каналі поблизу Ніппура; клинописні таблички з аль-Яхуду, села юдейських вигнанців десь у Вавилонії, тепер показують їхнє життя там. Ісая закликає вигнанців: «Рушайте ж із Вавилону, втїкайте від Халдеїв»."
    - "Валтасара, «царя Халдейського» в Книзі Даниїла, було вбито, коли Кір узяв Вавилон у 539 р. до н. е. У Книзі Даниїла халдеї також є класом мудреців поряд із чарівниками й астрологами, і Геродот, Страбон та Діодор так само вживають цю назву для жерців і астрономів Вавилона, значення, яке збереглося до Середньовіччя. Єремія пророкував, що «Халдея здобиччю їх»."
    - "Книга Буття ставить місце народження родини Авраама в «Урі Халдейському», звідки Тара вийшов у напрямку Ханаану. Більшість учених ототожнює його з Уром у Телль-ель-Муккаярі, який Вулі розкопував з 1922 р., хоча дехто доводив існування північного Ура біля Харана, а цей епітет у будь-якому разі пізніший за добу Авраама. Промова Стефана нагадує, що Авраам вийшов із землі халдейської. Давня Халдея — це тепер південь Іраку, болота й провінції навколо Насірії та Басри; цю назву носить і Халдейська католицька церква, найбільша церква іракських християн, чия унія з Римом сягає XVI ст."
  es:
    - "Caldea, Kaldu en asirio, era la parte meridional de Babilonia, las marismas y tierras fluviales cercanas a la cabecera del golfo Pérsico, donde el Éufrates y el Tigris se aproximan por debajo de Babilonia. Los caldeos aparecen por primera vez en los registros asirios en el siglo IX a. C., bajo Asurnasirpal II y Salmanasar III, como tribus asentadas en ciudades amuralladas entre los canales, siendo Bit-Yakin, Bit-Dakkuri y Bit-Amukani las principales. Isaías aún puede hablar de los caldeos como de un pueblo que «no era; Assur la fundó para los que habitaban en el desierto». Combatieron a los asirios durante un siglo: Merodac-baladán de Bit-Yakin, que envió embajadores a Ezequías, se hizo rey de Babilonia en dos ocasiones."
    - "En el 626 a. C. Nabopolasar tomó el trono de Babilonia y fundó la dinastía que los historiadores modernos suelen llamar caldea, aunque se debate si procedía de una tribu caldea. Bajo su hijo Nabucodonosor, los caldeos se convirtieron para los profetas en el nombre del poder de Babilonia: Habacuc ve a Dios levantar «los Caldeos, gente amarga y presurosa»; tropas de caldeos vinieron contra Joacim; «el ejército de los Caldeos» persiguió a Sedequías hasta las llanuras de Jericó. Ezequiel recibió su llamamiento «en la tierra de los Caldeos, junto al río de Chebar», un canal cercano a Nippur; tablillas cuneiformes de al-Yahudu, una aldea de desterrados judíos en algún lugar de Babilonia, muestran hoy su vida allí. Isaías exhorta a los desterrados: «Salid de Babilonia, huid de entre los Caldeos»."
    - "El «rey de los Caldeos» de Daniel, Belsasar, cayó cuando Ciro tomó Babilonia en el 539 a. C. En Daniel los caldeos son también una clase de sabios junto a los magos y los astrólogos, y Heródoto, Estrabón y Diodoro usan igualmente el nombre para los sacerdotes y astrónomos de Babilonia, sentido que sobrevivió hasta la Edad Media. Jeremías profetizó que Caldea «será para presa»."
    - "El Génesis sitúa el lugar de nacimiento de la familia de Abraham en «Ur de los Caldeos», de donde Taré salió hacia Canaán. La mayoría de los estudiosos la identifican con Ur, en Tell el-Muqayyar, excavada por Woolley desde 1922, aunque algunos han defendido una Ur septentrional cerca de Harán, y el epíteto es en todo caso posterior a la época de Abraham. El discurso de Esteban recuerda que Abraham salió de la tierra de los caldeos. La antigua Caldea es hoy el sur de Irak, las marismas y las provincias en torno a Nasiriya y Basora; el nombre lo lleva también la Iglesia católica caldea, la mayor iglesia de los cristianos de Irak, cuya unión con Roma se remonta al siglo XVI."
  pt:
    - "A Caldeia, Kaldu em assírio, era a parte sul da Babilônia, os pântanos e terras fluviais perto da cabeceira do Golfo Pérsico, onde o Eufrates e o Tigre se aproximam abaixo da Babilônia. Os caldeus aparecem pela primeira vez nos registros assírios no século IX a.C., sob Assurnasirpal II e Salmaneser III, como tribos fixadas em cidades muradas entre os canais, das quais Bit-Yakin, Bit-Dakkuri e Bit-Amukani eram as principais. Isaías pode ainda falar dos caldeus como de um povo: “Este povo não existia. Os assírios a fundaram para os que habitam no deserto.” Lutaram contra os assírios por um século: Merodaque-Baladã, de Bit-Yakin, que enviou emissários a Ezequias, fez-se duas vezes rei da Babilônia."
    - "Em 626 a.C., Nabopolassar tomou o trono da Babilônia e fundou a dinastia que os historiadores modernos costumam chamar caldeia, embora seja debatido se ele veio de uma tribo caldeia. Sob seu filho Nabucodonosor, os caldeus tornaram-se para os profetas o nome do poder da Babilônia: Habacuque vê Deus levantar “os caldeus, aquela nação amarga e impetuosa”; bandos de caldeus atacaram Jeoaquim; “o exército dos caldeus” perseguiu Zedequias até as planícies de Jericó. Ezequiel recebeu o seu chamado “na terra dos caldeus, junto ao rio Quebar”, um canal perto de Nipur; tabuinhas cuneiformes de al-Yahudu, aldeia de exilados judeus em algum ponto da Babilônia, mostram agora a vida deles ali. Isaías ordena aos exilados: “Saiam da Babilônia! Fujam dos caldeus!”"
    - "Belsazar, “o rei caldeu”, caiu quando Ciro tomou a Babilônia em 539 a.C. Em Daniel, os caldeus são também uma classe de sábios ao lado dos magos e astrólogos, e Heródoto, Estrabão e Diodoro usam igualmente o nome para os sacerdotes e astrônomos da Babilônia, sentido que sobreviveu até a Idade Média. Jeremias predisse que “A Caldeia será uma presa”."
    - "O Gênesis situa o lugar de nascimento da família de Abraão em “Ur dos Caldeus”, de onde Terá partiu em direção a Canaã. A maioria dos estudiosos a identifica com Ur, em Tell el-Muqayyar, escavada por Woolley a partir de 1922, embora alguns tenham defendido uma Ur do norte, perto de Harã, e o epíteto seja em todo caso posterior à época de Abraão. O discurso de Estêvão recorda que Abraão saiu da terra dos caldeus. A antiga Caldeia é hoje o sul do Iraque, os pântanos e as províncias em torno de Nasíria e Basra; o nome é também o da Igreja Católica Caldeia, a maior igreja dos cristãos do Iraque, cuja união com Roma remonta ao século XVI."
  de:
    - "Chaldäa, assyrisch Kaldu, war der südliche Teil Babyloniens, die Marschen und Flusslandschaften nahe dem Kopf des Persischen Golfs, wo sich Euphrat und Tigris unterhalb von Babylon annähern. Die Chaldäer erscheinen erstmals im 9. Jahrhundert v. Chr. unter Assurnasirpal II. und Salmanassar III. in den assyrischen Quellen, als Stämme, die in ummauerten Städten zwischen den Kanälen siedelten, mit Bit-Jakin, Bit-Dakkuri und Bit-Amukani als den wichtigsten. Jesaja kann noch vom Land der Chaldäer sagen, es sei „nicht ein Volk“ gewesen, „sondern Assur hat es angerichtet“. Sie kämpften ein Jahrhundert lang gegen die Assyrer: Merodach-Baladan von Bit-Jakin, der Gesandte zu Hiskia schickte, machte sich zweimal zum König von Babylon."
    - "Im Jahr 626 v. Chr. bestieg Nabopolassar den Thron von Babylon und gründete die Dynastie, die moderne Historiker oft chaldäisch nennen, obwohl umstritten ist, ob er aus einem chaldäischen Stamm kam. Unter seinem Sohn Nebukadnezar wurden die Chaldäer für die Propheten zum Namen der Macht Babylons: Habakuk sieht Gott „die Chaldäer erwecken, ein bitteres und schnelles Volk“; Scharen der Chaldäer zogen gegen Jojakim; „die Macht der Chaldäer“ jagte Zedekia nach bis in die Ebene von Jericho. Hesekiel erhielt seine Berufung „im Lande der Chaldäer, am Wasser Chebar“, einem Kanal bei Nippur; Keilschrifttafeln aus al-Jahudu, einem Dorf judäischer Exilierter irgendwo in Babylonien, zeigen heute ihr Leben dort. Jesaja ruft die Exilierten auf: „Gehet aus von Babel, fliehet von den Chaldäern“."
    - "Belsazar, im Buch Daniel „der Chaldäer König“, fiel, als Kyrus 539 v. Chr. Babylon einnahm. Bei Daniel sind die Chaldäer auch ein Stand von Weisen neben den Zauberern und Sterndeutern, und Herodot, Strabon und Diodor gebrauchen den Namen ebenfalls für die Priester und Astronomen Babylons, ein Sinn, der bis ins Mittelalter fortlebte. Jeremia sagte voraus: „das Chaldäerland soll ein Raub werden“."
    - "Die Genesis setzt den Geburtsort der Familie Abrahams nach „Ur in Chaldäa“, von wo Tarach auszog, um nach Kanaan zu ziehen. Die meisten Gelehrten setzen es mit Ur in Tell el-Muqayyar gleich, das Woolley ab 1922 ausgrub, obwohl einige für ein nördliches Ur bei Haran eingetreten sind und der Beiname in jedem Fall jünger ist als die Zeit Abrahams. Stephanus’ Rede erinnert daran, dass Abraham aus der Chaldäer Lande auszog. Das alte Chaldäa ist heute der Süden des Irak, die Marschen und die Provinzen um Nasirijja und Basra; der Name wird auch von der chaldäisch-katholischen Kirche getragen, der größten Kirche der Christen des Irak, deren Union mit Rom ins 16. Jahrhundert zurückreicht."
  fr:
    - "La Chaldée, Kaldu en assyrien, était la partie sud de la Babylonie, les marais et les terres fluviales près du fond du golfe Persique, où l’Euphrate et le Tigre se rapprochent en aval de Babylone. Les Chaldéens apparaissent pour la première fois dans les annales assyriennes au IXe siècle av. J.-C., sous Assurnasirpal II et Salmanasar III, comme des tribus établies dans des villes fortifiées parmi les canaux, Bit-Yakin, Bit-Dakkuri et Bit-Amukani étant les principales. Ésaïe peut encore dire des Chaldéens qu’ils « n’étaient pas un peuple », ces habitants du désert pour qui « l’Assyrien a fondé un pays ». Ils combattirent les Assyriens pendant un siècle : Berodac-Baladan de Bit-Yakin, qui envoya des messagers à Ézéchias, se fit deux fois roi de Babylone."
    - "En 626 av. J.-C., Nabopolassar prit le trône de Babylone et fonda la dynastie que les historiens modernes appellent souvent chaldéenne, bien que l’on discute s’il venait d’une tribu chaldéenne. Sous son fils Nebucadnetsar, les Chaldéens devinrent pour les prophètes le nom de la puissance de Babylone : Habacuc voit Dieu susciter « les Chaldéens, peuple furibond et impétueux » ; des bandes de Chaldéens vinrent contre Jojakim ; « l’armée des Chaldéens » poursuivit Sédécias jusque dans les plaines de Jéricho. Ézéchiel reçut son appel « dans le pays des Chaldéens, près du fleuve du Kebar », un canal près de Nippur ; des tablettes cunéiformes d’al-Yahudu, village d’exilés judéens quelque part en Babylonie, montrent aujourd’hui leur vie là-bas. Ésaïe enjoint aux exilés : « Sortez de Babylone, fuyez du milieu des Chaldéens ! »"
    - "Belschatsar, le « roi des Chaldéens » de Daniel, tomba quand Cyrus prit Babylone en 539 av. J.-C. Dans Daniel, les Chaldéens sont aussi une classe de sages à côté des magiciens et des astrologues, et Hérodote, Strabon et Diodore emploient de même le nom pour les prêtres et astronomes de Babylone, sens qui survécut jusqu’au Moyen Âge. Jérémie annonça que la Chaldée « sera livrée au pillage »."
    - "La Genèse place le lieu de naissance de la famille d’Abraham à « Ur en Chaldée », d’où Térach partit vers Canaan. La plupart des spécialistes l’identifient à Ur, à Tell el-Muqayyar, fouillée par Woolley à partir de 1922, bien que certains aient plaidé pour un Ur du nord près de Haran, et l’épithète est de toute façon postérieure à l’époque d’Abraham. Le discours d’Étienne rappelle qu’Abraham sortit du pays des Chaldéens. L’ancienne Chaldée est aujourd’hui le sud de l’Irak, les marais et les provinces autour de Nassiriya et de Bassorah ; le nom est aussi porté par l’Église catholique chaldéenne, la plus grande Église des chrétiens d’Irak, dont l’union avec Rome remonte au XVIe siècle."
  it:
    - "La Caldea, Kaldu in assiro, era la parte meridionale della Babilonia, le paludi e le terre fluviali presso la testata del Golfo Persico, dove l’Eufrate e il Tigri si avvicinano sotto Babilonia. I Caldei compaiono per la prima volta nei documenti assiri nel IX secolo a.C., sotto Assurnasirpal II e Salmanàssar III, come tribù stanziate in città murate fra i canali, delle quali Bit-Yakin, Bit-Dakkuri e Bit-Amukani erano le principali. Isaia può ancora parlare dei Caldei come di «questo popolo che già non esisteva». Combatterono gli Assiri per un secolo: Merodac-Baladan di Bit-Yakin, che mandò ambasciatori a Ezechia, si fece due volte re di Babilonia."
    - "Nel 626 a.C. Nabopolassar salì al trono di Babilonia e fondò la dinastia che gli storici moderni chiamano spesso caldea, benché si discuta se provenisse da una tribù caldea. Sotto suo figlio Nabucodonosor i Caldei divennero per i profeti il nome della potenza di Babilonia: Abacuc vede Dio suscitare «i Caldei, questa nazione aspra e impetuosa»; schiere di Caldei vennero contro Ioiakim; «l’esercito dei Caldei» inseguì Sedecia nelle pianure di Gerico. Ezechiele ricevette la sua chiamata «nel paese dei Caldei, presso al fiume Kebar», un canale presso Nippur; tavolette cuneiformi di al-Yahudu, un villaggio di esiliati giudei da qualche parte in Babilonia, mostrano ora la loro vita là. Isaia ordina agli esiliati: «Uscite da Babilonia, fuggitevene lungi dai Caldei!»"
    - "Il «re de’ Caldei» di Daniele, Baldassarre, cadde quando Ciro prese Babilonia nel 539 a.C. In Daniele i Caldei sono anche una classe di sapienti accanto ai magi e agli astrologi, ed Erodoto, Strabone e Diodoro usano il nome ugualmente per i sacerdoti e gli astronomi di Babilonia, un significato sopravvissuto fino al Medioevo. Geremia predisse che la Caldea «sarà depredata»."
    - "La Genesi pone il luogo di nascita della famiglia di Abramo in «Ur de’ Caldei», da dove Tarach partì verso Canaan. La maggior parte degli studiosi la identifica con Ur a Tell el-Muqayyar, scavata da Woolley dal 1922, benché alcuni abbiano sostenuto un’Ur settentrionale presso Carran, e l’epiteto sia in ogni caso più tardo dell’età di Abramo. Il discorso di Stefano ricorda che Abramo uscì dal paese dei Caldei. L’antica Caldea è oggi il sud dell’Iraq, le paludi e le province attorno a Nassiriya e Bassora; il nome è portato anche dalla Chiesa cattolica caldea, la maggiore Chiesa dei cristiani d’Iraq, la cui unione con Roma risale al XVI secolo."
  pl:
    - "Chaldea, po asyryjsku Kaldu, była południową częścią Babilonii, bagnami i nadrzecznymi krajami na północnym krańcu Zatoki Perskiej, gdzie Eufrat i Tygrys zbliżają się do siebie poniżej Babilonu. Chaldejczycy pojawiają się po raz pierwszy w źródłach asyryjskich w IX w. p.n.e., za Aszurnasirpala II i Salmanasara III, jako plemiona osiadłe w otoczonych murami miastach wśród kanałów, z których głównymi były Bit-Jakin, Bit-Dakkuri i Bit-Amukani. Izajasz może jeszcze mówić o Chaldejczykach jako o ludzie, o którym czytamy: „Oto ziemia Chaldejska, ten lud nie był ludem. Assyryjczyk założył ją”. Przez stulecie walczyli z Asyryjczykami: Merodak-Baladan z Bit-Jakin, który wysłał posłów do Ezechiasza, dwukrotnie został królem Babilonu."
    - "W 626 r. p.n.e. Nabopolassar objął tron Babilonu i założył dynastię, którą współcześni historycy często nazywają chaldejską, choć czy pochodził z plemienia chaldejskiego, jest sporne. Za jego syna Nabuchodonozora Chaldejczycy stali się dla proroków nazwą potęgi Babilonu: Habakuk widzi, jak Bóg wzbudza „Chaldejczyków, naród srogi i prędki”; oddziały Chaldejczyków wystąpiły przeciw Jojakimowi; „wojsko Chaldejskie” ścigało Sedekiasza aż na pola Jerycha. Ezechiel otrzymał swoje powołanie „w ziemi Chaldejskiej u rzeki Chebar”, kanału koło Nippur; tabliczki klinowe z al-Jahudu, wsi judzkich wygnańców gdzieś w Babilonii, ukazują dziś ich życie tam. Izajasz wzywa wygnańców: „Wynijdźcie z Babilonu, ucieczcie od Chaldejczyków”."
    - "Belszassar, „król Chaldejski” z Księgi Daniela, upadł, gdy Cyrus zdobył Babilon w 539 r. p.n.e. W Księdze Daniela Chaldejczycy są także klasą mędrców obok magów i astrologów, a Herodot, Strabon i Diodor również używają tej nazwy na określenie kapłanów i astronomów Babilonu, w znaczeniu, które przetrwało do średniowiecza. Jeremiasz zapowiedział, że „będzie Chaldejska ziemia na łup”."
    - "Księga Rodzaju umieszcza miejsce urodzenia rodziny Abrahama „w Ur Chaldejskiem”, skąd Terach wyruszył ku Kanaan. Większość uczonych utożsamia je z Ur w Tell el-Muqajjar, badanym przez Woolleya od 1922 r., choć niektórzy dowodzili północnego Ur koło Charanu, a przydomek jest w każdym razie późniejszy niż czasy Abrahama. Mowa Szczepana przypomina, że Abraham wyszedł z ziemi Chaldejczyków. Dawna Chaldea to dziś południe Iraku, bagna i prowincje wokół Nasirijji i Basry; nazwę nosi także Chaldejski Kościół Katolicki, największy Kościół chrześcijan Iraku, którego unia z Rzymem sięga XVI w."
  nl:
    - "Chaldea, Kaldu in het Assyrisch, was het zuidelijke deel van Babylonië, de moerassen en rivierlanden aan het noordelijke uiteinde van de Perzische Golf, waar de Eufraat en de Tigris ten zuiden van Babylon naar elkaar toe buigen. De Chaldeeën verschijnen voor het eerst in Assyrische bronnen in de negende eeuw v.Chr., onder Assurnasirpal II en Salmaneser III, als stammen die woonden in ommuurde steden tussen de kanalen, met Bit-Yakin, Bit-Dakkuri en Bit-Amukani als de voornaamste. Jesaja kan de Chaldeeën nog een volk noemen waarvan geldt: “dit volk was er niet; Assur heeft het gefondeerd”. Zij vochten een eeuw lang tegen de Assyriërs: Merodach-Baladan van Bit-Yakin, die gezanten naar Chizkia stuurde, maakte zichzelf tweemaal koning van Babylon."
    - "In 626 v.Chr. besteeg Nabopolassar de troon van Babylon en stichtte de dynastie die moderne historici vaak Chaldeeuws noemen, al wordt betwist of hij uit een Chaldeeuwse stam kwam. Onder zijn zoon Nebukadnessar werden de Chaldeeën voor de profeten de naam van Babylons macht: Habakuk ziet God opwekken “de Chaldeën, een bitter en snel volk”; benden van Chaldeeën trokken tegen Jojakim op; “het heir der Chaldeën” jaagde Zedekia na tot de vlakten van Jericho. Ezechiël ontving zijn roeping “in het land der Chaldeën, bij de rivier Chebar”, een kanaal bij Nippur; spijkerschrifttabletten uit Al-Jahudu, een dorp van Judese ballingen ergens in Babylonië, tonen nu hun leven daar. Jesaja spoort de ballingen aan: “Gaat uit van Babel, vliedt van de Chaldeën”."
    - "Daniëls “der Chaldeën koning”, Belsazar, viel toen Cyrus in 539 v.Chr. Babylon innam. In Daniël zijn de Chaldeeën ook een klasse van wijzen naast de magiërs en astrologen, en Herodotus, Strabo en Diodorus gebruiken de naam evenzo voor de priesters en sterrenkundigen van Babylon, een betekenis die tot in de middeleeuwen bleef bestaan. Jeremia voorzei: “Chaldea zal ten roof zijn.”"
    - "Genesis plaatst de geboorteplaats van Abrahams familie in “Ur der Chaldeën”, vanwaar Tarach uittrok richting Kanaän. De meeste geleerden identificeren het met Ur bij Tell el-Muqayyar, vanaf 1922 opgegraven door Woolley, al hebben sommigen gepleit voor een noordelijk Ur bij Haran, en het epitheton is in elk geval jonger dan Abrahams tijd. In Stefanus' rede wordt herinnerd dat Abraham uit het land van de Chaldeeën kwam. Het oude Chaldea is nu het zuiden van Irak, de moerassen en de provincies rond Nasiriyya en Basra; de naam wordt ook gedragen door de Chaldeeuws-katholieke Kerk, de grootste kerk van de christenen van Irak, wier vereniging met Rome teruggaat tot de zestiende eeuw."
  cs:
    - "Chaldea, asyrsky Kaldu, byla jižní část Babylonie, bažiny a říční krajina u horního konce Perského zálivu, kde se Eufrat a Tigris sbližují pod Babylónem. Chaldejci se poprvé objevují v asyrských záznamech v 9. století př. n. l., za Aššurnasirpala II. a Salmanasara III., jako kmeny usazené v opevněných městech mezi kanály, z nichž hlavními byly Bít-Jakin, Bít-Dakkúri a Bít-Amukáni. Izajáš může o Chaldejcích ještě mluvit jako o lidu, o němž se praví: „ten lid nebyl lidem. Assur vzdělal ji pro obyvatele pustin“. Bojovali s Asyřany po celé století: Merodach-baladan z Bít-Jakin, který poslal vyslance k Chizkijášovi, se dvakrát stal králem Babylóna."
    - "Roku 626 př. n. l. se Nabopolasar zmocnil trůnu v Babylóně a založil dynastii, kterou novodobí historikové často nazývají chaldejskou, ač zda pocházel z chaldejského kmene, je sporné. Za jeho syna Nebukadnesara se Chaldejci stali pro proroky jménem babylónské moci: Abakuk vidí, jak Bůh vzbuzuje „Kaldejské, národ lítý a rychlý“; oddíly Chaldejců přitáhly proti Jójakimovi; „vojsko Kaldejské“ pronásledovalo Sidkijáše na pláně u Jericha. Ezechiel přijal své povolání „v zemi Kaldejské u řeky Chebar“, kanálu u Nippuru; klínopisné tabulky z al-Yahudu, vesnice judských vyhnanců kdesi v Babylonii, dnes ukazují jejich tamní život. Izajáš vyzývá vyhnance: „Vyjděte z Babylona, utecte od Kaldejských“."
    - "Danielův „král Kaldejský“, Belšasar, padl, když Kýros roku 539 př. n. l. dobyl Babylón. V Danielovi jsou Chaldejci také třídou mudrců vedle kouzelníků a astrologů a Hérodotos, Strabón a Diodóros užívají jména podobně pro kněze a astronomy Babylóna, což se zachovalo do středověku. Jeremjáš předpověděl: „I bude země Kaldejských v loupež“."
    - "Genesis klade rodiště Abrahamovy rodiny do „Ur Kaldejských“, odkud Tarach vyšel směrem ke Kanaánu. Většina badatelů je ztotožňuje s Urem v Tell el-Muqayyar, vykopávaným Woolleym od roku 1922, ač někteří hájili severní Ur poblíž Chárana a přívlastek je každopádně pozdější než Abrahamova doba. Štěpánova řeč připomíná, že Abraham vyšel ze země Chaldejců. Stará Chaldea je dnes jih Iráku, bažiny a provincie kolem Násiríje a Basry; jméno nese i Chaldejská katolická církev, největší církev irácských křesťanů, jejíž spojení s Římem sahá do 16. století."
  sv:
    - "Kaldeen, Kaldu på assyriska, var den södra delen av Babylonien, träsken och flodländerna nära Persiska vikens inre del, där Eufrat och Tigris närmar sig varandra nedanför Babylon. Kaldéerna förekommer först i assyriska källor på 800-talet f.Kr., under Assurnasirpal II och Salmanassar III, som stammar bosatta i befästa städer bland kanalerna, där Bit-Yakin, Bit-Dakkuri och Bit-Amukani var de främsta. Jesaja kan ännu tala om kaldéerna som ”folket som förr ej var till”. De bekämpade assyrierna under ett sekel: Merodak-Baladan av Bit-Yakin, som sände sändebud till Hiskia, gjorde sig två gånger till kung av Babylon."
    - "År 626 f.Kr. tog Nabopolassar Babylons tron och grundade den dynasti som moderna historiker ofta kallar kaldeisk, även om det är omtvistat om han kom från en kaldeisk stam. Under hans son Nebukadnessar blev kaldéerna för profeterna namnet på Babylons makt: Habackuk ser Gud uppväcka ”kaldéerna det bistra och oförvägna folket”; HERREN sände ”kaldéernas … härskaror” över Jojakim; ”kaldéernas här förföljde konungen” Sidkia och hann upp honom på Jerikos hedmarker. Hesekiel fick sin kallelse ”i kaldéernas land vid strömmen Kebar”, en kanal nära Nippur; kilskriftstavlor från al-Yahudu, en by med judiska deporterade någonstans i Babylonien, visar nu deras liv där. Jesaja uppmanar de bortförda: ”Dragen ut från Babel, flyn ifrån kaldéernas land”."
    - "Daniels ”kaldéernas konung”, Belshassar, föll när Kyros intog Babylon 539 f.Kr. I Daniel är kaldéerna också en klass av vise män vid sidan av trollkarlarna och astrologerna, och Herodotos, Strabon och Diodoros använder likaså namnet om Babylons präster och astronomer, en betydelse som levde kvar in i medeltiden. Jeremia förutsade att ”Kaldeen skall lämnas till plundring”."
    - "Första Mosebok förlägger Abrahams familjs födelseort till ”det kaldeiska Ur”, varifrån Tera drog ut mot Kanaan. De flesta forskare identifierar det med Ur vid Tell el-Muqayyar, som Woolley grävde ut från 1922, även om några har hävdat ett nordligt Ur nära Harran, och tillnamnet är i alla händelser yngre än Abrahams tid. Stefanos tal erinrar om att Abraham gick ut ur kaldéernas land. Det gamla Kaldeen är nu södra Irak, träsken och provinserna kring Nasiriyah och Basra; namnet bärs också av Kaldeisk-katolska kyrkan, den största kyrkan bland Iraks kristna, vars enhet med Rom går tillbaka till 1500-talet."
  nb:
    - "Kaldea, Kaldu på assyrisk, var den sørlige delen av Babylonia, myrene og elvelandene innerst i Persiabukta, der Eufrat og Tigris nærmer seg hverandre nedenfor Babylon. Kaldeerne dukker først opp i assyriske opptegnelser på 800-tallet f.Kr., under Assurnasirpal II og Salmanassar III, som stammer bosatt i befestede byer mellom kanalene, med Bit-Yakin, Bit-Dakkuri og Bit-Amukani som de viktigste. Jesaja kan fremdeles tale om kaldeerne som «dette folk som fordum ikke var til». De kjempet mot assyrerne i et århundre: Merodak-Baladan av Bit-Yakin, som sendte sendebud til Hiskia, gjorde seg to ganger til konge av Babylon."
    - "I 626 f.Kr. tok Nabopolassar tronen i Babylon og grunnla dynastiet som moderne historikere ofte kaller kaldeisk, selv om det er omdiskutert om han kom fra en kaldeisk stamme. Under hans sønn Nebukadnesar ble kaldeerne for profetene navnet på Babylons makt: Habakkuk ser Gud reise opp kaldeerne, «det ville og voldsomme folk»; kaldeiske flokker kom mot Jojakim; «kaldeernes hær» forfulgte Sidkia til Jerikos ødemarker. Esekiel fikk sitt kall «i kaldeernes land ved elven Kebar», en kanal nær Nippur; kileskrifttavler fra al-Yahudu, en landsby for judeiske eksilerte et sted i Babylonia, viser nå livet deres der. Jesaja byr de eksilerte: «Dra ut av Babel, fly fra kaldeerne!»"
    - "Daniels «kaldeerkonge», Belsasar, falt da Kyros inntok Babylon i 539 f.Kr. I Daniel er kaldeerne også en klasse vismenn ved siden av tegnsutleggerne og stjernetyderne, og Herodot, Strabon og Diodor bruker likeledes navnet om prestene og astronomene i Babylon, en betydning som overlevde til middelalderen. Jeremia forutsa at Kaldea «skal bli til rov»."
    - "1. Mosebok setter fødestedet til Abrahams familie i «Ur i Kaldea», hvorfra Tarah drog ut mot Kanaan. De fleste forskere identifiserer det med Ur ved Tell el-Muqayyar, gravd ut av Woolley fra 1922, selv om noen har argumentert for et nordlig Ur nær Harran, og tilnavnet er uansett yngre enn Abrahams tid. Stefanus' tale minner om at Abraham drog ut «fra kaldeernes land». Det gamle Kaldea er nå Sør-Irak, myrene og provinsene rundt Nasiriyah og Basra; navnet bæres også av Den kaldeiske katolske kirke, den største kirken blant Iraks kristne, hvis forening med Roma går tilbake til 1500-tallet."
  tl:
    - "Ang Caldea, Kaldu sa Asiryo, ay ang katimugang bahagi ng Babilonia, ang mga latian at lupaing-ilog malapit sa dulo ng Golpo ng Persia, kung saan nagkakalapit ang Eufrates at Tigris sa ibaba ng Babilonia. Unang lumilitaw ang mga Caldeo sa mga talaan ng Asiria noong ika-9 na siglo BK, sa ilalim nina Ashurnasirpal II at Salmanasar III, bilang mga tribong nanirahan sa mga bayang may pader sa gitna ng mga kanal, na ang Bit-Yakin, Bit-Dakkuri at Bit-Amukani ang pangunahin. Maaari pa ring tukuyin ni Isaias ang mga Caldeo bilang isang bayan na hindi umiral hanggang itatag ito ng Asiryo. Nakipaglaban sila sa mga Asiryo sa loob ng isang siglo: si Merodach-baladan ng Bit-Yakin, na nagpadala ng mga sugo kay Ezechias, ay dalawang ulit na ginawa ang sarili na hari ng Babilonia."
    - "Noong 626 BK ay inagaw ni Nabopolassar ang trono ng Babilonia at itinatag ang dinastiyang madalas tawaging Caldeo, bagaman pinagtatalunan kung Caldeo siya ng tribo. Sa ilalim ng anak niyang si Nabucodonosor, ang Caldeo ang naging pangalan ng kapangyarihan ng Babilonia para sa mga propeta: nakikita ni Habacuc na itinitindig ng Dios “ang mga Caldeo, yaong makapangingilabot at marahas na bansa”; ang mga pulutong ng mga Caldeo ay sumalakay kay Joacim; hinabol ng “hukbo ng mga Caldeo” si Sedecias hanggang sa mga kapatagan ng Jerico. Natawag si Ezekiel “sa lupain ng mga Caldeo sa pangpang ng ilog Chebar”, isang kanal malapit sa Nippur; ipinakikita ng mga tabletang cuneiform mula sa al-Yahudu, nayon ng mga destiyerong taga-Juda sa Babilonia, ang kanilang buhay doon. Sinabi ni Isaias sa mga destiyero, “Kayo'y magsilabas sa Babilonia, inyong takasan ang mga Caldeo”."
    - "Si Belsasar, ang “hari ng mga taga Caldea” ni Daniel, ay napatay nang sakupin ni Ciro ang Babilonia noong 539 BK. Sa Daniel, ang mga Caldeo ay isa ring uri ng mga pantas sa tabi ng mga salamangkero at astrologo, at ginagamit din nina Herodoto, Strabo at Diodoro ang pangalan para sa mga saserdote at astronomo ng Babilonia, kahulugang nanatili hanggang sa panahong medyebal. Inihula ni Jeremias na ang Caldea ay “magiging samsam”."
    - "Itinatakda ng Genesis ang lugar ng kapanganakan ng pamilya ni Abraham sa “Ur ng mga Caldeo”, kung saan umalis si Tara patungong Canaan. Karamihan sa mga iskolar ay kumikilala rito sa Ur sa Tell el-Muqayyar, na hinukay ni Woolley mula 1922, bagaman may nangatwiran para sa isang hilagang Ur malapit sa Haran, at gayon man ay mas huli ang taguri kaysa kapanahunan ni Abraham. Ipinaaalala ng talumpati ni Esteban na lumabas si Abraham sa lupain ng mga Caldeo. Ang dating Caldea ay ngayon ang timog ng Iraq, ang mga latian at mga lalawigan sa palibot ng Nasiriyah at Basra; dala rin ng Simbahang Katolikong Caldeo ang pangalan, ang pinakamalaking simbahan ng mga Kristiyano ng Iraq, na ang pakikipag-isa sa Roma ay mula pa sa ika-16 na siglo."
  da:
    - "Kaldæa, assyrisk Kaldu, var den sydlige del af Babylonien, moserne og flodlandene inderst i Den Persiske Bugt, hvor Eufrat og Tigris nærmer sig hinanden neden for Babylon. Kaldæerne optræder første gang i assyriske optegnelser i 800-tallet f.Kr., under Assurnasirpal 2. og Salmanassar 3., som stammer bosat i befæstede byer blandt kanalerne, med Bit-Yakin, Bit-Dakkuri og Bit-Amukani som de vigtigste. Esajas kan endnu tale om kaldæerne som et folk, »som ikke længe har været til, Assur har grundlagt det«. De kæmpede mod assyrerne i et århundrede: Merodak-Baladan af Bit-Yakin, der sendte sendebud til Hizkija, gjorde sig to gange til konge af Babylon."
    - "I 626 f.Kr. tog Nabopolassar tronen i Babylon og grundlagde det dynasti, som moderne historikere ofte kalder kaldæisk, selv om det er omdiskuteret, om han kom fra en kaldæisk stamme. Under hans søn Nebukadnezar blev kaldæerne for profeterne navnet på Babylons magt: Habakkuk ser Gud opvække »Kaldæerne, et barsk og hastigt Folk«; kaldæiske tropper kom imod Jojakim; »Kaldæernes Hær« forfulgte Zedekias til sletten ved Jeriko. Ezekiel modtog sit kald »i Kaldæernes Land, ved Floden Kebar«, en kanal nær Nippur; kileskrifttavler fra Al-Yahudu, en landsby af judæiske eksilanter et sted i Babylonien, viser nu deres liv dér. Esajas opfordrer de bortførte: »Gaar ud af Babel, flyer fra Kaldæerne«."
    - "Daniels »Kaldæernes Konge«, Belsazar, faldt, da Kyros indtog Babylon i 539 f.Kr. I Daniel er kaldæerne også en klasse af vise mænd ved siden af magikerne og astrologerne, og Herodot, Strabon og Diodor bruger ligeledes navnet om Babylons præster og astronomer, en betydning der overlevede ind i middelalderen. Jeremias forudsagde, at Kaldæa »skal blive til Rov«."
    - "1 Mosebog placerer fødestedet for Abrahams familie i »Ur i Kaldæa«, hvorfra Tera drog ud mod Kana'an. De fleste forskere identificerer det med Ur ved Tell el-Muqayyar, udgravet af Woolley fra 1922, selv om nogle har argumenteret for et nordligt Ur nær Karan, og tilnavnet er under alle omstændigheder yngre end Abrahams tid. Stefanus' tale minder om, at Abraham kom ud af kaldæernes land. Det gamle Kaldæa er nu det sydlige Irak, moserne og provinserne omkring Nasiriyya og Basra; navnet bæres også af Den Kaldæiske Katolske Kirke, den største kirke blandt Iraks kristne, hvis forening med Rom går tilbage til 1500-tallet."
  sr:
    - "Халдеја, асирски Калду, био је јужни део Вавилоније, мочваре и речни крајеви близу дна Персијског залива, где се Еуфрат и Тигар приближавају испод Вавилона. Халдејци се први пут појављују у асирским записима у 9. веку п. н. е., за Ашурнасирпала II и Салманасара III, као племена настањена у утврђеним градовима међу каналима, од којих су главна Бит-Јакин, Бит-Даккури и Бит-Амукани. Исаија Халдејце још може назвати народом о коме каже: „тог народа није било; Асур је основа за оне који живеху у пустињама“. Читав век ратовали су с Асирцима: Меродах-Валадан из Бит-Јакина, који је слао посланике Језекији, двапут се прогласио краљем Вавилона."
    - "Године 626. п. н. е. Набополасар је заузео престо Вавилона и основао династију коју савремени историчари често називају халдејском, мада се расправља да ли је потицао из неког халдејског племена. Под његовим сином Навуходоносором Халдејци су за пророке постали име вавилонске силе: Авакум види како Бог подиже „Халдејце, народ љут и нагао“; чете халдејске нападале су Јоакима; „војска халдејска“ потерала је Седекију до јерихонских поља. Језекиљ је примио свој позив „у земљи халдејској на реци Хевару“, каналу близу Нипура; клинасте плочице из ал-Јахудуа, села јудејских прогнаника негде у Вавилонији, сада показују њихов живот тамо. Исаија позива изгнанике: „Изађите из Вавилона, бежите од Халдејаца“."
    - "Данилов Валтасар, „цар халдејски“, пао је када је Кир заузео Вавилон 539. п. н. е. У Књизи пророка Данила Халдејци су и сталеж мудраца поред врача и звездара, а Херодот, Страбон и Диодор такође користе то име за свештенике и астрономе Вавилона, у значењу које је преживело до средњег века. Јеремија је најавио: „земља ће се халдејска опленити“."
    - "Постање смешта постојбину Аврамове породице „у Уру халдејском“, одакле је Тара кренуо ка Ханану. Већина научника га поистовећује с Уром у Тел ел Мукајару, који је Вули ископавао од 1922, мада су неки заступали северни Ур близу Харана, а епитет је у сваком случају каснији од Аврамовог доба. Стефанов говор подсећа да је Аврам изашао из земље халдејске. Стара Халдеја је сада југ Ирака, мочваре и провинције око Насирије и Басре; име носи и Халдејска католичка црква, највећа црква ирачких хришћана, чије уједињење с Римом сеже у 16. век."
