body:
  en:
    - "Haradah is one of the camps of Israel in the wilderness, known only from the list of stations in Numbers 33: “And they removed from mount Shapher, and encamped in Haradah. And they removed from Haradah, and pitched in Makheloth.” It belongs to a run of names between Rithmah and Moseroth most of which occur nowhere else in the Bible and that no story is attached to. The name seems to come from a Hebrew root meaning “to tremble” or “to fear”, but why the camp was called so is not said."
    - "Nothing else is known, and the site cannot be fixed. Proposals range across the Sinai and the Negeb: along Wadi Lussan, south-west of Kadesh, which the map follows; at Jebel Aradeh in the south of the peninsula; or at Jebel Araif en-Naqa, a mountain whose name some hear as an echo of Haradah. All rest on the general line of the route and on likeness of names, and the order and direction of these stations are themselves debated."
  ru:
    - "Харада — один из станов Израиля в пустыне, известный только по списку стоянок в книге Чисел: «И отправились от горы Шафер и расположились станом в Хараде. И отправились из Харады и расположились станом в Макелофе». Он принадлежит к ряду имён между Рифмой и Мосерофом, большинство которых больше нигде в Библии не встречается и к которым не привязано ни одного рассказа. Имя, по-видимому, происходит от еврейского корня со значением «трепетать» или «бояться», но почему стан так назван, не сказано."
    - "Больше ничего не известно, и место установить нельзя. Его предлагали искать в разных местах Синая и Негева: вдоль Вади-Луссан, к юго-западу от Кадеса, чему следует карта; у Джебель-Араде на юге полуострова; или у Джебель-Араиф-эн-Нака, горы, в имени которой некоторые слышат отзвук Харады. Всё это опирается на общее направление пути и на сходство имён, а порядок и направление этих стоянок сами по себе спорны."
  uk:
    - "Харада — один зі станів Ізраїлю в пустелі, відомий лише з переліку стоянок у Числах 33: «І рушили від Шефер гори та й отаборились у Гарадї. І рушили з Гаради та й отаборились у Макелотї». Вона належить до низки назв між Ріфмою та Мосеротом, більшість з яких більше ніде в Біблії не трапляється і з якими не пов’язана жодна оповідь. Назва, схоже, походить від давньоєврейського кореня, що означає «тремтіти» або «боятися», але чому стан так названо, не сказано."
    - "Більше нічого невідомо, і місце не можна визначити. Пропозиції розкидані по Синаю й Негеву: вздовж Ваді-Люссан на південний захід від Кадеша, чого й дотримується карта; на Джебель-Арада на півдні півострова; або на Джебель-Арейф-ен-Накая, горі, назву якої дехто чує як відлуння Гаради. Усі вони спираються на загальну лінію маршруту та схожість назв, а порядок і напрям цих стоянок самі є предметом суперечок."
  es:
    - "Harada es uno de los campamentos de Israel en el desierto, conocido solo por la lista de estaciones de Números 33: «Y partidos del monte de Sepher, asentaron en Harada. Y partidos de Harada, asentaron en Maceloth». Pertenece a una serie de nombres entre Ritma y Moserot, la mayoría de los cuales no aparecen en ningún otro lugar de la Biblia y a los que no va unido ningún relato. El nombre parece venir de una raíz hebrea que significa «temblar» o «temer», pero no se dice por qué el campamento se llamó así."
    - "No se sabe nada más y el sitio no puede fijarse. Las propuestas abarcan el Sinaí y el Néguev: a lo largo del Wadi Lussan, al suroeste de Cades, que es lo que sigue el mapa; en el Jebel Aradeh, en el sur de la península; o en el Jebel Araif en-Naqa, una montaña cuyo nombre algunos oyen como un eco de Harada. Todas se apoyan en la línea general de la ruta y en la semejanza de los nombres, y el orden y la dirección de estas estaciones son en sí mismos discutidos."
  pt:
    - "Harada é um dos acampamentos de Israel no deserto, conhecido apenas pela lista de estações de Números 33: “Partiram do monte Sefer e acamparam em Harada. Partiram de Harada e acamparam em Macelote.” Pertence a uma série de nomes entre Ritma e Moserote, a maioria dos quais não ocorre em nenhum outro lugar da Bíblia e aos quais nenhuma história se liga. O nome parece vir de uma raiz hebraica que significa “tremer” ou “temer”, mas por que o acampamento se chamava assim não é dito."
    - "Nada mais se sabe, e o sítio não pode ser fixado. As propostas se estendem pelo Sinai e pelo Neguebe: ao longo do uádi Lussan, a sudoeste de Cades, que o mapa segue; em Jebel Aradeh, no sul da península; ou em Jebel Araif en-Naqa, um monte cujo nome alguns ouvem como eco de Harada. Todas repousam na linha geral da rota e na semelhança de nomes, e a ordem e a direção dessas estações são, elas mesmas, debatidas."
  de:
    - "Harada ist eines der Lager Israels in der Wüste, nur aus der Stationenliste in 4. Mose 33 bekannt: „Vom Gebirge Sepher zogen sie aus und lagerten sich in Harada. Von Harada zogen sie aus und lagerten sich in Makheloth.“ Es gehört zu einer Reihe von Namen zwischen Ritma und Moserot, von denen die meisten sonst nirgends in der Bibel vorkommen und an die sich keine Geschichte knüpft. Der Name scheint von einer hebräischen Wurzel zu stammen, die „zittern“ oder „sich fürchten“ bedeutet, doch warum das Lager so hieß, wird nicht gesagt."
    - "Sonst ist nichts bekannt, und die Stätte lässt sich nicht festlegen. Die Vorschläge streuen über den Sinai und den Negev: entlang des Wadi Lussan südwestlich von Kadesch, dem die Karte folgt; am Dschebel Aradeh im Süden der Halbinsel; oder am Dschebel Araif en-Naqa, einem Berg, dessen Name manche als Anklang an Harada hören. Alle beruhen auf der allgemeinen Linie der Route und auf Namensähnlichkeit, und Reihenfolge und Richtung dieser Stationen sind selbst umstritten."
  fr:
    - "Harada est l’un des campements d’Israël dans le désert, connu seulement par la liste des étapes de Nombres 33 : « Ils partirent de la montagne de Schapher, et campèrent à Harada. Ils partirent de Harada, et campèrent à Makhéloth. » Elle appartient à une suite de noms entre Rithma et Moséroth, pour la plupart absents ailleurs dans la Bible, et auxquels aucun récit n’est rattaché. Le nom semble venir d’une racine hébraïque signifiant « trembler » ou « craindre », mais on ne dit pas pourquoi le camp fut ainsi appelé."
    - "On ne sait rien d’autre, et le site ne peut être fixé. Les propositions s’étendent à travers le Sinaï et le Négev : le long de l’oued Lussan, au sud-ouest de Qadesh, que suit la carte ; au Jebel Aradeh dans le sud de la péninsule ; ou au Jebel Araif en-Naqa, une montagne dont certains entendent le nom comme un écho de Harada. Toutes reposent sur la ligne générale de l’itinéraire et sur la ressemblance des noms, et l’ordre et la direction de ces étapes sont eux-mêmes débattus."
  pl:
    - "Charada to jeden z obozów Izraela na pustyni, znany tylko z wykazu stacji w Księdze Liczb 33: „A ruszywszy się z góry Sefer, położyli się obozem w Charada. A ruszywszy się z Charada, położyli się obozem w Makelot”. Należy do ciągu nazw między Retmą a Moserot, z których większość nie występuje nigdzie indziej w Biblii i do których nie dołączono żadnej opowieści. Nazwa wydaje się pochodzić od hebrajskiego pierwiastka znaczącego „drżeć” lub „bać się”, lecz dlaczego obóz tak nazwano, nie powiedziano."
    - "Nic więcej nie wiadomo i miejsca nie da się ustalić. Propozycje rozciągają się po Synaju i Negewie: wzdłuż Wadi Lussan, na południowy zachód od Kadesz, za czym idzie mapa; w Dżebel Aradeh na południu półwyspu; albo w Dżebel Araif en-Naka, górze, której nazwa brzmi dla niektórych jak echo Charady. Wszystkie opierają się na ogólnym przebiegu trasy i podobieństwie nazw, a sama kolejność i kierunek tych stacji są sporne."
  it:
    - "Carada è uno degli accampamenti d’Israele nel deserto, noto solo dall’elenco delle tappe in Numeri 33: «Partirono dal monte di Scefer e si accamparono a Harada. Partirono da Harada e si accamparono a Makheloth». Appartiene a una serie di nomi fra Ritma e Moserot, la maggior parte dei quali non compare altrove nella Bibbia e a cui non è legato alcun racconto. Il nome sembra derivare da una radice ebraica che significa «tremare» o «temere», ma perché l’accampamento fosse così chiamato non è detto."
    - "Nulla di più si sa, e il sito non si può fissare. Le proposte spaziano per il Sinai e il Negheb: lungo il Wadi Lussan, a sud-ovest di Kades, che la mappa segue; a Jebel Aradeh nel sud della penisola; o a Jebel Araif en-Naqa, un monte il cui nome alcuni sentono come un’eco di Carada. Tutte poggiano sulla linea generale del percorso e sulla somiglianza dei nomi, e l’ordine e la direzione di queste tappe sono essi stessi discussi."
  nl:
    - "Charada is een van de legerplaatsen van Israël in de woestijn, alleen bekend uit de lijst van haltes in Numeri 33: “En zij verreisden van het gebergte Safer, en legerden zich in Harada. En zij verreisden van Harada, en legerden zich in Makheloth.” Het hoort bij een reeks namen tussen Ritma en Moserot, de meeste nergens anders in de Bijbel voorkomend en zonder verhaal. De naam lijkt af te stammen van een Hebreeuwse wortel die “beven” of “vrezen” betekent, maar waarom de legerplaats zo heette, wordt niet gezegd."
    - "Meer is er niet bekend, en de plaats kan niet worden vastgesteld. Voorstellen lopen uiteen over de Sinaï en de Negev: langs de Wadi Lussan, ten zuidwesten van Kades, wat de kaart volgt; bij Jebel Aradeh in het zuiden van het schiereiland; of bij Jebel Araif en-Naqa, een berg waarvan de naam volgens sommigen een echo van Charada is. Alle berusten op de algemene lijn van de route en op gelijkenis van namen, en de volgorde en richting van deze haltes worden zelf betwist."
  cs:
    - "Charada je jeden z táborů Izraele na poušti, známý jen ze seznamu stanic v Numeri 33: „A když se hnuli s hory Sefer, položili se v Arad. A hnuvše se z Arad, položili se v Machelot.“ Patří do řady jmen mezi Ritmou a Moserótem, z nichž většina se v Bibli nevyskytuje nikde jinde a není k nim připojen žádný příběh. Jméno se zdá pocházet z hebrejského kořene „třást se“ nebo „bát se“, ale proč se tábor tak nazýval, není řečeno."
    - "Nic dalšího není známo a místo nelze určit. Návrhy se rozkládají po celém Sinaji a Negevu: podél Wádí Lussan jihozápadně od Kádeše, což mapa následuje; na Džebel Aradeh na jihu poloostrova; nebo na Džebel Araif en-Naqa, hoře, jejíž jméno někteří slyší jako ozvěnu Charady. Všechny se opírají o obecný směr cesty a podobnost jmen a pořadí a směr těchto stanic jsou samy sporné."
  sv:
    - "Harada är ett av Israels läger i öknen, känt bara från stationsförteckningen i Fjärde Moseboken 33: ”Och de bröto upp från berget Sefer och lägrade sig i Harada. Och de bröto upp från Harada och lägrade sig i Makhelot.” Det hör till en rad namn mellan Ritma och Moserot som för det mesta inte förekommer någon annanstans i Bibeln och som ingen berättelse är knuten till. Namnet tycks komma från en hebreisk rot som betyder ”darra” eller ”frukta”, men varför lägret kallades så sägs inte."
    - "Inget mer är känt, och platsen kan inte fastställas. Förslagen sträcker sig över Sinai och Negev: längs Wadi Lussan, sydväst om Kadesh, vilket kartan följer; vid Jebel Aradeh i halvöns södra del; eller vid Jebel Araif en-Naqa, ett berg vars namn några hör som ett eko av Harada. Alla vilar på färdvägens allmänna linje och på likhet i namn, och ordningen och riktningen på dessa stationer är själva omdebatterade."
scripture:
  - Num.33.18-Num.33.30
sources:
  - "B. A. Levine, Numbers 21-36 (Anchor Bible, 2000)"
  - "G. I. Davies, The Way of the Wilderness: A Geographical Study of the Wilderness Itineraries in the Old Testament (1979)"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
