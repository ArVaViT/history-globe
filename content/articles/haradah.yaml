# Overview article (ADR 0007). Mainstream facts only; Haradah is known only from the itinerary of Numbers 33; the proposed sites are given as proposals and none is chosen.
id: haradah
place: a73af5f
title:
  en: "Haradah"
  ru: "Харада"
body:
  en:
    - "Haradah is one of the camps of Israel in the wilderness, known only from the list of stations in Numbers 33: “And they removed from mount Shapher, and encamped in Haradah. And they removed from Haradah, and pitched in Makheloth.” It belongs to a run of names between Rithmah and Moseroth most of which occur nowhere else in the Bible and that no story is attached to. The name seems to come from a Hebrew root meaning “to tremble” or “to fear”, but why the camp was called so is not said."
    - "Nothing else is known, and the site cannot be fixed. Proposals range across the Sinai and the Negeb: along Wadi Lussan, south-west of Kadesh, which the map follows; at Jebel Aradeh in the south of the peninsula; or at Jebel Araif en-Naqa, a mountain whose name some hear as an echo of Haradah. All rest on the general line of the route and on likeness of names, and the order and direction of these stations are themselves debated."
  ru:
    - "Харада — один из станов Израиля в пустыне, известный только по списку стоянок в книге Чисел: «И отправились от горы Шафер и расположились станом в Хараде. И отправились из Харады и расположились станом в Макелофе». Он принадлежит к ряду имён между Рифмой и Мосерофом, большинство которых больше нигде в Библии не встречается и к которым не привязано ни одного рассказа. Имя, по-видимому, происходит от еврейского корня со значением «трепетать» или «бояться», но почему стан так назван, не сказано."
    - "Больше ничего не известно, и место установить нельзя. Его предлагали искать в разных местах Синая и Негева: вдоль Вади-Луссан, к юго-западу от Кадеса, чему следует карта; у Джебель-Араде на юге полуострова; или у Джебель-Араиф-эн-Нака, горы, в имени которой некоторые слышат отзвук Харады. Всё это опирается на общее направление пути и на сходство имён, а порядок и направление этих стоянок сами по себе спорны."
scripture:
  - Num.33.24-Num.33.25
sources:
  - "B. A. Levine, Numbers 21-36 (Anchor Bible, 2000)"
  - "G. I. Davies, The Way of the Wilderness: A Geographical Study of the Wilderness Itineraries in the Old Testament (1979)"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
