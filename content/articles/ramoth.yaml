# Overview article (ADR 0007). Mainstream facts only; this record carries the city-of-refuge verses of Ramoth in Gilead, whose wars and site are told in the Ramoth-gilead article; the site is disputed and named as such.
id: ramoth
place: a95147f
title:
  en: "Ramoth"
  ru: "Рамоф"
  uk: "Рамот"
  es: "Ramot"
  pt: "Ramote"
  de: "Ramot"
  fr: "Ramoth"
body:
  en:
    - "Ramoth, “heights”, is Ramoth in Gilead, the same city as Ramoth-gilead, whose wars with Damascus have their own article. These four verses are about its other office. When Moses had settled the tribes east of the Jordan he set apart three cities there for the manslayer, “Bezer in the wilderness, in the plain country, of the Reubenites; and Ramoth in Gilead, of the Gadites; and Golan in Bashan, of the Manassites”, and Joshua confirmed them with three more west of the river. A man who killed without intent could flee to such a city and be safe from the avenger of blood until he was tried, and he had to stay there until the high priest died. Ramoth was also one of the four towns Gad gave to the Levites of Merari, “Ramoth in Gilead with her suburbs”, so that the city of refuge was a Levites' town, as the law intended."
    - "The site of Gilead's city of refuge is disputed: Tell er-Rumeith, a small Iron Age fort dug by Paul Lapp in the 1960s, the town of ar-Ramtha beside it, which keeps the name, and Tell el-Husn near Irbid are the candidates, as the Ramoth-gilead article explains. Eusebius placed Ramoth fifteen miles west of Philadelphia, that is Amman, which fits none of them well."
    - "Today the candidate sites lie in the far north of Jordan near the Syrian border, around Ramtha and Irbid, farmland on the Hauran plain."
  ru:
    - "Рамоф, «высоты», — это Рамоф в Галааде, тот же город, что Рамоф Галаадский, о войнах которого с Дамаском есть отдельная статья. Эти четыре стиха о другом его назначении. Устроив колена к востоку от Иордана, Моисей отделил там три города для убийцы: «Бецер в пустыне, на равнине в колене Рувимовом, и Рамоф в Галааде в колене Гадовом, и Голан в Васане в колене Манассиином», а Иисус Навин подтвердил их и прибавил три к западу от реки. Убивший без умысла мог бежать в такой город и быть в безопасности от мстителя за кровь до суда, и должен был оставаться там до смерти первосвященника. Рамоф был и одним из четырёх городов, которые Гад отдал левитам из рода Мерари, «Рамоф в Галааде и предместья его», так что город убежища был левитским, как и предполагал закон."
    - "Место галаадского города убежища спорно: Телль-эр-Румейт, небольшая крепость железного века, раскопанная Полом Лэппом в 1960-х, соседний город Эр-Рамта, сохранивший имя, и Телль-эль-Хусн близ Ирбида — кандидаты, как объясняет статья о Рамофе Галаадском. Евсевий помещал Рамоф в пятнадцати милях к западу от Филадельфии, то есть Аммана, что плохо подходит ко всем троим."
    - "Сегодня места-кандидаты лежат на крайнем севере Иордании у сирийской границы, вокруг Рамты и Ирбида, среди полей Хауранской равнины."
  uk:
    - "Рамот, «висоти», — це Рамот у Гілеаді, те саме місто, що й Рамот Гілеадський, чиї війни з Дамаском мають окрему статтю. Ці чотири вірші — про його іншу службу. Коли Мойсей оселив племена на схід від Йордану, він виділив там три міста для вбивці: «Безер у степу, на поділлї, для Рубенїїв, і Рамот у Гілеадї для Гадїїв, і Голян у Базанї для Манассіїв», а Ісус Навин підтвердив їх трьома іншими на захід від річки. Той, хто вбив ненавмисно, міг утекти до такого міста й бути в безпеці від месника за кров, доки його не судитимуть, і мусив лишатися там, поки не помре первосвященик. Рамот був також одним із чотирьох міст, які Гад віддав левітам Мерарі, «Рамот у Галаадї вкупі з пасовищами його», тож місто-сховище було містом левітів, як і задумував закон."
    - "Розташування гілеадського міста-сховища спірне: Телль-ер-Румейт, невеликий форт залізної доби, розкопаний Полом Лаппом у 1960-х роках, місто ар-Рамта поруч із ним, яке зберігає назву, і Телль-ель-Хусн біля Ірбіда — ось кандидати, як пояснює стаття про Рамот Гілеадський. Євсевій розмістив Рамот за п’ятнадцять миль на захід від Філадельфії, тобто Амману, що не добре збігається з жодним із них."
    - "Сьогодні місця-кандидати лежать на крайній півночі Йорданії поблизу сирійського кордону, довкола Рамти й Ірбіда, — це рілля на рівнині Хавран."
  es:
    - "Ramot, «alturas», es Ramot en Galaad, la misma ciudad que Ramot de Galaad, cuyas guerras con Damasco tienen su propio artículo. Estos cuatro versículos tratan de su otro oficio. Cuando Moisés hubo asentado las tribus al este del Jordán, apartó allí tres ciudades para el homicida, «Beser en el desierto, en tierra de la llanura, de los Rubenitas; y á Ramoth en Galaad, de los Gaditas; y á Golán en Basán, de los de Manasés», y Josué las confirmó con otras tres al oeste del río. Un hombre que mataba sin intención podía huir a una de esas ciudades y estar a salvo del vengador de la sangre hasta ser juzgado, y debía permanecer allí hasta la muerte del sumo sacerdote. Ramot fue también una de las cuatro ciudades que Gad dio a los levitas de Merari, «Ramoth en Galaad con sus ejidos», de modo que la ciudad de refugio era una ciudad de levitas, como la ley pretendía."
    - "El emplazamiento de la ciudad de refugio de Galaad se discute: Tell er-Rumeith, un pequeño fuerte de la Edad del Hierro excavado por Paul Lapp en la década de 1960, la ciudad de ar-Ramtha junto a él, que conserva el nombre, y Tell el-Husn, cerca de Irbid, son los candidatos, como explica el artículo de Ramot de Galaad. Eusebio situó Ramot a quince millas al oeste de Filadelfia, es decir, de Amán, lo que no concuerda bien con ninguno."
    - "Hoy los lugares candidatos se encuentran en el extremo norte de Jordania, cerca de la frontera siria, en torno a Ramtha e Irbid, tierras de labor de la llanura del Haurán."
  pt:
    - "Ramote, “alturas”, é Ramote em Gileade, a mesma cidade que Ramote-Gileade, cujas guerras com Damasco têm artigo próprio. Estes quatro versículos tratam de seu outro ofício. Quando Moisés assentou as tribos a leste do Jordão, separou ali três cidades para o homicida, “Bezer, no deserto, na região do planalto, para os rubenitas; Ramote, em Gileade, para os gaditas; e Golã, em Basã, para os manassitas”, e Josué as confirmou com mais três a oeste do rio. Quem matasse sem intenção podia fugir para uma dessas cidades e ficar a salvo do vingador do sangue até ser julgado, e tinha de ficar ali até a morte do sumo sacerdote. Ramote foi também uma das quatro cidades que Gade deu aos levitas de Merari, “Ramote, em Gileade, com as suas pastagens”, de modo que a cidade de refúgio era uma cidade levítica, como a lei pretendia."
    - "O local da cidade de refúgio de Gileade é disputado: Tell er-Rumeith, pequeno forte da Idade do Ferro escavado por Paul Lapp na década de 1960, a cidade de ar-Ramtha ao lado dele, que guarda o nome, e Tell el-Husn, perto de Irbid, são os candidatos, como explica o artigo Ramote-Gileade. Eusébio situou Ramote a quinze milhas a oeste de Filadélfia, isto é, Amã, o que não combina bem com nenhum deles."
    - "Hoje os locais candidatos ficam no extremo norte da Jordânia, perto da fronteira síria, em torno de Ramtha e Irbid, terras agrícolas da planície do Haurã."
  de:
    - "Ramot, „Höhen“, ist Ramot in Gilead, dieselbe Stadt wie Ramot-Gilead, dessen Kriege mit Damaskus einen eigenen Artikel haben. Diese vier Verse handeln von ihrem anderen Amt. Als Mose die Stämme östlich des Jordan angesiedelt hatte, sonderte er dort drei Städte für den Totschläger aus, „Bezer in der Wüste im ebnen Lande unter den Rubenitern und Ramoth in Gilead unter den Gaditern und Golan in Basan unter den Manassitern“, und Josua bestätigte sie mit drei weiteren westlich des Flusses. Wer ohne Absicht getötet hatte, konnte in eine solche Stadt fliehen und war vor dem Bluträcher sicher, bis er vor Gericht stand, und musste dort bleiben, bis der Hohepriester starb. Ramot war auch eine der vier Städte, die Gad den Leviten aus Merari gab, „Ramoth in Gilead, und seine Vorstädte“, sodass die Freistadt eine Levitenstadt war, wie das Gesetz es wollte."
    - "Die Lage der gileaditischen Freistadt ist umstritten: Tell er-Rumeith, ein kleines eisenzeitliches Kastell, das Paul Lapp in den 1960er Jahren ausgrub, die Stadt ar-Ramtha daneben, die den Namen bewahrt, und Tell el-Husn bei Irbid sind die Kandidaten, wie der Artikel Ramot-Gilead erklärt. Eusebius setzte Ramot fünfzehn Meilen westlich von Philadelphia, also Amman, was zu keinem davon gut passt."
    - "Heute liegen die Kandidatenorte im äußersten Norden Jordaniens nahe der syrischen Grenze, um Ramtha und Irbid, Ackerland auf der Hauran-Ebene."
  fr:
    - "Ramoth, « hauteurs », est la Ramoth de Galaad, la même ville que Ramoth en Galaad, dont les guerres avec Damas ont leur propre article. Ces quatre versets concernent son autre fonction. Quand Moïse eut installé les tribus à l’est du Jourdain, il mit à part trois villes pour le meurtrier, « Betser, dans le désert, dans la plaine, chez les Rubénites ; Ramoth, en Galaad, chez les Gadites, et Golan, en Basan, chez les Manassites », et Josué les confirma avec trois autres à l’ouest du fleuve. Celui qui avait tué sans intention pouvait fuir dans une telle ville et y être à l’abri du vengeur du sang jusqu’à son jugement, et il devait y rester jusqu’à la mort du grand prêtre. Ramoth fut aussi l’une des quatre villes que Gad donna aux Lévites de Merari, « Ramoth en Galaad et sa banlieue », de sorte que la ville de refuge était une ville de Lévites, comme la loi l’avait voulu."
    - "L’emplacement de la ville de refuge de Galaad est disputé : Tell er-Rumeith, petit fort de l’âge du Fer fouillé par Paul Lapp dans les années 1960, la ville d’ar-Ramtha qui le jouxte et garde le nom, et Tell el-Husn près d’Irbid sont les candidats, comme l’explique l’article Ramoth en Galaad. Eusèbe plaçait Ramoth à quinze milles à l’ouest de Philadelphie, c’est-à-dire d’Amman, ce qui ne convient bien à aucun d’eux."
    - "Aujourd’hui, les sites candidats se trouvent à l’extrême nord de la Jordanie, près de la frontière syrienne, autour de Ramtha et d’Irbid, terres cultivées de la plaine du Havran."
