body:
  en:
    - "Ramoth, “heights”, is Ramoth in Gilead, the same city as Ramoth-gilead, whose wars with Damascus have their own article. These four verses are about its other office. When Moses had settled the tribes east of the Jordan he set apart three cities there for the manslayer, “Bezer in the wilderness, in the plain country, of the Reubenites; and Ramoth in Gilead, of the Gadites; and Golan in Bashan, of the Manassites”, and Joshua confirmed them with three more west of the river. A man who killed without intent could flee to such a city and be safe from the avenger of blood until he was tried, and he had to stay there until the high priest died. Ramoth was also one of the four towns Gad gave to the Levites of Merari, “Ramoth in Gilead with her suburbs”, so that the city of refuge was a Levites' town, as the law intended."
    - "The site of Gilead's city of refuge is disputed: Tell er-Rumeith, a small Iron Age fort dug by Paul Lapp in the 1960s, the town of ar-Ramtha beside it, which keeps the name, and Tell el-Husn near Irbid are the candidates, as the Ramoth-gilead article explains. Eusebius placed Ramoth fifteen miles west of Philadelphia, that is Amman, which fits none of them well."
    - "Today the candidate sites lie in the far north of Jordan near the Syrian border, around Ramtha and Irbid, farmland on the Hauran plain."
  ru:
    - "Рамоф, «высоты», — это Рамоф в Галааде, тот же город, что Рамоф Галаадский, о войнах которого с Дамаском есть отдельная статья. Эти четыре стиха о другом его назначении. Устроив колена к востоку от Иордана, Моисей отделил там три города для убийцы: «Бецер в пустыне, на равнине в колене Рувимовом, и Рамоф в Галааде в колене Гадовом, и Голан в Васане в колене Манассиином», а Иисус Навин подтвердил их и прибавил три к западу от реки. Убивший без умысла мог бежать в такой город и быть в безопасности от мстителя за кровь до суда, и должен был оставаться там до смерти первосвященника. Рамоф был и одним из четырёх городов, которые Гад отдал левитам из рода Мерари, «Рамоф в Галааде и предместья его», так что город убежища был левитским, как и предполагал закон."
    - "Место галаадского города убежища спорно: Телль-эр-Румейт, небольшая крепость железного века, раскопанная Полом Лэппом в 1960-х, соседний город Эр-Рамта, сохранивший имя, и Телль-эль-Хусн близ Ирбида — кандидаты, как объясняет статья о Рамофе Галаадском. Евсевий помещал Рамоф в пятнадцати милях к западу от Филадельфии, то есть Аммана, что плохо подходит ко всем троим."
    - "Сегодня места-кандидаты лежат на крайнем севере Иордании у сирийской границы, вокруг Рамты и Ирбида, среди полей Хауранской равнины."
  uk:
    - "Рамот, «висоти», — це Рамот у Гілеаді, те саме місто, що й Рамот Гілеадський, чиї війни з Дамаском мають окрему статтю. Ці чотири вірші — про його іншу службу. Коли Мойсей оселив племена на схід від Йордану, він виділив там три міста для вбивці: «Безер у степу, на поділлї, для Рубенїїв, і Рамот у Гілеадї для Гадїїв, і Голян у Базанї для Манассіїв», а Ісус Навин підтвердив їх трьома іншими на захід від річки. Той, хто вбив ненавмисно, міг утекти до такого міста й бути в безпеці від месника за кров, доки його не судитимуть, і мусив лишатися там, поки не помре первосвященик. Рамот був також одним із чотирьох міст, які Гад віддав левітам Мерарі, «Рамот у Галаадї вкупі з пасовищами його», тож місто-сховище було містом левітів, як і задумував закон."
    - "Розташування гілеадського міста-сховища спірне: Телль-ер-Румейт, невеликий форт залізної доби, розкопаний Полом Лаппом у 1960-х роках, місто ар-Рамта поруч із ним, яке зберігає назву, і Телль-ель-Хусн біля Ірбіда — ось кандидати, як пояснює стаття про Рамот Гілеадський. Євсевій розмістив Рамот за п’ятнадцять миль на захід від Філадельфії, тобто Амману, що не добре збігається з жодним із них."
    - "Сьогодні місця-кандидати лежать на крайній півночі Йорданії поблизу сирійського кордону, довкола Рамти й Ірбіда, — це рілля на рівнині Хавран."
  es:
    - "Ramot, «alturas», es Ramot en Galaad, la misma ciudad que Ramot de Galaad, cuyas guerras con Damasco tienen su propio artículo. Estos cuatro versículos tratan de su otro oficio. Cuando Moisés hubo asentado las tribus al este del Jordán, apartó allí tres ciudades para el homicida, «Beser en el desierto, en tierra de la llanura, de los Rubenitas; y á Ramoth en Galaad, de los Gaditas; y á Golán en Basán, de los de Manasés», y Josué las confirmó con otras tres al oeste del río. Un hombre que mataba sin intención podía huir a una de esas ciudades y estar a salvo del vengador de la sangre hasta ser juzgado, y debía permanecer allí hasta la muerte del sumo sacerdote. Ramot fue también una de las cuatro ciudades que Gad dio a los levitas de Merari, «Ramoth en Galaad con sus ejidos», de modo que la ciudad de refugio era una ciudad de levitas, como la ley pretendía."
    - "El emplazamiento de la ciudad de refugio de Galaad se discute: Tell er-Rumeith, un pequeño fuerte de la Edad del Hierro excavado por Paul Lapp en la década de 1960, la ciudad de ar-Ramtha junto a él, que conserva el nombre, y Tell el-Husn, cerca de Irbid, son los candidatos, como explica el artículo de Ramot de Galaad. Eusebio situó Ramot a quince millas al oeste de Filadelfia, es decir, de Amán, lo que no concuerda bien con ninguno."
    - "Hoy los lugares candidatos se encuentran en el extremo norte de Jordania, cerca de la frontera siria, en torno a Ramtha e Irbid, tierras de labor de la llanura del Haurán."
  pt:
    - "Ramote, “alturas”, é Ramote em Gileade, a mesma cidade que Ramote-Gileade, cujas guerras com Damasco têm artigo próprio. Estes quatro versículos tratam de seu outro ofício. Quando Moisés assentou as tribos a leste do Jordão, separou ali três cidades para o homicida, “Bezer, no deserto, na região do planalto, para os rubenitas; Ramote, em Gileade, para os gaditas; e Golã, em Basã, para os manassitas”, e Josué as confirmou com mais três a oeste do rio. Quem matasse sem intenção podia fugir para uma dessas cidades e ficar a salvo do vingador do sangue até ser julgado, e tinha de ficar ali até a morte do sumo sacerdote. Ramote foi também uma das quatro cidades que Gade deu aos levitas de Merari, “Ramote, em Gileade, com as suas pastagens”, de modo que a cidade de refúgio era uma cidade levítica, como a lei pretendia."
    - "O local da cidade de refúgio de Gileade é disputado: Tell er-Rumeith, pequeno forte da Idade do Ferro escavado por Paul Lapp na década de 1960, a cidade de ar-Ramtha ao lado dele, que guarda o nome, e Tell el-Husn, perto de Irbid, são os candidatos, como explica o artigo Ramote-Gileade. Eusébio situou Ramote a quinze milhas a oeste de Filadélfia, isto é, Amã, o que não combina bem com nenhum deles."
    - "Hoje os locais candidatos ficam no extremo norte da Jordânia, perto da fronteira síria, em torno de Ramtha e Irbid, terras agrícolas da planície do Haurã."
  de:
    - "Ramot, „Höhen“, ist Ramot in Gilead, dieselbe Stadt wie Ramot-Gilead, dessen Kriege mit Damaskus einen eigenen Artikel haben. Diese vier Verse handeln von ihrem anderen Amt. Als Mose die Stämme östlich des Jordan angesiedelt hatte, sonderte er dort drei Städte für den Totschläger aus, „Bezer in der Wüste im ebnen Lande unter den Rubenitern und Ramoth in Gilead unter den Gaditern und Golan in Basan unter den Manassitern“, und Josua bestätigte sie mit drei weiteren westlich des Flusses. Wer ohne Absicht getötet hatte, konnte in eine solche Stadt fliehen und war vor dem Bluträcher sicher, bis er vor Gericht stand, und musste dort bleiben, bis der Hohepriester starb. Ramot war auch eine der vier Städte, die Gad den Leviten aus Merari gab, „Ramoth in Gilead, und seine Vorstädte“, sodass die Freistadt eine Levitenstadt war, wie das Gesetz es wollte."
    - "Die Lage der gileaditischen Freistadt ist umstritten: Tell er-Rumeith, ein kleines eisenzeitliches Kastell, das Paul Lapp in den 1960er Jahren ausgrub, die Stadt ar-Ramtha daneben, die den Namen bewahrt, und Tell el-Husn bei Irbid sind die Kandidaten, wie der Artikel Ramot-Gilead erklärt. Eusebius setzte Ramot fünfzehn Meilen westlich von Philadelphia, also Amman, was zu keinem davon gut passt."
    - "Heute liegen die Kandidatenorte im äußersten Norden Jordaniens nahe der syrischen Grenze, um Ramtha und Irbid, Ackerland auf der Hauran-Ebene."
  fr:
    - "Ramoth, « hauteurs », est la Ramoth de Galaad, la même ville que Ramoth en Galaad, dont les guerres avec Damas ont leur propre article. Ces quatre versets concernent son autre fonction. Quand Moïse eut installé les tribus à l’est du Jourdain, il mit à part trois villes pour le meurtrier, « Betser, dans le désert, dans la plaine, chez les Rubénites ; Ramoth, en Galaad, chez les Gadites, et Golan, en Basan, chez les Manassites », et Josué les confirma avec trois autres à l’ouest du fleuve. Celui qui avait tué sans intention pouvait fuir dans une telle ville et y être à l’abri du vengeur du sang jusqu’à son jugement, et il devait y rester jusqu’à la mort du grand prêtre. Ramoth fut aussi l’une des quatre villes que Gad donna aux Lévites de Merari, « Ramoth en Galaad et sa banlieue », de sorte que la ville de refuge était une ville de Lévites, comme la loi l’avait voulu."
    - "L’emplacement de la ville de refuge de Galaad est disputé : Tell er-Rumeith, petit fort de l’âge du Fer fouillé par Paul Lapp dans les années 1960, la ville d’ar-Ramtha qui le jouxte et garde le nom, et Tell el-Husn près d’Irbid sont les candidats, comme l’explique l’article Ramoth en Galaad. Eusèbe plaçait Ramoth à quinze milles à l’ouest de Philadelphie, c’est-à-dire d’Amman, ce qui ne convient bien à aucun d’eux."
    - "Aujourd’hui, les sites candidats se trouvent à l’extrême nord de la Jordanie, près de la frontière syrienne, autour de Ramtha et d’Irbid, terres cultivées de la plaine du Havran."
  it:
    - "Ramot, «alture», è Ramot in Galaad, le cui guerre con Damasco hanno un articolo a parte. Questi quattro versetti riguardano il suo altro ufficio. Quando Mosè ebbe stabilito le tribù a est del Giordano, vi riservò tre città per l’omicida, «Betser, nel deserto, nella regione piana, per i Rubeniti; Ramoth, in Galaad, per i Gaditi, e Golan, in Basan, per i Manassiti», e Giosuè le confermò con altre tre a ovest del fiume. Chi aveva ucciso senza intenzione poteva fuggire in una di tali città ed essere al sicuro dal vindice del sangue finché non fosse giudicato, e doveva restarvi fino alla morte del sommo sacerdote. Ramot fu anche una delle quattro città che Gad diede ai Leviti di Merari, «Ramoth in Galaad, col suo contado», così che la città di rifugio era una città levitica, come intendeva la legge."
    - "Il sito della città di rifugio di Galaad è controverso: Tell er-Rumeith, un piccolo forte dell’età del Ferro scavato da Paul Lapp negli anni 1960, la città di ar-Ramtha accanto, che ne conserva il nome, e Tell el-Husn presso Irbid sono i candidati, come spiega l’articolo su Ramot di Galaad. Eusebio pose Ramot a quindici miglia a ovest di Filadelfia, cioè Amman, il che non si accorda bene con nessuno di essi."
    - "Oggi i siti candidati si trovano nell’estremo nord della Giordania, presso il confine siriano, attorno a Ramtha e a Irbid, terreno agricolo sulla pianura dell’Auran."
  pl:
    - "Ramot, „wyżyny”, to Ramot w Gileadzie, którego wojny z Damaszkiem mają własny artykuł. Te cztery wersety dotyczą jego innej roli. Gdy Mojżesz osiedlił pokolenia na wschód od Jordanu, wyznaczył tam trzy miasta dla zabójcy: „Beser na puszczy, w równinie w ziemi Rubenitów, i Ramot w Galaad między Gadyty, i Golam w Bazan między Manassytami”, a Jozue potwierdził je trzema dalszymi na zachód od rzeki. Człowiek, który zabił bez zamiaru, mógł uciec do takiego miasta i być bezpieczny przed mścicielem krwi do czasu sądu, i musiał tam pozostać do śmierci najwyższego kapłana. Ramot było też jednym z czterech miast, które Gad oddał lewitom z rodu Merariego, „Ramot w Galaad i przedmieścia jego”, tak że miasto ucieczki było miastem lewitów, jak zamierzało prawo."
    - "Położenie gileadzkiego miasta ucieczki jest sporne: kandydatami są Tell er-Rumajt, niewielki fort z epoki żelaza odkopany przez Paula Lappa w latach sześćdziesiątych, miasto ar-Ramta obok niego, które zachowuje nazwę, i Tell el-Husn koło Irbidu, jak wyjaśnia artykuł o Ramot w Gileadzie. Euzebiusz umieścił Ramot piętnaście mil na zachód od Filadelfii, czyli Ammanu, co do żadnego z nich nie pasuje dobrze."
    - "Dziś miejsca kandydujące leżą na dalekiej północy Jordanii blisko granicy syryjskiej, wokół Ramty i Irbidu, na polach uprawnych równiny Hauran."
  cs:
    - "Rámot, „výšiny“, je Rámot v Gileadu, jehož války s Damaškem mají vlastní článek. Tyto čtyři verše se týkají jeho jiného úřadu. Když Mojžíš usadil pokolení na východ od Jordánu, vyčlenil tam tři města pro vražedníka, „Bozor na poušti, na rovinách v kraji Rubenitských, a Rámot v Galád, v pokolení Gád, a Golan v Bázan, v pokolení Manasse“, a Jozue je potvrdil dalšími třemi na západ od řeky. Člověk, který zabil bez úmyslu, mohl uprchnout do takového města a byl v bezpečí před mstitelem krve, dokud nebyl souzen, a musel tam zůstat do smrti velekněze. Rámot byl také jedním ze čtyř měst, která Gád dal levitům z rodu Merari, „Rámot v Galád a předměstí jeho“, takže útočištné město bylo městem levitů, jak zákon zamýšlel."
    - "Poloha gileadského útočištného města je sporná: kandidáty jsou Tell er-Rumajt, malá pevnost z doby železné vykopaná Paulem Lappem v 60. letech, město ar-Ramta vedle ní, které jméno zachovává, a Tell el-Husn u Irbidu, jak vysvětluje článek o Rámotu v Gileadu. Eusebius umístil Rámot patnáct mil západně od Filadelfie, tedy Ammánu, což žádnému z nich dobře nevyhovuje."
    - "Dnes leží kandidátská místa na dalekém severu Jordánska u syrské hranice, kolem Ramty a Irbidu, na polích havranské roviny."
  nl:
    - "Ramot, “hoogten”, is Ramot in Gilead, wier oorlogen met Damascus een eigen artikel hebben. Deze vier verzen gaan over haar andere ambt. Toen Mozes de stammen ten oosten van de Jordaan had gevestigd, wees hij daar drie steden aan voor de doodslager, “Bezer in de woestijn, in het effen land, voor de Rubenieten; en Ramoth in Gilead, voor de Gadieten; en Golan in Bazan, voor de Manassieten”, en Jozua bevestigde ze met nog drie ten westen van de rivier. Wie zonder opzet doodde, kon naar zo’n stad vluchten en was veilig voor de bloedwreker tot hij berecht was, en hij moest er blijven tot de hogepriester stierf. Ramot was ook een van de vier steden die Gad aan de Levieten van Merari gaf, “Ramoth in Gilead, en haar voorsteden”, zodat de vrijstad een stad van de Levieten was, zoals de wet bedoelde."
    - "De ligging van Gileads vrijstad is omstreden: Tell er-Rumeith, een klein fort uit de ijzertijd dat Paul Lapp in de jaren 1960 opgroef, de stad ar-Ramtha ernaast, die de naam bewaart, en Tell el-Husn bij Irbid zijn de kandidaten, zoals het artikel Ramot in Gilead uitlegt. Eusebius plaatste Ramot vijftien mijl ten westen van Filadelfia, dat is Amman, wat bij geen ervan goed past."
    - "Tegenwoordig liggen de kandidaatplaatsen in het uiterste noorden van Jordanië bij de Syrische grens, rond Ramtha en Irbid, landbouwgrond op de Hauranvlakte."
  sv:
    - "Ramot, ”höjder”, är Ramot i Gilead, samma stad som Ramot-Gilead, vars krig med Damaskus har en egen artikel. Dessa fyra verser handlar om dess andra uppgift. När Mose hade bosatt stammarna öster om Jordan avskilde han tre städer där för dråparen, ”Beser i öknen på slättlandet för Rubens stam, Ramot i Gilead för Gads stam och Golan i Basan för Manasse stam”, och Josua bekräftade dem med tre till väster om floden. En man som dödat utan uppsåt kunde fly till en sådan stad och vara säker från blodshämnaren tills han hade ställts inför rätta, och han måste stanna där tills översteprästen dog. Ramot var också en av de fyra städer som Gad gav åt Meraris leviter, ”Ramot i Gilead med dess utmarker”, så att fristaden var en levitstad, såsom lagen avsåg."
    - "Platsen för Gileads fristad är omstridd: Tell er-Rumeith, ett litet järnåldersfort som grävdes ut av Paul Lapp på 1960-talet, staden ar-Ramtha bredvid det, som behåller namnet, och Tell el-Husn nära Irbid är kandidaterna, såsom artikeln om Ramot-Gilead förklarar. Eusebios placerade Ramot femton romerska mil väster om Filadelfia, det vill säga Amman, vilket inte passar någon av dem väl."
    - "I dag ligger kandidatplatserna längst i norr i Jordanien nära den syriska gränsen, kring Ramtha och Irbid, jordbruksmark på Hauranslätten."
  nb:
    - "Ramot, «høyder», er Ramot i Gilead, den samme byen som Ramot-Gilead, hvis kriger med Damaskus har sin egen artikkel. Disse fire versene handler om byens andre oppgave. Da Moses hadde bosatt stammene øst for Jordan, skilte han ut tre byer der for manndraperen, «Beser i ørkenen på sletten for rubenittene, og Ramot i Gilead for gadittene, og Golan i Basan for manassittene», og Josva stadfestet dem med tre til vest for elven. En mann som drepte uten forsett kunne flykte til en slik by og være trygg for blodhevneren til han var stilt for retten, og han måtte bli der til yppersteprestens død. Ramot var også en av de fire byene Gad ga til Meraris levitter, «Ramot i Gilead, som var tilfluktsstad for manndrapere, med tilhørende jorder», slik at tilfluktsbyen var en levittby, som loven ville ha det."
    - "Hvor Gileads tilfluktsby lå, er omstridt: Tell er-Rumeith, et lite jernalderfort gravd ut av Paul Lapp på 1960-tallet, byen ar-Ramtha ved siden av, som beholder navnet, og Tell el-Husn nær Irbid er kandidatene, slik artikkelen om Ramot-Gilead forklarer. Eusebius plasserte Ramot femten romerske mil vest for Filadelfia, det vil si Amman, noe som ikke passer godt med noen av dem."
    - "I dag ligger kandidatstedene helt nord i Jordan nær den syriske grensen, rundt Ramtha og Irbid, jordbruksland på Havran-sletten."
  tl:
    - "Ang Ramoth, “mga kaitaasan”, ay ang Ramoth sa Gilead, ang Ramoth-galaad na ang mga digmaan sa Damasco ay may sariling artikulo. Tungkol sa ibang tungkulin nito ang apat na talatang ito. Pagkatatag ni Moises sa mga lipi sa silangan ng Jordan, nagtakda siya roon ng tatlong lungsod para sa nakamatay, “sa Beser, sa ilang, sa kapatagang lupa, na ukol sa mga Rubenita; at sa Ramoth sa Galaad, na ukol sa mga Gadita; at sa Golan sa Basan, na ukol sa mga Manasita”, at dinagdagan ni Josue ng tatlo sa kanluran ng ilog. Ang pumatay nang walang balak ay makatatakas sa gayong lungsod, ligtas sa tagapaghiganti ng dugo hanggang litisin, at nananatili roon hanggang mamatay ang pinakapunong saserdote. Isa rin ang Ramoth sa apat na bayang ibinigay ni Gad sa mga Levita ng Merari, “ang Ramoth sa Galaad pati ng mga nayon niyaon”, kaya bayan ng Levita ang bayang ampunan, gaya ng layon ng kautusan."
    - "Pinagtatalunan ang lugar ng bayang ampunan ng Gilead: ang Tell er-Rumeith, isang maliit na kuta ng Panahong Bakal na hinukay ni Paul Lapp noong dekada 1960, ang bayan ng ar-Ramtha sa tabi nito na nagpapanatili ng pangalan, at ang Tell el-Husn malapit sa Irbid ang mga kandidato, gaya ng ipinaliliwanag ng artikulo ng Ramoth-galaad. Inilagay ni Eusebio ang Ramoth nang labinlimang milya sa kanluran ng Filadelfia, ibig sabihin ay Amman, na hindi gaanong akma sa alinman sa kanila."
    - "Ngayon, ang mga lugar na kandidato ay nasa dulong hilaga ng Jordan malapit sa hangganan ng Siria, sa palibot ng Ramtha at Irbid, mga bukid sa kapatagan ng Hauran."
  da:
    - "Ramot, »højder«, er Ramot i Gilead, hvis krige med Damaskus har deres egen artikel. Disse fire vers handler om dens andet hverv. Da Moses havde bosat stammerne øst for Jordan, udskilte han dér tre byer til manddrabere, »Bezer i Ørken, paa det jævne Land, hos Rubeniterne og Ramoth i Gilead hos Gaditerne og Golan i Basan hos Manassiterne«, og Josva stadfæstede dem med tre til vest for floden. En mand, der havde dræbt uden forsæt, kunne flygte til sådan en by og være sikker for blodhævneren, til han var dømt, og han måtte blive der, til ypperstepræsten døde. Ramot var også en af de fire byer, Gad gav til Merari-leviterne, »Ramoth i Gilead og dens Marker«, så tilflugtsbyen var en leviterby, som loven ville."
    - "Gileads tilflugtsbys sted er omstridt: Tell er-Rumeith, et lille jernalderfort udgravet af Paul Lapp i 1960'erne, byen ar-Ramtha ved siden af, som bevarer navnet, og Tell el-Husn nær Irbid er kandidaterne, som artiklen om Ramot i Gilead forklarer. Eusebios placerede Ramot femten romerske mil vest for Filadelfia, det vil sige Amman, hvilket ikke passer godt med nogen af dem."
    - "I dag ligger kandidatstederne i det yderste nordlige Jordan nær den syriske grænse, omkring Ramtha og Irbid, landbrugsland på Hauran-sletten."
  sr:
    - "Рамот, „висине“, јесте Рамот у Галаду, исти град као Рамот Галадски, чији ратови с Дамаском имају свој чланак. Ова четири стиха говоре о његовој другој служби. Кад је Мојсије населио племена источно од Јордана, одвојио је ту три града за крвника: „Восор у пустињи, на равници у земљи племена Рувимовог, и Рамот у Галаду у племену Гадовом, Голан у васанској у племену Манасијином“, а Исус их је потврдио са још три западно од реке. Човек који је убио ненамерно могао је побећи у такав град и бити сигуран од осветника крви док му се не суди, а ту је морао остати до смрти првосвештеника. Рамот је био и један од четири града које је Гад дао левитима Мераријевим, „Рамот у Галаду с подграђем“, тако да је град уточишта био левитски град, како је закон намеравао."
    - "Место галадског града уточишта је спорно: Тел ер-Румејт, мала тврђава гвозденог доба коју је Пол Лап ископавао 1960-их, град ер-Рамта поред њега, који чува име, и Тел ел-Хусн близу Ирбида су кандидати, како објашњава чланак о Рамоту Галадском. Јевсевије је Рамот сместио петнаест миља западно од Филаделфије, то јест Амана, што не одговара добро ниједном."
    - "Данас кандидатска места леже на крајњем северу Јордана близу сиријске границе, око Рамте и Ирбида, обрадива земља на равници Авран."
  hu:
    - "Rámót, „magaslatok”, a gileádi Rámót, ugyanaz a város, mint Rámót-Gileád, amelynek Damaszkusszal vívott háborúiról külön cikk szól. E négy vers a város másik szolgálatáról szól. Amikor Mózes letelepítette a törzseket a Jordánon túl, három várost különített el ott a gyilkos számára: „Beczert a pusztában, a sík földön a Ruben fiainak, Rámótot Gileádban a Gád fiainak, és Gólánt Básánban a Manassé fiainak”, és Józsué megerősítette őket három másikkal a folyótól nyugatra. Aki szándék nélkül ölt, ilyen városba menekülhetett, és biztonságban volt a vér bosszúállójától, amíg meg nem ítélték, és ott kellett maradnia a főpap haláláig. Rámót egyike volt azon négy városnak is, amelyet Gád Merári levitáinak adott: „Rámótot Gileádban és annak legelőit”, így a menedékváros levitaváros volt, ahogyan a törvény szánta."
    - "A gileádi menedékváros helye vitatott: a Tell er-Rumeith, egy kis vaskori erőd, amelyet Paul Lapp ásatott az 1960-as években, a mellette fekvő ar-Ramtha, amely megőrizte a nevet, és az Irbid melletti Tell el-Husn a jelöltek, ahogyan a Rámót-Gileád cikk magyarázza. Euszebiosz Rámótot Filadelfiától, azaz Ammántól tizenöt mérföldre nyugatra helyezte, ami egyikhez sem illik jól."
    - "Ma a jelölt helyek Jordánia északi csücskében, a szíriai határ közelében fekszenek, Ramtha és Irbid körül, a Hauran-síkság termőföldjei között."
  fi:
    - "Ramot, ”korkeudet”, on Gileadin Ramot, sama kaupunki kuin Ramot-Gilead, jonka Damaskoksen-sodilla on oma artikkelinsa. Nämä neljä jaetta koskevat sen toista tehtävää. Kun Mooses oli asettanut heimot Jordanin itäpuolelle, hän erotti sieltä kolme kaupunkia tappajalle: ”ruubenilaisille Beser erämaassa, ylätasangolla; gaadilaisille Raamot Gileadissa ja manasselaisille Goolan Baasanissa”, ja Joosua vahvisti ne kolmella lisäkaupungilla joen länsipuolella. Mies, joka oli tappanut tahtomattaan, saattoi paeta sellaiseen kaupunkiin ja olla turvassa verenkostajalta, kunnes hänet oli tuomittu, ja hänen täytyi pysyä siellä ylimmäisen papin kuolemaan asti. Ramot oli myös yksi niistä neljästä kaupungista, jotka Gad antoi Merarin leeviläisille, ”Raamotin laidunmaineen Gileadista”, joten turvakaupunki oli leeviläisten kaupunki, kuten laki tarkoitti."
    - "Gileadin turvakaupungin sijainnista kiistellään: Tell er-Rumeith, Paul Lappin 1960-luvulla kaivama pieni rautakautinen linnake, sen vieressä oleva ar-Ramthan kaupunki, joka säilyttää nimen, ja Irbidin lähellä oleva Tell el-Husn ovat ehdokkaita, kuten Ramot-Gilead-artikkeli selittää. Eusebios sijoitti Ramotin viidentoista mailin päähän Filadelfiasta länteen, eli Ammanista, mikä ei sovi hyvin mihinkään niistä."
    - "Nykyään ehdokaspaikat sijaitsevat Jordanian kaukaisessa pohjoisosassa Syyrian rajan lähellä, Ramthan ja Irbidin ympärillä, Hauranin tasangon viljelysmaata."
  vi:
    - "Ra-mốt, “các nơi cao”, là Ra-mốt ở Ga-la-át, cùng thành với Ra-mốt Ga-la-át, mà các cuộc chiến với Đa-mách có bài riêng. Bốn câu này nói về chức năng khác của nó. Khi Môi-se đã định cư các chi phái phía đông Giô-đanh, ông biệt riêng ba thành ở đó cho kẻ sát nhân, “Bết-se nơi rừng vắng, trong xứ đồng bằng, để cho người Ru-bên; Ra-mốt nơi Ga-la-át, để cho người Gát, và Gô-lan nơi Ba-san, để cho người Ma-na-se”, và Giô-suê xác nhận chúng cùng ba thành nữa phía tây sông. Người giết người vô ý có thể chạy đến một thành như vậy và được an toàn trước kẻ báo thù huyết cho đến khi được xét xử, và phải ở đó cho đến khi thầy tế lễ thượng phẩm qua đời. Ra-mốt cũng là một trong bốn thành Gát nhường cho người Lê-vi thuộc dòng Mê-ra-ri, “Ra-mốt ở đất Ga-la-át, với địa hạt nó”, nên thành ẩn náu là thành của người Lê-vi, như luật định."
    - "Vị trí của thành ẩn náu ở Ga-la-át còn tranh luận: Tell er-Rumeith, một pháo đài nhỏ Thời đại Đồ Sắt do Paul Lapp khai quật vào thập niên 1960, thị trấn ar-Ramtha bên cạnh nó còn giữ tên, và Tell el-Husn gần Irbid là các ứng viên, như bài Ra-mốt Ga-la-át giải thích. Eusebius đặt Ra-mốt cách Phi-la-đen-phi, tức Amman, mười lăm dặm về phía tây, điều không khớp tốt với địa điểm nào."
    - "Ngày nay các địa điểm ứng viên nằm ở cực bắc Jordan gần biên giới Sy-ri, quanh Ramtha và Irbid, đất canh tác trên đồng bằng Ha-vơ-ran."
  ro:
    - "Ramot, „înălțimi”, este Ramotul din Galaad, aceeași cetate ale cărei războaie cu Damascul sunt tratate în articolul „Ramot din Galaad”. Aceste patru versete privesc cealaltă ei însărcinare. Când Moise a așezat triburile la est de Iordan, a rânduit acolo trei cetăți pentru ucigaș: „Vosorul la pustie în pământiul cel șes al lui Ruvim, și Ramotul în Galaad al lui Gad, și Golanul în Vasan al lui Manasì”, iar Iosua le-a întărit cu alte trei la vest de râu. Un om care ucisese fără intenție putea fugi într-o astfel de cetate și era ferit de răzbunătorul sângelui până la judecată, și trebuia să rămână acolo până la moartea marelui preot. Ramot a fost și una dintre cele patru cetăți date de Gad leviților din Merari, „Ramot în Galaad cu împrejurimile lui”, astfel încât cetatea de scăpare era o cetate a leviților, cum voia Legea."
    - "Locul cetății de scăpare a Galaadului este disputat: Tell er-Rumeith, un mic fort din Epoca fierului săpat de Paul Lapp în anii 1960, orașul ar-Ramtha de lângă el, care păstrează numele, și Tell el-Husn, lângă Irbid, sunt candidații, după cum explică articolul despre Ramot din Galaad. Eusebiu a așezat Ramotul la cincisprezece mile vest de Filadelfia, adică Amman, ceea ce nu se potrivește bine cu niciunul dintre ei."
    - "Astăzi locurile candidate se află în extremitatea nordică a Iordaniei, lângă granița siriană, în jurul Ramthei și Irbidului, ținut agricol pe câmpia Hauran."
  bg:
    - "Рамот, „височини“, е Рамот в Галаад, същият град като Рамот Галаадски, чиито войни с Дамаск имат собствена статия. Тези четири стиха се отнасят до другото му предназначение. Когато Мойсей настанил племената на изток от Йордан, той отделил там три града за убиеца — „Восор в пустинята, в полянската земя на Рувимовците, и Рамот в Галаад на Гадовците, и Голан у Васан на Манасиевците“, а Иисус Навин ги потвърдил с още три на запад от реката. Човек, убил без умисъл, можел да избяга в такъв град и да бъде в безопасност от кръвния отмъстител до съда, като трябвало да остане там до смъртта на първосвещеника. Рамот бил и един от четирите града, които Гад дал на левитите от рода на Мерари — „Рамот в Галаад и предградията му“, така че градът-убежище бил левитски град, както повелявал законът."
    - "Мястото на галаадския град-убежище е спорно: кандидати са Тел ер-Румейт, малка крепост от желязната епоха, разкопана от Пол Лап през 1960-те години, съседният град ар-Рамта, който пази името, и Тел ел-Хусн близо до Ирбид, както обяснява статията за Рамот Галаадски. Евсевий поставя Рамот на петнадесет мили западно от Филаделфия, тоест Аман, което не отговаря добре на нито едно от тях."
    - "Днес кандидатстващите места се намират в най-северната част на Йордания близо до сирийската граница, около Рамта и Ирбид — обработваема земя в равнината Хауран."
