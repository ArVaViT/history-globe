body:
  en:
    - "The Tigris is the eastern of the two great rivers of Mesopotamia. It rises in the mountains of south-eastern Turkey near Lake Hazar, flows some 1,850 km south-east past Diyarbakır, Mosul and Baghdad, and joins the Euphrates in southern Iraq to form the Shatt al-Arab, which runs to the Persian Gulf. Faster and more prone to flood than the Euphrates, it carried the heartland of Assyria: Assur, Kalhu (Nimrud) and Nineveh stood on or near its banks, and later Seleucia and Ctesiphon, and Baghdad. Its Hebrew name, Hiddekel, comes from Akkadian Idiqlat; Tigris is the Greek form of its Persian name."
    - "The Hebrew Bible names it only twice. In Genesis it is one of the four rivers into which the river from Eden divides: “the name of the third river is Hiddekel: that is it which goeth toward the east of Assyria. And the fourth river is Euphrates.” With the Euphrates it ties the garden to the known world, while the other two rivers, Pishon and Gihon, have never been identified with certainty. In Daniel the river is the setting of the last great vision, in the third year of Cyrus: “in the four and twentieth day of the first month, as I was by the side of the great river, which is Hiddekel”, Daniel saw a man clothed in linen."
    - "Today the Tigris flows through Turkey, along the Syrian border and through Iraq; dams in Turkey and Iraq have greatly reduced its flow and with it the southern marshes, and the ruins of Nineveh and Assur stand on its banks at Mosul and Qal'at Sherqat."
  ru:
    - "Тигр — восточная из двух великих рек Месопотамии. Он берёт начало в горах юго-восточной Турции близ озера Хазар, течёт около 1850 км на юго-восток мимо Диярбакыра, Мосула и Багдада и на юге Ирака сливается с Евфратом в Шатт-эль-Араб, который впадает в Персидский залив. Более быстрый и бурный в половодье, чем Евфрат, он нёс на себе сердце Ассирии: на его берегах или близ них стояли Ашшур, Кальху (Нимруд) и Ниневия, позже Селевкия и Ктесифон, а затем Багдад. Его еврейское имя, Хиддекель, восходит к аккадскому Идиклат; Тигр — греческая форма его персидского имени."
    - "Еврейская Библия называет его лишь дважды. В книге Бытия это одна из четырёх рек, на которые разделяется река из Едема: «Имя третьей реки Хиддекель (Тигр): она протекает пред Ассириею. Четвертая река Евфрат». Вместе с Евфратом он связывает сад с известным миром, тогда как две другие реки, Фисон и Гихон, так и не отождествлены с уверенностью. У Даниила река — место последнего великого видения в третий год Кира: «А в двадцать четвертый день первого месяца был я на берегу большой реки Тигра», — и Даниил увидел мужа, облечённого в льняную одежду."
    - "Сегодня Тигр течёт по Турции, вдоль сирийской границы и через Ирак; плотины в Турции и Ираке сильно уменьшили его сток, а с ним и южные болота, а развалины Ниневии и Ашшура стоят на его берегах у Мосула и Калъат-Шерката."
  uk:
    - "Тигр — східна з двох великих рік Месопотамії. Він бере початок у горах південного сходу Туреччини біля озера Хазар, тече приблизно 1850 км на південний схід повз Діярбакир, Мосул і Багдад і зливається з Євфратом на півдні Іраку, утворюючи Шатт-ель-Араб, що тече до Перської затоки. Швидший і схильніший до розливів, ніж Євфрат, він ніс серцевину Ассирії: Ашшур, Калху (Німруд) і Ніневія стояли на його берегах або поблизу них, а пізніше Селевкія, Ктесифон і Багдад. Його староєврейська назва, Хіддекель, походить від аккадського Ідіґлат; Тигр — грецька форма його перської назви."
    - "Єврейська Біблія називає його лише двічі. У Книзі Буття це одна з чотирьох рік, на які розділяється ріка з Едему: «А трейтя зветься Гиддекель; се та річка, що йде на схід соньця від Ассура. А четверта річка, се Евфрат». Разом з Євфратом він пов’язує сад із відомим світом, тоді як дві інші ріки, Фісон і Гіхон, ніколи не були ототожнені з певністю. У Даниїла ріка є місцем останнього великого видіння, на третьому році Кіра: «А двайцять четвертого дня першого місяця був я на березї великої ріки Тигра», Даниїл побачив мужа, одягненого в льняну одіж."
    - "Нині Тигр тече через Туреччину, вздовж сирійського кордону та через Ірак; греблі в Туреччині та Іраку значно зменшили його стік, а з ним і південні болота, а руїни Ніневії та Ашшура стоять на його берегах біля Мосула й Калат-Шерхата."
  es:
    - "El Tigris es el más oriental de los dos grandes ríos de Mesopotamia. Nace en las montañas del sureste de Turquía, cerca del lago Hazar, fluye unos 1850 km hacia el sureste pasando por Diyarbakır, Mosul y Bagdad, y se une al Éufrates en el sur de Irak para formar el Shatt al-Arab, que corre hasta el golfo Pérsico. Más rápido y más propenso a las crecidas que el Éufrates, sostuvo el corazón de Asiria: Assur, Kalhu (Nimrud) y Nínive se alzaban en sus orillas o cerca de ellas, y más tarde Seleucia, Ctesifonte y Bagdad. Su nombre hebreo, Hiddekel, procede del acadio Idiqlat; Tigris es la forma griega de su nombre persa."
    - "La Biblia hebrea lo nombra solo dos veces. En el Génesis es uno de los cuatro ríos en que se divide el río que salía de Edén: «Y el nombre del tercer río es Hiddekel: éste es el que va delante de Asiria. Y el cuarto río es el Eufrates». Con el Éufrates une el huerto al mundo conocido, mientras que los otros dos ríos, Pisón y Gihón, nunca se han identificado con certeza. En Daniel, el río es el escenario de la última gran visión, en el tercer año de Ciro: «á los veinte y cuatro días del mes primero estaba yo á la orilla del gran río Hiddekel», Daniel vio a un varón vestido de lienzos."
    - "Hoy el Tigris fluye por Turquía, a lo largo de la frontera siria y por Irak; las presas de Turquía y de Irak han reducido mucho su caudal y con él las marismas del sur, y las ruinas de Nínive y de Assur se alzan en sus orillas en Mosul y en Qal'at Sherqat."
  pt:
    - "O Tigre é o mais oriental dos dois grandes rios da Mesopotâmia. Nasce nas montanhas do sudeste da Turquia, perto do lago Hazar, corre cerca de 1.850 km para sudeste, passando por Diyarbakır, Mossul e Bagdá, e une-se ao Eufrates no sul do Iraque para formar o Shatt al-Arab, que corre até o golfo Pérsico. Mais rápido e mais sujeito a cheias que o Eufrates, banhava o coração da Assíria: Assur, Kalhu (Nimrud) e Nínive ficavam em suas margens ou perto delas, e mais tarde Selêucia e Ctesifonte, e Bagdá. Seu nome hebraico, Hídequel, vem do acádio Idiqlat; Tigre é a forma grega de seu nome persa."
    - "A Bíblia hebraica o nomeia apenas duas vezes. Em Gênesis, é um dos quatro rios em que se divide o rio que sai do Éden: “O nome do terceiro rio é Hídequel. Este é o que flui em frente à Assíria. O quarto rio é o Eufrates.” Com o Eufrates, liga o jardim ao mundo conhecido, enquanto os outros dois rios, Pisom e Giom, nunca foram identificados com certeza. Em Daniel, o rio é o cenário da última grande visão, no terceiro ano de Ciro: “No vigésimo quarto dia do primeiro mês, enquanto eu estava na margem do grande rio, que é o Hidequel”, Daniel viu um homem vestido de linho."
    - "Hoje o Tigre corre pela Turquia, ao longo da fronteira síria e pelo Iraque; represas na Turquia e no Iraque reduziram muito sua vazão e, com ela, os pântanos do sul, e as ruínas de Nínive e Assur ficam em suas margens, em Mossul e Qal'at Sherqat."
  de:
    - "Der Tigris ist der östliche der beiden großen Ströme Mesopotamiens. Er entspringt in den Bergen der südöstlichen Türkei nahe dem Hazar-See, fließt rund 1850 km nach Südosten an Diyarbakır, Mossul und Bagdad vorbei und vereinigt sich im südlichen Irak mit dem Euphrat zum Schatt al-Arab, der in den Persischen Golf mündet. Schneller und hochwasserträchtiger als der Euphrat trug er das Kernland Assyriens: Assur, Kalchu (Nimrud) und Ninive lagen an oder nahe seinen Ufern, später Seleukia und Ktesiphon sowie Bagdad. Sein hebräischer Name Hiddekel kommt vom akkadischen Idiqlat; Tigris ist die griechische Form seines persischen Namens."
    - "Die hebräische Bibel nennt ihn nur zweimal. In der Genesis ist er einer der vier Ströme, in die sich der Strom aus Eden teilt: „Das dritte Wasser heißt Hiddekel, das fließt vor Assyrien. Das vierte Wasser ist der Euphrat.“ Mit dem Euphrat verbindet er den Garten mit der bekannten Welt, während die beiden anderen Ströme, Pischon und Gihon, nie sicher identifiziert wurden. Bei Daniel ist der Strom Schauplatz der letzten großen Vision im dritten Jahr des Kyrus: „Und am vierundzwanzigsten Tage des Monats war ich bei dem großen Wasser Hiddekkel“, und er sah einen Mann in Leinwand."
    - "Heute durchfließt der Tigris die Türkei, folgt der syrischen Grenze und durchquert den Irak; Staudämme in der Türkei und im Irak haben seinen Abfluss und damit die südlichen Marschen stark verringert, und die Ruinen von Ninive und Assur stehen an seinen Ufern bei Mossul und Qal'at Sherqat."
  fr:
    - "Le Tigre est le plus oriental des deux grands fleuves de Mésopotamie. Il naît dans les montagnes du sud-est de la Turquie près du lac Hazar, coule sur quelque 1 850 km vers le sud-est devant Diyarbakır, Mossoul et Bagdad, et rejoint l’Euphrate dans le sud de l’Irak pour former le Chatt al-Arab, qui court jusqu’au golfe Persique. Plus rapide et plus sujet aux crues que l’Euphrate, il portait le cœur de l’Assyrie : Assour, Kalhu (Nimroud) et Ninive s’élevaient sur ses rives ou près d’elles, puis Séleucie, Ctésiphon et Bagdad. Son nom hébreu, Hiddékel, vient de l’akkadien Idiqlat ; Tigre est la forme grecque de son nom perse."
    - "La Bible hébraïque ne le nomme que deux fois. Dans la Genèse, il est l’un des quatre bras dans lesquels se divise le fleuve sorti d’Éden : « Le nom du troisième est Hiddékel ; c’est celui qui coule à l’orient de l’Assyrie. Le quatrième fleuve, c’est l’Euphrate. » Avec l’Euphrate, il relie le jardin au monde connu, alors que les deux autres fleuves, Pischon et Guihon, n’ont jamais été identifiés avec certitude. Chez Daniel, le fleuve est le cadre de la dernière grande vision, la troisième année de Cyrus : « Le vingt-quatrième jour du premier mois, j’étais au bord du grand fleuve qui est Hiddékel », Daniel vit un homme vêtu de lin."
    - "Aujourd’hui, le Tigre traverse la Turquie, longe la frontière syrienne et traverse l’Irak ; les barrages de Turquie et d’Irak ont fortement réduit son débit, et avec lui les marais du sud, et les ruines de Ninive et d’Assour se dressent sur ses rives à Mossoul et à Qal’at Sherqat."
  pl:
    - "Tygrys to wschodnia z dwóch wielkich rzek Mezopotamii. Wypływa z gór południowo-wschodniej Turcji koło jeziora Hazar, płynie około 1850 km na południowy wschód obok Diyarbakır, Mosulu i Bagdadu i łączy się z Eufratem w południowym Iraku, tworząc Szatt al-Arab, który płynie do Zatoki Perskiej. Szybszy i bardziej skłonny do wylewów niż Eufrat, płynął przez serce Asyrii: Aszur, Kalchu (Nimrud) i Niniwa stały na jego brzegach lub w pobliżu, a później Seleucja, Ktezyfont i Bagdad. Jego hebrajska nazwa, Chiddekel, pochodzi od akadyjskiego Idiqlat; Tygrys to grecka forma jego nazwy perskiej."
    - "Biblia hebrajska wymienia go tylko dwa razy. W Księdze Rodzaju jest jedną z czterech rzek, na które dzieli się rzeka wypływająca z Edenu: „Imię zaś rzeki trzeciej Chydekel, ta płynie na wschód słońca ku Asyryi. A rzeka czwarta jest Eufrates.” Wraz z Eufratem wiąże ogród ze znanym światem, podczas gdy dwie pozostałe rzeki, Pischon i Gichon, nigdy nie zostały utożsamione z pewnością. U Daniela rzeka jest miejscem ostatniego wielkiego widzenia, w trzecim roku Cyrusa: „A dnia dwudziestego i czwartego miesiąca pierwszego byłem nad brzegiem rzeki wielkiej, to jest Chydekel”, Daniel zobaczył męża odzianego w len."
    - "Dziś Tygrys płynie przez Turcję, wzdłuż granicy syryjskiej i przez Irak; tamy w Turcji i Iraku znacznie zmniejszyły jego przepływ, a z nim południowe mokradła, a ruiny Niniwy i Aszuru stoją nad jego brzegami w Mosulu i Kal'at Szerkat."
  it:
    - "Il Tigri è il più orientale dei due grandi fiumi della Mesopotamia. Nasce sui monti della Turchia sud-orientale presso il lago Hazar, scorre per circa 1.850 km verso sud-est passando per Diyarbakır, Mosul e Baghdad, e si unisce all’Eufrate nell’Iraq meridionale formando lo Shatt al-Arab, che sfocia nel Golfo Persico. Più rapido e più incline alle piene dell’Eufrate, attraversava il cuore dell’Assiria: Assur, Kalhu (Nimrud) e Ninive sorgevano sulle sue rive o nei pressi, e poi Seleucia, Ctesifonte e Baghdad. Il suo nome ebraico, Hiddekel, deriva dall’accadico Idiqlat; Tigri è la forma greca del suo nome persiano."
    - "La Bibbia ebraica lo nomina solo due volte. Nella Genesi è uno dei quattro fiumi in cui si divide il fiume uscito dall’Eden: «Il nome del terzo fiume è Hiddekel, ed è quello che scorre a oriente dell’Assiria. E il quarto fiume è l’Eufrate». Con l’Eufrate lega il giardino al mondo conosciuto, mentre gli altri due fiumi, Pison e Ghicon, non sono mai stati identificati con certezza. In Daniele il fiume è lo sfondo dell’ultima grande visione, nel terzo anno di Ciro: «il ventiquattresimo giorno del primo mese, come io mi trovavo in riva al gran fiume, che è lo Hiddekel», Daniele vide un uomo vestito di lino."
    - "Oggi il Tigri scorre attraverso la Turchia, lungo il confine siriano e attraverso l’Iraq; le dighe in Turchia e in Iraq ne hanno ridotto molto la portata e con essa le paludi meridionali, e le rovine di Ninive e di Assur si ergono sulle sue rive a Mosul e a Qal’at Sherqat."
  nl:
    - "De Tigris is de oostelijke van de twee grote rivieren van Mesopotamië. Hij ontspringt in de bergen van het zuidoosten van Turkije bij het Hazarmeer, stroomt zo’n 1850 km naar het zuidoosten langs Diyarbakır, Mosoel en Bagdad, en voegt zich in het zuiden van Irak bij de Eufraat tot de Sjatt al-Arab, die naar de Perzische Golf loopt. Sneller en meer geneigd tot overstromen dan de Eufraat droeg hij het kerngebied van Assyrië: Assur, Kalhu (Nimrud) en Nineve lagen aan of bij zijn oevers, en later Seleucië en Ctesifon, en Bagdad. Zijn Hebreeuwse naam, Hiddekel, komt van het Akkadische Idiqlat; Tigris is de Griekse vorm van zijn Perzische naam."
    - "De Hebreeuwse Bijbel noemt hem slechts tweemaal. In Genesis is hij een van de vier rivieren waarin de rivier uit Eden zich verdeelt: “De naam der derde rivier is Hiddekel; deze is gaande naar het oosten van Assur. En de vierde rivier is Frath.” Met de Eufraat verbindt hij de hof met de bekende wereld, terwijl de andere twee rivieren, Pison en Gihon, nooit met zekerheid zijn vereenzelvigd. In Daniël is de rivier het toneel van het laatste grote visioen, in het derde jaar van Cyrus: “op den vier en twintigsten dag der eerste maand, zo was ik aan den oever der grote rivier, welke is Hiddekel”, zag Daniël een man met linnen bekleed."
    - "Tegenwoordig stroomt de Tigris door Turkije, langs de Syrische grens en door Irak; dammen in Turkije en Irak hebben zijn debiet sterk verminderd en daarmee de zuidelijke moerassen, en de ruïnes van Nineve en Assur staan aan zijn oevers bij Mosoel en Qal’at Sherqat."
  cs:
    - "Tigris je východní ze dvou velkých řek Mezopotámie. Pramení v horách jihovýchodního Turecka poblíž jezera Hazar, teče asi 1850 km k jihovýchodu kolem Diyarbakıru, Mosulu a Bagdádu a v jižním Iráku se spojuje s Eufratem v Šatt al-Arab, který se vlévá do Perského zálivu. Je rychlejší a náchylnější k záplavám než Eufrat a nesl srdce Asýrie: na jeho březích nebo poblíž nich stály Aššur, Kalchu (Nimrúd) a Ninive a později Seleukeia, Ktésifón a Bagdád. Jeho hebrejské jméno, Chidekel, pochází z akkadského Idiqlat; Tigris je řecká podoba jeho perského jména."
    - "Hebrejská bible ji jmenuje jen dvakrát. V Genesis je jednou ze čtyř řek, na které se dělí řeka z Edenu: „A jméno řeky třetí Hiddekel, kteráž teče k východní straně Assyrské země. A řeka čtvrtá jest Eufrates“. S Eufratem spojuje zahradu se známým světem, zatímco další dvě řeky, Píšon a Gichón, nebyly nikdy s jistotou určeny. V Danielovi je řeka dějištěm poslední velké vize, ve třetím roce Kýrově: „Dne pak dvadcátého čtvrtého měsíce prvního, když jsem byl na břehu řeky veliké, to jest Hiddekel“, spatřil Daniel muže oděného v len."
    - "Tigris dnes teče Tureckem, podél syrské hranice a Irákem; přehrady v Turecku a Iráku výrazně snížily jeho průtok a s ním i jižní mokřady, a zříceniny Ninive a Aššuru stojí na jeho březích u Mosulu a Kal'at Šerkátu."
  sv:
    - "Tigris är den östra av Mesopotamiens två stora floder. Den har sitt ursprung i bergen i sydöstra Turkiet nära Hazarsjön, flyter omkring 1 850 km åt sydost förbi Diyarbakır, Mosul och Bagdad, och förenas med Eufrat i södra Irak och bildar Shatt al-Arab, som rinner ut i Persiska viken. Snabbare och mer översvämningsbenägen än Eufrat bar den Assyriens kärnland: Assur, Kalhu (Nimrud) och Nineve låg vid eller nära dess stränder, och senare Seleukia och Ktesifon, och Bagdad. Dess hebreiska namn, Hiddekel, kommer från akkadiskans Idiqlat; Tigris är den grekiska formen av dess persiska namn."
    - "Den hebreiska Bibeln nämner den bara två gånger. I Första Moseboken är den en av de fyra floder som floden från Eden delar sig i: ”Den tredje floden heter Hiddekel; det är den som har sitt lopp öster om Assyrien. Den fjärde floden är Frat.” Tillsammans med Eufrat knyter den trädgården till den kända världen, medan de två andra floderna, Pishon och Gihon, aldrig har identifierats med säkerhet. I Daniel är floden skådeplats för den sista stora synen, i Kyros' tredje år: ”På tjugufjärde dagen i första månaden, när jag var vid stranden av den stora floden, nämligen Hiddekel”, såg Daniel en man klädd i linne."
    - "I dag flyter Tigris genom Turkiet, längs den syriska gränsen och genom Irak; dammar i Turkiet och Irak har kraftigt minskat dess flöde och med det de södra träsken, och ruinerna av Nineve och Assur ligger vid dess stränder vid Mosul och Qal'at Sherqat."
  nb:
    - "Tigris er den østlige av de to store elvene i Mesopotamia. Den har sin kilde i fjellene i sørøstlige Tyrkia nær Hazar-sjøen, renner omkring 1850 km mot sørøst forbi Diyarbakır, Mosul og Bagdad, og forener seg med Eufrat i det sørlige Irak og danner Shatt al-Arab, som løper ut i Persiabukta. Raskere og mer utsatt for flom enn Eufrat bar den kjerneområdet i Assyria: Assur, Kalhu (Nimrud) og Ninive lå ved eller nær breddene, og senere Seleukia og Ktesifon, og Bagdad. Det hebraiske navnet, Hiddekel, kommer av akkadisk Idiqlat; Tigris er den greske formen av det persiske navnet."
    - "Den hebraiske Bibelen nevner den bare to ganger. I Første Mosebok er den en av de fire elvene som elven fra Eden deler seg i: «Den tredje elv heter Hiddekel; det er den som går østenfor Assur. Og den fjerde elv er Frat.» Sammen med Eufrat knytter den haven til den kjente verden, mens de to andre elvene, Pisjon og Gihon, aldri er blitt identifisert med sikkerhet. I Daniel er elven rammen for det siste store synet, i Kyros' tredje år: «På den fire og tyvende dag i den første måned, mens jeg stod ved bredden av den store elv, det er Hiddekel», så Daniel en mann kledd i lin."
    - "I dag renner Tigris gjennom Tyrkia, langs grensen til Syria og gjennom Irak; demninger i Tyrkia og Irak har sterkt redusert vannføringen og dermed myrene i sør, og ruinene av Ninive og Assur ligger ved elvebreddene ved Mosul og Qal'at Sherqat."
scripture:
  - Gen.2.10-Gen.2.14
  - Dan.10.1
  - Dan.10.4-Dan.10.5
sources:
