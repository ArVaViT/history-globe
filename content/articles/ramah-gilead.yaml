# Overview article (ADR 0007). Mainstream facts only; Ramah as a short form of Ramoth-gilead in two parallel verses; the site question is left to the Ramoth-gilead article.
id: ramah-gilead
place: ad27541
title:
  en: "Ramah"
  ru: "Рама"
body:
  en:
    - "This Ramah is not a separate town but a short form of Ramoth-gilead, the fortress of northern Gilead that Israel and the Aramaeans of Damascus fought over. Two parallel verses use it, both of King Joram of Israel: he “went back to be healed in Jezreel of the wounds which the Syrians had given him at Ramah, when he fought against Hazael king of Syria”, and Ahaziah of Judah went down to visit him there. The Synodal text of Kings has “Ramoth” here and keeps “Ramah” only in Chronicles."
    - "The wounding led straight to the fall of the house of Ahab: while Joram lay in Jezreel, Elisha had Jehu anointed king in Ramoth-gilead, and Jehu drove to Jezreel and killed both kings. Where the town stood is disputed between Tell er-Rumeith, ar-Ramtha and Tell el-Hisn in northern Jordan; the Ramoth-gilead article gives the case, and the map point is the same."
  ru:
    - "Эта Рама — не отдельный город, а краткая форма имени Рамоф Галаадский, крепости северного Галаада, за которую воевали Израиль и Сирийцы Дамаска. Её называют два параллельных стиха, оба о царе Израильском Иораме; в Паралипоменоне сказано: «и возвратился он в Изреель лечиться от ран, которые причинили ему в Раме, когда он воевал с Азаилом, царем Сирийским», и Охозия, царь Иудейский, пришёл навестить его. В Синодальном тексте книги Царств здесь стоит «Рамоф», а «Рама» сохранена только в Паралипоменоне."
    - "Эта рана прямо привела к падению дома Ахава: пока Иорам лежал в Изрееле, Елисей велел помазать Ииуя на царство в Рамофе Галаадском, и Ииуй поехал в Изреель и убил обоих царей. Где стоял город, спорят: Телль-эр-Румейт, Эр-Рамта или Телль-эль-Хисн на севере Иордании; доводы приведены в статье о Рамофе Галаадском, и точка на карте та же."
scripture:
