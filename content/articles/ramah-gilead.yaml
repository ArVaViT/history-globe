body:
  en:
    - "This Ramah is not a separate town but a short form of Ramoth-gilead, the fortress of northern Gilead that Israel and the Aramaeans of Damascus fought over. Two parallel verses use it, both of King Joram of Israel: he “went back to be healed in Jezreel of the wounds which the Syrians had given him at Ramah, when he fought against Hazael king of Syria”, and Ahaziah of Judah went down to visit him in Jezreel. The Synodal text of Kings has “Ramoth” here and keeps “Ramah” only in Chronicles."
    - "The wounding led straight to the fall of the house of Ahab: while Joram lay in Jezreel, Elisha had Jehu anointed king in Ramoth-gilead, and Jehu drove to Jezreel, killed Joram there and had Ahaziah shot down as he fled. Where the town stood is disputed between Tell er-Rumeith, ar-Ramtha and Tell el-Hisn in northern Jordan; the Ramoth-gilead article gives the case, and the map point is the same."
  ru:
    - "Эта Рама — не отдельный город, а краткая форма имени Рамоф Галаадский, крепости северного Галаада, за которую воевали Израиль и Сирийцы Дамаска. Её называют два параллельных стиха, оба о царе Израильском Иораме; в Паралипоменоне сказано: «и возвратился он в Изреель лечиться от ран, которые причинили ему в Раме, когда он воевал с Азаилом, царем Сирийским», и Охозия, царь Иудейский, пришёл в Изреель навестить его. В Синодальном тексте книги Царств здесь стоит «Рамоф», а «Рама» сохранена только в Паралипоменоне."
    - "Эта рана прямо привела к падению дома Ахава: пока Иорам лежал в Изрееле, Елисей велел помазать Ииуя на царство в Рамофе Галаадском, и Ииуй поехал в Изреель, убил там Иорама и велел поразить Охозию, когда тот бежал. Где стоял город, спорят: Телль-эр-Румейт, Эр-Рамта или Телль-эль-Хисн на севере Иордании; доводы приведены в статье о Рамофе Галаадском, и точка на карте та же."
  uk:
    - "Ця Рама — не окреме місто, а скорочена форма Рамота Гілеадського, фортеці північного Гілеаду, за яку воювали Ізраїль та арамеї Дамаска. Два паралельні вірші вживають її, обидва про царя Ізраїля Йорама: він «вернувсь … гоїтись із ран, що заподїяли йому в Рамі, як він воювавсь з Азаїлом, царем Сирийським» до Їзрееля, а Охозія Юдейський поїхав відвідати його в Їзреелі. У синодальному тексті Книг Царів тут стоїть «Рамот», а «Рама» збережена лише в Хроніках."
    - "Поранення привело прямо до падіння дому Ахава: поки Йорам лежав у Їзреелі, Єлисей помазав Єгу на царя в Рамоті Гілеадському, а Єгу помчав до Їзрееля, убив там Йорама й звелів підстрелити Охозію, коли той утікав. Де стояло місто, спірно між Телль-ер-Румейтом, ар-Рамтою та Телль-ель-Хісном на півночі Йорданії; стаття «Рамот Гілеадський» викладає доводи, а точка на мапі та сама."
  es:
    - "Esta Ramá no es una ciudad aparte, sino una forma abreviada de Ramot de Galaad, la fortaleza del norte de Galaad por la que lucharon Israel y los arameos de Damasco. Dos versículos paralelos la usan, ambos del rey Joram de Israel: «se volvió para curarse en Jezreel de las heridas que le habían hecho en Rama, peleando con Hazael rey de Siria», y Ocozías de Judá bajó a visitarlo en Jezreel. El texto sinodal de Reyes tiene aquí «Ramot» y conserva «Ramá» solo en Crónicas."
    - "La herida llevó directamente a la caída de la casa de Acab: mientras Joram yacía en Jezreel, Eliseo hizo ungir a Jehú rey en Ramot de Galaad, y Jehú fue en carro a Jezreel, mató allí a Joram e hizo herir a Ocozías cuando huía. Dónde estaba la ciudad se discute entre Tell er-Rumeith, ar-Ramtha y Tell el-Hisn, en el norte de Jordania; el artículo de Ramot de Galaad expone el caso, y el punto del mapa es el mismo."
  pt:
    - "Esta Ramá não é uma cidade à parte, mas uma forma abreviada de Ramote-Gileade, a fortaleza do norte de Gileade pela qual Israel e os arameus de Damasco lutaram. Dois versículos paralelos a usam, ambos do rei Jorão de Israel: ele “voltou para ser curado em Jezreel das feridas que os sírios lhe haviam feito em Ramá, quando ele lutou contra Hazael, rei da Síria”, e Acazias de Judá desceu para visitá-lo em Jezreel. O texto sinodal de Reis traz “Ramote” aqui e conserva “Ramá” só em Crônicas."
    - "O ferimento levou direto à queda da casa de Acabe: enquanto Jorão jazia em Jezreel, Eliseu mandou ungir Jeú rei em Ramote-Gileade, e Jeú foi de carro a Jezreel, matou ali Jorão e mandou atingir Acazias quando ele fugia. Onde a cidade ficava é disputado entre Tell er-Rumeith, ar-Ramtha e Tell el-Hisn, no norte da Jordânia; o artigo Ramote-Gileade expõe o caso, e o ponto do mapa é o mesmo."
  de:
    - "Dieses Rama ist keine eigene Stadt, sondern eine Kurzform von Ramot-Gilead, der Festung im nördlichen Gilead, um die Israel und die Aramäer von Damaskus kämpften. Zwei parallele Verse gebrauchen sie, beide von König Joram von Israel: „Da kehrte Joram, der König, um, daß er sich heilen ließ zu Jesreel von den Wunden, die ihm die Syrer geschlagen hatten zu Rama, da er mit Hasael, dem König von Syrien, stritt“, und Ahasja von Juda kam hinab, ihn in Jesreel zu besuchen. Der Text der Könige in der Synodalübersetzung hat hier „Ramot“ und behält „Rama“ nur in der Chronik."
    - "Die Verwundung führte geradewegs zum Sturz des Hauses Ahab: Während Joram in Jesreel lag, ließ Elisa Jehu in Ramot-Gilead zum König salben, und Jehu fuhr nach Jesreel, tötete dort Joram und ließ Ahasja auf der Flucht niederschießen. Wo die Stadt stand, ist zwischen Tell er-Rumeith, ar-Ramtha und Tell el-Hisn im Norden Jordaniens umstritten; der Artikel Ramot-Gilead legt den Fall dar, und der Kartenpunkt ist derselbe."
  fr:
    - "Cette Rama n’est pas une ville distincte mais une forme abrégée de Ramoth en Galaad, la forteresse du nord de Galaad que se disputaient Israël et les Araméens de Damas. Deux versets parallèles l’emploient, tous deux à propos du roi Joram d’Israël : il « s’en retourna pour se faire guérir à Jizreel des blessures que les Syriens lui avaient faites à Rama, lorsqu’il se battait contre Hazaël, roi de Syrie », et Achazia de Juda descendit le voir à Jizreel. Le texte synodal russe des Rois a ici « Ramoth » et ne garde « Rama » que dans les Chroniques (Louis Segond lit « Rama » dans les deux)."
    - "La blessure mena droit à la chute de la maison d’Achab : tandis que Joram était alité à Jizreel, Élisée fit oindre Jéhu roi à Ramoth en Galaad, et Jéhu se rendit en char à Jizreel, y tua Joram et fit abattre Achazia dans sa fuite. L’emplacement de la ville est disputé entre Tell er-Rumeith, ar-Ramtha et Tell el-Hisn, dans le nord de la Jordanie ; l’article Ramoth en Galaad expose le cas, et le point de la carte est le même."
  it:
    - "Questa Rama non è una città distinta ma una forma abbreviata di Ramot di Galaad, la fortezza del Galaad settentrionale per cui Israele e gli Aramei di Damasco si contesero. Due versetti paralleli la usano, entrambi riguardo al re Ioram d’Israele: «tornò a Izreel per farsi curare delle ferite che avea ricevute dai Siri a Ramah, quando combatteva contro Hazael, re di Siria», e Acazia di Giuda scese a visitarlo a Izreel. Il testo sinodale dei Re ha qui «Ramot» e conserva «Rama» solo nelle Cronache."
    - "La ferita portò direttamente alla caduta della casa di Acab: mentre Ioram giaceva a Izreel, Eliseo fece ungere re Ieu a Ramot di Galaad, e Ieu corse a Izreel, vi uccise Ioram e fece colpire Acazia mentre fuggiva. Dove sorgesse la città è controverso tra Tell er-Rumeith, ar-Ramtha e Tell el-Hisn nella Giordania settentrionale; l’articolo su Ramot di Galaad espone il caso, e il punto sulla mappa è lo stesso."
  pl:
    - "Ta Rama nie jest odrębnym miastem, lecz skróconą formą Ramot w Gileadzie, twierdzy północnego Gileadu, o którą walczyli Izrael i Aramejczycy z Damaszku. Używają jej dwa równoległe wersety, oba o królu Joramie izraelskim: „wrócił się król Joram, aby się leczył w Jezreelu na rany, które mu byli zadali Syryjczycy w Ramacie, gdy walczył z Hazaelem, królem Syryjskim”, a Ochozjasz z Judy przybył do Jizreel, by go odwiedzić. Tekst synodalny Ksiąg Królewskich ma tu „Ramot” i zachowuje „Ramę” tylko w Kronikach."
    - "Zranienie doprowadziło wprost do upadku domu Achaba: gdy Joram leżał w Jizreel, Elizeusz kazał namaścić Jehu na króla w Ramot w Gileadzie, a Jehu pojechał do Jizreel, zabił tam Jorama i kazał zranić uciekającego Ochozjasza. Gdzie stało miasto, jest sporne między Tell er-Rumajt, ar-Ramtą i Tell el-Hisn w północnej Jordanii; artykuł o Ramot w Gileadzie podaje argumenty, a punkt na mapie jest ten sam."
  cs:
    - "Tato Ráma není samostatné město, ale zkrácená podoba Rámotu v Gileadu, pevnosti severního Gileadu, o niž bojoval Izrael s Aramejci z Damašku. Užívají jí dva souběžné verše, oba o králi Joramovi Izraelském: „navrátil se král Joram, aby se hojil v Jezreel na rány, kterýmiž ho ranili Syrští v Ráma, když bojoval s Hazaelem králem Syrským“, a Achazjáš Judský za ním sestoupil, aby jej v Jizreelu navštívil. Synodální text Královských má na tomto místě „Rámot“ a „Ráma“ ponechává jen v Kronikách."
    - "Zranění vedlo přímo k pádu Achabova domu: zatímco Joram ležel v Jizreelu, dal Elíša v Rámotu v Gileadu pomazat Jehúa za krále a Jehú se hnal do Jizreelu, zabil tam Jorama a dal postřelit prchajícího Achazjáše. Kde město stálo, je sporné mezi Tell er-Rumajt, ar-Ramtou a Tell el-Hisn v severním Jordánsku; případ podává článek o Rámotu v Gileadu a bod na mapě je tentýž."
  nl:
    - "Deze Rama is geen aparte stad maar een korte vorm van Ramot in Gilead, de vesting van Noord-Gilead waarom Israël en de Arameeërs van Damascus streden. Twee parallelle verzen gebruiken haar, beide over koning Joram van Israël: hij keerde “wederom, opdat hij zich te Jizreel helen liet van de slagen, die hem de Syriërs te Rama geslagen hadden, als hij streed tegen Hazael, den koning van Syrië”, en Achazia van Juda ging naar hem toe om hem in Jizreël te bezoeken. De Synodale tekst van Koningen heeft hier “Ramot” en bewaart “Rama” alleen in Kronieken."
    - "De verwonding leidde rechtstreeks tot de val van het huis van Achab: terwijl Joram in Jizreël lag, liet Elisa Jehu tot koning zalven in Ramot in Gilead, en Jehu reed naar Jizreël, doodde daar Joram en liet Achazia op de vlucht neerschieten. Waar de stad lag, is omstreden tussen Tell er-Rumeith, ar-Ramtha en Tell el-Hisn in het noorden van Jordanië; het artikel Ramot in Gilead geeft de argumenten, en het kaartpunt is hetzelfde."
  sv:
    - "Detta Rama är inte en egen stad utan en kortform av Ramot-Gilead, fästningen i norra Gilead som Israel och araméerna i Damaskus stred om. Två parallella verser använder det, båda om kung Joram av Israel: han ”vände tillbaka, för att i Jisreel låta hela sig från de sår som araméerna hade tillfogat honom vid Rama, i striden mot Hasael, konungen i Aram”, och Achasja av Juda for ned för att besöka honom i Jisreel. Synodalbibelns text i Konungaböckerna har ”Ramot” här och behåller ”Rama” bara i Krönikeböckerna."
    - "Såret ledde rakt till Achavs hus fall: medan Joram låg i Jisreel lät Elisha smörja Jehu till kung i Ramot-Gilead, och Jehu körde till Jisreel, dödade Joram där och lät skjuta ned Achasja när han flydde. Var staden låg är omstritt mellan Tell er-Rumeith, ar-Ramtha och Tell el-Hisn i norra Jordanien; artikeln om Ramot-Gilead redovisar saken, och kartpunkten är densamma."
  nb:
    - "Denne Rama er ikke en egen by, men en kortform av Ramot-Gilead, festningen i nordlige Gilead som Israel og arameerne i Damaskus kjempet om. To parallelle vers bruker den, begge om kong Joram av Israel: han «vendte [...] tilbake for å la sig læge i Jisre'el for de sår syrerne hadde slått ham ved Rama da han stred mot Syrias konge Hasael», og Ahasja av Juda dro ned for å besøke ham i Jisreel. Den synodale teksten i Kongebøkene har «Ramot» her og beholder «Rama» bare i Krønikebøkene."
    - "Såringen førte rett til Akabs hus' fall: mens Joram lå i Jisreel, lot Elisja salve Jehu til konge i Ramot-Gilead, og Jehu kjørte til Jisreel, drepte Joram der og lot Ahasja skyte ned på flukt. Hvor byen lå, er omstridt mellom Tell er-Rumeith, ar-Ramtha og Tell el-Hisn i nordlige Jordan; artikkelen om Ramot-Gilead gjør rede for saken, og kartpunktet er det samme."
  tl:
    - "Ang Rama na ito ay hindi hiwalay na bayan kundi isang maikling anyo ng Ramoth-galaad, ang kuta ng hilagang Galaad na pinag-agawan ng Israel at ng mga Arameo ng Damasco. Dalawang magkahawig na talata ang gumagamit nito, kapwa tungkol kay Haring Joram ng Israel: siya ay “bumalik upang magpagaling sa Jezreel ng mga sugat na isinugat nila sa kaniya sa Rama, ng siya'y makipaglaban kay Hazael na hari sa Siria”, at lumusong si Ochozias ng Juda upang dalawin siya sa Jezreel. Ang tekstong Sinodal ng Mga Hari ay may “Ramoth” dito at pinananatili ang “Rama” sa Mga Cronica lamang."
    - "Ang pagkasugat ay direktang humantong sa pagbagsak ng sambahayan ni Achab: habang nakahiga si Joram sa Jezreel, ipinahiran ni Eliseo si Jehu bilang hari sa Ramoth-galaad, at nagmaneho si Jehu patungong Jezreel, pinatay doon si Joram at ipinabaril si Ochozias habang tumatakas. Pinagtatalunan kung saan nakatayo ang bayan sa pagitan ng Tell er-Rumeith, ar-Ramtha at Tell el-Hisn sa hilagang Jordan; ibinibigay ng artikulo ng Ramoth-galaad ang katwiran, at pareho ang punto sa mapa."
  da:
    - "Denne Rama er ikke en særskilt by, men en kortform af Ramot i Gilead, fæstningen i det nordlige Gilead, som Israel og aramæerne fra Damaskus kæmpede om. To parallelle vers bruger den, begge om kong Joram af Israel: han vendte tilbage »for at lade sig læge i Jisreel af de Saar, som Syrerne havde slaget ham ved Rama, der han stred imod Hasael, Kongen af Syrien«, og Akazja af Juda kom ned for at besøge ham i Jizre'el. Den synodale tekst af Kongebøgerne har her »Ramot« og beholder »Rama« kun i Krønikebøgerne."
    - "Såringen førte direkte til Akabs hus' fald: mens Joram lå i Jizre'el, lod Elisa Jehu salve til konge i Ramot i Gilead, og Jehu kørte til Jizre'el, dræbte Joram dér og lod Akazja skyde ned, da han flygtede. Hvor byen lå, er omstridt mellem Tell er-Rumeith, ar-Ramtha og Tell el-Hisn i det nordlige Jordan; artiklen om Ramot i Gilead giver sagen, og kortets punkt er det samme."
