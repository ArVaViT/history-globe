# Overview article (ADR 0007). Mainstream facts only; Ramah as a short form of Ramoth-gilead in two parallel verses; the site question is left to the Ramoth-gilead article.
id: ramah-gilead
place: ad27541
title:
  en: "Ramah"
  ru: "Рама"
  uk: "Рама"
  es: "Ramá"
  pt: "Ramá"
  de: "Rama"
  fr: "Rama"
body:
  en:
    - "This Ramah is not a separate town but a short form of Ramoth-gilead, the fortress of northern Gilead that Israel and the Aramaeans of Damascus fought over. Two parallel verses use it, both of King Joram of Israel: he “went back to be healed in Jezreel of the wounds which the Syrians had given him at Ramah, when he fought against Hazael king of Syria”, and Ahaziah of Judah went down to visit him there. The Synodal text of Kings has “Ramoth” here and keeps “Ramah” only in Chronicles."
    - "The wounding led straight to the fall of the house of Ahab: while Joram lay in Jezreel, Elisha had Jehu anointed king in Ramoth-gilead, and Jehu drove to Jezreel and killed both kings. Where the town stood is disputed between Tell er-Rumeith, ar-Ramtha and Tell el-Hisn in northern Jordan; the Ramoth-gilead article gives the case, and the map point is the same."
  ru:
    - "Эта Рама — не отдельный город, а краткая форма имени Рамоф Галаадский, крепости северного Галаада, за которую воевали Израиль и Сирийцы Дамаска. Её называют два параллельных стиха, оба о царе Израильском Иораме; в Паралипоменоне сказано: «и возвратился он в Изреель лечиться от ран, которые причинили ему в Раме, когда он воевал с Азаилом, царем Сирийским», и Охозия, царь Иудейский, пришёл навестить его. В Синодальном тексте книги Царств здесь стоит «Рамоф», а «Рама» сохранена только в Паралипоменоне."
    - "Эта рана прямо привела к падению дома Ахава: пока Иорам лежал в Изрееле, Елисей велел помазать Ииуя на царство в Рамофе Галаадском, и Ииуй поехал в Изреель и убил обоих царей. Где стоял город, спорят: Телль-эр-Румейт, Эр-Рамта или Телль-эль-Хисн на севере Иордании; доводы приведены в статье о Рамофе Галаадском, и точка на карте та же."
  uk:
    - "Ця Рама — не окреме місто, а скорочена форма Рамота Гілеадського, фортеці північного Гілеаду, за яку воювали Ізраїль та арамеї Дамаска. Два паралельні вірші вживають її, обидва про царя Ізраїля Йорама: він «вернувсь … гоїтись із ран, що заподїяли йому в Рамі, як він воювавсь з Азаїлом, царем Сирийським» до Їзрееля, а Охозія Юдейський поїхав його відвідати. У синодальному тексті Книг Царів тут стоїть «Рамот», а «Рама» збережена лише в Хроніках."
    - "Поранення привело прямо до падіння дому Ахава: поки Йорам лежав у Їзреелі, Єлисей помазав Єгу на царя в Рамоті Гілеадському, а Єгу помчав до Їзрееля й убив обох царів. Де стояло місто, спірно між Телль-ер-Румейтом, ар-Рамтою та Телль-ель-Хісном на півночі Йорданії; стаття «Рамот Гілеадський» викладає доводи, а точка на мапі та сама."
  es:
    - "Esta Ramá no es una ciudad aparte, sino una forma abreviada de Ramot de Galaad, la fortaleza del norte de Galaad por la que lucharon Israel y los arameos de Damasco. Dos versículos paralelos la usan, ambos del rey Joram de Israel: «se volvió para curarse en Jezreel de las heridas que le habían hecho en Rama, peleando con Hazael rey de Siria», y Ocozías de Judá bajó a visitarlo allí. El texto sinodal de Reyes tiene aquí «Ramot» y conserva «Ramá» solo en Crónicas."
    - "La herida llevó directamente a la caída de la casa de Acab: mientras Joram yacía en Jezreel, Eliseo hizo ungir a Jehú rey en Ramot de Galaad, y Jehú fue en carro a Jezreel y mató a ambos reyes. Dónde estaba la ciudad se discute entre Tell er-Rumeith, ar-Ramtha y Tell el-Hisn, en el norte de Jordania; el artículo de Ramot de Galaad expone el caso, y el punto del mapa es el mismo."
  pt:
    - "Esta Ramá não é uma cidade à parte, mas uma forma abreviada de Ramote-Gileade, a fortaleza do norte de Gileade pela qual Israel e os arameus de Damasco lutaram. Dois versículos paralelos a usam, ambos do rei Jorão de Israel: ele “voltou para ser curado em Jezreel das feridas que os sírios lhe haviam feito em Ramá, quando ele lutou contra Hazael, rei da Síria”, e Acazias de Judá desceu para visitá-lo ali. O texto sinodal de Reis traz “Ramote” aqui e conserva “Ramá” só em Crônicas."
    - "O ferimento levou direto à queda da casa de Acabe: enquanto Jorão jazia em Jezreel, Eliseu mandou ungir Jeú rei em Ramote-Gileade, e Jeú foi de carro a Jezreel e matou os dois reis. Onde a cidade ficava é disputado entre Tell er-Rumeith, ar-Ramtha e Tell el-Hisn, no norte da Jordânia; o artigo Ramote-Gileade expõe o caso, e o ponto do mapa é o mesmo."
  de:
    - "Dieses Rama ist keine eigene Stadt, sondern eine Kurzform von Ramot-Gilead, der Festung im nördlichen Gilead, um die Israel und die Aramäer von Damaskus kämpften. Zwei parallele Verse gebrauchen sie, beide von König Joram von Israel: „Da kehrte Joram, der König, um, daß er sich heilen ließ zu Jesreel von den Wunden, die ihm die Syrer geschlagen hatten zu Rama, da er mit Hasael, dem König von Syrien, stritt“, und Ahasja von Juda kam hinab, ihn dort zu besuchen. Der Text der Könige in der Synodalübersetzung hat hier „Ramot“ und behält „Rama“ nur in der Chronik."
    - "Die Verwundung führte geradewegs zum Sturz des Hauses Ahab: Während Joram in Jesreel lag, ließ Elisa Jehu in Ramot-Gilead zum König salben, und Jehu fuhr nach Jesreel und tötete beide Könige. Wo die Stadt stand, ist zwischen Tell er-Rumeith, ar-Ramtha und Tell el-Hisn im Norden Jordaniens umstritten; der Artikel Ramot-Gilead legt den Fall dar, und der Kartenpunkt ist derselbe."
  fr:
    - "Cette Rama n’est pas une ville distincte mais une forme abrégée de Ramoth en Galaad, la forteresse du nord de Galaad que se disputaient Israël et les Araméens de Damas. Deux versets parallèles l’emploient, tous deux à propos du roi Joram d’Israël : il « s’en retourna pour se faire guérir à Jizreel des blessures que les Syriens lui avaient faites à Rama, lorsqu’il se battait contre Hazaël, roi de Syrie », et Achazia de Juda descendit le voir là. Le texte synodal russe des Rois a ici « Ramoth » et ne garde « Rama » que dans les Chroniques (Louis Segond lit « Rama » dans les deux)."
    - "La blessure mena droit à la chute de la maison d’Achab : tandis que Joram était alité à Jizreel, Élisée fit oindre Jéhu roi à Ramoth en Galaad, et Jéhu se rendit en char à Jizreel et tua les deux rois. L’emplacement de la ville est disputé entre Tell er-Rumeith, ar-Ramtha et Tell el-Hisn, dans le nord de la Jordanie ; l’article Ramoth en Galaad expose le cas, et le point de la carte est le même."
