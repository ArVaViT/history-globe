body:
  en:
    - 'Midian was the land of the Midianites, a people of herdsmen, caravan traders and raiders east of the Gulf of Aqaba, in the north-west of Arabia, though their camps and trade reached across Sinai and the Negeb and up to Moab and Gilead. Genesis makes Midian a son of Abraham by Keturah, sent away "eastward, unto the east country". The painted pottery called Midianite or Qurayya ware, of the thirteenth to eleventh centuries BC, has been found from Qurayya in the Hejaz to Timna in the Arabah, where a Midianite shrine succeeded the Egyptian temple of Hathor. Ptolemy names Modiana and Madiama in north-western Arabia, and Eusebius places Madiam east of the Red Sea; the city is usually located at al-Bad'' in Saudi Arabia.'
    - 'Midianite merchants drew Joseph from the pit and sold him into Egypt. Moses, fleeing Pharaoh, "dwelt in the land of Midian", married Zipporah, daughter of "the priest of Midian", Reuel or Jethro, and was keeping his flock when he came to Horeb, "the mountain of God". After the exodus Jethro visited Israel at the mountain, offered sacrifice and advised Moses to appoint judges; Hobab the Midianite was asked to guide the people. Where Sinai lay in relation to Midian is disputed: most place it in the south of the Sinai peninsula, some in Midian itself, since Paul speaks of "mount Sinai in Arabia".'
    - 'In Moab the elders of Midian joined Balak in hiring Balaam, and after the sin at Peor, where Cozbi, a Midianite princess, was slain, Moses made war on Midian and its five kings. In the days of the judges the Midianites, with the Amalekites and the children of the east, came up "as grasshoppers for multitude" with camels without number and stripped the land, until Gideon routed them with three hundred men and pursued them beyond the Jordan; the prophets remember "the day of Midian" and "the slaughter of Midian at the rock of Oreb". Isaiah sees "the dromedaries of Midian and Ephah" bringing gold and incense to Zion.'
    - "After Gideon the Midianites fade from the record; Assyrian and later texts speak of Arab tribes in their place. Josephus still knew a city of Midian by the Red Sea, where Moses found refuge. The land of Midian is today the Tabuk province of Saudi Arabia, around Tabuk, Qurayya and al-Bad', where rock-cut tombs of the Nabataean age are locally linked with Jethro; since 2017 the coast has been the site of the NEOM development."
  ru:
    - "Мадиам — земля Мадианитян, народа пастухов, караванных торговцев и налётчиков к востоку от залива Акаба, на северо-западе Аравии, хотя их стоянки и торговля простирались через Синай и Негев и доходили до Моава и Галаада. Книга Бытия делает Мадиана сыном Авраама от Хеттуры, отосланным «на восток, в землю восточную». Расписная керамика, которую называют мадианитской или керамикой Курайи, XIII–XI веков до н. э., найдена от Курайи в Хиджазе до Тимны в Араве, где мадианитское святилище сменило египетский храм Хатхор. Птолемей называет Модиану и Мадиаму на северо-западе Аравии, а Евсевий помещает Мадиам к востоку от Красного моря; этот город обычно отождествляют с Эль-Бадом в Саудовской Аравии."
    - "Купцы Мадиамские вытащили Иосифа изо рва и продали в Египет. Моисей, бежав от фараона, «остановился в земле Мадиамской», женился на Сепфоре, дочери «священника Мадиамского» Рагуила, или Иофора, и пас его овец, когда пришёл к Хориву, «горе Божией». После исхода Иофор пришёл к Израилю у горы, принёс жертвы и посоветовал Моисею поставить судей; Ховава Мадианитянина просили быть проводником народа. Где лежал Синай по отношению к Мадиаму — спорно: большинство помещает его на юге Синайского полуострова, некоторые — в самом Мадиаме, поскольку Павел упоминает «гору Синай в Аравии»."
    - "В Моаве старейшины Мадиамские вместе с Валаком нанимали Валаама, а после греха у Фегора, где была убита Хазва, дочь мадиамского начальника, Моисей пошёл войной на Мадиам и его пять царей. Во дни судей Мадианитяне с Амаликитянами и жителями востока приходили «в таком множестве, как саранча», с бесчисленными верблюдами и опустошали землю, пока Гедеон не разбил их с тремя сотнями и не преследовал за Иордан; пророки помнят «день Мадиама» и время «поражения Мадиама у скалы Орива». Исаия видит «дромадеры из Мадиама и Ефы», несущие в Сион золото и ладан."
    - "После Гедеона Мадианитяне исчезают из записей; ассирийские и позднейшие тексты говорят на их месте об арабских племенах. Иосиф Флавий ещё знал город Мадиам у Красного моря, где укрылся Моисей. Земля Мадиамская сегодня — провинция Табук в Саудовской Аравии, вокруг Табука, Курайи и Эль-Бада, где высеченные в скале гробницы набатейского времени местное предание связывает с Иофором; с 2017 года на побережье строится НЕОМ."
  uk:
    - "Мадіам був краєм мадіамлян, народу пастухів, караванних торговців і розбійників на схід від Акабської затоки, на північному заході Аравії, хоча їхні табори й торгівля сягали Синаю й Негеву і аж до Моаву та Гілеаду. Книга Буття робить Мадіана сином Авраама від Хетури, відісланим «на схід соньця, у землю восточню». Розписану кераміку, звану мадіамською або керамікою Курайя, XIII–XI ст. до н. е., знайдено від Курайї в Хіджазі до Тімни в Арабі, де мадіамська святиня змінила єгипетський храм Хатор. Птолемей називає Модіану й Мадіаму на північному заході Аравії, а Євсевій розміщує Мадіам на схід від Червоного моря; місто зазвичай розміщують в аль-Баді у Саудівській Аравії."
    - "Мадіамські купці витягли Йосипа з ями й продали його до Єгипту. Мойсей, утікаючи від фараона, «оселивсь у Мидиян землї», одружився з Сепфорою, дочкою «сьвященника Мидиянського», Регуїла або Єтра, і пас його отару, коли прийшов «до Божої Гореб гори». Після виходу Єтро відвідав Ізраїль біля гори, приніс жертву й порадив Мойсеєві настановити суддів; Ховава мадіамлянина просили бути провідником народу. Де лежав Синай стосовно Мадіаму, є спірним: більшість розміщує його на півдні Синайського півострова, дехто — у самому Мадіамі, бо Павло говорить про «Синай, гора в Аравиї»."
    - "У Моаві старші мадіамські приєдналися до Валака, щоб найняти Валаама, а після гріха при Пеорі, де була вбита Хазва, мадіамська князівна, Мойсей воював проти Мадіама й п’яти його царів. За днів суддів мадіамляни з амалекитянами та синами сходу приходили, «бувало їх як сарани, безлїч», з верблюдами без ліку й спустошували край, аж поки Гедеон не розбив їх із трьомастами чоловіків і не гнав їх за Йордан; пророки згадують «як за Мидияма» й «як колись до побою Мадіяма на Ориві». Ісая бачить «дромедарі з Мадіяму і з Ефи», що несуть золото й ладан до Сіону."
    - "Після Гедеона мадіамляни зникають із записів; ассирійські й пізніші тексти згадують на їхньому місці арабські племена. Йосиф Флавій ще знав місто Мадіам біля Червоного моря, де Мойсей знайшов притулок. Земля Мадіаму сьогодні — провінція Табук у Саудівській Аравії, навколо Табука, Курайї й аль-Бада, де висічені в скелі гробниці набатейської доби місцево пов’язують з Єтром; від 2017 р. узбережжя є місцем забудови NEOM."
  es:
    - "Madián era la tierra de los madianitas, un pueblo de pastores, comerciantes de caravanas y saqueadores al este del golfo de Aqaba, en el noroeste de Arabia, aunque sus campamentos y su comercio llegaban a través del Sinaí y del Néguev y hasta Moab y Galaad. Génesis hace de Madián un hijo de Abraham y Cetura, enviado «hacia el oriente, á la tierra oriental». La cerámica pintada llamada madianita o de Qurayya, de los siglos XIII a XI a. C., se ha hallado desde Qurayya, en el Hiyaz, hasta Timna, en el Arabá, donde un santuario madianita sucedió al templo egipcio de Hathor. Ptolomeo nombra Modiana y Madiama en el noroeste de Arabia, y Eusebio sitúa Madiam al este del Mar Rojo; la ciudad suele localizarse en al-Bad', en Arabia Saudí."
    - "Mercaderes madianitas sacaron a José de la cisterna y lo vendieron a Egipto. Moisés, huyendo del faraón, «habitó en la tierra de Madián», se casó con Séfora, hija de «el sacerdote de Madián», Reuel o Jetro, y apacentaba su rebaño cuando llegó a Horeb, «monte de Dios». Tras el éxodo Jetro visitó a Israel en la montaña, ofreció sacrificio y aconsejó a Moisés nombrar jueces; a Hobab el madianita se le pidió que guiara al pueblo. Dónde estaba el Sinaí con relación a Madián se discute: la mayoría lo sitúa en el sur de la península del Sinaí, algunos en el propio Madián, pues Pablo habla de que «Sinaí es un monte de Arabia»."
    - "En Moab, los ancianos de Madián se unieron a Balac para contratar a Balaam, y tras el pecado de Peor, donde fue muerta Cozbi, una princesa madianita, Moisés hizo la guerra a Madián y a sus cinco reyes. En los días de los jueces los madianitas, con los amalecitas y los hijos del oriente, subieron «en grande multitud como langosta», con camellos sin número, y arrasaron la tierra, hasta que Gedeón los derrotó con trescientos hombres y los persiguió más allá del Jordán; los profetas recuerdan «el día de Madián» y «la matanza de Madián en la peña de Oreb». Isaías ve «dromedarios de Madián y de Epha» que traen oro e incienso a Sion."
    - "Después de Gedeón los madianitas desaparecen del registro; los textos asirios y posteriores hablan en su lugar de tribus árabes. Josefo aún conocía una ciudad de Madián junto al Mar Rojo, donde Moisés halló refugio. La tierra de Madián es hoy la provincia de Tabuk, en Arabia Saudí, en torno a Tabuk, Qurayya y al-Bad', donde unas tumbas excavadas en la roca de época nabatea se vinculan localmente con Jetro; desde 2017 la costa es el emplazamiento del proyecto NEOM."
  pt:
    - "Midiã era a terra dos midianitas, um povo de pastores, comerciantes de caravanas e saqueadores a leste do golfo de Aqaba, no noroeste da Arábia, embora seus acampamentos e comércio alcançassem o Sinai e o Neguebe e subissem até Moabe e Gileade. Gênesis faz de Midiã um filho de Abraão com Quetura, enviado “para o leste, para a terra do oriente”. A cerâmica pintada chamada midianita ou de Qurayya, dos séculos XIII a XI a.C., foi encontrada de Qurayya, no Hejaz, a Timna, na Arabá, onde um santuário midianita sucedeu ao templo egípcio de Hator. Ptolomeu nomeia Modiana e Madiama no noroeste da Arábia, e Eusébio situa Madiam a leste do Mar Vermelho; a cidade é geralmente localizada em al-Bad', na Arábia Saudita."
    - "Mercadores midianitas tiraram José da cisterna e o venderam ao Egito. Moisés, fugindo do faraó, “foi morar na terra de Midiã”, casou-se com Zípora, filha do “sacerdote de Midiã”, Reuel ou Jetro, e apascentava o rebanho quando chegou a Horebe, “o monte de Deus”. Depois do êxodo, Jetro visitou Israel no monte, ofereceu sacrifício e aconselhou Moisés a nomear juízes; Hobabe, o midianita, foi convidado a guiar o povo. Onde ficava o Sinai em relação a Midiã é disputado: a maioria o situa no sul da península do Sinai, alguns na própria Midiã, já que Paulo fala de “o monte Sinai, na Arábia”."
    - "Em Moabe, os anciãos de Midiã uniram-se a Balaque para contratar Balaão, e depois do pecado em Peor, onde Cosbi, uma princesa midianita, foi morta, Moisés fez guerra a Midiã e a seus cinco reis. Nos dias dos juízes, os midianitas, com os amalequitas e os povos do oriente, subiram “numerosos como gafanhotos”, com camelos sem conta, e despojaram a terra, até que Gideão os derrotou com trezentos homens e os perseguiu além do Jordão; os profetas lembram “o dia de Midiã” e “a matança de Midiã na rocha de Orebe”. Isaías vê “os dromedários de Midiã e Efa” trazendo ouro e incenso a Sião."
    - "Depois de Gideão, os midianitas somem do registro; textos assírios e posteriores falam de tribos árabes em seu lugar. Josefo ainda conhecia uma cidade de Midiã junto ao Mar Vermelho, onde Moisés encontrou refúgio. A terra de Midiã é hoje a província de Tabuk, na Arábia Saudita, em torno de Tabuk, Qurayya e al-Bad', onde túmulos escavados na rocha da época nabateia são localmente ligados a Jetro; desde 2017 a costa é o sítio do empreendimento NEOM."
  de:
    - "Midian war das Land der Midianiter, eines Volkes von Hirten, Karawanenhändlern und Plünderern östlich des Golfs von Akaba, im Nordwesten Arabiens, obwohl ihre Lager und ihr Handel über den Sinai und den Negev bis nach Moab und Gilead reichten. Die Genesis macht Midian zu einem Sohn Abrahams von Ketura, fortgeschickt „gegen Aufgang in das Morgenland“. Die als midianitisch oder Qurayya-Ware bezeichnete bemalte Keramik des 13. bis 11. Jahrhunderts v. Chr. wurde von Qurayya im Hedschas bis Timna in der Araba gefunden, wo ein midianitisches Heiligtum auf den ägyptischen Tempel der Hathor folgte. Ptolemäus nennt Modiana und Madiama im nordwestlichen Arabien, und Eusebius setzt Madiam östlich des Roten Meeres an; die Stadt wird meist in al-Bad' in Saudi-Arabien lokalisiert."
    - "Midianitische Kaufleute zogen Josef aus der Grube und verkauften ihn nach Ägypten. Mose, der vor dem Pharao floh, „blieb im Lande Midian“, heiratete Zipora, die Tochter „des Priesters in Midian“, Reguël oder Jitro, und hütete seine Schafe, als er „an den Berg Gottes, Horeb“ kam. Nach dem Auszug besuchte Jitro Israel am Berg, brachte Opfer dar und riet Mose, Richter einzusetzen; Hobab, der Midianiter, wurde gebeten, das Volk zu führen. Wo der Sinai im Verhältnis zu Midian lag, ist umstritten: Die meisten setzen ihn im Süden der Sinai-Halbinsel an, einige in Midian selbst, da Paulus sagt, Hagar „heißt in Arabien der Berg Sinai“."
    - "In Moab schlossen sich die Ältesten Midians Balak an, um Bileam zu dingen, und nach der Sünde bei Peor, wo Kosbi, eine midianitische Fürstentochter, erschlagen wurde, führte Mose Krieg gegen Midian und seine fünf Könige. In den Tagen der Richter kamen die Midianiter mit den Amalekitern und den Söhnen des Ostens „wie eine große Menge Heuschrecken“ mit unzähligen Kamelen herauf und verheerten das Land, bis Gideon sie mit dreihundert Mann schlug und jenseits des Jordan verfolgte; die Propheten erinnern an „zur Zeit Midians“ und an „die Schlacht Midians auf dem Fels Oreb“. Jesaja sieht „die jungen Kamele aus Midian und Epha“ Gold und Weihrauch nach Zion bringen."
    - "Nach Gideon verschwinden die Midianiter aus den Quellen; assyrische und spätere Texte sprechen an ihrer Stelle von arabischen Stämmen. Josephus kannte noch eine Stadt Midian am Roten Meer, wo Mose Zuflucht fand. Das Land Midian ist heute die Provinz Tabuk in Saudi-Arabien, um Tabuk, Qurayya und al-Bad', wo in den Fels gehauene Gräber der nabatäischen Zeit örtlich mit Jitro verbunden werden; seit 2017 ist die Küste Standort des NEOM-Projekts."
  fr:
    - "Madian était le pays des Madianites, peuple de pasteurs, de marchands de caravanes et de pillards à l’est du golfe d’Aqaba, dans le nord-ouest de l’Arabie, bien que leurs camps et leur commerce s’étendissent à travers le Sinaï et le Négev jusqu’à Moab et Galaad. La Genèse fait de Madian un fils d’Abraham et de Ketura, envoyé « du côté de l’orient, dans le pays d’Orient ». La céramique peinte dite madianite ou de Qurayya, du XIIIe au XIe siècle av. J.-C., a été trouvée de Qurayya dans le Hedjaz à Thimna dans l’Araba, où un sanctuaire madianite succéda au temple égyptien d’Hathor. Ptolémée nomme Modiana et Madiama dans le nord-ouest de l’Arabie, et Eusèbe place Madiam à l’est de la mer Rouge ; la ville est d’ordinaire située à al-Bad' en Arabie saoudite."
    - "Des marchands madianites tirèrent Joseph de la citerne et le vendirent en Égypte. Moïse, fuyant Pharaon, « se retira dans le pays de Madian », épousa Séphora, fille du « sacrificateur de Madian », Réuel ou Jéthro, et faisait paître son troupeau quand il vint à Horeb, « la montagne de Dieu ». Après l’exode, Jéthro rendit visite à Israël à la montagne, offrit un sacrifice et conseilla à Moïse d’établir des juges ; on demanda à Hobab le Madianite de guider le peuple. Où se trouvait le Sinaï par rapport à Madian est discuté : la plupart le placent dans le sud de la péninsule du Sinaï, certains en Madian même, puisque Paul parle du « mont Sinaï en Arabie »."
    - "À Moab, les anciens de Madian se joignirent à Balak pour engager Balaam, et après le péché de Peor, où Cozbi, princesse madianite, fut tuée, Moïse fit la guerre à Madian et à ses cinq rois. Aux jours des juges, les Madianites, avec les Amalécites et les fils de l’Orient, montèrent « comme une multitude de sauterelles » avec des chameaux sans nombre et dépouillèrent le pays, jusqu’à ce que Gédéon les mît en déroute avec trois cents hommes et les poursuivît au-delà du Jourdain ; les prophètes se souviennent de « la journée de Madian » et de ce que l’Éternel « frappa Madian au rocher d’Oreb ». Ésaïe voit « des dromadaires de Madian et d’Épha » apporter de l’or et de l’encens à Sion."
    - "Après Gédéon, les Madianites s’effacent des textes ; des textes assyriens et plus tardifs parlent à leur place de tribus arabes. Flavius Josèphe connaissait encore une ville de Madian au bord de la mer Rouge, où Moïse trouva refuge. Le pays de Madian est aujourd’hui la province de Tabouk, en Arabie saoudite, autour de Tabouk, de Qurayya et d’al-Bad', où des tombes taillées dans le roc de l’époque nabatéenne sont localement rattachées à Jéthro ; depuis 2017, la côte est le site du projet NEOM."
  it:
    - "Madian era la terra dei Madianiti, un popolo di pastori, mercanti di carovane e predoni a est del Golfo di Aqaba, nel nord-ovest dell’Arabia, benché i loro accampamenti e i loro traffici si estendessero attraverso il Sinai e il Negheb fino a Moab e Galaad. La Genesi fa di Madian un figlio di Abramo e di Chetura, mandato «verso levante, nel paese d’oriente». La ceramica dipinta detta madianita o Qurayya, dei secoli dal XIII all’XI a.C., è stata trovata da Qurayya nell’Hejaz fino a Timna nell’Araba, dove un santuario madianita succedette al tempio egizio di Hathor. Tolomeo nomina Modiana e Madiama nell’Arabia nord-occidentale, ed Eusebio colloca Madiam a est del Mar Rosso; la città è di solito localizzata ad al-Bad‘ in Arabia Saudita."
    - "Mercanti madianiti trassero Giuseppe dalla cisterna e lo vendettero in Egitto. Mosè, fuggendo dal faraone, «si fermò nel paese di Madian», sposò Zippora, figlia del «sacerdote di Madian», Reuel o Ietro, e pascolava il gregge quando giunse a Horeb, «la montagna di Dio». Dopo l’esodo Ietro visitò Israele al monte, offrì un sacrificio e consigliò a Mosè di nominare dei giudici; a Cobab il Madianita fu chiesto di guidare il popolo. Dove stesse il Sinai in rapporto a Madian è discusso: i più lo pongono nel sud della penisola del Sinai, alcuni in Madian stesso, poiché Paolo parla del «monte Sinai in Arabia»."
    - "In Moab gli anziani di Madian si unirono a Balak per prendere al soldo Balaam, e dopo il peccato di Peor, dove fu uccisa Cozbi, una principessa madianita, Mosè fece guerra a Madian e ai suoi cinque re. Al tempo dei giudici i Madianiti, con gli Amalechiti e i figli dell’oriente, salivano «come una moltitudine di locuste» con cammelli innumerevoli e spogliavano il paese, finché Gedeone li mise in rotta con trecento uomini e li inseguì oltre il Giordano; i profeti ricordano «il giorno di Madian» e «come quando colpì Madian, alla roccia d’Oreb». Isaia vede «dromedari di Madian e d’Efa» portare oro e incenso a Sion."
    - "Dopo Gedeone i Madianiti svaniscono dalle fonti; testi assiri e più tardi parlano di tribù arabe al loro posto. Giuseppe Flavio conosceva ancora una città di Madian presso il Mar Rosso, dove Mosè trovò rifugio. La terra di Madian è oggi la provincia di Tabuk in Arabia Saudita, intorno a Tabuk, Qurayya e al-Bad‘, dove tombe scavate nella roccia dell’età nabatea sono legate localmente a Ietro; dal 2017 la costa è sede del progetto NEOM."
  pl:
    - "Madian było krajem Madianitów, ludu pasterzy, karawanowych kupców i najeźdźców na wschód od Zatoki Akaba, w północno-zachodniej Arabii, choć ich obozy i handel sięgały przez Synaj i Negew aż do Moabu i Gileadu. Księga Rodzaju czyni Madiana synem Abrahama z Ketury, wyprawionym „ku wschodowi do krainy wschodniej”. Malowana ceramika zwana madianicką albo Qurayya, z XIII–XI w. p.n.e., znajdowana jest od Qurayya w Hidżazie po Timnę w Arabie, gdzie madianickie sanktuarium zastąpiło egipską świątynię Hathor. Ptolemeusz wymienia Modianę i Madiamę w północno-zachodniej Arabii, a Euzebiusz umieszcza Madiam na wschód od Morza Czerwonego; miasto zwykle lokalizuje się w al-Bad' w Arabii Saudyjskiej."
    - "Madianiccy kupcy wyciągnęli Józefa ze studni i sprzedali go do Egiptu. Mojżesz, uciekając przed faraonem, „mieszkał w ziemi Madyjańskiej”, ożenił się z Seforą, córką „kapłana Madyjańskiego”, Reuela albo Jetra, i pasł jego trzodę, gdy przyszedł „do góry Bożej, do Horeb”. Po wyjściu Jetro odwiedził Izraela pod górą, złożył ofiarę i poradził Mojżeszowi ustanowić sędziów; Chobaba Madianitę proszono, by prowadził lud. Gdzie leżał Synaj w stosunku do Madianu, jest sporne: większość umieszcza go na południu półwyspu Synaj, niektórzy w samym Madianie, ponieważ Paweł mówi o górze Synaj w Arabii."
    - "W Moabie starsi Madianu przyłączyli się do Balaka w wynajęciu Balaama, a po grzechu w Peor, gdzie zabito Kozbi, madianicką księżniczkę, Mojżesz wypowiedział wojnę Madianowi i jego pięciu królom. W dniach sędziów Madianici, z Amalekitami i synami Wschodu, przyciągali „jako szarańcza w mnóstwie” z niezliczonymi wielbłądami i ogałacali kraj, aż Gedeon rozgromił ich trzystoma ludźmi i ścigał za Jordan; prorocy wspominają „jako za dni Madyjańczyków” i „porażkę Madyjańczyków na skale Horeb”. Izajasz widzi „dromedarze z Madyjan i z Efy” niosące złoto i kadzidło do Syjonu."
    - "Po Gedeonie Madianici znikają z zapisów; teksty asyryjskie i późniejsze mówią zamiast nich o plemionach arabskich. Józef Flawiusz wciąż znał miasto Madian nad Morzem Czerwonym, gdzie Mojżesz znalazł schronienie. Kraj Madian to dziś prowincja Tabuk w Arabii Saudyjskiej, wokół Tabuk, Qurayya i al-Bad', gdzie wykute w skale grobowce z epoki nabatejskiej lokalnie wiąże się z Jetrem; od 2017 r. wybrzeże jest miejscem rozwoju NEOM."
  nl:
    - "Midian was het land van de Midianieten, een volk van herders, karavaanhandelaars en plunderaars ten oosten van de Golf van Akaba, in het noordwesten van Arabië, hoewel hun kampen en handel zich uitstrekten over de Sinaï en de Negev en tot Moab en Gilead. Genesis maakt Midian tot een zoon van Abraham bij Ketura, “oostwaarts naar het land van het Oosten” weggezonden. Het beschilderde aardewerk dat Midianitisch of Qurayya-aardewerk heet, uit de dertiende tot elfde eeuw v.Chr., is gevonden van Qurayya in de Hidjaz tot Timna in de Araba, waar een Midianitisch heiligdom op de Egyptische tempel van Hathor volgde. Ptolemaeus noemt Modiana en Madiama in het noordwesten van Arabië, en Eusebius plaatst Madiam ten oosten van de Rode Zee; de stad wordt gewoonlijk gelokaliseerd bij al-Bad' in Saoedi-Arabië."
    - "Midianitische kooplieden trokken Jozef uit de put en verkochten hem naar Egypte. Mozes, op de vlucht voor de farao, “woonde in het land Midian”, trouwde met Zippora, dochter van “den priester in Midian”, Reüël of Jethro, en hoedde zijn kudde toen hij bij Horeb kwam, “den berg Gods”. Na de uittocht bezocht Jethro Israël bij de berg, bracht een offer en raadde Mozes aan rechters aan te stellen; Chobab de Midianiet werd gevraagd het volk te gidsen. Waar de Sinaï lag ten opzichte van Midian is omstreden: de meesten plaatsen hem in het zuiden van het schiereiland Sinaï, sommigen in Midian zelf, aangezien Paulus spreekt van “Sina, een berg in Arabië”."
    - "In Moab sloten de oudsten van Midian zich bij Balak aan om Bileam te huren, en na de zonde bij Peor, waar Kozbi, een Midianitische prinses, werd gedood, voerde Mozes oorlog tegen Midian en zijn vijf koningen. In de dagen van de richters trokken de Midianieten, met de Amalekieten en de kinderen van het oosten, op “gelijk de sprinkhanen in menigte”, met kemelen zonder tal, en plunderden het land, tot Gideon hen met driehonderd man verjoeg en over de Jordaan achtervolgde; de profeten gedenken de dag van Midian, “gelijk ten dage der Midianieten”, en “gelijk de slachting van Midian was aan de rots van Oreb”. Jesaja ziet “de snelle kemelen van Midian en Hefa” goud en wierook naar Sion brengen."
    - "Na Gideon verdwijnen de Midianieten uit het verslag; Assyrische en latere teksten spreken van Arabische stammen in hun plaats. Josephus kende nog een stad Midian aan de Rode Zee, waar Mozes toevlucht vond. Het land Midian is tegenwoordig de provincie Tabuk van Saoedi-Arabië, rond Tabuk, Qurayya en al-Bad', waar in de rots uitgehouwen graven uit de Nabatese tijd plaatselijk met Jethro in verband worden gebracht; sinds 2017 is de kust de plaats van het NEOM-project."
  cs:
    - "Midján byla země Midjánců, národa pastýřů, karavanních obchodníků a nájezdníků východně od Akabského zálivu, na severozápadě Arábie, ačkoli jejich tábory a obchod sahaly přes Sinaj a Negev až do Moábu a Gileadu. Genesis činí z Midjána syna Abrahamova s Keturou, odeslaného „k východu do země východní“. Malovaná keramika zvaná midjánská či Qurayya, z 13. až 11. století př. n. l., byla nalezena od Qurayyi v Hidžázu po Timnu v Arabě, kde midjánská svatyně následovala po egyptském chrámu Hathor. Ptolemaios jmenuje Modianu a Madiamu v severozápadní Arábii a Eusebius klade Madiam východně od Rudého moře; město se obvykle klade do al-Bad' v Saúdské Arábii."
    - "Midjánští kupci vytáhli Josefa z jámy a prodali ho do Egypta. Mojžíš, prchaje před faraonem, „bydlil v zemi Madianské“, oženil se se Siporou, dcerou „kněze Madianského“, Reuela čili Jitra, a pásl stádo, když přišel „k hoře Boží Oréb“. Po exodu Jitro navštívil Izrael u hory, přinesl oběť a poradil Mojžíšovi ustanovit soudce; Chóbab Midjánský byl požádán, aby lid vedl. Kde ležel Sinaj vzhledem k Midjánu, je sporné: většina jej klade na jih Sinajského poloostrova, někteří do samého Midjánu, protože Pavel říká: „Agar zajisté jest hora Sinai v Arabii“."
    - "V Moábu se starší midjánští připojili k Balakovi při najímání Bileáma a po hříchu u Peóru, kde byla zabita Kozbi, midjánská kněžna, vedl Mojžíš válku proti Midjánu a jeho pěti králům. Za soudců Midjánci s Amalekem a syny východu přitáhli „jako kobylky ve množství“ s nesčetnými velbloudy a obrali zemi, dokud je Gedeon s třemi sty muži nerozprášil a nepronásledoval za Jordán; proroci vzpomínají „jako za dnů Madianských“ a „jako porážku Madianských na skále Goréb“. Izajáš vidí, že „dromedáři Madianští a Efejští“ přinesou zlato a kadidlo na Sijón."
    - "Po Gedeonovi Midjánci z pramenů mizejí; asyrské a pozdější texty mluví místo nich o arabských kmenech. Josephus ještě znal město Midján u Rudého moře, kde Mojžíš našel útočiště. Země Midján je dnes provincie Tabúk v Saúdské Arábii, kolem Tabúku, Qurayyi a al-Bad', kde místní lidé spojují skalní hrobky z nabatejské doby s Jitrem; od roku 2017 je pobřeží místem rozvoje NEOM."
