# Overview article (ADR 0007). Mainstream facts only; the home of the Midianites in north-west Arabia is the usual view, and the position of Sinai in relation to Midian is given as disputed.
id: midian
place: acc6d8e
title:
  en: "Midian"
  ru: "Мадиам"
  uk: "Мадіам"
  es: "Madián"
  pt: "Midiã"
  de: "Midian"
  fr: "Madian"
