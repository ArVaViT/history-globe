# Overview article (ADR 0007). Mainstream facts only; this is the Aroer "before Rabbah" on the Ammonite border, not Aroer on the Arnon or Aroer in the Negev; the site is unknown and the doubt about a separate town is noted.
id: aroer-ammon
place: af74969
title:
  en: "Aroer near Rabbah"
  ru: "Ароер близ Раввы"
  uk: "Ароер біля Рабби"
  es: "Aroer cerca de Rabá"
  pt: "Aroer perto de Rabá"
  de: "Aroër bei Rabba"
  fr: "Aroër près de Rabba"
